id: PSA.112.10
reference: Psalms 112:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רָ֘שָׁ֤ע יִרְאֶ֨ה וְ/כָעָ֗ס שִׁנָּ֣י/ו יַחֲרֹ֣ק וְ/נָמָ֑ס תַּאֲוַ֖ת רְשָׁעִ֣ים תֹּאבֵֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/010.yaml
  text: The wicked man will see and be angry[a]; he will gnash his teeth and melt away; the desire of the wicked will perish.
translation:
  language: de
  text: Der Gottlose wird es sehen und zornig werden; mit den Zähnen wird er knirschen und dahinschmelzen. Das Begehren der Gottlosen wird vergehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָשָׁע
  choice: der Gottlose
  rationale: Das substantivierte Adjektiv steht im maskulinen Singular und bezeichnet hier repräsentativ den gottlosen Menschen. „Der Gottlose“ bewahrt Form, Prägnanz und den Gegensatz zum Gerechten im Psalm.
- source_word: יִרְאֶה
  choice: wird es sehen
  rationale: Das Qal-Imperfekt hat im poetischen Zusammenhang einen zukünftigen beziehungsweise resultativen Sinn. Das ergänzte „es“ verweist natürlich auf das zuvor geschilderte Wohlergehen und Ansehen des Gerechten.
- source_word: וְכָעָס
  choice: und zornig werden
  rationale: Das mit וְ angeschlossene Perfekt setzt die verbale Folge fort. „Zornig werden“ gibt die emotionale Reaktion im modernen Deutschen klar wieder.
- source_word: שִׁנָּיו יַחֲרֹק
  choice: mit den Zähnen wird er knirschen
  rationale: Die Formulierung erhält das konkrete hebräische Bild für Wut und vereitelte Erwartung; zugleich ist „mit den Zähnen knirschen“ im Deutschen idiomatisch.
- source_word: וְנָמָס
  choice: und dahinschmelzen
  rationale: Das Verb bezeichnet ein Schmelzen, Zergehen oder Schwinden. „Dahinschmelzen“ bewahrt die kräftige poetische Metapher, ohne sie erklärend aufzulösen.
- source_word: תַּאֲוַת
  choice: das Begehren
  rationale: Das Substantiv kann Wunsch, Verlangen oder Begehren bedeuten. „Begehren“ trägt hier die negative moralische Färbung und bezeichnet das erstrebte Ziel der Gottlosen.
- source_word: רְשָׁעִים
  choice: der Gottlosen
  rationale: Der Plural wird als substantiviertes Adjektiv wiedergegeben und bewahrt den kollektiven Bezug.
- source_word: תֹּאבֵד
  choice: wird vergehen
  rationale: Das Qal-Imperfekt stimmt mit dem femininen Singular תַּאֲוַת überein. „Vergehen“ drückt aus, dass das Begehren scheitert und keinen Bestand hat.
theological_decisions:
- issue: Repräsentativer maskuliner Singular רָשָׁע
  choice: der Gottlose
  alternative: ein gottloser Mensch / die Gottlosen
  rationale: Der Haupttext erhält den grammatischen Singular und die traditionelle, im Deutschen verständliche Gegenüberstellung von Gerechtem und Gottlosem. Die Form bezeichnet im Kontext einen Typus und behauptet nicht, Gottlosigkeit sei auf Männer beschränkt.
- issue: Bedeutung von וְנָמָס
  choice: dahinschmelzen
  alternative: dahinschwinden / sich auflösen
  rationale: 'Die Bildsprache bleibt bewusst offen: Gemeint sein kann ein inneres Zergehen vor Wut oder ein tatsächliches Schwinden. Eine eindeutige psychologische oder eschatologische Auslegung wird nicht in den Text eingetragen.'
- issue: Gegenstand von תַּאֲוַת רְשָׁעִים
  choice: das Begehren der Gottlosen
  alternative: der Wunsch der Gottlosen
  rationale: Die Wendung wird nicht näher bestimmt. So bleibt offen, ob sie allgemein ihre Ziele, ihre Hoffnung auf Erfolg oder ihren Wunsch gegen die Gerechten bezeichnet.
translation_notes:
  register: Poetisch, würdig und gegenwartsnah. Der Satzbau folgt der hebräischen Abfolge, bleibt aber im Deutschen flüssig. Die konkrete Bildsprache des Zähneknirschens und Dahinschmelzens wird erhalten.
