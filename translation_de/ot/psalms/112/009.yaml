id: PSA.112.9
reference: Psalms 112:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: פִּזַּ֤ר נָ֘תַ֤ן לָ/אֶבְיוֹנִ֗ים צִ֭דְקָת/וֹ עֹמֶ֣דֶת לָ/עַ֑ד קַ֝רְנ֗/וֹ תָּר֥וּם בְּ/כָבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/009.yaml
  text: He has distributed freely[a]; he has given to the poor. His righteousness stands forever[c][b]; his horn will be lifted up in honor.
translation:
  language: de
  text: Er teilt reichlich aus[a] und gibt den Armen. Seine Gerechtigkeit[b] bleibt für immer bestehen; sein Horn[c] wird sich in Ehre erheben[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Er streut aus“; gemeint ist hier das großzügige Austeilen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann sowohl Gerechtigkeit als auch rechtschaffenes oder gerechtes Handeln bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Das „Horn“ ist ein hebräisches Bild für Kraft, Würde oder einen erhöhten Rang.
    reason: cultural_note
  - marker: d
    text: 'Oder: „wird mit Ehre erhöht werden“ beziehungsweise „wird sich in Herrlichkeit erheben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּזַּר
  choice: teilt reichlich aus
  rationale: Das Verb bezeichnet wörtlich ein Ausstreuen oder weites Verteilen. Im Zusammenhang der Gabe an Arme gibt „reichlich austeilen“ den Sinn freigebiger Zuwendung natürlich wieder, ohne das Bild auf bloße Zerstreuung einzuengen.
- source_word: נָתַן
  choice: gibt
  rationale: Das schlichte „gibt“ bewahrt die poetische Fortführung und stellt die Freigebigkeit als kennzeichnendes Handeln des Gerechten dar.
- source_word: לָאֶבְיוֹנִים
  choice: den Armen
  rationale: אֶבְיוֹן bezeichnet Arme oder Bedürftige. „Den Armen“ ist knapp, verständlich und im Kontext passend.
- source_word: צִדְקָתוֹ
  choice: seine Gerechtigkeit
  rationale: צְדָקָה umfasst Gerechtigkeit, Rechtschaffenheit und hier auch deren Ausdruck in freigebigem Handeln. „Gerechtigkeit“ bewahrt diese moralisch-theologische Breite.
- source_word: עֹמֶדֶת לָעַד
  choice: bleibt für immer bestehen
  rationale: Die Verbindung aus Partizip und לָעַד drückt dauerhaften Bestand aus. Die deutsche Wendung ist natürlich und erhält das Bild des Bestehens.
- source_word: קַרְנוֹ
  choice: sein Horn
  rationale: Das Horn ist ein bewusstes hebräisches Bild für Kraft, Würde und erhöhten Rang. Es bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
- source_word: תָּרוּם
  choice: wird sich erheben
  rationale: Das Verb bezeichnet Hochsein oder Erhöhtwerden. Mit „Horn“ ergibt „wird sich erheben“ ein anschauliches, im Deutschen tragfähiges poetisches Bild, ohne festzulegen, ob der Akzent auf Aufstieg oder Erhöhung liegt.
- source_word: בְּכָבוֹד
  choice: in Ehre
  rationale: כָּבוֹד kann Ehre, Würde oder Herrlichkeit bezeichnen. In diesem Weisheitskontext bringt „in Ehre“ die öffentliche Würdigung des Gerechten klar zum Ausdruck; die weitere Möglichkeit „in Herrlichkeit“ wird vermerkt.
theological_decisions:
- issue: Bedeutung von „seine Gerechtigkeit“ im Verhältnis zum Geben an die Armen
  choice: Die Wendung bezeichnet die bleibende Gerechtigkeit beziehungsweise Rechtschaffenheit des freigebigen Menschen und schließt ihr konkretes Handeln ein.
  alternative: Sie könnte enger auf seine Wohltätigkeit oder stärker auf sein gerechtes Handeln bezogen werden.
  rationale: Der Vers verbindet Freigebigkeit unmittelbar mit צְדָקָה, ohne den Begriff ausdrücklich auf verdienstliche Heilserlangung, bloße Wohltätigkeit oder ausschließlich gesellschaftliche Gerechtigkeit zu beschränken.
- issue: Bild des erhobenen Horns
  choice: Das hebräische Bild wird beibehalten und als Ausdruck von Kraft, Würde oder erhöhtem Rang erläutert.
  alternative: Das Bild könnte deutend mit „seine Würde“ oder „seine Macht“ wiedergegeben werden.
  rationale: Die Beibehaltung wahrt die Bildsprache des Psalms und vermeidet eine unnötige Festlegung auf nur einen ihrer Bedeutungsaspekte.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzführung. Die beiden parallelen Verben des Gebens bleiben erhalten; das fremdere, aber zentrale Hornbild wird nicht geglättet, sondern durch eine Fußnote erschlossen.
