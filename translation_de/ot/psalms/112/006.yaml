base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/006.yaml
  text: For he will never be shaken[a]; the righteous will be remembered forever.
translation:
  language: de
  text: Denn er wird niemals wanken; der Gerechte wird für immer in Erinnerung bleiben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die vorausgehende Aussage; „Denn“ bewahrt diese Verknüpfung im Deutschen.
- source_word: לְעוֹלָם לֹא יִמּוֹט
  choice: er wird niemals wanken
  rationale: In Verbindung mit der Verneinung bezeichnet לְעוֹלָם dauerhafte Unerschütterlichkeit. „Niemals wanken“ gibt das Bild von Stabilität natürlich und prägnant wieder.
- source_word: לְזֵכֶר עוֹלָם
  choice: wird für immer in Erinnerung bleiben
  rationale: Die Wendung bezeichnet ein dauerhaftes Gedenken. Die verbale deutsche Formulierung ist verständlich und erhält den Gedanken bleibender Erinnerung.
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv steht im maskulinen Singular und bezeichnet hier repräsentativ einen gerechten Menschen. „Der Gerechte“ bewahrt Form und Weisheitsstil, ohne das im Hebräischen nicht ausdrücklich stehende Substantiv „Mann“ hinzuzufügen.
- source_word: יִהְיֶה
  choice: wird … bleiben
  rationale: Die Kopula verbindet den Gerechten mit dauerhaftem Gedenken; im natürlichen Deutschen wird dies idiomatisch durch „in Erinnerung bleiben“ ausgedrückt.
theological_decisions:
- issue: Repräsentativer maskuliner Singular in צַדִּיק
  choice: der Gerechte
  alternative: ein gerechter Mensch
  rationale: Der grammatische maskuline Singular bleibt sichtbar, während die Formulierung als allgemeine Weisheitsaussage verstanden werden kann. Eine Fußnote ist nicht nötig, da „der Gerechte“ im Deutschen ebenfalls idiomatisch repräsentativ gebraucht wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. Das Semikolon erhält die Zweigliedrigkeit des hebräischen Verses.
