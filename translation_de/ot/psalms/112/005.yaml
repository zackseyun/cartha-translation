  text: Good is the man who is gracious and lends[a]; he conducts his affairs with justice.
translation:
  language: de
  text: Gut steht es um den Mann, der gütig ist und leiht; er führt seine Geschäfte nach dem Recht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er ordnet seine Worte nach dem Recht.« Das hebräische Wort דְּבָרָיו kann »seine Angelegenheiten/Geschäfte« oder »seine Worte« bedeuten; im Zusammenhang mit dem Leihen und gerechten Handeln liegt »Geschäfte« näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Gut steht es um
  rationale: Das prädikativ vorangestellte Adjektiv beschreibt hier die gute Lage beziehungsweise das lobenswerte Ergehen des Mannes. Die Wendung gibt diesen weisheitlich-seligpreisenden Sinn im Deutschen natürlich wieder.
- source_word: אִישׁ
  choice: den Mann
  rationale: Der hebräische Text hat ein generisches maskulines Singularwort. »Den Mann« bewahrt diese grammatische Form, ohne die allgemeine Geltung auszuschließen.
- source_word: חוֹנֵן
  choice: gütig ist
  rationale: Das Partizip bezeichnet jemanden, der Gunst erweist beziehungsweise gnädig handelt. »Gütig« ist im Deutschen natürlich und lässt den Sinn weiter gefasst als bloße materielle Großzügigkeit.
- source_word: וּמַלְוֶה
  choice: und leiht
  rationale: Das Hifil-Partizip von לוה bezeichnet das Verleihen beziehungsweise Gewähren eines Darlehens. »Leiht« gibt die wirtschaftliche Handlung knapp und ohne Zusatz wieder.
- source_word: יְכַלְכֵּל
  choice: er führt
  rationale: In Verbindung mit דְּבָרָיו bezeichnet das Verb hier wahrscheinlich das Ordnen, Regeln oder Führen der eigenen Angelegenheiten. »Führt« ergibt mit »Geschäfte« eine natürliche deutsche Wendung.
- source_word: דְּבָרָיו
  choice: seine Geschäfte
  rationale: דבר kann »Wort«, »Sache« oder »Angelegenheit« bedeuten. Im Zusammenhang mit Leihen und gerechtem Handeln liegt »Geschäfte« nahe; die mögliche Bedeutung »Worte« bleibt in der Fußnote erhalten.
- source_word: בְּמִשְׁפָּט
  choice: nach dem Recht
  rationale: Die Wendung bewahrt den rechtlich-ethischen Gehalt von מִשְׁפָּט und klingt im Zusammenhang mit der Führung von Geschäften idiomatisch.
