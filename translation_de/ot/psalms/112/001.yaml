id: PSA.112.1
reference: Psalms 112:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ אַשְׁרֵי אִ֭ישׁ יָרֵ֣א אֶת יְהוָ֑ה בְּ֝/מִצְוֺתָ֗י/ו חָפֵ֥ץ מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/001.yaml
  text: Praise Yah! Blessed is the man who fears Yahweh[b][a], who greatly delights in his commandments.
translation:
  language: de
  text: Preist Jah![a] Glücklich ist der Mann[b], der Jahwe fürchtet und große Freude an seinen Geboten hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „Halleluja!“'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „der Mann“; die männliche Einzahl wird in diesem Weisheitsspruch allgemein und stellvertretend gebraucht.
    reason: cultural_note
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: Preist Jah!
  rationale: Der Pluralimperativ und die Kurzform des Gottesnamens werden transparent wiedergegeben. „Preist“ wahrt den gehobenen Psalmton; „Jah“ unterscheidet die Kurzform vom Tetragramm.
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die Weisheitsformel bezeichnet den beneidenswerten, gelingenden Stand eines Menschen. „Glücklich ist“ ist im heutigen Deutsch natürlich und meint mehr als ein vorübergehendes Gefühl.
- source_word: אִישׁ
  choice: der Mann
  rationale: Die grammatisch männliche Einzahl und die repräsentative Form des Weisheitsspruchs bleiben erhalten; eine Fußnote erläutert den allgemeinen Gebrauch.
- source_word: יָרֵא אֶת יְהוָה
  choice: der Jahwe fürchtet
  rationale: „Fürchtet“ bewahrt die Spannung zwischen Furcht, Ehrfurcht und treuer Gottesbeziehung, ohne sie auf bloßen Respekt zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben statt durch einen Titel ersetzt.
- source_word: בְּמִצְוֺתָיו
  choice: an seinen Geboten
  rationale: Bei „Freude haben“ gibt „an“ das Objekt im Deutschen idiomatisch wieder. „Gebote“ erhält das formale Gewicht des hebräischen Ausdrucks; „seinen“ bezieht sich auf Jahwe.
- source_word: חָפֵץ מְאֹד
  choice: große Freude … hat
  rationale: Die Wendung gibt sowohl das starke Gefallen als auch die Intensivierung durch מְאֹד in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt diesen als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Gottesfurcht in יָרֵא
  choice: fürchtet
  alternative: Ehrfurcht hat vor
  rationale: „Fürchtet“ erhält die genuine theologische Spannung des hebräischen Wortes zwischen Furcht und Ehrfurcht; die Alternative würde den Ausdruck interpretierend abschwächen.
- issue: Generisches maskulines אִישׁ
  choice: der Mann
  alternative: der Mensch
  rationale: Die männliche Singularform des repräsentativen Weisheitsspruchs wird sichtbar bewahrt. Die Fußnote stellt klar, dass die Aussage allgemein gebraucht ist.
translation_notes:
  register: Moderne, verständliche und zugleich würdige Psalmsprache. Die knappe Ausrufform am Anfang und die parallele Weisheitsaussage bleiben erhalten; „Jah“ und „Jahwe“ bilden die unterschiedlichen hebräischen Namensformen ab.
