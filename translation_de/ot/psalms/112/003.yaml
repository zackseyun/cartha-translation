id: PSA.112.3
reference: Psalms 112:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הוֹן וָ/עֹ֥שֶׁר בְּ/בֵית֑/וֹ וְ֝/צִדְקָת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/003.yaml
  text: Wealth and riches are in his house[a], and his righteousness stands forever.
translation:
  language: de
  text: Vermögen und Reichtum sind in seinem Haus, und seine Gerechtigkeit besteht für immer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹן
  choice: Vermögen
  rationale: הוֹן bezeichnet Besitz oder materiellen Wohlstand. »Vermögen« ist im heutigen Deutsch natürlich und bewahrt neben »Reichtum« die Zweigliedrigkeit der hebräischen Wortverbindung.
- source_word: וָעֹשֶׁר
  choice: und Reichtum
  rationale: עֹשֶׁר bezeichnet Reichtum oder Fülle. »Reichtum« ergänzt »Vermögen«, ohne beide hebräischen Substantive zusammenzuziehen.
- source_word: בְּבֵיתוֹ
  choice: sind in seinem Haus
  rationale: בַּיִת kann das Haus oder den Haushalt bezeichnen. »In seinem Haus« erhält das konkrete Bild und lässt den weiteren Sinn des häuslichen Lebensbereichs offen.
- source_word: וְצִדְקָתוֹ
  choice: und seine Gerechtigkeit
  rationale: צְדָקָה umfasst Gerechtigkeit, Rechtschaffenheit und gerechtes Handeln. Das deutsche »Gerechtigkeit« bewahrt diese Bedeutungsbreite besser als eine einseitige Festlegung.
- source_word: עֹמֶדֶת
  choice: besteht
  rationale: Das Partizip von עמד bezeichnet wörtlich ein Stehen und hier übertragen dauerhaften Bestand. »Besteht« gibt das Bild von Festigkeit in natürlichem Deutsch wieder.
- source_word: לָעַד
  choice: für immer
  rationale: לָעַד bezeichnet unbegrenzte Dauer. »Für immer« ist die klare und geläufige deutsche Entsprechung.
theological_decisions:
- issue: Bedeutung von »seine Gerechtigkeit« im Zusammenhang materiellen Segens
  choice: Die possessive Form bleibt unverändert auf den beschriebenen Gottesfürchtigen bezogen und bezeichnet seine fortdauernde Gerechtigkeit, ohne diese näher dogmatisch festzulegen.
  alternative: Die Wendung ausdrücklich als Freigebigkeit, als göttliche Rechtfertigung oder als zugerechnete Gerechtigkeit deuten.
  rationale: Im unmittelbaren Zusammenhang beschreibt Psalm 112 den gerechten Menschen. Zugleich kann צְדָקָה sowohl seine rechtschaffene Haltung als auch sein gerechtes beziehungsweise großzügiges Handeln umfassen. Die Übersetzung bewahrt diese Spannung und trägt keine spätere Lehrbestimmung ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzstruktur. »Vermögen und Reichtum« erhält die parallele Häufung des Hebräischen; »Gerechtigkeit« deckt im Deutschen die im Englischen durch »righteousness/justice« markierte Bedeutungsbreite ab, sodass keine Fußnote nötig ist.
