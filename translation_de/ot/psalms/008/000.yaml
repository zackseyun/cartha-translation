source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ עַֽל הַ/גִּתִּ֗ית מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/000.yaml
  text: For the choir director[a]; according to the Gittith[c][b]. A psalm of David.
translation:
  language: de
  text: Für den Chorleiter; nach der Gittit[a]. Ein Psalm Davids.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Gittit; wahrscheinlich ein musikalischer oder liturgischer Fachausdruck, vielleicht der Name einer Melodie oder eines Instruments.
    reason: cultural_note
  - marker: b
    text: 'Oder: „von David“ beziehungsweise „für David“. Die hebräische Form kann Autorschaft oder eine andere Zuordnung zu David bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Die Wendung bezeichnet in Psalmüberschriften wahrscheinlich den für die musikalische Aufführung Verantwortlichen. „Chorleiter“ ist im heutigen Deutsch klar und im liturgisch-musikalischen Zusammenhang natürlich.
- source_word: עַל
  choice: nach
  rationale: Vor einer vermutlich musikalischen Angabe bezeichnet עַל hier wahrscheinlich die Weise, das Instrument oder eine andere Aufführungsanweisung. „Nach“ lässt den genauen technischen Bezug offen.
- source_word: הַגִּתִּית
  choice: der Gittit
  rationale: Die genaue Bedeutung des hebräischen Fachworts ist ungewiss. Die lautnahe Wiedergabe vermeidet eine unbelegte Festlegung auf eine Melodie oder ein Instrument.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: „Psalm“ ist die übliche und treffende deutsche Bezeichnung für diese Gattungsangabe.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der deutsche Genitiv entspricht der knappen Zuordnungsformel und kann Besitz, Zugehörigkeit oder Urheberschaft ausdrücken, ohne das Verhältnis ausdrücklich auf Autorschaft zu verengen.
theological_decisions:
- issue: Das durch לְדָוִד bezeichnete Verhältnis zu David
  choice: Ein Psalm Davids
  alternative: Ein Psalm von David; ein Psalm für David
  rationale: Die hebräische Präposition kann Autorschaft, Zugehörigkeit, Widmung oder Zuordnung bezeichnen. Der Genitiv bewahrt diese Offenheit besser als eine eindeutigere Umschreibung.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Form einer Psalmüberschrift bleibt erhalten; das Semikolon verbindet die Aufführungsangaben, ohne sie mit der Gattungs- und Zuordnungsangabe zu vermischen.
