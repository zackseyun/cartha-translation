base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/009.yaml
  text: O Yahweh[a], our Lord[b], how majestic is your name in all the earth!
translation:
  language: de
  text: Jahwe, unser Herr, wie majestätisch ist dein Name auf der ganzen Erde!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen kennzeichnet den Gottesnamen JHWH und unterscheidet ihn vom unmittelbar folgenden Titel „Herr“; eine Fußnote macht den hebräischen Wortlaut transparent.
- source_word: אֲדֹנֵינוּ
  choice: unser Herr
  rationale: Der göttliche Titel bezeichnet Herrschaft und Autorität; „unser Herr“ ist im Deutschen natürlich und für die direkte Anrede angemessen.
- source_word: מָה
  choice: wie
  rationale: In der Ausrufekonstruktion gibt „wie“ die bewundernde Aussage idiomatisch wieder.
- source_word: אַדִּיר
  choice: majestätisch
  rationale: Das Wort bezeichnet hier erhabene Größe und Herrlichkeit; „majestätisch“ trifft diesen Sinn im kosmischen Zusammenhang besser als das mehrdeutige „mächtig“ oder „herrlich“.
- source_word: שִׁמְךָ
  choice: dein Name
  rationale: Die wörtliche Wendung bleibt erhalten und lässt offen, inwiefern der Name Gottes Ansehen, Ehre und offenbartes Wesen umfasst.
- source_word: בְּכָל הָאָרֶץ
  choice: auf der ganzen Erde
  rationale: הָאָרֶץ bezeichnet im Kontext die gesamte Erde; „auf der ganzen Erde“ ist natürliches modernes Deutsch und bewahrt die weltweite Aussage.
theological_decisions:
- issue: Wiedergabe der Folge יְהוָה אֲדֹנֵינוּ
  choice: HERR, unser Herr
  alternative: Jahwe, unser Herr
  rationale: Die Kapitälchenschreibung bewahrt die im Deutschen etablierte Kennzeichnung des Tetragramms, während die Fußnote den Gottesnamen ausdrücklich nennt. Zugleich bleibt der Unterschied zwischen Eigenname und Herrschaftstitel sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der poetische Ausruf und die Wiederholung von Gottesname und Herrschaftstitel bleiben erhalten.
