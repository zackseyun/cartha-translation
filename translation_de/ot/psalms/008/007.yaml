  text: sheep and oxen[a], all of them, and also the beasts of the field.
translation:
  language: de
  text: 'Schafe und Rinder, sie alle,

    und auch die Tiere des Feldes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹנֶה
  choice: Schafe
  rationale: Das Wort bezeichnet Kleinvieh, besonders Schafe und Ziegen. „Schafe“ ist hier eine natürliche, konkrete und poetisch passende Wiedergabe; „Kleinvieh“ wäre umfassender, aber fachsprachlicher.
- source_word: וַאֲלָפִים
  choice: und Rinder
  rationale: Der Ausdruck bezeichnet domestizierte Rinder. „Rinder“ gibt die Tiergruppe im heutigen Deutsch umfassender und natürlicher wieder als „Ochsen“.
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Die Form bedeutet ausdrücklich „sie alle“ beziehungsweise „alle von ihnen“ und betont die Gesamtheit der zuvor genannten Haustiere.
- source_word: וְגַם
  choice: und auch
  rationale: Die Verbindung erweitert die Aufzählung über die domestizierten Tiere hinaus und bewahrt den additiven Nachdruck.
- source_word: בַּהֲמוֹת
  choice: die Tiere
  rationale: In diesem Zusammenhang bezeichnet der Plural allgemein größere Tiere. Zusammen mit „des Feldes“ sind hier die Tiere der freien Landschaft im Gegensatz zum Vieh gemeint; „Tiere“ ist im modernen Deutsch klarer als „Getier“ oder „Bestien“.
- source_word: שָׂדָי
  choice: des Feldes
  rationale: Das Wort bezeichnet Feld beziehungsweise offene Landschaft. „Des Feldes“ bewahrt das knappe poetische Bild des Hebräischen und ist im Deutschen verständlich.
