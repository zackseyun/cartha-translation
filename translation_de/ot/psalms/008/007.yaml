  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Umfang des Hebräischen zuverlässig wieder: צֹנֶה als „Schafe“, אֲלָפִים als „Rinder“, כֻּלָּם mit der expliziten Gesamtbezeichnung „sie alle“ sowie die additive Erweiterung וְגַם. „die Tiere des Feldes“ wahrt für בַּהֲמוֹת שָׂדָי die allgemeine, poetische Bezeichnung und legt keine enger umstrittene Bedeutung fest.'
  naturalness: „Schafe und Rinder, sie alle, / und auch die Tiere des Feldes“ ist modernes, verständliches Deutsch und bewahrt den knappen poetischen Zeilenbau. Die Wiederaufnahme „sie alle“ ist leicht hervorgehoben, aber als Entsprechung der hebräischen pronominalen Form natürlich.
  terminology: Die Tierbegriffe sind sachgerecht und registerlich passend. „Rinder“ ist im heutigen Deutsch gegenüber „Ochsen“ die umfassendere Wiedergabe. „Tiere des Feldes“ ist neutraler und moderner als „Getier“ oder „Bestien“ und entspricht der offenen Bedeutung des hebräischen Ausdrucks. Die englische Alternative „cattle“ bestätigt die gewählte breite Wiedergabe von אֲלָפִים.
