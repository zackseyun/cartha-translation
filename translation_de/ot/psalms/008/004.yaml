id: PSA.8.4
reference: Psalms 8:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מָֽה אֱנ֥וֹשׁ כִּֽי תִזְכְּרֶ֑/נּוּ וּ/בֶן אָ֝דָ֗ם כִּ֣י תִפְקְדֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/004.yaml
  text: What is man that you remember him[c][b][a], and the son of man that you attend to him?
translation:
  language: de
  text: Was ist der Mensch[a], dass du an ihn denkst, und ein Menschenkind[b], dass du nach ihm siehst[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann besonders den hinfälligen, sterblichen Menschen bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich etwa „Sohn des Menschen“; hier eine poetische Bezeichnung für einen Menschen. In späteren biblischen Zusammenhängen kann die Wendung messianische Bedeutung erhalten.
    reason: cross_reference
  - marker: c
    text: 'Oder: „dich um ihn kümmerst“, „ihn besuchst“ oder „auf ihn achtest“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Was ist
  rationale: Leitet die rhetorische Frage nach der Bedeutung beziehungsweise Geringfügigkeit des Menschen ein und gibt den verblosen hebräischen Satz im Deutschen natürlich wieder.
- source_word: אֱנוֹשׁ
  choice: der Mensch
  rationale: Bezeichnet hier den einzelnen Menschen stellvertretend für die Menschheit und kann zugleich dessen Hinfälligkeit anklingen lassen.
- source_word: כִּי
  choice: dass
  rationale: Verbindet in beiden parallelen Satzteilen die rhetorische Hauptfrage idiomatisch mit dem Inhalt des göttlichen Handelns.
- source_word: תִזְכְּרֶנּוּ
  choice: du an ihn denkst
  rationale: Gibt זכר im Kontext natürlichen deutschen Sprachgebrauchs wieder; gemeint ist, dass Gott den Menschen in seinem bewussten Blick behält.
- source_word: וּבֶן־אָדָם
  choice: und ein Menschenkind
  rationale: Bewahrt die poetische Einzahl und die Vorstellung menschlicher Abstammung, klingt im Deutschen aber als allgemeine Bezeichnung für einen Menschen natürlicher als „Sohn des Menschen“.
- source_word: תִפְקְדֶנּוּ
  choice: du nach ihm siehst
  rationale: Gibt die kontextuelle Bedeutung von פקד als aufmerksames Zugewandtsein wieder, ohne sie vollständig auf Fürsorge, Besuch oder bloße Wahrnehmung festzulegen.
theological_decisions:
- issue: Repräsentative männliche Einzahl für die Menschheit
  choice: „der Mensch“ und „ein Menschenkind“ in der Einzahl
  alternative: „die Menschen“, „die Menschheit“ oder „die Sterblichen“
  rationale: Die Einzahl erhält den poetischen Parallelismus und die repräsentative Aussage des Hebräischen. Im Deutschen sind „Mensch“ und „Menschenkind“ hier allgemeinmenschlich und nicht auf Männer beschränkt.
- issue: Mögliche messianische Resonanz von בֶן־אָדָם
  choice: Im Haupttext allgemeinmenschlich als „Menschenkind“ wiedergeben
  alternative: „Menschensohn“ oder „Sohn des Menschen“
  rationale: Im unmittelbaren Zusammenhang bezeichnet die Wendung den Menschen als solchen. Spätere messianische beziehungsweise christologische Bezüge werden dadurch nicht bestritten, sollen aber nicht als alleinige Bedeutung in diesen Vers hineingetragen werden.
- issue: Bedeutungsbreite von פקד
  choice: „nach ihm siehst“
  alternative: „dich um ihn kümmerst“, „ihn besuchst“ oder „auf ihn achtest“
  rationale: Die Formulierung lässt sowohl aufmerksame Zuwendung als auch fürsorgliches Handeln anklingen und vermeidet eine unnötige Verengung des vieldeutigen Verbs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelstruktur. „Menschenkind“ ist allgemeinverständlich und erhält die menschliche Einzahl, ohne die Stelle im Haupttext vorschnell als Titel zu deuten. Die Formulierung „nach ihm siehst“ wahrt die Bedeutungsbreite des hebräischen Verbs.
