source:
  edition: WLC
  text: כִּֽי אֶרְאֶ֣ה שָׁ֭מֶי/ךָ מַעֲשֵׂ֣י אֶצְבְּעֹתֶ֑י/ךָ יָרֵ֥חַ וְ֝/כוֹכָבִ֗ים אֲשֶׁ֣ר כּוֹנָֽנְתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/003.yaml
  text: When I look at your heavens[a], the work of your fingers, the moon and the stars, which you have set in place—
translation:
  language: de
  text: Wenn ich deinen Himmel sehe, das Werk deiner Finger, den Mond und die Sterne, die du an ihren Platz gesetzt hast —[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn ich sehe deinen Himmel … den Mond und die Sterne, die du festgesetzt hast.“'
    reason: Kausale Lesart von כִּי; „festgesetzt hast“ gibt die alternative Bedeutung von כּוֹנָנְתָּה („etabliert, festgemacht“) wieder.
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Im poetischen Zusammenhang leitet כִּי den Umstand ein, der die anschließende Frage auslöst. „Wenn“ fügt sich im Deutschen natürlich in den Gedankengang ein; die kausale Möglichkeit bleibt als Fußnote erhalten.
- source_word: אֶרְאֶה
  choice: ich sehe
  rationale: ראה bezeichnet hier das betrachtende Wahrnehmen. „Ich sehe“ ist natürlich und würdevoll; „ich betrachte“ würde das an sich allgemeine Verb stärker auslegen.
- source_word: שָׁמֶיךָ
  choice: deinen Himmel
  rationale: Das deutsche Singularwort „Himmel“ ist die natürliche Entsprechung des hebräischen Plurals שָׁמַיִם und bewahrt hier den kosmischen Sinn.
- source_word: מַעֲשֵׂי אֶצְבְּעֹתֶיךָ
  choice: das Werk deiner Finger
  rationale: Die Formulierung gibt die Konstruktverbindung direkt wieder und bewahrt das anschauliche anthropomorphe Bild.
- source_word: יָרֵחַ וְכוֹכָבִים
  choice: den Mond und die Sterne
  rationale: Die bestimmten Artikel sind im Deutschen idiomatisch, da konkrete Himmelskörper im Blick stehen.
- source_word: אֲשֶׁר כּוֹנָנְתָּה
  choice: die du an ihren Platz gesetzt hast
  rationale: כון im Polel bezeichnet Festmachen, Aufstellen oder Beständigmachen. Die Wendung vermittelt hier verständlich sowohl Anordnung als auch feste Platzierung.
theological_decisions:
- issue: Anthropomorphe Sprache für Gottes Schöpfungshandeln
  choice: „deiner Finger“ wörtlich beibehalten
  alternative: „dein Handwerk“ oder „was du geschaffen hast“
  rationale: Das hebräische Bild stellt Gottes unmittelbares und müheloses Schöpfungshandeln poetisch dar. Es wird bewahrt, ohne daraus eine Aussage über eine körperliche Gestalt Gottes abzuleiten.
translation_notes:
  register: Moderne, würdige Psalmsprache mit natürlichem deutschem Satzbau. Der Gedankenstrich hält den Vers bewusst für die anschließende Frage in Vers 4 offen. Keine Fußnote wurde gesetzt, da „Denn ich sehe“ zwar grammatisch möglich ist, hier aber keine für die Veröffentlichung notwendige Bedeutungsalternative darstellt.
