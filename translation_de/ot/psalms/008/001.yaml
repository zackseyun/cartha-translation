  text: יְהוָ֤ה אֲדֹנֵ֗י/נוּ מָֽה אַדִּ֣יר שִׁ֭מְ/ךָ בְּ/כָל הָ/אָ֑רֶץ אֲשֶׁ֥ר תְּנָ֥/ה ה֝וֹדְ/ךָ֗ עַל הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/001.yaml
  text: O Yahweh[a], our Lord[c][b], how majestic is your name in all the earth—you have set your splendor above the heavens.
translation:
  language: de
  text: 'Jahwe[a], unser Herr,

    wie erhaben ist dein Name auf der ganzen Erde!

    Du hast deinen Glanz über die Himmel gesetzt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Die masoretische Verbform wird als Imperativ gelesen: „Setze deinen Glanz über die Himmel!“ Die Aussage „Du hast … gesetzt“ folgt einer anderen Deutung der schwierigen Verbform.'
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Umschrift gibt den Gottesnamen JHWH als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֲדֹנֵינוּ
  choice: unser Herr
  rationale: Der Titel אֲדוֹן mit dem Suffix der 1. Person Plural bezeichnet Gott in direkter Anrede; „unser Herr“ ist im Deutschen natürlich und dem feierlichen Kontext angemessen.
- source_word: מָה אַדִּיר
  choice: wie erhaben
  rationale: מָה ist hier ausrufend gebraucht, und אַדִּיר bezeichnet Größe, Macht und Majestät. „Wie erhaben“ bewahrt den staunenden, poetischen Ton.
- source_word: שִׁמְךָ
  choice: dein Name
  rationale: Die konkrete hebräische Redeweise bleibt erhalten; der Name steht zugleich für Gottes offenbare Würde und seinen Ruf, ohne dass dies paraphrasiert wird.
- source_word: בְּכָל הָאָרֶץ
  choice: auf der ganzen Erde
  rationale: „Erde“ entspricht dem kosmischen Zusammenhang mit den Himmeln; „Land“ würde die Aussage unnötig verengen.
- source_word: אֲשֶׁר
  choice: asyndetischer Anschluss
  rationale: Die schwerfällige wörtliche Wiedergabe durch ein deutsches Relativpronomen wird vermieden. Der Zeilenwechsel stellt den engen poetischen Anschluss an den vorausgehenden Lobpreis her.
- source_word: תְּנָה
  choice: du hast … gesetzt
  rationale: Im Zusammenhang wird die Form als Aussage über Gottes erhöhten Glanz wiedergegeben. Da die masoretische Form auch als Imperativ gelesen werden kann, wird diese echte grammatische Spannung in Fußnote [b] offengelegt.
- source_word: הוֹדְךָ
  choice: deinen Glanz
  rationale: הוֹד bezeichnet sichtbare Hoheit, Pracht oder Herrlichkeit. „Glanz“ ist poetisch, verständlich und vermeidet eine unnötige Wiederholung von „erhaben“.
- source_word: עַל הַשָּׁמָיִם
  choice: über die Himmel
  rationale: „Über“ gibt die räumliche Erhöhung durch עַל wieder; der Plural „die Himmel“ bewahrt die Form und das kosmische Bild des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen JHWH. Die Umschrift „Jahwe“ wahrt seinen Charakter als Eigenname; die traditionelle Ersatzlesung wird in der Fußnote genannt.
- issue: Aussage oder Aufforderung in תְּנָה
  choice: Du hast deinen Glanz über die Himmel gesetzt.
  alternative: Setze deinen Glanz über die Himmel!
  rationale: Der Satz wird im Haupttext entsprechend dem unmittelbaren Lobkontext als Aussage verstanden. Die auffällige masoretische Verbform lässt jedoch eine imperative Deutung zu, die nicht stillschweigend beseitigt, sondern in Fußnote [b] bewahrt wird.
translation_notes:
  register: Moderne, feierliche Psalmsprache mit klarer Zeilengliederung. Die Anrede bleibt unmittelbar und würdevoll; ungebräuchliche Archaismen werden vermieden. „Die Himmel“ bewahrt bewusst das kosmische Bild und den hebräischen Plural.
