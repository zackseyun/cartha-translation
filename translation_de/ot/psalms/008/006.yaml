  text: תַּ֭מְשִׁילֵ/הוּ בְּ/מַעֲשֵׂ֣י יָדֶ֑י/ךָ כֹּ֝ל שַׁ֣תָּה תַֽחַת רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/006.yaml
  text: You made him rule over the works of your hands[b][a]; you put everything under his feet.
translation:
  language: de
  text: Du hast ihn über die Werke deiner Hände herrschen lassen[a][b]; alles hast du unter seine Füße gelegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast ihm Herrschaft über die Werke deiner Hände gegeben.“'
    reason: lexical_alternative
  - marker: b
    text: Die männlichen Singularformen „ihn“ und „seine“ führen die Ausdrucksweise des vorhergehenden Verses fort; nach dem hebräischen Wortlaut steht dieser einzelne Mensch hier stellvertretend für die Menschheit.
    reason: cultural_note
lexical_decisions:
- source_word: תַּמְשִׁילֵהוּ
  choice: Du hast ihn … herrschen lassen
  rationale: Der Hifil von משל bezeichnet, dass jemand zum Herrschen gebracht beziehungsweise mit Herrschaft betraut wird. „Herrschen lassen“ bewahrt die kausative Verbform und klingt im modernen Deutschen natürlich.
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: über die Werke deiner Hände
  rationale: Die Präposition bezeichnet hier den Bereich beziehungsweise Gegenstand der Herrschaft. Die konkrete bildhafte Rede von Gottes Händen bleibt erhalten.
- source_word: כֹּל
  choice: alles
  rationale: Das absolut gebrauchte כֹּל fasst im Zusammenhang die geschaffenen Dinge umfassend zusammen; „alles“ gibt diesen Gesamtbezug knapp und idiomatisch wieder.
- source_word: שַׁתָּה
  choice: hast du … gelegt
  rationale: Das Verb שׁית bedeutet „setzen, stellen, legen“. „Legen“ verbindet sich im Deutschen natürlich mit „unter seine Füße“ und erhält das konkrete Bild.
- source_word: תַחַת רַגְלָיו
  choice: unter seine Füße
  rationale: Die wörtliche Wendung bezeichnet zugleich Unterordnung und Herrschaft. Die bildhafte und theologisch offene Formulierung bleibt erhalten.
theological_decisions:
- issue: Repräsentatives Maskulinum für die Menschheit in Psalm 8
  choice: Die männlichen Singularformen „ihn“ und „seine“ bleiben erhalten.
  alternative: Pluralische oder geschlechtsneutrale Wiedergabe, etwa „sie“ und „ihre Füße“.
  rationale: Der hebräische Text setzt die männlichen Singularformen des vorhergehenden Verses fort und spricht dabei repräsentativ vom Menschen. Eine Fußnote erläutert den umfassenden Bezug, ohne die Grammatik einzuebnen.
- issue: Aussage über die dem Menschen übertragene Herrschaft
  choice: „über … herrschen lassen“
  alternative: „Herrschaft geben über“ oder „zum Herrscher machen über“
  rationale: Die gewählte Fassung bewahrt den kausativen Sinn von משל, ohne über die Aussage des hebräischen Verbs hinaus eine besondere Herrschaftslehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus bleibt durch die beiden Hauptsätze erhalten; die konkrete Bildsprache von Gottes Händen und den Füßen des Menschen wird nicht aufgelöst.
