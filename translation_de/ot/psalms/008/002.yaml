  text: מִ/פִּ֤י עֽוֹלְלִ֨ים וְֽ/יֹנְקִים֮ יִסַּ֪דְתָּ֫ עֹ֥ז לְמַ֥עַן צוֹרְרֶ֑י/ךָ לְ/הַשְׁבִּ֥ית א֝וֹיֵ֗ב וּ/מִתְנַקֵּֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/002.yaml
  text: From the mouths of infants and nursing babies you have established strength because of your foes[a], to silence the enemy and the avenger.
translation:
  language: de
  text: Aus dem Mund kleiner Kinder und Säuglinge hast du Stärke fest gegründet[a], um deiner Bedränger willen, um Feind und Rächer zum Schweigen zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach der griechischen Übersetzungstradition, die sich in Matthäus 21,16 widerspiegelt: „Lob bereitet“; im hebräischen Text steht „Stärke“.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִפִּי
  choice: Aus dem Mund von
  rationale: Die hebräische Verbindung מן + פה bedeutet idiomatisch „aus dem Mund von“. Der Singular bleibt im Deutschen bei einer zusammengefassten Personengruppe natürlich.
- source_word: עוֹלְלִים
  choice: kleinen Kindern
  rationale: Das Wort bezeichnet sehr junge Kinder; „kleine Kinder“ ist gegenwärtig und verständlich, ohne den Begriff unnötig auf Neugeborene einzuengen.
- source_word: יֹנְקִים
  choice: Säuglingen
  rationale: Das substantivierte Partizip bezeichnet Kinder, die noch gestillt werden. „Säuglinge“ gibt dies knapp und natürlich wieder.
- source_word: יִסַּדְתָּ
  choice: hast du … gegründet
  rationale: יסד bedeutet grundlegend „gründen, fest begründen“. Die konkrete Metapher wird bewahrt, auch wenn die Verbindung mit „Stärke“ im Deutschen ungewöhnlich bleibt.
- source_word: עֹז
  choice: Stärke
  rationale: Der masoretische hebräische Text lautet eindeutig „Stärke/Macht“. Die griechische Überlieferung „Lob“ wird nicht in den Haupttext übernommen, sondern in einer Fußnote dokumentiert.
- source_word: לְמַעַן
  choice: um … willen
  rationale: Die Wendung kann Zweck oder Beweggrund ausdrücken. „Um deiner Bedränger willen“ bewahrt diese Offenheit besser als eine rein kausale Wiedergabe.
- source_word: צוֹרְרֶיךָ
  choice: deiner Bedränger
  rationale: Das Wort bezeichnet feindlich bedrängende Gegner. „Bedränger“ unterscheidet es vom folgenden אוֹיֵב und hält die parallelen Ausdrücke erkennbar.
- source_word: לְהַשְׁבִּית
  choice: zum Schweigen zu bringen
  rationale: Das Hifil bedeutet „aufhören lassen, beseitigen“. Im Zusammenhang mit dem, was aus dem Mund kommt, ist „zum Schweigen bringen“ eine natürliche kontextuelle Wiedergabe.
- source_word: אוֹיֵב
  choice: Feind
  rationale: Der Singular bezeichnet hier einen typischen beziehungsweise kollektiv verstandenen Gegner. Ohne Artikel klingt die feste Paarung im Deutschen prägnant.
- source_word: מִתְנַקֵּם
  choice: Rächer
  rationale: Das Partizip bezeichnet jemanden, der Rache übt oder sucht. „Rächer“ ist knapp und wahrt die aktive Bedeutung.
theological_decisions:
- issue: Hebräisches עֹז gegenüber „Lob“ in der Septuaginta und in Matthäus 21,16
  choice: Im Haupttext steht „Stärke“.
  alternative: „Lob“ entsprechend der griechischen Übersetzungstradition, die sich in Matthäus 21,16 widerspiegelt.
  rationale: Die Übersetzung folgt vorrangig dem vorliegenden hebräischen Text, ohne die intertextuell bedeutsame griechische Tradition zu verschweigen.
- issue: Bedeutungsbezug von לְמַעַן
  choice: „um deiner Bedränger willen“
  alternative: „wegen deiner Bedränger“ oder final „deinen Bedrängern zum Trotz“
  rationale: Die hebräische Präposition kann Beweggrund und Zweck berühren. Die gewählte Formulierung erhält diese Spannung, statt eine einzelne Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Metapher „Stärke gegründet“ wurde wegen ihrer Nähe zum Hebräischen beibehalten; die Syntax bleibt dennoch gut verständlich.
