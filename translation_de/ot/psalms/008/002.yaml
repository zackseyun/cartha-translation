    rationale: Die Anmerkung sollte den textlichen Gegensatz präzise als griechisch „Lob bereitet“ gegenüber hebräisch „Stärke“ kennzeichnen. Die jeweils gewählte deutsche Verbform ist keine eigenständige Lesart des Hebräischen.
