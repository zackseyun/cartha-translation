  source_fidelity: 'Der Entwurf gibt die hebräischen Kernelemente zuverlässig wieder: die Kinder- und Säuglingsgruppe, Gottes vollendetes Handeln, עֹז als „Stärke“, den Bezug auf die Bedränger sowie das Verstummen von Feind und Rächer. Die Fußnote wahrt zutreffend die vom hebräischen Wortlaut abweichende griechische Tradition. Die Verbindung „Stärke gegründet“ ist jedoch im heutigen Deutsch unnötig sperrig und kann wie eine begriffliche Begründung wirken.'
  naturalness: „Aus dem Mund von kleinen Kindern und Säuglingen“ ist verständlich, aber „Aus dem Mund kleiner Kinder und Säuglinge“ ist knapper und idiomatischer. „Stärke fest gegründet“ bewahrt die Gründungsmetapher von יסד und macht die Aussage im Deutschen deutlich natürlicher. Der doppelte Zweck-/Grundausdruck mit „um“ bleibt wegen der bewusst offenen Wiedergabe von לְמַעַן vertretbar.
  terminology: „Stärke“ entspricht עֹז besser als die traditionsgeschichtlich wichtige, aber sekundäre Lesart „Lob“. „Bedränger“, „Feind“ und „Rächer“ sind angemessene, registergerechte Wiedergaben der drei gegnerischen Bezeichnungen. Die Fußnote sollte klar sagen, dass „Lob bereitet“ die griechische Lesart ist, während der hebräische Text „Stärke“ hat; sie sollte nicht den Eindruck erwecken, die deutsche Formulierung „Stärke gegründet“ sei selbst hebräischer Wortlaut.
