source:
  edition: WLC
  text: וַ/תְּחַסְּרֵ֣/הוּ מְּ֭עַט מֵ/אֱלֹהִ֑ים וְ/כָב֖וֹד וְ/הָדָ֣ר תְּעַטְּרֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/005.yaml
  text: Yet you made him a little lower than God[a], and crowned him with glory and honor.
translation:
  language: de
  text: Du hast ihn nur wenig geringer gemacht als Gott[a] und ihn mit Herrlichkeit und Ehre gekrönt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als die himmlischen Wesen“. Die Septuaginta hat „als die Engel“; diese Wiedergabe findet sich auch in Hebräer 2,7.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּחַסְּרֵהוּ
  choice: du hast ihn … geringer gemacht
  rationale: Der Hifil von חסר mit Personenobjekt bezeichnet hier, jemanden in einen niedrigeren Rang zu versetzen; zusammen mit der מן-Vergleichsphrase ist „geringer gemacht“ im Deutschen idiomatisch und sachlich genau.
- source_word: מְּעַט
  choice: nur wenig
  rationale: Im hebräischen Zusammenhang bezeichnet מְעַט am natürlichsten einen geringen Grad, nicht eine kurze Dauer. „Nur wenig“ hebt den kleinen Rangunterschied hervor.
- source_word: מֵאֱלֹהִים
  choice: als Gott
  rationale: אֱלֹהִים bezeichnet hier nach dem unmittelbar naheliegenden Verständnis des hebräischen Textes Gott. Die möglichen Bedeutungen „himmlische Wesen“ und die griechische Wiedergabe „Engel“ werden wegen ihrer Auslegungsgeschichte in der Fußnote bewahrt.
- source_word: וְכָבוֹד
  choice: Herrlichkeit
  rationale: כָּבוֹד kann Ehre, Würde oder Herrlichkeit bezeichnen. „Herrlichkeit“ bewahrt den erhabenen poetischen Ton und bildet mit הָדָר ein natürliches Wortpaar.
- source_word: וְהָדָר
  choice: Ehre
  rationale: הָדָר bezeichnet Pracht, Majestät oder Ehre. „Ehre“ bringt hier die dem Menschen verliehene Würde zum Ausdruck und vermeidet eine unnötige Bedeutungsüberschneidung mit „Herrlichkeit“.
- source_word: תְּעַטְּרֵהוּ
  choice: ihn … gekrönt
  rationale: Der Piel von עטר bedeutet häufig „krönen“ oder „umgeben“. „Gekrönt“ gibt das königliche Bild und die Verbindung mit Herrlichkeit und Ehre treffend wieder.
theological_decisions:
- issue: Bezug und repräsentative Bedeutung des männlichen Singularpronomens
  choice: Den Singular „ihn“ beibehalten
  alternative: „sie“ oder „den Menschen“
  rationale: Der hebräische Text verwendet männliche Singularformen und knüpft an „Mensch“ beziehungsweise „Menschensohn“ im vorherigen Vers an. Der Singular bleibt erhalten, ohne seine repräsentative Bedeutung für die Menschheit einzuengen.
- issue: Wiedergabe von אֱלֹהִים
  choice: „Gott“ im Haupttext
  alternative: „himmlische Wesen“ oder „Engel“
  rationale: Die unmittelbare hebräische Lesart erlaubt und begünstigt hier „Gott“. Die Septuaginta gibt den Ausdruck mit „Engel“ wieder, wie auch Hebräer 2,7 zitiert; diese bedeutende Alternative wird in einer Fußnote genannt, aber nicht in den hebräischen Ausgangstext eingetragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit gehobenem, aber natürlichem poetischem Ton. Die Wortstellung bewahrt den Parallelismus; „nur wenig geringer“ ist idiomatisch und hält die Gradangabe des Hebräischen fest.
