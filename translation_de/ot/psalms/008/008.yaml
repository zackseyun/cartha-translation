translation:
  language: de
  text: die Vögel des Himmels und die Fische des Meeres, alles, was die Pfade der Meere durchzieht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und was die Pfade der Meere durchzieht«. Das hebräische Partizip steht im Singular und kann kollektiv das Leben im Meer zusammenfassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִפּוֹר
  choice: die Vögel
  rationale: Das morphologisch singularische Substantiv wird in der Aufzählung kollektiv gebraucht. Der deutsche Plural gibt diesen Sammelsinn natürlich wieder.
- source_word: שָׁמַיִם
  choice: des Himmels
  rationale: Im Deutschen bezeichnet der idiomatische Singular »Himmel« hier den Luftraum, in dem die Vögel leben, und bewahrt zugleich den gehobenen poetischen Ton.
- source_word: וּ/דְגֵי הַ/יָּם
  choice: und die Fische des Meeres
  rationale: Die Konstruktverbindung wird unmittelbar und idiomatisch wiedergegeben; »Fische« trägt den kollektiven Sinn.
- source_word: עֹבֵר
  choice: alles, was … durchzieht
  rationale: Das singularische Partizip kann kollektiv und zusammenfassend verstanden werden. »Alles, was« bewahrt den Singular der Konstruktion und bezieht die Formulierung zugleich breit auf die Lebewesen im Meer.
- source_word: אָרְחוֹת
  choice: die Pfade
  rationale: »Pfade« erhält das poetische Bild von Wegen oder Bahnen im Meer.
- source_word: יַמִּים
  choice: der Meere
  rationale: Der deutsche Plural bildet den hebräischen Plural ab und bewahrt die poetische Weite der Aussage.
