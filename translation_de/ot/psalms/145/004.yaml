  text: דּ֣וֹר לְ֭/דוֹר יְשַׁבַּ֣ח מַעֲשֶׂ֑י/ךָ וּ/גְב֖וּרֹתֶ֣י/ךָ יַגִּֽידוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/004.yaml
  text: Generation to generation will praise your works[b][a], and will declare your mighty acts.
translation:
  language: de
  text: Eine Generation preist der nächsten deine Werke[a] und verkündet deine Machttaten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Von Generation zu Generation preist man deine Werke.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deine machtvollen Taten“ oder „deine Krafttaten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר לְדוֹר
  choice: Eine Generation … der nächsten
  rationale: Die idiomatische Wiedergabe bewahrt die Weitergabe von Generation zu Generation und klingt im modernen Deutschen natürlich; das לְ bezeichnet hier die Beziehung zur jeweils folgenden Generation.
- source_word: יְשַׁבַּח
  choice: preist
  rationale: Das Piel von שׁבח bezeichnet anerkennendes, rühmendes Preisen. Das Präsens eignet sich im Deutschen für die allgemeingültige Aussage des hebräischen Imperfekts.
- source_word: מַעֲשֶׂיךָ
  choice: deine Werke
  rationale: מַעֲשֶׂה bezeichnet Taten oder Werke. „Werke“ erhält die substantivische und poetische Ausdrucksweise.
- source_word: וּגְבוּרֹתֶיךָ
  choice: deine Machttaten
  rationale: גְּבוּרוֹת meint machtvolle Taten beziehungsweise Erweise von Stärke. „Machttaten“ ist knapp, würdevoll und unterscheidet den Ausdruck von „Werke“.
- source_word: יַגִּידוּ
  choice: verkündet
  rationale: Das Hiphil von נגד bedeutet bekannt machen, berichten oder verkünden. „Verkündet“ entspricht dem gehobenen poetischen Register und bildet einen passenden Parallelismus zu „preist“.
