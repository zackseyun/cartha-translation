base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/016.yaml
  text: You open your hand and satisfy the desire of every living thing[a].
translation:
  language: de
  text: Du öffnest deine Hand und erfüllst jedem Lebewesen sein Verlangen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du sättigst jedes Lebewesen mit Gunst“ bzw. „mit Wohlgefallen“. Das hebräische Wort kann „Verlangen“, „Gunst“ oder „Wohlgefallen“ bedeuten; im Zusammenhang der Versorgung aller Geschöpfe passt „Verlangen“ am besten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוֹתֵחַ
  choice: öffnest
  rationale: Das Qal-Partizip beschreibt Gottes fortdauerndes, charakteristisches Handeln; das deutsche Präsens gibt dies natürlich wieder.
- source_word: יָדֶךָ
  choice: deine Hand
  rationale: Das konkrete poetische Bild wird beibehalten und ist im Deutschen klar und idiomatisch.
- source_word: וּמַשְׂבִּיעַ
  choice: und sättigst
  rationale: Der Hifil-Stamm von שׂבע bezeichnet das Bewirken von Sättigung oder Genüge; „sättigst“ wahrt den kausativen Sinn und passt zum Kontext der Versorgung aller Lebewesen.
- source_word: לְכָל חַי
  choice: alles, was lebt
  rationale: Das substantivisch gebrauchte חַי umfasst die Gesamtheit des belebten Lebens; die Formulierung ist weit, verständlich und natürlich.
- source_word: רָצוֹן
  choice: nach seinem Verlangen
  rationale: רָצוֹן kann Verlangen, Wohlgefallen oder Gunst bezeichnen. Im Zusammenhang mit Gottes Versorgung passt „Verlangen“ am besten; „nach seinem“ macht die Zuordnung zu jedem Lebewesen im Deutschen verständlich, ohne die lexikalische Mehrdeutigkeit zu verbergen.
theological_decisions:
- issue: Anthropomorphe Darstellung Gottes
  choice: Das Bild „deine Hand“ wird wörtlich beibehalten.
  alternative: Du versorgst großzügig
  rationale: Der hebräische Text schildert Gottes erhaltende Fürsorge durch ein konkretes poetisches Bild. Eine abstrakte Umschreibung würde dessen Kraft mindern.
- issue: Bezug und Bedeutung von רָצוֹן
  choice: Das Verlangen der Lebewesen wird als Hauptlesart wiedergegeben.
  alternative: Du sättigst alles, was lebt, mit Wohlgefallen beziehungsweise Gunst.
  rationale: Der Versorgungskontext legt das Bedürfnis oder Verlangen der Geschöpfe nahe, doch die mögliche Bedeutung „Wohlgefallen/Gunst“ bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildsprache. „Alles, was lebt“ ist inklusiv und natürlich; „nach seinem Verlangen“ hält den Versorgungssinn fest, während die Fußnote die echte lexikalische Mehrdeutigkeit dokumentiert.
