source:
  edition: WLC
  text: בְּ/כָל י֥וֹם אֲבָרֲכֶ֑/ךָּ וַ/אֲהַלְלָ֥ה שִׁ֝מְ/ךָ֗ לְ/עוֹלָ֥ם וָ/עֶֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/002.yaml
  text: Every day I will bless you[b][a], and I will praise your name forever and ever.
translation:
  language: de
  text: Jeden Tag[a] will ich dich segnen und deinen Namen[b] loben, für immer und ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tag für Tag“.'
    reason: lexical_alternative
  - marker: b
    text: Gottes „Name“ bezeichnet in der Bibel auch seine offenbarte Person, seinen Charakter und sein Ansehen.
    reason: cultural_note
lexical_decisions:
- source_word: בְּכָל־יוֹם
  choice: Jeden Tag
  rationale: Die Wendung bezeichnet eine täglich wiederkehrende Handlung. „Jeden Tag“ ist im modernen Deutschen natürlich und gibt den distributiven Sinn präzise wieder.
- source_word: אֲבָרֲכֶךָּ
  choice: will ich dich segnen
  rationale: Das Piel von ברך bedeutet hier „segnen“. Obwohl man im heutigen Deutschen meist davon spricht, Gott zu loben, bewahrt „segnen“ die besondere Ausdrucksweise des Hebräischen und unterscheidet das Verb vom folgenden הלל.
- source_word: וַאֲהַלְלָה
  choice: und … loben
  rationale: Das Piel von הלל bedeutet „loben, preisen“. Zusammen mit der vorausgehenden Verbform drückt die Form hier den festen, auf die Zukunft gerichteten Entschluss des Sprechers aus.
- source_word: שִׁמְךָ
  choice: deinen Namen
  rationale: Die konkrete Rede vom „Namen“ bleibt erhalten. Im biblischen Sprachgebrauch steht Gottes Name zugleich für seine offenbarte Person, seinen Charakter und sein Ansehen.
- source_word: לְעוֹלָם וָעֶד
  choice: für immer und ewig
  rationale: Die feste Wortverbindung verstärkt die Vorstellung unbegrenzter Dauer. „Für immer und ewig“ ist eine natürliche deutsche Entsprechung, die diese Steigerung wahrt.
theological_decisions:
- issue: Direkte Anrede Gottes ohne ergänzten Titel
  choice: dich
  alternative: dich, Gott; dich, mein Gott und König
  rationale: Der hebräische Text dieses Verses enthält nur das Suffix der zweiten Person und wiederholt keinen Gottestitel. Daher wird kein Titel aus dem vorherigen Vers ergänzt.
- issue: Wiedergabe der Rede von Gottes Namen
  choice: deinen Namen
  alternative: dich; deinen Ruhm
  rationale: „Name“ ist eine theologisch gehaltvolle biblische Ausdrucksweise. Die wörtliche Formulierung bewahrt diese Bedeutungsspannweite, statt sie auf eine einzelne Deutung zu verengen.
- issue: Gott „segnen“
  choice: dich segnen
  alternative: dich preisen; dich loben
  rationale: Das hebräische Verb ברך wird auch dann gebraucht, wenn ein Mensch Gott anerkennend und preisend „segnet“. Die Übersetzung bewahrt diese ungewohnte, aber echte Aussage und glättet sie nicht zu demselben Verb wie das parallele הלל.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelität. „Segnen“ wurde trotz seiner im Deutschen ungewohnten Richtung auf Gott beibehalten, um die beiden hebräischen Verben nicht unterschiedslos mit „loben/preisen“ wiederzugeben.
