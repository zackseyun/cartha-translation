  text: גָּ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד וְ֝/לִ/גְדֻלָּת֗/וֹ אֵ֣ין חֵֽקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/003.yaml
  text: Great is Yahweh[a], and greatly to be praised, and his greatness is unsearchable.
translation:
  language: de
  text: Groß ist Jahwe und überaus zu loben; seine Größe ist unerforschlich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und für seine Größe gibt es kein Ergründen.“'
    reason: Die Fußnote bewahrt die hebräische Existenzkonstruktion und die konkrete Bedeutung von חֵקֶר hinter der idiomatischen Übersetzung „unerforschlich“.
lexical_decisions:
- source_word: גָּדוֹל
  choice: Groß
  rationale: Das vorangestellte prädikative Adjektiv wird direkt wiedergegeben und bewahrt sowohl den Gedanken der Erhabenheit als auch den der Größe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: מְהֻלָּל מְאֹד
  choice: überaus lobenswert
  rationale: Das passive Partizip mit dem verstärkenden Adverb bezeichnet Jahwe als in höchstem Maß des Lobes würdig. Die Formulierung ist im heutigen Deutsch natürlicher als „sehr zu loben“.
- source_word: לִגְדֻלָּתוֹ
  choice: seine Größe
  rationale: Die Präposition ל gehört zur hebräischen Existenzkonstruktion; im Deutschen lässt sich die Aussage idiomatisch als Subjektsatz mit „seine Größe“ ausdrücken.
- source_word: אֵין חֵקֶר
  choice: ist unerforschlich
  rationale: Die Wendung besagt wörtlich, dass es kein Ergründen beziehungsweise Erforschen gibt; „unerforschlich“ gibt die Unerschöpflichkeit der Erkenntnis knapp und natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Namen, ohne ihn durch den traditionellen Ersatztitel zu verdecken.
- issue: Reichweite von אֵין חֵקֶר
  choice: seine Größe ist unerforschlich
  alternative: seine Größe ist grenzenlos
  rationale: Der Text spricht unmittelbar von der Unmöglichkeit vollständigen Ergründens, nicht ausdrücklich von räumlicher oder quantitativer Grenzenlosigkeit. Daher bleibt die erkenntnisbezogene Spannung erhalten.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit poetischer Kürze. Der Parallelismus der drei Aussagen bleibt erhalten; das Semikolon markiert den Übergang zur Aussage über die unerforschliche Größe.
