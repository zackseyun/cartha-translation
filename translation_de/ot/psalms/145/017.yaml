  yaml_path: translation/ot/psalms/145/017.yaml
  text: Yahweh is righteous in all his ways and faithful in all his works[a].
translation:
  language: de
  text: Jahwe ist gerecht in allen seinen Wegen und treu in allen seinen Werken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gütig“ oder „gnädig“. Einige Übersetzungen geben das hebräische Wort hier mit „heilig“ wieder; der masoretische Text hat ein Wort, das „treu“ oder „beständig gütig“ bedeuten kann.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: צַדִּיק
  choice: gerecht
  rationale: Das Adjektiv bezeichnet moralische Geradheit und Gerechtigkeit; „gerecht“ ist im Deutschen zugleich natürlich und theologisch angemessen.
- source_word: בְּכָל
  choice: in allen
  rationale: Die Präposition bezeichnet hier den Bereich beziehungsweise Bezug; „in allen“ gibt dies knapp und idiomatisch wieder.
- source_word: דְּרָכָיו
  choice: seinen Wegen
  rationale: „Wege“ bewahrt die hebräische Metapher für Gottes Handlungsweisen, ohne sie erklärend einzuengen.
- source_word: חָסִיד
  choice: treu
  rationale: Das von חֶסֶד geprägte Adjektiv kann loyale Güte, Gnade oder Treue bezeichnen. „Treu“ bringt hier Gottes verlässliche, beständige Güte zum Ausdruck und erhält die Parallelität zu „gerecht“.
- source_word: מַעֲשָׂיו
  choice: seinen Werken
  rationale: „Werke“ gibt Gottes Taten in gehobener, aber verständlicher Sprache wieder und bewahrt die poetische Entsprechung zu „Wegen“.
theological_decisions:
- issue: Wiedergabe von חָסִיד als Beschreibung Gottes
  choice: treu
  alternative: 'gütig, gnädig; nach einer anderen Texttradition: heilig'
  rationale: Der masoretische Text liest חָסִיד und nicht קָדוֹשׁ. „Treu“ wahrt den Sinn beständiger, loyaler Güte, ohne mögliche Bedeutungsnuancen zu verschweigen. Die Lesart „heilig“ wird nicht in den Haupttext übernommen, da sie einer anderen Texttradition folgt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewahrtem poetischem Parallelismus. Der Gottesname steht als „Jahwe“; die Formulierung bleibt eng am hebräischen Text und erläutert echte lexikalische sowie textkritische Alternativen in der Fußnote.
