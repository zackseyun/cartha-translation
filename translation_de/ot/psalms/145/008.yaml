  text: חַנּ֣וּן וְ/רַח֣וּם יְהוָ֑ה אֶ֥רֶךְ אַ֝פַּ֗יִם וּ/גְדָל חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/008.yaml
  text: Yahweh is gracious and compassionate[a], slow to anger and great in steadfast love.
translation:
  language: de
  text: Jahwe ist gnädig und barmherzig, langsam zum Zorn und reich an beständiger Liebe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „groß an beständiger Liebe“. Die hebräische Wendung kann die Größe oder die Fülle dieser beständigen Liebe hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַנּוּן
  choice: gnädig
  rationale: „Gnädig“ gibt die Bereitschaft wieder, unverdiente Gunst zu erweisen, und ist im modernen Standarddeutsch klar und würdig.
- source_word: רַחוּם
  choice: barmherzig
  rationale: „Barmherzig“ bezeichnet tiefes Mitgefühl und wahrt gegenüber „gnädig“ die eigenständige Bedeutung des zweiten Adjektivs.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶרֶךְ אַפַּיִם
  choice: langsam zum Zorn
  rationale: Die wörtliche hebräische Wendung „lang der Nase/Nüstern“ ist ein Idiom für Geduld angesichts von Provokation; „langsam zum Zorn“ bewahrt Bildnähe und Sinn.
- source_word: גְדָל
  choice: groß an
  rationale: Die Form bezeichnet hier Größe bzw. Fülle. „Groß an“ folgt der Grundbedeutung, während die Fußnote die natürliche Alternative „reich an“ nennt.
- source_word: חָסֶד
  choice: beständige Liebe
  rationale: חֶסֶד umfasst zugewandte, verlässliche und dauerhafte Liebe. „Beständige Liebe“ hält Liebe und Treue zusammen, ohne den Begriff ausschließlich auf einen technischen Bundesbegriff festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der persönliche Gottesname. Seine Wiedergabe als „Jahwe“ bewahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Bedeutungsumfang von חֶסֶד
  choice: beständige Liebe
  alternative: Güte / Bundestreue
  rationale: Die gewählte Formulierung bewahrt sowohl die liebevolle Zuwendung als auch deren Verlässlichkeit, ohne die Aussage einseitig auf Gefühl, Güte oder eine ausdrücklich formulierte Bundestheologie zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst paralleler Adjektivfolge. Die idiomatische Wendung „langsam zum Zorn“ bleibt nahe am hebräischen Bildgebrauch; „groß an beständiger Liebe“ bewahrt die lexikalische Spannung zwischen Größe und Fülle.
