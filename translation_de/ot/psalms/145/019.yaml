  text: רְצוֹן יְרֵאָ֥י/ו יַעֲשֶׂ֑ה וְֽ/אֶת שַׁוְעָתָ֥/ם יִ֝שְׁמַ֗ע וְ/יוֹשִׁיעֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/019.yaml
  text: He fulfills the desire of those who fear him[b][a]; he hears their cry for help and saves them.
translation:
  language: de
  text: Er erfüllt den Wunsch derer, die ihn fürchten; er hört ihren Hilferuf[a] und rettet sie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihr Flehen um Hilfe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: befreit sie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצוֹן
  choice: Wunsch
  rationale: Das Substantiv bezeichnet hier das, was die Gottesfürchtigen begehren oder ersehnen. „Wunsch“ ist im Deutschen natürlich und bildet mit „erfüllen“ eine idiomatische Verbindung.
- source_word: יְרֵאָיו
  choice: derer, die ihn fürchten
  rationale: Die Form bezeichnet Menschen, deren Haltung von Gottesfurcht geprägt ist. „Die ihn fürchten“ bewahrt die ausdrückliche Furcht-Terminologie des Hebräischen.
- source_word: יַעֲשֶׂה
  choice: er erfüllt
  rationale: Wörtlich bedeutet das Verb „tun/machen“. In Verbindung mit „Wunsch“ gibt „erfüllen“ den gemeinten Sinn im Deutschen treffend und idiomatisch wieder.
- source_word: שַׁוְעָתָם
  choice: ihren Hilferuf
  rationale: Das Wort bezeichnet einen aus Bedrängnis hervorgehenden Ruf um Hilfe. „Hilferuf“ ist knapp, verständlich und passt zum folgenden Retten.
- source_word: יִשְׁמַע
  choice: er hört
  rationale: Die Grundbedeutung ist „hören“. Der Zusammenhang lässt zugleich erkennen, dass dieses Hören zur helfenden Antwort führt, ohne dies bereits in das Verb hineinzulesen.
- source_word: וְיוֹשִׁיעֵם
  choice: und rettet sie
  rationale: Der Hifil von יָשַׁע bezeichnet Retten oder Befreien aus Not. „Rettet“ bewahrt die Bedeutungsbreite und den theologischen Klang, ohne die konkrete Art der Rettung festzulegen.
theological_decisions:
- issue: Wiedergabe der Gottesfurcht
  choice: die ihn fürchten
  alternative: die ihn ehren / die Ehrfurcht vor ihm haben
  rationale: Das Hebräische verwendet ausdrücklich die Wortfamilie für „fürchten“. Die Hauptübersetzung bewahrt diese klassische biblische Aussage, statt sie zu „Ehrfurcht“ oder „Verehrung“ abzumildern.
- issue: Reichweite der göttlichen Rettung
  choice: rettet sie
  alternative: befreit sie
  rationale: Das hebräische Verb kann allgemein die Rettung aus Bedrängnis bezeichnen. „Rettet“ lässt sowohl die unmittelbare Hilfe im Kontext des Psalms als auch den weiteren theologischen Bedeutungsraum offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus des hebräischen Verses bleibt durch das Semikolon erhalten; die Formulierungen sind gut verständlich, ohne die traditionelle Sprache von Gottesfurcht und Rettung abzuschwächen.
