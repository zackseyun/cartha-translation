lexical_decisions:
- source_word: הֲדַר כְּבוֹד הוֹדֶךָ
  choice: die herrliche Pracht deiner Majestät
  rationale: Die gehäufte Konstruktverbindung bündelt Pracht, Herrlichkeit und königliche Hoheit. Die Formulierung bewahrt die steigernde Wirkung, ohne im Deutschen schwerfällig zu werden.
- source_word: וְדִבְרֵי נִפְלְאוֹתֶיךָ
  choice: und über die Worte deiner Wunder
  rationale: דִּבְרֵי wird ausdrücklich als »Worte« wiedergegeben; נִפְלְאוֹת bezeichnet Gottes außergewöhnliche Wundertaten. Das ergänzte »über« verbindet auch diese Wortgruppe natürlich mit dem Verb.
- source_word: אָשִׂיחָה
  choice: will ich nachsinnen
  rationale: שׂיח kann sowohl nachdenkliches Betrachten als auch Reden bezeichnen. »Nachsinnen« passt zum Gegenstand der Betrachtung und lässt die sprachliche Nebenbedeutung in der Fußnote offen.
