  text: הֲ֭דַר כְּב֣וֹד הוֹדֶ֑/ךָ וְ/דִבְרֵ֖י נִפְלְאוֹתֶ֣י/ךָ אָשִֽׂיחָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/005.yaml
  text: On the glorious splendor of your majesty[a], and on your wondrous works, I will meditate.
translation:
  language: de
  text: Über die herrliche Pracht deiner Majestät und über die Worte deiner Wunder will ich nachsinnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »will ich sprechen« beziehungsweise »will ich sinnen«. Das hebräische Verb kann sowohl Nachdenken als auch Reden bezeichnen.'
