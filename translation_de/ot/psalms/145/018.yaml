source:
  edition: WLC
  text: קָר֣וֹב יְ֭הוָה לְ/כָל קֹרְאָ֑י/ו לְ/כֹ֤ל אֲשֶׁ֖ר יִקְרָאֻ֣/הוּ בֶ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/018.yaml
  text: Yahweh is near to all who call on him[a], to all who call on him in truth.
translation:
  language: de
  text: Jahwe ist allen nahe, die ihn anrufen, allen, die ihn in Wahrheit[a] anrufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aufrichtig“, „wahrhaftig“ oder „in Treue“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: nahe
  rationale: Das prädikative Adjektiv bezeichnet räumliche oder relationale Nähe. „Nahe sein“ ist im Deutschen natürlich und bewahrt beide Nuancen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: לְכָל
  choice: allen
  rationale: Die Präposition ל bezeichnet hier die Beziehung zu den angerufenen Personen; mit „allen nahe“ wird sie idiomatisch und entsprechend der wiederholten Parallelstruktur wiedergegeben.
- source_word: קֹרְאָיו
  choice: die ihn anrufen
  rationale: קרא bezeichnet in diesem Gebetszusammenhang das Anrufen Gottes. Das Possessivsuffix wird mit „ihn“ ausgedrückt.
- source_word: אֲשֶׁר יִקְרָאֻהוּ
  choice: die ihn … anrufen
  rationale: Die Wiederholung des Verbs im zweiten Halbvers wird beibehalten und bewahrt so Parallelismus und Nachdruck.
- source_word: בֶאֱמֶת
  choice: in Wahrheit
  rationale: אֱמֶת kann Wahrheit, Aufrichtigkeit und Treue bezeichnen. „In Wahrheit“ bleibt der hebräischen Formulierung nahe und legt die gemeinte Nuance nicht unnötig fest.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite der Nähe Gottes
  choice: Die universale Aussage „allen, die ihn anrufen“ bleibt bestehen und wird durch „in Wahrheit“ näher bestimmt.
  alternative: Beschränkung auf eine ausdrücklich benannte Bundesgemeinschaft oder Ausweitung unabhängig vom Anrufen
  rationale: Der Vers bestimmt seinen Personenkreis selbst. Die Übersetzung engt ihn weder konfessionell ein noch löst sie die Bedingung des wahrhaftigen Anrufens auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „allen, die ihn … anrufen“ erhält den poetischen Parallelismus und den Nachdruck des Hebräischen.
