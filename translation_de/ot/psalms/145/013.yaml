  text: Your kingdom is a kingdom of all ages[b][a], and your dominion is through every generation.
translation:
  language: de
  text: 'Dein Reich ist ein Reich für alle Zeiten[a],

    und deine Herrschaft währt von Generation zu Generation[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dein Reich ist ein ewiges Reich.“ Wörtlicher: „ein Reich aller Zeitalter“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in jeder Generation und Generation“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַֽלְכוּתְךָ
  choice: Dein Reich
  rationale: מַלְכוּת kann das Königtum, die Königsherrschaft oder das Reich bezeichnen. „Reich“ ist hier natürlich, bewahrt die königliche Bildwelt und bildet einen klaren Parallelismus zu „Herrschaft“.
- source_word: מַלְכוּת
  choice: ist ein Reich
  rationale: 'Die Wiederholung desselben hebräischen Nomens wird beibehalten: „Dein Reich ist ein Reich …“. So bleibt die poetische Hervorhebung erhalten, statt sie zu „dein Reich ist ewig“ zusammenzuziehen.'
- source_word: כָּל עֹלָמִים
  choice: für alle Zeiten
  rationale: Der Plural עֹלָמִים bezeichnet hier die unbegrenzte Dauer über sämtliche Zeitalter hinweg. „Für alle Zeiten“ ist im modernen Deutschen verständlich und lässt die zeitliche Weite der hebräischen Formulierung erkennen.
- source_word: וּמֶמְשֶׁלְתְּךָ
  choice: und deine Herrschaft
  rationale: מֶמְשָׁלָה bezeichnet Herrschaftsgewalt beziehungsweise das Ausüben von Herrschaft. „Herrschaft“ ist würdig, geläufig und ergänzt „Reich“, ohne bloß eine Verwaltungsform anzudeuten.
- source_word: בְּכָל דּוֹר וָדֹר
  choice: durch alle Generationen
  rationale: Wörtlich steht „in jedem Geschlecht und Geschlecht“, eine idiomatische Verdopplung für die ununterbrochene Folge der Generationen. „Durch alle Generationen“ gibt diesen zeitlichen Fortgang natürlich wieder.
theological_decisions:
- issue: Dauer von Gottes Königsherrschaft
  choice: Die Formulierung stellt Gottes Reich und Herrschaft als alle Zeiten und Generationen umfassend dar, ohne die hebräische Poesie in eine spätere dogmatische Formel umzuschreiben.
  alternative: Dein Reich ist ein ewiges Reich, und deine Herrschaft währt von Generation zu Generation.
  rationale: Der hebräische Text bezeugt eindeutig die unbegrenzte Dauer der Herrschaft Gottes. Die gewählte Fassung bewahrt zugleich die Wiederholung von מַלְכוּת und die parallelen Zeitangaben.
- issue: Fehlendes Verb im zweiten Versglied
  choice: 'Die deutsche Fassung bewahrt die poetische Ellipse: „und deine Herrschaft durch alle Generationen“.'
  alternative: und deine Herrschaft währt durch alle Generationen
  rationale: Im Hebräischen steht im zweiten Versglied kein eigenes Verb. Die Ellipse ist im poetischen Deutschen verständlich und vermeidet, ein nicht ausdrücklich vorhandenes Verb wie „währt“ einzufügen.
translation_notes:
  register: Moderne, würdige Psalmenpoesie mit klarer Syntax. Die Wiederholung „Reich … Reich“ und die verblose Parallelkonstruktion des Hebräischen bleiben erhalten; die Fußnoten bieten geläufigere beziehungsweise wörtlichere Alternativen.
