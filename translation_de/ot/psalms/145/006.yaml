source:
  edition: WLC
  text: וֶ/עֱז֣וּז נוֹרְאֹתֶ֣י/ךָ יֹאמֵ֑רוּ ו/גדולתי/ך אֲסַפְּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/006.yaml
  text: They will speak of the might of your awesome deeds[b][a], and I will recount your greatness.
translation:
  language: de
  text: Sie werden von der Macht deiner furchtgebietenden Taten[a] sprechen, und ich will von deiner Größe[b] erzählen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen ehrfurchtgebietenden Taten“ bzw. „deinen furchterregenden Taten“. Das Hebräische bezeichnet Taten, die Furcht, Ehrfurcht und Staunen hervorrufen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deine großen Taten“. Der hebräische Ausdruck kann sowohl Gottes Größe als auch die großen Dinge bezeichnen, die er getan hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶ/עֱז֣וּז
  choice: von der Macht
  rationale: עֱזוּז bezeichnet Stärke, Macht oder Kraft. Die Wiedergabe bewahrt die Verbindung mit den folgenden Taten und den gehobenen poetischen Ton.
- source_word: נוֹרְאֹתֶ֣י/ךָ
  choice: deiner furchtgebietenden Taten
  rationale: Die Form bezeichnet Taten, die Furcht, Ehrfurcht und Staunen hervorrufen. „Furchtgebietend“ erhält diese Spannung besser als das im heutigen Deutsch oft abgeschwächte „wunderbar“.
- source_word: יֹאמֵ֑רוּ
  choice: Sie werden … sprechen
  rationale: Das Imperfekt kann zukünftig oder gewohnheitsmäßig verstanden werden. „Sprechen von“ ist im Deutschen mit diesem Gegenstand idiomatisch und erhält die Parallelität zur folgenden Ich-Aussage.
- source_word: ו/גדולתי/ך
  choice: deine Größe
  rationale: גדלות kann abstrakte Größe oder die großen Taten Gottes bezeichnen. „Größe“ bewahrt die Abstraktion und lässt die mögliche kollektive Bedeutung offen.
- source_word: אֲסַפְּרֶֽ/נָּה
  choice: ich will … erzählen
  rationale: ספר im Piel bedeutet erzählen, berichten oder verkünden. „Erzählen“ ist natürliches modernes Deutsch und bringt das ausführliche Bekanntmachen zum Ausdruck.
theological_decisions:
- issue: Bedeutung von נוראותיך
  choice: furchtgebietende Taten
  alternative: Ehrfurcht gebietende Taten / Furcht erregende Taten
  rationale: Die Form umfasst sowohl Schrecken als auch ehrfürchtiges Staunen; die Übersetzung legt die Wirkung nicht ausschließlich auf eine dieser Seiten fest.
- issue: Bedeutung von גדלותיך
  choice: deine Größe
  alternative: deine großen Taten
  rationale: Der hebräische Ausdruck kann Eigenschaft oder Machterweise bezeichnen. Der Haupttext wahrt die abstrakte Bedeutung; die sachlich mögliche Lesart als Taten wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Parallelität. „Furchtgebietend“ bewahrt die starke Wirkung des Hebräischen; „ich will“ gibt die volitive beziehungsweise zukünftige Nuance der ersten Person natürlich wieder.
