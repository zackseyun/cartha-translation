id: PSA.145.12
reference: Psalms 145:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְ/הוֹדִ֤יעַ לִ/בְנֵ֣י הָ֭/אָדָם גְּבוּרֹתָ֑י/ו וּ֝/כְב֗וֹד הֲדַ֣ר מַלְכוּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/012.yaml
  text: to make known to the sons of man his mighty acts and the glorious splendor of his kingdom[a].
translation:
  language: de
  text: um den Menschenkindern[a] seine Machttaten kundzutun und die herrliche Pracht seines Königtums.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Menschen; wörtlich steht hier eine hebräische Wendung für die Menschen beziehungsweise die Menschheit insgesamt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹדִיעַ
  choice: kundzutun
  rationale: 'Der Hifil-Infinitiv von ידע hat kausative Bedeutung: etwas bekannt machen. „kundzutun“ bewahrt diesen Sinn, passt zum gehobenen poetischen Register und schließt natürlich an die Zweckbestimmung des Zusammenhangs an.'
- source_word: לִבְנֵי הָאָדָם
  choice: den Menschenkindern
  rationale: Die wörtlich geprägte deutsche Wendung gibt das hebräische „den Söhnen des Menschen/Adams“ kompakt wieder und bezeichnet hier Menschen allgemein, nicht nur männliche Personen.
- source_word: גְּבוּרֹתָיו
  choice: seine Machttaten
  rationale: Der Plural גבורות bezeichnet machtvolle Taten beziehungsweise Erweise von Stärke. „Machttaten“ ist prägnant und im Lobpreiszusammenhang idiomatisch.
- source_word: וּכְבוֹד הֲדַר
  choice: und die herrliche Pracht
  rationale: Die Verbindung von כבוד („Herrlichkeit, Ehre“) und הדר („Pracht, Majestät“) wird in natürlichem Deutsch zusammengeführt, ohne eines der beiden Bedeutungselemente auszulassen.
- source_word: מַלְכוּתוֹ
  choice: seines Königtums
  rationale: מלכות kann Reich, Königsherrschaft oder Königtum bezeichnen. „Königtum“ hält hier sowohl den königlichen Rang als auch die Herrschaft im Blick und vermeidet eine vorschnelle Festlegung auf ein räumliches Reich.
theological_decisions:
- issue: Allgemein-menschliche Bedeutung von לִבְנֵי הָאָדָם
  choice: Die hebräisch geprägte Wendung „den Menschenkindern“ steht im Haupttext.
  alternative: den Menschen; der Menschheit
  rationale: Der Ausdruck meint die Menschheit insgesamt. Die gewählte Form bewahrt das Bild des Ausgangstextes, während die Fußnote die inklusive Bedeutung ausdrücklich klärt.
- issue: Bedeutungsumfang von מַלְכוּת
  choice: Königtum
  alternative: Reich; Königsherrschaft
  rationale: Der Kontext preist Gottes königliche Größe. „Königtum“ wahrt die mögliche Spannung zwischen seinem Status als König und der Ausübung seiner Herrschaft, statt den Ausdruck ausschließlich räumlich zu verstehen.
translation_notes:
  register: Modernes, würdevolles poetisches Deutsch. „Menschenkinder“ und „kundzutun“ sind leicht gehoben, bleiben aber verständlich und entsprechen dem Sprachcharakter eines Lobpsalms.
