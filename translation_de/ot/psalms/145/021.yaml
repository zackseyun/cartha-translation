id: PSA.145.21
reference: Psalms 145:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תְּהִלַּ֥ת יְהוָ֗ה יְֽדַבֶּ֫ר פִּ֥/י וִ/יבָרֵ֣ךְ כָּל בָּ֭שָׂר שֵׁ֥ם קָדְשׁ֗/וֹ לְ/עוֹלָ֥ם וָ/עֶֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/021.yaml
  text: My mouth will speak the praise of Yahweh[a], and all flesh will bless his holy name forever and ever.
translation:
  language: de
  text: Mein Mund wird das Lob Jahwes verkünden, und alles Fleisch[a] wird seinen heiligen Namen segnen für immer und ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Menschen“ oder „jedes Lebewesen“. Hebräisch: „alles Fleisch“, eine poetische Bezeichnung für sterbliche Wesen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִלַּת יְהוָה
  choice: das Lob Jahwes
  rationale: Die Konstruktion bezeichnet das auf Jahwe gerichtete beziehungsweise ihm zukommende Lob. „Das Lob Jahwes“ wahrt die hebräische Genitivverbindung und klingt im Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen gebräuchliche wissenschaftliche Umschrift.
- source_word: יְדַבֶּר
  choice: wird … verkünden
  rationale: Das Imperfekt drückt hier den abschließenden Vorsatz beziehungsweise eine zukünftige oder fortdauernde Handlung aus. Bei „Lob“ gibt „verkünden“ das hörbare Aussprechen idiomatisch wieder.
- source_word: פִּי
  choice: Mein Mund
  rationale: Die konkrete hebräische Ausdrucksweise bleibt erhalten, statt sie zu einem bloßen „ich“ zu verflachen.
- source_word: וִיבָרֵךְ
  choice: wird … segnen
  rationale: Das koordinierte Imperfekt wird wie das vorherige Verb zukunftsbezogen verstanden. „Segnen“ bewahrt die übliche Bedeutung von ברך auch dort, wo Menschen Gott lobend segnen.
- source_word: כָּל בָּשָׂר
  choice: alles Fleisch
  rationale: Die wörtliche poetische Wendung bewahrt den umfassenden Bezug auf sterbliche Geschöpfe, ohne ihn vorschnell ausschließlich auf Menschen einzuengen.
- source_word: שֵׁם קָדְשׁוֹ
  choice: seinen heiligen Namen
  rationale: Die natürliche deutsche Formulierung bewahrt den Bezug auf Gottes heilige, offenbarte Identität und seinen Ruf.
- source_word: לְעוֹלָם וָעֶד
  choice: für immer und ewig
  rationale: Die feste deutsche Wendung erhält die verstärkende Aussage unbegrenzter Dauer.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Wiedergabe als „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Umfang von כָּל בָּשָׂר
  choice: alles Fleisch
  alternative: alle Menschen / jedes Lebewesen
  rationale: Die hebräische Formulierung kann kollektiv sterbliche Menschen oder weiter gefasst lebende Geschöpfe bezeichnen. Die wörtliche poetische Wendung erhält diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter hebräischer Bildsprache. Der Satzbau bleibt klar und gut vorlesbar; „alles Fleisch“ wird wegen seiner poetischen und bewusst offenen Reichweite beibehalten und durch eine Fußnote erläutert.
