  source_fidelity: 'Der Entwurf gibt die hebräische Satzfolge und Aussage zuverlässig wieder: Der Mund des Sprechers verkündet Jahwes Lob; „alles Fleisch“ segnet seinen heiligen Namen in unbegrenzter Dauer. Die beiden Imperfekta sind mit „wird … verkünden / wird … segnen“ als abschließender, zukunftsgerichteter Lobvorsatz angemessen erfasst.'
