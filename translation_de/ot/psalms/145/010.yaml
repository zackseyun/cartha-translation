  source_fidelity: 'Der Entwurf gibt die beiden hebräischen Kolons vollständig und in ihrer Parallelität wieder: כָּל („alle“), מַעֲשֶׂיךָ („deine Werke“), die beiden Suffixe der 2. Person („dir“/„dich“) sowie die Verben ידה („danken“) und ברך („segnen“) bleiben unterschieden. Die futurische Wiedergabe der Imperfektformen ist im poetischen Zusammenhang vertretbar.'
