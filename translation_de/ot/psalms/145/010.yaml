source:
  edition: WLC
  text: יוֹד֣וּ/ךָ יְ֭הוָה כָּל מַעֲשֶׂ֑י/ךָ וַ֝/חֲסִידֶ֗י/ךָ יְבָרֲכֽוּ/כָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/010.yaml
  text: All your works will give thanks to you[a], O Yahweh[b], and your faithful ones will bless you.
translation:
  language: de
  text: Alle deine Werke werden dir danken, Jahwe[a], und deine Getreuen[b] werden dich segnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: Oder „deine Heiligen“ beziehungsweise „die dir treu ergeben sind“. Das hebräische Wort bezeichnet Menschen, die durch Treue und hingebungsvolle Verbundenheit mit Gott geprägt sind.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: werden dir danken
  rationale: Das Hifil von ידה bezeichnet hier Danken oder lobendes Preisen. „Dir danken“ wahrt die Abgrenzung zum parallelen ברך und gibt das Suffix der zweiten Person wieder; die Zukunftsform entspricht dem poetischen Imperfekt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: כָּל מַעֲשֶׂיךָ
  choice: alle deine Werke
  rationale: Die Formulierung gibt die Gesamtheit dessen wieder, was Gott geschaffen oder vollbracht hat, und bleibt zugleich nahe am hebräischen Wortlaut.
- source_word: וַחֲסִידֶיךָ
  choice: und deine Getreuen
  rationale: חסיד bezeichnet Menschen, die von Treue, Verbundenheit und frommer Hingabe geprägt sind. „Getreue“ ist knapp, würdig und vermeidet hier spätere kirchliche Nebenbedeutungen von „Heilige“.
- source_word: יְבָרֲכוּכָה
  choice: werden dich segnen
  rationale: Das Piel von ברך bedeutet „segnen“. Die im Deutschen ungewöhnliche Aussage, dass Menschen Gott segnen, wird nicht stillschweigend zu „preisen“ umgedeutet; so bleibt auch die Spannung des Ausgangstextes erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. Die Umschrift bewahrt den Charakter als persönlichen Bundesnamen, während „der HERR“ eine traditionelle Ersatzlesung ist.
- issue: Bedeutung von חֲסִידֶיךָ
  choice: deine Getreuen
  alternative: deine Heiligen; die dir treu ergeben sind
  rationale: Der Ausdruck verbindet Treue, Frömmigkeit und loyale Verbundenheit. „Getreue“ bewahrt diese Weite, ohne den Begriff auf einen späteren dogmatischen Heiligenbegriff festzulegen.
- issue: Menschen segnen Gott
  choice: werden dich segnen
  alternative: werden dich preisen
  rationale: ברך kann bei Gott als Objekt idiomatisch lobendes Preisen meinen. Die formnähere Wiedergabe „segnen“ lässt jedoch die biblische Ausdrucksweise und ihre theologische Spannung sichtbar, statt sie erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dichterischer Parallelstruktur. Die Zukunftsformen bilden die hebräischen Imperfektformen gleichlaufend ab. „Dich segnen“ ist bewusst formnah und bewahrt die genuine Ausdrucksspannung.
