  text: טוֹב יְהוָ֥ה לַ/כֹּ֑ל וְ֝/רַחֲמָ֗י/ו עַל כָּל מַעֲשָֽׂי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/009.yaml
  text: Yahweh is good to all[a], and his mercies are over all his works.
translation:
  language: de
  text: Jahwe ist gut zu allen, und sein Erbarmen gilt allen seinen Werken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und seine Erbarmungen sind über allen seinen Werken“. Die hebräische Mehrzahl unterstreicht die Fülle seiner mitfühlenden Zuwendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: gut
  rationale: Die direkte Wiedergabe bewahrt sowohl die moralische als auch die wohltätige Güte und klingt in der Prädikatskonstruktion natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: לַכֹּל
  choice: zu allen
  rationale: Die Präposition bezeichnet hier die Beziehung beziehungsweise Ausrichtung von Jahwes Güte; „zu allen“ bewahrt den universalen Umfang knapp und idiomatisch.
- source_word: רַחֲמָיו
  choice: sein Erbarmen
  rationale: Das hebräische Pluralwort bezeichnet reiches, sich vielfach erweisendes Mitgefühl. Im heutigen Deutsch gibt der kollektive Singular „Erbarmen“ den Sinn natürlicher wieder als „Erbarmungen“.
- source_word: עַל
  choice: gilt
  rationale: In Verbindung mit „Erbarmen“ vermittelt „gilt“ die Zuwendung zu sämtlichen Werken idiomatisch, ohne die räumliche Bedeutung von „über“ unnötig zu vergegenständlichen.
- source_word: כָּל
  choice: allen
  rationale: Die Wiederholung von „allen“ bewahrt den universalen und poetisch parallelen Charakter des hebräischen Verses.
- source_word: מַעֲשָׂיו
  choice: seinen Werken
  rationale: „Werke“ ist knapp und lässt offen, ob besonders das Geschaffene oder allgemeiner Gottes Hervorgebrachtes gemeint ist; im Kontext steht wahrscheinlich die Gesamtheit der Schöpfungswerke im Blick.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Transliteration bewahrt ihn, statt ihn durch den traditionellen Titel zu ersetzen.
- issue: Umfang von Gottes Güte und Erbarmen
  choice: allen / allen seinen Werken
  alternative: seinem Volk / ausgewählten Werken
  rationale: Das zweimalige כֹּל ist uneingeschränkt formuliert. Die Übersetzung erhält diese Universalität, ohne daraus weitergehende Aussagen über Erlösung oder Gericht abzuleiten.
- issue: Numerus von רַחֲמָיו
  choice: sein Erbarmen
  alternative: seine Erbarmungen
  rationale: Der hebräische Plural kann die Fülle mitfühlender Regungen oder Taten ausdrücken. Der deutsche kollektive Singular ist natürlicher; die Formnuance wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelität. „Jahwe“ folgt der Wiedergabe des Tetragramms als Eigenname. Die etwas ungewohnte Formulierung „gut zu allen“ wurde beibehalten, weil sie den hebräischen Satzbau und die universale Aussage präzise wiedergibt.
