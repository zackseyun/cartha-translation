  source_fidelity: 'Der Entwurf gibt die Abfolge und den Grundgehalt des Hebräischen zutreffend wieder: erinnerndes Nennen von Gottes großer Güte und freudiger Lobpreis seiner צדקה. Die Metapher von יביעו sollte jedoch im Deutschen nicht durch die unnatürliche Konstruktion „die Erinnerung ... hervorströmen lassen“ abgebildet werden. Die Fußnote zu צדקה verengt den Begriff zudem unnötig und trifft „justice“ nicht angemessen.'
