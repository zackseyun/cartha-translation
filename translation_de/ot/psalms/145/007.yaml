base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/007.yaml
  text: They will pour forth the memory of your abundant goodness[b][a], and they will sing for joy of your righteousness.
translation:
  language: de
  text: Sie sprechen übersprudelnd von deiner großen Güte[a] und jubeln über deine Gerechtigkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Sie verkünden die Erinnerung an deine große Güte.'
    reason: Lexikalische Alternative für זֵכֶר als „Erinnerung“ bzw. erinnerndes Erwähnen und für יביעו als ausdrückliches Hervorbringen im Reden.
  - marker: b
    text: 'Oder: dein gerechtes Handeln.'
    reason: Alternative Wiedergabe von צדקה, die den Aspekt gerechter Taten hervorhebt, ohne den umfassenderen Begriff „Gerechtigkeit“ im Haupttext zu verengen.
lexical_decisions:
- source_word: זֵכֶר
  choice: die Erinnerung
  rationale: Das Substantiv bezeichnet Erinnerung oder erinnerndes Erwähnen. Als Objekt von יביעו ist hier die im Lobpreis ausgesprochene Erinnerung an Gottes Güte gemeint; die substantivische Wiedergabe bewahrt die Bildsprache und bleibt nahe am Hebräischen.
- source_word: רַב טוּבְךָ
  choice: deine reiche Güte
  rationale: רַב bezeichnet hier das große Maß oder die Fülle der Güte. „Reiche Güte“ ist im Deutschen natürlich und bewahrt den Gedanken der Überfülle, ohne טוּב auf materielle Gaben zu verengen.
- source_word: יַבִּיעוּ
  choice: lassen … hervorströmen
  rationale: Die Hifil-Form von נבע zeichnet das Bild von etwas, das hervorquillt oder -strömt. Diese Wiedergabe erhält die lebendige Metapher reichlichen Lobens.
- source_word: וְצִדְקָתְךָ
  choice: deine Gerechtigkeit
  rationale: צדקה umfasst Gottes gerechtes Wesen und Handeln. „Gerechtigkeit“ ist im Deutschen breit genug, während „Recht schaffendes Handeln“ einen möglichen Aspekt ausdrücklich hervorhebt.
- source_word: יְרַנֵּנוּ
  choice: jubeln
  rationale: Das Piel von רנן bezeichnet einen laut erklingenden Freudenruf, oft auch freudigen Gesang. „Jubeln“ bewahrt diese Offenheit und passt zum poetischen Parallelismus.
theological_decisions:
- issue: Bedeutungsumfang von צדקה im Lobpreis
  choice: deine Gerechtigkeit
  alternative: dein Recht schaffendes Handeln
  rationale: Der Haupttext wahrt den umfassenden moralischen und relationalen Sinn des hebräischen Begriffs. Die Fußnote nennt eine stärker auf Gottes gerechtes Handeln zugespitzte, ebenfalls mögliche Wiedergabe, ohne die Spannung einseitig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener poetischer Bildsprache. „Hervorströmen“ gibt das Quellbild des hebräischen Verbs wieder; „jubeln“ lässt offen, ob der Freudenruf gesprochen oder gesungen wird.
