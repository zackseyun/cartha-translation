  terminology: „Güte“ und „Gerechtigkeit“ sind hier angemessen. Als Alternative zu צדקה ist „deine Gerechtigkeit“/„dein gerechtes Handeln“ möglich; „Recht schaffendes Handeln“ ist keine natürliche Wiedergabe und legt einen spezifisch institutionellen bzw. rechtsetzenden Sinn nahe, den der hebräische Text nicht verlangt.
