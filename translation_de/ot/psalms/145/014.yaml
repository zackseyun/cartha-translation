id: PSA.145.14
reference: Psalms 145:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: סוֹמֵ֣ךְ יְ֭הוָה לְ/כָל הַ/נֹּפְלִ֑ים וְ֝/זוֹקֵ֗ף לְ/כָל הַ/כְּפוּפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/014.yaml
  text: Yahweh supports all who are falling and raises up all who are bowed down[a].
translation:
  language: de
  text: 'Jahwe stützt alle, die fallen,[a]

    und richtet alle auf, die gebeugt sind.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle, die zu Fall kommen«. Das hebräische Partizip kann allgemein oder als fortdauernder Vorgang verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: סוֹמֵךְ
  choice: stützt
  rationale: Das Partizip bezeichnet fortdauerndes oder kennzeichnendes Stützen; »stützt« ist im Deutschen klar und bewahrt das Bild.
- source_word: לְכָל
  choice: alle
  rationale: Die Präposition kennzeichnet hier den Bezugs- bzw. Objektbereich; idiomatisches Deutsch verlangt keine gesonderte Wiedergabe.
- source_word: הַנֹּפְלִים
  choice: die fallen
  rationale: Die partizipiale Form bleibt offen für einen gegenwärtigen oder allgemeinen Vorgang und wird nicht vorschnell als bereits abgeschlossener Zustand verstanden.
- source_word: זוֹקֵף
  choice: richtet ... auf
  rationale: Das Verb bezeichnet das Aufrichten oder Gerademachen und entspricht dem parallelen Bild der Gebeugten.
- source_word: הַכְּפוּפִים
  choice: die gebeugt sind
  rationale: Die Form beschreibt Menschen, die gebeugt oder niedergebeugt sind, ohne festzulegen, ob dies körperlich oder bildlich gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; die Transliteration bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Zustand der Fallenden
  choice: die fallen
  alternative: die gefallen sind
  rationale: Das hebräische Partizip kann einen laufenden oder charakteristischen Vorgang bezeichnen. Die Übersetzung vermeidet die Festlegung auf einen bereits abgeschlossenen Fall.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit parallelem Satzbau. Die konkreten Bilder des Stützens, Fallens, Aufrichtens und Gebeugtseins bleiben erhalten; mögliche bildliche Bedeutungen werden nicht erklärend in den Haupttext eingetragen.
