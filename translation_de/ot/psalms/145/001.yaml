id: PSA.145.1
reference: Psalms 145:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תְּהִלָּ֗ה לְ/דָ֫וִ֥ד אֲרוֹמִמְ/ךָ֣ אֱלוֹהַ֣/י הַ/מֶּ֑לֶךְ וַ/אֲבָרֲכָ֥ה שִׁ֝מְ/ךָ֗ לְ/עוֹלָ֥ם וָ/עֶֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/001.yaml
  text: A praise of David[a]. I will exalt you, my God the King[d][c][b], and I will bless your name forever and ever.
translation:
  language: de
  text: Ein Loblied Davids[a]. Ich will dich erheben, mein Gott, du König[b], und deinen Namen will ich preisen für immer und ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Loblied von David“. Die hebräische Überschrift kann Autorschaft oder Zuordnung bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „mein Gott, der König“; auch möglich: „mein Gott und König“.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהִלָּה
  choice: Ein Loblied
  rationale: Die substantivische Überschrift bleibt erhalten; „Loblied“ ist im Deutschen natürlich und bezeichnet passend einen Psalm des Lobes.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der Genitiv bewahrt ähnlich wie die hebräische ל-Konstruktion eine gewisse Offenheit zwischen Autorschaft und Zuordnung; die Alternative „von David“ wird in der Fußnote genannt.
- source_word: אֲרוֹמִמְךָ
  choice: Ich will dich erheben
  rationale: „Erheben“ gibt das Bild des Hochhebens beziehungsweise Erhöhens wieder und ist im heutigen gottesdienstlichen Deutsch verständlich.
- source_word: אֱלוֹהַי הַמֶּלֶךְ
  choice: mein Gott, du König
  rationale: Die Anrede gibt sowohl das possessive „mein Gott“ als auch den bestimmten Königstitel wieder und macht die Apposition im Deutschen klar, ohne ein zusätzliches „und“ einzufügen.
- source_word: וַאֲבָרֲכָה
  choice: will ich preisen
  rationale: Beim Segnen Gottes bezeichnet ברך anerkennendes Lob. „Preisen“ ist dafür im Deutschen idiomatischer als „segnen“, ohne den kultischen Sinn abzuschwächen.
- source_word: שִׁמְךָ
  choice: deinen Namen
  rationale: Die zentrale biblische Rede vom Namen bleibt wörtlich erhalten.
- source_word: לְעוֹלָם וָעֶד
  choice: für immer und ewig
  rationale: Die feste deutsche Wendung bewahrt die verstärkende Aussage unbegrenzter Dauer.
theological_decisions:
- issue: Verhältnis von „mein Gott“ und „der König“ in der direkten Anrede
  choice: mein Gott, du König
  alternative: mein Gott und König; mein Gott, der König
  rationale: Das Hebräische setzt אֱלוֹהַי und הַמֶּלֶךְ appositionell nebeneinander. „Du König“ kennzeichnet im Deutschen eindeutig die direkte Anrede und vermeidet die im Hebräischen nicht vorhandene koordinierende Konjunktion.
- issue: Wiedergabe von ברך bei Gott als Objekt
  choice: preisen
  alternative: segnen
  rationale: Die theologische Spannung wird nicht zu einer menschlichen Segensspendung an Gott umgedeutet; „Gott preisen“ ist die natürliche deutsche Entsprechung für das anerkennende Segnen seines Namens.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Parallelismus. Die Satzstellung „und deinen Namen will ich preisen“ erhält den feierlichen Rhythmus, ohne archaisch zu wirken.
