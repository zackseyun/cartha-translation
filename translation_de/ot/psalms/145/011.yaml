id: PSA.145.11
reference: Psalms 145:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כְּב֣וֹד מַלְכוּתְ/ךָ֣ יֹאמֵ֑רוּ וּ/גְבוּרָתְ/ךָ֥ יְדַבֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/011.yaml
  text: They will speak of the glory of your kingdom[b][a], and talk of your might.
translation:
  language: de
  text: Sie werden von der Herrlichkeit deines Reiches[a] sprechen und von deiner Macht[b] erzählen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deiner Herrschaft“ oder „deiner Königsherrschaft“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deinen Machttaten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹד
  choice: Herrlichkeit
  rationale: כָּבוֹד bezeichnet Herrlichkeit, Ehre oder majestätischen Glanz. „Herrlichkeit“ passt zum Lobpreis und gibt die königliche Majestät natürlich und traditionsnah wieder.
- source_word: מַלְכוּתְךָ
  choice: deines Reiches
  rationale: מַלְכוּת kann Reich, Königsherrschaft oder Herrschaft bezeichnen. „Reich“ ist im Deutschen natürlich und bewahrt den möglichen Bezug auf den königlichen Herrschaftsbereich; die Bedeutung „Herrschaft“ wird in einer Fußnote offengehalten.
- source_word: יֹאמֵרוּ
  choice: werden … sprechen
  rationale: אָמַר bedeutet grundsätzlich „sagen“. Im Lobpreiskontext und im Parallelismus ist „sprechen“ eine natürliche Wiedergabe des Imperfekts.
- source_word: גְבוּרָתְךָ
  choice: deiner Macht
  rationale: גְּבוּרָה kann Macht, Stärke oder machtvolle Taten bezeichnen. „Macht“ wahrt hier den abstrakten Singular und entspricht dem parallelen Ausdruck „Herrlichkeit deines Reiches“.
- source_word: יְדַבֵּרוּ
  choice: erzählen
  rationale: דָּבַר heißt „reden“ oder „sprechen“. „Erzählen“ vermeidet im Deutschen eine schwerfällige Wiederholung, bleibt im Kontext öffentlichen Lobens sachgemäß und fügt keine so starke Verkündigungsnuance wie „verkünden“ hinzu.
theological_decisions:
- issue: Bedeutungsumfang von מַלְכוּת in Bezug auf Gott
  choice: „Reich“ im Haupttext
  alternative: „Herrschaft“ oder „Königsherrschaft“
  rationale: Das hebräische Wort kann sowohl den Herrschaftsbereich als auch das königliche Herrschen bezeichnen. „Reich“ bewahrt die geläufige konkrete Wiedergabe, während die Fußnote die dynamische Bedeutung offenhält und keine engere Lehrentscheidung erzwingt.
- issue: Bedeutungsumfang von גְּבוּרָה
  choice: „Macht“ als abstrakte Eigenschaft
  alternative: „Machttaten“ als konkrete Äußerungen der Macht
  rationale: Die Singularform erlaubt sowohl die göttliche Macht selbst als auch ihre machtvollen Erweise. Der Haupttext wahrt die abstrakte Bedeutung; die Fußnote erhält die mögliche konkrete Lesart.
translation_notes:
  register: Moderne, würdige Psalmsprache mit klarer poetischer Parallelität. Das Futur gibt die hebräischen Imperfektformen wieder; „sprechen“ und „erzählen“ vermeiden unnötige Wortwiederholung, ohne den Sinn zu verstärken.
