source:
  edition: WLC
  text: שׁוֹמֵ֣ר יְ֭הוָה אֶת כָּל אֹהֲבָ֑י/ו וְ/אֵ֖ת כָּל הָ/רְשָׁעִ֣ים יַשְׁמִֽיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/020.yaml
  text: Yahweh preserves all who love him[a], but all the wicked he will destroy.
translation:
  language: de
  text: Jahwe bewahrt alle, die ihn lieben, aber alle Frevler wird er vernichten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und alle Frevler“; die hebräische Konjunktion bedeutet grundsätzlich „und“, hat hier aber kontrastive Funktion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹמֵר
  choice: bewahrt
  rationale: Das Partizip von שׁמר bezeichnet ein fortdauerndes Hüten und Erhalten. „Bewahrt“ drückt schützende Fürsorge natürlich und würdig aus und bildet einen klaren Gegensatz zu „vernichten“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der persönliche Gottesname „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: אֶת כָּל אֹהֲבָיו
  choice: alle, die ihn lieben
  rationale: Die substantivische Partizipialform bezeichnet diejenigen, die ihn lieben. Der Relativsatz ist im modernen Deutschen natürlicher als „alle seine Liebenden“.
- source_word: וְאֵת כָּל הָרְשָׁעִים
  choice: aber alle Frevler
  rationale: Obwohl ו formal „und“ bedeutet, stellt der Zusammenhang das Bewahren der Gott Liebenden dem Vernichten der Frevler gegenüber. „Aber“ gibt diese kontrastive Beziehung idiomatisch wieder.
- source_word: יַשְׁמִיד
  choice: wird er vernichten
  rationale: Der Hifil von שׁמד bezeichnet das Herbeiführen von Vernichtung. „Vernichten“ ist stark und direkt, ohne Art oder Umfang über den hebräischen Wortlaut hinaus festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Konjunktion vor dem zweiten Satzteil
  choice: 'kontrastiv: „aber“'
  alternative: 'koordinierend: „und“'
  rationale: Das hebräische ו ist grundsätzlich „und“, wirkt hier jedoch aufgrund der poetischen Antithese kontrastiv. Die Alternative wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die poetische Antithese wird durch „aber“ sichtbar gemacht; die formale Konjunktion des Hebräischen bleibt in der Fußnote dokumentiert.
