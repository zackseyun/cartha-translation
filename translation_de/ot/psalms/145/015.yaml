id: PSA.145.15
reference: Psalms 145:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עֵֽינֵי כֹ֭ל אֵלֶ֣י/ךָ יְשַׂבֵּ֑רוּ וְ/אַתָּ֤ה נֽוֹתֵן לָ/הֶ֖ם אֶת אָכְלָ֣/ם בְּ/עִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/015.yaml
  text: The eyes of all look to you[b][a], and you give them their food in its time.
translation:
  language: de
  text: Die Augen aller richten sich erwartungsvoll auf dich[a], und du gibst ihnen ihre Nahrung zur rechten Zeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »warten auf dich«, »schauen hoffnungsvoll auf dich« oder »hoffen auf dich«. Das hebräische Verb bezeichnet erwartungsvolles Warten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »zu seiner Zeit«; auch: »zur passenden Zeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי כֹל
  choice: Die Augen aller
  rationale: Die formal nahe Wiedergabe bewahrt das anschauliche Bild und lässt wie das Hebräische offen, auf wen oder was sich »alle« genau bezieht.
- source_word: אֵלֶיךָ יְשַׂבֵּרוּ
  choice: richten sich erwartungsvoll auf dich
  rationale: Das Piel von שׂבר bezeichnet erwartendes Warten oder hoffnungsvolles Ausschauen. Die Formulierung verbindet dieses Bedeutungselement natürlich mit dem vorausgehenden Bild der Augen.
- source_word: וְאַתָּה נוֹתֵן
  choice: und du gibst
  rationale: Das einfache Waw wird koordinierend wiedergegeben; das Partizip beschreibt Gottes fortdauerndes beziehungsweise charakteristisches Handeln, was das deutsche Präsens angemessen ausdrückt.
- source_word: אָכְלָם
  choice: ihre Nahrung
  rationale: Das Substantiv bezeichnet allgemein das, was sie essen, nicht speziell Brot. »Nahrung« ist präzise und in diesem poetischen Register natürlich.
- source_word: בְּעִתּוֹ
  choice: zur rechten Zeit
  rationale: Die Wendung bezeichnet die jeweils passende oder bestimmte Zeit. »Zur rechten Zeit« ist idiomatisches, gegenwärtiges Deutsch und bewahrt den zeitlichen Sinn ohne unnötige Festlegung.
theological_decisions:
- issue: Umfang von כֹל (»alle«)
  choice: Der Bezug bleibt mit »aller« unausgesprochen und weit.
  alternative: »aller Menschen« oder »aller Lebewesen«
  rationale: Der unmittelbare Zusammenhang legt Gottes umfassende Fürsorge nahe, doch der Vers selbst nennt den Bezug nicht ausdrücklich. Die Übersetzung engt ihn daher weder auf Menschen ein noch ergänzt sie »Geschöpfe«.
- issue: Nuance von יְשַׂבֵּרוּ
  choice: Die Erwartung wird mit »erwartungsvoll« ausgedrückt.
  alternative: »warten auf dich«, »hoffen auf dich« oder schlicht »blicken auf dich«
  rationale: Das Verb trägt die Spannung erwartenden Wartens. Die gewählte Form bewahrt zugleich das Augenmotiv, ohne die Aussage auf eine rein innere Hoffnung zu reduzieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Bildhaftigkeit. Die Wortstellung ist gut verständlich; »Nahrung« vermeidet die sachlich zu enge Wiedergabe »Brot«.
