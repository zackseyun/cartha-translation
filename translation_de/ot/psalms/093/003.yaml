  yaml_path: translation/ot/psalms/093/003.yaml
  text: The rivers have lifted up[a], O Yahweh; the rivers have lifted up their voice[b]; the rivers lift up their pounding waves.
translation:
  language: de
  text: Die Ströme haben sich erhoben[a], Jahwe, die Ströme haben ihre Stimme erhoben; die Ströme erheben ihre tosende Brandung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Fluten haben sich erhoben“. Das hebräische Wort bedeutet gewöhnlich „Flüsse“ oder „Ströme“, kann hier aber mächtige, aufgewühlte Wassermassen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort ist selten; gemeint sein können ihre Brandung, ihr Krachen oder ihre stampfende Wucht.
    reason: lexical_uncertainty
lexical_decisions:
- source_word: נָשְׂאוּ / יִשְׂאוּ
  choice: haben sich erhoben / erheben
  rationale: נשׂא bedeutet grundlegend „heben, erheben, tragen“. Im Deutschen ist bei Gewässern „sich erheben“ natürlich und bewahrt die dreifache Wiederholung. Die beiden Perfektformen stehen als „haben sich erhoben“, der abschließende Imperfekt als belebendes Präsens „erheben“.
- source_word: נְהָרוֹת
  choice: Ströme
  rationale: Das Substantiv bezeichnet gewöhnlich Flüsse oder Ströme. „Ströme“ ist poetisch, verständlich und kann hier mächtige Wassermassen bezeichnen, ohne den lexikalischen Sinn vorschnell zu „Fluten“ umzudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und steht hier als direkte Anrede.
- source_word: קוֹלָם
  choice: ihre Stimme
  rationale: קוֹל kann „Stimme, Laut, Schall“ bedeuten. „Ihre Stimme“ erhält die Personifikation der Ströme und klingt im Deutschen würdig und natürlich.
- source_word: דָּכְיָם
  choice: ihre donnernden Wogen
  rationale: Das seltene Wort bezeichnet offenbar die brandende, stampfende oder krachende Gewalt des Wassers. „Donnernde Wogen“ vermittelt Klang und Kraft, während eine Fußnote die lexikalische Unsicherheit offenlegt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe in direkter Anrede
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, gehobene Standardsprache mit poetischem Rhythmus. Die dreifache Wiederholung von „die Ströme“ und „erheben“ bildet den hebräischen Parallelismus und die Steigerung nach. Die Anrede „Jahwe“ bleibt ohne eingeschobenes „o“, da dies im heutigen Deutschen natürlicher und dennoch feierlich klingt.
