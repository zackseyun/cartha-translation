  variant: modern standard German
source:
  edition: WLC
  text: עֵֽדֹתֶ֨י/ךָ נֶאֶמְנ֬וּ מְאֹ֗ד לְ/בֵיתְ/ךָ֥ נַאֲוָה קֹ֑דֶשׁ יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/005.yaml
  text: Your testimonies are very trustworthy[a]; holiness befits your house, O Yahweh[b], for length of days.
translation:
  language: de
  text: Deine Zeugnisse sind überaus zuverlässig; deinem Haus gebührt Heiligkeit, Jahwe[b], für alle Zeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für die Länge der Tage“; gemeint ist eine unbegrenzt fortdauernde Zeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder mit anderer Gliederung: „Deinem Haus gebührt Heiligkeit für alle Zeit, Jahwe.“'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: עֵדֹתֶיךָ
  choice: deine Zeugnisse
  rationale: „Zeugnisse“ bewahrt den Grundgedanken göttlicher Bezeugungen und legt den Ausdruck nicht vorschnell ausschließlich als Rechtsbestimmungen aus.
- source_word: נֶאֶמְנוּ מְאֹד
  choice: sind überaus zuverlässig
  rationale: Das Nifal von אמן bezeichnet Festigkeit und Verlässlichkeit; „überaus“ gibt die starke Intensivierung durch מְאֹד in würdigem, natürlichem Deutsch wieder.
- source_word: לְבֵיתְךָ
  choice: deinem Haus
  rationale: Die wörtliche Bildsprache bleibt erhalten; im Zusammenhang ist Gottes Heiligtum beziehungsweise Tempel gemeint.
- source_word: נַאֲוָה קֹדֶשׁ
  choice: gebührt Heiligkeit
  rationale: נַאֲוָה drückt Angemessenheit oder Zukommen aus. „Gebührt“ verbindet sich im Deutschen natürlich mit „Heiligkeit“ und wahrt den feierlichen Ton.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְאֹרֶךְ יָמִים
  choice: für alle Zeit
  rationale: Die Wendung bedeutet idiomatisch eine unabsehbare, dauerhafte Zeitspanne. Die ungewöhnliche wörtliche Form wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; die Transliteration wahrt diese persönliche Benennung.
- issue: Zeitliche Wendung לְאֹרֶךְ יָמִים
  choice: für alle Zeit
  alternative: für die Länge der Tage
  rationale: Die Hauptfassung gibt den idiomatischen Dauersinn in verständlichem Deutsch wieder, ohne die wörtliche Gestalt zu verschweigen.
- issue: Bezug und Stellung von יְהוָה und לְאֹרֶךְ יָמִים
  choice: Jahwe, für alle Zeit
  alternative: für alle Zeit, Jahwe
  rationale: Die Hauptfassung folgt der hebräischen Wortfolge. Da der Gottesname als Anrede verstanden wird und die Schlusswendung zur Aussage über Gottes Haus gehört, ist auch eine andere Zeichensetzung beziehungsweise Anordnung möglich; diese bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zeugnisse“ und „Heiligkeit“ bewahren die zentrale Bild- und Begriffswelt des Hebräischen; „gebührt“ vermeidet eine schwerfällige Konstruktion mit „angemessen sein“. Der Semikolon erhält die enge poetische Verbindung der beiden Aussagen.
