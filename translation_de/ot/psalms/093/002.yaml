base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/002.yaml
  text: Your throne is established from of old[a]; you are from everlasting.
translation:
  language: de
  text: Dein Thron steht fest seit alters her[a]; du bist von Ewigkeit her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dein Thron steht fest von Urzeiten an; du bist von Ewigkeit her.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: steht fest
  rationale: Die Form bezeichnet einen festen, sicher gegründeten Zustand. „Steht fest“ gibt diesen stativen Sinn im Deutschen unmittelbar und natürlich wieder.
- source_word: כִּסְאֲךָ
  choice: dein Thron
  rationale: כִּסֵּא bedeutet hier „Thron“; das Suffix der 2. Person Singular wird mit „dein“ wiedergegeben.
- source_word: מֵאָז
  choice: seit alters her
  rationale: Im Zusammenhang verweist der Ausdruck auf fernste Vorzeit. „Seit alters her“ wahrt die poetische Erhabenheit und bezeichnet zugleich den zeitlichen Ausgangspunkt des festen Bestehens.
- source_word: מֵעוֹלָם
  choice: von Ewigkeit
  rationale: In Bezug auf Gott bezeichnet עוֹלָם hier unbegrenzte Vorzeit beziehungsweise Ewigkeit. „Von Ewigkeit“ ist prägnant, würdevoll und erhält die Parallele zur ersten Vershälfte.
- source_word: אָתָּה
  choice: du bist
  rationale: Das selbstständige Pronomen steht prädikativ zum vorangestellten מֵעוֹלָם; im Deutschen wird die Kopula ausdrücklich gesetzt.
theological_decisions:
- issue: Zeitliche Aussage über Gottes Sein
  choice: du bist von Ewigkeit
  alternative: du bist seit jeher
  rationale: Die Übersetzung bekräftigt Gottes Sein vor aller geschichtlichen Zeit, ohne dem hebräischen Ausdruck eine spätere metaphysische Begrifflichkeit aufzuzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Knappheit. „Seit alters her“ ist gehoben, aber allgemein verständlich; „steht fest“ vermeidet eine unnötig ereignishafte Deutung von נָכוֹן.
