  text: מִ/קֹּל֨וֹת מַ֤יִם רַבִּ֗ים אַדִּירִ֣ים מִשְׁבְּרֵי יָ֑ם אַדִּ֖יר בַּ/מָּר֣וֹם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/004.yaml
  text: More majestic than the sound of many waters[a], than the mighty breakers of the sea[b], is Yahweh on high.
translation:
  language: de
  text: Mächtig sind, mehr noch als das Tosen großer Wasser, die Brandungswellen des Meeres[a]; mächtig ist Jahwe in der Höhe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit engerer Vergleichsverknüpfung: »Mächtiger als das Tosen großer Wasser, als die Brandungswellen des Meeres ist Jahwe in der Höhe.«'
    reason: Syntaktische Alternative; die knappe hebräische Wortstellung kann die beiden Vergleichsglieder unmittelbar auf Jahwe beziehen.
  - marker: b
    text: Hebräisch JHWH; traditionell mit »der HERR« wiedergegeben.
    reason: Traditionelle alternative Wiedergabe des Gottesnamens.
lexical_decisions:
- source_word: מִקֹּלוֹת
  choice: als das Tosen
  rationale: מִן hat hier am natürlichsten vergleichende Bedeutung. קוֹל bezeichnet bei mächtigen Wassern deren hörbaren Laut; „Tosen“ gibt dieses Bild im Deutschen idiomatisch und kraftvoll wieder.
- source_word: מַיִם רַבִּים
  choice: großer Wasser
  rationale: Die Wendung bezeichnet ausgedehnte, gewaltige Wassermassen. „Große Wasser“ wahrt den poetisch-biblischen Ausdruck, ohne die Kraft des Bildes abzuschwächen.
- source_word: אַדִּירִים … אַדִּיר
  choice: mächtiger … mächtiger
  rationale: אַדִּיר umfasst Macht, Erhabenheit und Majestät. Die Wiederholung von „mächtiger“ bewahrt den lexikalischen Zusammenhang und macht Jahwes Überlegenheit gegenüber den Wassern deutlich.
- source_word: מִשְׁבְּרֵי יָם
  choice: die Brandungswellen des Meeres
  rationale: מִשְׁבָּר bezeichnet sich brechende Meereswogen. „Brandungswellen“ ist im heutigen Standarddeutsch natürlicher und genauer als das isolierte „Brecher“.
- source_word: בַּמָּרוֹם
  choice: in der Höhe
  rationale: Die Formulierung bezeichnet den erhabenen Bereich und lässt offen, ob vor allem räumliche Höhe oder erhabene Stellung im Blick ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text verwendet den Gottesnamen JHWH. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Vergleichende Funktion der beiden מִן-Glieder
  choice: Jahwe ist mächtiger als das Tosen der Wasser und als die Brandungswellen.
  alternative: Die mächtigen Wasser und Meereswogen werden zunächst beschrieben; danach folgt die eigenständige Aussage, Jahwe sei in der Höhe mächtig.
  rationale: Die wiederholte Präposition מִן legt im poetischen Zusammenhang einen Vergleich nahe. Die knappe hebräische Syntax erlaubt jedoch eine weniger eng verbundene Lesart, die deshalb in der Fußnote erhalten bleibt.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Übersetzung gibt ihn als Namen wieder; die traditionelle deutsche Ersetzung durch „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Poetisch, würdig und gut verständlich. „Tosen“ und „Brandungswellen“ vermitteln die akustische und bewegte Meeresbildsprache natürlich; die Wiederholung „mächtiger … mächtiger“ trägt den Parallelismus und die Steigerung des hebräischen Verses.
