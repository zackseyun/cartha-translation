id: PSA.93.1
reference: Psalms 93:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָ֣ה מָלָךְ֮ גֵּא֪וּת לָ֫בֵ֥שׁ לָבֵ֣שׁ יְ֭הוָה עֹ֣ז הִתְאַזָּ֑ר אַף תִּכּ֥וֹן תֵּ֝בֵ֗ל בַּל תִּמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/001.yaml
  text: Yahweh reigns[a]; he is clothed with majesty; Yahweh is clothed with strength; he has girded himself. Indeed, the world is established[e][d][c][b]; it will not be moved.
translation:
  language: de
  text: Jahwe ist König[a]; mit Hoheit ist er bekleidet. Jahwe ist mit Stärke bekleidet; er hat sich gegürtet. Ja, der Erdkreis steht fest; er wird nicht wanken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Jahwe ist König geworden“ oder „Jahwe herrscht“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: מָלָךְ
  choice: ist König
  rationale: Die nominale deutsche Königsformel gibt die gegenwärtige Königsherrschaft prägnant wieder, ohne den möglichen ingressiven Aspekt endgültig auszuschließen.
- source_word: גֵּאוּת
  choice: Hoheit
  rationale: Im Blick auf Jahwe bezeichnet das Wort erhabene Majestät; „Hoheit“ fügt sich natürlich in das Bild des Bekleidetseins.
- source_word: לָבֵשׁ
  choice: ist … bekleidet
  rationale: Die Wiedergabe erhält das zweimalige Kleidungsbild und den feierlichen Parallelismus.
- source_word: עֹז
  choice: Stärke
  rationale: „Stärke“ ist eine klare und unmittelbare Entsprechung im Zusammenhang göttlicher Königsmacht.
- source_word: הִתְאַזָּר
  choice: hat sich gegürtet
  rationale: Die reflexive Form und das Bild des Gürtens werden bewahrt, statt die Aussage zu bloßem Starksein zu verflachen.
- source_word: אַף
  choice: Ja
  rationale: Die bekräftigende Fortführung wird in natürlichem, würdigem Deutsch knapp wiedergegeben.
- source_word: תִּכּוֹן
  choice: steht fest
  rationale: Die Form bezeichnet einen fest gegründeten Zustand; „steht fest“ ist anschaulich und verbindet sich gut mit dem folgenden Nichtwanken.
- source_word: תֵּבֵל
  choice: Erdkreis
  rationale: „Erdkreis“ bezeichnet hier die geordnete, bewohnte Welt und unterscheidet den Ausdruck von einem bloßen Wort für Erde oder Land.
- source_word: בַּל תִּמּוֹט
  choice: wird nicht wanken
  rationale: Die Wendung bringt dauerhafte Stabilität zum Ausdruck und erhält das konkrete Bild des Wankens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; „Jahwe“ bewahrt ihn als Eigennamen.
- issue: Aspekt von מָלָךְ
  choice: ist König
  alternative: ist König geworden
  rationale: Der Kontext verkündet Jahwes gegenwärtige Königsherrschaft. Die mögliche ingressive Lesart wird in einer Fußnote offengehalten.
- issue: Stabilität des Erdkreises
  choice: Aussage innerhalb der poetischen Darstellung von Jahwes Königsherrschaft
  alternative: eine über die poetische Aussage hinaus präzisierte kosmologische Behauptung
  rationale: Die Übersetzung bewahrt das Bild des feststehenden Erdkreises, ohne ihm eine moderne kosmologische Deutung aufzuzwingen.
translation_notes:
  register: Feierliches, aber gegenwärtiges Standarddeutsch. Der Parallelismus und die wiederholte Bekleidungsmetapher bleiben erhalten; altertümliche Verbformen werden vermieden.
