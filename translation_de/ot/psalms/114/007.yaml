  text: מִ/לִּ/פְנֵ֣י אָ֭דוֹן ח֣וּלִי אָ֑רֶץ מִ֝/לִּ/פְנֵ֗י אֱל֣וֹהַּ יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/007.yaml
  text: Tremble[a], O earth, before the Lord, before the God of Jacob,
translation:
  language: de
  text: Bebe[a], Erde, vor dem Herrn, vor dem Gott Jakobs!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Winde dich, Erde“; das hebräische Verb kann auch ein heftiges, krampfartiges Erschüttern bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: מִלִּפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet das Angesicht bzw. die Gegenwart einer Person. Im Deutschen gibt „vor“ sowohl die räumlich gedachte Gegenwart als auch den Anlass des Bebens knapp und natürlich wieder.
- source_word: אָדוֹן
  choice: dem Herrn
  rationale: אָדוֹן bedeutet „Herr/Gebieter“. „Herr“ ist hier der passende Gottes­titel; da nicht der Gottesname JHWH steht, wird nicht die dafür übliche besondere Schreibweise verwendet.
- source_word: חוּלִי
  choice: Bebe
  rationale: Der feminine Singular des Imperativs richtet sich an die Erde. Das Verb חול kann Beben, Zittern oder ein krampfartiges Sichwinden bezeichnen. „Bebe“ ist im Deutschen kräftig, poetisch und für die Reaktion der Erde idiomatisch.
- source_word: אָרֶץ
  choice: Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der Zusammenhang von Psalm 114 und die direkte Anrede sprechen hier für „Erde“.
- source_word: אֱלוֹהַּ יַעֲקֹב
  choice: dem Gott Jakobs
  rationale: Die Genitivverbindung bezeichnet Gott in seiner Beziehung zu Jakob. „Gott Jakobs“ bewahrt die knappe poetische Form und klingt nach dem wiederholten „vor dem“ natürlich.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der Personenname wird gemäß der etablierten deutschen Namensform wiedergegeben.
theological_decisions:
- issue: אָדוֹן von dem Gottesnamen JHWH unterscheiden
  choice: Herr
  alternative: HERR
  rationale: Im hebräischen Text steht der Titel אָדוֹן und nicht der Gottesname יְהוָה. Daher darf die Übersetzung nicht die besondere Wiedergabe des Gottesnamens importieren.
- issue: Bildstärke des Verbs חול
  choice: Bebe
  alternative: Winde dich
  rationale: „Bebe“ passt zum poetischen Aufruf an die Erde, während die Fußnote die stärkere mögliche Vorstellung eines krampfartigen Sichwindens offenhält, ohne die Mehrdeutigkeit dogmatisch festzulegen.
translation_notes:
  register: Moderne, gehobene und gut verständliche poetische Sprache. Die direkte Anrede wird ohne das im heutigen Deutschen altertümlich wirkende „o“ gestaltet. Der Ausruf bewahrt die Kraft des hebräischen Imperativs.
