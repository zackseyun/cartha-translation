id: PSA.114.6
reference: Psalms 114:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֶֽ֭/הָרִים תִּרְקְד֣וּ כְ/אֵילִ֑ים גְּ֝בָע֗וֹת כִּ/בְנֵי צֹֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/006.yaml
  text: O mountains[a], why do you skip like rams, O hills[b], like lambs of the flock?
translation:
  language: de
  text: Ihr Berge, warum hüpft[a] ihr wie Widder, ihr Hügel wie junge Schafe[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann auch mit »springt« oder »tanzt« wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »wie Söhne der Herde«; gemeint sind junge Schafe oder Lämmer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָרִים
  choice: Ihr Berge
  rationale: הָרִים bedeutet »Berge«. Die Anrede setzt die rhetorische Frage aus Vers 5 fort; im Deutschen gibt »Ihr Berge« den Vokativ natürlich und würdevoll wieder.
- source_word: תִּרְקְדוּ
  choice: hüpft
  rationale: רקד bezeichnet eine springende, hüpfende oder tanzende Bewegung. »hüpft« passt besonders gut zu den unmittelbar folgenden Vergleichen mit Herdentieren.
- source_word: כְאֵילִים
  choice: wie Widder
  rationale: אֵילִים bezeichnet hier am naheliegendsten Widder und bildet mit den jungen Schafen im zweiten Versglied ein zusammenhängendes Bild.
- source_word: גְּבָעוֹת
  choice: ihr Hügel
  rationale: גְּבָעוֹת bedeutet »Hügel«. Das wiederholte »ihr« macht die fortgesetzte direkte Anrede im Deutschen deutlich.
- source_word: כִּבְנֵי צֹאן
  choice: wie junge Schafe
  rationale: Wörtlich steht »wie Söhne der Herde/des Kleinviehs«; idiomatisch sind Jungtiere, insbesondere junge Schafe beziehungsweise Lämmer, gemeint. »junge Schafe« bewahrt sowohl den Altersbezug als auch die weitere Bedeutung von צֹאן.
theological_decisions: []
translation_notes:
  register: Moderne, poetische Standardsprache mit direkter Anrede. Das in Vers 5 eröffnete Fragegefüge wird durch »warum« ausdrücklich fortgeführt, damit der Vers als selbstständige Zeile natürlich verständlich bleibt. Die parallele Struktur der beiden Versglieder wird bewahrt.
