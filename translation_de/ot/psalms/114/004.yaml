  text: The mountains skipped like rams[a], the hills like lambs of the flock.
translation:
  language: de
  text: Die Berge hüpften wie Widder, die Hügel wie Lämmer der Herde[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
