lexical_decisions:
- source_word: הָרִים
  choice: die Berge
  rationale: Der bestimmte Artikel im Hebräischen wird wiedergegeben; die Formulierung ist im Deutschen natürlich.
- source_word: רָקְדוּ
  choice: hüpften
  rationale: Das Verb bezeichnet eine lebhafte springende oder tanzende Bewegung. „Hüpften“ passt zur Tiermetaphorik und bewahrt die poetische Belebung der Landschaft.
- source_word: כְאֵילִים
  choice: wie Widder
  rationale: אֵילִים bezeichnet hier im Zusammenhang mit der Herde am natürlichsten männliche Schafe, also Widder.
- source_word: גְּבָעוֹת
  choice: die Hügel
  rationale: Obwohl im Hebräischen kein Artikel steht, verlangt der parallele deutsche Ausdruck mit „die Berge“ idiomatisch „die Hügel“.
- source_word: כִּבְנֵי צֹאן
  choice: wie Lämmer der Herde
  rationale: Wörtlich steht „wie Söhne der Herde“. Gemeint sind junge Schafe; „Lämmer der Herde“ ist klar, poetisch und bewahrt den Herdenbezug.
