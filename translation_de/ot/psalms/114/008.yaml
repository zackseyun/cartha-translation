  text: הַ/הֹפְכִ֣י הַ/צּ֣וּר אֲגַם מָ֑יִם חַ֝לָּמִ֗ישׁ לְ/מַעְיְנ/וֹ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/008.yaml
  text: who turned the rock into a pool of water[a], the flint into a spring of water.
translation:
  language: de
  text: der den Felsen in einen Wasserteich verwandelte[a], den Feuerstein in eine Wasserquelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der den Felsen in einen Wasserteich verwandelt“. Im Hebräischen steht ein Partizip; der Vergangenheitsbezug passt zum Rückblick des Psalms auf Gottes Taten in der Wüste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹפְכִי
  choice: der … verwandelte
  rationale: Das Hifil-Partizip führt die Beschreibung des in Vers 7 genannten Gottes fort. Das Präteritum passt zum Rückblick des Psalms auf Gottes Handeln in der Wüste; der Relativsatz bewahrt zugleich die syntaktische Anbindung.
- source_word: הַצּוּר
  choice: den Felsen
  rationale: צוּר bezeichnet einen Felsen oder eine Felsmasse. „Felsen“ ist im Deutschen natürlich und entspricht dem Motiv der Wassergabe in der Wüste.
- source_word: אֲגַם מָיִם
  choice: einen Wasserteich
  rationale: אֲגַם bezeichnet ein stehendes Gewässer. „Wasserteich“ gibt das Bild knapp wieder und lässt das ausdrücklich genannte מָיִם erkennen.
- source_word: חַלָּמִישׁ
  choice: den Feuerstein
  rationale: חַלָּמִישׁ bezeichnet Feuerstein beziehungsweise besonders hartes Gestein. „Feuerstein“ erhält das konkrete Bild und unterstreicht die Härte des Gesteins.
- source_word: לְמַעְיְנוֹ מָיִם
  choice: in eine Wasserquelle
  rationale: מַעְיָן bezeichnet eine Quelle; לְ markiert hier das Ergebnis der Verwandlung. Der Singular entspricht der hebräischen Form, und „Wasserquelle“ bewahrt die Wiederholung von מָיִם im Parallelismus.
theological_decisions:
- issue: Das göttliche Subjekt wird aus dem vorhergehenden Vers übernommen
  choice: Relativsatz mit „der“, ohne „Gott“ erneut zu nennen
  alternative: Er verwandelte den Felsen in einen Wasserteich …
  rationale: Der hebräische Text setzt die Beschreibung des Herrn, des Gottes Jakobs, aus Vers 7 fort. Der Relativsatz erhält diese poetische und syntaktische Verbindung, ohne das Subjekt erklärend zu wiederholen.
- issue: Zeitbezug des hebräischen Partizips
  choice: 'Vergangenheitsbezug: „verwandelte“'
  alternative: 'Gegenwartsform: „verwandelt“'
  rationale: Das Partizip kann eine charakteristische Handlung ausdrücken, doch der Psalm erinnert hier an Gottes Taten beim Auszug und in der Wüste. Das Präteritum macht diesen Rückblick im Deutschen natürlich deutlich, während die Fußnote die formnähere Gegenwartswiedergabe offenhält.
translation_notes:
  register: Moderne, gehobene Standardsprache mit knappem poetischem Parallelismus. Die beiden Glieder bleiben syntaktisch eng aufeinander bezogen; die Wiederholung des Wassermotivs wird durch „Wasserteich“ und „Wasserquelle“ erhalten.
