  yaml_path: translation/ot/psalms/114/005.yaml
  text: What is with you[a], O sea, that you flee—O Jordan, that you turn back?
translation:
  language: de
  text: Was ist mit dir, Meer, dass du fliehst, Jordan, dass du umkehrst?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Was fehlt dir, Meer, dass du fliehst, Jordan, dass du dich zurückwendest?« Die hebräische Wendung »Was ist mit dir?« ist eine erstaunte rhetorische Anrede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לְּךָ
  choice: Was ist mit dir
  rationale: Die hebräische Wendung bedeutet wörtlich »Was ist mit/bei dir?« und dient hier als erstaunte rhetorische Anrede. Die deutsche Formulierung bewahrt das Bild und bleibt verständlich.
- source_word: הַיָּם
  choice: Meer
  rationale: Das Meer wird unmittelbar angeredet. Im heutigen Deutschen macht die Satzstellung den Vokativ ohne ein zusätzliches »o« deutlich.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt bzw. Anlass der erstaunten Frage ein; »dass« entspricht der deutschen Konstruktion »Was ist mit dir, dass …?«.
- source_word: תָנוּס
  choice: du fliehst
  rationale: Das Verb נוּס bedeutet »fliehen«. Die direkte Wiedergabe erhält die Personifikation und die poetische Bewegung.
- source_word: הַיַּרְדֵּן
  choice: Jordan
  rationale: Der Flussname steht in direkter Anrede. Die Wiederaufnahme »mit dir« macht diese Anrede im Deutschen eindeutig.
- source_word: תִּסֹּב לְאָחוֹר
  choice: du zurückweichst
  rationale: Die Verbindung bezeichnet das Sich-zurückwenden bzw. Zurückgehen. »Zurückweichen« gibt die Umkehr der Fließrichtung natürlich und poetisch wieder, ohne ein äußeres Verursachen einzutragen.
