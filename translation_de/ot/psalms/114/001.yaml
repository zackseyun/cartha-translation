id: PSA.114.1
reference: Psalms 114:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/צֵ֣את יִ֭שְׂרָאֵל מִ/מִּצְרָ֑יִם בֵּ֥ית יַ֝עֲקֹ֗ב מֵ/עַ֥ם לֹעֵֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/001.yaml
  text: When Israel went out from Egypt[a], the house of Jacob from a people of strange speech,
translation:
  language: de
  text: 'Als Israel aus Ägypten zog,

    das Haus Jakob aus einem Volk mit fremder Sprache,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus einem fremdsprachigen Volk“. Das hebräische Wort bezeichnet ein Volk, dessen Sprache für Israel fremd oder unverständlich war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/צֵאת
  choice: Als … zog
  rationale: Die Präposition ב mit dem Infinitiv constructus von יצא leitet einen Temporalsatz ein. „Als … zog“ ist im Deutschen natürlich und bewahrt den zeitlichen Sinn.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Eingebürgerte deutsche Form des Namens für das Bundesvolk.
- source_word: מִ/מִּצְרָיִם
  choice: aus Ägypten
  rationale: מן bezeichnet Herkunft beziehungsweise Trennung. Zusammen mit „zog“ gibt „aus Ägypten zog“ die Exodusbewegung knapp und idiomatisch wieder.
- source_word: בֵּית יַעֲקֹב
  choice: das Haus Jakob
  rationale: Die formnahe Wiedergabe erhält die poetische und bundestheologische Bezeichnung für Jakobs Nachkommen; „Jakob“ bleibt entsprechend der traditionellen deutschen Namensform unflektiert.
- source_word: מֵ/עַם
  choice: aus einem Volk
  rationale: מן bezeichnet erneut Trennung und erhält so die Parallelität zu „aus Ägypten“.
- source_word: לֹעֵז
  choice: mit fremder Sprache
  rationale: Der Ausdruck bezeichnet ein Volk, dessen Sprache aus Israels Perspektive fremd beziehungsweise unverständlich war. Die Formulierung ist verständlich, würdevoll und vermeidet eine abwertende ethnische Konnotation.
theological_decisions:
- issue: Verhältnis der beiden parallelen Zeilen
  choice: 'Die zweite Zeile bleibt eine elliptische parallele Wiederaufnahme des Auszugs: „das Haus Jakob“ entspricht „Israel“, und „aus einem Volk mit fremder Sprache“ entspricht „aus Ägypten“.'
  alternative: Die zweite Zeile rein appositionell lesen oder das Verb „zog“ ausdrücklich wiederholen.
  rationale: Der hebräische Vers verwendet synonymen Parallelismus und lässt das Verb in der zweiten Zeile aus. Die deutsche Fassung bewahrt diese poetische Ellipse, ohne den Zusammenhang zu verdecken.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit bewahrtem poetischem Parallelismus. „Haus Jakob“ erhält die biblische Kollektivbezeichnung; „mit fremder Sprache“ macht die sprachliche Fremdheit deutlich, ohne Feindseligkeit einzutragen.
