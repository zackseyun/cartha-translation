  text: הָיְתָ֣ה יְהוּדָ֣ה לְ/קָדְשׁ֑/וֹ יִ֝שְׂרָאֵ֗ל מַמְשְׁלוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/002.yaml
  text: Judah became his sanctuary[c][b][a], Israel his dominion.
translation:
  language: de
  text: Juda wurde zu seinem Heiligtum[a][b], Israel zu seinem Herrschaftsbereich[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Juda war sein Heiligtum.“ Das hebräische Verb kann hier sowohl einen Zustand („war“) als auch einen Übergang („wurde“) ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sein heiliger Ort“. Das hebräische Wort kann Heiligkeit oder einen heiligen Ort, ein Heiligtum, bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „sein Machtbereich“ oder „seine Herrschaft“. Das hebräische Wort steht formal im Plural, hat hier aber wahrscheinlich einen zusammenfassenden, abstrakten Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה
  choice: wurde zu
  rationale: Im Zusammenhang mit dem Auszug beschreibt היה hier am ehesten einen Übergang bzw. ein Ergebnis. „Wurde zu“ gibt diesen ereignishaften Sinn wieder; „war“ bleibt grammatisch möglich.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Eingebürgerte deutsche Form des Namens für Stamm beziehungsweise Gebiet Juda.
- source_word: לְקָדְשׁוֹ
  choice: zu seinem Heiligtum
  rationale: קֹדֶשׁ kann Heiligkeit oder einen heiligen Ort bezeichnen. Im Parallelismus mit dem Herrschaftsbereich liegt die konkrete Bedeutung „Heiligtum“ nahe; לְ wird zusammen mit היה idiomatisch durch „zu“ wiedergegeben.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Eingebürgerte deutsche Form des Namens für Volk beziehungsweise Nation Israel.
- source_word: מַמְשְׁלוֹתָיו
  choice: zu seinem Herrschaftsbereich
  rationale: Das Substantiv bezeichnet Herrschaft, Machtbereich oder das Gebiet, über das jemand herrscht. Obwohl die hebräische Form formal im Plural steht, ist hier wahrscheinlich ein abstrakter beziehungsweise umfassender Sinn gemeint; der Singular ist im Deutschen natürlich und wahrt den Parallelismus.
theological_decisions:
- issue: Bezug der maskulinen Possessivsuffixe
  choice: „seinem“ bezieht sich auf Gott, ohne ihn im Vers ausdrücklich zu benennen.
  alternative: Den Bezug durch „des HERRN“ ausdrücklich machen.
  rationale: Der Psalmzusammenhang macht Gott zum natürlichen Bezugspunkt. Das Pronomen bewahrt jedoch die knappe Ausdrucksweise des Hebräischen und fügt keinen Gottesnamen ein.
- issue: Poetisches Paar Juda und Israel
  choice: Beide Namen werden getrennt und parallel beibehalten.
  alternative: Beide Bezeichnungen zu einem einzigen Ausdruck für das Gottesvolk zusammenziehen.
  rationale: Die hebräische Dichtung nennt Juda und Israel bewusst in zwei parallelen Satzgliedern. Eine Harmonisierung würde die literarische Gestalt einebnen und könnte spätere Deutungen eintragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Zweigliedrigkeit und der Parallelismus des hebräischen Verses bleiben erhalten. „Herrschaftsbereich“ ist verständlicher und räumlich-konkreter als das gehobenere „Herrschaftsgebiet“, ohne die mögliche abstrakte Bedeutung „Herrschaft“ auszuschließen.
