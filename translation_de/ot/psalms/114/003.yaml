  text: The sea saw and fled[b][a]; the Jordan turned back.
translation:
  language: de
  text: Das Meer sah und floh[a]; der Jordan wandte sich zurück[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Poetische Anspielung auf den Durchzug durch das Meer beim Auszug aus Ägypten und auf das Zurückweichen des Jordan in Josuas Zeit.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich: »wandte sich nach hinten« oder »wandte sich rückwärts«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  choice: das Meer
  rationale: Der bestimmte Gattungsbegriff bezeichnet hier »das Meer«. Die historische Anspielung ist erkennbar, doch der hebräische Text nennt es nicht ausdrücklich »Schilfmeer«.
- source_word: רָאָה
  choice: sah es
  rationale: Das gewöhnliche Verb bedeutet »sehen«. Das Pronomen nimmt im Deutschen natürlich auf das zuvor geschilderte Handeln Gottes Bezug, ohne Gott ausdrücklich als Objekt einzusetzen.
- source_word: וַיָּנֹס
  choice: und floh
  rationale: נוס bedeutet »fliehen«. »Floh« ist knapp und bewahrt die lebendige Personifikation des Meeres.
- source_word: הַיַּרְדֵּן
  choice: der Jordan
  rationale: Der Flussname wird im Deutschen idiomatisch mit bestimmtem Artikel gebraucht.
- source_word: יִסֹּב לְאָחוֹר
  choice: wandte sich zurück
  rationale: Die Verbindung aus סבב und לְאָחוֹר beschreibt eine Bewegung nach hinten beziehungsweise zurück. »Wandte sich zurück« bildet sowohl das Verb als auch die Richtungsangabe natürlich ab.
theological_decisions:
- issue: Historisch-poetische Anspielung
  choice: Die personifizierte Darstellung von Meer und Jordan bleibt im Haupttext erhalten; die angedeuteten Ereignisse werden in einer Fußnote benannt.
  alternative: Die Durchquerung des Meeres und den Stillstand des Jordans ausdrücklich in den Haupttext aufnehmen.
  rationale: Der hebräische Vers setzt die Ereignisse poetisch voraus, benennt sie hier aber nicht ausdrücklich. Eine Erläuterung im Haupttext würde die knappe Bildsprache auflösen.
- issue: Objekt von רָאָה
  choice: »es« als kontextuellen Rückverweis verwenden
  alternative: 'Das Objekt ungenannt lassen: »Das Meer sah und floh«; oder ausdrücklich »ihn« schreiben.'
  rationale: Im Hebräischen steht kein ausgesprochenes Objekt. Im heutigen Deutschen wirkt »sah« ohne Objekt stark elliptisch; »es« bewahrt die kontextuelle Offenheit besser als das theologisch festlegendere »ihn«.
translation_notes:
  register: Knappes, gehobenes, aber gegenwärtiges Standarddeutsch. Der Parallelismus und die Personifikation der Gewässer bleiben erhalten; »wandte sich zurück« klingt natürlicher und etwas würdevoller als »drehte um«.
