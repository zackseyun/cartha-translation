source:
  edition: WLC
  text: ק֭וֹלִ/י אֶל יְהוָ֣ה אֶזְעָ֑ק ק֝וֹלִ֗/י אֶל יְהוָ֥ה אֶתְחַנָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/001.yaml
  text: With my voice I cry out to Yahweh[c][b][a]; with my voice I plead to Yahweh for mercy.
translation:
  language: de
  text: Mit meiner Stimme schreie ich zu Jahwe[a]; mit meiner Stimme flehe ich zu Jahwe um Erbarmen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell oft mit „der HERR“ wiedergegeben.'
    reason: divine_name
  - marker: b
    text: Das Hebräische wiederholt „mit meiner Stimme“ zur Hervorhebung und als poetischen Parallelismus.
    reason: literary_structure
lexical_decisions:
- source_word: קוֹלִי
  choice: mit meiner Stimme
  rationale: Die konkrete Wendung bewahrt die Hervorhebung der eigenen Stimme und ihre bewusste Wiederholung im poetischen Parallelismus; das glattere „laut“ würde dieses Bild abschwächen.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier die Ausrichtung des Rufens und Flehens auf Jahwe; „zu“ ist dafür im Deutschen die natürliche Entsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶזְעָק
  choice: schreie ich
  rationale: Das Verb זעק bezeichnet einen dringlichen, hörbaren Hilferuf. „schreien“ erhält diese Intensität besser als das neutralere „rufen“.
- source_word: אֶתְחַנָּן
  choice: flehe ich … um Erbarmen
  rationale: Die Hitpael-Form von חנן bezeichnet ein inständiges Bitten um Gunst oder Erbarmen. Die Formulierung ist gegenwärtiges, verständliches Deutsch und macht den im Verb enthaltenen Gegenstand der Bitte deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Eigenname JHWH. Die Umschrift „Jahwe“ wahrt den Unterschied zwischen diesem Namen und dem hebräischen Titel „Herr“.
- issue: Inhalt des Flehens in אֶתְחַנָּן
  choice: um Erbarmen
  alternative: ich flehe zu Jahwe
  rationale: Das Verb bezeichnet das Erbitten gnädiger Zuwendung, ohne im Hebräischen ein eigenes Objekt zu nennen. „um Erbarmen“ entfaltet diesen Verbsinn, ohne eine konkretere erbetene Hilfe festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener poetischer Vorderstellung und Wiederholung. Die leicht markierte Wendung „mit meiner Stimme“ folgt der hebräischen Bildlichkeit, bleibt jedoch verständlich.
