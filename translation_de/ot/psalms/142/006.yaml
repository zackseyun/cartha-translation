source:
  edition: WLC
  text: הַקְשִׁ֤יבָ/ה אֶֽל רִנָּתִ/י֮ כִּֽי דַלּ֪וֹתִ֫י מְאֹ֥ד הַצִּילֵ֥/נִי מֵ/רֹדְפַ֑/י כִּ֖י אָמְצ֣וּ מִמֶּֽ/נִּי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/006.yaml
  text: Attend to my cry[a], for I am brought very low; deliver me from my pursuers[c][b], for they are stronger than I.
translation:
  language: de
  text: Achte auf meinen Hilferuf[a], denn ich bin sehr geschwächt[b]. Rette mich vor meinen Verfolgern[c], denn sie sind stärker als ich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Höre aufmerksam auf meinen Ruf.“ Das hebräische Verb meint ein aufmerksames Hinhören.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ich bin sehr schwach“ beziehungsweise „ich bin ganz tief hinabgebracht“. Das Hebräische bezeichnet starke Schwächung oder Herabsetzung.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Befreie mich von denen, die mich verfolgen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Achte auf
  rationale: Der Imperativ von קשׁב bezeichnet aufmerksames Hören. „Achte auf“ bewahrt diesen Nachdruck und klingt in modernem Deutsch natürlich.
- source_word: רִנָּתִי
  choice: meinen Hilferuf
  rationale: רִנָּה kann einen lauten oder eindringlichen Ruf bezeichnen; im Klagekontext ist ein Ruf um Hilfe gemeint. „Hilferuf“ macht die situative Bedeutung verständlich, ohne ihn zu einem Lied umzudeuten.
- source_word: כִּי דַלּוֹתִי מְאֹד
  choice: denn ich bin sehr geschwächt
  rationale: דלל beschreibt hier ein starkes Geschwächt- oder Herabgebrachtsein; מְאֹד verstärkt die Aussage. Die Formulierung wahrt den resultativen Zustand, ohne im Deutschen eine nicht eindeutig genannte verursachende Instanz einzuführen.
- source_word: הַצִּילֵנִי
  choice: Rette mich
  rationale: Das Hifil von נצל bezeichnet die Befreiung aus konkreter Gefahr. „Rette mich“ ist im Deutschen die natürliche Bitte in einer akuten Verfolgungssituation.
- source_word: מֵרֹדְפַי
  choice: vor meinen Verfolgern
  rationale: Das substantivierte Partizip von רדף bezeichnet diejenigen, die dem Beter nachsetzen. Bei „retten“ ist im Deutschen „vor“ idiomatischer als „von“.
- source_word: כִּי אָמְצוּ מִמֶּנִּי
  choice: denn sie sind stärker als ich
  rationale: אמץ bezeichnet Stärke; מן hat hier vergleichende Funktion. Die Wiedergabe ist direkt, natürlich und erhält das Kräfteverhältnis.
theological_decisions:
- issue: Möglicher umfassender theologischer Sinn des Rettungswortes
  choice: Rette mich
  alternative: Befreie mich / Erlöse mich
  rationale: נצל meint hier konkret die Rettung vor menschlichen Verfolgern. „Rette mich“ bewahrt diesen unmittelbaren Sinn; „erlöse mich“ könnte im Deutschen unnötig einen umfassenderen lehrhaften Erlösungsbegriff nahelegen.
- issue: Deutung von דַלּוֹתִי als innerer Zustand oder äußere Erniedrigung
  choice: ich bin sehr geschwächt
  alternative: ich bin ganz tief hinabgebracht / ich bin sehr schwach
  rationale: Die hebräische Form lässt eine resultative Schwächung beziehungsweise starke Verminderung erkennen, ohne deren genaue Art festzulegen. Der Haupttext hält diese Offenheit fest; die Fußnote nennt mögliche Nuancen.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die parallelen Bitten und kausalen Begründungen des hebräischen Verses bleiben erhalten; vermeidbar altertümliche Wendungen wurden nicht verwendet.
