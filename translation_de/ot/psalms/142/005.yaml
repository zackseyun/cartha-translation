source:
  edition: WLC
  text: זָעַ֥קְתִּי אֵלֶ֗י/ךָ יְה֫וָ֥ה אָ֭מַרְתִּי אַתָּ֣ה מַחְסִ֑/י חֶ֝לְקִ֗/י בְּ/אֶ֣רֶץ הַֽ/חַיִּים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/005.yaml
  text: I cried out to you[a], O Yahweh; I said, “You are my refuge, my portion in the land of the living.”
translation:
  language: de
  text: 'Ich schrie zu dir, Jahwe; ich sagte: »Du bist meine Zuflucht, mein Anteil im Land der Lebenden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָעַקְתִּי
  choice: Ich schrie
  rationale: Das Verb bezeichnet einen eindringlichen Hilferuf; „schrie“ bewahrt seine Intensität und klingt im Deutschen mit „zu dir“ natürlich.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Die Präposition bezeichnet die Richtung des Rufens und wird im Deutschen idiomatisch mit „zu“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אָמַרְתִּי
  choice: ich sagte
  rationale: Die schlichte Vergangenheitsform entspricht dem üblichen Sinn von אמר und setzt die parallele Aussagefolge fort.
- source_word: אַתָּה
  choice: Du bist
  rationale: Das selbstständige Pronomen ist betont; die deutsche Prädikation erfordert die Kopula „bist“.
- source_word: מַחְסִי
  choice: meine Zuflucht
  rationale: „Zuflucht“ gibt den schützenden Ort treffend wieder und ist in poetischer Gebetssprache zugleich natürlich.
- source_word: חֶלְקִי
  choice: mein Anteil
  rationale: „Anteil“ bewahrt die Vorstellung des persönlich zugewiesenen Teils, ohne den Ausdruck enger als ausdrücklich erbrechtlich zu deuten.
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: im Land der Lebenden
  rationale: Die feste Wendung bezeichnet den Bereich des irdischen Lebens im Gegensatz zum Tod und bleibt in dieser Form bildhaft und verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von חֶלְקִי
  choice: mein Anteil
  alternative: mein Erbteil
  rationale: „Anteil“ erhält die mögliche Zuweisungs- und Bundesbedeutung, ohne ausdrücklich einen Erbvorgang vorauszusetzen, den der Vers nicht nennt.
translation_notes:
  register: Moderne, würdige Gebetssprache mit knapper Parallelstruktur. Die direkte Anrede bleibt ohne zusätzliches „o“, da dies im heutigen Standarddeutsch natürlicher ist; die überlieferte Bildsprache wird bewahrt.
