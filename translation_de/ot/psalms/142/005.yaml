  source_fidelity: 'Der Entwurf gibt die hebräische Abfolge und Syntax zuverlässig wieder: זָעַקְתִּי als intensives „Ich schrie“, אֵלֶיךָ als „zu dir“, die direkte Anrede mit dem Gottesnamen, אָמַרְתִּי als „ich sagte“ sowie die Prädikate „meine Zuflucht“ und „mein Anteil“. „Im Land der Lebenden“ bewahrt das Bild und die idiomatische Gegenüberstellung zum Bereich des Todes.'
