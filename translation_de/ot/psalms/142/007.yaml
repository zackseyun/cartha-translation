  text: ה֘וֹצִ֤יאָ/ה מִ/מַּסְגֵּ֨ר נַפְשִׁ/י֮ לְ/הוֹד֪וֹת אֶת שְׁ֫מֶ֥/ךָ בִּ֭/י יַכְתִּ֣רוּ צַדִּיקִ֑ים כִּ֖י תִגְמֹ֣ל עָלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/007.yaml
  text: Bring my soul out of prison[a], so that I may give thanks to your name; the righteous will gather around me, for you will deal bountifully with me.
translation:
  language: de
  text: Führe meine Seele aus dem Gefängnis heraus, damit ich deinem Namen danke! Die Gerechten werden sich um mich scharen[a], denn du wirst mir Gutes tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Die Gerechten werden mich umringen.“ Ungewöhnlicher kann die hebräische Wendung auch im Sinn von „Die Gerechten werden sich meinetwegen krönen“ oder „werden sich meinetwegen rühmen“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיאָה
  choice: Führe … heraus
  rationale: Der Hifil-Imperativ von יצא bittet darum, jemanden herauszuführen. Die Formulierung bewahrt das kausative Bild und klingt im Deutschen natürlich.
- source_word: מִמַּסְגֵּר
  choice: aus dem Gefängnis
  rationale: מַסְגֵּר bezeichnet einen Ort des Eingeschlossenseins. „Gefängnis“ ist die klare, kontextgerechte deutsche Entsprechung.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ kann Seele, Leben oder die ganze Person bezeichnen. „Meine Seele“ bewahrt hier die hebräische Ausdrucksweise und lässt deren umfassende Bedeutung offen.
- source_word: לְהוֹדוֹת אֶת שְׁמֶךָ
  choice: damit ich deinem Namen danke
  rationale: Der Infinitiv bezeichnet den Zweck der erbetenen Befreiung. ידה bedeutet hier danken beziehungsweise lobpreisen; „deinem Namen danken“ bewahrt die persönliche und bundestheologische Rede vom Namen Gottes.
- source_word: בִּי יַכְתִּרוּ
  choice: werden sich um mich scharen
  rationale: כתר kann im Hifil das Umgeben oder Umringen ausdrücken; בִּי markiert dabei die Person, um die herum dies geschieht. „Sich um mich scharen“ gibt das Bild verständlich wieder, ohne die schwierige Wendung zu stark festzulegen.
- source_word: צַדִּיקִים
  choice: die Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet gerechte Menschen; „die Gerechten“ ist knapp, würdig und im Deutschen geläufig.
- source_word: כִּי תִגְמֹל עָלָי
  choice: denn du wirst mir Gutes tun
  rationale: גמל mit על bezeichnet, wie jemand an einem anderen handelt, hier im positiven Sinn. Die Wiedergabe drückt erwartete göttliche Wohltat aus, ohne zwingend eine verdienstabhängige Belohnung zu behaupten.
theological_decisions:
- issue: Ob die Schlussaussage eine Belohnung aufgrund menschlichen Verdienstes meint
  choice: Erwartete gute Zuwendung Gottes
  alternative: Vergeltung oder Belohnung nach Verdienst
  rationale: גמל kann sowohl Vergeltung als auch wohltätiges Handeln bezeichnen. Im Zusammenhang der Bitte um Rettung liegt die positive Zuwendung nahe; „mir Gutes tun“ vermeidet jedoch eine weitergehende dogmatische Festlegung.
- issue: Wie die Reaktion der Gerechten zu verstehen ist
  choice: Sie scharen sich um den von Gott Geretteten
  alternative: 'Sie umringen ihn; oder ungewöhnlicher: Sie krönen sich beziehungsweise rühmen sich seinetwegen'
  rationale: Die seltene Konstruktion בִּי יַכְתִּרוּ ist mehrdeutig. Der Haupttext bietet die im Kontext gut verständliche räumlich-gemeinschaftliche Lesart; die übrigen Möglichkeiten werden in der Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Gebets- und Psalmton. Der Parallelismus bleibt erhalten; die schwierige Wendung über die Gerechten wird im Haupttext natürlich wiedergegeben und in der Fußnote als echte lexikalische Mehrdeutigkeit ausgewiesen.
