    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁפֹּךְ
  choice: Ich schütte … aus
  rationale: Die Qal-Form von שׁפך bedeutet „ausgießen/ausschütten“. „Eine Klage ausschütten“ bewahrt das hebräische Bild einer ungehemmten Äußerung und klingt im Deutschen natürlich.
- source_word: לְפָנָיו
  choice: vor ihm / ihm
  rationale: Wörtlich „vor seinem Angesicht“. Im ersten Halbvers bewahrt „vor ihm“ den räumlich-relationalen Ausdruck; im zweiten gibt „ihm“ denselben Adressaten idiomatisch wieder, ohne schwerfällige Wiederholung.
- source_word: שִׂיחִי
  choice: meine Klage
  rationale: שׂיח kann Nachsinnen, Äußerung oder Klage bezeichnen. Im Kontext dieses Klagepsalms und parallel zu „meine Not“ liegt die Bedeutung „Klage“ nahe, ohne die lexikalische Alternative zu verschweigen.
- source_word: צָרָתִי
  choice: meine Not
  rationale: צָרָה bezeichnet Bedrängnis, Not oder Drangsal. „Not“ ist prägnant, gegenwärtig und lässt offen, ob das Leiden äußerlich oder innerlich erfahren wird.
- source_word: אַגִּיד
  choice: lege ich … dar
  rationale: Der Hifil von נגד bedeutet „mitteilen, kundtun, darlegen“. „Darlegen“ vermittelt hier eine bewusste, an Gott gerichtete Schilderung und ist im Deutschen würdevoll und verständlich.
