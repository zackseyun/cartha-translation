translation:
  language: de
  text: Vor ihm schütte ich meine Klage aus[a]; vor ihm tue ich meine Not kund[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Sinnen“ beziehungsweise „meine Gedanken“. Das hebräische Wort שִׂיחִי kann Nachsinnen oder Klage bezeichnen; im Zusammenhang dieses Klagepsalms ist wahrscheinlich eine ausgesprochene Klage gemeint.'
    reason: lexical_alternative
  - marker: b
