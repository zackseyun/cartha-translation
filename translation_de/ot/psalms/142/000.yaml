  text: מַשְׂכִּ֥יל לְ/דָוִ֑ד בִּ/הְיוֹת֖/וֹ בַ/מְּעָרָ֣ה תְפִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/000.yaml
  text: A Maskil[a] of David[b], when he was in the cave. A prayer.
translation:
  language: de
  text: Ein Maskil[a] von David[b], als er in der Höhle war. Ein Gebet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Maskil, eine Fachbezeichnung in Psalmüberschriften; möglicherweise ist eine betrachtende oder unterweisende Dichtung gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »für David« beziehungsweise »David zugehörig«; die hebräische Überschrift kann Urheberschaft, Widmung oder Zuordnung ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Der Ausdruck ist eine Fachbezeichnung in Psalmüberschriften, deren genaue Bedeutung unsicher ist. Die Transliteration bewahrt diese Offenheit, ohne eine Deutung wie »Lehrgedicht« oder »Betrachtung« festzuschreiben.
- source_word: לְדָוִד
  choice: von David
  rationale: Die Präposition לְ kann in Psalmüberschriften Urheberschaft, Zugehörigkeit, Widmung oder Zuordnung bezeichnen. »Von David« ist im Deutschen idiomatisch und lässt mehr Offenheit als »verfasst von David«.
- source_word: בִּהְיוֹתוֹ
  choice: als er … war
  rationale: Die Verbindung aus בְּ und dem Infinitiv von היה mit pronominalem Suffix hat hier temporale Bedeutung. »Als er … war« gibt sie natürlich und präzise wieder.
- source_word: בַמְּעָרָה
  choice: in der Höhle
  rationale: Der hebräische Ausdruck ist durch den Artikel bestimmt. »In der Höhle« wahrt diese Bestimmtheit, ohne festzulegen, welche Höhle gemeint ist.
- source_word: תְפִלָּה
  choice: Ein Gebet
  rationale: Das Substantiv dient als abschließende Gattungsbezeichnung der Überschrift. Als eigener kurzer Satz bleibt seine titelartige Funktion erkennbar.
theological_decisions:
- issue: Bezug von לְדָוִד in der Psalmüberschrift
  choice: von David
  alternative: für David; David zugehörig
  rationale: Der hebräische Wortlaut legt nicht eindeutig fest, ob Urheberschaft, Widmung oder anderweitige Zuordnung gemeint ist. Die Übersetzung soll diese Spannung nicht lehrmäßig entscheiden.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe, aus mehreren Gliedern bestehende Form der hebräischen Psalmüberschrift bleibt erhalten; der unbekannte Fachbegriff wird nicht interpretierend aufgelöst.
