  source_fidelity: 'Die Überschrift gibt alle fünf hebräischen Bestandteile angemessen wieder: מַשְׂכִּיל bleibt als fachsprachliches „Maskil“ transliteriert; לְדָוִד wird mit dem in Überschriften idiomatischen, nicht übermäßig festlegenden „von David“ wiedergegeben; בִּהְיוֹתוֹ ist korrekt temporal als „als er … war“ gefasst; der bestimmte Artikel in בַּמְּעָרָה wird durch „der Höhle“ abgebildet; und תְפִלָּה erscheint passend als abschließende Gattungsangabe „Ein Gebet.“ Die knappe Satzgliederung ist im Deutschen verständlich und wahrt den Charakter einer Überschrift.'
