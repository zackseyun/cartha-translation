  text: הַבֵּ֤יט יָמִ֨ין וּ/רְאֵה֮ וְ/אֵֽין לִ֪/י מַ֫כִּ֥יר אָבַ֣ד מָנ֣וֹס מִמֶּ֑/נִּי אֵ֖ין דּוֹרֵ֣שׁ לְ/נַפְשִֽׁ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/004.yaml
  text: 'Look to the right and see: there is no one who recognizes me[a]; refuge has perished from me[b]; no one seeks my life.'
translation:
  language: de
  text: 'Blicke nach rechts und sieh: Niemand erkennt mich; Zuflucht ist mir entschwunden[a]; niemand fragt nach meinem Leben[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eine Fluchtmöglichkeit ist mir genommen.“ Das hebräische Substantiv kann einen Zufluchtsort oder einen Weg zur Flucht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach meiner Seele“ beziehungsweise „nach mir“. Das hebräische Wort nefesch bezeichnet hier wahrscheinlich das Leben oder die ganze Person.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּיט
  choice: Blick
  rationale: Der Imperativ von נבט fordert unmittelbar zum Hinschauen auf; „Blick“ ist knapp, eindringlich und im modernen Deutsch natürlich.
- source_word: יָמִין
  choice: nach rechts
  rationale: Das räumliche Substantiv bezeichnet die rechte Seite, möglicherweise den Ort eines Beistands; „nach rechts“ bewahrt das konkrete Bild.
- source_word: וּרְאֵה
  choice: und sieh
  rationale: Der zweite Imperativ verstärkt den ersten. Die Wiedergabe erhält die bewusste Wiederholung.
- source_word: מַכִּיר
  choice: erkennt mich
  rationale: Das Partizip kann das Erkennen oder anerkennende Wahrnehmen einer Person bezeichnen. „Erkennt mich“ lässt diese soziale Dimension offen.
- source_word: אָבַד
  choice: ist … entschwunden
  rationale: Das Qal-Perfekt bezeichnet, dass etwas verloren oder nicht mehr erreichbar ist. „Entschwunden“ gibt die Endgültigkeit wieder, ohne im Deutschen eine unnatürliche Aussage vom „Sterben“ der Zuflucht zu bilden.
- source_word: מָנוֹס
  choice: Zuflucht
  rationale: Das Wort kann einen Zufluchtsort oder eine Fluchtmöglichkeit bezeichnen. „Zuflucht“ passt zum Klagekontext und bewahrt die Bildhaftigkeit.
- source_word: מִמֶּנִּי
  choice: mir
  rationale: Das hebräische „von mir“ beschreibt hier, dass die Zuflucht dem Beter entzogen beziehungsweise aus seiner Reichweite verschwunden ist. Der deutsche Dativ gibt dies idiomatisch wieder.
- source_word: דּוֹרֵשׁ
  choice: fragt nach
  rationale: דרש bedeutet suchen oder sich erkundigen. „Nach jemandes Leben fragen“ vermittelt hier die fehlende Anteilnahme, ohne die Aussage einfach zu „sich kümmern“ abzuschwächen.
- source_word: לְנַפְשִׁי
  choice: nach meinem Leben
  rationale: נפש bezeichnet in diesem Zusammenhang wahrscheinlich das Leben beziehungsweise die Person des Beters. „Mein Leben“ ist verständlich und vermeidet eine unnötige Trennung von Leib und Seele.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im Klagekontext
  choice: mein Leben
  alternative: meine Seele / mich
  rationale: Im Zusammenhang von Verlassenheit und fehlender Rettung bezeichnet נֶפֶשׁ am ehesten das bedrohte Leben oder die ganze Person. Die Fußnote bewahrt die traditionelle Alternative „Seele“.
- issue: Bedeutung von דּוֹרֵשׁ לְנַפְשִׁי
  choice: fragt nach meinem Leben
  alternative: kümmert sich um mich / sucht meine Seele
  rationale: Die Formulierung hält sowohl das konkrete Suchen beziehungsweise Nachfragen als auch den darin liegenden Gedanken der Anteilnahme offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Aufforderung „Blick … und sieh“ bewahrt den poetischen Nachdruck. Die knappe Formulierung „Zuflucht ist mir entschwunden“ entspricht dem verdichteten Stil des hebräischen Klagelieds.
