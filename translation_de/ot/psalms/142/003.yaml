base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/003.yaml
  text: When my spirit grows faint within me[a], you know my path. On the way where I walk[b], they have hidden a trap for me.
translation:
  language: de
  text: Wenn mein Geist in mir erlahmt[a], kennst du meinen Pfad. Auf dem Weg, den ich gehe, haben sie mir heimlich eine Falle gelegt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn mein Geist in mir überwältigt ist.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „haben sie mir eine Schlinge verborgen“.'
    reason: literal_rendering
lexical_decisions:
- source_word: בְּהִתְעַטֵּף
  choice: Wenn … verzagt
  rationale: Die Präposition בְּ mit dem Infinitiv bildet einen temporalen Nebensatz. התעטף bezeichnet hier ein Schwachwerden oder Überwältigtsein; „verzagt“ gibt die innere Erschöpfung knapp und in würdigem Gegenwartsdeutsch wieder.
- source_word: רוּחִי
  choice: mein Geist
  rationale: רוּחַ bezeichnet hier das innere Leben des Beters, nicht Wind oder bloß den Atem. „Mein Geist“ wahrt die Bildsprache und bleibt nah am Hebräischen.
- source_word: עָלַי
  choice: in mir
  rationale: Wörtlich steht „über/auf mir“; im Zusammenhang mit dem verzagenden Geist bezeichnet die Wendung den inneren Zustand. „In mir“ ist im Deutschen natürlich, ohne die Aussage auszuweiten.
- source_word: יָדַעְתָּ
  choice: kennst du
  rationale: Das Qatal von ידע kann in poetischer Sprache einen gegenwärtigen Zustand ausdrücken. „Kennst du“ bezeichnet Gottes fortdauernde Kenntnis des Weges des Beters.
- source_word: נְתִיבָתִי
  choice: meinen Pfad
  rationale: נְתִיבָה bezeichnet einen Pfad oder eine Bahn. „Pfad“ erhält das Wegmotiv und unterscheidet sich sprachlich vom folgenden אֹרַח.
- source_word: בְּאֹרַח זוּ אֲהַלֵּךְ
  choice: Auf dem Weg, den ich gehe
  rationale: זוּ fungiert hier als Relativpartikel. Die Formulierung gibt die fortgesetzte Bewegung des Beters natürlich wieder und bewahrt das Wegbild.
- source_word: טָמְנוּ פַח לִי
  choice: haben sie mir eine Falle gestellt
  rationale: טמן bezeichnet das verborgene Anbringen einer Falle. Die idiomatische deutsche Verbindung „eine Falle stellen“ macht die feindliche Absicht klar; das Moment des Verbergens ist darin sachgemäß enthalten.
theological_decisions:
- issue: Gottes Kenntnis des Weges des Beters
  choice: kennst du meinen Pfad
  alternative: kanntest du meinen Pfad
  rationale: Das hebräische Qatal kann hier stativ und gegenwärtig verstanden werden. Die Übersetzung bewahrt den unmittelbaren Gebetszusammenhang und behauptet nicht mehr als Gottes Kenntnis des Weges in der gegenwärtigen Not.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Wegmetaphorik bleibt erhalten; „verzagt“ ist verständlich und zugleich psalmangemessen. Die zweite Fußnote dokumentiert die konkretere hebräische Bildsprache hinter der idiomatischen Haupttextfassung.
