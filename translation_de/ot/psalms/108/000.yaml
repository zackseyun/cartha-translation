lexical_decisions:
- source_word: שִׁיר
  choice: Lied
  rationale: Das Substantiv bezeichnet allgemein ein Lied. In Verbindung mit מִזְמוֹר bleibt durch die schlichte Wiedergabe „Lied“ die zweiteilige Gattungsangabe erhalten, ohne den Inhalt vorschnell als Lobgesang festzulegen.
- source_word: מִזְמוֹר
  choice: Psalm
  rationale: In Psalmenüberschriften bezeichnet das Wort eine dichterische, musikalisch geprägte Komposition. „Psalm“ ist die sachlich genaue und im Deutschen etablierte Wiedergabe.
- source_word: לְדָוִד
  choice: Davids
  rationale: Die hebräische Präposition לְ kann in Psalmenüberschriften Autorschaft, Widmung, Zugehörigkeit oder Verbindung ausdrücken. Der deutsche Genitiv bewahrt diese Mehrdeutigkeit besser als die eindeutigeren Formulierungen „von David“ oder „für David“.
theological_decisions:
- issue: Bedeutung der davidischen Überschrift
  choice: Die mehrdeutige Zuordnung „Davids“ bleibt erhalten.
  alternative: „von David“ oder „für David“
  rationale: Die Überschrift legt nicht eindeutig fest, ob David als Verfasser, Empfänger oder Bezugsperson gemeint ist. Die Übersetzung soll keine engere historische Aussage treffen als der hebräische Text.
translation_notes:
  register: Knapp und würdevoll entsprechend einer Psalmenüberschrift. Die traditionelle Gattungsbezeichnung „Psalm“ bleibt erhalten; der Genitiv „Davids“ klingt natürlich und wahrt die Mehrdeutigkeit des Hebräischen.
