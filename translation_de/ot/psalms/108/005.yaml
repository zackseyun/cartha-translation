  text: ר֣וּמָ/ה עַל שָׁמַ֣יִם אֱלֹהִ֑ים וְ/עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/005.yaml
  text: Be exalted above the heavens[a], O God[b], and your glory over all the earth.
translation:
  language: de
  text: Erhebe dich über die Himmel[a], Gott, und über die ganze Erde deine Herrlichkeit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sei erhaben über den Himmeln.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und über die ganze Erde deine Herrlichkeit“. Das Verb ist aus dem poetischen Parallelismus zu erschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּמָה
  choice: Erhebe dich
  rationale: Der Qal-Imperativ von רום richtet sich an Gott und kann sowohl räumliches Aufsteigen als auch Erhöhung im Sinn von Ehre ausdrücken. „Erhebe dich“ bewahrt diese Bildhaftigkeit und die Gebetsform, ohne sie rein räumlich oder rein doxologisch festzulegen.
- source_word: עַל שָׁמַיִם
  choice: über die Himmel
  rationale: עַל bezeichnet hier die Erhöhung über den himmlischen Bereich hinaus. Der Plural „die Himmel“ gibt die hebräische Form wieder und wahrt den kosmischen Parallelismus mit der Erde.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Wort steht als direkte Anrede. Im heutigen Deutschen kennzeichnet die Satzstellung die Anrede ausreichend; ein zusätzliches „o“ ist nicht nötig.
- source_word: וְעַל כָּל הָאָרֶץ
  choice: und über die ganze Erde
  rationale: Im kosmischen Gegensatz zu den Himmeln meint הָאָרֶץ die Erde als Ganze. „Über die ganze Erde“ folgt eng der hebräischen Wortfolge.
- source_word: כְּבוֹדֶךָ
  choice: deine Herrlichkeit
  rationale: כָּבוֹד bezeichnet hier Gottes offenbar werdende Majestät und Ehre. „Herrlichkeit“ ist im Deutschen die sachlich und stilistisch passende Wiedergabe.
theological_decisions:
- issue: Das im zweiten Halbvers fehlende Verb
  choice: 'Die Nominalzeile bleibt ohne ergänztes Verb: „und über die ganze Erde deine Herrlichkeit“'
  alternative: „und über der ganzen Erde sei deine Herrlichkeit“
  rationale: Im Hebräischen fehlt im zweiten Halbvers ein ausdrückliches Verb. Die knappe deutsche Fügung bewahrt diese Offenheit und lässt sowohl die Fortführung der Bitte aus dem ersten Halbvers als auch eine feierliche Aussage anklingen, ohne eine Deutung grammatisch festzuschreiben.
translation_notes:
  register: Poetisch, würdig und knapp. Die ungewöhnliche, aber verständliche Ellipse im zweiten Halbvers bildet die hebräische Nominalzeile nach; die direkte Anrede „Gott“ bleibt ohne das heute gehoben-archaisch wirkende „o“.
