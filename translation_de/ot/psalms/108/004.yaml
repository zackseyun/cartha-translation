  text: כִּֽי גָד֣וֹל מֵֽ/עַל שָׁמַ֣יִם חַסְדֶּ֑/ךָ וְֽ/עַד שְׁחָקִ֥ים אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/004.yaml
  text: For your steadfast love is great above the heavens[a], and your faithfulness reaches to the clouds.
translation:
  language: de
  text: Denn deine beständige Liebe reicht weit über den Himmel hinaus, und deine Treue bis zu den Wolken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und deine Wahrheit bis zu den Wolken“.'
    reason: lexikalische Alternative für אֲמִתֶּךָ
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung für den vorausgehenden Lobpreis ein und klingt in deutscher Poesie natürlich.
- source_word: גָדוֹל מֵעַל שָׁמַיִם
  choice: reicht weit über den Himmel hinaus
  rationale: Gibt die große, den Himmel übersteigende Ausdehnung idiomatisch wieder und bewahrt das räumliche Bild.
- source_word: חַסְדֶּךָ
  choice: deine beständige Liebe
  rationale: Erfasst die dauerhafte, verlässliche und zugewandte Bedeutung von חֶסֶד, ohne den Begriff ausdrücklich auf eine bestimmte Bundestheologie festzulegen.
- source_word: וְעַד
  choice: und ... bis zu
  rationale: Die zweite Vershälfte übernimmt sinngemäß die Vorstellung des Reichens aus dem Parallelismus; die knappe Ellipse bleibt im Deutschen verständlich.
- source_word: שְׁחָקִים
  choice: den Wolken
  rationale: Bewahrt das konkrete poetische Bild der hohen Himmelsregionen.
- source_word: אֲמִתֶּךָ
  choice: deine Treue
  rationale: Im Parallelismus mit חֶסֶד bezeichnet אֱמֶת besonders Gottes Verlässlichkeit; die Grundbedeutung „Wahrheit“ bleibt als Alternative in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe der parallelen Eigenschaften Gottes חֶסֶד und אֱמֶת
  choice: „beständige Liebe“ und „Treue“
  alternative: „Gnade/Barmherzigkeit“ und „Wahrheit“
  rationale: Die gewählte Fassung vermittelt den relationalen Akzent des hebräischen Wortpaars in verständlichem modernem Deutsch, ohne die lexikalisch mögliche Bedeutung „Wahrheit“ zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Rhythmus. „Himmel“ steht entsprechend dem üblichen deutschen Kollektivgebrauch im Singular; die räumliche Steigerung und der elliptische Parallelismus des Hebräischen bleiben erkennbar.
