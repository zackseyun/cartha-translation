source:
  edition: WLC
  text: נָכ֣וֹן לִבִּ֣/י אֱלֹהִ֑ים אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה אַף כְּבוֹדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/001.yaml
  text: My heart is steadfast[a], O God; I will sing and make music, even with my glory.
translation:
  language: de
  text: Mein Herz ist fest, Gott; ich will singen und musizieren, auch mit meiner Herrlichkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »meine Herrlichkeit«. Gemeint sein können das innerste oder ganze Wesen des Beters, möglicherweise auch seine Zunge als Werkzeug des Lobes. Die hebräische Formulierung ist knapp und lässt die genaue Beziehung zum Verb unausgesprochen.
    reason: lexikalische Alternative und syntaktische Mehrdeutigkeit
lexical_decisions:
- source_word: נָכוֹן
  choice: fest
  rationale: Das Wort bezeichnet etwas Gefestigtes, Beständiges oder Bereites. »Fest« bewahrt hier knapp und natürlich die innere Entschlossenheit zum Lob.
- source_word: לִבִּי
  choice: mein Herz
  rationale: Im Hebräischen steht das Herz häufig für das innere Wesen, den Willen und die Empfindungen; die geläufige deutsche Wendung bewahrt dieses Bild.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv ist hier eine direkte Anrede. Im modernen Deutschen ist »Gott« ohne das feierlich-altertümliche »o« natürlich und würdig.
- source_word: אָשִׁירָה
  choice: ich will singen
  rationale: Die Kohortativform drückt den entschlossenen Willen des Sprechers aus; »ich will« gibt diese Selbstverpflichtung im Deutschen klar wieder.
- source_word: וַאֲזַמְּרָה
  choice: und musizieren
  rationale: זמר im Piel kann Singen zum Lob und musikalisches Spiel bezeichnen. »Musizieren« erhält den poetischen Parallelismus, ohne »singen« bloß zu wiederholen.
- source_word: אַף
  choice: ja
  rationale: Die Partikel verstärkt oder erweitert die Aussage. »Ja« leitet die überraschende Schlusswendung in natürlichem poetischem Deutsch ein.
- source_word: כְּבוֹדִי
  choice: mit meiner Herrlichkeit
  rationale: Wörtlich bedeutet das Wort »meine Herrlichkeit/Ehre«. Die bewusst ungewöhnliche Bildsprache wird im Haupttext bewahrt; das ergänzte »mit« macht den elliptischen hebräischen Satz im Deutschen lesbar, ohne die Metapher auf eine einzige Deutung festzulegen.
theological_decisions:
- issue: Deutung von כְּבוֹדִי in der poetischen Sprache des Lobes
  choice: meine Herrlichkeit
  alternative: mein ganzes Wesen; meine Seele; meine Zunge
  rationale: Die hebräische Metapher ist mehrdeutig. Sie kann das innerste oder ganze Wesen des Beters und möglicherweise die Zunge als Werkzeug des Lobes bezeichnen. Der Haupttext bewahrt daher die wörtliche Bildsprache, während die Fußnote mögliche Deutungen nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Die direkte Anrede »Gott« und die Willensform »ich will« vermeiden unnötig altertümliche Sprache; die ungewöhnliche Schlussmetapher bleibt bewusst erhalten.
