  terminology: „Gott“, „Heiligkeit“, „jubeln“, „Sichem“, „Sukkot“ und „ausmessen“ sind angemessen. Die etablierte deutsche Namensform „Sichem“ ist richtig. Die Alternative „bei seiner Heiligkeit“ ist als deutsche Wiedergabe von „by his holiness“ nicht idiomatisch; „durch seine Heiligkeit“ ist verständlicher, wobei die Fußnote die Mehrdeutigkeit knapp benennt.
