  text: אֱלֹהִ֤ים דִּבֶּ֥ר בְּ/קָדְשׁ֗/וֹ אֶעְלֹ֥זָה אֲחַלְּקָ֥ה שְׁכֶ֑ם וְ/עֵ֖מֶק סֻכּ֣וֹת אֲמַדֵּֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/007.yaml
  text: 'God has spoken in his holiness: “I will exult[b][a]; I will divide up Shechem and measure out the Valley of Succoth.”'
translation:
  language: de
  text: 'Gott hat in seiner Heiligkeit[a] gesprochen: »Ich will jubeln[b]; Sichem will ich aufteilen und das Tal von Sukkot ausmessen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in seinem Heiligtum« oder »durch seine Heiligkeit«. Der hebräische Ausdruck kann Gottes Heiligkeit oder einen ihm zugehörigen heiligen Ort bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ich will frohlocken.« Das hebräische Verb bezeichnet überschwänglichen, triumphierenden Jubel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das singularische Verb דִּבֶּר zeigt, dass hier der Gott Israels gemeint ist.
- source_word: דִּבֶּר
  choice: hat gesprochen
  rationale: Das Perfekt bezeichnet eine abgeschlossene göttliche Äußerung mit fortdauernder Bedeutung; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: בְּקָדְשׁוֹ
  choice: in seiner Heiligkeit
  rationale: Die Wendung bezeichnet am ehesten Gottes Heiligkeit als Sphäre oder Wesensqualität seines Redens; der mögliche Ortsbezug bleibt in einer Fußnote erhalten.
- source_word: אֶעְלֹזָה
  choice: ich will jubeln
  rationale: Das Verb drückt freudigen, triumphierenden Jubel aus. »Jubeln« ist im heutigen Deutsch natürlich und bewahrt den gehobenen Ton.
- source_word: אֲחַלְּקָה
  choice: will ich verteilen
  rationale: Im Zusammenhang territorialer Herrschaft bezeichnet das Verb das Aufteilen oder Zuteilen von Land.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Die im Deutschen etablierte biblische Form des Ortsnamens wird verwendet.
- source_word: וְעֵמֶק סֻכּוֹת
  choice: und das Tal von Sukkot
  rationale: Die hebräische Genitivverbindung wird als natürlicher deutscher Ortsausdruck wiedergegeben.
- source_word: אֲמַדֵּד
  choice: ausmessen
  rationale: Die Piel-Form bezeichnet ein genaues Vermessen, hier im Rahmen souveräner territorialer Verfügung.
theological_decisions:
- issue: Sprecher und Umfang der direkten Rede
  choice: Die Verben in der ersten Person werden als Gottes eigene Rede über seinen souveränen Anspruch auf das Land verstanden.
  alternative: Nach der Mitteilung, dass Gott gesprochen hat, könnte der Psalmist selbst in der ersten Person weiterreden.
  rationale: Die Syntax legt nahe, dass die mit »Gott hat gesprochen« eingeleitete direkte Rede fortgesetzt wird; auch die parallele Stelle in Psalm 60 und die Sprache territorialer Verfügung stützen diese Lesart.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-poetischem Klang. Die Voranstellung der Ortsnamen in den parallelen Satzgliedern bewahrt die hebräische Hervorhebung, ohne unnatürlich zu wirken.
