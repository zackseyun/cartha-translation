  source_fidelity: 'Die Grundübersetzung gibt die hebräische Syntax und die direkte Gottesrede zuverlässig wieder: אֱלֹהִים mit Singularverb ist „Gott“, die Perfektform kann idiomatisch mit „hat gesprochen“ wiedergegeben werden, und die folgenden Kohortative/Imperfekte stehen innerhalb der Gottesrede. „in seiner Heiligkeit“ ist für בְּקָדְשׁוֹ eine vertretbare Hauptlesart; die Ortslesart muss als Alternative erhalten bleiben. Bei אֲחַלְּקָה ist jedoch „Sichem will ich verteilen“ im Deutschen semantisch und idiomatisch weniger passend, weil es nahelegt, Sichem werde an mehrere Empfänger verteilt. „Sichem will ich aufteilen“ gibt das territoriale Teilen unmittelbar wieder.'
