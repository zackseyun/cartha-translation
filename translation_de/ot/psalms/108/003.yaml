id: PSA.108.3
reference: Psalms 108:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אוֹדְ/ךָ֖ בָ/עַמִּ֥ים יְהוָ֑ה וַ֝/אֲזַמֶּרְ/ךָ֗ בַּל אֻמִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/003.yaml
  text: I will give thanks to you among the peoples[a], O Yahweh[b], and I will sing praise to you among the nations.
translation:
  language: de
  text: Ich will dir danken[a] unter den Völkern[b], Jahwe, und dir unter den Nationen lobsingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dich preisen.'
    reason: lexical_alternative
  - marker: b
    text: „Völker“ und „Nationen“ sind hier parallele Bezeichnungen für den internationalen Hörerkreis des Lobes.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Ich will dir danken
  rationale: Das Hifil von ידה bezeichnet in Psalmen häufig dankendes, öffentliches Preisen. „Dir danken“ ist im Deutschen natürlich und bewahrt die direkte Hinwendung zu Gott; die Bedeutung „dich preisen“ bleibt in einer Fußnote sichtbar.
- source_word: בָעַמִּים
  choice: unter den Völkern
  rationale: Der Plural von עַם bezeichnet hier mehrere Völker und damit den internationalen Kreis, in dem das Lob erklingen soll.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen übliche Form.
- source_word: וַאֲזַמֶּרְךָ
  choice: und dir … lobsingen
  rationale: Das Piel von זמר bezeichnet musikalisches Singen zum Lob. „Lobsingen“ verbindet den musikalischen und den doxologischen Sinn knapp und würdig.
- source_word: בַּל
  choice: unter
  rationale: Die poetische Präposition steht parallel zu בָ in der ersten Vershälfte. „Unter“ bewahrt diesen Parallelismus.
- source_word: אֻמִּים
  choice: den Nationen
  rationale: אֻמִּים bezeichnet Völker beziehungsweise Nationen. „Nationen“ unterscheidet den Ausdruck von עַמִּים, ohne den parallelen internationalen Bezug aufzulösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst und nicht einen Titel. Die Wiedergabe „Jahwe“ erhält diesen Eigenname-Charakter.
- issue: Bedeutungsumfang von ידה
  choice: dir danken
  alternative: dich preisen
  rationale: Im Kontext des Psalms umfasst das Verb sowohl Dank als auch anerkennendes Lob. Die Hauptübersetzung setzt den gut passenden Dankaspekt, während die Fußnote die echte lexikalische Alternative offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt der poetischen Zweigliedrigkeit des Hebräischen; „lobsingen“ bewahrt den gehobenen Psalmton, bleibt aber allgemein verständlich.
