lexical_decisions:
- source_word: עוּרָה
  choice: Wach auf
  rationale: Der Imperativ von עור ist als poetischer Weckruf an die genannten Instrumente wiedergegeben. Der Singular bleibt erhalten, obwohl zwei koordinierte Instrumente folgen.
- source_word: הַנֵּבֶל
  choice: Harfe
  rationale: נבל bezeichnet ein Saiteninstrument. „Harfe“ ist im modernen Deutschen verständlich und unterscheidet sich klar von der folgenden Leier.
- source_word: וְכִנּוֹר
  choice: und Leier
  rationale: כינור wird gewöhnlich als Leier bestimmt. Die eigenständige Wiedergabe bewahrt die Nennung zweier verschiedener Instrumente.
- source_word: אָעִירָה
  choice: Ich will … wecken
  rationale: Die Kohortativform in der 1. Person Singular drückt den entschlossenen Vorsatz des Sprechers aus. „wecken“ greift zugleich denselben hebräischen Wortstamm wie der eröffnende Imperativ auf.
- source_word: שָּׁחַר
  choice: die Morgenröte
  rationale: שחר bezeichnet die Morgendämmerung beziehungsweise den Tagesanbruch. „Morgenröte“ bewahrt das lebendige poetische Bild und klingt im Deutschen würdevoll und natürlich.
