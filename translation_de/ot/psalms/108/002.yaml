  yaml_path: translation/ot/psalms/108/002.yaml
  text: Awake[a], harp and lyre; I will awaken the dawn.
translation:
  language: de
  text: Wach auf, Harfe und Leier! Ich will die Morgenröte wecken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das ist ein poetisches Bild: Der Beter steht noch vor Tagesanbruch auf, um Gott zu loben, als würde sein Lob die Morgenröte wecken.'
