  yaml_path: translation/ot/psalms/108/009.yaml
  text: Moab is my washbasin[a]; on Edom I throw my sandal[c][b]; over Philistia I shout in triumph.
translation:
  language: de
  text: Moab ist meine Waschschüssel[a]; auf Edom werfe ich meine Sandale[b]; über das Philisterland jauchze ich[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Waschtopf“. Gemeint ist ein Gefäß zum Waschen; das Bild drückt Moabs Erniedrigung oder Unterwerfung aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „auf Edom schleudere ich meinen Schuh“. Die Geste steht wahrscheinlich für Herrschaft oder Besitzanspruch über Edom.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „über das Philisterland erhebe ich einen lauten Ruf“ oder „einen Schlachtruf“. Das hebräische Verb kann einen jubelnden oder kriegerischen Ruf bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: mein Waschbecken
  rationale: סִיר bezeichnet ein Gefäß bzw. Becken, רַחְצִי bestimmt es als zum Waschen dienend. „Waschbecken“ gibt das konkrete Bild in heutigem Deutsch klar wieder; die Metapher drückt Erniedrigung oder Unterwerfung aus.
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: werfe ich meine Sandale
  rationale: Die Hifil-Form von שלך bedeutet „werfen“. נַעַל bezeichnet Fußbekleidung; „Sandale“ ist im altorientalischen Zusammenhang anschaulich und bewahrt das konkrete Bild einer Herrschafts- oder Besitzgeste.
- source_word: עַל / עֲלֵי
  choice: auf / über
  rationale: Die Präposition kann räumliche und gegen jemanden gerichtete Nuancen tragen. „Auf Edom“ passt zur Wurfgeste, „über das Philisterland“ zum dort erhobenen Jubelruf.
- source_word: אֶתְרוֹעָע
  choice: juble ich laut
  rationale: Die Verbform bezeichnet das Erheben eines lauten Rufes, der jubelnd oder kriegerisch sein kann. „juble ich laut“ gibt im Siegeszusammenhang Lautstärke und Triumph wieder, ohne einen ausschließlich militärischen Fachsinn festzulegen.
- source_word: פְלֶשֶׁת
  choice: das Philisterland
  rationale: Der hebräische Name bezeichnet das Gebiet der Philister. „Philisterland“ ist im Deutschen verständlicher als „Philistäa“ und bildet den Gebietsbezug ab.
- source_word: מוֹאָב / אֱדוֹם
  choice: Moab / Edom
  rationale: Die etablierten deutschen Formen der Eigennamen werden unverändert beibehalten.
theological_decisions:
- issue: Bildsprache der Herrschaft über feindliche Völker
  choice: Die konkreten Bilder „Waschbecken“, „meine Sandale werfen“ und „laut jubeln“ bleiben im Haupttext erhalten.
  alternative: Moab dient mir; Edom nehme ich in Besitz; über das Philisterland feiere ich meinen Sieg.
  rationale: Der Vers spricht in kräftigen poetischen Bildern von Erniedrigung, Besitzanspruch und Triumph. Eine abstrakte Paraphrase würde diese Bildsprache einebnen und ihre Deutung vorwegnehmen.
- issue: Nuance des Schlussverbs אֶתְרוֹעָע
  choice: Als triumphierendes lautes Jubeln wiedergegeben, mit Hinweis auf die mögliche kriegerische Nuance.
  alternative: „Ich erhebe den Schlachtruf“ oder neutraler „ich erhebe einen lauten Ruf“.
  rationale: Der Kontext legt Triumph nahe, während das Verb selbst sowohl Jubel- als auch Kampfruf bezeichnen kann. Die Fußnote hält diese Spannweite offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter hebräischer Bildsprache. „Waschbecken“ vermeidet das altertümliche „Waschtopf“ im Haupttext; „Philisterland“ ist eine natürliche deutsche Gebietsbezeichnung. Die drei Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
