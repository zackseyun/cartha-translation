  text: לְ֭מַעַן יֵחָלְצ֣וּ/ן יְדִידֶ֑י/ךָ הוֹשִׁ֖יעָ/ה יְמִֽינְ/ךָ֣ וַ/עֲנֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/006.yaml
  text: So that your beloved ones may be rescued[a], save with your right hand and answer me.
translation:
  language: de
  text: Damit deine Geliebten gerettet werden[a], rette mit deiner rechten Hand und antworte mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „befreit werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: Damit
  rationale: Leitet einen Zweck oder ein Ergebnis ein und verbindet den folgenden Rettungsruf natürlich mit dem Anliegen des Beters.
- source_word: יֵחָלְצוּן
  choice: gerettet werden
  rationale: Das Nifal von חלץ bezeichnet hier das Gerettet- oder Befreitwerden. „Gerettet werden“ ist im Gebetszusammenhang klar und idiomatisch.
- source_word: יְדִידֶיךָ
  choice: deine Geliebten
  rationale: Bewahrt den Plural und den Beziehungsgehalt des hebräischen Ausdrucks für Menschen, die Gott lieb und teuer sind.
- source_word: הוֹשִׁיעָה
  choice: rette
  rationale: Der Imperativ von ישׁע wird knapp und unmittelbar wiedergegeben und entspricht dem Gebetscharakter des Verses.
- source_word: יְמִינְךָ
  choice: mit deiner rechten Hand
  rationale: Gibt die rechte Hand als Mittel der Rettung wieder und bewahrt das Bild göttlicher Macht.
- source_word: וַעֲנֵנִי
  choice: und antworte mir
  rationale: Der Suffix der ersten Person Singular wird genau bewahrt; die Form darf nicht an die zuvor genannten mehreren Begünstigten angeglichen werden.
theological_decisions:
- issue: Wechsel von den mehreren Begünstigten zum einzelnen Beter
  choice: „deine Geliebten“ … „antworte mir“
  alternative: „antworte uns“ als Angleichung an den Plural
  rationale: Der hebräische Text wechselt bewusst vom Plural der Geliebten zum Singular des betenden Ichs. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Gebetssprache und das Bild der rechten Hand bleiben erhalten; der Wechsel vom Plural zum Singular wird nicht geglättet.
