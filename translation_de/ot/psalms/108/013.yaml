id: PSA.108.13
reference: Psalms 108:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֵּֽ/אלֹהִ֥ים נַעֲשֶׂה חָ֑יִל וְ֝/ה֗וּא יָב֥וּס צָרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/013.yaml
  text: With God we will do valiantly[a], and he will trample our foes.
translation:
  language: de
  text: Mit Gott werden wir mächtige Taten vollbringen[a], und er wird unsere Feinde zertreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mit Gott werden wir tapfer handeln“; die hebräische Wendung kann Stärke, Tapferkeit oder siegreiche Taten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Mit Gott
  rationale: Die Präposition בְּ bezeichnet hier Gottes Beistand bzw. die durch ihn ermöglichte Handlung. „Mit Gott“ klingt im Deutschen natürlich und lässt offen, ob vor allem Gemeinschaft oder Mittel betont ist.
- source_word: נַעֲשֶׂה חָיִל
  choice: werden wir mächtige Taten vollbringen
  rationale: Die Verbindung עשה חיל bezeichnet kraftvolles, erfolgreiches oder siegreiches Handeln. Die Wiedergabe bildet den hebräischen Ausdruck verständlich ab, ohne ihn ausschließlich auf Tapferkeit oder Sieg festzulegen.
- source_word: וְהוּא
  choice: und er
  rationale: Das einfache וְ koordiniert beide Aussagen; das ausdrückliche Pronomen hebt Gottes eigenes, entscheidendes Handeln hervor.
- source_word: יָבוּס
  choice: wird ... zertreten
  rationale: בוס bezeichnet das Niedertreten oder Zertreten und bewahrt so das eindringliche militärische Bild.
- source_word: צָרֵינוּ
  choice: unsere Feinde
  rationale: צָר bezeichnet feindlich gesinnte Bedränger oder Gegner. „Feinde“ ist in modernem Standarddeutsch klar und dem würdevollen Psalmregister angemessen.
theological_decisions:
- issue: Handelnde beim Sieg
  choice: Das Volk vollbringt mit Gott mächtige Taten, während Gott selbst die Feinde zertreten wird.
  alternative: Entweder die menschliche Mitwirkung zugunsten ausschließlich göttlichen Handelns abzuschwächen oder Gottes Handeln auf bloße Unterstützung zu reduzieren.
  rationale: Der hebräische Parallelismus nennt sowohl das von Gott abhängige Handeln des Volkes als auch Gottes eigenes entscheidendes Handeln. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Psalmdeutsch. „Mächtige Taten vollbringen“ bewahrt die idiomatische Bedeutungsbreite; „zertreten“ erhält das kräftige Bild des hebräischen Verbs.
