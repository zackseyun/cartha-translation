  text: הָֽבָ/ה לָּ֣/נוּ עֶזְרָ֣ת מִ/צָּ֑ר וְ֝/שָׁ֗וְא תְּשׁוּעַ֥ת אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/012.yaml
  text: Give us help against the adversary[b][a], for the salvation of man is vain.
translation:
  language: de
  text: Gewähre uns Hilfe gegen den Feind[a], denn die Rettung durch Menschen ist vergeblich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gewähre uns Hilfe aus der Bedrängnis.“ Das hebräische Wort kann sowohl einen Feind beziehungsweise Bedränger als auch Bedrängnis bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „die Rettung des Menschen“. Gemeint sein kann allgemein Rettung, die von Menschen ausgeht.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָבָה
  choice: Gewähre
  rationale: Die Aufforderungsform wird im Gebet als Bitte um Gottes Eingreifen gebraucht. „Gewähre“ klingt würdig und natürlich, ohne den Sinn zu verstärken.
- source_word: לָּנוּ
  choice: uns
  rationale: Kennzeichnet die Empfänger der erbetenen Hilfe und lässt sich im Deutschen unmittelbar mit „Gewähre uns“ wiedergeben.
- source_word: עֶזְרַת
  choice: Hilfe
  rationale: Die Konstruktform bezeichnet Hilfe oder Beistand. „Hilfe“ ist klar, geläufig und passt zum Gebetscharakter.
- source_word: מִצָּר
  choice: gegen den Feind
  rationale: צַר kann einen Bedränger beziehungsweise Feind oder unpersönlich Bedrängnis bezeichnen. Im militärischen Zusammenhang des Psalms liegt die persönliche Bedeutung nahe; מן wird nach „Hilfe“ idiomatisch mit „gegen“ wiedergegeben.
- source_word: וְשָׁוְא
  choice: denn … ist vergeblich
  rationale: שָׁוְא bezeichnet Leere, Nichtigkeit oder Vergeblichkeit. Das verbindende וְ wird hier dem Zusammenhang entsprechend kausal mit „denn“ ausgedrückt.
- source_word: תְּשׁוּעַת
  choice: die Rettung
  rationale: Das Substantiv kann Rettung, Befreiung oder Sieg bezeichnen. „Rettung“ wahrt die lexikalische Breite, ohne eine ausschließlich geistliche Bedeutung einzutragen.
- source_word: אָדָם
  choice: durch Menschen
  rationale: אָדָם ist hier generisch und stellt menschliche Rettungsmacht der Hilfe Gottes gegenüber. „Durch Menschen“ gibt diesen allgemeinen Sinn in heutigem Deutsch natürlich und geschlechtsübergreifend wieder.
theological_decisions:
- issue: Generische Bedeutung von אָדָם und das Verhältnis im Ausdruck תְּשׁוּעַת אָדָם
  choice: die Rettung durch Menschen
  alternative: die Rettung des Menschen
  rationale: Der Kontext spricht von der Unzulänglichkeit menschlicher Hilfe. Die deutsche Formulierung macht den generischen Sinn deutlich; die formal mögliche Genitivwiedergabe wird in einer Fußnote bewahrt, damit die knappe hebräische Konstruktion nicht als eindeutig ausgegeben wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. „Gewähre“ entspricht dem Gebetston; „durch Menschen“ vermeidet ein heute missverständliches generisches Maskulinum, während die formnähere Möglichkeit in der Fußnote erhalten bleibt.
