  text: מִ֣י יֹ֭בִלֵ/נִי עִ֣יר מִבְצָ֑ר מִ֖י נָחַ֣/נִי עַד אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/010.yaml
  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a][b][c]
translation:
  language: de
  text: Wer wird mich in die befestigte Stadt bringen? Wer wird mich bis nach Edom führen?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer hat mich bis nach Edom geführt?“ Das zweite Verb steht im Hebräischen formal im Perfekt, kann hier im poetischen Parallelismus jedoch zukunftsbezogen verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Mit der „befestigten Stadt“ könnte eine bestimmte edomitische Festung gemeint sein, traditionell oft Sela beziehungsweise Petra; der hebräische Text nennt die Stadt jedoch nicht.
    reason: cultural_note
lexical_decisions:
- source_word: מִי
  choice: Wer
  rationale: Das Fragepronomen leitet in beiden Vershälften eine rhetorische Frage ein; „Wer“ ist direkt und natürlich.
- source_word: יֹבִלֵנִי
  choice: bringt mich
  rationale: Die Hifil-Form von יבל bezeichnet das Hinbringen bzw. Hinführen zu einem Ziel. „Bringt mich“ gibt die Zielrichtung idiomatisch wieder.
- source_word: עִיר מִבְצָר
  choice: die befestigte Stadt
  rationale: Die Status-constructus-Verbindung bedeutet idiomatisch „befestigte Stadt“. Der bestimmte Artikel entspricht dem wahrscheinlich konkret gemeinten, aber nicht namentlich genannten Ort.
- source_word: נָחַנִי
  choice: führt mich
  rationale: Obwohl formal eine Perfektform vorliegt, erhält das Verb im synonymen Parallelismus zur vorausgehenden Zukunftsfrage einen zukunftsbezogenen bzw. modalen Sinn. Das deutsche Präsens mit Frageform ist futurisch verständlich und vermeidet einen irreführenden Zeitwechsel.
- source_word: עַד אֱדוֹם
  choice: bis nach Edom
  rationale: עַד bezeichnet hier die räumliche Erstreckung bis zum Ziel. „Bis nach Edom“ bewahrt diese Nuance und klingt im Deutschen natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden parallelen rhetorischen Fragen bleiben knapp. „Bis nach Edom“ bewahrt die räumliche Grenznuance von עַד; die formale Tempusmehrdeutigkeit des zweiten Verbs wird in einer Fußnote offengehalten.
