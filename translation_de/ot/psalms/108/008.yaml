  text: לִ֤/י גִלְעָ֨ד לִ֤/י מְנַשֶּׁ֗ה וְ֭/אֶפְרַיִם מָע֣וֹז רֹאשִׁ֑/י יְ֝הוּדָ֗ה מְחֹקְקִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/008.yaml
  text: Gilead is mine[a]; Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my ruler's staff.
translation:
  language: de
  text: Mir gehört Gilead, mir gehört Manasse; Efraim ist die Stärke meines Hauptes[a], Juda ist mein Zepter.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Stärke/Festung meines Hauptes“; ein poetisches Bild für schützende Stärke.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Juda ist mein Gesetzgeber“ oder „Juda ist mein Herrscherstab“; das hebräische Wort kann einen Herrscher beziehungsweise Gesetzgeber oder den Stab als Zeichen seiner Herrschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  choice: mir gehört
  rationale: Die Präposition ל mit Suffix der 1. Person Singular bezeichnet hier Besitz. „Mir gehört“ klingt im Deutschen natürlich und bewahrt den Nachdruck der Wiederholung.
- source_word: גִלְעָד
  choice: Gilead
  rationale: Der geografische Eigenname wird nach gebräuchlicher deutscher Form wiedergegeben.
- source_word: מְנַשֶּׁה
  choice: Manasse
  rationale: Der Stammes- und Gebietsname wird in der geläufigen deutschen Namensform wiedergegeben.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Der Stammesname wird in moderner deutscher Schreibweise wiedergegeben.
- source_word: מָעוֹז
  choice: Schutzwehr
  rationale: מָעוֹז bezeichnet eine Stärke, Zuflucht oder befestigte Schutzmacht. „Schutzwehr“ erhält das militärisch-poetische Bild und verbindet Schutz mit Stärke.
- source_word: רֹאשִׁי
  choice: meines Hauptes
  rationale: Das Hebräische lautet wörtlich „mein Kopf/Haupt“. Die gehobene, aber verständliche Formulierung bewahrt das Körperbild, ohne es als „Helm“ auszudeuten.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Der Stammesname wird in der etablierten deutschen Form wiedergegeben.
- source_word: מְחֹקְקִי
  choice: mein Herrscherstab
  rationale: Das Wort kann einen Gebietenden beziehungsweise Gesetzgeber oder den Stab als Zeichen seiner Herrschaft bezeichnen. „Herrscherstab“ bewahrt die konkrete königliche Metonymie und bleibt näher an der Wortbreite als „Zepter“.
theological_decisions:
- issue: Herrschaftsbild für Juda in מְחֹקְקִי
  choice: Juda ist mein Herrscherstab
  alternative: Juda ist mein Gesetzgeber
  rationale: Im Zusammenhang werden Stämme und Gebiete als Besitz und Machtmittel des göttlichen Königs dargestellt. „Herrscherstab“ hält das Bild königlicher Autorität fest; die mögliche personale Bedeutung „Gesetzgeber“ wird wegen der echten lexikalischen Mehrdeutigkeit in der Fußnote genannt.
- issue: Bildsprache bei מָעוֹז רֹאשִׁי
  choice: die Schutzwehr meines Hauptes
  alternative: die Stärke meines Hauptes / mein Helm
  rationale: Die Übersetzung wahrt die ungewöhnliche hebräische Bildfügung, statt sie eindeutig als Helm oder abstrakte Stärke aufzulösen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst erhaltener poetischer Bildlichkeit. Die zweimalige Voranstellung „mir gehört“ gibt den emphatischen Parallelismus des Hebräischen wieder. „Haupt“ trägt den dichterischen Ton, ohne altertümlich unverständlich zu werden.
