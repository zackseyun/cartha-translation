  text: הֲ/לֹֽא אֱלֹהִ֥ים זְנַחְתָּ֑/נוּ וְֽ/לֹא תֵצֵ֥א אֱ֝לֹהִ֗ים בְּ/צִבְאֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/011.yaml
  text: Have you not rejected us[a], O God? And do you not go out with our armies?
translation:
  language: de
  text: Hast du uns nicht verworfen[a], Gott, und ziehst du nicht mit unseren Heeren aus?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verstoßen«. Das hebräische Verb kann eine entschiedene, kraftvolle Zurückweisung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hast du nicht
  rationale: Leitet eine rhetorische Frage ein, die mit einer bestätigenden Antwort rechnet, und bewahrt im Deutschen die Frageform.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch plurale Form bezeichnet hier aufgrund der singularischen Verbformen den einen Gott Israels; im Satz steht sie als direkte Anrede.
- source_word: זְנַחְתָּנוּ
  choice: uns verworfen
  rationale: זנח bezeichnet ein entschiedenes Zurückweisen oder Verstoßen. »Verworfen« erhält die starke Klagesprache und ist in biblisch-poetischem Deutsch verständlich.
- source_word: וְלֹא
  choice: und ... nicht
  rationale: Gibt die einfache hebräische Verbindung und Verneinung wieder, ohne einen stärkeren Gegensatz einzutragen.
- source_word: תֵצֵא
  choice: ziehst ... aus
  rationale: יצא bedeutet grundsätzlich »hinausgehen«; im militärischen Zusammenhang ist »ausziehen« die natürliche deutsche Entsprechung. Das Imperfekt wird im Klagekontext präsentisch verstanden.
- source_word: בְּצִבְאֹתֵינוּ
  choice: mit unseren Heeren
  rationale: צָבָא bezeichnet hier militärische Verbände; die Präposition ב drückt in diesem Zusammenhang Begleitung aus.
theological_decisions:
- issue: Göttliche Verwerfung in der Klage
  choice: Die direkte Klage sagt ungemildert, Gott habe sein Volk verworfen und ziehe nicht mit dessen Heeren aus.
  alternative: Eine abgeschwächte Wiedergabe wie »uns verlassen« oder »ist nicht bei uns«.
  rationale: Das starke Verb זנח und die militärische Klage werden bewahrt; die theologische Spannung wird nicht durch eine mildere Formulierung aufgelöst.
- issue: Reichweite der rhetorischen Frage
  choice: Die Fragepartikel am Versanfang wird auf beide koordinierten Aussagen bezogen.
  alternative: Nur den ersten Satz als Frage und den zweiten als Feststellung wiederzugeben.
  rationale: Die Fortführung mit וְלֹא lässt sich natürlich als zweites Glied derselben rhetorischen Frage lesen; die deutsche Satzgestaltung bewahrt zugleich die enge Koordination.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. »Ausziehen« und »Heere« erhalten den militärischen Kontext, ohne unnötig altertümlich zu wirken.
