base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/030.yaml
  text: The mouth of the righteous utters wisdom[b][a], and his tongue speaks justice.
translation:
  language: de
  text: Der Mund des Gerechten spricht Weisheit[a], und seine Zunge redet Recht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sinnt über Weisheit nach“ oder „murmelt Weisheit“. Das hebräische Verb kann sowohl leises Äußern als auch Nachsinnen bezeichnen; der Parallelismus mit der redenden Zunge legt hier gesprochenen Ausdruck nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gerechtigkeit“ oder „Urteil“. Das hebräische Wort kann das Recht bzw. Gerechte, eine rechtliche Entscheidung oder die Rechtsordnung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי צַדִּיק
  choice: Der Mund des Gerechten
  rationale: Bewahrt die hebräische Genitivkonstruktion und die poetische Metonymie des Mundes für das Reden. Das substantivierte „des Gerechten“ gibt den maskulinen Singular wieder, ohne über den Ausgangstext hinaus „Mann“ einzufügen.
- source_word: יֶהְגֶּה
  choice: spricht
  rationale: הגה kann ein leises Äußern, Murmeln oder Sinnen bezeichnen. Da der Mund Subjekt ist und die parallele Zeile vom Reden der Zunge handelt, steht hier wahrscheinlich der hörbare Ausdruck im Vordergrund.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die übliche und kontextgerechte Wiedergabe von חָכְמָה als Inhalt der Rede.
- source_word: וּלְשׁוֹנוֹ
  choice: und seine Zunge
  rationale: Die wörtliche Körpermetapher ist auch im Deutschen verständlich und erhält den Parallelismus mit „Mund“.
- source_word: תְּדַבֵּר
  choice: redet
  rationale: Direkte, natürliche Wiedergabe des Piel von דבר; die Variation gegenüber „spricht“ wahrt einen würdigen deutschen Stil.
- source_word: מִשְׁפָּט
  choice: was recht ist
  rationale: מִשְׁפָּט kann Recht, gerechtes Urteil oder Gerechtigkeit bezeichnen. „Was recht ist“ passt als Inhalt der Rede und bewahrt die ethisch-rechtliche Bedeutungsbreite.
theological_decisions:
- issue: Maskuliner Singular in der Weisheitsdichtung
  choice: des Gerechten
  alternative: des gerechten Mannes / eines gerechten Menschen
  rationale: Der hebräische Text verwendet einen substantivierten maskulinen Singular, nennt aber nicht ausdrücklich „Mann“. „Des Gerechten“ bewahrt Form und repräsentativen Charakter, ohne eine zusätzliche Personenbezeichnung einzutragen.
- issue: Bedeutungsbreite von מִשְׁפָּט
  choice: was recht ist
  alternative: Gerechtigkeit / Recht / Urteil
  rationale: Die Formulierung lässt sowohl gerechtes Reden als auch eine dem Recht entsprechende Aussage anklingen, ohne den Ausdruck auf ein gerichtliches Urteil oder einen abstrakten Begriff festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrtem poetischem Parallelismus. „Der Mund des Gerechten“ klingt bewusst leicht gehoben und entspricht dem Charakter eines Psalms; „was recht ist“ bleibt für heutige Leser unmittelbar verständlich.
