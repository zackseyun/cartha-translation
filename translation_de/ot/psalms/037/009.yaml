id: PSA.37.9
reference: Psalms 37:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי מְ֭רֵעִים יִכָּרֵת֑וּ/ן וְ/קֹוֵ֥י יְ֝הוָ֗ה הֵ֣מָּה יִֽירְשׁוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/009.yaml
  text: For evildoers will be cut off[a], but those who wait for Yahweh—they will inherit the land.
translation:
  language: de
  text: Denn die Bösen werden ausgerottet; die aber auf Jahwe hoffen, sie werden das Land erben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Erde«. Das hebräische Wort אֶרֶץ kann sowohl »Land« als auch »Erde« bedeuten; im Zusammenhang des Psalms liegt »das Land« näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Mahnung ein und gibt den erklärenden Zusammenhang natürlich wieder.
- source_word: מְרֵעִים
  choice: die Bösen
  rationale: Bezeichnet als substantiviertes Partizip Menschen, die Böses tun; die knappe Form passt zum weisheitlichen Gegensatz des Verses.
- source_word: יִכָּרֵתוּן
  choice: werden ausgerottet
  rationale: Das Nifal von כרת bezeichnet das Abgeschnitten- oder Beseitigtwerden. »Ausgerottet« bewahrt die starke gerichtliche Aussage, ohne die genaue Art des Gerichts festzulegen.
- source_word: וְקֹוֵי
  choice: die aber … hoffen
  rationale: קוה bezeichnet erwartungsvolles Warten beziehungsweise Hoffen. »Hoffen auf« klingt im modernen Deutsch natürlich und schließt geduldiges Vertrauen ein; »aber« macht den im Kontext klaren Gegensatz sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen als gebräuchliche deutsche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הֵמָּה
  choice: sie
  rationale: Das selbstständige Pronomen ist ausdrücklich wiedergegeben und erhält dadurch seine hervorhebende Wirkung.
- source_word: יִירְשׁוּ
  choice: werden … erben
  rationale: Bewahrt den Verheißungs- und Bundesklang von ירשׁ sowie die wiederkehrende Ausdrucksweise des Psalms.
- source_word: אָרֶץ
  choice: das Land
  rationale: Im unmittelbaren Zusammenhang von Psalm 37 liegt das verheißene Land nahe; die ebenfalls mögliche Bedeutung »Erde« bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Reichweite von אָרֶץ in der Verheißung
  choice: das Land
  alternative: die Erde
  rationale: Die wiederholte Rede vom Erben des Landes erinnert unmittelbar an die alttestamentliche Bundesverheißung. Da אָרֶץ zugleich die ganze Erde bezeichnen kann, wird diese weiter reichende Lesart nicht ausgeschlossen, sondern als echte lexikalische Alternative vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und das hervorgehobene »sie« bewahren den poetischen Gegensatz; »Jahwe« gibt den Gottesnamen wieder.
