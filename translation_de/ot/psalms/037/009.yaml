  terminology: »Jahwe« ist die im Deutschen etablierte Wiedergabe des Gottesnamens. »Erben« bewahrt den Verheißungscharakter. Die Fußnote dokumentiert die echte lexikalische Alternative »Erde«, ohne die kontextuell naheliegende Übersetzung »Land« zu übergehen.
