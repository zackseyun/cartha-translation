source:
  edition: WLC
  text: כִּ֤י רְשָׁעִ֨ים יֹאבֵ֗דוּ וְ/אֹיְבֵ֣י יְ֭הוָה כִּ/יקַ֣ר כָּרִ֑ים כָּל֖וּ בֶ/עָשָׁ֣ן כָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/020.yaml
  text: For the wicked will perish[a], and the enemies of Yahweh are like the glory of the pastures; they vanish—like smoke they vanish away.
translation:
  language: de
  text: Denn die Frevler gehen zugrunde, und die Feinde Jahwes sind wie die Pracht der Weiden[a]; sie vergehen – im Rauch vergehen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach traditioneller Deutung: „wie das Fett der Lämmer“. Die hebräische Wendung ist schwierig.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Aussage ein und bewahrt den erklärenden Zusammenhang.
- source_word: רְשָׁעִים
  choice: die Frevler
  rationale: Bezeichnet im weisheitlichen und poetischen Sprachgebrauch Menschen, die moralisch verwerflich handeln; „Frevler“ ist knapp und würdig.
- source_word: יֹאבֵדוּ
  choice: gehen zugrunde
  rationale: Gibt den zukünftigen Untergang wieder, ohne ausdrücklich festzulegen, ob Vernichtung oder ein allgemeineres Verderben gemeint ist.
- source_word: וְאֹיְבֵי יְהוָה
  choice: und die Feinde Jahwes
  rationale: Gibt die hebräische Status-constructus-Verbindung direkt und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: כִּיקַר כָּרִים
  choice: wie die Pracht der Weiden
  rationale: Folgt einer möglichen Deutung von יקר als „Pracht“ und כרים als „Weiden“. Da die Wendung schwierig und mehrdeutig ist, wird die traditionelle Alternative in einer Fußnote bewahrt.
- source_word: כָּלוּ
  choice: sie schwinden dahin
  rationale: Gibt das Zu-Ende-Gehen beziehungsweise Verschwinden bildhaft wieder und ermöglicht die Beibehaltung der poetischen Wiederholung.
- source_word: בֶעָשָׁן
  choice: wie Rauch
  rationale: Gibt die Präposition im Zusammenhang mit dem Bild des Verschwindens vergleichend wieder und klingt im Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Namen und ersetzt ihn nicht durch einen Titel.
- issue: Deutung von כִּיקַר כָּרִים
  choice: wie die Pracht der Weiden
  alternative: wie das Fett der Lämmer
  rationale: Die hebräische Wendung ist lexikalisch schwierig. Die Hauptlesart versteht יקר als „Pracht“ und כרים als „Weiden“; die traditionelle Deutung wird wegen der echten Unsicherheit nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „schwinden dahin“ erhält den poetischen Nachdruck des Hebräischen; der Gedankenstrich verdeutlicht die steigernde Wiederaufnahme.
