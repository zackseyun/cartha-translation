source:
  edition: WLC
  text: אֲדֹנָ֥/י יִשְׂחַק ל֑/וֹ כִּֽי רָ֝אָ֗ה כִּֽי יָבֹ֥א יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/013.yaml
  text: The Lord laughs at him[b][a], for he sees that his day is coming.
translation:
  language: de
  text: Der Herr lacht über ihn[a], denn er sieht, dass sein Tag kommt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verspottet ihn“; das hebräische Verb bedeutet wörtlich „lacht“, hat hier im Zusammenhang aber einen spöttischen Sinn.'
    reason: lexical_alternative
  - marker: b
    text: Mit „sein Tag“ ist der bevorstehende Tag des Untergangs oder Gerichts für den Gottlosen gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Die übliche und natürliche deutsche Wiedergabe des Gottestitels אֲדֹנָי ist „der Herr“.
- source_word: יִשְׂחַק לוֹ
  choice: lacht über ihn
  rationale: שׂחק bedeutet im Qal wörtlich „lachen“; mit ל wird der Betroffene idiomatisch durch „über ihn“ bezeichnet. Der Zusammenhang verleiht dem Lachen einen spöttischen Klang, ohne dass dies im Haupttext stärker ausgedeutet werden muss.
- source_word: כִּי רָאָה
  choice: denn er sieht
  rationale: Das erste כִּי begründet das Lachen. Das Perfekt רָאָה bezeichnet hier Gottes gegenwärtig relevante Wahrnehmung und wird im Deutschen natürlich mit Präsens wiedergegeben.
- source_word: כִּי יָבֹא
  choice: dass … kommt
  rationale: Das zweite כִּי leitet den Inhalt dessen ein, was der Herr sieht; das Imperfekt יָבֹא weist auf das bevorstehende Eintreffen hin.
- source_word: יוֹמוֹ
  choice: sein Tag
  rationale: Die knappe poetische Formulierung wird wörtlich bewahrt; aus dem Kontext ergibt sich, dass der Tag des Gottlosen beziehungsweise seines Untergangs oder Gerichts gemeint ist.
theological_decisions:
- issue: Art des göttlichen Lachens
  choice: Das wörtliche Bild „der Herr lacht über ihn“ bleibt erhalten; im Zusammenhang hat es einen spöttisch-gerichtlichen Sinn.
  alternative: „Der Herr verspottet ihn.“
  rationale: Die Alternative macht die kontextuelle Nuance ausdrücklich, engt aber das lexikalisch offene Bild des Lachens stärker ein als der hebräische Text.
- issue: Bedeutung von „sein Tag“
  choice: Die mehrdeutige Kurzform „sein Tag“ bleibt im Haupttext stehen und wird in einer Fußnote kontextuell erläutert.
  alternative: „der für ihn bestimmte Tag des Gerichts“
  rationale: Eine ausformulierte Wiedergabe würde die im Hebräischen nur implizierte Bedeutung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Die Wiederholung „denn … dass“ bildet die beiden unterschiedlichen Funktionen von כִּי natürlich ab; die Bildsprache und ihre theologische Spannung bleiben erhalten.
