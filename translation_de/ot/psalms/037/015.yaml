  text: חַ֭רְבָּ/ם תָּב֣וֹא בְ/לִבָּ֑/ם וְ֝/קַשְּׁתוֹתָ֗/ם תִּשָּׁבַֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/015.yaml
  text: Their sword will enter their own heart[a], and their bows will be broken.
translation:
  language: de
  text: Ihr Schwert wird in ihr eigenes Herz dringen[a], und ihre Bogen werden zerbrochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihr Schwert wird in ihre eigenen Herzen dringen.« Im Hebräischen steht »Herz« im Singular mit einem Possessivsuffix im Plural, eine übliche kollektive Ausdrucksweise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבָּם
  choice: ihr Schwert
  rationale: Das Substantiv steht im Singular mit einem Suffix der 3. Person Plural. Der Singular bleibt erhalten und kann kollektiv oder distributiv verstanden werden.
- source_word: תָּבוֹא
  choice: wird … dringen
  rationale: Das Qal-Imperfekt bezeichnet hier, zusammen mit בְּ und »Herz«, ein Eindringen; »dringen« gibt die bildhafte Umkehrung der Waffe natürlich wieder.
- source_word: בְלִבָּם
  choice: in ihr eigenes Herz
  rationale: 'Wörtlich »in ihr Herz«. »eigenes« verdeutlicht im Deutschen den durch den Zusammenhang gegebenen Rückbezug: Ihr Schwert trifft sie selbst.'
- source_word: וְקַשְּׁתוֹתָם
  choice: und ihre Bogen
  rationale: Das hebräische Substantiv ist Plural und trägt ein Suffix der 3. Person Plural; die Konjunktion wird beibehalten.
- source_word: תִּשָּׁבַרְנָה
  choice: werden zerbrochen
  rationale: Das Nifal-Imperfekt der 3. Person feminin Plural wird direkt passiv wiedergegeben. »zerbrochen« bewahrt die Aussage, ohne die Intensität unnötig zu steigern.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Bildsprache. Der kollektive Singular »ihr Schwert« und die mögliche kollektive beziehungsweise distributive Bedeutung von »Herz« bleiben erhalten.
