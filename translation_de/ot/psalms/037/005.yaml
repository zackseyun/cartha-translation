  yaml_path: translation/ot/psalms/037/005.yaml
  text: Commit your way to Yahweh[a]; trust in him[b], and he will act.
translation:
  language: de
  text: Vertraue Jahwe deinen Weg an[a]; vertraue auf ihn, und er wird handeln.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wälze deinen Weg auf Jahwe.“ Die Wendung bedeutet, ihm den eigenen Weg oder Lebensgang anzuvertrauen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Er wird es tun“ oder „er wird es zustande bringen“. Im Hebräischen steht lediglich „er wird tun/handeln“; ein Objekt wird nicht ausdrücklich genannt.'
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹל
  choice: Vertraue … an
  rationale: Der Imperativ bedeutet wörtlich „wälze“, bildet hier mit עַל und „deinen Weg“ jedoch eine Wendung für das Anvertrauen. Die deutsche Formulierung gibt den Sinn natürlich wieder; das zugrunde liegende Bild bleibt in der Fußnote sichtbar.
- source_word: עַל יְהוָה
  choice: Jahwe … an
  rationale: Die Präposition bedeutet in der bildhaften Ausgangsform „auf“. Mit dem idiomatischen deutschen Verb „anvertrauen“ wird die Beziehung durch die Konstruktion „jemandem etwas anvertrauen“ ausgedrückt. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: דַּרְכֶּךָ
  choice: deinen Weg
  rationale: „Weg“ entspricht dem hebräischen Ausdruck unmittelbar und kann wie im Hebräischen sowohl den Lebensweg als auch das eigene Vorhaben und Handeln bezeichnen.
- source_word: וּבְטַח
  choice: vertrau
  rationale: בטח fordert zu festem Vertrauen beziehungsweise Sich-Verlassen auf. „Vertrau“ ist knapp, verständlich und erhält die imperativische Kraft.
- source_word: עָלָיו
  choice: auf ihn
  rationale: Die Verbindung „auf jemanden vertrauen“ ist im Deutschen idiomatisch und entspricht dem hebräischen Bild des Sich-Stützens auf jemanden.
- source_word: וְהוּא
  choice: und er
  rationale: Die ausdrückliche Nennung des Pronomens betont Jahwe als Handelnden; „und er“ bewahrt diese Hervorhebung.
- source_word: יַעֲשֶׂה
  choice: wird handeln
  rationale: עשה kann „tun“, „machen“ oder „handeln“ bedeuten. Da im Hebräischen kein Objekt genannt wird, wahrt „wird handeln“ die Offenheit der Aussage, ohne ein „es“ hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Nicht genanntes Objekt von יַעֲשֶׂה
  choice: er wird handeln
  alternative: er wird es tun / er wird es vollbringen
  rationale: Der hebräische Satz nennt nicht ausdrücklich, was Jahwe tun wird. Die offene Formulierung vermeidet es, die Verheißung über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweifache Aufforderung zum Vertrauen bleibt erhalten, ohne das hebräische Bild im Haupttext unnatürlich wörtlich wiederzugeben. Die Schlussaussage bleibt bewusst offen.
