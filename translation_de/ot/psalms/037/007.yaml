  text: דּ֤וֹם לַ/יהוָה֮ וְ/הִתְח֪וֹלֵ֫ל ל֥/וֹ אַל תִּ֭תְחַר בְּ/מַצְלִ֣יחַ דַּרְכּ֑/וֹ בְּ֝/אִ֗ישׁ עֹשֶׂ֥ה מְזִמּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/007.yaml
  text: Be still before Yahweh[a], and wait patiently for him; do not burn with anger because of one who prospers in his way[c][b], because of a man who carries out schemes.
translation:
  language: de
  text: Sei still vor Jahwe[a] und warte geduldig auf ihn[b]. Ärgere dich nicht[c] über den, der auf seinem Weg Erfolg hat, über einen Mann, der Pläne ausführt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schweige vor Jahwe.“ Das hebräische Verb kann sowohl Schweigen als auch stilles Innehalten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und harre sehnsüchtig auf ihn“. Das hebräische Verb kann ein geduldiges, zugleich schmerzlich angespanntes Warten ausdrücken; traditionell wird auch „ruhe in ihm“ übersetzt.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „Erhitze dich nicht“ oder „werde nicht zornig“. Das hebräische Verb beschreibt ein Heißwerden und kann Zorn oder erregte Unruhe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹם
  choice: Sei still
  rationale: Der Imperativ von דמם bezeichnet Schweigen oder stilles Innehalten. „Sei still“ bewahrt beide Aspekte in natürlichem, würdigem Deutsch.
- source_word: לַיהוָה
  choice: vor Jahwe
  rationale: Das ל bezeichnet hier in Verbindung mit דום die Ausrichtung auf beziehungsweise die Gegenwart Jahwes; „vor“ gibt diese Beziehung idiomatisch wieder.
- source_word: וְהִתְחוֹלֵל לוֹ
  choice: und warte geduldig auf ihn
  rationale: Die Hitpolel-Form von חול kann schmerzliches Sich-Winden oder bebendes, sehnsüchtiges Harren ausdrücken. Im exhortativen Zusammenhang ist geduldiges Warten gemeint, ohne die mögliche innere Anspannung ganz auszuschließen.
- source_word: אַל תִּתְחַר
  choice: Erhitze dich nicht
  rationale: חרה verwendet das Bild des Heiß- oder Entbrennens für Zorn und Erregung. Die deutsche Formulierung erhält dieses Bild und klingt verständlich.
- source_word: בְּמַצְלִיחַ דַּרְכּוֹ
  choice: über den, dessen Weg erfolgreich ist
  rationale: ב kennzeichnet den Anlass der Erregung; מצליח beschreibt Erfolg beziehungsweise Gelingen, und דרך bewahrt das Bild des Lebenswegs oder Vorgehens.
- source_word: בְּאִישׁ
  choice: über einen Mann
  rationale: איש ist maskuliner Singular und bezeichnet hier einen beispielhaften einzelnen Mann; die grammatische Gestalt des Ausgangstextes bleibt erhalten.
- source_word: עֹשֶׂה מְזִמּוֹת
  choice: der Pläne ausführt
  rationale: מזמות kann je nach Kontext Pläne, Berechnungen oder hinterlistige Vorhaben bezeichnen. „Pläne“ erhält die lexikalische Offenheit; „ausführt“ gibt עֹשֶׂה als tätige Umsetzung wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Mögliche moralische Wertung von מְזִמּוֹת
  choice: Pläne
  alternative: Ränke
  rationale: Das Wort kann im Zusammenhang negativ gefärbt sein, bezeichnet aber lexikalisch auch überlegte Pläne. Die Hauptübersetzung vermeidet, die negative Wertung stärker festzulegen als der Ausdruck selbst; die Fußnote nennt die naheliegende Alternative.
- issue: Geschlechtsspezifische Wiedergabe von אִישׁ
  choice: einen Mann
  alternative: jemanden
  rationale: Die maskuline Einzahl des hebräischen Textes wird bewahrt, wobei der Mann im Spruch als repräsentative Einzelperson erscheint.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetisch-mahnendem Ton. Die knappe Parallelstruktur des hebräischen Verses bleibt erkennbar; ungewöhnliche, aber aussagekräftige Bildsprache wird nicht vorschnell geglättet.
