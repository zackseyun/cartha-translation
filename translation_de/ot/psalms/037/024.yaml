source:
  edition: WLC
  text: כִּֽי יִפֹּ֥ל לֹֽא יוּטָ֑ל כִּֽי יְ֝הוָ֗ה סוֹמֵ֥ךְ יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/024.yaml
  text: Though he falls[a], he will not be hurled down[b], for Yahweh holds his hand.
translation:
  language: de
  text: Auch wenn er fällt[a], wird er nicht zu Boden geschleudert, denn Jahwe hält seine Hand[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn wenn er fällt“. Die hebräische Konjunktion kann hier begründend, bedingend oder – wie im Haupttext – einräumend verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „stützt seine Hand“. Gemeint ist Jahwes fortdauernder Halt.'
    reason: translation_alternative
lexical_decisions:
- source_word: כִּי
  choice: Auch wenn / denn
  rationale: Das erste כִּי wird im Zusammenhang konzessiv als „auch wenn“ verstanden; das zweite begründet die Aussage und wird mit „denn“ wiedergegeben. So bleiben die unterschiedlichen kontextuellen Funktionen derselben Konjunktion erkennbar.
- source_word: יִפֹּל
  choice: er fällt
  rationale: נפל bedeutet grundlegend „fallen“. Die offene Bildsprache wird beibehalten und weder ausschließlich auf Sünde noch ausschließlich auf körperliche Gefahr bezogen.
- source_word: לֹא יוּטָל
  choice: wird er nicht zu Boden geschleudert
  rationale: Der Hophal von טול bezeichnet ein passives Geworfen- oder Hingeschleudertwerden. Die Formulierung unterscheidet dieses gewaltsamere Bild vom vorausgehenden einfachen „fallen“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: סוֹמֵךְ יָדוֹ
  choice: hält seine Hand
  rationale: סמך bezeichnet stützendes, haltendes Handeln; יָדוֹ ist das direkte Objekt „seine Hand“. Die deutsche Formulierung bewahrt das Bild, dass Jahwe die Hand des Fallenden hält, und klingt zugleich natürlich.
theological_decisions:
- issue: Bedeutung des Fallens
  choice: Die allgemeine Bildsprache für Rückschläge, Not oder Scheitern bleibt offen.
  alternative: Das Fallen ausdrücklich als Sünde, Abfall oder ausschließlich körperliche Gefahr deuten.
  rationale: Der hebräische Text legt die Art des Fallens nicht fest. Eine engere Festlegung würde die theologische und poetische Spannweite unnötig einschränken.
- issue: Ausmaß des Niedergeworfenwerdens
  choice: „nicht zu Boden geschleudert“ bewahrt die Zusage göttlichen Haltens, ohne zu behaupten, der Gerechte falle überhaupt nicht.
  alternative: „bleibt nicht liegen“ oder „wird nicht völlig vernichtet“.
  rationale: Der Text stellt reales Fallen und bewahrendes Eingreifen nebeneinander. Die Übersetzung erhält diese Spannung und vermeidet zusätzliche Aussagen über Dauer oder endgültige Vernichtung.
translation_notes:
  register: Moderne, würdige Standardsprache. „Zu Boden geschleudert“ bildet den stärkeren passiven zweiten Fallbegriff ab; „hält seine Hand“ bewahrt das konkrete hebräische Bild in natürlichem Deutsch.
