id: PSA.37.40
reference: Psalms 37:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יַּעְזְרֵ֥/ם יְהוָ֗ה וַֽ/יְפַ֫לְּטֵ֥/ם יְפַלְּטֵ֣/ם מֵ֭/רְשָׁעִים וְ/יוֹשִׁיעֵ֑/ם כִּי חָ֥סוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/040.yaml
  text: Yahweh helps them and delivers them[a]; he delivers them from the wicked and saves them[b], because they take refuge in him.
translation:
  language: de
  text: Jahwe hilft ihnen und befreit sie[a]; er befreit sie von den Frevlern und rettet sie, weil sie bei ihm Zuflucht suchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für »befreien« steht zweimal unmittelbar hintereinander und kann auch mit »retten« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיַּעְזְרֵם
  choice: hilft ihnen
  rationale: עזר bezeichnet aktive Hilfe oder Beistand; das Präsens passt zu der zusammenfassenden Aussage des Psalms.
- source_word: וַיְפַלְּטֵם / יְפַלְּטֵם
  choice: befreit sie; er befreit sie
  rationale: פלט bezeichnet Befreiung oder Rettung aus Gefahr. Die unmittelbare Wiederholung wird als bewusstes poetisches Stilmittel bewahrt.
- source_word: מֵרְשָׁעִים
  choice: von den Frevlern
  rationale: Das substantivierte Pluraladjektiv bezeichnet schuldhaft handelnde, gottlose Menschen; »Frevler« ist knapp und im gehobenen Psalmregister verständlich.
- source_word: וְיוֹשִׁיעֵם
  choice: und rettet sie
  rationale: ישע trägt den umfassenden Sinn von Rettung und Heil; »rettet« unterscheidet das Wort zugleich vom zuvor wiederholten פלט.
- source_word: כִּי
  choice: weil
  rationale: Die Konjunktion führt hier natürlich den Grund für Jahwes rettendes Handeln ein.
- source_word: חָסוּ בוֹ
  choice: sie bei ihm Zuflucht suchen
  rationale: חסה beschreibt bildhaft das Aufsuchen von Schutz und Zuflucht; die Formulierung bewahrt diese Metapher gegenüber dem allgemeineren »vertrauen«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. »Jahwe« gibt ihn in der im Deutschen üblichen wissenschaftlichen Form wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiederholung des Verbs פלט
  choice: 'Die Wiederholung wird beibehalten: »befreit sie; er befreit sie«'
  alternative: Die Aussagen zu einer einzigen Befreiungsklausel zusammenziehen
  rationale: Die benachbarten Formen desselben Verbs setzen einen erkennbaren Nachdruck, der nicht durch stilistische Glättung verloren gehen soll.
- issue: Verhältnis von Zuflucht und Vertrauen in חָסוּ בוֹ
  choice: bei ihm Zuflucht suchen
  alternative: ihm vertrauen
  rationale: Die konkrete Schutzmetapher bleibt erhalten; das darin liegende Vertrauen wird nicht ausgeschlossen, aber auch nicht an die Stelle des Bildes gesetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Knappheit. Die Verbwiederholung des Hebräischen bleibt bewusst erhalten; »Frevler« wahrt den gehobenen Psalmton, ohne eine nicht ausdrücklich genannte Geschlechtsangabe einzuführen.
