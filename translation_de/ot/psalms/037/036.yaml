  text: וַ֭/יַּֽעֲבֹר וְ/הִנֵּ֣ה אֵינֶ֑/נּוּ וָֽ֝/אֲבַקְשֵׁ֗/הוּ וְ/לֹ֣א נִמְצָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/036.yaml
  text: But he passed by[a], and behold, he was no more; I sought him, but he could not be found.
translation:
  language: de
  text: Doch er ging vorüber[a], und siehe, er war nicht mehr da. Ich suchte ihn, aber er war nicht zu finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er verging.« Das hebräische Verb kann »vorübergehen« bedeuten und in diesem Zusammenhang auch ein Vergehen oder Verschwinden ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: Doch er ging vorüber
  rationale: Das Verb עבר bedeutet zunächst »vorübergehen« oder »vorbeigehen«, kann im Zusammenhang aber auch ein Vergehen beziehungsweise Verschwinden bezeichnen. Die Wiedergabe bleibt nahe am Bild des Hebräischen und vermeidet es, ausdrücklich seinen Tod zu behaupten.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Die Aufmerksamkeitspartikel hebt die überraschende Feststellung hervor. »Siehe« bewahrt ihre knappe, poetische Eindringlichkeit.
- source_word: אֵינֶנּוּ
  choice: er war nicht mehr da
  rationale: Die Wendung bezeichnet hier die Abwesenheit des Mannes. »Nicht mehr da« ist gegenwärtiges, natürliches Deutsch und legt weder Vernichtung noch Tod zwingend fest.
- source_word: וָאֲבַקְשֵׁהוּ
  choice: Ich suchte ihn
  rationale: בקשׁ bezeichnet das Suchen nach jemandem oder etwas; die knappe Wiedergabe entspricht dem poetischen Satzbau.
- source_word: וְלֹא נִמְצָא
  choice: aber er war nicht zu finden
  rationale: Die Nifalform von מצא drückt aus, dass er nicht gefunden wurde. Das adversative »aber« gibt den im Zusammenhang liegenden Gegensatz nach dem Suchen idiomatisch wieder.
theological_decisions:
- issue: Art des Verschwindens des Frevlers
  choice: Die Übersetzung lässt offen, ob sein Vorübergehen räumlich, bildlich als Verschwinden oder als Vergehen bis hin zum Tod verstanden wird.
  alternative: »Er starb« oder »er verschwand«
  rationale: Der hebräische Text stellt vor allem den plötzlichen Übergang von sichtbarer Gegenwart zu Abwesenheit heraus und legt die genaue Ursache nicht ausdrücklich fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. »Siehe« bleibt wegen der markanten hebräischen Aufmerksamkeitspartikel erhalten; die übrigen Formulierungen sind bewusst allgemeinverständlich.
