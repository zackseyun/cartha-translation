  text: וּֽ֭/פֹשְׁעִים נִשְׁמְד֣וּ יַחְדָּ֑ו אַחֲרִ֖ית רְשָׁעִ֣ים נִכְרָֽתָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/038.yaml
  text: But transgressors are destroyed together[a]; the future of the wicked is cut off.
translation:
  language: de
  text: Doch die Übertreter werden allesamt vernichtet; die Zukunft[a] der Frevler wird abgeschnitten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Ende“. Das hebräische Wort kann „Zukunft“, „Ausgang“ oder „Ende“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֹשְׁעִים
  choice: Doch die Abtrünnigen
  rationale: פֹשְׁעִים bezeichnet Menschen, die Grenzen überschreiten und sich auflehnen. „Abtrünnige“ bewahrt den Gedanken bewusster Auflehnung; das vorangestellte וּ wird wegen des Gegensatzes zum Schicksal der Rechtschaffenen im Kontext mit „Doch“ wiedergegeben.
- source_word: נִשְׁמְדוּ
  choice: werden vernichtet
  rationale: Der Nifal von שׁמד bezeichnet das Vernichtet- oder Ausgerottetwerden. „Werden vernichtet“ gibt die Härte des Gerichts wieder, ohne eine darüber hinausgehende metaphysische Aussage einzutragen.
- source_word: יַחְדָּו
  choice: allesamt
  rationale: Das Adverb kann „zusammen“ oder „insgesamt/allesamt“ bedeuten. „Allesamt“ ist hier im Deutschen natürlich und betont, dass keiner der Abtrünnigen dem gemeinsamen Geschick entgeht.
- source_word: אַחֲרִית
  choice: die Zukunft
  rationale: אַחֲרִית kann Zukunft, Ausgang oder Ende bezeichnen. „Zukunft“ drückt hier die verbleibende Aussicht der Frevler aus; die mögliche Bedeutung „Ende“ wird in einer Fußnote bewahrt.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: „Frevler“ ist eine knappe, im poetisch-weisheitlichen Zusammenhang verständliche Wiedergabe der moralischen Kategorie רְשָׁעִים.
- source_word: נִכְרָתָה
  choice: wird abgeschnitten
  rationale: Der Nifal von כרת bedeutet gewöhnlich „abgeschnitten/ausgerottet werden“. Die bildhafte Formulierung bewahrt die gerichtliche Schärfe des hebräischen Ausdrucks.
theological_decisions:
- issue: Bedeutung von אַחֲרִית im Gerichtszusammenhang
  choice: die Zukunft der Frevler wird abgeschnitten
  alternative: das Ende der Frevler wird abgeschnitten; die Nachkommenschaft der Frevler wird abgeschnitten
  rationale: Der hebräische Ausdruck kann die Zukunft, den endgültigen Ausgang, das Ende oder auch die Nachkommenschaft meinen. Im Zusammenhang werden die unterschiedlichen Geschicke gegenübergestellt; „Zukunft“ hält die Aussage weit, ohne sie auf die Nachkommen zu beschränken. Die ebenso mögliche Lesart „Ende“ wird in der Fußnote offengelegt.
translation_notes:
  register: Moderne, würdige Psalmsprache mit knapper Parallelstruktur. „Abtrünnige“ und „Frevler“ bewahren die moralisch-gerichtliche Färbung, während „allesamt“ den hebräischen poetischen Ton natürlich wiedergibt.
