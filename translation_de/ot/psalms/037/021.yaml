source:
  edition: WLC
  text: לֹוֶ֣ה רָ֭שָׁע וְ/לֹ֣א יְשַׁלֵּ֑ם וְ֝/צַדִּ֗יק חוֹנֵ֥ן וְ/נוֹתֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/021.yaml
  text: The wicked borrows and does not repay[b][a], but the righteous is gracious and gives.
translation:
  language: de
  text: Der Gottlose leiht sich etwas und zahlt es nicht zurück; der Gerechte aber ist gnädig[a] und gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erweist Gunst“. Im Zusammenhang kann auch „ist großzügig“ gemeint sein; das hebräische Wort bezeichnet grundsätzlich das Erweisen von Gnade oder Gunst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹוֶה
  choice: leiht sich etwas
  rationale: Das qalische Partizip von לוה bezeichnet hier das Borgen. Die reflexive Formulierung macht im Deutschen eindeutig, dass der Gottlose der Entleihende ist; „etwas“ lässt den Gegenstand wie im Hebräischen offen.
- source_word: רָשָׁע
  choice: der Gottlose
  rationale: Das substantivierte Adjektiv bezeichnet im repräsentativen Singular einen Menschen, dessen Haltung und Handeln Gott widersprechen. „Der Gottlose“ entspricht dem gehobenen Weisheitsstil und bildet einen klaren Gegenpol zu „der Gerechte“.
- source_word: לֹא יְשַׁלֵּם
  choice: zahlt es nicht zurück
  rationale: Das Piel von שלם bedeutet im Zusammenhang mit einem Darlehen, das Geschuldete zurückzuzahlen. Die deutsche Wendung ist natürlich und bewahrt den konkreten Zusammenhang.
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv steht als repräsentativer Singular im Gegensatz zu רָשָׁע. Die traditionelle, weiterhin verständliche Wiedergabe erhält den prägnanten Weisheitsstil.
- source_word: חוֹנֵן
  choice: ist gnädig
  rationale: Das qalische Partizip von חנן bezeichnet das Erweisen von Gunst oder Gnade. „Ist gnädig“ wahrt diese lexikalische Breite; im Parallelismus zeigt sich die Haltung im Geben.
- source_word: וְנוֹתֵן
  choice: und gibt
  rationale: נתן bedeutet gewöhnlich „geben“. Die Wiedergabe vermeidet es, den Ausdruck ohne zwingenden Grund auf „verleiht“ zu verengen.
theological_decisions:
- issue: Repräsentativer maskuliner Singular im Weisheitskontrast
  choice: „der Gottlose“ und „der Gerechte“ im Singular beibehalten
  alternative: „gottlose Menschen“ und „gerechte Menschen“ oder „ein gottloser Mensch“ und „ein gerechter Mensch“
  rationale: Der hebräische Text verwendet substantivierte maskuline Singularformen in allgemeingültigem, sprichwortartigem Sinn. Der deutsche Singular bewahrt sowohl die Form als auch den pointierten Gegensatz, ohne die Aussage auf eine bestimmte Einzelperson zu beschränken.
- issue: Verhältnis von gnädigem Handeln und Geben
  choice: 'חוֹנֵן und נוֹתֵן als zwei verbundene Aussagen wiedergeben: „ist gnädig und gibt“'
  alternative: „ist großzügig und gibt“ oder „leiht großzügig aus“
  rationale: Die Übersetzung bewahrt die begriffliche Gnaden- beziehungsweise Gunstkomponente von חנן und die offene Bedeutung von נתן. So wird weder das Geben bloß als Darlehen festgelegt noch die gnädige Haltung vollständig in Großzügigkeit aufgelöst.
translation_notes:
  register: Moderne, würdige Standardsprache mit dem knappen, antithetischen Stil eines Weisheitsspruchs. Das Semikolon markiert den deutlichen Gegensatz der beiden Vershälften. „Gottlose“ und „Gerechte“ sind im biblischen Sprachgebrauch geläufig und hier als repräsentative Personenbezeichnungen verständlich.
