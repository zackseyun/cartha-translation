  text: חֶ֤רֶב פָּֽתְח֣וּ רְשָׁעִים֮ וְ/דָרְכ֪וּ קַ֫שְׁתָּ֥/ם לְ֭/הַפִּיל עָנִ֣י וְ/אֶבְי֑וֹן לִ֝/טְב֗וֹחַ יִשְׁרֵי דָֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/014.yaml
  text: The wicked have drawn the sword and bent their bow[a], to bring down the poor and needy[b], to slaughter those upright in way.
translation:
  language: de
  text: Die Frevler haben das Schwert gezogen und ihren Bogen gespannt, um den Elenden und Bedürftigen zu Fall zu bringen, um die abzuschlachten, die aufrichtig ihren Weg gehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Aufrichtigen des Weges“; auch: „die auf geradem Weg sind“.'
    reason: Die hebräische Konstruktverbindung ist knapp und kann im Deutschen unterschiedlich idiomatisch wiedergegeben werden.
lexical_decisions:
- source_word: חֶרֶב פָּתְחוּ
  choice: haben das Schwert gezogen
  rationale: Das Verb bedeutet grundsätzlich „öffnen“, bezeichnet in Verbindung mit einem Schwert aber idiomatisch dessen Ziehen aus der Scheide.
- source_word: רְשָׁעִים
  choice: die Frevler
  rationale: Die substantivierte Mehrzahl bezeichnet Menschen, die schuldhaft und gottwidrig handeln. „Frevler“ bewahrt die moralische und religiöse Färbung, ohne das Geschlecht festzulegen.
- source_word: וְדָרְכוּ קַשְׁתָּם
  choice: und ihren Bogen gespannt
  rationale: Das Verb bezeichnet beim Bogen dessen Biegen beziehungsweise Spannen zur Schussbereitschaft. Der Singular „ihren Bogen“ folgt der hebräischen, möglicherweise kollektiv gebrauchten Form.
- source_word: לְהַפִּיל
  choice: um … zu Fall zu bringen
  rationale: Die Hifil-Form von נפל bedeutet „fallen machen“; die Wendung gibt den gewaltsamen Zusammenhang treffend wieder.
- source_word: עָנִי וְאֶבְיוֹן
  choice: den Elenden und Bedürftigen
  rationale: עָנִי kann Armut, Bedrängnis oder Erniedrigung bezeichnen; אֶבְיוֹן hebt Bedürftigkeit hervor. Die Übersetzung wahrt die verwandten, aber nicht identischen Bedeutungsnuancen.
- source_word: לִטְבֹחַ
  choice: abzuschlachten
  rationale: Das Verb ist stärker als ein allgemeines „töten“ und vermittelt die brutale Gewalt des Bildes.
- source_word: יִשְׁרֵי דָרֶךְ
  choice: alle …, die aufrichtig ihren Weg gehen
  rationale: Wörtlich steht „die Aufrichtigen des Weges“. Die gewählte Formulierung gibt die moralische Geradheit im Lebenswandel in natürlichem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von יִשְׁרֵי דָרֶךְ
  choice: Menschen, die aufrichtig ihren Weg gehen
  alternative: die auf geradem Weg sind
  rationale: Die Wendung beschreibt moralische Rechtschaffenheit im Lebenswandel. Sie wird weder auf eine bloß äußerliche Wegstrecke reduziert noch mit einer konfessionell bestimmten Vorstellung aufgeladen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kräftiger Bildsprache. Die beiden parallelen Absichtsangaben des Hebräischen bleiben erhalten; „Frevler“ und „abschlachten“ bewahren den ernsten poetischen Ton.
