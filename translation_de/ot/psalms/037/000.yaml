base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/000.yaml
  text: Of David[a]. Do not fret because of evildoers[b]; do not be envious of those who do wrong.
translation:
  language: de
  text: 'Von David.[a]


    Ärgere dich nicht über die, die Böses tun,[b]

    und beneide nicht die, die Unrecht begehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich eine knappe Psalmüberschrift: „David zugehörig“. Das Hebräische kann auch „für David“ bedeuten.'
    reason: textual_ambiguity
  - marker: b
    text: 'Oder: „Erhitze dich nicht über die, die Böses tun“ oder „Gerate nicht in Zorn über sie“. Das hebräische Verb bezeichnet ein Heiß-, Zornig- oder Aufgebrachtwerden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Präposition לְ kann in Psalmüberschriften Urheberschaft, Zugehörigkeit oder Widmung ausdrücken. „Von David“ ist die knappe, herkömmliche Wiedergabe; die mögliche Bedeutungsbreite wird in einer Fußnote bewahrt.
- source_word: אַל־תִּתְחַר
  choice: Entrüste dich nicht
  rationale: Das Verb חרה bezeichnet ein Heiß- oder Zornigwerden und kann hier Erregung oder Verdruss angesichts der Übeltäter ausdrücken. „Entrüste dich nicht“ wahrt diesen emotionalen Gehalt in würdigem, verständlichem Deutsch.
- source_word: בַּמְּרֵעִים
  choice: über die, die Böses tun
  rationale: Das substantivierte Partizip bezeichnet Menschen, die böse oder schädlich handeln. Die verbale Wiedergabe ist natürlich und vermeidet eine unnötig etikettierende Formulierung.
- source_word: אַל־תְּקַנֵּא
  choice: beneide nicht
  rationale: קנא kann Eifer, Eifersucht oder Neid bezeichnen. Mit der Präposition בְּ und in diesem Parallelismus ist „beneiden“ die naheliegende Bedeutung.
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: die, die Unrecht begehen
  rationale: עַוְלָה bezeichnet Unrecht, Verkehrtheit oder Ungerechtigkeit. „Unrecht begehen“ gibt die handelnde Konstruktion präzise und idiomatisch wieder.
theological_decisions:
- issue: Beziehung Davids zum Psalm in der Überschrift
  choice: „Von David“ mit erklärender Fußnote
  alternative: „Für David“ oder „David zugehörig“
  rationale: Der hebräische Ausdruck legt die genaue Art der Beziehung nicht eindeutig fest. Die Hauptfassung folgt dem üblichen Verständnis, ohne andere sprachlich mögliche Deutungen auszuschließen.
- issue: Art der untersagten Reaktion auf Böses
  choice: „Entrüste dich nicht“
  alternative: „Gerate nicht in Zorn“ oder „Erhitze dich nicht“
  rationale: Der Text kann sowohl zornige Erregung als auch aufgewühlten Verdruss bezeichnen. Die Übersetzung lässt diese Spannung bestehen und macht daraus weder bloße Sorge noch ausschließlich sündhaften Zorn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erhalten; verbale Personenbezeichnungen sorgen für Verständlichkeit und vermeiden unnötig starre Etiketten.
