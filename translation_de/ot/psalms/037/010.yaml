  text: וְ/ע֣וֹד מְ֭עַט וְ/אֵ֣ין רָשָׁ֑ע וְ/הִתְבּוֹנַ֖נְתָּ עַל מְקוֹמ֣/וֹ וְ/אֵינֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/010.yaml
  text: Yet a little while[a], and the wicked will be no more; though you look carefully at his place, he will not be there.
translation:
  language: de
  text: Nur noch eine kleine Weile, dann ist der Frevler[a] nicht mehr da; siehst du dich an seinem Ort genau um, ist er nicht mehr da.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Gottlose“. Der maskuline Singular im Hebräischen kann hier stellvertretend beziehungsweise allgemein für gottlose Menschen stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד מְעַט
  choice: Nur noch eine kleine Weile
  rationale: Die Wortgruppe bezeichnet idiomatisch eine kurze verbleibende Zeit. Die Formulierung ist zeitgemäß und bewahrt den vorausblickenden Sinn.
- source_word: וְאֵין רָשָׁע
  choice: dann ist der Frevler nicht mehr da
  rationale: Das substantivierte maskuline Singularwort רָשָׁע bezeichnet hier einen repräsentativen einzelnen Frevler und kann zugleich generisch verstanden werden. Im zukunftsbezogenen Zusammenhang drückt וְאֵין sein bevorstehendes Nichtmehrvorhandensein aus.
- source_word: וְהִתְבּוֹנַנְתָ
  choice: siehst du dich … genau um
  rationale: Der Hitpolel von בין bezeichnet aufmerksames Betrachten oder genaues Prüfen. Die deutsche Wendung gibt die intensive Beobachtung natürlich wieder.
- source_word: עַל מְקוֹמוֹ
  choice: an seinem Ort
  rationale: Die Wendung richtet den Blick auf den konkreten Ort, an dem der Frevler zuvor anzutreffen war.
- source_word: וְאֵינֶנּוּ
  choice: ist er nicht mehr da
  rationale: Die abschließende Existenzverneinung unterstreicht nochmals konkret seine Abwesenheit. Die Wiederholung entspricht der eindringlichen Struktur des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Frevler“ bewahrt den ethisch-religiösen Gehalt von רָשָׁע, ohne eine zusätzliche juristische Festlegung einzutragen; die konkrete Ortsvorstellung und die hebräische Wiederholung von „nicht mehr da“ bleiben erhalten.
