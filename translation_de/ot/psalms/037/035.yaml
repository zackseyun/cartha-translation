  text: רָ֭אִיתִי רָשָׁ֣ע עָרִ֑יץ וּ֝/מִתְעָרֶ֗ה כְּ/אֶזְרָ֥ח רַעֲנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/035.yaml
  text: I have seen a wicked[a], ruthless man spreading himself out like a flourishing native tree.
translation:
  language: de
  text: Ich sah einen gottlosen, rücksichtslosen Mann, der sich ausbreitete wie ein üppig grüner heimischer Baum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck ist schwierig und lautet wörtlich etwa „wie ein üppig Grüner/Einheimischer“. Häufig wird darunter ein kräftig gedeihender Baum verstanden, der an seinem heimischen Ort wächst.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Ich sah
  rationale: Das Qal Perfekt der 1. Person Singular berichtet eine persönliche Beobachtung. Das deutsche Präteritum klingt hier natürlich und bewahrt den erzählenden Rückblick.
- source_word: רָשָׁע
  choice: gottlosen
  rationale: Das Wort bezeichnet in der Weisheits- und Psalmensprache einen Menschen, der moralisch schuldig und gegen Gottes Ordnung gerichtet ist. „Gottlos“ ist die etablierte, verständliche Wiedergabe.
- source_word: עָרִיץ
  choice: Gewaltherrscher
  rationale: Der Ausdruck bezeichnet einen mächtigen, einschüchternden und unterdrückerischen Menschen. „Gewaltherrscher“ verbindet Machtstellung und Rücksichtslosigkeit, ohne die Aussage auf einen einzelnen Gewaltakt zu verengen.
- source_word: וּמִתְעָרֶה
  choice: der sich ausbreitete
  rationale: Die reflexive Partizipialform beschreibt ein machtvolles, ausgreifendes Gedeihen. „Sich ausbreiten“ erhält sowohl die reflexive Nuance als auch das Baumbild.
- source_word: כְּאֶזְרָח
  choice: wie … ein Baum auf heimischem Boden
  rationale: אֶזְרָח bedeutet gewöhnlich „Einheimischer“ beziehungsweise „einheimisch“. Im poetischen Vergleich liegt wahrscheinlich ein Baum nahe, der an seinem angestammten Standort kräftig gedeiht; „Baum“ und „Boden“ machen dieses implizite Bild verständlich.
- source_word: רַעֲנָן
  choice: üppig grün
  rationale: Das Adjektiv bezeichnet frische, kräftige, grüne Vegetation. „Üppig grün“ bewahrt das konkrete Pflanzenbild und vermittelt zugleich blühendes Wohlergehen.
theological_decisions: []
