  text: יְ֭הוָה לֹא יַעַזְבֶ֣/נּוּ בְ/יָד֑/וֹ וְ/לֹ֥א יַ֝רְשִׁיעֶ֗/נּוּ בְּ/הִשָּׁפְטֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/033.yaml
  text: Yahweh will not leave him in his hand[c][b][a], nor condemn him when he is judged.
translation:
  language: de
  text: Jahwe wird ihn nicht in der Gewalt des Bösen lassen und ihn nicht schuldig sprechen, wenn er gerichtet wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel wie »der HERR« zu ersetzen.
- source_word: יַעַזְבֶנּוּ בְיָדוֹ
  choice: wird ihn nicht der Hand des Bösen überlassen
  rationale: עזב bezeichnet hier das Überlassen oder Preisgeben; בְיָדוֹ bewahrt das hebräische Bild der Hand als Machtbereich. »Des Bösen« verdeutlicht den im unmittelbaren Kontext genannten Bezug des Pronomens.
- source_word: יַרְשִׁיעֶנּוּ
  choice: ihn nicht schuldig sprechen
  rationale: 'Der Hifil von רשע hat hier forensischen Sinn: jemanden für schuldig erklären beziehungsweise verurteilen.'
- source_word: בְּהִשָּׁפְטוֹ
  choice: wenn er gerichtet wird
  rationale: Die Präposition בְּ mit dem Infinitiv und Objektsuffix wird zeitlich verstanden. Die passive Form bewahrt die Unbestimmtheit darüber, wer konkret Gericht hält.
theological_decisions:
- issue: Bezug der Pronomen
  choice: Die Objektpronomen beziehen sich auf den Gerechten; »seiner Hand« bezeichnet die Hand des Bösen aus dem Zusammenhang.
  alternative: Die Beteiligten könnten in der Übersetzung allgemeiner als gerechte und böse Menschen bezeichnet werden.
  rationale: Der unmittelbare Kontext setzt den einzelnen Bösen und den Gerechten einander gegenüber. Die Ergänzung »des Bösen« klärt lediglich den deutschen Pronomenbezug.
- issue: Forensischer Sinn des zweiten Halbverses
  choice: Jahwe wird den Gerechten beim Gericht nicht schuldig sprechen.
  alternative: Jahwe wird nicht zulassen, dass er verurteilt wird.
  rationale: Das Hebräische macht Jahwe grammatisch zum Subjekt auch des zweiten Verbs. Daher wird keine zusätzliche menschliche Gerichtsinstanz eingeführt; zugleich bleibt offen, wie sich diese Aussage innerhalb der Gerichtssituation erfüllt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wendung »der Hand des Bösen überlassen« bewahrt das hebräische Machtbild, bleibt aber verständlich. »Schuldig sprechen« hält den gerichtlichen Wortschatz und vermeidet eine über die Formulierung hinausgehende dogmatische Deutung.
