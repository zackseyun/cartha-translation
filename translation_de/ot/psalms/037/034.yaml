  text: קַוֵּ֤ה אֶל יְהוָ֨ה וּ/שְׁמֹ֬ר דַּרְכּ֗/וֹ וִֽ֭/ירוֹמִמְ/ךָ לָ/רֶ֣שֶׁת אָ֑רֶץ בְּ/הִכָּרֵ֖ת רְשָׁעִ֣ים תִּרְאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/034.yaml
  text: Wait for Yahweh and keep his way[a], and he will exalt you to inherit the land; when the wicked are cut off[c][b], you will see it.
translation:
  language: de
  text: Hoffe auf Jahwe und halte dich an seinen Weg; er wird dich erhöhen, damit du das Land[a] erbst. Wenn die Frevler ausgerottet werden, wirst du es sehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Erde“. Das hebräische Wort אָרֶץ kann „Land“ oder „Erde“ bedeuten. Hier wurde wegen der in Psalm 37 wiederkehrenden Sprache vom verheißenen Erbe „Land“ gewählt. Vgl. Matthäus 5,5.'
    reason: alternative_reading_and_cross_reference
  - marker: b
    text: 'Wörtlich: „wirst du sehen“. Das ergänzte „es“ bezieht sich auf die Ausrottung der Frevler.'
    reason: translation_clarity
lexical_decisions:
- source_word: קַוֵּה אֶל
  choice: Hoffe auf
  rationale: Das Verb bezeichnet geduldiges, erwartungsvolles Warten und Vertrauen. „Hoffe auf“ ist im modernen Deutschen natürlich und bewahrt die Ausrichtung auf Jahwe; „Warte auf“ bleibt ebenfalls möglich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּשְׁמֹר דַּרְכּוֹ
  choice: und halte dich an seinen Weg
  rationale: שׁמר bedeutet bewahren, beachten oder einhalten. Die deutsche Wendung gibt hier treue Orientierung an Gottes Weg verständlich wieder, ohne den Ausdruck auf einzelne Gebote einzuengen.
- source_word: וִירוֹמִמְךָ
  choice: dann wird er dich erhöhen
  rationale: Die Hifil-Form von רום bezeichnet ein Erhöhen oder Emporheben; „erhöhen“ bewahrt den poetischen Ton und den Gedanken göttlicher Bestätigung.
- source_word: לָרֶשֶׁת אָרֶץ
  choice: sodass du das Land erbst
  rationale: ירשׁ kann erben oder in Besitz nehmen bedeuten. „Erben“ erhält die im Psalm wiederkehrende Verheißungs- und Bundessprache. אָרֶץ ist als „Land“ wiedergegeben, kann aber auch „Erde“ bedeuten.
- source_word: בְּהִכָּרֵת רְשָׁעִים
  choice: Wenn die Frevler ausgerottet werden
  rationale: Die Konstruktion bezeichnet den Zeitpunkt des Geschehens. „Ausgerottet werden“ gibt das gerichtliche Gewicht von כרת idiomatisch wieder.
- source_word: תִּרְאֶה
  choice: wirst du es sehen
  rationale: Das ergänzte „es“ macht im Deutschen deutlich, dass der Angeredete dieses Geschehen miterleben wird; im Hebräischen steht lediglich „du wirst sehen“.
theological_decisions:
- issue: Bedeutung von אָרֶץ im Kontext von Bund und Weisheit
  choice: Land
  alternative: Erde
  rationale: Psalm 37 gebraucht wiederholt die Sprache vom Erben des Landes und knüpft damit an Israels Bundesverheißung an. Zugleich kann אָרֶץ weiter gefasst „Erde“ bedeuten; diese echte Mehrdeutigkeit wird in der Fußnote bewahrt.
- issue: Art des erwartungsvollen Vertrauens in קוה
  choice: Hoffe auf
  alternative: Warte auf
  rationale: „Hoffe auf“ bringt das vertrauensvolle Erwarten im Deutschen knapp zum Ausdruck. „Warte auf“ betont stärker die Geduld und ist ebenfalls lexikalisch möglich.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Der Parallelismus bleibt erhalten; unnötige Archaismen werden vermieden. „Frevler“ gibt רְשָׁעִים als Bezeichnung schuldhaft böser Menschen prägnant wieder.
