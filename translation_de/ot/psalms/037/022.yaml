id: PSA.37.22
reference: Psalms 37:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י מְ֭בֹרָכָי/ו יִ֣ירְשׁוּ אָ֑רֶץ וּ֝/מְקֻלָּלָ֗י/ו יִכָּרֵֽתוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/022.yaml
  text: For those blessed by him will inherit the land[a], but those cursed by him will be cut off.
translation:
  language: de
  text: Denn die von ihm Gesegneten werden das Land[a] erben, aber die von ihm Verfluchten werden ausgerottet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Erde“. Das hebräische Wort אֶרֶץ kann sowohl „Land“ als auch „Erde“ bedeuten; hier passt „das Land“ am besten zum Zusammenhang des Psalms.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Aussage ein und entspricht dem argumentativen Zusammenhang des Psalms.
- source_word: מְבֹרָכָיו
  choice: die von ihm Gesegneten
  rationale: Gibt das passive Partizip mit Suffix wieder und macht den aus dem Kontext erschließbaren göttlichen Urheber deutlich.
- source_word: יִירְשׁוּ
  choice: werden … erben
  rationale: Bewahrt sowohl den Grundsinn von ירש als auch den bundesbezogenen Klang des verheißenen Landbesitzes.
- source_word: אָרֶץ
  choice: das Land
  rationale: Passt am besten zur wiederkehrenden Landverheißung in Psalm 37; die ebenfalls mögliche Bedeutung „die Erde“ bleibt in einer Fußnote erhalten.
- source_word: וּמְקֻלָּלָיו
  choice: aber die von ihm Verfluchten
  rationale: Das „aber“ bringt den sachlichen Gegensatz der beiden Vershälften natürlich zum Ausdruck; die passive Form und der Bezug des Suffixes bleiben gewahrt.
- source_word: יִכָּרֵתוּ
  choice: werden ausgerottet
  rationale: Gibt das Nifal von כרת als geläufige, zugleich gewichtige deutsche Wendung wieder und wahrt dessen gerichtlichen Sinn.
theological_decisions:
- issue: Bezug der Suffixe der 3. Person Singular in מְבֹרָכָיו und מְקֻלָּלָיו
  choice: Explizit als „von ihm“ wiedergegeben; gemeint ist im Psalmzusammenhang der HERR.
  alternative: Wörtlicher „seine Gesegneten“ und „seine Verfluchten“, ohne den Urheber ausdrücklich zu benennen.
  rationale: Die Suffixe stellen beide Gruppen in Beziehung zu der im Kontext gemeinten singulären Person. „Von ihm“ verdeutlicht die bei den passiven Partizipien implizierte Urheberschaft, ohne eine neue Aussage hinzuzufügen.
- issue: Bedeutungsumfang von אָרֶץ
  choice: das Land
  alternative: die Erde
  rationale: Die wiederholte Verheißung in Psalm 37 steht zunächst im bundes- und weisheitstheologischen Horizont des Landes. Die breitere Bedeutung „Erde“ ist sprachlich möglich und wird deshalb in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Formulierung „die von ihm Gesegneten / die von ihm Verfluchten“ bildet die hebräische Gegenüberstellung ab. „Ausgerottet“ wahrt die starke gerichtliche Bildsprache, ohne sie weiter auszudeuten.
