  text: כָּל הַ֭/יּוֹם חוֹנֵ֣ן וּ/מַלְוֶ֑ה וְ֝/זַרְע֗/וֹ לִ/בְרָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/026.yaml
  text: All day long he is gracious and lends[a], and his offspring are a blessing.
translation:
  language: de
  text: Den ganzen Tag ist er gnädig und leiht aus, und seine Nachkommen sind ein Segen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Nachkommen sind gesegnet“. Wörtlich lautet das Hebräische: „seine Nachkommen [sind] zum Segen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Die Wendung bezeichnet ein fortwährendes oder gewohnheitsmäßiges Handeln. „Den ganzen Tag“ ist im modernen Deutsch natürlich und bewahrt die zeitliche Aussage.
- source_word: חוֹנֵן
  choice: ist gnädig
  rationale: Das Partizip von חנן bezeichnet das Erweisen von Gunst oder Gnade. „Ist gnädig“ bewahrt den lexikalischen Kern und passt zum parallelen großzügigen Verleihen.
- source_word: וּמַלְוֶה
  choice: und leiht
  rationale: Der Hifil von לוה bedeutet hier „verleihen“, nicht „ausleihen“. Die knappe Form gibt den gewohnheitsmäßigen Charakter des Partizips wieder.
- source_word: וְזַרְעוֹ
  choice: und seine Nachkommen
  rationale: זֶרַע ist ein kollektiver Ausdruck für Nachkommenschaft. „Nachkommen“ ist natürlich, eindeutig und weniger missverständlich als das wörtliche „Same“.
- source_word: לִבְרָכָה
  choice: sind ein Segen
  rationale: Die Präpositionalverbindung bedeutet wörtlich „zum Segen“. „Sind ein Segen“ gibt die naheliegende resultative beziehungsweise charakterisierende Bedeutung idiomatisch wieder.
theological_decisions:
- issue: Sinn der Schlusswendung לִבְרָכָה
  choice: seine Nachkommen sind ein Segen
  alternative: seine Nachkommen sind gesegnet
  rationale: Die Verbindung von ל mit בְּרָכָה bezeichnet am ehesten Bestimmung oder Ergebnis („zum Segen“), sodass die Nachkommen selbst als Segen charakterisiert werden. Die alternative Auffassung, dass sie Segen empfangen, bleibt möglich und wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und der partizipiale, gewohnheitsmäßige Sinn werden bewahrt; die Mehrdeutigkeit der Schlusswendung wird nicht stillschweigend beseitigt.
