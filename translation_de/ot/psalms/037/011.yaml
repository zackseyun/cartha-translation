  text: וַ/עֲנָוִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ֝/הִתְעַנְּג֗וּ עַל רֹ֥ב שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/011.yaml
  text: But the humble will inherit the land and delight themselves in abundant peace[a][b].
translation:
  language: de
  text: Doch die Demütigen[a] werden das Land[b] erben und sich an der Fülle des Friedens erfreuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Sanftmütigen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: die Erde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  choice: die Demütigen
  rationale: Das Wort bezeichnet niedrige, gebeugte oder demütige Menschen. „Die Demütigen“ ist im heutigen Deutsch verständlich und bewahrt den ethischen Sinn; „die Sanftmütigen“ bleibt als traditionsreiche Alternative in einer Fußnote erhalten.
- source_word: יִירְשׁוּ
  choice: werden ... erben
  rationale: Das Verb kann „erben“ oder „in Besitz nehmen“ bedeuten. „Erben“ bewahrt sowohl den Zukunftsbezug als auch den bundestheologischen Anklang.
- source_word: אָרֶץ
  choice: das Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der Kontext des Psalms, in dem vom Bleiben und Erben im Land die Rede ist, spricht für „das Land“; die weitere Bedeutung „die Erde“ wird in einer Fußnote bewahrt.
- source_word: וְהִתְעַנְּגוּ
  choice: und sich ... erfreuen
  rationale: Die Hitpael-Form bezeichnet intensives, selbst erfahrenes Wohlgefallen. „Sich erfreuen“ gibt die reflexive Nuance in natürlichem, würdigem Deutsch wieder.
- source_word: עַל
  choice: an
  rationale: In Verbindung mit „sich erfreuen“ entspricht „an“ dem natürlichen deutschen Sprachgebrauch und gibt die Beziehung zum folgenden Friedensreichtum angemessen wieder.
- source_word: רֹב
  choice: reich
  rationale: Das Substantiv bezeichnet Fülle oder Überfluss. Die adjektivische Wiedergabe „reich“ ergibt eine natürliche deutsche Formulierung und erhält den Gedanken großer Fülle.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: „Frieden“ ist die prägnante Standardwiedergabe und umfasst im Kontext sichere, ungestörte Wohlfahrt, auch wenn das hebräische Wort darüber hinaus Ganzheit und Wohlergehen einschließen kann.
theological_decisions:
- issue: Intertextueller Anklang an Matthäus 5,5 und die traditionelle Formulierung „Die Sanftmütigen werden die Erde erben“
  choice: Den hebräischen Psalmtext im Haupttext mit „die Demütigen werden das Land erben“ wiedergeben und „die Sanftmütigen“ sowie „die Erde“ als mögliche Alternativen in Fußnoten erhalten.
  alternative: Die Sanftmütigen werden die Erde erben.
  rationale: Die Hauptfassung folgt vorrangig dem hebräischen Kontext und entscheidet die echte Bedeutungsbreite der Wörter nicht aufgrund der späteren Rezeptionsgeschichte. Zugleich werden die traditionsreiche Formulierung und ihre berechtigte lexikalische Grundlage nicht unterdrückt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die Satzstellung bleibt flüssig; „Doch“ bildet den kontrastierenden Anschluss des hebräischen וַ ab. Sämtliche Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
