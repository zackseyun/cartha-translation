translation:
  language: de
  text: Der Gottlose beobachtet den Gerechten[a] und sucht ihn zu töten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lauert dem Gerechten auf“. Das hebräische Verb kann in diesem Zusammenhang ein feindseliges Beobachten mit schädlicher Absicht bezeichnen.'
