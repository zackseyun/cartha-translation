  - marker: b
    text: 'Oder: „ihn umzubringen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צוֹפֶה
  choice: beobachtet
  rationale: Das Partizip von צפה bezeichnet aufmerksames Beobachten oder Lauern. „Beobachtet“ bewahrt den Grundsinn; die feindliche Absicht wird durch den Zusammenhang und den parallelen zweiten Satzteil deutlich.
- source_word: רָשָׁע
  choice: der Gottlose
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet im repräsentativen Singular einen Menschen, dessen Handeln sich gegen Gottes Willen richtet. „Der Gottlose“ entspricht der ethisch-religiösen Kategorie des Psalms und ist in gehobenem modernem Deutsch verständlich.
- source_word: לַצַּדִּיק
  choice: den Gerechten
  rationale: צַדִּיק bezeichnet hier den Menschen, der gerecht handelt beziehungsweise vor Gott als gerecht gilt. „Den Gerechten“ bewahrt die zentrale Gegenüberstellung des Psalms.
- source_word: וּמְבַקֵּשׁ
  choice: und sucht
  rationale: בקש bedeutet gewöhnlich „suchen“ und bezeichnet hier das zielgerichtete feindliche Bestreben des Gottlosen.
- source_word: לַהֲמִיתוֹ
  choice: ihn zu töten
  rationale: Der Hifil-Infinitiv von מות bedeutet wörtlich, jemanden sterben zu lassen beziehungsweise zu töten. „Ihn zu töten“ gibt die kausative Bedeutung natürlich und prägnant wieder.
- source_word: וּ
  choice: und
  rationale: Die Konjunktion verbindet die beiden parallelen Handlungen des Beobachtens und des Tötungsstrebens.
