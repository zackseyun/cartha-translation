  text: שְׁמָר תָּ֭ם וּ/רְאֵ֣ה יָשָׁ֑ר כִּֽי אַחֲרִ֖ית לְ/אִ֣ישׁ שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/037.yaml
  text: Observe the blameless[a], and see the upright[c][b], for there is a future for the man of peace.
translation:
  language: de
  text: Achte auf den Lauteren[a] und sieh den Aufrichtigen an; denn der Mann des Friedens[c] hat Zukunft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Beachte den Untadeligen“ oder „Beobachte den Lauteren genau“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische אַחֲרִית kann auch „Ende“ oder „Ausgang“ bedeuten; manche verstehen es hier im Sinn von „Nachkommenschaft“.
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „ein friedfertiger Mann“. שָׁלוֹם kann außerdem Wohlergehen oder Ganzheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר
  choice: Achte auf
  rationale: Der Imperativ bezeichnet hier das aufmerksame Beobachten beziehungsweise Beachten eines Menschen, nicht dessen Bewachen. „Achte auf“ ist im heutigen Deutsch natürlich und bewahrt den auffordernden Charakter.
- source_word: תָּם
  choice: den Lauteren
  rationale: תָּם bezeichnet sittliche Unversehrtheit und Redlichkeit, nicht sündlose Vollkommenheit. „Der Lautere“ gibt diese Eigenschaft substantivisch wieder und passt zum poetischen Parallelismus.
- source_word: וּרְאֵה
  choice: und sieh auf
  rationale: Der zweite Imperativ steht parallel zu שְׁמָר. „Sieh auf“ erhält die direkte Aufforderung und vermeidet das altertümlichere „siehe“.
- source_word: יָשָׁר
  choice: den Aufrichtigen
  rationale: יָשָׁר bezeichnet moralische Geradheit. „Der Aufrichtige“ ist eine idiomatische substantivische Wiedergabe und steht parallel zu „der Lautere“.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier die vorangehende Aufforderung; „denn“ bildet diesen erklärenden Zusammenhang klar ab.
- source_word: אַחֲרִית
  choice: Zukunft
  rationale: Das Wort kann Zukunft, späteres Ende oder Ausgang bezeichnen. Im Zusammenhang von Psalm 37 hebt es die bleibende positive Aussicht des Friedfertigen hervor, ohne den Begriff auf Nachkommenschaft festzulegen.
- source_word: לְאִישׁ
  choice: ein Mann … hat
  rationale: Die hebräische Besitz- beziehungsweise Existenzkonstruktion wird im Deutschen idiomatisch mit „hat“ wiedergegeben. Das ausdrücklich maskuline Singularwort אִישׁ bleibt als „Mann“ erhalten.
- source_word: שָׁלוֹם
  choice: des Friedens
  rationale: Die Genitivfügung „Mann des Friedens“ folgt der offenen hebräischen Charakterisierung und bewahrt neben Friedfertigkeit auch die weiteren Bedeutungsfelder von שָׁלוֹם, etwa Wohlergehen und Ganzheit.
theological_decisions:
- issue: Das maskuline Singularwort אִישׁ in einer Weisheitsaussage
  choice: ein Mann
  alternative: ein Mensch / der Friedfertige
  rationale: Da der hebräische Text ausdrücklich אִישׁ verwendet, wird das grammatische und lexikalische Geschlecht nicht neutralisiert. Die mögliche allgemeine Geltung der Weisheitsaussage bleibt davon unberührt.
- issue: Bedeutung von אַחֲרִית für das Geschick des Friedfertigen
  choice: hat Zukunft
  alternative: hat ein Ende / hat einen Ausgang / hat Nachkommen
  rationale: „Zukunft“ vermittelt im Kontext die positive Aussicht, legt aber nicht dogmatisch fest, ob das zeitliche Geschick, der endgültige Ausgang oder die Nachkommenschaft gemeint ist. Die Alternativen werden in der Fußnote offengehalten.
- issue: Charakterisierung אִישׁ שָׁלוֹם
  choice: ein Mann des Friedens
  alternative: ein friedfertiger Mann / ein Mann, dem Wohlergehen zuteilwird
  rationale: Die formnahe Wendung lässt offen, ob שָׁלוֹם vor allem den friedfertigen Charakter des Mannes, sein Wohlergehen oder seine Ganzheit beschreibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelität. „Mann des Friedens“ ist bewusst etwas gehoben, bleibt aber verständlich und bewahrt die semantische Offenheit der hebräischen Genitivverbindung.
