source:
  edition: WLC
  text: וְ/הִתְעַנַּ֥ג עַל יְהוָ֑ה וְ/יִֽתֶּן לְ֝/ךָ֗ מִשְׁאֲלֹ֥ת לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/004.yaml
  text: Delight yourself in Yahweh[a], and he will give you the desires of your heart.
translation:
  language: de
  text: Freu dich an Jahwe, und er wird dir geben, was dein Herz begehrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Wünsche deines Herzens“. Das hebräische Wort kann auch die Bitten oder Anliegen bezeichnen, die aus dem Herzen kommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעַנַּג
  choice: Freu dich
  rationale: Der Hitpael-Imperativ fordert den Angesprochenen dazu auf, seine Freude beziehungsweise sein Wohlgefallen zu finden. „Freu dich“ gibt dies im modernen Deutschen natürlich und knapp wieder.
- source_word: עַל
  choice: an
  rationale: Die Präposition bedeutet grundsätzlich „auf/über“, bezeichnet bei diesem Verb aber den Bezug der Freude. Idiomatisches Deutsch verwendet hier „sich an jemandem freuen“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יִתֶּן
  choice: er wird dir geben
  rationale: Das Qal-Imperfekt mit וְ wird im weisheitlichen Zusammenhang als zukünftige Folge beziehungsweise Zusage verstanden. Die direkte Wiedergabe bewahrt die offene Spannung der Verheißung.
- source_word: מִשְׁאֲלֹת
  choice: was … begehrt
  rationale: Das Substantiv kann Wünsche, Begehren oder Bitten bezeichnen. Die deutsche Relativkonstruktion ist natürlich und bringt im Haupttext die inneren Wünsche zum Ausdruck; die mögliche Bedeutung „Bitten“ wird in der Fußnote bewahrt.
- source_word: לִבֶּךָ
  choice: dein Herz
  rationale: „Herz“ entspricht dem hebräischen Ausdruck und bezeichnet hier das innere Wollen und Verlangen des Menschen.
theological_decisions:
- issue: Mögliche wohlstandstheologische Verengung der Zusage
  choice: Die Zusage wird ohne einschränkende oder erklärende Zusätze direkt wiedergegeben.
  alternative: Im Haupttext „gottgefällige Wünsche“ ergänzen oder von einer Umgestaltung der Wünsche sprechen.
  rationale: Solche Deutungen können aus einem größeren theologischen Zusammenhang entwickelt werden, stehen aber nicht ausdrücklich in diesem Vers. Die Übersetzung soll die Spannung der uneingeschränkten Formulierung bewahren.
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht das Tetragramm יהוה als persönlicher Gottesname. Daher wird es als „Jahwe“ wiedergegeben.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Der Imperativ ist bewusst direkt formuliert; die anschließende Zusage bleibt ohne theologische Erläuterung im Haupttext stehen.
