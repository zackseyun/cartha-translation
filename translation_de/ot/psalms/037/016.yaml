  text: טוֹב מְ֭עַט לַ/צַּדִּ֑יק מֵ֝/הֲמ֗וֹן רְשָׁעִ֥ים רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/016.yaml
  text: Better is a little that belongs to the righteous than the abundance of many wicked people[a][b].
translation:
  language: de
  text: Besser ist das Wenige, das der Gerechte hat, als der Überfluss vieler Frevler.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Besser ist das Wenige für den Gerechten als der Überfluss der Frevler.« Das Hebräische ist knapp formuliert; das Verhältnis des »Wenigen« zum Gerechten kann als Besitz oder allgemeiner als Zuordnung verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Besser ist
  rationale: In der elliptischen Vergleichskonstruktion hat טוֹב den Sinn »besser«; die Voranstellung bewahrt den sprichwortartigen Ton.
- source_word: מְעַט
  choice: das Wenige
  rationale: Das substantivierte »das Wenige« bezeichnet eine geringe Menge und bildet einen klaren Gegensatz zu »Überfluss«.
- source_word: לַצַּדִּיק
  choice: das der Gerechte hat
  rationale: Das ל kann hier in der elliptischen Formulierung Besitz oder Zuordnung ausdrücken. Die Wiedergabe macht diesen Sinn in natürlichem Deutsch sichtbar, ohne genauer festzulegen, worin das Wenige besteht.
- source_word: מֵהֲמוֹן
  choice: als der Überfluss
  rationale: הָמוֹן kann Fülle, Menge oder Überfluss bezeichnen. »Überfluss« wahrt die Breite des Ausdrucks besser als das engere »Reichtum« und entspricht dem Gegensatz zu »das Wenige«.
- source_word: רְשָׁעִים
  choice: Frevler
  rationale: Das substantivierte Adjektiv bezeichnet schuldhaft böse handelnde Menschen; »Frevler« ist im poetischen Bibeldeutsch prägnant und würdevoll.
- source_word: רַבִּים
  choice: vieler
  rationale: 'Der maskuline Plural legt nahe, רַבִּים auf רְשָׁעִים zu beziehen: Es sind viele Frevler, nicht lediglich ein besonders großer Überfluss.'
