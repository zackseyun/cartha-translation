  text: מֵ֭/יְהוָה מִֽצְעֲדֵי גֶ֥בֶר כּוֹנָ֗נוּ וְ/דַרְכּ֥/וֹ יֶחְפָּֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/023.yaml
  text: From Yahweh a man's steps are established[b][a], and he delights in his way.
translation:
  language: de
  text: Der HERR macht die Schritte eines Mannes fest und hat Gefallen an seinem Weg.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder der zweite Satzteil kann auf den Mann bezogen werden: „und er hat Gefallen an seinem Weg.“'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵיְהוָה
  choice: Der HERR
  rationale: Die Präposition מִן bezeichnet hier Ursprung bzw. Urheberschaft. Die aktive deutsche Formulierung gibt die göttliche Wirksamkeit natürlich wieder; der Gottesname JHWH wird konventionsgemäß mit „der HERR“ wiedergegeben.
- source_word: מִצְעֲדֵי
  choice: die Schritte
  rationale: Das Substantiv bezeichnet Schritte bzw. die Bewegungen beim Gehen und kann bildlich den Lebensweg meinen. „Schritte“ bewahrt dieses Bild in natürlichem Deutsch.
- source_word: גֶבֶר
  choice: eines Mannes
  rationale: גֶבֶר bezeichnet grammatisch und lexikalisch einen Mann, teils mit dem Beiklang von Kraft. Hier steht das Wort in einer allgemeinen Weisheitsaussage; „eines Mannes“ gibt die Form genau wieder, ohne den Kraftaspekt unnötig einzutragen.
- source_word: כּוֹנָנוּ
  choice: festigt
  rationale: Die passive Form von כון bedeutet „gefestigt“, „fest gegründet“ oder „sicher hingestellt werden“. Die aktive Umformung mit dem HERRN als Subjekt ist im Deutschen klar und bewahrt den Gedanken göttlicher Urheberschaft.
- source_word: וְדַרְכּוֹ
  choice: an seinem Weg
  rationale: דֶּרֶךְ bezeichnet den Weg und bildlich die Lebensführung. Das Possessivsuffix verweist am ehesten auf den Mann.
- source_word: יֶחְפָּץ
  choice: hat Gefallen
  rationale: חפץ bezeichnet Gefallen, Freude oder Wohlgefallen. „Gefallen haben an“ ist eine natürliche und würdige Wiedergabe; das unausgesprochene Subjekt wird in der Hauptlesart als der HERR verstanden.
theological_decisions:
- issue: Subjekt von יֶחְפָּץ („hat Gefallen“)
  choice: 'Der HERR ist das Subjekt: Er festigt die Schritte und hat Gefallen am Weg des Mannes.'
  alternative: 'Der Mann kann als Subjekt des zweiten Satzteils verstanden werden: Er hat Gefallen an seinem Weg.'
  rationale: Das hebräische Verb nennt sein Subjekt nicht ausdrücklich. JHWH aus dem ersten Satzteil ist ein plausibler und zusammenhängender Bezug, doch auch ein Wechsel zum Mann ist grammatisch möglich. Die Hauptfassung bietet die wahrscheinlichere Lesart klar dar; die Fußnote bewahrt die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Psalmenstil. Die aktive Satzform vermeidet eine irreführende Pronomenzuordnung; die im Hebräischen mögliche alternative Subjektbestimmung bleibt in der Fußnote erhalten.
