id: PSA.37.17
reference: Psalms 37:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י זְרוֹע֣וֹת רְ֭שָׁעִים תִּשָּׁבַ֑רְנָה וְ/סוֹמֵ֖ךְ צַדִּיקִ֣ים יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/017.yaml
  text: For the arms of the wicked will be broken[a], but Yahweh upholds the righteous.
translation:
  language: de
  text: Denn die Arme der Frevler werden zerbrochen[a], doch Jahwe stützt die Gerechten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Arme“; das Bild bezeichnet wahrscheinlich die Stärke oder Macht der Frevler.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und bewahrt die kausal-erklärende Funktion.
- source_word: זְרוֹעוֹת
  choice: die Arme
  rationale: Bewahrt das konkrete poetische Bild; im Zusammenhang stehen die Arme sinnbildlich für Stärke oder Macht.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: Gibt das substantivierte Pluraladjektiv knapp und in einem würdigen, psalmengemäßen Register wieder.
- source_word: תִּשָּׁבַרְנָה
  choice: werden zerbrochen
  rationale: Entspricht unmittelbar dem passiven Nifal und stimmt im Deutschen mit dem pluralischen Subjekt überein.
- source_word: וְ
  choice: doch
  rationale: Bringt den im Parallelismus deutlich adversativen Gegensatz natürlich zum Ausdruck.
- source_word: סוֹמֵךְ
  choice: stützt
  rationale: Gibt das Partizip als fortdauerndes Tragen und Stützen wieder und bewahrt zugleich den körperlichen Bildbereich.
- source_word: צַדִּיקִים
  choice: die Gerechten
  rationale: Transparente und im Psalmenkontext geläufige Wiedergabe des substantivierten Pluraladjektivs.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Namen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Bildsprache der zerbrochenen Arme
  choice: konkretes Bild im Haupttext bewahren
  alternative: die Macht der Frevler wird gebrochen
  rationale: „Arme“ ist die direkte Bedeutung und lässt die poetische Metonymie offen; die mögliche Bedeutung „Stärke/Macht“ wird in der Fußnote erläutert, nicht in den Text hineingedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. „Frevler“ hält das moralische Gewicht von רְשָׁעִים fest; „stützt“ ist verständlich und bewahrt die Bildspannung zu den zerbrochenen Armen.
