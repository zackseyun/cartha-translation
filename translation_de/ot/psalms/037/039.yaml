  text: וּ/תְשׁוּעַ֣ת צַ֭דִּיקִים מֵ/יְהוָ֑ה מָֽ֝עוּזָּ֗/ם בְּ/עֵ֣ת צָרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/039.yaml
  text: The salvation of the righteous is from Yahweh[c][b][a]; he is their stronghold in a time of trouble.
translation:
  language: de
  text: Doch die Rettung der Gerechten kommt von Jahwe[a]; er ist ihre Zuflucht[b] zur Zeit der Not.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: Oder „Festung“ beziehungsweise „Schutzburg“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשׁוּעַת
  choice: die Rettung
  rationale: תְּשׁוּעָה bezeichnet Rettung, Befreiung oder auch Sieg. „Rettung“ ist im heutigen Deutsch natürlich und bewahrt sowohl den konkreten als auch den theologischen Sinn.
- source_word: צַדִּיקִים
  choice: der Gerechten
  rationale: Das substantivisch gebrauchte Adjektiv im Plural bezeichnet die als gerecht Gekennzeichneten; „die Gerechten“ gibt diesen Gruppenbezug idiomatisch wieder.
- source_word: מֵיְהוָה
  choice: kommt von Jahwe
  rationale: Die Präposition מִן bezeichnet die Herkunft beziehungsweise Quelle. Das im hebräischen Nominalsatz mitverstandene Prädikat wird für natürliches Deutsch mit „kommt“ ausgedrückt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben, sodass der direkte Gebrauch des Tetragramms erkennbar bleibt.
- source_word: מָעוּזָּם
  choice: ihre Zuflucht
  rationale: מָעוֹז bezeichnet einen Ort oder eine Quelle von Schutz und Stärke. „Zuflucht“ ist verständlich und würdevoll; die stärker befestigte Bildlichkeit von „Festung“ bleibt in der Fußnote sichtbar.
- source_word: בְּעֵת צָרָה
  choice: in der Zeit der Not
  rationale: Die Wendung bezeichnet die Zeit beziehungsweise Lage der Bedrängnis. „In der Zeit der Not“ ist natürliches, gehobenes Standarddeutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. Die Transliteration bewahrt den Charakter als Gottes Eigenname; die traditionelle deutsche Wiedergabe wird in der Fußnote genannt.
- issue: Subjekt des zweiten Nominalsatzes
  choice: er ist ihre Zuflucht
  alternative: ihre Zuflucht in der Zeit der Not
  rationale: Das Hebräische hat keinen ausgedrückten Kopulaverb-Satz und lässt das Subjekt aus dem ersten Satzteil erschließen. „Er ist“ stellt den natürlichen Bezug auf Jahwe her, ohne zusätzliche Aussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelstruktur und der Gottesbezug bleiben klar; erklärungsbedürftige lexikalische Alternativen werden knapp in Fußnoten bewahrt.
