id: PSA.37.8
reference: Psalms 37:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֶ֣רֶף מֵ֭/אַף וַ/עֲזֹ֣ב חֵמָ֑ה אַל תִּ֝תְחַ֗ר אַךְ לְ/הָרֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/008.yaml
  text: Let go of anger[a], and abandon wrath[b]; do not be provoked—it only leads to evil.
translation:
  language: de
  text: Lass ab vom Zorn und gib den Grimm auf; ereifere dich nicht[a] – es führt nur zum Bösen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „rege dich nicht auf“ beziehungsweise „entbrenne nicht im Zorn“. Das Verb bezeichnet ein inneres Erhitzen oder zorniges Erregtwerden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „nur um Böses zu tun“. Die hebräische Wendung kann Ziel oder Folge ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶרֶף מֵאַף
  choice: Lass ab vom Zorn
  rationale: רפה bezeichnet hier das Aufhören oder Ablassen; mit מִן ist „ablassen von“ eine natürliche und zugleich quellennah formulierte deutsche Wendung. אַף wird idiomatisch als „Zorn“ wiedergegeben.
- source_word: וַעֲזֹב חֵמָה
  choice: und gib den Grimm auf
  rationale: עזב bedeutet verlassen oder aufgeben. „Grimm“ gibt die heftige, glühende Wut von חֵמָה wieder und wahrt den poetischen Parallelismus, ohne אַף und חֵמָה völlig gleichzusetzen.
- source_word: אַל תִּתְחַר
  choice: ereifere dich nicht
  rationale: Die reflexive Form von חרה kann ein inneres Erhitzen, Sich-Erregen oder zorniges Ereifern bezeichnen. „Ereifere dich nicht“ ist im Deutschen verständlich, knapp und für den poetischen Mahnruf passend.
- source_word: אַךְ לְהָרֵעַ
  choice: es führt nur zum Bösen
  rationale: אַךְ wirkt einschränkend („nur“). Der Infinitiv mit לְ kann hier als Folge oder Ziel verstanden werden; die Hauptfassung gibt die im Zusammenhang naheliegende Folge idiomatisch wieder.
theological_decisions:
- issue: Sinn der Schlusswendung אַךְ לְהָרֵעַ
  choice: 'Warnung vor der Folge des zornigen Ereiferns: „es führt nur zum Bösen“'
  alternative: „nur um Böses zu tun“
  rationale: Die knappe hebräische Infinitivkonstruktion lässt sowohl eine resultative als auch eine stärker finale Wiedergabe zu. Die Hauptfassung liest sie im Kontext als Folgewarnung; die Fußnote bewahrt die wörtlichere Zweck- beziehungsweise Handlungslesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem poetischem Parallelismus. „Grimm“ hebt die stärkere Intensität von חֵמָה gegenüber „Zorn“ hervor; die Fußnoten erhalten die lexikalische und syntaktische Mehrdeutigkeit.
