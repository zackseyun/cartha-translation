  variant: modern standard German
source:
  edition: WLC
  text: בְּטַ֣ח בַּֽ֭/יהוָה וַ/עֲשֵׂה ט֑וֹב שְׁכָן אֶ֝֗רֶץ וּ/רְעֵ֥ה אֱמוּנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/003.yaml
  text: Trust in Yahweh and do good[a]; dwell in the land and cultivate faithfulness.
translation:
  language: de
  text: Vertraue auf Jahwe und tu Gutes; wohne im Land und nähre dich von Treue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „übe Treue“; möglicherweise auch: „lebe in Sicherheit“. Die hebräische Wendung ist schwierig und kann das Bild des Weidens oder der Nahrung durch Treue und Verlässlichkeit anklingen lassen.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטַח
  choice: Vertraue
  rationale: Der Imperativ von בטח fordert dazu auf, sein Vertrauen auf jemanden zu setzen; „Vertraue“ ist im Deutschen natürlich und prägnant.
- source_word: בַּיהוָה
  choice: auf Jahwe
  rationale: Die Präposition ב kennzeichnet hier das Ziel des Vertrauens. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וַעֲשֵׂה טוֹב
  choice: und tu Gutes
  rationale: Die knappe, idiomatische Form gibt den Imperativ mit dem substantivisch gebrauchten Adjektiv angemessen wieder.
- source_word: שְׁכָן אֶרֶץ
  choice: wohne im Land
  rationale: שׁכן bedeutet „wohnen/sich niederlassen“; אֶרֶץ bezeichnet im Zusammenhang des Psalms am ehesten das Land und nicht allgemein die Erde.
- source_word: וּרְעֵה
  choice: und nähre dich von
  rationale: רעה bezeichnet wörtlich das Weiden, Grasen oder Hüten. Die reflexive Formulierung bewahrt das Bild des Sich-Nährens und vermeidet, die schwierige Wendung vorschnell als ethisches „Treue üben“ festzulegen.
- source_word: אֱמוּנָה
  choice: Treue
  rationale: אֱמוּנָה kann Treue, Verlässlichkeit, Beständigkeit oder Sicherheit bedeuten. „Treue“ erhält die ethische und relationale Mehrdeutigkeit; weitere Möglichkeiten werden in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Transliteration „Jahwe“ macht den im Hebräischen stehenden Eigennamen sichtbar und entspricht der Projektvorgabe.
- issue: Deutung von וּרְעֵה אֱמוּנָה
  choice: nähre dich von Treue
  alternative: übe Treue; lebe in Sicherheit
  rationale: Die hebräische Wendung ist ungewöhnlich und mehrdeutig. Die Hauptfassung erhält das Weide- beziehungsweise Nahrungsbild von רעה, ohne אֱמוּנָה ausschließlich ethisch oder als zugesagte Sicherheit zu bestimmen; alternative Deutungen stehen in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappen Imperative des Hebräischen bleiben erhalten. „Tu“ folgt der aktuellen Standardschreibung; „Land“ bewahrt den im Psalm wiederkehrenden Bezug auf beständigen Wohn- und Lebensraum.
