  text: תּוֹרַ֣ת אֱלֹהָ֣י/ו בְּ/לִבּ֑/וֹ לֹ֖א תִמְעַ֣ד אֲשֻׁרָי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/031.yaml
  text: The law of his God is in his heart[a]; his steps do not slip.
translation:
  language: de
  text: Die Weisung seines Gottes ist in seinem Herzen[a]; seine Schritte gleiten nicht aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Gesetz seines Gottes ist in seinem Herzen; seine Schritte geraten nicht ins Wanken.“'
    reason: „Gesetz“ ist eine mögliche engere Wiedergabe von תּוֹרָה; „geraten nicht ins Wanken“ gibt eine weitere mögliche Nuance von מעד wieder.
lexical_decisions:
- source_word: תּוֹרַת
  choice: die Weisung
  rationale: תּוֹרָה bezeichnet hier die maßgebliche Unterweisung Gottes. „Weisung“ bewahrt im Deutschen sowohl den lehrenden als auch den verbindlichen Sinn, ohne den Begriff auf ein Gesetzbuch zu verengen.
- source_word: אֱלֹהָיו
  choice: seines Gottes
  rationale: 'Das Substantiv mit Suffix der 3. Person maskulin Singular bezeichnet die persönliche Zuordnung: „seines Gottes“.'
- source_word: בְּלִבּוֹ
  choice: trägt er im Herzen
  rationale: Die hebräische Wendung bezeichnet die Verinnerlichung der Weisung. „Im Herzen tragen“ ist natürliches Deutsch und erfasst das Herz als Zentrum von Denken, Wollen und Entscheiden.
- source_word: לֹא תִמְעַד
  choice: geraten nicht ins Wanken
  rationale: מעד kann ausgleiten, schwanken oder straucheln bedeuten. Bei „Schritten“ gibt „ins Wanken geraten“ die bildhafte Aussage idiomatisch wieder; das Präsens entspricht dem allgemeinen Aussagecharakter.
- source_word: אֲשֻׁרָיו
  choice: seine Schritte
  rationale: Das Nomen bezeichnet die Schritte beziehungsweise den Lebensweg eines Menschen; „seine Schritte“ erhält das konkrete Bild.
theological_decisions:
- issue: Bedeutung von תּוֹרָה im Weisheitskontext
  choice: Weisung
  alternative: Gesetz; Lehre
  rationale: Gemeint ist Gottes verbindliche, verinnerlichte Unterweisung. „Weisung“ wahrt die Autorität des Ausdrucks und zugleich seine über eine bloße Gesetzessammlung hinausgehende Bedeutungsbreite.
- issue: Zeitbezug von לֹא תִמְעַד
  choice: allgemeine Aussage im Präsens
  alternative: 'Zukunft: „werden nicht ins Wanken geraten“'
  rationale: Der Kontext beschreibt kennzeichnend den Gerechten. Das hebräische Imperfekt lässt auch eine zukünftige Nuance zu; der gnomische Präsenssinn passt hier jedoch am besten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist bildhaft und gut verständlich; die Fußnote dokumentiert die enger am Wortlaut liegenden Alternativen.
