  source_fidelity: Die Wiedergabe von תּוֹרַת אֱלֹהָיו als „Die Weisung seines Gottes“ trifft die Bedeutung im Weisheitskontext gut. Das Hebräische prädiziert jedoch schlicht, dass die Weisung „in seinem Herzen ist“; „trägt er im Herzen“ ist zwar verständlich, fügt aber ein nicht ausdrücklich vorhandenes Verb und eine leicht andere Akzentsetzung hinzu. Für לֹא תִמְעַד אֲשֻׁרָיו ist „seine Schritte gleiten nicht aus“ eine nähere und zugleich idiomatische Wiedergabe des Bildes.
  naturalness: „Die Weisung seines Gottes ist in seinem Herzen“ ist modernes, würdiges und gut verständliches Standarddeutsch. „Seine Schritte gleiten nicht aus“ ist im Deutschen natürlich und bewahrt die konkrete Gehmetapher. Die bisherige Formulierung „seine Schritte geraten nicht ins Wanken“ ist möglich, aber etwas weniger direkt.
  terminology: „Weisung“ gibt תּוֹרָה angemessen als verbindliche göttliche Unterweisung wieder, ohne es auf ein Gesetzbuch einzuengen. „Gesetz“ bleibt eine sinnvolle, in der Fußnote dokumentierte Alternative. „Herz“ wahrt die biblische Bildsprache und ist hier ohne zusätzliche Erklärung verständlich.
  issues:
