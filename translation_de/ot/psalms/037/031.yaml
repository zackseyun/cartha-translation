    issue: Die Hauptzeile ergänzt mit „trägt er“ ein Verb, das im Hebräischen nicht steht.
    rationale: Die nominale hebräische Aussage lässt sich im Deutschen natürlich und genauer mit „ist in seinem Herzen“ wiedergeben.
  - severity: low
    issue: „Ins Wanken geraten“ ist für מעד weniger nah als ein Ausdruck des Ausgleitens.
    rationale: מעד bezeichnet hier das Straucheln bzw. Ausgleiten der Schritte. „Gleiten nicht aus“ erhält das Bild präzise und idiomatisch.
