source:
  edition: WLC
  text: ס֣וּר מֵ֭/רָע וַ/עֲשֵׂה ט֗וֹב וּ/שְׁכֹ֥ן לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/027.yaml
  text: Turn away from evil and do good[a], and dwell forever.
translation:
  language: de
  text: Weiche vom Bösen ab und tu Gutes, und wohne für immer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Zusammenhang mit dem wiederkehrenden Thema des Psalms auch: „und wohne für immer im Land“ oder „und lebe für immer in Sicherheit“. „Im Land“ steht hier im Hebräischen nicht ausdrücklich.'
    reason: alternative_reading
lexical_decisions:
- source_word: סוּר
  choice: Weiche … ab
  rationale: Der Imperativ bezeichnet das Sichabwenden oder Entfernen. „Weiche vom Bösen ab“ ist im Deutschen natürlich, würdevoll und bewahrt den willentlichen, ethischen Sinn.
- source_word: מֵרָע
  choice: vom Bösen
  rationale: Die Präposition מִן bezeichnet, wovon man sich abwendet. Im ethischen Zusammenhang ist „das Böse“ sachgemäßer als „Unheil“.
- source_word: וַעֲשֵׂה טוֹב
  choice: und tu Gutes
  rationale: Die knappe Verbindung aus Imperativ und substantivisch gebrauchtem Adjektiv wird ebenso knapp wiedergegeben und wahrt den Parallelismus zu „vom Bösen“.
- source_word: וּשְׁכֹן
  choice: und wohne
  rationale: Das Verb bedeutet wohnen, sich niederlassen oder ansässig sein. „Wohne“ erhält das Bild eines beständigen Aufenthalts, ohne ein im Hebräischen nicht ausdrücklich genanntes Objekt hinzuzufügen.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte oder dauerhafte Fortdauer. „Für immer“ ist eine natürliche moderne Wiedergabe und lässt die knappe Formulierung des Hebräischen bestehen.
theological_decisions:
- issue: Sinn von וּשְׁכֹן לְעוֹלָם
  choice: „und wohne für immer“ als direkte Imperativfolge ohne ergänztes Ortsobjekt
  alternative: „und wohne für immer im Land“ oder „und lebe für immer in Sicherheit“
  rationale: Der hebräische Text setzt die Imperative fort und nennt an dieser Stelle weder „Land“ noch „Sicherheit“ ausdrücklich. Der Zusammenhang von Psalm 37 kann ein dauerhaftes Wohnen im Land oder in Sicherheit nahelegen; diese Deutung wird deshalb in der Fußnote genannt, aber nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Imperativfolge. Die ungewöhnlich offene Aussage „wohne für immer“ bleibt erhalten; die kontextuell möglichen Ergänzungen stehen in der Fußnote.
