  text: לְ/דָוִ֨ד אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בְּ/עֹשֵׂ֥י עַוְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/001.yaml
  text: Of David[a]. Do not be provoked by evildoers[b]; do not envy those who do wrong.
translation:
  language: de
  text: 'Von David.[a]


    Ärgere dich nicht über Übeltäter; beneide nicht die, die Unrecht tun.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Für David“. Die hebräische Präposition lässt die genaue Beziehung des Psalms zu David offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Ungerechtigkeit üben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Präposition לְ kann in Psalmüberschriften Urheberschaft, Zugehörigkeit oder Widmung anzeigen. „Von David“ ist im Deutschen eine natürliche, traditionelle Wiedergabe, ohne die mögliche Beziehung genauer festzulegen.
- source_word: אַל
  choice: nicht
  rationale: אַל mit der Verbform drückt ein Verbot aus; im Deutschen wird dies natürlich mit dem verneinten Imperativ wiedergegeben.
- source_word: תִּתְחַר
  choice: Entrüste dich
  rationale: Das Hitpael von חרה bezeichnet ein inneres Erhitzen, Aufgebrachtsein oder Sichärgern. „Entrüste dich“ bewahrt die emotionale Stärke und klingt in gehobenem modernem Deutsch natürlich.
- source_word: בַּמְּרֵעִים
  choice: über die Bösen
  rationale: בְּ bezeichnet hier den Anlass oder Gegenstand der Erregung. מְרֵעִים meint Menschen, die Böses tun; „die Bösen“ ist knapp und idiomatisch.
- source_word: תְּקַנֵּא
  choice: beneide
  rationale: קנא kann Eifersucht oder Neid bezeichnen. Im Zusammenhang mit den scheinbar erfolgreichen Übeltätern ist „beneiden“ die passendste Wiedergabe.
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: die, die Unrecht tun
  rationale: Die Partizipialfügung bezeichnet Menschen, die עַוְלָה ausüben. „Unrecht tun“ gibt den aktiven Sinn klar und gegenwärtig wieder und lässt sowohl moralisches Unrecht als auch Ungerechtigkeit anklingen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der beiden Verbote bleibt erhalten; die Formulierungen sind knapp und für die öffentliche Lesung geeignet.
