  source_fidelity: Die beiden Verbote und ihre parallele Struktur sind zutreffend wiedergegeben. „Von David“ ist als traditionelle, nicht völlig festlegende Wiedergabe der Überschrift mit der Anmerkung vertretbar. „Entrüste dich“ legt jedoch im heutigen Deutsch besonders moralische Empörung nahe, während sich das Hitpael von חרה hier auf ein inneres Erhitzen bzw. Sichärgern angesichts der Übeltäter bezieht.
  naturalness: Der Text ist klar, knapp und für öffentliche Lesung geeignet. „Ärgere dich nicht“ ist modernes Standarddeutsch und gibt die beabsichtigte innere Erregung idiomatischer wieder als „Entrüste dich nicht“.
  terminology: „Übeltäter“ gibt den partizipialen Charakter von מְרֵעִים präziser wieder als die stärker zustandsbeschreibende Bezeichnung „die Bösen“. „Unrecht tun“ und „beneiden“ sind treffend. Die Anmerkungen sind an den jeweiligen deutschen Textstellen sinnvoll verankert.
