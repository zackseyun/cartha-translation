  text: יוֹדֵ֣עַ יְ֭הוָה יְמֵ֣י תְמִימִ֑ם וְ֝/נַחֲלָתָ֗/ם לְ/עוֹלָ֥ם תִּהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/018.yaml
  text: Yahweh knows the days of the blameless[b][a], and their inheritance will be forever.
translation:
  language: de
  text: Jahwe kennt die Tage der Untadeligen[a], und ihr Erbteil wird für immer bestehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Aufrichtigen“ oder „der Menschen von ungeteilter Integrität“. Gemeint ist Integrität, nicht notwendigerweise völlige Sündlosigkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und ihr Erbteil wird für immer sein“. Die Wendung kann dauerhaften Besitz oder bleibenden Bestand bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יוֹדֵעַ
  choice: kennt
  rationale: Das Partizip bezeichnet ein fortdauerndes, aufmerksames Kennen; „kennt“ bleibt nah am Wortlaut, ohne die mögliche fürsorgliche Bedeutung auszuformulieren.
- source_word: יְמֵי
  choice: die Tage derer
  rationale: Die hebräische Wendung „die Tage von“ wird bewahrt; sie bezeichnet hier den Lebenslauf bzw. die Lebenszeit.
- source_word: תְמִימִם
  choice: die untadelig leben
  rationale: Die Form bezeichnet Menschen von ungeteilter Integrität. Die verbale deutsche Wendung klingt natürlich und behauptet keine absolute Sündlosigkeit.
- source_word: נַחֲלָתָם
  choice: ihr Erbteil
  rationale: „Erbteil“ bewahrt sowohl den Gedanken eines zugewiesenen Besitzes als auch den bundesgeschichtlichen Klang des Ausdrucks.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die geläufige moderne Wendung gibt die unbegrenzte Dauer natürlich wieder.
- source_word: תִּהְיֶה
  choice: wird … bestehen
  rationale: Wörtlich steht „wird sein“. Mit einem Erbteil als Subjekt drückt „bestehen“ im Deutschen idiomatisch dessen Fortdauer aus, ohne diese näher zu bestimmen.
theological_decisions:
- issue: Bedeutung von תְמִימִם im Weisheitskontext
  choice: Menschen, die in Integrität und untadelig leben
  alternative: vollkommen sündlose Menschen; die Aufrichtigen; die Ungeteilten
  rationale: Der Psalm stellt Gerechte und Frevler als Weisheitskategorien gegenüber. Die Übersetzung bezeichnet charakterliche Integrität, ohne absolute Sündlosigkeit zu behaupten.
- issue: Tragweite von Gottes Kennen
  choice: „kennt“ als offener Ausdruck aufmerksamen, persönlichen Kennens
  alternative: „achtet auf“; „wacht über“; „heißt gut“
  rationale: Der Kontext kann fürsorgliche Zuwendung nahelegen, doch das einfache „kennt“ vermeidet eine theologische Ausdeutung über den hebräischen Wortlaut hinaus.
- issue: Dauer und Art des Erbteils
  choice: Das Erbteil wird für immer bestehen
  alternative: Sie werden es für immer besitzen; ihr Erbe ist ewig
  rationale: Der Vers nennt die Dauer, lässt aber offen, ob vor allem dauerhafter Besitz, Bestand oder eine umfassendere Verheißung gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt dem hebräischen Parallelismus nahe. „Jahwe“ bewahrt den Eigennamen; „Erbteil“ erhält den konkreten und theologischen Resonanzraum. Die Fußnoten markieren echte lexikalische und semantische Offenheit.
