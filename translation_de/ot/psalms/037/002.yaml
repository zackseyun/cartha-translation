  text: For they will quickly wither like grass[a], and fade like green herbage.
translation:
  language: de
  text: Denn wie Gras verdorren sie schnell[a], und wie frisches Grün verwelken sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn schnell werden sie wie Gras abgeschnitten …“ Das erste hebräische Verb kann neben „verdorren“ auch „abgeschnitten werden“ bedeuten; das zweite beschreibt das Verwelken von Pflanzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Mahnung ein und gibt den erklärenden Zusammenhang natürlich wieder.
- source_word: כֶחָצִיר
  choice: wie Gras
  rationale: חָצִיר bezeichnet hier Gras beziehungsweise krautigen Bewuchs; „Gras“ ist im Deutschen die klare und natürliche Bildentsprechung.
- source_word: מְהֵרָה
  choice: schnell
  rationale: Bewahrt die Betonung darauf, wie rasch die beschriebenen Menschen vergehen.
- source_word: יִמָּלוּ
  choice: verdorren
  rationale: Im Pflanzenbild bezeichnet das Verb wahrscheinlich das Abwelken oder Verdorren; die mögliche Bedeutung „abgeschnitten werden“ bleibt in der Fußnote erhalten.
- source_word: וּכְיֶרֶק דֶּשֶׁא
  choice: und wie frisches Grün
  rationale: Die Verbindung bezeichnet grünen, jungen Pflanzenwuchs. „Frisches Grün“ vermeidet eine schwerfällige Wiederholung von „Gras“ und bewahrt das Bild lebendiger, doch vergänglicher Vegetation.
- source_word: יִבּוֹלוּן
  choice: verwelken sie
  rationale: Gibt das Nachlassen und Vergehen pflanzlicher Lebenskraft wieder und bildet einen natürlichen poetischen Parallelismus zu „verdorren“.
