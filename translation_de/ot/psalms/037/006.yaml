  text: He will bring forth your righteousness like the light[b][a], and your justice like the noonday.
translation:
  language: de
  text: Er wird deine Gerechtigkeit[a] hervortreten lassen wie das Licht und dein Recht[b] wie den hellen Mittag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Unschuld“ beziehungsweise „dass du im Recht bist“.'
