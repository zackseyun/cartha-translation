  - marker: b
    text: 'Oder: „deine Rechtssache“ beziehungsweise „dein gerechtes Anliegen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Er wird … hervortreten lassen
  rationale: Die Hifil-Form von יצא bezeichnet ein Veranlassen des Hervortretens. Die Formulierung bewahrt den kausativen Sinn und klingt im modernen Deutschen natürlich.
- source_word: כָאוֹר
  choice: wie das Licht
  rationale: כְּ kennzeichnet den Vergleich, אוֹר bedeutet „Licht“. Die Übersetzung erhält das Bild des sichtbaren Hervortretens.
- source_word: צִדְקֶךָ
  choice: deine Gerechtigkeit
  rationale: צֶדֶק kann Gerechtigkeit, Rechtschaffenheit oder die öffentliche Erweisung des Rechts bezeichnen. „Gerechtigkeit“ wahrt die lexikalische Breite; die kontextuelle Nuance der Rehabilitierung wird in einer Fußnote genannt.
- source_word: וּמִשְׁפָּטֶךָ
  choice: und dein Recht
  rationale: מִשְׁפָּט kann Urteil, Recht, Gerechtigkeit oder Rechtssache bedeuten. Im Parallelismus geht es wahrscheinlich darum, dass das berechtigte Anliegen eines Menschen öffentlich sichtbar wird. „Dein Recht“ bewahrt sowohl die rechtliche als auch die persönliche Dimension.
- source_word: כַצָּהֳרָיִם
  choice: wie das Licht am Mittag
  rationale: צָהֳרַיִם bezeichnet Mittag beziehungsweise Mittagszeit. Die idiomatische deutsche Wendung macht die im hebräischen Vergleich vorausgesetzte volle Helligkeit deutlich, ohne die Aussage auf die Sonne selbst festzulegen.
theological_decisions:
- issue: Bedeutung von צִדְקֶךָ und מִשְׁפָּטֶךָ im Parallelismus
  choice: „deine Gerechtigkeit“ und „dein Recht“
  alternative: „deine Unschuld“ und „deine Rechtssache“
  rationale: Der Vers kann sowohl den gerechten Charakter als auch dessen öffentliche Bestätigung meinen. Der Haupttext hält diese Spannung offen; die Fußnoten nennen die stärker forensischen Lesarten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelstruktur. Die Wiederholung von „Licht“ macht den zweiten, im Hebräischen verkürzten Vergleich im Deutschen verständlich; die rechtliche Bildwelt bleibt bewusst mehrdeutig.
