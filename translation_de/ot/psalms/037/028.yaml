id: PSA.37.28
reference: Psalms 37:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י יְהוָ֨ה אֹ֘הֵ֤ב מִשְׁפָּ֗ט וְ/לֹא יַעֲזֹ֣ב אֶת חֲ֭סִידָי/ו לְ/עוֹלָ֣ם נִשְׁמָ֑רוּ וְ/זֶ֖רַע רְשָׁעִ֣ים נִכְרָֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/028.yaml
  text: For Yahweh loves justice and does not forsake his faithful ones[a]; they are kept forever[b], but the offspring of the wicked will be cut off.
translation:
  language: de
  text: Denn Jahwe liebt das Recht und verlässt seine Getreuen[a] nicht; sie bleiben für immer bewahrt[b]. Doch die Nachkommen der Gottlosen werden ausgerottet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Frommen“, „seine Heiligen“ oder „die ihm Treuen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wortfolge kann auch enger verstanden werden: „Seine Getreuen bleiben für immer bewahrt.“'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den persönlichen Gottesnamen als im Deutschen etablierte Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֹהֵב
  choice: liebt
  rationale: Die schlichte und unmittelbare Entsprechung bewahrt die personale Aussage des hebräischen Partizips.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: Bezeichnet hier gerechtes Urteil und die sittlich rechte Ordnung; „das Recht“ ist prägnant und idiomatisch.
- source_word: יַעֲזֹב
  choice: verlässt … nicht
  rationale: Gibt עזב natürlich wieder und wahrt den Beziehungs- und Treuegedanken des Zusammenhangs.
- source_word: חֲסִידָיו
  choice: seine Getreuen
  rationale: Bezeichnet Menschen, die durch חסד-bezogene Treue und Frömmigkeit gekennzeichnet sind; „Getreue“ wahrt den relationalen Sinn ohne kirchlichen Fachbegriff.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Gibt die unbegrenzte beziehungsweise dauerhafte Zeitangabe in natürlichem Gegenwartsdeutsch wieder.
- source_word: נִשְׁמָרוּ
  choice: sie bleiben … bewahrt
  rationale: Das Nifal von שמר bezeichnet hier das Bewahrtwerden; „bleiben bewahrt“ verbindet die passive Aussage idiomatisch mit der Dauerangabe.
- source_word: זֶרַע
  choice: Nachkommen
  rationale: זֶרַע meint hier nicht wörtlichen Samen, sondern die Nachkommenschaft der Gottlosen.
- source_word: רְשָׁעִים
  choice: der Gottlosen
  rationale: Die substantivierte Bezeichnung steht im Weisheitspsalm für Menschen, die dem rechten Weg entgegenstehen.
- source_word: נִכְרָת
  choice: werden ausgerottet
  rationale: Gibt das Nifal von כרת als scharfes gerichtliches „abgeschnitten/ausgerottet werden“ wieder, ohne die Aussage abzuschwächen.
theological_decisions:
- issue: Bedeutungsumfang von חֲסִידָיו
  choice: „seine Getreuen“ als Bezeichnung der Jahwe in loyaler Frömmigkeit Zugehörigen
  alternative: „seine Frommen“, „seine Heiligen“ oder „die ihm Treuen“
  rationale: Die Wiedergabe hält Treue, Frömmigkeit und Bundesbeziehung zusammen, ohne „Heilige“ als späteren technischen Begriff einzutragen.
- issue: Verhältnis der beiden mittleren Aussagen
  choice: 'Zwei eng verbundene Aussagen: Jahwe verlässt seine Getreuen nicht; sie bleiben für immer bewahrt.'
  alternative: 'Als enger zusammengehörige Aussage: „Seine Getreuen bleiben für immer bewahrt.“'
  rationale: Die hebräische Abfolge lässt die zweite Aussage als Entfaltung der ersten verstehen. Das Semikolon erhält sowohl ihre Eigenständigkeit als auch ihren engen Zusammenhang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am poetischen Parallelismus; „Jahwe“ bewahrt den Gottesnamen, und die gerichtliche Schärfe von „ausgerottet“ wird nicht geglättet.
