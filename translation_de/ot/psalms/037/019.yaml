source:
  edition: WLC
  text: לֹֽא יֵ֭בֹשׁוּ בְּ/עֵ֣ת רָעָ֑ה וּ/בִ/ימֵ֖י רְעָב֣וֹן יִשְׂבָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/019.yaml
  text: They will not be put to shame in a time of trouble[c][b][a], and in days of famine they will be satisfied.
translation:
  language: de
  text: In schwerer Zeit werden sie nicht zuschanden[a], und in Tagen der Hungersnot werden sie satt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden sie nicht beschämt“ bzw. „werden sie nicht enttäuscht“. Das hebräische Verb kann sowohl erlittene Schande als auch das Scheitern einer Hoffnung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: werden sie nicht zuschanden
  rationale: Das Verb בושׁ bezeichnet hier das Erleiden von Schande oder das Scheitern einer Hoffnung. „Nicht zuschanden werden“ bewahrt den resultativen Sinn und passt zur würdevollen Sprache des Psalms.
- source_word: בְּעֵת רָעָה
  choice: in schwerer Zeit
  rationale: עֵת bedeutet „Zeit“, während רָעָה hier Not und widrige Umstände, nicht moralisches Böses, bezeichnet. „In schwerer Zeit“ ist natürlich, verständlich und inhaltlich hinreichend offen.
- source_word: וּבִימֵי רְעָבוֹן
  choice: und in Tagen der Hungersnot
  rationale: Die Konstruktion bezeichnet Zeiten ausgeprägten Nahrungsmangels. „Hungersnot“ gibt רְעָבוֹן im Kontext präzise wieder.
- source_word: יִשְׂבָּעוּ
  choice: werden sie satt
  rationale: שׂבע bedeutet, gesättigt zu sein oder genug zu haben. „Satt werden“ wahrt in diesem Kontext den konkreten Bezug zur Versorgung während einer Hungersnot.
theological_decisions:
- issue: Art der in der Verheißung zugesagten Bewahrung
  choice: Die Aussage bleibt eine poetische Zusicherung, dass die Gerechten in Not nicht endgültig scheitern und in der Hungersnot versorgt werden.
  alternative: Eine ausnahmslose Zusage völliger Leidensfreiheit oder materiellen Wohlstands.
  rationale: Der hebräische Vers verheißt Bewahrung und Sättigung mitten in widrigen Zeiten, sagt aber nicht, dass die Betroffenen keine Not erfahren. Die Übersetzung sollte diese Spannung nicht auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zuschanden werden“ ist leicht gehoben, aber im Psalmkontext verständlich und bewahrt die Bedeutungsbreite des Hebräischen. Die knappe Parallelstruktur des Ausgangstextes bleibt erhalten.
