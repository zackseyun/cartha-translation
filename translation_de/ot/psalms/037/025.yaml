review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt die hebräische Lebensrückschau treffend wieder: Jugend und erreichtes Alter, die persönliche Negativbeobachtung sowie die beiden koordinierten Gegenstände – ein verlassener Gerechter und seine um Brot bittenden Nachkommen – bleiben erhalten. „Oder“ steht im Deutschen idiomatisch im Skopus von „nie sah ich“ und drückt sinnvoll „weder … noch …“ aus, ohne die hebräische Koordination inhaltlich zu verändern.'
  naturalness: „Ich war jung und bin auch alt geworden, doch nie sah ich …“ ist verständliches modernes Standarddeutsch mit angemessen würdig-poetischem Psalmton. Die vorangestellte Stellung von „nie“ betont die lebenslange Erfahrung. „Um Brot bitten“ ist natürlich und konkreter als ein bloßes „Brot suchen“, ohne zwingend das stärkere „betteln“ zu behaupten.
  terminology: „Gerechter“ entspricht dem substantivierten generischen Singular צַדִּיק. „Nachkommen“ gibt זַרְעוֹ breit und idiomatisch wieder und bewahrt den Bezug auf die Nachkommenschaft. „Verlassen“ bewahrt die passive Aussage von נֶעֱזָב. Die Fußnote erläutert die lexikalische Spannweite von מְבַקֶּשׁ angemessen.
