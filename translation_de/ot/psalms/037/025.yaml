source:
  edition: WLC
  text: נַ֤עַר הָיִ֗יתִי גַּם זָ֫קַ֥נְתִּי וְֽ/לֹא רָ֭אִיתִי צַדִּ֣יק נֶעֱזָ֑ב וְ֝/זַרְע֗/וֹ מְבַקֶּשׁ לָֽחֶם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/025.yaml
  text: I was young[a], and now I am old[b], yet I have not seen the righteous forsaken or his offspring begging for bread.
translation:
  language: de
  text: Ich war jung und bin auch alt geworden, doch nie sah ich einen Gerechten verlassen oder seine Nachkommen um Brot bitten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Nachkommen Brot suchen“. Das hebräische Verb bedeutet wörtlich „suchen“ oder „erbitten“ und kann hier das Bitten um die nötigste Nahrung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר הָיִיתִי גַּם זָקַנְתִּי
  choice: Ich war jung und bin auch alt geworden
  rationale: Die Formulierung bewahrt den autobiografischen Gegensatz zwischen Jugend und erreichtem Alter. גַּם wird mit „auch“ wiedergegeben, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „nun“ einzufügen.
- source_word: וְלֹא רָאִיתִי
  choice: doch nie sah ich
  rationale: „Doch“ gibt den leicht gegensätzlichen Anschluss wieder; „nie sah ich“ bezeichnet die über das ganze bisherige Leben reichende Erfahrung des Sprechers in natürlichem, würdigem Deutsch.
- source_word: צַדִּיק נֶעֱזָב
  choice: einen Gerechten verlassen
  rationale: צַדִּיק ist ein substantiviertes Adjektiv im generischen Singular. „Verlassen“ bewahrt das Gewicht des passiven נֶעֱזָב, ohne die Aussage über den Wortlaut hinaus zu verstärken.
- source_word: וְזַרְעוֹ
  choice: oder seine Nachkommen
  rationale: 'זֶרַע bedeutet hier nicht wörtlich Saatgut, sondern Nachkommenschaft. „Nachkommen“ lässt offen, ob Kinder oder spätere Generationen gemeint sind. Das koordinierende ו wird im Deutschen sinngemäß als „oder“ gefasst: Der Sprecher hat weder das eine noch das andere gesehen.'
- source_word: מְבַקֶּשׁ לָחֶם
  choice: um Brot bitten
  rationale: בקש bedeutet grundsätzlich „suchen, erbitten“. In Verbindung mit Brot kann es bedürftiges Bitten bezeichnen. „Um Brot bitten“ bewahrt mehr von der lexikalischen Offenheit als das stärker festlegende „betteln“.
theological_decisions:
- issue: Persönliche Beobachtung oder ausnahmslose Verheißung
  choice: 'Die Aussage bleibt als persönliche Lebenserfahrung formuliert: „nie sah ich“.'
  alternative: Eine allgemeine Garantie, dass kein Gerechter und keine seiner Nachkommen jemals Not leiden.
  rationale: Der hebräische Text spricht ausdrücklich in der ersten Person von dem, was der Sprecher von seiner Jugend bis ins Alter beobachtet hat. Die Übersetzung macht daraus keine weitergehende absolute Zusage.
- issue: Referenz und Geschlecht bei צַדִּיק und זַרְעוֹ
  choice: „einen Gerechten … seine Nachkommen“
  alternative: „gerechte Menschen … ihre Kinder“
  rationale: Der grammatisch maskuline Singular und der dazugehörige Suffixbezug bleiben erkennbar, während „Nachkommen“ den Umfang von זֶרַע angemessen wiedergibt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Ton. Die Satzstellung „doch nie sah ich“ hebt die lebenslange Beobachtung hervor, ohne die Aussage zu einer absoluten theologischen Garantie umzudeuten.
