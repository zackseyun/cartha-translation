  text: The wicked plots against the righteous and gnashes his teeth at him[a][b].
translation:
  language: de
  text: Der Gottlose schmiedet Pläne gegen den Gerechten[a] und knirscht mit den Zähnen gegen ihn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „plant Böses gegen den Gerechten“ oder „heckt etwas gegen den Gerechten aus“.'
