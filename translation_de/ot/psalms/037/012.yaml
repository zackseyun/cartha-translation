lexical_decisions:
- source_word: זֹמֵם
  choice: schmiedet Pläne
  rationale: Das Partizip bezeichnet ein feindseliges Planen oder Aushecken. „Pläne schmieden“ ist im Deutschen natürlich und bewahrt den böswilligen Sinn.
- source_word: רָשָׁע
  choice: der Gottlose
  rationale: Das substantivierte Adjektiv bezeichnet hier einen einzelnen gottlosen beziehungsweise schuldigen Menschen und steht im Gegensatz zum Gerechten.
- source_word: לַצַּדִּיק
  choice: gegen den Gerechten
  rationale: Die Präposition kennzeichnet das Ziel der feindseligen Planung; „gegen“ gibt dies klar wieder.
- source_word: חֹרֵק
  choice: knirscht
  rationale: Das Verb bezeichnet das Knirschen beziehungsweise Aufeinanderreiben der Zähne als Ausdruck von Zorn und Feindseligkeit.
- source_word: עָלָיו
  choice: über ihn
  rationale: Die hebräische Präposition wird bewahrt; zusammen mit „mit den Zähnen knirschen“ bezeichnet sie die feindselige Ausrichtung gegen die betreffende Person.
- source_word: שִׁנָּיו
  choice: mit den Zähnen
  rationale: Der hebräische Ausdruck lautet wörtlich „seine Zähne“; im natürlichen deutschen Idiom steht „mit den Zähnen knirschen“, wobei das Subjekt den Besitz eindeutig macht.
