  variant: modern standard German
source:
  edition: WLC
  text: צַדִּיקִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ/יִשְׁכְּנ֖וּ לָ/עַ֣ד עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/029.yaml
  text: The righteous will inherit the land and dwell on it forever[a].
translation:
  language: de
  text: Die Gerechten werden das Land erben und für immer darauf wohnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Erde«. Das hebräische Wort אֶרֶץ kann sowohl »Land« als auch »Erde« bedeuten; hier passt »Land« zur wiederkehrenden Ausdrucksweise in Psalm 37.'
    reason: alternative_reading
lexical_decisions:
- source_word: צַדִּיקִים
  choice: die Gerechten
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet gerechte Menschen als Gruppe. »Die Gerechten« ist im modernen Deutschen natürlich und bewahrt den moralisch-theologischen Gehalt.
- source_word: יִירְשׁוּ
  choice: werden erben
  rationale: ירשׁ kann erben oder in Besitz nehmen bedeuten. »Erben« erhält hier den Verheißungscharakter und den Anklang an die Landverheißung, der Psalm 37 durchzieht.
- source_word: אָרֶץ
  choice: das Land
  rationale: אֶרֶץ kann »Land« oder »Erde« bedeuten. Die wiederholte Rede vom Erben des Landes in Psalm 37 spricht im Haupttext für »das Land«; die mögliche weitere Bedeutung wird in einer Fußnote bewahrt.
- source_word: וְיִשְׁכְּנוּ
  choice: und … wohnen
  rationale: שׁכן bezeichnet beständiges Wohnen, Sich-Niederlassen oder Verweilen. »Wohnen« ist gegenwärtiges, klares Deutsch und bringt die dauerhafte Ansiedlung zum Ausdruck.
- source_word: לָעַד
  choice: für immer
  rationale: Der Ausdruck bezeichnet unbegrenzte beziehungsweise fortdauernde Dauer. »Für immer« ist klar und natürlich.
- source_word: עָלֶיהָ
  choice: darauf
  rationale: Die Präposition על mit femininem Singularsuffix verweist auf אָרֶץ zurück. »Darauf« gibt diesen Bezug knapp und direkt wieder.
theological_decisions:
- issue: Bedeutungsumfang von אָרֶץ in der Verheißung
  choice: das Land
  alternative: die Erde
  rationale: Der unmittelbare Zusammenhang von Psalm 37 verwendet wiederholt die Verheißung, das Land zu erben, und stützt daher »das Land« im Haupttext. Da אֶרֶץ auch »Erde« bedeuten kann und die Aussage entsprechend weiter verstanden werden kann, bleibt diese Möglichkeit in der Fußnote ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist schlicht und gut verständlich; »erben« und »wohnen« bewahren zugleich den Verheißungscharakter und das Bild dauerhafter Beheimatung.
