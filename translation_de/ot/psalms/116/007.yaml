  text: שׁוּבִ֣י נַ֭פְשִׁ/י לִ/מְנוּחָ֑יְ/כִי כִּֽי יְ֝הוָ֗ה גָּמַ֥ל עָלָֽיְ/כִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/007.yaml
  text: Return[a], my soul, to your rest, for Yahweh has dealt bountifully with you.
translation:
  language: de
  text: Kehre zurück, meine Seele, zu deiner Ruhe, denn Jahwe hat dir Gutes erwiesen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat dich reich beschenkt“ beziehungsweise „hat großzügig an dir gehandelt“. Das hebräische Verb kann bedeuten, an jemandem zu handeln oder ihm zu vergelten; hier ist der Sinn aufgrund des Zusammenhangs positiv.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבִי
  choice: Kehre zurück
  rationale: Der feminine Singular des Qal-Imperativs richtet sich an die als feminin aufgefasste נֶפֶשׁ. „Kehre zurück“ bewahrt die Vorstellung der Rückkehr zu einer zuvor gekannten Ruhe.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ kann „Seele“, „Selbst“ oder „Leben“ bezeichnen. In dieser poetischen Selbstanrede gibt „meine Seele“ die innere, persönliche Ansprache natürlich und traditionsnah wieder.
- source_word: לִמְנוּחָיְכִי
  choice: zu deiner Ruhe
  rationale: Die Präposition לְ bezeichnet hier das Ziel der Rückkehr; מְנוּחָה kann Ruhe oder einen Ruheort meinen. „Zu deiner Ruhe“ wahrt die knappe poetische Form und die mögliche abstrakte Bedeutung.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt die Begründung der Aufforderung ein. „Denn“ verbindet beide Satzteile in einem gehobenen, aber gegenwärtigen poetischen Register.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen geläufige Umschrift.
- source_word: גָּמַל עָלָיְכִי
  choice: hat dir Gutes erwiesen
  rationale: גמל mit עַל bezeichnet, wie jemand an einer Person handelt oder ihr vergilt. Der Dankkontext bestimmt den Sinn eindeutig positiv; „hat dir Gutes erwiesen“ bleibt dem Handlungssinn nahe und klingt im Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Umschrift „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Positive Bedeutung von גָּמַל
  choice: hat dir Gutes erwiesen
  alternative: hat dir vergolten
  rationale: Das Verb kann je nach Zusammenhang positives oder negatives Handeln beziehungsweise Vergelten bezeichnen. Der Dank- und Rettungskontext verlangt hier eine positive Wiedergabe, ohne eine besondere Art der Wohltat festzulegen.
translation_notes:
  register: Natürliche, würdevolle Psalmensprache in modernem Standarddeutsch. Die direkte Selbstanrede und die knappe Begründungsstruktur des Hebräischen bleiben erhalten; altertümliche Formen werden vermieden.
