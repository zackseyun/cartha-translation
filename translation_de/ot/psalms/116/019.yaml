  text: in the courts of the house of Yahweh[a], in your midst, Jerusalem[b]. Praise Yah!
translation:
  language: de
  text: in den Vorhöfen des Hauses Jahwes[a], in deiner Mitte, Jerusalem. Lobt Jah![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „des Hauses des HERRN“.'
