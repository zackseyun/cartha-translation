lexical_decisions:
- source_word: בְּחַצְרוֹת
  choice: in den Vorhöfen
  rationale: Der Plural von חָצֵר bezeichnet hier die umschlossenen Hofbereiche des Tempels. „Vorhöfe“ ist im Deutschen die geläufige und präzise Bezeichnung für diese Tempelbereiche.
- source_word: בֵּית יְהוָה
  choice: des Hauses Jahwes
  rationale: Die Wiedergabe bewahrt das hebräische Bild „Haus Jahwes“, das im Kontext den Tempel bezeichnet, ohne die Metapher durch „Tempel“ zu ersetzen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen etablierten Form „Jahwe“ wiedergegeben, statt ihn durch den Titel „HERR“ zu ersetzen.
- source_word: בְּתוֹכֵכִי
  choice: mitten in dir
  rationale: Die Form ist feminin Singular und spricht Jerusalem unmittelbar als Stadtperson an. „Mitten in dir“ erhält sowohl die räumliche Aussage als auch diese direkte Anrede.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Der Ortsname wird nach der üblichen deutschen Form wiedergegeben.
- source_word: הַלְלוּ יָהּ
  choice: Lobt Jah!
  rationale: Der Imperativ im Plural und die Kurzform des Gottesnamens werden transparent wiedergegeben. Zugleich bleibt erkennbar, dass dies der hebräische Ausdruck hinter „Halleluja“ ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen, während „der HERR“ die traditionelle Ersatzlesung darstellt.
- issue: Wiedergabe von יָהּ im Schlussruf
  choice: Jah
  alternative: Halleluja!
  rationale: „Jah“ bewahrt die Kurzform des Gottesnamens und gibt zusammen mit „Lobt“ die Bestandteile des hebräischen Rufes wieder. „Halleluja“ wäre die eingebürgerte Transliteration des gesamten Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Tempelsprache bleibt bildhaft und quellenah; die direkte Anrede Jerusalems wird bewahrt. Der Vers beginnt entsprechend seinem syntaktischen Anschluss an den vorhergehenden Vers kleingeschrieben.
