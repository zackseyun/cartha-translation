  text: מָֽה אָשִׁ֥יב לַ/יהוָ֑ה כָּֽל תַּגְמוּל֥וֹ/הִי עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/012.yaml
  text: What shall I return to Yahweh for all his benefits to me?[a]
translation:
  language: de
  text: Was soll ich Jahwe zurückgeben für all das Gute, das er mir erwiesen hat?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was soll ich Jahwe vergelten für alles, was er an mir getan hat?“ Das hebräische Wort kann sowohl Wohltaten als auch Handlungen oder Vergeltungen bezeichnen; der Zusammenhang ist von Dank geprägt.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: מָה
  choice: Was
  rationale: Das Fragepronomen wird direkt und natürlich mit „Was“ wiedergegeben.
- source_word: אָשִׁיב
  choice: soll ich zurückgeben
  rationale: Der Hifil von שוב bedeutet hier wörtlich „zurückbringen/zurückgeben“ und bezeichnet die Antwort des Beters auf Gottes Güte, ohne bereits den stärkeren Gedanken vollständiger Rückzahlung einzutragen.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל bezeichnet den Empfänger; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: כָּל
  choice: all
  rationale: Der Quantor betont die Gesamtheit der folgenden Wohltaten; im Deutschen steht er idiomatisch in „all das Gute“.
- source_word: תַּגְמוּלֹהִי
  choice: das Gute, das er mir erwiesen hat
  rationale: Das Wort kann Wohltaten, Vergeltungen oder allgemein erwiesene Handlungen bezeichnen. Im Dankkontext gibt die Formulierung den positiven Sinn natürlich wieder, ohne die lexikalische Spannweite zu verschweigen.
- source_word: עָלַי
  choice: mir
  rationale: על bezeichnet hier die auf den Beter gerichteten Handlungen; mit „erwiesen“ ist „mir“ idiomatisches modernes Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den Tetragrammaton; „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Charakter der göttlichen Handlungen
  choice: das Gute, das er mir erwiesen hat
  alternative: all seine Vergeltungen an mir / all seine Wohltaten an mir
  rationale: Der Dankkontext legt positive Wohltaten nahe. Da גמול jedoch auch allgemeines Handeln oder Vergeltung bezeichnen kann, wird diese Bedeutungsbreite in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zurückgeben“ bewahrt das konkrete Bild des hebräischen Verbs; „das Gute, das er mir erwiesen hat“ klingt natürlicher als das nominale „seine Wohltaten“, während die Fußnote die Mehrdeutigkeit offenhält.
