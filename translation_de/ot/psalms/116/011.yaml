  text: I said in my alarm[b][a], “Every man is a liar.”
translation:
  language: de
  text: 'Ich sagte in meiner Bestürzung[a]: »Jeder Mensch ist ein Lügner.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in meiner Hast« oder »in meiner Panik«. Das hebräische Wort kann hastige Erregung, Bestürzung oder panische Angst bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Alle Menschen sind unzuverlässig.« Wörtlich steht im Hebräischen »jeder Mensch«; אָדָם wird hier allgemein und kollektiv gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Ich
  rationale: Das ausdrücklich gesetzte Personalpronomen wird beibehalten, da es im Hebräischen den Sprecher hervorhebt.
- source_word: אָמַרְתִּי
  choice: sagte
  rationale: Die gewöhnliche Bedeutung von אמר passt zum rückblickenden, persönlichen Ton des Verses, ohne die Aussage feierlicher zu machen als der Ausgangstext.
- source_word: בְחָפְזִי
  choice: in meiner Bestürzung
  rationale: Die Wendung bezeichnet hier am ehesten einen Zustand hastiger, erschrockener Erregung. »Bestürzung« gibt die emotionale Kraft natürlich wieder; »in meiner Hast« bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: כָּל הָאָדָם
  choice: Jeder Mensch
  rationale: כָּל mit dem kollektiv gebrauchten Singular אָדָם bezeichnet ausnahmslos jeden Menschen beziehungsweise die gesamte Menschheit. »Jeder Mensch« bewahrt Form und universalen Umfang in natürlichem Deutsch.
- source_word: כֹּזֵב
  choice: ist ein Lügner
  rationale: Das Partizip bezeichnet einen Menschen, der lügt beziehungsweise sich als unzuverlässig oder falsch erweist. »Ist ein Lügner« erhält die starke prädikative Aussage des Hebräischen.
theological_decisions:
- issue: Umfang der Aussage über den Menschen
  choice: »Jeder Mensch ist ein Lügner« als uneingeschränkte, in der Bestürzung geäußerte Aussage wiedergeben
  alternative: »Die ganze Menschheit ist unzuverlässig«
  rationale: Der Vers verbindet eine universale Formulierung mit der ausdrücklich genannten inneren Lage des Sprechers. Die Übersetzung bewahrt beides und entscheidet nicht, ob die Aussage als situationsbedingter Ausruf oder als allgemeines Urteil zu verstehen ist.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. »Bestürzung« ist allgemein verständlich und bildet sowohl Erschrecken als auch innere Erregung ab. Die direkte, sprichwortartige Schärfe des zweiten Satzes bleibt erhalten.
