  text: אָֽנָּ֣ה יְהוָה֮ כִּֽי אֲנִ֪י עַ֫בְדֶּ֥/ךָ אֲֽנִי עַ֭בְדְּ/ךָ בֶּן אֲמָתֶ֑/ךָ פִּ֝תַּ֗חְתָּ לְ/מוֹסֵרָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/016.yaml
  text: Please[a], Yahweh, for I am your servant; I am your servant, the son of your maidservant[c][b]. You have loosed my bonds.
translation:
  language: de
  text: Bitte[a], Jahwe, denn ich bin dein Diener[b]; ich bin dein Diener, der Sohn deiner Dienerin[c]. Du hast meine Fesseln gelöst[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ach, Jahwe“; das Hebräische enthält einen eindringlichen, hier jedoch ohne ausdrückliches Verb stehenden Bittruf.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Knecht“ beziehungsweise „Sklave“; das hebräische Wort kann rechtlich gebundene Abhängigkeit bezeichnen, drückt hier aber zugleich die hingebungsvolle Zugehörigkeit zu Jahwe aus.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Sohn deiner Dienerin“; traditionell auch: „Sohn deiner Magd“. Die Wendung kann eine von Geburt an bestehende Dienstzugehörigkeit hervorheben.'
    reason: lexical_alternative
  - marker: d
    text: 'Sinngemäß: „Du hast mich befreit“; wörtlich bleibt das Bild vom Lösen der Fesseln stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנָּה
  choice: Ach
  rationale: Die eindringliche Bitte- und Ausrufpartikel wird mit „Ach“ wiedergegeben. So bleibt der flehentliche Ton erhalten, ohne ein im Hebräischen nicht ausgesprochenes Verb zu ergänzen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי
  choice: doch
  rationale: כִּי kann hier die nachdrückliche Begründung beziehungsweise Bekräftigung der Aussage einleiten. Das deutsche „doch“ gibt diesen Zusammenhang natürlich wieder; ein ausdrückliches „denn“ wäre nach dem elliptischen Anruf syntaktisch schwerfällig.
- source_word: עַבְדֶּךָ / עַבְדְּךָ
  choice: dein Diener
  rationale: עֶבֶד bezeichnet einen Menschen, der einem Herrn gehört und dient. „Diener“ passt zur Erklärung hingebungsvoller Zugehörigkeit zu Gott, während die stärkere Bedeutung „Sklave“ als Alternative vermerkt wird.
- source_word: בֶּן אֲמָתֶךָ
  choice: der Sohn deiner Dienerin
  rationale: Die wörtliche, geschlechtsspezifische Formulierung bleibt erhalten und drückt aus, dass der Beter schon von Geburt an zum Haus seiner Herrin gehört.
- source_word: פִּתַּחְתָּ לְמוֹסֵרָי
  choice: Du hast meine Fesseln gelöst
  rationale: Das Verb bedeutet grundsätzlich „öffnen“, bezeichnet zusammen mit „Fesseln“ jedoch deren Lösung. Die Bildsprache des hebräischen Textes bleibt dadurch gewahrt.
theological_decisions:
- issue: Bezeichnung des Beters gegenüber Gott
  choice: Diener
  alternative: Sklave; Knecht
  rationale: „Diener“ vermittelt in modernem Deutsch sowohl Unterordnung als auch hingebungsvolle Zugehörigkeit, ohne die soziale Bedeutung des hebräischen Ausdrucks vorschnell auf eine einzige Rechtsstellung festzulegen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Da im Ausgangstext der Eigenname steht, wird er als „Jahwe“ wiedergegeben; damit bleibt die persönliche Anrede sichtbar.
- issue: Sinn von בֶּן אֲמָתֶךָ
  choice: Sohn deiner Dienerin
  alternative: Sohn deiner Magd
  rationale: Die Aussage kann ererbte beziehungsweise von Geburt an bestehende Zugehörigkeit betonen. Die Übersetzung bewahrt diese Aussage, ohne darüber hinaus eine bestimmte Biografie des Beters festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Selbstbezeichnung als „dein Diener“ wird entsprechend der hebräischen Wiederholung beibehalten. Der elliptische Bittruf am Versanfang wird nicht durch ein erschlossenes Verb vervollständigt; „doch“ gibt die bekräftigende beziehungsweise begründende Kraft von כִּי idiomatisch wieder.
