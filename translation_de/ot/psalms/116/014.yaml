  text: נְ֭דָרַ/י לַ/יהוָ֣ה אֲשַׁלֵּ֑ם נֶגְדָ/ה נָּ֝֗א לְ/כָל עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/014.yaml
  text: I will fulfill my vows to Yahweh in the presence of all his people[a][b].
translation:
  language: de
  text: Jahwe will ich meine Gelübde erfüllen[a], ja[b], vor seinem ganzen Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „meine Gelübde bezahlen“. Das hebräische Verb kann das vollständige Leisten dessen bezeichnen, was man gelobt hat.'
    reason: lexical_alternative
  - marker: b
    text: Die Partikel kann hier auch mit „nun“ oder „fürwahr“ wiedergegeben werden; wahrscheinlich bekräftigt sie die öffentliche Erfüllung der Gelübde.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדָרַי
  choice: meine Gelübde
  rationale: Der Plural נְדָרַי bezeichnet die vom Sprecher abgelegten Gelübde; die Wiedergabe bleibt allgemein und legt keine bestimmte Opferform fest.
- source_word: לַיהוָה
  choice: gegenüber Jahwe
  rationale: Die Präposition ל bezeichnet hier denjenigen, dem die Erfüllung der Gelübde geschuldet ist. „Gegenüber“ verbindet sich im Deutschen natürlich mit „Gelübde erfüllen“ und bewahrt den Gottesnamen als „Jahwe“.
- source_word: אֲשַׁלֵּם
  choice: werde ich erfüllen
  rationale: Das Piel von שׁלם bedeutet bei Gelübden, das Versprochene vollständig zu leisten. „Erfüllen“ gibt diese Bedeutung im heutigen Deutsch idiomatisch wieder.
- source_word: נֶגְדָה
  choice: vor
  rationale: Das Wort bezeichnet hier die Gegenwart beziehungsweise den öffentlichen Anblick anderer; „vor seinem ganzen Volk“ ist knapp und natürlich.
- source_word: נָּא
  choice: ja
  rationale: Die Partikel wirkt hier wahrscheinlich bekräftigend, nicht als höfliche Bitte. „Ja“ hält diese emphatische Funktion im Haupttext sichtbar.
- source_word: לְכָל עַמּוֹ
  choice: vor seinem ganzen Volk
  rationale: Zusammen mit נֶגְדָה bezeichnet die Wendung die versammelte Öffentlichkeit, in deren Gegenwart die Gelübde erfüllt werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Art der Gelübdeerfüllung
  choice: allgemein als „Gelübde erfüllen“
  alternative: Gelübdeopfer darbringen
  rationale: Der Vers sagt nicht ausdrücklich, dass jedes Gelübde durch ein Opfer erfüllt wird; daher wird keine bestimmte kultische Handlung ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung setzt „meine Gelübde“ leicht hervor; „ja“ bewahrt die im Hebräischen erkennbare Bekräftigung, während die Fußnote ihre Mehrdeutigkeit offenhält.
