  terminology: „Jahwe“ gibt יהוה konsequent als Eigennamen wieder. „Gelübde erfüllen“ ist die angemessene allgemeine Wiedergabe und ergänzt keine Opferhandlung. Die Fußnoten sind sachlich und die Marker bleiben korrekt am jeweils erläuterten Ausdruck verankert.
