base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/004.yaml
  text: 'Then I called on the name of the LORD: “Please, LORD, rescue my life!”'
translation:
  language: de
  text: 'Da rief ich den Namen des HERRN an: »Ach, HERR, rette mein Leben[a]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: meine Seele; gemeint sein kann auch: mich selbst.'
    reason: Bewahrt den Bedeutungsumfang des hebräischen נֶפֶשׁ, ohne den Haupttext unnatürlich zu machen.
lexical_decisions:
- source_word: וּבְשֵׁם יְהוָה אֶקְרָא
  choice: Da rief ich den Namen des HERRN an
  rationale: Die deutsche Wendung „den Namen … anrufen“ gibt die hebräische Konstruktion mit בְּשֵׁם idiomatisch und zugleich formnah wieder. Das Imperfekt wird im erzählenden Zusammenhang als Vergangenheit verstanden.
- source_word: אָנָּה
  choice: Ach
  rationale: Die eindringliche Bitte wird mit der würdevollen, natürlichen deutschen Anrufung „Ach“ wiedergegeben.
- source_word: מַלְּטָה
  choice: rette
  rationale: Der Imperativ bezeichnet die Bitte um Befreiung beziehungsweise Rettung aus Todesgefahr.
- source_word: נַפְשִׁי
  choice: mein Leben[a]
  rationale: נֶפֶשׁ meint hier im Kontext die bedrohte Person beziehungsweise ihr Leben; „mein Leben“ ist im Deutschen natürlicher als „meine Seele“, während die Fußnote die wörtlichere Form offenhält.
- source_word: יהוה
  choice: HERR
  rationale: Das Tetragramm wird nach verbreiteter deutscher Bibeltradition durch HERR in Kapitälchen wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang von נֶפֶשׁ
  choice: mein Leben
  alternative: meine Seele / mich
  rationale: Der Kontext handelt von Rettung aus Todesnot. „Mein Leben“ vermeidet eine unnötige Verengung auf einen vom Körper getrennten Seelenteil; die mögliche wörtlichere Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Bitte bleibt knapp und eindringlich; „HERR“ kennzeichnet den Gottesnamen יהוה gemäß deutscher Bibeltradition.
