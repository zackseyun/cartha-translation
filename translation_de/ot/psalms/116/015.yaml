source:
  edition: WLC
  text: יָ֭קָר בְּ/עֵינֵ֣י יְהוָ֑ה הַ֝/מָּ֗וְתָ/ה לַ/חֲסִידָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/015.yaml
  text: Precious in the eyes of Yahweh is the death of his faithful ones[a][b].
translation:
  language: de
  text: Kostbar ist in den Augen Jahwes der Tod seiner Getreuen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Teuer ist in den Augen Jahwes der Tod seiner Getreuen.“'
    reason: lexical_alternative
  - marker: b
    text: „Getreue“ kann auch mit „Heilige“, „Gottesfürchtige“ oder „die ihm treu ergeben sind“ wiedergegeben werden. Das hebräische Wort bezeichnet Menschen, die Gott in loyaler Treue verbunden sind.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקָר
  choice: kostbar
  rationale: Das Adjektiv bezeichnet etwas Kostbares, Wertvolles oder Kostspieliges. „Kostbar“ bewahrt die positive Wertungsdimension, ohne die ebenfalls mögliche Bedeutung „kostspielig“ auszuschließen.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die wörtliche Wiedergabe der hebräischen Perspektivformel ist im Deutschen verständlich und bewahrt das Bild.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַמָּוְתָה
  choice: der Tod
  rationale: Die Wiedergabe entspricht dem bestimmten hebräischen Substantiv; die Endung verändert hier den Sinn nicht wesentlich.
- source_word: לַחֲסִידָיו
  choice: seiner Getreuen
  rationale: חָסִיד bezeichnet Menschen, die durch Treue, Frömmigkeit und loyale Verbundenheit mit Gott gekennzeichnet sind. „Getreue“ ist knapp, würdig und vermeidet mögliche spätere Sonderbedeutungen von „Heilige“.
theological_decisions:
- issue: Aussage über den Tod der Gottgetreuen
  choice: Der Tod seiner Getreuen ist in Jahwes Augen kostbar und von hohem Gewicht.
  alternative: Der Tod seiner Getreuen kommt Jahwe teuer zu stehen.
  rationale: יָקָר kann sowohl „kostbar“ als auch „kostspielig“ bedeuten. Der Haupttext bewahrt die traditionelle Wertungsdimension; die Fußnote hält die bedeutsame Alternative offen. Die Formulierung sagt nicht, dass Gott am Tod Gefallen hat.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markierte hebräische Wortstellung stellt „kostbar“ heraus; die Bildrede „in den Augen“ bleibt erhalten. Die mögliche Spannung zwischen „kostbar“ und „teuer/kostspielig“ wird nicht eingeebnet.
