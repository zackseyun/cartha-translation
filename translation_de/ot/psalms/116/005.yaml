  yaml_path: translation/ot/psalms/116/005.yaml
  text: Gracious is Yahweh[a], and righteous[b]; our God is compassionate.
translation:
  language: de
  text: Gnädig ist Jahwe und gerecht[a]; unser Gott ist barmherzig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „recht“ beziehungsweise „rechtschaffen“.'
