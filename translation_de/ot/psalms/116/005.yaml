    text: 'Oder: „hat Erbarmen“ beziehungsweise „zeigt Erbarmen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַנּוּן
  choice: gnädig
  rationale: Das prädikative Adjektiv bezeichnet Gottes von Gnade und Zuwendung geprägte Haltung. „Gnädig“ bewahrt diese theologische Bedeutung und bleibt zugleich natürlich verständlich.
- source_word: יְהֹוָה
  choice: Jahwe
  rationale: Der im Hebräischen unmittelbar stehende Gottesname wird als „Jahwe“ wiedergegeben, sodass sein Charakter als Eigenname erhalten bleibt.
- source_word: צַדִּיק
  choice: gerecht
  rationale: Das Adjektiv bezeichnet sowohl moralische Rechtschaffenheit als auch gerechtes Handeln. „Gerecht“ deckt dieses Bedeutungsspektrum im Deutschen am besten ab.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Die Possessivendung der ersten Person Plural wird ausdrücklich bewahrt und gibt das gemeinschaftliche Bekenntnis des hebräischen Textes wieder.
- source_word: מְרַחֵם
  choice: ist barmherzig
  rationale: Das Partizip von רחם beschreibt eine anhaltende, charakteristische Haltung des Erbarmens. Die deutsche Prädikatsform ist idiomatisch und wahrt diesen durativen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext den Tetragrammaton als Gottes persönlichen Bundesnamen verwendet, bewahrt „Jahwe“ den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Gottes Wesen und Handeln in מְרַחֵם
  choice: ist barmherzig
  alternative: erbarmt sich
  rationale: Die gewählte Form beschreibt Gottes bleibende Wesenshaltung; die verbale Alternative hebt stärker sein konkretes Handeln hervor. Das hebräische Partizip lässt beide Nuancen zu.
translation_notes:
  register: Natürliche, gehobene Standardsprache mit knapper poetischer Satzführung. Die vorangestellte Prädikatsform „Gnädig ist Jahwe“ bildet die hebräische Hervorhebung nach, ohne im Deutschen altertümlich zu wirken.
