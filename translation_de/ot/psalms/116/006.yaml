  text: Yahweh preserves the simple[a]; I was brought low[c][b], and he saved me.
translation:
  language: de
  text: Jahwe behütet die Unerfahrenen[a]. Ich war geschwächt[b], und er rettete mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die Arglosen“ oder „die Einfältigen“. Gemeint sind Menschen, denen es an Erfahrung oder Umsicht fehlt, nicht unbedingt moralisch törichte Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Ich war tief erniedrigt“ oder „Ich war kraftlos“. Das hebräische Wort kann ausdrücken, dass jemand geschwächt, herabgebracht oder gering geworden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵר
  choice: behütet
  rationale: Das Partizip von שׁמר bezeichnet fortdauerndes Bewahren oder Beschützen. „Behütet“ ist im Deutschen natürlich und gibt den persönlichen Schutz im Zusammenhang des Psalms wieder.
- source_word: פְּתָאיִם
  choice: die Unerfahrenen
  rationale: Das Wort bezeichnet schlichte, arglose oder unerfahrene Menschen, nicht notwendig moralisch törichte. „Die Unerfahrenen“ ist verständlich und vermeidet die mögliche Fehlbedeutung von „die Einfältigen“.
- source_word: יְהֹוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: דַּלּוֹתִי
  choice: ich war geschwächt
  rationale: Die Form von דלל kann ein Erniedrigt-, Geschwächt- oder Herabgebrachtsein ausdrücken. „Ich war geschwächt“ bewahrt den resultativen Zustand, ohne ihn auf Armut zu verengen.
- source_word: וְלִי
  choice: und … mich
  rationale: Die Wendung bezeichnet hier das Handeln zugunsten des Sprechers. Im Deutschen wird dieser Bezug natürlich durch das Objekt „mich“ bei „rettete“ ausgedrückt.
- source_word: יְהוֹשִׁיעַ
  choice: er rettete mich
  rationale: Der Hifil von ישׁע bedeutet retten oder befreien. „Er rettete mich“ gibt die persönliche Rettung direkt und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird sichtbar als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Charakterisierung der פְּתָאיִם
  choice: die Unerfahrenen
  alternative: die Einfältigen / Arglosen
  rationale: Die Übersetzung vermeidet, den bezeichneten Menschen moralische Torheit zuzuschreiben, die das hebräische Wort hier nicht zwingend ausdrückt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Behütet“ wahrt den poetischen Ton; „Unerfahrenen“ bleibt allgemein verständlich und vermeidet die heute oft abwertende Wirkung von „Einfältigen“.
