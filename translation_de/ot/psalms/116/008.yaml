  source_fidelity: 'Die Übersetzung gibt die begründende Konjunktion כִּי angemessen mit „Denn“ wieder und bewahrt die dreiteilige Rettungsaussage: נַפְשִׁי „meine Seele“ vom Tod, die Augen von Tränen und der einzelne Fuß vom Straucheln. „Entrissen“ ist für das Piel von חלץ als kraftvoll-poetische Rettung aus Gefahr vertretbar. Die Ellipse in den beiden Folgegliedern entspricht der hebräischen Satzstruktur.'
