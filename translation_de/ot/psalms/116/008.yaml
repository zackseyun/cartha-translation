id: PSA.116.8
reference: Psalms 116:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י חִלַּ֥צְתָּ נַפְשִׁ֗/י מִ֫/מָּ֥וֶת אֶת עֵינִ֥/י מִן דִּמְעָ֑ה אֶת רַגְלִ֥/י מִ/דֶּֽחִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/008.yaml
  text: For you have delivered my soul from death[a], my eyes from tears[b], my feet from stumbling.
translation:
  language: de
  text: Denn du hast meine Seele[a] dem Tod entrissen, meine Augen den Tränen, meinen Fuß dem Straucheln.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Leben“. Das hebräische Wort kann die Seele, das Leben oder die ganze Person bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meinen Fuß dem Sturz“. Das hebräische Wort kann ein Straucheln oder einen Sturz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt hier den Grund für den umgebenden Lob- und Bekenntniszusammenhang an; „denn“ gibt diese erklärende Funktion im Deutschen natürlich wieder.
- source_word: חִלַּצְתָּ
  choice: du hast … entrissen
  rationale: Das Piel von חלץ bezeichnet das Herausreißen beziehungsweise Retten aus Gefahr. „Entrissen“ ist kräftig, poetisch und lässt sich durch Ellipse auf alle drei Glieder beziehen.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ kann Seele, Leben oder die ganze Person bezeichnen. „Meine Seele“ bewahrt die Weite des hebräischen Ausdrucks und vermeidet eine vorschnelle Beschränkung auf das körperliche Leben.
- source_word: מִמָּוֶת
  choice: dem Tod
  rationale: Der hebräische Ausdruck bedeutet wörtlich „vom Tod“. In Verbindung mit „entrissen“ gibt der deutsche Dativ dieselbe Trennung idiomatisch wieder.
- source_word: אֶת עֵינַי מִן דִּמְעָה
  choice: meine Augen den Tränen
  rationale: Die knappe Ellipse des Hebräischen bleibt erhalten; das Verb „entrissen“ ist aus dem ersten Glied mitzudenken. Der hebräische Singular „Träne“ wird im Deutschen natürlich als kollektiver Plural wiedergegeben.
- source_word: אֶת רַגְלִי מִדֶּחִי
  choice: meinen Fuß dem Straucheln
  rationale: Der Singular „Fuß“ entspricht der hebräischen Form. דֶּחִי kann Straucheln, Sturz oder Niederstoßen bezeichnen; „Straucheln“ wahrt das Bild eines drohenden Zusammenbruchs, ohne es unnötig festzulegen.
theological_decisions:
- issue: Anthropologische Bedeutung von נַפְשִׁי
  choice: meine Seele
  alternative: mein Leben; mich
  rationale: Der poetische Zusammenhang erlaubt sowohl die konkrete Rettung des Lebens als auch eine umfassendere Aussage über die Person. „Seele“ bewahrt diese Spannung; die Fußnote nennt die naheliegende Alternative.
translation_notes:
  register: Moderne, gehobene und zugleich verständliche Psalmsprache. Die dreigliedrige, elliptische Parallelstruktur des Hebräischen bleibt erhalten; „entrissen“ wird in den beiden folgenden Gliedern nicht wiederholt.
