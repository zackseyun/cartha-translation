  text: הֶ֭אֱמַנְתִּי כִּ֣י אֲדַבֵּ֑ר אֲ֝נִ֗י עָנִ֥יתִי מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/010.yaml
  text: 'I believed[b][a], therefore I spoke: “I am greatly afflicted.”'
translation:
  language: de
  text: 'Ich glaubte, darum sprach ich: »Ich bin schwer bedrängt.«[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »denn/weil ich rede«; die hebräische Partikel כִּי kann unterschiedlich verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Ich glaubte, auch als ich sagte: ›Ich war schwer bedrängt.‹« Der hebräische Satz ist knapp und lässt verschiedene syntaktische Gliederungen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: Ich glaubte
  rationale: Das Hifil von אמן bezeichnet hier Glauben beziehungsweise Vertrauen. »Ich glaubte« gibt die Form direkt und im Deutschen idiomatisch wieder, ohne den möglichen Vertrauensaspekt auszuschließen.
- source_word: כִּי
  choice: darum
  rationale: Die Partikel כִּי ist mehrdeutig. »Darum« stellt den Glauben als Anlass des Sprechens dar und ergibt eine natürliche poetische Aussage; kausale oder anders gegliederte Lesarten werden in den Fußnoten bewahrt.
- source_word: אֲדַבֵּר
  choice: sprach ich
  rationale: Obwohl die hebräische Form ein Imperfekt ist, kann sie im poetischen Zusammenhang vergangenes oder allgemeines Handeln ausdrücken. Das Präteritum fügt sich in den Rückblick des Psalms ein und bewahrt die knappe Form.
- source_word: אֲנִי
  choice: ich
  rationale: Das selbstständige Pronomen hebt den Sprecher hervor. Im Deutschen wird es in der direkten Rede ausdrücklich wiedergegeben.
- source_word: עָנִיתִי
  choice: bin bedrängt
  rationale: Die Form von ענה bezeichnet Bedrängnis, Leiden oder Erniedrigung. »Bedrängt« ist verständlich und wahrt den Leidensaspekt; das Präsens gibt die Aussage als Inhalt der damaligen Rede natürlich wieder.
- source_word: מְאֹד
  choice: schwer
  rationale: Das Intensitätsadverb מְאֹד wird hier idiomatisch mit »schwer« wiedergegeben, wie in der geläufigen deutschen Verbindung »schwer bedrängt«.
theological_decisions:
- issue: Syntaktisches Verhältnis von Glauben und Reden
  choice: Der Glaube führt zum Reden; der folgende Satz wird als Inhalt der Rede verstanden.
  alternative: '»Ich glaubte, auch als ich sagte: Ich bin schwer bedrängt« beziehungsweise »Ich glaubte, denn ich rede …«'
  rationale: Der hebräische Satz ist stark verdichtet, und כִּי sowie die Abfolge der Verbformen lassen mehrere Deutungen zu. Die Hauptfassung bietet einen klaren natürlichen Zusammenhang, während die echten Alternativen in den Fußnoten offengehalten werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. »Schwer bedrängt« ist allgemein verständlich und weniger fachsprachlich als »schwer heimgesucht«; die Mehrdeutigkeit des Hebräischen bleibt durch zwei markierte Fußnoten sichtbar.
