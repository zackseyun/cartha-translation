id: PSA.116.1
reference: Psalms 116:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָ֭הַבְתִּי כִּֽי יִשְׁמַ֥ע יְהוָ֑ה אֶת ק֝וֹלִ֗/י תַּחֲנוּנָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/001.yaml
  text: I love that the LORD hears my voice, my pleas for mercy.
translation:
  language: de
  text: Ich liebe es,[a] dass der HERR[b] meine Stimme hört, meine Bitten um Erbarmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich liebe den HERRN, denn er hört …“; im Hebräischen ist das Objekt von „lieben“ nicht ausdrücklich genannt.'
    reason: Die hebräische Satzfügung lässt sowohl eine Inhaltssatz-Lesart als auch die Ergänzung eines aus dem Zusammenhang erschlossenen Objekts zu.
  - marker: b
    text: Im Hebräischen steht hier der Gottesname JHWH.
    reason: Die typografische Wiedergabe „HERR“ soll den im Ausgangstext verwendeten Gottesnamen nicht verdecken.
lexical_decisions:
- source_word: אָהַבְתִּי כִּי
  choice: Ich liebe es, dass
  rationale: Die Verbindung lässt sich wörtlich als „Ich liebe, dass/weil“ wiedergeben. Die gewählte Fassung ist im heutigen Deutsch natürlich und folgt der im Hebräischen möglichen Lesart, ohne ein ausdrücklich genanntes Objekt zu ergänzen.
- source_word: יִשְׁמַע
  choice: hört
  rationale: Das hebräische Imperfekt bezeichnet hier passend die fortdauernde bzw. charakteristische Erfahrung des Betenden; das Präsens bewahrt diese Aussage.
- source_word: ק֝וֹלִ֗י תַּחֲנוּנָי
  choice: meine Stimme … meine Bitten um Erbarmen
  rationale: „Stimme“ wird formal bewahrt; תַּחֲנוּנִים bezeichnet inständige Bitten um Gunst oder Erbarmen und steht hier im Plural mit Suffix.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die Kapitälchen-Konvention gibt den Gottesnamen JHWH erkennbar wieder und entspricht verbreitetem deutschsprachigem Bibelgebrauch.
theological_decisions:
- issue: Ungenanntes Objekt von „lieben“
  choice: „Ich liebe es, dass …“ ohne Ergänzung eines persönlichen Objekts
  alternative: „Ich liebe den HERRN, denn …“
  rationale: Im hebräischen Text steht nach „Ich liebe“ kein ausdrückliches Objekt. Die alternative traditionelle Lesart ist kontextuell gut möglich, ergänzt aber „den HERRN“. Die gewählte Hauptfassung bewahrt die syntaktische Offenheit; die Fußnote nennt die andere plausible Deutung.
- issue: Wiedergabe des Gottesnamens
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: „HERR“ wahrt die etablierte Lesetradition, während die Fußnote transparent macht, dass im Ausgangstext der Eigenname JHWH steht.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die Wiederholung von „meine“ macht die appositionale Folge im Deutschen verständlich und bewahrt den poetischen Nachdruck.
