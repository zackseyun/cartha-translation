lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die Aussage des vorhergehenden Verses. „Denn“ gibt diesen rückbezüglichen Begründungszusammenhang im Deutschen natürlich wieder.
- source_word: הִטָּה אָזְנוֹ לִי
  choice: er hat mir sein Ohr zugeneigt
  rationale: Die bildhafte hebräische Wendung bezeichnet aufmerksames Hinhören. Die deutsche Formulierung bewahrt das Bild und bleibt verständlich.
- source_word: וּבְיָמַי
  choice: und … mein Leben lang
  rationale: Wörtlich steht „und in meinen Tagen“. Gemeint ist die Dauer der eigenen Lebenszeit; „mein Leben lang“ gibt diesen Sinn in natürlichem modernem Deutsch wieder, während „und“ die einfache Verknüpfung des hebräischen Textes wahrt.
- source_word: אֶקְרָא
  choice: werde ich ihn anrufen
  rationale: קרא kann „rufen“ oder im Gebetszusammenhang „anrufen“ bedeuten. Das im Hebräischen unausgesprochene Objekt wird aus dem Zusammenhang aufgenommen, damit der Gebetssinn im Deutschen klar und idiomatisch ist.
