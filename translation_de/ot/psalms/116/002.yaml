  source_fidelity: Der Entwurf gibt כִּי zutreffend kausal mit „Denn“ wieder. „Er hat mir sein Ohr zugeneigt“ bewahrt die hebräische Bildsprache von הִטָּה אָזְנוֹ לִי und ist semantisch genau. „Ich werde ihn mein Leben lang anrufen“ gibt das imperfektische אֶקְרָא sowie die lebenslange Perspektive von וּבְיָמַי angemessen wieder; das im Deutschen ergänzte Objekt „ihn“ ist durch den unmittelbaren Kontext gedeckt.
