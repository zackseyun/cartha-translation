id: PSA.116.17
reference: Psalms 116:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְֽ/ךָ אֶ֭זְבַּח זֶ֣בַח תּוֹדָ֑ה וּ/בְ/שֵׁ֖ם יְהוָ֣ה אֶקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/017.yaml
  text: To you I will offer a sacrifice of thanksgiving[a], and I will call on the name of Yahweh.
translation:
  language: de
  text: Dir will ich ein Dankopfer darbringen und den Namen Jahwes[a] anrufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben. Eine weitere deutsche Namensform ist „Jehova“.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ
  choice: Dir
  rationale: Die Präposition ל mit dem Suffix der 2. Person Singular bezeichnet Gott als Empfänger des Opfers; im Deutschen ist der vorangestellte Dativ in direkter Anrede natürlich und prägnant.
- source_word: אֶזְבַּח זֶבַח תּוֹדָה
  choice: will ich ein Dankopfer darbringen
  rationale: Die Verbindung aus זבח und זֶבַח תּוֹדָה bezeichnet das Darbringen eines Dankopfers. „Darbringen“ bewahrt den kultischen Sinn, ohne das Verb auf das Schlachten zu verengen.
- source_word: וּבְשֵׁם ... אֶקְרָא
  choice: und den Namen ... anrufen
  rationale: Die feste Verbindung קרא בשם bezeichnet hier das Anrufen beziehungsweise die kultisch-gebetshafte Berufung auf Gottes Namen. „Den Namen … anrufen“ ist im Deutschen idiomatisch und hält diesen Sinn offen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. „Jahwe“ gibt ihn im modernen Standarddeutsch als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. Die Wiedergabe „Jahwe“ bewahrt den Charakter als persönlicher Gottesname; die traditionelle Ersetzung durch „der HERR“ wird in der Fußnote genannt.
- issue: Bedeutung von זֶבַח תּוֹדָה
  choice: Dankopfer
  alternative: Opfer des Dankes
  rationale: „Dankopfer“ bezeichnet knapp und verständlich ein Opfer, das als Ausdruck des Dankes dargebracht wird, ohne es bloß metaphorisch als Lobpreis umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt mit „Dir“ den göttlichen Empfänger hervor; „Dankopfer darbringen“ bewahrt den kultischen Charakter des hebräischen Ausdrucks.
