  text: I will lift up the cup of salvations[a], and I will call on the name of Yahweh.
translation:
  language: de
  text: Den Becher der Rettung[a] will ich erheben und den Namen Jahwes anrufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch »Rettungen« oder »Befreiungen« (Plural); der Plural kann mehrere Rettungstaten bezeichnen oder poetisch verstärkend gebraucht sein.
    reason: lexikalische Alternative und Numerusnuance
lexical_decisions:
- source_word: כּוֹס
  choice: Becher
  rationale: Das Substantiv bezeichnet ein Trinkgefäß. »Becher« ist im heutigen Deutsch natürlich und bewahrt das poetische Bild, ohne die besonderen liturgischen Nebenklänge von »Kelch« einzutragen.
- source_word: יְשׁוּעוֹת
  choice: Rettungen
  rationale: Die hebräische Form steht im Plural und kann mehrere erfahrene Rettungstaten oder einen poetisch verstärkenden Plural bezeichnen. Der ungewöhnliche deutsche Plural bewahrt diese Nuance; eine Fußnote erläutert sie.
- source_word: אֶשָּׂא
  choice: will ich erheben
  rationale: נשׂא bedeutet hier im Zusammenhang mit einem Becher »heben/erheben«. »Erheben« gibt die feierliche, poetische Geste knapp und würdig wieder.
- source_word: וּבְשֵׁם ... אֶקְרָא
  choice: und den Namen ... anrufen
  rationale: קרא בשם ist eine feste Wendung für das Anrufen beziehungsweise die Berufung auf einen Namen. »Den Namen … anrufen« ist die natürliche deutsche Wiedergabe der gemeinten Anrufung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. »Jahwe« ist dessen geläufige deutsche Wiedergabe und bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. Die Wiedergabe »Jahwe« erhält diesen als persönlichen Namen; »der HERR« wäre die traditionelle Ersatzlesung, steht aber nicht als Titel im hebräischen Konsonantentext.
- issue: Numerus und Sinn von יְשׁוּעוֹת
  choice: Rettungen
  alternative: Rettung; Befreiungen
  rationale: Der morphologische Plural wird im Haupttext bewahrt, ohne festzulegen, ob mehrere Rettungstaten oder eine poetische Intensivierung gemeint sind. Die möglichen Deutungen werden in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Satzstellung. »Becher« vermeidet unnötig liturgische Festlegung; der auffällige Plural »Rettungen« bildet die hebräische Form bewusst ab und wird durch die Fußnote erschlossen.
