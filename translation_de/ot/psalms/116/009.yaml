  text: אֶ֭תְהַלֵּךְ לִ/פְנֵ֣י יְהוָ֑ה בְּ֝/אַרְצ֗וֹת הַֽ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/009.yaml
  text: I will walk before Yahweh in the lands of the living[a].
translation:
  language: de
  text: Ich werde vor Jahwe gehen in den Ländern der Lebenden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ich werde vor Jahwe leben im Land der Lebenden.“ Die hebräische Wendung „vor Jahwe gehen“ kann auch die Lebensführung bezeichnen; der Plural „Länder“ kann hier allgemein als „Land“ oder „Bereich“ verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְהַלֵּךְ
  choice: ich werde … meinen Weg gehen
  rationale: Das Hitpael-Imperfekt 1. Person Singular von הלך kann sowohl das konkrete Gehen als auch die Lebensführung bezeichnen. „Meinen Weg gehen“ klingt im heutigen Deutsch natürlich und bewahrt beide Bedeutungsmöglichkeiten, ohne den Ausdruck auf bloßes Weiterleben oder ausschließlich sittliches Verhalten festzulegen.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet räumlich oder relational ein Sein und Handeln „vor“ jemandem. Die knappe Wiedergabe lässt den Gedanken des Lebens in Jahwes Gegenwart offen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּאַרְצוֹת
  choice: in den Ländern
  rationale: Die hebräische Form ist Plural. Der Plural wird im Haupttext bewahrt, auch wenn die Wendung allgemein den Bereich oder die Welt der Lebenden bezeichnen kann.
- source_word: הַחַיִּים
  choice: der Lebenden
  rationale: Das substantivierte Pluralwort bezeichnet diejenigen, die leben. „Der Lebenden“ erhält die poetische Ausdrucksweise der hebräischen Wendung.
theological_decisions:
- issue: Bezeichnet der Vers das Weiterleben nach der Rettung oder die Lebensführung in Gottes Gegenwart?
  choice: Das Bild vom Gehen eines Weges vor Jahwe bleibt erhalten.
  alternative: „Ich werde vor Jahwe leben im Land der Lebenden.“
  rationale: Die hebräische Formulierung kann sowohl das weitere Leben nach der Rettung als auch eine vor Gott geführte Lebensweise anklingen lassen. Der Haupttext entscheidet diese Spannung nicht einseitig.
- issue: Ist בְּאַרְצוֹת als wirklicher Plural oder als allgemeiner Lebensbereich zu verstehen?
  choice: Der formale Plural „in den Ländern der Lebenden“ steht im Haupttext.
  alternative: „im Land der Lebenden“ beziehungsweise „im Reich der Lebenden“
  rationale: Der Plural entspricht dem überlieferten hebräischen Text; zugleich kann die feste poetische Wendung den allgemeinen Bereich der Lebenden meinen, was die Fußnote kenntlich macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Meinen Weg gehen“ vermeidet das heute gehobene bis altertümliche „wandeln“, bewahrt aber das hebräische Bild und seine mögliche ethische Bedeutung. Der Plural „Länder“ ist bewusst ungewöhnlich, da er die Form des Ausgangstextes sichtbar hält und durch die Fußnote erläutert wird.
