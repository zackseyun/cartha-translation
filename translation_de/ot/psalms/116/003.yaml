id: PSA.116.3
reference: Psalms 116:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲפָפ֤וּ/נִי חֶבְלֵי מָ֗וֶת וּ/מְצָרֵ֣י שְׁא֣וֹל מְצָא֑וּ/נִי צָרָ֖ה וְ/יָג֣וֹן אֶמְצָֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/003.yaml
  text: The cords of death encircled me[a], and the distresses of Sheol found me; I found trouble and sorrow.
translation:
  language: de
  text: Die Fesseln des Todes umschlangen mich, und die Bedrängnisse des Scheols[a] fanden mich; Not und Kummer fand ich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »des Totenreichs« oder »des Grabes«. Hebräisch: Scheol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: umschlangen mich
  rationale: Das Verb bezeichnet ein Umgeben oder Einschließen. „Umschlangen“ bewahrt das konkrete Bild der Fesseln und klingt in deutscher Poesie natürlich.
- source_word: חֶבְלֵי מָוֶת
  choice: die Fesseln des Todes
  rationale: חֶבֶל bezeichnet ein Seil oder eine Schnur. „Fesseln“ erhält das Bild der bindenden Macht des Todes und ist im Deutschen idiomatischer als „Stricke“, ohne zur Deutung „Schlingen“ überzugehen.
- source_word: וּמְצָרֵי שְׁאוֹל
  choice: und die Bedrängnisse des Scheols
  rationale: מֵצַר kann Enge, Bedrängnis oder Not bezeichnen. Der Plural „Bedrängnisse“ gibt sowohl den bedrückenden Charakter als auch die grammatische Zahl wieder.
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Die Transliteration bewahrt den mehrdeutigen hebräischen Begriff für den Bereich der Toten, ohne ihn auf das einzelne Grab zu verengen.
- source_word: מְצָאוּנִי
  choice: fanden mich
  rationale: Die wörtliche Wiedergabe bewahrt die auffällige Wiederholung derselben hebräischen Wurzel im abschließenden „fand ich“.
- source_word: צָרָה
  choice: Not
  rationale: „Not“ ist eine knappe, natürliche Wiedergabe für Bedrängnis oder Unheil und passt zum gehobenen poetischen Register.
- source_word: וְיָגוֹן
  choice: und Kummer
  rationale: יָגוֹן bezeichnet Kummer, Gram oder Trauer. „Kummer“ bildet mit „Not“ ein verständliches und poetisch ausgewogenes Wortpaar.
- source_word: אֶמְצָא
  choice: fand ich
  rationale: 'Die Wiedergabe mit „finden“ erhält das Wortspiel mit מְצָאוּנִי: Die Bedrängnisse „fanden mich“, und der Sprecher „fand“ Not und Kummer.'
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: das Totenreich; das Grab
  rationale: „Scheol“ hält die kosmologische und theologische Bedeutungsbreite des hebräischen Ausdrucks offen. Eine Fußnote erschließt den Begriff, ohne ihn im Haupttext vorschnell auf eine einzige Deutung festzulegen.
translation_notes:
  register: Moderne, würdige Psalmenpoesie. Die parallelen Bilder und die Wiederholung von „finden“ bleiben sichtbar; seltene altertümliche Wörter werden vermieden.
