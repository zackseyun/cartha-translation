  source_fidelity: 'Der Entwurf gibt die Grundstruktur und den Sinn des Hebräischen zutreffend wieder: pluralisches „meine Gelübde“, die an Jahwe gerichtete Erfüllung, Zukunftsabsicht und der öffentliche Rahmen vor seinem Volk. „Gegenüber Jahwe“ ist jedoch für לַיהוָה weniger unmittelbar als die im Deutschen für Gelübde gut mögliche Dativkonstruktion „Jahwe ... erfüllen“.'
