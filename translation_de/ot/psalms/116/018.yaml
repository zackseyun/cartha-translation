  rationale: Die Revision ersetzt die weniger natürliche Präpositionalfügung „gegenüber Jahwe“ durch den im Deutschen idiomatischen Dativ bei „Gelübde erfüllen“. Sie bewahrt die hebräische Betonung auf „meine Gelübde“, den Zukunftssinn und den öffentlichen Charakter der Handlung. Die Fußnote zur Orts-/Gegenwartsangabe dokumentiert sachgerecht die Unsicherheit der Partikel נָא, ohne den Haupttext zu überladen oder eine umstrittene Deutung festzulegen.
