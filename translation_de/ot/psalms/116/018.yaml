  text: נְ֭דָרַ/י לַ/יהוָ֣ה אֲשַׁלֵּ֑ם נֶגְדָ/ה נָּ֝֗א לְ/כָל עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/018.yaml
  text: I will fulfill my vows to Yahweh in the presence of all his people[a][b].
translation:
  language: de
  text: Meine Gelübde werde ich Jahwe erfüllen[a] vor seinem ganzen Volk.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meine Gelübde werde ich Jahwe einlösen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „vor, im Angesicht von“. Die anschließende Partikel ist in ihrer Funktion unsicher; der Sinn ist eine öffentliche Erfüllung in Gegenwart der versammelten Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדָרַי
  choice: meine Gelübde
  rationale: נֶדֶר bezeichnet ein Gelübde oder ein gelobtes Versprechen; der Plural mit Suffix der 1. Person Singular wird entsprechend wiedergegeben, ohne den Begriff auf Gelübdeopfer einzuengen.
- source_word: לַיהוָה
  choice: gegenüber Jahwe
  rationale: Die Präposition ל kennzeichnet denjenigen, dem die Gelübde geschuldet sind und dem gegenüber sie erfüllt werden. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אֲשַׁלֵּם
  choice: werde ich erfüllen
  rationale: Das Piel von שׁלם bedeutet im Zusammenhang mit Gelübden „bezahlen, einlösen, erfüllen“. „Erfüllen“ ist im heutigen Deutsch natürlich und vermeidet einen unnötig finanziellen Beiklang.
- source_word: נֶגְדָה־נָּא
  choice: vor
  rationale: נֶגֶד bezeichnet „vor, im Angesicht von, in Gegenwart von“. נָא ist hier schwer eindeutig abzubilden und wirkt wahrscheinlich verstärkend; eine gesonderte temporale Übersetzung wird daher nicht in den Haupttext aufgenommen.
- source_word: לְכָל עַמּוֹ
  choice: vor seinem ganzen Volk
  rationale: Zusammen mit נֶגְדָה bezeichnet die Wendung die öffentliche Erfüllung in Gegenwart der gesamten Gemeinschaft. Das Suffix bezieht sich auf Jahwe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm יהוה. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Gelübdeerfüllung
  choice: allgemein als „erfüllen“ wiedergegeben
  alternative: Gelübde bezahlen; Gelübdeopfer darbringen
  rationale: Der Vers lässt offen, auf welche konkrete Weise die Gelübde eingelöst werden. Die Übersetzung bewahrt diese Offenheit und legt weder eine rein finanzielle Zahlung noch ausdrücklich ein Opfer fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Voranstellung von „Meine Gelübde“ bewahrt den poetischen Nachdruck des Hebräischen; „gegenüber Jahwe“ vermeidet im Deutschen die missverständliche Verbindung „Gelübde an Jahwe erfüllen“ und hält zugleich die Funktion der Präposition ל fest.
