  terminology: „Gelübde“, „erfüllen“, „Jahwe“ und „sein ganzes Volk“ sind angemessen. Die Wiedergabe des Tetragramms als „Jahwe“ entspricht zudem der angegebenen englischen theologischen Entscheidung. Die Partikel נָא bei נֶגְדָה־נָא ist schwierig; sie sollte nicht als eindeutig temporales „nun“ in den Text aufgenommen werden.
