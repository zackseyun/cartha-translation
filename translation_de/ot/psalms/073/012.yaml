translation:
  language: de
  text: 'Sieh, das sind die Gottlosen: Sie sind für immer sorglos[a] und vermehren[b] ihren Reichtum.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stets in Sicherheit“ beziehungsweise „für immer ungestört“. Der hebräische Ausdruck kann anhaltende Sorglosigkeit, Ruhe oder Sicherheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gelangen sie zu Reichtum“ beziehungsweise „haben sie Reichtum erworben“. Das hebräische Verb kann sowohl das Erlangen als auch das Vermehren von Besitz hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die deiktische Hervorhebung wird in modernem, würdigem Deutsch bewahrt; „siehe“ wäre heute deutlich altertümlicher.
- source_word: אֵלֶּה
  choice: das sind
  rationale: Die demonstrative Identifizierung wird im Deutschen natürlich mit „das sind“ wiedergegeben.
- source_word: רְשָׁעִים
  choice: die Gottlosen
  rationale: Bezeichnet im Psalmenkontext Menschen, die sich Gott und seinem Recht widersetzen; die traditionelle, weiterhin verständliche Bezeichnung wahrt die religiös-moralische Kategorie.
- source_word: וְשַׁלְוֵי עוֹלָם
  choice: für immer sorglos
  rationale: שָׁלֵו bezeichnet Ruhe, Sorglosigkeit oder Sicherheit; עוֹלָם gibt der Aussage zeitliche Dauer. Die Formulierung wahrt die auffällige Behauptung dauerhaften Wohlergehens, ohne sie metaphysisch festzulegen.
- source_word: הִשְׂגּוּ
  choice: vermehren sie
  rationale: Das Verb kann hier sowohl das Erlangen als auch das Anwachsen von Besitz bezeichnen. „vermehren“ passt natürlich zu Reichtum und bewahrt den möglichen Zuwachsaspekt.
- source_word: חָיִל
  choice: ihren Reichtum
  rationale: חַיִל hat ein breites Bedeutungsspektrum, bezeichnet in diesem Zusammenhang aber am ehesten Vermögen oder Wohlstand. Das Possessivpronomen ist im Deutschen für die natürliche Satzbildung ergänzt.
theological_decisions:
- issue: Bezeichnung der רְשָׁעִים
  choice: die Gottlosen
  alternative: die Frevler / die Bösen
  rationale: „Gottlose“ wahrt im Psalm die Beziehung ihres moralischen Zustands zu Gott, ohne eine bestimmte konfessionelle Lehre einzutragen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem poetischem Ton. „Sieh“ erhält die einleitende Hervorhebung ohne das altertümliche „siehe“. Die knappe Parallelstruktur des hebräischen Verses bleibt erkennbar.
