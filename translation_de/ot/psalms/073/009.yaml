source:
  edition: WLC
  text: שַׁתּ֣וּ בַ/שָּׁמַ֣יִם פִּי/הֶ֑ם וּ֝/לְשׁוֹנָ֗/ם תִּֽהֲלַ֥ךְ בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/009.yaml
  text: They set their mouth against the heavens[b][a], and their tongue struts through the earth.
translation:
  language: de
  text: Sie richten ihren Mund gegen den Himmel[a], und ihre Zunge stolziert über die Erde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie setzen ihren Mund in den Himmel.“ Die hebräische Präposition bedeutet wörtlich „in“; der Zusammenhang legt jedoch nahe, dass sich ihr vermessenes Reden gegen den Himmel richtet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ihre Zunge geht über die Erde.“ Das hebräische Verb bedeutet wörtlich „gehen“ oder „umhergehen“; „stolziert“ gibt hier den hochmütigen Ton des Verses wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁתּוּ
  choice: richten
  rationale: Das Verb bezeichnet grundlegend ein Setzen oder Stellen. In Verbindung mit „Mund“ gibt „richten“ die Handlung im Deutschen natürlich wieder; die feindselige Ausrichtung ergibt sich aus der gesamten Wendung.
- source_word: בַשָּׁמַיִם
  choice: gegen den Himmel
  rationale: Die Präposition bedeutet wörtlich „in“, doch im Zusammenhang ist überhebliches, gegen den Himmel gerichtetes Reden gemeint. Der deutsche Singular „Himmel“ ist hier die natürliche Entsprechung des hebräischen Plurals.
- source_word: פִּיהֶם
  choice: ihren Mund
  rationale: Der hebräische Singular steht bei einem pluralischen Besitzer kollektiv. Der Singular lässt sich im Deutschen bewahren und erhält die knappe Bildsprache.
- source_word: וּלְשׁוֹנָם
  choice: und ihre Zunge
  rationale: Auch hier ist der Singular kollektiv beziehungsweise stellvertretend gebraucht. Er wahrt zudem den Parallelismus mit „ihren Mund“.
- source_word: תִּהֲלַךְ
  choice: stolziert
  rationale: Das Verb bedeutet wörtlich „gehen/umhergehen“. „Stolziert“ bringt in diesem Kontext den hochmütigen, ungehemmten Ton anschaulich zum Ausdruck, ohne den Bildbereich des Gehens aufzugeben.
- source_word: בָּאָרֶץ
  choice: über die Erde
  rationale: Bei einem Bewegungsverb ist „über die Erde“ idiomatisches Deutsch. „Erde“ entspricht dem kosmischen Gegensatz zum Himmel besser als „Land“.
theological_decisions:
- issue: Richtung der frechen Rede
  choice: gegen den Himmel
  alternative: im Himmel
  rationale: Die Übersetzung gibt die im Kontext naheliegende trotzige Ausrichtung wieder, während die Fußnote die wörtliche und grammatisch mögliche Fassung offenhält.
translation_notes:
  register: Moderne, verständliche und zugleich poetisch-würdevolle Standardsprache. Die parallelen Körperbilder „Mund“ und „Zunge“ sowie der Gegensatz zwischen Himmel und Erde bleiben erhalten; beide bildhaften Singularformen werden wie im Hebräischen bewahrt.
