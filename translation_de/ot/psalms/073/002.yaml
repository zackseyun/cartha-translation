base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/002.yaml
  text: But as for me[a], my feet had almost stumbled; my steps had nearly slipped.
translation:
  language: de
  text: Doch ich[a] – beinahe wären meine Füße gestrauchelt, fast wären meine Schritte ausgeglitten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch ich – beinahe wären meine Füße vom Weg abgekommen, fast hätten meine Schritte den Halt verloren.“ Der hebräische Parallelismus verbindet unterschiedliche, einander überlappende Bilder des Wankens, Abweichens und Ausgleitens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Doch ich
  rationale: Die Konjunktion und das selbstständige Pronomen heben den Sprecher hervor und markieren den Gegensatz zum vorausgehenden Zusammenhang. „Doch ich“ gibt dies knapp und natürlich wieder.
- source_word: כִּמְעַט
  choice: beinahe
  rationale: Das Adverb bezeichnet etwas, das nur knapp nicht eingetreten ist. „Beinahe“ ist im Deutschen idiomatisch und bewahrt diesen Sinn.
- source_word: נטוי
  choice: wären … gestrauchelt
  rationale: Im Zusammenhang mit den Füßen bezeichnet die Form ein drohendes Wanken oder Abweichen. „Gestrauchelt“ erhält das konkrete Bild der gefährdeten Standfestigkeit, ohne dessen geistliche Bedeutung ausdrücklich festzulegen.
- source_word: רַגְלָי
  choice: meine Füße
  rationale: Das konkrete Körperbild des Hebräischen wird beibehalten.
- source_word: כְּאַיִן
  choice: fast
  rationale: Die Wendung hat hier den adverbialen Sinn „beinahe, so gut wie“. „Fast“ gibt dies in natürlichem Deutsch wieder und vermeidet eine schwerfällige Wiederholung.
- source_word: שפכה
  choice: wären … ausgeglitten
  rationale: Der Grundsinn „ausgießen, verschütten“ beschreibt in Verbindung mit den Schritten bildhaft das Verlieren des Halts. „Ausgeglitten“ ist eine klare deutsche Entsprechung für dieses Bild.
- source_word: אֲשֻׁרָי
  choice: meine Schritte
  rationale: „Schritte“ bewahrt das Bild des Ganges beziehungsweise Lebensweges und bildet die poetische Parallele zu „meine Füße“.
theological_decisions:
- issue: Bildsprache gefährdeter Standfestigkeit
  choice: Die körperliche Weg- und Standfestigkeitsmetaphorik wird mit „Füße“, „Schritte“, „gestrauchelt“ und „ausgeglitten“ bewahrt.
  alternative: 'Deutend formulieren: „Fast hätte ich meinen Glauben verloren“ oder „Fast wäre ich moralisch zu Fall gekommen“.'
  rationale: Der Vers lässt offen, worin der drohende Fall genau besteht. Die konkrete Bildsprache bewahrt diese theologische Spannung und vermeidet eine konfessionell oder dogmatisch verengende Auslegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bildet die emphatische Voranstellung von „ich“ ab; die parallelen Satzglieder bewahren Rhythmus und Bildsprache des hebräischen Verses.
