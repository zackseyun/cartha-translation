  verdict: approve
  source_fidelity: Die Übersetzung gibt יָצָא מֵחֵלֶב mit dem anschaulichen und im Deutschen idiomatischen „Vor Fett treten ihre Augen hervor“ treffend wieder. Die zweite Zeile bewahrt die Mehrzahl und die innere/mentale Offenheit von מַשְׂכִּיּוֹת; „gehen über jedes Maß hinaus“ gibt עָבְרוּ im poetischen Kontext angemessen als Grenzüberschreitung bzw. Übermaß wieder.
  naturalness: Moderne, verständliche und zugleich würdige poetische Standardsprache. Die Satzfügung ist flüssig; „Vor Fett“ erhält das körperlich-bildhafte Moment, ohne es einseitig zu einer bloßen Wohlstandsmetapher zu erklären.
  terminology: „Vorstellungen ihres Herzens“ ist eine sachgerechte offene Wiedergabe von מַשְׂכִּיּוֹת לֵבָב. Sie legt weder ausschließlich „Gedanken“ noch ausschließlich verwerfliche Pläne oder Bildwerke fest. Der kollektive Singular „Herzens“ ist passend.
