source:
  edition: WLC
  text: יָ֭צָא מֵ/חֵ֣לֶב עֵינֵ֑/מוֹ עָ֝בְר֗וּ מַשְׂכִּיּ֥וֹת לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/007.yaml
  text: Their eyes bulge out from fatness[a]; the imaginations of their heart overflow.
translation:
  language: de
  text: Vor Fett treten ihre Augen hervor[a]; die Vorstellungen ihres Herzens gehen über jedes Maß hinaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihre Augen treten aus dem Fett hervor; die Gedanken ihres Herzens überschreiten jedes Maß.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא
  choice: treten … hervor
  rationale: Das Verb bedeutet wörtlich »hinausgehen/herauskommen«. Im Zusammenhang mit den Augen gibt »hervortreten« das konkrete Bild natürlich wieder, ohne die Bildsprache aufzulösen.
- source_word: מֵחֵלֶב
  choice: vor Fett
  rationale: חֵלֶב bezeichnet wörtlich »Fett«. »Vor Fett« bewahrt sowohl das körperliche Bild als auch dessen Verbindung mit üppigem Wohlstand.
- source_word: עֵינֵמוֹ
  choice: ihre Augen
  rationale: Direkte Wiedergabe des Plurals mit Suffix der 3. Person maskulin Plural.
- source_word: עָבְרוּ
  choice: gehen über jedes Maß hinaus
  rationale: Das Verb bedeutet grundlegend »hinübergehen, überschreiten«. Die Formulierung bringt die hier gemeinte Maßlosigkeit zum Ausdruck und erhält zugleich die Bewegungsmetapher.
- source_word: מַשְׂכִּיּוֹת
  choice: Vorstellungen
  rationale: Das Substantiv kann Bilder, Gedanken, Einbildungen oder Pläne bezeichnen. »Vorstellungen« lässt diese innere, gedankliche Bedeutung offen, ohne sie vorschnell auf böse Pläne oder Götzenbilder festzulegen.
- source_word: לֵבָב
  choice: ihres Herzens
  rationale: Der kollektive Singular »Herz« wird beibehalten; der deutsche Possessivbezug macht die natürliche Beziehung zu den zuvor genannten Personen deutlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die körperliche Fett-Metapher und die Mehrdeutigkeit von מַשְׂכִּיּוֹת bleiben erhalten; die zweite Vershälfte wird wegen der im Hebräischen ausgedrückten Grenzüberschreitung bewusst mit »über jedes Maß hinausgehen« wiedergegeben.
