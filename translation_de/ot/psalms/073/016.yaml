  yaml_path: translation/ot/psalms/073/016.yaml
  text: But when I thought to understand this[a], it was trouble in my eyes.
translation:
  language: de
  text: Als ich aber versuchte, dies zu verstehen,[a] war es in meinen Augen eine Mühsal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als ich aber erwog, dies zu erkennen, war es für mich eine Mühe.“'
    reason: 'Alternative Gesamtwiedergabe: „erwog“ für חשב, „erkennen“ für לדעת, „Mühe“ für עמל und „für mich“ als idiomatische Wiedergabe von „in meinen Augen“.'
lexical_decisions:
- source_word: וָאֲחַשְּׁבָה
  choice: Als ich aber darüber nachdachte
  rationale: חשׁב bezeichnet Nachdenken, Erwägen oder Planen. Zusammen mit dem folgenden Infinitiv gibt „darüber nachdachte, dies zu verstehen“ den bewussten Versuch des Verstehens natürlich wieder; das Waw wird aufgrund des Zusammenhangs adversativ mit „aber“ ausgedrückt.
- source_word: לָדַעַת
  choice: zu verstehen
  rationale: ידע bedeutet grundlegend „wissen/erkennen“, bezeichnet hier aber das gedankliche Erfassen der zuvor geschilderten Wirklichkeit; „verstehen“ ist im Deutschen kontextgemäß.
- source_word: זֹאת
  choice: dies
  rationale: Das Demonstrativpronomen verweist wie im Hebräischen unausgeführt auf die vorangehende Problematik.
- source_word: עָמָל
  choice: mühsam
  rationale: עמל kann Mühsal, beschwerliche Arbeit oder belastende Plage bezeichnen. Das prädikative Adjektiv „mühsam“ bewahrt hier den Gedanken geistiger Anstrengung, ohne ihn auf bloßen Ärger zu verengen.
- source_word: הִיא
  choice: war es
  rationale: Das feminine Pronomen nimmt זֹאת auf und steht in einem Nominalsatz; idiomatisches Deutsch verlangt hier „es war“.
- source_word: בְעֵינַי
  choice: in meinen Augen
  rationale: Die wörtliche Wendung ist auch im Deutschen verständlich und erhält das Bild persönlicher Wahrnehmung und Einschätzung.
