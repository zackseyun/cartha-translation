base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/001.yaml
  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to those pure in heart.
translation:
  language: de
  text: Ein Psalm Asafs. Gewiss[a] ist Gott gut zu Israel, zu denen, die reinen Herzens sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wahrhaftig“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Die etablierte und sachlich passende Bezeichnung für diese Gattung und Psalmüberschrift.
- source_word: לְאָסָף
  choice: Asafs
  rationale: Der deutsche Genitiv ist in Psalmüberschriften idiomatisch und lässt offen, ob Autorschaft, Zugehörigkeit oder Zuordnung gemeint ist.
- source_word: אַךְ
  choice: Ja
  rationale: Hier bekräftigt das Wort die leitende Aussage des Psalms. „Ja“ klingt im modernen Deutschen natürlich und würdevoll; auch „Wahrhaftig“ ist möglich.
- source_word: טוֹב
  choice: gut
  rationale: Bewahrt die breite Bedeutung von Gottes Güte und wohltätigem Handeln, ohne sie unnötig einzuengen.
- source_word: לְיִשְׂרָאֵל
  choice: zu Israel
  rationale: Gibt die durch לְ bezeichnete Beziehung idiomatisch in der Verbindung „gut zu“ wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Wort bezeichnet hier singularisch den Gott Israels.
- source_word: לְבָרֵי לֵבָב
  choice: zu denen, die reinen Herzens sind
  rationale: Gibt die innere, ethische Reinheit natürlich wieder und hält den parallelen Anschluss mit „zu“ sichtbar.
theological_decisions:
- issue: Verhältnis zwischen „Israel“ und „denen, die reinen Herzens sind“
  choice: Die zweite Wendung kann Israel näher bestimmen.
  alternative: Die beiden Wendungen können als zwei koordinierte Bezugsgruppen verstanden werden.
  rationale: Die parallelen לְ-Wendungen lassen eine erläuternde Apposition naheliegen, entscheiden die syntaktisch-theologische Beziehung aber nicht völlig. Der Haupttext bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Überschrift bleibt knapp; „Asafs“ vermeidet eine Festlegung auf Autorschaft. Die Wiederholung von „zu“ spiegelt die hebräische Parallelstruktur und bewahrt die mögliche appositionelle wie koordinierende Lesart.
