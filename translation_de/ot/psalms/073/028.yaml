  source_fidelity: Der Text gibt die hebräische Kontrastsetzung (וַאֲנִי), die absichtlich offene Nominalverbindung קִרֲבַת אֱלֹהִים, den persönlichen Nutzen (לִי טוֹב), die Zufluchtsmetapher sowie die Zweckangabe des Infinitivs לְסַפֵּר zuverlässig wieder. „Gottes Nähe“ bewahrt die im Hebräischen mögliche Spannung zwischen Gottes Nähe und dem Nahesein bei Gott. „Den Herrn Jahwe zu meiner Zuflucht gemacht“ ist eine idiomatische deutsche Entsprechung der hebräischen Wendung, auch wenn diese wörtlicher von der Zuflucht bei/in JHWH spricht.
