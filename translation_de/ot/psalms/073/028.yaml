id: PSA.73.28
reference: Psalms 73:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲנִ֤י קִֽרֲבַ֥ת אֱלֹהִ֗ים לִ֫/י ט֥וֹב שַׁתִּ֤י בַּ/אדֹנָ֣/י יְהֹוִ֣ה מַחְסִ֑/י לְ֝/סַפֵּ֗ר כָּל מַלְאֲכוֹתֶֽי/ךָ׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/028.yaml
  text: But as for me[a], the nearness of God is good for me; I have made the Lord GOD my refuge, so that I may tell of all your works.
translation:
  language: de
  text: Doch für mich ist Gottes Nähe[a] gut. Ich habe den Herrn Jahwe zu meiner Zuflucht gemacht, um von all deinen Werken zu erzählen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gott nahe zu sein, ist gut für mich.“ Das hebräische Substantiv kann die relationale Nähe zu Gott bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Doch für mich
  rationale: Die Konjunktion und das selbstständige Pronomen setzen den Beter betont in Gegensatz zu den zuvor beschriebenen Gottlosen und ihrem Ende.
- source_word: קִרֲבַת אֱלֹהִים
  choice: Gottes Nähe
  rationale: Die nominale Form des Hebräischen bleibt erhalten. Der deutsche Genitiv bewahrt dabei eher als eine ausdrücklich richtungsbezogene Formulierung die Spannung zwischen Gottes Nähe und der Nähe des Beters zu Gott.
- source_word: לִי טוֹב
  choice: ist … gut für mich
  rationale: Die Wendung bezeichnet das, was dem Beter guttut; die gewählte Form ist natürliches modernes Deutsch und bewahrt den persönlichen Bezug.
- source_word: שַׁתִּי
  choice: Ich habe … gemacht
  rationale: Das Verb bedeutet „setzen, stellen, machen“. Zusammen mit „meine Zuflucht“ bezeichnet es die bewusste Entscheidung, bei Gott Schutz zu suchen.
- source_word: בַּאדֹנָי יְהוִה
  choice: den Herrn Jahwe
  rationale: אֲדֹנָי wird als Titel „Herr“ und der Gottesname יהוה als „Jahwe“ wiedergegeben. So bleiben Titel und Eigenname erkennbar, ohne die schwer verständliche Doppelung „Herr HERR“.
- source_word: מַחְסִי
  choice: zu meiner Zuflucht
  rationale: מַחְסֶה bezeichnet einen sicheren Zufluchts- oder Schutzort; „Zuflucht“ ist hier präzise und im Deutschen idiomatisch.
- source_word: לְסַפֵּר
  choice: um … zu erzählen
  rationale: Der Infinitiv mit לְ kann hier den Zweck ausdrücken. „Erzählen“ gibt das öffentliche Berichten von Gottes Taten in allgemein verständlicher Sprache wieder.
- source_word: כָּל מַלְאֲכוֹתֶיךָ
  choice: all deinen Werken
  rationale: מְלָאכָה bezeichnet Werk oder Arbeit und meint hier umfassend das, was Gott getan hat; „Werke“ bleibt nahe am hebräischen Ausdruck.
theological_decisions:
- issue: Bezug von קִרֲבַת אֱלֹהִים
  choice: Gottes Nähe ist gut für mich
  alternative: Gott nahe zu sein, ist gut für mich
  rationale: Die hebräische Nominalverbindung lässt offen, ob stärker Gottes Nähe oder das Nahesein des Beters zu Gott im Blick ist. Der Haupttext bewahrt diese Spannung; die Fußnote nennt die mögliche relationale Lesart.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR
  rationale: Die gewählte Form bildet sowohl den Herrentitel als auch den persönlichen Gottesnamen ab. Die Alternative folgt einer verbreiteten typografischen Ersatzkonvention, verdeckt jedoch den Namen stärker.
- issue: Funktion von לְסַפֵּר
  choice: 'Zweckangabe: „um … zu erzählen“'
  alternative: 'Folge oder lose Weiterführung: „und ich will … erzählen“'
  rationale: Der mit לְ eingeleitete Infinitiv lässt sich im Satz am natürlichsten als Zweck der Zufluchtnahme verstehen, ohne eine bestimmte konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist klar und mündlich verständlich; die nominale Wendung „Gottes Nähe“ und „Zuflucht“ erhalten zugleich den poetischen Charakter des Psalms.
