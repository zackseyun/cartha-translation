base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/011.yaml
  text: And they say[b][a], “How does God know? Is there knowledge in the Most High?”
translation:
  language: de
  text: 'Und sie sagen[a]: »Wie weiß Gott das? Hat der Höchste Wissen[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und sie sagten«, wenn das hebräische Perfekt als einfache Vergangenheit verstanden wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Gibt es Wissen im Höchsten?«; die Formulierung fragt, ob der Höchste Wissen besitzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Und sie sagen
  rationale: Das hebräische Perfekt kann in diesem poetischen Zusammenhang eine wiederkehrende, für die geschilderten Menschen typische Äußerung bezeichnen. Das deutsche Präsens gibt diese fortdauernde Haltung natürlich wieder.
- source_word: אֵיכָה יָדַע אֵל
  choice: Wie sollte Gott davon wissen?
  rationale: אֵיכָה bedeutet wörtlich »wie?«, und יָדַע bezeichnet »wissen/kennen«. Die Formulierung mit »sollte« und »davon« macht die spöttisch-rhetorische Frage im modernen Deutschen verständlich, ohne festzulegen, ob Gottes Wissen grundsätzlich geleugnet oder nur hinsichtlich des zuvor Geschilderten bestritten wird.
- source_word: וְיֵשׁ דֵּעָה
  choice: Gibt es Erkenntnis
  rationale: יֵשׁ ist eine Existenzpartikel; דֵּעָה bedeutet »Erkenntnis«, »Wissen« oder »Kenntnis«. »Erkenntnis« erhält die begriffliche Verbindung zum vorangehenden Verb »wissen« und bewahrt den gehobenen poetischen Ton.
- source_word: בְעֶלְיוֹן
  choice: beim Höchsten
  rationale: Die Präposition בְּ kann hier den Bereich oder Besitzträger bezeichnen. »Beim Höchsten« ist im Deutschen idiomatischer als das wörtliche »im Höchsten« und lässt die Frage offen formuliert, ob der Höchste Erkenntnis besitzt.
theological_decisions:
- issue: Wiedergabe des Gottestitels עֶלְיוֹן
  choice: der Höchste
  alternative: der Allerhöchste; der Erhabene
  rationale: »Der Höchste« ist eine direkte, etablierte Wiedergabe des göttlichen Titels und betont Gottes Hoheit, ohne zusätzliche konfessionelle oder interpretierende Nuancen einzutragen.
- issue: Rhetorische Bestreitung göttlichen Wissens
  choice: Die beiden Fragen bleiben als spöttische Fragen stehen.
  alternative: Als ausdrückliche Behauptung wiedergeben, Gott wisse nichts.
  rationale: Der hebräische Text formuliert Fragen. Die Übersetzung bewahrt dadurch die rhetorische Spannung und legt nicht fest, wie umfassend die Sprecher Gottes Wissen bestreiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die rhetorische Schärfe des Hebräischen bleibt erhalten; unnatürliche wörtliche Syntax wird vermieden, während relevante Mehrdeutigkeiten in den Fußnoten ausgewiesen werden.
