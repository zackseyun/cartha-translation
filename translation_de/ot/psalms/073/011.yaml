  naturalness: „Wie weiß Gott das?“ ist modernes, natürliches Standarddeutsch und bewahrt die knappe rhetorische Schärfe. „Gibt es beim Höchsten Erkenntnis?“ ist verständlich, aber „beim“ interpretiert die Präposition stärker possessiv; die Fußnote kann die wörtliche Form und die gemeinte Besitzfrage erläutern.
