translation:
  language: de
  text: bis ich in die Heiligtümer Gottes[a] ging; da erkannte ich ihr Ende.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Heiligtum Gottes“. Im Hebräischen steht die Mehrzahl „Heiligtümer“; sie kann die heiligen Bereiche Gottes zusammenfassend bezeichnen.'
