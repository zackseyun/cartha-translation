lexical_decisions:
- source_word: עַד
  choice: bis
  rationale: Kennzeichnet den Wendepunkt und den Zeitpunkt, bis zu dem die Ratlosigkeit des Psalmbeters anhielt.
- source_word: אָבוֹא
  choice: ich hineinging
  rationale: Die Form bezeichnet im Zusammenhang mit עַד den entscheidenden Eintritt in den heiligen Bereich; das deutsche Präteritum gibt den erzählerischen Rückblick natürlich wieder.
- source_word: אֶל
  choice: in … hinein
  rationale: Bei einem Verb des Eintretens bringt diese Wiedergabe die Bewegung in den heiligen Bereich idiomatisch zum Ausdruck.
- source_word: מִקְדְּשֵׁי אֵל
  choice: die Heiligtümer Gottes
  rationale: Der hebräische Ausdruck steht im Plural. Die Übersetzung wahrt diese Form, ohne festzulegen, ob mehrere heilige Orte oder der heilige Bezirk als Gesamtheit gemeint ist.
- source_word: אֵל
  choice: Gott
  rationale: אֵל dient hier als Gottesbezeichnung und wird im modernen Standarddeutsch natürlich mit „Gott“ wiedergegeben.
- source_word: אָבִינָה
  choice: da verstand ich
  rationale: Das Verb בין bezeichnet Einsicht oder Unterscheidungsvermögen; „da“ verdeutlicht knapp die durch den Eintritt ausgelöste Wende.
- source_word: לְאַחֲרִיתָם
  choice: welches Ende sie nehmen würden
  rationale: אַחֲרִית bezeichnet hier das letztliche Ende oder den Ausgang der zuvor beschriebenen Frevler. Die Formulierung ist idiomatisch und bewahrt den Blick auf ihr endgültiges Geschick.
theological_decisions:
- issue: Plural oder traditioneller Singular bei מִקְדְּשֵׁי
  choice: die Heiligtümer Gottes
  alternative: das Heiligtum Gottes
  rationale: Der Haupttext folgt dem hebräischen Plural. Dieser kann mehrere heilige Bereiche oder kollektiv den gesamten heiligen Bezirk bezeichnen; eine bestimmte räumliche oder theologische Deutung wird nicht erzwungen.
- issue: Bedeutungsumfang von לְאַחֲרִיתָם
  choice: welches Ende sie nehmen würden
  alternative: ihren Ausgang / ihre Zukunft
  rationale: Die gewählte Formulierung bewahrt den gewichtigen Bezug auf das letztliche Geschick, ohne näher festzulegen, auf welche Weise dieses Ende eintritt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der hebräische Plural wird im Haupttext bewahrt; die etwas freiere Wendung „welches Ende sie nehmen würden“ macht den Zukunftsbezug von אַחֲרִית im Deutschen verständlich, ohne die Aussage theologisch auszudeuten.
