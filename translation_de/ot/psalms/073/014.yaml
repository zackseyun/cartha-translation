  text: וָ/אֱהִ֣י נָ֭גוּעַ כָּל הַ/יּ֑וֹם וְ֝/תוֹכַחְתִּ֗/י לַ/בְּקָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/014.yaml
  text: For I was afflicted all day long[b][a], and chastened every morning.
translation:
  language: de
  text: Denn den ganzen Tag war ich geplagt[a], und Morgen für Morgen erfuhr ich Zurechtweisung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »geschlagen« oder »heimgesucht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »und meine Zurechtweisung [war] an den Morgen«; gemeint ist eine wiederkehrende Zurechtweisung oder Erziehung Morgen für Morgen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: Denn … war ich
  rationale: Das mit Waw verbundene Qatal führt die Erklärung aus dem vorherigen Vers fort. „Denn“ gibt diesen begründenden Zusammenhang im Deutschen natürlich wieder.
- source_word: נָגוּעַ
  choice: geplagt
  rationale: Das passive Partizip bezeichnet einen Zustand des Geschlagenseins oder Leidens. „Geplagt“ ist verständlich und lässt offen, ob körperliches Leiden oder eine allgemeinere Heimsuchung gemeint ist.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Die geläufige deutsche Wendung bewahrt die Aussage einer über den gesamten Tag anhaltenden Erfahrung.
- source_word: וְתוֹכַחְתִּי
  choice: und … traf mich Zurechtweisung
  rationale: Das Substantiv mit Suffix lautet wörtlich „meine Zurechtweisung“ beziehungsweise „meine Rüge“. Die verbale Fassung ist im Deutschen natürlich und bewahrt den Gedanken erfahrener Korrektur, ohne ihn auf eine bloß mündliche Rüge einzuengen.
- source_word: לַבְּקָרִים
  choice: jeden Morgen
  rationale: Der Plural mit Präposition hat hier verteilenden, wiederholten Sinn; „jeden Morgen“ bringt dies klar zum Ausdruck.
theological_decisions:
- issue: Art des beschriebenen Leidens
  choice: Allgemeine Sprache für fortwährende Plage und Zurechtweisung
  alternative: Körperliche Krankheit oder ausdrücklich strafender göttlicher Zorn
  rationale: Die hebräischen Begriffe sind weit gefasst. Die Übersetzung legt weder eine bestimmte Krankheit noch ausschließlich verbale Kritik oder Strafzorn fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus bleibt erkennbar; die substantivische hebräische Wendung im zweiten Halbvers wird für natürliches Deutsch behutsam verbalisiert.
