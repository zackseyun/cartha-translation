  text: בַּ/עֲמַ֣ל אֱנ֣וֹשׁ אֵינֵ֑/מוֹ וְ/עִם אָ֝דָ֗ם לֹ֣א יְנֻגָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/005.yaml
  text: They are not in the trouble of mortal man[a], and they are not plagued with mankind.
translation:
  language: de
  text: Die Mühsal der Sterblichen kennen sie nicht[a], und mit den Menschen werden sie nicht geplagt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Not sterblicher Menschen kennen sie nicht, und zusammen mit der Menschheit werden sie nicht heimgesucht.“'
    reason: Lexikalische Alternativen für עָמָל („Mühsal“, „Not“) und נגע im passiven Stamm („geplagt“, „heimgesucht“); die Verbindung mit עִם bleibt als „zusammen mit“ erkennbar.
lexical_decisions:
- source_word: בַּעֲמַל
  choice: die Mühsal
  rationale: עָמָל kann Mühsal, Not oder beschwerliche Arbeit bezeichnen. „Mühsal“ bewahrt die Breite des Begriffs und passt zum scheinbar sorgenfreien Leben der Frevler.
- source_word: אֱנוֹשׁ
  choice: der Sterblichen
  rationale: אֱנוֹשׁ bezeichnet den Menschen mit dem Beiklang seiner Schwäche und Sterblichkeit. Der substantivierte Plural klingt im Deutschen natürlich und erhält diese Nuance.
- source_word: אֵינֵמוֹ
  choice: sie teilen nicht
  rationale: Die verneinte Existenzform mit Suffix besagt hier, dass diese Mühsal nicht ihr Los ist. Zusammen mit בַּעֲמַל gibt „sie teilen nicht“ den idiomatischen Sinn natürlich wieder.
- source_word: וְעִם
  choice: wie andere
  rationale: עִם bezeichnet Gemeinschaft beziehungsweise Zugehörigkeit. Im Parallelismus drückt die Formulierung aus, dass sie nicht gemeinsam mit den übrigen Menschen betroffen sind; „wie andere“ macht diesen Vergleich im Deutschen verständlich.
- source_word: אָדָם
  choice: Menschen
  rationale: אָדָם ist hier kollektiv und meint die Menschheit beziehungsweise die Menschen allgemein.
- source_word: יְנֻגָּעוּ
  choice: werden … geplagt
  rationale: Die passive Form von נגע bedeutet geschlagen oder heimgesucht werden. „Geplagt werden“ gibt die allgemeine Bedrängnis wieder, ohne zwingend eine Krankheit vorauszusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. „Sterbliche“ erhält die Gebrechlichkeitsnuance von אֱנוֹשׁ; „andere Menschen“ vermeidet im zweiten Halbvers eine unnatürliche Wiederholung.
