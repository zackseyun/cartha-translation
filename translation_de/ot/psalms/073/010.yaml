  yaml_path: translation/ot/psalms/073/010.yaml
  text: Therefore his people turn back here[c][b][a], and waters of fullness are drained by them.
translation:
  language: de
  text: Darum kehrt sein Volk hierher zurück[a], und Wasser in Fülle[b] wird von ihnen ausgesogen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Darum bringt er sein Volk hierher zurück.“ Die Verbform kann als „zurückkehren“ oder transitiv als „zurückbringen“ verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Wasser der Fülle“; gemeint sein kann reichlich vorhandenes Wasser, doch das Bild ist schwer verständlich.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und Wasser in vollem Maß wird für sie ausgepresst.“ Sowohl das Verb als auch das abschließende Pronomen sind schwierig; der Halbvers kann statt vom Aussaugen durch sie auch von einer ihnen gewährten reichen Portion sprechen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Die Folgerungsbeziehung zum vorausgehenden Zusammenhang wird in natürlichem Deutsch klar wiedergegeben.
- source_word: ישיב
  choice: kehrt … zurück
  rationale: Der Hifil von שוב kann hier angesichts der schwierigen Syntax intransitiv verstanden werden; die mögliche transitive Bedeutung wird in einer Fußnote bewahrt.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: Die Form bezeichnet ein Volk mit maskulinem Singularsuffix. Der Bezug von „sein“ bleibt wie im Hebräischen offen.
- source_word: הֲלֹם
  choice: hierher
  rationale: Das Richtungsadverb bezeichnet eine Bewegung an diesen Ort; „hierher“ gibt dies im Deutschen genauer wieder als bloßes „hier“.
- source_word: וּמֵי מָלֵא
  choice: und Wasser in Fülle
  rationale: Die poetische Wendung bezeichnet wörtlich etwa „Wasser der Fülle“ beziehungsweise reichliches Wasser. „Wasser in Fülle“ ist verständlich und bleibt dem Bild nahe.
- source_word: יִמָּצוּ
  choice: wird … ausgeschöpft
  rationale: Der Nifal von מצה bezeichnet ein Ausgesogen-, Ausgepresst- oder Entleertwerden. „Ausgeschöpft“ erhält das passive Bild, ohne es unnötig festzulegen.
- source_word: לָמוֹ
  choice: von ihnen
  rationale: Die Präposition mit Suffix wird im Zusammenhang mit dem Passiv als Handelnder verstanden; die ebenfalls mögliche Bedeutung „für sie“ wird in der Fußnote genannt.
theological_decisions:
- issue: Bezug von „sein“ in „sein Volk“
  choice: Im Haupttext offengelassen
  alternative: das Volk des Gottlosen; Gottes Volk
  rationale: Das hebräische Suffix nennt seinen Bezug nicht ausdrücklich. Eine Festlegung würde eine umstrittene Deutung in die Übersetzung eintragen.
- issue: Ausrichtung des zweiten Halbverses
  choice: Die Wasser werden von ihnen ausgeschöpft
  alternative: Wasser in vollem Maß wird für sie ausgepresst beziehungsweise ihnen dargeboten
  rationale: Verb und Pronomen lassen mehrere Deutungen zu. Der Haupttext wahrt eine mögliche passive Lesart; die alternative, empfangsbezogene Deutung steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Bildsprache des Hebräischen bleibt erkennbar, wird aber mit „Wasser in Fülle“ idiomatisch gefasst. Die syntaktische und theologische Mehrdeutigkeit wird nicht stillschweigend aufgelöst.
