  text: כָּלָ֥ה שְׁאֵרִ֗/י וּ/לְבָ֫בִ֥/י צוּר לְבָבִ֥/י וְ/חֶלְקִ֗/י אֱלֹהִ֥ים לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/026.yaml
  text: My flesh and my heart may fail[b][a], but God is the rock of my heart and my portion forever.
translation:
  language: de
  text: Mein Leib und mein Herz vergehen[a]; doch Gott ist der Fels meines Herzens[b] und mein Anteil für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mein Leib und mein Herz schwinden“; das hebräische Verb kann ein Versagen, Vergehen oder Zu-Ende-Gehen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Sinngemäß auch: „die Kraft meines Herzens“. Wörtlich steht im Hebräischen die Metapher „der Fels meines Herzens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: vergehen
  rationale: Das Verb bezeichnet ein Zu-Ende-Gehen, Schwinden oder Versagen. „Vergehen“ bewahrt die im Hebräischen nicht ausdrücklich modalisierte Aussage und passt sowohl zu körperlichem Verfall als auch zum Schwinden der inneren Kraft.
- source_word: שְׁאֵרִי
  choice: mein Leib
  rationale: Im Zusammenhang mit „mein Herz“ bezeichnet שְׁאֵר die leibliche Seite des Menschen. „Leib“ ist im modernen Deutschen verständlich und für einen Psalm würdevoller und natürlicher als „Fleisch“, ohne die anthropologische Gegenüberstellung aufzugeben.
- source_word: לְבָבִי
  choice: mein Herz
  rationale: „Herz“ gibt das innere Selbst mit Denken, Wollen und Empfinden angemessen wieder. Die zweimalige Nennung wird entsprechend der hebräischen poetischen Betonung bewahrt.
- source_word: צוּר
  choice: der Fels
  rationale: Die konkrete Gottesmetapher wird erhalten und nicht vorzeitig als „Kraft“ gedeutet. Sie vermittelt Festigkeit, Sicherheit und Beständigkeit.
- source_word: חֶלְקִי
  choice: mein Anteil
  rationale: „Anteil“ gibt die Vorstellung des zugeteilten Besitzes beziehungsweise Erbes klar wieder und ist im heutigen Deutsch verständlicher als das mögliche „Teil“.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Hier bezeichnet אֱלֹהִים den Gott Israels als Gegenstand des persönlichen Bekenntnisses.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bringt bleibende, unbegrenzte Dauer in natürlichem modernem Deutsch zum Ausdruck.
theological_decisions:
- issue: Anthropologische Sprache im ersten Versglied
  choice: Mein Leib und mein Herz vergehen
  alternative: Mein Fleisch und mein Herz versagen möglicherweise
  rationale: Die Übersetzung wahrt die Gegenüberstellung von äußerem und innerem Menschen, ohne sie auf moderne Kategorien wie Körper und Verstand zu verengen. Der hebräische Verbalsatz kann gegenwärtiges oder allgemeines Schwinden ausdrücken; ein ausdrücklich modales „können“ oder „mögen“ steht nicht im Text.
- issue: Gottesmetapher צוּר
  choice: Gott ist der Fels meines Herzens
  alternative: Gott ist die Kraft meines Herzens
  rationale: Die konkrete Metapher des Ausgangstextes bleibt stehen. „Kraft“ benennt nur eine mögliche Bedeutung der Felsvorstellung und würde deren theologische Bildfülle einschränken.
- issue: Gott als חֶלֶק
  choice: mein Anteil für immer
  alternative: mein Erbteil in Ewigkeit
  rationale: „Anteil“ erhält die Vorstellung, dass Gott selbst der dem Beter zugefallene Besitz ist, ohne durch „Erbteil“ eine im Ausdruck nicht ausdrücklich genannte Erbsituation festzulegen.
translation_notes:
  register: Moderne, würdige Psalmsprache mit parallelem Satzbau. Die konkrete Felsmetapher und die Wiederholung von „mein Herz“ bleiben erhalten. „Leib“ vermeidet eine missverständliche Verengung von שְׁאֵר auf bloßes Fleisch; „doch“ macht den im Hebräischen durch die Gegenüberstellung erkennbaren Kontrast natürlich deutlich.
