  text: כִּֽי הִנֵּ֣ה רְחֵקֶ֣י/ךָ יֹאבֵ֑דוּ הִ֝צְמַ֗תָּה כָּל זוֹנֶ֥ה מִמֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/027.yaml
  text: For behold[a], those far from you will perish; you destroy all who are unfaithful to you.
translation:
  language: de
  text: Denn siehe, die dir fern sind, kommen um; du vernichtest alle, die dir die Treue brechen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „alle, die von dir weg Hurerei treiben“; ein hebräisches Bild für geistliche oder bundesbezogene Untreue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und bewahrt die erklärende beziehungsweise kausale Funktion.
- source_word: הִנֵּה
  choice: siehe
  rationale: Lenkt mit feierlichem Nachdruck die Aufmerksamkeit auf die folgende Aussage; „siehe“ ist in gehobener moderner Bibelsprache verständlich.
- source_word: רְחֵקֶיךָ
  choice: die dir fern sind
  rationale: Bezeichnet Menschen, deren Ferne von Gott hier vor allem relational zu verstehen ist.
- source_word: יֹאבֵדוּ
  choice: kommen um
  rationale: Gibt das Zugrundegehen oder Ins-Verderben-Geraten natürlich und mit dem nötigen Gewicht wieder.
- source_word: הִצְמַתָּה
  choice: du vernichtest
  rationale: Das Hifil von צמת bezeichnet das Beseitigen oder Vernichten. Das hebräische Perfekt kann hier die Gewissheit des Handelns Gottes ausdrücken; das deutsche Präsens passt zum allgemeinen und poetisch parallelen Charakter der Aussage.
- source_word: כָּל
  choice: alle
  rationale: Bewahrt den umfassenden Geltungsbereich des hebräischen Ausdrucks.
- source_word: זוֹנֶה
  choice: die … die Treue brechen
  rationale: Das Partizip von זנה verwendet das Bild der Prostitution für Untreue gegenüber Gott. „Die Treue brechen“ macht den Beziehungs- und Bundesaspekt deutlich, ohne das Bild im Haupttext unnötig drastisch auszudrücken.
- source_word: מִמֶּךָּ
  choice: dir
  rationale: Bei זנה bezeichnet die Präposition denjenigen, von dem man sich treulos abwendet. Die deutsche Wendung „dir die Treue brechen“ gibt diese Beziehung idiomatisch wieder.
theological_decisions:
- issue: Bildhafte Bedeutung von זנה gegenüber Gott
  choice: Als Treuebruch gegenüber Gott wiedergeben
  alternative: „alle, die von dir weg Hurerei treiben“ beziehungsweise „sich von dir weg prostituieren“
  rationale: Im unmittelbaren Zusammenhang stehen Gottesnähe und Gottesferne einander gegenüber. זנה bezeichnet daher bildhaft geistliche beziehungsweise bundeshafte Untreue. Die Hauptübersetzung gibt den Sinn klar wieder; die Fußnote bewahrt das konkrete hebräische Bild.
- issue: Zeitform von הִצְמַתָּה
  choice: 'Präsens: „du vernichtest“'
  alternative: 'Perfekt: „du hast vernichtet“'
  rationale: Obwohl die hebräische Verbform formal perfektiv ist, kann sie hier eine als gewiss dargestellte oder allgemein geltende Handlung bezeichnen. Das Präsens erhält zudem den Parallelismus zu „kommen um“, ohne die Aussage auf ein einzelnes vergangenes Ereignis festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst biblisch-feierlichem „siehe“. Der Haupttext ist gut verständlich, während die Fußnote das drastischere hebräische Bild transparent macht.
