base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/020.yaml
  text: Like a dream when one awakes[a], Lord, when you rouse yourself, you will despise their image.
translation:
  language: de
  text: Wie ein Traum beim Erwachen, Herr – wenn du erwachst[a], wirst du ihr Bild verachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, weniger wahrscheinlich: »Herr, in der Stadt wirst du ihr Bild verachten.« Die hebräischen Konsonanten erlauben auch diese Lesart; der Zusammenhang spricht jedoch deutlich für »wenn du erwachst«.'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: Wie ein Traum
  rationale: Das Präfix כְּ kennzeichnet einen Vergleich; חֲלוֹם bedeutet »Traum«. Die Formulierung gibt das poetische Gleichnis natürlich wieder.
- source_word: מֵהָקִיץ
  choice: beim Erwachen
  rationale: 'Die Form geht auf קיץ/יקץ »erwachen« zurück. Das Präfix מִן kann hier zeitlich verstanden werden: Ein Traum verliert beim Erwachen seine Wirklichkeit.'
- source_word: אֲדֹנָי
  choice: Herr
  rationale: אֲדֹנָי ist hier die als Anrede gebrauchte Gottesbezeichnung. »Herr« ist die übliche, klare deutsche Wiedergabe.
- source_word: בָּעִיר
  choice: wenn du dich erhebst
  rationale: Im Zusammenhang ist am ehesten eine verbale Form zu עור »sich regen, erwachen, sich erheben« gemeint. »Dich erhebst« bezeichnet Gottes Aufstehen zum Handeln und bewahrt zugleich den Bezug zum Erwachen aus einem Traum.
- source_word: צַלְמָם
  choice: ihr Bild
  rationale: צֶלֶם bedeutet »Bild, Gestalt, Abbild«. »Ihr Bild« bewahrt die lexikalische Offenheit, ohne die im Kontext wohl mitschwingende Unwirklichkeit ihrer Erscheinung ausdrücklich auszudeuten.
- source_word: תִּבְזֶה
  choice: wirst du … verachten
  rationale: בזה bedeutet »verachten, geringschätzen«. Der Imperfekt wird im zeitlichen Satzgefüge zukunftsbezogen wiedergegeben.
theological_decisions:
- issue: Deutung von בָּעִיר
  choice: 'verbal: »wenn du dich erhebst«'
  alternative: 'lokal: »in der Stadt«'
  rationale: 'Das Bild vom Erwachen unmittelbar zuvor und der poetische Parallelismus sprechen deutlich für eine verbale Deutung: Wie ein Traum beim Erwachen vergeht, so wird die Erscheinung der Frevler bedeutungslos, wenn der Herr sich zum Handeln erhebt. Die nach den Konsonanten mögliche lokale Lesart wird in der Fußnote bewahrt.'
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzführung. Der Gedankenstrich macht die Anrede und den anschließenden Zeitsatz verständlich, ohne die Bildsprache zu erklären oder theologisch einzuengen.
