translation:
  language: de
  text: Sie spotten und reden boshaft[a]; von oben herab reden sie von Unterdrückung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie höhnen und reden Böses; hochmütig reden sie von Unterdrückung.“ Das erste hebräische Verb ist schwer zu deuten. „Von oben herab“ kann statt einer Position auch die hochmütige Art ihres Redens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִיקוּ
  choice: Sie spotten
  rationale: Die Hifil-Form von מוק ist an dieser Stelle schwierig. Im Zusammenhang mit ihrem hochmütigen Reden gibt „spotten“ den verächtlichen Ton wieder, ohne die unsichere Deutung als „verdorben sein“ festzuschreiben.
- source_word: וִידַבְּרוּ
  choice: und reden
  rationale: Die Konjunktion mit dem Imperfekt setzt die Beschreibung des Verhaltens der Frevler fort; die knappe deutsche Verbindung wahrt den Parallelismus.
- source_word: בְרָע
  choice: boshaft
  rationale: ב mit רַע beschreibt hier wahrscheinlich Art oder Inhalt ihres Redens. „Boshaft“ ist natürliches modernes Deutsch und bewahrt die moralisch feindselige Färbung.
- source_word: עֹשֶׁק
  choice: Unterdrückung
  rationale: Das Substantiv bezeichnet Unterdrückung oder ausbeuterisches Unrecht. „Unterdrückung“ erhält die sozialethische Tragweite, ohne den Sinn auf Erpressung zu verengen.
- source_word: מִמָּרוֹם
  choice: von oben herab
  rationale: Wörtlich bedeutet die Wendung „aus der Höhe/von oben“. Im Kontext bezeichnet sie wahrscheinlich die hochmütige Haltung der Redenden; „von oben herab“ bewahrt sowohl das Höhenbild als auch den arroganten Ton.
- source_word: יְדַבֵּרוּ
  choice: reden sie
  rationale: Die Wiederholung des Verbs wird beibehalten, um die hebräische Hervorhebung und parallele Struktur wiederzugeben.
