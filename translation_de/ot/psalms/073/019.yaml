  text: How they became a desolation in a moment! They came to an end[b][a]; they were consumed by terrors.
translation:
  language: de
  text: Wie sind sie doch in einem Augenblick zum Entsetzen geworden! Sie sind dahin, durch Schrecken völlig vernichtet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wie sind sie doch in einem Augenblick zur Verwüstung geworden! Sie sind vergangen, durch Schrecknisse völlig zugrunde gegangen.«'
    reason: שַׁמָּה kann sowohl den entsetzlichen Charakter des Untergangs als auch Verwüstung bezeichnen. Die parallelen Verben und die kausale beziehungsweise mittelbare Auffassung von מִן können im Deutschen unterschiedlich nuanciert werden.
lexical_decisions:
- source_word: אֵיךְ
  choice: Wie ... doch
  rationale: Gibt den Ausruf über den erschütternden Umschwung wieder, ohne daraus eine Informationsfrage zu machen.
- source_word: הָיוּ לְשַׁמָּה
  choice: sind ... zur Verwüstung geworden
  rationale: Die resultative Wendung bezeichnet den Übergang in einen Zustand völliger Verwüstung; zugleich bleibt der mögliche Beiklang eines schreckenerregenden Ruins erhalten.
- source_word: כְרָגַע
  choice: in einem Augenblick
  rationale: Gibt die idiomatische Zeitangabe und die Plötzlichkeit des Geschehens natürlich wieder.
- source_word: סָפוּ
  choice: Sie sind vergangen
  rationale: Bezeichnet ihr Ende, ohne eine bestimmte Art ihres Untergangs festzulegen.
- source_word: תַמּוּ
  choice: völlig aufgerieben
  rationale: Wahrt die verstärkende Parallelität zum vorangehenden Verb und bringt die vollständige Vernichtung zum Ausdruck.
- source_word: מִן בַּלָּהוֹת
  choice: von Schrecken
  rationale: Versteht מִן im Kontext als wirksame Ursache; בַּלָּהוֹת bezeichnet überwältigende Schrecken oder Schrecknisse.
