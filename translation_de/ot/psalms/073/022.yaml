  text: Da war ich töricht und verstand nichts; wie ein Tier[a] war ich bei dir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Tiere“; wahrscheinlich eine verstärkende oder zusammenfassende Ausdrucksweise im Sinn von „wie ein Tier“ oder „tierhaft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Da war ich
  rationale: Das Waw verbindet das Bekenntnis mit der vorangehenden Rückschau. „Da“ gibt diesen folgernden, rückblickenden Zusammenhang im Deutschen natürlich wieder.
- source_word: בַעַר
  choice: unvernünftig
  rationale: Das Wort bezeichnet einen stumpfen, tierhaft verständnislosen Zustand. „Unvernünftig“ bewahrt diesen Sinn in würdiger, allgemein verständlicher Sprache, ohne die unnötige Schärfe von „dumm“.
- source_word: וְלֹא אֵדָע
  choice: und wusste nichts
  rationale: ידע ist das gewöhnliche Verb für „wissen/erkennen“. Die Form bezeichnet hier rückblickend den damaligen Mangel an Einsicht; „wusste nichts“ ist knapp und idiomatisch.
- source_word: בְּהֵמוֹת
  choice: wie ein Tier
  rationale: Die Form ist morphologisch pluralisch („Tiere“), wird hier aber wahrscheinlich intensiv oder kollektiv gebraucht. Die deutsche Vergleichsform „wie ein Tier“ vermittelt die gemeinte tierhafte Verständnislosigkeit natürlich.
- source_word: הָיִיתִי
  choice: war ich
  rationale: Die Form beschreibt den damaligen Zustand des Psalmisten, nicht ausdrücklich ein Werden.
- source_word: עִמָּךְ
  choice: bei dir
  rationale: Die Präposition עם bedeutet grundsätzlich „mit/bei“. „Bei dir“ bewahrt den Gedanken, dass der Psalmist trotz seiner Verständnislosigkeit in Gottes Nähe war, und vermeidet die interpretativere Wiedergabe „vor dir“.
theological_decisions:
- issue: Aussagekraft des Tiervergleichs im Selbstbekenntnis vor Gott
  choice: „wie ein Tier war ich bei dir“ als Vergleich für die eigene Verständnislosigkeit
  alternative: „wie ein unvernünftiges Tier war ich vor dir“ oder die formal pluralische Wiedergabe „Tiere war ich bei dir“
  rationale: Der Vers bekennt demütig die fehlende Einsicht des Psalmisten. Die gewählte Fassung erhält die Schärfe des Bildes, ohne daraus eine allgemeine Lehraussage über das Wesen des Menschen zu machen oder die Gottesbeziehung durch „vor dir“ näher auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt knapp und bekenntnishaft; „bei dir“ folgt der Grundbedeutung der hebräischen Präposition und erhält die Spannung, dass der Psalmist selbst in seiner Verständnislosigkeit bei Gott war.
