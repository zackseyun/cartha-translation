  text: With your counsel you guide me[a], and afterward you will receive me to glory.
translation:
  language: de
  text: Mit deinem Rat wirst du mich leiten, und danach wirst du mich in Herrlichkeit aufnehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und danach wirst du mich mit Ehren aufnehmen.“'
    reason: Alternative syntaktische und lexikalische Deutung von כָּבוֹד.
lexical_decisions:
- source_word: בַּעֲצָתְךָ
  choice: nach deinem Rat
  rationale: עֵצָה bezeichnet Rat, Ratschluss oder Plan. Das präfigierte ב kann hier die maßgebliche Orientierung ausdrücken; „nach deinem Rat“ ist natürliches Deutsch und lässt sowohl Gottes Weisung als auch seinen Ratschluss anklingen.
- source_word: תַנְחֵנִי
  choice: leitest du mich
  rationale: Der Hifil von נחה bedeutet „führen, leiten“. „Leiten“ verbindet sich im Deutschen idiomatisch mit „Rat“ und bewahrt das Bild göttlicher Führung.
- source_word: וְאַחַר
  choice: und danach
  rationale: אַחַר ist hier zeitlich beziehungsweise adverbial gebraucht. „Danach“ gibt die Abfolge knapp und gegenwärtig verständlich wieder.
- source_word: כָּבוֹד
  choice: Herrlichkeit
  rationale: כָּבוֹד kann „Herrlichkeit“ oder „Ehre“ bedeuten. „Herrlichkeit“ bewahrt den erhabenen und möglicherweise eschatologischen Klang, ohne ihn im Haupttext weiter auszudeuten.
- source_word: תִּקָּחֵנִי
  choice: nimmst du mich … auf
  rationale: לקח bedeutet „nehmen“ und kann je nach Zusammenhang auch ein Aufnehmen bezeichnen. „Aufnehmen“ ist im Deutschen in dieser kompakten Wendung natürlich, während das Präsens aufgrund der hebräischen Verbform als zukunftsoffen verstanden werden kann.
theological_decisions:
- issue: Deutung von אַחַר כָּבוֹד תִּקָּחֵנִי
  choice: „und danach nimmst du mich in Herrlichkeit auf“
  alternative: „und danach nimmst du mich mit Ehren auf“
  rationale: Die knappe hebräische Fügung lässt offen, ob כָּבוֹד Ziel beziehungsweise Bereich des Aufnehmens oder die Art des Aufnehmens bezeichnet. Der Haupttext gibt die Lesart „in Herrlichkeit“ wieder; die Fußnote erhält die ebenso mögliche Bedeutung „mit Ehren“ und vermeidet damit eine dogmatische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelbewegung von gegenwärtiger Führung zu anschließendem Aufnehmen bleibt erhalten; die Mehrdeutigkeit von כָּבוֹד wird durch die Fußnote sichtbar gemacht.
