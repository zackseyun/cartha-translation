base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/004.yaml
  text: For they have no pains until death, and their body is fat.
translation:
  language: de
  text: Denn bei ihrem Tod haben sie keine Qualen[a], und ihr Leib ist wohlgenährt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Denn bis zu ihrem Tod haben sie keine Qualen.'
    reason: לְמוֹתָם kann sich auf den Todesvorgang („bei ihrem Tod“) oder auf den Zeitpunkt als Grenze („bis zu ihrem Tod“) beziehen.
  - marker: b
    text: Die Bedeutung des hebräischen Wortes für „Leib“ ist unsicher; es kann auch „Bauch“ oder allgemein „Körper“ bedeuten.
    reason: אוּלָם ist selten und seine genaue Bedeutung an dieser Stelle ist lexikalisch unsicher.
lexical_decisions:
- source_word: חַרְצֻבּוֹת
  choice: Qualen
  rationale: Das seltene Wort bezeichnet hier wahrscheinlich Schmerzen oder quälende Beschwerden. „Qualen“ gibt den negativen Sinn natürlich wieder, ohne ihn auf Geburtswehen oder eine bestimmte Krankheit einzuengen.
- source_word: לְמוֹתָם
  choice: bis zu ihrem Tod
  rationale: Die Präposition לְ kann in diesem Zusammenhang auf den Endpunkt „bis zum Tod“ bezogen werden; diese Deutung entspricht dem Parallelgedanken eines ungestörten Wohlergehens, bleibt jedoch textlich mehrdeutig.
- source_word: וּבָרִיא אוּלָם
  choice: und ihr Leib ist wohlgenährt
  rationale: בָּרִיא bedeutet „fett, kräftig, wohlgenährt“. אוּלָם ist an dieser Stelle selten und wohl als Bezeichnung des Körpers beziehungsweise Leibes zu verstehen. „Wohlgenährt“ bewahrt den antiken positiven Beiklang körperlicher Fülle besser als das heute meist abwertende „fett“.
theological_decisions:
- issue: Art und Dauer des Wohlergehens der Frevler
  choice: „bis zu ihrem Tod“ als Aussage, dass sie während ihres Lebens von Qualen verschont erscheinen
  alternative: „bei ihrem Tod“ beziehungsweise „ihr Tod kennt keine Qualen“
  rationale: Der hebräische Ausdruck lässt sowohl eine zeitliche Grenze als auch einen Bezug auf den Todesvorgang zu. Die Hauptfassung folgt der kontextuell plausiblen und in der Konsultationsfassung vertretenen Deutung, während die Alternative in einer Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist gut verständlich und bewahrt durch Fußnoten die beiden wesentlichen lexikalischen Unsicherheiten des schwierigen hebräischen Verses.
