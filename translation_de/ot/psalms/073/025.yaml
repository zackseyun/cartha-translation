source:
  edition: WLC
  text: מִי לִ֥/י בַ/שָּׁמָ֑יִם וְ֝/עִמְּ/ךָ֗ לֹא חָפַ֥צְתִּי בָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/025.yaml
  text: Whom have I in heaven but you? And besides you[a], I desire nothing on earth.
translation:
  language: de
  text: Wen habe ich im Himmel außer dir? Und neben dir[a] begehre ich nichts auf der Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und mit dir habe ich auf der Erde nichts begehrt.“ Der hebräische Wortlaut ist elliptisch; im Zusammenhang ist wohl gemeint, dass der Beter außer Gott nichts auf der Erde begehrt.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי לִי
  choice: Wen habe ich
  rationale: Die Verbindung aus dem Fragepronomen und לִי bezeichnet hier idiomatisch eine Zugehörigkeits- beziehungsweise Besitzrelation. „Wen habe ich“ ist im Deutschen natürlich und bewahrt die rhetorische Frage.
- source_word: בַשָּׁמָיִם
  choice: im Himmel
  rationale: Der hebräische Plural bezeichnet hier den himmlischen Bereich; „im Himmel“ ist die übliche deutsche Wiedergabe und bildet den Gegensatz zur Erde.
- source_word: וְעִמְּךָ
  choice: Und neben dir
  rationale: Wörtlich steht „und mit dir“. Im poetischen Parallelismus drückt die Wendung Ausschließlichkeit aus; „neben dir“ gibt diesen Sinn wieder, ohne die Ellipse völlig aufzulösen.
- source_word: לֹא חָפַצְתִּי
  choice: begehre ich nichts
  rationale: חפץ kann „begehren“, „Gefallen haben“ oder „sich freuen an“ bedeuten. Hier passt „begehren“ zur ausschließlichen Hinwendung zu Gott. Das Perfekt beschreibt eine gefestigte Haltung und wird daher präsentisch wiedergegeben.
- source_word: בָאָרֶץ
  choice: auf der Erde
  rationale: Gemeint ist im Gegensatz zum Himmel der irdische Bereich. „Auf der Erde“ bewahrt diesen räumlichen Parallelismus.
theological_decisions:
- issue: Sinn des zweiten Versglieds
  choice: Neben Gott begehrt der Beter nichts auf der Erde.
  alternative: „Und mit dir habe ich auf der Erde nichts begehrt.“
  rationale: Der hebräische Wortlaut ist elliptisch und lässt die genaue Beziehung von וְעִמְּךָ zum übrigen Satz offen. Die Hauptfassung macht die im Parallelismus naheliegende Ausschließlichkeit verständlich; die Fußnote bewahrt die formnähere Lesart und damit die syntaktische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Parallelstruktur und der Gegensatz zwischen Himmel und Erde bleiben erhalten; die Ellipse des zweiten Versglieds wird in einer Fußnote kenntlich gemacht.
