source:
  edition: WLC
  text: אִם אָ֭מַרְתִּי אֲסַפְּרָ֥ה כְמ֑וֹ הִנֵּ֤ה ד֭וֹר בָּנֶ֣י/ךָ בָגָֽדְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/015.yaml
  text: If I had said[a], “I will speak thus,” behold, I would have betrayed the generation of your children.
translation:
  language: de
  text: 'Hätte ich gesagt: »Ich will so reden«, siehe – dann hätte ich das Geschlecht deiner Kinder[a] verraten.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „deiner Söhne“.'
    reason: Die hebräische Form ist maskuliner Plural; im Kontext kann sie die gesamte Gott zugehörige Gemeinschaft bezeichnen.
  - marker: b
    text: 'Oder: „hätte ich am Geschlecht deiner Kinder treulos gehandelt“.'
    reason: בגד bezeichnet treuloses bzw. verräterisches Handeln; die präpositionale deutsche Alternative macht die relationale Bedeutung ausdrücklich.
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: Hätte ich gesagt
  rationale: Die Verbindung aus אִם und dem Qal Perfekt bezeichnet hier im Zusammenhang eine nicht verwirklichte, erwogene Bedingung. Der deutsche Konjunktiv II gibt diese rückblickende Hypothese natürlich wieder.
- source_word: אֲסַפְּרָה כְמוֹ
  choice: Ich will so reden
  rationale: ספר bedeutet grundsätzlich erzählen, berichten oder aussprechen; mit כְמוֹ verweist es hier auf die zuvor geäußerte Denk- und Redeweise. „So reden“ ist im Deutschen natürlich und lässt den Rückbezug offen.
- source_word: הִנֵּה
  choice: sieh
  rationale: „Sieh“ bewahrt das emphatische Innehalten und die plötzliche Einsicht des hebräischen Ausdrucks, ohne ihn zu einem bloßen logischen Bindewort abzuschwächen.
- source_word: דּוֹר
  choice: Generation
  rationale: „Generation“ entspricht der kollektiven und zeitbezogenen Bedeutung von דּוֹר und bewahrt die gemeinschaftliche Aussage.
- source_word: בָּנֶיךָ
  choice: deiner Kinder
  rationale: Die Form ist wörtlich „deiner Söhne“, bezeichnet hier aber wahrscheinlich Gottes Volk als die ihm zugehörige Gemeinschaft. „Kinder“ gibt diesen umfassenden Bezug im Deutschen angemessen wieder; die formale Alternative wird in einer Fußnote genannt.
- source_word: בָגָדְתִּי
  choice: hätte ich … verraten
  rationale: בגד bezeichnet treuloses oder verräterisches Handeln. „Verraten“ ist prägnant und idiomatisch; der Konjunktiv nimmt die irreale Bedingung auf.
theological_decisions:
- issue: Bezug von „deiner Kinder“
  choice: Die Anrede gilt Gott; gemeint ist die ihm zugehörige Gemeinschaft.
  alternative: „deine Söhne“ als formal engere Wiedergabe der maskulinen Pluralform
  rationale: Der Kontext handelt davon, dass ein öffentliches Aussprechen der Zweifel der glaubenden Gemeinschaft geschadet und ihr gegenüber Treulosigkeit bedeutet hätte. Die umfassende Wiedergabe „Kinder“ schließt die wörtliche Form „Söhne“ nicht aus und wird deshalb durch eine Fußnote transparent gemacht.
- issue: Art der Treulosigkeit
  choice: „verraten“ als relationale Untreue gegenüber Gottes Volk
  alternative: „an … treulos gehandelt“
  rationale: Das hebräische Verb lässt sowohl Verrat als auch allgemeineres treuloses Handeln anklingen. Der Haupttext wählt die natürliche, kräftige Formulierung; die Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe direkte Rede und das emphatische „sieh“ erhalten die rhetorische Spannung des Verses; der Konjunktiv II bildet die nicht verwirklichte Bedingung idiomatisch ab.
