  yaml_path: translation/ot/psalms/073/021.yaml
  text: For my heart was embittered[a], and my kidneys were pierced.
translation:
  language: de
  text: Denn mein Herz war verbittert, und ich wurde in meinen Nieren durchbohrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die „Nieren“ stehen im Hebräischen bildhaft für das tiefste Innere, besonders für Empfindungen und Gewissen. Die seltene Verbform bezeichnet ein scharfes inneres Getroffensein; auch möglich: „und ich wurde in meinem Innersten getroffen“.'
    reason: Erläutert das hebräische Körperbild und kennzeichnet die idiomatischere Wiedergabe der seltenen Verbform als Alternative, ohne sie in den Haupttext einzutragen.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang eine Begründung oder Erklärung für das zuvor Gesagte ein.
- source_word: יִתְחַמֵּץ
  choice: war verbittert
  rationale: Das Hitpael von חמץ bezeichnet hier bildhaft ein inneres Sauer- oder Bitterwerden; »war verbittert« gibt den emotionalen Sinn natürlich wieder.
- source_word: לְבָבִי
  choice: mein Herz
  rationale: Bewahrt die hebräische Bezeichnung für das innere Selbst, Denken und Empfinden.
- source_word: וְכִלְיוֹתַי
  choice: in meinen Nieren
  rationale: כִּלְיָה bezeichnet wörtlich die Nieren und bildlich das tiefste Innere. Der konkrete Körperbegriff bleibt erhalten, während die Fußnote die Bildbedeutung erläutert.
- source_word: אֶשְׁתּוֹנָן
  choice: fühlte ich stechenden Schmerz
  rationale: Die seltene Form beschreibt ein scharfes inneres Getroffensein oder Durchbohrtwerden. Die Formulierung bewahrt das Stichmotiv, vermeidet aber im Deutschen die missverständliche Vorstellung, die Nieren selbst seien das grammatische Subjekt.
theological_decisions:
- issue: Verhältnis von Körperbild und innerem Erleben
  choice: Das konkrete Nierenbild im Haupttext bewahren und seine übertragene Bedeutung erklären.
  alternative: »mein Innerstes war verwundet«
  rationale: So bleibt die hebräische Anthropologie sichtbar, ohne die emotionale Bedeutung konfessionell oder psychologisch zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die erste Zeile bleibt nah am Bitterkeitsbild; die zweite macht das seltene hebräische Verb idiomatisch verständlich und erhält zugleich das konkrete Bild der Nieren.
