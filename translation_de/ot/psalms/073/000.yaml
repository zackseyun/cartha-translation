base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/000.yaml
  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to the pure of heart.
translation:
  language: de
  text: 'Ein Psalm Asafs.[a]


    Ja, Gott ist gut zu Israel,

    zu denen, die reinen Herzens sind.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Zuordnungsformel kann auch anders verstanden werden; sie legt die genaue Art der Beziehung zu Asaf nicht fest.
    reason: Die Präposition לְ kann verschiedene Arten der Zuordnung ausdrücken; die Fußnote wahrt diese Offenheit ohne eine spezifische historische Deutung einzutragen.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psalm
  rationale: Die übliche und sachgerechte deutsche Wiedergabe der Gattungsbezeichnung für ein von Musik begleitetes Lied.
- source_word: לְאָסָף
  choice: Asafs
  rationale: Der Genitiv gibt die naheliegende Zuordnung zu Asaf knapp und idiomatisch wieder; die Präposition לְ lässt die genauere Art der Zuordnung jedoch offen, was in einer Fußnote vermerkt wird.
- source_word: אַךְ
  choice: Ja
  rationale: Am Anfang der Aussage wirkt die Partikel bekräftigend. „Ja“ ist im Deutschen natürlich und lässt sich als nachdrückliche Bestätigung verstehen, ohne einen im unmittelbaren Text nicht ausdrücklich vorhandenen Gegensatz einzuführen.
- source_word: טוֹב ... אֱלֹהִים
  choice: Gott ist gut
  rationale: Bewahrt die einfache Prädikatsaussage des Hebräischen und ihre theologische Spannung zum weiteren Verlauf des Psalms.
- source_word: לְיִשְׂרָאֵל
  choice: zu Israel
  rationale: Gibt die relationale Bedeutung der Präposition לְ in idiomatischem Deutsch wieder.
- source_word: לְבָרֵי לֵבָב
  choice: zu denen, die reinen Herzens sind
  rationale: „Reinen Herzens“ bewahrt das hebräische Bild und bezeichnet Menschen mit innerer Lauterkeit; die Ergänzung „zu denen, die … sind“ macht den Bezug im Deutschen klar.
theological_decisions:
- issue: Verhältnis zwischen „Israel“ und „denen, die reinen Herzens sind“
  choice: Die zweite Wendung wird als nähere Bestimmung beziehungsweise parallele Beschreibung der Empfänger von Gottes Güte wiedergegeben.
  alternative: Die beiden Wendungen könnten als zwei stärker voneinander getrennte Gruppen gelesen werden.
  rationale: Die parallelen לְ-Wendungen stehen unmittelbar nebeneinander. Die Übersetzung lässt offen, ob die zweite Gruppe ganz mit Israel gleichgesetzt oder als dessen geistlich qualifizierter Teil verstanden wird, und fügt keine konfessionelle Deutung hinzu.
- issue: Bekräftigende oder einschränkende Funktion von אַךְ
  choice: 'Bekräftigend: „Ja“'
  alternative: „Doch“, „nur“ oder „gewiss“
  rationale: Als Psalmeröffnung formuliert אַךְ hier am natürlichsten eine nachdrückliche Grundüberzeugung. „Ja“ bewahrt die Bekräftigung, während die Spannung zu den folgenden Versen bestehen bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Überschrift bleibt vom Verssatz abgesetzt; der poetische Parallelismus wird durch den Zeilenumbruch sichtbar gemacht.
