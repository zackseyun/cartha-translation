  text: Ja, auf schlüpfrigem Boden stellst du sie[a]; du stürzt sie ins Verderben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an/in glatten Stellen“; auch möglich: „auf glattem Boden“.'
