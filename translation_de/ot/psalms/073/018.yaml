lexical_decisions:
- source_word: אַךְ
  choice: Ja
  rationale: Die Partikel leitet hier die nachdrückliche Gewissheit ein, zu der der Beter gelangt ist; „Ja“ gibt diesen bekräftigenden und korrigierenden Ton natürlich wieder.
- source_word: בַּחֲלָקוֹת
  choice: auf schlüpfrigen Grund
  rationale: Das Substantiv bezeichnet wörtlich glatte Stellen. Im Zusammenhang mit dem folgenden Sturz vermittelt „schlüpfriger Grund“ das Bild unsicheren Standes klar und idiomatisch.
- source_word: תָּשִׁית לָמוֹ
  choice: stellst du sie
  rationale: שׁית bedeutet „setzen, stellen, platzieren“. Die Form spricht Gott direkt an und bezeichnet sein Handeln an ihnen.
- source_word: הִפַּלְתָּם
  choice: du stürzt sie
  rationale: 'Der Hifil von נפל ist kausativ: Gott bewirkt ihren Fall. „Du stürzt sie“ bewahrt die direkte göttliche Verursachung und passt zum gehobenen poetischen Register.'
- source_word: לְמַשּׁוּאוֹת
  choice: ins Verderben
  rationale: Das Wort bezeichnet Verwüstungen, Trümmer oder Untergang. „Ins Verderben“ ist im Deutschen natürlich und gibt den Ziel- beziehungsweise Ergebnischarakter der Präposition wieder; die konkretere Bildsprache wird in der Fußnote bewahrt.
theological_decisions:
- issue: Göttliches Handeln beim Sturz der Frevler
  choice: 'Die beiden Aussagen werden als unmittelbares Handeln Gottes wiedergegeben: „stellst du sie“ und „du stürzt sie“.'
  alternative: Eine abgeschwächte Formulierung, nach der sie lediglich auf schlüpfrigem Grund stehen oder von selbst fallen.
  rationale: Die hebräischen Verben stehen in der zweiten Person Singular und sprechen Gott ausdrücklich als Handelnden an. Die Übersetzung bewahrt diese theologische Spannung, statt die göttliche Verursachung abzuschwächen.
translation_notes:
  register: Moderne, würdige Psalmsprache mit knapper Parallelstruktur. Die vorangestellte Ortsangabe betont das Bild des gefährlichen Standorts; direkte Anrede und göttliche Handlung bleiben unverändert erhalten.
