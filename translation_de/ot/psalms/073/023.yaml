  text: וַ/אֲנִ֣י תָמִ֣יד עִמָּ֑/ךְ אָ֝חַ֗זְתָּ בְּ/יַד יְמִינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/023.yaml
  text: Yet I am continually with you[a]; you have held my right hand.
translation:
  language: de
  text: Doch ich bin immer bei dir; du hast meine rechte Hand ergriffen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast meine rechte Hand festgehalten.“ Das hebräische Verb kann sowohl das Ergreifen als auch das daraus folgende Festhalten und Stützen hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Doch ich
  rationale: Die Verbindung aus Konjunktion und Pronomen setzt den Beter in einen deutlichen Gegensatz zum zuvor geschilderten Zustand und zu seiner früheren Verwirrung.
- source_word: תָמִיד
  choice: immer
  rationale: Das Wort bezeichnet ununterbrochene beziehungsweise fortdauernde Nähe; „immer“ ist im Deutschen natürlich, klar und dem poetischen Ton angemessen.
- source_word: עִמָּךְ
  choice: bei dir
  rationale: Die Präposition bezeichnet Gemeinschaft oder Nähe. „Bei dir“ gibt dies im Deutschen idiomatisch wieder, ohne die Aussage zu erweitern.
- source_word: אָחַזְתָּ
  choice: du hast … ergriffen
  rationale: Das Verb kann sowohl den Akt des Ergreifens als auch das daraus folgende Festhalten und Stützen bezeichnen. Das Perfekt wird als geschehene Handlung mit fortdauernder Bedeutung wiedergegeben.
- source_word: בְּיַד יְמִינִי
  choice: meine rechte Hand
  rationale: Mit אָחַז bezeichnet die Präpositionalgruppe das Ergriffene. Die deutsche Konstruktion „jemandes Hand ergreifen“ gibt das konkrete Bild natürlich wieder.
theological_decisions:
- issue: Aspekt und Aussage göttlicher Unterstützung im hebräischen Perfekt
  choice: du hast meine rechte Hand ergriffen
  alternative: du hältst meine rechte Hand / du nahmst meine rechte Hand
  rationale: Die Form bezeichnet eine vollzogene Handlung, deren Wirkung im Zusammenhang fortbesteht. Die Übersetzung bewahrt sowohl das vorausliegende Ergreifen als auch die darin liegende bleibende Unterstützung, ohne die Aussage ausschließlich auf Vergangenheit oder Gegenwart festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzführung. „Doch“ macht den kontextuellen Gegensatz sichtbar; „bei dir“ und „meine rechte Hand ergriffen“ bleiben anschaulich und allgemein verständlich.
