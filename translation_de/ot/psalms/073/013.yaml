lexical_decisions:
- source_word: אַךְ
  choice: Ja
  rationale: Die Partikel bekräftigt hier die ernüchterte Schlussfolgerung des Beters; „Ja“ gibt diesen nachdrücklichen, reflektierenden Ton im Deutschen natürlich wieder.
- source_word: רִיק
  choice: vergeblich
  rationale: Das Wort bezeichnet Ergebnislosigkeit oder vermeintliche Nutzlosigkeit. „Vergeblich“ passt prägnant in den Klagezusammenhang; die mögliche Nuance „umsonst“ bleibt in einer Fußnote erhalten.
- source_word: זִכִּיתִי
  choice: habe ... rein gehalten
  rationale: Die Verbform bezeichnet hier das Reinhalten beziehungsweise Reinigen. Mit „Herz“ als Objekt drückt „rein gehalten“ die fortgesetzte moralische Ausrichtung idiomatisch aus und bewahrt den Gegenwartsbezug des Perfekts.
- source_word: לְבָבִי
  choice: mein Herz
  rationale: „Herz“ bezeichnet im poetischen Zusammenhang das innere, moralische und willentliche Zentrum des Menschen und ist im Deutschen verständlich.
- source_word: וָאֶרְחַץ
  choice: und ... gewaschen
  rationale: Die Form führt die parallele Handlung fort. „Gewaschen“ bewahrt das konkrete Bild des hebräischen Ausdrucks.
- source_word: בְּנִקָּיוֹן
  choice: in Unschuld
  rationale: Der Ausdruck kann Reinheit oder Unschuld bezeichnen. „In Unschuld“ erhält die ethische Bedeutung und die biblisch-poetische Wendung vom Waschen der Hände.
- source_word: כַּפָּי
  choice: meine Hände
  rationale: Wörtlich sind die Handflächen gemeint; im Deutschen bezeichnet „Hände“ das Bild idiomatisch und vollständig.
theological_decisions:
- issue: Moralische oder rituelle Reinheit
  choice: Das Bild des Händewaschens wird als Ausdruck moralischer Unschuld wiedergegeben, ohne das konkrete Waschbild aufzulösen.
  alternative: Die Aussage könnte vorwiegend auf rituelle Reinheit bezogen werden.
  rationale: Die Parallelstellung von Herz und Händen sowie der Klagezusammenhang sprechen für eine ethische Bedeutung. Die Übersetzung bewahrt zugleich die aus dem Reinheitsbereich stammende Metapher.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrtem poetischem Parallelismus. „Ja“ klingt nachdrücklich, ohne altertümlich zu wirken; „in Unschuld gewaschen“ erhält das biblische Bild.
