  text: Surely in vain I have kept my heart pure[b][a], and washed my hands in innocence.
translation:
  language: de
  text: Gewiss, vergeblich[a] habe ich mein Herz rein gehalten und meine Hände in Unschuld gewaschen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „umsonst“.'
    reason: lexical_alternative
  - marker: b
    text: Das Waschen der Hände „in Unschuld“ verwendet ein konkretes Waschbild als Ausdruck von Unschuld und Reinheit.
