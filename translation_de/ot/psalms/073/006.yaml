base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/006.yaml
  text: Therefore pride is their necklace[a]; violence covers them like a garment.
translation:
  language: de
  text: Darum ist Hochmut ihre Halskette[a]; Gewalt umhüllt sie wie ein Gewand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Darum schmückt sie der Hochmut wie eine Halskette; Gewalt hüllt sie wie ein Gewand ein.“'
    reason: Das knappe Hebräisch lässt sich entweder als prädikative Aussage oder mit ausdrücklich verbal entfaltetem Schmuckbild wiedergeben.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Aussage als Folge der vorausgehenden Beschreibung und stellt den Zusammenhang im Deutschen natürlich her.
- source_word: עֲנָקַתְמוֹ
  choice: ist ihre Halskette
  rationale: Die Form bezeichnet einen Halsschmuck mit pronominalem Bezug auf die Frevler; die prädikative Wiedergabe erhält das knappe Bild.
- source_word: גַאֲוָה
  choice: Hochmut
  rationale: Im Kontext ist selbstüberhebliches, moralisch verwerfliches Verhalten gemeint; „Hochmut“ gibt diese negative Bedeutung präzise wieder.
- source_word: יַעֲטָף
  choice: umhüllt
  rationale: Das Verb bezeichnet ein Einhüllen oder Umwickeln und bewahrt das parallel zur Halskette stehende Kleidungsbild.
- source_word: שִׁית
  choice: wie ein Gewand
  rationale: Das seltene Substantiv bezeichnet hier eine Bekleidung oder Hülle; „wie ein Gewand“ macht die im Hebräischen knappe Metapher im Deutschen verständlich.
- source_word: חָמָס
  choice: Gewalt
  rationale: Das Wort bezeichnet Gewalt und gewaltsames Unrecht; „Gewalt“ ist hier die direkte und natürliche Entsprechung.
- source_word: לָמוֹ
  choice: sie
  rationale: Die Pronominalform bezieht sich auf die zuvor beschriebenen Frevler und wird in der deutschen Konstruktion als Objekt von „umhüllt“ wiedergegeben.
