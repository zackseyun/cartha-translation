  text: כִּֽי קִ֭נֵּאתִי בַּֽ/הוֹלְלִ֑ים שְׁל֖וֹם רְשָׁעִ֣ים אֶרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/003.yaml
  text: For I was envious of the arrogant when I saw the peace of the wicked[a].
translation:
  language: de
  text: Denn ich beneidete die Überheblichen, als ich sah, wie gut es den Gottlosen ging.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: als ich den Frieden der Gottlosen sah. Das hebräische Wort kann auch Wohlergehen oder Gedeihen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorherige Aussage des Psalmisten ein und bewahrt den kausalen Zusammenhang.
- source_word: קִנֵּאתִי
  choice: ich beneidete
  rationale: Gibt קנא hier als Neid auf das Wohlergehen anderer wieder; „eifersüchtig“ könnte im heutigen Deutsch Besitzansprüche nahelegen.
- source_word: בַּהוֹלְלִים
  choice: die Überheblichen
  rationale: Bezeichnet Menschen, deren Haltung von Prahlerei und Hochmut geprägt ist; „Überhebliche“ klingt im Deutschen natürlich und erfasst den moralischen Sinn.
- source_word: שְׁלוֹם
  choice: wie gut es … ging
  rationale: שָׁלוֹם bezeichnet hier angesichts des Kontexts das sichtbare Wohlergehen und ungestörte Gedeihen der Gottlosen, nicht lediglich die Abwesenheit von Streit.
- source_word: רְשָׁעִים
  choice: die Gottlosen
  rationale: Etablierter Ausdruck für die moralisch Schuldigen bzw. Frevler in Psalmen und Weisheitsliteratur; er bezeichnet hier eine ethisch-religiöse Kategorie.
- source_word: אֶרְאֶה
  choice: als ich sah
  rationale: Der Imperfekt steht hier in Beziehung zum vorangehenden Perfekt und bezeichnet den Anlass des Neides; die temporale Wiedergabe ist im Deutschen idiomatisch.
theological_decisions:
- issue: Bedeutungsumfang von שָׁלוֹם
  choice: Im Haupttext als sichtbares Wohlergehen wiedergegeben
  alternative: „Frieden“
  rationale: Der Vers thematisiert das scheinbar sorgenfreie Gedeihen der Gottlosen. Die Fußnote bewahrt die wörtlichere Alternative und damit den weiteren Bedeutungsumfang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem begründenden und zeitlichen Zusammenhang des Hebräischen, während die idiomatische Wiedergabe von שָׁלוֹם den Kontext verständlich macht.
