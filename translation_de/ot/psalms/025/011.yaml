id: PSA.25.11
reference: Psalms 25:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְמַֽעַן שִׁמְ/ךָ֥ יְהוָ֑ה וְֽ/סָלַחְתָּ֥ לַ֝/עֲוֺנִ֗/י כִּ֣י רַב הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/011.yaml
  text: For the sake of your name[a], O Yahweh, forgive my iniquity[b], for it is great.
translation:
  language: de
  text: Um deines Namens willen, Jahwe, vergib mir meine Schuld[a], denn sie ist groß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann das schuldhafte Vergehen, die Schuld oder deren Last und Folgen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: um ... willen
  rationale: Die Wendung bezeichnet den Beweggrund bzw. die Grundlage der Bitte und entspricht dem hebräischen Appell an Gottes Namen.
- source_word: שִׁמְךָ
  choice: deines Namens
  rationale: Die konkrete Rede vom Namen bleibt erhalten; gemeint sind zugleich Gottes offenbarer Charakter und seine Ehre.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְסָלַחְתָּ
  choice: vergib
  rationale: Obwohl formal eine mit waw verbundene Perfektform vorliegt, funktioniert sie im Gebetszusammenhang als Bitte. Der deutsche Imperativ gibt dies natürlich wieder.
- source_word: לַעֲוֺנִי
  choice: mir meine Schuld
  rationale: עָוֹן umfasst Verfehlung, Schuld und deren Last. Mit „meine Schuld“ bleiben moralische Tat und Schuldhaftigkeit im Deutschen offen; das vom Verb geforderte Dativobjekt „mir“ wird idiomatisch ergänzt.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt hier die Begründung der Bitte ein.
- source_word: רַב הוּא
  choice: sie ist groß
  rationale: Das Pronomen greift die singuläre Schuld auf; רַב bezeichnet hier ihr großes Ausmaß, nicht eine zahlenmäßige Vielheit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von עָוֹן
  choice: Schuld
  alternative: Vergehen; Sünde; Missetat
  rationale: Das hebräische Wort kann sowohl das schuldhafte Unrecht als auch die daraus erwachsende Schuld oder Last bezeichnen. „Schuld“ bewahrt diese Spannung im Deutschen am besten, ohne ausschließlich die Tat oder nur ein subjektives Schuldgefühl zu bezeichnen.
- issue: Begründung der Vergebungsbitte
  choice: denn sie ist groß
  alternative: obwohl sie groß ist
  rationale: 'כִּי wird in seiner üblichen kausalen Funktion verstanden. Die auffällige theologische Spannung bleibt bestehen: Gerade das große Ausmaß der Schuld wird als Grund für die Bitte um Vergebung genannt.'
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Die feste Wendung „um deines Namens willen“ wahrt das biblische Bild und bleibt allgemein verständlich. Die direkte Anrede „Jahwe“ steht ohne zusätzliches „o“, da dies im heutigen Deutschen natürlicher klingt.
