id: PSA.25.15
reference: Psalms 25:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עֵינַ֣/י תָּ֭מִיד אֶל יְהוָ֑ה כִּ֤י הֽוּא יוֹצִ֖יא מֵ/רֶ֣שֶׁת רַגְלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/015.yaml
  text: My eyes are continually toward Yahweh[a], for he will bring my feet out of the net.
translation:
  language: de
  text: 'Meine Augen sind stets auf Jahwe gerichtet,

    denn er wird meine Füße aus dem Netz herausziehen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „denn er wird meine Füße aus dem Netz herausbringen“. Das hebräische Verb bewahrt das Bild, aus einer Verstrickung herausgebracht zu werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַי
  choice: Meine Augen
  rationale: Bewahrt das konkrete Bild des hebräischen Plurals mit Suffix der ersten Person Singular; „mein Blick“ wäre deutender.
- source_word: תָּמִיד
  choice: stets
  rationale: Drückt die fortdauernde, beständige Ausrichtung knapp und in natürlichem poetischem Deutsch aus.
- source_word: אֶל
  choice: auf … gerichtet
  rationale: Gibt zusammen mit „Augen“ die gerichtete Aufmerksamkeit idiomatisch wieder, ohne das Bild aufzulösen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen stehenden Gottesnamen in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כִּי
  choice: denn
  rationale: Kennzeichnet den folgenden Satz als Begründung für die beständige Hinwendung des Beters.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen wird natürlich wiedergegeben; eine Wiedergabe als „er selbst“ würde die Betonung im Deutschen möglicherweise übersteigern.
- source_word: יוֹצִיא
  choice: wird … herausziehen
  rationale: Der Hifil von יצא bezeichnet ein Herausbringen. „Herausziehen“ bewahrt im Deutschen das konkrete Bild der Befreiung aus einer Verstrickung.
- source_word: מֵרֶשֶׁת
  choice: aus dem Netz
  rationale: „Netz“ ist die konkrete Bedeutung und erhält das Bild einer Fangvorrichtung; „Falle“ wäre allgemeiner und stärker deutend.
- source_word: רַגְלָי
  choice: meine Füße
  rationale: Entspricht dem konkreten hebräischen Plural und bewahrt das körperliche Bild der Verstrickung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen ausdrücklich. „Jahwe“ bewahrt ihn, während „der HERR“ ihn durch einen traditionellen Titel ersetzt.
- issue: Zeit- und Aussagewert von יוֹצִיא
  choice: wird … herausziehen
  alternative: zieht … heraus
  rationale: Die Zukunftsform gibt die zuversichtliche Erwartung des Beters wieder. Eine präsentische Übersetzung ist bei hebräischen Imperfektformen möglich, würde hier aber die erwartete Rettung weniger deutlich ausdrücken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Zeilenführung. Das konkrete Bild von Augen, Füßen und Netz bleibt erhalten; die hebräische Metapher wird nicht zu „Vertrauen“ oder „Befreiung“ verallgemeinert.
