  terminology: „Jahwe“, „aufrichtig“ und „Sünder“ sind angemessen. „Jahwe“ folgt der vorgegebenen Wiedergabe des Tetragramms. Die Fußnote sollte die lexikalische Spannweite von יוֹרֶה erläutern, ohne eine zusätzliche Bestimmung des Weges einzutragen.
