  source_fidelity: 'Die Aussagefolge und die zentralen Begriffe sind zutreffend wiedergegeben: טוֹב und יָשָׁר bezeichnen Jahwes Güte und moralische Geradheit, עַל־כֵּן leitet die Folgerung ein, und חַטָּאִים sind „Sünder“. Die Hifil-Form יוֹרֶה zusammen mit בַּדָּרֶךְ verbindet Lehren mit Wegweisung. „Auf dem Weg“ kann im modernen Deutsch jedoch vorrangig einen räumlich-zeitlichen Begleitumstand („während sie unterwegs sind“) bezeichnen und bildet den gemeinten Weg als Inhalt bzw. Ziel der Belehrung nicht klar ab.'
