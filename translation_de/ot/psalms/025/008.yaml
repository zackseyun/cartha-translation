base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/008.yaml
  text: Good and upright is Yahweh[a]; therefore he instructs sinners in the way.
translation:
  language: de
  text: Gut und aufrichtig ist Jahwe; darum weist er Sündern den Weg.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lehrt er Sünder den Weg“. Das Verb kann „lehren“, „unterweisen“ oder „den Weg weisen“ bedeuten.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: טוֹב
  choice: gut
  rationale: Die Grundbedeutung bezeichnet hier moralische Güte und entspricht natürlich der parallelen Aussage „aufrichtig“.
- source_word: וְיָשָׁר
  choice: und aufrichtig
  rationale: Das Wort beschreibt moralische Geradheit und Rechtschaffenheit; „aufrichtig“ ist im Deutschen idiomatisch und bewahrt diese ethische Nuance.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַל כֵּן
  choice: darum
  rationale: Die Wendung kennzeichnet die Folgerung aus Jahwes Güte und Aufrichtigkeit.
- source_word: יוֹרֶה
  choice: unterweist
  rationale: Die Hifil-Form von ירה kann „lehren“, „unterweisen“ oder „den Weg weisen“ bedeuten. „Unterweist“ verbindet den lehrenden Sinn mit dem folgenden Wegbild.
- source_word: חַטָּאִים
  choice: Sünder
  rationale: Das substantivierte Pluralwort bezeichnet ohne Abschwächung Menschen, die sündigen.
- source_word: בַּדָּרֶךְ
  choice: auf dem Weg
  rationale: Die Formulierung bewahrt das Wegbild und lässt offen, ob der Weg als Bereich der Unterweisung oder stärker als deren Inhalt zu verstehen ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; die Umschrift bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von יוֹרֶה und בַּדָּרֶךְ
  choice: unterweist er Sünder auf dem Weg
  alternative: lehrt er Sünder den Weg / weist er Sündern den Weg
  rationale: Die hebräische Konstruktion lässt eine lehrende und eine wegweisende Nuance zu. Die Hauptfassung hält sich eng an die Präpositionalform und bewahrt diese Spannung; die Fußnote nennt idiomatische Alternativen.
translation_notes:
  register: Knappe, poetische Satzstellung mit vorangestellten Eigenschaften; modernes, würdiges Standarddeutsch. Das traditionelle Wegbild bleibt ohne die nicht ausdrücklich vorhandene Ergänzung „richtig“ erhalten.
