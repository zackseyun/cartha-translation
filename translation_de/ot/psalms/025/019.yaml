lexical_decisions:
- source_word: רְאֵה
  choice: Sieh … an
  rationale: Der Imperativ richtet sich im Gebet an Gott. „Sieh … an“ bewahrt den bittenden Charakter und klingt im modernen Deutschen natürlich.
- source_word: אוֹיְבַי
  choice: meine Feinde
  rationale: Die Konstruktion mit dem Suffix der 1. Person Singular wird klar und unmittelbar wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die Bitte ein.
- source_word: רָבּוּ
  choice: sie sind zahlreich
  rationale: Das Qal Perfekt beschreibt hier passend die große Zahl der Feinde; „zahlreich“ ist präzise und idiomatisch.
- source_word: וְשִׂנְאַת חָמָס
  choice: mit gewalttätigem Hass
  rationale: Die deutsche Fassung bewahrt den Nachdruck der hebräischen Nominalverbindung und den gewaltsamen beziehungsweise brutalen Charakter des Hasses.
- source_word: שְׂנֵאוּנִי
  choice: hassen sie mich
  rationale: Das Präsens gibt den fortdauernden feindseligen Zustand im Klagegebet angemessen wieder; die Wiederholung von „Hass“ und „hassen“ spiegelt die hebräische Ausdrucksweise.
