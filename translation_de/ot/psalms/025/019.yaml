  language: de
  text: Sieh meine Feinde an, denn sie sind zahlreich, und mit gewalttätigem Hass hassen sie mich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und Hass der Gewalt hassen sie mich“. Die hebräische Wendung betont den gewalttätigen, erbarmungslosen Charakter ihres Hasses.'
