  text: זְכֹר רַחֲמֶ֣י/ךָ יְ֭הוָה וַ/חֲסָדֶ֑י/ךָ כִּ֖י מֵ/עוֹלָ֣ם הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/006.yaml
  text: Remember your mercies[a], O Yahweh, and your steadfast love[c][b], for they are from of old.
translation:
  language: de
  text: Denk an dein Erbarmen[a], Yahweh, und an deine beständige Liebe[b], denn sie sind von alters her[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Mitgefühl“; im Hebräischen steht eine Mehrzahlform.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht „deine beständigen Liebeserweisungen“ in der Mehrzahl.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „von Ewigkeit her“. Der hebräische Ausdruck kann ferne Vorzeit oder immerwährende Dauer bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: זְכֹר
  choice: Denk an
  rationale: Der Qal-Imperativ richtet eine unmittelbare Bitte an Gott. „Denk an“ ist im modernen Deutschen natürlich und bewahrt den Gebetscharakter.
- source_word: רַחֲמֶיךָ
  choice: dein Erbarmen
  rationale: Der hebräische Plural bezeichnet Gottes vielfaches beziehungsweise reiches Mitgefühl; das deutsche Kollektivum „Erbarmen“ gibt dies natürlicher wieder als ein ungebräuchlicher Plural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname transliteriert und nicht durch einen Titel ersetzt.
- source_word: וַחֲסָדֶיךָ
  choice: und an deine beständige Liebe
  rationale: חסד bezeichnet hier Gottes verlässliche, bleibende Zuwendung. Der hebräische Plural wird im Deutschen idiomatisch als Kollektivsingular wiedergegeben und in einer Fußnote kenntlich gemacht.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für die Bitte ein.
- source_word: מֵעוֹלָם
  choice: seit alters her
  rationale: Die Wendung kann sowohl unvordenkliche Vorzeit als auch ewige Dauer ausdrücken. „Seit alters her“ bewahrt im Haupttext die zeitliche Offenheit, während die weitergehende Möglichkeit in der Fußnote genannt wird.
- source_word: הֵמָּה
  choice: sie bestehen
  rationale: Das selbstständige maskuline Pluralpronomen greift beide vorausgehenden Begriffe auf. „Sie bestehen“ ergibt zusammen mit „seit alters her“ einen natürlichen deutschen Satz.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR / Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; die Transliteration bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitliche Bedeutung von מֵעוֹלָם
  choice: seit alters her
  alternative: von Ewigkeit her / seit jeher
  rationale: Der Ausdruck kann ferne Vorzeit oder unbegrenzte Dauer bezeichnen. Der Haupttext vermeidet eine vorschnelle Festlegung auf eine metaphysische Aussage; die andere Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die Anrede mit dem Gottesnamen bleibt direkt; unnötig altertümliche Formen werden vermieden. Hebräische Pluralformen werden idiomatisch wiedergegeben und durch Fußnoten transparent gemacht.
