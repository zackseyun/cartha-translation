source:
  edition: WLC
  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/001.yaml
  text: Of David. To you[a], O Yahweh, I lift up my soul.
translation:
  language: de
  text: Von David. Zu dir, Jahwe, erhebe ich meine Seele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Leben“ oder „mich selbst“. Das hebräische Wort für „Seele“ (nefesch) kann die ganze Person bezeichnen, nicht nur ihren immateriellen Aspekt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Präposition לְ vor einem Personennamen kennzeichnet in Psalmüberschriften eine Zuordnung zu David. „Von David“ bewahrt eher als „für David“ die mögliche Bedeutung von Urheberschaft oder allgemeiner davidischer Zugehörigkeit; ein im Hebräischen fehlendes „Psalm“ wird nicht ergänzt.
- source_word: אֵלֶיךָ
  choice: Zu dir
  rationale: אֶל mit Suffix der 2. Person Singular bedeutet hier „zu dir“. Die Wortstellung am Anfang des Gebets wird beibehalten und hebt das Gegenüber des Beters hervor.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ kann Seele, Leben, Selbst oder die ganze Person bezeichnen. „Meine Seele“ bewahrt hier das hebräische Bild und seine Gebetssprache; die weitere Bedeutungsbreite wird in einer Fußnote kenntlich gemacht.
- source_word: אֶשָּׂא
  choice: erhebe ich
  rationale: Die Qal-Form von נָשָׂא bedeutet „heben/erheben“. „Meine Seele zu jemandem erheben“ gibt die Metapher des Hebräischen in würdigem, verständlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch den Titel „der HERR“ zu ersetzen; „Jehova“ beruht auf einer späteren Mischlesung.
- issue: Bedeutungsumfang von נֶפֶשׁ
  choice: Seele mit erläuternder Fußnote
  alternative: Leben / mich selbst
  rationale: Die traditionelle und bildhafte Wiedergabe „Seele“ bleibt stehen, darf jedoch nicht auf einen vom Körper abgetrennten immateriellen Teil verengt werden. Die Fußnote wahrt die mögliche ganzheitliche Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Überschrift und die poetische Voranstellung „Zu dir“ folgen der Struktur des Hebräischen. „Jahwe“ wird ohne das im Deutschen unnötige und altertümelnde Anredewort „o“ verwendet.
