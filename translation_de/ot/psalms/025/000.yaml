  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/000.yaml
  text: Of David. To you[a], Yahweh, I lift up my soul.
translation:
  language: de
  text: 'Von David.[a]


    Zu dir, Jahwe, erhebe ich meine Seele.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für David“ beziehungsweise „David zugehörig“. Die genaue Beziehung, die das hebräische לְ ausdrückt, bleibt offen.'
    reason: textual_ambiguity
  - marker: b
    text: Hebräisch „meine Seele“; das Wort kann auch das Leben, das Selbst oder den ganzen Menschen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die knappe Psalmüberschrift wird in ihrer traditionellen und natürlichen deutschen Form wiedergegeben; die hebräische Präposition לְ lässt jedoch auch andere Zuordnungen zu.
- source_word: אֵלֶיךָ
  choice: Zu dir
  rationale: Gibt die gerichtete Hinwendung zu Gott präzise und idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Bewahrt das konkrete hebräische Bild und die traditionelle Psalmensprache; נֶפֶשׁ kann dabei den ganzen Menschen beziehungsweise sein Leben und Selbst bezeichnen.
- source_word: אֶשָּׂא
  choice: erhebe ich
  rationale: Entspricht dem Bild des hebräischen Verbs נשׂא und ergibt zusammen mit ‚meine Seele‘ eine würdige, verständliche Formulierung.
theological_decisions:
- issue: Bedeutungsumfang von נֶפֶשׁ
  choice: Im Haupttext steht ‚Seele‘, ergänzt durch eine Fußnote zum ganzheitlichen Bedeutungsumfang.
  alternative: ‚mein Leben‘ oder ‚mich selbst‘
  rationale: So bleibt das hebräische Bild erhalten, ohne נֶפֶשׁ auf einen ausschließlich immateriellen Bestandteil des Menschen festzulegen.
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; seine Wiedergabe als ‚Jahwe‘ macht dies im Deutschen sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildsprache. Die knappe Überschrift bleibt eigenständig; die Satzstellung des Verses hebt wie im Hebräischen die Hinwendung „Zu dir“ hervor.
