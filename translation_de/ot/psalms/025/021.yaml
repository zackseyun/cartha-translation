  text: Integrity and uprightness may preserve me[b][a], for I wait for you.
translation:
  language: de
  text: Lauterkeit und Aufrichtigkeit mögen mich bewahren[a], denn auf dich hoffe ich[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Lauterkeit und Aufrichtigkeit werden mich bewahren«. Die hebräische Verbform kann hier sowohl zuversichtliche Erwartung als auch einen Wunsch beziehungsweise eine Bitte ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »auf dich warte ich«. Das hebräische Verb bezeichnet ein hoffnungsvolles, erwartungsvolles Warten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּם
  choice: Lauterkeit
  rationale: Das Wort bezeichnet moralische Unversehrtheit, Integrität oder Untadeligkeit. »Lauterkeit« ist würdig und verständlich, ohne Sündlosigkeit zu behaupten.
- source_word: וָיֹשֶׁר
  choice: und Aufrichtigkeit
  rationale: יֹשֶׁר bezeichnet im ethischen Sinn Geradheit und Rechtschaffenheit. »Aufrichtigkeit« bildet mit »Lauterkeit« ein natürliches poetisches Wortpaar.
- source_word: יִצְּרוּנִי
  choice: mögen mich bewahren
  rationale: Das Verb נצר bedeutet »behüten, bewahren«. Die Yiqtol-Form kann hier einen Wunsch im Gebet oder eine zuversichtliche Erwartung ausdrücken; die gewählte Fassung folgt dem bittenden Ton und weist in einer Fußnote auf die Alternative hin.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet die vorausgehende Bitte beziehungsweise Erwartung. »Denn« hält den knappen poetischen Zusammenhang aufrecht.
- source_word: קִוִּיתִיךָ
  choice: auf dich hoffe ich
  rationale: קוה verbindet Hoffen mit erwartungsvollem Warten. »Auf dich hoffe ich« ist im Deutschen natürlich und bringt das vertrauensvolle Erwarten zum Ausdruck; die wörtlich nähere Alternative wird in einer Fußnote genannt.
theological_decisions:
- issue: Ob der Psalmist seine moralischen Eigenschaften als eigenständiges Verdienst beansprucht oder sie im Vertrauen auf Gottes Schutz nennt
  choice: Der Vers bleibt als Gebet formuliert, in dem Lauterkeit und Aufrichtigkeit den Psalmisten bewahren sollen, während er zugleich auf Gott hofft.
  alternative: Eine stärkere Aussage, nach der die eigene Rechtschaffenheit des Psalmisten sicher seine Rettung bewirken wird.
  rationale: Der hebräische Text nennt die moralischen Eigenschaften poetisch als bewahrende Kräfte und verbindet dies mit dem Hoffen auf Gott. Die Übersetzung erhält diese Spannung, ohne eine Verdienstlehre hinzuzufügen oder die ethische Aussage abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorangestellte Wortgruppe bewahrt die poetische Hervorhebung; »mögen« kennzeichnet den möglichen Gebetswunsch, während die Fußnote die ebenso mögliche Zukunftsaussage offenhält.
