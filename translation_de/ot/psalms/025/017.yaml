  text: The troubles of my heart have multiplied[b][a]; bring me out of my distresses.
translation:
  language: de
  text: Die Nöte meines Herzens haben sich vermehrt[a]; führe mich heraus aus meinen Bedrängnissen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „haben sich geweitet“ oder „sind weit geworden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus meinen Engen“; das hebräische Wort bezeichnet bedrängende Enge und daraus entstehende Not.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוֹת
  choice: Nöte
  rationale: Das Substantiv bezeichnet Nöte, Bedrängnisse oder widrige Umstände. „Nöte“ ist im Deutschen natürlich und bewahrt den Parallelismus zum folgenden Ausdruck für bedrängende Enge.
- source_word: לְבָבִי
  choice: meines Herzens
  rationale: לֵבָב bezeichnet den inneren Menschen einschließlich Empfinden und Denken. „Herz“ erhält das hebräische Menschenbild und ist im Deutschen gut verständlich.
- source_word: הִרְחִיבוּ
  choice: haben sich vermehrt
  rationale: Das Verb bedeutet wörtlich „weit/breit machen“. Bei den Nöten als Subjekt drückt es hier aus, dass sie an Umfang zugenommen haben. „Haben sich vermehrt“ gibt diesen Sinn natürlich wieder; die räumliche Bildsprache bleibt in einer Fußnote sichtbar.
- source_word: מִמְּצוּקוֹתַי
  choice: aus meinen Bedrängnissen
  rationale: Das Substantiv bezeichnet bedrängende Enge und daraus hervorgehende Not. „Bedrängnisse“ bewahrt den Plural und lässt die zugrunde liegende Vorstellung der Enge anklingen.
- source_word: הוֹצִיאֵנִי
  choice: führe mich heraus
  rationale: Das Verb bedeutet konkret „herausführen“ beziehungsweise „herausbringen“. Die Wiedergabe erhält das räumliche Rettungsbild und klingt als Bitte idiomatisch.
theological_decisions:
- issue: Räumliche Bildspannung zwischen wachsender Weite und bedrängender Enge
  choice: Im Haupttext wird הִרְחִיבוּ sinngemäß mit „haben sich vermehrt“ wiedergegeben, während „führe mich heraus“ und „Bedrängnisse“ das Rettungsbild bewahren.
  alternative: „Die Nöte meines Herzens haben sich geweitet; führe mich aus meinen Engen heraus.“
  rationale: Eine vollständig wörtliche Wiedergabe wäre im modernen Deutschen schwer verständlich. Die gewählte Fassung deutet die Bildspannung nicht theologisch aus, sondern macht den Sinn zugänglich und dokumentiert die wörtlichere Möglichkeit in den Fußnoten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die konkrete Bitte um Herausführung bleiben erhalten; ungewöhnliche hebräische Raumbilder werden im Haupttext verständlich wiedergegeben und in den Fußnoten offengelegt.
