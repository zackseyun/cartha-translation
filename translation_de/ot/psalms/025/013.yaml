  text: His soul will dwell in goodness[b][a], and his offspring will inherit the land.
translation:
  language: de
  text: Seine Seele wird im Guten wohnen[a], und seine Nachkommen werden das Land erben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird im Wohlergehen übernachten“. Das hebräische Verb bezeichnet eigentlich das Übernachten oder Lagern und kann hier ein dauerhaftes Verweilen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Erde“. Das hebräische Wort kann sowohl „Land“ als auch „Erde“ bedeuten; hier passt „das Land“ wahrscheinlich besser zur Wendung, das Land zu erben.'
    reason: alternative_reading
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: seine Seele
  rationale: Bewahrt die hebräische Ausdrucksweise und den poetischen Klang; נֶפֶשׁ kann auch die Person selbst oder das Leben bezeichnen.
- source_word: בְּטוֹב
  choice: im Guten
  rationale: Gibt die Bedeutungsbreite von טוֹב wieder, die Gutes, Wohlergehen und Wohlstand umfassen kann, ohne sie auf materiellen Wohlstand zu verengen.
- source_word: תָלִין
  choice: wird bleiben
  rationale: Das Verb לוּן bezeichnet ursprünglich das Übernachten oder Herbergen und kann poetisch ein anhaltendes Verweilen ausdrücken. „Bleiben“ klingt im Deutschen natürlich und erhält diesen Gedanken.
- source_word: וְזַרְעוֹ
  choice: und seine Nachkommen
  rationale: זֶרַע bedeutet wörtlich „Same“, bezeichnet hier aber eindeutig die Nachkommenschaft. „Nachkommen“ ist im modernen Deutsch klar und würdevoll.
- source_word: יִירַשׁ
  choice: werden … erben
  rationale: ירשׁ kann „erben“ oder „in Besitz nehmen“ bedeuten. „Erben“ bewahrt den bundesgeschichtlichen Anklang der Wendung.
- source_word: אָרֶץ
  choice: das Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Zusammen mit ירשׁ liegt hier die bundesbezogene Vorstellung vom Erben des Landes nahe.
theological_decisions:
- issue: Bedeutungsumfang von אָרֶץ in Verbindung mit יִירַשׁ
  choice: das Land
  alternative: die Erde
  rationale: Die Formulierung erinnert wahrscheinlich an die Verheißung, das Land zu erben. Da אָרֶץ jedoch auch die Erde bezeichnen kann, wird diese weiter gefasste Lesart in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Wendung „seine Seele“ bleibt erhalten; „im Guten bleiben“ bewahrt bewusst die Breite zwischen Güte, Wohlergehen und Wohlstand.
