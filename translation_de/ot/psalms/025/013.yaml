  naturalness: „Im Guten bleiben“ ist verständlich, klingt im heutigen Standarddeutsch jedoch etwas unidiomatisch und schwächer als die bildhafte Verbbedeutung von לוּן. „Im Guten wohnen“ ist eine natürliche, würdige poetische Formulierung und bewahrt das Bild des Verweilens beziehungsweise Lagerns besser.
