id: PSA.25.10
reference: Psalms 25:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כָּל אָרְח֣וֹת יְ֭הוָה חֶ֣סֶד וֶ/אֱמֶ֑ת לְ/נֹצְרֵ֥י בְ֝רִית֗/וֹ וְ/עֵדֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/010.yaml
  text: All the paths of Yahweh are steadfast love and faithfulness to those who keep his covenant and his testimonies[a][b].
translation:
  language: de
  text: Alle Pfade Jahwes sind beständige Liebe und Treue[a] für alle, die[b] seinen Bund und seine Bestimmungen bewahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wahrheit“. In der Verbindung „beständige Liebe und Treue“ meint das hebräische Wort häufig verlässliche Treue und nicht nur Wahrheit im abstrakten Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gegenüber allen, die“. Die hebräische Präposition lässt beide Wiedergaben zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Alle
  rationale: Gibt die Gesamtheit der Wege Jahwes natürlich und umfassend wieder.
- source_word: אָרְחוֹת
  choice: Pfade
  rationale: Bewahrt das konkrete Wegbild des Hebräischen und ist zugleich im poetischen Deutschen verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: חֶסֶד
  choice: beständige Liebe
  rationale: Bringt die gnädige, verlässliche und bundestreue Liebe zum Ausdruck, ohne den Begriff auf bloße Barmherzigkeit oder Vertragstreue zu verengen.
- source_word: אֱמֶת
  choice: Treue
  rationale: Im Wortpaar חֶסֶד וֶאֱמֶת bezeichnet der Ausdruck vor allem Verlässlichkeit und treue Beständigkeit; die Grundbedeutung „Wahrheit“ bleibt in einer Fußnote sichtbar.
- source_word: לְנֹצְרֵי
  choice: für alle, die … bewahren
  rationale: Das Partizip bezeichnet Menschen, die etwas achtsam hüten oder einhalten. „Bewahren“ erhält diesen fürsorglich-wachsamen Zug; לְ wird idiomatisch mit „für“ wiedergegeben.
- source_word: בְרִיתוֹ
  choice: seinen Bund
  rationale: „Bund“ ist die präzise und etablierte Wiedergabe des theologischen Beziehungsbegriffs בְּרִית.
- source_word: וְעֵדֹתָיו
  choice: und seine Bestimmungen
  rationale: עֵדוֹת bezeichnet hier die von Gott bezeugten und verbindlichen Anordnungen. „Bestimmungen“ ist im heutigen Deutsch verständlicher als das formal nähere, aber leicht missverständliche „Zeugnisse“.
theological_decisions:
- issue: Prädikative Aussage über Jahwes Pfade
  choice: Die Pfade selbst werden als beständige Liebe und Treue bezeichnet.
  alternative: Die Pfade führen zu beständiger Liebe und Treue.
  rationale: Der verblos formulierte hebräische Satz setzt חֶסֶד וֶאֱמֶת am natürlichsten als Prädikat zu „alle Pfade Jahwes“. Ein zusätzliches „führen zu“ würde eine im Text nicht ausgedrückte Zielrichtung eintragen.
- issue: Bezug auf die Bundestreuen
  choice: „für alle, die seinen Bund und seine Bestimmungen bewahren“
  alternative: „gegenüber allen, die seinen Bund und seine Bestimmungen bewahren“
  rationale: Die Präposition לְ kennzeichnet die Bezugsgruppe, ohne die genaue Beziehung vollständig festzulegen. „Für“ ist natürlich und lässt die Spannung bestehen; die mögliche relationale Wiedergabe „gegenüber“ wird in der Fußnote genannt. Der Vers wird nicht dahin gehend erweitert, Gottes Wesen sei von menschlichem Gehorsam abhängig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter Bildsprache. „Beständige Liebe“ erschließt den bundestheologisch reichen Ausdruck חֶסֶד ohne konfessionelle Zusätze. „Bestimmungen“ vermeidet das im heutigen Deutsch missverständliche „Zeugnisse“, bleibt aber nahe an der Bedeutung verbindlicher göttlicher Weisungen.
