source:
  edition: WLC
  text: הַדְרִ֘יכֵ֤/נִי בַ/אֲמִתֶּ֨/ךָ וְֽ/לַמְּדֵ֗/נִי כִּֽי אַ֭תָּה אֱלֹהֵ֣י יִשְׁעִ֑/י אוֹתְ/ךָ֥ קִ֝וִּ֗יתִי כָּל הַ/יּֽוֹם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/005.yaml
  text: Lead me in your truth and teach me[a], for you are the God of my salvation[b]; for you I wait all day long.
translation:
  language: de
  text: Leite mich in deiner Wahrheit[a] und lehre mich, denn du bist der Gott meiner Rettung. Auf dich warte ich den ganzen Tag[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Leite mich durch deine Treue.“ Das hebräische Wort kann „Wahrheit“, „Verlässlichkeit“ oder „Treue“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Auf dich hoffe ich den ganzen Tag.“ Das hebräische Verb bezeichnet ein Warten voller Erwartung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדְרִיכֵנִי
  choice: Leite mich
  rationale: Der Hifil-Imperativ von דרך bezeichnet das Führen oder Lenken auf einem Weg. „Leite mich“ ist natürlich und bewahrt das Wegmotiv.
- source_word: בַאֲמִתֶּךָ
  choice: in deiner Wahrheit
  rationale: אֱמֶת kann Wahrheit, Verlässlichkeit oder Treue bezeichnen. Im Zusammenhang mit Leiten und Lehren passt „Wahrheit“ als Bereich und Maßstab der erbetenen Führung; die mögliche Bedeutung „Treue“ bleibt in der Fußnote erhalten.
- source_word: וְלַמְּדֵנִי
  choice: und lehre mich
  rationale: Der Piel-Imperativ von למד bedeutet hier unmittelbar „lehren“; die schlichte Formulierung ist klar und idiomatisch.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet die vorausgehende Bitte. „Denn“ gibt diesen erklärenden Zusammenhang knapp und würdig wieder.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: der Gott meiner Rettung
  rationale: Die Wiedergabe bewahrt die nominale Struktur der hebräischen Konstruktverbindung und bezeichnet Gott als Ursprung der Rettung.
- source_word: אוֹתְךָ קִוִּיתִי
  choice: Auf dich warte ich
  rationale: קוה bezeichnet ein erwartungsvolles Warten beziehungsweise Hoffen. „Auf dich warte ich“ bewahrt das konkrete Warten und richtet es gemäß dem vorangestellten Objekt ausdrücklich auf Gott.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Die Wendung bezeichnet die gesamte Dauer des Tages; „den ganzen Tag“ ist modernes, natürliches Deutsch.
theological_decisions:
- issue: Bedeutung von אֱמֶת im Zusammenhang göttlicher Führung
  choice: Wahrheit
  alternative: Treue beziehungsweise Verlässlichkeit
  rationale: Die Verbindung von Leiten und Lehren spricht dafür, Gottes Wahrheit als Inhalt oder Maßstab der Führung zu verstehen. Da „Treue“ lexikalisch ebenfalls möglich ist, wird diese Lesart nicht ausgeschlossen, sondern in einer Fußnote genannt.
- issue: Bedeutungsnuance von קוה
  choice: warten
  alternative: hoffen beziehungsweise erwartungsvoll warten
  rationale: Das hebräische Verb verbindet Warten mit hoffnungsvoller Erwartung. Der Haupttext bewahrt das konkrete Bild des Wartens; die Fußnote hält die Hoffnungsnuance ausdrücklich offen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Gebetston. Die parallelen Imperative und das Wegmotiv bleiben erhalten; lexikalische Mehrdeutigkeiten werden nicht im Haupttext vermischt, sondern transparent in den Fußnoten ausgewiesen.
