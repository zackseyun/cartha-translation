  text: The counsel of the LORD is for those who fear him, and his covenant is to make it known to them.
translation:
  language: de
  text: Der vertraute Rat des HERRN gilt denen, die ihn fürchten, und seinen Bund macht er ihnen bekannt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »und sein Bund, sie erkennen zu lassen«. Der hebräische zweite Halbvers ist elliptisch; die Übersetzung ergänzt: Der HERR macht ihnen seinen Bund bekannt.'
    reason: Kennzeichnet die syntaktische Ellipse des hebräischen Textes und legt die zur natürlichen deutschen Satzbildung erforderliche Ergänzung offen.
lexical_decisions:
- source_word: סוֹד
  choice: vertrauter Rat
  rationale: Das Wort bezeichnet einen vertraulichen Kreis beziehungsweise das dort anvertraute Gespräch oder Geheimnis. »Vertrauter Rat« bewahrt sowohl den Gedanken der Nähe als auch den der mitgeteilten Einsicht.
- source_word: יְהוָה
  choice: der HERR
  rationale: Das Tetragramm wird nach verbreiteter deutscher Bibeltradition mit »der HERR« wiedergegeben.
- source_word: לִירֵאָיו
  choice: für die bestimmt, die ihn fürchten
  rationale: Die Präposition ל markiert die Zuordnung zu den Gottesfürchtigen; »fürchten« bewahrt den biblischen Ausdruck ehrfürchtiger Gottesbeziehung.
- source_word: וּבְרִיתוֹ
  choice: und sein Bund
  rationale: Die koordinierte Nominalfügung des Hebräischen wird formal bewahrt.
- source_word: לְהוֹדִיעָם
  choice: um ihn ihnen bekannt zu machen
  rationale: Der Hifil-Infinitiv von ידע drückt das Bekanntmachen aus. Das pronominale Objekt ist im Deutschen ergänzt und bezieht sich kontextuell am ehesten auf den Bund; die syntaktische Spannung der elliptischen hebräischen Form wird in einer Fußnote ausgewiesen.
theological_decisions:
- issue: Beziehung zwischen Gottes Bund und seinem Bekanntmachen
  choice: »und sein Bund, um ihn ihnen bekannt zu machen«
  alternative: »und er lässt sie seinen Bund erkennen«
  rationale: Die gewählte Fassung folgt der ungewöhnlichen nominalen Struktur des Hebräischen und vermeidet, ohne ausdrückliches Verb eigenmächtig Gott als Subjekt des zweiten Gliedes einzusetzen. Wegen der im Deutschen auffälligen Ellipse erläutert eine Fußnote die geläufigere syntaktische Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Vertrauter Rat« erschließt סוֹד verständlich, ohne es auf bloßes »Geheimnis« oder auf eine öffentliche Weisung zu verengen. Die markierte Ellipse im zweiten Halbvers bleibt aus Gründen der Quellennähe erhalten und wird durch die Fußnote abgesichert.
