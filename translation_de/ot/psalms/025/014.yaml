  source_fidelity: Der erste Halbvers gibt סוֹד angemessen als vertrauten Rat wieder. Im zweiten Halbvers ist לְהוֹדִיעָם ein Hifil-Infinitiv („sie erkennen lassen / ihnen bekannt machen“). Die hebräische Form ist elliptisch, doch die deutsche Fassung „und sein Bund, um ihn ihnen bekannt zu machen“ bildet keine vollständige, natürliche Aussage und verschiebt die Konstruktion zu einem unangebundenen Zweckinfinitiv.
  naturalness: „Der vertraute Rat des HERRN gilt denen, die ihn fürchten“ ist modernes, würdiges Standarddeutsch. „Und seinen Bund macht er ihnen bekannt“ löst die im Hebräischen mögliche Ellipse idiomatisch auf, ohne den Aussagegehalt auszubauen.
  terminology: „HERR“, „vertrauter Rat“, „fürchten“ und „Bund“ sind hier passende, etablierte Wiedergaben. Die Fußnote soll die elliptische hebräische Form und die interpretative Ergänzung des Subjekts transparent machen.
