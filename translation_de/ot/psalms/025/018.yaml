  text: Look on my affliction and my trouble[a], and forgive all my sins.
translation:
  language: de
  text: Sieh mein Elend und meine Not an und vergib mir alle meine Sünden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „trage alle meine Sünden“; das hebräische Verb kann „tragen“, „hochheben“ oder „wegnehmen“ bedeuten und bezeichnet hier idiomatisch die Vergebung von Sünden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Sieh … an
  rationale: Der Imperativ richtet sich an Gott und bittet ihn, das Leiden aufmerksam und fürsorglich wahrzunehmen. „Sieh … an“ bewahrt diesen bittenden Charakter in natürlichem Deutsch.
- source_word: עָנְיִי
  choice: mein Elend
  rationale: עֳנִי bezeichnet Bedrängnis, Elend oder Leiden; „Elend“ gibt den weiten Sinn wieder, ohne ihn auf materielle Armut zu verengen.
- source_word: וַעֲמָלִי
  choice: und meine Not
  rationale: עָמָל kann Mühsal, Beschwernis oder leidvolle Not bezeichnen. Zusammen mit „Elend“ klingt „Not“ im deutschen Klagegebet natürlich und prägnant.
- source_word: וְשָׂא
  choice: und vergib mir
  rationale: נשׂא bedeutet wörtlich „heben/tragen/wegnehmen“, bezeichnet mit Sünden als Gegenstand aber idiomatisch deren Wegnahme, also Vergebung. Das im Deutschen erforderliche „mir“ bezeichnet den Empfänger der Vergebung und fügt keinen neuen theologischen Gedanken hinzu.
- source_word: לְכָל
  choice: alle
  rationale: Die Präposition ל gehört hier zur hebräischen Konstruktion mit נשׂא; im Deutschen wird der Gegenstand idiomatisch direkt als „alle meine Sünden“ formuliert.
- source_word: חַטֹּאותָי
  choice: meine Sünden
  rationale: Der Plural von חַטָּאת bezeichnet hier moralische Verfehlungen; „Sünden“ ist die klare und sachgerechte Wiedergabe.
theological_decisions:
- issue: Idiomatische Wiedergabe von נשׂא mit Sünden als Gegenstand
  choice: „vergib mir alle meine Sünden“
  alternative: „nimm alle meine Sünden weg“ / „trage alle meine Sünden fort“
  rationale: Das hebräische Bild spricht vom Aufheben oder Wegtragen der Sünden und damit idiomatisch von Vergebung. „Vergib mir“ vermittelt diese Bitte in klarem modernem Deutsch; die Fußnote bewahrt zugleich das konkrete Bild des Ausgangstextes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in knapper Gebetssprache. Die parallelen Begriffe „Elend“ und „Not“ bleiben unterschieden; die bildhafte Bedeutung von נשׂא wird durch eine Fußnote sichtbar gehalten.
