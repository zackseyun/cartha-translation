source:
  edition: WLC
  text: דְּרָכֶ֣י/ךָ יְ֭הוָה הוֹדִיעֵ֑/נִי אֹ֖רְחוֹתֶ֣י/ךָ לַמְּדֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/004.yaml
  text: Make your ways known to me[a], O Yahweh; teach me your paths.
translation:
  language: de
  text: Lass mich deine Wege erkennen[a], Jahwe; lehre mich deine Pfade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Lass mich … wissen“; traditionell: „Zeige mir deine Wege“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיךָ
  choice: deine Wege
  rationale: דֶּרֶךְ bezeichnet einen Weg und kann im Gebet bildlich für Gottes Handeln oder Weisung stehen. „Wege“ bewahrt dieses Bild, ohne es vorschnell auf moralische Gebote einzuengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben statt durch einen Titel ersetzt.
- source_word: הוֹדִיעֵנִי
  choice: Lass mich ... erkennen
  rationale: 'Die Hifil-Form von ידע ist kausativ: „Lass mich erkennen“ gibt den Sinn von „bewirke, dass ich erkenne“ natürlich und präzise wieder.'
- source_word: אֹרְחוֹתֶיךָ
  choice: deine Pfade
  rationale: אֹרַח meint einen Pfad oder eine Bahn. „Pfade“ wahrt die poetische Parallelität zu „Wege“ und unterscheidet zugleich die beiden hebräischen Begriffe.
- source_word: לַמְּדֵנִי
  choice: lehre mich
  rationale: Der Piel-Imperativ von למד mit Suffix der ersten Person Singular bedeutet unmittelbar „lehre mich“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Umschrift „Jahwe“ bewahrt den persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede ohne „o“ klingt im heutigen Deutschen natürlich; die poetische Parallelität von „Wege“ und „Pfade“ bleibt erhalten.
