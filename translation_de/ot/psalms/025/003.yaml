translation_notes:
  register: Modernes Standarddeutsch mit knapper, poetischer Satzstellung. „Zuschanden werden“ ist gehoben, aber weiterhin verständlich und erhält die Wiederholung des hebräischen Verbs. Der Fußnotenmarker steht an der mehrdeutigen zweiten Vershälfte.
