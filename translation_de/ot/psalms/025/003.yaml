  yaml_path: translation/ot/psalms/025/003.yaml
  text: Indeed[a], none of those who wait for you will be put to shame[b]; those who deal treacherously without cause will be put to shame.
translation:
  language: de
  text: Ja, keiner, der auf dich hofft, wird zuschanden werden; zuschanden werden die, die grundlos treulos handeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zuschanden werden die, die treulos handeln, vergeblich“ oder „die umsonst treulos handeln“. Das hebräische Wort רֵיקָם kann hier unterschiedlich auf das treulose Handeln oder auf dessen Ergebnis bezogen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Ja
  rationale: Hier verstärkt גַּם die Aussage. Das einleitende „Ja“ gibt diese emphatische Funktion in natürlichem, würdigem Deutsch wieder.
- source_word: כָּל קֹוֶיךָ לֹא יֵבֹשׁוּ
  choice: keiner, der auf dich hofft, wird zuschanden
  rationale: Die hebräische Konstruktion lautet wörtlich „alle, die auf dich warten/hoffen, werden nicht zuschanden“. Die deutsche Fassung mit „keiner“ bewahrt den universalen verneinten Sinn idiomatisch.
- source_word: קֹוֶיךָ
  choice: der auf dich hofft
  rationale: קוה bezeichnet erwartungsvolles Warten. „Hoffen auf“ verbindet Erwartung und Vertrauen und klingt im modernen Deutschen natürlicher als „auf dich warten“, das leicht rein zeitlich verstanden würde.
- source_word: לֹא יֵבֹשׁוּ / יֵבֹשׁוּ
  choice: wird nicht zuschanden / zuschanden werden
  rationale: בוש bezeichnet hier das Erleiden von Schande beziehungsweise das Scheitern vor anderen. Die wiederholte Wiedergabe mit „zuschanden werden“ erhält den Kontrast und die poetische Wiederholung.
- source_word: הַבּוֹגְדִים
  choice: die treulos handeln
  rationale: Das Partizip von בגד beschreibt aktives, illoyales oder verräterisches Handeln. „Treulos handeln“ wahrt diesen verbalen Charakter.
- source_word: רֵיקָם
  choice: grundlos
  rationale: רֵיקָם kann „vergeblich“, „für nichts“ oder „ohne Grund“ bedeuten. Im Zusammenhang mit treulosem Handeln ist „grundlos“ eine plausible Deutung, ohne die Mehrdeutigkeit in der Fußnote zu verschweigen.
