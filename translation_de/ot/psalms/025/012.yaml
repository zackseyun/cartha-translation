  text: מִי זֶ֣ה הָ֭/אִישׁ יְרֵ֣א יְהוָ֑ה י֝וֹרֶ֗/נּוּ בְּ/דֶ֣רֶךְ יִבְחָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/012.yaml
  text: Who is the man who fears Yahweh? He will instruct him in the way he should choose[a].
translation:
  language: de
  text: Wer ist der Mann, der Jahwe fürchtet? Er lehrt ihn den Weg, den er wählen soll.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Er lehrt ihn den Weg, den er wählt“ oder „den er wählen wird“; das letzte Verb kann auch auf Jahwe bezogen werden: „den er auswählt“. Das Hebräische lässt beim letzten Verb unterschiedliche Bezüge sowie Zeit- und Bedeutungsnuancen zu.'
    reason: Lexikalische und syntaktische Mehrdeutigkeit des Imperfekts יִבְחָר und seines Subjekts.
lexical_decisions:
- source_word: מִי זֶה
  choice: Wer ist
  rationale: Die Verbindung aus Fragewort und Demonstrativpronomen bildet hier eine idiomatische rhetorische Frage. „Wer ist“ klingt im Deutschen natürlich, ohne das Demonstrativum unnötig mit „dieser“ wiederzugeben.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Das Hebräische steht grammatisch im maskulinen Singular. „Der Mann“ bewahrt diese Form und kann im Kontext zugleich repräsentativ verstanden werden.
- source_word: יְרֵא יְהוָה
  choice: der Jahwe fürchtet
  rationale: ירא bezeichnet hier ehrfürchtige Gottesfurcht. „Fürchten“ bewahrt die im Psalter und in der Weisheitsliteratur gewichtige Ausdrucksweise, ohne sie auf bloßen Respekt abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: יוֹרֶנּוּ
  choice: Er weist ihn ... ein
  rationale: Der Hifil von ירה umfasst lehren, unterweisen und anleiten. „In den Weg einweisen“ verbindet Unterweisung mit Führung und nimmt das Wegbild natürlich auf. Das Subjekt „Er“ bezieht sich kontextuell auf Jahwe, das Objektsuffix auf den gottesfürchtigen Mann.
- source_word: בְּדֶרֶךְ
  choice: in den Weg
  rationale: דרך bezeichnet sowohl einen Weg als auch bildlich den Lebensweg oder die Lebensführung. In Verbindung mit „einweisen“ bleibt die Metapher im Deutschen erhalten.
- source_word: יִבְחָר
  choice: den er wählen soll
  rationale: Das Imperfekt lässt mehrere Nuancen zu. „Wählen soll“ bringt im Zusammenhang der göttlichen Unterweisung den naheliegenden normativen Sinn zum Ausdruck; die möglichen präsentischen oder futurischen Lesarten werden in der Fußnote bewahrt.
theological_decisions:
- issue: Subjekt von „Er weist ihn ein“
  choice: Jahwe ist das aus dem Kontext erschlossene Subjekt, das den Gottesfürchtigen unterweist.
  alternative: Das Verb könnte formal mit einem unbestimmten Subjekt verstanden werden.
  rationale: Obwohl das Verb kein ausdrücklich genanntes Subjekt hat, ist Jahwe der unmittelbar vorausgehende Bezugspunkt und im Kontext des Psalms derjenige, der den Gottesfürchtigen führt. Die Großschreibung von „Er“ macht diese kontextuelle Zuordnung sichtbar.
- issue: Bezug und Modalität von יִבְחָר
  choice: Das Subjekt ist der unterwiesene Mann; der Weg ist derjenige, den er wählen soll.
  alternative: 'Möglich sind auch „den er wählt“ oder „den er wählen wird“; grammatisch könnte das Subjekt außerdem auf Jahwe bezogen werden: „den er auswählt“.'
  rationale: Der hebräische Konsonantentext legt weder die modale Nuance des Imperfekts noch den Bezug des männlichen Singularverbs völlig eindeutig fest. Der Haupttext bietet die im Zusammenhang naheliegende Lesart, während die Fußnote die echte Mehrdeutigkeit offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das traditionelle „fürchten“ erhält die theologische Spannweite der ehrfürchtigen Gottesfurcht. Die Wegmetapher bleibt erhalten; die Formulierung ist zugleich für heutige Leser verständlich.
