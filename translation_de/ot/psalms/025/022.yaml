  text: פְּדֵ֣ה אֱ֭לֹהִים אֶת יִשְׂרָאֵ֑ל מִ֝/כֹּ֗ל צָֽרוֹתָי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/022.yaml
  text: Redeem Israel[a], O God, from all his troubles.
translation:
  language: de
  text: Erlöse Israel, Gott, aus all seinen Nöten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּדֵה
  choice: Erlöse
  rationale: Der Imperativ von פדה bezeichnet Loskauf, Erlösung oder Befreiung. „Erlöse“ bewahrt das theologische Gewicht und passt zugleich natürlich zum Gebet.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים steht hier als direkte Anrede. Im Deutschen macht die Wortstellung die Anrede ohne ein zusätzliches „o“ eindeutig und zeitgemäß.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet in diesem Zusammenhang das Bundesvolk als kollektive Einheit.
- source_word: מִכֹּל
  choice: aus all
  rationale: מִן mit כֹּל bezeichnet die Befreiung aus der Gesamtheit der Bedrängnisse; „aus all“ ist im Deutschen knapp und idiomatisch.
- source_word: צָרוֹתָיו
  choice: seinen Nöten
  rationale: צָרוֹת bezeichnet Nöte, Bedrängnisse oder Schwierigkeiten. „Nöte“ ist würdig, verständlich und bewahrt mit „seinen“ den maskulinen Singular des hebräischen Suffixes.
theological_decisions:
- issue: Kollektiver Singular bei Israel
  choice: „seinen Nöten“ im Singular
  alternative: „ihren Nöten“, wenn Israel als aus vielen Menschen bestehendes Volk aufgefasst wird
  rationale: Das Hebräische verwendet ein Suffix der 3. Person maskulin Singular und behandelt Israel als kollektive Einzahl. Die deutsche Form „seinen“ kann diese Grammatik unmittelbar bewahren, ohne die kollektive Bedeutung auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Gebetsform und der kollektive Singular des Ausgangstextes bleiben erhalten.
