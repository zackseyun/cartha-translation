  text: פְּנֵה אֵלַ֥/י וְ/חָנֵּ֑/נִי כִּֽי יָחִ֖יד וְ/עָנִ֣י אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/016.yaml
  text: Turn to me and be gracious to me[b][a], for I am lonely and afflicted.
translation:
  language: de
  text: Wende dich mir zu und sei mir gnädig, denn ich bin allein[a] und bedrängt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einsam« beziehungsweise »vereinsamt«. Das hebräische Wort kann sowohl das Alleinsein als auch empfundene Einsamkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »arm«, »unterdrückt« oder »elend«. Das hebräische Wort kann wirtschaftliche Armut, soziale Unterdrückung oder allgemeine Not bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: Wende dich mir zu
  rationale: Der Qal-Imperativ von פנה mit אֵלַי bittet Gott, sich dem Beter zuzuwenden. Die Formulierung ist im Deutschen natürlich und bewahrt das Bild der Hinwendung.
- source_word: וְחָנֵּנִי
  choice: und sei mir gnädig
  rationale: Der Imperativ von חנן mit Suffix der 1. Person Singular bezeichnet das Erweisen von Gunst oder Gnade. „Sei mir gnädig“ ist präzise, würdevoll und im Gebetsregister geläufig.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund für die Bitte ein; „denn“ gibt den kausalen Zusammenhang natürlich wieder.
- source_word: יָחִיד
  choice: allein
  rationale: Im Klagekontext bezeichnet יָחִיד Isolation beziehungsweise das Alleinsein. „Allein“ bewahrt gegenüber „einsam“ die mögliche objektive wie subjektive Bedeutung.
- source_word: וְעָנִי
  choice: und bedrängt
  rationale: עָנִי kann arm, unterdrückt oder allgemein leidend bedeuten. „Bedrängt“ lässt die Ursache der Not offen und entspricht dem persönlichen Klagekontext.
- source_word: אָנִי
  choice: ich bin
  rationale: Das selbstständige Pronomen betont die Person des Beters. Im Deutschen wird für die prädikative Aussage die Kopula ergänzt.
