source:
  edition: WLC
  text: חַטֹּ֤אות נְעוּרַ֨/י וּ/פְשָׁעַ֗/י אַל תִּ֫זְכֹּ֥ר כְּ/חַסְדְּ/ךָ֥ זְכָר לִ/י אַ֑תָּה לְמַ֖עַן טוּבְ/ךָ֣ יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/007.yaml
  text: Do not remember the sins of my youth or my transgressions[a]; according to your steadfast love, remember me—for the sake of your goodness[b], O Yahweh.
translation:
  language: de
  text: Denk nicht an die Sünden meiner Jugend und an meine Übertretungen.[a] Denk du vielmehr an mich gemäß deiner beständigen Liebe[b], um deiner Güte willen, Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Übertretungen“ kann auch mit „Vergehen“ oder „Auflehnungen“ wiedergegeben werden; das hebräische Wort bezeichnet oft bewusstes, rebellisches Fehlverhalten.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort ḥesed bezeichnet verlässliche, treue Zuwendung und kann auch mit „treue Liebe“, „Gnade“ oder „Bundestreue“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטֹּאות נְעוּרַי
  choice: die Sünden meiner Jugend
  rationale: Der Plural bezeichnet konkrete sündige Taten; die Genitivverbindung wird im Deutschen unmittelbar und natürlich wiedergegeben.
- source_word: וּפְשָׁעַי
  choice: und an meine Auflehnungen
  rationale: פשע bezeichnet häufig bewusste Übertretung oder rebellische Auflehnung. „Auflehnungen“ erhält diese stärkere Nuance; das hebräische ו wird regulär mit „und“ wiedergegeben.
- source_word: אַל תִּזְכֹּר
  choice: Denk nicht an
  rationale: Die verneinte Bitte meint nicht bloß fehlende Erinnerung, sondern dass Gott die Schuld nicht in Anschlag bringen soll. Die direkte deutsche Formulierung bewahrt zugleich das Wortspiel mit dem folgenden positiven „Denk … an mich“.
- source_word: כְּחַסְדְּךָ
  choice: gemäß deiner beständigen Liebe
  rationale: כְּ bezeichnet hier den Maßstab beziehungsweise die Grundlage der erbetenen Zuwendung. „Beständige Liebe“ gibt die liebevolle und verlässliche Dimension von חסד wieder, ohne den Ausdruck auf bloßes Mitleid zu verengen.
- source_word: זְכָר לִי אַתָּה
  choice: Denk du vielmehr an mich
  rationale: Das ausdrücklich gesetzte Pronomen אַתָּה wird durch „du“ hervorgehoben; „vielmehr“ macht im Deutschen den beabsichtigten Gegensatz zwischen dem Nichtgedenken der Sünden und dem Gedenken der Person deutlich.
- source_word: לְמַעַן טוּבְךָ
  choice: um deiner Güte willen
  rationale: Die Wendung wahrt, dass Gottes eigene Güte Grund und Motiv der Bitte ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ transliteriert und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bedeutungsumfang von חסד
  choice: beständige Liebe
  alternative: Gnade; Bundestreue; treue Liebe
  rationale: Der Ausdruck verbindet liebevolle Zuwendung mit Verlässlichkeit und kann einen bundestheologischen Klang tragen. Die gewählte Formulierung hält diesen Bedeutungsraum offen, ohne eine bestimmte Systematik einzutragen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Da der Ausgangstext den Eigennamen verwendet, bewahrt die Übersetzung ihn als Namen; „Jahwe“ entspricht der geläufigen modernen deutschen Umschrift.
- issue: Göttliches „Gedenken“
  choice: Denk nicht an … Denk … an mich
  alternative: Rechne mir nicht an … nimm dich meiner an
  rationale: 'Die wörtlichere Wiedergabe erhält die theologisch bedeutsame Gegenüberstellung: Gott soll nicht der Jugendsünden, sondern der betenden Person gedenken. Eine erklärende Paraphrase würde dieses Wortspiel auflösen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Wendung „Denk … an“ bewahrt die prägnante Gegenüberstellung des Hebräischen; „Denk du vielmehr“ gibt die Betonung des ausdrücklichen Personalpronomens natürlich wieder.
