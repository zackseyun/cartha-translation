source:
  edition: WLC
  text: אֱֽלֹהַ֗/י בְּ/ךָ֣ בָ֭טַחְתִּי אַל אֵב֑וֹשָׁה אַל יַֽעַלְצ֖וּ אֹיְבַ֣/י לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/002.yaml
  text: My God[a], in you I trust; do not let me be put to shame[b]; do not let my enemies exult over me.
translation:
  language: de
  text: Mein Gott, auf dich vertraue ich. Lass mich nicht zuschanden werden[a]; lass meine Feinde nicht über mich triumphieren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beschämt werden“ oder „mich schämen“. Das hebräische Verb kann sowohl innere Scham als auch öffentliches Zuschandenwerden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „über mich jubeln“ beziehungsweise „sich über mich freuen“. Gemeint ist die triumphierende Freude der Feinde über mich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Mein Gott
  rationale: Die Form mit Suffix der 1. Person Singular bedeutet „mein Gott“ und fungiert als direkte Anrede; ein zusätzliches „O“ ist im Hebräischen nicht ausgedrückt.
- source_word: בְּךָ בָטַחְתִּי
  choice: auf dich vertraue ich
  rationale: ב mit בטח bezeichnet das Ziel des Vertrauens. Das deutsche „auf jemanden vertrauen“ ist idiomatisch; das Perfekt beschreibt hier eine gefestigte, gegenwärtig fortdauernde Vertrauenshaltung.
- source_word: אֵבוֹשָׁה
  choice: zuschanden werden
  rationale: בושׁ kann sowohl innere Beschämung als auch öffentliches Scheitern beziehungsweise Entehrtwerden bezeichnen. Im Zusammenhang mit den Feinden wahrt „zuschanden werden“ die öffentliche Dimension und den gehobenen Gebetston.
- source_word: יַעַלְצוּ
  choice: triumphieren
  rationale: עלץ bezeichnet jubelnde Freude. Bei Feinden und mit לִי ist feindseliger Triumph beziehungsweise Schadenfreude gemeint; „triumphieren“ ist im Deutschen natürlich und bewahrt den poetischen Ton.
- source_word: אֹיְבַי
  choice: meine Feinde
  rationale: Direkte Wiedergabe des Substantivs mit Suffix der 1. Person Singular.
- source_word: לִי
  choice: über mich
  rationale: Mit dem Verb des Jubelns bezeichnet ל die Person, über deren Niederlage sich die Feinde freuen.
theological_decisions:
- issue: Die Bitte des Psalmisten hinsichtlich der Schande
  choice: Lass mich nicht zuschanden werden
  alternative: Lass mich nicht beschämt werden / Lass mich nicht schämen
  rationale: Der Zusammenhang mit den Feinden legt öffentliches Scheitern und Entehrung nahe, ohne die ebenfalls mögliche innere Scham auszuschließen. Die Fußnote bewahrt diese Bedeutungsbreite.
- issue: Die Freude der Feinde
  choice: über mich triumphieren
  alternative: über mich jubeln / sich über mich freuen
  rationale: „Triumphieren“ bringt die feindselige Freude über die erhoffte Niederlage des Beters zum Ausdruck, ohne näher festzulegen, wie diese Niederlage eintreten würde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer, aber allgemein verständlicher Gebetssprache. Die Voranstellung „auf dich“ bildet den Fokus des Hebräischen nach. „Zuschanden werden“ ist leicht gehoben, im Psalmenregister jedoch natürlich und präzise.
