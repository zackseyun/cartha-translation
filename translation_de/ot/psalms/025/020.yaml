source:
  edition: WLC
  text: שָׁמְרָ֣/ה נַ֭פְשִׁ/י וְ/הַצִּילֵ֑/נִי אַל אֵ֝ב֗וֹשׁ כִּֽי חָסִ֥יתִי בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/020.yaml
  text: Guard my life and rescue me; let me not be put to shame, for I take refuge in you.
translation:
  language: de
  text: Bewahre mein Leben und rette mich! Lass mich nicht zuschanden werden, denn bei dir suche ich Zuflucht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי
  choice: mein Leben
  rationale: נֶפֶשׁ bezeichnet hier nicht isoliert eine immaterielle »Seele«, sondern die bedrohte Person beziehungsweise ihr Leben; »mein Leben« gibt den konkreten Bittcharakter natürlich wieder.
- source_word: שָׁמְרָה
  choice: Bewahre
  rationale: Der Imperativ bittet um schützendes Hüten; »bewahre« wahrt diesen Sinn und den würdevollen Gebetston.
- source_word: וְהַצִּילֵנִי
  choice: und rette mich
  rationale: Das Verb נצל im Hifil bedeutet hier, jemanden aus Gefahr zu befreien oder zu retten.
- source_word: אַל־אֵבוֹשׁ
  choice: Lass mich nicht zuschanden werden
  rationale: בוש umfasst Scham und das Scheitern vor anderen; die feste deutsche Wendung bildet diese öffentliche wie persönliche Dimension ab.
- source_word: חָסִיתִי בָךְ
  choice: bei dir suche ich Zuflucht
  rationale: חסה bezeichnet das Zufluchtnehmen und Sich-Unterstellen unter Schutz. Das hebräische Perfekt kann in diesem Gebetskontext eine bestehende, gegenwärtig wirksame Haltung ausdrücken.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ
  choice: mein Leben
  alternative: meine Seele
  rationale: Der Kontext ist eine Bitte um Bewahrung und Rettung der ganzen gefährdeten Person. Die Wiedergabe vermeidet eine nicht erforderliche Trennung von Körper und Seele.
- issue: Zeitwert von חָסִיתִי
  choice: bei dir suche ich Zuflucht
  alternative: bei dir habe ich Zuflucht gesucht
  rationale: Das Perfekt bezeichnet hier plausibel eine vollzogene und fortdauernde Vertrauenshaltung. Das Präsens klingt im Deutschen natürlich und entspricht dem aktuellen Grund der Bitte, ohne einen besonderen dogmatischen Akzent einzutragen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Gebetston. Die beiden Imperative werden durch ein Ausrufezeichen als zusammengehöriger Hilferuf markiert; der anschließende Wunsch- und Begründungssatz bleibt eng am hebräischen Aufbau.
