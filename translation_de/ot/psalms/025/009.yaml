  source_fidelity: Der Vers gibt die beiden Verbalsätze, die Wiederholung von עֲנָוִים und den Singular mit Suffix in דַּרְכּוֹ sachgerecht wieder. »Im Recht« ist jedoch im heutigen Deutschen mehrdeutig und wird vor allem als prädikative Wendung („recht haben“) verstanden; für בַּמִּשְׁפָּט ist »in Gerechtigkeit« als Bereich bzw. Maßstab der Führung klarer und näher an der ethisch-rechtlichen Aussage.
