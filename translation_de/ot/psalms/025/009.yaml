  text: יַדְרֵ֣ךְ עֲ֭נָוִים בַּ/מִּשְׁפָּ֑ט וִֽ/ילַמֵּ֖ד עֲנָוִ֣ים דַּרְכּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/009.yaml
  text: He guides the humble in justice[b][a], and he teaches the humble his way.
translation:
  language: de
  text: Er führt die Demütigen[b] in Gerechtigkeit[a] und lehrt die Demütigen seinen Weg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach dem Recht«, »im gerechten Urteil« oder »im Gericht«.'
    reason: lexical_alternative
  - marker: b
    text: »Die Demütigen« kann auch mit »die Sanftmütigen«, »die Niedrigen« oder, je nach Zusammenhang, »die Bedrängten« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַדְרֵךְ
  choice: führt
  rationale: Das Hifil von דרך bezeichnet hier ein Führen oder Leiten. »Führt« ist im Deutschen natürlich und lässt im Zusammenhang mit »Weg« das Bild des Gehens anklingen.
- source_word: עֲנָוִים
  choice: die Demütigen
  rationale: Das Wort kann demütige, sanftmütige, niedrige oder bedrängte Menschen bezeichnen. Im Zusammenhang göttlicher Unterweisung gibt »die Demütigen« die Haltung der Bescheidenheit und Belehrbarkeit gut wieder; die Wiederholung des Hebräischen bleibt erhalten.
- source_word: בַּמִּשְׁפָּט
  choice: im Recht
  rationale: מִשְׁפָּט kann Recht, gerechtes Urteil oder Gericht bedeuten. »Im Recht« bewahrt die rechtlich-ethische Bedeutungsbreite und kann sowohl den Bereich als auch den Maßstab der Führung bezeichnen.
- source_word: וִילַמֵּד
  choice: und lehrt
  rationale: Das Piel von למד bedeutet »lehren« oder »unterweisen«. »Lehrt« ist klar, schlicht und entspricht der parallelen Aussageform.
- source_word: דַּרְכּוֹ
  choice: seinen Weg
  rationale: Der Singular mit Suffix der 3. Person maskulin Singular wird direkt wiedergegeben. »Weg« bewahrt sowohl das konkrete Bild als auch den Sinn von Gottes Lebensordnung.
theological_decisions:
- issue: Bedeutung von עֲנָוִים im Blick auf Gottes Führung und Unterweisung
  choice: die Demütigen
  alternative: die Sanftmütigen; die Niedrigen; die Bedrängten
  rationale: Der Kontext betont die Bereitschaft, sich von Gott führen und lehren zu lassen. »Die Demütigen« bringt diese geistliche Haltung zum Ausdruck, ohne soziale Niedrigkeit oder Bedrängnis grundsätzlich auszuschließen.
- issue: Bedeutungsumfang von בַּמִּשְׁפָּט
  choice: im Recht
  alternative: nach dem Recht; im gerechten Urteil; im Gericht
  rationale: Die Formulierung lässt offen, ob Recht primär als Bereich, Weg oder Maßstab der göttlichen Führung verstanden wird, und vermeidet eine unnötige Festlegung auf ein endzeitliches oder gerichtliches Geschehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die bewusste Wiederholung von »die Demütigen« werden beibehalten. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
