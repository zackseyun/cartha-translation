base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/003.yaml
  text: May Yahweh bless you from Zion[c][b][a], maker of heaven and earth.
translation:
  language: de
  text: Jahwe segne dich von Zion her, der Schöpfer von Himmel und Erde.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Jahwe wird dich von Zion her segnen.“ Im Zusammenhang dieses Segensspruchs ist die Wiedergabe als Wunsch, „Jahwe segne dich“, jedoch naheliegender.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „der Himmel und Erde macht“; auch möglich: „der Himmel und Erde gemacht hat“. Das hebräische Partizip kennzeichnet Jahwe als den, der Himmel und Erde gemacht hat, bzw. als ihren Schöpfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: segne dich
  rationale: Der Piel-Imperfekt mit Suffix der 2. Person maskulin Singular hat im abschließenden Segensspruch am natürlichsten optativisch-jussive Kraft. Der deutsche Konjunktiv „segne“ gibt diesen Segenswunsch knapp und würdig wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: מִצִּיּוֹן
  choice: vom Zion her
  rationale: Die Präposition מִן bezeichnet den Ausgangspunkt. „Vom Zion her“ bewahrt das Bild, dass der Segen von Zion ausgeht.
- source_word: עֹשֵׂה
  choice: der ... gemacht hat
  rationale: Das Qal-Partizip bezeichnet Jahwe appositionell als den Urheber von Himmel und Erde. Ein deutscher Relativsatz ist hier natürlich und erhält den Bezug auf Jahwe.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: Himmel und Erde
  rationale: Das feste Wortpaar bezeichnet umfassend die ganze Schöpfung. Im Deutschen ist „Himmel und Erde“ die natürliche, traditionsübergreifend verständliche Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Aussageweise von יְבָרֶכְךָ im Schlusssegen
  choice: 'optativisch-jussiv: „segne dich“'
  alternative: 'indikativisch bzw. futurisch: „wird dich segnen“'
  rationale: Der liturgische Zusammenhang eines abschließenden Segens spricht für einen Wunsch oder Zuspruch in Segensform. Die morphologische Möglichkeit einer nichtjussivischen Imperfektdeutung wird in der Fußnote offengehalten.
- issue: Funktion des Partizips עֹשֵׂה
  choice: 'appositionelle Kennzeichnung Jahwes: „der ... gemacht hat“'
  alternative: 'substantivisch: „Schöpfer von Himmel und Erde“'
  rationale: Der Relativsatz gibt die partizipiale Beschreibung wieder, ohne den allgemeineren Ausdruck עשה ausdrücklich mit dem theologischen Fachwort „Schöpfer“ zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Voranstellung „Vom Zion her“ hält den Ausgangspunkt des Segens deutlich fest; der Konjunktiv „segne“ entspricht einer geläufigen deutschen Segensformel. Der Relativsatz vermeidet eine konfessionell aufgeladene Auslegung und bleibt nahe am hebräischen Partizip.
