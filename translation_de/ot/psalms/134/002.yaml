id: PSA.134.2
reference: Psalms 134:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שְׂאֽוּ יְדֵ/כֶ֥ם קֹ֑דֶשׁ וּ֝/בָרֲכוּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/002.yaml
  text: Lift up your hands to the holy place and bless Yahweh[a].
translation:
  language: de
  text: Erhebt eure Hände zum Heiligtum[a] und segnet Jahwe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Heiligkeit«; oder: »im Heiligtum«. Das hebräische Wort קֹדֶשׁ kann sowohl Heiligkeit als auch einen heiligen Ort bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאוּ
  choice: Erhebt
  rationale: Der maskuline Pluralimperativ von נשׂא bezeichnet hier das bewusste Emporheben der Hände; »erhebt« ist im Deutschen natürlich und bewahrt die konkrete Handlung.
- source_word: יְדֵיכֶם
  choice: eure Hände
  rationale: Die wörtliche Wiedergabe ist klar und entspricht der kultischen Gebärde des Verses.
- source_word: קֹדֶשׁ
  choice: zum Heiligtum
  rationale: קֹדֶשׁ kann Heiligkeit oder einen heiligen Ort bezeichnen. Im Tempelkontext liegt die Richtungsangabe »zum Heiligtum« nahe, obwohl im Hebräischen keine Präposition steht; die ebenfalls möglichen qualitativen und lokalen Deutungen werden in der Fußnote bewahrt.
- source_word: וּבָרֲכוּ
  choice: und segnet
  rationale: Der Pluralimperativ von ברך wird auch bei an Gott gerichteter Verehrung mit »segnen« wiedergegeben; dies bewahrt die Grundbedeutung besser als das enger deutende »loben«.
- source_word: אֶת
  choice: '[Objektmarker, nicht wiedergegeben]'
  rationale: Der hebräische Marker des bestimmten direkten Objekts hat keine eigenständige deutsche Entsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bedeutung von קֹדֶשׁ in der Wendung שְׂאוּ יְדֵיכֶם קֹדֶשׁ
  choice: 'räumlich-direktional: »zum Heiligtum«'
  alternative: 'qualitativ: »in Heiligkeit«; oder lokal: »im Heiligtum«'
  rationale: Der Zusammenhang mit den nächtlichen Dienern im Haus Jahwes stützt einen Bezug auf das Heiligtum. Da die präpositionslose hebräische Form jedoch auch eine qualitative oder lokale Deutung zulässt, wird die Spannung nicht im Haupttext allein entschieden, sondern durch eine Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Imperativsatz und die konkrete Gebärde bleiben erhalten; »segnet Jahwe« bewahrt bewusst die theologisch markante Ausdrucksweise des Hebräischen.
