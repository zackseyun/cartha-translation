  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הִנֵּ֤ה בָּרֲכ֣וּ אֶת יְ֭הוָה כָּל עַבְדֵ֣י יְהוָ֑ה הָ/עֹמְדִ֥ים בְּ/בֵית יְ֝הוָ֗ה בַּ/לֵּילֽוֹת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/001.yaml
  text: A Song of Ascents[a]. Behold, bless Yahweh, all you servants of Yahweh[b], who stand in the house of Yahweh by night.
translation:
  language: de
  text: Ein Lied der Aufstiege[a]. Seht, preist[b] Jahwe, all ihr Diener Jahwes, die ihr nachts im Haus Jahwes[c] steht!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bedeutung dieser traditionellen Psalmüberschrift ist unsicher. Möglich ist ein Bezug auf Pilgerreisen hinauf nach Jerusalem oder auf Stufen beziehungsweise Aufgänge.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „segnet“. Gemeint ist hier, Gott ehrend zu rühmen.'
    reason: lexical_alternative
  - marker: c
    text: Mit dem „Haus Jahwes“ ist hier das Heiligtum, also der Tempel, gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Lied der Aufstiege
  rationale: Die traditionelle Sammlungsüberschrift wird formal bewahrt. Die genaue Bedeutung von מַעֲלוֹת bleibt offen und wird in einer Fußnote erläutert.
- source_word: הִנֵּה
  choice: Seht
  rationale: Gibt den aufmerksamkeitsweckenden und auffordernden Charakter der Partikel in natürlichem, gehobenem Deutsch wieder.
- source_word: בָּרֲכוּ
  choice: preist
  rationale: Wenn ברך von Menschen auf Gott bezogen ist, bezeichnet es sein rühmendes Segnen. „Preist“ ist im heutigen Deutsch verständlicher als „segnet“, ohne den liturgischen Aufruf abzuschwächen; die wörtlichere Möglichkeit wird vermerkt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כָּל עַבְדֵי יְהוָה
  choice: all ihr Diener Jahwes
  rationale: Der Imperativ zeigt eine direkte Anrede an. „Diener“ passt zum kultischen Zusammenhang besser als das hier unnötig verengende „Sklaven“.
- source_word: הָעֹמְדִים
  choice: die ihr … steht
  rationale: Bewahrt das konkrete Bild des hebräischen Partizips; eine Wiedergabe mit „Dienst tut“ wäre stärker auslegend.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: Bewahrt die hebräische Wendung transparent; im Kontext ist damit das Heiligtum beziehungsweise der Tempel gemeint.
- source_word: בַּלֵּילוֹת
  choice: nachts
  rationale: Gibt den idiomatischen zeitlichen Sinn des hebräischen Plurals in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben. Dadurch bleibt der Bundesname erkennbar und wird nicht stillschweigend durch einen Herrschaftstitel ersetzt.
- issue: Bedeutung von ברך bei Gott als Objekt
  choice: preist
  alternative: segnet
  rationale: „Preist“ vermittelt im modernen Deutsch die hier gemeinte ehrende Anrufung Gottes. Die Alternative „segnet“ liegt näher an der Grundbedeutung des Verbs, kann jedoch missverständlich wirken und wird deshalb in einer Fußnote erhalten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem poetisch-liturgischem Ton. Die direkte Anrede und das konkrete Bild des nächtlichen Stehens bleiben erhalten; schwierige oder mehrdeutige Ausdrücke werden nicht im Haupttext übererklärt, sondern knapp in Fußnoten erläutert.
