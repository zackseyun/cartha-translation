base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/000.yaml
  text: A Song of Ascents. Behold, bless the LORD, all you servants of the LORD, who stand in the house of the LORD by night!
translation:
  language: de
  text: Ein Wallfahrtslied. Seht, preist den HERRN, all ihr Diener des HERRN, die ihr nachts im Haus des HERRN steht![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Seht, segnet den HERRN …« Das »Haus des HERRN« ist der Tempel.'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die Überschrift bezeichnet ein Lied der »Aufstiege«; im Zusammenhang von Psalm 120–134 ist »Wallfahrtslied« eine natürliche deutsche Wiedergabe, ohne die genaue historische Verwendung abschließend festzulegen.
- source_word: הִנֵּה
  choice: Seht
  rationale: Die aufmerksamkeitslenkende Partikel wird als würdiger, im Deutschen verständlicher Aufruf wiedergegeben.
- source_word: בָּרֲכוּ
  choice: preist
  rationale: ברך bedeutet in Bezug auf Gott, ihn zu loben beziehungsweise zu preisen; »segnet den HERRN« wäre formaler, klingt im heutigen Deutsch jedoch leicht missverständlich.
- source_word: עַבְדֵי יְהוָה
  choice: Diener des HERRN
  rationale: »Diener« gibt die kultische Dienststellung natürlich wieder und vermeidet die heute enger oder abwertend wirkende Bezeichnung »Knechte«.
- source_word: הָעֹמְדִים
  choice: die ihr ... steht
  rationale: Die konkrete Körper- und Diensthaltung des hebräischen Partizips bleibt erhalten.
- source_word: בַּלֵּילוֹת
  choice: nachts
  rationale: Der formale Plural »in den Nächten« ist idiomatisch als wiederkehrende oder nächtliche Zeitangabe zu verstehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH
  rationale: Die traditionelle deutsche Ersatzlesung in Kapitälchen bewahrt die erkennbare Besonderheit des Gottesnamens, ohne eine unsichere Aussprache festzulegen.
- issue: Bedeutung von ברך bei Gott als Objekt
  choice: preist
  alternative: segnet
  rationale: Die Wiedergabe bezeichnet menschliches Lob Gottes und vermeidet den möglichen Eindruck, Menschen verliehen Gott Segen; die traditionelle Form »segnet« bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kurze, feierliche Aufforderungscharakter und die direkte Anrede des hebräischen Textes bleiben erhalten.
