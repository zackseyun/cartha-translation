  source_fidelity: 'Die Überschrift שיר המעלות ist mit „Ein Wallfahrtslied“ sachgerecht wiedergegeben. Der gesamte Vers ist vorhanden: הִנֵּה als aufmerksamkeitslenkendes „Seht“, בָּרֲכוּ als idiomatisches „preist“, die Anrede an alle Diener des HERRN sowie die näher bestimmende Partizipialphrase „die ihr nachts im Haus des HERRN steht“. „nachts“ gibt den hebräischen Ausdruck „in den Nächten“ natürlich wieder, ohne den wiederholten bzw. nächtlichen Charakter wesentlich einzuschränken.'
  naturalness: Der Text ist flüssiges modernes Standarddeutsch und bewahrt den knappen, feierlich-aufrufenden Charakter. Die Kongruenz in „all ihr Diener … die ihr … steht“ ist korrekt. „Seht, preist den HERRN“ ist als dichterisch-liturgische Aufforderung natürlich.
