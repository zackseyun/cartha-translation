  source_fidelity: Die Übersetzung gibt die beiden parallelen Relativsätze des Hebräischen zuverlässig wieder. „deren Mund“ bewahrt den kollektiven Singular von פִּיהֶם, das Präsens „redet“ bildet die charakterisierende Funktion des Perfekts angemessen ab, und die emphatische Wiederholung „rechte Hand … eine rechte Hand“ bleibt erhalten. „Nichtiges“ für שָׁוְא wahrt dessen weites Feld von Leere, Wertlosigkeit und Täuschung; „Lüge“ ist für שָׁקֶר eine tragfähige, klare Wiedergabe.
