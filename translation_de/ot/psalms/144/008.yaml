  text: אֲשֶׁ֣ר פִּ֭י/הֶם דִּבֶּר שָׁ֑וְא וִֽ֝/ימִינָ֗/ם יְמִ֣ין שָֽׁקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/008.yaml
  text: whose mouth speaks emptiness[b][a], and whose right hand is a right hand of falsehood.
translation:
  language: de
  text: deren Mund Nichtiges redet[a] und deren rechte Hand eine rechte Hand der Lüge ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deren Mund Falsches redet“. Das hebräische Wort kann Nichtigkeit, Wertlosigkeit oder Täuschung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Wiederholung „rechte Hand … rechte Hand“ entspricht dem Hebräischen und dient der Betonung. Die rechte Hand kann für einen Eid, Macht oder zugesagte Treue stehen; eine „rechte Hand der Lüge“ weist daher auf Täuschung oder Treulosigkeit hin.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: deren
  rationale: Das Relativpronomen führt eine beschreibende Fortsetzung zu den Fremden im vorhergehenden Vers ein und passt zu den beiden Besitzangaben „Mund“ und „rechte Hand“.
- source_word: פִּיהֶם
  choice: deren Mund
  rationale: Der hebräische Text hat das Substantiv im Singular mit einem Suffix der 3. Person Plural. Der kollektive Singular lässt sich im Deutschen natürlich bewahren.
- source_word: דִּבֶּר
  choice: redet
  rationale: Das hebräische Perfekt bezeichnet hier im beschreibenden Relativsatz ein kennzeichnendes Verhalten; das deutsche Präsens gibt dies angemessen wieder.
- source_word: שָׁוְא
  choice: Nichtiges
  rationale: Der Ausdruck kann Leeres, Wertloses, Vergebliches oder Täuschendes bezeichnen. „Nichtiges“ bewahrt diese Bedeutungsbreite, ohne die Aussage vorschnell ausschließlich auf Lüge festzulegen.
- source_word: וִימִינָם
  choice: und deren rechte Hand
  rationale: Die erneute possessive Relativkonstruktion erhält den Parallelismus der beiden Satzglieder und klingt im Deutschen klar.
- source_word: יְמִין
  choice: eine rechte Hand
  rationale: Die auffällige Wiederholung von „rechte Hand“ wird wie im Hebräischen beibehalten, statt rhetorisch geglättet zu werden.
- source_word: שָׁקֶר
  choice: Lüge
  rationale: Das Wort bezeichnet Falschheit, Täuschung oder Lüge. „Lüge“ ist verständlich und kräftig, während die Fußnote den möglichen kulturellen Sinn der gesamten Wendung erläutert.
