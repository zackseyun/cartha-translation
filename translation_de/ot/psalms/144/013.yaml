base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/013.yaml
  text: May our storehouses be full[a], supplying every kind of produce; may our flocks multiply by thousands, by tens of thousands[b], in our open fields.
translation:
  language: de
  text: Unsere Vorratskammern mögen voll sein und Erzeugnisse jeder Art[a] bereithalten; unsere Herden mögen sich zu Tausenden, ja zu Zehntausenden vermehren auf unseren freien Flächen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von Art zu Art“; gemeint ist eine reiche Vielfalt an Erzeugnissen oder Vorräten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf unseren Straßen“ beziehungsweise „auf unseren Plätzen“. Das hebräische Wort kann offene Bereiche innerhalb oder außerhalb einer Siedlung bezeichnen; wegen der Herden ist hier an freie Flächen gedacht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזָוֵינוּ
  choice: unsere Vorratskammern
  rationale: Das seltene Substantiv bezeichnet wahrscheinlich Räume zur Aufbewahrung von Vorräten. „Vorratskammern“ ist im heutigen Deutsch klar und passt zum landwirtschaftlichen Zusammenhang.
- source_word: מְלֵאִים
  choice: seien voll
  rationale: Das prädikative Adjektiv bedeutet „voll“. Der Wunschcharakter des Zusammenhangs wird mit dem Konjunktiv „seien“ natürlich wiedergegeben, ohne die Nominalkonstruktion unnötig auszubauen.
- source_word: מְפִיקִים
  choice: halten … bereit
  rationale: Das Partizip bezeichnet das Hervorbringen beziehungsweise Bereitstellen von Vorräten. „Bereithalten“ drückt hier verständlich aus, dass die gefüllten Vorratskammern reichlich Versorgung bieten.
- source_word: מִזַּן אֶל זַן
  choice: Erzeugnisse jeder Art
  rationale: Wörtlich steht „von Art zu Art“. Die Wiedergabe bezeichnet die Vielfalt der eingelagerten Erzeugnisse und wahrt den distributiven Sinn.
- source_word: צֹאנֵנוּ
  choice: unsere Herden
  rationale: Das hebräische Kollektiv bezeichnet Kleinvieh, besonders Schafe und Ziegen. „Herden“ bewahrt den kollektiven Sinn, ohne die Tierart enger festzulegen als der Ausgangstext.
- source_word: מַאֲלִיפוֹת
  choice: sich zu Tausenden vermehren
  rationale: Die vom Wort für „tausend“ gebildete Form beschreibt den zahlenmäßigen Zuwachs der Herden. Die reflexive Formulierung ist im Deutschen idiomatisch und lässt den genauen Stammwert offen.
- source_word: מְרֻבָּבוֹת
  choice: zu Zehntausenden
  rationale: Die Form ist von רְבָבָה, „Zehntausend“, abgeleitet und steigert die vorausgehende Größenangabe. „Ja“ macht diese rhetorische Steigerung im Deutschen hörbar.
- source_word: בְּחוּצוֹתֵינוּ
  choice: auf unseren freien Flächen
  rationale: חוּצוֹת kann Straßen, Plätze oder Bereiche draußen beziehungsweise am Rand einer Siedlung bezeichnen. „Freie Flächen“ passt zum Bild der Herden, ohne den Ausdruck ausdrücklich zu „Feldern“ zu verengen.
theological_decisions:
- issue: Aussage oder Segenswunsch
  choice: als Segenswunsch mit „seien“ und „mögen“
  alternative: 'als Feststellung: „Unsere Vorratskammern sind voll … unsere Herden vermehren sich …“'
  rationale: Die hebräischen Nominal- und Partizipialkonstruktionen markieren den Modus nicht ausdrücklich. Im Zusammenhang der Segensbilder ist ein Wunsch naheliegend; die deutsche Wiedergabe macht diese Lesart transparent, ohne eine besondere theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die Steigerung von Tausenden zu Zehntausenden bleiben erhalten; seltene oder mehrdeutige Ausdrücke werden im Haupttext verständlich und in den Fußnoten transparent wiedergegeben.
