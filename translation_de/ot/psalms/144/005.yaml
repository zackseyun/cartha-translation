source:
  edition: WLC
  text: יְ֭הוָה הַט שָׁמֶ֣י/ךָ וְ/תֵרֵ֑ד גַּ֖ע בֶּ/הָרִ֣ים וְֽ/יֶעֱשָֽׁנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/005.yaml
  text: O Yahweh[a], bend your heavens and come down[b]; touch the mountains so that they smoke.
translation:
  language: de
  text: Jahwe, neige deinen Himmel und steig herab[a]; berühre die Berge, sodass sie rauchen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »komm herab«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und sie werden rauchen«; das Hebräische kann das Rauchen als eintretende Folge von Gottes Berührung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַט שָׁמֶיךָ
  choice: neige deinen Himmel
  rationale: נטה bezeichnet hier das Herabneigen; der deutsche Singular »Himmel« ist die natürliche poetische Entsprechung des hebräischen Plurals שׁמים.
- source_word: וְתֵרֵד
  choice: und steig herab
  rationale: Die Bewegungsrichtung wird klar und in würdigem, heutigem Deutsch ausgedrückt; »komm herab« ist ebenfalls möglich.
- source_word: גַּע בֶּהָרִים
  choice: berühre die Berge
  rationale: נגע bedeutet gewöhnlich »berühren«. Eine stärkere Wiedergabe wie »schlage« würde die machtvolle Wirkung vorwegnehmen, statt sie dem folgenden Satzteil zu überlassen.
- source_word: וְיֶעֱשָׁנוּ
  choice: dass sie rauchen
  rationale: Der Imperfekt nach den Aufforderungen kann die beabsichtigte oder eintretende Folge der Berührung bezeichnen. Die Alternative »und sie werden rauchen« bewahrt stärker die formale Satzverknüpfung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den persönlichen Gottesnamen ausdrücklich; die Transliteration bewahrt ihn, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis zwischen Gottes Berührung und dem Rauchen der Berge
  choice: 'Folgesatz: »dass sie rauchen«'
  alternative: 'Koordination: »und sie werden rauchen«'
  rationale: Der Zusammenhang legt eine Folge von Gottes Berührung nahe, doch die hebräische Verknüpfung lässt auch eine formal koordinierte Wiedergabe zu; diese bleibt in der Fußnote sichtbar.
translation_notes:
  register: Poetisch, würdig und unmittelbar. Der Imperativcharakter und die anschauliche theophanische Bildsprache bleiben erhalten; unnötig altertümliche Formen werden vermieden.
