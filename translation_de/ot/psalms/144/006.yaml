  text: בְּר֣וֹק בָּ֭רָק וּ/תְפִיצֵ֑/ם שְׁלַ֥ח חִ֝צֶּ֗י/ךָ וּ/תְהֻמֵּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/006.yaml
  text: Flash forth lightning and scatter them[a]; send out your arrows and throw them into confusion.
translation:
  language: de
  text: Lass Blitze zucken und zerstreue sie; schieß deine Pfeile ab und bring sie in Verwirrung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und schlage sie in die Flucht«. Das letzte Verb kann bedeuten, jemanden in Panik oder Verwirrung zu versetzen oder ihn im Kampf in die Flucht zu schlagen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוֹק בָּרָק
  choice: Lass Blitze zucken
  rationale: Die Verbindung aus dem Imperativ von ברק und dem Substantiv בָּרָק bezeichnet das Hervorbrechen von Blitz. Die deutsche Wendung ist anschaulich, natürlich und bewahrt den poetischen Befehl.
- source_word: וּתְפִיצֵם
  choice: und zerstreue sie
  rationale: Die Kausativform von פוץ beschreibt, dass die Feinde auseinandergetrieben werden. »Zerstreuen« bewahrt den kraftvollen militärischen Sinn.
- source_word: שְׁלַח חִצֶּיךָ
  choice: schieß deine Pfeile ab
  rationale: שלח bedeutet grundsätzlich »senden«; in Verbindung mit Pfeilen gibt »abschießen« das gemeinte Aussenden im heutigen Deutsch klar und idiomatisch wieder.
- source_word: וּתְהֻמֵּם
  choice: und bring sie in Verwirrung
  rationale: Die Form von המם bezeichnet das Versetzen in Bestürzung, Verwirrung oder panische Flucht. Die gewählte Wiedergabe erhält den kausativen Sinn, ohne ihn ausschließlich auf eine militärische Niederlage festzulegen.
theological_decisions:
- issue: Bild Gottes als Krieger
  choice: Die kriegerischen Bilder von Blitzen und Pfeilen bleiben als direkte Bitte an Gott erhalten.
  alternative: Die Aussage zu einer allgemeinen Bitte um Hilfe oder Gericht abschwächen.
  rationale: Der hebräische Text redet Gott in der Bildwelt eines göttlichen Kriegers unmittelbar an. Eine Abschwächung würde die Aussage des Psalms verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. Die militärische Bildsprache und die Bedeutungsbreite des Schlussverbs bleiben erhalten.
