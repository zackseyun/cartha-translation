  text: הַ/נּוֹתֵ֥ן תְּשׁוּעָ֗ה לַ/מְּלָ֫כִ֥ים הַ֭/פּוֹצֶה אֶת דָּוִ֥ד עַבְדּ֗/וֹ מֵ/חֶ֥רֶב רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/010.yaml
  text: the one who gives salvation to kings[b][a], who rescues David his servant from the evil sword.
translation:
  language: de
  text: der den Königen Heil schenkt[a], der David, seinen Diener, vor dem bösen Schwert[b] rettet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rettung“ oder „Sieg“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vor dem tödlichen Schwert“. Wörtlich: „von einem bösen Schwert“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתֵן
  choice: der … schenkt
  rationale: Das substantivierte Qal-Partizip mit Artikel bezeichnet Gott als den Handelnden. „Der … schenkt“ bewahrt den partizipialen Anschluss und klingt im Deutschen natürlicher als „der … gibt“ bei „Heil“.
- source_word: תְּשׁוּעָה
  choice: Heil
  rationale: Das Substantiv kann Rettung, Befreiung oder Sieg bezeichnen. „Heil“ bewahrt die umfassende Bedeutung göttlichen Rettungshandelns, ohne den militärischen Zusammenhang auszuschließen.
- source_word: לַמְּלָכִים
  choice: den Königen
  rationale: Die Präposition ל kennzeichnet hier den indirekten Empfänger; der deutsche Dativ gibt dies knapp und idiomatisch wieder.
- source_word: הַפּוֹצֶה
  choice: der … rettet
  rationale: Das Partizip bezeichnet das Befreien aus einer Gefahr. „Rettet“ ist gegenwärtiges, klares Deutsch und erhält die Parallele zum zuvor genannten Heil.
- source_word: אֶת דָּוִד
  choice: David
  rationale: אֶת markiert das direkte Objekt; der Eigenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: עַבְדּוֹ
  choice: seinen Diener
  rationale: Im Blick auf David ist עבד eine königliche und bundestheologische Bezeichnung seiner Zugehörigkeit zu Gott. „Diener“ trifft diesen Zusammenhang besser als „Sklave“.
- source_word: מֵחֶרֶב
  choice: vor dem … Schwert
  rationale: מן bezeichnet die Trennung beziehungsweise Rettung aus einer Gefahr. Nach dem deutschen Verb „retten“ ist „vor“ die natürliche Entsprechung.
- source_word: רָעָה
  choice: bösen
  rationale: Die Grundbedeutung lautet „böse/schlecht“. Beim Schwert kann das Wort zugleich dessen verderbliche oder tödliche Wirkung bezeichnen; „böse“ erhält die Bildsprache und Mehrdeutigkeit des Hebräischen.
theological_decisions:
- issue: Bedeutungsumfang von תְּשׁוּעָה im königlich-militärischen Zusammenhang
  choice: Heil
  alternative: Rettung oder Sieg
  rationale: Der Zusammenhang mit Königen und der Rettung Davids vor dem Schwert legt Befreiung oder Sieg nahe. „Heil“ bewahrt zugleich die weitere theologische Bedeutung von Gottes rettendem Handeln.
- issue: Wiedergabe von עַבְדּוֹ als Bezeichnung Davids
  choice: seinen Diener
  alternative: seinen Sklaven
  rationale: Hier bezeichnet das Wort Davids Verhältnis zu Gott in einer geläufigen königlichen und bundestheologischen Wendung. „Diener“ vermeidet eine sachlich nicht erforderliche Verengung auf den rechtlichen Sklavenstatus.
- issue: Bedeutung von רָעָה beim Schwert
  choice: böses Schwert
  alternative: tödliches Schwert
  rationale: Die wörtliche Fassung lässt offen, ob vor allem moralische Feindschaft, Verderben oder tödliche Gefahr im Blick steht. Diese Spannung wird nicht zugunsten nur einer Deutung aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Relativkonstruktion bildet die beiden hebräischen Partizipien ab. „Heil schenken“ ist gehoben, aber allgemein verständlich; die Fußnoten sichern die militärischen Bedeutungsnuancen.
