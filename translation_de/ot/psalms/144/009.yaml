base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/009.yaml
  text: O God[a], I will sing a new song to you; on a ten-stringed harp I will make music to you.
translation:
  language: de
  text: Gott, ich will dir ein neues Lied singen; auf einer zehnsaitigen Harfe[a] will ich dir spielen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einer zehnsaitigen Harfe“, „auf einer zehnsaitigen Laute“ oder allgemeiner: „mit einem zehnsaitigen Instrument“; welches antike Instrument mit נֵבֶל genau gemeint ist, ist ungewiss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Gottesname steht als direkte Anrede. Im Deutschen ist „Gott“ ohne ein zusätzliches „O“ natürlich und würdevoll.
- source_word: שִׁיר חָדָשׁ
  choice: ein neues Lied
  rationale: Die direkte und im Psalter vertraute Entsprechung bewahrt das Motiv des neuen Liedes.
- source_word: אָשִׁירָה
  choice: ich will … singen
  rationale: Die Kohortativform drückt Entschlossenheit beziehungsweise Absicht aus; „ich will“ gibt diesen volitiven Sinn im Deutschen treffend wieder.
- source_word: לָּךְ
  choice: dir
  rationale: Der Dativ bezeichnet natürlich den Adressaten des Gesangs und der Musik.
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: auf der zehnsaitigen Harfe
  rationale: נֵבֶל bezeichnet ein Saiteninstrument, dessen genaue Bauart unsicher ist. „Harfe“ ist eine verständliche traditionelle Wiedergabe; בְּ wird im instrumentalen Zusammenhang idiomatisch mit „auf“ wiedergegeben.
- source_word: אֲזַמְּרָה
  choice: ich will … spielen
  rationale: Im unmittelbaren Zusammenhang mit dem ausdrücklich genannten Saiteninstrument bezeichnet das Verb musikalisches Spielen beziehungsweise Musizieren. „Spielen“ vermeidet eine unnötige Wiederholung von „singen“.
