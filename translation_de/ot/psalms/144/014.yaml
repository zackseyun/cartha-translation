  text: אַלּוּפֵ֗י/נוּ מְֽסֻבָּ֫לִ֥ים אֵֽין פֶּ֭רֶץ וְ/אֵ֣ין יוֹצֵ֑את וְ/אֵ֥ין צְ֝וָחָ֗ה בִּ/רְחֹבֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/014.yaml
  text: Our cattle are heavy with young[a]; there is no breach and no going out[c][b], and no cry in our streets.
translation:
  language: de
  text: Unsere Rinder sind wohlbeladen[a]. Es gibt keine Bresche, kein Hinausgehen[b] und kein Klagegeschrei auf unseren Plätzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, im Sinn von Fruchtbarkeit: „Unsere Rinder sind trächtig.“ Das Hebräische bezeichnet sie wörtlich als beladen oder Last tragend. Im Zusammenhang wird dies häufig als Bild für fruchtbares, reichlich gedeihendes Vieh verstanden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „kein Auszug“ oder „niemand, der hinauszieht“. Der knappe hebräische Ausdruck lässt offen, ob ein erzwungenes Fortgehen, etwa in die Gefangenschaft, oder eine andere Art des Hinausgehens gemeint ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַלּוּפֵינוּ
  choice: unsere Rinder
  rationale: אַלּוּף kann zwar auch einen Anführer oder Sippenführer bezeichnen, doch im Zusammenhang mit den Segensbildern für Herden und Ertrag liegt die Bedeutung „Rinder“ nahe.
- source_word: מְסֻבָּלִים
  choice: trächtig und wohlgenährt
  rationale: Das Partizip bezeichnet wörtlich ein Beladensein oder Lasttragen. Auf Vieh bezogen vermittelt die Formulierung den wahrscheinlichen Sinn von Fruchtbarkeit und Fülle, ohne die Grundvorstellung des Schwerbeladenseins völlig aufzugeben.
- source_word: אֵין פֶּרֶץ
  choice: Es gibt keinen Mauerdurchbruch
  rationale: פֶּרֶץ bezeichnet einen Bruch oder eine Bresche; im Zusammenhang öffentlicher Sicherheit ist wahrscheinlich eine Bresche in der Befestigung gemeint.
- source_word: וְאֵין יוֹצֵאת
  choice: und keinen Auszug
  rationale: Die hebräische Wendung ist knapp und mehrdeutig. „Auszug“ bewahrt die Vorstellung des Hinausgehens und lässt offen, ob ein erzwungenes Fortgehen, eine Verschleppung oder eine andere Form des Ausziehens gemeint ist.
- source_word: וְאֵין צְוָחָה
  choice: und kein Klagegeschrei
  rationale: צְוָחָה bezeichnet einen lauten Ruf, besonders einen Not- oder Klageschrei. „Klagegeschrei“ macht diesen negativen Sinn im Deutschen deutlich.
- source_word: בִּרְחֹבֹתֵינוּ
  choice: auf unseren Plätzen
  rationale: רְחֹבוֹת sind breite öffentliche Räume, Straßen oder Plätze. „Plätze“ bildet den städtischen öffentlichen Raum anschaulich ab.
