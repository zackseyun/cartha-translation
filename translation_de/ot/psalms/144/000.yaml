source:
  edition: WLC
  text: לְ/דָוִ֨ד בָּ֘ר֤וּךְ יְהוָ֨ה צוּרִ֗/י הַֽ/מְלַמֵּ֣ד יָדַ֣/י לַ/קְרָ֑ב אֶ֝צְבְּעוֹתַ֗/י לַ/מִּלְחָמָֽה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/000.yaml
  text: Of David. Blessed is Yahweh[a], my rock, who trains my hands for battle, my fingers for war.
translation:
  language: de
  text: Von David.[a] Gepriesen sei der HERR, mein Fels, der meine Hände für den Kampf schult, meine Finger für den Krieg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für David“ beziehungsweise „David zugehörig“. Die hebräische Präposition kann Verfasserschaft, Zuordnung oder Widmung ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Überschrift wird in ihrer üblichen Zuordnung zu David wiedergegeben; die Präposition לְ kann jedoch auch Zugehörigkeit oder Widmung ausdrücken, weshalb die Mehrdeutigkeit in einer Fußnote genannt wird.
- source_word: יְהוָה
  choice: der HERR
  rationale: Der Gottesname JHWH wird nach verbreiteter deutscher Bibelkonvention mit dem typografisch hervorgehobenen Titel „HERR“ wiedergegeben.
- source_word: צוּרִי
  choice: mein Fels
  rationale: Die konkrete Metapher des Hebräischen bleibt erhalten und bezeichnet Gott als Schutz und festen Halt.
- source_word: הַמְלַמֵּד
  choice: der … schult
  rationale: Das Partizip beschreibt fortdauerndes Anleiten beziehungsweise Einüben; „schult“ klingt im militärischen Zusammenhang natürlich.
- source_word: לַקְרָב … לַמִּלְחָמָה
  choice: für den Kampf … für den Krieg
  rationale: Die parallelen, semantisch nahen Begriffe werden unterschieden wiedergegeben, ohne den poetischen Parallelismus einzuebnen.
theological_decisions:
- issue: Wiedergabe des Tetragramms
  choice: der HERR
  alternative: Jahwe
  rationale: „HERR“ wahrt die im Deutschen weithin erkennbare jüdisch-christliche Lesetradition; die Entscheidung legt keine besondere Aussprache des Gottesnamens fest.
- issue: Sprecher und davidische Zuordnung
  choice: Von David
  alternative: Für David / David zugehörig
  rationale: Eine Verfasserschaft ist naheliegend, aber die hebräische Überschrift kann auch Zuordnung oder Widmung bezeichnen; diese Spannung wird nicht im Haupttext aufgelöst, sondern in der Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter Bildsprache und knappem poetischem Parallelismus. „Schult“ ist verständlich und gibt das militärische Einüben natürlicher wieder als ein allgemein gehaltenes „lehrt“.
