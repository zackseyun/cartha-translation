  terminology: „der HERR“ ist eine etablierte, registerangemessene deutsche Wiedergabe des Tetragramms. Die Metapher „mein Fels“ bleibt unverfälscht. Die Fußnote hält die Mehrdeutigkeit von לְדָוִד sachgerecht offen und entspricht dem englischen Audit-Trail, ohne eine bestimmte Deutung festzulegen.
