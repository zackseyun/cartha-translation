source:
  edition: WLC
  text: שְׁלַ֥ח יָדֶ֗י/ךָ מִ/מָּ֫ר֥וֹם פְּצֵ֣/נִי וְ֭/הַצִּילֵ/נִי מִ/מַּ֣יִם רַבִּ֑ים מִ֝/יַּ֗ד בְּנֵ֣י נֵכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/007.yaml
  text: Stretch out your hand from on high[a]; rescue me and deliver me from many waters[b], from the hand of foreign sons.
translation:
  language: de
  text: Streck deine Hände aus der Höhe herab; zieh mich heraus und rette mich aus vielen Wassern[a], aus der Hand der Söhne der Fremde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus großen“ beziehungsweise „aus gewaltigen Wassern“. Das hebräische Bild kann überwältigende Gefahr bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Söhne der Fremde“; eine hebräische Bezeichnung für Fremde oder Ausländer.'
    reason: idiom_explanation
lexical_decisions:
- source_word: שְׁלַח יָדֶיךָ
  choice: Streck deine Hände aus
  rationale: Der Imperativ von שלח bezeichnet mit „Hände“ ein Ausstrecken zum Eingreifen. Die im vorgelegten WLC-Text stehende Pluralform יָדֶיךָ wird als „deine Hände“ wiedergegeben; so bleibt auch das konkrete anthropomorphe Bild erhalten.
- source_word: מִמָּרוֹם
  choice: aus der Höhe herab
  rationale: מָרוֹם bezeichnet einen hoch gelegenen oder erhabenen Ort. „Aus der Höhe herab“ bewahrt die räumliche Bildsprache, ohne den Ausdruck ausdrücklich als „Himmel“ auszulegen.
- source_word: פְּצֵנִי
  choice: zieh mich heraus
  rationale: פצה kann hier das Herausziehen beziehungsweise Befreien aus Gefahr bezeichnen. Im Zusammenhang mit den Wassern ist „zieh mich heraus“ anschaulich und bleibt zugleich vom folgenden Rettungsverb unterschieden.
- source_word: וְהַצִּילֵנִי
  choice: und rette mich
  rationale: נצל bezeichnet die Rettung oder Befreiung aus einer drohenden Gefahr. „Rette mich“ ist im heutigen Deutsch klar und bildet mit dem vorangehenden Verb eine natürliche poetische Doppelung.
- source_word: מִמַּיִם רַבִּים
  choice: aus vielen Wassern
  rationale: רַבִּים kann „viele“ oder „große/gewaltige“ bedeuten. „Viele Wasser“ wahrt die unmittelbare Mehrzahl und die poetische Fremdheit des Bildes; die mögliche qualitative Deutung wird in der Fußnote genannt.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die wörtliche Wendung kann Macht oder Gewalt bezeichnen. „Aus der Hand“ bleibt verständlich und erhält die Korrespondenz zu Gottes ausgestreckten Händen am Versanfang.
- source_word: בְּנֵי נֵכָר
  choice: Söhne der Fremde
  rationale: Die hebräische Wendung lautet wörtlich „Söhne der Fremde/Fremdheit“ und bezeichnet Fremde beziehungsweise Ausländer. Die bildhafte, grammatisch männliche Form bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes rettendem Handeln
  choice: Das konkrete Bild „Streck deine Hände … herab“ bleibt erhalten.
  alternative: Abstrakt wiedergeben, etwa „Greif vom Himmel her ein“.
  rationale: Der hebräische Text schildert Gottes Eingreifen in körperhafter Bildsprache. Eine Abstraktion würde das poetische und theologische Spannungsfeld unnötig auflösen.
- issue: Bild der vielen Wasser
  choice: Die Wasser bleiben als nicht aufgelöstes poetisches Bild im Haupttext stehen.
  alternative: Direkt als „überwältigende Gefahr“ paraphrasieren.
  rationale: Der Kontext legt Gefahr nahe, doch der Text benennt sie bildhaft als Wasser. Die Übersetzung wahrt dieses Bild und erläutert seine mögliche Funktion lediglich in der Fußnote.
- issue: Geschlechtlich markierte und idiomatische Wendung בְּנֵי נֵכָר
  choice: „Söhne der Fremde“ im Haupttext.
  alternative: „Fremde“ oder „Ausländer“.
  rationale: Damit bleiben sowohl die maskuline Form als auch die ungewöhnliche hebräische Sohnesformel sichtbar; die idiomatische Bedeutung wird nicht verschwiegen, sondern in der Fußnote angegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter Psalmenbildsprache. „Viele Wasser“ und „Söhne der Fremde“ klingen poetisch und leicht fremdartig, bleiben aber verständlich; die Fußnoten sichern die idiomatische Bedeutung. Die Pluralform „Hände“ folgt dem vorgelegten WLC-Text und weicht deshalb von der englischen Konsultationsfassung ab.
