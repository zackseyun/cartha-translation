  text: פְּצֵ֥/נִי וְ/הַצִּילֵ/נִי֮ מִ/יַּ֪ד בְּֽנֵי נֵ֫כָ֥ר אֲשֶׁ֣ר פִּ֭י/הֶם דִּבֶּר שָׁ֑וְא וִֽ֝/ימִינָ֗/ם יְמִ֣ין שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/011.yaml
  text: Rescue me and deliver me from the hand of foreigners[c][b][a], whose mouth speaks falsehood and whose right hand is a right hand of deceit.
translation:
  language: de
  text: Befreie mich und rette mich aus der Hand der Fremden,[a] deren Mund Unwahres redet[b] und deren rechte Hand eine rechte Hand der Täuschung ist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Söhne der Fremde“; gemeint sind Menschen fremder Herkunft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deren Mund Nichtiges“ beziehungsweise „Leeres redet“.'
    reason: lexical_alternative
  - marker: c
    text: Das Hebräische wiederholt „rechte Hand“. Sie kann für Macht, Handeln oder einen Eid bzw. eine Verpflichtung stehen.
    reason: cultural_note
lexical_decisions:
- source_word: פְּצֵנִי
  choice: Befreie mich
  rationale: Der Imperativ von פצה mit Suffix der 1. Person Singular bittet um Befreiung oder Rettung. „Befreie mich“ ist natürlich und hält den Ausdruck vom folgenden Verb נצל unterscheidbar.
- source_word: וְהַצִּילֵנִי
  choice: und rette mich
  rationale: Der Hifil-Imperativ von נצל bezeichnet das Herausreißen oder Retten aus Gefahr. „Rette mich“ bewahrt das zweite Verb und den parallelen Nachdruck.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die hebräische Wendung bezeichnet Macht oder Gewalt. Die Wiedergabe mit „Hand“ erhält zugleich das Körperbild, das später durch die „rechte Hand“ wieder aufgenommen wird.
- source_word: בְּנֵי נֵכָר
  choice: der Fremden
  rationale: Wörtlich „Söhne der Fremde/des Auslands“; idiomatisch sind Menschen fremder Herkunft gemeint. „Fremde“ gibt dies im Deutschen knapp und verständlich wieder, ohne die Wendung unnötig zu verengen.
- source_word: אֲשֶׁר
  choice: deren
  rationale: Das Relativwort leitet eine Beschreibung der Fremden ein. „Deren“ verbindet im Deutschen beide besitzanzeigenden Aussagen über Mund und rechte Hand natürlich.
- source_word: פִּיהֶם דִּבֶּר שָׁוְא
  choice: deren Mund Falsches redet
  rationale: שָׁוְא kann Nichtiges, Leeres oder Falsches bezeichnen. Im Parallelismus mit שֶׁקֶר liegt Unwahrhaftigkeit nahe; „Falsches“ bewahrt jedoch mehr Bedeutungsbreite als „Lügen“.
- source_word: וִימִינָם
  choice: und deren rechte Hand
  rationale: Die parallele Besitzkonstruktion wird beibehalten und die Bildsprache der Hand wörtlich bewahrt.
- source_word: יְמִין שָׁקֶר
  choice: eine rechte Hand des Betrugs
  rationale: Die ausdrückliche Wiederholung von „rechte Hand“ wird wie im Hebräischen erhalten. „Betrug“ gibt שֶׁקֶר hier als Täuschung und Unwahrhaftigkeit wieder, ohne die symbolische Bedeutung der rechten Hand festzulegen.
