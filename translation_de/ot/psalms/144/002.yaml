source:
  edition: WLC
  text: חַסְדִּ֥/י וּ/מְצוּדָתִ/י֮ מִשְׂגַּבִּ֪/י וּֽ/מְפַלְטִ֫/י לִ֥/י מָ֭גִנִּ/י וּ/ב֣/וֹ חָסִ֑יתִי הָ/רוֹדֵ֖ד עַמִּ֣/י תַחְתָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/002.yaml
  text: My steadfast love and my fortress[a], my stronghold and my deliverer, my shield, and in him I take refuge[b], the one who subdues peoples under me.
translation:
  language: de
  text: Meine Güte und meine Burg, meine hohe Festung und mein Retter, mein Schild; bei ihm suche ich Zuflucht, er, der mir mein Volk unterwirft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige alte Übersetzungen haben: „der mir Völker unterwirft“.'
    reason: alternative_reading
lexical_decisions:
- source_word: חַסְדִּי
  choice: meine Güte
  rationale: חֶסֶד bezeichnet beständige, loyale Güte und steht hier als Gottesbezeichnung. „Meine Güte“ ist im Deutschen würdig und verständlich; die ungewöhnliche persönliche Formulierung bleibt erhalten.
- source_word: מְצוּדָתִי
  choice: meine Festung
  rationale: Das Wort bezeichnet einen befestigten Schutzort; „Festung“ bewahrt das militärische Bild.
- source_word: מִשְׂגַּבִּי
  choice: meine sichere Höhe
  rationale: מִשְׂגָּב ist ein hoch gelegener, unzugänglicher Schutzort. „Sichere Höhe“ unterscheidet das Bild von der unmittelbar vorausgehenden Festung.
- source_word: מְפַלְטִי לִי
  choice: mein Retter
  rationale: Das Partizip bezeichnet den, der entkommen lässt oder rettet. Das zusätzliche לִי verstärkt die persönliche Beziehung, wird aber neben dem Possessivsuffix im natürlichen Deutschen nicht eigens wiederholt.
- source_word: מָגִנִּי
  choice: mein Schild
  rationale: Die direkte militärische Schutzmetapher wird mit „Schild“ beibehalten.
- source_word: וּבוֹ חָסִיתִי
  choice: bei dem ich Zuflucht suche
  rationale: חסה bedeutet, Schutz oder Zuflucht zu suchen. Der Relativanschluss ist im Deutschen natürlich und bezieht sich eindeutig auf Gott; das Perfekt beschreibt hier passend eine bestehende Vertrauenshaltung.
- source_word: הָרוֹדֵד
  choice: der … unterwirft
  rationale: Das Partizip von רדד bezeichnet das Unterwerfen beziehungsweise Unterordnen und passt zum königlichen Kontext.
- source_word: עַמִּי
  choice: mein Volk
  rationale: 'Der masoretische Text liest ausdrücklich den Singular mit Suffix: „mein Volk“. Diese Lesart erhält im Haupttext Vorrang; die alte pluralische Texttradition wird in der Fußnote genannt.'
- source_word: תַחְתָּי
  choice: mir unter
  rationale: Die räumliche Wendung bezeichnet Unterordnung unter die Herrschaft des Sprechers; „mir unterwirft“ gibt sie idiomatisch wieder.
theological_decisions:
- issue: Singular „mein Volk“ oder pluralische Lesart „Völker“ in עַמִּי
  choice: mein Volk
  alternative: Völker
  rationale: Der masoretische Konsonanten- und Vokaltext bietet „mein Volk“. Einige alte Übersetzungen spiegeln dagegen eine pluralische Lesart, die auch zur Parallele in Psalm 18,48 passt. Der Haupttext folgt dem WLC, ohne die bezeugte Alternative zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dichterischer Reihung der Gottesbezeichnungen. Die militärischen Schutzbilder und die auffällige Formulierung „meine Güte“ bleiben erhalten; unnötige deutsche Redundanz bei מְפַלְטִי לִי wird vermieden.
