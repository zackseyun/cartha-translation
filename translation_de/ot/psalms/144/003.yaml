base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/003.yaml
  text: O Yahweh[a], what is man that you know him[c][b], the son of man that you think of him?
translation:
  language: de
  text: Jahwe[a], was ist der Mensch, dass du ihn kennst, ein Menschenkind[b], dass du an ihn denkst?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH, der Gottesname; hier als „Jahwe“ wiedergegeben.
    reason: divine_name
  - marker: b
    text: Hebräisch „Sohn des sterblichen Menschen“; eine poetische Bezeichnung für einen Menschen, nicht ein messianischer Titel.
    reason: lexical_clarification
  - marker: c
    text: Die Formulierung erinnert eng an Psalm 8,5.
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: HERR
  rationale: Der Gottesname JHWH wird in der verbreiteten ehrfürchtigen deutschen Bibelkonvention mit „HERR“ wiedergegeben; die direkte Anrede ergibt sich ohne ein zusätzliches „O“ natürlich aus dem Kontext.
- source_word: מָה אָדָם
  choice: was ist der Mensch
  rationale: Bewahrt die rhetorische Frage nach der Geringfügigkeit des Menschen und die repräsentative Singularform des Hebräischen.
- source_word: וַתֵּדָעֵהוּ
  choice: dass du ihn kennst
  rationale: Gibt den lexikalischen Kern von ידע wieder und lässt die mögliche Bedeutung von persönlichem Kennen beziehungsweise wahrnehmender Zuwendung offen.
- source_word: בֶּן אֱנוֹשׁ
  choice: der Sohn eines Menschen
  rationale: Bewahrt das poetische Bild und den Parallelismus; אֱנוֹשׁ bezeichnet hier den sterblichen Menschen und die Wendung ist generisch, nicht als messianischer Titel gebraucht.
- source_word: וַתְּחַשְּׁבֵהוּ
  choice: dass du ihn beachtest
  rationale: חשב bezeichnet hier Gottes gedankliche Zuwendung beziehungsweise Beachtung; „beachtest“ ist im Deutschen natürlich und wahrt den Parallelismus zu „kennst“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: HERR
  alternative: Jahwe
  rationale: Die traditionelle deutsche Wiedergabe „HERR“ ist würdig und allgemein verständlich; „Jahwe“ würde den Eigennamen unmittelbarer abbilden.
- issue: Generisch-maskuline Menschenaussage in אָדָם / בֶּן אֱנוֹשׁ
  choice: der Mensch … der Sohn eines Menschen
  alternative: ein Mensch … ein Menschenkind
  rationale: Die gewählte Fassung erhält Singular, maskuline Bildsprache und poetischen Parallelismus, ohne die Stelle zu einem messianischen Titel umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrtem hebräischem Parallelismus. „HERR“ folgt der etablierten deutschen Bibelkonvention; die ungewöhnlichere Wendung „Sohn eines Menschen“ hält die Bildstruktur des Ausgangstextes sichtbar.
