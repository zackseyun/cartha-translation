  naturalness: „Jahwe, was ist der Mensch ... ein Menschenkind ...“ ist würdiges, modernes Standarddeutsch und erhält den poetischen Parallelismus. „An ihn denkst“ ist eine natürliche Entsprechung zu וַתְּחַשְּׁבֵהוּ. Die bisherige Formulierung „der Sohn eines Menschen“ klingt im Deutschen unnötig sperrig und kann eine individuelle Abstammung nahelegen.
