source:
  edition: WLC
  text: אַשְׁרֵ֣י הָ֭/עָם שֶׁ/כָּ֣כָה לּ֑/וֹ אַֽשְׁרֵ֥י הָ֝/עָ֗ם שֶׁ/יֲהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/015.yaml
  text: Blessed are the people for whom it is so[b][a]; blessed are the people whose God is Yahweh.
translation:
  language: de
  text: Glücklich ist das Volk, dem es so ergeht; glücklich ist das Volk, dessen Gott Jahwe ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die hebräische Glückpreisungsform bezeichnet einen beneidenswerten, gesegneten Zustand. „Glücklich ist“ ist im heutigen Deutsch natürlich und bewahrt den Charakter einer Seligpreisung, ohne ausdrücklich eine Segenshandlung auszudrücken.
- source_word: הָעָם
  choice: das Volk
  rationale: עָם bezeichnet hier eine als Einheit betrachtete Volksgemeinschaft; „das Volk“ entspricht dem poetischen und kollektiven Gebrauch.
- source_word: שֶׁכָּכָה לּוֹ
  choice: dem es so ergeht
  rationale: Die Verbindung aus Relativpartikel, כָּכָה („so“) und ל mit Suffix beschreibt idiomatisch das Volk, für das die zuvor geschilderten Verhältnisse gelten. „Dem es so ergeht“ ist natürlich und bleibt gegenüber der genauen Art dieses Zustands offen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהָיו
  choice: dessen Gott … ist
  rationale: Das maskuline Singularsuffix nimmt kollektiv auf „das Volk“ Bezug; die deutsche Genitivkonstruktion gibt dieses Zugehörigkeitsverhältnis klar wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt den Unterschied zwischen dem Eigennamen und dem Titel „Herr“.
- issue: Bedeutung von אַשְׁרֵי
  choice: Glücklich ist
  alternative: Gesegnet ist
  rationale: Die Form spricht einen bestehenden, beneidenswerten Zustand aus; „glücklich“ vermeidet, die Aussage stillschweigend als ausdrücklichen Segensakt zu deuten.
translation_notes:
  register: Moderne, verständliche und zugleich würdige Sprache. Der parallele Aufbau der beiden Halbverse und die kollektive Singularform „das Volk“ bleiben erhalten.
