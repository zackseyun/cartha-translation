  source_fidelity: Der Parallelismus und die beiden Glückpreisungen geben אַשְׁרֵי ... אַשְׁרֵי treffend wieder. „das Volk“ entspricht הָעָם als kollektivem Singular. „dem es so ergeht“ überträgt שֶׁכָּכָה לּוֹ idiomatisch und lässt den konkreten, aus dem vorherigen Kontext zu erschließenden Zustand offen. „dessen Gott Jahwe ist“ gibt die possessive Beziehung in אֱלֹהָיו sowie den ausdrücklich genannten Gottesnamen יְהוָה angemessen wieder.
