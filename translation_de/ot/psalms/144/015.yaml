  terminology: „Jahwe“ ist die im Deutschen etablierte Form des Gottesnamens und unterscheidet ihn sachgerecht von einem Titel. „Glücklich“ ist für אַשְׁרֵי eine zulässige, natürliche Wiedergabe der Glückpreisung; sie behauptet keinen ausdrücklichen Segensakt.
