base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/012.yaml
  text: May our sons be like well-grown plants in their youth[c][b][a], and our daughters like corner pillars carved in the pattern of a palace.
translation:
  language: de
  text: Unsere Söhne seien[a] in ihrer Jugend wie wohlgewachsene Pflanzen, und unsere Töchter wie nach dem Muster eines Palastes behauene Eckpfeiler.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass unsere Söhne …“ Das einleitende hebräische Wort ist eigentlich eine Relativpartikel; der genaue Anschluss an den vorhergehenden Vers ist umstritten.'
    reason: syntaktische_ambiguitaet
  - marker: b
    text: 'Oder: „eines Tempels“ beziehungsweise „einer großen Halle“. Das hebräische Wort kann einen Palast oder einen Tempel bezeichnen.'
    reason: lexikalische_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: seien
  rationale: Die formal relative Partikel eröffnet hier im Zusammenhang wahrscheinlich einen Wunsch beziehungsweise das erhoffte Ergebnis des vorausgehenden Gebets. Der deutsche Konjunktiv „seien“ gibt diesen optativischen Sinn knapp und würdig wieder.
- source_word: בָּנֵינוּ / בְּנוֹתֵינוּ
  choice: unsere Söhne / unsere Töchter
  rationale: Die geschlechtsspezifischen Bezeichnungen werden beibehalten und bilden die poetische Parallelität des Hebräischen ab.
- source_word: כִּנְטִעִים מְגֻדָּלִים
  choice: wie Pflanzen, hochgewachsen
  rationale: נְטִעִים bezeichnet Gepflanztes beziehungsweise Pflanzen, ohne die Bildwelt zwingend auf junge Bäume einzuengen. Das passive Partizip מְגֻדָּלִים beschreibt erfolgreiches Heranwachsen; „hochgewachsen“ ist bildhaft und natürlich.
- source_word: בִּנְעוּרֵיהֶם
  choice: in ihrer Jugend
  rationale: Die Wendung bezeichnet am natürlichsten den Zeitraum des jugendlichen Heranwachsens und wird ohne zusätzliche zeitliche Deutung wiedergegeben.
- source_word: כְזָוִיּוֹת
  choice: wie … Eckpfeiler
  rationale: Das Wort bezeichnet wörtlich Ecken oder Winkel. Im architektonischen Vergleich sind gestaltete Bauteile an den Ecken gemeint; „Eckpfeiler“ vermittelt sowohl ihre tragende als auch ihre repräsentative Wirkung, bleibt aber als kontextuelle Deutung kenntlich.
- source_word: מְחֻטָּבוֹת
  choice: kunstvoll behauen
  rationale: Das passive Partizip bezeichnet durch Hauen oder Schneiden geformte Bauteile. „Kunstvoll behauen“ passt zur palastartigen Architektur und drückt die sorgfältige Gestaltung aus.
- source_word: תַּבְנִית
  choice: nach dem Vorbild
  rationale: Das Substantiv kann Form, Gestalt, Muster oder Bauart bezeichnen. „Nach dem Vorbild“ gibt die gestalterische Beziehung idiomatisch wieder, ohne eine bestimmte Ornamentik vorauszusetzen.
- source_word: הֵיכָל
  choice: Palast
  rationale: Das Wort kann einen Palast, einen Tempel oder eine große Halle bezeichnen. Im Bild häuslichen und gesellschaftlichen Wohlergehens ist „Palast“ eine naheliegende Lesart; die mögliche kultische Bedeutung wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Syntaktische Funktion von אֲשֶׁר und Bezug des Verses
  choice: 'Wunsch für das eigene Volk: „Unsere Söhne seien …“'
  alternative: 'Relativ- oder Folgesatz: „damit unsere Söhne …“ beziehungsweise eine Beschreibung der Fremden aus Vers 11'
  rationale: Der Konjunktiv passt zum Gebets- und Segenszusammenhang und ergibt im Deutschen einen verständlichen poetischen Satz. Da אֲשֶׁר formal eine Relativpartikel ist und der Anschluss an den vorigen Vers unterschiedlich verstanden werden kann, bleibt die syntaktische Alternative in einer Fußnote sichtbar.
- issue: Bedeutung von הֵיכָל im architektonischen Vergleich
  choice: Palast
  alternative: Tempel oder große Halle
  rationale: Der unmittelbare Zusammenhang schildert umfassendes Wohlergehen, nicht ausdrücklich den Kult. „Palast“ vermittelt die gemeinte Pracht, ohne eine Tempelanspielung festzuschreiben; „Tempel“ bleibt jedoch lexikalisch möglich und wird vermerkt.
translation_notes:
  register: Moderne, gehobene Psalmsprache mit klarer Parallelstruktur. „Seien“ bewahrt den Wunschcharakter, „hochgewachsen“ das Wachstumsbild und „kunstvoll behauene Eckpfeiler“ die Verbindung von Stärke und architektonischer Schönheit. Die beiden sachlich wichtigen Mehrdeutigkeiten werden knapp in Fußnoten offengelegt.
