  text: לְ/דָוִ֨ד בָּ֘ר֤וּךְ יְהוָ֨ה צוּרִ֗/י הַֽ/מְלַמֵּ֣ד יָדַ֣/י לַ/קְרָ֑ב אֶ֝צְבְּעוֹתַ֗/י לַ/מִּלְחָמָֽה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/001.yaml
  text: Of David. Blessed be Yahweh[a], my rock, who trains my hands for battle, my fingers for war.
translation:
  language: de
  text: 'Von David.[a]


    Gepriesen sei Jahwe, mein Fels,

    der meine Hände für den Kampf schult,

    meine Finger für den Krieg.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für David“ beziehungsweise „David zugehörig“. Die hebräische Präposition in der Psalmüberschrift kann Urheberschaft, Zuordnung oder Widmung ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die knappe, in deutschen Psalmüberschriften geläufige Form bewahrt die Zuordnung zu David, ohne im Haupttext eindeutig zwischen Urheberschaft, Zugehörigkeit und Widmung zu entscheiden; die Spannweite der Präposition ל wird in der Fußnote erläutert.
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Die doxologische Wendung wird im Deutschen natürlich und liturgisch würdig wiedergegeben. „Gesegnet sei“ wäre formnäher, klingt bei einer Aussage über Gott im heutigen Deutsch jedoch weniger idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im modernen Standarddeutsch übliche Form.
- source_word: צוּרִי
  choice: mein Fels
  rationale: Die konkrete hebräische Metapher für Beständigkeit und Schutz bleibt erhalten und wird nicht deutend durch „meine Zuflucht“ ersetzt.
- source_word: הַמְלַמֵּד
  choice: der … schult
  rationale: Das Partizip bezeichnet Gottes fortdauerndes, kennzeichnendes Handeln. „Schult“ vermittelt im militärischen Zusammenhang Anleitung und Einübung, ohne die Bildsprache zu verflachen.
- source_word: יָדַי
  choice: meine Hände
  rationale: Die konkrete Körperbezeichnung und ihre Parallelität zu „meine Finger“ werden bewahrt.
- source_word: לַקְרָב
  choice: für den Kampf
  rationale: קְרָב bezeichnet Kampf oder Schlacht; „für den Kampf“ ist prägnant und im Zusammenhang natürlich.
- source_word: אֶצְבְּעוֹתַי
  choice: meine Finger
  rationale: Die spezifische Körperbezeichnung wird entsprechend dem hebräischen Parallelismus wörtlich erhalten.
- source_word: לַמִּלְחָמָה
  choice: für den Krieg
  rationale: Die ausdrückliche militärische Bedeutung von מִלְחָמָה und die knappe Parallelstruktur des Verses bleiben erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Auf Gott bezogene militärische Bildsprache
  choice: Die konkrete Aussage über Hände, Kampf, Finger und Krieg bleibt erhalten.
  alternative: Verallgemeinerung zu Kraft, Befähigung oder geistlichem Kampf
  rationale: Der hebräische Text spricht ausdrücklich von der Vorbereitung auf bewaffneten Kampf. Diese historische und theologische Spannung darf nicht durch Spiritualisierung oder Abschwächung aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Zeilengliederung. Die konkrete Felsmetapher und der Parallelismus der militärischen Körperbilder bleiben erhalten; „schult“ vermeidet sowohl altertümliches „lehrt“ in dieser Konstruktion als auch das umgangssprachlicher wirkende „trainiert“.
