  text: אָ֭דָם לַ/הֶ֣בֶל דָּמָ֑ה יָ֝מָ֗י/ו כְּ/צֵ֣ל עוֹבֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/004.yaml
  text: Man is like a breath[b][a]; his days are like a passing shadow.
translation:
  language: de
  text: Der Mensch gleicht einem Hauch[a]; seine Tage sind wie ein vorüberziehender Schatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einem Dunst«, »einer Nichtigkeit« oder »einer Leere«. Das hebräische Wort הֶבֶל betont hier die Vergänglichkeit und Substanzlosigkeit des menschlichen Lebens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: der Mensch
  rationale: Das Substantiv bezeichnet hier in einer allgemeinen Aussage den Menschen beziehungsweise die Menschheit. »Der Mensch« bewahrt die singularische, sprichwortartige Form und ist im Deutschen generisch verständlich.
- source_word: לַהֶבֶל
  choice: einem Hauch
  rationale: הֶבֶל bezeichnet wörtlich einen Hauch oder Dunst und vermittelt hier besonders Vergänglichkeit und Substanzlosigkeit. »Hauch« erhält das konkrete poetische Bild.
- source_word: דָּמָה
  choice: gleicht
  rationale: Das Verb bedeutet »gleich sein, ähneln«. »Gleicht« gibt den Vergleich knapp und in einem würdigen poetischen Register wieder.
- source_word: יָמָיו
  choice: seine Tage
  rationale: Die wörtliche possessive Mehrzahl bezeichnet die begrenzte Lebenszeit des Menschen und wird im Deutschen natürlich mit »seine Tage« wiedergegeben.
- source_word: כְצֵל
  choice: wie ein Schatten
  rationale: כְּ leitet einen Vergleich ein; die Wiedergabe bewahrt das Bild des flüchtigen Schattens.
- source_word: עוֹבֵר
  choice: vorüberziehender
  rationale: Das Partizip von עבר bezeichnet etwas, das weiter- oder vorüberzieht. »Vorüberziehend« bewahrt Bewegung und fortdauernden Vorgang, ohne die Aussage stärker als »vergehend« auszulegen.
