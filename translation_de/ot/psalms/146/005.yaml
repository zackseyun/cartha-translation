source:
  edition: WLC
  text: אַשְׁרֵ֗י שֶׁ֤/אֵ֣ל יַעֲקֹ֣ב בְּ/עֶזְר֑/וֹ שִׂ֝בְר֗/וֹ עַל יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/005.yaml
  text: Blessed is the one whose help is the God of Jacob[a], whose hope is in Yahweh his God.
translation:
  language: de
  text: Glücklich ist, wer den Gott Jakobs als Hilfe hat[a] und seine Hoffnung auf Jahwe, seinen Gott, setzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer den Gott Jakobs als Helfer hat“.'
    reason: 'Lexikalische Alternative: עֵזֶר kann sowohl die Hilfe als auch den Helfer bezeichnen.'
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die hebräische Makarismusform bezeichnet einen beneidenswert guten, gesegneten Zustand. „Glücklich ist“ ist im modernen Deutschen natürlich und bewahrt die weisheitlich-psalmische Aussageform.
- source_word: שֶׁאֵל יַעֲקֹב בְּעֶזְרוֹ
  choice: wer den Gott Jakobs als Hilfe hat
  rationale: Die Formulierung gibt die ungewöhnliche nominale Konstruktion verständlich wieder, ohne den „Gott Jakobs“ zu einem bloßen abstrakten Hilfsmittel zu machen. Zugleich bleibt offen, ob עֵזֶר eher „Hilfe“ oder personal „Helfer“ bezeichnet.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der Personenname wird nach geläufiger deutscher Konvention wiedergegeben; „Gott Jakobs“ bewahrt den bundesgeschichtlichen Titel.
- source_word: שִׂבְרוֹ
  choice: seine Hoffnung
  rationale: Das Substantiv bezeichnet erwartungsvolle Hoffnung. „Hoffnung“ ist hier die natürliche deutsche Entsprechung.
- source_word: עַל
  choice: auf ... setzt
  rationale: In Verbindung mit Hoffnung bezeichnet עַל deren Ziel und tragenden Grund. Die deutsche Wendung „seine Hoffnung auf jemanden setzen“ drückt diese Ausrichtung idiomatisch aus.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt; „Jahwe“ ist die etablierte deutsche Form.
- source_word: אֱלֹהָיו
  choice: seinen Gott
  rationale: Das maskuline Singularsuffix bezieht sich auf die im Makarismus bezeichnete Person und drückt ihre persönliche Beziehung zu Gott aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Implizites Subjekt des Makarismus
  choice: wer
  alternative: der Mann, dessen
  rationale: Im Hebräischen steht kein ausdrückliches אִישׁ („Mann“). Das deutsche „wer“ bewahrt die singularische, allgemein formulierte Aussage, ohne eine nicht vorhandene Personenbezeichnung hinzuzufügen.
- issue: Beziehung des Gottes Jakobs zur seliggepriesenen Person
  choice: als Hilfe
  alternative: als Helfer
  rationale: עֵזֶר kann die gewährte Hilfe und kontextuell auch den Helfer bezeichnen. Der Haupttext bleibt näher am Nomen „Hilfe“; die personale Alternative wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Relativsätze werden mit zweimaligem „wer“ klar gegliedert. „Glücklich ist“ vermeidet das im heutigen Deutsch leicht missverständliche „gesegnet ist“, während die Makarismusform erhalten bleibt.
