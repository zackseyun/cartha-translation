base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/002.yaml
  text: I will praise Yahweh all my life[a]; I will sing praises to my God as long as I live.
translation:
  language: de
  text: Ich will Jahwe loben mein Leben lang[a]; ich will meinem Gott Loblieder singen, solange ich lebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „in meinem Leben“; die parallele Wendung im zweiten Halbvers bedeutet „während meines Fortbestehens/Daseins“. Beide Ausdrücke bezeichnen hier die Dauer des Lebens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: Ich will loben
  rationale: Die Kohortativform der 1. Person Singular drückt hier den entschlossenen Vorsatz des Beters aus. „Ich will loben“ gibt diese willentliche Ausrichtung natürlich wieder, ohne eine ununterbrochene Handlung hineinzulesen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen ausdrücklich stehende Eigenname erhalten bleibt und nicht durch einen Titel ersetzt wird.
- source_word: בְּחַיָּי
  choice: mein Leben lang
  rationale: Wörtlich etwa „in meinem Leben“; im poetischen Zusammenhang bezeichnet die Wendung die gesamte Lebensdauer. „Mein Leben lang“ ist im Deutschen idiomatisch und bewahrt den zeitlichen Sinn.
- source_word: אֲזַמְּרָה
  choice: ich will Loblieder singen
  rationale: Das Verb זמר bezeichnet besonders das Singen oder Musizieren zum Lob Gottes. „Loblieder singen“ bewahrt sowohl den musikalischen als auch den lobpreisenden Gehalt.
- source_word: לֵאלֹהַי
  choice: meinem Gott
  rationale: 'Bei „Loblieder singen“ wird die mit ל markierte Zielrichtung im Deutschen natürlich durch den Dativ ausgedrückt: „meinem Gott Loblieder singen“.'
- source_word: בְּעוֹדִי
  choice: solange ich da bin
  rationale: Die Wendung bezeichnet die Fortdauer oder das weitere Dasein des Sprechers. „Solange ich da bin“ erhält gegenüber dem parallelen „mein Leben lang“ die eigenständige Nuance des hebräischen Ausdrucks und klingt zugleich natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Umschrift und bewahrt den Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis der beiden zeitlichen Aussagen
  choice: „mein Leben lang“ / „solange ich da bin“
  alternative: Beide Halbverse mit „solange ich lebe“ wiedergeben
  rationale: Die parallelen Wendungen beziehen sich beide auf die Lebensdauer, sind im Hebräischen aber nicht identisch. Die Übersetzung wahrt sowohl den Parallelismus als auch die leichte Bedeutungsverschiebung von „Leben“ zu „Fortdauer/Dasein“.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Ton. Die parallele Satzform und der entschlossene Klang der beiden Kohortative bleiben erhalten; „Loblieder“ verdeutlicht den musikalischen Lobpreis, ohne konfessionelle Fachsprache einzuführen.
