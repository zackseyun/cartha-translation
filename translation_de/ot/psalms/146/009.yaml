  text: יְהוָ֤ה שֹׁ֘מֵ֤ר אֶת גֵּרִ֗ים יָת֣וֹם וְ/אַלְמָנָ֣ה יְעוֹדֵ֑ד וְ/דֶ֖רֶךְ רְשָׁעִ֣ים יְעַוֵּֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/009.yaml
  text: Yahweh watches over the sojourners[a]; he upholds the fatherless and the widow[b], but he twists the way of the wicked.
translation:
  language: de
  text: Jahwe beschützt die Fremden[a]; er richtet Waisen und Witwen auf, doch den Weg der Gottlosen macht er krumm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Zugewanderten« beziehungsweise »die Fremdlinge«; gemeint sind nicht einheimische Menschen, die dauerhaft unter dem Volk leben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: »doch den Weg der Gottlosen bringt er ins Verderben«.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen stehenden Gottesnamen als gebräuchliche deutsche Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: שֹׁמֵר
  choice: beschützt
  rationale: Drückt die fortdauernde, bewahrende Fürsorge aus, die das Partizip bezeichnet, und klingt im modernen Deutsch natürlich.
- source_word: גֵּרִים
  choice: die Fremden
  rationale: Bezeichnet hier nicht einreisende Besucher, sondern nicht einheimische Menschen, die unter dem Volk leben und besonderen Schutz benötigen; die Fußnote präzisiert diese soziale Bedeutung.
- source_word: יָתוֹם וְאַלְמָנָה
  choice: Waisen und Witwen
  rationale: Die hebräischen Singularformen sind kollektiv gebraucht. Der deutsche Plural bezeichnet die schutzbedürftigen Gruppen natürlich und inklusiv, ohne beim יָתוֹם unnötig festzulegen, ob beide Eltern verstorben sind.
- source_word: יְעוֹדֵד
  choice: richtet ... auf
  rationale: Bewahrt das Bild stärkender und stützender Fürsorge und bildet einen anschaulichen Gegensatz zum Krummmachen im letzten Versglied.
- source_word: דֶרֶךְ
  choice: Weg
  rationale: Bewahrt die poetische Metapher für Lebensführung, Vorhaben oder Lebenslauf.
- source_word: רְשָׁעִים
  choice: die Gottlosen
  rationale: Gibt die substantivierte moralische Kategorie in psalmtypischer, würdiger Sprache wieder, ohne sie auf einzelne Übeltaten zu verengen.
- source_word: יְעַוֵּת
  choice: macht ... krumm
  rationale: Bildet die Grundbedeutung des Piel von עות formal und anschaulich ab, ohne die Metapher vorschnell als Vernichtung oder Scheitern auszulegen.
theological_decisions:
- issue: Darstellung des göttlichen Gerichts im letzten Versglied
  choice: doch den Weg der Gottlosen macht er krumm
  alternative: doch den Weg der Gottlosen bringt er ins Verderben
  rationale: Die Übersetzung erhält das hebräische Bild des Krümmens oder Verformens. So bleibt offen, ob damit Vereitelung, Irreführung im Gericht oder der Untergang ihres Lebenswegs als Ergebnis gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelität. »Jahwe« bewahrt den Eigennamen. Die kollektiven Singularformen werden idiomatisch als Plurale wiedergegeben. Das ungewohnte, aber quellennähere Bild »den Weg ... krumm machen« bleibt im Haupttext stehen und wird durch eine Fußnote erläutert.
