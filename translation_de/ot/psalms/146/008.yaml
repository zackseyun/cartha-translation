id: PSA.146.8
reference: Psalms 146:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָ֤ה פֹּ֘קֵ֤חַ עִוְרִ֗ים יְ֭הוָה זֹקֵ֣ף כְּפוּפִ֑ים יְ֝הוָ֗ה אֹהֵ֥ב צַדִּיקִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/008.yaml
  text: Yahweh opens the eyes of the blind[a]; Yahweh raises up those who are bowed down; Yahweh loves the righteous.
translation:
  language: de
  text: Jahwe öffnet den Blinden die Augen[a]; Jahwe richtet die Gebeugten auf; Jahwe liebt die Gerechten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „macht die Blinden sehend“. Wörtlich spricht das Hebräische vom Öffnen der Blinden, das heißt vom Öffnen ihrer Augen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: פֹּקֵחַ עִוְרִים
  choice: öffnet den Blinden die Augen
  rationale: Die Formulierung bewahrt das konkrete hebräische Bild des Öffnens und macht im Deutschen natürlich deutlich, dass die Augen der Blinden gemeint sind.
- source_word: זֹקֵף
  choice: richtet ... auf
  rationale: „Aufrichten“ umfasst sowohl das körperliche Gerademachen als auch die Wiederherstellung bedrückter Menschen.
- source_word: כְּפוּפִים
  choice: die Gebeugten
  rationale: Die substantivierte Bezeichnung bewahrt die körperliche und übertragene Bedeutung, ohne die Ursache des Gebeugtseins festzulegen.
- source_word: אֹהֵב
  choice: liebt
  rationale: Das schlichte Präsens entspricht der fortdauernden Aussage des hebräischen Partizips.
- source_word: צַדִּיקִים
  choice: die Gerechten
  rationale: Dies ist die geläufige und inhaltlich breite deutsche Wiedergabe der substantivierten Pluralform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet den Eigennamen Gottes; „Jahwe“ gibt ihn in der im Deutschen üblichen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von כְּפוּפִים
  choice: die Gebeugten
  alternative: die Gebückten
  rationale: „Die Gebeugten“ lässt sowohl körperliche Gebrechlichkeit als auch Bedrückung und Erniedrigung anklingen und legt den Vers nicht auf nur eine Lesart fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederholung von „Jahwe“ und der parallele Satzbau des hebräischen Verses bleiben erhalten.
