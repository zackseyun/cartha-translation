  text: אַל תִּבְטְח֥וּ בִ/נְדִיבִ֑ים בְּ/בֶן אָדָ֓ם שֶׁ֤/אֵֽין ל֥/וֹ תְשׁוּעָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/003.yaml
  text: Do not trust in princes[a], in a son of man[b], in whom there is no salvation.
translation:
  language: de
  text: Vertraut nicht auf Fürsten, nicht auf einen Menschen,[a] von dem keine Rettung zu erwarten ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf einen Menschensohn“; gemeint ist hier ein sterblicher Mensch, nicht ein messianischer Titel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Hilfe“; auch „Heil“ oder „Befreiung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּבְטְחוּ
  choice: Vertraut nicht
  rationale: Die Negationspartikel אַל mit der Verbform drückt ein Verbot aus; die knappe deutsche Form gibt dies natürlich und unmittelbar wieder.
- source_word: בִנְדִיבִים
  choice: auf Fürsten
  rationale: נְדִיבִים bezeichnet hier hochgestellte, einflussreiche Menschen. „Fürsten“ bewahrt den gesellschaftlich-politischen Sinn und den würdevollen Ton.
- source_word: בְּבֶן אָדָם
  choice: auf einen Menschen
  rationale: Wörtlich steht „auf einen Menschensohn“. Im Kontext ist dies eine hebräische Bezeichnung für einen sterblichen Menschen und kein messianischer Titel; „einen Menschen“ vermittelt den gemeinten Sinn im heutigen Deutsch.
- source_word: שֶׁאֵין לוֹ
  choice: bei dem es keine … gibt
  rationale: Die Relativkonstruktion mit Existenzverneinung wird so natürlich wiedergegeben, ohne die Aussage über das menschliche Gegenüber umzudeuten.
- source_word: תְשׁוּעָה
  choice: Rettung
  rationale: תְשׁוּעָה kann Rettung, Befreiung oder Heil bezeichnen. „Rettung“ erhält hier die Breite des Ausdrucks und passt zur Warnung, sich nicht auf menschliche Macht zu verlassen.
theological_decisions:
- issue: Bedeutung von בֶן אָדָם („Menschensohn“)
  choice: generischer sterblicher Mensch
  alternative: formale Wiedergabe als „Menschensohn“ mit möglicher messianischer Assoziation
  rationale: Der Parallelismus nennt zunächst Fürsten und dann allgemein einen Menschen. Der Ausdruck bezeichnet hier die Sterblichkeit und Begrenztheit des Menschen, nicht einen messianischen Titel.
- issue: Bedeutungsumfang von תְשׁוּעָה
  choice: Rettung
  alternative: Heil oder Hilfe
  rationale: „Rettung“ wahrt sowohl die konkrete Bedeutung von Befreiung als auch den weiteren theologischen Klang, ohne die Aussage ausschließlich auf ewiges Heil oder bloße Alltagshilfe festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die Wiederholung „nicht auf“ bildet die hebräische Parallelstruktur ab; „bei dem“ vermeidet eine unnötig altertümliche Formulierung.
