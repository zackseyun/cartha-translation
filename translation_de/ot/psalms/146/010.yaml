id: PSA.146.10
reference: Psalms 146:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִמְלֹ֤ךְ יְהוָ֨ה לְ/עוֹלָ֗ם אֱלֹהַ֣יִ/ךְ צִ֭יּוֹן לְ/דֹ֥ר וָ/דֹ֗ר הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/010.yaml
  text: Yahweh will reign forever—your God[a], Zion, from generation to generation. Hallelujah!
translation:
  language: de
  text: Jahwe wird ewig herrschen, dein Gott, Zion, von Generation zu Generation. Halleluja![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Preist Jah!“ „Jah“ ist die Kurzform des Gottesnamens Jahwe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְלֹךְ
  choice: wird herrschen
  rationale: Das Qal-Imperfekt bezeichnet hier in einer hymnischen Aussage die fortdauernde, in die Zukunft reichende Königsherrschaft; „wird herrschen“ gibt diese Verbform im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: לְעוֹלָם
  choice: ewig
  rationale: Die Präposition mit עוֹלָם bezeichnet hier unbegrenzte Dauer; „ewig“ ist knapp, idiomatisch und dem Lobpreisregister angemessen.
- source_word: אֱלֹהַיִךְ
  choice: dein Gott
  rationale: Das feminine Singularsuffix richtet sich an das personifizierte Zion; „dein Gott“ bewahrt diese direkte Zuordnung.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der Ortsname wird transliteriert und als Anrede verstanden. Die Stellung nach „dein Gott“ bewahrt die kompakte hebräische Struktur.
- source_word: לְדֹר וָדֹר
  choice: von Generation zu Generation
  rationale: Die feste Wendung beschreibt die ununterbrochene Dauer über aufeinanderfolgende Generationen hinweg.
- source_word: הַלְלוּ יָהּ
  choice: Halleluja!
  rationale: Die etablierte deutsche liturgische Form gibt den hebräischen Zuruf natürlich wieder; seine wörtliche Bedeutung wird in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Wiedergabe als Eigenname wahrt diese Unterscheidung, ohne ihn durch einen Titel zu ersetzen.
- issue: Zeitlicher Aspekt von יִמְלֹךְ
  choice: wird herrschen
  alternative: herrscht
  rationale: Das Imperfekt kann durativ oder zukünftig verstanden werden. Die Zukunftsform bewahrt die vorwärtsgerichtete Bekräftigung, ohne die gegenwärtige Herrschaft auszuschließen.
- issue: Wiedergabe von הַלְלוּ יָהּ
  choice: Halleluja!
  alternative: Preist Jah!
  rationale: Die geläufige liturgische Lehnform ist verständlich und textnah; die transparente wörtliche Bedeutung steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Psalmende mit knapper hymnischer Syntax. „Generation“ ist gegenwärtiges Standarddeutsch; „Halleluja“ wahrt den vertrauten liturgischen Klang. Der Fußnotenmarker steht unmittelbar nach dem erläuterten Ausdruck.
