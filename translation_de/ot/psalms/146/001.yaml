source:
  edition: WLC
  text: הַֽלְלוּ יָ֡הּ הַלְלִ֥י נַ֝פְשִׁ֗/י אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/001.yaml
  text: Praise Yah! Praise Yahweh[a], my soul!
translation:
  language: de
  text: Preist Jah! Preise Jahweh, meine Seele!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Preist
  rationale: Der Imperativ Plural von הלל ist ein gemeinschaftlicher Aufruf. „Preist“ bildet die Mehrzahl im Deutschen ausdrücklich ab.
- source_word: יָהּ
  choice: Jah
  rationale: Die poetische Kurzform des Gottesnamens wird als eigener Name wiedergegeben und nicht in „Halleluja“ aufgelöst.
- source_word: הַלְלִי
  choice: Preise
  rationale: Der Imperativ Feminin Singular richtet sich unmittelbar an נַפְשִׁי; „Preise“ bewahrt diese persönliche Selbstaufforderung.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Im poetischen Selbstgespräch bezeichnet נֶפֶשׁ die eigene Seele beziehungsweise das eigene Selbst; „meine Seele“ ist hier natürlich und würdevoll.
- source_word: אֶת
  choice: nicht eigens wiedergegeben
  rationale: Der direkte Objektmarker besitzt keinen eigenen lexikalischen Gehalt; seine Funktion ergibt sich aus dem deutschen Satzbau.
- source_word: יְהוָה
  choice: Jahweh
  rationale: Der Tetragrammaton wird als Gottes Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe von יָהּ und יְהוָה im selben Vers
  choice: יָהּ als „Jah“ und יְהוָה als „Jahweh“
  alternative: „Halleluja“ und „der HERR“ oder beide Namensformen durch „der HERR“ ersetzen
  rationale: Der hebräische Text verwendet zunächst die poetische Kurzform und anschließend den vollständigen Gottesnamen. Die differenzierte Wiedergabe bewahrt diese Formvariation und lässt beide unmittelbaren Gottesbezeichnungen erkennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei parallelen Imperative werden durch „Preist“ (Plural) und „Preise“ (Singular in der Selbstanrede) unterschieden. Die knappe Ausrufstruktur des Hebräischen bleibt erhalten.
