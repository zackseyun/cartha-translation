  text: עֹשֶׂ֤ה מִשְׁפָּ֨ט לָ/עֲשׁוּקִ֗ים נֹתֵ֣ן לֶ֭חֶם לָ/רְעֵבִ֑ים יְ֝הוָ֗ה מַתִּ֥יר אֲסוּרִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/007.yaml
  text: who executes justice for the oppressed[a], who gives bread to the hungry[b]. Yahweh frees the prisoners.
translation:
  language: de
  text: der den Unterdrückten Recht verschafft[a], der den Hungrigen Brot gibt. Jahwe befreit die Gefangenen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Unterdrückten Recht spricht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: löst die Gebundenen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפָּט
  choice: Recht verschafft
  rationale: Die Verbindung bezeichnet hier fortdauerndes göttliches Handeln zugunsten bedrängter Menschen. „Recht verschaffen“ gibt die soziale und rechtliche Stoßrichtung im heutigen Deutsch natürlich wieder.
- source_word: לָעֲשׁוּקִים
  choice: den Unterdrückten
  rationale: Das substantivierte Passivpartizip bezeichnet Menschen, die Unterdrückung erleiden; die knappe deutsche Form bewahrt diese Aussage.
- source_word: נֹתֵן לֶחֶם
  choice: Brot gibt
  rationale: Die Übersetzung folgt der konkreten Wortwahl des Hebräischen und verallgemeinert לֶחֶם nicht unnötig zu „Nahrung“.
- source_word: לָרְעֵבִים
  choice: den Hungrigen
  rationale: Die substantivische Wiedergabe ist im Deutschen klar und passt unmittelbar zu „Brot gibt“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in der im Deutschen üblichen Form transliteriert und nicht durch einen Titel ersetzt.
- source_word: מַתִּיר אֲסוּרִים
  choice: befreit die Gefangenen
  rationale: מַתִּיר bezeichnet das Lösen oder Freilassen; zusammen mit אֲסוּרִים ergibt „befreit die Gefangenen“ eine klare, natürliche Wiedergabe, während das Bild des Gebundenseins in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration wahrt dies, ohne den Namen durch den traditionellen Ersatztitel zu ersetzen.
- issue: Reichweite von מַתִּיר אֲסוּרִים
  choice: befreit die Gefangenen
  alternative: löst die Gebundenen
  rationale: Die Hauptfassung bezeichnet konkret die Befreiung von Gefangenen; die Alternative bewahrt die breitere und bildhaftere Bedeutung von Menschen, die gebunden sind, ohne diese Spannung stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Partizipien werden als Relativsätze wiedergegeben, passend zum syntaktischen Anschluss an den vorhergehenden Vers. Die konkreten Begriffe „Brot“ und „Gefangene“ bleiben erhalten.
