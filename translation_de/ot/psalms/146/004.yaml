  text: תֵּצֵ֣א ר֭וּח/וֹ יָשֻׁ֣ב לְ/אַדְמָת֑/וֹ בַּ/יּ֥וֹם הַ֝/ה֗וּא אָבְד֥וּ עֶשְׁתֹּנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/004.yaml
  text: His breath goes out[a]; he returns to his ground; on that very day his plans perish.
translation:
  language: de
  text: Sein Atem entweicht[a]; er kehrt zu seinem Erdboden zurück; an jenem Tag vergehen seine Pläne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sein Geist entweicht.« Das hebräische Wort רוּחַ kann »Atem« oder »Geist« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּצֵא
  choice: geht fort
  rationale: Das Verb יצא bezeichnet hier das Fortgehen des Lebensatems beim Tod. »Geht fort« bewahrt das konkrete Bild und klingt im Deutschen natürlich.
- source_word: רוּחוֹ
  choice: sein Atem
  rationale: רוּחַ kann »Atem«, »Wind« oder »Geist« bedeuten. Im Zusammenhang mit Tod und Rückkehr zur Erde gibt »Atem« den Lebensatem wieder, ohne eine weitergehende anthropologische Aussage festzulegen; »Geist« bleibt als Fußnotenalternative erhalten.
- source_word: יָשֻׁב
  choice: er kehrt zurück
  rationale: שוב bedeutet »zurückkehren«. Als Subjekt ist im Parallelismus wieder der Mensch zu verstehen, der zur Erde zurückkehrt.
- source_word: לְאַדְמָתוֹ
  choice: zu seiner Erde
  rationale: אֲדָמָה bezeichnet Erdboden oder Erde; das Possessivsuffix wird mit »seiner« ausdrücklich wiedergegeben. »Staub« würde einen Begriff aus anderen Texten eintragen, der hier nicht steht.
- source_word: בַּיּוֹם הַהוּא
  choice: noch am selben Tag
  rationale: Die Formulierung betont die unmittelbare zeitliche Folge. »Noch am selben Tag« gibt diese Wirkung idiomatisch wieder.
- source_word: אָבְדוּ
  choice: gehen … zugrunde
  rationale: אבד bezeichnet Untergang, Scheitern oder Aufhören. Die deutsche Wendung ist gewichtig und drückt aus, dass die menschlichen Vorhaben mit dem Tod hinfällig werden.
- source_word: עֶשְׁתֹּנֹתָיו
  choice: seine Pläne
  rationale: Das seltene Substantiv kann Gedanken, Absichten oder Pläne bezeichnen. Im Kontext der Warnung vor Vertrauen auf sterbliche Menschen bringt »Pläne« den zielgerichteten Sinn am besten zum Ausdruck.
theological_decisions:
- issue: Anthropologische Bedeutungsbreite von רוּחוֹ im Todeskontext
  choice: Im Haupttext »sein Atem«
  alternative: »sein Geist«
  rationale: »Atem« entspricht dem konkreten Bild des verlöschenden Lebens und vermeidet eine Festlegung über den Zwischenzustand. Da רוּחַ auch »Geist« bedeuten kann, wird diese Lesemöglichkeit in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die Satzglieder folgen dem knappen hebräischen Parallelismus; die seltene Wendung »seine Erde« bewahrt bewusst das Possessivsuffix des Ausgangstextes.
