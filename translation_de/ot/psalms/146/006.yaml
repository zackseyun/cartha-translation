  - severity: medium
    issue: »der ewig Treue hält«
    rationale: Die Wendung »jemandem Treue halten« verlangt normalerweise einen Dativbezug. Ohne ihn ist die Formulierung im modernen Standarddeutsch nicht natürlich und kann den Sinn verschieben. »Treue bewahrt« entspricht zudem der Bedeutungsbreite von שׁמר besser.
