  text: who made heaven and earth[a], the sea and all that is in them, who keeps faith forever,
translation:
  language: de
  text: der Himmel und Erde gemacht hat, das Meer und alles, was in ihnen ist, der für immer Treue bewahrt[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der die Wahrheit für immer bewahrt«. Das hebräische Wort kann sowohl »Treue« als auch »Wahrheit« bedeuten; hier passt »Treue« am besten zum Gedanken dauerhafter Zuverlässigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: gemacht hat
  rationale: Das Qal-Partizip beschreibt den HERRN als den Schöpfer. Das deutsche Perfekt gibt den Bezug auf die vollbrachte Schöpfung natürlich wieder, während der Relativsatz die fortlaufende Beschreibung aus dem vorherigen Vers aufnimmt.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: Himmel und Erde
  rationale: Die feste Wortverbindung bezeichnet umfassend die geschaffene Welt und ist im modernen Deutschen natürlich und würdig.
- source_word: אֶת הַיָּם
  choice: das Meer
  rationale: Der hebräische Singular mit Artikel wird entsprechend als »das Meer« wiedergegeben.
- source_word: וְאֶת כָּל אֲשֶׁר בָּם
  choice: und alles, was darin ist
  rationale: Die Formulierung bewahrt den umfassenden Sinn und bezieht sich auf Himmel, Erde und Meer.
- source_word: הַשֹּׁמֵר
  choice: hält
  rationale: שׁמר bedeutet bewahren, hüten oder einhalten. In Verbindung mit »Treue« ist »Treue halten« eine natürliche deutsche Wendung, die die beständige Zuverlässigkeit ausdrückt.
- source_word: אֱמֶת
  choice: Treue
  rationale: אֱמֶת kann Wahrheit, Verlässlichkeit oder Treue bezeichnen. Zusammen mit שׁמר und לְעוֹלָם steht hier Gottes dauerhafte Zuverlässigkeit im Vordergrund.
- source_word: לְעוֹלָם
  choice: ewig
  rationale: Das Adverb gibt die unbegrenzte Dauer knapp und idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von אֱמֶת als Wesens- und Beziehungsbegriff
  choice: Treue
  alternative: Wahrheit
  rationale: Im Zusammenhang preist der Vers Gott als Schöpfer und als dauerhaft zuverlässig. »Treue« bewahrt diese relationale Bedeutung, ohne den ebenfalls möglichen Sinn »Wahrheit« auszuschließen; dieser wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Relativform »der …, der …« wahrt die parallelen hebräischen Partizipialbeschreibungen und den Anschluss an Vers 5. »Treue halten« ist bewusst etwas feierlich, bleibt aber allgemein verständlich.
