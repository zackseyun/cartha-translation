  text: זַמְּר֣וּ לַ/יהוָ֣ה חֲסִידָ֑י/ו וְ֝/הוֹד֗וּ לְ/זֵ֣כֶר קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/004.yaml
  text: Sing praise to Yahweh[a], you his faithful ones[c][b], and give thanks to the remembrance of his holiness.
translation:
  language: de
  text: Singt Jahwe[a] Lob, ihr seine Getreuen[b], und dankt beim Gedenken an seine Heiligkeit[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Gottesname יהוה wird hier mit „Jahwe“ wiedergegeben; traditionell steht dafür oft „der HERR“.
    reason: divine_name
  - marker: b
    text: 'Oder: „ihr, die ihr ihm treu seid“; auch „seine Frommen“ oder „seine Heiligen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Eng am Hebräischen: „dem Gedenken seiner Heiligkeit“. Möglich ist auch „bei der Erwähnung seiner Heiligkeit“; „für seinen heiligen Namen“ ist eine kontextuelle Deutung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Singt … Lob
  rationale: Der Piel-Imperativ von זמר bezeichnet hier musikalisches Gotteslob. „Singt … Lob“ gibt sowohl den musikalischen als auch den lobpreisenden Sinn in natürlichem Deutsch wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Das Tetragramm יהוה wird als der offenbarte Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: חֲסִידָיו
  choice: seine Getreuen
  rationale: חסיד bezeichnet Menschen, die von Treue, loyaler Verbundenheit und Frömmigkeit geprägt sind. „Getreue“ bewahrt den Beziehungsaspekt, ohne den Ausdruck kirchlich auf „Heilige“ zu verengen.
- source_word: וְהוֹדוּ
  choice: und dankt
  rationale: Der Hifil-Imperativ von ידה bedeutet im Zusammenhang des Gotteslobs häufig „danken“; dies passt zur parallelen Aufforderung, Jahwe Lob zu singen.
- source_word: לְזֵכֶר
  choice: beim Gedenken an
  rationale: זֵכֶר kann Erinnerung, Gedenken, Gedächtnis oder Erwähnung bezeichnen. „Beim Gedenken an“ stellt einen verständlichen Zusammenhang mit dem Danken her, ohne den Ausdruck vorschnell als „Name“ auszudeuten.
- source_word: קָדְשׁוֹ
  choice: seine Heiligkeit
  rationale: קֹדֶשׁ mit Suffix bedeutet hier am unmittelbarsten „seine Heiligkeit“. Die Wiedergabe vermeidet die verbreitete, aber ergänzende Übersetzung „sein heiliger Name“, da „Name“ im Hebräischen nicht ausdrücklich steht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, während „der HERR“ ihn durch einen ehrfürchtigen traditionellen Ersatztitel wiedergibt.
- issue: Deutung von זֵכֶר קָדְשׁוֹ
  choice: beim Gedenken an seine Heiligkeit
  alternative: für seinen heiligen Namen / seinem heiligen Gedenken
  rationale: Die gewählte Fassung hält die ungewöhnliche und mehrdeutige Genitivverbindung offen. Eine Wiedergabe mit „Name“ wäre liturgisch gut verständlich, würde jedoch ein im Vers nicht vorhandenes Substantiv ergänzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Imperativ. Die Anrede wird durch „ihr“ ausdrücklich als Vokativ kenntlich gemacht. Die schwer aufzulösende Wendung לְזֵכֶר קָדְשׁוֹ bleibt im Haupttext bewusst nahe am Hebräischen; die Fußnote nennt verständlichere Deutungsmöglichkeiten.
