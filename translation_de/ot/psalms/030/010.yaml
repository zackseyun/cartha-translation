source:
  edition: WLC
  text: שְׁמַע יְהוָ֥ה וְ/חָנֵּ֑/נִי יְ֝הוָה הֱֽיֵה עֹזֵ֥ר לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/010.yaml
  text: Hear[a], O Yahweh, and be gracious to me; O Yahweh, be my helper.
translation:
  language: de
  text: Höre, Jahwe, und sei mir gnädig[a]; Jahwe, sei mein Helfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: hab Erbarmen mit mir. Das hebräische Verb kann in einer Bitte um Gottes Hilfe gnädige Zuwendung oder Erbarmen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Höre
  rationale: Der Imperativ von שׁמע bildet eine direkte Gebetsbitte. „Höre“ lässt wie der hebräische Text das Objekt unausgesprochen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: וְחָנֵּנִי
  choice: und sei mir gnädig
  rationale: Der Imperativ von חנן mit Suffix der ersten Person bezeichnet das Gewähren von Gunst oder Gnade. „Sei mir gnädig“ ist im Deutschen natürlich und bewahrt den unmittelbaren Bezug zur Gnade.
- source_word: הֱיֵה
  choice: sei
  rationale: Der Imperativ von היה hat hier in der Bitte den Sinn „sei“, nicht „werde“.
- source_word: עֹזֵר לִי
  choice: mein Helfer
  rationale: Das Partizip von עזר mit לִי bezeichnet den, der dem Beter hilft. „Mein Helfer“ gibt den persönlichen und fortdauernden Sinn knapp wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Namen und entspricht der heute üblichen deutschen Umschrift, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von חנן in der Bitte
  choice: sei mir gnädig
  alternative: hab Erbarmen mit mir
  rationale: Das Verb kann in einer Hilfsbitte sowohl gnädige Zuwendung als auch Erbarmen ausdrücken. Die Hauptfassung wahrt den Kernbezug zur Gnade; die kontextuell mögliche Nuance des Erbarmens bleibt in der Fußnote erhalten.
translation_notes:
  register: Moderne, würdige Gebetssprache mit knapper Parallelstruktur. Der Fußnotenmarker steht bei der Wendung, auf die sich die lexikalische Alternative tatsächlich bezieht.
