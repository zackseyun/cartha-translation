  text: You turned my mourning into dancing for me; you untied my sackcloth and clothed me with joy.
translation:
  language: de
  text: Du hast mir meine Klage in Tanz verwandelt; du hast mein Sacktuch gelöst und mich mit Freude umgürtet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפְּדִי
  choice: meine Trauer
  rationale: מִסְפֵּד bezeichnet Trauer beziehungsweise Klage; im Deutschen gibt „Trauer“ den Zustand hier natürlich und prägnant wieder.
- source_word: לְמָחוֹל לִי
  choice: für mich in Reigentanz
  rationale: מָחוֹל bezeichnet einen Tanz, wahrscheinlich einen Reigen. Das eigenständige לִי wird mit „für mich“ ausdrücklich bewahrt, ohne es stillschweigend dem Possessiv „meinen“ anzugleichen.
- source_word: פִּתַּחְתָּ שַׂקִּי
  choice: du hast mir das Trauergewand abgenommen
  rationale: Wörtlich wurde der Sack gelöst oder geöffnet. Gemeint ist das Ablegen des als Trauerkleidung getragenen Sacktuchs; „abgenommen“ bewahrt das Bild als konkrete Handlung und klingt im Deutschen natürlich.
- source_word: וַתְּאַזְּרֵנִי שִׂמְחָה
  choice: und mich mit Freude umgürtet
  rationale: Das Verb אזר bedeutet „gürten/umgürten“. Die bildhafte Vorstellung, Freude wie ein Kleid anzulegen, bleibt erhalten.
