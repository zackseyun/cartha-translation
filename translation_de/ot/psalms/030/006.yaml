  text: וַ֭/אֲנִי אָמַ֣רְתִּי בְ/שַׁלְוִ֑/י בַּל אֶמּ֥וֹט לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/006.yaml
  text: As for me[a], I said in my prosperity[b], “I will never be shaken.”
translation:
  language: de
  text: 'Ich aber sagte in meinem Wohlergehen[a]: »Niemals werde ich wanken.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in meiner Ruhe« oder »in meiner Sicherheit«. Das hebräische Wort bezeichnet ruhiges, gesichertes Wohlergehen und nicht nur materiellen Wohlstand.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Ich werde nicht wanken auf ewig.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Die Konjunktion zusammen mit dem selbstständigen Pronomen hebt das Ich hervor und kann im Rückblick einen leichten Kontrast ausdrücken. »Ich aber« ist im Deutschen natürlich und wahrt diese Hervorhebung.
- source_word: אָמַרְתִּי
  choice: sagte
  rationale: Das Qatal bezeichnet hier im Rückblick eine vergangene Äußerung. Ein Plusquamperfekt ist kontextuell denkbar, wird von der Form selbst aber nicht verlangt.
- source_word: בְשַׁלְוִי
  choice: in meiner unbeschwerten Sicherheit
  rationale: שַׁלְוָה bezeichnet Ruhe, Sorglosigkeit oder gesichertes Wohlergehen. Die Wendung gibt sowohl die angenehme Lage als auch das darin empfundene Sicherheitsgefühl wieder, ohne den Sinn auf materiellen Wohlstand zu verengen.
- source_word: בַּל ... לְעוֹלָם
  choice: niemals
  rationale: Die poetische Verneinung בַּל wird durch לְעוֹלָם zeitlich verstärkt. »Niemals« gibt die zusammengehörige emphatische Aussage im modernen Deutschen prägnant wieder.
- source_word: אֶמּוֹט
  choice: werde ich wanken
  rationale: Das Nifal von מוט beschreibt das Ins-Wanken-Geraten beziehungsweise den Verlust von Festigkeit. »Wanken« bewahrt das bildhafte Motiv der Instabilität und ist in würdevoller deutscher Sprache idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kompakte poetische Aussage bleibt erhalten; »unbeschwerte Sicherheit« macht die Bedeutungsbreite von שַׁלְוָה verständlich, während die Fußnote echte lexikalische Alternativen dokumentiert.
