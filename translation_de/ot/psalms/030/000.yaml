source:
  edition: WLC
  text: מִזְמ֡וֹר שִׁיר חֲנֻכַּ֖ת הַ/בַּ֣יִת לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/000.yaml
  text: A psalm[a]. A song for the dedication of the house[b]. Of David.
translation:
  language: de
  text: Ein Psalm. Ein Lied zur Einweihung des Hauses[a]. Von David.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Tempels“ oder „des Palastes“; im Hebräischen steht einfach „des Hauses“.'
    reason: alternative_reading
  - marker: b
    text: Die hebräische Formulierung kann auch „für David“ oder „David zugehörig“ bedeuten.
    reason: source_ambiguity
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: „Psalm“ ist die im Deutschen natürliche und etablierte Bezeichnung für diese musikalisch geprägte Liedgattung.
- source_word: שִׁיר
  choice: Ein Lied
  rationale: Die eigene Wiedergabe bewahrt die beiden nebeneinanderstehenden Gattungsangaben des Hebräischen, statt sie zusammenzuziehen.
- source_word: חֲנֻכַּת
  choice: zur Einweihung
  rationale: Das Substantiv bezeichnet eine Einweihung oder feierliche Widmung; „zur“ lässt wie die Überschrift sowohl Anlass als auch Bestimmung des Liedes offen.
- source_word: הַבַּיִת
  choice: des Hauses
  rationale: „Haus“ gibt den allgemeinen Wortsinn wieder, ohne den nicht ausdrücklich genannten Bezug auf Tempel oder Palast festzulegen.
- source_word: לְדָוִד
  choice: Von David
  rationale: Die traditionelle, knappe Form passt zu einer Psalmüberschrift. Eine Fußnote wahrt die weitere Bedeutungsbreite der hebräischen Zuordnungsformel.
theological_decisions:
- issue: Bezug von „das Haus“
  choice: das Haus
  alternative: der Tempel; Davids Palast
  rationale: Das hebräische בַּיִת nennt lediglich ein „Haus“. Die Übersetzung legt nicht fest, welches Gebäude gemeint ist, und bewahrt damit die historische und theologische Offenheit des Textes.
- issue: Bedeutung der Zuordnung לְדָוִד
  choice: Von David
  alternative: Für David; David zugehörig
  rationale: Die Formel kann Urheberschaft, Zugehörigkeit oder Widmung ausdrücken. Die geläufige Haupttextform wird verwendet, während die Fußnote die nicht vollständig auflösbare Mehrdeutigkeit sichtbar macht.
translation_notes:
  register: Kurze, würdige Überschriftsform in modernem Standarddeutsch. Die drei knappen Sätze spiegeln die aufeinanderfolgenden Angaben zu Gattung, Anlass beziehungsweise Verwendung und Zuordnung wider.
