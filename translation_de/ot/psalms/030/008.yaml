  text: To you, O LORD, I call, and to my Lord I plead for mercy.
translation:
  language: de
  text: Zu dir, HERR, rufe ich; zu meinem Herrn flehe ich um Gnade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: HERR
  rationale: Der Gottesname JHWH wird gemäß der etablierten deutschen Bibeltradition mit HERR wiedergegeben und dadurch von אֲדֹנָי unterschieden.
- source_word: אֲדֹנָי
  choice: mein Herr
  rationale: Die masoretische Form mit Suffix bedeutet hier „mein Herr“; die Schreibweise unterscheidet den Titel vom zuvor stehenden Gottesnamen.
- source_word: אֶקְרָא
  choice: rufe ich
  rationale: Gibt das Imperfekt von קרא in seinem unmittelbaren Gebetskontext natürlich und nah am Hebräischen wieder.
- source_word: אֶתְחַנָּן
  choice: flehe ich um Gnade
  rationale: Die Hitpael-Form von חנן bezeichnet inständiges Bitten um Gunst oder Erbarmen; „um Gnade flehen“ bewahrt diesen Bedeutungsgehalt.
theological_decisions:
- issue: Unterscheidung zwischen יְהוָה und אֲדֹנָי
  choice: HERR / mein Herr
  alternative: JHWH / mein Herr; HERR / Herr
  rationale: Die Übersetzung bewahrt sowohl den Wechsel vom Gottesnamen zum Herrentitel als auch das im Hebräischen ausdrücklich vorhandene Possessivsuffix, ohne daraus eine zusätzliche theologische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die parallele Satzstruktur des hebräischen Verses bleibt erhalten; das Semikolon markiert die enge poetische Entsprechung beider Halbverse.
