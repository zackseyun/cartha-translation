base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/009.yaml
  text: What profit is there in my blood[c][b][a], in my going down to the pit? Will the dust praise you? Will it declare your faithfulness?
translation:
  language: de
  text: Welchen Gewinn bringt mein Blut, wenn ich zur Grube hinabsteige?[a][b] Wird der Staub dich preisen? Wird er deine Treue verkünden?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Welchen Gewinn bringt mein Blut?“ Gemeint sein kann: „Was bringt es, wenn ich sterbe?“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ins Grab“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „deine Wahrheit“. Das hebräische Wort kann Wahrheit, Verlässlichkeit oder Treue bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה בֶּצַע
  choice: Was bringt es
  rationale: Die deutsche Wendung gibt die rhetorische Frage nach Nutzen oder Gewinn natürlich und knapp wieder.
- source_word: בְּדָמִי
  choice: wenn mein Blut vergossen wird
  rationale: Die konkrete Bildsprache des Blutes bleibt erhalten; zugleich macht die deutsche Formulierung den im Kontext gemeinten gewaltsamen Tod verständlich, ohne lediglich mit „Tod“ zu paraphrasieren.
- source_word: בְּרִדְתִּי אֶל שָׁחַת
  choice: wenn ich in die Grube hinabsteige
  rationale: Die zeitlich-konditionale Wiedergabe klingt im Deutschen natürlich und bewahrt das hebräische Bild des Hinabsteigens.
- source_word: שָׁחַת
  choice: die Grube
  rationale: „Grube“ erhält die konkrete Todesmetapher; „Grab“ wäre eine mögliche, aber stärker deutende Wiedergabe.
- source_word: הֲיוֹדְךָ עָפָר
  choice: Wird der Staub dich preisen?
  rationale: ידה bezeichnet hier das preisende Danken gegenüber Gott. „Staub“ bleibt als dichterisches Bild für den toten, zum Staub zurückkehrenden Menschen stehen.
- source_word: הֲיַגִּיד
  choice: Wird er … verkünden?
  rationale: „Verkünden“ entspricht dem öffentlichen Bekanntmachen und passt zum würdevollen poetischen Register.
- source_word: אֲמִתֶּךָ
  choice: deine Treue
  rationale: אמת kann Wahrheit oder Treue bezeichnen; im Gebetskontext hebt „Treue“ Gottes verlässliches Handeln hervor, ohne die Bedeutungsalternative zu verschweigen.
theological_decisions:
- issue: Auslegung der Todesbilder
  choice: Blut, Grube und Staub als konkrete Bilder im Haupttext bewahren
  alternative: Deutend mit „Tod“, „Grab“ und „die Toten“ übersetzen
  rationale: Der hebräische Text begründet die Bitte mit der zugespitzten Frage, ob der Tod des Beters Gott Lob einbringt. Die konkreten Bilder erhalten die poetische und theologische Spannung.
- issue: Bedeutung von אֲמִתֶּךָ
  choice: „deine Treue“
  alternative: „deine Wahrheit“
  rationale: Beides ist lexikalisch möglich. „Treue“ passt zum relationalen Gebetskontext; die Alternative wird in einer Fußnote bewahrt.
translation_notes:
  register: Moderne, verständliche und zugleich würdevolle Psalmsprache. Die parallelen rhetorischen Fragen und die Bilder von Blut, Grube und Staub bleiben erhalten; leicht erklärungsbedürftige Mehrdeutigkeiten werden durch knappe Fußnoten offengelegt.
