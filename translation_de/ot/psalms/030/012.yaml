  text: לְמַ֤עַן יְזַמֶּרְ/ךָ֣ כָ֭בוֹד וְ/לֹ֣א יִדֹּ֑ם יְהוָ֥ה אֱ֝לֹהַ֗/י לְ/עוֹלָ֥ם אוֹדֶֽ/ךָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/012.yaml
  text: so that my glory may sing praise to you and not be silent. O Yahweh my God[a], I will give thanks to you forever.
translation:
  language: de
  text: Damit meine Ehre[a] dir lobsingt und nicht schweigt. Yahweh, mein Gott, dir will ich ewig danken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein ganzes Wesen“. Hebräisch wörtlich „meine Ehre“; der poetische Ausdruck kann das innere Selbst oder die Zunge des Psalmisten bezeichnen.'
    reason: lexikalische Alternative und Erklärung einer mehrdeutigen poetischen Metapher
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Gibt den Zweck- beziehungsweise Folgesinn der hebräischen Konjunktion natürlich und präzise wieder.
- source_word: יְזַמֶּרְךָ
  choice: dir lobsingt
  rationale: Das Piel von זמר bezeichnet hier musikalisches Gotteslob; „lobsingen“ bewahrt beides knapp und in würdigem Deutsch.
- source_word: כָבוֹד
  choice: meine Ehre
  rationale: Bewahrt die wörtliche poetische Metapher des hebräischen כָבוֹד und macht durch das Possessivpronomen den im Kontext vorausgesetzten Bezug zum Psalmisten deutlich.
- source_word: וְלֹא יִדֹּם
  choice: und nicht schweigt
  rationale: Im Gegensatz zum Lobsingen bezeichnet דמם hier am ehesten das Verstummen beziehungsweise Schweigen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Entspricht der Possessivform und wird im Zusammenhang als direkte Anrede verstanden.
- source_word: לְעוֹלָם
  choice: ewig
  rationale: Drückt die unbegrenzte Dauer in natürlichem, gehobenem Deutsch aus.
- source_word: אוֹדֶךָּ
  choice: dir will ich danken
  rationale: Das Hiphil von ידה bezeichnet im Dankpsalm den dankenden Lobpreis; die Formulierung ist natürlich und bewahrt den direkten Gottesbezug.
theological_decisions:
- issue: Deutung von כָבוֹד als Subjekt des Lobgesangs
  choice: Die wörtliche Metapher „meine Ehre“ bleibt im Haupttext erhalten.
  alternative: „mein ganzes Wesen“, „meine Seele“ oder „meine Zunge“
  rationale: Der poetische Ausdruck ist mehrdeutig und kann das Innere, die ganze Person oder möglicherweise die Zunge des Psalmisten meinen. Der Haupttext legt diese Frage nicht fest; die Fußnote erläutert die möglichen Bezüge.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Die Wiedergabe als Eigenname zeigt, dass im Ausgangstext der persönliche Gottesname und nicht lediglich ein Titel steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit psalmtypischer poetischer Verdichtung. „Lobsingen“ ist bewusst gehoben, aber allgemein verständlich; die ungewöhnliche Metapher „meine Ehre“ wird wegen ihrer Bedeutungsoffenheit beibehalten und in der Fußnote erläutert.
