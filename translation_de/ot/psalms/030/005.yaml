source:
  edition: WLC
  text: כִּ֤י רֶ֨גַע בְּ/אַפּ/וֹ֮ חַיִּ֪ים בִּ/רְצ֫וֹנ֥/וֹ בָּ֭/עֶרֶב יָלִ֥ין בֶּ֗כִי וְ/לַ/בֹּ֥קֶר רִנָּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/005.yaml
  text: For his anger is for a moment[a]; life is in his favor. Weeping may stay for the night[b], but rejoicing comes in the morning.
translation:
  language: de
  text: Denn sein Zorn währt einen Augenblick, seine Gunst aber ein Leben lang.[a] Am Abend übernachtet das Weinen, doch am Morgen ist Jubel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn sein Zorn währt einen Augenblick; in seiner Gunst ist Leben.“'
    reason: Die knappe hebräische Nominalzeile kann entweder die Dauer der Gunst oder das in ihr liegende Leben ausdrücken.
  - marker: b
    text: 'Wörtlich etwa: „Am Abend übernachtet das Weinen, doch am Morgen ein Jubelruf.“ Das hebräische Verb bezeichnet das Übernachten oder Bleiben als Gast; רִנָּה kann einen Jubelruf oder jubelnden Gesang meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Begründung für den vorausgehenden Zusammenhang ein und entspricht dem poetischen Gedankengang.
- source_word: רֶגַע בְּאַפּוֹ
  choice: sein Zorn währt nur einen Augenblick
  rationale: Die knappe Nominalkonstruktion wird im Deutschen idiomatisch verbal wiedergegeben; אַף bezeichnet hier Zorn, רֶגַע dessen kurze Dauer.
- source_word: חַיִּים בִּרְצוֹנוֹ
  choice: doch seine Gunst ein Leben lang
  rationale: חַיִּים kann abstrakt „Leben“ bedeuten, in dieser elliptischen Gegenüberstellung aber auch die Dauer der Gunst bezeichnen. Die deutsche Fassung erhält den Kontrast zwischen Augenblick und Lebensdauer; die alternative Deutung wird in einer Fußnote bewahrt.
- source_word: בָּעֶרֶב יָלִין בֶּכִי
  choice: Am Abend kehrt Weinen als Gast ein
  rationale: לין bedeutet übernachten beziehungsweise als Gast bleiben. Die Personifikation des Weinens und der Übergang von Abend zu Morgen bleiben so anschaulich erhalten.
- source_word: וְלַבֹּקֶר רִנָּה
  choice: doch am Morgen Jubel
  rationale: Das Waw drückt im Parallelismus einen deutlichen Gegensatz aus. רִנָּה bezeichnet hörbaren Jubel, einen Freudenruf oder jubelnden Gesang.
theological_decisions:
- issue: Bezug der Suffixe in „sein Zorn“ und „seine Gunst“
  choice: Die Pronomen beziehen sich im Kontext auf den HERRN.
  alternative: Eine ausdrückliche Wiederholung des Gottesnamens.
  rationale: Der Bezug ist im Psalm eindeutig genug; die Pronomen bewahren die knappe Form des Hebräischen, ohne den theologischen Gegensatz zwischen Gottes wirklichem Zorn und seiner lebensspendenden Gunst abzuschwächen.
- issue: Deutung von חַיִּים בִּרְצוֹנוֹ
  choice: „seine Gunst [währt] ein Leben lang“
  alternative: „in seiner Gunst ist Leben“
  rationale: Die elliptische hebräische Zeile erlaubt sowohl eine durative als auch eine existenzielle Deutung. Der Haupttext hebt den zeitlichen Gegensatz zu „einen Augenblick“ hervor; die Fußnote bewahrt die genuine Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. „Als Gast einkehren“ macht die hebräische Personifikation natürlich verständlich. Die Marker [a] und [b] stehen jeweils unmittelbar bei der erläuterten Aussage.
