source:
  edition: WLC
  text: יְהוָ֥ה אֱלֹהָ֑/י שִׁוַּ֥עְתִּי אֵ֝לֶ֗י/ךָ וַ/תִּרְפָּאֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/002.yaml
  text: O Yahweh my God[a], I cried out to you[c][b], and you healed me.
translation:
  language: de
  text: Jahwe, mein Gott[a], ich schrie zu dir um Hilfe[b], und du hast mich geheilt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben. Eine weitere Namensform ist „Jehova“.
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „ich schrie zu dir“. Das hebräische Verb bezeichnet einen dringlichen Hilferuf.'
    reason: lexical_alternative
  - marker: c
    text: „Geheilt“ kann sich hier auf körperliche Heilung oder allgemeiner auf Wiederherstellung und Rettung beziehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהָי
  choice: mein Gott
  rationale: Die Form mit dem Suffix der 1. Person Singular bedeutet unmittelbar „mein Gott“ und gehört hier zur direkten Anrede.
- source_word: שִׁוַּעְתִּי
  choice: ich schrie … um Hilfe
  rationale: Das Verb bezeichnet einen dringlichen Hilferuf. Die Wiedergabe macht diese im Hebräischen enthaltene Ausrichtung deutlich und klingt zugleich natürlich.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Die Präposition אֶל mit dem Suffix der 2. Person Singular bezeichnet die Richtung des Hilferufs.
- source_word: וַתִּרְפָּאֵנִי
  choice: und du hast mich geheilt
  rationale: רפא bedeutet „heilen“. Das deutsche Perfekt gibt die abgeschlossene Rettung in natürlichem modernem Deutsch wieder, ohne die Art der Heilung festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt diesen Eigennamen; eine Fußnote weist auf die traditionelle Wiedergabe hin.
- issue: Bedeutungsumfang von רפא
  choice: du hast mich geheilt
  alternative: du hast mich wiederhergestellt
  rationale: „Geheilt“ entspricht dem direkten Wortsinn und lässt im Zusammenhang offen, ob körperliche Heilung oder umfassendere Wiederherstellung und Rettung gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede bleibt knapp und eindringlich; das Perfekt entspricht natürlichem gegenwärtigem Deutsch.
