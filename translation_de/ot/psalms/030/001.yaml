base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/001.yaml
  text: I will exalt you[a], O Yahweh, because you have drawn me up and have not let my enemies rejoice over me.
translation:
  language: de
  text: 'Ich will dich hoch preisen, Jahwe,

    denn du hast mich heraufgezogen[a]

    und meine Feinde nicht über mich jubeln lassen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „emporgehoben“. Das hebräische Verb bezeichnet anschaulich das Heraufziehen, etwa aus einem Brunnen oder einer Grube.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹמִמְךָ
  choice: Ich will dich erheben
  rationale: Das Verb רום bezeichnet hier das Erheben beziehungsweise Hochpreisen Gottes. „Dich erheben“ bewahrt das Höhenbild und klingt zugleich als Sprache des Lobes natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund für das angekündigte Lob ein; „denn“ ist in diesem poetischen Zusammenhang natürlich und klar.
- source_word: דִלִּיתָנִי
  choice: du hast mich heraufgezogen
  rationale: דלה bezeichnet konkret das Heraufziehen, etwa aus einem Brunnen oder einer Grube. „Heraufgezogen“ erhält dieses Bild und lässt zugleich den rettenden Sinn offen.
- source_word: וְלֹא שִׂמַּחְתָּ
  choice: und … nicht … jubeln lassen
  rationale: Die kausative Form wird im Deutschen idiomatisch mit „jubeln lassen“ wiedergegeben.
- source_word: אֹיְבַי
  choice: meine Feinde
  rationale: Direkte und natürliche Wiedergabe des possessiven Plurals.
- source_word: לִי
  choice: über mich
  rationale: Die Präposition beschreibt hier den triumphierenden Jubel der Feinde angesichts des Unglücks des Beters; „über mich jubeln“ ist die passende deutsche Wendung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdige Psalmsprache mit klarer Syntax. Die Zeilenform bewahrt den poetischen Parallelismus; „heraufgezogen“ erhält das konkrete Rettungsbild des Hebräischen.
