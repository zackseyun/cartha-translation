source:
  edition: WLC
  text: יְֽהוָ֗ה בִּ/רְצוֹנְ/ךָ֮ הֶעֱמַ֪דְתָּה לְֽ/הַרְרִ֫/י עֹ֥ז הִסְתַּ֥רְתָּ פָנֶ֗י/ךָ הָיִ֥יתִי נִבְהָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/007.yaml
  text: O Yahweh[a], by your favor you made my mountain stand strong; when you hid your face, I was dismayed.
translation:
  language: de
  text: Jahwe, durch deine Gunst hast du meinen Berg fest stehen lassen; als du dein Angesicht verbargst, erschrak ich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast meinem Berg Stärke verliehen.“ Die hebräische Formulierung ist knapp und kann bildhaft sichere Wohlfahrt oder Beständigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; die direkte Anrede ergibt sich im Deutschen ohne zusätzliches „O“ natürlich aus der Satzstellung.
- source_word: בִּרְצוֹנְךָ
  choice: durch deine Gunst
  rationale: רָצוֹן bezeichnet Gunst, Wohlwollen oder Wohlgefallen; „durch“ gibt die instrumentale Bedeutung der Präposition בְּ wieder.
- source_word: הֶעֱמַדְתָּה
  choice: hast du … dastehen lassen
  rationale: Der Hifil von עמד ist kausativ („zum Stehen bringen“); diese Formulierung bewahrt den verbalen Bildgehalt.
- source_word: לְהַרְרִי עֹז
  choice: meinen Berg stark
  rationale: 'Die schwierige, knappe Wortfolge wird prädikativ verstanden: Gott ließ „meinen Berg“ stark bzw. fest stehen. Das Bild des Berges bleibt erhalten, statt als Wohlstand oder Sicherheit aufgelöst zu werden.'
- source_word: הִסְתַּרְתָּ פָנֶיךָ
  choice: du dein Angesicht verbargst
  rationale: Die wörtliche und theologisch bedeutsame hebräische Wendung für den Entzug göttlicher Zuwendung oder Gegenwart bleibt erhalten.
- source_word: נִבְהָל
  choice: erschrak ich
  rationale: Der Nifal von בהל bezeichnet Bestürzung, Erschrecken oder Entsetzen. „Erschrak“ ist gegenwärtiges, natürliches Deutsch und legt den Grad der Angst nicht unnötig stark fest.
theological_decisions:
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm יְהוָה. „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung von „mein Berg“
  choice: Das Bild „mein Berg“ im Haupttext beibehalten
  alternative: mein Wohlstand; meine Sicherheit; meine Festung
  rationale: Der hebräische Text nennt den Berg und kann damit bildhaft sichere, erhöhte Beständigkeit ausdrücken. Die Übersetzung bewahrt diese poetische Spannung, statt eine einzelne Deutung in den Text einzutragen.
- issue: Kompakte Syntax von לְהַרְרִי עֹז
  choice: „meinen Berg stark dastehen lassen“
  alternative: „meinem Berg Stärke verliehen“
  rationale: Die gewählte Lesart verbindet עֹז prädikativ mit dem kausativen Verb. Wegen der syntaktischen Dichte wird die ebenso mögliche nominale Auffassung in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Psalmenbildsprache. „Angesicht“ hält bewusst den gehobenen biblisch-poetischen Ton; „erschrak“ bleibt verständlich und natürlich. Der Fußnotenmarker [a] steht im Haupttext.
