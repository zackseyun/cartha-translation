  text: יְֽהוָ֗ה הֶֽעֱלִ֣יתָ מִן שְׁא֣וֹל נַפְשִׁ֑/י חִ֝יִּיתַ֗/נִי מ/יורדי בֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/003.yaml
  text: O Yahweh[a], you brought up my soul from Sheol[c][b]; you kept me alive from among those going down to the pit.
translation:
  language: de
  text: Jahwe, du hast mein Leben aus dem Totenreich[a] heraufgeführt; du hast mich am Leben erhalten, fern von denen, die in die Grube hinabsteigen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch Scheol: das Totenreich; auch „das Grab“ ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Du hast mich wiederbelebt, weg von denen, die in die Grube hinabsteigen.“ Nach einer anderen syntaktischen Zuordnung: „Du hast mich am Leben erhalten, sodass ich nicht in die Grube hinabstieg.“'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe des Tetragramms mit „HERR“ ist im allgemeinen Bibeldeutsch verständlich und würdevoll; sie kennzeichnet den Gottesnamen, ohne eine unsichere deutsche Lautform in den Vers einzutragen.
- source_word: הֶעֱלִיתָ
  choice: hast … heraufgeholt
  rationale: Die kausative Form von עלה bezeichnet hier das Heraufführen und bewahrt die räumliche Rettungsmetaphorik.
- source_word: מִן שְׁאוֹל
  choice: aus dem Totenreich
  rationale: „Totenreich“ gibt שְׁאוֹל verständlich wieder, ohne den Ausdruck auf ein einzelnes Grab oder auf „Hölle“ einzuengen.
- source_word: נַפְשִׁי
  choice: mein Leben
  rationale: נפשׁ bezeichnet hier im Zusammenhang der Todesrettung am natürlichsten das Leben beziehungsweise die ganze Person; „Seele“ könnte im Deutschen eine engere anthropologische Vorstellung nahelegen.
- source_word: חִיִּיתַנִי
  choice: du hast mich am Leben erhalten
  rationale: Die Piel-Form von חיה kann Bewahrung oder Wiederbelebung ausdrücken. Die Hauptfassung wahrt die Aussage der Lebensrettung, ohne ausdrücklich eine Auferstehung zu behaupten.
- source_word: מִיּוֹרְדֵי בוֹר
  choice: fern von denen, die in die Grube hinabsteigen
  rationale: Die Formulierung versteht מן als Trennung von der Gruppe der zur Grube Hinabsteigenden und bewahrt zugleich das poetische Bild.
- source_word: בּוֹר
  choice: die Grube
  rationale: „Grube“ erhält das hebräische Todes- und Grabesbild, ohne es begrifflich zu verengen.
theological_decisions:
- issue: Ob der Vers ausdrücklich Auferstehung oder eine ausgearbeitete Lehre vom Jenseits aussagt
  choice: Die Bilder vom Totenreich und von der Grube bleiben stehen; die Rettung wird als Bewahrung des Lebens formuliert.
  alternative: „Du hast mich von den Toten auferweckt“ oder שְׁאוֹל mit „Grab“ beziehungsweise „Hölle“ wiedergeben.
  rationale: Der poetische Text beschreibt Rettung aus Todesnähe oder Todessphäre, legt aber die genaue Art nicht fest. Eine ausdrücklichere dogmatische Aussage wäre enger als der hebräische Wortlaut.
- issue: Syntaktische Zuordnung von מִיּוֹרְדֵי בוֹר
  choice: Trennung von der Gemeinschaft derer, die in die Grube hinabsteigen
  alternative: „Du hast mich wiederbelebt, sodass ich nicht in die Grube hinabstieg.“
  rationale: Die Konsonantenfolge erlaubt unterschiedliche Bezüge. Die Hauptfassung folgt der naheliegenden Lesart mit dem Partizip Plural; die alternative Konstruktion wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener hebräischer Aufwärts-/Abwärtsbildlichkeit. „Totenreich“ vermeidet sowohl die Verengung auf das Grab als auch die Gleichsetzung mit der Hölle.
