base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/002.yaml
  text: 'Yahweh sends forth from Zion the scepter of your strength: rule in the midst of your enemies[a][b][c].'
translation:
  language: de
  text: 'Das Zepter[a] deiner Macht sendet Jahwe von Zion aus[b]: Herrsche inmitten deiner Feinde![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Stab« oder »Rute«.
    reason: lexical_alternative
  - marker: b
    text: 'Oder »Jahwe wird es von Zion aussenden«; sinngemäß auch: »Jahwe lässt es von Zion ausgehen«.'
    reason: lexical_alternative
  - marker: c
    text: Oder »unter deinen Feinden«.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: Zepter
  rationale: מַטֶּה kann einen Stab, eine Rute oder ein Zepter bezeichnen. Im königlichen Zusammenhang von Psalm 110 bringt »Zepter« die konkrete Bedeutung als Zeichen königlicher Herrschaft angemessen zum Ausdruck.
- source_word: עֻזְּךָ
  choice: deiner Macht
  rationale: עֹז bezeichnet Stärke oder Macht. Die Genitivverbindung bewahrt die knappe hebräische Formulierung und bezeichnet das Zepter als Ausdruck der Macht des Angeredeten.
- source_word: יִשְׁלַח
  choice: sendet … aus
  rationale: שׁלח bedeutet »senden« oder »aussenden«. Das Präsens eignet sich im Deutschen als lebendige poetische Aussage; die hebräische Imperfektform kann kontextuell auch zukünftig verstanden werden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִצִּיּוֹן
  choice: von Zion aus
  rationale: Die Formulierung gibt die Herkunfts- bzw. Ausgangsangabe natürlich und präzise wieder.
- source_word: רְדֵה
  choice: Herrsche
  rationale: Der Imperativ von רדה fordert den angeredeten König auf, Herrschaft auszuüben. »Herrsche« ist im modernen Deutschen klar und wahrt die königliche Bildwelt.
- source_word: בְּקֶרֶב
  choice: inmitten
  rationale: בְּקֶרֶב bedeutet wörtlich »in der Mitte von« und zeichnet das eindrückliche Bild einer Herrschaft, die von feindlichen Mächten umgeben ist.
- source_word: אֹיְבֶיךָ
  choice: deiner Feinde
  rationale: Direkte Wiedergabe des Plurals mit Suffix der zweiten Person Maskulin Singular.
theological_decisions:
- issue: Königliche und messianische Bildsprache in Psalm 110
  choice: Die königliche Bildsprache bleibt ausdrücklich erhalten, ohne den Angeredeten im Vers näher zu identifizieren.
  alternative: Den Text entweder allgemein und ohne deutlich königliche Begriffe oder ausdrücklich messianisch wiederzugeben.
  rationale: Der hebräische Text beschreibt einen Herrscher, dessen Herrschaft von Jahwe ausgeht und gestützt wird. Die Übersetzung lässt sowohl den unmittelbaren königlichen Sinn als auch eine weiterführende messianische Auslegung zu, ohne diese in den Wortlaut einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzführung. Die vorangestellte königliche Bildhälfte und der anschließende Imperativ bewahren die Spannung und Dynamik des Hebräischen.
