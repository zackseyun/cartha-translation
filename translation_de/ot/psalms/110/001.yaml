base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/001.yaml
  text: Of David[a]. A psalm. Yahweh says to my lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
translation:
  language: de
  text: 'Von David[a]. Ein Psalm.


    Ausspruch Jahwes an meinen Herrn[b]:


    »Setz dich zu meiner Rechten,


    bis ich deine Feinde zum Fußschemel für deine Füße[c] mache.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Überschrift kann auch »Für David« oder im Sinn einer Zugehörigkeit »David zugeordnet« verstanden werden.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch unterscheidet hier den Gottesnamen Jahwe von dem Ehrentitel »mein Herr«.
    reason: lexical_clarification
  - marker: c
    text: Wörtlich steht »zum Fußschemel für deine Füße«; sinngemäß kann das Bild auch mit »unter deine Füße« wiedergegeben werden.
    reason: idiom_clarification
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Präposition לְ kann in Psalmüberschriften Urheberschaft, Zugehörigkeit oder Widmung bezeichnen. »Von David« ist im Deutschen knapp und lässt mehr von dieser Offenheit bestehen als eine ausdrückliche Festlegung auf »verfasst von David«.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Die übliche und kontextgerechte deutsche Bezeichnung der Liedgattung.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: Das Substantiv leitet häufig einen feierlichen, autoritativen Gottes- oder Prophetenspruch ein. »Ausspruch« bewahrt diese förmliche Kraft besser als das schlichtere »spricht«, ohne den Ausdruck unnötig als »Orakel« zu spezifizieren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Wiedergabe als Eigenname bewahrt die klare Unterscheidung zwischen dem Tetragramm und dem folgenden Ehrentitel אֲדֹנִי.
- source_word: לַאדֹנִי
  choice: an meinen Herrn
  rationale: אֲדֹנִי mit dem Suffix der ersten Person Singular bedeutet »mein Herr« beziehungsweise »mein Gebieter«. »Meinen Herrn« bewahrt den Ehrentitel, ohne durch Großschreibung eine spätere christologische Deutung typografisch vorwegzunehmen.
- source_word: שֵׁב
  choice: Setz dich
  rationale: Direkte, natürliche Wiedergabe des Imperativs von ישׁב. Der Zusammenhang mit der rechten Seite vermittelt die königliche Erhöhungs- und Thronvorstellung.
- source_word: לִימִינִי
  choice: zu meiner Rechten
  rationale: Die feste deutsche Wendung bewahrt das biblische Bild von Ehrenplatz, Macht und Mitregentschaft sowie seine intertextuellen Bezüge.
- source_word: עַד
  choice: bis
  rationale: Die gewöhnliche temporale Entsprechung, ohne darüber hinaus festzulegen, was nach dem genannten Zeitpunkt geschieht.
- source_word: אָשִׁית
  choice: mache
  rationale: שׁית bedeutet »setzen, stellen, legen«. In Verbindung mit einem Prädikatsnomen gibt »machen zu« den resultativen Sinn im Deutschen natürlich wieder.
- source_word: אֹיְבֶיךָ
  choice: deine Feinde
  rationale: Unmittelbare und idiomatische Wiedergabe des Plurals mit Suffix der zweiten Person maskulin Singular.
- source_word: הֲדֹם
  choice: Schemel
  rationale: Die übliche deutsche Entsprechung bewahrt das königliche Siegesbild, in dem besiegte Feinde dem Herrscher untergeordnet werden.
- source_word: לְרַגְלֶיךָ
  choice: für deine Füße
  rationale: Die Formulierung bildet die Präposition לְ genauer ab als das deutender formulierte »unter deine Füße« und ergibt zusammen mit »Schemel« verständliches Deutsch.
theological_decisions:
- issue: Unterscheidung zwischen יהוה und אֲדֹנִי
  choice: »Jahwe« und »mein Herr« werden klar voneinander unterschieden.
  alternative: »der HERR« und »mein Herr« oder »Jahwe« und »mein Herr« mit religiös deutender Großschreibung
  rationale: Der hebräische Text verwendet zuerst den Gottesnamen und danach einen Ehrentitel mit Possessivsuffix. Die unterschiedliche Wiedergabe macht diese lexikalische Unterscheidung sichtbar.
- issue: Messianische Deutung von »mein Herr«
  choice: Der Ehrentitel bleibt ohne typografische oder erklärende Identifizierung stehen.
  alternative: »mein Herr« ausdrücklich auf den Messias oder Christus beziehen
  rationale: Die spätere kanonische Verwendung des Verses ist theologisch bedeutsam, doch der hebräische Wortlaut nennt die angesprochene Gestalt hier nicht ausdrücklich. Die Übersetzung bewahrt diese Spannung, statt sie im Haupttext aufzulösen.
- issue: Zeitliche Tragweite von עַד
  choice: Wiedergabe mit »bis« ohne Aussage über eine Beendigung des Sitzens danach
  alternative: Eine Formulierung, die das Sitzen nur bis zur Unterwerfung der Feinde begrenzt
  rationale: Die Konjunktion bezeichnet den Zeitpunkt, bis zu dem die angekündigte Handlung vollzogen wird; sie entscheidet für sich allein nicht, ob der zuvor beschriebene Zustand danach endet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Zeilengliederung. »Ausspruch Jahwes« erhält den feierlichen Charakter der hebräischen Redeeinleitung; »zu meiner Rechten« und das Schemelbild bleiben wegen ihrer poetischen und kanonischen Bedeutung bildhaft erhalten.
