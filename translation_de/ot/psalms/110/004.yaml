source:
  edition: WLC
  text: נִשְׁבַּ֤ע יְהוָ֨ה וְ/לֹ֥א יִנָּחֵ֗ם אַתָּֽה כֹהֵ֥ן לְ/עוֹלָ֑ם עַל דִּ֝בְרָתִ֗י מַלְכִּי צֶֽדֶק׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/004.yaml
  text: 'Yahweh has sworn and will not change his mind: “You are a priest forever after the manner of Melchizedek.”[a]'
translation:
  language: de
  text: 'Jahwe hat geschworen und wird seinen Entschluss nicht ändern: »Du bist Priester für immer nach der Art Melchisedeks.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, näher am Hebräischen: »gemäß meinem Wort/meinem Beschluss, Melchisedek«. Die hebräische Wendung ist schwer zu deuten; manche verstehen sie im Sinn von »nach der Art Melchisedeks«.'
    reason: Bewahrt die mögliche alternative Analyse der mehrdeutigen hebräischen Wendung עַל־דִּבְרָתִי מַלְכִּי־צֶדֶק, ohne ihre Syntax im Deutschen künstlich festzulegen.
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: hat geschworen
  rationale: Das Perfekt bezeichnet einen vollzogenen, feierlichen Eid; die deutsche Perfektform ist hier natürlich und bewahrt dessen Nachdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des göttlichen Eigennamens bewahrt den ausdrücklichen Bundesnamen.
- source_word: וְלֹא יִנָּחֵם
  choice: und wird seinen Entschluss nicht ändern
  rationale: Das Nifal von נחם besagt hier, dass Jahwe seinen eidlich bekräftigten Entschluss nicht zurücknimmt. Diese Formulierung ist in modernem Deutsch klarer als »wird nicht bereuen« und passender als »wird nicht nachgeben«.
- source_word: כֹהֵן
  choice: Priester
  rationale: Das prädikative Substantiv bezeichnet unmittelbar das Amt; im Deutschen ist »Du bist Priester« ohne unbestimmten Artikel idiomatisch.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die knappe, natürliche Formulierung gibt die unbegrenzte Dauer in diesem Zusammenhang angemessen wieder.
- source_word: עַל דִּבְרָתִי
  choice: nach der Art
  rationale: Die schwierige Wendung wird kontextgerecht als Hinweis auf ein mit Melchisedek verbundenes Muster verstanden, ohne die stärker institutionelle Vorstellung einer festgelegten »Ordnung« einzutragen.
- source_word: מַלְכִּי־צֶדֶק
  choice: Melchisedek
  rationale: Der Personenname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
theological_decisions:
- issue: Deutung der schwierigen Wendung עַל דִּבְרָתִי מַלְכִּי־צֶדֶק
  choice: nach der Art Melchisedeks
  alternative: 'nach meinem Wort/meiner Verfügung: Melchisedek'
  rationale: Die Syntax und Bedeutung der hebräischen Wendung sind umstritten. Der Haupttext gibt die kontextuell und in der alten Auslegung gut bezeugte Deutung als melchisedekisches Muster wieder; die mögliche wörtlichere Lesart bleibt in der Fußnote sichtbar, damit die Mehrdeutigkeit nicht verdeckt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Hauptsatz ist feierlich, aber allgemein verständlich; die direkte Rede bleibt knapp und eindringlich. »Jahwe« kennzeichnet den Eigennamen, und die Fußnote dokumentiert die echte sprachliche Unsicherheit.
