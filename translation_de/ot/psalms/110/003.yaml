  text: עַמְּ/ךָ֣ נְדָבֹת֮ בְּ/י֪וֹם חֵ֫ילֶ֥/ךָ בְּֽ/הַדְרֵי קֹ֭דֶשׁ מֵ/רֶ֣חֶם מִשְׁחָ֑ר לְ֝/ךָ֗ טַ֣ל יַלְדֻתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/003.yaml
  text: Your people will offer themselves freely on the day of your power[a], in holy splendor; from the womb of the dawn[c][b], to you belongs the dew of your youth.
translation:
  language: de
  text: 'Dein Volk stellt sich willig zur Verfügung am Tag deiner Macht[a], in heiligem Glanz[b]. Aus dem Schoß der Morgenröte: Dir gehört der Tau deiner Jugend.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »am Tag deiner Heeresmacht« oder »am Tag deines Heeres«. Das hebräische Wort kann Macht, Stärke oder ein Heer bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »in heiliger Pracht«, »im Schmuck der Heiligkeit« oder möglicherweise »in heiligen Gewändern«.'
    reason: lexical_alternative
  - marker: c
    text: 'Die Schlusszeile ist schwer zu deuten. Sie kann auch bedeuten: »Wie Tau aus dem Schoß der Morgenröte sind dir deine jungen Männer.« Möglich ist ebenso eine Aussage über die Frische und Lebenskraft der Jugend.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַמְּךָ
  choice: dein Volk
  rationale: עַם bezeichnet gewöhnlich das Volk. Der kriegerische Zusammenhang klingt mit, ohne das Wort auf »Heer« oder »Truppen« zu verengen.
- source_word: נְדָבֹת
  choice: stellt sich willig zur Verfügung
  rationale: Der Plural bezeichnet wörtlich freiwillige Gaben beziehungsweise freiwillige Opfer. Prädikativ auf das Volk bezogen drückt er dessen freiwillige Selbsthingabe oder Dienstbereitschaft aus; die verbale Wiedergabe ist im Deutschen verständlich und bewahrt diesen Grundgedanken.
- source_word: בְּיוֹם חֵילֶךָ
  choice: am Tag deiner Macht
  rationale: בְּיוֹם ist eine übliche Zeitangabe. חַיִל kann Macht, Stärke, Heereskraft oder Heer bedeuten; »Macht« hält die Aussage weit genug und lässt den militärischen Anklang offen.
- source_word: בְּהַדְרֵי קֹדֶשׁ
  choice: in heiligem Glanz
  rationale: Die Wendung kann heiligen Schmuck, heilige Pracht oder ein heiliges Festgewand bezeichnen. »In heiligem Glanz« bleibt poetisch und legt nicht fest, ob ausdrücklich Kleidung gemeint ist.
- source_word: מֵרֶחֶם מִשְׁחָר
  choice: aus dem Schoß der Morgenröte
  rationale: Die wörtliche Bildsprache beschreibt die Morgenröte als Schoß beziehungsweise Ursprungsort. »Morgenröte« gibt das poetische Bild von מִשְׁחָר natürlich wieder.
- source_word: לְךָ טַל יַלְדֻתֶיךָ
  choice: kommt dir der Tau deiner Jugend
  rationale: Die hebräische Nominalfügung ist äußerst knapp. »Kommt dir« verbindet das Herkunftsbild mit der Zugehörigkeit, während »Tau deiner Jugend« die offene Bildsprache bewahrt. יַלְדֻתֶיךָ kann Jugend beziehungsweise Jugendfrische meinen und möglicherweise kollektiv auf junge Männer bezogen sein.
theological_decisions:
- issue: Deutung des Schlussglieds »dir der Tau deiner Jugend«
  choice: Die poetische Bildfolge bleibt im Haupttext offen und kann Jugendfrische, jugendliche Lebenskraft oder eine junge Gefolgschaft anklingen lassen.
  alternative: Das Bild ausdrücklich auf junge Krieger beziehen oder als Aussage über eine vorzeitliche beziehungsweise ewige Zeugung deuten.
  rationale: Der masoretische Text ist syntaktisch gedrängt und in seiner Bedeutung umstritten. Eine eindeutige dogmatische oder militärische Festlegung wäre stärker als der hebräische Wortlaut; die offene Wiedergabe bewahrt die theologische Spannung.
translation_notes:
  register: Moderne, gehobene Standardsprache mit bewahrter hebräischer Bildlichkeit. Der erste Satz wird idiomatisch formuliert; die Schlusszeile bleibt bewusst poetisch und leicht fremdartig, weil auch der Ausgangstext mehrdeutig und syntaktisch knapp ist.
