base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/000.yaml
  text: Of David[a]. A psalm. Yahweh says to my Lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
translation:
  language: de
  text: 'Von David.[a] Ein Psalm.


    Ausspruch Jahwes an meinen Herrn:[b]


    »Setze dich zu meiner Rechten,


    bis ich deine Feinde


    zum Schemel für deine Füße mache.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Für David« oder »David betreffend«. Die hebräische Form bezeichnet die Beziehung des Psalms zu David, ohne sie genauer festzulegen.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch unterscheidet hier zwischen »Jahwe« (JHWH), dem Gottesnamen, und »meinem Herrn« (adoni).
    reason: lexical_clarification
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die traditionelle und im Kontext gut mögliche Wiedergabe der Überschrift; die hebräische Präposition לְ lässt jedoch auch andere Zuordnungen zu, weshalb die Alternative in einer Fußnote genannt wird.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: Gibt den feierlichen, orakelartigen Charakter des Substantivs wieder, ohne es zu einem gewöhnlichen »sagt« abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen wieder und bewahrt die im Hebräischen klare Unterscheidung zu אֲדֹנִי, »mein Herr«.
- source_word: לַאדֹנִי
  choice: an meinen Herrn
  rationale: Die Präposition bezeichnet hier den Adressaten des Ausspruchs; »mein Herr« bildet אֲדֹנִי ab, ohne es mit dem Gottesnamen gleichzusetzen.
- source_word: שֵׁב לִימִינִי
  choice: Setze dich an meine rechte Seite
  rationale: Natürliches modernes Deutsch für das Sitzen zur Rechten; die räumliche und ehrenvolle Stellung bleibt erhalten.
- source_word: הֲדֹם לְרַגְלֶיךָ
  choice: Schemel für deine Füße
  rationale: Bewahrt das konkrete Bild des hebräischen Textes, statt es deutend als bloße Unterwerfung aufzulösen.
theological_decisions:
- issue: Unterscheidung zwischen dem Gottesnamen und »mein Herr«
  choice: »Jahwe« und »mein Herr« werden ausdrücklich unterschieden.
  alternative: Beide Ausdrücke mit »Herr« beziehungsweise »HERR« wiederzugeben.
  rationale: Der hebräische Text verwendet zwei verschiedene Bezeichnungen; ihre sichtbare Unterscheidung verhindert eine vorschnelle Identifizierung und erhält die theologische Spannung.
- issue: Identität des angesprochenen Herrn
  choice: Die Übersetzung belässt es bei »meinem Herrn« und identifiziert ihn nicht näher.
  alternative: Den Angesprochenen ausdrücklich als König, Messias oder Christus zu bezeichnen.
  rationale: Eine solche Identifizierung steht nicht ausdrücklich in dieser Zeile und soll nicht in den Text hineingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetischen Zeilen und das konkrete Bild des Fußschemels bleiben erhalten; archaische Wendungen werden vermieden. Die Überschrift wird vom eigentlichen Ausspruch typografisch abgesetzt.
