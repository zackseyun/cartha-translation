id: PSA.110.5
reference: Psalms 110:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲדֹנָ֥/י עַל יְמִֽינְ/ךָ֑ מָחַ֖ץ בְּ/יוֹם אַפּ֣/וֹ מְלָכִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/005.yaml
  text: The Lord is at your right hand[a]; he will shatter kings on the day of his wrath.
translation:
  language: de
  text: Der Herr steht zu deiner Rechten[a]; am Tag seines Zorns wird er Könige zerschmettern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Herr zu deiner Rechten«. Der Ausdruck kann sich auf den im Psalm angesprochenen König beziehungsweise Messias beziehen; andere verstehen »der Herr« hier als Gott, der Gericht hält.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Die masoretische Punktierung lautet אֲדֹנָי (Adonaj), nicht der Gottesname JHWH. »Herr« bewahrt den Titel und lässt den im Psalm strittigen Bezug offen.
- source_word: עַל יְמִינְךָ
  choice: steht zu deiner Rechten
  rationale: Die Wendung bezeichnet die Position an der rechten Seite. »Zu deiner Rechten« erhält das konkrete Bild; das ergänzte »steht« ergibt im Deutschen einen natürlichen Nominalsatz.
- source_word: מָחַץ
  choice: wird … zerschmettern
  rationale: Das Verb bezeichnet vernichtendes Schlagen oder Zerschmettern. Das Futur gibt den hebräischen Perfekt im prophetisch-gerichtlichen Zusammenhang angemessen wieder.
- source_word: בְּיוֹם אַפּוֹ
  choice: am Tag seines Zorns
  rationale: Die temporale Wendung bleibt ausdrücklich erhalten. אַף bezeichnet idiomatisch heftigen Zorn.
- source_word: מְלָכִים
  choice: Könige
  rationale: Die gewöhnliche und konkrete Bedeutung des Plurals wird unverändert wiedergegeben.
theological_decisions:
- issue: Bezug von אֲדֹנָי in Psalm 110,5
  choice: »der Herr« ohne ausdrückliche Identifizierung; die Mehrdeutigkeit wird in einer Fußnote erläutert
  alternative: Der Titel bezeichnet entweder Gott, der Gericht hält, oder den rechts stehenden königlichen beziehungsweise messianischen Herrn aus dem Psalmzusammenhang.
  rationale: Ob Vers 5 einen Subjektwechsel zu Gott vollzieht oder weiter von der königlichen Gestalt spricht, ist umstritten. Die Übersetzung entscheidet diese theologische Spannung nicht stillschweigend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Wendung »zu deiner Rechten« erhält das poetische Körperbild, bleibt aber allgemein verständlich. »Zerschmettern« wahrt die Wucht des hebräischen Verbs.
