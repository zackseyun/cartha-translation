  source_fidelity: Der Nominalsatz אֲדֹנָי עַל־יְמִינְךָ wird idiomatisch und ohne inhaltlichen Zusatz als „Der Herr steht zu deiner Rechten“ wiedergegeben. „am Tag seines Zorns“ entspricht בְּיוֹם אַפּוֹ, und „wird er Könige zerschmettern“ gibt מָחַץ מְלָכִים im hier gut vertretbaren futurischen Verständnis wieder. Das konkrete Bild der rechten Hand/Rechten und die Mehrdeutigkeit des Referenten bleiben erhalten.
  naturalness: Der Text ist flüssiges, modernes und zugleich würdiges Standarddeutsch. Die Ergänzung „steht“ ist für einen hebräischen Nominalsatz im Deutschen natürlich. „Zerschmettern“ ist sprachlich angemessen und bildet die Gewalt des hebräischen Verbs treffend ab.
  terminology: „Der Herr“ gibt אֲדֹנָי als Titel wieder, ohne den Gottesnamen JHWH einzutragen. „Zorn“ und „Könige“ sind präzise. Die Fußnote markiert den alternativen syntaktisch-referenziellen Bezug und legt keine der Deutungen fest.
