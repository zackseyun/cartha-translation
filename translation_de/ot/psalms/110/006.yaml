  text: יָדִ֣ין בַּ֭/גּוֹיִם מָלֵ֣א גְוִיּ֑וֹת מָ֥חַץ רֹ֝֗אשׁ עַל אֶ֥רֶץ רַבָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/006.yaml
  text: He will judge among the nations[a]; he will fill them with corpses[d][c][b]; he will crush the head over a broad land.
translation:
  language: de
  text: Er hält Gericht unter den Völkern[a]; er füllt mit Leichen[b]; er zerschmettert das Haupt über einem weiten Land[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er richtet die Völker.“'
    reason: Die Präposition בְּ kann hier den Bereich des Gerichts („unter“) oder dessen Gegenstand („die Völker“) bezeichnen.
  - marker: b
    text: 'Wörtlich knapp: „er füllt mit Leichen“; was gefüllt wird, sagt der hebräische Text nicht ausdrücklich.'
    reason: Die elliptische Formulierung des Hebräischen nennt kein Objekt zu „füllen“.
  - marker: c
    text: 'Oder: „Er zerschmettert ein Haupt über der weiten Erde.“ Der hebräische Text hat den Singular „Haupt“; אֶרֶץ kann „Land“ oder „Erde“ bedeuten.'
    reason: Die Fußnote bewahrt die mögliche unbestimmte Wiedergabe des singularischen Nomens sowie die räumliche Mehrdeutigkeit von אֶרֶץ.
lexical_decisions:
- source_word: יָדִין
  choice: er hält Gericht
  rationale: Das Qal-Imperfekt bezeichnet hier im poetisch-prophetischen Zusammenhang ein künftiges richterliches Handeln. „Gericht halten“ bewahrt den forensischen Sinn und passt zugleich zum kriegerischen Kontext.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: גּוֹיִם bedeutet gewöhnlich „Völker“; בְּ bezeichnet hier am natürlichsten den Bereich, in dem das Gericht vollzogen wird.
- source_word: מָלֵא גְוִיּוֹת
  choice: er füllt alles mit Leichen
  rationale: Die hebräische Formulierung ist knapp und nennt kein ausdrückliches Objekt zu „füllen“. „Alles“ macht den deutschen Satz verständlich, ohne den Bezugsbereich auf die Völker selbst festzulegen; die Ergänzung wird in der Fußnote kenntlich gemacht.
- source_word: גְוִיּוֹת
  choice: Leichen
  rationale: Das Wort bezeichnet tote Körper; „Leichen“ gibt die drastische Schlachtfeldszene unmittelbar und gegenwärtig wieder.
- source_word: מָחַץ
  choice: er zerschmettert
  rationale: Das Verb bezeichnet einen heftigen Schlag mit zerbrechender oder vernichtender Wirkung. „Zerschmettern“ wahrt die Gewalt des Bildes.
- source_word: רֹאשׁ
  choice: das Haupt
  rationale: Der Singular wird als konkretes, zugleich deutungsoffenes Bild beibehalten. „Haupt“ kann im Deutschen sowohl den Kopf als auch eine führende Person bezeichnen, ohne den Bezug festzulegen.
- source_word: עַל אֶרֶץ רַבָּה
  choice: über einem weiten Land
  rationale: עַל wird räumlich mit „über“ wiedergegeben; אֶרֶץ kann „Land“ oder „Erde“ bedeuten, und רַבָּה beschreibt hier wahrscheinlich große Ausdehnung.
theological_decisions:
- issue: Bezug und Tragweite des singularischen רֹאשׁ in einem königlich-messianisch gelesenen Psalm
  choice: Der Singular bleibt als „das Haupt“ stehen, ohne seinen Träger zu bestimmen.
  alternative: „einen Herrscher“, „Häupter“ oder ein ausdrücklich benannter endzeitlicher Feind
  rationale: Der hebräische Text identifiziert das Haupt nicht. Die offene Bildsprache bewahrt die mögliche individuelle, kollektive oder repräsentative Deutung, ohne eine christologische oder andere dogmatische Zuordnung in den Wortlaut einzutragen.
- issue: Räumliche Tragweite von אֶרֶץ
  choice: Im Haupttext steht „Land“.
  alternative: „Erde“
  rationale: אֶרֶץ kann ein bestimmtes Gebiet oder die ganze Erde meinen. „Land“ ist die weniger expansive Wiedergabe; die weiter reichende Möglichkeit wird in einer Fußnote erhalten.
- issue: Nicht genanntes Objekt von מָלֵא
  choice: Zur natürlichen deutschen Formulierung wird „alles“ ergänzt und als Ergänzung kenntlich gemacht.
  alternative: 'Ohne Objekt: „er füllt mit Leichen“; oder bezogen auf die Völker: „er füllt sie mit Leichen“'
  rationale: Der knappe hebräische Wortlaut lässt offen, was mit Leichen gefüllt wird. Die Übersetzung darf diese syntaktische Leerstelle nicht unbemerkt auf die Völker festlegen.
translation_notes:
  register: Moderne, würdige Psalmsprache mit klarer Satzparallelität. „Gericht halten“, „Leichen“, „zerschmettern“ und „Haupt“ bewahren die forensische und martialische Bildwelt. Die knappe, schwierige Syntax wird im Haupttext lesbar gestaltet, ihre echten Mehrdeutigkeiten werden jedoch ausdrücklich in den Fußnoten erhalten.
