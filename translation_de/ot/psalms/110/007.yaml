translation:
  language: de
  text: Aus einem Bach am Weg wird er trinken[a]; darum wird er sein Haupt erheben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus dem Wasserlauf« bzw. »aus dem Wadi«. Das hebräische Wort kann einen Bach, ein Bachbett oder einen saisonalen Wasserlauf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung »sein Haupt erheben« kann neue Kraft, Zuversicht oder Erhöhung ausdrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנַּחַל
  choice: aus dem Bach
  rationale: נחל kann einen Bach, ein Bachbett oder einen saisonalen Wasserlauf bezeichnen. »Bach« ist im Deutschen natürlich, poetisch und lässt das Bild der Erfrischung auf dem Zug erkennen.
- source_word: בַּדֶּרֶךְ
  choice: am Weg
  rationale: דרך bezeichnet Weg, Straße oder Reise. »Am Weg« gibt die knappe hebräische Ortsangabe wieder, ohne sie stärker als »unterwegs« oder »auf dem Marsch« auszudeuten.
- source_word: יִשְׁתֶּה
  choice: wird er trinken
  rationale: Das hebräische Imperfekt kann zukünftiges oder wiederholtes Geschehen ausdrücken. Im Zusammenhang der angekündigten Handlungen des Psalms ist das Futur angemessen.
- source_word: עַל־כֵּן
  choice: darum
  rationale: Die Wendung bezeichnet Folge oder Konsequenz. »Darum« stellt den Zusammenhang knapp und idiomatisch her.
- source_word: יָרִים רֹאשׁ
  choice: wird er sein Haupt erheben
  rationale: Die bildhafte Wendung kann neue Kraft, Zuversicht oder Erhöhung ausdrücken. Die wörtlich-nahe Wiedergabe bewahrt diese Mehrdeutigkeit; »Haupt« erhält dabei den würdevollen poetischen Ton.
theological_decisions:
- issue: Bezug der maskulinen Singularformen in diesem Königspsalm
  choice: Das im Verb enthaltene maskuline Singularsubjekt wird mit »er« wiedergegeben, ohne es ausdrücklich zu identifizieren.
  alternative: Der davidische König, der im Psalm angesprochene Priesterkönig oder – in späterer kanonischer und theologischer Lesart – der Messias.
  rationale: Der hebräische Vers nennt das Subjekt nicht ausdrücklich. Die Übersetzung wahrt dies und trägt keine bestimmte christologische oder historische Identifikation in den Wortlaut ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzstellung. »Haupt« ist hier bewusst als gehobene, aber allgemein verständliche Entsprechung des hebräischen Bildes gewählt.
