translation:
  language: de
  text: Dann hätten die Wasser uns fortgerissen; der reißende Bach wäre über uns[a] hinweggegangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unsere Seele“; das hebräische Wort kann hier das Leben oder die ganze Person bezeichnen.'
