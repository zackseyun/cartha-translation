lexical_decisions:
- source_word: אֲזַי
  choice: Dann
  rationale: Der temporale Ausdruck führt die irreale Folge aus dem vorherigen Vers weiter; im Deutschen gibt der Konjunktiv II diese Gegenläufigkeit natürlich wieder.
- source_word: הַמַּיִם
  choice: die Wasser
  rationale: Der Plural bewahrt das poetische Bild der bedrohlich anschwellenden Wassermassen.
- source_word: שְׁטָפוּנוּ
  choice: hätten uns fortgerissen
  rationale: Das Verb bezeichnet ein Überschwemmen beziehungsweise Wegspülen; „fortgerissen“ vermittelt die zerstörerische Kraft des Wassers.
- source_word: נַחְלָה
  choice: der reißende Bach
  rationale: נַחַל kann einen Bach oder ein Wadi bezeichnen; im Zusammenhang gefährlicher Wassermassen bringt „reißender Bach“ die hier gemeinte Strömungsgewalt zum Ausdruck, ohne bereits „Flut“ zu sagen.
- source_word: עָבַר עַל
  choice: wäre über … hinweggegangen
  rationale: Die Wiedergabe hält die räumliche Grundbedeutung „über etwas hinweggehen“ fest und führt den irrealen Sinn fort.
- source_word: נַפְשֵׁנוּ
  choice: unser Leben
  rationale: נֶפֶשׁ bezeichnet hier im Zusammenhang tödlicher Gefahr das Leben beziehungsweise die ganze Person, nicht notwendig eine vom Körper getrennte Seele.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im Bild tödlicher Wassergefahr
  choice: unser Leben
  alternative: unsere Seele / uns
  rationale: „Unser Leben“ gibt den kontextuellen Sinn verständlich wieder und vermeidet eine nicht erforderliche anthropologische Festlegung. Die formnähere Wiedergabe und die umfassende Bedeutung werden in der Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der Konjunktiv II macht die vom Kontext getragene irreale Folge deutlich; die parallelen Wasserbilder und ihre Steigerung bleiben erhalten.
