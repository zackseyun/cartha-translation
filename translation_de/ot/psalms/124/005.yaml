translation:
  language: de
  text: Dann wären die stolzen Wasser über unsere Seele hinweggegangen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann wären die übermütigen Wasser über uns hinweggegangen.“ Das hebräische Adjektiv kann „stolz“, „vermessen“ oder „anmaßend“ bedeuten und beschreibt die Wasser bildhaft als gewaltsam übermächtig. „Unsere Seele“ kann hier auch „uns“ oder „unser Leben“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲזַי
  choice: Dann
  rationale: Der temporale Anschluss führt die uneـreale Folge aus dem vorausgehenden Zusammenhang fort; „Dann“ ist im Deutschen knapp und natürlich.
- source_word: עָבַר עַל
  choice: wären … über … hinweggegangen
  rationale: Die räumliche Grundbedeutung „über etwas hinweggehen“ bleibt erhalten; der Konjunktiv II gibt die im Kontext vorausgesetzte, aber nicht eingetretene Folge wieder.
- source_word: נַפְשֵׁנוּ
  choice: unsere Seele
  rationale: Die kollektive Singularform des Hebräischen wird bewahrt. „Seele“ bezeichnet hier das gemeinsame Leben beziehungsweise die ganze Person, ohne diese Mehrdeutigkeit im Haupttext aufzulösen.
- source_word: הַמַּיִם
  choice: die … Wasser
  rationale: Der hebräische Plural und das poetische Bild der überströmenden Wassermassen werden direkt wiedergegeben.
- source_word: הַזֵּידוֹנִים
  choice: tobenden
  rationale: Das Adjektiv bezeichnet eigentlich stolzes, vermessenes oder anmaßendes Verhalten. Auf Wasser übertragen vermittelt „tobend“ dessen gewaltsam übermächtige Wirkung in natürlichem modernem Deutsch; die wörtlichere Metapher wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Poetisch und würdevoll, zugleich in modernem Standarddeutsch verständlich. Die ungewöhnliche kollektive Wendung „unsere Seele“ bewahrt das hebräische Bild; die Fußnote erläutert sowohl diese Bedeutungsbreite als auch die personifizierende Beschreibung der Wasser.
