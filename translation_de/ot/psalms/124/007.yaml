source:
  edition: WLC
  text: נַפְשֵׁ֗/נוּ כְּ/צִפּ֥וֹר נִמְלְטָה֮ מִ/פַּ֪ח י֫וֹקְשִׁ֥ים הַ/פַּ֥ח נִשְׁבָּ֗ר וַ/אֲנַ֥חְנוּ נִמְלָֽטְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/007.yaml
  text: Our soul has escaped like a bird from the snare of the fowlers[a]; the snare is broken[b], and we have escaped.
translation:
  language: de
  text: Unser Leben[a] ist wie ein Vogel der Schlinge der Vogelfänger entkommen; die Schlinge ist zerbrochen, und wir sind entkommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Unsere Seele. Das hebräische Wort kann je nach Zusammenhang auch das Leben oder die ganze Person bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: unsere Seele
  rationale: נֶפֶשׁ bezeichnet je nach Zusammenhang Seele, Leben oder die ganze Person. »Unsere Seele« bildet die kollektive Singularform und die poetische Ausdrucksweise unmittelbar ab, ohne die mögliche Bedeutung »unser Leben« auszuschließen.
- source_word: כְּצִפּוֹר
  choice: wie ein Vogel
  rationale: צִפּוֹר ist hier die allgemeine Bezeichnung für einen Vogel und nicht spezifisch für einen Sperling.
- source_word: נִמְלְטָה / נִמְלָטְנוּ
  choice: ist … entkommen / wir sind entkommen
  rationale: Das Nifal von מלט bezeichnet hier das Entkommen aus einer Gefahr. Die Wiederholung wird beibehalten und im Deutschen idiomatisch mit dem Perfekt wiedergegeben.
- source_word: מִפַּח / הַפַּח
  choice: der Schlinge / die Schlinge
  rationale: פַּח bezeichnet eine Fangvorrichtung, besonders im Bild des Vogelfangs. »Schlinge« erhält sowohl das Bild als auch die hebräische Wiederholung.
- source_word: יוֹקְשִׁים
  choice: Vogelfänger
  rationale: Das Partizip von יקשׁ bezeichnet Menschen, die Fallen oder Schlingen legen. Im unmittelbaren Vogelbild ist »Vogelfänger« präzise und im gehobenen poetischen Register verständlich.
- source_word: נִשְׁבָּר
  choice: ist zerrissen
  rationale: Das passive Perfekt beschreibt die zerstörte Schlinge und ihren gegenwärtigen unwirksamen Zustand. Bei einer Schlinge klingt »zerrissen« im Deutschen bildhaft und natürlich.
- source_word: וַאֲנַחְנוּ
  choice: und wir
  rationale: Das ausdrücklich gesetzte Pronomen wird zur Wahrung des Nachdrucks wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang von נֶפֶשׁ
  choice: »unsere Seele« im Haupttext
  alternative: »unser Leben« oder »wir selbst«
  rationale: Die formnahe Wiedergabe wahrt die poetische und anthropologische Offenheit des hebräischen Ausdrucks, statt ihn ausschließlich auf biologisches Leben oder eine vom Körper getrennte Seele festzulegen.
translation_notes:
  register: Moderne, würdige Psalmsprache mit klarer Satzführung. Die hebräischen Wiederholungen von »Schlinge« und »entkommen« bleiben als tragende poetische Elemente erhalten.
