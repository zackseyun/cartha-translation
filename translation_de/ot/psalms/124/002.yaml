source:
  edition: WLC
  text: לוּלֵ֣י יְ֭הוָה שֶׁ/הָ֣יָה לָ֑/נוּ בְּ/ק֖וּם עָלֵ֣י/נוּ אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/002.yaml
  text: If Yahweh had not been for us when man rose up against us—[a]
translation:
  language: de
  text: Wenn Jahwe nicht für uns gewesen wäre, als Menschen gegen uns aufstanden —[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wenn Jahwe nicht auf unserer Seite gewesen wäre, als Menschen gegen uns aufstanden.«'
    reason: Lexikalische Alternative zu לָנוּ, die den Gedanken des Beistands ausdrücklicher wiedergibt.
lexical_decisions:
- source_word: לוּלֵי
  choice: wenn … nicht … gewesen wäre
  rationale: Die Partikel leitet eine irreale Bedingung der Vergangenheit ein; der zugehörige Folgesatz schließt sich in Vers 3 an.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des im hebräischen Text stehenden Gottesnamens bewahrt ihn als Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: שֶׁהָיָה לָנוּ
  choice: für uns gewesen wäre
  rationale: In Verbindung mit לוּלֵי ist die Aussage kontrafaktisch. „Für uns“ bleibt nah an der Präposition ל und bezeichnet hier Beistand oder unterstützende Zuwendung, ohne die Bildsprache stärker auszudeuten.
- source_word: בְּקוּם
  choice: als … aufstanden
  rationale: Die Präposition בְּ beim Infinitiv bezeichnet hier den Zeitpunkt; „aufstehen“ trägt im Zusammenhang den feindseligen Sinn des Sich-Erhebens.
- source_word: עָלֵינוּ
  choice: gegen uns
  rationale: Bei feindseligem Handeln hat עַל adversative Bedeutung; „gegen uns“ ist dafür im Deutschen natürlich.
- source_word: אָדָם
  choice: Menschen
  rationale: Das hebräische Kollektivwort steht im Singular, bezeichnet hier aber menschliche Angreifer allgemein. Der deutsche Plural gibt diesen kollektiven Sinn natürlich wieder und stimmt mit dem pluralischen Verb überein, das die deutsche Formulierung erfordert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen; die traditionelle Ersetzung durch den Titel „der HERR“ wird nicht in den Haupttext übernommen.
- issue: Bedeutung von לָנוּ bei היה
  choice: für uns
  alternative: auf unserer Seite
  rationale: „Für uns“ wahrt die knappe und leicht offene Formulierung des Hebräischen. „Auf unserer Seite“ macht den darin liegenden Gedanken des Beistands deutlicher, ist aber stärker deutend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kontrafaktischer Satzform. Der Gedankenstrich zeigt an, dass der Bedingungssatz erst im folgenden Vers fortgeführt und beantwortet wird.
