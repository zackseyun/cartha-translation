lexical_decisions:
- source_word: אֲזַי
  choice: dann
  rationale: Das Zeitadverb leitet innerhalb der irrealen Bedingungsfolge die Folge ein; „dann“ ist knapp und natürlich.
- source_word: חַיִּים
  choice: lebendig
  rationale: Der adverbial gebrauchte Ausdruck bezeichnet den Zustand der Bedrohten; „lebendig verschlungen“ bewahrt das eindringliche Bild.
- source_word: בְּלָעוּנוּ
  choice: hätten sie uns … verschlungen
  rationale: Die Perfektform wird aufgrund des Zusammenhangs in V. 2–5 als irreale Folge wiedergegeben. „Verschlungen“ erhält die konkrete Metapher.
- source_word: בַּחֲרוֹת
  choice: als … entbrannte
  rationale: Der Infinitiv mit ב bezeichnet den zeitlichen Begleitumstand. „Entbrannte“ bewahrt zugleich das Feuerbild.
- source_word: אַפָּם
  choice: ihr Zorn
  rationale: אַף bedeutet wörtlich „Nase“, bezeichnet hier aber idiomatisch den Zorn. Die Bildlichkeit des Brennens bleibt im Verb erhalten.
- source_word: בָּנוּ
  choice: gegen uns
  rationale: Bei einem Ausdruck des Zorns bezeichnet ב die feindselige Ausrichtung auf die Betroffenen.
theological_decisions:
- issue: Zeit- und Aussageweise von בְּלָעוּנוּ
  choice: 'irreale Folge: „hätten sie uns … verschlungen“'
  alternative: 'einfaches Vergangenheitstempus: „verschlangen sie uns“'
  rationale: Der weitere Satzbau von Psalm 124,2–5 setzt eine nicht eingetretene Folge voraus; die morphologisch mögliche Vergangenheitslesart wird jedoch in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die irreale Satzfolge wird mit Konjunktiv II ausgedrückt; die drastische Metapher des lebendigen Verschlingens und das Feuerbild des Zorns bleiben erhalten.
