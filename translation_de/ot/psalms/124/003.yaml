  text: dann hätten sie uns lebendig verschlungen, als ihr Zorn gegen uns entbrannte.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie verschlangen uns“, falls die Form als einfache Vergangenheit verstanden wird. Der Zusammenhang in den Versen 2–5 spricht für die irreale Wiedergabe „hätten sie uns verschlungen“.'
