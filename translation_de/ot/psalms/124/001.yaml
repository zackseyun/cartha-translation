base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/001.yaml
  text: A Song of Ascents[a]. Of David. If Yahweh had not been for us—let Israel now say—
translation:
  language: de
  text: 'Ein Lied der Aufstiege.[a] Von David.[b]


    Wenn Jahwe nicht für uns gewesen wäre[c] – so sage doch Israel –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Ein Wallfahrtslied.'
    reason: Die Bedeutung der Überschrift ist nicht sicher; wahrscheinlich steht sie mit dem Hinaufziehen nach Jerusalem in Verbindung.
  - marker: b
    text: Die hebräische Formulierung kann auch „für David“ oder „David zugehörig“ bedeuten.
    reason: Die Präposition לְ in Psalmüberschriften legt Urheberschaft, Widmung oder Zuordnung nicht eindeutig fest.
  - marker: c
    text: 'Oder idiomatischer: Wenn Jahwe nicht auf unserer Seite gewesen wäre.'
    reason: Die Alternative verdeutlicht den Sinn göttlichen Beistands, ist aber auslegender als der Haupttext.
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Lied der Aufstiege
  rationale: Die formnahe Wiedergabe bewahrt das Bild des Hinaufsteigens und lässt offen, ob Wallfahrten nach Jerusalem, liturgische Stufen oder eine andere Verwendung gemeint sind.
- source_word: לְדָוִד
  choice: Von David
  rationale: Diese in deutschen Psalmüberschriften geläufige Form kann Zugehörigkeit oder Urheberschaft ausdrücken, ohne die Funktion der Präposition לְ vollständig festzulegen.
- source_word: לוּלֵי
  choice: Wenn … nicht … gewesen wäre
  rationale: Die Formulierung gibt die kontrafaktische Bedingung wieder, deren Folgesatz erst im nächsten Vers ausgeführt wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des Gottesnamens bewahrt den direkten Bezug auf das Tetragramm.
- source_word: שֶׁהָיָה לָנוּ
  choice: für uns gewesen wäre
  rationale: Die relativ formnahe Wendung bringt Jahwes Beistand zum Ausdruck, ohne das Verhältnis stärker als nötig mit einer festen deutschen Redensart auszulegen.
- source_word: יֹאמַר נָא
  choice: so sage … jetzt
  rationale: Der deutsche Jussiv gibt die auffordernde Funktion wieder; „jetzt“ entspricht נָא hier im rhetorischen Zusammenhang.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Name bezeichnet hier kollektiv das Bundesvolk und wird unverändert übernommen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Sinn von שֶׁהָיָה לָנוּ
  choice: für uns gewesen wäre
  alternative: auf unserer Seite gewesen wäre
  rationale: Der Haupttext bleibt näher an der offenen hebräischen Formulierung; die idiomatische Alternative macht den gemeinten Beistand deutlich, legt das Bild aber stärker fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Überschrift bleibt bewusst formnah; der abgebrochene Bedingungssatz und die Gedankenstriche bewahren die rhetorische Fortsetzung in Vers 2.
