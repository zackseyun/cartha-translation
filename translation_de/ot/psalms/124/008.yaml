source:
  edition: WLC
  text: עֶ֭זְרֵ/נוּ בְּ/שֵׁ֣ם יְהוָ֑ה עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/008.yaml
  text: Our help is in the name of Yahweh[a], maker of heaven and earth.
translation:
  language: de
  text: Unsere Hilfe ist im Namen Jahwes[a], des Schöpfers von Himmel und Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit »der HERR« wiedergegeben.'
    reason: Der hebräische Gottesname wird mit „Jahwe“ wiedergegeben; die Fußnote dokumentiert die verbreitete traditionelle Ersatzlesung.
lexical_decisions:
- source_word: עֶזְרֵנוּ
  choice: Unsere Hilfe
  rationale: Das Substantiv עֵזֶר mit dem Suffix der 1. Person Plural bezeichnet hier Hilfe oder Beistand, nicht die Person eines Helfers.
- source_word: בְּשֵׁם
  choice: steht im Namen
  rationale: בְּ mit שֵׁם bezeichnet hier den Grund und Bezug des Vertrauens beziehungsweise der Anrufung. Die im Deutschen geläufige Wendung »steht im Namen« bewahrt diese liturgische und theologische Dichte.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname JHWH wird als persönlicher Name »Jahwe« wiedergegeben; der Genitiv ergibt sich aus »im Namen«.
- source_word: עֹשֵׂה
  choice: der … gemacht hat
  rationale: Das Qal-Partizip kennzeichnet Jahwe durch sein schöpferisches Handeln. Ein Relativsatz ist im Deutschen natürlicher als »Macher von«, ohne die Aussage in einen abstrakten Titel umzudeuten.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: Himmel und Erde
  rationale: Die feste Wortverbindung bezeichnet als Merismus die gesamte Schöpfung und ist im Deutschen idiomatisch und präzise.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen JHWH, nicht den Titel אֲדֹנָי. Die Wiedergabe »Jahwe« bewahrt den persönlichen Bundesnamen; die traditionelle Ersetzung durch »der HERR« wird in der Fußnote genannt.
- issue: Bedeutung von »im Namen«
  choice: Die Hilfe gründet in Jahwes Namen und damit in seiner offenbarten Person und Vollmacht.
  alternative: Die Hilfe erfolgt lediglich durch das Aussprechen des Namens.
  rationale: Die Formulierung wird nicht magisch verengt. Sie lässt die biblische Spannung von Vertrauen, Anrufung und göttlicher Vollmacht bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst liturgischem Klang. »Steht im Namen« ist eine geläufige, natürliche Wendung; der Relativsatz vermeidet das im Deutschen schwerfällige und potenziell titelartige »Macher von Himmel und Erde«.
