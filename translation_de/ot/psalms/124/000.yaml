  yaml_path: translation/ot/psalms/124/000.yaml
  text: A Song of Ascents[a]. Of David. If Yahweh had not been for us—let Israel now say—
translation:
  language: de
  text: 'Ein Wallfahrtslied[a]. Von David.


    Wäre der HERR nicht für uns gewesen – so soll Israel es nun sagen –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ein Lied der Aufstiege«; auch übersetzt: »Ein Stufenlied«.'
    reason: Die Bedeutung der Psalmüberschrift ist nicht völlig sicher; »Wallfahrtslied« gibt ihre wahrscheinlich gemeinte Funktion idiomatisch wieder.
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Wörtlich bezeichnet die Wendung ein »Lied der Aufstiege«. Im Zusammenhang der Psalmen 120–134 wird sie natürlich als Lied für den Aufstieg nach Jerusalem beziehungsweise für Wallfahrten verstanden; die Fußnote bewahrt die wörtlichere Alternative.
- source_word: לְדָוִד
  choice: Von David
  rationale: Die knappe deutsche Überschrift gibt die Zugehörigkeitsangabe wieder, ohne genauer festzulegen, ob sie Verfasserschaft, Widmung oder Zuordnung bezeichnet.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen beziehungsweise Großbuchstaben ist würdig und allgemein verständlich, ohne die Aussprache des Namens festzulegen.
- source_word: לוּלֵי ... שֶׁהָיָה לָנוּ
  choice: Wäre ... nicht für uns gewesen
  rationale: Die irreale Bedingung und die offene Fortsetzung in den folgenden Vers hinein werden erhalten. »Für uns« bleibt näher am hebräischen לָנוּ als die idiomatischere Deutung »auf unserer Seite«.
- source_word: יֹאמַר נָא יִשְׂרָאֵל
  choice: so soll Israel sagen
  rationale: נָא verleiht der Aufforderung einen nachdrücklichen, einladenden Ton; die Formulierung fügt sich natürlich in den begonnenen Kehrvers ein.
theological_decisions:
- issue: Wiedergabe des Tetragramms
  choice: HERR
  alternative: Jahwe
  rationale: »HERR« folgt einer breit verankerten jüdischen und deutschen Bibeltradition und vermeidet, eine bestimmte Rekonstruktion der Aussprache als sicher darzustellen.
- issue: Bedeutung von היה לנו
  choice: für uns gewesen
  alternative: auf unserer Seite gewesen
  rationale: Die gewählte Form bewahrt die relationale Offenheit des Hebräischen; die Alternative legt stärker eine militärische oder parteiliche Unterstützung nahe.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Gedankenstriche erhalten den absichtlich unvollständigen Bedingungssatz, der im folgenden Vers aufgenommen wird. Die Psalmüberschrift bleibt knapp und formal.
