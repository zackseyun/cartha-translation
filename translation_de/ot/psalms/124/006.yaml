source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֑ה שֶׁ/לֹּ֥א נְתָנָ֥/נוּ טֶ֝֗רֶף לְ/שִׁנֵּי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/006.yaml
  text: Blessed be Yahweh[a], who has not given us as prey to their teeth.
translation:
  language: de
  text: Gepriesen sei Jahwe[a], der uns ihren Zähnen nicht zur Beute gegeben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gesegnet ist Jahwe.“ Die hebräische Segensformel kann sowohl als Feststellung wie als Lobpreis verstanden werden; „Gepriesen sei Jahwe“ bringt hier ihren doxologischen Charakter natürlicher zum Ausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Die passive Partizipialform steht hier als doxologische Segensformel. „Gepriesen sei“ klingt im heutigen Deutschen natürlich und würdevoll; „Gesegnet sei“ wäre formnäher, kann aber missverständlich nach einem von außen empfangenen Segen klingen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Form.
- source_word: שֶׁלֹּא
  choice: der … nicht
  rationale: Die Verbindung wird als Relativsatz verstanden, der den Grund des Lobpreises in Jahwes rettendem Handeln nennt.
- source_word: נְתָנָנוּ
  choice: uns … nicht … gegeben hat
  rationale: Das Perfekt bezeichnet die vollendete Rettungstat. Das deutsche Perfekt gibt den Rückblick auf diese Tat natürlich wieder, ohne das stärkere „ausgeliefert“ in den Grundtext einzutragen.
- source_word: טֶרֶף
  choice: zur Beute
  rationale: Im Zusammenhang mit den Zähnen bezeichnet das Wort tierische Beute und bewahrt das Bild der Feinde als Raubtiere.
- source_word: לְשִׁנֵּיהֶם
  choice: ihren Zähnen
  rationale: Die konkrete Metapher des Hebräischen bleibt erhalten. Der Dativ nach „geben“ bildet die Zuordnung der Beute zu den Zähnen knapp und idiomatisch ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Seine Wiedergabe als „Jahwe“ bewahrt dies, während „der HERR“ den Namen durch einen Titel ersetzt.
- issue: Bedeutung der Segensformel בָּרוּךְ יְהוָה
  choice: Gepriesen sei Jahwe
  alternative: Gesegnet ist Jahwe
  rationale: Die gewählte Form wahrt den doxologischen Ausruf. Die Fußnote nennt die formnähere Alternative, ohne die Formel auf eine bloße Feststellung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe poetische Aussage und das drastische Bild von Beute und Zähnen bleiben erhalten.
