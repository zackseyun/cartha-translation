base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/032.yaml
  text: The God who girds me with strength and makes my way blameless[a][b].
translation:
  language: de
  text: Der Gott, der mich mit Kraft umgürtet[a] und meinen Weg ohne Tadel macht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der mich mit Macht ausrüstet“. Das hebräische Verb bezeichnet wörtlich das Umgürten; חַיִל kann „Kraft“, „Macht“ oder „Tapferkeit“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meinen Weg vollkommen, ganz oder unversehrt macht“. Das hebräische תָּמִים kann Vollständigkeit, Unversehrtheit oder Untadeligkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Der Gott
  rationale: Der Artikel wird bewahrt; zugleich eröffnet die Formulierung einen beschreibenden Relativsatz über Gott.
- source_word: הַמְאַזְּרֵנִי
  choice: der mich … umgürtet
  rationale: Das Verb אזר bezeichnet konkret das Umgürten und vermittelt im Zusammenhang das Ausrüsten zum Handeln; das Bild bleibt im Deutschen verständlich und würdevoll.
- source_word: חָיִל
  choice: mit Kraft
  rationale: חיל kann Kraft, Macht oder Tapferkeit bezeichnen. „Kraft“ passt natürlich zum Bild des Umgürtens und lässt die genaue Nuance offen.
- source_word: וַיִּתֵּן
  choice: und … macht
  rationale: 'נתן bedeutet gewöhnlich „geben“, hat hier mit dem Prädikatsadjektiv jedoch resultativen Sinn: Gott bewirkt, dass der Weg die bezeichnete Eigenschaft erhält.'
- source_word: תָּמִים
  choice: vollkommen
  rationale: תמים bezeichnet Ganzheit, Unversehrtheit oder Untadeligkeit. „Vollkommen“ bewahrt hier die Spannung zwischen einem vollständigen und einem untadeligen Weg; eine Fußnote nennt die Alternativen.
- source_word: דַּרְכִּי
  choice: meinen Weg
  rationale: „Weg“ erhält die geläufige Metapher für Lebensführung oder Lebenslauf.
theological_decisions:
- issue: Bedeutung von תמים in Bezug auf den Weg des Psalmisten
  choice: vollkommen
  alternative: untadelig; unversehrt
  rationale: Die Übersetzung wahrt die semantische Weite von Ganzheit und Integrität, ohne die Aussage ausdrücklich als Behauptung sündloser Vollkommenheit festzulegen. Die Fußnote macht die Spannung sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das konkrete Bild des Umgürtens sowie die Mehrdeutigkeit von חיל und תמים bleiben erhalten; die Fußnoten erläutern natürlichere beziehungsweise alternative Wiedergaben.
