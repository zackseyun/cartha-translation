  text: עָ֘לָ֤ה עָשָׁ֨ן בְּ/אַפּ֗/וֹ וְ/אֵשׁ מִ/פִּ֥י/ו תֹּאכֵ֑ל גֶּ֝חָלִ֗ים בָּעֲר֥וּ מִמֶּֽ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/008.yaml
  text: Smoke rose from his nostrils[a], and fire from his mouth consumed; coals blazed from him.
translation:
  language: de
  text: Rauch stieg aus seinen Nasenlöchern auf[a], und aus seinem Mund kam verzehrendes Feuer; glühende Kohlen loderten aus ihm hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus seinem Zorn«. Das hebräische Wort אַף kann »Nase« und übertragen auch »Zorn« bedeuten. Der Parallelismus mit »aus seinem Mund« spricht hier für das konkrete Bild.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָשָׁן
  choice: Rauch stieg … auf
  rationale: Gibt die Aufwärtsbewegung von עלה in natürlichem deutschem Ausdruck für Rauch wieder.
- source_word: בְּאַפּוֹ
  choice: aus seinen Nasenlöchern
  rationale: אַף kann »Nase/Nasenloch« oder idiomatisch »Zorn« bedeuten. Der Parallelismus mit »aus seinem Mund« stützt hier das konkrete Körperbild; der deutsche Plural ist idiomatisch.
- source_word: מִפִּיו תֹּאכֵל
  choice: aus seinem Mund verzehrte
  rationale: Bewahrt תֹּאכֵל als eigenständiges Verb mit der aktiven Bedeutung »fressen/verzehren«, ohne ein Objekt hinzuzufügen, das im Hebräischen nicht genannt wird.
- source_word: גֶּחָלִים
  choice: glühende Kohlen
  rationale: »Kohlen« ist die direkte Entsprechung; »glühende« macht im Deutschen die gemeinte Feuerkohle natürlich verständlich, während das folgende Verb ihre intensive Bewegung ausdrückt.
- source_word: בָּעֲרוּ מִמֶּנּוּ
  choice: loderten aus ihm hervor
  rationale: »Loderten« gibt das kräftige Brennen poetisch wieder; »aus ihm hervor« bewahrt die Herkunftsangabe מן und klingt im Deutschen natürlicher als bloß »aus ihm«.
theological_decisions:
- issue: Anthropomorphe Gottesdarstellung in einer Theophanie
  choice: Das konkrete Bild mit »Nasenlöchern« und »Mund« bleibt erhalten.
  alternative: אַף als »Zorn« wiedergeben und die Körpermetaphorik abschwächen.
  rationale: Der poetische Parallelismus und die Feuer- und Rauchbilder sprechen für die konkrete Darstellung. Die Übersetzung soll die theologische Spannung des anthropomorphen Bildes nicht durch eine Abstraktion auflösen.
translation_notes:
  register: Moderne, würdevolle deutsche Bibelsprache mit kräftiger poetischer Bildlichkeit. Die auffällige transitive Formulierung »Feuer … verzehrte« bleibt bewusst ohne ergänztes Objekt, entsprechend der offenen hebräischen Aussage.
