  source_fidelity: 'Der Parallelismus und das Wortspiel werden im Haupttext gut nachvollziehbar wiedergegeben: נָבָר/תתברר durch „Reinen/rein“ sowie עִקֵּשׁ/תתפתל durch „Verkehrten/verdreht“. Die harte, potenziell anstößige Aussage über Gottes Verhalten gegenüber dem Verkehrten wird nicht unzulässig dogmatisch geglättet. Die Fußnote sollte jedoch nicht behaupten, das hebräische Wortspiel schließe notwendig ein „Überwinden“ ein; dies geht über die lexikalisch-poetische Aussage hinaus.'
  naturalness: „Mit dem Reinen zeigst du dich rein, und mit dem Verkehrten zeigst du dich verdreht“ ist als bewusst dichterisch zugespitzter Parallelismus verständlich und im würdevollen Psalmregister vertretbar. „Verkehrten“ und „verdreht“ sind dabei semantisch hinreichend eng gekoppelt.
  terminology: „Reinen“ gibt die moralische Lauterkeit von נָבָר angemessen wieder. „Verkehrten“ wahrt die moralische Bildsprache von עִקֵּשׁ. „Verdreht“ hält die spiegelnde Wortfigur bei תתפתל aufrecht; die erläuternde Fußnote ist wegen möglicher Missverständnisse sinnvoll.
