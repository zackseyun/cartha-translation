  text: עִם נָבָ֥ר תִּתְבָּרָ֑ר וְ/עִם עִ֝קֵּ֗שׁ תִּתְפַּתָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/026.yaml
  text: With the pure you show yourself pure[a], and with the crooked you show yourself twisted.
translation:
  language: de
  text: Mit dem Reinen zeigst du dich rein, und mit dem Verkehrten zeigst du dich verdreht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zeigst du dich gewandt“ beziehungsweise „überlistest du den Verkehrten“. Das Hebräische gebraucht ein wechselseitiges Wortspiel: Gott begegnet dem Verkehrten auf eine Weise, die dessen Verkehrtheit entspricht und gegen ihn wendet; es bedeutet nicht, dass Gott selbst moralisch verkehrt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: der Reine
  rationale: Das Adjektiv bezeichnet hier einen moralisch reinen oder lauteren Menschen. „Der Reine“ ist verständlich und ermöglicht zusammen mit dem folgenden Verb die Wiedergabe des hebräischen Wortspiels.
- source_word: תִּתְבָּרָר
  choice: zeigst du dich rein
  rationale: Die Hitpael-Form beschreibt, wie Gott sich dem Reinen gegenüber erweist. Die Formulierung bewahrt sowohl den Beziehungsaspekt als auch das Wortspiel mit נָבָר.
- source_word: עִקֵּשׁ
  choice: der Verkehrte
  rationale: Das Wort bezeichnet einen moralisch verdrehten oder verkehrten Menschen. „Verkehrt“ ist im Deutschen würdevoll und deutlich moralisch geprägt.
- source_word: תִּתְפַּתָּל
  choice: zeigst du dich verdreht
  rationale: Die Hitpael-Form von פתל greift das Bild des Verdrehens auf und bildet eine scharfe Entsprechung zum Charakter des Verkehrten. Die ungeglättete Wiedergabe erhält die poetische Spannung des Hebräischen.
theological_decisions:
- issue: Anthropomorphe Beschreibung von Gottes Antwort auf den Verkehrten
  choice: Die starke wechselseitige Formulierung „zeigst du dich verdreht“ bleibt im Haupttext erhalten.
  alternative: „zeigst du dich überlegen“ oder „überlistest du ihn“
  rationale: Der hebräische Parallelismus schildert Gottes Handeln als eine dem jeweiligen Menschen entsprechende Antwort. Eine glattere Formulierung würde die bewusste Spannung von „rein/rein“ und „verkehrt/verdreht“ abschwächen. Die Fußnote stellt klar, dass damit keine moralische Verkehrtheit Gottes ausgesagt wird.
translation_notes:
  register: Moderne, verständliche und zugleich dichterisch-würdevolle Sprache. Der parallele Satzbau und das hebräische Wortspiel werden soweit möglich bewahrt; die erklärungsbedürftige theologische Spannung wird nicht im Haupttext geglättet, sondern in einer Fußnote erläutert.
