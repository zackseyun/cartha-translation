source:
  edition: WLC
  text: מְלַמֵּ֣ד יָ֭דַ/י לַ/מִּלְחָמָ֑ה וְֽ/נִחֲתָ֥ה קֶֽשֶׁת נְ֝חוּשָׁ֗ה זְרוֹעֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/034.yaml
  text: He trains my hands for battle[a], and my arms can bend a bow of bronze.
translation:
  language: de
  text: Er trainiert meine Hände für den Kampf, und meine Arme können einen bronzenen Bogen biegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formaler: »Ein bronzener Bogen wird von meinen Armen gebogen.« Die hebräische Satzkonstruktion ist schwierig und lässt sich auch in diesem passiven Sinn wiedergeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְלַמֵּד
  choice: trainiert
  rationale: Das Partizip von למד kann »lehrt« oder »trainiert« bedeuten. Im Zusammenhang mit Händen und Kampf bezeichnet »trainiert« natürliche und konkrete Vorbereitung auf den Kampf.
- source_word: יָדַי
  choice: meine Hände
  rationale: Der konkrete Plural wird beibehalten und bewahrt das körperliche Bild des hebräischen Textes.
- source_word: לַמִּלְחָמָה
  choice: für den Kampf
  rationale: מלחמה kann Krieg oder Kampf bezeichnen. Hier passt »für den Kampf« idiomatisch zur Ausbildung der Hände.
- source_word: וְנִחֲתָה
  choice: können … spannen
  rationale: Die schwierige Verbform wird im Zusammenhang als durch Gott verliehene Fähigkeit verstanden. »Können … spannen« gibt den sinnentsprechenden Zusammenhang natürlich wieder, ohne die wörtlichere passive Deutung zu verschweigen.
- source_word: קֶשֶׁת
  choice: einen Bogen
  rationale: Die übliche Bezeichnung der Waffe; der Singular bleibt erhalten.
- source_word: נְחוּשָׁה
  choice: aus Bronze
  rationale: Das Adjektiv bezeichnet Kupfer beziehungsweise Bronze. »Bronze« ist für die vorgestellte widerstandsfähige Waffe die naheliegende Wiedergabe.
- source_word: זְרוֹעֹתָי
  choice: meine Arme
  rationale: Der konkrete Plural und das körperliche Kraftbild des Ausgangstextes werden bewahrt.
theological_decisions:
- issue: Deutung der schwierigen Klausel וְנִחֲתָה קֶשֶׁת נְחוּשָׁה זְרוֹעֹתָי
  choice: 'Die Klausel beschreibt verliehene Fähigkeit: »meine Arme können einen Bogen aus Bronze spannen«.'
  alternative: »Ein Bogen aus Bronze wird von meinen Armen gespannt.«
  rationale: Die hebräische Konstruktion ist knapp und syntaktisch schwierig. Die Hauptfassung passt zum Parallelismus, in dem Gott den Beter zum Kampf befähigt. Die Fußnote bewahrt die formellere passive Deutung und löst die Mehrdeutigkeit nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Trainiert« und »für den Kampf« sind klar und gegenwärtig; »einen Bogen aus Bronze spannen« bewahrt das konkrete kriegerische Bild. Der Fußnotenmarker steht nach der gesamten schwierigen Klausel.
