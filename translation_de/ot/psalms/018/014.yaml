  text: He sent out his arrows and scattered them[a]; he multiplied lightning bolts and threw them into confusion.
translation:
  language: de
  text: Er sandte seine Pfeile aus und zerstreute sie; mit Blitzen in Fülle[a] versetzte er sie in Verwirrung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „…; er vervielfachte die Blitze und versetzte sie in Verwirrung.“ Die schwierige hebräische Form רָב kann verbal („er vervielfachte“) oder als Mengenangabe („zahlreich“, „in Fülle“) verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Er schoss … ab
  rationale: שׁלח bezeichnet hier das Aussenden der Pfeile. Im Deutschen gibt „abschießen“ die konkrete Waffenhandlung im Bild des göttlichen Kriegers natürlich wieder.
- source_word: חִצָּיו
  choice: seine Pfeile
  rationale: חֵץ bedeutet „Pfeil“; das Suffix der 3. Person Singular bezeichnet die Pfeile Gottes.
- source_word: וַיְפִיצֵם
  choice: und zerstreute sie
  rationale: Das Verb bedeutet „zerstreuen, auseinanderjagen“. Das Objektsuffix bezieht sich im Zusammenhang am ehesten auf die zuvor vorausgesetzten Feinde.
- source_word: וּבְרָקִים
  choice: Blitze
  rationale: Der Plural von בָּרָק bezeichnet Blitze beziehungsweise Blitzstrahlen und führt die Waffenmetaphorik fort.
- source_word: רָב
  choice: zahlreiche … ließ … fahren
  rationale: Die schwierige Form drückt hier eine große Zahl beziehungsweise Fülle von Blitzen aus. Die deutsche Verbfügung ist idiomatisch und bewahrt zugleich die Parallele zum Abschießen der Pfeile.
- source_word: וַיְהֻמֵּם
  choice: und stürzte sie in Verwirrung
  rationale: המם bezeichnet im Kampf das Versetzen in Verwirrung, Bestürzung oder Panik, ohne zwingend eine vollständige Vernichtung auszudrücken.
theological_decisions:
- issue: Bezug der pluralischen Objektsuffixe in וַיְפִיצֵם und וַיְהֻמֵּם
  choice: Die Suffixe beziehen sich auf die im weiteren Zusammenhang vorausgesetzten Feinde Davids.
  alternative: Die Suffixe könnten auf Pfeile beziehungsweise Blitze als verstreute Geschosse bezogen werden.
  rationale: Im Bild vom göttlichen Krieger sind Pfeile und Blitze die Mittel, durch die die Feinde zerstreut und in Verwirrung gestürzt werden; besonders die Bedeutung von המם stützt diesen Bezug.
- issue: Deutung von רָב
  choice: 'Als Ausdruck der Menge: „zahlreiche Blitze“.'
  alternative: 'Als ausdrücklich verbale Form: „Er vervielfachte die Blitze“.'
  rationale: Die Mengenangabe gibt den wahrscheinlichen Sinn in natürlichem Deutsch wieder, während die Fußnote die formale und lexikalische Alternative offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kräftiger poetischer Kampfmetaphorik. „Er ließ … fahren“ ist gegenwärtig verständlich, ohne umgangssprachlich zu wirken; die syntaktische Parallelität der beiden Vershälften bleibt erkennbar.
