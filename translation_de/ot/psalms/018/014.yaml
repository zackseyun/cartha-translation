    issue: Die Wiedergabe von רָב durch „ließ zahlreiche Blitze fahren“ fügt eine nicht klar im Hebräischen markierte Verbhandlung ein.
    rationale: Die Form רָב ist syntaktisch schwierig und kann verbal verstanden werden, wird aber plausibel als Mengenangabe zu „Blitzen“ gelesen. „Mit Blitzen in Fülle“ gibt diese Lesart direkt und idiomatisch wieder; die verbale Alternative gehört in die Fußnote.
  - severity: low
    issue: „stürzte sie in Verwirrung“ ist stilistisch schwächer als „versetzte sie in Verwirrung“.
    rationale: Für המם im militärischen Zusammenhang ist „in Verwirrung versetzen“ modernes, natürliches Deutsch und wahrt den Sinn von Verwirrung bzw. Panik.
