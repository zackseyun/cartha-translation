revisions:
- from: Er schoss seine Pfeile ab und zerstreute sie; er ließ zahlreiche Blitze fahren[a] und stürzte sie in Verwirrung.
  to: Er sandte seine Pfeile aus und zerstreute sie; mit Blitzen in Fülle[a] versetzte er sie in Verwirrung.
  rationale: Die Revision gibt die Mengenlesart von וּבְרָקִים רָב ohne zusätzliches deutsches Vollverb wieder und vermerkt die mögliche verbale Deutung. Sie verbessert zugleich die idiomatische Wiedergabe von וַיְהֻמֵּם. Die beiden nicht näher bestimmten pluralischen Objekte bleiben wie im Hebräischen als „sie“ stehen; damit wird keine umstrittene Referenz ausdrücklich festgelegt.
