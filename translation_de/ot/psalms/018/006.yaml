  text: בַּ/צַּר לִ֤/י אֶֽקְרָ֣א יְהוָה֮ וְ/אֶל אֱלֹהַ֪/י אֲשַׁ֫וֵּ֥עַ יִשְׁמַ֣ע מֵ/הֵיכָל֣/וֹ קוֹלִ֑/י וְ֝/שַׁוְעָתִ֗/י לְ/פָנָ֤י/ו תָּב֬וֹא בְ/אָזְנָֽי/ו־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/006.yaml
  text: In my distress I call on Yahweh[a], and to my God I cry for help. He hears my voice from his temple[b], and my cry before him comes into his ears.
translation:
  language: de
  text: In meiner Not rufe ich Jahwe an und schreie zu meinem Gott um Hilfe. Er hört[a] aus seinem Tempel[b] meine Stimme, und mein Hilferuf vor ihm dringt an seine Ohren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wird aus seinem Tempel meine Stimme hören, und mein Hilferuf vor ihm wird an seine Ohren dringen.“ Die hebräischen Verbformen können auch zukünftig verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort kann auch „Palast“ oder „Heiligtum“ bedeuten und die Wohnstätte eines Königs oder Gottes bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: In meiner Not
  rationale: צַר bezeichnet Bedrängnis oder Not; לִי bezieht sie ausdrücklich auf den Sprecher. „In meiner Not“ gibt die hebräische Wendung natürlich und knapp wieder.
- source_word: אֶקְרָא יְהוָה
  choice: rufe ich Jahwe an
  rationale: קרא mit dem Gottesnamen bezeichnet hier das anrufende Rufen zu Gott. „Jahwe“ ist die im Deutschen übliche Wiedergabe des Tetragramms.
- source_word: וְאֶל אֱלֹהַי אֲשַׁוֵּעַ
  choice: und schreie zu meinem Gott um Hilfe
  rationale: שׁוע bezeichnet einen Hilferuf; die Präposition אֶל gibt dessen Richtung auf Gott hin an.
- source_word: יִשְׁמַע
  choice: Er hört
  rationale: Das hebräische Imperfekt kann in der Poesie gegenwärtige, wiederholte oder zukünftige Bedeutung haben. Der lebendige Präsensgebrauch passt hier zum gegenwärtigen Rufen, ohne die Zukunftslesart auszuschließen.
- source_word: מֵהֵיכָלוֹ
  choice: aus seinem Tempel
  rationale: הֵיכָל kann Tempel, Heiligtum oder Palast bezeichnen. Bei Gottes Wohnstätte ist „Tempel“ die klare Hauptwiedergabe; die Bedeutungsbreite wird in einer Fußnote bewahrt.
- source_word: שַׁוְעָתִי לְפָנָיו
  choice: mein Hilferuf vor ihm
  rationale: שַׁוְעָה ist ein Ruf um Hilfe; לְפָנָיו bedeutet wörtlich „vor ihm“ beziehungsweise „in seiner Gegenwart“.
- source_word: תָּבוֹא בְאָזְנָיו
  choice: dringt an seine Ohren
  rationale: Die wörtliche Bewegung des Hilferufs zu Gottes Ohren wird in idiomatischem Deutsch bewahrt, ebenso das anthropomorphe Hörbild.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitwert von יִשְׁמַע und תָּבוֹא
  choice: 'Gegenwartsform: „hört“ und „dringt“'
  alternative: 'Zukunftsform: „wird hören“ und „wird dringen“'
  rationale: Die Imperfektformen sind in der hebräischen Poesie zeitlich mehrdeutig. Das Präsens gibt die lebendige Aussage wieder; die mögliche Zukunftsbedeutung wird ausdrücklich in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Ausdrücke „rufe … an“ und „schreie … um Hilfe“ bilden die beiden hebräischen Rufverben erkennbar ab. Das konkrete Bild vom Hilferuf, der an Gottes Ohren dringt, bleibt erhalten.
