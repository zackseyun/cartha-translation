base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/015.yaml
  text: Then the channels of the waters were seen[a], and the foundations of the world were laid bare, at your rebuke, O Yahweh[c][b], at the blast of the breath of your nostrils.
translation:
  language: de
  text: Da wurden die Wasserläufe sichtbar[a], und die Grundfesten der Welt wurden bloßgelegt[b] vor deinem Schelten, Jahwe, vor dem Atemstoß deiner Nase[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Wasserrinnen“, „die Flussbetten“ oder „die Wasserkanäle“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Grundfesten der Erde“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „vor/durch den Atem des Windes/Geistes deiner Nase“. Das Hebräische verbindet mehrere Wörter für Atem und Wind zu einem eindringlichen Bild von der Kraft, die von Jahwe ausgeht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: wurden sichtbar
  rationale: Das Nifal von ראה bezeichnet hier das Sichtbarwerden; die Formulierung bewahrt den passiven Sinn und klingt im Deutschen natürlich.
- source_word: אֲפִיקֵי מַיִם
  choice: die Wasserbetten
  rationale: אֲפִיקִים bezeichnet Rinnen, Betten oder Wasserläufe. „Wasserbetten“ gibt das kosmische Freilegen der sonst bedeckten Vertiefungen knapp und anschaulich wieder, ohne den Text auf Flüsse oder das Meer festzulegen.
- source_word: וַיִּגָּלוּ
  choice: wurden bloßgelegt
  rationale: Das Nifal von גלה drückt hier ein gewaltsames Aufdecken aus; „bloßgelegt“ bewahrt die kraftvolle Bildsprache.
- source_word: מוֹסְדוֹת תֵּבֵל
  choice: die Grundfesten der Welt
  rationale: מוֹסְדוֹת sind Fundamente oder Grundfesten; תֵּבֵל bezeichnet die geordnete beziehungsweise bewohnte Welt. „Grundfesten der Welt“ ist poetisch und quellennah.
- source_word: מִגַּעֲרָתְךָ
  choice: durch dein Schelten
  rationale: מִן bezeichnet hier Ursache beziehungsweise auslösende Kraft. „Schelten“ gibt גְּעָרָה als machtvollen göttlichen Verweis wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִנִּשְׁמַת רוּחַ אַפֶּךָ
  choice: durch den Hauch des Atems deiner Nase
  rationale: Die Wiedergabe erhält die auffällige Verbindung von נְשָׁמָה, רוּחַ und אַף sowie das anthropomorphe Bild. „Hauch“ kann hier trotz seiner im Deutschen oft sanften Nebenbedeutung eine ausgehende Atemkraft bezeichnen; die Fußnote nennt die wörtliche Spannweite.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt den Charakter als persönlicher Gottesname, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Anthropomorphe Rede von Gottes Nase und Atem
  choice: Das konkrete Bild bleibt im Haupttext erhalten.
  alternative: durch deinen zornigen Atem
  rationale: Die hebräische Dichtung beschreibt Gottes machtvolles Eingreifen körperlich-bildhaft. Eine Auflösung zu „Zorn“ würde eine mögliche Bedeutung von אַף auswählen und die Verbindung von Atem, Wind und Nase glätten.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der Parallelismus der beiden Enthüllungssätze und der beiden mit „durch“ eingeleiteten Ursachenangaben bleibt erhalten. Die ungewöhnliche Körpermetaphorik wird nicht erklärend aufgelöst.
