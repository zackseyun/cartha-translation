base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/048.yaml
  text: the one who rescues me from my enemies[a]; indeed, you lift me up above those who rise against me[c][b]; you deliver me from the violent man.
translation:
  language: de
  text: Mein Retter vor meinen Feinden[a], ja, du hebst mich über die empor, die sich gegen mich erheben[b]; vor einem gewalttätigen Mann[c] rettest du mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der mich vor meinen Feinden rettet“. Im Hebräischen steht zu Beginn ein Partizip mit Possessivsuffix, das Gott als den Retter des Beters bezeichnet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „du erhöhst mich über die, die sich gegen mich erheben“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „vor einem Mann der Gewalt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְפַלְּטִי
  choice: der mich … rettet
  rationale: Das substantivisch gebrauchte Partizip bezeichnet Gott als den, der den Beter fortwährend rettet. Die Relativform klingt im Deutschen natürlich und bewahrt den partizipialen Charakter.
- source_word: מֵאֹיְבַי
  choice: vor meinen Feinden
  rationale: Bei רטן ist im Deutschen für die Befreiung aus einer Gefahr die Verbindung „vor … retten“ idiomatisch; אֹיְבַי bedeutet „meine Feinde“.
- source_word: אַף
  choice: Ja
  rationale: אַף verstärkt hier die anschließende Aussage und führt die Steigerung knapp und poetisch weiter.
- source_word: מִן קָמַי
  choice: über die …, die sich gegen mich erheben
  rationale: 'Das substantivierte Partizip von קום bezeichnet Widersacher, die sich gegen den Sprecher erheben. Mit רום erhält מִן vergleichenden Sinn: Gott hebt ihn über sie empor.'
- source_word: תְּרוֹמְמֵנִי
  choice: du hebst mich … empor
  rationale: Die Kausativbedeutung von רום und das räumliche Bild des Erhöhens bleiben erhalten; „emporheben“ ist zugleich würdig und verständlich.
- source_word: מֵאִישׁ חָמָס
  choice: vor einem gewalttätigen Mann
  rationale: אִישׁ ist maskulin Singular, und חָמָס bezeichnet Gewalt beziehungsweise gewaltsames Unrecht. Die Formulierung bewahrt Numerus und Geschlecht des Ausgangstextes.
- source_word: תַּצִּילֵנִי
  choice: rettest du mich
  rationale: נצל bezeichnet die Befreiung aus Gefahr. Die deutsche Wiederholung von „retten“ ist natürlich und verbindet Anfang und Ende des Verses, auch wenn dadurch die hebräische lexikalische Variation teilweise zurücktritt.
theological_decisions:
- issue: Funktion und Bezug des eröffnenden Partizips
  choice: 'Direkte Anrede Gottes mit einer charakterisierenden Relativform: „der mich … rettet“'
  alternative: Anschluss als Relativsatz an den vorhergehenden Vers oder Wiedergabe als Titel „mein Retter“
  rationale: Der hebräische Text kann von einer substantivischen Partizipialbezeichnung unmittelbar zu Verben in der zweiten Person wechseln. Die direkte Anrede bewahrt diesen poetischen Übergang, ohne den Satz syntaktisch an den vorherigen Vers zu binden.
- issue: Wiedergabe von אִישׁ
  choice: Mann
  alternative: Mensch oder Person
  rationale: Der Ausgangstext verwendet einen maskulinen Singular für den gewalttätigen Gegner. „Mann“ gibt diese Form genau wieder, ohne eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener vertikaler Bildsprache. Die Satzstellung spiegelt den Wechsel vom charakterisierenden Partizip zur direkten Anrede. Alle Fußnotenmarker stehen an der jeweils erläuterten Stelle.
