id: PSA.18.30
reference: Psalms 18:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָ/אֵל֮ תָּמִ֪ים דַּ֫רְכּ֥/וֹ אִמְרַֽת יְהוָ֥ה צְרוּפָ֑ה מָגֵ֥ן ה֝֗וּא לְ/כֹ֤ל הַ/חֹסִ֬ים בּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/030.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is refined[b]; he is a shield to all who take refuge in him.
translation:
  language: de
  text: Gott – vollkommen ist sein Weg. Das Wort Jahwes ist geläutert[a]. Er ist ein Schild für alle, die bei ihm Zuflucht suchen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf Reinheit geprüft“ oder „gereinigt“. Das hebräische Wort erinnert an Metall, das im Feuer geläutert wird, und betont so die bewährte Reinheit von Jahwes Wort.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die ihm vertrauen“. Wörtlicher ist „die bei ihm Zuflucht suchen“; so bleibt das Bild Gottes als schützender Zufluchtsort erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Gott –
  rationale: Der bestimmte Artikel und die Anfangsstellung heben Gott als Thema hervor. Die deutsche Linksversetzung mit Gedankenstrich gibt diesen Nachdruck natürlich wieder.
- source_word: תָּמִים
  choice: vollkommen
  rationale: Das Wort bezeichnet Ganzheit und Fehlerlosigkeit. Bezogen auf Gottes Weg drückt „vollkommen“ aus, dass an seinem Handeln kein Mangel ist.
- source_word: דַּרְכּוֹ
  choice: sein Weg
  rationale: Die konkrete Wegmetapher bleibt erhalten und bezeichnet zugleich Gottes Art zu handeln.
- source_word: אִמְרַת יְהוָה
  choice: das Wort Jahwes
  rationale: אִמְרָה bezeichnet einen Ausspruch oder ein Wort; die Wiedergabe bleibt weit genug, um Aussage, Zusage oder Verheißung nicht unnötig festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des hebräischen Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: צְרוּפָה
  choice: geläutert
  rationale: Das Wort stammt aus dem Bereich der Metallverarbeitung und bezeichnet durch Feuer gereinigtes beziehungsweise auf Reinheit geprüftes Metall. „Geläutert“ bewahrt dieses Bild.
- source_word: מָגֵן
  choice: ein Schild
  rationale: Die wörtliche Schutzmetapher wird beibehalten und nicht zum abstrakten „Beschützer“ verflacht.
- source_word: הַחֹסִים בּוֹ
  choice: die bei ihm Zuflucht suchen
  rationale: חסה bezeichnet konkret das Suchen von Schutz oder Zuflucht. Die Formulierung bewahrt das räumliche Schutzbild und schließt das darin liegende Vertrauen ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der persönliche Gottesname. „Jahwe“ gibt ihn als Namen wieder, während „der HERR“ ihn durch einen traditionellen Ersatztitel ersetzt.
- issue: Bedeutung von תָּמִים für Gottes Weg
  choice: vollkommen
  alternative: untadelig
  rationale: „Vollkommen“ bewahrt die Grundvorstellung von Ganzheit und Mangellosigkeit, ohne sie ausschließlich auf moralische Schuldlosigkeit zu verengen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzstellung. Der Gedankenstrich bildet die hebräische Thematisierung am Versanfang ab; die Bilder von Läuterung, Weg, Schild und Zuflucht bleiben erhalten.
