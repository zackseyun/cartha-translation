  text: וַ/תִּתֶּן לִ/י֮ מָגֵ֪ן יִ֫שְׁעֶ֥/ךָ וִֽ/ימִינְ/ךָ֥ תִסְעָדֵ֑/נִי וְֽ/עַנְוַתְ/ךָ֥ תַרְבֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/035.yaml
  text: You gave me the shield of your salvation[a], and your right hand supported me, and your humility made me great.
translation:
  language: de
  text: Du gabst mir den Schild deines Heils, und deine rechte Hand stützte mich; deine Demut[a] machte mich groß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Sanftmut“. Das hebräische Wort kann Demut, Sanftmut oder Milde bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Du gabst
  rationale: Das Qal-Wayyiqtol von נתן trägt hier im poetischen Danklied natürlichen Vergangenheitsbezug.
- source_word: מָגֵן יִשְׁעֶךָ
  choice: den Schild deines Heils
  rationale: Die bildhafte Constructus-Verbindung bleibt eng am Hebräischen; „Heil“ wahrt zudem den weiteren Bedeutungsraum über eine einzelne Rettung hinaus.
- source_word: וִימִינְךָ
  choice: deine rechte Hand
  rationale: Das biblische Bild für Kraft und tätige Hilfe wird wörtlich bewahrt.
- source_word: תִסְעָדֵנִי
  choice: stützte mich
  rationale: סעד bezeichnet stützen oder aufrechterhalten; „stützte mich“ ist klar und entspricht dem poetischen Parallelismus.
- source_word: וְעַנְוַתְךָ
  choice: deine Demut
  rationale: Das Wort kann Demut, Sanftmut oder Milde bezeichnen. „Demut“ bewahrt die überraschende Aussage über Gottes Sich-Herabneigen, ohne sie interpretierend abzuschwächen.
- source_word: תַרְבֵּנִי
  choice: machte mich groß
  rationale: Das Hifil von רבה bedeutet „groß machen“ beziehungsweise „mehren“; die knappe Formulierung gibt den Satz unmittelbar wieder.
theological_decisions:
- issue: Die Gott zugeschriebene עַנְוָה
  choice: deine Demut
  alternative: deine Sanftmut
  rationale: Die hebräische Formulierung lässt Demut, Sanftmut oder Milde zu. Die Hauptfassung bewahrt die theologische Spannung, dass Gott sich in Demut dem Menschen zuwendet; die geläufigere Deutung „Sanftmut“ wird als echte Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter biblischer Bildsprache. Das Semikolon gliedert die drei parallelen Aussagen, ohne ihren engen Zusammenhang aufzulösen.
