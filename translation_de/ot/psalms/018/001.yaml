base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/001.yaml
  text: And he said[a], “I love you, O Yahweh, my strength.”
translation:
  language: de
  text: 'Und er sagte: »Ich liebe dich[a], Jahwe, meine Stärke.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb ist mit zärtlichem Erbarmen und inniger Zuneigung verbunden. In dieser Anrede an Gott wird es sinngemäß als Liebe wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Und er sagte
  rationale: Das Waw mit der Erzählform von אמר führt die Rede ein. Die ausdrückliche Wiedergabe folgt dem vorgegebenen WLC-Text und gleicht ihn nicht an abweichende Verszählungen an.
- source_word: אֶרְחָמְךָ
  choice: Ich liebe dich
  rationale: Das Verb רחם bezeichnet zärtliches Erbarmen beziehungsweise innige Zuneigung. In der direkten Anrede an Gott gibt „Ich liebe dich“ die gemeinte hingebungsvolle Zuneigung natürlich wieder, ohne den missverständlichen Eindruck von Mitleid mit Gott zu erwecken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und damit als Eigenname bewahrt, statt durch einen Titel ersetzt zu werden.
- source_word: חִזְקִי
  choice: meine Stärke
  rationale: Die Form bezeichnet mit dem Suffix der ersten Person das, was dem Sprecher Stärke gibt beziehungsweise seine Stärke ist. „Meine Stärke“ ist knapp, idiomatisch und erhält die metaphorische Aussage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Bedeutung von רחם in der Anrede an Gott
  choice: Ich liebe dich
  alternative: Ich erbarme mich deiner
  rationale: Die Grundbedeutung schließt Erbarmen und zärtliche Zuneigung ein; hier verlangt der Kontext eine Äußerung inniger Liebe. Die Fußnote bewahrt die ungewöhnliche lexikalische Färbung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede bleibt knapp und persönlich; „Jahwe“ bewahrt den Gottesnamen. Der Fußnotenmarker steht unmittelbar bei der lexikalisch erläuterten Wendung.
