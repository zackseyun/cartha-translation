  text: בְּנֵי נֵכָ֥ר יִבֹּ֑לוּ וְ֝/יַחְרְג֗וּ מִֽ/מִּסְגְּרֽוֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/045.yaml
  text: The sons of foreigners fade away and come trembling out of their strongholds[a][b][c].
translation:
  language: de
  text: Die Söhne von Fremden[a] welken dahin und kommen zitternd hervor[b] aus ihren Festungen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Söhne der Fremdheit/des Fremden«; gemeint sein können auch »Söhne von Fremden« oder einfach »Fremde«.'
    reason: lexical_alternative
  - marker: b
    text: Das mit »kommen zitternd hervor« wiedergegebene Verb ist selten und in seiner Bedeutung unsicher; möglich sind auch »kommen geduckt hervor« oder »hinken heraus«.
    reason: lexical_alternative
  - marker: c
    text: »Festungen« kann auch mit »befestigte Orte« oder allgemeiner mit »Einfriedungen« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: die Söhne der Fremde
  rationale: Die hebräische Genitivverbindung bezeichnet wörtlich »Söhne der Fremde/Fremdheit«. Die poetische Sohnesformel bleibt erhalten; eine Fußnote nennt das im Deutschen unmittelbarere »Fremde«.
- source_word: יִבֹּלוּ
  choice: welken dahin
  rationale: Das Qal von נבל bedeutet gewöhnlich »welken, verdorren, hinschwinden«. »Welken dahin« bewahrt das poetische Bild vom Kraftverlust, ohne bereits die Furcht des folgenden seltenen Verbs einzutragen.
- source_word: וְיַחְרְגוּ
  choice: kommen zitternd hervor
  rationale: חרג ist selten und in seiner genauen Bedeutung unsicher. Im Zusammenhang besiegter Feinde gibt »zitternd hervorkommen« den wahrscheinlichen Gedanken eines furchtsamen Herauskommens wieder; weitere Möglichkeiten stehen in der Fußnote.
- source_word: מִמִּסְגְּרוֹתֵיהֶם
  choice: aus ihren Festungen
  rationale: מִסְגֶּרֶת bezeichnet etwas Umschließendes beziehungsweise einen umschlossenen Ort. Im militärischen Kontext sind befestigte Rückzugsorte wahrscheinlich; »Festungen« ist idiomatisch, während »Einfriedungen« die breitere Bedeutung sichtbar macht.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Bildsprache. Die ungewöhnliche hebräische Sohnesformel wird im Haupttext bewahrt und in der Fußnote erläutert; die Unsicherheit des seltenen Verbs und die Bedeutungsbreite von מִסְגֶּרֶת bleiben ausdrücklich offen.
