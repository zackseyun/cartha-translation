source:
  edition: WLC
  text: יָ֤שֶׁת חֹ֨שֶׁךְ סִתְר֗/וֹ סְבִֽיבוֹתָ֥י/ו סֻכָּת֑/וֹ חֶשְׁכַת מַ֝֗יִם עָבֵ֥י שְׁחָקִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/011.yaml
  text: He made darkness his hiding place[a], around him his shelter—dark waters[c][b], thick clouds of the skies.
translation:
  language: de
  text: 'Er machte die Finsternis zu seinem Versteck[a], rings um ihn her zu seinem Schutzdach[b]: dunkle Wasser[c], dichtes Gewölk des Himmels.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu seinem verborgenen Ort“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu seiner Hütte“ oder „zu seinem Unterschlupf“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Finsternis der Wasser“; oder: „Wasserfinsternis“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֶׁת
  choice: Er machte … zu
  rationale: Das Qal-Imperfekt wird im poetischen Erzählzusammenhang vergangen wiedergegeben; die Konstruktion „machte … zu“ bewahrt den Sinn des Setzens bzw. Bestimmens.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: Ein geläufiges, würdiges Wort, das die konkrete Dunkelheit der Sturmtheophanie wiedergibt.
- source_word: סִתְרוֹ
  choice: sein Versteck
  rationale: Bezeichnet einen Ort der Verborgenheit; „Versteck“ ist im modernen Deutsch unmittelbar verständlich und räumlich konkret.
- source_word: סְבִיבוֹתָיו
  choice: rings um sich
  rationale: Bewahrt die räumliche Anordnung um Gott herum und fügt sich natürlich in den deutschen Satzbau.
- source_word: סֻכָּתוֹ
  choice: seine Hütte
  rationale: Gibt das konkrete Bild einer סֻכָּה genauer wieder als das abstraktere „Schutz“; die Fußnote nennt im Kontext mögliche funktionale Wiedergaben.
- source_word: חֶשְׁכַת מַיִם
  choice: Wasserfinsternis
  rationale: Die knappe poetische Zusammensetzung bildet die hebräische Constructusverbindung ab, ohne sie eindeutig als bloß „dunkles Wasser“ aufzulösen.
- source_word: עָבֵי שְׁחָקִים
  choice: dichtes Gewölk des Himmels
  rationale: „Gewölk“ gibt die massiven Wolken poetisch wieder; der Singular „Himmel“ ist im natürlichen deutschen Ausdruck angemessen.
theological_decisions:
- issue: Die Finsternis verhüllt Gott innerhalb einer Sturmtheophanie, ohne ausdrücklich moralische oder metaphysische Finsternis zu bezeichnen.
  choice: Die Bilder werden als räumliche und atmosphärische Verhüllung wiedergegeben.
  alternative: Die Finsternis als Gerichtssymbol oder die Hütte als kultisches Heiligtum ausdeuten.
  rationale: Der hebräische Text selbst entfaltet Sturm- und Verbergungsbilder; eine weitergehende dogmatische Deutung wird nicht in die Übersetzung eingetragen.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die ungewöhnliche Wendung „Wasserfinsternis“ erhält die verdichtete hebräische Bildsprache und ihre Mehrdeutigkeit; Fußnoten bieten natürlichere Alternativen.
