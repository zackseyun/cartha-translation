id: PSA.18.27
reference: Psalms 18:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי אַ֭תָּה עַם עָנִ֣י תוֹשִׁ֑יעַ וְ/עֵינַ֖יִם רָמ֣וֹת תַּשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/027.yaml
  text: For you save an afflicted people[b][a], but haughty eyes you bring low.
translation:
  language: de
  text: Denn du rettest ein bedrängtes Volk[a], aber hochmütige Augen[b] erniedrigst du.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein armes Volk“ oder „ein demütiges Volk“. Das hebräische Wort kann Armut, Bedrängnis oder Niedrigkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „hohe Augen“; eine hebräische Wendung für Stolz oder Überheblichkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung zum vorausgehenden Gedanken ein und bewahrt den kausalen Zusammenhang.
- source_word: אַתָּה
  choice: du
  rationale: Das selbstständige Personalpronomen bezeichnet Gott; die Hervorhebung wird durch die deutsche Wortstellung ausreichend vermittelt.
- source_word: עַם
  choice: Volk
  rationale: Gibt das kollektive Singularwort natürlich wieder, ohne die stärker politisch-staatliche Bedeutung von „Nation“ aufzurufen.
- source_word: עָנִי
  choice: bedrängtes
  rationale: Das Wort kann Armut, Bedrängnis oder Niedrigkeit bezeichnen. „Bedrängt“ passt zum Rettungskontext, ohne die Bedeutung auf wirtschaftliche Armut oder eine innere Haltung zu verengen.
- source_word: תוֹשִׁיעַ
  choice: rettest
  rationale: Der Hifil von ישׁע bezeichnet Retten oder Befreien; „retten“ ist im Deutschen prägnant und bewahrt die breite Bedeutung göttlicher Hilfe.
- source_word: וְ
  choice: aber
  rationale: Obwohl die Konjunktion formal „und“ bedeutet, zeigt der antithetische Parallelismus einen Gegensatz zwischen der Rettung der Bedrängten und der Erniedrigung der Hochmütigen an.
- source_word: עֵינַיִם רָמוֹת
  choice: hochmütige Augen
  rationale: Bewahrt das hebräische Bild der „hohen Augen“ und gibt zugleich dessen idiomatische Bedeutung von Stolz oder Überheblichkeit verständlich wieder.
- source_word: תַּשְׁפִּיל
  choice: erniedrigst du
  rationale: Der Hifil von שׁפל bedeutet, jemanden niedrig zu machen oder zu demütigen. „Erniedrigen“ erhält den räumlichen Gegensatz zu den „hohen“ Augen.
theological_decisions:
- issue: Bedeutung von עָנִי
  choice: bedrängtes Volk
  alternative: armes Volk; demütiges Volk
  rationale: Die gewählte Wiedergabe erhält das Motiv göttlicher Rettung aus Not, ohne den Ausdruck ausschließlich wirtschaftlich zu verstehen oder ihn auf die moralische Tugend der Demut festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzstruktur. Das konkrete Höhenbild bleibt in „hochmütige Augen“ und „erniedrigst“ erkennbar; die echte Bedeutungsbreite von עָנִי wird in der Fußnote offengehalten.
