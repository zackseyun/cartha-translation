lexical_decisions:
- source_word: אֶמְחָצֵם
  choice: Ich zerschmettere sie
  rationale: Das Verb מחץ bezeichnet hier ein gewaltsames Zerschmettern im Kampf. „Zerschmettern“ bewahrt die Härte und Bildkraft des Hebräischen.
- source_word: וְלֹא יֻכְלוּ
  choice: sodass sie nicht mehr … können
  rationale: Die Verbindung beschreibt die Folge des Zerschmetterns. „Nicht mehr“ macht im Deutschen natürlich deutlich, dass die Besiegten anschließend außerstande sind aufzustehen.
- source_word: קוּם
  choice: aufstehen
  rationale: קום bezeichnet hier das Wiederaufstehen nach dem Niederschlagen; „aufstehen“ gibt das konkrete Bild klarer wieder als das ebenfalls mögliche „sich erheben“ oder „stehen“.
- source_word: יִפְּלוּ
  choice: sie fallen
  rationale: Die direkte Wiedergabe bewahrt die knappe poetische Parallelität und das Bild vollständiger Niederlage.
- source_word: תַּחַת רַגְלָי
  choice: unter meine Füße
  rationale: Die räumliche Formulierung entspricht dem Hebräischen und bewahrt das martialische Bild völliger Unterwerfung.
theological_decisions:
- issue: Gewaltsame Kampfbilder in einem königlichen Psalm
  choice: Die martialische Ich-Rede wird ungemildert beibehalten.
  alternative: Eine abschwächende Wiedergabe wie „Ich besiege sie“ oder „Ich überwinde sie“.
  rationale: Der hebräische Text spricht ausdrücklich vom Zerschmettern, Nicht-mehr-Aufstehen-Können und Fallen unter die Füße. Eine Verharmlosung würde die Bildsprache und theologische Spannung des Textes beseitigen.
translation_notes:
  register: Moderne, würdige und bildkräftige Psalmsprache. Die Kampfgewalt des Ausgangstextes bleibt erhalten; die Satzverknüpfung wird für natürliches heutiges Deutsch als Folgesatz formuliert.
