lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: ritt
  rationale: Das Qal-Verb רכב bezeichnet gewöhnlich das Reiten oder Aufsteigen. „Ritt“ gibt die anschauliche Bewegung knapp und natürlich wieder.
- source_word: עַל כְּרוּב
  choice: auf einem Kerub
  rationale: עַל bezeichnet hier die Position auf einem Träger; כְּרוּב steht im Singular und ohne Artikel. „Kerub“ ist die etablierte deutsche Bezeichnung und bewahrt das konkrete poetische Bild.
- source_word: וַיָּעֹף
  choice: flog
  rationale: עוף bedeutet direkt „fliegen“. Die schlichte Wiedergabe erhält den Parallelismus der Bewegungsverben.
- source_word: וַיֵּדֶא
  choice: schoss … dahin
  rationale: Das seltene Verb wird im poetischen Zusammenhang am ehesten als schnelle Bewegung durch die Luft verstanden. „Schoss … dahin“ drückt die Geschwindigkeit aus, ohne die Bewegung als Sturzflug festzulegen.
- source_word: כַּנְפֵי
  choice: auf den Flügeln
  rationale: Der Konstruktplural von כָּנָף bedeutet wörtlich „Flügel“. Die hebräische Metapher bleibt im Deutschen unverändert erhalten.
- source_word: רוּחַ
  choice: Wind
  rationale: רוּחַ kann „Wind“, „Atem“ oder „Geist“ bedeuten. In der umgebenden Sturmszenerie ist „Wind“ die wahrscheinlichste Bedeutung.
theological_decisions:
- issue: Bild des auf einem Kerub reitenden Gottes
  choice: Das konkrete poetische Bild wird beibehalten.
  alternative: „Kerub“ als Umschreibung für Sturmwolken oder eine Engelschar deuten.
  rationale: Der hebräische Text nennt einen Kerub als Reittier beziehungsweise Thronträger, ohne das Bild weiter auszulegen. Eine deutende Auflösung würde dem Text eine bestimmte Kosmologie hinzufügen.
- issue: Bedeutung von רוּחַ
  choice: Im Haupttext steht „Wind“.
  alternative: „Geist“ oder „Atem“.
  rationale: Die Sturmotivik des Zusammenhangs spricht deutlich für „Wind“; eine Fußnote hält die weitere Bedeutungsbreite dennoch sichtbar.
translation_notes:
  register: Moderne, gehobene Standardsprache mit dichterischer Bildkraft. Der Satzbau bleibt knapp und parallel; „Kerub“ bewahrt den traditionellen biblischen Begriff, während die Bewegungsverben unmittelbar verständlich bleiben.
