  yaml_path: translation/ot/psalms/018/010.yaml
  text: And he rode on a cherub and flew[b][a]; he sped on the wings of the wind.
translation:
  language: de
  text: Er ritt auf einem Cherub und flog; er schoss[a] auf den Flügeln des Windes[b] dahin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene hebräische Verb kann auch „eilte dahin“, „stürzte dahin“ oder „schoss herab“ bedeuten.
