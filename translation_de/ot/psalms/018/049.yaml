  text: עַל כֵּ֤ן אוֹדְ/ךָ֖ בַ/גּוֹיִ֥ם יְהוָ֑ה וּ/לְ/שִׁמְ/ךָ֥ אֲזַמֵּֽרָה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/049.yaml
  text: Therefore I will give thanks to you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: de
  text: Darum will ich dir unter den Nationen[a] danken, Yahweh, und deinem Namen Lob singen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „unter den Nationen“; auch möglich: „unter den Völkern“ oder „unter den Heiden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung zieht eine Folgerung aus dem vorausgehenden Zusammenhang; „Darum“ gibt diese Schlussfolgerung knapp und natürlich wieder.
- source_word: אוֹדְךָ
  choice: danke ich dir
  rationale: Das Hifil von ידה bezeichnet im Psalmenkontext häufig dankendes Lob. „Ich danke dir“ bewahrt den persönlichen Bezug und klingt im Deutschen natürlich.
- source_word: בַגּוֹיִם
  choice: unter den Nationen
  rationale: גּוֹיִם bezeichnet Nationen beziehungsweise Völker. „Unter den Nationen“ erhält die internationale Reichweite und lässt die mögliche speziellere Deutung „unter den Heiden“ in einer Fußnote erkennen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּלְשִׁמְךָ
  choice: deinem Namen
  rationale: Das ל markiert hier das Ziel des Lobgesangs; im Deutschen verbindet sich „Lob singen“ idiomatisch mit dem Dativ.
- source_word: אֲזַמֵּרָה
  choice: singe … Lob
  rationale: Das Piel von זמר bezeichnet lobpreisendes Singen beziehungsweise Musizieren. „Lob singen“ macht den kultisch-poetischen Sinn deutlich und wahrt den Parallelismus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: Jahwe; der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Yahweh“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von גּוֹיִם
  choice: Nationen
  alternative: Heiden; Völker
  rationale: „Nationen“ bewahrt die breite ethnisch-politische Bedeutung. „Heiden“ kann den Gegensatz zu Israel hervorheben, würde die Aussage im Haupttext jedoch stärker festlegen.
translation_notes:
  register: Moderne, würdige Psalmsprache mit knapper Satzführung. „Darum“ und „danke ich dir“ sind allgemein verständlich; die poetische Wendung „deinem Namen Lob singen“ bewahrt den Parallelismus des Hebräischen.
