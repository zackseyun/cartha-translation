base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/000.yaml
  text: For the choirmaster[a]. Of David, the servant of Yahweh[b], who spoke to Yahweh the words of this song on the day when Yahweh rescued him from the hand of all his enemies and from the hand of Saul.
translation:
  language: de
  text: Für den musikalischen Leiter. Von David, dem Diener Jahwes[a], der zu Jahwe die Worte dieses Liedes sprach, am Tag, als Jahwe ihn aus der Hand all seiner Feinde und aus der Hand Sauls rettete.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sklave Jahwes“. Das hebräische Wort kann einen Diener oder einen Sklaven bezeichnen; hier ist es eine ehrende Bezeichnung für David.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich jeweils „aus der Hand“. Diese hebräische Wendung bezeichnet Befreiung aus der Macht oder Gewalt einer Person.
    reason: cultural_note
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: Die Wendung bezeichnet in Psalmüberschriften wahrscheinlich den für die musikalische Ausführung Verantwortlichen. Die Übersetzung bleibt funktionsbezogen und legt nicht unnötig fest, dass es sich ausschließlich um einen Chorleiter handelte.
- source_word: לְעֶבֶד יְהוָה
  choice: dem Diener Jahwes
  rationale: עֶבֶד kann Diener oder Sklave bezeichnen; hier dient das Wort als ehrende Bezeichnung Davids in seinem Verhältnis zu Jahwe. Die alternative Bedeutungsnuance wird in einer Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt; „Jahwe“ ist die im modernen Deutschen geläufige wissenschaftliche Form.
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Präposition in Psalmüberschriften kann Autorschaft, Zugehörigkeit oder Zuordnung ausdrücken. „Von David“ ist idiomatisch, ohne die gesamte Bandbreite der Formel ausdrücklich auszuschließen.
- source_word: אֲשֶׁר דִּבֶּר לַיהוָה אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: der die Worte dieses Liedes zu Jahwe sprach
  rationale: Die Formulierung folgt dem persönlichen Relativsatz und bewahrt sowohl das Sprechen zu Jahwe als auch die Bezeichnung als Lied.
- source_word: בְּיוֹם הִצִּיל
  choice: als … befreit hatte
  rationale: בְּיוֹם leitet hier idiomatisch den Zeitpunkt der Rettung ein. Das Plusquamperfekt macht im Deutschen deutlich, dass die Befreiung dem Sprechen des Liedes vorausliegt.
- source_word: מִכַּף כָּל אֹיְבָיו
  choice: aus der Gewalt all seiner Feinde
  rationale: כַּף („Handfläche/Hand“) steht idiomatisch für Macht oder Verfügungsgewalt. Die sinngemäße Wiedergabe ist im Deutschen natürlich; die Bildsprache und ihre Bedeutung werden in der Fußnote erläutert.
- source_word: וּמִיַּד שָׁאוּל
  choice: und aus der Hand Sauls
  rationale: Hier bleibt die hebräische Hand-Metapher erhalten und bildet weiterhin die Parallele zur Befreiung von den Feinden ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen und entspricht der üblichen deutschen Transkription, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Bedeutung von עֶבֶד in Davids Ehrentitel
  choice: Diener
  alternative: Sklave
  rationale: Beide Bedeutungen sind lexikalisch möglich. Im königlichen und ehrenden Kontext der Überschrift steht Davids Zugehörigkeit und Dienst gegenüber Jahwe im Vordergrund; die stärkere Alternative wird dennoch offengelegt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Psalmüberschrift bleibt als vollständiger Satz lesbar. „Musikalischer Leiter“ vermeidet die möglicherweise zu enge Festlegung auf einen Chor; „aus der Gewalt“ vermittelt das erste Hand-Idiom natürlich, während „aus der Hand Sauls“ die traditionelle Bildsprache im parallelen Schlussglied hörbar erhält.
