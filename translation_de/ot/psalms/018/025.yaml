source:
  edition: WLC
  text: עִם חָסִ֥יד תִּתְחַסָּ֑ד עִם גְּבַ֥ר תָּ֝מִ֗ים תִּתַּמָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/025.yaml
  text: With the faithful you show yourself faithful[a]; with the blameless man you show yourself blameless.
translation:
  language: de
  text: Dem Treuen erweist du dich treu[a], dem untadeligen Mann erweist du dich untadelig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dem Loyalen erweist du dich loyal“ bzw. „Dem Frommen erweist du dich gütig“. Im Hebräischen stehen verwandte Wörter derselben Wurzel (חסד), wodurch die gegenseitige Bundestreue hervorgehoben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָסִיד
  choice: der Treue
  rationale: Das Substantiv bezeichnet einen Menschen, der von Bundestreue, Loyalität und Frömmigkeit geprägt ist. „Der Treue“ wahrt den Beziehungscharakter und ermöglicht das hebräische Wortspiel mit תִּתְחַסָּד.
- source_word: תִּתְחַסָּד
  choice: du erweist dich treu
  rationale: Die Hitpael-Form beschreibt, wie Gott sich dem Treuen gegenüber als von חֶסֶד geprägt erweist. Die Formulierung erhält sowohl die reziproke Aussage als auch den Gleichklang mit חָסִיד.
- source_word: גְּבַר
  choice: Mann
  rationale: גְּבַר bezeichnet hier einen einzelnen Mann; der mögliche Beiklang von Stärke steht nicht im Vordergrund.
- source_word: תָּמִים
  choice: untadelig
  rationale: Das Wort bezeichnet Ganzheit, Lauterkeit und ethische Unbescholtenheit. „Untadelig“ passt zum poetischen Parallelismus und lässt sich im Deutschen direkt mit dem folgenden Verb verbinden.
- source_word: תִּתַּמָּם
  choice: du erweist dich untadelig
  rationale: Die reflexive Verbform aus derselben Wurzel wie תָּמִים wird durch die Wiederholung von „untadelig“ sichtbar gemacht. Dadurch bleiben die lexikalische Entsprechung und die theologische Spannung erhalten.
theological_decisions:
- issue: Gottes entsprechendes Verhalten gegenüber menschlicher Treue und Untadeligkeit
  choice: „erweist du dich“ beschreibt, wie Gott dem Menschen begegnet, ohne eine Veränderung seines Wesens zu behaupten.
  alternative: „bist du treu/untadelig“ oder dynamisch „handelst du treu/rechtschaffen“
  rationale: Die reflexiven hebräischen Verbformen und der poetische Parallelismus werden am besten durch „erweist du dich“ wiedergegeben. So bleibt die wechselseitige Zuordnung stehen, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die jeweiligen hebräischen Wortspiele werden durch „treu/treu“ und „untadelig/untadelig“ möglichst deutlich bewahrt.
