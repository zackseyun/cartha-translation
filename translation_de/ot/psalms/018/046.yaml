id: PSA.18.46
reference: Psalms 18:46
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חַי יְ֭הוָה וּ/בָר֣וּךְ צוּרִ֑/י וְ֝/יָר֗וּם אֱלוֹהֵ֥י יִשְׁעִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/046.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be the God of my salvation.
translation:
  language: de
  text: Jahwe lebt! Gepriesen sei mein Fels, und erhaben sei der Gott meines Heils.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und der Gott meines Heils ist erhaben.“'
    reason: Die hebräische Imperfektform וְיָרוּם kann hier akklamatorisch-volitiv oder deklarativ verstanden werden.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Jahwe lebt!
  rationale: חַי steht hier prädikativ und bekennt in einer Lobpreisformel, dass Jahwe der lebendige Gott ist. Die deutsche Formulierung ist knapp, natürlich und vermeidet die hier nicht erforderliche Deutung als Schwurformel („So wahr Jahwe lebt“).
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: וּבָרוּךְ
  choice: Gepriesen sei
  rationale: Das passive Partizip hat im Lobpreiskontext akklamatorisch-benediktiven Sinn. „Gepriesen sei“ klingt im Deutschen würdig und idiomatisch; „gesegnet sei“ wäre hier missverständlicher.
- source_word: צוּרִי
  choice: mein Fels
  rationale: Die konkrete Metapher für Gott als festen, verlässlichen Beschützer bleibt erhalten und wird nicht mit „Zuflucht“ ausgedeutet.
- source_word: וְיָרוּם
  choice: und erhaben sei
  rationale: Das Imperfekt kann im poetischen Lobpreis volitiv beziehungsweise akklamatorisch verstanden werden. „Erhaben sei“ wahrt den Parallelismus zu „Gepriesen sei“, ohne die Form auf eine rein beschreibende Aussage festzulegen.
- source_word: אֱלוֹהֵי יִשְׁעִי
  choice: der Gott meines Heils
  rationale: Die deutsche Genitivfügung bewahrt die Struktur und theologische Dichte des Hebräischen. „Heil“ umfasst die von Gott kommende Rettung und Befreiung, ohne die Aussage zu paraphrasieren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Seine Wiedergabe als „Jahwe“ bewahrt den Charakter als Eigenname.
- issue: Aussageweise von וְיָרוּם im Lobpreiskontext
  choice: 'akklamatorisch-volitiv: „und erhaben sei“'
  alternative: 'deklarativ: „und der Gott meines Heils ist erhaben“; ausdrücklich volitiv: „und der Gott meines Heils möge erhoben werden“'
  rationale: Die Imperfektform lässt im poetischen Kontext sowohl eine lobpreisende Aufforderung beziehungsweise Akklamation als auch eine Aussage zu. Der Haupttext folgt dem Parallelismus mit „Gepriesen sei“; die Fußnote hält die andere Deutung offen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter poetischer Parallelität. Der Ausruf nach dem ersten Satzglied gibt die Kraft der hebräischen Lobpreisformel wieder; „Fels“ und „Heil“ erhalten die zentralen Metaphern und theologischen Begriffe.
