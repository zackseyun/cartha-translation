  text: וַ/תִּגְעַ֬שׁ וַ/תִּרְעַ֨שׁ הָ/אָ֗רֶץ וּ/מוֹסְדֵ֣י הָרִ֣ים יִרְגָּ֑זוּ וַ֝/יִּתְגָּֽעֲשׁ֗וּ כִּי חָ֥רָה לֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/007.yaml
  text: Then the earth reeled and quaked[a], and the foundations of the mountains trembled and reeled, because he was angry.
translation:
  language: de
  text: Da wankte und bebte die Erde, und die Grundfesten der Berge erzitterten und wankten, denn sein Zorn war entbrannt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „denn er war zornig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְעַשׁ
  choice: wankte
  rationale: געשׁ bezeichnet heftige, aufwühlende Bewegung. „Wankte“ gibt das poetische Bild lebendig wieder und unterscheidet sich vom folgenden seismischen Verb.
- source_word: וַתִּרְעַשׁ
  choice: bebte
  rationale: רעשׁ bezeichnet hier das Beben der Erde. „Die Erde bebte“ ist im modernen Deutschen natürlich und wahrt die Unterscheidung zum vorausgehenden Verb.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Der kosmisch-theophanische Zusammenhang spricht eher für „Erde“ als für das örtlich begrenzte „Land“.
- source_word: מוֹסְדֵי הָרִים
  choice: die Grundfesten der Berge
  rationale: „Grundfesten“ bewahrt das poetische Bild tragender Fundamente und entspricht dem gehobenen Register des Psalms.
- source_word: יִרְגָּזוּ
  choice: erzitterten
  rationale: רגז bezeichnet Zittern oder heftige Erregung. „Erzitterten“ passt idiomatisch zu den Grundfesten und erhält die Variation der Bewegungsverben.
- source_word: וַיִּתְגָּעֲשׁוּ
  choice: wankten
  rationale: Die Form greift געשׁ aus dem ersten Satzteil wieder auf und verstärkt die Bewegung. Die Wiederholung von „wankten“ bildet diesen poetischen Rückbezug nach.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt den Grund für die kosmische Erschütterung an. „Denn“ verbindet die Aussage natürlich mit dem vorangehenden poetischen Satz.
- source_word: חָרָה לוֹ
  choice: sein Zorn war entbrannt
  rationale: Die hebräische Wendung beschreibt Zorn als ein Brennen. „Sein Zorn war entbrannt“ bewahrt dieses Bild in natürlichem, würdigem Deutsch; das Pronomen bezieht sich im Kontext auf Gott.
theological_decisions:
- issue: Anthropopathische Darstellung des göttlichen Zorns
  choice: denn sein Zorn war entbrannt
  alternative: denn er war zornig
  rationale: Die Fassung lässt das biblische Bild vom brennenden Zorn Gottes stehen, ohne es abzuschwächen oder über die Aussage des hebräischen Textes hinaus dogmatisch auszudeuten.
translation_notes:
  register: Moderne, würdige Psalmenpoesie. Die abgestuften Bewegungsverben und die Wiederaufnahme von „wankten“ bewahren den Parallelismus und die Bildkraft des Hebräischen.
