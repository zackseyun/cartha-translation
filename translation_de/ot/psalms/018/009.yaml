id: PSA.18.9
reference: Psalms 18:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּ֣ט שָׁ֭מַיִם וַ/יֵּרַ֑ד וַ֝/עֲרָפֶ֗ל תַּ֣חַת רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/009.yaml
  text: He bent the heavens and came down[a]; thick darkness was under his feet.
translation:
  language: de
  text: Er neigte den Himmel und kam herab; dichtes Dunkel[a] war unter seinen Füßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dunkles Gewölk; oder: tiefes Dunkel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: neigte
  rationale: נטה bezeichnet ein Neigen, Ausspannen oder Herabbeugen. Mit „Himmel“ als Objekt bewahrt „neigte“ das konkrete poetische Bild, dass Gott den Himmel zu seiner Herabkunft nach unten bewegt.
- source_word: שָׁמַיִם
  choice: den Himmel
  rationale: Obwohl die hebräische Form grammatisch pluralisch ist, ist „der Himmel“ im modernen Deutschen die natürliche und in diesem Zusammenhang umfassende Bezeichnung; „die Himmel“ klänge unnötig fremd und würde keine zusätzliche Aussage sichern.
- source_word: וַיֵּרַד
  choice: kam herab
  rationale: ירד beschreibt die Bewegung nach unten. „Kam herab“ ist im Deutschen natürlich, würdevoll und erhält in Verbindung mit Gott den theophanischen Charakter.
- source_word: וַעֲרָפֶל
  choice: dichtes Dunkel
  rationale: עֲרָפֶל kann tiefes, dichtes Dunkel oder dunkles Gewölk bezeichnen und begegnet häufig im Zusammenhang göttlicher Erscheinung. „Dichtes Dunkel“ wahrt die Unbestimmtheit, ohne vorschnell eine Wolke festzulegen.
- source_word: תַּחַת
  choice: unter
  rationale: Die räumliche Präposition wird direkt und idiomatisch mit „unter“ wiedergegeben.
- source_word: רַגְלָיו
  choice: seinen Füßen
  rationale: Der Ausdruck bedeutet wörtlich „seine Füße“. Das konkrete anthropomorphe Bild wird unverändert beibehalten.
theological_decisions:
- issue: Anthropomorphe Bildsprache der Gotteserscheinung
  choice: Das konkrete Bild von Gott, der den Himmel neigt, herabkommt und das Dunkel unter seinen Füßen hat, bleibt erhalten.
  alternative: Die Bildsprache als bloßen Hinweis auf Gottes Eingreifen erklärend umschreiben.
  rationale: Der poetische Text stellt Gottes Erscheinen bewusst in körperlich-räumlichen Bildern dar. Eine abstrahierende Wiedergabe würde die Bildkraft mindern und die theologische Spannung vorzeitig auflösen.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die Satzstellung bleibt klar und nah am hebräischen Parallelismus; das konkrete Bild der Theophanie wird nicht erklärend abgeschwächt.
