source:
  edition: WLC
  text: כִּ֤י מִ֣י אֱ֭לוֹהַּ מִ/בַּלְעֲדֵ֣י יְהוָ֑ה וּ/מִ֥י צ֝֗וּר זוּלָתִ֥/י אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/031.yaml
  text: For who is God besides Yahweh? And who is a rock except our God?[a]
translation:
  language: de
  text: Denn wer ist Gott außer Jahwe? Und wer ist ein Fels außer unserem Gott?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer ist Gott abgesehen von Jahwe? Und wer ist ein Fels neben unserem Gott?“ Beide hebräischen Wendungen drücken Ausschließlichkeit aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die begründende beziehungsweise erklärende rhetorische Aussage ein und verbindet sie natürlich mit dem vorausgehenden Lob.
- source_word: מִי
  choice: wer
  rationale: Gibt das Interrogativpronomen in beiden rhetorischen Fragen unmittelbar wieder.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Die Singularform bezeichnet hier in ausschließender Gegenüberstellung den wahren Gott.
- source_word: מִבַּלְעֲדֵי
  choice: außer
  rationale: 'Drückt den Ausschluss knapp und idiomatisch aus: Es gibt keinen Gott außer Jahwe.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וּמִי
  choice: Und wer
  rationale: Bewahrt die enge Verknüpfung und den Parallelismus der beiden rhetorischen Fragen.
- source_word: צוּר
  choice: ein Fels
  rationale: Erhält das konkrete biblische Bild für Beständigkeit, Stärke und Schutz; der unbestimmte Artikel entspricht natürlichem Deutsch in der Prädikatsstellung.
- source_word: זוּלָתִי
  choice: außer
  rationale: Gibt den parallelen Ausschlussbegriff klar wieder; die Wiederholung stärkt im Deutschen den Parallelismus.
- source_word: אֱלֹהֵינוּ
  choice: unserem Gott
  rationale: Bewahrt das Suffix der ersten Person Plural und damit den gemeinschaftlichen, beziehungsbezogenen Gehalt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; „Jahwe“ bewahrt ihn, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Wiedergabe von צוּר als Gottesmetapher
  choice: ein Fels
  alternative: der Fels
  rationale: Die Prädikatskonstruktion wird natürlich wiedergegeben, ohne das Bild stillschweigend zu einem festen Titel zu machen. Die Metapher für Stärke, Beständigkeit und Schutz bleibt erhalten.
- issue: Exklusivität der beiden Aussagen
  choice: außer … außer
  alternative: neben … außer
  rationale: Beide hebräischen Ausdrücke bezeichnen Ausschließlichkeit. Die gleiche deutsche Präposition erhält die klare Parallelstruktur, während die Fußnote auf mögliche Varianten hinweist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappen rhetorischen Fragen und der poetische Parallelismus bleiben erhalten; „Fels“ bewahrt die konkrete Metapher des Hebräischen.
