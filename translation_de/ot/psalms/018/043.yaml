source:
  edition: WLC
  text: תְּפַלְּטֵ/נִי֮ מֵ/רִ֪יבֵ֫י עָ֥ם תְּ֭שִׂימֵ/נִי לְ/רֹ֣אשׁ גּוֹיִ֑ם עַ֖ם לֹא יָדַ֣עְתִּי יַֽעַבְדֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/043.yaml
  text: You rescue me from the strivings of the people[a]; you set me as the head of nations[d][c][b]; a people whom I have not known serve me.
translation:
  language: de
  text: Du rettest mich aus den Streitigkeiten des Volkes[a]; du setzt mich an die Spitze von Nationen[b]; ein Volk, das ich nicht kannte, dient mir.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus den Auseinandersetzungen des Volkes“. Das hebräische Wort kann Streit, Auseinandersetzung oder auch einen Rechtsstreit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „zum Haupt von Nationen“; „Haupt“ ist hier ein Bild für die führende Stellung.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wird mir dienen“. Der hebräische Imperfekt kann hier auch zukünftig verstanden werden.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: תְּפַלְּטֵנִי
  choice: Du rettest mich
  rationale: Das Piel von פלט bezeichnet hier Gottes aktives Befreien aus Gefahr. „Retten“ ist im heutigen Deutsch natürlich und bewahrt den persönlichen Charakter der Aussage.
- source_word: מֵרִיבֵי עָם
  choice: aus den Streitigkeiten des Volkes
  rationale: רִיב kann Streit, Auseinandersetzung oder Rechtsstreit bezeichnen. Der Plural und die Konstruktverbindung werden beibehalten, ohne die Art der Konflikte enger festzulegen.
- source_word: תְּשִׂימֵנִי
  choice: du setzt mich
  rationale: שׂים bedeutet grundlegend „setzen, stellen“. Die knappe Formulierung lässt die im Kontext liegende Einsetzung in eine Führungsstellung erkennen.
- source_word: לְרֹאשׁ גּוֹיִם
  choice: an die Spitze von Nationen
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“ und bezeichnet übertragen die führende Stellung. „An die Spitze“ gibt diese Metapher in natürlichem modernem Deutsch wieder; גּוֹיִם wird im politischen Sinn als „Nationen“ übersetzt.
- source_word: עַם לֹא יָדַעְתִּי
  choice: ein Volk, das ich nicht kannte
  rationale: Das kollektive Singularwort עַם ist hier unbestimmt. Das Perfekt יָדַעְתִּי bezeichnet die bisher fehlende Kenntnis oder Bekanntschaft; im Deutschen ist das Präteritum in diesem Relativsatz idiomatisch.
- source_word: יַעַבְדוּנִי
  choice: dient mir
  rationale: עבד bedeutet „dienen“. Der hebräische Imperfekt kann hier eine eintretende, fortdauernde oder zukünftige Handlung ausdrücken; das Präsens passt zum poetischen Zusammenhang, ohne die Zukunftsbedeutung auszuschließen.
theological_decisions:
- issue: Bedeutungsumfang von גּוֹיִם und עַם im Königspsalm
  choice: Politisch-kollektiv als „Nationen“ und „ein Volk“ wiedergeben.
  alternative: גּוֹיִם als „Heiden“ wiedergeben.
  rationale: Der Vers beschreibt die Erhöhung des Psalmisten über fremde politische Gruppen. „Nationen“ entspricht diesem Zusammenhang und trägt keine späteren ethnisch-theologischen Unterscheidungen in den Text ein.
- issue: Zeitbezug von יַעַבְדוּנִי
  choice: Mit dem deutschen Präsens „dient mir“ wiedergeben.
  alternative: 'Zukünftig: „wird mir dienen“.'
  rationale: Der hebräische Imperfekt legt den Zeitbezug nicht eindeutig fest. Das Präsens bewahrt die Aussage als gegenwärtige beziehungsweise charakteristische Unterordnung; die mögliche Zukunftsbedeutung wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Die Formulierung „an die Spitze von Nationen“ vermittelt die hebräische Leitungsmetapher natürlich; die wörtlichere Gestalt steht in der Fußnote. Die lexikalische und zeitliche Mehrdeutigkeit wird nicht stillschweigend aufgelöst.
