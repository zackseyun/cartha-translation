  text: I was blameless before him[c][b][a], and I kept myself from my iniquity.
translation:
  language: de
  text: Ich war ihm[b] gegenüber untadelig[a] und hütete mich vor meinem Unrecht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lauter“, „integer“ oder „ungeteilt“. „Untadelig“ bezeichnet hier persönliche Lauterkeit, nicht notwendig absolute Sündlosigkeit.'
