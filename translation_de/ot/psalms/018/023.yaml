lexical_decisions:
- source_word: וָאֱהִי
  choice: Ich war
  rationale: Das Qal-Wayyiqtol der 1. Person Singular von היה bezeichnet hier im poetischen Rückblick einen Zustand in der Vergangenheit.
- source_word: תָמִים
  choice: untadelig
  rationale: Das Wort bezeichnet in diesem moralischen Zusammenhang Ganzheit und Lauterkeit; „untadelig“ bewahrt die starke Aussage, ohne notwendig absolute Sündlosigkeit auszudrücken.
- source_word: עִמּוֹ
  choice: ihm gegenüber
  rationale: עִם mit Suffix bedeutet wörtlich „mit ihm“. In Verbindung mit תָמִים gibt „ihm gegenüber“ die Beziehung und das Verhalten im Deutschen natürlicher wieder, ohne den im Hebräischen stehenden Pronomenbezug durch den Gottesnamen zu ersetzen.
- source_word: וָאֶשְׁתַּמֵּר
  choice: ich hütete mich
  rationale: Die reflexive Form von שמר drückt Selbstbewahrung oder wachsame Zurückhaltung aus; „sich hüten“ ist dafür eine natürliche deutsche Entsprechung.
- source_word: מֵעֲוֺנִי
  choice: vor meinem eigenen Unrecht
  rationale: עָוֹן kann Unrecht, Schuld oder Sünde bezeichnen. „Eigenes Unrecht“ bewahrt den moralischen Gehalt und macht den Suffix der 1. Person deutlich; מִן wird nach „sich hüten“ idiomatisch mit „vor“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von תָמִים im Blick auf den moralischen Zustand des Menschen
  choice: „Untadelig“ bezeichnet hier Lauterkeit und ungeteilte Treue.
  alternative: Die Aussage als Behauptung völliger Sündlosigkeit verstehen.
  rationale: Der Vers erhebt einen starken Anspruch auf persönliche Integrität, legt aber nicht ausdrücklich metaphysische oder absolute Sündlosigkeit fest. Die Formulierung bewahrt diese Spannung.
- issue: Bezug des Pronomens in עִמּוֹ
  choice: Das Pronomen „ihm“ bleibt im Haupttext erhalten.
  alternative: Den Bezug ausdrücklich als „dem HERRN gegenüber“ wiedergeben.
  rationale: Aus dem Kontext ist der HERR der Bezugspunkt; der hebräische Vers selbst verwendet jedoch ein Pronomen. Die Übersetzung wahrt diese Textgestalt und erläutert den Bezug in einer Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und parallel wie im hebräischen Vers. „Ihm gegenüber“ und „hütete mich vor“ vermeiden unnatürliche Wörtlichkeit, während Pronomen, Reflexivität und die Mehrdeutigkeit von עָוֹן erhalten bleiben.
