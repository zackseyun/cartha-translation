base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/040.yaml
  text: You gave me the backs of my enemies[a]; I destroyed those who hated me.
translation:
  language: de
  text: Du hast meine Feinde vor mir fliehen lassen[a]; die mich hassten, vernichtete ich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Du gabst mir den Nacken meiner Feinde.« Das hebräische Bild besagt, dass die Feinde flohen und dem Sprecher den Nacken zuwandten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹיְבַי
  choice: meine Feinde
  rationale: אֹיֵב mit Suffix der 1. Person Singular bezeichnet gewöhnlich »meine Feinde«; dies ist im modernen Deutschen die natürliche und sachlich genaue Wiedergabe.
- source_word: נָתַתָּה לִּי עֹרֶף
  choice: du hast … vor mir fliehen lassen
  rationale: Wörtlich steht »du gabst mir den Nacken«. Das Körperbild bezeichnet, dass die Feinde den Nacken zukehren, also die Flucht ergreifen. Die idiomatische Wiedergabe macht den im Hebräischen gemeinten Vorgang klar; die Fußnote bewahrt das konkrete Bild.
- source_word: וּמְשַׂנְאַי
  choice: die mich hassten
  rationale: Das substantivierte Partizip von שׂנא mit Suffix bezeichnet die Menschen, die den Sprecher hassen. Die verbale Formulierung klingt im Deutschen natürlicher als »meine Hasser«.
- source_word: אַצְמִיתֵם
  choice: vernichtete ich
  rationale: Der Hifil von צמת bedeutet hier, jemanden zugrunde zu richten beziehungsweise zu vernichten. »Vernichtete« erhält die Stärke des Ausdrucks, ohne zusätzliche Einzelheiten einzutragen.
theological_decisions:
- issue: Gottes Handeln und das anschließende Handeln des Psalmisten
  choice: Der Wechsel von »du« zu »ich« bleibt ausdrücklich erhalten.
  alternative: Beide Aussagen als unmittelbares Handeln Gottes oder beide als Handeln des Psalmisten formulieren.
  rationale: Der hebräische Text schreibt das Ausliefern beziehungsweise In-die-Flucht-Schlagen der Feinde dem angeredeten Gott zu, ihre Vernichtung danach dem Sprecher. Diese Spannung darf nicht eingeebnet werden.
- issue: Bild vom zugewandten Nacken der Feinde
  choice: Die Bedeutung wird im Haupttext idiomatisch als Flucht ausgedrückt, das wörtliche Bild in der Fußnote dokumentiert.
  alternative: »Du gabst mir den Nacken meiner Feinde« oder »Du kehrtest mir den Rücken meiner Feinde zu«.
  rationale: Die wörtliche deutsche Formulierung wäre schwer verständlich; die gewählte Fassung wahrt den Sinn des hebräischen Sieges- und Fluchtbildes, ohne eine konfessionelle Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung erhält den poetischen Parallelismus und den markanten Wechsel vom göttlichen Handeln zum Handeln des Psalmisten. Das schwer verständliche hebräische Körperbild wird im Text idiomatisch und in der Fußnote wörtlich wiedergegeben.
