source:
  edition: WLC
  text: כִּֽי אַ֭תָּה תָּאִ֣יר נֵרִ֑/י יְהוָ֥ה אֱ֝לֹהַ֗/י יַגִּ֥יהַּ חָשְׁכִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/028.yaml
  text: For you light my lamp[b][a]; Yahweh my God lights up my darkness.
translation:
  language: de
  text: Denn du lässt meine Lampe leuchten[a]; Jahwe, mein Gott, erhellt meine Finsternis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du bringst meine Lampe zum Leuchten.“'
    reason: lexical_alternative
  - marker: b
    text: „Finsternis“ kann hier Bedrängnis, Gefahr oder Niedergeschlagenheit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet im poetischen Zusammenhang das zuvor ausgedrückte Vertrauen; „Denn“ ist im Deutschen knapp und natürlich.
- source_word: תָּאִיר
  choice: lässt … leuchten
  rationale: Der Hifil von אור hat eine verursachende Bedeutung. Die Formulierung gibt diese wieder und verbindet sich idiomatisch mit „Lampe“.
- source_word: נֵרִי
  choice: meine Lampe
  rationale: נֵר bezeichnet konkret eine Lampe. Das Bild bleibt erhalten und wird nicht zum abstrakten „Licht“ verflacht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Umschrift des Tetragramms.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Die Possessivkonstruktion wird unmittelbar und persönlich wiedergegeben.
- source_word: יַגִּיהַּ
  choice: erhellt
  rationale: Das Verb bezeichnet das Hellmachen beziehungsweise Aufleuchtenlassen. „Erhellt“ ist prägnant und wahrt den poetischen Parallelismus.
- source_word: חָשְׁכִּי
  choice: meine Finsternis
  rationale: Die wörtliche Bildsprache mit dem Suffix der ersten Person bleibt erhalten, ohne festzulegen, ob Bedrängnis, Gefahr oder innere Niedergeschlagenheit gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von „meine Finsternis“
  choice: Die Metapher bleibt offen
  alternative: meine Not / meine Gefahr / meine Niedergeschlagenheit
  rationale: Der Vers erläutert nicht eindeutig, worauf die Finsternis zielt. Die wörtliche Metapher bewahrt die mögliche äußere wie innere Bedeutung.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer poetischer Parallelität. Die konkrete Lampe und die mehrdeutige Finsternis bleiben als Bilder erhalten.
