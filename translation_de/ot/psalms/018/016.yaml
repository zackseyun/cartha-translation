  text: He sent from on high[a]; he took me; he drew me out of many waters.
translation:
  language: de
  text: Er sandte aus der Höhe[a]; er nahm mich; er zog mich aus vielen Wassern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er streckte sich aus der Höhe herab.“ Wörtlich steht: „Er sandte aus der Höhe“; im Zusammenhang kann dies ein rettendes Ausstrecken bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח מִמָּרוֹם
  choice: Er griff aus der Höhe herab
  rationale: Das Verb bedeutet wörtlich „senden“ und kann auch das Ausstrecken bezeichnen. Da im Hebräischen kein Gegenstand genannt wird und unmittelbar das Ergreifen und Herausziehen folgt, gibt „griff … herab“ die elliptische Rettungshandlung natürlich wieder, ohne „Himmel“ ausdrücklich einzuführen.
- source_word: יִקָּחֵנִי
  choice: und nahm mich
  rationale: Die häufige Bedeutung „nehmen“ bleibt erhalten. Im Zusammenhang bezeichnet sie das rettende Ergreifen, ohne die stärkere Nuance von „packen“ oder „reißen“ einzutragen.
- source_word: יַמְשֵׁנִי
  choice: er zog mich
  rationale: Die Hifil-Form von משה bezeichnet hier das Herausziehen aus Wasser. Mit der folgenden Herkunftsangabe ist „zog mich aus“ im Deutschen klar und idiomatisch.
- source_word: מִמַּיִם רַבִּים
  choice: aus gewaltigen Wassermassen
  rationale: Wörtlich steht „aus vielen Wassern“. „Gewaltige Wassermassen“ bewahrt das Bild überwältigender Wasser und klingt im modernen Deutschen natürlicher als „viele Wasser“.
theological_decisions:
- issue: Ob מִמָּרוֹם ausdrücklich als Himmel bezeichnet werden soll
  choice: aus der Höhe
  alternative: vom Himmel
  rationale: Der hebräische Text nennt die Höhe, nicht ausdrücklich den Himmel. Die Übersetzung wahrt so die transzendente Bildsprache, ohne sie kosmologisch stärker festzulegen.
- issue: Ob die rettende Handlung durch das Ergänzen von „Hand“ konkretisiert werden soll
  choice: griff … herab, ohne „Hand“ zu ergänzen
  alternative: streckte seine Hand aus der Höhe herab
  rationale: Eine ausgestreckte Hand ist im Zusammenhang gut vorstellbar, wird im Hebräischen aber nicht genannt. Die gewählte Form macht die elliptische Handlung verständlich, ohne ein zusätzliches Substantiv in den Haupttext einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus der drei Rettungshandlungen bleibt erhalten; „gewaltige Wassermassen“ vermittelt das poetische Bild überwältigender Gefahr.
