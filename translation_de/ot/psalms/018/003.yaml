  text: מְ֭הֻלָּל אֶקְרָ֣א יְהוָ֑ה וּ/מִן אֹ֝יְבַ֗/י אִוָּשֵֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/003.yaml
  text: I call on Yahweh[a], who is worthy to be praised[b], and I am saved from my enemies.
translation:
  language: de
  text: Ich rufe Jahwe[a] an, der allen Lobes würdig ist, und werde von meinen Feinden gerettet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text hat hier den Gottesnamen JHWH, traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Die hebräische Verbform kann auch als allgemeine beziehungsweise gegenwärtig-resultative Aussage verstanden werden: „und bin von meinen Feinden gerettet.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: der allen Lobes würdig ist
  rationale: Das passive Partizip von הלל beschreibt Jahwe als den, der gepriesen wird beziehungsweise Lob verdient. Die Formulierung gibt den wertenden Sinn natürlich und würdig wieder.
- source_word: אֶקְרָא
  choice: ich rufe … an
  rationale: קרא mit dem Gottesnamen bezeichnet hier den gebetsartigen Anruf. „Anrufen“ ist im Deutschen präzise und im Psalmenstil gut verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: וּמִן
  choice: und … von
  rationale: Die Verbindung der beiden Satzteile wird schlicht mit „und“ wiedergegeben, ohne einen im Hebräischen nicht ausdrücklich markierten Kausalzusammenhang hinzuzufügen.
- source_word: אֹיְבַי
  choice: meinen Feinden
  rationale: Direkte und geläufige Wiedergabe von אֹיֵב mit dem Suffix der ersten Person Singular.
- source_word: אִוָּשֵׁעַ
  choice: werde … gerettet
  rationale: Das Nifal-Imperfekt von ישׁע kann hier eine regelmäßig erfahrene beziehungsweise zuversichtlich erwartete Rettung ausdrücken. Das deutsche Präsens mit „werde gerettet“ bewahrt diese Offenheit besser als eine ausschließlich futurische Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, während die Fußnote die traditionelle Ersatzlesung erläutert.
- issue: Zeit- und Aussagewert von אִוָּשֵׁעַ
  choice: werde von meinen Feinden gerettet
  alternative: werde von meinen Feinden gerettet werden; bin von meinen Feinden gerettet worden
  rationale: Die Imperfektform lässt im poetischen Zusammenhang sowohl eine allgemeine Aussage als auch eine zukünftige Erwartung zu. Die Übersetzung vermeidet eine unnötige Festlegung; die Zukunftsbedeutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit psalmtypischer Dichte. Der Relativsatz macht die Aussage von מְהֻלָּל natürlich verständlich; die Verbform am Versende bleibt hinsichtlich allgemeiner Erfahrung und zukünftiger Erwartung bewusst offen.
