base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/002.yaml
  text: Yahweh is my crag and my fortress and my deliverer[a], my God, my rock, in whom I take refuge, my shield and the horn of my salvation[c][b], my stronghold.
translation:
  language: de
  text: 'Jahwe ist meine Felsklippe und meine Festung und mein Retter,

    mein Gott, mein Fels, bei ihm ich Zuflucht suche,

    mein Schild und das Horn meiner Rettung[a], meine hohe Zuflucht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Horn“ ist ein Bild für Kraft und siegreiche Rettungsmacht.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen übliche wissenschaftliche Transkription.
- source_word: סַלְעִי
  choice: mein Felsgrat
  rationale: סֶלַע bezeichnet einen Felsen oder eine Felsklippe. „Felsgrat“ bewahrt die Unterscheidung zum folgenden צוּרִי, ohne das Schutzbild aufzugeben.
- source_word: מְצוּדָתִי
  choice: meine Festung
  rationale: Das Wort bezeichnet einen befestigten Schutzort; „Festung“ ist prägnant und unterscheidet sich vom abschließenden מִשְׂגַּבִּי.
- source_word: מְפַלְטִי
  choice: mein Retter
  rationale: Die substantivisch gebrauchte Form bezeichnet den, der entkommen lässt beziehungsweise rettet.
- source_word: אֵלִי
  choice: mein Gott
  rationale: אֵל mit Suffix fungiert hier als Gottesbezeichnung und wird unmittelbar wiedergegeben.
- source_word: צוּרִי
  choice: mein Fels
  rationale: צוּר steht bildlich für Beständigkeit und Schutz; die Wiedergabe bleibt von סֶלַע unterschieden.
- source_word: אֶחֱסֶה בּוֹ
  choice: bei dem ich Zuflucht suche
  rationale: חסה bezeichnet das Suchen oder Finden von Zuflucht. Die Formulierung ist natürliches Deutsch und bewahrt das Schutzmotiv.
- source_word: מָגִנִּי
  choice: mein Schild
  rationale: Die direkte Wiedergabe erhält das militärische Schutzbild.
- source_word: קֶרֶן יִשְׁעִי
  choice: das Horn meiner Rettung
  rationale: Die konkrete Hornmetapher für Kraft und siegreiche Rettungsmacht bleibt erhalten; יֵשַׁע wird hier als „Rettung“ wiedergegeben.
- source_word: מִשְׂגַּבִּי
  choice: meine sichere Höhe
  rationale: Das Wort bezeichnet einen hoch gelegenen, unzugänglichen Zufluchtsort. Diese Wiedergabe wahrt die Höhenvorstellung und unterscheidet sich von „Festung“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Erhaltung der unterschiedlichen Schutz- und Felsbilder
  choice: Felsgrat, Festung, Fels und sichere Höhe werden unterschieden
  alternative: Mehrere Begriffe einheitlich mit „Fels“ oder „Burg“ wiedergeben
  rationale: Der hebräische Vers häuft verschiedene, einander ergänzende Schutzbilder. Ihre Unterscheidung bewahrt die poetische und theologische Spannung des Textes.
- issue: Hornmetapher in קֶרֶן יִשְׁעִי
  choice: das Horn meiner Rettung
  alternative: meine starke Rettung; meine rettende Macht
  rationale: Die wörtliche Metapher bezeichnet Kraft und siegreiche Rettungsmacht. Eine Auflösung würde das konkrete biblische Bild beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dichterischer Reihung. Die parallelen Schutzbilder und die beiden unterschiedlichen hebräischen Felsbegriffe bleiben möglichst erkennbar; ungewöhnliche Bildsprache wird nicht vorschnell paraphrasiert.
