source:
  edition: WLC
  text: תַּרְחִ֣יב צַעֲדִ֣/י תַחְתָּ֑/י וְ/לֹ֥א מָ֝עֲד֗וּ קַרְסֻלָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/036.yaml
  text: You broaden my steps beneath me[c][b][a], and my ankles have not given way.
translation:
  language: de
  text: Du gibst meinen Schritten weiten Raum[a], und meine Knöchel haben nicht gewankt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Du machst meinen Schritt weit unter mir.« Das hebräische Bild bezeichnet ungehindertes Ausschreiten und sicheren Bewegungsraum.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und meine Knöchel sind nicht ausgeglitten« beziehungsweise »haben nicht nachgegeben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: du gibst … weiten Raum
  rationale: Der Hifil von רחב bedeutet »weit machen« oder »weiten«. Die deutsche Wendung »weiten Raum geben« bewahrt den kausativen Sinn und gibt das Bild natürlich wieder.
- source_word: צַעֲדִי
  choice: meinen Schritten
  rationale: Das Substantiv bezeichnet den Schritt beziehungsweise das Ausschreiten. Der deutsche Plural ist in der Wendung idiomatischer, während die Fußnote den hebräischen Singular erkennen lässt.
- source_word: תַחְתָּי
  choice: im Gesamtbild von »weiten Raum geben« wiedergegeben
  rationale: Wörtlich bedeutet das Wort »unter mir«. Im Deutschen wird der räumliche Bezug durch den Raum für die Schritte ausgedrückt; die wörtliche Form steht in der Fußnote.
- source_word: וְלֹא מָעֲדוּ
  choice: und … haben nicht gewankt
  rationale: Die Verbindung besteht aus einer einfachen Konjunktion mit Verneinung. מעד kann »gleiten«, »wanken« oder »den Halt verlieren« bedeuten; »haben nicht gewankt« passt zum ausdrücklichen Subjekt »Knöchel«.
- source_word: קַרְסֻלָּי
  choice: meine Knöchel
  rationale: Das Wort bezeichnet konkret die Knöchel beziehungsweise Knöchelgelenke. Die genaue Körperbezeichnung erhält das anschauliche Bild stabilen Gehens.
theological_decisions: []
