  text: יַצִּילֵ֗/נִי מֵ/אֹיְבִ֥/י עָ֑ז וּ֝/מִ/שֹּׂנְאַ֗/י כִּֽי אָמְצ֥וּ מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/017.yaml
  text: He delivered me from my strong enemy[a], and from those who hated me[b], for they were too mighty for me.
translation:
  language: de
  text: Er rettete mich vor meinem starken Feind[a] und vor denen, die mich hassten; denn sie waren stärker als ich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er rettet mich vor meinem starken Feind«, wenn die poetische Verbform gegenwartsnah verstanden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: Er rettete mich
  rationale: Das Hifil von נצל bedeutet »retten, entreißen«. Der Rückblick auf Gottes Eingreifen im Zusammenhang legt im Deutschen die Vergangenheit nahe; die poetische Imperfektform kann jedoch auch gegenwartsnah verstanden werden.
- source_word: מֵאֹיְבִי עָז
  choice: vor meinem starken Feind
  rationale: אֹיְבִי ist morphologisch Singular (»mein Feind«), und עָז bedeutet »stark, mächtig«. Die singularische Form und die direkte Bedeutung des Adjektivs bleiben erhalten.
- source_word: וּמִשֹּׂנְאַי
  choice: und vor denen, die mich hassten
  rationale: Das Partizip von שׂנא steht im Plural mit Suffix der ersten Person Singular. Ein Relativsatz gibt die Form im Deutschen natürlich wieder und wahrt den Wechsel vom singularischen »Feind« zum Plural.
- source_word: כִּי אָמְצוּ מִמֶּנִּי
  choice: denn sie waren stärker als ich
  rationale: כִּי begründet die Rettung. אמץ bezeichnet Stärke; מן markiert hier den Vergleich beziehungsweise die Überlegenheit. »Stärker als ich« bildet diese Konstruktion unmittelbar und idiomatisch ab.
theological_decisions:
- issue: Zeitbezug der eröffnenden hebräischen Verbform in poetischer Sprache
  choice: 'Vergangenheitsbezogen: »Er rettete mich«'
  alternative: 'Gegenwartsnah: »Er rettet mich«'
  rationale: Der Abschnitt erzählt rückblickend von Gottes Eingreifen in der Not. Die Vergangenheitsform folgt diesem Erzählzusammenhang, ohne die mögliche gegenwartsnahe Funktion des poetischen Imperfekts zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Satzführung. Der Wechsel vom singularischen »mein Feind« zum pluralischen »denen, die mich hassten« wird im Haupttext bewahrt; dafür ist keine zusätzliche Fußnote nötig.
