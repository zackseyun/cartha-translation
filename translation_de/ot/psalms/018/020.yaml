  source_fidelity: Die Übersetzung gibt die beiden hebräischen Halbverse einschließlich des Entsprechungs-/Vergeltungssinns von כְ, der Ich-Possessive („meiner Gerechtigkeit“, „meiner Hände“) und des poetischen Parallelismus zuverlässig wieder. „Jahwe“ entspricht dem Tetragramm. „Belohnt“ ist im gegebenen Parallelismus eine vertretbare positive Konkretisierung von גמל; „vergolten“ gibt יָשִׁיב לִי angemessen wieder.
