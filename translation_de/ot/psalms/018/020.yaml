id: PSA.18.20
reference: Psalms 18:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִגְמְלֵ֣/נִי יְהוָ֣ה כְּ/צִדְקִ֑/י כְּ/בֹ֥ר יָ֝דַ֗/י יָשִׁ֥יב לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/020.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: de
  text: Jahwe hat mich meiner Gerechtigkeit entsprechend belohnt[a]; der Reinheit meiner Hände entsprechend hat er mir vergolten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe hat an mir meiner Gerechtigkeit entsprechend gehandelt.“'
    reason: lexical_alternative
  - marker: b
    text: Die „Reinheit meiner Hände“ ist ein Bild für schuldloses oder aufrichtiges Verhalten.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: hat mich … belohnt
  rationale: גמל bezeichnet ein dem Verhalten entsprechendes Handeln oder Vergelten. Der Parallelismus mit יָשִׁיב לִי legt hier eine positive Belohnung nahe; die weitere Bedeutung bleibt in Fußnote [a] sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כְּצִדְקִי
  choice: meiner Gerechtigkeit entsprechend
  rationale: צדק bezeichnet hier die Rechtschaffenheit beziehungsweise das rechte Verhalten des Beters. Die Formulierung bewahrt sowohl den ausdrücklichen Ich-Bezug als auch den Maßstabssinn der Präposition כְּ.
- source_word: כְּבֹר יָדַי
  choice: der Reinheit meiner Hände entsprechend
  rationale: בֹר meint Reinheit oder Sauberkeit. Das konkrete Bild der reinen Hände wird erhalten, da es poetisch für schuldloses beziehungsweise aufrichtiges Handeln steht.
- source_word: יָשִׁיב לִי
  choice: hat er mir vergolten
  rationale: Die Hifil-Form von שוב kann ein Zurückgeben bezeichnen und drückt hier im Zusammenhang eine dem Verhalten entsprechende Vergeltung aus. „Vergolten“ wahrt den Gedanken der Entsprechung, ohne einen ausdrücklich genannten Gegenstand zu ergänzen.
theological_decisions:
- issue: Mögliches Missverständnis von „meiner Gerechtigkeit“ als Behauptung sündloser Vollkommenheit oder als Selbsterlösung
  choice: Die Aussage des hebräischen Textes wird ungeschmälert als „meiner Gerechtigkeit“ wiedergegeben.
  alternative: meiner Unschuld; meinem gerechten Anliegen entsprechend
  rationale: Der Text verwendet ausdrücklich צדק mit Possessivsuffix der ersten Person. Die Übersetzung soll die Aussage und ihre theologische Spannung nicht vorsorglich abschwächen; im Zusammenhang geht es um die Rechtschaffenheit und Rechtfertigung des Beters in der behandelten Sache.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem poetischem Parallelismus. Die beiden Halbverse spiegeln einander durch „… entsprechend“; „Gerechtigkeit“ und das konkrete Bild der reinen Hände bleiben erhalten.
