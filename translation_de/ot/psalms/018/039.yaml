base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/039.yaml
  text: You equipped me with strength for battle[b][a]; you subdued those who rose against me beneath me.
translation:
  language: de
  text: Du hast mich mit Kraft zum Kampf gerüstet; du hast meine Angreifer unter mich gezwungen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Du hast mich mit Kraft zum Kampf umgürtet; du hast die, die sich gegen mich erhoben, unter mich niedergebeugt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּאַזְּרֵנִי
  choice: du hast mich … gerüstet
  rationale: Das Verb אזר bezeichnet ein Umgürten und daraus übertragen ein Ausrüsten oder Befähigen. „Gerüstet“ bewahrt das Bild und ist im heutigen Deutschen, besonders im Zusammenhang mit Kampf, gut verständlich.
- source_word: חַיִל
  choice: mit Kraft
  rationale: חַיִל bezeichnet hier kriegerische Stärke oder Leistungsfähigkeit, nicht ein Heer. „Kraft“ gibt diesen Sinn knapp und natürlich wieder.
- source_word: לַמִּלְחָמָה
  choice: zum Kampf
  rationale: מִלְחָמָה kann Krieg oder Kampf bedeuten. „Zum Kampf“ passt zur persönlichen Ausrüstung des Sprechers und klingt im Deutschen idiomatisch.
- source_word: תַּכְרִיעַ
  choice: du hast … gezwungen
  rationale: Der Hifil von כרע bedeutet, jemanden zum Beugen, Niedersinken oder Niederknien zu bringen. Zusammen mit „unter mich“ drückt „gezwungen“ die verursachte Unterwerfung natürlich aus, ohne das räumliche Bild zu beseitigen.
- source_word: קָמַי
  choice: meine Angreifer
  rationale: Wörtlich sind es „die sich gegen mich Erhebenden“. „Meine Angreifer“ gibt die feindliche Handlung in klarem, aktuellem Deutsch wieder; die wörtlichere Bildsprache wird in der Fußnote erhalten.
- source_word: תַּחְתָּי
  choice: unter mich
  rationale: Die räumliche Wendung bezeichnet Unterwerfung und Niederlage. „Unter mich“ bewahrt das konkrete Bild des hebräischen Textes.
