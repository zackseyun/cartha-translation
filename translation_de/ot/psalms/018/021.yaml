base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/021.yaml
  text: For I have kept the ways of Yahweh[b][a], and have not wickedly departed from my God.
translation:
  language: de
  text: Denn ich habe die Wege Jahwes bewahrt und mich nicht frevelhaft von meinem Gott abgewandt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und habe nicht frevelhaft gehandelt, indem ich mich von meinem Gott abwandte“. Das hebräische Verb bedeutet „frevelhaft handeln“; die anschließende Wendung bezeichnet die Abkehr von Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage; „Denn“ gibt den argumentativen Zusammenhang natürlich wieder.
- source_word: שָׁמַרְתִּי
  choice: ich habe … bewahrt
  rationale: שׁמר bedeutet „bewahren, hüten, einhalten“. „Bewahrt“ erhält sowohl den Gedanken treuer Beachtung als auch das Bild der Wege.
- source_word: דַּרְכֵי
  choice: die Wege
  rationale: דֶּרֶךְ bezeichnet hier die von Gott gewiesene Lebensführung; „Wege“ bewahrt das vertraute hebräische Bild.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben und steht wegen der hebräischen Genitivverbindung im Deutschen im Genitiv.
- source_word: וְלֹא רָשַׁעְתִּי מֵאֱלֹהָי
  choice: und mich nicht frevelhaft von meinem Gott abgewandt
  rationale: Das Verb רשע bezeichnet frevelhaftes oder schuldhaftes Handeln; mit מִן („von, weg von“) liegt die Vorstellung eines frevelhaften Abwendens von Gott nahe. Die Formulierung gibt diese Verbindung in natürlichem Deutsch wieder.
theological_decisions:
- issue: Davids Aussage über seine Gerechtigkeit, ohne daraus ausdrückliche Sündlosigkeit zu machen
  choice: Die Aussage wird als starke Bekundung treuer Lebensführung und fehlender Abkehr von Gott wiedergegeben.
  alternative: Eine absolute Aussage wie „ich war ohne Sünde“ oder lediglich „ich war nicht gottlos“.
  rationale: Der hebräische Text verbindet das Bewahren der Wege Jahwes mit dem Nicht-Abweichen von Gott. Die Übersetzung wahrt diesen konkreten, relationalen Anspruch und löst die Spannung zur allgemeinen menschlichen Sündhaftigkeit nicht durch Zusätze auf.
- issue: Deutung der Verbindung רשע mit מִן
  choice: „mich nicht frevelhaft von meinem Gott abgewandt“
  alternative: „nicht frevelhaft an meinem Gott gehandelt“
  rationale: מִן trägt gewöhnlich die Bedeutung „von, weg von“; zugleich muss die eigenständige Bedeutung von רשע („frevelhaft handeln“) hörbar bleiben. Die Hauptfassung verbindet beides, während die Fußnote die formal nähere Alternative offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Bildsprache. „Frevelhaft“ ist bewusst gehoben, aber verständlich, und entspricht dem starken moralischen Gewicht von רשע. Der Gottesname erscheint als „Jahwe“.
