  source_fidelity: Der Haupttext gibt יְקַּדְּמוּנִי im feindlichen Kontext angemessen als „stellten sich mir … entgegen“ wieder, ohne den nicht ausdrücklich genannten Angriff zu behaupten. „Am Tag meines Unglücks“ entspricht בְּיוֹם אֵידִי präzise. Der adversative Zusammenhang von וַיְהִי wird durch „doch“ treffend markiert; „wurde mir zur Stütze“ ist als mögliche ingressive Nuance von היה vertretbar und wahrt die Bildsprache von מִשְׁעָן.
