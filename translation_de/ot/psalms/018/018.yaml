  variant: modern standard German
source:
  edition: WLC
  text: יְקַדְּמ֥וּ/נִי בְ/יוֹם אֵידִ֑/י וַֽ/יְהִי יְהוָ֖ה לְ/מִשְׁעָ֣ן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/018.yaml
  text: They confronted me in the day of my calamity[a], but Yahweh was my support.
translation:
  language: de
  text: Sie stellten sich mir am Tag meines Unglücks entgegen,[a] doch Jahwe wurde mir zur Stütze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Sie kamen mir am Tag meines Unglücks zuvor; oder: Sie begegneten mir am Tag meines Unglücks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקַדְּמוּנִי
  choice: Sie stellten sich mir entgegen
  rationale: Das Piel von קדם mit Suffix der 1. Person Singular bezeichnet hier ein Entgegentreten oder Begegnen. Im feindlichen Zusammenhang gibt „sich mir entgegenstellen“ die gegnerische Begegnung wieder, ohne ausdrücklich einen Angriff zu behaupten.
- source_word: בְּיוֹם אֵידִי
  choice: am Tag meines Unglücks
  rationale: Die Zeitangabe wird im modernen Deutschen idiomatisch mit „am Tag“ wiedergegeben. אֵיד bezeichnet Unglück, Verderben oder eine Katastrophe; „Unglück“ ist verständlich und wahrt die poetische Weite.
- source_word: וַיְהִי
  choice: doch ... wurde
  rationale: Die Form führt die Aussage weiter, steht hier aber in deutlichem Gegensatz zum ersten Halbvers. „Doch“ macht diesen Kontrast natürlich kenntlich; „wurde“ bewahrt den möglichen ingressiven Sinn von היה.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְמִשְׁעָן לִי
  choice: mir zur Stütze
  rationale: מִשְׁעָן bezeichnet etwas, worauf man sich stützen kann. „Mir zur Stütze“ erhält sowohl das Bild tragender Hilfe als auch die hebräische Konstruktion mit ל.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der persönliche Gottesname. Die deutsche Form „Jahwe“ bewahrt ihn, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Bedeutung von וַיְהִי im zweiten Halbvers
  choice: doch Jahwe wurde mir zur Stütze
  alternative: doch Jahwe war meine Stütze
  rationale: „Wurde“ lässt die mögliche Bedeutung eines wirksam eintretenden Beistands erkennen, ohne auszuschließen, dass die Wendung im Zusammenhang schlicht einen Zustand beschreibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. „Sich entgegenstellen“ macht den feindlichen Kontext hörbar, während die Fußnote die lexikalisch möglichen neutraleren beziehungsweise stärker räumlichen Lesarten bewahrt.
