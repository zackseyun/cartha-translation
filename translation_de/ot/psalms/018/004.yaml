source:
  edition: WLC
  text: אֲפָפ֥וּ/נִי חֶבְלֵי מָ֑וֶת וְֽ/נַחֲלֵ֖י בְלִיַּ֣עַל יְבַֽעֲתֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/004.yaml
  text: The cords of death surrounded me[a], and the torrents of destruction terrified me.
translation:
  language: de
  text: Die Stricke des Todes umschlangen mich, und die Sturzbäche des Verderbens[a] versetzten mich in Schrecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort kann auch »Bosheit« oder »Nichtsnutzigkeit« bedeuten; als Eigenname aufgefasst: »Belial«.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: umschlangen mich
  rationale: Das Verb bezeichnet ein Umgeben oder Umschließen. Zusammen mit den »Stricken« gibt »umschlangen mich« das konkrete Bild natürlich und poetisch wieder.
- source_word: חֶבְלֵי
  choice: Stricke
  rationale: חבל bezeichnet Seile oder Stricke und kann poetisch auch Fesseln, Schlingen oder Todesqualen meinen. »Stricke« bewahrt hier das anschauliche Bild.
- source_word: מָוֶת
  choice: Tod
  rationale: Die direkte und kontextgemäße Wiedergabe des hebräischen Begriffs.
- source_word: נַחֲלֵי
  choice: Sturzbäche
  rationale: נחל kann ein Bachbett, einen Bach oder einen reißenden Wasserlauf bezeichnen. »Sturzbäche« vermittelt in diesem Bedrohungsbild die Wucht plötzlich heranströmenden Wassers.
- source_word: בְלִיַּעַל
  choice: Verderben
  rationale: בְלִיַּעַל bezeichnet häufig Nichtsnutzigkeit, Bosheit oder Unheil. In Verbindung mit bedrohlichen Sturzbächen bringt »Verderben« die zerstörerische Kraft im Deutschen am natürlichsten zum Ausdruck, ohne das Wort als Eigennamen festzulegen.
- source_word: יְבַעֲתוּנִי
  choice: versetzten mich in Schrecken
  rationale: Das Verb bezeichnet heftiges Erschrecken oder Entsetzen. Die gewählte Formulierung gibt seine starke Wirkung klar und idiomatisch wieder.
theological_decisions:
- issue: Ist בְלִיַּעַל hier ein Eigenname (»Belial«) oder ein Gattungsbegriff für Verderben, Bosheit oder Unheil?
  choice: 'Gattungsbegriff: »Verderben«'
  alternative: »Belial«; auch »Bosheit« oder »Nichtsnutzigkeit«
  rationale: Der poetische Zusammenhang verlangt keine spätere Personifizierung als Name eines bösen Wesens. »Verderben« bewahrt die zerstörerische Bedeutung, während die Fußnote die echte lexikalische Mehrdeutigkeit offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kräftiger poetischer Bildsprache. »Stricke« und »Sturzbäche« bleiben konkret und verständlich; die Satzstruktur folgt dem hebräischen Parallelismus.
