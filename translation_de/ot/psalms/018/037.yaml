  text: אֶרְדּ֣וֹף א֭וֹיְבַ/י וְ/אַשִּׂיגֵ֑/ם וְ/לֹֽא אָ֝שׁוּב עַד כַּלּוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/037.yaml
  text: I pursued my enemies and overtook them[a], and I did not turn back until they were consumed.
translation:
  language: de
  text: 'Ich verfolgte meine Feinde und holte sie ein;

    ich kehrte nicht um, bis sie völlig vernichtet waren.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „bis zu ihrer vollständigen Vernichtung“; der Handelnde wird im Hebräischen nicht ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרְדּוֹף
  choice: Ich verfolgte
  rationale: Das Qal-Imperfekt der 1. Person Singular steht hier im poetischen Siegesbericht. Das deutsche Präteritum fügt sich natürlich in den Rückblick ein, ohne die Bildwelt der militärischen Verfolgung abzuschwächen.
- source_word: אֹיְבַי
  choice: meine Feinde
  rationale: Die übliche und klare Wiedergabe von אֹיֵב mit Suffix der 1. Person Singular.
- source_word: וְאַשִּׂיגֵם
  choice: und holte sie ein
  rationale: Das Hifil von נשׂג bezeichnet hier das Erreichen beziehungsweise Einholen Verfolgter. „Holte sie ein“ ist im modernen Deutschen idiomatisch und bewahrt das Verfolgungsmotiv.
- source_word: וְלֹא אָשׁוּב
  choice: ich kehrte nicht um
  rationale: שׁוב bezeichnet in diesem Zusammenhang das Umkehren und damit den Abbruch der Verfolgung. Das Präteritum hält die erzählende Zeitform konsequent durch.
- source_word: עַד כַּלּוֹתָם
  choice: bis sie völlig vernichtet waren
  rationale: Die Wendung bezeichnet den Endpunkt vollständiger Niederlage oder Vernichtung. Die passive Ergebnisform wahrt, dass der hebräische Ausdruck den Handelnden nicht ausdrücklich nennt; „völlig“ bringt den Vollendungsaspekt von כלה zum Ausdruck.
theological_decisions:
- issue: Gewalt und nicht ausdrücklich genannter Handelnder im Schlusssatz
  choice: bis sie völlig vernichtet waren
  alternative: bis ich sie völlig vernichtet hatte
  rationale: Der militärische Gewaltgehalt wird nicht beschönigt. Zugleich wird kein ausdrückliches „ich“ als Handelnder in die Schlusswendung eingefügt, sodass die knappe Formulierung und ihre Spannung erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden parallelen Handlungen werden durch ein Semikolon gegliedert; die militärische Bildsprache bleibt klar und unmittelbar.
