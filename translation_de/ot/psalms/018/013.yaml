base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/013.yaml
  text: Yahweh thundered in the heavens[b][a], and the Most High gave his voice—hailstones and coals of fire.
translation:
  language: de
  text: Jahwe donnerte im Himmel, und der Höchste ließ seine Stimme hören[a] — Hagel und glühende Kohlen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gab seine Stimme“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְעֵם
  choice: donnerte
  rationale: Das Verb רעם bezeichnet in dieser Sturmtheophanie das Donnern und steht parallel dazu, dass der Höchste seine Stimme hören lässt.
- source_word: בַּשָּׁמַיִם
  choice: am Himmel
  rationale: Das morphologisch plurale שׁמים bezeichnet hier den Himmelsraum. Das idiomatische deutsche „am Himmel“ bewahrt das erhabene Bild, ohne unnatürlich zu klingen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְעֶלְיוֹן
  choice: der Höchste
  rationale: „Der Höchste“ ist die etablierte und genaue deutsche Wiedergabe dieses göttlichen Titels.
- source_word: יִתֵּן קֹלוֹ
  choice: ließ seine Stimme hören
  rationale: Die hebräische Wendung lautet wörtlich „gab seine Stimme“. Die gewählte Form bewahrt den Bezug auf Gottes Stimme und ist zugleich natürliches modernes Deutsch.
- source_word: בָּרָד
  choice: Hagelkörner
  rationale: Das singularische Kollektivum kann „Hagel“ bezeichnen; „Hagelkörner“ hebt das konkrete Bild der niedergehenden Sturmelemente hervor.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: und Feuerkohlen
  rationale: Die nahe Wiedergabe des hebräischen Ausdrucks bewahrt das eindringliche poetische Bild, ohne es vorschnell als Blitz oder als rein bildliches Gericht zu deuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Vers nennt ausdrücklich den Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Beziehung von „Hagelkörner und Feuerkohlen“ zum vorhergehenden Satz
  choice: Abrupte elliptische Fortsetzung nach einem Gedankenstrich
  alternative: Ein nicht ausdrücklich vorhandenes Verb ergänzen, etwa „sandte Hagel und Feuerkohlen“
  rationale: Im Hebräischen stehen die Sturmelemente ohne eigenes finites Verb. Der Gedankenstrich erhält die gedrängte poetische Folge und vermeidet eine inhaltliche Ergänzung.
translation_notes:
  register: Moderne, gehobene und gut verständliche Psalmsprache. Der Satzbau bleibt knapp und bildkräftig; der Gedankenstrich wahrt die Ellipse des Hebräischen.
