  text: I beat them fine like dust before the wind[c][b][a]; like mud in the streets I poured them out.
translation:
  language: de
  text: Ich zerrieb sie wie Staub vor dem Wind[a][b]; wie Schlamm auf den Straßen schüttete ich sie aus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich zermalmte sie wie Staub.“ Das hebräische Verb kann das Zermahlen oder Pulverisieren bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auf dem Angesicht des Windes“; gemeint ist Staub, der vom Wind fortgetrieben oder zerstreut wird.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wie Schlamm auf den Straßen leerte ich sie aus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: Ich zerrieb sie
  rationale: Das Qal von שׁחק bezeichnet hier das Zerreiben oder Zermalmen zu feinen Teilchen. „Zerrieb“ gibt sowohl die gewaltsame Handlung als auch das Ergebnis der Pulverisierung natürlich wieder.
- source_word: כְעָפָר
  choice: wie Staub
  rationale: עָפָר bedeutet gewöhnlich „Staub“ oder lockere Erde. Im Zusammenhang mit שׁחק steht die Vorstellung fein zerriebener Materie im Vordergrund.
- source_word: עַל־פְּנֵי רוּחַ
  choice: vor dem Wind
  rationale: Die wörtliche Wendung „auf dem Angesicht des Windes“ beschreibt idiomatisch Staub, der vom Wind fortgetrieben oder zerstreut wird. „Vor dem Wind“ bewahrt das Bild in verständlichem Deutsch.
- source_word: כְּטִיט חוּצוֹת
  choice: wie Schlamm auf den Straßen
  rationale: טִיט bezeichnet Schlamm oder Morast, חוּצוֹת hier die Straßen beziehungsweise öffentlichen Außenräume. Die Formulierung erhält das konkrete und erniedrigende Bild.
- source_word: אֲרִיקֵם
  choice: schüttete ich sie aus
  rationale: Das Hifil von ריק bedeutet „ausleeren“ oder „ausschütten“. „Ausschütten“ passt zum Bild des Straßenschlamms, ohne die räumliche Verteilung stärker auszudeuten, als der hebräische Text erlaubt.
