  text: וַ/יּוֹצִיאֵ֥/נִי לַ/מֶּרְחָ֑ב יְ֝חַלְּצֵ֗/נִי כִּ֘י חָ֥פֵֽץ בִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/019.yaml
  text: He brought me out into a broad place[a]; he rescued me[c][b], because he delighted in me.
translation:
  language: de
  text: Er führte mich hinaus ins Weite[a]; er rettete mich, weil er Gefallen an mir hatte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an einen weiten Ort“. Das hebräische Bild stellt der Enge und Bedrängnis Weite, Freiheit und Sicherheit gegenüber.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weil er Freude an mir hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  choice: Er führte mich hinaus
  rationale: Die Hifil-Form von יצא bedeutet, jemanden hinauszuführen oder herauszubringen. „Führte mich hinaus“ ist natürliches Deutsch und bewahrt das Bild der Befreiung.
- source_word: לַמֶּרְחָב
  choice: ins Weite
  rationale: מֶרְחָב bezeichnet Weite oder freien Raum und steht bildlich dem Eingeschlossensein und der Bedrängnis gegenüber. „Ins Weite“ gibt dieses Bild knapp und idiomatisch wieder.
- source_word: יְחַלְּצֵנִי
  choice: er rettete mich
  rationale: Die Piel-Form von חלץ kann herausziehen, befreien oder retten bedeuten. „Rettete mich“ passt zum Parallelismus und ist in modernem Deutsch unmittelbar verständlich.
- source_word: כִּי
  choice: weil
  rationale: כִּי führt hier den Grund für die Rettung ein; „weil“ gibt den kausalen Zusammenhang klar wieder.
- source_word: חָפֵץ בִּי
  choice: er Gefallen an mir hatte
  rationale: חפץ mit ב bezeichnet Wohlgefallen oder Freude an einer Person. Die Wendung bewahrt die Aussage persönlicher Zuwendung, ohne ihren theologischen Grund näher festzulegen.
theological_decisions:
- issue: Art des göttlichen Wohlgefallens im Schlusssatz
  choice: weil er Gefallen an mir hatte
  alternative: weil er Freude an mir hatte
  rationale: Der hebräische Text nennt Gottes Wohlgefallen als Grund der Rettung, erklärt aber nicht, ob dabei Verdienst, Erwählung oder Gnade gemeint ist. Die Übersetzung hält diese theologische Offenheit fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ins Weite“ ist idiomatisch und bewahrt zugleich das räumliche Befreiungsbild; „Gefallen an mir hatte“ formuliert die göttliche Zuwendung natürlich, ohne sie dogmatisch auszudeuten.
