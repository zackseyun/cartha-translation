  text: יְשַׁוְּע֥וּ וְ/אֵין מוֹשִׁ֑יעַ עַל יְ֝הוָ֗ה וְ/לֹ֣א עָנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/041.yaml
  text: They cried for help, but there was no savior; to the LORD, but he did not answer them.
translation:
  language: de
  text: Sie schrien um Hilfe, doch da war kein Retter; zum HERRN, doch er antwortete ihnen nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְשַׁוְּעוּ
  choice: Sie schrien um Hilfe
  rationale: Die Form bezeichnet einen dringenden Hilferuf; die natürliche deutsche Wendung gibt diesen Sinn klar wieder.
- source_word: מוֹשִׁיעַ
  choice: Retter
  rationale: Das substantivierte Partizip bezeichnet jemanden, der rettet. „Retter“ bewahrt die nominale Form und bleibt im Kontext offen.
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen entspricht dem üblichen Bibelregister.
- source_word: עָנָם
  choice: antwortete ihnen
  rationale: Die finite Verbform mit pronominalem Suffix wird direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Bezeichnung des fehlenden Helfers
  choice: kein Retter
  alternative: niemand, der rettete
  rationale: „Retter“ wahrt die substantivische Ausdrucksweise des Hebräischen, ohne die Aussage christologisch oder anderweitig näher festzulegen.
- issue: Gottes ausbleibende Antwort
  choice: er antwortete ihnen nicht
  alternative: er erhörte sie nicht
  rationale: „Antworten“ bildet ענה formal ab und bewahrt die harte Aussage des Verses; „erhören“ würde bereits stärker auf die Gewährung der Bitte zielen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. Das Semikolon erhält den abgebrochen wirkenden zweiten Hilferuf und seine Zuspitzung.
