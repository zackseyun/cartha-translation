id: PSA.18.44
reference: Psalms 18:44
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְ/שֵׁ֣מַֽע אֹ֭זֶן יִשָּׁ֣מְעוּ לִ֑/י בְּנֵֽי נֵ֝כָ֗ר יְכַחֲשׁוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/044.yaml
  text: At the hearing of the ear they obey me[c][b][a]; foreigners feign obedience to me.
translation:
  language: de
  text: Sobald sie von mir hören, gehorchen sie mir;[a] Fremde heucheln mir Ergebenheit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Beim Hören des Ohres gehorchen sie mir.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Fremde unterwerfen sich mir widerwillig«; auch möglich: »Fremde belügen mich.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: Sobald sie von mir hören
  rationale: Die wörtliche Wendung »beim Hören des Ohres« bezeichnet eine unmittelbare Reaktion auf das Gehörte. Die natürliche deutsche Wiedergabe bewahrt diesen zeitlichen Sinn, ohne den im Deutschen schwer verständlichen hebräischen Ausdruck nachzubilden.
- source_word: יִשָּׁמְעוּ לִי
  choice: gehorchen sie mir
  rationale: שׁמע mit ל bedeutet hier im Zusammenhang königlichen Sieges nicht nur hören, sondern auf jemanden hören beziehungsweise ihm gehorchen.
- source_word: בְּנֵי נֵכָר
  choice: Fremde
  rationale: Die wörtliche Wendung »Söhne der Fremde« ist ein hebräisches Idiom für Angehörige fremder Völker; »Fremde« gibt den Bezug knapp und natürlich wieder.
- source_word: יְכַחֲשׁוּ לִי
  choice: heucheln mir Ergebenheit
  rationale: Das Piel von כחש kann täuschen, verleugnen oder im Kontext einer Unterwerfung eine nur vorgetäuschte beziehungsweise widerwillige Loyalität ausdrücken. Die Formulierung stellt den Gegensatz zu echtem Gehorsam heraus, ohne die Mehrdeutigkeit ganz zu verdecken.
theological_decisions:
- issue: Art der Unterwerfung fremder Völker
  choice: heucheln mir Ergebenheit
  alternative: unterwerfen sich mir widerwillig / verleugnen mich
  rationale: Der Kontext legt erzwungene oder unaufrichtige Unterwerfung nahe, entscheidet aber nicht eindeutig zwischen Täuschung und widerwilligem Nachgeben. Die Hauptfassung betont die Unaufrichtigkeit; die Fußnote nennt die wesentlichen Alternativen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die erste hebräische Redewendung wird idiomatisch wiedergegeben; die poetische Kürze und der Gegensatz zwischen Gehorsam und nur äußerer Ergebenheit bleiben erhalten.
