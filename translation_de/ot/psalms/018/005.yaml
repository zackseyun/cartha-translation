source:
  edition: WLC
  text: חֶבְלֵ֣י שְׁא֣וֹל סְבָב֑וּ/נִי קִ֝דְּמ֗וּ/נִי מ֣וֹקְשֵׁי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/005.yaml
  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: de
  text: Die Fesseln des Scheols umgaben mich; die Schlingen des Todes traten mir entgegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Scheol“ bezeichnet den Bereich der Toten; auch übersetzbar mit „Totenreich“ oder, je nach Zusammenhang, „Grab“. „Traten mir entgegen“ kann auch „begegneten mir“ heißen.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי
  choice: Fesseln
  rationale: Das Substantiv bezeichnet Stricke oder Seile; im Bild bedrohlicher Umschließung gibt „Fesseln“ die bindende Gefahr natürlich und poetisch wieder, ohne auf Geburtswehen umzudeuten.
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Die Transliteration bewahrt den eigenständigen, mehrdeutigen hebräischen Begriff für den Bereich der Toten und vermeidet eine Verengung auf Grab oder Hölle.
- source_word: סְבָבוּנִי
  choice: umgaben mich
  rationale: Die Form bedeutet, jemanden zu umringen oder zu umgeben; „umgaben mich“ ist knapp, idiomatisch und wahrt das poetische Bild.
- source_word: קִדְּמוּנִי
  choice: traten mir entgegen
  rationale: Das Verb bezeichnet hier ein Begegnen oder Entgegentreten. Im feindlichen Zusammenhang vermittelt „traten mir entgegen“ die Bedrohung, ohne stärker als der hebräische Ausdruck „überwältigten“ zu behaupten.
- source_word: מוֹקְשֵׁי
  choice: die Schlingen
  rationale: Das Wort bezeichnet Fangschlingen oder Fallen. „Schlingen“ erhält das konkrete Fangbild und bildet einen passenden Parallelismus zu „Fesseln“.
- source_word: מָוֶת
  choice: des Todes
  rationale: Dies ist die direkte Wiedergabe und bewahrt den Tod als bedrohliche, beinahe personifizierte Macht.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: das Totenreich; das Grab
  rationale: „Scheol“ wahrt die Bedeutungsbreite des hebräischen Begriffs, hält ihn im Parallelismus vom „Tod“ unterscheidbar und vermeidet es, eine bestimmte spätere Jenseitslehre in den Vers hineinzutragen.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die zwei parallelen Bedrohungsbilder bleiben erhalten; „Scheol“ wird wegen seiner theologischen und lexikalischen Bedeutungsbreite transliteriert.
