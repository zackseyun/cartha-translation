source:
  edition: WLC
  text: כִּֽי בְ֭/ךָ אָרֻ֣ץ גְּד֑וּד וּ֝/בֵֽ/אלֹהַ֗/י אֲדַלֶּג שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/029.yaml
  text: For by you I can run against a troop[b][a], and by my God I can leap over a wall.
translation:
  language: de
  text: Denn mit dir stürme ich gegen eine Schar[a], und mit meinem Gott überspringe ich eine Mauer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Plündererschar«; auch: »eine Truppe«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »einen Schutzwall«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung beziehungsweise Erläuterung des vorausgehenden Lobes ein.
- source_word: בְךָ
  choice: mit dir
  rationale: ב bezeichnet hier die göttliche Befähigung; die im Deutschen natürliche Wendung bewahrt zugleich die persönliche Beziehung, ohne die Präposition übermäßig festzulegen.
- source_word: אָרֻץ
  choice: stürme ich gegen
  rationale: Das Verb רוץ bedeutet grundsätzlich »laufen«; zusammen mit dem militärischen Objekt bezeichnet es hier anschaulich das Anstürmen.
- source_word: גְּדוּד
  choice: eine Schar
  rationale: גְּדוּד kann eine Truppe, Schar oder Plündererschar bezeichnen. »Schar« wahrt die unbestimmte Größe des bewaffneten Verbands.
- source_word: וּבֵאלֹהַי
  choice: und mit meinem Gott
  rationale: Spiegelt die erste Vershälfte und bewahrt das persönliche Bekenntnis »mein Gott«.
- source_word: אֲדַלֶּג
  choice: überspringe ich
  rationale: Gibt דלג, »springen/überspringen«, unmittelbar und bildhaft wieder; eine ausdrückliche Ergänzung wie »kann« ist im Hebräischen nicht vorhanden.
- source_word: שׁוּר
  choice: eine Mauer
  rationale: שׁוּר bezeichnet hier eine Mauer beziehungsweise einen Schutzwall; »Mauer« ist die klare, allgemein verständliche Grundbedeutung.
theological_decisions:
- issue: Charakter der militärischen Bildsprache
  choice: Die konkrete militärische Bildsprache als Zeugnis göttlicher Befähigung beibehalten.
  alternative: Die Aussage allgemein auf das Überwinden von Lebenshindernissen beziehen.
  rationale: Die hebräischen Begriffe nennen eine bewaffnete Schar und eine Mauer. Eine Verallgemeinerung oder Vergeistlichung würde die historische und poetische Konkretheit des Textes abschwächen.
- issue: Art der göttlichen Befähigung in בְךָ / בֵאלֹהַי
  choice: Mit »mit dir / mit meinem Gott« wiedergeben.
  alternative: »Durch dich / durch meinen Gott« oder »kraft deiner Hilfe / kraft meines Gottes«.
  rationale: Die Präposition kann Mittel oder Beistand ausdrücken. »Mit« klingt im Deutschen natürlich und lässt offen, ob die Betonung stärker auf Gottes Gegenwart oder seiner wirksamen Befähigung liegt.
translation_notes:
  register: Moderne, würdige Psalmsprache mit konkreter militärischer Bildlichkeit. Der parallele Satzbau wurde bewahrt; »stürme« vermittelt die kontextuelle Bedeutung von »laufen«, während »überspringe« eng am hebräischen Verb bleibt.
