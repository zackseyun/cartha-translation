  text: מְשַׁוֶּ֣ה רַ֭גְלַ/י כָּ/אַיָּל֑וֹת וְ/עַ֥ל בָּ֝מֹתַ֗/י יַעֲמִידֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/033.yaml
  text: He makes my feet like the deer’s[b][a], and sets me on my heights.
translation:
  language: de
  text: Er macht meine Füße denen der Hirschkühe gleich[a] und stellt mich auf meine Höhen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er macht meine Füße wie die der Hirschkühe.“ Gemeint sind weibliche Hirsche; das Bild erinnert an ihren schnellen, sicheren Tritt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf meine hoch gelegenen Orte“.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: macht … gleich
  rationale: Das Piel-Partizip von שׁוה bezeichnet hier ein Gleichmachen; zusammen mit כְּ gibt „macht … gleich“ die Konstruktion und den fortdauernd beschriebenen Charakter Gottes angemessen wieder.
- source_word: רַגְלַי
  choice: meine Füße
  rationale: רֶגֶל bezeichnet hier im Bild der sicheren Fortbewegung die Füße; die erste Person Singular wird bewahrt.
- source_word: כָּאַיָּלוֹת
  choice: denen der Hirschkühe gleich
  rationale: אַיָּלוֹת ist eine feminine Pluralform und bezeichnet weibliche Hirsche. Die Formulierung macht zugleich deutlich, dass die Füße des Sprechers mit deren Füßen bzw. Tritt verglichen werden.
- source_word: בָּמוֹתַי
  choice: meine Höhen
  rationale: Die wörtliche poetische Wendung bewahrt sowohl das Bild erhöhter Orte als auch das Possessivsuffix; eine kultische Bedeutung ist hier nicht zwingend.
- source_word: יַעֲמִידֵנִי
  choice: stellt mich
  rationale: Der Hifil von עמד bedeutet „zum Stehen bringen, hinstellen“. „Stellt mich“ bewahrt die Kausativität, ohne die nur implizierte Sicherheit ausdrücklich in den Text einzutragen.
theological_decisions:
- issue: Bild von Beweglichkeit und Standfestigkeit
  choice: Das Tier- und Höhenbild bleibt unaufgelöst stehen.
  alternative: Die Aussage könnte deutend als Gabe von Trittsicherheit, militärischer Überlegenheit oder geistlicher Sicherheit formuliert werden.
  rationale: Der weitere Psalm hat einen kriegerischen Kontext, doch der Vers selbst nennt nur hirschkuhgleiche Füße und das Aufgestelltwerden auf den eigenen Höhen. Die Übersetzung vermeidet eine Festlegung auf eine einzelne Deutung.
- issue: Bedeutung von „meine Höhen“
  choice: Das Possessivsuffix und die räumliche Bildsprache werden mit „meine Höhen“ bewahrt.
  alternative: Möglich wären „meine hoch gelegenen Orte“ oder kontextuell „die Höhen“; „Höhenheiligtümer“ wäre ebenfalls lexikalisch möglich, passt hier aber nicht zwingend.
  rationale: Die offene poetische Form erhält die genuine Mehrdeutigkeit des hebräischen Ausdrucks und importiert keine kultische oder militärische Präzisierung.
translation_notes:
  register: Moderne, würdevolle Psalmsprache. „Hirschkühe“ ist präziser als das heute leicht missverständliche „Hirschinnen“ und weniger altertümlich als „Hinden“. Die leicht gehobene Wendung „denen … gleich“ entspricht der poetischen Form, bleibt aber allgemein verständlich.
