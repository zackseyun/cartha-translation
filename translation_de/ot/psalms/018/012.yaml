  text: מִ/נֹּ֗גַהּ נֶ֫גְדּ֥/וֹ עָבָ֥י/ו עָבְר֑וּ בָּ֝רָ֗ד וְ/גַֽחֲלֵי אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/012.yaml
  text: From the brightness before him his clouds passed on—hail and coals of fire[a].
translation:
  language: de
  text: Aus dem Glanz vor ihm zogen seine dichten Wolken vorüber – Hagel und feurige Kohlen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aus dem Glanz vor ihm zogen seine dichten Wolken vorbei: Hagel und Feuerkohlen.“ Der hebräische Text ist knapp und stark poetisch; die Beziehung zwischen den Wolken, dem Hagel und den feurigen Kohlen lässt sich leicht unterschiedlich ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: Aus dem Glanz
  rationale: נֹגַהּ bezeichnet Glanz, Helligkeit oder strahlendes Licht. „Glanz“ ist im Deutschen knapp, würdevoll und passt zur Theophanie im Sturm; מִן wird als Herkunftsangabe mit „aus“ wiedergegeben.
- source_word: נֶגְדּוֹ
  choice: vor ihm
  rationale: נֶגֶד mit Suffix bezeichnet hier den Raum vor ihm. „Vor ihm“ ist natürlich und bewahrt den räumlichen Sinn, ohne „Gegenwart“ interpretierend einzutragen.
- source_word: עָבָיו
  choice: seine dichten Wolken
  rationale: עָב bezeichnet eine Wolkenmasse beziehungsweise eine dichte Wolke. „Dichte Wolken“ bildet die besondere Färbung gegenüber einem allgemeinen Wort für Wolken ab.
- source_word: עָבְרוּ
  choice: zogen … vorüber
  rationale: Das Qal von עבר kann „vorüberziehen“, „vorbeiziehen“ oder „hinüberziehen“ bedeuten. Bei Wolken ist „zogen … vorüber“ idiomatisch und erhält die Bewegung des poetischen Bildes.
- source_word: בָּרָד
  choice: Hagel
  rationale: Dies ist die übliche und eindeutige deutsche Entsprechung des meteorologischen Ausdrucks.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: und feurige Kohlen
  rationale: Die Konstruktverbindung bedeutet wörtlich „Kohlen des Feuers“. „Feurige Kohlen“ ist im modernen Deutschen natürlicher, bleibt bildkräftig und vermeidet die mögliche Fehlvorstellung eines Materials namens „Feuerkohle“.
theological_decisions:
- issue: Poetische Bildsprache einer Gotteserscheinung im Sturm
  choice: Die Sturm- und Feuerbilder werden als Darstellung des göttlichen Erscheinens beibehalten, ohne sie auf bloße Metaphern zu reduzieren oder als dogmatische Aussage über ein bestimmtes Naturwunder auszuweiten.
  alternative: Die Zeile ausschließlich als Bild für militärischen Sieg verstehen oder jedes Bildelement ausdrücklich als wörtliches Wetterwunder festlegen.
  rationale: Der hebräische Vers ist kompakte Poesie und lässt das Verhältnis von bildhafter und tatsächlicher Naturerscheinung offen. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Der Satz bleibt bewusst kompakt; der Gedankenstrich bildet die abrupte hebräische Reihung ab. „Dichte Wolken“ verdeutlicht die lexikalische Färbung von עָב, ohne „Sturmwolken“ interpretierend vorwegzunehmen.
