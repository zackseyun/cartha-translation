  text: כִּ֣י כָל מִשְׁפָּטָ֣י/ו לְ/נֶגְדִּ֑/י וְ֝/חֻקֹּתָ֗י/ו לֹא אָסִ֥יר מֶֽנִּ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/022.yaml
  text: For all his judgments were before me[a], and I did not put away his statutes from me.
translation:
  language: de
  text: Denn alle seine Rechtsbestimmungen standen mir vor Augen, und seine Satzungen entfernte ich nicht von mir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und von seinen Satzungen wich ich nicht ab“. Das hebräische Verb kann hier entweder bedeuten, die Satzungen von sich zu entfernen, oder von ihnen abzuweichen. Der Haupttext bewahrt den unmittelbar transitiven Sinn der Verbform.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und gibt die erklärende Funktion im Deutschen natürlich wieder.
- source_word: כָל
  choice: alle
  rationale: Bewahrt den umfassenden Sinn des hebräischen Quantors.
- source_word: מִשְׁפָּטָיו
  choice: seine Rechtsbestimmungen
  rationale: מִשְׁפָּט kann richterliche Entscheidungen, Rechtsordnungen oder verbindliche Bestimmungen bezeichnen. „Rechtsbestimmungen“ wahrt den rechtlichen und bundesbezogenen Sinn in verständlichem Gegenwartsdeutsch.
- source_word: לְנֶגְדִּי
  choice: standen mir vor Augen
  rationale: Gibt das räumliche Bild „vor mir“ idiomatisch wieder und drückt aus, dass der Beter sie bewusst im Blick behielt.
- source_word: וְחֻקֹּתָיו
  choice: und seine Satzungen
  rationale: חֻקּוֹת bezeichnet festgesetzte Vorschriften oder Erlasse; „Satzungen“ ist in diesem rechtlich-bundestheologischen Zusammenhang präzise und würdig.
- source_word: לֹא אָסִיר
  choice: entfernte ich nicht
  rationale: 'Bewahrt den unmittelbar transitiven Sinn des Hifil von סור: etwas entfernen oder wegschaffen.'
- source_word: מֶנִּי
  choice: von mir
  rationale: Gibt die ausdrücklich vorhandene Präpositionalverbindung wieder und stützt die transitive Lesart „von mir entfernen“.
theological_decisions:
- issue: Beziehung des Beters zu Gottes Satzungen
  choice: Der Haupttext sagt, dass der Beter die Satzungen nicht von sich entfernte.
  alternative: Der Beter wich nicht von den Satzungen ab.
  rationale: Die transitive Form des hebräischen Verbs und die Ergänzung „von mir“ sprechen unmittelbar für „entfernen“; die alternative, inhaltlich eng verwandte Deutung bleibt in der Fußnote sichtbar, ohne die Aussage konfessionell auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Rechtsbestimmungen“ und „Satzungen“ erhalten den rechtlichen Charakter des Parallelismus; „standen mir vor Augen“ macht das hebräische Bild natürlich verständlich. Der Fußnotenmarker steht unmittelbar nach der betroffenen Aussage.
