  text: וַ/יָּֽשֶׁב יְהוָ֣ה לִ֣/י כְ/צִדְקִ֑/י כְּ/בֹ֥ר יָ֝דַ֗/י לְ/נֶ֣גֶד עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/024.yaml
  text: Yahweh repaid me according to my righteousness[b][a], according to the cleanness of my hands before his eyes.
translation:
  language: de
  text: Jahwe vergalt mir nach meiner Gerechtigkeit[a], nach der Reinheit meiner Hände[b] vor seinen Augen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entsprechend meiner Rechtschaffenheit“.'
    reason: lexical_alternative
  - marker: b
    text: Die „Reinheit meiner Hände“ ist ein hebräisches Bild für schuldloses oder aufrichtiges Handeln.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: vergalt mir
  rationale: Der Hifil von שוב bezeichnet hier mit לִי ein Zurückgeben bzw. ein dem Verhalten entsprechendes Vergelten. „Vergalt mir“ bewahrt diese Entsprechung, ohne die Aussage ausdrücklich auf eine Belohnung zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כְצִדְקִי
  choice: nach meiner Gerechtigkeit
  rationale: כְּ bezeichnet den Maßstab bzw. die Entsprechung; צֶדֶק meint hier die vom Beter beanspruchte Gerechtigkeit oder Rechtschaffenheit. Die direkte Formulierung erhält die theologische Spannung.
- source_word: כְּבֹר יָדַי
  choice: nach der Reinheit meiner Hände
  rationale: בֹּר bezeichnet Reinheit; zusammen mit „meine Hände“ entsteht ein hebräisches Bild für schuldloses bzw. aufrichtiges Handeln. Die Übersetzung erhält das konkrete Bild.
- source_word: לְנֶגֶד עֵינָיו
  choice: vor seinen Augen
  rationale: Die Formulierung gibt sowohl die räumlich-bildhafte Wendung als auch den Gedanken göttlicher Wahrnehmung und Beurteilung wieder.
theological_decisions:
- issue: Soll der Anspruch des Beters auf eigene Gerechtigkeit abgeschwächt werden?
  choice: Die Aussage von Vergeltung nach „meiner Gerechtigkeit“ und der „Reinheit meiner Hände“ bleibt direkt erhalten.
  alternative: Als bloße relative Unschuld oder Bundestreue paraphrasieren.
  rationale: Der hebräische Text formuliert den Anspruch ausdrücklich. Eine Abschwächung würde die im Text vorhandene theologische Spannung stillschweigend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vergalt“ ist gehoben, aber allgemein verständlich und bildet den Gedanken einer dem Verhalten entsprechenden Erwiderung präzise ab. Die Bildsprache des Hebräischen bleibt erhalten.
