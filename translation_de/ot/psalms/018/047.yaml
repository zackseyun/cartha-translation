lexical_decisions:
- source_word: הָאֵל
  choice: der Gott
  rationale: Der bestimmte Artikel wird bewahrt; die Form setzt die poetische Beschreibung Gottes fort.
- source_word: הַנּוֹתֵן
  choice: der … gewährt
  rationale: Das attributive Partizip beschreibt Gott als den, der dies tut. „Gewährt“ verbindet sich im Deutschen natürlich mit dem Empfänger „mir“.
- source_word: נְקָמוֹת
  choice: Rache
  rationale: Der hebräische abstrakte beziehungsweise intensivierende Plural wird idiomatisch im Singular wiedergegeben, ohne die Aussage zu Racheakten abzuschwächen.
- source_word: לִי
  choice: mir
  rationale: Der Dativ gibt den Empfänger oder Begünstigten knapp und natürlich wieder.
- source_word: וַיַּדְבֵּר
  choice: und … zwingt
  rationale: In diesem Zusammenhang bezeichnet die Form das Unterwerfen beziehungsweise Unterordnen, nicht das Sprechen. Das Präsens passt zur fortgesetzten Beschreibung Gottes.
- source_word: עַמִּים
  choice: Völker
  rationale: Der Plural wahrt die ethnisch-politische Mehrzahl des hebräischen Ausdrucks.
- source_word: תַּחְתָּי
  choice: unter mich
  rationale: Die räumliche Metapher der Unterwerfung wird direkt erhalten und durch „zwingt“ verständlich gemacht.
theological_decisions:
- issue: Göttliche Rache
  choice: „Rache“ als Gottes vergeltendes Handeln zugunsten des Psalmisten beibehalten
  alternative: „Recht verschaffen“ oder „Rettung“
  rationale: נְקָמוֹת bezeichnet ausdrücklich Rache beziehungsweise Rachetaten. Mildere Wiedergaben würden die Spannung und Aussagekraft des Textes abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung „der Gott“ bewahrt den bestimmten Artikel und den fortlaufenden poetischen Charakter. Satzanfang kleingeschrieben, da der Vers syntaktisch als Fortsetzung der vorangehenden Beschreibung gelesen werden kann.
