translation:
  language: de
  text: der Gott, der mir Rache verschafft[a] und Völker mir unterwirft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Taten der Rache«; im Hebräischen steht ein Plural mit abstrakter oder verstärkender Bedeutung.'
