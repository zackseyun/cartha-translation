  text: מגדל יְשׁוּע֪וֹת מַ֫לְכּ֥/וֹ וְ/עֹ֤שֶׂה חֶ֨סֶד לִ/מְשִׁיח֗/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֗/וֹ עַד עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/050.yaml
  text: He gives great victories to his king and shows steadfast love to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: de
  text: Er ist für seinen König ein Turm der Rettungen[c] und erweist seinem Gesalbten[a], David und seinen Nachkommen[b], treue Liebe für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Seinem Gesalbten« kann auch mit »seinem Messias« wiedergegeben werden. Unmittelbar ist David beziehungsweise der davidische König gemeint; zugleich hat der Ausdruck eine weiterreichende messianische Bedeutung.
    reason: alternative_reading
  - marker: b
    text: Das mit »Nachkommen« übersetzte hebräische Wort steht im Singular und kann Davids gesamte Linie bezeichnen; im größeren biblischen Zusammenhang lässt es zugleich eine Zuspitzung auf einen messianischen Nachfahren zu.
    reason: lexical_alternative
  - marker: c
    text: 'Der Versanfang ist im Hebräischen textlich und syntaktisch schwierig. Die vorliegende Form lässt sich wörtlich als »ein Turm der Rettungen« verstehen. Eine abweichende, an einer verwandten Überlieferung orientierte Deutung lautet: »Er macht die Rettungen seines Königs groß.«'
    reason: textual_variant
lexical_decisions:
- source_word: מגדל
  choice: schenkt … große
  rationale: Die masoretische Form ist textlich und syntaktisch schwierig. Im Licht der eng verwandten Lesart in 2. Samuel 22,51 gibt die Formulierung den Sinn wieder, dass Gott die Rettungen beziehungsweise Siege seines Königs groß macht, ohne die unsichere Deutung zu verschweigen.
- source_word: יְשׁוּעוֹת
  choice: Siege
  rationale: Der Plural bezeichnet wiederholte Rettungstaten. Im königlich-militärischen Zusammenhang ist »Siege« natürlich und bringt den rettenden Erfolg prägnant zum Ausdruck.
- source_word: מַלְכּוֹ
  choice: seinem König
  rationale: Gibt die Konstruktion mit dem Suffix der dritten Person Singular direkt wieder und bewahrt die Beziehung zwischen Gott und dem König.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: und erweist … treue Liebe
  rationale: חֶסֶד bezeichnet verlässliche, bundestreue Zuwendung. »Treue Liebe erweisen« ist verständlich, würdevoll und inhaltlich gewichtiger als bloße »Güte«.
- source_word: לִמְשִׁיחוֹ
  choice: seinem Gesalbten
  rationale: Der unmittelbare Bezug ist David beziehungsweise der davidische König. »Gesalbter« entspricht diesem Kontext und lässt zugleich die messianische Tragweite offen.
- source_word: לְדָוִד
  choice: David
  rationale: Der Personenname wird in seiner gebräuchlichen deutschen Form wiedergegeben; die Apposition erläutert, wer hier zunächst mit dem Gesalbten gemeint ist.
- source_word: וּלְזַרְעוֹ
  choice: und seinen Nachkommen
  rationale: זֶרַע ist grammatisch Singular, kann aber kollektiv die Nachkommenschaft beziehungsweise die davidische Linie bezeichnen. Das deutsche »Nachkommen« ist natürlich und legt weder ausschließlich eine Mehrzahl noch ausschließlich einen einzelnen messianischen Nachfahren fest.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Natürliche und prägnante Wiedergabe der unbegrenzten beziehungsweise dauerhaft fortbestehenden Zeitspanne.
theological_decisions:
- issue: Messianischer Klang von מְשִׁיחוֹ in einem davidischen Königspsalm
  choice: Im Haupttext steht »seinem Gesalbten«; die mögliche Wiedergabe »seinem Messias« wird in einer Fußnote genannt.
  alternative: seinem Messias
  rationale: David ist der unmittelbare historische Bezug, doch der Titel trägt im größeren biblischen Zusammenhang messianische Bedeutung. Die Übersetzung bewahrt beides, ohne den Vers einseitig festzulegen.
- issue: Bedeutungsumfang von זַרְעוֹ
  choice: »seinen Nachkommen« bleibt hinsichtlich der davidischen Linie und eines möglichen einzelnen messianischen Nachfahren offen.
  alternative: seinem Samen / seiner Nachkommenschaft
  rationale: Das hebräische Kollektivwort kann die Dynastie als Ganze umfassen und zugleich in einem einzelnen Nachfahren zugespitzt verstanden werden. Die Fußnote hält diese Spannung ausdrücklich fest.
- issue: Schwierige Anfangslesart מגדל
  choice: Der Haupttext folgt sinngemäß der verbalen Deutung »schenkt … große Siege«; die nominale Lesart wird als Alternative dokumentiert.
  alternative: Er ist seinem König ein Turm der Rettungen
  rationale: Die hebräische Überlieferung des Versanfangs ist schwierig, und 2. Samuel 22,51 bietet eine eng verwandte verbale Lesart. Eine Fußnote schützt die echte textliche und syntaktische Unsicherheit vor stillschweigender Auflösung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Psalmstil. Die parallelen Verben »schenkt« und »erweist« sorgen für einen natürlichen Satzfluss. Fachsprachliche oder konfessionell festgelegte Formulierungen werden vermieden; echte textliche und messianische Mehrdeutigkeit bleibt durch die Fußnoten sichtbar.
