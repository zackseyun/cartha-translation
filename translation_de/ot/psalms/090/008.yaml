id: PSA.90.8
reference: Psalms 90:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שת עֲוֺנֹתֵ֣י/נוּ לְ/נֶגְדֶּ֑/ךָ עֲ֝לֻמֵ֗/נוּ לִ/מְא֥וֹר פָּנֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/008.yaml
  text: You have set our iniquities before you[b][a], our hidden sins in the light of your face.
translation:
  language: de
  text: Du hast unsere Verfehlungen vor dich gestellt, unsere verborgenen Sünden[a] ins Licht deines Angesichts.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unser Verborgenes« beziehungsweise »unsere geheimen Sünden«. Das hebräische Wort bezeichnet das, was verborgen oder verheimlicht ist; »Sünden« ergibt sich aus dem Parallelismus.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »zum Licht deines Angesichts«; ein Bild dafür, dass vor Gottes Gegenwart nichts verborgen bleibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁתָּה / שת
  choice: Du hast … gestellt
  rationale: Das Perfekt von שִׁית bezeichnet Gottes vollzogene Handlung; das deutsche Perfekt klingt hier natürlich und bewahrt das Bild des Hinstellens.
- source_word: עֲוֺנֹתֵינוּ
  choice: unsere Verfehlungen
  rationale: עָוֹן bezeichnet schuldhafte Vergehen beziehungsweise Schuld. »Verfehlungen« bewahrt das moralische Gewicht und die Mehrzahl, ohne den Ausdruck unnötig zu verengen.
- source_word: לְנֶגְדֶּךָ
  choice: vor dich
  rationale: Die Wendung bedeutet »vor dir/dich« und bezeichnet die unmittelbare Aussetzung vor Gottes Blick. Mit »gestellt« verlangt das Deutsche idiomatisch den Akkusativ.
- source_word: עֲלֻמֵנוּ
  choice: unsere verborgenen Sünden
  rationale: Der Ausdruck bezeichnet Verborgenes oder Verheimlichtes. Der Parallelismus mit »unsere Verfehlungen« legt verborgenes sündiges Handeln nahe; »Sünden« macht die poetische Ellipse verständlich.
- source_word: לִמְאוֹר
  choice: ins Licht
  rationale: 'Das ל kann hier zielgerichtet verstanden werden: Das Verborgene wird dem Licht ausgesetzt. »Ins Licht« fügt sich zudem parallel zu »vor dich gestellt«.'
- source_word: פָּנֶיךָ
  choice: deines Angesichts
  rationale: »Angesicht« bewahrt das konkrete hebräische Bild von Gottes פנים und verleiht der poetischen Aussage eine würdige, im Deutschen verständliche Form.
theological_decisions:
- issue: Explizierung des in עֲלֻמֵנוּ nur angedeuteten Gegenstands
  choice: »unsere verborgenen Sünden«
  alternative: »unser Verborgenes« oder »unsere Geheimnisse«
  rationale: Der Parallelismus mit עֲוֺנֹתֵינוּ weist auf verborgene Schuld hin. Die Ergänzung »Sünden« verdeutlicht die Ellipse, ohne eine fremde theologische Aussage einzutragen.
- issue: Bildsprache von Gottes פנים
  choice: »deines Angesichts«
  alternative: »deiner Gegenwart«
  rationale: 'Die konkrete Bildsprache bleibt erhalten: Gottes Angesicht bringt das Verborgene ans Licht. »Gegenwart« wäre sinngemäß möglich, würde das Bild jedoch auflösen.'
translation_notes:
  register: Moderne, würdige Psalmsprache. »Angesicht« ist bewusst poetisch und quellennah; Satzbau und Wortwahl bleiben dennoch für heutige Leser verständlich.
