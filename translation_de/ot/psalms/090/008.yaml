  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Bilder des Hebräischen treffend wieder: Gottes vollzogene Handlung, die Verfehlungen „vor dich“ zu stellen, sowie das verborgene Fehlverhalten im Licht seines Angesichts. Die Ergänzung „Sünden“ bei עֲלֻמֵנוּ ist durch den Parallelismus gut begründet und wird durch die Fußnote transparent als Auslegung einer elliptischen Form kenntlich gemacht.'
  naturalness: „Du hast unsere Verfehlungen vor dich gestellt, unsere verborgenen Sünden ins Licht deines Angesichts“ ist im modernen Deutschen verständlich und zugleich angemessen poetisch. Der elliptisch wiederaufgenommene Ausdruck „gestellt“ funktioniert in der parallelen Satzhälfte. „Angesicht“ ist hier eine weiterhin verständliche, würdige Psalmenformulierung.
  terminology: „Verfehlungen“ ist für עֲוֺנֹתֵינוּ eine tragfähige moderne Wiedergabe mit moralischem Gewicht. „Verborgene Sünden“ ist kontextuell plausibel, ohne die lexikalische Restoffenheit zu verschweigen. „Angesicht“ erhält die konkrete פנים-Bildsprache, statt sie zu „Gegenwart“ zu abstrahieren. Die Fußnoten sind korrekt verankert und erläutern jeweils die relevante Übersetzungsentscheidung.
