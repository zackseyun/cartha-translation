  text: כִּ֣י כָל יָ֭מֵי/נוּ פָּנ֣וּ בְ/עֶבְרָתֶ֑/ךָ כִּלִּ֖ינוּ שָׁנֵ֣י/נוּ כְמוֹ הֶֽגֶה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/009.yaml
  text: For all our days pass away in your wrath[a]; we finish our years like a sigh.
translation:
  language: de
  text: Denn alle unsere Tage vergehen unter deinem Zorn; wir bringen unsere Jahre zu Ende wie ein Seufzer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein Murmeln“ oder „wie ein Stöhnen“. Das hebräische Wort bezeichnet einen leisen Laut; im Haupttext steht „Seufzer“, weil dies im Zusammenhang die Flüchtigkeit des Lebens hervorhebt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Bewahrt die begründende beziehungsweise erläuternde Verbindung zum vorausgehenden Gedanken und klingt in deutscher Poesie natürlich.
- source_word: כָל יָמֵינוּ
  choice: alle unsere Tage
  rationale: Gibt Plural und Bildlichkeit der hebräischen Wendung unmittelbar wieder.
- source_word: פָּנוּ
  choice: vergehen
  rationale: Das Verb bezeichnet hier, dass die Tage sich wenden und vorübergehen; „vergehen“ ist idiomatisch und passt zum Thema menschlicher Vergänglichkeit.
- source_word: בְעֶבְרָתֶךָ
  choice: unter deinem Zorn
  rationale: עֶבְרָה bezeichnet heftigen Zorn. „Unter“ gibt den Umstand beziehungsweise die Sphäre idiomatisch wieder, in der die Tage vergehen, ohne die Aussage abzuschwächen.
- source_word: כִּלִּינוּ
  choice: wir bringen … zu Ende
  rationale: Das Piel von כלה drückt hier das Vollenden oder Zu-Ende-Bringen aus. Die Formulierung ist natürlich und erhält zugleich die aktive Verbform des Hebräischen.
- source_word: שָׁנֵינוּ
  choice: unsere Jahre
  rationale: Direkte Wiedergabe des Nomens mit Suffix; der Plural wahrt den Parallelismus zu „Tage“.
- source_word: כְמוֹ
  choice: wie
  rationale: Direkte und natürliche Wiedergabe der Vergleichspartikel.
- source_word: הֶגֶה
  choice: einen Seufzer
  rationale: Das Wort kann einen leisen Laut wie Murmeln, Stöhnen oder Seufzen bezeichnen. „Seufzer“ vermittelt im Kontext die Kürze und Hinfälligkeit des Lebens, während andere mögliche Lautbedeutungen in der Fußnote erhalten bleiben.
theological_decisions:
- issue: Bezeichnung des göttlichen Zorns
  choice: deinem Zorn
  alternative: deinem Grimm / deinem heftigen Zorn
  rationale: Die Formulierung bewahrt die ausdrückliche und gewichtige Aussage, dass das Vergehen des menschlichen Lebens unter Gottes עֶבְרָה steht, ohne diese theologische Spannung abzuschwächen oder konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelstruktur. „Unter deinem Zorn“ ist gegenüber dem wörtlicheren „in deinem Zorn“ idiomatischer, ohne die Intensität des Ausgangstextes zu mindern.
