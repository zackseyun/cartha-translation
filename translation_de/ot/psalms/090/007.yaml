source:
  edition: WLC
  text: כִּֽי כָלִ֥ינוּ בְ/אַפֶּ֑/ךָ וּֽ/בַ/חֲמָתְ/ךָ֥ נִבְהָֽלְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/007.yaml
  text: For we are consumed by your anger[b][a], and by your wrath we are terrified.
translation:
  language: de
  text: Denn durch deinen Zorn vergehen wir[a], und durch deinen Grimm sind wir bestürzt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kommen wir an unser Ende“ oder „werden wir aufgerieben“. Das hebräische Verb kann das Vergehen, Aufgebrauchtwerden oder Zu-Ende-Kommen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „geraten wir in Schrecken“ oder „sind wir verstört“. Das hebräische Verb bezeichnet heftige Bestürzung, Beunruhigung oder Schrecken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die vorausgehende Aussage; „Denn“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: כָלִינוּ
  choice: wir vergehen
  rationale: Das Verb כלה bezeichnet hier das Aufgeriebenwerden beziehungsweise Zu-Ende-Gehen. „Wir vergehen“ bewahrt sowohl den Vorgang als auch dessen vernichtendes Ergebnis, ohne die Form unnötig ausdrücklich passiv wiederzugeben.
- source_word: בְאַפֶּךָ
  choice: durch deinen Zorn
  rationale: 'Die Präposition ב ist hier am besten instrumental oder kausal zu verstehen: Gottes Zorn ist Ursache beziehungsweise Mittel des Vergehens.'
- source_word: חֲמָתְךָ
  choice: deinen Grimm
  rationale: חֵמָה bezeichnet heftigen, glühenden Zorn. „Grimm“ ist würdevoll und unterscheidet das Wort im poetischen Parallelismus von אַף, ohne eine fremde theologische Nuance einzutragen.
- source_word: נִבְהָלְנוּ
  choice: sind wir bestürzt
  rationale: Das Verb בהל umfasst Erschrecken, Verstörung und Bestürzung. „Bestürzt“ erhält die Bedeutungsbreite besser als das stärker festlegende „von Schrecken erfüllt“.
theological_decisions:
- issue: Wiedergabe der beiden Ausdrücke für Gottes Zorn im Parallelismus
  choice: „Zorn“ und „Grimm“ als verschiedene Wörter beibehalten
  alternative: Beide mit „Zorn“ wiedergeben oder „Zorn“ und „Wut“ wählen
  rationale: Der hebräische Text verwendet mit אַף und חֵמָה zwei verwandte, aber verschiedene Begriffe. Die differenzierte Wiedergabe erhält die poetische Steigerung, ohne daraus eine besondere dogmatische Unterscheidung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und die beiden unterschiedlichen Zornbegriffe des Hebräischen bleiben erhalten; die lexikalische Mehrdeutigkeit der Verben wird in Fußnoten dokumentiert.
