  text: תָּשֵׁ֣ב אֱ֭נוֹשׁ עַד דַּכָּ֑א וַ֝/תֹּ֗אמֶר שׁ֣וּבוּ בְנֵי אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/003.yaml
  text: You return man to dust[a], and say, “Return[b], sons of man.”
translation:
  language: de
  text: 'Du lässt den Menschen zum Staub zurückkehren[a] und sprichst: »Kehrt zurück, ihr Menschenkinder!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »bis zum Zermalmten« oder »bis zum Zermalmtsein«; das hebräische Wort bezeichnet etwas Zermalmtes oder zu Pulver Zerriebenes.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Söhne des Menschen«; der Ausdruck bezeichnet Menschen und kann möglicherweise an Adam anklingen.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשֵׁב
  choice: du lässt … zurückkehren
  rationale: 'Der Hifil von שוב ist kausativ: Gott bewirkt die Rückkehr. Die Formulierung ist im Deutschen natürlich und bewahrt zugleich die Wortverbindung zum Imperativ שׁוּבוּ.'
- source_word: אֱנוֹשׁ
  choice: den Menschen
  rationale: אֱנוֹשׁ bezeichnet den Menschen besonders in seiner Hinfälligkeit und Sterblichkeit. Der deutsche Singular kann wie im Hebräischen kollektiv verstanden werden.
- source_word: עַד דַּכָּא
  choice: zum Staub
  rationale: דַּכָּא bezeichnet etwas Zermalmtes oder einen Zustand des Zermalmtseins. Im Zusammenhang menschlicher Vergänglichkeit gibt »Staub« den konkreten Sinn natürlich wieder; die engere Wortbedeutung wird in der Fußnote erhalten.
- source_word: וַתֹּאמֶר
  choice: und sprichst
  rationale: Das Präsens passt zur allgemeinen, poetischen Aussage und hält die direkte Anrede Gottes fest.
- source_word: שׁוּבוּ
  choice: Kehrt zurück
  rationale: Der pluralische Imperativ von שוב wird direkt wiedergegeben und bewahrt die Wiederholung desselben Verbstamms wie in תָּשֵׁב.
- source_word: בְנֵי אָדָם
  choice: ihr Menschenkinder
  rationale: Die idiomatische deutsche Sammelbezeichnung gibt die gesamte Menschheit wieder und bewahrt mit »Menschen-« den Bezug zu אָדָם, ohne die Wendung unnötig als Eigennamen »Adam« festzulegen.
theological_decisions:
- issue: Ziel der von Gott bewirkten Rückkehr
  choice: zum Staub
  alternative: bis zum Zermalmtsein / in den zermalmten Zustand
  rationale: Der Kontext spricht von menschlicher Sterblichkeit. »Staub« macht diesen Sinn verständlich, während die Fußnote die genuine lexikalische Breite von דַּכָּא offenhält.
- issue: Wiedergabe von בְנֵי אָדָם
  choice: Menschenkinder
  alternative: Söhne Adams / Menschen
  rationale: אָדָם kann hier »Mensch/Menschheit« oder mit Anklang an Adam verstanden werden. »Menschenkinder« ist würdig und inklusiv im generischen Sinn; eine Fußnote bewahrt die wörtliche Form und den möglichen Adam-Anklang.
translation_notes:
  register: Moderne, würdige Psalmsprache. Die parallele Wiederholung von »zurückkehren« bildet das hebräische Wortspiel ab. »Menschenkinder« ist verständlich und poetisch, ohne altertümlich zu wirken.
