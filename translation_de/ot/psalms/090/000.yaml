  text: תְּפִלָּה֮ לְ/מֹשֶׁ֪ה אִֽישׁ הָ/אֱלֹ֫הִ֥ים אֲֽדֹנָ֗/י מָע֣וֹן אַ֭תָּה הָיִ֥יתָ לָּ֗/נוּ בְּ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/000.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: de
  text: 'Ein Gebet von Mose[a], dem Mann Gottes.


    Herr, du bist für uns eine Wohnstätte[b] gewesen von Generation zu Generation.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für Mose“ beziehungsweise „Mose zugeordnet“. Die hebräische Präposition kann Verfasserschaft, Zuordnung oder Widmung ausdrücken.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Wohnort“ oder „Zuflucht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Gebet
  rationale: Die übliche und kontextgerechte Wiedergabe des hebräischen Wortes für ein Gebet.
- source_word: מָעוֹן
  choice: Wohnstätte
  rationale: Bewahrt das konkrete Bild eines Ortes, an dem man wohnt und geborgen ist, ohne es vorschnell auf die übertragene Bedeutung „Zuflucht“ festzulegen.
- source_word: בְּדֹר וָדֹר
  choice: von Generation zu Generation
  rationale: Eine natürliche moderne Wiedergabe der idiomatischen Aussage über alle aufeinanderfolgenden Generationen hinweg.
theological_decisions:
- issue: Bedeutung der Präposition לְ in לְמֹשֶׁה
  choice: von Mose
  alternative: für Mose / Mose zugeordnet
  rationale: „Von Mose“ gibt die naheliegende Zuordnung beziehungsweise Verfasserschaft wieder; die Präposition lässt jedoch auch Widmung oder allgemeine Zuordnung zu, was die Fußnote offenhält.
- issue: Metaphorische Bedeutung von מָעוֹן für Gott
  choice: Wohnstätte
  alternative: Zuflucht
  rationale: Die konkrete Metapher wird erhalten, statt ausschließlich ihre mögliche Schutzbedeutung auszudrücken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Überschrift bleibt knapp; „Wohnstätte“ bewahrt das hebräische Bild, während die Fußnote gebräuchlichere Bedeutungsnuancen nennt.
