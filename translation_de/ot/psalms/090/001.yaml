source:
  edition: WLC
  text: תְּפִלָּה֮ לְ/מֹשֶׁ֪ה אִֽישׁ הָ/אֱלֹ֫הִ֥ים אֲֽדֹנָ֗/י מָע֣וֹן אַ֭תָּה הָיִ֥יתָ לָּ֗/נוּ בְּ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/001.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: de
  text: 'Ein Gebet des Mose[a], des Mannes Gottes.


    Herr, du bist uns von Generation zu Generation eine Wohnstätte gewesen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „von Mose“, „für Mose“ oder „Mose zugeordnet“; die hebräische Präposition kann in der Überschrift Urheberschaft, Zuordnung oder Widmung bezeichnen.
    reason: alternative_reading
  - marker: b
    text: Für „Wohnstätte“ auch „Wohnort“; sinngemäß ist auch „Zuflucht“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Ein Gebet
  rationale: Als Gattungsangabe der Überschrift ist „Ein Gebet“ im Deutschen klar und idiomatisch.
- source_word: לְמֹשֶׁה
  choice: von Mose
  rationale: „Von Mose“ ist eine natürliche deutsche Überschrift und lässt eher als „verfasst von Mose“ offen, ob die Präposition Urheberschaft, Zuordnung oder Widmung bezeichnet; die verbleibende Mehrdeutigkeit wird in Fußnote [a] ausgewiesen.
- source_word: אִישׁ הָאֱלֹהִים
  choice: dem Mann Gottes
  rationale: Der bestimmte Ausdruck bezeichnet Mose mit dem anerkannten Titel „Mann Gottes“; der Dativ entspricht der Apposition zu „Mose“.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: אֲדֹנָי ist hier die feststehende Gottesbezeichnung in direkter Anrede. „Herr“ ist die natürliche und traditionsgemäße deutsche Wiedergabe, ohne die formal enthaltene Singularendung als „mein“ zu überdeuten.
- source_word: מָעוֹן
  choice: Wohnstätte
  rationale: „Wohnstätte“ bewahrt das räumliche Bild eines dauerhaften Wohn- und Aufenthaltsortes. „Zuflucht“ würde die Schutzfunktion stärker auslegen, als das Substantiv selbst verlangt.
- source_word: הָיִיתָ לָּנוּ
  choice: du bist uns … gewesen
  rationale: Das deutsche Perfekt gibt die bis zur Gegenwart reichende Beziehung angemessen wieder; „uns“ bildet die hebräische ל-Präpositionalphrase knapp und idiomatisch ab.
- source_word: בְּדֹר וָדֹר
  choice: von Generation zu Generation
  rationale: Diese geläufige deutsche Wendung gibt die fortlaufende Abfolge der Generationen wieder.
theological_decisions:
- issue: Bedeutung von לְמֹשֶׁה in der Psalmüberschrift
  choice: „von Mose“ mit erklärender Fußnote
  alternative: „für Mose“ oder ausdrücklich „verfasst von Mose“
  rationale: Die hebräische Präposition kann Urheberschaft, Zuordnung oder Widmung ausdrücken. Der Haupttext bleibt knapp, während Fußnote [a] verhindert, dass eine bestimmte historische Deutung als einzig mögliche festgeschrieben wird.
- issue: Bildgehalt von מָעוֹן
  choice: „Wohnstätte“
  alternative: „Zuflucht“ oder „Wohnort“
  rationale: Die Übersetzung hält am Wohnbild fest und macht die darin mögliche Schutzdimension nicht zur alleinigen Bedeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Psalmüberschrift wird vom Gebetstext abgesetzt. „Wohnstätte“ wahrt das konkrete Bild und klingt gehoben, bleibt aber allgemein verständlich; die wiederholte Formulierung „von Generation zu Generation“ erhält den poetischen Charakter.
