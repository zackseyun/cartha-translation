  text: Teach us to number our days[a], that we may gain a heart of wisdom.
translation:
  language: de
  text: Lehre uns, unsere Tage so zu zählen[a], dass wir ein weises Herz gewinnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder näher am Hebräischen: „Lehre uns, unsere Tage so zu zählen, und wir werden ein Herz der Weisheit bringen.“ Der hebräische Schluss ist schwierig; viele verstehen ihn im Sinn von: „dass wir ein weises Herz gewinnen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: לִמְנוֹת
  choice: zu zählen
  rationale: Der Infinitiv von מנה bezeichnet das Zählen oder Abzählen. „Zählen“ bewahrt das konkrete Bild und klingt im modernen Deutschen natürlich.
- source_word: יָמֵינוּ
  choice: unsere Tage
  rationale: Die Wendung bezeichnet wörtlich „unsere Tage“ und verweist im Zusammenhang auf die begrenzte menschliche Lebenszeit.
- source_word: כֵּן
  choice: nicht gesondert wiedergegeben
  rationale: כֵּן bedeutet „so/auf diese Weise“. Im knappen deutschen Satz ist sein Bezug unsicher; eine ausdrückliche Wiedergabe als „richtig“ würde die Bedeutung stärker festlegen, als der hebräische Text erlaubt. Die Alternative wird in der Fußnote bewahrt.
- source_word: הוֹדַע
  choice: Lehre uns
  rationale: Der Hifil-Imperativ von ידע bedeutet wörtlich „lass erkennen/mach bekannt“. Im Gebetskontext gibt „Lehre uns“ die Bitte um von Gott geschenkte Einsicht idiomatisch und prägnant wieder.
- source_word: וְנָבִא
  choice: damit wir … gewinnen
  rationale: Die Form von בוא bedeutet grundsätzlich „bringen/kommen lassen“, doch die syntaktisch schwierige Wendung wird im Zusammenhang häufig idiomatisch als Erlangen verstanden. „Gewinnen“ ergibt einen klaren deutschen Sinn, während die wörtlichere Möglichkeit in der Fußnote genannt wird.
- source_word: לְבַב חָכְמָה
  choice: ein weises Herz
  rationale: Wörtlich steht „ein Herz der Weisheit“. „Ein weises Herz“ ist im Deutschen natürlicher und bewahrt „Herz“ als Bezeichnung des inneren Menschen, seines Denkens und Wollens.
theological_decisions:
- issue: Deutung des zweiten Halbverses als Zweck- oder Folgesatz
  choice: Die Bitte zielt darauf, angesichts der begrenzten Lebenszeit ein weises Herz zu gewinnen.
  alternative: 'Wörtlicher lässt sich lesen: „Lehre uns, unsere Tage so zu zählen, und wir werden ein Herz der Weisheit bringen.“'
  rationale: Der hebräische Schluss ist syntaktisch gedrängt und mehrdeutig. Die Hauptfassung entspricht dem Zusammenhang des Psalms und verständlichem Deutsch; die Fußnote erhält die formnähere Lesart und damit die Spannung des Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in knapper Gebetssprache. Die vertraute Bildsprache vom Zählen der Tage und vom weisen Herzen bleibt erhalten; die schwierige hebräische Syntax wird nicht verdeckt, sondern in der Fußnote ausgewiesen.
