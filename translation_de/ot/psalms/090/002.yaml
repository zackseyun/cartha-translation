id: PSA.90.2
reference: Psalms 90:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/טֶ֤רֶם הָ֘רִ֤ים יֻלָּ֗דוּ וַ/תְּח֣וֹלֵֽל אֶ֣רֶץ וְ/תֵבֵ֑ל וּֽ/מֵ/עוֹלָ֥ם עַד ע֝וֹלָ֗ם אַתָּ֥ה אֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/002.yaml
  text: Before the mountains were born[a], and you brought forth the earth and the world, from everlasting to everlasting you are God.
translation:
  language: de
  text: 'Noch ehe die Berge geboren wurden

    und du die Erde und die Welt hervorbrachtest[a],

    von Ewigkeit zu Ewigkeit bist du Gott.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und du die Erde und die Welt gebarst“; das hebräische Verb enthält das Bild von Wehen und Geburt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Noch ehe
  rationale: Leitet einen Zeitpunkt vor der Schöpfung ein; „noch ehe“ gibt die zeitliche Priorität natürlich und poetisch wieder.
- source_word: הָרִים
  choice: die Berge
  rationale: Bewahrt den bestimmten Plural und das Bild der urzeitlichen Berge.
- source_word: יֻלָּדוּ
  choice: geboren wurden
  rationale: Das Passiv von ילד bezeichnet das Geborenwerden und erhält das Geburtsbild des Hebräischen.
- source_word: וַתְּחוֹלֵל
  choice: und du … hervorbrachtest
  rationale: Das Verb trägt hier Geburts- beziehungsweise Wehenbildlichkeit. „Hervorbrachtest“ klingt im Deutschen natürlich und bewahrt den Gedanken des Hervorgehens, ohne ihn zum allgemeinen „schufst“ zu verflachen.
- source_word: אֶרֶץ
  choice: die Erde
  rationale: Im kosmischen Parallelismus mit תבל ist „Erde“ angemessener als das örtlich begrenzte „Land“.
- source_word: וְתֵבֵל
  choice: und die Welt
  rationale: תבל bezeichnet die Welt, besonders als bewohnten oder geordneten Lebensraum; „Welt“ ist knapp und allgemein verständlich.
- source_word: וּמֵעוֹלָם עַד עוֹלָם
  choice: von Ewigkeit zu Ewigkeit
  rationale: Die feste deutsche Wendung gibt die nach beiden Richtungen unbegrenzte Dauer des hebräischen Ausdrucks wieder.
- source_word: אַתָּה
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen bleibt zur Hervorhebung erhalten.
- source_word: אֵל
  choice: Gott
  rationale: אֵל dient hier als Gottesbezeichnung; „Gott“ ist die klare und kontextgerechte Wiedergabe.
theological_decisions:
- issue: Anthropomorphe Geburtsbilder für die Schöpfung
  choice: Das Geburtsbild bleibt bei den Bergen ausdrücklich und beim Hervorbringen von Erde und Welt erkennbar.
  alternative: Die Bildsprache zu „geschaffen“ oder „gemacht“ verallgemeinern.
  rationale: Der hebräische Text schildert den Ursprung der Schöpfung mit Geburts- und Wehenwortschatz. Diese Poesie wird bewahrt, ohne daraus Aussagen über die Art des Schöpfungsvorgangs abzuleiten.
- issue: Gottes Ewigkeit
  choice: von Ewigkeit zu Ewigkeit bist du Gott
  alternative: von Zeitalter zu Zeitalter bist du Gott
  rationale: Die gewählte Formulierung erhält den hebräischen Dauer-Ausdruck und Gottes Bestehen vor und über die Schöpfung hinaus, ohne ihn philosophisch weiter auszudeuten.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrtem poetischem Parallelismus. „Noch ehe“ und „von Ewigkeit zu Ewigkeit“ geben dem Vers einen gehobenen, aber allgemein verständlichen Klang; die Geburtsmetaphorik bleibt sichtbar.
