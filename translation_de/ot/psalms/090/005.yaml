source:
  edition: WLC
  text: זְ֭רַמְתָּ/ם שֵׁנָ֣ה יִהְי֑וּ בַּ֝/בֹּ֗קֶר כֶּ/חָצִ֥יר יַחֲלֹֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/005.yaml
  text: You sweep them away[a]; they are like a dream[c][b]. In the morning they are like grass that sprouts anew.
translation:
  language: de
  text: Du reißt sie fort; sie sind wie ein Traum.[a] Am Morgen sind sie wie Gras, das neu sprießt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „sie sind wie Schlaf“.'
    reason: Der hebräische Ausdruck ist stark verdichtet; שֵׁנָה bedeutet unmittelbar „Schlaf“, kann hier aber das flüchtige Erleben eines Traums aufrufen.
  - marker: b
    text: 'Oder: „Am Morgen vergeht es wie Gras.“ Das Hebräische ist stark verdichtet; das letzte Verb steht im Singular und bezieht sich formal auf „Gras“.'
    reason: חלף kann je nach Zusammenhang Erneuerung bzw. Hervorkommen oder Vorübergehen bezeichnen. Der folgende Vers stützt hier „neu sprießen“, doch die alternative Deutung soll erhalten bleiben.
lexical_decisions:
- source_word: זְרַמְתָּם
  choice: Du reißt sie mit dir fort
  rationale: Das Verb זָרַם bezeichnet hier ein Forttragen durch eine reißende Strömung. Die Formulierung ist im Deutschen natürlich, bewahrt die Dynamik des Bildes und legt sich nicht ausdrücklich auf eine Überschwemmung fest.
- source_word: שֵׁנָה
  choice: wie ein Traum
  rationale: Das Substantiv bedeutet wörtlich „Schlaf“. Im stark verdichteten poetischen Zusammenhang vermittelt „wie ein Traum“ die Flüchtigkeit des Bildes idiomatisch; die wörtlichere Möglichkeit wird in der Fußnote erhalten.
- source_word: יִהְיוּ
  choice: sie sind
  rationale: Der Imperfekt kann in poetischer, allgemeingültiger Aussage präsentisch wiedergegeben werden. „Sie sind“ führt zudem den pluralischen Bezug auf die Menschen fort.
- source_word: בַּבֹּקֶר
  choice: Am Morgen
  rationale: Die übliche deutsche Zeitangabe gibt den hebräischen Ausdruck knapp und genau wieder.
- source_word: כֶּחָצִיר
  choice: wie Gras
  rationale: חָצִיר bezeichnet Gras oder grünen Bewuchs; „Gras“ ist klar und trägt das Bild menschlicher Vergänglichkeit natürlich.
- source_word: יַחֲלֹף
  choice: das neu sprießt
  rationale: Im Zusammenhang mit Vers 6 bezeichnet חלף hier wahrscheinlich das Erneuern bzw. frische Hervorkommen des Grases. Die singularische Verbform wird im Relativsatz passend auf „Gras“ bezogen; „vergeht“ bleibt als lexikalisch mögliche Lesart in der Fußnote sichtbar.
theological_decisions: []
