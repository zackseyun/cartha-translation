  text: יְמֵֽי שְׁנוֹתֵ֨י/נוּ בָ/הֶ֥ם שִׁבְעִ֪ים שָׁנָ֡ה וְ/אִ֤ם בִּ/גְבוּרֹ֨ת שְׁמ֘וֹנִ֤ים שָׁנָ֗ה וְ֭/רָהְבָּ/ם עָמָ֣ל וָ/אָ֑וֶן כִּי גָ֥ז חִ֝֗ישׁ וַ/נָּעֻֽפָ/ה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/010.yaml
  text: The days of our years are seventy years[a], or if by strength, eighty years; yet their pride is toil and trouble, for it is soon gone[b], and we fly away.
translation:
  language: de
  text: Die Tage unserer Jahre betragen siebzig Jahre oder, wenn wir bei Kräften sind, achtzig Jahre; doch ihr Stolz[a] ist Mühsal und Leid. Denn rasch ist es vorüber[b], und wir fliegen davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „doch ihr Bestes ist Mühsal und Leid“. Das hebräische Wort kann auch das Eindrucksvollste oder Stärkste an diesen Jahren bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn schnell vergeht es“ oder „denn schnell wird es abgeschnitten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמֵי שְׁנוֹתֵינוּ
  choice: Die Tage unserer Jahre
  rationale: Die Wiedergabe bewahrt die hebräische Wendung und ihren poetischen Klang, ohne im Deutschen unverständlich zu werden.
- source_word: בָהֶם שִׁבְעִים שָׁנָה
  choice: zählen siebzig Jahre
  rationale: Das pronominale בָהֶם bezeichnet hier idiomatisch den Gesamtumfang der Lebenszeit; „zählen“ ergibt dafür eine natürliche deutsche Aussage.
- source_word: וְאִם בִּגְבוּרֹת
  choice: und wenn wir bei Kräften sind
  rationale: Die Formulierung bewahrt die Bedingung und versteht גְּבוּרוֹת als besondere körperliche Kraft, durch die ein höheres Alter erreicht wird.
- source_word: וְרָהְבָּם
  choice: doch ihr Stolz
  rationale: רַהַב kann Stolz, das Eindrucksvolle oder dasjenige bezeichnen, dessen man sich rühmt. „Ihr Stolz“ wahrt die Bildkraft und die ironische Spannung; die sachlichere Alternative wird in der Fußnote genannt.
- source_word: עָמָל וָאָוֶן
  choice: Mühsal und Leid
  rationale: Im Zusammenhang der menschlichen Lebenszeit bezeichnen die Wörter beschwerliche Arbeit und erfahrene Not, nicht vorrangig moralische Bosheit.
- source_word: כִּי גָז חִישׁ
  choice: Denn rasch ist es vorüber
  rationale: גָּז kann ein schnelles Vergehen oder Abgeschnittenwerden ausdrücken. Die Übersetzung wahrt die Aussage von der Kürze, ohne die mögliche Nuance künstlich festzulegen.
- source_word: וַנָּעֻפָה
  choice: und wir fliegen davon
  rationale: Die konkrete Flugbewegung des Verbs bleibt als eindrückliches poetisches Bild erhalten.
