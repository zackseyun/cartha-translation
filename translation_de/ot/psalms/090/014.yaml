  text: שַׂבְּעֵ֣/נוּ בַ/בֹּ֣קֶר חַסְדֶּ֑/ךָ וּֽ/נְרַנְּנָ֥ה וְ֝/נִשְׂמְחָ֗ה בְּ/כָל יָמֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/014.yaml
  text: Satisfy us in the morning with your steadfast love[a], and we will sing for joy and be glad all our days.
translation:
  language: de
  text: Sättige uns am Morgen mit deiner beständigen Liebe[a], dann werden wir jubeln und uns freuen alle unsere Tage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deiner treuen Liebe“, „deiner Güte“ oder „deinem Erbarmen“. Das hebräische Wort חֶסֶד bezeichnet beständige, verlässliche Liebe und Güte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂבְּעֵנוּ
  choice: Sättige uns
  rationale: Der Piel-Imperativ mit Suffix der 1. Person Plural bittet darum, ganz erfüllt beziehungsweise satt gemacht zu werden. „Sättige uns“ bewahrt das Bild der überreichen Erfüllung und ist im Deutschen natürlich.
- source_word: בַבֹּקֶר
  choice: am Morgen
  rationale: Die Wendung bezeichnet wörtlich den Morgen. „Am Morgen“ erhält den zeitlichen Sinn, ohne unbelegt „jeden Morgen“ oder „bis zum Morgen“ daraus zu machen.
- source_word: חַסְדֶּךָ
  choice: mit deiner beständigen Liebe
  rationale: חֶסֶד umfasst treue, dauerhafte Liebe und Güte, häufig im Rahmen einer verbindlichen Beziehung. „Beständige Liebe“ gibt Dauer und Zuwendung wieder, ohne den Ausdruck auf bloßes Erbarmen zu verengen.
- source_word: וּנְרַנְּנָה
  choice: dann werden wir jubeln
  rationale: רנן bezeichnet einen hörbaren Freudenruf oder jubelnden Gesang. Die Kohortativform nach der Bitte lässt sich natürlich als erhoffte Folge ausdrücken; „jubeln“ bewahrt die lautstarke Freude.
- source_word: וְנִשְׂמְחָה
  choice: und uns freuen
  rationale: שמח bedeutet sich freuen oder froh sein. Die Wiedergabe erhält die Parallelität mit dem vorausgehenden Jubeln, ohne beide Verben gleichzusetzen.
- source_word: בְּכָל יָמֵינוּ
  choice: alle unsere Tage
  rationale: Die Zeitangabe umfasst die Gesamtheit der Lebenstage. Die knappe Formulierung ist idiomatisch und lässt den umfassenden Sinn bestehen.
theological_decisions:
- issue: Wiedergabe von חֶסֶד in der Bitte um Gottes Zuwendung
  choice: deine beständige Liebe
  alternative: deine Bundestreue; deine Güte; dein Erbarmen
  rationale: Der Ausdruck verbindet liebevolle Güte mit Verlässlichkeit und Dauer. „Beständige Liebe“ bewahrt diese Breite, ohne den Bundesaspekt ausdrücklich festzuschreiben oder die Bedeutung auf Erbarmen zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gebetssprache bleibt knapp und bildhaft; die beiden hebräischen Freudenverben werden durch „jubeln“ und „uns freuen“ unterschieden.
