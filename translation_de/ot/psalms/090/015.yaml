  text: שַׂ֭מְּחֵ/נוּ כִּ/ימ֣וֹת עִנִּיתָ֑/נוּ שְׁ֝נ֗וֹת רָאִ֥ינוּ רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/015.yaml
  text: Make us glad for as many days as you have afflicted us[a], for as many years as we have seen trouble.
translation:
  language: de
  text: Mach uns froh für so viele Tage, wie du uns bedrängt hast, für so viele Jahre, wie wir Unheil gesehen haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Unglück« beziehungsweise »Not«. Das hebräische Wort kann je nach Zusammenhang Böses, Unheil oder widerfahrenes Unglück bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְּחֵנוּ
  choice: Mach uns froh
  rationale: Der Piel-Imperativ mit Suffix der 1. Person Plural ist eine Bitte mit bewirkendem Sinn. »Mach uns froh« ist gegenwärtiges, natürliches Deutsch und bewahrt den unmittelbaren Gebetscharakter.
- source_word: כִּימוֹת
  choice: für so viele Tage, wie
  rationale: 'כְּ bezeichnet hier eine Entsprechung beziehungsweise ein gleiches Maß: Die erbetene Freude soll der Zeit des Leidens entsprechen. Die gewählte Formulierung gibt dieses proportionale Verhältnis im Deutschen klar wieder.'
- source_word: עִנִּיתָנוּ
  choice: du uns gebeugt hast
  rationale: ענה im Piel kann »beugen«, »demütigen« oder »in Not bringen« bedeuten. »Gebeugt« wahrt die Weite des Ausdrucks und vermeidet eine unnötige Festlegung auf menschliche Unterdrückung.
- source_word: שְׁנוֹת
  choice: für so viele Jahre
  rationale: Der Konstruktplural steht parallel zu »Tage«. Die Wiederholung von »für so viele« bildet den Parallelismus und das gleiche zeitliche Maß verständlich ab.
- source_word: רָאִינוּ
  choice: wir … gesehen haben
  rationale: Die direkte Wiedergabe von ראה erhält das konkrete hebräische Bild; »erlebt haben« wäre zwar idiomatischer, aber bereits stärker auslegend.
- source_word: רָעָה
  choice: Unheil
  rationale: רָעָה kann je nach Zusammenhang moralisch Böses oder widerfahrenes Unglück und Unheil bezeichnen. Hier weist der Parallelismus mit dem Gebeugtwerden auf erfahrene Not, ohne den Ausdruck zu verharmlosen.
theological_decisions:
- issue: Bedeutung von רָעָה im Verhältnis zu Gottes Handeln
  choice: Als erfahrenes »Unheil« wiedergegeben
  alternative: Böses; Unglück; Not
  rationale: Der Vers stellt die erfahrene Leidenszeit der erbetenen Freudenzeit gegenüber. »Unheil« bezeichnet hier das widerfahrene Schwere, ohne den Betenden moralische Bosheit zuzuschreiben oder die Spannung der Klage über Gottes Beugen aufzulösen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die parallele Satzform und das proportionale Verhältnis von Tagen und Jahren bleiben erhalten; die deutliche Zuschreibung »du uns gebeugt hast« wird nicht abgeschwächt.
