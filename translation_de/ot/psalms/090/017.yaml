base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/017.yaml
  text: May the favor of the Lord our God be upon us[a], and establish the work of our hands upon us; yes[c][b], establish the work of our hands.
translation:
  language: de
  text: Die Gunst des Herrn, unseres Gottes, sei über uns[a]! Festige für uns das Werk unserer Hände[b]; ja, das Werk unserer Hände, festige es[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Schönheit“, „Anmut“ oder „Lieblichkeit des Herrn, unseres Gottes, sei über uns.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Festige das Werk unserer Hände über uns.“ Das zweite „über uns“ kann hier den Sinn „für uns“ beziehungsweise „zu unseren Gunsten“ haben.'
    reason: source_ambiguity
  - marker: c
    text: 'Im Hebräischen wird die Bitte zur Betonung wiederholt; beim zweiten Mal steht wörtlich: „Und das Werk unserer Hände – festige es!“'
    reason: literary_emphasis
lexical_decisions:
- source_word: וִיהִי
  choice: sei
  rationale: Die Jussivform von היה drückt hier einen Wunsch oder eine Bitte aus. Der deutsche Konjunktiv „sei“ gibt diese Gebetssprache knapp und würdig wieder.
- source_word: נֹעַם
  choice: Gunst
  rationale: Das Substantiv kann Angenehmheit, Schönheit, Wohlwollen oder Gunst bezeichnen. Im Zusammenhang der Bitte um Gottes Segen für menschliche Arbeit bringt „Gunst“ den relationalen Sinn am natürlichsten zum Ausdruck, ohne die weiteren Bedeutungsnuancen zu verschweigen.
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  choice: des Herrn, unseres Gottes
  rationale: Die Verbindung der Gottesbezeichnungen wird formal und in geläufiger deutscher Gebetssprache wiedergegeben.
- source_word: עָלֵינוּ
  choice: über uns / für uns
  rationale: Beim ersten Vorkommen bezeichnet עַל anschaulich Gottes Gunst, die über dem Volk ruht. Beim zweiten Vorkommen ist im Zusammenhang mit der Festigung des Werkes ein benefaktiver Sinn („für uns“) im Deutschen verständlicher; die formale Alternative wird in einer Fußnote bewahrt.
- source_word: מַעֲשֵׂה יָדֵינוּ
  choice: das Werk unserer Hände
  rationale: Die konkrete hebräische Wendung für menschliche Arbeit und menschliches Tun ist auch im Deutschen verständlich und poetisch.
- source_word: כּוֹנְנָה / כּוֹנְנֵהוּ
  choice: lass ... Bestand haben
  rationale: כון bezeichnet hier das Festigen, Sichern oder dauerhafte Bestehenlassen. „Bestand haben“ gibt die erbetene Dauerhaftigkeit natürlich wieder, ohne den engeren Gedanken wirtschaftlichen Erfolgs einzutragen.
theological_decisions:
- issue: Art der erbetenen göttlichen Zuwendung
  choice: Gunst
  alternative: Schönheit, Freundlichkeit oder Lieblichkeit
  rationale: Der Kontext legt Gottes wohlwollende Zuwendung nahe, doch der weitere Bedeutungsraum von נֹעַם bleibt in der Fußnote sichtbar.
- issue: Wirkung Gottes auf menschliche Arbeit
  choice: Gott soll dem Werk Bestand verleihen
  alternative: Gott soll das Werk gelingen lassen oder wohlhabend machen
  rationale: Der Stamm כון betont Festigkeit und Dauer. Eine Wiedergabe als bloßer Erfolg oder Wohlstand wäre stärker interpretierend als der hebräische Text.
translation_notes:
  register: Moderne, würdige Gebetssprache mit bewahrtem Parallelismus. „Werk unserer Hände“ erhält das konkrete poetische Bild. Die Wiederholung des Schlussgebets bleibt ausdrücklich stehen; Ausrufezeichen markieren den bittenden, nicht bloß feststellenden Charakter.
