  text: שׁוּבָ֣/ה יְ֭הוָה עַד מָתָ֑י וְ֝/הִנָּחֵ֗ם עַל עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/013.yaml
  text: Return[a], O Yahweh—how long? And have compassion on your servants.
translation:
  language: de
  text: 'Kehre zurück, Jahwe – wie lange noch? Hab Erbarmen[a] mit deinen Dienern!


    [a] Oder: »Ändere deine Haltung gegenüber deinen Dienern.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ändere deine Haltung gegenüber deinen Dienern.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבָה
  choice: Kehre zurück
  rationale: Der Imperativ von שׁוב behält so seine unmittelbare räumliche beziehungsweise relationale Aussage in der Klagesprache. Eine Wiedergabe mit »lass ab« würde bereits die Bedeutung des folgenden Verbs eintragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »HERR« ersetzt.
- source_word: עַד מָתָי
  choice: wie lange noch?
  rationale: Dies ist die natürliche deutsche Form der dringlichen hebräischen Klagefrage; »noch« bringt ihren im Kontext vorausgesetzten Zeitdruck idiomatisch zum Ausdruck.
- source_word: וְהִנָּחֵם
  choice: Hab Erbarmen
  rationale: Der Niphal-Imperativ von נחם kann ein Sich-erbarmen, Sich-umstimmen-Lassen oder Ablassen bezeichnen. »Hab Erbarmen« gibt hier die Zuwendung zu den Dienern natürlich wieder, ohne Gott moralische Schuld zuzuschreiben.
- source_word: עַל
  choice: mit
  rationale: In Verbindung mit »Erbarmen haben« wird die durch עַל bezeichnete Beziehung im Deutschen idiomatisch mit »mit« ausgedrückt. In der alternativen Wiedergabe erscheint sie als »um … willen«.
- source_word: עֲבָדֶיךָ
  choice: deinen Dienern
  rationale: עבד kann Sklaven oder Diener bezeichnen. In dieser Gebetsanrede ist »Diener« die natürliche, kontextgerechte Bezeichnung für Menschen, die Jahwe angehören und ihm dienen.
theological_decisions:
- issue: Wiedergabe von נחם in einer Aussage über Gott
  choice: Hab Erbarmen mit deinen Dienern
  alternative: Lass dich um deiner Diener willen umstimmen
  rationale: Der Haupttext bewahrt die affektive Dimension des hebräischen Verbs, während die Fußnote dessen mögliche Nuance einer Kursänderung ausdrücklich erhält. »Bereue« wird vermieden, weil es im heutigen Deutsch leicht eine moralische Verfehlung Gottes voraussetzen würde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappen Imperative und die Klagefrage bleiben erhalten; der Gedankenstrich bildet die Dringlichkeit des hebräischen Gebets ab.
