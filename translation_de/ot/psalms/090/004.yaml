revisions:
- from: Denn tausend Jahre sind in deinen Augen wie der gestrige Tag, wenn er vergangen ist,[a] und wie eine Nachtwache.[b]
  to: Denn tausend Jahre sind in deinen Augen wie der gestrige Tag, wenn er vergangen ist,[a] und wie eine Wache in der Nacht.[b]
  rationale: Die Revision übernimmt die explizite hebräische Angabe „in der Nacht“ in den Haupttext und schärft die Erläuterung des historischen Begriffs „Wache“. Der Sinn, die poetische Koordination mit „und“ und die bewusst nicht weiter ausgelegte Gottesrede bleiben unverändert.
