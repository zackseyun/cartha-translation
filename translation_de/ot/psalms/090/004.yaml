source:
  edition: WLC
  text: כִּ֤י אֶ֪לֶף שָׁנִ֡ים בְּֽ/עֵינֶ֗י/ךָ כְּ/י֣וֹם אֶ֭תְמוֹל כִּ֣י יַעֲבֹ֑ר וְ/אַשְׁמוּרָ֥ה בַ/לָּֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/004.yaml
  text: For a thousand years in your sight are like yesterday when it is past[c][b][a], or like a watch in the night.
translation:
  language: de
  text: Denn tausend Jahre sind in deinen Augen wie der gestrige Tag, wenn er vergangen ist,[a] und wie eine Wache in der Nacht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn er vorüberzieht“. Die hebräische Formulierung kann auch den Vorgang des Vorübergehens hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: Eine Wache war ein Abschnitt der Nacht, der für den Wachdienst eingeteilt war.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet bzw. erläutert die vorausgehende Aussage und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: אֶלֶף שָׁנִים
  choice: tausend Jahre
  rationale: Die direkte Zahlenangabe bewahrt den poetischen Gegensatz zwischen menschlichem und göttlichem Zeiterleben.
- source_word: בְּעֵינֶיךָ
  choice: in deinen Augen
  rationale: Die hebräische Metapher für Gottes Perspektive bleibt erhalten und ist auch im modernen Deutschen verständlich.
- source_word: כְּיוֹם אֶתְמוֹל
  choice: wie der gestrige Tag
  rationale: Diese Wiedergabe ist natürlich und bildet יוֹם ausdrücklich ab, ohne die Wendung unnötig zu verflachen.
- source_word: כִּי יַעֲבֹר
  choice: wenn er vergangen ist
  rationale: Der Nebensatz beschreibt den gestrigen Tag als bereits vorüber; das Perfekt entspricht dem deutschen Zeitempfinden, während die mögliche Nuance „wenn er vorüberzieht“ in der Fußnote gewahrt wird.
- source_word: וְאַשְׁמוּרָה
  choice: und wie eine Nachtwache
  rationale: Das waw verbindet ein zweites Vergleichsbild. „Und wie“ hält die hebräische Koordination aufrecht; „Nachtwache“ macht die kulturell gemeinte Zeiteinteilung verständlich.
- source_word: בַלָּיְלָה
  choice: Nachtwache
  rationale: Die Angabe „in der Nacht“ wird idiomatisch mit אַשְׁמוּרָה zu dem deutschen Kompositum „Nachtwache“ verbunden.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Perspektive auf die Zeit
  choice: „in deinen Augen“ und die beiden zeitlichen Vergleiche ohne philosophische Erweiterung beibehalten
  alternative: „Vor dir sind tausend Jahre wie nichts“ oder eine ausdrückliche Aussage über Gottes Zeitlosigkeit
  rationale: Der Vers stellt Gottes und menschliches Zeiterleben poetisch gegenüber. Er formuliert keine ausgearbeitete Lehre über Zeitlosigkeit; daher wird keine solche Deutung in den Text eingeführt.
- issue: Verhältnis der beiden Vergleichsbilder
  choice: Koordination mit „und wie“
  alternative: Alternative mit „oder wie“
  rationale: Das hebräische וְ bezeichnet zunächst eine additive Verbindung. Beide Bilder dürfen nebeneinander stehen, ohne dass eines als ausschließliche Alternative zum anderen gedeutet wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache „in deinen Augen“ bleibt erhalten. „Der gestrige Tag“ ist etwas formeller als „gestern“, gibt jedoch das hebräische יוֹם ausdrücklich wieder. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
