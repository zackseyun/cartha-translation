  text: In the morning it sprouts and flourishes[c][b][a]; by evening it withers and dries up.
translation:
  language: de
  text: Am Morgen sprießt es[a] und gedeiht[b]; am Abend welkt es[c] und verdorrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „blüht es“. Das hebräische Verb kann sowohl das Sprießen als auch das Blühen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher möglicherweise: „und verändert sich“ oder „und geht vorüber“. Im Pflanzenbild wird das Verb häufig als gedeihendes Wachstum verstanden; die genaue Nuance ist unsicher.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wird es abgemäht“. Das hebräische Verb kann hier entweder das Welken oder das Abschneiden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: Am Morgen
  rationale: Die Präpositionalphrase bezeichnet den Zeitpunkt und bildet den natürlichen deutschen Gegenpol zu „am Abend“.
- source_word: יָצִיץ
  choice: sprießt es
  rationale: Das Verb beschreibt bei Pflanzen das Hervorsprießen und kann auch das Blühen bezeichnen. „sprießt“ passt zum Beginn des kurzen Lebenszyklus des Grases, ohne die mögliche Blütenbedeutung auszuschließen.
- source_word: וְחָלָף
  choice: und wächst frisch heran
  rationale: חלף bedeutet häufig „vorübergehen“ oder „sich verändern“, kann im Zusammenhang mit Pflanzen jedoch das Erneuern beziehungsweise frische Nachwachsen bezeichnen. Die Wiedergabe macht die vegetative Bildsprache verständlich, während eine Fußnote die wörtlichere Möglichkeit bewahrt.
- source_word: לָעֶרֶב
  choice: am Abend
  rationale: Die knappe Zeitangabe wahrt die Parallelität zu „am Morgen“ und den raschen Wechsel innerhalb eines Tages.
- source_word: יְמוֹלֵל
  choice: welkt es
  rationale: Im Pflanzenbild kann das Verb das Welken bezeichnen; möglicherweise ist jedoch ein Abschneiden oder Abmähen gemeint. „welkt“ vermeidet es, einen äußeren Handelnden festzulegen.
- source_word: וְיָבֵשׁ
  choice: und verdorrt
  rationale: „verdorrt“ gibt das Austrocknen einer Pflanze idiomatisch und prägnant wieder.
