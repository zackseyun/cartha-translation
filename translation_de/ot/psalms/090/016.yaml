  verdict: revise
  source_fidelity: 'Der Entwurf gibt die jussivische Bitte und die beiden Bezugsgruppen zutreffend wieder. Die zweite Halbzeile benötigt im Deutschen jedoch ein ausgedrücktes Verb: Das hebräische יֵרָאֶה kann elliptisch mitverstanden werden, während „deine Herrlichkeit über ihren Kindern“ als deutscher Satzteil unvollständig und semantisch unscharf bleibt. „Erscheinen“ gibt das Sichtbarwerden angemessen wieder; „über“ bewahrt die Präposition עַל.'
  naturalness: „Lass dein Wirken für deine Diener sichtbar werden“ ist verständlich, aber „deinen Dienern sichtbar werden“ ist im Deutschen unmittelbarer und natürlicher. Die Wiederaufnahme von „lass ... erscheinen“ in der zweiten Halbzeile schafft einen vollständigen, würdigen und klaren Gebetssatz.
  terminology: „Wirken“ für פעל und „Herrlichkeit“ für הדר sind im Kontext passende, moderne und würdige Wiedergaben. „Kinder“ wahrt den unmittelbaren Bezug von בני-הם, ohne die Aussage auf eine weiter gefasste Nachkommenschaft festzulegen.
  issues:
  - severity: medium
    issue: Die zweite Halbzeile enthält kein im Deutschen tragfähiges Prädikat.
    rationale: Die Konstruktion „und deine Herrlichkeit über ihren Kindern“ lässt offen, was mit der Herrlichkeit geschieht. Das Hebräische erlaubt die elliptische Fortführung des vorherigen Verbs, doch eine deutsche Übersetzung sollte das Verb ergänzen, ohne den Sinn zu verändern.
  - severity: low
    issue: „für deine Diener sichtbar werden“ ist weniger idiomatisch als ein Dativanschluss.
    rationale: אֶל kann hier die Personen bezeichnen, denen Gottes Wirken sichtbar wird. „Deinen Dienern sichtbar werden“ formuliert dies natürlich und wahrt die Aussage.
  revised_text: Lass dein Wirken deinen Dienern sichtbar werden und lass deine Herrlichkeit über ihren Kindern erscheinen.
