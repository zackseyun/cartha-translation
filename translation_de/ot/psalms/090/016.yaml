  text: יֵרָאֶ֣ה אֶל עֲבָדֶ֣י/ךָ פָעֳלֶ֑/ךָ וַ֝/הֲדָרְ/ךָ֗ עַל בְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/016.yaml
  text: Let your work appear to your servants, and your splendor upon their children.
translation:
  language: de
  text: Lass dein Wirken deinen Dienern sichtbar werden und lass deine Herrlichkeit über ihren Kindern erscheinen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָעֳלֶךָ
  choice: dein Wirken
  rationale: Das Singularwort bezeichnet hier Gottes Tun beziehungsweise Werk. „Wirken“ gibt den umfassenden, fortdauernden Sinn im Deutschen natürlicher wieder als „Tat“ und vermeidet die mögliche Verengung von „Werk“ auf ein einzelnes Ergebnis.
- source_word: יֵרָאֶה
  choice: Lass … sichtbar werden
  rationale: Die jussivische Nifal-Form drückt die Bitte aus, Gottes Wirken möge sich zeigen beziehungsweise gesehen werden. Die Formulierung bewahrt sowohl das Sichtbarwerden als auch den Gebetscharakter.
- source_word: הֲדָרְךָ
  choice: deine Herrlichkeit
  rationale: הדר bezeichnet Hoheit, Pracht oder majestätischen Glanz. „Herrlichkeit“ ist im Psalmkontext würdig und verständlich, ohne den Ausdruck auf bloß äußere Schönheit zu beschränken.
- source_word: עַל־בְּנֵיהֶם
  choice: über ihren Kindern
  rationale: Die Präposition עַל wird mit „über“ wiedergegeben; בנים bezeichnet hier die Kinder der Diener. So bleibt das räumlich-bildhafte Gegenstück zu „für deine Diener“ erhalten.
theological_decisions:
- issue: Reichweite der Bitte auf die folgende Generation
  choice: ihren Kindern
  alternative: ihren Nachkommen
  rationale: Der hebräische Ausdruck bedeutet unmittelbar „ihre Söhne/Kinder“. „Kinder“ bewahrt den konkreten Generationenbezug, ohne die mögliche weitere Bedeutung als Nachkommenschaft auszuschließen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die parallele Struktur des hebräischen Verses bleibt erhalten; „über ihren Kindern“ bewahrt bewusst die bildhafte Präposition des Ausgangstextes.
