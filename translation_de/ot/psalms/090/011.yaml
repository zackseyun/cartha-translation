base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/011.yaml
  text: Who knows the power of your anger[a], and your wrath according to the fear due to you?
translation:
  language: de
  text: Wer kennt die Macht deines Zorns und deinen Grimm gemäß der Furcht vor dir[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und dein Grimm entspricht der Furcht vor dir“; oder: „Wie die Furcht vor dir, so dein Grimm.“ Der hebräische Ausdruck ist knapp und kann auf mehr als eine Weise verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: Wer
  rationale: Das Fragepronomen leitet eine rhetorische Frage ein; „Wer“ gibt sie knapp und unmittelbar wieder.
- source_word: יוֹדֵעַ
  choice: kennt
  rationale: Das Partizip von ידע bezeichnet hier das Erkennen oder Wissen. „Kennt“ ist im Deutschen in Verbindung mit „Macht“ idiomatisch und bewahrt die rhetorische Aussage.
- source_word: עֹז
  choice: Macht
  rationale: עֹז bezeichnet Stärke oder Macht. „Macht“ hebt die wirksame Gewalt des Zorns hervor und passt natürlich zum deutschen Ausdruck.
- source_word: אַפֶּךָ
  choice: deines Zorns
  rationale: אַף bedeutet wörtlich auch „Nase“, bezeichnet in dieser festen Verwendung jedoch Zorn. „Zorn“ wahrt den gehobenen Ton.
- source_word: וּכְיִרְאָתְךָ
  choice: gemäß der Furcht vor dir
  rationale: Die Verbindung aus וּ, כְּ und יִרְאָה mit Suffix ist knapp und syntaktisch mehrdeutig. „Gemäß der Furcht vor dir“ bildet die Entsprechung formal ab, ohne sie im Haupttext näher auszudeuten.
- source_word: עֶבְרָתֶךָ
  choice: deinen Grimm
  rationale: עֶבְרָה bezeichnet heftigen Zorn. „Grimm“ unterscheidet den Ausdruck vom vorausgehenden אַף und erhält zugleich die semantische Nähe und den poetisch-gehobenen Klang.
theological_decisions:
- issue: Verhältnis von Gottes Grimm und der Furcht vor ihm in וּכְיִרְאָתְךָ עֶבְרָתֶךָ
  choice: deinen Grimm gemäß der Furcht vor dir
  alternative: „Und dein Grimm entspricht der Furcht vor dir“ oder „Wie die Furcht vor dir, so dein Grimm“
  rationale: Der hebräische Ausdruck ist stark verdichtet und lässt offen, ob die Furcht als Maßstab, Entsprechung oder parallele Größe verstanden wird. Die Hauptfassung bewahrt diese Spannung möglichst weitgehend; die Fußnote nennt klarere mögliche Lesarten, ohne eine davon dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Syntax. „Zorn“ und „Grimm“ bewahren die parallelen, semantisch verwandten hebräischen Begriffe; die ungewöhnliche Verdichtung des zweiten Glieds wird nicht durch eine eindeutige Deutung aufgelöst.
