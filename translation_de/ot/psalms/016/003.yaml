  text: לִ֭/קְדוֹשִׁים אֲשֶׁר בָּ/אָ֣רֶץ הֵ֑מָּה וְ֝/אַדִּירֵ֗י כָּל חֶפְצִ/י בָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/003.yaml
  text: As for the holy ones who are in the land[c][b][a], they are the noble ones in whom is all my delight.
translation:
  language: de
  text: 'Was die Heiligen im Land betrifft[a][b]: Sie sind die Edlen[c], an denen ich meine ganze Freude habe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich könnte der Anfang auch heißen: „Für die Heiligen“ oder „Zu den Heiligen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf der Erde“.'
    reason: lexical_alternative
  - marker: c
    text: „Die Edlen“ kann auch mit „die Herrlichen“ oder „die Mächtigen“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְדוֹשִׁים
  choice: Was die Heiligen ... betrifft
  rationale: Das vorangestellte ל wird im Zusammenhang am besten als thematischer Ausdruck verstanden. „Die Heiligen“ gibt das substantivierte Adjektiv קְדוֹשִׁים natürlich und ohne zusätzliche Festlegung wieder.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: im Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. „Im Land“ passt hier natürlich, während die mögliche weitere Bedeutung in einer Fußnote erhalten bleibt.
- source_word: הֵמָּה
  choice: Sie sind
  rationale: Das selbstständige Pronomen wird zur Wahrung seiner Betonung ausdrücklich wiedergegeben.
- source_word: וְאַדִּירֵי
  choice: die Edlen
  rationale: אַדִּיר bezeichnet hier eher Würde, Vornehmheit oder Vortrefflichkeit als militärische Macht. „Die Edlen“ ist knapp und würdevoll.
- source_word: כָּל חֶפְצִי
  choice: meine ganze Freude
  rationale: חֵפֶץ kann Freude, Wohlgefallen oder Verlangen bezeichnen. Die Wendung bewahrt die starke persönliche Wertschätzung des Psalmisten.
- source_word: בָם
  choice: an denen
  rationale: Bei Personen ist „an denen ich ... Freude habe“ im Deutschen idiomatisch und gibt die Präposition ב angemessen wieder.
theological_decisions:
- issue: Identität der „Heiligen“
  choice: Die Formulierung legt menschliche, Gott zugehörige Personen im Land nahe, ohne dies ausdrücklich auszudeuten.
  alternative: Himmlische heilige Wesen oder allgemein geweihte Personen.
  rationale: „Im Land“ spricht eher für irdische Personen. Die Übersetzung vermeidet jedoch einen erklärenden Zusatz und bewahrt so die im Ausdruck verbleibende Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt bildet den thematischen Auftakt des hebräischen Verses ab; die Syntax bleibt gut verständlich. Die Fußnoten bewahren die wesentlichen lexikalischen Mehrdeutigkeiten.
