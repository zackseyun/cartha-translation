  text: תּֽוֹדִיעֵ/נִי֮ אֹ֤רַח חַ֫יִּ֥ים שֹׂ֣בַע שְׂ֭מָחוֹת אֶת פָּנֶ֑י/ךָ נְעִמ֖וֹת בִּ/ימִינְ/ךָ֣ נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/011.yaml
  text: You make known to me the path of life[a]; in your presence is fullness of joy[b]; at your right hand are pleasures forever.
translation:
  language: de
  text: Du lässt mich den Weg des Lebens erkennen; vor deinem Angesicht ist Fülle von Freuden[a]; zu deiner Rechten sind Wonnen für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In deiner Gegenwart ist Fülle von Freuden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹדִיעֵנִי
  choice: Du lässt mich erkennen
  rationale: 'Das Hifil von ידע mit Suffix der 1. Person Singular hat kausative Bedeutung: „du lässt mich erkennen / machst mir bekannt“. Das Präsens gibt die poetische Gewissheit natürlich wieder; eine zukünftige Nuance bleibt grammatisch möglich.'
- source_word: אֹרַח חַיִּים
  choice: den Weg zum Leben
  rationale: אֹרַח bezeichnet einen Pfad oder Weg; חַיִּים ist trotz seiner Pluralform gewöhnlich das Abstraktum „Leben“. „Weg zum Leben“ gibt die Zielrichtung der Metapher im Deutschen klar und knapp wieder.
- source_word: שֹׂבַע שְׂמָחוֹת
  choice: Freude in Fülle
  rationale: שֹׂבַע bezeichnet Fülle, Sättigung oder Überfluss; der Plural שְׂמָחוֹת kann eine Vielzahl beziehungsweise Intensität von Freude ausdrücken. „Freude in Fülle“ ist natürliches Deutsch und bewahrt das Bild des Überflusses.
- source_word: אֶת־פָּנֶיךָ
  choice: vor deinem Angesicht
  rationale: Die Wendung bedeutet wörtlich „bei/vor deinem Angesicht“ und bezeichnet idiomatisch Gottes Gegenwart. Die Hauptfassung bewahrt das konkrete hebräische Bild; die idiomatische Bedeutung steht in der Fußnote.
- source_word: נְעִמוֹת
  choice: Wonnen
  rationale: Das substantivisch gebrauchte Wort bezeichnet angenehme Dinge, Freuden oder Wonnen. „Wonnen“ wahrt den poetischen, würdevollen Ton und den Plural.
- source_word: בִּימִינְךָ
  choice: zu deiner Rechten
  rationale: Die Präposition ב mit „deiner rechten Hand“ kann räumlich als „zu deiner Rechten“ wiedergegeben werden. Dies ist im Deutschen idiomatisch und bewahrt das Bild bevorzugter Nähe.
- source_word: נֶצַח
  choice: für immer
  rationale: Hier bezeichnet נֶצַח unbegrenzte Dauer. „Für immer“ ist die natürliche moderne Wiedergabe.
theological_decisions:
- issue: Konkretes Bild „vor deinem Angesicht“ oder idiomatische Wiedergabe als göttliche Gegenwart
  choice: vor deinem Angesicht
  alternative: in deiner Gegenwart
  rationale: Die konkrete Ausdrucksweise des Hebräischen bleibt im Haupttext sichtbar, ohne die idiomatische Bedeutung festzulegen oder zu verdunkeln; die verständliche Alternative wird in einer Fußnote genannt.
- issue: Zeitwert des Imperfekts תּוֹדִיעֵנִי
  choice: Du lässt mich erkennen
  alternative: Du wirst mich erkennen lassen
  rationale: Das Imperfekt kann hier gegenwärtige poetische Gewissheit oder zukünftige Zuversicht ausdrücken. Das Präsens passt zum unmittelbaren Bekenntnis des Verses, ohne eine prophetische Zukunftsdeutung aufzuzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelität. „Angesicht“ und „Wonnen“ sind gehoben, aber allgemein verständlich und bewahren die Bildsprache des hebräischen Textes.
