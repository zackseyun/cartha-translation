base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/004.yaml
  text: The sorrows of those who hurry after another god will multiply[a]; I will not pour out their drink offerings of blood[b], nor will I lift up their names on my lips.
translation:
  language: de
  text: Die Leiden derer, die einem anderen Gott nacheilen, werden sich mehren.[a] Ihre Trankopfer aus Blut[b] werde ich nicht ausgießen und ihre Namen nicht auf meine Lippen nehmen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihre Götzenbilder mehren sich.« Das hebräische Wort kann in manchen Zusammenhängen mit Götzen verbunden sein; hier passt »Leiden« jedoch besser zum Sinn der Zeile.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »mit Blut«.'
    reason: lexical_alternative
  - marker: c
    text: Der Bezug von »ihre Namen« bleibt im Hebräischen offen; gemeint sein können die Namen der anderen Götter oder die ihrer Verehrer.
    reason: referential_ambiguity
lexical_decisions:
- source_word: יִרְבּוּ
  choice: werden sich mehren
  rationale: Das Qal-Imperfekt von רבה bezeichnet eine Zunahme; die zukunftsbezogene Form gibt die Folge ihres Handelns treffend wieder.
- source_word: עַצְּבוֹתָם
  choice: Die Schmerzen derer
  rationale: עַצָּבוֹת bezeichnet hier am ehesten Schmerzen oder Leiden als Folge des Götzendienstes. Ein Bezug auf Götzen ist lexikalisch möglich und wird in der Fußnote bewahrt.
- source_word: אַחֵר מָהָרוּ
  choice: die einem anderen Gott nacheilen
  rationale: מהר bedeutet gewöhnlich »eilen«. Das im Hebräischen nicht ausdrücklich genannte Bezugswort zu אַחֵר wird aus dem kultischen Kontext als »Gott« ergänzt; »nacheilen« vermittelt die eifrige Hinwendung.
- source_word: בַּל אַסִּיךְ
  choice: Ich werde … nicht ausgießen
  rationale: בל ist eine poetische Verneinung; das Hifil von נסך bezeichnet das Ausgießen eines Trankopfers und behält so das konkrete Opferbild bei.
- source_word: נִסְכֵּיהֶם מִדָּם
  choice: ihre Trankopfer aus Blut
  rationale: נֶסֶךְ ist ein kultischer Fachausdruck für ein Trankopfer. מן kann hier den Stoff bezeichnen, daher »aus Blut«; »mit Blut« bleibt als Alternative in der Fußnote erhalten.
- source_word: אֶשָּׂא אֶת שְׁמוֹתָם עַל שְׂפָתָי
  choice: ihre Namen nicht auf meine Lippen nehmen
  rationale: Die hebräische Bildrede mit נשא und »auf meinen Lippen« meint das Aussprechen oder Erwähnen. Die natürliche deutsche Wendung wahrt das Bild weitgehend.
theological_decisions:
- issue: Nicht genanntes Bezugswort nach אַחֵר
  choice: einem anderen Gott
  alternative: einem anderen
  rationale: Die Trankopfer und die Weigerung, Namen auszusprechen, weisen auf die Verehrung anderer Gottheiten. Die Ergänzung klärt den impliziten Bezug, ohne eine zusätzliche Lehraussage einzutragen.
- issue: Bedeutung von עַצְּבוֹתָם
  choice: Schmerzen
  alternative: Götzenbilder
  rationale: Im Satzgefüge ist eine Aussage über die zunehmenden Leiden derer, die einem anderen Gott folgen, am natürlichsten. Da eine Verbindung des Ausdrucks mit Götzen in Betracht kommt, wird die Alternative nicht verworfen, sondern in einer Fußnote genannt.
- issue: Bezug von »ihre Namen«
  choice: Referenz im Haupttext offengelassen
  alternative: 'ausdrücklich: die Namen der anderen Götter / die Namen ihrer Verehrer'
  rationale: Das Pronomen kann im Kontext unterschiedlich bezogen werden. Die Übersetzung »ihre Namen« bewahrt diese echte Unbestimmtheit; eine Fußnote weist darauf hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher kultischer Terminologie. »Nacheilen« erhält den poetischen Zug, ohne altertümlich zu wirken; »Trankopfer« ist präzise und allgemein verständlich. Die parallele Verneinung und die Lippenmetapher bleiben erhalten.
