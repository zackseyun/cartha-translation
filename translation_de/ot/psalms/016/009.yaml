source:
  edition: WLC
  text: לָ/כֵ֤ן שָׂמַ֣ח לִ֭בִּ/י וַ/יָּ֣גֶל כְּבוֹדִ֑/י אַף בְּ֝שָׂרִ֗/י יִשְׁכֹּ֥ן לָ/בֶֽטַח׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/009.yaml
  text: Therefore my heart is glad[a], and my glory rejoices[b]; even my flesh will dwell securely.
translation:
  language: de
  text: Darum freut sich mein Herz, und meine Herrlichkeit[a] jubelt; auch mein Fleisch wird in Sicherheit wohnen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Ehre“, „mein ganzes Wesen“. Manche verstehen „meine Herrlichkeit“ hier als Bezeichnung für das eigene Selbst; einige alte Übersetzungen geben den Ausdruck mit „meine Zunge“ wieder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird sicher ruhen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem zuvor ausgesprochenen Vertrauen auf den HERRN und klingt in deutscher Poesie natürlich.
- source_word: שָׂמַח לִבִּי
  choice: freut sich mein Herz
  rationale: Gibt sowohl das Herz als inneres Zentrum des Menschen als auch den im Kontext gegenwärtigen Zustand der Freude klar wieder.
- source_word: וַיָּגֶל
  choice: jubelt
  rationale: Das Verb גיל bezeichnet lebhafte, überschwängliche Freude; „jubelt“ wahrt diese Steigerung gegenüber „freut sich“.
- source_word: כְּבוֹדִי
  choice: meine Herrlichkeit
  rationale: Die formnahe Wiedergabe bewahrt die Mehrdeutigkeit des hebräischen Ausdrucks sowie die Verbindung zur späteren griechischen Zitierung; mögliche idiomatische Deutungen werden in der Fußnote genannt.
- source_word: אַף
  choice: auch
  rationale: Erweitert die Freude des Inneren auf den leiblichen Menschen. „Auch“ gibt diesen anschließenden, leicht hervorhebenden Sinn im Deutschen natürlich wieder.
- source_word: בְּשָׂרִי
  choice: mein Fleisch
  rationale: Bewahrt das konkrete hebräische Bild für den körperlichen Menschen und vermeidet, die Formulierung vorschnell zu „mein Körper“ zu glätten.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: wird in Sicherheit wohnen
  rationale: Gibt שכן direkt mit „wohnen“ und לבטח als Zustand der Sicherheit wieder; die alternative Auffassung „sicher ruhen“ bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Deutung von כְּבוֹדִי in einer später christologisch zitierten Stelle
  choice: meine Herrlichkeit
  alternative: meine Ehre; mein ganzes Wesen; meine Zunge
  rationale: Der Haupttext bleibt beim unmittelbaren lexikalischen Wert und erhält damit sowohl die Spannung des hebräischen Ausdrucks als auch den kanonischen Anklang, ohne das Idiom dogmatisch festzulegen.
- issue: Wiedergabe von בְּשָׂרִי
  choice: mein Fleisch
  alternative: mein Körper; mein Leib
  rationale: „Fleisch“ ist hier der körperliche Mensch, nicht die sündige Natur. Die formnahe Wiedergabe wahrt Bildsprache und intertextuelle Bezüge, ohne eine spätere theologische Bedeutung einzutragen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer poetischer Parallelität. Die wiederholten Possessivformen und die Bilder „Herz“, „Herrlichkeit“ und „Fleisch“ bleiben erhalten; schwer verständliche Mehrdeutigkeit wird nicht im Haupttext aufgelöst, sondern knapp erläutert.
