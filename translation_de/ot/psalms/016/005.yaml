  yaml_path: translation/ot/psalms/016/005.yaml
  text: Yahweh is the portion of my inheritance and my cup[a]; you uphold my lot.
translation:
  language: de
  text: Jahwe ist der Anteil meines Erbes und mein Becher[a]; du hältst mein Los fest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe ist mein Anteil und mein Becher.“ Im Hebräischen stehen mehrere Bilder der Zuteilung — „Anteil“, „Erbe/Erbteil“ und „Los“ — dicht nebeneinander.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: מְנָת חֶלְקִי
  choice: der Anteil meines Erbes
  rationale: Die Konstruktion bewahrt die eng aufeinanderfolgenden Zuteilungsbegriffe und bringt den Erbteil- beziehungsweise Landzuteilungshintergrund zum Ausdruck.
- source_word: וְכוֹסִי
  choice: und mein Becher
  rationale: Das konkrete poetische Bild bleibt erhalten, ohne seine mögliche Bedeutung als zugewiesenes Geschick im Haupttext auszudeuten.
- source_word: אַתָּה
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen wird zur Wahrung seiner Hervorhebung wiedergegeben.
- source_word: תּוֹמִיךְ
  choice: sicherst
  rationale: Das Verb bezeichnet ein Festhalten, Stützen oder Gewährleisten; „sicherst“ passt natürlich zu dem zugeteilten Los und vermittelt dessen Bestand.
- source_word: גּוֹרָלִי
  choice: mein Los
  rationale: „Los“ bewahrt sowohl das konkrete Zuteilungsbild als auch dessen mögliche Beziehung zum persönlichen Geschick.
theological_decisions:
- issue: Jahwe selbst als Erbanteil des Beters
  choice: „der Anteil meines Erbes“
  alternative: „mein Anteil“ oder „mein Erbteil“
  rationale: Die Wiedergabe erhält die Häufung verwandter Zuteilungsbilder, statt sie zu glätten, und lässt die Spannung bestehen, dass Jahwe selbst als der dem Beter zugewiesene Besitz bezeichnet wird.
- issue: Bedeutung des Bechers
  choice: Das Bild „mein Becher“ bleibt unausgelegt.
  alternative: „der mir zugewiesene Becher“ oder eine Deutung als Schicksal
  rationale: Der hebräische Text nennt den Becher, ohne die Metapher ausdrücklich auf Lebensgeschick, Versorgung oder Segen festzulegen.
translation_notes:
  register: Moderne, gehobene Psalmenprosa mit knapper poetischer Struktur. Die ungewöhnliche Häufung der Zuteilungsbegriffe wird bewusst beibehalten; „Becher“ und „Los“ bleiben als offene Bilder stehen.
