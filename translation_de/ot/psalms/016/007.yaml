  text: אֲבָרֵ֗ךְ אֶת יְ֭הוָה אֲשֶׁ֣ר יְעָצָ֑/נִי אַף לֵ֝יל֗וֹת יִסְּר֥וּ/נִי כִלְיוֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/007.yaml
  text: I will bless Yahweh[a], who counsels me; even at night my inner being instructs me.
translation:
  language: de
  text: Ich will Jahwe preisen, der mich beraten hat; selbst in den Nächten unterweist mich mein Innerstes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Meine Nieren unterweisen mich.“ Die Nieren können im Hebräischen das tiefste Innere des Menschen bezeichnen, darunter Gewissen und tiefe Empfindungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָרֵךְ
  choice: Ich will … preisen
  rationale: Das Piel von ברך bezeichnet gegenüber Gott das Segnen im Sinn von lobend preisen. „Preisen“ ist im heutigen Deutschen natürlicher als „segnen“, während „ich will“ die nicht abgeschlossene, hier entschlossene Aussage des Imperfekts wiedergibt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: יְעָצָנִי
  choice: der mich berät
  rationale: יעץ bedeutet beraten oder Rat geben. Das Präsens gibt die im Kontext naheliegende fortdauernde beziehungsweise kennzeichnende Tätigkeit wieder.
- source_word: אַף לֵילוֹת
  choice: auch in den Nächten
  rationale: אַף fügt den zweiten Gedanken nachdrücklich hinzu. Der hebräische Plural „Nächte“ bleibt erhalten und kann wiederholte nächtliche Erfahrung ausdrücken.
- source_word: יִסְּרוּנִי
  choice: unterweist mich
  rationale: יסר umfasst unterweisen, ermahnen, zurechtweisen und züchtigen. „Unterweist“ passt zum Rat im ersten Halbvers, ohne den möglichen formenden oder mahnenden Unterton völlig auszuschließen.
- source_word: כִלְיוֹתָי
  choice: mein Innerstes
  rationale: Wörtlich steht „meine Nieren“. Im Hebräischen bezeichnen die Nieren bildhaft das tiefste Innere des Menschen, einschließlich Gewissen und Empfindungen. „Mein Innerstes“ vermittelt diese Funktion verständlich, ohne sie auf Herz oder Verstand zu verengen.
theological_decisions:
- issue: Anthropologische Metapher כִלְיוֹתָי
  choice: mein Innerstes
  alternative: meine Nieren; mein Herz; mein Gewissen
  rationale: Die funktionale Wiedergabe macht die althebräische Körpermetapher verständlich. Die Fußnote bewahrt das konkrete Bild; zugleich wird die Bedeutung nicht vorschnell nur auf Denken, Gefühl oder Gewissen festgelegt.
- issue: Urheber der nächtlichen Unterweisung
  choice: Die grammatische Aussage „mein Innerstes unterweist mich“ bleibt stehen.
  alternative: Jahwe unterweist mich nachts in meinem Inneren.
  rationale: Der Parallelismus kann Gottes Rat und die nächtliche innere Unterweisung eng verbinden, doch der unmittelbare grammatische Träger des zweiten Verbs ist „mein Innerstes“. Die Übersetzung löst diese theologische Beziehung nicht ausdrücklich auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gottesname erscheint als „Jahwe“. Der Parallelismus und die knappe poetische Form bleiben erhalten; „Innerstes“ wird durch eine Fußnote auf die konkrete hebräische Metapher zurückgeführt.
