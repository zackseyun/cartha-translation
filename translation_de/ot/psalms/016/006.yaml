    text: 'Oder: „Die Grenzlinien sind mir an angenehme Orte gefallen.“ Das hebräische Bild meint Schnüre oder Linien, mit denen ein zugeteilter Anteil vermessen und abgegrenzt wurde.'
    reason: lexical_alternative
