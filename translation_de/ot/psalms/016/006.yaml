lexical_decisions:
- source_word: חֲבָלִים
  choice: Messschnüre
  rationale: Das Wort bezeichnet hier im Zusammenhang der Landzuteilung Schnüre, mit denen ein Erbteil vermessen und abgegrenzt wird. „Messschnüre“ bewahrt das konkrete Bild und ist im Deutschen verständlicher als das wörtlichere „Seile“.
- source_word: נָפְלוּ
  choice: sind … gefallen
  rationale: Die wörtliche Bildsprache des Fallens bleibt erhalten; zugleich lässt der Zusammenhang an eine durch Los oder Zuteilung bestimmte Landportion denken, ohne dies ausdrücklich in den Text einzutragen.
- source_word: לִי
  choice: für mich
  rationale: Der Dativ bezeichnet die Zuteilung zugunsten des Sprechers. „Für mich“ macht diesen persönlichen Bezug klar.
- source_word: בַּנְּעִמִים
  choice: auf liebliches Land
  rationale: Das substantivierte Adjektiv bezeichnet etwas Angenehmes oder Liebliches. Im Bild der Landvermessung gibt „liebliches Land“ den örtlichen Sinn natürlich wieder, ohne die Metapher zu verallgemeinern.
- source_word: אַף
  choice: ja
  rationale: Hier bekräftigt und steigert die Partikel die erste Aussage. Das kurze „ja“ gibt diese emphatische Bestätigung im Deutschen natürlich wieder.
- source_word: נַחֲלָת
  choice: mein Erbteil
  rationale: Gemeint ist der dem Sprecher zugewiesene Besitz beziehungsweise Anteil. „Erbteil“ erhält die konkrete und zugleich bundestheologisch geprägte Sprache des Psalms.
- source_word: שָׁפְרָה עָלָי
  choice: gefällt mir
  rationale: Die Wendung bewertet das Erbteil als schön, gut oder angenehm für den Sprecher. „Gefällt mir“ ist natürliches modernes Deutsch und wahrt den persönlichen Bewertungsaspekt; die wörtlichere Ausdrucksweise wird in der Fußnote genannt.
theological_decisions:
- issue: Das Bild der Landzuteilung als Ausdruck des von Gott gegebenen Anteils
  choice: Die konkreten Bilder „Messschnüre“ und „Erbteil“ bleiben stehen.
  alternative: Den Vers allgemein als Aussage über angenehme Segnungen oder ein glückliches Los wiederzugeben.
  rationale: Der unmittelbare Zusammenhang nennt den HERRN als Anteil und Becher des Psalmisten. Die konkrete Sprache der Landvermessung und des Erbteils bewahrt diese theologische Tiefenschicht, ohne festzulegen, ob der Sprecher vor allem Land, Lebensgeschick oder Gott selbst als seinen Anteil meint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Vorstellung fallender Messschnüre bleibt als bewusstes hebräisches Zuteilungsbild erhalten; die Fußnote erläutert sie. „Gefällt mir“ vermeidet eine unnatürliche deutsche Formulierung, ohne die positive persönliche Wertung zu verstärken.
