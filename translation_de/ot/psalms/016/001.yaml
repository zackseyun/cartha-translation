  source_fidelity: Der Entwurf gibt die hebräische Überschrift מִכְתָּם לְדָוִד angemessen als „Ein Miktam Davids“ wieder und bewahrt damit die offene Zuordnung von לְדָוִד. „Bewahre mich, Gott“ trifft den Imperativ שָׁמְרֵנִי und die direkte Anrede אֵל. „Denn bei dir suche ich Zuflucht“ gibt die Begründung mit כִּי sowie das Zufluchtsbild von חָסִיתִי בָךְ idiomatisch und sinngemäß präzise wieder. Das deutsche Präsens ist für das hebräische Perfekt in dieser Gebetswendung vertretbar.
