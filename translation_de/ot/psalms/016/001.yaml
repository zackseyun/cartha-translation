id: PSA.16.1
reference: Psalms 16:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִכְתָּ֥ם לְ/דָוִ֑ד שָֽׁמְרֵ֥/נִי אֵ֝֗ל כִּֽי חָסִ֥יתִי בָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/001.yaml
  text: A miktam of David. Preserve me[a], O God, for I take refuge in you.
translation:
  language: de
  text: Ein Miktam[a] Davids. Bewahre mich, Gott, denn bei dir suche ich Zuflucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Miktam, eine Psalmüberschrift von unsicherer Bedeutung; möglicherweise bezeichnet sie eine bestimmte Art von Dichtung. Andere übersetzen „Psalm“, „goldenes Lied“ oder „Inschrift“.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Die Bedeutung der Psalmüberschrift ist unsicher. Die Transliteration bewahrt den hebräischen Ausdruck, ohne ihm eine umstrittene Bedeutung zuzuschreiben.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der deutsche Genitiv gibt die Zuordnung zu David knapp und natürlich wieder, ohne eindeutig zwischen Verfasserschaft, Zugehörigkeit und Widmung zu entscheiden.
- source_word: שָׁמְרֵנִי
  choice: Bewahre mich
  rationale: Der Imperativ bezeichnet Gottes schützendes Bewahren und passt zum würdevollen Gebetston.
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier die direkte Anrede Gottes. Im Deutschen drückt „Gott“ den Vokativ natürlich auch ohne ein zusätzliches „o“ aus.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der Bitte ein.
- source_word: חָסִיתִי
  choice: suche ich Zuflucht
  rationale: Die Wendung bewahrt das Bild des Zufluchtnehmens. Das deutsche Präsens gibt die im hebräischen Perfekt ausgedrückte, gegenwärtig maßgebliche Hinwendung idiomatisch wieder.
- source_word: בָךְ
  choice: bei dir
  rationale: In Verbindung mit „Zuflucht suchen“ bezeichnet die Präposition die Person, bei der Schutz gesucht wird; „bei dir“ ist dafür im Deutschen natürlich.
theological_decisions:
- issue: Bedeutung der Überschrift מִכְתָּם
  choice: Als „Miktam“ transliterieren
  alternative: Als Gattungsbezeichnung wie „Psalm“, als „goldenes Lied“ oder als „Inschrift“ übersetzen
  rationale: Die genaue Bedeutung ist nicht gesichert. Eine Transliteration vermeidet eine spekulative Festlegung und macht die Unsicherheit in der Fußnote transparent.
- issue: Beziehung Davids zum Psalm in לְדָוִד
  choice: „Davids“
  alternative: „von David“, „für David“ oder „David gewidmet“
  rationale: Die Präposition לְ kann in Psalmüberschriften Verfasserschaft, Zuordnung oder Widmung anzeigen. Der knappe Genitiv lässt diese Beziehung im Deutschen möglichst offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Gebetston. Die Satzstruktur bleibt knapp und poetisch; altertümliches „o Gott“ wird vermieden. Die Fußnotenmarke steht unmittelbar beim erklärten Ausdruck.
