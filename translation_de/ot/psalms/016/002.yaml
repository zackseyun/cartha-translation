id: PSA.16.2
reference: Psalms 16:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָמַ֣רְתְּ לַֽ֭/יהוָה אֲדֹנָ֣/י אָ֑תָּה ט֝וֹבָתִ֗/י בַּל עָלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/002.yaml
  text: I said to Yahweh[a], “You are my Lord; I have no good apart from you.”
translation:
  language: de
  text: 'Ich habe zu Jahwe gesagt[a]: »Du bist mein Herr; außerhalb von dir gibt es für mich nichts Gutes.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Form lautet formal »du hast gesagt« (weibliche Einzahl). Der Zusammenhang und alte Übersetzungen verstehen sie hier jedoch als Aussage des Psalmisten: »Ich habe gesagt«.'
    reason: textual_grammatical_ambiguity
  - marker: b
    text: 'Wörtlicher: »Mein Gutes reicht nicht über dich hinaus.« Gemeint sein kann, dass es für den Betenden nichts Gutes unabhängig von Jahwe gibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתְּ
  choice: Ich habe gesagt
  rationale: Die überlieferte Form sieht formal wie die 2. Person Singular feminin aus. Im Zusammenhang spricht jedoch der Psalmist selbst zu Gott; auch alte Übersetzungen verstehen die Aussage in der 1. Person. Das deutsche Perfekt gibt das Bekenntnis natürlich wieder, ohne einen ausdrücklich nicht vorhandenen Sprecherwechsel einzuführen.
- source_word: לַיהוָה
  choice: zu Jahwe
  rationale: Die Präposition ל bezeichnet hier den Adressaten der Rede. Der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: אֲדֹנָי
  choice: mein Herr
  rationale: Die Form enthält das Suffix der 1. Person Singular und bezeichnet Jahwe als den Herrn des Betenden. »Herr« ist in der direkten Anrede natürlicher und würdevoller als »Gebieter«.
- source_word: טוֹבָתִי
  choice: für mich … Gutes
  rationale: Das Substantiv kann das Gute, Wohlergehen oder einen Vorteil bezeichnen. Die Formulierung lässt diese Breite bestehen und vermeidet die heute leicht moralisch verstandene Wiedergabe »meine Güte«.
- source_word: בַּל עָלֶיךָ
  choice: außerhalb von dir … nichts
  rationale: Die knappe poetische Verbindung verneint, dass das Gute des Betenden über Jahwe hinausreicht. »Außerhalb von dir gibt es für mich nichts Gutes« drückt diese Beziehung in verständlichem Gegenwartsdeutsch aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text gebraucht den persönlichen Gottesnamen. Die Transliteration »Jahwe« macht ihn als Namen erkennbar und unterscheidet ihn vom Titel אֲדֹנָי, »mein Herr«.
- issue: Sinn des Schlusssatzes
  choice: außerhalb von dir gibt es für mich nichts Gutes
  alternative: Mein Gutes reicht nicht über dich hinaus
  rationale: Das Hebräische ist knapp und mehrdeutig. Die Hauptfassung gibt die Abhängigkeit des Betenden von Gott verständlich wieder; die formal nähere Alternative bleibt in der Fußnote sichtbar, damit die Aussage nicht unnötig dogmatisch verengt wird.
- issue: Person des Verbs אָמַרְתְּ
  choice: Ich habe gesagt
  alternative: Du hast gesagt
  rationale: Formal kann die masoretische Form als 2. Person Singular feminin gelesen werden. Der unmittelbare Redekontext und die alten Übersetzungen stützen jedoch ein Bekenntnis des Psalmisten in der 1. Person; die formale Schwierigkeit wird ausdrücklich angemerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und gebetsnah. »Jahwe« wird als Eigenname verwendet, während »mein Herr« den Titel אֲדֹנָי wiedergibt. Zwei Fußnoten bewahren die grammatische Schwierigkeit des ersten Verbs und die idiomatische Offenheit des Schlusssatzes.
