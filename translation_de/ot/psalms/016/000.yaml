  text: מִכְתָּ֥ם לְ/דָוִ֑ד שָֽׁמְרֵ֥/נִי אֵ֝֗ל כִּֽי חָסִ֥יתִי בָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/000.yaml
  text: A miktam of David. Preserve me[a], God, for I take refuge in you.
translation:
  language: de
  text: Ein Miktam[a] von David. Bewahre mich, Gott, denn bei dir suche ich Zuflucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Miktam, eine Psalmüberschrift von unsicherer Bedeutung; möglicherweise bezeichnet das Wort eine bestimmte Art von Dichtung. Andere übersetzen etwa „Psalm“ oder „goldenes Lied“.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Die Bedeutung der Gattungsbezeichnung in der Überschrift ist unsicher. Die Transliteration bewahrt diese Unsicherheit, statt eine bestimmte Deutung in den Haupttext einzutragen.
- source_word: שָׁמְרֵנִי
  choice: Bewahre mich
  rationale: Der Imperativ von שׁמר bezeichnet hier Gottes schützendes Bewahren und wird direkt und natürlich wiedergegeben.
- source_word: חָסִיתִי בָךְ
  choice: bei dir suche ich Zuflucht
  rationale: Die idiomatische deutsche Formulierung gibt das hebräische Perfekt als gegenwärtige, fortbestehende Vertrauensaussage wieder. „Bei dir“ entspricht der mit dem Verb verbundenen Präposition ב.
theological_decisions:
- issue: Gottesbezeichnung אֵל
  choice: Gott
  alternative: starker Gott
  rationale: אֵל dient hier als direkte Anrede Gottes; „Gott“ ist die sachgemäße, nicht interpretativ erweiterte Wiedergabe.
- issue: Zeitlicher Aspekt von חָסִיתִי
  choice: suche ich Zuflucht
  alternative: habe ich Zuflucht gesucht
  rationale: Das hebräische Perfekt kann ein bereits vollzogenes und weiterhin geltendes Vertrauen ausdrücken. Die präsentische deutsche Wendung entspricht dem natürlichen Sinn im Gebet, ohne die Aussage auf einen vergangenen Einzelakt zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die seltene hebräische Überschriftsbezeichnung bleibt transliteriert und wird in der Fußnote erläutert; der Gebetssatz ist knapp und unmittelbar formuliert.
