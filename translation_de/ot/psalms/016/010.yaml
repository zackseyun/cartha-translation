id: PSA.16.10
reference: Psalms 16:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י לֹא תַעֲזֹ֣ב נַפְשִׁ֣/י לִ/שְׁא֑וֹל לֹֽא תִתֵּ֥ן חֲ֝סִידְ/ךָ֗ לִ/רְא֥וֹת שָֽׁחַת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/010.yaml
  text: For you will not abandon my soul to Sheol[b][a], nor will you let your faithful one see the pit.
translation:
  language: de
  text: Denn du wirst meine Seele nicht dem Totenreich überlassen und nicht zulassen, dass dein Getreuer[a] die Grube[b] sieht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dein Heiliger«. Das hebräische Wort kann einen treuen, loyalen, frommen oder heiligen Menschen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Verwesung«. Die Septuaginta und die neutestamentliche Anführung dieses Verses verwenden eine Formulierung, die Verwesung beziehungsweise Zerfall hervorhebt.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die zuvor ausgedrückte Zuversicht und verbindet den Vers natürlich mit seinem Kontext.
- source_word: לֹא תַעֲזֹב
  choice: wirst … nicht … überlassen
  rationale: עזב kann »verlassen«, »preisgeben« oder »überlassen« bedeuten. Mit dem Ziel »dem Totenreich« gibt »überlassen« den Sinn im Deutschen idiomatisch wieder.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נפש kann die Seele, das Leben oder die ganze Person bezeichnen. »Meine Seele« bewahrt die hebräische Bildsprache, ohne den Bedeutungsumfang auf eine rein körperlose Seele festzulegen.
- source_word: לִשְׁאוֹל
  choice: dem Totenreich
  rationale: שׁאול bezeichnet den Bereich der Toten und nicht lediglich ein einzelnes Grab. »Totenreich« vermittelt diesen Begriff verständlicher als eine unkommentierte Transliteration.
- source_word: לֹא תִתֵּן
  choice: nicht zulassen
  rationale: נתן bedeutet wörtlich »geben«, hat mit folgendem Infinitiv hier aber idiomatisch den Sinn »zulassen«.
- source_word: חֲסִידְךָ
  choice: dein Getreuer
  rationale: חסיד bezeichnet einen Menschen, der durch Treue, Loyalität und Frömmigkeit gekennzeichnet ist. »Dein Getreuer« erhält den relationalen Sinn und vermeidet eine vorschnelle technische Festlegung auf »Heiliger«.
- source_word: לִרְאוֹת
  choice: sieht
  rationale: ראה bedeutet unmittelbar »sehen«. Die hebräische Wendung bleibt erhalten, auch wenn im Zusammenhang das Erleben oder Erfahren gemeint sein kann.
- source_word: שָׁחַת
  choice: die Grube
  rationale: שחת kann »Grube«, »Verderben« oder »Verwesung« bezeichnen. Im poetischen Parallelismus mit dem Totenreich ist »Grube« eine naheliegende Bedeutung; die wichtige Alternative wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Messianische Bedeutung des Verses in seiner späteren neutestamentlichen Verwendung
  choice: Der Haupttext folgt dem unmittelbaren lexikalischen Sinn des hebräischen Psalms und lautet »dein Getreuer« sowie »die Grube«.
  alternative: »dein Heiliger« und »Verwesung«, entsprechend der christologisch bedeutsamen Wiedergabe in der Septuaginta und ihrer Aufnahme im Neuen Testament.
  rationale: Die Übersetzung soll zuerst den hebräischen Text wiedergeben, ohne seine spätere messianische Anwendung in den Haupttext hineinzutragen. Zugleich werden die theologisch bedeutsamen Alternativen ausdrücklich in Fußnoten erhalten.
- issue: Bedeutungsumfang von נַפְשִׁי
  choice: »meine Seele« wird als hebräische Personenbezeichnung bewahrt.
  alternative: »mein Leben« oder »mich«.
  rationale: Der Ausdruck darf nicht stillschweigend auf eine bestimmte Lehre über Leib und Seele verengt werden; im Hebräischen kann נפש die ganze lebende Person beziehungsweise ihr Leben bezeichnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Satzführung. »Totenreich« macht den althebräischen Begriff Scheol allgemein verständlich; »Getreuer« ist leicht gehoben, aber im Psalmregister natürlich. Die Mehrdeutigkeit von נפש, חסיד und שחת bleibt entweder im Wortlaut oder in den Fußnoten erhalten.
