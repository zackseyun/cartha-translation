  text: שִׁוִּ֬יתִי יְהוָ֣ה לְ/נֶגְדִּ֣/י תָמִ֑יד כִּ֥י מִֽ֝/ימִינִ֗/י בַּל אֶמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/008.yaml
  text: I have set Yahweh before me continually[a]; because he is at my right hand[b], I will not be shaken.
translation:
  language: de
  text: Jahwe[a] habe ich mir stets vor Augen gestellt. Weil er zu meiner Rechten ist, werde ich nicht wanken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell oft mit „der HERR“ wiedergegeben.
    reason: divine_name
  - marker: b
    text: 'Oder: „werde ich nicht ins Wanken geraten.“ Das hebräische Wort kann ausdrücken, dass jemand taumelt oder aus einer sicheren Stellung gebracht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁוִּיתִי
  choice: habe ich mir … vor Augen gestellt
  rationale: Das Piel von שׁוה bezeichnet hier ein bewusstes Setzen oder Platzieren. Die Formulierung bewahrt die gezielte Handlung und klingt zugleich im modernen Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְנֶגְדִּי
  choice: mir … vor Augen
  rationale: Die Wendung bezeichnet etwas, das sich vor jemandem beziehungsweise in dessen Blickfeld befindet; „vor Augen“ gibt dieses räumliche und geistige Bild idiomatisch wieder.
- source_word: תָמִיד
  choice: stets
  rationale: Das Wort bezeichnet fortdauernde oder regelmäßige Beständigkeit. „Stets“ ist knapp, verständlich und dem poetischen Register angemessen.
- source_word: כִּי
  choice: weil
  rationale: Die Konjunktion führt hier den Grund für die anschließende Zuversicht ein.
- source_word: מִימִינִי
  choice: zu meiner Rechten
  rationale: Die Formulierung bewahrt das räumliche Bild der schützenden und stützenden Nähe.
- source_word: בַּל אֶמּוֹט
  choice: werde ich nicht wanken
  rationale: מוט bezeichnet das Wanken, Taumeln oder Verdrängtwerden aus einer sicheren Stellung. „Nicht wanken“ erhält das Bild und ist im Deutschen zugleich körperlich und übertragen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Art der zugesagten Standfestigkeit
  choice: werde ich nicht wanken
  alternative: werde ich nicht erschüttert werden; werde ich nicht von der Stelle weichen
  rationale: 'Die Bildsprache bleibt bewusst offen: Sie kann innere Festigkeit ebenso wie das Bewahrtwerden in einer sicheren Stellung bezeichnen.'
translation_notes:
  register: Moderne, würdige Psalmsprache. Die Voranstellung von „Jahwe“ setzt einen natürlichen poetischen Akzent; „vor Augen gestellt“ bewahrt die bewusste Haltung des hebräischen Verbs, während „zu meiner Rechten“ die ursprüngliche Bildsprache erhält.
