  source_fidelity: Die Orts- und Begründungsangabe („Denn dort“) sowie die Wiederholung von „Throne“ geben den hebräischen Parallelismus angemessen wieder. „stehen“ ist für fest aufgestellte Throne eine vertretbare idiomatische Entsprechung zu יָשְׁבוּ. „Für das Recht“ ist jedoch für לְמִשְׁפָּט zu weit und im Deutschen weniger präzise als die gerichtliche Funktion „zum Gericht“. Die zweite Wortgruppe sollte die Zugehörigkeit der Throne zum davidischen Königshaus ausdrücken; „für das Haus Davids“ lässt dagegen eine bloße Bestimmung zugunsten dieses Hauses offen.
  naturalness: „Denn dort stehen Throne zum Gericht, Throne des Hauses David“ ist knapp, würdig und im modernen Standarddeutsch verständlich. Die Wiederholung von „Throne“ bewahrt die poetische Struktur des Hebräischen.
