source:
  edition: WLC
  text: כִּ֤י שָׁ֨מָּ/ה יָשְׁב֣וּ כִסְא֣וֹת לְ/מִשְׁפָּ֑ט כִּ֝סְא֗וֹת לְ/בֵ֣ית דָּוִֽיד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/005.yaml
  text: For there thrones sit for judgment[c][b][a], thrones for the house of David.
translation:
  language: de
  text: Denn dort stehen Throne zum Gericht[a], Throne des Hauses David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die Rechtsprechung“. Das hebräische Wort kann auch „Recht“ oder „Gerechtigkeit“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Begründung für die besondere Stellung Jerusalems im Zusammenhang ein, ohne die Nuance stärker festzulegen.
- source_word: שָׁמָּה
  choice: dort
  rationale: Verweist örtlich auf das zuvor genannte Jerusalem und klingt im modernen Deutsch natürlich.
- source_word: יָשְׁבוּ
  choice: stehen
  rationale: Das Verb bedeutet wörtlich „sitzen/wohnen“. Bei Thronen bezeichnet es hier idiomatisch ihr festes Aufgestelltsein und ihre institutionelle Funktion; „stehen“ bewahrt das konkrete Bild besser als eine rein abstrakte Wiedergabe.
- source_word: כִסְאוֹת
  choice: Throne
  rationale: Bezeichnet königliche beziehungsweise richterliche Sitze und nicht bloß gewöhnliche Sitzplätze.
- source_word: לְמִשְׁפָּט
  choice: für das Recht
  rationale: מִשְׁפָּט kann Gericht, Rechtsprechung oder Recht/Gerechtigkeit bezeichnen. „Für das Recht“ ist im Deutschen knapp und umfasst sowohl die richterliche Tätigkeit als auch ihre gerechte Zielsetzung.
- source_word: כִסְאוֹת לְבֵית דָּוִיד
  choice: Throne für das Haus Davids
  rationale: Das wiederholte לְ wird als „für“ wiedergegeben. So bleibt offen, ob die Throne dem davidischen Haus zugeordnet, für es bestimmt oder von ihm zur Rechtsprechung genutzt sind.
theological_decisions:
- issue: Bedeutung des Bezugs auf das Haus Davids
  choice: Die Throne werden mit dem davidischen Königshaus und seiner richterlichen Autorität in Jerusalem verbunden.
  alternative: Eine allgemeine Bezeichnung der städtischen Gerichte oder eine ausdrücklich messianische Deutung.
  rationale: Der hebräische Text nennt sowohl die Throne als auch das Haus Davids. Die Übersetzung bewahrt diesen historischen und dynastischen Bezug, ohne eine weitergehende typologische oder messianische Deutung in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Knappheit. „Dort stehen Throne“ ist im Deutschen natürlicher als das wörtliche Bild sitzender Throne; die Wiederholung von „Throne“ und die parallelen Zweckangaben bleiben erhalten.
