  source_fidelity: Die Übersetzung gibt den Imperativ שַׁאֲלוּ angemessen als „Betet für“ wieder; die wörtlichere Nuance „Bittet um“ ist sachgerecht in Fußnote a erhalten. „Frieden“ entspricht שָׁלוֹם. Der zweite Halbvers bewahrt die Anrede Jerusalems („dich“) sowie die gut begründbare Wunschlesart von יִשְׁלָיוּ. „In Sicherheit leben“ deckt eine zentrale Bedeutung von שלה (sicher/ungestört sein) ab, ohne eine materielle Wohlstandsverheißung festzuschreiben.
  naturalness: Modernes, würdiges und idiomatisches Standarddeutsch. Der Doppelpunkt gliedert die poetischen Halbverse klar. „Mögen alle, die dich lieben, in Sicherheit leben“ ist verständlich und passend für den liturgisch-poetischen Registerton.
  terminology: „Jerusalem“ und „Frieden“ sind etabliert. Das direkte feminine Suffix für die Stadt wird korrekt durch „dich“ abgebildet. Die Fußnoten bewahren sowohl die lexikalische Alternative beim Imperativ als auch die mögliche indikativische Deutung des zweiten Halbverses.
