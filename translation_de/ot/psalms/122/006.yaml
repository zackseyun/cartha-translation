  text: שַׁ֭אֲלוּ שְׁל֣וֹם יְרוּשָׁלִָ֑ם יִ֝שְׁלָ֗יוּ אֹהֲבָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/006.yaml
  text: 'Pray for the peace of Jerusalem: may those who love you prosper[a][b].'
translation:
  language: de
  text: 'Betet für den Frieden Jerusalems: Mögen alle, die dich lieben, in Sicherheit leben.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bittet um den Frieden Jerusalems.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Mögen alle, die dich lieben, gedeihen“; auch als Aussage möglich: „Alle, die dich lieben, werden in Sicherheit leben.“'
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁאֲלוּ
  choice: Betet für
  rationale: Das Imperativverb שׁאל bedeutet hier wörtlich „fragt/bittet um“. Im liturgischen Zusammenhang gibt „betet für“ die an Gott gerichtete Bitte zugunsten Jerusalems natürlich wieder; die wörtlichere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: שְׁלוֹם
  choice: Frieden
  rationale: שָׁלוֹם umfasst Frieden, Wohlergehen und Ganzheit. „Frieden“ ist im Deutschen die natürliche und traditionsnahe Wiedergabe und passt zum Kontext des Psalms.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Der Ortsname wird nach der üblichen deutschen Form wiedergegeben.
- source_word: יִשְׁלָיוּ
  choice: in Sicherheit leben
  rationale: Das Verb שלה kann ungestörte Ruhe, Sicherheit oder Gedeihen bezeichnen. „In Sicherheit leben“ nimmt den Friedensgedanken des ersten Halbverses auf, ohne den Sinn auf materiellen Wohlstand zu verengen.
- source_word: אֹהֲבָיִךְ
  choice: alle, die dich lieben
  rationale: Das Partizip mit femininem Singularsuffix bezeichnet die Menschen, die Jerusalem lieben. Das direkte „dich“ bewahrt die Anrede der Stadt.
theological_decisions:
- issue: Aussageweise des zweiten Halbverses
  choice: 'Als Wunsch beziehungsweise Gebet: „Mögen alle, die dich lieben, in Sicherheit leben.“'
  alternative: 'Als Feststellung oder Zusage: „Alle, die dich lieben, werden in Sicherheit leben.“'
  rationale: Die hebräische Imperfektform kann poetisch sowohl einen Wunsch als auch eine Aussage ausdrücken. Nach dem Imperativ „Betet“ liegt der Wunschsinn nahe; die alternative Aussageform wird jedoch nicht ausgeschlossen und daher in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt erhält die poetische Zweiteilung. „In Sicherheit leben“ ist allgemein verständlich und bildet die Bedeutungsbreite von Ruhe und Sicherheit besser ab als ein ausschließlich wirtschaftlich verstandenes „Wohlergehen“.
