id: PSA.122.8
reference: Psalms 122:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְ֭מַעַן אַחַ֣/י וְ/רֵעָ֑/י אֲדַבְּרָה נָּ֖א שָׁל֣וֹם בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/008.yaml
  text: For the sake of my brothers and my companions[a], I will now say[c][b], “Peace be within you.”
translation:
  language: de
  text: 'Um meiner Brüder und meiner Gefährten willen will ich nun[a] sagen: »Friede[b] sei in dir!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Partikel נָא kann statt zeitlichem »nun« auch eine Bitte oder nachdrückliche Aufforderung anzeigen; entsprechend wäre auch zu verstehen: »will ich sagen: Bitte, Friede sei in dir!«'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort schalom bezeichnet außer Frieden auch Wohlergehen, Unversehrtheit und Gedeihen.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: um … willen
  rationale: Die Wendung bezeichnet hier den Beweggrund beziehungsweise Zweck des folgenden Ausspruchs und entspricht dem gehobenen, aber weiterhin verständlichen Psalmregister.
- source_word: אַחַי
  choice: meiner Brüder
  rationale: Gibt den maskulinen Plural mit dem Suffix der ersten Person Singular formal genau wieder; im Zusammenhang sind die Angehörigen der Gemeinschaft gemeint.
- source_word: וְרֵעָי
  choice: und meiner Gefährten
  rationale: רֵעַ kann Freund, Gefährte, Mitmensch oder Nächster bedeuten. »Gefährten« passt zum gemeinschaftlichen Pilgerkontext, ohne eine engere persönliche Freundschaft vorauszusetzen.
- source_word: אֲדַבְּרָה
  choice: will ich … sagen
  rationale: Die Kohortativform drückt Entschluss oder Selbstaufforderung aus. Mit dem nachfolgenden Segenswort ist »sagen« im Deutschen natürlicher als »sprechen«.
- source_word: נָּא
  choice: nun
  rationale: Die Partikel kann Dringlichkeit, Nachdruck oder eine Bitte ausdrücken. »Nun« verbindet sich idiomatisch mit dem entschlossenen Kohortativ; die mögliche bittende Nuance bleibt in einer Fußnote erhalten.
- source_word: שָׁלוֹם
  choice: Friede
  rationale: Die traditionelle und prägnante Wiedergabe bewahrt zugleich den umfassenderen Bedeutungsraum von Wohlergehen, Unversehrtheit und Gedeihen, der in einer Fußnote erläutert wird.
- source_word: בָּךְ
  choice: in dir
  rationale: Das feminine Singularsuffix richtet sich unmittelbar an die als Stadt personifizierte Jerusalem. »In dir« bewahrt sowohl die direkte Anrede als auch den räumlichen Sinn.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnung
  choice: meiner Brüder
  alternative: meiner Geschwister; meiner Verwandten
  rationale: Der hebräische Text verwendet ausdrücklich den maskulinen Plural »Brüder«. Die weitere gemeinschaftliche Reichweite wird nicht durch eine geschlechtsneutrale Formulierung vorentschieden.
- issue: Adressatin des Friedenswunsches
  choice: 'Jerusalem wird als feminine Stadt direkt angeredet: »Friede sei in dir!«'
  alternative: Friede sei in ihr; Möge in dir Friede sein
  rationale: Das feminine Suffix nimmt natürlich die zuvor angesprochene Stadt Jerusalem auf. Die direkte Anrede erhält die poetische Personifikation und vermeidet eine erklärende Auflösung.
- issue: Aussage, Wunsch oder Segenswort
  choice: »Friede sei in dir!«
  alternative: »Friede ist in dir«; »Dir sei Wohlergehen«
  rationale: שָׁלוֹם steht ohne ausgedrücktes Verb. Der deutsche Jussiv gibt den naheliegenden Wunsch- beziehungsweise Segenscharakter wieder, ohne den Satz als bloße Feststellung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht poetischer Syntax. »Um … willen« und die Segensform »Friede sei in dir« wahren den Psalmton, bleiben aber allgemein verständlich. Die feminine direkte Anrede wird im Deutschen durch den Kontext auf Jerusalem bezogen.
