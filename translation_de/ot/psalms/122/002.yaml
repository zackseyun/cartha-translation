lexical_decisions:
- source_word: עֹמְדוֹת
  choice: stehen
  rationale: Das Qal-Partizip Feminin Plural stimmt mit רַגְלֵינוּ überein und bezeichnet einen andauernden Zustand. Das deutsche Präsens gibt diesen Zustand natürlich wieder.
- source_word: הָיוּ
  choice: stehen
  rationale: Das Perfekt von היה bildet zusammen mit dem Partizip eine umschreibende Verbform. Im Kontext des erreichten Ziels wird sie idiomatisch als gegenwärtiger Zustand wiedergegeben; die formalere Vergangenheitsform wird in der Fußnote bewahrt.
- source_word: רַגְלֵינוּ
  choice: unsere Füße
  rationale: Wörtliche und im Deutschen natürliche Wiedergabe des Plurals mit Suffix der 1. Person Plural; sie erhält das körperlich anschauliche Pilgermotiv.
- source_word: בִּשְׁעָרַיִךְ
  choice: in deinen Toren
  rationale: Die Präposition ב wird mit „in“ wiedergegeben. Gemeint kann der Bereich innerhalb der Stadttore sein; die knappe Form wahrt zugleich das Bild des Aufenthalts im Torbereich.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens; eine Anredepartikel wie „o“ steht im Hebräischen nicht und wird daher nicht ergänzt.
