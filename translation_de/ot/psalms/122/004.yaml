  terminology: „Jah“ gibt die Kurzform יָהּ angemessen wieder; „HERRN“ folgt der etablierten deutschen Konvention für das Tetragramm. „Stämme“, „Weisung“ und „danken“ sind kontextgerecht. Die Formulierung vermeidet eine konfessionell einengende Deutung der schwierigen Wendung עֵדוּת לְיִשְׂרָאֵל.
