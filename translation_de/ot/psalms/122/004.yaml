  source_fidelity: 'Die Übersetzung gibt die Satzglieder und Bezüge des Hebräischen zuverlässig wieder: „Dorthin“ bezieht sich auf Jerusalem, עָלוּ wird mit dem Wallfahrtsmotiv „zogen ... hinauf“ treffend erfasst, und der Zweckinfinitiv לְהוֹדוֹת ist korrekt als „um ... zu danken“ wiedergegeben. Die Vergangenheitsform entspricht dem Perfekt und steht auch mit der englischen Audit-Fassung „went up“ im Einklang. „nach der Weisung für Israel“ ist für עֵדוּת לְיִשְׂרָאֵל eine im Kontext gut begründete Wiedergabe; sie macht den normativen Charakter der Wendung sichtbar, ohne mehr festzulegen als der Kontext trägt.'
