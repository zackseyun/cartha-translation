source:
  edition: WLC
  text: שֶׁ/שָּׁ֨ם עָל֪וּ שְׁבָטִ֡ים שִׁבְטֵי יָ֭הּ עֵד֣וּת לְ/יִשְׂרָאֵ֑ל לְ֝/הֹד֗וֹת לְ/שֵׁ֣ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/004.yaml
  text: There the tribes went up, the tribes of Yah, as a testimony for Israel, to give thanks to the name of the LORD.
translation:
  language: de
  text: Dorthin zogen die Stämme hinauf, die Stämme Jahs, nach der Weisung für Israel, um dem Namen des HERRN zu danken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָלוּ
  choice: zogen ... hinauf
  rationale: Das hebräische Perfekt bezeichnet hier am natürlichsten das Hinaufziehen der Stämme nach Jerusalem; die deutsche Form wahrt den Rückblick, ohne den wiederkehrenden Wallfahrtscharakter auszuschließen.
- source_word: שִׁבְטֵי יָהּ
  choice: die Stämme Jahs
  rationale: Die verkürzte Gottesbezeichnung יָהּ wird als „Jah“ wiedergegeben, damit die markante hebräische Form erhalten bleibt.
- source_word: עֵדוּת לְיִשְׂרָאֵל
  choice: nach der Weisung für Israel
  rationale: עֵדוּת kann „Zeugnis“, „Bestimmung“ oder verbindliche Weisung bezeichnen. Im Kontext des vorgeschriebenen Hinaufziehens ist „Weisung“ natürlich und sachlich passend; „nach“ macht die normative Beziehung idiomatisch deutlich.
- source_word: לְהֹדוֹת
  choice: um ... zu danken
  rationale: Der Infinitiv bezeichnet den Zweck des Hinaufziehens; „danken“ gibt die hier naheliegende Bedeutung von ידה im Hifil wieder.
- source_word: שֵׁם יְהוָה
  choice: Name des HERRN
  rationale: Das Tetragramm wird nach verbreiteter deutscher Bibeltradition mit „HERR“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von עֵדוּת לְיִשְׂרָאֵל
  choice: nach der Weisung für Israel
  alternative: als ein Zeugnis für Israel
  rationale: Die Wendung kann formal als „Zeugnis für Israel“ verstanden werden. Der Wallfahrtskontext legt jedoch nahe, dass sie auf die Israel gegebene kultische Bestimmung bzw. Weisung verweist. Die Übersetzung vermeidet eine konfessionelle Ausdeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dorthin“ nimmt das zuvor genannte Jerusalem auf; „zogen ... hinauf“ bewahrt das biblische Motiv der Wallfahrt. Die ungewöhnliche Form „Jah“ bleibt bewusst stehen.
