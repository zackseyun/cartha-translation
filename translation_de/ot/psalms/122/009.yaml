  text: לְ֭מַעַן בֵּית יְהוָ֣ה אֱלֹהֵ֑י/נוּ אֲבַקְשָׁ֖ה ט֣וֹב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/009.yaml
  text: For the sake of the house of Yahweh our God[a], I will seek your good.
translation:
  language: de
  text: Um des Hauses Jahwes, unseres Gottes, willen will ich dein Wohl suchen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dein Gutes“. Gemeint ist Jerusalems Wohlergehen; möglich ist auch: „dein Bestes“ oder „Wohlergehen für dich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: um … willen
  rationale: Gibt den Beweggrund des Sprechers wieder und entspricht der hebräischen Zweck- bzw. Motivangabe in natürlichem, gehobenem Deutsch.
- source_word: בֵּית
  choice: Haus
  rationale: Bewahrt die konkrete hebräische Bezeichnung; im Zusammenhang ist damit der Tempel gemeint.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵינוּ
  choice: unseres Gottes
  rationale: Entspricht der Genitivkonstruktion nach „Haus“ und gibt das Suffix der ersten Person Plural unmittelbar wieder.
- source_word: אֲבַקְשָׁה
  choice: will ich … suchen
  rationale: Die Kohortativform drückt hier Entschlossenheit oder Absicht aus; „will ich“ bewahrt diesen Willensakzent.
- source_word: טוֹב
  choice: Wohl
  rationale: Das substantivisch gebrauchte „Gute“ bezeichnet hier das Wohlergehen Jerusalems. „Wohl“ ist im Deutschen verständlicher als das wörtlichere „Gutes“, ohne den Sinn auf materiellen Wohlstand zu verengen.
- source_word: לָךְ
  choice: dein
  rationale: Das feminine Singularsuffix bezieht sich auf Jerusalem, das direkt angeredet wird; „dein Wohl“ ist eine natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Gottesnamen. Die Wiedergabe als „Jahwe“ bewahrt ihn als Eigennamen und ersetzt ihn nicht durch einen Titel.
- issue: Bedeutung von בֵּית יְהוָה
  choice: Haus Jahwes
  alternative: Tempel Jahwes
  rationale: Im Kontext ist der Tempel gemeint; die wörtlichere Wiedergabe „Haus Jahwes“ erhält jedoch die Ausdrucksweise des hebräischen Textes und bleibt im Deutschen verständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Wendung „um … willen“ passt zum poetischen Register des Psalms; „dein Wohl suchen“ bewahrt die knappe und bewusste Formulierung des Hebräischen.
