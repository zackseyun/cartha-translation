  text: May there be peace within your ramparts[c][b][a], prosperity within your citadels.
translation:
  language: de
  text: Friede sei in deinen Mauern, Sicherheit in deinen Palästen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in deinen Festungen“. Das hebräische Wort kann Paläste oder befestigte, repräsentative Bauten bezeichnen.'
