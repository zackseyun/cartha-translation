  - marker: b
    text: 'Oder: „Wohlergehen“ oder „Ruhe“. Gemeint ist ruhige, ungestörte Sicherheit und Wohlergehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: sei
  rationale: Der Jussiv von היה drückt einen Wunsch oder ein Gebet aus; der deutsche Wunschsatz „Friede sei“ gibt diese Kraft knapp und würdig wieder.
- source_word: שָׁלוֹם
  choice: Friede
  rationale: שָׁלוֹם bezeichnet Frieden, Wohlergehen und Unversehrtheit. „Friede“ ist hier die naheliegende Wiedergabe und passt zum Gebet für Jerusalem.
- source_word: בְּחֵילֵךְ
  choice: in deinen Mauern
  rationale: חֵיל bezeichnet hier die befestigte Umwehrung der Stadt. „In deinen Mauern“ ist idiomatisch und versteht die Präposition lokal im Sinn des umschlossenen Stadtbereichs.
- source_word: שַׁלְוָה
  choice: sichere Ruhe
  rationale: שַׁלְוָה bezeichnet Ruhe, Sicherheit und ungestörtes Wohlergehen. „Sichere Ruhe“ bewahrt diese Bedeutungsbreite besser als das stärker wirtschaftlich geprägte „Wohlstand“.
- source_word: בְּאַרְמְנוֹתָיִךְ
  choice: in deinen Palästen
  rationale: אַרְמוֹן kann einen Palast oder einen befestigten repräsentativen Bau bezeichnen. „Paläste“ ist die direkte, im Psalmenkontext natürliche Wiedergabe; die defensive Nuance wird in einer Fußnote kenntlich gemacht.
