source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד שָׂ֭מַחְתִּי בְּ/אֹמְרִ֣ים לִ֑/י בֵּ֖ית יְהוָ֣ה נֵלֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/001.yaml
  text: A Song of Ascents[a]. Of David. I rejoiced when they said to me[c][b], “Let us go to the house of Yahweh.”
translation:
  language: de
  text: 'Ein Wallfahrtslied.[a] Von David.[b]


    Ich freute mich, als sie zu mir sagten:


    »Lasst uns zum Haus Jahwes gehen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ein Lied der Aufstiege“. Die Überschrift bezeichnet wahrscheinlich ein Lied für die Wallfahrt nach Jerusalem oder eine entsprechende liturgische Sammlung.'
    reason: cultural_note
  - marker: b
    text: „Von David“ kann auch „für David“ oder „David zugehörig“ bedeuten; die hebräische Überschrift legt die genaue Beziehung nicht eindeutig fest.
    reason: textual_ambiguity
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die feste Überschrift bezeichnet die Sammlung der Aufstiegslieder und wird im Deutschen natürlich als „Wallfahrtslied“ wiedergegeben; der mögliche wörtliche Sinn „Lied der Aufstiege“ bleibt in der Fußnote erhalten.
- source_word: לְדָוִד
  choice: Von David
  rationale: „Von David“ lässt die im hebräischen לְ mögliche Beziehung zu David eher offen als eine ausdrückliche Verfasserangabe wie „verfasst von David“.
- source_word: שָׂמַחְתִּי
  choice: Ich freute mich
  rationale: Die Form bezeichnet die Freude des Sprechers; „ich freute mich“ ist im modernen Deutschen natürlich und bewahrt den rückblickenden Aspekt.
- source_word: בְּאֹמְרִים לִי
  choice: als man zu mir sagte
  rationale: Die Konstruktion bezeichnet den Anlass beziehungsweise Zeitpunkt der Freude. Das unbestimmte „man“ gibt den nicht näher bezeichneten pluralischen Sprecherkreis idiomatisch wieder.
- source_word: בֵּית יְהוָה
  choice: zum Haus Jahwes
  rationale: Das Ziel der Bewegung wird im Deutschen mit „zum“ natürlich ausgedrückt; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: נֵלֵךְ
  choice: Lasst uns … gehen
  rationale: Der Imperfekt der ersten Person Plural hat hier im direkten Aufruf eine auffordernde, kohortative Bedeutung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Beziehung der Überschrift zu David
  choice: Von David
  alternative: Für David / verfasst von David
  rationale: Die Präposition לְ kann Autorschaft, Zugehörigkeit, Widmung oder Beziehung ausdrücken. Die knappe Formulierung „Von David“ vermeidet eine ausführliche dogmatische oder historische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Zeilengliederung wird bewahrt; die direkte Rede klingt als gemeinschaftliche Einladung natürlich. „Wallfahrtslied“ ist verständlicher als das formalere „Lied der Aufstiege“, dessen Bild in der Fußnote dokumentiert wird.
