base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/003.yaml
  text: Jerusalem[a], built like a city joined together as one[b],
translation:
  language: de
  text: Jerusalem, als eine Stadt erbaut, die fest in sich zusammengefügt ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jerusalem, gebaut wie eine Stadt, die zu einer Einheit verbunden ist.« Der hebräische Ausdruck betont wahrscheinlich die dicht geschlossene, in sich verbundene Anlage der Stadt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Der Ortsname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: הַבְּנוּיָה
  choice: gebaut
  rationale: Das passive Partizip von בנה beschreibt Jerusalem in seinem gebauten beziehungsweise vollendeten Zustand; „wiederaufgebaut“ wäre zu spezifisch.
- source_word: כְּעִיר
  choice: wie eine Stadt
  rationale: Die Präposition כ markiert einen Vergleich, der mit „wie“ unmittelbar erhalten bleibt.
- source_word: שֶׁחֻבְּרָה
  choice: zusammengefügt
  rationale: Das passive Verb von חבר bezeichnet das Verbinden einzelner Teile und passt sowohl zur baulichen Geschlossenheit als auch zur betonten Einheit.
- source_word: לָּהּ
  choice: in sich
  rationale: Der feminine Rückbezug gilt der Stadt beziehungsweise Jerusalem; „in sich“ gibt die innere Verbindung natürlich wieder, ohne den ungewöhnlichen hebräischen Ausdruck unnötig zu glätten.
- source_word: יַחְדָּו
  choice: zusammen
  rationale: Das Adverb betont Gemeinsamkeit und Einheit und wird ausdrücklich im Verbgefüge „zusammengefügt“ abgebildet.
theological_decisions: []
