base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/000.yaml
  text: A Song of Ascents[a]. Of David. I rejoiced when they said to me[c][b], “Let us go to the house of Yahweh.”
translation:
  language: de
  text: 'Ein Wallfahrtslied.[a] Von David.


    Ich freute mich, als sie zu mir sagten: »Lasst uns zum Haus des HERRN gehen!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ein Lied der Aufstiege«. Gemeint ist wahrscheinlich ein Lied für die Wallfahrt hinauf nach Jerusalem oder aus einer entsprechenden liturgischen Sammlung.'
    reason: cultural_note
  - marker: b
    text: Im Hebräischen steht hier der Gottesname JHWH, traditionell mit »der HERR« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die Wendung bezeichnet wahrscheinlich ein Lied für das Hinaufziehen nach Jerusalem beziehungsweise eine entsprechende liturgische Sammlung. Die natürliche deutsche Wiedergabe vermittelt diesen kultischen Pilgerkontext.
- source_word: לְדָוִד
  choice: Von David
  rationale: Das hebräische לְ kann Verfasserschaft, Zugehörigkeit oder Widmung anzeigen. Die knappe traditionelle Wiedergabe bewahrt die Offenheit der Überschrift weitgehend.
- source_word: שָׂמַחְתִּי בְּאֹמְרִים לִי
  choice: Ich freute mich, als man zu mir sagte
  rationale: Das Partizip steht im Plural, doch das unbestimmte deutsche »man« klingt hier natürlich und lässt die nicht genannten Sprecher offen.
- source_word: בֵּית יְהוָה
  choice: Haus des HERRN
  rationale: »Haus« bildet בֵּית unmittelbar ab und bezeichnet den Tempel. Das Tetragramm יהוה wird nach verbreiteter deutscher Bibelkonvention durch HERR in Kapitälchen wiedergegeben.
- source_word: נֵלֵךְ
  choice: Lasst uns … gehen
  rationale: Der hebräische Kohortativ der ersten Person Plural drückt eine gemeinsame Aufforderung beziehungsweise Absicht aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe ist im Haupttext verständlich und würdevoll; eine Fußnote macht transparent, dass im Hebräischen der Eigenname JHWH steht.
- issue: Bezug der Psalmüberschrift לְדָוִד
  choice: Von David
  alternative: Für David / David zugehörig
  rationale: Die geläufige Formulierung behauptet Verfasserschaft, ohne im Text zusätzliche historische Einzelheiten einzutragen; die grammatische Spannweite wird nicht dogmatisch ausgelegt.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die Psalmüberschrift bleibt knapp abgesetzt; die direkte Rede bewahrt den freudigen gemeinschaftlichen Einladungscharakter.
