  text: בֵּֽ/אלֹהִ֥ים נַעֲשֶׂה חָ֑יִל וְ֝/ה֗וּא יָב֥וּס צָרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/012.yaml
  text: With God we will do valiantly[b][a], and he will trample our adversaries.
translation:
  language: de
  text: Mit Gott werden wir tapfer handeln[a], und er wird unsere Gegner zertreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Durch Gott werden wir tapfer handeln.“ Die hebräische Präposition kann sowohl Gemeinschaft als auch Mittel ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Mit Gott
  rationale: Die Präposition ב kann hier enge Verbindung oder Mittel ausdrücken. „Mit Gott“ ist im Deutschen natürlich und wahrt die Abhängigkeit von Gottes Hilfe, ohne die instrumentale Bedeutung festzulegen.
- source_word: נַעֲשֶׂה חָיִל
  choice: werden wir mächtige Taten vollbringen
  rationale: Die Verbindung עשה חיל ist idiomatisch und bezeichnet kraftvolles beziehungsweise erfolgreiches Handeln. Die Wiedergabe drückt den militärisch-poetischen Sinn natürlich aus.
- source_word: וְהוּא
  choice: und er
  rationale: 'Die Konjunktion und das ausdrückliche Pronomen führen den Gedanken mit Nachdruck fort: Das Volk handelt mit Gott, und er selbst vollzieht den entscheidenden Sieg.'
- source_word: יָבוּס
  choice: wird … zertreten
  rationale: Das Verb bezeichnet das Niedertreten oder Zertrampeln. „Zertreten“ bewahrt das anschauliche martialische Bild.
- source_word: צָרֵינוּ
  choice: unsere Gegner
  rationale: Das Substantiv bezeichnet Bedränger, Feinde oder Widersacher. „Gegner“ ist verständlich, kontextgemäß und bleibt lexikalisch breit.
theological_decisions:
- issue: Handlungsträger beim Sieg
  choice: Der Vers verbindet menschliches Handeln mit Gottes entscheidendem Handeln.
  alternative: Entweder ausschließlich menschliche Leistung oder ausschließlich göttliches Handeln hervorzuheben.
  rationale: 'Der hebräische Text hält beides zusammen: Das Volk vollbringt mit beziehungsweise durch Gott mächtige Taten, und Gott selbst tritt die Gegner nieder. Diese Spannung wird nicht aufgelöst.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter militärisch-poetischer Bildsprache. Die idiomatische Verbindung נַעֲשֶׂה חָיִל wird sinngemäß wiedergegeben; die Mehrdeutigkeit der Präposition wird in der Fußnote erhalten.
