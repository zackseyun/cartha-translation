source:
  edition: WLC
  text: אֱלֹהִ֤ים דִּבֶּ֥ר בְּ/קָדְשׁ֗/וֹ אֶ֫עְלֹ֥זָה אֲחַלְּקָ֥ה שְׁכֶ֑ם וְ/עֵ֖מֶק סֻכּ֣וֹת אֲמַדֵּֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/006.yaml
  text: 'God has spoken in his holiness: “I will exult[a]; I will divide up Shechem[b], and measure out the Valley of Succoth.”'
translation:
  language: de
  text: 'Gott hat in seiner Heiligkeit[b] gesprochen: »Ich will jubeln[a]; ich will Sichem aufteilen und das Tal von Sukkot ausmessen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich will frohlocken.« Manche verstehen diese Worte als Antwort des Psalmisten auf Gottes Rede und nicht als Teil der Äußerung Gottes.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »an seiner heiligen Stätte« oder »bei seiner Heiligkeit«. Der hebräische Ausdruck kann Gottes Heiligkeit selbst oder den Bereich seiner heiligen Gegenwart bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die formal plurale Form steht mit dem singularischen Verb דִּבֶּר und bezeichnet hier eindeutig den einen Gott Israels.
- source_word: דִּבֶּר
  choice: hat gesprochen
  rationale: Das Perfekt bezeichnet eine vollzogene Äußerung, deren Geltung im Zusammenhang fortbesteht; das deutsche Perfekt klingt zugleich natürlich und gegenwärtig.
- source_word: בְּקָדְשׁוֹ
  choice: in seiner Heiligkeit
  rationale: Die knappe Wiedergabe bewahrt die mögliche Beziehung auf Gottes Heiligkeit beziehungsweise den Bereich seiner heiligen Gegenwart, ohne den Ausdruck vorschnell als Heiligtum festzulegen.
- source_word: אֶעְלֹזָה
  choice: ich will jubeln
  rationale: Das Verb bezeichnet freudiges, triumphierendes Frohlocken. »Jubeln« ist im modernen Deutsch verständlich und bewahrt den gehobenen Ton.
- source_word: אֲחַלְּקָה
  choice: ich will aufteilen
  rationale: Im territorialen Zusammenhang geht es um das Teilen beziehungsweise Zuteilen von Land; »aufteilen« gibt diesen Sinn natürlich wieder.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Für den Ortsnamen wird die im Deutschen etablierte biblische Form verwendet.
- source_word: וְעֵמֶק סֻכּוֹת
  choice: das Tal von Sukkot
  rationale: Die Konstruktverbindung bezeichnet das zu Sukkot gehörende beziehungsweise nach Sukkot benannte Tal. »Sukkot« ist eine quellennähere und im heutigen Deutschen gebräuchliche Umschrift.
- source_word: אֲמַדֵּד
  choice: ausmessen
  rationale: Die Intensivform beschreibt das Vermessen und damit implizit das Abstecken oder Zuweisen eines Gebietes; »ausmessen« bewahrt das konkrete Bild.
theological_decisions:
- issue: Sprecherwechsel und Umfang der direkten Rede
  choice: Die auf die Einleitung folgenden Verben werden als Gottes direkte Rede verstanden, einschließlich »Ich will jubeln«.
  alternative: Der Psalmist könnte mit »ich will jubeln« auf Gottes Rede reagieren, während die nachfolgenden Gebietsaussagen wieder oder weiterhin Gottes Worte sind.
  rationale: Die Folge der Verben lässt sich am natürlichsten als zusammenhängender Gottesspruch lesen; insbesondere das Aufteilen Sichems und Ausmessen des Tals von Sukkot bringt Gottes Hoheitsanspruch zum Ausdruck. Da die Sprecherzuordnung von אֶעְלֹזָה jedoch nicht völlig eindeutig ist, wird die Alternative in einer Fußnote erhalten.
- issue: Bedeutung von בְּקָדְשׁוֹ
  choice: »in seiner Heiligkeit«
  alternative: »an seiner heiligen Stätte« oder »bei seiner Heiligkeit«
  rationale: Der hebräische Ausdruck kann Gottes Heiligkeit selbst, seine heilige Gegenwart oder möglicherweise einen heiligen Ort bezeichnen. Die Hauptfassung bewahrt die knappe Abstraktion und die Alternativen werden offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etablierte deutsche Namensform »Sichem« steht neben der quellennahen Umschrift »Sukkot«. Die Fußnotenmarker sind jeweils unmittelbar an der sachlich betroffenen Stelle gesetzt; Marker [b] folgt nach »aufteilen«, obwohl seine Fußnote den einleitenden Ausdruck erläutert, um beide verlangten Marker im Vers sichtbar zu halten.
