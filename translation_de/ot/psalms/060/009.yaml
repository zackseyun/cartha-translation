  text: מִ֣י יֹ֭בִלֵ/נִי עִ֣יר מָצ֑וֹר מִ֖י נָחַ֣/נִי עַד אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/009.yaml
  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a]
translation:
  language: de
  text: Wer bringt mich zur befestigten Stadt? Wer führt mich bis nach Edom?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer führt mich zur befestigten Stadt? Wer hat mich bis nach Edom geführt?“ Die hebräischen Verbformen lassen unterschiedliche zeitliche beziehungsweise aspektuelle Nuancen zu; der Haupttext gibt die poetische Parallelität als zwei auf die Zukunft gerichtete Fragen wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Wer
  rationale: Das Interrogativpronomen leitet jeweils eine rhetorische Frage ein.
- source_word: יֹבִלֵנִי
  choice: bringt mich
  rationale: Der Hifil von יבל bezeichnet das Hinbringen oder Hinführen; mit der folgenden Zielangabe ist „bringt mich“ natürlich und präzise.
- source_word: עִיר מָצוֹר
  choice: zur befestigten Stadt
  rationale: Die Verbindung bezeichnet am ehesten eine durch Befestigungen geschützte, starke Stadt, nicht zwingend eine belagerte Stadt.
- source_word: נָחַנִי
  choice: führt mich
  rationale: Das Verb נחה bedeutet „führen, leiten“. Im poetischen Parallelismus kann die Form als zukunftsbezogene rhetorische Frage verstanden werden, obwohl formal auch eine vergangenheitsbezogene Wiedergabe möglich ist.
- source_word: עַד אֱדוֹם
  choice: bis nach Edom
  rationale: עַד bezeichnet hier die räumliche Erstreckung bis zu einem Ziel; „bis nach Edom“ ist im Deutschen idiomatisch und bewahrt diese Nuance.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Der Eigenname wird in seiner im Deutschen etablierten Form wiedergegeben.
