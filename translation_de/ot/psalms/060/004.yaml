translation:
  language: de
  text: Du hast denen, die dich fürchten, ein Feldzeichen gegeben, damit es hoch erhoben wird[a] um der Wahrheit willen[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit es gezeigt wird“, „damit sie sich sammeln“ oder möglicherweise „damit sie fliehen“. Das hebräische Verb ist schwierig und umstritten.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort qoschet bedeutet wahrscheinlich „Wahrheit“ oder „Wahrhaftigkeit“. Einige alte Übersetzungen und Ausleger verstehen die Zeile anders; daraus ergeben sich Wiedergaben wie „um des Bogens willen“.
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: Du hast gegeben
  rationale: Das Qal Perfekt 2. Person maskulin Singular von נתן richtet sich an Gott. Das deutsche Perfekt bezeichnet die vollendete Handlung mit fortdauernder Bedeutung im Gebetszusammenhang.
- source_word: לִירֵאֶיךָ
  choice: denen, die dich fürchten
  rationale: Die substantivisch gebrauchte Form von ירא bezeichnet Menschen, die Gott in ehrfürchtiger Haltung begegnen; die Formulierung ist im modernen Deutsch natürlich.
- source_word: נֵס
  choice: Feldzeichen
  rationale: נֵס bezeichnet hier ein weithin sichtbares, erhöhtes Zeichen oder militärisches Banner. „Feldzeichen“ bewahrt diese Sammel- und Signalwirkung deutlicher als das im Deutschen mehrdeutige „Banner“.
- source_word: לְהִתְנוֹסֵס
  choice: damit es hoch erhoben wird
  rationale: Der schwierige Infinitiv wird im Zusammenhang mit נֵס als reflexiv-passive Aussage über das Aufrichten bzw. sichtbare Erheben des Feldzeichens verstanden. Andere Deutungen bleiben in der Fußnote erhalten.
- source_word: מִפְּנֵי
  choice: um … willen
  rationale: 'Die Präposition wird hier kausal verstanden: Das Feldzeichen wird aufgrund bzw. zugunsten dessen erhoben, was קֹשֶׁט bezeichnet.'
- source_word: קֹשֶׁט
  choice: der Wahrheit
  rationale: Das poetische Wort bedeutet am wahrscheinlichsten „Wahrheit“ oder „Wahrhaftigkeit“. Die definite deutsche Form ist in der Wendung „um der Wahrheit willen“ idiomatisch.
- source_word: סֶלָה
  choice: Sela
  rationale: Der liturgisch-musikalische Ausdruck ungewisser genauer Bedeutung wird in üblicher deutscher Transliteration beibehalten.
