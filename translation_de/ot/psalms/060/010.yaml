id: PSA.60.10
reference: Psalms 60:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲ/לֹֽא אַתָּ֣ה אֱלֹהִ֣ים זְנַחְתָּ֑/נוּ וְֽ/לֹא תֵצֵ֥א אֱ֝לֹהִ֗ים בְּ/צִבְאוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/010.yaml
  text: Have you not[a], O God, rejected us, and do you not go out, O God[c][b], with our armies?
translation:
  language: de
  text: Hast nicht du, Gott, uns verworfen[a], und ziehst du nicht, Gott, mit unseren Heeren aus[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „uns verstoßen“.'
    reason: lexical_alternative
  - marker: b
    text: '„Ausziehen“ ist hier militärisch gemeint: mit den Heeren in den Kampf ziehen.'
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא
  choice: Hast nicht … und ziehst du nicht …?
  rationale: Die Partikel eröffnet eine rhetorische Frage, die beide koordinierten Aussagen umfasst und Zustimmung erwartet.
- source_word: אַתָּה
  choice: du
  rationale: Das selbstständige Pronomen wird durch die hervorgehobene Stellung „nicht du“ betont, ohne die Aussage mit „du selbst“ zu überzeichnen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die direkte Anrede wird im Deutschen natürlich ohne ein zusätzliches „o“ wiedergegeben; die Wiederholung des Hebräischen bleibt erhalten.
- source_word: זְנַחְתָּנוּ
  choice: uns verworfen
  rationale: „Verwerfen“ gibt die deutliche Zurückweisung prägnant und in einem würdigen, weiterhin verständlichen Register wieder.
- source_word: וְלֹא
  choice: und … nicht
  rationale: Die zweite Negation bleibt innerhalb derselben rhetorischen Frage erhalten und wird nicht als Aufforderung missverstanden.
- source_word: תֵצֵא
  choice: ziehst … aus
  rationale: „Ausziehen“ bewahrt das Bild des Hinausgehens und macht im Zusammenhang mit den Heeren den militärischen Sinn natürlich deutlich.
- source_word: בְּצִבְאוֹתֵינוּ
  choice: mit unseren Heeren
  rationale: Die Präposition bezeichnet hier Begleitung; „Heere“ gibt die militärischen Verbände treffend wieder.
theological_decisions:
- issue: Göttliche Verwerfung in der Klage
  choice: Die unmittelbare Aussage, Gott habe sein Volk verworfen und ziehe nicht mit dessen Heeren aus, bleibt bestehen.
  alternative: „Du hast zugelassen, dass wir verworfen wurden“ oder „es scheint, als hättest du uns verworfen“.
  rationale: Der hebräische Text schreibt Gott Verwerfung und ausbleibende militärische Begleitung direkt zu. Die Klagespannung darf nicht abgeschwächt oder erklärend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage umfasst beide Satzglieder; die doppelte Gottes-Anrede und die theologische Härte der Klage sind bewahrt.
