  source_fidelity: Die Übersetzung gibt die rhetorische Frage von הֲלֹא angemessen wieder. Das hervorgehobene „du“, die zweimalige Anrede „Gott“, das Perfekt „hast ... verworfen“ für זְנַחְתָּנוּ und das imperfektische, fortdauernde „ziehst ... aus“ für תֵצֵא sind sachgerecht. „Mit unseren Heeren“ trifft die begleitende militärische Bedeutung von בְּצִבְאוֹתֵינוּ.
