  text: מוֹאָ֤ב סִ֬יר רַחְצִ֗/י עַל אֱ֭דוֹם אַשְׁלִ֣יךְ נַעֲלִ֑/י עָ֝לַ֗/י פְּלֶ֣שֶׁת הִתְרֹעָֽעִֽי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/008.yaml
  text: Moab is my washbasin[a]; on Edom I cast my sandal; over Philistia[b], shout in triumph for me.
translation:
  language: de
  text: Moab ist meine Waschschüssel[a]; auf Edom werfe ich meine Sandale. Philistäa, jauchze über mich![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Topf meines Waschens“; traditionell auch „Waschtopf“. Das Bild drückt Erniedrigung und Unterwerfung aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Form ist schwierig. Nach der masoretischen Punktierung ist sie ein an Philistäa gerichteter Befehl; עָלַי bedeutet „über mich“. Traditionell wird auch übersetzt: „Über Philistäa juble ich“ oder „Über Philistäa erhebe ich den Siegesruf“.'
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: mein Waschbecken
  rationale: סִיר bezeichnet ein Gefäß oder Becken, רַחְצִי bestimmt es als Waschgefäß. „Waschbecken“ gibt das konkrete, erniedrigende Bild in heutigem Deutsch natürlich wieder.
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: werfe ich meine Sandale
  rationale: Die Hifil-Form von שלך bedeutet „werfen“; נַעַל bezeichnet Fußbekleidung. „Sandale“ entspricht dem antiken Umfeld, während „werfe“ im modernen Deutsch klar und poetisch tragfähig ist.
- source_word: עַל אֱדוֹם
  choice: auf Edom
  rationale: עַל wird räumlich wiedergegeben und bewahrt das Bild, dass die Sandale als Zeichen der Herrschaft auf Edom geworfen wird.
- source_word: עָלַי פְּלֶשֶׁת
  choice: über Philistäa … mir
  rationale: Die schwierige Verbindung wird so wiedergegeben, dass Philistäa der Bereich der triumphierenden Herrschaft ist und das Suffix der ersten Person in „mir“ erhalten bleibt.
- source_word: הִתְרֹעָעִי
  choice: jauchze … zu
  rationale: Die feminine Singularform ist nach der masoretischen Punktierung ein Imperativ an Philistäa. Das Verb bezeichnet einen lauten Jubel- oder Kampfruf; „jauchze mir zu“ bewahrt den Ruf und den ironischen Unterwerfungston.
- source_word: מוֹאָב / אֱדוֹם / פְּלֶשֶׁת
  choice: Moab / Edom / Philistäa
  rationale: Die Orts- und Völkernamen werden in ihren etablierten deutschen Formen wiedergegeben; „Philistäa“ bezeichnet hier das Land beziehungsweise Staatsgebiet.
theological_decisions:
- issue: Aussagekraft des an Philistäa gerichteten Imperativs הִתְרֹעָעִי
  choice: 'Ironischer Unterwerfungsbefehl: „Über Philistäa jauchze mir zu!“'
  alternative: „Über Philistäa juble ich“ beziehungsweise „Über Philistäa erhebe ich den Siegesruf“
  rationale: Der masoretische Text bietet grammatisch einen femininen Singularimperativ, passend zu Philistäa als Land. Im Zusammenhang der bezwungenen Völker ist der Befehl wahrscheinlich ironisch. Die alternative traditionelle Auffassung als Aussage der ersten Person bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles poetisches Deutsch. Die kurzen Herrschaftsbilder und der Parallelismus bleiben erhalten. „Jauchze mir zu“ macht den Imperativ und das Suffix hörbar, ohne die schwierige Stelle dogmatisch zu glätten.
