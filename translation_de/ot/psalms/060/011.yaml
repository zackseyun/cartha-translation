id: PSA.60.11
reference: Psalms 60:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָֽבָ/ה לָּ֣/נוּ עֶזְרָ֣ת מִ/צָּ֑ר וְ֝/שָׁ֗וְא תְּשׁוּעַ֥ת אָדָם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/011.yaml
  text: Give us help against the adversary[c][b][a], for the salvation of man is vain.
translation:
  language: de
  text: Gib uns Hilfe gegen den Feind[a], denn Rettung[b] durch Menschen ist vergeblich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der Bedrängnis“; das hebräische Wort צַר kann sowohl „Bedrängnis“ als auch „Bedränger, Feind“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Befreiung“ beziehungsweise „Sieg“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה לָּנוּ
  choice: Gib uns
  rationale: Die im Gebet gebrauchte Aufforderungsform wird im Deutschen direkt und natürlich mit „Gib uns“ wiedergegeben.
- source_word: עֶזְרַת
  choice: Hilfe
  rationale: „Hilfe“ entspricht dem Konstruktstatus des Substantivs und bewahrt den knappen, eindringlichen Gebetston.
- source_word: מִצָּר
  choice: gegen den Feind
  rationale: צַר kann Bedrängnis oder einen Bedränger beziehungsweise Feind bezeichnen. Im militärischen Zusammenhang des Psalms liegt die persönliche Bedeutung nahe; מן wird mit „Hilfe“ idiomatisch als „gegen“ wiedergegeben.
- source_word: וְשָׁוְא
  choice: denn … ist vergeblich
  rationale: שָׁוְא bezeichnet Leere, Nichtigkeit oder Wirkungslosigkeit. „Vergeblich“ ist gegenwärtiges, würdiges Deutsch; die Konjunktion wird gemäß dem begründenden Sinnzusammenhang mit „denn“ wiedergegeben.
- source_word: תְּשׁוּעַת
  choice: Rettung
  rationale: Das Substantiv kann Rettung, Befreiung oder Sieg bedeuten. „Rettung“ bewahrt die grundlegende Bedeutung, ohne den militärischen Kontext auszuschließen.
- source_word: אָדָם
  choice: durch Menschen
  rationale: אָדָם bezeichnet hier die Menschheit allgemein im Gegensatz zu Gottes Hilfe. „Durch Menschen“ gibt in natürlichem Deutsch die menschliche Quelle beziehungsweise Vermittlung der erhofften Rettung wieder.
theological_decisions:
- issue: Göttliche Hilfe im Gegensatz zu menschlicher Rettung
  choice: Die von Menschen ausgehende Rettung wird im unmittelbaren Zusammenhang als wirkungslos bezeichnet.
  alternative: Eine allgemeine Aussage über die Vergeblichkeit jedes menschlichen Handelns.
  rationale: Der Vers stellt die erbetene Hilfe Gottes der Unzulänglichkeit menschlicher Rettung gegenüber. Die Übersetzung weitet diese Aussage nicht zu einer umfassenden Lehre über alle menschlichen Bemühungen aus.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knappem, würdigem Gebetston. Die Bild- und Bedeutungsdichte des hebräischen Parallelismus bleibt erhalten; echte lexikalische Alternativen werden in Fußnoten ausgewiesen.
