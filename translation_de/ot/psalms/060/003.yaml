id: PSA.60.3
reference: Psalms 60:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִרְאִ֣יתָה עַמְּ/ךָ֣ קָשָׁ֑ה הִ֝שְׁקִיתָ֗/נוּ יַ֣יִן תַּרְעֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/003.yaml
  text: You have shown your people hard things[a]; you have made us drink wine of staggering.
translation:
  language: de
  text: Du hast dein Volk Schweres erleben lassen; du hast uns Wein trinken lassen, der uns taumeln lässt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: Wein des Taumelns; auch möglich: Wein des Schwankens oder der Benommenheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְאִיתָה
  choice: hast … erleben lassen
  rationale: Der Hifil von ראה bedeutet wörtlich „sehen lassen/zeigen“. In Verbindung mit dem substantivisch gebrauchten קָשָׁה bezeichnet er hier natürlich das von Gott veranlasste Erleben von Schwerem.
- source_word: עַמְּךָ
  choice: dein Volk
  rationale: עַם bezeichnet hier Gottes Volk; „dein Volk“ ist im Deutschen natürlich und bewahrt den Bundesbezug.
- source_word: קָשָׁה
  choice: Schweres
  rationale: Das Adjektiv wird substantivisch gebraucht und bezeichnet harte, bedrückende Erfahrungen, ohne diese näher festzulegen.
- source_word: הִשְׁקִיתָנוּ
  choice: du hast uns … trinken lassen
  rationale: Der Hifil von שׁקה bedeutet „zu trinken geben/trinken lassen“. Die Formulierung bewahrt die kausative Aussage, ohne unnötig einen Zwang zu präzisieren.
- source_word: יַיִן
  choice: Wein
  rationale: Die konkrete Bildsprache des hebräischen Textes wird unverändert beibehalten.
- source_word: תַּרְעֵלָה
  choice: der uns taumeln lässt
  rationale: Das seltene Substantiv bezeichnet Taumeln, Schwanken oder eine benommene Desorientierung. Der Relativsatz ist idiomatisches modernes Deutsch und gibt die Wirkung des Weins anschaulich wieder.
theological_decisions:
- issue: Bildhafte Bedeutung des Weins
  choice: Die Weinmetapher bleibt stehen und beschreibt eine von Gott zugemutete Erfahrung von Not und Desorientierung.
  alternative: Die Metapher ausdrücklich als Gericht, Leiden oder Verwirrung auflösen oder wörtlichen Weingenuss annehmen.
  rationale: Der Parallelismus mit dem vorausgehenden „Schweres“ stützt eine bildhafte Aussage. Die Übersetzung bewahrt das Bild und legt seine genaue theologische Nuance nicht enger fest als der Ausgangstext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schweres erleben lassen“ vermittelt den hebräischen Kausativ natürlicher als das missverständliche „Schweres gezeigt“. Der parallele Satzbau und die eindringliche Weinmetapher bleiben erhalten.
