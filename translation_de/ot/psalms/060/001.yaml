source:
  edition: WLC
  text: אֱ֭לֹהִים זְנַחְתָּ֣/נוּ פְרַצְתָּ֑/נוּ אָ֝נַ֗פְתָּ תְּשׁ֣וֹבֵ֥ב לָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/001.yaml
  text: God[a], you have rejected us; you have broken us through; you have been angry[b]. Restore us.
translation:
  language: de
  text: Gott, du hast uns verworfen, du hast eine Bresche in uns geschlagen; du warst zornig. Stell uns wieder her.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wende dich uns wieder zu.“ Das Hebräische kann sowohl die Wiederherstellung des Volkes als auch Gottes erneute Zuwendung zu ihm ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Anrede ist im Deutschen ohne das heute feierlich oder altertümlich wirkende „O“ klar erkennbar.
- source_word: זְנַחְתָּנוּ
  choice: du hast uns verworfen
  rationale: „Verwerfen“ gibt die bewusste Zurückweisung klar wieder und passt zum würdevollen Ton eines Klagepsalms.
- source_word: פְרַצְתָּנוּ
  choice: du hast eine Bresche in uns geschlagen
  rationale: Die idiomatische deutsche Wendung bewahrt das konkrete Bild des Durchbrechens oder Aufreißens, ohne das missverständliche „du hast uns durchbrochen“ zu verwenden.
- source_word: אָנַפְתָּ
  choice: du warst zornig
  rationale: Die knappe Form gibt den göttlichen Zorn unverstärkt wieder und fügt sich natürlich in die Reihe der Aussagen ein.
- source_word: תְּשׁוֹבֵב לָנוּ
  choice: Stell uns wieder her
  rationale: Die Bitte verlangt eine Umkehrung des zuvor beschriebenen Gerichts. Da die hebräische Form auch als Bitte um Gottes erneute Zuwendung verstanden werden kann, wird diese Möglichkeit in einer Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung der Schlussbitte תְּשׁוֹבֵב לָנוּ
  choice: Bitte um Wiederherstellung des Volkes
  alternative: Bitte an Gott, sich seinem Volk wieder zuzuwenden
  rationale: Beide Deutungen passen sprachlich und inhaltlich zur Klage. Der Haupttext bezeichnet die erbetene Wiederherstellung, während die Fußnote die relationale Lesart offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Breschenmetapher bleibt in einer geläufigen deutschen Wendung erhalten; die echte Mehrdeutigkeit der Schlussbitte wird nicht stillschweigend aufgelöst.
