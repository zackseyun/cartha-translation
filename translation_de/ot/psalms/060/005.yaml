base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/005.yaml
  text: So that your beloved ones may be delivered[b][a], save with your right hand and answer me.
translation:
  language: de
  text: Damit deine Geliebten gerettet[a] werden, rette mit deiner rechten Hand und antworte uns.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „befreit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die überlieferte Schreibung lautet „antworte uns“; die vorzulesende Lesung (Qere) lautet: „antworte mir“.'
    reason: textual_variant
lexical_decisions:
- source_word: לְמַעַן
  choice: Damit
  rationale: Gibt die Zweck- beziehungsweise Ergebnisbeziehung knapp und natürlich wieder.
- source_word: יֵחָלְצוּן
  choice: befreit werden
  rationale: Das Nifal von חלץ bezeichnet hier das Herausgerissen- oder Gerettetwerden; „befreit werden“ bewahrt das Bild, ohne es auszudeuten.
- source_word: יְדִידֶיךָ
  choice: deine Geliebten
  rationale: Bewahrt sowohl den Plural als auch den persönlichen, von Zuneigung geprägten Sinn.
- source_word: הוֹשִׁיעָה
  choice: rette
  rationale: Direkte und idiomatische Wiedergabe des Hifil-Imperativs von ישׁע.
- source_word: יְמִינְךָ
  choice: mit deiner rechten Hand
  rationale: Bewahrt das konkrete Bild der rechten Hand als Mittel göttlichen Rettungshandelns.
- source_word: ו/ענ/נו
  choice: und antworte uns
  rationale: Die überlieferte Konsonantenfolge und die im WLC angezeigte Lesetradition ermöglichen die pluralische Bitte; die abweichende singularische Lesart wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Bild von Gottes rechter Hand
  choice: Das anthropomorphe Bild „mit deiner rechten Hand“ bleibt erhalten.
  alternative: „durch deine Macht“
  rationale: Das hebräische Bild ist poetisch und theologisch bedeutsam und sollte nicht in eine Abstraktion aufgelöst werden.
- issue: Objektsuffix der abschließenden Bitte
  choice: „antworte uns“ im Haupttext
  alternative: „antworte mir“
  rationale: Die im vorgelegten WLC-Text erkennbare masoretische Überlieferung ist komplex; die pluralische Lesart passt zur gemeinschaftlichen Bitte, während die singularische Lesart als echte Textvariante ausgewiesen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Gebetssprache. Die Parallelität und das konkrete Bild der rechten Hand bleiben erhalten; die textliche Spannung zwischen „uns“ und „mir“ wird nicht eingeebnet.
