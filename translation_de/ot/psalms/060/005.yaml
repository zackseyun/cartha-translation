  verdict: revise
  source_fidelity: Die Zweckpartikel, der Plural von „deine Geliebten“, der Rettungsimperativ und das Bild der rechten Hand sind zutreffend wiedergegeben. Für ועננו ist „antworte uns“ als Ketiv-nahe Lesung vertretbar; die Qere-Lesung „antworte mir“ soll ausdrücklich als solche bezeichnet werden.
  naturalness: „Damit deine Geliebten gerettet werden, rette mit deiner rechten Hand und antworte uns“ ist knappes, würdiges und idiomatisches modernes Bibeldeutsch. „Gerettet werden“ trifft den Gebets- und Rettungskontext etwas natürlicher als „befreit werden“, das im Deutschen leichter an eine Befreiung aus Gefangenschaft denken lässt.
  terminology: „Geliebte“, „rette“ und „rechte Hand“ bewahren die personale und poetische Sprache des Hebräischen. Die Fußnote zur Schlussformulierung muss Ketiv und Qere klar unterscheiden, statt lediglich von einer unspezifischen anderen Lesart zu sprechen.
