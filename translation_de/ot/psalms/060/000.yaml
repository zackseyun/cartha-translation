  text: לַ֭/מְנַצֵּחַ עַל שׁוּשַׁ֣ן עֵד֑וּת מִכְתָּ֖ם לְ/דָוִ֣ד לְ/לַמֵּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/000.yaml
  text: 'For the choirmaster: according to “Lily of Testimony.”[a] A miktam[b] of David[c], for teaching when he fought against Aram-naharaim and Aram-zobah, and Joab returned and struck down twelve thousand of Edom in the Valley of Salt.'
translation:
  language: de
  text: Für den Chorleiter. Nach »Lilie des Zeugnisses«.[a] Ein Miktam[b] Davids,[c] zum Lehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise: »nach der Melodie ›Lilie des Zeugnisses‹«. Das Hebräische bewahrt hier vermutlich einen musikalischen oder liturgischen Titel; seine genaue Bedeutung ist ungewiss.'
    reason: lexical_alternative
  - marker: b
    text: »Miktam« ist eine hebräische Gattungs- oder Musikbezeichnung unbekannter Bedeutung.
    reason: lexical_alternative
  - marker: c
    text: »Davids« kann auch »von David« oder »für David« bedeuten; die hebräische Form kann Verfasserschaft, Zuordnung oder Widmung ausdrücken.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Die Bezeichnung richtet sich in Psalmüberschriften an den musikalischen Leiter. »Chorleiter« gibt diese liturgische Funktion knapp und allgemein verständlich wieder.
- source_word: עַל
  choice: Nach
  rationale: In Psalmüberschriften kann עַל eine Melodie oder musikalische Vorgabe einführen. »Nach« lässt die genaue technische Bedeutung offen.
- source_word: שׁוּשַׁן עֵדוּת
  choice: »Lilie des Zeugnisses«
  rationale: Die Wendung ist wahrscheinlich ein musikalischer oder liturgischer Titel. Eine relativ formale Wiedergabe bewahrt die Unsicherheit über ihren genauen Bezug.
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Die genaue Bedeutung dieser hebräischen Gattungs- oder Musikbezeichnung ist unbekannt; eine Transliteration vermeidet eine spekulative Festlegung.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der deutsche Genitiv bewahrt in knapper Form die mögliche Beziehung zu David, ohne im Haupttext ausdrücklich zwischen Verfasserschaft, Zuordnung und Widmung zu entscheiden.
- source_word: לְלַמֵּד
  choice: zum Lehren
  rationale: Die Infinitivkonstruktion bezeichnet einen Zweck. »Zum Lehren« gibt diesen Zweck eng am Hebräischen und dennoch verständlich wieder.
theological_decisions:
- issue: Art der Beziehung des Psalms zu David
  choice: Davids
  alternative: von David; für David
  rationale: Das hebräische לְ kann Verfasserschaft, Zuordnung oder Widmung anzeigen. Die Übersetzung soll diese Möglichkeiten nicht dogmatisch auf eine einzige festlegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Form einer Psalmüberschrift bleibt erhalten. Der bereitgestellte hebräische Text endet bei לְלַמֵּד (»zum Lehren«); die im englischen Konsultationstext folgende historische Situationsangabe wurde daher nicht ergänzt.
