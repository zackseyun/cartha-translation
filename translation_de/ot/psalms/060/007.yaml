  text: Gilead is mine[a], and Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my scepter.
translation:
  language: de
  text: Gilead gehört mir, und Manasse gehört mir; Efraim ist die Stärke meines Hauptes; Juda ist mein Herrscherstab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Gesetzgeber“; auch: „mein Zepter“. Das hebräische Wort kann einen Herrscher, der Anordnungen erlässt, oder den Stab als Zeichen seiner Herrschaft bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִי
  choice: gehört mir
  rationale: Die Präposition mit dem Suffix der 1. Person Singular drückt Besitz oder Zugehörigkeit aus; „gehört mir“ ist im Deutschen natürlich und unmittelbar.
- source_word: גִלְעָד
  choice: Gilead
  rationale: Etablierte deutsche Form des Ortsnamens.
- source_word: מְנַשֶּׁה
  choice: Manasse
  rationale: Etablierte deutsche Form des Stammes- und Gebietsnamens.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Gängige moderne deutsche Schreibung des Stammesnamens.
- source_word: מָעוֹז
  choice: Schutzwehr
  rationale: Das Substantiv bezeichnet einen befestigten Ort oder eine schützende Macht. „Schutzwehr“ bewahrt das militärische Bild und verbindet sich im Deutschen sinnvoll mit „Haupt“.
- source_word: רֹאשִׁי
  choice: meines Hauptes
  rationale: Die konkrete Metapher „mein Haupt“ bleibt erhalten; „Haupt“ trägt dem würdevoll-poetischen Register des Psalms Rechnung.
- source_word: מְחֹקְקִי
  choice: mein Herrscherstab
  rationale: Das Wort kann einen Gebietenden beziehungsweise Gesetzgeber oder den Stab als Zeichen seiner Herrschaft bezeichnen. „Herrscherstab“ bewahrt das königliche Symbol und vermeidet eine vorschnelle Festlegung auf eine Person.
theological_decisions:
- issue: Deutung von מְחֹקְקִי im königlichen Bildfeld
  choice: mein Herrscherstab
  alternative: mein Gesetzgeber; mein Zepter
  rationale: Der Vers weist den Stämmen militärische und königliche Funktionen zu. „Herrscherstab“ gibt die Herrschaftsmetapher wieder, während die lexikalisch mögliche personale Deutung in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Bildsprache. „Schutzwehr meines Hauptes“ ist bewusst bildhaft und leicht formal, ohne die ungewöhnliche hebräische Metapher aufzulösen.
