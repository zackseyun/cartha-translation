  text: הִרְעַ֣שְׁתָּה אֶ֣רֶץ פְּצַמְתָּ֑/הּ רְפָ֖/ה שְׁבָרֶ֣י/הָ כִי מָֽטָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/002.yaml
  text: You have shaken the earth; you have split it open. Heal its fractures[a], for it is tottering.
translation:
  language: de
  text: Du hast die Erde[a] erschüttert, du hast sie aufgerissen. Heile ihre Risse, denn sie wankt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land“. Das hebräische אֶרֶץ kann sowohl die Erde als auch ein bestimmtes Land bezeichnen; der poetische Zusammenhang lässt beide Bedeutungsnuancen zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְעַשְׁתָּה
  choice: du hast erschüttert
  rationale: Das Hifil von רָעַשׁ bezeichnet das Verursachen eines Bebens oder Erzitterns. „Erschüttert“ gibt die kausative Bedeutung natürlich und poetisch wieder.
- source_word: אֶרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann sowohl die Erde als auch ein bestimmtes Land bezeichnen. „Erde“ passt unmittelbar zum Bild eines Bebens, ohne eine mögliche Anspielung auf das Land auszuschließen.
- source_word: פְּצַמְתָּהּ
  choice: du hast sie aufgerissen
  rationale: Das Verb bezeichnet ein Aufbrechen oder Zerreißen. „Aufgerissen“ führt anschaulich zu den anschließend genannten Rissen hin.
- source_word: רְפָה
  choice: heile
  rationale: Der Imperativ von רָפָא bedeutet gewöhnlich „heilen“. Die personifizierende Metapher des hebräischen Textes bleibt dadurch erhalten.
- source_word: שְׁבָרֶיהָ
  choice: ihre Risse
  rationale: שֶׁבֶר kann einen Bruch, Riss oder eine Bresche bezeichnen. „Risse“ passt prägnant zum Erdbebenbild und verbindet sich im Deutschen natürlich mit „heilen“.
- source_word: כִי
  choice: denn
  rationale: כִי leitet hier die Begründung der Bitte ein. „Denn“ ist knapp und entspricht dem gehobenen poetischen Ton.
- source_word: מָטָה
  choice: sie wankt
  rationale: Das Verb bezeichnet ein Neigen, Wanken oder Nachgeben. „Sie wankt“ bewahrt das Bild fortdauernder Instabilität, ohne einen bereits vollendeten Zusammenbruch auszudrücken.
