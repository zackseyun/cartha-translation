source:
  edition: WLC
  text: רַבַּת֮ שָֽׂבְעָה לָּ֪/הּ נַ֫פְשֵׁ֥/נוּ הַ/לַּ֥עַג הַ/שַּׁאֲנַנִּ֑ים הַ֝/בּ֗וּז לִ/גְאֵ֥יוֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/004.yaml
  text: Our soul has had more than enough of the mockery of those at ease[b][a], the contempt of the proud.
translation:
  language: de
  text: Unsere Seele hat mehr als genug vom Spott der Sorglosen, von der Verachtung der Hochmütigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַבַּת
  choice: mehr als genug
  rationale: Das adverbial gebrauchte Wort verstärkt die Aussage bis zum Übermaß; zusammen mit שָׂבְעָה gibt „mehr als genug“ die belastende Übersättigung natürlich wieder.
- source_word: שָׂבְעָה
  choice: hat … genug
  rationale: Das Verb bedeutet „satt sein/werden, erfüllt sein“. In Verbindung mit רַבַּת und etwas Unerfreulichem entspricht die deutsche Wendung „mehr als genug haben“ dem hebräischen Sinn.
- source_word: לָּהּ
  choice: in der deutschen Wendung nicht eigens wiedergegeben
  rationale: Das feminine pronominale Element bezieht sich wahrscheinlich auf נַפְשֵׁנוּ und verstärkt idiomatisch das Erfülltsein der Seele; eine ausdrückliche Wiedergabe wie „für sich“ wäre im Deutschen unnatürlich.
- source_word: נַפְשֵׁנוּ
  choice: Unsere Seele
  rationale: Die kollektive Einzahl und das poetische Bild des Hebräischen bleiben erhalten; gemeint ist das gemeinsame innere Selbst der Betenden.
- source_word: הַלַּעַג
  choice: Spott
  rationale: Das Substantiv bezeichnet höhnendes, verspottendes Reden. „Spott“ ist prägnant und im Deutschen idiomatisch.
- source_word: הַשַּׁאֲנַנִּים
  choice: der Sorglosen
  rationale: Das Wort bezeichnet Menschen, die ungestört und selbstsicher leben, oft mit dem Beiklang selbstzufriedener Unbekümmertheit. „Sorglose“ bewahrt diese Offenheit besser als das stärker wertende „Selbstgefällige“.
- source_word: הַבּוּז
  choice: Verachtung
  rationale: Das Wort bezeichnet Geringschätzung beziehungsweise verächtliche Behandlung und bildet eine passende Parallele zu „Spott“.
- source_word: לִגְאֵיוֹנִים
  choice: der Hochmütigen
  rationale: Die Form bezeichnet stolze, überhebliche Menschen. „Hochmütige“ gibt den negativen Sinn deutlich und würdevoll wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Psalmsprache. Die parallelen Präpositionalgruppen „vom Spott …, von der Verachtung …“ erhalten die Struktur des hebräischen Parallelismus. „Unsere Seele“ bewahrt bewusst die kollektive Einzahl des Ausgangstextes.
