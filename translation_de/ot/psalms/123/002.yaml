  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּ֨ה כְ/עֵינֵ֪י עֲבָדִ֡ים אֶל יַ֤ד אֲֽדוֹנֵי/הֶ֗ם כְּ/עֵינֵ֣י שִׁפְחָה֮ אֶל יַ֪ד גְּבִ֫רְתָּ֥/הּ כֵּ֣ן עֵ֭ינֵי/נוּ אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ עַ֝֗ד שֶׁ/יְּחָנֵּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/002.yaml
  text: Look[a], as the eyes of servants are toward the hand of their masters, as the eyes of a female servant are toward the hand of her mistress, so our eyes are toward Yahweh our God[b], until he shows us favor.
translation:
  language: de
  text: 'Sieh: Wie die Augen der Diener auf die Hand ihrer Herren gerichtet sind und wie die Augen einer Magd auf die Hand ihrer Herrin, so sind unsere Augen auf Jahwe, unseren Gott, gerichtet, bis er uns Gnade erweist.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „bis er sich über uns erbarmt“ oder „bis er uns seine Gunst schenkt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel leitet den Vergleich ein. „Sieh“ bewahrt ihren hinweisenden Nachdruck in natürlichem, würdigem Deutsch.
- source_word: כְעֵינֵי
  choice: wie die Augen
  rationale: Das Präfix כְּ kennzeichnet den Vergleich; die Formulierung erhält zugleich den poetischen Parallelismus.
- source_word: עֲבָדִים
  choice: Diener
  rationale: Das Wort kann Diener oder Sklaven bezeichnen. Im Bild steht die abhängige, aufmerksame Ausrichtung auf einen Hausherrn im Vordergrund; „Diener“ ist hier natürlich, ohne den Abhängigkeitsaspekt aufzuheben.
- source_word: יַד
  choice: Hand
  rationale: Die konkrete Bildsprache bleibt erhalten; die Hand kann dabei sowohl Weisung als auch Versorgung und Handeln des Höhergestellten andeuten.
- source_word: אֲדֹנֵיהֶם
  choice: ihrer Herren
  rationale: Die Pluralform mit Suffix wird direkt wiedergegeben und passt zum häuslichen Vergleich.
- source_word: שִׁפְחָה
  choice: Magd
  rationale: Das Substantiv bezeichnet ausdrücklich eine weibliche Dienerin beziehungsweise Sklavin. „Magd“ bewahrt Geschlecht und Haushaltskontext knapp und verständlich.
- source_word: גְּבִרְתָּהּ
  choice: ihrer Herrin
  rationale: Die weibliche Haushaltsvorsteherin wird direkt und parallel zu „Herren“ wiedergegeben.
- source_word: כֵּן
  choice: so
  rationale: Kennzeichnet prägnant den Hauptsatz des Vergleichs.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵינוּ
  choice: unseren Gott
  rationale: Die Zugehörigkeitsform der ersten Person Plural wird direkt bewahrt; der Akkusativ folgt im Deutschen auf „auf“.
- source_word: עַד שֶׁיְחָנֵּנוּ
  choice: bis er uns Gnade erweist
  rationale: חנן bezeichnet gnädige Zuwendung beziehungsweise das Gewähren von Gunst. „Gnade erweist“ ist im Deutschen natürlich, würdig und hält den Handlungsaspekt fest.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen; „Jahwe“ bewahrt ihn, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Bedeutungsnuance von חנן im Schlusssatz
  choice: bis er uns Gnade erweist
  alternative: bis er sich über uns erbarmt / bis er uns seine Gunst schenkt
  rationale: Das Verb bezeichnet gnädige Zuwendung und kann kontextuell auch als Erbarmen ausgedrückt werden. Der Haupttext wahrt den Grundsinn der Gnade; die Fußnote erhält die möglichen Nuancen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem Parallelismus. „Auf die Hand … gerichtet“ erhält das konkrete hebräische Bild; „Magd“ gibt die weibliche Form knapp wieder. Die Alternative „Sklaven/Sklavin“ wurde nicht in eine Fußnote aufgenommen, da der Vers den Status nicht näher bestimmt und „Diener/Magd“ im Haupttext die abhängige Haushaltsbeziehung angemessen vermittelt.
