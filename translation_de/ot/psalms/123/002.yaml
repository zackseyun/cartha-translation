  source_fidelity: 'Der Vergleich ist vollständig und strukturell treffend wiedergegeben: die Augen der Diener auf die Hand ihrer Herren, die Augen der Magd auf die Hand ihrer Herrin und entsprechend Israels Augen auf Jahwe, seinen Gott. „Bis er uns Gnade erweist“ gibt יְחָנֵּנוּ angemessen als gnädiges Handeln zugunsten der Betenden wieder, ohne die mögliche Nuance des Erbarmens auszuschließen.'
