  terminology: „Jahwe“ gibt den Gottesnamen konsequent wieder. „Diener/Herren“ sowie „Magd/Herrin“ bewahren die geschlechtliche und soziale Parallelisierung des hebräischen Haushaltsbildes. „Magd“ hat einen bewusst würdigen, bibelsprachlich etablierten Klang, ist hier aber weiterhin verständlich. Die Fußnote hält die tragfähigen Alternativen zu חנן bereit.
