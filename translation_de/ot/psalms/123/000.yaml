lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die Überschrift bezeichnet ein Lied der »Aufstiege«; im Kontext der Psalmen 120–134 ist »Wallfahrtslied« eine natürliche deutsche Wiedergabe, ohne die wörtliche Bildsprache in der Fußnote zu verschweigen.
- source_word: נָשָׂאתִי אֶת עֵינַי
  choice: Zu dir erhebe ich meine Augen
  rationale: Die deutsche Präsensform gibt die gegenwärtige Gebetshaltung idiomatisch wieder; das hebräische Perfekt beschreibt hier das vollzogene und fortdauernde Ausrichten der Augen.
- source_word: הַיֹּשְׁבִי בַּשָּׁמָיִם
  choice: der du in den Himmeln thronst
  rationale: Das Partizip von ישׁב bedeutet wörtlich »sitzen/wohnen« und kann bei Gott königliches Thronen ausdrücken. Der Plural »Himmel« wird als »in den Himmeln« sichtbar erhalten.
theological_decisions:
- issue: Königlicher Unterton von ישׁב
  choice: thronst
  alternative: sitzt / wohnst
  rationale: »Thronst« bringt den im Gottesprädikat naheliegenden königlichen Sinn zur Geltung; die wörtlicheren Möglichkeiten werden in der Fußnote genannt, damit die lexikalische Offenheit erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Zeilenführung. »Wallfahrtslied« ist allgemein verständlich; »in den Himmeln« bewahrt bewusst die hebräische Pluralform.
