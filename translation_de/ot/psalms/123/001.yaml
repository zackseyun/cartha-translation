  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אֵ֭לֶי/ךָ נָשָׂ֣אתִי אֶת עֵינַ֑/י הַ֝/יֹּשְׁבִ֗י בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/001.yaml
  text: A Song of Ascents[a]. To you I lift up my eyes[b], O you who are enthroned in the heavens.
translation:
  language: de
  text: 'Ein Aufstiegslied.[a]


    Zu dir erhebe ich meine Augen,


    du, der in den Himmeln thronst.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Lied der Aufstiege“; möglich ist auch „Wallfahrtslied“. Die Überschrift legt nicht eindeutig fest, worauf sich die Aufstiege beziehen.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „du, der du in den Himmeln sitzt/wohnst“; „thronst“ gibt den möglichen königlichen Unterton wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Aufstiegslied
  rationale: Die knappe Zusammensetzung gibt die etablierte Überschrift dieser Psalmengruppe und das Bild des Hinaufgehens wieder, ohne festzulegen, ob Pilgerreise, Stufen oder eine liturgisch-musikalische Bedeutung gemeint sind.
- source_word: אֵלֶיךָ
  choice: Zu dir
  rationale: Bewahrt die Richtung der unmittelbaren Anrede und klingt in modernem Deutsch natürlich.
- source_word: נָשָׂאתִי אֶת־עֵינַי
  choice: erhebe ich meine Augen
  rationale: Die konkrete hebräische Bildsprache bleibt erhalten. Das Perfekt bezeichnet hier im Gebetsvollzug passend die gegenwärtige Hinwendung.
- source_word: הַיֹּשְׁבִי
  choice: du, der du … thronst
  rationale: Das Partizip bedeutet wörtlich „sitzend/wohnend“. Im Bezug auf Gott vermittelt „thronen“ den naheliegenden königlichen Unterton, während die wörtlichen Möglichkeiten in der Fußnote erhalten bleiben.
- source_word: בַּשָּׁמָיִם
  choice: in den Himmeln
  rationale: Gibt die formale Pluralgestalt des Hebräischen wieder und bewahrt den poetisch-erhabenen Klang.
theological_decisions:
- issue: Deutung von הַיֹּשְׁבִי als Aussage über den göttlichen Adressaten
  choice: du, der du in den Himmeln thronst
  alternative: du, der du in den Himmeln sitzt/wohnst
  rationale: Die direkte Anrede Gottes bleibt ohne ergänzten Gottesnamen erhalten. „Thronst“ lässt den möglichen königlichen Sinn anklingen, ohne die wörtliche Bedeutungsbreite zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Zeilengestaltung. Die traditionelle Bildsprache „die Augen erheben“ und der hebräische Plural „Himmel“ bleiben erhalten; erklärungsbedürftige Mehrdeutigkeiten stehen in den Fußnoten.
