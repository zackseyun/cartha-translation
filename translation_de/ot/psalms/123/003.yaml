base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/003.yaml
  text: Be gracious to us[a], O Yahweh; be gracious to us[b], for we have had more than enough of contempt.
translation:
  language: de
  text: Sei uns gnädig[a], Jahwe, sei uns gnädig; denn wir haben mehr als genug von Verachtung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hab Erbarmen mit uns.“ Das hebräische Verb kann bedeuten, jemandem Gunst, Gnade oder Erbarmen zu erweisen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „denn reichlich sind wir mit Verachtung gesättigt“. Gemeint ist, dass sie Verachtung im Übermaß erfahren haben.'
    reason: idiom_explanation
lexical_decisions:
- source_word: חָנֵּנוּ
  choice: Sei uns gnädig
  rationale: Der Imperativ von חנן mit Suffix der 1. Person Plural bittet um Gunst, Gnade oder Erbarmen. „Sei uns gnädig“ bewahrt den verbalen Charakter und das breite Bedeutungsspektrum.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund für die wiederholte Bitte ein; „denn“ ist im deutschen poetischen Kontext natürlich.
- source_word: רַב שָׂבַעְנוּ
  choice: wir haben mehr als genug
  rationale: Wörtlich bezeichnet die Wendung ein reichliches Gesättigtsein. Mit dem negativen Gegenstand „Verachtung“ gibt „mehr als genug haben“ die idiomatische Bedeutung natürlich wieder.
- source_word: בּוּז
  choice: Verachtung
  rationale: בוז bezeichnet Verachtung oder verächtliche Behandlung. „Verachtung“ bewahrt den abstrakten Charakter des hebräischen Ausdrucks.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von חנן
  choice: Sei uns gnädig
  alternative: Erbarme dich über uns
  rationale: חנן kann Gunst, Gnade oder Erbarmen ausdrücken. „Sei uns gnädig“ hält diesen Umfang offen und legt die Bitte nicht ausschließlich als Erbarmensruf aus.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Die zweimalige Bitte und die knappe Begründung des hebräischen Verses bleiben erhalten; die ungewöhnliche Sättigungsmetapher wird im Haupttext idiomatisch und in der Fußnote wörtlicher wiedergegeben.
