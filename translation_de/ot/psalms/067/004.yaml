source:
  edition: WLC
  text: יִֽשְׂמְח֥וּ וִֽ/ירַנְּנ֗וּ לְאֻ֫מִּ֥ים כִּֽי תִשְׁפֹּ֣ט עַמִּ֣ים מִישׁ֑וֹר וּ/לְאֻמִּ֓ים בָּ/אָ֖רֶץ תַּנְחֵ֣/ם סֶֽלָה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/004.yaml
  text: Let the nations be glad and sing for joy[a], for you judge the peoples with equity and guide the nations on the earth[b]. Selah
translation:
  language: de
  text: Mögen die Nationen sich freuen und jubeln[a], denn du richtest die Völker gerecht und leitest die Nationen auf der Erde[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und vor Freude singen“ beziehungsweise „und vor Freude jauchzen“. Das Verb kann jubelnden Gesang oder laute Freudenrufe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Land“, wenn אֶרֶץ lokal verstanden wird. Wegen des weltweiten Horizonts des Psalms steht hier „auf der Erde“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: sollen sich freuen
  rationale: Der Qal-Imperfekt kann hier im Zusammenhang des Lobpreises jussiv verstanden werden. „Sollen sich freuen“ gibt diesen auffordernden beziehungsweise wünschenden Sinn natürlich wieder.
- source_word: וִירַנְּנוּ
  choice: und jubeln
  rationale: Das Piel von רנן bezeichnet hörbar geäußerte Freude, sei es durch Jubelruf oder Gesang. „Jubeln“ bewahrt diese Offenheit knapp und idiomatisch.
- source_word: לְאֻמִּים
  choice: die Nationen
  rationale: „Nationen“ passt zum weltweiten Horizont des Psalms und wird bei beiden Vorkommen des hebräischen Ausdrucks einheitlich verwendet.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund für die Freude der Nationen ein; „denn“ entspricht dem poetisch-gehobenen Register.
- source_word: תִשְׁפֹּט
  choice: du richtest
  rationale: Der Qal-Imperfekt kann gegenwärtig beziehungsweise charakterisierend verstanden werden. „Richtest“ bewahrt die gerichtliche Grundbedeutung, ohne sie auf bloßes Regieren auszuweiten.
- source_word: עַמִּים
  choice: die Völker
  rationale: „Völker“ unterscheidet עַמִּים sprachlich von לְאֻמִּים und bezeichnet die menschlichen Volksgruppen unter Gottes Gericht.
- source_word: מִישׁוֹר
  choice: gerecht
  rationale: Das Substantiv bezeichnet Geradheit, Ebenmaß und daraus folgend rechtmäßige, faire Behandlung. Das Adverb „gerecht“ ist im Deutschen natürlich und bewahrt den ethisch-juristischen Sinn.
- source_word: בָּאָרֶץ
  choice: auf der Erde
  rationale: Der universale Rahmen von Psalm 67 legt die globale Bedeutung „Erde“ nahe, auch wenn die lokalere Wiedergabe „im Land“ sprachlich möglich bleibt.
- source_word: תַּנְחֵם
  choice: leitest
  rationale: Das Hifil von נחה bedeutet „führen, leiten“. „Leitest“ kann sowohl fürsorgliche Führung als auch lenkende Leitung ausdrücken, ohne körperliche Fortbewegung vorauszusetzen.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und liturgische Funktion des Ausdrucks unsicher sind, wird er in eingebürgerter deutscher Umschrift beibehalten.
theological_decisions:
- issue: Reichweite von אֶרֶץ
  choice: 'global: „Erde“'
  alternative: 'lokal: „Land“'
  rationale: Der Psalm spricht wiederholt von allen Völkern und Nationen. Daher entspricht „Erde“ dem unmittelbaren universalen Kontext, ohne die grundsätzlich mögliche lokale Lesart zu verschweigen.
- issue: Aspekt und Modalität der Imperfektformen
  choice: jussiv bei der Freude, gegenwärtig-charakterisierend bei Gottes Handeln
  alternative: 'durchgehend zukünftig: „Die Nationen werden sich freuen … du wirst richten … und leiten“'
  rationale: Die ersten Verben wirken im liturgischen Kontext als Wunsch oder Aufruf; Gottes Richten und Leiten begründen diesen Aufruf als kennzeichnendes Handeln. Die hebräischen Imperfektformen lassen jedoch auch eine stärker zukünftige Deutung zu.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Knappheit. Die Parallelbegriffe לְאֻמִּים und עַמִּים werden als „Nationen“ und „Völker“ unterschieden. „Sela“ bleibt wegen seiner unsicheren Bedeutung unübersetzt.
