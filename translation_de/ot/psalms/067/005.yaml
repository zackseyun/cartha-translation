  text: Mögen die Völker dich preisen[a][b], Gott; mögen alle Völker dich preisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Völker werden dich preisen, Gott; alle Völker werden dich preisen.“'
