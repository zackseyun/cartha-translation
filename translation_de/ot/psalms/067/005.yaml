lexical_decisions:
- source_word: יוֹדוּךָ
  choice: sollen dich preisen
  rationale: Der Hifil von ידה bezeichnet in den Psalmen häufig öffentliches Loben oder Danken gegenüber Gott. „Preisen“ gibt hier den gottesdienstlichen Klang und den poetischen Refrain natürlich wieder; „sollen“ wahrt die im Kontext naheliegende Wunsch- oder Aufforderungsbedeutung.
- source_word: עַמִּים
  choice: die Völker
  rationale: Der Plural bezeichnet mehrere Volksgruppen und bewahrt den universalen Horizont des Psalms. „Völker“ ist im Deutschen natürlicher und genauer als eine verallgemeinernde Wiedergabe mit „Menschen“.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים steht hier als direkte Anrede. Im Deutschen macht die Stellung nach dem ersten Satzglied den Vokativ auch ohne das altertümlich wirkende „o“ klar.
- source_word: כֻּלָּם
  choice: alle
  rationale: Das Wort schließt die Gesamtheit der zuvor genannten Völker ein. „Alle Völker“ ist knapp, idiomatisch und erhält die Steigerung der wiederholten Zeile.
theological_decisions:
- issue: Modus und Aussagefunktion des wiederholten Satzes
  choice: 'Als Gebetswunsch beziehungsweise Aufforderung wiedergeben: „Die Völker sollen dich preisen“'
  alternative: 'Als Aussage oder Erwartung wiedergeben: „Die Völker werden dich preisen“'
  rationale: Die hebräische Form kann formal auch indikativisch verstanden werden. Im betenden Refrain des Psalms liegt jedoch die volitive Bedeutung näher. Die echte Mehrdeutigkeit wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelstruktur. Die direkte Anrede „Gott“ bleibt ohne das heute gehoben-altertümliche „o“. Die Satzstellung hält den Refrain verständlich und nahe an der hebräischen Struktur.
