id: PSA.67.6
reference: Psalms 67:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֶ֭רֶץ נָתְנָ֣ה יְבוּלָ֑/הּ יְ֝בָרְכֵ֗/נוּ אֱלֹהִ֥ים אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/006.yaml
  text: The earth has yielded its produce[a]; God, our God[b], blesses us.
translation:
  language: de
  text: Die Erde[b] hat ihren Ertrag hervorgebracht; Gott, unser Gott, segnet uns.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gott, unser Gott, segne uns«; oder: »Gott, unser Gott, wird uns segnen.« Die hebräische Verbform kann im Zusammenhang als gegenwärtige Aussage, als Wunsch oder als Zukunftsaussage verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Das Land hat seinen Ertrag hervorgebracht.« Das hebräische Wort kann »Erde« oder »Land« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: die Erde
  rationale: Im weltweiten Horizont des Psalms passt die umfassende Bedeutung »Erde« am besten; »Land« bleibt jedoch lexikalisch möglich.
- source_word: נָתְנָה
  choice: hat … hervorgebracht
  rationale: Das Verb bedeutet wörtlich »hat gegeben«; zusammen mit dem landwirtschaftlichen Ertrag ist »hat hervorgebracht« im Deutschen natürlich und bewahrt den resultativen Sinn.
- source_word: יְבוּלָהּ
  choice: ihren Ertrag
  rationale: »Ertrag« gibt den landwirtschaftlichen Zuwachs präzise und ohne die engere Festlegung auf eine bereits eingebrachte Ernte wieder.
- source_word: יְבָרְכֵנוּ
  choice: segnet uns
  rationale: Der hebräische Imperfekt kann hier als gegenwärtige Aussage, Wunsch oder Zukunftsaussage verstanden werden. Der Haupttext folgt der zuversichtlichen indikativischen Lesart; die Alternativen stehen in einer Fußnote.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Übliche deutsche Wiedergabe der Gottesbezeichnung, die hier auf Israels Gott bezogen ist.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Die Form mit dem Suffix der ersten Person Plural wird direkt wiedergegeben; die Wiederholung »Gott, unser Gott« bewahrt Nachdruck und Nähe des Hebräischen.
theological_decisions:
- issue: Aussageweise und Zeitbezug von יְבָרְכֵנוּ
  choice: 'indikativisch-gegenwärtig: »segnet uns«'
  alternative: 'jussivisch: »Gott, unser Gott, segne uns«; oder zukünftig: »Gott, unser Gott, wird uns segnen«'
  rationale: Die Verbform ist im Kontext mehrdeutig. Die indikativische Wiedergabe passt zur vorangehenden Feststellung des Ertrags und zur zuversichtlichen Fortsetzung im nächsten Vers, ohne die möglichen Wunsch- und Zukunftslesarten auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele und betonte Ausdruck »Gott, unser Gott« bleibt erhalten. Die Fußnotenmarker stehen gesammelt nach dem Satz, wobei [a] die Verbdeutung und [b] die Bedeutung von »Erde/Land« erläutert.
