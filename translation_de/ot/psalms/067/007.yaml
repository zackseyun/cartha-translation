  text: יְבָרְכֵ֥/נוּ אֱלֹהִ֑ים וְ/יִֽירְא֥וּ אֹ֝ת֗/וֹ כָּל אַפְסֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/007.yaml
  text: God will bless us[a], and all the ends of the earth will fear him.
translation:
  language: de
  text: Gott wird uns segnen, und alle Enden der Erde werden ihn fürchten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihn verehren“ oder „Ehrfurcht vor ihm haben“. Das hebräische Verb kann gegenüber Gott sowohl Furcht als auch ehrfürchtiges Staunen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרְכֵנוּ
  choice: wird uns segnen
  rationale: Das Piel von ברך mit dem Suffix der 1. Person Plural bedeutet „uns segnen“. Der Imperfekt wird hier im Zusammenhang des abschließenden Vertrauens als Zukunftsaussage wiedergegeben; „möge uns segnen“ bleibt als mögliche Nuance des weiteren Kontextes denkbar.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Trotz der formal pluralischen Gestalt bezeichnet das Wort hier den einen Gott; der Bezug ist singularisch.
- source_word: וְיִירְאוּ
  choice: und … werden … fürchten
  rationale: ירא bezeichnet gegenüber Gott Furcht, die zugleich Ehrfurcht und staunendes Ergriffensein einschließen kann. „Fürchten“ bewahrt die Breite und das theologische Gewicht des hebräischen Ausdrucks.
- source_word: אֹתוֹ
  choice: ihn
  rationale: Das singularische Personalpronomen bezieht sich auf Gott.
- source_word: כָּל
  choice: alle
  rationale: Mit der folgenden Konstruktverbindung hat כָּל einen umfassenden, kollektiven Sinn.
- source_word: אַפְסֵי אָרֶץ
  choice: Enden der Erde
  rationale: Die feste poetische Wendung bezeichnet die äußersten und fernsten Gebiete der Welt. „Enden der Erde“ erhält das Bild des Hebräischen und ist im Deutschen verständlich.
theological_decisions:
- issue: Bedeutung von ירא im Verhältnis zu Gott
  choice: ihn fürchten
  alternative: ihn verehren; vor ihm Ehrfurcht haben
  rationale: Die direkte Wiedergabe mit „fürchten“ bewahrt die Spannung von Furcht, Ehrfurcht, Staunen und Unterordnung, ohne den Ausdruck auf bloßen Respekt zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzstruktur. Die traditionelle Bildrede „Enden der Erde“ bleibt erhalten. Der Fußnotenmarker steht unmittelbar nach dem Ausdruck, auf den er sich bezieht.
