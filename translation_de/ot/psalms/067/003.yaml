base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/003.yaml
  text: Let the peoples praise you[a], O God[b]; let all the peoples praise you.
translation:
  language: de
  text: Mögen die Völker dich preisen[a], Gott; mögen alle Völker[b] dich preisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Die Völker sollen dich preisen« oder, hier weniger wahrscheinlich: »Die Völker werden dich preisen«. Die hebräische Verbform kann einen Wunsch beziehungsweise ein Gebet oder eine zukünftige Handlung ausdrücken.'
    reason: alternative_reading
  - marker: b
    text: Mit »Völker« sind die verschiedenen Völker beziehungsweise ethnischen Gruppen gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: sollen dich preisen
  rationale: Das Hifil von ידה bezeichnet in poetischen Lobkontexten »preisen« oder »danken«. Im refrainartigen Gebet gibt »sollen … preisen« den volitiven Sinn natürlich wieder, ohne die Form vorschnell als sichere Zukunftsaussage festzulegen.
- source_word: עַמִּים
  choice: die Völker
  rationale: Der Plural meint verschiedene Volks- oder Menschengruppen. »Völker« bewahrt den konkreten Plural und vermeidet eine ausschließlich politische Deutung von »Nationen«.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Wort steht als direkte Anrede. Im Deutschen macht die Stellung nach dem ersten Satzglied die Anrede ohne das heute gehobener wirkende »o Gott« deutlich.
- source_word: כֻּלָּם
  choice: alle Völker
  rationale: Die Wiederaufnahme von »Völker« mit »alle« gibt die umfassende Bedeutung von »sie alle« knapp und poetisch wieder.
theological_decisions:
- issue: Volitive oder zukünftige Bedeutung der wiederholten Verbform
  choice: Als Bitte beziehungsweise Aufforderung mit »sollen … preisen« wiedergeben
  alternative: »Die Völker werden dich preisen« oder »Mögen die Völker dich preisen«
  rationale: Die morphologisch mehrdeutige Imperfektform steht hier in einem liturgischen Refrain und hat wahrscheinlich Wunsch- oder Aufforderungscharakter. »Sollen« wahrt diesen Charakter, während die Fußnote die mögliche Zukunftslesart offenhält.
translation_notes:
  register: Moderne, verständliche und zugleich würdige Psalmsprache. Die parallele Satzstruktur und die Wiederholung des Schlüsselverbs bleiben erhalten; auf das im heutigen Deutsch markiert feierliche »o« bei der Anrede wird verzichtet.
