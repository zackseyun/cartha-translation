source:
  edition: WLC
  text: אֱלֹהִ֗ים יְחָנֵּ֥/נוּ וִֽ/יבָרְכֵ֑/נוּ יָ֤אֵ֥ר פָּנָ֖י/ו אִתָּ֣/נוּ סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/001.yaml
  text: May God be gracious to us and bless us[a]; may his face shine upon us[c][b]. Selah
translation:
  language: de
  text: Gott sei uns gnädig und segne uns; er lasse sein Angesicht über uns leuchten.[a] Sela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit uns“. Die Zeile erinnert an den priesterlichen Segen in 4. Mose 6,24–26, besonders: „Der HERR lasse sein Angesicht über dir leuchten.“'
    reason: lexical_alternative_and_cross_reference
  - marker: b
    text: „Sela“ ist vermutlich eine liturgische oder musikalische Angabe; seine genaue Bedeutung ist ungewiss.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Obwohl die Form morphologisch pluralisch ist, bezeichnet sie hier aufgrund des Kontexts und der singularischen Verbbezüge den einen Gott Israels.
- source_word: יְחָנֵּנוּ
  choice: sei uns gnädig
  rationale: Die Gebetsform von חנן bittet um gnädige Zuwendung. Die Wendung ist im Deutschen natürlich, würdevoll und liturgisch anschlussfähig.
- source_word: וִיבָרְכֵנוּ
  choice: und segne uns
  rationale: ברך ist das übliche Verb für „segnen“; die schlichte Wiedergabe bewahrt Bedeutung und Gebetscharakter.
- source_word: יָאֵר
  choice: er lasse … leuchten
  rationale: Der Hifil von אור hat kausative Bedeutung. „Lasse … leuchten“ gibt sie idiomatisch wieder und bewahrt den Anklang an den priesterlichen Segen.
- source_word: פָּנָיו
  choice: sein Angesicht
  rationale: Die konkrete Bildsprache „sein Gesicht/Angesicht“ soll erhalten bleiben. „Angesicht“ klingt im modernen Deutschen gehoben, ist aber in diesem liturgischen Zusammenhang verständlich und passend.
- source_word: אִתָּנוּ
  choice: über uns
  rationale: Wörtlich bedeutet die Präposition hier „mit uns“. Im Zusammenhang mit dem leuchtenden Angesicht wird der hebräische Segensausdruck im Deutschen idiomatisch mit „über uns“ wiedergegeben; die wörtliche Form wird in einer Fußnote vermerkt.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Funktion und genaue Bedeutung ungewiss sind, wird der vermutlich liturgische oder musikalische Ausdruck transliteriert statt spekulativ übersetzt.
theological_decisions:
- issue: Volitive Bedeutung der Verbfolge
  choice: 'Als Bitte beziehungsweise Wunsch wiedergegeben: „Gott sei … und segne …; er lasse …“'
  alternative: Indikativische Wiedergabe wie „Gott ist uns gnädig und segnet uns“
  rationale: Die Verbformen haben im Kontext dieses Segensgebets natürlich jussivisch-optative Kraft. Der deutsche Konjunktiv bewahrt diesen Gebetscharakter.
- issue: Anklang an den priesterlichen Segen
  choice: Die Bildsprache vom leuchtenden Angesicht bleibt erhalten.
  alternative: Deutende Wiedergabe wie „blicke uns freundlich an“
  rationale: Der deutliche Anklang an 4. Mose 6,24–26, besonders Vers 25, soll sichtbar bleiben, ohne zusätzliche theologische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit liturgischer Klangfarbe. Der Konjunktiv „sei/segne/lasse“ gibt die Gebetsbitte knapp und natürlich wieder. „Angesicht“ erhält die traditionsreiche biblische Bildsprache und den intertextuellen Bezug.
