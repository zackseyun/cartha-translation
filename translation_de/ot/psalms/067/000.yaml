lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In den Psalmüberschriften bezeichnet der Ausdruck wahrscheinlich die für die musikalische Ausführung oder Leitung verantwortliche Person. „Chorleiter“ ist im Deutschen verständlich und bewahrt die liturgisch-musikalische Funktion; die Präposition ל wird natürlich mit „für“ wiedergegeben.
- source_word: בִּנְגִינֹת
  choice: Mit Saiteninstrumenten
  rationale: Der Ausdruck verweist in musikalischen Überschriften auf Saitenspiel beziehungsweise Saiteninstrumente. „Mit Saiteninstrumenten“ ist natürlich und wahrt den instrumentalen Sinn der Präposition; „auf Saiteninstrumenten“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Der Begriff ist eine übliche Gattungsbezeichnung in Überschriften. „Ein Psalm“ gibt ihn wieder, ohne die musikalische Nuance unnötig festzulegen.
- source_word: שִׁיר
  choice: Ein Lied
  rationale: Die eigenständige Wiedergabe bewahrt die doppelte Gattungsbezeichnung des Hebräischen, statt מִזְמוֹר und שִׁיר zusammenzuziehen.
