  text: that your way may be known on the earth[b][a], your salvation among all nations.
translation:
  language: de
  text: 'damit dein Weg auf der Erde[a] erkannt wird,

    deine Rettung[b] unter allen Nationen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Land“. Das hebräische Wort kann „Land“ oder „Erde“ bedeuten; die Parallele „unter allen Nationen“ spricht für den weiteren Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dein Heil“. Das hebräische Wort kann Rettung oder Befreiung sowie Gottes rettendes Handeln im weiteren Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָדַעַת
  choice: damit man … erkennt
  rationale: Der Infinitiv mit לְ drückt hier, im Anschluss an die Bitte des vorherigen Verses, einen Zweck aus. Die unpersönliche Formulierung gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: בָּאָרֶץ
  choice: auf der Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der Parallelismus mit „unter allen Nationen“ spricht hier für den weltweiten Sinn.
- source_word: דַּרְכֶּךָ
  choice: deinen Weg
  rationale: „Weg“ bewahrt das hebräische Bild und kann sowohl Gottes Handlungsweise als auch den von ihm eröffneten Weg bezeichnen, ohne die Mehrdeutigkeit aufzulösen.
- source_word: בְּכָל גּוֹיִם
  choice: unter allen Nationen
  rationale: גּוֹיִם bezeichnet hier die Nationen beziehungsweise Völker in weltweiter Perspektive. „Unter allen Nationen“ gibt die Präposition und den internationalen Horizont angemessen wieder.
- source_word: יְשׁוּעָתֶךָ
  choice: deine Rettung
  rationale: יְשׁוּעָה bezeichnet Rettung, Heil oder Befreiung. „Rettung“ ist im modernen Deutsch konkret und zugleich weit genug, um Gottes umfassendes rettendes Handeln einzuschließen.
theological_decisions:
- issue: Reichweite von אֶרֶץ in einem Psalm mit weltweitem Horizont
  choice: „Erde“ im universalen Sinn
  alternative: „Land“ im örtlich begrenzten Sinn
  rationale: Die parallele Aussage „unter allen Nationen“ legt einen weltweiten Horizont nahe, ohne spätere theologische Aussagen in den Vers hineinzulesen.
- issue: Wiedergabe von יְשׁוּעָה
  choice: „Rettung“
  alternative: „Heil“ oder „Befreiung“
  rationale: „Rettung“ bewahrt den möglichen Bezug auf konkrete Befreiung und zugleich die umfassendere Bedeutung von Gottes rettendem Handeln. Die Fußnote nennt die traditionelle, theologisch breitere Alternative „Heil“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der poetische Parallelismus und das Bild „dein Weg“ bleiben erhalten; die zweizeilige Form folgt der hebräischen Versstruktur.
