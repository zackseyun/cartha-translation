  text: כִּֽי גָדֹ֣ל עַד שָׁמַ֣יִם חַסְדֶּ֑/ךָ וְֽ/עַד שְׁחָקִ֥ים אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/010.yaml
  text: For your steadfast love is great to the heavens[b][a], and your faithfulness to the clouds.
translation:
  language: de
  text: Denn deine beständige Liebe reicht bis zum Himmel, deine Treue[a] bis zu den Wolken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wahrheit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet den Grund für den vorausgehenden Lobpreis ein und bewahrt den kausalen Zusammenhang in natürlichem Deutsch.
- source_word: גָדֹל עַד שָׁמַיִם
  choice: reicht bis zum Himmel
  rationale: Gibt die Größe als bis zum Himmel reichende Ausdehnung wieder. Diese im Deutschen natürliche Formulierung bewahrt das vertikale poetische Bild, ohne die schwerfällige Wendung »ist groß bis zum Himmel«.
- source_word: חַסְדֶּךָ
  choice: deine beständige Liebe
  rationale: חֶסֶד verbindet Liebe und Güte mit Verlässlichkeit und anhaltender Loyalität. »Beständige Liebe« ist verständlich, würdevoll und vermeidet eine konfessionell verengende Festlegung.
- source_word: שָׁמַיִם
  choice: Himmel
  rationale: Bezeichnet hier den Himmel über der Erde; der deutsche Singular ist in dieser poetischen Wendung idiomatisch.
- source_word: שְׁחָקִים
  choice: Wolken
  rationale: Bewahrt das konkrete poetische Bild und den Parallelismus mit dem Himmel.
- source_word: אֲמִתֶּךָ
  choice: deine Treue
  rationale: Im Parallelismus mit חֶסֶד bezeichnet אֱמֶת vor allem Gottes Verlässlichkeit. Die mögliche Grundbedeutung »Wahrheit« bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe der miteinander verbundenen Eigenschaften Gottes חֶסֶד und אֱמֶת
  choice: beständige Liebe und Treue
  alternative: Güte und Wahrheit
  rationale: Die gewählte Wortpaarung bringt die relationale Beständigkeit und Verlässlichkeit zum Ausdruck, ohne die echte lexikalische Möglichkeit »Wahrheit« zu verschweigen.
- issue: Bild der bis zum Himmel reichenden Größe
  choice: Die Liebe »reicht bis zum Himmel«
  alternative: Die Liebe »ist groß bis zum Himmel«
  rationale: Das Deutsche drückt die im Hebräischen bezeichnete Ausdehnung natürlicherweise mit »reicht bis« aus. Das räumliche Bild und die Parallelität bleiben erhalten.
translation_notes:
  register: Moderne, klare und zugleich poetisch-würdevolle Standardsprache. Die verkürzte zweite Vershälfte bewahrt den hebräischen Parallelismus; das Verb »reicht« ist dort mitzudenken.
