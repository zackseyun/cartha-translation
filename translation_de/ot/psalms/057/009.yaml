id: PSA.57.9
reference: Psalms 57:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אוֹדְ/ךָ֖ בָ/עַמִּ֥ים אֲדֹנָ֑/י אֲ֝זַמֶּרְ/ךָ֗ בַּל אֻמִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/009.yaml
  text: I will give thanks to you among the peoples[a], Lord; I will sing praise to you among the nations.
translation:
  language: de
  text: Ich will dir danken unter den Völkern[a], Herr; ich will dir lobsingen unter den Nationen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich will dich preisen unter den Völkern.« Das hebräische Verb kann sowohl Danken als auch Preisen bezeichnen. »Danken« wurde gewählt, um den Unterschied zum folgenden »lobsingen« zu bewahren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Ich will dir danken
  rationale: Der Hifil von ידה kann sowohl »danken« als auch »preisen« bedeuten. »Danken« bewahrt gegenüber dem folgenden זמר die eigene Bedeutungsnuance.
- source_word: בָעַמִּים
  choice: unter den Völkern
  rationale: Der Plural von עַם bezeichnet hier verschiedene Volksgemeinschaften; »unter den Völkern« erhält diesen kollektiven Plural.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: אֲדֹנָי ist hier der göttliche Titel »Herr«, nicht der Gottesname יהוה.
- source_word: אֲזַמֶּרְךָ
  choice: ich will dir lobsingen
  rationale: Der Piel von זמר bezeichnet im Psalmenkontext musikalisches Singen zum Lob Gottes; »lobsingen« gibt dies knapp und würdig wieder.
- source_word: בַּל
  choice: unter
  rationale: בַּל dient hier poetisch als Präposition und steht parallel zu בָ in der ersten Vershälfte.
- source_word: אֻמִּים
  choice: den Nationen
  rationale: »Nationen« unterscheidet אֻמִּים sprachlich von עַמִּים, ohne den parallelen Sinn aufzulösen.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels אֲדֹנָי
  choice: Herr
  alternative: O Herr
  rationale: »Herr« gibt den Titel wieder, ohne ihn mit dem Gottesnamen יהוה gleichzusetzen. Die Anredepartikel »O« ist im heutigen Deutsch nicht erforderlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Struktur und die Unterscheidung zwischen »Völkern« und »Nationen« bleiben erhalten; »lobsingen« trägt den poetisch-liturgischen Ton, ohne altertümliche Syntax zu verwenden.
