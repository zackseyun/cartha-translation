  text: נָ֘כ֤וֹן לִבִּ֣/י אֱ֭לֹהִים נָכ֣וֹן לִבִּ֑/י אָ֝שִׁ֗ירָה וַ/אֲזַמֵּֽרָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/007.yaml
  text: My heart is steadfast[a], O God; my heart is steadfast. I will sing, yes[b], I will make melody.
translation:
  language: de
  text: Mein Herz steht fest, Gott, mein Herz steht fest. Ich will singen und musizieren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָכוֹן
  choice: fest
  rationale: Das Wort bezeichnet hier einen gefestigten, beständigen Zustand und zugleich die entschlossene Ausrichtung des inneren Menschen. Die knappe deutsche Wendung »mein Herz ist fest« bewahrt das Bild und die Wiederholung.
- source_word: לִבִּי
  choice: mein Herz
  rationale: »Herz« entspricht dem hebräischen Ausdruck und bezeichnet hier das innere Zentrum von Wille, Vertrauen und Empfindung.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die direkte Anrede wird im Deutschen durch Stellung und Kommas hinreichend kenntlich; ein zusätzliches »o« wäre möglich, klänge aber gehobener und weniger gegenwärtig.
- source_word: אָשִׁירָה
  choice: Ich will singen
  rationale: Die Kohortativform drückt den festen Entschluss des Beters aus. »Ich will« gibt diesen Willensakzent im modernen Deutsch natürlich wieder.
- source_word: וַאֲזַמֵּרָה
  choice: und musizieren
  rationale: Das Verb kann Singen, instrumentales Musizieren oder lobpreisendes Singen bezeichnen. »Musizieren« erhält gegenüber »singen« die musikalische Erweiterung, ohne die genaue Ausführungsweise festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. Die zweimalige Aussage »mein Herz ist fest« bleibt entsprechend dem Hebräischen unverändert erhalten; die direkte Gottesanrede wird ohne archaisches »o« wiedergegeben.
