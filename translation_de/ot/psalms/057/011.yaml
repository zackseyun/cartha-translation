source:
  edition: WLC
  text: ר֣וּמָ/ה עַל שָׁמַ֣יִם אֱלֹהִ֑ים עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/011.yaml
  text: Be exalted above the heavens[a], O God; let your glory be above all the earth.
translation:
  language: de
  text: 'Erhebe dich über die Himmel, Gott;

    über der ganzen Erde sei deine Herrlichkeit.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Über der ganzen Erde ist deine Herrlichkeit.« Die zweite Vershälfte hat im Hebräischen kein ausdrückliches Verb; aus dem Zusammenhang kann daher sowohl eine Bitte als auch eine Feststellung ergänzt werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: Erhebe dich
  rationale: Die an Gott gerichtete Imperativform von רום bezeichnet Erhöhung beziehungsweise Erhabenheit. »Erhebe dich« bewahrt die aktive Gebetssprache und das räumliche Bild des Hebräischen, ohne die Aussage auf bloße Ortsveränderung zu beschränken.
- source_word: עַל
  choice: über
  rationale: Bei »den Himmeln« und »der ganzen Erde« drückt עַל Höhe und zugleich Hoheit aus. »Über« erhält dieses poetische Bild in beiden Vershälften.
- source_word: שָׁמַיִם
  choice: die Himmel
  rationale: Die hebräische Pluralform wird mit »die Himmel« wiedergegeben; das bewahrt die Form und den erhabenen poetischen Klang.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv steht hier als direkte Anrede. Im Deutschen kennzeichnet die Wortstellung die Anrede natürlich, sodass kein zusätzliches »o« nötig ist.
- source_word: כָּל הָאָרֶץ
  choice: der ganzen Erde
  rationale: Im kosmischen Parallelismus mit »den Himmeln« bezeichnet אֶרֶץ die Erde, nicht ein einzelnes Land. »Die ganze Erde« gibt den umfassenden Sinn idiomatisch wieder.
- source_word: כְּבוֹדֶךָ
  choice: deine Herrlichkeit
  rationale: כָּבוֹד bezeichnet in Bezug auf Gott seine offenbar werdende Majestät und Ehre. »Herrlichkeit« ist im Deutschen präzise, verständlich und poetisch angemessen.
theological_decisions:
- issue: Die zweite Vershälfte enthält im Hebräischen kein ausdrückliches Verb.
  choice: über der ganzen Erde sei deine Herrlichkeit
  alternative: über der ganzen Erde ist deine Herrlichkeit
  rationale: Das ergänzte »sei« führt den bittenden Charakter der ersten Vershälfte parallel weiter. Da der hebräische Nominalsatz jedoch auch als Feststellung verstanden werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Moderne, würdevolle Gebetssprache mit poetischem Parallelismus. Die direkte Anrede »Gott« bleibt ohne das im heutigen Deutsch gehoben oder altertümlich wirkende »o«. Der Zeilenumbruch macht die beiden hebräischen Vershälften sichtbar.
