  text: Awake[a], my glory! Awake[b], harp and lyre! I will awaken the dawn.
translation:
  language: de
  text: Wach auf, meine Herrlichkeit![a] Wacht auf, Harfe und Leier![b] Ich will die Morgenröte wecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Seele“ oder „mein ganzes Wesen“. Wörtlich steht hier „meine Herrlichkeit“, eine poetische Selbstbezeichnung.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische nennt zwei alte Saiteninstrumente; ihre genauen heutigen Entsprechungen sind unsicher.
    reason: cultural_note
lexical_decisions:
- source_word: עוּרָה
  choice: Wach auf!
  rationale: Der Imperativ von עור ist ein unmittelbarer Weckruf. „Wach auf“ ist im heutigen Deutsch verständlich und bewahrt den poetischen Ton.
- source_word: כְבוֹדִי
  choice: meine Herrlichkeit
  rationale: Die wörtliche Metapher „meine Herrlichkeit“ bleibt im Haupttext erhalten. Da der Ausdruck poetisch auch als Selbstbezeichnung für das Innerste oder das ganze Wesen dienen kann, werden diese Deutungsmöglichkeiten in einer Fußnote genannt.
- source_word: הַנֵּבֶל
  choice: Harfe
  rationale: Das Wort bezeichnet ein altes Saiteninstrument, dessen genaue Bauart nicht sicher bestimmbar ist. „Harfe“ ist eine geläufige, annähernde deutsche Wiedergabe.
- source_word: כִנּוֹר
  choice: Leier
  rationale: Das Wort bezeichnet ein altes Saiteninstrument. „Leier“ unterscheidet es im Deutschen von נבל und ist als historische Instrumentenbezeichnung verständlich.
- source_word: אָעִירָה
  choice: ich will … wecken
  rationale: Die Hifil-Form von עור hat hier kausativen Sinn. „Ich will … wecken“ gibt zugleich den entschlossenen, voluntativen Ton und das Bild wieder, dass der Beter selbst die Morgenröte aufweckt.
- source_word: שָּׁחַר
  choice: die Morgenröte
  rationale: שחר bezeichnet die Morgendämmerung beziehungsweise den Tagesanbruch. „Morgenröte“ bewahrt die anschauliche Personifikation und den poetischen Klang.
theological_decisions: []
translation_notes:
  register: Moderne, gehobene und zugleich gut verständliche Psalmsprache. Die dreifache Weckbewegung und die Personifikation der Morgenröte bleiben erhalten; die ungewöhnliche Wendung „meine Herrlichkeit“ wird nicht vorschnell aufgelöst.
