  variant: modern standard German
source:
  edition: WLC
  text: חָנֵּ֤/נִי אֱלֹהִ֨ים חָנֵּ֗/נִי כִּ֥י בְ/ךָ֮ חָסָ֪יָה נַ֫פְשִׁ֥/י וּ/בְ/צֵֽל כְּנָפֶ֥י/ךָ אֶחְסֶ֑ה עַ֝֗ד יַעֲבֹ֥ר הַוּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/001.yaml
  text: Be gracious to me[a], God, be gracious to me, for in you my soul takes refuge[b]; and in the shadow of your wings I will take refuge until destruction passes by.
translation:
  language: de
  text: Sei mir gnädig, Gott, sei mir gnädig! Denn bei dir hat meine Seele[a] Zuflucht gesucht, und im Schatten deiner Flügel will ich Zuflucht suchen, bis das Verderben[b] vorüberzieht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Leben“ oder „ich selbst“. Das hebräische נַפְשִׁי kann die Seele, das Leben oder die ganze Person bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen steht eine Pluralform, wörtlich etwa: „Unheile“; möglich sind auch „Katastrophen“ oder „Verheerungen“. Wahrscheinlich sind verderbenbringende Gefahren zusammenfassend gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Sei mir gnädig
  rationale: Der Imperativ von חנן mit Suffix der 1. Person Singular ist eine Bitte um Gnade beziehungsweise Zuwendung. Die Formulierung bewahrt den verbalen Charakter und passt zum würdevollen Gebetsstil.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die übliche Wiedergabe der Gottesbezeichnung in dieser direkten Anrede.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt die Begründung für die vorausgehende Bitte ein.
- source_word: בְךָ
  choice: bei dir
  rationale: Bei חָסָה bezeichnet ב die Person, bei der Schutz gesucht wird. „Bei dir“ ist im Deutschen natürlich und bewahrt den räumlichen Grundton des Zufluchtsbildes.
- source_word: חָסָיָה נַפְשִׁי
  choice: hat meine Seele Zuflucht gesucht
  rationale: נֶפֶשׁ kann Seele, Leben oder die ganze Person meinen. Die transparente Wiedergabe „meine Seele“ erhält die poetische Ausdrucksweise; das Perfekt wird als bereits vollzogener Vertrauensakt wiedergegeben.
- source_word: וּבְצֵל כְּנָפֶיךָ
  choice: und im Schatten deiner Flügel
  rationale: Die Schutzmetapher wird unverändert bewahrt und nicht erklärend zu „unter deinem Schutz“ aufgelöst.
- source_word: אֶחְסֶה
  choice: will ich Zuflucht suchen
  rationale: Das Imperfekt der 1. Person Singular drückt hier die fortdauernde beziehungsweise auf die kommende Gefahrenzeit gerichtete Zufluchtnahme aus. „Will ich“ bewahrt diesen volitiven und zukunftsbezogenen Zug.
- source_word: עַד יַעֲבֹר
  choice: bis … vorüberzieht
  rationale: Die Wendung bezeichnet die Dauer des Schutzsuchens, bis die Bedrohung vorbeigegangen ist.
- source_word: הַוּוֹת
  choice: das Verderben
  rationale: Der hebräische Plural bezeichnet verderbenbringende Ereignisse oder Katastrophen. Der kollektive Singular klingt im deutschen Vers natürlich; die Pluralform wird in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Bedeutungsumfang von נַפְשִׁי
  choice: meine Seele
  alternative: mein Leben; ich selbst
  rationale: Die poetisch-textnahe Wiedergabe bleibt erhalten, ohne נֶפֶשׁ auf eine vom Körper getrennte, unsterbliche Seele festzulegen. Eine Fußnote nennt den weiteren Bedeutungsumfang.
- issue: Bild vom Schatten der göttlichen Flügel
  choice: unaufgelöste poetische Schutzmetapher
  alternative: unter deinem Schutz
  rationale: Das konkrete Bild des Ausgangstextes wird bewahrt, ohne es wörtlich-anthropomorph zu dogmatisieren oder durch eine abstrakte Erklärung zu verflachen.
- issue: Numerus von הַוּוֹת
  choice: kollektiver Singular „das Verderben“
  alternative: die Katastrophen; die Verheerungen
  rationale: Die deutsche Formulierung bleibt idiomatisch, während die Fußnote die echte hebräische Pluralnuance offenlegt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, poetischem Gebetsstil. Die Wiederholung „sei mir gnädig“ und das zweimalige Motiv des Zufluchtsuchens bleiben erhalten; schwer verständliche Archaismen werden vermieden.
