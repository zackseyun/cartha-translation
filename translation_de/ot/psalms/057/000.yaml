base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.” Of David[a]. A miktam, when he fled from Saul[b], in the cave.'
translation:
  language: de
  text: 'Für den Musikleiter: »Zerstöre nicht«. Von David. Ein Miktam[b]. Bei seiner Flucht vor Saul in der Höhle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Die Bedeutung des hebräischen Wortes »Miktam« ist ungewiss; deshalb wird es nicht übersetzt, sondern umschrieben wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Musikleiter
  rationale: Die Wendung bezeichnet in Psalmüberschriften den für die musikalische Ausführung Verantwortlichen. »Musikleiter« ist verständlich und setzt anders als »Chorleiter« keinen Chor voraus.
- source_word: אַל־תַּשְׁחֵת
  choice: »Zerstöre nicht!«
  rationale: Die Verbform ist als verneinter Imperativ wiedergegeben. Die Anführungszeichen kennzeichnen die Wendung als vermutlich zur Aufführung gehörende Bezeichnung, ohne festzulegen, ob sie Titel, Melodiename oder Refrain ist.
- source_word: לְדָוִד
  choice: Von David
  rationale: Diese übliche Wiedergabe kennzeichnet die davidische Zuordnung der Überschrift. Das hebräische ל kann dabei Urheberschaft, Zugehörigkeit oder Widmung ausdrücken; die knappe Form vermeidet eine ausführliche Festlegung im Haupttext.
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Die Bedeutung der Gattungsbezeichnung ist ungeklärt. Die Transliteration bewahrt diese Unsicherheit, statt eine spekulative Deutung als Übersetzung auszugeben.
- source_word: בְּבָרְחוֹ
  choice: als er … floh
  rationale: Der Infinitiv mit בְּ hat hier zeitliche Bedeutung; die Formulierung ist im Deutschen natürlich.
- source_word: מִפְּנֵי שָׁאוּל
  choice: vor Saul
  rationale: Beim deutschen Verb »fliehen« gibt »vor Saul fliehen« die hebräische Wendung idiomatisch und präzise wieder.
- source_word: בַּמְּעָרָה
  choice: in der Höhle
  rationale: Die Präposition bezeichnet hier am natürlichsten den Ort. Der bestimmte Artikel des Hebräischen bleibt erhalten.
theological_decisions:
- issue: Literarische Funktion der Zeile
  choice: Die ganze Zeile wird als Psalmüberschrift wiedergegeben.
  alternative: Einzelne Bestandteile, besonders »Zerstöre nicht!«, als Beginn des Psalmgebets verstehen.
  rationale: Die Abfolge aus Aufführungsangabe, Bezeichnung, davidischer Zuordnung, Gattungswort und geschichtlichem Anlass entspricht den üblichen Elementen hebräischer Psalmüberschriften.
- issue: Deutung von מִכְתָּם
  choice: Das Wort wird als »Miktam« transliteriert.
  alternative: Übersetzungen wie »Inschrift«, »goldenes Lied« oder »Geheimlied«.
  rationale: Keine der vorgeschlagenen Bedeutungen ist hinreichend gesichert. Die Transliteration erhält die echte lexikalische Unsicherheit.
- issue: Funktion von אַל־תַּשְׁחֵת
  choice: Als zitierte Bezeichnung wiedergeben, deren genaue musikalische oder literarische Funktion offenbleibt.
  alternative: Eindeutig als Melodiename, Titel oder unmittelbaren Imperativ des Psalms festlegen.
  rationale: Der Gebrauch in mehreren Psalmüberschriften spricht für eine aufführungsbezogene Bezeichnung, erlaubt aber keine sichere Bestimmung ihrer genauen Funktion.
translation_notes:
  register: Moderne, würdige Standardsprache in der knappen Form einer Psalmüberschrift. Die Satzfragmente spiegeln deren Listencharakter. »Musikleiter« ist allgemein verständlich und vermeidet die sachlich nicht zwingende Einengung auf einen Chor.
