source:
  edition: WLC
  text: יִשְׁלַ֤ח מִ/שָּׁמַ֨יִם וְֽ/יוֹשִׁיעֵ֗/נִי חֵרֵ֣ף שֹׁאֲפִ֣/י סֶ֑לָה יִשְׁלַ֥ח אֱ֝לֹהִ֗ים חַסְדּ֥/וֹ וַ/אֲמִתּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/003.yaml
  text: He will send from heaven and save me[a]; he reproaches the one who pants after me. Selah[b]. God will send his steadfast love and his faithfulness.
translation:
  language: de
  text: Er wird vom Himmel her senden und mich retten; er wird den, der nach mir giert, der Schande preisgeben.[a] Sela. Gott wird seine beständige Liebe und seine Treue senden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der nach mir giert, verhöhnt mich.“ Auch möglich: „Er rettet mich vor dem Hohn dessen, der nach mir giert.“ Der hebräische Satz ist stark verkürzt und lässt offen, wer hier verhöhnt oder beschämt.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁלַח
  choice: Er wird senden
  rationale: Das Qal-Imperfekt drückt hier im Zusammenhang des vertrauensvollen Gebets am ehesten eine zuversichtliche zukünftige Handlung aus.
- source_word: מִשָּׁמַיִם
  choice: vom Himmel her
  rationale: Die idiomatische deutsche Einzahl bezeichnet den himmlischen Ursprung von Gottes Eingreifen.
- source_word: וְיוֹשִׁיעֵנִי
  choice: und mich retten
  rationale: Das Hifil von ישׁע mit Suffix der ersten Person bezeichnet umfassende Rettung aus der Bedrängnis.
- source_word: חֵרֵף
  choice: der Schande preisgeben
  rationale: Das Verb bedeutet grundsätzlich „schmähen, verhöhnen“. In der komprimierten Syntax kann Gott als Subjekt verstanden werden; die gewählte Wendung gibt dann die gegen den Verfolger gerichtete Beschämung wieder, ohne die alternative Satzanalyse zu verschweigen.
- source_word: שֹׁאֲפִי
  choice: der nach mir giert
  rationale: שאף beschreibt wörtlich ein feindseliges Lechzen oder Gieren. Die Formulierung bewahrt das anschauliche Bild und bezeichnet zugleich verständlich den Verfolger.
- source_word: סֶלָה
  choice: Sela
  rationale: Die traditionelle Umschrift bleibt stehen, da Bedeutung und musikalisch-liturgische Funktion des Ausdrucks unsicher sind.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חסד verbindet Liebe, Güte und verlässliche Loyalität; „beständige Liebe“ bringt Zuwendung und Dauerhaftigkeit in natürlichem Deutsch zusammen.
- source_word: וַאֲמִתּוֹ
  choice: und seine Treue
  rationale: אמת bezeichnet hier, besonders in der Verbindung mit חסד, Gottes Verlässlichkeit und Treue.
theological_decisions:
- issue: Satzbau von חֵרֵף שֹׁאֲפִי
  choice: Gott ist das mitgedachte Subjekt und gibt den feindseligen Verfolger der Schande preis.
  alternative: 'Der Verfolger ist das Subjekt: „Der nach mir giert, verhöhnt mich“; möglich ist auch: „Er rettet mich vor dem Hohn dessen, der nach mir giert.“'
  rationale: Der hebräische Satz ist stark verdichtet und syntaktisch mehrdeutig. Die Hauptfassung folgt dem Ablauf von Gottes Senden und Retten hin zur Beschämung des Feindes; die echte Mehrdeutigkeit wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Bildhaftigkeit. „Nach mir giert“ bewahrt das feindselige Verlangen des hebräischen Verbs; „Sela“ bleibt wegen seiner unsicheren Bedeutung unübersetzt.
