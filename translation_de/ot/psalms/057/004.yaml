base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/004.yaml
  text: My soul is in the midst of lions[a]; I lie down among those who are aflame—sons of man, whose teeth are spears and arrows[b], and whose tongue is a sharp sword.
translation:
  language: de
  text: Meine Seele ist mitten unter Löwen[a]; ich liege unter Flammenden[b] – Menschen, deren Zähne Speere und Pfeile sind und deren Zunge ein scharfes Schwert ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wendung kann auch so verstanden werden: »Meine Seele ist unter Menschen, die wie Löwen sind.« Die hebräische Bildfolge und Satzgliederung lassen das genaue Verhältnis zwischen den »Löwen« und den anschließend genannten menschlichen Feinden offen.'
    reason: Auslegungsalternative; wahrt die offene Beziehung zwischen Löwenbild und menschlichen Gegnern.
  - marker: b
    text: 'Oder: »Brennenden« bzw. »Flammenden«. Das hebräische Wort bewahrt eine Feuerbildlichkeit, deren genaue Nuance im Zusammenhang nicht eindeutig festgelegt ist.'
    reason: Lexikalische Alternative; dokumentiert die Mehrdeutigkeit von לֹהֲטִים.
lexical_decisions:
- source_word: נַפְשִׁי
  choice: Meine Seele
  rationale: Bewahrt das hebräische Bild und den poetischen Ton; נֶפֶשׁ kann auch das eigene Leben oder die eigene Person bezeichnen.
- source_word: בְּתוֹךְ לְבָאִם
  choice: mitten unter Löwen
  rationale: Gibt sowohl das Umringtsein als auch das eindringliche Löwenbild natürlich wieder.
- source_word: אֶשְׁכְּבָה
  choice: ich liege
  rationale: Das deutsche Präsens entspricht hier der konkreten Lage des Sprechers und klingt natürlicher als eine ausdrücklich futurische Wiedergabe.
- source_word: לֹהֲטִים
  choice: unter Flammenden
  rationale: Bewahrt die schwer eindeutig zu bestimmende Feuerbildlichkeit des Partizips, ohne sie auf Zorn, Verzehren oder eine andere Deutung festzulegen.
- source_word: בְּנֵי אָדָם
  choice: Menschensöhnen
  rationale: Bewahrt die grammatisch männliche, poetisch markierte hebräische Wendung und bezeichnet die Feinde zugleich ausdrücklich als Menschen.
- source_word: שִׁנֵּיהֶם חֲנִית וְחִצִּים
  choice: deren Zähne Speere und Pfeile sind
  rationale: Erhält die Waffenmetapher; der kollektive Singular חֲנִית wird im Deutschen idiomatisch als Plural wiedergegeben.
- source_word: וּלְשׁוֹנָם חֶרֶב חַדָּה
  choice: und deren Zunge ein scharfes Schwert ist
  rationale: Bewahrt die unmittelbare Metapher für gefährliche, verletzende Rede.
theological_decisions:
- issue: Verhältnis von Löwenbild und menschlichen Feinden
  choice: Die Bilder werden als poetische Schichtung beibehalten, ohne zu entscheiden, ob die Löwen wörtlich oder metaphorisch gemeint sind.
  alternative: Den ganzen Vers ausdrücklich auf gewalttätige menschliche Gegner festlegen oder Löwen und Menschen als zwei getrennte Gefahren verstehen.
  rationale: Der Text wechselt vom Löwenbild zu Menschensöhnen und lässt das genaue Verhältnis bewusst offen.
- issue: Wiedergabe von בְּנֵי אָדָם
  choice: Menschensöhne
  alternative: Menschen; Männer; Söhne Adams
  rationale: Die gewählte Form erhält die männliche und poetische Gestalt des Hebräischen, ohne eine zusätzliche theologische Identifikation einzutragen.
translation_notes:
  register: Moderne, würdige Psalmsprache mit bewahrten Körper-, Tier-, Feuer- und Waffenbildern. Das ungewöhnliche »Flammenden« ist bewusst poetisch und lässt die lexikalische Mehrdeutigkeit bestehen.
