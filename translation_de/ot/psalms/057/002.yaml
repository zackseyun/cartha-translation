base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/002.yaml
  text: I call to God Most High[a], to God who fulfills his purpose for me.
translation:
  language: de
  text: Ich rufe zu Gott, dem Höchsten, zu Gott, der für mich vollendet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der vollendet, was mich betrifft“; wörtlich: „der über mir vollendet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶקְרָא
  choice: Ich rufe
  rationale: Das Qal-Imperfekt in der 1. Person Singular kann im poetischen Zusammenhang gegenwärtig, zukünftig oder willentlich verstanden werden. „Ich rufe“ gibt den unmittelbaren Sinn wieder, ohne die stärkere Gefühlsnuance von „ich schreie“ hinzuzufügen.
- source_word: לֵאלֹהִים
  choice: zu Gott
  rationale: אֱלֹהִים bezeichnet hier nach Kontext und Parallelismus eindeutig den Gott Israels im Singular.
- source_word: עֶלְיוֹן
  choice: dem Höchsten
  rationale: Das Wort ist hier ein etablierter Gottesbeiname. Die appositionelle Wiedergabe „Gott, dem Höchsten“ ist im Deutschen natürlich und bewahrt den Titelcharakter.
- source_word: לָאֵל
  choice: zu Gott
  rationale: אֵל ist hier die parallele Bezeichnung für Gott. Die gleiche Wiedergabe erhält den synonymen Parallelismus und vermeidet die missverständliche Übernahme „El“.
- source_word: גֹמֵר
  choice: der vollendet
  rationale: Das Partizip von גמר bedeutet „vollenden, zum Abschluss bringen“. „Der vollendet“ bildet die konkrete Aussage des Hebräischen ab, ohne einen im Text nicht ausdrücklich genannten „Plan“ einzuführen.
- source_word: עָלָי
  choice: was mich betrifft
  rationale: עַל mit Suffix bezeichnet in Verbindung mit גמר idiomatisch das, was den Sprecher betrifft. Die Formulierung wahrt diese Offenheit besser als das stärker deutende „für mich“.
theological_decisions:
- issue: Bedeutung von גֹמֵר עָלָי
  choice: Gott vollendet, was den Beter betrifft
  alternative: Gott führt seinen Plan für mich aus
  rationale: Der hebräische Ausdruck spricht davon, dass Gott das den Beter Betreffende vollendet, nennt jedoch weder ausdrücklich einen „Plan“ noch ein besitzanzeigendes „seinen“. Die gewählte Fassung bewahrt die theologische Aussage von Gottes vollendendem Handeln und zugleich die sprachliche Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „zu Gott“ erhält den hebräischen Parallelismus; die Hauptfassung bleibt quellennah und verständlich.
