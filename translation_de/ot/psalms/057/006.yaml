id: PSA.57.6
reference: Psalms 57:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רֶ֤שֶׁת הֵכִ֣ינוּ לִ/פְעָמַ/י֮ כָּפַ֪ף נַ֫פְשִׁ֥/י כָּר֣וּ לְ/פָנַ֣/י שִׁיחָ֑ה נָפְל֖וּ בְ/תוֹכָ֣/הּ סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/006.yaml
  text: They prepared a net for my steps[a]; my soul was bowed down; they dug a pit before me; they fell into the midst of it[d][c][b]. Selah
translation:
  language: de
  text: Sie stellten meinen Schritten ein Netz[a]; meine Seele wurde niedergebeugt[b]. Sie gruben vor mir eine Grube; sie selbst fielen mitten hinein[c]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Schlinge“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „meine Seele wurde niedergebeugt“; „meine Seele“ kann hier auch „ich“ oder „mein Leben“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „sie fielen in ihre Mitte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶשֶׁת
  choice: Netz
  rationale: Das Substantiv bezeichnet ein Fangnetz. „Netz“ gibt das konkrete Bild unmittelbar und natürlich wieder; auch „Schlinge“ ist möglich.
- source_word: הֵכִינוּ
  choice: stellten
  rationale: Der Hifil von כון bedeutet „bereiten, bereitmachen“. Im Zusammenhang mit einem Fangnetz ist „ein Netz stellen“ die natürliche deutsche Wendung und bewahrt die absichtsvolle Handlung.
- source_word: לִפְעָמַי
  choice: meinen Schritten
  rationale: פעם kann Fuß oder Schritt bezeichnen. „Meinen Schritten“ erhält die Bewegungs- und Fangvorstellung sowie den Plural.
- source_word: כָּפַף
  choice: wurde niedergebeugt
  rationale: Das Verb bedeutet „beugen, niederbeugen“. Die passive Formulierung gibt mit „meine Seele“ als folgendem Subjekt den Zustand des Psalmisten wieder, ohne die Aussage zu glätten.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נפשׁ kann Seele, Leben oder die eigene Person meinen. „Meine Seele“ bewahrt die hebräische poetische Ausdrucksweise und ihre mögliche Bedeutungsweite.
- source_word: כָּרוּ
  choice: gruben
  rationale: Das Verb bedeutet unmittelbar „graben“ und passt zur Herstellung einer Fanggrube.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Die Präpositionalphrase bezeichnet den Ort vor dem Psalmisten; „vor mir“ ist knapp, natürlich und poetisch angemessen.
- source_word: שִׁיחָה
  choice: Grube
  rationale: Das Wort bezeichnet eine Grube, besonders auch als Falle. „Grube“ wahrt sowohl den konkreten als auch den bildlichen Gehalt.
- source_word: נָפְלוּ
  choice: sie selbst fielen
  rationale: Das Perfekt berichtet die Umkehrung des feindlichen Plans. „Selbst“ ist im Deutschen eine natürliche Hervorhebung der im Hebräischen aus dem Kontext hervorgehenden Ironie, ohne ein neues handelndes Subjekt einzuführen.
- source_word: בְתוֹכָהּ
  choice: mitten hinein
  rationale: Die Wendung bedeutet wörtlich „in ihrer Mitte“. Nach einem Bewegungsverb gibt „mitten hinein“ die Richtung idiomatisch wieder; das feminine Suffix bezieht sich auf die Grube.
- source_word: סֶלָה
  choice: Sela
  rationale: Die genaue Bedeutung des vermutlich musikalischen oder liturgischen Zeichens ist unsicher; daher wird es transliteriert.
theological_decisions:
- issue: Bezug und Aussage von נַפְשִׁי
  choice: „meine Seele“ wird formal bewahrt
  alternative: „ich“ oder „mein Leben“
  rationale: Die konkrete hebräische Anthropologie und ihre poetische Spannung sollen nicht auf eine einzige Deutung reduziert werden.
- issue: Subjekt des Fallens
  choice: „sie selbst“ bezieht sich auf die zuvor genannten Feinde
  alternative: schlicht „sie“
  rationale: Das Subjekt ist grammatisch dieselbe Mehrzahl wie bei „sie gruben“. „Selbst“ macht lediglich die im Text angelegte vergeltende Umkehr deutlich und führt keine theologische Zusatzannahme ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Bildsprache. Die Wiederholung von „Grube“ wird durch „mitten hinein“ vermieden, während der Bezug eindeutig bleibt. Die hebräische Satzgliederung wird durch Semikola und einen Satzpunkt so wiedergegeben, dass Parallelismus und Lesbarkeit erhalten bleiben.
