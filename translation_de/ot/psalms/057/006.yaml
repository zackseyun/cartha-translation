  terminology: „Netz“, „Schlinge“, „Seele“, „Grube“ und „Sela“ sind sachgerecht. „Sie selbst“ verdeutlicht die textlich angelegte Umkehrung, ohne eine zusätzliche theologische Aussage einzutragen. Die Fußnoten geben die wesentlichen lexikalischen Alternativen und die wörtliche Form angemessen wieder.
