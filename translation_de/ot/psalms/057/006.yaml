  source_fidelity: 'Der Entwurf gibt die Abfolge und Bildsprache des Hebräischen zuverlässig wieder: das bereitete Netz, die niedergebeugte נפשׁ, die vor dem Beter gegrabene Grube und das Hineinfallen der Gegner. „Mitten hinein“ ist im deutschen Bewegungszusammenhang eine angemessene Wiedergabe von בְּתוֹכָהּ. Die syntaktisch nicht ganz einfache Formulierung כָּפַף נַפְשִׁי wird, wie in der englischen Audit-Fassung, behutsam als Zustandsaussage wiedergegeben.'
