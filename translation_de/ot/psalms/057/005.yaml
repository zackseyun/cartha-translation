  text: ר֣וּמָ/ה עַל הַ/שָּׁמַ֣יִם אֱלֹהִ֑ים עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/005.yaml
  text: Be exalted above the heavens[a], O God; let your glory be over all the earth.
translation:
  language: de
  text: Erhebe dich über die Himmel, Gott; über der ganzen Erde sei deine Herrlichkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Über der ganzen Erde ist deine Herrlichkeit.“ Der zweite Halbvers hat im Hebräischen kein Verb und kann sowohl als Bitte beziehungsweise Wunsch als auch als Feststellung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: Erhebe dich
  rationale: Die imperative Form von רום fordert Gott in poetisch-doxologischer Sprache auf, sich als erhaben zu erweisen. „Erhebe dich“ ist natürlich und bewahrt gegenüber einem rein passiven „Sei erhöht“ die mögliche mediale beziehungsweise reflexive Nuance.
- source_word: עַל הַשָּׁמַיִם
  choice: über die Himmel
  rationale: עַל bezeichnet hier die Erhöhung über den Himmeln; der hebräische Plural wird im gehobenen poetischen Register als „die Himmel“ bewahrt.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Gottesname steht als direkte Anrede. Im modernen Deutschen ist der Vokativ ohne ein zusätzliches „o“ würdig und natürlich.
- source_word: עַל כָּל הָאָרֶץ
  choice: über der ganzen Erde
  rationale: Die Wendung bezeichnet universale Ausdehnung beziehungsweise Hoheit. „Über der ganzen Erde“ erhält die räumliche Bildsprache und den Parallelismus.
- source_word: כְּבוֹדֶךָ
  choice: deine Herrlichkeit
  rationale: כבוד bezeichnet bei Gott seine gewichtige, sichtbar hervortretende Majestät; „Herrlichkeit“ ist die sachlich und stilistisch passende deutsche Wiedergabe.
theological_decisions:
- issue: Ist der zweite, verblose Halbvers als Wunsch oder als Feststellung zu verstehen?
  choice: über der ganzen Erde sei deine Herrlichkeit
  alternative: über der ganzen Erde ist deine Herrlichkeit
  rationale: Im Parallelismus mit dem Imperativ des ersten Halbverses liegt ein Wunsch beziehungsweise Gebet nahe. Da im Hebräischen jedoch kein Verb steht, wird die ebenso mögliche Feststellung in einer Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Psalmsprache mit klarer Syntax. „Die Himmel“ bewahrt das poetische hebräische Weltbild; auf das heute markierte „o Gott“ wird verzichtet. Die Stellung „über der ganzen Erde sei“ erhält den Parallelismus und lässt den Gebetscharakter erkennen.
