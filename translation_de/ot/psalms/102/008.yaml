source:
  edition: WLC
  text: כָּל הַ֭/יּוֹם חֵרְפ֣וּ/נִי אוֹיְבָ֑/י מְ֝הוֹלָלַ֗/י בִּ֣/י נִשְׁבָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/008.yaml
  text: All day long my enemies reproach me[b][a]; those who mock me swear by me.
translation:
  language: de
  text: Den ganzen Tag verhöhnen mich meine Feinde; die mich verspotten, schwören bei mir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schwören gegen mich“ beziehungsweise „gebrauchen meinen Namen als Fluch in ihren Schwüren“. Der hebräische Ausdruck ist schwierig; wahrscheinlich ist der Beter oder sein Schicksal zu einer feindseligen Fluchformel geworden.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Den ganzen Tag
  rationale: Eine natürliche deutsche Zeitangabe, die ausdrückt, dass die Anfeindungen den ganzen Tag andauern.
- source_word: חֵרְפוּנִי
  choice: verhöhnen mich
  rationale: חרף bezeichnet hier ein verächtliches Beschimpfen oder Schmähreden. „Verhöhnen“ gibt den feindseligen Spott im heutigen Deutsch treffend wieder.
- source_word: אֹיְבַי
  choice: meine Feinde
  rationale: Direkte und natürliche Wiedergabe des hebräischen Nomens mit Possessivsuffix.
- source_word: מְהוֹלָלַי
  choice: die mich verspotten
  rationale: Die schwierige Form bezeichnet im Zusammenhang wohl Menschen, die den Beter zum Gegenstand ihres Spotts machen. Die verbale Wendung ist im Deutschen natürlich und wahrt die wahrscheinliche Bedeutung.
- source_word: בִּי
  choice: bei mir
  rationale: Bei נשבע bezeichnet ב gewöhnlich das, wobei geschworen wird. Die wörtlich-nahe Wiedergabe bewahrt die ungewöhnliche und möglicherweise fluchartige Ausdrucksweise.
- source_word: נִשְׁבָּעוּ
  choice: schwören
  rationale: Der Nifal von שבע bedeutet grundsätzlich „schwören“. Der feindselige Zusammenhang kann einen Gebrauch als Fluchformel nahelegen; diese Nuance wird in der Fußnote erläutert.
theological_decisions:
- issue: Bedeutung der feindseligen Eidformel בִּי נִשְׁבָּעוּ
  choice: „schwören bei mir“ im Haupttext
  alternative: „schwören gegen mich“ beziehungsweise „gebrauchen meinen Namen als Fluch in ihren Schwüren“
  rationale: Der hebräische Ausdruck ist ungewöhnlich und lässt offen, ob der Beter als Gegenstand eines Schwurs oder als abschreckende Fluchformel dient. Der Haupttext hält die grammatische Konstruktion fest, ohne die mögliche Fluchbedeutung auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelität der beiden Vershälften bleibt erkennbar; die schwierige Wendung am Versende wird bewusst nicht im Haupttext vereindeutigt.
