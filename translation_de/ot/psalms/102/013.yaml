  text: אַתָּ֣ה תָ֭קוּם תְּרַחֵ֣ם צִיּ֑וֹן כִּי עֵ֥ת לְ֝/חֶֽנְנָ֗/הּ כִּי בָ֥א מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/013.yaml
  text: You will arise and have compassion on Zion[a], for it is time to show her favor[b], for the appointed time has come.
translation:
  language: de
  text: Du wirst dich erheben und dich über Zion erbarmen, denn es ist Zeit, ihr Gnade zu erweisen[a]; denn die festgesetzte Zeit ist gekommen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr gnädig zu sein“ oder „sie zu begünstigen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der bestimmte Zeitpunkt ist gekommen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקוּם
  choice: du wirst dich erheben
  rationale: Das Qal-Imperfekt 2. Person Singular bezeichnet hier erwartetes zukünftiges Handeln Gottes. „Sich erheben“ bewahrt das anschauliche anthropomorphe Bild.
- source_word: תְּרַחֵם
  choice: dich erbarmen
  rationale: Das Piel von רחם bezeichnet mitfühlendes Erbarmen. Die reflexive deutsche Wendung „sich über jemanden erbarmen“ ist natürlich und würdevoll.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der Eigenname wird beibehalten; mögliche Bezüge auf Jerusalem oder Gottes Volk werden nicht interpretierend in den Haupttext eingetragen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet die erwartete Handlung Gottes. Beim zweiten Vorkommen lässt sich die Begründung im Deutschen elegant durch ein Semikolon anschließen.
- source_word: עֵת
  choice: es ist Zeit
  rationale: Die idiomatische deutsche Konstruktion gibt den entscheidenden Zeitpunkt klar wieder.
- source_word: לְחֶנְנָהּ
  choice: ihr Gnade zu erweisen
  rationale: Der Infinitiv von חנן mit femininem Suffix bezeichnet gnädige Zuwendung zu Zion. „Gnade erweisen“ bewahrt den theologischen und wohltätigen Gehalt, ohne ihn näher festzulegen.
- source_word: בָא
  choice: ist gekommen
  rationale: Das Perfekt von בוא bezeichnet das Eintreffen des Zeitpunkts mit gegenwärtiger Relevanz.
- source_word: מוֹעֵד
  choice: die festgesetzte Zeit
  rationale: מוֹעֵד bezeichnet einen bestimmten beziehungsweise festgelegten Zeitpunkt. „Festgesetzt“ wahrt den Gedanken der Bestimmung, ohne ausdrücklich einen menschlichen oder göttlichen Urheber zu ergänzen.
theological_decisions:
- issue: Konkrete oder deutende Wiedergabe von Zion
  choice: Zion als ausdrücklich genanntes Gegenüber des göttlichen Erbarmens beibehalten
  alternative: Jerusalem oder Gottes Volk
  rationale: Der hebräische Text nennt Zion. Weitergehende kanonische oder theologische Bezüge sollen sich aus dem Kontext ergeben und nicht in die Übersetzung eingefügt werden.
- issue: Bedeutungsumfang von חנן
  choice: ihr Gnade zu erweisen
  alternative: ihr gnädig zu sein oder sie zu begünstigen
  rationale: Die gewählte Fassung hält gnädige Zuwendung und konkrete Begünstigung zusammen, ohne die Art der Hilfe genauer zu bestimmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem poetischem Register. Die parallele Begründungsstruktur bleibt erkennbar; das Semikolon vermeidet im Deutschen eine schwerfällige Wiederholung von „denn“.
