base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/011.yaml
  text: My days are like a lengthening shadow[a], and I wither away like grass.
translation:
  language: de
  text: Meine Tage gleichen einem lang gezogenen Schatten[a], und ich verdorre wie Gras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meine Tage gleichen einem ausgestreckten Schatten.“ Das hebräische Wort bedeutet wörtlich „ausgestreckt“ oder „lang gezogen“. Im Bild eines Schattens kann es an einen gegen Abend länger werdenden Schatten denken lassen und so Vergänglichkeit und nahendes Ende ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: Meine Tage
  rationale: Bewahrt den hebräischen Plural mit Suffix und das poetische Bild für die begrenzte Lebenszeit.
- source_word: כְּצֵל
  choice: gleichen einem Schatten
  rationale: Das Präfix כְּ bezeichnet einen Vergleich; „Schatten“ gibt צֵל unmittelbar wieder.
- source_word: נָטוּי
  choice: der sich neigt
  rationale: Das Partizip von נטה kann „ausgestreckt“ oder „geneigt“ bedeuten. Beim Schatten legt der Ausdruck einen sich zum Abend hin verlängernden und sinkenden Schatten nahe, ohne das Bild auf eine einzige Deutung festzulegen.
- source_word: וַאֲנִי
  choice: und ich
  rationale: Gibt die einfache Konjunktion und das ausdrücklich gesetzte Personalpronomen eng wieder, ohne den Gegensatz durch „aber“ zu verstärken.
- source_word: כָּעֵשֶׂב
  choice: wie Gras
  rationale: „Gras“ ist die natürliche poetische Entsprechung für עֵשֶׂב im Bild menschlicher Vergänglichkeit.
- source_word: אִיבָשׁ
  choice: ich verdorre
  rationale: Das Verb יבשׁ bezeichnet das Austrocknen oder Verdorren; „verdorre“ passt idiomatisch zum Vergleich mit Gras und bewahrt die erste Person.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die Wiederholung „Meine Tage … und ich“ sowie die beiden Vergänglichkeitsbilder bleiben erhalten; die mögliche Mehrdeutigkeit von נָטוּי wird in der Fußnote sichtbar gemacht.
