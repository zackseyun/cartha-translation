  text: שָׁקַ֥דְתִּי וָ/אֶֽהְיֶ֑ה כְּ֝/צִפּ֗וֹר בּוֹדֵ֥ד עַל גָּֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/007.yaml
  text: I lie awake and am like a solitary bird on a rooftop[a].
translation:
  language: de
  text: Ich liege wach und bin wie ein einsamer Vogel auf dem Dach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie ein Sperling allein auf dem Dach«. Das hebräische Wort צִפּוֹר ist eine allgemeine Bezeichnung für einen Vogel; »Sperling« ist eine traditionelle spezifischere Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁקַדְתִּי
  choice: Ich liege wach
  rationale: Das Verb שׁקד kann Wachsein oder Wachen bezeichnen. Im Zusammenhang dieser Klage steht nicht aktives Bewachen, sondern Schlaflosigkeit im Vordergrund; »Ich liege wach« gibt dies natürlich wieder.
- source_word: וָאֶהְיֶה
  choice: und bin
  rationale: Die Verbform führt die poetische Beschreibung weiter. Das deutsche Präsens bewahrt die unmittelbare Wirkung, ohne eine unnötig starre Vergangenheitsfolge zu erzeugen.
- source_word: כְּצִפּוֹר
  choice: wie ein … Vogel
  rationale: צִפּוֹר ist eine allgemeine Bezeichnung für einen Vogel, häufig einen kleinen Vogel, jedoch nicht zwingend einen Sperling. »Vogel« bewahrt die Bedeutungsbreite.
- source_word: בּוֹדֵד
  choice: einsamer
  rationale: בּוֹדֵד bezeichnet das Allein- oder Abgesondertsein. »Einsam« ist in diesem poetischen Klagekontext natürlich und gibt sowohl die Vereinzelung als auch den emotionalen Ton wieder, ohne ihn übermäßig auszudeuten.
- source_word: עַל גָּג
  choice: auf dem Dach
  rationale: Die Wendung bedeutet wörtlich »auf einem/dem Dach«. »Auf dem Dach« ist im modernen Deutschen idiomatisch und bewahrt das Bild der ausgesetzten Absonderung.
