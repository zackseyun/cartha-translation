  text: תְּ֭פִלָּה לְ/עָנִ֣י כִֽי יַעֲטֹ֑ף וְ/לִ/פְנֵ֥י יְ֝הוָ֗ה יִשְׁפֹּ֥ךְ שִׂיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/000.yaml
  text: A prayer of the afflicted one when he grows faint and pours out his complaint before Yahweh[a][b].
translation:
  language: de
  text: Ein Gebet eines Bedrängten, wenn er kraftlos wird[a] und vor Jahwe seine Klage[b] ausschüttet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „überwältigt ist“ oder „verschmachtet“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sein Sinnen“ oder „sein Klagelied“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Ein Gebet
  rationale: Die Überschrift beginnt nominal; der unbestimmte Artikel entspricht natürlichem Deutsch.
- source_word: לְעָנִי
  choice: eines Bedrängten
  rationale: Das ל bezeichnet hier die Zuordnung des Gebets. עָנִי meint einen bedrängten, elenden oder armen Menschen; „Bedrängter“ bewahrt den umfassenden Erfahrungsbezug, ohne den Sinn auf wirtschaftliche Armut zu verengen.
- source_word: כִי
  choice: wenn
  rationale: כִּי führt hier den Umstand beziehungsweise Zeitpunkt ein, unter dem das Gebet gesprochen wird.
- source_word: יַעֲטֹף
  choice: kraftlos wird
  rationale: Das Verb kann Schwachwerden, Verschmachten oder Überwältigtsein ausdrücken. „Kraftlos wird“ ist verständlich und lässt die Art der Not offen.
- source_word: וְלִפְנֵי יְהוָה
  choice: und vor Jahwe
  rationale: לִפְנֵי bezeichnet das Sprechen in Jahwes Gegenwart; „vor“ ist knapp und idiomatisch.
- source_word: יִשְׁפֹּךְ
  choice: ausschüttet
  rationale: Die deutsche Wendung „seine Klage ausschütten“ bewahrt das hebräische Bild des Ausgießens.
- source_word: שִׂיחוֹ
  choice: seine Klage
  rationale: שִׂיחַ kann Klage, Sinnen oder innere Rede bezeichnen. Im Kontext des bedrängten Beters liegt „Klage“ nahe, ohne dass die weiteren Möglichkeiten verschwiegen werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; „Jahwe“ gibt den persönlichen Gottesnamen im modernen Deutschen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache in der knappen Form einer Psalmüberschrift. Das substantivierte „Bedrängten“ bezeichnet die betroffene Person, ohne das biologische Geschlecht unnötig hervorzuheben.
