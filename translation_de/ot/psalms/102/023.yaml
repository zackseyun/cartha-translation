  text: עִנָּ֖ה בַ/דֶּ֥רֶךְ כח/ו קִצַּ֥ר יָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/023.yaml
  text: He afflicted my strength on the way[b][a]; he shortened my days.
translation:
  language: de
  text: Er schwächte seine Kraft auf dem Weg[a]; er verkürzte meine Tage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf dem Lebensweg«. Hebräisch wörtlich: »auf dem Weg«. Der überlieferte Text lautet »seine Kraft«; dem Zusammenhang entsprechend wird häufig »meine Kraft« verstanden.'
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: עִנָּה
  choice: schwächte
  rationale: Das Piel von ענה kann »bedrängen«, »demütigen« oder »schwächen« bedeuten. In Verbindung mit »Kraft« gibt »schwächte« den Sinn natürlich und präzise wieder.
- source_word: בַדֶּרֶךְ
  choice: auf dem Weg
  rationale: Die wörtliche Weg-Metapher des Hebräischen bleibt erhalten; im Zusammenhang kann sie zugleich den Lebensweg bezeichnen.
- source_word: כחו
  choice: seine Kraft
  rationale: Der Ketiv des überlieferten Konsonantentextes trägt ein Suffix der 3. Person Singular maskulin. Der dadurch entstehende Personenwechsel wird nicht stillschweigend ausgeglichen.
- source_word: קִצַּר
  choice: verkürzte
  rationale: קצר bedeutet »verkürzen« oder »abkürzen« und bezeichnet hier die Verkürzung der Lebenszeit.
- source_word: יָמָי
  choice: meine Tage
  rationale: Die Form hat eindeutig ein Suffix der 1. Person Singular und meint im poetischen Zusammenhang die Lebenszeit des Sprechers.
theological_decisions:
- issue: Wechsel zwischen »seine Kraft« und »meine Tage«
  choice: Der Wechsel von der 3. zur 1. Person bleibt im Haupttext erhalten.
  alternative: »Er schwächte meine Kraft auf dem Weg; er verkürzte meine Tage.«
  rationale: Der vorliegende hebräische Text weist bei כחו auf die 3. Person, während ימי in der 1. Person steht. Obwohl der Zusammenhang für »meine Kraft« spricht, soll die echte textliche Spannung sichtbar bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Parallelstruktur und das Bild des Weges werden bewahrt; die auffällige Verschiebung der grammatischen Person wird nicht harmonisiert.
