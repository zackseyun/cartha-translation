  source_fidelity: 'Die Übersetzung gibt den hebräischen Parallelismus und die wesentlichen Lexeme treffend wieder: בְּנֵי als „Kinder“, עֲבָדֶיךָ als „deiner Diener“, יִשְׁכּוֹנוּ als „werden wohnen“, זַרְעָם als „ihre Nachkommen“, לְפָנֶיךָ als „vor dir“ und יִכּוֹן als „werden Bestand haben“. Insbesondere wird zu יִשְׁכּוֹנוּ keine im Wortlaut nicht ausgedrückte Sicherheit ergänzt.'
