source:
  edition: WLC
  text: בְּנֵֽי עֲבָדֶ֥י/ךָ יִשְׁכּ֑וֹנוּ וְ֝/זַרְעָ֗/ם לְ/פָנֶ֥י/ךָ יִכּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/028.yaml
  text: The children of your servants will dwell[a], and their offspring will be established before you.
translation:
  language: de
  text: Die Kinder deiner Diener werden wohnen, und ihre Nachkommen werden vor dir Bestand haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Die Kinder
  rationale: Der Konstruktplural von בֵּן kann im Zusammenhang die Kinder beziehungsweise Nachkommen bezeichnen. „Kinder“ ist im modernen Deutschen natürlich und schließt das Geschlecht nicht unnötig ein.
- source_word: עֲבָדֶיךָ
  choice: deiner Diener
  rationale: עֶבֶד kann „Diener“ oder „Sklave“ bedeuten. In der Anrede an Gott ist „Diener“ hier idiomatisch und kontextgemäß.
- source_word: יִשְׁכּוֹנוּ
  choice: werden wohnen
  rationale: Das Verb שכן bedeutet „wohnen, sich niederlassen“. Eine ausdrückliche Ergänzung wie „sicher“ wäre kontextuell denkbar, steht aber nicht eigens im hebräischen Wortlaut.
- source_word: וְזַרְעָם
  choice: und ihre Nachkommen
  rationale: זֶרַע bezeichnet kollektiv Samen beziehungsweise Nachkommenschaft. „Nachkommen“ gibt den gemeinten Personenkreis in heutigem Deutsch klar wieder.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: Die Wendung bedeutet wörtlich „vor deinem Angesicht“ und bezeichnet hier die Gegenwart Gottes. „Vor dir“ ist knapp, würdig und quellennah.
- source_word: יִכּוֹן
  choice: werden Bestand haben
  rationale: Der Nifal von כון bezeichnet das Feststehen oder Gefestigtsein. „Bestand haben“ bewahrt die resultative Stabilität und klingt im Deutschen natürlicher als „etabliert werden“.
theological_decisions:
- issue: Reichweite und heilsgeschichtlicher Horizont der Verheißung
  choice: Die Aussage bleibt eine allgemein formulierte Zusage dauerhaften Wohnens und Fortbestehens der Nachkommen von Gottes Dienern vor ihm.
  alternative: Die Aussage ausdrücklich als Bundesverheißung an Israel oder als endzeitliche Heilszusage kennzeichnen.
  rationale: Der hebräische Vers nennt weder ausdrücklich den Bundesrahmen noch einen bestimmten eschatologischen Zeitpunkt. Die Übersetzung bewahrt daher die Offenheit des Wortlauts.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Psalmton. Der Parallelismus zwischen „wohnen“ und „Bestand haben“ bleibt erhalten; unbelegte Sicherheits- oder Heilsbegriffe werden nicht ergänzt.
