  source_fidelity: Der Text gibt den starken Kontrast von וְאַתָּה angemessen mit „Du aber“ wieder, bewahrt den Gottesnamen als „Jahwe“ und trifft לְעוֹלָם mit „für immer“. „thronst“ ist im poetisch-königlichen Kontext eine sachgemäße idiomatische Wiedergabe von תֵּשֵׁב; die Fußnote hält die wörtlichere und weitere Bedeutung offen. „dein Gedenken währt von Generation zu Generation“ gibt וְזִכְרְךָ לְדֹר וָדֹר treffend und ohne unangemessene Festlegung auf „Ruhm“ wieder.
