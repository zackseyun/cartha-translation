  terminology: „Jahwe“ ist im Deutschen eine etablierte Wiedergabe des Tetragramms. „Gedenken“ bewahrt die Bedeutungsbreite von זֵכֶר besser als eine ausschließlich auf Bekanntheit zielende Wiedergabe. Die Alternativen in den Fußnoten sind sachlich und verständlich.
