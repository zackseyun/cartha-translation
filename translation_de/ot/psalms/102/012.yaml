id: PSA.102.12
reference: Psalms 102:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה לְ/עוֹלָ֣ם תֵּשֵׁ֑ב וְ֝/זִכְרְ/ךָ֗ לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/012.yaml
  text: But you[a], O Yahweh, sit enthroned forever[b], and your remembrance is from generation to generation.
translation:
  language: de
  text: Du aber, Jahwe, thronst für immer[a], und dein Gedenken währt von Generation zu Generation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sitzt für immer“ beziehungsweise „bleibst für immer“. Das hebräische Verb bedeutet wörtlich „sitzen“ und kann in königlichem Zusammenhang auch das Thronen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dein Gedächtnis“, „die Erinnerung an dich“ oder „dein Ruhm“. Das hebräische Wort kann Erinnerung, ehrendes Gedenken oder bleibendes Ansehen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Du aber
  rationale: Das selbstständige Pronomen und die Konjunktion heben den Gegensatz zur Vergänglichkeit des Menschen im vorherigen Zusammenhang hervor. „Du aber“ gibt diesen Kontrast im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen üblichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet hier unbegrenzte Dauer und bildet den Gegenpol zur menschlichen Vergänglichkeit.
- source_word: תֵּשֵׁב
  choice: thronst
  rationale: Das Verb bedeutet wörtlich „sitzen“ und kann im Blick auf Gott im poetisch-königlichen Zusammenhang das Sitzen auf dem Thron beziehungsweise die bleibende Herrschaft ausdrücken.
- source_word: וְזִכְרְךָ
  choice: dein Gedenken
  rationale: Das Substantiv kann Erinnerung, Gedenken, Gedächtnis oder bleibenden Ruhm bezeichnen. „Dein Gedenken“ bewahrt die lexikalische Offenheit besser als das stärker deutende „dein Ruhm“.
- source_word: לְדֹר וָדֹר
  choice: von Generation zu Generation
  rationale: Die geläufige deutsche Wendung gibt die fortlaufende Folge der Generationen idiomatisch wieder.
theological_decisions:
- issue: Die in תֵּשֵׁב mögliche Aussage über Gottes bleibendes Königtum
  choice: thronst für immer
  alternative: sitzt für immer; bleibst für immer
  rationale: „Thronst“ bringt den möglichen königlichen Sinn im Kontext eines Psalms über Gottes beständige Herrschaft zur Geltung. Da das hebräische Verb auch schlichter „sitzen“ oder „bleiben“ bedeuten kann, wird diese Offenheit in der Fußnote kenntlich gemacht.
- issue: Die Bedeutung von זִכְרְךָ
  choice: dein Gedenken
  alternative: dein Gedächtnis; dein Ruhm; die Erinnerung an dich
  rationale: Die Übersetzung wahrt den Bezug zu Erinnerung und öffentlichem Gedenken, ohne den Ausdruck ausschließlich als Ruhm oder Namen zu deuten.
translation_notes:
  register: Moderne, würdevolle Psalmsprache. Die Satzstellung „Du aber“ markiert den starken Kontrast. „Thronst“ ist knapp und königlich, während die Fußnote die wörtlichere Lesart offenhält. „Währt“ ergänzt im Deutschen das im Hebräischen fehlende Kopulaverb und bringt die zeitliche Parallelität natürlich zum Ausdruck.
