base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/026.yaml
  text: They will perish[a], but you will remain; all of them will wear out like a garment. Like clothing you will change them[b], and they will pass away.
translation:
  language: de
  text: Sie werden vergehen, du aber bleibst bestehen[a]; sie alle werden verschleißen wie ein Gewand. Wie ein Kleid wirst du sie wechseln[b], und sie werden vergehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wirst du stehen“; gemeint ist hier dauernder Bestand im Gegensatz zum Vergehen der Schöpfung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wirst du sie ersetzen“. Das hebräische Verb kann im Bild des Kleides sowohl Wechseln als auch Ersetzen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה יֹאבֵדוּ
  choice: Sie werden vergehen
  rationale: אבד bezeichnet hier das zugrunde gehende, vergängliche Geschaffene. „Vergehen“ ist im Deutschen natürlich und behauptet nicht mehr als der Kontext.
- source_word: וְאַתָּה תַעֲמֹד
  choice: du aber bleibst bestehen
  rationale: Das wörtliche „du wirst stehen“ drückt im Gegensatz zum Vergehen der Schöpfung dauernden Bestand aus. „Bleibst bestehen“ bewahrt sowohl den Gedanken des Stehens als auch den zeitlichen Kontrast.
- source_word: וְכֻלָּם
  choice: sie alle
  rationale: Die Wendung bezieht sämtliche zuvor genannten Schöpfungswerke ein und klingt in moderner deutscher Poesie flüssig.
- source_word: כַּבֶּגֶד יִבְלוּ
  choice: werden verschleißen wie ein Gewand
  rationale: בלה bezeichnet besonders bei Textilien das Abgenutztwerden. „Verschleißen“ erhält das konkrete Kleidungsbild.
- source_word: כַּלְּבוּשׁ תַּחֲלִיפֵם
  choice: Wie ein Kleid wirst du sie wechseln
  rationale: Der Hifil von חלף kann „wechseln“, „austauschen“ oder „ersetzen“ bedeuten. „Wechseln“ nimmt das Bild des Kleiderwechsels unmittelbar auf, ohne die Mehrdeutigkeit ganz aufzulösen.
- source_word: וְיַחֲלֹפוּ
  choice: und sie werden dahingehen
  rationale: Der Qal von חלף kann Vorübergehen oder Wechsel bezeichnen. „Dahingehen“ bringt hier die Vergänglichkeit zum Ausdruck und lässt zugleich den Anschluss an den vorangehenden Wortstamm erkennen.
theological_decisions:
- issue: Gottes Fortbestand gegenüber der Vergänglichkeit der Schöpfung
  choice: „du aber bleibst bestehen“
  alternative: „du aber wirst stehen“
  rationale: Die Übersetzung macht den im Vers angelegten Gegensatz verständlich, ohne spätere dogmatische Begriffe wie „Unveränderlichkeit“ ausdrücklich einzutragen.
- issue: Bedeutung des Kleiderwechsels
  choice: „wirst du sie wechseln“
  alternative: „wirst du sie ersetzen“
  rationale: „Wechseln“ wahrt die Bildsprache und lässt offen, ob vor allem Veränderung oder Ersetzung gemeint ist.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewahrter poetischer Parallelität. „Gewand“ und „Kleid“ geben die beiden nah verwandten hebräischen Kleidungsbegriffe wieder; die Wiederholung des Bildfeldes bleibt erhalten.
