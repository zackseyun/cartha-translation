  yaml_path: translation/ot/psalms/102/016.yaml
  text: For Yahweh has built Zion[a]; he has appeared in his glory.
translation:
  language: de
  text: Denn Jahwe hat Zion erbaut; er ist in seiner Herrlichkeit erschienen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er ist in seiner Herrlichkeit zu sehen“ bzw. „Er ist in seiner Herrlichkeit gesehen worden.“ Das hebräische Verb kann sowohl ein göttliches Erscheinen als auch ein Gesehenwerden bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet bzw. erläutert die vorausgehende Aussage; „Denn“ bewahrt diese Verknüpfung in natürlichem deutschem Psalmstil.
- source_word: בָנָה
  choice: hat … erbaut
  rationale: Das Qatal wird als vollendete Handlung wiedergegeben. „Erbaut“ bezeichnet den Bau bzw. die Wiederherstellung einer Stadt, ohne das im Hebräischen nicht ausdrücklich vorhandene Präfix „wieder-“ einzufügen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der hebräische Ortsname bleibt erhalten; mögliche metonymische Bezüge auf Jerusalem oder Gottes Volk werden nicht in den Text hineingedeutet.
- source_word: נִרְאָה
  choice: ist … erschienen
  rationale: Das Nifal von ראה kann „erscheinen“ oder „gesehen werden“ bedeuten. Im Haupttext gibt „ist erschienen“ eine natürliche Aussage göttlicher Selbstoffenbarung wieder; die passive Lesart bleibt in der Fußnote erhalten.
- source_word: בִּכְבוֹדוֹ
  choice: in seiner Herrlichkeit
  rationale: כָּבוֹד bezeichnet Herrlichkeit, Ehre oder Pracht. „In seiner Herrlichkeit“ gibt die traditionelle und kontextuell gewichtige Bedeutung unmittelbar wieder.
theological_decisions:
- issue: Deutung von נִרְאָה בִּכְבוֹדוֹ als göttliches Erscheinen oder Gesehenwerden
  choice: er ist in seiner Herrlichkeit erschienen
  alternative: er wird in seiner Herrlichkeit gesehen / er ist in seiner Herrlichkeit gesehen worden
  rationale: Die mediale bzw. intransitive Bedeutung „erscheinen“ passt gut zur göttlichen Offenbarung und zum vollendeten Aspekt des vorhergehenden Verbs. Da das hebräische Nifal zugleich passiv verstanden werden kann, wird diese echte Mehrdeutigkeit ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzstruktur. Das Perfekt gibt die beiden hebräischen Qatal-Formen natürlich wieder; das Semikolon bewahrt die enge Parallelität der Aussagen.
