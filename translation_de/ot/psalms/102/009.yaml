base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/009.yaml
  text: For I have eaten ashes like bread[a], and mixed my drink with weeping.
translation:
  language: de
  text: 'Denn Asche habe ich wie Brot gegessen,

    und meinen Trank mit Weinen vermischt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und meinen Trank mit Tränen vermischt.“ Wörtlich steht im Hebräischen „mit Weinen“.'
