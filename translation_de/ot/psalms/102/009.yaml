lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der Klage ein und bewahrt den kausalen Zusammenhang.
- source_word: אֵפֶר
  choice: Asche
  rationale: Bezeichnet hier Asche als Zeichen von Trauer, Erniedrigung und Elend; der deutsche Stoffname steht idiomatisch im Singular.
- source_word: כַּלֶּחֶם
  choice: wie Brot
  rationale: Das Präfix כְּ markiert einen Vergleich; die knappe Wendung erhält das eindringliche Bild.
- source_word: אָכָלְתִּי
  choice: habe ich … gegessen
  rationale: Das Perfekt gibt die erfahrene Wirklichkeit des Beters wieder; das deutsche Perfekt klingt in heutiger Sprache natürlich.
- source_word: שִׁקֻּוַי
  choice: meinen Trank
  rationale: Gemeint ist das Getränk des Beters, nicht ein kultisches Trankopfer. „Trank“ ist knapp, würdig und poetisch.
- source_word: בִּבְכִי
  choice: mit Weinen
  rationale: Gibt das hebräische Substantiv בְּכִי formal wieder und bewahrt dessen Vorgangscharakter; konkretisierend ist auch „mit Tränen“ möglich.
- source_word: מָסָכְתִּי
  choice: vermischt
  rationale: Das Verb bezeichnet das Mischen von Flüssigkeiten; hier wird der Trank bildhaft mit dem Weinen vermischt.
theological_decisions: []
