  text: אֹמַ֗ר אֵלִ֗/י אַֽל תַּ֭עֲלֵ/נִי בַּ/חֲצִ֣י יָמָ֑/י בְּ/ד֖וֹר דּוֹרִ֣ים שְׁנוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/024.yaml
  text: I say[a], “My God, do not take me away in the middle of my days[b]; your years are through all generations.”
translation:
  language: de
  text: 'Ich sage: „Mein Gott, nimm mich nicht in der Mitte meiner Tage hinweg[a]! Deine Jahre währen von Generation zu Generation[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Führe mich nicht in der Mitte meiner Tage hinauf.“ Das hebräische Verb bedeutet in dieser Verbform „hinaufführen“ oder „hinaufbringen“; hier meint es wahrscheinlich, vorzeitig aus dem Leben hinweggenommen zu werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch alle Generationen hindurch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Ich sage
  rationale: Das Qal-Imperfekt der 1. Person Singular kann in poetischer Rede gegenwärtig bzw. als lebendige Einleitung der Bitte verstanden werden. „Ich sage“ bewahrt diese Offenheit natürlicher als eine unnötige Festlegung auf die Vergangenheit.
- source_word: אֵלִי
  choice: mein Gott
  rationale: Die Form mit Suffix der 1. Person Singular bedeutet „mein Gott“ und fungiert hier als Anrede.
- source_word: אַל תַּעֲלֵנִי
  choice: nimm mich nicht … hinweg
  rationale: Das Hifil von עלה bedeutet formal „hinaufführen/hinaufbringen“. Im Zusammenhang mit den begrenzten Lebenstagen bezeichnet die Wendung wahrscheinlich das vorzeitige Hinwegnehmen aus dem Leben. „Hinwegnehmen“ gibt den kontextuellen Sinn wieder, ohne den Tod ausdrücklich in den Text einzutragen.
- source_word: בַּחֲצִי יָמָי
  choice: mitten aus meinen Tagen
  rationale: Wörtlich steht „in der Hälfte/meinen halben Tagen“. Die gewählte Formulierung bewahrt das Bild eines vorzeitig abgebrochenen Lebens und verbindet sich im Deutschen natürlich mit „hinwegnehmen“.
- source_word: בְּדוֹר דּוֹרִים
  choice: von Generation zu Generation
  rationale: Die hebräische Wendung bezeichnet die fortdauernde Folge der Generationen. Diese deutsche Entsprechung ist idiomatisch und bleibt der Form des Hebräischen nahe.
- source_word: שְׁנוֹתֶיךָ
  choice: deine Jahre
  rationale: Die schlichte Wiedergabe bewahrt den bewussten Gegensatz zwischen den begrenzten Tagen des Betenden und Gottes fortdauernden Jahren.
theological_decisions:
- issue: Bildhafte Rede vom vorzeitigen Tod
  choice: „nimm mich nicht … hinweg“
  alternative: „lass mich nicht hinaufsteigen“ / „führe mich nicht hinauf“
  rationale: Der unmittelbare Gegensatz zwischen der Lebensmitte des Betenden und Gottes Jahren durch alle Generationen spricht für ein vorzeitiges Hinwegnehmen aus dem Leben. Die Übersetzung macht den wahrscheinlichen Sinn verständlich, ohne eine weitergehende Lehraussage einzufügen.
- issue: Zeitliche Dauer Gottes
  choice: „Deine Jahre währen von Generation zu Generation“
  alternative: „Deine Jahre sind durch alle Generationen hindurch“
  rationale: „Währen“ drückt die im Nominalsatz vorausgesetzte Fortdauer aus. Die Aussage bleibt bei der poetischen Gegenüberstellung von menschlicher Kürze und Gottes Beständigkeit.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. „Hinwegnehmen“ bewahrt den poetischen Ernst und vermeidet eine übermäßig explizite Ausdeutung; „währen“ ist gehoben, aber im heutigen Standarddeutsch gut verständlich.
