source:
  edition: WLC
  text: לְ/סַפֵּ֣ר בְּ֭/צִיּוֹן שֵׁ֣ם יְהוָ֑ה וּ֝/תְהִלָּת֗/וֹ בִּ/ירוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/021.yaml
  text: to declare the name of Yahweh in Zion[a], and his praise in Jerusalem,
translation:
  language: de
  text: um in Zion den Namen Jahwes[a] und in Jerusalem sein Lob zu verkünden,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH (יהוה), der persönliche Name Gottes; hier mit „Jahwe“ wiedergegeben.'
    reason: Erläuterung des Gottesnamens
lexical_decisions:
- source_word: לְסַפֵּר
  choice: zu verkünden
  rationale: Der mit לְ gebildete Infinitiv bezeichnet im Zusammenhang Zweck oder Folge. Das Piel von ספר bedeutet „erzählen, kundtun“; bei Gottes Namen und Lob passt das öffentliche „verkünden“ am besten.
- source_word: בְּצִיּוֹן
  choice: in Zion
  rationale: Die Präposition בְּ bezeichnet hier den Ort; „Zion“ bleibt als gebräuchlicher Eigenname erhalten.
- source_word: שֵׁם
  choice: Namen
  rationale: Die konkrete Wiedergabe bewahrt die Bedeutungsspanne von Gottes offenbartem Namen, seiner Identität und seinem Ruf.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Das Tetragramm wird als der im Deutschen gebräuchliche Name „Jahwe“ wiedergegeben; der Genitiv ist durch die Verbindung „Name Jahwes“ bedingt.
- source_word: וּתְהִלָּתוֹ
  choice: und … sein Lob
  rationale: תְּהִלָּה bedeutet „Lob“; das Suffix der 3. Person Singular wird mit „sein“ wiedergegeben. Gemeint sein kann sowohl das ihm dargebrachte Lob als auch die Verkündigung seiner Ruhmestaten.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: בִּ bezeichnet den Ort; „Jerusalem“ ist die standarddeutsche Namensform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den Unterschied zwischen Eigenname und Titel, ohne die Aussage konfessionell auszudeuten.
- issue: Bedeutung von „sein Lob“
  choice: die knappe, mehrdeutige Formulierung „sein Lob“
  alternative: „das Lob für ihn“ oder „seine Ruhmestaten“
  rationale: Das Hebräische lässt offen, ob vor allem das Gott dargebrachte Lob oder der berichtete Grund seines Ruhmes gemeint ist. Die direkte Wiedergabe erhält diese Spannung.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstellung verbindet das einmal gesetzte „zu verkünden“ natürlich mit beiden parallelen Satzgliedern und bewahrt zugleich die Zuordnung von Zion zum Namen Jahwes und Jerusalem zu seinem Lob.
