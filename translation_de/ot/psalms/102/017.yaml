  text: He turned to the prayer of the destitute and did not despise their prayer[a].
translation:
  language: de
  text: Er wandte sich dem Gebet der Mittellosen zu und verachtete ihr Gebet nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Verarmten«, »der Hilflosen«. Das hebräische Wort kann an anderen Stellen auch einen Wüstenstrauch bezeichnen; hier steht es wohl bildhaft für Menschen, die alles entbehren oder vereinsamt sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנָה
  choice: wandte sich … zu
  rationale: Bewahrt das konkrete Bild des hebräischen Verbs und bezeichnet im Zusammenhang die aufmerksame Hinwendung zum Gebet.
- source_word: תְּפִלַּת
  choice: dem Gebet des
  rationale: Gibt die Konstruktverbindung direkt wieder und bewahrt die Wiederholung von »Gebet« im zweiten Halbvers.
- source_word: הָעַרְעָר
  choice: des Mittellosen
  rationale: Im Zusammenhang bezeichnet das Wort einen bedürftigen, entblößten oder vereinsamten Menschen; »Mittelloser« ist verständlich und würdevoll, ohne das mögliche Hintergrundbild festzuschreiben.
- source_word: בָזָה
  choice: verachtete
  rationale: Entspricht der wertenden und affektiven Stärke des hebräischen Verbs besser als das schwächere »wies zurück«.
- source_word: תְּפִלָּתָם
  choice: ihr Gebet
  rationale: Bewahrt sowohl den pluralischen Suffixbezug als auch den singularischen Kollektivausdruck und die hebräische Wortwiederholung.
theological_decisions:
- issue: Anthropologische Bedeutung von עַרְעָר
  choice: ein mittelloser Mensch beziehungsweise Mittellose als Gruppe
  alternative: ein Einsamer oder einer, der einem Wüstenstrauch gleicht
  rationale: Das pluralische »ihr Gebet« weist auf betende Menschen. Die Hauptübersetzung nennt daher ihren Zustand, während die mögliche Bild- und Bedeutungsbreite in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Wendung »wandte sich … zu« und die Wiederholung von »Gebet« bewahren die Bildhaftigkeit und Struktur des Hebräischen.
