source:
  edition: WLC
  text: מִ/פְּנֵֽי זַֽעַמְ/ךָ֥ וְ/קִצְפֶּ֑/ךָ כִּ֥י נְ֝שָׂאתַ֗/נִי וַ/תַּשְׁלִיכֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/010.yaml
  text: because of your indignation and your wrath[a], for you have lifted me up and cast me away.
translation:
  language: de
  text: Wegen deines Zorns und deines Grimms; denn du hast mich hochgehoben und weggeschleudert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Die Verbindung bezeichnet hier idiomatisch den Grund beziehungsweise die Ursache, nicht eine räumliche Bewegung „von dem Angesicht weg“.
- source_word: זַעַמְךָ
  choice: deines Zorns
  rationale: זַעַם bezeichnet heftigen Zorn oder Unwillen. „Zorn“ ist im heutigen Deutsch klar, würdig und lässt sich vom folgenden קֶצֶף unterscheiden.
- source_word: וְקִצְפֶּךָ
  choice: und deines Grimms
  rationale: קֶצֶף bezeichnet heftigen Zorn. „Grimm“ bewahrt die poetische Paarung zweier naher, aber nicht identischer Ausdrücke, ohne beide zu einem einzigen Begriff einzuebnen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die erklärende Begründung für die vorausgehende Aussage ein; „denn“ gibt diese Funktion natürlich und in poetisch gehobenem Deutsch wieder.
- source_word: נְשָׂאתַנִי
  choice: du hast mich hochgehoben
  rationale: נשׂא kann „heben“, „tragen“ oder „emporheben“ bedeuten. Im Gegensatz zum anschließenden Wegschleudern ist „hochgehoben“ anschaulich und unmittelbar verständlich.
- source_word: וַתַּשְׁלִיכֵנִי
  choice: und weggeschleudert
  rationale: שלך bezeichnet ein Werfen oder Schleudern. „Weggeschleudert“ erhält die kraftvolle Bewegung und den Eindruck des Verstoßens, ohne altertümlich zu klingen.
theological_decisions:
- issue: Darstellung des göttlichen Zorns
  choice: Beide hebräischen Zornbegriffe werden als „Zorn“ und „Grimm“ beibehalten.
  alternative: Beide Begriffe einheitlich mit „Zorn“ wiederzugeben oder die Aussage abzumildern.
  rationale: Der hebräische Text verwendet zwei einander verstärkende Ausdrücke für Gottes heftigen Unwillen. Die Übersetzung bewahrt diese Spannung und Intensität, ohne sie dogmatisch zu erklären oder abzuschwächen.
- issue: Gott als Handelnder beim Hochheben und Wegschleudern
  choice: Die direkte Anrede und Gottes ausdrückliches Handeln bleiben unverändert erhalten.
  alternative: Das Geschehen unpersönlich oder lediglich als subjektives Empfinden des Beters auszudrücken.
  rationale: Die Verbformen nennen Gott unmittelbar als Handelnden. Die bildhafte und theologisch spannungsvolle Klage darf nicht stillschweigend entschärft werden.
translation_notes:
  register: Modernes, würdiges und poetisches Standarddeutsch. Die Alliteration beziehungsweise Klangnähe von „Zorn“ und „Grimm“ ist nicht erzwungen; wichtiger sind die semantische Unterscheidung der beiden Zornbegriffe und das kräftige Bewegungsbild der beiden Verben.
