  variant: modern standard German
source:
  edition: WLC
  text: אַל תַּסְתֵּ֬ר פָּנֶ֨י/ךָ מִמֶּ/נִּי֮ בְּ/י֪וֹם צַ֫ר לִ֥/י הַטֵּֽה אֵלַ֥/י אָזְנֶ֑/ךָ בְּ/י֥וֹם אֶ֝קְרָ֗א מַהֵ֥ר עֲנֵֽ/נִי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/002.yaml
  text: Do not hide your face from me in the day of my distress[a]; incline your ear to me. In the day I call[c][b], answer me quickly.
translation:
  language: de
  text: Verbirg dein Angesicht nicht vor mir am Tag meiner Not[a]. Neige dein Ohr zu mir; an dem Tag, an dem ich rufe, antworte mir schnell.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Tag, da mir Bedrängnis ist“. „Dein Angesicht“ kann zugleich Gottes zugewandte Gegenwart bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Beeile dich, mir zu antworten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּסְתֵּר
  choice: Verbirg … nicht
  rationale: Die Negation mit dem folgenden Verb formuliert eine dringliche Bitte. „Verbergen“ gibt סתר genau und in natürlichem deutschem Gebetsstil wieder.
- source_word: פָּנֶיךָ
  choice: dein Angesicht
  rationale: Bewahrt das konkrete hebräische Bild. „Angesicht“ ist im Deutschen würdevoll und in poetischer Gebetssprache verständlich; gemeint sein kann Gottes zugewandte Gegenwart.
- source_word: מִמֶּנִּי
  choice: vor mir
  rationale: Beim deutschen Ausdruck „sein Angesicht vor jemandem verbergen“ ist „vor mir“ idiomatischer als das wörtlichere „von mir“.
- source_word: בְּיוֹם צַר לִי
  choice: am Tag meiner Not
  rationale: Gibt die Zeitangabe und den persönlichen Bezug der wörtlichen Wendung „am Tag, da mir Bedrängnis ist“ knapp und natürlich wieder.
- source_word: הַטֵּה אֵלַי אָזְנֶךָ
  choice: Neige dein Ohr zu mir
  rationale: Erhält das anthropomorphe Gebetsbild und folgt der hebräischen Richtungsaussage, ohne sie zu paraphrasieren.
- source_word: בְּיוֹם אֶקְרָא
  choice: an dem Tag, an dem ich rufe
  rationale: Bewahrt die wiederholte Tagesformel und damit die poetische Struktur des Hebräischen.
- source_word: מַהֵר עֲנֵנִי
  choice: antworte mir schnell
  rationale: מַהֵר kann adverbial verstanden werden. Die Formulierung ist unmittelbar und modernes Standarddeutsch; alternativ kann der Ausdruck als Aufforderung „Beeile dich, mir zu antworten“ aufgefasst werden.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes „Angesicht“ und „Ohr“
  choice: Die konkreten Bilder im Haupttext bewahren
  alternative: „Entzieh mir deine Gegenwart nicht“ und „höre auf mich“
  rationale: Die Bilder drücken Gottes Zuwendung und aufmerksames Hören aus. Ihre Beibehaltung erhält die poetische Kraft, ohne eine Aussage über eine körperliche Gestalt Gottes zu erzwingen.
- issue: Wiederholung der zeitlichen Wendung בְּיוֹם
  choice: Die Wiederholung mit „am/an dem Tag“ erhalten
  alternative: Beide Wendungen mit „wenn“ auflösen
  rationale: Die Wiederholung prägt Rhythmus und Dringlichkeit des Verses und lässt sich im Deutschen verständlich wiedergeben.
- issue: Syntaktische Funktion von מַהֵר
  choice: 'Adverbial: „antworte mir schnell“'
  alternative: 'Verbal: „Beeile dich, mir zu antworten“'
  rationale: Beide Analysen vermitteln dieselbe dringliche Bitte. Die adverbiale Fassung ist knapp und folgt der überlieferten Akzent- und Satzauffassung gut, ohne die Alternative auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter Bildsprache. „Angesicht“ ist gegenüber „Gesicht“ leicht gehoben, trägt hier aber den poetischen und gottesdienstlichen Ton, ohne altertümliche Satzformen zu verwenden.
