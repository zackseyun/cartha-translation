lexical_decisions:
- source_word: לִשְׁמֹעַ
  choice: zu hören
  rationale: Der Infinitiv mit ל bezeichnet im größeren Satz den Zweck bzw. das Ergebnis. „Zu hören“ gibt die Grundbedeutung direkt wieder und wahrt die parallele Infinitivstruktur.
- source_word: אֶנְקַת
  choice: das Stöhnen
  rationale: Das Substantiv bezeichnet ein leidvolles Stöhnen oder Seufzen. „Stöhnen“ bringt die Schwere der Not klar zum Ausdruck.
- source_word: אָסִיר
  choice: des Gefangenen
  rationale: Das Wort bezeichnet einen Gebundenen oder Inhaftierten. Der Singular des Hebräischen bleibt erhalten; er kann hier repräsentativ bzw. kollektiv verstanden werden.
- source_word: לְפַתֵּחַ
  choice: freizulassen
  rationale: פתח bedeutet wörtlich „öffnen“. Auf Menschen in Gefangenschaft oder Todesnot bezogen bezeichnet es hier idiomatisch ihre Befreiung; „freizulassen“ ist im Deutschen natürlich und kontextgerecht.
- source_word: בְּנֵי תְמוּתָה
  choice: die Söhne des Todes
  rationale: Die wörtliche hebräische Wendung wird beibehalten, um ihr eindringliches Bild und ihre Deutungsoffenheit zu bewahren. Die gemeinte idiomatische Bedeutung wird in der Fußnote erläutert.
