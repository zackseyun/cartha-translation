  language: de
  text: Vom Klang meines Stöhnens[a] kleben meine Knochen an meiner Haut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wegen meines Stöhnens“. Die hebräische Präposition kann sowohl den Ausgangspunkt als auch die Ursache bezeichnen.'
