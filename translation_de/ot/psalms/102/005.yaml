    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: Vom lauten
  rationale: מִן mit קוֹל kann hier Ursache beziehungsweise Ausgangspunkt ausdrücken. Im Deutschen gibt „vom lauten Stöhnen“ die hörbare Äußerung und ihre ursächliche Verbindung mit dem körperlichen Verfall natürlich wieder.
- source_word: אַנְחָתִי
  choice: Stöhnen
  rationale: Das Substantiv bezeichnet ein aus Not hervorgehendes Seufzen oder Stöhnen. „Stöhnen“ entspricht der Intensität des Klagekontexts.
- source_word: דָּבְקָה
  choice: kleben
  rationale: דבק bezeichnet festes Haften. „Kleben“ bewahrt das drastische körperliche Bild und ist im heutigen Deutsch idiomatisch.
- source_word: עַצְמִי
  choice: meine Knochen
  rationale: Die morphologisch singularische Form kann kollektiv gebraucht sein; im Deutschen ist in diesem Bild der Plural natürlich.
- source_word: לִבְשָׂרִי
  choice: an meiner Haut
  rationale: בשר bedeutet grundsätzlich „Fleisch“, kann hier im Bild äußerster Abmagerung jedoch die den Knochen unmittelbar anliegende Haut bezeichnen. „Haut“ macht das gemeinte körperliche Bild im Deutschen verständlich; die formnähere Wiedergabe wird in einer Fußnote erhalten.
