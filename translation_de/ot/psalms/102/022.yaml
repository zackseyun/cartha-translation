source:
  edition: WLC
  text: בְּ/הִקָּבֵ֣ץ עַמִּ֣ים יַחְדָּ֑ו וּ֝/מַמְלָכ֗וֹת לַ/עֲבֹ֥ד אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/022.yaml
  text: when peoples gather together[a], and kingdoms[c][b], to serve Yahweh—
translation:
  language: de
  text: wenn Völker und Königreiche sich gemeinsam versammeln[a], um Jahwe zu dienen[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wenn Völker und Königreiche gemeinsam versammelt werden«; die hebräische Form kann reflexiv oder passiv wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: »Dienen« kann hier, da Gott das Gegenüber ist, auch »verehren« oder »anbeten« einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִקָּבֵץ
  choice: wenn … sich versammeln
  rationale: Die Präposition בְּ mit dem Infinitiv constructus bezeichnet hier den Zeitpunkt. Das deutsche reflexive »sich versammeln« gibt das Ereignis natürlich wieder; wegen der Nifal-Form bleibt auch eine passive Wiedergabe möglich.
- source_word: עַמִּים
  choice: Völker
  rationale: »Völker« bewahrt den pluralischen, gemeinschaftlichen Sinn und vermeidet eine Einengung auf moderne Nationalstaaten.
- source_word: יַחְדָּו
  choice: gemeinsam
  rationale: Das Adverb hebt das gemeinsame Zusammenkommen hervor; »gemeinsam« ist in dieser Satzstellung idiomatischer als »zusammen«.
- source_word: וּמַמְלָכוֹת
  choice: und Königreiche
  rationale: Die Wiedergabe bewahrt die koordinierende Konjunktion und den politischen beziehungsweise herrschaftlichen Sinn von מַמְלָכוֹת.
- source_word: לַעֲבֹד
  choice: um … zu dienen
  rationale: Die finale Konstruktion wird im Deutschen natürlich mit »um … zu« wiedergegeben. »Dienen« ist die direkte und breitere Entsprechung; im Blick auf Gott kann das Verb auch gottesdienstliche Verehrung einschließen.
- source_word: אֶת יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben; die Akkusativpartikel אֶת bleibt unübersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen ausdrücklich. »Jahwe« macht diesen Bundesnamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von עבד bei Gott als Objekt
  choice: dienen
  alternative: anbeten / verehren
  rationale: »Dienen« bewahrt den weiteren Bedeutungsumfang des hebräischen Verbs; der gottesdienstliche Sinn wird nicht ausgeschlossen und in einer Fußnote kenntlich gemacht.
- issue: Diathese von הִקָּבֵץ
  choice: sich versammeln
  alternative: versammelt werden
  rationale: Die Nifal-Form kann passiv verstanden werden. Das deutsche Reflexiv ist hier natürlich und lässt das Zusammenkommen als gemeinsames Geschehen hervortreten, ohne einen Handelnden hinzuzufügen.
translation_notes:
  register: Moderne, gut verständliche und zugleich würdige Psalmsprache. Die Wortstellung verbindet »Völker und Königreiche« als gemeinsames Subjekt und gibt יַחְדָּו ausdrücklich mit »gemeinsam« wieder. Der Gedankenstrich bewahrt den offenen Anschluss des Verses im poetischen Kontext.
