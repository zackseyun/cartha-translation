  text: לְ֭/פָנִים הָ/אָ֣רֶץ יָסַ֑דְתָּ וּֽ/מַעֲשֵׂ֖ה יָדֶ֣י/ךָ שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/025.yaml
  text: Long ago you founded the earth[a], and the heavens are the work of your hands.
translation:
  language: de
  text: Vor langer Zeit hast du die Erde gegründet[a], und die Himmel sind das Werk deiner Hände.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hast du den Grund der Erde gelegt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  choice: Vor langer Zeit
  rationale: Die temporale Wendung bedeutet hier „einst/vor langer Zeit“. Die gewählte Formulierung ist modern und verständlich und wahrt den Rückblick auf die Urzeit.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Der Parallelismus mit „die Himmel“ zeigt den kosmischen Sinn; daher ist „Erde“ statt „Land“ gemeint.
- source_word: יָסַדְתָּ
  choice: hast du … gegründet
  rationale: יסד bezeichnet das Gründen beziehungsweise Legen eines Fundaments. „gegründet“ bewahrt das Fundamentmotiv knapp und würdevoll.
- source_word: וּמַעֲשֵׂה
  choice: und … sind das Werk
  rationale: Die hebräische Nominalkonstruktion wird im Deutschen durch die ergänzte Kopula „sind“ als natürlicher Satz wiedergegeben.
- source_word: יָדֶיךָ
  choice: deiner Hände
  rationale: Die anthropomorphe Rede vom Werk der göttlichen Hände wird unverändert bewahrt.
- source_word: שָׁמָיִם
  choice: die Himmel
  rationale: Der hebräische Ausdruck steht in poetisch-kosmischem Parallelismus zur Erde. „die Himmel“ erhält Form und gehobenen Klang, ohne ihn auf den sichtbaren Himmel zu verengen.
theological_decisions:
- issue: Die Schöpfung wird unmittelbar Gott zugeschrieben
  choice: 'Die direkte Anrede bleibt erhalten: Gott hat die Erde gegründet, und die Himmel sind das Werk seiner Hände.'
  alternative: Die Aussage durch unpersönliche Schöpfungssprache oder durch eine Abschwächung des Bildes von Gottes Händen wiederzugeben.
  rationale: Der hebräische Text schreibt Gott die Schöpfung in direkter Anrede zu. Die Übersetzung bewahrt sowohl diese Aussage als auch die anthropomorphe Handwerksmetapher.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem poetischem Ton. Der kosmische Parallelismus „Erde – Himmel“ und das Bild vom Werk der Hände bleiben erhalten.
