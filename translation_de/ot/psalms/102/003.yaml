  source_fidelity: Die kausale Einleitung, das Rauchbild und die persönliche Klage sind zutreffend wiedergegeben. נִחָרוּ bezeichnet jedoch eher ein Erhitzt-, Versengt- oder Verbranntsein als bloßes Glühen. Das seltene קֵד bleibt in seiner konkreten Referenz unsicher und sollte im Haupttext nicht stärker festgelegt werden als nötig.
  naturalness: '„Meine Gebeine glühen wie eine Feuerstätte“ ist zwar verständlich, aber im Deutschen ein etwas unnatürlicher Vergleich: Eine Feuerstätte ist primär ein Ort, und „glühen“ schwächt bzw. verschiebt das passive Brand-/Versengungsbild. Eine Formulierung mit „versengt“ ist idiomatischer und bildet die hebräische Verbform genauer ab.'
  terminology: „Gebeine“ passt zum würdevollen Psalmregister und ist als Wiedergabe von עֲצָמוֹת angemessen. „Feuerstätte“ kann als vorsichtige Haupttextlösung für קֵד beibehalten werden, sofern die Fußnote die lexikalische Unsicherheit transparent macht.
