  - severity: low
    issue: Vergleichskonstruktion „glühen wie eine Feuerstätte“
    rationale: Die direkte Konstruktion ist im Deutschen stilistisch sperrig, weil eine Feuerstätte als Ort nicht prototypisch „glüht“. „wie an einer Feuerstätte versengt“ vermittelt das Bild natürlicher, ohne die unsichere Bedeutung von קֵד dogmatisch festzulegen.
