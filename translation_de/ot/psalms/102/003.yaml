base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/003.yaml
  text: For my days vanish like smoke[a], and my bones burn like a hearth.
translation:
  language: de
  text: Denn meine Tage schwinden wie Rauch, und meine Gebeine sind wie an einer Feuerstätte versengt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Meine Gebeine sind wie ein Feuerbrand versengt«, »wie in einem Ofen« oder »wie an einem Kohlenbecken«. Das hebräische Wort für den brennenden Gegenstand oder Ort ist selten; das genaue Bild bleibt daher unsicher, doch starke Hitze ist eindeutig gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der Klage ein und bewahrt den kausalen Zusammenhang in natürlichem, poetischem Deutsch.
- source_word: כָלוּ
  choice: schwinden
  rationale: Das Verb bezeichnet das Zu-Ende-Gehen oder Aufgezehrtwerden. Zusammen mit dem Rauchbild gibt »schwinden« das Vergehen der Tage treffend wieder.
- source_word: בְעָשָׁן
  choice: wie Rauch
  rationale: 'Die Präposition lautet wörtlich »in«; im Zusammenhang ist jedoch ein Vergleich gemeint: Die Tage vergehen, wie Rauch sich verflüchtigt.'
- source_word: יָמָי
  choice: meine Tage
  rationale: Direkte Wiedergabe mit Suffix der ersten Person; die persönliche Klage bleibt erhalten.
- source_word: וְעַצְמוֹתַי
  choice: und meine Gebeine
  rationale: Bewahrt das körperliche Bild. »Gebeine« ist in deutscher Bibel- und Dichtungssprache würdevoll und verständlich.
- source_word: כְּמוֹ
  choice: wie
  rationale: Natürliche deutsche Wiedergabe des Vergleichspartikels.
- source_word: קֵד
  choice: eine Feuerstätte
  rationale: Das seltene Substantiv bezeichnet offenbar einen brennenden Gegenstand oder Ort intensiver Hitze; »Feuerstätte« bewahrt diese Unbestimmtheit besser als eine engere Festlegung.
- source_word: נִחָרוּ
  choice: glühen
  rationale: Das Verb beschreibt starkes Erhitzt-, Versengt- oder Entzündetsein. »Glühen« ist mit »Gebeine« bildkräftig und legt nicht zwingend vollständiges Verkohlen nahe.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Psalmsprache. »Schwinden« und »Gebeine« erhalten den poetischen Ton, während die seltene Brandmetapher im Haupttext bewusst nicht zu eng bestimmt und in der Fußnote erläutert wird.
