base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/027.yaml
  text: But you are the same[a], and your years will not come to an end.
translation:
  language: de
  text: Doch du bleibst derselbe[a], und deine Jahre werden kein Ende haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „du bist er“; gemeint ist: Du bist und bleibst derselbe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Doch du
  rationale: Die Konjunktion mit dem selbstständigen Pronomen hebt den Gegensatz zur Vergänglichkeit und Veränderlichkeit der Schöpfung im vorherigen Vers hervor. „Doch du“ gibt diesen adversativen Sinn im Deutschen natürlich wieder.
- source_word: הוּא
  choice: bleibst derselbe
  rationale: Wörtlich steht „du bist er“. Im Kontext bezeichnet die Wendung Gottes fortbestehende Identität im Gegensatz zur sich wandelnden Schöpfung. „Bleibst derselbe“ gibt diesen idiomatischen Sinn verständlich wieder.
- source_word: וּ/שְׁנוֹתֶיךָ
  choice: und deine Jahre
  rationale: שָׁנָה bezeichnet hier Jahre im zeitlichen Sinn; das Suffix der zweiten Person Singular ergibt „deine Jahre“.
- source_word: לֹא יִתָּמּוּ
  choice: werden kein Ende haben
  rationale: Das negierte Imperfekt von תמם besagt, dass die Jahre nicht enden oder vollendet werden. Die deutsche Wendung drückt die unbegrenzte Dauer klar und würdig aus.
theological_decisions:
- issue: Wiedergabe der Wendung „du bist er“ im Blick auf Gottes bleibende Identität
  choice: du bleibst derselbe
  alternative: du bist derselbe; du bist es
  rationale: Die Übersetzung bewahrt den Gegensatz zwischen Gottes beständiger Identität und der Veränderlichkeit der Schöpfung, ohne eine weitergehende philosophische Lehre ausdrücklich in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Rhythmus. Die Formulierung ist allgemein verständlich und wahrt die knappe Parallelstruktur des Hebräischen.
