lexical_decisions:
- source_word: דָּמִיתִי
  choice: Ich gleiche
  rationale: Das Qal von דמה drückt hier einen Vergleich aus. „Ich gleiche“ ist im Deutschen knapp, poetisch und bewahrt gegenüber der zweiten Vershälfte eine leichte Variation.
- source_word: לִקְאַת
  choice: einem Wüstenvogel
  rationale: קָאַת ist eine unsichere Vogelbezeichnung. Der Oberbegriff „Wüstenvogel“ bewahrt die zoologische Unbestimmtheit und verbindet das Tier natürlich mit מִדְבָּר.
- source_word: מִדְבָּר
  choice: Wüsten-
  rationale: מִדְבָּר bezeichnet unbewohntes, unbebautes Land. Im zusammengesetzten Ausdruck „Wüstenvogel“ wird die knappe hebräische Ortszuordnung natürlich wiedergegeben.
- source_word: הָיִיתִי
  choice: ich bin
  rationale: Das Perfekt von היה kann hier einen bestehenden beziehungsweise resultierenden Zustand ausdrücken. Im poetischen Zusammenhang ist das gegenwärtige „ich bin“ natürlich, ohne einen früheren Zustandswechsel zu erzwingen.
- source_word: כְּכוֹס
  choice: wie eine Eule
  rationale: כּוֹס bezeichnet hier einen Vogel, wahrscheinlich eine Eulenart; die genaue Art ist unsicher. „Eule“ vermittelt das Bild eines einsamen Vogels, ohne übermäßig genaue zoologische Festlegung.
- source_word: חֳרָבוֹת
  choice: in den Ruinen
  rationale: Der Plural bezeichnet Ruinen oder verwüstete Orte. „In den Ruinen“ gibt das räumliche Bild idiomatisch und prägnant wieder.
