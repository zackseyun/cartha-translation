id: PSA.102.1
reference: Psalms 102:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְ֭הוָה שִׁמְעָ֣/ה תְפִלָּתִ֑/י וְ֝/שַׁוְעָתִ֗/י אֵלֶ֥י/ךָ תָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/001.yaml
  text: O Yahweh[a], hear my prayer, and let my cry come to you.
translation:
  language: de
  text: Jahwe[a], höre mein Gebet, und lass meinen Hilferuf zu dir kommen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit »der HERR« wiedergegeben. Die genaue historische Aussprache ist nicht sicher; weitere Wiedergaben sind »Jahweh« und »Jehova«.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes persönlicher Name wiedergegeben; „Jahwe“ ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: שִׁמְעָה
  choice: höre
  rationale: Der Qal-Imperativ richtet eine unmittelbare Bitte an Jahwe; „höre“ bewahrt Form und Nachdruck.
- source_word: תְפִלָּתִי
  choice: mein Gebet
  rationale: תְּפִלָּה bezeichnet gewöhnlich ein Gebet; die possessive Form wird direkt wiedergegeben.
- source_word: וְשַׁוְעָתִי
  choice: und meinen Hilferuf
  rationale: שַׁוְעָה meint einen dringlichen Ruf, typischerweise um Hilfe. „Hilferuf“ macht diese im hebräischen Wort enthaltene Bedeutung im Deutschen natürlich deutlich.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Die Präposition אֶל bezeichnet hier die Richtung und verbindet sich natürlich mit „kommen“.
- source_word: תָבוֹא
  choice: lass … kommen
  rationale: Das feminine Qal-Imperfekt stimmt mit שַׁוְעָה überein und hat im Gebetskontext jussivischen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen, während die Fußnote die traditionelle deutsche Wiedergabe und die Unsicherheit der historischen Aussprache nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und der parallele Gebetsstil des hebräischen Verses bleiben erhalten; das abschließende Ausrufezeichen unterstreicht die eindringliche Bitte, ohne zusätzliche Aussage einzutragen.
