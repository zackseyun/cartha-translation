  source_fidelity: 'Die Übersetzung gibt die hebräische Struktur und den Sinn zuverlässig wieder: die direkte Anrede an JHWH, den Imperativ „höre“, „mein Gebet“ sowie die jussivische Bitte, dass der Hilferuf zu Gott komme. „Hilferuf“ entfaltet die im hebräischen שַׁוְעָה regelmäßig mitschwingende Not- bzw. Hilfedimension, ohne den Sinn einzuengen.'
