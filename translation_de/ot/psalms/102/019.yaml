base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/019.yaml
  text: For he looked down from his holy height; the LORD gazed from heaven to earth,
translation:
  language: de
  text: Denn er blickte herab von seiner heiligen Höhe; der HERR schaute vom Himmel auf die Erde,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁקִיף
  choice: blickte herab
  rationale: Das Hifil-Verb bezeichnet hier das Herabschauen von einem erhöhten Ort und wird im Deutschen natürlich mit „herabblicken“ wiedergegeben.
- source_word: מִמְּרוֹם קָדְשׁוֹ
  choice: von seiner heiligen Höhe
  rationale: Bewahrt die räumliche Bildsprache sowie das Possessivsuffix und vermeidet eine unnötige Festlegung auf „Heiligtum“.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen entspricht dem vorgegebenen Publikationsstil.
- source_word: הִבִּיט
  choice: schaute
  rationale: Gibt das bewusste Hinsehen schlicht wieder; die Variation gegenüber „blickte herab“ spiegelt den hebräischen Verbwechsel, ohne einen stärkeren Bedeutungsunterschied zu behaupten.
- source_word: מִשָּׁמַיִם אֶל אֶרֶץ
  choice: vom Himmel auf die Erde
  rationale: „Auf die Erde“ ist bei einem vom Himmel ausgehenden Blick idiomatisches Deutsch und erhält die Richtungsangabe von אֶל.
theological_decisions:
- issue: Bezug der heiligen Höhe
  choice: seine heilige Höhe
  alternative: sein heiliges Heiligtum
  rationale: מָרוֹם bedeutet primär „Höhe/erhabener Ort“. Die Übersetzung bewahrt das kosmisch-räumliche Bild und identifiziert die Höhe nicht ausdrücklich mit einem bestimmten Heiligtum.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der poetische Parallelismus und der Wechsel der beiden hebräischen Verben für das Schauen bleiben erkennbar; das abschließende Komma signalisiert den syntaktischen Fortgang zum nächsten Vers.
