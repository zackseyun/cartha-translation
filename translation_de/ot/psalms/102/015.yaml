  text: וְ/יִֽירְא֣וּ ג֭וֹיִם אֶת שֵׁ֣ם יְהוָ֑ה וְֽ/כָל מַלְכֵ֥י הָ֝/אָ֗רֶץ אֶת כְּבוֹדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/015.yaml
  text: Then the nations will fear the name of Yahweh[b][a], and all the kings of the earth your glory.
translation:
  language: de
  text: Dann werden die Völker den Namen Jahwes fürchten[a], und alle Könige der Erde werden deine Herrlichkeit fürchten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und die Völker werden den Namen Jahwes fürchten“; das hebräische Bindewort kann schlicht „und“ bedeuten. „Dann“ macht die im Zusammenhang naheliegende Folge deutlich. „Fürchten“ kann hier auch ehrfürchtige Scheu bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִירְאוּ
  choice: Dann werden ... fürchten
  rationale: Das Qal Imperfekt 3. Person Plural von ירא bezeichnet Furcht beziehungsweise ehrfürchtige Scheu. Das einleitende וְ wird im Zusammenhang folgernd als „Dann“ wiedergegeben; ein schlichtes „Und“ bleibt möglich.
- source_word: גּוֹיִם
  choice: die Völker
  rationale: גוים bezeichnet hier allgemein die Nationen beziehungsweise Völker; „Heiden“ würde einen späteren religiösen Gegensatz stärker eintragen, als der hebräische Text verlangt.
- source_word: אֶת שֵׁם יְהוָה
  choice: den Namen Jahwes
  rationale: Die Konstruktverbindung wird direkt wiedergegeben. „Name“ bewahrt die im Hebräischen mitschwingende Bedeutung von offenbarter Identität und Ansehen, ohne sie auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: וְכָל מַלְכֵי הָאָרֶץ
  choice: und alle Könige der Erde
  rationale: כָל mit einem pluralischen Konstrukt bedeutet natürlich „alle“; die räumlich-universale Wendung „der Erde“ bleibt erhalten.
- source_word: אֶת כְּבוֹדֶךָ
  choice: deine Herrlichkeit
  rationale: כבוד kann Herrlichkeit, Ehre oder Pracht bezeichnen. „Herrlichkeit“ entspricht dem poetisch-theologischen Register; das Suffix der 2. Person Singular wahrt die direkte Anrede Gottes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen ausdrücklich. „Jahwe“ bewahrt diesen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
- issue: Bedeutung von ירא gegenüber Gott
  choice: fürchten
  alternative: Ehrfurcht haben vor
  rationale: „Fürchten“ erhält die Spannweite des hebräischen Verbs zwischen Furcht und ehrfürchtiger Scheu. Eine ausschließliche Wiedergabe als „verehren“ oder „Ehrfurcht haben“ würde die stärkere Bedeutungsseite vorschnell ausschließen.
translation_notes:
  register: 'Moderne, würdige Standardsprache mit psalmtypischem Parallelismus. Die Ellipse des zweiten Satzteils wird wie im Hebräischen bewahrt: Das Verb „fürchten“ ist sinngemäß auch bei „deine Herrlichkeit“ mitzulesen.'
