  source_fidelity: Der Entwurf gibt die kausale Partikel, die Gottesbezeichnung durch das Suffix an „Diener“, die beiden Objekte sowie die Zuwendung zu Zions Staub grundsätzlich zutreffend wieder. „Erbarmen sich über“ ist jedoch im modernen Standarddeutschen nicht idiomatisch; zudem bleibt „ihren“ ohne ausdrücklich genannten Bezug leicht auf die Diener statt auf Zion beziehbar. Die Revision macht den Bezug auf Zion klar und bewahrt zugleich die feminine Personifikation im zweiten Glied.
  naturalness: „Sich über etwas erbarmen“ ist keine übliche standardsprachliche Rektion; idiomatisch ist „sich jemandes/etwas erbarmen“ oder „Erbarmen mit jemandem/etwas haben“. „Zions Steine“ ist knapp, poetisch und eindeutig; „haben Erbarmen mit ihrem Staub“ ist natürlich und knüpft das feminine Pronomen klar an Zion an.
  terminology: „Diener“ ist in diesem psalmischen Gottesbezug angemessen. „Zion“ konkretisiert nur den im unmittelbaren Kontext vorausgesetzten femininen Bezug der Suffixe, ohne den Sinn zu verändern. „Lieben“ gibt die hier emotional geprägte positive Haltung von רָצוּ idiomatisch wieder; „Erbarmen“ gibt die gnädig-mitleidige Zuwendung von חנן in diesem Bildkontext wieder.
