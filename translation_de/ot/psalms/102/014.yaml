  text: For your servants delight in her stones and show favor to her dust[a].
translation:
  language: de
  text: Denn deine Diener lieben Zions Steine und haben Erbarmen mit ihrem Staub.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn deine Diener haben Gefallen an Zions Steinen und sind ihrem Staub gnädig zugewandt.“'
    reason: Lexikalische Alternativen für רָצוּ („haben Gefallen an“) und יְחֹנֵנוּ („gnädig zugewandt sein“).
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Hoffnung beziehungsweise Bitte ein und wahrt den poetischen Zusammenhang.
- source_word: רָצוּ
  choice: haben Gefallen an
  rationale: Das Qal Perfekt bezeichnet hier wohlwollendes Gefallen oder liebevolle Verbundenheit; die Formulierung klingt im Deutschen natürlich und passt zu Zions Steinen.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: Im Gebet zu Gott ist „Diener“ die angemessene, natürliche Wiedergabe, ohne den möglichen sozialen Aspekt von „Sklaven“ unnötig hervorzuheben.
- source_word: אֶת אֲבָנֶיהָ
  choice: an ihren Steinen
  rationale: Das feminine Suffix verweist auf das personifizierte Zion; „ihren“ bewahrt diese dichterische Personifikation.
- source_word: וְאֶת עֲפָרָהּ
  choice: über ihren Staub
  rationale: „Staub“ erhält das konkrete Bild des hebräischen עָפָר, das im Zusammenhang zugleich den Staub beziehungsweise Schutt der zerstörten Stadt bezeichnet.
- source_word: יְחֹנֵנוּ
  choice: erbarmen sich über
  rationale: חנן kann gnädige Zuwendung, Mitleid oder Erbarmen ausdrücken. Die Wahl gibt die emotionale Hinwendung zu Zions Staub idiomatisch wieder, ohne die Bedeutung zu verengen.
theological_decisions:
- issue: Personifikation Zions beziehungsweise Jerusalems durch feminine Suffixe
  choice: Mit „ihren“ wiedergegeben
  alternative: Unpersönlich mit „dessen“ beziehungsweise „seinen“ wiedergeben
  rationale: Die feminine Referenz des Hebräischen wird im Deutschen durch die personifizierende Rückbeziehung auf Zion bewahrt; dadurch bleibt die poetische und bundestheologische Spannung des Psalms erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Syntax bleibt knapp und poetisch; „Staub“ bewahrt das konkrete Ruinenbild, und die feminine Personifikation Zions wird nicht eingeebnet.
