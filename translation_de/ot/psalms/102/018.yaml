id: PSA.102.18
reference: Psalms 102:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תִּכָּ֣תֶב זֹ֭את לְ/ד֣וֹר אַחֲר֑וֹן וְ/עַ֥ם נִ֝בְרָ֗א יְהַלֶּל יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/018.yaml
  text: This will be written for a generation to come[a], and a people yet to be created will praise Yah.
translation:
  language: de
  text: Dies soll für eine kommende Generation aufgeschrieben werden, und ein Volk, das noch geschaffen wird, wird Jah[a] loben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Jah“, die kurze poetische Form des Gottesnamens; viele Übersetzungen geben sie glättend mit „der HERR“ wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכָּתֶב
  choice: soll aufgeschrieben werden
  rationale: Das Nifal-Imperfekt von כתב bezeichnet hier ein passives, auf die Zukunft gerichtetes Geschehen. „Soll aufgeschrieben werden“ gibt zugleich den zukunftsbezogenen und zweckhaften Klang natürlich wieder.
- source_word: זֹאת
  choice: Dies
  rationale: Das Demonstrativpronomen verweist auf das zuvor Gesagte beziehungsweise das Zeugnis des Psalms, ohne dass ein deutendes Substantiv ergänzt werden muss.
- source_word: לְדוֹר אַחֲרוֹן
  choice: für eine kommende Generation
  rationale: דור bedeutet „Generation“; אחרון ist hier im zeitlichen Sinn als später beziehungsweise künftig zu verstehen, nicht zwingend eschatologisch als „letzte“.
- source_word: וְעַם
  choice: und ein Volk
  rationale: עם bezeichnet hier ein „Volk“. Da der Artikel fehlt und das Volk als künftig beschrieben wird, ist die unbestimmte Wiedergabe angemessen.
- source_word: נִבְרָא
  choice: das noch geschaffen wird
  rationale: Das passive Partizip von ברא steht parallel zur kommenden Generation und beschreibt ein Volk, das gegenwärtig noch nicht besteht. Die Relativkonstruktion ist im Deutschen natürlich und bewahrt den prospektiven Sinn.
- source_word: יְהַלֶּל
  choice: wird loben
  rationale: Das Piel-Imperfekt von הלל bezeichnet „loben/preisen“ und wird im Zusammenhang der zukunftsgerichteten Aussagen als Futur wiedergegeben.
- source_word: יָהּ
  choice: Jah
  rationale: יָהּ ist die poetische Kurzform des Gottesnamens. „Jah“ bewahrt diese eigenständige hebräische Form, statt sie mit dem vollen Namen יהוה gleichzusetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יָהּ
  choice: Jah
  alternative: der HERR
  rationale: Der hebräische Text bietet die Kurzform יָהּ und nicht den vollständigen Gottesnamen יהוה. Die Transliteration „Jah“ erhält diese echte lexikalische und poetische Unterscheidung; „der HERR“ wäre eine vertraute, aber glättende Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Aufgeschrieben“ klingt hier natürlicher als das allgemeinere „geschrieben“ und macht die Bewahrung für spätere Leser deutlich, ohne ein zusätzliches Objekt einzuführen.
