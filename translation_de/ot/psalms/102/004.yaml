  text: My heart is struck like grass and withered[c][b][a], for I forget to eat my bread.
translation:
  language: de
  text: Mein Herz ist geschlagen und verdorrt wie Gras; denn ich vergesse, mein Brot[a] zu essen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Mein Brot“ kann hier auch allgemeiner „meine Nahrung“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn ich habe vergessen, mein Brot zu essen“. Das hebräische Perfekt kann einen gegenwärtig anhaltenden Zustand oder eine abgeschlossene Handlung mit fortdauernder Wirkung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּכָּה
  choice: ist geschlagen
  rationale: Das passive Verb נכה bezeichnet ein Geschlagen- oder Getroffenwerden. „Ist geschlagen“ bewahrt Passiv und Bild, ohne eine nicht ausdrücklich genannte Ursache einzuführen.
- source_word: כָעֵשֶׂב
  choice: wie Gras
  rationale: עֵשֶׂב bezeichnet Gras oder krautige Vegetation. „Wie Gras“ ist verständlich und erhält das poetische Bild von Hinfälligkeit und Verdorren.
- source_word: וַיִּבַשׁ
  choice: und verdorrt
  rationale: יבש bedeutet trocken werden oder verdorren. „Verdorrt“ greift das Grasbild natürlich auf und bezeichnet den Verlust der Lebenskraft.
- source_word: לִבִּי
  choice: mein Herz
  rationale: לֵב bezeichnet hier das innere Selbst. „Mein Herz“ erhält die konkrete poetische Ausdrucksweise des Hebräischen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für den geschilderten Zustand ein. „Denn“ ist in gehobener, aber gegenwärtiger deutscher Dichtung natürlich.
- source_word: שָׁכַחְתִּי
  choice: ich vergesse
  rationale: Das hebräische Perfekt kann in diesem Klagekontext einen anhaltenden Zustand beziehungsweise wiederkehrende Vernachlässigung beschreiben. Das Präsens gibt dies im Deutschen idiomatisch wieder; die resultative Lesart steht in der Fußnote.
- source_word: מֵאֲכֹל
  choice: zu essen
  rationale: Die Verbindung bedeutet wörtlich „vom Essen“, wird nach „vergessen“ im Deutschen jedoch idiomatisch mit einem Infinitiv mit „zu“ wiedergegeben.
- source_word: לַחְמִי
  choice: mein Brot
  rationale: לֶחֶם bedeutet konkret „Brot“ und kann weiter gefasst „Nahrung“ heißen. Der Haupttext bewahrt das konkrete Bild; die allgemeinere Bedeutung wird vermerkt.
