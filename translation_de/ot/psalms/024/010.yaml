  text: מִ֤י ה֣וּא זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְהוָ֥ה צְבָא֑וֹת ה֤וּא מֶ֖לֶךְ הַ/כָּב֣וֹד סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/010.yaml
  text: Who is this King of glory? Yahweh of hosts—he is the King of glory[b][a]. Selah
translation:
  language: de
  text: Wer ist dieser König der Herrlichkeit? Jahwe der Heerscharen[a] – er ist der König der Herrlichkeit. Sela[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe der Heere“. Der hebräische Titel kann sich allgemein auf himmlische Heere oder geordnete Mächte beziehen.'
    reason: lexical_alternative
  - marker: b
    text: „Sela“ ist vermutlich eine musikalische oder liturgische Angabe; die genaue Bedeutung ist unsicher.
    reason: cultural_note
lexical_decisions:
- source_word: מִי הוּא זֶה
  choice: Wer ist dieser
  rationale: Die Frageform mit Pronomen und Demonstrativum ist im Hebräischen nachdrücklich. „Wer ist dieser …?“ gibt die rhetorische Kraft in natürlichem Deutsch wieder.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: König der Herrlichkeit
  rationale: Die Genitivverbindung wird formal bewahrt; „Herrlichkeit“ gibt hier כָּבוֹד mit seinem Bedeutungsfeld von Ehre, Gewicht und majestätischem Glanz angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: „Heerscharen“ bewahrt die Breite des hebräischen Plurals und legt nicht ausschließlich menschliche Armeen als Bezug fest.
- source_word: הוּא
  choice: er ist
  rationale: Das ausdrücklich gesetzte Pronomen wird wiedergegeben und betont die Identifikation, ohne die nicht ausdrücklich markierte Ausschließlichkeit „er allein“ hinzuzufügen.
- source_word: סֶלָה
  choice: Sela
  rationale: Da die genaue Bedeutung unsicher ist, bleibt der Ausdruck als Transliteration stehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen; seine Wiedergabe als „Jahwe“ wahrt den Unterschied zwischen Name und Titel.
- issue: Wiedergabe des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: Jahwe der Heere
  rationale: „Heerscharen“ lässt offen, ob himmlische Heere oder umfassender geordnete Mächte gemeint sind, und bewahrt damit die Breite des Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung „König der Herrlichkeit“ und das ausdrücklich gesetzte „er“ bewahren die rhetorische Feierlichkeit und den Parallelismus des Hebräischen.
