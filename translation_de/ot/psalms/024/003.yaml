source:
  edition: WLC
  text: מִֽי יַעֲלֶ֥ה בְ/הַר יְהוָ֑ה וּ/מִי יָ֝קוּם בִּ/מְק֥וֹם קָדְשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/003.yaml
  text: Who may ascend the mountain of Yahweh? And who may stand in his holy place?[a]
translation:
  language: de
  text: Wer darf auf den Berg Jahwes hinaufsteigen?[a] Und wer darf an seiner heiligen Stätte stehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den Hügel Jahwes“. Das hebräische Wort הַר kann „Berg“ oder „Hügel“ bedeuten; hier steht die üblichere Wiedergabe „Berg“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Wer
  rationale: Das Fragepronomen leitet eine rhetorische Frage nach der Person ein, die zum Zutritt geeignet ist; „Wer“ ist die natürliche und knappe deutsche Entsprechung.
- source_word: יַעֲלֶה
  choice: darf … hinaufsteigen
  rationale: Das Qal-Imperfekt von עלה bezeichnet das Hinaufgehen. Im kultisch-weisheitlichen Zusammenhang drückt „darf“ die Frage nach der Berechtigung beziehungsweise Eignung aus, während „hinaufsteigen“ die räumliche Bewegung bewahrt.
- source_word: בְהַר
  choice: auf den Berg
  rationale: הַר kann „Berg“ oder „Hügel“ bedeuten. „Berg“ ist hier die übliche, dem Zion-Kontext angemessene Wiedergabe; die Präposition wird wegen der gerichteten Bewegung idiomatisch mit „auf“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. Der Genitiv „Jahwes“ bildet die hebräische Verbindung „Berg Jahwes“ natürlich nach, ohne den Namen durch einen Titel zu ersetzen.
- source_word: וּמִי
  choice: Und wer
  rationale: Die Konjunktion mit dem Fragepronomen wird direkt wiedergegeben und erhält den poetischen Parallelismus der beiden Vershälften.
- source_word: יָקוּם
  choice: darf … stehen
  rationale: Das Qal-Imperfekt von קום kann „sich erheben“ oder „stehen“ bedeuten. Hier bezeichnet „stehen“ das Einnehmen beziehungsweise Behalten eines Platzes in Gottes heiliger Gegenwart; „darf“ bewahrt die Frage nach der Zugangsberechtigung.
- source_word: בִּמְקוֹם
  choice: an … Stätte
  rationale: מָקוֹם bedeutet allgemein „Ort, Platz, Stätte“. „Stätte“ ist im gehobenen poetisch-kultischen Zusammenhang natürlich, ohne den Ausdruck vorschnell mit „Heiligtum“ gleichzusetzen; „an“ gibt den Standort idiomatisch wieder.
- source_word: קָדְשׁוֹ
  choice: seiner heiligen
  rationale: Das Wort bezeichnet hier in Verbindung mit מָקוֹם den zu Jahwe gehörenden heiligen Ort. „Seiner heiligen Stätte“ erhält sowohl die Heiligkeit als auch das Possessivsuffix.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Modaler Sinn der Imperfektformen in den rhetorischen Fragen
  choice: darf … hinaufsteigen / darf … stehen
  alternative: wird … hinaufsteigen / kann … hinaufsteigen; wird … stehen / kann … stehen
  rationale: Der Zusammenhang fragt nach der Eignung oder Berechtigung, sich Gott zu nähern und vor ihm zu stehen, nicht nur nach zukünftiger Handlung oder bloßer Fähigkeit. „Darf“ lässt den moralisch-kultischen Charakter der Frage erkennen, ohne ihn weiter dogmatisch festzulegen.
- issue: Bedeutung von קום in der zweiten Vershälfte
  choice: stehen
  alternative: sich erheben / bestehen
  rationale: Im Parallelismus zum Hinaufsteigen und im Zusammenhang des Zugangs zur heiligen Stätte bezeichnet das Verb am ehesten das Stehen in Gottes Gegenwart. „Bestehen“ würde stärker eine Prüfung oder ein Gericht eintragen, als der Vers ausdrücklich sagt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem poetischem Ton. Der Parallelismus der beiden Fragen bleibt erhalten. „Stätte“ wahrt den sakralen Kontext, ohne מָקוֹם enger als nötig als „Heiligtum“ festzulegen.
