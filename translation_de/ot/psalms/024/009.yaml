  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וּ֭/שְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָבֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/009.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: de
  text: Hebt eure Häupter, ihr Tore, und erhebt euch, ihr uralten Pforten,[a] damit der König der Herrlichkeit einzieht!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ewige Pforten“. Der hebräische Ausdruck kann Pforten von hohem Alter oder von dauerhafter, ja ewiger Dauer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: Hebt
  rationale: Der pluralische Imperativ von נשׂא wird direkt wiedergegeben und bewahrt den bildhaften Aufruf.
- source_word: שְׁעָרִים
  choice: Tore
  rationale: Die übliche deutsche Bezeichnung für Stadt- oder Tempeltore; sie passt zur poetischen Anrede.
- source_word: רָאשֵׁיכֶם
  choice: eure Häupter
  rationale: Die wörtliche Metapher „eure Köpfe/Häupter“ bleibt erhalten. „Häupter“ klingt in diesem feierlichen poetischen Zusammenhang würdig und ist auf Tore bezogen verständlich.
- source_word: וּשְׂאוּ
  choice: und erhebt euch
  rationale: Die Wiederholung des Imperativs wird bewahrt; die reflexive Form gibt die personifizierende Aufforderung im Deutschen natürlich wieder.
- source_word: פִּתְחֵי עוֹלָם
  choice: uralten Pforten
  rationale: עוֹלָם kann hier ein sehr hohes Alter oder unbegrenzte Dauer bezeichnen. „Uralten Pforten“ ist idiomatisch und wahrt die ehrwürdige, poetische Bildsprache; die mögliche Alternative wird in der Fußnote genannt.
- source_word: וְיָבֹא
  choice: damit ... einzieht
  rationale: Nach den Imperativen lässt sich die Verbform als Zweck oder Folge verstehen. „Einzieht“ bezeichnet passend das feierliche Eintreten eines Königs durch Tore.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: der König der Herrlichkeit
  rationale: Die hebräische Genitivverbindung wird formal bewahrt und als erhabener Titel wiedergegeben.
theological_decisions:
- issue: Personifizierung der Tore und das Bild ihrer „Häupter“
  choice: 'Die Metapher bleibt im Haupttext erhalten: „Hebt eure Häupter, ihr Tore“'
  alternative: 'Architektonisch glättend: „Öffnet euch weit, ihr Tore“'
  rationale: Der hebräische Text spricht die Tore ausdrücklich als Personen an und nennt ihre „Häupter“. Eine Paraphrase würde ein wichtiges poetisches Merkmal beseitigen.
- issue: Bedeutung von עוֹלָם in פִּתְחֵי עוֹלָם
  choice: „uralten Pforten“ im Haupttext
  alternative: „ewigen Pforten“
  rationale: Das Wort kann sowohl fernes Alter als auch fortdauernde beziehungsweise unbegrenzte Zeit ausdrücken. Der Haupttext verwendet eine im baulichen Zusammenhang natürliche Lesart, während die echte Bedeutungsalternative in der Fußnote erhalten bleibt.
- issue: Beziehung von וְיָבֹא zu den vorausgehenden Imperativen
  choice: 'Zweck-/Folgesatz: „damit ... einzieht“'
  alternative: 'Beiordnung: „und ... wird einziehen“'
  rationale: Der Kontext legt nahe, dass die Tore sich erheben sollen, um den Einzug des Königs zu ermöglichen; die grammatische Spannung wird nicht dogmatisch zugespitzt.
translation_notes:
  register: Feierliche, moderne Standardsprache mit bewahrter hebräischer Personifizierung. „Häupter“, „Pforten“ und „Herrlichkeit“ tragen dem gehobenen Psalmstil Rechnung, ohne altertümliche Satzformen zu verwenden.
