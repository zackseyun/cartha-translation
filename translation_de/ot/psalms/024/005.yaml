source:
  edition: WLC
  text: יִשָּׂ֣א בְ֭רָכָה מֵ/אֵ֣ת יְהוָ֑ה וּ֝/צְדָקָ֗ה מֵ/אֱלֹהֵ֥י יִשְׁעֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/005.yaml
  text: He will receive blessing from Yahweh[a], and righteousness from the God of his salvation.
translation:
  language: de
  text: Er wird Segen von Jahwe empfangen und Gerechtigkeit[a] von dem Gott seiner Rettung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Recht“. Das hebräische Wort kann neben moralischer Gerechtigkeit auch Gottes gerechtes, rettendes Handeln oder eine günstige gerichtliche Entscheidung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: wird … empfangen
  rationale: נָשָׂא bedeutet häufig „heben, tragen“, hat aber mit dem abstrakten Objekt „Segen“ idiomatisch den Sinn „empfangen“. Diese Wiedergabe ist im Deutschen natürlich und sachlich genau.
- source_word: בְּרָכָה
  choice: Segen
  rationale: Die Einzahl entspricht dem Hebräischen und bezeichnet die von Gott gewährte Gunst.
- source_word: מֵאֵת יְהוָה
  choice: von Jahwe
  rationale: Die Präposition bezeichnet die Herkunft; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וּצְדָקָה
  choice: und Gerechtigkeit[a]
  rationale: צְדָקָה umfasst Gerechtigkeit, Rechtfertigung beziehungsweise vindizierende Anerkennung und rettendes Recht. „Gerechtigkeit“ wahrt im Haupttext die größtmögliche Bedeutungsbreite; die kontextuell möglichen Nuancen stehen in der Fußnote.
- source_word: מֵאֱלֹהֵי יִשְׁעוֹ
  choice: von dem Gott seiner Rettung
  rationale: Die konstruktartige Verbindung wird eng am Hebräischen wiedergegeben und lässt offen, ob Gott vor allem als Ursprung der Rettung oder als der rettende Gott bezeichnet wird.
- source_word: יִשְׁעוֹ
  choice: seiner Rettung
  rationale: יֵשַׁע kann Rettung, Befreiung oder Heil bezeichnen. „Rettung“ ist heute unmittelbar verständlich und bewahrt den konkreten wie theologischen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen direkt. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von צְדָקָה in diesem Zusammenhang
  choice: Gerechtigkeit
  alternative: Rechtfertigung; Recht
  rationale: Der Vers sagt, was der zum Heiligtum Zugelassene von Gott empfängt. „Gerechtigkeit“ erhält die moralische, gemeinschaftsbezogene und gerichtliche Spannweite, ohne sie vorschnell auf einen einzigen Aspekt festzulegen; die Fußnote nennt weitere mögliche Nuancen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Parallelismus; „der Gott seiner Rettung“ bewahrt bewusst die kompakte und mehrdeutige Genitivverbindung des Ausgangstextes.
