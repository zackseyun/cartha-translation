  text: כִּי ה֭וּא עַל יַמִּ֣ים יְסָדָ֑/הּ וְ/עַל נְ֝הָר֗וֹת יְכוֹנְנֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/002.yaml
  text: For he founded it upon the seas[a], and established it upon the rivers.
translation:
  language: de
  text: Denn er hat sie auf den Meeren gegründet und sie auf den Strömen befestigt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die Aussage des vorhergehenden Verses ein und entspricht dem poetischen Zusammenhang natürlich.
- source_word: הוּא
  choice: er
  rationale: Das ausdrücklich gesetzte Pronomen hebt den göttlichen Urheber hervor; im Deutschen trägt „er“ diese Hervorhebung durch seine Stellung ausreichend.
- source_word: עַל יַמִּים
  choice: auf Meeren
  rationale: Bewahrt den Plural „Meere“ und die poetisch-kosmologische Vorstellung einer Gründung auf den Wassern, ohne sie modernisierend umzudeuten.
- source_word: יְסָדָהּ
  choice: hat sie … gegründet
  rationale: Gibt יסד direkt wieder; das feminine Pronomen bezieht sich auf „die Erde“ aus Vers 1.
- source_word: וְעַל נְהָרוֹת
  choice: und … über Strömen
  rationale: „Ströme“ ist eine natürliche poetische Wiedergabe von נְהָרוֹת; „über“ macht im Deutschen die räumliche Vorstellung idiomatisch deutlich und variiert nicht die zugrunde liegende Konstruktion unnötig.
- source_word: יְכוֹנְנֶהָ
  choice: sie … fest errichtet
  rationale: Bewahrt gegenüber יסד die Nuance des Festmachens und dauerhaften Aufrichtens.
theological_decisions:
- issue: Kosmologische Bildsprache von Erde, Meeren und Strömen
  choice: Die poetisch-kosmologische Sprache wird unmittelbar beibehalten.
  alternative: Die Aussage als rein bildhafte Stabilitätssprache oder in moderner naturwissenschaftlicher Sprache wiederzugeben.
  rationale: Der hebräische Text beschreibt Gottes ordnendes Schöpfungshandeln durch traditionelle poetische Wasserbilder. Diese Spannung soll weder weggeglättet noch wissenschaftlich umformuliert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelität. „Denn“ verbindet den Vers mit seiner Begründungsfunktion; „gegründet“ und „fest errichtet“ erhalten die unterschiedlichen Verben des Hebräischen.
