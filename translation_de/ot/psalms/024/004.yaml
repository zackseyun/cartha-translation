  source_fidelity: Die Hauptfassung glättet die im WLC-Text stehende Suffixform נַפְשִׁי („meine Seele“) zu „sein Innerstes“. Diese kontextuell verbreitete Lesart ist zwar in der Fußnote dokumentiert, darf aber bei einer am vorliegenden hebräischen Text orientierten Übersetzung nicht ohne Kennzeichnung im Haupttext stehen. Zudem gibt „reine Hände“ נְקִי כַּפַּיִם unmittelbarer wieder als „unschuldige Hände“.
  naturalness: Die vorgeschlagene Fassung bleibt modernes, würdevolles Deutsch. Die Formulierung „meine Seele ... zu Falschem erhebt“ ist bewusst etwas spannungsvoll, weil sie die auffällige erste Person des überlieferten Textes erhält; die Fußnote bietet die im Kontext glattere Lesart. „Betrügerisch schwört“ ist idiomatischer und weniger interpretativ als „in betrügerischer Absicht schwört“.
  terminology: „Reine Hände“ und „reines Herz“ bewahren die parallele hebräische Bildsprache. „Falsches“ bleibt als Wiedergabe von לַשָּׁוְא möglich; die lexikalischen Alternativen einschließlich einer möglichen Götzenreferenz werden in der Fußnote belassen. Die Fußnote zum Textproblem muss die Hauptlesart korrekt als „meine Seele“ ausweisen.
