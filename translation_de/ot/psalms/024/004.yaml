source:
  edition: WLC
  text: נְקִ֥י כַפַּ֗יִם וּֽ/בַר לֵ֫בָ֥ב אֲשֶׁ֤ר לֹא נָשָׂ֣א לַ/שָּׁ֣וְא נַפְשִׁ֑/י וְ/לֹ֖א נִשְׁבַּ֣ע לְ/מִרְמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/004.yaml
  text: The one who has clean hands and a pure heart[c][b][a], who has not lifted up his soul to falsehood or sworn deceitfully.
translation:
  language: de
  text: Wer reine Hände und ein reines Herz hat, wer meine Seele nicht zu Falschem erhebt[a][b] und nicht betrügerisch schwört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorliegende hebräische Konsonantentext lautet wörtlich »meine Seele«; dem Zusammenhang entsprechend wird häufig »seine Seele« gelesen.
    reason: textual_variant
  - marker: b
    text: 'Oder: »zu Nichtigem« beziehungsweise »zu Wertlosem«; möglicherweise ist auch ein Götzenbild gemeint. Wörtlich: »meine Seele nicht zu … erhebt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְקִי כַפַּיִם
  choice: unschuldige Hände
  rationale: Die Wendung verbindet das konkrete Bild der Hände mit moralischer Unbescholtenheit im Handeln. »Unschuldige Hände« ist im Deutschen natürlich und bewahrt dieses Bild.
- source_word: בַר לֵבָב
  choice: ein reines Herz
  rationale: Die Formulierung bezeichnet innere Lauterkeit und steht parallel zu den Händen als Bild des äußeren Handelns.
- source_word: נָשָׂא ... נַפְשִׁי
  choice: sein Innerstes ... richtet
  rationale: נפש bezeichnet hier den ganzen inneren Menschen mit seinem Begehren und seiner Ausrichtung. Die kontextuell erwartete dritte Person wird im Haupttext wiedergegeben; die im vorliegenden Konsonantentext stehende erste Person wird in einer Fußnote offengelegt.
- source_word: לַשָּׁוְא
  choice: auf Falsches
  rationale: שׁוא kann Falschheit, Nichtigkeit oder Wertloses bezeichnen. »Falsches« passt zum ethischen Zusammenhang und lässt die genauere Nuance offen; weitere Möglichkeiten werden in der Fußnote genannt.
- source_word: נִשְׁבַּע לְמִרְמָה
  choice: in betrügerischer Absicht schwört
  rationale: Die Wiedergabe erfasst sowohl die betrügerische Art als auch den möglichen Täuschungszweck des Schwörens und klingt im modernen Deutschen natürlich.
theological_decisions:
- issue: 'Suffix in נַפְשִׁי: »meine Seele« gegenüber der kontextuell erwarteten Lesart »seine Seele«'
  choice: Im Haupttext steht sinngemäß »sein Innerstes«; die Form des überlieferten Konsonantentextes wird in Fußnote [a] dokumentiert.
  alternative: »mein Innerstes« beziehungsweise wörtlich »meine Seele«
  rationale: Die gesamte Beschreibung steht in der dritten Person, weshalb »sein« syntaktisch und kontextuell naheliegt. Da der vorgelegte WLC-Text jedoch נַפְשִׁי, »meine Seele«, bietet, darf diese Spannung nicht stillschweigend verschwinden und wird ausdrücklich vermerkt.
- issue: Bedeutung von שׁוא
  choice: Falsches
  alternative: Nichtiges, Wertloses oder ein Götzenbild
  rationale: Der Zusammenhang mit betrügerischem Schwören stützt die ethische Bedeutung »Falsches«, ohne die semantische Breite des Wortes auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige Bildsprache »unschuldige Hände« und »reines Herz« bleibt erhalten; der schwer verständliche hebräische Ausdruck »die Seele erheben« wird behutsam als innere Ausrichtung wiedergegeben. Die Versform bleibt als Antwortsatz ohne ergänztes Prädikat bestehen.
