    issue: Die Hauptübersetzung ersetzt „meine Seele“ durch „sein Innerstes“.
    rationale: Der WLC-Text hat נַפְשִׁי mit Suffix der ersten Person. Die dritte Person ist eine gewichtige, kontextuell motivierte Alternativlesart, soll aber gemäß Quelltextprimat als Alternative und nicht unmarkiert als Haupttext erscheinen.
  - severity: medium
