reference: Psalms 24:0
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר לַֽ֭/יהוָה הָ/אָ֣רֶץ וּ/מְלוֹאָ֑/הּ תֵּ֝בֵ֗ל וְ/יֹ֣שְׁבֵי בָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/000.yaml
  text: A psalm of David[a]. Yahweh's is the earth and its fullness[b], the world and those who dwell in it.
translation:
  language: de
  text: 'Ein Psalm Davids.[a]


    Jahwe gehören die Erde und alles, was sie erfüllt,[b] die Welt und alle, die darin wohnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Psalm von David“ beziehungsweise „für David“. Die hebräische Form bezeichnet eine Beziehung zu David, legt deren genaue Art aber nicht ausdrücklich fest.'
    reason: source_ambiguity
  - marker: b
    text: 'Wörtlicher: „und ihre Fülle“. Gemeint ist alles, was die Erde enthält.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד מִזְמוֹר
  choice: Ein Psalm Davids
  rationale: Die knappe Überschrift wird in natürlichem Deutsch wiedergegeben. Der Genitiv bezeichnet die Beziehung des Psalms zu David, ohne im Haupttext stärker festzulegen, ob Urheberschaft, Zuordnung oder Widmung gemeint ist.
- source_word: לַיהוָה
  choice: Jahwe gehören
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; die vorangestellte Zugehörigkeitsangabe wird mit dem deutschen Verb „gehören“ natürlich ausgedrückt.
- source_word: הָאָרֶץ וּמְלוֹאָהּ
  choice: die Erde und alles, was sie erfüllt
  rationale: מְלוֹאָהּ bezeichnet die Fülle beziehungsweise den gesamten Inhalt der Erde. Die Umschreibung ist im heutigen Deutsch verständlicher als das wörtliche „ihre Fülle“.
- source_word: תֵּבֵל
  choice: die Welt
  rationale: תֵּבֵל bezeichnet hier die bewohnte Welt; „die Welt“ ist die natürliche moderne Entsprechung und passt zum folgenden Hinweis auf ihre Bewohner.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: und alle, die darin wohnen
  rationale: Die substantivierte Partizipialform wird inklusiv und idiomatisch als Relativsatz wiedergegeben.
theological_decisions:
- issue: Bedeutung der Präposition לְ in der Überschrift לְדָוִד
  choice: Psalm Davids
  alternative: Psalm von David / für David
  rationale: Die hebräische Form kann Urheberschaft, Zugehörigkeit oder Widmung anzeigen. Der deutsche Genitiv bewahrt diese Beziehung knapper und relativ offen; eine Fußnote nennt die möglichen expliziteren Wiedergaben.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Verwendung des Eigennamens folgt unmittelbar dem hebräischen Text und vermeidet, den Namen stillschweigend durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Parallelität von „Erde“ und „Welt“ bleibt erhalten; „alles, was sie erfüllt“ und „alle, die darin wohnen“ sind zugleich allgemein verständlich.
