id: PSA.24.1
reference: Psalms 24:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר לַֽ֭/יהוָה הָ/אָ֣רֶץ וּ/מְלוֹאָ֑/הּ תֵּ֝בֵ֗ל וְ/יֹ֣שְׁבֵי בָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/001.yaml
  text: A psalm of David[a]. The earth and its fullness are Yahweh’s[b], the world and those who dwell in it.
translation:
  language: de
  text: 'Ein Psalm Davids.[a]


    Jahwe gehört die Erde und alles, was sie erfüllt,[b]

    die Welt und alle, die auf ihr wohnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische kann auch „von David“, „für David“ oder „David zugeordnet“ bedeuten.
    reason: lexical_ambiguity
  - marker: b
    text: 'Wörtlicher: „und ihre Fülle“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Davids
  rationale: Der Genitiv in „Ein Psalm Davids“ lässt wie das hebräische לְ eine gewisse Offenheit zwischen Urheberschaft, Zugehörigkeit und Zuordnung bestehen; die wichtigsten Möglichkeiten werden in der Fußnote genannt.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: „Psalm“ ist die geläufige und sachlich passende deutsche Bezeichnung für diese Gattung beziehungsweise Überschrift.
- source_word: לַיהוָה
  choice: Jahwe gehört
  rationale: Die hebräische verblos formulierte Besitzangabe wird im Deutschen natürlich mit „gehört“ wiedergegeben. Der Gottesname יהוה erscheint als „Jahwe“.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Der Parallelismus mit תֵּבֵל und der umfassende Aussagehorizont sprechen hier für „Erde“ statt „Land“.
- source_word: וּמְלוֹאָהּ
  choice: und alles, was sie erfüllt
  rationale: Diese idiomatische Wiedergabe vermittelt den Gesamtinhalt der Erde, ohne das im Deutschen ungewöhnlich abstrakte „ihre Fülle“ in den Haupttext zu setzen; die formnähere Fassung steht in der Fußnote.
- source_word: תֵּבֵל
  choice: die Welt
  rationale: „Welt“ gibt die bewohnte, geordnete Welt natürlich wieder; der folgende Halbvers nennt ausdrücklich ihre Bewohner.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: und alle, die auf ihr wohnen
  rationale: Die Formulierung bewahrt die verbale Aussage des hebräischen Partizips und ist zugleich gegenwärtiges, verständliches Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art des in לַיהוָה ausgedrückten Verhältnisses
  choice: 'Besitz beziehungsweise Zugehörigkeit: „Jahwe gehört …“'
  alternative: eine allgemeinere Beziehung oder Widmung
  rationale: Im nominalen Satz bezeichnet לַיהוָה hier angesichts der Erde, ihrer Fülle und ihrer Bewohner am natürlichsten Zugehörigkeit beziehungsweise Herrschaft, ohne weiter auszuführen, wie diese theologisch begründet ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Zeilenführung. Die Überschrift folgt vertrautem deutschem Bibelstil; der Vers vermeidet unnötigen Nominalstil, bewahrt aber Parallelismus und umfassende Aussage.
