source:
  edition: WLC
  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וְֽ֭/הִנָּשְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָב֗וֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/007.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: de
  text: Hebt eure Häupter, ihr Tore, und erhebt euch, ihr uralten Pforten[a], damit der König der Herrlichkeit einzieht!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihr ewigen Pforten«. Der hebräische Ausdruck kann Pforten aus uralter Zeit oder Pforten von bleibender Dauer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: Hebt
  rationale: Der maskuline Pluralimperativ von נשׂא wird direkt und bildkräftig wiedergegeben; zusammen mit »eure Häupter« bewahrt »hebt« die Personifikation.
- source_word: שְׁעָרִים
  choice: Tore
  rationale: »Tore« ist die natürliche deutsche Entsprechung für Stadt- oder Tempeltore und passt zur feierlichen Einzugsszene.
- source_word: רָאשֵׁיכֶם
  choice: eure Häupter
  rationale: Die wörtliche Metapher »eure Häupter« personifiziert die Tore. »Häupter« trägt dem poetisch-feierlichen Register besser Rechnung als das alltägliche »Köpfe«, ohne das Bild architektonisch auszudeuten.
- source_word: וְהִנָּשְׂאוּ
  choice: und richtet euch auf
  rationale: Der Nifal-Imperativ kann passiv oder reflexiv verstanden werden. »Richtet euch auf« gibt die Aufforderung im Deutschen natürlich wieder und erhält den Parallelismus, ohne eine mechanische Bauvorstellung zu erzwingen.
- source_word: פִּתְחֵי עוֹלָם
  choice: ihr uralten Pforten
  rationale: פִּתְחֵי bezeichnet Öffnungen, Türen oder Pforten; parallel zu »Tore« ist »Pforten« poetisch passend. עוֹלָם kann hohes Alter oder immerwährende Dauer bezeichnen. »Uralten« ist im Kontext gut verständlich; die alternative zeitliche Nuance wird in der Fußnote bewahrt.
- source_word: וְיָבֹא
  choice: damit ... einzieht
  rationale: Nach den Imperativen lässt sich וְ mit dem Imperfekt als Zweck oder Folge verstehen. »Damit ... einzieht« gibt die königliche Einzugsszene natürlich wieder.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: der König der Herrlichkeit
  rationale: Die hebräische Genitivverbindung wird als erhabener Titel bewahrt und nicht zum deutenden Adjektiv »herrlicher König« verflacht.
theological_decisions:
- issue: Bewahrung der Personifikation und des königlichen Einzugsbildes ohne interpretative Verengung
  choice: Tore und Pforten werden unmittelbar angesprochen und ihre »Häupter« werden beibehalten.
  alternative: Die Bildsprache dynamisch als bloße Aufforderung wiederzugeben, die Tore zu öffnen.
  rationale: Der hebräische Text spricht die Tore und Pforten direkt an. Die poetische Form lässt historische, liturgische und messianische Bezüge offen, statt einen davon in die Übersetzung einzutragen.
- issue: Bedeutung von עוֹלָם in פִּתְחֵי עוֹלָם
  choice: »uralten Pforten« im Haupttext
  alternative: »ewigen Pforten«
  rationale: עוֹלָם kann sowohl ferne Vorzeit beziehungsweise hohes Alter als auch unbegrenzte Dauer bezeichnen. Die Hauptfassung wählt die im Einzugsbild gut verständliche Altertumsnuance; die echte Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit poetisch-feierlichem Ton. »Häupter«, »Pforten« und »Herrlichkeit« bewahren die gehobene Bildsprache des Psalms; Satzbau und Verbwahl bleiben zugleich natürlich.
