id: PSA.24.8
reference: Psalms 24:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִ֥י זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְ֭הוָה עִזּ֣וּז וְ/גִבּ֑וֹר יְ֝הוָ֗ה גִּבּ֥וֹר מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/008.yaml
  text: Who is this King of glory? Yahweh[a], strong and mighty; Yahweh, mighty in battle.
translation:
  language: de
  text: Wer ist dieser König der Herrlichkeit? Jahwe, stark und mächtig; Jahwe, mächtig im Kampf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: mächtig im Krieg.'
    reason: Lexikalische Alternative für מִלְחָמָה; je nach Kontext kann das Wort „Kampf“ oder „Krieg“ bezeichnen.
lexical_decisions:
- source_word: מִי זֶה
  choice: Wer ist dieser
  rationale: Die Verbindung aus Interrogativpronomen und Demonstrativpronomen bildet eine direkte Frage. Diese Wiedergabe bewahrt die liturgische Frage-Antwort-Struktur.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: König der Herrlichkeit
  rationale: Die hebräische Status-constructus-Verbindung wird substantivisch wiedergegeben. So bleiben der Titelcharakter und der Bezug zum wiederholten Kehrvers erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: עִזּוּז
  choice: stark
  rationale: Das Wort bezeichnet ausgeprägte Stärke oder Macht. „Stark“ unterscheidet es im Deutschen vom unmittelbar folgenden גִבּוֹר.
- source_word: וְגִבּוֹר
  choice: und mächtig
  rationale: גִבּוֹר kann einen Mächtigen oder Krieger bezeichnen. Die adjektivische Wiedergabe bewahrt hier die Parallelität, ohne den Kampfbezug vorwegzunehmen.
- source_word: גִּבּוֹר מִלְחָמָה
  choice: mächtig im Kampf
  rationale: Die Formulierung gibt die Verbindung von Macht und Kampf natürlich wieder, ohne das im Hebräischen nicht ausdrücklich stehende Substantiv „Krieger“ einzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt im modernen Deutschen den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzt und „Jehova“ auf einer späteren Mischlesung beruht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, rhythmischer Frage-Antwort-Struktur. Das Semikolon erhält den Parallelismus der beiden Aussagen. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung.
