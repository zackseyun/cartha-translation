  text: Such is the generation of those who seek him, who seek your face, O Jacob. Selah
translation:
  language: de
  text: Das ist die Generation derer, die ihn suchen, die dein Angesicht suchen, o Jakob.[a] Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht am Schluss nur „Jakob“. Die knappe Syntax ist umstritten: Sie kann als Anrede („o Jakob“) verstanden werden; manche Übersetzungen geben, gestützt auf alte Übersetzungstraditionen oder Auslegung, „Gott Jakobs“ wieder. Andere beziehen „Jakob“ auf die Gemeinschaft der Suchenden.'
    reason: Die Fußnote erläutert die reale syntaktische und überlieferungsgeschichtliche Schwierigkeit, ohne ein fehlendes Wort im hebräischen Text zu ergänzen oder eine Deutung als einzig möglich festzulegen.
lexical_decisions:
- source_word: דּוֹר
  choice: Generation
  rationale: Bewahrt die kollektive und zeitliche Bedeutung des hebräischen Wortes, ohne es auf eine bestimmte Altersgruppe einzuengen.
- source_word: דֹּרְשָׁיו
  choice: die ihn suchen
  rationale: Gibt das Streben nach Gott beziehungsweise das Fragen nach ihm knapp und idiomatisch wieder; das männliche Suffix wird als „ihn“ erhalten.
- source_word: מְבַקְשֵׁי פָנֶיךָ
  choice: die dein Angesicht suchen
  rationale: Bewahrt das biblische Bild vom Suchen des Angesichts als Verlangen nach unmittelbarer Gottesnähe.
- source_word: סֶלָה
  choice: Sela
  rationale: Die wahrscheinlich musikalische oder liturgische Angabe wird wegen ihrer unsicheren genauen Bedeutung transliteriert.
theological_decisions:
- issue: Bezug von „Jakob“ am Versende
  choice: Jakob als direkte Anrede stehen lassen
  alternative: „Gott Jakobs“ oder „die Nachkommen Jakobs“
  rationale: Der überlieferte hebräische Text enthält lediglich „Jakob“. Die Ergänzung „Gott“ wäre eine textkritische Glättung; eine eindeutige Umdeutung als Bezeichnung der Suchenden würde die syntaktische Spannung auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Angesicht“ erhält bewusst das zentrale biblische Bild; „Sela“ bleibt als traditionelle, in ihrer Bedeutung unsichere liturgische Angabe unübersetzt.
