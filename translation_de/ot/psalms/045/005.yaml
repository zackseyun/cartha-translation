base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/005.yaml
  text: Your arrows are sharp[a]; peoples fall beneath you; they are in the heart of the king’s enemies.
translation:
  language: de
  text: Deine Pfeile sind scharf[a]; Völker fallen unter dir; sie sind im Herzen der Feinde des Königs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und unter Beibehaltung der stark verdichteten hebräischen Satzform: »Deine Pfeile sind scharf – Völker fallen unter dir – im Herzen der Feinde des Königs.«'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: חִצֶּיךָ
  choice: deine Pfeile
  rationale: Der Plural von חֵץ mit Suffix der 2. Person Singular bedeutet unmittelbar »deine Pfeile«; dies ist auch im modernen Deutschen die natürliche Entsprechung.
- source_word: שְׁנוּנִים
  choice: sind scharf
  rationale: Die Form bezeichnet etwas Geschärftes beziehungsweise Scharfes. Die prädikative Wiedergabe ist idiomatisch und erhält das Bild.
- source_word: עַמִּים
  choice: Völker
  rationale: Der Plural von עַם bezeichnet hier mehrere Volksgruppen. »Völker« bildet den Plural prägnant ab.
- source_word: תַּחְתֶּיךָ
  choice: unter dir
  rationale: Die Präposition mit Suffix bedeutet wörtlich »unter dir« und lässt sowohl das räumliche Bild des Fallens als auch die Vorstellung der Unterwerfung anklingen.
- source_word: יִפְּלוּ
  choice: fallen
  rationale: Das Imperfekt kann futurisch oder als lebendige poetische Gegenwart verstanden werden. »fallen« passt zur unmittelbaren Bildfolge und lässt die zeitliche Nuance offen.
- source_word: בְּלֵב
  choice: sie dringen ins Herz
  rationale: Wörtlich steht »im Herzen«. Wegen der stark verdichteten Syntax wird die von den Pfeilen vorausgesetzte Bewegung im Deutschen mit »dringen« ausgedrückt; die Fußnote dokumentiert die wörtlichere Struktur.
- source_word: אוֹיְבֵי הַמֶּלֶךְ
  choice: der Feinde des Königs
  rationale: Die Status-constructus-Verbindung lautet wörtlich »der Feinde des Königs«. »Des Königs« wird beibehalten und nicht an die zweite Person zu »deiner Feinde« angeglichen.
theological_decisions:
- issue: Bezug des »Königs« in einem königlichen beziehungsweise messianisch gelesenen Psalm
  choice: Die unmittelbare Formulierung »des Königs« bleibt ohne ausdrückliche messianische Identifikation erhalten.
  alternative: Den König bereits in der Übersetzung ausdrücklich messianisch identifizieren oder »deine Feinde« schreiben.
  rationale: Der hebräische Vers sagt schlicht »des Königs«. Seine mögliche typologische oder messianische Bedeutung gehört zur Auslegung und soll nicht in den Wortlaut eingetragen werden.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die Semikolons bewahren die gedrängte Abfolge des Hebräischen; die Hauptfassung ergänzt im letzten Satzglied nur die für verständliches Deutsch notwendige, im Pfeilbild vorausgesetzte Bewegung.
