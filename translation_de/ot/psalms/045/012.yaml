  text: וּ/בַֽת צֹ֨ר בְּ֭/מִנְחָה פָּנַ֥יִ/ךְ יְחַלּ֗וּ עֲשִׁ֣ירֵי עָֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/012.yaml
  text: And the daughter of Tyre will come with a gift[b][a]; the rich among the people will seek your favor.
translation:
  language: de
  text: Und die Tochter von Tyrus kommt mit einem Geschenk[a]; die Reichen des Volkes suchen deine Gunst[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „mit einer Gabe“ beziehungsweise „mit Tribut“; das hebräische מִנְחָה kann je nach Zusammenhang Geschenk, Tribut oder Opfergabe bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „dein Angesicht“; die hebräische Wendung bedeutet, jemanden um Gunst zu bitten oder günstig zu stimmen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת צֹר
  choice: Und die Tochter von Tyrus
  rationale: Die Verbindung bezeichnet Tyrus beziehungsweise seine Bevölkerung in personifizierter Gestalt. Die traditionelle Wendung „Tochter von Tyrus“ bewahrt dieses Bild.
- source_word: בְּמִנְחָה
  choice: mit einem Geschenk
  rationale: מִנְחָה kann Geschenk, Tribut oder Opfergabe bedeuten. Im königlichen Zusammenhang ist „Geschenk“ natürlich und wahrt die lexikalische Offenheit.
- source_word: פָּנַיִךְ יְחַלּוּ
  choice: suchen deine Gunst
  rationale: Wörtlich ist vom Besänftigen beziehungsweise Ersuchen des „Angesichts“ die Rede. Die deutsche Wendung gibt den hebräischen Höflichkeits- und Bittidiom verständlich wieder; die feminine Singularanrede bleibt in „deine“ erhalten.
- source_word: עֲשִׁירֵי עָם
  choice: die Reichen des Volkes
  rationale: Die Constructusverbindung bezeichnet die wohlhabenden Angehörigen eines Volkes. Die knappe Wiedergabe vermeidet eine nicht ausdrücklich bezeichnete Volkszugehörigkeit.
- source_word: יְחַלּוּ
  choice: suchen
  rationale: Das Piel von חלה bedeutet in Verbindung mit „Angesicht“ um Gunst bitten oder jemanden günstig stimmen. Zusammen mit „deine Gunst“ ist „suchen“ idiomatisch und präzise.
theological_decisions: []
