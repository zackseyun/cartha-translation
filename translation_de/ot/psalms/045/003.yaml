  text: Strap your sword on your thigh[a], mighty warrior[b], in your splendor and your majesty.
translation:
  language: de
  text: Gürte dein Schwert an deine Hüfte, du Held, in deiner Hoheit und Pracht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und in der Zuordnung offen: „Gürte dein Schwert an deine Hüfte, du Held – deine Hoheit und deine Pracht.“'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲגוֹר
  choice: Gürte … um
  rationale: Der Imperativ von חגר bezeichnet das Umschnallen beziehungsweise Befestigen einer Waffe. „Gürte … um“ bewahrt das konkrete, poetische Bild und ist im Deutschen verständlich.
- source_word: חַרְבְּךָ
  choice: dein Schwert
  rationale: Das Substantiv mit Suffix der 2. Person Singular bezeichnet unmittelbar das Schwert des Angeredeten.
- source_word: עַל יָרֵךְ
  choice: um deine Hüfte
  rationale: Wörtlich steht „auf/an deine Hüfte“. Beim Tragen eines Schwertes ist „um deine Hüfte“ im Deutschen die natürliche räumliche Formulierung, ohne das körperliche Bild zu verallgemeinern.
- source_word: גִּבּוֹר
  choice: du Held
  rationale: Das Wort steht als Anrede und bezeichnet hier aufgrund des Schwertmotivs einen kampfstarken Helden. „Du Held“ ist knapp, würdevoll und entspricht der poetischen Form.
- source_word: הוֹדְךָ
  choice: deiner Hoheit
  rationale: הוֹד bezeichnet in königlicher Dichtung Hoheit, Glanz oder Majestät. „Hoheit“ wahrt den königlichen Ton und bleibt vom folgenden Begriff unterscheidbar.
- source_word: וַהֲדָרֶךָ
  choice: und Pracht
  rationale: הדר kann Pracht, Majestät oder Herrlichkeit bezeichnen. „Pracht“ bildet mit „Hoheit“ ein natürliches poetisches Wortpaar und bewahrt den Aspekt sichtbarer königlicher Größe.
theological_decisions:
- issue: Königliche beziehungsweise messianische Anrede in Psalm 45
  choice: Der Vers wird als unmittelbare Anrede an einen königlichen Helden übersetzt, ohne ihn im Wortlaut ausdrücklich als Messias zu identifizieren.
  alternative: Die angesprochene Gestalt bereits in diesem Vers ausdrücklich messianisch deuten.
  rationale: Der hebräische Vers spricht poetisch einen königlichen Kämpfer an, nennt ihn hier aber nicht ausdrücklich den Messias. Die Übersetzung lässt die weiterführende kanonische und typologische Deutung offen.
- issue: Syntaktische Zuordnung von הוֹדְךָ וַהֲדָרֶךָ
  choice: 'Die beiden Begriffe werden modal auf den Befehl bezogen: „in deiner Hoheit und Pracht“.'
  alternative: 'Die Wendung appositionell oder als eigenständigen Ausruf wiedergeben: „deine Hoheit und deine Pracht“.'
  rationale: Im Hebräischen fehlt eine ausdrückliche Präposition, sodass die genaue syntaktische Beziehung knapp und mehrdeutig bleibt. Die modale Wiedergabe ergibt einen natürlichen deutschen Satz, während die Fußnote die offenere Form des Ausgangstextes kenntlich macht.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst poetischem „gürten“. Die knappe direkte Anrede und das königliche Wortpaar bleiben erhalten; die syntaktische Mehrdeutigkeit des Schlusses wird nicht verschwiegen.
