source:
  edition: WLC
  text: תַּ֣חַת אֲ֭בֹתֶי/ךָ יִהְי֣וּ בָנֶ֑י/ךָ תְּשִׁיתֵ֥/מוֹ לְ֝/שָׂרִ֗ים בְּ/כָל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/016.yaml
  text: In place of your fathers will be your sons[b][a]; you will appoint them as princes in all the earth.
translation:
  language: de
  text: An die Stelle deiner Väter werden deine Söhne treten; du wirst sie als Fürsten auf der ganzen Erde einsetzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im ganzen Land“. Das hebräische Wort אֶרֶץ kann je nach Zusammenhang „Erde“ oder „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: an die Stelle
  rationale: תַּחַת bezeichnet hier nicht eine räumliche Lage, sondern Nachfolge beziehungsweise Ersetzung. Die Wendung „an die Stelle treten“ gibt diesen dynastischen Sinn im Deutschen natürlich wieder.
- source_word: אֲבֹתֶיךָ
  choice: deiner Väter
  rationale: Die wörtliche Bedeutung „Väter“ bleibt erhalten; im königlichen Zusammenhang sind damit zugleich die dynastischen Vorfahren gemeint.
- source_word: יִהְיוּ בָנֶיךָ
  choice: werden deine Söhne treten
  rationale: Zusammen mit תַּחַת ergibt יִהְיוּ idiomatisch das Eintreten der Söhne an die Stelle der Väter. „Söhne“ bewahrt den ausdrücklich maskulinen Plural und den Bezug auf königliche Erben.
- source_word: תְּשִׁיתֵמוֹ
  choice: du wirst sie einsetzen
  rationale: Das Verb שׁית bedeutet grundsätzlich „setzen, stellen“. In Verbindung mit einem Herrscheramt gibt „einsetzen“ seine kontextuelle Bedeutung präzise wieder.
- source_word: לְשָׂרִים
  choice: als Fürsten
  rationale: שָׂרִים kann Fürsten, Oberste oder Herrscher bezeichnen. „Fürsten“ passt zum königlichen Kontext und wahrt den gehobenen Ton.
- source_word: בְּכָל הָאָרֶץ
  choice: auf der ganzen Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Die umfassende königliche Sprache des Psalms legt hier „Erde“ nahe, ohne die mögliche Bedeutung „Land“ auszuschließen.
theological_decisions:
- issue: Reichweite von הָאָרֶץ im königlichen beziehungsweise messianisch gelesenen Kontext
  choice: Erde
  alternative: Land
  rationale: Der hebräische Ausdruck lässt beide Bedeutungen zu. „Erde“ entspricht dem weitreichenden königlichen Horizont des Psalms, während die Fußnote die engere Deutung offenhält und keine spätere theologische Auslegung erzwingt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Wendung „an die Stelle … treten“ vermeidet eine im Deutschen unvollständig wirkende Formulierung mit „sein“ und bewahrt zugleich den Gedanken dynastischer Nachfolge.
