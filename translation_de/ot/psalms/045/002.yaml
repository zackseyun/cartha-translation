  text: יָפְיָפִ֡יתָ מִ/בְּנֵ֬י אָדָ֗ם ה֣וּצַק חֵ֭ן בְּ/שְׂפְתוֹתֶ֑י/ךָ עַל כֵּ֤ן בֵּֽרַכְ/ךָ֖ אֱלֹהִ֣ים לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/002.yaml
  text: You are more beautiful than the sons of men[a]; grace is poured upon your lips[c][b]; therefore God has blessed you forever.
translation:
  language: de
  text: Du bist schöner als andere Menschen[a]; Anmut ist über deine Lippen ausgegossen[b]. Darum hat Gott dich für immer gesegnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mehr als die Söhne Adams“; eine poetische Bezeichnung für Menschen.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „Gunst“, „Gnade“ oder „freundliche Rede ist über deine Lippen ausgegossen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפְיָפִיתָ מִבְּנֵי אָדָם
  choice: Du bist schöner als alle anderen Menschen
  rationale: Die intensive Form von יפה bezeichnet herausragende Schönheit; מן markiert den Vergleich. Die natürliche deutsche Wendung gibt den Sinn des poetischen Ausdrucks „Söhne des Menschen“ wieder, ohne einen Vergleich ausschließlich mit männlichen Personen zu behaupten.
- source_word: הוּצַק
  choice: ist … ausgegossen
  rationale: Das passive Perfekt von יצק bewahrt das konkrete Bild des Ausgießens und bezeichnet einen vollzogenen Zustand.
- source_word: חֵן
  choice: Anmut
  rationale: חֵן kann Gunst, Anmut oder gewinnende Freundlichkeit bedeuten. Im Zusammenhang mit den Lippen hält „Anmut“ die ästhetische und die auf das Reden bezogene Bedeutung offen.
- source_word: בְּשְׂפְתוֹתֶיךָ
  choice: über deine Lippen
  rationale: Obwohl בְּ gewöhnlich „in/mit/an“ bedeutet, verlangt das Bild des Ausgießens im Deutschen idiomatisch „über“.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Gibt den folgernden Zusammenhang prägnant und in gehobenem, aber heutigem Deutsch wieder.
- source_word: בֵּרַכְךָ אֱלֹהִים
  choice: hat Gott dich … gesegnet
  rationale: אֱלֹהִים ist syntaktisch am natürlichsten das Subjekt des Verbs; das deutsche Perfekt entspricht dem vollzogenen hebräischen Verb und dem daraus bestehenden Zustand.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Eine klare, natürliche Wiedergabe der unbegrenzten beziehungsweise fortdauernden Zeitspanne.
theological_decisions:
- issue: Ist אֱלֹהִים Subjekt oder Anrede?
  choice: '„Gott“ als Subjekt: „Darum hat Gott dich für immer gesegnet.“'
  alternative: „Darum, Gott, hat er dich für immer gesegnet“ beziehungsweise eine durch den folgenden Vers ergänzte Lesart.
  rationale: Im vorliegenden Vers ist אֱלֹהִים am einfachsten als Subjekt von בֵּרַכְךָ zu verstehen. Die Übersetzung ergänzt weder Wörter aus dem folgenden Vers noch erzwingt sie eine bestimmte christologische Auslegung.
- issue: Bedeutung von חֵן auf den Lippen
  choice: „Anmut“
  alternative: „Gnade“, „Gunst“ oder „freundliche Worte“
  rationale: „Anmut“ wahrt die Mehrdeutigkeit zwischen gewinnender Ausstrahlung und anmutigem beziehungsweise freundlichem Reden, statt die Aussage ausschließlich zu theologisieren oder zu paraphrasieren.
translation_notes:
  register: Poetisch, würdevoll und modern. Der Parallelismus wird durch Semikolon und Satzschluss gegliedert. „Anmut“ erhält das Bild und die Bedeutungsweite von חֵן; die Fußnoten erläutern den hebräischen Ausdruck und seine lexikalische Offenheit.
