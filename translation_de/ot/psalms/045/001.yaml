id: PSA.45.1
reference: Psalms 45:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רָ֘חַ֤שׁ לִבִּ֨/י דָּ֘בָ֤ר ט֗וֹב אֹמֵ֣ר אָ֭נִי מַעֲשַׂ֣/י לְ/מֶ֑לֶךְ לְ֝שׁוֹנִ֗/י עֵ֤ט סוֹפֵ֬ר מָהִֽיר׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/001.yaml
  text: My heart overflows with a good word[a]; I say[c][b], “My work is for the king.” My tongue is the pen of a skillful scribe.
translation:
  language: de
  text: 'Mein Herz quillt über von einem guten Wort[a]. Ich sage: »Mein Werk ist für den König[b].« Meine Zunge ist die Feder eines gewandten Schreibers[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von einem erfreulichen Thema« oder »von einer edlen Sache«. Der hebräische Ausdruck kann sowohl die Worte selbst als auch ihren Gegenstand bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »über den König« oder »zum König«. Die Präposition kann eine Widmung, den Gegenstand oder die Anrede kennzeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »eines flinken« beziehungsweise »bereiten Schreibers«. Das hebräische Adjektiv kann neben Gewandtheit auch Schnelligkeit und Bereitschaft hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָחַשׁ
  choice: quillt über
  rationale: Das Verb beschreibt ein inneres Wallen oder Hervorströmen. »Quillt über« bewahrt das poetische Bild, nach dem sich das im Herzen Bewegte in Worten Bahn bricht.
- source_word: לִבִּי
  choice: mein Herz
  rationale: Die direkte Entsprechung bewahrt das Herz als Sitz des Denkens und Empfindens.
- source_word: דָּבָר טוֹב
  choice: ein gutes Wort
  rationale: Die Wiedergabe bleibt nahe an der weiten Bedeutung von דָּבָר und lässt offen, ob das Wort selbst oder der behandelte Gegenstand gemeint ist.
- source_word: אֹמֵר אֲנִי
  choice: ich sage
  rationale: Die schlichte Redeeinleitung gibt den hebräischen Ausdruck wieder, ohne eine besondere Vortragsform vorauszusetzen.
- source_word: מַעֲשַׂי
  choice: mein Werk
  rationale: Im dichterischen Zusammenhang bezeichnet der Ausdruck wahrscheinlich das vom Psalmisten Geschaffene. »Werk« wahrt diese Bedeutung, ohne vorschnell auf »Gedicht« oder »Taten« festzulegen.
- source_word: לְמֶלֶךְ
  choice: für den König
  rationale: Die Präposition kann Widmung, Bezug oder Richtung ausdrücken. »Für den König« ist im Kontext eines Königsliedes natürlich, ohne die anderen Möglichkeiten auszuschließen.
- source_word: לְשׁוֹנִי
  choice: meine Zunge
  rationale: Das konkrete poetische Bild wird beibehalten und nicht zu »meine Rede« verflacht.
- source_word: עֵט
  choice: Feder
  rationale: »Feder« ist im Deutschen ein natürliches, würdiges Bild für das Schreibgerät eines Schreibers und passt zur flüssigen poetischen Rede.
- source_word: סוֹפֵר
  choice: Schreiber
  rationale: »Schreiber« bewahrt den Bezug auf einen geübten professionellen Schreibkundigen und klingt im modernen Deutschen natürlicher als »Schriftgelehrter«, das eine andere Rolle nahelegen könnte.
- source_word: מָהִיר
  choice: gewandt
  rationale: Das Adjektiv kann Schnelligkeit, Bereitschaft und daraus folgende Fertigkeit bezeichnen. »Gewandt« bringt die flüssige, geübte Ausführung zum Ausdruck.
theological_decisions: []
