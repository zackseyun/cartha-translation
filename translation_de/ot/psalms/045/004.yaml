  text: וַ/הֲדָ֬רְ/ךָ֨ צְלַ֬ח רְכַ֗ב עַֽל דְּבַר אֱ֭מֶת וְ/עַנְוָה צֶ֑דֶק וְ/תוֹרְ/ךָ֖ נוֹרָא֣וֹת יְמִינֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/004.yaml
  text: In your majesty ride on victoriously for the cause of truth and meekness and righteousness[b][a]; let your right hand teach you awesome deeds.
translation:
  language: de
  text: Reite in deiner Hoheit siegreich voran für die Sache der Wahrheit, der Sanftmut und der Gerechtigkeit[a]; deine rechte Hand wird dich Furchtbares lehren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die Sache der Wahrheit und demütiger Gerechtigkeit“. Die knappe hebräische Wendung kann auch als verdichtete Verbindung statt als dreigliedrige Reihe verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „deine rechte Hand wird dir Furchtbares zeigen“. Das hebräische Verb kann „lehren“, „unterweisen“ oder „zeigen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲדָרְךָ
  choice: in deiner Hoheit
  rationale: הָדָר bezeichnet Hoheit, Pracht oder Majestät. Die präpositionale Wiedergabe fügt sich natürlich in die poetische Aufforderung ein; das vorangestellte וַ verbindet den Vers mit dem Zusammenhang, ohne dass im Deutschen zwingend ein eigenes „und“ stehen muss.
- source_word: צְלַח רְכַב
  choice: Reite … siegreich voran
  rationale: צְלַח kann erfolgreich sein oder erfolgreich vordringen bedeuten, רְכַב heißt „reite“. Die zusammengezogene Wiedergabe bewahrt sowohl das Reiten als auch den erfolgreichen, triumphalen Vormarsch.
- source_word: עַל דְּבַר אֱמֶת
  choice: für die Sache der Wahrheit
  rationale: דָּבָר kann neben „Wort“ auch „Angelegenheit“ oder „Sache“ bedeuten. Im königlich-kriegerischen Bild bezeichnet die Wendung den Grund oder die Sache, für die der Angeredete voranreitet.
- source_word: וְעַנְוָה צֶדֶק
  choice: der Sanftmut und der Gerechtigkeit
  rationale: עַנְוָה bezeichnet Demut oder Sanftmut, צֶדֶק Gerechtigkeit. Die Reihung gibt beide Begriffe erkennbar wieder, ohne ihre knappe und syntaktisch mehrdeutige Verbindung im Hebräischen zu verschweigen; eine stärker verdichtete Lesart steht in der Fußnote.
- source_word: וְתוֹרְךָ
  choice: soll dich … lehren
  rationale: Die Hifil-Form von ירה bedeutet „lehren“, „unterweisen“ oder „zeigen“. Die Wiedergabe mit „soll“ erhält den auffordernden poetischen Ton und lässt die rechte Hand als Subjekt stehen.
- source_word: נוֹרָאוֹת
  choice: furchtgebietende Taten
  rationale: Das Wort bezeichnet Dinge oder Taten, die Furcht und ehrfürchtiges Staunen hervorrufen. „Furchtgebietend“ bewahrt diese Doppelwirkung besser als das heute leicht missverständliche „schrecklich“.
- source_word: יְמִינֶךָ
  choice: deine rechte Hand
  rationale: Das wörtliche Bild für Macht, Geschick und siegreiches Handeln bleibt erhalten.
theological_decisions:
- issue: Königlich-kriegerische Bildsprache in einem später messianisch gelesenen Psalm
  choice: Die unmittelbare Anrede des Königs und das Bild des siegreich reitenden Herrschers bleiben stehen.
  alternative: Den Vers ausdrücklich christologisch oder messianisch formulieren.
  rationale: Der hebräische Vers spricht in königlicher Poesie zu seinem Adressaten. Die Übersetzung lässt weiterführende kanonische und messianische Deutungen zu, trägt sie aber nicht ausdrücklich in den Wortlaut ein.
- issue: Syntaktische Beziehung von עַנְוָה und צֶדֶק
  choice: Sanftmut und Gerechtigkeit werden als einzelne Glieder einer Reihe wiedergegeben.
  alternative: „demütige Gerechtigkeit“ oder „die Demut der Gerechtigkeit“
  rationale: Die hebräische Formulierung ist knapp und kann unterschiedlich gegliedert werden. Die Hauptfassung macht beide Begriffe sichtbar; die Fußnote wahrt die verdichtete Alternative.
- issue: Aussageweise von וְתוֹרְךָ
  choice: 'Auffordernd: „deine rechte Hand soll dich … lehren“'
  alternative: 'Indikativisch: „deine rechte Hand wird dich … lehren“'
  rationale: Die Form kann im poetischen Zusammenhang als Fortführung der Aufforderung oder als Zukunftsaussage verstanden werden. Die Hauptfassung folgt dem auffordernden Zusammenhang, während die Fußnote die indikativische Möglichkeit nennt.
translation_notes:
  register: Moderne, gehobene Standardsprache mit klarer königlicher und kriegerischer Bildwelt. „Hoheit“, „siegreich voranreiten“ und „rechte Hand“ bewahren den würdevollen poetischen Ton; ungewöhnliche hebräische Verdichtungen werden nicht stillschweigend dogmatisch aufgelöst.
