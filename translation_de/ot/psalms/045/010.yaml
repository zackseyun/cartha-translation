source:
  edition: WLC
  text: שִׁמְעִי בַ֣ת וּ֭/רְאִי וְ/הַטִּ֣י אָזְנֵ֑/ךְ וְ/שִׁכְחִ֥י עַ֝מֵּ֗/ךְ וּ/בֵ֥ית אָבִֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/010.yaml
  text: Listen[a], daughter, and see; incline your ear, and forget your people and your father's house.
translation:
  language: de
  text: Höre, Tochter, und sieh; neige dein Ohr und vergiss dein Volk und das Haus deines Vaters.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעִי
  choice: Höre
  rationale: Der Imperativ in der 2. Person Singular feminin fordert zu aufmerksamem Hören auf; „Höre“ ist direkt, würdig und im Deutschen natürlich.
- source_word: בַת
  choice: Tochter
  rationale: Die Anrede bezeichnet die weibliche Adressatin unmittelbar; ein zusätzliches „o“ ist im modernen Deutschen nicht nötig.
- source_word: וּרְאִי
  choice: und sieh
  rationale: Der Imperativ von ראה wird direkt wiedergegeben und bewahrt die Abfolge der Aufforderungen.
- source_word: וְהַטִּי אָזְנֵךְ
  choice: neige dein Ohr
  rationale: Die bildhafte hebräische Wendung für aufmerksames Zuhören bleibt erhalten und ist im Deutschen verständlich.
- source_word: וְשִׁכְחִי
  choice: und vergiss
  rationale: „Vergiss“ gibt den klaren lexikalischen Sinn wieder, ohne die entschiedene Aufforderung zu „lass zurück“ abzuschwächen.
- source_word: עַמֵּךְ
  choice: dein Volk
  rationale: עם bezeichnet hier die eigene ethnische beziehungsweise soziale Gemeinschaft; „dein Volk“ ist die naheliegende Entsprechung.
- source_word: וּבֵית אָבִיךְ
  choice: und das Haus deines Vaters
  rationale: Die Formulierung bewahrt das hebräische Bild für den väterlichen Familienverband beziehungsweise das Herkunftshaus.
theological_decisions:
- issue: Tragweite der Aufforderung an die Braut
  choice: Eine unmittelbare Aufforderung an die Braut, sich in ihrer vorrangigen Zugehörigkeit von Herkunftsvolk und Vaterhaus auf die königliche Ehe hin neu auszurichten.
  alternative: Eine allgemeine, weisheitliche Aufforderung zur Aufmerksamkeit ohne besondere Betonung eines Wechsels der Zugehörigkeit.
  rationale: Die Folge der Imperative mündet in „vergiss dein Volk und das Haus deines Vaters“ und legt im hochzeitlichen Zusammenhang eine entschiedene Neuorientierung nahe. Die Übersetzung bewahrt diese Spannung, ohne spätere Lehrdeutungen einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, knappem poetischem Register. Die parallelen Imperative und das konkrete Bild „neige dein Ohr“ werden formal nah am Hebräischen bewahrt.
