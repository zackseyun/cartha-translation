base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/000.yaml
  text: 'For the choirmaster: according to “Lilies.” Of the sons of Korah[a]. A Maskil[c][b]. A song of loves.'
translation:
  language: de
  text: Für den musikalischen Leiter. Nach »Lilien«[a]. Von den Söhnen Korachs. Ein Maskil[b]. Ein Lied der Liebe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Schoschannim, wörtlich »Lilien«; vermutlich der Name einer Melodie oder musikalischen Weise.
    reason: lexical_alternative
  - marker: b
    text: Maskil ist ein Fachbegriff in Psalmüberschriften; möglicherweise bezeichnet er ein nachdenkliches oder lehrendes Lied.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »ein Lied der Lieben«; der ungewöhnliche Plural kann ein Liebeslied oder ein Lied über Liebesdinge bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: Die Wendung bezeichnet in Psalmüberschriften den für die musikalische Ausführung Verantwortlichen. Diese Wiedergabe ist natürlich und legt nicht unnötig fest, ob ein Chor gemeint ist.
- source_word: עַל שֹׁשַׁנִּים
  choice: Nach »Lilien«
  rationale: עַל kann hier eine Melodie, musikalische Weise oder sonstige Aufführungsvorgabe einleiten. »Lilien« gibt die wörtliche Bedeutung wieder; die Anführungszeichen kennzeichnen die wahrscheinliche Verwendung als Titel.
- source_word: לִבְנֵי קֹרַח
  choice: Von den Söhnen Korachs
  rationale: Die Präposition ל kann in Überschriften Autorschaft, Zugehörigkeit oder Widmung anzeigen. »Von« ist im Deutschen knapp und lässt einen gewissen Zuordnungsspielraum bestehen.
- source_word: מַשְׂכִּיל
  choice: Ein Maskil
  rationale: Der technische Gattungs- oder Aufführungsbegriff ist in seiner genauen Bedeutung unsicher; die Transliteration vermeidet eine vorschnelle Festlegung.
- source_word: שִׁיר יְדִידֹת
  choice: Ein Lied der Liebe
  rationale: Die idiomatische deutsche Form bewahrt das Thema der Liebe, ohne den ungewöhnlichen hebräischen Plural unnatürlich als »Lieben« wiederzugeben.
