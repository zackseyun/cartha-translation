source:
  edition: WLC
  text: אַזְכִּ֣ירָה שִׁ֭מְ/ךָ בְּ/כָל דֹּ֣ר וָ/דֹ֑ר עַל כֵּ֥ן עַמִּ֥ים יְ֝הוֹדֻ֗/ךָ לְ/עֹלָ֥ם וָ/עֶֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/017.yaml
  text: I will cause your name to be remembered in every generation[b][a]; therefore the peoples will praise you forever and ever.
translation:
  language: de
  text: Ich will dafür sorgen, dass dein Name in jeder Generation in Erinnerung bleibt[a]; darum werden die Völker dich für immer und ewig preisen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich will deinen Namen erwähnen“ oder „Ich will deines Namens gedenken.“ Das hebräische Verb steht in einer Form, die hier aktives Bewahren im Gedächtnis beziehungsweise Veranlassen des Erinnerns nahelegt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dir danken“. Das hebräische Verb kann besonders im gottesdienstlichen Zusammenhang sowohl Preisen als auch Danken bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּירָה
  choice: Ich will dafür sorgen, dass … in Erinnerung bleibt
  rationale: Die Hifil-Form von זכר hat hier eine veranlassende beziehungsweise aktiv erinnernde Kraft. Die Formulierung gibt mehr wieder als privates Erinnern und klingt zugleich natürlich auf Deutsch.
- source_word: שִׁמְךָ
  choice: dein Name
  rationale: Die wörtliche und im Deutschen idiomatische Wiedergabe lässt die mit dem Namen verbundene Person, ihr Ansehen und ihr bleibendes Gedenken mitschwingen.
- source_word: בְּכָל דֹּר וָדֹר
  choice: in jeder Generation
  rationale: Die hebräische Wiederholungsform bezeichnet die fortlaufende Folge sämtlicher Generationen; die distributive Formulierung ist präzise und natürlich.
- source_word: עַל כֵּן
  choice: darum
  rationale: Das Wortgefüge kennzeichnet die folgende Aussage als Folge beziehungsweise Konsequenz und wird im poetischen Zusammenhang mit „darum“ klar und würdig wiedergegeben.
- source_word: עַמִּים
  choice: die Völker
  rationale: Der hebräische Plural bezeichnet mehrere Völker. Der deutsche bestimmte Artikel ist in dieser allgemeinen, poetischen Aussage idiomatisch.
- source_word: יְהוֹדֻךָ
  choice: werden dich … preisen
  rationale: ידה im Hifil kann in gottesdienstlicher Sprache Lob und Dank bezeichnen. „preisen“ passt zum Kontext bleibenden königlichen Ruhms, ohne die mögliche Nuance des Dankens auszuschließen.
- source_word: לְעֹלָם וָעֶד
  choice: für immer und ewig
  rationale: Die gekoppelte Wendung verstärkt die zeitlich unbegrenzte Dauer; die gewählte deutsche Formel bewahrt diesen Nachdruck.
theological_decisions:
- issue: Bezug der Pronomen der zweiten Person im königlichen Hochzeitspsalm
  choice: Die direkte Anrede „dein/dich“ bleibt ohne nähere Bestimmung erhalten.
  alternative: Ausdrückliche Festlegung auf den davidischen König oder auf eine messianisch-christologische Erfüllung.
  rationale: Der Vers selbst benennt den Angeredeten nicht näher. Die unveränderte direkte Anrede wahrt sowohl den unmittelbaren königlichen Zusammenhang als auch die weitergehende kanonische Deutungsmöglichkeit, ohne sie in die Übersetzung einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdig-poetischem Register. Die Satzfolge bleibt nah am hebräischen Parallelismus; „dafür sorgen, dass … in Erinnerung bleibt“ vermittelt die kausative Verbform verständlich, ohne unnötige Altertümlichkeit.
