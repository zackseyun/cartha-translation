source:
  edition: WLC
  text: תּ֭וּבַלְנָה בִּ/שְׂמָחֹ֣ת וָ/גִ֑יל תְּ֝בֹאֶ֗ינָה בְּ/הֵ֣יכַל מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/015.yaml
  text: They will be led with gladness and rejoicing[b][a]; they will enter the palace of the king.
translation:
  language: de
  text: Mit Freude und Jubel werden sie herbeigeführt; sie ziehen in den Palast des Königs ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann „Palast“, „Halle“ oder in anderen Zusammenhängen „Tempel“ bedeuten; hier passt „Palast“ zum königlichen Hochzeitsfest.
    reason: cultural_note
lexical_decisions:
- source_word: תּוּבַלְנָה
  choice: werden sie herbeigeführt
  rationale: Das Hophal Imperfekt 3. Person feminin Plural von יבל bezeichnet passives Geführt- oder Gebrachtwerden. „Herbeigeführt“ bewahrt den feierlich-prozessionalen Zug und weist auf das Ziel der Bewegung voraus.
- source_word: בִּשְׂמָחוֹת
  choice: mit Freude
  rationale: ב mit dem Plural שׂמחות bezeichnet hier Begleitumstand oder Art und Weise. Der deutsche Kollektivausdruck „mit Freude“ gibt den idiomatischen Sinn wieder, ohne den hebräischen Plural unnatürlich nachzubilden.
- source_word: וָגִיל
  choice: und Jubel
  rationale: גיל bezeichnet ausgelassene, frohlockende Freude. „Jubel“ hält den Ausdruck von שׂמחות unterscheidbar und bildet die festliche Steigerung natürlich ab.
- source_word: תְּבֹאֶינָה
  choice: sie ziehen … ein
  rationale: Das Qal Imperfekt 3. Person feminin Plural von בוא bezeichnet hier das Hineingehen in ein Gebäude. „Einziehen“ passt sowohl zum Eintritt als auch zum feierlichen Hochzeitszug.
- source_word: בְּהֵיכַל
  choice: in den Palast
  rationale: היכל kann „Palast“, „Halle“ oder „Tempel“ bedeuten. Im königlichen Hochzeitsrahmen von Psalm 45 ist „Palast“ die naheliegendste Bedeutung.
- source_word: מֶלֶךְ
  choice: des Königs
  rationale: Obwohl das Hebräische keinen Artikel setzt, bezeichnet die Status-constructus-Verbindung im Kontext den bestimmten König des Psalms; im Deutschen ist daher „des Königs“ idiomatisch.
theological_decisions:
- issue: Bezugswort der femininen Pluralformen
  choice: Das unbestimmte Pronomen „sie“ bleibt stehen und verweist im unmittelbaren Zusammenhang auf die weibliche Hochzeitsgesellschaft.
  alternative: Die Frauen der Prozession ausdrücklich als Brautjungfern oder Begleiterinnen bezeichnen.
  rationale: Die femininen Pluralformen sind eindeutig, doch der Vers selbst benennt die Frauen nicht erneut. „Sie“ wahrt den Rückbezug auf den vorausgehenden Kontext, ohne die Identität stärker festzulegen als der hebräische Text.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit feierlichem Rhythmus. Die Voranstellung von „Mit Freude und Jubel“ spiegelt die hervorgehobene Feststimmung; „herbeigeführt“ und „einziehen“ bewahren den Charakter einer Prozession.
