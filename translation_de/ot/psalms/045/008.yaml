  text: מֹר וַ/אֲהָל֣וֹת קְ֭צִיעוֹת כָּל בִּגְדֹתֶ֑י/ךָ מִֽן הֵ֥יכְלֵי שֵׁ֝֗ן מִנִּ֥י שִׂמְּחֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/008.yaml
  text: All your garments are fragrant with myrrh[a], aloes, and cassia; from ivory palaces[e][d][c][b], stringed instruments have made you glad.
translation:
  language: de
  text: Alle deine Gewänder duften nach Myrrhe, Aloeholz und Kassia. Aus Elfenbeinpalästen hat Musik dich erfreut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Aus Elfenbeinpalästen haben sie dich erfreut.“ Das Hebräische nennt das Subjekt nicht; möglich sind etwa Musik, Musiker oder Saiteninstrumente. Auch die genaue Bedeutung der mit „aus“ wiedergegebenen Präposition ist unsicher.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֹר
  choice: Myrrhe
  rationale: Die übliche und sachlich genaue Bezeichnung für das wohlriechende Harz.
- source_word: וַאֲהָלוֹת
  choice: Aloeholz
  rationale: Gemeint ist ein aromatisches Holz beziehungsweise Räucherwerk, nicht die heute so bezeichnete sukkulente Aloe-Pflanze. „Aloeholz“ ist verständlich und vermeidet dieses Missverständnis.
- source_word: קְצִיעוֹת
  choice: Kassia
  rationale: Bezeichnet die als Duftstoff und Gewürz verwendete aromatische Rinde; „Kassia“ ist im Deutschen präzise und knapp.
- source_word: כָּל בִּגְדֹתֶיךָ
  choice: Alle deine Gewänder duften nach
  rationale: Der hebräische Nominalsatz stellt die Duftstoffe unvermittelt neben „alle deine Gewänder“. Die Ergänzung „duften nach“ gibt den naheliegenden Sinn natürlich wieder, ohne zu behaupten, die Gewänder bestünden aus den Stoffen.
- source_word: מִן הֵיכְלֵי שֵׁן
  choice: Aus Elfenbeinpalästen
  rationale: הֵיכָל bezeichnet hier im höfisch-königlichen Zusammenhang am ehesten Paläste oder große Hallen; שֵׁן bedeutet wörtlich „Zahn“, in dieser Verbindung jedoch „Elfenbein“.
- source_word: מִנִּי
  choice: aus
  rationale: Die schwierige Präposition wird räumlich als Herkunftsangabe verstanden und mit dem vorangehenden מִן verbunden. Andere Nuancen wie „von ... her“ oder „durch“ bleiben möglich.
- source_word: שִׂמְּחוּךָ
  choice: hat dich erfreut
  rationale: Das Piel-Perfekt bedeutet „haben dich erfreut/froh gemacht“. Wegen des im Deutschen ergänzten Kollektivsubjekts „Musik“ steht das Verb im Singular.
- source_word: implicit subject of שִׂמְּחוּךָ
  choice: Musik
  rationale: Das Hebräische nennt das pluralische Subjekt nicht. „Musik“ ist im Festzusammenhang eine plausible, traditionsreiche Ergänzung, wird aber durch eine Fußnote ausdrücklich als Ergänzung kenntlich gemacht.
theological_decisions:
- issue: Königlicher beziehungsweise messianischer Rahmen von Psalm 45
  choice: Der Vers wird nach seinem unmittelbaren Zusammenhang als Schilderung königlicher Pracht und Festfreude übersetzt.
  alternative: Eine ausdrücklich messianisch formulierte Wiedergabe aufgrund späterer kanonischer Deutung.
  rationale: Der hebräische Wortlaut dieses Verses nennt weder den Messias noch eine christologische Identifikation. Eine mögliche typologische oder messianische Auslegung soll nicht in die Übersetzung eingetragen werden.
- issue: Nicht genanntes Subjekt von שִׂמְּחוּךָ
  choice: Im Haupttext wird „Musik“ ergänzt und die Unsicherheit in einer Fußnote offengelegt.
  alternative: „Saiteninstrumente“, „Musiker“ oder eine Wiedergabe mit unbestimmtem „sie“.
  rationale: Der Kontext legt festliche Musik nahe, doch der masoretische Text benennt das Subjekt nicht. Die Übersetzung wahrt die Lesbarkeit, ohne die Ergänzung als textlich eindeutig auszugeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gewänder“ und „Elfenbeinpaläste“ bewahren den höfisch-poetischen Ton; „duften nach“ sorgt für natürliche Verständlichkeit. Die im Hebräischen nicht ausdrücklich genannte Musik wird transparent als kontextuelle Ergänzung behandelt.
