id: PSA.45.11
reference: Psalms 45:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יִתְאָ֣ו הַ/מֶּ֣לֶךְ יָפְיֵ֑/ךְ כִּי ה֥וּא אֲ֝דֹנַ֗יִ/ךְ וְ/הִשְׁתַּֽחֲוִי לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/011.yaml
  text: and the king will desire your beauty[a], for he is your lord[b]; bow down to him.
translation:
  language: de
  text: Und der König wird deine Schönheit begehren[a], denn er ist dein Herr; wirf dich vor ihm nieder[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und der König möge deine Schönheit begehren.“ Die hebräische Verbform kann als Zukunftsaussage oder mit wünschender beziehungsweise auffordernder Kraft verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „erweise ihm Ehrerbietung“; das hebräische Verb bezeichnet das ehrerbietige Sich-Niederwerfen vor einem Höhergestellten und kann sowohl im königlichen als auch im religiösen Zusammenhang gebraucht werden. Daher wird es mitunter auch mit „bete ihn an“ übersetzt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְאָו
  choice: Und … wird … begehren
  rationale: Das Hitpael-Imperfekt der Wurzel אוה wird hier entsprechend der jüngsten textkritischen Abwägung als einfache Zukunftsaussage wiedergegeben. Die Form kann im poetischen Zusammenhang jedoch auch einen Wunsch oder eine Aufforderung ausdrücken; diese Möglichkeit bleibt in Fußnote [a] erhalten.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Die bestimmte Nominalform wird direkt und idiomatisch wiedergegeben.
- source_word: יָפְיֵךְ
  choice: deine Schönheit
  rationale: Die Form mit Suffix der 2. Person feminin Singular bezeichnet Schönheit beziehungsweise Anmut; „deine Schönheit“ ist direkt und natürlich.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt hier die Begründung an und passt mit „denn“ zum gehobenen poetischen Register.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Personalpronomen wird zur Wahrung der hebräischen Hervorhebung ausdrücklich wiedergegeben.
- source_word: אֲדֹנַיִךְ
  choice: dein Herr
  rationale: אָדוֹן mit femininem Singularsuffix bezeichnet hier den König als Herrn. „Herr“ bewahrt den relationalen und höfischen Titel, ohne das Wort als Gottesnamen zu behandeln.
- source_word: וְהִשְׁתַּחֲוִי
  choice: wirf dich … nieder
  rationale: Der feminine Singularimperativ von שׁחה bezeichnet das Sich-Niederwerfen beziehungsweise Verbeugen. Die Formulierung hält die körperliche Gebärde fest, ohne sie ausdrücklich als religiöse Anbetung festzulegen.
- source_word: לוֹ
  choice: vor ihm
  rationale: Die hebräische Verbindung wird im Deutschen bei „sich niederwerfen“ idiomatisch mit „vor ihm“ ausgedrückt.
theological_decisions:
- issue: Ob וְהִשְׁתַּחֲוִי לוֹ ausdrücklich religiös zu übersetzen ist
  choice: wirf dich vor ihm nieder
  alternative: erweise ihm Ehrerbietung; bete ihn an
  rationale: Der Psalm ist ein königliches Hochzeitslied, und das Verb kann sowohl die Huldigung eines menschlichen Höhergestellten als auch die Anbetung Gottes bezeichnen. Die Hauptübersetzung bewahrt die konkrete Gebärde und lässt die höfische oder religiöse Tragweite offen.
- issue: Ob וְיִתְאָו als Zukunftsaussage oder mit voluntativer Kraft zu verstehen ist
  choice: der König wird deine Schönheit begehren
  alternative: der König möge deine Schönheit begehren; lass den König deine Schönheit begehren
  rationale: Das Imperfekt lässt sich als Zukunftsaussage lesen; im Zusammenhang der vorausgehenden Aufforderungen ist aber auch eine wünschende oder auffordernde Nuance möglich. Die Hauptfassung folgt der schlichten Zukunftslesart und dokumentiert die Ambiguität in Fußnote [a].
translation_notes:
  register: Modernes Standarddeutsch in würdigem, poetischem Register. „Begehren“ wahrt die Intensität des hebräischen Verbs, ohne unnötige Ausschmückung. „Wirf dich vor ihm nieder“ ist gegenwärtig verständlich und bewahrt sowohl die konkrete Gebärde als auch die theologische Offenheit des Ausgangstextes.
