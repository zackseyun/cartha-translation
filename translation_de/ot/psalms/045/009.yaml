  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die wesentlichen Elemente des Hebräischen zutreffend wieder: Königstöchter, die schwierige Zuordnung von בְּיִקְּרוֹתֶיךָ, die rechts stehende königliche Gemahlin und das Gold aus Ofir. „Geschmückt mit“ legt die im Hebräischen nur angedeutete Ausstattung idiomatisch aus, ohne ein bestimmtes Schmuckstück oder Kleidungsstück hinzuzufügen.'
  naturalness: „Königstöchter sind unter deinen geehrten Frauen“ ist verständliches, würdiges Standarddeutsch und wahrt den höfisch-poetischen Ton. „Zu deiner Rechten steht die Königin“ ist besonders natürlich. Die Formulierung „geschmückt mit Gold aus Ofir“ ist im Deutschen flüssiger als eine wörtliche Wiedergabe mit „in Gold“.
  terminology: „Königstöchter“, „Königin“, „zu deiner Rechten“ und „Gold aus Ofir“ sind angemessen. Die Deutung von שֵׁגַל als „Königin“ bleibt neutral und überbestimmt ihre genaue institutionelle Rolle nicht. Die Fußnote bei a kennzeichnet die echte lexikalisch-syntaktische Schwierigkeit der hebräischen Wendung; die Anker stehen bei den jeweils erläuterten Ausdrücken.
