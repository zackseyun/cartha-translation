source:
  edition: WLC
  text: בְּנ֣וֹת מְ֭לָכִים בְּ/יִקְּרוֹתֶ֑י/ךָ נִצְּבָ֥ה שֵׁגַ֥ל לִֽ֝/ימִינְ/ךָ֗ בְּ/כֶ֣תֶם אוֹפִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/009.yaml
  text: Daughters of kings are among your honored women[b][a]; at your right hand stands the queen in gold of Ophir.
translation:
  language: de
  text: Königstöchter sind unter deinen geehrten Frauen[a]; zu deiner Rechten steht die Königin, geschmückt mit Gold aus Ofir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist schwierig; auch möglich: „unter deinen Kostbaren“ oder „unter deinen vornehmen Frauen“.'
    reason: lexical_alternative
  - marker: b
    text: Ofir war für sein kostbares Gold und seinen Reichtum bekannt.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנוֹת מְלָכִים
  choice: Königstöchter
  rationale: Gibt die hebräische Genitivverbindung knapp und bildhaft wieder; „Prinzessinnen“ wäre idiomatisch möglich, würde das konkrete Bild der Königstöchter aber verallgemeinern.
- source_word: בְּיִקְּרוֹתֶיךָ
  choice: unter deinen geehrten Frauen
  rationale: Die schwierige feminine Pluralform wird im Zusammenhang mit den anwesenden königlichen Frauen personenbezogen verstanden. „Geehrt“ wahrt sowohl den Gedanken des Ansehens als auch die Nähe zur Bedeutung „kostbar“.
- source_word: נִצְּבָה
  choice: steht
  rationale: Das Nifal beschreibt hier in einer poetischen Szene die eingenommene Stellung; das deutsche Präsens ist dafür natürlich und prägnant.
- source_word: שֵׁגַל
  choice: die Königin
  rationale: Das Wort bezeichnet die königliche Gemahlin. „Königin“ ist die verständlichste moderne Entsprechung, ohne die Rolle weiter auszudeuten.
- source_word: לִימִינְךָ
  choice: zu deiner Rechten
  rationale: Bewahrt die höfische Orts- und Ehrenvorstellung in einer geläufigen gehobenen deutschen Wendung.
- source_word: בְּכֶתֶם אוֹפִיר
  choice: geschmückt mit Gold aus Ofir
  rationale: כֶּתֶם bezeichnet feines Gold, Ofir dessen berühmte Herkunft. „Geschmückt“ macht die im hebräischen בְּ ausgedrückte Ausstattung im Deutschen natürlich verständlich, ohne ein bestimmtes Kleidungsstück anzunehmen.
