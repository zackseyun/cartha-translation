base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/006.yaml
  text: Your throne[a], O God, is forever and ever[b]; the scepter of your kingdom is a scepter of uprightness.
translation:
  language: de
  text: Dein Thron, o Gott, bleibt für immer und ewig[a]; das Zepter deines Reiches ist ein Zepter der Rechtschaffenheit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dein Thron ist Gott für immer und ewig“; oder: „Dein göttlicher Thron bleibt für immer und ewig.“ Der hebräische Satzbau ist umstritten; der Haupttext versteht „Gott“ als Anrede.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „Ein Zepter der Rechtschaffenheit ist das Zepter deines Reiches.“'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּסְאֲךָ
  choice: dein Thron
  rationale: כִּסֵּא bezeichnet hier im königlichen Kontext den Herrscherthron; „Thron“ ist die natürliche und präzise deutsche Entsprechung.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Als Vokativ gelesen ergibt sich die direkte Anrede „Dein Thron, Gott“. Diese syntaktisch naheliegende und früh bezeugte Lesart wahrt zugleich die theologische Spannung des Verses.
- source_word: עוֹלָם וָעֶד
  choice: für immer und ewig
  rationale: Die feste Wortverbindung drückt nachdrücklich unbegrenzte Dauer aus; die deutsche Wendung gibt diese Verstärkung natürlich und würdig wieder.
- source_word: שֵׁבֶט
  choice: Zepter
  rationale: Im königlichen Zusammenhang bezeichnet שֵׁבֶט nicht einen gewöhnlichen Stab, sondern das Zeichen der Herrschergewalt.
- source_word: מִישֹׁר
  choice: Rechtschaffenheit
  rationale: מִישֹׁר bezeichnet bildlich ethische Geradheit und Redlichkeit. „Rechtschaffenheit“ bewahrt diese moralische Bedeutung, ohne sie vorschnell auf Rechtsprechung zu verengen.
- source_word: שֵׁבֶט מַלְכוּתֶךָ
  choice: das Zepter deines Reiches
  rationale: Die Formulierung bildet die hebräische Genitivverbindung genau und in natürlichem Deutsch ab.
theological_decisions:
- issue: Syntaktische und theologische Funktion von אֱלֹהִים im ersten Halbvers
  choice: 'Vokativische Anrede: „Dein Thron, Gott, besteht für immer und ewig“'
  alternative: 'Prädikative Lesart: „Dein Thron ist Gott für immer und ewig“; qualitative Umschreibung: „Dein göttlicher Thron besteht für immer und ewig“'
  rationale: Der hebräische Satz ist syntaktisch umstritten. Die vokativische Lesart ist im Kontext direkter Anrede gut begründet und in der alten Rezeption prominent bezeugt; die ernsthaft vertretenen Alternativen werden jedoch in der Fußnote offengelegt.
- issue: Zuordnung von Subjekt und Prädikat im zweiten Halbvers
  choice: „Das Zepter deines Reiches ist ein Zepter der Rechtschaffenheit“
  alternative: „Ein Zepter der Rechtschaffenheit ist das Zepter deines Reiches“
  rationale: Die bestimmte Nominalgruppe שֵׁבֶט מַלְכוּתֶךָ wird als Subjekt aufgefasst. Die Umstellung gegenüber der hebräischen Wortfolge ergibt einen natürlichen deutschen Satz, ohne den Sinn zu verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Klang. „Besteht“ macht die elliptische hebräische Nominalkonstruktion verständlich. Die Formulierung bleibt nah an der Bildsprache und legt die umstrittene Syntax nicht über die notwendigen Entscheidungen hinaus fest.
