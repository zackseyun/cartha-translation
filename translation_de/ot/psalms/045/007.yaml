source:
  edition: WLC
  text: אָהַ֣בְתָּ צֶּדֶק֮ וַ/תִּשְׂנָ֫א רֶ֥שַׁע עַל כֵּ֤ן מְשָׁחֲ/ךָ֡ אֱלֹהִ֣ים אֱ֭לֹהֶי/ךָ שֶׁ֥מֶן שָׂשׂ֗וֹן מֵֽ/חֲבֵרֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/007.yaml
  text: You have loved righteousness and hated wickedness[a]; therefore God, your God[b], has anointed you with the oil of gladness beyond your companions.
translation:
  language: de
  text: Du hast Gerechtigkeit geliebt und Unrecht gehasst. Darum hat Gott[a], dein Gott, dich mit Freudenöl gesalbt, mehr als deine Gefährten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Darum hat dein Gott dich, o Gott, mit Freudenöl gesalbt, mehr als deine Gefährten.“ Das erste „Gott“ kann als Anrede statt als Subjekt des Verbs verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Dieser Vers wird in Hebräer 1,9 zitiert.
    reason: cross_reference
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Du hast … geliebt
  rationale: Das Qal-Perfekt in der direkten Anrede wird mit dem deutschen Perfekt wiedergegeben; es beschreibt die bewährte Haltung des Angeredeten.
- source_word: צֶּדֶק
  choice: Gerechtigkeit
  rationale: Der Ausdruck umfasst das Rechte und Gerechte; „Gerechtigkeit“ bewahrt hier das ethische und theologische Gewicht.
- source_word: וַתִּשְׂנָא
  choice: und … gehasst
  rationale: Die zweite Verbform führt die direkte Anrede fort und bildet den deutlichen Gegensatz zu „geliebt“.
- source_word: רֶשַׁע
  choice: Bosheit
  rationale: „Bosheit“ bezeichnet moralisch verwerfliches Handeln und steht im Deutschen prägnant der Gerechtigkeit gegenüber.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die geläufige deutsche Folgerungsangabe bringt den Zusammenhang zwischen der Haltung des Angeredeten und seiner Salbung klar zum Ausdruck.
- source_word: מְשָׁחֲךָ
  choice: hat … dich … gesalbt
  rationale: Die Wiedergabe erhält sowohl die Perfektform als auch den königlichen beziehungsweise weihenden Sinn von משׁח.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im Haupttext wird das erste אֱלֹהִים als Subjekt des Verbs verstanden. Die ebenfalls mögliche vokativische Lesart wird in einer Fußnote bewahrt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Die Form mit Suffix der zweiten Person Singular wird unmittelbar und appositionell wiedergegeben.
- source_word: שֶׁמֶן שָׂשׂוֹן
  choice: Freudenöl
  rationale: Das deutsche Kompositum gibt die hebräische Genitivverbindung knapp und poetisch wieder und bezeichnet Öl, das mit Freude und Fest verbunden ist.
- source_word: מֵחֲבֵרֶיךָ
  choice: mehr als deine Gefährten
  rationale: Die Präposition מִן drückt hier einen Vergleich aus; „Gefährten“ bezeichnet die mit dem Angeredeten verbundenen Personen, ohne ihre genaue Stellung enger festzulegen.
theological_decisions:
- issue: Syntaktische Funktion des ersten אֱלֹהִים
  choice: 'Das erste אֱלֹהִים wird als Subjekt gelesen: „Gott, dein Gott, hat dich … gesalbt“.'
  alternative: 'Es kann als Anrede verstanden werden: „Darum hat dich, o Gott, dein Gott … gesalbt“.'
  rationale: Beide Deutungen sind syntaktisch möglich. Der Haupttext folgt der im einzelnen Satz flüssigeren Subjektlesart; die theologisch bedeutsame vokativische Lesart wird ausdrücklich in der Fußnote erhalten.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem poetischem Ton. „Freudenöl“ erhält die knappe Bildsprache des Hebräischen; die umstrittene Syntax wird nicht vereinheitlicht, sondern durch die Fußnote offengehalten.
