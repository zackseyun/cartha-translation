  terminology: „Gerechtigkeit“, „gesalbt“, „Freudenöl“ und „Gefährten“ sind sachgerecht. „Unrecht“ trifft רֶשַׁע im Gegensatz zu „Gerechtigkeit“ in modernem Standarddeutsch umfassender und natürlicher als „Bosheit“.
