  text: לִ/רְקָמוֹת֮ תּוּבַ֪ל לַ֫/מֶּ֥לֶךְ בְּתוּל֣וֹת אַ֭חֲרֶי/הָ רֵעוֹתֶ֑י/הָ מ֖וּבָא֣וֹת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/014.yaml
  text: In embroidered garments she is led to the king[a]; virgins behind her, her companions[c][b], are brought to you.
translation:
  language: de
  text: In bestickten Gewändern wird sie zum König geführt[a]; Jungfrauen folgen ihr – ihre Gefährtinnen – und werden zu dir gebracht.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »In Stickereien wird sie zum König gebracht.«'
    reason: lexical_alternative
  - marker: b
    text: »Jungfrauen« kann auch mit »Mädchen« oder »junge Frauen« wiedergegeben werden; das hebräische Wort bezeichnet jedoch spezifischer unverheiratete Jungfrauen.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische »dir« ist feminin und richtet sich offenbar unmittelbar an die Braut. Manche Übersetzungen glätten den Wechsel der Anrede und beziehen die Aussage stattdessen auf den König.
    reason: alternative_reading
lexical_decisions:
- source_word: לִרְקָמוֹת
  choice: In bestickten Gewändern
  rationale: רְקָמוֹת bezeichnet Stickerei beziehungsweise kunstvoll gemustertes Textil. »Gewändern« wird aus dem Zusammenhang des Hochzeitszuges ergänzt; die Präposition ל wird hier beschreibend verstanden.
- source_word: תּוּבַל
  choice: wird sie … geführt
  rationale: Das Hophal von יבל bezeichnet passives Geführt- oder Gebrachtwerden. Im feierlichen Hochzeitszug ist »geführt« natürlich und wahrt die Passivform.
- source_word: לַמֶּלֶךְ
  choice: zum König
  rationale: ל bezeichnet hier am naheliegendsten die Bewegung auf den König zu.
- source_word: בְּתוּלוֹת
  choice: Jungfrauen
  rationale: בְּתוּלוֹת bezeichnet spezifisch unverheiratete Jungfrauen; im Kontext sind damit wohl die Begleiterinnen der Braut gemeint.
- source_word: אַחֲרֶיהָ
  choice: folgen ihr
  rationale: Die räumlich beziehungsweise zeitlich nachgeordnete Stellung im Zug wird im Deutschen idiomatisch mit »folgen ihr« ausgedrückt.
- source_word: רֵעוֹתֶיהָ
  choice: ihre Gefährtinnen
  rationale: Das Wort bezeichnet weibliche Gefährtinnen oder Freundinnen, ohne ihre zeremonielle Funktion näher festzulegen.
- source_word: מוּבָאוֹת
  choice: werden … gebracht
  rationale: Das feminine pluralische Hophal-Partizip von בוא bezieht sich auf die Jungfrauen beziehungsweise Gefährtinnen und drückt passives Herbeibringen aus.
- source_word: לָךְ
  choice: zu dir
  rationale: Der masoretische Text hat eindeutig eine feminine Singularform der zweiten Person. »Zu dir« bewahrt den unvermittelten Wechsel zur direkten Anrede der Braut.
theological_decisions:
- issue: Wechsel der angeredeten Person bei לָךְ
  choice: Die feminine Anrede wird als »zu dir« beibehalten.
  alternative: Den Bezug glätten und »zu ihm«, »zum König« oder »mit ihr« übersetzen.
  rationale: Der masoretische Text richtet sich am Versende in der zweiten Person Singular feminin offenbar direkt an die Braut. Die Übersetzung bewahrt diesen poetischen Spannungs- und Perspektivwechsel, statt ihn stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung lässt den Hochzeitszug anschaulich werden; der auffällige Wechsel von der Beschreibung der Braut zur direkten femininen Anrede bleibt erhalten. Alle Fußnotenmarker stehen an den jeweils erläuterten Textstellen.
