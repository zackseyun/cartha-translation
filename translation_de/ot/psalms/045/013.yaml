lexical_decisions:
- source_word: כָּל כְּבוּדָּה
  choice: Ganz herrlich
  rationale: כָּל wird hier verstärkend zu כְּבוּדָּה verstanden. „Ganz herrlich“ gibt die umfassende Pracht natürlich und würdevoll wieder.
- source_word: בַת מֶלֶךְ
  choice: die Königstochter
  rationale: Die wörtliche hebräische Wendung bleibt erhalten und passt zum höfischen Kontext; „Prinzessin“ wäre möglich, aber weniger quellennah.
- source_word: פְּנִימָה
  choice: im Innern
  rationale: Die Form bezeichnet den Innenraum beziehungsweise das Drinnen. Die Wiedergabe lässt offen, ob ein Palast- oder Gemachinneres gemeint ist; eine Deutung als innere Schönheit ist grammatisch möglich, aber nicht eindeutig.
- source_word: מִמִּשְׁבְּצוֹת זָהָב
  choice: mit Gold durchwirkt
  rationale: מִשְׁבְּצוֹת bezeichnet kunstvoll gearbeitete Einfassungen, Flecht- oder Musterarbeit. Im Zusammenhang mit Kleidung ist „mit Gold durchwirkt“ eine natürliche, bildkräftige Wiedergabe, ohne die genaue Herstellungstechnik festzulegen.
- source_word: לְבוּשָׁהּ
  choice: ihr Gewand
  rationale: לְבוּשׁ kann Kleidung oder ein Kleidungsstück bezeichnen. „Gewand“ entspricht dem festlichen, königlichen Register des Psalms.
