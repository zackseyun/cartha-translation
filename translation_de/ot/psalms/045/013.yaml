  footnotes:
  - marker: a
    text: 'Oder: „Die Königstochter ist im Innern voller Pracht.“ „Im Innern“ kann sowohl auf innere Pracht als auch darauf weisen, dass sie sich im Inneren des Palasts oder Gemachs befindet.'
