  terminology: „Jahwe“ gibt יהוה als Eigenname konsistent wieder. „Anrufen“ bleibt gegenüber engeren Deutungen wie bloßem Beten oder Verehren sinnvoll offen. Die Wortwahl „Übeltäter“ und „verzehren“ hat ein angemessenes poetisch-moralisches Register.
