id: PSA.14.4
reference: Psalms 14:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲ/לֹ֥א יָדְעוּ֮ כָּל פֹּ֪עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּ/י אָ֣כְלוּ לֶ֑חֶם יְ֝הוָ֗ה לֹ֣א קָרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/004.yaml
  text: Do not all the workers of wickedness know—those who eat up my people as they eat bread[a], and do not call on Yahweh?
translation:
  language: de
  text: Begreifen denn all die Übeltäter nichts — sie, die mein Volk verzehren, wie man Brot isst[a], und Jahwe nicht anrufen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die mein Volk essen; sie essen Brot“. Die knappe Gegenüberstellung vergleicht das Verzehren des Volkes mit gewöhnlichem Brotessen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא יָדְעוּ
  choice: Begreifen denn ... nichts?
  rationale: Die rhetorische Frage erwartet, dass die Täter erkennen müssten, was sie tun. Die im Hebräischen formal mögliche Fassung „Wissen denn nicht ...?“ wäre im Deutschen unnatürlich; „Begreifen ... nichts?“ gibt die vorwurfsvolle Erkenntnisfrage idiomatisch wieder, ohne sie zeitlich festzulegen.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: all die Übeltäter
  rationale: Die kompakte deutsche Personenbezeichnung gibt das partizipiale „alle, die Unheil/Frevel wirken“ natürlich und mit angemessenem moralischem Gewicht wieder.
- source_word: אֹכְלֵי עַמִּי
  choice: sie, die mein Volk verzehren
  rationale: „Verzehren“ bewahrt die drastische Essensmetapher und bezeichnet hier bildhaft die rücksichtslose Ausbeutung oder Vernichtung des Volkes.
- source_word: אָכְלוּ לֶחֶם
  choice: wie man Brot isst
  rationale: Das Hebräische stellt „mein Volk essen“ und „Brot essen“ knapp nebeneinander. Das ergänzte „wie man“ macht den naheliegenden Vergleich in natürlichem Deutsch sichtbar; die wörtliche Form bleibt in der Fußnote dokumentiert.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֹא קָרָאוּ
  choice: nicht anrufen
  rationale: קרא mit dem Gottesnamen bezeichnet hier das Anrufen Gottes, besonders in Gebet und Gottesverehrung. Der Infinitiv hängt parallel von der rhetorischen Charakterisierung ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ erhält den Charakter als Eigenname, ohne ihn durch einen traditionellen Ersatztitel zu verdecken.
- issue: Bedeutung von „Jahwe nicht anrufen“
  choice: wörtlich-offen als „Jahwe nicht anrufen“
  alternative: „nicht zu Jahwe beten“ oder „Jahwe nicht verehren“
  rationale: „Anrufen“ kann Gebet, Hilferuf und kultische Hinwendung umfassen. Die offenere Formulierung bewahrt diesen Bedeutungsumfang und legt keine einzelne religiöse Handlung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich markiert die erläuternde Charakterisierung der Übeltäter. Die starke Metapher „mein Volk verzehren“ bleibt erhalten; die im Deutschen nötige Vergleichsformulierung wird durch eine Fußnote transparent gemacht.
