  text: הַ/כֹּ֥ל סָר֮ יַחְדָּ֪ו נֶ֫אֱלָ֥חוּ אֵ֤ין עֹֽשֵׂה ט֑וֹב אֵ֝֗ין גַּם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/003.yaml
  text: All have turned aside; together they have become corrupt. There is none who does good[a], not even one.
translation:
  language: de
  text: Alle sind abgewichen; allesamt sind sie verdorben. Keiner tut Gutes, auch nicht einer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכֹּל
  choice: Alle
  rationale: Der Ausdruck bezeichnet umfassend die Gesamtheit der hier betrachteten Menschen. „Alle“ ist knapp, natürlich und bewahrt den universalen Umfang.
- source_word: סָר
  choice: sind abgewichen
  rationale: סור bedeutet „abweichen, sich abwenden“. Trotz der morphologischen Einzahl verlangt das kollektive Subjekt im Deutschen idiomatisch den Plural. „Abgewichen“ wahrt die Aussage, ohne die zusätzliche Bildlichkeit von „in die Irre gegangen“ einzutragen.
- source_word: יַחְדָּו
  choice: gemeinsam
  rationale: Das Adverb hebt das gemeinsame, die Gesamtheit umfassende Handeln beziehungsweise den gemeinsamen Zustand hervor. „Gemeinsam“ ist im Satz natürlich und semantisch zurückhaltend.
- source_word: נֶאֱלָחוּ
  choice: sind verdorben
  rationale: Die Nifal-Form beschreibt das Verdorben- beziehungsweise Unbrauchbarwerden. „Sind verdorben“ gibt den resultierenden Zustand idiomatisch wieder; „unrein“ oder „abscheulich“ wäre enger beziehungsweise stärker wertend.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Da ist keiner, der Gutes tut
  rationale: אֵין drückt nachdrückliches Nichtvorhandensein aus, während das Partizip עֹשֵׂה charakteristisches Tun bezeichnet. Die deutsche Relativkonstruktion ist klar und bewahrt die Aussage.
- source_word: אֵין גַּם אֶחָד
  choice: auch nicht einer
  rationale: גַּם אֶחָד verstärkt im Wirkungsbereich der Negation deren umfassende Geltung. „Auch nicht einer“ erhält die emphatische Wiederholung und entspricht dem würdevollen Psalmregister.
theological_decisions:
- issue: Umfang der universalen Aussage über menschliche Verderbtheit
  choice: 'Die Aussage wird uneingeschränkt universal wiedergegeben: „Alle“, „keiner“, „auch nicht einer“.'
  alternative: Die Aussage als bloße Verallgemeinerung über viele Menschen abschwächen.
  rationale: Der hebräische Text häuft umfassende und verneinende Ausdrücke. Die Übersetzung bewahrt diese rhetorische und theologische Spannung, ohne sie durch spätere Lehrsysteme näher zu bestimmen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit knapper, würdevoller Psalmsprache. Die parallele und steigernde Struktur des hebräischen Verses bleibt erhalten.
