source:
  edition: WLC
  text: יְֽהוָ֗ה מִ/שָּׁמַיִם֮ הִשְׁקִ֪יף עַֽל בְּנֵי אָ֫דָ֥ם לִ֭/רְאוֹת הֲ/יֵ֣שׁ מַשְׂכִּ֑יל דֹּ֝רֵשׁ אֶת אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/002.yaml
  text: Yahweh looks down from heaven on the children of man to see whether there is one who has insight[a], one who seeks God.
translation:
  language: de
  text: Jahwe blickt vom Himmel auf die Menschen herab, um zu sehen, ob es einen gibt, der Einsicht hat und Gott sucht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: מִשָּׁמַיִם
  choice: vom Himmel
  rationale: Der morphologische Plural bezeichnet hier idiomatisch den Himmel als Gottes erhöhten Standort; der deutsche Singular ist natürlich.
- source_word: הִשְׁקִיף
  choice: blickt … herab
  rationale: Das Verb bezeichnet den Blick von einem erhöhten Standort hinunter; das Präsens wahrt die lebendige poetische Darstellung.
- source_word: בְּנֵי אָדָם
  choice: die Menschen
  rationale: Wörtlich „Söhne des Menschen/Adams“; die feste hebräische Wendung bezeichnet hier die Menschen insgesamt. Im Deutschen gibt „die Menschen“ den generischen Sinn klar und natürlich wieder.
- source_word: לִרְאוֹת הֲיֵשׁ
  choice: um zu sehen, ob es einen gibt
  rationale: Gibt den Zweckinfinitiv und die anschließende Fragepartikel in natürlicher deutscher Syntax wieder.
- source_word: מַשְׂכִּיל
  choice: der Einsicht hat
  rationale: Bewahrt den Sinn von שכל als verständiges, einsichtiges Erkennen, ohne ihn vorschnell auf allgemeine Weisheit zu verengen.
- source_word: דֹּרֵשׁ אֶת אֱלֹהִים
  choice: der nach Gott fragt
  rationale: דרש kann ernsthaftes Suchen, Sich-Erkundigen und Fragen nach Gott bezeichnen. „Nach Gott fragen“ ist idiomatisch und lässt diese Bedeutungsbreite offen.
theological_decisions:
- issue: Generischer Sinn von בְּנֵי אָדָם
  choice: die Menschen
  alternative: die Menschensöhne
  rationale: Die hebräische maskuline Pluralwendung meint die Menschheit allgemein. Die idiomatische deutsche Wiedergabe vermeidet die missverständliche Vorstellung einer besonderen männlichen Teilgruppe, ohne den Umfang des Ausdrucks einzuschränken.
- issue: Bedeutung von דֹּרֵשׁ in der Gottesbeziehung
  choice: der nach Gott fragt
  alternative: der Gott sucht
  rationale: Beide Wiedergaben sind möglich. „Nach Gott fragen“ bewahrt neben dem Suchen auch den Aspekt ernsthaften Erkundigens und legt keine engere konfessionelle Deutung fest.
translation_notes:
  register: Moderne, würdige Psalmsprache mit klarer Satzführung. Die Wiederholung „einen, der …“ bildet den hebräischen Parallelismus ab; keine Fußnote ist für das Verständnis zwingend erforderlich.
