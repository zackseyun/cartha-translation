  variant: modern standard German
source:
  edition: WLC
  text: עֲצַת עָנִ֥י תָבִ֑ישׁוּ כִּ֖י יְהוָ֣ה מַחְסֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/006.yaml
  text: You shame the counsel of the poor[a], because Yahweh is his refuge.
translation:
  language: de
  text: Den Rat des Armen macht ihr zuschanden[a], denn Jahwe ist seine Zuflucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Den Plan des Armen macht ihr zuschanden.“ Das hebräische עֲצַת עָנִי kann den Rat, Plan oder das Vorhaben des Armen bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: עֲצַת
  choice: den Rat des
  rationale: Die Konstruktform von עֵצָה kann Rat, Plan oder Vorhaben bezeichnen. „Rat“ bewahrt die Bedeutungsbreite, ohne ein bloß inneres Vorhaben oder ausdrücklich erteilten Ratschlag festzulegen.
- source_word: עָנִי
  choice: des Armen
  rationale: עָנִי bezeichnet einen armen, bedrängten oder gesellschaftlich schwachen Menschen. „Der Arme“ ist im Deutschen knapp und verständlich und lässt die mitgemeinte Bedrängnis offen.
- source_word: תָבִישׁוּ
  choice: macht ihr zuschanden
  rationale: Die Hifil-Form in der 2. Person Plural bedeutet, Schande herbeizuführen oder jemanden beziehungsweise etwas zuschanden zu machen. Die Wortstellung erhält die hervorgehobene Voranstellung des Objekts.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier eine Begründung ein. „Denn“ gibt den kausalen Zusammenhang natürlich und würdevoll wieder, ohne ihn weiter auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. „Jahwe“ ist die im Deutschen gebräuchliche wissenschaftliche Umschrift und gibt den Namen statt eines ersetzenden Titels wieder.
- source_word: מַחְסֵהוּ
  choice: seine Zuflucht
  rationale: מַחְסֶה bezeichnet einen Zufluchts- oder Schutzort; das Suffix der 3. Person Singular bezieht sich auf den Armen. „Seine Zuflucht“ bewahrt das Schutzbild knapp und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Da im Ausgangstext der Eigenname יהוה steht, wird er als „Jahwe“ wiedergegeben. Die traditionelle Ersatzlesung „der HERR“ ist möglich, würde jedoch den Namen durch einen Titel ersetzen.
- issue: Bezug der Begründung mit כִּי
  choice: Die Begründung bleibt formal an den ganzen vorangehenden Vorwurf angeschlossen.
  alternative: Die Aussage ausdrücklich als Grund dafür deuten, dass der Plan des Armen nicht scheitern kann.
  rationale: Der hebräische Satz nennt Jahwe als Zuflucht des Armen, legt aber nicht ausdrücklich fest, welche gedankliche Ergänzung zwischen dem Beschämen und dieser Begründung anzunehmen ist. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Verbindung, einen „Rat“ zuschanden zu machen, bleibt bewusst erhalten, weil sie die Bedeutungsbreite des Hebräischen besser wahrt; die natürlichere Deutung „Plan“ steht in der Fußnote.
