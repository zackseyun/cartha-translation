  source_fidelity: 'Der Entwurf gibt die hebräische Syntax und Semantik zuverlässig wieder: עֲצַת עָנִי als „den Rat des Armen“, die Hifilform תָבִישׁוּ mit zweiter Person Plural als „macht ihr zuschanden“, die kausale Partikel כִּי als „denn“ und מַחְסֵהוּ als „seine Zuflucht“. Der singuläre Bezug des Suffixes bleibt erhalten. Die im Hebräischen nicht näher explizierte gedankliche Beziehung der Begründung wird nicht interpretativ ausgeweitet.'
  naturalness: „Den Rat des Armen macht ihr zuschanden“ ist verständliches, modernes und würdiges Standarddeutsch. Zwar ist die Verbindung mit „Rat“ etwas weniger alltäglich als „Plan“, doch sie ist grammatisch und stilistisch tragfähig und bewahrt die offene Bedeutung von עֵצָה. Die vorangestellte Objektphrase ist im poetischen Kontext natürlich.
