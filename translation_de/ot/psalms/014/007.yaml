- from: Ach, käme doch vom Zion Israels Rettung! Wenn Jahwe das Geschick seines Volkes wiederherstellt[a], wird Jakob jubeln und Israel sich freuen.
  to: Ach, käme doch Israels Rettung aus Zion! Wenn Jahwe das Geschick seines Volkes wendet[a], wird Jakob jubeln und Israel sich freuen.
  rationale: Die Revision glättet die deutsche Wortstellung, ersetzt eine weniger treffende Kollokation durch die idiomatische Wendung »das Geschick ... wenden« und passt die Fußnote an den abstrakten Charakter der hebräischen Alternativdeutung an. Bedeutung, poetischer Registerton und die offene Reichweite der Formel bleiben erhalten.
