source:
  edition: WLC
  text: מִ֥י יִתֵּ֣ן מִ/צִּיּוֹן֮ יְשׁוּעַ֪ת יִשְׂרָ֫אֵ֥ל בְּ/שׁ֣וּב יְ֭הוָה שְׁב֣וּת עַמּ֑/וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָֽאֵל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/007.yaml
  text: Oh[a], that Israel’s salvation would come from Zion! When Yahweh restores the fortunes of his people, Jacob will rejoice; Israel will be glad.
translation:
  language: de
  text: Ach, käme doch Israels Rettung aus Zion! Wenn Jahwe das Geschick seines Volkes wendet[a], wird Jakob jubeln und Israel sich freuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Gefangenschaft seines Volkes wendet«. Die hebräische Wendung kann sowohl die Wende einer Gefangenschaft als auch allgemeiner die Wiederherstellung einer bedrängten Lage bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Ach, käme doch
  rationale: Die hebräische Wendung drückt einen sehnsüchtigen Wunsch aus, keine wörtliche Frage. Die deutsche Optativform mit »doch« gibt dies natürlich und würdig wieder.
- source_word: מִצִּיּוֹן
  choice: vom Zion
  rationale: Die Präposition מִן bezeichnet hier Herkunft oder Ausgangspunkt; »vom Zion« ist im Deutschen die geläufige Form.
- source_word: יְשׁוּעַת יִשְׂרָאֵל
  choice: Israels Rettung
  rationale: Die Status-constructus-Verbindung bezeichnet Israels Rettung bzw. Heil. »Rettung« bewahrt hier sowohl den konkreten Befreiungsaspekt als auch die weiterreichende theologische Bedeutung.
- source_word: בְּשׁוּב יְהוָה שְׁבוּת עַמּוֹ
  choice: Wenn Jahwe das Geschick seines Volkes wiederherstellt
  rationale: Die Verbindung שׁוּב שְׁבוּת ist eine idiomatische Aussage über die Wiederherstellung einer bedrängten Lage. »Das Geschick … wiederherstellen« ist im modernen Deutsch verständlich und bleibt umfassender als eine ausschließliche Bezugnahme auf Gefangenschaft.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יָגֵל יַעֲקֹב
  choice: wird Jakob jubeln
  rationale: גיל bezeichnet ausgelassene, frohlockende Freude; »jubeln« gibt die Intensität wieder. Jakob steht poetisch für das Volk.
- source_word: יִשְׂמַח יִשְׂרָאֵל
  choice: Israel sich freuen
  rationale: שׂמח wird mit »sich freuen« wiedergegeben und dadurch vom stärkeren »jubeln« im parallelen Satzglied unterschieden.
theological_decisions:
- issue: Bedeutung der Wendung שׁוּב שְׁבוּת
  choice: das Geschick seines Volkes wiederherstellt
  alternative: die Gefangenen seines Volkes zurückbringt / die Gefangenschaft seines Volkes wendet
  rationale: Die hebräische Wendung kann eine Rückkehr aus Gefangenschaft bezeichnen, wird aber auch allgemeiner für die Wiederherstellung einer bedrängten Lage gebraucht. Da der Psalm keinen bestimmten historischen Exilrahmen nennt, steht die umfassendere idiomatische Wiedergabe im Haupttext; die engere Möglichkeit bleibt in der Fußnote erhalten.
translation_notes:
  register: Moderne, gehobene und zugleich gut verständliche Psalmsprache. Der Wunschcharakter des Anfangs wird durch »Ach, käme doch« bewahrt; die parallelen Freudenverben werden mit »jubeln« und »sich freuen« differenziert.
