  text: שָׁ֤ם פָּ֣חֲדוּ פָ֑חַד כִּֽי אֱ֝לֹהִ֗ים בְּ/ד֣וֹר צַדִּֽיק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/005.yaml
  text: There they were in great dread[b][a], for God is with the generation of the righteous.
translation:
  language: de
  text: Dort ergriff sie große Furcht,[a] denn Gott ist bei der Generation der Gerechten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dort fürchteten sie eine Furcht“; die Verbindung von Verb und stammverwandtem Substantiv verstärkt die Aussage.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn Gott ist in der Generation der Gerechten“ bzw. „mitten unter der Generation der Gerechten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Dort
  rationale: Bewahrt die knappe örtliche beziehungsweise szenische Verweisung des Hebräischen, ohne sie deutend auszuweiten.
- source_word: פָּחֲדוּ פָחַד
  choice: packte sie große Furcht
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv ist eine emphatische Wendung. Die deutsche Formulierung gibt die Intensität natürlich und bildkräftig wieder.
- source_word: כִּי
  choice: denn
  rationale: Leitet hier den Grund für die Furcht ein und entspricht dem gehobenen poetischen Ton.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch plurale Form bezeichnet in diesem Zusammenhang Israels Gott und wird regulär im Singular wiedergegeben.
- source_word: בְּדוֹר
  choice: beim Geschlecht
  rationale: Die Präposition בְּ kann Gegenwart bei, in oder unter einer Gruppe ausdrücken. „Beim“ bewahrt diese räumlich-relationale Offenheit und klingt im Deutschen natürlich.
- source_word: צַדִּיק
  choice: des Gerechten
  rationale: Das singularische Adjektiv steht in Verbindung mit דּוֹר und kann den Gerechten als kollektive Größe bezeichnen. Die formal nahe Wiedergabe erhält zugleich die mögliche Spannung zwischen kollektivem und singularischem Verständnis.
theological_decisions:
- issue: Gottes Verhältnis zum Gerechten beziehungsweise zum Geschlecht der Gerechten in בְּדוֹר צַדִּיק
  choice: Gott ist beim Geschlecht des Gerechten
  alternative: Gott ist mitten unter dem gerechten Geschlecht / Gott ist beim Geschlecht der Gerechten
  rationale: „Beim“ bezeichnet Gottes Gegenwart und Nähe, ohne die Präposition einseitig als Parteinahme oder bloße räumliche Einordnung festzulegen. „Des Gerechten“ folgt der singularischen Form, kann im Deutschen aber kollektiv verstanden werden.
translation_notes:
  register: Moderne, würdige Psalmsprache mit knapper Satzführung. „Geschlecht“ wird in seinem biblisch-poetischen Sinn von Generation beziehungsweise Menschengruppe gebraucht; die Fußnote wahrt die Mehrdeutigkeit von Präposition und Singularform.
