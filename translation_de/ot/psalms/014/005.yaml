  - severity: low
    issue: „Geschlecht“ ist im modernen Standarddeutsch mehrdeutig.
    rationale: Es kann Abstammungslinie oder biologisches Geschlecht bedeuten. „Generation“ gibt דוֹר klar und modern wieder, ohne den poetischen Charakter wesentlich zu verlieren.
