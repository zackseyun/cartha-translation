  source_fidelity: 'Die Grundstruktur wird richtig wiedergegeben: שָׁם als szenisches „Dort“, die intensive Konstruktion פָּחֲדוּ פָחַד, die kausale Verbindung כִּי und Gottes Gegenwart in/bei der Gruppe der Gerechten. Das deutsche Singularverständnis „des Gerechten“ ist jedoch ohne weitere Kontextmarkierung zu eng. צַדִּיק ist hier mit דוֹר am besten kollektiv bzw. generisch zu verstehen.'
  naturalness: „Dort packte sie große Furcht“ ist verständlich und poetisch, aber „Dort ergriff sie große Furcht“ ist im Deutschen etwas idiomatischer. „Generation der Gerechten“ ist modern verständlich und vermeidet die heute leicht missverständliche Bedeutung von „Geschlecht“.
  terminology: „Gott“ und „die Gerechten“ sind angemessen. Die kollektive Wiedergabe „der Gerechten“ entspricht dem Kontext und dem üblichen Gebrauch von צַדִּיק in dieser Verbindung, ohne eine einzelne gerechte Person als spezifischen Referenten festzulegen.
