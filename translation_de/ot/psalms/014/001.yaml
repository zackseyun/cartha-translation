base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/001.yaml
  text: For the choir director[a]. Of David. The fool says in his heart, “There is no God.” They are corrupt; they do abominable deeds[c][b]. There is no one who does good.
translation:
  language: de
  text: 'Für den Chorleiter.[a] Von David.[b]


    Der Tor sagt in seinem Herzen: »Es gibt keinen Gott.« Sie sind verdorben, sie begehen abscheuliche Taten.[c] Keiner tut Gutes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Für den Musikleiter«; traditionell auch: »Für den Chormeister«.'
    reason: lexical_alternative
  - marker: b
    text: »Von David« kann in der Psalmüberschrift auch »David zugehörig« oder »für David« bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Das Hebräische wechselt von der Einzahl (»der Tor«) zur Mehrzahl (»sie«): Der Einzelne steht stellvertretend für die Gruppe, die er verkörpert.'
    reason: source_structure
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Die Überschrift weist das Lied dem Leiter der musikalischen Ausführung zu. »Chorleiter« ist im heutigen Deutsch klar, ohne die genaue historische Funktion übermäßig festzulegen.
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Präposition ל kann in Psalmüberschriften Urheberschaft, Zugehörigkeit oder Widmung ausdrücken. »Von David« ist geläufig; eine Fußnote hält die weitere Bedeutungsbreite offen.
- source_word: נָבָל
  choice: der Tor
  rationale: Das Wort bezeichnet nicht bloß mangelnde Intelligenz, sondern moralische und geistliche Verblendung. »Der Tor« bewahrt die repräsentative Einzahl und den biblisch-würdigen Ton.
- source_word: בְּלִבּוֹ
  choice: in seinem Herzen
  rationale: Im Hebräischen umfasst das Herz Denken, Wollen und inneres Entscheiden. Die wörtliche Formulierung ist auch im Deutschen verständlich.
- source_word: אֵין אֱלֹהִים
  choice: Es gibt keinen Gott
  rationale: Die Wendung spricht am unmittelbarsten die Existenz Gottes ab. Diese Übersetzung bewahrt die ausdrückliche Aussage, statt sie als bloße Gleichgültigkeit gegenüber Gott zu deuten.
- source_word: הִשְׁחִיתוּ
  choice: Sie sind verdorben
  rationale: Das Verb bezeichnet Verderben beziehungsweise einen verdorbenen Zustand. Die deutsche Zustandsform gibt die moralische Bewertung natürlich wieder.
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: sie handeln abscheulich
  rationale: Verb und Substantiv beschreiben verabscheuungswürdiges Tun. Die Formulierung ist idiomatisch und eng am Sinn, ohne ein im Hebräischen nicht ausdrücklich genanntes Objekt einzuführen.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Keiner tut Gutes
  rationale: Die knappe deutsche Aussage entspricht der hebräischen Feststellung, dass niemand Gutes tut.
theological_decisions:
- issue: Reichweite der Aussage אֵין אֱלֹהִים
  choice: »Es gibt keinen Gott.« als ausdrückliche Leugnung der Existenz Gottes
  alternative: Praktischer Atheismus im Sinn von »Gott spielt keine Rolle« oder »Es gibt kein Gericht«
  rationale: Der hebräische Wortlaut formuliert unmittelbar »kein Gott«. Die praktische Gottlosigkeit gehört zum Kontext, soll aber nicht an die Stelle der ausdrücklichen Aussage gesetzt werden.
- issue: Wechsel vom Singular נָבָל zu den Pluralformen הִשְׁחִיתוּ und הִתְעִיבוּ
  choice: 'Den Wechsel bewahren: »Der Tor … Sie sind verdorben«'
  alternative: 'Den Numerus angleichen: »Er ist verdorben« oder »Toren sagen«'
  rationale: Der Singular zeichnet einen repräsentativen Menschen; der anschließende Plural beschreibt die von ihm vertretene Gruppe. Der auffällige Wechsel ist echt und wird nicht geglättet.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die Psalmüberschrift bleibt knapp. »Tor« ist bewusst traditioneller als »Narr«, weil es die moralisch-geistliche Kategorie ausdrückt. Der Numeruswechsel des Hebräischen wird trotz seiner Auffälligkeit bewahrt.
