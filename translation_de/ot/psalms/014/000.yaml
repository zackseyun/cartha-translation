base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/000.yaml
  text: 'For the choir director[a]. Of David.


    The fool says in his heart, “There is no God.”

    They are corrupt; they do abominable deeds[c][b].

    There is none who does good.'
translation:
  language: de
  text: 'Für den Chorleiter.[a] Von David.[b]


    Der Tor sagt in seinem Herzen: »Es gibt keinen Gott.«


    Sie sind verdorben, sie tun abscheuliche Taten.[c]


    Keiner tut Gutes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Für den Musikleiter« beziehungsweise »Für den Vorsänger«.'
    reason: lexical_alternative
  - marker: b
    text: »Von David« kann in der Psalmüberschrift auch »für David« oder »David betreffend« bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Das Hebräische wechselt vom Singular (»der Tor«) zum Plural (»sie sind verdorben«): Von der repräsentativen Einzelfigur geht der Text zu der Gruppe über, für die sie steht.'
    reason: textual_feature
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Die traditionelle und kontextuell plausible Wiedergabe bezeichnet vermutlich den musikalischen Leiter; die genaue Amtsbezeichnung bleibt unsicher und wird in der Fußnote berücksichtigt.
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Präposition לְ in Psalmüberschriften kann Autorschaft, Zugehörigkeit oder Widmung ausdrücken. »Von David« ist eine natürliche traditionelle Wiedergabe, ohne die Alternativen zu verschweigen.
- source_word: נָבָל
  choice: Tor
  rationale: Das Wort bezeichnet hier nicht bloß mangelnde Intelligenz, sondern einen sittlich und religiös uneinsichtigen Menschen. »Tor« bewahrt diesen würdevollen biblischen Sinn.
- source_word: בְּלִבּוֹ
  choice: in seinem Herzen
  rationale: Im Hebräischen ist das Herz das innere Zentrum des Denkens und Wollens; die formnahe Wendung ist im Deutschen verständlich.
- source_word: הִשְׁחִיתוּ
  choice: Sie handeln verdorben
  rationale: Die verbale Form beschreibt verderbtes Verhalten beziehungsweise ein Sich-Verderben. Die Wiedergabe vermeidet eine unnötige Festlegung auf rein inneren Zustand oder ausdrückliches Verderben anderer.
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: sie tun abscheuliche Dinge
  rationale: Die Verbindung bezeichnet abscheuliches Handeln. Die idiomatische deutsche Fassung gibt den Sinn klar wieder, ohne ein im Hebräischen nicht genanntes Einzelobjekt einzuführen.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Keiner tut Gutes
  rationale: Die knappe absolute Aussage des Hebräischen wird ebenso knapp und allgemein wiedergegeben.
theological_decisions:
- issue: Bedeutung der Aussage אֵין אֱלֹהִים
  choice: »Es gibt keinen Gott.«
  alternative: »Gott ist nicht da.« / »Es gibt keinen Gott, der eingreift.«
  rationale: Die hebräische Aussage ist knapp und kann als Leugnung Gottes oder als praktische Verneinung seiner Gegenwart und seines Eingreifens verstanden werden. Die direkte Standardwiedergabe bewahrt die Schärfe, ohne eine Deutung in den Text einzubauen.
- issue: Wechsel vom Singular zum Plural
  choice: Der Tor … Sie handeln
  alternative: »Solche Menschen handeln verdorben«
  rationale: Der unvermittelte Numeruswechsel des hebräischen Textes bleibt erhalten. So wird die Spannung zwischen der repräsentativen Einzelfigur und der von ihr verkörperten Gruppe nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Psalmüberschrift bleibt knapp; der poetische Haupttext verwendet kurze, klare Sätze. Der traditionelle Ausdruck »Tor« wird wegen seiner moralisch-religiösen Bedeutung beibehalten und ist im Kontext gut verständlich.
