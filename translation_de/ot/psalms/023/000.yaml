  text: מִזְמ֥וֹר לְ/דָוִ֑ד יְהוָ֥ה רֹ֝עִ֗/י לֹ֣א אֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/000.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will lack nothing.
translation:
  language: de
  text: 'Ein Psalm Davids.[a]


    Jahwe[b] ist mein Hirte; nichts wird mir fehlen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „von David“, „für David“ oder „David zugeordnet“. Das hebräische לְדָוִד kann Urheberschaft, Widmung oder Zuordnung bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: Hebräisch JHWH, der Eigenname Gottes; traditionell wird er mit „der HERR“ wiedergegeben.
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „Mir fehlt nichts.“ Die hebräische Verbform kann eine allgemeine gegenwärtige oder eine zukünftige Aussage ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psalm
  rationale: Die etablierte deutsche Bezeichnung gibt die Gattungsangabe natürlich und präzise wieder.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der Genitiv ist in einer deutschen Psalmüberschrift knapp und idiomatisch; die Bandbreite der hebräischen Präposition לְ wird in der Fußnote offengehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: רֹעִי
  choice: mein Hirte
  rationale: Bewahrt das zentrale Hirtenbild direkt und in natürlichem Deutsch.
- source_word: לֹא אֶחְסָר
  choice: nichts wird mir fehlen
  rationale: Gibt die Verneinung und das Verb חָסֵר in modernem Deutsch wieder; die zukunftsbezogene Formulierung passt zur hebräischen Verbform, ohne die mögliche allgemeine Gegenwartsbedeutung auszuschließen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen; die direkte Namenswiedergabe erhält diese Unterscheidung. Die traditionelle Ersatzlesung wird in der Fußnote genannt.
- issue: Aussageumfang von לֹא אֶחְסָר
  choice: nichts wird mir fehlen
  alternative: mir fehlt nichts
  rationale: Die Übersetzung wahrt die umfassende Zusage, ohne sie als Garantie jedes Wunsches zu deuten; die mögliche präsentische beziehungsweise allgemeine Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Überschrift bleibt als eigene Zeile stehen. „Nichts wird mir fehlen“ ist geläufiger als das altertümliche „mir wird nichts mangeln“ und bewahrt zugleich den umfassenden Sinn der Aussage.
