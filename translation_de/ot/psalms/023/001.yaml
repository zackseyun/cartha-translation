source:
  edition: WLC
  text: מִזְמ֥וֹר לְ/דָוִ֑ד יְהוָ֥ה רֹ֝עִ֗/י לֹ֣א אֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/001.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will not lack.
translation:
  language: de
  text: 'Ein Psalm Davids[a].


    Jahwe[b] ist mein Hirte; mir wird nichts fehlen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „von David“ oder „für David“. Die hebräische Überschrift לְדָוִד kann Autorschaft, Widmung oder Zugehörigkeit bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: Hebräisch JHWH; der persönliche Name Gottes wird traditionell auch mit „der HERR“ wiedergegeben.
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „mir fehlt nichts“ oder „ich werde keinen Mangel haben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psalm
  rationale: Das Wort bezeichnet hier die Gattung eines zum Singen oder musikalischen Vortrag bestimmten Liedes; „Psalm“ ist dafür im Deutschen die klare und etablierte Entsprechung.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der deutsche Genitiv bewahrt die Zuordnung zu David, ohne eindeutig festzulegen, ob Autorschaft, Widmung oder sonstige Zugehörigkeit gemeint ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Form.
- source_word: רֹעִי
  choice: mein Hirte
  rationale: Die Form von רעה bezeichnet den, der eine Herde weidet und versorgt. „Mein Hirte“ erhält das persönliche Hirtenbild knapp und natürlich.
- source_word: לֹא אֶחְסָר
  choice: mir wird nichts fehlen
  rationale: חסר bedeutet „Mangel haben, entbehren, fehlen“. Die Form lässt sich zukunftsbezogen oder als zuversichtliche allgemeine Aussage verstehen; diese natürliche deutsche Wendung bringt die zugesagte Versorgung zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. Die Umschrift bewahrt den persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Überschrift לְדָוִד
  choice: Davids
  alternative: von David / für David
  rationale: Die hebräische Präposition kann Autorschaft, Widmung, Zugehörigkeit oder Verbindung ausdrücken. Der Genitiv lässt diese Mehrdeutigkeit weitgehend offen.
- issue: Zeitliche bzw. modale Aussage von אֶחְסָר
  choice: mir wird nichts fehlen
  alternative: mir fehlt nichts
  rationale: Die Präfixkonjugation kann hier zukünftige Zuversicht ausdrücken, während auch ein allgemeiner gegenwärtiger Sinn möglich ist. Die gewählte Fassung folgt der naheliegenden Zukunftsnuance, ohne die Aussage auf materiellen Wohlstand zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Form und das vertraute Hirtenbild bleiben erhalten; die Überschrift wird optisch vom Vers abgesetzt.
