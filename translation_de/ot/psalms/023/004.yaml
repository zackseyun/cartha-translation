id: PSA.23.4
reference: Psalms 23:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: גַּ֤ם כִּֽי אֵלֵ֨ךְ בְּ/גֵ֪יא צַלְמָ֡וֶת לֹא אִ֘ירָ֤א רָ֗ע כִּי אַתָּ֥ה עִמָּדִ֑/י שִׁבְטְ/ךָ֥ וּ֝/מִשְׁעַנְתֶּ֗/ךָ הֵ֣מָּה יְנַֽחֲמֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/004.yaml
  text: Even though I walk through the valley of deep darkness[a], I will fear no evil, for you are with me; your rod and your staff—they comfort me.
translation:
  language: de
  text: Selbst wenn ich durch das Tal tiefer Dunkelheit gehe[a], fürchte ich kein Unheil; denn du bist bei mir. Dein Stock und dein Stab – sie trösten mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch das Tal des Todesschattens“. Das hebräische Wort kann tiefe Dunkelheit bezeichnen und zugleich Anklänge an den Tod haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם כִּי
  choice: Selbst wenn
  rationale: Die Verbindung leitet hier einen einräumenden Nebensatz ein. „Selbst wenn“ gibt diesen Sinn im modernen Deutschen natürlich wieder.
- source_word: אֵלֵךְ
  choice: ich gehe
  rationale: Das Imperfekt beschreibt den Weg des Beters anschaulich und kann allgemein-gegenwärtig beziehungsweise zukünftig verstanden werden. „Ich gehe“ wahrt diese Offenheit.
- source_word: בְּגֵיא
  choice: durch das Tal
  rationale: In Verbindung mit dem Verb der Bewegung ist „durch das Tal“ im Deutschen idiomatisch; „Schlucht“ wäre möglich, aber enger.
- source_word: צַלְמָוֶת
  choice: tiefe Dunkelheit
  rationale: Das Wort bezeichnet sehr tiefe Finsternis und kann zugleich an Tod erinnern. Die Hauptfassung legt die Todesbedeutung nicht als einzig mögliche fest.
- source_word: לֹא אִירָא רָע
  choice: fürchte ich kein Unheil
  rationale: „Unheil“ bewahrt die Breite von רָע, das hier Böses, Schaden oder drohende Gefahr bezeichnen kann.
- source_word: כִּי אַתָּה עִמָּדִי
  choice: denn du bist bei mir
  rationale: „Denn“ gibt die Begründung für die Furchtlosigkeit klar und in würdigem poetischem Deutsch wieder.
- source_word: שִׁבְטְךָ
  choice: dein Stock
  rationale: Im Hirtenbild bezeichnet das Wort den Stock des Hirten, der auch zum Schutz dienen kann. „Zepter“ würde die königliche Bedeutung zu stark in den Vordergrund rücken.
- source_word: וּמִשְׁעַנְתֶּךָ
  choice: dein Stab
  rationale: Das Wort bezeichnet eine Stütze oder einen Stab. Parallel zu „Stock“ passt „Stab“ zur Hirtenmetaphorik und bleibt knapp.
- source_word: הֵמָּה
  choice: sie
  rationale: Das selbstständige Pronomen ist betont. Gedankenstrich und ausdrückliches „sie“ bilden diese Hervorhebung im Deutschen nach.
- source_word: יְנַחֲמֻנִי
  choice: trösten mich
  rationale: „Trösten“ gibt sowohl die beruhigende als auch die stärkende Wirkung in diesem Zusammenhang treffend wieder.
theological_decisions:
- issue: Bedeutung von צַלְמָוֶת in der traditionsreichen Wendung
  choice: tiefe Dunkelheit
  alternative: Todesschatten
  rationale: Die Hauptfassung folgt dem wahrscheinlichen weiteren Wortsinn einer tiefen Finsternis, ohne mögliche Todesanklänge auszuschließen. Die traditionelle Deutung wird deshalb in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Die traditionelle Bildwelt bleibt erhalten, während eine lexikalisch mögliche Engführung auf den Tod nur als Alternative ausgewiesen wird.
