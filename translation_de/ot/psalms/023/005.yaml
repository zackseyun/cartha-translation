source:
  edition: WLC
  text: תַּעֲרֹ֬ךְ לְ/פָנַ֨/י שֻׁלְחָ֗ן נֶ֥גֶד צֹרְרָ֑/י דִּשַּׁ֖נְתָּ בַ/שֶּׁ֥מֶן רֹ֝אשִׁ֗/י כּוֹסִ֥/י רְוָיָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/005.yaml
  text: You set a table before me in the presence of my enemies[a]; you anoint my head with oil[b]; my cup overflows.
translation:
  language: de
  text: Du deckst vor mir einen Tisch, vor den Augen meiner Feinde.[a] Du salbst mein Haupt mit Öl;[b] mein Becher fließt über.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du bereitest vor mir einen Tisch im Beisein meiner Feinde.« Das hebräische Verb kann »ordnen«, »herrichten« oder »vorbereiten« bedeuten; »decken« bewahrt hier das konkrete Bild eines Mahls.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher etwa: »Du machst mein Haupt reich mit Öl.« Das hebräische Verb bezeichnet üppige Fülle oder großzügige Erquickung. Zusammen mit Haupt und Öl gibt »salbst« den wahrscheinlichen Sinn im Zusammenhang wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲרֹךְ
  choice: du deckst
  rationale: Das Verb ערך bezeichnet hier das Ordnen oder Bereitstellen eines Tisches. »Einen Tisch decken« gibt das konkrete Mahl- und Gastgeberbild in natürlichem modernem Deutsch wieder.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Die Präpositionalverbindung bedeutet wörtlich »vor mir« beziehungsweise »in meiner Gegenwart« und wird knapp beibehalten.
- source_word: שֻׁלְחָן
  choice: einen Tisch
  rationale: Die konkrete Tisch- und Mahlszene bleibt erhalten; der unbestimmte Artikel ist im Deutschen erforderlich.
- source_word: נֶגֶד צֹרְרָי
  choice: vor den Augen meiner Feinde
  rationale: נֶגֶד bezeichnet das Gegenüber beziehungsweise die unmittelbare Gegenwart; צֹרְרָי sind diejenigen, die dem Sprecher feindlich begegnen. Die Formulierung macht verständlich, dass die Feinde anwesend sind und zusehen.
- source_word: דִּשַּׁנְתָּ
  choice: du salbst
  rationale: דשׁן hat die Grundvorstellung von Fettigkeit, Fülle oder reicher Versorgung. Zusammen mit »Öl« und »mein Haupt« bezeichnet es eine großzügige Behandlung oder Ehrung; »salben« gibt die konkrete Handlung idiomatisch wieder, ohne das schwer verständliche wörtliche Bild »fett machen« zu verwenden.
- source_word: בַשֶּׁמֶן רֹאשִׁי
  choice: mein Haupt mit Öl
  rationale: Instrument und Körperteil werden unmittelbar wiedergegeben. »Haupt« wahrt den würdevoll-poetischen Ton des Psalms, ohne unverständlich zu sein.
- source_word: כּוֹסִי רְוָיָה
  choice: mein Becher fließt über
  rationale: רְוָיָה ist ein Substantiv, das Sättigung, reiche Fülle oder Überfluss bezeichnet. Die verbale deutsche Wendung bewahrt das Becherbild und drückt die überreiche Fülle natürlich aus.
theological_decisions:
- issue: Gastfreundschafts- und Salbungsbild in דִּשַּׁנְתָּ בַשֶּׁמֶן רֹאשִׁי
  choice: 'Als konkrete Gastgeberhandlung wiedergegeben: »Du salbst mein Haupt mit Öl.«'
  alternative: »Du machst mein Haupt reich mit Öl« oder »Du erfrischst mein Haupt mit Öl«
  rationale: Der Zusammenhang zeichnet ein Mahl und die großzügige Fürsorge eines Gastgebers. »Salbst« ist durch Haupt und Öl begründet, soll hier aber keine späteren sakramentalen, königlichen oder konfessionellen Deutungen in den Text eintragen.
- issue: Zeit- und Aspektwiedergabe
  choice: 'Präsens: »du deckst … du salbst … fließt über«'
  alternative: Vergangenheitsformen wie »du hast bereitet … du hast gesalbt«
  rationale: Die hebräischen Formen lassen sich in der Poesie als anschauliche Darstellung gegenwärtiger beziehungsweise fortdauernder Fürsorge verstehen. Das Präsens wahrt die Unmittelbarkeit, ohne den Aspekt unnötig festzulegen.
translation_notes:
  register: Modernes Standarddeutsch mit würdevoll-poetischem Klang. »Einen Tisch decken« ist alltagssprachlich verständlich; »Haupt« hält den gehobenen Psalmton. Die Bildfolge von Gastgeber, Öl und überfließendem Becher bleibt konkret erhalten.
