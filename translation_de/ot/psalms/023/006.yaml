  text: אַ֤ךְ ט֤וֹב וָ/חֶ֣סֶד יִ֭רְדְּפוּ/נִי כָּל יְמֵ֣י חַיָּ֑/י וְ/שַׁבְתִּ֥י בְּ/בֵית יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/006.yaml
  text: Surely goodness and steadfast love will pursue me all the days of my life[c][b][a], and I will dwell in the house of Yahweh for length of days.
translation:
  language: de
  text: Gewiss, Güte und treue Liebe werden mich verfolgen[a] mein Leben lang, und ich werde im Haus Jahwes wohnen[b] für lange Zeit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden mir folgen“. Das hebräische Verb bedeutet anschaulicher „verfolgen“ oder „nachjagen“ und stellt Güte und treue Liebe als aktiv Handelnde dar.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ich werde zum Haus Jahwes zurückkehren“. Die masoretisch tradierte Lesung wird im Zusammenhang meist als „wohnen“ verstanden; die Konsonantenform kann auch als „zurückkehren“ gedeutet werden.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „für immer“. Wörtlich steht hier eine Wendung für die Länge beziehungsweise Dauer von Tagen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Gewiss
  rationale: Die Partikel bekräftigt hier zuversichtlich die abschließende Aussage des Psalms; „Gewiss“ gibt dies natürlich und würdig wieder.
- source_word: טוֹב
  choice: Güte
  rationale: In der Verbindung mit חֶסֶד bezeichnet das Wort Gottes wohltuendes Handeln und lässt sich im Deutschen treffend als abstraktes Substantiv wiedergeben.
- source_word: חֶסֶד
  choice: treue Liebe
  rationale: Die Wendung umfasst verlässliche, beständige und loyale Zuwendung; „treue Liebe“ ist verständlich, ohne den Begriff auf bloßes Erbarmen zu verengen.
- source_word: יִרְדְּפוּנִי
  choice: werden mich verfolgen
  rationale: Das Verb bezeichnet ein aktives Verfolgen oder Nachjagen. Die Formulierung bewahrt das eindrückliche Bild, dass nun Güte und Liebe dem Beter nachsetzen.
- source_word: כָּל יְמֵי חַיָּי
  choice: mein Leben lang
  rationale: Diese idiomatische deutsche Wendung gibt die zeitliche Gesamtheit von „alle Tage meines Lebens“ vollständig und natürlich wieder.
- source_word: וְשַׁבְתִּי
  choice: ich werde wohnen
  rationale: Im Zusammenhang mit dem Haus Jahwes ist „wohnen“ die überlieferte und kontextuell stimmige Deutung; die bekannte Alternative „zurückkehren“ bleibt in einer Fußnote sichtbar.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: Die Wiedergabe bewahrt das konkrete Bild des Heiligtums und gibt den Gottesnamen als „Jahwe“ wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird transliteriert und nicht durch einen Titel ersetzt.
- source_word: לְאֹרֶךְ יָמִים
  choice: auf lange Zeit
  rationale: Die deutsche Wendung gibt die wörtliche Vorstellung einer langen Dauer idiomatisch wieder, ohne sie im Haupttext ausdrücklich als endlose Dauer festzulegen.
theological_decisions:
- issue: Dauer in לְאֹרֶךְ יָמִים
  choice: auf lange Zeit
  alternative: für immer
  rationale: Der hebräische Ausdruck bezeichnet wörtlich eine lange Dauer und kann als „für immer“ verstanden werden. Der Haupttext wahrt seine offene poetische Aussage; die stärkere Deutung steht in der Fußnote.
- issue: Bedeutung von וְשַׁבְתִּי
  choice: ich werde wohnen
  alternative: ich werde zurückkehren
  rationale: „Wohnen“ fügt sich unmittelbar in das Bild vom Haus Jahwes und entspricht einer weithin bezeugten Deutung. Da die Form auch seit Langem als „zurückkehren“ verstanden wird, wird diese Möglichkeit nicht stillschweigend ausgeschlossen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Ton. Das kräftige Verfolgungsbild bleibt erhalten; traditionelle, aber heute weniger klare Wörter wie „Huld“ werden vermieden. Der Gottesname erscheint als „Jahwe“.
