  text: In grassy pastures he makes me lie down[a]; beside restful waters he leads me.
translation:
  language: de
  text: Auf Weiden mit frischem Gras lässt er mich lagern; zu Wasserplätzen der Ruhe führt er mich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu stillen Wassern“ oder „zu ruhigen Wassern“. Der hebräische Ausdruck bezeichnet Wasser, das mit Ruhe oder Rast verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְאוֹת דֶּשֶׁא
  choice: auf saftigen Weiden
  rationale: נְאוֹת bezeichnet im Hirtenbild Weide- oder Lagerplätze, דֶּשֶׁא frisches Gras beziehungsweise frische Vegetation. „Saftige Weiden“ gibt das Bild natürlich und anschaulich wieder.
- source_word: יַרְבִּיצֵנִי
  choice: lässt er mich lagern
  rationale: 'Der Hifil von רבץ ist kausativ: jemanden sich lagern lassen beziehungsweise zum Lagern bringen. „Lagern“ bewahrt das konkrete Bild eines ruhenden Herdentiers.'
- source_word: עַל מֵי מְנֻחוֹת
  choice: an Wasserplätzen der Ruhe
  rationale: עַל bezeichnet hier die Nähe zu den Wassern. מֵי מְנֻחוֹת verbindet Wasser mit Ruhe oder Rast; die gewählte Formulierung bewahrt diese ungewöhnliche hebräische Verbindung, ohne sie allein als Bewegungslosigkeit des Wassers zu deuten.
- source_word: יְנַהֲלֵנִי
  choice: führt er mich
  rationale: Der Piel von נהל bezeichnet ein leitendes, häufig fürsorgliches Führen und passt unmittelbar zum Hirtenbild.
theological_decisions:
- issue: Traditionelle Deutung als „stilles Wasser“ gegenüber dem Ruhebezug des hebräischen Ausdrucks
  choice: Wasserplätze der Ruhe
  alternative: stilles Wasser; ruhiges Wasser
  rationale: מְנֻחוֹת bezeichnet Ruhe, Rast oder Ruheplätze und nicht ausdrücklich die Bewegungslosigkeit des Wassers. Die Hauptfassung erhält den Ruhebezug; vertraute und plausible Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Psalmsprache mit konkretem Hirtenbild. „Lagern“ ist leicht gehoben, aber allgemein verständlich; „Wasserplätze der Ruhe“ bewahrt bewusst die poetische Spannung und Mehrdeutigkeit des Hebräischen.
