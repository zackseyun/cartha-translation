source:
  edition: WLC
  text: נַפְשִׁ֥/י יְשׁוֹבֵ֑ב יַֽנְחֵ֥/נִי בְ/מַעְגְּלֵי צֶ֝֗דֶק לְמַ֣עַן שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/003.yaml
  text: He restores my soul[c][b][a]; he leads me in paths of righteousness for the sake of his name.
translation:
  language: de
  text: Meine Seele stellt er wieder her[a]; er führt mich auf Pfaden der Gerechtigkeit[b] um seines Namens willen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Er belebt mein Leben neu“, „er erquickt mich“ oder „er bringt mich zurück“. Das hebräische Wort für „Seele“ kann das Leben oder die ganze Person bezeichnen, nicht nur einen immateriellen Teil des Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „auf richtigen Pfaden“ oder „auf Pfaden des Rechts“.'
    reason: lexical_alternative
  - marker: c
    text: '„Um seines Namens willen“ bedeutet: um der Ehre und des Ansehens seines Namens willen.'
    reason: cultural_note
lexical_decisions:
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ bezeichnet hier die Seele, zugleich aber umfassender das Leben oder die ganze Person. Die traditionelle poetische Wendung bleibt erhalten; eine Fußnote schützt vor einer zu engen, rein immateriellen Deutung.
- source_word: יְשׁוֹבֵב
  choice: stellt er wieder her
  rationale: Die Form von שׁוב kann ein Zurückbringen, Wiederherstellen oder Neubeleben ausdrücken. „Stellt … wieder her“ bewahrt diese Bedeutungsbreite besser als das enger gefasste „erquickt“.
- source_word: יַנְחֵנִי
  choice: er führt mich
  rationale: Das Hifil von נחה bedeutet führen oder leiten. „Führt“ passt konkret zum Bild des Hirten.
- source_word: בְמַעְגְּלֵי
  choice: auf Pfaden
  rationale: מַעְגָּל bezeichnet eine Spur, einen Pfad oder eine Bahn. Im Deutschen ist bei einer Bewegung „auf Pfaden“ natürlich und bildkräftig.
- source_word: צֶדֶק
  choice: der Gerechtigkeit
  rationale: צֶדֶק kann Gerechtigkeit, Recht oder Richtigkeit bezeichnen. Die Wiedergabe hält die ethisch-theologische Dimension offen, ohne die Bedeutung richtiger Wege auszuschließen.
- source_word: לְמַעַן
  choice: um … willen
  rationale: לְמַעַן bezeichnet Zweck oder Beweggrund. Die feste deutsche Wendung gibt dies knapp und würdig wieder.
- source_word: שְׁמוֹ
  choice: seines Namens
  rationale: שֵׁם bedeutet wörtlich „Name“ und umfasst zugleich Charakter, Ansehen und Ruf. Der biblisch gewichtige Ausdruck „Name“ bleibt im Text erhalten.
theological_decisions:
- issue: Bedeutung von „meine Seele stellt er wieder her“
  choice: Ganzheitliche Wiederherstellung oder Neubelebung des Lebens und der Person, ausgedrückt mit „meine Seele“
  alternative: „Er belebt mein Leben neu“, „er erquickt mich“ oder „er bringt mich zurück“
  rationale: נֶפֶשׁ ist nicht auf einen immateriellen Seelenteil beschränkt, und יְשׁוֹבֵב lässt sowohl Wiederherstellung als auch Neubelebung oder Zurückbringen zu. Text und Fußnote bewahren diese Spannung.
- issue: Sinn von „Pfaden der Gerechtigkeit“
  choice: Wege, die durch Gerechtigkeit und rechtes Handeln gekennzeichnet sind
  alternative: „richtigen Pfaden“ oder „Pfaden des Rechts“
  rationale: צֶדֶק kann moralische Gerechtigkeit ebenso wie das Rechte oder Richtige bezeichnen. Die gewählte Form erhält die ethische und theologische Tiefe, ohne die praktische Wegführung auszuschließen.
- issue: Sinn von „um seines Namens willen“
  choice: Gott handelt seinem eigenen Charakter und der Ehre seines Namens entsprechend
  alternative: „um seines Rufes willen“ oder „seinem Namen entsprechend“
  rationale: Der Name steht im Hebräischen häufig für Charakter, Ansehen und Offenbarung der Person. Die wörtliche Form bewahrt den biblischen Ausdruck; die Fußnote erläutert ihn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst poetischer Satzstellung. „Wiederherstellen“ ist gegenüber dem heute altertümlich wirkenden „erquicken“ verständlicher und hält die Mehrdeutigkeit des hebräischen Verbs offen. Die traditionellen Schlüsselbegriffe „Seele“, „Gerechtigkeit“ und „Name“ bleiben erhalten und werden durch knappe Fußnoten erläutert.
