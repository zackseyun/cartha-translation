source:
  edition: WLC
  text: מַה יָּקָ֥ר חַסְדְּ/ךָ֗ אֱלֹ֫הִ֥ים וּ/בְנֵ֥י אָדָ֑ם בְּ/צֵ֥ל כְּ֝נָפֶ֗י/ךָ יֶחֱסָיֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/007.yaml
  text: How precious is your steadfast love[b][a], O God! The children of man take refuge in the shadow of your wings.
translation:
  language: de
  text: Wie kostbar ist deine treue Liebe[a], Gott! Die Menschen suchen Zuflucht im Schatten deiner Flügel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „beständige Güte“, „Erbarmen“ oder „Bundestreue“ einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּקָר
  choice: Wie kostbar
  rationale: מַה leitet hier einen bewundernden Ausruf ein; יקר bezeichnet hohen Wert und persönliche Kostbarkeit. „Wie kostbar“ gibt beides natürlich und poetisch wieder.
- source_word: חַסְדְּךָ
  choice: deine treue Liebe
  rationale: חֶסֶד umfasst beständige Liebe, Loyalität, Güte und Erbarmen. „Treue Liebe“ bewahrt die relationale Beständigkeit, ohne den Begriff ausschließlich auf einen Einzelaspekt festzulegen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv steht als direkte Anrede. Im modernen Deutschen ist die unmarkierte Anrede „Gott“ natürlicher als das altertümlich wirkende „o Gott“.
- source_word: וּבְנֵי אָדָם
  choice: Die Menschen
  rationale: בני אדם ist eine kollektive Bezeichnung für Menschen allgemein. „Die Menschen“ gibt die Bedeutung im heutigen Deutsch klar wieder; die wörtliche Bildform wird in diesem Zusammenhang nicht benötigt.
- source_word: בְּצֵל כְּנָפֶיךָ
  choice: im Schatten deiner Flügel
  rationale: Die Übersetzung erhält das hebräische Bild schützender Nähe vollständig.
- source_word: יֶחֱסָיוּן
  choice: suchen Zuflucht
  rationale: חסה bezeichnet das Zufluchtnehmen beziehungsweise Zufluchtsuchen. „Suchen Zuflucht“ ist im Deutschen idiomatisch und wahrt den aktiven Vertrauensaspekt.
theological_decisions:
- issue: Bedeutungsumfang von חֶסֶד
  choice: treue Liebe
  alternative: Güte; Erbarmen; Bundestreue
  rationale: Der Ausdruck verbindet Liebe und verlässliche Loyalität. „Treue Liebe“ hält diese Dimensionen zusammen, ohne den Begriff auf Erbarmen oder eine ausdrücklich genannte Bundessituation einzuengen.
- issue: Kollektive Bedeutung von בני אדם
  choice: die Menschen
  alternative: die Menschenkinder; die Söhne Adams
  rationale: Die Wendung meint Menschen allgemein. Die inklusive kollektive Referenz wird mit „die Menschen“ genau und verständlich wiedergegeben, während eine wörtlichere Form im modernen Deutsch missverständlich oder unnötig altertümlich wäre.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener poetischer Bildsprache. Die Anrede ist ohne das heute gehobene beziehungsweise altertümliche „o“ formuliert; die hebräische Satzverbindung wird zugunsten eines natürlichen deutschen Versflusses nicht eigens mit „und“ wiedergegeben.
