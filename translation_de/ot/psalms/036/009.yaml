  text: כִּֽי עִ֭מְּ/ךָ מְק֣וֹר חַיִּ֑ים בְּ֝/אוֹרְ/ךָ֗ נִרְאֶה אֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/009.yaml
  text: For with you is the fountain of life[b][a]; in your light we see light.
translation:
  language: de
  text: Denn bei dir ist die Quelle des Lebens[a]; in deinem Licht sehen wir Licht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Lebensquell“; auch im Sinn von „der Ursprung des Lebens“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Durch dein Licht sehen wir Licht.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage. „Denn“ bewahrt diesen Zusammenhang in natürlichem Deutsch.
- source_word: עִמְּךָ
  choice: bei dir
  rationale: עִם mit Suffix bedeutet wörtlich „mit dir“. In Verbindung mit dem Vorhandensein der Quelle ist „bei dir“ im Deutschen natürlicher und wahrt die relationale sowie räumliche Offenheit.
- source_word: מְקוֹר חַיִּים
  choice: Quelle des Lebens
  rationale: מְקוֹר bezeichnet eine Quelle oder einen Quellort; חַיִּים ist trotz seiner Pluralform die übliche Bezeichnung für „Leben“. „Quelle des Lebens“ erhält das konkrete poetische Bild.
- source_word: בְּאוֹרְךָ
  choice: in deinem Licht
  rationale: Die Präposition בְ kann örtlich oder instrumental verstanden werden. „In deinem Licht“ bildet die hebräische Form eng ab und bewahrt die Bildsprache, ohne sie auf ein bloßes Mittel festzulegen.
- source_word: נִרְאֶה
  choice: sehen wir
  rationale: Die Verbform bezeichnet hier eine allgemein gültige Aussage. „sehen wir“ ist direkt, gegenwartsnah und natürlich.
- source_word: אוֹר
  choice: Licht
  rationale: Die Wiederholung von „Licht“ erhält das Wortspiel und die poetische Verdichtung des Hebräischen.
theological_decisions:
- issue: Bildsprache von göttlichem Leben und Licht
  choice: Die Bilder „Quelle des Lebens“ und „in deinem Licht sehen wir Licht“ bleiben unaufgelöst stehen.
  alternative: Deutende Wiedergaben wie „du bist der Ursprung allen Lebens“ oder „durch deine Wahrheit gewinnen wir Erkenntnis“.
  rationale: Der hebräische Text verbindet Leben und Licht in dichter, theologisch offener Bildsprache. Eine erklärende Paraphrase würde diese Spannung auf eine einzelne Auslegung verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzstruktur. Die Wiederholung „Licht … Licht“ und die Metapher der Quelle werden bewusst beibehalten.
