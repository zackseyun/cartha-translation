lexical_decisions:
- source_word: תְּבוֹאֵנִי
  choice: dringe nicht gegen mich vor
  rationale: בוא bedeutet grundsätzlich „kommen“. Mit dem bildhaften Subjekt „Fuß des Hochmuts“ bezeichnet es hier ein feindliches Herankommen. „Gegen mich vordringen“ gibt diese Richtung in natürlichem Deutsch wieder, ohne die Bedrohung näher auszugestalten.
- source_word: רֶגֶל גַּאֲוָה
  choice: der Fuß des Hochmuts
  rationale: Die hebräische Genitivverbindung lautet wörtlich „Fuß des Hochmuts“. Die Wiedergabe bewahrt das markante poetische Bild und macht aus dem abstrakten „Hochmut“ nicht stillschweigend „die Hochmütigen“.
- source_word: יַד רְשָׁעִים
  choice: die Hand der Frevler
  rationale: „Hand“ bewahrt das hebräische Bild für Macht und tätiges Eingreifen. „Frevler“ gibt das substantivisch gebrauchte רְשָׁעִים als Gruppe wieder, ohne ein zusätzliches Geschlecht einzutragen.
- source_word: תְּנִדֵנִי
  choice: vertreibe mich
  rationale: Die Kausativform bezeichnet, dass jemand von seinem Ort fortbewegt, zur Flucht gebracht oder zum Umherirren gezwungen wird. „Vertreiben“ erfasst die gewaltsame Verdrängung knapp und idiomatisch.
- source_word: אַל
  choice: nicht … / … nicht
  rationale: אַל mit den entsprechenden Verbformen drückt hier eine bittende Verneinung aus. Die deutsche Verbform im Gebetsstil mit „nicht“ bewahrt den gehobenen, aber verständlichen Ton.
