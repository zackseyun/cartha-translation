  text: Let not the foot of pride come against me[b][a], and let not the hand of the wicked drive me away.
translation:
  language: de
  text: Der Fuß des Hochmuts dringe nicht gegen mich vor[a], und die Hand der Frevler vertreibe mich nicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „komme nicht über mich“ oder wörtlicher: „komme nicht zu mir“. Das hebräische Bild beschreibt das bedrohliche Herankommen des „Fußes des Hochmuts“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „zwinge mich nicht zum Umherirren“ oder „jage mich nicht in die Flucht“. Das Verb kann verschiedene Formen erzwungener Vertreibung bezeichnen.'
