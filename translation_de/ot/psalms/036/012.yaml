source:
  edition: WLC
  text: שָׁ֣ם נָ֭פְלוּ פֹּ֣עֲלֵי אָ֑וֶן דֹּ֝ח֗וּ וְ/לֹא יָ֥כְלוּ קֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/012.yaml
  text: There the workers of wickedness have fallen[b][a]; they are thrust down and cannot rise.
translation:
  language: de
  text: Dort sind die Übeltäter[a] gefallen; sie sind niedergestoßen worden und können nicht aufstehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Täter des Unrechts“; auch: „die Täter der Bosheit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie sind zu Boden gestoßen worden und können nicht aufstehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Dort
  rationale: Das Ortsadverb weist auf den Schauplatz des Sturzes der Bösen; eine zeitliche Wiedergabe wie „Dann“ ist weniger naheliegend.
- source_word: נָפְלוּ
  choice: sind ... gefallen
  rationale: Das Qal Perfekt bezeichnet den vollendeten Sturz und dessen fortdauerndes Ergebnis; das deutsche Perfekt gibt dies natürlich und anschaulich wieder.
- source_word: פֹּעֲלֵי אָוֶן
  choice: die Übeltäter
  rationale: Die kompakte deutsche Bezeichnung gibt die hebräische Konstruktverbindung „Täter/Wirker von Unheil“ natürlich wieder. Die bildnähere Alternative wird in der Fußnote bewahrt.
- source_word: אָוֶן
  choice: Unrecht (in der Fußnotenalternative)
  rationale: Das Wort kann Unheil, Unrecht oder Frevel bezeichnen. Im Zusammenhang steht die moralische Bedeutung im Vordergrund.
- source_word: דֹּחוּ
  choice: sie wurden niedergestoßen
  rationale: Die passive Form von דחה beschreibt ein gewaltsames Niederstoßen beziehungsweise eine erzwungene Niederlage.
- source_word: וְלֹא יָכְלוּ קוּם
  choice: und können nicht mehr aufstehen
  rationale: Die Wendung bezeichnet die Unfähigkeit, sich nach dem Sturz wieder zu erheben. „Nicht mehr“ macht im Deutschen die endgültige Wirkung des Zusammenhangs deutlich, ohne den Bildgehalt aufzugeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und das Bild eines endgültigen, gewaltsamen Sturzes bleiben erhalten; die ungewöhnlichere hebräische Täterformel wird durch eine Fußnote sichtbar gemacht.
