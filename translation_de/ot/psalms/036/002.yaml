  language: en
  yaml_path: translation/ot/psalms/036/002.yaml
  text: For he flatters himself in his own eyes too much to find his iniquity and hate it[a].
translation:
  language: de
  text: Denn er schmeichelt sich in seinen eigenen Augen, sodass er seine Schuld nicht erkennt und sie nicht hasst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Denn er macht sich selbst in seinen Augen glatt, seine Schuld zu finden, zu hassen.« Der hebräische Satz ist syntaktisch schwierig. Die Infinitive können im Zusammenhang so verstanden werden, dass seine Selbstschmeichelei ihn daran hindert, seine Schuld zu erkennen und zu verabscheuen; andere Zuordnungen werden ebenfalls vertreten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Aussage ein und passt zum argumentativen Zusammenhang.
- source_word: הֶחֱלִיק אֵלָיו
  choice: schmeichelt er sich
  rationale: Das Hifil von חלק bedeutet wörtlich »glatt machen« und kann idiomatisch »schmeicheln« bedeuten; mit אֵלָיו wird die Handlung hier auf den Täter selbst bezogen.
- source_word: בְּעֵינָיו
  choice: in seinen eigenen Augen
  rationale: Bewahrt die geläufige hebräische Wendung für die eigene Wahrnehmung oder Einschätzung.
- source_word: לִמְצֹא
  choice: erkennt
  rationale: Das Grundverb bedeutet »finden«; im Zusammenhang mit eigener Schuld gibt »erkennen« den gemeinten Vorgang im natürlichen Deutschen wieder.
- source_word: עֲוֺנוֹ
  choice: seine Schuld
  rationale: עָוֹן kann sowohl Verfehlung als auch die daraus erwachsende Schuld bezeichnen. »Schuld« erhält das moralische Gewicht und bleibt im Deutschen verständlich.
- source_word: לִשְׂנֹא
  choice: sie nicht hasst
  rationale: Der zweite Infinitiv bezeichnet die ablehnende Reaktion auf die erkannte Schuld; das Pronomen bezieht sich auf »Schuld«.
- source_word: לִמְצֹא עֲוֺנוֹ לִשְׂנֹא
  choice: so sehr, dass er seine Schuld nicht erkennt und sie nicht hasst
  rationale: Die hebräische Syntax ist schwierig. Diese Wiedergabe versteht die Selbstschmeichelei als Hindernis für Erkenntnis und Ablehnung der eigenen Schuld, ohne die Unsicherheit zu verschweigen.
theological_decisions:
- issue: Moralpsychologischer Sinn des Verses
  choice: Die Selbstschmeichelei hindert den Frevler daran, seine eigene Schuld zu erkennen und abzulehnen.
  alternative: 'Er schmeichelt sich, bis seine Schuld als hassenswert erkannt wird; oder: Er macht es sich in seinen Augen glatt, um seine Schuld zu finden und zu hassen.'
  rationale: Der Zusammenhang spricht für Selbsttäuschung; die komprimierte hebräische Konstruktion lässt jedoch andere Zuordnungen der Infinitive zu. Deshalb wird die Schwierigkeit in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Hauptfassung ist gut verständlich; die Fußnote bewahrt die ungewöhnliche Bildsprache und die echte syntaktische Mehrdeutigkeit des Hebräischen.
