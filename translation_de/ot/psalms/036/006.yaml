id: PSA.36.6
reference: Psalms 36:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: צִדְקָֽתְ/ךָ֨ כְּֽ/הַרְרֵי אֵ֗ל מִ֭שְׁפָּטֶ/ךָ תְּה֣וֹם רַבָּ֑ה אָ֤דָֽם וּ/בְהֵמָ֖ה תוֹשִׁ֣יעַ יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/006.yaml
  text: Your righteousness is like the mountains of God[a]; your judgments are a great deep. O Yahweh[b], you save man and beast.
translation:
  language: de
  text: Deine Gerechtigkeit ist wie die Berge Gottes[a], deine Urteile sind eine gewaltige Tiefe. Mensch und Tier[b] rettest du, Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „die Berge Gottes“; die hebräische Wendung kann auch „mächtige Berge“ oder „die höchsten Berge“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Menschen und Tiere“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: deine Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt sowohl die moralische als auch die rechtliche und bundestreue Dimension des hebräischen Begriffs; „Recht“ wäre hier enger.
- source_word: כְּהַרְרֵי אֵל
  choice: wie die Berge Gottes
  rationale: Die formal transparente Wiedergabe erhält das hebräische Bild und lässt offen, ob אֵל wörtlich „Gott“ bezeichnet oder die Größe der Berge hervorhebt; die idiomatischen Deutungen stehen in der Fußnote.
- source_word: מִשְׁפָּטֶךָ
  choice: deine Urteile
  rationale: „Urteile“ gibt Gottes richterliche Entscheidungen oder Rechtssprüche wieder und wahrt die lexikalische Unterscheidung zu „Gerechtigkeit“.
- source_word: תְּהוֹם רַבָּה
  choice: eine gewaltige Tiefe
  rationale: Die Formulierung bewahrt das Bild einer unermesslichen Tiefe, ohne es einseitig als Abgrund oder Urflut festzulegen.
- source_word: אָדָם
  choice: Mensch
  rationale: Der generische Singular bezeichnet hier im Gegenüber zu „Tier“ die Menschheit als Gattung; „Mensch“ erhält diese Form im Deutschen.
- source_word: וּבְהֵמָה
  choice: und Tier
  rationale: Der generische Singular entspricht der poetischen Paarung mit „Mensch“ und bezeichnet die Tierwelt allgemein.
- source_word: תוֹשִׁיעַ
  choice: rettest du
  rationale: „Retten“ gibt das breite Bedeutungsspektrum des Hiphil von ישׁע wieder und kann hier auch Gottes bewahrendes Handeln einschließen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname bewahrt, dass im Hebräischen das Tetragramm und nicht ein bloßer Titel steht.
- issue: Generische Bedeutung von אָדָם und בְּהֵמָה
  choice: Mensch und Tier
  alternative: Menschen und Tiere
  rationale: Die Singularformen stellen Menschheit und Tierwelt als Gattungen gegenüber. Die Hauptfassung erhält diese poetische Struktur; die pluralische, ausdrücklich kollektive Wiedergabe wird als Alternative genannt.
- issue: Bedeutung von הַרְרֵי אֵל
  choice: Berge Gottes
  alternative: mächtige Berge / höchste Berge
  rationale: Die hebräische Verbindung kann wörtlich verstanden werden oder als Ausdruck außerordentlicher Größe. Die Hauptfassung entscheidet diese Spannung nicht stillschweigend.
translation_notes:
  register: Moderne, gehobene Psalmsprache mit klarer Syntax. Die parallelen Nominalsätze und die Schlussstellung des Gottesnamens bewahren den poetischen Nachdruck des Hebräischen, ohne altertümliche Formen zu verwenden.
