base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/000.yaml
  text: For the choirmaster[a]. Of David[d][c][b], the servant of Yahweh.
translation:
  language: de
  text: Für den Chorleiter[a]. Von David[b], dem Diener Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für den Musikleiter.“ Der hebräische Ausdruck bezeichnet den musikalischen Leiter im gottesdienstlichen Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Formulierung ordnet den Psalm David zu, legt aber für sich allein nicht eindeutig fest, ob damit Autorenschaft, Widmung oder eine andere Verbindung gemeint ist.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Die feste Überschriftsformel richtet den Psalm an den musikalischen Leiter. „Chorleiter“ ist knapp, verständlich und wahrt den gottesdienstlich-musikalischen Bezug.
- source_word: לְעֶבֶד
  choice: dem Diener
  rationale: עֶבֶד ist hier eine ehrende Bezeichnung Davids in seinem Verhältnis zu Gott. „Diener“ trifft diesen Gebrauch besser als das in diesem Zusammenhang unnötig zugespitzte „Sklave“.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; der Genitiv „Jahwes“ fügt sich natürlich in die deutsche Formulierung ein und ersetzt den Eigennamen nicht durch einen Titel.
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Präposition לְ kennzeichnet in Psalmüberschriften eine breite Zuordnung. „Von David“ ist im Deutschen natürlich, lässt aber Autorenschaft, Zugehörigkeit oder Verbindung offener als „verfasst von David“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Gottesname selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von עֶבֶד in der Überschrift
  choice: Diener
  alternative: Sklave
  rationale: Das Wort bezeichnet hier Davids ehrende Bindung an Jahwe; „Diener“ entspricht diesem Kontext, ohne einen im Text nicht hervorgehobenen rechtlichen Status in den Vordergrund zu rücken.
- issue: Reichweite von לְדָוִד
  choice: Von David
  alternative: Für David / verfasst von David
  rationale: Die hebräische Zuordnungsformel legt nicht eindeutig fest, ob Autorenschaft, Widmung oder sonstige Verbindung gemeint ist. Die Übersetzung soll diese Offenheit nicht vorschnell auflösen.
translation_notes:
  register: Knappe, würdige Form einer Psalmüberschrift in modernem Standarddeutsch. Die Apposition „dem Diener Jahwes“ macht natürlich verständlich, dass David als Jahwes Diener bezeichnet wird, während die Fußnote die Mehrdeutigkeit der Zuordnungsformel wahrt.
