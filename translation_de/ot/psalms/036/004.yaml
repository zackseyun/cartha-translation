  text: אָ֤וֶן יַחְשֹׁ֗ב עַֽל מִשְׁכָּ֫ב֥/וֹ יִ֭תְיַצֵּב עַל דֶּ֣רֶךְ לֹא ט֑וֹב רָ֝֗ע לֹ֣א יִמְאָֽס׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/004.yaml
  text: He devises wickedness on his bed[a]; he sets himself on a way that is not good; he does not reject evil.
translation:
  language: de
  text: Auf seinem Bett ersinnt er Unrecht; er stellt sich auf einen Weg, der nicht gut ist; das Böse verwirft er nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auf seinem Bett plant er Frevel … das Böse verabscheut er nicht.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָוֶן
  choice: Unheil
  rationale: Das Wort kann Unheil, Bosheit oder Frevel bezeichnen. Hier verbindet „Unheil“ die moralische Verwerflichkeit mit den schädlichen Folgen, ohne den Ausdruck mit dem späteren רָע („das Böse“) gleichzusetzen.
- source_word: יַחְשֹׁב
  choice: ersinnt
  rationale: חשב bezeichnet hier ein bewusstes Planen oder Ausdenken. „Ersinnt“ gibt die absichtsvolle innere Planung prägnant wieder.
- source_word: עַל מִשְׁכָּבוֹ
  choice: auf seinem Bett
  rationale: Die direkte Ortsangabe bewahrt das Bild des Menschen, der selbst während der Ruhezeit Unheil plant.
- source_word: יִתְיַצֵּב
  choice: er stellt sich
  rationale: Die reflexive Form bezeichnet ein bewusstes Sich-Aufstellen beziehungsweise Einnehmen einer Position und betont die entschiedene Ausrichtung.
- source_word: עַל דֶּרֶךְ לֹא טוֹב
  choice: auf einen Weg, der nicht gut ist
  rationale: Die Formulierung bleibt eng beim hebräischen Wegbild und bewahrt die auffällige Untertreibung „nicht gut“, statt sie zu „böse“ zu verschärfen.
- source_word: רָע
  choice: das Böse
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet hier moralisch Böses und wird im Deutschen natürlich mit „das Böse“ wiedergegeben.
- source_word: לֹא יִמְאָס
  choice: verwirft er nicht
  rationale: מאס kann verwerfen, verschmähen oder verabscheuen bedeuten. „Verwirft“ wahrt den Gedanken, dass er sich vom Bösen nicht lossagt, ohne eine stärkere Gefühlsreaktion festzulegen.
theological_decisions:
- issue: Stärke der Aussage לֹא יִמְאָס über die Haltung zum Bösen
  choice: „das Böse verwirft er nicht“
  alternative: „das Böse verabscheut er nicht“
  rationale: Der hebräische Ausdruck kann sowohl Ablehnung als auch Abscheu bezeichnen. Die Hauptfassung wahrt die allgemeinere Bedeutung und legt nicht unnötig fest, ob vor allem eine Willensentscheidung oder eine emotionale Abscheu gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Anlehnung an die hebräische Satzfolge und das Wegbild. Die Nachstellung „das Böse verwirft er nicht“ setzt einen natürlichen poetischen Akzent auf das Böse und entspricht dem hebräischen Voranstellen von רָע.
