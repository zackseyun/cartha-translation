source:
  edition: WLC
  text: יְ֭הוָה בְּ/הַ/שָּׁמַ֣יִם חַסְדֶּ֑/ךָ אֱ֝מֽוּנָתְ/ךָ֗ עַד שְׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/005.yaml
  text: O Yahweh[a], your steadfast love is in the heavens; your faithfulness reaches to the clouds.
translation:
  language: de
  text: Jahwe, deine beständige Liebe ist im Himmel[a]; deine Treue reicht bis zu den Wolken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine beständige Liebe reicht bis zum Himmel“. Das Hebräische kann hier statt eines Ortes auch die Ausdehnung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. Die direkte Anrede ergibt sich im Deutschen bereits aus der Anfangsstellung und dem Komma; ein zusätzliches „O“ ist nicht erforderlich.
- source_word: בְּהַשָּׁמַיִם
  choice: ist im Himmel
  rationale: 'Die Präposition בְּ wird zunächst lokal verstanden: „im Himmel“. Das im Hebräischen fehlende Kopulaverb wird für einen natürlichen deutschen Satz ergänzt; der formale hebräische Plural wird idiomatisch mit dem deutschen Kollektivsingular „Himmel“ wiedergegeben.'
- source_word: חַסְדֶּךָ
  choice: deine beständige Liebe
  rationale: חֶסֶד bezeichnet hier verlässliche, bleibende und loyale Liebe. „Beständige Liebe“ ist gegenwärtiges, verständliches Deutsch und verengt den Ausdruck nicht ausdrücklich auf einen theologischen Fachbegriff.
- source_word: אֱמוּנָתְךָ
  choice: deine Treue
  rationale: אֱמוּנָה bezeichnet in der Parallele zu חֶסֶד Gottes Verlässlichkeit und Treue. „Treue“ gibt dies knapp und natürlich wieder.
- source_word: עַד
  choice: reicht bis zu
  rationale: עַד markiert eine Grenze oder Ausdehnung. „Reicht bis zu“ macht diese räumliche Weite im zweiten Versglied idiomatisch sichtbar.
- source_word: שְׁחָקִים
  choice: den Wolken
  rationale: שְׁחָקִים kann poetisch die hohen Himmelssphären oder konkret die Wolken bezeichnen. „Wolken“ bewahrt das anschauliche Bild und den Parallelismus mit „Himmel“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne eine konfessionell geprägte Ersatzform einzuführen.
- issue: Lokale oder ausdehnende Bedeutung von בְּהַשָּׁמַיִם
  choice: deine beständige Liebe ist im Himmel
  alternative: deine beständige Liebe reicht bis zum Himmel
  rationale: Die Präposition בְּ hat primär lokale Kraft, doch der Parallelismus mit עַד im zweiten Versglied erlaubt eine ausdehnende Deutung. Die Hauptfassung wahrt die lokale Lesart; die Fußnote hält die echte Mehrdeutigkeit offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. Die ungewöhnliche lokale Aussage „ist im Himmel“ bleibt quellengetreu stehen; die idiomatisch naheliegende Ausdeutungsalternative wird in der Fußnote geboten.
