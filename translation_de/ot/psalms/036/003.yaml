  text: The words of his mouth are wickedness and deceit; he has ceased to act wisely[a], to do good.
translation:
  language: de
  text: Die Worte seines Mundes sind Unrecht und Trug; er hat aufgehört, verständig zu handeln[a] und Gutes zu tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er hat aufgehört, verständig Gutes zu tun.“ Die beiden hebräischen Infinitive können auch enger miteinander verbunden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי פִיו
  choice: Die Worte seines Mundes
  rationale: Die konkrete hebräische Wendung mit dem Konstruktplural und dem Suffix wird bewahrt und klingt zugleich würdevoll und verständlich.
- source_word: אָוֶן
  choice: Unrecht
  rationale: Im Zusammenhang mit trügerischer Rede bezeichnet das Wort moralisch verwerfliches Handeln beziehungsweise Reden. „Unrecht“ bewahrt die ethische Breite, ohne die Bedeutung unnötig einzuengen.
- source_word: וּמִרְמָה
  choice: und Trug
  rationale: מִרְמָה bezeichnet Täuschung oder Arglist. „Trug“ passt prägnant zur Rede des Mundes und zum gehobenen, aber heutigen Bibelregister.
- source_word: חָדַל
  choice: er hat aufgehört
  rationale: Das Qal Perfekt bezeichnet hier das Aufhören beziehungsweise Ablassen von einer Tätigkeit.
- source_word: לְהַשְׂכִּיל
  choice: verständig zu handeln
  rationale: Das Hiphil von שכל kann Einsicht und daraus folgendes kluges, umsichtiges Handeln ausdrücken. Die Formulierung gibt den praktischen Sinn im Kontext wieder.
- source_word: לְהֵיטִיב
  choice: Gutes zu tun
  rationale: Das Hiphil von יטב bezeichnet hier gutes beziehungsweise wohltuendes Handeln; „Gutes zu tun“ ist natürlich und wahrt die moralische Aussage.
theological_decisions:
- issue: Verhältnis der beiden Infinitive לְהַשְׂכִּיל und לְהֵיטִיב
  choice: Beide werden als parallele Ergänzungen zu „hat aufgehört“ wiedergegeben.
  alternative: „Er hat aufgehört, beim Gutestun verständig zu sein.“
  rationale: Die hebräische Syntax lässt sowohl zwei parallele Tätigkeiten als auch eine engere Verknüpfung zu. Der Haupttext folgt der naheliegenden parallelen Lesart; die Fußnote bewahrt die echte syntaktische Mehrdeutigkeit.
translation_notes:
  register: Modernes Standarddeutsch in einem klaren, würdevollen Bibelregister. Die konkrete Redeweise „Worte seines Mundes“ bleibt erhalten; die syntaktische Mehrdeutigkeit des zweiten Halbverses wird nicht stillschweigend aufgelöst.
