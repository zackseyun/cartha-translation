  text: יִ֭רְוְיֻ/ן מִ/דֶּ֣שֶׁן בֵּיתֶ֑/ךָ וְ/נַ֖חַל עֲדָנֶ֣י/ךָ תַשְׁקֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/008.yaml
  text: They are filled from the richness of your house[b][a], and you give them drink from the river of your delights.
translation:
  language: de
  text: Sie werden von der Fülle deines Hauses satt[a], und du gibst ihnen aus dem Strom deiner Freuden zu trinken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie trinken sich satt an der Fülle deines Hauses.“'
    reason: lexical_alternative
  - marker: b
    text: „Freuden“ kann auch „Wonnen“ oder „Genüsse“ bedeuten; im Hebräischen klingt möglicherweise auch Eden an.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְוְיֻן
  choice: Sie trinken sich satt
  rationale: Die Qal-Form von רוה bezeichnet reichliches Sattwerden beziehungsweise Sich-satt-Trinken. Im Zusammenhang mit תַשְׁקֵם bewahrt diese idiomatische Wiedergabe das durchgehende Trinkbild.
- source_word: מִדֶּשֶׁן
  choice: am Reichtum
  rationale: דֶּשֶׁן bedeutet wörtlich „Fettigkeit“ und bildlich üppige Fülle oder Reichtum. „Reichtum“ erhält die Metapher in natürlichem modernem Deutsch.
- source_word: בֵּיתֶךָ
  choice: deines Hauses
  rationale: Das hebräische Wort bezeichnet schlicht das Haus Gottes. Die Wiedergabe legt weder Tempel noch Haushalt oder himmlische Wohnung als alleinige Deutung fest.
- source_word: וְנַחַל
  choice: aus dem Strom
  rationale: נַחַל kann Bach, Flusslauf oder Strom bezeichnen. „Strom“ passt zur poetischen Vorstellung überströmender, lebensspendender Fülle.
- source_word: עֲדָנֶיךָ
  choice: deiner Wonnen
  rationale: Das Wort bezeichnet Freuden, Annehmlichkeiten oder Wonnen. „Wonnen“ ist poetisch und würdevoll und lässt einen möglichen sprachlichen Anklang an Eden bestehen, ohne ihn ausdrücklich in den Text einzutragen.
- source_word: תַשְׁקֵם
  choice: du lässt sie … trinken
  rationale: Der Hifil von שקה bedeutet, jemanden trinken zu lassen oder ihm zu trinken zu geben. Die Formulierung bewahrt Gottes aktive Rolle und klingt im Deutschen natürlich.
theological_decisions:
- issue: Bild vom Haus Gottes
  choice: „deines Hauses“ ohne nähere Festlegung
  alternative: „deines Tempels“, „deines Haushalts“ oder „deiner Wohnstätte“
  rationale: Der poetische Text benennt das Haus Gottes, bestimmt aber nicht eindeutig, ob Tempel, Haushalt oder himmlische Wohnung gemeint ist. Die Übersetzung bewahrt diese Offenheit.
- issue: Möglicher Anklang an Eden
  choice: „deiner Wonnen“ im Haupttext; Eden-Anklang in der Fußnote
  alternative: „deiner Edenfreuden“ oder ausdrückliche Nennung Edens
  rationale: עֲדָנֶיךָ kann lautlich und begrifflich an Eden erinnern, bezeichnet unmittelbar jedoch Gottes Wonnen beziehungsweise Freuden. Eine ausdrückliche Nennung Edens würde die mögliche Anspielung zu stark festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Bildsprache. Das wiederholte Trinkmotiv verbindet beide Vershälften; „Haus“ und der mögliche Eden-Anklang bleiben bewusst deutungsoffen.
