- from: Sie trinken sich satt am Reichtum deines Hauses[a], und du lässt sie aus dem Strom deiner Wonnen trinken.[b]
  to: Sie werden von der Fülle deines Hauses satt[a], und du gibst ihnen aus dem Strom deiner Freuden zu trinken.[b]
  rationale: Die Revision gibt יִרְוְיוּן als Sattwerden von der üppigen Fülle wieder, ohne ein im Deutschen unnatürliches Satttrinken „am Reichtum“ zu erzeugen. Die Trinkmetaphorik bleibt im zweiten Halbvers ausdrücklich erhalten. „Haus“ wird nicht näher bestimmt; der mögliche Eden-Anklang bleibt, ohne ihn in den Haupttext einzutragen, in der Fußnote.
