  variant: modern standard German
source:
  edition: WLC
  text: מְשֹׁ֣ךְ חַ֭סְדְּ/ךָ לְ/יֹדְעֶ֑י/ךָ וְ֝/צִדְקָֽתְ/ךָ֗ לְ/יִשְׁרֵי לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/010.yaml
  text: Continue your steadfast love to those who know you[b][a], and your righteousness to the upright in heart.
translation:
  language: de
  text: Erweise weiterhin[a] denen, die dich kennen, deine treue Liebe und denen, die aufrichtigen Herzens sind, deine Gerechtigkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Zieh deine treue Liebe hin«; sinngemäß auch: »Lass deine treue Liebe fortdauern« oder »Weite sie aus«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »dein Recht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשֹׁךְ
  choice: Erweise weiterhin
  rationale: Das Imperativverb bedeutet wörtlich »ziehen, ausstrecken, verlängern«. In Verbindung mit Gottes חֶסֶד gibt »Erweise weiterhin« die Bitte um die fortdauernde Zuwendung Gottes in natürlichem Deutsch wieder, ohne das Bild völlig unkenntlich zu machen; die wörtlichere Möglichkeit wird in einer Fußnote genannt.
- source_word: חַסְדְּךָ
  choice: deine treue Liebe
  rationale: חֶסֶד bezeichnet hier Gottes beständige, verlässliche und beziehungsbezogene Zuwendung. »Treue Liebe« bewahrt sowohl den Aspekt der Liebe als auch den der Loyalität besser als das enger gefasste »Barmherzigkeit«.
- source_word: לְיֹדְעֶיךָ
  choice: denen, die dich kennen
  rationale: Die substantivierte Partizipialform bezeichnet Menschen, die Gott kennen. Die Formulierung ist verständlich und lässt die im Hebräischen mögliche relationale Tiefe des Erkennens bestehen.
- source_word: וְצִדְקָתְךָ
  choice: und … deine Gerechtigkeit
  rationale: צְדָקָה umfasst gerechtes, richtiges und verlässliches Handeln. »Gerechtigkeit« erhält diese Breite; »Recht« bleibt als mögliche kontextuelle Wiedergabe in der Fußnote erhalten.
- source_word: לְיִשְׁרֵי לֵב
  choice: denen, die aufrichtigen Herzens sind
  rationale: Die hebräische Wendung bezeichnet innere Geradheit und Lauterkeit. »Aufrichtigen Herzens« ist im Deutschen idiomatisch, würdevoll und hält den Bezug auf die innere Haltung fest.
theological_decisions:
- issue: Parallele Bezeichnung göttlicher Eigenschaften
  choice: חֶסֶד mit »treue Liebe« und צְדָקָה mit »Gerechtigkeit« wiedergeben
  alternative: חֶסֶד als »Barmherzigkeit« oder »Güte« und צְדָקָה als »Recht« wiedergeben
  rationale: Die gewählte Wiedergabe erhält die poetische Verbindung von Gottes loyaler Zuwendung und seinem gerechten Handeln, ohne den Vers auf eine ausschließlich forensische oder konfessionell geprägte Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung macht die beiden parallelen Empfängergruppen deutlich und vermeidet altertümliche Formen; »aufrichtigen Herzens« bewahrt zugleich den poetischen Ton.
