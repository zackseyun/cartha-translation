  text: נְאֻֽם פֶּ֣שַׁע לָ֭/רָשָׁע בְּ/קֶ֣רֶב לִבִּ֑/י אֵֽין פַּ֥חַד אֱ֝לֹהִ֗ים לְ/נֶ֣גֶד עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/001.yaml
  text: 'Transgression speaks to the wicked within my heart: there is no fear of God before his eyes[a][b].'
translation:
  language: de
  text: In meinem Herzen spricht die Auflehnung zum Frevler:[a] Furcht vor Gott steht ihm nicht vor Augen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ein Spruch der Auflehnung an den Frevler ist in meinem Herzen.“ Der hebräische Text lautet „meinem Herzen“; einige alte Übersetzungen und zahlreiche neuere Übertragungen lesen oder deuten stattdessen „in seinem Herzen“.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Es gibt keine Furcht vor Gott vor seinen Augen.“ Gemeint ist, dass der Frevler die Furcht vor Gott nicht vor Augen hat und sie nicht berücksichtigt.'
    reason: idiom
lexical_decisions:
- source_word: נְאֻם
  choice: spricht
  rationale: Das Substantiv bezeichnet einen feierlichen Spruch oder Ausspruch. Die verbale Wiedergabe „spricht“ ergibt im Deutschen einen natürlichen Satz und bewahrt den Charakter einer maßgeblichen inneren Stimme.
- source_word: פֶּשַׁע
  choice: Auflehnung
  rationale: Das Wort bezeichnet bewusste Übertretung beziehungsweise Rebellion. „Auflehnung“ bewahrt hier die aktive, personifiziert sprechende Kraft des Ausdrucks.
- source_word: לָרָשָׁע
  choice: zum Frevler
  rationale: Die Präposition ל wird als Kennzeichnung des Adressaten verstanden. „Frevler“ gibt den repräsentativen Singular wieder und bezeichnet einen Menschen, der bewusst Unrecht tut.
- source_word: בְּקֶרֶב לִבִּי
  choice: in meinem Herzen
  rationale: Der masoretische Text hat eindeutig die erste Person Singular. Die schwierige Formulierung wird beibehalten und durch Voranstellung im Deutschen eindeutig auf das Sprechen bezogen.
- source_word: אֵין פַּחַד אֱלֹהִים
  choice: Furcht vor Gott steht ihm nicht vor Augen
  rationale: „Furcht vor Gott“ kann ehrfürchtige Scheu ebenso wie das Bewusstsein göttlichen Gerichts bezeichnen. Die Übersetzung schränkt diese Spannweite nicht auf bloßen Schrecken ein.
- source_word: לְנֶגֶד עֵינָיו
  choice: steht ihm nicht vor Augen
  rationale: Die deutsche Wendung bewahrt das hebräische Bild dessen, was jemand vor Augen hat und in Betracht zieht.
theological_decisions:
- issue: Perspektive in לִבִּי („meinem Herzen“)
  choice: 'Die erste Person des masoretischen Textes wird beibehalten: „In meinem Herzen“ bezeichnet den Ort, an dem der Psalmist den Spruch der Auflehnung wahrnimmt.'
  alternative: '„In seinem Herzen“, bezogen auf den Frevler, oder deutender: „Ich erkenne in meinem Herzen, wie es um den Frevler steht“.'
  rationale: Die überlieferte hebräische Lesart ist schwierig, aber klar als erste Person markiert. Eine Änderung zur dritten Person würde die Spannung glätten, ohne dass dies vom masoretischen Text getragen wird.
- issue: Bedeutungsumfang von פַּחַד אֱלֹהִים
  choice: „Furcht vor Gott“
  alternative: „Schrecken vor Gott“ oder „Ehrfurcht vor Gott“
  rationale: Der Ausdruck lässt sowohl ehrfürchtige Scheu als auch das Bewusstsein von Gottes Gericht anklingen. „Furcht vor Gott“ bewahrt diesen Bedeutungsumfang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Frevler“ ist bewusst gehoben, aber verständlich und trägt das moralische Gewicht von רָשָׁע. Die Personifikation der Auflehnung und die schwierige erste Person „meinem Herzen“ bleiben erhalten.
