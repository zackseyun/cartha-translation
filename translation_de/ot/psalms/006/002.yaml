  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י אֻמְלַ֫ל אָ֥נִי רְפָאֵ֥/נִי יְהוָ֑ה כִּ֖י נִבְהֲל֣וּ עֲצָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/002.yaml
  text: Be gracious to me[a], O Yahweh, for I am weak; heal me, O Yahweh[b], for my bones are trembling.
translation:
  language: de
  text: Sei mir gnädig, Jahwe, denn ich bin kraftlos[a]. Heile mich, Jahwe, denn meine Gebeine sind erschüttert[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn ich sieche dahin“; das Hebräische beschreibt Schwäche, Entkräftung oder ein Dahinschwinden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn meine Gebeine sind bestürzt“ beziehungsweise „zittern“. „Gebeine“ kann tiefe körperliche und innere Not ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Sei mir gnädig
  rationale: Der Imperativ von חנן bittet um Gunst und Gnade. Die Formulierung ist im Deutschen natürlich, würdevoll und näher am hebräischen Ausdruck als eine ausschließliche Festlegung auf „Erbarme dich“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt in beiden Satzhälften den Grund für die vorausgehende Bitte an; „denn“ bewahrt diese kausale Funktion und den poetischen Ton.
- source_word: אֻמְלַל
  choice: kraftlos
  rationale: Das Wort bezeichnet einen Zustand des Dahinschwindens, der Schwäche oder Entkräftung. „Kraftlos“ ist verständlich und lässt den möglichen Aspekt des Siechens offen.
- source_word: רְפָאֵנִי
  choice: Heile mich
  rationale: רפא bedeutet unmittelbar „heilen“. Die direkte Bitte bewahrt sowohl die mögliche körperliche als auch die umfassendere persönliche Not.
- source_word: נִבְהֲלוּ
  choice: sind erschüttert
  rationale: בהל kann Bestürzung, Schrecken oder heftige Beunruhigung ausdrücken. Bei den „Gebeinen“ vermittelt „erschüttert“ eine tiefe körperliche und innere Erschütterung, ohne die Bedeutung auf sichtbares Zittern zu verengen.
- source_word: עֲצָמָי
  choice: meine Gebeine
  rationale: Die konkrete hebräische Metapher wird bewahrt. „Gebeine“ passt zum würdevollen poetischen Register und kann den ganzen Menschen in seiner tiefsten körperlichen oder inneren Not bezeichnen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art der beschriebenen Not
  choice: Körperliche und innere Erschütterung werden offengehalten
  alternative: Ausschließlich körperliches Zittern
  rationale: Die Verbindung von „heile mich“, „meine Gebeine“ und בהל kann Krankheit, Schrecken und tiefe innere Not zugleich ausdrücken. Die Übersetzung entscheidet nicht unnötig zwischen diesen Dimensionen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Parallelstruktur. „Sei mir gnädig“ und „Gebeine“ wahren den gehobenen Psalmton, bleiben aber allgemein verständlich; die Fußnoten erhalten die echten lexikalischen Alternativen.
