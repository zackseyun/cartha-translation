id: PSA.6.8
reference: Psalms 6:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ס֣וּרוּ מִ֭מֶּ/נִּי כָּל פֹּ֣עֲלֵי אָ֑וֶן כִּֽי שָׁמַ֥ע יְ֝הוָ֗ה ק֣וֹל בִּכְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/008.yaml
  text: Depart from me[a], all you workers of wickedness[b], for Yahweh has heard the sound of my weeping.
translation:
  language: de
  text: Weicht von mir, ihr alle, die ihr Unrecht tut![a] Denn Jahwe hat den Laut meines Weinens gehört.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „alle Täter des Unrechts“; auch möglich: „alle Übeltäter“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „die Stimme/den Laut meines Weinens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ מִמֶּנִּי
  choice: Weicht von mir
  rationale: Der pluralische Imperativ von סור fordert die Angeredeten nachdrücklich auf, sich zu entfernen. „Weicht von mir“ ist prägnant, würdevoll und bewahrt die räumliche Bildsprache.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: ihr alle, die ihr Unrecht tut
  rationale: Die Anrede gibt כָּל ausdrücklich wieder und bewahrt in natürlichem Deutsch den Handlungsaspekt von פֹּעֲלֵי. אָוֶן bezeichnet hier schädliches, böses oder unrechtes Tun.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung für die vorausgehende Aufforderung ein.
- source_word: שָׁמַע
  choice: hat … gehört
  rationale: Das Perfekt bezeichnet ein als geschehen gewusstes Hören mit gegenwärtiger Bedeutung; das deutsche Perfekt bringt diese Gewissheit natürlich zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Form der wissenschaftlichen Umschrift.
- source_word: קוֹל בִּכְיִי
  choice: den Laut meines Weinens
  rationale: קוֹל bezeichnet Stimme oder Laut. Zusammen mit בִּכְיִי ist „der Laut meines Weinens“ sachlich genau und erhält die hörbare Dimension der Klage, ohne artikulierte Worte vorauszusetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen und nicht den Titel אֲדֹנָי. Die Wiedergabe als „Jahwe“ bewahrt diesen Unterschied.
- issue: Charakter der Aussage שָׁמַע יְהוָה
  choice: Jahwe hat … gehört
  alternative: Jahwe hörte …
  rationale: Das Perfekt stellt das Hören als feststehende Wirklichkeit dar. Die Übersetzung wahrt die zuversichtliche Aussage des Psalmbeters, ohne darüber hinaus zu bestimmen, wie oder wann die erwartete Antwort erfolgt.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit poetischer Würde. „Weicht von mir“ erhält den nachdrücklichen Ton der direkten Anrede; „den Laut meines Weinens“ ist bewusst etwas poetischer, um קוֹל nicht auszulassen.
