source:
  edition: WLC
  text: שָׁמַ֣ע יְ֭הוָה תְּחִנָּתִ֑/י יְ֝הוָ֗ה תְּֽפִלָּתִ֥/י יִקָּֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/009.yaml
  text: Yahweh has heard my plea[a]; Yahweh will receive my prayer.
translation:
  language: de
  text: Jahwe hat mein Flehen gehört; Jahwe wird mein Gebet annehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird mein Gebet nehmen“; gemeint sein kann auch: „wird mein Gebet aufnehmen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift gibt den Gottesnamen direkt wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: שָׁמַע
  choice: hat gehört
  rationale: Das Qatal bezeichnet hier eine als geschehen bezeugte Handlung, deren Bedeutung für die Gegenwart fortbesteht.
- source_word: תְּחִנָּה
  choice: Flehen
  rationale: Das Wort bezeichnet eine eindringliche Bitte um Gnade; „Flehen“ bewahrt Dringlichkeit und unterscheidet sich vom folgenden „Gebet“.
- source_word: תְּפִלָּה
  choice: Gebet
  rationale: Dies ist die geläufige Bezeichnung für ein Gebet und erhält den lexikalischen Wechsel im hebräischen Parallelismus.
- source_word: לָקַח
  choice: wird … annehmen
  rationale: Das Verb bedeutet wörtlich „nehmen“, bezeichnet bei einem Gebet aber idiomatisch dessen Annahme. Die Zukunftsform gibt die zuversichtliche Präfixkonjugation natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; die Umschrift bewahrt diese Besonderheit, ohne ihn durch einen Titel zu ersetzen.
- issue: Gewissheit über die Annahme des Gebets
  choice: wird mein Gebet annehmen
  alternative: nimmt mein Gebet an
  rationale: Die Zukunftsform wahrt die grammatische Offenheit der hebräischen Präfixkonjugation und bringt im Kontext die Zuversicht des Beters zum Ausdruck, ohne die Aussage als bereits vollzogen festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Flehen“ bewahrt die emotionale Eindringlichkeit, während „Gebet annehmen“ die hebräische Wendung verständlich und ohne konfessionelle Zuspitzung wiedergibt.
