  verdict: revise
  source_fidelity: 'Die Grundstruktur und die Singularform von עֵינִי sind zutreffend wiedergegeben. „Verfallen“ ist für ein Auge im heutigen Deutsch jedoch semantisch und idiomatisch ungeeignet: Es legt eher moralischen, rechtlichen oder baulichen Verfall nahe. עָשְׁשָׁה bezeichnet hier das Schwach-, Matt- oder Trübwerden. Die zweite, bildhafte Aussage von vorzeitiger Alterung wird mit „gealtert“ klarer bewahrt.'
  naturalness: „Mein Auge ist vor Kummer verfallen“ klingt im modernen Standarddeutsch unnatürlich. „Matt geworden“ ist eine geläufige, würdige poetische Formulierung und wahrt die körperlich-visuelle Offenheit des hebräischen Bildes. Die Wiederaufnahme durch „es“ macht die Satzfügung klar.
  terminology: „Kummer“, „Feinde“ und „Bedränger“ passen zum Klagepsalm und treffen die lexikalische Spannweite ohne konfessionelle Zuspitzung. „Gealtert“ bewahrt die Metapher von עָתְקָה besser als eine rein funktionale Umschreibung.
  issues:
