lexical_decisions:
- source_word: עָשְׁשָׁה
  choice: ist verfallen
  rationale: Das Verb bezeichnet ein Schwinden oder Verfallen. Beim Auge bewahrt „ist verfallen“ das körperliche Bild, ohne die Bedeutung ausschließlich auf nachlassende Sehkraft einzuengen.
- source_word: מִכַּעַס
  choice: vor Kummer
  rationale: כַּעַס kann Kummer, Verdruss oder Erregung bezeichnen. Im Klagezusammenhang gibt „vor Kummer“ die emotionale Ursache des körperlichen Verfalls natürlich wieder; „vor Verdruss“ bleibt möglich.
- source_word: עֵינִי
  choice: Mein Auge
  rationale: Der hebräische Text hat den Singular mit Suffix der ersten Person. Der Singular ist auch im Deutschen als dichterische Bezeichnung des vom Weinen und Leid betroffenen Auges verständlich.
- source_word: עָתְקָה
  choice: ist alt geworden
  rationale: Das Verb bezeichnet das Alt- oder Abgenutztwerden. Die wörtlich-metaphorische Wendung bewahrt die starke Vorstellung vorzeitiger Alterung durch Bedrängnis.
- source_word: בְּכָל
  choice: wegen all
  rationale: Die Präposition bezeichnet hier am natürlichsten den Anlass oder die Ursache des Zustands. „Wegen all meiner Feinde“ gibt diesen kausalen Zusammenhang idiomatisch wieder.
- source_word: צוֹרְרָי
  choice: meiner Feinde
  rationale: Die Form bezeichnet Menschen, die feindlich bedrängen oder widerstehen. „Feinde“ ist im deutschen Klagepsalm natürlich und hinreichend kräftig.
