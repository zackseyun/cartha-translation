  text: My eye has wasted away from grief[a]; it has grown old because of all my enemies.
translation:
  language: de
  text: Mein Auge ist vor Kummer matt geworden[a]; es ist gealtert wegen all meiner Feinde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mein Auge ist vor Verdruss trübe geworden; es ist durch all meine Bedränger abgenutzt worden.“'
