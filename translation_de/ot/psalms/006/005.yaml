  terminology: „Scheol“ ist als Transliteration sachgerecht und wird durch die Fußnote verständlich erläutert. „Dankt dir“ ist für ידה eine direkte, gut verständliche Wiedergabe; die Fußnote nennt mit „Grab“ und „Totenreich“ sinnvolle lexikalische Alternativen, ohne den Begriff im Haupttext einzuengen.
