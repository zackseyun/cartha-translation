  source_fidelity: Die Übersetzung gibt die begründende Partikel כִּי mit „Denn“ treffend wieder. „Im Tod denkt niemand an dich“ entspricht der existenziellen Verneinung „es gibt kein Gedenken an dich“ idiomatisch und ohne unzulässige dogmatische Zuspitzung. „Im Scheol“ bewahrt שְׁאוֹל als eigenständigen hebräischen Begriff; die rhetorische Frage „wer dankt dir?“ gibt מִי יוֹדֶה לָּךְ angemessen wieder. Das deutsche Präsens kann hier die allgemeingültig-rhetorische Kraft des hebräischen Imperfekts tragen.
