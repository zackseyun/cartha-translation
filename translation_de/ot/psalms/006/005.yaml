source:
  edition: WLC
  text: כִּ֤י אֵ֣ין בַּ/מָּ֣וֶת זִכְרֶ֑/ךָ בִּ֝/שְׁא֗וֹל מִ֣י יֽוֹדֶה לָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/005.yaml
  text: For in death there is no remembrance of you[a]; in Sheol who will give thanks to you?
translation:
  language: de
  text: Denn im Tod denkt niemand an dich; im Scheol, wer dankt dir? [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Grab“ oder „im Totenreich“ statt „im Scheol“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Bitte ein und bewahrt den erklärenden Zusammenhang.
- source_word: אֵין בַּמָּוֶת זִכְרֶךָ
  choice: im Tod denkt niemand an dich
  rationale: Gibt die hebräische Existenzverneinung im Deutschen natürlich wieder. זִכְרֶךָ kann das Erinnern beziehungsweise rühmende Erwähnen Gottes bezeichnen; die Formulierung lässt diesen Bedeutungsraum offen.
- source_word: בִּשְׁאוֹל
  choice: im Scheol
  rationale: Die Transliteration bewahrt den eigenständigen hebräischen Begriff für den Bereich der Toten, ohne ihn auf das einzelne Grab zu verengen.
- source_word: מִי יוֹדֶה לָּךְ
  choice: wer dankt dir?
  rationale: ידה im Hifil bezeichnet häufig das Danken oder Preisen. „Dankt dir“ ist knapp, verständlich und erhält die rhetorische Frage.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: das Grab; das Totenreich
  rationale: „Scheol“ bewahrt die kulturelle und theologische Eigenart des hebräischen Ausdrucks und vermeidet eine vorschnelle Gleichsetzung mit dem Grab oder einer später ausgeformten Vorstellung vom Jenseits.
- issue: Aussage über das Gedenken Gottes im Tod
  choice: als rhetorische Begründung innerhalb des Klagegebets wiedergegeben
  alternative: als umfassende dogmatische Aussage über den Zustand der Toten verstanden
  rationale: Der Vers spricht poetisch aus der Perspektive des Beters. Die Übersetzung verschärft oder harmonisiert diese Spannung nicht.
translation_notes:
  register: Moderne, würdige und knappe Gebetssprache. Die parallelen Ortsangaben „im Tod“ und „im Scheol“ sowie die rhetorische Zuspitzung des zweiten Halbverses bleiben erhalten. Der Fußnotenmarker steht am Satzende, da er den Ausdruck „Scheol“ erläutert.
