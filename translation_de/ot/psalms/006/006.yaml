  text: יָגַ֤עְתִּי בְּֽ/אַנְחָתִ֗/י אַשְׂחֶ֣ה בְ/כָל לַ֭יְלָה מִטָּתִ֑/י בְּ֝/דִמְעָתִ֗/י עַרְשִׂ֥/י אַמְסֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/006.yaml
  text: I am weary with my groaning[a]; every night I drench my bed[b]; with my tears I soak my couch.
translation:
  language: de
  text: Ich bin erschöpft von meinem Seufzen; Nacht für Nacht überflute ich mein Bett[a], mit meinen Tränen durchtränke ich mein Lager.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „lasse ich mein Bett schwimmen“; das ist eine poetische Übertreibung für das Überfluten mit Tränen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי
  choice: Ich bin erschöpft
  rationale: Das Verb bezeichnet Ermüdung oder Erschöpfung infolge anhaltender Belastung. Das deutsche Präsens gibt den aus dem Leiden hervorgegangenen gegenwärtigen Zustand natürlich wieder.
- source_word: בְּאַנְחָתִי
  choice: von meinem Seufzen
  rationale: אַנְחָה kann Seufzen oder Stöhnen bezeichnen. „Seufzen“ passt zum Klagekontext; „von“ versteht die Präposition als Angabe der Ursache der Erschöpfung.
- source_word: בְכָל לַיְלָה
  choice: Nacht für Nacht
  rationale: Die Wendung bezeichnet hier am natürlichsten ein wiederkehrendes Geschehen und nicht lediglich die Dauer einer einzelnen Nacht.
- source_word: אַשְׂחֶה
  choice: überflute ich
  rationale: Der Hifil bezeichnet wörtlich ein Schwimmenlassen. „Überfluten“ vermittelt die poetische Übertreibung im Deutschen verständlich, ohne das starke Bild abzuschwächen.
- source_word: מִטָּתִי
  choice: mein Bett
  rationale: מִטָּה ist die übliche Bezeichnung für ein Bett oder eine Schlafstätte.
- source_word: בְּדִמְעָתִי
  choice: mit meinen Tränen
  rationale: Die Präposition bezeichnet hier das Mittel; die Formulierung bewahrt das konkrete Bild.
- source_word: עַרְשִׂי
  choice: mein Lager
  rationale: עֶרֶשׂ bezeichnet ein Lager oder Ruhebett. „Lager“ bewahrt die lexikalische Variation gegenüber מִטָּה.
- source_word: אַמְסֶה
  choice: durchtränke ich
  rationale: Der Hifil von מסס bedeutet grundsätzlich „zum Schmelzen/Auflösen bringen“; im Zusammenhang beschreibt er bildhaft ein völliges Durchnässen. „Durchtränken“ gibt dieses Ergebnis klar und kräftig wieder.
