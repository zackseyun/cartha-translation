  text: שׁוּבָ֣/ה יְ֭הוָה חַלְּצָ֣/ה נַפְשִׁ֑/י ה֝וֹשִׁיעֵ֗/נִי לְמַ֣עַן חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/004.yaml
  text: Return, O LORD; rescue my life; save me for the sake of your steadfast love.
translation:
  language: de
  text: Kehre zurück, HERR; rette mein Leben; rette mich um deiner beständigen Liebe willen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוּבָה
  choice: Kehre zurück
  rationale: Der Imperativ von שׁוב wird direkt wiedergegeben; die offene räumliche bzw. relationale Bedeutung bleibt erhalten.
- source_word: חַלְּצָה נַפְשִׁי
  choice: entreiß mein Leben dem Tod
  rationale: חלץ bezeichnet das Herausreißen oder Befreien; נפשׁ meint hier im Kontext das bedrohte Leben bzw. die Person, nicht einen vom Körper getrennten Seelenteil. „dem Tod“ verdeutlicht die im Psalmzusammenhang erkennbare Gefahr.
- source_word: הוֹשִׁיעֵנִי
  choice: rette mich
  rationale: Der Hifil-Imperativ von ישׁע ist mit der geläufigen und sachlich passenden Bitte „rette mich“ wiedergegeben.
- source_word: לְמַעַן חַסְדֶּךָ
  choice: um deiner beständigen Liebe willen
  rationale: חסד bezeichnet Gottes verlässliche, treue Zuwendung; „beständige Liebe“ bewahrt sowohl den Beziehungscharakter als auch die Dauerhaftigkeit.
theological_decisions:
- issue: Gottesname יהוה
  choice: HERR
  alternative: Jahwe
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen wird beibehalten und unterscheidet den Gottesnamen von gewöhnlichem „Herr“.
- issue: Bedeutung von נפשׁ
  choice: mein Leben
  alternative: meine Seele
  rationale: Im unmittelbaren Kontext bittet der Sprecher um Rettung aus Todesgefahr. „Leben“ vermeidet eine sachfremde anthropologische Festlegung, ohne die persönliche Ganzheit des Beters auszuschließen.
- issue: Grund der Rettung
  choice: um deiner beständigen Liebe willen
  alternative: wegen deiner Gnade
  rationale: Die Formulierung lässt stehen, dass der Beter Gottes eigenes חסד als Grund anruft, ohne daraus eine weitergehende Lehrformel abzuleiten.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die parallelen Imperative und die direkte Anrede bleiben erhalten; das Semikolon bildet die hebräische Folge knapper Bitten ab.
