  text: יֵבֹ֤שׁוּ וְ/יִבָּהֲל֣וּ מְ֭אֹד כָּל אֹיְבָ֑/י יָ֝שֻׁ֗בוּ יֵבֹ֥שׁוּ רָֽגַע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/010.yaml
  text: Let all my enemies be ashamed and greatly terrified[a]; let them turn back and be ashamed in an instant.
translation:
  language: de
  text: Mögen alle meine Feinde beschämt werden und sehr erschrecken[a]; mögen sie umkehren und plötzlich beschämt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Erwartung: „Alle meine Feinde werden beschämt werden und sehr erschrecken; sie werden umkehren und plötzlich beschämt werden.“ „Sehr erschrecken“ kann auch als „zutiefst bestürzt werden“ wiedergegeben werden.'
    reason: Die hebräischen Imperfektformen können im Gebetszusammenhang als Wunsch beziehungsweise Bitte, aber auch als zuversichtliche Erwartung verstanden werden. בהל bezeichnet heftigen Schrecken oder Bestürzung.
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: sollen beschämt werden
  rationale: Das Qal-Imperfekt hat hier im poetischen Zusammenhang den Charakter eines Wunsches oder einer Bitte. „Beschämt werden“ gibt בוש als Erfahrung von Scham und Niederlage wieder, ohne den Verursacher ausdrücklich zu benennen.
- source_word: וְיִבָּהֲלוּ מְאֹד
  choice: und von großem Schrecken erfasst werden
  rationale: בהל bezeichnet heftigen, oft plötzlich einsetzenden Schrecken oder Bestürzung; מְאֹד verstärkt dies. Die Formulierung ist natürliches, würdiges Deutsch und bewahrt die starke emotionale Wirkung.
- source_word: כָּל אֹיְבָי
  choice: alle meine Feinde
  rationale: Dies ist die direkte und idiomatische Wiedergabe der Konstruktverbindung mit dem Suffix der ersten Person.
- source_word: יָשֻׁבוּ
  choice: sie sollen zurückweichen
  rationale: שוב bedeutet „umkehren, zurückkehren“. Im Zusammenhang feindlicher Gegner bringt „zurückweichen“ die gemeinte Abwendung beziehungsweise den Rückzug zum Ausdruck, ohne ein ausführliches militärisches Bild einzutragen.
- source_word: יֵבֹשׁוּ
  choice: beschämt werden
  rationale: Die Wiederholung von בוש wird beibehalten, um die poetische Betonung des Hebräischen zu wahren.
- source_word: רָגַע
  choice: augenblicklich
  rationale: Das Wort wird hier adverbial gebraucht und bezeichnet Plötzlichkeit beziehungsweise unmittelbares Eintreten. „Augenblicklich“ ist prägnant und idiomatisch.
theological_decisions:
- issue: Aussageform der Verben
  choice: Wunsch beziehungsweise Bitte mit „sollen“
  alternative: Vorhersage mit „werden“
  rationale: Die hebräischen Imperfektformen können formal auch zukunftsbezogen verstanden werden; im Klage- und Gebetszusammenhang liegt jedoch eine jussivische Bitte nahe. Die Fußnote wahrt die mögliche Lesart als Feststellung beziehungsweise Erwartung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Wiederholung von „beschämt werden“ bleibt erhalten; „von großem Schrecken erfasst“ vermeidet eine ungewöhnliche deutsche Verbindung wie „sehr erschrocken werden“.
