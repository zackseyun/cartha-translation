  text: וְ֭/נַפְשִׁ/י נִבְהֲלָ֣ה מְאֹ֑ד ו/את יְ֝הוָ֗ה עַד מָתָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/003.yaml
  text: And my soul is greatly troubled—but you[a], O Yahweh[d][c][b], how long?
translation:
  language: de
  text: Auch meine Seele ist zutiefst verstört. Doch du, Jahwe[a] — wie lange noch?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell »der HERR« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: Auch meine Seele
  rationale: נֶפֶשׁ kann »Seele«, »Leben« oder die ganze Person bezeichnen. »Meine Seele« bewahrt hier die poetische Ausdrucksweise und den Bezug auf das innere Erleben; וְ wird im Anschluss an den vorigen Vers natürlich mit »auch« wiedergegeben.
- source_word: נִבְהֲלָה מְאֹד
  choice: ist zutiefst erschrocken
  rationale: בהל bezeichnet heftiges Erschrecken, Bestürzung oder Verstörung; מְאֹד verstärkt den Ausdruck. »Zutiefst erschrocken« gibt die starke innere Erschütterung in natürlichem Deutsch wieder, ohne sie eindeutig auf bloße Angst festzulegen.
- source_word: וְאַתָּה
  choice: Doch du
  rationale: Die Konjunktion וְ bedeutet formal »und«, markiert hier aber eine scharfe Wendung von der Not des Betenden zur direkten Anrede Gottes. »Doch du« bildet diesen spannungsvollen, unvollständigen Zuruf idiomatisch ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname »Jahwe« wiedergegeben; die traditionelle Wiedergabe »der HERR« wird in einer Fußnote genannt.
- source_word: עַד מָתָי
  choice: wie lange noch?
  rationale: Die geläufige Klageformel fragt dringlich nach dem Ende der gegenwärtigen Not. »Wie lange noch?« ist im Deutschen natürlich und bewahrt die emotionale Dringlichkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. Die Umschrift »Jahwe« wahrt seinen Charakter als Eigenname; die traditionelle deutsche Ersatzlesung wird als Alternative dokumentiert.
- issue: Unvollständigkeit des Zurufs וְאַתָּה יְהוָה עַד־מָתָי
  choice: Doch du, Jahwe — wie lange noch?
  alternative: Und du, Jahwe, bis wann?
  rationale: Der hebräische Satz lässt offen, was Jahwe tun oder wie lange er warten wird. Der Gedankenstrich bewahrt diesen abgebrochenen, spannungsvollen Charakter, statt ein Verb oder eine konkrete Bitte zu ergänzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Knappheit. Der Gedankenstrich erhält den abrupten Umschwung und die im Hebräischen nicht ausdrücklich vervollständigte Frage.
