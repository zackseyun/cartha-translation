base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], and do not discipline me in your wrath.
translation:
  language: de
  text: Jahwe, weise mich nicht in deinem Zorn zurecht und diszipliniere mich nicht in deinem Grimm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen unmittelbar angeredeten Gottesnamen in der im Deutschen etablierten Form wieder.
- source_word: אַל
  choice: nicht
  rationale: Mit den folgenden Verbformen drückt die Negationspartikel hier eine eindringliche Bitte aus; im Deutschen wird sie natürlich durch den verneinten Imperativ wiedergegeben.
- source_word: בְּאַפְּךָ
  choice: in deinem Zorn
  rationale: אַף bezeichnet wörtlich die Nase, idiomatisch jedoch den Zorn. Die Präposition בְּ wird hier natürlich mit „in“ wiedergegeben.
- source_word: תוֹכִיחֵנִי
  choice: weise mich zurecht
  rationale: Der Hifil von יכח bezeichnet hier das tadelnde Zurechtweisen. Die Wendung ist modern, klar und bewahrt den korrigierenden Sinn.
- source_word: וְאַל
  choice: und … nicht
  rationale: Bewahrt die verbindende Konjunktion und die parallele Verneinung des zweiten Versglieds.
- source_word: בַּחֲמָתְךָ
  choice: in deinem Grimm
  rationale: חֵמָה bezeichnet heftigen, glühenden Zorn. „Grimm“ erhält die poetische Intensität und unterscheidet den Ausdruck von אַף.
- source_word: תְיַסְּרֵנִי
  choice: züchtige mich
  rationale: Der Piel von יסר kann erziehen, zurechtbringen oder durch Strafe disziplinieren bedeuten. „Züchtigen“ wahrt diese Breite und den würdevollen poetischen Ton, ohne eindeutig auf bloße Bestrafung festgelegt zu sein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Unterscheidung der beiden Ausdrücke für göttlichen Zorn
  choice: Zorn / Grimm
  alternative: Zorn / Zorn
  rationale: Die beiden verwandten, aber unterschiedlichen hebräischen Wörter אַף und חֵמָה werden differenziert wiedergegeben. So bleiben Parallelismus und Intensivierung erkennbar.
- issue: Sinn von יסר
  choice: züchtigen
  alternative: erziehen / bestrafen
  rationale: Der Kontext lässt sowohl korrigierende Disziplin als auch schmerzhafte Ahndung anklingen. „Züchtigen“ bewahrt diese Spannung, ohne sie einseitig auf Erziehung oder Vergeltung zu verengen.
translation_notes:
  register: Poetisch, eindringlich und würdevoll, zugleich in moderner Standardsyntax. Die parallele Satzstruktur des Hebräischen bleibt erhalten; die unterschiedlichen Begriffe für Zorn und korrigierendes Handeln werden nicht eingeebnet.
