base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/000.yaml
  text: 'For the choirmaster: with stringed instruments, according to the Sheminith[a]. A psalm of David[b].'
translation:
  language: de
  text: Für den musikalischen Leiter. Mit Saiteninstrumenten, nach der Scheminit[a]. Ein Psalm Davids[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Scheminit, möglicherweise „die achte“; gemeint sein könnte eine Oktavlage, eine musikalische Weise oder ein achtsaitiges Instrument.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „von David“ oder „für David“; das Hebräische kann Urheberschaft oder eine andere Zuordnung ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: Die Form bezeichnet in Psalmüberschriften wahrscheinlich die für die musikalische Aufführung verantwortliche Person. „Musikalischer Leiter“ ist verständlich und vermeidet die Engführung von „Chorleiter“.
- source_word: בִּנְגִינוֹת
  choice: Mit Saiteninstrumenten
  rationale: Der Ausdruck verweist hier auf Saitenspiel beziehungsweise Saiteninstrumente. Die Wiedergabe wahrt den musikalischen Sinn, ohne die konkrete Aufführungspraxis näher festzulegen.
- source_word: עַל
  choice: nach
  rationale: In musikalischen Überschriften kann die Präposition eine Melodie, Tonlage, Spielweise oder sonstige musikalische Vorgabe einführen. „Nach“ lässt diese Möglichkeiten offen.
- source_word: הַשְּׁמִינִית
  choice: der Scheminit
  rationale: Der genaue technische Sinn ist unsicher. Die Umschrift vermeidet eine unbegründete Festlegung auf eine Oktave, eine bestimmte Stimmlage oder ein achtsaitiges Instrument.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: „Psalm“ ist die sachlich passende und im Deutschen etablierte Bezeichnung für ein musikalisch vorzutragendes geistliches Lied dieser Gattung.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der in deutschen Psalmüberschriften natürliche Genitiv bewahrt zusammen mit der Fußnote die mögliche Bandbreite von Urheberschaft, Zuordnung und Bestimmung.
theological_decisions:
- issue: Urheberschaft oder Zuordnung durch לְדָוִד
  choice: „Ein Psalm Davids“ mit erläuternder Fußnote
  alternative: „Ein Psalm von David“ oder „Ein Psalm für David“
  rationale: Die hebräische Verbindung kann Urheberschaft, Zugehörigkeit, Zuordnung oder Bestimmung ausdrücken. Der Haupttext folgt der würdigen deutschen Überschriftentradition, während die Fußnote eine ausschließliche Festlegung auf direkte Urheberschaft vermeidet.
translation_notes:
  register: Moderne, würdevolle Psalmüberschrift in verständlichem Standarddeutsch. Die kurzen Nominal- und Präpositionalphrasen entsprechen dem knappen Charakter des hebräischen Titels; unsichere musikalische Fachsprache und die Mehrdeutigkeit der David-Zuordnung bleiben erkennbar.
