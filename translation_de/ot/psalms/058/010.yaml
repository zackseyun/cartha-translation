source:
  edition: WLC
  text: יִשְׂמַ֣ח צַ֭דִּיק כִּי חָזָ֣ה נָקָ֑ם פְּעָמָ֥י/ו יִ֝רְחַ֗ץ בְּ/דַ֣ם הָ/רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/010.yaml
  text: The righteous will rejoice when he sees vengeance[b][a]; he will wash his feet in the blood of the wicked.
translation:
  language: de
  text: Der Gerechte wird sich freuen, wenn er die Vergeltung sieht[a]; er wird seine Füße im Blut des Frevlers waschen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil er die Vergeltung gesehen hat“. Das hebräische Bindewort kann sowohl zeitlich („wenn“) als auch begründend („weil“) verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Das Waschen der Füße im Blut des Frevlers ist ein poetisches Bild für die vollständige Vollstreckung des Gerichts, kein Aufruf zu persönlicher Gewalt.
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׂמַח
  choice: wird sich freuen
  rationale: Das Qal-Imperfekt bezeichnet hier im poetischen Zusammenhang am natürlichsten eine zukünftige Reaktion.
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv steht im maskulinen Singular und kann einen einzelnen Gerechten oder den Gerechten als Repräsentanten seiner Gruppe bezeichnen.
- source_word: כִּי
  choice: wenn
  rationale: Die Konjunktion führt hier den Anlass beziehungsweise Zeitpunkt der Freude ein; die ebenfalls mögliche kausale Wiedergabe wird in der Fußnote bewahrt.
- source_word: חָזָה
  choice: sieht
  rationale: Das Perfekt lässt sich innerhalb des zukunftsbezogenen Satzes idiomatisch als Präsens nach „wenn“ wiedergeben.
- source_word: נָקָם
  choice: Vergeltung
  rationale: Der Ausdruck bezeichnet Rache beziehungsweise vergeltendes Gericht. „Vergeltung“ erhält die Härte des Bildes, ohne private Rachsucht vorwegzunehmen.
- source_word: פְּעָמָיו
  choice: seine Füße
  rationale: Obwohl das Wort auch Schritte oder Tritte bezeichnen kann, legt die Verbindung mit „waschen“ die konkrete Wiedergabe „Füße“ nahe.
- source_word: יִרְחַץ
  choice: wird … waschen
  rationale: Das Qal-Imperfekt wird parallel zum ersten Verbum futurisch wiedergegeben und bewahrt das drastische poetische Bild.
- source_word: בְּדַם
  choice: im Blut
  rationale: Die Präposition wird in diesem Bild am besten lokativ verstanden; die direkte Formulierung vermeidet eine Abschwächung.
- source_word: הָרָשָׁע
  choice: des Frevlers
  rationale: Das substantivierte Adjektiv steht im Singular. „Frevler“ ist im würdevollen poetischen Register natürlich und bezeichnet einen schuldhaft bösen Menschen.
theological_decisions:
- issue: Freude über gerechte Vergeltung oder Ausdruck persönlicher Rachsucht
  choice: Der Text spricht unverändert von Freude beim Anblick der Vergeltung, ohne diese ausdrücklich als private Rache oder als göttliche Vergeltung zu bestimmen.
  alternative: Die Aussage ausdrücklich als Freude über Gottes Gericht beziehungsweise als persönliche Vergeltung auslegen.
  rationale: Der hebräische Wortlaut nennt den Urheber der Vergeltung nicht. Die Übersetzung bewahrt daher das drastische Bild und seine theologische Spannung, ohne eine Deutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter Bildhärte. „Der Gerechte“ erhält den repräsentativen maskulinen Singular; „Frevler“ passt zum poetischen Register des Psalms, ohne altertümlich zu wirken.
