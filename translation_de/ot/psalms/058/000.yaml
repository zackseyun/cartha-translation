  text: לַ/מְנַצֵּ֥חַ אַל תַּשְׁחֵ֗ת לְ/דָוִ֥ד מִכְתָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.”[a] Of David. A miktam.[b]'
translation:
  language: de
  text: Für den musikalischen Leiter. »Verdirb nicht!«[a] Von David. Ein Miktam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise ist gemeint: »Nach der Melodie ›Verdirb nicht!‹«; die Wendung kann den Namen einer Melodie oder musikalischen Weise bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: Die Bedeutung des hebräischen Ausdrucks Miktam ist ungewiss. Vermutlich bezeichnet er eine bestimmte Art von Lied oder eine musikalisch-literarische Form.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: Das Wort bezeichnet in Psalmüberschriften den für die musikalische Ausführung Verantwortlichen. Die Wiedergabe ist genauer und weiter gefasst als »Chorleiter«, da ein Chor im Hebräischen nicht ausdrücklich genannt wird.
- source_word: אַל תַּשְׁחֵת
  choice: »Verdirb nicht!«
  rationale: Die Formulierung wird wörtlich wiedergegeben und durch Anführungszeichen als wahrscheinlich musikalischer Titel gekennzeichnet. Ob sie den Namen einer Melodie oder eine andere Vortragsangabe bezeichnet, bleibt offen.
- source_word: לְדָוִד
  choice: Von David
  rationale: Die knappe traditionelle Wendung ist im Deutschen natürlich. Das hebräische ל kann Urheberschaft, Zugehörigkeit oder Widmung anzeigen; die Übersetzung sollte daher nicht zu »verfasst von David« erweitert werden.
- source_word: מִכְתָּם
  choice: Ein Miktam
  rationale: Die genaue Bedeutung dieser Bezeichnung ist unbekannt. Eine Transliteration vermeidet spekulative Deutungen wie »Inschrift« oder »goldenes Lied«.
theological_decisions:
- issue: Funktion der Angaben in der Psalmüberschrift
  choice: Die Zeile wird als zum Text gehörende Psalmüberschrift mit musikalischen und literarischen Angaben wiedergegeben.
  alternative: אַל תַּשְׁחֵת als unmittelbare Aufforderung im eigentlichen Psalm und לְדָוִד ausdrücklich als Verfasserangabe verstehen.
  rationale: Der Gebrauch ähnlicher Formeln in Psalmüberschriften spricht für eine musikalische beziehungsweise redaktionelle Funktion. Zugleich werden ungesicherte Aussagen über Melodie, Gattung und Urheberschaft nicht als eindeutig dargestellt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die knappe Reihung bewahrt den Charakter einer Psalmüberschrift; Anführungszeichen kennzeichnen den wahrscheinlichen Titel, ohne die im Hebräischen nicht ausdrücklich genannte Formel »nach der Melodie« in den Haupttext einzufügen.
