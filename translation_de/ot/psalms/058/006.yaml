source:
  edition: WLC
  text: אֱֽלֹהִ֗ים הֲרָס שִׁנֵּ֥י/מוֹ בְּ/פִ֑י/מוֹ מַלְתְּע֥וֹת כְּ֝פִירִ֗ים נְתֹ֣ץ יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/006.yaml
  text: God[a], break their teeth in their mouths; shatter the fangs of the young lions[b], O Yahweh.
translation:
  language: de
  text: Gott, zerbrich ihnen die Zähne im Mund; zerschmettere die Kiefer[a] der jungen Löwen, Jahwe[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die kräftigen Zähne“. Das hebräische Wort bezeichnet vor allem die Kiefer oder Kinnbacken und kann damit verbunden auch die kräftigen Zähne meinen.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH, der persönliche Name Gottes; traditionell oft mit „der HERR“ wiedergegeben.
    reason: divine_name
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv steht als direkte Anrede. Im Deutschen ist dafür weder eine Vokativpartikel noch zwingend ein vorangestelltes „O“ nötig.
- source_word: הֲרָס
  choice: zerbrich
  rationale: Der Imperativ bedeutet grundsätzlich „niederreißen, zerstören“. In Verbindung mit Zähnen gibt „zerbrich“ das gewaltsame Bild idiomatisch und präzise wieder.
- source_word: שִׁנֵּימוֹ
  choice: ihnen die Zähne
  rationale: Die Pluralform mit Suffix der 3. Person maskulin Plural bedeutet „ihre Zähne“. Die deutsche Konstruktion mit Dativus possessivus klingt hier natürlicher und bewahrt denselben Sinn.
- source_word: בְּפִימוֹ
  choice: im Mund
  rationale: Die Präposition ב bezeichnet hier den Ort. „Im Mund“ erhält das konkrete hebräische Bild; der Singular ist in der distributiven deutschen Wendung „ihnen … im Mund“ natürlich.
- source_word: מַלְתְּעוֹת
  choice: Gebiss
  rationale: Das Wort bezeichnet die Kiefer beziehungsweise die kräftigen Mahl- oder Reißzähne. „Gebiss“ passt zum Bild der jungen Löwen, ohne die lexikalische Unsicherheit unnötig auf eine bestimmte Zahnart festzulegen.
- source_word: כְּפִירִים
  choice: junge Löwen
  rationale: כפירים bezeichnet kräftige junge Löwen, nicht notwendig kleine Löwenjunge. Die Wiedergabe erhält das Bild gefährlicher Raubtiere.
- source_word: נְתֹץ
  choice: zerschmettere
  rationale: Der Imperativ kann „niederreißen, abbrechen, zertrümmern“ bedeuten. Mit „Gebiss“ vermittelt „zerschmettere“ die gewaltsame Zerstörung und bildet eine passende poetische Steigerung zu „zerbrich“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als persönlicher Gottesname.
- issue: Gewaltsame Bildsprache des Fluchgebets
  choice: Die Bitte um das Zerbrechen der Zähne beziehungsweise des Gebisses bleibt konkret erhalten.
  alternative: Eine abschwächende Umschreibung wie „nimm ihnen ihre Macht“
  rationale: Der Urtext verwendet bewusst drastische körperliche Bilder. Eine abstrakte Paraphrase würde die sprachliche und theologische Spannung des Verses glätten.
- issue: Beziehung zwischen den Gegnern und den jungen Löwen
  choice: Der poetische Parallelismus bleibt ohne erklärenden Zusatz stehen.
  alternative: Die Gegner ausdrücklich als junge Löwen bezeichnen
  rationale: Der hebräische Parallelismus legt die metaphorische Identifikation nahe, formuliert sie aber nicht als erklärenden Vergleich. Die Übersetzung bewahrt diese poetische Offenheit.
translation_notes:
  register: Moderne, gehobene Standardsprache mit der knappen Wucht eines Fluchgebets. Der Dativus possessivus „ihnen die Zähne“ ist natürliches Deutsch; „zerschmettere“ wahrt die starke poetische Bildsprache. Die beiden direkten Gottesanreden rahmen die Bitte.
