source:
  edition: WLC
  text: וְ/יֹאמַ֣ר אָ֭דָם אַךְ פְּרִ֣י לַ/צַּדִּ֑יק אַ֥ךְ יֵשׁ אֱ֝לֹהִ֗ים שֹׁפְטִ֥ים בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/011.yaml
  text: And people will say[a], “Surely there is fruit for the righteous[b]; surely there is a God who judges on the earth.”
translation:
  language: de
  text: 'Dann wird man sagen: »Wahrlich, es gibt Frucht für den Gerechten[a]; wahrlich, es gibt einen Gott, der auf Erden richtet[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Frucht ist für den Gerechten«; gemeint ist, dass dem Gerechten tatsächlich ein Ertrag, ein Ergebnis oder eine Vergeltung zukommt.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht ein Partizip im Plural; formal kann die Wendung auch als »Götter, die richten« verstanden werden. Wahrscheinlicher bezeichnet sie hier den einen Gott, der richtet.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹאמַר אָדָם
  choice: Dann wird man sagen
  rationale: Das Qal-Imperfekt kann im Zusammenhang der zuvor geschilderten Gerichtsszene zukünftig beziehungsweise folgernd verstanden werden. Das generische אָדָם wird im heutigen Deutsch natürlich durch unpersönliches »man« wiedergegeben.
- source_word: אַךְ
  choice: ja
  rationale: Die Partikel bekräftigt hier die Aussage. Das zweimalige »ja« bewahrt Nachdruck und Parallelismus, ohne die heute teils zweifelnde Färbung von »sicherlich« hervorzurufen.
- source_word: פְּרִי לַצַּדִּיק
  choice: der Gerechte trägt Frucht
  rationale: Wörtlich steht »Frucht für den Gerechten«. Die natürliche deutsche Formulierung erhält das Bild der Frucht und bezeichnet den tatsächlichen Ertrag beziehungsweise Ausgang gerechten Lebens.
- source_word: יֵשׁ אֱלֹהִים
  choice: es gibt einen Gott
  rationale: יֵשׁ ist eine Existenzpartikel. Der unbestimmte Artikel entspricht der deutschen Existenzkonstruktion und bezeichnet hier nicht einen Gott unter mehreren.
- source_word: שֹׁפְטִים
  choice: der ... richtet
  rationale: Das formal plurale Partizip steht bei אֱלֹהִים. Im Kontext ist am ehesten der eine Gott gemeint; idiomatisches Deutsch verlangt daher den Singular. Die auffällige hebräische Mehrzahl wird in einer Fußnote kenntlich gemacht.
- source_word: בָּאָרֶץ
  choice: auf der Erde
  rationale: Der umfassende Horizont göttlichen Gerichts spricht für »Erde« statt des engeren »Land«; »auf der Erde« ist idiomatisches Deutsch.
theological_decisions:
- issue: Singular oder Plural in אֱלֹהִים שֹׁפְטִים
  choice: »ein Gott, der ... richtet«
  alternative: »Götter, die ... richten« beziehungsweise formal »Gott/Richter, die richten«
  rationale: Der Höhepunkt des Psalms bekennt die wirksame göttliche Gerechtigkeit. Kontextuell ist der eine Gott die wahrscheinlichste Referenz; die morphologische Spannung des pluralen Partizips wird jedoch nicht verschwiegen, sondern in der Fußnote offengelegt.
- issue: Bedeutung der Fruchtmetapher
  choice: Bildhaftes »Frucht tragen« im Haupttext
  alternative: Explizites »Lohn erhalten« oder »einen Ertrag haben«
  rationale: Das hebräische Bild bleibt erhalten, ohne die Frucht ausschließlich als Lohn festzulegen; sie kann Ergebnis, Ertrag oder Vergeltung bezeichnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der poetische Parallelismus wird durch das zweimalige »ja« bewahrt. »Richtet« erhält gegenüber »urteilt« den umfassenderen Sinn des Ausübens göttlichen Gerichts.
