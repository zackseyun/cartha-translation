  text: הַֽ/אֻמְנָ֗ם אֵ֣לֶם צֶ֭דֶק תְּדַבֵּר֑וּ/ן מֵישָׁרִ֥ים תִּ֝שְׁפְּט֗וּ בְּנֵ֣י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/001.yaml
  text: Do you indeed speak righteousness in silence? Do you judge uprightly[c][b][a], sons of man?
translation:
  language: de
  text: Redet ihr wirklich Recht im Schweigen?[a] Richtet ihr gerecht, ihr Menschen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort ist schwierig. Der masoretische Text vokalisiert es als „Schweigen“ oder „Stummheit“. Andere verstehen es als Anrede: „ihr Mächtigen“ oder sogar „ihr Götter“. Dann wäre zu übersetzen: „Redet ihr wirklich Recht, ihr Mächtigen?“'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Söhne des Menschen“ oder „Söhne Adams“; gemeint sind Menschen als Sterbliche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: wirklich
  rationale: Die betonte Fragepartikel leitet eine ironisch-herausfordernde rhetorische Frage ein; „wirklich“ gibt diese Kraft im heutigen Deutsch natürlich wieder.
- source_word: אֵלֶם
  choice: im Schweigen
  rationale: Die masoretische Vokalisierung weist auf „Schweigen/Stummheit“. Die ungewöhnliche Spannung zwischen Schweigen und Reden bleibt bewusst erhalten; die wichtige alternative Deutung wird in einer Fußnote genannt.
- source_word: צֶדֶק
  choice: Recht
  rationale: Im Zusammenhang mit Reden und Richten bezeichnet das Wort das Rechte beziehungsweise gerechtes Recht. „Recht reden“ ist im Deutschen knapper und natürlicher als „Gerechtigkeit reden“.
- source_word: תְּדַבֵּרוּן
  choice: redet
  rationale: Gibt das Verb direkt und ohne interpretierende Erweiterung wieder.
- source_word: מֵישָׁרִים
  choice: gerecht
  rationale: Der Ausdruck bezeichnet Geradheit und Billigkeit, hier adverbial auf das Richten bezogen. „gerecht“ bringt den forensischen Sinn idiomatisch zum Ausdruck.
- source_word: תִּשְׁפְּטוּ
  choice: richtet
  rationale: Bewahrt den gerichtlichen Sinn des hebräischen Verbs und passt zur Anklage gegen die Angeredeten.
- source_word: בְּנֵי אָדָם
  choice: ihr Menschen
  rationale: Die hebräische Wendung bedeutet wörtlich „Söhne des Menschen/Adams“, bezeichnet hier aber Menschen als Sterbliche. „ihr Menschen“ ist im modernen Deutsch verständlich und bewahrt die Anredeform.
theological_decisions:
- issue: Deutung des schwierigen אֵלֶם
  choice: Der masoretischen Vokalisierung entsprechend „im Schweigen“ im Haupttext
  alternative: „ihr Mächtigen“ oder „ihr Götter“ als Anrede
  rationale: Der überlieferte vokalisierte Text stützt die Bedeutung „Schweigen/Stummheit“, obwohl dadurch eine auffällige und möglicherweise bewusst beißende Formulierung entsteht. Da die alternative Lesart alt und inhaltlich bedeutsam ist, wird sie nicht in den Haupttext eingesetzt, sondern transparent in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Verbindung „im Schweigen Recht reden“ ist wegen der Schwierigkeit des hebräischen Textes bewusst nicht geglättet. Die beiden parallelen rhetorischen Fragen und die abschließende Anrede bleiben erhalten.
