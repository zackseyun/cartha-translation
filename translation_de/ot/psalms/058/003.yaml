translation:
  language: de
  text: Die Gottlosen sind vom Mutterleib an entfremdet; vom Mutterleib an gehen sie in die Irre und reden Lügen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Mutterleib an … vom Bauch/Mutterleib an“. Die dichterisch zugespitzte Formulierung beschreibt die Gottlosen als vom frühesten Lebensanfang an irregehend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרוּ
  choice: sind entfremdet
  rationale: Das Qal Perfekt Plural von זור bezeichnet hier Entfremdung beziehungsweise Absonderung. „Sind entfremdet“ bewahrt diesen Zustand und den Parallelismus zu „gehen sie irre“, ohne den Ausdruck vorschnell als bloße moralische Verderbtheit auszulegen.
- source_word: רְשָׁעִים
  choice: die Gottlosen
  rationale: Gängige und im Psalter angemessene Klassenbezeichnung für Menschen, die sich schuldig und gegen Gottes Ordnung stellen.
- source_word: מֵרָחֶם
  choice: vom Mutterleib an
  rationale: Gibt Präposition und Substantiv direkt wieder und bewahrt das starke poetische Bild.
- source_word: תָּעוּ
  choice: gehen sie irre
  rationale: תעה bezeichnet Irregehen oder Abirren. Das deutsche Präsens gibt im Kontext die charakterisierende, allgemeine Aussage des hebräischen Perfekts natürlich wieder.
- source_word: מִבֶּטֶן
  choice: vom Leib ihrer Mutter an
  rationale: בטן bedeutet wörtlich „Leib/Bauch“ und kann den Mutterleib meinen. Diese Wiedergabe bewahrt das zweite körperliche Bild des hebräischen Parallelismus, ohne es mit „von Geburt an“ stärker auszudeuten.
- source_word: דֹּבְרֵי כָזָב
  choice: und reden Lüge
  rationale: Die partizipiale Wendung charakterisiert die Gottlosen fortdauernd als Menschen, die Falsches reden. „Lüge reden“ ist knapp, verständlich und wahrt den poetischen Ton.
- source_word: כָזָב
  choice: Lüge
  rationale: Bezeichnet hier im Zusammenhang des Redens Falschheit beziehungsweise Lüge; der Singular als Kollektivbegriff folgt der hebräischen Ausdrucksweise.
theological_decisions:
- issue: Ob der Vers als technische Lehraussage über vorgeburtliche persönliche Schuld oder Erbsünde wiederzugeben ist
  choice: Die poetische Zuspitzung über ein Irregehen vom frühestmöglichen Lebensanfang an bleibt erhalten.
  alternative: Den Vers ausdrücklich als dogmatische Aussage über Schuld von der Empfängnis an zu formulieren oder ihn umgekehrt als inhaltslose Beschimpfung abzuschwächen.
  rationale: Der hebräische Text arbeitet mit parallelen Bildern („vom Mutterleib an“ // „vom Leib ihrer Mutter an“) innerhalb eines anklagenden Psalms. Die Übersetzung wahrt deren Kraft und Spannung, ohne eine systematisch-theologische Folgerung in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an den hebräischen Parallelismus. Die ungewöhnliche Wiederholung der Mutterleibs-Bilder wird bewusst erhalten; die Fußnote erläutert ihren poetisch zugespitzten Charakter.
