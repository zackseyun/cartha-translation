  text: אַף בְּ/לֵב֮ עוֹלֹ֪ת תִּפְעָ֫ל֥וּ/ן בָּ/אָ֡רֶץ חֲמַ֥ס יְ֝דֵי/כֶ֗ם תְּפַלֵּֽסֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/002.yaml
  text: Even in your heart you work injustice[b][a]; on the earth your hands weigh out violence.
translation:
  language: de
  text: Ja, im Herzen verübt ihr Unrecht; im Land messen eure Hände Gewalt zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der Erde“. Das hebräische Wort kann sowohl „Land“ als auch „Erde“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Ja
  rationale: Die emphatische Partikel bekräftigt die Anklage. „Ja“ gibt diese bestätigende Kraft natürlich wieder, ohne eine im Deutschen schwer verständliche Steigerung zu erzeugen.
- source_word: בְּלֵב
  choice: im Herzen
  rationale: Die Wendung bezeichnet den inneren Ort des Planens und Wollens. Der Singular bleibt entsprechend dem Hebräischen erhalten, obwohl eine Mehrzahl angesprochen wird.
- source_word: עוֹלֹת
  choice: Unrecht
  rationale: Das Wort bezeichnet moralisches Unrecht beziehungsweise Ungerechtigkeit. Das kollektive „Unrecht“ ist im Deutschen idiomatisch und passt zum richterlichen Kontext.
- source_word: תִּפְעָלוּן
  choice: verübt ihr
  rationale: פעל bezeichnet hier bewusstes Tun. „Unrecht verüben“ ist eine natürliche und zugleich gewichtige deutsche Verbindung.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Im Kontext menschlicher Herrschaft und Rechtsprechung ist „im Land“ naheliegend; die weitere Möglichkeit wird in der Fußnote bewahrt.
- source_word: חֲמַס
  choice: Gewalt
  rationale: חמס bezeichnet gewaltsames, rechtswidriges Handeln; „Gewalt“ bewahrt die Schärfe des Vorwurfs.
- source_word: יְדֵיכֶם
  choice: eure Hände
  rationale: Das konkrete Bild der Hände als Träger des Handelns wird wörtlich bewahrt.
- source_word: תְּפַלֵּסוּן
  choice: wägen … ab
  rationale: Die Form von פלס trägt die Vorstellung des Wägens oder Zumessens. „abwägen“ erhält das ironische Bild einer richterlichen Tätigkeit, deren Ergebnis Gewalt ist.
theological_decisions:
- issue: Bildkraft des Schlussverbs im richterlichen Kontext
  choice: „wägen … Gewalt ab“
  alternative: „teilt Gewalt zu“ oder „messt Gewalt zu“
  rationale: Die Wägungsmetapher bleibt erhalten und macht die Verkehrung gerechter Rechtsprechung sichtbar, ohne eine bestimmte dogmatische Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelität von innerem Unrecht und äußerer Gewalt sowie die richterliche Wägungsmetapher werden bewahrt.
