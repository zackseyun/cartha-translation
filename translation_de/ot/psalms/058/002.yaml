  source_fidelity: 'Die Grundgliederung und die zentralen Begriffe sind treffend wiedergegeben: אַף ist emphatisch, בְּלֵב bezeichnet das innere Wollen, עוֹלֹת das Unrecht, חָמָס Gewalt und יְדֵיכֶם bleibt als Bild der handelnden Hände erhalten. Auch die Mehrdeutigkeit von בָּאָרֶץ wird korrekt in der Anmerkung gesichert. Das deutsche „abwägen“ bezeichnet jedoch primär ein prüfendes Erwägen und nicht das im Hebräischen bildhaft ausgedrückte Zumessen bzw. Abwiegen von Gewalt.'
  naturalness: „Eure Hände wägen Gewalt ab“ ist im Deutschen missverständlich und stilistisch wenig idiomatisch, weil „Gewalt abwägen“ gewöhnlich eine Entscheidung über Gewalt nahelegt. „Eure Hände messen Gewalt zu“ ist natürlich, wahrt die Metapher des Bemessens und lässt die ironische Verkehrung des Rechtskontexts erkennen.
  terminology: „Unrecht“, „Gewalt“, „Herz“ und „Hände“ sind sachgerecht und registergerecht. „Im Land“ ist als kontextuell mögliche Wiedergabe von בָּאָרֶץ vertretbar; die Alternative „auf der Erde“ soll in der Fußnote verbleiben.
