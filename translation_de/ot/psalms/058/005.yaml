lexical_decisions:
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen führt die Beschreibung der Kobra aus dem vorhergehenden Vers fort und stimmt im Deutschen mit dem dortigen femininen Bezugswort überein.
- source_word: לֹא יִשְׁמַע
  choice: nicht … hört
  rationale: Das Imperfekt beschreibt hier das kennzeichnende Nichthören beziehungsweise Nichtbeachten der Schlange. „Hört“ bewahrt die Grundbedeutung, ohne vorschnell zwischen Unfähigkeit und Weigerung zu entscheiden.
- source_word: לְקוֹל
  choice: auf die Stimme
  rationale: קוֹל kann „Stimme“ oder „Laut/Klang“ bedeuten. Bei menschlichen Beschwörern ist „Stimme“ natürlich; die Alternative „Laut“ wird in der Fußnote berücksichtigt.
- source_word: מְלַחֲשִׁים
  choice: Beschwörer
  rationale: Das Wort bezeichnet Menschen, die flüsternde Beschwörungsformeln verwenden. Im Zusammenhang der Schlange gibt „Beschwörer“ die Funktion verständlich wieder.
- source_word: חוֹבֵר חֲבָרִים
  choice: Bannsprecher
  rationale: Die wörtlich schwer nachzubildende Verbindung bezeichnet jemanden, der Zauber- oder Bannformeln fügt beziehungsweise bindet. „Bannsprecher“ ist knapp, verständlich und erhält die kultisch-magische Färbung.
- source_word: מְחֻכָּם
  choice: erfahrenen
  rationale: Die Form bezeichnet hier erworbene Kunstfertigkeit oder Expertise, nicht moralische Weisheit. „Erfahren“ gibt dies idiomatisch wieder.
