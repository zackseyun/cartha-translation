  text: חֲמַת לָ֗/מוֹ כִּ/דְמ֥וּת חֲמַת נָחָ֑שׁ כְּמוֹ פֶ֥תֶן חֵ֝רֵ֗שׁ יַאְטֵ֥ם אָזְנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/004.yaml
  text: Their venom is like the venom of a serpent[a], like a deaf cobra that stops up its ear,
translation:
  language: de
  text: Ihr Gift ist wie das Gift einer Schlange, wie das einer tauben Kobra[a], die ihr Ohr verschließt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Otter“ oder „Aspis“. Das hebräische Wort bezeichnet eine Giftschlange; die genaue Art ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: Gift
  rationale: Im Zusammenhang mit Schlange und פֶתֶן bezeichnet das Wort hier natürlich Schlangengift, nicht Zorn.
- source_word: לָמוֹ
  choice: ihr
  rationale: 'Die Pronominalform ist in dieser Wendung possessiv zu verstehen: „ihr Gift“.'
- source_word: כִּדְמוּת
  choice: gleicht
  rationale: Die Vergleichskonstruktion wird in natürlichem, poetischem Deutsch als „gleicht“ wiedergegeben.
- source_word: נָחָשׁ
  choice: Schlange
  rationale: Das allgemeine Wort für Schlange bildet den ersten Teil des poetischen Vergleichs.
- source_word: פֶתֶן
  choice: Kobra
  rationale: Das hebräische Wort bezeichnet eine Giftschlange; „Kobra“ ist eine verständliche moderne Wiedergabe, während traditionell auch „Otter“ oder „Aspis“ gebraucht wird.
- source_word: חֵרֵשׁ
  choice: taub
  rationale: Gemeint ist eine Schlange, die nicht hört; daher ist „taub“ und nicht „stumm“ sachgerecht.
- source_word: יַאְטֵם
  choice: verschließt
  rationale: Das Verb bezeichnet ein festes Schließen oder Verstopfen; „verschließt“ bewahrt das anschauliche Bild in idiomatischem Deutsch.
- source_word: אָזְנוֹ
  choice: ihr Ohr
  rationale: Das grammatisch maskuline Pronomen bezieht sich auf die Schlange; im Deutschen richtet sich das Pronomen nach dem femininen Substantiv „Kobra“.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Sprache. Die Wiederholung von „Gift“ erhält den Parallelismus; „dem einer“ vermeidet eine unnötig schwerfällige vollständige Wiederholung. Das Bild der absichtlich ihr Ohr verschließenden Schlange bleibt unaufgelöst erhalten.
