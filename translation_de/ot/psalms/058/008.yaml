  yaml_path: translation/ot/psalms/058/008.yaml
  text: Like a snail that melts away as it goes[b][a], like a stillborn child that has not seen the sun.
translation:
  language: de
  text: Wie eine Schnecke, die zergeht, während sie dahinkriecht, wie eine Fehlgeburt, die die Sonne nie gesehen hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und in der Satzfügung schwierig: „die Fehlgeburt einer Frau – sie haben die Sonne nicht gesehen“. Das hebräische Verb steht im Plural, obwohl „Fehlgeburt“ grammatisch Singular ist. Gemeint sind offenbar die fehl- oder totgeborenen Kinder; deshalb steht im Text eine sinngemäße Singularform.'
    reason: textual_syntax
lexical_decisions:
- source_word: כְּמוֹ
  choice: Wie
  rationale: Leitet den ersten Vergleich ein und gibt die vergleichende Partikel knapp und natürlich wieder.
- source_word: שַׁבְּלוּל
  choice: eine Schnecke
  rationale: Die traditionelle und lexikalisch gut gestützte Deutung ist „Schnecke“; „Nacktschnecke“ ist möglich, aber weniger sicher.
- source_word: תֶּמֶס
  choice: die sich auflöst
  rationale: Das Wort bezeichnet ein Schmelzen oder Zergehen. Die verbale Wiedergabe macht das poetische Bild im Deutschen verständlich, ohne seine Fremdheit zu beseitigen.
- source_word: יַהֲלֹךְ
  choice: während sie dahinkriecht
  rationale: Das Verb bedeutet „gehen“. Bezogen auf eine Schnecke ist „dahinkriechen“ idiomatisch; „während“ stellt den Vorgang als begleitend zu ihrem Zergehen dar.
- source_word: נֵפֶל
  choice: ein fehlgeborenes Kind
  rationale: Das Substantiv bezeichnet eine Fehlgeburt beziehungsweise eine vorzeitig abgegangene Leibesfrucht. Diese Formulierung ist im Vergleich natürlich und lässt den folgenden Relativsatz eindeutig auf das Kind bezogen sein.
- source_word: אֵשֶׁת
  choice: einer Frau (im Haupttext sinngemäß enthalten)
  rationale: Die hebräische Verbindung lautet wörtlich „Fehlgeburt einer Frau“. Im Deutschen ist die Angabe bei „fehlgeborenes Kind“ selbstverständlich und kann zugunsten eines klaren Satzbezugs unausgedrückt bleiben; die Fußnote dokumentiert die Form des Hebräischen.
- source_word: בַּל
  choice: nie
  rationale: Die Negationspartikel wird zusammen mit dem Perfekt idiomatisch als „nie“ wiedergegeben.
- source_word: חָזוּ
  choice: erblickt hat
  rationale: Das Verb bedeutet „sehen, schauen“. „Erblicken“ passt zur festen deutschen Wendung „das Sonnenlicht erblicken“. Der hebräische Plural trotz singularischer Vergleichsgröße wird in der Fußnote vermerkt.
- source_word: שָׁמֶשׁ
  choice: das Sonnenlicht
  rationale: Wörtlich steht „Sonne“. „Das Sonnenlicht erblicken“ gibt das Bild natürlich wieder und bezeichnet hier den Eintritt ins sichtbare Leben.
