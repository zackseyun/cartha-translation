  text: בְּ/טֶ֤רֶם יָבִ֣ינוּ סִּֽירֹתֵי/כֶ֣ם אָטָ֑ד כְּמוֹ חַ֥י כְּמוֹ חָ֝ר֗וֹן יִשְׂעָרֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/009.yaml
  text: Before your pots can feel the thornbush[a], whether green or burning, he will sweep them away.
translation:
  language: de
  text: Noch bevor eure Töpfe den Dornstrauch spüren – ob grün oder brennend –, wird er ihn hinwegwirbeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist schwer verständlich. Wörtlicher etwa: „Bevor eure Töpfe den Dornstrauch wahrnehmen, wie lebendig, wie Glut/Zorn, wird er ihn hinwegwirbeln.“ Wahrscheinlich beschreibt das Bild ein plötzliches Wegraffen, noch bevor schnell brennendes Dornholz die Töpfe erhitzen kann. Der Schluss lässt sich auch wiedergeben: „Er wird sie im Zorn hinwegfegen.“'
    reason: Bewahrt alternative Deutungen der ungewöhnlichen Wörter, des Pronomens und der schwierigen Satzfügung, ohne den unsicheren Bezug des Objektsuffixes festzulegen.
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Noch bevor
  rationale: Gibt die zeitliche Vorordnung und die Plötzlichkeit des Eingreifens in natürlichem modernem Deutsch wieder.
- source_word: יָבִינוּ
  choice: spüren
  rationale: Das Verb bedeutet gewöhnlich „verstehen“ oder „wahrnehmen“. Bei Töpfen als Subjekt bezeichnet es hier wahrscheinlich bildhaft das Wahrnehmen der durch das Brennmaterial entstehenden Hitze.
- source_word: סִּירֹתֵיכֶם
  choice: eure Töpfe
  rationale: Bezeichnet Kochgefäße; „Töpfe“ ist konkret, allgemein verständlich und bewahrt das häusliche Feuerbild.
- source_word: אָטָד
  choice: den Dornstrauch
  rationale: Bezeichnet einen dornigen Strauch, der als rasch brennendes Heizmaterial dienen konnte; die konkrete Bildsprache bleibt erhalten.
- source_word: כְּמוֹ חַי כְּמוֹ חָרוֹן
  choice: ob grün oder brennend
  rationale: „Lebendig“ wird im Blick auf Brennmaterial idiomatisch als „grün“ verstanden. חָרוֹן kann „Glut/Brennen“ oder „Zorn“ bezeichnen; im Haupttext wird wegen des Feuerbildes „brennend“ gewählt, während die andere Möglichkeit in der Fußnote erhalten bleibt.
- source_word: יִשְׂעָרֶנּוּ
  choice: wird er ihn hinwegwirbeln
  rationale: Das Verb bezeichnet ein stürmisches Fortreißen oder Verwirbeln. Das singularische Objektsuffix wird mit „ihn“ formal bewahrt, obwohl sein Bezug im schwierigen hebräischen Satz unsicher ist.
theological_decisions:
- issue: Deutung des schwer verständlichen Feuer- und Gerichtsbildes
  choice: Das plötzliche Hinwegraffen wird durch einen Topf dargestellt, der die Hitze des Dornstrauchfeuers noch nicht spürt.
  alternative: Der Schluss kann bedeuten, dass Gott sie „im Zorn hinwegfegt“; außerdem kann das Objektsuffix auf die Frevler oder auf das Brennmaterial bezogen werden.
  rationale: Die gewählte Fassung hält das konkrete Feuerbild im Haupttext fest, kennzeichnet aber die erhebliche syntaktische und lexikalische Unsicherheit in der Fußnote, ohne die Gerichtsmetaphorik konfessionell oder dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst knapper poetischer Bildsprache. Der ungewöhnliche Ausdruck „die Töpfe spüren den Dornstrauch“ bleibt erhalten, weil eine glättende Ergänzung wie „dessen Hitze“ die schwierige Metapher stärker auslegen würde.
