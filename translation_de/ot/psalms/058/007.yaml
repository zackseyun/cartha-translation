  text: יִמָּאֲס֣וּ כְמוֹ מַ֭יִם יִתְהַלְּכוּ לָ֑/מוֹ יִדְרֹ֥ךְ חצ/ו כְּמ֣וֹ יִתְמֹלָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/007.yaml
  text: Let them melt away like water that runs off[a]; when he aims his arrows[c][b], let them be as though cut off.
translation:
  language: de
  text: Sie sollen zerrinnen wie Wasser, das abfließt[a]. Wenn er seinen Pfeil anlegt[b], sollen sie wie abgeschnitten sein[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das davonfließt“. Das hebräische Bild zeigt Wasser, das fortströmt und verschwindet.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „seinen Pfeil“ (Singular); das Wort kann hier auch kollektiv im Sinn von „seine Pfeile“ verstanden werden. Die Wendung für das Anlegen zum Schuss ist ungewöhnlich.'
    reason: lexical_alternative
  - marker: c
    text: Der letzte Satzteil ist textlich und sprachlich schwierig. Möglich sind auch Wiedergaben wie „sollen sie stumpf werden“ oder „sollen sie verwelken“.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּאֲסוּ
  choice: sie sollen zerrinnen
  rationale: Im Zusammenhang mit dem Wasserbild bezeichnet das schwierige Verb ein Sich-Auflösen oder Verschwinden. „Zerrinnen“ bewahrt das poetische Bild und den Wunschcharakter.
- source_word: כְמוֹ מַיִם
  choice: wie Wasser
  rationale: Die schlichte Vergleichsformulierung gibt das hebräische Bild unmittelbar und natürlich wieder.
- source_word: יִתְהַלְּכוּ לָמוֹ
  choice: das abfließt
  rationale: Die Bewegungsform von הלך beschreibt hier im Wasserbild ein Fortfließen und Verschwinden. Das schwer wiederzugebende לָמוֹ wird nicht mit einem unklaren deutschen Pronomen überladen.
- source_word: יִדְרֹךְ
  choice: wenn er … anlegt
  rationale: Das Verb bezeichnet im Zusammenhang mit Bogenschießen das Spannen beziehungsweise Bereitmachen zum Schuss. Da im überlieferten Text der Pfeil und nicht ausdrücklich der Bogen als Objekt steht, ist „den Pfeil anlegen“ im Deutschen natürlich und textnah.
- source_word: חצ/ו
  choice: seinen Pfeil
  rationale: Der masoretisch überlieferte Text hat formal den Singular „seinen Pfeil“. Die im Kontext mögliche kollektive Auffassung wird in der Fußnote genannt.
- source_word: כְּמוֹ יִתְמֹלָלוּ
  choice: sollen sie wie abgebrochen sein
  rationale: Die seltene und umstrittene Form wird als Bild plötzlicher Unwirksamkeit wiedergegeben. Das plurale „sie“ bewahrt die grammatische Spannung des hebräischen Textes, ohne den Bezug eigenmächtig festzulegen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Sprache. „Zerrinnen“ ist bildhaft, aber allgemein verständlich. Die ungewöhnliche Numerusfolge und die Unsicherheit des Schlussverbs werden nicht stillschweigend harmonisiert, sondern im Haupttext beziehungsweise in den Fußnoten bewahrt.
