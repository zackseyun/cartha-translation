source:
  edition: WLC
  text: עֻ֭זּ/וֹ אֵלֶ֣י/ךָ אֶשְׁמֹ֑רָה כִּֽי אֱ֝לֹהִ֗ים מִשְׂגַּבִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/009.yaml
  text: O my strength[a], I will watch for you[c][b], for God is my stronghold.
translation:
  language: de
  text: Seine Stärke[a] – nach dir halte ich Ausschau[b], denn Gott ist meine Festung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Form lautet wörtlich »seine Stärke«. Nach einer verbreiteten traditionellen Deutung kann man auch lesen: »O meine Stärke, nach dir halte ich Ausschau.«'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »auf dich warte ich« beziehungsweise »für dich halte ich Wache«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻזּוֹ
  choice: Seine Stärke
  rationale: Die masoretische Punktierung enthält ein Suffix der 3. Person Singular maskulin und bedeutet daher am unmittelbarsten »seine Stärke«. Die schwierige, unvermittelt stehende Formulierung bleibt im Haupttext erhalten; die verbreitete Anrede »O meine Stärke« wird in einer Fußnote genannt.
- source_word: אֵלֶיךָ
  choice: nach dir
  rationale: אֶל mit dem Suffix der 2. Person Singular bezeichnet die Ausrichtung auf Gott. In Verbindung mit »Ausschau halten« gibt »nach dir« diese Richtung im natürlichen modernen Deutsch wieder.
- source_word: אֶשְׁמֹרָה
  choice: halte ich Ausschau
  rationale: Die Form von שׁמר kann ein entschlossenes oder erwartungsvolles Wachen ausdrücken. »Ausschau halten« passt zur Ausrichtung auf Gott, ohne die Bedeutung ausschließlich auf passives Warten festzulegen.
- source_word: כִּי
  choice: denn
  rationale: 'כִּי leitet hier die Begründung ein: Der Beter richtet sich auf Gott aus, weil Gott ihm Schutz bietet.'
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch singularisch gebrauchte Bezeichnung meint hier den Gott Israels und wird standardgemäß mit »Gott« wiedergegeben.
- source_word: מִשְׂגַּבִּי
  choice: meine Festung
  rationale: מִשְׂגָּב bezeichnet einen hoch gelegenen, sicheren Schutzort. »Festung« bewahrt das Bild starken Schutzes und ist im Deutschen klar und geläufig.
theological_decisions:
- issue: Ob עֻזּוֹ als dritte Person (»seine Stärke«) oder als Anrede (»O meine Stärke«) wiederzugeben ist
  choice: Seine Stärke
  alternative: O meine Stärke
  rationale: Der Haupttext folgt der vorgegebenen masoretischen Form mit dem Suffix der dritten Person. Da der Satz dadurch ungewöhnlich und syntaktisch schwer bleibt und eine vokativische Deutung traditionell weit verbreitet ist, wird diese nicht ausgeschlossen, sondern in der Fußnote bewahrt.
- issue: Ob אֶשְׁמֹרָה eher Wachen, Ausschauhalten oder Warten bezeichnet
  choice: nach dir halte ich Ausschau
  alternative: auf dich warte ich / für dich halte ich Wache
  rationale: Die Form bezeichnet grundsätzlich aufmerksames Wachen oder Hüten. Im Zusammenhang mit der Hinwendung zu Gott vermittelt »Ausschau halten« erwartungsvolle Aufmerksamkeit, ohne die lexikalische Spannweite stillschweigend auf bloßes Warten zu verengen.
translation_notes:
  register: Moderne, würdige Psalmenprosa mit knapper poetischer Satzführung. Der Gedankenstrich macht die abrupte und schwierige Eröffnung sichtbar, ohne sie durch eine ergänzende Deutung zu glätten.
