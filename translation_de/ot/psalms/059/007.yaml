base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/007.yaml
  text: Look[a], they pour out from their mouths; swords are on their lips, for they say[b], “Who hears?”
translation:
  language: de
  text: 'Sieh[a], sie sprudeln aus ihrem Mund hervor; Schwerter sind auf ihren Lippen, denn sie sagen[b]: »Wer hört?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da!« Das hebräische Wort lenkt nachdrücklich die Aufmerksamkeit auf das Folgende.'
