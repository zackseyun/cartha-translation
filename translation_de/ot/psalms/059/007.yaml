lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel wird knapp und würdig wiedergegeben; »Sieh« bewahrt ihren hinweisenden Nachdruck.
- source_word: יַבִּיעוּן
  choice: sprudeln die Worte
  rationale: Der Hifil von נבע bezeichnet ein Hervorquellen oder Sprudeln. Das im Deutschen ergänzte »die Worte« macht den bildhaften, im Hebräischen objektlosen Redevorgang verständlich, ohne »Schwerter« fälschlich zum Objekt zu machen.
- source_word: בְּפִיהֶם
  choice: aus ihrem Mund
  rationale: Beim Bild des Hervorsprudelns gibt »aus« die Ausgangsrichtung im natürlichen Deutschen wieder; der kollektive Singular »Mund« bewahrt den poetischen Ausdruck.
- source_word: חֲרָבוֹת
  choice: Schwerter
  rationale: Die konkrete Metapher für verletzende und gewaltsame Rede bleibt erhalten und wird nicht erklärend aufgelöst.
- source_word: בְּשִׂפְתוֹתֵיהֶם
  choice: auf ihren Lippen
  rationale: Dies ist die natürliche deutsche Entsprechung und wahrt den poetischen Parallelismus mit »aus ihrem Mund«.
- source_word: כִּי
  choice: denn sie sagen
  rationale: »Denn« gibt die begründende Verknüpfung wieder; »sie sagen« wird zur natürlichen Einführung der folgenden direkten Rede ergänzt.
- source_word: מִי שֹׁמֵעַ
  choice: Wer hört es?
  rationale: Das Partizip wird präsentisch wiedergegeben. »Es« bezieht sich idiomatisch auf das zuvor geschilderte Reden, während die Frage bewusst offenlässt, wer als möglicher Hörer gemeint ist.
theological_decisions:
- issue: Nicht genannter Gegenstand beziehungsweise Adressat des Hörens
  choice: »Wer hört es?« lässt den möglichen Hörer unbestimmt und ergänzt nur ein idiomatisch notwendiges neutrales Objekt.
  alternative: »Wer hört?« oder »Wer hört uns?«
  rationale: Das Hebräische nennt kein Objekt. »Wer hört uns?« würde eine Festlegung importieren; das deutsche »Wer hört?« klingt dagegen eher wie eine Frage nach Hörfähigkeit. »Wer hört es?« bewahrt die offene, überhebliche Behauptung, ohne Gott ausdrücklich einzusetzen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit bewahrter Bildsprache und knappem poetischem Rhythmus. »Sprudeln die Worte« erhält das Quellenbild des hebräischen Verbs und verhindert, dass »Schwerter« gegen die Syntax als dessen Objekt gelesen wird.
