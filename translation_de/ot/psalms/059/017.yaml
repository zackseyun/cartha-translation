source:
  edition: WLC
  text: עֻ֭זִּ/י אֵלֶ֣י/ךָ אֲזַמֵּ֑רָה כִּֽי אֱלֹהִ֥ים מִ֝שְׂגַּבִּ֗/י אֱלֹהֵ֥י חַסְדִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/017.yaml
  text: O my strength[a], to you I will sing praises, for God is my stronghold, the God of my steadfast love.
translation:
  language: de
  text: Meine Stärke, dir will ich lobsingen, denn Gott ist meine Festung, der Gott meiner treuen Liebe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „mein gnädiger Gott“ oder „der Gott, der mir treue Liebe erweist“. Wörtlich steht im Hebräischen: „der Gott meiner treuen Liebe“.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֻזִּי
  choice: Meine Stärke
  rationale: Das Substantiv עֹז bezeichnet Stärke oder Macht; mit dem Suffix der ersten Person und in diesem poetischen Zusammenhang ist es als direkte Anrede Gottes zu verstehen.
- source_word: אֵלֶיךָ
  choice: dir
  rationale: Die Präposition אֶל bezeichnet die Ausrichtung auf jemanden hin. Beim Verb זמר gibt der deutsche Dativ „dir“ diese Richtung natürlich wieder.
- source_word: אֲזַמֵּרָה
  choice: will ich lobsingen
  rationale: Das Piel von זמר bezeichnet in den Psalmen gewöhnlich das Singen oder Musizieren zum Lob. „Lobsingen“ ist prägnant, verständlich und dem poetischen Register angemessen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für den Lobgesang ein; „denn“ bewahrt den kausalen Zusammenhang und den poetischen Satzfluss.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים bezeichnet hier eindeutig den Gott Israels und ist trotz seiner morphologisch pluralischen Form singularisch zu verstehen.
- source_word: מִשְׂגַּבִּי
  choice: meine Festung
  rationale: מִשְׂגָּב bezeichnet einen hoch gelegenen, sicheren Zufluchtsort. „Festung“ vermittelt den Schutz- und Sicherheitsaspekt in natürlichem Deutsch.
- source_word: אֱלֹהֵי חַסְדִּי
  choice: der Gott meiner treuen Liebe
  rationale: Die hebräische Genitivverbindung lautet wörtlich „Gott meines חֶסֶד“. „Treue Liebe“ gibt die Bedeutungsfelder von Güte, Loyalität und beständiger Zuwendung wieder; die bewusst gedrängte Formulierung bewahrt die Mehrdeutigkeit des Hebräischen.
theological_decisions:
- issue: Bezug und Bedeutung von חַסְדִּי
  choice: Die Genitivkonstruktion bleibt als „der Gott meiner treuen Liebe“ erhalten.
  alternative: „mein gnädiger Gott“ oder „der Gott, der mir treue Liebe erweist“
  rationale: Die hebräische Wendung kann Gottes loyale, gnädige Zuwendung zum Beter bezeichnen oder Gott als Ursprung und Inbegriff dieser Liebe charakterisieren. Der Haupttext löst diese theologisch bedeutsame poetische Verdichtung nicht stillschweigend auf.
translation_notes:
  register: Moderne, würdevolle Psalmsprache mit poetischer Inversion („dir will ich lobsingen“). Die Schlusswendung bleibt absichtlich dichter und ungewohnter als gewöhnliche Prosa, um die Mehrdeutigkeit der hebräischen Genitivverbindung zu bewahren.
