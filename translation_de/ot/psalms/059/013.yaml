source:
  edition: WLC
  text: כַּלֵּ֥ה בְ/חֵמָה֮ כַּלֵּ֪ה וְֽ/אֵ֫ינֵ֥/מוֹ וְֽ/יֵדְע֗וּ כִּֽי אֱ֭לֹהִים מֹשֵׁ֣ל בְּ/יַעֲקֹ֑ב לְ/אַפְסֵ֖י הָ/אָ֣רֶץ סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/013.yaml
  text: Consume them in wrath[a]; consume them until they are no more, so that they may know that God rules in Jacob to the ends of the earth[b]. Selah
translation:
  language: de
  text: Vertilge sie im Zorn[a]; vertilge sie, bis sie nicht mehr sind, damit sie erkennen, dass Gott in Jakob herrscht bis an die Enden der Erde[b]. Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Mach ihnen im Zorn ein Ende; mach ihnen ein Ende, und sie sind nicht mehr.“ Das Hebräische kann abrupter und wörtlicher wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: „In Jakob“ bezeichnet Gottes Herrschaft in Beziehung zu Jakob, das heißt Israel; manche übersetzen „über Jakob“.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּלֵּה
  choice: mach ihnen … ein Ende
  rationale: Der Piel-Imperativ bezeichnet das vollständige Zu-Ende-Bringen, hier im Sinn der Vernichtung. Die deutsche Wendung ist kraftvoll und natürlich; die Wiederholung des Imperativs bleibt erhalten.
- source_word: בְחֵמָה
  choice: im Zorn
  rationale: חֵמָה bezeichnet heftigen, glühenden Zorn. „Im Zorn“ gibt die modale beziehungsweise instrumentale Bedeutung der Präposition knapp wieder, ohne ein im Hebräischen nicht ausdrückliches Possessivpronomen einzufügen.
- source_word: וְאֵינֵמוֹ
  choice: bis sie nicht mehr sind
  rationale: Wörtlich lautet die Wendung etwa „und sie sind nicht (mehr)“. Im Zusammenhang mit dem wiederholten Imperativ gibt „bis sie nicht mehr sind“ die resultative Stoßrichtung in natürlichem Deutsch wieder.
- source_word: וְיֵדְעוּ
  choice: damit sie erkennen
  rationale: Der mit וְ verbundene Imperfekt kann hier die beabsichtigte Folge beziehungsweise den Zweck der vorausgehenden Bitte ausdrücken. „Damit sie erkennen“ bewahrt diese Deutung, ohne die Spannung dazu aufzulösen, wie die Vernichteten noch erkennen sollen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv bezeichnet hier im Kontext des Psalms den Gott Israels; „Gott“ ist die direkte deutsche Wiedergabe.
- source_word: מֹשֵׁל
  choice: herrscht
  rationale: Das Partizip bezeichnet fortdauernde Herrschaft. „Herrscht“ ist im Deutschen idiomatisch und bewahrt den königlichen beziehungsweise hoheitlichen Sinn.
- source_word: בְּיַעֲקֹב
  choice: in Jakob
  rationale: Die Präposition bedeutet zunächst „in“. „Jakob“ bleibt als Bezeichnung des Bundesvolkes stehen, statt im Haupttext deutend durch „Israel“ oder „über Jakob“ ersetzt zu werden.
- source_word: לְאַפְסֵי הָאָרֶץ
  choice: bis an die Enden der Erde
  rationale: Die feste Wendung bezeichnet die fernsten Bereiche der Welt. „Bis an die Enden der Erde“ ist eine genaue und im Deutschen geläufige Wiedergabe.
- source_word: סֶלָה
  choice: Sela
  rationale: Da die genaue Bedeutung des liturgischen oder musikalischen Ausdrucks unsicher ist, wird er traditionsgemäß transliteriert.
theological_decisions:
- issue: Fluchbitte gegen die Feinde
  choice: Die unmittelbare Bitte um ihre vollständige Vernichtung bleibt ungemildert stehen.
  alternative: Die Bitte als bloße Einschränkung, Niederlage oder bildliche Übertreibung wiederzugeben.
  rationale: Der hebräische Text wiederholt den Imperativ und führt ihn bis zum Nicht-mehr-Sein der Gegner. Eine Abschwächung würde die Härte der Bitte verdecken.
- issue: Erkennen nach der Vernichtung
  choice: „Damit sie erkennen“ bleibt trotz der inneren Spannung unmittelbar auf die genannten Gegner bezogen.
  alternative: Das Subjekt ausdrücklich in „alle Menschen“ oder „die Völker“ zu ändern oder nur eine zeitliche Folge zu formulieren.
  rationale: Die hebräische Form nennt kein neues Subjekt. Die daraus entstehende Spannung zwischen Vernichtung und Erkenntnis soll nicht durch eine erklärende Ergänzung beseitigt werden.
- issue: Gottes Herrschaft in Jakob und ihre weltweite Reichweite
  choice: Sowohl die besondere Beziehung zu Jakob als auch die Ausdehnung bis an die Enden der Erde werden bewahrt.
  alternative: בְּיַעֲקֹב ausschließlich als „über Jakob“ zu deuten oder die Aussage zu einer rein universalen Herrschaftsaussage umzuformen.
  rationale: Der Vers verbindet Gottes Herrschaft „in Jakob“ mit weltweiter Erkenntnis beziehungsweise Reichweite. Die Übersetzung lässt diese besondere und universale Dimension nebeneinander stehen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit kräftigem poetischem Rhythmus. Die Wiederholung der Bitte wird beibehalten. „Sela“ bleibt wegen seiner unsicheren Bedeutung unübersetzt.
