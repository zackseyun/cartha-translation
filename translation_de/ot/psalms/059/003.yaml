  yaml_path: translation/ot/psalms/059/003.yaml
  text: For look, they lie in wait for my life; fierce men gather against me, for no transgression or sin of mine, O LORD.
translation:
  language: de
  text: 'Denn sieh: Sie lauern mir nach dem Leben; Mächtige scharen sich gegen mich – ohne ein Vergehen oder eine Sünde meinerseits, HERR.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Denn sieh
  rationale: כִּי knüpft begründend an den Zusammenhang an; הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf die gegenwärtige Gefahr.
- source_word: אָרְבוּ לְנַפְשִׁי
  choice: Sie lauern mir nach dem Leben
  rationale: Die idiomatische deutsche Wendung gibt das Auflauern gegen נֶפֶשׁ im Sinn des bedrohten Lebens natürlich und präzise wieder.
- source_word: יָגוּרוּ עָלַי
  choice: rotten sich gegen mich zusammen
  rationale: Das Verb bezeichnet hier feindliches Zusammenkommen bzw. Sichzusammenrotten; עָלַי markiert die feindliche Ausrichtung gegen den Sprecher.
- source_word: עַזִּים
  choice: Gewalttätige
  rationale: Das substantivierte Adjektiv bezeichnet starke, trotzige oder brutale Gegner; „Gewalttätige“ erfasst im Kontext ihre bedrohliche Härte, ohne eine militärische Rolle hinzuzufügen.
- source_word: לֹא פִשְׁעִי וְלֹא חַטָּאתִי
  choice: ohne ein Vergehen, ohne eine Sünde von mir
  rationale: Die doppelte Verneinung und die Unterscheidung zwischen פֶּשַׁע und חַטָּאת bleiben erhalten. Die Aussage verneint hier einen eigenen Anlass für die Verfolgung.
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen wird beibehalten.
theological_decisions:
- issue: Unschuldsaussage des Beters
  choice: „ohne ein Vergehen, ohne eine Sünde von mir“
  alternative: „obwohl ich weder ein Verbrechen noch eine Sünde begangen habe“
  rationale: Die knappe nominale Form des Hebräischen wird bewahrt. Sie behauptet im unmittelbaren Zusammenhang, dass die Verfolgung nicht durch ein Vergehen des Beters verursacht ist, ohne daraus eine umfassende Sündlosigkeit abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach „sieh“ bildet den aufmerksamkeitslenkenden Ausruf ab; der Gedankenstrich hebt die Unschuldsaussage hervor. „Mir nach dem Leben lauern“ ist idiomatisch, während „rotten sich zusammen“ die feindliche Gruppenbildung deutlich macht.
