  source_fidelity: 'Die Grundstruktur und der Sinn des Hebräischen sind zutreffend wiedergegeben: die Bedrohung des Lebens, das feindliche Zusammenkommen und die Beteuerung fehlender eigener Schuld bleiben erhalten. עַזִים bezeichnet jedoch zunächst starke bzw. mächtige Gegner; „Gewalttätige“ legt deren Charakter stärker fest, als der Ausdruck selbst verlangt.'
