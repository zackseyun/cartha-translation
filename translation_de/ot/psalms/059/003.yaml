  terminology: „HERR“ ist die etablierte deutsche Wiedergabe des Tetragramms. „Vergehen“ und „Sünde“ geben פשע und חטאת angemessen unterscheidbar wieder, ohne die Aussage über den unmittelbaren Anlass der Verfolgung hinaus zu verallgemeinern.
