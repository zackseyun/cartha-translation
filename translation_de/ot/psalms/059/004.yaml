base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/004.yaml
  text: Without guilt[a], they run and set themselves in place; awake to meet me and see.
translation:
  language: de
  text: Ohne mein Verschulden[a] laufen sie heran und bringen sich in Stellung. Wach auf, komm mir entgegen und sieh!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne meine Schuld“. Der Ausdruck kann Schuld, Vergehen oder Unrecht bezeichnen; gemeint ist, dass der Beter keinen Anlass für ihren Angriff gegeben hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלִי עָוֺן
  choice: Ohne Schuld
  rationale: Die Wendung bezeichnet das Fehlen eigener Schuld; im Zusammenhang beteuert der Beter, dass der Angriff nicht durch sein Verschulden veranlasst ist.
- source_word: יְרוּצוּן
  choice: laufen sie heran
  rationale: רוץ bezeichnet laufen oder eilen. „Heranlaufen“ bewahrt das lebhafte Bewegungsbild und macht im Deutschen die feindliche Annäherung deutlich, ohne ein spezielles Angriffsszenario hinzuzufügen.
- source_word: וְיִכּוֹנָנוּ
  choice: und bringen sich in Stellung
  rationale: Die Form von כון kann hier ein Sich-Aufstellen, Sich-Festsetzen oder Sich-Bereitmachen ausdrücken. Die gewählte Formulierung erhält den konkreten Sinn und lässt die genaue Art der Vorbereitung offen.
- source_word: עוּרָה
  choice: Wach auf
  rationale: Der Imperativ bewahrt das kühne anthropomorphe Bild des hebräischen Klagegebets und seine Dringlichkeit.
- source_word: לִקְרָאתִי
  choice: komm mir entgegen
  rationale: Die Wendung bedeutet wörtlich eine Bewegung zur Begegnung hin. Im Deutschen benötigt der selbstständige Imperativ ein Bewegungsverb; „komm mir entgegen“ gibt den unmittelbaren Sinn wieder, ohne „hilf mir“ ausdrücklich einzutragen.
- source_word: וּרְאֵה
  choice: und sieh
  rationale: Der knappe Imperativ entspricht ראה und erhält die gedrängte Parallelität der Bitte.
theological_decisions:
- issue: Anthropomorpher Imperativ an Gott
  choice: Das Bild „Wach auf“ wird beibehalten.
  alternative: „Erhebe dich“ oder „Werde aktiv“
  rationale: Der Psalm bittet Gott in bewusst kühner Bildsprache um Eingreifen. Eine erklärende Umschreibung würde die poetische und theologische Spannung abschwächen; die Formulierung behauptet keinen buchstäblichen Schlaf Gottes.
- issue: Bezug von „ohne Schuld“
  choice: Die knappe, syntaktisch offene Formulierung bleibt erhalten.
  alternative: „Obwohl ich keine Schuld habe“
  rationale: Der hebräische Ausdruck nennt zunächst nur das Fehlen von Schuld und lässt den grammatischen Bezug knapp. Die Übersetzung soll die naheliegende Unschuldsbeteuerung nicht durch eine ausdrücklich ergänzte Ich-Konstruktion stärker festlegen als der Wortlaut.
translation_notes:
  register: Moderne, würdige Gebetssprache mit knappen Imperativen. „Bringen sich in Stellung“ ist idiomatisch und konkret, ohne die Gegner ausdrücklich als Soldaten zu bestimmen. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Wendung.
