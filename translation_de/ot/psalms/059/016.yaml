source:
  edition: WLC
  text: וַ/אֲנִ֤י אָשִׁ֣יר עֻזֶּ/ךָ֮ וַ/אֲרַנֵּ֥ן לַ/בֹּ֗קֶר חַ֫סְדֶּ֥/ךָ כִּֽי הָיִ֣יתָ מִשְׂגָּ֣ב לִ֑/י וּ֝/מָנ֗וֹס בְּ/י֣וֹם צַר לִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/016.yaml
  text: But I will sing of your strength[a]; I will sing aloud of your steadfast love in the morning, for you have been a stronghold for me[c][b], and a refuge in the day of my distress.
translation:
  language: de
  text: Doch ich will deine Macht besingen und am Morgen über deine treue Liebe jubeln[a][b]; denn du bist mir eine Schutzburg gewesen und eine Zuflucht am Tag meiner Not.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann sowohl lautes Jubeln als auch jubelndes Singen bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: „Treue Liebe“ gibt das hebräische Wort ḥesed wieder, das Gottes verlässliche, loyale und beständige Zuwendung bezeichnet.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Doch ich
  rationale: Die selbstständige Ich-Form hebt den Beter kontrastierend von den zuvor beschriebenen Feinden ab; „Doch ich“ gibt diesen Gegensatz natürlich wieder.
- source_word: אָשִׁיר עֻזֶּךָ
  choice: ich will deine Macht besingen
  rationale: Der Imperfekt drückt hier Entschluss beziehungsweise zukünftiges Handeln aus. „Besingen“ bildet das direkte hebräische Objekt idiomatisch ab; „Macht“ bezeichnet Gottes wirksame Kraft und seinen Schutz.
- source_word: וַאֲרַנֵּן
  choice: jubeln
  rationale: Das Verb רנן bezeichnet lauten, freudigen Jubel und kann besonders im poetischen Kontext auch jubelndes Singen einschließen. „Jubeln“ bewahrt diese Bedeutungsbreite; die musikalische Nuance wird in einer Fußnote genannt.
- source_word: לַבֹּקֶר
  choice: am Morgen
  rationale: Die Wendung ist temporal und steht im Zusammenhang des Psalms dem nächtlichen Umherstreifen der Feinde gegenüber.
- source_word: חַסְדֶּךָ
  choice: deine treue Liebe
  rationale: חסד bezeichnet hier Gottes verlässliche, loyale und zugewandte Liebe. „Treue Liebe“ ist verständlich und bewahrt sowohl die Beziehungs- als auch die Beständigkeitsdimension.
- source_word: כִּי הָיִיתָ
  choice: denn du bist … gewesen
  rationale: כִּי begründet den Lobpreis. Das Perfekt verweist auf erfahrenen Schutz mit fortdauernder Bedeutung; das deutsche Perfekt gibt dies angemessen wieder.
- source_word: מִשְׂגָּב
  choice: Schutzburg
  rationale: Das Wort bezeichnet einen erhöhten, sicheren Zufluchtsort oder eine feste Höhe. „Schutzburg“ verbindet Sicherheit und Wehrhaftigkeit in einem natürlichen Bild.
- source_word: וּמָנוֹס
  choice: und eine Zuflucht
  rationale: מָנוֹס ist ein Ort, zu dem man flieht, um Sicherheit zu finden. „Zuflucht“ bewahrt diese Vorstellung und bleibt von „Schutzburg“ unterscheidbar.
- source_word: בְּיוֹם צַר לִי
  choice: am Tag meiner Not
  rationale: Die knappe Formulierung bewahrt das hebräische Bild eines Tages persönlicher Bedrängnis und ist zugleich idiomatisches modernes Deutsch.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Zusammenhang göttlicher Rettung
  choice: deine treue Liebe
  alternative: deine Güte; deine beständige Liebe; deine Bundestreue
  rationale: Der Ausdruck umfasst Gottes verlässliche, loyale Zuwendung, ohne dass das hebräische Wort hier auf einen einzigen dogmatischen Fachbegriff verengt werden sollte. „Treue Liebe“ bewahrt sowohl die emotionale als auch die relationale Dimension.
- issue: Bezug von לַבֹּקֶר innerhalb der zweiten Verszeile
  choice: „am Morgen“ wird mit dem Jubeln verbunden
  alternative: „am Morgen“ könnte stärker auf den Anlass oder Zeitpunkt des Jubels über Gottes treue Liebe bezogen werden, ohne dass sich der Sinn wesentlich ändert
  rationale: Die hebräische Wortstellung legt den morgendlichen Zeitpunkt des Jubels nahe, lässt aber eine enge poetische Verbindung mit Gottes חֶסֶד bestehen. Die Übersetzung löst keine weitergehende zeitliche oder heilsgeschichtliche Deutung aus dem Ausdruck heraus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Rhythmus. „Besingen“, „jubeln“, „Schutzburg“ und „Zuflucht“ erhalten die Bildkraft und die Parallelstruktur des hebräischen Verses, ohne archaische Formen zu verwenden.
