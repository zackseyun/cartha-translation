  text: וְ/יָשׁ֣וּבוּ לָ֭/עֶרֶב יֶהֱמ֥וּ כַ/כָּ֗לֶב וִ/יס֥וֹבְבוּ עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/014.yaml
  text: They return at evening[c][b][a]; they growl like dogs and prowl around the city.
translation:
  language: de
  text: Am Abend kehren sie zurück; sie knurren wie Hunde[a] und streifen durch die Stadt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie heulen wie Hunde«; das hebräische Verb kann allgemein ein lautes, tierisches Geräusch bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשׁוּבוּ
  choice: kehren sie zurück
  rationale: שׁוב bedeutet grundlegend »zurückkehren«. Die Form beschreibt hier knapp ihre wiederkehrende abendliche Tätigkeit.
- source_word: לָעֶרֶב
  choice: Am Abend
  rationale: עֶרֶב bezeichnet den Abend; die Wendung gibt die Zeitangabe natürlich und ohne zusätzliche Deutung wieder.
- source_word: יֶהֱמוּ
  choice: sie knurren
  rationale: המה kann ein lautes, unruhiges oder tierisches Geräusch bezeichnen. Im unmittelbaren Vergleich mit Hunden passt »knurren«, während die weitere Bedeutung in einer Fußnote erhalten bleibt.
- source_word: כַכָּלֶב
  choice: wie Hunde
  rationale: Der hebräische Singular »wie ein Hund« ist generisch. Wegen des pluralischen Subjekts ist der Plural im Deutschen natürlicher und bewahrt das Bild einer umherziehenden Gruppe.
- source_word: וִיסוֹבְבוּ
  choice: und streifen durch
  rationale: סבב bezeichnet das Herumgehen oder Umkreisen. »Durch die Stadt streifen« gibt die Bewegung im Kontext des Hundebildes idiomatisch wieder, ohne ausdrücklich eine nicht genannte Absicht einzuführen.
- source_word: עִיר
  choice: die Stadt
  rationale: Obwohl im Hebräischen kein Artikel steht, verweist der Kontext auf die bekannte Stadt; im Deutschen ist daher der bestimmte Artikel natürlich.
