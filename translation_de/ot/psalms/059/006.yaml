base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/006.yaml
  text: They return at evening[c][b][a]; they growl like dogs and go around the city.
translation:
  language: de
  text: Am Abend kehren sie zurück; sie knurren wie Hunde[a] und ziehen in der Stadt umher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie heulen wie ein Hund“. Das hebräische Verb kann allgemein ein lautes, tierähnliches Geräusch bezeichnen; der Singular „Hund“ ist im Hebräischen generisch gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: sie kommen zurück
  rationale: Das Qal-Imperfekt von שוב bezeichnet hier die wiederkehrende Bewegung der Feinde; „kommen zurück“ ist im Deutschen natürlich und unmittelbar.
- source_word: לָעֶרֶב
  choice: am Abend
  rationale: ל mit עֶרֶב hat hier zeitliche Bedeutung. „Am Abend“ gibt die nächtliche Szenerie idiomatisch wieder.
- source_word: יֶהֱמוּ
  choice: sie knurren
  rationale: המה bezeichnet ein lautes, tierähnliches Geräusch. Im Vergleich mit Hunden vermittelt „knurren“ die bedrohliche Wirkung, ohne das Geräusch unnötig genau festzulegen.
- source_word: כַכָּלֶב
  choice: wie Hunde
  rationale: Der hebräische Singular ist generisch; beim pluralischen Subjekt klingt der Plural im Deutschen natürlicher und bewahrt das Bild einer umherziehenden Gruppe.
- source_word: וִיסוֹבְבוּ
  choice: und streifen durch
  rationale: סבב bedeutet sich herumbewegen oder umhergehen. „Durch die Stadt streifen“ gibt die rastlose Bewegung natürlich wieder, ohne ausdrücklich ein Einkreisen zu behaupten.
- source_word: עִיר
  choice: die Stadt
  rationale: Obwohl im Hebräischen kein Artikel steht, ist die bestimmte Stadt aus dem Zusammenhang vorausgesetzt; im Deutschen ist daher der bestimmte Artikel angemessen.
