  yaml_path: translation/ot/psalms/059/010.yaml
  text: The God of his steadfast love will go before me[b][a]; God will let me look on my enemies.
translation:
  language: de
  text: Der Gott seiner beständigen Liebe kommt mir zuvor[a][b]; Gott lässt mich auf meine Feinde blicken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Andere Vokalisierung bzw. Übersetzungstradition: „Mein Gott kommt mir mit seiner beständigen Liebe zuvor“ oder: „Mein Gott beständiger Liebe kommt mir zuvor.“'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort für „beständige Liebe“ (chesed) kann loyale, verlässliche Liebe oder Erbarmen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: Der Gott
  rationale: Die Konstruktform von אֱלֹהִים wird zusammen mit dem folgenden חַסְדּוֹ als „der Gott seiner … Liebe“ wiedergegeben; der bestimmte Artikel sorgt im Deutschen für einen natürlichen nominalen Ausdruck.
- source_word: חסדו
  choice: seiner beständigen Liebe
  rationale: חֶסֶד bezeichnet häufig verlässliche, loyale Liebe oder Erbarmen. „Beständige Liebe“ bewahrt die Aspekte von Zuwendung und Dauer, ohne den Bundesbezug im Haupttext stärker festzulegen, als es das Wort selbst verlangt. Das masoretische Suffix der 3. Person Singular wird mit „seiner“ erhalten.
- source_word: יְקַדְּמֵנִי
  choice: kommt mir zuvor
  rationale: Das Piel von קדם kann „zuvorkommen“, „entgegenkommen“ oder „vorangehen“ bedeuten. „Kommt mir zuvor“ bewahrt die Mehrdeutigkeit zwischen vorausgehendem und entgegenkommendem Handeln besser als eine ausschließlich räumliche Formulierung.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Wiederholung des Gottesnamens wird wie im Hebräischen beibehalten und nicht durch ein Pronomen ersetzt.
- source_word: יַרְאֵנִי
  choice: lässt mich … herabsehen
  rationale: 'Das Hifil von ראה ist kausativ bzw. permissiv: „sehen lassen“. In Verbindung mit ב und Feinden bezeichnet die Wendung häufig das Genugtuung oder Überlegenheit ausdrückende Herabsehen auf besiegte Gegner; „herabsehen“ gibt diesen idiomatischen Zusammenhang wieder, ohne „Sieg“ ausdrücklich hinzuzufügen.'
- source_word: בְשֹׁרְרָי
  choice: auf meine Feinde
  rationale: שׁורר bezeichnet feindliche Widersacher. „Meine Feinde“ ist die klare, natürliche deutsche Entsprechung; die Präposition ב wird in der deutschen Wendung „auf … herabsehen“ aufgenommen.
theological_decisions:
- issue: Pronominalsuffix in חסדו
  choice: seiner beständigen Liebe
  alternative: „Mein Gott kommt mir mit seiner beständigen Liebe zuvor“ oder „Mein Gott beständiger Liebe kommt mir zuvor“
  rationale: 'Der Konsonantentext חסדו und die masoretische Lesung ergeben ein Suffix der 3. Person Singular: „seiner“. Die syntaktisch ungewöhnliche Formulierung „der Gott seiner beständigen Liebe“ wird deshalb im Haupttext bewahrt. Eine verbreitete andere Vokalisierungs- bzw. Übersetzungstradition versteht אֱלֹהֵי als „mein Gott“; diese bedeutsame Alternative steht in der Fußnote.'
- issue: Aussage von יראני בשררי
  choice: Gott lässt mich auf meine Feinde herabsehen
  alternative: „Gott lässt mich meine Feinde sehen“
  rationale: Die idiomatische Verbindung kann das Anschauen des Schicksals besiegter Feinde ausdrücken. Die Übersetzung bewahrt den kausativen Sinn des Verbs, nennt jedoch weder Rache noch Triumph ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche hebräische Konstruktion „der Gott seiner beständigen Liebe“ bleibt bewusst erkennbar; Fußnoten sichern die wichtige alternative Lesung und die Bedeutungsbreite von חֶסֶד. Beide Fußnotenmarker stehen im Haupttext.
