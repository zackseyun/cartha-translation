revisions:
- from: Die Sünde ihres Mundes ist das Wort ihrer Lippen.[a] Sie sollen sich in ihrem Hochmut verfangen, wegen der Flüche und der Lügen, die sie verbreiten.[b]
  to: Wegen der Sünde ihres Mundes, wegen des Wortes ihrer Lippen sollen sie in ihrem Hochmut gefangen werden, wegen des Fluches und der Lüge, die sie aussprechen.[a]
  rationale: Die vorangestellte kausale Lesung vermeidet eine unbelegte Gleichsetzung und entspricht gut dem Gebetswunsch „sollen ... gefangen werden“. Die alternative, nominale Gliederung bleibt ausdrücklich als umstrittene syntaktische Möglichkeit belegt. Das Passiv wahrt den Niphal, und die kollektive Einzahl bei „Fluch und Lüge“ folgt dem Hebräischen, ohne im Deutschen unnatürlich zu wirken.
