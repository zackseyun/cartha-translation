    issue: Die Hauptfassung macht aus der einleitenden Nominalgruppe eine explizite Gleichsetzung.
    rationale: „Die Sünde ihres Mundes ist das Wort ihrer Lippen“ fügt „ist“ hinzu und kann den Sinn missverständlich auf eine Definition statt auf den Grund der imprecatorischen Bitte festlegen. Die syntaktische Alternative sollte als solche in einer Fußnote erhalten bleiben.
  - severity: medium
    issue: „Sie sollen sich ... verfangen“ gibt das Niphal reflexiv wieder.
    rationale: וְיִלָּכְדוּ bedeutet, dass sie gefangen bzw. gefasst werden sollen. Das deutsche Reflexivum kann eine eigenständige Verstrickung suggerieren; ein Passiv bildet die Form und den Sinn genauer ab.
