base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/012.yaml
  text: The sin of their mouth is the word of their lips[a]; let them be caught in their pride[b], because of the curse and the lie that they tell.
translation:
  language: de
  text: Wegen der Sünde ihres Mundes, wegen des Wortes ihrer Lippen sollen sie in ihrem Hochmut gefangen werden, wegen des Fluches und der Lüge, die sie aussprechen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, nach einer anderen syntaktischen Gliederung: »Die Sünde ihres Mundes ist das Wort ihrer Lippen; sie sollen in ihrem Hochmut gefangen werden wegen des Fluches und der Lüge, die sie aussprechen.« Die Einzahl »Fluch und Lüge« kann kollektiv ihr Fluchen und ihre Falschheit bezeichnen.'
    reason: syntactic_and_lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: Sünde
  rationale: Das Substantiv bezeichnet hier moralisches Fehlverhalten, das sich im Reden zeigt, nicht ein Sündopfer.
- source_word: פִּימוֹ
  choice: ihres Mundes
  rationale: Der Singular mit Suffix ist kollektiv gebraucht und bewahrt zusammen mit »ihren Lippen« die hebräische Körperteilmetaphorik.
- source_word: דְּבַר שְׂפָתֵימוֹ
  choice: das Wort ihrer Lippen
  rationale: Die poetische Genitivverbindung wird eng am Hebräischen wiedergegeben; sie bezeichnet das von ihren Lippen Gesagte.
- source_word: וְיִלָּכְדוּ
  choice: Sie sollen sich verfangen
  rationale: Der Niphal-Imperfekt hat im Gebetszusammenhang auffordernd-wünschenden Sinn. »Sich verfangen« gibt das passive Gefangenwerden idiomatisch wieder.
- source_word: בִגְאוֹנָם
  choice: in ihrem Hochmut
  rationale: גאון bezeichnet hier stolze Selbstüberhebung; die Wiedergabe erhält die Präposition und lässt offen, ob der Hochmut als Bereich oder Mittel ihres Verfangens gedacht ist.
- source_word: מֵאָלָה
  choice: wegen der Flüche
  rationale: מן wird kausal verstanden. Der hebräische Singular kann kollektiv das Fluchen beziehungsweise ihre Fluchworte bezeichnen; der deutsche Plural klingt in der Verbindung natürlich.
- source_word: מִכַּחַשׁ
  choice: der Lügen
  rationale: כחש bezeichnet Lüge, Falschheit oder Täuschung. Der Plural stimmt idiomatisch mit den wiederholt verbreiteten Äußerungen überein.
- source_word: יְסַפֵּרוּ
  choice: die sie verbreiten
  rationale: ספר bedeutet grundsätzlich erzählen oder berichten; bei Flüchen und Lügen bezeichnet es hier deren sprachliches Äußern. »Verbreiten« ist im Deutschen natürlich und umfasst wiederholtes Aussprechen.
theological_decisions:
- issue: Syntaktische Zuordnung von חטאת פימו דבר שפתימו und den folgenden Begründungen
  choice: Der erste Satz wird als nominale Aussage verstanden; Flüche und Lügen werden als Grund für das Ergriffenwerden wiedergegeben.
  alternative: 'Die gesamte erste Wortgruppe kann als vorangestellte Begründung gelesen werden: »Wegen der Sünde ihres Mundes, wegen des Wortes ihrer Lippen sollen sie sich in ihrem Hochmut verfangen, wegen der Flüche und der Lügen, die sie verbreiten.«'
  rationale: Der masoretische Akzent bei שפתימו stützt eine Zäsur, doch die knappe hebräische Syntax bleibt mehrdeutig. Die Hauptfassung folgt der naheliegenden nominalen Lesart; die Fußnote bewahrt die alternative Verknüpfung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener poetischer Mund-Lippen-Parallele. Die ungewöhnliche Syntax wird in der Hauptfassung lesbar gestaltet, während die echte syntaktische Mehrdeutigkeit in Fußnote [a] erhalten bleibt.
