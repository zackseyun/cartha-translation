lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Rette mich
  rationale: Das Hifil-Imperativ von נצל mit Suffix der 1. Person Singular bittet um Befreiung aus unmittelbarer Gefahr. „Rette mich“ ist im heutigen Deutsch natürlich und dringlich.
- source_word: מֵאֹיְבַי
  choice: vor meinen Feinden
  rationale: אֹיֵב ist die übliche Bezeichnung für einen Feind; מִן kennzeichnet hier die Gefahr, aus der beziehungsweise vor der Rettung erbeten wird.
- source_word: אֱלֹהָי
  choice: mein Gott
  rationale: Die persönliche Anrede mit Suffix der 1. Person Singular wird schlicht und unmittelbar wiedergegeben.
- source_word: מִּמִתְקוֹמְמַי
  choice: vor denen, die sich gegen mich erheben
  rationale: Die Partizipialform von קום bezeichnet Menschen, die sich gegen den Sprecher stellen oder auflehnen. Die Wiedergabe erhält das konkrete Bewegungsbild und vermeidet die engere Festlegung auf einen bestimmten Angriff.
- source_word: תְּשַׂגְּבֵנִי
  choice: schütze mich
  rationale: Das Piel von שׂגב kann bedeuten, jemanden hoch und dadurch unerreichbar zu setzen. „Schütze mich“ gibt im Haupttext die gemeinte Wirkung natürlich wieder; die räumliche Metapher bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Persönliche Gottesbezeichnung אֱלֹהָי
  choice: mein Gott
  alternative: Gott, der du mein bist
  rationale: Die einfache Possessivform drückt die persönliche Beziehung aus, ohne sie dogmatisch auszubauen.
- issue: Bildhafte oder wirkungsbezogene Wiedergabe von שׂגב
  choice: schütze mich
  alternative: bring mich in unerreichbare Höhe
  rationale: Der Kontext ist eine Bitte um Schutz vor Gegnern. Die Hauptfassung formuliert die Wirkung idiomatisch, während die Fußnote die konkrete hebräische Metapher und ihre mögliche Übersetzung bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der beiden Bitten bleibt erhalten; die zweite Zeile ist verständlich formuliert, ohne das hebräische Schutzbild in der Fußnote zu verlieren.
