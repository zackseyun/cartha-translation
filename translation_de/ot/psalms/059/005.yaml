id: PSA.59.5
reference: Psalms 59:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָֽה אֱלֹהִ֥ים צְבָא֡וֹת אֱלֹ֘הֵ֤י יִשְׂרָאֵ֗ל הָקִ֗יצָ/ה לִ/פְקֹ֥ד כָּֽל הַ/גּוֹיִ֑ם אַל תָּחֹ֨ן כָּל בֹּ֖גְדֵי אָ֣וֶן סֶֽלָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/005.yaml
  text: But you[a], O Yahweh God of hosts, God of Israel, awake to punish all the nations; show no favor to any treacherous evildoers[c][b]. Selah
translation:
  language: de
  text: Du aber, HERR, Gott der Heerscharen, Gott Israels, erwache, um alle Völker zur Rechenschaft zu ziehen[a]. Sei keinem treulosen Übeltäter gnädig[b]. Sela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um alle Völker heimzusuchen“ beziehungsweise „zu bestrafen“. Das hebräische Verb kann je nach Zusammenhang „sich jemandem zuwenden“, „heimsuchen“, „zur Rechenschaft ziehen“ oder „bestrafen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Hab mit keinem treulosen Übeltäter Erbarmen.“ Das hebräische Verb bedeutet wörtlich „gnädig sein“ oder „Gunst erweisen“.'
    reason: lexical_alternative
  - marker: c
    text: „Sela“ ist vermutlich eine musikalische oder liturgische Angabe; ihre genaue Bedeutung ist unbekannt.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchenform wird als „HERR“ dargestellt; sie wahrt den besonderen Namen, ohne eine unsichere deutsche Aussprache festzulegen.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Gott der Heerscharen
  rationale: Bewahrt den etablierten Titel und lässt dessen militärische wie kosmische Reichweite offen.
- source_word: הָקִיצָה
  choice: erwache
  rationale: Erhält die eindringliche poetische Metapher des hebräischen Imperativs.
- source_word: לִפְקֹד
  choice: um … zur Rechenschaft zu ziehen
  rationale: פקד besitzt ein breites Bedeutungsspektrum. Im Gerichtskontext gibt diese Formulierung die gerichtliche Stoßrichtung wieder, ohne den Sinn so eng wie „bestrafen“ festzulegen.
- source_word: כָּל הַגּוֹיִם
  choice: alle Völker
  rationale: „Völker“ gibt den kollektiven und politischen Sinn von גוים natürlich wieder, ohne eine spätere Juden-Heiden-Gegenüberstellung einzutragen.
- source_word: אַל תָּחֹן
  choice: Sei … nicht gnädig
  rationale: Gibt חנן enger als „kein Erbarmen haben“ mit dem Gedanken des Gnadenerweises wieder.
- source_word: בֹּגְדֵי אָוֶן
  choice: treulosen Übeltäter
  rationale: „treulos“ bewahrt den Verrats- beziehungsweise Untreueaspekt von בגד; „Übeltäter“ gibt die Verbindung mit און idiomatisch wieder.
- source_word: סֶלָה
  choice: Sela
  rationale: Die unklare liturgische oder musikalische Angabe wird transliteriert statt gedeutet.
theological_decisions:
- issue: Reichweite von כָּל הַגּוֹיִם im Kontext der Gerichtsbitte
  choice: alle Völker
  alternative: alle Heiden
  rationale: Die Formulierung bewahrt den breiten Bezug auf die Völker und vermeidet eine unnötige spätere ethnisch-theologische Zuspitzung.
- issue: Gerichtliche Bedeutung von פקד
  choice: zur Rechenschaft ziehen
  alternative: bestrafen
  rationale: Der Kontext verlangt eine gerichtliche Nuance, doch die gewählte Wendung erhält mehr von der Bedeutungsbreite des Verbs als die eindeutige Festlegung auf Strafe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit psalmtypischer Anrede und bewahrter Bildsprache. „Heerscharen“ bleibt als etablierter sakral-poetischer Titel stehen; die übrige Syntax ist bewusst klar und gegenwärtig.
