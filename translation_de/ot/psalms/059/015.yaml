  text: הֵ֭מָּה ינועו/ן לֶ/אֱכֹ֑ל אִם לֹ֥א יִ֝שְׂבְּע֗וּ וַ/יָּלִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/015.yaml
  text: They wander about for food[a]; if they are not satisfied[b], they spend the night.
translation:
  language: de
  text: Sie streifen umher auf der Suche nach Nahrung; wenn sie nicht satt werden, bleiben sie über Nacht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „knurren sie“; auch: „murren sie“. Das Schlussverb kann als „über Nacht bleiben/übernachten“ oder als „murren/knurren“ verstanden werden. Das Bild umherstreifender Hunde im Zusammenhang begünstigt die zweite Deutung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: sie
  rationale: Das selbstständige Pronomen der 3. Person Plural kann Nachdruck oder Kontrast anzeigen; im Deutschen genügt hier das natürliche „sie“.
- source_word: ינועון
  choice: streifen umher
  rationale: Das Verb נוּעַ bezeichnet eine Bewegung hin und her. Im Bild hungriger, umherziehender Feinde gibt „streifen umher“ die ruhelose Bewegung treffend wieder.
- source_word: לֶאֱכֹל
  choice: auf der Suche nach Nahrung
  rationale: Der Infinitiv von אָכַל mit לְ bezeichnet den Zweck, wörtlich „um zu essen“. Die gewählte Formulierung macht im Deutschen den Bezug zur Nahrungssuche natürlich deutlich.
- source_word: אִם לֹא
  choice: wenn ... nicht
  rationale: Die Wortfolge wird als einfache Bedingung verstanden und nicht als Bekräftigung oder als „es sei denn“ wiedergegeben.
- source_word: יִשְׂבְּעוּ
  choice: satt werden
  rationale: שׂבע bezeichnet besonders im Zusammenhang mit Nahrung das Satt- oder Zufriedensein. „Satt werden“ bewahrt das konkrete Hungerbild.
- source_word: וַיָּלִינוּ
  choice: bleiben sie über Nacht
  rationale: Die Form wird primär von לוּן/לִין „übernachten, die Nacht verbringen“ her verstanden. Im Deutschen klingt „über Nacht bleiben“ natürlich; die mögliche Deutung vom homonymen Stamm „murren/knurren“ wird in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Psalmsprache. „Streifen umher“ und „satt werden“ bewahren das anschauliche Bild; die echte lexikalische Mehrdeutigkeit des Schlussverbs wird nicht aufgelöst, sondern durch eine Fußnote offengehalten.
