source:
  edition: WLC
  text: הַ֭צִּילֵ/נִי מִ/פֹּ֣עֲלֵי אָ֑וֶן וּֽ/מֵ/אַנְשֵׁ֥י דָ֝מִ֗ים הוֹשִׁיעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/002.yaml
  text: Deliver me from workers of wickedness[b][a], and save me from men of blood.
translation:
  language: de
  text: Befreie mich von denen, die Unrecht tun, und rette mich vor Männern, die Blut vergießen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Männer des Blutes“; gemeint sein können blutdürstige Männer oder Männer, die Blut vergossen und dadurch Blutschuld auf sich geladen haben.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Befreie mich
  rationale: Der Imperativ von נצל bittet um Befreiung aus einer Bedrohung. „Befreie mich“ gibt dies in natürlichem Deutsch wieder und unterscheidet sich sprachlich vom folgenden הוֹשִׁיעֵנִי.
- source_word: מִפֹּעֲלֵי אָוֶן
  choice: von denen, die Unrecht tun
  rationale: Die Formulierung bewahrt die hebräische Verbindung aus „Täter/Handelnde“ und אָוֶן, ohne das im Deutschen schwerfällige „Täter des Unrechts“ zu verwenden. „Unrecht“ erfasst hier die moralische Bedeutung von אָוֶן, das auch Unheil oder Bosheit bezeichnen kann.
- source_word: וּמֵאַנְשֵׁי דָמִים
  choice: und … vor Männern, die Blut vergießen
  rationale: אַנְשֵׁי ist maskulin und bezeichnet hier männliche gewalttätige Gegner. Der hebräische Ausdruck „Männer des Blutes“ ist im modernen Deutsch unnatürlich; „Männer, die Blut vergießen“ vermittelt seine Bedeutung, während die Fußnote die wörtliche Bildsprache und deren Bedeutungsbreite festhält.
- source_word: הוֹשִׁיעֵנִי
  choice: rette mich
  rationale: Der Imperativ von ישׁע bezeichnet hier Rettung aus unmittelbarer Gefahr. „Rette mich“ ist klar, idiomatisch und legt keine besondere Art der Rettung fest.
theological_decisions:
- issue: Bedeutung des idiomatischen Plurals דָמִים
  choice: Männer, die Blut vergießen
  alternative: Männer des Blutes; blutdürstige Männer; Männer, die Blutschuld auf sich geladen haben
  rationale: Der idiomatische Ausdruck kann Blutvergießen, Blutschuld oder Blutgier bezeichnen. Der Haupttext verwendet eine verständliche, konkrete Wiedergabe; die Fußnote bewahrt die wörtliche Form und vermeidet, die mögliche Bedeutung auf bloße Gesinnung oder bereits erworbene Schuld zu verengen.
- issue: Wiedergabe des maskulinen אַנְשֵׁי
  choice: Männer
  alternative: Menschen; Leute
  rationale: Die hebräische Form ist ausdrücklich maskulin und bezeichnet in diesem Zusammenhang die männlichen Gegner des Beters. Daher wird das Geschlecht nicht neutralisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Bitten „Befreie mich“ und „rette mich“ bleiben erhalten. Die hebräische Täterkonstruktion wird mit einem natürlichen Relativsatz wiedergegeben; die schwer verständliche Blut-Idiomatik wird im Haupttext erschlossen und in der Fußnote transparent gemacht.
