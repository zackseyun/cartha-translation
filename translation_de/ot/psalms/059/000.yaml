id: PSA.59.0
reference: Psalms 59:0
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לַ/מְנַצֵּ֣חַ אַל תַּשְׁחֵת֮ לְ/דָוִ֪ד מִ֫כְתָּ֥ם בִּ/שְׁלֹ֥חַ שָׁא֑וּל וַֽ/יִּשְׁמְר֥וּ אֶת הַ֝/בַּ֗יִת לַ/הֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/000.yaml
  text: 'For the choir director: “Do Not Destroy.” Of David[a]. A miktam, when Saul sent men[d][c][b], and they watched the house to kill him.'
translation:
  language: de
  text: 'Für den musikalischen Leiter: »Vernichte nicht!«[a] Von David[b]. Ein Miktam[c]. Als Saul Leute schickte, bewachten sie das Haus, um ihn zu töten.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Vernichte nicht!« ist wahrscheinlich der Name einer Melodie oder eine musikalische Vortragsangabe.
    reason: cultural_note
  - marker: b
    text: 'Oder: »Für David«. Das Hebräische kann Autorschaft, Zugehörigkeit oder Widmung ausdrücken.'
    reason: lexical_alternative
  - marker: c
    text: Die genaue Bedeutung von »Miktam« ist unbekannt; deshalb wird das hebräische Wort in Umschrift wiedergegeben.
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlicher: »Als Saul schickte und sie das Haus bewachten, um ihn zu töten.« Das Hebräische nennt die entsandten Leute nicht ausdrücklich; das folgende Verb steht jedoch im Plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: Die übliche Überschriftsformel richtet den Psalm an die für die musikalische Ausführung verantwortliche Person; die Wiedergabe ist modern und funktional, ohne einen Chor vorauszusetzen.
- source_word: אַל־תַּשְׁחֵת
  choice: »Vernichte nicht!«
  rationale: Die direkte Bedeutung des hebräischen Ausdrucks bleibt erhalten. Anführungszeichen kennzeichnen ihn als Bezeichnung innerhalb der Überschrift, wahrscheinlich als Melodie- oder Vortragsangabe.
- source_word: לְדָוִד
  choice: Von David
  rationale: Dies ist die geläufige knappe Wiedergabe in Psalmüberschriften; eine Fußnote wahrt die mögliche Bedeutung »für David« und damit die Mehrdeutigkeit der Präposition.
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Die Bedeutung des Fachworts ist unsicher. Eine Transliteration vermeidet eine spekulative Deutung.
- source_word: בִּשְׁלֹחַ שָׁאוּל
  choice: Als Saul Leute schickte
  rationale: Die Konstruktion bezeichnet den Zeitpunkt. »Leute« ist im Hebräischen nicht ausdrücklich genannt, ergibt sich jedoch aus dem folgenden Verb im Plural und sorgt im Deutschen für einen verständlichen Satz.
- source_word: וַיִּשְׁמְרוּ אֶת־הַבַּיִת
  choice: bewachten sie das Haus
  rationale: שׁמר bezeichnet hier angesichts der feindlichen Absicht ein Beobachten beziehungsweise Bewachen des Hauses, nicht dessen Schutz. Die Umstellung bildet einen natürlichen deutschen Hauptsatz nach dem einleitenden Als-Satz.
- source_word: לַהֲמִיתוֹ
  choice: um ihn zu töten
  rationale: Der Infinitiv mit Präposition bezeichnet den Zweck; das Suffix der dritten Person Singular wird mit »ihn« wiedergegeben.
theological_decisions:
- issue: Zuordnung des Psalms zu David
  choice: Von David
  alternative: Für David
  rationale: Die Überschrift wird nicht dogmatisch auf eine bestimmte Art von Autorschaft festgelegt; die alternative Deutung des hebräischen לְ wird ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die knappen Satzteile bewahren den Charakter einer Psalmüberschrift. Unklare musikalische und literarische Fachangaben werden nicht spekulativ aufgelöst; notwendige Ergänzungen für natürliches Deutsch werden offengelegt.
