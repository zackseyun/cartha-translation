id: PSA.59.11
reference: Psalms 59:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַל תַּהַרְגֵ֤/ם פֶּֽן יִשְׁכְּח֬וּ עַמִּ֗/י הֲנִיעֵ֣/מוֹ בְ֭/חֵילְ/ךָ וְ/הוֹרִידֵ֑/מוֹ מָֽגִנֵּ֣/נוּ אֲדֹנָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/011.yaml
  text: Do not kill them[a], lest my people forget; make them wander by your power and bring them down[b], O Lord our shield.
translation:
  language: de
  text: Töte sie nicht, sonst vergisst mein Volk. Treibe sie durch deine Macht[b] umher[a] und stürze sie nieder, Herr, unser Schild!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bring sie ins Wanken“ oder „erschüttere sie“; das hebräische Verb kann erzwungene Bewegung oder Unbeständigkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch deine Kraft“; das hebräische Wort kann Kraft, Macht oder militärische Stärke bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּהַרְגֵם
  choice: Töte sie nicht
  rationale: Die Verneinung mit der Verbform drückt ein Verbot aus; „töten“ gibt הרג klar und ohne archaische Färbung wieder.
- source_word: פֶּן יִשְׁכְּחוּ עַמִּי
  choice: sonst vergisst mein Volk
  rationale: פֶּן leitet die befürchtete Folge ein. „Sonst“ ist im modernen Deutschen natürlich und vermeidet, die Aussage eindeutig als Absicht zu deuten.
- source_word: הֲנִיעֵמוֹ
  choice: Treibe sie … umher
  rationale: Die Kausativform bezeichnet ein Veranlassen zu Bewegung oder Unstetigkeit. „Umhertreiben“ passt zum fortdauernden Gericht im Gegensatz zur sofortigen Tötung, ohne die möglichen Nuancen von Erschüttern oder Wanken auszuschließen.
- source_word: בְחֵילְךָ
  choice: durch deine Macht
  rationale: חַיִל kann Kraft, Macht oder militärische Stärke bezeichnen. Im Gebet an Gott liegt hier seine wirksame Macht nahe; die Präposition wird instrumental wiedergegeben.
- source_word: וְהוֹרִידֵמוֹ
  choice: und stürze sie nieder
  rationale: Die Hifilform von ירד bedeutet, jemanden hinabzubringen. „Niederstürzen“ bewahrt das räumliche Bild und lässt offen, ob zugleich Erniedrigung oder Entmachtung gemeint ist.
- source_word: מָגִנֵּנוּ
  choice: unser Schild
  rationale: Das konkrete Bild des Schildes als Bezeichnung für Gottes Schutz wird bewahrt und nicht zu „Beschützer“ verallgemeinert.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Der Gottestitel steht in direkter Anrede. „Herr“ ist die natürliche deutsche Wiedergabe; es handelt sich hier nicht um das Tetragramm.
theological_decisions:
- issue: Art des erbetenen Gerichts
  choice: Der Beter bittet nicht um sofortige Tötung, sondern um ein fortdauerndes, sichtbares Gericht durch Umhertreiben und Niederstürzen, damit das Volk nicht vergisst.
  alternative: Die Bitte kann allgemeiner als Erschütterung und Erniedrigung verstanden werden, ohne ein buchstäbliches Umherirren vorauszusetzen.
  rationale: Die Folge „Töte sie nicht … treibe sie umher … stürze sie nieder“ stellt den sofortigen Tod einem länger sichtbaren Gericht gegenüber. Die Übersetzung erhält diese Spannung, ohne dessen genaue Form dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sonst“ gibt die befürchtete Folge idiomatisch wieder. Die Schildmetapher und die direkte Anrede bleiben erhalten; das Ausrufezeichen markiert den Gebetsruf.
