  text: וְ/אַתָּ֣ה יְ֭הוָה תִּשְׂחַק לָ֑/מוֹ תִּ֝לְעַ֗ג לְ/כָל גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/008.yaml
  text: But you[a], O Yahweh, laugh at them; you mock all the nations.
translation:
  language: de
  text: Doch du, Jahwe, lachst über sie; du spottest über alle Völker.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Doch du
  rationale: Die Konjunktion zusammen mit dem ausdrücklich gesetzten Pronomen markiert hier einen kontrastierenden Wendepunkt. „Doch du“ gibt diesen Gegensatz im Deutschen natürlich und prägnant wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: תִּשְׂחַק לָ/מוֹ
  choice: lachst über sie
  rationale: Das Verb bezeichnet Lachen; die Präposition mit Pronominalsuffix benennt dessen Ziel. „Über sie lachen“ bewahrt das konkrete Bild und ist idiomatisches Deutsch.
- source_word: תִּלְעַג
  choice: spottest über
  rationale: Das Verb bezeichnet höhnisches Spotten. „Über … spotten“ ist klar, gegenwärtig und angemessen kraftvoll.
- source_word: לְ/כָל גּוֹיִם
  choice: über alle Völker
  rationale: גּוֹיִם meint hier umfassend die Völker bzw. Nationen; „Völker“ ist im poetischen und theologischen Kontext die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen direkt. Die Wiedergabe „Jahwe“ bewahrt ihn als Eigennamen und ersetzt ihn nicht durch einen Titel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. Der Kontrast am Versanfang und die zwei parallelen Aussagen werden bewahrt.
