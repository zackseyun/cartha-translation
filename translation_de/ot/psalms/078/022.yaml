  text: כִּ֤י לֹ֣א הֶ֭אֱמִינוּ בֵּ/אלֹהִ֑ים וְ/לֹ֥א בָ֝טְח֗וּ בִּֽ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/022.yaml
  text: because they did not believe in God, and did not trust in his salvation.
translation:
  language: de
  text: Denn sie glaubten nicht an Gott und vertrauten nicht auf seine Rettung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶאֱמִינוּ בֵּאלֹהִים
  choice: glaubten … an Gott
  rationale: Die Konstruktion mit ב bezeichnet hier das Setzen von Glauben bzw. Vertrauen auf Gott; „an Gott glauben“ ist im Deutschen natürlich und bewahrt die von der Revision ausdrücklich bestätigte relationale Aussage.
- source_word: בָטְחוּ בִּישׁוּעָתוֹ
  choice: vertrauten … auf seine Rettung
  rationale: בטח mit ב wird idiomatisch mit „auf … vertrauen“ wiedergegeben. יְשׁוּעָה bezeichnet Rettung bzw. Heil; „Rettung“ ist hier konkret und allgemeinverständlich, ohne die Aussage theologisch zu verengen.
theological_decisions:
- issue: Bedeutung von „an Gott glauben“
  choice: „glaubten nicht an Gott“
  alternative: „glaubten Gott nicht“
  rationale: Der hebräische Ausdruck mit בְּ stellt Gott als Gegenstand des Glaubens und Vertrauens dar, nicht primär eine einzelne Aussage Gottes als Gegenstand des Fürwahrhaltens. So bleibt zudem der Parallelismus zu „vertrauten nicht auf seine Rettung“ erhalten.
- issue: Wiedergabe von יְשׁוּעָה
  choice: „Rettung“
  alternative: „Heil“
  rationale: „Rettung“ bewahrt den im Psalm naheliegenden Gedanken an Gottes rettendes Eingreifen und vermeidet eine unnötige dogmatische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der enge synonyme Parallelismus der beiden Versteile bleibt erhalten; die wiederholte Verneinung wird entsprechend dem Hebräischen ausdrücklich wiedergegeben.
