id: PSA.78.4
reference: Psalms 78:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹ֤א נְכַחֵ֨ד מִ/בְּנֵי/הֶ֗ם לְ/ד֥וֹר אַחֲר֗וֹן מְֽ֭סַפְּרִים תְּהִלּ֣וֹת יְהוָ֑ה וֶ/עֱזוּז֥/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו אֲשֶׁ֣ר עָשָֽׂה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/004.yaml
  text: We will not hide them from their children[a], telling the coming generation the praiseworthy deeds of Yahweh, and his strength[c][b], and his wonders that he has done.
translation:
  language: de
  text: Wir werden sie ihren Kindern nicht verschweigen, sondern der kommenden Generation[a] von den Ruhmestaten Jahwes[b], seiner Macht und den Wundern erzählen, die er vollbracht hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der nächsten Generation“ oder „einer späteren Generation“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vom Lob Jahwes“. Das hebräische Wort kann sowohl den Jahwe dargebrachten Lobpreis als auch seine rühmenswerten Taten bezeichnen; der Zusammenhang spricht hier eher für Letzteres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְכַחֵד
  choice: wir werden … nicht verschweigen
  rationale: Das Piel von כחד bezeichnet hier das Verbergen oder Vorenthalten. „Nicht verschweigen“ ist im Deutschen natürlich und passt besonders zur anschließenden Weitergabe durch Erzählen.
- source_word: מִבְּנֵיהֶם
  choice: ihren Kindern
  rationale: בנים kann Söhne, Kinder oder Nachkommen bezeichnen. Im Zusammenhang der Weitergabe zwischen Generationen vermeidet „Kinder“ eine unnötige Beschränkung auf männliche Nachkommen.
- source_word: לְדוֹר אַחֲרוֹן
  choice: der kommenden Generation
  rationale: Die Wendung bezeichnet eine nachfolgende beziehungsweise spätere Generation. „Kommende Generation“ bewahrt den in die Zukunft gerichteten Sinn.
- source_word: מְסַפְּרִים
  choice: sondern … erzählen
  rationale: 'Das Partizip erläutert, wie das Nichtverschweigen geschieht: durch berichtendes Erzählen. Die deutsche finite Konstruktion mit „sondern“ gibt diesen Zusammenhang klar und idiomatisch wieder.'
- source_word: תְּהִלּוֹת יְהוָה
  choice: von den Ruhmestaten Jahwes
  rationale: תהלות kann sowohl Lobpreis als auch das Lobenswerte beziehungsweise ruhmvolle Taten bezeichnen. Die Verbindung mit Macht und vollbrachten Wundern spricht hier eher für die Taten, von denen erzählt wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen gebräuchliche wissenschaftliche Umschriftform.
- source_word: עֱזוּזוֹ
  choice: seiner Macht
  rationale: Das Substantiv bezeichnet Stärke oder Macht. „Macht“ ist in diesem Zusammenhang natürlich und bezeichnet Jahwes wirksame Kraft.
- source_word: נִפְלְאוֹתָיו
  choice: den Wundern
  rationale: Der Ausdruck bezeichnet außergewöhnliche, Staunen hervorrufende Taten. „Wunder“ ist knapp, verständlich und sachlich angemessen.
- source_word: אֲשֶׁר עָשָׂה
  choice: die er vollbracht hat
  rationale: Der Relativsatz bezieht sich auf die Wunder. „Vollbracht hat“ bezeichnet abgeschlossene Taten mit fortdauernder Bedeutung und klingt im Deutschen würdevoll, ohne altertümlich zu sein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. Die Wiedergabe „Jahwe“ bewahrt ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von תְּהִלּוֹת יְהוָה
  choice: Ruhmestaten Jahwes
  alternative: Lobpreisungen Jahwes; das Lob Jahwes
  rationale: 'Die Reihung mit Jahwes Macht und seinen vollbrachten Wundern legt den objektiven Sinn nahe: Erzählt wird von dem, was an Jahwe rühmenswert ist. Die mögliche Bedeutung als an ihn gerichteter Lobpreis wird in der Fußnote offengehalten.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Verschweigen“ und „erzählen“ bilden einen natürlichen Gegensatz und geben die Funktion des hebräischen Partizips verständlich wieder. Die Aufzählung bleibt eng am hebräischen Satz, während die Präposition „von“ im Deutschen bei allen drei Gliedern mitverstanden wird.
