  text: יְשַׁלַּח בָּ֨/ם חֲר֬וֹן אַפּ֗/וֹ עֶבְרָ֣ה וָ/זַ֣עַם וְ/צָרָ֑ה מִ֝שְׁלַ֗חַת מַלְאֲכֵ֥י רָעִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/049.yaml
  text: He sent against them his burning anger[a], fury, indignation, and distress, a band of destructive messengers.
translation:
  language: de
  text: Er sandte gegen sie seinen glühenden Zorn, Grimm, Empörung und Bedrängnis sowie eine Schar unheilbringender Boten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Aussendung von Engeln des Unheils“; traditionell: „böse Engel“. Das Hebräische kann Boten bezeichnen, die durch verheerendes Unheil gekennzeichnet sind, statt Wesen, die moralisch böse sind.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: Er sandte
  rationale: Das Piel von שלח bezeichnet hier Gottes gegen Ägypten gerichtetes Handeln. Das Präteritum passt zur poetischen Erzählfolge.
- source_word: בָּם
  choice: gegen sie
  rationale: Bei שלח in diesem feindlichen Zusammenhang gibt die Präposition die Zielrichtung des Gerichts an.
- source_word: חֲרוֹן אַפּוֹ
  choice: seinen glühenden Zorn
  rationale: Die hebräische Wendung bezeichnet wörtlich die Glut seines Zorns. „Glühender Zorn“ bewahrt Bild und Intensität in natürlichem Deutsch.
- source_word: עֶבְרָה
  choice: Grimm
  rationale: Das Wort bezeichnet heftigen, überströmenden Zorn. „Grimm“ unterscheidet es vom vorausgehenden Zorn und wahrt die poetische Häufung.
- source_word: וָזַעַם
  choice: Empörung
  rationale: זעם kann entrüsteten, verurteilenden Zorn bezeichnen. „Empörung“ erhält eine eigene Nuance innerhalb der Reihe verwandter Begriffe.
- source_word: וְצָרָה
  choice: und Bedrängnis
  rationale: Der Ausdruck bezeichnet die Not, die über die Betroffenen kommt. „Bedrängnis“ passt zum gehobenen poetischen Register.
- source_word: מִשְׁלַחַת
  choice: eine Schar
  rationale: Das Substantiv bezeichnet eine Sendung beziehungsweise eine ausgesandte Gruppe. „Eine Schar“ ist im Deutschen idiomatisch und lässt den folgenden Botenbegriff natürlich anschließen.
- source_word: מַלְאֲכֵי
  choice: Boten
  rationale: מלאך kann menschliche oder übernatürliche Boten bezeichnen. „Boten“ wahrt diese lexikalische Offenheit.
- source_word: רָעִים
  choice: unheilbringender
  rationale: רע kann hier die schädliche oder verheerende Wirkung bezeichnen, ohne zwingend eine moralische Bosheit der Boten auszusagen. „Unheilbringend“ bewahrt diesen Gerichtssinn.
theological_decisions:
- issue: Ob מַלְאֲכֵי רָעִים moralisch böse Engel oder Boten beziehungsweise Engel des Unheils bezeichnet
  choice: eine Schar unheilbringender Boten
  alternative: 'eine Aussendung von Engeln des Unheils; traditionell: böse Engel'
  rationale: מלאך ist sowohl „Bote“ als auch „Engel“, und רע kann moralisch „böse“ oder wirkungsbezogen „schädlich, unheilvoll“ bedeuten. Der Haupttext vermeidet eine unnötige ontologische und moralische Festlegung; die möglichen engeren Lesarten stehen in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Verdichtung. Die Häufung der Zornes- und Notbegriffe sowie die Mehrdeutigkeit von מלאך und רע bleiben erhalten.
