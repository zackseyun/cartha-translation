  yaml_path: translation/ot/psalms/078/052.yaml
  text: Then he led out his people like sheep, and guided them like a flock in the wilderness.
translation:
  language: de
  text: Dann führte er sein Volk wie Schafe hinaus und leitete sie wie eine Herde in der Wüste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסַּע
  choice: führte … hinaus
  rationale: Das Hifil von נסע bezeichnet hier das Veranlassen des Aufbruchs bzw. das Herausführen. Im Exoduszusammenhang gibt „führte … hinaus“ die kausative Bewegung natürlich und präzise wieder.
- source_word: כַּצֹּאן
  choice: wie Schafe
  rationale: צאן bezeichnet Kleinvieh, besonders Schafe und Ziegen. Im Hirtenbild ist „Schafe“ im Deutschen die natürliche Wiedergabe.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: עם bezeichnet hier Israel als Gottes Volk; „sein Volk“ wahrt die Zugehörigkeitsbeziehung ohne zusätzliche Deutung.
- source_word: וַיְנַהֲגֵם
  choice: leitete sie
  rationale: נהג kann führen, treiben oder leiten bedeuten. „leitete“ erhält die fürsorgliche Hirtennuance und vermeidet eine unnötig harte Konnotation.
- source_word: כָּעֵדֶר
  choice: wie eine Herde
  rationale: עדר bezeichnet eine Herde. Zusammen mit „Schafe“ bleibt so das durchgehende Hirtenbild erhalten.
- source_word: בַּמִּדְבָּר
  choice: durch die Wüste
  rationale: מִדְבָּר bezeichnet unbewohntes, wildes Land und im Kontext die Wüste der Exoduswanderung. Das deutsche „durch“ gibt den Wegcharakter des Leitens idiomatisch wieder, obwohl die Präposition formal „in“ lautet.
theological_decisions:
- issue: Göttliches Hirtenbild für Israel im Exoduszusammenhang
  choice: 'Das Hirtenbild wird unmittelbar bewahrt: Gott führt sein Volk wie Schafe und leitet es wie eine Herde.'
  alternative: Das Bild durch eine ausdrückliche Bezeichnung Gottes als Hirten erläutern.
  rationale: Der hebräische Text gebraucht Vergleiche, nennt Gott hier aber nicht ausdrücklich „Hirte“. Die Übersetzung bewahrt das Bild und die Beziehung zu seinem Volk, ohne spätere theologische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und das pastorale Bild bleiben erhalten; „hinausführte“ verweist natürlich auf den Auszug, während „leitete“ die anschließende Führung hervorhebt.
