    issue: „durch die Wüste“ statt „in der Wüste“
    rationale: Die Präposition בְּ bedeutet hier primär „in“. „Durch“ ist im Exoduskontext zwar naheliegend, fügt aber die Vorstellung einer Durchquerung hinzu. „In der Wüste“ bewahrt die Formulierung des Ausgangstextes und entspricht auch der englischen Audit-Trail-Übersetzung.
