  text: וַ/יַּסְגֵּ֣ר לַ/בָּרָ֣ד בְּעִירָ֑/ם וּ֝/מִקְנֵי/הֶ֗ם לָ/רְשָׁפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/048.yaml
  text: He gave over their cattle to the hail[a], and their livestock to the lightning bolts.
translation:
  language: de
  text: Er gab ihr Vieh dem Hagel preis und ihre Herden den Feuerblitzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Flammen« bzw. »den feurigen Geschossen«; das hebräische Wort kann brennende oder blitzartig auffahrende zerstörerische Kräfte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: Er gab … preis
  rationale: סגר kann »verschließen« oder »ausliefern, preisgeben« bedeuten. Im Zusammenhang der Plage gibt »preisgeben« die Übergabe an eine zerstörerische Macht natürlich und präzise wieder.
- source_word: לַבָּרָד
  choice: dem Hagel
  rationale: בָּרָד bezeichnet Hagel; die Präposition ל markiert hier die Macht, der die Tiere preisgegeben werden.
- source_word: בְּעִירָם
  choice: ihr Vieh
  rationale: בְּעִיר bezeichnet gewöhnlich Nutz- oder Lasttiere. »Vieh« ist ein natürlicher deutscher Sammelbegriff und passt in den landwirtschaftlichen Zusammenhang.
- source_word: וּמִקְנֵיהֶם
  choice: und ihre Herden
  rationale: מִקְנֶה bezeichnet Vieh als Besitzbestand. »Herden« wahrt die poetische Parallelität und unterscheidet den Ausdruck zugleich leicht vom vorherigen »Vieh«.
- source_word: לָרְשָׁפִים
  choice: den Feuerblitzen
  rationale: רְשָׁפִים kann flammende oder blitzartig auffahrende zerstörerische Kräfte bezeichnen. »Feuerblitze« bewahrt sowohl die meteorologische als auch die feurige Bildkomponente, ohne die Mehrdeutigkeit auf gewöhnliche Blitze zu verengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe poetische Parallelität bleibt erhalten; »Vieh« und »Herden« spiegeln die überlappenden, aber nicht völlig identischen hebräischen Sammelbegriffe.
