translation:
  language: de
  text: Er gab ihren Ertrag der gefräßigen Heuschrecke[a] preis und den Ertrag ihrer Mühe[b] der Heuschrecke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Raupe“. Das hebräische Wort bezeichnet wahrscheinlich allgemeiner ein ernteverzehrendes Insekt und wird in Plagentexten oft als eine Art Heuschrecke verstanden.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „ihre Mühe“ bedeuten; gemeint sein kann entweder die Arbeit selbst oder das, was sie durch ihre Arbeit erworben hatten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: gab … preis
  rationale: נתן bedeutet wörtlich „geben“. Die im Deutschen idiomatische Verbindung „preisgeben“ bringt im Gerichtskontext zum Ausdruck, dass Gott die Ernte den Schädlingen überließ, ohne die Aussage zu verstärken.
- source_word: לֶחָסִיל
  choice: den Fressheuschrecken
  rationale: חָסִיל bezeichnet einen pflanzenfressenden Schädling, der in Plagentexten meist als Heuschreckenart verstanden wird. „Fressheuschrecken“ gibt die zerstörerische Funktion wieder, ohne eine genaue zoologische Bestimmung vorzutäuschen.
- source_word: יְבוּלָם
  choice: ihren Ertrag
  rationale: יְבוּל bezeichnet den Ertrag beziehungsweise die Erzeugnisse des Landes. „Ertrag“ ist knapp, natürlich und bewahrt den landwirtschaftlichen Bezug.
- source_word: וִיגִיעָם
  choice: den Ertrag ihrer Mühe
  rationale: יְגִיעַ kann sowohl die Mühe selbst als auch das dadurch Erworbene bezeichnen. Da Heuschrecken das Arbeitsergebnis vernichten, macht die Formulierung die wahrscheinliche metonymische Bedeutung verständlich und lässt den Bezug zur Mühe erkennen.
- source_word: לָאַרְבֶּה
  choice: den Schwarmheuschrecken
  rationale: אַרְבֶּה ist die gewöhnliche Bezeichnung für die Heuschrecke, häufig als kollektiver Singular. „Schwarmheuschrecken“ unterscheidet den Ausdruck vom parallelen חָסִיל und bezeichnet eine typische Form ihrer verheerenden Ausbreitung, ohne eine sichere Artenbestimmung zu behaupten.
