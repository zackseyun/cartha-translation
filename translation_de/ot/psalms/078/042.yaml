id: PSA.78.42
reference: Psalms 78:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹא זָכְר֥וּ אֶת יָד֑/וֹ י֝֗וֹם אֲֽשֶׁר פָּדָ֥/ם מִנִּי צָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/042.yaml
  text: They did not remember his hand[b][a], the day when he redeemed them from the foe.
translation:
  language: de
  text: Sie erinnerten sich nicht an seine Hand[a], an den Tag, an dem er sie vom Bedränger[b] erlöste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Macht“ oder „das, was seine Hand getan hatte“. Wörtlich steht im Hebräischen „seine Hand“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Feind“ oder „Widersacher“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרוּ
  choice: erinnerten sich
  rationale: Das Qal von זכר bedeutet hier „sich erinnern, gedenken“. Die verneinte Formulierung bleibt näher am Hebräischen als das stärker deutende „vergaßen“ und klingt zugleich natürlich.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: „Hand“ ist im Hebräischen ein konkretes Bild für Macht und wirksames Handeln. Das Bild bleibt im Haupttext erhalten, statt es durch eine abstrakte Deutung zu ersetzen.
- source_word: יוֹם אֲשֶׁר
  choice: an den Tag, an dem
  rationale: Die Wiedergabe bewahrt das ausdrücklich genannte יוֹם („Tag“) und gibt den anschließenden Relativsatz idiomatisch im Deutschen wieder.
- source_word: פָּדָם
  choice: er sie … erlöste
  rationale: פדה bezeichnet das Loskaufen beziehungsweise Befreien aus Bedrängnis oder Knechtschaft. „Erlösen“ bewahrt hier im Zusammenhang des Exodus sowohl den Rettungscharakter als auch das besondere Gewicht des Verbs.
- source_word: מִנִּי צָר
  choice: vom Bedränger
  rationale: צָר kann einen Feind, Widersacher oder Bedränger bezeichnen. „Bedränger“ passt zum Kontext der Unterdrückung und bewahrt den knappen poetischen Ausdruck, ohne eine bestimmte Person ausdrücklich festzulegen.
theological_decisions:
- issue: Bildhafte Bedeutung von „seine Hand“
  choice: Das konkrete Bild „seine Hand“ bleibt im Haupttext stehen.
  alternative: „seine Macht“ oder „was seine Hand getan hatte“
  rationale: Das Hebräische lässt die Hand als Bild für Gottes Macht und Handeln sprechen. Eine Auflösung des Bildes würde die Aussage unnötig festlegen.
- issue: Bedeutung von פדה im Zusammenhang des Exodus
  choice: „erlöste“
  alternative: „befreite“ oder „loskaufte“
  rationale: „Erlösen“ gibt den Rettungsakt aus Unterdrückung wieder und wahrt die heilsgeschichtliche Resonanz des Verbs, ohne über den Vers hinausgehende Lehrinhalte einzutragen.
translation_notes:
  register: Moderne, würdige Psalmsprache. Die Wiederholung von „an“ bildet den hebräischen Gedanken transparent ab; „Bedränger“ erhält den poetischen Ton und den Bezug zur Unterdrückung.
