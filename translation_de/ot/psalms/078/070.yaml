  text: He chose David his servant and took him from the sheepfolds[a].
translation:
  language: de
  text: 'Er erwählte David, seinen Diener,

    und nahm ihn von den Schafhürden[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Pferchen“ oder „aus den Einfriedungen für das Kleinvieh“.'
    reason: 'Lexikalische Alternative: מִכְלָא kann allgemein einen Pferch beziehungsweise eine Einfriedung bezeichnen, und צאן umfasst Kleinvieh, nicht ausschließlich Schafe.'
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: Er erwählte
  rationale: Das Qal-Wayyiqtol von בחר bezeichnet eine vollzogene Auswahl. „Erwählte“ ist im Deutschen natürlich und bewahrt den Gedanken göttlicher Wahl, ohne ihn weiter auszudeuten.
- source_word: בְּדָוִד
  choice: David
  rationale: Der Eigenname wird nach üblicher deutscher Form wiedergegeben; die Präposition ב gehört zur hebräischen Rektion von בחר und wird nicht gesondert übersetzt.
- source_word: עַבְדּוֹ
  choice: seinen Diener
  rationale: עבד kann „Diener“ oder „Sklave“ bedeuten. Hier ist es eine ehrende Bezeichnung für Davids Verhältnis zu Gott; „Diener“ trifft den Kontext, ohne einen Zwangsstatus in den Vordergrund zu rücken.
- source_word: וַיִּקָּחֵהוּ
  choice: und holte ihn
  rationale: לקח bedeutet grundsätzlich „nehmen“. In diesem Übergang von der Hirtentätigkeit zu Davids Berufung gibt „holte ihn“ die Bewegung aus den Hürden im natürlichen Deutschen präzise wieder.
- source_word: מִמִּכְלְאֹת צֹאן
  choice: von den Schafhürden
  rationale: מִכְלָא bezeichnet eine Einfriedung für Tiere, während צאן Kleinvieh, besonders Schafe und Ziegen, meint. „Schafhürden“ ist eine verständliche, knappe deutsche Wiedergabe der Wortverbindung; alternative allgemeinere Bezeichnungen werden in der Fußnote genannt.
theological_decisions:
- issue: Davids Bezeichnung als עבד Gottes
  choice: seinen Diener
  alternative: seinen Sklaven
  rationale: Der Ausdruck kennzeichnet David als Gott zugehörig und ihm dienend. Der unmittelbare Zusammenhang hebt jedoch nicht rechtliche Unfreiheit oder Zwang hervor, weshalb „Diener“ die ehrende und beauftragende Funktion angemessener vermittelt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Zeilengliederung. „Erwählte“ bewahrt den gehobenen Psalmton; „holte“ vermeidet die im Deutschen missverständliche Formulierung „nahm ihn von“.
