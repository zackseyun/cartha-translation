base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/000.yaml
  text: A Maskil of Asaph. Give ear[a], my people, to my instruction; incline your ears to the words of my mouth.
translation:
  language: de
  text: 'Ein Maskil Asafs.[a]


    Höre, mein Volk, auf meine Weisung;

    neigt eure Ohren den Worten meines Mundes zu!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Maskil“ ist ein Fachbegriff in Psalmüberschriften; möglicherweise bezeichnet er ein Lehr- oder Betrachtungslied.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Der technische Begriff der Psalmüberschrift bleibt transliteriert, weil seine genaue Bedeutung unsicher ist; die Fußnote nennt wahrscheinliche Deutungen.
- source_word: תּוֹרָתִי
  choice: meine Weisung
  rationale: תורה bezeichnet hier die lehrende Unterweisung des Psalmisten, nicht notwendig das mosaische Gesetz; „Weisung“ bewahrt diese Breite.
- source_word: הַאֲזִינָה ... הַטּוּ אָזְנְכֶם
  choice: Höre ... neigt eure Ohren ... zu
  rationale: Die bildhafte Parallelität der beiden Aufforderungen wird bewahrt; Singular und Plural des hebräischen Textes bleiben erkennbar.
- source_word: לְאָסָף
  choice: Asafs
  rationale: Der knappe Genitiv gibt die offene Zuordnung wieder; er kann Autorschaft, Zugehörigkeit oder Widmung bezeichnen.
theological_decisions:
- issue: Bedeutung von תורה im Aufruf
  choice: Weisung
  alternative: Gesetz
  rationale: Der Kontext kündigt eine mündliche Unterweisung über Gottes Handeln an. „Weisung“ vermeidet eine unnötige Verengung auf Gesetzesvorschriften.
- issue: Zuordnung des Psalms zu Asaf
  choice: Asafs
  alternative: von Asaf
  rationale: Die Genitivform bewahrt die im hebräischen לְ offene Beziehung, ohne eine bestimmte Auffassung von Autorschaft festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Parallelität und der Wechsel vom kollektiven Singular „mein Volk“ zum Pluralimperativ werden beibehalten.
