  source_fidelity: 'Die Übersetzung gibt die zwei auf das vorausgehende Überlieferungsgut bezogenen Aussagen sachgemäß wieder: Es wurde gehört und erkannt/erfahren, und die Väter haben davon erzählt. Die durch »was« ausgedrückte Objektbeziehung deckt auch das hebräische Suffix in וַנֵּדָעֵם angemessen ab. Die Vergangenheitsformen und der offene Übergang mittels Gedankenstrich entsprechen dem Kontext.'
