  text: אֲשֶׁ֣ר שָׁ֭מַעְנוּ וַ/נֵּדָעֵ֑/ם וַ֝/אֲבוֹתֵ֗י/נוּ סִפְּרוּ לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/003.yaml
  text: that we have heard and known, and our fathers have told us—
translation:
  language: de
  text: was wir gehört und erfahren haben und was unsere Väter uns erzählt haben —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: was … und was
  rationale: Das Relativpronomen knüpft an die vorausgehenden »Rätsel aus alter Zeit« an; die Wiederholung vor dem zweiten Teilsatz ist im Deutschen für Klarheit natürlich.
- source_word: שָׁמַעְנוּ
  choice: wir gehört haben
  rationale: Gibt das gewöhnliche Hören unmittelbar wieder.
- source_word: וַנֵּדָעֵם
  choice: und erfahren haben
  rationale: ידע bezeichnet hier ein durch Überlieferung erlangtes Kennen. »Erfahren« bewahrt den Unterschied zu »gehört«, ohne ein bloß verstandesmäßiges Wissen zu unterstellen; das Suffix der 3. Person Plural wird im deutschen Relativanschluss durch »was« aufgenommen.
- source_word: וַאֲבוֹתֵינוּ
  choice: und unsere Väter
  rationale: »Väter« bewahrt den generationenbezogenen und traditionsgeschichtlichen Ausdruck des Hebräischen.
- source_word: סִפְּרוּ לָנוּ
  choice: uns erzählt haben
  rationale: ספר im Piel bedeutet hier erzählen oder berichten; »erzählt« passt zur mündlichen Weitergabe an die nächste Generation.
theological_decisions:
- issue: Bedeutung von »unsere Väter«
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: Die formnahe Wiedergabe lässt sowohl die konkrete Elterngeneration als auch frühere Generationen im Blick und vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an den hebräischen Parallelismus. Der Gedankenstrich bewahrt den offenen Übergang zum folgenden Vers.
