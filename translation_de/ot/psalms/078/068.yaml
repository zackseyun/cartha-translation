  - severity: low
    issue: Die Fußnote erklärt die Konjunktion als bloß „verdeutlichend“ und behauptet, die Objekte stünden im Hebräischen ohne „und“ nebeneinander.
    rationale: Die Beobachtung zur hebräischen Asyndese ist richtig, aber für den deutschen Haupttext nicht erläuterungsbedürftig. Sie stützt zudem eine Formulierung, die im Deutschen missverständlich ist.
