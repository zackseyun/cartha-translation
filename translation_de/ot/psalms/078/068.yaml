  text: וַ֭/יִּבְחַר אֶת שֵׁ֣בֶט יְהוּדָ֑ה אֶֽת הַ֥ר צִ֝יּ֗וֹן אֲשֶׁ֣ר אָהֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/068.yaml
  text: But he chose the tribe of Judah[b][a], Mount Zion which he loved.
translation:
  language: de
  text: Doch er erwählte den Stamm Juda und den Berg Zion, den er liebte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: Doch er erwählte
  rationale: Das Verb בחר bedeutet »wählen, erwählen«. Das vorangestellte וַ führt die Erzählung fort; im Zusammenhang mit der Verwerfung Josefs und Ephraims im vorherigen Vers bringt »doch« zugleich den vorhandenen Gegensatz natürlich zum Ausdruck.
- source_word: שֵׁבֶט יְהוּדָה
  choice: den Stamm Juda
  rationale: שֵׁבֶט bezeichnet hier einen israelitischen Stamm; die deutsche Wendung »der Stamm Juda« ist geläufig und sachlich genau.
- source_word: הַר צִיּוֹן
  choice: den Berg Zion
  rationale: Dies ist die natürliche deutsche Wiedergabe der geografischen Bezeichnung הַר צִיּוֹן.
- source_word: אֲשֶׁר אָהֵב
  choice: den er liebte
  rationale: Das Relativpronomen bezieht sich grammatisch am nächsten auf den maskulinen Singular »Berg Zion« und gibt אָהֵב schlicht mit »liebte« wieder.
- source_word: אֶת ... אֶת
  choice: den Stamm Juda, den Berg Zion
  rationale: Im Hebräischen stehen nach einem einzigen Verb zwei ausdrücklich markierte direkte Objekte ohne verbindendes »und«. Die asyndetische Reihung wird im Haupttext bewahrt; eine Fußnote erläutert die mögliche verdeutlichende Wiedergabe.
theological_decisions:
- issue: Verhältnis der Erwählung Judas zur Erwählung Zions
  choice: Beide hebräischen Akkusativobjekte werden unter dem einen Verb wiedergegeben, ohne ihr Verhältnis durch ein eingefügtes »und« abschließend festzulegen.
  alternative: »Doch er erwählte den Stamm Juda und den Berg Zion, den er liebte.«
  rationale: Die doppelte Objektmarkierung spricht dafür, Juda und Zion beide als Gegenstände der göttlichen Wahl zu verstehen; das fehlende Bindewort lässt jedoch eine engere, erläuternde Zuordnung anklingen. Die Übersetzung bewahrt diese Spannung, ohne daraus eine weitergehende Erwählungslehre abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Erwählte« entspricht dem biblisch-theologischen Kontext, bleibt aber allgemein verständlich. Die knappe, bindewortlose Reihung folgt bewusst der hebräischen Form.
