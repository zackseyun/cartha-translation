  source_fidelity: 'Das Hebräische hat mit אֶת ... אֶת zwei ausdrücklich markierte Akkusativobjekte zu וַיִּבְחַר: den Stamm Juda und den Berg Zion. Die asyndetische hebräische Reihung verlangt im Deutschen kein Komma ohne Konjunktion; diese Form legt vielmehr missverständlich eine Apposition nahe. Die Relativklausel bezieht sich auf den unmittelbar vorausgehenden Berg Zion.'
  naturalness: „Doch er erwählte den Stamm Juda und den Berg Zion, den er liebte“ ist modernes, würdevolles Standarddeutsch. Die Konjunktion macht die zwei Gegenstände des Erwählens klar und vermeidet die im Entwurf unnatürliche bzw. semantisch irreführende Kommareihung.
  terminology: „erwählte“, „Stamm Juda“ und „Berg Zion“ sind treffend und im biblischen Register angemessen. Die knappe Relativklausel gibt אֲשֶׁר אָהֵב ohne theologische Ergänzung wieder.
