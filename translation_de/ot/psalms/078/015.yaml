base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/015.yaml
  text: He split rocks in the wilderness and gave them drink abundantly[a], as from the great depths.
translation:
  language: de
  text: 'Er spaltete Felsen in der Wüste

    und gab ihnen zu trinken

    wie aus großen Tiefen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְבַקַּע
  choice: spaltete
  rationale: Das Piel von בקע bezeichnet ein gewaltsames Spalten oder Aufbrechen. „Spaltete“ gibt das anschauliche Handeln knapp und natürlich wieder.
- source_word: צֻרִים
  choice: Felsen
  rationale: Der Plural von צוּר bezeichnet Felsen oder größere Felsmassen. „Felsen“ bewahrt den Plural und passt zum Wüstenmotiv.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר kann Wüste oder unbewohntes Wildnisgebiet bezeichnen. Im Zusammenhang mit Israels Wüstenwanderung ist „in der Wüste“ die natürliche deutsche Formulierung.
- source_word: וַיַּשְׁקְ
  choice: gab ihnen … zu trinken
  rationale: Das Hifil von שׁקה bedeutet „zu trinken geben“ oder „tränken“. Das im Hebräischen unausgedrückte Objekt wird aus dem Zusammenhang als „ihnen“ ergänzt.
- source_word: כִּתְהֹמוֹת
  choice: wie aus … Tiefen
  rationale: תְּהֹמוֹת ist der Plural von תְּהוֹם und bezeichnet Tiefen beziehungsweise tiefe, gewaltige Wassermassen. Die mit כְּ markierte Vergleichsaussage wird mit „wie“ bewahrt; „aus“ macht im Deutschen die gedachte Herkunft des Wassers verständlich.
- source_word: רַבָּה
  choice: reichlich / großen
  rationale: רַבָּה unterstreicht die Fülle oder Größe des Wassers beziehungsweise der Tiefen. Die Hauptfassung gibt den Fülleaspekt idiomatisch mit „reichlich“ wieder und erhält zugleich mit „großen Tiefen“ die Größe des Bildes; die Fußnote vermeidet diese verteilende Wiedergabe.
theological_decisions:
- issue: Art des Wasserbildes
  choice: Die vergleichende Bildsprache „wie aus großen Tiefen“ bleibt erhalten.
  alternative: Die Wendung kann enger als „wie mit mächtigen Urfluten“ verstanden werden.
  rationale: Der Text vergleicht Gottes reichliche Wassergabe mit den תְּהֹמוֹת, ohne ausdrücklich unterirdische Speicher oder ein bestimmtes kosmologisches Modell festzulegen. Die Übersetzung lässt diese poetische Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Zeilengliederung. „Wüste“, „Felsen“ und „Tiefen“ sind allgemein verständlich; die seltenere, stärker kosmologische Nuance „Urfluten“ bleibt der Fußnote vorbehalten.
