  text: He gave his people over to the sword[b][a], and was enraged with his inheritance.
translation:
  language: de
  text: Er gab sein Volk dem Schwert preis und war über sein Erbteil erzürnt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: Er gab … preis
  rationale: Der Hifil von סגר bezeichnet hier die Auslieferung in die Gewalt des Schwertes. „Preisgeben“ bewahrt die kausative Bedeutung und klingt im Deutschen natürlich.
- source_word: לַחֶרֶב
  choice: dem Schwert
  rationale: חֶרֶב bedeutet wörtlich „Schwert“ und steht hier zugleich für gewaltsamen Tod. Die konkrete Bildsprache des Hebräischen bleibt erhalten.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: עַם mit dem Suffix der 3. Person Singular bezeichnet Gottes eigenes Volk.
- source_word: וּבְנַחֲלָתוֹ
  choice: über sein Erbteil
  rationale: נַחֲלָה bezeichnet Israel als Gottes zugewiesenen Besitz. „Erbteil“ erhält den Bundes- und Besitzbezug; die Präposition ב wird passend zur deutschen Verbindung „über jemanden erzürnt sein“ wiedergegeben.
- source_word: הִתְעַבָּר
  choice: war … erzürnt
  rationale: Der Hitpael von עבר bezeichnet in dieser Wendung heftigen Zorn. „Erzürnt“ ist würdevoll und stark, ohne die Aussage unnötig auszubauen.
theological_decisions:
- issue: Bundesbezeichnungen für Israel
  choice: sein Volk … sein Erbteil
  alternative: seine Nation … sein Besitz
  rationale: Die beiden Bezeichnungen werden unterschieden und bewahren die Spannung, dass Gottes Gericht sein eigenes Bundesvolk und Eigentum trifft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelstruktur und die konkrete Schwertmetapher des Hebräischen bleiben erhalten; „Erbteil“ bewahrt den theologischen Klang von נַחֲלָה.
