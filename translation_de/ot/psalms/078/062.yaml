  source_fidelity: „Er gab sein Volk dem Schwert preis“ gibt וַיַּסְגֵּר לַחֶרֶב idiomatisch und mit der erforderlichen Auslieferungsbedeutung wieder. „war über sein Erbteil erzürnt“ entspricht dem starken Zorn-Ausdruck הִתְעַבָּר sowie der auf das Objekt bezogenen Präposition ב. Die zwei Bezeichnungen für Israel, „sein Volk“ und „sein Erbteil“, bleiben erkennbar unterschieden.
  naturalness: Der Satz ist klares, modernes Standarddeutsch mit einem angemessen würdevollen biblischen Register. „dem Schwert preisgeben“ ist eine etablierte und natürliche Wendung; die Satzverknüpfung ist flüssig.
  terminology: „Volk“, „Schwert“, „preisgeben“, „Erbteil“ und „erzürnt“ sind terminologisch treffend. „Erbteil“ bewahrt den Besitz-/Bundesklang von נַחֲלָה, ohne ihn konfessionell einzuengen.
