source:
  edition: WLC
  text: כֹּ֭הֲנָי/ו בַּ/חֶ֣רֶב נָפָ֑לוּ וְ֝/אַלְמְנֹתָ֗י/ו לֹ֣א תִבְכֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/064.yaml
  text: His priests fell by the sword[a], and his widows could not weep.
translation:
  language: de
  text: Seine Priester fielen durch das Schwert, und seine Witwen weinten nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „konnten nicht weinen“. Wörtlich steht im Hebräischen „weinten nicht“. Das kann schlicht das Ausbleiben der Klage feststellen oder andeuten, dass die Verwüstung keine Gelegenheit zur üblichen Totenklage ließ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנָיו
  choice: seine Priester
  rationale: כֹּהֵן bezeichnet hier das kultische Amt des Priesters; „Priester“ ist die direkte und im Zusammenhang eindeutige Wiedergabe.
- source_word: בַּחֶרֶב
  choice: durch das Schwert
  rationale: Die Präposition בְּ bezeichnet hier das Mittel beziehungsweise die Todesart. „Durch das Schwert“ ist im Deutschen verständlich und bewahrt zugleich das hebräische Bild.
- source_word: נָפָלוּ
  choice: fielen
  rationale: נפל bedeutet wörtlich „fallen“ und bezeichnet im Zusammenhang mit dem Schwert den Tod im Kampf. „Fielen“ erhält diese knappe poetische Bildsprache.
- source_word: וְאַלְמְנֹתָיו
  choice: und seine Witwen
  rationale: Das Suffix steht in der dritten Person maskulin Singular. Die ungewohnte Formulierung bewahrt den singularischen Bezug des Hebräischen, statt ihn erklärend zu „ihre Witwen“ zu glätten.
- source_word: לֹא תִבְכֶּינָה
  choice: weinten nicht
  rationale: Die Formulierung gibt die negierte Verbform unmittelbar wieder und lässt offen, ob lediglich das Ausbleiben der Klage festgestellt wird oder ob die Verwüstung keine Gelegenheit zur Totenklage ließ.
theological_decisions:
- issue: Bedeutung des ausbleibenden Weinens der Witwen
  choice: Die Hauptübersetzung lautet neutral „weinten nicht“.
  alternative: „konnten nicht weinen“ beziehungsweise „konnten keine Totenklage halten“
  rationale: Der hebräische Wortlaut drückt keine Fähigkeit oder Unfähigkeit ausdrücklich aus. Die kontextuell mögliche Deutung, dass das Ausmaß der Katastrophe eine übliche Totenklage verhinderte, wird daher in einer Fußnote genannt, aber nicht in den Haupttext eingetragen.
translation_notes:
  register: Knappe, würdevolle poetische Sprache in modernem Standarddeutsch. Die Wiederholung des singularischen Possessivpronomens folgt dem hebräischen Text; die ungewöhnliche Wendung „seine Witwen“ wird bewusst nicht geglättet. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Aussage.
