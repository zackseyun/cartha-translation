lexical_decisions:
- source_word: וַיִּרְעֵם
  choice: So weidete er sie
  rationale: Das Verb רעה bezeichnet das Weiden beziehungsweise die Tätigkeit eines Hirten. „Weidete“ bewahrt das für Davids Königtum wichtige Hirtenbild und klingt im Deutschen zugleich natürlich.
- source_word: כְּתֹם לְבָבוֹ
  choice: mit ungeteiltem Herzen
  rationale: תֹם bezeichnet Ganzheit, Lauterkeit oder Rechtschaffenheit. „Mit ungeteiltem Herzen“ verbindet die Vorstellung innerer Ganzheit mit einer verständlichen ethischen Aussage; die Präposition כ wird adverbial mit „mit“ wiedergegeben.
- source_word: לְבָבוֹ
  choice: Herzen
  rationale: לֵבָב bezeichnet den inneren Menschen einschließlich Wollen und Denken. „Herz“ erhält die hebräische Bildsprache und ist im Deutschen transparent.
- source_word: וּבִתְבוּנוֹת כַּפָּיו
  choice: mit geschickter Hand
  rationale: תְּבוּנָה bezeichnet Einsicht, Urteilsvermögen oder praktische Klugheit; zusammen mit כַּפָּיו („seine Hände/Handflächen“) ist konkrete Befähigung zum Leiten gemeint. Der deutsche Singular „mit geschickter Hand“ ist idiomatisch und bewahrt das Körperbild.
- source_word: יַנְחֵם
  choice: führte sie
  rationale: Die Hifil-Form von נחה bedeutet „führen“ oder „leiten“. „Führte“ passt zur Hirtenmetaphorik und bezeichnet eine kundige Leitung.
theological_decisions:
- issue: David als königlicher Hirte
  choice: Das ausdrückliche Hirtenbild bleibt durch „weidete“ erhalten.
  alternative: Eine allgemeinere Wiedergabe wie „kümmerte sich um sie“ oder „leitete sie“.
  rationale: Der Vers schließt die Darstellung Davids als von Gott erwählten Hirtenkönig ab. Das Hirtenbild gehört zur Aussage des Textes; spätere messianische Deutungen werden dabei weder eingefügt noch ausgeschlossen.
- issue: Innere Ganzheit oder moralische Rechtschaffenheit
  choice: „mit ungeteiltem Herzen“
  alternative: „mit lauterem Herzen“ oder „entsprechend der Rechtschaffenheit seines Herzens“
  rationale: תֹם umfasst sowohl Ganzheit als auch Lauterkeit. Die Hauptfassung bewahrt den Gedanken eines ganzen, ungeteilten Inneren; die ethisch ausdrücklichere Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der poetische Parallelismus und das Hirtenbild bleiben erhalten. Der idiomatische Singular „mit geschickter Hand“ fasst den hebräischen Plural „seine Hände“ natürlich zusammen; die Fußnote macht die zugrunde liegende ungewöhnliche Verbindung von Einsicht und Händen sichtbar.
