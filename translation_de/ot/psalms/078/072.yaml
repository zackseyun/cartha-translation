revisions:
- from: So weidete er sie mit ungeteiltem Herzen[a] und führte sie mit geschickter Hand[b].
  to: Er hütete sie mit lauterem Herzen[a] und leitete sie mit dem Geschick seiner Hände[b].
  rationale: Die Revision ersetzt die im heutigen Deutsch semantisch zu stark auf ausschließliche Hingabe festgelegte Wendung „mit ungeteiltem Herzen“ durch „mit lauterem Herzen“, das die Integritätsnuance von תֹם genauer trifft. „Hütete“ ist eine natürliche deutsche Wiedergabe der Hirtenmetapher. Die zweite Zeile bewahrt mit „seiner Hände“ den hebräischen Plural und formuliert die konkrete Kompetenznuance idiomatisch. Die Fußnotenanker stehen unmittelbar an den jeweils erläuterten Ausdrücken.
