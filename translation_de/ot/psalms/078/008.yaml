  naturalness: „Damit sie nicht ihren Vorfahren glichen“ ist im modernen Standarddeutsch deutlich idiomatischer als „damit sie nicht wie ihre Vorfahren würden“. Die überarbeitete Fassung bewahrt zugleich den vom vorherigen Vers abhängigen Zweckzusammenhang. „Ihr Herz nicht festigte“ ist eine klare, würdige poetische Formulierung.
  terminology: „widerspenstig und rebellisch“, „Herz“, „Geist“ und „Gott treu“ sind treffend und registergerecht. Die Unterscheidung von Herz und Geist bleibt erhalten, ohne sie dogmatisch aufzuladen. Die Fußnotenanker sind in der deutschen Fassung sachgerecht bei den jeweils erläuterten Ausdrücken gesetzt.
