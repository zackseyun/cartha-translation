source:
  edition: WLC
  text: וְ/לֹ֤א יִהְי֨וּ כַּ/אֲבוֹתָ֗/ם דּוֹר֮ סוֹרֵ֪ר וּ/מֹ֫רֶ֥ה דּ֭וֹר לֹא הֵכִ֣ין לִבּ֑/וֹ וְ/לֹא נֶאֶמְנָ֖ה אֶת אֵ֣ל רוּחֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/008.yaml
  text: and that they should not be like their fathers[a], a stubborn and rebellious generation[b], a generation that did not set its heart aright and whose spirit was not faithful to God.
translation:
  language: de
  text: 'und damit sie nicht ihren Vorfahren[a] glichen: einer widerspenstigen und rebellischen Generation, einer Generation, die ihr Herz nicht festigte[b] und deren Geist Gott nicht treu war.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihre Väter“. Gemeint sind hier die früheren Generationen ihres Volkes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihr Herz nicht bereitete“ beziehungsweise „ihr Herz nicht ausrichtete“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „deren Geist bei Gott nicht beständig war“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יִהְיוּ
  choice: und damit sie nicht … würden
  rationale: Der Satz setzt den Zweckzusammenhang aus dem vorhergehenden Vers fort. Die deutsche Formulierung macht diesen Bezug natürlich kenntlich.
- source_word: כַאֲבוֹתָם
  choice: wie ihre Vorfahren
  rationale: אָבוֹת bezeichnet hier die früheren Generationen Israels; „Vorfahren“ ist im heutigen Deutsch klarer als das wörtliche „Väter“ und schließt den gesamten geschichtlichen Bezug ein.
- source_word: דּוֹר
  choice: Generation
  rationale: Bewahrt den wiederholten kollektiven Singular und die poetische Wiederaufnahme im Vers.
- source_word: סוֹרֵר וּמֹרֶה
  choice: widerspenstig und rebellisch
  rationale: Die Wortpaarung bezeichnet sowohl hartnäckiges Abweichen als auch aktiven Widerstand.
- source_word: הֵכִין לִבּוֹ
  choice: ihr Herz nicht fest ausrichtete
  rationale: הכין kann „fest machen“, „bereiten“ oder „ausrichten“ bedeuten. Die Formulierung bewahrt sowohl den Gedanken innerer Festigkeit als auch den einer bewussten Ausrichtung.
- source_word: לִבּוֹ
  choice: ihr Herz
  rationale: „Herz“ erhält die hebräische Anthropologie, in der Wille, Denken und innere Haltung zusammenklingen. Das Singularpronomen folgt dem kollektiven Singular „Generation“.
- source_word: נֶאֶמְנָה אֶת אֵל
  choice: Gott nicht treu war
  rationale: Das Nifal von אמן bezeichnet Verlässlichkeit oder Treue. Bei Gott als Beziehungsgegenüber ist „Gott treu“ idiomatisches Deutsch; „bei Gott beständig“ bleibt als mögliche Nuance vermerkt.
- source_word: רוּחוֹ
  choice: deren Geist
  rationale: „Geist“ bewahrt den eigenständigen anthropologischen Ausdruck neben „Herz“ und bezeichnet hier die innere Haltung der Generation.
theological_decisions:
- issue: Unterscheidung von Herz und Geist
  choice: Beide Begriffe werden als „Herz“ und „Geist“ beibehalten.
  alternative: Beide zu „Inneres“ oder „Gesinnung“ zusammenfassen.
  rationale: Der hebräische Text verwendet bewusst zwei verwandte, aber unterschiedliche Begriffe. Ihre Beibehaltung bewahrt die poetische und anthropologische Spannung.
- issue: Kollektiver Singular bei „Generation“
  choice: 'Singularformen: „ihr Herz“ und „deren Geist“.'
  alternative: 'Pluralisch auf die Angehörigen der Generation beziehen: „ihre Herzen“ und „ihre Geister“.'
  rationale: Die hebräischen Suffixe stehen im Singular und beziehen sich auf das kollektive Substantiv דּוֹר.
- issue: Beziehung des Geistes zu Gott
  choice: „Gott nicht treu war“
  alternative: „bei Gott nicht beständig war“
  rationale: Die gewählte Fassung gibt die Beziehungs- und Treuedimension wieder, ohne die ebenfalls mögliche Nuance der Beständigkeit zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als Fortsetzung des Zweckzusammenhangs aus Vers 7 erkennbar. Die Wiederholung von „Generation“ sowie die Unterscheidung zwischen „Herz“ und „Geist“ werden bewahrt.
