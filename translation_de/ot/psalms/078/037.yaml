    reason: lexical_alternative
lexical_decisions:
- source_word: לִבָּם
  choice: ihr Herz
  rationale: Der Singular mit Suffix bezeichnet kollektiv das innere Wollen des Volkes. Der deutsche Singular bewahrt diese kollektive Perspektive.
- source_word: נָכוֹן
  choice: hielt nicht fest
  rationale: Das Wort bezeichnet hier Festigkeit und Beständigkeit der inneren Haltung. Die verbale Wendung ist im Deutschen natürlich und passt zu עִמּוֹ.
- source_word: עִמּוֹ
  choice: zu ihm
  rationale: Wörtlich bedeutet die Präposition „mit ihm“; in Verbindung mit „festhalten“ gibt „zu ihm“ die relationale Ausrichtung im Deutschen idiomatisch wieder.
- source_word: נֶאֶמְנוּ
  choice: hielten … nicht die Treue
  rationale: Der Nifal von אמן bezeichnet hier Verlässlichkeit beziehungsweise Treue. Die Wendung bringt den Bundesbruch klar und natürlich zum Ausdruck.
- source_word: בִּבְרִיתוֹ
  choice: seinem Bund
  rationale: Das hebräische ב wird bei der deutschen Wendung „die Treue halten“ idiomatisch durch den Dativ wiedergegeben.
theological_decisions:
- issue: Bundestreue
  choice: „sie hielten seinem Bund nicht die Treue“ beschreibt mangelnde loyale Bindung an Gottes Bund.
  alternative: 'Wörtlicher wäre: „sie waren in seinem Bund nicht treu/beständig“.'
  rationale: Der Parallelismus verbindet die unstete innere Haltung mit fehlender Bundestreue. Die Übersetzung bewahrt den relationalen und ethischen Gehalt, ohne spätere dogmatische Kategorien einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ihr Herz“ bewahrt den kollektiven Singular; „hielt nicht fest zu ihm“ und „hielten … nicht die Treue“ bilden den hebräischen Parallelismus natürlich ab.
