  text: Their heart was not steadfast with him[b][a], and they were not faithful to his covenant.
translation:
  language: de
  text: Ihr Herz hielt nicht fest zu ihm[a], und sie hielten seinem Bund nicht die Treue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ihr Herz war nicht fest mit ihm.“'
    reason: lexical_alternative
  - marker: b
