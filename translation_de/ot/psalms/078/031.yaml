  text: וְ/אַ֤ף אֱלֹהִ֨ים עָ֘לָ֤ה בָ/הֶ֗ם וַֽ֭/יַּהֲרֹג בְּ/מִשְׁמַנֵּי/הֶ֑ם וּ/בַחוּרֵ֖י יִשְׂרָאֵ֣ל הִכְרִֽיעַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/031.yaml
  text: Then the anger of God rose against them[a], and he killed the stoutest among them; he struck down the young men of Israel.
translation:
  language: de
  text: Da stieg Gottes Zorn gegen sie auf, und er tötete die Wohlgenährten unter ihnen[a]; die jungen Männer Israels streckte er nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Fetten unter ihnen«; gemeint sind wahrscheinlich die kräftigsten oder stattlichsten Männer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף אֱלֹהִים
  choice: Da stieg Gottes Zorn
  rationale: אַף bezeichnet hier idiomatisch den Zorn; das einleitende וְ führt die Erzählung weiter. Die Formulierung bewahrt das Bild des aufsteigenden göttlichen Zorns.
- source_word: עָלָה בָהֶם
  choice: stieg ... gegen sie auf
  rationale: עָלָה mit ב beschreibt hier ein feindliches Sich-Erheben gegen Menschen. Die deutsche Wendung erhält sowohl das Bewegungsbild als auch die Gerichtsrichtung.
- source_word: וַיַּהֲרֹג
  choice: er tötete
  rationale: Direkte, gegenwärtige Wiedergabe von הרג ohne altertümliche Abschwächung.
- source_word: בְּמִשְׁמַנֵּיהֶם
  choice: die Kräftigsten unter ihnen
  rationale: Wörtlich sind die »Fetten« beziehungsweise Wohlgenährten gemeint; im Zusammenhang bezeichnet der Ausdruck wahrscheinlich die kräftigsten oder stattlichsten Männer. Die Fußnote hält die konkrete Bildsprache offen.
- source_word: וּבַחוּרֵי יִשְׂרָאֵל
  choice: die jungen Männer Israels
  rationale: בָּחוּר bezeichnet gewöhnlich einen jungen Mann in der Blüte seiner Kraft, möglicherweise mit militärischem Beiklang.
- source_word: הִכְרִיעַ
  choice: streckte er nieder
  rationale: Der Hifil von כרע bedeutet, jemanden zum Beugen oder Fallen zu bringen. »Niederstrecken« gibt im Gerichtskontext die tödliche Wirkung und den poetischen Parallelismus natürlich wieder.
theological_decisions:
- issue: Anthropopathische Rede vom Zorn Gottes
  choice: Da stieg Gottes Zorn gegen sie auf
  alternative: Da wurde Gott zornig auf sie / Da kam Gottes Zorn über sie
  rationale: Die Übersetzung bewahrt die hebräische Metapher des aufsteigenden Zorns, statt sie in eine rein erklärende Aussage umzuwandeln. Sie legt dabei nicht näher fest, wie die bildhafte Rede theologisch zu systematisieren ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Satzstellung im zweiten Halbvers. Die drastischen Gerichtswörter werden nicht beschönigt; die ungewohnte hebräische Bildsprache bei מִשְׁמַנִּים wird im Haupttext verständlich wiedergegeben und in der Fußnote transparent gemacht.
