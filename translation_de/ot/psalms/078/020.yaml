base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/020.yaml
  text: Look[a], he struck the rock, and waters gushed out, and streams overflowed. Can he also give bread, or provide meat for his people?
translation:
  language: de
  text: Seht, er schlug den Felsen, da strömte Wasser hervor, und Bäche strömten über. Kann er auch Brot geben oder seinem Volk Fleisch[a] bereiten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bedeutet wörtlich „Fleisch“ und bezeichnet hier Fleisch als Nahrung.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Seht
  rationale: Die einleitende Partikel lenkt nachdrücklich auf eine offenkundige Tatsache. „Seht“ bewahrt diesen hinweisenden Charakter in verständlichem, gehobenem Deutsch.
- source_word: הִכָּה צוּר
  choice: er schlug den Felsen
  rationale: Die Form bezeichnet eine vergangene, kraftvolle Handlung; der bestimmte Fels ist durch die bekannte Wüstenbegebenheit vorausgesetzt.
- source_word: וַיָּזֻבוּ מַיִם
  choice: da strömte Wasser hervor
  rationale: Das Verb beschreibt das reichliche Hervorfließen. Der singularische deutsche Sammelbegriff „Wasser“ ist hier natürlicher als „Wasser“ im Plural.
- source_word: וּנְחָלִים יִשְׁטֹפוּ
  choice: und Bäche fluteten dahin
  rationale: נְחָלִים kann Bäche oder reißende Wasserläufe bezeichnen; zusammen mit שׁטף entsteht das Bild einer starken, überströmenden Wasserbewegung.
- source_word: הֲגַם לֶחֶם יוּכַל תֵּת
  choice: Kann er auch Brot geben
  rationale: Die Fragepartikel und גַם bilden eine skeptische rhetorische Frage, die Gottes Versorgung mit Wasser auf Brot ausweitet. „Brot“ bewahrt das konkrete Bild.
- source_word: אִם יָכִין
  choice: oder … bereiten
  rationale: אִם führt hier den zweiten Teil der rhetorischen Alternative ein. יָכִין bezeichnet in diesem Zusammenhang das Bereitmachen beziehungsweise Beschaffen von Nahrung.
- source_word: שְׁאֵר לְעַמּוֹ
  choice: seinem Volk Fleisch
  rationale: שְׁאֵר bezeichnet wörtlich Fleisch und meint hier Fleisch als Nahrung; לְעַמּוֹ wird idiomatisch als Dativ wiedergegeben.
theological_decisions:
- issue: Rhetorische Kraft des Zweifels Israels
  choice: Die Schlussaussage wird als skeptische Frage nach Gottes Fähigkeit wiedergegeben, außer Wasser auch Nahrung zu geben.
  alternative: Die beiden Glieder als sachliche oder weniger deutlich rhetorische Aussagen wiederzugeben.
  rationale: Die hebräische Fragepartikel und der Zusammenhang des Unglaubens verlangen eine erkennbare rhetorische Frage, ohne die Spannung durch erklärende Zusätze aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulichen Bewegungsverben. Die skeptische Stimme des Volkes bleibt unmittelbar hörbar; die historische und theologische Spannung wird nicht geglättet.
