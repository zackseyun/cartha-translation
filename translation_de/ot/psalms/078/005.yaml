  text: וַ/יָּ֤קֶם עֵד֨וּת בְּֽ/יַעֲקֹ֗ב וְ/תוֹרָה֮ שָׂ֤ם בְּ/יִשְׂרָ֫אֵ֥ל אֲשֶׁ֣ר צִ֭וָּה אֶת אֲבוֹתֵ֑י/נוּ לְ֝/הוֹדִיעָ֗/ם לִ/בְנֵי/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/005.yaml
  text: For he established a testimony in Jacob and set a law in Israel[c][b][a], which he commanded our fathers to make known to their children.
translation:
  language: de
  text: Er richtete in Jakob ein Zeugnis auf und setzte in Israel eine Weisung[a] ein; unseren Vätern gebot er, sie ihren Kindern bekannt zu machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Gesetz“. Das hebräische Wort Tora kann verbindliche Weisung, Unterweisung oder Gesetz bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: richtete … auf
  rationale: Das Hifil von קום bezeichnet hier das feste Aufrichten bzw. Einsetzen. „Richtete … auf“ bewahrt das Bild des Hebräischen und passt zu einer bleibenden göttlichen Ordnung.
- source_word: עֵדוּת
  choice: ein Zeugnis
  rationale: עֵדוּת kann ein Zeugnis, eine Bezeugung oder eine verpflichtende Bundesbestimmung bezeichnen. „Zeugnis“ erhält die Grundbedeutung, ohne den Ausdruck vorschnell auf einen Rechtserlass zu verengen.
- source_word: בְּיַעֲקֹב
  choice: in Jakob
  rationale: Die Präposition ב wird direkt wiedergegeben; „Jakob“ bezeichnet metonymisch das Bundesvolk und steht parallel zu „Israel“.
- source_word: וְתוֹרָה
  choice: eine Weisung
  rationale: תּוֹרָה umfasst Unterweisung und verbindliche Weisung. „Weisung“ gibt hier sowohl den lehrenden als auch den normativen Gehalt wieder, ohne automatisch den technischen Gesamttitel „das Gesetz“ anzunehmen.
- source_word: שָׂם
  choice: setzte … ein
  rationale: שׂים bedeutet setzen, stellen oder einsetzen. Im institutionellen Zusammenhang ist „einsetzen“ natürlich und gibt die wirksame Anordnung Gottes wieder.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die direkte Wiedergabe wahrt den Parallelismus mit „in Jakob“ und den gemeinschaftlichen Bezug.
- source_word: אֲשֶׁר צִוָּה
  choice: die er … gebot
  rationale: Das Relativpronomen wird auf „Weisung“ bezogen; zugleich bleibt sachlich möglich, dass der ganze vorausgehende Doppelbegriff gemeint ist. „Gebot“ bewahrt die Verbindlichkeit von צוה.
- source_word: אֶת אֲבוֹתֵינוּ
  choice: unseren Vätern
  rationale: Der ausdrücklich maskuline Plural wird beibehalten. Im Zusammenhang sind die Väter der früheren Generation des Volkes gemeint.
- source_word: לְהוֹדִיעָם
  choice: bekannt zu machen
  rationale: Das Hifil von ידע bedeutet „wissen lassen/bekannt machen“. Das maskuline Pluralsuffix kann sich gemeinsam auf „Zeugnis“ und „Weisung“ beziehen; im Deutschen erlaubt die Formulierung diese sachliche Rückbindung, ohne ein zusätzliches Pronomen zu erzwingen.
- source_word: לִבְנֵיהֶם
  choice: ihren Kindern
  rationale: בנים bedeutet formal „Söhne“, kann aber Nachkommen bzw. Kinder allgemein bezeichnen. Die generationenübergreifende Weitergabe ist hier nicht erkennbar auf männliche Nachkommen beschränkt.
theological_decisions:
- issue: Bedeutung von תּוֹרָה im bundesbezogenen Kontext
  choice: eine Weisung
  alternative: ein Gesetz
  rationale: „Weisung“ hält den unterweisenden und zugleich verbindlichen Sinn zusammen. „Gesetz“ ist möglich, könnte im Deutschen aber enger juristisch oder als feststehender Titel verstanden werden.
- issue: Bezugswort des Relativsatzes אֲשֶׁר צִוָּה
  choice: grammatischer Anschluss an „Weisung“, mit möglichem sachlichem Bezug auf beide Parallelbegriffe
  alternative: ausdrücklicher Bezug auf „Zeugnis und Weisung“
  rationale: Das feminine Singularpronomen אֲשֶׁר passt unmittelbar zu תּוֹרָה; der folgende maskuline Pluralsuffix in לְהוֹדִיעָם deutet jedoch darauf, dass die mitzuteilenden Inhalte als Mehrzahl oder als beide genannten Größen aufgefasst werden können. Die Übersetzung lässt diese Spannung bestehen.
- issue: Geschlechtsspezifische Verwandtschaftsbegriffe
  choice: „unseren Vätern … ihren Kindern“
  alternative: „unseren Vorfahren … ihren Söhnen“
  rationale: אבותינו ist ausdrücklich maskulin und wird als „Väter“ erhalten. בנים kann im intergenerationellen Kontext die Kinder insgesamt bezeichnen und wird daher natürlich mit „Kinder“ wiedergegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer hebräischer Parallelstruktur. „Richtete … auf“ und „setzte … ein“ bilden die beiden göttlichen Setzungsakte ab; die Satzstellung bleibt gut verständlich, ohne die poetische Dichte aufzulösen.
