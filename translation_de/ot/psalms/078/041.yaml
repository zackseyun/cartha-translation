  text: וַ/יָּשׁ֣וּבוּ וַ/יְנַסּ֣וּ אֵ֑ל וּ/קְד֖וֹשׁ יִשְׂרָאֵ֣ל הִתְווּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/041.yaml
  text: Again they turned back and tested God[a], and they limited the Holy One of Israel.
translation:
  language: de
  text: Wieder wandten sie sich ab und stellten Gott auf die Probe; den Heiligen Israels reizten sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das seltene hebräische Verb ist in seiner Bedeutung unsicher. Möglich sind auch: „begrenzten“, „kränkten“ oder „versahen mit einem Zeichen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: Wieder wandten sie sich ab
  rationale: שׁוב bezeichnet hier im Zusammenhang die erneute Abkehr beziehungsweise den Rückfall in früheres widerspenstiges Verhalten. „Wieder“ gibt die Wiederholung wieder; „wandten sie sich ab“ ist im Deutschen klarer als das missverständliche „kehrten sie um“.
- source_word: וַיְנַסּוּ
  choice: stellten … auf die Probe
  rationale: נסה bedeutet hier, Gott herausfordernd zu prüfen. Die feste deutsche Wendung „auf die Probe stellen“ gibt diesen vorwurfsvollen Sinn natürlich und genau wieder.
- source_word: אֵל
  choice: Gott
  rationale: אֵל dient hier als Gottesbezeichnung. „Gott“ ist sachgerecht und vermeidet die nicht ausdrücklich geforderte Ausweitung zu „mächtiger Gott“.
- source_word: וּקְדוֹשׁ יִשְׂרָאֵל
  choice: den Heiligen Israels
  rationale: Die feste biblische Gottesbezeichnung bleibt in ihrer prägnanten Form und mit ihrem Bezug auf Israel erhalten.
- source_word: הִתְווּ
  choice: reizten
  rationale: Das seltene und schwierige Verb ist nicht sicher zu bestimmen. „Reizten“ passt zum Parallelismus mit dem herausfordernden Prüfen Gottes und bezeichnet einen gegen Gott gerichteten Affront, ohne zu behaupten, Menschen könnten Gottes Macht tatsächlich begrenzen. Bedeutende andere Deutungen werden in der Fußnote bewahrt.
theological_decisions:
- issue: Deutung des seltenen Verbs הִתְווּ
  choice: reizten
  alternative: begrenzten; versahen mit einem Zeichen; kränkten
  rationale: Der hebräische Ausdruck ist lexikalisch unsicher. „Reizten“ wahrt im Haupttext den Zusammenhang mit Israels widerspenstigem Prüfen Gottes, entscheidet aber keine Aussage über eine metaphysische Begrenzung Gottes. Die traditionelle Wiedergabe „begrenzten“ sowie weitere mögliche Deutungen werden ausdrücklich als Alternativen genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Bezeichnung „den Heiligen Israels“ erhält das poetische Gewicht der zweiten Vershälfte; das Semikolon macht den Parallelismus sichtbar. Der Fußnotenmarker steht unmittelbar nach der von der lexikalischen Unsicherheit betroffenen Aussage.
