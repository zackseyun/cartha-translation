  text: וַ/יַּנְחֵ֣/ם לָ֭/בֶטַח וְ/לֹ֣א פָחָ֑דוּ וְ/אֶת א֝וֹיְבֵי/הֶ֗ם כִּסָּ֥ה הַ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/053.yaml
  text: He led them securely[a], and they were not afraid; and the sea covered their enemies.
translation:
  language: de
  text: Er führte sie sicher, und sie fürchteten sich nicht; und ihre Feinde bedeckte das Meer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text sagt lediglich „das Meer“. Der Vers spielt auf Israels Durchzug beim Exodus an; Deutungen wie „das Rote Meer“ oder „das Schilfmeer“ gehen jedoch über die hier verwendete Bezeichnung hinaus.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Er führte sie
  rationale: Das Hifil von נחה bezeichnet das Führen oder Leiten; „führte“ ist im Deutschen natürlich und bewahrt das konkrete Bewegungsbild des Exodus.
- source_word: לָבֶטַח
  choice: sicher
  rationale: בֶּטַח bezeichnet Sicherheit; mit ל wird es hier adverbial gebraucht. „sicher“ gibt die Art des Führens knapp und idiomatisch wieder.
- source_word: וְלֹא פָחָדוּ
  choice: und sie fürchteten sich nicht
  rationale: Die einfache hebräische Koordination wird gewahrt, ohne eine ausdrücklich finale oder konsekutive Beziehung einzutragen.
- source_word: אֹיְבֵיהֶם
  choice: ihre Feinde
  rationale: „Feinde“ ist die direkte und allgemein verständliche Entsprechung von אֹיְבִים.
- source_word: כִּסָּה
  choice: bedeckte
  rationale: כסה bedeutet wörtlich „bedecken“. Diese Wiedergabe bewahrt das konkrete Bild, ohne es durch „überwältigen“ auszudeuten.
- source_word: הַיָּם
  choice: das Meer
  rationale: Der hebräische Text nennt mit bestimmtem Artikel lediglich „das Meer“ und verwendet hier keinen spezifischen Eigennamen.
theological_decisions:
- issue: Historische Anspielung auf den Durchzug durch das Meer beim Exodus
  choice: Im Haupttext bleibt die allgemeine Bezeichnung „das Meer“ erhalten.
  alternative: das Rote Meer; das Schilfmeer
  rationale: Der Zusammenhang spielt klar auf den Exodus an, doch der hebräische Vers selbst präzisiert das Gewässer nicht. Die Übersetzung vermeidet daher eine über den Wortlaut hinausgehende Festlegung.
- issue: Verhältnis zwischen Gottes sicherer Führung und Israels Furchtlosigkeit
  choice: Die beiden Aussagen werden mit „und“ koordiniert.
  alternative: „sodass sie sich nicht fürchteten“ als ausdrückliche Folgebeziehung
  rationale: וְ gibt zunächst eine einfache Verbindung wieder. Der Zusammenhang kann eine Folge nahelegen, doch diese wird grammatisch nicht ausdrücklich markiert.
- issue: Verhältnis der Rettung Israels zum Geschick seiner Feinde
  choice: „doch“ macht den im Inhalt liegenden Gegensatz lesbar.
  alternative: „und“ als rein formale Wiedergabe von וְ
  rationale: Obwohl וְ formal koordiniert, steht der sicheren Führung Israels das Bedecktwerden seiner Feinde deutlich gegenüber. „doch“ bildet diesen Diskurskontrast natürlich ab, ohne den Sachgehalt zu verändern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und parallel; „fürchteten sich nicht“ wahrt den biblisch-poetischen Ton, ohne altertümlich zu wirken.
