base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/016.yaml
  text: He brought streams out of the rock and made water flow down like rivers[a].
translation:
  language: de
  text: Er ließ Bäche aus einem Felsen hervorströmen und Wasser wie Flüsse hinabfließen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder für den ersten Satzteil: »Er ließ fließendes Wasser aus einem Felsen hervorkommen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: Er ließ … hervorströmen
  rationale: Der Hifil von יצא bezeichnet das Verursachen eines Hervorkommens. Zusammen mit נוֹזְלִים gibt »ließ … hervorströmen« die Kausativität und das Wasserbild natürlich wieder.
- source_word: נוֹזְלִים
  choice: Bäche
  rationale: Das Partizip von נזל bezeichnet Fließendes. Im Zusammenhang mit dem später genannten Wasser ist »Bäche« eine klare, poetisch passende Wiedergabe; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: מִסָּלַע
  choice: aus dem Felsen
  rationale: סלע bezeichnet einen Felsen oder eine Felsklippe. Der bestimmte Ausdruck »dem Felsen« entspricht der masoretischen Form und dem Rückbezug auf das Wüstenwunder.
- source_word: וַיּוֹרֶד
  choice: ließ … hinabfließen
  rationale: Der Hifil von ירד ist kausativ und bedeutet, dass Gott das Wasser hinabgehen ließ. »Hinabfließen« ist im Deutschen für Wasser idiomatisch und bewahrt die Bewegungsrichtung.
- source_word: כַּנְּהָרוֹת
  choice: wie Flüsse
  rationale: Der Präfix כ markiert den Vergleich, und נהרות bedeutet »Flüsse«.
- source_word: מָיִם
  choice: Wasser
  rationale: מָיִם hat im Hebräischen eine pluralische Form, wird hier aber als Stoffbezeichnung gebraucht; »Wasser« ist die natürliche deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. Die zweimalige Kausativkonstruktion »ließ …« bildet die beiden hebräischen Hifil-Formen ab, ohne unnatürlich wörtlich zu wirken.
