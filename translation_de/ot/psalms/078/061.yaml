  text: He gave his strength to captivity[c][b][a], and his splendor into the hand of the foe.
translation:
  language: de
  text: Er gab seine Stärke der Gefangenschaft preis[a] und seine Pracht in die Hand des Feindes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung kann auf die Bundeslade als Zeichen der Stärke Gottes in Israel anspielen.
    reason: cultural_note
  - marker: b
    text: 'Die Wendung „in die Hand des Feindes“ bedeutet: in seine Gewalt.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Er gab … preis
  rationale: נתן bedeutet grundsätzlich „geben“, bezeichnet hier im Gerichtskontext jedoch ein Ausliefern oder Preisgeben. Die deutsche Wendung ist natürlich und bewahrt die knappe Aussage.
- source_word: לַשְּׁבִי
  choice: der Gefangenschaft
  rationale: שְׁבִי bezeichnet hier am ehesten Gefangenschaft beziehungsweise den Zustand des Erbeutetseins. Mit „preisgeben“ lässt sich die hebräische Präposition לְ idiomatisch als Dativ wiedergeben.
- source_word: עֻזּוֹ
  choice: seine Stärke
  rationale: עֹז bedeutet „Stärke“ oder „Macht“. Die wörtlich-nahe Wiedergabe erhält die poetische Offenheit hinsichtlich des wahrscheinlich gemeinten Zeichens von Gottes Macht.
- source_word: וְתִפְאַרְתּוֹ
  choice: und seine Pracht
  rationale: תִּפְאֶרֶת kann Pracht, Herrlichkeit oder Schönheit bezeichnen. „Pracht“ ist gegenwärtiges, gehobenes Deutsch und wahrt die poetische Parallelität.
- source_word: בְיַד
  choice: in die Hand
  rationale: Die feste hebräische Wendung bezeichnet die Auslieferung in jemandes Gewalt. Das Bild der Hand bleibt im Deutschen verständlich.
- source_word: צָר
  choice: des Feindes
  rationale: צַר bezeichnet einen Feind, Widersacher oder Bedränger. „Feind“ ist klar, würdig und im modernen Standarddeutsch natürlich.
theological_decisions:
- issue: Ob „seine Stärke“ und „seine Pracht“ ausdrücklich mit der Bundeslade, dem Heiligtum oder Gottes offenbarter Gegenwart gleichzusetzen sind
  choice: Die poetischen Bezeichnungen bleiben im Haupttext ohne ausdrückliche Identifizierung stehen.
  alternative: „Stärke“ ausdrücklich als Bundeslade deuten oder beide Ausdrücke auf das Heiligtum beziehungsweise Gottes Herrlichkeitsgegenwart beziehen.
  rationale: Der Zusammenhang spielt wahrscheinlich auf die Erbeutung der Bundeslade an, doch der hebräische Vers nennt sie nicht ausdrücklich. Die Übersetzung bewahrt deshalb die Bildsprache und ihre theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Knappheit. „Preisgeben“ verdeutlicht im Deutschen den Übergabecharakter von נתן, ohne den möglichen Bezug auf die Bundeslade im Haupttext festzulegen.
