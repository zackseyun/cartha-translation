  text: He led them with a cloud by day[a], and all the night with the light of fire.
translation:
  language: de
  text: Tagsüber führte er sie mit einer Wolke und die ganze Nacht mit dem Licht eines Feuers.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: führte er sie
  rationale: Die Hifil-Form von נחה mit dem Suffix der 3. Person Plural bezeichnet ein Führen oder Leiten. „Führte er sie“ gibt die konkrete göttliche Wegführung natürlich und knapp wieder.
- source_word: בֶּעָנָן
  choice: durch eine Wolke
  rationale: 'Die Präposition ב ist hier instrumental zu verstehen: Die Wolke ist das Mittel der Führung. „Durch eine Wolke“ drückt dies im Deutschen klar aus, ohne die Bildsprache auszuweiten.'
- source_word: יוֹמָם
  choice: am Tag
  rationale: Das adverbial gebrauchte יוֹמָם bedeutet „am Tag“ beziehungsweise „tagsüber“. „Am Tag“ bildet einen natürlichen Gegensatz zu „die ganze Nacht“.
- source_word: וְכָל הַלַּיְלָה
  choice: und die ganze Nacht
  rationale: Die Wiedergabe bewahrt die ausdrücklich bezeichnete Gesamtdauer der Nacht und klingt zugleich in modernem Deutsch natürlich.
- source_word: בְּאוֹר אֵשׁ
  choice: durch den Schein eines Feuers
  rationale: אוֹר bezeichnet Licht oder Schein; אֵשׁ bezeichnet Feuer. „Durch den Schein eines Feuers“ erhält beide Begriffe und versteht die Präposition instrumental im Zusammenhang der nächtlichen Führung.
theological_decisions:
- issue: Art der Führung in der Wüste
  choice: Der Vers wird als Bericht über Gottes geschichtliche Führung Israels durch Wolke und Feuerschein wiedergegeben, ohne zusätzliche Deutung.
  alternative: Die Wolke und das Feuer bereits im Haupttext typologisch oder dogmatisch auslegen.
  rationale: Der hebräische Text schildert die Führung selbst. Ihre weitergehende theologische Bedeutung soll nicht in die Übersetzung eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Zeitangabe „Am Tag … die ganze Nacht“ und die Instrumentalangaben mit „durch“ machen die Struktur des hebräischen Verses klar und gut verständlich.
