  naturalness: 'Die vorliegende Satzfügung ist im modernen Standarddeutsch holprig und grammatisch missverständlich: Nach „eine spätere Generation“ folgen pluralische Kinder und „sie“, während ein zweites „damit“ ohne klare syntaktische Funktion eingesetzt wird. Die Revision fasst die appositionell gemeinten „Kinder, die noch geboren werden“ als Subjektgruppe natürlich zusammen.'
