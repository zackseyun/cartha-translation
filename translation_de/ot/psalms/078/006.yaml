id: PSA.78.6
reference: Psalms 78:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְמַ֤עַן יֵדְע֨וּ דּ֣וֹר אַ֭חֲרוֹן בָּנִ֣ים יִוָּלֵ֑דוּ יָ֝קֻ֗מוּ וִֽ/יסַפְּר֥וּ לִ/בְנֵי/הֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/006.yaml
  text: so that a later generation might know[a], children yet to be born, and might arise and tell their children,
translation:
  language: de
  text: damit die Kinder einer späteren Generation, die noch geboren werden, davon erfahren, aufstehen und es ihren Kindern erzählen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Leitet den beabsichtigten Zweck beziehungsweise das angestrebte Ergebnis ein und ist im Deutschen natürlich.
- source_word: יֵדְעוּ
  choice: davon erfährt
  rationale: Das Imperfekt nach לְמַעַן bezeichnet den beabsichtigten Zweck. Im Zusammenhang geht es darum, dass die nächste Generation die zuvor genannten Weisungen und Taten kennenlernt; „davon erfährt“ ist idiomatisch und lässt den Gegenstandsbezug offen.
- source_word: דּוֹר אַחֲרוֹן
  choice: eine spätere Generation
  rationale: Bezeichnet eine nachfolgende oder künftige Generation, nicht notwendig die eschatologisch letzte Generation.
- source_word: בָּנִים יִוָּלֵדוּ
  choice: die Kinder, die noch geboren werden sollten
  rationale: בָּנִים meint hier die Nachkommen im Allgemeinen. Die Formulierung gibt den zukünftigen Passivcharakter von יִוָּלֵדוּ wieder.
- source_word: יָקֻמוּ
  choice: sie aufstehen
  rationale: Bewahrt das anschauliche Bild des hebräischen Verbs und bezeichnet hier das Heranwachsen beziehungsweise aktive Auftreten der folgenden Generation.
- source_word: וִיסַפְּרוּ
  choice: und es … erzählen
  rationale: ספר bezeichnet hier die mündliche Weitergabe an die nächste Generation. „Erzählen“ ist natürlich und dem familiären Zusammenhang angemessen.
- source_word: לִבְנֵיהֶם
  choice: ihren Kindern
  rationale: Die maskuline Pluralform bezeichnet in diesem Zusammenhang die Nachkommen allgemein und nicht ausschließlich Söhne.
theological_decisions:
- issue: Geschlechtsspezifische Nachkommensbezeichnungen (בָּנִים / לִבְנֵיהֶם)
  choice: „Kinder“ / „ihren Kindern“
  alternative: „Söhne“ / „ihren Söhnen“
  rationale: Die maskulinen hebräischen Formen können Nachkommen beiderlei Geschlechts repräsentieren. Der Vers beschreibt die Weitergabe von Generation zu Generation, nicht ausschließlich an männliche Nachkommen.
- issue: Bedeutung von דּוֹר אַחֲרוֹן
  choice: „eine spätere Generation“
  alternative: „die letzte Generation“
  rationale: אַחֲרוֹן bezeichnet hier im Generationenzusammenhang eine nachfolgende künftige Generation; eine endzeitliche Festlegung wäre nicht vom Kontext gefordert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Wiedergabe des hebräischen Zwecksatzes mit „damit“ macht die syntaktische Zuordnung der Kinder als nachfolgende Generation verständlich, ohne die generationenübergreifende Aussage theologisch zu verengen.
