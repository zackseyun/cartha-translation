base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/027.yaml
  text: He rained meat on them like dust[b][a], and winged birds like the sand of the seas.
translation:
  language: de
  text: Er ließ Fleisch wie Staub auf sie regnen und geflügelte Vögel wie den Sand der Meere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen der Plural: »der Sand der Meere«; als idiomatischere Wiedergabe des Mengenbildes ist auch »wie Sand am Meer« möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: Er ließ … regnen
  rationale: Die Hifil-Form bezeichnet das Veranlassen des Regnens bzw. das Herabregnenlassen; die deutsche Wendung bewahrt den kausativen Sinn.
- source_word: עֲלֵיהֶם
  choice: auf sie
  rationale: Die Präposition עַל mit Suffix bedeutet hier natürlich „auf sie“.
- source_word: כֶּעָפָר
  choice: wie Staub
  rationale: Das Präfix כְּ kennzeichnet einen Vergleich; „wie Staub“ gibt das Bild knapp und natürlich wieder.
- source_word: שְׁאֵר
  choice: Fleisch
  rationale: שְׁאֵר bezeichnet Fleisch; im Zusammenhang der Speisung in der Wüste ist essbares Fleisch gemeint. Das deutsche „Fleisch“ bewahrt sowohl die lexikalische Breite als auch den kontextuellen Sinn.
- source_word: וּכְחוֹל יַמִּים
  choice: wie den Sand der Meere
  rationale: Die Übersetzung erhält den hebräischen Plural יַמִּים („Meere“) und das Bild der unzählbaren Menge.
- source_word: עוֹף כָּנָף
  choice: geflügelte Vögel
  rationale: Die Verbindung bedeutet wörtlich etwa „Vögel des Flügels“; „geflügelte Vögel“ bewahrt die ausdrückliche Flügelvorstellung in verständlichem Deutsch.
