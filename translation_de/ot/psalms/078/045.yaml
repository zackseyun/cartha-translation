  text: יְשַׁלַּ֬ח בָּ/הֶ֣ם עָ֭רֹב וַ/יֹּאכְלֵ֑/ם וּ֝/צְפַרְדֵּ֗עַ וַ/תַּשְׁחִיתֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/045.yaml
  text: He sent among them swarms of flies[a], which devoured them, and frogs[b], which destroyed them.
translation:
  language: de
  text: Er sandte Insektenschwärme[a] unter sie, die sie auffraßen, und Frösche, die sie zugrunde richteten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann allgemein einen Schwarm bezeichnen; traditionell wird es als Fliegenschwarm verstanden.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: Er sandte
  rationale: Das Piel von שׁלח bezeichnet hier, dass Gott die Plage unter die Ägypter kommen ließ. „Sandte“ ist natürlich und bewahrt die aktive Aussage des Hebräischen.
- source_word: בָּהֶם
  choice: unter sie
  rationale: 'Die Präposition ב wird hier räumlich verstanden: Die Plage gelangte mitten unter sie. Der feindliche Sinn ergibt sich aus dem Zusammenhang, ohne dass ausdrücklich „gegen sie“ ergänzt werden muss.'
- source_word: עָרֹב
  choice: Insektenschwärme
  rationale: Die genaue Art der Plage ist lexikalisch unsicher. „Insektenschwärme“ gibt den Schwarmcharakter verständlich wieder, ohne die traditionelle Deutung als Fliegen zur einzig möglichen Bedeutung zu machen.
- source_word: וַיֹּאכְלֵם
  choice: die sie auffraßen
  rationale: אכל bedeutet wörtlich „essen/fressen“ und beschreibt hier anschaulich die verheerende Wirkung der Schwärme. Der deutsche Plural richtet sich nach „Insektenschwärme“.
- source_word: וּצְפַרְדֵּעַ
  choice: und Frösche
  rationale: Das hebräische Substantiv steht formal im Singular, wird aber kollektiv für die Froschplage gebraucht; im Deutschen ist der Plural idiomatisch.
- source_word: וַתַּשְׁחִיתֵם
  choice: die sie zugrunde richteten
  rationale: Das Hifil von שׁחת bezeichnet verderben oder vernichten. „Zugrunde richteten“ bewahrt die starke Aussage und klingt im Deutschen bei einer Froschplage natürlicher als „zerstörten“.
