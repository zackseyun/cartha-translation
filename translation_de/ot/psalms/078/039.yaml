source:
  edition: WLC
  text: וַ֭/יִּזְכֹּר כִּי בָשָׂ֣ר הֵ֑מָּה ר֥וּחַ ה֝וֹלֵ֗ךְ וְ/לֹ֣א יָשֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/039.yaml
  text: He remembered that they were flesh[a], a wind that passes and does not return.
translation:
  language: de
  text: Er dachte daran, dass sie Fleisch waren, ein Wind, der dahingeht und nicht zurückkehrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Atem, der dahingeht und nicht zurückkehrt“. Das hebräische Wort רוּחַ kann „Wind“, „Atem“ oder „Geist“ bedeuten; hier geht es wahrscheinlich um Vergänglichkeit und Hinfälligkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Er dachte daran
  rationale: Das Qal-Wayyiqtol von זכר hat Gott als aus dem Zusammenhang erschlossenes Subjekt. „Daran denken“ gibt den erinnernden Rückbezug im modernen Deutschen natürlich wieder.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet hier den Inhalt dessen ein, woran Gott dachte, und wird deshalb als Inhaltssatz wiedergegeben.
- source_word: בָשָׂר
  choice: Fleisch
  rationale: Die konkrete hebräische Bezeichnung bleibt erhalten und bezeichnet hier die menschliche Hinfälligkeit und Sterblichkeit, ohne diese Deutung ausdrücklich in den Text einzutragen.
- source_word: הֵמָּה
  choice: sie ... waren
  rationale: Das selbstständige Pronomen wird mit der im Deutschen erforderlichen Kopula wiedergegeben.
- source_word: רוּחַ
  choice: ein Wind
  rationale: רוּחַ kann Wind, Atem oder Geist bedeuten. Im poetischen Zusammenhang hebt das Bild wahrscheinlich Vergänglichkeit hervor; „Wind“ verbindet sich natürlich mit dem Dahingehen und Nichtzurückkehren.
- source_word: הוֹלֵךְ
  choice: der dahingeht
  rationale: Das Partizip bezeichnet eine fortschreitende Bewegung. „Dahingeht“ bewahrt zugleich den poetischen Klang und die Vorstellung des Vergehens.
- source_word: וְלֹא יָשׁוּב
  choice: und nicht zurückkehrt
  rationale: Das Imperfekt hat hier einen allgemeinen poetischen Sinn. Das deutsche Präsens vermeidet eine unnötige Festlegung auf bloße Zukunft.
theological_decisions:
- issue: Anthropologisches Bild menschlicher Hinfälligkeit
  choice: 'Der Vers beschreibt Menschen als hinfällig und vergänglich: „Fleisch ... ein Wind, der dahingeht und nicht zurückkehrt“.'
  alternative: רוּחַ als „Geist“ zu verstehen und die Zeile als Aussage über das Fortgehen des menschlichen Geistes zu lesen.
  rationale: Der unmittelbare Parallelismus betont Sterblichkeit und Vergänglichkeit. „Wind“ vermeidet es, eine ausgearbeitete Lehre über Seele oder Geist in den Vers hineinzulesen; die lexikalische Mehrdeutigkeit wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Bildsprache. „Fleisch“ und „Wind“ bewahren die konkreten Bilder des Hebräischen; „dahingeht“ hält den Vers flüssig und leicht gehoben, bleibt aber allgemein verständlich.
