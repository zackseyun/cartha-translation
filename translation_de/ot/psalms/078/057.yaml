base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/057.yaml
  text: But they turned back and acted treacherously like their fathers[a]; they turned aside like a deceitful bow.
translation:
  language: de
  text: Doch sie wichen zurück und handelten treulos wie ihre Väter; sie wandten sich ab wie ein trügerischer Bogen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein schlaffer Bogen“ beziehungsweise „wie ein fehlerhafter Bogen“ – gemeint ist ein Bogen, auf den kein Verlass ist und mit dem man nicht zuverlässig trifft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּגוּ
  choice: sie wichen zurück
  rationale: סוג bezeichnet ein Zurückweichen oder Abgehen von einem bisherigen Weg. „Wichen zurück“ bewahrt das Bild der Umkehr, ohne später geprägte theologische Fachsprache einzutragen.
- source_word: וַיִּבְגְּדוּ
  choice: handelten treulos
  rationale: בגד bezeichnet treuloses, verräterisches Handeln. Die Wiedergabe erhält das moralische und relationale Gewicht, ohne ein im Vers nicht ausdrücklich genanntes Objekt hinzuzufügen.
- source_word: כַּאֲבוֹתָם
  choice: wie ihre Väter
  rationale: Das Hebräische nennt ausdrücklich „ihre Väter“. Die konkrete familiäre Bezeichnung wird daher beibehalten und nicht zu „Vorfahren“ verallgemeinert.
- source_word: נֶהְפְּכוּ
  choice: sie wandten sich ab
  rationale: הפך beschreibt hier im passivisch-reflexiven Sinn eine Wendung beziehungsweise Abweichung. „Wandten sich ab“ ist im Deutschen natürlich und führt passend in das Bild des unzuverlässigen Bogens.
- source_word: כְּקֶשֶׁת רְמִיָּה
  choice: wie ein trügerischer Bogen
  rationale: קשת bedeutet „Bogen“; רמיה kann Täuschung, Unzuverlässigkeit, Schlaffheit oder Fehlerhaftigkeit bezeichnen. „Trügerischer Bogen“ bewahrt die bildhafte Personifikation und meint einen Bogen, auf dessen Treffsicherheit kein Verlass ist.
theological_decisions:
- issue: Bundesbezogener Beiklang der Untreue Israels
  choice: Die moralisch gewichtige Formulierung „handelten treulos“ verwenden, ohne den Bund oder Gott als Objekt ausdrücklich zu ergänzen.
  alternative: „Wurden untreu“ oder ausdrücklich „brachen Gott die Treue“.
  rationale: Der Zusammenhang des Psalms betrifft Israels Untreue, doch der Vers selbst nennt weder Gott noch den Bund als grammatisches Objekt. Die Übersetzung erhält den theologischen Beiklang, ohne die Aussage auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der zweigliedrigen hebräischen Aussage; das Semikolon macht den Parallelismus sichtbar. Der Fußnotenmarker steht unmittelbar beim mehrdeutigen Bogenbild.
