source:
  edition: WLC
  text: לָ/כֵ֤ן שָׁמַ֥ע יְהוָ֗ה וַֽ/יִּתְעַבָּ֥ר וְ֭/אֵשׁ נִשְּׂקָ֣ה בְ/יַעֲקֹ֑ב וְ/גַם אַ֝֗ף עָלָ֥ה בְ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/021.yaml
  text: Therefore Yahweh heard and was enraged[a]; and a fire was kindled against Jacob[c][b], and anger also rose against Israel.
translation:
  language: de
  text: Darum hörte Jahwe es und geriet in Zorn[a]; und Feuer entbrannte gegen Jakob[b], auch Zorn stieg gegen Israel auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde zum Zorn gereizt“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht bei „Jakob“ und „Israel“ jeweils „in“; im Zusammenhang des göttlichen Gerichts ist hier „gegen“ gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verbindung zum vorausgehenden Reden Israels knapp und natürlich wieder.
- source_word: שָׁמַע
  choice: hörte es
  rationale: Das Verb bedeutet unmittelbar „hören“; das ergänzte „es“ macht im Deutschen deutlich, dass Jahwe das zuvor Gesagte hörte.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיִּתְעַבָּר
  choice: geriet in Zorn
  rationale: Bewahrt die starke Bedeutung des Hitpael, klingt im modernen Deutsch jedoch natürlicher als eine wörtlichere Wendung.
- source_word: וְאֵשׁ נִשְּׂקָה
  choice: und Feuer entbrannte
  rationale: Bewahrt die koordinierende Konjunktion sowie das direkte Feuerbild und gibt die passive Form idiomatisch wieder.
- source_word: בְיַעֲקֹב
  choice: gegen Jakob
  rationale: Das Präfix ב wird im Zusammenhang feindlichen Gerichtshandelns idiomatisch mit „gegen“ wiedergegeben; die wörtliche räumliche Lesart bleibt in einer Fußnote sichtbar.
- source_word: וְגַם אַף
  choice: auch Zorn
  rationale: „Auch“ erhält die additive Kraft; אַף ist hier die geläufige hebräische Metonymie für Zorn.
- source_word: עָלָה
  choice: stieg ... auf
  rationale: Erhält das vertikale Bild des hebräischen Verbs in natürlichem Deutsch.
- source_word: בְיִשְׂרָאֵל
  choice: gegen Israel
  rationale: Parallel zu „gegen Jakob“ wird ב im gerichtlichen Zusammenhang als gegen die Adressaten gerichteter Zorn verstanden.
theological_decisions:
- issue: Stärke der Sprache über Gottes Zorn
  choice: „geriet in Zorn“ und „Zorn stieg ... auf“
  alternative: Mildere Formulierungen wie „war ungehalten“ oder stärker interpretierende Formulierungen wie „wurde rasend“
  rationale: Der hebräische Text zeichnet Gottes Reaktion ausdrücklich und stark als Zorn, ohne eine psychologisierende Übersteigerung zu verlangen.
- issue: Deutung des Feuers
  choice: Das Feuerbild wird ohne Erklärung im Haupttext beibehalten.
  alternative: Das Feuer ausdrücklich als wörtliches Feuer oder als bloße Metapher für Gericht auslegen
  rationale: Der Vers entscheidet nicht eindeutig zwischen einem konkreten, bildlichen oder beide Ebenen verbindenden Bezug.
- issue: Funktion des ersten וְ vor אֵשׁ
  choice: koordinierend mit „und“
  alternative: erklärend mit „denn“
  rationale: „Und“ entspricht der sichtbaren Koordination und erhält den Parallelismus; eine erklärende Beziehung ist möglich, wird aber nicht unnötig festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dichterischer Parallelstruktur. Die kräftige Zornsprache und das nicht abschließend gedeutete Feuerbild bleiben erhalten.
