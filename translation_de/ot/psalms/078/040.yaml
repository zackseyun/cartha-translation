  text: How often they rebelled against him in the wilderness and grieved him in the wasteland![a][b]
translation:
  language: de
  text: Wie oft lehnten sie sich in der Wüste gegen ihn auf und betrübten ihn im Ödland![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie viele Male lehnten sie sich in der Wüste gegen ihn auf.“ Der Anfang kann die Vielzahl wiederholter Auflehnungen hervorheben.'
