  - marker: b
    text: 'Oder: „und kränkten ihn“ oder „und fügten ihm Schmerz zu“ im Ödland.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: Wie oft
  rationale: Die eröffnende Ausruf- bzw. Frageformel hebt hier die wiederholten Fälle hervor, nicht eine wörtliche Zahlenfrage.
- source_word: יַמְרוּהוּ
  choice: lehnten sie sich ... gegen ihn auf
  rationale: Das Hifil von מרה mit Objektsuffix bezeichnet Auflehnung oder Widersetzlichkeit gegen Gott; die Formulierung ist im Deutschen natürlich und bewahrt den persönlichen Bezug.
- source_word: בַמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet die Wüsten- bzw. Wildnisregion der Wanderungszeit; „Wüste“ ist im Deutschen die geläufige biblisch-geografische Entsprechung.
- source_word: יַעֲצִיבוּהוּ
  choice: betrübten ihn
  rationale: Das Hifil von עצב kann Schmerz, Kummer oder Betrübnis verursachen bedeuten. „Betrübten“ bewahrt die relationale und emotionale Aussage in würdiger, verständlicher Sprache.
- source_word: בִּישִׁימוֹן
  choice: im Ödland
  rationale: יְשִׁימוֹן bezeichnet eine öde, verwüstete Landschaft. „Ödland“ unterscheidet den Ausdruck von מִדְבָּר und erhält zugleich den poetischen Parallelismus.
theological_decisions:
- issue: Anthropopathische Rede von Gott in יַעֲצִיבוּהוּ
  choice: Die persönliche Gefühlsaussage „betrübten ihn“ bleibt im Haupttext erhalten.
  alternative: „fügten ihm Schmerz zu“ oder „kränkten ihn“
  rationale: Der hebräische Text stellt Israels Verhalten als wirkliche persönliche Kränkung Gottes dar. Diese theologische Spannung wird nicht zu einer unpersönlichen Aussage wie „reizten ihn“ abgeschwächt.
translation_notes:
  register: Modernes Standarddeutsch in poetisch-würdigem Register. Die beiden verwandten Landschaftsbegriffe werden mit „Wüste“ und „Ödland“ unterschieden; die emotionale Aussage über Gott bleibt bewusst erhalten.
