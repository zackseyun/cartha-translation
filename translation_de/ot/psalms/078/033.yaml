  text: וַ/יְכַל בַּ/הֶ֥בֶל יְמֵי/הֶ֑ם וּ֝/שְׁנוֹתָ֗/ם בַּ/בֶּהָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/033.yaml
  text: So he consumed their days in futility[a], and their years in terror.
translation:
  language: de
  text: So machte er ihren Tagen in Vergeblichkeit ein Ende[a] und ihren Jahren in Schrecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »So verbrauchte er ihre Tage in Vergeblichkeit und ihre Jahre in jähem Schrecken.«'
    reason: Lexikalische Alternative für כלה als »verbrauchen«; הבל kann auch »Nichtigkeit« oder »Hauch« bedeuten, und בהלה kann die Nuance eines jähen Schreckens haben.
lexical_decisions:
- source_word: וַיְכַל
  choice: So ließ er … vergehen
  rationale: Das Verb כלה bezeichnet hier das Aufbrauchen beziehungsweise Zu-Ende-Bringen. Die gewählte Form klingt im Deutschen natürlich, lässt Gott als handelndes Subjekt erkennen und verbindet sich idiomatisch mit »Tage« und »Jahre«.
- source_word: בַּהֶבֶל
  choice: in Nichtigkeit
  rationale: הֶבֶל bezeichnet wörtlich einen Hauch und übertragen Vergänglichkeit, Leere oder Vergeblichkeit. »Nichtigkeit« bewahrt diese Bedeutungsbreite besser als eine einseitige Auflösung.
- source_word: יְמֵיהֶם
  choice: ihre Tage
  rationale: Die wörtliche Zeitangabe erhält das hebräische Bild und den Parallelismus.
- source_word: וּשְׁנוֹתָם
  choice: und ihre Jahre
  rationale: Die Wiedergabe bewahrt den poetischen Parallelismus zu »ihre Tage«.
- source_word: בַּבֶּהָלָה
  choice: in Schrecken
  rationale: בֶּהָלָה kann Schrecken, Bestürzung, Panik oder ein plötzliches Erschrecken bezeichnen. »In Schrecken« passt zum Gerichtskontext und bleibt zugleich ausreichend weit.
theological_decisions:
- issue: Unausgesprochenes Subjekt des Verbs
  choice: Gott bleibt durch »er« das handelnde Subjekt.
  alternative: Eine unpersönliche Wiedergabe wie »ihre Tage vergingen«.
  rationale: Der Kontext nennt Gott als den Handelnden im Gericht; das maskuline Verb im Singular stützt die ausdrückliche Wiedergabe mit »er«.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltenem poetischem Parallelismus. »Nichtigkeit« ist bewusst gehoben, aber allgemein verständlich; die Fußnote erschließt geläufigere Alternativen.
