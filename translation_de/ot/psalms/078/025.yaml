source:
  edition: WLC
  text: לֶ֣חֶם אַ֭בִּירִים אָ֣כַל אִ֑ישׁ צֵידָ֬ה שָׁלַ֖ח לָ/הֶ֣ם לָ/שֹֽׂבַע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/025.yaml
  text: Man ate the bread of the mighty[a]; he sent them provisions to the full.
translation:
  language: de
  text: Der Mensch aß Brot der Mächtigen[a]; Nahrung sandte er ihnen, bis sie satt waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Brot der Engel«. Das Hebräische lautet wörtlicher »Brot der Mächtigen« oder »Brot mächtiger Wesen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֶחֶם
  choice: Brot
  rationale: Die konkrete Grundbedeutung und das poetische Bild des Hebräischen bleiben erhalten.
- source_word: אַבִּירִים
  choice: der Mächtigen
  rationale: Das Wort bezeichnet unmittelbar Starke oder Mächtige; »Engel« ist eine alte, vom Kontext beeinflusste Deutung, aber nicht die eindeutige lexikalische Bedeutung.
- source_word: אָכַל
  choice: aß
  rationale: Die abgeschlossene Verbform passt hier als einfaches Präteritum in den erzählenden Rückblick des Psalms.
- source_word: אִישׁ
  choice: der Mensch
  rationale: Der hebräische Singular wird mit seiner repräsentativen, allgemeinen Bedeutung bewahrt.
- source_word: צֵידָה
  choice: Nahrung
  rationale: Gemeint ist bereitgestellte Verpflegung beziehungsweise Proviant; »Nahrung« klingt im heutigen Deutschen natürlich und würdevoll.
- source_word: שָׁלַח
  choice: sandte
  rationale: Dies entspricht der direkten Bedeutung des Verbs und bewahrt den poetischen Ton.
- source_word: לָהֶם
  choice: ihnen
  rationale: Der indirekte Pluralbezug wird im Deutschen unmittelbar wiedergegeben.
- source_word: לָשֹׂבַע
  choice: bis sie satt waren
  rationale: Die Wendung bezeichnet Sättigung beziehungsweise ausreichende Versorgung; die deutsche Formulierung gibt das Ziel verständlich wieder, ohne es bloß als Menge umzudeuten.
theological_decisions:
- issue: Deutung von אַבִּירִים in der Wendung »Brot der Mächtigen«
  choice: Im Haupttext steht die direkte lexikalische Wiedergabe »der Mächtigen«.
  alternative: »Brot der Engel« beziehungsweise »Brot mächtiger Wesen«
  rationale: Der Mannakontext und die alte Auslegung legen »Engel« nahe, doch das hebräische Wort bedeutet nicht eindeutig »Engel«. Die Übersetzung lässt diese Spannung bestehen und nennt die traditionelle Deutung in der Fußnote.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit poetisch-würdigem Klang. Der generische Singular »der Mensch« und das konkretere Bild »Brot« bewahren die Form des hebräischen Verses; die zweite Vershälfte wird für natürliches Deutsch leicht expliziert.
