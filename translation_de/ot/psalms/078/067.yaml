source:
  edition: WLC
  text: וַ֭/יִּמְאַס בְּ/אֹ֣הֶל יוֹסֵ֑ף וּֽ/בְ/שֵׁ֥בֶט אֶ֝פְרַ֗יִם לֹ֣א בָחָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/067.yaml
  text: Then he rejected the tent of Joseph[b][a], and he did not choose the tribe of Ephraim.
translation:
  language: de
  text: Dann verwarf er das Zelt Josefs[a] und erwählte den Stamm Efraim nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Josef steht hier für die mit ihm verbundenen Stämme, besonders für den führenden Stamm Efraim; im folgenden Zusammenhang wird dem die Wahl Judas und Zions gegenübergestellt.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: Dann verwarf er
  rationale: מָאַס bedeutet je nach Zusammenhang „verwerfen“, „verschmähen“ oder „zurückweisen“. „Verwarf“ gibt die entschiedene Zurückweisung würdig und knapp wieder; „Dann“ bildet den erzählerischen Fortgang des Wayyiqtol ab.
- source_word: בְּאֹהֶל יוֹסֵף
  choice: das Zelt Josefs
  rationale: אֹהֶל heißt wörtlich „Zelt“. Die Bildsprache bleibt erhalten, ohne die metonymische Bedeutung vorschnell als „Haus“, Heiligtum oder Stammesgebiet festzulegen.
- source_word: וּבְשֵׁבֶט אֶפְרַיִם
  choice: den Stamm Efraim
  rationale: שֵׁבֶט kann „Stamm“, „Stab“ oder „Zepter“ bedeuten. Neben „Josef“ und mit dem Stammesnamen „Efraim“ ist „Stamm“ hier die naheliegende Bedeutung.
- source_word: לֹא בָחָר
  choice: erwählte ... nicht
  rationale: בָּחַר bezeichnet das Auswählen oder Erwählen. „Erwählte ... nicht“ wahrt den knappen Parallelismus und die im Kontext bedeutsame Sprache göttlicher Wahl, ohne sie weiter dogmatisch auszudeuten.
theological_decisions:
- issue: Gottes Verwerfung und Wahl unter den Stammeszentren Israels
  choice: Die konkrete Aussage über Josef beziehungsweise Efraim bleibt im Haupttext stehen.
  alternative: Josef und Efraim ausdrücklich als das Nordreich oder dessen Heiligtum deuten.
  rationale: Der Psalm bereitet im folgenden Zusammenhang die Wahl Judas und Zions vor. Die Übersetzung bewahrt dennoch die konkrete Stammes- und Zeltbildsprache des Hebräischen und überlässt die weitergehende historische Zuordnung dem Kontext.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit dichterischer Knappheit. „Zelt“ bewahrt das hebräische Bild; „verwarf“ und „erwählte“ bilden den theologischen und poetischen Gegensatz angemessen ab.
