id: PSA.78.26
reference: Psalms 78:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יַסַּ֣ע קָ֭דִים בַּ/שָּׁמָ֑יִם וַ/יְנַהֵ֖ג בְּ/עֻזּ֣/וֹ תֵימָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/026.yaml
  text: He stirred up the east wind in the heavens[b][a], and by his strength he guided the south wind.
translation:
  language: de
  text: Er setzte den Ostwind am Himmel in Bewegung[a] und lenkte durch seine Kraft den Südwind[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er ließ den Ostwind am Himmel aufbrechen.«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »den Süden«; im Parallelismus zum Ostwind ist wahrscheinlich der Südwind gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסַּע
  choice: setzte … in Bewegung
  rationale: Der Hifil von נסע bedeutet wörtlich etwa »aufbrechen lassen« oder »in Bewegung setzen«. Auf den Wind bezogen gibt »setzte … in Bewegung« die göttliche Verursachung natürlich und ohne unnötige Deutung wieder.
- source_word: קָדִים
  choice: Ostwind
  rationale: קָדִים bezeichnet häufig den Wind aus dem Osten; der Parallelismus mit תֵימָן stützt diese konkrete Wiedergabe.
- source_word: בַּשָּׁמָיִם
  choice: am Himmel
  rationale: שָׁמַיִם bezeichnet hier den sichtbaren Himmel beziehungsweise den Luftraum, in dem sich der Wind bewegt. »Am Himmel« ist im modernen Deutschen natürlich und bewahrt den poetischen Ton.
- source_word: וַיְנַהֵג
  choice: lenkte
  rationale: נהג kann »führen«, »leiten« oder »treiben« bedeuten. Bei einem Wind bringt »lenkte« Gottes aktive Bestimmung seiner Richtung treffend zum Ausdruck.
- source_word: בְּעֻזּוֹ
  choice: durch seine Kraft
  rationale: עֹז bedeutet »Kraft«, »Stärke« oder »Macht«; die Präposition bezeichnet hier das Mittel, durch das Gott den Wind lenkt.
- source_word: תֵימָן
  choice: Südwind
  rationale: תֵימָן bedeutet formal »Süden« beziehungsweise »Südland«. Parallel zum Ostwind ist hier ein Wind aus südlicher Richtung gemeint; »Südwind« macht die Ellipse im Deutschen verständlich.
theological_decisions:
- issue: Göttliches Handeln an den Naturkräften
  choice: Gott setzt die Winde aktiv in Bewegung und lenkt sie.
  alternative: Eine unpersönliche Formulierung, nach der die Winde lediglich aufkommen.
  rationale: Beide Verben haben im hebräischen Text Gott als handelndes Subjekt. Die Übersetzung bewahrt diese Aussage, ohne sie theologisch weiter auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetisch ausgewogenem Parallelismus. »Am Himmel« ist gegenüber »in den Himmeln« im Deutschen idiomatischer; die Fußnoten bewahren die wesentlichen lexikalischen Alternativen und die Ellipse des hebräischen Textes.
