base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/030.yaml
  text: They had not yet turned away from their craving[a]; their food was still in their mouths.
translation:
  language: de
  text: Noch hatten sie sich nicht von ihrer Gier abgewandt[a]; noch war ihre Speise in ihrem Mund.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Noch waren sie ihrer Gier nicht entfremdet.“ Das hebräische Verb kann formaler so wiedergegeben werden; im Zusammenhang ist wahrscheinlich gemeint, dass sie sich noch nicht von ihrer Gier abgewandt oder von ihr abgelassen hatten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָרוּ
  choice: sich abgewandt
  rationale: Das Verb זור bezeichnet hier mit מִן wahrscheinlich ein Sichabwenden oder Ablassen. Die Formulierung ist im heutigen Deutsch natürlich und lässt den Bezug auf das noch nicht aufgegebene Begehren erkennen.
- source_word: מִתַּאֲוָתָם
  choice: von ihrer Gier
  rationale: תַּאֲוָה kann Verlangen, Begierde oder Gier bezeichnen. Im Zusammenhang mit dem maßlosen Verlangen nach Nahrung gibt „Gier“ die ungeordnete Intensität prägnant wieder, ohne einen sexuellen Sinn nahezulegen.
- source_word: עוֹד
  choice: noch
  rationale: 'עוֹד kennzeichnet in beiden Vershälften einen fortdauernden Zustand: Sie hatten noch nicht abgelassen, und die Speise befand sich noch in ihrem Mund.'
- source_word: אָכְלָם
  choice: ihre Speise
  rationale: אֹכֶל bedeutet Nahrung oder Speise. „Speise“ passt zum würdevollen poetischen Register des Psalms.
- source_word: בְּפִיהֶם
  choice: in ihrem Mund
  rationale: Das Hebräische verwendet den Singular „Mund“ mit einem pluralischen Suffix. Der kollektive Singular „in ihrem Mund“ bewahrt diese Ausdrucksweise und ist im Deutschen verständlich.
