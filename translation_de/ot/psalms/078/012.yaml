  text: נֶ֣גֶד אֲ֭בוֹתָ/ם עָ֣שָׂה פֶ֑לֶא בְּ/אֶ֖רֶץ מִצְרַ֣יִם שְׂדֵה צֹֽעַן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/012.yaml
  text: Before their fathers he did wonders in the land of Egypt[b][a], in the fields of Zoan.
translation:
  language: de
  text: Vor den Augen ihrer Väter vollbrachte er Wunder im Land Ägypten, im Gebiet von Zoan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „im Feld von Zoan“; gemeint ist wahrscheinlich das Umland oder Gebiet von Zoan.'
    reason: cultural_note
lexical_decisions:
- source_word: נֶגֶד אֲבוֹתָם
  choice: vor den Augen ihrer Väter
  rationale: נֶגֶד bezeichnet hier die Gegenwart bzw. Sichtweite der Väter. „Vor den Augen“ gibt diesen Sinn im heutigen Deutsch eindeutig und natürlich wieder; „Väter“ bewahrt die konkrete familiäre und bundestheologische Ausdrucksweise des Hebräischen.
- source_word: עָשָׂה פֶלֶא
  choice: vollbrachte er Wunder
  rationale: Das häufige Verb עשה steht mit פֶלֶא in einer geläufigen Verbindung. „Wunder vollbringen“ ist würdig und idiomatisch; der formal singularische Begriff kann im Zusammenhang kollektiv verstanden werden.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Die Wiedergabe behält das ausdrücklich genannte אֶרֶץ („Land“) und damit die geografische Konkretheit des Ausgangstextes bei.
- source_word: שְׂדֵה צֹעַן
  choice: im Gefilde von Zoan
  rationale: Der hebräische Singular „Feld von Zoan“ bezeichnet wahrscheinlich das umliegende Gebiet. „Gefilde“ bewahrt den bildhaften geografischen Ausdruck, ohne ihn auf ein einzelnes Ackerstück zu verengen.
