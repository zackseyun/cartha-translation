  text: וַ֭/יַּפֵּל בְּ/קֶ֣רֶב מַחֲנֵ֑/הוּ סָ֝בִ֗יב לְ/מִשְׁכְּנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/028.yaml
  text: He made it fall in the midst of their camp[a], all around their dwellings.
translation:
  language: de
  text: Er ließ es mitten in ihr Lager fallen, rings um ihre Wohnstätten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּפֵּל
  choice: Er ließ es … fallen
  rationale: Der Hifil von נפל ist kausativ. Im Deutschen gibt „ließ … fallen“ die Veranlassung natürlich wieder; „es“ nimmt das im vorherigen Vers genannte Geflügel auf.
- source_word: בְּקֶרֶב
  choice: mitten in
  rationale: Die Wendung bezeichnet das Innere eines Bereichs. „Mitten in“ bewahrt die räumliche und poetische Aussage in heutigem Deutsch.
- source_word: מַחֲנֵהוּ
  choice: ihr Lager
  rationale: Das Suffix ist formal maskulin Singular („sein“), bezieht sich aber wahrscheinlich kollektiv auf Israel. Das deutsche „ihr“ gibt diesen kollektiven Bezug idiomatisch wieder.
- source_word: סָבִיב
  choice: rings um
  rationale: Die adverbiale Angabe beschreibt eine umfassende Verteilung im Umkreis. „Rings um“ ist knapp, würdig und poetisch.
- source_word: לְמִשְׁכְּנֹתָיו
  choice: um ihre Wohnstätten
  rationale: מִשְׁכָּן bezeichnet hier Wohn- bzw. Aufenthaltsstätten. „Wohnstätten“ ist textnäher und weiter gefasst als „Zelte“; „ihre“ gibt den kollektiven Bezug auf Israel wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper poetischer Diktion. Die formal singularischen hebräischen Suffixe werden wegen ihres kollektiven Bezugs auf Israel idiomatisch pluralisch wiedergegeben; da Deutsch bei „ihr“ Singular und Plural nicht sichtbar unterscheidet, ist keine Fußnote nötig.
