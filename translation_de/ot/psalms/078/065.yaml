base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/065.yaml
  text: Then the Lord awoke as from sleep[a], like a warrior shouting because of wine.
translation:
  language: de
  text: Da erwachte der Herr wie ein Schlafender, wie ein Krieger, der vom Wein laut aufjauchzt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein Krieger, der vom Wein laut aufschreit“ oder „der vom Wein jubelnd ruft“.'
    reason: lexikalische_alternative
lexical_decisions:
- source_word: וַיִּקַץ
  choice: Da erwachte
  rationale: Das Verb יקץ bezeichnet das Erwachen. „Da erwachte“ gibt die narrative Folge natürlich und knapp wieder.
- source_word: כְּיָשֵׁן
  choice: wie ein Schlafender
  rationale: Die mit כְּ markierte Vergleichsform wird unmittelbar bewahrt. Der Ausdruck bleibt ein poetisches Gleichnis und behauptet nicht unmissverständlich einen buchstäblichen Schlaf Gottes.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: אֲדֹנָי ist hier der Gottestitel „Herr“, nicht das Tetragramm; daher wird keine typografische Wiedergabe wie „HERR“ verwendet.
- source_word: כְּגִבּוֹר
  choice: wie ein Held
  rationale: גִּבּוֹר bezeichnet einen starken, kampffähigen Mann oder Kriegshelden. „Held“ ist im poetischen Kontext würdig und lässt Stärke wie Kampfbezug anklingen.
- source_word: מִתְרוֹנֵן
  choice: laut jubelt
  rationale: Die Form bezeichnet wahrscheinlich ein lautes, jubelndes Rufen. „Laut jubelt“ erhält sowohl die hörbare Äußerung als auch den möglichen freudig-triumphierenden Ton.
- source_word: מִיָּיִן
  choice: vom Wein
  rationale: Die Präposition מִן kann hier Ursache oder Auslöser bezeichnen. „Vom Wein“ wahrt die knappe Bildsprache und lässt offen, ob die Wirkung oder der Anlass im Vordergrund steht.
theological_decisions:
- issue: Anthropomorphe Darstellung des erwachenden Herrn und Vergleich mit einem vom Wein angeregten Helden
  choice: Das kühne Gleichnis wird ohne Abschwächung beibehalten.
  alternative: Die Aussage erklärend umschreiben, sodass weder Schlaf noch Wein unmittelbar mit dem Herrn in Verbindung gebracht werden.
  rationale: Der hebräische Text beschreibt Gottes plötzliches Eingreifen durch bewusst spannungsreiche poetische Bilder. Die Übersetzung soll diese Bilder weder verflachen noch dogmatisch auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dichterischer Bildkraft. „Herr“ unterscheidet אֲדֹנָי vom Gottesnamen; die ungewöhnliche Weinmetaphorik und ihre lexikalische Mehrdeutigkeit bleiben erhalten.
