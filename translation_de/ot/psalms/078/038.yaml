    rationale: Die Wendung ist eine zu wörtliche Übertragung und wirkt im modernen Deutsch schwerfällig. Das hebräische Bild des Erregens von Zorn lässt sich mit „entfachte“ natürlich wiedergeben.
  - severity: low
    issue: Unnatürliche Fußnotenformulierung
    rationale: „der übliche Ausdruck für das Schaffen von Sühne“ ist weniger idiomatisch als „der übliche Ausdruck dafür, Sühne zu erwirken“.
