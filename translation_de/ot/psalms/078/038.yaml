  text: וְ/ה֤וּא רַח֨וּם יְכַפֵּ֥ר עָוֺן֮ וְֽ/לֹא יַ֫שְׁחִ֥ית וְ֭/הִרְבָּה לְ/הָשִׁ֣יב אַפּ֑/וֹ וְ/לֹֽא יָ֝עִיר כָּל חֲמָתֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/038.yaml
  text: But he[a], being compassionate, made atonement for iniquity and did not destroy; he often turned back his anger and did not stir up all his wrath.
translation:
  language: de
  text: 'Doch er war barmherzig: Er sühnte die Schuld[a] und vernichtete das Volk nicht. Immer wieder wandte er seinen Zorn ab und entfachte nicht seinen ganzen Grimm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er vergab die Schuld.“ Das hebräische Verb ist der übliche Ausdruck dafür, Sühne zu erwirken; deshalb bewahrt der Haupttext diese Bedeutung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  choice: barmherzig
  rationale: Das Adjektiv bezeichnet erbarmende, mitfühlende Güte. „Barmherzig“ ist im Deutschen klar, würdevoll und in diesem Gottesprädikat idiomatisch.
- source_word: יְכַפֵּר
  choice: sühnte
  rationale: Das Piel von כפר ist der geläufige Ausdruck für Sühne beziehungsweise Entsühnung. „Sühnte“ bewahrt dieses theologische Gewicht, ohne einen im Vers nicht genannten Mechanismus zu ergänzen.
- source_word: עָוֺן
  choice: die Schuld
  rationale: עָוֹן kann Verfehlung, Schuld oder die aus der Sünde erwachsende Schuld bezeichnen. „Schuld“ passt natürlich zur Verbindung mit „sühnen“ und lässt die semantische Breite teilweise bestehen.
- source_word: יַשְׁחִית
  choice: vernichtete
  rationale: Der Hiphil von שׁחת bezeichnet hier das zugrunde richtende Gericht. Das im Deutschen nötige Objekt „sie“ bezieht sich aus dem Zusammenhang auf das Volk.
- source_word: וְהִרְבָּה לְהָשִׁיב
  choice: Immer wieder wandte er … ab
  rationale: הִרְבָּה mit Infinitiv drückt wiederholtes Handeln aus. „Immer wieder“ gibt diese iterative Bedeutung in natürlichem Deutsch wieder.
- source_word: אַפּוֹ
  choice: seinen Zorn
  rationale: אַף bedeutet wörtlich „Nase“, ist hier aber die feste hebräische Bezeichnung für Zorn.
- source_word: יָעִיר
  choice: ließ … erwachen
  rationale: Der Hiphil von עור bedeutet „wecken, erregen“. Mit Grimm als Objekt bewahrt „erwachen lassen“ das hebräische Bild.
- source_word: כָּל חֲמָתוֹ
  choice: seinen ganzen Grimm
  rationale: „Seinen ganzen Grimm“ bildet כָּל ausdrücklich ab und gibt die starke Bedeutung von חֵמָה würdevoll wieder.
theological_decisions:
- issue: Bedeutung von כפר außerhalb eines ausdrücklich kultischen Zusammenhangs
  choice: Er sühnte die Schuld
  alternative: Er vergab die Schuld
  rationale: Das Verb ist der übliche hebräische Sühnebegriff. Die Hauptfassung erhält diese theologische Färbung, legt jedoch nicht fest, auf welche Weise die Sühne geschieht; die kontextuell mögliche Bedeutung „vergeben“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Vergangenheitsformen geben das im erzählenden Rückblick beschriebene wiederholte Handeln wieder. Der Doppelpunkt macht die Barmherzigkeit als Grund des folgenden Handelns lesbar, ohne die Aussage dogmatisch auszudeuten.
