  yaml_path: translation/ot/psalms/078/017.yaml
  text: Yet they continued to sin against him[a], rebelling against the Most High in the dry land.
translation:
  language: de
  text: Doch sie sündigten weiter gegen ihn und lehnten sich im dürren Land[a] gegen den Höchsten auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Wüste“ oder „im ausgedörrten Land“. Das hebräische Wort bezeichnet ausdrücklich einen trockenen, wasserarmen Ort.'
