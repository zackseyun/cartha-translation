lexical_decisions:
- source_word: וַיּוֹסִיפוּ עוֹד
  choice: Doch sie sündigten weiter
  rationale: Die Verbindung aus יסף im Hifil mit Infinitiv und עוֹד bezeichnet die Fortsetzung beziehungsweise Wiederholung. „Doch … weiter“ gibt sowohl den Fortgang als auch den im Zusammenhang liegenden Gegensatz natürlich wieder.
- source_word: לַחֲטֹא לוֹ
  choice: gegen ihn sündigen
  rationale: חטא mit ל bezeichnet hier das Sündigen gegen jemanden; das Pronomen bezieht sich im Kontext auf Gott.
- source_word: לַמְרוֹת
  choice: sich … gegen … auflehnen
  rationale: Das Verb מרה bezeichnet widerspenstiges, rebellisches Verhalten. „Sich auflehnen“ bewahrt den Gedanken bewussten Widerstands und klingt im modernen Deutschen natürlich.
- source_word: עֶלְיוֹן
  choice: der Höchste
  rationale: Der etablierte deutsche Gottesname beziehungsweise Hoheitstitel bewahrt die Aussage des hebräischen Epithetons.
- source_word: בַּצִּיָּה
  choice: im dürren Land
  rationale: צִיָּה bezeichnet einen trockenen, wasserarmen Ort oder Landstrich. „Im dürren Land“ bildet diese spezifische Bedeutung genauer ab als das allgemeinere „in der Wüste“.
theological_decisions:
- issue: Wiedergabe des Gottestitels עֶלְיוֹן
  choice: der Höchste
  alternative: der Allerhöchste
  rationale: „Der Höchste“ entspricht dem hebräischen Titel unmittelbar und bewahrt dessen theologisches Gewicht, ohne eine zusätzliche Steigerungsnuance einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt klar und gut lesbar; die Wiederholung von „gegen“ ist bewusst beibehalten, weil sie die zweifache Ausrichtung des hebräischen Satzes gegen Gott beziehungsweise den Höchsten transparent wiedergibt.
