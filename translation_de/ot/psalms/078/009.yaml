lexical_decisions:
- source_word: בְּנֵי אֶפְרַיִם
  choice: Die Söhne Ephraims
  rationale: Die Wendung bezeichnet die Angehörigen des Stammes Ephraim, bewahrt aber in dieser Form zugleich die genealogische Ausdrucksweise des Hebräischen.
- source_word: נוֹשְׁקֵי רוֹמֵי קָשֶׁת
  choice: mit Bogen bewaffnet
  rationale: Die gedrängte Partizipialkonstruktion beschreibt Bewaffnung und den Umgang mit dem Bogen. Die Wiedergabe ist im Deutschen natürlich und bleibt nahe am militärischen Bild, ohne zusätzliche Einzelheiten festzulegen.
- source_word: הָפְכוּ
  choice: wichen … zurück
  rationale: Das Verb bezeichnet hier eine Umkehr beziehungsweise ein Zurückweichen. Im Schlachtzusammenhang gibt „wichen zurück“ den Sinn idiomatisch wieder, ohne den Vorgang stärker als Flucht zu bestimmen.
- source_word: בְּיוֹם קְרָב
  choice: am Tag der Schlacht
  rationale: Die Zeitangabe wird direkt und in würdigem, natürlichem Deutsch wiedergegeben.
