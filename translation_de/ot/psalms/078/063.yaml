base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/063.yaml
  text: Fire consumed his young men[a], and his virgins were not praised in song.
translation:
  language: de
  text: Das Feuer verzehrte seine jungen Männer, und seine Jungfrauen wurden nicht besungen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für seine Jungfrauen erklangen keine Hochzeitslieder.“ Wahrscheinlich ist gemeint, dass wegen der Verwüstung keine Hochzeiten mehr gefeiert wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּרָיו
  choice: seine jungen Männer
  rationale: בָּחוּר bezeichnet gewöhnlich junge Männer in der Blüte ihrer Kraft, hier wohl im kriegs- und heiratsfähigen Alter. Die Wiedergabe passt zum Parallelbegriff für die jungen Frauen.
- source_word: אָכְלָה אֵשׁ
  choice: verzehrte das Feuer
  rationale: אָכַל bedeutet wörtlich „essen“, bezeichnet mit Feuer als Subjekt aber idiomatisch ein vollständiges Verzehren. Die deutsche Formulierung bewahrt das kräftige Bild.
- source_word: וּבְתוּלֹתָיו
  choice: und seine jungen Frauen
  rationale: בְּתוּלָה bezeichnet eine unverheiratete junge Frau beziehungsweise Jungfrau. „Junge Frauen“ klingt im heutigen Deutsch natürlich und lässt im Zusammenhang mit ausbleibenden Hochzeitsliedern den heiratsfähigen Stand erkennen.
- source_word: לֹא הוּלָּלוּ
  choice: wurden nicht mit Liedern gefeiert
  rationale: Der Pual von הלל bedeutet hier, gefeiert oder besungen zu werden. Der Zusatz „mit Liedern“ macht die wahrscheinlich gemeinte öffentliche, wohl hochzeitliche Feier verständlich, ohne sie im Haupttext ausdrücklich auf Hochzeiten festzulegen.
