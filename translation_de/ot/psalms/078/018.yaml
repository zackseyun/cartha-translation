  text: They tested God in their heart by asking for food for themselves[a][b].
translation:
  language: de
  text: Sie stellten Gott in ihrem Herzen auf die Probe, indem sie Nahrung für sich erbaten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für ihre nefesch“. Das hebräische Wort kann hier „sie selbst“, „ihr Verlangen“ oder „ihr Appetit“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: sie stellten … auf die Probe
  rationale: Das Piel von נסה bezeichnet hier ein prüfendes Herausfordern. „Auf die Probe stellen“ ist im Deutschen präziser als „versuchen“, das missverständlich sein könnte.
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier die allgemeine Gottesbezeichnung; „Gott“ ist natürlich und kontextgemäß.
- source_word: בִּלְבָבָם
  choice: in ihrem Herzen
  rationale: Die singularische Form mit pluralischem Suffix wird als kollektive hebräische Wendung bewahrt; sie bezeichnet die innere Haltung des Volkes.
- source_word: לִשְׁאָל
  choice: indem sie … verlangten
  rationale: Der Infinitiv mit ל beschreibt hier die Art und Weise des Prüfens. Im Zusammenhang der herausfordernden Forderung gibt „verlangten“ die stärkere Nuance natürlicher wieder als das neutrale „baten“.
- source_word: אֹכֶל
  choice: Nahrung
  rationale: אֹכֶל bezeichnet allgemein Essen beziehungsweise Nahrung, nicht speziell Brot.
- source_word: לְנַפְשָׁם
  choice: für sich
  rationale: נֶפֶשׁ kann hier die eigene Person, das Verlangen oder den Appetit bezeichnen. „Für sich“ wahrt die idiomatische Bedeutung ohne die Stelle vorschnell auf eine anthropologische Bedeutung von „Seele“ festzulegen.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im Zusammenhang des Verlangens nach Nahrung
  choice: für sich
  alternative: für ihren Appetit / für ihr Verlangen / für ihre Seele
  rationale: Der Kontext legt Selbstbezug beziehungsweise körperliches Verlangen nahe. „Für sich“ bleibt eng am hebräischen Ausdruck und vermeidet sowohl eine unnatürliche Formulierung als auch die Eintragung einer späteren Leib-Seele-Dichotomie.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kollektive Einzahl „in ihrem Herzen“ bewahrt bewusst die hebräische Ausdrucksweise; „Nahrung“ ist allgemein und nicht auf Brot verengt.
