  terminology: „Gott“ und „Nahrung“ sind passend. „Nefesch“ wird als fachsprachliche Transkription in der Fußnote erklärt; die angeführten Bedeutungen vermeiden eine dogmatisch verengte Deutung von נֶפֶשׁ.
