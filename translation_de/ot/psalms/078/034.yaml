base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/034.yaml
  text: When he killed them[a], they sought him[b]; they returned and sought God earnestly.
translation:
  language: de
  text: Wenn er sie tötete, suchten sie ihn; sie kehrten zurück[a] und suchten Gott mit Eifer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet wörtlich „zurückkehren“ oder „umkehren“ und kann in diesem Zusammenhang auch eine Hinwendung zu Gott im Sinn von Reue bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steckt die Vorstellung des frühen Aufsuchens darin; die Wendung bezeichnet ein eifriges oder ernsthaftes Suchen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: In diesem poetisch-geschichtlichen Zusammenhang bezeichnet אִם eine wiederholt eintretende Situation und nicht in erster Linie eine hypothetische Bedingung.
- source_word: הֲרָגָם
  choice: er sie tötete
  rationale: הרג bedeutet klar „töten“. Das Subjekt der 3. Person Singular ist im Hebräischen enthalten und bezieht sich im Kontext auf Gott.
- source_word: וּדְרָשׁוּהוּ
  choice: suchten sie ihn
  rationale: דרש mit persönlichem Objekt bezeichnet hier das Suchen nach jemandem beziehungsweise die Hinwendung zu ihm; das pronominale Objekt wird ausdrücklich wiedergegeben.
- source_word: וְשָׁבוּ
  choice: sie kehrten um
  rationale: שוב bedeutet grundlegend „umkehren/zurückkehren“. „Kehrten um“ ist im Deutschen natürlich und lässt offen, wie tiefgreifend ihre Hinwendung war.
- source_word: וְשִׁחֲרוּ
  choice: suchten … mit Eifer
  rationale: Das Piel von שחר kann wörtlich ein frühes Suchen bezeichnen und idiomatisch ein eifriges, ernsthaftes Suchen. Die gewählte Formulierung gibt den idiomatischen Sinn verständlich wieder.
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier die übliche Gottesbezeichnung; „Gott“ ist im Kontext klar und vermeidet eine interpretierende Erweiterung.
theological_decisions:
- issue: Ob וְשָׁבוּ ausdrücklich als Buße beziehungsweise Reue wiederzugeben ist
  choice: sie kehrten um
  alternative: sie bereuten es / sie taten Buße
  rationale: Das Verb שוב kann im Zusammenhang eine Umkehr zu Gott und damit Reue einschließen, bezeichnet lexikalisch jedoch zunächst das Umkehren oder Zurückkehren. Die Übersetzung bewahrt diese theologische Spannung, ohne die Aufrichtigkeit oder Tiefe der Reaktion vorwegzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Satzfolge und der Wechsel von „ihn“ zu „Gott“ bleiben erhalten; altertümliche Wörter und eine ausdrückliche konfessionelle Deutung werden vermieden.
