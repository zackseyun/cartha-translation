  text: וַ/יְגָ֤רֶשׁ מִ/פְּנֵי/הֶ֨ם גּוֹיִ֗ם וַֽ֭/יַּפִּילֵ/ם בְּ/חֶ֣בֶל נַחֲלָ֑ה וַ/יַּשְׁכֵּ֥ן בְּ֝/אָהֳלֵי/הֶ֗ם שִׁבְטֵ֥י יִשְׂרָאֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/055.yaml
  text: He drove out nations before them and allotted them an inheritance by measuring line[b][a]; he settled the tribes of Israel in their tents.
translation:
  language: de
  text: Er vertrieb Völker vor ihnen und wies ihnen mit der Messschnur ein Erbteil zu[a]; in ihren Zelten ließ er die Stämme Israels wohnen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Er ließ es ihnen mit der Messschnur als Erbteil zufallen.« Der hebräische Ausdruck verbindet das Bild des Zufallens beziehungsweise der Zuteilung mit der Vermessung und Aufteilung des Erbteils.'
    reason: Der Ausdruck וַיַּפִּילֵם בְּחֶבֶל נַחֲלָה ist idiomatisch und bewahrt die Vorstellung der vermessenen Landzuteilung.
  - marker: b
    text: 'Wörtlich: »in ihren Zelten«. Das hebräische Possessivsuffix benennt den Bezug nicht ausdrücklich; im Deutschen kann es sich naheliegend auf die Stämme Israels beziehen, ohne andere kontextuelle Bezüge endgültig auszuschließen.'
    reason: Die Fußnote erhält die im hebräischen Pronomen liegende Unbestimmtheit, statt die Zelte im Haupttext den zuvor genannten Völkern zuzuordnen.
lexical_decisions:
- source_word: וַיְגָרֶשׁ מִפְּנֵיהֶם גּוֹיִם
  choice: Er vertrieb Völker vor ihnen
  rationale: גרש bezeichnet ein Vertreiben oder Ausstoßen; מִפְּנֵיהֶם wird mit dem im Deutschen verständlichen »vor ihnen« wiedergegeben, ohne die göttliche Urheberschaft oder den Vorgang näher auszudeuten.
- source_word: וַיַּפִּילֵם בְּחֶבֶל נַחֲלָה
  choice: und teilte ihnen das Land mit der Messschnur als Erbbesitz zu
  rationale: נפל ist hier idiomatisch im Sinn der Zuteilung eines Landanteils gebraucht. חבל bewahrt mit »Messschnur« das Bild der vermessenen Landaufteilung; נחלה bezeichnet den dauerhaft zugewiesenen Erbbesitz. Das Objektpronomen wird kontextgemäß auf die zuvor genannten Völker beziehungsweise deren Land bezogen.
- source_word: וַיַּשְׁכֵּן
  choice: ließ er … wohnen
  rationale: Die Kausativform von שכן wird transparent mit »ließ … wohnen« wiedergegeben und wahrt die göttliche Handlungsträgerschaft.
- source_word: בְּאָהֳלֵיהֶם
  choice: in den Zelten jener Völker
  rationale: אהל bedeutet wörtlich »Zelt«. Das maskuline Pluralpronomen bezieht sich grammatisch am naheliegendsten auf die zuvor genannten Völker; die explizite Formulierung verhindert im Deutschen die missverständliche Rückbeziehung auf Israel.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: die Stämme Israels
  rationale: Direkte und im modernen Standarddeutsch etablierte Wiedergabe der hebräischen Status-constructus-Verbindung.
theological_decisions:
- issue: Göttliche Urheberschaft bei Vertreibung, Landzuteilung und Ansiedlung
  choice: Gott bleibt durchgehend das Subjekt aller drei Handlungen.
  alternative: Israel als handelndes Subjekt der Eroberung oder Ansiedlung ausdrücklich benennen.
  rationale: Der Psalm berichtet an dieser Stelle von Gottes Taten. Die Übersetzung erhält diese Aussage, ohne zusätzliche Aussagen über Mittel, Ablauf oder spätere theologische Deutungen der Landnahme einzutragen.
- issue: Bezug des Pronomens in בְּאָהֳלֵיהֶם
  choice: 'Bezug auf die vertriebenen Völker: »in den Zelten jener Völker«.'
  alternative: »in ihren Zelten« mit möglichem Bezug auf die Stämme Israels beziehungsweise allgemeiner »in ihren Wohnstätten«.
  rationale: Das Suffix der 3. Person maskulin Plural hat in גּוֹיִם einen grammatisch passenden vorherigen Bezug; שִׁבְטֵי יִשְׂרָאֵל folgt erst danach als Objekt des Ansiedelns. Da das Deutsche »ihren« leicht Israel zuordnen ließe, wird der wahrscheinlichste Bezug im Haupttext verdeutlicht und die formale Mehrdeutigkeit in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter Bildsprache. »Messschnur« und »Zelte« bewahren die hebräischen Bilder; »Erbbesitz« gibt den landbezogenen Sinn von נַחֲלָה knapp wieder. Der Satzbau folgt dem dreigliedrigen Handlungsablauf des Hebräischen.
