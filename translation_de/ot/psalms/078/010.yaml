source:
  edition: WLC
  text: לֹ֣א שָׁ֭מְרוּ בְּרִ֣ית אֱלֹהִ֑ים וּ֝/בְ/תוֹרָת֗/וֹ מֵאֲנ֥וּ לָ/לֶֽכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/010.yaml
  text: They did not keep the covenant of God[a], and they refused to walk in his law.
translation:
  language: de
  text: Sie hielten Gottes Bund nicht und weigerten sich, nach seiner Weisung zu leben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in seiner Tora zu gehen“. Tora kann „Weisung“, „Lehre“ oder „Gesetz“ bedeuten; „gehen“ bezeichnet hier den Lebenswandel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: hielten
  rationale: שׁמר bedeutet in Verbindung mit בְּרִית, einen Bund zu halten beziehungsweise zu wahren. „Den Bund halten“ ist im Deutschen natürlich und bewahrt den Gedanken treuer Bundeseinhaltung.
- source_word: בְּרִית אֱלֹהִים
  choice: Gottes Bund
  rationale: Die deutsche Genitivfügung gibt den hebräischen Constructus prägnant wieder und bezeichnet den von Gott gesetzten beziehungsweise ihm zugehörigen Bund.
- source_word: וּבְתוֹרָתוֹ
  choice: nach seiner Weisung
  rationale: תּוֹרָה kann Gesetz, Lehre oder Weisung bedeuten. „Weisung“ bewahrt hier die normative Kraft, ohne den Begriff auf einzelne Rechtsbestimmungen einzuengen; „nach“ gibt die idiomatische Vorstellung des Lebenswandels gemäß dieser Weisung wieder.
- source_word: מֵאֲנוּ
  choice: weigerten sich
  rationale: מאן bezeichnet eine bewusste Weigerung oder Ablehnung. „Sich weigern“ entspricht der starken Anklage des Verses.
- source_word: לָלֶכֶת
  choice: zu leben
  rationale: הלך bedeutet wörtlich „gehen“, bezeichnet hier aber bildlich den Lebenswandel. „Leben“ vermittelt diese Bedeutung in natürlichem modernem Deutsch; die Fußnote hält das hebräische Bild fest.
- source_word: לֹא
  choice: nicht
  rationale: Die einfache Verneinung wird in der deutschen Satzstellung unmittelbar und vollständig wiedergegeben.
theological_decisions:
- issue: Wiedergabe von תּוֹרָה im Bundeszusammenhang
  choice: Weisung
  alternative: Gesetz
  rationale: Die Verbindung mit dem Bund verlangt normative Verbindlichkeit, doch תּוֹרָה umfasst mehr als kodifiziertes Recht. „Weisung“ lässt diese Breite bestehen; die Fußnote nennt „Gesetz“ als mögliche Wiedergabe.
- issue: Bildlicher Gebrauch von הלך
  choice: nach seiner Weisung zu leben
  alternative: in seinem Gesetz zu wandeln
  rationale: Die Übersetzung gibt den gemeinten Lebenswandel verständlich wieder, ohne die Forderung nach umfassendem Gehorsam abzuschwächen. Die wörtliche Wegmetapher wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des hebräischen Verses bleibt erhalten. „Gottes Bund“ und „seine Weisung“ sind allgemein verständlich; die Fußnote bewahrt sowohl die Bedeutungsbreite von תּוֹרָה als auch das hebräische Bild des Gehens.
