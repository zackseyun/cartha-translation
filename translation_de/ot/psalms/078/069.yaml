  text: וַ/יִּ֣בֶן כְּמוֹ רָ֭מִים מִקְדָּשׁ֑/וֹ כְּ֝/אֶ֗רֶץ יְסָדָ֥/הּ לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/069.yaml
  text: And he built his sanctuary like the heights[b][a], like the earth that he established forever.
translation:
  language: de
  text: Und er baute sein Heiligtum wie die Höhen[a], wie die Erde, die er für immer gegründet hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie die hohen Himmel“ oder „wie hohe Berggipfel“. Der hebräische Ausdruck ist poetisch und kann himmlische oder bergige Höhen anklingen lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Und er baute
  rationale: Das Wayyiqtol von בנה führt die nächste Handlung der Erzählfolge ein. „Und er baute“ bewahrt den schlichten verbalen Sinn und den Anschluss an den Kontext.
- source_word: כְּמוֹ רָמִים
  choice: wie die Höhen
  rationale: רָמִים bezeichnet Erhabenes beziehungsweise Höhen. Die offene poetische Formulierung vermeidet eine vorschnelle Festlegung auf Himmel oder Berge.
- source_word: מִקְדָּשׁוֹ
  choice: sein Heiligtum
  rationale: מִקְדָּשׁ bezeichnet einen heiligen Ort oder ein Heiligtum. „Heiligtum“ ist im Deutschen natürlich und enger am hebräischen Ausdruck als das spezifischere „Tempel“.
- source_word: כְּאֶרֶץ
  choice: wie die Erde
  rationale: Die Erde bildet im poetischen Parallelismus das Bild einer fest gegründeten, bleibenden Wirklichkeit; „Erde“ ist hier gegenüber „Land“ vorzuziehen.
- source_word: יְסָדָהּ
  choice: die er … gegründet hat
  rationale: יסד bedeutet „gründen, ein Fundament legen“. Das feminine Suffix bezieht sich auf die Erde. „Gegründet“ erhält zudem das im Hebräischen vorhandene Bau- und Fundamentbild.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet bleibende Dauer. „Für immer“ ist modernes, geläufiges Deutsch und bewahrt die poetische Aussage.
theological_decisions:
- issue: Bildlicher Bezug des Vergleichs mit dem Heiligtum
  choice: Das Heiligtum wird mit „den Höhen“ verglichen, ohne die Bildwelt näher festzulegen.
  alternative: Der Ausdruck kann ausdrücklich als „die hohen Himmel“ oder als „hohe Berggipfel“ verstanden werden.
  rationale: Das hebräische רָמִים ist poetisch verdichtet und lässt himmlische wie bergige Vorstellungen anklingen. Die offene Wiedergabe bewahrt diese Mehrdeutigkeit und verbindet Erhabenheit mit der im zweiten Vergleich genannten Beständigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzstruktur. Die Wiederholung „wie …, wie …“ bildet den hebräischen Parallelismus nach; „gegründet“ erhält bewusst das Fundamentmotiv.
