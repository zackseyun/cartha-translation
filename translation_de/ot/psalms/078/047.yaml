source:
  edition: WLC
  text: יַהֲרֹ֣ג בַּ/בָּרָ֣ד גַּפְנָ֑/ם וְ֝/שִׁקְמוֹתָ֗/ם בַּֽ/חֲנָמַֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/047.yaml
  text: He destroyed their vines with hail[a], and their sycamore trees with frost.
translation:
  language: de
  text: Er vernichtete ihre Weinstöcke durch Hagel und ihre Maulbeerfeigenbäume durch Frost.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Heuschrecken“, „durch Hagelkörner“ oder „durch Graupel“; das hebräische Wort ist selten und seine Bedeutung unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַהֲרֹג
  choice: vernichtete
  rationale: Das Verb bedeutet wörtlich „töten“ oder „erschlagen“. Bei Pflanzen gibt „vernichtete“ die Wirkung idiomatisch und zugleich kraftvoll wieder.
- source_word: בַּבָּרָד
  choice: durch Hagel
  rationale: Die Präposition ב ist hier instrumental gebraucht; „durch Hagel“ bezeichnet klar das Mittel der Vernichtung.
- source_word: גַּפְנָם
  choice: ihre Weinstöcke
  rationale: Das kollektive Singularwort bezeichnet die Reben selbst, nicht ausdrücklich die Weinberge als Anbauflächen.
- source_word: וְשִׁקְמוֹתָם
  choice: und ihre Maulbeerfeigenbäume
  rationale: שִׁקְמָה bezeichnet die Maulbeerfeige (Ficus sycomorus). Die präzise deutsche Pflanzenbezeichnung vermeidet eine Verwechslung mit dem heutigen Ahornblättrigen Platanenbaum, der ebenfalls „Sykomore“ genannt wird.
- source_word: בַּחֲנָמַל
  choice: durch Frost
  rationale: Das seltene Wort חֲנָמַל ist in seiner Bedeutung unsicher. „Frost“ ist eine traditionsreiche, im Parallelismus mit Hagel sachlich mögliche Wiedergabe; die Unsicherheit wird in einer Fußnote offengelegt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit engem Bezug zur hebräischen Bildfolge. „Maulbeerfeigenbäume“ ist präziser als das im Deutschen missverständliche „Sykomoren“. Der Fußnotenmarker steht unmittelbar nach dem unsicheren Ausdruck.
