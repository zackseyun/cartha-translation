source:
  edition: WLC
  text: וְ/יָשִׂ֥ימוּ בֵֽ/אלֹהִ֗ים כִּ֫סְלָ֥/ם וְ/לֹ֣א יִ֭שְׁכְּחוּ מַֽעַלְלֵי אֵ֑ל וּ/מִצְוֺתָ֥י/ו יִנְצֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/007.yaml
  text: so that they might set their hope in God and not forget the deeds of God[b][a], but keep his commandments.
translation:
  language: de
  text: damit sie ihre Hoffnung auf Gott setzen, Gottes Taten nicht vergessen und seine Gebote bewahren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשִׂימוּ בֵאלֹהִים כִּסְלָם
  choice: damit sie ihre Hoffnung auf Gott setzen
  rationale: Der mit וְ angeschlossene Imperfekt führt im Zusammenhang den Zweckgedanken des vorigen Verses fort. כֶּסֶל bezeichnet hier Hoffnung, Zuversicht oder Vertrauen; „Hoffnung auf Gott setzen“ ist natürliches modernes Deutsch und drückt verlässliche Zuversicht aus.
- source_word: וְלֹא יִשְׁכְּחוּ
  choice: nicht vergessen
  rationale: Die verneinte Imperfektform bezeichnet im fortgeführten Zweckzusammenhang, dass Gottes Handeln nicht in Vergessenheit geraten soll.
- source_word: מַעַלְלֵי אֵל
  choice: Gottes Taten
  rationale: מַעֲלָלִים bezeichnet Taten oder Werke. „Taten“ ist klar und gibt Gottes wirksames Handeln wieder; אֵל wird hier ohne künstliche Bedeutungsdifferenzierung als „Gott“ wiedergegeben.
- source_word: וּמִצְוֺתָיו יִנְצֹרוּ
  choice: und seine Gebote bewahren
  rationale: נצר bedeutet bewachen, bewahren oder einhalten. Bei Geboten bewahrt „bewahren“ sowohl den Gedanken sorgfältiger Beachtung als auch den gehobenen biblischen Sprachklang.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnungen אֱלֹהִים und אֵל in parallelen Satzteilen
  choice: Beide werden als „Gott“ wiedergegeben.
  alternative: אֵל als „der Mächtige“ oder durch eine andere Gottesbezeichnung wiedergeben.
  rationale: Die beiden gebräuchlichen hebräischen Gottesbezeichnungen stehen hier in poetischem Zusammenhang, ohne dass eine eigenständige theologische Unterscheidung hervorgehoben wird. Die einheitliche Wiedergabe vermeidet eine in den Text hineingetragene Differenzierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers wird als fortlaufender Zwecksatz formuliert; die drei parallelen Aussagen bleiben knapp und klar. Keine Fußnote ist nötig, da die wichtigsten Bedeutungsnuancen im Deutschen ohne sachlichen Verlust im Haupttext wiedergegeben werden können.
