source:
  edition: WLC
  text: וַ/יַּמְטֵ֬ר עֲלֵי/הֶ֣ם מָ֣ן לֶ/אֱכֹ֑ל וּ/דְגַן שָׁ֝מַ֗יִם נָ֣תַן לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/024.yaml
  text: He rained down manna on them to eat[a], and gave them the grain of heaven.
translation:
  language: de
  text: Er ließ Manna auf sie regnen, damit sie es essen konnten, und gab ihnen Korn vom Himmel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Korn des Himmels“; die Wendung beschreibt das Manna poetisch. Sinngemäß wäre auch „Nahrung vom Himmel“ möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: Er ließ … regnen
  rationale: Der Hifil von מטר bezeichnet das Verursachen von Regen. Die Formulierung bewahrt den kausativen Sinn und klingt im Deutschen natürlich.
- source_word: עֲלֵיהֶם
  choice: auf sie
  rationale: Die Präposition עַל mit Suffix bezeichnet hier die Richtung des Herabregnens.
- source_word: מָן
  choice: Manna
  rationale: „Manna“ ist die etablierte deutsche Bezeichnung für die Speise während der Wüstenwanderung.
- source_word: לֶאֱכֹל
  choice: damit sie zu essen hatten
  rationale: Der mit ל gebildete Infinitiv drückt hier den Zweck aus. Diese Wiedergabe macht im Deutschen natürlich deutlich, dass das Manna ihnen als Nahrung gegeben wurde.
- source_word: דְגַן
  choice: Korn
  rationale: דָּגָן bezeichnet Getreide beziehungsweise Korn. „Korn“ erhält in der Verbindung mit dem Himmel die konkrete poetische Metapher.
- source_word: שָׁמַיִם
  choice: vom Himmel
  rationale: Der hebräische Konstrukt דְגַן שָׁמַיִם lautet wörtlich „Korn des Himmels“. „Korn vom Himmel“ ist idiomatisches Deutsch und bewahrt sowohl Herkunftsvorstellung als auch Bildsprache.
- source_word: נָתַן
  choice: gab
  rationale: נתן ist das gewöhnliche Verb für „geben“; die schlichte Wiedergabe entspricht dem Hebräischen.
- source_word: לָמוֹ
  choice: ihnen
  rationale: Die poetische Pronominalform bedeutet „ihnen“ und wird als natürliches indirektes Objekt wiedergegeben.
theological_decisions:
- issue: Poetische Bezeichnung des Mannas als „Korn des Himmels“
  choice: Die Korn-Metapher wird als „Korn vom Himmel“ beibehalten.
  alternative: „Nahrung vom Himmel“ oder „Brot vom Himmel“
  rationale: דגן bedeutet konkret „Korn/Getreide“. Eine allgemeinere oder aus verwandten Texten übernommene Wiedergabe als „Nahrung“ beziehungsweise „Brot“ würde die besondere Bildsprache dieses Verses interpretierend einebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Parallelität. Die ungewöhnliche Metapher „Korn vom Himmel“ bleibt erhalten; die Fußnote nennt die wörtliche Konstruktverbindung und eine sinngemäße Alternative.
