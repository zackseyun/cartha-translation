base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/023.yaml
  text: Yet he commanded the clouds above[b][a], and opened the doors of heaven.
translation:
  language: de
  text: Doch er gebot den Wolken hoch oben[a] und öffnete die Türen des Himmels[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Himmel dort oben“. Das hebräische Wort kann Wolken, Himmel oder Himmelshöhen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Tore des Himmels“. Wörtlich steht hier „die Türen des Himmels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: gebot
  rationale: צוה bezeichnet ein Befehlen oder Anordnen. „Gebot“ gibt Gottes autoritatives Handeln knapp wieder; die Verbform wird entsprechend dem erzählenden Zusammenhang als Vergangenheit übersetzt.
- source_word: שְׁחָקִים
  choice: den Wolken
  rationale: שְׁחָקִים kann „Wolken“, „Himmel“ oder „Höhen“ bezeichnen. Im Zusammenhang mit der vom Himmel kommenden Speise ist „Wolken“ anschaulich und lexikalisch gut begründet, während die Fußnote die Mehrdeutigkeit wahrt.
- source_word: מִמָּעַל
  choice: hoch oben
  rationale: Der Ausdruck bezeichnet eine Lage oberhalb beziehungsweise in der Höhe. „Hoch oben“ ist im Deutschen natürlich und bewahrt die räumliche Vorstellung.
- source_word: דַלְתֵי
  choice: die Türen des
  rationale: דֶּלֶת bedeutet gewöhnlich „Tür“. Der Plural im Status constructus wird unmittelbar als „die Türen des“ wiedergegeben; „Tore“ bleibt als stilistisch mögliche Alternative in der Fußnote erhalten.
- source_word: שָׁמַיִם
  choice: Himmels
  rationale: שָׁמַיִם kann je nach Zusammenhang „Himmel“, „Himmelsraum“ oder „Himmelshöhen“ bedeuten. In der poetischen Wendung „Türen des Himmels“ ist der deutsche Singular idiomatisch und würdevoll.
- source_word: פָּתָח
  choice: öffnete
  rationale: פתח bedeutet schlicht „öffnen“. „Öffnete“ bewahrt die Bildsprache, ohne eine im Hebräischen nicht ausdrücklich vorhandene Verstärkung hinzuzufügen.
- source_word: וַ
  choice: Doch
  rationale: Das einleitende Waw verbindet den Vers mit dem vorherigen Zusammenhang. Angesichts von Israels Unglauben und Gottes dennoch gewährter Versorgung bringt „Doch“ die kontextuelle Gegenüberstellung zum Ausdruck.
theological_decisions:
- issue: Aussagewert des einleitenden Waw im Zusammenhang von Israels Unglauben und Gottes Versorgung
  choice: Adversativ mit „Doch“ wiedergegeben
  alternative: „Und“ oder „Dann“
  rationale: Die Konjunktion selbst ist bedeutungsweit; der Zusammenhang stellt Gottes Handeln jedoch Israels Misstrauen gegenüber. „Doch“ macht diese Spannung sichtbar, ohne dem Satz eine zusätzliche Lehrentscheidung aufzuerlegen.
- issue: Kosmische Bildsprache der „Türen des Himmels“
  choice: Das konkrete Türbild wörtlich bewahrt
  alternative: „Tore des Himmels“ oder eine entbildlichende Wiedergabe wie „den Himmel geöffnet“
  rationale: Der hebräische Text stellt den Himmel poetisch als einen Raum mit zu öffnenden Türen dar. Die Übersetzung erhält dieses Bild und vermeidet es, die Aussage kosmologisch oder metaphorisch enger festzulegen.
translation_notes:
  register: Moderne, verständliche und zugleich poetisch-würdevolle Standardsprache. „Gebot“ und „Türen des Himmels“ erhalten die knappe, erhabene Bildsprache des hebräischen Verses; die Fußnoten weisen auf echte lexikalische Alternativen hin.
