base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/059.yaml
  text: God heard and was furious[b][a], and he utterly rejected Israel.
translation:
  language: de
  text: Gott hörte es und geriet in Zorn[a]; Israel verwarf[b] er völlig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurde zornig« oder »wurde sehr zornig«. Das hebräische Verb bezeichnet hier das Zornigwerden bzw. heftige Entrüstung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »verschmähte« oder »verachtete«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: hörte es
  rationale: Das Qal-Perfekt bedeutet gewöhnlich »hören«. Das im Deutschen nötige Pronomen »es« greift Israels zuvor geschildertes Verhalten auf, ohne den Gegenstand näher festzulegen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch singularische Verwendung bezeichnet hier eindeutig den Gott Israels; »Gott« ist die sachgemäße Standardwiedergabe.
- source_word: וַיִּתְעַבָּר
  choice: geriet in Zorn
  rationale: Der Hitpael von עבר bezeichnet hier das Aufkommen heftigen Zorns. »Geriet in Zorn« bewahrt die starke Aussage und klingt zugleich natürlich und würdevoll.
- source_word: וַיִּמְאַס
  choice: verwarf
  rationale: מאס kann »verwerfen«, »verschmähen« oder »verachten« bedeuten. »Verwarf« gibt in diesem Zusammenhang den Akt entschiedener Zurückweisung präzise wieder.
- source_word: מְאֹד
  choice: völlig
  rationale: Das Adverb verstärkt die Verwerfung. Die Nachstellung »verwarf er völlig« gibt diese Intensivierung im Deutschen klar wieder.
- source_word: בְּיִשְׂרָאֵל
  choice: Israel
  rationale: Die Präposition ב markiert bei מאס das Ziel beziehungsweise Objekt der Verwerfung; im Deutschen wird dies natürlich als direktes Objekt ausgedrückt.
theological_decisions:
- issue: Anthropopathische Sprache über Gottes Zorn und Verwerfung
  choice: Die starke persönliche Sprache wird mit »geriet in Zorn« und »verwarf … völlig« beibehalten.
  alternative: Abschwächung zu »war unzufrieden« und »entzog Israel seine Gunst«.
  rationale: Der hebräische Text verwendet nachdrückliche Sprache des Bundesgerichts. Die Übersetzung bewahrt diese theologische Spannung, ohne die Aussage über Gottes Zorn zu mildern oder über ihren Wortlaut hinaus zu erklären.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die Voranstellung von »Israel« im zweiten Satzteil hebt das Objekt der völligen Verwerfung hervor und vermeidet eine schwerfällige wörtliche Wortfolge.
