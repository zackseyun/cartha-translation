  text: וַ/יַּ֣ךְ כָּל בְּכ֣וֹר בְּ/מִצְרָ֑יִם רֵאשִׁ֥ית א֝וֹנִ֗ים בְּ/אָהֳלֵי חָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/051.yaml
  text: He struck down every firstborn in Egypt[a], the firstfruits of their vigor in the tents of Ham.
translation:
  language: de
  text: Er schlug alle Erstgeborenen in Ägypten nieder, die Erstlinge der Zeugungskraft[a] in den Zelten Hams.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „der Anfang der Kraft“. Die hebräische Redewendung bezeichnet die Erstgeborenen als erstes Erzeugnis der Zeugungskraft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Er schlug … nieder
  rationale: Die Form von נכה erzählt eine vergangene Handlung. Im Zusammenhang mit dem Tod der Erstgeborenen gibt „niederschlagen“ die tödliche Wirkung klar und würdig wieder.
- source_word: כָּל בְּכוֹר
  choice: alle Erstgeborenen
  rationale: Die Wendung bezeichnet die Gesamtheit der hier gemeinten Erstgeborenen. Ein männliches Geschlecht wird im Hebräischen an dieser Stelle nicht eigens ausgedrückt und daher nicht ergänzt.
- source_word: בְּמִצְרָיִם
  choice: in Ägypten
  rationale: Die Präposition bezeichnet hier den Ort; die schlichte geografische Wiedergabe entspricht auch dem Bezug auf die ägyptische Plage.
- source_word: רֵאשִׁית אֹנִים
  choice: die Erstlinge ihrer Zeugungskraft
  rationale: Die poetische Wendung meint das erste Erzeugnis der generativen Kraft. „Erstlinge“ bewahrt das Bild von Anfang beziehungsweise erstem Ertrag; „Zeugungskraft“ macht den fortpflanzungsbezogenen Sinn von אֹנִים deutlich, ohne ihn zu verallgemeinern.
- source_word: בְּאָהֳלֵי חָם
  choice: in den Zelten Hams
  rationale: Die wörtlich-poetische Wiedergabe erhält die Bezeichnung Ägyptens durch Ham sowie die Bildsprache des Psalms.
theological_decisions:
- issue: Poetische Bezeichnung „Ham“ für Ägypten
  choice: „Ham“ bleibt im Haupttext erhalten.
  alternative: „unter den Ägyptern“ oder „in den Wohnstätten Ägyptens“
  rationale: Da Ägypten bereits im ersten Halbvers ausdrücklich genannt wird, fügt „die Zelte Hams“ eine genealogisch-poetische Bezeichnung hinzu. Ihre Beibehaltung wahrt die kanonische Bildwelt, ohne zusätzliche Lehrannahmen einzutragen.
- issue: Bezug des Possessivpronomens in רֵאשִׁית אֹנִים
  choice: „ihrer“ bezieht sich kollektiv auf die in Ägypten Betroffenen beziehungsweise deren Väter.
  alternative: Eine explizite Ergänzung wie „die Erstlinge der Zeugungskraft ihrer Väter“
  rationale: Das Hebräische enthält nur die idiomatische Genitivverbindung und lässt den Bezug unausgeführt. Die Übersetzung wahrt diese Knappheit, statt „Väter“ erklärend in den Haupttext einzufügen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit bewahrtem Parallelismus und poetischer Bildsprache. „Zeugungskraft“ ist präzise und verständlich; die Fußnote erläutert die ungewohnte hebräische Redewendung. Der Marker [a] steht unmittelbar bei der betreffenden Wendung im Haupttext.
