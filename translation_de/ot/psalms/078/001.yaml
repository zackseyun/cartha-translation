id: PSA.78.1
reference: Psalms 78:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מַשְׂכִּ֗יל לְ/אָ֫סָ֥ף הַאֲזִ֣ינָ/ה עַ֭מִּ/י תּוֹרָתִ֑/י הַטּ֥וּ אָ֝זְנְ/כֶ֗ם לְ/אִמְרֵי פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/001.yaml
  text: A Maskil of Asaph. Give ear[a], my people, to my instruction; incline your ears to the words of my mouth.
translation:
  language: de
  text: Ein Maskil Asafs.[a] Höre, mein Volk, auf meine Weisung; neigt eure Ohren den Worten meines Mundes zu!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Maskil“ ist ein Fachausdruck in Psalmüberschriften; möglicherweise bezeichnet er ein Lehr- oder Betrachtungslied.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Der technische Ausdruck der Psalmüberschrift wird transliteriert, da seine genaue Bedeutung umstritten ist; eine mögliche Deutung wird in der Fußnote genannt.
- source_word: לְאָסָף
  choice: Asafs
  rationale: Der Genitiv ist eine natürliche deutsche Wiedergabe der Zuordnung, ohne eindeutig zwischen Autorschaft, Zugehörigkeit oder Widmung zu entscheiden.
- source_word: הַאֲזִינָה
  choice: Höre
  rationale: Der Imperativ fordert zu aufmerksamem Hören auf. „Höre“ ist im Deutschen natürlich und würdevoll.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Das ausdrücklich possessive und als Anrede gebrauchte hebräische Wort wird direkt wiedergegeben.
- source_word: תּוֹרָתִי
  choice: meine Weisung
  rationale: תּוֹרָה bezeichnet hier Lehre oder Unterweisung und nicht notwendig ein Gesetzbuch; „Weisung“ bewahrt zugleich das Gewicht des Begriffs.
- source_word: הַטּוּ
  choice: neigt … zu
  rationale: Die Formulierung erhält das hebräische Bild des geneigten Ohrs und klingt im poetischen Deutsch verständlich.
- source_word: אָזְנְכֶם
  choice: eure Ohren
  rationale: Der hebräische Plural wird ausdrücklich beibehalten.
- source_word: לְאִמְרֵי
  choice: den Worten … zu
  rationale: „Worte“ ist eine klare, kontextgerechte Wiedergabe; der Dativ mit „zuneigen“ bildet die Präposition idiomatisch ab.
- source_word: פִי
  choice: meines Mundes
  rationale: Die konkrete Körpermetaphorik und die Parallele zu den Ohren bleiben erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges poetisches Standarddeutsch. Die parallelen Hörbilder werden bewahrt; „Weisung“ gibt den weiteren Sinn von תּוֹרָה wieder. Die Satzzeichen verdeutlichen, dass beide Halbverse gemeinsam zum aufmerksamen Hören auffordern.
