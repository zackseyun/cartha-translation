  text: וַ֭/יְבִיאֵ/ם אֶל גְּב֣וּל קָדְשׁ֑/וֹ הַר זֶ֝֗ה קָנְתָ֥ה יְמִינֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/054.yaml
  text: So he brought them to his holy border[d][c][b][a], this mountain that his right hand acquired.
translation:
  language: de
  text: So brachte er sie in sein heiliges Gebiet[a] – auf diesen Berg[b], den seine rechte Hand erworben hatte[c].[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „an die Grenze seiner Heiligkeit“ oder „in das Gebiet seiner Heiligkeit“. Das hebräische Wort kann „Grenze“, „Grenzgebiet“ oder „Gebiet“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf diese Anhöhe“ beziehungsweise „in dieses Bergland“. Gemeint sein kann das Israel gegebene Bergland; im weiteren Zusammenhang kann zugleich Zion anklingen.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „in Besitz genommen“, „gewonnen“ oder „gekauft“. Das Verb umfasst mehrere verwandte Bedeutungen und beschreibt hier, was Gottes rechte Hand sich sicherte.'
    reason: lexical_alternative
  - marker: d
    text: 'Andere mögliche Wiedergabe: „So brachte er sie an die Grenze seiner Heiligkeit, zu diesem Berg, den seine rechte Hand erworben hatte.“'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְבִיאֵם
  choice: So brachte er sie
  rationale: Das Hifil von בוא bedeutet „bringen“ beziehungsweise „kommen lassen“. „So“ gibt die fortlaufende poetische Erzählung natürlich wieder.
- source_word: אֶל גְּבוּל קָדְשׁוֹ
  choice: in sein heiliges Gebiet
  rationale: גְּבוּל kann sowohl Grenze als auch das dadurch bestimmte Gebiet bezeichnen. Im Zusammenhang ist das Gebiet als Ziel der Bewegung gemeint; „heilig“ gibt den Genitiv „seiner Heiligkeit“ idiomatisch wieder, ohne ihn unnötig auf ein Heiligtum einzuengen.
- source_word: הַר זֶה
  choice: auf diesen Berg
  rationale: הַר bezeichnet einen Berg oder ein Bergland, und זֶה weist ausdrücklich auf „diesen“ hin. Die Formulierung bleibt offen dafür, ob das Bergland oder ein bestimmter Berg, etwa Zion, im Blick ist.
- source_word: קָנְתָה
  choice: erworben hatte
  rationale: קנה kann „erwerben“, „kaufen“, „in Besitz nehmen“ und in bestimmten Zusammenhängen „erschaffen“ bedeuten. Hier bezeichnet es, was Gottes Macht für ihn gewonnen beziehungsweise in Besitz genommen hat, ohne zwingend einen Kauf auszudrücken.
- source_word: יְמִינוֹ
  choice: seine rechte Hand
  rationale: Die konkrete anthropomorphe Metapher für Gottes Macht und siegreiches Handeln wird beibehalten.
theological_decisions:
- issue: Bezug von „diesem Berg“
  choice: Die wörtliche Wendung „diesen Berg“ bleibt im Haupttext stehen.
  alternative: Zion; das Bergland Kanaans; das Israel verliehene Bergland
  rationale: Der Vers nennt den Berg nicht ausdrücklich. Der weitere Psalmzusammenhang lässt Bezüge sowohl zum Land als auch zu Zion zu; die Übersetzung entscheidet diese Spannung daher nicht vorzeitig.
- issue: Bedeutung von קנה
  choice: „erworben“
  alternative: gekauft; in Besitz genommen; geschaffen
  rationale: „Erworben“ bewahrt die semantische Breite, ohne einen geschäftlichen Kauf oder eine Aussage über Erschaffung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich kennzeichnet den zweiten Halbvers als erläuternde Apposition. Die Bildsprache von Gottes rechter Hand und die Mehrdeutigkeit von Gebiet/Grenze, Berg/Bergland und erwerben/in Besitz nehmen bleiben erhalten.
