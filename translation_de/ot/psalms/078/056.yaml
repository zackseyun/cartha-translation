  text: וַ/יְנַסּ֣וּ וַ֭/יַּמְרוּ אֶת אֱלֹהִ֣ים עֶלְי֑וֹן וְ֝/עֵדוֹתָ֗י/ו לֹ֣א שָׁמָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/056.yaml
  text: Yet they tested God Most High and rebelled[c][b][a], and they did not keep his testimonies.
translation:
  language: de
  text: Doch sie stellten Gott, den Höchsten, auf die Probe und widersetzten sich ihm; seine Weisungen[a] hielten sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Zeugnisse« oder »seine Satzungen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: sie stellten … auf die Probe
  rationale: נסה bezeichnet hier ein herausforderndes Prüfen Gottes. „Auf die Probe stellen“ ist im modernen Deutsch klar und bewahrt den anklagenden Sinn.
- source_word: וַיַּמְרוּ
  choice: sie widersetzten sich ihm
  rationale: מרה bezeichnet trotzigen Ungehorsam oder Auflehnung. „Sich widersetzen“ gibt die aktive Rebellion natürlich wieder; das Pronomen verdeutlicht das im Hebräischen gemeinsame Objekt.
- source_word: אֶת אֱלֹהִים עֶלְיוֹן
  choice: Gott, den Höchsten
  rationale: Die Wiedergabe bewahrt sowohl den Gottesnamen als auch den Hoheitstitel und funktioniert als direktes Objekt beider Verben.
- source_word: וְעֵדוֹתָיו
  choice: seine Weisungen
  rationale: עֵדוֹת bezeichnet hier Gottes verbindliche, bezeugende Bundesbestimmungen. „Weisungen“ ist verständlicher als das im heutigen Deutsch missverständliche „Zeugnisse“, ohne den rechtlich-bundestheologischen Gehalt auf bloße Befehle zu verengen.
- source_word: לֹא שָׁמָרוּ
  choice: hielten sie nicht
  rationale: שׁמר bedeutet bei göttlichen Weisungen „halten“ oder „befolgen“. „Halten“ bewahrt die etablierte Verbindung mit verbindlichen Geboten.
- source_word: וַ
  choice: Doch
  rationale: 'Das narrative Waw erhält im Zusammenhang einen adversativen Sinn: Trotz Gottes vorausgegangener Taten reagiert das Volk mit erneutem Ungehorsam.'
theological_decisions:
- issue: Wiedergabe des Gottestitels אֱלֹהִים עֶלְיוֹן
  choice: Gott, den Höchsten
  alternative: der höchste Gott
  rationale: Die appositionelle Form bewahrt die Eigenständigkeit des Titels „der Höchste“ und fügt keine über den hebräischen Text hinausgehende Lehrnuance hinzu.
- issue: Bundesrechtliche Bedeutung von עֵדוֹתָיו
  choice: seine Weisungen
  alternative: seine Zeugnisse / seine Satzungen
  rationale: „Weisungen“ vermittelt heutigen Lesern den verbindlichen Charakter. Eine Fußnote bewahrt die engere Wortbedeutung und die möglichen rechtlichen Wiedergaben.
- issue: Bezug von וַיַּמְרוּ auf Gott
  choice: widersetzten sich ihm
  alternative: waren widerspenstig
  rationale: Das ergänzte Pronomen macht im Deutschen deutlich, dass sich auch die Auflehnung gegen Gott richtet, ohne einen neuen Referenten einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt zunächst den Gegensatz und anschließend Gottes verbindliche Weisungen hervor. Das Semikolon bildet die zwei eng verbundenen Anklagen des hebräischen Verses ab.
