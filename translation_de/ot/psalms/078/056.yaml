  source_fidelity: Der Text gibt die beiden Verben וַיְנַסּוּ und וַיַּמְרוּ angemessen als herausforderndes Prüfen Gottes und Auflehnung gegen ihn wieder. Das im Deutschen bei „widersetzten sich“ erforderliche Pronomen nimmt den gemeinsamen Bezug auf „Gott, den Höchsten“ klar auf. Auch die abschließende Aussage über das Nicht-Halten seiner עֵדוֹת ist vollständig erhalten.
  naturalness: „Doch sie stellten Gott, den Höchsten, auf die Probe und widersetzten sich ihm; seine Weisungen hielten sie nicht“ ist modernes, würdiges und gut verständliches Standarddeutsch. Die Umstellung im zweiten Teilsatz ist leicht gehoben, aber für einen Psalm natürlich und klar.
  terminology: „Gott, den Höchsten“ gibt den Titel אֱלֹהִים עֶלְיוֹן ohne zusätzliche Deutung wieder. „Weisungen“ ist als verständliche kontextuelle Wiedergabe von עֵדוֹת vertretbar; die Fußnote sichert mit „Zeugnisse“ und „Satzungen“ die engeren lexikalischen Alternativen ab.
