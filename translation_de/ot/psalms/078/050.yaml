  terminology: „Zorn“, „Tod“, „Leben“ und „ausliefern“ sind semantisch und im Register stimmig. „Pest“ ist etwas spezifischer als „Seuche“, bleibt aber im biblisch-poetischen Gebrauch eine etablierte und sachlich vertretbare Wiedergabe von דֶּבֶר. Die Fußnote zu „bahnte“ bietet eine sinnvolle lexikalische Alternative.
