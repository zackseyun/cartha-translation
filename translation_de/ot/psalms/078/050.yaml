  variant: modern standard German
source:
  edition: WLC
  text: יְפַלֵּ֥ס נָתִ֗יב לְ/אַ֫פּ֥/וֹ לֹא חָשַׂ֣ךְ מִ/מָּ֣וֶת נַפְשָׁ֑/ם וְ֝/חַיָּתָ֗/ם לַ/דֶּ֥בֶר הִסְגִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/050.yaml
  text: He leveled a path for his anger[a]; he did not spare their soul from death[c][b], but gave over their life to the plague.
translation:
  language: de
  text: Er bahnte seinem Zorn einen Weg[a]; er bewahrte ihr Leben nicht vor dem Tod, sondern lieferte ihr Leben der Pest aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er ebnete seinem Zorn einen Pfad.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַלֵּס
  choice: bahnte
  rationale: Der Piel von פלס bezeichnet hier das Bereiten beziehungsweise Ebnen eines Weges. „Bahnte“ bewahrt das konkrete Wegbild und klingt im Deutschen natürlich.
- source_word: נָתִיב
  choice: einen Weg
  rationale: נָתִיב bezeichnet einen Pfad oder Weg. „Weg“ verbindet sich idiomatisch mit „bahnen“ und erhält die Metapher.
- source_word: לְאַפּוֹ
  choice: seinem Zorn
  rationale: אַף bedeutet wörtlich „Nase“, bezeichnet idiomatisch jedoch Zorn. „Zorn“ entspricht dem gehobenen poetischen Kontext, ohne die Anthropomorphie unnötig zu verstärken.
- source_word: לֹא חָשַׂךְ
  choice: er bewahrte … nicht
  rationale: חשׂך kann „zurückhalten, verschonen, bewahren“ bedeuten. Mit מִמָּוֶת gibt „nicht vor dem Tod bewahren“ die separative Konstruktion klar und natürlich wieder.
- source_word: מִמָּוֶת
  choice: vor dem Tod
  rationale: 'Die Präposition מן ist hier separativ: Das Leben wurde nicht vom Tod ferngehalten beziehungsweise davor bewahrt.'
- source_word: נַפְשָׁם
  choice: ihr Leben
  rationale: נֶפֶשׁ bezeichnet in diesem Zusammenhang das sterbliche Leben, nicht eigens eine vom Körper getrennte Seele.
- source_word: וְחַיָּתָם
  choice: sondern … ihr Leben
  rationale: חַיָּה bezeichnet hier parallel zu נֶפֶשׁ das Leben beziehungsweise die lebendige Existenz. Die Wiederholung von „ihr Leben“ ist im Deutschen klar und bildet den Parallelismus ab.
- source_word: לַדֶּבֶר
  choice: der Pest
  rationale: דֶּבֶר bezeichnet besonders in Gerichtstexten eine tödliche Seuche oder Pest. „Pest“ ist prägnant und traditionsnah; die weitere Möglichkeit „Seuche“ wird in der Fußnote genannt.
- source_word: הִסְגִּיר
  choice: lieferte … aus
  rationale: Der Hiphil von סגר kann „ausliefern, übergeben“ bedeuten. „Der Pest ausliefern“ bringt die aktive Preisgabe an das Gericht idiomatisch zum Ausdruck.
- source_word: וְ
  choice: sondern
  rationale: Obwohl וְ formal „und“ bedeutet, steht der zweite Halbvers nach der Verneinung in erläuternd-kontrastierender Beziehung. „Sondern“ macht diese im Deutschen natürlich sichtbar, ohne den Sinn zu erweitern.
theological_decisions:
- issue: Bildhafte Darstellung des göttlichen Zorns
  choice: Die Wegmetapher bleibt als „seinem Zorn einen Weg bahnen“ erhalten.
  alternative: „Er ließ seinem Zorn freien Lauf.“
  rationale: Der hebräische Text stellt den Zorn bildhaft als etwas dar, dem ein Weg bereitet wird. Eine abstrakte Umschreibung würde die poetische Spannung abschwächen.
- issue: Bedeutung von נֶפֶשׁ
  choice: „Leben“
  alternative: „Seele“
  rationale: Im Zusammenhang mit Tod und Pest geht es um das leiblich-sterbliche Leben. „Seele“ könnte eine ontologische Aussage nahelegen, die der Vers nicht verlangt.
- issue: Göttliches Handeln im Gericht
  choice: „lieferte ihr Leben der Pest aus“
  alternative: „ließ ihr Leben an der Pest zugrunde gehen“
  rationale: Die aktive Form des Hiphil wird beibehalten. Dadurch wird die im Text ausgesagte Verantwortlichkeit nicht abgeschwächt oder theologisch umgedeutet.
translation_notes:
  register: Moderne, würdige Psalmenprosa mit bewahrter poetischer Wegmetapher. „Pest“ ist bewusst prägnant und biblisch-poetisch; „Leben“ vermeidet eine missverständliche dualistische Lesart von נֶפֶשׁ. Der einzige Fußnotenmarker [a] steht im Haupttext.
