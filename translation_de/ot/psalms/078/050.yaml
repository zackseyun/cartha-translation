  source_fidelity: 'Die Übersetzung gibt die beiden hebräischen Kola präzise wieder: יְפַלֵּס נָתִיב ist treffend als „bahnte ... einen Weg“, לְאַפּוֹ als „seinem Zorn“, und die aktive Preisgabe durch הִסְגִּיר bleibt in „lieferte ... aus“ erhalten. „ihr Leben“ entspricht in diesem Kontext sowohl נַפְשָׁם als auch dem parallelen וְחַיָּתָם als kollektivem Ausdruck für das sterbliche Leben. „Pest“ ist für דֶּבֶר als gerichtliche Seuche vertretbar.'
