  source_fidelity: 'Die Übersetzung gibt die beiden Hifil-Verben treffend und unterschieden wieder: וַיַּכְעִיסוּהוּ als „reizten ihn zum Zorn“ und יַקְנִיאוּהוּ als „machten ihn ... eifersüchtig“. בָּמוֹת ist mit dem etablierten kultischen Terminus „Höhen“ wiedergegeben; „Schnitzbilder“ bewahrt bei פְּסִילִים den konkreten Charakter geschnitzter beziehungsweise gehauener Kultbilder. Die instrumentale Funktion der Präpositionen wird angemessen ausgedrückt.'
  naturalness: Der Satz ist klares, modernes Standarddeutsch und wahrt den knappen poetischen Parallelismus. „Sie reizten ihn zum Zorn“ sowie „machten ihn ... eifersüchtig“ sind idiomatisch. Die Variation „durch ihre Höhen“ / „mit ihren Schnitzbildern“ ist sprachlich möglich und vermittelt die jeweiligen kultischen Mittel bzw. Anlässe verständlich.
  terminology: „Höhen“ ist im bibeldeutschen Register die passende Standardbezeichnung für lokale Kultstätten und wird sinnvoll erläutert. „Schnitzbilder“ ist eine präzise, verständliche Wiedergabe von פְּסִילִים. Die Beibehaltung von „eifersüchtig“ respektiert die ausdrückliche Sprache von קנא, ohne sie zu einer dogmatischen Umschreibung aufzulösen.
