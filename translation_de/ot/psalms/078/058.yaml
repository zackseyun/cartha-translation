  text: וַ/יַּכְעִיס֥וּ/הוּ בְּ/בָמוֹתָ֑/ם וּ֝/בִ/פְסִילֵי/הֶ֗ם יַקְנִיאֽוּ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/058.yaml
  text: They provoked him to anger with their high places[c][b][a], and with their carved images they made him jealous.
translation:
  language: de
  text: Sie reizten ihn zum Zorn durch ihre Höhen[a] und machten ihn mit ihren Schnitzbildern eifersüchtig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Höhen“ waren örtliche Kultstätten, die häufig mit unerlaubter Verehrung und Götzendienst verbunden waren.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכְעִיסוּהוּ
  choice: Sie reizten ihn zum Zorn
  rationale: Die Hifil-Form von כעס bezeichnet das Verursachen oder Hervorrufen von Zorn. Die Wiedergabe bewahrt die kausative Bedeutung und klingt zugleich natürlich.
- source_word: בְּבָמוֹתָם
  choice: durch ihre Höhen
  rationale: במות bezeichnet hier örtliche Kultstätten, die mit unerlaubter Gottesverehrung und Götzendienst verbunden waren. „Höhen“ ist die etablierte knappe Wiedergabe; die Präposition ב wird instrumental als „durch“ verstanden.
- source_word: וּבִפְסִילֵיהֶם
  choice: mit ihren Schnitzbildern
  rationale: פסילים sind behauene oder geschnitzte Kultbilder. „Schnitzbilder“ erhält den konkreten Sinn hergestellter Bildwerke deutlicher als das allgemeinere „Götzen“.
- source_word: יַקְנִיאוּהוּ
  choice: machten ihn eifersüchtig
  rationale: Das Hifil von קנא bedeutet „eifersüchtig machen“ beziehungsweise „zur Eifersucht reizen“. Die Formulierung wahrt die relationale, bundestheologische Aussage des hebräischen Textes.
theological_decisions:
- issue: Göttliche Eifersucht
  choice: machten ihn eifersüchtig
  alternative: reizten ihn zur Eifersucht; entfachten seinen Eifer
  rationale: קנא benennt bei Gott seine Eifersucht beziehungsweise seinen Eifer angesichts fremder Verehrung. Die direkte Wiedergabe bewahrt die theologische Spannung, statt sie auf bloßen Zorn abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die Unterscheidung zwischen Zorn (כעס) und Eifersucht (קנא) bleiben erhalten. Das heute erklärungsbedürftige „Höhen“ wird durch eine Fußnote erläutert.
