lexical_decisions:
- source_word: אֶפְתְּחָה
  choice: Ich will … öffnen
  rationale: Die erste Person Singular im Qal hat hier einen volitiven beziehungsweise futurischen Sinn; „Ich will“ passt zum poetischen Parallelismus.
- source_word: בְמָשָׁל
  choice: zu einem Gleichnis
  rationale: מָשָׁל kann Gleichnis, Sprichwort oder bildhafte Rede bezeichnen. „Zu einem Gleichnis“ bewahrt die konkrete Wendung „den Mund öffnen“ und lässt den literarisch-bildhaften Charakter erkennen.
- source_word: פִּי
  choice: meinen Mund
  rationale: Die konkrete hebräische Ausdrucksweise ist auch im Deutschen verständlich und sollte nicht zu „meine Rede“ abstrahiert werden.
- source_word: אַבִּיעָה
  choice: ich will … hervorbringen
  rationale: Das Hifil von נבע bezeichnet ursprünglich ein Hervorquellenlassen und übertragen das Äußern. „Hervorbringen“ lässt etwas von diesem Bild erkennen, ohne im Deutschen unnatürlich zu wirken.
- source_word: חִידוֹת
  choice: Rätsel
  rationale: חִידָה bezeichnet ein Rätsel oder eine rätselhafte, schwer verständliche Aussage. „Rätsel“ ist die direkte und verständliche Entsprechung.
- source_word: מִנִּי קֶדֶם
  choice: aus alter Zeit
  rationale: Die Wendung verweist auf weit zurückliegende Zeiten, ohne zwingend den absoluten Anfang zu meinen. „Aus alter Zeit“ ist natürlich und wahrt diese Offenheit.
theological_decisions:
- issue: Verhältnis zu Matthäus 13,35 und Bedeutung von מָשָׁל / חִידוֹת
  choice: Der hebräische Vers wird eigenständig mit „Gleichnis“ und „Rätsel“ wiedergegeben.
  alternative: „Ich will in Gleichnissen reden; ich will Verborgenes aus alter Zeit verkünden.“
  rationale: Die neutestamentliche Anführung ist intertextuell bedeutsam, darf aber die Bedeutung des hebräischen Wortlauts nicht rückwirkend auf „Verborgenes“ verengen. Die im Hebräischen vorhandene Spannung zwischen bildhafter Lehre und rätselhafter Rede bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Parallelstruktur. Die konkrete Wendung „meinen Mund öffnen“ bleibt stehen; seltene oder mehrdeutige Begriffe werden knapp in Fußnoten erläutert.
