  text: וַ/יִּשְׁכְּח֥וּ עֲלִילוֹתָ֑י/ו וְ֝/נִפְלְאוֹתָ֗י/ו אֲשֶׁ֣ר הֶרְאָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/011.yaml
  text: They forgot his deeds[b][a], and his wonders that he had shown them.
translation:
  language: de
  text: Sie vergaßen seine Taten[a] und seine Wunder[b], die er ihnen gezeigt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Werke“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine wunderbaren Taten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: Sie vergaßen
  rationale: Das Qal-Wayyiqtol, 3. Person Plural, erzählt eine vergangene Handlung in der Abfolge. „Sie vergaßen“ gibt den schlichten erzählerischen Sinn wieder; „sie missachteten“ wäre zu deutend.
- source_word: עֲלִילוֹתָיו
  choice: seine Taten
  rationale: עֲלִילוֹת bezeichnet Handlungen oder Taten. „Taten“ ist im modernen Deutschen natürlich und umfasst Gottes geschichtliches Handeln, ohne eine zusätzliche Wertung einzutragen.
- source_word: וְנִפְלְאוֹתָיו
  choice: und seine Wunder
  rationale: Das von פלא abgeleitete Wort bezeichnet außergewöhnliche, staunenerregende Taten. „Wunder“ bewahrt diese Bedeutung und ist nicht zwingend auf eine bestimmte Art übernatürlichen Geschehens verengt.
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen leitet den auf „Wunder“ bezogenen Relativsatz ein; wegen des Plurals lautet die natürliche deutsche Entsprechung „die“.
- source_word: הֶרְאָם
  choice: er ihnen gezeigt hatte
  rationale: Das Hifil Perfekt, 3. Person Singular, mit Suffix der 3. Person Plural bedeutet wörtlich „er ließ sie sehen“, idiomatisch „er zeigte ihnen“. Das Plusquamperfekt verdeutlicht natürlich, dass das Zeigen dem Vergessen vorausging.
theological_decisions:
- issue: Bezug der pronominalen Suffixe
  choice: 'Die Suffixe beziehen sich auf Gott: „seine Taten … seine Wunder“.'
  alternative: Eine ausdrückliche Nennung wie „Gottes Taten“ wäre möglich, würde jedoch den im Hebräischen stehenden pronominalen Bezug ausdeuten.
  rationale: Im Zusammenhang des Psalms geht es um das Handeln des HERRN und Israels Versäumnis, sich daran zu erinnern. Die Wiedergabe mit Possessivpronomen bewahrt den Wortlaut und den theologischen Gegensatz, ohne zusätzliche Auslegung einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und nahe am hebräischen Parallelismus. Beide Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Begriffen.
