  text: אֲשֶׁר שָׂ֣ם בְּ֭/מִצְרַיִם אֹֽתוֹתָ֑י/ו וּ֝/מוֹפְתָ֗י/ו בִּ/שְׂדֵה צֹֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/043.yaml
  text: when he set his signs in Egypt[a], and his wonders in the fields of Zoan.
translation:
  language: de
  text: als er seine Zeichen in Ägypten setzte und seine Wunder im Gebiet von Zoan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zoan war eine ägyptische Stadt und wird häufig mit Tanis gleichgesetzt.
