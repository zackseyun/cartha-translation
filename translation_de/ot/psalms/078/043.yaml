lexical_decisions:
- source_word: אֲשֶׁר
  choice: als
  rationale: Das Relativwort knüpft an das Erinnern an Gottes Taten in den Versen 42–43 an und lässt sich im Deutschen hier natürlich temporal mit „als“ wiedergeben.
- source_word: שָׂם
  choice: vollbrachte
  rationale: Wörtlich bedeutet das Verb „setzen, stellen“. In Verbindung mit Zeichen ist „vollbrachte“ im heutigen Deutsch idiomatisch; es beschreibt deren Wirksamwerden, ohne sie allgemein als bloße Darbietung zu fassen.
- source_word: בְּמִצְרַיִם
  choice: in Ägypten
  rationale: Die Präposition bezeichnet hier den Ort. „Gegen Ägypten“ würde eine nicht ausdrücklich markierte adversative Bedeutung eintragen.
- source_word: אֹתוֹתָיו
  choice: seine Zeichen
  rationale: „Zeichen“ bewahrt die Bedeutung von אוֹת und unterscheidet den Ausdruck vom folgenden „Wunder“.
- source_word: וּמוֹפְתָיו
  choice: und seine Wunder
  rationale: מוֹפֵת bezeichnet ein Wunderzeichen oder außergewöhnliches Machterweis. „Wunder“ ist verständlich und erhält zusammen mit „Zeichen“ die traditionelle, sachlich passende Wortpaarung.
- source_word: בִּשְׂדֵה
  choice: im Gebiet von
  rationale: Der Singular „Feld“ bezeichnet mit dem Ortsnamen das offene Land beziehungsweise Umland. „Im Gebiet von“ gibt diesen räumlichen Sinn im Deutschen natürlich wieder.
- source_word: צֹעַן
  choice: Zoan
  rationale: Der hebräische Ortsname wird transliteriert; die häufige Identifizierung mit Tanis gehört in eine Sachfußnote.
theological_decisions: []
