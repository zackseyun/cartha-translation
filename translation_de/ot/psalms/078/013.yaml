  to: Er spaltete[a] das Meer und ließ sie hindurchziehen[b]; er ließ die Wasser wie einen Haufen stehen.[c]
  rationale: Die Änderung ersetzt die interpretierende Wiedergabe „Damm“ durch „Haufen“, die das hebräische נֵד und das konkrete poetische Bild direkt wahrt. Die Pluralform „die Wasser“ unterstützt dabei die bildhafte Darstellung der aufgestauten Wassermassen. Die Kausativnuancen und die übrige Satzstruktur bleiben erhalten.
