  text: בָּ֣קַע יָ֭ם וַ/יַּֽעֲבִירֵ֑/ם וַֽ/יַּצֶּב מַ֥יִם כְּמוֹ נֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/013.yaml
  text: He split the sea and made them pass through[c][b][a]; he made the waters stand like a heap.
translation:
  language: de
  text: Er spaltete[a] das Meer und ließ sie hindurchziehen[b]; er ließ die Wasser wie einen Haufen stehen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „teilte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „brachte sie hinüber“.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: „wie einen Haufen“; gemeint ist eine aufgetürmte Masse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַע
  choice: spaltete
  rationale: Das Verb bezeichnet ein Aufspalten oder Aufreißen. „Spaltete“ gibt das kraftvolle Bild präzise und in natürlichem modernem Deutsch wieder.
- source_word: יָם
  choice: das Meer
  rationale: Obwohl das hebräische Substantiv hier keinen Artikel trägt, ist im Zusammenhang eindeutig das Meer des Auszugs gemeint. Der Text selbst nennt es nicht ausdrücklich „Rotes Meer“.
- source_word: וַיַּעֲבִירֵם
  choice: ließ sie hindurchziehen
  rationale: Die Kausativform von עבר besagt, dass Gott sie hindurchziehen ließ. Die Formulierung bewahrt diese Verursachungsbedeutung und klingt zugleich natürlich.
- source_word: וַיַּצֶּב
  choice: ließ ... dastehen
  rationale: Das Verb bezeichnet das feste Aufstellen beziehungsweise Stehenlassen. „Ließ ... dastehen“ bewahrt die kausative Aussage.
- source_word: מַיִם
  choice: das Wasser
  rationale: Hebräisch מַיִם ist formal pluralisch, wird im modernen Deutschen jedoch idiomatisch als kollektives „Wasser“ wiedergegeben.
- source_word: כְּמוֹ
  choice: wie
  rationale: Die einfache Vergleichspartikel wird unmittelbar mit „wie“ wiedergegeben.
- source_word: נֵד
  choice: Damm
  rationale: Das Wort bezeichnet eine aufgehäufte oder aufgetürmte Masse. „Damm“ vermittelt im Deutschen anschaulich das Bild des aufgestauten Wassers; eine Fußnote hält die wörtlichere Bildsprache offen.
theological_decisions:
- issue: Bildhafte Darstellung des Meerwunders
  choice: Das konkrete Bild vom aufgespaltenen Meer und dem wie ein Damm dastehenden Wasser bleibt erhalten, ohne den Vorgang zu erklären.
  alternative: Die Aussage als poetische Überhöhung zu deuten oder lediglich mit „hielt das Wasser zurück“ wiederzugeben.
  rationale: Der Vers schildert Gottes Handeln in konkreter, dichterischer Exodus-Sprache. Die Übersetzung wahrt diese Aussage und legt weder den physikalischen Vorgang noch die Frage nach der Gattung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Satzstruktur. „Damm“ vermeidet das im Deutschen unnatürliche Bild eines „Haufens Wasser“, während die Fußnote die hebräische Metapher transparent macht.
