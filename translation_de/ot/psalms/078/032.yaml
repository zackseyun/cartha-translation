source:
  edition: WLC
  text: בְּ/כָל זֹ֭את חָֽטְאוּ ע֑וֹד וְ/לֹֽא הֶ֝אֱמִ֗ינוּ בְּ/נִפְלְאוֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/032.yaml
  text: In spite of all this[a], they still sinned and did not believe in his wondrous works.
translation:
  language: de
  text: Trotz alledem sündigten sie weiter und glaubten nicht an seine Wundertaten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „vertrauten nicht auf seine Wundertaten“ oder „glaubten seinen Wundertaten nicht“. Das hebräische Verb kann sowohl Glauben als auch Vertrauen bezeichnen; auch die Präposition lässt hier unterschiedliche Wiedergaben zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל זֹאת
  choice: Trotz alledem
  rationale: 'Die Verbindung ist hier konzessiv: Ungeachtet der zuvor geschilderten Gerichte und Fürsorge sündigte das Volk weiter. „Trotz alledem“ gibt diesen idiomatischen Sinn natürlich und prägnant wieder.'
- source_word: חָטְאוּ עוֹד
  choice: sündigten sie weiter
  rationale: חטא bezeichnet schlicht das Sündigen; עוֹד hebt dessen Fortdauer trotz des Vorangegangenen hervor. „Weiter“ gibt diese beharrliche Fortsetzung im Deutschen idiomatisch wieder.
- source_word: וְ/לֹא הֶאֱמִינוּ
  choice: und glaubten nicht
  rationale: Die einfache Beiordnung mit וְ wird durch „und“ bewahrt. Das Hifil von אמן kann sowohl „glauben“ als auch „vertrauen“ bedeuten; „glaubten nicht“ passt zum Zusammenhang der sichtbar erwiesenen Taten Gottes, ohne die Vertrauensnuance auszuschließen.
- source_word: בְּ/נִפְלְאוֹתָיו
  choice: an seine Wundertaten
  rationale: נִפְלָאוֹת meint außergewöhnliche, staunenerregende Taten Gottes. „Wundertaten“ ist gegenwärtiges, würdiges Deutsch und bezeichnet konkrete göttliche Handlungen; das Suffix der 3. Person Singular wird mit „seine“ wiedergegeben.
theological_decisions:
- issue: Art des Versagens Israels angesichts der Taten Gottes
  choice: glaubten nicht an seine Wundertaten
  alternative: vertrauten nicht auf seine Wundertaten / glaubten seinen Wundertaten nicht
  rationale: Die Formulierung bewahrt die Aussage, dass das Volk trotz Gottes erwiesener Machttaten nicht glaubte. Die mögliche Vertrauensnuance von אמן und die gewisse Bandbreite der Präposition ב werden in der Fußnote kenntlich gemacht, ohne den Text dogmatisch enger festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Psalmton. „Trotz alledem“ und „sündigten sie weiter“ bringen die konzessive Aussage und das beharrliche Fortfahren natürlich zum Ausdruck; die echte Bedeutungsbreite von אמן mit ב bleibt durch die Fußnote erhalten.
