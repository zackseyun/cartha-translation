  terminology: „in Blut“ ist die passende deutsche Konstruktion zu „verwandeln“. Die Fußnote zu „Nilarme“ wahrt die lexikalische Breite von יְאֹר; die Alternative „Wasserläufe“ zu נֹזְלִים ist sachgerecht. Die Fußnotenmarker sind korrekt am jeweils erläuterten Ausdruck angebracht.
