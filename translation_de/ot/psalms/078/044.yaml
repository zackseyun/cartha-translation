  text: וַ/יַּהֲפֹ֣ךְ לְ֭/דָם יְאֹרֵי/הֶ֑ם וְ֝/נֹזְלֵי/הֶ֗ם בַּל יִשְׁתָּיֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/044.yaml
  text: He turned their rivers to blood[a], and their flowing streams[c][b], so that they could not drink.
translation:
  language: de
  text: Er verwandelte ihre Nilarme in Blut[a], sodass sie aus ihren fließenden Gewässern[b] nicht trinken konnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Ströme“. Das hebräische Wort bezeichnet in ägyptischem Zusammenhang häufig den Nil oder seine Kanäle.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Wasserläufe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: Er verwandelte
  rationale: Das Verb הפך bezeichnet hier die Veränderung in einen anderen Zustand; „verwandelte“ gibt den resultativen Sinn im Deutschen natürlich wieder.
- source_word: לְדָם
  choice: in Blut
  rationale: Die Präposition לְ kennzeichnet den entstandenen Zustand; nach „verwandeln“ ist „in Blut“ die idiomatische deutsche Fügung.
- source_word: יְאֹרֵיהֶם
  choice: ihre Nilarme
  rationale: יְאֹר bezeichnet in ägyptischem Zusammenhang besonders den Nil und seine Kanäle oder Arme. „Nilarme“ bewahrt diesen historischen Bezug, ohne nur den Hauptstrom anzunehmen.
- source_word: וְנֹזְלֵיהֶם
  choice: aus ihren fließenden Gewässern
  rationale: Die vom Verb נזל („fließen“) abgeleitete Form bezeichnet fließende Wasser beziehungsweise Wasserläufe. „Fließende Gewässer“ erhält das Bewegungsbild und funktioniert mit dem im Deutschen bei „trinken“ erforderlichen „aus“.
- source_word: בַּל יִשְׁתָּיוּן
  choice: sodass sie … nicht trinken konnten
  rationale: 'Die poetische Negation בַּל mit dem Imperfekt bezeichnet hier die Folge beziehungsweise praktische Unmöglichkeit: Das Wasser war nicht trinkbar.'
