  source_fidelity: 'Der Text gibt die zwei hebräischen Glieder zutreffend wieder: Gott verwandelte die Wasserläufe in Blut, mit der Folge, dass die Betroffenen nicht daraus trinken konnten. „sodass“ gibt die resultative Funktion von בַּל mit Imperfekt hier angemessen wieder. „Nilarme“ ist im ägyptischen Plagenkontext als mögliche Konkretisierung von יְאֹר vertretbar, ohne den Text auf den Hauptstrom des Nil einzuengen.'
