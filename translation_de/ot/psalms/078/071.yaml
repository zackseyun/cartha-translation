  text: from following the nursing ewes he brought him[a], to shepherd Jacob his people[b], and Israel his inheritance.
translation:
  language: de
  text: Von den säugenden Mutterschafen führte er ihn herbei[a], um Jakob, sein Volk, und Israel, sein Erbteil[b], zu hüten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Von hinter den säugenden Mutterschafen brachte er ihn.“ Auch möglich: „von den Mutterschafen mit Jungen“.'
    reason: Die Fußnote bewahrt die räumliche beziehungsweise dem Folgen der Herde entsprechende Nuance von מֵאַחַר sowie die Grundbedeutung „brachte“ von הֱבִיאוֹ.
  - marker: b
    text: 'Oder: „sein Erbe“; auch: „sein Besitz“.'
    reason: נַחֲלָה kann „Erbteil“, „Erbe“ oder „Besitz“ bezeichnen; die Alternativen bleiben ohne zusätzliche Deutung lexikalisch nah.
lexical_decisions:
- source_word: מֵאַחַר עָלוֹת
  choice: Von den säugenden Mutterschafen … weg
  rationale: מֵאַחַר bezeichnet die Stellung hinter beziehungsweise das Folgen der Herde; zusammen mit עָלוֹת sind säugende Mutterschafe gemeint. Die deutsche Wendung gibt sowohl den Ausgangspunkt als auch das konkrete Hirtenmilieu natürlich wieder.
- source_word: הֱבִיאוֹ
  choice: holte er ihn
  rationale: Der Hifil von בוא bedeutet grundsätzlich „bringen“. Im Deutschen drückt „holte … weg“ in Verbindung mit מֵאַחַר idiomatisch aus, dass Gott David von der Herde wegnahm und zu seiner neuen Aufgabe brachte.
- source_word: לִרְעוֹת
  choice: damit er … weidete
  rationale: רעה bezeichnet das Weiden beziehungsweise Hüten als Hirte. „weidete“ bewahrt die königlich-pastorale Metapher und die Verbindung zwischen Davids früherer und späterer Aufgabe.
- source_word: בְּיַעֲקֹב עַמּוֹ
  choice: Jakob, sein Volk
  rationale: Die Präposition ב markiert hier den Bereich beziehungsweise Gegenstand des Hirtendienstes. Die Apposition „sein Volk“ macht die Beziehung im Deutschen klar und wahrt den poetischen Parallelismus.
- source_word: וּבְיִשְׂרָאֵל נַחֲלָתוֹ
  choice: und Israel, sein Erbteil
  rationale: נַחֲלָה bezeichnet Erbteil, Erbbesitz oder angestammten Besitz. „Erbteil“ ist im Deutschen prägnant und erhält den bundesgeschichtlichen Klang, ohne ihn auszudeuten.
theological_decisions:
- issue: Königlich-pastorale Metapher für Davids Berufung
  choice: Die Hirtenbildsprache wird mit „weidete“ ausdrücklich beibehalten.
  alternative: „damit er Jakob, sein Volk, führte“ oder „für … sorgte“
  rationale: Der Vers setzt Davids tatsächliche Arbeit bei den Schafen bewusst mit seiner Aufgabe für Israel in Beziehung. Eine allgemeine Wiedergabe wie „führen“ würde diese literarische und theologische Verbindung abschwächen.
- issue: Israel als Gottes נַחֲלָה
  choice: „sein Erbteil“
  alternative: „sein Erbbesitz“ oder „sein Eigentum“
  rationale: „Erbteil“ bewahrt die eigentümliche Spannung der Aussage, dass Israel Gottes Anteil ist, ohne die Metapher durch eine erklärende Besitzformulierung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Parallelstruktur. „Mutterschafe“ verdeutlicht das im Hebräischen vorausgesetzte weibliche Tier; „säugend“ bewahrt die spezifische Bedeutung von עָלוֹת. Die Zeichensetzung kennzeichnet „sein Volk“ und „sein Erbteil“ als Appositionen.
