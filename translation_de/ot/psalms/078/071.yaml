    rationale: Das Verb ist bei menschlichen Objekten im heutigen Deutsch unnatürlich und kann den Sinn verfremden. „hüten“ erhält die explizite Hirtenmetapher und ist hier idiomatisch.
  - severity: low
    issue: „holte er ihn weg“ für הֱבִיאוֹ
    rationale: Die Formulierung betont das Wegnehmen, während der Hifil von בוא primär „bringen“ bzw. „führen“ bedeutet. „führte er ihn herbei“ gibt die Verbvalenz genauer wieder.
  - severity: low
    issue: Fußnotenalternative „angestammter Besitz“
    rationale: Diese Formulierung ergänzt eine historische bzw. rechtliche Nuance, die das hebräische Wort hier nicht ausdrücklich verlangt. Neutralere Alternativen sind „Erbe“ und „Besitz“.
