  verdict: revise
  source_fidelity: Die zweite Vershälfte gibt die Aufgabe Davids und die parallelen Bezeichnungen für Gottes Volk grundsätzlich zutreffend wieder. In der ersten Vershälfte schwächt „holte ... weg“ jedoch das kausative הֱבִיאוֹ („brachte/führte ihn“) ab. Die räumlich-pastorale Nuance von מֵאַחַר kann im Deutschen nicht völlig idiomatisch im Haupttext abgebildet werden, soll aber durch eine präzisere Fußnote gesichert werden.
  naturalness: '„damit er Jakob ... weidete“ ist im modernen Standarddeutsch nicht idiomatisch: Menschen werden nicht „geweidet“. „zu hüten“ ist die natürliche deutsche Wiedergabe der Hirtenmetapher und bewahrt deren Bezug zu Davids vorausgehendem Dienst bei den Schafen. Der Zweckinfinitiv ist zudem näher am hebräischen לִרְעוֹת als ein Finalsatz mit Imperfekt.'
  terminology: „Mutterschafe“ gibt עָלוֹת sachgerecht wieder; „säugende Mutterschafe“ ist verständlich, wenn auch stilistisch etwas redundant. „Erbteil“ ist eine tragfähige Wiedergabe von נַחֲלָתוֹ. Die Alternative „angestammter Besitz“ ist unnötig interpretierend und sollte nicht als lexikalische Fußnotenalternative stehen.
  issues:
