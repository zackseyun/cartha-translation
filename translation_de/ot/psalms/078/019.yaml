source:
  edition: WLC
  text: וַֽ/יְדַבְּר֗וּ בֵּֽ/אלֹ֫הִ֥ים אָ֭מְרוּ הֲ/י֣וּכַל אֵ֑ל לַ/עֲרֹ֥ךְ שֻׁ֝לְחָ֗ן בַּ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/019.yaml
  text: They spoke against God; they said[a], “Can God prepare a table in the wilderness?”
translation:
  language: de
  text: 'Sie redeten gegen Gott und sagten[a]: »Kann Gott in der Wüste einen Tisch bereiten?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie redeten über Gott und sagten«. Die hebräische Formulierung kann auch neutraler verstanden werden; im Zusammenhang liegt jedoch die Bedeutung »gegen Gott reden« näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: Sie redeten
  rationale: Die narrative Verbform von דבר bezeichnet hier schlicht das Reden; »redeten« ist im Deutschen natürlich und fügt keinen zusätzlichen Nachdruck ein.
- source_word: בֵּאלֹהִים
  choice: gegen Gott
  rationale: Die Präposition ב kann in Verbindung mit דבר kontextbedingt eine feindselige Bedeutung haben. Die herausfordernde Frage und der Zusammenhang von Israels Auflehnung sprechen hier für »gegen Gott«.
- source_word: אָמְרוּ
  choice: und sagten
  rationale: Das ausdrückliche Redeeinleitungsverb bewahrt die zweigliedrige hebräische Formulierung und führt natürlich zur direkten Rede.
- source_word: הֲיוּכַל
  choice: Kann
  rationale: Die Fragepartikel mit יכל fragt nach Fähigkeit oder Vermögen; »Kann« gibt die provokante Frage knapp und idiomatisch wieder.
- source_word: אֵל
  choice: Gott
  rationale: אֵל bezeichnet hier parallel zu אֱלֹהִים Gott. »Der Mächtige« würde den möglichen Bedeutungsakzent stärker auslegen, als es der Text verlangt.
- source_word: לַעֲרֹךְ
  choice: bereiten
  rationale: ערך mit שֻׁלְחָן bedeutet, einen Tisch herzurichten beziehungsweise zu bereiten. Die traditionelle, weiterhin verständliche Wendung »einen Tisch bereiten« bewahrt Bild und Versorgungssinn.
- source_word: שֻׁלְחָן
  choice: einen Tisch
  rationale: Die konkrete Bildsprache des hebräischen Wortes bleibt erhalten; eine Wiedergabe als »Mahlzeit« wäre bereits erklärend.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet die unwirtliche Wildnis der Wanderungszeit. »Wüste« ist im modernen Standarddeutsch die natürliche biblische Bezeichnung und muss nicht ausschließlich Sandwüste bedeuten.
theological_decisions:
- issue: Ton von Israels Rede über Gott
  choice: »gegen Gott« als Ausdruck feindseliger und auflehnender Rede
  alternative: »über Gott« als neutralere Wiedergabe
  rationale: Der Psalm schildert Israels Unglauben und Aufbegehren; die folgende Frage bestreitet herausfordernd Gottes Vermögen. Zugleich wird die grammatisch mögliche neutralere Deutung in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die geläufige Wendung »einen Tisch bereiten« erhält das konkrete biblische Bild. Die sachliche Mehrdeutigkeit der Präposition wird nicht im Haupttext geglättet, sondern durch eine Fußnote transparent gemacht.
