translation:
  language: de
  text: Er schlug seine Feinde zurück[a] und überzog sie mit dauernder Schande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er schlug seine Feinde in den Rücken.“ Das hebräische אָחוֹר kann die Richtung („zurück“) oder die getroffene Stelle („in den Rücken“) bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Er schlug
  rationale: Die Form von נכה bezeichnet in der fortlaufenden Erzählung eine vergangene Handlung. „Schlug“ ist gegenwärtiges, würdevolles Deutsch und legt nicht eigens fest, dass die Feinde getötet wurden.
- source_word: צָרָיו
  choice: seine Feinde
  rationale: צָרָיו bezeichnet seine Gegner bzw. Bedränger. „Feinde“ ist klar, knapp und passt zum poetischen Register.
- source_word: אָחוֹר
  choice: zurück
  rationale: Das Wort kann adverbial die Richtung nach hinten bezeichnen. „Zurück“ erhält das anschauliche Bild und bleibt im Deutschen natürlich; die mögliche lokale Deutung wird in der Fußnote bewahrt.
- source_word: חֶרְפַּת עוֹלָם
  choice: dauernder Schande
  rationale: Die Constructusverbindung bezeichnet anhaltende, bleibende öffentliche Schmach. „Dauernde Schande“ ist verständlich und gibt עוֹלָם kontextgerecht wieder, ohne zwingend metaphysische Ewigkeit festzulegen.
- source_word: נָתַן לָמוֹ
  choice: überzog sie mit
  rationale: נתן mit ל kann ausdrücken, dass jemandem etwas auferlegt oder zugefügt wird. „Überzog sie mit“ ist im Deutschen idiomatisch und bewahrt die Vorstellung, dass die Schande auf sie gebracht wurde.
