base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/036.yaml
  text: But they flattered him with their mouth[a], and with their tongue they lied to him.
translation:
  language: de
  text: Doch sie schmeichelten ihm[a] mit ihrem Mund und belogen ihn mit ihrer Zunge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie täuschten ihn« oder »sie verlockten ihn«. Das hebräische Verb kann diese Bedeutungen haben; hier bezeichnet es wahrscheinlich schmeichelnde, unaufrichtige Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתּוּהוּ
  choice: sie schmeichelten ihm
  rationale: Das Piel von פתה kann »verlocken«, »täuschen« oder »überreden« bedeuten. Im Parallelismus mit dem Lügen bezeichnet es hier am ehesten unaufrichtige, beschwichtigende Rede an Gott. »Schmeichelten« gibt diese zwischenmenschliche und manipulative Nuance natürlich wieder, ohne zu behaupten, Gott sei tatsächlich getäuscht worden.
- source_word: בְּפִיהֶם
  choice: mit ihrem Mund
  rationale: בְּ bezeichnet hier das Mittel. Der kollektive Singular »Mund« bewahrt die hebräische Ausdrucksweise und den poetischen Parallelismus.
- source_word: וּבִלְשׁוֹנָם
  choice: und mit ihrer Zunge
  rationale: »Zunge« bezeichnet bildhaft das Reden. Die konkrete Wiedergabe erhält den Parallelismus zu »Mund«.
- source_word: יְכַזְּבוּ
  choice: belogen
  rationale: Das Piel von כזב bezeichnet falsches Reden beziehungsweise Lügen. »Belogen« ist direkt, idiomatisch und nimmt das folgende לוֹ als persönliches Gegenüber auf.
- source_word: לוֹ
  choice: ihn
  rationale: 'Die Präposition ל mit Suffix bezeichnet hier am natürlichsten den Adressaten der Lüge: Sie belogen ihn, das heißt Gott.'
theological_decisions:
- issue: Ob der Vers aussagt, dass die Menschen Gott tatsächlich täuschten, oder dass sie unaufrichtig zu ihm redeten.
  choice: Die Wiedergabe beschreibt schmeichelnde, verlogene Rede an Gott, ohne eine erfolgreiche Täuschung Gottes auszusagen.
  alternative: »Sie täuschten ihn« oder »sie verlockten ihn«
  rationale: Der Zusammenhang handelt von Israels unaufrichtiger Umkehr und Untreue. »Schmeichelten« wahrt die mögliche Nuance manipulativer Rede; die Fußnote erhält die lexikalische Mehrdeutigkeit, ohne die theologische Spannung stillschweigend durch eine Behauptung erfolgreicher Täuschung aufzulösen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der konkrete poetische Parallelismus »Mund … Zunge« bleibt erhalten; »belogen ihn« klingt im Deutschen natürlicher als »logen ihm«.
