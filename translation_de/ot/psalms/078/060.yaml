id: PSA.78.60
reference: Psalms 78:60
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ֭/יִּטֹּשׁ מִשְׁכַּ֣ן שִׁל֑וֹ אֹ֝֗הֶל שִׁכֵּ֥ן בָּ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/060.yaml
  text: So he abandoned the tabernacle of Shiloh[b][a], the tent where he dwelt among mankind.
translation:
  language: de
  text: So gab er die Wohnstätte von Schilo auf, das Zelt, das er unter den Menschen aufgestellt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Zelt, in dem er unter den Menschen wohnte.“'
    reason: Die Formulierung kann entweder das Aufstellen des Zeltes oder, dem theologischen Sinn nach, Gottes Wohnen in diesem Zelt hervorheben.
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: So gab er … auf
  rationale: נטשׁ bezeichnet ein Zurücklassen oder Verlassen. „Aufgeben“ bewahrt hier die starke Aussage vom göttlichen Rückzug, ohne zusätzliche Wertung einzutragen.
- source_word: מִשְׁכַּן
  choice: Wohnstätte
  rationale: מִשְׁכָּן bezeichnet Gottes Wohnstätte beziehungsweise das Heiligtumszelt. „Wohnstätte“ gibt die Grundbedeutung wieder und bleibt zugleich vom parallelen אֹהֶל („Zelt“) unterschieden.
- source_word: שִׁלֹה
  choice: Schilo
  rationale: Der Ortsname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: אֹהֶל
  choice: Zelt
  rationale: Die konkrete Bedeutung von אֹהֶל und die poetische Parallelität zu מִשְׁכַּן bleiben erhalten.
- source_word: שִׁכֵּן
  choice: aufgestellt hatte
  rationale: Das Piel von שׁכן kann hier ausdrücken, dass Gott dem Zelt einen Ort unter den Menschen gab beziehungsweise es dort aufstellte. Diese Wiedergabe bildet die kausative Form natürlich ab.
- source_word: בָּאָדָם
  choice: unter den Menschen
  rationale: אָדָם steht kollektiv für die Menschheit beziehungsweise die Menschen. Die deutsche Formulierung ist natürlich, inklusiv und wahrt den kollektiven Sinn.
theological_decisions:
- issue: Bezug der Aussage שִׁכֵּן בָּאָדָם
  choice: Das Zelt wurde von Gott unter den Menschen aufgestellt.
  alternative: Das Zelt ist der Ort, an dem Gott unter den Menschen wohnte.
  rationale: Die kausative Verbform kann sich unmittelbar auf das Aufstellen beziehungsweise Ansiedeln des Zeltes beziehen; im Kontext von Gottes Heiligtum kann die Wendung zugleich als Aussage über seine Gegenwart und sein Wohnen unter den Menschen verstanden werden. Die alternative Deutung wird daher nicht stillschweigend ausgeschlossen, sondern in einer Fußnote bewahrt.
- issue: Bedeutung von אָדָם
  choice: die Menschen
  alternative: die Menschheit
  rationale: Der Singular אָדָם ist hier kollektiv. „Die Menschen“ gibt diesen Sinn in modernem Standarddeutsch klar wieder, ohne ihn auf männliche Personen einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzstruktur. „Wohnstätte“ hält den Bezug zum Wohnen Gottes offen und vermeidet sowohl die heute erklärungsbedürftige Bezeichnung „Stiftshütte“ als auch die stärker deutende Wiedergabe „Heiligtum“.
