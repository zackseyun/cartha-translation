  text: וַֽ֭/יִּזְכְּרוּ כִּֽי אֱלֹהִ֣ים צוּרָ֑/ם וְ/אֵ֥ל עֶ֝לְיוֹן גֹּאֲלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/035.yaml
  text: Then they remembered that God was their rock[a], and God Most High was their redeemer.
translation:
  language: de
  text: Da erinnerten sie sich daran, dass Gott ihr Fels war und Gott, der Höchste, ihr Erlöser war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und der höchste Gott ihr Erlöser war“. Wörtlich steht im Hebräischen: „und Gott, der Höchste, ihr Erlöser“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכְּרוּ
  choice: Da erinnerten sie sich
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Da“ gibt die zeitlich-folgernde Bewegung in natürlichem Deutsch wieder.
- source_word: כִּי
  choice: daran, dass
  rationale: כִּי leitet hier den Inhalt des Erinnerns ein. Die deutsche Verbindung „sich daran erinnern, dass“ entspricht der Syntax idiomatisch.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die morphologische Pluralform bezeichnet hier eindeutig den einen Gott Israels.
- source_word: צוּרָם
  choice: ihr Fels
  rationale: „Fels“ bewahrt das hebräische Bild für Beständigkeit, Schutz und Stärke unmittelbar.
- source_word: וְאֵל עֶלְיוֹן
  choice: und Gott, der Höchste
  rationale: אֵל wird als Gottestitel übersetzt; עֶלְיוֹן wird appositionell als „der Höchste“ wiedergegeben. So bleiben die beiden parallelen Gottesbezeichnungen erkennbar, ohne zwei Wesen anzudeuten.
- source_word: גֹּאֲלָם
  choice: ihr Erlöser
  rationale: „Erlöser“ bewahrt die substantivische Bedeutung des Partizips von גאל, ohne die in diesem poetischen Zusammenhang nicht ausdrücklich festgelegte Nuance eines Verwandtenlösers einzutragen.
theological_decisions:
- issue: Wiedergabe der parallelen Gottesbezeichnungen אֱלֹהִים und אֵל עֶלְיוֹן
  choice: „Gott … und Gott, der Höchste“
  alternative: „Gott … und der höchste Gott“
  rationale: Die Wiederholung von „Gott“ erhält den poetischen Parallelismus. Die appositionelle Fassung „Gott, der Höchste“ folgt der hebräischen Wortfolge besonders eng; die alternative attributive Deutung bleibt in der Fußnote sichtbar.
- issue: Wiedergabe von גֹּאֲלָם
  choice: „ihr Erlöser“
  alternative: „der sie erlöste“ oder „ihr Verwandtenlöser“
  rationale: Die nominale Wiedergabe erhält die theologische und poetische Spannung des hebräischen Ausdrucks. „Verwandtenlöser“ wäre hier zu spezifisch.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Das wiederholte „war“ sorgt für einen vollständigen und natürlichen deutschen Satz; die Metapher „Fels“ und der Titel „Erlöser“ bleiben erhalten.
