  text: וַ/יֹּאכְל֣וּ וַ/יִּשְׂבְּע֣וּ מְאֹ֑ד וְ֝/תַֽאֲוָתָ֗/ם יָבִ֥א לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/029.yaml
  text: So they ate and were very full[a], and he brought them what they craved.
translation:
  language: de
  text: Und sie aßen und wurden sehr satt; er brachte ihnen, was sie begehrten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ihr Verlangen«. Das hebräische Substantiv kann sowohl das Verlangen als auch das Begehrte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: So aßen sie
  rationale: Das Qal-Wayyiqtol von אכל bezeichnet gewöhnliches Essen. »So« bindet die Folge natürlich an den vorausgehenden Erzählzusammenhang an.
- source_word: וַיִּשְׂבְּעוּ מְאֹד
  choice: wurden sehr satt
  rationale: שׂבע bedeutet, satt beziehungsweise gesättigt zu sein; מְאֹד verstärkt die Aussage. Die Formulierung ist konkret, idiomatisch und bewahrt das Bild reichlicher Nahrung.
- source_word: תַאֲוָתָם
  choice: wonach sie verlangten
  rationale: תַּאֲוָה kann das Verlangen selbst oder das Begehrte bezeichnen. Im Zusammenhang steht die begehrte Nahrung im Vordergrund; die Relativformulierung gibt dies natürlich wieder, ohne das Verlangen unnötig als »Begierde« zu moralisieren.
- source_word: יָבִא לָהֶם
  choice: er brachte ihnen
  rationale: Der Hifil von בוא kann »bringen« beziehungsweise »kommen lassen« bedeuten. Mit לָהֶם ist »er brachte ihnen« eine natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Unausgesprochenes Subjekt von יָבִא
  choice: Mit »er« wiedergegeben; Gott ist im Kontext das vorausgesetzte Subjekt.
  alternative: Eine unpersönliche oder intransitive Wiedergabe wie »ihr Verlangen kam zu ihnen«.
  rationale: Der Erzählzusammenhang stellt Gott als den Handelnden dar, der die Nahrung gibt. Zugleich wird Gott nicht ausdrücklich im Vers genannt; das Pronomen wahrt diese implizite Referenz.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das Semikolon bildet den engen Zusammenhang zwischen Sättigung und göttlicher Gewährung ab, ohne die beiden Aussagen zu verschmelzen.
