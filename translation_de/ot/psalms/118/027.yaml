source:
  edition: WLC
  text: אֵ֤ל יְהוָה֮ וַ/יָּ֪אֶר לָ֥/נוּ אִסְרוּ חַ֥ג בַּ/עֲבֹתִ֑ים עַד קַ֝רְנ֗וֹת הַ/מִּזְבֵּֽחַ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/027.yaml
  text: Yahweh is God[a], and he has given light to us. Bind the festal sacrifice with cords[d][c][b], up to the horns of the altar.
translation:
  language: de
  text: Der HERR ist Gott, und er hat uns Licht gegeben.[a] Bindet das Festopfer mit Stricken[b][c] bis an die Hörner des Altars.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und er hat über uns geleuchtet«. Das hebräische Verb kann bedeuten, dass der HERR uns Licht gab oder sein Licht und damit seine Gunst über uns leuchten ließ.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Bindet das Fest«. Gemeint ist hier wahrscheinlich das Festopfer; andere verstehen die Zeile als Hinweis auf einen Festzug.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: »mit dicken Seilen«. Manche deuten das Wort als »mit Zweigen«, doch »Stricke/Seile« ist lexikalisch wahrscheinlicher.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »bis zu den Hörnern des Altars«. Wie der schwer verständliche Befehl praktisch zu verstehen ist, bleibt umstritten.'
    reason: translation_clarification
lexical_decisions:
- source_word: אֵל יְהוָה
  choice: Der HERR ist Gott
  rationale: Der verblosen hebräischen Aussage entsprechend wird JHWH als Gott bezeichnet. Der Gottesname wird nach deutscher Bibeltradition mit »der HERR« wiedergegeben.
- source_word: וַיָּאֶר לָנוּ
  choice: und er hat uns Licht gegeben
  rationale: Der Hifil von אור bedeutet gewöhnlich »Licht geben, erleuchten«. Die Formulierung wahrt den kausativen Sinn und lässt zugleich den Gedanken göttlicher Gunst anklingen.
- source_word: אִסְרוּ
  choice: Bindet
  rationale: Der pluralische Imperativ von אסר bedeutet direkt »binden, festbinden«.
- source_word: חַג
  choice: das Festopfer
  rationale: חַג bezeichnet gewöhnlich ein Fest, wird hier aber angesichts des Bindens und der Erwähnung des Altars wahrscheinlich metonymisch für das zum Fest gehörende Opfertier gebraucht.
- source_word: בַּעֲבֹתִים
  choice: mit Stricken
  rationale: Das Substantiv bezeichnet am ehesten Stricke oder Seile. »Stricke« ist im Deutschen natürlich und passt zum Verb »binden«.
- source_word: עַד קַרְנוֹת הַמִּזְבֵּחַ
  choice: bis an die Hörner des Altars
  rationale: »Bis an« gibt עַד präzise und idiomatisch wieder, ohne eindeutig festzulegen, ob das Opfer unmittelbar an den Altarhörnern befestigt werden soll.
theological_decisions:
- issue: Kultischer Bezug von חַג im Befehl zum Binden
  choice: Metonymische Wiedergabe als »Festopfer«
  alternative: »Fest« beziehungsweise »Festzug«
  rationale: Der Zusammenhang mit dem Binden und den Altarhörnern spricht für das Opfertier des Festes. Da der hebräische Ausdruck jedoch wörtlich »Fest« lautet und auch ein Festzug erwogen wird, wird die Deutungsalternative in einer Fußnote bewahrt.
- issue: Bedeutung des göttlichen Lichtgebens
  choice: »er hat uns Licht gegeben«
  alternative: »er hat über uns geleuchtet«
  rationale: Die gewählte Wiedergabe erhält den üblichen kausativen Sinn des Hifil; die mögliche Aussage über Gottes gnädiges Leuchten wird nicht dogmatisch ausgeschlossen, sondern als Alternative genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Festopfer« erschließt den wahrscheinlich metonymischen kultischen Sinn knapp; die Fußnoten erhalten die echten lexikalischen und syntaktischen Alternativen. »Hörner des Altars« bewahrt den biblisch-kultischen Fachausdruck.
