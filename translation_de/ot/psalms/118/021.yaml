source:
  edition: WLC
  text: א֭וֹדְ/ךָ כִּ֣י עֲנִיתָ֑/נִי וַ/תְּהִי לִ֝֗/י לִֽ/ישׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/021.yaml
  text: I will give thanks to you[a], for you answered me and became my salvation.
translation:
  language: de
  text: Ich will dir danken, denn du hast mir geantwortet und bist mir zur Rettung[a] geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Heil“. Das hebräische Wort kann sowohl die Rettung aus einer konkreten Notlage als auch Heil in einem umfassenderen Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אודך
  choice: Ich will dir danken
  rationale: Das Hifil von ידה bezeichnet hier dankendes Preisen. „Ich will“ gibt den volitiven beziehungsweise vorausblickenden Ton der Imperfektform wieder; „dir“ entspricht dem Suffix der 2. Person Singular.
- source_word: כי
  choice: denn
  rationale: כי leitet hier den Grund für den Dank ein. „Denn“ stellt den kausalen Zusammenhang knapp und natürlich her.
- source_word: עניתני
  choice: du hast mir geantwortet
  rationale: Die Form gehört zu ענה II „antworten“, nicht zu ענה I „demütigen, bedrängen“. Das Perfekt entspricht im Deutschen natürlich einer abgeschlossenen Antwort auf das Gebet.
- source_word: ותהי
  choice: und bist … geworden
  rationale: Das Wayyiqtol von היה führt die Handlung fort und bezeichnet ein Werden. Die deutsche Perfektform passt zur vorausgehenden Aussage und bewahrt diese dynamische Bedeutung.
- source_word: לי
  choice: mir
  rationale: Die Präposition ל mit dem Suffix der 1. Person Singular wird direkt als „mir“ wiedergegeben und bleibt so näher an der hebräischen Konstruktion als ein bloßes Possessivpronomen.
- source_word: לישועה
  choice: zur Rettung
  rationale: ישועה kann konkrete Befreiung wie auch umfassenderes Heil bezeichnen. „Rettung“ ist im heutigen Deutsch klar und natürlich; die Fußnote bewahrt die weiter reichende Alternative „Heil“.
theological_decisions:
- issue: Wiedergabe von ישועה zwischen konkreter Befreiung und umfassenderem Heil
  choice: Rettung
  alternative: Heil
  rationale: „Rettung“ erfasst den unmittelbaren Dank für erfahrene Befreiung, ohne die Bedeutung auf einen militärischen Sieg einzuengen. „Heil“ bleibt als mögliche, theologisch weiter klingende Wiedergabe in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wendung „mir zur Rettung geworden“ bewahrt die hebräische Konstruktion und den poetischen Charakter, ohne altertümlich zu wirken.
