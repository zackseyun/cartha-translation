  text: זֶה הַ֭/יּוֹם עָשָׂ֣ה יְהוָ֑ה נָגִ֖ילָה וְ/נִשְׂמְחָ֣ה בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/024.yaml
  text: This is the day that Yahweh has made; let us rejoice and be glad in it.
translation:
  language: de
  text: Dies ist der Tag, den Jahwe gemacht hat; lasst uns jubeln und uns an ihm freuen!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה הַיּוֹם
  choice: Dies ist der Tag
  rationale: Das Demonstrativpronomen und das bestimmte Substantiv werden in natürlichem Deutsch als Identifikationssatz wiedergegeben; „ist“ ist im Hebräischen unausgedrückt.
- source_word: עָשָׂה
  choice: gemacht hat
  rationale: Das Qal-Perfekt bezeichnet die vollendete Handlung Jahwes. Im Relativsatz entspricht das deutsche Perfekt dem Sinn und klingt gegenwärtig und natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen geläufige wissenschaftliche Umschrift.
- source_word: נָגִילָה
  choice: lasst uns jubeln
  rationale: Die Kohortativform drückt eine gemeinsame Aufforderung aus. „Jubeln“ bewahrt die lebhafte Freude des Verbs גיל.
- source_word: וְנִשְׂמְחָה
  choice: und uns freuen
  rationale: Auch diese Kohortativform ist auffordernd. „Uns freuen“ unterscheidet den Ausdruck sinnvoll von „jubeln“ und ist modernes, natürliches Deutsch.
- source_word: בּוֹ
  choice: an ihm
  rationale: Das maskuline Suffix bezieht sich am naheliegendsten auf „den Tag“. Die Verbindung „sich an ihm freuen“ gibt die hebräische Präposition idiomatisch wieder, ohne den Bezug auf den Tag aufzulösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des Suffixes in בּוֹ
  choice: 'auf den Tag: „an ihm“'
  alternative: 'auf Jahwe: „an ihm“'
  rationale: Das grammatische Geschlecht ließe isoliert beide Bezüge zu, doch Satzbau und Kontext legen den unmittelbar genannten Tag als Bezugswort nahe. Die deutsche Formulierung bewahrt das maskuline Pronomen, während die Auslegung nicht weiter zugespitzt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrautem poetischem Rhythmus. Der Ausruf unterstreicht den auffordernden Jubel der beiden Kohortative.
