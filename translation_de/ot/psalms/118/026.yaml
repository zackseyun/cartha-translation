id: PSA.118.26
reference: Psalms 118:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בָּר֣וּךְ הַ֭/בָּא בְּ/שֵׁ֣ם יְהוָ֑ה בֵּ֝רַֽכְנוּ/כֶ֗ם מִ/בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/026.yaml
  text: Blessed is the one who comes in the name of Yahweh[c][b][a]; we bless you from the house of Yahweh.
translation:
  language: de
  text: Gesegnet ist, der[a] im Namen Jahwes[b] kommt.[c] Wir segnen euch vom Haus Jahwes aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „der Kommende“. Das hebräische Partizip steht im maskulinen Singular.'
    reason: lexical_alternative
  - marker: b
    text: '„Im Namen“ kann auch bedeuten: „in der Vollmacht“ oder „als Beauftragter“.'
    reason: lexical_alternative
  - marker: c
    text: Dieser Vers wird im Neuen Testament beim Einzug Jesu in Jerusalem aufgegriffen (Matthäus 21,9; Markus 11,9; Lukas 19,38; Johannes 12,13). Der Wortlaut des Psalms selbst legt diese spätere Anwendung in der Übersetzung nicht ausdrücklich fest.
    reason: cross_reference
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gesegnet ist
  rationale: Das passive Partizip beziehungsweise prädikativ gebrauchte Adjektiv bildet hier eine Segensformel. „Gesegnet ist“ bewahrt deren feststellenden beziehungsweise ausrufenden Charakter, ohne sie eindeutig in einen Wunsch („sei gesegnet“) umzudeuten.
- source_word: הַבָּא
  choice: der … kommt
  rationale: Das substantivierte Partizip mit Artikel steht im maskulinen Singular und bedeutet wörtlich „der Kommende“. Die Relativformulierung ist im heutigen Deutsch natürlich und erhält Numerus und Genus des Hebräischen.
- source_word: בְּשֵׁם
  choice: im Namen
  rationale: Die Wendung kann das Kommen unter Berufung auf, in Vollmacht oder als Beauftragter einer Person bezeichnen. „Im Namen“ lässt diese Bedeutungsbreite offen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: בֵּרַכְנוּכֶם
  choice: wir segnen euch
  rationale: Die Perfektform der 1. Person Plural mit Suffix der 2. Person maskulin Plural kann im liturgischen Zusammenhang performativ verstanden werden. Das deutsche Präsens gibt diese aktuelle Segenshandlung natürlich wieder; „euch“ bewahrt den pluralischen Adressaten.
- source_word: מִבֵּית
  choice: vom Haus … aus
  rationale: Die Form bezeichnet den Ausgangspunkt der Segnung. „Vom Haus Jahwes aus“ bewahrt das hebräische Bild, ohne „Haus“ im Haupttext ausdrücklich als Tempel auszulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von הַבָּא auf einen unmittelbar liturgischen oder spezifisch messianischen Kommenden
  choice: Die allgemeine Formulierung des Psalms bleibt im Haupttext erhalten.
  alternative: Den Kommenden bereits im Wortlaut ausdrücklich als Messias kennzeichnen.
  rationale: Der Psalm segnet den, der im Namen Jahwes kommt. Die spätere neutestamentliche Anwendung auf Jesus ist kanonisch bedeutsam, wird aber nicht rückwirkend als ausdrückliche Identifizierung in den hebräischen Psalmtext eingefügt.
- issue: Aussage oder Wunsch in בָּרוּךְ
  choice: Gesegnet ist
  alternative: Gesegnet sei
  rationale: Die knappe hebräische Nominalform kann als Ausruf oder Segensformel verstanden werden. „Gesegnet ist“ hält sich eng an die Form und vermeidet es, sie ausschließlich als Wunschform zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Segensformel bleibt erkennbar; zugleich werden hebräische Satzstruktur und Bedeutungsbreite soweit möglich bewahrt. „Haus Jahwes“ lässt den Tempelbezug implizit.
