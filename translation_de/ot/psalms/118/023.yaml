  text: מֵ/אֵ֣ת יְ֭הוָה הָ֣יְתָה זֹּ֑את הִ֖יא נִפְלָ֣את בְּ/עֵינֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/023.yaml
  text: This has come from Yahweh[b][a]; it is marvelous in our eyes.
translation:
  language: de
  text: Von Jahwe ist dies geschehen; es ist wunderbar in unseren Augen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֵת
  choice: von
  rationale: Die Präposition bezeichnet hier Ursprung beziehungsweise Urheberschaft; „von“ gibt dies knapp und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הָיְתָה זֹּאת
  choice: ist dies geschehen
  rationale: Die Wendung kann wörtlich „dies war/ist geworden“ bedeuten. Im Zusammenhang bezeichnet sie ein Geschehen, das von Jahwe ausgeht; das deutsche Perfekt ist dafür natürlich, ohne das Ereignis näher festzulegen.
- source_word: הִיא
  choice: es
  rationale: Das selbstständige Pronomen greift das zuvor genannte Geschehen betont wieder auf; im Deutschen entspricht dem natürlich „es“.
- source_word: נִפְלָאת
  choice: wunderbar
  rationale: Die Niphal-Form von פלא bezeichnet etwas Staunenswertes oder Außergewöhnliches. „Wunderbar“ wahrt den poetischen Lobton und ist im heutigen Deutsch gut verständlich.
- source_word: בְּעֵינֵינוּ
  choice: in unseren Augen
  rationale: Die hebräische Wendung wird als verständliches deutsches Bild beibehalten und bewahrt die Perspektive der Sprechenden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt den Namen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. Das etwas offene „dies“ bleibt erhalten, damit der Bezug aus dem Zusammenhang bestimmt wird.
