base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/022.yaml
  text: The stone the builders rejected has become the cornerstone[a][b].
translation:
  language: de
  text: Der Stein, den die Bauleute verwarfen, ist zum Eckstein geworden[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zum Haupt der Ecke“.'
    reason: lexical_alternative
  - marker: b
    text: Dieser Vers wird später im Neuen Testament auf den Messias/Christus bezogen; siehe Matthäus 21,42; Apostelgeschichte 4,11; 1. Petrus 2,7.
    reason: cross_reference
lexical_decisions:
- source_word: אֶבֶן
  choice: Stein
  rationale: Das gewöhnliche Substantiv bezeichnet einen Stein; „Stein“ bewahrt das Bild, ohne Größe oder bauliche Funktion unnötig festzulegen.
- source_word: מָאֲסוּ
  choice: verworfen hatten
  rationale: מאס bezeichnet bewusstes Zurückweisen oder Verwerfen. Das Plusquamperfekt bildet im Deutschen klar ab, dass die Verwerfung dem Gewordensein vorausgeht.
- source_word: הַבּוֹנִים
  choice: die Bauleute
  rationale: Das substantivierte Partizip bedeutet wörtlich „die Bauenden“. „Bauleute“ ist natürlich, prägnant und weniger auf ein einzelnes Handwerk eingeengt als „Maurer“.
- source_word: הָיְתָה
  choice: ist … geworden
  rationale: Die hebräische Perfektform beschreibt hier den eingetretenen Zustand beziehungsweise die vollzogene Umkehrung; das deutsche Perfekt gibt dies idiomatisch wieder.
- source_word: לְרֹאשׁ פִּנָּה
  choice: zum Eckstein
  rationale: Wörtlich steht „zum Haupt der Ecke“. „Eckstein“ ist die verständlichste moderne Wiedergabe des architektonischen Bildes, ohne die nicht sicher entscheidbare genaue Bauposition als Grund-, Schluss- oder Deckstein festzulegen.
theological_decisions:
- issue: Messianische beziehungsweise christologische Verwendung in späteren biblischen Texten
  choice: Das architektonische Bild bleibt im Haupttext in seinem unmittelbaren Sinn stehen; der spätere Christusbezug wird in einer Fußnote genannt.
  alternative: Die messianisch-christologische Deutung ausdrücklich in den Vers selbst aufnehmen.
  rationale: Der hebräische Vers spricht unmittelbar in einem Bild von Verwerfung, Umkehrung und Auszeichnung, ohne den Messias ausdrücklich zu nennen. Die neutestamentliche Anwendung ist für die kanonische Rezeption wichtig, darf aber die Übersetzung des hebräischen Wortlauts nicht vorwegnehmend vereindeutigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bauleute“ ist allgemein verständlich und bewahrt die kollektive Bezeichnung des Hebräischen. Die traditionelle Wendung „Eckstein“ erhält das prägnante Bau-Bild; die Fußnote macht die wörtliche Formulierung und damit ihre genuine Offenheit sichtbar.
