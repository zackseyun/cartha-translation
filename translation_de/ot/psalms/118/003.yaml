source:
  edition: WLC
  text: יֹֽאמְרוּ נָ֥א בֵֽית אַהֲרֹ֑ן כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/003.yaml
  text: Let the house of Aaron now say[a], “His steadfast love endures forever.”
translation:
  language: de
  text: 'Das Haus Aaron soll nun sagen[a]: »Denn seine beständige Liebe währt ewig.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Seine Bundestreue währt ewig.« Das hebräische Wort חֶסֶד (chesed) kann beständige, loyale Liebe, Güte, Erbarmen oder Bundestreue bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: soll sagen
  rationale: Der Qal-Imperfekt Plural wird in dieser liturgischen Rufreihe auffordernd gebraucht. Da »Haus Aaron« im Deutschen als kollektiver Singular steht, ist »soll sagen« grammatisch natürlich.
- source_word: נָא
  choice: nun
  rationale: Die Partikel verstärkt hier die Aufforderung; »nun« gibt diesen nachdrücklichen, liturgischen Impuls wieder, ohne eine höfliche Bitte nahezulegen.
- source_word: בֵית אַהֲרֹן
  choice: das Haus Aaron
  rationale: Die traditionelle biblische Wendung bezeichnet die aaronitische, priesterliche Gemeinschaft als Kollektiv und bewahrt die Form des hebräischen Ausdrucks.
- source_word: כִּי
  choice: nicht gesondert wiedergegeben
  rationale: כִּי leitet hier den Inhalt des ausgerufenen Bekenntnisses ein. Im natürlichen Deutschen genügt nach »sagen« der Doppelpunkt; ein zusätzliches »denn« würde leicht eine Begründung statt des Aussageinhalts signalisieren.
- source_word: לְעוֹלָם
  choice: währt ewig
  rationale: Wörtlich bezeichnet der Ausdruck unbegrenzte Dauer. Zusammen mit dem nominalen חֶסֶד ergibt »währt ewig« eine knappe und würdige deutsche Refrainformel.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חֶסֶד umfasst loyale Liebe, Güte, Erbarmen und Bundestreue. »Beständige Liebe« hält Liebe und verlässliche Dauer zusammen, ohne den Bedeutungsumfang auf nur einen Aspekt zu verengen.
theological_decisions:
- issue: Wiedergabe von חֶסֶד in einer bundestheologischen Lobpreisformel
  choice: beständige Liebe
  alternative: Bundestreue; Güte; Erbarmen
  rationale: Die Formulierung bewahrt die Breite des hebräischen Begriffs und bringt Gottes verlässliche, dauerhaft zugewandte Liebe zum Ausdruck, ohne die mögliche Bundesdimension dogmatisch zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit liturgisch-poetischer Kürze. Die biblische Kollektivbezeichnung »Haus Aaron« und die Refrainstruktur bleiben erhalten.
