base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/015.yaml
  text: 'The sound of joyful shouting and salvation is in the tents of the righteous: “The right hand of Yahweh does valiantly!”[a][b]'
translation:
  language: de
  text: 'Der Klang von Freudenjubel und Rettung[a] ist in den Zelten der Gerechten zu hören: »Die rechte Hand Jahwes vollbringt Gewaltiges!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Sieg« oder »Befreiung«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräische Wendung: »handelt mit Kraft« beziehungsweise »handelt machtvoll«; sie kann auch bedeuten: »vollbringt mächtige Taten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל רִנָּ֬ה
  choice: Jubel … erschallen
  rationale: קוֹל bezeichnet hier das Hörbare, רִנָּה einen laut geäußerten Freudenjubel. Die verbale Formulierung „erschallen“ gibt das Klangmotiv in natürlichem Deutsch wieder.
- source_word: וִֽישׁוּעָ֗ה
  choice: Rettung
  rationale: יְשׁוּעָה kann Rettung, Befreiung oder Sieg bezeichnen. „Rettung“ wahrt die breite Bedeutung, ohne den Zusammenhang vorschnell auf einen militärischen Sieg festzulegen.
- source_word: בְּ/אָהֳלֵ֥י צַדִּיקִ֑ים
  choice: in den Zelten der Gerechten
  rationale: Die konkrete Bildsprache von אֹהֶל („Zelt“) bleibt erhalten; צַדִּיקִים bezeichnet substantivisch die Gerechten.
- source_word: יְמִ֥ין יְ֝הוָה
  choice: Die rechte Hand Jahwes
  rationale: Die wörtliche Wendung bewahrt das biblische Bild für Jahwes wirksame Macht; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: עֹ֣שָׂה חָֽיִל
  choice: vollbringt Gewaltiges
  rationale: Die hebräische Wendung bezeichnet machtvolles, erfolgreiches Handeln. „Vollbringt Gewaltiges“ ist im Deutschen natürlich und erhält die emphatische Aussage, ohne sie unnötig militärisch einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname des Gottes Israels wird als solcher sichtbar bewahrt und in der im Deutschen üblichen Form „Jahwe“ wiedergegeben.
- issue: Bedeutung von יְשׁוּעָה im Siegespsalm
  choice: Rettung
  alternative: Sieg oder Befreiung
  rationale: „Rettung“ umfasst konkrete Befreiung und Gottes rettendes Eingreifen; die möglichen kontextuellen Nuancen werden in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Bildsprache der Zelte und der rechten Hand bleibt erhalten; „erschallen“ vermittelt den hörbaren Jubel idiomatisch.
