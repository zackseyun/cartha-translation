    issue: קוֹל wird in der Satzkonstruktion nicht ausdrücklich wiedergegeben.
    rationale: Das Verb „erschallen“ vermittelt zwar allgemein Klanglichkeit, aber „Jubel und Rettung erschallen“ macht die Rettung selbst zum Erschallenden. Die Konstruktion „Der Klang von … ist zu hören“ gibt die hebräische Nominalverbindung קוֹל רִנָּה וִישׁוּעָה genauer wieder.
  - severity: low
    issue: Fußnote b bezeichnet eine idiomatische Erklärung als „wörtlich“.
    rationale: „handelt mit Kraft“ ist eine sinnentsprechende Wiedergabe der Wendung עֹשָׂה חָיִל, nicht deren strenge Wort-für-Wort-Übersetzung. Eine Kennzeichnung als „hebräische Wendung“ ist sachlich präziser.
