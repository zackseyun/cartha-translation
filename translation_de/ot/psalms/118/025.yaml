lexical_decisions:
- source_word: אָנָּא ... נָּא
  choice: Ach ... doch
  rationale: Die wiederholten Bittpartikeln drücken einen dringenden flehentlichen Ruf aus, nicht eine zeitliche Bedeutung wie „jetzt“.
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens mit „HERR“ ist im Psalmenkontext geläufig und würdevoll.
- source_word: הוֹשִׁיעָה
  choice: rette
  rationale: Der Hifil-Imperativ bezeichnet hier den dringenden Ruf nach Rettung; das im Hebräischen nicht genannte Objekt bleibt auch im Deutschen offen.
- source_word: הַצְלִיחָה
  choice: lass es gelingen
  rationale: Der Hifil-Imperativ bedeutet „Gelingen/Erfolg schenken“. Die unpersönliche Form wahrt, dass das Hebräische kein Objekt nennt.
theological_decisions:
- issue: Nicht genannte Objekte der beiden Imperative
  choice: Die Objektlosigkeit wird in „rette doch“ und „lass es doch gelingen“ bewahrt.
  alternative: „Rette uns“ und „schenke uns Erfolg“ nach dem gemeinschaftlichen Gebetskontext.
  rationale: Der hebräische Wortlaut nennt weder „uns“ noch ein anderes Objekt. Die offene Form bewahrt die genuine Unbestimmtheit, bleibt im Deutschen verständlich und vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. „Ach“ und „doch“ geben die eindringliche Bitte natürlich wieder; der Parallelismus der beiden Halbverse bleibt hörbar.
