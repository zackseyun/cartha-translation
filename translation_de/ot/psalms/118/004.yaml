  text: יֹֽאמְרוּ נָ֭א יִרְאֵ֣י יְהוָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/004.yaml
  text: Let those who fear Yahweh now say[a], “His steadfast love endures forever.”
translation:
  language: de
  text: 'Nun sollen die, die Jahwe fürchten, sagen: »Denn seine treue Liebe währt für immer.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: sollen ... sagen
  rationale: Der Jussiv bzw. Imperfekt in diesem liturgischen Zusammenhang hat auffordernden Charakter; die Formulierung gibt den Aufruf in natürlichem Deutsch wieder.
- source_word: נָא
  choice: jetzt
  rationale: נָא verstärkt hier den dringlichen Aufruf innerhalb der wiederholten liturgischen Folge; »jetzt« ist idiomatischer als »bitte«.
- source_word: יִרְאֵי יְהוָה
  choice: die Jahwe fürchten
  rationale: Die Wendung bezeichnet Menschen, deren Haltung gegenüber Jahwe von ehrfürchtiger Gottesfurcht geprägt ist. »fürchten« bewahrt dabei die Spannung zwischen Furcht und Verehrung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי
  choice: nicht eigens wiedergegeben
  rationale: כִּי leitet hier den Inhalt des liturgischen Bekenntnisses ein. Im Deutschen wird diese Funktion durch den Doppelpunkt und die direkte Rede natürlich ausgedrückt.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Die Präpositionalfügung bezeichnet unbegrenzte Dauer; zusammen mit dem nominalen Satz wird sie im Deutschen durch »bleibt für immer« klar und natürlich wiedergegeben.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חֶסֶד umfasst verlässliche Liebe, Loyalität, Güte und Bundestreue. »beständige Liebe« hält den Liebesaspekt und die Dauerhaftigkeit zusammen, ohne den Begriff auf nur eine Dimension einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; dessen Wiedergabe als »Jahwe« bewahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Bedeutungsumfang von חֶסֶד
  choice: beständige Liebe
  alternative: Bundestreue
  rationale: »Beständige Liebe« bewahrt sowohl die Zuwendung als auch die Verlässlichkeit des hebräischen Begriffs. Die stärker bundestheologische Alternative wird in der Fußnote genannt, aber nicht zur alleinigen Bedeutung erhoben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit liturgischem Klang. Die Satzstellung bleibt gut verständlich; »Jahwe fürchten« bewahrt die traditionelle biblische Ausdrucksweise und ihre theologische Spannung.
