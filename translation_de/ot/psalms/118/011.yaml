  yaml_path: translation/ot/psalms/118/011.yaml
  text: They surrounded me[a], yes, they surrounded me[c][b]; in the name of Yahweh I cut them down.
translation:
  language: de
  text: Sie umringten mich, ja, sie umringten mich; im Namen Jahwes werde ich sie niederschlagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde ich sie abschneiden“, „werde ich sie ausrotten“ oder „werde ich sie zurückschlagen“. Die Bedeutung des seltenen hebräischen Verbs ist umstritten; es bezeichnet jedenfalls ein entschiedenes Vorgehen gegen die Angreifer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַבּוּנִי … סְבָבוּנִי
  choice: Sie umringten mich … sie umringten mich
  rationale: Beide Formen gehen auf סבב zurück. Die Wiederholung wird bewahrt, weil sie Bedrängnis und poetischen Nachdruck ausdrückt; „umringen“ gibt die feindliche Einschließung natürlich wieder.
- source_word: גַם
  choice: ja
  rationale: Hier verstärkt גַם die wiederholte Aussage; „ja“ gibt diesen bestätigenden Nachdruck im Deutschen knapp wieder.
- source_word: בְּשֵׁם יְהוָה
  choice: im Namen Jahwes
  rationale: Die Wendung bezeichnet das Handeln unter Berufung auf die Macht und Autorität des mit seinem Eigennamen genannten Gottes.
- source_word: כִּי
  choice: nicht eigens wiedergegeben
  rationale: כִּי hat hier wahrscheinlich bekräftigende beziehungsweise emphatische Funktion. Der deutsche Satzfluss gibt den Nachdruck auch ohne ein zusätzliches „denn“ oder „ja“ wieder.
- source_word: אֲמִילַם
  choice: wehrte ich sie ab
  rationale: Die schwierige Hifil-Form von מול bezeichnet hier eine entschlossene Handlung gegen die Angreifer. „Abwehren“ ist im Kontext sinnvoll, ohne die lexikalisch umstrittene Vorstellung eines buchstäblichen Niedermähens festzuschreiben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn im Deutschen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art der durch אֲמִילַם bezeichneten Überwindung
  choice: wehrte ich sie ab
  alternative: schnitt ich sie nieder / vernichtete ich sie
  rationale: Die seltene Verbform ist umstritten. Die Hauptfassung wahrt die entschlossene Gegenwehr, während die Fußnote die stärkere, bildhafte Deutung offenhält.
translation_notes:
  register: Moderne, würdige Psalmsprache mit klarer poetischer Wiederholung. „Jahwe“ bewahrt den Gottesnamen; „umringen“ ist anschaulich und nicht altertümlich. Die Fußnote hält die echte lexikalische Unsicherheit bei אֲמִילַם offen.
