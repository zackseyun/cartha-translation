id: PSA.118.17
reference: Psalms 118:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹֽא אָמ֥וּת כִּי אֶֽחְיֶ֑ה וַ֝/אֲסַפֵּ֗ר מַֽעֲשֵׂ֥י יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/017.yaml
  text: I will not die[a], but I will live and recount the deeds of Yah.
translation:
  language: de
  text: Ich werde nicht sterben, sondern leben und die Taten Jahs[a] erzählen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Jah“, die poetische Kurzform des Gottesnamens; häufig wird allgemeiner „der HERR“ übersetzt.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא אָמוּת
  choice: Ich werde nicht sterben
  rationale: Das Qal-Imperfekt in der ersten Person Singular drückt hier im poetischen Zusammenhang eine zuversichtliche Aussage über die Zukunft aus.
- source_word: כִּי
  choice: sondern
  rationale: 'Nach der Verneinung markiert כִּי hier den adversativen Gegensatz: nicht sterben, sondern leben.'
- source_word: אֶחְיֶה
  choice: leben
  rationale: Das Qal-Imperfekt steht parallel zu „werde nicht sterben“; im Deutschen kann das gemeinsame Hilfsverb „werde“ natürlich auf beide Verben bezogen werden.
- source_word: וַאֲסַפֵּר
  choice: und … erzählen
  rationale: Das Piel von ספר bezeichnet das berichtende Erzählen oder Verkünden; „erzählen“ ist gegenwärtiges, natürliches Deutsch und bewahrt den Bezug auf Gottes Taten.
- source_word: מַעֲשֵׂי
  choice: die Taten
  rationale: Der Konstruktplural von מַעֲשֶׂה bezeichnet vollbrachte Handlungen; „Taten“ ist prägnant und würdevoll.
- source_word: יָהּ
  choice: Jahs
  rationale: יָהּ ist die poetische Kurzform des Gottesnamens. Der deutsche Genitiv „Jahs“ fügt sich natürlich in „die Taten Jahs“ ein und bewahrt die Namensform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יָהּ
  choice: Jah
  alternative: der HERR
  rationale: Der hebräische Text verwendet nicht den vollen Namen יהוה, sondern dessen poetische Kurzform יָהּ. Die Transliteration „Jah“ wahrt diesen formalen Unterschied, ohne den Namen zu einem Titel zu verallgemeinern.
- issue: Verhältnis von Nichtsterben und Leben
  choice: nicht … sondern
  alternative: nicht … denn
  rationale: Die antithetische Aussage wird im Kontext am natürlichsten adversativ verstanden. Die Übersetzung bewahrt die pointierte Gegenüberstellung, ohne darüber hinaus eine bestimmte Lehre über Tod oder Unsterblichkeit einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller poetischer Form. Das vorangestellte „Ich“ und das einmalige Hilfsverb „werde“ erhalten die Parallelität, ohne steif zu wirken.
