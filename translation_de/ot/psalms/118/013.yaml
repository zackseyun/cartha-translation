  text: דַּחֹ֣ה דְחִיתַ֣/נִי לִ/נְפֹּ֑ל וַ֖/יהוָ֣ה עֲזָרָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/013.yaml
  text: You pushed me hard so that I might fall[b][a], but Yahweh helped me.
translation:
  language: de
  text: Du hast mich heftig gestoßen, damit ich falle[a]; doch Jahwe half mir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Stoßend hast du mich gestoßen“ – eine hebräische Verstärkung, die auch mit „du hast mich mit Gewalt gestoßen“ wiedergegeben werden kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und Jahwe half mir“. Das hebräische Bindewort kann schlicht „und“ bedeuten; im Zusammenhang liegt jedoch der Gegensatz „doch“ nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּחֹה דְחִיתַנִי
  choice: du hast mich heftig gestoßen
  rationale: Der Infinitivus absolutus דַּחֹה verstärkt das folgende finite Verb. Im natürlichen Deutschen wird die emphatische Wiederholung am besten adverbial mit „heftig“ wiedergegeben; „stoßen“ bewahrt die feindselige, körperlich-drängende Bedeutung.
- source_word: לִנְפֹּל
  choice: damit ich falle
  rationale: Der Infinitiv mit ל kann Zweck oder angestrebtes Ergebnis ausdrücken. „Damit ich falle“ erhält diese Spannung und legt nicht stärker als der hebräische Text fest, ob der Sturz tatsächlich eintrat.
- source_word: וַיהוָה
  choice: doch Jahwe
  rationale: Das Waw kann schlicht „und“ bedeuten, markiert im Zusammenhang aber naheliegend den Gegensatz zwischen dem Angriff und Jahwes Hilfe. „Doch“ gibt diesen Kontrast knapp wieder.
- source_word: עֲזָרָנִי
  choice: half mir
  rationale: Die Qal-Perfektform mit Objektsuffix bedeutet unmittelbar „er half mir“. Das deutsche Präteritum ist in poetischer Erzählung natürlich und prägnant.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen יהוה. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis der beiden Satzhälften
  choice: doch
  alternative: und
  rationale: Der Zusammenhang legt eine kontrastive Funktion des Waw nahe, ohne dass dessen grundsätzlich additive Bedeutung ausgeschlossen wäre; deshalb wird die Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Die emphatische hebräische Konstruktion wird idiomatisch wiedergegeben; Zweck beziehungsweise angestrebtes Ergebnis und die mögliche additive Lesart des Bindeworts bleiben erkennbar.
