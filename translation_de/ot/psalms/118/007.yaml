  text: Yahweh is among my helpers[b][a]; I myself will look on my haters.
translation:
  language: de
  text: Jahwe steht mir bei, zusammen mit meinen Helfern[a]; ich selbst werde auf diejenigen blicken[b], die mich hassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe ist bei meinen Helfern.“ Die hebräische Konstruktion kann hervorheben, dass Jahwe zugunsten des Psalmisten inmitten seiner Helfer steht; der Plural „Helfer“ sollte nicht ohne Weiteres zu „mein Helfer“ geglättet werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ich werde sehen“ beziehungsweise „ich werde triumphierend auf diejenigen blicken, die mich hassen“. Die hebräische Wendung kann einschließen, dass der Psalmist den Fall seiner Gegner erlebt, sagt dies aber nicht ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: לִי
  choice: ist für mich
  rationale: Die Präposition ל mit Suffix bezeichnet hier die Hinwendung beziehungsweise das Eintreten zugunsten des Psalmisten; „für mich“ bewahrt diesen Zug.
- source_word: בְּעֹזְרָי
  choice: unter meinen Helfern
  rationale: Die Form enthält בְּ plus einen pluralischen Ausdruck („meine Helfer“). Die Wiedergabe erhält den Plural und die mögliche Bedeutung, dass Jahwe inmitten der Helfenden auf der Seite des Psalmisten steht.
- source_word: וַאֲנִי
  choice: ich
  rationale: Das selbstständige Pronomen setzt einen leichten Nachdruck. Im Deutschen trägt die ausdrückliche Nennung von „ich“ diesen ausreichend, ohne das stärkere „ich selbst“ erzwingen zu müssen.
- source_word: אֶרְאֶה
  choice: werde … blicken
  rationale: ראה mit ב kann hier das Hinschauen auf die Hassenden beziehungsweise das Erleben ihres Ausgangs ausdrücken. „Blicken“ erhält die Bildsprache, ohne einen Triumph ausdrücklich hinzuzufügen.
- source_word: בְשֹׂנְאַי
  choice: auf die …, die mich hassen
  rationale: Der substantivierte Partizipialausdruck bezeichnet konkret diejenigen, die den Psalmisten hassen; die natürliche deutsche Relativkonstruktion ist genauer als das allgemeinere „meine Feinde“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt dessen Funktion als persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Art von Jahwes Beistand
  choice: für mich unter meinen Helfern
  alternative: mein Helfer; bei meinen Helfern
  rationale: Der pluralische Ausdruck „meine Helfer“ bleibt erhalten. Dadurch wird weder ausgeschlossen, dass Jahwe selbst hilft, noch wird die syntaktische Spannung vorschnell zu der Einzelaussage „Jahwe ist mein Helfer“ geglättet.
- issue: Blick auf die Hassenden
  choice: werde auf die blicken, die mich hassen
  alternative: werde triumphierend den Untergang derer sehen, die mich hassen
  rationale: Der Kontext kann einen triumphierenden Blick auf den Ausgang der Gegner nahelegen, doch der Vers nennt weder Triumph noch Untergang ausdrücklich. Die Übersetzung lässt diese Implikation offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche pluralische Konstruktion wird bewusst bewahrt; die Relativformulierung „die mich hassen“ klingt natürlicher als „meine Hasser“.
