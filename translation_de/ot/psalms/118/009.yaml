  text: ט֗וֹב לַ/חֲס֥וֹת בַּ/יהוָ֑ה מִ֝/בְּטֹ֗חַ בִּ/נְדִיבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/009.yaml
  text: It is better to take refuge in Yahweh than to trust in nobles[a].
translation:
  language: de
  text: Es ist besser, bei Yahweh Zuflucht zu suchen, als auf Vornehme zu vertrauen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fürsten“. Das hebräische Wort bezeichnet Vornehme oder einflussreiche Herrscher; „Fürsten“ ist die traditionelle Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Es ist besser
  rationale: Das prädikative Adjektiv drückt in diesem Vergleich einen Vorzug aus; im Deutschen ist „Es ist besser“ natürlich und klar.
- source_word: לַחֲסוֹת
  choice: Zuflucht zu suchen
  rationale: Der Infinitiv von חסה bezeichnet, Schutz und Sicherheit bei jemandem zu suchen; die Formulierung bewahrt den aktiven Sinn.
- source_word: בַּיהוָה
  choice: bei Yahweh
  rationale: Die Präposition bezeichnet hier den, bei dem Zuflucht gesucht wird. Der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: מִבְּטֹחַ
  choice: als … zu vertrauen
  rationale: מן kennzeichnet den Vergleich, während בטח Vertrauen oder Sichverlassen ausdrückt. Die Infinitivkonstruktion entspricht dem ersten Versglied.
- source_word: בִּנְדִיבִים
  choice: auf Vornehme
  rationale: נְדִיבִים bezeichnet hier gesellschaftlich hochgestellte oder führende Menschen. „Vornehme“ ist weiter als „Fürsten“ und erhält die soziale Bedeutung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; die Transliteration bewahrt den Charakter als Eigenname.
- issue: Gegenstand menschlichen Vertrauens
  choice: Vornehme
  alternative: Fürsten
  rationale: Der Ausdruck wird nicht auf königliche Amtsträger verengt, sondern umfasst hochgestellte und einflussreiche Menschen; die traditionelle engere Deutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Infinitivkonstruktionen und der weisheitliche Vergleich des hebräischen Verses bleiben erhalten.
