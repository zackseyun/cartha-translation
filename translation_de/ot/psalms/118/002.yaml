  text: יֹֽאמַר נָ֥א יִשְׂרָאֵ֑ל כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/002.yaml
  text: Let Israel now say[b][a], “His steadfast love endures forever.”
translation:
  language: de
  text: 'Israel soll nun sagen[a]:


    »Denn seine treue Liebe[b] bleibt für immer!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische כִּי kann hier mit »denn« wiedergegeben werden; es kann auch den Inhalt des Bekenntnisses einleiten. Oder: »Israel soll sagen: ›Seine treue Liebe bleibt für immer.‹«'
    reason: lexical_alternative
  - marker: b
    text: »Treue Liebe« gibt das hebräische חֶסֶד wieder. Gemeint ist eine beständige, verlässliche Liebe und Güte; je nach Zusammenhang sind auch »Gnade«, »Güte«, »Barmherzigkeit« oder »bundestreue Liebe« möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמַר נָא
  choice: soll nun sagen
  rationale: Der Jussiv mit נָא ist hier eine auffordernde, liturgische Formulierung. „Soll nun sagen“ gibt sowohl den Aufruf als auch dessen Nachdruck in natürlichem Deutsch wieder.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname wird in seiner üblichen deutschen Form beibehalten und bezeichnet hier gemeinschaftlich das Volk Israel.
- source_word: כִּי
  choice: Ja, …
  rationale: Die Partikel leitet den Inhalt des Bekenntnisses ein und kann zugleich bekräftigend wirken. „Ja“ ergibt einen natürlichen deutschen Ruf; die möglichen Wiedergaben „denn“ und „dass“ werden in der Fußnote genannt.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Der Ausdruck bezeichnet unbegrenzte Dauer. Zusammen mit חֶסֶד formuliert „bleibt für immer“ den hebräischen Nominalsatz idiomatisch, ohne die Dauer abzuschwächen.
- source_word: חַסְדּוֹ
  choice: seine treue Liebe
  rationale: חֶסֶד verbindet Güte und Liebe mit beständiger Loyalität. „Treue Liebe“ ist verständliches modernes Deutsch und bewahrt diese Bedeutungsbreite besser als das engere „Barmherzigkeit“.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Lobpreis der bleibenden Bundestreue Gottes
  choice: treue Liebe
  alternative: Gnade; Güte; Barmherzigkeit; bundestreue Liebe
  rationale: „Treue Liebe“ wahrt den Zusammenhang von liebevoller Güte und verlässlicher Treue, ohne den Ausdruck auf eine einzelne konfessionelle Deutung oder ausschließlich auf Erbarmen einzuengen.
- issue: Funktion von כִּי im aufgerufenen Bekenntnis
  choice: bekräftigendes „Ja“ als Einleitung der direkten Rede
  alternative: „denn“; „dass“; bloße Einleitung der direkten Rede
  rationale: Das Hebräische lässt sowohl eine begründende als auch eine inhaltseinleitende beziehungsweise bekräftigende Nuance zu. Der Haupttext verwendet eine natürliche liturgische Bekräftigung; die echte Mehrdeutigkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderner, würdevoller und liturgisch sprechbarer Standarddeutsch-Register. Die Zeilentrennung hebt Aufruf und Gemeinderuf hervor. „Treue Liebe“ vermeidet sowohl archaisches „Huld“ als auch eine unnötig enge Festlegung.
