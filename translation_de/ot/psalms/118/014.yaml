id: PSA.118.14
reference: Psalms 118:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עָזִּ֣/י וְ/זִמְרָ֣ת יָ֑הּ וַֽ/יְהִי לִ֝֗/י לִֽ/ישׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/014.yaml
  text: Yah is my strength and song[a], and he has become my salvation.
translation:
  language: de
  text: Jah[a] ist meine Stärke und mein Lied; er ist mir zur Rettung geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier die Kurzform des Gottesnamens „Jah“, nicht die volle Form, die sonst als „der HERR“ wiedergegeben wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזִּי
  choice: meine Stärke
  rationale: עֹז bezeichnet Stärke oder Macht. „Meine Stärke“ ist im Deutschen natürlich und bewahrt die persönliche Aussage des Suffixes.
- source_word: וְזִמְרָת
  choice: und mein Lied
  rationale: זִמְרָה bezeichnet hier am ehesten ein Lied bzw. einen Gesang. „Mein Lied“ bewahrt die knappe poetische Parallelformel, die auch in 2. Mose 15,2 und Jesaja 12,2 begegnet.
- source_word: יָהּ
  choice: Jah
  rationale: יָהּ ist die Kurzform des Gottesnamens. Die Transliteration „Jah“ gibt diese vom Tetragramm unterschiedene Form präzise wieder.
- source_word: וַיְהִי
  choice: ist … geworden
  rationale: Die Verbform bezeichnet ein eingetretenes Ergebnis. Das deutsche Perfekt gibt diesen resultativen Sinn natürlich wieder.
- source_word: לִי
  choice: mir
  rationale: Die Präposition ל wird ausdrücklich als „mir“ wiedergegeben und bewahrt dadurch die hebräische Konstruktion, ohne sie in ein Possessiv umzudeuten.
- source_word: לִישׁוּעָה
  choice: zur Rettung
  rationale: יְשׁוּעָה kann Rettung, Heil oder Befreiung bezeichnen. „Rettung“ passt unmittelbar zum Kontext und lässt zugleich die umfassendere heilvolle Bedeutung offen.
theological_decisions:
- issue: Wiedergabe der Kurzform des Gottesnamens יָהּ
  choice: Jah
  alternative: der HERR
  rationale: Der hebräische Text verwendet nicht das volle Tetragramm יְהוָה, sondern dessen poetische Kurzform יָהּ. „Jah“ bewahrt diesen textlichen Unterschied, ohne einen Titel einzusetzen.
- issue: Bedeutungsumfang von יְשׁוּעָה
  choice: Rettung
  alternative: Heil
  rationale: „Rettung“ gibt die konkrete Erfahrung der Befreiung im Psalmkontext klar wieder, ohne die mögliche weiterreichende theologische Bedeutung des Ausdrucks auszuschließen.
translation_notes:
  register: Knappe, feierliche Psalmsprache in modernem Standarddeutsch. Der Parallelismus bleibt durch „meine Stärke und mein Lied“ erhalten; das Semikolon bildet den hebräischen Gedankenfortschritt klar ab.
