source:
  edition: WLC
  text: ט֗וֹב לַ/חֲס֥וֹת בַּ/יהוָ֑ה מִ֝/בְּטֹ֗חַ בָּ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/008.yaml
  text: It is better to take refuge in Yahweh than to trust in man[a].
translation:
  language: de
  text: Es ist besser, bei Jahwe Zuflucht zu suchen, als auf Menschen[a] zu vertrauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf den Menschen“; das hebräische Wort steht in der Einzahl und bezeichnet hier Menschen allgemein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Es ist besser
  rationale: Das prädikative Adjektiv leitet einen Vergleich ein; im Deutschen ergibt die Ergänzung „Es ist“ einen vollständigen, natürlichen Satz.
- source_word: לַחֲסוֹת
  choice: Zuflucht zu suchen
  rationale: חסה bezeichnet das Suchen beziehungsweise Nehmen von Zuflucht und bewahrt hier das Bild schützender Geborgenheit.
- source_word: בַּיהוָה
  choice: bei Jahwe
  rationale: Die Präposition bezeichnet den, bei dem Zuflucht gesucht wird; „bei“ ist im Deutschen mit „Zuflucht suchen“ idiomatisch. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: מִבְּטֹחַ
  choice: als … zu vertrauen
  rationale: מן mit dem Infinitiv bildet den Vergleich „besser … als“; בטח bezeichnet Vertrauen beziehungsweise Sichverlassen.
- source_word: בָּאָדָם
  choice: auf Menschen
  rationale: אָדָם steht singularisch-generisch für den Menschen beziehungsweise die Menschheit. Das im Deutschen natürliche generische „Menschen“ gibt den allgemeinen Gegensatz zu Jahwe wieder, ohne ihn auf einen einzelnen Mann zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Generische Bedeutung von אָדָם im Gegensatz zu Gott
  choice: Menschen
  alternative: den Menschen
  rationale: Gemeint ist menschliches Vertrauen allgemein. Der Plural ist im modernen Deutschen natürlich und geschlechtsübergreifend; die singularische Form des Hebräischen wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und der Gegensatz zwischen Zuflucht bei Jahwe und Vertrauen auf Menschen bleiben knapp und deutlich erhalten.
