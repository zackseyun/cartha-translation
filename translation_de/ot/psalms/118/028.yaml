  yaml_path: translation/ot/psalms/118/028.yaml
  text: You are my God[a], and I will give thanks to you; my God[b], I will exalt you.
translation:
  language: de
  text: Du bist mein Gott, und ich will dir danken[a]; mein Gott, ich will dich erhöhen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dich preisen. Das hebräische Verb kann im Zusammenhang der Psalmen sowohl Danken als auch Loben bezeichnen.'
