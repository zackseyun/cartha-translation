  - marker: b
    text: 'Oder: dich hoch preisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלִי
  choice: mein Gott
  rationale: אֵל mit dem Suffix der 1. Person Singular ist hier eine persönliche Anrede. »Mein Gott« gibt sie im Deutschen natürlich und präzise wieder.
- source_word: אַתָּה
  choice: du bist
  rationale: Das selbstständige Pronomen bildet mit אֵלִי einen verblosen Nominalsatz. Im Deutschen wird die Kopula ergänzt; die Voranstellung »Du bist« bewahrt die Betonung.
- source_word: וְאוֹדֶךָ
  choice: und ich will dir danken
  rationale: Die Hifil-Form von ידה bezeichnet in den Psalmen häufig dankendes Loben. »Dir danken« bewahrt den Dankaspekt und den Bezug auf das angesprochene Gegenüber.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Die zweite Gottesbezeichnung steht parallel zu אֵלִי und ist ebenfalls persönliche Anrede. Die Wiederholung »mein Gott« wahrt die poetische Struktur.
- source_word: אֲרוֹמְמֶךָ
  choice: ich will dich erheben
  rationale: Die Form von רום bezeichnet hier das Erhöhen beziehungsweise Verherrlichen Gottes. »Dich erheben« erhält das Bild und ist in gehobener deutscher Lobpreissprache verständlich.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnungen אֵלִי und אֱלֹהַי
  choice: mein Gott … mein Gott
  alternative: mein Mächtiger … mein Gott
  rationale: Beide Ausdrücke sind im Zusammenhang unmittelbare Anreden an Gott. Die gleiche Wiedergabe bewahrt die persönliche Hingabe und den poetischen Parallelismus, ohne eine zusätzliche dogmatische Unterscheidung einzutragen.
- issue: Bedeutung von ידה im Lobpsalm
  choice: danken
  alternative: preisen
  rationale: Das Verb verbindet in diesem Kontext Dank und Lob. »Danken« gibt die häufige Bedeutung der Hifil-Form wieder; die ebenfalls mögliche Lobnuance bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelität. Das wiederholte »mein Gott« und die beiden Willensbekundungen bilden den knappen hebräischen Versbau nach.
