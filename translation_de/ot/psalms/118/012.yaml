source:
  edition: WLC
  text: סַבּ֤וּ/נִי כִ/דְבוֹרִ֗ים דֹּ֭עֲכוּ כְּ/אֵ֣שׁ קוֹצִ֑ים בְּ/שֵׁ֥ם יְ֝הוָ֗ה כִּ֣י אֲמִילַֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/012.yaml
  text: They surrounded me like bees[a]; they went out like a fire among thorns. In the name of Yahweh[b], I surely cut them down.
translation:
  language: de
  text: Sie umringten mich wie Bienen; sie erloschen wie ein Dornenfeuer.[a] Im Namen Jahwes – ja, ich hieb sie nieder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie ein Feuer aus Dornen“. Das knappe hebräische Bild kann ein Dornenfeuer bezeichnen, das rasch aufflammt und ebenso rasch erlischt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ich schnitt sie ab“. Die Bedeutung des seltenen hebräischen Verbs ist nicht völlig sicher; wahrscheinlich bezeichnet es ein Abschneiden oder Niederhauen.'
    reason: alternative_reading
lexical_decisions:
- source_word: סַבּוּנִי
  choice: Sie umringten mich
  rationale: Das Verb סבב bezeichnet das Umgeben oder Einkreisen. „Umringten“ ist im Deutschen natürlich und bewahrt den bedrohlichen Charakter.
- source_word: כִדְבוֹרִים
  choice: wie Bienen
  rationale: Die Vergleichspartikel כ wird direkt wiedergegeben; das Bild eines dicht herandrängenden Bienenschwarms bleibt erhalten.
- source_word: דֹּעֲכוּ כְּאֵשׁ קוֹצִים
  choice: sie erloschen wie ein Dornenfeuer
  rationale: דעך bezeichnet das Erlöschen, besonders eines Feuers. אֵשׁ קוֹצִים ist knapp formuliert und meint ein Feuer aus oder unter Dornen, das heftig aufflammt und rasch erlischt.
- source_word: בְּשֵׁם יְהוָה
  choice: Im Namen Jahwes
  rationale: Die Wendung bezeichnet ein Handeln unter Berufung auf Jahwes Namen oder in seiner Vollmacht. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: כִּי
  choice: ja
  rationale: כִּי wirkt hier bekräftigend und nicht notwendig kausal. Das deutsche „ja“ erhält die emphatische Gewissheit.
- source_word: אֲמִילַם
  choice: ich hieb sie nieder
  rationale: Die Hifil-Form von מול kann „abschneiden“ beziehungsweise „niederhauen“ bedeuten. „Hieb sie nieder“ ist verständlich, bewahrt das gewaltsame Bild und harmonisiert nicht zu einer bloß defensiven Aussage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text bietet den Eigennamen יהוה. „Jahwe“ bewahrt diesen als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Art des Sieges über die Feinde
  choice: ich hieb sie nieder
  alternative: ich wehrte sie ab
  rationale: Die seltene Verbform lässt eine bildhafte Bedeutung wie „abschneiden/niederhauen“ zu. Die Übersetzung wahrt diese Schärfe, ohne den Vers als Aussage über eine bestimmte historische oder messianische Erfüllung festzulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper poetischer Satzführung. Das ungewöhnliche Bild des schnell verlöschenden Dornenfeuers und die lexikalische Unsicherheit des Schlussverbs werden nicht eingeebnet.
