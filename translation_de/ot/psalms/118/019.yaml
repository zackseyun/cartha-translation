  text: פִּתְחוּ לִ֥/י שַׁעֲרֵי צֶ֑דֶק אָֽבֹא בָ֝/ם אוֹדֶ֥ה יָֽהּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/019.yaml
  text: Open to me the gates of righteousness[c][b][a]; I will enter through them and give thanks to Yah.
translation:
  language: de
  text: Öffnet mir die Tore der Gerechtigkeit[a]! Ich will durch sie hineingehen und Jah danken[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Tore des Rechts«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Jah preisen«. »Jah« ist die Kurzform des Gottesnamens; manche Übersetzungen geben sie mit »der HERR« wieder.'
    reason: lexical_and_name_alternative
lexical_decisions:
- source_word: פִּתְחוּ
  choice: Öffnet
  rationale: Der Qal-Imperativ im maskulinen Plural richtet eine unmittelbare Aufforderung an mehrere Angesprochene.
- source_word: לִי
  choice: mir
  rationale: Die Präposition ל mit Suffix der 1. Person Singular wird im Deutschen bei »öffnen« natürlich mit dem Dativ wiedergegeben.
- source_word: שַׁעֲרֵי צֶדֶק
  choice: die Tore der Gerechtigkeit
  rationale: Die Constructusverbindung bezeichnet Tore, die durch צֶדֶק näher bestimmt sind. »Gerechtigkeit« bewahrt den religiös-ethischen Bedeutungsumfang; »Recht« bleibt möglich.
- source_word: אָבֹא בָם
  choice: Ich will durch sie hineingehen
  rationale: Das Imperfekt bezeichnet hier die beabsichtigte Handlung des Sprechers; בָם gibt bei Toren das Hindurchgehen an.
- source_word: אוֹדֶה
  choice: danken
  rationale: ידה im Hiphil bezeichnet in diesem Lobkontext vor allem das Danken beziehungsweise dankende Preisen. »Danken« ist hier die direkte und natürliche Wiedergabe.
- source_word: יָהּ
  choice: Jah
  rationale: יָהּ ist die Kurzform des Gottesnamens und wird daher als Name transliteriert, statt durch einen Titel ersetzt zu werden.
theological_decisions:
- issue: Wiedergabe der Kurzform des Gottesnamens יָהּ
  choice: Jah
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich die Kurzform יָהּ, nicht das Tetragramm יהוה. Die Transliteration bewahrt diese Unterscheidung.
- issue: Bedeutungsumfang von צֶדֶק
  choice: Gerechtigkeit
  alternative: Recht
  rationale: »Gerechtigkeit« lässt die kultische und ethische Dimension der Wendung offen, ohne sie ausschließlich auf Rechtsprechung einzuengen.
- issue: Bedeutungsumfang von אוֹדֶה
  choice: danken
  alternative: preisen
  rationale: Das Verb kann Danken und Preisen bezeichnen. Im Deutschen bildet »Jah danken« die Dankdimension unmittelbar ab; die Alternative wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Der Ausruf nach dem Imperativ entspricht der Dringlichkeit der Aufforderung; »hineingehen« macht die durch בָם bezeichnete Bewegung durch die Tore im Deutschen deutlich.
