id: PSA.118.29
reference: Psalms 118:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/029.yaml
  text: Give thanks to Yahweh[a], for he is good, for his steadfast love endures forever.
translation:
  language: de
  text: Dankt Jahwe, denn er ist gut; denn seine treue Liebe währt ewig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Denn ewig ist seine treue Liebe.“ Im Hebräischen steht hier kein ausdrückliches Verb.'
    reason: Die Übersetzung „währt“ macht die im hebräischen Nominalsatz nur implizite Beziehung für natürliches Deutsch ausdrücklich.
lexical_decisions:
- source_word: הוֹדוּ
  choice: Dankt
  rationale: Der Hifil-Imperativ Plural von ידה fordert hier im liturgischen Zusammenhang zum Danken auf. „Dankt“ ist prägnant, natürlich und bewahrt die direkte Anrede an die versammelte Gemeinschaft.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל kennzeichnet den Empfänger des Dankes. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, sodass der im Hebräischen ausdrücklich gebrauchte Eigenname erhalten bleibt.
- source_word: כִּי טוֹב
  choice: denn er ist gut
  rationale: כִּי führt die Begründung für den Aufruf zum Dank ein. Das im nominalen hebräischen Satz unausgesprochene Subjekt und die Kopula werden im Deutschen natürlich mit „er ist“ ausgedrückt.
- source_word: לְעוֹלָם
  choice: währt ewig
  rationale: לְעוֹלָם bezeichnet unbegrenzte Dauer. Das Verb „währt“ ist im Deutschen für eine fortbestehende Eigenschaft natürlich, macht jedoch eine im Hebräischen nur implizite Aussagebeziehung ausdrücklich.
- source_word: חַסְדּוֹ
  choice: seine treue Liebe
  rationale: חֶסֶד verbindet Güte und Zuwendung mit Beständigkeit und Loyalität. „Treue Liebe“ bewahrt diese Bedeutungsbreite besser als das allgemeinere „Güte“ oder das enger gefasste „Barmherzigkeit“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen wieder, während „der HERR“ die traditionelle jüdische Lesetradition repräsentiert, den Namen aber im Zieltext ersetzt.
- issue: Aussage über die Dauer von חֶסֶד
  choice: seine treue Liebe währt ewig
  alternative: ewig ist seine treue Liebe
  rationale: Der hebräische Nominalsatz enthält kein ausdrückliches Verb. „Währt ewig“ ergibt idiomatisches Deutsch, ohne die Beständigkeit der Liebe auf einen bestimmten theologischen Mechanismus festzulegen; die formnähere Möglichkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Kurzer, würdevoller und liturgisch gut sprechbarer Parallelismus in modernem Standarddeutsch. Das Semikolon gliedert die beiden mit כִּי eingeleiteten Begründungen, ohne ihren engen Zusammenhang aufzulösen.
