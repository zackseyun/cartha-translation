base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/018.yaml
  text: Yah has surely disciplined me[a], but he has not given me over to death.
translation:
  language: de
  text: Jah[a] hat mich schwer gezüchtigt, aber dem Tod hat er mich nicht preisgegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der HERR“. Im Hebräischen steht hier die poetische Kurzform des Gottesnamens: „Jah“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסֹּר יִסְּרַנִּי
  choice: hat mich hart zurechtgewiesen
  rationale: Der vorangestellte absolute Infinitiv verstärkt die finite Verbform. „Hart“ gibt diese emphatische Kraft natürlich wieder; „zurechtgewiesen“ bewahrt den korrigierenden Sinn von יסר, ohne die Aussage unnötig auf reine Bestrafung einzuengen.
- source_word: יָּהּ
  choice: Jah
  rationale: Die poetische Kurzform des Gottesnamens wird als Name transliteriert und nicht mit der vollständigen Form יהוה gleichgesetzt.
- source_word: וְלַמָּוֶת
  choice: aber dem Tod
  rationale: Das ו hat hier im Zusammenhang einen adversativen Sinn. לַמָּוֶת bezeichnet das Ziel beziehungsweise die Macht, der der Sprecher nicht überlassen wurde.
- source_word: לֹא נְתָנָנִי
  choice: hat er mich nicht preisgegeben
  rationale: נתן mit Personenobjekt und ל bezeichnet hier das Übergeben oder Ausliefern an eine Macht. „Preisgegeben“ ist im Deutschen idiomatisch und bewahrt diese stärkere Bedeutung.
theological_decisions:
- issue: Wiedergabe der poetischen Kurzform יָּהּ
  choice: Jah
  alternative: der HERR
  rationale: „Jah“ erhält die im Hebräischen erkennbare Kurzform des Gottesnamens. Die Alternative „der HERR“ ist geläufiger, würde jedoch den Unterschied zur vollständigen Namensform einebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Gegenüberstellung von strenger Zurechtweisung und Bewahrung vor dem Tod bleibt erhalten.
