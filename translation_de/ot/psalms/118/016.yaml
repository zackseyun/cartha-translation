  terminology: „Jahwe“ ist eine etablierte deutsche Wiedergabe des Tetragramms. Die wörtlich beibehaltene „rechte Hand“ wahrt die anthropomorphe Bildsprache. Die Fußnoten bieten sachgerechte lexikalische Alternativen, ohne eine theologische oder konfessionelle Auslegung festzulegen.
