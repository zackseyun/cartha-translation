  source_fidelity: Die Übersetzung gibt יְמִין יְהוָה in beiden Halbversen treffend als „die rechte Hand Jahwes“ wieder und bewahrt damit das poetische Bild. „Ist hoch erhoben“ entspricht der stativisch-resultativen Aussage von רוֹמֵמָה; „vollbringt Mächtiges“ gibt die idiomatische Verbindung עֹשָׂה חָיִל angemessen und ohne unnötige Verengung auf einen konkreten militärischen Sieg wieder.
