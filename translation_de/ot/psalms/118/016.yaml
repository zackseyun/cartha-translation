id: PSA.118.16
reference: Psalms 118:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְמִ֣ין יְ֭הוָה רוֹמֵמָ֑ה יְמִ֥ין יְ֝הוָה עֹ֣שָׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/016.yaml
  text: The right hand of Yahweh is exalted[b][a]; the right hand of Yahweh does valiantly.
translation:
  language: de
  text: Die rechte Hand Jahwes ist hoch erhoben[a]; die rechte Hand Jahwes vollbringt Mächtiges[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ist erhöht«; dem Zusammenhang nach möglicherweise auch: »triumphiert«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »handelt machtvoll« beziehungsweise »erringt den Sieg«. Der hebräische Ausdruck bezeichnet kraftvolles, erfolgreiches oder siegreiches Handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִין
  choice: rechte Hand
  rationale: Bewahrt das konkrete hebräische Bild für Jahwes Kraft und siegreiches Eingreifen, statt es im Haupttext abstrakt als »Macht« wiederzugeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder und ersetzt ihn nicht durch einen Titel.
- source_word: רוֹמֵמָה
  choice: ist hoch erhoben
  rationale: Die Form bezeichnet einen Zustand des Erhobenseins beziehungsweise der Erhöhung. »Ist hoch erhoben« wahrt das poetische Bild und lässt den im Kontext möglichen Triumph anklingen, ohne ihn ausdrücklich festzulegen.
- source_word: עֹשָׂה חָיִל
  choice: vollbringt Mächtiges
  rationale: Die Verbindung bezeichnet kraftvolles, erfolgreiches oder siegreiches Handeln. Die deutsche Wendung ist natürlich und bewahrt zugleich die Bedeutungsbreite des hebräischen Ausdrucks.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Handeln
  choice: Das Bild »rechte Hand Jahwes« wird wörtlich beibehalten.
  alternative: »Jahwes Macht«
  rationale: Die konkrete Bildsprache ist für die Poesie und ihre Aussage über Jahwes machtvolles, siegreiches Eingreifen wesentlich; eine abstrakte Wiedergabe würde sie verflachen.
- issue: Siegesbedeutung der beiden Prädikate
  choice: Die Hauptfassung deutet Triumph und Sieg an, legt diese Bedeutungsnuance aber nicht ausschließlich fest.
  alternative: »triumphiert« beziehungsweise »erringt den Sieg«
  rationale: רוֹמֵמָה kann Erhöhung oder Erhobensein ausdrücken, und עֹשָׂה חָיִל kann mächtiges wie siegreiches Handeln bezeichnen. Die Mehrdeutigkeit wird in den Fußnoten offengelegt.
translation_notes:
  register: Moderne, würdige Standardsprache mit dichterischem Parallelismus. »Hoch erhoben« ist anschaulich und geläufig; »vollbringt Mächtiges« gibt das hebräische Idiom natürlich wieder, ohne seine mögliche Siegesnuance zu verengen.
