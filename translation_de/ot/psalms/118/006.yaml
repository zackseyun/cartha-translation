  text: יְהוָ֣ה לִ֭/י לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה לִ֣/י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/006.yaml
  text: Yahweh is for me[a]; I will not fear[b]. What can man do to me?
translation:
  language: de
  text: Jahwe ist für mich; ich fürchte mich nicht. Was kann ein Mensch mir antun?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Was wird ein Mensch mir tun?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: לִי
  choice: für mich
  rationale: 'Die Präposition bezeichnet hier Beistand und Parteinahme: Jahwe steht auf der Seite des Beters.'
- source_word: לֹא אִירָא
  choice: ich fürchte mich nicht
  rationale: Das hebräische Imperfekt kann gegenwärtige Zuversicht beziehungsweise entschlossene Haltung ausdrücken; die deutsche Form ist knapp und natürlich.
- source_word: מַה יַעֲשֶׂה לִי
  choice: Was kann … mir antun?
  rationale: Die rhetorische Frage bezeichnet die begrenzte Macht des Menschen. „Antun“ gibt עשה mit der betroffenen Person idiomatisch wieder.
- source_word: אָדָם
  choice: ein Mensch
  rationale: Der generisch gebrauchte Singular meint einen einzelnen Menschen stellvertretend für Menschen überhaupt und bildet den Kontrast zu Jahwe ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen; seine Wiedergabe als Eigenname bewahrt diese Unterscheidung.
- issue: Zeit- und Aussagewert von לֹא אִירָא
  choice: ich fürchte mich nicht
  alternative: ich werde mich nicht fürchten
  rationale: Das Imperfekt lässt sowohl eine gegenwärtige Haltung als auch entschlossene künftige Zuversicht zu. Im Deutschen drückt das Präsens die allgemeine Vertrauensaussage natürlich aus.
- issue: Rhetorischer Aussagewert von מַה יַעֲשֶׂה
  choice: Was kann … antun?
  alternative: Was wird … antun?
  rationale: „Kann“ macht die im Kontext gemeinte Begrenztheit menschlicher Macht deutlich; die wörtlichere Zukunftsform bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Der generische Singular אָדָם wird inklusiv und quellennah als „ein Mensch“ wiedergegeben.
