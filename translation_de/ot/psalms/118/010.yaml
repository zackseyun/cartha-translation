  text: Alle Völker umringten mich; im Namen des HERRN wehre ich sie gewiss ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Namen des HERRN mache ich ihnen ein Ende“; die Bedeutung des seltenen hebräischen Verbs ist unsicher.'
