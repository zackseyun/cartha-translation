lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: Alle Völker
  rationale: Gibt die umfassende Formulierung des Hebräischen direkt und natürlich wieder.
- source_word: סְבָבוּנִי
  choice: umringten mich
  rationale: Bewahrt das Bild feindlicher Kräfte, die den Sprecher ringsum einschließen.
- source_word: בְּשֵׁם יְהוָה
  choice: im Namen des HERRN
  rationale: Entspricht der traditionellen deutschen Wiedergabe des Tetragramms und bezeichnet das Handeln unter Berufung auf Gottes Namen und Vollmacht.
- source_word: כִּי אֲמִילַם
  choice: wehrte ich sie gewiss ab
  rationale: Das seltene Verb kann im Zusammenhang das Zurückschlagen oder Vernichten der Angreifer bezeichnen; „abwehren“ erhält das Kampfgeschehen, ohne die lexikalische Unsicherheit einseitig auf völlige Vernichtung festzulegen. כִּי wird hier als nachdrückliche Bekräftigung verstanden.
theological_decisions:
- issue: Art und Ausmaß des Sieges über die Völker
  choice: wehrte ich sie gewiss ab
  alternative: rottete ich sie aus / schnitt ich sie ab
  rationale: Die Übersetzung wahrt die Aussage eines entschiedenen, im Namen des HERRN errungenen Sieges, ohne aus dem seltenen Verb zwingend eine vollständige Ausrottung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus bleibt knapp; „HERR“ folgt der etablierten Wiedergabe des Gottesnamens.
