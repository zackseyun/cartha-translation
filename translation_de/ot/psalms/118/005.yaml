  text: Out of my distress I called on Yah[a]; Yah answered me with spaciousness.
translation:
  language: de
  text: Aus der Enge rief ich zu Jah; Jah antwortete mir mit Weite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher möglich: „Aus dem engen Ort rief ich zu Jah; Jah antwortete mir mit/in einem weiten Raum.“ Das Hebräische stellt räumlich die Enge der Bedrängnis der Weite der Befreiung gegenüber. Die Präposition kann hier unterschiedlich aufgefasst werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַמֵּצַר
  choice: Aus der Enge
  rationale: Die Wendung bezeichnet wörtlich einen beengten Ort und bildlich Bedrängnis. „Aus der Enge“ bewahrt im Deutschen beides und bildet einen natürlichen Gegensatz zu „ins Weite“.
- source_word: קָרָאתִי
  choice: rief ich zu
  rationale: קרא bezeichnet hier den an Gott gerichteten Hilferuf. „Zu … rufen“ ist im Deutschen idiomatisch und bewahrt die Gebetssituation.
- source_word: יָהּ
  choice: Jah
  rationale: Jah ist die kurze poetische Form des Gottesnamens. Die Transliteration erhält die besondere hebräische Form und ihre Wiederholung.
- source_word: עָנָנִי
  choice: antwortete mir
  rationale: Das Verb mit Objektsuffix bedeutet direkt „antwortete mir“.
- source_word: בַמֶּרְחָב
  choice: und führte mich ins Weite
  rationale: מֶרְחָב bezeichnet Weite beziehungsweise einen weiten Raum und steht im bewussten Gegensatz zur Enge. Die Präposition ב kann hier räumlich oder als Angabe der Weise beziehungsweise Wirkung verstanden werden; die Ergänzung „führte mich“ macht die Zielvorstellung natürlich verständlich, wird aber wegen der knappen hebräischen Form in der Fußnote ausgewiesen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יָהּ
  choice: Jah
  alternative: der HERR
  rationale: Der Ausgangstext verwendet nicht das volle Tetragramm, sondern dessen kurze poetische Form. „Jah“ bewahrt diese lexikalische und dichterische Besonderheit ohne konfessionelle Deutung.
- issue: Verhältnis von Gottes Antwort und räumlicher Befreiung
  choice: Jah antwortete mir und führte mich ins Weite
  alternative: Jah antwortete mir in der Weite / mit Weite
  rationale: Der Parallelismus stellt Enge und Weite gegenüber. Da die Präposition ב mehrere Deutungen zulässt und das Hebräische kein ausdrückliches Verb für „führen“ enthält, bleibt die formal nähere Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Gegenüberstellung „Enge – Weite“ bleibt erhalten; „Jah“ gibt die kurze Form des hebräischen Gottesnamens wieder.
