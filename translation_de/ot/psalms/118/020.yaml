source:
  edition: WLC
  text: זֶֽה הַ/שַּׁ֥עַר לַ/יהוָ֑ה צַ֝דִּיקִ֗ים יָבֹ֥אוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/020.yaml
  text: This is the gate of Yahweh[a]; the righteous will enter through it.
translation:
  language: de
  text: Dies ist das Tor Jahwes[a]; die Gerechten werden durch es hineingehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „das Tor für Jahwe“ oder „das Tor zu Jahwe“. Die hebräische Präposition kann Zugehörigkeit, Beziehung oder Richtung ausdrücken.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: זֶה
  choice: Dies ist
  rationale: Das Demonstrativpronomen identifiziert das gezeigte Tor; im Deutschen wird die Kopula idiomatisch ergänzt.
- source_word: הַשַּׁעַר
  choice: das Tor
  rationale: שַׁעַר bezeichnet konkret ein Tor oder einen Torzugang und bewahrt hier das Bild des kultischen beziehungsweise prozessionalen Zugangs.
- source_word: לַיהוָה
  choice: Jahwes
  rationale: Die Präposition ל kann Zugehörigkeit, Beziehung oder Richtung ausdrücken. Der Genitiv ist im Kontext eine natürliche deutsche Wiedergabe, ohne die anderen Möglichkeiten zu leugnen.
- source_word: צַדִּיקִים
  choice: die Gerechten
  rationale: Das substantivierte Adjektiv im Plural bezeichnet Menschen, die durch Gerechtigkeit gekennzeichnet sind; „die Gerechten“ ist im Deutschen prägnant und sachgerecht.
- source_word: יָבֹאוּ
  choice: werden … hineingehen
  rationale: Das Qal-Imperfekt von בוא bezeichnet hier ein zukünftiges beziehungsweise als gewiss dargestelltes Eintreten. „Hineingehen“ passt natürlich zu einem Tor.
- source_word: בוֹ
  choice: durch es
  rationale: ב mit dem pronominalen Suffix verweist auf das Tor; im Deutschen geht man durch ein Tor. Die getrennte Form „durch es“ lässt den Rückbezug ausdrücklich bestehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt den Gottesnamen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis des Tores zu Jahwe in לַיהוָה
  choice: das Tor Jahwes
  alternative: das Tor für Jahwe / das Tor zu Jahwe
  rationale: Der hebräische Ausdruck lässt Zugehörigkeit, Beziehung und Zielrichtung zu. Der Genitiv passt gut zum Zusammenhang; die echte Mehrdeutigkeit wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Tor-Metapher und die knappe Parallelstruktur bleiben erhalten; die Mehrdeutigkeit von ל wird nicht im Haupttext übererklärt, sondern in der Fußnote ausgewiesen.
