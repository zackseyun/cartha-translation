id: PSA.118.1
reference: Psalms 118:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: de
  text: Dankt Jahwe[a], denn er ist gut, denn seine treue Liebe[b] bleibt für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Bundestreue“. Das hebräische חֶסֶד bezeichnet beständige, loyale Liebe und Güte, oft im Zusammenhang eines Bundes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Dankt
  rationale: Der Hifil-Imperativ Plural von ידה fordert hier die versammelte Gemeinschaft zum Dank beziehungsweise Lob auf. „Dankt“ gibt die liturgische Aufforderung knapp und idiomatisch wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, sodass der im hebräischen Text ausdrücklich gebrauchte Eigenname erkennbar bleibt.
- source_word: כִּי טוֹב
  choice: denn er ist gut
  rationale: כִּי begründet die Aufforderung, und טוֹב bezeichnet umfassend Gottes Gutsein. Das im Hebräischen unausgesprochene Subjekt wird im Deutschen zur natürlichen Satzbildung mit „er“ ergänzt.
- source_word: חַסְדּוֹ
  choice: seine treue Liebe
  rationale: חֶסֶד verbindet liebevolle Zuwendung mit Beständigkeit, Loyalität und häufig auch einem Bundesbezug. „Treue Liebe“ bewahrt diese Bedeutungsbreite in verständlichem Deutsch.
- source_word: לְעוֹלָם
  choice: bleibt für immer
  rationale: Wörtlich bezeichnet die Wendung eine unbegrenzte Dauer. Das ergänzte Verb „bleibt“ macht den verblosen hebräischen Satz im Deutschen natürlich und bringt die fortdauernde Beständigkeit zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ wahrt diesen Eigennamecharakter; die traditionelle Wiedergabe wird in einer Fußnote genannt.
- issue: Wiedergabe von חֶסֶד
  choice: treue Liebe
  alternative: Bundestreue
  rationale: „Treue Liebe“ hält Zuwendung und Verlässlichkeit zusammen, ohne den möglichen Bundesbezug zur alleinigen Bedeutung zu verengen. „Bundestreue“ bleibt als sachlich mögliche, stärker spezifizierende Wiedergabe in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper liturgischer Satzform. Die Wiederholung von „denn“ bewahrt die hebräische Parallelstruktur; „bleibt für immer“ ist bewusst allgemeinverständlich und nicht altertümlich.
