source:
  edition: WLC
  text: יְקַֽלְלוּ הֵמָּה֮ וְ/אַתָּ֪ה תְבָ֫רֵ֥ךְ קָ֤מוּ וַ/יֵּבֹ֗שׁוּ וְֽ/עַבְדְּ/ךָ֥ יִשְׂמָֽח־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/028.yaml
  text: They may curse[a], but you will bless. They rise up and are put to shame[b], but your servant will rejoice.
translation:
  language: de
  text: Sie mögen fluchen[a], du aber wirst segnen. Sie erheben sich und werden beschämt[b], dein Diener aber wird sich freuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lass sie fluchen, du aber segne“, wenn man die beiden ersten Verbformen auffordernd beziehungsweise zulassend versteht.'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch: „Sie erheben sich und werden beschämt.“ Das Sich-Erheben kann feindseliges Vorgehen andeuten; ausdrücklich genannt wird jedoch nur, dass sie sich erheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקַֽלְלוּ
  choice: Sie mögen fluchen
  rationale: Das Piel-Imperfekt kann hier zukünftig, permissiv oder konzessiv verstanden werden. „Sie mögen fluchen“ bewahrt die konzessive Nuance im Gegensatz zu Gottes Segnen, ohne den Satz als ausdrücklichen Wunsch festzulegen.
- source_word: הֵמָּה
  choice: Sie
  rationale: Das selbstständige Pronomen hebt die Gegner als Subjekt hervor. Im Deutschen trägt das ausdrücklich gesetzte „Sie“ den nötigen Kontrast, ohne das stärker markierte „sie selbst“ zu verlangen.
- source_word: וְ/אַתָּה
  choice: du aber
  rationale: Das formal verbindende וְ hat hier wegen des Gegenübers von menschlichem Fluchen und göttlichem Segnen adversative Bedeutung.
- source_word: תְבָ֫רֵךְ
  choice: wirst segnen
  rationale: Das Piel-Imperfekt der zweiten Person Singular bezeichnet Gottes entgegengesetztes Handeln und wird im Zusammenhang natürlich zukünftig wiedergegeben.
- source_word: קָ֤מוּ
  choice: Sie haben sich erhoben
  rationale: Das Qal-Perfekt von קום bedeutet wörtlich „aufstehen/sich erheben“. Die Formulierung lässt eine feindselige Absicht anklingen, fügt aber keinen im Text nicht ausdrücklich genannten Angriff ein.
- source_word: וַ/יֵּבֹ֗שׁוּ
  choice: sind zuschanden geworden
  rationale: בוש bezeichnet Beschämung oder Schande. „Zuschanden werden“ gibt hier die eingetretene öffentliche Niederlage wieder und passt zum Perfektzusammenhang.
- source_word: וְֽ/עַבְדְּ/ךָ֥
  choice: dein Diener aber
  rationale: „Dein Diener“ ist die demütige Selbstbezeichnung des Betenden. Das וְ wird wegen des Kontrasts zwischen der Schande der Gegner und seiner Freude mit „aber“ wiedergegeben.
- source_word: יִשְׂמָֽח
  choice: wird sich freuen
  rationale: Das Qal-Imperfekt von שמח bezeichnet die künftige Freude des Betenden und bildet den Gegenpol zur Schande der Gegner.
theological_decisions:
- issue: Bezug von „dein Diener“
  choice: Der Beter bezeichnet sich selbst demütig als Gottes Diener.
  alternative: Die Wendung könnte allgemeiner auf einen gerechten Diener bezogen werden.
  rationale: Im unmittelbaren Gebetszusammenhang ist dies die natürliche Selbstbezeichnung des Psalmisten. Die Übersetzung macht daraus keinen besonderen messianischen Titel, schließt weiterführende kanonische Bezüge aber auch nicht sprachlich aus.
- issue: Modalität des Fluchens und Segnens
  choice: Das Fluchen wird konzessiv-permissiv, Gottes Segnen zukünftig wiedergegeben.
  alternative: 'Beide Formen können auffordernd verstanden werden: „Lass sie fluchen, du aber segne.“'
  rationale: Die hebräischen Imperfektformen lassen mehr als eine modale Nuance zu. Der Haupttext folgt dem konzessiven Zusammenhang, während die Fußnote die auffordernde Lesart offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer poetischer Gegenüberstellung. „Zuschanden geworden“ ist leicht gehoben, aber verständlich und bildet die öffentliche Beschämung präziser ab als ein rein inneres „sich schämen“.
