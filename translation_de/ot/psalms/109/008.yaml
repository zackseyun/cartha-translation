  text: May his days be few[a]; may another take his office.
translation:
  language: de
  text: Seine Tage seien wenige; sein Amt[a] übernehme ein anderer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Aufsicht«, »seine Aufgabe« oder »seine Stellung«. Das hebräische Wort bezeichnet eine anvertraute Verantwortung oder eine übertragene Funktion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: sollen … sein
  rationale: Der Jussiv beziehungsweise Verwünschungscharakter wird im Deutschen natürlich mit „sollen“ wiedergegeben; es handelt sich nicht bloß um eine Zukunftsaussage.
- source_word: יָמָיו
  choice: seine Tage
  rationale: Die direkte Wiedergabe bezeichnet hier die Dauer seines Lebens.
- source_word: מְעַטִּים
  choice: nur wenige
  rationale: „Wenige“ entspricht unmittelbar dem hebräischen Adjektiv; „nur“ macht die im Kontext gemeinte Begrenzung im Deutschen idiomatisch deutlich.
- source_word: פְּקֻדָּתוֹ
  choice: sein Amt
  rationale: Das Substantiv bezeichnet eine anvertraute Aufgabe, Aufsicht oder eingesetzte Stellung. „Amt“ ist knapp und wahrt den Gedanken einer übertragenen Funktion, ohne diese ausdrücklich kirchlich festzulegen.
- source_word: יִקַּח
  choice: soll … übernehmen
  rationale: Im parallelen Verwünschungssatz hat das Imperfekt jussivische Kraft. Bei einem Amt klingt „übernehmen“ im Deutschen natürlicher als das wörtliche „nehmen“.
- source_word: אַחֵר
  choice: ein anderer
  rationale: Dies ist die direkte und idiomatische Entsprechung.
theological_decisions:
- issue: Wiedergabe von פְּקֻדָּתוֹ angesichts der späteren Aufnahme in Apostelgeschichte 1,20
  choice: Amt
  alternative: Aufsicht, Aufgabe oder Stellung
  rationale: „Amt“ bewahrt den Sinn einer anvertrauten beziehungsweise eingesetzten Funktion und passt zur späteren Aufnahme des Verses, ohne dem Psalm selbst eine spezifisch kirchliche Amtslehre aufzuerlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele jussivische Charakter beider Halbverse wird mit „sollen“ erhalten; der harte Verwünschungston des Ausgangstextes wird nicht abgeschwächt.
