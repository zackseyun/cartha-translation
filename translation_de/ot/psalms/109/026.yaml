  text: עָ֭זְרֵ/נִי יְהוָ֣ה אֱלֹהָ֑/י ה֭וֹשִׁיעֵ֣/נִי כְ/חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/026.yaml
  text: Help me[a], O Yahweh my God; save me according to your steadfast love.
translation:
  language: de
  text: Hilf mir, Jahwe, mein Gott; rette mich nach deiner beständigen Liebe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „rette mich entsprechend deiner Bundestreue“. Das hebräische Wort חֶסֶד bezeichnet loyale, beständige Liebe und kann auf die Bundestreue Gottes anspielen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְרֵנִי
  choice: Hilf mir
  rationale: Der Imperativ von עזר mit Suffix der 1. Person Singular ist eine unmittelbare Bitte um Beistand; „Hilf mir“ ist im modernen Deutsch natürlich und eindringlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהָי
  choice: mein Gott
  rationale: Die Form mit Suffix der 1. Person Singular steht als persönliche Anrede in Apposition zu Jahwe.
- source_word: הוֹשִׁיעֵנִי
  choice: rette mich
  rationale: Der Hifil-Imperativ von ישׁע mit Suffix der 1. Person Singular bezeichnet hier Gottes rettendes Eingreifen; „rette mich“ bewahrt die breite Bedeutung.
- source_word: כְחַסְדֶּךָ
  choice: nach deiner beständigen Liebe
  rationale: כְּ bezeichnet hier Maßstab oder Grundlage. „Beständige Liebe“ gibt die loyale, verlässliche Dimension von חֶסֶד wieder, ohne dessen mögliche Bundesanklänge zu überbestimmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes; „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von חֶסֶד
  choice: beständige Liebe
  alternative: Bundestreue
  rationale: חֶסֶד bezeichnet loyale und verlässliche Zuwendung und kann bundestheologische Anklänge tragen. Der Haupttext wahrt den breiteren Begriff; die Fußnote nennt die stärker bundesorientierte Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Gebetssprache. Die parallelen Imperative und die persönliche Anrede bleiben erhalten.
