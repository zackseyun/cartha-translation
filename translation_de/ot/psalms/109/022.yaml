base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/022.yaml
  text: For I am poor and needy[a], and my heart is wounded within me.
translation:
  language: de
  text: Denn ich bin arm und bedürftig, und mein Herz ist in mir verwundet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durchbohrt“ oder „tödlich getroffen“. Das hebräische Wort kann eine schwere, bis zum Tod gehende Verwundung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung der Bitte ein und bewahrt die verbindende Funktion natürlich im Deutschen.
- source_word: עָנִי
  choice: arm
  rationale: Das Adjektiv kann Armut, Bedrängnis oder Unterdrückung bezeichnen. Zusammen mit אֶבְיוֹן ist „arm“ eine klare und kontextgerechte Wiedergabe, ohne die Art der Not enger festzulegen.
- source_word: אֶבְיוֹן
  choice: bedürftig
  rationale: Unterscheidet den Ausdruck von עָנִי und bezeichnet einen Menschen, der auf Hilfe angewiesen ist.
- source_word: אָנֹכִי
  choice: ich bin
  rationale: Das selbstständige Pronomen hebt das Ich hervor; im Deutschen wird die erforderliche Kopula ergänzt.
- source_word: לִבִּי
  choice: mein Herz
  rationale: Bewahrt das hebräische Bild für das innere Selbst, ohne es auf Gefühl, Verstand oder Willen zu verengen.
- source_word: חָלַל
  choice: verwundet
  rationale: Gibt die innere Verletzung natürlich und würdig wieder. Das Wort kann hier auch das stärkere Bild des Durchbohrt- oder tödlich Getroffenseins vermitteln; diese Bedeutungsbreite wird in der Fußnote erhalten.
- source_word: בְּקִרְבִּי
  choice: tief in mir
  rationale: Gibt den inneren Ort idiomatisch wieder und lässt die Aussage nicht lediglich anatomisch klingen.
theological_decisions:
- issue: Stärke des Bildes von der Verletzung des Herzens
  choice: verwundet
  alternative: durchbohrt; tödlich getroffen
  rationale: Der Haupttext bleibt verständlich und legt nicht fest, ob eine buchstäbliche Durchbohrung oder eine tödliche Verwundung gemeint ist; die stärkeren möglichen Nuancen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige Paarung „arm und bedürftig“ wahrt den knappen Parallelismus; „tief in mir“ vermittelt den inneren Charakter der Verwundung natürlich.
