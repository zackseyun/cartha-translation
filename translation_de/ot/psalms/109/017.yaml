base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/017.yaml
  text: He loved cursing[a], and it came upon him; he did not delight in blessing[b], and it was far from him.
translation:
  language: de
  text: Er liebte das Fluchen[a], und es kam über ihn; am Segen hatte er keine Freude[b], und der Segen war weit von ihm entfernt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er liebte einen Fluch“. Das hebräische Substantiv kann das Fluchen allgemein oder einen einzelnen Fluch bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach Segen verlangte er nicht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: Er liebte
  rationale: Das Qal-Wayyiqtol von אהב bezeichnet hier Zuneigung oder bewusstes Verlangen; „liebte“ bewahrt die willentliche und affektive Aussage.
- source_word: קְלָלָה
  choice: das Fluchen
  rationale: Das Substantiv kann sowohl das Fluchen als Kategorie als auch einen einzelnen Fluch bezeichnen. „Das Fluchen“ bildet einen natürlichen Gegensatz zu „Segen“, während die konkrete Lesart in der Fußnote erhalten bleibt.
- source_word: וַתְּבוֹאֵהוּ
  choice: und es kam über ihn
  rationale: Das feminine Subjekt verweist auf קְלָלָה zurück. „Kam über ihn“ gibt sowohl das Eintreffen als auch den unheilvollen Folgesinn idiomatisch wieder.
- source_word: וְלֹא חָפֵץ בִּבְרָכָה
  choice: am Segen hatte er keine Freude
  rationale: חפץ kann Gefallen, Freude oder Verlangen ausdrücken. Die Formulierung bewahrt den affektiven Gegensatz zu „liebte“ und klingt im Deutschen natürlich.
- source_word: וַתִּרְחַק מִמֶּנּוּ
  choice: und er blieb ihm fern
  rationale: Das feminine Verb bezieht sich auf „Segen“. „Blieb ihm fern“ drückt die Distanz knapp und poetisch aus, ohne eine aktive Vertreibung zu unterstellen.
theological_decisions:
- issue: Zusammenhang zwischen der Vorliebe für Fluchen und dem eintreffenden Fluch
  choice: Die Folge wird direkt nebeneinandergestellt, ohne ihre genaue Kausalität näher zu bestimmen.
  alternative: Explizit formulieren, dass Gott den Fluch als Vergeltung sandte.
  rationale: Der hebräische Vers sagt lediglich, dass der Betreffende das Fluchen liebte und es über ihn kam; der Handelnde und der genaue Wirkmechanismus bleiben unausgesprochen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelität. Die Gegenüberstellung von Fluchen und Segen sowie die feminine Rückverweisung im letzten Satzglied bleiben klar erkennbar.
