  text: Worte voller Hass umringen mich, und sie bekämpfen mich ohne Grund.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִבְרֵי שִׂנְאָה
  choice: Worten voller Hass
  rationale: Die hebräische Konstruktverbindung bezeichnet hasserfüllte Äußerungen. „Worte voller Hass“ gibt den Sinn natürlich und würdevoll wieder, ohne die Bildkraft abzuschwächen.
- source_word: סְבָבוּנִי
  choice: umringen sie mich
  rationale: Das Verb סבב bedeutet „umgeben, umringen“. Das Präsens stellt die in der hebräischen Poesie lebhaft geschilderte Bedrängnis im Deutschen anschaulich dar.
- source_word: וַיִּלָּחֲמוּנִי
  choice: bekämpfen mich
  rationale: Das Nifal von לחם bezeichnet ein Kämpfen gegen jemanden. „Bekämpfen“ bewahrt die starke, möglicherweise kriegerische Bildsprache und ist im Deutschen idiomatisch.
- source_word: חִנָּם
  choice: ohne Grund
  rationale: Das Adverb bezeichnet grundloses, unverdientes oder unberechtigtes Handeln. „Ohne Grund“ ist klar, natürlich und lässt den moralischen Vorwurf bestehen.
theological_decisions: []
translation_notes:
