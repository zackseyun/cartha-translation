  naturalness: „Mögen“ kennzeichnet den im Kontext vorliegenden Wunsch- bzw. Verwünschungscharakter im modernen Standarddeutsch eindeutiger als „sollen“. Die knappe, objektlose Wendung „aus ihren Ruinen suchen“ ist bewusst poetisch, aber verständlich und näher am hebräischen Text als eine Ergänzung von „Nahrung“.
  terminology: „Kinder“ ist für בָנָיו möglich. „Umherirren“ und „betteln“ geben die Verben angemessen wieder. „Ruinen“ ist eine natürliche Wiedergabe von חָרְבוֹת und weniger sperrig als „Trümmerstätten“.
