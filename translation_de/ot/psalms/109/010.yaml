translation:
  language: de
  text: Mögen seine Kinder umherirren und betteln; mögen sie aus ihren Ruinen suchen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mögen sie fern von ihren Ruinen suchen.“ Die hebräische Präposition kann Herkunft/Quelle oder Trennung ausdrücken; ein Objekt zu „suchen“ ist im Hebräischen nicht ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹעַ יָנוּעוּ
  choice: sollen unstet umherirren
  rationale: Der Infinitivus absolutus vor dem Imperfekt verstärkt die Aussage. „Unstet umherirren“ gibt sowohl die Intensivierung als auch die wiederholte, ziellose Bewegung wieder; der Wunschcharakter ergibt sich im Deutschen aus „sollen“ im Verwünschungskontext.
- source_word: בָנָיו
  choice: seine Kinder
  rationale: בנים kann enger „Söhne“, aber auch allgemein „Kinder“ bedeuten. Im familiären Zusammenhang ist „Kinder“ die natürliche und nicht unnötig verengende Wiedergabe.
- source_word: וְשִׁאֵלוּ
  choice: und betteln
  rationale: שאל bedeutet grundsätzlich „bitten/fragen“; zusammen mit Umherirren und Verwüstung bezeichnet es hier am ehesten das Betteln um Lebensnotwendiges.
- source_word: וְדָרְשׁוּ
  choice: sollen sie nach Nahrung suchen
  rationale: דרש bedeutet „suchen“. Das Objekt ist im Hebräischen nicht ausdrücklich genannt; „Nahrung“ wird aus dem Zusammenhang des Bettelns und der Not ergänzt, damit die Aussage im Deutschen natürlich und verständlich bleibt.
- source_word: מֵחָרְבוֹתֵיהֶם
  choice: in ihren Trümmerstätten
  rationale: חָרְבוֹת bezeichnet Ruinen oder verwüstete Orte. Die Präposition מִן kann hier die Herkunft dessen bezeichnen, was dort gesucht wird; idiomatisches Deutsch formuliert dafür „in ihren Trümmerstätten“. Die mögliche Trennungsbedeutung wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Verwünschung wird nicht abgeschwächt. „Unstet umherirren“ erhält die emphatische Form des Hebräischen; die ungewöhnliche Präpositionalverbindung und das unausgesprochene Objekt werden im Haupttext verständlich wiedergegeben und in der Fußnote offengelegt.
