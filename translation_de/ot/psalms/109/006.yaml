source:
  edition: WLC
  text: הַפְקֵ֣ד עָלָ֣י/ו רָשָׁ֑ע וְ֝/שָׂטָ֗ן יַעֲמֹ֥ד עַל יְמִינֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/006.yaml
  text: Appoint a wicked man over him[a], and let an accuser stand at his right hand.
translation:
  language: de
  text: Setze einen Gottlosen über ihn ein, und ein Ankläger[a] soll zu seiner Rechten stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Gegner«; möglicherweise auch: »Satan«. Das hebräische Wort kann einen Ankläger oder Gegner bezeichnen und in manchen Zusammenhängen als Eigenname »Satan« verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְקֵד
  choice: Setze … ein
  rationale: Der Hifil-Imperativ von פקד fordert hier dazu auf, jemanden über eine andere Person zu setzen bzw. einzusetzen. „Setze … ein“ wahrt die Befehlsform und klingt im Deutschen natürlich.
- source_word: עָלָיו
  choice: über ihn
  rationale: In Verbindung mit פקד bezeichnet על hier am ehesten die Person, über die jemand eingesetzt wird. Die mögliche feindliche Stoßrichtung ergibt sich aus dem Kontext.
- source_word: רָשָׁע
  choice: einen Gottlosen
  rationale: Das substantivierte Adjektiv bezeichnet eine schuldige bzw. gottlose Person. „Gottloser“ ist im Psalmenkontext würdig und verständlich, ohne eine bestimmte amtliche Rolle hinzuzufügen.
- source_word: שָׂטָן
  choice: ein Ankläger
  rationale: Das Wort kann einen Gegner oder Ankläger bezeichnen und muss hier nicht als Eigenname verstanden werden. Die Gerichtsszene des Folgeverses stützt „Ankläger“.
- source_word: יַעֲמֹד
  choice: soll … stehen
  rationale: Das Imperfekt hat nach dem vorausgehenden Imperativ auffordernden bzw. wünschenden Sinn. „Soll … stehen“ gibt diesen im Deutschen knapp wieder.
- source_word: עַל יְמִינוֹ
  choice: zu seiner Rechten
  rationale: Die feste Wendung bezeichnet die Stellung an der rechten Seite und bewahrt den rechtlich-poetischen Klang des Hebräischen.
theological_decisions:
- issue: Ist שָׂטָן als Eigenname „Satan“ oder als Gattungsbezeichnung zu übersetzen?
  choice: 'Gattungsbezeichnung: „ein Ankläger“'
  alternative: „Satan“ oder „ein Gegner“
  rationale: Der hebräische Text verlangt keinen Eigennamen. Der unmittelbare gerichtliche Zusammenhang legt die Funktion eines Anklägers nahe; die traditionelle Lesart „Satan“ bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetisch-rechtlicher Bildsprache. Die Formulierung vermeidet eine vorschnelle Festlegung auf den Eigennamen „Satan“.
