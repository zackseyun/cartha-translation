  text: יַ֗עַן אֲשֶׁ֤ר לֹ֥א זָכַר֮ עֲשׂ֪וֹת חָ֥סֶד וַ/יִּרְדֹּ֡ף אִישׁ עָנִ֣י וְ֭/אֶבְיוֹן וְ/נִכְאֵ֨ה לֵבָ֬ב לְ/מוֹתֵֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/016.yaml
  text: because he did not remember to show kindness[a], but pursued the poor and needy man, and the brokenhearted[b], to put them to death.
translation:
  language: de
  text: weil er nicht daran dachte, Güte zu erweisen[a], sondern den Armen und Bedürftigen verfolgte und den, dessen Herz gebrochen war[b], um sie zu töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Barmherzigkeit zu üben.“ Das hebräische Wort kann auch treue Liebe oder Bundestreue bezeichnen; hier geht es um Güte, die schutzlosen Menschen konkret erwiesen wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den armen und bedürftigen Mann und den, der zerschlagenen Herzens ist“. Der Singular kann hier stellvertretend die Art von Menschen bezeichnen, denen er nachstellte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: weil
  rationale: Die Verbindung leitet den Grund für das im Zusammenhang ausgesprochene Gericht ein; „weil“ gibt die kausale Funktion natürlich wieder.
- source_word: לֹא זָכַר עֲשׂוֹת חָסֶד
  choice: nicht daran dachte, Güte zu erweisen
  rationale: זָכַר mit Infinitiv bezeichnet hier, etwas so im Sinn zu behalten, dass man danach handelt. „Güte erweisen“ gibt חֶסֶד im zwischenmenschlichen Zusammenhang konkret wieder, ohne mögliche Nuancen von Barmherzigkeit oder treuer Liebe auszuschließen.
- source_word: וַיִּרְדֹּף
  choice: sondern … verfolgte
  rationale: „Verfolgte“ bewahrt das Bild des Nachstellens. „Sondern“ verdeutlicht den sachlichen Gegensatz zwischen unterlassener Güte und aktivem Vorgehen gegen Schutzlose.
- source_word: אִישׁ עָנִי וְאֶבְיוֹן
  choice: den Armen und Bedürftigen
  rationale: Die substantivierten Adjektive bewahren den männlichen Singular und lassen ihn zugleich repräsentativ für einen schutzlosen Menschen stehen.
- source_word: וְנִכְאֵה לֵבָב
  choice: und den, dessen Herz gebrochen war
  rationale: Diese Formulierung bildet den singularischen Ausdruck und das Bild eines innerlich zerschlagenen Herzens verständlich und eng am Hebräischen ab.
- source_word: לְמוֹתֵת
  choice: um ihn zu töten
  rationale: Der Infinitiv kann Ziel oder Ergebnis der Verfolgung bezeichnen. „Um ihn zu töten“ gibt die naheliegende finale Bedeutung knapp wieder und stimmt mit den singularischen Personenbezeichnungen überein.
theological_decisions:
- issue: Bedeutungsumfang von חֶסֶד
  choice: Güte
  alternative: Barmherzigkeit; treue Liebe; Bundestreue
  rationale: Im unmittelbaren Zusammenhang geht es um konkrete Zuwendung zu schutzlosen Menschen. „Güte“ ist dafür passend, während eine ausdrückliche Wiedergabe als „Bundestreue“ eine im Vers nicht eindeutig festgelegte theologische Beziehung ergänzen würde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die syntaktische Parallelität und der repräsentative Singular des Hebräischen bleiben erhalten; die Fußnoten weisen auf den Bedeutungsumfang von חֶסֶד und die wörtlichere Form der Personenbezeichnungen hin.
