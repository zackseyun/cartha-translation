source:
  edition: WLC
  text: כְּ/צֵל כִּ/נְטוֹת֥/וֹ נֶהֱלָ֑כְתִּי נִ֝נְעַ֗רְתִּי כָּֽ/אַרְבֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/023.yaml
  text: Like a shadow when it lengthens[a], I am gone[c][b]; I am shaken off like a locust.
translation:
  language: de
  text: Wie ein Schatten, wenn er länger wird[a], schwinde ich dahin[b]; ich werde abgeschüttelt wie eine Heuschrecke[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wenn er sich neigt« beziehungsweise »wenn er sich ausstreckt«; das hebräische Verb kann das Längerwerden oder die Neigung eines Schattens gegen Abend bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »gehe ich dahin« beziehungsweise »vergehe ich«; im Hebräischen steht eine Form des Verbs »gehen«, die hier das Verschwinden ausdrückt.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort bezeichnet gewöhnlich eine Heuschrecke, besonders eine Wanderheuschrecke.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצֵל
  choice: Wie ein Schatten
  rationale: Das Präfix כְּ kennzeichnet einen Vergleich, und צֵל bedeutet »Schatten«. Die Formulierung bewahrt das poetische Bild in natürlichem Deutsch.
- source_word: כִּנְטוֹתוֹ
  choice: wenn er länger wird
  rationale: נטה kann »sich ausstrecken«, »sich neigen« oder »sich wenden« bedeuten. Bei einem Schatten liegt das Längerwerden gegen Abend nahe; die zeitliche Konstruktion wird mit »wenn« wiedergegeben, ohne die Bildsprache aufzulösen.
- source_word: נֶהֱלָכְתִּי
  choice: schwinde ich dahin
  rationale: Die Nifalform von הלך bezeichnet hier im Bild des abendlichen Schattens ein Fortgehen oder Verschwinden. »Schwinde ich dahin« gibt diese Wirkung idiomatisch wieder, während die mögliche wörtlichere Auffassung in der Fußnote erhalten bleibt.
- source_word: נִנְעַרְתִּי
  choice: ich werde abgeschüttelt
  rationale: Die Nifalform von נער bedeutet »ab-/ausgeschüttelt werden«. Die passive Form und das Bild eines leicht fortzuschüttelnden Tieres bleiben erhalten.
- source_word: כָּאַרְבֶּה
  choice: wie eine Heuschrecke
  rationale: אַרְבֶּה bezeichnet gewöhnlich eine Heuschrecke, häufig speziell eine Wanderheuschrecke. »Heuschrecke« ist die natürliche und lexikalisch hinreichend genaue deutsche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Moderne, würdige deutsche Bibelsprache mit knapper poetischer Parallelität. »Dahinschwinden« vermittelt die Vergänglichkeit des Bildes, ohne eine theologische Deutung hinzuzufügen; die Alternativen des mehrdeutigen hebräischen Verbs werden in den Fußnoten offengehalten.
