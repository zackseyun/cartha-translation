  yaml_path: translation/ot/psalms/109/002.yaml
  text: For the mouth of the wicked and the mouth of deceit have opened against me[b][a]; they have spoken to me with a lying tongue.
translation:
  language: de
  text: Denn der Mund eines Gottlosen und der Mund der Täuschung haben sich gegen mich geöffnet; sie haben mit lügnerischer Zunge zu mir[a] geredet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »Sie haben mit mir mit einer Zunge der Lüge geredet.« Im feindseligen Zusammenhang ist »zu mir« wahrscheinlich gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung für die Bitte des Psalmisten ein und bewahrt die kausale Funktion.
- source_word: פִי רָשָׁע
  choice: der Mund eines Gottlosen
  rationale: Die Konstruktverbindung bezeichnet wörtlich den Mund eines gottlosen Menschen; der Singular bleibt erhalten, ohne über den Text hinauszugehen.
- source_word: וּפִי מִרְמָה
  choice: und der Mund des Betrugs
  rationale: Bewahrt die auffällige Wiederholung von »Mund« und gibt מִרְמָה als Betrug beziehungsweise Täuschung wieder.
- source_word: עָלַי פָּתָחוּ
  choice: haben sich gegen mich geöffnet
  rationale: Gibt das Bild des geöffneten Mundes und die feindliche Ausrichtung von עָלַי möglichst unmittelbar wieder.
- source_word: דִּבְּרוּ אִתִּי
  choice: sie reden zu mir
  rationale: אִתִּי kann formal »mit mir« heißen; im feindseligen Zusammenhang ist an mich gerichtetes Reden wahrscheinlich. Das deutsche Präsens wirkt in der fortdauernden Klage natürlich.
- source_word: לְשׁוֹן שָׁקֶר
  choice: mit lügnerischer Zunge
  rationale: Bewahrt das konkrete hebräische Bild der Zunge und gibt שֶׁקֶר natürlich als lügnerische Rede wieder.
