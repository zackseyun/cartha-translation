source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְה֘וִ֤ה אֲדֹנָ֗/י עֲֽשֵׂה אִ֭תִּ/י לְמַ֣עַן שְׁמֶ֑/ךָ כִּי ט֥וֹב חַ֝סְדְּ/ךָ֗ הַצִּילֵֽ/נִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/021.yaml
  text: But you[a], O Lord Yahweh, deal with me for your name’s sake; because your steadfast love is good[d][c][b], deliver me.
translation:
  language: de
  text: Du aber, HERR, mein Herr[a], verfahre mit mir[b] um deines Namens willen; denn deine treue Liebe[c] ist gut. Rette mich!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „JHWH, mein Herr“. Im Grundtext stehen der Gottesname יְהוָה (JHWH) und die Anrede אֲדֹנָי unmittelbar nacheinander.'
    reason: alternative_reading
  - marker: b
    text: 'Oder dem Zusammenhang nach: „handle für mich“. Wörtlicher: „tu mit mir“.'
    reason: lexical_alternative
  - marker: c
    text: „Treue Liebe“ gibt das hebräische חֶסֶד wieder. Das Wort kann auch mit „Güte“, „Gnade“, „beständige Liebe“ oder „Bundestreue“ übersetzt werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Du aber
  rationale: Das betonte Pronomen und die Konjunktion heben Gott als Gegenüber zu den feindseligen Menschen der vorangehenden Verse hervor; „aber“ gibt diesen Kontrast im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: HERR
  rationale: Die Kapitälchen folgen der im Deutschen verbreiteten Wiedergabe des Gottesnamens JHWH; die Fußnote macht den zugrunde liegenden Namen ausdrücklich kenntlich.
- source_word: אֲדֹנָי
  choice: mein Herr
  rationale: Die masoretische Form wird als persönliche Anrede verstanden. So bleiben die beiden unmittelbar aufeinanderfolgenden Gottesbezeichnungen unterscheidbar.
- source_word: עֲשֵׂה אִתִּי
  choice: handle mit mir
  rationale: Die Verbindung bedeutet wörtlich und bewusst offen „tu/handle mit mir“. „Handle mit mir“ bleibt im Deutschen verständlich, ohne die erbetene Hilfe schon in die Formulierung hineinzulegen.
- source_word: לְמַעַן שְׁמֶךָ
  choice: um deines Namens willen
  rationale: Die feste Wendung bewahrt den Appell an Gottes Namen, also an seine offenbarte Identität und Ehre, ohne ihn erklärend einzuengen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund für die Bitte an; „denn“ ist im gehobenen, aber gegenwärtigen Gebetsstil natürlich.
- source_word: טוֹב
  choice: gut
  rationale: Das Adjektiv steht prädikativ zu Gottes חֶסֶד und wird in seiner schlichten Grundbedeutung wiedergegeben.
- source_word: חַסְדְּךָ
  choice: deine treue Liebe
  rationale: חֶסֶד umfasst liebevolle Zuwendung, Loyalität und Verlässlichkeit. „Treue Liebe“ hält diese Bedeutungsfülle besser zusammen als ausschließlich „Gnade“ oder „Barmherzigkeit“.
- source_word: הַצִּילֵנִי
  choice: Rette mich
  rationale: Der Hifil von נצל bezeichnet die Befreiung aus Gefahr. „Rette mich“ ist unmittelbar, idiomatisch und entspricht dem dringlichen Gebetsruf.
theological_decisions:
- issue: Die doppelte Gottesanrede יְהוָה אֲדֹנָי
  choice: HERR, mein Herr
  alternative: JHWH, mein Herr; Herr, HERR
  rationale: Die Übersetzung erhält beide Bezeichnungen und ihre hebräische Reihenfolge, statt sie zu einer einzigen Anrede zu verschmelzen. „HERR“ kennzeichnet konventionell den Gottesnamen, während „mein Herr“ אֲדֹנָי wiedergibt.
- issue: Die Offenheit von עֲשֵׂה אִתִּי
  choice: handle mit mir
  alternative: handle für mich; tritt für mich ein; tu an mir
  rationale: Der Kontext legt ein rettendes Handeln zugunsten des Beters nahe, doch die hebräische Formulierung selbst bleibt allgemein. Die Hauptfassung bewahrt diese Spannung; die Fußnote nennt die im Zusammenhang mögliche Verdeutlichung.
- issue: Bedeutungsumfang von חֶסֶד
  choice: treue Liebe
  alternative: Güte; Gnade; beständige Liebe; Bundestreue
  rationale: Keine einzelne deutsche Entsprechung deckt den ganzen Bedeutungsumfang ab. „Treue Liebe“ verbindet Zuwendung und Verlässlichkeit, ohne den Ausdruck ausschließlich auf einen bestimmten dogmatischen Bundesbegriff festzulegen.
translation_notes:
  register: Moderner, würdevoller Gebetsstil mit direkter Anrede. Die leicht ungewöhnliche Wendung „handle mit mir“ bewahrt gezielt die Offenheit des Hebräischen; der abschließende kurze Imperativ bringt die Dringlichkeit des Verses zur Geltung.
