  text: כִּֽי יַ֭עֲמֹד לִ/ימִ֣ין אֶבְי֑וֹן לְ֝/הוֹשִׁ֗יעַ מִ/שֹּׁפְטֵ֥י נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/031.yaml
  text: For he stands at the right hand of the poor[b][a], to save him from those who judge his soul.
translation:
  language: de
  text: Denn er steht zur Rechten des Bedürftigen, um ihn vor denen zu retten, die über sein Leben urteilen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor seinen Richtern“. Das Hebräische kann Menschen meinen, die als Richter über ihn auftreten, oder allgemein solche, die ein Urteil gegen ihn aussprechen. Das Wort für „Leben“ kann auch „Seele“ oder „Selbst“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Lobpreis beziehungsweise die vorausgehende Zuversicht ein und entspricht dem erklärenden Zusammenhang.
- source_word: יַעֲמֹד
  choice: er steht
  rationale: Das Imperfekt kann eine typische oder als gewiss dargestellte Handlung bezeichnen. Das Präsens gibt hier Gottes beständige, schützende Haltung natürlich wieder, ohne die Aussage unnötig auf die Zukunft festzulegen.
- source_word: לִימִין
  choice: zur Rechten
  rationale: Bewahrt das hebräische Bild einer schützenden und unterstützenden Gegenwart und ist im Deutschen idiomatisch.
- source_word: אֶבְיוֹן
  choice: des Bedürftigen
  rationale: Bezeichnet einen armen, bedürftigen und dadurch schutzlosen Menschen. „Bedürftigen“ erfasst die Verwundbarkeit, ohne den Ausdruck ausschließlich auf Besitzlosigkeit zu verengen.
- source_word: לְהוֹשִׁיעַ
  choice: um ihn … zu retten
  rationale: Der Infinitiv bezeichnet den Zweck; „retten“ umfasst sowohl tatsächliche als auch gerichtliche Befreiung.
- source_word: מִשֹּׁפְטֵי
  choice: vor denen …, die … urteilen
  rationale: Die Form kann Richter oder allgemein Menschen bezeichnen, die ein Urteil über ihn aussprechen. Diese Wiedergabe wahrt den gerichtlichen Sinn, ohne ausdrücklich „verurteilen“ einzutragen.
- source_word: נַפְשׁוֹ
  choice: sein Leben
  rationale: נֶפֶשׁ bezeichnet hier im Zusammenhang einer existenziellen Bedrohung am ehesten das Leben beziehungsweise die ganze Person; „Leben“ vermeidet eine unnötige Verengung auf eine vom Körper getrennte Seele.
theological_decisions:
- issue: Anthropologische Bedeutung von נֶפֶשׁ
  choice: „sein Leben“
  alternative: „seine Seele“ oder „ihn selbst“
  rationale: Der Kontext spricht von der Rettung eines bedrohten Menschen. Das hebräische Wort kann Seele, Leben oder Selbst bedeuten; „Leben“ wahrt hier die existenzielle Tragweite, ohne eine spätere anthropologische Präzisierung in den Text einzutragen.
- issue: Zeitwert von יַעֲמֹד
  choice: Präsens „er steht“
  alternative: Futur „er wird stehen“
  rationale: Die poetische Aussage kann Gottes charakteristisches oder gewiss erwartetes Eingreifen ausdrücken. Das Präsens lässt diese Spannung bestehen und betont seine verlässliche Gegenwart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem poetischem Rechtsbild. „Zur Rechten“ hält die Schutzmetapher aufrecht; „Bedürftiger“ ist allgemein verständlich und umfasst soziale Verwundbarkeit.
