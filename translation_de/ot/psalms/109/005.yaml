translation:
  language: de
  text: Sie vergolten mir Gutes mit Bösem[a] und meine Liebe mit Hass.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie setzten Böses gegen mich anstelle von Gutem.“ Das hebräische Verb bedeutet wörtlich „setzen/legen“, hat hier aber wahrscheinlich den Sinn feindlicher Vergeltung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: sie vergolten
  rationale: שׂוּם bedeutet wörtlich „setzen/legen“. In der Verbindung mit עָלַי und den parallelen תַּחַת-Wendungen bezeichnet es hier wahrscheinlich ein feindliches Erwidern; „vergelten“ gibt diesen Austausch im Deutschen natürlich wieder.
- source_word: עָלַי
  choice: mir
  rationale: Das wörtliche „auf/gegen mich“ geht in der deutschen Konstruktion „jemandem etwas vergelten“ idiomatisch im Dativ auf.
- source_word: רָעָה
  choice: Bösem
  rationale: „Böses“ bewahrt die breite moralische und feindselige Bedeutung des hebräischen Ausdrucks und bildet den deutlichen Gegensatz zu „Gutem“.
- source_word: תַּחַת
  choice: mit
  rationale: תַּחַת kennzeichnet hier Austausch oder Entsprechung. Die feste deutsche Wendung „Gutes mit Bösem vergelten“ drückt diesen Sinn prägnant aus, auch wenn die hebräische Form wörtlicher „Böses anstelle von/für Gutes“ lautet.
- source_word: טוֹבָה
  choice: Gutes
  rationale: Die substantivierte Wiedergabe erhält die Weite des hebräischen Begriffs und den Gegensatz zu רָעָה.
- source_word: וְשִׂנְאָה
  choice: und … Hass
  rationale: „Hass“ gibt das abstrakte Substantiv direkt wieder und steht in klarer poetischer Entsprechung zu „meine Liebe“.
- source_word: אַהֲבָתִי
  choice: meine Liebe
  rationale: Die direkte Wiedergabe des Substantivs mit Suffix wahrt die knappe und bewusst offene Formulierung; ob die empfundene oder erwiesene Liebe gemeint ist, wird nicht unnötig festgelegt.
