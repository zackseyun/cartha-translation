  source_fidelity: 'Die gerichtliche und imprecatorische Aussage wird im Wesentlichen getroffen. »Wenn er vor Gericht steht« schwächt jedoch das passive בְּהִשָּׁפְטוֹ („wenn er gerichtet/vor Gericht gestellt wird“) leicht ab: Auch ein Kläger oder Zeuge kann vor Gericht stehen. Die Formulierung »vor Gericht gestellt wird« bewahrt die passive gerichtliche Perspektive des Hebräischen klarer. Die Wiedergabe von רָשָׁע als »schuldig« ist im Kontext eines Gerichtsurteils gut begründet. לַחֲטָאָה wird angemessen als »zur Sünde« wiedergegeben, ohne eine nicht im Text genannte zurechnende Instanz einzuführen.'
