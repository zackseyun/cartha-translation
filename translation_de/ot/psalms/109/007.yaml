  text: When he is judged[a], let him come out guilty[b], and let his prayer become sin.
translation:
  language: de
  text: Wenn er vor Gericht gestellt wird[a], möge er als schuldig daraus hervorgehen[b], und möge sein Gebet zur Sünde werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »Wenn über ihn Gericht gehalten wird.«'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann »schuldig« oder allgemeiner »böse, als Frevler« bedeuten. Im Gerichtszusammenhang liegt »schuldig« nahe.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »möge als Sünde gelten« beziehungsweise »möge ihm als Sünde angerechnet werden«. Wer gegebenenfalls anrechnet, wird im Hebräischen nicht ausdrücklich genannt.'
    reason: ambiguity
lexical_decisions:
- source_word: בְּהִשָּׁפְטוֹ
  choice: Wenn er vor Gericht steht
  rationale: 'Die Präposition ב mit dem Nifal-Infinitiv von שׁפט und dem Suffix der 3. Person Singular hat temporalen Sinn: »wenn über ihn geurteilt wird« beziehungsweise »wenn er vor Gericht steht«. Die gewählte Formulierung gibt den gerichtlichen Zusammenhang in natürlichem Deutsch wieder und vermeidet die mögliche Bedeutung von »gerichtet werden« im Sinn einer Hinrichtung.'
- source_word: יֵצֵא רָשָׁע
  choice: soll er als schuldig daraus hervorgehen
  rationale: יצא bezeichnet wörtlich ein Herausgehen und im gerichtlichen Zusammenhang den Ausgang des Verfahrens. רָשָׁע kann allgemein »böse/Frevler« bedeuten, hier aber den negativen Rechtsspruch »schuldig«. »Soll« gibt die Wunsch- oder Bittkraft des Verses wieder.
- source_word: וּתְפִלָּתוֹ
  choice: und sein Gebet
  rationale: תְּפִלָּה bedeutet unmittelbar »Gebet«; die Konjunktion verbindet diese zweite Verwünschung mit der ersten.
- source_word: תִּהְיֶה לַחֲטָאָה
  choice: soll zur Sünde werden
  rationale: היה mit ל kann ein Werden oder Ergebnis ausdrücken. Die direkte Wiedergabe bewahrt die zugespitzte Aussage und lässt offen, ob das Gebet selbst zur Sünde wird oder als Sünde gilt.
theological_decisions:
- issue: Aussage- oder Wunschform der Verben im Fluchgebet
  choice: Wunsch beziehungsweise Bitte mit »soll«
  alternative: Vorhersage mit »wird«
  rationale: Der Zusammenhang von Psalm 109 legt eine im Gebet ausgesprochene Verwünschung nahe. »Soll« bewahrt diese volitive Kraft, ohne sie als bloße Zukunftsaussage wiederzugeben.
- issue: Verhältnis des Gebets zur Sünde
  choice: »sein Gebet soll zur Sünde werden«
  alternative: »sein Gebet soll ihm als Sünde angerechnet werden«
  rationale: Der hebräische Ausdruck תִּהְיֶה לַחֲטָאָה benennt ein Werden beziehungsweise Gelten als Sünde, sagt aber nicht ausdrücklich, wer es anrechnet. Die Übersetzung bewahrt diese theologische und sprachliche Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gerichtsmetaphorik bleibt erkennbar; zugleich wird das im heutigen Deutsch missverständliche »wenn er gerichtet wird« vermieden. Die Formulierung »zur Sünde werden« erhält bewusst die Härte und Mehrdeutigkeit des hebräischen Textes.
