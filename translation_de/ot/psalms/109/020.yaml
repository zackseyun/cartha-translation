  text: זֹ֤את פְּעֻלַּ֣ת שֹׂ֭טְנַ/י מֵ/אֵ֣ת יְהוָ֑ה וְ/הַ/דֹּבְרִ֥ים רָ֝֗ע עַל נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/020.yaml
  text: This is the reward of my accusers from Yahweh[b][a], and of those who speak evil against my life.
translation:
  language: de
  text: Dies ist die Vergeltung[a], die meine Ankläger[b] und die, die Böses gegen mein Leben[c] reden, von Jahwe erhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Werk“ beziehungsweise „die Tat“. Das hebräische Wort kann ein Werk, eine Tat oder im übertragenen Sinn Lohn beziehungsweise Vergeltung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meiner Gegner“. Das hebräische Wort kann sowohl Ankläger als auch allgemein Widersacher oder Gegner bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „gegen meine Seele“. „Seele“ kann hier die eigene Person oder das Leben meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Dies ist
  rationale: Das feminine Demonstrativpronomen eröffnet einen Nominalsatz; im Deutschen wird die im Hebräischen fehlende Kopula natürlich ergänzt.
- source_word: פְּעֻלַּת
  choice: Vergeltung
  rationale: Das Wort bezeichnet wörtlich ein Werk oder eine Tat, kann im Zusammenhang aber auch den daraus erwachsenden Lohn beziehungsweise die Vergeltung meinen. Der Kontext der angekündigten Folgen für feindselige Gegner stützt hier „Vergeltung“.
- source_word: שֹׂטְנַי
  choice: meiner Ankläger
  rationale: Die Form bezeichnet Menschen, die sich widersetzen oder anklagen. Wegen der im Psalm hervorgehobenen feindseligen Rede gibt „Ankläger“ den konkreten Zusammenhang gut wieder.
- source_word: מֵאֵת
  choice: von
  rationale: Die Präposition bezeichnet hier Herkunft oder Urheberschaft; „von Jahwe“ ist die knappe und natürliche deutsche Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְהַדֹּבְרִים רָע
  choice: und derer, die Böses … reden
  rationale: Die koordinierende Verbindung wird ausdrücklich bewahrt. רָע bezeichnet hier den bösen Inhalt oder Charakter ihrer Rede.
- source_word: עַל נַפְשִׁי
  choice: gegen mein Leben
  rationale: נֶפֶשׁ kann Seele, Selbst oder Leben bezeichnen. Im feindseligen Kontext ist „mein Leben“ verständlich und bewahrt die mögliche Bedrohung der Person.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; die Transliteration bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Art der von Jahwe kommenden Folge für die Gegner
  choice: Vergeltung
  alternative: Werk/Tat
  rationale: „Vergeltung“ gibt den kontextuellen Sinn wieder, ohne genauer festzulegen, auf welche Weise Jahwe handelt. Die wörtlichere lexikalische Möglichkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur des hebräischen Nominalsatzes bleibt erkennbar; zugleich werden zentrale lexikalische Mehrdeutigkeiten durch Fußnoten offengehalten.
