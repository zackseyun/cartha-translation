  text: יִֽהְיוּ בָנָ֥י/ו יְתוֹמִ֑ים וְ֝/אִשְׁתּ/וֹ אַלְמָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/009.yaml
  text: May his sons be fatherless[a], and his wife a widow.
translation:
  language: de
  text: Mögen seine Söhne vaterlos sein und seine Frau eine Witwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Waisen“. Das hebräische Wort kann Kinder bezeichnen, die ihren Vater verloren haben; hier passt „vaterlos“ zum parallelen Ausdruck „seine Frau eine Witwe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: sollen … sein
  rationale: Die Form trägt im Kontext einen jussivisch-verwünschenden Sinn. „Sollen … sein“ gibt diesen Wunsch beziehungsweise Fluch im Deutschen natürlich wieder, ohne ihn als bloße Zukunftsaussage darzustellen.
- source_word: בָנָיו
  choice: seine Söhne
  rationale: בֵּן steht hier im maskulinen Plural mit Suffix der 3. Person Singular und bezeichnet ausdrücklich seine Söhne.
- source_word: יְתוֹמִים
  choice: vaterlos
  rationale: Der Ausdruck kann allgemein elternlose beziehungsweise verwaiste Kinder bezeichnen; im Parallelismus mit der zur Witwe werdenden Ehefrau liegt hier besonders der Verlust des Vaters nahe.
- source_word: וְאִשְׁתּוֹ
  choice: und seine Frau
  rationale: אִשָּׁה mit Possessivsuffix bezeichnet in diesem Zusammenhang eindeutig die Ehefrau; die Konjunktion wird unmittelbar wiedergegeben.
- source_word: אַלְמָנָה
  choice: eine Witwe
  rationale: Das Substantiv bezeichnet direkt eine Witwe; der unbestimmte Artikel entspricht natürlichem deutschem Sprachgebrauch.
theological_decisions:
- issue: Verwünschender Modus des Psalms
  choice: 'Als Wunsch beziehungsweise Verwünschung formuliert: „Seine Söhne sollen … sein und seine Frau …“'
  alternative: 'Als Vorhersage: „Seine Söhne werden vaterlos sein und seine Frau eine Witwe.“'
  rationale: Verbform und literarischer Zusammenhang sprechen für einen jussivisch-imprekatorischen Sinn. Die Übersetzung bewahrt die Härte und Spannung des Textes, statt ihn zu einer neutralen Vorhersage umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und der imprekatorische Ton des hebräischen Verses bleiben erhalten.
