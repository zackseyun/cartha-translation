  text: לַ֭/מְנַצֵּחַ לְ/דָוִ֣ד מִזְמ֑וֹר אֱלֹהֵ֥י תְ֝הִלָּתִ֗/י אַֽל תֶּחֱרַֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/000.yaml
  text: For the choirmaster[a]. Of David. A psalm. O God of my praise[b], do not be silent.
translation:
  language: de
  text: 'Für den Chorleiter. Von David.[a] Ein Psalm.


    Gott meines Lobes, schweige nicht![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Für David«, »David gewidmet« oder »David betreffend«; die hebräische Überschrift ist mehrdeutig.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Bleib nicht stumm!«'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Die traditionelle Funktionsbezeichnung gibt die Zielangabe לַ־ und die leitende musikalische Rolle von מְנַצֵּחַ knapp und verständlich wieder.
- source_word: לְדָוִד
  choice: Von David
  rationale: Diese geläufige Wiedergabe lässt David als Verfasser erkennen; da die Präposition לְ jedoch mehrere Beziehungen ausdrücken kann, wird die echte Mehrdeutigkeit in einer Fußnote bewahrt.
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: Gott meines Lobes
  rationale: Die genitivische Formulierung folgt der ungewöhnlichen, theologisch offenen Wendung des Hebräischen, ohne sie eindeutig zu „Gott, den ich lobe“ oder „Gott, der mein Lob ist“ aufzulösen.
- source_word: אַל תֶּחֱרַשׁ
  choice: schweige nicht
  rationale: Der Imperativ mit אַל wird direkt und idiomatisch wiedergegeben; gemeint ist Gottes erbetenes Eingreifen statt seines Schweigens.
theological_decisions:
- issue: Beziehung Davids zum Psalm in לְדָוִד
  choice: Von David
  alternative: Für David / David gewidmet / David betreffend
  rationale: Die traditionelle Verfasserangabe ist möglich und im Deutschen am verständlichsten, doch die Präposition allein legt die genaue Beziehung nicht zweifelsfrei fest; deshalb nennt die Fußnote Alternativen.
- issue: Bedeutung von „Gott meines Lobes“
  choice: Die Genitivkonstruktion bleibt im Haupttext erhalten.
  alternative: Gott, den ich lobe / Gott, der mein Lob ist
  rationale: Das Hebräische lässt offen, ob Gott als Gegenstand, Grund oder Inhalt des Lobes bezeichnet wird. Die Übersetzung löst diese Spannung nicht einseitig auf.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Form der Psalmüberschrift bleibt erhalten. »Gott meines Lobes« ist bewusst etwas gehoben und ungewöhnlich, um die prägnante hebräische Genitivverbindung und ihre Mehrdeutigkeit zu bewahren.
