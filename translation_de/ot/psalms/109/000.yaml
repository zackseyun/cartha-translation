  source_fidelity: 'Der Text gibt sämtliche Bestandteile des hebräischen Verses wieder: לַמְנַצֵּחַ als „Für den Chorleiter“, לְדָוִד mit einer angemessenen Hauptlesart und Mehrdeutigkeitsfußnote, מִזְמוֹר als „Ein Psalm“ sowie die Anrede und Bitte „Gott meines Lobes, schweige nicht!“. Die Fußnote b dokumentiert die naheliegende lexikalische Alternative zu תֶּחֱרַשׁ. Die englische Fußnotenreferenz scheint bei b zwar den ganzen Ausdruck „O God of my praise, do not be silent“ zu betreffen, während die deutsche Fußnote gezielt den letzten Imperativ erläutert; das ist sachlich stimmig.'
