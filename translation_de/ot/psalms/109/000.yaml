  terminology: „Chorleiter“, „David“, „Psalm“ und „Gott“ sind etablierte, registergerechte Begriffe. Die Fußnote zu לְדָוִד wahrt die tatsächliche Präpositionsmehrdeutigkeit, ohne eine bestimmte Deutung festzuschreiben.
