  text: אַל יְהִי ל֭/וֹ מֹשֵׁ֣ךְ חָ֑סֶד וְֽ/אַל יְהִ֥י ח֝וֹנֵ֗ן לִ/יתוֹמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/012.yaml
  text: Let there be no one to extend kindness to him[b][a], and let there be no one to show favor to his fatherless children.
translation:
  language: de
  text: Niemand soll ihm Güte erweisen[a], und niemand soll sich seiner Waisen erbarmen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Niemand soll ihm Güte hinziehen«, das heißt: sie ihm weiterhin oder anhaltend erweisen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sich seiner vaterlosen Kinder erbarmen«; das hebräische Wort kann besonders Kinder bezeichnen, die keinen Vater mehr haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁךְ חָסֶד
  choice: Güte erweisen
  rationale: Die Verbindung bezeichnet wörtlich das »Hinziehen/Ausdehnen« von חֶסֶד und meint hier, jemandem weiterhin beziehungsweise anhaltend Güte zukommen zu lassen. Die natürliche deutsche Wendung bewahrt den Sinn; die bildhafte Form wird in der Fußnote kenntlich gemacht.
- source_word: חָסֶד
  choice: Güte
  rationale: Im menschlichen Handlungskontext bezeichnet das Wort loyale, barmherzige Güte. »Güte« ist würdig und verständlich, ohne die mögliche Bundesnuance unnötig festzulegen.
- source_word: חוֹנֵן
  choice: sich erbarmen
  rationale: חנן bezeichnet gnädige, mitleidige Zuwendung. Bei schutzlosen Waisen ist »sich erbarmen« im Deutschen idiomatisch und gibt den hier gemeinten tätigen Erweis von Gunst wieder.
- source_word: יְתוֹמָיו
  choice: seiner Waisen
  rationale: יָתוֹם bezeichnet ein elternloses, häufig speziell vaterloses Kind. Der Suffix bezieht die Kinder auf den genannten Mann; »seiner Waisen« ist knapp und natürlich, während die genauere sozialgeschichtliche Nuance in der Fußnote erscheint.
- source_word: אַל יְהִי
  choice: Niemand soll
  rationale: Die negierte Jussivkonstruktion äußert einen Wunsch beziehungsweise eine Verwünschung. »Niemand soll« erhält diese direktive Kraft und macht daraus keine bloße Zukunftsaussage.
theological_decisions:
- issue: Die verwünschende Bitte ungemildert wiedergeben
  choice: Die direkten Formulierungen »Niemand soll …« werden beibehalten.
  alternative: 'Als Vorhersage formulieren: »Niemand wird …«'
  rationale: Die hebräischen Jussivformen drücken einen Wunsch oder Aufruf aus. Eine Zukunftsform würde die theologische und rhetorische Spannung des Fluchpsalms abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die scharfe jussivische Verwünschung bleiben erhalten; seltene oder erklärungsbedürftige hebräische Nuancen stehen in den Fußnoten.
