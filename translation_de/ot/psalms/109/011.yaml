  text: Ein Gläubiger möge alles an sich reißen, was ihm gehört,[a] und Fremde mögen den Ertrag seiner Arbeit plündern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fangen“; das hebräische Verb kann bedeuten, eine Falle oder Schlinge zu stellen bzw. zu fangen. Hier ist wohl gemeint, dass ein Gläubiger auf seinen gesamten Besitz Anspruch erhebt und ihn an sich nimmt.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: יְנַקֵּשׁ
  choice: an sich reißen
  rationale: Das Piel von נקש bezeichnet wörtlich ein Fangen oder Umgarnen. Zusammen mit נֹשֶׁה und dem Besitz als Objekt gibt „an sich reißen“ die aggressive Inbesitznahme durch den Gläubiger natürlich wieder, ohne das Bild einer buchstäblichen Falle aufzudrängen.
- source_word: נ֭וֹשֶׁה
  choice: Gläubiger
  rationale: Das Wort bezeichnet einen Kreditgeber beziehungsweise jemanden, der eine Schuld einfordert. „Gläubiger“ ist im Deutschen der präzise und geläufige Ausdruck.
- source_word: לְכָל אֲשֶׁר לוֹ
  choice: alles, was ihm gehört
  rationale: Die Formulierung bewahrt den umfassenden und possessiven Sinn der hebräischen Wendung.
- source_word: וְיָבֹזּוּ
  choice: plündern
  rationale: בזז bezeichnet gewaltsames Erbeuten. „Plündern“ erhält diesen räuberischen Beiklang und passt zum poetischen Register.
- source_word: זָרִים
  choice: Fremde
  rationale: Der Ausdruck meint Menschen außerhalb des eigenen Kreises. „Fremde“ bewahrt diese Offenheit, ohne sie unnötig ethnisch oder national zu bestimmen.
- source_word: יְגִיעוֹ
  choice: was er sich erarbeitet hat
  rationale: יְגִיעַ kann den Ertrag oder Gewinn der Mühe bezeichnen. Die deutsche Wendung macht deutlich, dass das Ergebnis seiner Arbeit geplündert wird, nicht die Tätigkeit selbst.
theological_decisions:
- issue: Jussivische Kraft der Verwünschung
  choice: Die Verben werden als Wunsch beziehungsweise Verwünschung mit „soll“ wiedergegeben.
  alternative: 'Eine schlichte Zukunftsaussage: „Ein Gläubiger wird ... und Fremde werden ...“'
  rationale: Im Zusammenhang der Verwünschungen von Psalm 109 sind die Yiqtol-Formen am besten als jussivische Wünsche zu verstehen. Das deutsche „soll“ erhält den Fluchcharakter und klingt in dieser poetischen Reihe natürlicher als eine bloße Zukunftsprognose.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelität. Die harte Sprache der Verwünschung wird nicht abgeschwächt; zugleich bleibt die Bildhaftigkeit des ersten Verbs in der Fußnote sichtbar.
