base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/018.yaml
  text: He clothed himself with cursing as his garment[a]; it came into his inward parts like water[c][b], and like oil into his bones.
translation:
  language: de
  text: Er zog den Fluch an wie sein Gewand[a]; der Fluch drang wie Wasser in sein Inneres[b] und wie Öl in seine Gebeine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er kleidete sich mit Fluch wie mit seinem Gewand.«'
    reason: lexical_alternative
  - marker: b
