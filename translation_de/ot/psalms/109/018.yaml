    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְבַּשׁ
  choice: Er kleidete sich
  rationale: Das Verb לבשׁ bezeichnet das Anziehen oder Sichkleiden und bewahrt hier die bildhafte, auf das Subjekt bezogene Handlung.
- source_word: קְלָלָה
  choice: in Fluch
  rationale: קְלָלָה kann einen Fluch oder das Fluchen bezeichnen. Der singularische Fortgang mit dem femininen Verb וַתָּבֹא legt hier »Fluch« als personifiziert wirkende Größe nahe.
- source_word: כְּמַדּוֹ
  choice: wie in sein Gewand
  rationale: מַד bezeichnet ein Kleidungsstück oder Gewand. Das wiederholte »in« ergibt im Deutschen ein natürliches Bild des Sichkleidens, ohne die Vergleichspartikel abzuschwächen.
- source_word: וַתָּבֹא
  choice: da drang er
  rationale: Das feminine Singularverb nimmt קְלָלָה auf. »Drang« gibt zusammen mit den folgenden Körperangaben die Bewegung ins Innere idiomatisch wieder.
- source_word: כַמַּיִם
  choice: wie Wasser
  rationale: Die direkte Vergleichsform erhält das Bild einer tiefen, umfassenden Durchdringung.
- source_word: בְּקִרְבּוֹ
  choice: in sein Inneres
  rationale: קֶרֶב kann die inneren Teile oder das innere Wesen bezeichnen. »Inneres« bewahrt die mögliche körperliche und umfassendere Bedeutung.
- source_word: וְכַשֶּׁמֶן
  choice: und wie Öl
  rationale: Die koordinierte Vergleichsform wird unmittelbar beibehalten; im Zusammenhang bezeichnet Öl das tiefe Eindringen.
- source_word: בְּעַצְמוֹתָיו
  choice: in seine Gebeine
  rationale: עֲצָמוֹת bezeichnet die Knochen; »Gebeine« entspricht dem würdevollen poetischen Register des Psalms und verbindet sich idiomatisch mit »drang«.
theological_decisions:
- issue: Fluchbild und Urheberschaft
  choice: Der Mann zieht den Fluch selbst wie ein Gewand an; anschließend dringt dieser in ihn ein.
  alternative: Gott lässt den Fluch ausdrücklich in ihn eindringen oder legt ihn ihm auf.
  rationale: Der hebräische Vers nennt hier keine ausdrückliche göttliche Urheberschaft. Die Übersetzung erhält die Spannung zwischen selbst gewähltem Fluch und dessen eindringender Wirkung.
translation_notes:
  register: Moderne, würdige Psalmsprache. »Gebeine« ist bewusst poetischer als »Knochen«; Satzbau und Bilder bleiben eng am Hebräischen, ohne im Deutschen unnatürlich zu wirken.
