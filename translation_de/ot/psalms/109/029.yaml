  text: יִלְבְּשׁ֣וּ שׂוֹטְנַ֣/י כְּלִמָּ֑ה וְ/יַעֲט֖וּ כַ/מְעִ֣יל בָּשְׁתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/029.yaml
  text: May my accusers be clothed with disgrace[a], and wrap themselves in their shame like a robe.
translation:
  language: de
  text: Mögen meine Ankläger sich mit Schande bekleiden[a] und sich in ihre Schmach hüllen wie in einen Mantel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Gegner«. Das hebräische Wort kann allgemein Widersacher oder in einem stärker rechtlichen Sinn Ankläger bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִלְבְּשׁוּ
  choice: sollen sich … bekleiden
  rationale: Der Qal-Imperfekt 3. Person Plural wird im Zusammenhang des Bitt- und Fluchgebets jussivisch wiedergegeben. Die reflexive Formulierung ist im Deutschen bei »sich mit etwas bekleiden« natürlich und bewahrt das Kleidungsbild.
- source_word: שׂוֹטְנַי
  choice: meine Ankläger
  rationale: Das partizipiale Substantiv mit Suffix der 1. Person Singular kann allgemein Gegner oder, besonders in einem rechtlich gefärbten Zusammenhang, Ankläger bezeichnen. »Meine Ankläger« passt zum Kontext, ohne die allgemeinere Bedeutung auszuschließen.
- source_word: כְּלִמָּה
  choice: Schande
  rationale: Das Wort bezeichnet öffentliche Schmach oder Entehrung. »Schande« ist prägnant und unterscheidet den Ausdruck sprachlich von בָּשְׁתָּם.
- source_word: וְיַעֲטוּ
  choice: und sich … umhüllen
  rationale: Der Qal-Imperfekt von עטה beschreibt das Umlegen oder Einhüllen in ein Kleidungsstück. Die reflexive Wiedergabe entspricht dem Bild und klingt im Deutschen natürlich.
- source_word: כַמְעִיל
  choice: wie einen Mantel
  rationale: מְעִיל bezeichnet ein längeres Obergewand. »Mantel« ist im modernen Deutsch verständlich und erhält das Bild eines den Menschen umschließenden Kleidungsstücks.
- source_word: בָּשְׁתָּם
  choice: ihre Beschämung
  rationale: Das Substantiv mit Suffix der 3. Person Plural bezeichnet Scham, Schmach oder Beschämung. »Ihre Beschämung« bewahrt den Unterschied zu כְּלִמָּה und kann sowohl den Zustand als auch die erfahrene Erniedrigung ausdrücken.
theological_decisions:
- issue: Verbmodus in einem Fluch- und Bittpsalm
  choice: 'Die Imperfektformen werden als Wunsch beziehungsweise Bitte wiedergegeben: »sollen sich … bekleiden … und sich … umhüllen«.'
  alternative: 'Futurische Aussage: »Meine Ankläger werden sich … bekleiden …«'
  rationale: Im Zusammenhang der Bitten von Psalm 109 liegt eine jussivische Bedeutung nahe. »Sollen« bewahrt im Deutschen den Charakter des ausgesprochenen Wunsches, ohne ihn als bloße Zukunftsvorhersage festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Kleidungsbilder werden erhalten; »Schande« und »Beschämung« geben die zwei eng verwandten, aber unterschiedlichen hebräischen Substantive wieder.
