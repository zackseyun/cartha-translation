base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/030.yaml
  text: I will give great thanks to Yahweh with my mouth[b][a]; in the midst of many I will praise him.
translation:
  language: de
  text: Ich will Jahwe mit meinem Mund sehr danken; inmitten vieler will ich ihn loben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: א֘וֹדֶ֤ה
  choice: ich will … danken
  rationale: Das Hifil von ידה bezeichnet im Kontext der Psalmen gewöhnlich dankendes Preisen. „Danken“ ist im Deutschen natürlich und passt zum parallelen „loben“.
- source_word: יְהוָ֣ה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, sodass der im Hebräischen ausdrücklich gebrauchte Eigenname erhalten bleibt.
- source_word: מְאֹ֣ד
  choice: von ganzem Herzen
  rationale: מאד verstärkt hier das Danken. Die idiomatische Wendung drückt nachdrücklichen Dank aus, ohne das Hebräische unnötig sperrig als „sehr“ wiederzugeben.
- source_word: בְּ/פִ֑/י
  choice: mit meinem Mund
  rationale: Die Präposition bezeichnet das Mittel des Dankens; die konkrete körperliche Ausdrucksweise des Hebräischen bleibt erhalten.
- source_word: וּ/בְ/ת֖וֹךְ רַבִּ֣ים
  choice: inmitten vieler
  rationale: Die Formulierung bildet die räumlich-gemeinschaftliche Aussage eng ab, ohne eine im Text nicht ausdrücklich genannte Versammlung einzuführen.
- source_word: אֲהַֽלְלֶֽ/נּוּ
  choice: will ich ihn loben
  rationale: Das Piel von הלל bedeutet hier „loben“; das männliche Suffix verweist auf Jahwe zurück.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen ausdrücklich. „Jahwe“ bewahrt diesen Eigennamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdige Psalmsprache mit klarer Parallelstruktur. „Von ganzem Herzen“ ist idiomatisch und deutet die Verstärkung durch מאד, während „mit meinem Mund“ die ausdrückliche, öffentliche Artikulation bewahrt.
