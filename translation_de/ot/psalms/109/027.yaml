  yaml_path: translation/ot/psalms/109/027.yaml
  text: Let them know that this is your hand; you[a], O Yahweh, have done it.
translation:
  language: de
  text: Sie sollen erkennen[a], dass dies deine Hand ist; du, Jahwe, hast es getan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mögen sie erkennen“ oder „Und sie sollen erkennen“. Das hebräische Verb hat im Zusammenhang wahrscheinlich auffordernden beziehungsweise wünschenden Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: Sie sollen erkennen
  rationale: Das Qal-Imperfekt mit vorangestelltem וְ hat im Kontext wahrscheinlich einen jussivischen Sinn und drückt den Wunsch beziehungsweise die Bitte des Beters aus.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet hier den Inhalt dessen ein, was sie erkennen sollen.
- source_word: יָדְךָ
  choice: deine Hand
  rationale: Die wörtliche Metapher bewahrt den Gedanken von Gottes Wirken und Macht, ohne ihn erklärend einzuengen.
- source_word: זֹּאת
  choice: dies
  rationale: Das feminine Demonstrativpronomen verweist auf das zuvor erbetene Eingreifen beziehungsweise Geschehen; das neutrale deutsche „dies“ hält den Bezug offen.
- source_word: אַתָּה
  choice: du
  rationale: Das selbstständige Pronomen ist betont; die Voranstellung „du, Jahwe“ gibt diese Hervorhebung natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עֲשִׂיתָהּ
  choice: hast es getan
  rationale: Das Verb עשה bezeichnet hier Gottes vollzogene Handlung; das Suffix wird im Deutschen idiomatisch mit „es“ aufgenommen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ bewahrt diesen als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Aussage über Gottes Urheberschaft
  choice: du, Jahwe, hast es getan
  alternative: Jahwe, du selbst hast es vollbracht
  rationale: Die Formulierung erhält die Betonung des ausdrücklichen Pronomens und schreibt das betreffende Eingreifen Gott zu, ohne die Art des Handelns näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erkennen“ gibt ידע in diesem Zusammenhang etwas gewichtiger als bloßes „wissen“ wieder; „deine Hand“ bleibt als biblisch verständliche Metapher erhalten. Der Fußnotenmarker steht nach dem vollständigen Vers, bezieht sich jedoch auf die einleitende Verbform.
