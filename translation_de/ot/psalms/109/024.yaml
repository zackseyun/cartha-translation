  yaml_path: translation/ot/psalms/109/024.yaml
  text: My knees give way from fasting[a], and my flesh grows lean from lack of fat.
translation:
  language: de
  text: Meine Knie geben vom Fasten nach, und mein Leib ist ohne Fett mager geworden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und mein Leib ist abgemagert, weil ihm Fett fehlt.“ Die hebräische Wendung bezeichnet den Verlust oder das Fehlen von Körperfett, also Abmagerung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּי
  choice: meine Knie
  rationale: Der Plural mit Suffix der 1. Person Singular bezeichnet gewöhnlich die Knie und bewahrt das konkrete Bild körperlicher Schwäche.
- source_word: כָּשְׁלוּ
  choice: wanken
  rationale: Das Verb bezeichnet Stolpern oder Schwanken. Bei Knien gibt „wanken“ die durch Schwäche verursachte Unsicherheit natürlich und bildnah wieder.
- source_word: מִצּוֹם
  choice: vom Fasten
  rationale: מִן bezeichnet hier die Ursache; die knappe Formulierung ist im Deutschen natürlich und bleibt nah am Hebräischen.
- source_word: וּבְשָׂרִי
  choice: und mein Leib
  rationale: בשר meint hier die körperliche Substanz. „Leib“ klingt in diesem poetischen Klagekontext natürlicher als das missverständliche „Fleisch“, ohne den körperlichen Sinn zu verlieren.
- source_word: כָּחַשׁ
  choice: ist abgemagert
  rationale: Das Verb beschreibt das Mager- oder Ausgezehrtwerden. Das Perfekt gibt den im hebräischen Vers dargestellten eingetretenen körperlichen Zustand treffend wieder.
- source_word: מִשָּׁמֶן
  choice: ohne Fett
  rationale: Die schwierige Wendung bezeichnet wahrscheinlich den Verlust beziehungsweise das Fehlen von Körperfett und damit Abmagerung. Die Übersetzung bewahrt die konkrete Aussage.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Kürze. „Leib“ vermeidet die im heutigen Deutschen leicht missverständliche Wendung „mein Fleisch“. Die Fußnote erhält die echte Mehrdeutigkeit von שׁמן zwischen Fett und Öl.
