source:
  edition: WLC
  text: לַ֭/מְנַצֵּחַ לְ/דָוִ֣ד מִזְמ֑וֹר אֱלֹהֵ֥י תְ֝הִלָּתִ֗/י אַֽל תֶּחֱרַֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/001.yaml
  text: For the choirmaster[a]. Of David. A psalm. O God of my praise[b], do not be silent.
translation:
  language: de
  text: 'Für den Chorleiter. Von David.[a] Ein Psalm.


    Gott meines Lobes, schweige nicht![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Überschrift kann auch „Für David“, „David zugeordnet“ oder „David gewidmet“ bedeuten.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Bleib nicht stumm!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In Psalmüberschriften bezeichnet der Ausdruck üblicherweise den musikalischen Leiter. „Chorleiter“ ist eine klare, heutige und würdige deutsche Entsprechung.
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Präposition לְ ist in Psalmüberschriften mehrdeutig. „Von David“ ist im Deutschen die herkömmliche knappe Form; eine Fußnote weist darauf hin, dass auch Zuordnung oder Widmung gemeint sein kann.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Dies ist die geläufige und sachlich passende deutsche Bezeichnung der Gattung.
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: Gott meines Lobes
  rationale: Die konstruktive Fügung wird möglichst unmittelbar wiedergegeben. So bleibt die poetische Offenheit zwischen dem Gott, dem das Lob gilt, und dem Gott, von dem das Lob des Beters ausgeht, erhalten.
- source_word: אַל תֶּחֱרַשׁ
  choice: schweige nicht
  rationale: Die negative Bitte mit dem Verb חרשׁ fordert Gott dazu auf, nicht still oder untätig zu bleiben. „Schweige nicht“ ist knapp, natürlich und entspricht dem Gebetston.
theological_decisions:
- issue: Bedeutung der Überschrift לְדָוִד
  choice: „Von David“ im Haupttext mit Hinweis auf die Mehrdeutigkeit
  alternative: „Für David“, „David zugeordnet“ oder „David gewidmet“
  rationale: Das Hebräische kann Autorschaft, Zugehörigkeit oder Widmung ausdrücken. Die traditionelle Form bleibt lesbar, während die Fußnote verhindert, dass Autorschaft als einzig mögliche Deutung festgelegt wird.
- issue: Beziehung in אֱלֹהֵי תְהִלָּתִי
  choice: „Gott meines Lobes“
  alternative: „Gott, den ich lobe“ oder „mein ruhmwürdiger Gott“
  rationale: Die wörtlich-poetische Fügung bewahrt die theologische und grammatische Offenheit des Hebräischen, ohne sie auf eine einzige Relation einzuengen.
translation_notes:
  register: Modernes Standarddeutsch mit knapper, würdiger Gebetssprache. Die Psalmüberschrift bleibt formal gegliedert; die poetische Wendung „Gott meines Lobes“ wird bewusst nicht paraphrasiert.
