  naturalness: „Jemanden anfeinden“ ist im modernen Standarddeutsch idiomatisch; die Stellung „feinden sie mich an“ wirkt jedoch unnötig markiert und weniger flüssig. „Sie feinden mich an“ ist natürlich und bewahrt die knappe poetische Struktur. „Ich aber bin Gebet“ darf als bewusst auffällige, quellentreue Bildsprache stehen bleiben.
