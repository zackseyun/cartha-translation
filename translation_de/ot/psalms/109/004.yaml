  text: תַּֽחַת אַהֲבָתִ֥/י יִשְׂטְנ֗וּ/נִי וַ/אֲנִ֥י תְפִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/004.yaml
  text: In return for my love[a], they accuse me, but I am prayer.
translation:
  language: de
  text: Als Gegenleistung für meine Liebe feinden sie mich an; ich aber bin Gebet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „ich aber bete“ oder „ich aber bin ein Mensch des Gebets“. Wörtlich: „ich aber bin Gebet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: als Antwort auf
  rationale: Die Präposition bezeichnet hier Vergeltung beziehungsweise einen Austausch, nicht die räumliche Bedeutung „unter“. „Als Antwort auf“ gibt den widersinnigen Gegenzug zur Liebe natürlich wieder.
- source_word: אַהֲבָתִי
  choice: meine Liebe
  rationale: Das Substantiv bezeichnet Liebe oder Zuneigung. „Meine Liebe“ ist direkt, verständlich und bewahrt die übliche biblische Wortverbindung.
- source_word: יִשְׂטְנוּנִי
  choice: feinden sie mich an
  rationale: Das Verb שׂטן bedeutet, als Gegner aufzutreten, anzufeinden oder anzuklagen. „Anfeinden“ bewahrt die adversative Bedeutung, ohne den Kontext zwingend auf eine gerichtliche Anklage festzulegen.
- source_word: וַאֲנִי
  choice: ich aber
  rationale: Das Waw verbindet formal, drückt hier jedoch einen deutlichen Gegensatz zum Verhalten der Gegner aus.
- source_word: תְפִלָּה
  choice: Gebet
  rationale: Der hebräische Nominalsatz lautet zugespitzt wörtlich „ich [bin] Gebet“. Die substantivische Form bewahrt die auffällige Verdichtung des Ausgangstextes.
theological_decisions:
- issue: Bedeutung des verdichteten Nominalsatzes וַאֲנִי תְפִלָּה
  choice: Die wörtliche Bildsprache „ich aber bin Gebet“ bleibt im Haupttext erhalten.
  alternative: „ich aber bete“ oder „ich aber bin ein Mann des Gebets“
  rationale: Die hebräische Form ist bewusst knapp und kann das vollständige Aufgehen des Beters im Gebet ausdrücken. Eine verbale oder personale Ergänzung wäre verständlicher, würde die echte sprachliche Verdichtung jedoch interpretierend auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung „ich bin Gebet“ ist bewusst beibehalten; die mögliche gerichtliche Nuance des feindlichen Handelns wird nicht überpräzisiert.
