    rationale: 'In „Als Antwort auf meine Liebe feinden sie mich an“ ist die Satzstellung grammatisch möglich, aber stilistisch steif. „Als Antwort auf meine Liebe sie feinden mich an“ wäre nicht standardsprachlich; daher sollte die Präpositionalgruppe besser abgetrennt und die reguläre Hauptsatzstellung verwendet werden: „Als Antwort auf meine Liebe feinden sie mich an“ ist allerdings standardsprachlich. Für höhere poetische Klarheit und idiomatischen Fluss empfiehlt sich „Für meine Liebe feinden sie mich an“ oder „Statt meiner Liebe feinden sie mich an“. Die Vergeltungsnuance von תַּחַת wird am präzisesten durch „Als Gegenleistung für“ ausgedrückt.'
