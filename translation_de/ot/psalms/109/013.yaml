  text: Mögen seine Nachkommen ausgerottet werden[a]; in einer späteren Generation möge ihr Name ausgelöscht werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Möge sein Ende in Vernichtung münden.« אַחֲרִית kann »Ende« oder »Zukunft« bedeuten; hier spricht der Zusammenhang jedoch für die Bedeutung »Nachkommen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: sollen … werden
  rationale: Der Jussiv von היה drückt hier einen Wunsch beziehungsweise eine Verwünschung aus. Die deutsche Soll-Konstruktion gibt diese volitive Kraft in würdigem, natürlichem Deutsch wieder.
- source_word: אַחֲרִיתוֹ
  choice: seine Nachkommen
  rationale: אַחֲרִית kann „Ende“ oder „Zukunft“ bedeuten. Der Zusammenhang mit dem Ausrotten und dem Namen in der nächsten Generation spricht hier für die fortbestehende Linie, also die Nachkommen.
- source_word: לְהַכְרִית
  choice: ausgerottet werden
  rationale: Der Infinitiv mit ל bezeichnet Ziel oder Ergebnis. „Ausgerottet werden“ gibt die vollständige Beseitigung der Nachkommenschaft idiomatisch wieder.
- source_word: בְּדוֹר אַחֵר
  choice: in der nächsten Generation
  rationale: Die Wendung bezeichnet im Kontext die folgende Generation; diese Wiedergabe ist im heutigen Deutsch klar und natürlich.
- source_word: יִמַּח
  choice: soll … ausgelöscht werden
  rationale: Das Nifal von מחה bedeutet bei einem Namen, dass er getilgt oder ausgelöscht wird. „Ausgelöscht“ bewahrt das kräftige Bild und passt idiomatisch zum Namen.
- source_word: שְׁמָם
  choice: ihr Name
  rationale: Das hebräische Suffix ist pluralisch und bezieht sich auf die Nachkommen als Gruppe, während „Name“ im Singular kollektiv deren fortbestehendes Andenken beziehungsweise Geschlecht bezeichnet.
theological_decisions:
- issue: Verwünschungscharakter des Verses
  choice: Die Gebets- und Wunschform als Verwünschung gegen die Linie des Frevlers beibehalten
  alternative: Den Vers zu einer bloßen Vorhersage über seine Zukunft abschwächen
  rationale: Der Jussiv und der Zusammenhang von Psalm 109 formulieren Bitten um Gericht, nicht neutrale Zukunftsaussagen. Die Übersetzung wahrt diese Spannung und mildert die Härte nicht stillschweigend ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Soll-Konstruktion bewahrt den im Hebräischen ausgedrückten Wunsch- beziehungsweise Verwünschungscharakter. Die Fußnote hält die echte lexikalische Mehrdeutigkeit von אַחֲרִית offen.
