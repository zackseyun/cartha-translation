  source_fidelity: Der jussivische Wunschcharakter von תְּהִי ist mit „Es sei“ zutreffend wiedergegeben. Die Bilder von Gewand und Gürtel sowie die fortdauernde Bedeutung von תָּמִיד bleiben erhalten. Die feminine Objektendung in יַחְגְּרֶהָ bezieht sich auf den Gürtel und verlangt eine Formulierung, die das Umbinden um den eigenen Körper klar erkennen lässt.
  naturalness: „in das er sich hüllt“ ist idiomatisch und bewahrt das umhüllende Bild. „einen Gürtel umlegen“ ist ohne reflexive Ergänzung oder Ortsangabe jedoch leicht unvollständig bzw. weniger präzise. „um sich bindet“ ist modernes, klares Standarddeutsch.
  terminology: „Gewand“ und „Gürtel“ sind angemessene, nicht überpräzisierende Entsprechungen für בֶּגֶד und מֵזַח. Die Verwünschungsformel bleibt im würdigen Register, ohne den Text theologisch auszudeuten.
