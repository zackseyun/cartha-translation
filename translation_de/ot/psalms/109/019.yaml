  text: תְּהִי ל֭/וֹ כְּ/בֶ֣גֶד יַעְטֶ֑ה וּ֝/לְ/מֵ֗זַח תָּמִ֥יד יַחְגְּרֶֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/019.yaml
  text: May it be like a garment that he wraps around himself[a], and like a belt that he always girds on.
translation:
  language: de
  text: Es sei für ihn wie ein Gewand, in das er sich hüllt, und wie ein Gürtel, den er ständig um sich bindet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהִי
  choice: Es sei
  rationale: Der Jussiv Qal 3. Person Feminin Singular von היה drückt im Zusammenhang einen Wunsch beziehungsweise eine Verwünschung aus.
- source_word: ל֭וֹ
  choice: für ihn
  rationale: Die Präposition mit Suffix bezeichnet die Beziehung zu dem von der Verwünschung Betroffenen und wird im Deutschen ausdrücklich wiedergegeben.
- source_word: כְּבֶ֣גֶד
  choice: wie ein Gewand
  rationale: בגד ist eine allgemeine Bezeichnung für ein Kleidungsstück; »Gewand« bewahrt das Bild, ohne eine bestimmte Kleidungsart festzulegen.
- source_word: יַעְטֶ֑ה
  choice: in das er sich hüllt
  rationale: עטה kann das Umhüllen oder Bekleiden bezeichnen. Die Formulierung gibt das Bild des vollständigen Umgebenseins natürlich wieder.
- source_word: וּלְמֵזַח
  choice: und wie ein Gürtel
  rationale: מזח bezeichnet einen Gürtel oder eine umgebundene Schärpe. »Gürtel« ist im modernen Deutsch klar und passt zum folgenden Verb.
- source_word: תָּמִיד
  choice: ständig
  rationale: Das Adverb bezeichnet fortwährende beziehungsweise regelmäßige Dauer.
- source_word: יַחְגְּרֶהָ
  choice: den er ständig umlegt
  rationale: חגר bezeichnet das Umbinden oder Anlegen eines Gürtels; das feminine Suffix nimmt das als Gürtel vorgestellte Bezugswort auf. »umlegt« bewahrt die konkrete Handlung in natürlichem Deutsch.
theological_decisions:
- issue: Jussivische Kraft im Zusammenhang einer Verwünschung
  choice: 'Als Wunsch beziehungsweise Verwünschung wiedergeben: »Es sei …«'
  alternative: 'Als Vorhersage wiedergeben: »Es wird … sein.«'
  rationale: Die hebräische Verbform und der Kontext von Psalm 109 sprechen für eine gewünschte Strafwirkung, nicht lediglich für eine neutrale Zukunftsaussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Kleidungsbilder und die konkrete Handlung des Umhüllens beziehungsweise Umbindens bleiben erhalten; archaisches »sich gürten« wird vermieden.
