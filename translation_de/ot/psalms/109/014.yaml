  text: יִזָּכֵ֤ר עֲוֺ֣ן אֲ֭בֹתָי/ו אֶל יְהוָ֑ה וְ/חַטַּ֥את אִ֝מּ֗/וֹ אַל תִּמָּֽח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/014.yaml
  text: May the guilt of his fathers be remembered before Yahweh[c][b][a], and may the sin of his mother not be blotted out.
translation:
  language: de
  text: Möge die Schuld[a] seiner Väter[b] vor Jahwe in Erinnerung gerufen werden, und die Sünde seiner Mutter möge nicht ausgelöscht werden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Unrecht“ beziehungsweise „die Verfehlung“. Das hebräische Wort kann die Tat, die Schuld oder die daraus entstehende Haftung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seiner Vorfahren“; wörtlich: „seiner Väter“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „nicht weggewischt“ beziehungsweise „nicht getilgt werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזָּכֵר
  choice: möge … in Erinnerung bleiben
  rationale: Das Nifal Imperfekt hat im Kontext des Fluchgebets jussivischen Sinn. Die Formulierung bewahrt den passiven Gedanken des Hebräischen und klingt zugleich natürlich.
- source_word: עֲוֺן
  choice: Schuld
  rationale: עָוֹן kann die Verfehlung selbst, die daraus erwachsende Schuld oder deren Folgen bezeichnen. „Schuld“ passt hier zur Vorstellung, dass sie vor Gott in Erinnerung bleibt, ohne die Bedeutungsbreite völlig festzulegen.
- source_word: אֲבֹתָיו
  choice: seiner Väter
  rationale: Die wörtliche Wiedergabe erhält den konkreten hebräischen Verwandtschaftsbegriff; im Zusammenhang können damit auch die Vorfahren gemeint sein.
- source_word: אֶל יְהוָה
  choice: vor Jahwe
  rationale: Bei זכר bezeichnet אֶל hier das Erinnern in Gottes Gegenwart beziehungsweise vor ihm. „Vor Jahwe“ bewahrt zudem den möglichen gerichtlichen Beiklang.
- source_word: וְחַטַּאת
  choice: und die Sünde
  rationale: חַטָּאת bezeichnet hier parallel zu עָוֹן die Sünde, nicht ein Sündopfer.
- source_word: אִמּוֹ
  choice: seiner Mutter
  rationale: Direkte und natürliche Wiedergabe des Nomens mit Possessivsuffix.
- source_word: אַל תִּמָּח
  choice: möge nicht ausgelöscht werden
  rationale: Die verneinte jussivische Form bezeichnet den Wunsch, dass die Sünde nicht weggewischt oder aus dem maßgeblichen Gedächtnis beziehungsweise Verzeichnis getilgt wird. „Ausgelöscht“ erhält dieses Bild.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Fortwirkende Schuld früherer Generationen
  choice: Die Aussage bleibt als Bitte formuliert, dass die Schuld der Väter vor Jahwe in Erinnerung bleibe.
  alternative: Die Schuld ausdrücklich dem im Vers genannten Mann persönlich zurechnen oder die Aussage auf bloße historische Erinnerung abschwächen.
  rationale: Der Vers lässt offen, wie sich die Schuld der Väter auf den Betroffenen auswirkt. Die Übersetzung bewahrt diese theologische Spannung und fügt keine Erklärung zur generationenübergreifenden Verantwortung hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Wunschformen „Möge …“ und „möge nicht …“ geben den im Hebräischen jussivisch gebrauchten Kontext des Fluchgebets wieder. Die Bildsprache von Erinnerung und Auslöschung bleibt erhalten.
