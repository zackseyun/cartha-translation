source:
  edition: WLC
  text: יִהְי֣וּ נֶֽגֶד יְהוָ֣ה תָּמִ֑יד וְ/יַכְרֵ֖ת מֵ/אֶ֣רֶץ זִכְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/015.yaml
  text: May they be before Yahweh continually[a], and may he cut off their memory from the earth.
translation:
  language: de
  text: Mögen sie beständig vor Jahwe sein, und möge er ihr Andenken von der Erde[a] tilgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Land“; das hebräische Wort אֶרֶץ kann je nach Zusammenhang „Erde“ oder „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Mögen sie sein
  rationale: Der Qal-Imperfekt der 3. Person Plural hat im Zusammenhang des Fluchgebets jussivischen Sinn; „Mögen sie … sein“ gibt den Wunsch- bzw. Gebetscharakter wieder.
- source_word: נֶגֶד
  choice: vor
  rationale: Die Präposition bezeichnet das Sein vor jemandem bzw. in dessen Gegenwart; „vor“ wahrt hier sowohl den räumlichen als auch den möglichen gerichtlichen Beiklang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תָּמִיד
  choice: beständig
  rationale: Das Adverb bezeichnet fortdauernde Gegenwart; „beständig“ ist natürlich, prägnant und dem feierlichen Zusammenhang angemessen.
- source_word: וְיַכְרֵת
  choice: und möge er … tilgen
  rationale: Der Hifil-Imperfekt wird parallel zum ersten Verb jussivisch verstanden. „Tilgen“ gibt im Deutschen die vollständige Beseitigung des Andenkens idiomatisch wieder.
- source_word: מֵאֶרֶץ
  choice: von der Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Im Zusammenhang mit der Auslöschung des Andenkens bezeichnet „Erde“ wahrscheinlich den umfassenden Bereich menschlicher Erinnerung; die Alternative bleibt in der Fußnote erhalten.
- source_word: זִכְרָם
  choice: ihr Andenken
  rationale: Das Substantiv bezeichnet die bleibende Erinnerung oder das erinnerte Ansehen einer Person. „Ihr Andenken“ entspricht der deutschen Wendung für das Fortleben im Gedächtnis.
theological_decisions:
- issue: Jussivischer Charakter des Fluchgebets
  choice: 'Beide Verben werden als Wünsche bzw. Bitten wiedergegeben: „Mögen … und möge …“'
  alternative: 'Aussagesätze im Futur: „Sie werden … und er wird …“'
  rationale: Der Kontext des Fluchgebets und die parallelen hebräischen Imperfektformen sprechen für jussivischen Sinn. Die Übersetzung bewahrt die scharfe Gebetsrhetorik, ohne sie zu einer bloßen Zukunftsaussage umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Konstruktion „Mögen … und möge …“ bewahrt den Gebetscharakter; „ihr Andenken tilgen“ ist idiomatisch und zugleich nah am hebräischen Bild vollständiger Beseitigung.
