  text: אִם אָ֭מַרְתִּי מָ֣טָה רַגְלִ֑/י חַסְדְּ/ךָ֥ יְ֝הוָ֗ה יִסְעָדֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/018.yaml
  text: When I said, “My foot is slipping,” your steadfast love, O LORD, upheld me.
translation:
  language: de
  text: 'Als ich sagte: »Mein Fuß gerät ins Wanken«, da stützte mich deine treue Liebe, HERR.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: Als ich sagte
  rationale: אִם kann hier im Rückblick temporal bzw. situationsbezogen verstanden werden; im Zusammenhang beschreibt der Vers einen tatsächlich erlebten Moment und nicht bloß eine hypothetische Möglichkeit.
- source_word: מָטָה רַגְלִי
  choice: Mein Fuß gerät ins Wanken
  rationale: מוט bezeichnet das Wanken, Schwanken oder Abgleiten. Die idiomatische Formulierung bewahrt das Bild gefährdeter Standfestigkeit.
- source_word: חַסְדְּךָ
  choice: deine treue Liebe
  rationale: חֶסֶד umfasst beständige, loyale und gnädige Zuwendung; »treue Liebe« gibt die Beziehungs- und Beständigkeitsdimension knapp wieder.
- source_word: יִסְעָדֵנִי
  choice: stützte mich
  rationale: סעד bedeutet stützen oder Halt geben und entspricht unmittelbar dem Bild des wankenden Fußes.
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen wird beibehalten.
theological_decisions:
- issue: Zeitlicher oder konditionaler Sinn von אִם
  choice: Als ich sagte
  alternative: Wenn ich sagte / Hätte ich gesagt
  rationale: Der poetische Zusammenhang legt eine erinnerte Notsituation mit tatsächlich erfahrener göttlicher Hilfe nahe. Die Übersetzung macht diesen Sinn natürlich verständlich, ohne die Aussage theologisch auszuweiten.
translation_notes:
  register: Moderne, würdevolle Psalmsprache mit einem klaren Körperbild. »Gerät ins Wanken« klingt natürlich und hält zugleich die metaphorische Offenheit zwischen körperlicher Gefahr und innerer Unsicherheit fest.
