  yaml_path: translation/ot/psalms/094/004.yaml
  text: They gush forth[a]; they speak arrogantly[b]; all the workers of wickedness boast.
translation:
  language: de
  text: Sie lassen Worte hervorsprudeln, sie reden Freches; alle Übeltäter brüsten sich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַבִּיעוּ
  choice: sie sprudeln hervor
  rationale: Das Hifil von נבע bezeichnet ein Hervorquellen oder Hervorsprudeln. Ohne ein ausdrücklich genanntes Objekt bewahrt „sprudeln hervor“ das kraftvolle Bild und die knappe poetische Form; der folgende Ausdruck macht deutlich, dass es um Rede geht.
- source_word: יְדַבְּרוּ
  choice: sie reden
  rationale: דבר bedeutet hier schlicht „reden/sprechen“. „Reden“ klingt im Zusammenhang mit dem nachfolgenden Ausdruck natürlich und wahrt die Parallelität.
- source_word: עָתָק
  choice: vermessen
  rationale: Das Wort bezeichnet anmaßende, hochmütige oder freche Rede. Die adverbiale Wiedergabe „vermessen“ ist im Deutschen knapp, würdig und lässt sowohl Hochmut als auch Anmaßung anklingen.
- source_word: יִתְאַמְּרוּ
  choice: brüsten sich
  rationale: Die Hitpael-Form bezeichnet hier selbstüberhebendes Auftreten beziehungsweise Selbstrühmen. „Sich brüsten“ gibt diesen reflexiven und prahlerischen Sinn idiomatisch wieder.
- source_word: כָּל
  choice: alle
  rationale: „Alle“ bewahrt die umfassende Bedeutung und passt natürlich zum pluralischen Ausdruck.
- source_word: פֹּעֲלֵי אָוֶן
  choice: Übeltäter
  rationale: Wörtlich handelt es sich um „Täter von Unheil/Bosheit“. „Übeltäter“ ist eine natürliche, prägnante deutsche Wiedergabe, die sowohl das Tun als auch dessen moralische Qualität ausdrückt.
