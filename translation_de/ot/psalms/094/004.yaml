  terminology: „Freches“ gibt die insolente, anmaßende Qualität von עָתָק prägnant wieder. „Übeltäter“ für פֹּעֲלֵי אָוֶן und „brüsten sich“ für יִתְאַמְּרוּ sind passend und registergerecht.
