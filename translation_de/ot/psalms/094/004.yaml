  source_fidelity: Der Entwurf trifft die Abfolge der drei hebräischen Verben und die Selbstüberhebung der פֹּעֲלֵי אָוֶן grundsätzlich. Das Hifil יַבִּיעוּ bezeichnet jedoch das Hervorquellenlassen bzw. Ausströmenlassen von Rede; mit dem personalen Subjekt „Sie sprudeln hervor“ entsteht im Deutschen leicht das Bild, die Personen selbst sprudelten hervor. Zudem kann עָתָק hier sachlich als Gegenstand von „reden“ wiedergegeben werden.
