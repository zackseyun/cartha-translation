id: PSA.94.15
reference: Psalms 94:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי עַד צֶ֭דֶק יָשׁ֣וּב מִשְׁפָּ֑ט וְ֝/אַחֲרָ֗י/ו כָּל יִשְׁרֵי לֵֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/015.yaml
  text: For judgment will return to righteousness[b][a], and all the upright in heart will follow after it.
translation:
  language: de
  text: Denn das Recht wird zur Gerechtigkeit zurückkehren[a], und alle, die aufrichtigen Herzens sind, werden ihm folgen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn die Rechtsprechung wird zur Gerechtigkeit zurückkehren.“ Das hebräische מִשְׁפָּט kann „Recht“, „Gericht“ oder „Rechtsprechung“ bedeuten; צֶדֶק kann „Gerechtigkeit“ oder „das Rechte“ bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und hinter ihm alle, die aufrichtigen Herzens sind“. Gemeint ist wohl, dass sie dem Recht folgen oder sich an ihm ausrichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung beziehungsweise Zuversicht für die vorausgehende Aussage ein und entspricht dem argumentativen Verlauf des Psalms.
- source_word: עַד צֶדֶק
  choice: zur Gerechtigkeit
  rationale: עַד bezeichnet mit יָשׁוּב am ehesten das Ziel der Rückkehr; צֶדֶק benennt hier die moralisch-rechtliche Norm und bleibt so von מִשְׁפָּט unterscheidbar.
- source_word: יָשׁוּב
  choice: wird zurückkehren
  rationale: Gibt die Grundbedeutung von שוב direkt wieder und bewahrt das Bild einer Wiederherstellung des rechten Zustands.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: מִשְׁפָּט kann Gericht, Rechtsprechung oder Recht bedeuten. „Das Recht“ bezeichnet hier natürlich die rechtliche Ordnung beziehungsweise Rechtsausübung, ohne mit „Gerechtigkeit“ zusammenzufallen.
- source_word: וְאַחֲרָיו
  choice: werden ihm folgen
  rationale: Wörtlich steht „und hinter ihm“. Die deutsche Formulierung ergänzt das im Hebräischen elliptisch vorausgesetzte Folgen; das Pronomen bezieht sich grammatisch passend auf „das Recht“.
- source_word: כָּל יִשְׁרֵי לֵב
  choice: alle, die aufrichtigen Herzens sind
  rationale: Bewahrt den kollektiven Sinn von כָּל und gibt die innere moralische Haltung von יִשְׁרֵי לֵב in würdigem, verständlichem Deutsch wieder.
theological_decisions:
- issue: Verhältnis von מִשְׁפָּט und צֶדֶק
  choice: Das Recht wird wieder zur Gerechtigkeit zurückkehren, also erneut mit ihr übereinstimmen.
  alternative: 'Das Gericht wird bis zur Gerechtigkeit fortdauern; oder: Rechtsprechung wird zur Gerechtigkeit zurückkehren.'
  rationale: Die Verbindung von יָשׁוּב und עַד legt eine Rückkehr zu einem Ziel nahe. Die Übersetzung bewahrt die Hoffnung auf die Wiederherstellung der moralischen Ordnung, ohne den Vorgang dogmatisch weiter auszudeuten.
- issue: Bezug und Aussage von וְאַחֲרָיו
  choice: Das Suffix bezieht sich auf מִשְׁפָּט; die Aufrichtigen werden dem wiederhergestellten Recht folgen.
  alternative: Das Suffix kann inhaltlich weiter auf die Gerechtigkeit oder die wiederhergestellte gerechte Ordnung weisen; formal ist der zweite Satzteil auch als verbloser Ausdruck „und hinter ihm alle …“ lesbar.
  rationale: מִשְׁפָּט ist der nächstliegende grammatische Bezug. Die ergänzte Verbform macht die hebräische Ellipse im Deutschen verständlich, ohne die mögliche inhaltliche Nähe von Recht und Gerechtigkeit aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit psalmtypischer Bildhaftigkeit. „Aufrichtigen Herzens“ wahrt den gehobenen poetischen Ton, bleibt aber allgemein verständlich. Die Wiederholung von „Recht“ und „Gerechtigkeit“ bildet die zwei verwandten, jedoch nicht identischen hebräischen Begriffe ab.
