source:
  edition: WLC
  text: לְ/הַשְׁקִ֣יט ל֭/וֹ מִ֣/ימֵי רָ֑ע עַ֤ד יִכָּרֶ֖ה לָ/רָשָׁ֣ע שָֽׁחַת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/013.yaml
  text: to give him rest from days of trouble[b][a], until a pit is dug for the wicked.
translation:
  language: de
  text: um ihm Ruhe vor Tagen des Unheils[a] zu verschaffen, bis für den Frevler eine Grube[b] gegraben wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von Tagen des Bösen“; gemeint sein können Tage, die von Not, Unglück oder Unheil geprägt sind.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann außer einer Grube auch eine Grube des Verderbens oder eine grabähnliche Tiefe bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַשְׁקִיט לוֹ
  choice: um ihm Ruhe … zu verschaffen
  rationale: Der Hifil-Infinitiv von שׁקט bezeichnet, dass jemand zur Ruhe gebracht wird beziehungsweise Ruhe erhält. Die deutsche Formulierung gibt zugleich den Begünstigten לוֹ natürlich wieder.
- source_word: מִימֵי רָע
  choice: vor Tagen des Unheils
  rationale: Die Wendung lautet wörtlich „von Tagen des Bösen“. Mit „Tagen des Unheils“ wird רָע hier als Not oder Verderben verstanden; die Verbindung „Ruhe vor“ bewahrt die durch מִן bezeichnete Entlastung.
- source_word: עַד
  choice: bis
  rationale: Die Konjunktion bezeichnet den zeitlichen Endpunkt der gewährten Ruhe.
- source_word: יִכָּרֶה
  choice: gegraben wird
  rationale: 'Der Nifal Imperfekt von כרה wird passiv wiedergegeben. Das passt zur folgenden Bestimmung לָרָשָׁע: Für den Frevler wird eine Grube gegraben.'
- source_word: לָרָשָׁע
  choice: für den Frevler
  rationale: Das substantivierte Adjektiv im Singular bezeichnet repräsentativ den gottlosen oder schuldigen Menschen. „Frevler“ ist knapp, würdig und im Psalmenkontext verständlich.
- source_word: שָׁחַת
  choice: eine Grube
  rationale: שָׁחַת bezeichnet eine Grube und kann zugleich an Verderben oder Grab denken lassen. Die Grundbedeutung steht im Text; die weitergehende Nuance bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Art der dem leidenden Gerechten gewährten Ruhe
  choice: eine von Gott gewährte Ruhe vor Zeiten des Unheils, bis den Frevler das Gericht erreicht
  alternative: innere Ruhe mitten im Unheil oder ausschließlich endzeitliche Ruhe
  rationale: מִן legt eine Entlastung von den Tagen des Unheils nahe, während עַד diese Ruhe mit dem kommenden Gericht über den Frevler verbindet. Der Text legt jedoch nicht ausdrücklich fest, ob die Ruhe nur äußerlich, nur innerlich oder darüber hinaus endzeitlich zu verstehen ist; diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Infinitivkonstruktion bleibt erhalten, da der Vers syntaktisch an den vorausgehenden Kontext anschließt. „Ruhe vor … verschaffen“ ist idiomatisch und wahrt die Richtung der hebräischen Präposition; „Frevler“ entspricht dem poetischen Register der Psalmen.
