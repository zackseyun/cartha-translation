    issue: „schon bald“ für כִּמְעַט
    rationale: Das Wort bedeutet „fast, beinahe, kaum noch“ und beschreibt hier die beinahe eingetretene Folge. „Schon bald“ verschiebt dies zu einer rein zukünftigen zeitlichen Nähe.
