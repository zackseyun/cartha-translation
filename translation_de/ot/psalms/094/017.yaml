- from: Wäre Jahwe nicht meine Hilfe gewesen, hätte meine Seele[a] schon bald im Schweigen[b] gewohnt.
  to: Wäre Jahwe nicht meine Hilfe gewesen, hätte meine Seele[a] fast im Schweigen[b] gelebt.
  rationale: Die Revision ersetzt die zeitlich verschiebende Wiedergabe „schon bald“ durch „fast“, das כִּמְעַט unmittelbar entspricht. „Gelebt“ macht die Verbindung mit „im Schweigen“ im modernen Deutsch flüssiger, ohne die poetische Aussage oder die wahrscheinliche Todeskonnotation zu spezifizieren. Die bestehenden Fußnoten bleiben inhaltlich und formal passend.
