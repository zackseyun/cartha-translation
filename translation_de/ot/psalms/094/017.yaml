    issue: „im Schweigen gewohnt“ für שָׁכְנָה דוּמָה
    rationale: „Wohnen“ kann das Bild von שׁכן abbilden, ist mit dem abstrakten „Schweigen“ im heutigen Deutsch jedoch sperrig. „Im Schweigen gelebt“ ist idiomatischer und hält die metaphorische Lokalisierung bei.
