  yaml_path: translation/ot/psalms/094/017.yaml
  text: If Yahweh had not been my help[b][a], my soul would soon have dwelt in silence.
translation:
  language: de
  text: Wäre Jahwe nicht meine Hilfe gewesen, hätte meine Seele[a] fast im Schweigen[b] gelebt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Leben“; das hebräische Wort kann die Seele, das Leben oder die eigene Person bezeichnen.'
