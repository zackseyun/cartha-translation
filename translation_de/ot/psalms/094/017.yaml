  - marker: b
    text: Mit dem „Schweigen“ ist wahrscheinlich die Stille des Todes oder des Totenreichs gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: לוּלֵי
  choice: Wäre ... nicht ... gewesen
  rationale: Gibt die irreale Bedingung der Vergangenheit im Deutschen natürlich und präzise wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: עֶזְרָתָה לִּי
  choice: meine Hilfe
  rationale: Bewahrt die nominale Aussage, dass Jahwe die Hilfe des Beters ist.
- source_word: כמעט
  choice: schon bald
  rationale: Drückt hier aus, dass der beschriebene Ausgang unmittelbar bevorgestanden hätte; „fast“ bleibt lexikalisch möglich, wirkt in der deutschen Satzkonstruktion jedoch weniger natürlich.
- source_word: שכנה
  choice: hätte ... gewohnt
  rationale: Bewahrt das Bild des Wohnens beziehungsweise Verweilens, das das hebräische Verb שׁכן vermittelt.
- source_word: דומה
  choice: Schweigen
  rationale: Gibt die Grundbedeutung wieder, ohne den wahrscheinlichen Bezug auf Tod oder Totenreich im Haupttext ausdrücklich festzulegen.
- source_word: נפשי
  choice: meine Seele
  rationale: Bewahrt die poetische hebräische Ausdrucksweise; das Wort kann zugleich das eigene Leben oder die ganze Person bezeichnen.
theological_decisions:
- issue: Ob der Bezug von דומה auf Tod oder Totenreich im Haupttext ausdrücklich gemacht werden soll
  choice: Die wörtliche Wiedergabe „Schweigen“ bleibt im Haupttext.
  alternative: „Totenstille“, „Tod“ oder „Totenreich“
  rationale: Der Zusammenhang legt den Tod nahe, doch das hebräische Substantiv bezeichnet unmittelbar das Schweigen. Die offenere Formulierung bewahrt die Bildsprache und vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Bildsprache. Der irreale Bedingungssatz wird idiomatisch formuliert; „Seele“, „Schweigen“ und „gewohnt“ bewahren zentrale Bilder des Hebräischen.
