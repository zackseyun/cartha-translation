source:
  edition: WLC
  text: וַ/יָּ֤שֶׁב עֲלֵי/הֶ֨ם אֶת אוֹנָ֗/ם וּ/בְ/רָעָתָ֥/ם יַצְמִיתֵ֑/ם יַ֝צְמִיתֵ֗/ם יְהוָ֥ה אֱלֹהֵֽי/נוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/023.yaml
  text: He will bring back on them their iniquity[a], and in their evil he will wipe them out[c][b]; Yahweh our God will wipe them out.
translation:
  language: de
  text: Er wird ihre Schuld auf sie zurückfallen lassen[a] und wird sie in ihrer eigenen Bosheit[b] vernichten. Jahwe, unser Gott, wird sie vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er hat ihre Bosheit auf sie zurückgebracht“ beziehungsweise „Er lässt ihre Schuld auf sie zurückfallen.“ Die hebräische Verbform kann in diesem poetischen Zusammenhang vergangenheitsbezogen oder als gewisse künftige Aussage verstanden werden; das Wort für „Schuld“ kann auch „Bosheit“ oder „Unrecht“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wegen ihrer Bosheit“ beziehungsweise „durch ihre Bosheit“. Die hebräische Präposition kann den Bereich, den Grund oder das Mittel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: Er lässt … zurückfallen
  rationale: Die Hifil-Bedeutung von שוב bezeichnet hier das Zurückbringen bzw. Zurückfallenlassen der Schuld auf die Täter. Im poetischen Zusammenhang ist die präsentisch-gewisse Wiedergabe im Deutschen natürlich und bewahrt die Aussage als sichere Ankündigung göttlichen Gerichts.
- source_word: עֲלֵיהֶם אֶת־אוֹנָם
  choice: ihre Schuld auf sie
  rationale: אוֹן bezeichnet hier moralische Schuld, Bosheit oder Unrecht. „Schuld“ passt zum Bild, dass das eigene Tun auf die Täter zurückfällt.
- source_word: וּבְרָעָתָם
  choice: in ihrer eigenen Bosheit
  rationale: Die Präposition ב kann den Bereich, den Grund oder das Mittel bezeichnen. „In“ hält diese Mehrdeutigkeit offen; „eigenen“ verdeutlicht lediglich den hebräischen Possessivbezug.
- source_word: יַצְמִיתֵם
  choice: vernichtet sie
  rationale: צמת im Hifil bezeichnet vollständiges Beseitigen oder Vernichten. Die Wiederholung des Verbs im Hebräischen wird im Deutschen beibehalten.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Jahwe, unser Gott
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; אֱלֹהֵינוּ bedeutet wörtlich „unser Gott“.
theological_decisions:
- issue: Zeitbezug von וַיָּשֶׁב im poetischen Kontext
  choice: 'präsentisch-gewisse Aussage: „Er lässt … zurückfallen“'
  alternative: „Er ließ/hat … zurückfallen“ oder „Er wird … zurückfallen lassen“
  rationale: Der wayyiqtol kann hier poetisch unterschiedlich zeitlich aufgefasst werden. Das Präsens drückt im Deutschen die sichere, grundsätzlich geltende Vergeltung aus, ohne den Zusammenhang auf ein bereits abgeschlossenes Ereignis festzulegen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Transliteration bewahrt diese Unterscheidung gegenüber dem Titel „Herr“.
- issue: Bedeutung der Präposition ב in וּבְרָעָתָם
  choice: „in ihrer eigenen Bosheit“
  alternative: „wegen ihrer Bosheit“ oder „durch ihre Bosheit“
  rationale: Die formal nähere Wiedergabe wahrt die mögliche Bedeutung als Bereich, Grundlage oder Mittel des Gerichts, statt eine Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild der auf die Täter zurückfallenden Schuld sowie die nachdrückliche Wiederholung von „vernichten“ bleiben erhalten. Die kompakte poetische Aussage und ihre zeitliche beziehungsweise präpositionale Mehrdeutigkeit werden nicht unnötig aufgelöst.
