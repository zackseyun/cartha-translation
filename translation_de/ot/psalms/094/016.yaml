  text: מִֽי יָק֣וּם לִ֭/י עִם מְרֵעִ֑ים מִֽי יִתְיַצֵּ֥ב לִ֝/י עִם פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/016.yaml
  text: Who will rise up for me against evildoers? Who will stand for me against workers of iniquity?[a][b]
translation:
  language: de
  text: Wer steht für mich auf gegen die, die Böses tun?[a] Wer nimmt für mich Stellung gegen die, die Unrecht tun?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit“. Im Zusammenhang ist eine Gegnerschaft gemeint: Wer wird sich dem Sprecher gegen die Übeltäter anschließen bzw. ihm gegen sie beistehen?'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die, die Unheil stiften“ oder „die Bosheit verüben“. Das hebräische Wort אָוֶן kann Unrecht, Bosheit oder Unheil bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Wer
  rationale: Das Fragepronomen leitet beide parallelen rhetorischen Fragen ein.
- source_word: יָקוּם
  choice: steht ... auf
  rationale: Das Qal-Imperfekt von קום bezeichnet hier das Aufstehen zum Widerstand und bewahrt das anschauliche Bild des Hebräischen.
- source_word: לִי
  choice: für mich
  rationale: לִי bezeichnet hier Beistand zugunsten des Sprechers, nicht bloß eine Richtung.
- source_word: עִם
  choice: gegen
  rationale: Obwohl עִם gewöhnlich „mit“ bedeutet, verlangt der Zusammenhang des Sich-Erhebens beziehungsweise Antretens gegenüber Übeltätern im Deutschen eine adversative Wiedergabe.
- source_word: מְרֵעִים
  choice: die, die Böses tun
  rationale: Die partizipiale Personenbezeichnung wird in natürlichem, allgemein verständlichem Deutsch wiedergegeben.
- source_word: יִתְיַצֵּב
  choice: tritt ... ein
  rationale: Das Hitpael von יצב bezeichnet ein festes Antreten oder Stellungnehmen; „für mich eintreten“ bringt den Beistandsaspekt idiomatisch zum Ausdruck, während die Ergänzung „gegen“ die Konfrontation wahrt.
- source_word: פֹּעֲלֵי אָוֶן
  choice: die, die Unheil stiften
  rationale: Die Wendung bezeichnet Menschen, die schädliches, moralisch verwerfliches Handeln betreiben; die verbale Formulierung bewahrt den Tätigkeitsaspekt.
- source_word: אָוֶן
  choice: Unheil
  rationale: Das Wort kann Bosheit, Unrecht, Mühsal oder schädliches Unheil bezeichnen. „Unheil“ bewahrt die semantische Breite, ohne den moralisch negativen Zusammenhang abzuschwächen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Zweifrage-Struktur bleibt erhalten; die Wiederholung „für mich ... gegen“ bildet den hebräischen Parallelismus ab. Personenbezeichnungen werden natürlich verbal formuliert statt mit dem heute ungebräuchlichen Ausdruck „Übeltäter“ oder dem steifen „Täter des Frevels“.
