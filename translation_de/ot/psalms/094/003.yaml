  text: Wie lange, Jahwe, werden die Frevler, wie lange werden die Frevler jubeln?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד מָתַי
  choice: wie lange noch
  rationale: Die idiomatische deutsche Klageform gibt die Frage nach der fortdauernden Dauer wieder; „noch“ verstärkt die im Kontext liegende Dringlichkeit, ohne den Sinn zu verändern.
- source_word: רְשָׁעִים
  choice: die Frevler
  rationale: Das substantivierte Pluraladjektiv bezeichnet Menschen, deren Handeln moralisch schuldig und gottwidrig ist. „Frevler“ ist knapp, würdevoll und im Psalmenkontext treffender als das allgemeinere „Böse“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: יַעֲלֹזוּ
  choice: triumphieren
  rationale: Das Verb bezeichnet überschwänglichen Jubel. Im Zusammenhang mit den Frevlern bringt „triumphieren“ die selbstgewisse, sieghafte Färbung zur Geltung; „frohlocken“ wäre ebenfalls möglich.
- source_word: עַד מָתַי רְשָׁעִים … עַד מָתַי רְשָׁעִים
  choice: wie lange noch werden die Frevler … wie lange noch werden die Frevler
  rationale: Die auffällige Wiederholung wird bewahrt. Der Gedankenstrich kennzeichnet den emotionalen Neuansatz, ohne die Spannung des hebräischen Satzbaus einzuebnen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Transliteration bewahrt diese Unterscheidung gegenüber einem bloßen Hoheitstitel.
- issue: Färbung des Jubels der Frevler
  choice: triumphieren
  alternative: frohlocken
  rationale: „Triumphieren“ macht den im Klagezusammenhang naheliegenden sieghaften Jubel hörbar, ohne ausdrücklich Hochmut oder Schadenfreude in den Text einzutragen.
translation_notes:
  register: Moderne, würdevolle Psalmsprache. Die ungewöhnliche Wiederholung und der abgebrochene erste Satzansatz spiegeln die drängende Klage und die hebräische Form, während die Wortwahl für heutige Leser verständlich bleibt.
