base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/005.yaml
  text: O Yahweh[b][a], they crush your people and afflict your inheritance.
translation:
  language: de
  text: 'Dein Volk, Jahwe, zermalmen sie,

    und dein Erbteil bedrücken sie.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dein Volk, Jahwe, unterdrücken sie, und deinen Erbbesitz misshandeln sie.« Die beiden hebräischen Verben bezeichnen gewaltsames Niederdrücken beziehungsweise Bedrücken; »Erbteil« kann auch »Erbbesitz« oder »zugeteilter Besitz« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמְּךָ
  choice: dein Volk
  rationale: עַם bezeichnet hier das zu Gott gehörende Volk; »dein Volk« ist im Deutschen natürlich und kontextgemäß.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name mit »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יְדַכְּאוּ
  choice: zermalmen sie
  rationale: Das Piel von דכא bezeichnet ein gewaltsames Zermalmen oder Niederdrücken. »Zermalmen« bewahrt das starke Bild des hebräischen Verbs.
- source_word: וְנַחֲלָתְךָ
  choice: und dein Erbteil
  rationale: נַחֲלָה bezeichnet Erbbesitz beziehungsweise einen zugeteilten Besitz; auf Gottes Volk bezogen bewahrt »Erbteil« die konkrete Besitz- und Zugehörigkeitsvorstellung.
- source_word: יְעַנּוּ
  choice: bedrücken sie
  rationale: Das Piel von ענה kann »bedrücken«, »demütigen« oder »misshandeln« bedeuten. »Bedrücken« passt zum Kontext anhaltender gewaltsamer Unterdrückung, ohne das vorherige Verb zu wiederholen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. »Jahwe« bewahrt dessen Funktion als persönlichen Gottesnamen.
- issue: נַחֲלָה als Bezeichnung für Gottes Volk
  choice: Erbteil
  alternative: Erbbesitz
  rationale: »Erbteil« erhält die theologisch bedeutsame Vorstellung, dass das Volk Gott als sein zugehöriger, ihm zugeteilter Besitz gilt, ohne näher festzulegen, wie dieses Verhältnis dogmatisch zu erklären ist.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die vorangestellte Satzgliederung folgt der hebräischen Betonung, bleibt aber im Deutschen verständlich. »Zermalmen« erhält die Bildkraft des ersten Verbs; »bedrücken« gibt das zweite eigenständig wieder.
