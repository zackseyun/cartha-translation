  text: בִּ֭ינוּ בֹּעֲרִ֣ים בָּ/עָ֑ם וּ֝/כְסִילִ֗ים מָתַ֥י תַּשְׂכִּֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/008.yaml
  text: Understand, you brutish among the people; and you fools, when will you become wise?
translation:
  language: de
  text: Begreift doch, ihr Unvernünftigen im Volk! Ihr Narren, wann werdet ihr zur Einsicht kommen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּינוּ
  choice: Begreift doch
  rationale: Der pluralische Imperativ fordert nachdrücklich zum Verstehen auf; „doch“ gibt den mahnenden Ton natürlich wieder, ohne ein sachliches Objekt hinzuzufügen.
- source_word: בֹּעֲרִים
  choice: Unvernünftigen
  rationale: Das Wort bezeichnet geistig stumpfe, unverständige Menschen und kann eine Nähe zum Tierischen anklingen lassen. „Unvernünftigen“ bewahrt die Schärfe, ohne im Deutschen unnatürlich zu wirken.
- source_word: כְסִילִים
  choice: Narren
  rationale: „Narren“ entspricht dem weisheitlichen Begriff für Menschen, denen Einsicht und rechte Urteilsfähigkeit fehlen, und unterscheidet ihn vom vorherigen Ausdruck.
- source_word: תַּשְׂכִּילוּ
  choice: werdet ihr zur Einsicht kommen
  rationale: Die Form bezeichnet das Erlangen oder Zeigen von Einsicht. Die Wendung hält diese Bedeutungsbreite offen und klingt als rhetorische Frage idiomatisch.
theological_decisions: []
translation_notes:
  register: Direkte, scharf mahnende Anrede in modernem, würdigem Standarddeutsch. Der Parallelismus und die zwei unterschiedlichen Bezeichnungen für mangelnde Einsicht bleiben erhalten.
