  text: הַֽ֭/יְחָבְרְ/ךָ כִּסֵּ֣א הַוּ֑וֹת יֹצֵ֖ר עָמָ֣ל עֲלֵי חֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/020.yaml
  text: Can a throne of destruction be allied with you[b][a], one that forms trouble by statute?
translation:
  language: de
  text: Kann sich mit dir ein Thron des Verderbens[a] verbünden, der durch Gesetz Unheil schafft?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Thron des Unheils« oder »ein Thron ruinöser Machenschaften«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »der Unheil auf Gesetz formt«. Gemeint sein kann, dass Gesetz oder Erlass als Mittel oder Vorwand benutzt wird, um Schaden hervorzubringen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיְחָבְרְךָ
  choice: Kann sich mit dir … verbünden
  rationale: Die rhetorische Frage und die Bedeutung von חבר als Sichverbinden bzw. Sichverbünden werden natürlich wiedergegeben; zugleich bleibt der politische Beiklang erhalten.
- source_word: כִּסֵּא
  choice: Thron
  rationale: Die übliche Bedeutung bewahrt das Bild politischer und richterlicher Herrschaft.
- source_word: הַוּוֹת
  choice: Verderben
  rationale: Das Substantiv bezeichnet zerstörerisches Wirken, Unheil oder ruinöse Machenschaften. »Verderben« wahrt diese destruktive Kraft, ohne die Bedeutung vorschnell auf moralische Schuld zu verengen.
- source_word: יֹצֵר
  choice: schafft
  rationale: Das Partizip von יצר bedeutet wörtlich »formt« oder »bildet«. Im Deutschen drückt »schafft« die aktive Hervorbringung von Unheil idiomatisch aus.
- source_word: עָמָל
  choice: Unheil
  rationale: Hier bezeichnet das Wort bedrückendes Leid bzw. schädigendes Unrecht, das durch korrupte Herrschaft hervorgebracht wird. »Unheil« passt zum Kontext und bleibt semantisch hinreichend weit.
- source_word: עֲלֵי חֹק
  choice: durch Satzung
  rationale: Die knappe Formulierung bewahrt das Rechtsregister und gibt das Gesetz bzw. die Satzung als Mittel der Schädigung wieder, ohne die mögliche Bedeutung »unter dem Vorwand des Rechts« in den Haupttext einzutragen.
theological_decisions:
- issue: Verhältnis Gottes zu zerstörerischer, rechtsmissbräuchlicher Herrschaft
  choice: Die rhetorische Frage stellt die Unvereinbarkeit eines verderblichen Herrschaftssitzes mit Gott heraus.
  alternative: Die Frage könnte allgemeiner darauf zielen, ob ein ungerechter Richter an Gottes Gerichtsherrschaft teilhaben kann.
  rationale: »Thron« und das interrogative ה weisen auf eine rhetorische Verneinung hin. Die Übersetzung lässt diese Verneinung implizit und fügt keine dogmatische Erklärung hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die politische Bildsprache von »Thron« und das juristische Register von »Satzung« bleiben erhalten. Die ungewöhnliche hebräische Verbindung עֲלֵי חֹק wird im Haupttext knapp und in der Fußnote erklärend wiedergegeben.
