base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/012.yaml
  text: Blessed is the man whom you discipline[a], O Yah, and teach out of your law[e][d][c][b],
translation:
  language: de
  text: Glücklich ist der Mann[a], den du erziehst[b], Jah, und ihn aus deiner Weisung[c] lehrst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Der Mann“ kann hier beispielhaft für den Menschen stehen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zurechtweist“ oder „züchtigst“. Gemeint ist korrigierende, formende Einwirkung.'
    reason: lexical_alternative
  - marker: c
    text: „Weisung“ gibt hebräisch Tora wieder, das auch „Gesetz“ oder „Unterweisung“ bedeuten kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die hebräische Seligpreisungsformel bezeichnet einen begünstigten, gedeihlichen Zustand. „Glücklich ist“ ist im heutigen Deutsch natürlich und vermeidet die mögliche Verwechslung von „selig“ mit dem Zustand nach dem Tod.
- source_word: הַגֶּבֶר
  choice: der Mann
  rationale: גֶּבֶר ist ein maskulines Substantiv im Singular. Die konkrete Form wird beibehalten, obwohl der Mann hier wahrscheinlich beispielhaft für jeden Menschen steht.
- source_word: תְּיַסְּרֶנּוּ
  choice: den du zurechtweist
  rationale: Das Piel von יסר bezeichnet erzieherische, korrigierende Einwirkung. „Zurechtweisen“ erhält den korrektiven Sinn und klingt natürlicher als „züchtigen“.
- source_word: יָּהּ
  choice: Jah
  rationale: Der Text verwendet die poetische Kurzform des Gottesnamens יָהּ, nicht das Tetragramm JHWH; „Jah“ gibt diese Unterscheidung wieder.
- source_word: וּמִתּוֹרָתְךָ
  choice: aus deiner Weisung
  rationale: תּוֹרָה kann Gesetz, Unterweisung oder Weisung bedeuten. „Weisung“ bewahrt hier die Breite des Begriffs und passt zur Tätigkeit des Lehrens; מִן wird als „aus“ wiedergegeben.
- source_word: תְלַמְּדֶנּוּ
  choice: den du ... lehrst
  rationale: Das Piel von למד bedeutet „lehren“. Die Wiederaufnahme von „den“ macht im Deutschen deutlich, dass dasselbe Objekt zu beiden Verben gehört.
theological_decisions:
- issue: Kurzform des Gottesnamens יָּהּ
  choice: Jah
  alternative: HERR
  rationale: Die eigenständige Kurzform wird sichtbar bewahrt, statt sie mit der üblichen Wiedergabe des vollständigen Tetragramms gleichzusetzen.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: Der Kontext verbindet die Tora unmittelbar mit göttlichem Lehren. „Weisung“ hält sowohl normativen als auch unterweisenden Gehalt offen, ohne den Begriff auf Gesetzesvorschriften zu verengen.
- issue: Repräsentative Funktion von הַגֶּבֶר
  choice: der Mann
  alternative: der Mensch
  rationale: Die grammatisch und lexikalisch männliche Ausgangsform bleibt im Text erhalten; ihr wahrscheinlich repräsentativer Gebrauch wird in einer Fußnote erläutert.
translation_notes:
  register: Moderne, würdige Sprache mit poetischer Seligpreisungsform. „Glücklich“ ist gegenwärtig verständlicher als „selig“; „Jah“ bewahrt die poetische Kurzform des Gottesnamens. Die Wiederholung von „den du“ dient natürlicher deutscher Syntax und eindeutiger Zuordnung.
