source:
  edition: WLC
  text: אֵל נְקָמ֥וֹת יְהוָ֑ה אֵ֖ל נְקָמ֣וֹת הוֹפִֽיַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/001.yaml
  text: O God of vengeance[a], O Yahweh, God of vengeance[b], shine forth!
translation:
  language: de
  text: Gott der Vergeltung[a], Jahwe, Gott der Vergeltung, strahle hervor![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Gott der Vergeltungen … Gott der Vergeltungen“. Der hebräische Plural verstärkt wahrscheinlich den Gedanken an Gottes vergeltendes Handeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „erscheine“ oder „zeige dich“. Das Verb kann Gottes sichtbares, machtvolles Hervortreten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Gott
  rationale: אֵל steht hier als Gottesbezeichnung in einer direkten Anrede. „Gott“ ist im Deutschen natürlich und gibt die Verbindung mit נְקָמוֹת klar wieder.
- source_word: נְקָמוֹת
  choice: Vergeltung
  rationale: Der hebräische Plural bezeichnet hier nachdrücklich Gottes vergeltendes Handeln. Das abstrakte Singularwort „Vergeltung“ ist im heutigen Deutsch idiomatischer als „Vergeltungen“ und bewahrt den gerichtlichen Sinn, ohne ihn zu „Gerechtigkeit“ abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: הוֹפִיעַ
  choice: strahle hervor
  rationale: Der Hifil-Imperativ von יפע kann ein sichtbares, glanzvolles Hervortreten bezeichnen. „Strahle hervor“ bewahrt sowohl den Befehlscharakter als auch den möglichen Epiphanie- und Lichtklang.
theological_decisions:
- issue: Sprache von Gottes Vergeltung
  choice: „Gott der Vergeltung“ unverändert beibehalten
  alternative: „Gott der Gerechtigkeit“ oder „rächender Gott“
  rationale: Der hebräische Text verbindet Gott ausdrücklich mit Vergeltung. „Gerechtigkeit“ würde die Aussage interpretierend abschwächen; „rächender Gott“ würde die nominale Form verändern. Die spannungsreiche Aussage über Gottes richterliches Vergelten bleibt daher stehen.
- issue: Bedeutung von הוֹפִיעַ
  choice: „strahle hervor“
  alternative: „erscheine“ oder „zeige dich“
  rationale: Das Verb lässt sowohl das Erscheinen als auch ein glanzvolles Hervortreten anklingen. Die gewählte Fassung bewahrt den epiphanischen Ton; die sachlich möglichen Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Anrede und die knappe Dringlichkeit des hebräischen Verses bleiben erhalten; „Jahwe“ gibt den Gottesnamen ausdrücklich wieder.
