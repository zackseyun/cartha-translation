  text: But Yahweh has become my stronghold[a], and my God the rock of my refuge.
translation:
  language: de
  text: Doch Jahwe wurde zu meiner sicheren Höhe, mein Gott zum Felsen, bei dem ich Zuflucht habe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist zu meiner sicheren Höhe geworden“. Das hebräische Verb kann als einfache Vergangenheit wiedergegeben werden; „ist geworden“ hebt das bis in die Gegenwart reichende Ergebnis hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: wurde
  rationale: Die wayyiqtol-Form von היה bezeichnet hier ein vergangenes Geschehen; im Zusammenhang trägt es fortdauernde Bedeutung. Das natürliche deutsche Präteritum bewahrt die Erzählperspektive, ohne die bleibende Wirkung auszuschließen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לִי לְמִשְׂגָּב
  choice: zu meiner sicheren Höhe
  rationale: מִשְׂגָּב bezeichnet einen erhöhten, schwer zugänglichen und daher sicheren Zufluchtsort. Die Formulierung erhält sowohl das Höhenbild als auch den Schutzgedanken; לִי wird idiomatisch durch das Possessiv ausgedrückt.
- source_word: וֵאלֹהַי
  choice: mein Gott
  rationale: Das Substantiv mit Suffix bezeichnet die persönliche Beziehung; das verbindende ו wird im deutschen parallelen Satzbau ohne ausdrückliches „und“ natürlich wiedergegeben.
- source_word: לְצוּר מַחְסִי
  choice: zum Felsen, bei dem ich Zuflucht finde
  rationale: צוּר bleibt als Schutz- und Beständigkeitsmetapher erhalten. מַחְסִי wird relational entfaltet, damit „Fels meiner Zuflucht“ nicht unnatürlich wirkt und der Gedanke eines Schutzortes klar bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Transliteration bewahrt ihn, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Zeitwert von וַיְהִי
  choice: wurde
  alternative: ist geworden
  rationale: Das Präteritum gibt den hebräischen perfektiven Erzählwert direkt wieder. Die fortdauernde Bedeutung ist im Kontext möglich und wird in der Fußnote ausdrücklich festgehalten, ohne sie als einzig mögliche Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Parallelität und die beiden Schutzbilder – sichere Höhe und Fels – bleiben erhalten; ungewöhnlich starre Genitivfügungen werden vermieden.
