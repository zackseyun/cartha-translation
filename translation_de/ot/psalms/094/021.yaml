base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/021.yaml
  text: They band together against the life of the righteous[b][a], and they condemn innocent blood.
translation:
  language: de
  text: Sie rotten sich gegen das Leben des Gerechten zusammen[a] und sprechen unschuldiges Blut schuldig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie schließen sich zu einer Schar gegen das Leben des Gerechten zusammen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und unschuldiges Blut sprechen sie schuldig“; auch: „sie verurteilen unschuldiges Blut“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוֹדּוּ
  choice: sie rotten sich zusammen
  rationale: Das Qal kann das Zusammenschließen zu einer feindlichen Schar oder einen gemeinschaftlichen Angriff bezeichnen. „Sich zusammenrotten“ gibt den feindseligen, kollektiven Charakter im Deutschen natürlich wieder, ohne ausdrücklich militärische Verbände vorauszusetzen.
- source_word: עַל
  choice: gegen
  rationale: In Verbindung mit der feindseligen Handlung bezeichnet עַל hier die gegen jemanden gerichtete Opposition.
- source_word: נֶפֶשׁ
  choice: Leben
  rationale: נֶפֶשׁ meint hier das bedrohte Leben beziehungsweise die Person des Gerechten. „Leben“ bewahrt den konkreten Bezug und entspricht dem parallelen Bild vom unschuldigen Blut.
- source_word: צַדִּיק
  choice: des Gerechten
  rationale: Das substantivierte Adjektiv steht im Singular. „Des Gerechten“ bewahrt diese repräsentative Einzahl und ist im Deutschen knapp und würdig.
- source_word: דָם נָקִי
  choice: unschuldiges Blut
  rationale: Die wörtliche und im Deutschen geläufige Verbindung erhält sowohl das Gewaltbild als auch den forensischen Gedanken der Schuldlosigkeit.
- source_word: יַרְשִׁיעוּ
  choice: sprechen … schuldig
  rationale: Der Hiphil von רשע bezeichnet das Erklären für schuldig beziehungsweise Verurteilen. „Schuldig sprechen“ macht die gerichtliche Bedeutung deutlich und bewahrt die auffällige Konstruktion mit „unschuldigem Blut“ als Objekt.
theological_decisions:
- issue: Repräsentativer Singular in צַדִּיק
  choice: des Gerechten
  alternative: eines gerechten Menschen / der Gerechten
  rationale: Der hebräische Singular kann einen einzelnen Gerechten oder repräsentativ den gerechten Menschen bezeichnen. Die Übersetzung wahrt den Singular und legt weder ein Kollektiv noch eine bestimmte Einzelperson fest.
- issue: Forensische Aussage über unschuldiges Blut
  choice: sprechen unschuldiges Blut schuldig
  alternative: verurteilen unschuldiges Blut
  rationale: 'Die Formulierung erhält die theologische und rhetorische Spannung: Gerade das ausdrücklich unschuldige Blut wird von den Frevlern für schuldig erklärt. Diese Spannung soll nicht durch eine glättende Umschreibung aufgelöst werden.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sich zusammenrotten“ trägt die feindselige Gruppenhandlung; „schuldig sprechen“ bewahrt den forensischen Sinn und die zugespitzte Verbindung mit „unschuldigem Blut“. Alle Fußnotenmarker stehen unmittelbar an den betreffenden Aussagen.
