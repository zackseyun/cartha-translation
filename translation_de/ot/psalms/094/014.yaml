id: PSA.94.14
reference: Psalms 94:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י לֹא יִטֹּ֣שׁ יְהוָ֣ה עַמּ֑/וֹ וְ֝/נַחֲלָת֗/וֹ לֹ֣א יַעֲזֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/014.yaml
  text: For Yahweh will not forsake his people[b][a]; he will not abandon his inheritance.
translation:
  language: de
  text: Denn Jahwe wird sein Volk nicht verstoßen[a] und sein Erbteil[b] nicht verlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: im Stich lassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Erbe; auch: besonderer Besitz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung oder Erläuterung zum Zusammenhang ein und bewahrt die verbindende Kraft des hebräischen Ausdrucks.
- source_word: יִטֹּשׁ
  choice: wird nicht verstoßen
  rationale: נטשׁ bezeichnet das Aufgeben, Verstoßen oder Verlassen. „Verstoßen“ ist hier gewichtig und idiomatisch; die Alternative „im Stich lassen“ wird in einer Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als im Deutschen übliche Transliteration wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: Bewahrt den gemeinschaftlichen und im Kontext auch bundesbezogenen Sinn von עַם.
- source_word: נַחֲלָתוֹ
  choice: sein Erbteil
  rationale: נַחֲלָה bezeichnet Erbe, Erbteil oder zugewiesenen Besitz. „Erbteil“ bewahrt hier das Bild von Gottes Volk als seinem besonderen Anteil.
- source_word: יַעֲזֹב
  choice: nicht verlassen
  rationale: עזב bedeutet verlassen oder zurücklassen. „Verlassen“ erhält den Parallelismus, ohne die beiden hebräischen Verben gleich wiederzugeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; „Jahwe“ bewahrt ihn sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Bundesbezogene Bildsprache von נַחֲלָתוֹ
  choice: sein Erbteil
  alternative: sein Erbe / sein Eigentum
  rationale: „Erbteil“ erhält die Vorstellung eines zugewiesenen besonderen Anteils und lässt die genaue Beziehung zwischen Jahwe und seinem Volk in ihrer bildhaften Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der beiden Halbverse bleibt erhalten; die unterschiedlichen hebräischen Verben werden mit „verstoßen“ und „verlassen“ unterschieden. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
