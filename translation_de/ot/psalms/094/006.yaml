  text: אַ֭לְמָנָה וְ/גֵ֣ר יַהֲרֹ֑גוּ וִֽ/יתוֹמִ֣ים יְרַצֵּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/006.yaml
  text: They kill the widow and the sojourner[b][a]; they murder the fatherless.
translation:
  language: de
  text: Die Witwe und den Fremden[a] töten sie; die Vaterlosen[b] ermorden sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den ansässigen Ausländer«. Das hebräische Wort bezeichnet einen Nichtisraeliten, der dauerhaft unter dem Volk lebt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Waisen«. Wörtlicher: »die Vaterlosen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: die Witwe
  rationale: Der hebräische Singular bezeichnet hier repräsentativ eine besonders schutzbedürftige Personengruppe. Der deutsche Singular mit bestimmtem Artikel bewahrt Form und Aussagekraft.
- source_word: גֵר
  choice: den Fremden
  rationale: גֵר bezeichnet einen nicht einheimischen Menschen, der dauerhaft unter dem Volk lebt. »Fremder« ist verständlich und würdevoll; die Fußnote präzisiert den Aufenthaltsstatus.
- source_word: יַהֲרֹגוּ
  choice: töten sie
  rationale: Das Verb bezeichnet allgemein das Töten. »Töten« ist die direkte, natürliche Entsprechung und wahrt den Unterschied zum stärkeren רצח im zweiten Satzteil.
- source_word: יְתוֹמִים
  choice: die Vaterlosen
  rationale: Das hebräische Wort bezeichnet wörtlich Menschen, die keinen Vater mehr haben, und benennt eine typische Gruppe sozial Schutzbedürftiger. »Vaterlose« erhält diese Genauigkeit; »Waisen« ist eine geläufige Alternative.
- source_word: יְרַצֵּחוּ
  choice: ermorden sie
  rationale: רצח trägt die Bedeutung widerrechtlichen Tötens. »Ermorden« gibt die moralisch-rechtliche Schärfe wieder und unterscheidet den Ausdruck vom vorangehenden »töten«.
