source:
  edition: WLC
  text: הֲ/נֹ֣טַֽע אֹ֭זֶן הֲ/לֹ֣א יִשְׁמָ֑ע אִֽם יֹ֥צֵֽר עַ֝֗יִן הֲ/לֹ֣א יַבִּֽיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/009.yaml
  text: He who planted the ear[a], does he not hear? He who formed the eye[b], does he not see?
translation:
  language: de
  text: Der das Ohr gepflanzt hat[a] – sollte er nicht hören? Der das Auge geformt hat[b] – sollte er nicht sehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „das Ohr gepflanzt“. Das hebräische Verb bewahrt ein anschauliches Bild für das schöpferische Einsetzen des Ohrs.
    reason: lexical_alternative
  - marker: b
    text: Das letzte Verb kann auch „blicken“, „hinschauen“ oder „beobachten“ bedeuten; hier geht es im Zusammenhang um die Fähigkeit zu sehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטַע
  choice: gepflanzt
  rationale: Das Partizip von נטע bedeutet wörtlich „pflanzen“. Die ungewöhnliche, anschauliche Schöpfungsmetapher bleibt damit erhalten; „gemacht“ wäre glatter, aber weniger bildkräftig.
- source_word: אֹזֶן
  choice: Ohr
  rationale: Die konkrete Grundbedeutung ist „Ohr“. Der Singular entspricht dem Hebräischen und bildet die poetische Parallele zu „Auge“.
- source_word: יִשְׁמָע
  choice: hören
  rationale: Hier geht es um die Fähigkeit des Hörens, nicht vorrangig um aufmerksames Zuhören oder Gehorsam.
- source_word: יֹצֵר
  choice: geformt
  rationale: Das Partizip von יצר bezeichnet absichtsvolles Formen oder Gestalten und bewahrt das Bild des Schöpfers als Gestalter.
- source_word: עַיִן
  choice: Auge
  rationale: Die konkrete Grundbedeutung ist „Auge“. Der Singular wahrt die Form und den Parallelismus des hebräischen Verses.
- source_word: יַבִּיט
  choice: sehen
  rationale: נבט kann wörtlicher „blicken“ oder „hinschauen“ heißen. Im Zusammenhang bezeichnet es die dem geschaffenen Auge entsprechende Fähigkeit des Sehens; „sehen“ ist im Deutschen idiomatisch und parallel zu „hören“.
- source_word: הֲ...הֲלֹא
  choice: sollte er nicht …?
  rationale: Die rhetorische Frage erwartet eine bejahende Antwort. „Sollte er nicht …?“ erhält sowohl den Fragecharakter als auch die nachdrückliche Folgerung.
- source_word: אִם
  choice: Der das …
  rationale: אִם führt hier den zweiten, parallelen Fragesatz ein. Eine wörtliche konditionale Wiedergabe mit „wenn“ wäre im Deutschen missverständlich; die wiederholte Relativkonstruktion bildet den Parallelismus natürlich ab.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Wahrnehmung
  choice: Die konkrete Argumentation vom Schöpfer zu den geschaffenen Wahrnehmungsorganen bleibt unverändert stehen.
  alternative: 'Abstrakter paraphrasieren: „Wer Gehör und Sehkraft gab, nimmt gewiss selbst wahr.“'
  rationale: Der Vers folgert rhetorisch, dass der Schöpfer menschlicher Wahrnehmungsfähigkeiten selbst hört und sieht. Die Übersetzung bewahrt Ohr, Auge, Hören und Sehen, ohne die Aussage metaphysisch auszudeuten oder konfessionell festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Schöpfungsmetapher „das Ohr gepflanzt“ und der parallele Aufbau des hebräischen Verses werden bewahrt. Gedankenstriche markieren die beiden rhetorischen Folgerungen, ohne zusätzliche Auslegung einzuführen.
