  text: הֲ/יֹסֵ֣ר גּ֭וֹיִם הֲ/לֹ֣א יוֹכִ֑יחַ הַֽ/מְלַמֵּ֖ד אָדָ֣ם דָּֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/010.yaml
  text: He who disciplines nations[a], will he not rebuke—he who teaches man knowledge?
translation:
  language: de
  text: Der die Völker erzieht – sollte er nicht zurechtweisen, er, der den Menschen Erkenntnis lehrt?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹסֵר
  choice: zurechtweist
  rationale: Das Partizip von יסר bezeichnet korrigierende Zucht beziehungsweise disziplinierende Unterweisung. „Zurechtweist“ bewahrt den korrektiven Sinn und klingt im modernen Deutschen natürlich.
- source_word: גּוֹיִם
  choice: die Völker
  rationale: גּוֹיִם meint hier allgemein die Völker und nicht speziell Nichtjuden.
- source_word: יוֹכִיחַ
  choice: tadeln
  rationale: Das Hifil von יכח bezeichnet hier ein überführendes oder rügendes Zurechtweisen. „Tadeln“ vermeidet eine unnötige Wiederholung von „zurechtweist“ und erhält die rhetorische Zuspitzung.
- source_word: הַמְלַמֵּד
  choice: der ... lehrt
  rationale: Das substantivisch gebrauchte Partizip beschreibt Gott als den Lehrenden und wird in der deutschen Relativkonstruktion natürlich wiedergegeben.
- source_word: אָדָם
  choice: den Menschen
  rationale: Der artikellose Kollektiv- beziehungsweise Repräsentativsingular bezeichnet den Menschen als solchen, also die Menschheit in ihrer gemeinsamen menschlichen Existenz. „Den Menschen“ erhält im Deutschen den Singular, ohne die Aussage auf einen Mann zu verengen.
- source_word: דָּעַת
  choice: Erkenntnis
  rationale: דָּעַת bezeichnet Wissen beziehungsweise Erkenntnis. „Erkenntnis“ passt idiomatisch zu „lehren“ und zum weisheitlichen Ton des Psalms.
- source_word: הֲ...הֲלֹא
  choice: sollte er nicht ...?
  rationale: Die verbundenen Fragepartikeln bilden eine rhetorische Frage, die eine bejahende Antwort erwartet. „Sollte er nicht“ gibt diese argumentative Kraft im Deutschen treffend wieder.
theological_decisions:
- issue: Generischer Gebrauch von אָדָם
  choice: den Menschen
  alternative: die Menschen / die Menschheit / den Mann
  rationale: Die Aussage gilt dem Menschen allgemein. Der deutsche repräsentative Singular „den Menschen“ bewahrt sowohl die Singularform als auch den umfassenden Bezug und vermeidet eine unbegründete geschlechtliche Verengung.
- issue: Verhältnis von göttlicher Zucht, Tadel und Lehre
  choice: Die beiden Beschreibungen Gottes bleiben nebeneinandergestellt, ohne den Tadel ausdrücklich als Gericht oder Strafe auszulegen.
  alternative: „richten“ oder „bestrafen“
  rationale: יכח kann je nach Kontext weiter reichen, doch hier stützen Parallelismus und Wortfeld zunächst den Sinn des rügenden Korrigierens. Eine stärkere gerichtliche Deutung wäre möglich, sollte aber nicht in den Haupttext eingetragen werden.
translation_notes:
  register: Moderne, würdevolle Psalmsprache mit erhaltener rhetorischer Frage und dichter Parallelstruktur. Der Gedankenstrich markiert die Zäsur zwischen den beiden Gottesbeschreibungen.
