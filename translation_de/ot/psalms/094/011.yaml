  text: יְֽהוָ֗ה יֹ֭דֵעַ מַחְשְׁב֣וֹת אָדָ֑ם כִּי הֵ֥מָּה הָֽבֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/011.yaml
  text: The LORD knows the thoughts of man, that they are vapor.
translation:
  language: de
  text: 'Der HERR kennt die Gedanken der Menschen: Sie sind ein Hauch.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nichtig“ beziehungsweise „vergeblich“. Das hebräische Wort bezeichnet einen flüchtigen Hauch.'
    reason: Die Bildhaftigkeit und Bedeutungsbreite von הָבֶל lässt sich in einem einzelnen deutschen Wort nicht vollständig wiedergeben.
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens wahrt seine Besonderheit und ist im modernen Bibeldeutsch allgemein verständlich.
- source_word: מַחְשְׁבוֹת אָדָם
  choice: die Gedanken der Menschen
  rationale: מַחְשְׁבוֹת bezeichnet Gedanken oder Überlegungen; אָדָם ist hier kollektiv auf die Menschheit bezogen.
- source_word: הָבֶל
  choice: ein Hauch
  rationale: Das Bildwort bezeichnet wörtlich einen flüchtigen Atemhauch und vermittelt hier Vergänglichkeit, Substanzlosigkeit und Vergeblichkeit, ohne diese Aspekte auf nur einen festzulegen.
theological_decisions:
- issue: Bezug und Aussage von כִּי הֵמָּה הָבֶל
  choice: 'Als eigenständige Aussage über die menschlichen Gedanken: „Sie sind nur ein Hauch.“'
  alternative: „dass sie nur ein Hauch sind“
  rationale: כִּי kann hier den Inhalt dessen einführen, was der HERR weiß, oder eine bestätigende Aussage anschließen. Der Doppelpunkt erhält den engen Sinnzusammenhang, ohne die syntaktische Nuance unnötig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelität und das Bild des flüchtigen Hauchs bleiben erhalten; „Menschen“ gibt das kollektiv gebrauchte אָדָם idiomatisch und inklusiv wieder.
