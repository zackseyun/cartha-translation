source:
  edition: WLC
  text: הִ֭נָּשֵׂא שֹׁפֵ֣ט הָ/אָ֑רֶץ הָשֵׁ֥ב גְּ֝מ֗וּל עַל גֵּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/002.yaml
  text: Rise up[a], Judge of the earth[b]; repay the proud what they deserve.
translation:
  language: de
  text: Erhebe dich[a], Richter der Erde; vergilt den Hochmütigen, was sie verdienen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tritt machtvoll hervor“; wörtlicher auch: „Erhebe dich“ beziehungsweise „Sei erhaben“. Das hebräische Verb kann sowohl das Sich-Erheben als auch das machtvolle Eingreifen anklingen lassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Lass Vergeltung auf die Hochmütigen zurückkehren.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּשֵׂא
  choice: Erhebe dich
  rationale: Der Imperativ ruft Gott dazu auf, sich zum Eingreifen zu erheben. „Erhebe dich“ bewahrt die reflexive Bildsprache des Hebräischen und klingt im Deutschen würdig und natürlich.
- source_word: שֹׁפֵט
  choice: Richter
  rationale: Das substantivisch gebrauchte Partizip dient als Anrede beziehungsweise Titel Gottes; „Richter“ gibt dies knapp und sachgerecht wieder.
- source_word: הָאָרֶץ
  choice: der Erde
  rationale: Im Zusammenhang der Anrede Gottes als Richter bezeichnet אֶרֶץ am ehesten die Erde als Ganze; „Land“ würde den Umfang unnötig territorial verengen.
- source_word: הָשֵׁב
  choice: vergilt
  rationale: Der Hifil-Imperativ von שׁוב bedeutet zusammen mit גְּמוּל, die Vergeltung zurückkehren zu lassen. Das deutsche „vergilt“ bringt den gerichtlichen Sinn idiomatisch zum Ausdruck.
- source_word: גְּמוּל
  choice: was sie verdienen
  rationale: גְּמוּל bezeichnet die zustehende Vergeltung. Die Formulierung ist in modernem Deutsch verständlicher als das abstrakte „Vergeltung“, ohne den retributiven Sinn aufzugeben.
- source_word: עַל
  choice: den Hochmütigen
  rationale: Die Präposition kennzeichnet hier das Ziel der Vergeltung. Im Deutschen wird dies natürlich durch das Dativobjekt nach „vergelten“ ausgedrückt.
- source_word: גֵּאִים
  choice: den Hochmütigen
  rationale: Das Wort bezeichnet moralisch überhebliche Menschen. „Hochmütige“ ist würdig und präzise; „Stolze“ könnte auch positiv verstanden werden, „Arrogante“ wirkt weniger poetisch.
theological_decisions:
- issue: Art der Bitte um göttliches Gericht
  choice: Eine Bitte an Gott, sich als Richter der ganzen Erde zu erheben und den Hochmütigen entsprechend ihrem Tun zu vergelten.
  alternative: Eine Bitte vor allem darum, dass Gott erhöht oder in seiner Majestät sichtbar werde.
  rationale: Die beiden Imperative sowie die Gerichtsbegriffe „Richter“ und „vergelten“ sprechen im Zusammenhang für ein aktives richterliches Eingreifen. Die mögliche Nuance der Erhöhung bleibt in „Erhebe dich“ erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Ton. Die direkte Anrede und der Parallelismus des hebräischen Verses bleiben erhalten; die abstrakte Wendung zur Vergeltung wird im Haupttext idiomatisch wiedergegeben und in der Fußnote dokumentiert.
