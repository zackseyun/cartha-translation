  text: וַ֭/יֹּ֣אמְרוּ לֹ֣א יִרְאֶה יָּ֑הּ וְ/לֹא יָ֝בִ֗ין אֱלֹהֵ֥י יַעֲקֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/007.yaml
  text: And they say[a], “Yah does not see, and the God of Jacob does not understand.”
translation:
  language: de
  text: 'Und sie sagen: »Jah[a] sieht nicht, und der Gott Jakobs versteht nicht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Jah«, die poetische Kurzform des Gottesnamens; die häufigere Langform wird oft mit »der HERR« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Und sie sagen
  rationale: Das hebräische Wayyiqtol ist formal vergangen, kann in der poetischen Darstellung aber die kennzeichnende, fortdauernde Rede der Frevler wiedergeben. Das Präsens passt zum beschreibenden Zusammenhang des Psalms.
- source_word: לֹא יִרְאֶה
  choice: sieht es nicht
  rationale: ראה bezeichnet hier das Sehen im Sinn des Wahrnehmens. Die konkrete Bildsprache bleibt erhalten; »es« bezieht sich sinngemäß auf das zuvor geschilderte Unrecht.
- source_word: יָּהּ
  choice: Jah
  rationale: יָהּ ist die poetische Kurzform des Gottesnamens. Die im Deutschen geläufige Wiedergabe »Jah« bewahrt den Unterschied zur Langform JHWH.
- source_word: וְלֹא יָבִין
  choice: und ... versteht es nicht
  rationale: בין bedeutet verstehen, Einsicht haben oder unterscheiden. »Versteht es nicht« gibt die Behauptung wieder, Gott erfasse das Geschehen nicht, ohne sie erklärend umzudeuten.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: der Gott Jakobs
  rationale: Die Genitivverbindung bewahrt die traditionelle und transparente Bundesbezeichnung für den Gott Israels.
theological_decisions:
- issue: Wiedergabe der poetischen Kurzform des Gottesnamens יָהּ
  choice: Jah
  alternative: der HERR
  rationale: Der Ausgangstext hat ausdrücklich die Kurzform יָהּ und nicht das Tetragramm JHWH. »Jah« erhält diese formale und poetische Besonderheit, ohne beide Namensformen einzuebnen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem poetischem Ton. Die parallele Satzstruktur des Hebräischen bleibt erhalten; die doppelte Ergänzung »es« sorgt im Deutschen für natürliche Verständlichkeit.
