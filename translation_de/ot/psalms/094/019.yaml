  variant: modern standard German
source:
  edition: WLC
  text: בְּ/רֹ֣ב שַׂרְעַפַּ֣/י בְּ/קִרְבִּ֑/י תַּ֝נְחוּמֶ֗י/ךָ יְֽשַׁעַשְׁע֥וּ נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/019.yaml
  text: When my anxious thoughts are many within me[b][a], your consolations delight my soul.
translation:
  language: de
  text: Wenn sich die beunruhigenden Gedanken in mir mehren[a], erfreuen deine Tröstungen meine Seele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Bei der Menge meiner aufgewühlten Gedanken in meinem Innern“. Das hebräische Wort kann beunruhigende, geteilte oder sich verzweigende Gedanken bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „richten deine Tröstungen meine Seele auf“. Im Hebräischen steht „Tröstungen“ im Plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב
  choice: Wenn sich … mehren
  rationale: Die Verbindung aus ב und רֹב bezeichnet eine große Menge oder Fülle. Die deutsche Nebensatzform gibt den begleitenden beziehungsweise zeitlichen Sinn natürlich wieder.
- source_word: שַׂרְעַפַּי
  choice: meine beunruhigenden Gedanken
  rationale: Das seltene Substantiv bezeichnet nicht neutrale Gedanken, sondern innere Unruhe; möglicherweise schwingen verzweigte oder geteilte Gedanken mit. „Beunruhigende Gedanken“ bleibt verständlich und bewahrt diese negative Färbung.
- source_word: בְּקִרְבִּי
  choice: in mir
  rationale: Wörtlich bezeichnet die Wendung das Innere eines Menschen. „In mir“ ist im Deutschen natürlich und gibt die innere Dimension prägnant wieder.
- source_word: תַּנְחוּמֶיךָ
  choice: deine Tröstungen
  rationale: Der hebräische Plural wird bewahrt und kann vielfältigen oder wiederholten Zuspruch und Trost bezeichnen.
- source_word: יְשַׁעַשְׁעוּ
  choice: erfreuen
  rationale: Das Verb beschreibt wohltuende Freude oder Ergötzung. „Erfreuen“ verbindet den tröstenden und den freudigen Aspekt in einem würdigen poetischen Register.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ kann das Leben, die Person oder das innere Selbst bezeichnen. „Meine Seele“ entspricht hier der poetischen Rede vom Innersten des Beters, ohne den Ausdruck auf bloße Gefühlsregungen zu verengen.
theological_decisions:
- issue: Bedeutungsumfang von נֶפֶשׁ
  choice: meine Seele
  alternative: mein Innerstes / mich
  rationale: Die traditionelle und poetisch passende Wiedergabe bleibt erhalten; dabei wird nicht behauptet, der hebräische Ausdruck bezeichne ausschließlich einen vom Körper getrennten Bestandteil des Menschen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Ton. Der Parallelismus zwischen innerer Unruhe und göttlichem Trost bleibt klar; der hebräische Plural „Tröstungen“ wird bewusst erhalten.
