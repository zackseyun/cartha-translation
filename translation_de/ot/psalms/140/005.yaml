base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/005.yaml
  text: The proud have hidden a trap for me[a], and with cords they have spread a net beside the path; they have set snares for me[c][b]. Selah
translation:
  language: de
  text: Die Hochmütigen[a] haben mir heimlich eine Falle gestellt; mit Stricken haben sie ein Netz neben dem Weg ausgespannt[b]; Schlingen haben sie mir gelegt. Sela[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Überheblichen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „am Weg“ beziehungsweise „an der Seite eines Pfades/einer Spur“.'
    reason: lexical_alternative
  - marker: c
    text: „Sela“ ist vermutlich eine liturgische oder musikalische Angabe; die genaue Bedeutung ist ungewiss.
    reason: cultural_note
lexical_decisions:
- source_word: טָמְנוּ
  choice: haben … verborgen
  rationale: Das Verb bezeichnet das Verbergen oder heimliche Legen, besonders bei Fallen. Die Formulierung bewahrt das Bild einer verborgenen Falle.
- source_word: גֵאִים
  choice: die Hochmütigen
  rationale: Das Wort bezeichnet stolze beziehungsweise überhebliche Menschen. „Die Hochmütigen“ ist prägnant, geschlechtsübergreifend und moralisch wertend wie der hebräische Ausdruck.
- source_word: פַּח
  choice: eine Falle
  rationale: פַּח bezeichnet eine Falle oder Schlinge. „Falle“ hält das Jagdbild fest und unterscheidet den Ausdruck von den später genannten מֹקְשִׁים.
- source_word: וַחֲבָלִים
  choice: mit Stricken
  rationale: חֲבָלִים bedeutet wörtlich „Stricke“ oder „Seile“. Die instrumentale Wiedergabe passt zur Handlung des Netzausspannens.
- source_word: פָּרְשׂוּ רֶשֶׁת
  choice: haben sie ein Netz … ausgespannt
  rationale: Die feste Verbindung bedeutet, ein Netz auszubreiten oder auszuspannen. „Ausgespannt“ ist im Deutschen für ein Fangnetz natürlich.
- source_word: לְיַד מַעְגָּל
  choice: am Weg
  rationale: לְיַד bedeutet „an der Seite von/bei“, מַעְגָּל einen Pfad, Weg oder eine Spur. „Am Weg“ gibt die räumliche Lage knapp wieder, ohne sie stärker festzulegen.
- source_word: מֹקְשִׁים
  choice: Schlingen
  rationale: Das Wort bezeichnet Fangschlingen oder Fallen. „Schlingen“ wahrt das Jagdmotiv und bietet eine sinnvolle lexikalische Unterscheidung zu פַּח.
- source_word: שָׁתוּ
  choice: haben … gelegt
  rationale: Das Verb bedeutet „setzen, stellen, legen“. Im Deutschen ist „Schlingen legen“ die natürliche Verbindung.
- source_word: סֶלָה
  choice: Sela
  rationale: Die genaue Bedeutung ist unsicher; vermutlich handelt es sich um eine liturgische oder musikalische Angabe. Daher wird der Ausdruck transliteriert.
