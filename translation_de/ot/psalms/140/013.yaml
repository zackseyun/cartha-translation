  text: אַ֣ךְ צַ֭דִּיקִים יוֹד֣וּ לִ/שְׁמֶ֑/ךָ יֵשְׁב֥וּ יְ֝שָׁרִ֗ים אֶת פָּנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/013.yaml
  text: Surely the righteous will give thanks to your name[a]; the upright will dwell before your face.
translation:
  language: de
  text: Gewiss, die Gerechten werden deinem Namen danken; die Aufrichtigen werden vor deinem Angesicht[a] wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in deiner Gegenwart“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Gewiss
  rationale: Die Partikel bekräftigt hier als abschließende Aussage die zuversichtliche Erwartung; „Gewiss“ gibt diesen Nachdruck natürlich wieder.
- source_word: צַדִּיקִים
  choice: die Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die gerecht handeln beziehungsweise in einem rechten Verhältnis zu Gott stehen.
- source_word: יוֹדוּ
  choice: werden … danken
  rationale: Die Hifil-Form von ידה bezeichnet im Psalmzusammenhang das dankende Bekennen oder Preisen; mit dem göttlichen Namen als Bezug ist „danken“ passend.
- source_word: לִשְׁמֶךָ
  choice: deinem Namen
  rationale: Der Dativ gibt die durch לְ bezeichnete Ausrichtung des Dankes idiomatisch wieder und bewahrt die ausdrückliche Nennung des göttlichen Namens.
- source_word: יֵשְׁבוּ
  choice: werden … wohnen
  rationale: ישׁב kann „sitzen“, „bleiben“ oder „wohnen“ bedeuten. Hier drückt „wohnen“ ein beständiges Verweilen in Gottes Nähe aus, ohne es auf eine Körperhaltung zu verengen.
- source_word: יְשָׁרִים
  choice: die Aufrichtigen
  rationale: Das substantivierte Adjektiv bewahrt die ethische Bedeutung von Menschen, deren Weg gerade und redlich ist.
- source_word: אֶת פָּנֶיךָ
  choice: vor deinem Angesicht
  rationale: Die Wendung bewahrt das konkrete hebräische Bild vom „Angesicht“ Gottes und bezeichnet zugleich seine unmittelbare Gegenwart.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Gegenwart
  choice: vor deinem Angesicht
  alternative: in deiner Gegenwart; vor dir
  rationale: Die konkrete Bildsprache des Hebräischen bleibt erhalten, ohne die Aussage körperlich zu verengen. Die idiomatische Bedeutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus zwischen „den Gerechten“ und „den Aufrichtigen“ sowie die konkrete Bildsprache des hebräischen Textes bleiben erhalten.
