source:
  edition: WLC
  text: רֹ֥אשׁ מְסִבָּ֑/י עֲמַ֖ל שְׂפָתֵ֣י/מוֹ יכסו/מו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/009.yaml
  text: As for the head of those who surround me[b][a], let the trouble of their lips cover them.
translation:
  language: de
  text: Das Haupt[a] derer, die mich umringen – das Unheil[b] ihrer Lippen soll sie bedecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Satz ist sehr knapp. Möglich ist auch: „Die Häupter derer, die mich umringen, soll das Unheil ihrer Lippen bedecken.“ Dabei wird der Singular „Haupt“ kollektiv verstanden oder sinngemäß pluralisch wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „der Schaden“ beziehungsweise „die Bosheit ihrer Lippen“. Gemeint ist das Unheil, das ihre Worte anrichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: das Haupt
  rationale: Die konkrete Grundbedeutung „Haupt“ bleibt erhalten. Der Singular entspricht dem masoretischen Text, auch wenn die knappe Syntax eine kollektive Deutung zulässt.
- source_word: מְסִבָּי
  choice: derer, die mich umringen
  rationale: Die Wiedergabe bewahrt das Bild feindlicher Umzingelung, ohne den Ausdruck unnötig als militärische Belagerung festzulegen.
- source_word: עֲמַל
  choice: Unheil
  rationale: Im Zusammenhang mit den Lippen bezeichnet das Wort das schädliche, boshafte Ergebnis ihrer Rede. „Unheil“ wahrt die Spannweite zwischen Mühsal, Schaden und Bosheit.
- source_word: שְׂפָתֵימוֹ
  choice: ihrer Lippen
  rationale: Die wörtliche Körpermetapher der hebräischen Poesie wird beibehalten, statt sie zu „Rede“ zu verflachen.
- source_word: יכסומו
  choice: soll sie bedecken
  rationale: „Bedecken“ gibt כסה konkret wieder; „soll“ trägt hier dem im Kontext naheliegenden Wunsch beziehungsweise Fluch Rechnung, ohne ihn als bloße Vorhersage darzustellen.
theological_decisions:
- issue: Knappe Satzstruktur und Verwünschung
  choice: 'Der Vers wird als imprekatorischer Wunsch verstanden: Das von ihren Lippen ausgehende Unheil soll die Gegner selbst bedecken.'
  alternative: Der Verbalsatz kann indikativisch als Vorhersage („wird sie bedecken“) verstanden werden; außerdem lässt sich „Haupt“ kollektiv beziehungsweise sinngemäß pluralisch auflösen.
  rationale: Der unmittelbare Zusammenhang ist ein Gebet um Gericht. Zugleich bleibt der überlieferte Singular „Haupt“ im Haupttext stehen, damit die syntaktische und poetische Spannung nicht stillschweigend beseitigt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst konkreter poetischer Bildsprache. „Haupt“ ist etwas gehobener als „Kopf“, eignet sich hier aber für die dichterische Sprache und erhält die Verbindung mit „bedecken“.
