  terminology: „Glühende Kohlen“, „Feuer“, „tiefe Gruben“ und „nie wieder aufstehen“ sind sachgerecht und registerangemessen. Es werden weder Gott als Handelnder ergänzt noch theologische Aussagen über den Wortlaut hinaus festgelegt.
