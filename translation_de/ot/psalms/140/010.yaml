  text: ימיטו עֲלֵי/הֶ֗ם גֶּֽחָ֫לִ֥ים בָּ/אֵ֥שׁ יַפִּלֵ֑/ם בְּ֝/מַהֲמֹר֗וֹת בַּֽל יָקֽוּמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/010.yaml
  text: Let burning coals fall on them[a]; let him cast them into the fire, into deep pits[b], never to rise again.
translation:
  language: de
  text: Glühende Kohlen mögen auf sie herabfallen[a]; er stürze sie ins Feuer, in tiefe Gruben[b], sodass sie nie wieder aufstehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kohlen mögen auf sie niederregnen.“ Das hebräische Verb kann hier ein Herabfallen oder Niederregnen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in Abgründe“ beziehungsweise „in Wassertiefen“. Das hebräische Wort ist selten; seine genaue Bedeutung ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ימיטו
  choice: mögen ... herabfallen
  rationale: Der Hifil-Imperfekt trägt hier im Kontext des Bitt- und Fluchgebets jussivischen Charakter. Die Wiedergabe wahrt den Wunschcharakter und lässt den Handelnden ungenannt.
- source_word: גחלים
  choice: glühende Kohlen
  rationale: Das Substantiv bezeichnet Kohlen bzw. Glut; „glühende Kohlen“ macht das im Feuerkontext naheliegende Bild in natürlichem Deutsch deutlich.
- source_word: עֲלֵיהֶם
  choice: auf sie
  rationale: Natürliche Wiedergabe der Präposition על mit pronominalem Suffix.
- source_word: בָּאֵשׁ
  choice: ins Feuer
  rationale: In Verbindung mit dem folgenden kausativen Verb ist eine direktionale Wiedergabe im Deutschen angemessen.
- source_word: יַפִּלֵם
  choice: er stürze sie
  rationale: Hifil-Imperfekt 3. Person Singular von נפל mit Objektssuffix. Der Singular und die im Hebräischen nur implizierte handelnde Person bleiben erhalten.
- source_word: בְּמַהֲמֹרוֹת
  choice: in tiefe Gruben
  rationale: Das seltene und unsichere Wort bezeichnet wahrscheinlich Gruben, Abgründe oder Tiefen. „Tiefe Gruben“ bewahrt das konkrete Sturzbild, ohne die Unsicherheit im Haupttext zu überladen.
- source_word: בַּל יָקוּמוּ
  choice: sodass sie nie wieder aufstehen
  rationale: Die Negation bezeichnet hier die endgültige Folge des Sturzes. „Nie wieder aufstehen“ gibt קום im Bildzusammenhang idiomatisch wieder.
theological_decisions:
- issue: Gerichtswunsch und unausgesprochenes Subjekt des singularischen Verbs
  choice: Den Vers als Bitte um Gericht bewahren und den singularischen Handelnden lediglich mit „er“ wiedergeben.
  alternative: Den Satz unpersönlich formulieren („mögen sie gestürzt werden“) oder Gott ausdrücklich als Subjekt ergänzen.
  rationale: Das Hebräische wechselt von einer pluralischen zu einer singularischen Verbform. Wahrscheinlich ist Gott als Handelnder mitgemeint, doch er wird nicht ausdrücklich genannt; die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallel aufgebaute Gerichtswunsch und die Bildfolge von herabfallenden Kohlen, Feuer und tiefem Sturz bleiben erhalten; echte lexikalische Unsicherheiten werden in den Fußnoten ausgewiesen.
