  source_fidelity: Die Übersetzung gibt die jussivisch-imprekative Satzfolge, den Wechsel zur singularischen Verbform („er“) und die Bildfolge von Kohlen, Feuer und Tiefen zuverlässig wieder. „Glühende Kohlen mögen ... herabfallen“ ist idiomatisch, auch wenn die kausative Nuance von יָמִיטו weniger ausdrücklich hervortritt; die Fußnote macht die mögliche Nuance des Niederregnens kenntlich. Die seltene und semantisch unsichere Bezeichnung מַהֲמֹרוֹת wird mit „tiefe Gruben“ vorsichtig wiedergegeben und durch angemessene Alternativen abgesichert.
