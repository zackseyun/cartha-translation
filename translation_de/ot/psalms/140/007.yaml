  text: יְהֹוִ֣ה אֲ֭דֹנָ/י עֹ֣ז יְשׁוּעָתִ֑/י סַכֹּ֥תָה לְ֝/רֹאשִׁ֗/י בְּ/י֣וֹם נָֽשֶׁק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/007.yaml
  text: O Yahweh[a], my Lord, the strength of my salvation, you have covered my head in the day of battle.
translation:
  language: de
  text: Jahwe, mein Herr, du bist die Stärke meiner Rettung; du hast mein Haupt beschirmt am Tag des Kampfes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „am Tag der Waffen“; gemeint ist wahrscheinlich die Zeit eines bewaffneten Konflikts.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוִה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; die direkte Anrede ergibt sich im Deutschen ohne zusätzliches „O“.
- source_word: אֲדֹנָי
  choice: mein Herr
  rationale: Die Form bezeichnet hier in der Anrede „mein Herr“ und bleibt vom unmittelbar vorausgehenden Gottesnamen unterscheidbar.
- source_word: עֹז יְשׁוּעָתִי
  choice: du Stärke meiner Rettung
  rationale: Die Genitivverbindung wird bewahrt; das ergänzte „du“ kennzeichnet im Deutschen natürlich die anredende Apposition.
- source_word: יְשׁוּעָתִי
  choice: meiner Rettung
  rationale: „Rettung“ gibt den konkreten Sinn im Zusammenhang von Gefahr und bewaffnetem Konflikt klar wieder, ohne die mögliche weitergehende Bedeutung einzuengen.
- source_word: סַכֹּתָה
  choice: du hast … beschirmt
  rationale: „Beschirmt“ verbindet das Bild des Bedeckens mit seiner Schutzfunktion und gibt die vollendete Verbform wieder.
- source_word: לְרֹאשִׁי
  choice: mein Haupt
  rationale: „Haupt“ bewahrt das konkrete Schutzbild in einem würdigen poetischen Register.
- source_word: בְּיוֹם נָשֶׁק
  choice: am Tag des Kampfes
  rationale: Die Wendung meint wahrscheinlich die Zeit bewaffneter Auseinandersetzung; die wörtlichere Bedeutung von נָשֶׁק wird in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst; „Jahwe“ erhält ihn als Eigennamen und unterscheidet ihn von אֲדֹנָי („mein Herr“).
- issue: Verhältnis von Stärke und Rettung
  choice: du Stärke meiner Rettung
  alternative: du starke Hilfe, die mich rettet
  rationale: Die gewählte Fassung bewahrt die knappe und theologisch offene Genitivverbindung, statt sie als bestimmte Art des Wirkens auszudeuten.
translation_notes:
  register: Moderne, würdige Psalmsprache. „Haupt“ und „beschirmt“ sind leicht gehoben, aber verständlich und bewahren das konkrete poetische Schutzbild.
