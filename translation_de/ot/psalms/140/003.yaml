id: PSA.140.3
reference: Psalms 140:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שָֽׁנֲנ֣וּ לְשׁוֹנָ/ם֮ כְּֽמוֹ נָ֫חָ֥שׁ חֲמַ֥ת עַכְשׁ֑וּב תַּ֖חַת שְׂפָתֵ֣י/מוֹ סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/003.yaml
  text: They sharpen their tongue like a snake[a]; the venom of a viper is under their lips[b]. Selah
translation:
  language: de
  text: Sie schärfen ihre Zunge wie eine Schlange; das Gift einer Viper[a] ist unter ihren Lippen. Sela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Otter“ oder „Aspis“; das hebräische Wort bezeichnet eine Giftschlange, doch die genaue Art ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: „Sela“ ist wahrscheinlich eine liturgische oder musikalische Angabe; die genaue Bedeutung ist unsicher.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁנֲנוּ
  choice: schärfen
  rationale: Das Piel von שׁנן bedeutet „schärfen“ oder „wetzen“. Die Wiedergabe bewahrt das Bild einer gefährlich gemachten, verletzenden Rede.
- source_word: לְשׁוֹנָם
  choice: ihre Zunge
  rationale: Der hebräische Text verwendet den Singular mit einem Suffix der 3. Person Plural. Der kollektive Singular lässt sich im Deutschen natürlich beibehalten.
- source_word: כְּמוֹ נָחָשׁ
  choice: wie eine Schlange
  rationale: נחש bezeichnet allgemein eine Schlange. „Schlange“ ist im modernen Deutschen klar und vermeidet eine unnötige Festlegung auf eine bestimmte Art.
- source_word: חֲמַת
  choice: das Gift
  rationale: חמה kann sonst „Zorn“ bedeuten, bezeichnet im Zusammenhang mit einer Giftschlange jedoch ihr Gift.
- source_word: עַכְשׁוּב
  choice: Viper
  rationale: Das Wort bezeichnet eine giftige Schlange, doch die genaue Art ist unsicher. „Viper“ gibt den Sinn verständlich wieder, ohne in der Fußnote die zoologische Unsicherheit zu verschweigen.
- source_word: תַּחַת שְׂפָתֵימוֹ
  choice: ist unter ihren Lippen
  rationale: Die präpositionslose deutsche Kopula ergänzt den hebräischen Nominalsatz natürlich; das Bild verborgen bereitliegenden Giftes bleibt erhalten.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und Funktion des vermutlich liturgischen oder musikalischen Zeichens nicht sicher sind, wird es transliteriert statt gedeutet.
theological_decisions: []
