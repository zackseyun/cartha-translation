  yaml_path: translation/ot/psalms/140/002.yaml
  text: who devise evil things in their heart[a]; all day they stir up wars.
translation:
  language: de
  text: die in ihrem Herzen Böses planen; den ganzen Tag schüren sie Kriege.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »jeden Tag sammeln sie sich zum Kampf«; oder: »jeden Tag provozieren sie Konflikte«. Das hier verwendete hebräische Verb יָגוּרוּ ist schwer zu deuten; im Zusammenhang sind mehrere Übersetzungen möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen führt die weitere Beschreibung der im Kontext genannten bösen Menschen fort und ist im Deutschen natürlich.
- source_word: חָשְׁבוּ
  choice: planen
  rationale: Das Verb bezeichnet hier absichtsvolles Ersinnen oder Planen, nicht bloßes Denken.
- source_word: רָעוֹת
  choice: Böses
  rationale: Der substantivierte Ausdruck gibt die Mehrzahl schädlicher oder böser Vorhaben im Deutschen idiomatisch wieder, ohne sie näher festzulegen.
- source_word: בְּלֵב
  choice: in ihrem Herzen
  rationale: Die Form bewahrt das hebräische Bild des Herzens als Zentrum des Denkens und Wollens; der Singular steht kollektiv zum pluralischen Subjekt.
- source_word: כָּל יוֹם
  choice: den ganzen Tag
  rationale: Die zeitliche Wendung betont fortwährende Tätigkeit und entspricht in diesem poetischen Zusammenhang einer natürlichen deutschen Ausdrucksweise.
- source_word: יָגוּרוּ
  choice: schüren
  rationale: Das schwierige Verb wird im Zusammenhang mit »Kriege« als aktives Hervorrufen oder Anfachen von Konflikten verstanden; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: מִלְחָמוֹת
  choice: Kriege
  rationale: Die Wiedergabe erhält die konkrete Bedeutung und den Plural des hebräischen Substantivs.
theological_decisions: []
translation_notes:
  register: Moderne, verständliche und zugleich würdevolle poetische Sprache. »Böses planen« ist natürlicher als eine wörtlichere Pluralform; »in ihrem Herzen« bewahrt bewusst das hebräische Menschenbild. Die Semantik des schwierigen Verbs יָגוּרוּ wird im Haupttext kontextuell wiedergegeben und in der Fußnote als offen ausgewiesen.
