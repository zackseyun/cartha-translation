lexical_decisions:
- source_word: אִישׁ לָשׁוֹן
  choice: ein Mann der Zunge
  rationale: Die ungewöhnliche, bildhafte hebräische Wendung bleibt erhalten; die wahrscheinliche Bedeutung »Verleumder« wird in einer Fußnote genannt.
- source_word: בַּל יִכּוֹן
  choice: wird … keinen festen Stand haben
  rationale: Gibt das poetische בַּל und das Nifal von כון natürlich wieder und bewahrt den Gedanken dauerhafter Festigkeit.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: אֶרֶץ bezeichnet hier wahrscheinlich das bewohnte Land beziehungsweise den gesellschaftlichen Lebensraum; »auf der Erde« wäre unnötig kosmisch.
- source_word: אִישׁ חָמָס
  choice: einen Mann der Gewalt
  rationale: Bewahrt die konkrete hebräische Nominalfügung und ihre Charakterisierung durch חָמָס.
- source_word: רָע
  choice: das Böse
  rationale: רָע wird als substantiviertes Subjekt des folgenden Verbs verstanden; dadurch bleibt die markante Personifikation des Bösen erhalten.
- source_word: יְצוּדֶנּוּ
  choice: wird … jagen
  rationale: צוד bedeutet jagen beziehungsweise einfangen. Der Kontext erlaubt eine Zukunftsaussage, ohne einen Wunsch ausdrücklich einzutragen.
- source_word: לְמַדְחֵפֹת
  choice: mit immer neuen Stößen
  rationale: Das seltene Pluralwort wird wahrscheinlich von einer Wurzel für Stoßen oder Wegdrängen abgeleitet. Die Wiedergabe wahrt das konkrete Bild und die Mehrzahl, während eine Fußnote auf die unsichere Syntax hinweist.
theological_decisions:
- issue: Syntaktische Zuordnung von רָע
  choice: '»das Böse« als Subjekt: Das Böse jagt den Mann der Gewalt'
  alternative: 'רָע als Adjektiv zu »Mann der Gewalt«: »ein böser Mann der Gewalt«'
  rationale: Die Akzent- und Satzstruktur lässt die im revidierten Ausgangstext bevorzugte Lesart zu, in der das Böse personifiziert als Jäger auftritt. Die alternative Zuordnung bleibt wegen der knappen poetischen Syntax in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Wendung »Mann der Zunge« und das schwer verständliche Schlussbild werden im Haupttext bewusst nicht eingeebnet; Fußnoten bieten idiomatischere beziehungsweise syntaktisch alternative Lesarten.
