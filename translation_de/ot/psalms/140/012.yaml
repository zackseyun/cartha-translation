review_pass:
  verdict: revise
  source_fidelity: Die juristische Bedeutung von עשה דין und der Parallelismus mit משפט werden im Entwurf grundsätzlich treffend wiedergegeben. Die imperfektische Zukunftsaussage sollte im Deutschen jedoch ausdrücklich markiert werden. Die Anmerkung zu ידעת muss präziser zwischen der masoretischen 2. Person Singular und der tradierten Lesart „Ich weiß“ unterscheiden.
  naturalness: „Jemandem zu seinem Recht verhelfen“ ist natürlich; die unterschiedliche Formulierung der beiden parallelen Halbzeilen wirkt jedoch etwas uneinheitlich. „Für die Rechtssache ... eintreten“ und „Recht verschaffen“ sind modernes, verständliches Standarddeutsch und bewahren die forensische Bildsprache.
  terminology: „Jahwe“, „Elender“ und „Bedürftige“ sind angemessen. „Rechtssache“ gibt דין in diesem Zusammenhang genauer wieder als ein bloß abstraktes „Recht“.
  issues:
  - severity: medium
    issue: Die Zukunftsbedeutung von יַעֲשֶׂה wird nicht ausdrücklich wiedergegeben.
    rationale: Das hebräische Imperfekt sagt hier Gottes erwartetes künftiges Eintreten für die Schwachen aus. Das deutsche Präsens kann zwar generisch verstanden werden, aber „wird“ macht die Aussage ohne Bedeutungsverlust eindeutig.
  - severity: medium
    issue: Die Fußnote zu ידעת beschreibt die Form nur als Konsonantenform und lässt die textliche Lage unscharf.
    rationale: Die vorliegende masoretische Form ist als 2. Person Singular („du weißt“) zu lesen. Die in Übersetzungen verbreitete Lesart „Ich weiß“ ist eine traditionelle, kontextuelle Lesung bzw. setzt eine abweichende Form voraus; sie sollte nicht als bloße reguläre Deutung derselben Form dargestellt werden.
  - severity: low
    issue: Die beiden Halbzeilen sind im Deutschen stilistisch und semantisch nicht ganz parallel gestaltet.
    rationale: „Zu seinem Recht verhelfen“ gegenüber „Recht schaffen“ ist verständlich, doch eine parallelere forensische Formulierung bildet דין und משפט klarer ab.
  revised_text: Ich weiß[a], dass Jahwe für die Rechtssache des Elenden eintreten und den Bedürftigen Recht verschaffen wird.[b]
  revised_footnotes:
  - marker: a
    text: 'Der masoretische Text lautet formal: „Du weißt“ (2. Person Singular). Die verbreitete Lesart „Ich weiß“ versteht den Vers als Bekenntnis des Psalmisten und setzt eine abweichende Lesung voraus; möglich ist auch: „Ich habe erkannt“.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „die Rechtssache des Elenden tun“ und „das Recht der Bedürftigen“. Gemeint ist, dass Jahwe für ihre Sache eintritt und ihnen zu ihrem Recht verhilft.'
    reason: lexical_alternative
  revision_rationale: Die Revision macht die Zukunftsaussage sichtbar, gestaltet den juristischen Parallelismus gleichmäßiger und erläutert die schwierige Anfangsform textkritisch genauer, ohne die traditionelle Lesart „Ich weiß“ zu unterdrücken.
