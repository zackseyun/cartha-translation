  variant: modern standard German
source:
  edition: WLC
  text: ידעת כִּֽי יַעֲשֶׂ֣ה יְ֭הוָה דִּ֣ין עָנִ֑י מִ֝שְׁפַּ֗ט אֶבְיֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/012.yaml
  text: I know that Yahweh will uphold the cause of the afflicted[b][a], and justice for the needy.
translation:
  language: de
  text: Ich weiß[a], dass Jahwe dem Elenden zu seinem Recht verhilft[b] und den Bedürftigen Recht schafft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du weißt“; die hebräische Konsonantenform entspricht formal der 2. Person Singular. Traditionell wird sie hier als Bekenntnis des Psalmisten verstanden: „Ich weiß“; auch „Ich habe erkannt“ ist möglich.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „den Rechtsfall des Elenden ausführen“; gemeint ist, dass Jahwe für dessen Rechtssache eintritt und ihm Recht verschafft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ידעת
  choice: Ich weiß
  rationale: Der überlieferte Konsonantentext entspricht formal „du weißt“; traditionell wird die Form hier jedoch als Bekenntnis des Psalmisten verstanden. Das deutsche Präsens gibt den zuständlichen Sinn natürlich wieder; die echte textliche Mehrdeutigkeit wird in einer Fußnote bewahrt.
- source_word: כִּי
  choice: dass
  rationale: Die Partikel leitet hier am natürlichsten den Inhalt dessen ein, was der Sprecher weiß.
- source_word: יַעֲשֶׂה ... דִּין
  choice: verhilft ... zu seinem Recht
  rationale: 'Wörtlich steht „den Rechtsfall/die Sache tun“. Die deutsche Wendung gibt den forensischen Sinn wieder: Jahwe tritt für den Rechtsanspruch des Bedrängten ein und setzt ihn durch.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen geläufige Wiedergabe des göttlichen Eigennamens bewahrt den Namen statt ihn durch einen Titel zu ersetzen.
- source_word: עָנִי
  choice: dem Elenden
  rationale: Das Wort bezeichnet hier angesichts gewaltsamer Bedrängung einen leidenden, unterdrückten und schutzbedürftigen Menschen, nicht lediglich einen wirtschaftlich Armen.
- source_word: מִשְׁפַּט
  choice: Recht
  rationale: Im Parallelismus bezeichnet das Wort den gerechten Rechtsspruch beziehungsweise das Recht, das den Bedürftigen zukommt.
- source_word: אֶבְיוֹנִים
  choice: den Bedürftigen
  rationale: Der Ausdruck bezeichnet Menschen in Not und bewahrt einen weiteren Sinn als bloß materielle Armut.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt im Deutschen den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Sprecher der Anfangsform ידעת
  choice: Ich weiß
  alternative: Du weißt; ich habe erkannt
  rationale: Der Vers wird traditionell als abschließendes Vertrauensbekenntnis des Psalmisten verstanden. Da der Konsonantentext formal auch „du weißt“ erlaubt beziehungsweise nahelegt, wird diese Spannung nicht stillschweigend beseitigt, sondern in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die juristische Bildsprache wird idiomatisch wiedergegeben, ohne sie zu verflachen; der Parallelismus zwischen dem Elenden und den Bedürftigen bleibt erhalten.
