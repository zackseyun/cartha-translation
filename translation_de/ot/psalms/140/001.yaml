id: PSA.140.1
reference: Psalms 140:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חַלְּצֵ֣/נִי יְ֭הוָה מֵ/אָדָ֣ם רָ֑ע מֵ/אִ֖ישׁ חֲמָסִ֣ים תִּנְצְרֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/001.yaml
  text: Rescue me[a], O Yahweh, from the evil man; guard me from the violent man.
translation:
  language: de
  text: Rette mich[a], Jahwe, vor einem bösen Menschen; bewahre mich vor einem gewalttätigen Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Entreiße mich“.'
    reason: 'Lexikalische Alternative: חלץ kann das Herausziehen aus einer Gefahr besonders anschaulich ausdrücken.'
lexical_decisions:
- source_word: חַלְּצֵנִי
  choice: Rette mich
  rationale: Der Hifil-Imperativ von חלץ mit Suffix der 1. Person Singular bezeichnet das Herausziehen aus Gefahr beziehungsweise das Retten. „Rette mich“ gibt den dringlichen Hilferuf natürlich und prägnant wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: מֵאָדָם רָע
  choice: vor einem bösen Menschen
  rationale: אָדָם kann „Mensch“ oder kollektiv „Menschheit“ bedeuten. Der parallele Ausdruck מֵאִישׁ חֲמָסִים legt hier eine einzelne feindliche Person nahe. Da im Hebräischen kein Artikel steht, ist „einem“ sachgemäß.
- source_word: מֵאִישׁ חֲמָסִים
  choice: vor einem gewalttätigen Mann
  rationale: אִישׁ ist hier ein maskulines Singularwort für einen Mann; חֲמָסִים bezeichnet intensiv beziehungsweise abstrakt Gewalttat. Die adjektivische Wiedergabe ist im Deutschen natürlich und bewahrt den Sinn.
- source_word: תִּנְצְרֵנִי
  choice: bewahre mich
  rationale: נצר bedeutet „bewahren, behüten, schützen“. „Bewahre mich“ unterscheidet die fortdauernde Schutzbitte von der vorausgehenden Bitte um Rettung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Umschrift „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Geschlecht und Referenz von אָדָם und אִישׁ
  choice: „Mensch“ für אָדָם und „Mann“ für אִישׁ
  alternative: beide Ausdrücke mit „Mensch“ oder „Person“ wiederzugeben
  rationale: 'Die unterschiedliche Wortwahl des Hebräischen bleibt erkennbar: אָדָם ist der allgemeinere Ausdruck für einen Menschen, während אִישׁ hier ausdrücklich maskulin singular ist. Der Kontext beschreibt jeweils einen feindlichen Einzelnen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die zwei unterschiedlichen Schutzverben des hebräischen Verses bleiben erhalten; übermäßig traditionelle oder technisch wörtliche Formulierungen werden vermieden.
