  text: אָמַ֣רְתִּי לַ֭/יהוָה אֵ֣לִ/י אָ֑תָּה הַאֲזִ֥ינָ/ה יְ֝הוָ֗ה ק֣וֹל תַּחֲנוּנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/006.yaml
  text: I say to the LORD, “You are my God.” O LORD, listen to the voice of my pleas.
translation:
  language: de
  text: 'Ich sage zum HERRN: »Du bist mein Gott.« HERR, höre auf die Stimme meines Flehens!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Ich sage
  rationale: Die hebräische Perfektform kann hier als gegenwärtige, bekräftigende Aussage wiedergegeben werden; der unmittelbare Gebetskontext stützt das natürliche deutsche Präsens.
- source_word: לַיהוָה / יְהוָה
  choice: zum HERRN / HERR
  rationale: Der Gottesname JHWH wird entsprechend der etablierten deutschen Bibeltradition mit HERR in Kapitälchen wiedergegeben.
- source_word: הַאֲזִינָה
  choice: höre auf
  rationale: Der Imperativ bezeichnet aufmerksames Hinhören und wird idiomatisch mit »höre auf« wiedergegeben.
- source_word: קוֹל תַּחֲנוּנָי
  choice: die Stimme meines Flehens
  rationale: Die formnahe Wendung bewahrt sowohl קוֹל (»Stimme«) als auch den eindringlichen Charakter von תַּחֲנוּנִים (»Flehen«, »Hilferufe«).
theological_decisions:
- issue: Zeitbezug von אָמַרְתִּי
  choice: 'Präsens: »Ich sage«'
  alternative: 'Präteritum/Perfekt: »Ich sagte« oder »Ich habe gesagt«'
  rationale: In poetischer Rede kann das hebräische Perfekt eine feststehende oder wiederholt bekräftigte Erklärung ausdrücken. Das Präsens hält den Vers als unmittelbares Gebet verständlich, ohne eine zusätzliche zeitliche Festlegung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Gebetssprache. Die formnahe Wendung »Stimme meines Flehens« erhält die poetische Bildlichkeit des Hebräischen.
