id: PSA.140.8
reference: Psalms 140:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַל תִּתֵּ֣ן יְ֭הוָה מַאֲוַיֵּ֣י רָשָׁ֑ע זְמָמ֥/וֹ אַל תָּ֝פֵ֗ק יָר֥וּמוּ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/008.yaml
  text: O Yahweh[a], do not grant the desires of the wicked; do not advance his scheme, lest they be exalted[b]. Selah
translation:
  language: de
  text: Gewähre, Jahwe, dem Frevler nicht, was er begehrt; lass seinen Plan nicht gelingen[a], damit sie sich nicht überheben[b]. Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bring seinen Plan nicht zur Ausführung«. Das hebräische Verb ist an dieser Stelle schwierig und kann bedeuten, dass der Plan nicht vorangebracht oder verwirklicht werden soll.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder dem Sinn nach: »damit er sich nicht überhebt«. Im hebräischen Text steht jedoch die Mehrzahl: »sie«; gemeint sein können der Frevler und seine Verbündeten oder die Frevler allgemein.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige wissenschaftliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel wie »der HERR« zu ersetzen.
- source_word: מַאֲוַיֵּי
  choice: was er begehrt
  rationale: Die Wendung gibt die Wünsche oder Begierden des Frevlers in natürlichem modernem Deutsch wieder, ohne ihre Intensität unnötig zu steigern.
- source_word: רָשָׁע
  choice: dem Frevler
  rationale: Das singularische Substantiv bezeichnet hier einen schuldhaft und bösartig Handelnden. »Frevler« erhält sowohl den Singular als auch die ethisch-religiöse Färbung.
- source_word: זְמָמוֹ
  choice: seinen Plan
  rationale: Das Wort bezeichnet ein Vorhaben, hier im negativen Zusammenhang. »Plan« ist würdig und verständlich; die feindselige Absicht ergibt sich aus dem Kontext.
- source_word: תָּפֵק
  choice: lass … nicht gelingen
  rationale: Das schwierige Verb wird kontextgemäß als Bitte verstanden, Gott möge das Vorhaben nicht zum Erfolg kommen lassen. Eine Fußnote wahrt die lexikalische Unsicherheit.
- source_word: יָרֻמוּ
  choice: sie sich … überheben
  rationale: Die pluralische Verbform wird beibehalten. Das reflexive »sich überheben« vermittelt im Zusammenhang den Gedanken, durch Erfolg hochzukommen und hochmütig zu werden.
- source_word: סֶלָה
  choice: Sela
  rationale: Die Bedeutung des liturgisch-musikalischen Ausdrucks ist unsicher; daher wird er traditionell transkribiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der persönliche Gottesname bleibt als Name sichtbar; die im modernen Deutschen übliche Form ist »Jahwe«.
- issue: Numeruswechsel vom singularischen Frevler und seinem Plan zum pluralischen Verb
  choice: Plural »sie sich … überheben« beibehalten
  alternative: 'Zum Singular glätten: »damit er sich nicht überhebt«'
  rationale: Der masoretische Text wechselt tatsächlich in den Plural. Die Übersetzung bewahrt diese Spannung, die den Blick möglicherweise vom einzelnen Frevler auf seine Verbündeten oder die Frevler insgesamt erweitert.
- issue: Logische Beziehung des letzten Satzteils
  choice: 'Finalsatz: »damit sie sich nicht überheben«'
  alternative: 'Folgesatz: »sonst würden sie sich überheben«'
  rationale: Das Hebräische lässt die genaue Verknüpfung knapp und ohne ausdrücklich geschriebenes »damit nicht« stehen. Im Kontext gibt der Finalsatz die naheliegende Warnung wieder, ohne den Numeruswechsel zu beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Der Singular-Plural-Wechsel des hebräischen Textes bleibt sichtbar; »Sela« wird wegen seiner unsicheren Bedeutung unübersetzt gelassen.
