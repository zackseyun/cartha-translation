  text: שָׁמְרֵ֤/נִי יְהוָ֨ה מִ֘/ידֵ֤י רָשָׁ֗ע מֵ/אִ֣ישׁ חֲמָסִ֣ים תִּנְצְרֵ֑/נִי אֲשֶׁ֥ר חָ֝שְׁב֗וּ לִ/דְח֥וֹת פְּעָמָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/004.yaml
  text: Keep me[a], O Yahweh, from the hands of the wicked; guard me from the violent man[b], who has planned to trip up my feet.
translation:
  language: de
  text: Bewahre mich, Jahwe, vor den Händen des Frevlers[a]; behüte mich vor gewalttätigen Männern[b], die geplant haben, meine Schritte ins Wanken zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Singular kann einzeln verstanden werden: „vor den Händen eines Frevlers“; er kann aber auch eine Gruppe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vor einem Mann der Gewalttaten“. Das folgende Verb steht im Hebräischen im Plural: „die geplant haben“.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Bewahre mich
  rationale: Der Imperativ von שׁמר ist hier eine Bitte um Schutz. „Bewahre mich“ ist natürlich, würdevoll und lässt sich im Parallelismus von תִּנְצְרֵנִי unterscheiden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird transliteriert und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: מִידֵי רָשָׁע
  choice: vor der Gewalt der Frevler
  rationale: „Hand/Hände“ bezeichnet idiomatisch Macht oder Gewalt. Die Wiedergabe macht diese Bedeutung im Deutschen deutlich; der morphologische Singular רָשָׁע kann generisch beziehungsweise kollektiv verstanden werden.
- source_word: מֵאִישׁ חֲמָסִים
  choice: vor gewalttätigen Männern
  rationale: Wörtlich steht „vor einem Mann der Gewalttaten“. Der folgende Plural חָשְׁבוּ legt hier eine kollektiv-pluralische Wiedergabe nahe; חֲמָסִים bezeichnet intensive beziehungsweise wiederholte Gewalttätigkeit.
- source_word: תִּנְצְרֵנִי
  choice: beschütze mich
  rationale: נצר bezeichnet hier schützendes Behüten. „Beschütze“ bildet den synonymen Parallelismus ab, ohne „bewahren“ unnötig zu wiederholen.
- source_word: חָשְׁבוּ
  choice: die darauf sinnen
  rationale: חשב bezeichnet im feindseligen Kontext planendes, auf etwas gerichtetes Denken. „Darauf sinnen“ gibt die fortgesetzte böse Absicht prägnant wieder.
- source_word: לִדְחוֹת פְּעָמָי
  choice: meine Schritte ins Wanken zu bringen
  rationale: דחה bedeutet wegstoßen, verdrängen oder zu Fall bringen; פְּעָמָי kann „meine Schritte/Füße“ heißen. Die Formulierung bewahrt das Bewegungsbild und drückt die beabsichtigte Destabilisierung natürlich aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Transliteration wahrt den persönlichen Namen im Ausgangstext, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Numerus der feindlichen Person beziehungsweise Gruppe
  choice: 'kollektivischer Plural: „Frevler … gewalttätige Männer, die … sinnen“'
  alternative: 'Singular: „des Frevlers … vor einem gewalttätigen Mann, der … plant“'
  rationale: רָשָׁע und אִישׁ sind formal Singular, doch das Prädikat חָשְׁבוּ steht im Plural. Der Plural im Haupttext wahrt diese syntaktische Evidenz und versteht die Singularformen generisch; die mögliche individuelle Lesart wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus wird durch „bewahre“ und „beschütze“ hörbar. „Frevler“ ist leicht gehoben, aber im poetischen Gebet verständlich; „darauf sinnen“ bewahrt den poetischen Ton, ohne altertümlich zu wirken.
