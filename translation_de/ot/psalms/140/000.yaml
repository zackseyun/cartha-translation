  text: For the choirmaster. A psalm of David[a].
translation:
  language: de
  text: Für den Chorleiter. Ein Psalm Davids.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von David“ oder „für David“; die hebräische Überschrift kann Autorschaft, Zugehörigkeit, Verbindung oder Widmung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In Psalmüberschriften bezeichnet der Ausdruck wahrscheinlich den Leiter der musikalischen Aufführung. „Chorleiter“ ist im Deutschen klar, gebräuchlich und gibt die Funktion angemessen wieder; das Präfix ל wird überschriftentypisch mit „für“ wiedergegeben.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Das Substantiv ist hier die übliche Gattungsbezeichnung; „Psalm“ ist die etablierte und sachlich passende deutsche Entsprechung.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der deutsche Genitiv bewahrt in knapper, natürlicher Form die mögliche Beziehung zu David, ohne zwingend ausschließlich Autorschaft, Widmung oder Zugehörigkeit festzulegen.
theological_decisions:
- issue: Beziehung der Psalmüberschrift zu David
  choice: Davids
  alternative: von David; für David
  rationale: Die hebräische Präposition לְ kann in Psalmüberschriften Autorschaft, Zugehörigkeit, Verbindung oder Widmung ausdrücken. Der Genitiv „Davids“ lässt diese Beziehung bewusst offen und behauptet nicht mehr, als der hebräische Wortlaut erkennen lässt.
translation_notes:
  register: Knappe, würdige und im modernen Standarddeutsch natürliche Psalmüberschrift. Der traditionelle Ausdruck „Psalm Davids“ erhält die Mehrdeutigkeit des Hebräischen besser als eine ausdrücklich auf Autorschaft festgelegte Formulierung.
