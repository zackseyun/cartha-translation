  text: יְהִ֤י שְׁמ֨/וֹ לְֽ/עוֹלָ֗ם לִ/פְנֵי שֶׁמֶשׁ֮ ינין שְׁ֫מ֥/וֹ וְ/יִתְבָּ֥רְכוּ ב֑/וֹ כָּל גּוֹיִ֥ם יְאַשְּׁרֽוּ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/017.yaml
  text: May his name endure forever[a]; before the sun, may his name continue. May all nations be blessed in him[c][b]; may they call him blessed.
translation:
  language: de
  text: Sein Name bleibe für immer; vor der Sonne gedeihe sein Name[a]. In ihm mögen alle Nationen sich segnen[b]; sie mögen ihn glücklich preisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor der Sonne“. Die Wendung kann zeitlich verstanden werden: „solange die Sonne besteht“. Das seltene hebräische Verb kann „gedeihen“, „fortbestehen“, „wachsen“ oder „sich ausbreiten“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „In ihm mögen alle Nationen gesegnet werden“ beziehungsweise „durch ihn Segen finden“. Die hebräische Form kann reflexiv verstanden werden; dann bezeichnet sie das Sich-Segnen in beziehungsweise mit ihm als Segensformel.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי שְׁמוֹ לְעוֹלָם
  choice: Sein Name bleibe für immer
  rationale: Der Jussiv drückt einen Wunsch aus; „bleibe“ gibt ihn natürlich wieder und bewahrt „Name“ als Ausdruck für Ruf und fortdauernde Identität.
- source_word: לִפְנֵי שֶׁמֶשׁ
  choice: solange die Sonne besteht
  rationale: Wörtlich „vor der Sonne“; im poetischen Zusammenhang bezeichnet die Wendung wahrscheinlich die Dauer, solange die Sonne gegenwärtig ist. Die Bildsprache bleibt mit „Sonne“ erhalten.
- source_word: ינין
  choice: sprosse
  rationale: Das seltene Verb kann Fortbestand, Wachstum, Vermehrung oder Fortpflanzung andeuten. „sprosse“ bewahrt das lebendige Wachstumsbild, ohne es ausdrücklich biologisch festzulegen.
- source_word: וְיִתְבָּרְכוּ בוֹ
  choice: In ihm sollen sich alle Nationen Segen wünschen
  rationale: 'Die Hitpael-Form kann reflexiv verstanden werden: Die Nationen verwenden ihn als Maßstab oder Formel des Segens. Diese Wiedergabe erhält die Mehrdeutigkeit gegenüber einer passiven Deutung in der Fußnote.'
- source_word: כָּל גּוֹיִם
  choice: alle Nationen
  rationale: Im universal-königlichen Zusammenhang sind die Völker beziehungsweise Nationen der Welt gemeint; „Nationen“ entspricht dem Ausgangswort eng.
- source_word: יְאַשְּׁרוּהוּ
  choice: sie sollen ihn glücklich preisen
  rationale: Das Piel von אשר bedeutet, jemanden glücklich beziehungsweise gesegnet zu nennen. Die Formulierung unterscheidet dies sprachlich von ברך und ist in modernem Deutsch verständlich.
theological_decisions:
- issue: Königlicher und messianischer Horizont
  choice: Die Formulierung lässt den unmittelbaren Bezug auf den König und eine weiterreichende messianische Lesart offen.
  alternative: Den Vers entweder ausschließlich als Lob eines historischen Königs oder ausdrücklich und ausschließlich als messianische Prophezeiung formulieren.
  rationale: Der Text nennt keine ausdrückliche Identifikation. Seine universale Segenssprache und die Anklänge an die Verheißung an die Erzväter sollen jedoch erhalten bleiben.
- issue: Art des Segens der Nationen
  choice: Reflexive Wiedergabe im Haupttext mit passiver/mittlerer Deutung in der Fußnote.
  alternative: „In ihm sollen alle Nationen gesegnet werden.“
  rationale: Die Hitpael-Form erlaubt beide Verständnisse. Der Haupttext bildet ihre reflexive Gestalt ab, während die Fußnote die theologisch bedeutsame passive Lesart wahrt.
translation_notes:
  register: Modernes, würdevolles poetisches Deutsch. Die Wunschformen werden mit Konjunktiv I beziehungsweise „sollen“ wiedergegeben. „sprosse“ ist bewusst bildhaft und leicht gehoben; die Fußnoten sichern die echte lexikalische und syntaktische Mehrdeutigkeit.
