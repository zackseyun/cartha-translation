  naturalness: „von Tarschisch und den Inseln“ ist im heutigen Standarddeutsch syntaktisch nicht korrekt; „von Tarschisch und von den Inseln“ ist klar und natürlich. „Mögen“ gibt den poetisch-wünschenden Charakter der hebräischen Verbformen idiomatischer wieder als „sollen“.
  terminology: Tarschisch, Saba und Seba sind korrekt unterschieden. „Inseln“ ist als direkte Wiedergabe von אִיִּים vertretbar, auch wenn der hebräische Ausdruck je nach Kontext auch Küstenländer meinen kann. „Tribut“ und „Geschenke darbringen“ erhalten die lexikalische Differenzierung und den gehobenen poetischen Registerton.
