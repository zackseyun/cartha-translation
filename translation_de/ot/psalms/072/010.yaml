source:
  edition: WLC
  text: מַלְכֵ֬י תַרְשִׁ֣ישׁ וְ֭/אִיִּים מִנְחָ֣ה יָשִׁ֑יבוּ מַלְכֵ֥י שְׁבָ֥א וּ֝/סְבָ֗א אֶשְׁכָּ֥ר יַקְרִֽיבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/010.yaml
  text: May the kings of Tarshish and of the coastlands bring tribute; may the kings of Sheba and Seba present gifts.
translation:
  language: de
  text: Mögen die Könige von Tarschisch und von den Inseln Tribut bringen; mögen die Könige von Saba und Seba Geschenke darbringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַרְשִׁישׁ
  choice: Tarschisch
  rationale: Die traditionelle deutsche Wiedergabe des geografischen Namens bewahrt die Unbestimmtheit seiner genauen Lage.
- source_word: אִיִּים
  choice: Inseln
  rationale: Das Wort bezeichnet Inseln beziehungsweise Küstenländer; „Inseln“ ist die direkte, geläufige Wiedergabe und lässt den weiten geografischen Horizont erkennen.
- source_word: מִנְחָה
  choice: Tribut
  rationale: Im Zusammenhang mit Königen und königlicher Herrschaft bezeichnet die Gabe hier plausibel eine Huldigungsgabe beziehungsweise einen Tribut.
- source_word: שְׁבָא וּסְבָא
  choice: Saba und Seba
  rationale: Die ähnlich klingenden, aber im Hebräischen unterschiedenen Orts- oder Volksnamen werden auch im Deutschen klar auseinandergehalten.
- source_word: אֶשְׁכָּר
  choice: Geschenke
  rationale: Das seltene Wort bezeichnet eine Gabe beziehungsweise Abgabe; „Geschenke“ wahrt die bewusst allgemeinere Formulierung gegenüber dem vorherigen „Tribut“.
- source_word: יַקְרִיבוּ
  choice: darbringen
  rationale: Das Verb bedeutet heranbringen oder darbieten und kann kultische Nuancen tragen; „darbringen“ bewahrt diese Bedeutungsbreite.
theological_decisions:
- issue: Verbformen als Wunsch oder Zukunftsaussage
  choice: sollen … bringen / sollen … darbringen
  alternative: werden … bringen / werden … darbringen
  rationale: Die Jussivformen im Kontext des königlichen Gebets beziehungsweise Segens werden als Wunsch ausgedrückt, ohne sie in eine bloße Vorhersage umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und die Unterscheidung zwischen „Tribut“ und „Geschenke“ spiegeln die hebräische poetische Struktur.
