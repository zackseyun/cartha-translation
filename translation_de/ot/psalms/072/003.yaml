  text: May the mountains bring peace to the people[a], and the hills[c][b], in righteousness.
translation:
  language: de
  text: Mögen die Berge dem Volk[a] Frieden bringen und die Hügel ihn in Gerechtigkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für das Volk“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch Gerechtigkeit“; „Gerechtigkeit“ kann hier auch „Recht“ oder „gerechtes Handeln“ bezeichnen. Die zweite Vershälfte ist im Hebräischen verkürzt.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: Mögen … bringen
  rationale: נָשָׂא bedeutet wörtlich „heben, tragen“. Mit Bergen als Subjekt und Frieden als Objekt gibt „bringen“ den poetischen Sinn im Deutschen natürlich wieder. Die Präformativkonjugation wird im Gebets- und Segenszusammenhang als Wunsch verstanden.
- source_word: הָרִים
  choice: die Berge
  rationale: Entspricht dem bestimmten Plural und bewahrt das poetische Landschaftsbild.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: שָׁלוֹם umfasst auch Wohlergehen, Heil und gedeihliche Ganzheit; „Frieden“ ist hier die klare, traditionsnahe Wiedergabe, ohne den weiteren Bedeutungsumfang auszuschließen.
- source_word: לָעָם
  choice: dem Volk
  rationale: Der Dativ gibt die Ziel- beziehungsweise Nutznießerfunktion von ל idiomatisch wieder und lässt sich sowohl als „dem Volk“ als auch sinngemäß als „für das Volk“ verstehen.
- source_word: וּגְבָעוֹת
  choice: und die Hügel
  rationale: Bewahrt die ausdrückliche Konjunktion und den poetischen Parallelismus zu den Bergen.
- source_word: בִּצְדָקָה
  choice: durch Gerechtigkeit
  rationale: Die Präposition ב kann Mittel oder Art und Weise bezeichnen. „Durch Gerechtigkeit“ macht verständlich, auf welchem Weg der Friede kommt; צְדָקָה kann dabei sowohl Gerechtigkeit als auch gerechtes Handeln beziehungsweise Recht meinen.
theological_decisions:
- issue: Aussageweise der Präformativkonjugation im königlichen Gebetspsalm
  choice: 'Wunsch beziehungsweise Bitte: „Mögen … bringen“'
  alternative: 'Vorhersage: „Die Berge werden … bringen“'
  rationale: Der Zusammenhang von Psalm 72 legt eine Bitte oder Segensformel für die Herrschaft des Königs näher als eine bloße Zukunftsaussage.
- issue: Verhältnis der zweiten Vershälfte zur ersten
  choice: 'Das ausgesparte Verb und Objekt werden sinngemäß mitverstanden: Auch die Hügel bringen dem Volk Frieden, und zwar durch Gerechtigkeit.'
  alternative: „Die Hügel bringen Gerechtigkeit“
  rationale: Im Hebräischen steht vor צְדָקָה ausdrücklich die Präposition ב. Deshalb wird „Gerechtigkeit“ nicht stillschweigend zu einem direkten Objekt gemacht. Die knappe Ellipse und die Spannung zwischen Frieden und Gerechtigkeit bleiben erhalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die poetische Kürze des Hebräischen wird weitgehend bewahrt; „durch Gerechtigkeit“ ist im Deutschen verständlicher als das formal nähere, aber weniger natürliche „in Gerechtigkeit“. Sämtliche Fußnotenmarker stehen im Haupttext.
