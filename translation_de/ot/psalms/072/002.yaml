  text: יָדִ֣ין עַמְּ/ךָ֣ בְ/צֶ֑דֶק וַ/עֲנִיֶּ֥י/ךָ בְ/מִשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/002.yaml
  text: May he judge your people with righteousness[b][a], and your afflicted ones with justice.
translation:
  language: de
  text: Er richte dein Volk in Gerechtigkeit[a] und deine Bedrängten[b] nach dem Recht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er wird dein Volk in Gerechtigkeit richten.« Das hebräische Imperfekt kann hier als Wunsch oder als Zukunftsaussage verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »deine Armen« oder »deine Bedürftigen«. Das hebräische Wort kann wirtschaftlich Arme, Bedrängte oder Unterdrückte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדִין
  choice: Er richte
  rationale: Das Qal-Imperfekt 3. Person maskulin Singular kann hier Zukunft oder einen Wunsch ausdrücken. Im Gebetszusammenhang von Psalm 72 gibt der deutsche Konjunktiv I die bittende Bedeutung natürlich wieder, ohne den Bezug auf richterliches und königliches Entscheiden zu verwischen.
- source_word: עַמְּךָ
  choice: dein Volk
  rationale: עַם mit Suffix der 2. Person maskulin Singular bedeutet unmittelbar »dein Volk« und bewahrt den kollektiven sowie bundesbezogenen Sinn.
- source_word: בְצֶדֶק
  choice: in Gerechtigkeit
  rationale: צֶדֶק bezeichnet Gerechtigkeit, Rechtschaffenheit oder das Rechte. »In Gerechtigkeit« bewahrt die moralische Qualität seines Richtens und unterscheidet den Ausdruck von מִשְׁפָּט im zweiten Halbvers.
- source_word: וַעֲנִיֶּיךָ
  choice: und deine Bedrängten
  rationale: עָנִי kann Arme, Bedürftige, Bedrängte oder Unterdrückte bezeichnen. »Bedrängten« wahrt die soziale und leidensbezogene Breite, ohne den Begriff ausschließlich wirtschaftlich festzulegen.
- source_word: בְמִשְׁפָּט
  choice: nach dem Recht
  rationale: מִשְׁפָּט bezeichnet hier Recht, gerechtes Urteil oder Rechtsprechung. »Nach dem Recht« ist idiomatisches modernes Deutsch und bildet eine natürliche Parallele zu »in Gerechtigkeit«.
theological_decisions:
- issue: Wunschende oder zukünftige Bedeutung des eröffnenden Imperfekts
  choice: 'Als Gebetswunsch: »Er richte«'
  alternative: 'Als Zukunftsaussage: »Er wird … richten«'
  rationale: Der Psalm beginnt als Bitte für den König; daher liegt eine volitive Lesart nahe. Da das hebräische Imperfekt aber auch zukünftig verstanden werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Konjunktiv I »Er richte« trägt den Gebetscharakter knapp und verständlich. Die parallelen Wendungen »in Gerechtigkeit« und »nach dem Recht« erhalten die begriffliche Nähe von צֶדֶק und מִשְׁפָּט, ohne sie vollständig gleichzusetzen.
