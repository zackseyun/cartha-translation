base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/020.yaml
  text: The prayers of David son of Jesse are ended[a].
translation:
  language: de
  text: Die Gebete Davids, des Sohnes Isais, sind zu Ende.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sind abgeschlossen“ oder „haben ein Ende gefunden“.'
    reason: Lexikalische Alternativen für כָּלּוּ.
lexical_decisions:
- source_word: כָּלּוּ
  choice: sind zu Ende
  rationale: Das Pual Perfekt 3. Person Plural von כלה bezeichnet hier mit תְפִלּוֹת als Subjekt das Beendet- bzw. Abgeschlossen-Sein. „Sind zu Ende“ ist im modernen Deutsch natürlich und bewahrt den knappen Abschlusscharakter.
- source_word: תְפִלּוֹת
  choice: Gebete
  rationale: Die reguläre Pluralform von תְּפִלָּה bezeichnet Gebete; „Gebete“ gibt den schlichten lexikalischen Sinn und die mögliche Funktion als Schlussnotiz angemessen wieder.
- source_word: דָּוִד
  choice: David
  rationale: Der Personenname wird nach der etablierten deutschen Namensform wiedergegeben.
- source_word: בֶּן יִשָׁי
  choice: des Sohnes Isais
  rationale: Die hebräische Constructusverbindung kennzeichnet David durch seine Abstammung. Die Apposition „Davids, des Sohnes Isais“ ist im Deutschen eindeutig und würdevoll.
theological_decisions:
- issue: Funktion des Verses als Kolophon bzw. redaktionelle Schlussnotiz oder als Bestandteil des unmittelbaren Psalmgebets
  choice: Als schlichte Aussage wiedergeben, die das Ende der Gebete Davids markiert
  alternative: Ausdrücklich als spätere redaktionelle Schlussnotiz kennzeichnen
  rationale: Der hebräische Satz macht lediglich eine knappe Feststellung und legt seine entstehungsgeschichtliche Funktion nicht ausdrücklich fest. Die Übersetzung wahrt diese Offenheit, ohne eine weitergehende redaktionsgeschichtliche Deutung einzutragen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die Formulierung ist knapp gehalten, entsprechend dem Charakter einer abschließenden Notiz; die mögliche redaktionelle Funktion wird nicht eigens in den Text hineingedeutet.
