id: PSA.72.18
reference: Psalms 72:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בָּר֤וּךְ יְהוָ֣ה אֱ֭לֹהִים אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עֹשֵׂ֖ה נִפְלָא֣וֹת לְ/בַדּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/018.yaml
  text: Blessed be Yahweh God[a], the God of Israel, who alone does wondrous things.
translation:
  language: de
  text: Gepriesen sei Jahwe, Gott, der Gott Israels, der allein Wunder tut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Das passive Partizip steht in einer doxologischen Segensformel. „Gepriesen sei“ gibt deren liturgischen und performativen Sinn im heutigen Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים steht hier als nähere Bestimmung bei Jahwe; die direkte Wiedergabe „Gott“ bewahrt die knappe hebräische Fügung.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Status-constructus-Verbindung bezeichnet Israels Gott und wird formal wie idiomatisch direkt wiedergegeben.
- source_word: עֹשֵׂה
  choice: der ... tut
  rationale: Das Qal-Partizip beschreibt Gottes kennzeichnendes Handeln. Ein deutscher Relativsatz gibt diese Funktion natürlich wieder.
- source_word: נִפְלָאוֹת
  choice: Wunder
  rationale: Der Plural bezeichnet außergewöhnliche göttliche Taten; „Wunder“ ist die klare, geläufige und kontextgerechte deutsche Entsprechung.
- source_word: לְבַדּוֹ
  choice: allein
  rationale: 'Das adverbiale Wort betont die Ausschließlichkeit: Jahwe ist derjenige, der diese Wunder allein tut.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug und Aussagekraft von לְבַדּוֹ
  choice: der allein Wunder tut
  alternative: der aus eigener Kraft Wunder tut
  rationale: „Allein“ bewahrt die Ausschließlichkeit der hebräischen Aussage, ohne näher festzulegen, ob der Schwerpunkt darauf liegt, dass nur Gott Wunder tut, oder darauf, dass er sie ohne Mitwirkung vollbringt.
translation_notes:
  register: Moderne, würdige und gut verständliche doxologische Sprache. Die Apposition „Jahwe, Gott, der Gott Israels“ bleibt bewusst knapp und nahe an der hebräischen Struktur.
