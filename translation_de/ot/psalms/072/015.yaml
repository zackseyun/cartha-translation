base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/015.yaml
  text: May he live[a], and may gold from Sheba be given to him. May prayer be made for him continually[b]; all day long may they bless him.
translation:
  language: de
  text: Er lebe, und man gebe ihm Gold aus Saba[a]. Man bete allezeit für ihn[b]; den ganzen Tag segne man ihn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher ist die Verbform aktiv: „und er gebe ihm Gold aus Saba“. Wer gibt, wird im Hebräischen nicht ausdrücklich gesagt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und er bete allezeit für ihn“. Das Subjekt wird im Hebräischen nicht näher bestimmt.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „den ganzen Tag segne er ihn“. Das Hebräische nennt auch hier kein eindeutiges Subjekt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיחִי
  choice: Er lebe
  rationale: Der Jussiv des Verbs חיה drückt einen Wunsch oder Segen aus. Der deutsche Konjunktiv I gibt diese Wunschform knapp und würdig wieder.
- source_word: וְיִתֶּן לוֹ
  choice: und man gebe ihm
  rationale: Die hebräische Verbform ist aktiv und steht in der 3. Person Singular, nennt aber kein eindeutiges Subjekt. Das unpersönliche „man“ wahrt dies, ohne einen bestimmten Handelnden einzuführen.
- source_word: מִזְּהַב שְׁבָא
  choice: vom Gold aus Saba
  rationale: 'Die Präposition מִן bezeichnet hier Herkunft beziehungsweise einen Anteil: Ihm soll etwas von dem aus Saba stammenden Gold gegeben werden.'
- source_word: וְיִתְפַּלֵּל בַּעֲדוֹ
  choice: Man bete … für ihn
  rationale: Der Hitpael von פלל mit בְּעַד bedeutet, für jemanden oder zu seinen Gunsten zu beten. „Man“ erhält das im Hebräischen nicht näher bestimmte Subjekt.
- source_word: תָמִיד
  choice: allezeit
  rationale: Das Wort bezeichnet fortdauernde oder regelmäßig wiederkehrende Beständigkeit. „Allezeit“ passt zum gehobenen poetischen Register und bleibt verständlich.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Dies ist die natürliche moderne deutsche Wiedergabe der Zeitangabe.
- source_word: יְבָרֲכֶנְהוּ
  choice: segne man ihn
  rationale: Die Form ist ein Piel Imperfekt beziehungsweise Jussiv in der 3. Person Singular mit männlichem Objektsuffix. Das unpersönliche „man“ gibt die nicht ausdrücklich bezeichnete handelnde Person wieder.
theological_decisions:
- issue: Bezug der königlichen Bitten in Psalm 72
  choice: Der Vers bleibt als Wunsch und Gebet für den König formuliert, ohne den Bezug in der Übersetzung ausdrücklich messianisch festzulegen.
  alternative: Den Vers unmittelbar und ausschließlich als Weissagung über den Messias formulieren.
  rationale: Der unmittelbare hebräische Wortlaut enthält Segenswünsche für den König. Zugleich schließt diese Übersetzung eine weitergehende kanonische oder messianische Deutung nicht aus.
translation_notes:
  register: Moderne, würdige Psalmsprache. Die Konjunktivformen geben den jussivischen Wunschcharakter wieder; das unpersönliche „man“ bewahrt die mehrfach offenen Subjekte des hebräischen Textes.
