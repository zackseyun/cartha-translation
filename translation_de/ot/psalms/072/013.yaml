  variant: modern standard German
source:
  edition: WLC
  text: יָ֭חֹס עַל דַּ֣ל וְ/אֶבְי֑וֹן וְ/נַפְשׁ֖וֹת אֶבְיוֹנִ֣ים יוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/013.yaml
  text: He will have compassion on the poor and needy[a], and he will save the lives of the needy.
translation:
  language: de
  text: Er wird sich des Armen und Bedürftigen erbarmen und das Leben[a] der Bedürftigen retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Seelen“ beziehungsweise „die Personen“. Das hebräische Wort kann je nach Zusammenhang „Leben“, „Selbst“, „Person“ oder „Seele“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֹס
  choice: wird sich erbarmen
  rationale: Das Verb bezeichnet hier mitleidige, schonende Zuwendung zu Schutzbedürftigen. „Sich erbarmen“ ist im Deutschen natürlich und würdevoll und passt zum parallelen Retten.
- source_word: עַל
  choice: des
  rationale: Die Präposition bezeichnet das Ziel des Erbarmens; im Deutschen wird diese Beziehung idiomatisch durch den Genitiv bei „sich erbarmen“ ausgedrückt.
- source_word: דַּל
  choice: des Armen
  rationale: דַּל kann einen armen, schwachen oder gesellschaftlich machtlosen Menschen bezeichnen. „Der Arme“ gibt hier den sozialen und wirtschaftlichen Sinn klar wieder.
- source_word: אֶבְיוֹן
  choice: Bedürftigen
  rationale: „Bedürftig“ bewahrt die poetische Unterscheidung zu דַּל und bezeichnet einen Menschen, der auf Hilfe angewiesen ist.
- source_word: נַפְשׁוֹת
  choice: das Leben
  rationale: נֶפֶשׁ bezeichnet in diesem Zusammenhang am ehesten das konkrete Leben der Betroffenen. Der deutsche kollektive Singular „das Leben“ entspricht natürlichem Sprachgebrauch, obwohl das Hebräische den Plural verwendet.
- source_word: אֶבְיוֹנִים
  choice: der Bedürftigen
  rationale: Der Plural wird als substantiviertes deutsches Adjektiv wiedergegeben und bleibt lexikalisch mit dem vorausgehenden אֶבְיוֹן verbunden.
- source_word: יוֹשִׁיעַ
  choice: retten
  rationale: Der Hifil von ישׁע bezeichnet Rettung oder Befreiung. „Retten“ gibt hier die konkrete königliche Hilfe direkt wieder und bewahrt zugleich den breiteren biblischen Wortgebrauch.
theological_decisions:
- issue: Bedeutung von נַפְשׁוֹת für das Menschenbild
  choice: „das Leben“
  alternative: „die Seelen“ oder „die Personen“
  rationale: Im Zusammenhang königlichen Schutzes bezeichnet נֶפֶשׁ am natürlichsten das Leben beziehungsweise die Person der Bedürftigen. „Seelen“ könnte eine Leib-Seele-Trennung nahelegen, die der hebräische Ausdruck hier nicht verlangt; die Fußnote bewahrt jedoch die echte Bedeutungsbreite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Genitivkonstruktion „sich des … erbarmen“ ist leicht gehoben, aber allgemein verständlich und für den poetischen Kontext angemessen. Der Zukunftsaspekt der hebräischen Verbformen wird beibehalten.
