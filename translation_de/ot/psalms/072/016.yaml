source:
  edition: WLC
  text: יְהִ֤י פִסַּת בַּ֨ר בָּ/אָרֶץ֮ בְּ/רֹ֪אשׁ הָ֫רִ֥ים יִרְעַ֣שׁ כַּ/לְּבָנ֣וֹן פִּרְי֑/וֹ וְ/יָצִ֥יצוּ מֵ֝/עִ֗יר כְּ/עֵ֣שֶׂב הָ/אָֽרֶץ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/016.yaml
  text: May there be an abundance of grain in the land[a]; on the tops of the mountains may its fruit wave like Lebanon; and may people blossom from the city like the grass of the earth.
translation:
  language: de
  text: Möge es im Land Getreide in Fülle geben[a]; auf den Gipfeln der Berge möge seine Frucht wogen wie der Libanon; und aus der Stadt mögen Menschen hervorblühen wie das Gras der Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Möge es eine Handvoll Getreide im Land geben.« Die seltene hebräische Wendung kann entweder eine kleine Menge bezeichnen, die außergewöhnlich fruchtbar wird, oder einfach Getreide in Fülle.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  choice: Möge es … geben
  rationale: Der Jussiv von היה drückt in diesem königlichen Psalm einen Wunsch oder ein Gebet aus. Die Formulierung gibt diesen optativischen Sinn im Deutschen natürlich wieder.
- source_word: פִסַּת
  choice: in Fülle
  rationale: Das seltene Wort ist in seiner Bedeutung umstritten. Im Zusammenhang mit üppigem Wachstum liegt eine Fülle nahe; die mögliche Bedeutung »eine Handvoll« bleibt in der Fußnote erhalten.
- source_word: בַּר
  choice: Getreide
  rationale: בַּר bezeichnet hier Getreide beziehungsweise landwirtschaftlichen Ertrag; »Getreide« ist der passende allgemeine deutsche Ausdruck.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: Im Kontext des Segens über das Herrschaftsgebiet bezeichnet אֶרֶץ am ehesten das Land, nicht allgemein die Erde.
- source_word: בְּרֹאשׁ הָרִים
  choice: auf den Gipfeln der Berge
  rationale: Die Wendung wird bildnah wiedergegeben und unterstreicht die außergewöhnliche Fruchtbarkeit selbst in Höhenlagen.
- source_word: יִרְעַשׁ
  choice: möge … wogen
  rationale: Das Verb bezeichnet ein Beben oder heftiges Bewegen. Bezogen auf Frucht beziehungsweise Ertrag vermittelt »wogen« anschaulich die Bewegung üppiger Vegetation.
- source_word: כַּלְּבָנוֹן
  choice: wie der Libanon
  rationale: Der unmittelbare Vergleich bleibt erhalten; der Libanon ruft Größe und üppige Vegetation in Erinnerung, ohne dass dies erklärend in den Text eingetragen wird.
- source_word: פִּרְיוֹ
  choice: seine Frucht
  rationale: Die maskuline Singularform mit Suffix wird formal gewahrt und kollektiv auf das zuvor genannte Getreide bezogen.
- source_word: וְיָצִיצוּ
  choice: mögen Menschen hervorblühen
  rationale: Das Verb bedeutet »blühen, sprossen«. Der Plural hat im Hebräischen kein ausdrücklich genanntes Subjekt; wegen »aus der Stadt« werden deren Bewohner als implizites Subjekt verständlich gemacht, während »hervorblühen« die Pflanzenmetapher bewahrt.
- source_word: מֵעִיר
  choice: aus der Stadt
  rationale: Der hebräische Singular bleibt erhalten und kann die Stadt repräsentativ oder kollektiv bezeichnen.
- source_word: כְּעֵשֶׂב הָאָרֶץ
  choice: wie das Gras der Erde
  rationale: Die bildhafte Vergleichsformulierung wird eng am Hebräischen und zugleich verständlich wiedergegeben.
theological_decisions:
- issue: Deutung der seltenen Wendung פִסַּת בַּר
  choice: Getreide in Fülle
  alternative: eine Handvoll Getreide
  rationale: Das Gebet um reichen Segen und das folgende Bild üppig wogender Frucht stützen die Deutung als Fülle. Da »eine Handvoll Getreide« lexikalisch möglich ist und das Bild eines kleinen Anfangs mit außergewöhnlichem Ertrag ergeben kann, wird diese Lesart nicht ausgeschlossen, sondern in einer Fußnote genannt.
- issue: Unausgesprochenes Subjekt von וְיָצִיצוּ
  choice: Menschen
  alternative: sie
  rationale: Das hebräische Verb steht im Plural, nennt aber kein Subjekt. Die Herkunftsangabe »aus der Stadt« legt die Stadtbewohner nahe. »Menschen« macht den Sinn im Deutschen verständlich, ohne eine bestimmte Bevölkerungsgruppe oder theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wunschform »möge« bewahrt den Gebetscharakter; »wogen« und »hervorblühen« erhalten die poetischen Pflanzenbilder. Die seltene Wendung wird im Haupttext kontextgemäß und in der Fußnote mit ihrer echten lexikalischen Alternative wiedergegeben.
