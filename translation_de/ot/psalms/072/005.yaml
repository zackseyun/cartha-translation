source:
  edition: WLC
  text: יִֽירָא֥וּ/ךָ עִם שָׁ֑מֶשׁ וְ/לִ/פְנֵ֥י יָ֝רֵ֗חַ דּ֣וֹר דּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/005.yaml
  text: May they fear you as long as the sun endures[a], and before the moon[c][b], through all generations.
translation:
  language: de
  text: Mögen sie dich fürchten, solange die Sonne besteht und solange der Mond bleibt, von Generation zu Generation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie werden dich fürchten.“ Wörtlich lautet die Zeitangabe: „mit der Sonne und vor dem Mond“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִירָאוּךָ
  choice: Mögen sie dich fürchten
  rationale: Die Form von ירא kann hier als Wunsch bzw. Gebet oder als zukunftsbezogene Aussage verstanden werden. „Fürchten“ bewahrt den Bedeutungsumfang zwischen Furcht und ehrfürchtiger Scheu.
- source_word: עִם־שָׁמֶשׁ
  choice: solange die Sonne besteht
  rationale: Wörtlich „mit der Sonne“; zusammen mit dem Himmelskörper bezeichnet die Wendung eine Dauer. Die idiomatische deutsche Fassung macht diesen Zeitsinn deutlich.
- source_word: וְלִפְנֵי־יָרֵחַ
  choice: und solange der Mond bleibt
  rationale: Wörtlich „und vor dem Mond“. Im Parallelismus zur Sonne drückt die Wendung fortdauernde Zeit aus; die idiomatische Wiedergabe vermeidet im Deutschen die missverständliche räumliche Lesart.
- source_word: דּוֹר דּוֹרִים
  choice: von Generation zu Generation
  rationale: Die Verbindung aus Singular und Plural hebt die fortlaufende Abfolge der Generationen hervor. Die deutsche Wendung erhält diese Wiederholungswirkung.
theological_decisions:
- issue: Subjekt und Bezug der Anrede „dich“ im königlichen Psalm
  choice: Die direkte Anrede bleibt ohne ausdrückliche Bestimmung ihres Bezugs erhalten.
  alternative: Den König beziehungsweise den davidischen Herrscher oder Gott ausdrücklich als Bezug nennen.
  rationale: Der hebräische Text nennt nur „dich“. So bleibt die mögliche Spannung zwischen königlichem und göttlichem Bezug bestehen.
- issue: Modalität von יִירָאוּךָ
  choice: 'Als Wunsch bzw. Gebet: „Mögen sie dich fürchten“.'
  alternative: 'Als zukunftsbezogene Aussage: „Sie werden dich fürchten“.'
  rationale: Im Kontext ist eine jussivische Lesart gut möglich, doch die Verbform ist nicht eindeutig. Die Alternative wird deshalb in der Fußnote bewahrt.
translation_notes:
  register: Moderne, würdevolle Psalmsprache. Die beiden parallelen Zeitangaben werden im Haupttext idiomatisch und symmetrisch wiedergegeben; ihre wörtliche Gestalt sowie die modale Mehrdeutigkeit stehen in der Fußnote.
