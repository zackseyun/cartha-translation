id: PSA.72.0
reference: Psalms 72:0
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לִ/שְׁלֹמֹ֨ה אֱֽלֹהִ֗ים מִ֭שְׁפָּטֶי/ךָ לְ/מֶ֣לֶךְ תֵּ֑ן וְ/צִדְקָתְ/ךָ֥ לְ/בֶן מֶֽלֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/000.yaml
  text: Of Solomon.[a] O God, give your justice to the king, and your righteousness[b] to the king's son.
translation:
  language: de
  text: Von Salomo.[a] Gott, gib dem König deine Rechtsentscheide und dem Königssohn deine Gerechtigkeit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für Salomo“ beziehungsweise „An Salomo“; die Überschrift ist mehrdeutig.'
    reason: alternative_reading
  - marker: b
    text: „Deine Gerechtigkeit“ kann hier auch mit „dein gerechtes Handeln“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: Von Salomo
  rationale: Die Präposition לְ in Psalmüberschriften kann Zugehörigkeit bzw. Autorschaft, Widmung oder Bestimmung ausdrücken. „Von Salomo“ ist im Haupttext natürlich und traditionell, ohne die Alternativen auszuschließen.
- source_word: מִשְׁפָּטֶיךָ
  choice: deine Rechtsentscheide
  rationale: Der Plural bezeichnet hier Gottes Maßstäbe bzw. Urteile für gerechtes Regieren. „Rechtsentscheide“ wahrt den Plural und unterscheidet das Wort von צְדָקָה.
- source_word: צִדְקָתְךָ
  choice: deine Gerechtigkeit
  rationale: Die Wiedergabe bewahrt den theologischen und ethischen Gehalt von צְדָקָה und die Parallelität mit Gottes Rechtsentscheiden.
- source_word: לְבֶן־מֶלֶךְ
  choice: dem Königssohn
  rationale: Die knappe Zusammensetzung entspricht der hebräischen Statusbezeichnung und lässt offen, ob derselbe Herrscher oder ein Thronfolger gemeint ist.
theological_decisions:
- issue: Verhältnis zwischen „dem König“ und „dem Königssohn“
  choice: Die parallelen Bezeichnungen werden unverändert nebeneinandergestellt.
  alternative: Beide ausdrücklich auf dieselbe Person beziehen oder den Königssohn als Thronfolger bestimmen.
  rationale: Der hebräische Parallelismus erlaubt, aber erzwingt keine Identifikation; die Übersetzung soll diese Offenheit bewahren.
- issue: Gottes Gerechtigkeit als königliche Gabe
  choice: 'Das Possessivpronomen bleibt bei beiden Begriffen erhalten: „deine Rechtsentscheide“ und „deine Gerechtigkeit“.'
  alternative: Allgemein „Recht und Gerechtigkeit“ formulieren.
  rationale: Der Text hebt hervor, dass gerechtes Regieren aus Gottes eigener Rechtsordnung und Gerechtigkeit stammt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Anrede „Gott“ steht ohne zusätzliches „O“, da dies im heutigen Deutschen natürlicher klingt. Der Parallelismus und die beiden unterschiedlichen hebräischen Rechtsbegriffe bleiben erkennbar.
