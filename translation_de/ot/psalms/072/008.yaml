id: PSA.72.8
reference: Psalms 72:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ֭/יֵרְדְּ מִ/יָּ֣ם עַד יָ֑ם וּ֝/מִ/נָּהָ֗ר עַד אַפְסֵי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/008.yaml
  text: May he rule from sea to sea[b][a], and from the River to the ends of the earth.
translation:
  language: de
  text: Er herrsche von Meer zu Meer[a] und vom Strom[b] bis an die Enden der Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er wird von Meer zu Meer herrschen und vom Strom bis an die Enden der Erde.«'
    reason: alternative_reading
  - marker: b
    text: Mit »dem Strom« ist wahrscheinlich der Euphrat gemeint, eine gebräuchliche geografische Grenzbezeichnung in der Bibel.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: Er herrsche
  rationale: Die Form von רדה bezeichnet Herrschaft und kann im Zusammenhang des königlichen Gebets einen Wunsch ausdrücken. Der deutsche Konjunktiv I gibt diesen volitiven Sinn knapp und würdig wieder.
- source_word: מִיָּם עַד יָם
  choice: von Meer zu Meer
  rationale: Die geläufige poetische Wendung bewahrt den Merismus und die umfassende geografische Weite, ohne bestimmte Meere festzulegen.
- source_word: וּמִנָּהָר
  choice: und vom Strom
  rationale: Das absolut gebrauchte נָהָר bezeichnet in biblischer Geografie wahrscheinlich den Euphrat. „Strom“ bewahrt die nicht ausdrücklich genannte Identifizierung; die Fußnote erläutert den wahrscheinlichen Bezug.
- source_word: עַד אַפְסֵי אָרֶץ
  choice: bis an die Enden der Erde
  rationale: Die Wendung gibt die äußersten Grenzen beziehungsweise fernsten Bereiche der Erde natürlich und poetisch wieder.
theological_decisions:
- issue: Aussageweise des Imperfekts/Jussivs in einem Königspsalm
  choice: 'Als Wunsch beziehungsweise Bitte: „Er herrsche“'
  alternative: 'Als zukünftige oder zugesicherte Aussage: „Er wird herrschen“'
  rationale: Der Gebetszusammenhang stützt die jussive Lesart. Die mögliche Zukunftsaussage bleibt in einer Fußnote erhalten, sodass die Spannung zwischen Bitte und Verheißung nicht aufgelöst wird.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdig-poetischem Klang. Die knappe Parallelstruktur des Hebräischen bleibt erhalten; „herrsche“ wahrt den Gebetscharakter, ohne die mögliche prophetische Lesart auszuschließen.
