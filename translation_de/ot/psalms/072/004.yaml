  text: יִשְׁפֹּ֤ט עֲֽנִיֵּי עָ֗ם י֭וֹשִׁיעַ לִ/בְנֵ֣י אֶבְי֑וֹן וִֽ/ידַכֵּ֣א עוֹשֵֽׁק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/004.yaml
  text: May he judge the poor of the people[a], save the children of the needy, and crush the oppressor.
translation:
  language: de
  text: Er schaffe den Armen des Volkes Recht[a], rette die Kinder der Bedürftigen und zerschmettere den Unterdrücker.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wird den Armen des Volkes Recht schaffen, die Kinder der Bedürftigen retten und den Unterdrücker zerschmettern.“ Die hebräischen Verbformen können in diesem Zusammenhang als Zukunftsaussage oder als Gebet beziehungsweise Wunsch verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: er schaffe … Recht
  rationale: Das Qal-Imperfekt von שׁפט bezeichnet hier königliches Richten mit dem Ziel, den Benachteiligten Recht zu verschaffen. Die Wunschform „er schaffe“ gibt im Kontext des Königsgebets die jussivische Nuance wieder.
- source_word: עֲנִיֵּי עָם
  choice: den Armen im Volk
  rationale: עֲנִיִּים kann Arme, Bedrängte oder Unterdrückte bezeichnen. Der Parallelismus mit den Bedürftigen legt soziale Not nahe; „im Volk“ gibt die Zugehörigkeit im Deutschen natürlich wieder.
- source_word: יוֹשִׁיעַ
  choice: rette
  rationale: Das Hifil von ישׁע bedeutet retten oder befreien. „Rette“ bewahrt den kräftigen Sinn konkreter Hilfe aus Not.
- source_word: לִבְנֵי אֶבְיוֹן
  choice: die Kinder der Bedürftigen
  rationale: בני ist eine kollektive Bezeichnung für Kinder bzw. Nachkommen und nicht auf Söhne beschränkt. „Bedürftige“ unterscheidet אֶבְיוֹן sprachlich vom vorausgehenden עֲנִיִּים.
- source_word: וִידַכֵּא
  choice: und zerschmettere
  rationale: דכא bezeichnet ein Zermalmen oder Zerschlagen. „Zerschmettere“ erhält die drastische Stärke des Bildes und bildet einen deutlichen Gegensatz zur Rettung der Bedürftigen.
- source_word: עוֹשֵׁק
  choice: den Unterdrücker
  rationale: Das Partizip von עשׁק bezeichnet jemanden, der andere bedrückt oder ausbeutet. „Unterdrücker“ ist prägnant und im Deutschen geläufig.
theological_decisions:
- issue: Aussageweise der Verben im Vers
  choice: Wunsch bzw. Gebet („Er schaffe …, rette … und zerschmettere …“)
  alternative: Einfache Zukunft („Er wird …“)
  rationale: Die hebräischen Imperfektformen können hier zukünftig oder jussivisch verstanden werden. Im Gebets- und Segenszusammenhang von Psalm 72 ist die Wunschform naheliegend; die Fußnote hält die echte Mehrdeutigkeit offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Recht schaffen“ vermittelt die königliche richterliche Tätigkeit natürlicher als das möglicherweise missverständliche „richten“. Die kräftige Bildsprache von „zerschmettern“ bleibt erhalten.
