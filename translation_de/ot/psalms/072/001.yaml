  source_fidelity: Die Übersetzung gibt die Überschrift לִשְׁלֹמֹה mit „Von Salomo“ angemessen wieder und bewahrt die anderen möglichen Beziehungen („Für/An Salomo“) in der Fußnote. Die direkte Anrede Gottes, der Imperativ und die beiden Dativobjekte entsprechen dem hebräischen Satzbau und Sinn. „Rechtssprüche“ bildet den konkreten Plural מִשְׁפָּטֶיךָ nachvollziehbar ab; „Gerechtigkeit“ wahrt die Breite von צְדָקָה.
