  text: לִ/שְׁלֹמֹ֨ה אֱֽלֹהִ֗ים מִ֭שְׁפָּטֶי/ךָ לְ/מֶ֣לֶךְ תֵּ֑ן וְ/צִדְקָתְ/ךָ֥ לְ/בֶן מֶֽלֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/001.yaml
  text: Of Solomon[a]. O God, give your judgments to the king[b], and your righteousness to the king’s son.
translation:
  language: de
  text: Von Salomo[a]. Gott, gib dem König deine Rechtssprüche und dem Königssohn deine Gerechtigkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für Salomo“ oder „An Salomo“; so kann die Überschrift ebenfalls verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: „Gerechtigkeit“ kann hier auch mit „Recht“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: Von Salomo
  rationale: Das vorangestellte ל in Psalmüberschriften kann Urheberschaft, Widmung oder Zuordnung ausdrücken. „Von Salomo“ entspricht dem üblichen deutschen Überschriftenstil; die anderen möglichen Beziehungen werden in der Fußnote bewahrt.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv steht als direkte Anrede. Im Deutschen macht die Kommasetzung den Vokativ hinreichend deutlich; ein zusätzliches „O“ wäre möglich, klänge aber stärker altertümlich.
- source_word: מִשְׁפָּטֶיךָ
  choice: deine Rechtssprüche
  rationale: Der konkrete Plural bezeichnet hier Gottes richterliche Entscheidungen beziehungsweise Maßstäbe. „Rechtssprüche“ bewahrt sowohl die Mehrzahl als auch den königlich-rechtsprechenden Zusammenhang.
- source_word: לְמֶלֶךְ
  choice: dem König
  rationale: Der Dativ bezeichnet den Empfänger der erbetenen Gabe natürlich und knapp.
- source_word: תֵּן
  choice: gib
  rationale: Der Imperativ wird mit der direkten und allgemein verständlichen Entsprechung wiedergegeben.
- source_word: וְצִדְקָתְךָ
  choice: und deine Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt die moralische wie auch die rechtliche Weite von צְדָקָה, ohne den Ausdruck allein auf Rechtsprechung einzuengen.
- source_word: לְבֶן־מֶלֶךְ
  choice: dem Königssohn
  rationale: Das deutsche Kompositum gibt die hebräische Status-constructus-Verbindung knapp und wörtlich wieder und lässt offen, ob der Thronfolger oder parallel dazu der König in dynastischer Hinsicht gemeint ist.
theological_decisions:
- issue: Identität des „Königs“ und des „Königssohns“
  choice: Die unmittelbare königliche Gebetssprache bleibt ohne ausdrückliche messianische Festlegung erhalten.
  alternative: Der Vers kann speziell auf Salomo oder in dynastisch-messianischer Perspektive auf den idealen davidischen König bezogen werden.
  rationale: Der hebräische Wortlaut entscheidet nicht, ob ausschließlich Salomo, ein davidischer König allgemein oder typologisch der Messias gemeint ist. Die wörtliche Königssprache bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Gebetsform und der Parallelismus des Hebräischen bleiben erhalten; unnötig altertümliche Anredeformen werden vermieden.
