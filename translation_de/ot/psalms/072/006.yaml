source:
  edition: WLC
  text: יֵ֭רֵד כְּ/מָטָ֣ר עַל גֵּ֑ז כִּ֝/רְבִיבִ֗ים זַרְזִ֥יף אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/006.yaml
  text: May he come down like rain on mown grass[c][b][a], like showers that water the earth.
translation:
  language: de
  text: Er komme herab wie Regen auf gemähtes Gras[a], wie Regenschauer, die das Land benetzen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf abgeschnittenes Gras“. Das hebräische Wort bezeichnet etwas Abgeschnittenes oder Geschorenes und kann auch „geschorene Wolle“ bedeuten; hier liegt wegen des Bildes von Regen und Land „gemähtes Gras“ näher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Er wird herabkommen wie Regen auf gemähtes Gras, wie Regenschauer, die den Erdboden (oder: die Erde) benetzen.“ Die hebräische Verbform kann hier als Wunsch oder als Zukunftsaussage verstanden werden; אָרֶץ kann „Land“, „Erdboden“ oder „Erde“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרֵד
  choice: Er komme herab
  rationale: Das Imperfekt von ירד kann hier im Zusammenhang des königlichen Segens als Wunsch verstanden werden. Der deutsche Konjunktiv I gibt diesen Wunsch würdig und knapp wieder, ohne die mögliche Zukunftsaussage auszuschließen; diese wird in der Fußnote genannt.
- source_word: כְּמָטָר
  choice: wie Regen
  rationale: Die Vergleichspartikel כ mit מָטָר ergibt unmittelbar „wie Regen“.
- source_word: עַל
  choice: auf
  rationale: Die Präposition bezeichnet hier das Ziel beziehungsweise die Fläche, auf die der Regen fällt.
- source_word: גֵּז
  choice: gemähtes Gras
  rationale: גֵּז bezeichnet Abgeschnittenes oder Geschorenes. Im Zusammenhang mit Regen und Land ist gemähtes Gras die naheliegende landwirtschaftliche Deutung; „geschorene Wolle“ bleibt lexikalisch möglich und wird in der Fußnote vermerkt.
- source_word: כִּרְבִיבִים
  choice: wie Regenschauer
  rationale: רְבִיבִים bezeichnet ergiebige Regengüsse oder Schauer. „Regenschauer“ bewahrt die poetische Parallele zu „Regen“ und ist im Deutschen eindeutig.
- source_word: זַרְזִיף
  choice: die … benetzen
  rationale: Die seltene Form beschreibt ein Tröpfeln oder Niederrieseln. Die verbale Wiedergabe ergibt natürliches Deutsch, ohne die Intensität zu überzeichnen.
- source_word: אָרֶץ
  choice: das Land
  rationale: אָרֶץ kann Erde, Land oder Boden bedeuten. Im landwirtschaftlichen Bild ist „das Land“ natürlich und lässt sowohl die Fläche als auch den Erdboden anklingen.
theological_decisions:
- issue: Aussageweise des Imperfekts im königlichen Gebets- und Segenskontext
  choice: 'Wunsch: „Er komme herab“'
  alternative: 'Zukunftsaussage: „Er wird herabkommen“'
  rationale: Psalm 72 ist von Bitten und Segenswünschen für den König geprägt. Daher liegt eine jussivische Lesart nahe. Da die hebräische Form zugleich als Zukunftsaussage verstanden werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit poetischem Parallelismus. Der Konjunktiv „Er komme“ trägt den Gebets- und Segenscharakter; seltene oder mehrdeutige hebräische Ausdrücke werden verständlich wiedergegeben und in den Fußnoten offengelegt.
