  text: וְ/יִשְׁתַּחֲווּ ל֥/וֹ כָל מְלָכִ֑ים כָּל גּוֹיִ֥ם יַֽעַבְדֽוּ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/011.yaml
  text: May all kings bow down before him[a]; may all nations serve him.
translation:
  language: de
  text: Mögen alle Könige sich vor ihm niederwerfen[a]; mögen alle Völker ihm dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihn anbeten«; sowohl »sich vor ihm niederwerfen« als auch »ihm dienen« können im Hebräischen neben königlicher Huldigung religiöse Anklänge haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁתַּחֲווּ
  choice: sollen sich ... niederwerfen
  rationale: Das Verb bezeichnet das Sich-Niederwerfen oder Verbeugen als Geste der Ehrerbietung. Im königlichen Zusammenhang bewahrt »sich niederwerfen« den körperlichen und höfischen Sinn, ohne die Handlung vorschnell ausdrücklich als Anbetung festzulegen. Die Imperfektform wird im Kontext als Wunsch beziehungsweise Aufforderung wiedergegeben.
- source_word: לוֹ
  choice: vor ihm
  rationale: Die Präposition ל bezeichnet hier die Person, der die Ehrerbietung gilt; im Deutschen ist »sich vor ihm niederwerfen« die natürliche Wendung.
- source_word: כָל מְלָכִים
  choice: alle Könige
  rationale: Die direkte Wiedergabe erhält den umfassenden Geltungsanspruch.
- source_word: כָל גּוֹיִם
  choice: alle Völker
  rationale: גּוֹיִם bezeichnet hier parallel zu den Königen die Völker beziehungsweise Nationen der Welt. »Völker« ist im poetischen Deutsch natürlich und vermeidet die hier unpassende ethnisch-religiöse Verengung auf »Heiden«.
- source_word: יַעַבְדוּהוּ
  choice: sollen ihm dienen
  rationale: עבד bedeutet grundlegend »dienen«, kann aber je nach Zusammenhang auch religiösen Dienst bezeichnen. »Ihm dienen« bewahrt im königlichen Psalm sowohl die politische als auch die mögliche religiöse Bedeutungsdimension.
theological_decisions:
- issue: Ob die Ehrerbietung gegenüber dem König ausdrücklich als Anbetung bezeichnet werden soll
  choice: Die umfassenderen Formulierungen »sich vor ihm niederwerfen« und »ihm dienen« werden beibehalten.
  alternative: Eines oder beide Verben mit »ihn anbeten« wiedergeben.
  rationale: Psalm 72 ist ein Königspsalm. Die hebräischen Verben können königliche Huldigung und zugleich religiöse Untertöne tragen. Eine ausdrückliche Wiedergabe als »anbeten« würde die politische und mögliche theologische Spannung stärker festlegen, als es der hebräische Wortlaut verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit parallelem Satzbau. »Sich niederwerfen« ist verständlich und bewahrt die konkrete Geste der Huldigung; »Völker« entspricht dem poetischen Register des Psalms.
