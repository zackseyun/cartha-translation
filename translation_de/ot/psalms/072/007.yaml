  text: יִֽפְרַח בְּ/יָמָ֥י/ו צַדִּ֑יק וְ/רֹ֥ב שָׁ֝ל֗וֹם עַד בְּלִ֥י יָרֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/007.yaml
  text: In his days the righteous will flourish[d][c][b][a], and there will be an abundance of peace until the moon is no more.
translation:
  language: de
  text: In seinen Tagen wird der Gerechte[a] aufblühen, und Frieden[b] wird in Fülle sein, bis der Mond nicht mehr da ist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Der Gerechte“ kann eine einzelne gerechte Person, möglicherweise den König, oder allgemein die Gerechten bezeichnen.
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort für „Frieden“ kann auch Wohlergehen, Heil, Ganzheit oder Gedeihen umfassen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „bis kein Mond mehr ist“; das poetische Bild bezeichnet eine äußerst lange, fortdauernde Zeit.'
    reason: cultural_note
lexical_decisions:
- source_word: יִפְרַח
  choice: wird … aufblühen
  rationale: Das Verb פרח bezeichnet das Sprossen, Blühen oder Gedeihen. „Aufblühen“ bewahrt das poetische Pflanzenbild und ist im Deutschen auch übertragen gut verständlich.
- source_word: בְּיָמָיו
  choice: In seinen Tagen
  rationale: Die Wendung entspricht dem hebräischen Ausdruck eng und bezeichnet im Zusammenhang die Regierungszeit des Königs.
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Die Form ist grammatisch singular. „Der Gerechte“ bewahrt diesen Befund und kann im Deutschen sowohl eine einzelne gerechte Person als auch einen repräsentativen beziehungsweise generischen Typ bezeichnen.
- source_word: וְרֹב שָׁלוֹם
  choice: und Frieden wird in Fülle sein
  rationale: רֹב bezeichnet Fülle oder Überfluss. Das im Hebräischen nicht ausgedrückte Verb „sein“ wird für einen natürlichen deutschen Satz ergänzt, während die nominale Vorstellung „Frieden in Fülle“ erhalten bleibt.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: „Frieden“ ist hier die naheliegende und transparente Wiedergabe; die umfassenderen Bedeutungsanteile von Wohlergehen, Heil und Ganzheit werden in einer Fußnote genannt.
- source_word: עַד בְּלִי יָרֵחַ
  choice: bis der Mond nicht mehr ist
  rationale: Die Übersetzung bleibt nahe bei dem poetischen Bild des Hebräischen und vermeidet es, die zeitliche Aussage vorschnell als bloßes „für immer“ auszudeuten.
theological_decisions:
- issue: Bezug und Umfang von צַדִּיק im Königspsalm
  choice: „der Gerechte“ im Singular, mit offengehaltenem generischem beziehungsweise kollektivem Sinn
  alternative: „die Gerechten“ als ausdrücklich kollektive Wiedergabe oder „der gerechte König“ als Bezug auf den Herrscher
  rationale: Der hebräische Ausdruck ist singular, kann aber generisch oder kollektiv gebraucht sein. Der Vers legt nicht eindeutig fest, ob der König selbst oder gerechte Menschen unter seiner Herrschaft gemeint sind. Die Übersetzung wahrt deshalb den Singular und erläutert die Mehrdeutigkeit, ohne eine engere messianische oder kollektive Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem poetischem Bild. Die Satzergänzung „wird … sein“ macht die hebräische Nominalkonstruktion natürlich verständlich, ohne ihren Sinn zu erweitern.
