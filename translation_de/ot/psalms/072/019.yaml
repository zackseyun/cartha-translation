  yaml_path: translation/ot/psalms/072/019.yaml
  text: And blessed be his glorious name forever[a], and may his glory fill the whole earth[b]. Amen and amen.
translation:
  language: de
  text: Und gepriesen sei sein herrlicher Name für immer[a], und seine Herrlichkeit erfülle die ganze Erde[b]. Amen und Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der Name seiner Herrlichkeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das ganze Land“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: Und gepriesen sei
  rationale: Das passive Partizip steht hier als doxologische Segensformel mit Wunschcharakter. „Gepriesen sei“ bewahrt sowohl die liturgische Kraft als auch die natürliche deutsche Ausdrucksweise.
- source_word: שֵׁם כְּבוֹדוֹ
  choice: sein herrlicher Name
  rationale: Die Status-constructus-Verbindung bedeutet wörtlich „Name seiner Herrlichkeit“. Die adjektivische Wiedergabe ist im Deutschen natürlich und lässt erkennen, dass der Name durch Herrlichkeit gekennzeichnet ist.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Formulierung gibt die unbegrenzte zeitliche Dauer klar und in modernem Deutsch wieder.
- source_word: וְיִמָּלֵא
  choice: und … erfülle
  rationale: Der Nifal-Imperfekt wird im doxologischen Zusammenhang am besten als Jussiv verstanden. Der deutsche Konjunktiv I gibt den Wunschcharakter knapp und würdig wieder; trotz der ungewöhnlichen Nifal-Form weist אֶת die ganze Erde als betroffenes Objekt aus.
- source_word: כְבוֹדוֹ
  choice: seine Herrlichkeit
  rationale: „Herrlichkeit“ entspricht dem doxologischen und weltumspannenden Zusammenhang von כָּבוֹד besser als die möglichen Wiedergaben „Ehre“ oder „Majestät“.
- source_word: אֶת כֹּל הָאָרֶץ
  choice: die ganze Erde
  rationale: אֶת kennzeichnet das Objekt, und כֹּל bezeichnet dessen Gesamtheit. Im Kontext der universalen Perspektive des Psalms ist „Erde“ gegenüber dem örtlicher klingenden „Land“ vorzuziehen.
- source_word: אָמֵן וְאָמֵן
  choice: Amen und Amen
  rationale: Die vertraute Transliteration bewahrt die doppelte liturgische Bekräftigung und den feierlichen Abschluss.
theological_decisions:
- issue: Reichweite von הָאָרֶץ
  choice: die ganze Erde
  alternative: das ganze Land
  rationale: Die weltweite Perspektive des Königspsalms und die Aussage über Gottes Herrlichkeit sprechen hier für die universale Bedeutung „Erde“, ohne die lexikalisch mögliche Bedeutung „Land“ zu verschweigen.
- issue: Aussagemodus von וְיִמָּלֵא
  choice: 'Wunsch: „erfülle“'
  alternative: 'Feststellung oder Vorhersage: „wird erfüllen“'
  rationale: Der doxologische Zusammenhang und die parallele Segensformel legen einen jussivischen Wunsch nahe. Der Konjunktiv bewahrt diese Gebets- und Wunschspannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit liturgischem Klang. Der Konjunktiv „erfülle“ vermeidet eine erklärende Umschreibung mit „möge“ und erhält die knappe poetische Form. Sämtliche Fußnotenmarker stehen im Haupttext.
