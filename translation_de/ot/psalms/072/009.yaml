id: PSA.72.9
reference: Psalms 72:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְ֭/פָנָי/ו יִכְרְע֣וּ צִיִּ֑ים וְ֝/אֹיְבָ֗י/ו עָפָ֥ר יְלַחֵֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/009.yaml
  text: Before him the desert dwellers will bow down[a], and his enemies will lick the dust.
translation:
  language: de
  text: Vor ihm werden sich die Wüstenbewohner[a] niederbeugen, und seine Feinde werden den Staub lecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „die Wüstenstämme“; das hebräische Wort צִיִּים kann Bewohner von Wüstengebieten bezeichnen, in manchen Zusammenhängen auch Tiere der Wildnis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: Vor ihm
  rationale: Die Verbindung mit פָּנִים bedeutet idiomatisch „vor ihm“ beziehungsweise „in seiner Gegenwart“. „Vor ihm“ ist im Deutschen natürlich und bewahrt den räumlich-relationalen Sinn.
- source_word: יִכְרְעוּ
  choice: werden sich niederbeugen
  rationale: כרע bezeichnet das Niederknien oder Sich-Niederbeugen. Im Zusammenhang königlicher Unterwerfung ist „sich niederbeugen“ idiomatisch und treffend.
- source_word: צִיִּים
  choice: die Wüstenbewohner
  rationale: Das schwierige Wort kann Bewohner von Wüstengebieten, in anderen Zusammenhängen aber auch Wüstentiere bezeichnen. Parallel zu „seine Feinde“ liegt hier ein menschlicher Bezug nahe; „Wüstenbewohner“ legt keine bestimmte Volksgruppe fest.
- source_word: וְאֹיְבָיו
  choice: und seine Feinde
  rationale: Eine direkte und natürliche Wiedergabe des Nomens אֹיֵב mit dem Suffix der dritten Person Singular.
- source_word: עָפָר
  choice: den Staub
  rationale: „Den Staub lecken“ ist auch im Deutschen ein verständliches, starkes Bild für Erniedrigung und vollständige Unterwerfung.
- source_word: יְלַחֵכוּ
  choice: werden … lecken
  rationale: לחך bedeutet „lecken“. Die konkrete Wiedergabe bewahrt das eindringliche poetische Bild des hebräischen Textes.
theological_decisions:
- issue: Art der dargestellten Unterwerfung
  choice: Das Bild königlicher Unterwerfung und Erniedrigung wird unverändert poetisch wiedergegeben.
  alternative: Die Aussagen ausschließlich als buchstäbliche körperliche Handlungen zu verstehen oder abstrakt als politische Unterwerfung zu paraphrasieren.
  rationale: Niederbeugen und Staublecken sind herkömmliche Bilder vollständiger Unterwerfung vor einem König. Die Übersetzung bewahrt die Bildsprache, ohne festzulegen, dass sie in jedem Fall buchstäblich vollzogen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die starke Bildsprache des hebräischen Verses bleiben erhalten; die echte lexikalische Unsicherheit bei צִיִּים wird durch eine Fußnote kenntlich gemacht.
