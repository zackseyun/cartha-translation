id: PSA.72.12
reference: Psalms 72:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי יַ֭צִּיל אֶבְי֣וֹן מְשַׁוֵּ֑עַ וְ֝/עָנִ֗י וְֽ/אֵין עֹזֵ֥ר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/012.yaml
  text: For he delivers the needy when he cries out[a], and the poor who has no helper.
translation:
  language: de
  text: Denn er rettet den Bedürftigen, der um Hilfe ruft, und den Elenden[a], der keinen Helfer hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Armen“ beziehungsweise „den Bedrängten“. Das hebräische Wort עָנִי kann Armut ebenso wie Bedrängnis oder Unterdrückung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet das vorausgehende Lob des Königs; „Denn“ gibt den kausalen Zusammenhang im Deutschen natürlich wieder.
- source_word: יַצִּיל
  choice: er rettet
  rationale: Der Hifil von נצל bezeichnet das Befreien aus einer Notlage. „rettet“ ist klar und vermeidet eine unnötige Einengung auf geistliches Heil.
- source_word: אֶבְיוֹן
  choice: den Bedürftigen
  rationale: Das Wort bezeichnet einen materiell bedürftigen oder auf Hilfe angewiesenen Menschen. „Bedürftigen“ unterscheidet es vom folgenden עָנִי.
- source_word: מְשַׁוֵּעַ
  choice: der um Hilfe ruft
  rationale: Das Partizip von שׁוע beschreibt den Bedürftigen als jemanden, der in seiner Not Hilfe erfleht. Der Relativsatz bewahrt diesen beschreibenden Charakter und klingt im Deutschen natürlich.
- source_word: וְעָנִי
  choice: und den Elenden
  rationale: עָנִי kann arm, elend, bedrängt oder unterdrückt bedeuten. „Elenden“ bewahrt die Not- und Bedrängnisdimension und vermeidet eine bloße Wiederholung von „Bedürftigen“.
- source_word: וְאֵין עֹזֵר לוֹ
  choice: der keinen Helfer hat
  rationale: Der Relativsatz gibt die qualifizierende Aussage knapp wieder und bewahrt mit „Helfer“ das personale Substantiv עֹזֵר.
theological_decisions:
- issue: Bezug des Pronomens „er“
  choice: Das unbestimmte maskuline Singularpronomen bleibt erhalten und verweist im Kontext auf die königliche Gestalt des Psalms.
  alternative: Ausdrückliche Identifikation als gerechter Herrscher oder als messianischer König.
  rationale: Das Hebräische nennt in diesem Vers keinen Namen und legt die weitergehende theologische Identifikation nicht ausdrücklich fest. Die Übersetzung bewahrt daher die Offenheit des Textes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus bleibt klar erkennbar; „Bedürftigen“ und „Elenden“ bilden eine natürliche, semantisch unterscheidbare Wortpaarung.
