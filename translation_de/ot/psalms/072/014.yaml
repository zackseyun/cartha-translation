base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/014.yaml
  text: From oppression and violence he will redeem their life[b][a], and their blood will be precious in his eyes.
translation:
  language: de
  text: Aus Unterdrückung und Gewalt wird er[b] ihr Leben[a] erlösen, und ihr Blut wird in seinen Augen kostbar sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Seele“ oder „ihre Leben“. Das hebräische Wort kann je nach Zusammenhang Leben, Selbst, Seele oder Person bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: „Er“ und „seinen“ beziehen sich im unmittelbaren Zusammenhang am ehesten auf den König; zugleich klingt darin Gottes eigenes erlösendes Eintreten für die Unterdrückten an.
    reason: alternative_reading
lexical_decisions:
- source_word: מִתּוֹךְ
  choice: aus Unterdrückung
  rationale: Die Verbindung bedeutet wörtlich „aus der Mitte von“. Im Deutschen gibt „aus“ die Befreiung aus einem bedrängenden Zustand natürlich und prägnant wieder.
- source_word: וּמֵחָמָס
  choice: und Gewalt
  rationale: חָמָס bezeichnet Gewalt, Unrecht oder gewaltsame Willkür. „Gewalt“ bewahrt das konkrete Gewicht des Ausdrucks; die Präposition „aus“ gilt gemeinsam für beide Substantive.
- source_word: יִגְאַל
  choice: wird er … erlösen
  rationale: גאל bezeichnet das Zurückfordern oder Befreien durch einen Löser. „Erlösen“ erhält diesen rechtlichen und theologischen Klang besser als das allgemeinere „retten“.
- source_word: נַפְשָׁם
  choice: ihr Leben
  rationale: נֶפֶשׁ kann Leben, Selbst, Seele oder Person bedeuten. Hier passt „Leben“ zum Schutz der Bedrängten und bewahrt zugleich die singularische Kollektivform des Hebräischen.
- source_word: וְיֵיקַר
  choice: wird … kostbar sein
  rationale: Das Verb drückt aus, dass etwas kostbar, gewichtig oder hoch geschätzt ist. „Kostbar sein“ ist im Deutschen klar und erhält die Wertung des hebräischen Ausdrucks.
- source_word: דָּמָם
  choice: ihr Blut
  rationale: Die konkrete Rede vom Blut bringt zum Ausdruck, dass das vergossene oder bedrohte Leben der Bedrängten nicht gering geachtet wird.
- source_word: בְּעֵינָיו
  choice: in seinen Augen
  rationale: Die wörtliche hebräische Wendung ist auch im Deutschen verständlich und bezeichnet seine Wertschätzung und sein Urteil.
theological_decisions:
- issue: Bezug der singularischen Formen „er/seinen“
  choice: Die singularischen Formen werden beibehalten und beziehen sich im unmittelbaren Zusammenhang am ehesten auf den König.
  alternative: Eine unmittelbare Aussage über Gott als den Erlöser der Unterdrückten.
  rationale: Die Grammatik und der königliche Zusammenhang von Psalm 72 sprechen für den König als direktes Bezugswort. Zugleich erinnert sein erlösendes Handeln an Gottes eigene Fürsorge. Die Übersetzung lässt diese theologische Resonanz bestehen, ohne den Bezug ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt nah am hebräischen Parallelismus; „erlösen“ und „in seinen Augen kostbar“ bewahren die rechtliche beziehungsweise bildhafte Sprache des Ausgangstextes.
