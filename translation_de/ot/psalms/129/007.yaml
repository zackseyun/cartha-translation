  text: שֶׁ/לֹּ֤א מִלֵּ֖א כַפּ֥/וֹ קוֹצֵ֗ר וְ/חִצְנ֥/וֹ מְעַמֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/007.yaml
  text: with which the reaper has not filled his hand[a], nor the one who gathers sheaves, his arms.
translation:
  language: de
  text: mit dem kein Schnitter seine Hand füllt und kein Garbensammler seinen Schoß.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁלֹּא
  choice: mit dem kein
  rationale: Der negierte Relativsatz bezieht sich auf das Gras auf den Dächern im vorigen Vers. „Mit dem kein“ macht diesen Bezug im Deutschen natürlich und eindeutig.
- source_word: מִלֵּא
  choice: füllt
  rationale: Das hebräische Perfekt beschreibt hier das für dieses Gras typische Ergebnis. Im deutschen allgemeinen Präsens klingt diese charakteristische Aussage idiomatisch.
- source_word: כַפּוֹ
  choice: seine Hand
  rationale: כַּף bezeichnet wörtlich Handfläche beziehungsweise Hand; „Hand“ bewahrt das konkrete Erntebild in natürlichem Deutsch.
- source_word: קוֹצֵר
  choice: Schnitter
  rationale: Das substantivierte Partizip bezeichnet den, der das Getreide schneidet. „Schnitter“ ist knapp, verständlich und passt zur poetischen Agrarsprache.
- source_word: וְחִצְנוֹ
  choice: seinen Arm
  rationale: חֵצֶן kann den Brust- oder Schoßbereich, den Gewandbausch oder den Arm als Stelle bezeichnen, an der das Gesammelte getragen wird. „Arm“ gibt das Erntebild verständlich wieder; die anderen Möglichkeiten bleiben in der Fußnote erhalten.
- source_word: מְעַמֵּר
  choice: Garbenbinder
  rationale: Das Partizip bezeichnet jemanden, der das Geschnittene sammelt beziehungsweise zu Garben zusammenfasst. „Garbenbinder“ ist eine knappe, anschauliche deutsche Wiedergabe.
theological_decisions: []
