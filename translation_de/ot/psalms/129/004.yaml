base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/004.yaml
  text: Yahweh is righteous[a]; he has cut the cords of the wicked.
translation:
  language: de
  text: Jahwe ist gerecht; er hat die Stricke[a] der Gottlosen zerschnitten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seile“ beziehungsweise „dicke Stricke“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, um den im Hebräischen ausdrücklich stehenden Eigennamen zu bewahren.
- source_word: צַדִּיק
  choice: gerecht
  rationale: Das prädikativ gebrauchte Adjektiv bezeichnet hier Jahwes gerechten Charakter und sein entsprechendes Handeln.
- source_word: קִצֵּץ
  choice: zerschnitten
  rationale: Das Verb bezeichnet ein Durch- oder Abschneiden. „Zerschnitten“ gibt die vollendete, entschiedene Befreiung natürlich wieder und passt zum Bild der Stricke.
- source_word: עֲבוֹת
  choice: Stricke
  rationale: Das Substantiv bezeichnet feste Schnüre oder Seile, die zum Binden dienen können. „Stricke“ bewahrt das Bild der Fesselung und klingt im Deutschen prägnant.
- source_word: רְשָׁעִים
  choice: der Gottlosen
  rationale: Das substantivierte maskuline Pluraladjektiv bezeichnet gottlos oder böse handelnde Menschen allgemein; „der Gottlosen“ ist knapp und im poetischen Zusammenhang idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der Stricke
  choice: Stricke der Gottlosen
  alternative: Stricke, mit denen die Gottlosen fesseln
  rationale: 'Die Genitivverbindung bleibt wie im Hebräischen offen: Die Stricke können den Gottlosen gehören oder für ihre unterdrückende Gewalt stehen. Die Übersetzung legt die genaue Beziehung nicht zusätzlich fest.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzstruktur. Der Fußnotenmarker steht unmittelbar bei dem lexikalisch mehrdeutigen Ausdruck.
