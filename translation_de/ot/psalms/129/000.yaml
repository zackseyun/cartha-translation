  yaml_path: translation/ot/psalms/129/000.yaml
  text: 'A Song of Ascents: “Greatly they have afflicted me from my youth”—let Israel now say—[a]'
translation:
  language: de
  text: 'Ein Wallfahrtslied.


    »Sehr haben sie mich bedrängt von meiner Jugend an«, so soll Israel sagen,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Oft haben sie mich bedrängt von meiner Jugend an.« Das hebräische Wort kann sowohl großes Ausmaß als auch häufige Wiederholung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die Überschrift bezeichnet ein Lied der »Aufstiege«; »Wallfahrtslied« gibt die wahrscheinlich gemeinte Verwendung bei den Pilgeraufstiegen nach Jerusalem natürlich und knapp wieder.
- source_word: רַבַּת
  choice: Sehr
  rationale: Das feminine Adverbialwort kann großes Ausmaß oder häufige Wiederholung ausdrücken. »Sehr« bewahrt im Haupttext den Gradakzent; die mögliche Bedeutung »oft« wird in der Fußnote genannt.
- source_word: צְרָרוּנִי
  choice: haben sie mich bedrängt
  rationale: Das Verb beschreibt feindseliges Bedrängen oder Bedrücken. »Bedrängt« ist idiomatisch und lässt Art und Intensität der Anfeindung offen.
- source_word: מִנְּעוּרַי
  choice: von meiner Jugend an
  rationale: Die Wendung bezeichnet einen seit der Jugend bestehenden Ausgangspunkt und wird im Deutschen natürlich mit »von … an« ausgedrückt.
- source_word: יֹאמַר נָא יִשְׂרָאֵל
  choice: so soll Israel sagen
  rationale: נָא markiert hier eine auffordernde Bitte; die deutsche Soll-Konstruktion gibt den Aufruf idiomatisch wieder.
theological_decisions:
- issue: Identität des sprechenden Ichs
  choice: Das »Ich« bleibt grammatisch singular und wird Israel zur gemeinsamen Aussage vorgegeben.
  alternative: Das Ich ausdrücklich als kollektives Israel erklären oder in den Plural übertragen.
  rationale: Der hebräische Text verbindet die Singularrede mit dem Aufruf an Israel, ohne das Verhältnis ausdrücklich zu erläutern; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anführungszeichen kennzeichnen die Aussage, die Israel aufnehmen soll; Gedankenstriche bilden die eingeschobene Aufforderung und den offenen Anschluss an den folgenden Vers ab.
