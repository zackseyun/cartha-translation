source:
  edition: WLC
  text: יֵ֭בֹשׁוּ וְ/יִסֹּ֣גוּ אָח֑וֹר כֹּ֝֗ל שֹׂנְאֵ֥י צִיּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/005.yaml
  text: May all who hate Zion be put to shame and turned backward[a].
translation:
  language: de
  text: Mögen alle, die Zion hassen, beschämt werden und zurückweichen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Zukunftsaussage: „Alle, die Zion hassen, werden beschämt werden und zurückweichen.“ Die hebräischen Verbformen können sowohl als Wunschgebet als auch als Aussage über die Zukunft verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: Beschämt sollen
  rationale: בוש bezeichnet Scham, Beschämung oder das Scheitern. Die vorangestellte Formulierung gibt den poetischen Wunschcharakter wieder, ohne eine ausdrücklich verursachende Passivkonstruktion in den hebräischen Text einzutragen.
- source_word: וְיִסֹּגוּ אָחוֹר
  choice: zurückweichen
  rationale: סוג mit אָחוֹר bedeutet zurückweichen bzw. sich rückwärts wenden. Das natürliche deutsche Verb „zurückweichen“ bildet die Bewegung nach hinten knapp und idiomatisch ab.
- source_word: כֹּל
  choice: alle
  rationale: Gibt den umfassenden Quantor direkt und natürlich wieder.
- source_word: שֹׂנְאֵי
  choice: die … hassen
  rationale: Das substantivierte Partizip wird im modernen Deutschen als Relativsatz idiomatisch wiedergegeben.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Übliche deutsche Wiedergabe des Eigennamens.
theological_decisions:
- issue: Wunsch- bzw. Fluchgebetscharakter gegenüber futurischer Aussage
  choice: Die yiqtol-Formen werden im Haupttext als Wunsch mit „sollen“ wiedergegeben.
  alternative: „Beschämt werden und zurückweichen werden alle, die Zion hassen.“
  rationale: Im poetischen Zusammenhang können die Formen jussiv-imprekativ oder futurisch verstanden werden. Der Haupttext wahrt den wahrscheinlich gebetsartigen Wunschcharakter; die Fußnote erhält die mögliche Zukunftsaussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markierte Satzstellung hält den poetischen Nachdruck auf Beschämung und Zurückweichen; „zurückweichen“ ist natürlicher als „rückwärts gewendet werden“ und vermeidet eine im Hebräischen nicht ausdrücklich genannte verursachende Instanz.
