  text: יִ֭הְיוּ כַּ/חֲצִ֣יר גַּגּ֑וֹת שֶׁ/קַּדְמַ֖ת שָׁלַ֣ף יָבֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/006.yaml
  text: May they be like grass on the rooftops[a], which withers before it grows up.
translation:
  language: de
  text: Mögen sie wie Gras auf den Dächern sein, das verdorrt, bevor es emporschießt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das verdorrt, bevor man es ausreißt.“'
    reason: Das seltene שָׁלַף kann „herausziehen/ausreißen“ bedeuten; im Zusammenhang wird es jedoch traditionell als Aufschießen oder Heranwachsen des Grases verstanden.
lexical_decisions:
- source_word: יִהְיוּ
  choice: Mögen sie … sein
  rationale: Die Jussivform hat im Zusammenhang einen verwünschenden Wunschcharakter und wird im Deutschen natürlich mit „Mögen sie … sein“ wiedergegeben.
- source_word: כַּחֲצִיר
  choice: wie Gras
  rationale: חָצִיר bezeichnet Gras oder Pflanzenwuchs; „Gras“ ist hier die klare und bildhafte Entsprechung.
- source_word: גַּגּוֹת
  choice: auf den Dächern
  rationale: Gemeint sind die flachen Hausdächer, auf denen Gras in einer dünnen Erdschicht nur kurz wachsen konnte.
- source_word: שֶׁקַּדְמַת
  choice: bevor
  rationale: Die Konstruktion drückt aus, dass das Verdorren der folgenden Handlung zeitlich vorausgeht.
- source_word: שָׁלַף
  choice: man es ausreißt
  rationale: Das Verb bedeutet grundsätzlich „herausziehen“ oder „ausziehen“. Das unbestimmte Subjekt wird im Deutschen idiomatisch mit „man“ ausgedrückt; die alternative Deutung als Emporschießen wird in der Fußnote bewahrt.
- source_word: יָבֵשׁ
  choice: verdorrt
  rationale: Das Verb bezeichnet das Austrocknen; bei Gras gibt „verdorrt“ die konkrete und poetische Wirkung natürlich wieder.
