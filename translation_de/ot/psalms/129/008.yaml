source:
  edition: WLC
  text: וְ/לֹ֤א אָֽמְר֨וּ הָ/עֹבְרִ֗ים בִּרְכַּֽת יְהוָ֥ה אֲלֵי/כֶ֑ם בֵּרַ֥כְנוּ אֶ֝תְ/כֶ֗ם בְּ/שֵׁ֣ם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/008.yaml
  text: and those who pass by do not say[a], “The blessing of Yahweh be upon you; we bless you in the name of Yahweh.”
translation:
  language: de
  text: 'Und die Vorübergehenden sagen nicht: »Der Segen Jahwes[a] sei über euch! Wir segnen euch im Namen Jahwes.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH, der Name Gottes; traditionell mit »der HERR« wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא אָמְרוּ
  choice: Und … sagen nicht
  rationale: Die Verbindung aus Konjunktion, Verneinung und Verb führt die Schilderung des vorigen Verses fort. Das Präsens gibt den allgemeinen, bildhaften Sachverhalt im Deutschen natürlich wieder.
- source_word: הָעֹבְרִים
  choice: die Vorübergehenden
  rationale: Das substantivierte Partizip bezeichnet allgemein Menschen, die vorbeikommen; „die Vorübergehenden“ ist knapp und bewahrt diesen Charakter.
- source_word: בִּרְכַּת יְהוָה
  choice: Der Segen Jahwes
  rationale: Die hebräische Status-constructus-Verbindung wird als Genitivfügung wiedergegeben; so bleibt die feierliche Segenssprache erhalten.
- source_word: אֲלֵיכֶם
  choice: sei über euch
  rationale: Im Hebräischen fehlt eine ausdrückliche Verbform. „Sei“ macht den Wunschcharakter der Segensformel deutlich, während „über euch“ die Präposition möglichst eng abbildet.
- source_word: בֵּרַכְנוּ אֶתְכֶם
  choice: Wir segnen euch
  rationale: Die Perfektform hat hier im Rahmen der gesprochenen Segensformel performative Kraft; das deutsche Präsens bringt dies verständlich zum Ausdruck.
- source_word: בְּשֵׁם יְהוָה
  choice: im Namen Jahwes
  rationale: Die geläufige deutsche Wendung bezeichnet den Namen, unter dessen Anrufung und Autorität der Segen ausgesprochen wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen JHWH. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch den traditionell verwendeten Titel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede behält den formelhaften Klang des Segens bei; „sei über euch“ wahrt bewusst die räumliche Bildsprache des Hebräischen.
