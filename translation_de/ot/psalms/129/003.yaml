  terminology: „Rücken“, „Pflüger“ und „Furchen“ sind präzise und registergerecht. Die Fußnote kennzeichnet die metaphorische Ebene als Erklärung und bewahrt im Haupttext die Bildsprache; die alternative Formulierung „verlängert“ ist als lexikalische Alternative zutreffend.
