  source_fidelity: Die Übersetzung gibt die hebräischen Perfektformen, die Wiederholung der Pflug-Wortgruppe und das Bild des Rückens als Ackerfläche treffend wieder. „Auf meinem Rücken haben Pflüger gepflügt“ entspricht עַל־גַּבִּי חָרְשׁוּ חֹרְשִׁים; „sie haben ihre Furchen lang gezogen“ gibt הֶאֱרִיכוּ לְמַעֲנוֹתָם idiomatisch und ohne Ausdeutung wieder.
