source:
  edition: WLC
  text: עַל גַּ֭בִּ/י חָרְשׁ֣וּ חֹרְשִׁ֑ים הֶ֝אֱרִ֗יכוּ ל/מענות/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/003.yaml
  text: Plowmen have plowed on my back[a]; they have made their furrows long.
translation:
  language: de
  text: Auf meinem Rücken haben Pflüger gepflügt; sie haben ihre Furchen lang gezogen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Bild vom Pflügen steht für schwere Unterdrückung oder Verwundung. Auch möglich: „Sie haben ihre Furchen verlängert.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל גַּבִּי
  choice: auf meinem Rücken
  rationale: Die räumliche Präposition und das konkrete Substantiv werden direkt wiedergegeben; so bleibt das eindringliche Bild des wie ein Feld verwundeten Rückens erhalten.
- source_word: חָרְשׁוּ
  choice: haben gepflügt
  rationale: Das Verb bedeutet wörtlich „pflügen“. Das deutsche Perfekt gibt die vollzogene feindliche Handlung in natürlicher, gegenwärtiger Standardsprache wieder.
- source_word: חֹרְשִׁים
  choice: Pflüger
  rationale: Das substantivisch gebrauchte Partizip bezeichnet diejenigen, die pflügen. „Pflüger“ ist knapp, verständlich und bewahrt das landwirtschaftliche Bild.
- source_word: הֶאֱרִיכוּ
  choice: haben … lang gezogen
  rationale: Der Hifil bedeutet „lang machen, verlängern“. In Verbindung mit Furchen ist „lang ziehen“ natürlich und anschaulich.
- source_word: לְמַעֲנוֹתָם
  choice: ihre Furchen
  rationale: Das seltene Wort wird im Kontext als die beim Pflügen entstehenden Furchen verstanden. Diese Wiedergabe bewahrt die konkrete Metapher, ohne sie als Schläge oder Wunden auszudeuten.
theological_decisions:
- issue: Metaphorische Darstellung von Israels Leiden
  choice: 'Das landwirtschaftliche Bild wird wörtlich beibehalten: Pflüger pflügen auf dem Rücken und ziehen lange Furchen.'
  alternative: Sie haben meinen Rücken mit langen Wunden bedeckt.
  rationale: Der hebräische Text deutet schwere Unterdrückung oder Verwundung bildhaft an, erklärt die Metapher aber nicht ausdrücklich. Die Übersetzung wahrt deshalb Bildkraft und Deutungsoffenheit.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst beibehaltener poetischer Härte. Die Wiederholung „Pflüger gepflügt“ spiegelt die hebräische Wortfigur und ist im Deutschen verständlich; das Semikolon erhält den parallelen Versbau.
