  yaml_path: translation/ot/psalms/129/002.yaml
  text: Greatly they have afflicted me from my youth[b][a], yet they have not prevailed against me.
translation:
  language: de
  text: Sehr[a] haben sie mich bedrängt von meiner Jugend an, doch sie konnten mich nicht überwältigen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Oft haben sie mich bedrängt von meiner Jugend an.“ Das hebräische Anfangswort kann sowohl das große Ausmaß als auch die häufige Wiederholung betonen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie konnten mich nicht bezwingen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת
  choice: Sehr
  rationale: Die adverbiale Form bezeichnet hier am ehesten das große Ausmaß der Bedrängnis. Sie kann jedoch auch wiederholtes Geschehen ausdrücken; diese echte Mehrdeutigkeit wird in Fußnote [a] bewahrt.
- source_word: צְרָרוּנִי
  choice: haben sie mich bedrängt
  rationale: צרר bezeichnet feindseliges Bedrängen oder Anfeinden. „Bedrängt“ gibt die anhaltende feindliche Behandlung wieder, ohne sie unnötig auf militärische Angriffe oder politische Unterdrückung einzuengen.
- source_word: מִנְּעוּרָי
  choice: von meiner Jugend an
  rationale: Die natürliche deutsche Wendung bezeichnet den in der Jugend liegenden Ausgangspunkt und die seitdem fortdauernde Erfahrung.
- source_word: גַּם
  choice: doch
  rationale: 'Vor der Verneinung hat גַּם hier eine konzessiv-adversative Funktion: Trotz der Bedrängnis blieb der endgültige Erfolg der Gegner aus.'
- source_word: לֹא יָכְלוּ לִי
  choice: sie konnten mich nicht überwältigen
  rationale: יכל mit ל bezeichnet hier, dass jemand gegen einen anderen nicht die Oberhand gewinnen kann. „Nicht überwältigen“ bewahrt den Gedanken des gescheiterten Bezwingens.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit psalmtypischer Wortstellung. „Von meiner Jugend an“ ist idiomatisch und bewahrt den zeitlichen Ausgangspunkt; „bedrängt“ bleibt bewusst weiter als rein militärisches „angegriffen“.
