    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die Überschrift bezeichnet die Psalmen 120–134. „Wallfahrtslied“ gibt die im Deutschen geläufige funktionale Bedeutung natürlich wieder; die wörtlichere Wiedergabe „Lied der Aufstiege“ bleibt möglich, klingt aber weniger idiomatisch.
- source_word: רַבַּת
  choice: Oft
  rationale: Das adverbial gebrauchte Wort kann wiederholte Häufigkeit oder großes Ausmaß ausdrücken. „Oft“ passt zum Rückblick auf Israels Geschichte und bewahrt die mögliche Wiederholungsbedeutung; die Intensitätslesart wird in der Fußnote genannt.
- source_word: צְרָרוּנִי
  choice: haben sie mich bedrängt
  rationale: Das Verb bezeichnet feindseliges Bedrängen und Anfeinden. „Bedrängt“ wahrt die semantische Breite, ohne den Ausdruck ausschließlich auf politische Unterdrückung festzulegen.
- source_word: מִנְּעוּרַי
  choice: von meiner Jugend an
  rationale: Die Wendung gibt den zeitlichen Ausgangspunkt idiomatisch und nahe am hebräischen Ausdruck wieder.
- source_word: יֹאמַר נָא
  choice: so soll ... jetzt sagen
  rationale: Die Verbform mit נָא ist hier eine Aufforderung. „Soll ... jetzt sagen“ gibt den liturgischen Aufruf natürlich wieder, ohne נָא missverständlich als höfliches „bitte“ zu deuten.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bleibt erhalten. Israel wird als Gemeinschaft aufgefordert, das Bekenntnis in der ersten Person zu übernehmen.
theological_decisions:
- issue: Korporativer Sprecher und liturgischer Rahmen
  choice: Die Ich-Aussage wird als Bekenntnis formuliert, das Israel durch den anschließenden Aufruf gemeinschaftlich übernimmt.
  alternative: Ein einzelner Sprecher klagt zunächst persönlich, und seine Aussage wird erst danach auf Israel übertragen.
  rationale: „So soll Israel jetzt sagen“ weist auf gemeinschaftliche Identifikation hin. Die Übersetzung lässt dennoch offen, ob das vorausgehende „mich“ ursprünglich individuell oder unmittelbar korporativ spricht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit psalmtypischem Rhythmus. „Wallfahrtslied“ ist verständlicher und im Deutschen etablierter als das formalere „Lied der Aufstiege“. Der Gedankenstrich am Versende bewahrt den offenen Übergang zur Wiederholung in Vers 2.
