  text: הֵיטִ֣יבָ/ה יְ֭הוָה לַ/טּוֹבִ֑ים וְ֝/לִֽ/ישָׁרִ֗ים בְּ/לִבּוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/004.yaml
  text: Do good[a], O Yahweh, to the good[b], and to the upright in heart.
translation:
  language: de
  text: 'Tu den Guten Gutes, Jahwe,

    und denen, die in ihren Herzen aufrichtig sind.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und den Aufrichtigen in ihren Herzen“; gemeint ist eine Aufrichtigkeit, die das Innere prägt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיבָה
  choice: Tu … Gutes
  rationale: Der Hifil-Imperativ von יטב ist als Bitte an Jahwe formuliert. „Tu … Gutes“ gibt die aktive verbale Bedeutung wieder und bewahrt zugleich die Wortverbindung zu „den Guten“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לַטּוֹבִים
  choice: den Guten
  rationale: Das substantivierte Adjektiv bezeichnet gute Menschen. „Den Guten“ ist knapp und erhält das Wortspiel mit „Gutes tun“; „den Gerechten“ würde einen anderen hebräischen Begriff nahelegen.
- source_word: וְלִישָׁרִים
  choice: und denen, die … aufrichtig sind
  rationale: יָשָׁר bezeichnet hier moralische Geradheit beziehungsweise Aufrichtigkeit. Die Relativkonstruktion klingt im modernen Deutsch natürlich und verbindet sich klar mit der folgenden Herzensangabe.
- source_word: בְּלִבּוֹתָם
  choice: in ihren Herzen
  rationale: Die Wiedergabe folgt dem hebräischen Plural und betont, dass die Aufrichtigkeit das Innere der betreffenden Menschen kennzeichnet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt den Namen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Beschreibung der Empfänger des erbetenen Guten
  choice: den Guten … denen, die in ihren Herzen aufrichtig sind
  alternative: den Gerechten … den von Herzen Aufrichtigen
  rationale: Die Übersetzung erhält die beiden parallelen ethischen Beschreibungen, ohne sie zu technischen theologischen Kategorien zu machen. Die Wendung „in ihren Herzen“ wahrt zudem den Akzent auf innerer Aufrichtigkeit.
translation_notes:
  register: Poetisch knappes, würdevolles Standarddeutsch. Die Stellung „Tu den Guten Gutes“ ist idiomatisch und bewahrt die bewusste Wiederholung des hebräischen Wortstamms. Die Verszeile wird zur Lesbarkeit in zwei parallele Zeilen gegliedert.
