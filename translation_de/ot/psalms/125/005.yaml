  edition: WLC
  text: וְ/הַ/מַּטִּ֤ים עַֽקַלְקַלּוֹתָ֗/ם יוֹלִיכֵ֣/ם יְ֭הוָה אֶת פֹּעֲלֵ֣י הָ/אָ֑וֶן שָׁ֝ל֗וֹם עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/005.yaml
  text: But as for those who turn aside to their crooked ways[a], Yahweh will lead them away with the workers of iniquity[c][b]. Peace be upon Israel.
translation:
  language: de
  text: Die aber auf ihre krummen Wege abbiegen,[a] werden Jahwe zusammen mit den Übeltätern fortführen.[b] Friede sei über Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die sich auf ihre verschlungenen Pfade abwenden«; das Hebräische kann krumme, verschlungene oder verkehrte Wege bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Jahwe wird sie zusammen mit denen wegführen, die Unrecht tun.«'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich knapp: »Friede über Israel« – wahrscheinlich ein Segens- oder Gebetswunsch.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהַמַּטִּים
  choice: Die aber … abbiegen
  rationale: Das Partizip von נטה bezeichnet ein Abweichen oder Sich-Abwenden. »Aber« macht den Gegensatz zu den Aufrichtigen im vorherigen Vers deutlich.
- source_word: עַקַלְקַלּוֹתָם
  choice: auf ihre krummen Wege
  rationale: Das seltene Substantiv bezeichnet krumme oder verschlungene Wege; die Wegmetapher und ihre moralische Bedeutung bleiben erhalten.
- source_word: יוֹלִיכֵם
  choice: wird … fortführen
  rationale: Der Hifil von הלך bedeutet hier »gehen lassen, führen«. »Fortführen« bringt die Entfernung im Gericht zum Ausdruck, ohne das Ziel näher zu bestimmen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶת
  choice: zusammen mit
  rationale: 'אֶת hat hier wahrscheinlich begleitende bzw. verbindende Funktion: Die Abweichenden werden gemeinsam mit den Übeltätern fortgeführt.'
- source_word: פֹּעֲלֵי הָאָוֶן
  choice: den Übeltätern
  rationale: Die wörtliche Wendung »Täter des Unrechts« wird idiomatisch und prägnant als »Übeltäter« wiedergegeben.
- source_word: שָׁלוֹם עַל יִשְׂרָאֵל
  choice: Friede sei über Israel!
  rationale: Die knappe Nominalformel wird als Segenswunsch wiedergegeben; »über« bewahrt die Bildlichkeit der Präposition עַל.
theological_decisions:
- issue: Aussagekraft der Schlussformel שָׁלוֹם עַל יִשְׂרָאֵל
  choice: 'Segens- oder Gebetswunsch: »Friede sei über Israel!«'
  alternative: 'Nominaler Aussagesatz: »Friede ist über Israel.«'
  rationale: Im poetischen und liturgischen Zusammenhang liegt ein abschließender Segenswunsch nahe. Die Ergänzung »sei« macht diese Funktion im Deutschen natürlich verständlich, ohne eine im Hebräischen ausdrücklich markierte Zeitstufe einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wegmetapher bleibt erhalten; »Übeltäter« vermeidet eine schwerfällige Substantivkonstruktion. Die Schlussformel klingt bewusst liturgisch.
