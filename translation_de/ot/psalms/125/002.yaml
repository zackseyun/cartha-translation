  text: יְֽרוּשָׁלִַ֗ם הָרִים֮ סָבִ֪יב לָ֥/הּ וַ֭/יהוָה סָבִ֣יב לְ/עַמּ֑/וֹ מֵ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/002.yaml
  text: As the mountains surround Jerusalem[a], so Yahweh surrounds his people from now and forever.
translation:
  language: de
  text: Wie die Berge Jerusalem umgeben,[a] so umgibt Jahwe sein Volk von nun an bis in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Jerusalem – die Berge sind rings um sie; und Jahwe ist rings um sein Volk von nun an bis in Ewigkeit.«'
    reason: Bewahrt die nominale hebräische Satzform, den femininen Rückbezug auf die Stadt, die Bestimmtheit von »die Berge« und die mögliche additive Wiedergabe des Waw.
lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Der gebräuchliche deutsche Name der Stadt.
- source_word: הָרִים
  choice: die Berge
  rationale: Der Plural von הַר kann Berge oder Hügel bezeichnen; »Berge« bewahrt hier das kraftvolle topografische Schutzbild.
- source_word: סָבִיב לָהּ
  choice: Jerusalem umgeben
  rationale: סָבִיב mit ל bezeichnet das Umgebensein; das feminine Suffix bezieht sich auf die Stadt Jerusalem. Die aktive deutsche Formulierung ist natürlich und klar.
- source_word: וַיהוָה
  choice: so … Jahwe
  rationale: Das Waw wird aufgrund des parallelen, vergleichenden Satzbaus mit »so« wiedergegeben; der Gottesname יהוה erscheint als »Jahwe«.
- source_word: סָבִיב לְעַמּוֹ
  choice: umgibt … sein Volk
  rationale: Die Wiederholung von »umgibt« erhält das poetische Parallelbild und vermittelt Schutz, ohne diesen ausdrücklich hinzuzufügen.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: Die Possessivverbindung wird direkt wiedergegeben und bewahrt ihren relationalen Sinn.
- source_word: מֵעַתָּה
  choice: von nun an
  rationale: Natürliche moderne Wiedergabe des zeitlichen Ausgangspunkts.
- source_word: וְעַד עוֹלָם
  choice: bis in Ewigkeit
  rationale: Gängige, würdevolle deutsche Wiedergabe einer unbegrenzten zeitlichen Dauer.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm; »Jahwe« gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Funktion des Waw vor יהוה
  choice: 'vergleichend: »so … Jahwe«'
  alternative: 'additiv: »und Jahwe«'
  rationale: Der poetische Parallelismus legt einen Vergleich nahe. »Wie … so« macht diese Struktur im Deutschen verständlich; die formalere additive Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wie-so-Struktur schafft einen flüssigen Vers, während die Fußnote die formalere und leicht mehrdeutige Syntax des Hebräischen dokumentiert.
