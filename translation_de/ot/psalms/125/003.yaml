  text: כִּ֤י לֹ֪א יָנ֡וּחַ שֵׁ֤בֶט הָ/רֶ֗שַׁע עַל֮ גּוֹרַ֪ל הַֽ/צַּדִּ֫יקִ֥ים לְמַ֡עַן לֹא יִשְׁלְח֖וּ הַ/צַּדִּיקִ֨ים בְּ/עַוְלָ֬תָ/ה יְדֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/003.yaml
  text: For the scepter of wickedness will not rest on the lot of the righteous[c][b][a], lest the righteous stretch out their hands to wrongdoing.
translation:
  language: de
  text: Denn das Zepter der Bosheit[a] wird nicht auf dem Erbteil[b] der Gerechten ruhen, damit die Gerechten ihre Hände nicht nach Unrecht[c] ausstrecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Zepter der Gottlosen“. Die hebräische Verbindung kann entweder Bosheit als Eigenschaft oder die Gottlosen als Träger der Herrschaft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Erbteil“ kann auch mit „Anteil“ oder „Los“ wiedergegeben werden; gemeint ist der den Gerechten zugeteilte Bereich.
    reason: lexical_alternative
  - marker: c
    text: 'Die hebräische Wendung lautet wörtlich etwa: „ihre Hände in Unrecht ausstrecken“. Sie meint, sich auf Unrecht einzulassen oder es zu tun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die zuvor ausgesprochene Zuversicht ein und entspricht dem Zusammenhang des Psalms.
- source_word: יָנוּחַ
  choice: wird nicht … ruhen
  rationale: Bewahrt das konkrete Bild des Sich-Niederlassens und bezeichnet hier, dass die böse Herrschaft nicht dauerhaft bestehen bleibt.
- source_word: שֵׁבֶט
  choice: Zepter
  rationale: Gibt im Zusammenhang politischer oder herrschaftlicher Macht die Metapher treffender wieder als „Stab“ oder „Rute“.
- source_word: הָרֶשַׁע
  choice: der Bosheit
  rationale: Bewahrt den abstrakten Genitiv des Hebräischen; zugleich bleibt „der Gottlosen“ als mögliche personenbezogene Deutung in einer Fußnote erhalten.
- source_word: גּוֹרַל
  choice: Erbteil
  rationale: Bezeichnet hier den den Gerechten zugeteilten Anteil oder Lebensbereich. „Erbteil“ ist im Deutschen verständlicher als das missverständliche „Los“ und bewahrt den Zuteilungsgedanken.
- source_word: הַצַּדִּיקִים
  choice: die Gerechten
  rationale: Entspricht der substantivisch gebrauchten Mehrzahl und bewahrt den moralisch-bundestheologischen Sinn ohne zusätzliche Festlegung.
- source_word: לְמַעַן לֹא
  choice: damit … nicht
  rationale: Gibt die Zweck- beziehungsweise Verhütungsabsicht natürlich und klar wieder.
- source_word: יִשְׁלְחוּ … יְדֵיהֶם
  choice: ihre Hände … ausstrecken
  rationale: Bewahrt das hebräische Körperbild, während der Zusammenhang die aktive Beteiligung an Unrecht erkennen lässt.
- source_word: בְּעַוְלָתָה
  choice: nach Unrecht
  rationale: Passt idiomatisch zu „die Hände ausstrecken“ und umfasst Unrecht, Verkehrtheit und schuldhaftes Handeln, ohne den Sinn unnötig einzuengen.
theological_decisions:
- issue: Art der Zusage über die Herrschaft der Bosheit über die Gerechten
  choice: Die Herrschaft der Bosheit wird nicht dauerhaft auf dem Erbteil der Gerechten liegen.
  alternative: Die Bösen üben überhaupt niemals Herrschaft über die Gerechten aus.
  rationale: Das Verb נוח bezeichnet Ruhen, Sich-Niederlassen oder Bleiben. Daher verneint der Vers am ehesten die Dauerhaftigkeit böser Herrschaft, nicht jede zeitweilige Unterdrückung. Der Zwecksatz erklärt zudem, dass die Begrenzung verhindern soll, dass die Gerechten selbst zum Unrecht greifen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Begründungs- und Zwecksatz, ohne unnatürlich zu wirken. „Zepter“ und „Erbteil“ erhalten die poetische und herrschaftliche Bildsprache; die Fußnoten sichern echte lexikalische Mehrdeutigkeiten.
