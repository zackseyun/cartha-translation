  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הַ/בֹּטְחִ֥ים בַּ/יהוָ֑ה כְּֽ/הַר צִיּ֥וֹן לֹא יִ֝מּ֗וֹט לְ/עוֹלָ֥ם יֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/000.yaml
  text: 'A Song of Ascents[a]. Those who trust in Yahweh are like Mount Zion: it will not be shaken; it abides forever.'
translation:
  language: de
  text: Ein Wallfahrtslied. Die auf Jahwe vertrauen, sind wie der Berg Zion, der nicht wankt[a] und für immer feststeht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der nicht erschüttert wird.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die Überschrift bezeichnet ein Lied der »Aufstiege«; »Wallfahrtslied« gibt die wahrscheinlich gemeinte Verwendung beim Hinaufziehen nach Jerusalem in natürlichem Deutsch wieder.
- source_word: הַבֹּטְחִים בַּיהוָה
  choice: Die auf Jahwe vertrauen
  rationale: Bewahrt den substantivierten Plural und gibt den Gottesnamen יהוה als »Jahwe« wieder.
- source_word: לֹא יִמּוֹט
  choice: Er wird nicht wanken
  rationale: Das Verb bezeichnet ein Wanken, Schwanken oder Erschüttertwerden; die Formulierung bewahrt das Bild von der unerschütterlichen Festigkeit des Berges.
- source_word: לְעוֹלָם יֵשֵׁב
  choice: sondern bleibt für immer bestehen
  rationale: »Bleibt bestehen« überträgt das wörtliche »sitzt/wohnt« im Kontext eines dauerhaft feststehenden Berges verständlich und würdevoll.
theological_decisions:
- issue: Bezug der singularischen Verben
  choice: 'Die Verben werden auf den Berg Zion bezogen: »Er wird nicht wanken …«'
  alternative: Die Aussagen könnten sinngemäß unmittelbar auf die Vertrauenden bezogen und im Plural formuliert werden.
  rationale: Im Hebräischen folgen auf den Vergleich mit dem singularischen »Berg Zion« zwei maskuline Singularformen; der unmittelbare grammatische Bezug ist daher der Berg, während die Zusage durch den Vergleich zugleich den Vertrauenden gilt.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift macht den Eigennamen im Ausgangstext sichtbar und vermeidet, ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich poetisch-würdevolles Standarddeutsch. Der Doppelpunkt erhält die Vergleichsstruktur; »sondern« verbindet die beiden Aussagen idiomatisch, ohne ihre inhaltliche Spannung aufzulösen.
