  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הַ/בֹּטְחִ֥ים בַּ/יהוָ֑ה כְּֽ/הַר צִיּ֥וֹן לֹא יִ֝מּ֗וֹט לְ/עוֹלָ֥ם יֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/001.yaml
  text: A Song of Ascents. Those who trust in Yahweh are like Mount Zion[a], which cannot be shaken, but remains forever.
translation:
  language: de
  text: 'Ein Wallfahrtslied. Wer auf Jahwe vertraut, ist wie der Berg Zion: Er wankt nicht, sondern bleibt für immer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die Überschrift bezeichnet einen der Psalmen 120–134. „Wallfahrtslied“ gibt die mit dem Hinaufziehen verbundene Bedeutung in natürlichem Deutsch wieder.
- source_word: הַבֹּטְחִים
  choice: Wer … vertraut
  rationale: Das substantivierte Partizip bezeichnet allgemein Menschen, deren Haltung durch Vertrauen geprägt ist. Der deutsche Singular „wer“ ermöglicht zugleich die folgende singularische Bildaussage.
- source_word: בַּיהוָה
  choice: auf Jahwe
  rationale: Die Präposition markiert den Gegenstand des Vertrauens; idiomatisch heißt es auf Deutsch „auf jemanden vertrauen“. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: כְּהַר צִיּוֹן
  choice: wie der Berg Zion
  rationale: כְּ leitet einen Vergleich ein; der Ortsname und das Bild bleiben unmittelbar erhalten.
- source_word: לֹא יִמּוֹט
  choice: Er wankt nicht
  rationale: Das Verb מוט bezeichnet hier das Wanken beziehungsweise Erschüttertwerden. „Wankt nicht“ ist knapp, bildhaft und entspricht der hebräischen Verbform besser als eine modale Umschreibung mit „kann nicht“.
- source_word: לְעוֹלָם יֵשֵׁב
  choice: sondern bleibt für immer
  rationale: ישׁב kann sitzen, wohnen oder bleiben bedeuten. Im Zusammenhang mit der Standfestigkeit des Berges vermittelt „bleibt“ die dauerhafte Beständigkeit natürlich; „für immer“ gibt לְעוֹלָם wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug der singularischen Verben יִמּוֹט und יֵשֵׁב
  choice: Sie beziehen sich grammatisch auf den Berg Zion; dessen Beständigkeit charakterisiert im Vergleich zugleich die Vertrauenden.
  alternative: Direkter Wechsel zu den Vertrauenden als gedanklichem Subjekt
  rationale: Das unmittelbar vorausgehende singularische „Berg Zion“ ist der natürliche grammatische Bezug. Die Wirkung des Vergleichs auf die Vertrauenden bleibt bestehen, ohne die Syntax umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelität. Der Doppelpunkt macht die hebräische Bildentfaltung sichtbar; „sondern“ gibt den sachlichen Gegensatz zwischen Nichtwanken und dauerhaftem Bleiben idiomatisch wieder.
