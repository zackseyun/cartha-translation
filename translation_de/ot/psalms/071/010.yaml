  text: For my enemies speak against me[b][a], and those who watch for my life consult together.
translation:
  language: de
  text: Denn meine Feinde reden gegen mich, und die, die auf mein Leben lauern[a], beraten sich miteinander[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die mein Leben bewachen“; dem Sinn nach auch: „die mir nach dem Leben trachten“.'
