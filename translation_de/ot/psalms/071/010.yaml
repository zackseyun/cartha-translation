lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Bitte ein und bewahrt den erklärenden Zusammenhang.
- source_word: אָמְרוּ
  choice: reden
  rationale: Das hebräische Perfekt kann im poetischen Zusammenhang gegenwärtiges beziehungsweise fortdauerndes feindseliges Reden bezeichnen.
- source_word: אוֹיְבַי לִי
  choice: meine Feinde reden gegen mich
  rationale: „Meine Feinde“ gibt das Substantiv direkt wieder; לִי wird im feindseligen Kontext idiomatisch mit „gegen mich“ ausgedrückt.
- source_word: וְשֹׁמְרֵי נַפְשִׁי
  choice: und die, die auf mein Leben lauern
  rationale: שׁמר bezeichnet hier angesichts des feindseligen Kontexts kein beschützendes Bewachen, sondern ein Beobachten mit schädlicher Absicht; נֶפֶשׁ meint hier das bedrohte Leben beziehungsweise die Person.
- source_word: נוֹעֲצוּ יַחְדָּו
  choice: beraten sich miteinander
  rationale: Die Wiedergabe bewahrt den Grundsinn gemeinsamer Beratung, ohne die im Kontext naheliegende Bedeutung „sich verschwören“ bereits in den Haupttext einzutragen.
