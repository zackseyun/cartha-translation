translation:
  language: de
  text: Mögest du meine Größe mehren[a][b] und dich mir wieder zuwenden und mich trösten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du wirst meine Größe mehren und dich mir zuwenden und mich trösten.“ Die hebräischen Imperfektformen können im poetischen Zusammenhang sowohl als Zukunftsaussage als auch als Wunsch oder Bitte verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „meine Größe“; gemeint sein können auch Ehre, Ansehen oder Würde.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „und dich wenden“. Das Verb kann auch ein Sich-Herum- oder Sich-Zurückwenden bezeichnen; im Zusammenhang ist wahrscheinlich eine erneute Zuwendung Gottes zum Beter gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּרֶב
  choice: Mögest du … mehren
  rationale: Der Hifil von רבה bedeutet „groß machen, mehren“. Das Imperfekt kann hier im poetischen Gebet als Wunsch oder Bitte verstanden werden; die deutsche Form mit „mögest“ gibt diese Nuance wieder.
- source_word: גְּדֻלָּתִי
  choice: meine Größe
  rationale: גְּדוּלָּה bezeichnet Größe, hohen Rang, Ehre oder Würde. „Meine Größe“ ist die unmittelbarste Wiedergabe und bewahrt das Wortspiel mit „mehren“, ohne den Sinn vorschnell auf „Ehre“ einzuengen.
- source_word: וְתִסֹּב
  choice: und dich mir wieder zuwenden
  rationale: סבב bedeutet grundsätzlich „sich wenden, umkehren, herumgehen“. Zusammen mit dem folgenden „mich trösten“ liegt hier eine erneute Hinwendung zum Beter nahe. Die Ergänzung „mir“ macht die im Zusammenhang erkennbare Richtung im Deutschen verständlich.
- source_word: תְּנַחֲמֵנִי
  choice: um mich zu trösten
  rationale: Der Piel von נחם bedeutet hier „trösten“. Die Infinitivkonstruktion verbindet das Trösten natürlich mit der vorausgehenden Hinwendung.
theological_decisions:
- issue: Aussageweise der hebräischen Imperfektformen
  choice: 'Als Gebetswunsch: „Mögest du …“'
  alternative: 'Als zuversichtliche Zukunftsaussage: „Du wirst …“'
  rationale: Im poetischen Gebetszusammenhang können die Imperfektformen wunschhaften beziehungsweise jussivischen Sinn haben, aber auch als Zukunftsaussagen gelesen werden. Der Haupttext folgt dem Gebetswunsch; die mögliche Zukunftsaussage wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas ungewohnte Wendung „meine Größe mehren“ bewahrt bewusst die Ausdrucksweise und Bedeutungsbreite des Hebräischen; die Fußnoten erläutern sowohl die mögliche Zukunftslesart als auch die Bildsprache des Sich-Zuwendens.
