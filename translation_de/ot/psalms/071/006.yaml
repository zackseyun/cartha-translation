  text: עָלֶ֤י/ךָ נִסְמַ֬כְתִּי מִ/בֶּ֗טֶן מִ/מְּעֵ֣י אִ֭מִּ/י אַתָּ֣ה גוֹזִ֑/י בְּ/ךָ֖ תְהִלָּתִ֣/י תָמִֽיד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/006.yaml
  text: Upon you I have leaned from the womb; from my mother’s inward parts you are the one who brought me out[a]. In you is my praise continually.
translation:
  language: de
  text: Auf dich habe ich mich gestützt vom Mutterleib an; aus dem Inneren meiner Mutter hast du mich hervorgeholt.[a] Dir gilt stets mein Lob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder glatter: „Aus dem Mutterleib meiner Mutter hast du mich hervorgeholt.“ Im Hebräischen steht hier ein anderes Wort als im vorherigen Satzteil, wörtlich „aus dem Inneren meiner Mutter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ נִסְמַכְתִּי
  choice: Auf dich habe ich mich gestützt
  rationale: Die Formulierung bewahrt das konkrete Bild des Sich-Stützens und bezeichnet zugleich das Vertrauen auf Gott.
- source_word: מִבֶּטֶן
  choice: vom Mutterleib an
  rationale: בטן bezeichnet hier den Mutterleib; „an“ gibt den zeitlichen Ausgangspunkt im Deutschen natürlich wieder.
- source_word: מִמְּעֵי אִמִּי
  choice: aus dem Inneren meiner Mutter
  rationale: מֵעֶה bezeichnet wörtlich die inneren Teile. Die Wiedergabe erhält den Wechsel gegenüber בטן, ohne im Deutschen unnötig anatomisch zu klingen.
- source_word: אַתָּה גוֹזִי
  choice: hast du mich hervorgeholt
  rationale: Das betonte אַתָּה wird durch die Voranstellung des Subjekts im deutschen Teilsatz erkennbar; גוֹזִי beschreibt im Geburtsbild Gottes Herausführen aus dem Mutterleib.
- source_word: בְּךָ תְהִלָּתִי תָמִיד
  choice: Dir gilt stets mein Lob
  rationale: Das knappe בְּךָ bezeichnet Gott als Bezug und Ziel des Lobes. Diese idiomatische Wiedergabe vermeidet das im Deutschen missverständliche „In dir ist mein Lob“ und bewahrt die fortdauernde Aussage von תָמִיד.
theological_decisions:
- issue: Gottes Wirken bei der Geburt
  choice: Gott wird als der angesprochen, der den Beter aus dem Inneren seiner Mutter hervorgeholt hat.
  alternative: Gott wird allgemeiner als der verstanden, der den Beter seit seiner Geburt erhält.
  rationale: Das Geburtsbild und das Partizip גוֹזִי legen Gottes konkrete, fürsorgliche Wirksamkeit beim Hervorkommen nahe; weitergehende dogmatische Aussagen werden nicht eingetragen.
translation_notes:
  register: Moderne, würdige Psalmsprache. Das konkrete Vertrauensbild des Sich-Stützens und die unterschiedliche Wortwahl der beiden Geburtsausdrücke bleiben erhalten; der letzte Satz ist zugunsten natürlichen Deutschen idiomatisch formuliert.
