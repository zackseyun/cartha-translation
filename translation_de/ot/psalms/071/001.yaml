id: PSA.71.1
reference: Psalms 71:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/ךָֽ יְהוָ֥ה חָסִ֑יתִי אַל אֵב֥וֹשָׁה לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame.
translation:
  language: de
  text: Bei dir, Jahwe, habe ich Zuflucht gesucht; lass mich niemals beschämt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/ךָ
  choice: Bei dir
  rationale: Die Präposition ב mit Suffix bezeichnet hier bildhaft den, bei dem Schutz gesucht wird. „Bei dir“ ist im Deutschen natürlicher als das wörtlichere „In dir“ und bewahrt das Zufluchtsmotiv.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: חָסִיתִי
  choice: habe ich Zuflucht gesucht
  rationale: Das Perfekt von חסה bezeichnet das Suchen bzw. Nehmen von Zuflucht als vollzogenen Schritt mit gegenwärtiger Bedeutung; die Formulierung erhält das Schutzbild.
- source_word: אַל אֵבוֹשָׁה
  choice: lass mich … nicht beschämt werden
  rationale: אַל mit der Kohortativform drückt eine verneinte Bitte aus. „Beschämt werden“ erfasst drohende Schande oder ein öffentliches Scheitern besser als bloße innere Verlegenheit.
- source_word: לְ/עוֹלָם
  choice: niemals
  rationale: Mit der Verneinung bedeutet לְעוֹלָם idiomatisch „niemals“; dies ist im Deutschen natürlicher als „nicht für immer“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen, ohne ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
- issue: Art der erbetenen Bewahrung vor Schande
  choice: beschämt werden
  alternative: zuschanden werden
  rationale: Die gewählte Formulierung lässt offen, ob persönliche Beschämung, öffentliche Schande oder enttäuschte Hoffnung im Vordergrund steht. Das traditionellere „zuschanden werden“ wäre ebenfalls möglich, klingt heute jedoch weniger allgemeinverständlich.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die Anrede steht ohne „o“, da dies im heutigen Standarddeutsch natürlicher wirkt; der poetische Parallelismus und das Zufluchtsbild bleiben erhalten.
