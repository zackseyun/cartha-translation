  text: אֱ֭לֹהִים אַל תִּרְחַ֣ק מִמֶּ֑/נִּי אֱ֝לֹהַ֗/י לְ/עֶזְרָ֥תִ/י חיש/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/012.yaml
  text: God[a], do not be far from me; my God, hurry to help me.
translation:
  language: de
  text: Gott, sei mir nicht fern; mein Gott, eile mir zu Hilfe!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Direkte Anrede an Gott. Im modernen Deutschen ist kein zusätzliches »O« nötig.
- source_word: אַל תִּרְחַק
  choice: sei nicht fern
  rationale: Die Bitte mit אַל und der Verbform von רחק wird natürlich und zugleich bildnah wiedergegeben.
- source_word: מִמֶּנִּי
  choice: mir
  rationale: Bei »fern sein« entspricht der deutsche Dativ idiomatisch dem hebräischen Ausdruck »von mir«.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Bewahrt die persönliche Anrede und den possessiven Suffix der ersten Person Singular.
- source_word: לְעֶזְרָתִי
  choice: mir zu Hilfe
  rationale: Gibt wörtlich-natürlich die Zielrichtung »zu meiner Hilfe« wieder.
- source_word: חִישָׁה
  choice: eile
  rationale: Bewahrt den dringlichen Imperativ, ohne das im Hebräischen nicht ausdrücklich stehende Verb »kommen« hinzuzufügen.
theological_decisions:
- issue: Wiederholte Gottesbezeichnung in direkter Anrede
  choice: Gott … mein Gott
  alternative: O Gott … o mein Gott
  rationale: Die Wiederholung und die persönliche Abhängigkeit bleiben erhalten; das zusätzliche »O« wäre möglich, wirkt im heutigen Standarddeutsch jedoch stärker liturgisch und ist im Hebräischen nicht eigens markiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Gebetssprache. Der räumlich-relationale Ausdruck »fern sein« und die Dringlichkeit von »eile« bleiben erhalten.
