  yaml_path: translation/ot/psalms/071/016.yaml
  text: I will come in the mighty deeds of the Lord GOD[a]; I will proclaim your righteousness[c][b], yours alone.
translation:
  language: de
  text: Ich will mit den Machttaten[a] des Herrn, Jahwe, kommen; ich verkünde[b] deine Gerechtigkeit[c], deine allein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Machttaten“. Die Präposition kann instrumental („mit“) oder räumlich beziehungsweise sphärisch („in“) verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ich erwähne“ beziehungsweise „ich erzähle von“. Das hebräische Verb kann „erwähnen“, „in Erinnerung bringen“, „erzählen“ oder „verkünden“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: „Deine Gerechtigkeit“ kann auch als „dein Recht“ oder, auf Gottes Handeln bezogen, als „deine gerechten Taten“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוֹא
  choice: Ich komme
  rationale: Das Qal-Imperfekt von בוא bezeichnet grundlegend ein Kommen, Gehen oder Eintreten. „Ich komme“ bewahrt die offene Bewegungsbedeutung, ohne die dichterische Wendung näher festzulegen.
- source_word: בִּגְבֻרוֹת
  choice: mit den Machttaten
  rationale: Der Plural גְּבוּרוֹת kann nicht nur Kräfte, sondern besonders machtvolle Taten bezeichnen. Die Präposition ב wird hier instrumental mit „mit“ wiedergegeben; die alternative Auffassung als „in“ bleibt in der Fußnote erhalten.
- source_word: אֲדֹנָי יְהוִה
  choice: des Herrn Jahwe
  rationale: Die Wiedergabe unterscheidet den Titel אֲדֹנָי („Herr“) vom ausdrücklich stehenden Gottesnamen יהוה („Jahwe“) und vermeidet die missverständliche Verdoppelung „Herr HERR“.
- source_word: אַזְכִּיר
  choice: ich verkünde
  rationale: Das Hifil von זכר kann „in Erinnerung bringen“, „erwähnen“, „erzählen“ oder „verkünden“ bedeuten. Im Zusammenhang des öffentlichen Gotteslobs ist „verkünden“ natürlich, ohne die weiteren Möglichkeiten auszuschließen.
- source_word: צִדְקָתְךָ
  choice: deine Gerechtigkeit
  rationale: צדקה bezeichnet Gerechtigkeit, kann aber auch Recht oder konkrete gerechte bzw. rettende Taten meinen. „Gerechtigkeit“ erhält den zentralen und zugleich mehrdeutigen Begriff.
- source_word: לְבַדֶּךָ
  choice: deine allein
  rationale: לבדך hebt die Ausschließlichkeit hervor. „Deine allein“ bezieht die Aussage wie im unmittelbaren Satzbau auf Gottes Gerechtigkeit, ohne sie durch eine erklärende Umschreibung zu erweitern.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in der Verbindung אֲדֹנָי יְהוִה
  choice: des Herrn Jahwe
  alternative: GOTT, des Herrn; des Herrn, des HERRN
  rationale: Der hebräische Text verbindet den Herrentitel mit dem persönlichen Gottesnamen. „Herr Jahwe“ hält beide Bestandteile erkennbar auseinander und gibt den Gottesnamen wieder, statt ihn durch einen zweiten Herrentitel zu ersetzen.
- issue: Bedeutungsumfang von צִדְקָה
  choice: Gerechtigkeit
  alternative: Recht; gerechte Taten
  rationale: Der abstrakte Ausdruck wahrt die theologische und poetische Spannung zwischen Gottes gerechtem Wesen, seinem Recht und seinem konkreten gerechten Handeln; der Kontext entscheidet diese Nuancen nicht eindeutig.
translation_notes:
  register: Moderne, würdige Psalmsprache mit knappem poetischem Parallelismus. „Machttaten“ und „Gerechtigkeit“ sind allgemein verständliche, zugleich quellennah gehaltene Schlüsselbegriffe. Die ungewöhnliche, aber klare Schlusswendung „deine allein“ bewahrt die emphatische Exklusivität des Hebräischen.
