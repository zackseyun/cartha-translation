  text: גַּם אֲנִ֤י אוֹדְ/ךָ֣ בִ/כְלִי נֶבֶל֮ אֲמִתְּ/ךָ֪ אֱלֹ֫הָ֥/י אֲזַמְּרָ֣ה לְ/ךָ֣ בְ/כִנּ֑וֹר קְ֝ד֗וֹשׁ יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/022.yaml
  text: I also will praise you with the harp for your faithfulness[a], my God; I will make music to you with the lyre[c][b], Holy One of Israel.
translation:
  language: de
  text: Auch ich will dich mit der Harfe für deine Treue[a] preisen, mein Gott; ich will dir auf der Leier[b] spielen, du Heiliger Israels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für deine Wahrheit“. Das hebräische Wort kann sowohl Wahrheit als auch Treue beziehungsweise Verlässlichkeit bezeichnen. Wörtlicher steht hier nur „deine Treue/Wahrheit“, ohne ein Wort für „für“.'
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: Welche Instrumente mit den beiden hebräischen Begriffen genau gemeint sind und wie sie sich voneinander unterschieden, ist unsicher; traditionell werden sie als „Harfe“ und „Leier“ bezeichnet.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Auch ich
  rationale: גַּם zusammen mit dem selbstständigen Pronomen betont, dass der Beter seinerseits in den Lobpreis einstimmt; „Auch ich“ ist im Deutschen natürlich und bewahrt diese Hervorhebung.
- source_word: אוֹדְךָ
  choice: will dich … preisen
  rationale: ידה im Hifil bezeichnet im gottesdienstlichen Zusammenhang Danken oder Preisen. Der musikalische Parallelismus mit אֲזַמְּרָה spricht hier für „preisen“.
- source_word: בִכְלִי נֶבֶל
  choice: mit der Harfe
  rationale: כְּלִי bezeichnet allgemein ein Gerät oder Instrument und wird durch נֶבֶל näher bestimmt. „Harfe“ ist die traditionelle, verständliche Wiedergabe, obwohl die genaue Bauart des antiken Instruments unsicher ist.
- source_word: אֲמִתְּךָ
  choice: für deine Treue
  rationale: אֱמֶת kann Wahrheit, Verlässlichkeit oder Treue bezeichnen. Im Lob Gottes hebt „Treue“ seine Verlässlichkeit hervor; „Wahrheit“ bleibt als echte lexikalische Möglichkeit in der Fußnote erhalten.
- source_word: אֱלֹהָי
  choice: mein Gott
  rationale: Die Possessivform wird als direkte Anrede wiedergegeben.
- source_word: אֲזַמְּרָה לְךָ
  choice: ich will dir … spielen
  rationale: זמר im Piel bezeichnet musikalisches Loben, Singen oder Spielen. Da unmittelbar ein Instrument genannt wird, bringt „spielen“ die instrumentale Aussage knapp und idiomatisch zum Ausdruck.
- source_word: בְכִנּוֹר
  choice: auf der Leier
  rationale: כִּנּוֹר wird gewöhnlich als „Leier“ wiedergegeben. Die Formulierung unterscheidet das Instrument von נֶבֶל im ersten Halbvers.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: du Heiliger Israels
  rationale: Der göttliche Titel steht hier als Anrede. Das ergänzte „du“ macht die Anredefunktion im modernen Deutschen ohne altertümliches „o“ deutlich.
theological_decisions:
- issue: Bedeutung von אֱמֶת als Eigenschaft Gottes
  choice: Treue
  alternative: Wahrheit
  rationale: Im Zusammenhang mit Gottes rettendem und verlässlichem Handeln ist „Treue“ eine passende kontextuelle Wiedergabe. Da das hebräische Wort ebenso „Wahrheit“ bedeuten kann, wird diese theologisch bedeutsame Mehrdeutigkeit nicht beseitigt, sondern in einer Fußnote ausgewiesen.
- issue: Syntaktische Beziehung von אֲמִתְּךָ zum Lobpreis
  choice: 'als Inhalt beziehungsweise Grund des Preisens: „für deine Treue“'
  alternative: 'appositionell oder als unmarkierter Gegenstand: „deine Treue“'
  rationale: Der hebräische Text stellt „deine Treue“ ohne Präposition nach der Instrumentenangabe. Die deutsche Hauptfassung macht den naheliegenden Sinn idiomatisch deutlich, während die Fußnote die knappere und syntaktisch offenere Form des Hebräischen erkennen lässt.
translation_notes:
  register: Moderne, würdevolle Psalmsprache mit klarer Parallelstruktur. Das Futur mit „will“ gibt den entschlossenen Lobpreis natürlich wieder. „Du Heiliger Israels“ markiert die direkte Anrede ohne altertümliche Interjektion.
