  text: הֱיֵ֤ה לִ֨/י לְ/צ֥וּר מָע֡וֹן לָ/ב֗וֹא תָּמִ֗יד צִוִּ֥יתָ לְ/הוֹשִׁיעֵ֑/נִי כִּֽי סַלְעִ֖/י וּ/מְצוּדָתִ֣/י אָֽתָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/003.yaml
  text: Be for me a rock of refuge[a], to which I may always come; you have commanded salvation for me[b], for you are my crag and my fortress.
translation:
  language: de
  text: Sei mir ein Fels, der mir Zuflucht bietet[a], zu dem ich immer kommen kann. Du hast geboten, mich zu retten[b], denn du bist mein Fels und meine Festung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „ein Fels als Wohnstätte“; möglich ist auch: „ein Fels, eine Zuflucht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Du hast geboten, mich zu retten“; dem Sinn nach möglicherweise: „Du hast bestimmt, mich zu retten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱיֵה לִי
  choice: Sei mir
  rationale: Der Qal-Imperativ ist eine unmittelbare Bitte an Gott; „Sei mir“ bewahrt die knappe, würdevolle Gebetssprache.
- source_word: לְצוּר מָעוֹן
  choice: ein schützender Fels
  rationale: צוּר bezeichnet einen Felsen; מָעוֹן bedeutet gewöhnlich Wohn- oder Zufluchtsort. „Ein schützender Fels“ gibt die Schutzfunktion der Verbindung natürlich wieder, ohne die wörtlichere Alternative zu verschweigen.
- source_word: לָבוֹא תָּמִיד
  choice: zu dem ich immer kommen kann
  rationale: Die Ergänzung „zu dem“ stellt den Bezug zum Felsen her; „immer“ gibt תָּמִיד klar und gegenwärtig wieder.
- source_word: צִוִּיתָ לְהוֹשִׁיעֵנִי
  choice: Du hast geboten, mich zu retten
  rationale: Die Wiedergabe erhält sowohl die starke Bedeutung „gebieten“ als auch die Infinitivkonstruktion „mich zu retten“ und vermeidet ein im Hebräischen nicht ausdrücklich vorhandenes Possessiv.
- source_word: סַלְעִי
  choice: mein Felsmassiv
  rationale: סֶלַע bezeichnet einen Felsen oder eine Felsklippe. „Felsmassiv“ unterscheidet das Wort vom vorherigen צוּר und bewahrt das Bild eines mächtigen natürlichen Schutzes.
- source_word: וּמְצוּדָתִי
  choice: und meine Festung
  rationale: מְצוּדָה bezeichnet eine Festung oder einen befestigten Zufluchtsort; „Festung“ ist anschaulich und idiomatisch.
theological_decisions:
- issue: Ob צִוִּיתָ לְהוֹשִׁיעֵנִי interpretierend als göttliche Bestimmung oder näher am Wortlaut als Gebot wiederzugeben ist
  choice: Du hast geboten, mich zu retten
  alternative: Du hast bestimmt, mich zu retten
  rationale: Das hebräische Verb bedeutet ausdrücklich „gebieten“. Die Hauptfassung erhält diese starke Aussage über Gottes wirksamen Befehl, ohne sie auf ein bestimmtes Lehrsystem festzulegen; die mögliche kontextuelle Nuance „bestimmen“ wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Die felsbezogenen Wörter צוּר und סֶלַע werden durch „Fels“ und „Felsmassiv“ unterschieden. Der erste Satz ist zur besseren Lesbarkeit in zwei Hauptsätze gegliedert; die Bildsprache und die Spannung zwischen wörtlichem „gebieten“ und kontextuellem „bestimmen“ bleiben erhalten.
