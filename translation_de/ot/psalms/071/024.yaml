source:
  edition: WLC
  text: גַּם לְשׁוֹנִ֗/י כָּל הַ֭/יּוֹם תֶּהְגֶּ֣ה צִדְקָתֶ֑/ךָ כִּי בֹ֥שׁוּ כִֽי חָ֝פְר֗וּ מְבַקְשֵׁ֥י רָעָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/024.yaml
  text: My tongue also will speak of your righteousness all day long[a], for those seeking my harm have been put to shame; they have been disgraced.
translation:
  language: de
  text: Auch meine Zunge wird den ganzen Tag von deiner Gerechtigkeit[a] reden; denn beschämt und zuschanden geworden sind die, die mein Unglück suchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von deinem Recht«. Das hebräische Wort kann sowohl Gerechtigkeit als auch gerechtes, insbesondere rettendes Rechtshandeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם לְשׁוֹנִי
  choice: Auch meine Zunge
  rationale: Bewahrt das anschließende »auch« und das konkrete poetische Bild der Zunge.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Gibt die zeitliche Dauer in natürlichem modernem Deutsch wieder.
- source_word: תֶּהְגֶּה
  choice: wird … reden
  rationale: הגה kann Nachsinnen, leises Sprechen oder Äußern bezeichnen. Da die Zunge Subjekt ist, liegt hier hörbares Reden besonders nahe, ohne den meditativen Unterton völlig auszuschließen.
- source_word: צִדְקָתֶךָ
  choice: deiner Gerechtigkeit
  rationale: »Gerechtigkeit« bewahrt im Deutschen die moralische, richterliche und rettend-rechtfertigende Bedeutungsbreite des hebräischen Begriffs.
- source_word: כִּי בֹשׁוּ כִי חָפְרוּ
  choice: denn beschämt und zuschanden geworden sind
  rationale: Die beiden כי-Glieder werden als eng verbundene Begründung verstanden; die zwei verwandten Verben bleiben durch unterschiedliche deutsche Ausdrücke erkennbar.
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: alle, die mein Unglück suchen
  rationale: Gibt die fortdauernde feindliche Absicht der Partizipialform wieder. רָעָה bezeichnet hier das dem Beter zugedachte Unheil oder Unglück.
theological_decisions:
- issue: Bedeutungsumfang von צִדְקָתֶךָ
  choice: deiner Gerechtigkeit
  alternative: deinem Recht / deiner rettenden Gerechtigkeit
  rationale: Der Haupttext wahrt die Breite des Begriffs, der Gottes Rechtschaffenheit, gerechtes Handeln und rettendes Eintreten umfassen kann, ohne den Kontext auf nur einen Aspekt festzulegen.
- issue: Ausgang der Gegner
  choice: beschämt und zuschanden geworden
  alternative: sind beschämt und zuschanden
  rationale: Die hebräischen Perfektformen werden als eingetretener Zustand mit fortwirkendem Ergebnis wiedergegeben; eine genauere zeitliche Einordnung erzwingt der Vers nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Körpermetapher. Die leicht markierte Schlussstellung »geworden sind« hält die beiden Schambegriffe zusammen und trägt dem poetischen Parallelismus Rechnung.
