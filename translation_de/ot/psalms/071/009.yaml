  text: אַֽל תַּ֭שְׁלִיכֵ/נִי לְ/עֵ֣ת זִקְנָ֑ה כִּ/כְל֥וֹת כֹּ֝חִ֗/י אַֽל תַּעַזְבֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/009.yaml
  text: Do not cast me off in the time of old age[a]; when my strength fails[c][b], do not forsake me.
translation:
  language: de
  text: Verwirf mich nicht im Alter[a]; wenn meine Kraft schwindet[b], verlass mich nicht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wirf mich nicht weg.“ Das hebräische Verb kann Wegwerfen oder Verstoßen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wenn meine Kraft zu Ende geht“ oder „aufgebraucht ist“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Lass mich nicht im Stich.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: verwirf mich
  rationale: Das Hifil von שלך bezeichnet hier ein Wegwerfen beziehungsweise Verstoßen. „Verwirf mich“ bewahrt das Bild der Zurückweisung und entspricht dem würdevollen Gebetston.
- source_word: לְעֵת זִקְנָה
  choice: in der Zeit des Alters
  rationale: עֵת bezeichnet eine Zeit oder Lebensphase, זִקְנָה das Alter. Die Formulierung bildet beide Bestandteile ab und ist im Deutschen verständlich und gehoben.
- source_word: כִּכְלוֹת
  choice: wenn … schwindet
  rationale: Der Infinitiv von כלה mit כִּ führt einen zeitlichen Umstand ein und beschreibt das Zur-Neige-Gehen. „Wenn … schwindet“ gibt den fortschreitenden Verlust natürlich wieder.
- source_word: כֹּחִי
  choice: meine Kraft
  rationale: כֹּחַ bezeichnet Kraft, Stärke oder Leistungsvermögen; im Zusammenhang mit dem Alter ist „Kraft“ die naheliegende deutsche Entsprechung.
- source_word: תַּעַזְבֵנִי
  choice: verlass mich nicht
  rationale: עזב kann „verlassen“, „im Stich lassen“ oder „aufgeben“ bedeuten. „Verlass mich nicht“ ist direkt, natürlich und für ein heutiges Gebet angemessen.
- source_word: אַל
  choice: nicht
  rationale: אַל mit der entsprechenden Verbform drückt eine verneinte Bitte aus; im Deutschen wird sie idiomatisch als Imperativ mit „nicht“ wiedergegeben.
theological_decisions:
- issue: Charakter der Bitte angesichts von Alter und nachlassender Kraft
  choice: Eine unmittelbare Bitte an Gott, den Betenden im Alter und bei schwindender Kraft nicht zu verwerfen oder zu verlassen
  alternative: Eine allgemeine Klage über Leid ohne besondere Betonung des Alters
  rationale: Der hebräische Text nennt ausdrücklich die Zeit des Alters und das Schwinden der eigenen Kraft. Die Übersetzung wahrt diese konkrete Abhängigkeit von Gott, ohne weitergehende Lehrannahmen einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in einem würdevollen, eindringlichen Gebetston. Die parallelen Bitten des hebräischen Verses bleiben erhalten; die Bildlichkeit des Verwerfens und das allmähliche Nachlassen der Kraft werden natürlich wiedergegeben.
