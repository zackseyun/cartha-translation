source:
  edition: WLC
  text: כְּ֭/מוֹפֵת הָיִ֣יתִי לְ/רַבִּ֑ים וְ֝/אַתָּ֗ה מַֽחֲסִ/י עֹֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/007.yaml
  text: I have become like a portent to many[a], but you are my strong refuge.
translation:
  language: de
  text: Für viele bin ich wie ein Wunderzeichen geworden[a]; doch du bist meine starke Zuflucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Wunder“, „ein Zeichen“, „ein Vorzeichen“ oder „ein Gegenstand des Staunens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹפֵת
  choice: wie ein Wunderzeichen
  rationale: מוֹפֵת bezeichnet ein auffälliges Zeichen, Wunder oder Vorzeichen. „Wunderzeichen“ bewahrt die Breite zwischen Zeichenhaftigkeit und Staunen, ohne die Wirkung eindeutig positiv oder bedrohlich festzulegen; כְּ wird mit „wie“ wiedergegeben.
- source_word: הָיִיתִי
  choice: bin ich … geworden
  rationale: Das Qatal von היה beschreibt hier natürlich einen entstandenen Zustand, der bis in die Gegenwart des Beters fortbesteht.
- source_word: לְרַבִּים
  choice: für viele
  rationale: Die Präposition לְ bezeichnet hier die vielen Menschen, denen der Beter als Wunderzeichen erscheint. „Für viele“ ist im Deutschen idiomatisch und bleibt nahe am Hebräischen.
- source_word: מַחֲסִי
  choice: meine Zuflucht
  rationale: מַחֲסֶה bezeichnet einen schützenden Zufluchtsort. „Meine Zuflucht“ erhält das Schutzbild knapp und natürlich.
- source_word: עֹז
  choice: starke
  rationale: עֹז bedeutet Stärke oder Macht. Die hebräische Verbindung מַחֲסִי עֹז („meine Zuflucht der Stärke“) wird idiomatisch als „meine starke Zuflucht“ wiedergegeben.
theological_decisions:
- issue: Bedeutungsweite von מוֹפֵת im Blick auf die öffentliche Lage des Beters
  choice: Der Beter ist für viele zu einem auffälligen Wunderzeichen geworden, dessen Wirkung nicht eindeutig als positiv, bedrohlich oder bloß erstaunlich festgelegt wird.
  alternative: Der Beter gilt entweder als bewundernswertes Wunder, als unheilvolles Vorzeichen oder lediglich als Gegenstand des Staunens.
  rationale: Der hebräische Ausdruck lässt diese Nuancen offen. „Wunderzeichen“ und die Fußnote bewahren diese Spannung, statt sie in eine bestimmte Deutung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Voranstellung „Für viele“ bildet den öffentlichen Blick auf den Beter deutlich ab; „doch“ gibt den Kontrast zur schützenden Zuflucht bei Gott natürlich wieder.
