  terminology: „Jahwe“ ist eine etablierte deutsche Umschrift des Gottesnamens; „Herr Jahwe“ wahrt die beiden hebräischen Bestandteile. „Zuversicht“ ist für מִבְטַחִי eine natürliche und ausreichend offene Wiedergabe. Die Fußnoten bieten sachgerechte Alternativen, und ihre Anker stehen bei den jeweils erläuterten Ausdrücken.
