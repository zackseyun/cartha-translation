id: PSA.71.5
reference: Psalms 71:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי אַתָּ֥ה תִקְוָתִ֑/י אֲדֹנָ֥/י יְ֝הוִ֗ה מִבְטַחִ֥/י מִ/נְּעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/005.yaml
  text: For you are my hope[a], Lord Yahweh[c][b], my confidence from my youth.
translation:
  language: de
  text: Denn du bist meine Hoffnung, Herr Jahwe[a], meine Zuversicht[b] von meiner Jugend an.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Herr Jahwe“; traditionell auch „Herr HERR“ oder „Herr, der HERR“.'
    reason: Der Ausgangstext verbindet den Hoheitstitel אֲדֹנָי mit dem Gottesnamen יְהוִה.
  - marker: b
    text: 'Oder: „mein Vertrauen“; auch der Sinn „meine Sicherheit“ ist möglich.'
    reason: מִבְטָח kann sowohl die vertrauende Zuversicht als auch den Grund der Sicherheit bezeichnen.
  - marker: c
    text: 'Oder: „seit meiner Jugend“.'
    reason: Die hebräische Präposition bezeichnet den zeitlichen Ausgangspunkt.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die umgebende Bitte; „Denn“ gibt diese Funktion im Gebetsstil natürlich wieder.
- source_word: אַתָּה
  choice: du
  rationale: Das ausdrücklich gesetzte Personalpronomen wird beibehalten und betont die direkte Anrede Gottes.
- source_word: תִקְוָתִי
  choice: meine Hoffnung
  rationale: Das Substantiv bezeichnet Hoffnung oder Erwartung; „meine Hoffnung“ ist hier präzise, natürlich und theologisch nicht einengend.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  rationale: Die Wiedergabe bewahrt sowohl den Hoheitstitel אֲדֹנָי als auch den Gottesnamen יְהוִה, ohne beide zu einem einzigen Ausdruck zu verschmelzen.
- source_word: מִבְטַחִי
  choice: meine Zuversicht
  rationale: Das Wort bezeichnet das, worauf man vertraut, beziehungsweise Vertrauen und Sicherheit. „Meine Zuversicht“ passt idiomatisch zu „meine Hoffnung“ und lässt den persönlichen Vertrauensbezug erkennen.
- source_word: מִנְּעוּרָי
  choice: von meiner Jugend an
  rationale: Die Präposition מִן bezeichnet hier den Ausgangspunkt eines über lange Zeit bestehenden Vertrauens; die gewählte Wendung bildet dies im Deutschen klar ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוִה zusammen mit אֲדֹנָי
  choice: Herr Jahwe
  alternative: Herr HERR; Herr, der HERR
  rationale: „Herr Jahwe“ macht sowohl den Titel als auch den Eigennamen sichtbar. Die Alternativen entsprechen verbreiteter Bibeltradition, verdecken jedoch, dass im Hebräischen der Gottesname steht.
- issue: Art des Vertrauensausdrucks מִבְטַחִי
  choice: meine Zuversicht
  alternative: mein Vertrauen; meine Sicherheit
  rationale: „Zuversicht“ wahrt den Bezug auf Gott als Grund des Vertrauens, ohne den Ausdruck ausschließlich als innere Haltung oder ausschließlich als Schutzort festzulegen.
translation_notes:
  register: Moderner, würdevoller Gebetsstil. Die parallelen Nominalausdrücke „meine Hoffnung“ und „meine Zuversicht“ folgen der knappen poetischen Struktur des Hebräischen; „von meiner Jugend an“ klingt gehoben, bleibt aber allgemein verständlich.
