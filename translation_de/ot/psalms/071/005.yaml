  source_fidelity: Der Text gibt כִּי als begründendes „Denn“ treffend wieder und erhält das ausdrücklich gesetzte „du“. „Meine Hoffnung“ entspricht תִּקְוָתִי, „meine Zuversicht“ gibt מִבְטַחִי angemessen wieder, und „von meiner Jugend an“ bewahrt den durch מִן bezeichneten zeitlichen Ausgangspunkt. „Herr Jahwe“ macht die Verbindung von אֲדֹנָי und יְהוָה sichtbar, ohne eine zusätzliche theologische Deutung einzutragen.
