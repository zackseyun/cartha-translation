  text: לֵ֭/אמֹר אֱלֹהִ֣ים עֲזָב֑/וֹ רִֽדְפ֥וּ וְ֝/תִפְשׂ֗וּ/הוּ כִּי אֵ֥ין מַצִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/011.yaml
  text: saying[a], “God has forsaken him; pursue and seize him, for there is no one to rescue him.”
translation:
  language: de
  text: 'Sie sagen: »Gott hat ihn verlassen[a]. Verfolgt und ergreift ihn, denn niemand ist da, der ihn rettet!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aufgegeben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: Sie sagen
  rationale: Der Infinitiv von אמר leitet hier idiomatisch die wörtliche Rede ein. Im Deutschen gibt ein finiter Satz die Diskursfunktion natürlich wieder; aus dem Zusammenhang sind die feindlichen Sprecher erkennbar.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das formal pluralische Substantiv bezeichnet wegen des singularischen Verbs eindeutig den einen Gott.
- source_word: עֲזָבוֹ
  choice: hat ihn verlassen
  rationale: Das Qal-Perfekt mit Objektsuffix bezeichnet ein vollzogenes Verlassen mit gegenwärtiger Auswirkung. »Verlassen« ist im Deutschen natürlich, gewichtig und bewahrt den Klang der Klage.
- source_word: רִדְפוּ
  choice: Verfolgt
  rationale: Der pluralische Imperativ von רדף fordert zur feindlichen Verfolgung auf, ohne die Handlung unnötig näher zu bestimmen.
- source_word: וְתִפְשׂוּהוּ
  choice: und ergreift ihn
  rationale: Der pluralische Imperativ von תפשׂ mit Objektsuffix bedeutet, jemanden zu packen oder zu ergreifen. »Ergreift« bleibt anschaulich, ohne die speziellere Bedeutung »gefangen nehmen« festzulegen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für die vorausgehenden Aufforderungen ein.
- source_word: אֵין מַצִּיל
  choice: niemand ist da, der ihn rettet
  rationale: אֵין verneint das Vorhandensein, und das Hifil-Partizip מַצִּיל bezeichnet einen Retter beziehungsweise jemanden, der rettet. Die Formulierung bewahrt diesen persönlichen Sinn in natürlichem Deutsch.
theological_decisions:
- issue: Aussage der Feinde über Gottes Verlassen
  choice: Gott hat ihn verlassen
  alternative: Gott hat ihn aufgegeben
  rationale: Die Worte werden als Behauptung der Gegner wiedergegeben, nicht als theologische Bestätigung des Psalmisten. »Verlassen« erhält die Schwere und Spannung der Klage, ohne zu behaupten, Gott habe den Leidenden tatsächlich endgültig aufgegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist knapp und eindringlich; »verlassen« wahrt den vertrauten Klageklang, während Syntax und Wortwahl für heutige Leser verständlich bleiben.
