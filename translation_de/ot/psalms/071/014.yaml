  text: But as for me[a], I will continually hope[c][b], and I will add to all your praise.
translation:
  language: de
  text: Ich aber werde immer hoffen und dein Lob noch weiter vermehren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »und zu all deinem Lob noch mehr hinzufügen.« Das Hebräische spricht wörtlich davon, dem ganzen Lob Gottes etwas hinzuzufügen beziehungsweise es zu mehren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Die Verbindung aus Konjunktion und selbstständigem Pronomen hebt den Sprecher kontrastierend hervor; »Ich aber« gibt dies im Deutschen knapp und natürlich wieder.
- source_word: תָּמִיד
  choice: immer
  rationale: Das Adverb bezeichnet fortdauernde Beständigkeit. »Immer« ist verständlich, würdig und passt zur anhaltenden Hoffnung.
- source_word: אֲיַחֵל
  choice: werde … hoffen
  rationale: Das Piel von יחל bezeichnet hoffendes, erwartungsvolles Warten. Die Zukunftsform gibt hier die fortdauernde Zuversicht beziehungsweise den Entschluss des Beters wieder.
- source_word: וְהוֹסַפְתִּי
  choice: und … noch mehr hinzufügen
  rationale: יסף bedeutet hinzufügen oder vermehren. »Noch mehr hinzufügen« bewahrt das hebräische Bild und macht zugleich den Gedanken der Steigerung im Deutschen deutlich.
- source_word: עַל כָּל תְּהִלָּתֶךָ
  choice: zu all deinem Lob
  rationale: עַל bezeichnet nach יסף das Hinzufügen zu etwas. תְּהִלָּה meint hier das Gott geltende beziehungsweise ihm zukommende Lob; die Wiedergabe hält die ungewöhnliche Weite von כָּל fest.
theological_decisions:
- issue: Bezug von תְּהִלָּתֶךָ
  choice: deinem Lob
  alternative: deinen Ruhmestaten
  rationale: Der Ausdruck kann das Gott geltende Lob oder metonymisch seine lobenswerten Taten bezeichnen. Der Haupttext wahrt die unmittelbarere Bedeutung »Lob«, ohne den Vers auf eine Aufzählung göttlicher Taten festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Der Kontrast am Versanfang und das hebräische Bild des Hinzufügens werden bewahrt; die Satzstellung bleibt flüssig und ohne konfessionell geprägte Zusätze.
