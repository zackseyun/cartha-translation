source:
  edition: WLC
  text: אֲשֶׁ֤ר הראית/נו צָר֥וֹת רַבּ֗וֹת וְ/רָ֫ע֥וֹת תָּשׁ֥וּב תחיי/נו וּֽ/מִ/תְּהֹמ֥וֹת הָ֝/אָ֗רֶץ תָּשׁ֥וּב תַּעֲלֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/020.yaml
  text: You[a], who have made us see many troubles and calamities, will return and revive us[d][c][b]; and from the depths of the earth you will return and bring me up.
translation:
  language: de
  text: Du, der du uns viele schlimme Nöte hast sehen lassen[a], wirst uns wieder beleben[b][c]; aus den Tiefen der Erde[d] wirst du mich wieder heraufholen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der du uns viele schlimme Nöte gezeigt hast“. Das hebräische Verb ist kausativ und kann bedeuten, dass Gott sie sehen oder erfahren ließ.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Wort kann hier „wieder“ bedeuten: „wirst uns wieder beleben“. Es steht auch im folgenden Satz und wird dort ebenfalls mit „wieder“ wiedergegeben.'
    reason: lexical_note
  - marker: c
    text: 'Der hebräische Text wechselt von „uns“ zu „mich“: „uns wieder beleben … mich wieder heraufholen“.'
    reason: textual_note
  - marker: d
    text: „Aus den Tiefen der Erde“ kann bildlich äußerste Erniedrigung oder Todesnähe bezeichnen und zugleich an den Bereich des Grabes anklingen.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: der du
  rationale: Leitet einen auf Gott bezogenen Relativsatz ein und entspricht natürlichem, würdevollem Deutsch.
- source_word: הראיתנו
  choice: hast sehen lassen
  rationale: Bewahrt die kausative Bedeutung des Hifil von ראה deutlicher als das mögliche „gezeigt hast“.
- source_word: צָרוֹת רַבּוֹת וְרָעוֹת
  choice: viele Nöte und schlimme Zeiten
  rationale: Gibt zahlreiche schwere Leiderfahrungen verständlich wieder; רָעוֹת bezeichnet hier Unheil beziehungsweise Bedrängnisse, nicht moralisch böse Taten.
- source_word: תָּשׁוּב
  choice: wirst dich wieder zu uns wenden / wirst ... wieder
  rationale: שוב erscheint zweimal. Im ersten Satz ist „sich wieder zuwenden“ im Deutschen idiomatisch; beim zweiten Vorkommen hält „wieder“ die Wiederholungsstruktur erkennbar, ohne ein unnatürliches „zurückkehren und heraufholen“ zu erzwingen.
- source_word: תחיינו
  choice: uns neu beleben
  rationale: Das Piel von חיה bezeichnet die Wiederherstellung von Leben oder Lebenskraft, ohne zwingend eine leibliche Auferstehung festzulegen.
- source_word: וּמִתְּהֹמוֹת הָאָרֶץ
  choice: aus den Tiefen der Erde
  rationale: Bewahrt das räumliche und poetische Bild der Tiefen beziehungsweise Abgründe.
- source_word: תַּעֲלֵנִי
  choice: mich ... heraufholen
  rationale: Gibt das kausative Hifil von עלה und die Aufwärtsbewegung aus den Tiefen natürlich wieder.
- source_word: נו ... ני
  choice: uns ... mich
  rationale: Bewahrt den Wechsel des masoretischen Textes von der ersten Person Plural zur ersten Person Singular.
theological_decisions:
- issue: Ob רָעוֹת als moralisch „Böses“ oder als erfahrenes Unheil wiederzugeben ist
  choice: schlimme Zeiten als Leiderfahrungen
  alternative: Böses; Unglück; Katastrophen
  rationale: Der Zusammenhang handelt von erlittenen Bedrängnissen. Die Formulierung vermeidet die zusätzliche Behauptung, Gott tue moralisch Böses, ohne seine Rolle in der Leiderfahrung abzuschwächen.
- issue: Ob „aus den Tiefen der Erde“ ausdrücklich als Auferstehungsaussage zu übersetzen ist
  choice: Das Bild unverändert offenhalten
  alternative: aus dem Grab auferwecken; auferstehen lassen
  rationale: Das Hebräische kann äußerste Erniedrigung, Todesnähe oder den Bereich des Grabes anklingen lassen. Eine ausdrücklich leibliche Auferstehung wäre enger als der Wortlaut.
- issue: Gottes Verhältnis zu den erfahrenen Nöten
  choice: Die kausative Form „hast sehen lassen“ bewahren
  alternative: bei vielen Nöten geholfen hast; viele Nöte zugelassen hast
  rationale: Der Ausgangstext formuliert Gottes Beteiligung kausativ. „Zugelassen“ oder eine reine Hilfsaussage würde die Spannung interpretierend abschwächen.
translation_notes:
  register: Modernes Standarddeutsch mit poetisch-würdigem Ton. Die Anrede „Du, der du“ bewahrt die feierliche Relativkonstruktion. Die Formulierung bleibt verständlich, erhält aber den Personenwechsel und die offene Bildsprache des Hebräischen.
