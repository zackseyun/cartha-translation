  text: וְ/גַ֤ם עַד זִקְנָ֨ה וְ/שֵׂיבָה֮ אֱלֹהִ֪ים אַֽל תַּעַ֫זְבֵ֥/נִי עַד אַגִּ֣יד זְרוֹעֲ/ךָ֣ לְ/ד֑וֹר לְ/כָל יָ֝ב֗וֹא גְּבוּרָתֶֽ/ךָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/018.yaml
  text: Even to old age and gray hairs[a], O God, do not forsake me, until I declare your arm to the next generation[b], your might to everyone who is to come.
translation:
  language: de
  text: Auch wenn ich alt und grau bin, Gott, verlass mich nicht, bis ich der nächsten Generation deinen Arm[a] verkünde und allen, die noch kommen werden[b], deine Macht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „deinen Arm“; ein Bild für Gottes wirksame Kraft oder Macht.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „allen künftigen Generationen“.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „deine Machttaten“. Das hebräische Wort kann sowohl Macht als auch machtvolle Taten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Setzt die Bitte aus dem Zusammenhang nachdrücklich fort; „auch“ gibt die einschließende beziehungsweise steigernde Kraft knapp und natürlich wieder.
- source_word: עַד זִקְנָה וְשֵׂיבָה
  choice: bis ins Alter, bis die Haare grau sind
  rationale: Bewahrt sowohl die zeitliche Grenze von עַד als auch das konkrete Bild des grauen Haars in natürlichem modernem Deutsch.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Steht als direkte Anrede; im Deutschen ist kein zusätzliches Anredepartikel nötig.
- source_word: אַל תַּעַזְבֵנִי
  choice: verlass mich nicht
  rationale: Gibt die Bitte schlicht und würdig wieder, ohne die Bedeutung gegenüber „aufgeben“ oder „im Stich lassen“ unnötig zuzuspitzen.
- source_word: עַד אַגִּיד
  choice: bis ich … verkünde
  rationale: Drückt sowohl die gewünschte Dauer von Gottes Beistand als auch das öffentliche Weitersagen aus.
- source_word: זְרוֹעֲךָ
  choice: deinen Arm
  rationale: Bewahrt das hebräische Körperbild für Gottes wirksame Kraft, statt es bereits im Haupttext auszudeuten.
- source_word: לְדוֹר
  choice: der nächsten Generation
  rationale: Bezeichnet im Zusammenhang das nachfolgende Geschlecht; „Generation“ ist heute klar und idiomatisch.
- source_word: לְכָל יָבוֹא
  choice: allen, die noch kommen werden
  rationale: Gibt die kollektive Bedeutung von כָל mit dem singularischen Partizip beziehungsweise Verb wieder und lässt den Blick über eine einzelne Generation hinausreichen.
- source_word: גְּבוּרָתֶךָ
  choice: deine Macht
  rationale: Erfasst die Bedeutung von Stärke beziehungsweise machtvollem Handeln und ergänzt das Bild vom Arm, ohne es zu wiederholen.
theological_decisions:
- issue: Soll das Bild von Gottes Arm erhalten oder unmittelbar als Kraft gedeutet werden?
  choice: Das Bild bleibt im Haupttext als „deinen Arm“ erhalten.
  alternative: „deine Kraft“ oder „deine Macht“
  rationale: Der hebräische Text spricht bildhaft von Gottes Arm als seiner wirksamen Macht. Die Beibehaltung wahrt die poetische und theologische Bildsprache.
- issue: Wie weit reicht der künftige Adressatenkreis in לְדוֹר ... לְכָל יָבוֹא?
  choice: Zunächst „der nächsten Generation“, dann weiter gefasst „allen, die noch kommen werden“.
  alternative: „einer Generation … jeder kommenden Generation“ beziehungsweise „allen künftigen Generationen“
  rationale: Die Wiedergabe erhält die Bewegung vom unmittelbar nachfolgenden Geschlecht zu einem umfassenderen künftigen Publikum, ohne beide Wendungen gleichzusetzen.
- issue: Bezeichnet גְּבוּרָה eine Eigenschaft oder machtvolle Taten?
  choice: „deine Macht“ lässt die Eigenschaft im Vordergrund stehen.
  alternative: „deine Machttaten“ oder „deine mächtigen Taten“
  rationale: Das hebräische Wort kann Stärke, Macht oder deren machtvolle Erweise bezeichnen. Der Haupttext folgt der naheliegenden attributiven Lesart; die andere Möglichkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Die konkrete Bildsprache des Hebräischen bleibt erhalten; erklärungsbedürftige Mehrdeutigkeiten werden knapp in Fußnoten ausgewiesen.
