  yaml_path: translation/ot/psalms/071/008.yaml
  text: My mouth will be filled with your praise[b][a], with your splendor all day long.
translation:
  language: de
  text: Mein Mund wird den ganzen Tag erfüllt sein von deinem Lob[a], von deinem Glanz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Mein Mund ist erfüllt“ oder „Möge mein Mund erfüllt sein“. Das hebräische Imperfekt kann hier als Zukunft, Gegenwart oder Wunsch verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Oder „Herrlichkeit“, „Pracht“, „Schönheit“ oder „Majestät“.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלֵא
  choice: soll erfüllt sein
  rationale: Das Nifal-Imperfekt von מלא lässt im poetischen Zusammenhang Zukunft, Gegenwart oder einen jussivischen Wunsch zu. „Soll erfüllt sein“ bewahrt im Deutschen die mögliche Gebets- bzw. Wunschform, ohne sie als Befehl zu formulieren; andere Nuancen werden in der Fußnote genannt.
- source_word: פִי
  choice: mein Mund
  rationale: Die konkrete hebräische Metapher für das ausgesprochene Lob bleibt erhalten und klingt auch im Deutschen natürlich.
- source_word: תְּהִלָּתֶךָ
  choice: deinem Lob
  rationale: Das Substantiv mit Suffix bezeichnet hier am natürlichsten das Lob, das Gott gilt bzw. von ihm handelt.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Diese geläufige deutsche Wendung gibt die zeitliche Dauer klar und natürlich wieder.
- source_word: תִּפְאַרְתֶּךָ
  choice: deinem Glanz
  rationale: תפארת kann Herrlichkeit, Schönheit, Pracht oder Majestät bezeichnen. „Glanz“ ist poetisch, verständlich und wahrt die bildhafte Eigenständigkeit gegenüber „Lob“.
theological_decisions:
- issue: Modalität von יִמָּלֵא
  choice: 'jussivisch-wünschend: „soll erfüllt sein“'
  alternative: „wird erfüllt sein“, „ist erfüllt“ oder „möge erfüllt sein“
  rationale: Der hebräische Imperfekt ist in diesem poetischen Kontext mehrdeutig. Der Haupttext wählt eine natürliche deutsche Wunschform; die Fußnote hält die anderen möglichen Zeit- und Modalitätswerte ausdrücklich offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Körpermetapher „mein Mund“ und die Parallelstruktur des Hebräischen bleiben erhalten. Die Wiederholung von „von“ verdeutlicht, dass sowohl Gottes Lob als auch sein Glanz den Mund bzw. die Rede des Beters erfüllen.
