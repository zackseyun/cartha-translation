  text: אֱֽלֹהַ֗/י פַּ֭לְּטֵ/נִי מִ/יַּ֣ד רָשָׁ֑ע מִ/כַּ֖ף מְעַוֵּ֣ל וְ/חוֹמֵץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/004.yaml
  text: My God[a], rescue me from the hand of the wicked[c][b], from the grasp of the unjust and violent man.
translation:
  language: de
  text: Mein Gott, rette mich aus der Hand des Frevlers, aus dem Griff dessen, der Unrecht tut und Gewalt ausübt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Mein Gott
  rationale: Direkte Anrede mit Suffix der 1. Person Singular; im modernen Deutschen natürlich und würdig.
- source_word: פַּלְּטֵנִי
  choice: rette mich
  rationale: Der Imperativ von פלט bezeichnet Befreiung aus konkreter Gefahr; „rette mich“ ist prägnant und gegenwärtig.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Bewahrt das hebräische Bild für Macht oder Verfügungsgewalt und ist im Deutschen verständlich.
- source_word: רָשָׁע
  choice: des Frevlers
  rationale: Das substantivierte Adjektiv bezeichnet hier singularisch einen schuldhaft bösen Menschen; „Frevler“ entspricht dem poetischen Register der Psalmen.
- source_word: מִכַּף
  choice: aus dem Griff
  rationale: כף bedeutet wörtlich „Handfläche“, bezeichnet in diesem Zusammenhang aber den beherrschenden Zugriff; „Griff“ gibt das Bild natürlich wieder.
- source_word: מְעַוֵּל
  choice: dessen, der Unrecht tut
  rationale: Das Partizip beschreibt einen Menschen, der verkehrt oder ungerecht handelt; die verbale Wiedergabe ist klar und erhält den aktiven Sinn.
- source_word: וְחוֹמֵץ
  choice: und Gewalt ausübt
  rationale: Das Partizip bezeichnet gewalttätiges beziehungsweise unterdrückerisches Handeln. Die koordinierte Verbform bezieht beide Beschreibungen natürlich auf dieselbe Person.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Bildsprache. Der Parallelismus von „Hand“ und „Griff“ bleibt erkennbar; die beiden abschließenden Partizipien werden als Beschreibungen derselben singularischen Person wiedergegeben.
