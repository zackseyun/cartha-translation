source:
  edition: WLC
  text: וְ/צִדְקָתְ/ךָ֥ אֱלֹהִ֗ים עַד מָ֫ר֥וֹם אֲשֶׁר עָשִׂ֥יתָ גְדֹל֑וֹת אֱ֝לֹהִ֗ים מִ֣י כָמֽוֹ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/019.yaml
  text: And your righteousness[a], O God, reaches to the heights—you who have done great things. O God[b], who is like you?
translation:
  language: de
  text: Und deine Gerechtigkeit[a], Gott, reicht bis in die Höhe[b] – du, der du Großes getan hast. Gott, wer ist wie du?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein gerechtes Handeln“. Das hebräische Wort kann je nach Zusammenhang Gerechtigkeit oder gerechtes Handeln bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „bis zur Höhe“; möglicherweise ist die Himmelshöhe gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/צִדְקָתְ/ךָ
  choice: Und deine Gerechtigkeit
  rationale: צדקה bezeichnet hier umfassend Gottes moralische Gerechtigkeit und kann zugleich den Aspekt seines gerechten Handelns einschließen. „Gerechtigkeit“ bewahrt diese Breite besser als das enger wirkende „Recht“.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv steht an beiden Stellen als direkte Anrede. Im modernen Deutschen bringt „Gott“ den Vokativ natürlich zum Ausdruck, ohne das altertümliche „o Gott“ zu benötigen.
- source_word: עַד מָרוֹם
  choice: reicht bis in die Höhe
  rationale: Die räumliche Metapher „bis zur Höhe“ beschreibt die unermessliche Reichweite der göttlichen Gerechtigkeit. Die Wiedergabe vermeidet es, מָרוֹם ohne Not ausdrücklich als „Himmel“ festzulegen.
- source_word: אֲשֶׁר עָשִׂיתָ גְדֹלוֹת
  choice: du hast Großes getan
  rationale: אֲשֶׁר leitet formal einen Relativsatz ein; nach der Höhenangabe ist der Bezug im Hebräischen jedoch syntaktisch mehrdeutig. Ein Gedankenstrich und ein selbstständiger Satz bewahren den poetischen Übergang, ohne Gott unnatürlich als Bezugswort über die eingeschobene Höhenphrase hinweg zu konstruieren.
- source_word: גְדֹלוֹת
  choice: Großes
  rationale: Das substantivisch gebrauchte feminine Pluraladjektiv bezeichnet große Taten oder Dinge. „Großes“ ist knapp, idiomatisch und lässt die inhaltliche Breite bestehen.
- source_word: מִי כָמוֹךָ
  choice: wer ist wie du?
  rationale: Die geläufige deutsche Form bewahrt die rhetorische Frage und ihre Aussage von Gottes Unvergleichlichkeit.
theological_decisions:
- issue: Bedeutung von צדקה als Eigenschaft Gottes
  choice: Gerechtigkeit
  alternative: Recht; gerechtes Handeln
  rationale: Der Kontext preist sowohl Gottes Wesen als auch seine großen Taten. „Gerechtigkeit“ hält den umfassenden moralischen und relationalen Sinn offen, ohne den Ausdruck auf richterliche Rechtsprechung zu verengen.
- issue: Bezugsfunktion von אֲשֶׁר
  choice: 'poetischer Anschluss als selbstständiger Satz: „du hast Großes getan“'
  alternative: 'Relativsatz: „der du Großes getan hast“; kausaler Anschluss: „denn du hast Großes getan“'
  rationale: Die hebräische Relativpartikel erlaubt einen engen Anschluss, doch die genaue syntaktische Zuordnung ist nicht eindeutig. Die gewählte Zeichensetzung erhält die sachliche Verbindung, ohne eine kausale Deutung hinzuzufügen oder die Spannung künstlich aufzulösen.
translation_notes:
  register: Moderne, würdige Psalmenrede mit klarer Syntax. Die direkte Anrede wird ohne altertümliches „o“ wiedergegeben. „Großes“ erhält die poetische Kürze des Hebräischen; die beiden Fußnoten markieren echte lexikalische Offenheit.
