source:
  edition: WLC
  text: אֱֽלֹהִ֗ים לִמַּדְתַּ֥/נִי מִ/נְּעוּרָ֑/י וְ/עַד הֵ֝֗נָּה אַגִּ֥יד נִפְלְאוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/017.yaml
  text: God[a], you have taught me from my youth, and to this day I declare your wondrous deeds.
translation:
  language: de
  text: Gott, du hast mich von Jugend an gelehrt, und bis heute verkünde ich deine Wundertaten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Wunder“ oder „deine wunderbaren Werke“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv steht hier aufgrund der folgenden Formen der zweiten Person am natürlichsten als direkte Anrede; im modernen Deutschen ist „Gott“ ohne zusätzliches „O“ würdig und unmittelbar.
- source_word: לִמַּדְתַּנִי
  choice: du hast mich … gelehrt
  rationale: Der Piel von למד mit Suffix der ersten Person Singular bezeichnet das Lehren oder Unterweisen. Das Perfekt gibt die seit der Jugend erfahrene Unterweisung mit fortdauernder Bedeutung wieder.
- source_word: מִנְּעוּרָי
  choice: von Jugend an
  rationale: Diese geläufige deutsche Wendung gibt den Ausgangspunkt in den Jugendjahren präzise und natürlich wieder.
- source_word: וְעַד הֵנָּה
  choice: und bis heute
  rationale: Wörtlich bezeichnet die Wendung das Erreichen des gegenwärtigen Zeitpunkts („bis hierher/bis jetzt“); „bis heute“ ist im Deutschen idiomatisch und passt zum zeitlichen Rückblick.
- source_word: אַגִּיד
  choice: verkünde ich
  rationale: Der Hifil von נגד bedeutet „mitteilen, kundtun, verkünden“. Die deutsche Präsensform lässt sich als gegenwärtiges und fortgesetztes Bekennen verstehen, ohne den Ausdruck unnötig zu verstärken.
- source_word: נִפְלְאוֹתֶיךָ
  choice: deine Wundertaten
  rationale: Das Wort bezeichnet Gottes außergewöhnliche, staunenswerten Taten. „Wundertaten“ wahrt den Handlungsbezug und klingt im Deutschen natürlicher und konkreter als das abstraktere „Wunder“.
theological_decisions:
- issue: Direkte Anrede Gottes
  choice: „Gott, du hast mich … gelehrt“
  alternative: Eine Aussage über Gott statt einer Anrede
  rationale: Die Verb- und Pronominalformen der zweiten Person zeigen, dass der Psalmist Gott direkt anspricht. Diese Gebetsform wird bewahrt, ohne zusätzliche theologische Deutung einzutragen.
- issue: Zeitlicher bzw. modaler Wert von אַגִּיד
  choice: „verkünde ich“
  alternative: „will ich verkünden“ oder „werde ich verkünden“
  rationale: Die hebräische Imperfektform kann je nach Zusammenhang gegenwärtig-fortdauernd, künftig oder willentlich verstanden werden. Im Rückblick „von Jugend an … bis heute“ liegt eine gegenwärtige, fortgesetzte Verkündigung nahe; die Alternativen bleiben grammatisch möglich.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Ton. „Von Jugend an“ und „bis heute“ bilden einen natürlichen zeitlichen Bogen; „Wundertaten“ bewahrt den konkreten Bezug auf Gottes außergewöhnliches Handeln.
