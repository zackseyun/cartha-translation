source:
  edition: WLC
  text: תְּרַנֵּ֣נָּ֣ה שְׂ֭פָתַ/י כִּ֣י אֲזַמְּרָה לָּ֑/ךְ וְ֝/נַפְשִׁ֗/י אֲשֶׁ֣ר פָּדִֽיתָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/023.yaml
  text: My lips will shout for joy when I sing praise to you[a], and my soul[c][b], which you have redeemed.
translation:
  language: de
  text: Meine Lippen werden jubeln[a], wenn ich dir lobsinge, und auch meine Seele[b], die du erlöst[c] hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »freudig singen«; das hebräische Verb kann sowohl jubelnden Gesang als auch einen lauten Freudenruf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mein Leben« oder »mein ganzes Ich«; das hebräische Wort kann die Seele, das Leben oder die ganze Person bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »freigekauft« oder »befreit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַנֵּנָּה
  choice: werden jubeln
  rationale: Das intensive Verb bezeichnet einen klingenden Freudenruf oder jubelnden Gesang. »Jubeln« wahrt die poetische Offenheit zwischen Rufen und Singen.
- source_word: שְׂפָתַי
  choice: meine Lippen
  rationale: Die konkrete Körpermetapher des Hebräischen bleibt erhalten und passt natürlich zur laut geäußerten Freude.
- source_word: כִּי
  choice: wenn
  rationale: Die Partikel kann begründen oder die Gelegenheit bezeichnen. Im Zusammenhang gibt »wenn« die Beziehung der beiden Aussagen natürlich wieder, ohne die mögliche begründende Nuance völlig auszuschließen.
- source_word: אֲזַמְּרָה לָּךְ
  choice: ich dir lobsinge
  rationale: זמר bezeichnet hier musikalisches Gotteslob; »dir lobsingen« ist knapp, würdig und bewahrt Gott als Adressaten.
- source_word: וְנַפְשִׁי
  choice: und auch meine Seele
  rationale: נפשׁ kann Seele, Leben oder die ganze Person meinen. »Seele« bewahrt hier den poetischen Kontrast zwischen den Lippen und dem inneren beziehungsweise ganzen Selbst; »auch« verdeutlicht die koordinierte Fortführung des Verbs.
- source_word: פָּדִיתָ
  choice: du erlöst hast
  rationale: פדה bezeichnet das Loskaufen oder Befreien aus Not und Gefangenschaft. »Erlöst« erhält die heilsgeschichtliche Tragweite, ohne den Vorgang enger zu bestimmen.
theological_decisions:
- issue: Bedeutung von פדה als Grund des Lobes
  choice: erlöst
  alternative: freigekauft; befreit
  rationale: »Erlöst« umfasst Gottes rettendes Handeln und bewahrt dessen theologische Tiefe, ohne eine bestimmte spätere Erlösungslehre in den Vers hineinzulesen.
- issue: Bezug des Jubelns auf Lippen und Seele
  choice: Das Prädikat »werden jubeln« wird sinngemäß auch auf »meine Seele« bezogen.
  alternative: Den zweiten Satzteil als elliptische, stärker abgesetzte Aussage wiedergeben.
  rationale: Die hebräische Koordination legt nahe, dass sowohl die Lippen als auch die Seele am Jubel beteiligt sind. Das eingefügte »auch« macht diese Ellipse im Deutschen verständlich.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit dichterisch-würdigem Klang. Die konkrete Bildsprache »meine Lippen« und die traditionelle, hier weiterhin natürliche Wendung »dir lobsingen« bleiben erhalten. Sämtliche Fußnotenmarker stehen an der jeweils einschlägigen Stelle im Haupttext.
