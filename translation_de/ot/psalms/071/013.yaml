source:
  edition: WLC
  text: יֵבֹ֣שׁוּ יִכְלוּ֮ שֹׂטְנֵ֪י נַ֫פְשִׁ֥/י יַֽעֲט֣וּ חֶ֭רְפָּה וּ/כְלִמָּ֑ה מְ֝בַקְשֵׁ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/013.yaml
  text: Let those who are hostile to my life be put to shame and come to an end[b][a]; let those who seek my harm be clothed with reproach and disgrace.
translation:
  language: de
  text: Die mein Leben anfeinden,[a] sollen beschämt werden und ein Ende nehmen;[b] die mein Unglück suchen, sollen sich mit Schmach und Schande bekleiden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »die meine Seele anfeinden«; das hebräische Wort bezeichnet hier wahrscheinlich das Leben oder die eigene Person.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zugrunde gehen« beziehungsweise »aufgerieben werden« statt »ein Ende nehmen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: Beschämt sollen sie werden
  rationale: Die vorangestellte Soll-Konstruktion gibt den jussivisch-verwünschenden Gebetscharakter wieder und lässt sowohl öffentliches Zuschandenwerden als auch empfundene Beschämung anklingen.
- source_word: יִכְלוּ
  choice: ein Ende nehmen
  rationale: Die Wendung bewahrt die breite Bedeutung von כלה, ohne eindeutig körperliche Vernichtung festzulegen.
- source_word: שֹׂטְנֵי נַפְשִׁי
  choice: die mein Leben anfeinden
  rationale: Das Partizip von שטן bezeichnet feindseliges Vorgehen; נֶפֶשׁ meint hier wahrscheinlich das Leben beziehungsweise die eigene Person und nicht ausschließlich eine immaterielle Seele.
- source_word: יַעֲטוּ
  choice: mit ... sollen sich kleiden
  rationale: Die Formulierung erhält das Bild des Umhüllens oder Bekleidens und ist mit den abstrakten Substantiven im Deutschen verständlich.
- source_word: חֶרְפָּה וּכְלִמָּה
  choice: Schmach und Schande
  rationale: Das feste, würdige Wortpaar bewahrt die verstärkende Verbindung zweier naher Begriffe aus dem Bedeutungsfeld öffentlicher Erniedrigung.
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: die mein Unglück suchen
  rationale: רָעָה kann hier das beabsichtigte Böse, Unheil oder Unglück für den Beter bezeichnen; die Formulierung erhält das aktive feindliche Trachten.
theological_decisions:
- issue: Jussivisch-imprekatorische Aussage
  choice: Die Verben werden als Gebetswunsch mit vorangestelltem „sollen“ wiedergegeben.
  alternative: 'Die Verben als Zukunftsaussage wiederzugeben: „Sie werden beschämt werden ...“'
  rationale: Im poetischen Gebetszusammenhang sind die Imperfektformen am besten als Wunsch beziehungsweise Bitte zu verstehen, ohne die Spannung des Vergeltungswunsches abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener poetischer Parallelität. Die Soll-Konstruktionen markieren den Gebetswunsch; die Metapher des Sich-Kleidens bleibt bewusst sichtbar.
