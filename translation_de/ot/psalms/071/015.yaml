source:
  edition: WLC
  text: פִּ֤/י יְסַפֵּ֬ר צִדְקָתֶ֗/ךָ כָּל הַ/יּ֥וֹם תְּשׁוּעָתֶ֑/ךָ כִּ֤י לֹ֖א יָדַ֣עְתִּי סְפֹרֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/015.yaml
  text: My mouth will recount your righteousness and your salvation all day long[b][a], for I do not know their number.
translation:
  language: de
  text: Mein Mund wird den ganzen Tag von deiner Gerechtigkeit[a] und deiner Rettung erzählen, denn ich kenne ihre Zahl nicht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinem Recht“ oder „deinen gerechten Taten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist: Gottes gerechte und rettende Taten sind zu zahlreich, um sie zählen zu können.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: Mein Mund
  rationale: Die wörtliche Wendung bleibt erhalten, weil der hebräische Text den Mund als Werkzeug des Lobens hervorhebt.
- source_word: יְסַפֵּר
  choice: wird … erzählen
  rationale: Das Piel von ספר bezeichnet hier ausführliches Erzählen oder Berichten und greift zugleich das Motiv des Zählens am Versende auf.
- source_word: צִדְקָתֶךָ
  choice: deine Gerechtigkeit
  rationale: Die Wiedergabe bewahrt das abstrakte Singularnomen und damit die Spannung zwischen Gottes Eigenschaft und seinem gerechten Handeln.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Dies ist eine natürliche moderne deutsche Wiedergabe der fortdauernden Zeitangabe.
- source_word: תְּשׁוּעָתֶךָ
  choice: deine Rettung
  rationale: „Rettung“ gibt das hebräische Nomen direkt und im Deutschen verständlich wieder; „Heil“ wäre möglich, ist aber weniger konkret.
- source_word: כִּי לֹא יָדַעְתִּי סְפֹרוֹת
  choice: denn ich kenne ihre Zahl nicht
  rationale: Die Formulierung erhält den kausalen Zusammenhang und das Bild der nicht feststellbaren Zahl, ohne die gemeinten Erweise von Gerechtigkeit und Rettung ausdrücklich in den Haupttext einzutragen.
theological_decisions:
- issue: Soll צִדְקָתֶךָ eine abstrakte Eigenschaft oder konkrete gerechte Taten bezeichnen?
  choice: deine Gerechtigkeit
  alternative: deine gerechten Taten; dein Recht
  rationale: Das hebräische Singularnomen bezeichnet unmittelbar „Gerechtigkeit“, kann im Psalmzusammenhang aber Gottes gerechtes und rettendes Handeln einschließen. Diese Bedeutungsbreite bleibt erhalten.
- issue: Worauf bezieht sich die nicht bekannte Zahl?
  choice: Die Zahl der Erweise von Gottes Gerechtigkeit und Rettung bleibt im Haupttext nur erschließbar.
  alternative: denn ich kann deine gerechten und rettenden Taten nicht zählen
  rationale: Der hebräische Text nennt die Taten nicht ausdrücklich. Die offenere Formulierung wahrt seine knappe Bildsprache; die naheliegende Deutung wird in einer Fußnote erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mein Mund“ bewahrt die poetische Ausdrucksweise; die Stellung von „den ganzen Tag“ bezieht die Zeitangabe natürlich auf beide Gegenstände des Erzählens.
