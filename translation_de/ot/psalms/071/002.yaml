  language: en
  yaml_path: translation/ot/psalms/071/002.yaml
  text: In your righteousness rescue me and deliver me[a]; incline your ear to me and save me.
translation:
  language: de
  text: In deiner Gerechtigkeit[a] rette mich und befreie mich; neige dein Ohr zu mir und rette mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Durch deine Gerechtigkeit“; „Gerechtigkeit“ kann hier auch im Sinn von „Recht“ verstanden werden.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: בְּצִדְקָתְךָ
  choice: in deiner Gerechtigkeit
  rationale: Das Präfix ב kann hier den Bereich bzw. die Grundlage („in“) oder das Mittel („durch“) bezeichnen. „In deiner Gerechtigkeit“ bewahrt die knappe hebräische Formulierung und den Bezug auf Gottes gerechtes, verlässliches Wesen.
- source_word: תַּצִּילֵנִי
  choice: rette mich
  rationale: Das Hifil von נצל bezeichnet das Retten oder Herausreißen aus Gefahr. „Rette mich“ ist im Deutschen unmittelbar und natürlich.
- source_word: וּתְפַלְּטֵנִי
  choice: und befreie mich
  rationale: Das Piel von פלט bedeutet, jemanden entkommen zu lassen oder in Sicherheit zu bringen. „Befreie mich“ unterscheidet den Ausdruck vom vorhergehenden Rettungsverb und erhält zugleich den Parallelismus.
- source_word: הַטֵּה
  choice: neige
  rationale: Der Imperativ von נטה bildet zusammen mit „Ohr“ die bildhafte Bitte um aufmerksames Hören. „Neige“ erhält dieses poetische Bild in würdiger, verständlicher Sprache.
- source_word: אָזְנְךָ
  choice: dein Ohr
  rationale: Das konkrete Körperbild des Hebräischen wird bewahrt, statt es zu dem abstrakteren „höre“ zu verflachen.
- source_word: וְהוֹשִׁיעֵנִי
  choice: und hilf mir
  rationale: Das Hifil von ישׁע bezeichnet rettendes Eingreifen. „Hilf mir“ ist in deutschen Psalmgebeten eine natürliche Wiedergabe und vermeidet die unmittelbare Wiederholung von „rette mich“, ohne den Sinn auf bloße allgemeine Unterstützung zu beschränken.
theological_decisions:
- issue: Bedeutung von צְדָקָה in der Bitte an Gott
  choice: Gerechtigkeit
  alternative: Recht; durch deine Gerechtigkeit
  rationale: „Gerechtigkeit“ umfasst hier Gottes aufrechtes und verlässliches Wesen als Grundlage seines rettenden Handelns. „Recht“ ist möglich, könnte den Ausdruck jedoch stärker auf richterliches Handeln verengen. Auch die instrumentale Auffassung der Präposition („durch“) bleibt möglich und wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Psalmsprache mit bewahrter Körpermetapher. Die drei verwandten Rettungsverben werden im Deutschen als „rette“, „befreie“ und „hilf“ differenziert, ohne ihre inhaltliche Nähe aufzuheben.
