base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/019.yaml
  text: If only you would kill the wicked[a], O God, and you men of blood, depart from me.
translation:
  language: de
  text: Wenn du doch den Gottlosen töten würdest, Gott! Und ihr Männer des Blutes[a], weicht von mir!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Männer des Blutes“; eine hebräische Bezeichnung für gewalttätige oder mörderische Männer.'
    reason: Erklärt das hebräische Idiom, ohne das im Haupttext bewahrte Sprachbild aufzulösen.
lexical_decisions:
- source_word: אִם
  choice: Wenn du doch
  rationale: Am Anfang dieses Wunschsatzes hat אִם optative Bedeutung. „Wenn du doch“ gibt den dringlichen Wunsch im heutigen Deutsch natürlich wieder.
- source_word: תִּקְטֹל
  choice: töten würdest
  rationale: Das Qal-Imperfekt, verbunden mit dem optativen אִם, bezeichnet hier die von Gott gewünschte Handlung; der Konjunktiv II bildet diese Nuance ab.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Das Substantiv steht als direkte Anrede. Im Deutschen kennzeichnen Wortstellung und Ausrufezeichen den Vokativ, ohne das altertümliche „o“ zu benötigen.
- source_word: רָשָׁע
  choice: den Gottlosen
  rationale: Der morphologische Singular bleibt erhalten. Er kann generisch verstanden werden, wird aber nicht vorschnell in einen Plural aufgelöst.
- source_word: וְאַנְשֵׁי דָמִים
  choice: Ihr Männer des Blutes
  rationale: Die direkte Anrede und das eindrückliche hebräische Bild werden bewahrt; die idiomatische Bedeutung wird in der Fußnote erklärt. Das וְ leitet in diesem Zusammenhang den anschließenden Anruf ein und muss nicht mechanisch mit „und“ wiedergegeben werden.
- source_word: סוּרוּ
  choice: weicht
  rationale: Der Pluralimperativ von סור ist eine direkte Aufforderung, sich zu entfernen. „Weicht von mir“ ist verständlich und dem würdevollen Register angemessen.
- source_word: מֶנִּי
  choice: von mir
  rationale: Die Präposition mit dem Suffix der ersten Person Singular wird unmittelbar wiedergegeben.
theological_decisions:
- issue: Soll der Wunsch nach der Tötung des Gottlosen abgeschwächt werden?
  choice: Der imprekatorische Wunsch wird als direkte Bitte an Gott unverändert deutlich wiedergegeben.
  alternative: Die Aussage als bloße Vorhersage des Gerichts oder abgeschwächt als Bitte um ein unbestimmtes Eingreifen wiederzugeben.
  rationale: Der hebräische Text verwendet ausdrücklich קטל, „töten“, und formuliert einen Wunsch. Die Übersetzung bewahrt diese theologische Spannung, statt sie für heutige Leser aufzulösen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die energische Wunschaussage und der anschließende Befehl bleiben erhalten; das hebräische Blut-Bild wird im Text bewahrt und in einer knappen Fußnote erläutert.
