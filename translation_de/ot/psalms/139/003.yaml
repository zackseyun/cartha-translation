  text: You sift out my path and my lying down[a], and you are acquainted with all my ways.
translation:
  language: de
  text: Meinen Weg und mein Ruhen siebst du[a]; mit allen meinen Wegen bist du vertraut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du prüfst meinen Weg und mein Ruhen genau.“ Das hebräische Verb bezeichnet eigentlich das Worfeln oder Sieben und vermittelt hier das Bild sorgfältiger Prüfung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרְחִי
  choice: meinen Weg
  rationale: Das Substantiv bezeichnet einen Pfad oder Weg. „Weg“ bewahrt das konkrete Bild und kann zugleich den Lebenswandel andeuten.
- source_word: רִבְעִי
  choice: mein Ruhen
  rationale: Die Form bezeichnet das Sichhinlegen oder Ruhen. „Mein Ruhen“ ist im Deutschen natürlich und erhält den Gegensatz zwischen Unterwegssein und Ruhe, ohne einen bestimmten Ruheort einzutragen.
- source_word: זֵרִיתָ
  choice: siebst du
  rationale: Das Verb trägt das Bild des Worfelns beziehungsweise Siebens und bezeichnet hier eine sorgfältige Prüfung. Die bildhafte Wiedergabe bewahrt die Konkretheit des Hebräischen; eine Fußnote erläutert den übertragenen Sinn.
- source_word: כָל
  choice: all
  rationale: Der umfassende Quantor wird direkt wiedergegeben und betont die Gesamtheit der Wege.
- source_word: דְּרָכַי
  choice: meinen Wegen
  rationale: „Wege“ erhält sowohl das konkrete Wegbild als auch die mögliche übertragene Bedeutung des Verhaltens oder Lebenswandels.
- source_word: הִסְכַּנְתָּה
  choice: bist du vertraut
  rationale: Die Form drückt gründliche Vertrautheit aus. „Mit … bist du vertraut“ ist gegenwärtiges, idiomatisches Deutsch und vermeidet eine abstrakte dogmatische Erweiterung.
theological_decisions:
- issue: Anthropomorphes Bild für Gottes umfassende Kenntnis
  choice: Das konkrete Bild des Siebens und die Rede von den Wegen bleiben erhalten.
  alternative: Die Bildsprache zu „du prüfst“ oder „du kennst“ verallgemeinern.
  rationale: Der Vers beschreibt Gottes genaue Kenntnis poetisch durch alltägliche, körperliche Bilder. Die Übersetzung erhält diese Spannung, ohne daraus eine zusätzliche Lehrformulierung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener poetischer Bildsprache. Die ungewöhnliche Verbindung „Weg … siebst“ folgt dem hebräischen Bild und wird durch die Fußnote verständlich gemacht.
