source:
  edition: WLC
  text: וּ/רְאֵ֗ה אִם דֶּֽרֶךְ עֹ֥צֶב בִּ֑/י וּ֝/נְחֵ֗/נִי בְּ/דֶ֣רֶךְ עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/024.yaml
  text: And see whether there is any grievous way in me[b][a], and lead me in the everlasting way.
translation:
  language: de
  text: Und sieh, ob ein Weg des Schmerzes in mir ist[a], und leite mich auf dem ewigen Weg[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein verletzender Weg“, „ein anstößiger Weg“; möglicherweise auch: „ein götzendienerischer Weg“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf dem Weg von alters her“ oder „auf dem immerwährenden Weg“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאֵה
  choice: Und sieh
  rationale: Der Qal-Imperativ setzt die an Gott gerichtete Bitte aus dem vorherigen Vers fort; „sieh“ ist direkt, natürlich und würdevoll.
- source_word: אִם
  choice: ob
  rationale: אִם leitet hier im Gebetszusammenhang eine indirekte Frage ein; im Deutschen entspricht dem idiomatisch „ob“.
- source_word: דֶּרֶךְ
  choice: Weg
  rationale: „Weg“ bewahrt sowohl das Bild eines Pfades als auch die in den Psalmen häufige Bedeutung einer Lebensführung.
- source_word: עֹצֶב
  choice: schmerzbringender
  rationale: Das Substantiv kann Schmerz, Kränkung oder etwas Verletzendes bezeichnen. „Schmerzbringend“ hält die moralische und erfahrungsbezogene Weite offen, ohne vorschnell „götzendienerisch“ oder allgemein „böse“ festzulegen.
- source_word: בִּי
  choice: in mir
  rationale: Die Präpositionalverbindung bezeichnet unmittelbar etwas, das im Inneren des Beters vorhanden sein könnte.
- source_word: וּנְחֵנִי
  choice: und leite mich
  rationale: נחה bedeutet führen oder leiten; „leite mich“ passt zum Gebetston und zum Bild des Weges.
- source_word: בְּדֶרֶךְ
  choice: auf dem … Weg
  rationale: Im natürlichen Deutschen wird das Geführtwerden mit dem Wegbild idiomatisch durch „auf dem Weg“ ausgedrückt.
- source_word: עוֹלָם
  choice: ewigen
  rationale: עוֹלָם kann unbeschränkte Dauer, ferne Zeit oder Altertümlichkeit bezeichnen. „Ewig“ bringt hier den bleibenden, von Gott gewiesenen Weg zum Ausdruck, während andere zeitliche Nuancen in der Fußnote erhalten bleiben.
theological_decisions:
- issue: Bedeutung von דֶּרֶךְ עֹצֶב
  choice: ein schmerzbringender Weg
  alternative: ein verletzender, anstößiger oder götzendienerischer Weg
  rationale: Die schwierige Wortverbindung bezeichnet wahrscheinlich eine Lebensweise, die Schmerz, Verletzung oder Kummer hervorruft. Die Hauptfassung wahrt diese breite Bedeutung und verengt sie nicht unbegründet auf Götzendienst.
- issue: Bedeutung von דֶּרֶךְ עוֹלָם
  choice: der ewige Weg
  alternative: der Weg von alters her; der immerwährende Weg
  rationale: Die Wendung stellt dem schmerzbringenden Weg einen bleibenden, an Gott ausgerichteten Weg gegenüber. „Ewig“ bewahrt die zeitliche Tiefe und theologische Spannung, ohne die mögliche Bedeutung „von alters her“ zu verschweigen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Das durchgehende Wegbild des Hebräischen bleibt erhalten; seltene oder konfessionell festgelegte Deutungen werden nicht in den Haupttext übernommen.
