  text: אֽוֹדְ/ךָ֗ עַ֤ל כִּ֥י נוֹרָא֗וֹת נִ֫פְלֵ֥יתִי נִפְלָאִ֥ים מַעֲשֶׂ֑י/ךָ וְ֝/נַפְשִׁ֗/י יֹדַ֥עַת מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/014.yaml
  text: I praise you[a], because I am fearfully and wonderfully made; wonderful are your works[b], and my soul knows it very well.
translation:
  language: de
  text: Ich preise dich, denn ich bin auf ehrfurchtgebietende und wunderbare Weise geschaffen[a]. Wunderbar sind deine Werke, und meine Seele[b] weiß es sehr wohl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auf ehrfurchtgebietende Weise bin ich wunderbar.“ „Ehrfurchtgebietend“ meint hier staunenswert und Ehrfurcht weckend, nicht erschreckend. „Geschaffen“ ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „meine Seele“; gemeint sein können auch „ich selbst“ oder „mein Innerstes“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹדְךָ
  choice: Ich preise dich
  rationale: Das Hifil von ידה bezeichnet häufig Danken oder Preisen. Im poetischen Zusammenhang des Lobes für Gottes Schöpfungswerk gibt „ich preise dich“ die doxologische Aussage natürlich wieder; „ich danke dir“ bleibt möglich.
- source_word: עַל כִּי
  choice: denn
  rationale: Die Wortverbindung leitet den Grund des Lobpreises ein. „Denn“ gibt diesen kausalen Zusammenhang in gehobenem, natürlichem Deutsch wieder.
- source_word: נוֹרָאוֹת
  choice: auf ehrfurchtgebietende Weise
  rationale: Das Wort bezeichnet etwas, das Staunen und ehrfürchtige Scheu hervorruft, nicht etwas bloß Beängstigendes. Die adverbiale Wendung bewahrt diesen Sinn im Deutschen.
- source_word: נִפְלֵיתִי
  choice: bin ich … wunderbar geschaffen
  rationale: Das Nifal von פלא bezeichnet hier ein wunderbares oder außergewöhnliches Sein. „Geschaffen“ wird aus dem unmittelbaren Zusammenhang von Gottes Formung des Menschen in den Versen 13–16 ergänzt und ergibt eine klare deutsche Formulierung, ohne die lexikalische Besonderheit zu verschweigen.
- source_word: נִפְלָאִים
  choice: Wunderbar
  rationale: Das Wort beschreibt Gottes Werke als außergewöhnlich und staunenswert. „Wunderbar“ bewahrt zudem die sprachliche Verbindung zur vorausgehenden Aussage.
- source_word: מַעֲשֶׂיךָ
  choice: deine Werke
  rationale: מַעֲשֶׂה kann Werke, Taten oder Geschaffenes bezeichnen. „Deine Werke“ ist weit genug, um sowohl Gottes Schöpfungshandeln als auch die Formung des Beters einzuschließen.
- source_word: וְנַפְשִׁי
  choice: und meine Seele
  rationale: נֶפֶשׁ kann die Seele, das eigene Selbst, das Leben oder das innere Wesen meinen. „Meine Seele“ erhält das poetische Bild; eine Fußnote hält den weiteren hebräischen Bedeutungsumfang offen.
- source_word: יֹדַעַת מְאֹד
  choice: weiß es sehr wohl
  rationale: Das feminine Verb stimmt mit נַפְשִׁי überein. Das im Hebräischen unausgesprochene Objekt wird durch „es“ natürlich aufgenommen; „sehr wohl“ gibt מְאֹד nachdrücklich wieder.
theological_decisions:
- issue: Anthropologische Bedeutung von נֶפֶשׁ
  choice: „meine Seele“ im Haupttext, mit „ich selbst/mein Innerstes“ als Alternativen in der Fußnote
  alternative: „ich selbst“ oder „mein Innerstes“ unmittelbar im Haupttext
  rationale: Die poetische und introspektive Redeweise wird mit „meine Seele“ bewahrt. Die Fußnote verhindert zugleich, dass dem hebräischen Ausdruck zwingend eine strikte Trennung von Körper und Seele unterstellt wird.
- issue: Implizites Schöpfungshandeln in נִפְלֵיתִי
  choice: „wunderbar geschaffen“
  alternative: „wunderbar/außergewöhnlich bin ich“
  rationale: Das Verb selbst bedeutet nicht ausdrücklich „schaffen“, doch der unmittelbare Kontext spricht von Gottes Formung des Beters. Die Ergänzung ergibt verständliches Deutsch; die Fußnote dokumentiert die formnähere Möglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Satzstellung in „Wunderbar sind deine Werke“. Die Formulierung bleibt gut verständlich, bewahrt den Lobcharakter und markiert durch Fußnoten die semantische Weite von נֶפֶשׁ sowie die kontextuelle Ergänzung „geschaffen“.
