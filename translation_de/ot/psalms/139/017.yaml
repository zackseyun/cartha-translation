  text: וְ/לִ֗/י מַה יָּקְר֣וּ רֵעֶ֣י/ךָ אֵ֑ל מֶ֥ה עָ֝צְמוּ רָאשֵׁי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/017.yaml
  text: And to me[a], how precious are your thoughts, O God[b]; how vast is the sum of them!
translation:
  language: de
  text: Und wie kostbar sind mir deine Gedanken[a], Gott! Wie groß ist ihre Zahl![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Freunde“ beziehungsweise „die dir lieb sind“. Die hebräische Form lässt diese Deutung zu; der Zusammenhang mit dem Zählen und der unermesslichen Menge in Vers 18 spricht jedoch für „deine Gedanken“.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „ihre Köpfe“. Gemeint ist hier wahrscheinlich ihre Summe oder Gesamtzahl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי
  choice: Und … sind mir
  rationale: Die Verbindung aus Konjunktion, Präposition und Suffix bezeichnet die persönliche, hervorgehobene Perspektive des Beters. Die deutsche Wortstellung gibt sowohl den Anschluss als auch den persönlichen Bezug natürlich wieder.
- source_word: מַה / מֶה
  choice: wie
  rationale: Beide Formen leiten hier Ausrufe ein; das deutsche „wie“ entspricht dieser exklamativen Funktion.
- source_word: יָּקְרוּ
  choice: kostbar sind
  rationale: Das Verb bezeichnet hier hohen Wert beziehungsweise Kostbarkeit. „Kostbar“ bewahrt den staunenden, wertschätzenden Ton.
- source_word: רֵעֶיךָ
  choice: deine Gedanken
  rationale: Die Form kann auch als „deine Freunde“ beziehungsweise „die dir lieb sind“ verstanden werden. Der unmittelbare Zusammenhang mit Zählen und unermesslicher Menge in Vers 18 spricht jedoch für „Gedanken“.
- source_word: אֵל
  choice: Gott
  rationale: אֵל steht als direkte Anrede. Im modernen Deutschen ist „Gott!“ als Vokativ natürlich und würdevoll; ein zusätzliches „o“ ist nicht erforderlich.
- source_word: עָצְמוּ
  choice: gewaltig ist
  rationale: Das Verb kann Stärke, Größe oder große Zahl ausdrücken. Zusammen mit רָאשֵׁיהֶם und dem folgenden Motiv des Zählens bezeichnet es hier die ungeheure Größe der Gesamtheit.
- source_word: רָאשֵׁיהֶם
  choice: ihre Summe
  rationale: Wörtlich steht „ihre Köpfe“. Im Kontext ist eine Gesamtzahl beziehungsweise Summe gemeint; „ihre Summe“ gibt das Idiom verständlich wieder.
theological_decisions:
- issue: Bedeutung von רֵעֶיךָ
  choice: deine Gedanken
  alternative: deine Freunde / die dir lieb sind
  rationale: Das Zählen in Vers 18 und die parallele Aussage über die gewaltige Summe stützen die abstrakte Lesart „Gedanken“. Da die hebräische Form eine personenbezogene Deutung zulässt, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Ausrufstruktur. „Gott“ wird ohne archaisierendes „o“ als direkte Anrede wiedergegeben. Die genuine lexikalische Mehrdeutigkeit wird nicht im Haupttext überladen, sondern transparent in der Fußnote dokumentiert.
