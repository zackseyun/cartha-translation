  text: You know my sitting down and my rising up[b][a]; you understand my thought from afar.
translation:
  language: de
  text: Du weißt, wann ich mich setze und wann ich aufstehe; du verstehst meinen Gedanken[a] von fern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Absicht“ oder „mein Vorhaben“.'
    reason: lexical_alternative
  - marker: b
    text: „Von fern“ kann räumliche Entfernung meinen oder darauf hinweisen, dass Gott den Gedanken lange vor seiner Äußerung erkennt.
