lexical_decisions:
- source_word: יָדַעְתָּ
  choice: du weißt
  rationale: Das Qal Perfekt 2. Person maskulin Singular bezeichnet hier Gottes umfassendes und fortdauerndes Wissen. Im Deutschen verbindet sich „wissen“ natürlich mit den folgenden indirekten Fragesätzen.
- source_word: שִׁבְתִּי
  choice: wann ich mich setze
  rationale: Die verbale Nominalform mit Suffix bezeichnet das Sichsetzen bzw. Sitzen des Beters. Der finite Nebensatz ist im modernen Deutsch natürlicher und bleibt in der Parallelstruktur erhalten.
- source_word: וְקוּמִי
  choice: und wann ich aufstehe
  rationale: Die Form von קום mit Suffix steht parallel zu שִׁבְתִּי. „Aufstehe“ gibt die gewöhnliche Bewegung wieder; zusammen können beide Handlungen den gesamten Alltag umfassen.
- source_word: בַּנְתָּה
  choice: du verstehst
  rationale: Das Qal Perfekt von בין bezeichnet ein tiefes Erfassen oder Durchschauen und wird dadurch von יָדַעְתָּ unterschieden.
- source_word: לְרֵעִי
  choice: meinen Gedanken
  rationale: Das seltene Substantiv kann einen Gedanken, eine Absicht oder ein Vorhaben bezeichnen. „Gedanken“ ist im Zusammenhang mit Gottes Kenntnis des Inneren die unmittelbarste Wiedergabe, ohne den Sinn enger festzulegen.
- source_word: מֵרָחוֹק
  choice: von fern
  rationale: Die knappe räumliche Wendung bewahrt die poetische Bildhaftigkeit und lässt offen, ob räumliche Ferne oder ein Erkennen lange vor der Äußerung gemeint ist.
theological_decisions:
- issue: Reichweite von Gottes Wissen
  choice: Der Vers beschreibt Gottes umfassende persönliche Kenntnis der äußeren Handlungen und des inneren Gedankens des Beters, ohne ein bestimmtes philosophisches Modell der Allwissenheit festzulegen.
  alternative: Eine ausdrücklich zeitliche Deutung, nach der Gott den Gedanken lange vor seinem Entstehen oder seiner Äußerung kennt, oder eine ausschließlich räumliche Deutung.
  rationale: Der hebräische Text bezeugt tiefreichende göttliche Erkenntnis, lässt aber die genaue Bedeutung von „von fern“ offen. Die Übersetzung bewahrt diese theologische und poetische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Nebensätze geben das hebräische Wortpaar idiomatisch wieder; „von fern“ erhält bewusst die knappe poetische Mehrdeutigkeit.
