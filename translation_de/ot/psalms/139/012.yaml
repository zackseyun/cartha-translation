  variant: modern standard German
source:
  edition: WLC
  text: גַּם חֹשֶׁךְ֮ לֹֽא יַחְשִׁ֪יךְ מִ֫מֶּ֥/ךָ וְ֭/לַיְלָה כַּ/יּ֣וֹם יָאִ֑יר כַּ֝/חֲשֵׁיכָ֗ה כָּ/אוֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/012.yaml
  text: Even darkness is not dark to you[a]; the night shines like the day[b]; darkness is like light to you.
translation:
  language: de
  text: Selbst die Finsternis ist für dich nicht finster[a]; die Nacht leuchtet wie der Tag; Finsternis ist für dich wie Licht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb steht in einer kausativen Form und kann „verdunkeln“ bedeuten. Die Wiedergabe „ist für dich nicht finster“ gibt den Sinn idiomatisch wieder.
    reason: lexical_alternative
  - marker: b
    text: 'Die knappe Schlussformel kann auch wiedergegeben werden: „Wie die Finsternis, so das Licht.“ Sie besagt, dass Finsternis und Licht vor Gott gleich sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: selbst
  rationale: 'Die Partikel führt eine nachdrückliche Steigerung des vorherigen Gedankens ein: Nicht einmal Finsternis kann vor Gott verbergen. „Selbst“ gibt diese emphatische Bedeutung im Deutschen natürlich wieder.'
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: „Finsternis“ ist die geläufige, poetisch angemessene Entsprechung und bewahrt den Gegensatz zu „Licht“.
- source_word: לֹא יַחְשִׁיךְ מִמֶּךָ
  choice: ist für dich nicht finster
  rationale: Das Hifil von חשׁך hat zwar verbale beziehungsweise kausative Form („verdunkeln“), doch die idiomatische deutsche Wendung gibt den Sinn der Beziehung zu Gott klar wieder, ohne die Aussage zu „kann nichts vor dir verbergen“ auszudeuten.
- source_word: וְלַיְלָה
  choice: die Nacht
  rationale: Der bestimmte Artikel entspricht natürlichem deutschem Sprachgebrauch und stellt „die Nacht“ als Subjekt des parallelen Satzes heraus.
- source_word: כַּיּוֹם
  choice: wie der Tag
  rationale: Die Präposition כ markiert einen Vergleich; „wie der Tag“ bewahrt das Bild knapp und natürlich.
- source_word: יָאִיר
  choice: leuchtet
  rationale: Das Verb אור im Hifil bedeutet „Licht geben, leuchten“. „Leuchtet“ ist prägnant und erhält die poetische Personifikation der Nacht.
- source_word: כַּחֲשֵׁיכָה כָּאוֹרָה
  choice: Finsternis ist für dich wie Licht
  rationale: Die knappe hebräische Vergleichsformel wird zu einem verständlichen deutschen Nominalsatz ergänzt. Der Bezug „für dich“ ergibt sich aus dem ersten Versglied und macht deutlich, dass Finsternis und Licht in Gottes Wahrnehmung gleich sind.
theological_decisions:
- issue: Ob die erste Aussage als ausdrückliche Lehre über Gottes allumfassende Erkenntnis paraphrasiert werden soll
  choice: 'Das Bild bleibt erhalten: „Selbst die Finsternis ist für dich nicht finster.“'
  alternative: „Selbst die Finsternis kann nichts vor dir verbergen.“
  rationale: Der Zusammenhang betrifft Gottes uneingeschränkte Wahrnehmung, doch der hebräische Text formuliert dies durch das Bild von Finsternis und Licht. Die Übersetzung erklärt dieses Bild nicht in eine abstrakte Lehraussage um.
- issue: Deutung der elliptischen Schlussformel
  choice: „Finsternis ist für dich wie Licht“
  alternative: „Wie die Finsternis, so das Licht“
  rationale: Beide Auffassungen drücken aus, dass Dunkel und Licht vor Gott keinen Unterschied machen. Die gewählte Fassung schließt natürlich an das erste Versglied an; die formnähere Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. Die Wiederholung von „Finsternis/finster“ ist bewusst beibehalten, weil sie die hebräische Wortfigur und den Gegensatz zu „Licht“ trägt.
