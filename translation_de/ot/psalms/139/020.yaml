  text: who speak of you with evil intent[a]; your enemies take your name in vain.
translation:
  language: de
  text: die mit böser Absicht von dir reden[a]; deine Feinde missbrauchen deinen Namen zu Lügen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der letzte Halbvers ist im Hebräischen schwer zu deuten. Wörtlich stehen dort Ausdrücke wie „erheben/tragen“ und „zur Falschheit“; auch Deutungen wie „deine Gegner erheben sich zur Falschheit“ oder „deine Gegner nehmen dich fälschlich auf“ sind möglich. „Name“ steht nicht ausdrücklich im hebräischen Text.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen leitet die nähere Beschreibung der Frevler aus dem vorangehenden Zusammenhang ein.
- source_word: יֹאמְרֻךָ
  choice: von dir reden
  rationale: Die Form von אמר mit Suffix der 2. Person Singular bezeichnet hier im Zusammenhang feindseliges Reden über Gott, nicht notwendig eine direkte Anrede.
- source_word: לִמְזִמָּה
  choice: mit böser Absicht
  rationale: מְזִמָּה kann einen Plan oder eine Intrige bezeichnen; die Wendung gibt hier die überlegte, böswillige Zielrichtung ihres Redens wieder.
- source_word: נָשֻׂא
  choice: gebrauchen
  rationale: נשׂא bedeutet wörtlich „heben, tragen“; zusammen mit לַשָּׁוְא liegt ein idiomatischer Gebrauch im Sinn eines falschen oder missbräuchlichen Verwendens nahe.
- source_word: לַשָּׁוְא
  choice: für Falsches
  rationale: שָׁוְא umfasst Falschheit, Nichtigkeit und Vergeblichkeit. „Für Falsches“ bewahrt den Bezug auf Unwahres und passt zum ergänzten Objekt „deinen Namen“.
- source_word: עָרֶיךָ
  choice: deine Feinde
  rationale: Im poetischen Zusammenhang ist die Form als Bezeichnung der Gegner Gottes zu verstehen; „deine Feinde“ entspricht dem Parallelismus und dem Kontext von Psalm 139,19–22.
theological_decisions:
- issue: Objekt und Syntax des letzten Halbverses
  choice: deine Feinde gebrauchen deinen Namen für Falsches
  alternative: 'deine Gegner erheben dich zur Lüge; oder: Für Falsches erheben sich deine Gegner'
  rationale: Der hebräische Halbvers ist syntaktisch schwierig, und „Name“ steht nicht ausdrücklich im Text. Die gewählte Fassung versteht נשׂא + שׁוא idiomatisch als falschen Gebrauch des göttlichen Namens, kennzeichnet die Ergänzung und bewahrt abweichende Deutungen in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Für Falsches“ hält die Bedeutungsbreite von שָׁוְא stärker offen als die feststehende Wendung „vergeblich“; die syntaktische Unsicherheit wird nicht im Haupttext ausgebreitet, sondern in der Fußnote transparent gemacht.
