  source_fidelity: 'Die Übersetzung gibt die Aussage des Hebräischen zuverlässig wieder: דַּעַת als „Erkenntnis“, die Überforderung des Sprechers in מִמֶּנִּי mit „für mich“, נִשְׂגְּבָה als Höhen- und Unerreichbarkeitsbild sowie die elliptisch zu ergänzende Bewegung zu לָהּ mit „sie … erreichen“. Die feminine Rückbeziehung von „sie“ auf „Erkenntnis“ ist stimmig.'
