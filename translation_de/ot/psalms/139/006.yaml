source:
  edition: WLC
  text: פלאיה דַ֣עַת מִמֶּ֑/נִּי נִ֝שְׂגְּבָ֗ה לֹא א֥וּכַֽל לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/006.yaml
  text: Such knowledge is too wonderful for me[a]; it is too high—I cannot attain it.
translation:
  language: de
  text: Diese Erkenntnis ist zu wunderbar für mich; sie ist zu hoch – ich kann sie nicht erreichen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פלאיה
  choice: zu wunderbar
  rationale: Das Wort bezeichnet etwas Außergewöhnliches, Staunenswertes, das hier zusammen mit מִמֶּנִּי die Fassungskraft des Sprechers übersteigt. „Zu wunderbar“ bewahrt sowohl das Staunen als auch die Grenze des Begreifens.
- source_word: דַעַת
  choice: Erkenntnis
  rationale: Das Substantiv bedeutet Wissen bzw. Erkenntnis und verweist im Zusammenhang auf Gottes umfassendes Erkennen des Psalmisten. „Erkenntnis“ ist im Deutschen natürlich und hält den Bezug auf den Erkenntnisvorgang offen.
- source_word: מִמֶּנִּי
  choice: für mich
  rationale: Wörtlich „von mir/als ich“; in der Verbindung mit „zu wunderbar“ bezeichnet es idiomatisch etwas, das die Fähigkeiten des Psalmisten übersteigt.
- source_word: נִשְׂגְּבָה
  choice: sie ist zu hoch
  rationale: Die Form von שׂגב vermittelt Höhe, Erhabenheit und Unerreichbarkeit. Die Übersetzung erhält das Höhenbild, das durch den folgenden Satz weitergeführt wird.
- source_word: לֹא אוּכַל
  choice: ich kann nicht
  rationale: Die negierte erste Person von יכל drückt schlicht das Unvermögen des Sprechers aus.
- source_word: לָהּ
  choice: sie nicht erreichen
  rationale: Wörtlich steht „zu ihr“. Das im Deutschen nötige Verb wird aus dem Bild der unerreichbaren Höhe ergänzt; „erreichen“ bewahrt dieses Bild und passt zugleich zur geistigen Unerfasslichkeit.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Bewegung von staunenswerter Erkenntnis zu unerreichbarer Höhe bleibt erhalten; der Gedankenstrich markiert die abschließende persönliche Begrenzung.
