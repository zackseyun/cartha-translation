  text: הֲ/לֽוֹא מְשַׂנְאֶ֖י/ךָ יְהוָ֥ה אֶשְׂנָ֑א וּ֝/בִ/תְקוֹמְמֶ֗י/ךָ אֶתְקוֹטָֽט־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/021.yaml
  text: Do I not hate those who hate you, O LORD, and loathe those who rise up against you?
translation:
  language: de
  text: Hasse ich nicht die, die dich hassen, HERR, und verabscheue ich nicht die, die sich gegen dich erheben?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשַׂנְאֶיךָ / אֶשְׂנָא
  choice: die dich hassen / hasse ich
  rationale: Die Wiederholung derselben hebräischen Wurzel שׂנא wird im Deutschen bewahrt; „hassen“ gibt die starke, unverhüllte Aussage des Verses wieder.
- source_word: יְהוָה
  choice: HERR
  rationale: Der Gottesname JHWH wird gemäß der im Deutschen verbreiteten Bibelkonvention mit „HERR“ wiedergegeben.
- source_word: מִתְקוֹמְמֶיךָ
  choice: die sich gegen dich erheben
  rationale: Die reflexive Form bezeichnet Menschen, die sich feindlich gegen Gott auflehnen oder gegen ihn auftreten; „sich gegen dich erheben“ bewahrt Bild und Richtung.
- source_word: אֶתְקוֹטָט
  choice: verabscheue ich
  rationale: Die intensive/reflexive Verbform von קוט drückt starken Widerwillen oder Abscheu aus; „verabscheuen“ passt zum parallelen „hassen“, ohne daraus bloßes Streiten zu machen.
theological_decisions:
- issue: Starke Sprache des Hasses und Abscheus
  choice: Die Ausdrücke „hassen“ und „verabscheuen“ bleiben ausdrücklich stehen.
  alternative: Abschwächungen wie „nicht mögen“, „ablehnen“ oder „mich von ihnen abwenden“.
  rationale: Der hebräische Text formuliert bewusst scharf. Eine Abschwächung würde die ethische und theologische Spannung des Psalmgebets vorschnell auflösen.
- issue: Rhetorische Frage
  choice: Die Aussage wird als direkte rhetorische Frage „Hasse ich nicht …?“ wiedergegeben.
  alternative: „Sollte ich nicht … hassen?“
  rationale: Die direkte Frage entspricht der hebräischen Konstruktion הֲלוֹא und vermeidet, sie eindeutig als moralische Sollensforderung auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die an Gott gerichtete Anrede bleiben erhalten; das zweite „ich nicht“ wird zur natürlichen und eindeutigen deutschen Koordination wiederholt.
