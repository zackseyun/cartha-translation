  language: en
  yaml_path: translation/ot/psalms/139/013.yaml
  text: For you formed my inward parts[b][a]; you wove me together in my mother’s womb.
translation:
  language: de
  text: Denn du hast mein Innerstes geschaffen[b]; du hast mich im Leib meiner Mutter umhüllt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du hast mich gewoben“. Wörtlicher liegt die Bedeutung „bedecken, abschirmen“ zugrunde.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „meine Nieren“; im Hebräischen ein bildlicher Ausdruck für das tiefste Innere eines Menschen.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage; „Denn“ gibt den kausalen und poetischen Anschluss natürlich wieder.
- source_word: קָנִיתָ
  choice: hast … geschaffen
  rationale: קנה kann „erwerben“ oder „besitzen“ bedeuten, bezeichnet hier im Zusammenhang der vorgeburtlichen Entstehung aber am ehesten Gottes schöpferisches Handeln. „Geschaffen“ vermeidet einen unpassenden wirtschaftlichen Beiklang.
- source_word: כִלְיֹתָי
  choice: mein Innerstes
  rationale: Wörtlich steht „meine Nieren“. Diese gelten im Hebräischen als Sitz des tiefsten inneren Empfindens; „mein Innerstes“ vermittelt die bildliche Bedeutung verständlich, während die konkrete Metapher in einer Fußnote erhalten bleibt.
- source_word: תְּסֻכֵּנִי
  choice: du hast mich … geborgen
  rationale: Das Verb סכך hat als Grundbedeutung „bedecken, abschirmen“. „Geborgen“ wahrt die Vorstellung des Umhüllens und Schützens im Mutterleib, ohne die im Hebräischen nicht ausdrücklich vorhandene Web- oder Strickmetapher in den Haupttext einzutragen.
- source_word: בְּבֶטֶן אִמִּי
  choice: im Leib meiner Mutter
  rationale: Natürliche moderne Wiedergabe des Ortes der vorgeburtlichen Bildung; gemeint ist der Mutterleib.
theological_decisions:
- issue: Vorgeburtliche Bildung durch Gott ohne dogmatische Erweiterung
  choice: Der Vers wird als poetische Aussage über Gottes unmittelbares schöpferisches und bergendes Handeln an dem Beter im Mutterleib wiedergegeben.
  alternative: 'Eine stärker wörtliche Fassung wäre: „Denn du hast meine Nieren erworben; du hast mich im Leib meiner Mutter bedeckt.“'
  rationale: Die Übersetzung erhält die starke Aussage göttlichen Handelns vor der Geburt, fügt aber keine späteren lehrmäßigen Folgerungen hinzu, die der Vers selbst nicht ausdrücklich formuliert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Körperrede wird verständlich übertragen und durch Fußnoten transparent gemacht; die genuine Bedeutungsbreite von קנה und סכך wird nicht verschwiegen.
