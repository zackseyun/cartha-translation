base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/011.yaml
  text: And I said[a], “Surely darkness will cover me[b], and the night will be light around me.”
translation:
  language: de
  text: 'Und ich sagte: „Gewiss, die Finsternis wird mich bedecken[a], und die Nacht wird um mich her Licht sein[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird mich überwältigen« beziehungsweise »wird mich zermalmen«. Das hebräische Verb ist selten; seine genaue Bedeutung an dieser Stelle ist umstritten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und die Nacht ist um mich her Licht«. Der hebräische Satz hat kein ausdrückliches Verb und kann je nach Verknüpfung mit der vorangehenden Aussage gegenwärtig oder zukünftig wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Und ich sagte
  rationale: Die Form ist waw + Qatal, 1. Person Singular, von אמר und wird zunächst als rückblickende Aussage wiedergegeben. Eine bedingte Übersetzung wie »Wenn ich sage« ist aus dem Zusammenhang möglich, grammatisch aber weniger unmittelbar.
- source_word: אַךְ
  choice: Gewiss
  rationale: אַךְ verstärkt hier die Aussage. »Gewiss« gibt diese nachdrückliche Erwartung in natürlichem, gehobenem Deutsch wieder.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: Das Substantiv bezeichnet Dunkelheit. »Finsternis« entspricht dem würdevollen poetischen Register des Psalms.
- source_word: יְשׁוּפֵנִי
  choice: wird mich bedecken
  rationale: Das seltene Verb שׁוף ist in seiner genauen Bedeutung umstritten. Bei »Finsternis« als Subjekt passt »bedecken« zum Bild und zum folgenden Kontrast, ohne die Unsicherheit in einer Fußnote zu verschweigen.
- source_word: וְלַיְלָה
  choice: und die Nacht
  rationale: Die schlichte Verbindung wahrt den Parallelismus der beiden Vershälften.
- source_word: אוֹר
  choice: wird … Licht sein
  rationale: Der hebräische Nominalsatz enthält kein ausdrückliches Verb. Die Zukunftsform verbindet ihn mit der erwarteten Wirkung der Finsternis und bewahrt zugleich das markante Substantiv »Licht«.
- source_word: בַּעֲדֵנִי
  choice: um mich her
  rationale: בעד bezeichnet hier am ehesten eine räumliche Umgebung. »Um mich her« ist idiomatisch und poetisch, ohne dem Ausdruck eine zusätzliche theologische Deutung aufzuerlegen.
theological_decisions:
- issue: Paradoxe Aussage über Nacht und Licht
  choice: »die Nacht wird um mich her Licht sein«
  alternative: »die Nacht wird mich umgeben« oder eine erklärende Auflösung des Bildes
  rationale: Der hebräische Text stellt »Nacht« und »Licht« spannungsvoll nebeneinander. Diese Spannung wird bewahrt und nicht vorweg durch Vers 12 erklärt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdig-poetischem Register. Der Parallelismus und die knappe Bildsprache des Hebräischen bleiben erhalten; die seltene Verbform und der verblose zweite Satz werden durch Fußnoten transparent gemacht.
