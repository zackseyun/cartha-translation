  text: חָקְרֵ֣/נִי אֵ֭ל וְ/דַ֣ע לְבָבִ֑/י בְּ֝חָנֵ֗/נִי וְ/דַ֣ע שַׂרְעַפָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/023.yaml
  text: Search me[a], God, and know my heart; test me and know my anxious thoughts.
translation:
  language: de
  text: Erforsche mich, Gott, und erkenne mein Herz; prüfe mich und erkenne meine unruhigen Gedanken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: meine bekümmernden Gedanken; oder: meine geteilten Gedanken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָקְרֵנִי
  choice: Erforsche mich
  rationale: חקר bezeichnet ein gründliches Erforschen oder Untersuchen. „Erforsche mich“ bewahrt das Bild einer tiefgehenden Prüfung und passt zum würdevollen Gebetsstil.
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier die direkte Anrede Gottes. „Gott“ ist im modernen Deutschen klar und natürlich; die Anredefunktion wird durch Satzbau und Komma deutlich.
- source_word: וְדַע
  choice: und erkenne
  rationale: ידע fordert hier ein vollständiges Wahrnehmen und Durchschauen. „Erkenne“ gibt diesen Sinn im Deutschen idiomatischer wieder als das bloße „kenne“; die Wiederholung wurde zur Wahrung des Parallelismus beibehalten.
- source_word: לְבָבִי
  choice: mein Herz
  rationale: לֵבָב bezeichnet den inneren Menschen einschließlich Denken und Wollen. „Herz“ bewahrt die biblisch-poetische Bildsprache und bleibt im Deutschen verständlich.
- source_word: בְּחָנֵנִי
  choice: prüfe mich
  rationale: בחן bezeichnet ein prüfendes Erproben, bisweilen mit dem Bild der Metallprüfung. „Prüfe mich“ ist prägnant und hält die Bedeutungsnuance gegenüber „Erforsche mich“ auseinander.
- source_word: שַׂרְעַפָּי
  choice: meine unruhigen Gedanken
  rationale: שַׂרְעַפִּים kann beunruhigende, sorgenschwere oder geteilte Gedanken bezeichnen. „Unruhige Gedanken“ ist natürlich, lässt die innere Unruhe erkennen und engt die mögliche Bedeutung nicht unnötig auf moderne Angstterminologie ein.
theological_decisions:
- issue: Bezeichnungen für das innere Leben des Menschen
  choice: „Herz“ und „unruhige Gedanken“ als zwei verschiedene Ausdrücke beibehalten
  alternative: Beide Ausdrücke unter einem einzigen psychologischen Begriff wie „Inneres“ oder „Denken“ zusammenfassen
  rationale: Der hebräische Parallelismus verwendet zwei unterschiedliche Begriffe. Ihre Unterscheidung bewahrt die poetische und anthropologische Weite des Verses, ohne eine moderne psychologische Systematik einzutragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch in einem würdevollen poetischen Gebetsregister. Die parallelen Imperative und die Wiederholung von „erkenne“ bleiben erhalten.
