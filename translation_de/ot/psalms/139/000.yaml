  text: לַ֭/מְנַצֵּחַ לְ/דָוִ֣ד מִזְמ֑וֹר יְהוָ֥ה חֲ֝קַרְתַּ֗/נִי וַ/תֵּדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/000.yaml
  text: For the choirmaster[a]. Of David. A psalm. Yahweh[b], you have searched me and known me.
translation:
  language: de
  text: 'Für den musikalischen Leiter[a]. Von David[b]. Ein Psalm.


    Jahwe, du hast mich erforscht und kennst mich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Dem musikalischen Leiter“. Die hebräische Präposition kann in Psalmüberschriften eine Bestimmung oder Zueignung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Für David“. Das Hebräische lässt offen, ob Autorschaft, Widmung oder eine andere Zuordnung zu David gemeint ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: Die Bezeichnung meint wahrscheinlich den für die musikalische Ausführung Verantwortlichen. „Musikalischer Leiter“ ist verständlich und vermeidet die nicht ausdrücklich im Hebräischen enthaltene Festlegung auf einen Chor.
- source_word: לְדָוִד
  choice: Von David
  rationale: Die traditionelle, knappe Wiedergabe bewahrt im Deutschen die Verbindung des Psalms mit David; die genaue Art dieser Verbindung wird in der Fußnote offengehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als Name wiedergegeben und nicht durch den Titel „HERR“ ersetzt.
- source_word: חֲקַרְתַּנִי וַתֵּדָע
  choice: du hast mich erforscht und kennst mich
  rationale: Das Perfekt „hast erforscht“ bezeichnet die vollzogene Prüfung; „kennst“ gibt das daraus hervorgehobene gegenwärtige Wissen in natürlichem Deutsch wieder, ohne beides zu einem einzigen Gedanken zu verschmelzen.
theological_decisions:
- issue: Art der davidischen Zuordnung in der Überschrift
  choice: Von David[b]
  alternative: Für David / David zugeordnet
  rationale: Die hebräische Präposition לְ kann Autorschaft, Zugehörigkeit, Widmung oder Beziehung ausdrücken. Die geläufige Haupttextform bleibt stehen, während die Fußnote die echte Mehrdeutigkeit nennt.
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. Seine Wiedergabe als Eigenname erhält die persönliche Anrede und vermeidet eine Ersetzung durch einen Titel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Form der Psalmüberschrift bleibt erhalten. „Musikalischer Leiter“ ist breiter und quellennäher als „Chorleiter“; die Anrede im Vers ist unmittelbar und natürlich formuliert.
