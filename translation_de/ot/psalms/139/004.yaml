lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Partikel begründet hier den vorausgehenden Gedanken und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: אֵין
  choice: noch ist kein
  rationale: Die Existenzverneinung wird zusammen mit מִלָּה als „ist kein Wort“ ausgedrückt; „noch“ verdeutlicht im Kontext, dass das Wort nicht ausgesprochen ist, ohne das Bild der Zunge aufzugeben.
- source_word: מִלָּה
  choice: Wort
  rationale: „Wort“ ist im Zusammenhang mit der Zunge die direkte und natürliche Entsprechung des Singulars.
- source_word: בִּלְשׁוֹנִי
  choice: auf meiner Zunge
  rationale: Diese Wiedergabe bewahrt das körperliche Bild des Hebräischen und ist im Deutschen verständlich.
- source_word: הֵן
  choice: siehe
  rationale: „Siehe“ erhält den hervorhebenden, Aufmerksamkeit weckenden Charakter der Partikel; die mögliche bestätigende Bedeutung wird in einer Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יָדַעְתָּ
  choice: du kennst
  rationale: Das Perfekt bezeichnet hier Gottes gegenwärtiges, umfassendes Wissen; das deutsche Präsens gibt diesen zuständlichen Sinn natürlich wieder.
- source_word: כֻלָּהּ
  choice: es ganz
  rationale: Das feminine Suffix verweist auf „Wort“; „es ganz“ drückt aus, dass Jahwe das Wort vollständig kennt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen; „Jahwe“ bewahrt ihn, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Umfang von Gottes Wissen
  choice: du kennst es ganz
  alternative: du kennst alles
  rationale: Die gewählte Fassung bezieht das feminine Suffix grammatisch auf das einzelne „Wort“ und wahrt so die konkrete Aussage, ohne eine weiter gefasste theologische Aussage in den Text einzutragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewahrtem poetischem Körperbild. „Siehe“ ist bewusst feierlicher als Alltagssprache, um die Hervorhebung durch הֵן wiederzugeben; die alternative syntaktische Auffassung steht in der Fußnote.
