  text: For there is not a word on my tongue—behold[a], O Yahweh, you know it altogether.
translation:
  language: de
  text: Denn kein Wort ist auf meiner Zunge – siehe[a], Jahwe, du kennst es ganz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ja, Jahwe, du kennst es ganz.“'
