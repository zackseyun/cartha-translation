  source_fidelity: Die Übersetzung gibt die Satzglieder, den Gottesnamen und den Bezug des Suffixes in כֻלָּהּ auf das einzelne Wort zutreffend wieder. Das ergänzte „noch“ hat jedoch keine ausdrückliche Entsprechung im Hebräischen und legt eine zeitliche Aussage („bis jetzt“) fest, die der Text nicht ausdrücklich macht.
