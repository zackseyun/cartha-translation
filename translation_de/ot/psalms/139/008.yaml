  text: אִם אֶסַּ֣ק שָׁ֭מַיִם שָׁ֣ם אָ֑תָּה וְ/אַצִּ֖יעָה שְּׁא֣וֹל הִנֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/008.yaml
  text: If I ascend to heaven[a], you are there; if I make my bed in Sheol, behold, you are there.
translation:
  language: de
  text: Steige ich zum Himmel hinauf, so bist du dort; breite ich mein Lager im Totenreich[a] aus, sieh, da bist du.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Scheol«; auch: »im Grab«. Das hebräische Wort bezeichnet das Totenreich, nicht notwendigerweise die »Hölle« im späteren Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Steige ich …, so
  rationale: Die konditionale beziehungsweise hypothetische Konstruktion wird im Deutschen natürlich durch einen uneingeleiteten Bedingungssatz mit »so« wiedergegeben; die poetische Parallelität bleibt erhalten.
- source_word: אֶסַּק
  choice: steige ich … hinauf
  rationale: Bewahrt die vertikale Aufwärtsbewegung des poetischen Verbs und klingt im modernen Deutschen natürlich.
- source_word: שָׁמַיִם
  choice: zum Himmel
  rationale: Im Gegensatz zum Totenreich bezeichnet der Ausdruck den oberen Bereich; der Singular ist hier im Deutschen idiomatisch und würdevoll.
- source_word: שָׁם
  choice: dort
  rationale: Gibt das Ortsadverb ausdrücklich wieder und betont Gottes Gegenwart an jedem denkbaren Ort.
- source_word: אָתָּה
  choice: bist du
  rationale: Die direkte Anrede und das hervorgehobene Pronomen werden in natürlicher deutscher Syntax bewahrt.
- source_word: וְאַצִּיעָה
  choice: breite ich mein Lager … aus
  rationale: Gibt das konkrete Bild des Ausbreitens oder Herrichtens einer Lagerstatt genauer wieder als das interpretierende »lege ich mich nieder«.
- source_word: שְּׁאוֹל
  choice: im Totenreich
  rationale: »Totenreich« vermittelt den althebräischen Bereich der Toten verständlich, ohne die späteren Vorstellungen von »Hölle« oder endgültiger Strafe einzutragen.
- source_word: הִנֶּךָּ
  choice: sieh, da bist du
  rationale: »Sieh« bewahrt die hervorhebende, deiktische Kraft von הִנֵּה; »da bist du« bringt den im Hebräischen knappen Sinn natürlich zum Ausdruck und nimmt die erste Vershälfte auf.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל in der Aussage über Gottes Gegenwart in der Tiefe
  choice: Totenreich
  alternative: Scheol; Grab; Hölle
  rationale: Der hebräische Ausdruck bezeichnet den Bereich der Toten und nicht notwendig einen endgültigen Ort eschatologischer Strafe. »Totenreich« ist im Deutschen verständlich und vermeidet eine konfessionell oder dogmatisch verengende Deutung; die Transkription »Scheol« wird in der Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige poetische Sprache. Die beiden räumlichen Extreme und die parallele Satzstruktur bleiben deutlich; »sieh« erhält die emphatische Wendung des zweiten Halbverses.
