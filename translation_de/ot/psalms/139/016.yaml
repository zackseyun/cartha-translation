id: PSA.139.16
reference: Psalms 139:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: גָּלְמִ֤/י רָ֘א֤וּ עֵינֶ֗י/ךָ וְ/עַֽל סִפְרְ/ךָ֮ כֻּלָּ֪/ם יִכָּ֫תֵ֥בוּ יָמִ֥ים יֻצָּ֑רוּ ו/לא אֶחָ֣ד בָּ/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/016.yaml
  text: Your eyes saw my unformed substance[a], and in your book they all were written—the days that were formed[c][b], when not one of them yet existed.
translation:
  language: de
  text: Deine Augen sahen meine ungeformte Gestalt[a], und in deinem Buch waren sie alle aufgeschrieben – die Tage, die gebildet wurden[b][c], als noch keiner von ihnen da war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „meinen ungeformten Leib“ oder „meinen Embryo“. Das hebräische Wort bezeichnet etwas, das noch nicht fertig geformt ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Satz ist stark verdichtet und schwer zu gliedern. Möglich ist auch: „In deinem Buch waren sie alle aufgeschrieben; die Tage waren gebildet“, gegebenenfalls mit dem sinngemäßen Zusatz „für mich“.'
    reason: alternative_reading
  - marker: c
    text: „Gebildet“ kann auch mit „geformt“ oder „gestaltet“ wiedergegeben werden. „Bestimmt“ oder „verordnet“ ist stärker deutend als die Grundbedeutung des hebräischen Verbs.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלְמִי
  choice: meine ungeformte Gestalt
  rationale: גֹּלֶם bezeichnet etwas noch nicht fertig Geformtes. „Ungeformte Gestalt“ bewahrt das Bild und vermeidet einen engeren modernen Fachbegriff wie „Embryo“.
- source_word: רָאוּ עֵינֶיךָ
  choice: Deine Augen sahen
  rationale: Die konkrete hebräische Wendung wird in natürlichem deutschem Präteritum beibehalten.
- source_word: וְעַל סִפְרְךָ
  choice: und in deinem Buch
  rationale: Bei einem Buch gibt „in“ den gemeinten Ort des Aufgeschriebenen im Deutschen idiomatisch wieder, obwohl עַל wörtlich oft „auf“ bedeutet.
- source_word: כֻּלָּם יִכָּתֵבוּ
  choice: waren sie alle aufgeschrieben
  rationale: Der Passivcharakter von יִכָּתֵבוּ und das konkrete Bild des Buches bleiben erhalten. Das Pronomen lässt zunächst die verdichtete Rückverweisung des Hebräischen stehen.
- source_word: יָמִים יֻצָּרוּ
  choice: die Tage, die gebildet wurden
  rationale: יָמִים wird als Erläuterung des vorausgehenden „sie alle“ verstanden. יצר bedeutet grundsätzlich „formen, bilden“; „bestimmen“ wäre eine stärkere theologische Deutung.
- source_word: וְלֹא אֶחָד בָּהֶם
  choice: als noch keiner von ihnen da war
  rationale: Die hebräische Nominalellipse wird in verständlichem Deutsch zeitlich entfaltet, ohne mehr als das im Zusammenhang nahegelegte Noch-nicht-Dasein der Tage auszusagen.
theological_decisions:
- issue: Ob יֻצָּרוּ mit einem ausdrücklich prädestinatianischen Begriff wiederzugeben ist
  choice: gebildet wurden
  alternative: bestimmt oder verordnet wurden
  rationale: Das Verb trägt das Bild des Formens oder Bildens. Die Wiedergabe vermeidet es, eine weitergehende dogmatische Aussage in das einzelne Verb hineinzulesen, und lässt zugleich Gottes vorausgehendes Wissen und Handeln im Vers deutlich stehen.
- issue: Ob „für mich“ bei den gebildeten Tagen ergänzt werden soll
  choice: keine Ergänzung im Haupttext
  alternative: die für mich gebildet wurden
  rationale: Der Bezug auf das Leben des Psalmisten liegt im Kontext nahe, doch ein ausdrückliches „für mich“ steht in dieser Wendung nicht im Hebräischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an die hebräische Bildsprache. Der Gedankenstrich macht die nachgestellte Erläuterung „die Tage“ lesbar, ohne die schwierige Syntax zu verschleiern. Die Formulierung wahrt die theologische Spannung und vermeidet nicht ausdrücklich im Text stehende Ergänzungen.
