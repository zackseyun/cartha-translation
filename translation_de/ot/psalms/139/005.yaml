  text: אָח֣וֹר וָ/קֶ֣דֶם צַרְתָּ֑/נִי וַ/תָּ֖שֶׁת עָלַ֣/י כַּפֶּֽ/כָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/005.yaml
  text: You hem me in behind and before[a], and lay your hand upon me.
translation:
  language: de
  text: Von hinten und von vorn umschließt du mich[a] und legst deine Hand auf mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schließt du mich ein“ oder „belagerst du mich“; das hebräische Verb kann hier sowohl neutral beziehungsweise schützend als auch bedrängend verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחוֹר
  choice: von hinten
  rationale: Im Gegensatzpaar mit קֶדֶם bezeichnet das Wort die räumliche Rückseite; „von hinten“ ist im modernen Deutschen klar und natürlich.
- source_word: קֶדֶם
  choice: von vorn
  rationale: Zusammen mit אָחוֹר ist die räumliche Bedeutung „vorn“ gemeint, nicht die zeitliche oder geografische Bedeutung.
- source_word: צַרְתָּנִי
  choice: umschließt du mich
  rationale: Die Form bezeichnet hier wahrscheinlich ein Einschließen oder Umgeben. „Umschließt“ bewahrt sowohl eine schützende als auch eine bedrängende Nuance, ohne den Sinn einseitig festzulegen.
- source_word: וַתָּשֶׁת
  choice: und legst
  rationale: Das Verb bedeutet „setzen, stellen, legen“; in Verbindung mit „Hand“ ist „legen“ die natürliche deutsche Wortwahl.
- source_word: עָלַי
  choice: auf mich
  rationale: Die Präposition bezeichnet hier die Lage oder Bewegung auf eine Person hin; „auf mich“ ist idiomatisches modernes Deutsch.
- source_word: כַּפֶּךָ
  choice: deine Hand
  rationale: כַּף kann genauer „Handfläche“ bedeuten, doch die Wendung wird im Deutschen natürlich mit „Hand“ wiedergegeben und bewahrt das körperhafte Bild.
theological_decisions:
- issue: Ob das Umschließen schützend, einengend oder beides klingt
  choice: Die mehrdeutige Bildsprache bleibt durch „umschließt“ erhalten.
  alternative: Eine eindeutig schützende Wiedergabe wie „du behütest mich“ oder eine eindeutig bedrängende wie „du belagerst mich“.
  rationale: Der Zusammenhang verbindet Gottes umfassendes Wissen und seine unausweichliche Gegenwart mit persönlicher Nähe. Das hebräische Verb erlaubt sowohl eine neutrale beziehungsweise schützende als auch eine bedrängende Färbung; die Übersetzung soll diese Spannung nicht auflösen.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die parallele Wendung „von hinten und von vorn“ erhält das räumliche Bild des Hebräischen; „deine Hand“ bewahrt den Anthropomorphismus ohne unnötige Wörtlichkeit.
