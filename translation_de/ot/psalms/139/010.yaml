  text: even there your hand will lead me, and your right hand will hold me fast.
translation:
  language: de
  text: Auch dort wird deine Hand mich führen, und deine rechte Hand wird mich festhalten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם שָׁם
  choice: Auch dort
  rationale: Gibt die additive und hervorhebende Wendung natürlich wieder und knüpft an die zuvor genannten äußersten Orte an.
- source_word: תַנְחֵנִי
  choice: wird mich führen
  rationale: Das Verb נחה bezeichnet hier das Führen oder Leiten; die deutsche Zukunftsform entspricht der präfigierten Verbform im Kontext.
- source_word: וְתֹאחֲזֵנִי
  choice: und … wird mich festhalten
  rationale: אחז bedeutet ergreifen beziehungsweise festhalten. „Festhalten“ bewahrt sowohl die körperliche Bildlichkeit als auch die mögliche schützende oder unausweichliche Nähe Gottes, ohne sie einseitig festzulegen.
- source_word: יְמִינֶךָ
  choice: deine rechte Hand
  rationale: Bewahrt das konkrete anthropomorphe Bild des hebräischen Textes.
theological_decisions:
- issue: Bedeutung des göttlichen Festhaltens
  choice: wird mich festhalten
  alternative: wird mich ergreifen
  rationale: Der Zusammenhang kann tröstliche Führung ausdrücken, doch das Motiv, Gottes Gegenwart nicht entkommen zu können, bleibt ebenfalls bestehen. „Festhalten“ lässt diese Spannung offen.
translation_notes:
  register: Moderne, klare und würdige Standardsprache; paralleler Satzbau und Hand-Metaphorik des Hebräischen bleiben erhalten.
