  yaml_path: translation/ot/psalms/139/018.yaml
  text: If I were to count them[a], they would be more than the sand. When I awake[b], I am still with you.
translation:
  language: de
  text: Zählte ich sie[a], wären sie zahlreicher als der Sand. Erwache ich[b], bin ich noch immer bei dir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wenn ich sie zähle, sind sie zahlreicher als der Sand.“ Das Hebräische ist knapp und lässt im Deutschen verschiedene Satzformen zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Ich erwachte, und noch immer bin ich bei dir.“ Das Hebräische legt nicht ausdrücklich fest, ob das Erwachen wiederholt, in unmittelbarer Vergangenheit oder bildlich gemeint ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶסְפְּרֵם
  choice: Wollte ich sie zählen
  rationale: Das Qal-Imperfekt der 1. Person Singular mit Suffix der 3. Person Plural bedeutet wörtlich „ich zähle sie“. Im Zusammenhang eröffnet es natürlich einen hypothetischen Satz, ohne die knappe hebräische Form unnötig auszubauen.
- source_word: מֵחוֹל יִרְבּוּן
  choice: wären sie zahlreicher als der Sand
  rationale: Das Präfix מ־ bezeichnet hier den Vergleich; רבה drückt große beziehungsweise überlegene Zahl aus. „Zahlreicher als der Sand“ gibt die Aussage idiomatisch und präzise wieder.
- source_word: הֱקִיצֹתִי
  choice: Erwache ich
  rationale: Die Form bezeichnet das Erwachen, legt im poetischen Zusammenhang aber nicht eindeutig fest, ob ein gegenwärtig-wiederholtes, vergangenes oder bildliches Erwachen gemeint ist. Die deutsche präsentische Form bewahrt diese Offenheit weitgehend.
- source_word: וְעוֹדִי עִמָּךְ
  choice: bin ich noch immer bei dir
  rationale: עוֹד mit Personalsuffix bezeichnet den fortdauernden Zustand; עִם bedeutet „mit/bei“. „Noch immer bei dir“ ist natürliches Deutsch und bewahrt den Gedanken fortbestehender Nähe.
theological_decisions:
- issue: Bezug von „sie“
  choice: Das Pronomen bleibt stehen und verweist im unmittelbaren Kontext auf Gottes Gedanken aus dem vorherigen Vers.
  alternative: Den Bezug im Haupttext ausdrücklich als „deine Gedanken“ wiederzugeben oder weiter auf Gottes Werke und Absichten zu beziehen.
  rationale: Der unmittelbare Rückbezug auf Gottes Gedanken ist am wahrscheinlichsten. Das beibehaltene Pronomen folgt jedoch der hebräischen Verknüpfung und vermeidet eine unnötige Explizierung.
- issue: Sinn der Schlusszeile
  choice: Der Beter befindet sich beim Erwachen weiterhin bei Gott.
  alternative: Die Zeile kann vom Erwachen nach dem Schlaf sprechen; ein bildliches Erwachen oder eine Anspielung auf ein Erwachen nach dem Tod wurde ebenfalls erwogen.
  rationale: Der hebräische Text spricht klar von fortdauernder Nähe zu Gott, bestimmt die Art des Erwachens aber nicht eindeutig. Daher wird keine ausdrückliche Auferstehungsaussage in den Text eingeführt.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Knappheit. Die hypothetische Form der ersten Zeile und die zeitliche Offenheit der zweiten werden bewahrt; „bei dir“ klingt im Deutschen natürlicher als ein starres „mit dir“.
