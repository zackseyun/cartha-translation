  source_fidelity: Der Entwurf gibt die beiden parallelen rhetorischen Fragen des Hebräischen präzise wieder. „Wohin“ entspricht אָנָה als zielgerichtetem Frageadverb; „könnte ich gehen/fliehen“ vermittelt den im Kontext rhetorisch als unmöglich verstandenen Imperfekt angemessen. „Fort von“ gibt מִן in beiden Halbzeilen klar wieder. „Angesicht“ wahrt die Bildsprache von פָּנֶיךָ, ohne die kontextuelle Bedeutung persönlicher Gegenwart zu verlieren.
