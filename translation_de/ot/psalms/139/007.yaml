  text: אָ֭נָ֥ה אֵלֵ֣ךְ מֵ/רוּחֶ֑/ךָ וְ֝/אָ֗נָה מִ/פָּנֶ֥י/ךָ אֶבְרָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/007.yaml
  text: Where can I go from your Spirit? Or where can I flee from your presence?[a]
translation:
  language: de
  text: Wohin könnte ich gehen, fort von deinem Geist? Und wohin könnte ich fliehen, fort von deinem Angesicht?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ruach kann auch „Wind“ oder „Atem“ bedeuten; hier spricht der Zusammenhang für „Geist“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֭נָה
  choice: Wohin
  rationale: Das Frageadverb bezeichnet hier das Ziel einer Bewegung. „Wohin“ ist im modernen Deutschen präzise und natürlich.
- source_word: אֵלֵ֣ךְ
  choice: könnte ich gehen
  rationale: Der Qal-Imperfekt 1. Person Singular von הלך steht in einer rhetorischen Frage. Der Konjunktiv mit „könnte“ bringt die gemeinte Möglichkeit beziehungsweise Unmöglichkeit idiomatisch zum Ausdruck.
- source_word: מֵ/רוּחֶ֑/ךָ
  choice: fort von deinem Geist
  rationale: רוּחַ kann „Geist“, „Wind“ oder „Atem“ bedeuten. Der Parallelismus mit Gottes Angesicht und der Kontext seiner unausweichlichen Gegenwart sprechen hier für „Geist“. „Fort von“ verdeutlicht bei natürlicher deutscher Wortstellung die durch מִן bezeichnete Entfernung.
- source_word: וְ֝/אָ֗נָה
  choice: Und wohin
  rationale: Die Konjunktion verbindet zwei parallele rhetorische Fragen. „Und wohin“ bewahrt die hebräische Verknüpfung und klingt im Deutschen natürlich.
- source_word: מִ/פָּנֶ֥י/ךָ
  choice: fort von deinem Angesicht
  rationale: פָּנִים bedeutet wörtlich „Gesicht/Angesicht“ und bezeichnet in dieser Wendung zugleich die persönliche Gegenwart. „Angesicht“ bewahrt das konkrete Bild des Hebräischen in würdiger, verständlicher Sprache.
- source_word: אֶבְרָֽח
  choice: könnte ich fliehen
  rationale: Der Qal-Imperfekt 1. Person Singular von ברח bedeutet „fliehen“. Parallel zu „könnte ich gehen“ gibt die Formulierung die rhetorisch ausgeschlossene Flucht wieder.
theological_decisions:
- issue: Ob רוּחַ unpersönlich als „Wind/Atem“ oder persönlich auf Gott bezogen als „Geist“ wiederzugeben ist
  choice: deinem Geist
  alternative: deinem Wind / deinem Atem
  rationale: Der Psalm handelt von Gottes allumfassendem Wissen und seiner unausweichlichen Gegenwart. Der Parallelismus mit „deinem Angesicht“ legt eine persönliche göttliche Bezugnahme nahe. Die lexikalische Mehrdeutigkeit wird in der Fußnote offengehalten.
- issue: Ob מִפָּנֶיךָ idiomatisch als „vor deiner Gegenwart“ oder bildhaft als „von deinem Angesicht“ wiederzugeben ist
  choice: fort von deinem Angesicht
  alternative: vor deiner Gegenwart
  rationale: „Angesicht“ erhält die konkrete Metapher des Ausgangstextes und bezeichnet im Kontext dennoch verständlich Gottes persönliche Gegenwart, ohne die Bildsprache vorschnell aufzulösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter poetischer Parallelstruktur. „Angesicht“ ist leicht gehoben, erhält aber das hebräische Bild und ist im Psalmkontext allgemein verständlich.
