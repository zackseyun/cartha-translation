  terminology: „Deinem Geist“ ist angesichts des Kontextes und des Parallelismus mit Gottes Angesicht eine gut begründete Wiedergabe von רוּחֶךָ. Die Fußnote nennt die wesentlichen lexikalischen Alternativen „Wind“ und „Atem“, ohne deren Geltung für diesen Kontext zu behaupten. Die Großschreibung ist bei göttlichem Bezug im Deutschen angemessen.
