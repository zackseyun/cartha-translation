  text: My frame was not hidden from you when I was made in secret[b][a], woven in the depths of the earth.
translation:
  language: de
  text: Mein Leib war dir nicht verborgen, als ich im Verborgenen gemacht wurde[b], kunstvoll gewoben in den Tiefen der Erde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den untersten Bereichen der Erde“. Die hebräische Wendung kann ein poetisches Bild für verborgene Entstehung sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Die beiden parallelen Aussagen lassen sich auch verbinden: „als ich im Verborgenen gemacht und in den Tiefen der Erde kunstvoll gewoben wurde“.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: נִכְחַד
  choice: war nicht verborgen
  rationale: Das Nifal von כחד bezeichnet hier das Verborgensein beziehungsweise Verhülltsein. „War nicht verborgen“ bewahrt die passive Aussage und passt idiomatisch zu „dir“.
- source_word: עָצְמִי
  choice: mein körperliches Gefüge
  rationale: עֶצֶם kann „Knochen“ bedeuten, bezeichnet hier aber im Zusammenhang der vorgeburtlichen Entstehung umfassender die leibliche Struktur. „Körperliches Gefüge“ bewahrt diesen Sinn, ohne ihn auf einzelne Knochen zu verengen.
- source_word: מִמֶּךָּ
  choice: dir
  rationale: 'Die Verbindung מן mit „verborgen“ wird im Deutschen natürlich durch den Dativ ausgedrückt: „dir nicht verborgen“.'
- source_word: אֲשֶׁר
  choice: als
  rationale: Die Relativpartikel führt hier den zeitlichen Umstand ein, unter dem das körperliche Gefüge nicht vor Gott verborgen war.
- source_word: עֻשֵּׂיתִי
  choice: ich … gemacht wurde
  rationale: Das passive עשה ist allgemein und wird mit „gemacht wurde“ direkt wiedergegeben; das bildkräftigere folgende Verb bleibt dadurch unterscheidbar.
- source_word: בַסֵּתֶר
  choice: im Verborgenen
  rationale: Die Wendung bezeichnet einen verborgenen, dem menschlichen Blick entzogenen Bereich. „Im Verborgenen“ ist natürlich, würdevoll und wahrt die poetische Parallelität.
- source_word: רֻקַּמְתִּי
  choice: kunstvoll gewoben
  rationale: רקם ruft das Bild kunstvoller Web- oder Stickarbeit hervor. „Kunstvoll gewoben“ erhält sowohl die Textilmetapher als auch den Gedanken sorgfältiger Gestaltung.
- source_word: בְּתַחְתִּיּוֹת אָרֶץ
  choice: in den Tiefen der Erde
  rationale: Die Formulierung bewahrt das räumliche Bild des Hebräischen, ohne es ausdrücklich als wörtliche Ortsangabe oder ausschließlich als Umschreibung des Mutterleibs festzulegen.
theological_decisions:
- issue: Bedeutung von „den Tiefen der Erde“
  choice: Das poetische Erdbild bleibt im Haupttext unverändert stehen und wird nicht ausdrücklich mit dem Mutterleib gleichgesetzt.
  alternative: Die Wendung unmittelbar als Metapher für die verborgene vorgeburtliche Bildung im Mutterleib wiederzugeben.
  rationale: Der Zusammenhang legt die verborgene und geheimnisvolle vorgeburtliche Entstehung nahe; die konkrete Bildsprache kann jedoch zugleich weiterreichende kosmologische Assoziationen tragen. Die Übersetzung bewahrt diese Spannung, statt sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Bildsprache. „Körperliches Gefüge“ vermeidet sowohl das heute missverständliche „Gebein“ als auch das zu allgemeine „Körper“. Die asyndetische zweite Halbzeile wird als poetische Partizipialfügung wiedergegeben.
