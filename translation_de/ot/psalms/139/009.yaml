  yaml_path: translation/ot/psalms/139/009.yaml
  text: If I take up the wings of the dawn[a], if I dwell in the farthest part of the sea,
translation:
  language: de
  text: Nähme ich die Flügel der Morgenröte und ließe mich am äußersten Ende des Meeres[a] nieder,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im fernsten Westen“; „Meer“ kann in der hebräischen poetischen Raumvorstellung zugleich eine westliche Richtung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא
  choice: nähme ich
  rationale: נשׂא bedeutet wörtlich „heben, tragen, nehmen“. Im poetischen Bedingungssatz gibt der Konjunktiv „nähme ich“ die Vorstellung eines hypothetischen Ergreifens oder Gebrauchens der Flügel natürlich wieder.
- source_word: כַנְפֵי
  choice: die Flügel
  rationale: כָּנָף bezeichnet gewöhnlich einen Flügel, erweitert auch Rand oder äußerstes Ende. Zusammen mit „Morgenröte“ bleibt das anschauliche poetische Bild am besten erhalten.
- source_word: שָׁחַר
  choice: der Morgenröte
  rationale: שַׁחַר bezeichnet Morgendämmerung oder Tagesanbruch. „Morgenröte“ ist im Deutschen bildkräftig und passt natürlich zur Metapher der Flügel.
- source_word: אֶשְׁכְּנָה
  choice: ließe mich … nieder
  rationale: שׁכן kann „wohnen, sich niederlassen“ bedeuten. Im Parallelismus bezeichnet die Form ein hypothetisches Niederlassen an einem fernen Ort; die konjunktivische Wendung ist im Deutschen idiomatisch.
- source_word: בְּאַחֲרִית
  choice: am äußersten Ende
  rationale: אַחֲרִית bezeichnet hier räumlich das Ende oder die fernste Grenze. „Am äußersten Ende“ bewahrt diesen räumlichen Grenzbegriff und klingt im poetischen Zusammenhang natürlich.
- source_word: יָם
  choice: des Meeres
  rationale: יָם bedeutet zunächst „Meer“, kann in der hebräischen Raumvorstellung aber auch den Westen bezeichnen. Der Haupttext bewahrt die konkrete Bedeutung; die mögliche Richtungsangabe steht in der Fußnote.
