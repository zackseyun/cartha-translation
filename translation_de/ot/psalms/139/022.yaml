  variant: modern standard German
source:
  edition: WLC
  text: תַּכְלִ֣ית שִׂנְאָ֣ה שְׂנֵאתִ֑י/ם לְ֝/אוֹיְבִ֗ים הָ֣יוּ לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/022.yaml
  text: I hate them with complete hatred[a]; they have become enemies to me.
translation:
  language: de
  text: Mit vollkommenem Hass hasse ich sie[a]; sie sind mir zu Feinden geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit äußerstem Hass“ oder „mit rückhaltlosem Hass“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּכְלִית
  choice: vollkommenem
  rationale: Das Substantiv bezeichnet Vollendung, äußerste Grenze oder Ganzheit und verstärkt in der Verbindung mit שִׂנְאָה den Hass als vollständig beziehungsweise uneingeschränkt. „Vollkommenem“ bewahrt diese starke, im Deutschen zugleich mehrdeutige Aussage.
- source_word: שִׂנְאָה
  choice: Hass
  rationale: Das Nomen bildet mit תַּכְלִית die betonte Wendung „mit vollkommenem Hass“. Die substantivische Wiedergabe erhält die Wiederholung des hebräischen Hass-Wortstamms.
- source_word: שְׂנֵאתִים
  choice: hasse ich sie
  rationale: Das Qal-Perfekt der 1. Person Singular mit Suffix der 3. Person Plural bezeichnet hier im poetischen Zusammenhang eine gegenwärtige, entschiedene Haltung. Das deutsche Präsens ist dafür natürlich.
- source_word: לְאוֹיְבִים
  choice: zu Feinden
  rationale: Die Präposition לְ mit היה kennzeichnet eine gewordene beziehungsweise bestehende Rolle oder einen resultierenden Zustand. „Zu Feinden“ bildet die hebräische Konstruktion prägnant ab.
- source_word: הָיוּ לִי
  choice: sie sind mir zu Feinden geworden
  rationale: Die Formulierung bewahrt sowohl den resultativen Sinn von היה mit לְ als auch die persönliche Beziehung, die durch לִי („mir“) ausgedrückt wird.
theological_decisions:
- issue: Stärke der Verurteilung durch den Psalmbeter
  choice: Die ausdrückliche Aussage persönlichen Hasses wird ungemildert beibehalten.
  alternative: „Ich lehne sie völlig ab“ oder „ich betrachte sie als Feinde“
  rationale: Der hebräische Text verwendet den Wortstamm für Hass zweimal und formuliert bewusst scharf. Eine Abschwächung zu bloßer Ablehnung oder Gegnerschaft würde die Spannung des Textes interpretierend auflösen.
translation_notes:
  register: Moderne, würdevolle Psalmsprache. Die figura etymologica „mit … Hass hasse ich“ wird trotz ihrer Härte bewahrt, weil sie die bewusste Wiederholung und Nachdrücklichkeit des Hebräischen wiedergibt. „Vollkommen“ bleibt semantisch offen zwischen vollständig, bis zum Äußersten und uneingeschränkt.
