source:
  edition: WLC
  text: לַ֭/מְנַצֵּחַ לְ/דָוִ֣ד מִזְמ֑וֹר יְהוָ֥ה חֲ֝קַרְתַּ֗/נִי וַ/תֵּדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/001.yaml
  text: For the choirmaster[a]. Of David. A psalm. O Yahweh[b], you have searched me and known me.
translation:
  language: de
  text: 'Für den Chorleiter[a]. Von David[b]. Ein Psalm.


    Jahwe, du hast mich erforscht und kennst mich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „An den Chorleiter“; die hebräische Präposition kann in Psalmüberschriften eine Bestimmung oder Ausrichtung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung kann Urheberschaft, Widmung oder allgemeine Zuordnung zu David bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Der Ausdruck bezeichnet in Psalmüberschriften den musikalischen Leiter. „Für“ gibt die Präposition לְ natürlich wieder; die mögliche Richtungsbedeutung wird in einer Fußnote genannt.
- source_word: לְדָוִד
  choice: Von David
  rationale: „Von David“ ist eine knappe, im Deutschen übliche Überschrift und lässt eher als „verfasst von David“ offen, ob Urheberschaft, Zuordnung oder Widmung gemeint ist.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: מִזְמוֹר bezeichnet ein zum musikalischen Vortrag bestimmtes Lied beziehungsweise einen Psalm; „Ein Psalm“ ist die klare und etablierte deutsche Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: חֲקַרְתַּנִי
  choice: du hast mich erforscht
  rationale: חקר bezeichnet gründliches Erforschen oder Prüfen. Das deutsche Perfekt gibt die abgeschlossene Handlung wieder, deren Ergebnis für die Gegenwart gilt.
- source_word: וַתֵּדָע
  choice: und kennst mich
  rationale: ידע bedeutet „kennen, wissen“. Im Zusammenhang bezeichnet die Verbfolge das aus dem Erforschen hervorgehende, gegenwärtig umfassende Kennen; das im Hebräischen elliptische Objekt wird im Deutschen zur Klarheit ergänzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt den Charakter eines persönlichen Namens, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לְדָוִד in der Überschrift
  choice: Von David
  alternative: Für David / David gewidmet / verfasst von David
  rationale: Die Präposition לְ kann in Psalmüberschriften Urheberschaft, Zugehörigkeit, Widmung oder Verbindung ausdrücken. Die Übersetzung legt diese Frage nicht ausdrücklich fest; die Fußnote bewahrt die Mehrdeutigkeit.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Psalmüberschrift bleibt knapp und formal. Die direkte Anrede verwendet den geläufigen deutschen Gottesnamen „Jahwe“. „Kennst mich“ formuliert den fortdauernden Erkenntniszustand natürlich, ohne die enge Verbindung zum vorausgehenden Erforschen aufzulösen.
