source:
  edition: WLC
  text: יִֽירְא֣וּ מֵ֭/יְהוָה כָּל הָ/אָ֑רֶץ מִמֶּ֥/נּוּ יָ֝ג֗וּרוּ כָּל יֹשְׁבֵ֥י תֵבֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/008.yaml
  text: Let all the earth fear Yahweh[a]; let all the inhabitants of the world stand in awe of him.
translation:
  language: de
  text: Die ganze Erde fürchte Jahwe; alle Bewohner der Welt sollen vor ihm erschauern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich vor ihm fürchten“ bzw. „vor ihm beben“. Das hebräische Verb bezeichnet furchtsame, ehrfürchtige Scheu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִירְאוּ
  choice: fürchte
  rationale: Der Qal-Imperfekt steht hier auffordernd. Die deutsche Form „fürchte“ bewahrt sowohl die volitive Kraft als auch das Bedeutungsspektrum von ehrfürchtiger bis furchtsamer Scheu.
- source_word: מֵיְהוָה
  choice: Jahwe
  rationale: Die Präposition מִן steht hier idiomatisch beim Verb ירא und bezeichnet den, den man fürchtet. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: כָּל הָאָרֶץ
  choice: die ganze Erde
  rationale: Der Parallelismus mit den Bewohnern der תֵבֵל zeigt den weltweiten Sinn; daher „Erde“ und nicht „Land“.
- source_word: מִמֶּנּוּ
  choice: vor ihm
  rationale: Bei גור bezeichnet מִן mit Pronomen denjenigen, der Scheu oder Schrecken hervorruft. „Vor ihm“ ist im Deutschen idiomatisch und erhält die Beziehung zum Gottesnamen im ersten Halbvers.
- source_word: יָגוּרוּ
  choice: sollen … erschauern
  rationale: גור bezeichnet hier furchtsame Scheu oder Erschrecken. „Erschauern“ wahrt die Intensität und variiert zugleich den Ausdruck gegenüber „fürchten“ im parallelen ersten Halbvers.
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  choice: alle Bewohner der Welt
  rationale: Der partizipiale Konstruktus bezeichnet die Bewohner; תֵבֵל meint die bewohnte Welt. Die Formulierung ist präzise und natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang der Gottesfurcht
  choice: fürchten / erschauern
  alternative: verehren / Ehrfurcht haben
  rationale: Die kräftigeren Ausdrücke bewahren die Spannung zwischen Ehrfurcht und wirklicher Furcht in ירא und גור, ohne sie auf bloßen Respekt zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetisch parallelem Satzbau. Der Konjunktiv „fürchte“ und die Konstruktion „sollen … erschauern“ geben den auffordernden Charakter beider Verbformen verständlich wieder.
