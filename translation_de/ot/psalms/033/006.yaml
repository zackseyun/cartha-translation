  text: בִּ/דְבַ֣ר יְ֭הוָה שָׁמַ֣יִם נַעֲשׂ֑וּ וּ/בְ/ר֥וּחַ פִּ֝֗י/ו כָּל צְבָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/006.yaml
  text: By the word of Yahweh the heavens were made[a], and by the breath of his mouth all their host.
translation:
  language: de
  text: Durch das Wort Jahwes wurden die Himmel gemacht, und durch den Hauch seines Mundes ihr ganzes Heer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und durch den Geist seines Mundes ihr ganzes Heer“. Das hebräische Wort kann „Hauch“, „Wind“ oder „Geist“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּדְבַר
  choice: Durch das Wort
  rationale: Die Präposition ב bezeichnet hier das Mittel. „Durch das Wort“ gibt diese instrumentale Bedeutung im Deutschen natürlich und präzise wieder.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und im Genitiv natürlich in den deutschen Satz eingefügt.
- source_word: שָׁמַיִם
  choice: die Himmel
  rationale: Der Plural bewahrt die Form und den umfassenden Schöpfungsbezug des hebräischen Ausdrucks.
- source_word: נַעֲשׂוּ
  choice: wurden … gemacht
  rationale: Das Verb עשה bedeutet allgemein „machen/tun“. „Gemacht“ ist direkt und vermeidet die stärkere, hier nicht ausdrücklich verwendete Bedeutung „erschaffen“.
- source_word: וּבְרוּחַ
  choice: und durch den Hauch
  rationale: רוּחַ kann „Hauch“, „Wind“ oder „Geist“ bedeuten. Wegen der unmittelbaren Verbindung mit „seines Mundes“ passt „Hauch“ am besten zum poetischen Parallelismus; „Geist“ bleibt als Alternative in der Fußnote erhalten.
- source_word: פִּיו
  choice: seines Mundes
  rationale: Die wörtliche Wiedergabe bewahrt das poetische Bild und die Entsprechung zwischen „Wort“ und „Hauch“.
- source_word: כָּל־צְבָאָם
  choice: ihr ganzes Heer
  rationale: צָבָא bezeichnet beim Himmel dessen geordnete Schar, besonders Sterne und Himmelskörper. „Ihr ganzes Heer“ wahrt das Bild und bezieht das Suffix auf die Himmel.
theological_decisions:
- issue: רוּחַ im Schöpfungskontext und eine mögliche Anspielung auf den Geist Gottes
  choice: Hauch
  alternative: Geist
  rationale: Der Parallelismus „Wort Jahwes“ und „Hauch seines Mundes“ spricht im unmittelbaren Zusammenhang für „Hauch“. Die mögliche geisttheologische Resonanz wird nicht ausgeschlossen, sondern in der Fußnote als echte lexikalische Alternative kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den hebräischen Parallelismus. „Heer“ erhält das traditionelle kosmische Bild; die Wortstellung bleibt klar und gut vorlesbar.
