source:
  edition: WLC
  text: שִֽׁירוּ ל֭/וֹ שִׁ֣יר חָדָ֑שׁ הֵיטִ֥יבוּ נַ֝גֵּ֗ן בִּ/תְרוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/003.yaml
  text: Sing to him a new song[a]; play skillfully with a joyful shout.
translation:
  language: de
  text: Singt ihm ein neues Lied; spielt gekonnt unter Jubelrufen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit lautem Jubel“; תְּרוּעָה kann einen Jubelruf, eine laute Akklamation oder auch trompetenartigen Schall bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Singt
  rationale: Der pluralische Imperativ von שׁיר bezeichnet unmittelbar das Singen; „Singt“ ist im Deutschen klar und natürlich.
- source_word: לוֹ
  choice: ihm
  rationale: Die Präposition ל mit Suffix bezeichnet hier den Adressaten des Liedes; im Zusammenhang ist Gott gemeint.
- source_word: שִׁיר חָדָשׁ
  choice: ein neues Lied
  rationale: Die direkte Wiedergabe bewahrt sowohl den Wortsinn als auch den in den Psalmen wiederkehrenden liturgischen Ausdruck.
- source_word: הֵיטִיבוּ נַגֵּן
  choice: spielt gekonnt
  rationale: הֵיטִיבוּ hat zusammen mit נַגֵּן adverbiale Kraft und fordert zu gutem beziehungsweise kunstfertigem Musizieren auf. „Spielt gekonnt“ gibt dies knapp und idiomatisch wieder.
- source_word: בִּתְרוּעָה
  choice: unter Jubelrufen
  rationale: תְרוּעָה bezeichnet einen lauten Ruf oder eine Akklamation und kann auch trompetenartigen Schall meinen. Im Lobkontext liegt freudiger Jubel nahe, ohne dass die instrumentale Möglichkeit ausgeschlossen werden darf.
theological_decisions:
- issue: Bezug des maskulinen Singularsuffixes in לוֹ
  choice: „ihm“ bezieht sich auf Gott als den Empfänger des Lobes.
  alternative: Das Pronomen ohne ausdrückliche Auflösung stehen lassen.
  rationale: Der unmittelbare Zusammenhang des Psalms macht Gott zum Adressaten. Die deutsche Pronomenform bewahrt zugleich die Ausdrucksweise des Hebräischen, ohne den Gottesnamen ergänzend einzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Aufforderungsstil des Hebräischen bleibt erhalten; „gekonnt“ vermeidet eine hölzerne Wiedergabe wie „spielt gut“, und die Fußnote bewahrt die Bedeutungsbreite von תְּרוּעָה.
