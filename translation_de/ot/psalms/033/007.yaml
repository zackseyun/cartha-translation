base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/007.yaml
  text: He gathers the waters of the sea like a heap[b][a]; he puts the depths in storehouses.
translation:
  language: de
  text: Er sammelt die Wasser des Meeres wie ein Haufen[a]; er legt die Tiefen[b] in Vorratskammern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie einen Hügel“; manche verstehen das Wort angesichts ähnlicher Wasserbilder an anderen Stellen als „wie eine Mauer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die tiefen Wasser“. Der hebräische Plural kann die großen Meerestiefen oder urzeitliche Wassertiefen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּנֵס
  choice: sammelt
  rationale: Das Qal-Partizip von כנס bezeichnet das Zusammenbringen oder Sammeln. Das Präsens gibt die beschreibende, poetische Aussage im Deutschen natürlich wieder.
- source_word: כַּנֵּד
  choice: wie einen Haufen
  rationale: נֵד bezeichnet eine aufgehäufte Masse, besonders auch bei Wasser. Die Formulierung bewahrt das konkrete und ungewöhnliche Bild des Hebräischen.
- source_word: מֵי הַיָּם
  choice: die Wasser des Meeres
  rationale: Die Konstruktion bedeutet wörtlich „die Wasser des Meeres“. Der Plural „Wasser“ ist hier poetisch angemessen und erhält die Ausdrucksweise der Vorlage.
- source_word: נֹתֵן
  choice: legt
  rationale: Das Qal-Partizip von נתן hat das breite Bedeutungsfeld „geben, setzen, legen“. „Legt“ passt natürlich zum Bild der Unterbringung in Vorratskammern.
- source_word: בְּאֹצָרוֹת
  choice: in Vorratskammern
  rationale: אֹצָר kann Schatzkammer, Vorratsraum oder Speicher bezeichnen. Im kosmologischen Bild vermittelt „Vorratskammern“ den Gedanken verwahrter Wassermassen klar.
- source_word: תְּהוֹמוֹת
  choice: die Tiefen
  rationale: Der Plural von תְּהוֹם kann die großen Meerestiefen oder urzeitlichen Tiefenwasser bezeichnen. „Die Tiefen“ wahrt den Plural und lässt den poetisch-kosmologischen Bezug offen.
theological_decisions:
- issue: Kosmologische Bildsprache von Gottes Herrschaft über das Meer
  choice: Die konkreten Bilder vom aufgehäuften Wasser und von Vorratskammern bleiben erhalten.
  alternative: 'Abstrakt wiedergeben: „Er beherrscht das Meer“ oder „Er bewahrt die Ozeane auf“.'
  rationale: Der hebräische Vers schildert Gottes souveräne Ordnung der Wasser durch anschauliche poetische Bilder. Eine abstrakte Paraphrase würde diese Bildkraft und die Anklänge an die chaotischen Tiefen abschwächen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit bewahrter hebräischer Parallelstruktur und konkreter kosmologischer Bildsprache. Die ungewöhnliche Wendung „die Wasser“ ist bewusst poetisch gehalten.
