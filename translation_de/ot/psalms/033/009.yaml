source:
  edition: WLC
  text: כִּ֤י ה֣וּא אָמַ֣ר וַ/יֶּ֑הִי הֽוּא צִ֝וָּ֗ה וַֽ/יַּעֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/009.yaml
  text: For he spoke[a], and it came to be; he commanded[b], and it stood firm.
translation:
  language: de
  text: Denn er sprach, und es geschah[a]; er gebot, und es stand fest[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und es war“. Das Hebräische ist sehr knapp: „und es war/geschah“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und es stand da“ oder „und es wurde aufgerichtet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aufforderung ein und gibt die kausale Funktion im Deutschen natürlich wieder.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen hebt den Handelnden hervor; im deutschen poetischen Parallelismus genügt das betonte „er“, ohne einen zusätzlichen Ausdruck wie „er selbst“ aufzudrängen.
- source_word: אָמַר
  choice: sprach
  rationale: Gibt das göttliche Reden direkt und in einem würdigen poetischen Register wieder.
- source_word: וַיְהִי
  choice: und es geschah
  rationale: Die knappe Wendung bezeichnet hier die unmittelbare Verwirklichung dessen, was Gott ausgesprochen hat. „Es geschah“ wahrt zugleich die Prägnanz und die Offenheit des Hebräischen.
- source_word: צִוָּה
  choice: gebot
  rationale: Bezeichnet das Erteilen eines wirksamen Befehls und bildet eine klare Parallele zu „sprach“.
- source_word: וַיַּעֲמֹד
  choice: und es stand fest
  rationale: Bewahrt das konkrete Bild des Stehens und bringt im Deutschen zugleich den resultativen Sinn von Bestand und Festigkeit zum Ausdruck.
theological_decisions:
- issue: Schöpfungs- und Wirklichkeitssprache als Folge des göttlichen Redens
  choice: „es geschah“ und „es stand fest“
  alternative: „es war“ und „es stand“ beziehungsweise „es entstand“ und „es wurde aufgerichtet“
  rationale: Die Übersetzung beschreibt knapp die unmittelbare und dauerhafte Wirksamkeit von Gottes Wort, ohne die poetische Aussage durch eine weitergehende dogmatische Deutung einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Die Wiederholung von „er“ und „es“ bildet die hebräische Satzfolge transparent ab; „stand fest“ bleibt bildhaft und zugleich idiomatisch.
