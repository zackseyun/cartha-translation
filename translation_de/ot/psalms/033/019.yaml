translation:
  language: de
  text: um ihr Leben vor dem Tod zu retten und sie in der Hungersnot am Leben zu erhalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „ihre Seele“; das hebräische Wort nefesch kann die Seele, die Person oder das Leben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַצִּיל
  choice: zu retten
  rationale: Der Hifil-Infinitiv von נצל bezeichnet das Befreien oder Retten aus einer Gefahr. „Retten“ ist im modernen Deutsch natürlich und verbindet sich treffend mit „vor dem Tod“.
- source_word: מִמָּוֶת
  choice: vor dem Tod
  rationale: Die Präposition מן bezeichnet hier die Abwendung bzw. Rettung aus dem Machtbereich des Todes. Im Deutschen ist „vor dem Tod retten“ idiomatischer als „vom Tod retten“, ohne die Aussage zu erweitern.
- source_word: נַפְשָׁם
  choice: ihr Leben
  rationale: נֶפֶשׁ kann Seele, Person, Selbst oder Leben bezeichnen. Im Zusammenhang mit Tod und körperlichem Überleben gibt „ihr Leben“ den Sinn natürlich wieder; die kollektive Singularform bleibt dabei erkennbar. Die formalere Alternative „ihre Seele“ wird in der Fußnote bewahrt.
- source_word: וּלְחַיּוֹתָם
  choice: und sie … am Leben zu erhalten
  rationale: Die Form von חיה bedeutet hier, jemanden lebendig zu erhalten. Diese Wendung ist klar, idiomatisch und bildet die fortdauernde Bewahrung ab.
- source_word: בָּרָעָב
  choice: in der Hungersnot
  rationale: רָעָב bezeichnet in diesem Kontext eine Hungersnot und nicht nur subjektiven Hunger. Der bestimmte Artikel entspricht dem determinierten hebräischen Ausdruck.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Psalmsprache. Die parallelen Infinitivwendungen werden mit „um … zu“ und „und … zu“ wiedergegeben. „Ihr Leben“ vermeidet im Deutschen die missverständliche Vorstellung, ausschließlich ein vom Körper getrenntes Seelenelement werde gerettet, während die Fußnote die Breite und Form des hebräischen Ausdrucks offenhält.
