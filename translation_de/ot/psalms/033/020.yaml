  variant: modern standard German
source:
  edition: WLC
  text: נַ֭פְשֵׁ/נוּ חִכְּתָ֣ה לַֽ/יהוָ֑ה עֶזְרֵ֖/נוּ וּ/מָגִנֵּ֣/נוּ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/020.yaml
  text: Our soul waits for Yahweh[a]; he is our help and our shield.
translation:
  language: de
  text: Unsere Seele wartet auf Jahwe[a]; er ist unsere Hilfe und unser Schild.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Unsere Seele wartet auf Jahwe.“ „Seele“ bezeichnet hier die Gemeinschaft in ihrem ganzen inneren Sein, nicht nur einen immateriellen Teil des Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: Unsere Seele
  rationale: Der Singular mit Suffix der 1. Person Plural bezeichnet gemeinschaftlich das ganze innere Selbst beziehungsweise die ganze Gemeinschaft. „Unsere Seele“ bewahrt das hebräische Bild, ohne es zu „wir“ zu verflachen.
- source_word: חִכְּתָה
  choice: wartet
  rationale: חכה bezeichnet erwartungsvolles Warten. Das deutsche Präsens passt zum poetischen Zusammenhang und gibt den resultativen beziehungsweise gegenwärtigen Sinn der hebräischen Perfektform natürlich wieder.
- source_word: לַיהוָה
  choice: auf Jahwe
  rationale: Die Präposition ל bezeichnet hier den, auf den sich das Warten richtet; im Deutschen lautet die idiomatische Verbindung „auf jemanden warten“. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: עֶזְרֵנוּ
  choice: unsere Hilfe
  rationale: עֵזֶר bedeutet „Hilfe, Beistand“. Die substantivische Form „unsere Hilfe“ erhält die nominale Aussage des Hebräischen.
- source_word: וּמָגִנֵּנוּ
  choice: und unser Schild
  rationale: מָגֵן bedeutet wörtlich „Schild“. Das verständliche Schutzbild wird beibehalten und nicht zu „Beschützer“ aufgelöst.
- source_word: הוּא
  choice: er ist
  rationale: Das selbstständige Pronomen setzt Nachdruck; im Deutschen wird für den nominalen Satz die Kopula „ist“ ergänzt, ohne das nicht ausdrücklich vorhandene „allein“ einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen; „Jehova“ beruht auf einer späteren Mischlesung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem hebräischem Parallelismus und der konkreten Schildmetapher. Die kollektive Singularform „unsere Seele“ ist bewusst erhalten.
