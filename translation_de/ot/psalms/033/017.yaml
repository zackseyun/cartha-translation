  text: שֶׁ֣קֶר הַ֭/סּוּס לִ/תְשׁוּעָ֑ה וּ/בְ/רֹ֥ב חֵ֝יל֗/וֹ לֹ֣א יְמַלֵּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/017.yaml
  text: A horse is a false hope for deliverance[b][a], and by its great strength it cannot rescue.
translation:
  language: de
  text: Ein Pferd ist eine trügerische Hoffnung auf Rettung[a]; auch mit all seiner Kraft kann es nicht retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Pferd ist eine Täuschung, wenn es um Heil oder Sieg geht.“ Das Hebräische ist knapp; gemeint ist, dass sich ein Pferd als Mittel zur Rettung als trügerisch und vergeblich erweist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: eine trügerische Hoffnung
  rationale: Das Substantiv bezeichnet Falschheit oder Täuschung. In Verbindung mit dem Pferd als Mittel zur Rettung gibt die Wendung idiomatisch wieder, dass das Vertrauen darauf sich als trügerisch erweist.
- source_word: הַסּוּס
  choice: ein Pferd
  rationale: Obwohl im Hebräischen der bestimmte Artikel steht, ist das Pferd hier generisch als Vertreter seiner Art gemeint; der unbestimmte Singular ist dafür im Deutschen natürlich.
- source_word: לִתְשׁוּעָה
  choice: auf Rettung
  rationale: Das Wort kann Rettung, Heil oder Sieg bezeichnen. Im militärischen Zusammenhang passt „Rettung“ am besten, ohne die mögliche Bedeutung unnötig theologisch einzuengen; die Alternativen werden in der Fußnote genannt.
- source_word: וּבְרֹב חֵילוֹ
  choice: trotz seiner großen Kraft
  rationale: Wörtlich steht „und bei/in der Fülle seiner Kraft“. Der Zusammenhang betont, dass selbst große Pferdestärke keine Rettung bewirken kann; „trotz“ macht diesen konzessiven Sinn im Deutschen klar.
- source_word: לֹא יְמַלֵּט
  choice: kann es nicht retten
  rationale: Das Piel von מלט bedeutet hier retten oder in Sicherheit bringen. „Kann … nicht“ bringt die im Kontext ausgesagte Unfähigkeit natürlich zum Ausdruck.
theological_decisions:
- issue: Bedeutungsumfang von תְּשׁוּעָה
  choice: Rettung
  alternative: Heil oder Sieg
  rationale: Der militärische Kontext legt konkrete Rettung nahe, doch die Fußnote bewahrt den weiteren Bedeutungsumfang des hebräischen Ausdrucks.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, sentenzartigem Klang. Die Wiederholung von „Rettung/retten“ spiegelt den Parallelismus; „trügerische Hoffnung“ gibt die knappe hebräische Aussage idiomatisch wieder.
