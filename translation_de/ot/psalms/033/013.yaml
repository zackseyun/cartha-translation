source:
  edition: WLC
  text: מִ֭/שָּׁמַיִם הִבִּ֣יט יְהוָ֑ה רָ֝אָ֗ה אֶֽת כָּל בְּנֵ֥י הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/013.yaml
  text: From heaven Yahweh looks[a]; he sees all the sons of man.
translation:
  language: de
  text: Vom Himmel blickt Jahwe herab; er sieht alle Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle Söhne des Menschen“; eine poetische Bezeichnung für die gesamte Menschheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: Vom Himmel
  rationale: מִן bezeichnet den Ausgangspunkt, שָׁמַיִם den himmlischen Bereich. Der deutsche Singular „Himmel“ ist hier die natürliche idiomatische Wiedergabe.
- source_word: הִבִּיט
  choice: blickt … herab
  rationale: Der Hifil von נבט bezeichnet ein gezieltes Hinschauen. „Herab“ verdeutlicht im Deutschen die durch „vom Himmel“ vorgegebene Blickrichtung, ohne den Sinn zu erweitern. Das Perfekt wird als allgemeingültige Gegenwart wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: רָאָה
  choice: er sieht
  rationale: ראה bedeutet gewöhnlich „sehen“. Parallel zu הִבִּיט beschreibt das Perfekt hier eine allgemeingültige, fortdauernde Wirklichkeit und steht daher im Präsens.
- source_word: כָּל
  choice: alle
  rationale: כָּל bezeichnet zusammen mit dem folgenden Pluralausdruck die Gesamtheit.
- source_word: בְּנֵי הָאָדָם
  choice: alle Menschen
  rationale: Die wörtliche Form „Söhne des Menschen“ ist eine hebräische poetische Sammelbezeichnung für die Menschen insgesamt. „Alle Menschen“ gibt ihren gemeinten Umfang in heutigem, natürlichem Deutsch wieder; die Bildform bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den Unterschied zwischen Name und Titel.
- issue: Kollektive Bedeutung von בְּנֵי הָאָדָם
  choice: alle Menschen
  alternative: alle Söhne des Menschen / alle Menschenkinder
  rationale: Die Formulierung umfasst die gesamte Menschheit und beschränkt die Aussage nicht auf männliche Personen. Die idiomatische Bedeutung steht im Haupttext, während die wörtliche poetische Form in der Fußnote dokumentiert wird.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die parallelen Verben „blickt“ und „sieht“ bewahren die poetische Struktur; das Semikolon bildet die hebräische Parallelität ab.
