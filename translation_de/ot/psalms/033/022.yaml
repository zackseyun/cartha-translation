base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/022.yaml
  text: Let your steadfast love be upon us, O LORD, even as we hope in you.
translation:
  language: de
  text: Deine treue Liebe sei über uns, HERR, wie wir auf dich hoffen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד (ḥesed)
  choice: treue Liebe
  rationale: Die Verbindung gibt sowohl die beständige, verlässliche Zuwendung als auch den Beziehungscharakter des hebräischen Begriffs wieder; „Gnade“ allein wäre enger, „Güte“ weniger persönlich.
- source_word: יְהִי (jəhî)
  choice: sei
  rationale: Der deutsche Jussiv gibt den hebräischen Wunsch beziehungsweise die Bitte knapp und würdig wieder.
- source_word: כַּאֲשֶׁר (kaʾăšer)
  choice: wie
  rationale: Bewahrt die offene Beziehung zwischen Gottes Zuwendung und dem Hoffen der Betenden, ohne sie ausdrücklich kausal oder proportional festzulegen.
- source_word: יִחַלְנוּ לָךְ (yiḥalnû lāḵ)
  choice: wir auf dich hoffen
  rationale: Natürliches Deutsch für das erwartungsvolle, vertrauensvolle Warten des hebräischen Verbs; die Präposition לְ wird idiomatisch mit „auf“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen entspricht dem jüdischen Lesegebrauch und ist im deutschsprachigen Bibelregister verständlich, ohne eine unsichere Aussprache festzulegen.
- issue: Verhältnis von Gottes treuer Liebe zum menschlichen Hoffen
  choice: wie wir auf dich hoffen
  alternative: entsprechend unserem Hoffen auf dich / weil wir auf dich hoffen
  rationale: Das hebräische כַּאֲשֶׁר bleibt semantisch offen; die Übersetzung vermeidet es, Gottes Liebe eindeutig als Verdienst, Maß oder bloße Folge menschlichen Hoffens zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit parallelem, gebetsartigem Satzbau. Das personbezogene „dich“ bleibt kleingeschrieben gemäß heutiger Rechtschreibung; „HERR“ kennzeichnet die Wiedergabe des Gottesnamens.
