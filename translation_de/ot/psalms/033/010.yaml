id: PSA.33.10
reference: Psalms 33:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְֽהוָ֗ה הֵפִ֥יר עֲצַת גּוֹיִ֑ם הֵ֝נִ֗יא מַחְשְׁב֥וֹת עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/010.yaml
  text: Yahweh frustrates the counsel of the nations[a]; he thwarts the plans of the peoples.
translation:
  language: de
  text: Jahwe[a] vereitelt den Rat der Nationen; er durchkreuzt die Pläne der Völker.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; auch mit „Jehova“ wiedergegeben, traditionell durch „der HERR“ ersetzt.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche wissenschaftliche Wiedergabe des Tetragramms bewahrt den Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- source_word: הֵפִיר
  choice: vereitelt
  rationale: Der Hifil von פרר bezeichnet hier das Unwirksammachen eines Rates oder Vorhabens; „vereitelt“ gibt diese aktive Wirkung natürlich wieder.
- source_word: עֲצַת
  choice: den Rat
  rationale: עֵצָה kann Rat, Plan oder Beschluss bedeuten. „Rat“ bewahrt die poetische Unterscheidung zum folgenden „Pläne“ und passt zu den Beratungen der Nationen.
- source_word: גּוֹיִם
  choice: der Nationen
  rationale: Der Ausdruck bezeichnet hier politische bzw. ethnische Kollektive allgemein; „Nationen“ ist präzise und unterscheidet sich vom parallelen עַמִּים.
- source_word: הֵנִיא
  choice: durchkreuzt
  rationale: Der Hifil von ניא bezeichnet das Hindern oder Abwenden eines Vorhabens. „Durchkreuzt“ ist idiomatisch und hält den Parallelismus lebendig, ohne das erste Verb zu wiederholen.
- source_word: מַחְשְׁבוֹת
  choice: die Pläne
  rationale: Im Parallelismus mit עֲצַת meint das Wort nicht bloß Gedanken, sondern beabsichtigte Vorhaben.
- source_word: עַמִּים
  choice: der Völker
  rationale: „Völker“ gibt den kollektiven Plural wieder und bewahrt gegenüber גּוֹיִם / „Nationen“ die lexikalische Variation des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen YHWH. „Jahwe“ bewahrt ihn als Namen und entspricht der heute üblichen deutschen Transkription; die Fußnote weist transparent auf die hebräische Form und weitere traditionelle Wiedergaben hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe zweigliedrige Parallelstruktur und die Unterscheidung zwischen „Nationen“ und „Völker“ bleiben erhalten.
