  yaml_path: translation/ot/psalms/033/015.yaml
  text: the one who forms the hearts of them all[a], who understands all their deeds.
translation:
  language: de
  text: der die Herzen aller formt[a], der alle ihre Taten versteht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der ihre Herzen gemeinsam formt“. Das hebräische Wort יַחַד kann „gemeinsam“, „zugleich“ oder „allesamt“ bedeuten; hier kann es die Gesamtheit der Herzen hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּצֵר
  choice: der … formt
  rationale: Das substantivisch gebrauchte Qal-Partizip bezeichnet Gott charakterisierend als den, der formt; „formt“ bewahrt den aktiven, fortdauernden Sinn.
- source_word: יַחַד
  choice: von ihnen allen
  rationale: 'יַחַד wird hier distributiv beziehungsweise zusammenfassend verstanden: Gott formt die Herzen aller Menschen. Die Formulierung vermeidet den möglichen Eindruck, alle Herzen würden zu einem einzigen Ganzen verbunden.'
- source_word: לִבָּם
  choice: die Herzen von ihnen
  rationale: Der hebräische Singular mit Suffix kann auf Deutsch dem pluralischen Personenkreis entsprechend distributiv als „die Herzen“ wiedergegeben werden.
- source_word: הַמֵּבִין
  choice: der … versteht
  rationale: Das Hifil-Partizip von בין bezeichnet Verstehen oder Erkennen; „versteht“ ist klar und hält die Parallele der beiden Partizipialsätze aufrecht.
- source_word: אֶל
  choice: nicht gesondert wiedergegeben
  rationale: Die Präposition markiert bei בין den Gegenstand des Verstehens und wird im Deutschen idiomatisch durch den direkten Akkusativ ausgedrückt.
- source_word: כָּל מַעֲשֵׂיהֶם
  choice: alle ihre Taten
  rationale: „Taten“ gibt konkrete menschliche Handlungen wieder und lässt deren mögliche moralische Bewertung offen.
theological_decisions:
- issue: Reichweite der bezeichneten Menschen
  choice: Die Formulierung bezieht sich auf die Herzen aller zuvor genannten Menschen und auf alle ihre Taten.
  alternative: Eine engere Beziehung nur auf Könige oder Völker im unmittelbaren Umfeld.
  rationale: Der Zusammenhang in den Versen 13–15 spricht von allen Menschen und allen Bewohnern der Erde; die Übersetzung schränkt diesen umfassenden Bezug nicht ein.
- issue: Bedeutung von יַחַד
  choice: 'Zusammenfassend-distributiv: die Herzen von ihnen allen.'
  alternative: „ihre Herzen gemeinsam“ beziehungsweise „ihre Herzen zugleich“.
  rationale: Die Hauptfassung drückt die Gesamtheit aus, ohne Gleichförmigkeit, Gleichzeitigkeit oder eine Verschmelzung der Herzen theologisch festzuschreiben; die echte lexikalische Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „der“ bildet die beiden hebräischen Partizipien transparent ab. Der Vers bleibt als syntaktischer Anschluss an den vorausgehenden Kontext formuliert.
