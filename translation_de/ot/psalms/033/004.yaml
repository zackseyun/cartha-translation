  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי יָשָׁ֥ר דְּבַר יְהוָ֑ה וְ/כָל מַ֝עֲשֵׂ֗/הוּ בֶּ/אֱמוּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/004.yaml
  text: For the word of Yahweh is upright[b][a], and all his work is done in faithfulness.
translation:
  language: de
  text: 'Denn das Wort Jahwes ist recht,

    und all sein Tun geschieht in Treue.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „und alles, was er tut, ist zuverlässig.“'
    reason: Die hebräische Nominalkonstruktion kann sowohl mit „in Treue“ als auch idiomatisch mit einem Adjektiv oder Adverb wiedergegeben werden.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Aufruf zum Lob ein und bewahrt den kausalen Zusammenhang natürlich.
- source_word: יָשָׁר
  choice: recht
  rationale: Gibt die Vorstellung von Geradheit, Richtigkeit und moralischer Lauterkeit knapp und idiomatisch wieder.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: דָּבָר bezeichnet hier Jahwes Rede oder Zusage; „Wort“ ist im Deutschen klar, würdig und kontextgerecht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: וְכָל מַעֲשֵׂהוּ
  choice: und all sein Tun
  rationale: Das hebräische Singularwort kann die Gesamtheit des Handelns bezeichnen. „All sein Tun“ bewahrt diesen kollektiven Sinn natürlicher als „all sein Werk“.
- source_word: בֶּאֱמוּנָה
  choice: in Treue
  rationale: אֱמוּנָה bezeichnet hier Beständigkeit, Verlässlichkeit und Treue; die nominale Wendung erhält die Bild- und Begriffsstruktur des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen. Seine Wiedergabe als „Jahwe“ macht den Bundesnamen sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug und Umfang von מַעֲשֵׂהוּ
  choice: all sein Tun
  alternative: alle seine Werke
  rationale: Die hebräische Form steht im Singular, wird aber durch כָּל umfassend gebraucht. Die gewählte Form bewahrt sowohl den kollektiven Sinn als auch die grammatische Zahl.
- issue: Bedeutung von אֱמוּנָה
  choice: Treue
  alternative: Wahrhaftigkeit
  rationale: Der Begriff umfasst Verlässlichkeit und Beständigkeit. „Treue“ lässt diese theologisch bedeutsame Weite bestehen, statt sie allein auf Wahrheit im engeren Sinn festzulegen.
translation_notes:
  register: Moderne, würdige Psalmsprache mit knapper Parallelstruktur. „Recht“ und „Treue“ sind allgemein verständlich und bewahren zugleich die ethisch-theologische Dichte des Hebräischen.
