id: PSA.33.11
reference: Psalms 33:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עֲצַ֣ת יְ֭הוָה לְ/עוֹלָ֣ם תַּעֲמֹ֑ד מַחְשְׁב֥וֹת לִ֝בּ֗/וֹ לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/011.yaml
  text: The counsel of Yahweh stands forever[a], the plans of his heart from generation to generation.
translation:
  language: de
  text: Der Ratschluss Jahwes bleibt für immer bestehen[a], die Pläne seines Herzens von Generation zu Generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Rat Jahwes« beziehungsweise »das Vorhaben Jahwes«; für »Pläne« auch »Gedanken« oder »Absichten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: Ratschluss
  rationale: Das Substantiv bezeichnet Rat, Beschluss oder Vorhaben. »Ratschluss« bewahrt sowohl den erwogenen als auch den zielgerichteten Sinn und bildet eine passende Parallele zu »Pläne«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der persönliche Gottesname »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung drückt unbegrenzte Dauer aus; »für immer« ist klares, natürliches Gegenwartsdeutsch.
- source_word: תַּעֲמֹד
  choice: bleibt … bestehen
  rationale: Das Imperfekt bezeichnet hier eine allgemeingültige, fortdauernde Wirklichkeit. »Bleibt bestehen« gibt die Beständigkeit idiomatisch wieder.
- source_word: מַחְשְׁבוֹת
  choice: Pläne
  rationale: Das Wort kann Gedanken, Absichten oder Pläne bezeichnen. Im Parallelismus mit »Ratschluss« hebt »Pläne« die zielgerichtete Bedeutung hervor, ohne die mögliche Bedeutung »Gedanken« zu verschweigen.
- source_word: לִבּוֹ
  choice: seines Herzens
  rationale: Im Hebräischen ist das Herz das Zentrum des Denkens und Wollens. Die wörtliche Wendung bewahrt dieses biblische Menschenbild und ist im Deutschen verständlich.
- source_word: לְדֹר וָדֹר
  choice: von Generation zu Generation
  rationale: Die feste Wendung bezeichnet das Fortbestehen durch alle aufeinanderfolgenden Generationen hindurch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Wiedergabe »Jahwe« bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel wie »der HERR« zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und das hebräische Bild vom »Herzen« bleiben erhalten; »bleibt … bestehen« formuliert die allgemeingültige Dauer natürlich.
