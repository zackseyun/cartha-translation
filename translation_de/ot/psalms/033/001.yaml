  text: רַנְּנ֣וּ צַ֭דִּיקִים בַּֽ/יהוָ֑ה לַ֝/יְשָׁרִ֗ים נָאוָ֥ה תְהִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/001.yaml
  text: Shout for joy in Yahweh[a], you righteous[b]; praise is fitting for the upright.
translation:
  language: de
  text: Jubelt über Jahwe, ihr Gerechten! Den Aufrichtigen gebührt Lob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lob steht den Aufrichtigen gut“; auch: „Lob ist angemessen“ oder „schön für die Aufrichtigen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַנְּנוּ
  choice: Jubelt
  rationale: Der Imperativ bezeichnet einen hörbaren, freudigen Jubel. „Jubelt“ gibt diese ausgelassene stimmliche Äußerung knapp und natürlich wieder, ohne sie zwingend auf Gesang festzulegen.
- source_word: צַדִּיקִים
  choice: ihr Gerechten
  rationale: Das substantivierte Adjektiv steht hier als Anrede. „Ihr Gerechten“ macht den Vokativ im Deutschen klar.
- source_word: בַּיהוָה
  choice: über Jahwe
  rationale: Die Präposition ב bezeichnet hier den Bezug oder Grund des Jubels. „Über Jahwe jubeln“ wahrt diesen Bezug; die ebenfalls mögliche Auffassung als Ausrichtung des Jubels wird in der Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen geläufige Form der wissenschaftlich begründeten Aussprache.
- source_word: לַיְשָׁרִים
  choice: den Aufrichtigen
  rationale: ל bezeichnet hier die Personengruppe, zu der Lob als passend gehört. Der deutsche Dativ in „den Aufrichtigen steht … gut“ drückt dieses Verhältnis idiomatisch aus.
- source_word: נָאוָה
  choice: steht … gut
  rationale: Das Wort umfasst die Bedeutungen „passend“, „schicklich“ und „schön“. Die natürliche Wendung „steht … gut“ bewahrt sowohl den Gedanken der Angemessenheit als auch den Anklang von Schönheit.
- source_word: תְהִלָּה
  choice: Lob
  rationale: Das Substantiv bezeichnet Lob beziehungsweise eine Äußerung des Lobes. „Lob“ lässt die konkrete Form offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname יהוה, nicht ein Titel. Seine Wiedergabe als „Jahwe“ erhält den persönlichen Gottesnamen und vermeidet eine stillschweigende Ersetzung durch „der HERR“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und die direkte Anrede bleiben erhalten. „Steht … gut“ ist gegenwärtig verständlich und trägt die Bedeutungsbreite von Angemessenheit und Schönheit.
