  text: הִנֵּ֤ה עֵ֣ין יְ֭הוָה אֶל יְרֵאָ֑י/ו לַֽ/מְיַחֲלִ֥ים לְ/חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/018.yaml
  text: Behold[a], the eye of Yahweh is on those who fear him, on those who wait for his steadfast love,
translation:
  language: de
  text: Siehe, das Auge Jahwes ruht auf denen, die ihn fürchten, auf denen, die auf seine beständige Liebe hoffen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die auf seine beständige Liebe warten“. Das hebräische Verb kann sowohl hoffendes Erwarten als auch Warten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel hebt die folgende Aussage hervor. „Siehe“ bewahrt ihren poetischen und hinweisenden Nachdruck in würdigem Deutsch.
- source_word: עֵין יְהוָה
  choice: das Auge Jahwes
  rationale: Die im Hebräischen klare anthropomorphe Metapher wird wörtlich bewahrt; sie bezeichnet Jahwes aufmerksame, fürsorgliche Beobachtung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: אֶל
  choice: ruht auf
  rationale: Mit „Auge“ bezeichnet die Präposition die gerichtete Aufmerksamkeit. „Ruht auf“ gibt diese hebräische Wendung natürlich wieder, ohne zusätzliche Handlung einzutragen.
- source_word: יְרֵאָיו
  choice: denen, die ihn fürchten
  rationale: Die Form bezeichnet Menschen, deren Haltung von Gottesfurcht geprägt ist. „Fürchten“ bewahrt sowohl Ehrfurcht als auch den ernsten biblischen Bedeutungsumfang.
- source_word: לַמְיַחֲלִים
  choice: denen, die … hoffen
  rationale: יחל verbindet erwartungsvolles Warten mit Hoffen. Im Deutschen fügt sich „auf seine … Liebe hoffen“ natürlich; die alternative Nuance des Wartens wird in der Fußnote erhalten.
- source_word: לְחַסְדּוֹ
  choice: auf seine beständige Liebe
  rationale: חֶסֶד umfasst verlässliche Güte, Treue und Liebe. „Beständige Liebe“ bewahrt diese Dauerhaftigkeit und ist im modernen Deutsch verständlich, ohne den Begriff auf bloßes Erbarmen zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. Seine Wiedergabe als „Jahwe“ erhält den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von חֶסֶד
  choice: beständige Liebe
  alternative: Gnade; Güte; treue Liebe
  rationale: Die gewählte Formulierung hält Liebe, Verlässlichkeit und fortdauernde Zuwendung zusammen. Keine deutsche Einzelentsprechung schöpft den gesamten Bedeutungsumfang aus.
- issue: Bedeutungsumfang von יחל
  choice: hoffen
  alternative: warten
  rationale: Das Verb kann hoffendes Erwarten oder geduldiges Warten ausdrücken. Der Haupttext verwendet idiomatisches „hoffen“; die echte lexikalische Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildsprache. Der Parallelismus „auf denen … auf denen“ bleibt erhalten; der Vers endet entsprechend dem fortlaufenden Satz des Psalms mit einem Komma.
