id: PSA.33.21
reference: Psalms 33:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּי ב֭/וֹ יִשְׂמַ֣ח לִבֵּ֑/נוּ כִּ֤י בְ/שֵׁ֖ם קָדְשׁ֣/וֹ בָטָֽחְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/021.yaml
  text: For our heart rejoices in him[b][a], because we have trusted in his holy name.
translation:
  language: de
  text: Denn an ihm freut sich unser Herz[a][b], weil wir auf seinen heiligen Namen vertraut haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn an ihm wird sich unser Herz freuen.« Das hebräische Imperfekt kann hier zukünftig statt gegenwärtig verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen der Singular »unser Herz«; er bezeichnet kollektiv das gemeinsame Innere des Volkes.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Das erste כִּי begründet die vorausgehende Aussage und verbindet den Vers in natürlichem poetischem Deutsch mit dem Kontext.
- source_word: בּוֹ
  choice: an ihm
  rationale: Das maskuline Suffix verweist im Zusammenhang auf den HERRN; bei »sich freuen« ist »an ihm« im Deutschen idiomatisch.
- source_word: יִשְׂמַח
  choice: freut sich
  rationale: Das Imperfekt kann eine gegenwärtige, anhaltende Haltung oder eine zuversichtliche Zukunft ausdrücken. Der Haupttext gibt die gegenwärtige Aussage wieder und bewahrt die Zukunftsdeutung in einer Fußnote.
- source_word: לִבֵּנוּ
  choice: unser Herz
  rationale: Der hebräische Singular mit Pluralsuffix ist kollektiv und stellt das gemeinsame Innere des Volkes als Einheit dar.
- source_word: כִּי
  choice: weil
  rationale: Das zweite כִּי nennt den Grund für die Freude; »weil« macht diesen Zusammenhang im heutigen Deutsch klar.
- source_word: בְשֵׁם
  choice: auf … Namen
  rationale: In Verbindung mit בטח bezeichnet die Präposition das Ziel des Vertrauens; »auf seinen Namen vertrauen« ist natürliches und genaues Deutsch.
- source_word: קָדְשׁוֹ
  choice: seinen heiligen
  rationale: »Heilig« bewahrt die religiöse und moralische Bedeutung des hebräischen Ausdrucks ohne abschwächende Umschreibung.
- source_word: בָטָחְנוּ
  choice: wir … vertraut haben
  rationale: Das hebräische Perfekt bezeichnet ein vollzogenes Vertrauen mit fortdauernder Bedeutung; das deutsche Perfekt erhält diesen Rückblick, ohne die gegenwärtige Relevanz auszuschließen.
theological_decisions:
- issue: Bezug der maskulinen Singularsuffixe in בּוֹ und קָדְשׁוֹ
  choice: Die Pronomen beziehen sich auf den im unmittelbaren Kontext genannten HERRN.
  alternative: Ein allgemeiner Bezug auf Gott ohne ausdrückliche Verbindung zum Bundesnamen.
  rationale: Der Kontext spricht wiederholt vom HERRN. Da der Gottesname in diesem Vers selbst jedoch nicht steht, setzt die Übersetzung ihn nicht erläuternd ein, sondern behält »ihm« und »seinen« bei.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt poetisch und kausal klar; der kollektive Singular »unser Herz« wird bewusst bewahrt.
