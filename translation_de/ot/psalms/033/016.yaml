id: PSA.33.16
reference: Psalms 33:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵֽין הַ֭/מֶּלֶךְ נוֹשָׁ֣ע בְּ/רָב חָ֑יִל גִּ֝בּ֗וֹר לֹֽא יִנָּצֵ֥ל בְּ/רָב כֹּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/016.yaml
  text: The king is not saved by a great army[b][a]; a warrior is not delivered by great strength.
translation:
  language: de
  text: Der König wird nicht durch ein großes Heer gerettet[a]; ein Krieger wird nicht durch große Kraft befreit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch große Macht«; das hebräische Wort kann auch Stärke oder militärische Mittel im weiteren Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: wird nicht
  rationale: Mit dem folgenden Partizip drückt אֵין eine verneinte Aussage aus; im Deutschen ist die finite Passivform natürlich.
- source_word: הַמֶּלֶךְ
  choice: Der König
  rationale: Der bestimmte Artikel wird bewahrt; der bestimmte Singular formuliert hier eine allgemeine Aussage.
- source_word: נוֹשָׁע
  choice: wird ... gerettet
  rationale: Das Nifal-Partizip von ישׁע bezeichnet das Gerettet- oder Befreitwerden; »gerettet« bewahrt den verbreiteten biblischen Wortgebrauch.
- source_word: בְּרָב חָיִל
  choice: durch ein großes Heer
  rationale: ב bezeichnet hier das Mittel. חַיִל kann Kraft, Vermögen oder Streitmacht meinen; im königlich-militärischen Kontext ist »Heer« die naheliegende konkrete Wiedergabe, während die weitere Bedeutung in der Fußnote erhalten bleibt.
- source_word: גִּבּוֹר
  choice: ein Krieger
  rationale: Das Wort bezeichnet einen starken, kampferprobten oder tapferen Mann; »Krieger« gibt den militärischen Zusammenhang in modernem Deutsch klar wieder.
- source_word: לֹא יִנָּצֵל
  choice: wird nicht ... befreit
  rationale: Das Nifal von נצל bedeutet, gerettet, entrissen oder befreit zu werden. »Befreit« bildet eine natürliche Parallele zu »gerettet«, ohne das Verb zu wiederholen.
- source_word: בְּרָב כֹּחַ
  choice: durch große Kraft
  rationale: כֹּחַ bezeichnet Kraft oder Stärke; »große Kraft« gibt die körperliche beziehungsweise militärische Leistungsfähigkeit unmittelbar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und die Unterscheidung zwischen »gerettet« und »befreit« werden bewahrt. Die Mehrdeutigkeit von חַיִל wird durch eine Fußnote kenntlich gemacht.
