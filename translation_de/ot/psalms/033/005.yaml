id: PSA.33.5
reference: Psalms 33:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֹ֭הֵב צְדָקָ֣ה וּ/מִשְׁפָּ֑ט חֶ֥סֶד יְ֝הוָ֗ה מָלְאָ֥ה הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/005.yaml
  text: He loves righteousness and justice[a]; the earth is full of the steadfast love of Yahweh.
translation:
  language: de
  text: Er liebt Gerechtigkeit und Recht; die Erde ist erfüllt von Jahwes beständiger Liebe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „treuer Liebe“. Das hebräische Wort חֶסֶד bezeichnet Liebe und Güte, die sich als verlässlich und loyal erweisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: Er liebt
  rationale: Das maskuline Qal-Partizip beschreibt Jahwes bleibende, charakteristische Haltung. Die finite deutsche Form klingt natürlich und bewahrt den habituellen Sinn.
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: In der Verbindung mit מִשְׁפָּט bezeichnet das Wort gerechtes, aufrichtiges Handeln und bleibt so vom folgenden Begriff unterschieden.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: Hier geht es um gerechte Ordnung und rechtes Urteil. „Recht“ bildet zusammen mit „Gerechtigkeit“ eine natürliche und sachlich differenzierte deutsche Wortverbindung.
- source_word: חֶסֶד
  choice: beständige Liebe
  rationale: Der Ausdruck umfasst Liebe, Güte, Loyalität und Verlässlichkeit. „Beständige Liebe“ gibt sowohl die Zuwendung als auch ihre Treue und Dauer verständlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מָלְאָה
  choice: ist erfüllt von
  rationale: 'Das Perfekt hat hier stativ-resultative Bedeutung: Die Erde befindet sich in einem Zustand der Fülle.'
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Der kosmische Zusammenhang des Psalms spricht für die weltweite Bedeutung „Erde“ statt des örtlicheren „Land“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt dessen Funktion als persönlicher Name, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von חֶסֶד
  choice: beständige Liebe
  alternative: treue Liebe; Güte
  rationale: Keine einzelne deutsche Entsprechung erfasst Liebe, Güte und loyale Verlässlichkeit vollständig. Die Hauptfassung betont Zuwendung und Dauer; die Fußnote hält die legitime Alternative „treue Liebe“ offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur bleibt erhalten; „Gerechtigkeit und Recht“ bewahrt die begriffliche Nähe und zugleich die Unterscheidung der beiden hebräischen Substantive.
