base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/012.yaml
  text: Blessed is the nation whose God is Yahweh[b][a], the people he has chosen for his inheritance.
translation:
  language: de
  text: Glücklich ist die Nation, deren Gott Jahwe ist,[a] das Volk, das er sich zum Erbteil erwählt hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wohl der Nation, deren Gott Jahwe ist.“ Die hebräische Glückpreisungsformel kann einen glücklichen, begünstigten oder gesegneten Zustand ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Im Zusammenhang kann besonders Israel als das erwählte Volk im Blick sein; der hebräische Text nennt es hier jedoch nicht ausdrücklich beim Namen.
    reason: referent_clarification
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die hebräische Glückpreisungsformel bezeichnet einen begünstigten, heilvollen Zustand und nicht nur ein Gefühl. „Glücklich ist“ ist im heutigen Deutsch verständlich; die Fußnote nennt die feierlichere Alternative.
- source_word: הַגּוֹי
  choice: die Nation
  rationale: גּוֹי bezeichnet hier ein ethnisch-politisches Gemeinwesen und steht poetisch parallel zu הָעָם. „Nation“ gibt diese Unterscheidung direkt wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen übliche Form der wissenschaftlichen Umschrift.
- source_word: הָעָם
  choice: das Volk
  rationale: עָם bezeichnet eine gemeinschaftlich und hier besonders durch Gottes Erwählung bestimmte Volksgemeinschaft. „Volk“ bewahrt den Parallelismus zu „Nation“.
- source_word: בָּחַר
  choice: erwählt hat
  rationale: Das Perfekt bezeichnet die vollzogene Wahl mit fortdauernder Bedeutung. „Erwählt hat“ erhält zudem den theologischen und poetischen Ton.
- source_word: לְנַחֲלָה לוֹ
  choice: sich zum Erbteil
  rationale: Die Verbindung bezeichnet das Volk als den Jahwe zugehörigen Anteil beziehungsweise Besitz. „Sich zum Erbteil“ gibt sowohl לוֹ als auch die kultisch-bundestheologische Bedeutung von נַחֲלָה knapp und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. Die Übersetzung bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von „Nation“ und „Volk“
  choice: Die poetische Formulierung bleibt ohne ausdrückliche Einfügung von „Israel“ erhalten.
  alternative: Israel im Haupttext ausdrücklich nennen
  rationale: Im Kontext ist besonders Israel als Gottes erwähltes Volk im Blick; der hebräische Wortlaut sagt jedoch allgemein „die Nation“ und „das Volk“. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Psalmton. Der Parallelismus von „Nation“ und „Volk“ bleibt erhalten; „Erbteil“ bewahrt die bildhafte und bundestheologische Sprache des Hebräischen.
