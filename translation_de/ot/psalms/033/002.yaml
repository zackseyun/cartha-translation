id: PSA.33.2
reference: Psalms 33:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הוֹד֣וּ לַ/יהוָ֣ה בְּ/כִנּ֑וֹר בְּ/נֵ֥בֶל עָ֝שׂ֗וֹר זַמְּרוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/002.yaml
  text: Give thanks to Yahweh with the lyre[a]; make music to him with a ten-stringed harp.
translation:
  language: de
  text: Dankt Jahwe mit der Leier; spielt ihm auf der zehnsaitigen Harfe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das genaue antike Instrument ist unbekannt; das hebräische Wort wird auch mit »Laute« oder allgemein mit »Saiteninstrument« wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Dankt
  rationale: Der Hifil-Imperativ Plural von ידה bezeichnet im liturgischen Zusammenhang häufig das Danken; die knappe deutsche Form gibt den Aufruf natürlich wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname יהוה wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּכִנּוֹר
  choice: mit der Leier
  rationale: כִּנּוֹר bezeichnet ein antikes Saiteninstrument, das am ehesten als Leier einzuordnen ist.
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: auf der zehnsaitigen Harfe
  rationale: נֵבֶל ist ein nicht sicher identifizierbares Saiteninstrument; »Harfe« unterscheidet es im Deutschen von כִּנּוֹר, während עָשׂוֹר die Zehnsaitigkeit angibt.
- source_word: זַמְּרוּ לוֹ
  choice: spielt ihm
  rationale: זמר im Piel kann musikalisches Loben beziehungsweise Musizieren bezeichnen. Wegen des ausdrücklich genannten Instruments passt hier »spielt ihm« und bewahrt den instrumentalen Zusammenhang.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Name wiedergegeben, statt ihn durch den Titel »der HERR« zu ersetzen.
- issue: Bedeutungsumfang von זמר
  choice: spielt ihm
  alternative: singt ihm Lob / musiziert ihm
  rationale: Der unmittelbare Bezug auf die zehnsaitige Harfe legt instrumentales Musizieren nahe; die Wiedergabe schließt den lobpreisenden Charakter des Psalmkontexts nicht aus.
translation_notes:
  register: Moderne, knappe und würdige Psalmsprache. Der parallele Aufbau der beiden Aufforderungen bleibt erhalten; »Leier« und »Harfe« unterscheiden die beiden hebräischen Instrumentennamen, ohne eine übermäßige organologische Sicherheit vorzutäuschen.
