source:
  edition: WLC
  text: מִֽ/מְּכוֹן שִׁבְתּ֥/וֹ הִשְׁגִּ֑יחַ אֶ֖ל כָּל יֹשְׁבֵ֣י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/014.yaml
  text: From the place of his dwelling he looks out on all the inhabitants of the earth[a][b].
translation:
  language: de
  text: Von der Stätte, an der er wohnt, schaut er aufmerksam auf alle Bewohner der Erde[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „blickt er“, „schaut er hin“ oder „beobachtet er“. Das hebräische Verb bezeichnet ein aufmerksames Hinschauen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „des Landes“, wenn das Wort regional verstanden wird; wegen des universalen Zusammenhangs ist hier „der Erde“ gewählt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְּכוֹן
  choice: Von der Stätte
  rationale: מָכוֹן bezeichnet einen festen, bestimmten Ort. „Stätte“ bewahrt diesen gehobenen, räumlichen Sinn und passt natürlich zur folgenden Wohnangabe.
- source_word: שִׁבְתּוֹ
  choice: an der er wohnt
  rationale: Die Form bezeichnet seinen Wohn- oder Sitzort. Die Relativkonstruktion ist im modernen Deutschen klarer und natürlicher als „seines Wohnens“.
- source_word: הִשְׁגִּיחַ
  choice: schaut er aufmerksam
  rationale: Der Hifil von שׁגח bezeichnet ein aufmerksames Hinschauen oder Beobachten. „schaut … aufmerksam“ gibt diese Nuance wieder, ohne bloßes Sehen oder kontrollierendes Bewachen festzulegen.
- source_word: אֶל
  choice: auf
  rationale: Bei einem Verb des Schauens bezeichnet אֶל die Ausrichtung auf ein Objekt; „auf“ ist hier die natürliche deutsche Entsprechung.
- source_word: כָּל
  choice: alle
  rationale: כָּל hat vor der pluralischen Personenbezeichnung umfassende Bedeutung.
- source_word: יֹשְׁבֵי
  choice: Bewohner
  rationale: Das substantivisch gebrauchte Partizip von ישׁב meint die dort Wohnenden; „Bewohner“ ist prägnant und idiomatisch.
- source_word: הָאָרֶץ
  choice: der Erde
  rationale: Im Zusammenhang mit „alle Bewohner“ ist der universale Sinn „Erde“ wahrscheinlicher als die regionale Bedeutung „Land“.
theological_decisions:
- issue: Reichweite des göttlichen Beobachtens
  choice: Gott richtet seinen aufmerksamen Blick auf alle Bewohner der Erde.
  alternative: Gott blickt auf alle Bewohner des Landes.
  rationale: Der universale Kontext des Psalms und die umfassende Wendung כָּל יֹשְׁבֵי הָאָרֶץ sprechen für „Erde“. Die regional mögliche Lesart wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Stätte“ hält den poetischen Ton, während die Relativkonstruktion „an der er wohnt“ unmittelbar verständlich bleibt. Die beiden Fußnotenmarker stehen vollständig im Haupttext.
