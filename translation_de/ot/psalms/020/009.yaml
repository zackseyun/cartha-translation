  text: יְהוָ֥ה הוֹשִׁ֑יעָ/ה הַ֝/מֶּ֗לֶךְ יַעֲנֵ֥/נוּ בְ/יוֹם קָרְאֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/009.yaml
  text: O Yahweh[a], save! May the King answer us in the day we call.
translation:
  language: de
  text: Jahwe, rette! Der König[a] möge uns an dem Tag antworten, an dem wir rufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Jahwe, rette den König! Antworte uns an dem Tag, an dem wir rufen.« Oder: »Jahwe, rette! Der König antwortet uns an dem Tag, an dem wir rufen.« Die knappe hebräische Satzfügung lässt unterschiedliche syntaktische Deutungen von »der König« zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: הוֹשִׁיעָה
  choice: rette!
  rationale: Der Imperativ von ישׁע ist ein unmittelbarer Gebetsruf. »Rette!« bewahrt den umfassenden Sinn von Befreiung und Hilfe, ohne ihn auf militärischen Sieg einzuengen.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Das hebräische Substantiv steht mit Artikel. Die Großschreibung kennzeichnet im Deutschen nur das Substantiv und entscheidet nicht, ob der menschliche König oder Gott gemeint ist.
- source_word: יַעֲנֵנוּ
  choice: möge uns … antworten
  rationale: Die Imperfektform kann hier einen Wunsch beziehungsweise eine Bitte ausdrücken. »Möge … antworten« erhält diese Gebetssprache, ohne einen bloßen Zukunftssatz daraus zu machen.
- source_word: בְיוֹם
  choice: an dem Tag
  rationale: Die Wiedergabe bewahrt das hebräische Zeitbild und bleibt in poetischem Deutsch verständlich.
- source_word: קָרְאֵנוּ
  choice: an dem wir rufen
  rationale: »Rufen« entspricht der Grundbedeutung von קרא und fügt keine ausdrücklich nicht vorhandene emotionale Steigerung hinzu.
theological_decisions:
- issue: Bezug und syntaktische Funktion von »der König«
  choice: »Der König« ist das Subjekt von »möge … antworten«.
  alternative: 'Der Ausdruck kann als Objekt des Rettungsrufs verstanden werden: »Jahwe, rette den König! Antworte uns an dem Tag, an dem wir rufen.« Möglich ist auch die Aussage: »Jahwe, rette! Der König antwortet uns an dem Tag, an dem wir rufen.«'
  rationale: Der masoretisch akzentuierte Text setzt nach »rette« einen deutlichen Einschnitt und stützt damit die gewählte Gliederung. Die knappe hebräische Syntax lässt jedoch andere, traditionsgeschichtlich bedeutsame Zuordnungen zu. Ob »der König« dabei den menschlichen König oder Gott bezeichnet, wird nicht dogmatisch festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dichterischem Gebetston. Die bewusst etwas feierliche Wendung »an dem Tag, an dem wir rufen« bewahrt das Zeitbild des Hebräischen; die echte syntaktische und theologische Mehrdeutigkeit wird in der Fußnote offengehalten.
