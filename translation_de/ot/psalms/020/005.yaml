source:
  edition: WLC
  text: נְרַנְּנָ֤ה בִּ֘/ישׁ֤וּעָתֶ֗/ךָ וּ/בְ/שֵֽׁם אֱלֹהֵ֥י/נוּ נִדְגֹּ֑ל יְמַלֵּ֥א יְ֝הוָ֗ה כָּל מִשְׁאֲלוֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/005.yaml
  text: We will shout for joy in your salvation[a], and in the name of our God we will raise our banners[c][b]. May Yahweh fulfill all your requests.
translation:
  language: de
  text: Wir wollen jubeln über deine Rettung[a] und im Namen unseres Gottes die Banner erheben[b]. Möge Jahwe alle deine Bitten erfüllen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über deinen Sieg“ oder „über deine Befreiung“. Das hebräische Wort kann Rettung im weiten Sinn bezeichnen, einschließlich Befreiung und militärischem Sieg.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Banner aufrichten“. Das hebräische Verb ruft wahrscheinlich das Bild hervor, dass Banner zum Zeichen der Freude erhoben oder sichtbar aufgestellt werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Jahwe wird alle deine Bitten erfüllen.“ Die hebräische Verbform kann als Gebetswunsch oder als Zukunftsaussage verstanden werden; der Gebetswunsch passt gut in den Zusammenhang.'
    reason: alternative_reading
lexical_decisions:
- source_word: נְרַנְּנָה
  choice: Wir wollen jubeln
  rationale: Die Kohortativform drückt gemeinschaftlichen, freudigen Jubel aus. „Wir wollen jubeln“ gibt sowohl den Willenscharakter als auch die feierliche Freude natürlich wieder, ohne den Ausdruck unnötig auf Singen festzulegen.
- source_word: בִּישׁוּעָתֶךָ
  choice: über deine Rettung
  rationale: יְשׁוּעָה umfasst Rettung, Befreiung und im königlich-militärischen Zusammenhang auch Sieg. „Rettung“ bewahrt die größere Bedeutungsbreite; „über“ ist im Deutschen die natürliche Verbindung mit „jubeln“.
- source_word: וּבְשֵׁם אֱלֹהֵינוּ
  choice: und im Namen unseres Gottes
  rationale: Die Wendung bezeichnet Gottes Identität und Autorität als Grundlage des Handelns. „Im Namen“ bewahrt das hebräische Bild und ist im Deutschen idiomatisch.
- source_word: נִדְגֹּל
  choice: die Banner erheben
  rationale: Das Verb wird am plausibelsten vom Bild des Aufrichtens oder Zeigens eines Feldzeichens her verstanden. Der Plural formuliert die kollektive Feier natürlich; die mögliche singularische Wiedergabe wird in der Fußnote genannt.
- source_word: יְמַלֵּא
  choice: Möge … erfüllen
  rationale: Der Imperfekt kann hier im Gebetszusammenhang einen Wunsch ausdrücken. „Möge“ gibt diese jussivische Kraft klar wieder, ohne die ebenfalls mögliche Zukunftsaussage zu verschweigen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כָּל מִשְׁאֲלוֹתֶיךָ
  choice: alle deine Bitten
  rationale: מִשְׁאֲלוֹת bezeichnet das Erbetene. „Bitten“ ist im Gebetszusammenhang natürlich, verständlich und näher am Vorgang des Bittens als das allgemeinere „Wünsche“.
theological_decisions:
- issue: Bedeutung von יְשׁוּעָה im königlich-militärischen Kontext
  choice: Rettung
  alternative: Sieg oder Befreiung
  rationale: Der Zusammenhang lässt besonders an den Sieg des Königs denken, doch „Rettung“ erhält die umfassendere Bedeutung des hebräischen Wortes und schließt den militärischen Sinn nicht aus.
- issue: Aussageweise von יְמַלֵּא
  choice: 'Gebetswunsch: „Möge Jahwe … erfüllen“'
  alternative: 'Zukunftsaussage: „Jahwe wird … erfüllen“'
  rationale: Der liturgische und bittende Zusammenhang spricht für einen Segens- oder Gebetswunsch. Da die Form auch futurisch verstanden werden kann, wird diese Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: 'Moderne, würdige Psalmsprache mit klarer gemeinschaftlicher Bewegung: Jubel, öffentliches Bekenntnis im Namen Gottes und abschließender Gebetswunsch. „Jubeln“ vermeidet eine unnötige Festlegung auf Gesang; „Bitten“ ist verständlich und gebetsnah.'
