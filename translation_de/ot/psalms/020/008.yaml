base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/008.yaml
  text: They have bowed down and fallen[a], but we have risen and stand upright.
translation:
  language: de
  text: Sie sind in die Knie gesunken und gefallen; wir aber haben uns erhoben und stehen fest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und richten uns auf“, „und sind gestärkt“ oder „und stehen aufrecht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Sie
  rationale: Das selbstständige Pronomen hebt die Gegenseite hervor und bildet den Kontrast zu וַאֲנַחְנוּ („wir aber“). Im Deutschen gibt „Sie“ diesen Gegensatz natürlich wieder.
- source_word: כָּרְעוּ
  choice: sind in die Knie gesunken
  rationale: Das Verb bezeichnet das Beugen der Knie beziehungsweise das Niedersinken. Die Formulierung bewahrt das körperliche Bild und verbindet sich natürlich mit „gefallen“.
- source_word: וְנָפָלוּ
  choice: und gefallen
  rationale: Die schlichte Nebenordnung und das poetische Gegenbild zum Sich-Erheben bleiben erhalten.
- source_word: וַאֲנַחְנוּ
  choice: wir aber
  rationale: Obwohl וְ formal meist „und“ bedeutet, ist hier der Gegensatz zwischen „sie“ und „wir“ deutlich; „aber“ gibt diese Funktion im Deutschen idiomatisch wieder.
- source_word: קַּמְנוּ
  choice: haben uns erhoben
  rationale: קום bezeichnet das Aufstehen oder Sich-Erheben und bildet den unmittelbaren Gegensatz zum Fallen der anderen.
- source_word: וַנִּתְעוֹדָד
  choice: und stehen wieder fest
  rationale: Die seltene reflexive Form kann das Sich-Aufrichten, Sich-Stärken oder Wieder-fest-Stehen ausdrücken. „stehen wieder fest“ verbindet die körperliche Wiederaufrichtung mit neu gewonnener Standfestigkeit, ohne die Nuance vollständig festzulegen.
