source:
  edition: WLC
  text: יִֽתֶּן לְ/ךָ֥ כִ/לְבָבֶ֑/ךָ וְֽ/כָל עֲצָתְ/ךָ֥ יְמַלֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/004.yaml
  text: May he grant you according to your heart[a], and fulfill all your counsel.
translation:
  language: de
  text: Er gebe dir, was dein Herz begehrt,[a] und bringe alle deine Vorhaben[b] zur Vollendung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: nach deinem Herzen.'
    reason: Die Fußnote macht die hebräische Form der Wendung sichtbar; im Haupttext wird ihre gemeinte Bedeutung in natürlichem Deutsch ausgedrückt.
  - marker: b
    text: Das hebräische Wort kann auch »Pläne«, »Absichten« oder »Rat« bedeuten.
    reason: Die Bedeutungsbreite von עֵצָה soll erhalten bleiben, da der Zusammenhang sowohl persönliches Planen als auch beratend gefasste Beschlüsse zulässt.
lexical_decisions:
- source_word: יִתֶּן
  choice: Er gebe
  rationale: Das Präfixverb wird im Zusammenhang der Segensbitten des Psalms als Wunsch wiedergegeben. Der deutsche Konjunktiv I bewahrt den feierlichen, betenden Charakter.
- source_word: לְךָ
  choice: dir
  rationale: Der hebräische Dativ wird im Deutschen unmittelbar mit »dir« wiedergegeben.
- source_word: כִלְבָבֶךָ
  choice: was dein Herz begehrt
  rationale: Die Wendung bedeutet wörtlich »nach deinem Herzen«. Die gewählte Formulierung ist natürliches modernes Deutsch und bewahrt zugleich das biblische Bild vom Herzen als Sitz von Wunsch und Absicht.
- source_word: עֲצָתְךָ
  choice: deine Vorhaben
  rationale: עֵצָה kann Rat, Plan, Absicht oder Vorhaben bezeichnen. »Vorhaben« passt hier natürlich zum Gebet um die Verwirklichung dessen, was der Angesprochene beschlossen hat, ohne den Sinn unnötig auf Beratung einzuengen.
- source_word: יְמַלֵּא
  choice: bringe ... zur Vollendung
  rationale: Das Piel von מלא bezeichnet hier das vollständige Ausführen beziehungsweise Verwirklichen. »Zur Vollendung bringen« gibt diesen Ergebnissinn idiomatisch und würdig wieder.
theological_decisions:
- issue: Aussageweise der Verben im Segens- und Gebetszusammenhang
  choice: 'Beide Verben werden als Wünsche beziehungsweise Bitten wiedergegeben: »Er gebe ... und bringe ...«'
  alternative: 'Indikativische Zukunft: »Er wird ... geben und ... vollenden«'
  rationale: Die Yiqtol-Formen stehen in einer Folge von Bitten und Segenswünschen. Der deutsche Konjunktiv gibt diese jussivische Funktion wieder, ohne aus der Bitte eine feste Vorhersage zu machen.
- issue: Bedeutung von »Herz«
  choice: Das Herzbild bleibt als Sitz von Begehren und Absicht erhalten.
  alternative: Eine vollständig abstrahierende Wiedergabe wie »deine Wünsche« oder »deinen Willen«
  rationale: לֵבָב bezeichnet hier die innere Ausrichtung einschließlich Wunsch und Absicht. Die Formulierung wahrt das hebräische Menschenbild, ohne den Ausdruck ausschließlich emotional oder intellektuell zu deuten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Gebetston. Der Konjunktiv I »gebe« und »bringe« lässt den Segenswunsch erkennen; unnötig altertümliche Wendungen wie »all deinen Rat erfüllen« werden vermieden.
