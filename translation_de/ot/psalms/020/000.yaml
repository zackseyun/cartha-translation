lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In Psalmüberschriften bezeichnet der Ausdruck wahrscheinlich den für die musikalische Ausführung Verantwortlichen. „Chorleiter“ ist knapp, verständlich und wahrt die Funktion als musikalische Anweisung.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Das Substantiv bezeichnet ein zur musikalischen Darbietung bestimmtes Lied; „Psalm“ ist hier die übliche und präzise Gattungsbezeichnung.
- source_word: לְדָוִד
  choice: Davids
  rationale: Die deutsche Genitivform gibt die traditionelle knappe Überschrift natürlich wieder, ohne im Haupttext ausdrücklich zwischen Urheberschaft, Zuordnung und Widmung zu entscheiden.
theological_decisions:
- issue: Bedeutung der davidischen Überschrift
  choice: Davids
  alternative: von David; für David
  rationale: Die hebräische Verbindung mit לְ kann Urheberschaft, Zugehörigkeit oder Widmung ausdrücken. Die Hauptfassung bleibt knapp; die möglichen Deutungen werden in der Fußnote offengehalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache; die knappe Form einer Psalmüberschrift bleibt erhalten. Der Fußnotenmarker steht unmittelbar bei „Davids“, auf das sich die Erläuterung bezieht.
