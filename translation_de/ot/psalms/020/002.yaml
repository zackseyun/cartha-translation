  text: יִשְׁלַֽח עֶזְרְ/ךָ֥ מִ/קֹּ֑דֶשׁ וּ֝/מִ/צִּיּ֗וֹן יִסְעָדֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/002.yaml
  text: May he send you help from the sanctuary and sustain you from Zion[a][b].
translation:
  language: de
  text: Er sende dir Hilfe aus dem Heiligtum[b] und stütze[a] dich von Zion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unterstütze dich« oder »halte dich aufrecht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch auch: »aus der Heiligkeit« oder »vom heiligen Ort«; hier ist wahrscheinlich Gottes Heiligtum gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: Er sende
  rationale: Der Qal-Imperfekt 3. Person Singular wird im Segens- und Gebetszusammenhang als Wunsch wiedergegeben. Der deutsche Konjunktiv I bringt diesen gehobenen, aber verständlichen Wunschcharakter knapp zum Ausdruck.
- source_word: עֶזְרְךָ
  choice: dir Hilfe
  rationale: עֵזֶר mit Suffix der 2. Person maskulin Singular bezeichnet »deine Hilfe« beziehungsweise »Hilfe für dich«. Natürliches Deutsch verlangt hier »dir Hilfe senden«.
- source_word: מִקֹּדֶשׁ
  choice: aus dem Heiligtum
  rationale: קֹדֶשׁ kann abstrakt »Heiligkeit« oder konkret einen heiligen Ort bezeichnen. Parallel zu »vom Zion her« liegt hier die örtliche Bedeutung, Gottes Heiligtum, nahe.
- source_word: וּמִצִּיּוֹן
  choice: und … vom Zion her
  rationale: Der Eigenname צִיּוֹן wird als »Zion« beibehalten. »Vom Zion her« macht die Herkunftsangabe im Deutschen eindeutig und verbindet die beiden parallelen Halbverse.
- source_word: יִסְעָדֶךָּ
  choice: stütze dich
  rationale: סעד bedeutet »stützen, unterstützen, aufrechterhalten«. »Stütze dich« bewahrt das konkrete Bild und passt zum parallelen »Hilfe«. Auch dieser Imperfekt wird kontextgemäß als Wunsch verstanden.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts
  choice: Das Subjekt wird lediglich mit »Er« wiedergegeben; aus dem Zusammenhang ist der HERR gemeint.
  alternative: Den Gottesnamen »der HERR« ausdrücklich ergänzen.
  rationale: Im hebräischen Vers steht kein ausdrückliches Subjekt. Der Bezug ergibt sich aus dem vorhergehenden Kontext; deshalb wird der Gottesname nicht ergänzend in den Vers eingefügt.
- issue: Bedeutung von קֹדֶשׁ
  choice: 'Konkreter heiliger Ort: »Heiligtum«.'
  alternative: 'Abstrakt: »Heiligkeit« oder allgemeiner: »heiliger Ort«.'
  rationale: Die Parallelstellung zu Zion spricht für eine örtliche Deutung, ohne die lexikalische Mehrdeutigkeit zu verschweigen.
translation_notes:
  register: Moderne, würdige Gebetssprache. Der Konjunktiv I (»sende«, »stütze«) gibt den Wunschcharakter der hebräischen Imperfektformen wieder. »Vom Zion her« klingt natürlich und wahrt zugleich die poetische Parallelität.
