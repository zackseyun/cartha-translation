  text: עַתָּ֤ה יָדַ֗עְתִּי כִּ֤י הוֹשִׁ֥יעַ יְהוָ֗ה מְשִׁ֫יח֥/וֹ יַ֭עֲנֵ/הוּ מִ/שְּׁמֵ֣י קָדְשׁ֑/וֹ בִּ֝/גְבֻר֗וֹת יֵ֣שַׁע יְמִינֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/006.yaml
  text: I know that the LORD saves his anointed; he answers him from his holy heaven with the mighty saving deeds of his right hand.
translation:
  language: de
  text: 'Jetzt erkenne ich: Der HERR[a] hat seinen Gesalbten gerettet; er wird ihm aus seinem heiligen Himmel durch die machtvollen Rettungstaten seiner rechten Hand antworten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH (יהוה), der offenbarte Name Gottes.'
    reason: Macht transparent, dass „HERR“ einen Eigennamen wiedergibt.
lexical_decisions:
- source_word: עַתָּה
  choice: Nun
  rationale: Das hebräische Zeitadverb ist ausdrücklich vorhanden. „Nun“ gibt sowohl den zeitlichen als auch den folgernden Übergang in würdigem, natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens wird beibehalten; eine Fußnote macht den zugrunde liegenden Eigennamen transparent.
- source_word: הוֹשִׁיעַ
  choice: rettet
  rationale: Das Verb bezeichnet retten bzw. zum Sieg verhelfen. „Rettet“ wahrt die breite soteriologische und konkrete königliche Bedeutung, ohne sie auf militärischen Sieg zu verengen.
- source_word: מְשִׁיחוֹ
  choice: seinen Gesalbten
  rationale: Die wörtliche und im Psalmenkontext natürliche Wiedergabe bewahrt sowohl den unmittelbaren Bezug auf den gesalbten König als auch die weiterführende messianische Offenheit.
- source_word: בִּגְבֻרוֹת יֵשַׁע יְמִינוֹ
  choice: mit den machtvollen Rettungstaten seiner rechten Hand
  rationale: Die Formulierung erhält den Plural „Machttaten“, den Rettungsgedanken und das Bild der rechten Hand in verständlichem Deutsch.
theological_decisions:
- issue: Zeitform von הוֹשִׁיעַ
  choice: Präsens „rettet“
  alternative: Perfekt „gerettet hat“ oder Futur „retten wird“
  rationale: Die hebräische Perfektform kann hier eine als gewiss erkannte göttliche Rettung ausdrücken. Das deutsche Präsens bewahrt den allgemeinen bzw. gewissheitsbetonten Sinn und stimmt mit dem parallelen „antwortet“ überein, ohne die Aussage ausschließlich vergangen oder zukünftig festzulegen.
- issue: Referenz von „Gesalbter“
  choice: Die Bezeichnung bleibt unaufgelöst stehen
  alternative: Explizit „König“ oder „Messias“
  rationale: Im unmittelbaren Kontext ist der gesalbte König im Blick; zugleich trägt der Ausdruck messianisches Potenzial. Die Übersetzung soll diese Spannung nicht dogmatisch vereindeutigen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Der Doppelpunkt bildet den Erkenntnisinhalt natürlich ab; der zweite hebräische Satzteil wird zur besseren Lesbarkeit als eigener Satz wiedergegeben.
