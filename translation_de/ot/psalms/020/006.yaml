  verdict: revise
  source_fidelity: 'Die Fassung gibt die zentralen Begriffe angemessen wieder: יהוה als „HERR“, מְשִׁיחוֹ als „seinen Gesalbten“ und die bildhafte rechte Hand. Die explizite Partikel עַתָּה sollte als „Jetzt“/„Nun“ erhalten bleiben. Allerdings ist הוֹשִׁיעַ formal ein Perfekt und יַעֲנֵהוּ ein Imperfekt. Im Kontext folgt auf die gegenwärtige Erkenntnis die Gewissheit einer bereits erwiesenen Rettung und einer künftigen Antwort. Das deutsche Präsens für beide Verben verwischt diesen Kontrast.'
  naturalness: „Nun weiß ich“ ist verständlich, doch „Jetzt erkenne ich“ klingt als folgernde Einsicht idiomatischer. „Durch die machtvollen Rettungstaten seiner rechten Hand“ ist natürliches modernes Deutsch und bringt die instrumentale Funktion von בְּ sowie den hebräischen Plural klar zum Ausdruck.
  terminology: „Gesalbter“ bewahrt die offene Referenz des hebräischen Ausdrucks, ohne ihn zu „Messias“ oder „König“ zu verengen. „Rettungstaten“ gibt גְּבֻרוֹת יֵשַׁע treffend wieder. Die Namensfußnote zu „HERR“ ist sachlich und passend.
  issues:
  - severity: medium
    issue: Die Verbformen „rettet“ und „antwortet“ nivellieren die hebräische Abfolge von Perfekt und Imperfekt.
    rationale: הוֹשִׁיעַ bezeichnet hier die als gewiss erkannte bzw. bereits erwiesene Rettung; יַעֲנֵהוּ richtet den Blick auf Gottes künftige Antwort. „Hat gerettet“ und „wird ihm antworten“ bilden dies im Deutschen klar ab.
  - severity: low
    issue: „mit den machtvollen Rettungstaten“ ist als Mittelangabe weniger präzise und etwas schwerfällig.
    rationale: Das בְּ bei בִּגְבֻרוֹת lässt sich im Deutschen idiomatisch als „durch“ wiedergeben; dadurch wird Gottes machtvolles Eingreifen als Weise seiner Antwort deutlich.
  revised_text: 'Jetzt erkenne ich: Der HERR[a] hat seinen Gesalbten gerettet; er wird ihm aus seinem heiligen Himmel durch die machtvollen Rettungstaten seiner rechten Hand antworten.'
