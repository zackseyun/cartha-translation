  text: יַֽעַנְ/ךָ֣ יְ֭הוָה בְּ/י֣וֹם צָרָ֑ה יְ֝שַׂגֶּבְ/ךָ֗ שֵׁ֤ם אֱלֹהֵ֬י יַעֲקֹֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/001.yaml
  text: May Yahweh answer you in the day of trouble[a]; may the name of the God of Jacob protect you.
translation:
  language: de
  text: Yahweh erhöre dich am Tag der Not; der Name des Gottes Jakobs bringe dich auf sichere Höhe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schütze dich“. Das hebräische Verb zeichnet das Bild, dass jemand an einen sicheren, unerreichbar hohen Ort gebracht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַנְךָ
  choice: erhöre dich
  rationale: Das Hifil von ענה bedeutet hier „antworten“. Im Gebets- und Segenskontext gibt „erhöre“ die erbetene göttliche Antwort idiomatisch und würdig wieder; der Konjunktiv drückt den Wunschcharakter aus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּיוֹם צָרָה
  choice: am Tag der Not
  rationale: Bewahrt das hebräische Zeitbild und gibt צָרָה mit dem im Deutschen natürlichen und umfassenden „Not“ wieder.
- source_word: יְשַׂגֶּבְךָ
  choice: bringe dich auf sichere Höhe
  rationale: Das Piel von שׂגב zeichnet das Bild, jemanden unerreichbar hoch und damit geschützt zu stellen. Die Formulierung erhält sowohl das räumliche Bild als auch seine Schutzwirkung.
- source_word: שֵׁם
  choice: der Name
  rationale: Die wörtliche Wiedergabe bewahrt die poetische und theologische Bedeutung; der Name kann zugleich für Autorität und wirksame Gegenwart stehen.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: des Gottes Jakobs
  rationale: Die Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung natürlich wieder und bewahrt ihren geschichtlichen und bundestheologischen Klang.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen; „Yahweh“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Modalität der Verbformen
  choice: 'Wunsch bzw. Bitte im Konjunktiv I: „erhöre“, „bringe“'
  alternative: 'Indikativische Zukunft: „wird dich erhören“, „wird dich schützen“'
  rationale: Im Kontext des Segens- und Bittpsalms haben die Imperfektformen optativ-jussive Kraft. Der deutsche Konjunktiv erhält diesen liturgischen Wunschcharakter.
- issue: Bildgehalt von יְשַׂגֶּבְךָ
  choice: bringe dich auf sichere Höhe
  alternative: schütze dich
  rationale: Die gewählte Fassung bewahrt die Schutzmetapher des Erhöhens an einen unerreichbaren Ort, ohne die Schutzwirkung zu verschleiern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Parallelismus. Der Konjunktiv I trägt den Gebets- und Segenscharakter; „sichere Höhe“ bewahrt das konkrete hebräische Schutzbild.
