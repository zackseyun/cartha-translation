  source_fidelity: 'Die Übersetzung gibt den elliptischen Kontrast des Hebräischen sinnvoll wieder: אֵלֶּה ... וְאֵלֶּה ... wird mit „Die einen … die anderen …“ natürlich entfaltet, und „setzen auf“ vermittelt den im Kontext naheliegenden Gegensatz zu militärischer Macht. „rufen den Namen des HERRN, unseres Gottes, an“ ist für בְּשֵׁם יְהוָה אֱלֹהֵינוּ נַזְכִּיר eine gut belegbare, idiomatische Wiedergabe. Die Fußnote weist angemessen darauf hin, dass נַזְכִּיר auch weniger spezifisch als „anrufen“ verstanden werden kann.'
