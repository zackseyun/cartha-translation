  terminology: „Streitwagen“ ist historisch präzise. „HERR“ für das Tetragramm entspricht etablierter deutscher Bibelkonvention. „Name des HERRN, unseres Gottes“ bewahrt sowohl die Gottesbezeichnung als auch die possessive Bindung des Hebräischen.
