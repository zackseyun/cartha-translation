source:
  edition: WLC
  text: אֵ֣לֶּה בָ֭/רֶכֶב וְ/אֵ֣לֶּה בַ/סּוּסִ֑ים וַ/אֲנַ֓חְנוּ בְּ/שֵׁם יְהוָ֖ה אֱלֹהֵ֣י/נוּ נַזְכִּֽיר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/007.yaml
  text: These trust in chariots and those in horses, but we call on the name of the LORD our God.
translation:
  language: de
  text: Die einen setzen auf Streitwagen, die anderen auf Pferde; wir aber rufen den Namen des HERRN, unseres Gottes, an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „wir aber bringen den Namen des HERRN, unseres Gottes, in Erinnerung“; das hebräische Verb kann hier auch „erwähnen“, „verkünden“ oder „sich auf … berufen“ bedeuten.'
    reason: Die Bedeutungsbreite von נַזְכִּיר soll sichtbar bleiben, da „anrufen“ den Sinn im Kontext gut trifft, ihn aber stärker festlegt als das hebräische Verb.
lexical_decisions:
- source_word: אֵלֶּה בָרֶכֶב וְאֵלֶּה בַסּוּסִים
  choice: Die einen setzen auf Streitwagen, die anderen auf Pferde
  rationale: Im Hebräischen stehen in den ersten beiden Satzgliedern nur die Präpositionalgruppen „bei/mit Streitwagen“ und „bei/mit Pferden“; das Verb ist elliptisch. „setzen auf“ macht den aus dem Kontrast erschließbaren Sinn im Deutschen natürlich verständlich, ohne bloßes Vorhandensein von Wagen und Pferden auszudrücken.
- source_word: בְּשֵׁם יְהוָה
  choice: den Namen des HERRN
  rationale: Die Präposition בְּ gehört hier zur Wendung mit זכר und wird im Deutschen idiomatisch durch „den Namen … anrufen“ wiedergegeben. Das Tetragramm wird nach verbreiteter deutscher Bibeltradition als „HERR“ gesetzt.
- source_word: נַזְכִּיר
  choice: rufen … an
  rationale: Der Hifil von זכר kann „erwähnen, in Erinnerung rufen, verkünden“ und im Zusammenhang mit dem göttlichen Namen auch „anrufen“ bedeuten. „anrufen“ bildet den religiösen Kontrast zum Vertrauen auf militärische Macht klar und natürlich ab.
theological_decisions:
- issue: Art des Gegensatzes zwischen militärischen Mitteln und dem Namen Gottes
  choice: „setzen auf“ gegenüber „rufen … an“
  alternative: „rühmen sich“ gegenüber „rühmen uns“ oder „denken an“
  rationale: Der hebräische Text lässt die Tätigkeit der ersten beiden Gruppen unausgesprochen und verwendet im letzten Satzglied ein mehrdeutiges Verb. Die gewählte Fassung wahrt den Gegensatz zwischen menschlicher Macht und der Hinwendung zu Gott, ohne eine bestimmte Lehre über militärische Mittel einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Rhythmus. Der Parallelismus „die einen … die anderen … wir aber“ bleibt erhalten; „Streitwagen“ ist historisch präzise und allgemein verständlich.
