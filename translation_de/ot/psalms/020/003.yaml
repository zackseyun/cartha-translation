  source_fidelity: Der Wunschcharakter von יִזְכֹּר und יְדַשְּׁנֶה ist mit „Er denke … und nehme … an“ treffend wiedergegeben. „alle deine Gaben“ bewahrt die Breite von מִנְחֹתֶיךָ, während „dein Brandopfer“ עוֹלָתְךָ präzise entspricht. Die idiomatische Wiedergabe von יְדַשְּׁנֶה als günstige Annahme ist im Kontext sachgerecht; „Sela“ lässt die Funktion des unsicheren Begriffs offen.
