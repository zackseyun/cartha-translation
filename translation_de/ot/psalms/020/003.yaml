source:
  edition: WLC
  text: יִזְכֹּ֥ר כָּל מִנְחֹתֶ֑/ךָ וְ/עוֹלָתְ/ךָ֖ יְדַשְּׁנֶ֣/ה סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/003.yaml
  text: May he remember all your offerings and accept your burnt offering[b][a]. Selah
translation:
  language: de
  text: Er denke an alle deine Gaben und nehme dein Brandopfer wohlgefällig an.[a] Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »und dein Brandopfer mache er fett« oder »sehe er als reich an«; dies ist hier ein Bild für die wohlgefällige Annahme des Opfers. Das mit »Gaben« übersetzte hebräische Wort kann auch speziell »Speisopfer« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכֹּר
  choice: Er denke an
  rationale: Der Qal-Imperfekt steht hier im Gebets- und Segenskontext mit Wunschcharakter. Der deutsche Konjunktiv I gibt diesen Wunsch knapp und würdig wieder.
- source_word: כָּל
  choice: alle
  rationale: Bewahrt die umfassende Bedeutung des hebräischen Quantors.
- source_word: מִנְחֹתֶךָ
  choice: deine Gaben
  rationale: מִנְחָה kann allgemein eine Gabe beziehungsweise Opfergabe und enger ein Speisopfer bezeichnen. »Gaben« wahrt im Haupttext die lexikalische Breite.
- source_word: וְעוֹלָתְךָ
  choice: und dein Brandopfer
  rationale: עוֹלָה ist die übliche kultische Bezeichnung für das vollständig verbrannte Opfer; »Brandopfer« ist die etablierte und natürliche deutsche Wiedergabe.
- source_word: יְדַשְּׁנֶה
  choice: nehme ... wohlgefällig an
  rationale: Das Piel von דשן bedeutet wörtlich etwa »fett machen« beziehungsweise »als reich/fett ansehen« und bezeichnet hier idiomatisch die günstige Annahme des Opfers. »wohlgefällig annehmen« bewahrt diesen positiven Wertungsaspekt.
- source_word: סֶלָה
  choice: Sela
  rationale: Die traditionelle Umschrift bleibt stehen, da Funktion und genaue Bedeutung des Ausdrucks unsicher sind.
theological_decisions:
- issue: Bezug der Verben in der 3. Person Maskulinum Singular
  choice: Das unausgesprochene Subjekt wird mit »er« wiedergegeben und bezieht sich im Zusammenhang auf Gott.
  alternative: Das göttliche Subjekt könnte wie im Hebräischen ausschließlich aus dem Kontext erschlossen und im Deutschen unausgedrückt bleiben.
  rationale: Psalm 20 richtet diesen Segenswunsch an Gott zugunsten des Königs. Das deutsche Pronomen macht den Satz natürlich verständlich, ohne über den Kontext hinaus eine theologische Aussage hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Konjunktiv I bildet den Gebetswunsch ab. Die kultische Fachbezeichnung »Brandopfer« und das unübersetzte »Sela« bleiben erhalten; eine gemeinsame Fußnote erklärt die beiden wesentlichen lexikalischen Spannungen.
