  text: Und mögest du die Kinder deiner Kinder sehen.[a] Frieden[b] über Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Söhne für deine Söhne« – gemeint sind Enkel beziehungsweise die Kinder deiner Kinder.'
