lexical_decisions:
- source_word: וּ/רְאֵה
  choice: Und mögest du … sehen
  rationale: Der Imperativ steht im Zusammenhang des Segensspruchs. Die Wunschform gibt diese Funktion im Deutschen natürlicher wieder als ein bloßer Befehl und bewahrt zugleich das einleitende וּ („und“).
- source_word: בָנִים לְ/בָנֶי/ךָ
  choice: die Kinder deiner Kinder
  rationale: Wörtlich steht „Söhne deinen Söhnen“. Die deutsche Wendung bezeichnet idiomatisch die Enkel beziehungsweise die Nachkommenschaft der nächsten Generation, ohne die im Kontext generische Aussage unnötig auf männliche Nachkommen zu verengen.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: „Frieden“ ist die direkte und traditionsnahe Entsprechung, lässt aber die umfassendere Bedeutung von Wohlergehen, Ganzsein und Gedeihen mitschwingen.
- source_word: עַל
  choice: über
  rationale: In der Segensformel „Frieden über Israel“ bewahrt „über“ die räumlich-bildhafte Beziehung des hebräischen עַל und ist in gehobener, verständlicher Segenssprache natürlich.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname wird unverändert wiedergegeben; der ausdrücklich genannte historische Bundesbezug wird nicht interpretierend erweitert.
theological_decisions:
- issue: Reichweite des abschließenden Segens
  choice: Israel bleibt als ausdrücklich genanntes Bundesvolk stehen.
  alternative: Die Gottesdienstgemeinschaft allgemein oder typologisch die Kirche.
  rationale: Der hebräische Text nennt ausdrücklich Israel. Mögliche spätere theologische Bezüge gehören nicht als Auslegung in den Übersetzungstext.
- issue: Charakter von וּרְאֵה als Aufforderung oder Segenswunsch
  choice: 'Wiedergabe als Wunsch: „mögest du … sehen“.'
  alternative: „Und sieh“ oder „du wirst sehen“.
  rationale: Der Psalmzusammenhang legt eine Segensformel nahe. Die Wunschform wahrt diese Funktion, ohne den Satz zu einer sicheren Vorhersage umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die benediktorische Wunschform wird bewahrt; die Schlusszeile bleibt knapp und feierlich. Sämtliche Fußnotenmarker stehen im Haupttext.
