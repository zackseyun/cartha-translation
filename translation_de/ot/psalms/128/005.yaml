source:
  edition: WLC
  text: יְבָרֶכְ/ךָ֥ יְהוָ֗ה מִ/צִּ֫יּ֥וֹן וּ֭/רְאֵה בְּ/ט֣וּב יְרוּשָׁלִָ֑ם כֹּ֝֗ל יְמֵ֣י חַיֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/005.yaml
  text: May Yahweh bless you from Zion[a], and may you see the prosperity of Jerusalem all the days of your life.
translation:
  language: de
  text: Yahweh segne dich aus Zion, und mögest du das Wohlergehen Jerusalems[a] sehen alle Tage deines Lebens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Gute Jerusalems“ oder „den Wohlstand Jerusalems“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: segne dich
  rationale: Der präfigierte Piel kann im Segenszusammenhang einen Wunsch ausdrücken; der deutsche Konjunktiv „segne“ gibt diese benediktorische Kraft knapp und würdig wieder.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִצִּיּוֹן
  choice: vom Zion her
  rationale: Die Präposition מן bezeichnet den Ausgangspunkt; „vom Zion her“ bewahrt sowohl die räumliche als auch die theologische Bildsprache.
- source_word: וּרְאֵה
  choice: und mögest du ... sehen
  rationale: Der Imperativ steht in einer Segensfolge und wird daher als fortgesetzter Wunsch verstanden; „mögest du“ macht diese Funktion im modernen Deutschen deutlich.
- source_word: בְּטוּב
  choice: das Wohlergehen
  rationale: טוּב kann Gutes, Güte, Wohlergehen oder Wohlstand bezeichnen. „Wohlergehen“ passt zum gemeinschaftlichen Segen Jerusalems, ohne die Bedeutung auf materiellen Wohlstand zu verengen.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: alle Tage deines Lebens
  rationale: Die Formulierung bildet das hebräische Idiom transparent und in würdigem, verständlichem Deutsch ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt ihn als persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Segen „vom Zion her“
  choice: Zion als Ausgangspunkt des Segens beibehalten, ohne Deutungserweiterung
  alternative: Zion im Haupttext ausdrücklich als Tempel- oder messianisches Zentrum erklären
  rationale: Der Vers verbindet den von Zion kommenden Segen mit Jerusalems Wohlergehen, entfaltet die weitergehende theologische Bedeutung Zions hier jedoch nicht.
- issue: Bedeutung von טוּב in Bezug auf Jerusalem
  choice: Wohlergehen
  alternative: Güte; Gutes; Wohlstand
  rationale: Die semantische Offenheit wird durch eine Fußnote sichtbar gehalten. Der Haupttext vermeidet eine unnötige Beschränkung auf materiellen Wohlstand.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Segenscharakter wird durch „segne“ und „mögest“ bewahrt; „alle Tage deines Lebens“ hält die poetische Nähe zum Hebräischen aufrecht.
