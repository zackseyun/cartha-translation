  yaml_path: translation/ot/psalms/128/002.yaml
  text: For you will eat the labor of your hands[a]; blessed are you[b], and it will be well with you.
translation:
  language: de
  text: Denn du wirst essen, was deine Hände erarbeitet haben[a]. Glücklich bist du[b], und es wird dir gut gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die Arbeit oder Mühsal deiner Hände“. Gemeint ist hier der Ertrag der eigenen Arbeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wohl dir“; auch möglich: „Gesegnet bist du“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: was deine Hände erarbeitet haben
  rationale: Die Wendung bezeichnet den durch eigene, auch mühevolle Arbeit erwirtschafteten Ertrag. Die Formulierung bewahrt den ausdrücklichen Bezug auf die Hände und ergibt zusammen mit „essen“ natürliches Deutsch.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion wird im Zusammenhang erklärend verstanden. Je nach syntaktischer Einordnung ist auch eine zeitliche Wiedergabe mit „wenn“ möglich.
- source_word: תֹאכֵל
  choice: du wirst essen
  rationale: Das Imperfekt beschreibt hier die erwartete Folge für den Menschen, der den HERRN fürchtet; „essen“ bewahrt das konkrete Bild des Genießens selbst erarbeiteter Nahrung.
- source_word: אַשְׁרֶיךָ
  choice: Glücklich bist du
  rationale: Der weisheitliche Glückwunsch bezeichnet einen Menschen als glücklich beziehungsweise beneidenswert in seiner guten Lebenslage, nicht bloß ein momentanes Gefühl.
- source_word: וְטוֹב לָךְ
  choice: und es wird dir gut gehen
  rationale: Die idiomatische deutsche Wendung gibt das zugesagte Wohlergehen klar und persönlich wieder.
theological_decisions:
- issue: Wiedergabe der weisheitlichen Glückwunschformel אַשְׁרֶיךָ
  choice: Glücklich bist du
  alternative: Gesegnet bist du; Wohl dir
  rationale: Das hebräische אַשְׁרֵי ist eine Glückwunschformel und nicht das übliche Verb für göttliches Segnen. „Glücklich bist du“ bewahrt diese Unterscheidung, ohne den theologischen Zusammenhang des Psalms aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der konkrete Bezug auf die eigenen Hände bleibt erhalten; die im Deutschen unnatürliche Verbindung „Mühsal essen“ wird sinngemäß entfaltet. Die Satzstruktur folgt der knappen weisheitlichen Aussage des Hebräischen.
