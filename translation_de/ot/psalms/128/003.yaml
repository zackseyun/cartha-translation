  text: אֶשְׁתְּ/ךָ֤ כְּ/גֶ֥פֶן פֹּרִיָּה֮ בְּ/יַרְכְּתֵ֪י בֵ֫יתֶ֥/ךָ בָּ֭נֶי/ךָ כִּ/שְׁתִלֵ֣י זֵיתִ֑ים סָ֝בִ֗יב לְ/שֻׁלְחָנֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/003.yaml
  text: Your wife will be like a fruitful vine in the recesses of your house[b][a]; your children will be like olive shoots around your table.
translation:
  language: de
  text: Deine Frau gleicht einem fruchttragenden Weinstock im Inneren deines Hauses; deine Söhne[a] gleichen jungen Olivenbäumen rings um deinen Tisch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Kinder«, falls die maskuline Bezeichnung hier stellvertretend für die Nachkommenschaft insgesamt gebraucht ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁתְּךָ
  choice: deine Frau
  rationale: Im ehelichen Kontext bezeichnet das Substantiv eindeutig die Ehefrau; im Deutschen ist „deine Frau“ die natürliche Entsprechung.
- source_word: כְּגֶפֶן פֹּרִיָּה
  choice: gleicht einem fruchttragenden Weinstock
  rationale: Das Präfix כ markiert den Vergleich; „fruchttragend“ bewahrt sowohl das Pflanzenbild als auch den Gedanken reichen Segens.
- source_word: בְּיַרְכְּתֵי בֵיתֶךָ
  choice: im Inneren deines Hauses
  rationale: יַרְכְּתֵי bezeichnet die abgelegenen, hinteren oder inneren Bereiche. Die Formulierung wahrt die räumliche Nuance, ohne im Deutschen unnatürlich zu wirken.
- source_word: בָּנֶיךָ
  choice: deine Söhne
  rationale: Der hebräische Ausdruck ist ausdrücklich maskuliner Plural und bedeutet zunächst „Söhne“; die mögliche repräsentative Bedeutung wird in einer Fußnote bewahrt.
- source_word: כִּשְׁתִלֵי זֵיתִים
  choice: gleichen jungen Olivenbäumen
  rationale: שְׁתִלֵי bezeichnet gepflanzte junge Gewächse beziehungsweise Setzlinge. „Junge Olivenbäume“ vermittelt das Bild vitalen, heranwachsenden Nachwuchses im Deutschen klarer als „Olivenstecklinge“.
- source_word: סָבִיב לְשֻׁלְחָנֶךָ
  choice: rings um deinen Tisch
  rationale: Die Wendung gibt die räumliche Anordnung prägnant und idiomatisch wieder und bewahrt das familiäre Tischbild.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung der Nachkommen
  choice: deine Söhne
  alternative: deine Kinder
  rationale: Der Ausgangstext verwendet das maskuline בָּנֶיךָ („deine Söhne“). Die Hauptübersetzung erhält diese Markierung; die Fußnote weist darauf hin, dass Söhne im Zusammenhang repräsentativ für die Nachkommenschaft insgesamt stehen können.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die parallele Formulierung mit „gleicht/gleichen“ erhält den poetischen Aufbau. „Im Inneren“ gibt die schwer eindeutig festzulegende räumliche Wendung zurück, ohne eine bestimmte häusliche Architektur vorauszusetzen.
