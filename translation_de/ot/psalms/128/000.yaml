source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אַ֭שְׁרֵי כָּל יְרֵ֣א יְהוָ֑ה הַ֝/הֹלֵ֗ךְ בִּ/דְרָכָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/000.yaml
  text: A Song of Ascents. Blessed is everyone who fears Yahweh[a], who walks in his ways.
translation:
  language: de
  text: Ein Wallfahrtslied. Glücklich ist jeder, der Jahwe[a] fürchtet und auf seinen Wegen geht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der den HERRN fürchtet«. »Jahwe« gibt den hebräischen Gottesnamen יהוה wieder, der traditionell mit »der HERR« übersetzt wird.'
    reason: translation_tradition
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die Überschrift bezeichnet ein Lied der »Aufstiege«; im Psalterzusammenhang ist die geläufige, natürliche Deutung als Lied für die Wallfahrt nach Jerusalem angemessen, ohne den hebräischen Ausdruck wörtlich und unklar als »Aufstiegslied« wiederzugeben.
- source_word: אַשְׁרֵי
  choice: Glücklich
  rationale: Der Ausdruck bezeichnet den beglückwünschenswerten Zustand eines Menschen, dem es unter Gottes Gunst gut ergeht; »glücklich« ist hier verständlich und bewahrt den Ausrufcharakter.
- source_word: כָּל
  choice: jeder
  rationale: Das distributive Singularwort passt zu den folgenden singularischen Partizipien und hebt hervor, dass die Aussage für jeden einzelnen Menschen gilt.
- source_word: יְרֵא
  choice: fürchtet
  rationale: »Fürchten« bewahrt die biblische Spannung aus Ehrfurcht, Achtung und dem Ernst vor Gott, statt sie auf bloßen Respekt zu reduzieren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַהֹלֵךְ בִּדְרָכָיו
  choice: und auf seinen Wegen geht
  rationale: Die Wegmetapher wird gewahrt; »gehen« bezeichnet hier die Lebensführung. Das deutsche »und« gibt die sachliche Verbindung der parallel charakterisierenden Partizipialfügung natürlich wieder.
theological_decisions:
- issue: Verhältnis von Gottesfurcht und Lebenswandel
  choice: Beide Wendungen beschreiben denselben glücklichen Menschen, ohne eine dogmatische Kausalfolge ausdrücklich einzufügen.
  alternative: »weil er auf seinen Wegen geht« oder eine andere kausale Verknüpfung
  rationale: Der hebräische Text stellt die Beschreibungen nebeneinander und lässt ihr genaues Verhältnis offen.
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält das Tetragramm als Eigennamen; die Transliteration macht diese lexikalische Unterscheidung sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe poetische Parallelität und die Wegmetapher bleiben erhalten. »Wallfahrtslied« ist idiomatischer als das formnähere, aber weniger klare »Lied der Aufstiege«.
