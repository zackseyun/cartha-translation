  terminology: „Jahwe“ gibt das Tetragramm als Eigenname konsistent wieder. „Jahwe fürchten“ ist als biblisch-weisheitlicher Ausdruck angemessen und wird nicht zu bloßem Respekt abgeschwächt. Die Fußnote erläutert die relevante Bedeutungsbreite von אַשְׁרֵי und ist korrekt an der betreffenden Stelle verankert.
