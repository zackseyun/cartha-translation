  source_fidelity: Der Text gibt die hebräische Überschrift sowie die beiden charakterisierenden Partizipien sachgemäß wieder. „Jahwe fürchtet“ bewahrt die Bedeutung von יְרֵא יְהוָה, und „auf seinen Wegen geht“ erhält die ethische Wegmetaphorik von הַהֹלֵךְ בִּדְרָכָיו. „Wallfahrtslied“ ist eine im Deutschen etablierte Wiedergabe der Überschrift, auch wenn die historische Einordnung von מַעֲלוֹת nicht abschließend gesichert ist.
