source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אַ֭שְׁרֵי כָּל יְרֵ֣א יְהוָ֑ה הַ֝/הֹלֵ֗ךְ בִּ/דְרָכָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/001.yaml
  text: A Song of Ascents. Blessed is everyone who fears Yahweh[a], who walks in his ways.
translation:
  language: de
  text: Ein Wallfahrtslied. Glücklich ist jeder, der Jahwe fürchtet[a] und auf seinen Wegen geht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gesegnet ist jeder, der Jahwe fürchtet.“ Das hebräische אַשְׁרֵי bezeichnet einen Zustand des Glücks, Wohlergehens oder Gesegnetseins.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die Überschrift bezeichnet einen Psalm aus der Sammlung der מַעֲלוֹת-Lieder. „Wallfahrtslied“ ist im Deutschen eine natürliche, traditionsnahe Wiedergabe; die genaue historische Funktion der Bezeichnung bleibt jedoch unsicher.
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: אַשְׁרֵי spricht einen Menschen als glücklich, begünstigt oder in einem Zustand des Wohlergehens befindlich aus. „Glücklich ist“ gibt die Weisheitsformel verständlich wieder, ohne ausdrücklich eine Segenshandlung zu behaupten.
- source_word: כָּל יְרֵא
  choice: jeder, der … fürchtet
  rationale: Das distributive כָּל mit dem maskulinen Singularpartizip hat allgemein-menschlichen Sinn. „Jeder, der“ bewahrt die repräsentative Singularform und ist im Deutschen generisch verständlich.
- source_word: יְרֵא יְהוָה
  choice: der Jahwe fürchtet
  rationale: „Fürchten“ bewahrt das gewichtige biblische Motiv ehrfürchtiger Gottesfurcht und schwächt es nicht zu bloßem Respekt ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: הַהֹלֵךְ
  choice: und … geht
  rationale: Das Partizip charakterisiert denselben Menschen weiter. „Geht“ erhält das hebräische Bild für die Lebensführung; die Verbindung mit „und“ bildet die parallelen Partizipien im Deutschen natürlich ab.
- source_word: בִּדְרָכָיו
  choice: auf seinen Wegen
  rationale: Die Wendung bezeichnet bildhaft eine an Gottes Willen ausgerichtete Lebensführung. Im Deutschen ist „auf seinen Wegen gehen“ idiomatischer als die formale Wiedergabe „in seinen Wegen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält das Tetragramm als persönlichen Gottesnamen. „Jahwe“ gibt diesen Namen wieder, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Bedeutung von אַשְׁרֵי
  choice: Glücklich ist
  alternative: Gesegnet ist; Wohl dem
  rationale: Die Formel bezeichnet einen Zustand des Glücks und Wohlergehens. „Glücklich ist“ vermeidet die mögliche Überdeutung als ausdrückliche göttliche Segenshandlung; die verbreitete Alternative „Gesegnet ist“ wird in der Fußnote genannt.
- issue: Generischer Sinn von כָּל יְרֵא
  choice: jeder, der Jahwe fürchtet
  alternative: alle, die Jahwe fürchten; jeder Mann, der Jahwe fürchtet
  rationale: Der grammatisch maskuline Singular ist hier repräsentativ und nicht auf Männer beschränkt. Die gewählte Form wahrt den Singular, ohne eine sachlich unbegründete Geschlechtsbegrenzung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Psalmüberschrift wird idiomatisch als „Wallfahrtslied“ wiedergegeben. Das ethische Bild des Gehens auf Gottes Wegen und der Ausdruck „Jahwe fürchten“ bleiben erhalten.
