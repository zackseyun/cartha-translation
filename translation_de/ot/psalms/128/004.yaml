  text: הִנֵּ֣ה כִי כֵ֭ן יְבֹ֥רַךְ גָּ֗בֶר יְרֵ֣א יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/004.yaml
  text: Behold[a], thus shall the man who fears Yahweh be blessed.
translation:
  language: de
  text: Siehe, so wird der Mann[a] gesegnet, der Jahwe fürchtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bedeutet „Mann“; die männliche Form steht hier sprichwörtlich für einen Menschen, dessen Kennzeichen die Furcht Jahwes ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Der emphatische Aufmerksamkeitsruf wird mit dem in deutscher Bibel- und Dichtungssprache geläufigen „Siehe“ wiedergegeben; so bleibt der feierlich-verkündende Ton erhalten.
- source_word: כִי כֵן
  choice: so
  rationale: Die Partikelverbindung bekräftigt die zuvor geschilderte Art und Folge des Segens. „So“ gibt dies knapp und natürlich wieder, ohne die Partikeln unnötig zu überladen.
- source_word: יְבֹרַךְ
  choice: wird … gesegnet
  rationale: Die Pual-Form von ברך ist passiv. Die deutsche Futurform wahrt sowohl das Passiv als auch den feststellend-verheißenden Charakter des Weisheitsspruchs.
- source_word: גָּבֶר
  choice: der Mann
  rationale: Das maskuline Substantiv bezeichnet hier sprichwörtlich den Menschen, dessen kennzeichnende Haltung die Furcht Jahwes ist. Die formal männliche Ausdrucksweise bleibt im Text erhalten; ihre allgemeine Reichweite wird in einer Fußnote erläutert.
- source_word: יְרֵא יְהוָה
  choice: der Jahwe fürchtet
  rationale: Die partizipiale Wendung beschreibt ein bleibendes Kennzeichen. „Jahwe fürchten“ bewahrt die vertraute Sprache der biblischen Weisheit und legt sie nicht vorschnell als bloße Ehrfurcht aus.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, der im modernen Deutschen üblichen Form des Tetragramms.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt diesen Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Sprichwörtlicher Gebrauch des maskulinen גָּבֶר
  choice: der Mann
  alternative: der Mensch
  rationale: Die Übersetzung erhält die grammatisch und lexikalisch männliche Form des Ausgangstextes. Zugleich macht die Fußnote deutlich, dass die Aussage sprichwörtlich auf jeden Menschen mit diesem Kennzeichen zielt.
- issue: Bedeutungsumfang von ירא
  choice: fürchtet
  alternative: verehrt
  rationale: „Fürchtet“ bewahrt die theologische Spannung des Weisheitsbegriffs zwischen Furcht, Ehrfurcht und gehorsamer Hinwendung; „verehrt“ würde den Ausdruck interpretierend verengen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit bewusst beibehaltenem poetisch-feierlichem „Siehe“. Der Satzbau ist knapp und parallel zur Weisheitssprache des Psalms; traditionelle Fach- oder Konfessionssprache wird vermieden.
