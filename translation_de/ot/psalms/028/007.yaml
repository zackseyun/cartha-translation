source:
  edition: WLC
  text: יְהוָ֤ה עֻזִּ֥/י וּ/מָגִנִּ/י֮ בּ֤/וֹ בָטַ֥ח לִבִּ֗/י וְֽ/נֶ֫עֱזָ֥רְתִּי וַ/יַּעֲלֹ֥ז לִבִּ֑/י וּֽ/מִ/שִּׁירִ֥/י אֲהוֹדֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/007.yaml
  text: Yahweh is my strength and my shield[a]; in him my heart trusts, and I am helped. Therefore my heart rejoices[c][b], and with my song I will praise him.
translation:
  language: de
  text: Jahwe ist meine Stärke und mein Schild. Auf ihn hat mein Herz vertraut, und mir wurde geholfen. Da jubelte mein Herz, und mit meinem Lied will ich ihm danken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihn preisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Lautung des Tetragramms.
- source_word: עֻזִּי
  choice: meine Stärke
  rationale: עֹז bezeichnet Stärke oder Macht; die direkte Wiedergabe passt zur Parallele „mein Schild“.
- source_word: מָגִנִּי
  choice: mein Schild
  rationale: Das konkrete und im Deutschen verständliche Schutzbild des hebräischen Ausdrucks bleibt erhalten.
- source_word: בּוֹ בָטַח לִבִּי
  choice: Auf ihn hat mein Herz vertraut
  rationale: Bei בטח bezeichnet ב die Person, auf die man sein Vertrauen setzt. Das Perfekt gibt die hebräische abgeschlossene Verbform natürlich wieder.
- source_word: וְנֶעֱזָרְתִּי
  choice: und mir wurde geholfen
  rationale: Die passive Form von עזר wird bewahrt, ohne den im Hebräischen nicht ausdrücklich genannten Helfer als Subjekt einzusetzen.
- source_word: וַיַּעֲלֹז לִבִּי
  choice: Da jubelte mein Herz
  rationale: עלז bezeichnet lebhafte, triumphierende Freude; „da“ stellt den erzählerischen Ergebniszusammenhang her.
- source_word: וּמִשִּׁירִי
  choice: und mit meinem Lied
  rationale: Die Präposition מִן bezeichnet hier am wahrscheinlichsten das Mittel, durch das Dank oder Lob ausgedrückt wird.
- source_word: אֲהוֹדֶנּוּ
  choice: will ich ihm danken
  rationale: ידה im Hifil kann „danken“ oder „preisen“ bedeuten. „Danken“ passt zum erfahrenen Beistand; die ebenfalls mögliche Bedeutung „preisen“ wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; JHWH
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Lautung „Jahwe“ bewahrt ihn als Namen und vermeidet die Ersetzung durch einen Titel.
- issue: Nicht ausdrücklich genanntes Subjekt der Hilfe
  choice: mir wurde geholfen
  alternative: er half mir
  rationale: Obwohl Jahwe im Zusammenhang als Helfer verstanden wird, lässt die passive hebräische Form das handelnde Subjekt unausgesprochen. Die Übersetzung erhält diese Form und vermeidet eine stillschweigende Explizierung.
translation_notes:
  register: Dignisches, gut verständliches modernes Standarddeutsch. Die Herzmetaphorik und das Schildbild bleiben als klare poetische Bilder erhalten; die Folge abgeschlossener Handlungen wird durch Perfekt und Präteritum wiedergegeben.
