  text: אַל תִּמְשְׁכֵ֣/נִי עִם רְשָׁעִים֮ וְ/עִם פֹּ֪עֲלֵ֫י אָ֥וֶן דֹּבְרֵ֣י שָׁ֭לוֹם עִם רֵֽעֵי/הֶ֑ם וְ֝/רָעָ֗ה בִּ/לְבָבָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/003.yaml
  text: Do not drag me away with the wicked[a], with those who work evil[b], who speak peace with their neighbors while evil is in their hearts.
translation:
  language: de
  text: Reiß mich nicht mit den Frevlern fort[a], nicht mit denen, die Unrecht tun, die ihren Nächsten Frieden zusprechen, während Böses in ihren Herzen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zieh mich nicht mit den Frevlern fort.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשְׁכֵנִי
  choice: Reiß mich … fort
  rationale: Das Verb משׁך bezeichnet hier ein gewaltsames Mitziehen in die Gemeinschaft oder das Geschick anderer. „Fortreißen“ gibt die Dringlichkeit der Bitte natürlich wieder, ohne die Art des drohenden Gerichts näher festzulegen.
- source_word: רְשָׁעִים
  choice: den Frevlern
  rationale: „Frevler“ ist im Psalmenkontext eine knappe, würdige Bezeichnung für Menschen, deren Handeln moralisch verwerflich ist; es beschränkt den Ausdruck nicht auf juristische Schuld.
- source_word: פֹּעֲלֵי אָוֶן
  choice: denen, die Unheil tun
  rationale: Die Formulierung bewahrt den tätigen Aspekt von פֹּעֲלֵי und gibt אָוֶן hier als moralisch schädigendes Tun wieder. Sie ist verständlicher und natürlicher als „Übeltäter des Unrechts“.
- source_word: דֹּבְרֵי שָׁלוֹם
  choice: die friedlich … reden
  rationale: Der hebräische Ausdruck bedeutet wörtlich „Frieden reden“. „Friedlich reden“ vermittelt im Deutschen natürlich das äußerlich versöhnliche Sprechen und erhält den Gegensatz zum inneren Bösen.
- source_word: רֵעֵיהֶם
  choice: ihren Mitmenschen
  rationale: רֵעַ kann Freund, Gefährte, Nächster oder Mitmensch bedeuten. „Mitmenschen“ lässt das Verhältnis bewusst offen und unterstellt keine echte Freundschaft.
- source_word: רָעָה
  choice: Böses
  rationale: Das Wort bezeichnet hier die im Inneren vorhandene böse Absicht oder Gesinnung. Die allgemeine Wiedergabe „Böses“ erhält die Weite des hebräischen Ausdrucks.
- source_word: בִּלְבָבָם
  choice: in ihren Herzen
  rationale: Die wörtliche und im Deutschen geläufige Formulierung bewahrt das Herz als Bild für Denken, Wollen und innere Absicht.
theological_decisions:
- issue: Worauf sich die Bitte bezieht, nicht mit den Frevlern fortgerissen zu werden
  choice: Bitte, nicht zusammen mit den Frevlern in ihre Gemeinschaft oder ihr Geschick hineingezogen zu werden
  alternative: Bitte, das Verhalten der Frevler nicht nachzuahmen
  rationale: Die Verbindung von משׁך mit עִם legt ein gemeinsames Fortgerissenwerden nahe, möglicherweise in das Gericht. Da der hebräische Text das genaue Ziel nicht nennt, wird es auch in der Übersetzung nicht ausdrücklich ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit psalmentypischer Prägnanz. „Frevler“ wahrt den poetisch-biblischen Ton; „Mitmenschen“ vermeidet eine unnötige Festlegung von רֵעֵיהֶם auf Freunde oder Nachbarn. Der Gegensatz zwischen äußerlich friedlicher Rede und innerem Bösen bleibt klar erhalten.
