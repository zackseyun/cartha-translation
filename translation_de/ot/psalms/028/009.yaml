  text: Save your people and bless your inheritance[b][a]; shepherd them and carry them forever.
translation:
  language: de
  text: Rette dein Volk und segne dein Erbteil! Hüte sie[a] und trage sie[b] für immer!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weide sie“. Das hebräische Verb bezeichnet die Tätigkeit eines Hirten und kann sowohl das Weiden als auch die umfassende Fürsorge für die Herde einschließen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hebe sie empor“. Das hebräische Verb kann „tragen“, „aufheben“ oder „emporheben“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: Rette
  rationale: Der Imperativ von ישׁע richtet sich an Gott. „Rette“ ist im heutigen Deutsch unmittelbar und bewahrt sowohl den Gedanken der Befreiung als auch den umfassenderen Heilsbezug.
- source_word: עַמֶּךָ
  choice: dein Volk
  rationale: עַם mit Suffix der 2. Person Singular bezeichnet das Gott zugehörige Volk; „dein Volk“ ist klar und entspricht dem Bundesbezug.
- source_word: בָרֵךְ
  choice: segne
  rationale: Der Imperativ von ברך wird in einer Gebetsbitte mit dem natürlichen und liturgisch angemessenen „segne“ wiedergegeben.
- source_word: נַחֲלָתֶךָ
  choice: dein Erbteil
  rationale: נַחֲלָה bezeichnet Erbbesitz oder zugeteilten Besitz. „Dein Erbteil“ bewahrt hier das Bild des Volkes als Gottes besonderem Besitz und passt zum folgenden pluralischen Rückbezug.
- source_word: רְעֵם
  choice: Weide sie
  rationale: Der Imperativ von רעה mit pluralischem Objektsuffix bezeichnet die Tätigkeit eines Hirten insgesamt. „Weide sie“ bewahrt das Hirtenbild in knapper, würdiger Form; die mögliche Bedeutungsbreite wird in einer Fußnote kenntlich gemacht.
- source_word: נַשְּׂאֵם
  choice: trage sie
  rationale: נשא kann „heben“, „tragen“ oder „emporheben“ bedeuten. Im Zusammenhang mit dem Hirtenbild drückt „trage sie“ schützende Fürsorge natürlich aus, ohne die lexikalische Alternative auszuschließen.
- source_word: עַד הָעוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte beziehungsweise bleibende Dauer; „für immer“ ist idiomatisches modernes Deutsch.
theological_decisions:
- issue: Hirtenmetaphorik in רְעֵם
  choice: Weide sie
  alternative: Hüte sie; versorge sie wie ein Hirte
  rationale: Das Verb umfasst mehr als bloßes Füttern und bezeichnet die umfassende Tätigkeit eines Hirten. Die knappe Übersetzung bewahrt das biblische Bild, während die Fußnote seine Bedeutungsbreite offenlegt.
- issue: Bundesbezogene Identität in נַחֲלָתֶךָ
  choice: dein Erbteil
  alternative: dein Erbe; dein Eigentum
  rationale: Der Ausdruck stellt das Volk als Gottes zugeteilten, ihm zugehörigen Besitz dar. „Erbteil“ erhält diese Spannung, ohne sie in eine bestimmte dogmatische Deutung aufzulösen.
- issue: Mehrdeutigkeit von נַשְּׂאֵם
  choice: trage sie
  alternative: hebe sie empor; nimm dich ihrer an
  rationale: „Trage sie“ fügt sich in die Hirtenmetaphorik und bezeichnet fürsorgliches Tragen. Da das hebräische Verb zugleich „emporheben“ bedeuten kann, bleibt diese Lesart in der Fußnote ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch mit knappen Imperativen. „Erbteil“ bewahrt den poetischen und bundesbezogenen Bildgehalt; die beiden Ausrufezeichen geben die Folge eindringlicher Bitten wieder. Die pluralischen Pronomen beziehen sich sinngemäß auf das als Gemeinschaft verstandene Volk beziehungsweise Erbteil.
