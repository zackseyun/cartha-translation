base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/008.yaml
  text: Yahweh is strength for them[b][a], and he is a stronghold of salvation for his anointed one.
translation:
  language: de
  text: Jahwe ist Stärke für sie, und für seinen Gesalbten[b] ist er eine Festung, die Rettung bringt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »eine Festung der Rettungen«; im Hebräischen steht »Rettungen« in der Mehrzahl. Möglich sind auch »eine Zuflucht der Befreiungen« oder »eine Festung rettender Taten«.'
    reason: lexical_alternative
  - marker: b
    text: »Seinen Gesalbten« kann auch als »seinen Messias« wiedergegeben werden. Im Zusammenhang ist zunächst wohl Jahwes gesalbter König gemeint; eine weitergehende messianische Bedeutung bleibt möglich.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel wie »der HERR« ersetzt.
- source_word: עֹז
  choice: Stärke
  rationale: Das Substantiv bezeichnet Kraft oder Stärke. Die Wiedergabe hält es vom folgenden מָעוֹז (»Festung/Zuflucht«) deutlich getrennt.
- source_word: לָמוֹ
  choice: für sie
  rationale: Die hebräische Pronominalform ist pluralisch. »Für sie« bewahrt diese Form, ohne aus dem Kontext ausdrücklich »für sein Volk« einzusetzen.
- source_word: מָעוֹז
  choice: Festung
  rationale: Das Wort bezeichnet einen befestigten Schutzort oder eine sichere Zuflucht. »Festung« erhält das konkrete Schutzbild.
- source_word: יְשׁוּעוֹת
  choice: rettende
  rationale: Das Hebräische verwendet den Plural von »Rettung«. Die idiomatische Verbindung »rettende Festung« gibt die Funktion natürlich wieder; die auffällige Pluralform bleibt in einer Fußnote sichtbar.
- source_word: מְשִׁיחוֹ
  choice: seinen Gesalbten
  rationale: Im unmittelbaren Zusammenhang ist zunächst der von Jahwe gesalbte König gemeint. Die Formulierung übersetzt das Wort direkt, ohne es im Haupttext bereits als festen Titel »Messias« zu bestimmen.
- source_word: הוּא
  choice: er ist
  rationale: Das selbstständige Pronomen setzt Nachdruck und wird im Deutschen durch das ausdrücklich wiederholte »er ist« abgebildet.
theological_decisions:
- issue: Ob מְשִׁיחוֹ als beschreibende Bezeichnung oder als fester Titel wiederzugeben ist
  choice: seinen Gesalbten
  alternative: seinen Messias
  rationale: »Gesalbter« entspricht dem unmittelbaren Sinn im königlichen Kontext des Psalms. Die mögliche messianische Tragweite wird nicht ausgeschlossen, sondern in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Wendung »Stärke für sie« bewahrt den pluralischen Bezug des Hebräischen; »rettende Festung« vermittelt das Schutzbild in natürlichem Deutsch, während die hebräische Mehrzahl »Rettungen« in der Fußnote dokumentiert wird.
