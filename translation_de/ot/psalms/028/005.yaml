source:
  edition: WLC
  text: כִּ֤י לֹ֤א יָבִ֡ינוּ אֶל פְּעֻלֹּ֣ת יְ֭הוָה וְ/אֶל מַעֲשֵׂ֣ה יָדָ֑י/ו יֶ֝הֶרְסֵ֗/ם וְ/לֹ֣א יִבְנֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/005.yaml
  text: Because they do not understand the works of Yahweh or the work of his hands[a], he will tear them down and not build them up.
translation:
  language: de
  text: Denn sie verstehen[a] die Taten Jahwes nicht und auch nicht das Werk seiner Hände; er wird sie niederreißen und nicht aufbauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: achten nicht auf.'
    reason: Die Verbindung von בין mit אֶל kann neben fehlendem Verständnis auch die Nuance des Beachten oder Ernstnehmens tragen.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Bitte beziehungsweise Gerichtsaussage ein und klingt im Deutschen natürlich.
- source_word: לֹא יָבִינוּ אֶל
  choice: sie achten nicht auf
  rationale: בין mit אֶל kann hier ein verstehendes Wahrnehmen oder Beachten ausdrücken. »Achten auf« bewahrt die mögliche willentliche Missachtung, ohne bloß intellektuelles Nichtverstehen festzulegen.
- source_word: פְּעֻלֹּת יְהוָה
  choice: die Taten Jahwes
  rationale: »Taten« bezeichnet Jahwes Wirken idiomatisch; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: מַעֲשֵׂה יָדָיו
  choice: das Werk seiner Hände
  rationale: Bewahrt den Singular und das konkrete hebräische Bild.
- source_word: יֶהֶרְסֵם
  choice: wird er sie niederreißen
  rationale: הרס bezeichnet das Einreißen oder Zerstören und eröffnet das Bau-Bild, das im folgenden Verb fortgeführt wird.
- source_word: וְלֹא יִבְנֵם
  choice: und nicht wieder aufbauen
  rationale: »Aufbauen« erhält den Gegensatz zu »niederreißen«; »wieder« ergibt sich im Deutschen natürlich aus dieser Abfolge, wird aber wegen der nicht ausdrücklich markierten Wiederholungsbedeutung erläutert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art ihres Versagens gegenüber Jahwes Taten
  choice: sie achten nicht auf
  alternative: sie verstehen nicht
  rationale: Die Verbindung von בין und אֶל lässt sowohl fehlendes Verständnis als auch mangelnde Beachtung zu. Der Haupttext wählt die im Kontext naheliegende Missachtung, die Fußnote bewahrt die andere echte Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Ausdrücke »Taten« und »Werk seiner Hände« sowie der bildhafte Gegensatz »niederreißen/aufbauen« bleiben erhalten.
