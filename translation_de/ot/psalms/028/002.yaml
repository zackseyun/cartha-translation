source:
  edition: WLC
  text: שְׁמַ֤ע ק֣וֹל תַּ֭חֲנוּנַ/י בְּ/שַׁוְּעִ֣/י אֵלֶ֑י/ךָ בְּ/נָשְׂאִ֥/י יָ֝דַ֗/י אֶל דְּבִ֥יר קָדְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/002.yaml
  text: Hear the voice of my pleas for mercy when I cry to you[c][b][a], when I lift up my hands toward your holy inner sanctuary.
translation:
  language: de
  text: Höre die Stimme meines Flehens um Erbarmen, wenn ich zu dir schreie, wenn ich meine Hände zu deinem heiligen innersten Heiligtum erhebe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu deinem heiligen Heiligtum“. Das hebräische Wort kann insbesondere den innersten Raum des Heiligtums bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Höre
  rationale: Der Qal-Imperativ richtet eine unmittelbare, dringliche Bitte an Gott; „Höre“ entspricht dem hebräischen Gebetsstil natürlich und würdevoll.
- source_word: ק֣וֹל תַּחֲנוּנַי
  choice: die Stimme meines Flehens um Erbarmen
  rationale: קוֹל bezeichnet Stimme oder Laut; zusammen mit תַּחֲנוּנַי ist „Stimme meines Flehens“ im Deutschen persönlich und idiomatisch. „Flehen um Erbarmen“ gibt die Bitte um Gunst beziehungsweise Erbarmen verständlich wieder.
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: wenn ich zu dir schreie
  rationale: ב mit Infinitivus constructus wird temporal wiedergegeben. „Schreie“ bewahrt die Intensität von שׁוע, ohne einen im Ausgangstext nicht ausdrücklich genannten Zweck hinzuzufügen.
- source_word: בְּנָשְׂאִי יָדַי
  choice: wenn ich meine Hände … erhebe
  rationale: Die temporale Konstruktion und die konkrete Gebetsgeste werden direkt und in natürlichem Deutsch wiedergegeben.
- source_word: אֶל דְּבִיר קָדְשֶׁךָ
  choice: zu deinem heiligen innersten Heiligtum
  rationale: דְּבִיר bezeichnet besonders den innersten Raum des Heiligtums. „Innerstes Heiligtum“ bewahrt diese räumliche Bestimmtheit; אֶל wird bei der Gebetsausrichtung idiomatisch mit „zu“ wiedergegeben.
theological_decisions:
- issue: Kultischer Bezug von דְּבִיר קָדְשֶׁךָ
  choice: deinem heiligen innersten Heiligtum
  alternative: deinem heiligen Heiligtum
  rationale: Die spezifische Bezeichnung des innersten heiligen Raumes wird beibehalten, ohne weitergehende kultische oder konfessionelle Deutungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gebetssprachlicher Dringlichkeit. Die parallelen temporalen Satzglieder des Hebräischen bleiben erhalten; unnötig altertümliche Wörter werden vermieden.
