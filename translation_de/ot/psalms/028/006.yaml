id: PSA.28.6
reference: Psalms 28:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֑ה כִּי שָׁ֝מַע ק֣וֹל תַּחֲנוּנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/006.yaml
  text: Blessed be Yahweh[b][a], for he has heard the voice of my pleas for mercy.
translation:
  language: de
  text: Gepriesen sei Jahwe, denn er hat die Stimme meines Flehens um Erbarmen gehört.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die Stimme meiner Bitten um Erbarmen“; קוֹל kann auch „Laut“ oder „Klang“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Das passive Partizip steht prädikativ als lobpreisender Ausruf. „Gepriesen sei“ gibt diese doxologische Formel im Deutschen natürlich und würdevoll wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund für den Lobpreis ein; „denn“ bewahrt den kausalen Zusammenhang knapp und idiomatisch.
- source_word: שָׁמַע
  choice: hat ... gehört
  rationale: Das Perfekt bezeichnet hier ein vollendetes Erhören, das den gegenwärtigen Lobpreis begründet. Das deutsche Perfekt passt gut zu diesem Zusammenhang.
- source_word: קוֹל
  choice: die Stimme
  rationale: קוֹל kann „Stimme“ oder „Laut/Klang“ bedeuten. In Verbindung mit persönlichem Flehen ist „Stimme“ natürlich und bewahrt die konkrete hebräische Ausdrucksweise.
- source_word: תַּחֲנוּנָי
  choice: meines Flehens um Erbarmen
  rationale: Das Substantiv bezeichnet dringende Bitten um Gunst oder Erbarmen. Der deutsche Singular „Flehen“ ist als Sammelbegriff idiomatisch und vermittelt sowohl Ernst als auch Ausrichtung auf Erbarmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gepriesen sei“ erhält den feierlichen Lobpreischarakter; „Flehen um Erbarmen“ ist verständlich, ohne das ältere „Flehen“ unnötig zu vereinfachen.
