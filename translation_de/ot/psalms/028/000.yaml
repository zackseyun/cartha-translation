  text: לְ/דָוִ֡ד אֵ֘לֶ֤י/ךָ יְהוָ֨ה אֶקְרָ֗א צוּרִ/י֮ אַֽל תֶּחֱרַ֪שׁ מִ֫מֶּ֥/נִּי פֶּן תֶּֽחֱשֶׁ֥ה מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם י֥וֹרְדֵי בֽוֹר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/000.yaml
  text: Of David[a]. To you, Yahweh, I call; my rock, do not be deaf to me, lest if you are silent to me[c][b], I become like those going down to the pit.
translation:
  language: de
  text: 'Von David.[a]


    Zu dir, Jahwe, rufe ich. Mein Fels, verschließe dein Ohr nicht vor mir; sonst schweigst du mir gegenüber, und ich werde denen gleich, die zur Grube hinabsteigen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Von David“ kann auch „für David“ oder „David zugehörig“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Die „Grube“ kann hier das Grab oder den Bereich der Toten bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die knappe deutsche Überschrift gibt die übliche Zuordnung durch לְ wieder, ohne ihre genaue Art übermäßig festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צוּרִי
  choice: mein Fels
  rationale: Das konkrete Bild des Hebräischen bleibt als direkte Anrede erhalten.
- source_word: אַל־תֶּחֱרַשׁ מִמֶּנִּי
  choice: stell dich mir gegenüber nicht taub
  rationale: חרש kann hier fehlendes Hören beziehungsweise Antworten ausdrücken; diese Wiedergabe bewahrt zugleich einen erkennbaren Unterschied zum folgenden חשה, „schweigen“.
- source_word: בּוֹר
  choice: Grube
  rationale: Die konkrete Bildsprache bleibt erhalten; im Kontext kann die Grube zugleich Grab oder Totenreich bezeichnen.
theological_decisions:
- issue: Bedeutungsumfang der davidischen Überschrift
  choice: Von David
  alternative: Für David / David betreffend
  rationale: Die traditionelle und natürliche deutsche Formulierung lässt die genaue Beziehung des Psalms zu David offen, statt sie dogmatisch auf Verfasserschaft zu verengen.
- issue: Beziehung zwischen Gottes Schweigen und dem Hinabsteigen zur Grube
  choice: Denn wenn du mir gegenüber schweigst, werde ich denen gleich …
  alternative: Schweig mir gegenüber nicht, sonst werde ich denen gleich …
  rationale: Die gewählte Form bildet die gefürchtete Bedingung und Folge verständlich ab, ohne zu behaupten, der Beter steige tatsächlich schon in das Totenreich hinab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und das Felsbild bleiben erhalten. „Sich taub stellen“ und „schweigen“ unterscheiden die beiden benachbarten hebräischen Verben, ohne ihren Bedeutungsüberschneidungen die Spannung zu nehmen.
