  to: 'Von David.[a]


    Zu dir, Jahwe, rufe ich. Mein Fels, verschließe dein Ohr nicht vor mir; sonst schweigst du mir gegenüber, und ich werde denen gleich, die zur Grube hinabsteigen.[b]'
  rationale: Die Revision ersetzt die unnatürliche und stärker wertende Wendung „stell dich ... taub“ durch eine natürliche Hörmetapher. Zugleich gibt „sonst“ die warnend-befürchtete Folge von פן angemessen wieder. Die Unterscheidung zwischen nicht hören bzw. das Ohr verschließen und schweigen bleibt erhalten, ohne ihre semantische Nähe zu leugnen.
