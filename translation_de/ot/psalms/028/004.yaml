base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/004.yaml
  text: Give to them according to their work[a], and according to the evil of their deeds; according to the work of their hands give to them; repay them their due.
translation:
  language: de
  text: Gib ihnen nach ihrem Tun, nach der Bosheit ihrer Taten; nach dem Werk ihrer Hände gib ihnen; vergilt ihnen, was ihnen gebührt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gib ihnen ihre Vergeltung zurück.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּן
  choice: Gib
  rationale: Der Imperativ richtet eine unmittelbare Bitte an Gott; „Gib“ bewahrt ihre knappe und nachdrückliche Form.
- source_word: כְּפָעֳלָם
  choice: was ihrem Tun entspricht
  rationale: פעל bezeichnet hier das Tun oder Werk; die Formulierung gibt das proportionale כְּ natürlich wieder.
- source_word: וּכְרֹעַ מַעַלְלֵיהֶם
  choice: und was der Bosheit ihrer Taten entspricht
  rationale: רֹעַ benennt die moralische Bosheit, מַעֲלָלִים die Taten; zugleich bleibt die Maß-für-Maß-Struktur erhalten.
- source_word: כְּמַעֲשֵׂה יְדֵיהֶם
  choice: was dem Werk ihrer Hände entspricht
  rationale: Die hebräische Hand-Metapher wird bewahrt und bezeichnet das, was sie selbst getan oder hervorgebracht haben.
- source_word: הָשֵׁב גְּמוּלָם לָהֶם
  choice: vergilt ihnen, was sie getan haben
  rationale: הָשֵׁב hat hier den Sinn des Zurückgebens oder Vergeltens; גְּמוּל kann sowohl die vollbrachte Tat als auch die entsprechende Vergeltung bezeichnen. Die Wiedergabe wahrt den Zusammenhang zwischen Tat und Rückvergeltung.
theological_decisions:
- issue: Fluchbitte und göttliche Vergeltung
  choice: Der Vers bleibt eine ausdrückliche Bitte an Gott, den Handelnden entsprechend ihren Taten zu vergelten.
  alternative: Die Aussage als bloße Beschreibung von Folgen oder als abgeschwächten Wunsch wiederzugeben.
  rationale: Die wiederholten Imperative תֶּן und הָשֵׁב sind petitionär. Eine Abschwächung würde die Spannung und den Ruf nach göttlicher Gerechtigkeit verdecken.
- issue: Bedeutung von גְּמוּלָם
  choice: „was sie getan haben“ im Sinn dessen, was auf sie zurückfallen soll
  alternative: „ihren Lohn“, „ihre Vergeltung“ oder „was ihnen gebührt“
  rationale: Das Substantiv kann Tat, erwiesene Behandlung oder Vergeltung bezeichnen. Die Hauptfassung nutzt die Tat-Vergeltungs-Beziehung des Kontexts; die formellere Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Gib ihnen“ und das Bild vom „Werk ihrer Hände“ bewahren Parallelismus und Nachdruck des Hebräischen; „was … entspricht“ klingt im Deutschen natürlicher als die durchgehend wörtliche Wendung „nach ihrem …“.
