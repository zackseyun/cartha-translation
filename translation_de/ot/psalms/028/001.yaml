  text: לְ/דָוִ֡ד אֵ֘לֶ֤י/ךָ יְהוָ֨ה אֶקְרָ֗א צוּרִ/י֮ אַֽל תֶּחֱרַ֪שׁ מִ֫מֶּ֥/נִּי פֶּן תֶּֽחֱשֶׁ֥ה מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם י֥וֹרְדֵי בֽוֹר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/001.yaml
  text: Of David[a]. To you, O Yahweh, I call; my rock, do not be deaf to me[c][b], lest you be silent to me and I become like those who go down to the pit.
translation:
  language: de
  text: Von David. Zu dir, Jahwe, rufe ich. Mein Fels, überhör mich nicht[a], damit du mir nicht schweigst[c] und ich nicht denen gleich werde, die in die Grube hinabsteigen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schweig mir gegenüber nicht“. Das erste Verb kann sowohl Taubheit als auch Schweigen bezeichnen; die Übersetzung unterscheidet es vom folgenden „schweigen“.'
    reason: lexical_alternative
  - marker: b
    text: Die „Grube“ kann das Grab oder den Bereich der Toten bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Denn wenn du mir gegenüber schweigst, werde ich denen gleich …“'
    reason: syntactic_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Überschrift bleibt hinsichtlich Autorschaft, Zugehörigkeit oder Widmung ähnlich offen wie das hebräische לְ; „Von David“ entspricht zugleich der geläufigen deutschen Psalmenüberschrift.
- source_word: אֵלֶיךָ יְהוָה אֶקְרָא
  choice: Zu dir, Jahwe, rufe ich
  rationale: Gibt die Zielrichtung des Rufens direkt wieder; das Imperfekt bezeichnet hier den gegenwärtigen beziehungsweise wiederholten Gebetsruf. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: צוּרִי
  choice: Mein Fels
  rationale: Bewahrt das konkrete Bild für Gott als festen, schützenden Halt, statt es deutend durch „Zuflucht“ zu ersetzen.
- source_word: אַל־תֶּחֱרַשׁ מִמֶּנִּי
  choice: sei nicht taub für mich
  rationale: חרש kann hier Taubheit oder Schweigen bezeichnen. „Taub“ unterscheidet diese Bitte vom folgenden חשה („schweigen“) und erhält so die mögliche Bedeutungsstaffelung.
- source_word: פֶּן־תֶּחֱשֶׁה מִמֶּנִּי
  choice: Sonst schweigst du mir gegenüber
  rationale: פֶּן warnt vor der befürchteten Folge; „sonst“ ist im heutigen Deutsch natürlich. „Mir gegenüber schweigen“ bewahrt die relationale Präposition, ohne anzudeuten, Gott könne grundsätzlich nicht sprechen.
- source_word: וְנִמְשַׁלְתִּי עִם־יֹרְדֵי בוֹר
  choice: und ich werde denen gleich, die in die Grube hinabsteigen
  rationale: Das Niphal von משל bedeutet hier „gleich werden/gleichen“. „Grube“ erhält das konkrete Bild und lässt die mögliche Bedeutung Grab beziehungsweise Totenreich offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von בוֹר
  choice: Grube
  alternative: Grab; Totenreich
  rationale: „Grube“ wahrt das Bild und die Mehrdeutigkeit des Ausdrucks, der im Kontext Tod, Grab oder Totenreich anklingen lassen kann.
- issue: Verhältnis der beiden Verben חרש und חשה
  choice: taub sein / schweigen
  alternative: schweigen / schweigen
  rationale: Die differenzierte Wiedergabe bewahrt die mögliche Spannung zwischen Nicht-Hören und Nicht-Antworten, ohne auszuschließen, dass חרש ebenfalls „schweigen“ bedeuten kann.
translation_notes:
  register: Moderne, würdevolle Gebetssprache mit kurzen poetischen Sätzen. „Jahwe“ bewahrt den Gottesnamen, „mein Fels“ die Metapher. Das etwas markierte „mir gegenüber“ erhält die relationale Nuance von מִמֶּנִּי; die Fußnoten dokumentieren die lexikalische und syntaktische Offenheit.
