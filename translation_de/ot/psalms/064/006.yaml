  text: יַֽחְפְּֽשׂוּ עוֹלֹ֗ת תַּ֭מְנוּ חֵ֣פֶשׂ מְחֻפָּ֑שׂ וְ/קֶ֥רֶב אִ֝֗ישׁ וְ/לֵ֣ב עָמֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/006.yaml
  text: 'They devise injustices: “We have perfected a carefully concealed plot.” And the inward part of each man, and the heart, are deep.'
translation:
  language: de
  text: 'Sie ersinnen Unrecht:


    »Wir haben eine gründliche Suche abgeschlossen.«


    Das Innere des Menschen und das Herz sind tief.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַחְפְּשׂוּ עוֹלֹת
  choice: Sie ersinnen Unrecht
  rationale: Das Verb bezeichnet ein sorgfältiges Suchen oder Auskundschaften; zusammen mit »Unrecht« ist im Kontext das planvolle Ersinnen böser Taten gemeint.
- source_word: תַּמְנוּ חֵפֶשׂ מְחֻפָּשׂ
  choice: Wir haben einen raffiniert verborgenen Plan vollendet
  rationale: תמנו wird als »wir haben vollendet« verstanden; die figura etymologica aus חפש und מחפש betont eine gründlich ausgearbeitete beziehungsweise schwer aufzuspürende Planung. »raffiniert verborgen« bewahrt beide Aspekte idiomatisch.
- source_word: קֶרֶב אִישׁ וְלֵב עָמֹק
  choice: Das Innere eines jeden Menschen und das Herz sind unergründlich
  rationale: קֶרֶב bezeichnet das verborgene Innere des Menschen. עָמֹק heißt wörtlich »tief« und beschreibt hier dessen schwer durchschaubare Tiefe; »unergründlich« gibt den Sinn in natürlichem Deutsch wieder.
theological_decisions:
- issue: Aussage über das verborgene menschliche Innere
  choice: Das Innere eines jeden Menschen und das Herz sind unergründlich
  alternative: Das Innere des Menschen und sein Herz sind tief
  rationale: Die Übersetzung belässt die anthropologische Aussage allgemein und deutet sie weder als besondere Lehre von der Erbsünde noch als absolute Behauptung über Erkenntnis; sie gibt die im Kontext betonte Verborgenheit wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Parallelität bleibt erkennbar; die direkte Rede bildet die selbstsichere Behauptung der Übeltäter ab.
