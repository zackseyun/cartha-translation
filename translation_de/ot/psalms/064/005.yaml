  text: יְחַזְּקוּ לָ֨/מוֹ דָּ֘בָ֤ר רָ֗ע יְֽ֭סַפְּרוּ לִ/טְמ֣וֹן מוֹקְשִׁ֑ים אָ֝מְר֗וּ מִ֣י יִרְאֶה לָּֽ/מוֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/005.yaml
  text: They strengthen for themselves an evil matter[a]; they talk of hiding snares; they say[b], “Who will see them?”
translation:
  language: de
  text: 'Sie bestärken sich in einer bösen Sache[a]; sie besprechen, Fallen zu verbergen; sie sagen: »Wer wird sie sehen?«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann »Wort«, »Sache«, »Angelegenheit« oder »Vorhaben« bedeuten; im Zusammenhang ist auch »ein böses Vorhaben« oder »ein böser Plan« möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Pronomen steht in der 3. Person Plural: »sie«. Es bezieht sich naheliegend auf die verborgenen Fallen. Die Frage wird auch als indirekte Selbstbezeichnung der Verschwörer verstanden: »Wer wird uns sehen?«'
    reason: alternative_reading
lexical_decisions:
- source_word: יְחַזְּקוּ לָמוֹ
  choice: sie bestärken einander
  rationale: Das Piel von חזק bezeichnet ein Festigen oder Bestärken. לָמוֹ ist formal 3. Person Plural; im Zusammenhang der gemeinsam handelnden Verschwörer liegt eine reziproke beziehungsweise reflexive Bedeutung nahe. Die deutsche Wendung ist natürlich und bewahrt den aktiven Sinn.
- source_word: דָּבָר רָע
  choice: ein böses Vorhaben
  rationale: דבר kann Wort, Sache, Angelegenheit oder Vorgang bedeuten. Wegen des anschließenden Beratens über verborgene Fallen gibt »Vorhaben« den kontextuellen Sinn wieder, ohne die Wendung unnötig auf einen ausgearbeiteten Plan festzulegen.
- source_word: יְסַפְּרוּ
  choice: sie beraten
  rationale: Das Piel von ספר bedeutet gewöhnlich erzählen oder berichten. Mit dem folgenden Infinitiv bezeichnet es hier das gemeinsame Besprechen ihres Vorgehens; »beraten« gibt den verschwörerischen Zusammenhang in natürlichem Deutsch wieder.
- source_word: לִטְמוֹן מוֹקְשִׁים
  choice: wie sie Fallen verbergen können
  rationale: טמן bedeutet verbergen oder verstecken, מוֹקְשִׁים bezeichnet Fallen beziehungsweise Schlingen. Die Wiedergabe erhält den lexikalischen Schwerpunkt auf dem Verbergen und klingt im Deutschen idiomatisch.
- source_word: אָמְרוּ
  choice: sie sagen
  rationale: Obwohl die Form formal Perfekt ist, kann sie im poetischen Zusammenhang die dargestellte Rede gegenwärtig einführen. Das Präsens passt zur fortlaufenden Schilderung.
- source_word: מִי יִרְאֶה לָמוֹ
  choice: Wer wird sie sehen?
  rationale: לָמוֹ ist formal ein Pronomen der 3. Person Plural. »Sie« bewahrt diese Form, auch wenn der genaue Bezug im verdichteten poetischen Ausdruck offenbleibt.
theological_decisions:
- issue: Bezug des Pronomens in מִי יִרְאֶה לָמוֹ
  choice: »sie« entsprechend der grammatischen 3. Person Plural
  alternative: »uns« als direkte Selbstbezeichnung der Verschwörer
  rationale: Die Übersetzung folgt der überlieferten hebräischen Form und lässt die mögliche pragmatische Deutung als Selbstbezug in einer Fußnote stehen, statt sie in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus bleibt durch zwei Hauptsätze und die abschließende direkte Rede erkennbar. »Bestärken einander« und »beraten« vermeiden unnatürliche Wörtlichkeit, ohne den gemeinschaftlichen, vorsätzlichen Charakter des bösen Handelns abzuschwächen.
