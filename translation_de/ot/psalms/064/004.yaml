  text: לִ/יר֣וֹת בַּ/מִּסְתָּרִ֣ים תָּ֑ם פִּתְאֹ֥ם יֹ֝רֻ֗/הוּ וְ/לֹ֣א יִירָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/004.yaml
  text: to shoot at the blameless from hiding places[b][a]; suddenly they shoot at him and do not fear.
translation:
  language: de
  text: um aus Verstecken[a] auf den Schuldlosen[b] zu schießen; plötzlich schießen sie auf ihn und fürchten sich nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an verborgenen Orten«; die hebräische Präposition bedeutet wörtlich »in«, doch im Zusammenhang greifen sie aus einer verdeckten Stellung an.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »den Lauteren«; das hebräische Wort kann sittliche Lauterkeit oder Schuldlosigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִירוֹת
  choice: zu schießen
  rationale: Der Infinitiv von ירה bezeichnet in diesem feindseligen Zusammenhang am natürlichsten das Schießen. Da Pfeile im Vers nicht ausdrücklich genannt werden, wird das Objekt nicht ergänzt.
- source_word: בַּמִּסְתָּרִים
  choice: aus Verstecken
  rationale: Das Substantiv bezeichnet verborgene Orte. Obwohl die Präposition wörtlich »in« lautet, gibt »aus« im Deutschen die Position eines Schützen beim Hinterhalt idiomatisch wieder.
- source_word: תָּם
  choice: den Schuldlosen
  rationale: תָּם kann einen Menschen von sittlicher Lauterkeit oder einen Unschuldigen bezeichnen. »Schuldlos« bewahrt hier sowohl den ethischen als auch den forensischen Bedeutungsbereich.
- source_word: פִּתְאֹם
  choice: plötzlich
  rationale: Die übliche adverbiale Wiedergabe vermittelt die Unvermitteltheit des Angriffs.
- source_word: יֹרֻהוּ
  choice: schießen sie auf ihn
  rationale: Das maskuline Singularsuffix nimmt den repräsentativen Singular »den Schuldlosen« wieder auf. »Auf ihn schießen« ist im Deutschen natürlich und vermeidet die Aussage, dass er sicher getroffen wird.
- source_word: וְלֹא יִירָאוּ
  choice: und fürchten sich nicht
  rationale: Die knappe Formulierung bewahrt, dass im Hebräischen kein Gegenstand der Furcht ausdrücklich genannt wird.
