base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/002.yaml
  text: Hide me from the secret counsel of evildoers[b][a], from the tumult of workers of wickedness.
translation:
  language: de
  text: Verbirg mich vor dem geheimen Rat der Übeltäter[a], vor dem Tumult derer, die Unrecht tun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor dem geheimen Plan der Übeltäter“. Das hebräische Wort kann vertraulichen Rat, einen engen Kreis oder einen geheimen Plan bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vor dem Gedränge“ oder „vor dem Getöse derer, die Unrecht tun“. Das hebräische Wort bezeichnet feindselige Erregung, Unruhe oder eine lärmende Menschenmenge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵנִי
  choice: Verbirg mich
  rationale: Der Hifil von סתר mit Suffix der 1. Person Singular bedeutet „mich verbergen“. Im Gebetskontext ist die Form als dringende Bitte natürlich mit „Verbirg mich“ wiederzugeben.
- source_word: מִסּוֹד
  choice: vor den geheimen Plänen
  rationale: סוֹד kann vertrauliche Beratung, einen vertrauten Kreis oder einen geheimen Plan bezeichnen. Im Zusammenhang mit Übeltätern gibt „geheime Pläne“ den feindseligen und verborgenen Charakter idiomatisch wieder, ohne die mögliche Bedeutung „geheime Beratung“ zu verschweigen.
- source_word: מְרֵעִים
  choice: der Übeltäter
  rationale: Das Partizip bezeichnet Menschen, die Böses tun. „Übeltäter“ ist verständlich, prägnant und bewahrt den aktiven Sinn.
- source_word: מֵרִגְשַׁת
  choice: vor dem Aufruhr
  rationale: רִגְשָׁה bezeichnet eine erregte, lärmende oder feindselige Bewegung beziehungsweise Menschenmenge. „Aufruhr“ erfasst die feindliche Unruhe, ohne die Größe der Gruppe näher festzulegen.
- source_word: פֹּעֲלֵי אָוֶן
  choice: derer, die Unrecht tun
  rationale: Die Konstruktion bezeichnet wörtlich Menschen, die אָוֶן wirken oder tun. Die verbale Formulierung ist in modernem Deutsch natürlich und bewahrt den aktiven, möglicherweise gewohnheitsmäßigen Sinn.
