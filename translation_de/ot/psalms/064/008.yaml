base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/008.yaml
  text: They are made to stumble[a]; their own tongue is against them[b]; all who see them shake their heads.
translation:
  language: de
  text: Sie werden zu Fall gebracht[a]; ihre eigene Zunge richtet sich gegen sie. Alle, die sie sehen, schütteln den Kopf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Wortlaut der ersten Vershälfte ist syntaktisch schwierig; insbesondere die Zuordnung der Pronomina ist umstritten. Der Haupttext gibt den im Zusammenhang naheliegenden Sinn wieder, dass die Frevler durch ihre eigene Rede zu Fall kommen.
    reason: alternative_reading
  - marker: b
    text: Das Verb kann auch bedeuten, dass die Zuschauenden den Kopf hin und her bewegen, erschauern oder fortgehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְשִׁילוּהוּ עָלֵימוֹ לְשׁוֹנָם
  choice: Sie werden zu Fall gebracht; ihre eigene Zunge richtet sich gegen sie
  rationale: Die hebräische Syntax und die Zuordnung der Pronomen sind schwierig. Die Wiedergabe folgt dem im Zusammenhang naheliegenden Sinn, dass die Frevler durch ihre eigene Rede zu Fall kommen, ohne die Unsicherheit des Wortlauts zu verschweigen.
- source_word: לְשׁוֹנָם
  choice: ihre eigene Zunge
  rationale: Der kollektive Singular und das konkrete Bild der Zunge bleiben erhalten; „eigene“ verdeutlicht in natürlichem Deutsch den Rückbezug auf die Betroffenen.
- source_word: יִתְנֹדֲדוּ
  choice: schütteln den Kopf
  rationale: נוד kann eine schwankende oder gestische Bewegung, Erschauern oder Fortgehen bezeichnen. Im Zusammenhang mit den Zuschauenden ist eine sichtbare Reaktion des Kopfschüttelns plausibel.
- source_word: כָּל רֹאֵה בָם
  choice: Alle, die sie sehen
  rationale: Die universale Aussage und der Gegenstandsbezug des hebräischen Partizipialausdrucks werden direkt und idiomatisch wiedergegeben.
