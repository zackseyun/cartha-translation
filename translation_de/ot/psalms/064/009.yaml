id: PSA.64.9
reference: Psalms 64:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּֽירְא֗וּ כָּל אָ֫דָ֥ם וַ֭/יַּגִּידוּ פֹּ֥עַל אֱלֹהִ֗ים וּֽ/מַעֲשֵׂ֥/הוּ הִשְׂכִּֽילוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/009.yaml
  text: Then all mankind will fear[a], and they will declare the work of God; they will understand what he has done.
translation:
  language: de
  text: Da werden alle Menschen sich fürchten[a] und Gottes Tun verkünden; sie werden verstehen, was er getan hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ehrfurcht haben“. Das hebräische Verb kann sowohl Furcht als auch ehrfürchtiges Erschrecken ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: Da werden ... sich fürchten
  rationale: ירא bezeichnet Furcht und kann zugleich ehrfürchtiges Erschrecken einschließen. Im poetischen Zusammenhang nach Gottes Gericht gibt „sich fürchten“ diese Spannung wieder; die Abfolge wird zukunftsbezogen formuliert.
- source_word: כָּל אָדָם
  choice: alle Menschen
  rationale: אָדָם steht hier kollektiv für die Menschheit insgesamt, nicht ausschließlich für männliche Personen. „Alle Menschen“ ist im modernen Standarddeutsch natürlich und bedeutungsgetreu.
- source_word: וַיַּגִּידוּ
  choice: verkünden
  rationale: נגד im Hifil bedeutet bekannt machen, erzählen oder verkünden. „Verkünden“ bewahrt den öffentlichen, bezeugenden Ton.
- source_word: פֹּעַל אֱלֹהִים
  choice: Gottes Tun
  rationale: פֹּעַל bezeichnet Werk, Tat oder Wirken. „Gottes Tun“ ist knapp und umfasst hier sein erkennbares Handeln, ohne dieses näher festzulegen.
- source_word: וּמַעֲשֵׂהוּ
  choice: was er getan hat
  rationale: Wörtlich steht „sein Werk/seine Tat“. Die verbale Wiedergabe vermeidet eine schwerfällige Wiederholung und bewahrt den konkreten Bezug auf Gottes Handlung.
- source_word: הִשְׂכִּילוּ
  choice: sie werden verstehen
  rationale: שׂכל im Hifil kann verstehen, Einsicht gewinnen oder klug handeln bedeuten. Mit Gottes Tat als Gegenstand liegt hier das verständige Erfassen seines Handelns nahe.
theological_decisions:
- issue: Kollektive Bedeutung von אָדָם
  choice: alle Menschen
  alternative: jeder Mensch / die ganze Menschheit
  rationale: Der grammatisch singularische Ausdruck כָּל אָדָם ist generisch-kollektiv. Die gewählte Form gibt den umfassenden menschlichen Bezug wieder, ohne eine ausschließlich männliche Bedeutung einzutragen.
- issue: Bedeutung von ירא angesichts von Gottes Gericht
  choice: sich fürchten
  alternative: Ehrfurcht haben / erschrecken
  rationale: Das hebräische Verb lässt sowohl Furcht als auch ehrfürchtiges Erschrecken anklingen. „Sich fürchten“ lässt diese theologische Spannung offen, statt sie auf bloße Angst oder reine Verehrung zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Bewegung von Furcht über öffentliches Verkünden bis zum Verstehen bleibt erhalten; „Gottes Tun“ vermeidet unnötige Abstraktion.
