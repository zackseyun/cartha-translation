id: PSA.64.10
reference: Psalms 64:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִשְׂמַ֬ח צַדִּ֣יק בַּ֭/יהוָה וְ/חָ֣סָה ב֑/וֹ וְ֝/יִתְהַֽלְל֗וּ כָּל יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/010.yaml
  text: The righteous will rejoice in Yahweh and take refuge in him[a], and all the upright in heart will glory.
translation:
  language: de
  text: Der Gerechte wird sich an Jahwe freuen und bei ihm Zuflucht suchen; alle, die aufrichtigen Herzens sind, werden sich rühmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: werden jubeln. Das hebräische Verb kann positives Rühmen, triumphierendes Jubeln oder Frohlocken bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
  choice: wird sich freuen
  rationale: Das Imperfekt bezeichnet im poetischen Zusammenhang die erwartete Folge von Gottes Eingreifen. Die Zukunftsform gibt diesen Ausblick natürlich wieder.
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv steht im maskulinen Singular und bezeichnet repräsentativ den gerechten Menschen, ohne dass im Deutschen zusätzlich „Mann“ eingefügt werden muss.
- source_word: בַּיהוָה
  choice: an Jahwe
  rationale: Die Präposition ב markiert hier den Bezug beziehungsweise Grund der Freude. „Sich an Jahwe freuen“ ist idiomatisches Deutsch und bewahrt den Gottesnamen.
- source_word: וְחָסָה בּוֹ
  choice: und bei ihm Zuflucht suchen
  rationale: חסה bezeichnet das Aufsuchen von Schutz oder Geborgenheit. „Zuflucht suchen“ bewahrt das Bild genauer als das allgemeinere „vertrauen“; die Zukunftsform verbindet die Aussage natürlich mit dem vorangehenden Verb.
- source_word: וְיִתְהַלְלוּ
  choice: werden sich rühmen
  rationale: Der Hitpael von הלל kann positives Rühmen, Jubeln oder triumphierendes Frohlocken ausdrücken. „Sich rühmen“ erhält die Grundbedeutung und lässt den im Hebräischen nicht ausdrücklich genannten Gegenstand des Rühmens offen.
- source_word: כָּל יִשְׁרֵי לֵב
  choice: alle, die aufrichtigen Herzens sind
  rationale: Die Formulierung gibt die hebräische Wendung für Menschen mit gerader, redlicher innerer Haltung würdig und verständlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des abschließenden Rühmens
  choice: Gegenstand des Rühmens bleibt unausgesprochen
  alternative: Sie werden sich Jahwes beziehungsweise seiner Rettung rühmen
  rationale: Der Zusammenhang legt ein positives Rühmen angesichts von Gottes Handeln nahe, doch das Hebräische nennt kein ausdrückliches Objekt. Die Übersetzung fügt daher keines ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Semikolon gliedert die parallelen Aussagen, ohne ihren engen Zusammenhang zu lösen. Die maskuline Singularform „der Gerechte“ folgt dem Hebräischen und hat im Kontext repräsentative Bedeutung.
