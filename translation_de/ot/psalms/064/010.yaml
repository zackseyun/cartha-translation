  source_fidelity: Der Gerechte gibt צַדִּיק angemessen als repräsentativen Singular wieder. „wird sich an Jahwe freuen“ entspricht יִשְׂמַח בַּיהוָה, und „bei ihm Zuflucht suchen“ bewahrt das Schutzbild von וְחָסָה בּוֹ. Der abschließende Satz gibt כָּל יִשְׁרֵי־לֵב und das objektlose וְיִתְהַלְלוּ vollständig wieder, ohne einen Gegenstand des Rühmens hinzuzufügen.
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch. Der Satzbau und das Semikolon gliedern die beiden poetischen Aussagen klar. „Aufrichtigen Herzens“ ist idiomatisch und passend.
  terminology: „Jahwe“ gibt das Tetragramm ausdrücklich wieder. „Gerechte“, „Zuflucht suchen“ und „sich rühmen“ sind für den Kontext treffend. Die Fußnote markiert sinnvoll die mögliche Nuance von Jubeln, ohne die im Grundtext bewahrte Mehrdeutigkeit aufzulösen.
