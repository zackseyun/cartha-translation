base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/001.yaml
  text: Hear[a], O God, my voice in my complaint; preserve my life from the fear of the enemy.
translation:
  language: de
  text: Höre, Gott, meine Stimme in meiner Klage[a]; bewahre mein Leben vor der Furcht vor dem Feind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in meinem Nachsinnen“ oder „in meinem Grübeln“. Das hebräische Wort kann sowohl inneres Nachdenken als auch eine ausgesprochene Klage bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Höre
  rationale: Der Imperativ richtet sich unmittelbar an Gott. „Höre“ entspricht dem hebräischen Gebetsstil knapp und würdig.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv steht als direkte Anrede; im modernen Deutschen ist „Gott“ ohne zusätzliches „o“ natürlich und würdevoll.
- source_word: קוֹלִי
  choice: meine Stimme
  rationale: Die konkrete hebräische Wendung wird bewahrt und nicht zu „mich“ oder „mein Gebet“ verallgemeinert.
- source_word: בְשִׂיחִי
  choice: wenn ich klage
  rationale: שׂיח kann Klage, Sinnen oder Nachdenken bezeichnen. Im Zusammenhang der Bedrohung liegt die Klage nahe; die verbale Formulierung ist im Deutschen natürlicher als „in meiner Klage“.
- source_word: מִפַּחַד
  choice: vor dem Schrecken
  rationale: פּחד bezeichnet Furcht, Schrecken oder Grauen. „Vor dem Schrecken“ gibt die ernste Bedrohung wieder und verbindet sich idiomatisch mit „bewahre“.
- source_word: אוֹיֵב
  choice: des Feindes
  rationale: Der bestimmte Singular des hebräischen Textes bleibt erhalten; er kann zugleich generisch oder kollektiv verstanden werden.
- source_word: תִּצֹּר
  choice: bewahre
  rationale: Das Verb נצר bedeutet bewachen, behüten oder bewahren. „Bewahre“ passt natürlich zu „mein Leben“ und zur Gebetssprache.
- source_word: חַיָּי
  choice: mein Leben
  rationale: Der hebräische Ausdruck bezeichnet hier das Leben des Beters; der deutsche Singular ist idiomatisch und vermeidet die interpretierende Wiedergabe „Seele“.
theological_decisions:
- issue: Bedeutung von בְשִׂיחִי im Klagepsalm
  choice: wenn ich klage
  alternative: bei meinem Sinnen / wenn ich nachdenke
  rationale: Der feindliche Bedrohungskontext begünstigt die Bedeutung „klagen“, doch das Wort kann auch inneres Sinnen bezeichnen. Diese echte Mehrdeutigkeit wird in der Fußnote offengehalten.
- issue: Bezug von מִפַּחַד אוֹיֵב
  choice: vor dem Schrecken des Feindes
  alternative: vor der Furcht vor dem Feind
  rationale: Die Genitivverbindung kann den vom Feind ausgehenden Schrecken oder die Furcht des Beters angesichts des Feindes ausdrücken. Die gewählte Fassung erhält die knappe hebräische Verbindung, ohne den Bezug ausdrücklich festzulegen.
translation_notes:
  register: Moderne, würdige Gebetssprache mit enger Bindung an die hebräische Bildlichkeit. Die Satzstellung ist für heutiges Standarddeutsch natürlich; die lexikalische Mehrdeutigkeit von שׂיח wird durch eine Fußnote bewahrt.
