  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁנְנוּ
  choice: schärfen
  rationale: Gibt das Bild des Schärfens einer Waffe direkt und natürlich wieder.
- source_word: לְשׁוֹנָם
  choice: ihre Zunge
  rationale: Bewahrt den singularischen Kollektivgebrauch des Hebräischen und das Bild der Zunge als Schwert.
- source_word: דָּרְכוּ
  choice: spannen
  rationale: Das Verb bezeichnet hier das Spannen beziehungsweise Bereitmachen des Bogens; zusammen mit „ihren Pfeil“ ist „spannen“ im Deutschen die natürlichste knappe Wiedergabe.
- source_word: חִצָּם
  choice: ihren Pfeil
  rationale: Folgt dem singularischen Bild des hebräischen Textes.
- source_word: דָּבָר מָר
  choice: ein bitteres Wort
  rationale: Bewahrt sowohl die Waffenmetapher als auch die ausdrückliche Identifikation des Pfeils mit verletzender Rede.
theological_decisions:
- issue: Verhältnis von „Pfeil“ und „bitterem Wort“
  choice: Apposition mit Gedankenstrichen
  alternative: „mit bitteren Worten“ als adverbiale Auflösung
  rationale: 'Die knappe, spannungsvolle hebräische Bildsprache bleibt erhalten: Der Pfeil wird als bitteres Wort bezeichnet, ohne die Metapher erklärend aufzulösen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Waffenbilder werden knapp bewahrt; der Vers bleibt als anschließender Relativsatz formuliert.
