lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: Die Wendung bezeichnet in Psalmüberschriften wahrscheinlich die für die musikalische Aufführung verantwortliche Person. „Musikalischer Leiter“ ist im heutigen Deutsch klar und legt sich weniger eng auf einen Chor fest als „Chorleiter“.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: מִזְמוֹר ist die übliche Gattungsbezeichnung eines musikalisch vorzutragenden Psalms; „Psalm“ ist dafür die etablierte und treffende deutsche Wiedergabe.
- source_word: לְדָוִד
  choice: Davids
  rationale: Die knappe Genitivform entspricht einer natürlichen deutschen Psalmüberschrift. Die Bandbreite der hebräischen לְ-Verbindung – Urheberschaft, Zugehörigkeit oder Widmung – wird in der Fußnote ausdrücklich offengehalten.
theological_decisions:
- issue: Bedeutung der davidischen Zuordnung in der Überschrift
  choice: Davids
  alternative: von David; für David
  rationale: Das hebräische לְדָוִד kann Urheberschaft, Zugehörigkeit oder Widmung bezeichnen. Die Übersetzung folgt der traditionellen knappen Überschriftsform, ohne die weitergehende Frage durch die Fußnote einseitig zu entscheiden.
translation_notes:
  register: Moderne, würdige Überschrift in knapper Psalmform. „Musikalischer Leiter“ ist verständlich und vermeidet die nicht ausdrücklich im hebräischen Ausdruck enthaltene Festlegung auf einen Chor.
