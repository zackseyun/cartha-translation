  text: Für den musikalischen Leiter. Ein Psalm Davids[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „von David“ oder „für David“; die hebräische Form kann Urheberschaft, Zugehörigkeit oder Widmung ausdrücken.
