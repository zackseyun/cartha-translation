translation:
  language: de
  text: Doch Gott schießt einen Pfeil auf sie ab[a]; plötzlich sind sie verwundet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formeller: „Doch Gott schoss einen Pfeil auf sie ab; plötzlich trafen sie Wunden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרֵם
  choice: schießt … auf sie ab
  rationale: Die Hifil-Form von ירה mit einem Objektsuffix der 3. Person Plural stellt Gott als den dar, der auf sie schießt. Das Präsens gibt die lebendige poetische Erzählweise natürlich wieder; die formalere Vergangenheitsform steht in der Fußnote.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Hier bezeichnet אֱלֹהִים den einen Gott und ist entsprechend im Singular wiederzugeben.
- source_word: חֵץ
  choice: einen Pfeil
  rationale: Die Grundbedeutung ist „Pfeil“. Der unbestimmte Artikel entspricht in diesem Zusammenhang natürlichem Deutsch.
- source_word: פִּתְאֹם
  choice: plötzlich
  rationale: Das Adverb bezeichnet das unvermittelte, unerwartete Eintreten des göttlichen Gerichts.
- source_word: הָיוּ
  choice: sind
  rationale: Die Form von היה beschreibt hier knapp den eingetretenen Zustand beziehungsweise das Ergebnis des Schusses.
- source_word: מַכּוֹתָם
  choice: sie sind verwundet
  rationale: Das Substantiv מַכָּה mit Suffix bedeutet formal „ihre Wunden/Schläge“. Die prädikative Wiedergabe formuliert das Ergebnis im Deutschen natürlich, ohne das Bild abzuschwächen.
theological_decisions:
- issue: Darstellung des göttlichen Gerichts in poetischer Bildsprache
  choice: Gott wird ausdrücklich als der Handelnde dargestellt, der die Frevler mit einem Pfeil trifft.
  alternative: Das Bild lediglich als unpersönliche oder providenzielle Umkehrung der Lage wiederzugeben.
  rationale: Der hebräische Text nennt Gott als handelndes Subjekt. Die Übersetzung bewahrt diese Aussage und die gewaltsame Gerichtsmetapher, ohne sie dogmatisch auszubauen.
translation_notes:
  register: Knappe, bildhafte und würdige Psalmsprache in modernem Standarddeutsch. „Einen Pfeil auf sie abschießen“ ist idiomatisch und bewahrt Gottes aktive Rolle; die Fußnote zeigt die formellere Zeitform und die substantivische Wendung „ihre Wunden“.
