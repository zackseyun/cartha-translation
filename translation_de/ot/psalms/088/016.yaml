lexical_decisions:
- source_word: עָלַי עָבְרוּ
  choice: ist über mich hinweggegangen
  rationale: Die Verbindung bezeichnet eine Bewegung über den Beter hinweg. Die Wiedergabe bleibt nahe am hebräischen Bild; wegen des als Einheit verstandenen abstrakten Plurals steht das Verb im Deutschen im Singular.
- source_word: חֲרוֹנֶיךָ
  choice: dein glühender Zorn
  rationale: חָרוֹן bezeichnet heftigen, bildlich brennenden Zorn. „Glühender Zorn“ bewahrt das Hitzebild und klingt zugleich natürlich und würdig.
- source_word: בִּעוּתֶיךָ
  choice: deine Schrecken
  rationale: Das Substantiv bezeichnet Schrecken beziehungsweise angsterregende Dinge. „Schrecken“ erhält die mögliche Spannung zwischen erlebtem Entsetzen und dessen Ursachen.
- source_word: צִמְּתוּתֻנִי
  choice: haben mich vernichtet
  rationale: Die Form von צמת drückt Vernichten oder Abschneiden aus. „Vernichtet“ gibt die äußerste Sprache der Klage klar wieder, ohne sie abzuschwächen.
theological_decisions:
- issue: Gott als Urheber des Zorns und der Schrecken
  choice: Die direkten Possessivformen „dein/deine“ bleiben erhalten.
  alternative: Eine abschwächende Formulierung wie „Zorn und Schrecken kamen über mich“.
  rationale: Der hebräische Text schreibt Zorn und Schrecken ausdrücklich Gott zu. Diese theologische Spannung darf nicht aufgelöst oder gemildert werden.
translation_notes:
  register: Moderne, verständliche und zugleich poetisch-würdige Sprache. „Glühender Zorn“ bewahrt das hebräische Hitzebild; „hinweggegangen“ hält sich enger an die Bewegungsmetapher als eine rein dynamische Wiedergabe.
