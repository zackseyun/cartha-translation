  text: Dein glühender Zorn ist über mich hinweggegangen[a]; deine Schrecken haben mich vernichtet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist über mich hinweggefegt“. Das hebräische Verb bedeutet wörtlich „hinübergehen“; im Zusammenhang kann es eine überwältigende Bewegung ausdrücken.'
