source:
  edition: WLC
  text: בַּ/מֵּתִ֗ים חָ֫פְשִׁ֥י כְּמ֤וֹ חֲלָלִ֨ים שֹׁ֥כְבֵי קֶ֗בֶר אֲשֶׁ֤ר לֹ֣א זְכַרְתָּ֣/ם ע֑וֹד וְ֝/הֵ֗מָּה מִ/יָּדְ/ךָ֥ נִגְזָֽרוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/005.yaml
  text: I am set free among the dead[a], like the slain who lie in the grave, whom you remember no more[c][b], and they are cut off from your hand.
translation:
  language: de
  text: Unter den Toten bin ich frei[a], wie die Erschlagenen, die im Grab liegen, deren du nicht mehr gedenkst[b]; und sie sind von deiner Hand abgeschnitten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „frei unter den Toten“. Das hebräische Wort bedeutet „frei“ oder „freigelassen“. Hier klingt es wohl bitter und paradox: Der Beter sieht sich bereits aus dem Bereich und den Bindungen der Lebenden entlassen.'
    reason: lexical_alternative
  - marker: b
    text: „Gedenken“ meint hier wahrscheinlich mehr als bloßes Erinnern; es kann einschließen, dass Gott sich jemandem zuwendet und für ihn handelt.
    reason: lexical_alternative
  - marker: c
    text: '„Hand“ ist ein hebräisches Bild für Macht, Zugriff oder Fürsorge. Gemeint sein kann daher auch: „von deiner Macht“ oder „von deiner Fürsorge getrennt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמֵּתִים
  choice: unter den Toten
  rationale: Die Präposition ב bezeichnet hier den Bereich beziehungsweise die Gemeinschaft, zu der der Beter sich rechnet. „Unter den Toten“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: חָפְשִׁי
  choice: frei
  rationale: Das Adjektiv bedeutet „frei, freigelassen“. Die paradoxe, wohl bittere Aussage bleibt erhalten, statt sie deutend mit „verlassen“ oder „ausgestoßen“ wiederzugeben.
- source_word: כְּמוֹ
  choice: wie
  rationale: Die gewöhnliche deutsche Vergleichspartikel entspricht dem hebräischen Ausdruck.
- source_word: חֲלָלִים
  choice: die Erschlagenen
  rationale: Das Substantiv bezeichnet besonders in poetischen Texten gewaltsam Getötete. „Die Erschlagenen“ bewahrt diesen Bedeutungsaspekt.
- source_word: שֹׁכְבֵי קֶבֶר
  choice: die im Grab liegen
  rationale: Die partizipiale Konstruktion beschreibt den fortdauernden Zustand der Erschlagenen und wird in natürlichem Deutsch als Relativsatz wiedergegeben.
- source_word: אֲשֶׁר לֹא זְכַרְתָּם עוֹד
  choice: deren du nicht mehr gedenkst
  rationale: „Gedenken“ bewahrt die Grundbedeutung von זכר und lässt zugleich den im Klagekontext möglichen Beziehungs- und Handlungsaspekt offen.
- source_word: וְהֵמָּה
  choice: und sie
  rationale: Die koordinierende Konjunktion und das betonte Pronomen werden direkt wiedergegeben, ohne einen im Hebräischen nicht ausdrücklich markierten Kausalsinn einzuführen.
- source_word: מִיָּדְךָ
  choice: von deiner Hand
  rationale: Das Bild der Hand bleibt erhalten und kann Gottes Macht, Zugriff oder Fürsorge umfassen, ohne auf nur einen dieser Aspekte verengt zu werden.
- source_word: נִגְזָרוּ
  choice: sind abgeschnitten
  rationale: Der Niphal von גזר bezeichnet ein Abgeschnitten- oder Abgetrenntsein. Die deutsche Formulierung erhält das schroffe Trennungsbild.
theological_decisions:
- issue: Gottes Gedenken an die Toten
  choice: deren du nicht mehr gedenkst
  alternative: um die du dich nicht mehr kümmerst
  rationale: Die Wiedergabe wahrt die Sprache der Klage und ihre theologische Spannung. Sie behauptet weder einen Verlust göttlichen Wissens noch beschränkt sie „Gedenken“ auf bloße geistige Erinnerung.
- issue: Die Freiheit unter den Toten
  choice: unter den Toten bin ich frei
  alternative: unter den Toten bin ich verlassen
  rationale: Das paradoxe Freiheitsbild des Hebräischen bleibt stehen. „Verlassen“ würde die Aussage bereits auslegen und eine stärkere Behauptung über göttliche Preisgabe eintragen.
- issue: Von Gottes Hand abgeschnitten
  choice: von deiner Hand abgeschnitten
  alternative: deiner Macht entzogen
  rationale: Die konkrete Metapher bleibt erhalten und wahrt die Spannung, ob vor allem Gottes Macht, sein Zugriff oder seine Fürsorge im Blick ist.
translation_notes:
  register: Moderne, würdige Psalmsprache. Die leicht gehobene Wendung „deren du gedenkst“ erhält den poetischen Klang und den relationalen Bedeutungsraum des hebräischen Verbs. Das paradoxe „frei“ sowie die Bilder von Grab und Hand werden bewusst nicht geglättet.
