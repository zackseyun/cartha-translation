id: PSA.88.14
reference: Psalms 88:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/מָ֣ה יְ֭הוָה תִּזְנַ֣ח נַפְשִׁ֑/י תַּסְתִּ֖יר פָּנֶ֣י/ךָ מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/014.yaml
  text: Why[a], O Yahweh[b], do you reject my soul? Why do you hide your face from me?
translation:
  language: de
  text: Warum, Jahwe, verwirfst du mich[a]? Warum verbirgst du dein Angesicht vor mir?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »meine Seele«. Das hebräische Wort kann hier auch »mich« oder »mein Leben« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Das Angesicht zu verbergen ist ein hebräisches Bild dafür, jemandem Gegenwart, Zuwendung oder Aufmerksamkeit zu entziehen.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָה
  choice: Warum
  rationale: Die direkte Frage nach dem Grund bewahrt die eindringliche Sprache der Klage und ist im Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: תִּזְנַח
  choice: verwirfst
  rationale: Das Verb bezeichnet Zurückweisen oder Verstoßen. »Verwerfen« trifft den Sinn prägnant und passt zum würdevollen Register des Psalms.
- source_word: נַפְשִׁי
  choice: mich
  rationale: Hebräisch נֶפֶשׁ bezeichnet hier die Person selbst; »mich« ist natürliches Deutsch. Die wörtlichere Wiedergabe »meine Seele« bleibt in einer Fußnote sichtbar.
- source_word: תַּסְתִּיר
  choice: verbirgst
  rationale: Das Verb bedeutet »verbergen«; diese Wahl erhält zusammen mit »Angesicht« das hebräische Bild.
- source_word: פָּנֶיךָ
  choice: dein Angesicht
  rationale: Die konkrete Wendung wird bewahrt. »Angesicht« klingt in poetischer Gebetssprache würdevoll, ohne die Bedeutung vorschnell als Gegenwart oder Zuwendung aufzulösen.
- source_word: מִמֶּנִּי
  choice: vor mir
  rationale: In Verbindung mit »das Angesicht verbergen« ist »vor mir« die natürliche deutsche Fügung und entspricht dem hebräischen מִן.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. »Jahwe« bewahrt ihn erkennbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von »dein Angesicht verbergen«
  choice: Das Bild im Haupttext bewahren
  alternative: deine Gegenwart oder Zuwendung entziehen
  rationale: Die hebräische Wendung kann den Entzug von Gegenwart, Gunst oder Aufmerksamkeit ausdrücken. Die bildhafte Form bewahrt diese Bedeutungsbreite; eine Fußnote erläutert sie, ohne sie dogmatisch einzuengen.
translation_notes:
  register: Moderne, klare und zugleich würdevolle Psalmsprache. »Mich« vermeidet ein im heutigen Deutsch möglicherweise missverständliches Körper-Seele-Schema; »Angesicht« erhält dagegen bewusst das zentrale poetische Bild.
