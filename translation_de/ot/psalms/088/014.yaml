  source_fidelity: Der Text gibt לָמָה, den Gottesnamen יהוה, תזנח sowie die Wendung „dein Angesicht vor mir verbergen“ sinngenau wieder. „Mich“ ist für נפשי in diesem Kontext eine idiomatische und semantisch zulässige Wiedergabe; die wörtlichere Möglichkeit ist angemessen vermerkt. Die Wiederholung von „Warum“ im zweiten deutschen Fragesatz macht die im hebräischen Parallelismus fortwirkende Begründungsfrage klar, ohne den Sinn zu verändern.
  naturalness: Modernes, klares und zugleich dem Klageton angemessen würdiges Deutsch. „Jahwe“, „verwirfst“, „Angesicht“ und „vor mir“ bilden eine natürliche, poetisch gehobene Psalmsprache.
  terminology: „Jahwe“ gibt den Tetragrammaton als Eigenname konsistent wieder. „Angesicht“ bewahrt das hebräische Bild, und die Fußnote erläutert dessen idiomatische Funktion, ohne die Bildsprache im Haupttext auf eine einzelne Deutung zu reduzieren.
