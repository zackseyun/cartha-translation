  text: May my prayer come before you[b][a]; incline your ear to my cry.
translation:
  language: de
  text: Lass mein Gebet vor dich kommen[a]; neige dein Ohr meinem Klageschrei zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor dein Angesicht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא
  choice: Lass … kommen
  rationale: Das Qal-Imperfekt der 3. Person Feminin Singular stimmt mit תְּפִלָּתִי überein und hat im Gebetskontext auffordernd-wünschenden Sinn. „Lass … kommen“ gibt diese Bitte im Deutschen natürlich wieder.
- source_word: לְפָנֶיךָ
  choice: vor dich
  rationale: Die Wendung bedeutet wörtlich „vor dein Angesicht“ und bezeichnet das Gelangen in Gottes Gegenwart. „Vor dich“ bewahrt das Bild knapp und idiomatisch.
- source_word: תְּפִלָּתִי
  choice: mein Gebet
  rationale: תְּפִלָּה ist die übliche Bezeichnung für ein Gebet; eine Wiedergabe als „Flehen“ wäre enger und emotional stärker.
- source_word: הַטֵּה
  choice: neige … zu
  rationale: Der Hifil-Imperativ von נטה bezeichnet hier das Neigen oder Zuwenden des Ohres als Bild aufmerksamen Hörens. Die deutsche Verbindung „jemandem das Ohr zuneigen“ ist würdig und verständlich.
- source_word: אָזְנְךָ
  choice: dein Ohr
  rationale: Der Singular und das konkrete hebräische Bild werden beibehalten.
- source_word: לְרִנָּתִי
  choice: meinem Klageschrei
  rationale: רִנָּה kann einen lauten, durchdringenden Ruf bezeichnen. Im Kontext von Psalm 88 handelt es sich um einen verzweifelten Klageruf; „Klageschrei“ vermeidet die andernorts mögliche freudige Färbung.
