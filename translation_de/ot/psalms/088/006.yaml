base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/006.yaml
  text: You have put me in the lowest pit[a], in dark places, in the depths.
translation:
  language: de
  text: 'Du hast mich in die tiefste Grube gelegt,

    in finstere Orte, in die Tiefen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁתַּנִי
  choice: Du hast mich … gelegt
  rationale: Die Form bezeichnet ein Setzen, Legen oder Platzieren mit Gott als angeredetem Handelnden und dem Beter als Objekt. „gelegt“ ist im Deutschen natürlich und bewahrt die direkte Zuschreibung.
- source_word: בְּבוֹר
  choice: in die … Grube
  rationale: בּוֹר kann eine Grube, Zisterne oder ein gefängnisartiges Erdloch bezeichnen. „Grube“ erhält das Todesnähe- und Scheolbild, ohne es eindeutig als „Grab“ auszulegen.
- source_word: תַּחְתִּיּוֹת
  choice: tiefste
  rationale: Das Wort bezeichnet die untersten oder tiefsten Bereiche. Die attributive Wiedergabe „die tiefste Grube“ ist idiomatisch und erhält den Gedanken äußerster Tiefe.
- source_word: בְּמַחֲשַׁכִּים
  choice: an finstere Orte
  rationale: Der hebräische Plural bezeichnet Finsternisse beziehungsweise finstere Orte. „an finstere Orte“ bewahrt die räumliche und plurale Bildsprache.
- source_word: בִּמְצֹלוֹת
  choice: in Abgründe
  rationale: Der Plural bezeichnet Tiefen, besonders tiefe Gewässer oder abgründige Orte. „Abgründe“ gibt die Mehrzahl wieder und erhält das Bild überwältigender Tiefe.
theological_decisions:
- issue: Gottes Handeln in der Klage
  choice: Die direkte Anrede „Du hast mich … gelegt“ bleibt erhalten.
  alternative: Eine unpersönliche Formulierung, die Gottes Handeln abschwächt.
  rationale: Der hebräische Text benennt Gott unmittelbar als denjenigen, der den Beter in diese Lage versetzt hat. Die Übersetzung wahrt diese theologische Spannung der Klage.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die drei Ortsangaben bleiben als steigernde Parallelglieder erhalten; der Zeilenumbruch unterstützt den Psalmton.
