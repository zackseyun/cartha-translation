  terminology: „Grube“ vermeidet die nicht zwingende Festlegung auf Grab oder Totenreich. „finstere Orte“ erhält die räumlich-plurale Bildsprache von מַחֲשַׁכִּים. „Tiefen“ gibt מְצֹלוֹת neutral wieder, ohne die Metapher auf „Abgründe“ einzuengen.
