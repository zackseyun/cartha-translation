  yaml_path: translation/ot/psalms/088/017.yaml
  text: They surrounded me like water all day long[a]; together they closed in on me.
translation:
  language: de
  text: Sie umgaben mich wie Wasser den ganzen Tag; zusammen umringten sie mich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie umringten mich wie Wasser den ganzen Tag; zusammen umgaben sie mich.“ So tritt die enge Bedeutungsparallele der beiden hebräischen Verben stärker hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַבּוּנִי
  choice: sie umgaben mich
  rationale: Das Qal Perfekt 3. Person Plural mit Suffix der 1. Person Singular bezeichnet das feindliche Umringen des Beters. „Sie umgaben mich“ ist natürlich und bewahrt das Bild.
- source_word: כַמַּיִם
  choice: wie Wasser
  rationale: Das Präfix כ kennzeichnet den Vergleich. Der deutsche Singular „Wasser“ gibt das Bild einer überwältigenden, ringsum eindringenden Flut idiomatisch wieder.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Die Zeitangabe bezeichnet die ununterbrochene Dauer über den Tag hinweg; „den ganzen Tag“ ist gegenwärtiges, klares Deutsch.
- source_word: הִקִּיפוּ
  choice: sie schlossen mich ein
  rationale: Das Verb steht parallel zu סַבּוּנִי und verstärkt das Bild vollständiger Umzingelung. „Schlossen mich ein“ vermeidet eine hölzerne Wiederholung, ohne den enger werdenden Ring auszudeuten.
- source_word: עָלַי
  choice: mich
  rationale: Die auf den Sprecher gerichtete Bewegung, die durch עַל ausgedrückt wird, ist im Deutschen bereits idiomatisch in „jemanden einschließen“ enthalten; eine wörtliche Ergänzung wäre unnatürlich.
- source_word: יָחַד
  choice: gemeinsam
  rationale: Das Adverb beschreibt das vereinte Handeln der bedrängenden Mächte. „Gemeinsam“ bewahrt diesen kollektiven Sinn.
