  naturalness: „Satt von Leiden“ ist verständlich und als poetisch-gehobene Metapher möglich, wirkt im modernen Standarddeutsch jedoch etwas weniger idiomatisch als „voller Leiden“. Die zweite Satzhälfte wird mit „mein Leben naht dem Scheol“ klarer und natürlicher, ohne die hebräische Bildlichkeit abzuschwächen.
