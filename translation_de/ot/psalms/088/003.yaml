source:
  edition: WLC
  text: כִּֽי שָֽׂבְעָ֣ה בְ/רָע֣וֹת נַפְשִׁ֑/י וְ/חַיַּ֗/י לִ/שְׁא֥וֹל הִגִּֽיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/003.yaml
  text: For my soul is full of troubles[a], and my life draws near to Sheol.
translation:
  language: de
  text: Denn meine Seele ist voller Leiden, und mein Leben naht dem Scheol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Grab“ oder „dem Bereich der Toten“. Der hebräische Ausdruck lautet „Scheol“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die Klage im Zusammenhang ein und bewahrt die kausale Funktion.
- source_word: שָׂבְעָה בְרָעוֹת
  choice: ist satt von Leiden
  rationale: Das Verb bezeichnet ein Erfüllt- oder Gesättigtsein. „Satt von“ bewahrt das kräftige Bild des Hebräischen; „Leiden“ gibt רָעוֹת hier als widerfahrenes Unheil statt als moralisch Böses wieder.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Bewahrt die lexikalische und poetische Unterscheidung zu חַיַּי („mein Leben“) im zweiten Halbvers.
- source_word: וְחַיַּי
  choice: und mein Leben
  rationale: חַיִּים ist formal ein Plural, bezeichnet hier aber idiomatisch das Leben als Einheit.
- source_word: לִשְׁאוֹל
  choice: dem Scheol
  rationale: Die Transliteration bewahrt die alttestamentliche Vorstellung vom Totenreich, ohne sie vorschnell auf „Grab“ oder eine spätere Lehrkategorie zu verengen.
- source_word: הִגִּיעוּ
  choice: ist nahegekommen
  rationale: Das Verb bedeutet „erreichen, gelangen“. In Verbindung mit dem Scheol bezeichnet es hier die bedrohliche Annäherung des Lebens an den Tod und bleibt näher an der vollendeten hebräischen Verbform als ein bloßes Präsens.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: das Grab; das Totenreich
  rationale: „Scheol“ erhält den quellensprachlichen Begriff und seine mögliche Bedeutungsbreite, ohne ihn mit einer engeren oder späteren Vorstellung gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wendung „satt von Leiden“ ist bewusst bildhaft und leicht gehoben; sie bewahrt die Intensität des hebräischen Ausdrucks. Der Fußnotenmarker steht unmittelbar nach der Aussage über den Scheol.
