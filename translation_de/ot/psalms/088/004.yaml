source:
  edition: WLC
  text: נֶ֭חְשַׁבְתִּי עִם י֣וֹרְדֵי ב֑וֹר הָ֝יִ֗יתִי כְּ/גֶ֣בֶר אֵֽין אֱיָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/004.yaml
  text: I am counted among those going down to the pit[b][a]; I have become like a man without strength.
translation:
  language: de
  text: Ich werde zu denen gerechnet, die in die Grube hinabsteigen; ich bin wie ein Mann ohne Kraft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Mann“ kann hier einen kräftigen Mann meinen; dadurch entsteht möglicherweise der zugespitzte Sinn: ein starker Mann, dem jede Kraft fehlt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶחְשַׁבְתִּי
  choice: Ich werde … gerechnet
  rationale: Das Nifal von חשׁב bezeichnet, dass jemand einer Gruppe zugerechnet oder zu ihr gezählt wird. Das deutsche Präsens gibt den gegenwärtig erlebten Zustand der Klage natürlich wieder, obwohl die hebräische Form ein Perfekt ist.
- source_word: עִם
  choice: zu denen
  rationale: Wörtlich bedeutet עִם „mit“. In Verbindung mit „gerechnet werden“ ist „zu denen“ im Deutschen idiomatisch und bewahrt den Gedanken der Zugehörigkeit zu einer Gruppe.
- source_word: יוֹרְדֵי בוֹר
  choice: die in die Grube hinabsteigen
  rationale: Das Partizip bezeichnet Menschen, die hinabsteigen; „in die Grube“ erhält das hebräische Todesbild, ohne es auf ein gewöhnliches Grab einzuengen.
- source_word: בּוֹר
  choice: die Grube
  rationale: בּוֹר kann eine Grube oder Zisterne bezeichnen und dient poetisch als Bild für Tod, Grab oder Totenreich. „Grube“ bewahrt die konkrete Metapher.
- source_word: הָיִיתִי
  choice: ich bin
  rationale: Das Perfekt von היה beschreibt hier den eingetretenen und gegenwärtig bestehenden Zustand. Das schlichte „ich bin“ klingt im Deutschen natürlich und bewahrt die knappe Parallelstruktur.
- source_word: כְּגֶבֶר
  choice: wie ein Mann
  rationale: גֶּבֶר bezeichnet einen Mann und kann Kraft oder Mannhaftigkeit mitschwingen lassen. „Mann“ lässt diese mögliche Ironie im Zusammenhang mit „ohne Kraft“ bestehen.
- source_word: אֵין אֱיָל
  choice: ohne Kraft
  rationale: אֱיָל bezeichnet Kraft oder Stärke. „Ohne Kraft“ gibt die harte, knappe Aussage transparent wieder.
theological_decisions:
- issue: Bedeutungsumfang der „Grube“
  choice: Die Todesmetapher bleibt im Haupttext als „Grube“ erhalten.
  alternative: „Grab“ oder „Totenreich“
  rationale: Der Kontext weist auf Tod und Todesnähe, doch der hebräische Bildausdruck legt nicht eindeutig eine einzige sachliche Entsprechung fest. Daher wird er nicht theologisch vereindeutigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. Die Todesmetapher „Grube“ und die mögliche Ironie von גֶּבֶר bleiben erhalten; erklärungsbedürftig ist nur dessen Kraftkonnotation, die deshalb in einer Fußnote genannt wird.
