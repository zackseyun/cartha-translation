  source_fidelity: Die Übersetzung gibt נֶחְשַׁבְתִּי angemessen als gegenwärtig erlebtes Zugerechnetwerden wieder und wahrt mit „zu denen“ die einschließende Bedeutung von עִם. „die in die Grube hinabsteigen“ bildet יוֹרְדֵי בוֹר unmittelbar und poetisch ab, ohne die Todesmetapher zu einem eindeutig bestimmten „Grab“ oder „Totenreich“ zu verengen. „ich bin wie ein Mann ohne Kraft“ entspricht dem zweiten Halbvers knapp und treffend.
