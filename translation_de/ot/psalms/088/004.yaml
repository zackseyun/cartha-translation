  terminology: „Grube“ bewahrt das hebräische Todesbild. „Mann“ für גֶּבֶר ist die neutrale Hauptbedeutung, während „ohne Kraft“ אֵין אֱיָל klar wiedergibt. Die Fußnote weist zurückhaltend auf die mögliche Stärke-Konnotation von גֶּבֶר hin, ohne sie in den Haupttext einzutragen oder theologisch auszulegen.
