base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/000.yaml
  text: 'A song. A psalm of the sons of Korah. For the choirmaster: according to Mahalath Leannoth[a]. A Maskil[b] of Heman the Ezrahite.'
translation:
  language: de
  text: Ein Lied. Ein Psalm der Korachiter. Für den Chorleiter. Nach »Machalat Leannot«.[a] Ein Maskil[b] von Heman, dem Esrachiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung von »Machalat Leannot« ist unsicher. Gemeint sein könnte eine Melodie oder Vortragsweise; vorgeschlagen wurden auch »nach Machalat, zum Wechselgesang« und »nach Machalat, über Bedrängnis«.
    reason: lexical_alternative
  - marker: b
    text: »Maskil« ist ein Fachbegriff in Psalmüberschriften. Häufig versteht man darunter ein Lehr- oder Betrachtungslied.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Ein Lied
  rationale: Die schlichte, etablierte deutsche Gattungsbezeichnung entspricht dem hebräischen Ausdruck.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Die geläufige Bezeichnung gibt den musikalischen Gattungsbegriff in einer Psalmüberschrift angemessen wieder.
- source_word: לִבְנֵי קֹרַח
  choice: der Korachiter
  rationale: Die Wendung bezeichnet die mit Korach verbundene Gruppe; »der Korachiter« ist im Deutschen knapp und natürlich, ohne die genaue Art der Zuordnung ausdrücklich festzulegen.
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Eine verständliche und etablierte Wiedergabe der musikalischen Leitungsangabe, ohne deren Funktion unnötig auszuweiten.
- source_word: עַל מָחֲלַת לְעַנּוֹת
  choice: Nach »Machalat Leannot«
  rationale: »Nach« eignet sich für eine Melodie- oder Vortragsangabe; die unsicheren Fachausdrücke werden transliteriert und in einer Fußnote erläutert.
- source_word: מַשְׂכִּיל
  choice: Ein Maskil
  rationale: Da Bedeutung und Funktion des technischen Begriffs nicht sicher sind, bewahrt die Transliteration die Offenheit des Ausgangstextes.
- source_word: לְהֵימָן
  choice: Hemans
  rationale: Der Genitiv ist in einer deutschen Überschrift idiomatisch und lässt die genauere Beziehung — etwa Urheberschaft oder Zuordnung — offen.
- source_word: הָאֶזְרָחִי
  choice: des Esrachiters
  rationale: Die traditionelle deutsche Namensform gibt die Bezeichnung als Herkunfts- oder Gruppenzuordnung wieder, ohne sie mit »Serachiter« zu identifizieren.
