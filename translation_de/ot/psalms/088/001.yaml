id: PSA.88.1
reference: Psalms 88:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְ֭הוָה אֱלֹהֵ֣י יְשׁוּעָתִ֑/י יוֹם צָעַ֖קְתִּי בַ/לַּ֣יְלָה נֶגְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/001.yaml
  text: O Yahweh[a], God of my salvation, by day I cry out; at night I am before you.
translation:
  language: de
  text: 'Jahwe, Gott meiner Rettung,

    am Tag schreie ich;

    in der Nacht bin ich vor dir.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in der Nacht vor dir«; die hebräische Zeile enthält kein Verb.'
    reason: Die Ergänzung »bin ich« ist für einen natürlichen deutschen Satz nötig, während die knappe Mehrdeutigkeit des Hebräischen dokumentiert werden soll.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יְשׁוּעָתִי
  choice: Gott meiner Rettung
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet Gott als den, von dem die Rettung des Betenden kommt. »Rettung« bewahrt die konkrete wie auch theologische Bedeutungsweite von יְשׁוּעָה.
- source_word: יוֹם
  choice: am Tag
  rationale: Das Substantiv wird hier adverbial gebraucht und steht im zeitlichen Gegenüber zu »in der Nacht«.
- source_word: צָעַקְתִּי
  choice: schreie ich
  rationale: Das Qal-Perfekt bezeichnet im Zusammenhang des fortdauernden Klagegebets den dringlichen Ruf des Beters. Das deutsche Präsens gibt diese gegenwärtig anhaltende Klage natürlich wieder.
- source_word: בַלַּיְלָה
  choice: in der Nacht
  rationale: Eine natürliche temporale Wiedergabe, die den Gegensatz zu »am Tag« erhält.
- source_word: נֶגְדֶּךָ
  choice: bin ich vor dir
  rationale: Wörtlich steht nur »vor dir«. Für einen verständlichen deutschen Satz wird in der verblosen zweiten Zeile »bin ich« ergänzt, ohne die Art dieses Gegenüberseins näher festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt unmittelbar den Eigennamen Gottes. »Jahwe« bewahrt diesen Namenscharakter, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bezug von »vor dir«
  choice: 'als verbloser Nachtsatz: »in der Nacht bin ich vor dir«'
  alternative: »Tag und Nacht schreie ich vor dir«
  rationale: Die gewählte Fassung folgt der überlieferten Wortfolge und bewahrt den auffälligen, knappen Parallelismus. Eine Ergänzung des Verbs »schreien« in der Nachtzeile wäre möglich, würde die syntaktische Mehrdeutigkeit aber stärker auflösen.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch mit knappen poetischen Zeilen. Die direkte Anrede bleibt ohne zusätzliches »O«, da der Vokativ im Deutschen auch ohne Anredepartikel klar ist.
