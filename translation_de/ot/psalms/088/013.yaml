base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/013.yaml
  text: But as for me[a], O Yahweh, I cry out to you; in the morning my prayer comes before you.
translation:
  language: de
  text: Ich aber habe zu dir um Hilfe geschrien, Jahwe; am Morgen tritt mein Gebet vor dich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „mein Gebet begegnet dir“ oder „mein Gebet kommt dir zuvor“. Das hebräische Verb kann bedeuten, jemandem entgegenzukommen, ihm zu begegnen oder ihm zuvorzukommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Die Konjunktion zusammen mit dem selbstständigen Pronomen setzt das Ich nachdrücklich in Gegensatz zum Vorangehenden. „Ich aber“ gibt diesen Kontrast natürlich und knapp wieder.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Die Präposition bezeichnet die Ausrichtung des Hilferufs auf Jahwe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: שִׁוַּעְתִּי
  choice: schreie ich um Hilfe
  rationale: Das Verb bezeichnet einen dringenden Hilferuf. Das deutsche Präsens passt zum fortdauernden Gebet im poetischen Zusammenhang, obwohl die hebräische Form formal eine Suffixkonjugation ist.
- source_word: וּבַבֹּקֶר
  choice: am Morgen
  rationale: Dies ist die natürliche deutsche Zeitangabe. Die verbindende Konjunktion wird nach dem Semikolon nicht eigens wiedergegeben.
- source_word: תְּפִלָּתִי
  choice: mein Gebet
  rationale: Die Einzahl und das Possessivsuffix werden unmittelbar bewahrt.
- source_word: תְקַדְּמֶךָּ
  choice: kommt vor dich
  rationale: Die Hifilform von קדם kann ein Entgegenkommen, Begegnen oder Zuvorkommen ausdrücken. Mit dem Gebet als Subjekt bewahrt „kommt vor dich“ das räumliche Bild und lässt die Bedeutungsbreite erkennen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. „Jahwe“ wahrt ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitwert von שִׁוַּעְתִּי
  choice: 'Präsens: „schreie ich um Hilfe“'
  alternative: 'Perfekt/Präteritum: „habe ich um Hilfe geschrien“ / „schrie ich um Hilfe“'
  rationale: Die hebräische Suffixform kann einen bereits vollzogenen Hilferuf bezeichnen; im Klagegebet lässt sie sich zugleich als gegenwärtig fortdauerndes Rufen verstehen. Das Präsens entspricht dem unmittelbaren poetischen Vollzug, ohne eine besondere dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Satzstellung. Die Wiederaufnahme des Subjekts in „Ich aber, zu dir, Jahwe, schreie ich“ bewahrt die emphatische Ausrichtung des hebräischen Verses. Der Gottesname erscheint in der im Deutschen etablierten Form „Jahwe“.
