source:
  edition: WLC
  text: הֲ/לַ/מֵּתִ֥ים תַּעֲשֶׂה פֶּ֑לֶא אִם רְ֝פָאִ֗ים יָק֤וּמוּ יוֹד֬וּ/ךָ סֶּֽלָה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/010.yaml
  text: Do you work wonders for the dead? Do the departed spirits rise up to praise you? Selah[a]
translation:
  language: de
  text: Tust du für die Toten Wunder? Stehen die Schatten[a] auf und preisen dich? Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Totengeister“. Hebräisch Refa’im, eine poetische Bezeichnung für die Toten im Totenreich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלַמֵּתִים
  choice: für die Toten
  rationale: Die Verbindung der Fragepartikel הֲ mit לַ bezeichnet hier die Empfänger beziehungsweise den Bereich des Handelns. „Für die Toten“ ist natürlich und bewahrt die rhetorische Zuspitzung.
- source_word: תַּעֲשֶׂה פֶּלֶא
  choice: tust du … Wunder
  rationale: עשה mit פֶּלֶא bezeichnet das Vollbringen außergewöhnlicher göttlicher Taten. Der deutsche Plural „Wunder“ ist in dieser Verbindung idiomatisch, obwohl das Hebräische formal den Singular hat.
- source_word: אִם
  choice: Stehen …?
  rationale: אִם leitet hier parallel zur ersten Frage eine zweite rhetorische Frage ein und ist nicht konditional zu verstehen.
- source_word: רְפָאִים
  choice: Totengeister
  rationale: Das Wort bezeichnet in diesem poetischen Unterweltskontext die Verstorbenen als schattenhafte Bewohner des Totenreichs. „Totengeister“ wahrt diese Bildwelt, ohne das Wort mit dem gleichnamigen Volk zu verwechseln.
- source_word: יָקוּמוּ
  choice: stehen … auf
  rationale: קום beschreibt ein Sich-Erheben beziehungsweise Aufstehen. Die Formulierung erhält das kräftige Bild, ohne ausdrücklich eine spätere Lehre von der Auferstehung in den Vers hineinzulesen.
- source_word: יוֹדוּךָ
  choice: preisen dich
  rationale: ידה im Hifil kann „danken“ oder „preisen“ bedeuten. Im Zusammenhang der öffentlichen Verkündigung von Gottes Treue und Wundern passt „preisen“ gut.
- source_word: סֶלָה
  choice: Sela
  rationale: Die genaue Bedeutung des liturgischen oder musikalischen Ausdrucks ist unsicher; daher wird er transliteriert.
theological_decisions:
- issue: Bedeutung von רְפָאִים im poetischen Kontext des Totenreichs
  choice: Totengeister
  alternative: Schatten; Tote; Refaïter
  rationale: „Totengeister“ macht den Bezug auf Verstorbene im Totenreich verständlich und erhält zugleich die besondere poetische Bezeichnung. Es werden keine näheren Aussagen über ihren Zustand oder eine spätere Auferstehungslehre hinzugefügt.
- issue: Aussageform der beiden Fragen
  choice: zwei rhetorische Fragen
  alternative: eine Frage mit konditionalem Folgesatz
  rationale: Der Parallelismus spricht dafür, אִם als Einleitung einer zweiten rhetorischen Frage wiederzugeben. So bleibt die Spannung des Klagegebets erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappen rhetorischen Fragen und der poetische Parallelismus bleiben erhalten; „Sela“ wird wegen seiner unsicheren Bedeutung unübersetzt wiedergegeben.
