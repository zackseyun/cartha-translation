source:
  edition: WLC
  text: הַ/יְסֻפַּ֣ר בַּ/קֶּ֣בֶר חַסְדֶּ֑/ךָ אֱ֝מֽוּנָתְ/ךָ֗ בָּ/אֲבַדּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/011.yaml
  text: Is your steadfast love declared in the grave[a], your faithfulness in Abaddon?
translation:
  language: de
  text: Wird im Grab von deiner Güte erzählt, von deiner Treue im Abaddon[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Untergang« beziehungsweise »am Ort des Untergangs«. Das hebräische Wort »Abaddon« ist eine poetische Bezeichnung für den Bereich des Verderbens und des Todes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְסֻפַּר
  choice: Wird … erzählt
  rationale: Die Fragepartikel הַ mit dem Pual-Imperfekt von ספר leitet eine rhetorische Frage ein. „Wird … erzählt“ wahrt den passiven Sinn und klingt im heutigen Deutsch natürlich.
- source_word: בַּקֶּבֶר
  choice: im Grab
  rationale: קֶבֶר bezeichnet das Grab bzw. die Begräbnisstätte. „Im Grab“ ist knapp, idiomatisch und erhält das poetische Bild.
- source_word: חַסְדֶּךָ
  choice: deine Güte
  rationale: חֶסֶד umfasst hier Gottes beständige, loyale Zuwendung. „Güte“ ist im deutschen Psalmenstil verständlich und würdevoll, ohne den Begriff auf eine einzelne dogmatische Nuance festzulegen.
- source_word: אֱמוּנָתְךָ
  choice: deine Treue
  rationale: אֱמוּנָה bezeichnet hier Gottes Verlässlichkeit und Beständigkeit. „Treue“ bildet dazu die natürliche und theologisch angemessene deutsche Entsprechung.
- source_word: בָּאֲבַדּוֹן
  choice: im Abaddon
  rationale: אֲבַדּוֹן kann „Untergang“ bedeuten und zugleich poetisch den Bereich des Verderbens beziehungsweise des Todes bezeichnen. Die Beibehaltung als „Abaddon“ bewahrt das markante hebräische Bild; die Bedeutungsalternativen stehen in der Fußnote.
theological_decisions:
- issue: Ob אֲבַדּוֹן als gewöhnliches Substantiv oder als poetische Bezeichnung des Totenreichs wiederzugeben ist
  choice: „Abaddon“ im Haupttext
  alternative: „Untergang“, „Ort des Untergangs“ oder „Reich des Verderbens“
  rationale: Im Parallelismus zu „Grab“ bezeichnet אֲבַדּוֹן wahrscheinlich den Bereich von Tod und Verderben, nicht bloß abstrakte Vernichtung. „Abaddon“ wahrt die literarische Spannung und vermeidet eine vorschnelle Festlegung; die semantische Bedeutung wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und der parallele Satzbau bleiben erhalten; „Abaddon“ bewahrt die fremdartige poetische Bildwelt des Hebräischen.
