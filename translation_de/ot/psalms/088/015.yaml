  text: I am afflicted and near death from my youth[a]; I bear your terrors; I am overwhelmed.
translation:
  language: de
  text: Geplagt bin ich und dem Tod nahe seit meiner Jugend. Ich trage deine Schrecken; ich bin überwältigt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich habe deine Schrecken getragen; ich bin verstört/verwirrt.“ Das letzte Verb ist schwer zu deuten und kann ausdrücken, dass jemand überwältigt, bestürzt oder völlig ratlos ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנִי
  choice: geplagt
  rationale: Das Adjektiv bezeichnet im Klagekontext einen leidenden, elenden Zustand und nicht in erster Linie wirtschaftliche Armut.
- source_word: וְגֹוֵעַ
  choice: und dem Tod nahe
  rationale: Das Partizip von גוע beschreibt ein fortdauerndes Sterben oder Dahinscheiden. „Dem Tod nahe“ gibt diesen Zustand in natürlichem Deutsch wieder.
- source_word: מִנֹּעַר
  choice: seit meiner Jugend
  rationale: Die Präposition bezeichnet den Ausgangspunkt eines seit früher Lebenszeit andauernden Zustands; „meiner“ ergibt sich aus dem Ich-Kontext.
- source_word: נָשָׂאתִי
  choice: ich trage
  rationale: נשׂא bedeutet tragen oder ertragen. Das Präsens bringt die fortdauernde Last im gegenwärtigen Klagezusammenhang zum Ausdruck; „ich habe getragen“ bleibt grammatisch möglich.
- source_word: אֵמֶיךָ
  choice: deine Schrecken
  rationale: Der Plural bezeichnet Schrecken oder furchterregende Erfahrungen. Das Suffix der zweiten Person wird direkt bewahrt und hält den Bezug auf Gottes Handeln offen.
- source_word: אָפוּנָה
  choice: ich bin überwältigt
  rationale: Die seltene und schwierige Form kann einen Zustand des Überwältigt-, Verstört- oder Ratlosseins ausdrücken. „Ich bin überwältigt“ bewahrt die starke Wirkung, ohne die unsichere Nuance zu eng festzulegen.
theological_decisions:
- issue: Bezug von „deine Schrecken“
  choice: Die Schrecken werden in der direkten Anrede Gott zugeordnet, ohne seine Beteiligung abzuschwächen oder genauer zu bestimmen.
  alternative: Die Wendung könnte lediglich Schrecken bezeichnen, die der Beter in Gottes Gegenwart empfindet.
  rationale: Das Suffix der zweiten Person verbindet die Schrecken unmittelbar mit Gott. Die Übersetzung bewahrt damit die theologische Spannung der Klage, ohne sie erklärend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorangestellte Wendung „Geplagt bin ich“ wahrt den klagenden poetischen Nachdruck des hebräischen Satzanfangs; die schwierige Schlussform wird im Text verständlich und in der Fußnote transparent wiedergegeben.
