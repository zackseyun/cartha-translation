  text: הֲ/יִוָּדַ֣ע בַּ/חֹ֣שֶׁךְ פִּלְאֶ֑/ךָ וְ֝/צִדְקָתְ/ךָ֗ בְּ/אֶ֣רֶץ נְשִׁיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/012.yaml
  text: Is your wonder made known in the darkness[b][a], or your righteousness in the land of forgetfulness?
translation:
  language: de
  text: Wird dein Wunder in der Finsternis bekannt oder deine Gerechtigkeit[a] im Land des Vergessens[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein gerechtes Handeln“; auch „dein Recht“.'
    reason: lexical_alternative
  - marker: b
    text: Das „Land des Vergessens“ ist ein poetischer Ausdruck für den Bereich der Toten.
    reason: cultural_note
lexical_decisions:
- source_word: הֲיִוָּדַע
  choice: Wird … bekannt gemacht
  rationale: Das Nifal Imperfekt von ידע steht in einer Frage. Die passive Formulierung bewahrt die Bedeutung „bekannt gemacht werden“; der Zukunftsbezug bleibt im Deutschen natürlich offen.
- source_word: בַּחֹשֶׁךְ
  choice: in der Finsternis
  rationale: Präposition und Artikel werden wiedergegeben. „Finsternis“ ist poetisch angemessen und ruft im Zusammenhang den Bereich des Todes hervor, ohne ihn im Haupttext ausdrücklich damit gleichzusetzen.
- source_word: פִּלְאֶךָ
  choice: dein Wunder
  rationale: Der Singular mit Suffix wird als Singular bewahrt. Gemeint sein kann Gottes wunderbares Wirken insgesamt oder eine Wundertat.
- source_word: וְצִדְקָתְךָ
  choice: oder deine Gerechtigkeit
  rationale: Das hebräische ו verbindet die parallelen Glieder; im Deutschen gibt „oder“ die fortgeführte rhetorische Frage natürlich wieder. צדקה wird im Haupttext mit „Gerechtigkeit“ übersetzt.
- source_word: בְּאֶרֶץ
  choice: im Land
  rationale: Die Verbindung mit dem folgenden Substantiv wird idiomatisch als „im Land des …“ wiedergegeben.
- source_word: נְשִׁיָּה
  choice: Vergessen
  rationale: Das Substantiv bezeichnet Vergessen beziehungsweise Vergessenheit. „Land des Vergessens“ ist transparent, poetisch und vermeidet die stärker deutende Wiedergabe „Auslöschung“ oder „Nichts“.
theological_decisions:
- issue: Bedeutung von צדקה im poetischen Kontext von Gottes Wesen und Handeln
  choice: Gerechtigkeit
  alternative: Recht / gerechtes Handeln
  rationale: צדקה kann sowohl Gerechtigkeit als Eigenschaft als auch gerechtes beziehungsweise rettendes Handeln bezeichnen. „Gerechtigkeit“ wahrt die traditionelle Bedeutungsbreite; die handlungsbezogene Alternative wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache mit dichterischer Bildhaftigkeit. Die beiden parallelen Ortsangaben bleiben erhalten; die rhetorische Frage wird nicht erklärend aufgelöst.
