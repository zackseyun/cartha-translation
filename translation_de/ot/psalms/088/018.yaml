  text: You have put far from me lover and friend[b][a]; my acquaintances are darkness.
translation:
  language: de
  text: Du hast Menschen, die mich lieben, und Freunde von mir ferngehalten[a]; meine Bekannten sind Finsternis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Liebenden und Freund“; die formal singularischen Formen können hier die nahestehenden Menschen zusammenfassend bezeichnen.'
    reason: grammatical_clarification
  - marker: b
    text: 'Der hebräische Schluss ist auffallend knapp. Auch möglich: „Meine Bekannten sind in der Finsternis“ oder: „Die Finsternis ist meine einzige Vertraute.“'
    reason: alternative_reading
lexical_decisions:
- source_word: הִרְחַקְתָּ מִמֶּנִּי
  choice: Du hast mir … entfremdet
  rationale: Der Hifil von רחק bezeichnet ein verursachtes Entfernen. „Mir entfremdet“ gibt die von Gott bewirkte Trennung in natürlichem Deutsch wieder, ohne lediglich einen Zustand auszudrücken.
- source_word: אֹהֵב
  choice: Menschen, die mich lieben
  rationale: Das substantivierte Partizip bezeichnet Personen, die dem Beter Liebe entgegenbringen. Die Umschreibung vermeidet die im heutigen Deutschen leicht romantisch oder sexuell verstandene Bezeichnung „Liebhaber“.
- source_word: וָרֵעַ
  choice: und Freunde
  rationale: רֵעַ bezeichnet hier im Zusammenhang enger Beziehungen Freunde oder Gefährten. Der deutsche Plural passt idiomatisch zur kollektiv verstandenen Aussage, obwohl die hebräische Form formal Singular ist.
- source_word: מְיֻדָּעַי
  choice: meine Bekannten
  rationale: Das Wort bezeichnet die dem Sprecher bekannten beziehungsweise mit ihm vertrauten Personen. „Bekannte“ bewahrt den Unterschied zu den zuvor genannten engen Freunden.
- source_word: מַחְשָׁךְ
  choice: sind Finsternis
  rationale: Das Schlusswort bildet wahrscheinlich das Prädikat eines knappen Nominalsatzes. „Finsternis“ wahrt das starke Bild und die auffällige Kürze des hebräischen Schlusses.
theological_decisions:
- issue: Bezug und Ergänzung des elliptischen Schlusses מְיֻדָּעַי מַחְשָׁךְ
  choice: „meine Bekannten sind Finsternis“
  alternative: „meine Bekannten sind in der Finsternis“ oder „die Finsternis ist meine einzige Vertraute“
  rationale: Wortfolge und masoretischer Text erlauben am unmittelbarsten einen Nominalsatz mit „meine Bekannten“ als Subjekt und „Finsternis“ als Prädikat. Da der hebräische Schluss jedoch elliptisch und mehrdeutig ist, werden verbreitete Alternativen in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Zeile wird idiomatisch formuliert; der Schluss bleibt bewusst schroff und bildhaft, damit die Mehrdeutigkeit und Trostlosigkeit des hebräischen Textes nicht eingeebnet werden.
