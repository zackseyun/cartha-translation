  text: עֵינִ֥/י דָאֲבָ֗ה מִנִּ֫י עֹ֥נִי קְרָאתִ֣י/ךָ יְהוָ֣ה בְּ/כָל י֑וֹם שִׁטַּ֖חְתִּי אֵלֶ֣י/ךָ כַפָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/009.yaml
  text: My eye grows weak because of affliction; I call on you every day[a], O Yahweh; I spread out my hands to you.
translation:
  language: de
  text: Mein Auge wird schwach vor Elend; jeden Tag rufe ich zu dir, Yahweh, und breite meine Hände zu dir aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mein Auge schwindet vor Elend“; auch möglich: „Mein Auge schmerzt wegen des Elends.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינִי
  choice: Mein Auge
  rationale: Der hebräische Text steht im Singular. Die konkrete poetische Redeweise bleibt erhalten und kann zugleich für Sehkraft oder Lebenskraft stehen.
- source_word: דָאֲבָה
  choice: wird schwach
  rationale: Das Verb bezeichnet ein Schwinden, Dahinsiechen oder Leiden. „Wird schwach“ gibt die Wirkung natürlich wieder, ohne die Art des Leidens zu eng festzulegen.
- source_word: מִנִּי עֹנִי
  choice: vor Elend
  rationale: Die Wendung bezeichnet Ursache oder Ausgangspunkt des Schwindens. „Vor Elend“ ist im Deutschen knapp, idiomatisch und wahrt den Zusammenhang schweren Leidens.
- source_word: קְרָאתִיךָ
  choice: rufe ich zu dir
  rationale: In Verbindung mit „jeden Tag“ liegt eine wiederholte gegenwärtige Handlung nahe. „Zu dir rufen“ bezeichnet die betende Anrufung, ohne unnötig zusätzliche Intensität einzutragen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּכָל יוֹם
  choice: jeden Tag
  rationale: Die Formulierung bezeichnet hier am ehesten die tägliche Wiederholung; „den ganzen Tag“ würde eher ununterbrochene Dauer ausdrücken.
- source_word: שִׁטַּחְתִּי
  choice: breite ... aus
  rationale: Das Verb beschreibt das Ausbreiten der Hände als Gebärde des Gebets oder Flehens.
- source_word: כַפָּי
  choice: meine Hände
  rationale: Wörtlich sind die Handflächen gemeint; „Hände“ ist für die Gebetsgebärde im modernen Deutschen die natürliche Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen ausdrücklich. Die Transliteration bewahrt ihn als Namen und ersetzt ihn nicht durch einen Titel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter poetischer Bildsprache. Der Singular „Auge“ und die körperliche Gebetsgebärde werden bewahrt; die Satzstellung ist für flüssiges Deutsch leicht geglättet.
