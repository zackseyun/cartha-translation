source:
  edition: WLC
  text: עָ֭לַ/י סָמְכָ֣ה חֲמָתֶ֑/ךָ וְ/כָל מִ֝שְׁבָּרֶ֗י/ךָ עִנִּ֥יתָ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/007.yaml
  text: Your wrath has rested on me[a], and with all your breakers you have afflicted me. Selah
translation:
  language: de
  text: Dein Zorn lastet auf mir, und mit all deinen Brandungswellen[a] hast du mich niedergedrückt. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Wogen« oder »Fluten«. Das hebräische Wort bezeichnet brechende Meereswellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָמְכָה
  choice: lastet
  rationale: Das Verb bezeichnet grundsätzlich Stützen oder Sich-Anlehnen. Mit Gottes Zorn als Subjekt und »auf mir« vermittelt »lastet« natürlich und bildhaft, dass der Zorn schwer auf dem Beter liegt.
- source_word: חֲמָתֶךָ
  choice: dein Zorn
  rationale: חֵמָה kann Zorn, Grimm oder Glut bezeichnen. »Zorn« ist im Deutschen klar, würdig und bewahrt das volle Gewicht der Aussage.
- source_word: מִשְׁבָּרֶיךָ
  choice: deine Brandungswellen
  rationale: Das Wort bezeichnet brechende Meereswellen. »Brandungswellen« gibt dieses Bild im Deutschen genauer und natürlicher wieder als das missverständliche »Brecher«.
- source_word: עִנִּיתָ
  choice: hast du mich niedergedrückt
  rationale: Das Piel von ענה kann bedrängen, demütigen oder Leiden zufügen bedeuten. Im Zusammenhang der über dem Beter zusammenschlagenden Wellen verbindet »niedergedrückt« die konkrete Bildsprache mit der erfahrenen Bedrängnis.
- source_word: וְכָל
  choice: und mit all
  rationale: Die Formulierung drückt hier die Gesamtheit der göttlichen Brandungswellen aus, durch die der Beter niedergedrückt wird. Das instrumentale »mit« macht den Zusammenhang im Deutschen verständlich.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und liturgische Funktion des Ausdrucks nicht sicher geklärt sind, wird er traditionsgemäß transliteriert statt interpretierend übersetzt.
theological_decisions:
- issue: Gottes Zorn und Gottes unmittelbares Handeln im Leiden
  choice: 'Der Beter spricht Gott direkt an: Gottes Zorn lastet auf ihm, und Gott drückt ihn mit seinen Brandungswellen nieder.'
  alternative: Die göttliche Urheberschaft abschwächen und das Leiden als unpersönliches Geschehen darstellen.
  rationale: Der hebräische Text schreibt sowohl den Zorn als auch die bedrängende Handlung unmittelbar Gott zu. Die Übersetzung bewahrt diese Spannung der Klage, ohne sie theologisch abzumildern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Meeresmetaphorik und die direkte Klage an Gott bleiben deutlich; »Sela« wird wegen seiner unsicheren Bedeutung unübersetzt beibehalten.
