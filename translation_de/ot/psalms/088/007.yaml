  source_fidelity: 'Die Übersetzung gibt die beiden hebräischen Aussagen angemessen wieder: Gottes Zorn liegt schwer „auf mir“, und Gott hat den Beter mittels aller seiner brechenden Wellen bedrängt. Das instrumentale „mit“ ist im Deutschen eine sachgemäße Explizierung. „Sela“ wahrt die Unsicherheit des hebräischen Liturgieausdrucks.'
  naturalness: „Dein Zorn lastet auf mir“ ist idiomatisches, würdiges modernes Standarddeutsch. Auch „mit all deinen Brandungswellen hast du mich niedergedrückt“ ist als dichterische Klagesprache natürlich und erhält die körperlich-bedrängende Bildkraft des Verses.
  terminology: „Zorn“ ist für חֵמָה treffend. „Brandungswellen“ vermittelt מִשְׁבָּרֶיךָ als brechende Meereswellen präzise, ohne das missverständliche deutsche Substantiv „Brecher“ zu verwenden. „Niedergedrückt“ ist im Kontext eine vertretbare Wiedergabe von עִנִּיתָ und legt keine unzulässige theologische Deutung fest.
