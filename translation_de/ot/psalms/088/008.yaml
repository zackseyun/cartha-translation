source:
  edition: WLC
  text: הִרְחַ֥קְתָּ מְיֻדָּעַ֗/י מִ֫מֶּ֥/נִּי שַׁתַּ֣/נִי תוֹעֵב֣וֹת לָ֑/מוֹ כָּ֝לֻ֗א וְ/לֹ֣א אֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/008.yaml
  text: You have driven my companions far from me[a]; you have made me abhorrent to them[c][b]. I am confined and cannot go out.
translation:
  language: de
  text: Du hast meine Bekannten weit von mir entfernt[a]; du hast mich ihnen zum Abscheu gemacht[b]. Ich bin eingeschlossen und kann nicht hinaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Vertrauten“; wörtlicher: „die mir Bekannten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „du hast mich ihnen zu etwas Abscheulichem gemacht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְחַקְתָּ
  choice: hast … weit … entfernt
  rationale: Der Hifil von רחק bezeichnet das Verursachen von Entfernung; die Formulierung gibt sowohl die Kausalität als auch die räumlich-soziale Trennung wieder.
- source_word: מְיֻדָּעַי
  choice: meine Bekannten
  rationale: Die von ידע abgeleitete Bezeichnung meint Menschen, die dem Sprecher bekannt beziehungsweise mit ihm vertraut sind. „Bekannte“ bewahrt die lexikalische Offenheit, ohne die Nähe von „Freunde“ vorauszusetzen.
- source_word: מִמֶּנִּי
  choice: von mir
  rationale: Gibt den üblichen Trennungssinn der Präposition מן mit Suffix der ersten Person Singular wieder.
- source_word: שַׁתַּנִי
  choice: hast mich … gemacht
  rationale: שׁית/שים bedeutet grundsätzlich „setzen, stellen“; mit dem folgenden Prädikatsausdruck ist im Deutschen „zu etwas machen“ idiomatisch.
- source_word: תוֹעֵבוֹת
  choice: zum Abscheu
  rationale: Das formal pluralische Substantiv aus dem Bedeutungsfeld des Abscheulichen bezeichnet hier prädikativ, dass der Beter für die anderen etwas Abstoßendes geworden ist. „Zum Abscheu“ erhält die starke nominale Ausdrucksweise.
- source_word: לָמוֹ
  choice: ihnen
  rationale: Das Pronomen verweist auf die zuvor genannten Bekannten; der Dativ passt zur deutschen Konstruktion „jemandem zum Abscheu machen“.
- source_word: כָּלֻא
  choice: Ich bin eingeschlossen
  rationale: Die passive beziehungsweise stative Form von כלא bezeichnet ein Eingeschlossensein oder Festgehaltenwerden, ohne zwingend ein förmliches Gefängnis zu meinen.
- source_word: וְלֹא אֵצֵא
  choice: und kann nicht hinaus
  rationale: Formal steht „und ich gehe nicht hinaus“; nach „eingeschlossen“ drückt die Aussage kontextuell fehlende Möglichkeit aus. „Hinaus“ ist im Deutschen natürlich und lässt das Ziel offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Klagepsalm-Deutsch. Die direkte Anrede Gottes und die starke Sprache des Abscheus bleiben erhalten. „Bekannte“ vermeidet eine nicht ausdrücklich belegte Verengung auf enge Freunde; „eingeschlossen“ vermeidet die Überbestimmung als formelle Haft.
