base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/026.yaml
  text: He will call to me[a], ‘You are my Father, my God, and the rock of my salvation.’
translation:
  language: de
  text: 'Er wird zu mir rufen[a]: »Du bist mein Vater, mein Gott und der Fels meiner Rettung.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er wird mich anrufen«; auch möglich: »Er wird zu mir schreien.« Das hebräische Verb kann ein Rufen oder Ausrufen bezeichnen, besonders im Gebet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Er
  rationale: Das selbstständige Personalpronomen der 3. Person Maskulinum Singular wird zur Hervorhebung des Subjekts ausdrücklich wiedergegeben.
- source_word: יִקְרָאֵנִי
  choice: wird zu mir rufen
  rationale: קרא kann »rufen« oder »ausrufen« bedeuten. Im Gebets- und Anrufungskontext gibt »zu mir rufen« die Richtung der Anrede natürlich wieder, ohne die mögliche Bedeutung »mich nennen« auszuschließen; die Alternativen werden in der Fußnote genannt.
- source_word: אָבִי
  choice: mein Vater
  rationale: Das Substantiv mit Suffix der 1. Person Singular bezeichnet die persönliche Beziehung des Sprechers zu Gott. »Vater« ist in der direkten Gottesrede als relationale Bezeichnung großgeschrieben.
- source_word: אָתָּה
  choice: Du bist
  rationale: Das im Hebräischen ausdrücklich gesetzte Pronomen wird beibehalten; die im Nominalsatz implizite Kopula wird im Deutschen mit »bist« ergänzt.
- source_word: אֵלִי
  choice: mein Gott
  rationale: אֵל kann »Gott« oder »Mächtiger« bedeuten. In der Parallele zu »mein Vater« und »Fels meiner Rettung« ist »mein Gott« die klare und natürliche Wiedergabe.
- source_word: וְצוּר
  choice: und der Fels
  rationale: צוּר bedeutet wörtlich »Fels« und ist ein geläufiges Bild für Gott als Schutz und Stärke. Da am Substantiv selbst kein Possessivsuffix steht, wahrt »der Fels« die hebräische Form.
- source_word: יְשׁוּעָתִי
  choice: meiner Rettung
  rationale: יְשׁוּעָה bezeichnet Rettung oder Befreiung. »Meiner Rettung« bewahrt die Genitivbeziehung zu »Fels« und klingt im modernen Deutschen natürlicher als »meines Heils«, ohne den theologischen Gehalt zu verengen.
theological_decisions:
- issue: Gottesrede im königlichen beziehungsweise messianischen Kontext
  choice: 'Die Worte werden unmittelbar als Anrede an Gott übersetzt: »Du bist mein Vater, mein Gott und der Fels meiner Rettung.«'
  alternative: »Vater« als bloße königliche Bildsprache abschwächen oder die Formulierung ausdrücklich messianisch ausdeuten.
  rationale: Psalm 89 behandelt den davidischen König und den Bund. Der Vers selbst enthält jedoch eine direkte, relationale Anrede Gottes. Die Übersetzung bewahrt diese theologische Spannung, ohne spätere lehrmäßige Schlussfolgerungen in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Rettung« ist allgemein verständlich und bewahrt die konkrete Bedeutung des hebräischen Wortes; die poetische Metapher »Fels meiner Rettung« bleibt erhalten.
