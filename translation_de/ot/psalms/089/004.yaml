- from: Für immer werde ich deine Nachkommen[a] fest gründen und deinen Thron Generation um Generation aufbauen. Sela.[b]
  to: Auf ewig werde ich deine Nachkommenschaft fest gründen und deinen Thron für alle Generationen bauen. Sela[b]
  rationale: Die Revision ersetzt die bei Personen unidiomatische Verbindung „Nachkommen fest gründen“ durch die kollektive und natürliche Formulierung „Nachkommenschaft fest gründen“. Sie verdeutlicht ferner, dass der Thron durch alle Generationen bestehen soll, ohne das Bild des Bauens aufzugeben. Der Anker für die Anmerkung zu Sela wird an die übliche Stelle gesetzt. Die Fußnote a bleibt als lexikalische Alternative erhalten, obwohl „Nachkommenschaft“ im Haupttext steht.
