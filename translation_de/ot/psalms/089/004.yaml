lexical_decisions:
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die Verbindung bezeichnet unbegrenzte Dauer; „für immer“ ist im modernen Deutschen natürlich und bewahrt den Sinn der bleibenden Bundesverheißung.
- source_word: אָכִין
  choice: werde ich … fest gründen
  rationale: Der Hifil von כון bedeutet hier „fest machen, fest gründen“. „Fest gründen“ gibt sowohl die Beständigkeit als auch den königlich-dynastischen Zusammenhang wieder.
- source_word: זַרְעֶךָ
  choice: deine Nachkommen
  rationale: Das singularische זֶרַע kann kollektiv die Nachkommenschaft bezeichnen. „Nachkommen“ ist verständlich und natürlich; die mögliche wörtliche Wiedergabe „Same“ wird in der Fußnote genannt.
- source_word: וּבָנִיתִי
  choice: und … aufbauen
  rationale: Die formal perfektive Verbform erhält durch den parallelen Zukunftskontext futurische Bedeutung. „Aufbauen“ bewahrt das architektonische Bild, das auf den Thron übertragen wird.
- source_word: לְדֹר וָדֹר
  choice: Generation um Generation
  rationale: Die Wendung beschreibt fortgesetzte Dauer durch aufeinanderfolgende Generationen. „Generation um Generation“ bewahrt knapp und idiomatisch ihren wiederholenden Charakter.
- source_word: כִּסְאֲךָ
  choice: deinen Thron
  rationale: Dies ist die übliche Wiedergabe im königlichen Kontext und bezeichnet hier im Parallelismus die fortdauernde dynastische Herrschaft.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und Funktion des Ausdrucks unsicher sind, ist die Transliteration transparenter als eine deutende Übersetzung wie „Pause“ oder „Zwischenspiel“.
theological_decisions:
- issue: Dynastische Verheißung im Kontext des davidischen Bundes
  choice: Die direkte Anrede mit „deine Nachkommen“ und „deinen Thron“ bleibt in ihrem königlich-dynastischen Sinn erhalten.
  alternative: Eine messianische Erfüllung ausdrücklich in den Vers eintragen oder die Aussage zu einer allgemeinen Nachkommensverheißung verflachen.
  rationale: Der hebräische Text spricht den davidischen König unmittelbar an. Eine weiterführende kanonische Bedeutung bleibt möglich, wird aber nicht interpretierend in den Wortlaut eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der poetische Parallelismus und das Bild vom Aufbau des Thrones bleiben erhalten; „Generation um Generation“ gibt die knappe Wiederholungsformel des Hebräischen wieder.
