base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/004.yaml
  text: I will establish your offspring forever[a], and build your throne for generation after generation[b]. Selah
translation:
  language: de
  text: Auf ewig werde ich deine Nachkommenschaft fest gründen und deinen Thron für alle Generationen bauen. Sela[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: „Sela“ ist vermutlich eine musikalische oder liturgische Angabe; seine genaue Bedeutung ist ungewiss.
