base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/021.yaml
  text: with whom my hand will be established[a]; indeed[c][b], my arm will strengthen him.
translation:
  language: de
  text: bei dem meine Hand fest sein wird[a]; ja, mein Arm wird ihn stärken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei dem meine Hand gefestigt sein wird“.'
