    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר … עִמּוֹ
  choice: bei dem
  rationale: Das Relativpronomen nimmt den zuvor genannten erwählten König auf; עִמּוֹ bezeichnet Gottes bleibende Nähe und Unterstützung. „Bei dem“ bewahrt die relative Satzform und gibt die Verbindung beider Ausdrücke knapp wieder.
- source_word: יָדִי
  choice: meine Hand
  rationale: Das konkrete poetische Bild für Gottes wirksame Macht und Unterstützung bleibt erhalten.
- source_word: תִּכּוֹן
  choice: fest stehen wird
  rationale: Das Nifal von כון bezeichnet hier Festigkeit oder Beständigkeit. „Fest stehen“ wahrt diesen Bedeutungsgehalt und klingt im Deutschen natürlicher als „gegründet werden“.
- source_word: אַף
  choice: ja
  rationale: „Ja“ gibt die bekräftigende und steigernde Fortführung der parallelen Verszeile knapp wieder.
- source_word: זְרוֹעִי
  choice: mein Arm
  rationale: Das körperhafte poetische Bild für Kraft und Macht wird nicht durch eine abstrakte Umschreibung eingeebnet.
- source_word: תְאַמְּצֶנּוּ
  choice: wird ihn stärken
  rationale: Das Piel von אמץ mit männlichem Objektsuffix bezeichnet das Kräftigen oder Starkmachen des erwählten Königs.
theological_decisions:
- issue: Anthropomorphe Sprache für Gottes Handeln
  choice: „meine Hand“ und „mein Arm“ als poetische Bilder beibehalten
  alternative: Mit „meine Macht“ und „meine Kraft“ umschreiben
  rationale: Der hebräische Text beschreibt Gottes verlässliche Unterstützung des davidischen Königs in körperhaften Bildern. Ihre Bewahrung erhält die Bildkraft, ohne eine körperliche Gestalt Gottes zu behaupten.
- issue: Zeitbezug der Verben
  choice: 'Futur: „wird … stehen“, „wird … stärken“'
  alternative: 'Präsentische Wiedergabe: „steht“, „stärkt“'
  rationale: Die Imperfektformen haben im Zusammenhang der Verheißung einen zukunftsgerichteten beziehungsweise fortdauernden Zusagecharakter.
translation_notes:
  register: Moderne, gehobene Standardsprache mit bewahrtem Parallelismus und den konkreten poetischen Bildern des Hebräischen. Der mit „bei dem“ beginnende Relativsatz bleibt bewusst an den vorhergehenden Vers gebunden.
