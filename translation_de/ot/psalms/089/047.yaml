  text: זְכָר אֲנִ֥י מֶה חָ֑לֶד עַל מַה שָּׁ֝֗וְא בָּרָ֥אתָ כָל בְּנֵי אָדָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/047.yaml
  text: Remember how short my lifetime is! For what vanity have you created all the sons of man?[a][b]
translation:
  language: de
  text: Denk daran, wie kurz meine Lebenszeit ist! Warum hast du alle Menschen so vergänglich erschaffen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum hast du alle Menschen vergeblich erschaffen?“'
    reason: Schָׁוְא kann hier „Nichtigkeit“, „Vergeblichkeit“ oder „umsonst“ bedeuten; die Alternative bewahrt diese Nuance.
lexical_decisions:
- source_word: זְכָר
  choice: Denk daran
  rationale: Der Imperativ im maskulinen Singular richtet sich an Gott. „Denk daran“ gibt die unmittelbare Bitte in natürlichem modernem Deutsch wieder.
- source_word: אֲנִי מֶה חָלֶד
  choice: wie kurz meine Lebenszeit ist
  rationale: חֶלֶד bezeichnet die Lebensdauer bzw. Lebensspanne. Die hebräische Wendung ist knapp und ungewöhnlich; die Übersetzung bringt ihre klagende Aussage über die Kürze des Lebens verständlich zum Ausdruck.
- source_word: עַל מַה
  choice: Zu welcher
  rationale: Die Wendung fragt rhetorisch nach Zweck oder Ergebnis. „Zu welcher“ bewahrt diesen finalen Sinn deutlicher als das allgemeinere „warum“.
- source_word: שָּׁוְא
  choice: Nichtigkeit
  rationale: שָׁוְא umfasst Leere, Nichtigkeit und Vergeblichkeit. „Nichtigkeit“ passt zum poetisch-klagenden Zusammenhang und lässt offen, ob besonders Vergänglichkeit oder Zwecklosigkeit im Vordergrund steht.
- source_word: בָּרָאתָ
  choice: hast du … erschaffen
  rationale: Die Form ist 2. Person maskulin Singular und bezeichnet Gottes Schöpfungshandeln. Das deutsche Perfekt verbindet den Schöpfungsakt natürlich mit der gegenwärtigen Klage.
- source_word: כָל בְּנֵי אָדָם
  choice: alle Menschenkinder
  rationale: Die hebräische Wendung bedeutet wörtlich „alle Söhne des Menschen/Adams“, bezeichnet aber die gesamte Menschheit. „Menschenkinder“ bewahrt das Bild und ist im Deutschen generisch verständlich.
theological_decisions:
- issue: Generische Bezeichnung der Menschheit in כָל בְּנֵי אָדָם
  choice: alle Menschenkinder
  alternative: alle Menschen / alle Söhne Adams
  rationale: Die Wendung umfasst sämtliche Menschen. „Menschenkinder“ erhält die konkrete hebräische Abstammungsformel, ohne sie auf männliche Personen zu beschränken.
- issue: Bezug von שָּׁוְא und rhetorische Stoßrichtung
  choice: Zu welcher Nichtigkeit hast du … erschaffen?
  alternative: Wie nichtig hast du alle Menschenkinder erschaffen!
  rationale: עַל מַה kann als Frage nach Zweck oder Grund verstanden werden, während שָּׁוְא auch die nichtige bzw. vergängliche Beschaffenheit des menschlichen Daseins bezeichnen kann. Der Haupttext folgt der naheliegenden rhetorischen Frage, die Fußnote bewahrt die alternative syntaktische Auffassung.
translation_notes:
  register: Poetisch, klagend und zugleich unmittelbar. „Denk daran“ ist gegenwärtiges Standarddeutsch; „Lebenszeit“, „Nichtigkeit“ und „Menschenkinder“ wahren die würdige Sprache des Psalms, ohne altertümlich zu wirken.
