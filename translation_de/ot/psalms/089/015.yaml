  text: אַשְׁרֵ֣י הָ֭/עָם יוֹדְעֵ֣י תְרוּעָ֑ה יְ֝הוָ֗ה בְּֽ/אוֹר פָּנֶ֥י/ךָ יְהַלֵּכֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/015.yaml
  text: Blessed are the people who know the joyful shout[a]; O Yahweh[b], they walk in the light of your face.
translation:
  language: de
  text: Selig ist das Volk, das den Jubelruf kennt![a] Jahwe, sie gehen im Licht deines Angesichts.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Festjubel«; das hebräische Wort kann auch einen Trompetenstoß oder ein Trompetensignal bezeichnen, besonders im gottesdienstlichen Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: Das »Angesicht« kann Gottes Gegenwart oder Gunst ausdrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die hebräische Glücklichpreisung wird im Deutschen als Ausruf über das kollektiv-singularische »Volk« wiedergegeben. »Glücklich ist« ist verständlich und bewahrt den Charakter einer Seligpreisung, ohne das stärker erklärende »gesegnet« einzutragen.
- source_word: הָעָם
  choice: das Volk
  rationale: עָם bezeichnet hier die Gemeinschaft als Volk; »Nation« würde unnötig den politischen Aspekt hervorheben.
- source_word: יוֹדְעֵי
  choice: das … kennt
  rationale: Das Partizip beschreibt eine bleibende Kennzeichnung des Volkes. Der deutsche Relativsatz gibt dies natürlich wieder.
- source_word: תְרוּעָה
  choice: Jubelruf
  rationale: תְּרוּעָה kann einen lauten Ruf, festlichen Jubel oder ein Trompetensignal bezeichnen. »Jubelruf« passt zum gottesdienstlich-festlichen Zusammenhang, ohne den Ausdruck auf ein Instrument festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּאוֹר
  choice: im Licht
  rationale: Die Präposition bezeichnet hier am natürlichsten den Bereich, in dem das Volk seinen Weg geht.
- source_word: פָּנֶיךָ
  choice: deines Angesichts
  rationale: »Angesicht« bewahrt das konkrete hebräische Bild und klingt im poetischen deutschen Register würdevoll; die möglichen Bedeutungsnuancen Gegenwart und Gunst werden nicht in den Haupttext eingetragen.
- source_word: יְהַלֵּכוּן
  choice: gehen sie
  rationale: Die Verbform bezeichnet fortgesetztes Gehen beziehungsweise Leben. »Gehen« erhält das biblische Wegmotiv und bleibt im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe als direkte Anrede
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen ausdrücklich. »Jahwe« bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bildsprache von פָּנֶיךָ
  choice: deines Angesichts
  alternative: deiner Gegenwart / deiner Gunst
  rationale: Der Haupttext erhält das wörtliche und relationale Bild des göttlichen Angesichts. Eine rein idiomatische Wiedergabe als »Gegenwart« oder »Gunst« würde die mögliche Bedeutungsbreite vorzeitig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Satzstellung. »Angesicht« ist bewusst als gehobenes, aber weiterhin verständliches Wort gewählt, um die hebräische Bildsprache zu erhalten.
