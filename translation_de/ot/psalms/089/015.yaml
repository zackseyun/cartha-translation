revisions:
- from: Glücklich ist das Volk, das den Jubelruf kennt![a] Jahwe, im Licht deines Angesichts gehen sie.[b]
  to: Selig ist das Volk, das den Jubelruf kennt![a] Jahwe, sie gehen im Licht deines Angesichts.[b]
  rationale: Die Revision verwendet mit »Selig« die im Deutschen angemessene Form einer poetisch-biblischen Glücklichpreisung, glättet die Satzstellung und präzisiert die lexikalische Offenheit der Anmerkung zu תְּרוּעָה. Das konkrete Bild vom Licht des göttlichen Angesichts sowie die direkte Anrede Jahwes bleiben unverändert erhalten.
