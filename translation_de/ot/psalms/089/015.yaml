    rationale: אַשְׁרֵי ist eine formelhafte Glücklichpreisung. »Selig ist« ist im modernen würdigen Bibelregister etabliert und gibt diesen Charakter klarer wieder, ohne »gesegnet« als zusätzliche Deutung einzutragen.
  - severity: low
    issue: Die Umstellung »im Licht deines Angesichts gehen sie« wirkt unnötig künstlich.
    rationale: Die natürliche Folge »sie gehen im Licht deines Angesichts« bewahrt Aussage, Bild und poetischen Ton.
  - severity: medium
