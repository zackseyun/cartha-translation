base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/024.yaml
  text: And my faithfulness and my steadfast love will be with him[a], and in my name his horn will be exalted.
translation:
  language: de
  text: Meine Treue und meine beständige Liebe werden mit ihm sein, und in meinem Namen wird sein Horn[a] sich erheben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Horn“ ist ein hebräisches Bild für Kraft, Würde oder königliche Macht.
    reason: cultural_note
lexical_decisions:
- source_word: אֱמוּנָתִי
  choice: meine Treue
  rationale: אֱמוּנָה bezeichnet hier Gottes Verlässlichkeit und Bundestreue, nicht den menschlichen Glaubensakt.
- source_word: חַסְדִּי
  choice: meine beständige Liebe
  rationale: חֶסֶד verbindet liebevolle Zuwendung mit dauerhafter, loyaler Verbundenheit; „beständige Liebe“ gibt beides in natürlichem Deutsch wieder.
- source_word: עִמּוֹ
  choice: mit ihm
  rationale: Die Präposition bezeichnet hier begleitende Gegenwart und Unterstützung.
- source_word: בִּשְׁמִי
  choice: in meinem Namen
  rationale: Die wörtliche hebräische Wendung bleibt erhalten und lässt offen, wie genau Gottes Name dem König Vollmacht und Würde verleiht.
- source_word: תָּרוּם
  choice: wird erhöht werden
  rationale: רוּם bezeichnet das Hochsein beziehungsweise Erhöhtwerden; die passive deutsche Form bewahrt die poetische Verbindung mit dem Horn.
- source_word: קַרְנוֹ
  choice: sein Horn
  rationale: Das konkrete hebräische Bild wird beibehalten und nicht vorschnell durch „Kraft“ oder „Macht“ ersetzt.
theological_decisions:
- issue: Beibehaltung der königlichen Horn-Metapher
  choice: sein Horn wird erhöht werden
  alternative: seine Macht wird wachsen
  rationale: Das Horn steht im Kontext für Kraft, Würde oder königliche Macht. Die Bildsprache des Psalms bleibt im Haupttext erhalten; ihre Bedeutung wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelbegriffe „Treue“ und „beständige Liebe“ bleiben unterschieden; die königliche Bildsprache wird bewahrt.
