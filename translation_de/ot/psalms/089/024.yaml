  source_fidelity: Die Wiedergabe trifft die Begriffe אֱמוּנָתִי („meine Treue“), חַסְדִּי („meine beständige Liebe“), עִמּוֹ („mit ihm“) und die Namensformel gut. Das hebräische תָּרוּם ist jedoch Qal und beschreibt, dass „sein Horn“ emporsteigt bzw. hoch wird; das deutsche Vorgangspassiv „wird erhöht werden“ legt stärker eine nicht genannte handelnde Instanz nahe.
  naturalness: Der Satz ist insgesamt würdevoll und verständlich. „wird sein Horn sich erheben“ ist modernes, poetisches Standarddeutsch und gibt die intransitive hebräische Bildaussage unmittelbarer wieder als das etwas schwerfällige Vorgangspassiv.
  terminology: „Treue“ und „beständige Liebe“ unterscheiden die parallelen Begriffe angemessen. „Horn“ soll als königliche Kraftmetapher im Text stehen bleiben. Der Fußnotenanker wird unmittelbar an „Horn“ gesetzt, damit er eindeutig der erläuterten Metapher zugeordnet ist.
