  source_fidelity: 'Die Grundentscheidungen treffen den hebräischen Sinn: לְעוֹלָם bezeichnet Dauer, אֶשְׁמֹר aktives Bewahren, חַסְדִּי Gottes beständige loyale Liebe, und נֶאֱמֶנֶת die Verlässlichkeit bzw. Festigkeit des Bundes. Die beiden ל־Pronomina sollten im Deutschen jedoch nicht ohne Präzisierung gleich mit einem bloßen Dativ wiedergegeben werden: besonders „mein Bund bleibt ihm treu“ verschiebt die Aussage zu einer im Deutschen ungewöhnlichen personalen Loyalität des Bundes.'
  naturalness: „Für immer bewahre ich ihm meine beständige Liebe“ ist verständlich, aber die Dativfügung mit „bewahren“ wirkt im modernen Standarddeutsch markiert. „Mein Bund bleibt ihm treu“ ist zwar als Personifikation möglich, aber weniger idiomatisch und für die Bedeutung ‚verlässlich/fest für bzw. ihm gegenüber‘ zu eng. Die Revision wahrt den poetischen Ton und formuliert beide Beziehungen natürlich.
  terminology: „Bund“ ist für בְּרִית zutreffend. „Beständige Liebe“ ist eine vertretbare moderne Wiedergabe von חֶסֶד; sie sollte beibehalten werden. „Verlässlich“ gibt נֶאֱמֶנֶת ohne die unnatürliche Personifikation als ‚treu‘ wieder. Die Fußnote hält die sachlich möglichen Nuancen ‚feststehen‘ und ‚zuverlässig sein‘ offen.
