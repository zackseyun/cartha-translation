source:
  edition: WLC
  text: לְ֭/עוֹלָ֗ם אשמור ל֣/וֹ חַסְדִּ֑/י וּ֝/בְרִיתִ֗/י נֶאֱמֶ֥נֶת לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/028.yaml
  text: Forever I will keep my steadfast love for him[a], and my covenant will remain faithful to him.
translation:
  language: de
  text: Für immer werde ich meine beständige Liebe für ihn bewahren, und mein Bund wird ihm gegenüber verlässlich sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und mein Bund wird für ihn feststehen“; auch: „und mein Bund wird für ihn zuverlässig sein“.'
    reason: Die Form נֶאֱמֶנֶת kann Verlässlichkeit, Festigkeit und gesicherten Bestand bezeichnen. Das לּוֹ lässt sich relational („ihm gegenüber“) oder begünstigend („für ihn“) verstehen.
lexical_decisions:
- source_word: לְעוֹלָם
  choice: Für immer
  rationale: Die Präposition ל mit עוֹלָם bezeichnet eine unbegrenzte Dauer. „Für immer“ ist im modernen Deutsch natürlich und gibt die bleibende Geltung der Zusage wieder.
- source_word: אֶשְׁמֹר
  choice: bewahre ich
  rationale: שׁמר bezeichnet hier das Bewahren oder Aufrechterhalten. „Bewahren“ verbindet sich natürlich mit Gottes beständiger Liebe und erhält den Gedanken aktiver Treue.
- source_word: לוֹ
  choice: ihm
  rationale: לּוֹ bezeichnet in beiden Satzteilen die auf den davidischen König gerichtete Beziehung beziehungsweise Zuwendung. Der deutsche Dativ gibt dies knapp und natürlich wieder.
- source_word: חַסְדִּי
  choice: meine beständige Liebe
  rationale: חֶסֶד umfasst liebevolle Zuwendung, Loyalität und Verlässlichkeit. „Beständige Liebe“ bewahrt sowohl den Beziehungscharakter als auch die dauerhafte Treue, ohne eine konfessionell geprägte Deutung einzutragen.
- source_word: וּבְרִיתִי
  choice: und mein Bund
  rationale: בְּרִית ist der übliche Ausdruck für einen verbindlichen Bund, hier im Zusammenhang der Zusage an David und sein Haus.
- source_word: נֶאֱמֶנֶת
  choice: bleibt treu
  rationale: Das feminine Partizip Niphal von אמן stimmt mit בְּרִית überein und bezeichnet Festigkeit, Zuverlässigkeit oder Treue. „Bleibt treu“ ist idiomatisch, wahrt die personifizierende Aussage über den Bund und lässt die Bedeutungsbreite in einer Fußnote erkennen.
theological_decisions:
- issue: Bundessprache ohne Vorwegnahme ihrer messianischen Erfüllung
  choice: Das Pronomen „ihm“ bleibt auf den im Psalm angesprochenen davidischen König bezogen, ohne im Wortlaut ausdrücklich eine spätere christologische Identifikation einzusetzen.
  alternative: Den Vers im Haupttext ausdrücklich auf den Messias beziehen.
  rationale: Der hebräische Vers spricht unmittelbar von Gottes Liebe und Bund gegenüber „ihm“. Die weitere kanonische und messianische Bedeutung soll nicht durch zusätzliche Benennungen in den Übersetzungstext eingetragen werden.
- issue: Treue als Eigenschaft des Bundes
  choice: „Mein Bund bleibt ihm treu“ erhält die grammatische Zuordnung von נֶאֱמֶנֶת zu „mein Bund“.
  alternative: „Mein Bund steht für ihn fest“ oder „mein Bund ist für ihn zuverlässig“.
  rationale: Der hebräische Wortlaut kann Festigkeit, Verlässlichkeit und Treue ausdrücken. Die gewählte Fassung bewahrt die theologische Spannung, dass Gottes Bund selbst als treu bezeichnet wird, statt sie ausschließlich als Bestandsgarantie aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt dem poetischen Nachdruck auf „Für immer“, ohne unnötige Archaismen. „Beständige Liebe“ macht die Dauer und Loyalität von חֶסֶד verständlich, während die Fußnote die echte Bedeutungsbreite der zweiten Vershälfte offenhält.
