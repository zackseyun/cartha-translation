  text: וְ֭/חַסְדִּ/י לֹֽא אָפִ֣יר מֵֽ/עִמּ֑/וֹ וְ/לֹֽא אֲ֝שַׁקֵּ֗ר בֶּ/אֱמוּנָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/033.yaml
  text: But my steadfast love I will not remove from him[b][a], nor will I deal falsely in my faithfulness.
translation:
  language: de
  text: Doch meine beständige Liebe[a] werde ich ihm nicht entziehen, und meine Treue werde ich nicht verleugnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine loyale Liebe“, „meine Bundestreue“ oder „meine Güte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und ich werde in meiner Treue nicht falsch handeln“.'
    reason: translation_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: meine beständige Liebe
  rationale: חֶסֶד bezeichnet hier Gottes dauerhafte, verlässliche und bundestreue Zuwendung. „Beständige Liebe“ verbindet Zuneigung mit Dauerhaftigkeit, ohne die Bedeutung auf bloßes Erbarmen zu verengen.
- source_word: אָפִיר
  choice: werde ich … nicht entziehen
  rationale: Das Hifil von פור bezeichnet hier das Wegnehmen oder Zurückziehen. „Entziehen“ passt natürlich zur Verbindung mit מֵעִמּוֹ und drückt den möglichen Entzug göttlicher Zuwendung aus.
- source_word: מֵעִמּוֹ
  choice: ihm
  rationale: In Verbindung mit „entziehen“ wird die hebräische Trennungskonstruktion מֵעִמּוֹ im Deutschen idiomatisch durch den Dativ „ihm“ wiedergegeben.
- source_word: אֲשַׁקֵּר
  choice: werde ich nicht untreu werden
  rationale: Das Piel von שׁקר kann ein falsches oder treuloses Handeln bezeichnen. Zusammen mit בֶּאֱמוּנָתִי gibt „meiner Treue … untreu werden“ den Sinn natürlich wieder und beschränkt ihn nicht auf eine bloße Falschaussage.
- source_word: בֶּאֱמוּנָתִי
  choice: meiner Treue
  rationale: אֱמוּנָה bezeichnet hier Verlässlichkeit oder Treue. Der deutsche Dativ nach „untreu werden“ gibt die Beziehung idiomatisch wieder, auch wenn die hebräische Präposition ב formal offener ist.
- source_word: וְ
  choice: Doch … und
  rationale: Das erste וְ hat im Zusammenhang mit den vorausgehenden Strafankündigungen kontrastive Kraft und wird daher mit „Doch“ wiedergegeben; das zweite verbindet die parallelen Aussagen mit „und“.
theological_decisions:
- issue: Bundestreue Gottes trotz Züchtigung des davidischen Königs
  choice: „beständige Liebe“ und „Treue“ bewahren die Aussage, dass Gottes Züchtigung seine verlässliche Zuwendung nicht aufhebt.
  alternative: „Gnade“ und „Wahrheit“ in traditioneller Ausdrucksweise
  rationale: Die gewählte Formulierung hält die Spannung zwischen angekündigter Strafe und fortdauernder göttlicher Bindung fest, ohne spätere systematische Kategorien in den Vers einzutragen.
- issue: Verhältnis Gottes zu seiner eigenen Treue
  choice: „meiner Treue werde ich nicht untreu werden“
  alternative: „ich werde in meiner Treue nicht falsch handeln“
  rationale: Die gewählte Wiedergabe ist im modernen Deutschen natürlicher und erhält den Gedanken, dass Gott seiner eigenen Verlässlichkeit nicht zuwiderhandelt. Die alternative, formal nähere Fassung bleibt als Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelstruktur des Hebräischen bleibt erkennbar; idiomatische deutsche Rektion hat Vorrang vor einer mechanischen Abbildung der Präpositionen. Beide Fußnotenmarker stehen an der jeweils einschlägigen Stelle im Haupttext.
