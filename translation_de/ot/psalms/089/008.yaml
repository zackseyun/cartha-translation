source:
  edition: WLC
  text: יְהוָ֤ה אֱלֹ֘הֵ֤י צְבָא֗וֹת מִֽי כָֽמ֖וֹ/ךָ חֲסִ֥ין יָ֑הּ וֶ֝/אֱמֽוּנָתְ/ךָ֗ סְבִיבוֹתֶֽי/ךָ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/008.yaml
  text: O Yahweh[a], God of hosts, who is mighty like you, O Yah? Your faithfulness surrounds you.
translation:
  language: de
  text: Jahwe, Gott der Heerscharen, wer ist wie du, mächtiger Jah[a]? Und deine Treue umgibt dich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jah“ ist die hebräische Kurzform des Gottesnamens „Jahwe“; viele Übersetzungen geben sie hier mit „HERR“ wieder.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „HERR“ ersetzt.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Gott der Heerscharen
  rationale: Die etablierte, würdige Wendung bewahrt die Bedeutungsbreite von צְבָאוֹת, ohne ausschließlich irdische oder himmlische Heere festzulegen.
- source_word: מִי כָמוֹךָ חֲסִין
  choice: wer ist so mächtig wie du
  rationale: Die rhetorische Frage drückt Gottes Unvergleichlichkeit aus; „so mächtig wie du“ verbindet חֲסִין natürlich mit der Vergleichsformel.
- source_word: יָהּ
  choice: Jah
  rationale: Die Kurzform des Gottesnamens bleibt von der Vollform יְהוָה unterschieden und wird als Anrede verstanden.
- source_word: וֶאֱמוּנָתְךָ
  choice: Deine Treue
  rationale: אֱמוּנָה bezeichnet hier Gottes Verlässlichkeit und Beständigkeit; „Treue“ ist im Deutschen prägnant und kontextgerecht.
- source_word: סְבִיבוֹתֶיךָ
  choice: umgibt dich
  rationale: Die räumliche Aussage „rings um dich“ wird als natürliches deutsches Prädikat formuliert und bewahrt das Bild der umgebenden Treue.
theological_decisions:
- issue: Unterscheidung zwischen יְהוָה und der Kurzform יָהּ im selben Vers
  choice: יְהוָה als „Jahwe“ und יָהּ als „Jah“ wiedergeben
  alternative: Beide Formen mit „HERR“ oder beide mit „Jahwe“ wiedergeben
  rationale: Die unterschiedliche Form der beiden Gottesnamen ist im Hebräischen ausdrücklich vorhanden und bleibt in der Übersetzung sichtbar, ohne sie theologisch einzuebnen.
translation_notes:
  register: Moderne, verständliche und zugleich poetisch-würdige Standardsprache. Die traditionelle Wendung „Gott der Heerscharen“ wurde wegen ihrer Bedeutungsbreite beibehalten; die Satzstellung der rhetorischen Frage ist natürlich deutsch formuliert.
