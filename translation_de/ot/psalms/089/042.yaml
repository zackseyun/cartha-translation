source:
  edition: WLC
  text: הֲ֭רִימוֹתָ יְמִ֣ין צָרָ֑י/ו הִ֝שְׂמַ֗חְתָּ כָּל אוֹיְבָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/042.yaml
  text: You have exalted the right hand of his foes[a]; you have made all his enemies rejoice.
translation:
  language: de
  text: Du hast die rechte Hand seiner Gegner erhoben[a]; du hast alle seine Feinde erfreut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Du hast die rechte Hand seiner Widersacher erhoben.'
    reason: Lexikalische Alternative für צָרָיו; das Bild der erhobenen rechten Hand bleibt erhalten.
lexical_decisions:
- source_word: הֲרִימוֹתָ
  choice: hast … erhoben
  rationale: Das Hifil Perfekt 2. Person maskulin Singular von רום bedeutet, etwas emporzuheben oder zu erhöhen. Zusammen mit »rechte Hand« bewahrt »erhoben« das hebräische Bild und bezeichnet sinngemäß die verliehene Macht oder Überlegenheit.
- source_word: יְמִין
  choice: die rechte Hand
  rationale: Das Substantiv bezeichnet gewöhnlich die rechte Hand und steht häufig bildlich für Kraft und Macht. Die direkte Wiedergabe erhält diese Bildsprache.
- source_word: צָרָיו
  choice: seiner Bedränger
  rationale: צָר bezeichnet feindliche Gegner oder Bedränger. »Bedränger« passt zum Klagekontext und unterscheidet den Ausdruck vom folgenden אוֹיְבָיו, ohne einen übermäßigen Bedeutungsunterschied zu behaupten.
- source_word: הִשְׂמַחְתָּ
  choice: hast … jubeln lassen
  rationale: Das Hifil Perfekt von שׂמח ist kausativ. »Jubeln lassen« gibt verständlich wieder, dass Gott den Feinden Anlass zur Freude gegeben hat.
- source_word: כָּל
  choice: alle
  rationale: Mit dem pluralischen Substantiv ist »alle« die natürliche deutsche Wiedergabe.
- source_word: אוֹיְבָיו
  choice: seine Feinde
  rationale: Das gebräuchliche Wort für feindlich Gesinnte wird direkt mit »Feinde« wiedergegeben.
theological_decisions:
- issue: Bezug der Suffixe in צָרָיו und אוֹיְבָיו
  choice: Wiedergabe mit »seiner/seine«; Bezug auf den davidischen König beziehungsweise Gesalbten im unmittelbaren Kontext des Psalms.
  alternative: Eine allgemeinere Formulierung, die den Bezug in der Übersetzung nicht erkennen lässt.
  rationale: Beide Suffixe stehen in der 3. Person maskulin Singular. Die Übersetzung bewahrt diesen grammatischen Bezug, ohne die Spannung zwischen Gottes Verheißung und der gegenwärtigen Erniedrigung des Gesalbten theologisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelstruktur bleibt erhalten; »Bedränger« und »Feinde« spiegeln die beiden nahe verwandten hebräischen Bezeichnungen wider. Das Bild der rechten Hand wird im Haupttext nicht aufgelöst.
