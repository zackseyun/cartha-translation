source:
  edition: WLC
  text: וְ/אַתָּ֣ה זָ֭נַחְתָּ וַ/תִּמְאָ֑ס הִ֝תְעַבַּ֗רְתָּ עִם מְשִׁיחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/038.yaml
  text: But you have cast off and rejected[a]; you have become enraged with your anointed one.
translation:
  language: de
  text: Doch du hast ihn verstoßen und verworfen; du bist zornig geworden auf deinen Gesalbten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „deinen Gesalbten“ oder „deinen Messias“. Dasselbe Wort wird auch mit „Messias“ wiedergegeben; hier bezeichnet es zunächst den davidischen König im Rahmen des Bundes Gottes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Doch du
  rationale: Die Konjunktion zusammen mit dem selbstständigen Pronomen leitet nach den vorausgehenden Zusagen einen starken Gegensatz ein; „Doch du“ gibt diesen rhetorischen Umschwung natürlich wieder.
- source_word: זָנַחְתָּ
  choice: hast ihn verstoßen
  rationale: Das Verb bezeichnet das Verwerfen oder Wegstoßen. Das im Hebräischen nicht ausdrücklich genannte Objekt wird im Deutschen aus „deinen Gesalbten“ ergänzt, damit die koordinierte Aussage verständlich bleibt.
- source_word: וַ/תִּמְאָס
  choice: und verworfen
  rationale: Das Verb bezeichnet ablehnendes Verwerfen und verstärkt zusammen mit זנח die Klage. Die Doppelung bleibt erhalten.
- source_word: הִתְעַבַּרְתָּ
  choice: bist zornig geworden
  rationale: Der Hitpael von עבר drückt hier ein Entbrennen oder Geraten in heftigen Zorn aus. „Zornig geworden“ bewahrt sowohl die Zustandsveränderung als auch den würdigen Klagecharakter.
- source_word: עִם
  choice: auf
  rationale: Wörtlich steht „mit“; im Deutschen ist bei „zornig werden“ die Verbindung „auf jemanden“ idiomatisch und bezeichnet die Zielrichtung des Zorns, ohne sie weiter auszudeuten.
- source_word: מְשִׁיחֶךָ
  choice: deinen Gesalbten
  rationale: Das Wort bezeichnet unmittelbar den von Gott gesalbten davidischen König. „Gesalbter“ erhält zugleich die lexikalische Verbindung zum Titel „Messias“, ohne im Haupttext eine weitergehende Identifikation festzulegen.
theological_decisions:
- issue: Wiedergabe von מְשִׁיחֶךָ in einer Königsklage mit messianischem Bedeutungsraum
  choice: deinen Gesalbten
  alternative: deinen Messias
  rationale: Im unmittelbaren Zusammenhang ist der davidische König als Gottes Gesalbter gemeint. Da dasselbe hebräische Wort auch dem Titel „Messias“ zugrunde liegt, wird diese Verbindung in einer Fußnote kenntlich gemacht, aber im Haupttext nicht vereindeutigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die scharfe adversative Wendung und die intensivierende Verbfolge der hebräischen Klage bleiben erhalten; die messianische Spannung wird nicht aufgelöst.
