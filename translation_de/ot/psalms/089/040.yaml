source:
  edition: WLC
  text: פָּרַ֥צְתָּ כָל גְּדֵרֹתָ֑י/ו שַׂ֖מְתָּ מִבְצָרָ֣י/ו מְחִתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/040.yaml
  text: You have broken down all his walls[c][b][a]; you have made his strongholds a ruin.
translation:
  language: de
  text: Du hast alle seine Mauern durchbrochen[a]; du hast seine Festungen[b] in Trümmer gelegt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „niedergerissen“ beziehungsweise „eine Bresche in … geschlagen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine befestigten Orte“ oder „seine Bollwerke“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher auch: „zur Verwüstung gemacht“. Das hebräische Wort kann je nach Zusammenhang auch Zerschmetterung, Schrecken oder Entsetzen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַצְתָּ
  choice: hast … durchbrochen
  rationale: Das Verb פרץ bezeichnet ein Durchbrechen oder Schlagen einer Bresche. „Durchbrochen“ bewahrt das Bild zerstörter Verteidigungsanlagen und ist im Deutschen natürlich.
- source_word: כָל
  choice: alle
  rationale: Die umfassende Aussage des hebräischen Textes wird unmittelbar beibehalten.
- source_word: גְּדֵרֹתָיו
  choice: seine Mauern
  rationale: גְּדֵרָה kann eine Mauer, einen Zaun, eine Hecke oder allgemein eine Einfriedung bezeichnen. Im Parallelismus mit den Festungen liegt hier die schützende beziehungsweise defensive Funktion nahe.
- source_word: שַׂמְתָּ
  choice: hast … gelegt
  rationale: שׂים bedeutet grundsätzlich „setzen, stellen, legen, machen“. Die deutsche Wendung „in Trümmer legen“ gibt die prädikative Konstruktion idiomatisch wieder.
- source_word: מִבְצָרָיו
  choice: seine Festungen
  rationale: מִבְצָר bezeichnet befestigte Orte oder Bollwerke. „Festungen“ ist konkret, verständlich und passt zum poetischen Parallelismus.
- source_word: מְחִתָּה
  choice: in Trümmer
  rationale: Das Substantiv kann Verwüstung, Zerschmetterung oder einen Zustand des Ruins ausdrücken; im Zusammenhang zerstörter Verteidigungsanlagen gibt „in Trümmer“ den wahrscheinlichsten Sinn natürlich wieder, ohne die lexikalischen Alternativen zu verschweigen.
theological_decisions:
- issue: Bezug der maskulinen Singularsuffixe in „seine Mauern“ und „seine Festungen“
  choice: Das Pronomen „seine“ bleibt ohne ausdrückliche Bestimmung des Bezugs stehen.
  alternative: Den Bezug im Haupttext als „die Mauern des Königs“ oder als die Verteidigungsanlagen Zions beziehungsweise Jerusalems auslegen.
  rationale: Der unmittelbare Kontext beklagt den Sturz des davidischen Gesalbten, doch der hebräische Vers nennt den Bezug nicht ausdrücklich. Die Übersetzung bewahrt daher die poetische und theologische Offenheit.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer poetischer Parallelstruktur. Das Semikolon spiegelt die zwei parallelen hebräischen Teilsätze. Die maskulinen Singularpronomen werden nicht erklärend aufgelöst.
