id: PSA.89.10
reference: Psalms 89:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַתָּ֤ה דִכִּ֣אתָ כֶ/חָלָ֣ל רָ֑הַב בִּ/זְר֥וֹעַ עֻ֝זְּ/ךָ֗ פִּזַּ֥רְתָּ אוֹיְבֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/010.yaml
  text: You crushed Rahab like one slain[a]; with your mighty arm you scattered your enemies.
translation:
  language: de
  text: Du hast Rahab zerschmettert wie einen Erschlagenen[a]; mit deinem mächtigen Arm hast du deine Feinde zerstreut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahab ist ein poetischer Name, der Ägypten oder ein von Gott besiegtes Chaosungeheuer beziehungsweise eine Chaosmacht bezeichnen kann.
    reason: alternative_reading
lexical_decisions:
- source_word: דִכִּאתָ
  choice: zerschmettert
  rationale: Das Verb bezeichnet ein gewaltsames Zerschlagen oder Zermalmen. „Zerschmettert“ gibt die kraftvolle Bildsprache im Deutschen anschaulich wieder.
- source_word: כֶחָלָל
  choice: wie einen Erschlagenen
  rationale: Das Präfix כ kennzeichnet einen Vergleich; חָלָל bezeichnet häufig einen im Kampf Durchbohrten oder Erschlagenen. Die Formulierung bewahrt den Vergleich und den Singular.
- source_word: רָהַב
  choice: Rahab
  rationale: Der poetische Eigenname beziehungsweise Titel kann Ägypten bezeichnen und zugleich eine besiegte Chaosmacht anklingen lassen. Die Transliteration hält diese Mehrdeutigkeit offen.
- source_word: בִּזְרוֹעַ עֻזְּךָ
  choice: mit deinem mächtigen Arm
  rationale: Die instrumentale Wendung wird natürlich wiedergegeben und bewahrt sowohl das anthropomorphe Bild als auch den Gedanken göttlicher Macht.
- source_word: פִּזַּרְתָּ
  choice: zerstreut
  rationale: Das Verb bedeutet unmittelbar „zerstreuen“ oder „auseinandertreiben“. „Zerstreut“ vermeidet eine zusätzliche militärische Präzisierung.
- source_word: אוֹיְבֶיךָ
  choice: deine Feinde
  rationale: Dies ist die direkte und im modernen Standarddeutsch natürliche Wiedergabe des possessiven Plurals.
theological_decisions:
- issue: Identität von רָהַב im poetischen Zusammenhang
  choice: „Rahab“ bleibt im Haupttext als poetischer Name der von Gott besiegten kosmischen oder politischen Gegenmacht stehen.
  alternative: Direkte Wiedergabe als „Ägypten“ oder als mythisches Seeungeheuer beziehungsweise Chaosmacht.
  rationale: Der Name kann poetisch auf Ägypten verweisen und zugleich die Vorstellung einer Chaosmacht aufrufen. Eine eindeutige Auflösung im Haupttext würde die echte Mehrdeutigkeit und theologische Spannung des hebräischen Bildes beseitigen.
translation_notes:
  register: Modernes, gehobenes und zugleich gut verständliches Standarddeutsch. Die Parallelstruktur und die kraftvolle poetische Bildsprache des Hebräischen bleiben erhalten.
