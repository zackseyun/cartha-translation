  text: Then I will punish their transgression with the rod[a], and their iniquity with blows.
translation:
  language: de
  text: Dann werde ich ihr Vergehen mit der Rute ahnden[a] und ihre Schuld mit Schlägen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Dann werde ich ihr Vergehen mit der Rute heimsuchen und ihre Schuld mit Schlägen.“ Das hebräische Verb kann „aufsuchen/heimsuchen“ und in diesem Zusammenhang „ahnden“ bedeuten; das mit „Schlägen“ wiedergegebene Wort kann auch „Plagen“ oder „Heimsuchungen“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: Dann werde ich … ahnden
  rationale: פקד kann „aufsuchen“, „sich annehmen“ oder im strafenden Sinn „ahnden“ bedeuten. Die Rute und die Schläge machen hier den strafenden Sinn deutlich. „Dann“ gibt den Folgezusammenhang mit der vorausgehenden Bedingung natürlich wieder.
- source_word: בְשֵׁבֶט
  choice: mit der Rute
  rationale: שׁבט kann Rute, Stab oder Zepter bezeichnen. Hier steht das Wort für ein Mittel der Züchtigung, nicht für königliche Herrschaft; „Rute“ bewahrt dieses Bild im Deutschen.
- source_word: פִּשְׁעָם
  choice: ihre Vergehen
  rationale: פשׁע bezeichnet Übertretung oder Auflehnung. „Vergehen“ ist verständlich, bewahrt den moralischen Ernst und legt den politischen Aspekt von „Auflehnung“ nicht unnötig fest.
- source_word: וּבִנְגָעִים
  choice: und … mit Schlägen
  rationale: נגעים kann Schläge, Plagen oder Heimsuchungen bezeichnen. Im Parallelismus zur Rute passt „Schläge“ am besten zur konkreten Strafbildlichkeit, ohne die Bedeutung auf Krankheit zu verengen.
- source_word: עֲוֺנָם
  choice: ihre Schuld
  rationale: עון kann Schuld, Verfehlung oder deren Folgen bezeichnen. „Schuld“ ist im modernen Deutschen natürlich und wahrt das moralische Gewicht sowie den poetischen Parallelismus.
theological_decisions:
- issue: Art der göttlichen Reaktion auf die Sünde der Bundesangehörigen
  choice: Die konkrete Sprache von Rute und Schlägen wird als wirkliche strafende Züchtigung wiedergegeben.
  alternative: Die Aussage könnte durch Wörter wie „korrigieren“ oder ein neutrales „heimsuchen“ abgeschwächt werden.
  rationale: Der unmittelbare Wortlaut verlangt eine ernsthafte Strafankündigung. Ob diese Strafe zur endgültigen Verwerfung führt, wird in diesem Vers nicht entschieden; die Spannung des weiteren Psalmzusammenhangs bleibt bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelstruktur. „Ahnden“ ist gehoben, aber allgemein verständlich; „Rute“ erhält das konkrete antike Züchtigungsbild.
