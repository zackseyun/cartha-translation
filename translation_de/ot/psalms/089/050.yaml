source:
  edition: WLC
  text: זְכֹ֣ר אֲ֭דֹנָ/י חֶרְפַּ֣ת עֲבָדֶ֑י/ךָ שְׂאֵתִ֥/י בְ֝/חֵיקִ֗/י כָּל רַבִּ֥ים עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/050.yaml
  text: Remember[a], Lord, the reproach of your servants[b], which I bear in my bosom from many peoples.
translation:
  language: de
  text: Denk daran, Herr, an die Schmach deiner Diener, die ich an meiner Brust[a] trage – den Hohn vieler Völker[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „An meiner Brust tragen“ ist ein hebräisches Bild dafür, etwas persönlich und unmittelbar zu tragen.
    reason: cultural_note
  - marker: b
    text: 'Die verdichtete hebräische Schlussformulierung kann den Hohn als von vielen Völkern kommend bezeichnen. Sie kann auch verstanden werden als: „die Schmach all der vielen Völker, die ich an meiner Brust trage.“'
    reason: alternative_reading
lexical_decisions:
- source_word: זְכֹר
  choice: Denk daran
  rationale: Der Imperativ von זכר ist eine unmittelbare Bitte an Gott. „Denk daran“ ist in modernem Deutsch natürlich und bewahrt den Gebetscharakter.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: אֲדֹנָי ist hier die feste Gottesbezeichnung in direkter Anrede; „Herr“ ist die angemessene deutsche Wiedergabe.
- source_word: חֶרְפַּת
  choice: verhöhnt / Hohn
  rationale: חֶרְפָּה umfasst Schmach, Hohn und entehrende Beschimpfung. „Hohn“ und die verbale Form „verhöhnt werden“ geben den Klagecharakter in natürlichem Deutsch wieder.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: Im Gebetszusammenhang bezeichnet עבד die Gott zugehörigen und ihm dienenden Menschen; „Diener“ ist hier treffender als „Sklaven“.
- source_word: שְׂאֵתִי
  choice: ich trage
  rationale: Die Form von נשׂא bezeichnet das Tragen beziehungsweise Ertragen einer Last. „Ich trage“ erhält sowohl das Bild als auch die persönliche Belastung.
- source_word: בְּחֵיקִי
  choice: an meiner Brust
  rationale: חֵיק bezeichnet Brust, Schoß oder den körpernahen Bereich. „An meiner Brust“ bewahrt das konkrete Bild und klingt im heutigen Deutschen natürlicher als „in meinem Busen“.
- source_word: כָּל רַבִּים עַמִּים
  choice: so vieler Völker
  rationale: Die hebräische Wortfolge ist stark verdichtet und syntaktisch schwierig. „So vieler Völker“ bewahrt den Plural עמים und lässt den Hohn als umfassende, von vielen Völkern ausgehende Belastung verstehen.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung אֲדֹנָי
  choice: Herr
  alternative: mein Herr
  rationale: Die Form fungiert hier als feststehender Gottestitel. „Herr“ vermeidet eine unnötige possessive Festlegung.
- issue: Zuordnung der verdichteten Schlussphrase כָּל רַבִּים עַמִּים
  choice: Der Sprecher trägt den Hohn so vieler Völker
  alternative: Der Sprecher trägt den von vielen Völkern kommenden Hohn beziehungsweise die Schmach aller der vielen Völker
  rationale: Die Syntax nach „an meiner Brust“ ist mehrdeutig. Der Haupttext gibt eine natürliche deutsche Lesart, während die Fußnote die echte grammatische Alternative offenhält.
translation_notes:
  register: Modernes, würdiges Klage- und Gebetsdeutsch. Der Gedankenstrich bildet den Wechsel von der Bitte zur persönlichen Klage ab. Das körpernahe hebräische Bild bleibt erhalten; die syntaktische Mehrdeutigkeit der Schlussphrase wird nicht dogmatisch aufgelöst.
