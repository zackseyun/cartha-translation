lexical_decisions:
- source_word: הִקְצַרְתָּ
  choice: du hast verkürzt
  rationale: Das Hifil von קצר bedeutet »kurz machen, verkürzen«. Das deutsche Perfekt gibt die vollzogene Handlung mit ihrer gegenwärtigen Auswirkung natürlich wieder.
- source_word: יְמֵי
  choice: die Tage
  rationale: Der Konstruktus Plural bedeutet wörtlich »die Tage von« und kann eine Lebensphase bezeichnen. Die Wiedergabe bewahrt das hebräische Bild.
- source_word: עֲלוּמָיו
  choice: seiner Jugend
  rationale: Das Substantiv bezeichnet die Jugend beziehungsweise Jugendzeit. »Seiner Jugend« ist direkt, verständlich und lässt den männlichen singularischen Bezug unbestimmt.
- source_word: הֶעֱטִיתָ
  choice: du hast bedeckt
  rationale: Das Hifil von עטה kann »bedecken, umhüllen, bekleiden« bedeuten. Mit »Schande« ergibt »mit Schande bedecken« eine natürliche deutsche Wendung.
- source_word: עָלָיו
  choice: ihn
  rationale: Die Präposition bedeutet wörtlich »auf/über ihm«. In der deutschen Fügung »jemanden mit etwas bedecken« wird diese Beziehung idiomatisch durch das Akkusativobjekt ausgedrückt.
- source_word: בּוּשָׁה
  choice: Schande
  rationale: Das Wort bezeichnet Scham oder Schande. In diesem Kontext betont »Schande« die von außen sichtbare Entehrung und passt idiomatisch zu »bedeckt«.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und genaue liturgische Funktion des Ausdrucks unsicher sind, wird er in der traditionellen Form transliteriert.
theological_decisions:
- issue: Bezug der männlichen Singularsuffixe in »seiner Jugend« und »ihn«
  choice: Die männlichen Singularpronomen bleiben erhalten, ohne ihren Bezug näher zu bestimmen.
  alternative: Den Bezug ausdrücklich als davidischen König, davidische Dynastie oder personifizierten Gesalbten deuten.
  rationale: Der Zusammenhang weist auf den erniedrigten gesalbten König beziehungsweise die Dynastie, doch der Vers selbst nennt den Bezug nicht ausdrücklich. Die Übersetzung bewahrt daher die poetische und theologische Offenheit.
translation_notes:
  register: Moderne, allgemein verständliche und zugleich würdevolle Psalmsprache. Der parallele Satzbau und das konkrete Bild des Hebräischen bleiben erhalten; »Sela« wird nicht gedeutet.
