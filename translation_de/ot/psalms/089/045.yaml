  text: הִ֭קְצַרְתָּ יְמֵ֣י עֲלוּמָ֑י/ו הֶֽעֱטִ֨יתָ עָלָ֖י/ו בּוּשָׁ֣ה סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/045.yaml
  text: You have shortened the days of his youth; you have covered him with shame[a]. Selah
translation:
  language: de
  text: Du hast die Tage seiner Jugend verkürzt; du hast ihn mit Schande bedeckt.[a] Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »du hast ihn mit Schande bekleidet.«'
