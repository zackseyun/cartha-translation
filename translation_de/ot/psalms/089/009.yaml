id: PSA.89.9
reference: Psalms 89:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַתָּ֣ה מ֭וֹשֵׁל בְּ/גֵא֣וּת הַ/יָּ֑ם בְּ/שׂ֥וֹא גַ֝לָּ֗י/ו אַתָּ֥ה תְשַׁבְּחֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/009.yaml
  text: You rule over the swelling of the sea[a]; when its waves rise[b], you still them.
translation:
  language: de
  text: Du herrschst über das Aufbrausen des Meeres[a]; wenn sich seine Wellen erheben, bringst du sie zur Ruhe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »über den Stolz/die Hoheit des Meeres«. Das hebräische Wort kann Erhabenheit, Stolz oder ein Anschwellen bezeichnen; im Zusammenhang passt das Bild des aufbrausenden Meeres.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »beruhigst du sie«, »stillst du sie« oder »bändigst du sie«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: herrschst
  rationale: Das Partizip bezeichnet Gottes fortdauernde souveräne Herrschaft; das Präsens gibt dies im Deutschen natürlich und prägnant wieder.
- source_word: בְּגֵאוּת הַיָּם
  choice: über das Aufbrausen des Meeres
  rationale: גֵּאוּת kann Erhabenheit, Stolz oder ein Anschwellen bezeichnen. Im Zusammenhang mit Meer und Wellen vermittelt »Aufbrausen« die konkrete, dynamische Bildsprache; בְּ wird bei מוֹשֵׁל idiomatisch mit »über« wiedergegeben.
- source_word: בְּשׂוֹא גַלָּיו
  choice: wenn sich seine Wellen erheben
  rationale: Die Infinitivkonstruktion bezeichnet den Umstand beziehungsweise Zeitpunkt des Sich-Erhebens der Wellen. Die reflexive Form ist natürliches Deutsch und bewahrt das poetische Bild.
- source_word: תְשַׁבְּחֵם
  choice: bringst du sie zur Ruhe
  rationale: Das Piel von שׁבח bedeutet hier, die aufgewühlten Wellen zu beruhigen, zu stillen oder zu bändigen. »Zur Ruhe bringen« ist klar, würdig und lässt die benachbarten Bedeutungsnuancen offen.
theological_decisions:
- issue: Gottes Souveränität über die chaotischen Wasser
  choice: Der Vers bekräftigt unmittelbar Gottes Herrschaft über das Meer und seine Wellen.
  alternative: Die Aussage kann als mythopoetische Anspielung auf Gottes Sieg über kosmisches Chaos verstanden werden.
  rationale: Die Übersetzung bewahrt das konkrete poetische Bild, ohne einen umfassenderen mythologischen Deutungsrahmen in den Haupttext einzutragen. Ein möglicher Resonanzraum von Chaos und Gottes Sieg bleibt unausgesprochen und damit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Bildkraft. »Aufbrausen« stellt die Bewegung des Meeres anschaulich dar; »zur Ruhe bringen« ist allgemein verständlich und vermeidet eine unnötige Festlegung zwischen Beruhigen, Stillen und Bändigen.
