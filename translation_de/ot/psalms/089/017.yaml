source:
  edition: WLC
  text: כִּֽי תִפְאֶ֣רֶת עֻזָּ֣/מוֹ אָ֑תָּה וּ֝/בִ/רְצֹנְ/ךָ֗ תרים קַרְנֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/017.yaml
  text: For you are the glory of their strength[b][a], and by your favor you exalt our horn.
translation:
  language: de
  text: Denn du bist der Ruhm[a] ihrer Stärke, und durch deine Gunst erhöhst du unser Horn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: die Pracht, die Herrlichkeit oder die Zierde ihrer Stärke.'
    reason: lexical_alternative
  - marker: b
    text: Das „Horn“ ist ein hebräisches Bild für Stärke, Macht, Würde oder erhöhten Rang.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und gibt den erklärenden Zusammenhang im Deutschen natürlich wieder.
- source_word: תִפְאֶרֶת
  choice: der Ruhm
  rationale: Das Substantiv bezeichnet Ruhm, Pracht, Herrlichkeit oder Zierde. „Ruhm“ ist hier verständlich und lässt offen, ob Gott als Ehre, Glanz oder Zierde ihrer Stärke bezeichnet wird.
- source_word: עֻזָּמוֹ
  choice: ihrer Stärke
  rationale: Das Grundwort bezeichnet Stärke oder Macht; das Suffix steht in der dritten Person Plural. Die Übersetzung bewahrt deshalb den Wechsel von „ihrer“ zu „unser“ im zweiten Halbvers.
- source_word: אָתָּה
  choice: du bist
  rationale: Das selbstständige Pronomen ist betont und bildet mit dem vorausgehenden Nominalausdruck einen Prädikatsatz; im Deutschen wird die Kopula ergänzt.
- source_word: וּבִרְצֹנְךָ
  choice: und durch deine Gunst
  rationale: רָצוֹן kann Gunst, Wohlwollen oder Gefallen bezeichnen. „Durch deine Gunst“ gibt die instrumentale Bedeutung der Präposition wieder und betont Gottes wohlwollendes Handeln.
- source_word: תרים
  choice: erhöhst du
  rationale: Die Hifil-Form von רוּם bedeutet „erhöhen“ oder „emporheben“. „Erhöhst“ passt zum Bild des Horns und bewahrt den gehobenen poetischen Ton.
- source_word: קַרְנֵנוּ
  choice: unser Horn
  rationale: Wörtlich „unser Horn“. Das Bild bezeichnet in hebräischer Dichtung Stärke, Macht, Würde oder erhöhten Rang und wird im Haupttext bewahrt.
theological_decisions:
- issue: Metaphorische Bedeutung des Horns
  choice: Das Bild „unser Horn“ bleibt im Haupttext erhalten.
  alternative: unsere Stärke; unsere Macht; unsere Würde
  rationale: Das Horn ist ein bewusstes hebräisches Bild für Stärke, Macht und erhöhten Rang. Eine Auflösung im Haupttext würde die Bildsprache verengen; eine Fußnote erläutert sie.
- issue: Wechsel zwischen dritter und erster Person Plural
  choice: „ihrer Stärke“ und „unser Horn“ werden entsprechend dem Hebräischen beibehalten.
  alternative: Beide Pronomen zu „unser“ angleichen.
  rationale: Der hebräische Text enthält einen echten Pronomenwechsel. Eine Harmonisierung würde eine nicht ausdrücklich gegebene Deutung in den Text eintragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter hebräischer Bildsprache. Der Pronomenwechsel „ihrer … unser“ bleibt absichtlich stehen; „erhöhst“ trägt den poetischen Ton, ohne das Bild auszudeuten.
