id: PSA.89.5
reference: Psalms 89:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/י֘וֹד֤וּ שָׁמַ֣יִם פִּלְאֲ/ךָ֣ יְהוָ֑ה אַף אֱ֝מֽוּנָתְ/ךָ֗ בִּ/קְהַ֥ל קְדֹשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/005.yaml
  text: The heavens will praise your wonders[a], O Yahweh—indeed, your faithfulness in the assembly of the holy ones.
translation:
  language: de
  text: Die Himmel werden deine Wunder preisen, Jahwe, ja, deine Treue in der Versammlung der Heiligen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „der heiligen Wesen“; im Zusammenhang sind wahrscheinlich himmlische Wesen gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹודוּ
  choice: werden … preisen
  rationale: Das Hifil von ידה bedeutet häufig „preisen“ oder „danken“. Mit den Himmeln als Subjekt und Gottes Wundern als Objekt ist „preisen“ im poetischen Zusammenhang am natürlichsten; die Imperfektform wird hier futurisch wiedergegeben.
- source_word: שָׁמַיִם
  choice: die Himmel
  rationale: Der hebräische Plural wird bewahrt und entspricht dem gehobenen poetischen Sprachgebrauch.
- source_word: פִּלְאֲךָ
  choice: deine Wunder
  rationale: פלא bezeichnet etwas Außergewöhnliches oder Wunderbares; der deutsche Plural gibt den kollektiven Sinn der wunderbaren Taten Gottes passend wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אַף
  choice: ja
  rationale: אַף führt den zweiten Gedanken verstärkend weiter. „Ja“ gibt diese emphatische Verbindung im Deutschen knapp und poetisch wieder.
- source_word: אֱמוּנָתְךָ
  choice: deine Treue
  rationale: אֱמוּנָה bezeichnet hier Gottes Verlässlichkeit und Beständigkeit; „Treue“ ist dafür die klare und etablierte deutsche Entsprechung.
- source_word: בִּקְהַל
  choice: in der Versammlung
  rationale: קהל bezeichnet eine zusammengekommene Gemeinschaft. „Versammlung“ bewahrt dieses konkrete Bild.
- source_word: קְדֹשִׁים
  choice: der Heiligen
  rationale: קְדֹשִׁים kann heilige Menschen oder himmlische Wesen bezeichnen. „Heilige“ erhält die Offenheit des Ausdrucks, während der Zusammenhang eine himmlische Versammlung nahelegt.
theological_decisions:
- issue: Bezug von קְדֹשִׁים („die Heiligen“)
  choice: Neutral als „die Heiligen“ wiedergegeben; wahrscheinlich sind himmlische Wesen gemeint.
  alternative: „die Engel“ oder „die heiligen Wesen“
  rationale: Der unmittelbare Zusammenhang spricht von den Himmeln und der himmlischen Ratsversammlung. Dennoch bezeichnet das hebräische Wort nicht ausdrücklich Engel; daher bleibt die Übersetzung bewusst weiter gefasst.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die Wortstellung bleibt gut verständlich und bewahrt den Parallelismus zwischen Gottes Wundern und seiner Treue. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Ausdruck „Heiligen“.
