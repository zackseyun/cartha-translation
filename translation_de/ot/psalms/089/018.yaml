  text: For our shield belongs to Yahweh[a], and our king to the Holy One of Israel.
translation:
  language: de
  text: Denn dem HERRN gehört unser Schild[a] und dem Heiligen Israels unser König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn unser Schild gehört dem HERRN, unser König dem Heiligen Israels.“ Im Hebräischen steht kein Verb; die Zugehörigkeitsbeziehung ergibt sich aus den parallelen Präpositionalverbindungen.'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Lobpreis und das Vertrauen ein, ohne die Aussage unnötig zu verstärken.
- source_word: לַיהוָה
  choice: dem HERRN gehört
  rationale: Die Präposition ל bezeichnet hier am ehesten Zugehörigkeit oder Beziehung. „Gehört“ ergänzt die elliptische hebräische Formulierung natürlich; der Gottesname יהוה wird entsprechend der deutschen Bibeltradition mit „HERR“ wiedergegeben.
- source_word: מָגִנֵּנוּ
  choice: unser Schild
  rationale: Die konkrete und im Psalter geläufige Schutzmetapher bleibt erhalten, statt sie mit „Beschützer“ aufzulösen.
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: und dem Heiligen Israels
  rationale: Die zweite ל-Verbindung steht parallel zur ersten und bezeichnet ebenfalls Zugehörigkeit oder Beziehung. Der feste Gottestitel wird wörtlich und würdevoll wiedergegeben.
- source_word: מַלְכֵּנוּ
  choice: unser König
  rationale: Bewahrt die königliche Bildwelt und lässt offen, in welchem genauen Verhältnis „Schild“ und „König“ zueinander stehen.
theological_decisions:
- issue: Bezug von „unser Schild“ und „unser König“
  choice: Die parallele Satzgestalt stellt sowohl den Schild als auch den König in ein Zugehörigkeitsverhältnis zu Gott, ohne den Schild ausdrücklich mit Gott oder mit dem menschlichen König gleichzusetzen.
  alternative: „Unser Schild“ bezeichnet unmittelbar Gott, während „unser König“ den menschlichen König bezeichnet; oder „Schild“ und „König“ bezeichnen beide den menschlichen Herrscher.
  rationale: Die beiden parallelen ל-Konstruktionen sprechen für dieselbe syntaktische Beziehung. Da die poetischen Bezeichnungen dennoch verschieden verstanden werden können, wird die Spannung nicht durch eine erklärende Paraphrase aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem poetischem Parallelismus. Die Auslassung des zweiten „gehört“ entspricht der hebräischen Knappheit und ist im Deutschen gut verständlich.
