base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/022.yaml
  text: No enemy will exact tribute from him[b][a], and no son of wickedness will afflict him.
translation:
  language: de
  text: Kein Feind wird von ihm Tribut fordern[a], und kein Frevler[b] wird ihn bedrängen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kein Feind wird ihn täuschen“ oder „ihn übervorteilen“. Das hebräische Verb kann mehrere verwandte Bedeutungen haben; im Zusammenhang ist hier das Fordern oder Eintreiben von Tribut gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sohn des Unrechts“, eine hebräische Ausdrucksweise für einen Frevler oder Übeltäter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשִּׁא
  choice: wird … Abgaben auferlegen
  rationale: Die Hifil-Form von נשׁא kann unter anderem Täuschung oder das Auferlegen einer Last bezeichnen. Im Parallelismus mit „bedrängen“ und im Zusammenhang des königlichen Schutzes liegt politische oder wirtschaftliche Ausbeutung nahe; „Abgaben auferlegen“ gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: אוֹיֵב
  choice: Feind
  rationale: Die übliche und im königlich-militärischen Kontext passende Wiedergabe des singularischen Substantivs.
- source_word: בּוֹ
  choice: ihm
  rationale: In Verbindung mit „Abgaben auferlegen“ verlangt idiomatisches Deutsch den Dativ; die im Hebräischen markierte Zielrichtung bleibt erhalten.
- source_word: בֶן עַוְלָה
  choice: Frevler
  rationale: Wörtlich steht „Sohn des Unrechts“. Gemeint ist idiomatisch ein Mensch, der durch Unrecht bzw. Bosheit gekennzeichnet ist. „Frevler“ bewahrt den gehobenen poetischen Ton, ohne im Haupttext unnatürlich zu wirken.
- source_word: עַוְלָה
  choice: Unrecht
  rationale: Das Substantiv bezeichnet Unrecht, Verkehrtheit oder Bosheit. In der hebräischen Wendung charakterisiert es den betreffenden Menschen moralisch.
- source_word: יְעַנֶּנּוּ
  choice: wird ihn bedrängen
  rationale: Das Piel von ענה bezeichnet hier das Bedrücken, Demütigen oder Misshandeln. „Bedrängen“ ist im modernen Deutsch klar und passt zum Schutz vor feindlicher Unterdrückung.
theological_decisions:
- issue: Bezugsperson des geschützten Einzelnen
  choice: Das singularische Pronomen „ihm/ihn“ bleibt ohne deutende Erweiterung erhalten.
  alternative: David, der davidische König oder typologisch der Messias ausdrücklich benennen.
  rationale: Der hebräische Text spricht im unmittelbaren königlichen Bundeszusammenhang von einer männlichen Einzelperson. Eine genauere theologische Identifizierung soll nicht in die Übersetzung eingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Parallelstruktur. Die erste Zeile wird kontextgemäß verständlich wiedergegeben; die wörtliche hebräische Wendung der zweiten Zeile wird in einer Fußnote bewahrt.
