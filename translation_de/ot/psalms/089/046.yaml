review_pass:
  verdict: revise
  source_fidelity: Die drei Fragesätze, die Anrede mit dem Tetragramm und das Bild des wie Feuer brennenden Zorns sind zutreffend wiedergegeben. Das hebräische Imperfekt תִּבְעַר ist in dieser Klagefrage am direktesten als Zukunfts-/Fortgangsfrage („Wird ... brennen?“) wiederzugeben; „Soll ... brennen?“ fügt im Deutschen eine stärker normative oder deliberative Nuance hinzu, die der hebräische Text nicht verlangt.
  naturalness: „Wie lange, Jahwe?“ und „Wird dein Zorn wie Feuer brennen?“ sind natürliches, würdiges modernes Standarddeutsch. Das Weglassen von „noch“ vermeidet eine geringfügige explizite Zusatznuance, ohne die Dringlichkeit der Klage zu mindern.
  terminology: „Jahwe“ gibt יהוה angemessen als Eigenname wieder. „Zorn“ ist für חֲמָתֶךָ im poetisch-gehobenen Kontext treffend. Die Fußnote erläutert die traditionelle Ersatzwiedergabe sachlich.
  issues:
  - severity: medium
    issue: „Soll dein Zorn wie Feuer brennen?“
    rationale: „Soll“ kann im Deutschen eine Sollensfrage bzw. einen normativen Unterton erzeugen. Die hebräische Frage mit Imperfekt fragt vielmehr nach dem andauernden bzw. zukünftigen Brennen des Zorns. „Wird ... brennen?“ bewahrt diese offene rhetorische Frage unmittelbarer.
  - severity: low
    issue: „Wie lange noch“
    rationale: Die Wendung ist idiomatisch, doch עַד־מָה lautet wörtlich und vollständig „Wie lange?“. „Noch“ ist als Klageverstärkung naheliegend, aber nicht ausdrücklich markiert; die kürzere Form wahrt die knappe hebräische Formulierung genauer.
  revised_text: Wie lange, Jahwe[a]? Willst du dich für immer verbergen? Wird dein Zorn wie Feuer brennen?
  revised_footnotes:
