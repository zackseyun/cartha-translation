  text: עַד מָ֣ה יְ֭הוָה תִּסָּתֵ֣ר לָ/נֶ֑צַח תִּבְעַ֖ר כְּמוֹ אֵ֣שׁ חֲמָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/046.yaml
  text: How long[a], O Yahweh? Will you hide yourself forever? Will your wrath burn like fire?
translation:
  language: de
  text: Wie lange, Jahwe[a]? Willst du dich für immer verbergen? Wird dein Zorn wie Feuer brennen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד מָה
  choice: Wie lange noch
  rationale: Die hebräische Klageformel fragt eindringlich nach der Dauer der Not. „Wie lange noch“ ist im Deutschen natürlich und bringt die Dringlichkeit zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, um den im Hebräischen ausdrücklich verwendeten Eigennamen zu bewahren.
- source_word: תִּסָּתֵר
  choice: willst du dich verbergen
  rationale: Der Nifal kann hier reflexiv verstanden werden. Die Formulierung bewahrt das Bild, dass Gott sich dem Beter entzieht.
- source_word: לָנֶצַח
  choice: für immer
  rationale: Die Wendung bezeichnet eine unbegrenzte Dauer und wird in modernem Deutsch klar und idiomatisch wiedergegeben.
- source_word: תִּבְעַר
  choice: soll ... brennen
  rationale: Das Verb bedeutet „brennen“. Die Frageform „soll ... brennen?“ gibt die fortdauernd beklagte Wirkung wieder, ohne sie als bloße Zukunftsaussage festzulegen.
- source_word: כְּמוֹ אֵשׁ
  choice: wie Feuer
  rationale: Die direkte Vergleichsform bewahrt das hebräische Bild knapp und natürlich.
- source_word: חֲמָתֶךָ
  choice: dein Zorn
  rationale: Das Wort bezeichnet heftigen, glühenden Zorn. „Zorn“ ist würdig, verständlich und erhält den Zusammenhang mit dem Feuerbild.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text spricht Gott mit seinem Eigennamen an. Die Hauptübersetzung bewahrt diesen Namen; die traditionelle deutsche Ersetzung durch einen Titel wird in der Fußnote genannt.
- issue: Zeitliche und modale Nuance von תִּבְעַר
  choice: Soll dein Zorn wie Feuer brennen?
  alternative: Wird dein Zorn wie Feuer brennen?
  rationale: Das hebräische Imperfekt lässt im Klagekontext sowohl eine zukunftsbezogene als auch eine fortdauernd-rhetorische Nuance zu. „Soll“ bewahrt die offene, anklagende Frage, ohne ein Ende des Zorns vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der knappen Eindringlichkeit einer Klage. Die drei Fragen und das Feuerbild des hebräischen Textes bleiben erhalten.
