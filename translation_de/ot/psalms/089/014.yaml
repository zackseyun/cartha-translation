  text: צֶ֣דֶק וּ֭/מִשְׁפָּט מְכ֣וֹן כִּסְאֶ֑/ךָ חֶ֥סֶד וֶ֝/אֱמֶ֗ת יְֽקַדְּמ֥וּ פָנֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/014.yaml
  text: Righteousness and justice are the foundation of your throne[a]; steadfast love and faithfulness go before you.
translation:
  language: de
  text: Gerechtigkeit und Recht sind das Fundament deines Thrones; beständige Liebe und Treue gehen vor deinem Angesicht her.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: vor dir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק
  choice: Gerechtigkeit
  rationale: Bezeichnet hier die sittliche Richtigkeit und gerechte Ordnung. Die Verbindung mit „Recht“ bewahrt die Unterscheidung zum richterlichen Aspekt von מִשְׁפָּט.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: In der Paarung mit צֶדֶק bezeichnet das Wort die rechtsprechende und ordnende Seite der Herrschaft; „Recht“ ist im Deutschen knapp und idiomatisch.
- source_word: מְכוֹן
  choice: Fundament
  rationale: Das Substantiv bezeichnet einen festen, gegründeten Ort beziehungsweise eine tragende Grundlage; beim Thron ist „Fundament“ ein klares natürliches Bild.
- source_word: כִּסְאֶךָ
  choice: deines Thrones
  rationale: Gibt das königliche Bild und das Suffix der zweiten Person Singular direkt wieder.
- source_word: חֶסֶד
  choice: Güte
  rationale: „Güte“ vermittelt hier beständige, zugewandte und verlässliche Liebe, ohne eine im Ausgangstext nicht ausdrücklich genannte Bundesbezeichnung einzufügen.
- source_word: אֱמֶת
  choice: Treue
  rationale: In der festen Verbindung mit חֶסֶד steht die Verlässlichkeit im Vordergrund; „Treue“ gibt diese relationale Bedeutung natürlicher wieder als das mögliche „Wahrheit“.
- source_word: יְקַדְּמוּ
  choice: gehen … her
  rationale: Das Verb kann ein Vorausgehen oder Entgegenkommen ausdrücken. Zusammen mit „vor“ bewahrt die Wendung das poetische Bild von Eigenschaften, die Gottes Auftreten begleiten.
- source_word: פָנֶיךָ
  choice: vor deinem Angesicht
  rationale: Die konkrete Bedeutung „dein Angesicht“ wird im Haupttext erhalten; zugleich ist die deutsche Wendung als Ausdruck der Gegenwart einer Person verständlich.
theological_decisions:
- issue: Wiedergabe der Wortverbindung חֶסֶד וֶאֱמֶת
  choice: Güte und Treue
  alternative: beständige Liebe und Wahrheit
  rationale: Die gewählte Fassung erhält den relationalen Klang der Formel und Gottes verlässliche Zuwendung, ohne sie auf abstrakte Eigenschaften zu reduzieren oder eine bestimmte konfessionelle Deutung einzutragen.
- issue: Konkrete oder idiomatische Wiedergabe von פָנֶיךָ
  choice: vor deinem Angesicht
  alternative: vor dir
  rationale: Die konkrete hebräische Bildsprache bleibt im Text sichtbar. Die Fußnote nennt die natürliche idiomatische Bedeutung und bewahrt damit beide Verständnisebenen.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Der Parallelismus bleibt erhalten; „Angesicht“ ist bewusst bildhaft und leicht gehoben, aber im Zusammenhang verständlich.
