source:
  edition: WLC
  text: אִם חֻקֹּתַ֥/י יְחַלֵּ֑לוּ וּ֝/מִצְוֺתַ֗/י לֹ֣א יִשְׁמֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/031.yaml
  text: If they profane my statutes and do not keep my commandments,[a]
translation:
  language: de
  text: Wenn sie meine Satzungen entweihen und meine Gebote nicht halten,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Satzungen verletzen“. Das hebräische Verb kann ein Entweihen oder die Behandlung von etwas Heiligem als gewöhnlich bezeichnen; „entweihen“ bewahrt diese stärkere Bedeutung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die Konditionalpartikel leitet den Bedingungssatz ein. „Wenn“ bewahrt den naheliegenden konditionalen Sinn, ohne das Eintreten zeitlich als sicher darzustellen.
- source_word: חֻקֹּתַי
  choice: meine Satzungen
  rationale: חֻקָּה bezeichnet festgesetzte Ordnungen oder Satzungen. „Satzungen“ ist im Deutschen verständlich, würdig und unterscheidet sich von „Gebote“ im Parallelglied.
- source_word: יְחַלֵּלוּ
  choice: entweihen
  rationale: Das Piel von חלל kann „entweihen, profanieren“ bedeuten. „Entweihen“ erhält hier die starke religiös-bundestheologische Aussage und ist im Deutschen natürlicher als „profanieren“.
- source_word: וּמִצְוֺתַי
  choice: und meine Gebote
  rationale: מִצְוָה bezeichnet im rechtlichen und bundesbezogenen Zusammenhang ein Gebot. Die Wiedergabe wahrt die Unterscheidung zu חֻקּוֹת und passt zum gehobenen Psalmregister.
- source_word: לֹא יִשְׁמֹרוּ
  choice: nicht halten
  rationale: שׁמר bedeutet bei Geboten häufig „halten, beachten“. „Gebote halten“ ist im modernen Deutschen idiomatisch und prägnant.
theological_decisions:
- issue: Stärke der Sprache für den Bundesbruch bei חלל mit „Satzungen“
  choice: „meine Satzungen entweihen“
  alternative: „meine Satzungen verletzen“
  rationale: Die Piel-Form bezeichnet stärker als bloße Nichtbefolgung ein Entheiligen oder Entweihen. Die Hauptfassung bewahrt dieses Gewicht, während die Fußnote die kontextuell mögliche, weniger starke Wiedergabe nennt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Psalmstil. Der Parallelismus zwischen „Satzungen entweihen“ und „Gebote nicht halten“ bleibt erhalten.
