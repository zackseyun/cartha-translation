base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/023.yaml
  text: And I will crush his adversaries before him[b][a], and strike down those who hate him.
translation:
  language: de
  text: Ich werde seine Bedränger vor ihm[a] zerschmettern und die, die ihn hassen, niederschlagen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „von seinem Angesicht weg“; die Wendung kann ausdrücken, dass Gott die Gegner aus seiner Gegenwart bzw. vor ihm beseitigt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „schlagen“; das hebräische Verb bezeichnet einen heftigen Schlag im Kampf oder Gericht und kann je nach Zusammenhang auch „mit einer Plage schlagen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַתּוֹתִי
  choice: Ich werde … zerschmettern
  rationale: Das Qal von כתת bezeichnet ein gewaltsames Zerschlagen oder Zermalmen. Im Zusammenhang der göttlichen Verheißung ist das Perfekt mit וְ zukünftig wiederzugeben; „zerschmettern“ bewahrt die kraftvolle Bildsprache.
- source_word: מִפָּנָיו
  choice: vor ihm
  rationale: Die Wendung bedeutet wörtlich „von seinem Angesicht weg“. „Vor ihm“ ist im Deutschen natürlich und lässt das Bild erkennen, dass Gott die Gegner aus dem Weg des Königs räumt; die wörtlichere Nuance wird in einer Fußnote genannt.
- source_word: צָרָיו
  choice: seine Bedränger
  rationale: צָר bezeichnet feindliche Widersacher oder Bedränger. „Bedränger“ gibt die aktive Anfeindung wieder und hält die Bezeichnung vom parallelen „die ihn hassen“ unterschieden.
- source_word: וּמְשַׂנְאָיו
  choice: die ihn hassen
  rationale: Das Partizip von שׂנא bezeichnet Menschen, deren Haltung durch Hass geprägt ist. Die verbale Formulierung ist im modernen Deutsch natürlicher als „seine Hasser“.
- source_word: אֶגּוֹף
  choice: niederschlagen
  rationale: נגף bezeichnet ein heftiges Schlagen, häufig im Kampf oder Gericht. „Niederschlagen“ passt zum kriegerischen Parallelismus und drückt eine entschiedene Niederlage aus, ohne die mögliche Bedeutung unnötig auf eine Plage einzuengen.
theological_decisions:
- issue: Göttliche Kriegssprache in der Bundesverheißung an den davidischen König
  choice: Die starke kriegerische Bildsprache bleibt als unmittelbares Handeln Gottes zugunsten des Königs erhalten.
  alternative: Allgemeiner mit „besiegen“ oder „überwinden“ formulieren.
  rationale: Beide hebräischen Verben schildern ein kraftvolles Eingreifen Gottes gegen die Feinde des Königs. Eine Abschwächung würde die königliche und bundesbezogene Spannung des Textes glätten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem poetischem Parallelismus und kräftiger Kriegssprache. Die Satzstellung hält Gottes Handeln in beiden Vershälften deutlich fest.
