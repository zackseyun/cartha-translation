  - marker: b
    text: 'Auch: sein Diadem. Das hebräische Wort kann zugleich an Weihe und Absonderung erinnern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵאַרְתָּה
  choice: verworfen
  rationale: Das seltene Verb נאר im Piel bezeichnet ein entschiedenes Zurückweisen oder Verstoßen. „Verworfen“ ist im Deutschen natürlich, kräftig und für den Bundeskontext angemessen.
- source_word: בְּרִית
  choice: Bund
  rationale: „Bund“ ist die etablierte und sachlich passende Wiedergabe im königlich-davidischen Zusammenhang.
- source_word: עַבְדֶּךָ
  choice: deinem Diener
  rationale: Im Blick auf den davidischen König bezeichnet עבד den Gott untergeordneten königlichen Diener; „Diener“ gibt diese Beziehung natürlicher wieder als „Sklave“.
- source_word: חִלַּלְתָּ
  choice: entweiht
  rationale: Das Piel von חלל bezeichnet das Profanieren oder Entheiligen. „Entweiht“ bewahrt die sakrale Dimension, die mit dem königlichen נזר verbunden ist.
- source_word: לָאָרֶץ
  choice: zu Boden
  rationale: Wörtlich „zur Erde/zum Boden“; „zu Boden“ vermittelt im Deutschen prägnant das Bild öffentlicher Erniedrigung.
- source_word: נִזְרוֹ
  choice: seine Krone
  rationale: נזר kann Krone oder Diadem bezeichnen und zugleich an Weihe erinnern. Im königlichen Kontext ist „Krone“ die verständlichste Haupttextfassung; die Weihekonnotation wird durch „entweiht“ bewahrt.
theological_decisions:
- issue: Königliche Bundestheologie und die Klage über Gottes Handeln
  choice: Die schroffe Aussage über die Verwerfung des Bundes und die Erniedrigung des davidischen Königs bleibt uneingeschränkt stehen.
  alternative: Die Aussage als bloße politische Niederlage abschwächen oder durch eine spätere messianische Deutung auflösen.
  rationale: Der Vers formuliert die empfundene Spannung zwischen Gottes Bundeszusage und dem Zusammenbruch des davidischen Königtums. Die Übersetzung soll diese Spannung bewahren, nicht erklären oder harmonisieren.
- issue: Sakrale Bedeutung von נזר und חלל
  choice: „Krone“ mit dem Verb „entweihen“ verbinden.
  alternative: Neutraler „Krone entehrt“ oder ausdrücklich „Weihezeichen entheiligt“.
  rationale: Diese Verbindung erhält sowohl das konkrete königliche Bild als auch den im Hebräischen anklingenden Gedanken der Weihe, ohne ihn im Haupttext übermäßig auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Klagesprache. Das ergänzte „gestürzt“ macht die Richtungsangabe „zu Boden“ idiomatisch verständlich; die wörtlich knappere, aber im Deutschen ungewöhnliche Konstruktion wird in der Fußnote dokumentiert.
