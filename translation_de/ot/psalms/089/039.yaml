review_pass:
  verdict: revise
  source_fidelity: Der erste Teilsatz gibt נֵאַרְתָּה ... treffend als entschiedene Verwerfung des Bundes wieder. Im zweiten Teilsatz ist „entweiht“ für חִלַּלְתָּ sachgerecht und bewahrt die Profanierungsdimension. Das zusätzliche „gestürzt“ hat jedoch keine eigenständige verbale Entsprechung im Hebräischen und sollte nicht in den Haupttext aufgenommen werden; לָאָרֶץ ist als Richtungs-/Erniedrigungsangabe bei „entweiht“ zu belassen.
  naturalness: Die revidierte Wortstellung ist bewusst poetisch und für einen Psalm in modernem, würdigem Standarddeutsch noch verständlich. Sie vermeidet zugleich die sachlich weitergehende Aussage, die Krone sei ausdrücklich gestürzt worden.
  terminology: „Bund“, „Diener“, „Krone“ und „entweiht“ sind kontextgerecht. Die Fußnote zu „Krone“ dokumentiert angemessen die mögliche Wiedergabe „Diadem“ sowie den Anklang von Weihe bzw. Absonderung bei נזר.
  issues:
  - severity: medium
    issue: „... und zu Boden gestürzt“ ergänzt ein nicht ausdrücklich im hebräischen Text vorhandenes Handlungsverb.
    rationale: Der Text verwendet nur חִלַּלְתָּ („du hast entweiht/profaniert“) mit לָאָרֶץ („zur Erde/zu Boden“). Ein explizites Stürzen kann die Bildrichtung zwar interpretierend entfalten, ist aber für eine optimal-äquivalente Haupttextfassung zu konkret.
  - severity: low
    issue: Die bisherige Fußnote b bezeichnet eine Formulierung mit „zur Erde entweiht“ als wörtlich, obwohl der Haupttext zusätzlich „gestürzt“ enthält.
    rationale: Die Fußnote sollte keine vom Haupttext abweichende angeblich wörtliche Fassung dokumentieren. Nach Entfernung der Zusatzhandlung kann sie auf die tatsächlichen lexikalischen Alternativen beschränkt werden.
