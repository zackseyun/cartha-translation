  text: You have renounced the covenant of your servant[b][a]; you have defiled his crown to the ground.
translation:
  language: de
  text: Du hast den Bund mit deinem Diener verworfen[a]; seine Krone hast du zu Boden entweiht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: verstoßen; verschmäht.'
