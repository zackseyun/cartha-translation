  text: כִּ֤י מִ֣י בַ֭/שַּׁחַק יַעֲרֹ֣ךְ לַ/יהוָ֑ה יִדְמֶ֥ה לַ֝/יהוָ֗ה בִּ/בְנֵ֥י אֵלִים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/006.yaml
  text: For who in the skies can be compared to Yahweh? Who among the sons of God is like Yahweh?[a]
translation:
  language: de
  text: Denn wer im Himmel lässt sich mit dem HERRN vergleichen? Wer unter den Söhnen Gottes ist dem HERRN gleich?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter den himmlischen Wesen«, »unter den göttlichen Wesen« oder »unter den Söhnen der Mächtigen«. Wörtlich lautet der hebräische Ausdruck: »unter den Söhnen Gottes/der Götter«.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das vorangehende Lob ein und verbindet sie natürlich mit den rhetorischen Fragen.
- source_word: בַשַּׁחַק
  choice: im Himmel
  rationale: שַׁחַק bezeichnet hier den himmlischen Bereich; der deutsche Singular ist idiomatisch und wahrt den kosmischen Bezug.
- source_word: יַעֲרֹךְ לַיהוָה
  choice: lässt sich mit dem HERRN vergleichen
  rationale: ערך meint hier das Gegenüberstellen zum Vergleich; die reflexive deutsche Form gibt die rhetorische Aussage klar wieder.
- source_word: יהוה
  choice: der HERR
  rationale: Die traditionelle Wiedergabe des Gottesnamens im Deutschen ist würdig und entspricht der vorgegebenen Übersetzungspraxis.
- source_word: יִדְמֶה לַיהוָה
  choice: ist dem HERRN gleich
  rationale: Gibt die Aussage über Ähnlichkeit beziehungsweise Vergleichbarkeit knapp wieder und erhält den Parallelismus.
- source_word: בִּבְנֵי אֵלִים
  choice: unter den Söhnen Gottes
  rationale: Bewahrt das konkrete hebräische Bild und die theologische Spannung; mögliche funktionale Deutungen werden in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: Die traditionelle Ersatzlesung wird verwendet, ohne die Identität des Gottesnamens zu verschleiern.
- issue: Deutung von בִּבְנֵי אֵלִים
  choice: unter den Söhnen Gottes
  alternative: unter den himmlischen Wesen / unter den göttlichen Wesen / unter den Söhnen der Mächtigen
  rationale: Die wörtlich-bildhafte Formulierung bleibt im Haupttext erhalten, statt die Wesen vorschnell näher zu bestimmen; die genuine lexikalische Mehrdeutigkeit steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden rhetorischen Fragen und ihr Parallelismus bleiben erhalten; die schwer eindeutig festzulegende Bezeichnung der himmlischen Wesen wird nicht eingeebnet.
