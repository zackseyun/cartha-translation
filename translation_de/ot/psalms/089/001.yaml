  text: חַֽסְדֵ֣י יְ֭הוָה עוֹלָ֣ם אָשִׁ֑ירָה לְ/דֹ֥ר וָ/דֹ֓ר אוֹדִ֖יעַ אֱמוּנָתְ/ךָ֣ בְּ/פִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/001.yaml
  text: I will sing of the steadfast love of Yahweh forever[a]; from generation to generation I will make your faithfulness known with my mouth.
translation:
  language: de
  text: 'Von Jahwes beständiger Liebe[a] will ich ewig singen;

    von Generation zu Generation will ich mit meinem Mund deine Treue bekannt machen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jahwes Erbarmen«, »Jahwes Erweise der Güte« oder »Jahwes Taten treuer Liebe«. Das hebräische Wort kann Jahwes treue Bundesliebe bezeichnen, wie sie sich in wiederholten Taten der Güte und des Erbarmens zeigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדֵי
  choice: beständiger Liebe
  rationale: Der Plural bezeichnet hier Jahwes treue, verlässliche Liebe, wie sie sich immer wieder in konkreten Erweisen von Güte und Erbarmen zeigt. Die abstrakte deutsche Formulierung klingt natürlich und bewahrt die Verbindung von Zuwendung und Dauerhaftigkeit.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עוֹלָם
  choice: ewig
  rationale: Das Wort bestimmt hier das Singen zeitlich und bezeichnet eine unbegrenzte, fortdauernde Dauer.
- source_word: אָשִׁירָה
  choice: will ich singen
  rationale: Die Kohortativform drückt den entschlossenen Vorsatz des Sprechers aus; »will ich singen« gibt diesen im Deutschen klar wieder.
- source_word: לְדֹר וָדֹר
  choice: von Generation zu Generation
  rationale: Die hebräische Wendung bezeichnet die fortlaufende Weitergabe über aufeinanderfolgende Generationen hinweg.
- source_word: אוֹדִיעַ
  choice: will ich … bekannt machen
  rationale: Der Hifil von ידע bedeutet »wissen lassen« oder »bekannt machen«; die gewählte Formulierung ist verständlich und bewahrt den kausativen Sinn.
- source_word: אֱמוּנָתְךָ
  choice: deine Treue
  rationale: אֱמוּנָה bezeichnet hier Gottes Verlässlichkeit und Bundestreue und steht parallel zu חֶסֶד.
- source_word: בְּפִי
  choice: mit meinem Mund
  rationale: Die konkrete hebräische Redeweise für hörbares Verkünden bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. »Jahwe« bewahrt ihn als persönlichen Namen, während »der HERR« ihn durch einen Titel ersetzen würde.
- issue: Bedeutungsumfang von חַסְדֵי
  choice: beständiger Liebe
  alternative: Erweisen der Güte / Taten treuer Liebe / Erbarmen
  rationale: Im Bundeskontext umfasst חֶסֶד sowohl treue Zuwendung als auch deren konkrete Erweise. Der Haupttext gibt den leitenden Begriff natürlich wieder; die Fußnote hält die Mehrdeutigkeit offen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die poetische Parallelität und der Wechsel von der dritten Person (»Jahwes«) zur direkten Anrede (»deine«) bleiben erhalten. Die zweimalige Formulierung »will ich« macht den entschlossenen Charakter beider Verbformen deutlich.
