  text: בָּר֖וּךְ יְהוָ֥ה לְ֝/עוֹלָ֗ם אָ֘מֵ֥ן וְ/אָמֵֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/052.yaml
  text: Blessed be Yahweh forever[a]. Amen and amen.
translation:
  language: de
  text: Gepriesen sei Jahwe in Ewigkeit! Amen und Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Das passive Partizip steht hier in einer liturgischen Segens- und Lobformel. „Gepriesen sei“ gibt deren doxologischen Charakter im heutigen Deutschen natürlich und würdig wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְעוֹלָם
  choice: in Ewigkeit
  rationale: Die Wendung bezeichnet unbegrenzte Dauer. „In Ewigkeit“ ist in diesem liturgischen Zusammenhang prägnant und idiomatisch.
- source_word: אָמֵן וְאָמֵן
  choice: Amen und Amen
  rationale: Die wörtliche Wiederholung bewahrt die feierliche, nachdrückliche Bekräftigung des hebräischen Abschlusses.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Bedeutung von בָּרוּךְ in der Schlussdoxologie
  choice: Gepriesen sei
  alternative: Gesegnet sei
  rationale: Beide Wiedergaben sind sprachlich möglich; in einer an Gott gerichteten Doxologie vermittelt „Gepriesen sei“ die gemeinte ehrende Ausrufung im Deutschen klarer, ohne den Satz zu einer bloßen Aussage abzuflachen.
translation_notes:
  register: Modernes, würdevolles liturgisches Deutsch. Die knappe Form und die emphatische Wiederholung des Schlusses bleiben erhalten.
