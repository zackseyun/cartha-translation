source:
  edition: WLC
  text: צָפ֣וֹן וְ֭/יָמִין אַתָּ֣ה בְרָאתָ֑/ם תָּב֥וֹר וְ֝/חֶרְמ֗וֹן בְּ/שִׁמְ/ךָ֥ יְרַנֵּֽנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/012.yaml
  text: The north and the south—you created them[b][a]; Tabor and Hermon sing for joy in your name.
translation:
  language: de
  text: Den Norden und den Süden – du hast sie geschaffen; Tabor und Hermon jubeln bei deinem Namen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den Norden und die rechte Seite«. Die »rechte Seite« kann bei einer Ausrichtung nach Osten den Süden bezeichnen. Auch möglich: »Tabor und Hermon jauchzen bei deinem Namen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָפוֹן
  choice: den Norden
  rationale: Das gewöhnliche Substantiv bezeichnet den Norden beziehungsweise die nördliche Himmelsrichtung. In der Verbindung mit יָמִין bildet es hier am ehesten ein räumliches Gegensatzpaar.
- source_word: יָמִין
  choice: den Süden
  rationale: Wörtlich bedeutet das Wort »rechte Hand« oder »rechte Seite«; bei der üblichen Ausrichtung nach Osten kann es jedoch den Süden bezeichnen. Zusammen mit צָפוֹן ist die geografische Wiedergabe im Deutschen klar und natürlich.
- source_word: בְרָאתָם
  choice: du hast sie geschaffen
  rationale: Das Qal Perfekt 2. Person maskulin Singular mit Suffix der 3. Person maskulin Plural blickt auf Gottes vollbrachtes Schöpfungswerk zurück.
- source_word: תָּבוֹר
  choice: Tabor
  rationale: Der geografische Eigenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: חֶרְמוֹן
  choice: Hermon
  rationale: Der geografische Eigenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: בְּשִׁמְךָ
  choice: über deinen Namen
  rationale: Die Präposition ב kann hier den Anlass des Jubels ausdrücken. »Über deinen Namen« ist natürliches Deutsch und bindet die Freude an Gottes offenbarten Namen und Ruhm, ohne den Ausdruck weiter auszudeuten.
- source_word: יְרַנֵּנוּ
  choice: jubeln
  rationale: Das Piel von רנן bezeichnet einen hellen, freudigen Jubelruf und kann sowohl »jubeln« als auch »jauchzen« oder »freudig singen« bedeuten. »Jubeln« bewahrt die Offenheit zwischen Gesang und Ruf.
theological_decisions:
- issue: Deutung von יָמִין neben צָפוֹן
  choice: geografisches Gegensatzpaar »Norden und Süden«
  alternative: wörtlich »Norden und rechte Seite«
  rationale: Die Richtungsbedeutung ergibt einen poetischen Merismus für die von Gott geschaffenen räumlichen Bereiche. Die wörtliche Körper- beziehungsweise Seitenbezeichnung bleibt als echte lexikalische Möglichkeit in der Fußnote erhalten.
- issue: Personifikation von Tabor und Hermon
  choice: Die Berge selbst werden poetisch als jubelnd dargestellt.
  alternative: Die Bewohner der Gebiete jubeln.
  rationale: Die beiden Ortsnamen bilden gemeinsam das Subjekt des pluralischen Verbs. Die direkte Personifikation entspricht der Bildsprache der Psalmen und soll nicht durch eine erklärende Umschreibung verflacht werden.
- issue: Bedeutung von בְשִׁמְךָ
  choice: »über deinen Namen« als Anlass des Jubels
  alternative: »in deinem Namen« oder »durch deinen Namen«
  rationale: Die hebräische Präposition lässt mehrere Beziehungen zu. Im Zusammenhang des Jubelns ist die kausale beziehungsweise anlassbezogene Wiedergabe idiomatisch; die semantische Breite wird in der Fußnote angezeigt.
translation_notes:
  register: Moderne, würdige Psalmsprache mit klarer Satzstruktur. Der Gedankenstrich markiert die hervorgehobene Voranstellung des geschaffenen Gegensatzpaares. »Jubeln« erhält die poetische Personifikation und vermeidet eine unnötige Festlegung auf ausschließlich gesungenen oder gerufenen Lobpreis.
