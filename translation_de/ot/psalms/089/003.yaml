  source_fidelity: Der Entwurf gibt die beiden hebräischen Perfektformen angemessen mit „habe ... geschlossen“ und „habe ... geschworen“ wieder. „Mit meinem Erwählten“ entspricht der idiomatischen Bedeutung von כרת ברית ל־, und „David, meinem Diener“ bewahrt sowohl die Dativbeziehung bei נשבע als auch die Apposition עַבְדִּי. Der abschließende Doppelpunkt ist quellentreu, da der Schwurinhalt im folgenden Vers fortgesetzt wird.
  naturalness: „Einen Bund schließen“ sowie „jemandem schwören“ sind natürliches, modernes und zugleich würdiges Standarddeutsch. Die appositionelle Formulierung „David, meinem Diener“ ist klar und angemessen für den poetisch-feierlichen Registerton.
  terminology: „Bund“ ist die sachgemäße und konsistente Wiedergabe von בְּרִית. „Erwählter“ und „Diener“ sind kontextgerecht; sie tragen keine über den Text hinausgehende messianische oder konfessionelle Festlegung ein. Die Fußnote kennzeichnet die hebräische Bildform zutreffend als wörtliche Alternative.
