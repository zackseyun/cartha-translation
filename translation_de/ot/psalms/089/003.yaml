  text: כָּרַ֣תִּֽי בְ֭רִית לִ/בְחִירִ֑/י נִ֝שְׁבַּ֗עְתִּי לְ/דָוִ֥ד עַבְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/003.yaml
  text: 'I have made a covenant with my chosen one[a]; I have sworn to David my servant:'
translation:
  language: de
  text: „Ich habe mit meinem Erwählten einen Bund geschlossen[a]; ich habe David, meinem Diener, geschworen:“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich im Hebräischen: „einen Bund geschnitten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרַתִּי
  choice: habe … geschlossen
  rationale: כרת ברית ist die feste hebräische Wendung „einen Bund schneiden/schließen“. Im heutigen Deutschen gibt „einen Bund schließen“ das Idiom natürlich und würdig wieder; das Perfekt wahrt die vollzogene Handlung mit fortdauernder Geltung.
- source_word: בְּרִית
  choice: einen Bund
  rationale: „Bund“ bewahrt das besondere Gewicht von ברית und ist hier treffender als allgemeinere Wörter wie „Vereinbarung“ oder „Vertrag“.
- source_word: לִבְחִירִי
  choice: mit meinem Erwählten
  rationale: Das ל wird in Verbindung mit ברית idiomatisch durch „mit“ wiedergegeben. „Mein Erwählter“ ist eine knappe, natürliche Personenbezeichnung und lässt den folgenden Bezug auf David bestehen.
- source_word: נִשְׁבַּעְתִּי
  choice: ich habe … geschworen
  rationale: Der Niphal von שׁבע bezeichnet das Schwören eines Eides. Das deutsche Perfekt entspricht dem parallelen Verb und vermittelt die bleibende Verbindlichkeit.
- source_word: לְדָוִד
  choice: David … geschworen
  rationale: Nach „schwören“ bezeichnet ל den Empfänger des Schwurs; der deutsche Dativ „David“ ist dafür die natürliche Entsprechung.
- source_word: עַבְדִּי
  choice: meinem Diener
  rationale: Im königlichen und bundesbezogenen Kontext ist „Diener“ die angemessene Wiedergabe von עבד; „Sklave“ würde hier einen nicht im Vordergrund stehenden Aspekt betonen.
theological_decisions:
- issue: Identität von „meinem Erwählten“
  choice: Die Formulierung wird beibehalten und durch die Parallelstellung im Vers auf David bezogen.
  alternative: Die Bezeichnung ausdrücklich messianisch deuten oder schon in der Übersetzung über David hinausführen.
  rationale: Der Vers stellt „meinen Erwählten“ und „David, meinen Diener“ parallel. Eine weitergehende typologische oder messianische Deutung ist möglich, gehört aber in die Auslegung und soll nicht in den Wortlaut eingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Einen Bund schließen“ ist idiomatisch und bewahrt den feierlichen Charakter. Der Doppelpunkt zeigt an, dass der Inhalt des Schwurs im folgenden Vers weitergeführt wird.
