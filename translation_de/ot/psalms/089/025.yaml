  text: וְ/שַׂמְתִּ֣י בַ/יָּ֣ם יָד֑/וֹ וּֽ/בַ/נְּהָר֥וֹת יְמִינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/025.yaml
  text: I will set his hand on the sea[a], and his right hand on the rivers.
translation:
  language: de
  text: Ich werde seine Hand auf das Meer legen[a] und seine rechte Hand auf die Flüsse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde seine Hand über das Meer setzen und seine rechte Hand über die Flüsse.“ Das Bild drückt wahrscheinlich Herrschaft oder weitreichende Macht aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Ich werde … legen
  rationale: Das Qal-Perfekt der 1. Person Singular mit וְ steht hier im Zusammenhang einer Verheißung und wird im Deutschen angemessen mit dem Futur wiedergegeben. „Legen“ bewahrt das konkrete Bild.
- source_word: בַיָּם
  choice: auf das Meer
  rationale: Die Präposition בְּ bezeichnet in diesem Herrschaftsbild den Bereich, auf den die Hand gelegt wird. „Auf das Meer“ bleibt nah am Bild; „über das Meer“ würde dessen Bedeutung als Herrschaft stärker ausdeuten.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: Die konkrete Körpermetapher des Hebräischen bleibt erhalten, ohne sie im Haupttext als Macht oder Herrschaft zu erklären.
- source_word: וּבַנְּהָרוֹת
  choice: und … auf die Flüsse
  rationale: נְהָרוֹת ist der Plural von „Fluss“. Die Wiederholung von „auf“ bildet die hebräische Parallelstruktur klar und natürlich ab.
- source_word: יְמִינוֹ
  choice: seine rechte Hand
  rationale: Die wörtliche Wiedergabe erhält den Parallelismus sowie die mit der rechten Hand verbundenen Anklänge an Stärke und Autorität.
theological_decisions:
- issue: Königliche Herrschaftsmetaphorik
  choice: Das konkrete Bild von Hand und rechter Hand auf Meer und Flüssen bleibt bestehen.
  alternative: Ich werde seine Macht über das Meer und seine Herrschaft über die Flüsse ausdehnen.
  rationale: Der Vers beschreibt wahrscheinlich die von Gott verliehene, weitreichende Herrschaft des Königs. Der Haupttext bewahrt jedoch die poetische Metapher, statt ihre theologische und politische Bedeutung ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Futur gibt den Verheißungscharakter wieder; die konkrete und spannungsreiche Bildsprache des Hebräischen bleibt erhalten.
