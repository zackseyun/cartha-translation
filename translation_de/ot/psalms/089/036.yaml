  verdict: approve
  source_fidelity: 'Der Text gibt זַרְעוֹ kollektiv und kontextgerecht mit „seine Nachkommen“ wieder. „werden für immer bestehen“ ist eine idiomatische Entfaltung von יִהְיֶה לְעוֹלָם, ohne den Sinn zu verändern. Die zweite Zeile bewahrt den Vergleich כַשֶּׁמֶשׁ und die erste Person in נֶגְדִּי: „sein Thron wird wie die Sonne vor mir sein“ ergänzt das im Hebräischen elliptische Verb verständlich und sachgerecht.'
