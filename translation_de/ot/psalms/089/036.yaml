  terminology: „Thron“ erhält das konkrete königliche Bild von כִּסֵּא. „Nachkommen“ ist für das kollektiv gebrauchte זֶרַע natürlich und vermeidet eine unnötige individualisierende oder konfessionelle Festlegung. Die Fußnoten sind zutreffend und ihre Marker korrekt am jeweiligen Bezugsausdruck verankert.
