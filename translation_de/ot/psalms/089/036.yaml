source:
  edition: WLC
  text: זַ֭רְע/וֹ לְ/עוֹלָ֣ם יִהְיֶ֑ה וְ/כִסְא֖/וֹ כַ/שֶּׁ֣מֶשׁ נֶגְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/036.yaml
  text: His offspring will endure forever[c][b][a], and his throne will be like the sun before me.
translation:
  language: de
  text: Seine Nachkommen[a] werden für immer bestehen, und sein Thron wird wie die Sonne vor mir[b] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sein Same“; das hebräische Wort kann kollektiv die Nachkommenschaft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in meiner Gegenwart“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעוֹ
  choice: seine Nachkommen
  rationale: זֶרַע bezeichnet hier kollektiv die dynastische Nachkommenschaft. „Nachkommen“ ist im modernen Deutschen natürlich und macht den Bezug auf Davids fortdauernde Linie deutlich, ohne den Begriff auf eine einzelne Person festzulegen.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: עוֹלָם bezeichnet in diesem poetischen Bundeskontext eine unbegrenzte, fortdauernde Dauer. „Für immer“ ist klar, würdig und idiomatisch.
- source_word: יִהְיֶה
  choice: werden … bestehen
  rationale: Das hebräische Verb bedeutet wörtlich „wird sein“. Bei Nachkommen bringt „bestehen“ die fortdauernde Existenz idiomatisch zum Ausdruck, ohne über den Kontext hinauszugehen.
- source_word: וְכִסְאוֹ
  choice: und sein Thron
  rationale: כִּסֵּא bedeutet konkret „Thron“ und steht im königlichen Bundeskontext zugleich für die Herrschaft. Das Bild bleibt unverkürzt erhalten.
- source_word: כַשֶּׁמֶשׁ
  choice: wie die Sonne
  rationale: Das Präfix כ־ kennzeichnet einen Vergleich. „Wie die Sonne“ gibt das Bild unmittelbar wieder.
- source_word: נֶגְדִּי
  choice: vor mir
  rationale: נֶגֶד mit dem Suffix der ersten Person Singular bedeutet „vor mir“ beziehungsweise „in meiner Gegenwart“. Die knappe Wiedergabe bewahrt den direkten Gotteswortcharakter.
theological_decisions:
- issue: Bezug der ersten Person in נֶגְדִּי
  choice: „vor mir“ als direkte Rede Gottes beibehalten
  alternative: „in meiner Gegenwart“
  rationale: Der Abschnitt stellt die Aussage als Gottes Rede über David und dessen Linie dar. „Vor mir“ hält die personale und bundesbezogene Aussage offen und direkt, ohne sie auszudeuten.
- issue: Kollektiver oder individueller Bezug von זַרְעוֹ
  choice: kollektiv „seine Nachkommen“
  alternative: wörtlicher „sein Same“ oder abstrakter „seine Nachkommenschaft“
  rationale: Im unmittelbaren königlichen Bundeskontext bezeichnet der Singular kollektiv Davids dynastische Nachkommenschaft. Die Übersetzung legt dabei nicht fest, wie sich die Verheißung in einzelnen Nachkommen erfüllt.
translation_notes:
  register: Moderne, würdige Psalmsprache. Die erste Teilaussage wird idiomatisch mit „bestehen“ wiedergegeben; im zweiten Teil wird das im Hebräischen elliptisch fehlende Verb als „wird … sein“ ergänzt. Die Bildwörter „Thron“ und „Sonne“ sowie die direkte Gottesrede bleiben erhalten.
