source:
  edition: WLC
  text: מִ֤י גֶ֣בֶר יִֽ֭חְיֶה וְ/לֹ֣א יִרְאֶה מָּ֑וֶת יְמַלֵּ֨ט נַפְשׁ֖/וֹ מִ/יַּד שְׁא֣וֹל סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/048.yaml
  text: What man can live and not see death? Can he deliver his soul from the hand of Sheol? Selah[a][b][c]
translation:
  language: de
  text: Welcher Mann kann leben, ohne den Tod zu sehen?[a] Kann er sein Leben[b] aus der Hand der Scheol[c] retten? Sela.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Tod nicht sehen“; gemeint sein kann: „den Tod nicht erfahren“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine Seele“ oder „sich selbst“.'
    reason: lexical_alternative
  - marker: c
    text: „Scheol“ ist der hebräische Ausdruck für das Totenreich; je nach Zusammenhang auch mit „Grab“ wiedergegeben.
    reason: alternative_reading
  - marker: d
    text: Die Bedeutung von „Sela“ ist unsicher; vermutlich handelt es sich um eine musikalische oder liturgische Angabe.
    reason: translation_note
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: Welcher Mann
  rationale: Die Verbindung leitet eine rhetorische Frage ein. „Mann“ gibt das konkret maskuline גֶבֶר wieder, das hier zugleich stellvertretend für den sterblichen Menschen steht.
- source_word: יִחְיֶה
  choice: kann leben
  rationale: Der Imperfekt bezeichnet in der rhetorischen Frage die Möglichkeit; im Deutschen ist die modale Wiedergabe natürlich und sinngenau.
- source_word: וְלֹא יִרְאֶה מָוֶת
  choice: ohne den Tod zu sehen
  rationale: Die Formulierung bewahrt das hebräische Bild und ist im gehobenen poetischen Deutsch verständlich; gemeint sein kann, den Tod zu erfahren.
- source_word: יְמַלֵּט
  choice: Kann er ... retten?
  rationale: Das Piel bezeichnet das Entkommenlassen beziehungsweise Retten. Die Frage setzt die rhetorische Gedankenführung der ersten Vershälfte fort.
- source_word: נַפְשׁוֹ
  choice: sein Leben
  rationale: נפש bezeichnet hier im Zusammenhang mit Tod und Scheol am natürlichsten das Leben beziehungsweise die eigene Person. „Seele“ könnte im Deutschen eine engere anthropologische Trennung nahelegen, als der hebräische Ausdruck verlangt.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die wörtliche Metapher für Macht oder Zugriff ist auch im Deutschen klar und poetisch wirksam.
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Die Transliteration bewahrt den eigenständigen hebräischen Begriff und legt ihn weder vorschnell auf „Grab“ noch auf eine spätere Vorstellung von „Hölle“ fest.
- source_word: סֶלָה
  choice: Sela
  rationale: Die traditionelle Umschrift bleibt stehen, weil Bedeutung und musikalisch-liturgische Funktion des Ausdrucks nicht sicher bestimmbar sind.
theological_decisions:
- issue: Bedeutung von שְׁאוֹל im poetischen Zusammenhang
  choice: Scheol
  alternative: Totenreich; Grab
  rationale: Die Umschrift erhält die Breite des hebräischen Begriffs für den Bereich der Toten und vermeidet sowohl eine Reduktion auf die Grabstätte als auch die Eintragung einer später ausgebildeten Höllenlehre.
- issue: Anthropologische Bedeutung von נַפְשׁוֹ
  choice: sein Leben
  alternative: seine Seele; sich selbst
  rationale: Im Parallelismus geht es um das Entrinnen vor Tod und Scheol. „Leben“ gibt die konkrete Aussage natürlich wieder, ohne eine Trennung von Körper und unsterblicher Seele in den Text hineinzulesen; die lexikalische Mehrdeutigkeit wird in der Fußnote bewahrt.
- issue: Repräsentativ maskuline Sprache bei גֶבֶר
  choice: Mann
  alternative: Mensch
  rationale: „Mann“ entspricht der konkret maskulinen Lexik des Ausgangstextes. Im rhetorischen Zusammenhang gilt die Aussage zugleich allgemein für die menschliche Sterblichkeit.
translation_notes:
  register: Moderne, würdige Psalmsprache mit bewahrten hebräischen Bildern. Die rhetorischen Fragen bleiben knapp und eindringlich. „Scheol“ und „Sela“ werden transliteriert; unbekannte oder mehrdeutige Begriffe werden nicht dogmatisch vereindeutigt.
