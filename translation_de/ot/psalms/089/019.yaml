  text: אָ֤ז דִּבַּ֥רְתָּֽ בְ/חָ֡זוֹן לַֽ/חֲסִידֶ֗י/ךָ וַ/תֹּ֗אמֶר שִׁוִּ֣יתִי עֵ֭זֶר עַל גִּבּ֑וֹר הֲרִימ֖וֹתִי בָח֣וּר מֵ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/019.yaml
  text: Then you spoke in a vision to your faithful ones and said[a], “I have set help upon a mighty one[d][c][b]; I have exalted one chosen from the people.”
translation:
  language: de
  text: 'Damals hast du in einer Vision zu deinen Getreuen[a] gesprochen und gesagt: »Ich habe einem Helden[b] Hilfe gewährt; ich habe einen Erwählten[c] aus dem Volk erhöht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach einer abweichenden Lesart, die sich auch in einigen Übersetzungen findet: „zu deinem Getreuen“.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „einem starken Mann“ beziehungsweise „einem Krieger“.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann auch „einen jungen Mann“ bedeuten; im Zusammenhang steht wahrscheinlich die Erwählung aus dem Volk im Vordergrund.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Damals
  rationale: Das Zeitadverb führt in dichterischer Rückschau die frühere göttliche Rede ein; „Damals“ klingt im Deutschen natürlicher als ein bloßes „Dann“.
- source_word: דִּבַּרְתָּ
  choice: hast du … gesprochen
  rationale: Bewahrt gegenüber dem folgenden וַתֹּאמֶר („und gesagt“) die Unterscheidung zwischen allgemeinem Reden und der Einleitung des Zitats.
- source_word: בְחָזוֹן
  choice: in einer Vision
  rationale: Gibt sowohl den Offenbarungsmodus als auch den Rahmen der Rede natürlich wieder.
- source_word: לַחֲסִידֶיךָ
  choice: zu deinen Getreuen
  rationale: „Getreue“ bezeichnet Menschen, die von Loyalität und Frömmigkeit geprägt sind, ohne spätere kirchliche Vorstellungen mit dem Wort „Heilige“ einzutragen; der Plural folgt dem vorliegenden WLC-Text.
- source_word: שִׁוִּיתִי עֵזֶר עַל
  choice: Ich habe Hilfe auf … gelegt
  rationale: Die ungewöhnliche, aber verständliche deutsche Wendung erhält das Bild des hebräischen Textes, wonach Hilfe auf eine Person gelegt beziehungsweise ihr übertragen wird.
- source_word: גִּבּוֹר
  choice: einen Helden
  rationale: Das Substantiv kann einen starken Mann, Kämpfer oder Helden bezeichnen. „Held“ ist knapp, poetisch und lässt offen, ob vor allem Stärke oder kriegerische Tüchtigkeit gemeint ist.
- source_word: הֲרִימוֹתִי
  choice: ich habe … erhöht
  rationale: Das Hifil von רום bezeichnet hier die Erhebung zu herausgehobener, im Kontext königlicher Stellung.
- source_word: בָחוּר
  choice: einen Erwählten
  rationale: Die kontextuell naheliegende Bedeutung „Erwählter“ entspricht der göttlichen Auswahl aus dem Volk; die ebenfalls mögliche lexikalische Bedeutung „junger Mann“ bleibt in einer Fußnote erhalten.
- source_word: מֵעָם
  choice: aus dem Volk
  rationale: Die Präposition מן bezeichnet die Herkunft beziehungsweise Auswahl aus der Gemeinschaft.
theological_decisions:
- issue: Bezug der Aussage im davidischen Bundeskontext von Psalm 89
  choice: Die Übersetzung bleibt beim unmittelbaren Bezug auf den von Gott ausgewählten und erhöhten davidischen König.
  alternative: Eine ausdrückliche messianische Deutung, die über David hinausweist.
  rationale: Der Wortlaut verlangt keine explizite messianische Erweiterung. Ein typologisches Verständnis bleibt möglich, wird aber nicht in die Übersetzung eingetragen.
- issue: Numerus von לַחֲסִידֶיךָ
  choice: 'Plural: „deinen Getreuen“ nach dem vorliegenden WLC-Text.'
  alternative: 'Singular: „deinem Getreuen“, wie eine abweichende Lesart und einige Übersetzungen bezeugen.'
  rationale: Der Plural der bereitgestellten hebräischen Textform hat Vorrang; die abweichende Überlieferung wird transparent in der Fußnote genannt.
- issue: Bild von auf den Helden gelegter Hilfe
  choice: Das konkrete Bild wird als „Hilfe auf einen Helden gelegt“ bewahrt.
  alternative: 'Deutend: „einem Helden Hilfe gewährt“ oder „einen Helden mit Kraft ausgestattet“.'
  rationale: Eine glättende Wiedergabe könnte die Hilfe als bloße Unterstützung oder als Kraft festlegen. Der hebräische Ausdruck bleibt bildhaft und lässt die genaue Art der Beauftragung beziehungsweise Befähigung offen.
translation_notes:
  register: Moderne, gehobene Standardsprache mit poetischer Satzführung. Das seltene Bild „Hilfe auf einen Helden legen“ wurde bewusst erhalten, weil es verständlich ist und die Offenheit des hebräischen Ausdrucks besser wahrt als eine stark deutende Glättung.
