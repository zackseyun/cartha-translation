revisions:
- from: Ja, du hast die Schneide seines Schwertes zurückweichen lassen[a] und ihn im Kampf nicht standhalten lassen.[b]
  to: Auch hast du die Schärfe seines Schwertes abgestumpft[a] und ihm im Kampf keinen festen Stand gegeben.[b]
  rationale: Die Revision ersetzt zwei im Deutschen schwer verständliche Kausativformulierungen durch idiomatische, quellentreue Wendungen. Die bildhafte, wörtlichere Aussage über die Schwertschneide und die möglichen Nuancen des zweiten Halbverses bleiben in Fußnoten transparent. Die direkte Zuschreibung des Handelns an Gott bleibt unverändert.
