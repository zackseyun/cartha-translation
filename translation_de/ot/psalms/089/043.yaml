base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/043.yaml
  text: Indeed[a], you turn back the edge of his sword[b], and you have not made him stand in battle.
translation:
  language: de
  text: Auch hast du die Schärfe seines Schwertes abgestumpft[a] und ihm im Kampf keinen festen Stand gegeben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Du hast die Schneide seines Schwertes zurückgewandt.“ Die Formulierung beschreibt, dass das Schwert unwirksam gemacht wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „du hast ihn im Kampf nicht aufrechterhalten“ oder „du hast ihn nicht befähigt, im Kampf standzuhalten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Ja
  rationale: Die Partikel wirkt hier in der fortlaufenden Klage bekräftigend und steigernd. „Ja“ gibt diese Funktion im Deutschen knapp und natürlich wieder.
- source_word: תָּשִׁיב
  choice: du hast … zurückweichen lassen
  rationale: Der Hifil von שוב bezeichnet ein Veranlassen zur Umkehr bzw. zum Zurückweichen. Die Formulierung bewahrt das hebräische Bild; im deutschen Erzählzusammenhang gibt das Perfekt den vollzogenen Rückschlag natürlich wieder.
- source_word: צוּר
  choice: die Schneide
  rationale: Im Konstrukt mit „seines Schwertes“ bezeichnet צוּר hier die Schneide oder Schärfe, nicht den sonst häufigen „Fels“.
- source_word: חַרְבּוֹ
  choice: seines Schwertes
  rationale: Die Genitivverbindung bildet das hebräische Konstruktverhältnis klar und idiomatisch ab.
- source_word: הֲקֵימֹתוֹ
  choice: ihn … nicht standhalten lassen
  rationale: Der Hifil von קום bedeutet, jemanden stehen zu lassen bzw. zum Stehen zu befähigen. „Standhalten lassen“ überträgt das konkrete Bild in den militärischen Zusammenhang, ohne die göttliche Verursachung abzuschwächen.
- source_word: בַּמִּלְחָמָה
  choice: im Kampf
  rationale: „Im Kampf“ ist eine natürliche deutsche Wiedergabe und bezeichnet hier die konkrete militärische Auseinandersetzung.
theological_decisions:
- issue: Anthropomorphe Darstellung Gottes als Handelnder gegen den davidischen König
  choice: 'Die direkte Anrede und Gottes Verursachung bleiben erhalten: „du hast … zurückweichen lassen“ und „ihn … nicht standhalten lassen“.'
  alternative: Unpersönlich formulieren oder lediglich feststellen, dass der König unterlag.
  rationale: Die Klage schreibt den militärischen Rückschlag ausdrücklich Gottes Handeln zu. Diese theologische Spannung darf nicht abgeschwächt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Bildsprache der zurückweichenden Schwertschneide bleibt im Haupttext erhalten und wird in der Fußnote erläutert; der zweite Halbvers wird für heutige Leser idiomatisch, aber weiterhin kausativ formuliert.
