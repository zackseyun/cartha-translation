  text: אִם יַֽעַזְב֣וּ בָ֭נָי/ו תּוֹרָתִ֑/י וּ֝/בְ/מִשְׁפָּטַ֗/י לֹ֣א יֵלֵכֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/030.yaml
  text: If his sons abandon my law and do not walk in my judgments[b][a],
translation:
  language: de
  text: Wenn seine Söhne mein Gesetz verlassen[a] und nicht nach meinen Rechtsbestimmungen leben[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Weisung“. Das hebräische Wort Tora kann sowohl Weisung als auch Gesetz bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nicht in meinen Rechtsbestimmungen gehen“; auch: „sich nicht nach meinen Rechtsbestimmungen richten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet einen Bedingungssatz ein und bewahrt den naheliegenden konditionalen Sinn, ohne die Möglichkeit als Gewissheit darzustellen.
- source_word: יַעַזְבוּ
  choice: verlassen
  rationale: עזב bedeutet verlassen oder aufgeben. „Verlassen“ ist im heutigen Deutsch natürlich und kann hier die Abkehr von Gottes Gesetz ausdrücken.
- source_word: בָנָיו
  choice: seine Söhne
  rationale: Die ausdrücklich maskuline Pluralform mit Suffix der 3. Person Singular wird genau wiedergegeben; im Kontext sind die davidischen Nachkommen gemeint.
- source_word: תּוֹרָתִי
  choice: mein Gesetz
  rationale: תורה kann Weisung oder Gesetz bedeuten. Der Parallelismus mit Gottes Rechtsbestimmungen legt hier die rechtlich-bundestheologische Nuance nahe.
- source_word: וּבְמִשְׁפָּטַי
  choice: nach meinen Rechtsbestimmungen
  rationale: משפטים bezeichnet hier verbindliche rechtliche Bestimmungen. Die Wiedergabe mit „nach“ macht die idiomatische Bedeutung des hebräischen בְ beim Verb des Gehens im Deutschen deutlich.
- source_word: לֹא יֵלֵכוּן
  choice: nicht … leben
  rationale: הלך bezeichnet in diesem Zusammenhang bildlich die Lebensführung. „Leben nach“ gibt diese Bedeutung in natürlichem modernem Deutsch wieder, während eine Fußnote die wörtliche Metapher bewahrt.
theological_decisions:
- issue: Wiedergabe von תּוֹרָה im rechtlich-bundestheologischen Kontext
  choice: mein Gesetz
  alternative: meine Weisung
  rationale: Das Wort hat beide Bedeutungsbereiche. Durch die Parallelstellung zu „meinen Rechtsbestimmungen“ tritt hier der rechtliche Aspekt hervor, ohne den weiteren Sinn von göttlicher Weisung auszuschließen.
- issue: Geschlechtsspezifische Wiedergabe von בָנָיו
  choice: seine Söhne
  alternative: seine Kinder
  rationale: Die hebräische Form ist ausdrücklich maskulin plural. „Söhne“ wahrt die Form und den Zusammenhang der davidischen Nachkommenschaft.
- issue: Wiedergabe der Weg-Metapher in לֹא יֵלֵכוּן
  choice: nicht nach meinen Rechtsbestimmungen leben
  alternative: nicht in meinen Rechtsbestimmungen wandeln
  rationale: Die Hauptfassung vermittelt den gemeinten Lebenswandel in verständlichem Gegenwartsdeutsch; die Fußnote erhält die hebräische Bildsprache und eine formalere Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Bedingungssatz bleibt offen und wird durch das abschließende Komma als Fortsetzung zum folgenden Vers gekennzeichnet. Die Hauptfassung gibt die hebräische Weg-Metapher idiomatisch wieder; die wörtlichere Form steht in der Fußnote.
