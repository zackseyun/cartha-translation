  text: 'Denn ich sagte: „Für immer wird treue Liebe aufgebaut[a]; im Himmel festigst du deine Treue.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für immer wird treue Liebe fest gegründet.“ Das hebräische Verb bewahrt das Bild des Bauens, kann aber auch allgemeiner im Sinn von „errichten“ oder „fest gründen“ wiedergegeben werden.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine begründende oder erläuternde Aussage ein und entspricht dem Zusammenhang natürlich.
- source_word: אָמַרְתִּי
  choice: ich sagte
  rationale: Gibt das Qal Perfekt 1. Person Singular ohne interpretierende Verstärkung wieder.
- source_word: עוֹלָם
  choice: für immer
  rationale: Bewahrt die zeitlich unbegrenzte Aussage in natürlichem modernem Deutsch.
- source_word: חֶסֶד
  choice: treue Liebe
  rationale: Verbindet Zuwendung und beständige Loyalität, ohne den Ausdruck ausschließlich auf Bund, Barmherzigkeit oder Gefühl zu verengen.
- source_word: יִבָּנֶה
  choice: wird ... aufgebaut
  rationale: Bewahrt das passive Nifal und das poetische Bild des Bauens; eine allgemeinere Wiedergabe wäre „wird ... fest gegründet“.
- source_word: שָׁמַיִם
  choice: im Himmel
  rationale: Das hebräische שָׁמַיִם kann im Deutschen idiomatisch als kollektiver Singular „Himmel“ wiedergegeben werden.
- source_word: תָּכִן
  choice: gründest du ... fest
  rationale: Gibt die kausative Bedeutung von כון als Festmachen oder Gründen wieder; das deutsche Präsens kann eine bleibende bzw. gewisse Aussage ausdrücken.
- source_word: אֱמוּנָתְךָ
  choice: deine Treue
  rationale: Bezeichnet Gottes Beständigkeit, Verlässlichkeit und Treue in knapper, theologisch gewichtiger Sprache.
- source_word: בָהֶם
  choice: im Himmel
  rationale: Macht den Rückbezug des Pronomens auf שָׁמַיִם im Deutschen ausdrücklich und flüssig.
theological_decisions:
- issue: Bedeutungsumfang von חֶסֶד im poetisch-bundestheologischen Zusammenhang
  choice: treue Liebe
  alternative: Gnade; Bundestreue; Barmherzigkeit
  rationale: „Treue Liebe“ hält Liebe und loyale Beständigkeit zusammen, ohne eine einzelne theologische Dimension zum alleinigen Sinn zu machen.
- issue: Direkte Anrede Gottes im zweiten Halbvers
  choice: „gründest du deine Treue fest“
  alternative: unpersönliche Aussage, dass die Treue im Himmel feststeht
  rationale: Die Verbform der 2. Person maskulin Singular und das Possessivsuffix „deine“ weisen klar auf die direkte Anrede Gottes.
- issue: Zeitwert von תָּכִן
  choice: deutsches Präsens „gründest“
  alternative: Futur „wirst ... fest gründen“
  rationale: Die hebräische Form kann im poetischen Parallelismus eine gegenwärtig-gültige oder gewisse Aussage bezeichnen; das Präsens wahrt diese Offenheit besser als ein ausschließlich zukünftiges Verständnis.
translation_notes:
  register: Moderne, würdige Psalmsprache mit bewusst erhaltener Baumetapher. „Treue Liebe“ ist verständlich und bildet den Bedeutungsreichtum von חֶסֶד ab. Der Fußnotenmarker steht am Versende, da die Anmerkung mehrere Formulierungen des Verses betrifft.
