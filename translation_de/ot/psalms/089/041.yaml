  text: שַׁ֭סֻּ/הוּ כָּל עֹ֣בְרֵי דָ֑רֶךְ הָיָ֥ה חֶ֝רְפָּ֗ה לִ/שְׁכֵנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/041.yaml
  text: All who pass by the way have plundered him[a]; he has become a reproach to his neighbors.
translation:
  language: de
  text: Alle, die auf dem Weg vorbeiziehen, haben ihn ausgeplündert; er ist seinen Nachbarn zum Gespött geworden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁסֻּהוּ
  choice: haben ihn ausgeplündert
  rationale: Das Verb שׁסה bezeichnet feindliches Plündern oder Berauben. „Ausgeplündert“ gibt die vollendete Handlung und die gewaltsame Wegnahme im modernen Deutschen prägnant wieder.
- source_word: כָּל
  choice: Alle
  rationale: כָּל umfasst hier kollektiv und distributiv sämtliche Personen der folgenden Partizipialgruppe.
- source_word: עֹבְרֵי דָרֶךְ
  choice: die des Weges vorüberziehen
  rationale: Die Wendung bedeutet wörtlich etwa „die Vorüberziehenden des Weges“. Die gewählte Fassung bewahrt das Wegmotiv und klingt zugleich würdig und verständlich.
- source_word: הָיָה
  choice: ist … geworden
  rationale: Das Qatal bezeichnet im Zusammenhang einen eingetretenen Zustand mit gegenwärtigem Ergebnis; „ist geworden“ bildet diesen resultativen Sinn ab.
- source_word: חֶרְפָּה
  choice: zum Gespött
  rationale: חֶרְפָּה bezeichnet Schmach, Hohn oder einen Gegenstand des Spottes. Die idiomatische Verbindung „jemandem zum Gespött werden“ gibt die öffentliche Erniedrigung natürlich wieder.
- source_word: לִשְׁכֵנָיו
  choice: seinen Nachbarn
  rationale: שָׁכֵן bezeichnet einen Nachbarn beziehungsweise einen in der Nähe Wohnenden. Der Dativ in der deutschen Wendung „jemandem zum Gespött“ gibt die Relation von ל idiomatisch wieder.
theological_decisions:
- issue: Bezug der männlichen Singularpronomen
  choice: Die Pronomen werden mit „ihn“ wiedergegeben, ohne den Bezug im Vers ausdrücklich zu bestimmen.
  alternative: Den davidischen König, den Gesalbten oder das durch ihn vertretene Volk ausdrücklich nennen.
  rationale: Der unmittelbare Zusammenhang legt den gefallenen davidischen König beziehungsweise Gesalbten nahe, doch der Vers selbst verwendet nur pronominale Formen. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes Standarddeutsch in einem würdigen Klagepsalm-Register. Die leicht gehobene Formulierung „des Weges vorüberziehen“ erhält das hebräische Wegmotiv, ohne altertümliche oder konfessionell geprägte Sprache zu verwenden.
