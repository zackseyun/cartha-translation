source:
  edition: WLC
  text: אַף אָ֭נִי בְּכ֣וֹר אֶתְּנֵ֑/הוּ עֶ֝לְי֗וֹן לְ/מַלְכֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/027.yaml
  text: Indeed[a], I will make him the firstborn, the highest of the kings of the earth.
translation:
  language: de
  text: Auch ich werde ihn zum Erstgeborenen[a] machen, zum Höchsten unter den Königen der Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Erstgeborener“ bezeichnet hier den höchsten Rang und besondere Vorrechte, nicht unbedingt die tatsächliche Reihenfolge der Geburt.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף אָ֭נִי
  choice: Auch ich
  rationale: Die Verbindung aus אַף und dem ausdrücklich gesetzten Pronomen אָ֭נִי fügt der vorausgehenden Zusage eine weitere göttliche Zusage hinzu und betont zugleich den Sprecher. „Auch ich“ gibt diesen anschließenden und hervorhebenden Sinn knapp und natürlich wieder.
- source_word: בְּכ֣וֹר
  choice: zum Erstgeborenen
  rationale: בְּכוֹר bezeichnet hier im königlichen Zusammenhang vor allem Rang, Vorrecht und Erbenstellung, ohne zwingend eine Aussage über die tatsächliche Geburtsreihenfolge zu machen. Der traditionelle Statusbegriff „Erstgeborener“ bewahrt diese Bedeutungstiefe.
- source_word: אֶתְּנֵ֑הוּ
  choice: werde ihn … machen
  rationale: נתן hat mit dem prädikativen בְּכוֹר hier den Sinn, jemanden in eine Stellung einzusetzen beziehungsweise zu etwas zu machen. Die deutsche Formulierung gibt diesen resultativen Sinn idiomatisch wieder.
- source_word: עֶ֝לְי֗וֹן
  choice: zum Höchsten
  rationale: Das Adjektiv bezeichnet hier den höchsten Rang des davidischen Königs im Verhältnis zu anderen irdischen Königen. „Höchsten“ vermeidet zugleich, „der Höchste“ als feste Gottesbezeichnung misszuverstehen.
- source_word: לְ/מַלְכֵי אָֽרֶץ
  choice: unter den Königen der Erde
  rationale: Das לְ kennzeichnet nach עֶלְיוֹן die Bezugs- beziehungsweise Vergleichsgruppe. „Unter den Königen der Erde“ drückt aus, dass er innerhalb dieser Gruppe den höchsten Rang einnimmt.
theological_decisions:
- issue: Königliche und möglicherweise messianische Bedeutung von „Erstgeborener“
  choice: Der Statusbegriff „Erstgeborener“ bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
  alternative: Dynamisch mit „Vorrangiger“, „Höchster“ oder „Erbe“ übersetzen.
  rationale: Der unmittelbare Kontext spricht vom davidischen König; in christlicher kanonischer Lesart kann der Vers darüber hinaus messianisch verstanden werden. Die Übersetzung macht diese Auslegung nicht ausdrücklich, bewahrt aber den hebräischen Begriff mit seiner Aussage über Rang und Vorrecht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau „zum Erstgeborenen … zum Höchsten“ bildet die hebräische Rangsteigerung nach, ohne die königliche oder mögliche messianische Bedeutung auszuformulieren.
