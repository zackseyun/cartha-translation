    text: „Maskil“ ist ein hebräischer musikalischer oder literarischer Fachbegriff in Psalmüberschriften. Seine genaue Bedeutung ist unsicher; möglicherweise bezeichnet er ein nachdenkliches oder unterweisendes Lied.
