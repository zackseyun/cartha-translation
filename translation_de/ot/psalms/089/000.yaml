lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Der hebräische Fachbegriff der Psalmüberschrift wird transliteriert, da seine genaue Bedeutung unsicher ist. So wird keine umstrittene Deutung in den Haupttext eingetragen.
- source_word: לְ
  choice: von
  rationale: Die Präposition kennzeichnet in Psalmüberschriften häufig Zuordnung oder Verbindung. „Von“ ist im Deutschen knapp und idiomatisch, ohne eindeutig zwischen Verfasserschaft, Widmung und sonstiger Zugehörigkeit zu entscheiden.
- source_word: אֵיתָן
  choice: Etan
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibelnamensform wiedergegeben.
- source_word: הָאֶזְרָחִי
  choice: der Esrachiter
  rationale: Die überlieferte Form wird als Herkunfts- oder Sippenbezeichnung wiedergegeben. Die mögliche Deutung als „Serachiter“ wird in einer Fußnote bewahrt.
