  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des Hebräischen zuverlässig wieder: die rhetorische Existenzfrage („Wo sind“), den Plural von חֲסָדֶיךָ durch „Erweise“, den zeitlichen Kontrast mit „früheren“, die Gottes-Anrede „Herr“, den Eid an David sowie die bewusst offene Einordnung „in deiner Treue“ für בֶּאֱמוּנָתֶךָ. Die syntaktische Zuordnung des Relativsatzes zu den Liebeserweisen entspricht dem Ausgangstext.'
