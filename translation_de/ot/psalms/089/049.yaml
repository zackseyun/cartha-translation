id: PSA.89.49
reference: Psalms 89:49
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַיֵּ֤ה חֲסָדֶ֖י/ךָ הָ/רִאשֹׁנִ֥ים אֲדֹנָ֑/י נִשְׁבַּ֥עְתָּ לְ֝/דָוִ֗ד בֶּ/אֱמוּנָתֶֽ/ךָ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/049.yaml
  text: Where are your former acts of steadfast love[a], Lord[b], which you swore to David in your faithfulness?
translation:
  language: de
  text: Wo sind deine früheren Erweise beständiger Liebe[a], Herr, die du David in deiner Treue[b] zugeschworen hast?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „deine früheren Gnadenerweise“ oder „deine früheren Taten der Bundestreue“. Im Hebräischen steht der Ausdruck für beständige Liebe im Plural.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „aufgrund deiner Treue“ oder „bei deiner Treue“. Die hebräische Wendung kann die Art und Weise oder die Grundlage des Eides bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Wo sind
  rationale: Die Orts- und Existenzfrage wird im Deutschen mit „Wo sind“ wiedergegeben; der Plural richtet sich nach חֲסָדֶיךָ.
- source_word: חֲסָדֶיךָ
  choice: deine Erweise beständiger Liebe
  rationale: חֶסֶד bezeichnet hier Gottes verlässliche, bundestreue Liebe. „Erweise“ macht den hebräischen Plural natürlich verständlich und verweist auf konkrete Bekundungen dieser Liebe.
- source_word: הָרִאשֹׁנִים
  choice: früheren
  rationale: Im Klagezusammenhang geht es um die in früherer Zeit erfahrenen oder verheißenen Liebeserweise im Gegensatz zur gegenwärtigen Not.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Der göttliche Hoheitstitel steht als direkte Anrede und wird im modernen deutschen Bibelregister gewöhnlich mit „Herr“ wiedergegeben.
- source_word: נִשְׁבַּעְתָּ
  choice: zugeschworen hast
  rationale: Das Verb bezeichnet einen Eid. Mit dem Dativ „David“ drückt „zugeschworen“ idiomatisch aus, dass Gott David diese Liebeserweise eidlich zugesagt hat.
- source_word: לְדָוִד
  choice: David
  rationale: Die Präposition לְ kennzeichnet hier den Empfänger der eidlichen Zusage; im Deutschen steht dieser als Dativobjekt ohne Präposition.
- source_word: בֶּאֱמוּנָתֶךָ
  choice: in deiner Treue
  rationale: אֱמוּנָה bezeichnet Festigkeit, Verlässlichkeit und Treue. Die Präposition בְּ kann den Bereich, die Art und Weise oder die Grundlage des Schwörens ausdrücken; „in deiner Treue“ bewahrt diese Offenheit.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Zusammenhang der Davidverheißung
  choice: beständige Liebe
  alternative: Gnade; Barmherzigkeit; Bundestreue
  rationale: „Beständige Liebe“ verbindet Zuwendung mit Verlässlichkeit und passt zum Bundes- und Verheißungskontext, ohne den Begriff auf eine einzige dogmatische Kategorie zu verengen.
- issue: Der Plural חֲסָדֶיךָ
  choice: Erweise beständiger Liebe
  alternative: Gnadenerweise; deine früheren Liebestaten
  rationale: Der hebräische Plural wird ausdrücklich bewahrt, zugleich aber in natürlichem Deutsch als Mehrzahl konkreter Bekundungen formuliert.
- issue: Funktion von בְּ in בֶּאֱמוּנָתֶךָ
  choice: in deiner Treue
  alternative: bei deiner Treue; aufgrund deiner Treue
  rationale: Die Formulierung lässt offen, ob Gottes Treue als Sphäre, Art und Weise oder Grundlage seines Eides verstanden wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Klagefrage bleibt erhalten. Der Relativsatz stellt in natürlicher deutscher Syntax den Bezug zwischen den Liebeserweisen und dem David geleisteten Eid her.
