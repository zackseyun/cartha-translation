id: PSA.89.37
reference: Psalms 89:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כְּ֭/יָרֵחַ יִכּ֣וֹן עוֹלָ֑ם וְ/עֵ֥ד בַּ֝/שַּׁ֗חַק נֶאֱמָ֥ן סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/037.yaml
  text: Like the moon[a], it will be established forever, and the witness in the sky is faithful[b]. Selah
translation:
  language: de
  text: Wie der Mond wird er für immer feststehen; und der Zeuge am Himmel ist zuverlässig.[a] Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Zeugen am Himmel“ ist möglicherweise der Mond gemeint, der als beständiger Zeuge für die Dauer der Verheißung steht.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּיָרֵחַ
  choice: Wie der Mond
  rationale: Das Präfix כְּ kennzeichnet einen Vergleich; „wie der Mond“ gibt ihn im modernen Deutschen natürlich und präzise wieder.
- source_word: יִכּוֹן
  choice: wird er … feststehen
  rationale: Das Nifal-Imperfekt von כון bezeichnet ein dauerhaftes Gefestigtsein. Das Pronomen „er“ nimmt aus dem vorhergehenden Vers den grammatisch männlichen „Thron“ auf, ohne ihn im Vers ausdrücklich zu wiederholen.
- source_word: עוֹלָם
  choice: für immer
  rationale: Im poetischen Bundeskontext bezeichnet עוֹלָם bleibende Dauer; „für immer“ ist verständlich und würdevoll.
- source_word: וְעֵד
  choice: und der Zeuge
  rationale: עֵד bedeutet „Zeuge“. Der bestimmte Artikel ist im Deutschen sachgerecht, weil die Wendung offenbar auf einen bestimmten himmlischen Zeugen verweist; dessen Identität bleibt jedoch offen.
- source_word: בַּשַּׁחַק
  choice: am Himmel
  rationale: שַׁחַק kann poetisch Himmel, Himmelsraum oder Wolken bezeichnen. „Am Himmel“ passt zum singulären Ausdruck und lässt die genaue Erscheinung unbestimmt.
- source_word: נֶאֱמָן
  choice: ist zuverlässig
  rationale: Das Adjektiv bezeichnet Verlässlichkeit und Beständigkeit. „Zuverlässig“ beschreibt den Zeugen idiomatisch, ohne die mögliche bundestheologische Resonanz von „treu“ auszuschließen.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und Funktion des Ausdrucks unsicher sind, wird er nach gängiger Praxis transkribiert.
theological_decisions:
- issue: Bezugswort des unausgesprochenen Subjekts von יִכּוֹן
  choice: Das Pronomen „er“ verweist auf den im vorhergehenden Vers genannten Thron.
  alternative: Den Thron im Vers ausdrücklich wiederholen oder den Bezug auf Davids Nachkommenschaft beziehen.
  rationale: Das Hebräische setzt das Subjekt aus dem Zusammenhang voraus. Das maskuline deutsche Pronomen wahrt die knappe Fortführung und entspricht dem unmittelbar vorausgehenden כִּסְאוֹ („sein Thron“).
- issue: Identität des Zeugen am Himmel
  choice: Der Zeuge wird im Haupttext nicht identifiziert.
  alternative: Den Zeugen ausdrücklich mit dem Mond oder einer anderen Himmelserscheinung gleichsetzen.
  rationale: Der hebräische Text nennt seine Identität nicht ausdrücklich. Der Mond ist im unmittelbaren Zusammenhang naheliegend, doch die Deutung soll nicht als sichere Identifikation in den Haupttext eingehen.
translation_notes:
  register: Moderne, klare und zugleich poetisch-würdevolle Standardsprache. Das Semikolon bildet die knappe hebräische Reihung ab, ohne die umstrittene Beziehung zwischen Mond und Zeuge syntaktisch festzulegen.
