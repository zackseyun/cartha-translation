  text: בְּ֭/שִׁמְ/ךָ יְגִיל֣וּ/ן כָּל הַ/יּ֑וֹם וּ/בְ/צִדְקָתְ/ךָ֥ יָרֽוּמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/016.yaml
  text: In your name they rejoice all day long[a], and in your righteousness they are exalted.
translation:
  language: de
  text: In deinem Namen jubeln sie den ganzen Tag, und durch deine Gerechtigkeit werden sie erhöht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: In deiner Gerechtigkeit werden sie erhöht.'
    reason: Die Präposition בְּ kann hier neben einem kausalen Verständnis („durch“) auch den Bereich beziehungsweise die Grundlage ausdrücken („in“).
lexical_decisions:
- source_word: בְּשִׁמְךָ
  choice: in deinem Namen
  rationale: Das ב bezeichnet hier am ehesten den Bereich oder Grund ihrer Freude. Gottes »Name« steht für seinen offenbarten Charakter und Ruf, nicht nur für eine Bezeichnung.
- source_word: יְגִילוּן
  choice: jubeln sie
  rationale: Das Verb גיל bezeichnet freudigen Jubel. »Jubeln« gibt die lebhafte Freude natürlich und prägnant wieder.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Die Wendung bezeichnet eine über den ganzen Tag andauernde Freude und wird so in modernem Deutsch idiomatisch wiedergegeben.
- source_word: וּבְצִדְקָתְךָ
  choice: und durch deine Gerechtigkeit
  rationale: צדקה kann Gerechtigkeit, Recht oder gerechtes Handeln bezeichnen. »Durch« bringt hier plausibel zum Ausdruck, dass Gottes Gerechtigkeit der Grund ihrer Erhöhung ist.
- source_word: יָרוּמוּ
  choice: werden sie erhöht
  rationale: Das Verb רום bedeutet, hoch oder erhöht zu sein. Die Form lässt offen, wer unmittelbar handelt; die passive deutsche Fassung bewahrt dies und verweist im Zusammenhang auf Gottes Gerechtigkeit als Ursache.
theological_decisions:
- issue: Bedeutung von Gottes צדקה im Lob- und Bundeskontext
  choice: Gerechtigkeit
  alternative: Recht; gerechtes Handeln
  rationale: »Gerechtigkeit« wahrt die breite Bedeutung des hebräischen Begriffs, die sowohl Gottes moralische Rechtschaffenheit als auch sein gerechtes, bundestreues Handeln umfassen kann. Die Alternative wird in der Fußnote offengehalten.
- issue: Art der Erhöhung des Volkes
  choice: werden sie erhöht
  alternative: kommen sie zu Ehren; werden sie emporgehoben
  rationale: Der Text nennt weder die genaue Art der Erhöhung noch einen ausdrücklich bezeichneten Handelnden. Die gewählte Formulierung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Jubeln« bewahrt den freudigen Ton; »werden sie erhöht« hält die bildhafte und theologisch offene Ausdrucksweise des Hebräischen fest.
