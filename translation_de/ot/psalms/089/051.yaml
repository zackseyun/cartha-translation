base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/051.yaml
  text: with which your enemies have taunted[a], O Yahweh[b], with which they have taunted the footsteps of your anointed.
translation:
  language: de
  text: mit der deine Feinde dich verhöhnt haben, Jahwe, mit der sie die Schritte deines Gesalbten[b] verhöhnt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: „die Fersen“ beziehungsweise „die Spuren deines Gesalbten“. „Gesalbter“ kann hier den davidischen König bezeichnen und hat zugleich messianischen Anklang; daher wäre auch „deines Messias“ möglich.'
    reason: lexical_and_messianic_alternative
lexical_decisions:
- source_word: חֵרְפוּ
  choice: verhöhnt haben
  rationale: חרף bezeichnet schmähendes, spöttisches Herabsetzen. „verhöhnen“ gibt die feindselige und höhnische Kraft im heutigen Deutsch natürlich wieder.
- source_word: אוֹיְבֶיךָ
  choice: deine Feinde
  rationale: Direkte Wiedergabe des Nomens mit Suffix der 2. Person Singular.
- source_word: יְהוָה
  choice: HERR
  rationale: Die im deutschen Bibelgebrauch weithin erkennbare Wiedergabe des Tetragramms; eine Fußnote weist auf den Gottesnamen JHWH hin.
- source_word: אֲשֶׁר
  choice: mit der
  rationale: Das Relativwort knüpft an die im vorigen Vers genannte Schmähung an; das feminine „der“ nimmt im Deutschen sinngemäß „Schmähung“ auf.
- source_word: עִקְּבוֹת
  choice: die Schritte
  rationale: Das Wort kann Fersen, Schritte oder Spuren bezeichnen. „Schritte“ bewahrt das konkrete Bewegungsbild und bleibt im Zusammenhang offen für das Auftreten oder Kommen des Gesalbten.
- source_word: מְשִׁיחֶךָ
  choice: deines Gesalbten
  rationale: Im unmittelbaren Kontext ist der davidische König als der von Gott Gesalbte gemeint. Die Übersetzung wahrt zugleich die weiterreichende messianische Resonanz, ohne sie im Haupttext ausdrücklich festzulegen.
theological_decisions:
- issue: Wiedergabe von מְשִׁיחֶךָ in einem Königspsalm mit messianischer Resonanz
  choice: deines Gesalbten
  alternative: deines Messias
  rationale: Der unmittelbare literarische Zusammenhang legt den gesalbten davidischen König nahe. Da dasselbe hebräische Wort auch „Messias“ zugrunde liegt, wird diese mögliche Resonanz in einer Fußnote erhalten.
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: HERR
  alternative: JHWH (traditionell oft Jahwe wiedergegeben)
  rationale: „HERR“ entspricht dem etablierten deutschen Bibelgebrauch und bleibt im Lesetext würdig und verständlich; die Fußnote macht transparent, dass im Hebräischen der persönliche Gottesname steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „verhöhnt haben“ bildet die hebräische Wiederholung bewusst ab. Der Vers setzt syntaktisch den vorhergehenden Vers fort.
