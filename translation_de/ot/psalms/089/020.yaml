source:
  edition: WLC
  text: מָ֭צָאתִי דָּוִ֣ד עַבְדִּ֑/י בְּ/שֶׁ֖מֶן קָדְשִׁ֣/י מְשַׁחְתִּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/020.yaml
  text: I have found David my servant[a]; with my holy oil I have anointed him.
translation:
  language: de
  text: Ich habe David, meinen Diener, gefunden[a]; mit meinem heiligen Öl habe ich ihn gesalbt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich fand David, meinen Diener; mit meinem heiligen Öl salbte ich ihn.« Die hebräischen Verbformen können hier im Deutschen auch mit dem Präteritum wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי
  choice: Ich habe … gefunden
  rationale: Das Qal-Perfekt 1. Person Singular bezeichnet eine abgeschlossene göttliche Handlung. Das deutsche Perfekt klingt natürlich und lässt ihre fortdauernde Bedeutung im Bundeskontext erkennen; auch Präteritum ist möglich.
- source_word: דָּוִד
  choice: David
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: עַבְדִּי
  choice: meinen Diener
  rationale: עבד kann »Diener« oder »Sklave« bedeuten. Hier ist es eine ehrende Bezeichnung Davids in seinem Dienst für Gott; »Diener« trifft den Kontext, ohne den Status unnötig als Unfreiheit zu bestimmen.
- source_word: בְּשֶׁמֶן
  choice: mit … Öl
  rationale: Die Präposition ב bezeichnet beim Salben idiomatisch das verwendete Mittel und wird daher mit »mit« wiedergegeben.
- source_word: קָדְשִׁי
  choice: meinem heiligen
  rationale: קדשׁ bezeichnet das Gott Geweihte beziehungsweise Abgesonderte. »Heilig« ist im kultischen und königlichen Zusammenhang die präzise, geläufige Wiedergabe.
- source_word: מְשַׁחְתִּיו
  choice: habe ich ihn gesalbt
  rationale: Das Qal-Perfekt 1. Person Singular mit Suffix der 3. Person Singular bezeichnet die vollzogene Salbung Davids. Das deutsche Perfekt entspricht dem ersten Verb und bewahrt die fortwirkende Bedeutung der Beauftragung.
theological_decisions:
- issue: Königliche Salbung und mögliche messianische Resonanz
  choice: Der historische Bezug auf David bleibt ausdrücklich erhalten, ohne einen messianischen Titel in den Text einzufügen.
  alternative: Eine deutende Wiedergabe, die David ausdrücklich als messianisches Vorbild oder als »Gesalbten« bezeichnet.
  rationale: Der hebräische Text nennt David und berichtet von seiner Salbung. Mögliche typologische oder messianische Bezüge des Gesamtpsalms sollen nicht durch einen Zusatz in diesen Vers hineingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt dem poetischen Parallelismus des Hebräischen, bleibt dabei aber natürlich und gut verständlich.
