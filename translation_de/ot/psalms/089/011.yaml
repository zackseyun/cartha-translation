source:
  edition: WLC
  text: לְ/ךָ֣ שָׁ֭מַיִם אַף לְ/ךָ֥ אָ֑רֶץ תֵּבֵ֥ל וּ֝/מְלֹאָ֗/הּ אַתָּ֥ה יְסַדְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/011.yaml
  text: The heavens are yours; the earth also is yours[a]. The world and its fullness—you founded them.
translation:
  language: de
  text: Dein ist der Himmel, dein auch die Erde. Die Welt und alles, was sie erfüllt[a] – du hast sie gegründet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihre Fülle“, also alles, was sich in der Welt befindet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: Dein ist
  rationale: Die Präposition ל mit dem Suffix der 2. Person Singular bezeichnet Besitz. Die vorangestellte Wendung „Dein ist“ gibt die knappe, betonte hebräische Aussage würdig und unmittelbar wieder.
- source_word: שָׁמַיִם
  choice: der Himmel
  rationale: Obwohl das hebräische Wort formal pluralisch ist, bezeichnet es gewöhnlich den Himmelsraum. Der deutsche Singular ist hier die natürliche kosmische Entsprechung.
- source_word: אַף
  choice: auch
  rationale: 'אַף erweitert die erste Aussage nachdrücklich: Nicht nur der Himmel, sondern auch die Erde gehört Gott.'
- source_word: אָרֶץ
  choice: die Erde
  rationale: Der Parallelismus mit dem Himmel und die anschließende Nennung der Welt verlangen die kosmische Bedeutung, nicht „Land“.
- source_word: תֵּבֵל
  choice: die Welt
  rationale: תֵּבֵל bezeichnet die geordnete beziehungsweise bewohnte Welt; „die Welt“ ist im Deutschen klar und idiomatisch.
- source_word: מְלֹאָהּ
  choice: alles, was sie erfüllt
  rationale: Die Wendung gibt das wörtliche „ihre Fülle“ verständlich als den gesamten Inhalt der Welt wieder, ohne den Umfang einzuschränken.
- source_word: יְסַדְתָּם
  choice: du hast sie gegründet
  rationale: יסד trägt die Vorstellung des Gründens beziehungsweise Fundamentlegens. Das deutsche „sie“ lässt wie die hebräische Pluralform einen umfassenden Rückbezug auf die genannten Größen zu, kann grammatisch aber zugleich auf „die Welt“ bezogen werden.
theological_decisions:
- issue: Göttlicher Besitz und Schöpfungshandeln
  choice: Der Vers bezeugt sowohl Gottes Besitz an Himmel und Erde als auch sein gründendes Handeln an der Welt und allem, was sie erfüllt.
  alternative: Die Aussage ausdrücklich als Schöpfung aus dem Nichts ausführen oder sie auf bloße Herrschaft ohne Schöpfungsbezug reduzieren.
  rationale: Der hebräische Text nennt unmittelbar Besitz (לְךָ) und gründendes Handeln (יְסַדְתָּם), formuliert aber keine weitergehende dogmatische Erklärung.
- issue: Bezug des pluralischen Objektsuffixes in יְסַדְתָּם
  choice: Mit „sie“ den möglichen umfassenden Rückbezug offenlassen.
  alternative: Eindeutig nur auf „die Welt und alles, was sie erfüllt“ oder ausdrücklich auf sämtliche zuvor genannten Schöpfungsbereiche beziehen.
  rationale: Die maskuline Pluralendung ist nicht ohne Spannung mit den unmittelbar vorausgehenden femininen Nomina. Eine eindeutige Auflösung würde mehr festlegen als der Ausgangstext.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdiger Psalmen-Sprache. Die Besitzformel „Dein ist“ wahrt die poetische Betonung; der Gedankenstrich bildet die hervorgehobene Schlussaussage ab.
