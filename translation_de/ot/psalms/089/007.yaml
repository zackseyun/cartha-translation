  text: אֵ֣ל נַ֭עֲרָץ בְּ/סוֹד קְדֹשִׁ֣ים רַבָּ֑ה וְ֝/נוֹרָ֗א עַל כָּל סְבִיבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/007.yaml
  text: God is greatly feared in the council of the holy ones[b][a], and awesome above all who surround him.
translation:
  language: de
  text: Gott ist im Rat der Heiligen[a][b] überaus gefürchtet und gebietet mehr Ehrfurcht als alle, die ihn umgeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Versammlung“. Das hebräische Wort kann einen vertrauten Rat oder eine beratende Zusammenkunft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Mit den „Heiligen“ sind hier wahrscheinlich himmlische Wesen gemeint, nicht menschliche Heilige.
    reason: cultural_note
lexical_decisions:
- source_word: אֵל
  choice: Gott
  rationale: Im poetischen Zusammenhang bezeichnet אֵל den Gott Israels; „Gott“ ist die natürliche und eindeutige deutsche Wiedergabe.
- source_word: נַעֲרָץ
  choice: furchtgebietend
  rationale: Das Nifal-Partizip bezeichnet jemanden, dem mit ehrfürchtiger Scheu begegnet wird. „Furchtgebietend“ bewahrt sowohl den Furcht- als auch den Ehrfurchtsaspekt, ohne moralische Schlechtigkeit anzudeuten.
- source_word: בְּסוֹד
  choice: im Rat
  rationale: סוֹד kann einen vertrauten, beratenden Kreis oder eine Versammlung bezeichnen. „Rat“ passt hier zum wahrscheinlich himmlischen Umfeld, ohne die Art der Zusammenkunft abschließend festzulegen.
- source_word: קְדֹשִׁים
  choice: der Heiligen
  rationale: Die substantivierte Form bezeichnet „Heilige“ beziehungsweise „heilige Wesen“. Der unmittelbare Kontext legt himmlische Wesen nahe; die knappe Wiedergabe lässt die Bezeichnung selbst dennoch offen.
- source_word: רַבָּה
  choice: überaus
  rationale: Das Wort wird hier adverbial als starke Intensivierung verstanden. „Überaus“ gibt dies in würdigem, natürlichem Deutsch wieder.
- source_word: וְנוֹרָא
  choice: und ehrfurchtgebietend
  rationale: נוֹרָא beschreibt, dass Gott Ehrfurcht und Furcht hervorruft. „Ehrfurchtgebietend“ erhält den sakralen Ton und unterscheidet sich sinnvoll von נַעֲרָץ.
- source_word: עַל כָּל סְבִיבָיו
  choice: über alle, die ihn umgeben
  rationale: 'עַל wird hier komparativ beziehungsweise als Ausdruck der Überlegenheit verstanden: Gott ist mehr zu fürchten als alle in seiner Umgebung.'
theological_decisions:
- issue: Identität der „Heiligen“ und derer, die Gott umgeben
  choice: Die Formulierung bleibt im Haupttext „die Heiligen“; eine Fußnote nennt himmlische Wesen als im Kontext wahrscheinlichste Deutung.
  alternative: Menschliche Heilige oder eine gemischte anbetende Versammlung.
  rationale: Der Kontext von Psalm 89 spricht von den Himmeln und einer Versammlung überirdischer Wesen. Dennoch bezeichnet der hebräische Ausdruck sie nicht ausdrücklich als Engel; daher wird die wahrscheinliche Deutung nicht in den Haupttext hineingeschrieben.
- issue: Verhältnis von נַעֲרָץ und נוֹרָא
  choice: 'Zwei verwandte deutsche Ausdrücke bewahren die poetische Steigerung: „furchtgebietend“ und „ehrfurchtgebietend“.'
  alternative: Beide Ausdrücke nahezu gleich mit „gefürchtet“ beziehungsweise „zu fürchten“ wiederzugeben.
  rationale: Das Hebräische verwendet verwandte, aber nicht identische Wörter. Die deutsche Fassung soll ihre Überschneidung ebenso wie die leichte Bedeutungsnuance erkennen lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelität. „Furchtgebietend“ und „ehrfurchtgebietend“ sind bewusst gehoben, aber allgemein verständlich. Die Fußnotenmarker stehen unmittelbar nach der mehrdeutigen Wendung und entsprechen vollständig den beigefügten Fußnoten.
