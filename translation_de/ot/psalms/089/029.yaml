base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/029.yaml
  text: I will establish his offspring forever[a], and his throne as the days of heaven.
translation:
  language: de
  text: Ich werde seine Nachkommen für immer bestehen lassen und seinen Thron wie die Tage des Himmels bestehen lassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „solange der Himmel besteht“.'
    reason: Die Anmerkung bietet die mögliche idiomatische Deutung der hebräischen Vergleichsformel, ohne die Bildsprache des Grundtexts im Haupttext aufzugeben.
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Ich werde … bestehen lassen
  rationale: שׂים bedeutet grundlegend »setzen, stellen«; in der königlichen Verheißung drückt das Verb hier ein dauerhaftes Einsetzen beziehungsweise Erhalten aus. »Bestehen lassen« ist im Deutschen natürlich und wahrt den fortdauernden Sinn.
- source_word: לָעַד
  choice: für immer
  rationale: לָעַד bezeichnet unbegrenzte Dauer. »Für immer« ist die klare, gegenwärtige deutsche Entsprechung.
- source_word: זַרְעוֹ
  choice: seine Nachkommen
  rationale: זֶרַע ist hier kollektiv auf die Nachkommenschaft des davidischen Königs bezogen. »Nachkommen« gibt diesen Sinn verständlich wieder, ohne das im Deutschen missverständliche wörtliche »Same« zu verwenden.
- source_word: וְכִסְאוֹ
  choice: und seinen Thron
  rationale: כִּסֵּא bezeichnet den Thron und metonymisch die Königsherrschaft. Die konkrete Bildsprache bleibt mit »Thron« erhalten.
- source_word: כִּימֵי שָׁמָיִם
  choice: solange der Himmel besteht
  rationale: Wörtlich lautet die Wendung »wie die Tage des Himmels«. Die gewählte idiomatische Wiedergabe macht den Dauervergleich im modernen Deutschen verständlich; die wörtliche Form wird in der Fußnote bewahrt.
theological_decisions:
- issue: Dauer der davidischen Bundesverheißung
  choice: Die uneingeschränkte Dauer wird mit »für immer« und »solange der Himmel besteht« wiedergegeben.
  alternative: Die Aussage auf eine bestimmte Zahl von Generationen oder ein besonderes eschatologisches beziehungsweise dynastisches Modell festzulegen.
  rationale: Der hebräische Text formuliert eine starke poetische Dauerverheißung. Die Übersetzung bewahrt diese Spannung, ohne ihre geschichtliche oder endzeitliche Erfüllungsweise näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Bestehen lassen« und »solange der Himmel besteht« sind allgemein verständlich; die Fußnote hält zugleich die ungewöhnliche poetische Form des Hebräischen sichtbar.
