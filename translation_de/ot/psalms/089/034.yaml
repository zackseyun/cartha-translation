id: PSA.89.34
reference: Psalms 89:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹא אֲחַלֵּ֥ל בְּרִיתִ֑/י וּ/מוֹצָ֥א שְׂ֝פָתַ֗/י לֹ֣א אֲשַׁנֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/034.yaml
  text: I will not violate my covenant[b][a], or alter what has gone out from my lips.
translation:
  language: de
  text: Ich werde meinen Bund nicht verletzen[a] und nicht ändern, was über meine Lippen gekommen ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »entweihen« oder »brechen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »das Hervorgehen meiner Lippen«; gemeint ist das, was ich ausgesprochen habe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחַלֵּל
  choice: verletzen
  rationale: Das Piel von חלל bezeichnet hier, den Bund zu entheiligen beziehungsweise gegen ihn zu verstoßen. »Verletzen« ist im heutigen Deutsch bei verbindlichen Verpflichtungen verständlich und bewahrt den Ernst des Ausdrucks; die Alternativen werden in der Fußnote genannt.
- source_word: בְּרִיתִי
  choice: meinen Bund
  rationale: בְּרִית ist der übliche hebräische Begriff für eine feierlich bindende Bundesbeziehung. Das Possessivsuffix der ersten Person wird ausdrücklich wiedergegeben.
- source_word: מוֹצָא שְׂפָתַי
  choice: was über meine Lippen gekommen ist
  rationale: Die Wendung bedeutet wörtlich etwa »das Hervorgehen meiner Lippen« und bezeichnet das ausgesprochene Wort. Die Übersetzung bewahrt das hebräische Bild in verständlichem Deutsch.
- source_word: אֲשַׁנֶּה
  choice: ändern
  rationale: Das Piel von שנה bedeutet »ändern« oder »abändern«. »Ändern« ist hier natürlich und bezieht sich klar auf das zuvor ausgesprochene Wort.
- source_word: לֹא ... לֹא
  choice: nicht ... und nicht ...
  rationale: Die Wiederholung der Verneinung wird beibehalten, sodass beide parallelen Zusagen ihr eigenes Gewicht behalten.
theological_decisions:
- issue: Art der göttlichen Verpflichtung
  choice: Die konkrete Sprache von Bund und ausgesprochenem Wort bleibt erhalten.
  alternative: Die Aussage als allgemeine Lehre von Gottes Unveränderlichkeit oder lediglich als »Ich breche mein Versprechen nicht« wiederzugeben.
  rationale: Der Vers spricht ausdrücklich von Gottes Bund und dem, was über seine Lippen gekommen ist. Eine weitergehende dogmatische Ausdeutung wäre nicht Bestandteil der Übersetzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und das Bild der Lippen bleiben erhalten, ohne unnatürlich wörtlich zu klingen.
