source:
  edition: WLC
  text: לְ/ךָ֣ זְ֭רוֹעַ עִם גְּבוּרָ֑ה תָּעֹ֥ז יָ֝דְ/ךָ֗ תָּר֥וּם יְמִינֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/013.yaml
  text: Yours is an arm with might[a]; your hand is strong; your right hand is exalted.
translation:
  language: de
  text: Du hast einen mächtigen Arm[a]; stark ist deine Hand, hoch erhoben deine Rechte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit betontem Besitzbezug: „Dir gehört ein mächtiger Arm.“'
    reason: Die hebräische Wendung לְךָ kann den Besitzbezug besonders hervorheben; „Du hast“ bleibt im Haupttext die natürlichere moderne Wiedergabe.
lexical_decisions:
- source_word: לְךָ
  choice: Du hast
  rationale: Die Präposition לְ mit Suffix bezeichnet hier Besitz bzw. Zugehörigkeit. „Du hast“ gibt dies im modernen Deutschen natürlich wieder; die Voranstellung im Hebräischen verleiht dem Besitz Nachdruck.
- source_word: זְרוֹעַ
  choice: Arm
  rationale: Die konkrete Körpermetapher wird bewahrt, statt sie durch das abstrakte „Kraft“ oder „Macht“ zu ersetzen.
- source_word: עִם גְּבוּרָה
  choice: voll Macht
  rationale: עִם bezeichnet hier Begleitung bzw. charakterisierende Ausstattung. „Voll Macht“ ist idiomatisches Deutsch und erhält die Aussage, dass der Arm durch Macht gekennzeichnet ist.
- source_word: תָּעֹז
  choice: stark ist
  rationale: Die Verbform bezeichnet das Starksein. Die vorangestellte Wiedergabe „stark ist“ erhält den poetischen Nachdruck und verbindet sich natürlich mit „deine Hand“.
- source_word: יָדְךָ
  choice: deine Hand
  rationale: Die wörtliche Wiedergabe bewahrt das anthropomorphe Bild für Gottes wirksame Kraft.
- source_word: תָּרוּם
  choice: hoch erhoben
  rationale: רום kann Hochsein, Erhobensein oder Erhöhtwerden ausdrücken. „Hoch erhoben“ bewahrt sowohl das räumliche Bild als auch die Vorstellung überragender Macht.
- source_word: יְמִינֶךָ
  choice: deine Rechte
  rationale: „Die Rechte“ ist eine natürliche, würdige deutsche Bezeichnung für die rechte Hand und erhält das biblische Bild von Kraft und Sieg.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Macht
  choice: Die Bilder „Arm“, „Hand“ und „Rechte“ bleiben im Haupttext erhalten.
  alternative: Die Bilder durch abstrakte Begriffe wie „Macht“ oder „Kraft“ ersetzen.
  rationale: Der hebräische Vers beschreibt Gottes Macht poetisch mit Körperbildern. Ihre Beibehaltung wahrt Bildkraft und Parallelismus, ohne eine körperliche Gestalt Gottes dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem poetischem Parallelismus. Die Ellipse im letzten Satzglied („hoch erhoben [ist]“) ist im Deutschen verständlich und bildet die verdichtete hebräische Poesie nach.
