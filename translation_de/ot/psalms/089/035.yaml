  text: אַ֭חַת נִשְׁבַּ֣עְתִּי בְ/קָדְשִׁ֑/י אִֽם לְ/דָוִ֥ד אֲכַזֵּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/035.yaml
  text: Once I have sworn by my holiness[b][a]; I will not lie to David.
translation:
  language: de
  text: 'Einmal habe ich bei meiner Heiligkeit geschworen[a]: David werde ich nicht belügen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein für alle Mal habe ich bei meiner Heiligkeit geschworen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Wenn ich David belüge …“ Dies ist eine verkürzte Schwurformel und bedeutet: „Ich werde David gewiss nicht belügen“ oder „Ich werde David nicht untreu werden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: Einmal
  rationale: Das Zahlwort wird im Zusammenhang mit dem Schwur adverbial gebraucht und bezeichnet einen einmaligen, entschiedenen Akt. „Einmal“ ist knapp und bewahrt die mögliche Nuance „ein für alle Mal“, ohne sie im Haupttext festzuschreiben.
- source_word: נִשְׁבַּעְתִּי
  choice: habe ich … geschworen
  rationale: Der Niphal von שׁבע bedeutet „schwören“. Das deutsche Perfekt bezeichnet hier einen vollzogenen Schwur, dessen Geltung im Zusammenhang fortbesteht.
- source_word: בְקָדְשִׁי
  choice: bei meiner Heiligkeit
  rationale: Die Präposition בְּ bezeichnet in der Schwurformel das, worauf der Schwörende sich beruft. „Bei meiner Heiligkeit“ gibt die göttliche Selbstbekräftigung idiomatisch und sachlich genau wieder.
- source_word: אִם
  choice: werde ich nicht
  rationale: 'Nach einer Schwurformel leitet אִם eine verkürzte Selbstverwünschungsformel ein: wörtlich „wenn ich …“, sinngemäß eine nachdrückliche Verneinung. Im Deutschen muss die implizite Verneinung gewöhnlich ausdrücklich wiedergegeben werden.'
- source_word: לְדָוִד
  choice: David
  rationale: לְ kennzeichnet hier die Person, der gegenüber die Unwahrheit oder Treulosigkeit begangen würde. Mit „belügen“ steht das persönliche Objekt im Deutschen ohne Präposition.
- source_word: אֲכַזֵּב
  choice: belügen
  rationale: Der Piel von כזב kann „lügen“, „täuschen“ oder „sich als falsch erweisen“ bedeuten. „David belügen“ ist im Deutschen direkt und persönlich und passt zur Zusage im Kontext, ohne zusätzliche Deutung einzutragen.
theological_decisions:
- issue: Wiedergabe der verkürzten göttlichen Schwurformel
  choice: David werde ich nicht belügen.
  alternative: Wenn ich David belüge …
  rationale: Das Hebräische formuliert mit אִם wörtlich einen unvollständigen Bedingungssatz, dessen drohende Selbstverwünschung unausgesprochen bleibt. Die ausdrückliche Verneinung gibt die konventionelle Bedeutung verständlich wieder; die Fußnote bewahrt die formale Spannung des Originals.
- issue: Gegenstand des göttlichen Schwurs
  choice: bei meiner Heiligkeit
  alternative: bei meinem Heiligtum
  rationale: קֹדֶשׁ mit dem Suffix der ersten Person bezeichnet hier am wahrscheinlichsten Gottes eigene Heiligkeit als Bürgschaft des Schwurs. „Mein Heiligtum“ ist grammatisch denkbar, passt jedoch weniger gut zur unmittelbaren Schwurformel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Voranstellung „David“ und der Konjunktiv „werde“ verleihen der eidlichen Verneinung angemessenen Nachdruck. Die Fußnoten dokumentieren sowohl die mögliche Nuance „ein für alle Mal“ als auch die im Hebräischen unausgesprochene Selbstverwünschung.
