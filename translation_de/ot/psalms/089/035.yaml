  terminology: „Heiligkeit“ ist für קָדְשִׁי die im Kontext wahrscheinlichste und theologisch nicht überdeutende Wiedergabe. „Belügen“ ist als direkte, personale Wiedergabe von אֲכַזֵּב vertretbar. Die Fußnote hält mit „nicht untreu werden“ eine kontextuell mögliche, aber nicht in den Haupttext eingetragene Bedeutungsnuance fest.
