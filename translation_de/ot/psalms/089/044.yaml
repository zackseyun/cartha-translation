source:
  edition: WLC
  text: הִשְׁבַּ֥תָּ מִ/טְּהָר֑/וֹ וְ֝/כִסְא֗/וֹ לָ/אָ֥רֶץ מִגַּֽרְתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/044.yaml
  text: You have brought his splendor to an end and cast his throne to the ground[a][b].
translation:
  language: de
  text: Du hast seinem Glanz ein Ende gemacht und seinen Thron zu Boden gestürzt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast seine Helligkeit/Reinheit aufhören lassen.“ Das hebräische Wort kann Helligkeit, Reinheit oder Glanz bezeichnen; im königlichen Zusammenhang passt „Glanz“ am besten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „zur Erde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּתָּ
  choice: Du hast … ein Ende gemacht
  rationale: Das Hifil von שׁבת bedeutet hier, etwas aufhören zu lassen bzw. zu beenden. Die Formulierung bewahrt den kausativen Sinn und klingt im Deutschen natürlich und würdig.
- source_word: מִטְּהָרוֹ
  choice: seinem Glanz
  rationale: טֹהַר kann Reinheit, Helligkeit oder Glanz bezeichnen. Im königlichen Zusammenhang passt „Glanz“ am besten zur verlorenen Majestät; die Präposition מִן wird in der deutschen Verbverbindung idiomatisch wiedergegeben.
- source_word: וְכִסְאוֹ
  choice: und seinen Thron
  rationale: כִּסֵּא bezeichnet eindeutig den Thron; die Konjunktion und das Suffix werden ausdrücklich wiedergegeben.
- source_word: לָאָרֶץ
  choice: zu Boden
  rationale: אֶרֶץ bedeutet Erde oder Land; in Verbindung mit dem Stürzen eines Thrones gibt „zu Boden“ die räumliche Bewegung und das Bild der Erniedrigung natürlich wieder.
- source_word: מִגַּרְתָּה
  choice: gestürzt
  rationale: Das Verb bezeichnet ein Niederwerfen bzw. Herabstürzen. „Gestürzt“ ist prägnant, poetisch und passt idiomatisch zu „Thron“ und „zu Boden“.
theological_decisions:
- issue: Bezug der Suffixe der dritten Person Singular
  choice: Mit „seinem/seinen“ wiedergegeben, ohne den königlichen Bezug näher zu bestimmen.
  alternative: Den Bezug ausdrücklich als davidischen König oder als Gesalbten des Bundes benennen.
  rationale: Der hebräische Vers verwendet lediglich Suffixe der dritten Person Singular und wiederholt den Bezugsträger nicht. Die pronominale Wiedergabe erhält die poetische Spannung und vermeidet eine nicht ausdrücklich genannte Festlegung.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit poetischer Knappheit. Die Parallelstruktur und die königliche Bildsprache bleiben erhalten; echte lexikalische Mehrdeutigkeit wird in den Fußnoten ausgewiesen.
