  yaml_path: translation/ot/psalms/075/007.yaml
  text: 'For God is the judge: he brings one down[b][a], and lifts up another.'
translation:
  language: de
  text: 'Denn Gott ist Richter[a]: Den einen erniedrigt er und den anderen erhöht er.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn Gott richtet.“ Das hebräische Partizip kann verbal oder als prädikative Rollenbezeichnung verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Diesen erniedrigt er, und diesen erhöht er.“ Die Wiederholung ist distributiv gemeint: „den einen … den anderen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage; „Denn“ gibt diese erklärende Funktion im Deutschen natürlich wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die singularische Aussage und der Zusammenhang verlangen die Bedeutung „Gott“.
- source_word: שֹׁפֵט
  choice: ist Richter
  rationale: Das Partizip kann hier prädikativ und rollenbezogen verstanden werden. „Ist Richter“ bewahrt diese nominale Nuance; die mögliche verbale Auffassung wird in der Fußnote genannt.
- source_word: זֶה … וְזֶה
  choice: den einen … den anderen
  rationale: Die wiederholten Demonstrativpronomen bilden eine distributive Gegenüberstellung. Die deutsche Wendung „den einen … den anderen“ gibt sie idiomatisch wieder.
- source_word: יַשְׁפִּיל
  choice: erniedrigt
  rationale: Der Hifil von שׁפל bezeichnet das Niedrigmachen oder Erniedrigen und bewahrt hier den kausativen Sinn sowie den Gegensatz zum Erhöhen.
- source_word: יָרִים
  choice: erhöht
  rationale: Der Hifil von רום bezeichnet das Hochheben oder Erhöhen. „Erhöht“ bewahrt die vertikale Metapher und bildet ein klares Gegenstück zu „erniedrigt“.
theological_decisions:
- issue: Gottes richterliche Rolle in אֱלֹהִים שֹׁפֵט
  choice: Gott ist Richter
  alternative: Gott richtet
  rationale: Das hebräische Partizip lässt eine rollenbezogene nominale und eine verbale Auffassung zu. Der Haupttext bewahrt die Betonung von Gottes richterlicher Stellung, ohne die verbale Lesart auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe poetische Gegenüberstellung und die echte Mehrdeutigkeit des Partizips bleiben erhalten; der Doppelpunkt bildet die erklärende Entfaltung des ersten Satzteils ab.
