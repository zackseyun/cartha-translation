source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ אַל תַּשְׁחֵ֑ת מִזְמ֖וֹר לְ/אָסָ֣ף שִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.”[a] A psalm of Asaph[b]. A song.'
translation:
  language: de
  text: 'Für den musikalischen Leiter: »Verdirb nicht!«[a] Ein Psalm Asafs, ein Lied.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise der Anfang eines bekannten Liedes, eine Melodieangabe oder eine musikalische Anweisung: »Verdirb nicht!«'
    reason: cultural_note
  - marker: b
    text: »Asafs« kann auf die Verfasserschaft, eine Zuordnung zu Asaf oder die Zugehörigkeit zur asafitischen Sammlung hinweisen.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: Die Bezeichnung meint in Psalmüberschriften wahrscheinlich die für die musikalische Aufführung verantwortliche Person. »Musikalischer Leiter« ist im heutigen Deutsch klar und lässt offen, ob konkret ein Chor geleitet wurde.
- source_word: אַל תַּשְׁחֵת
  choice: Nach »Verdirb nicht!«
  rationale: Die Wendung wird am besten als Liedanfang, Melodieangabe oder musikalische Anweisung verstanden. »Nach« macht ihre Funktion in der Überschrift deutlich, ohne genauer festzulegen, welche dieser Möglichkeiten zutrifft; »verdirb« gibt שׁחת knapp wieder.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: מִזְמוֹר ist die übliche Gattungsbezeichnung »Psalm« und bleibt vom anschließenden שִׁיר unterschieden.
- source_word: לְאָסָף
  choice: Asafs
  rationale: Der deutsche Genitiv bewahrt die traditionelle knappe Form, ohne eindeutig festzulegen, ob Asaf Verfasser, zugeordnete Person oder Namensgeber einer Sammlung ist.
- source_word: שִׁיר
  choice: Ein Lied
  rationale: Die eigenständige Wiedergabe erhält die doppelte Gattungsangabe des Hebräischen, statt מִזְמוֹר und שִׁיר zusammenzuziehen.
theological_decisions: []
translation_notes:
  register: Knappe, würdige Form einer Psalmüberschrift in modernem Standarddeutsch. Die Satzglieder bleiben getrennt, damit die musikalische Angabe und die beiden hebräischen Gattungsbezeichnungen deutlich erkennbar sind.
