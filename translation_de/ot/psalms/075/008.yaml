  text: כִּ֤י כ֪וֹס בְּֽ/יַד יְהוָ֡ה וְ/יַ֤יִן חָמַ֨ר מָ֥לֵא מֶסֶךְ֮ וַ/יַּגֵּ֪ר מִ֫/זֶּ֥ה אַךְ שְׁ֭מָרֶי/הָ יִמְצ֣וּ יִשְׁתּ֑וּ כֹּ֝֗ל רִשְׁעֵי אָֽרֶץ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/008.yaml
  text: For a cup is in the hand of Yahweh[a], and the wine foams, full of mixed spices; he pours from it[c][b], and surely all the wicked of the earth will drain its dregs and drink.
translation:
  language: de
  text: Denn ein Becher ist in der Hand Jahwes, und der Wein schäumt, reich gemischt; er schenkt daraus aus. Doch seinen Bodensatz werden alle Frevler der Erde ausschlürfen und trinken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Doch seinen Bodensatz werden alle Frevler der Erde ausschlürfen und trinken.“ Der Bodensatz sind die Weinrückstände am Grund des Bechers. „Reich gemischt“ gibt eine hebräische Wendung wieder, die zubereiteten beziehungsweise gemischten Wein bezeichnet; eine Würzung ist möglich, aber nicht ausdrücklich genannt.'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und entspricht dem argumentativen Zusammenhang.
- source_word: כּוֹס
  choice: Becher
  rationale: Bewahrt das konkrete biblische Bild; im Deutschen passt „Becher“ natürlich zu einem Trinkgefäß in Jahwes Hand.
- source_word: בְּיַד יְהוָה
  choice: in der Hand Jahwes
  rationale: Gibt die konkrete hebräische Wendung wieder und lässt das Bild göttlicher Verfügungsgewalt stehen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Eigennamen Gottes erkennbar und in einer im Deutschen etablierten Form wieder.
- source_word: חָמַר
  choice: schäumt
  rationale: Die Form bezeichnet wahrscheinlich das Schäumen beziehungsweise Gären des Weins; die mögliche Deutung „ist rot“ bleibt lexikalisch umstritten.
- source_word: מָלֵא מֶסֶךְ
  choice: voll von Würzwein
  rationale: מֶסֶךְ bezeichnet eine zubereitete Weinmischung, möglicherweise mit Gewürzen. Die knappe Formulierung wahrt das ungewöhnliche Bild.
- source_word: וַיַּגֵּר מִזֶּה
  choice: er schenkt daraus ein
  rationale: Gibt das Ausgießen aus dem Becher idiomatisch wieder, ohne ein vollständiges Ausschütten zu behaupten.
- source_word: אַךְ
  choice: Sogar
  rationale: 'Trägt hier zur Zuspitzung bei: Nicht nur der Wein, sondern selbst der Bodensatz wird den Frevlern zuteil.'
- source_word: שְׁמָרֶיהָ
  choice: den Bodensatz
  rationale: Bezeichnet die am Boden verbleibenden Weinrückstände und ist allgemein verständlicher als „Hefe“ oder „Weintrub“.
- source_word: יִמְצוּ
  choice: müssen … ausschlürfen
  rationale: Das Verb bezeichnet ein restloses Aussaugen beziehungsweise Ausschlürfen; „müssen“ bringt im Kontext die unausweichliche Folge zum Ausdruck.
- source_word: יִשְׁתּוּ
  choice: und trinken
  rationale: Bewahrt das zweite, koordinierte Verb des Hebräischen, auch wenn sich die Handlungen semantisch überschneiden.
- source_word: כֹּל רִשְׁעֵי אָרֶץ
  choice: alle Frevler der Erde
  rationale: „Frevler“ ist eine würdige, verständliche Bezeichnung für Menschen, die schuldig und gottwidrig handeln; „der Erde“ erhält den umfassenden Horizont.
theological_decisions:
- issue: Gottesname
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. Die Transliteration wahrt diesen unmittelbaren Namensgebrauch, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Becherbild
  choice: Das Bild des Bechers und Weins bleibt unaufgelöst stehen.
  alternative: „Becher des Zorns“ beziehungsweise eine ausdrückliche Erklärung als Strafgericht
  rationale: Der Zusammenhang legt göttliches Gericht nahe, doch der Vers nennt weder „Zorn“ noch „Strafe“. Die Übersetzung bewahrt daher die poetische Spannung.
- issue: Modalität bei den Frevlern
  choice: „müssen … ausschlürfen und trinken“
  alternative: „werden … ausschlürfen und trinken“
  rationale: Die hebräischen Imperfektformen können die zukünftige Handlung ausdrücken; im Gerichtskontext vermittelt „müssen“ zugleich deren Unausweichlichkeit, ohne den Bildgehalt zu erklären.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrtem poetischem Becherbild. „Würzwein“ ist bewusst leicht gehoben, aber verständlich; „Frevler“ hält den Psalmenstil, ohne altertümlich zu wirken. Der Fußnotenmarker [a] steht im Haupttext.
