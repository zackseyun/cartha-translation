  text: Do not lift up your horn on high[b][a]; do not speak with an arrogant neck.
translation:
  language: de
  text: Erhebt euer Horn nicht in die Höhe[a]; sprecht nicht mit hochmütigem Nacken[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Horn“ ist ein Bild für Kraft, Macht oder stolze Selbstüberhebung.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit anmaßendem Nacken“ beziehungsweise sinngemäß „halsstarrig“. Der hebräische Text bewahrt das körperliche Bild trotz seiner ungewöhnlichen Formulierung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תָּרִימוּ
  choice: Erhebt ... nicht
  rationale: Die Negationspartikel אַל mit der Verbform drückt ein Verbot aus. Die deutsche Imperativkonstruktion gibt dies natürlich und unmittelbar wieder.
- source_word: לַמָּרוֹם
  choice: zur Höhe
  rationale: מָרוֹם bezeichnet Höhe oder Erhebung. „Zur Höhe“ bewahrt die räumliche Bildsprache und vermeidet eine vorschnelle Deutung als bloße Selbstüberhebung.
- source_word: קַרְנְכֶם
  choice: euer Horn
  rationale: קֶרֶן bedeutet wörtlich „Horn“ und steht bildlich für Kraft, Macht oder stolze Selbstüberhebung. Das konkrete Bild bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
- source_word: תְּדַבְּרוּ
  choice: sprecht
  rationale: דבר ist das gewöhnliche Verb für „sprechen“; „sprecht“ entspricht dem gehobenen, aber verständlichen Psalmregister.
- source_word: בְצַוָּאר עָתָק
  choice: mit frechem Nacken
  rationale: Die Wendung verbindet „Nacken“ mit einem Ausdruck für Frechheit, Anmaßung oder Überheblichkeit. „Mit frechem Nacken“ erhält die auffällige körperliche Metapher und ihre Mehrdeutigkeit.
