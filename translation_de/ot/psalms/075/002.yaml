id: PSA.75.2
reference: Psalms 75:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֭י אֶקַּ֣ח מוֹעֵ֑ד אֲ֝נִ֗י מֵישָׁרִ֥ים אֶשְׁפֹּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/002.yaml
  text: For when I choose the appointed time[b][a], I myself will judge with uprightness.
translation:
  language: de
  text: Denn wenn ich den festgesetzten Zeitpunkt wähle[a], werde ich selbst gerecht richten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen festgesetzten Zeitpunkt nehme“; auch möglich: „den Zeitpunkt festsetze“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „nach Recht richte“ oder „mit Aufrichtigkeit richte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn wenn
  rationale: כִּי leitet hier die Begründung der vorausgehenden Aussage ein; zusammen mit dem folgenden Ausdruck ergibt sich zugleich ein zeitlicher Nebensatz. „Denn wenn“ bewahrt beide Funktionen.
- source_word: אֶקַּח מוֹעֵד
  choice: ich den festgesetzten Zeitpunkt wähle
  rationale: לקח bedeutet wörtlich „nehmen“, kann in Verbindung mit מוֹעֵד jedoch das Wählen oder Bestimmen eines festgelegten Zeitpunkts ausdrücken. Die gewählte Formulierung ist im Deutschen natürlich, ohne die im Hebräischen vorhandene Bildlichkeit völlig festzulegen.
- source_word: אֲנִי
  choice: ich selbst
  rationale: Das selbstständige Personalpronomen hebt den Sprecher hervor, obwohl die Verbform die erste Person bereits ausdrückt.
- source_word: מֵישָׁרִים
  choice: gerecht
  rationale: Der Plural bezeichnet Geradheit, Rechtschaffenheit oder Billigkeit, besonders im Zusammenhang mit einem Urteil. „Gerecht“ gibt die richterliche und moralische Bedeutung in natürlichem Deutsch wieder.
- source_word: אֶשְׁפֹּט
  choice: werde ... richten
  rationale: שׁפט bezeichnet hier richterliches Handeln. Die Zukunftsform passt zur Aussage über den festgesetzten Zeitpunkt.
theological_decisions:
- issue: Sprecher und Anspruch zu richten
  choice: Die Aussage bleibt eine betonte Ich-Rede des Sprechers, der den Zeitpunkt wählt und selbst richtet.
  alternative: Den Sprecher im Vers ausdrücklich als Gott zu bezeichnen.
  rationale: Der Psalmzusammenhang legt eine göttliche Rede nahe, doch der einzelne Vers nennt den Sprecher nicht ausdrücklich. Die Übersetzung bewahrt daher die Ich-Form, ohne die Identifikation in den Text einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Denn wenn“ erhält sowohl den begründenden Anschluss als auch den zeitlichen Sinn; „ich selbst“ bewahrt die hebräische Hervorhebung.
