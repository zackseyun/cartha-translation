  text: אָמַ֣רְתִּי לַֽ֭/הוֹלְלִים אַל תָּהֹ֑לּוּ וְ֝/לָ/רְשָׁעִ֗ים אַל תָּרִ֥ימוּ קָֽרֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/004.yaml
  text: I said to the boastful[a], “Do not boast,” and to the wicked, “Do not lift up your horn.”
translation:
  language: de
  text: 'Ich sagte zu den Prahlern: »Prahlt nicht!« und zu den Gottlosen: »Erhebt nicht das Horn![a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Erhebt nicht eure Macht« beziehungsweise »Überhebt euch nicht.« Das Horn ist im Hebräischen ein Bild für Stärke, Macht oder stolze Selbsterhöhung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Ich sagte
  rationale: Das Qal-Perfekt der 1. Person Singular wird als einfache Vergangenheit wiedergegeben und bewahrt den abgeschlossenen verbalen Aspekt im poetischen Zusammenhang.
- source_word: הוֹלְלִים
  choice: die Prahler
  rationale: Die Bezeichnung greift hier den Sinn des Prahlens auf und erhält die Wortverbindung mit dem folgenden תָּהֹלּוּ.
- source_word: אַל תָּהֹלּוּ
  choice: Prahlt nicht
  rationale: Die verneinte Jussivform der 2. Person Plural wird knapp und idiomatisch als untersagender Imperativ wiedergegeben.
- source_word: רְשָׁעִים
  choice: die Gottlosen
  rationale: Diese im deutschen Psalmenstil geläufige Wiedergabe bezeichnet Menschen, die sich schuldig und gegen Gottes Ordnung stellen, ohne den Ausdruck auf eine einzelne Tat einzuengen.
- source_word: אַל תָּרִימוּ
  choice: Erhebt nicht
  rationale: Die Hifil-Form von רום bedeutet hier, etwas emporzuheben beziehungsweise zur Schau zu stellen; „erheben“ passt zur bewahrten Horn-Metapher.
- source_word: קָרֶן
  choice: das Horn
  rationale: Der hebräische Text nennt keinen ausdrücklichen Possessivartikel. Die wörtliche Bildsprache bezeichnet Macht, Stärke oder stolze Selbsterhöhung und bleibt im Haupttext erhalten.
theological_decisions:
- issue: Metaphorische Bedeutung von „Horn“
  choice: Die Metapher wird im Haupttext als „das Horn“ bewahrt.
  alternative: „Erhebt nicht eure Macht“ oder „Überhebt euch nicht“
  rationale: Das Bild kann Macht, Stärke, Rang und stolze Selbsterhöhung umfassen. Eine eindeutige Auflösung würde die poetische und inhaltliche Spannweite des Hebräischen unnötig verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Die Wiederholung „Prahler/Prahlt“ bildet das hebräische Wortspiel ab; die ungewohnte, aber tragende Horn-Metapher wird durch eine Fußnote erschlossen.
