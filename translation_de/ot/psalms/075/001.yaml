source:
  edition: WLC
  text: ה֘וֹדִ֤ינוּ לְּ/ךָ֨ אֱֽלֹהִ֗ים ה֭וֹדִינוּ וְ/קָר֣וֹב שְׁמֶ֑/ךָ סִ֝פְּר֗וּ נִפְלְאוֹתֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/001.yaml
  text: We give thanks to you[a], O God; we give thanks, for your name is near[c][b]; your wondrous deeds are recounted.
translation:
  language: de
  text: Wir danken dir, Gott, wir danken dir, und dein Name ist nahe[a]; man erzählt von deinen Wundertaten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Dein Name ist nahe“ kann Gottes Nähe und wirksame Gegenwart, aber auch seinen offenbaren Namen beziehungsweise Ruf anklingen lassen. Die hebräische Wendung lässt diese Bedeutungen offen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sie erzählen deine Wundertaten.“ Das Hebräische nennt kein ausdrückliches Subjekt; auch „sie verkünden deine Wunder“ ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִינוּ
  choice: wir danken
  rationale: Der Hifil von ידה bezeichnet hier das an Gott gerichtete Danken beziehungsweise Lobpreisen. „Wir danken“ ist im heutigen Deutsch natürlich und bewahrt die Wiederholung des Hebräischen.
- source_word: לְּךָ אֱלֹהִים
  choice: dir, Gott
  rationale: Das pronominale Objekt „dir“ wird ausdrücklich wiedergegeben; „Gott“ steht als direkte Anrede. Auf das im modernen Deutsch gehobene, aber weniger alltägliche „o Gott“ wird verzichtet.
- source_word: וְקָרוֹב
  choice: und … ist nahe
  rationale: Das ו wird als „und“ wiedergegeben, statt die Beziehung zum Dank interpretierend mit „denn“ festzulegen. „Nahe“ erhält die knappe räumlich-theologische Bildsprache.
- source_word: שְׁמֶךָ
  choice: dein Name
  rationale: „Name“ wird nicht zu „Gegenwart“, „Ruf“ oder „Wesen“ aufgelöst; so bleibt die Bedeutungsfülle der hebräischen Rede von Gottes Namen erhalten.
- source_word: סִפְּרוּ
  choice: man erzählt
  rationale: Die dritte Person Plural hat kein ausdrücklich genanntes Subjekt und kann im Hebräischen unpersönlich verstanden werden. Das deutsche „man“ gibt diese Unbestimmtheit natürlicher wieder als ein beziehungsloses „sie“.
- source_word: נִפְלְאוֹתֶיךָ
  choice: von deinen Wundertaten
  rationale: Der Ausdruck bezeichnet staunenerregende Taten Gottes. „Wundertaten“ ist konkret, verständlich und im poetisch-biblischen Register geläufig.
theological_decisions:
- issue: Bedeutung von „dein Name ist nahe“
  choice: Die hebräische Wendung wird als „dein Name ist nahe“ bewahrt.
  alternative: „deine Gegenwart ist nahe“ oder „dein Ruhm ist nahe“
  rationale: Gottes „Name“ kann seine offenbarte Identität, seinen Ruf und seine wirksame Gegenwart bezeichnen. Der Ausgangstext legt sich nicht auf nur einen dieser Aspekte fest.
- issue: Logische Beziehung zwischen Dank und der Nähe des Namens
  choice: Die hebräische Konjunktion wird neutral mit „und“ wiedergegeben.
  alternative: „denn dein Name ist nahe“
  rationale: Ein begründender Zusammenhang ist möglich, wird durch die einfache hebräische Konjunktion jedoch nicht eindeutig markiert. „Und“ vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Die Wiederholung am Versanfang bleibt erhalten. Das Semikolon bündelt den wiederholten Dank; der Satzschluss folgt der masoretischen Hauptgliederung nach „dein Name“.
