source:
  edition: WLC
  text: וַ֭/אֲנִי אַגִּ֣יד לְ/עֹלָ֑ם אֲ֝זַמְּרָ֗ה לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/009.yaml
  text: But as for me[a], I will declare forever; I will sing praise to the God of Jacob.
translation:
  language: de
  text: Ich aber[a] will für immer verkünden; ich will dem Gott Jakobs lobsingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und ich will für immer verkünden.“ Die hebräische Konjunktion kann sowohl „und“ als auch, wenn sie einen Gegensatz ausdrückt, „aber“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Das selbstständige Pronomen betont den Sprecher; im Zusammenhang kann die Konjunktion einen Gegensatz ausdrücken. „Ich aber“ gibt beides knapp und natürlich wieder.
- source_word: אַגִּיד
  choice: will es verkünden
  rationale: Der Hifil von נגד bedeutet „kundtun, verkünden“. Das ergänzte „es“ entspricht natürlichem Deutsch; sein Bezug ergibt sich aus dem Kontext.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte beziehungsweise dauernde Zeit und passt zum Gelöbnis fortgesetzter Verkündigung.
- source_word: אֲזַמְּרָה
  choice: ich will … lobsingen
  rationale: זמר im Piel bezeichnet musikalisches Singen oder Spielen zum Lob. „Lobsingen“ bewahrt sowohl den musikalischen als auch den preisenden Sinn.
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: dem Gott Jakobs
  rationale: Die Präposition ל bezeichnet hier den Empfänger des Lobgesangs; der deutsche Dativ ist idiomatisch. „Gott Jakobs“ bewahrt die biblische Bundesbezeichnung.
theological_decisions:
- issue: Betonter Gegensatz des Sprechers zu den Gottlosen im Kontext
  choice: „Ich aber“ als kontrastive Eröffnung
  alternative: „Und ich“
  rationale: Die Verbindung von Konjunktion und ausdrücklich gesetztem Pronomen kann im unmittelbaren Zusammenhang den Sprecher von den zuvor beziehungsweise danach genannten Gottlosen abheben. Da ו auch schlicht „und“ heißen kann, bleibt die Alternative in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Lobsingen“ ist gehoben, aber im Psalmenstil weiterhin verständlich und präzise; die Satzgliederung wahrt den poetischen Parallelismus.
