id: PSA.75.3
reference: Psalms 75:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: נְֽמֹגִ֗ים אֶ֥רֶץ וְ/כָל יֹשְׁבֶ֑י/הָ אָנֹכִ֨י תִכַּ֖נְתִּי עַמּוּדֶ֣י/הָ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/003.yaml
  text: The earth and all who dwell in it melt away[a]; I myself have set its pillars firm[c][b]. Selah
translation:
  language: de
  text: Die Erde und alle, die auf ihr wohnen, zergehen[a]; ich selbst habe ihre Säulen fest gegründet[b]. Sela[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wanken“, „sich auflösen“ oder „ins Wanken geraten“. Das hebräische Wort zeichnet das Bild von Schmelzen, Auflösung oder Zusammenbruch.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „habe ihre Säulen aufgerichtet“ oder „festgemacht“.'
    reason: lexical_alternative
  - marker: c
    text: „Sela“ wird traditionell als solches wiedergegeben; seine genaue Bedeutung ist unsicher.
    reason: cultural_note
lexical_decisions:
- source_word: נְמֹגִים
  choice: zergehen
  rationale: Das Partizip von מוג bezeichnet ein Schmelzen, Sich-Auflösen oder Zusammenbrechen. „Zergehen“ bewahrt das eindrückliche poetische Bild und lässt zugleich die gemeinte Instabilität erkennen.
- source_word: אֶרֶץ
  choice: die Erde
  rationale: Zusammen mit allen, die auf ihr wohnen, und ihren Säulen liegt der kosmische Sinn „Erde“ näher als das örtlich begrenzte „Land“.
- source_word: יֹשְׁבֶיהָ
  choice: alle, die auf ihr wohnen
  rationale: Die Form bezeichnet die Bewohner der Erde; die verbale Wendung gibt den partizipialen Ausdruck natürlich und verständlich wieder.
- source_word: אָנֹכִי
  choice: ich selbst
  rationale: Das selbstständige Pronomen ist betont. „Ich selbst“ gibt diese Hervorhebung wieder, ohne ein ausschließliches „ich allein“ in den Text hineinzulesen.
- source_word: תִכַּנְתִּי
  choice: habe … fest gegründet
  rationale: Das Piel von כון kann „festmachen“, „aufrichten“ oder „gründen“ bedeuten. In Verbindung mit Säulen bringt „fest gegründet“ die stabilisierende Handlung klar zum Ausdruck.
- source_word: עַמּוּדֶיהָ
  choice: ihre Säulen
  rationale: Die wörtliche Wiedergabe erhält das konkrete kosmologische Bild des hebräischen Gedichts.
- source_word: סֶּלָה
  choice: Sela
  rationale: Da die genaue Bedeutung des Ausdrucks unsicher ist, wird er nach üblicher deutscher Schreibweise transkribiert und nicht deutend übersetzt.
theological_decisions:
- issue: Kosmologisches Bild von den Säulen der Erde
  choice: Das Bild wird wörtlich als „ihre Säulen“ beibehalten.
  alternative: ihre Fundamente; ihre Stützen
  rationale: Der Psalm gebraucht alte poetische Weltbildsprache, um Gottes stabilisierendes Handeln auszudrücken. Eine wissenschaftliche Umdeutung oder erklärende Paraphrase würde das Bild des Ausgangstextes abschwächen.
- issue: Gegenüberstellung von Auflösung und göttlicher Festigung
  choice: „zergehen“ und „fest gegründet“ werden als spannungsvolle Gegenüberstellung bewahrt.
  alternative: wanken und stabilisieren
  rationale: Die konkrete Bildsprache stellt die umfassende Instabilität der Schöpfungswelt dem festen Handeln des sprechenden Gottes gegenüber, ohne den Bildgehalt auf eine abstrakte Aussage zu reduzieren.
translation_notes:
  register: Moderne, gehobene Standardsprache mit klarer poetischer Bildführung. Der Parallelismus zwischen „zergehen“ und „fest gegründet“ bleibt deutlich; die emphatische Form „ich selbst“ und das alte kosmologische Säulenbild werden bewahrt.
