  text: וְ/כָל קַרְנֵ֣י רְשָׁעִ֣ים אֲגַדֵּ֑עַ תְּ֝רוֹמַ֗מְנָה קַֽרְנ֥וֹת צַדִּֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/010.yaml
  text: And I will cut off all the horns of the wicked[a], but the horns of the righteous will be lifted up.
translation:
  language: de
  text: Und alle Hörner der Frevler werde ich abschlagen[a]; doch die Hörner des Gerechten werden erhöht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Hörner“ sind hier ein Bild für Stärke, Macht oder erhöhtes Ansehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Und alle
  rationale: Das einfache וְ verbindet den Schlussvers mit dem vorausgehenden Zusammenhang; כָּל wird unmittelbar mit „alle“ wiedergegeben.
- source_word: קַרְנֵי / קַרְנוֹת
  choice: Hörner
  rationale: Die konkrete poetische Metapher für Stärke, Macht und erhöhtes Ansehen bleibt erhalten, statt sie auf einen abstrakten Einzelbegriff zu verengen.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: Das substantivierte Pluraladjektiv bezeichnet die Gottlosen bzw. moralisch Schuldigen als Gruppe; „Frevler“ ist prägnant und für poetische Sprache angemessen.
- source_word: אֲגַדֵּעַ
  choice: werde ich abhauen
  rationale: גדע bedeutet „abhauen, abschlagen“; „abhauen“ passt konkret zum Bild der Hörner und bezeichnet ihre entschiedene Beseitigung.
- source_word: תְּרוֹמַמְנָה
  choice: werden aufgerichtet
  rationale: Die Form von רום drückt hier das Erhöhen bzw. Emporrichten aus und stimmt im Femininum Plural mit „Hörner“ überein. „Aufgerichtet“ bewahrt Bild und resultativen Sinn.
- source_word: צַדִּיק
  choice: des Gerechten
  rationale: Der morphologische Singular wird bewahrt. Er kann den Gerechten exemplarisch oder als Gattungsbezeichnung meinen und steht poetisch den pluralischen Frevlern gegenüber.
theological_decisions:
- issue: Die Hörner als Bild für Macht und erhöhtes Ansehen
  choice: Die Metapher „Hörner“ bleibt im Haupttext stehen.
  alternative: „Alle Macht der Frevler werde ich beseitigen; doch die Stärke des Gerechten wird erhöht.“
  rationale: Das etablierte biblische Bild umfasst Stärke, Macht und Ehre. Eine abstrakte Wiedergabe würde seine poetische Weite verengen.
- issue: Singular צַדִּיק gegenüber dem Plural רְשָׁעִים
  choice: „des Gerechten“ im Singular
  alternative: „der Gerechten“ als kollektiv verstandener Plural
  rationale: Der hebräische Singular wird formal bewahrt, ohne seine mögliche generische Bedeutung festzulegen.
- issue: Sprecher des ersten Halbverses
  choice: Die erste Person „ich“ bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: Den Sprecher ausdrücklich als Gott oder den Psalmisten benennen
  rationale: Der Vers selbst nennt den Sprecher nicht erneut; eine Identifizierung im Text würde die im Kontext zu deutende Spannung vorschnell auflösen.
translation_notes:
  register: Moderne, würdige Psalmsprache. „Frevler“ ist dichterisch prägnant; „abhauen“ hält das konkrete Hornbild lebendig. Der Singular „des Gerechten“ folgt bewusst dem Hebräischen.
