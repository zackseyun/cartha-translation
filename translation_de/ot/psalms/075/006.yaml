base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/006.yaml
  text: For not from the east or from the west[c][b][a], and not from the wilderness comes lifting up.
translation:
  language: de
  text: Denn weder vom Osten noch vom Westen noch aus der Wüste kommt Erhöhung.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Aufstieg“ oder „Beförderung“. Der hebräische Satz ist verkürzt; der folgende Vers erläutert den Gedanken: Gott erniedrigt den einen und erhöht den anderen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die überlieferte Vokalisierung des letzten hebräischen Wortes bedeutet „Berge“. Dann ergäbe sich etwa: „und nicht aus der Wüste der Berge“. Der Zusammenhang mit dem folgenden Vers legt jedoch eine Deutung im Sinn von „Erhöhung“ nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und entspricht dem argumentativen Zusammenhang des Psalms.
- source_word: מִמּוֹצָא
  choice: vom Osten
  rationale: Das Wort bezeichnet wörtlich den Aufgang beziehungsweise den Ort des Sonnenaufgangs und damit den Osten.
- source_word: וּמִמַּעֲרָב
  choice: noch vom Westen
  rationale: מַעֲרָב bezeichnet die Gegend des Sonnenuntergangs, also den Westen. „Weder … noch“ gibt die verneinte Reihe im Deutschen idiomatisch wieder.
- source_word: מִמִּדְבַּר
  choice: aus der Wüste
  rationale: מִדְבָּר bezeichnet unbewohntes, trockenes Land; „Wüste“ ist hier eine natürliche und prägnante Wiedergabe.
- source_word: הָרִים
  choice: kommt Erhöhung
  rationale: Die Form wird im Zusammenhang mit רום, „hoch sein/erheben“, verstanden. Wegen des elliptischen Hebräisch wird im Deutschen „kommt“ ergänzt; „Erhöhung“ bewahrt die Verbindung zum Erheben im folgenden Vers.
theological_decisions:
- issue: Deutung des mehrdeutigen Schlussworts הָרִים
  choice: Die Erhöhung kommt aus keiner irdischen Himmelsrichtung.
  alternative: 'הָרִים als „Berge“ lesen: „nicht aus der Wüste der Berge“ beziehungsweise „nicht aus einer Bergwüste“.'
  rationale: Der folgende Vers nennt Gott als Richter, der den einen erniedrigt und den anderen erhöht. Daher passt die verbale Deutung „Erhöhung“ besonders gut; die echte sprachliche Mehrdeutigkeit bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die verneinte Reihe wird mit „weder … noch“ flüssig gestaltet; „auch nicht“ bildet die erneute hebräische Verneinung ab. Die ungewöhnliche Ellipse bleibt erkennbar, wird aber durch das ergänzte „kommt“ verständlich.
