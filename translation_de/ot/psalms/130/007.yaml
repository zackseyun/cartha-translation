  text: יַחֵ֥ל יִשְׂרָאֵ֗ל אֶל יְה֫וָה כִּֽי עִם יְהוָ֥ה הַ/חֶ֑סֶד וְ/הַרְבֵּ֖ה עִמּ֣/וֹ פְדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/007.yaml
  text: Israel[a], wait for Yahweh, for with Yahweh there is steadfast love, and with him is abundant redemption.
translation:
  language: de
  text: Israel, hoffe auf Jahwe, denn bei Jahwe ist beständige Liebe, und bei ihm ist Erlösung in Fülle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַחֵל
  choice: warte
  rationale: Das Verb יחל umfasst sowohl geduldiges Warten als auch vertrauensvolles Hoffen. »Warte auf« gibt die konkrete verbale Aussage natürlich wieder; die ebenfalls mögliche Wiedergabe »hoffe auf« bleibt in der Fußnote erhalten.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet hier das Gottesvolk als Kollektiv und wird in der üblichen deutschen Form wiedergegeben.
- source_word: אֶל יְהוָה
  choice: auf Jahwe
  rationale: Die Präposition אֶל bezeichnet eine Ausrichtung auf ein Ziel. In Verbindung mit »warten« ist »auf Jahwe« die natürliche deutsche Entsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung für die Aufforderung ein; »denn« ist im deutschen poetischen Zusammenhang klar und würdevoll.
- source_word: עִם יְהוָה
  choice: bei Jahwe ist
  rationale: »Bei Jahwe ist« bewahrt die hebräische Präpositionalstruktur und klingt zugleich natürlich auf Deutsch.
- source_word: הַחֶסֶד
  choice: beständige Liebe
  rationale: חֶסֶד verbindet Liebe, Güte, Loyalität und Verlässlichkeit. »Beständige Liebe« hält Zuneigung und treue Dauer zusammen, ohne den Begriff konfessionell einzuengen.
- source_word: וְהַרְבֵּה
  choice: in Fülle
  rationale: Die Wendung drückt große Menge oder Überfluss aus. »In Fülle« verbindet sich idiomatisch mit »Erlösung« und erhält den poetischen Nachdruck.
- source_word: עִמּוֹ
  choice: bei ihm ist
  rationale: 'Die Wiederholung von »bei« bewahrt den Parallelismus des Hebräischen: »bei Jahwe … bei ihm«.'
- source_word: פְדוּת
  choice: Erlösung
  rationale: פְדוּת bezeichnet Loskauf, Befreiung oder Erlösung. »Erlösung« wahrt hier die lexikalische und theologische Weite des Begriffs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. »Jahwe« macht ihn sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsspanne von יחל
  choice: warte auf Jahwe
  alternative: hoffe auf Jahwe
  rationale: Das hebräische Verb vereint erwartungsvolles Warten und Hoffen. Der Haupttext wählt das konkrete »warten«; die Fußnote bewahrt die echte Bedeutungsalternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelstruktur. Die Formulierung vermeidet altertümliches »harre« und bewahrt dennoch den feierlichen Ton des Psalms.
