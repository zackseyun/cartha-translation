  text: A Song of Ascents[a]. Out of the depths I have called to you[b], Yahweh.
translation:
  language: de
  text: 'Ein Wallfahrtslied.[a]


    Aus den Tiefen rief ich zu dir, HERR.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ein Lied der Aufstiege“; traditionelle Überschrift dieser Psalmengruppe, wahrscheinlich für Wallfahrten nach Jerusalem.'
    reason: cultural_note
  - marker: b
    text: 'Hebräisch: JHWH, der persönliche Name Gottes.'
    reason: name_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die Überschrift bezeichnet einen Psalm aus der Sammlung der Aufstiegslieder. „Wallfahrtslied“ gibt deren wahrscheinlichen Gebrauch bei Pilgerreisen nach Jerusalem natürlich und verständlich wieder, ohne die wörtliche Bedeutung zu verschweigen.
- source_word: מִמַּעֲמַקִּים
  choice: Aus den Tiefen
  rationale: Bewahrt das räumliche Bild und seine offenbleibende metaphorische Bedeutung von äußerster Not.
- source_word: קְרָאתִיךָ
  choice: rufe ich zu dir
  rationale: Das hebräische Perfekt kann hier als vollzogener Ruf oder im Gebetsvollzug verstanden werden. Das deutsche Präsens vermittelt die Unmittelbarkeit des Gebets; die Vergangenheitsform wird in der Fußnote genannt.
- source_word: יְהוָה
  choice: HERR
  rationale: Die deutsche Bibeltradition kennzeichnet den Gottesnamen durch Kapitälchen; in Klartext wird dies als „HERR“ dargestellt. Der Eigenname wird in der Fußnote ausdrücklich angegeben.
theological_decisions:
- issue: Deutung der „Tiefen“
  choice: Das Bild bleibt unbestimmt.
  alternative: Konkretisierung als Sünde, Todesnot oder persönliches Leid.
  rationale: Der hebräische Text nennt keine bestimmte Art der Not; diese theologische und poetische Offenheit soll erhalten bleiben.
- issue: Wiedergabe des Gottesnamens
  choice: HERR im Haupttext, mit Hinweis auf JHWH in der Fußnote.
  alternative: Jahwe im Haupttext.
  rationale: Dies wahrt einen würdigen, im Deutschen vertrauten Lesetext und macht zugleich transparent, dass im Hebräischen der persönliche Gottesname steht.
translation_notes:
  register: Modernes, schlichtes und zugleich würdevolles Standarddeutsch. Die poetische Kürze und das Bild der Tiefen bleiben erhalten; die Überschrift wird idiomatisch wiedergegeben.
