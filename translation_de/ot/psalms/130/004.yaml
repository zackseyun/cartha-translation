source:
  edition: WLC
  text: כִּֽי עִמְּ/ךָ֥ הַ/סְּלִיחָ֑ה לְ֝מַ֗עַן תִּוָּרֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/004.yaml
  text: But with you there is forgiveness[a], so that you may be feared.
translation:
  language: de
  text: Doch bei dir ist Vergebung, damit man dich fürchtet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit man dich verehrt“. Das hebräische Wort bedeutet „fürchten“, häufig im Sinn ehrfürchtiger Scheu vor Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Doch
  rationale: Die Partikel kann begründen oder bekräftigen, hat hier im Anschluss an die Aussichtslosigkeit unter strenger Anrechnung jedoch eine natürliche adversative Wirkung. „Doch“ stellt den Kontrast knapp und würdig heraus.
- source_word: עִמְּךָ
  choice: bei dir
  rationale: עִם mit Suffix bezeichnet hier, dass Vergebung bei Gott zu finden ist bzw. ihm zukommt. Das idiomatische deutsche „bei dir“ bewahrt dieses Bild besser als das unnatürlichere „mit dir“.
- source_word: הַסְּלִיחָה
  choice: Vergebung
  rationale: Das Substantiv bezeichnet Vergebung oder Verzeihung. „Vergebung“ ist im modernen Deutschen klar, geläufig und theologisch nicht unnötig eingeengt.
- source_word: לְמַעַן
  choice: damit
  rationale: Die Präposition leitet Zweck oder Folge ein. „Damit“ lässt die im Hebräischen vorhandene Spannung zwischen beabsichtigter Wirkung und tatsächlicher Folge bestehen.
- source_word: תִּוָּרֵא
  choice: man dich fürchtet
  rationale: Die Nifal-Form von ירא bedeutet hier „gefürchtet werden“. Die unpersönliche deutsche Form gibt die passive Aussage natürlich wieder und bewahrt das Schlüsselwort „fürchten“.
theological_decisions:
- issue: Die durch Gottes Vergebung hervorgerufene Reaktion
  choice: „damit man dich fürchtet“
  alternative: „damit man dich verehrt“ oder „damit man Ehrfurcht vor dir hat“
  rationale: Der hebräische Text verwendet ausdrücklich ירא, „fürchten“. Die Hauptübersetzung erhält diese Spannung, während die Fußnote verdeutlicht, dass ehrfürchtige Scheu gemeint sein kann und nicht bloß lähmender Schrecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ setzt den Kontrast zum vorherigen Vers; „bei dir ist Vergebung“ ist idiomatisch und bleibt nahe am hebräischen Ausdruck. Das direkte „fürchtet“ wird trotz möglicher moderner Missverständnisse im Haupttext bewahrt und in der Fußnote erläutert.
