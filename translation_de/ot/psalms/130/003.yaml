lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet einen Bedingungssatz ein. „Wenn“ gibt die hebräische Konstruktion schlicht und natürlich wieder, ohne sie stärker als irreal oder hypothetisch festzulegen.
- source_word: עֲוֺנוֹת
  choice: Verfehlungen
  rationale: Das Wort bezeichnet schuldhafte Taten beziehungsweise daraus erwachsende Schuld. Der Plural „Verfehlungen“ bewahrt hier die konkrete moralische Tragweite und klingt im modernen Deutsch natürlich.
- source_word: תִּשְׁמָר
  choice: festhältst
  rationale: שׁמר bedeutet grundsätzlich „bewahren, hüten, beobachten“. Im Zusammenhang geht es darum, Verfehlungen im Gedächtnis beziehungsweise in Rechnung zu behalten. „Festhalten“ wahrt etwas von der Grundbedeutung, während die Fußnote die gemeinte Abrechnungsnuance erläutert.
- source_word: יָהּ
  choice: Jah
  rationale: יָהּ ist die poetische Kurzform des Gottesnamens. Die Transliteration „Jah“ erhält die Unterscheidung zum unmittelbar folgenden Gottestitel אֲדֹנָי.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Hier steht der gebräuchliche göttliche Titel in direkter Anrede. „Herr“ ist dafür die natürliche deutsche Wiedergabe.
- source_word: מִי
  choice: wer
  rationale: Gibt das hebräische Fragepronomen unmittelbar wieder und leitet die rhetorische Frage ein.
- source_word: יַעֲמֹד
  choice: kann bestehen
  rationale: עמד bedeutet „stehen“ und hier sinngemäß, vor Gottes Gericht standhalten beziehungsweise bestehen zu können. Das Präsens mit Modalverb gibt die allgemeine rhetorische Aussage natürlich wieder.
theological_decisions:
- issue: Wiedergabe der beiden Gottesbezeichnungen יָהּ und אֲדֹנָי
  choice: יָהּ als „Jah“ und אֲדֹנָי als „Herr“
  alternative: Beide Bezeichnungen mit „Herr“ wiedergeben oder יָהּ als „der HERR“ übersetzen
  rationale: Der hebräische Vers verwendet bewusst zwei verschiedene Anreden. Ihre Unterscheidung bleibt so sichtbar, ohne die poetische Kurzform יָהּ mit dem vollen Tetragramm gleichzusetzen.
- issue: Bedeutung der göttlichen Aufmerksamkeit bei תִּשְׁמָר
  choice: „Verfehlungen festhalten“ im Sinn von im Gedächtnis oder in Rechnung behalten
  alternative: „Verfehlungen anrechnen“ oder „über Verfehlungen Buch führen“
  rationale: Der Zusammenhang betrifft nicht bloß Gottes Wahrnehmung, sondern die Frage, ob jemand bestehen könnte, wenn Gott Schuld festhielte. Die Übersetzung bewahrt das Bild des hebräischen Verbs; die Fußnote macht die gerichtliche beziehungsweise abrechnende Nuance deutlich, ohne sie als einzig mögliche Bildsprache in den Haupttext einzutragen.
- issue: Modalität der rhetorischen Frage
  choice: „wer kann bestehen?“
  alternative: „wer könnte bestehen?“
  rationale: Der hebräische Imperfekt lässt sich modal verstehen, legt aber keine deutsche Konjunktivform zwingend fest. „Wer kann bestehen?“ erhält die unmittelbare, allgemeingültige Wucht der rhetorischen Frage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Die Anreden „Jah“ und „Herr“ bleiben wie im Hebräischen unterschieden; „bestehen“ bewahrt die gerichtliche und existentielle Offenheit des Schlussverbs.
