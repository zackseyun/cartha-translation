  text: Wenn du, Jah, Sünden festhältst[a], Herr, wer könnte bestehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sünden anrechnest“ beziehungsweise „über Sünden Buch führst“. Das hebräische Verb bedeutet wörtlich „bewahren, hüten, beobachten“ und meint hier, Schuld festzuhalten und in Rechnung zu stellen.'
