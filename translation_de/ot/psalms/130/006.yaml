id: PSA.130.6
reference: Psalms 130:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: נַפְשִׁ֥/י לַֽ/אדֹנָ֑/י מִ/שֹּׁמְרִ֥ים לַ֝/בֹּ֗קֶר שֹׁמְרִ֥ים לַ/בֹּֽקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/006.yaml
  text: My soul waits for the Lord more than watchmen for the morning[a], more than watchmen for the morning.
translation:
  language: de
  text: Meine Seele wartet auf den Herrn, mehr als Wächter auf den Morgen,[a] mehr als Wächter auf den Morgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meine Seele ist auf den Herrn ausgerichtet, mehr als Wächter auf den Morgen.“ Im Hebräischen steht hier kein ausdrückliches Verb; „wartet“ ist aus dem Zusammenhang des Psalms ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: Meine Seele
  rationale: Die wörtliche Wiedergabe bewahrt die poetische Sprache und bezeichnet hier das ganze sehnsüchtig auf Gott ausgerichtete Selbst.
- source_word: לַאדֹנָי
  choice: auf den Herrn
  rationale: Die Präposition ל bezeichnet hier beim aus dem Zusammenhang ergänzten Warten dessen Ziel. „Auf den Herrn warten“ ist im Deutschen idiomatisch; אֲדֹנָי ist hier die ehrfürchtige Gottesbezeichnung „der Herr“.
- source_word: מִשֹּׁמְרִים
  choice: mehr als Wächter
  rationale: מִן drückt den Vergleich aus, während das substantivierte Partizip שֹׁמְרִים Menschen bezeichnet, die Wache halten. „Wächter“ bewahrt das nächtliche Bild knapp und natürlich.
- source_word: לַבֹּקֶר
  choice: auf den Morgen
  rationale: בֹּקֶר bedeutet „Morgen“. Mit „auf“ entsteht im Deutschen die natürliche Verbindung „auf den Morgen warten“, und die Wiederholung des Hebräischen bleibt erhalten.
- source_word: שֹׁמְרִים לַבֹּקֶר
  choice: Wächter auf den Morgen
  rationale: Die zweite, elliptische Wendung wird nicht geglättet, sondern wie im Hebräischen wiederholt, um die nachdrückliche Sehnsucht zu bewahren.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי als Gottesbezeichnung
  choice: der Herr
  alternative: mein Herr
  rationale: Der Bezug auf Gott ist eindeutig. „Der Herr“ ist im modernen deutschen Bibelstil eine klare und ehrfürchtige Wiedergabe der Gottesbezeichnung, ohne eine zusätzliche besitzanzeigende Nuance in den Vordergrund zu stellen.
- issue: Im Hebräischen fehlendes ausdrückliches Verb
  choice: wartet
  alternative: ist auf den Herrn ausgerichtet
  rationale: Der unmittelbare Psalmkontext, besonders Vers 5, legt „warten/hoffen“ nahe. Da der hebräische Satz das Verb jedoch auslässt, wird diese Ergänzung durch eine Fußnote offengelegt und die formale Mehrdeutigkeit nicht verschwiegen.
translation_notes:
  register: Moderne, würdevolle Psalmsprache. Die wörtliche Metapher „Meine Seele“ und die emphatische Wiederholung bleiben erhalten. Das ergänzte Verb schafft einen natürlichen deutschen Satz, während die Fußnote die Ellipse und ihre echte Deutungsoffenheit sichtbar macht.
