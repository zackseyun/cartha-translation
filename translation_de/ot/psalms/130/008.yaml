  text: וְ֭/הוּא יִפְדֶּ֣ה אֶת יִשְׂרָאֵ֑ל מִ֝/כֹּ֗ל עֲוֺנֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/008.yaml
  text: And he will redeem Israel from all his iniquities[a].
translation:
  language: de
  text: Und er wird Israel von all seinen Sünden erlösen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, auf die Angehörigen Israels bezogen: „von all ihren Sünden“. Im Hebräischen steht bei dem kollektiv verstandenen Namen „Israel“ ein Pronomen im Singular („seinen“).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Und er
  rationale: Die Konjunktion und das selbstständige Pronomen führen den Gedanken fort und setzen eine leichte Betonung, ohne dass das stärkere „er selbst“ nötig ist.
- source_word: יִפְדֶּה
  choice: wird … erlösen
  rationale: פדה bezeichnet das Befreien oder Loskaufen aus Bindung beziehungsweise Schuld. „Erlösen“ ist hier natürlich, würdig und trägt dem theologischen Gewicht des Psalmwortes Rechnung.
- source_word: אֶת
  choice: '[Akkusativzeichen, unübersetzt]'
  rationale: Die Partikel kennzeichnet „Israel“ als bestimmtes direktes Objekt und erhält im Deutschen kein eigenes Wort.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet hier das Bundesvolk als kollektive Einheit.
- source_word: מִכֹּל
  choice: von all
  rationale: Die Verbindung מן mit כֹּל bezeichnet eine umfassende Befreiung von der Gesamtheit dessen, was folgt.
- source_word: עֲוֺנֹתָיו
  choice: seinen Verfehlungen
  rationale: עָוֹן kann schuldhafte Verfehlung, Schuld oder Verkehrtheit bezeichnen. „Verfehlungen“ bewahrt den moralischen Gehalt, ohne den Ausdruck unnötig auf bloße Schuldfolge oder allgemein auf „Sünden“ festzulegen. Das Suffix ist grammatisch 3. Person Maskulinum Singular und bezieht sich auf das kollektiv verstandene Israel.
theological_decisions:
- issue: Kollektiver Singular beim Suffix von עֲוֺנֹתָיו
  choice: „seinen Verfehlungen“; das Singularpronomen bezieht sich auf Israel als kollektive Einheit.
  alternative: „ihren Verfehlungen“; Israel wird dabei idiomatisch als Mehrzahl seiner Angehörigen aufgefasst.
  rationale: Der hebräische Text verbindet den singularischen Namen „Israel“ mit einem singularischen Suffix. Die Hauptübersetzung erhält diese korporative Darstellung; die im Deutschen ebenfalls mögliche pluralische Auffassung wird in der Fußnote genannt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Psalmton. „Erlösen“ wahrt den traditionellen und theologischen Gehalt von פדה; „Verfehlungen“ gibt die schuldhafte Dimension von עָוֹן verständlich wieder. Die Wortstellung „Und er wird Israel … erlösen“ setzt auf natürliche Weise eine leichte Betonung auf „er“.
