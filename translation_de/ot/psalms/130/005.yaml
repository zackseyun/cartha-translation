base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/005.yaml
  text: I wait for Yahweh[a]; my soul waits[b], and in his word I hope.
translation:
  language: de
  text: Ich warte auf Jahwe[a]; meine Seele wartet, und auf sein Wort hoffe ich[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich habe auf Jahwe gewartet; meine Seele hat gewartet.“ Die hebräischen Perfektformen können hier sowohl eine bereits eingenommene entschlossene Haltung als auch ein gegenwärtig fortdauerndes Warten ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: „Sein Wort“ kann hier dem Sinn nach auch „seine Zusage“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִוִּיתִי
  choice: Ich warte
  rationale: Das Verb קוה bezeichnet erwartungsvolles Warten. Das Präsens gibt die im Kontext fortdauernde Haltung natürlich wieder; die hebräische Perfektform kann jedoch auch rückblickend oder als gefasster Entschluss verstanden werden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: קִוְּתָה
  choice: wartet
  rationale: Die Wiederholung desselben Verbstamms קוה bleibt erhalten und bewahrt so den Parallelismus des hebräischen Verses.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נפש kann die Person selbst oder ihr inneres Leben bezeichnen. „Meine Seele“ erhält die poetische Ausdrucksweise und ist im Deutschen verständlich.
- source_word: לִדְבָרוֹ
  choice: auf sein Wort
  rationale: דבר kann Wort, Rede oder dem Sinn nach Zusage bedeuten. Bei „hoffen“ ist „auf sein Wort“ idiomatisches Deutsch und bleibt näher am Wortlaut als die auslegende Wiedergabe „auf seine Zusage“.
- source_word: הוֹחָלְתִּי
  choice: hoffe ich
  rationale: יחל umfasst hoffendes, erwartungsvolles Warten. „hoffe ich“ unterscheidet das Verb von dem zuvor zweimal verwendeten קוה, ohne die semantische Nähe aufzugeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Gottesnamen. „Jahwe“ bewahrt ihn als persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von דְבָרוֹ
  choice: sein Wort
  alternative: seine Zusage
  rationale: „Sein Wort“ wahrt die allgemeinere Bedeutung und lässt offen, ob speziell eine göttliche Verheißung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Wiederholung. Die Satzstellung im letzten Glied folgt natürlichem deutschem Sprachgebrauch; die beiden Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Formulierung.
