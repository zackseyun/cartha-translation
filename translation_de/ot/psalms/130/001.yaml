base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/001.yaml
  text: A Song of Ascents[a]. Out of the depths I cry to you[b], O Yahweh.
translation:
  language: de
  text: Ein Lied der Aufstiege[a]. Aus den Tiefen rufe ich zu dir[b], Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Wallfahrtslied“. Die genaue Bedeutung von „Aufstiege“ in dieser Überschrift ist nicht sicher.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „habe ich zu dir gerufen“. Die hebräische Verbform kann als Vergangenheit verstanden werden; das Präsens bewahrt die Unmittelbarkeit des Gebets.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Lied
  rationale: Das Substantiv bezeichnet ein Lied; die Wiedergabe vermeidet die speziellere Gattungsbezeichnung „Psalm“, die hier nicht ausdrücklich steht.
- source_word: הַמַּעֲלוֹת
  choice: Wallfahrtslied
  rationale: Die traditionelle und verständliche deutsche Bezeichnung gibt den Sammlungstitel idiomatisch wieder. Die wörtliche Vorstellung von „Aufstiegen“ sowie die Unsicherheit über den historischen Bezug werden in der Fußnote bewahrt.
- source_word: מִמַּעֲמַקִּים
  choice: Aus den Tiefen
  rationale: Der Plural bezeichnet „Tiefen“ oder „tiefe Orte“ und zeichnet hier bildhaft äußerste Bedrängnis; die deutsche Formulierung erhält dieses Bild.
- source_word: קְרָאתִיךָ
  choice: rufe ich zu dir
  rationale: קרא bedeutet im Kern „rufen“. Das Präsens lässt das Gebet unmittelbar erklingen; die Vergangenheitsbedeutung der hebräischen Verbform bleibt als Alternative in der Fußnote erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „HERR“ ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als persönliche Anrede, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitbezug von קְרָאתִיךָ
  choice: rufe ich zu dir
  alternative: habe ich zu dir gerufen
  rationale: Die hebräische Qatal-Form kann vergangen wiedergegeben werden; im vollzogenen Gebetsruf ist jedoch auch ein deutsches Präsens möglich. Die Alternative wird ausdrücklich offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wallfahrtslied“ ist als Überschrift geläufig und gut verständlich; die Fußnote bewahrt die wörtlichere, historisch nicht eindeutig festgelegte Form. Die direkte Anrede „Jahwe“ kommt im Deutschen ohne ein zusätzliches „o“ natürlich zur Geltung.
