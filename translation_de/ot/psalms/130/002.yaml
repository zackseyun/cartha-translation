  text: אֲדֹנָ/י֮ שִׁמְעָ֪/ה בְ/ק֫וֹלִ֥/י תִּהְיֶ֣ינָה אָ֭זְנֶי/ךָ קַשֻּׁב֑וֹת לְ֝/ק֗וֹל תַּחֲנוּנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/002.yaml
  text: Lord[a], hear my voice; let your ears be attentive to the voice of my pleas for mercy.
translation:
  language: de
  text: Herr, höre meine Stimme! Lass deine Ohren aufmerksam sein auf die Stimme meines Flehens um Gnade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: meines inständigen Bittens. Das hebräische Wort bezeichnet eindringliche Bitten um Gunst oder Erbarmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Die Anrede bezeichnet Gott als Herrn, ohne hier den Gottesnamen JHWH zu verwenden. „Herr“ ist die direkte, geläufige und würdevolle deutsche Entsprechung.
- source_word: שִׁמְעָה בְקוֹלִי
  choice: höre meine Stimme
  rationale: Die konkrete Wendung des Hebräischen bleibt erhalten und klingt zugleich in deutscher Gebetssprache natürlich.
- source_word: תִּהְיֶינָה
  choice: lass … sein
  rationale: Die Verbform hat hier bittenden Charakter. „Lass … sein“ gibt diesen Gebetswunsch unmittelbar wieder.
- source_word: אָזְנֶיךָ קַשֻּׁבוֹת
  choice: lass deine Ohren aufmerksam sein
  rationale: Die körperhafte Bildsprache des Hebräischen wird bewahrt, statt sie zu „höre aufmerksam zu“ zu verflachen.
- source_word: לְקוֹל
  choice: auf die Stimme
  rationale: Die Wiederholung von „Stimme“ spiegelt die Parallelführung des hebräischen Verses.
- source_word: תַּחֲנוּנָי
  choice: meines Flehens um Gnade
  rationale: Das Wort bezeichnet eindringliche Bitten um Gunst oder Erbarmen. „Flehen um Gnade“ vermittelt sowohl die Dringlichkeit als auch die Bitte um unverdiente Zuwendung.
theological_decisions:
- issue: Körperhafte Rede von Gottes Hören
  choice: Die konkrete Formulierung „deine Ohren aufmerksam“ bleibt stehen.
  alternative: „Höre mir aufmerksam zu.“
  rationale: Der hebräische Text spricht ausdrücklich von Gottes Ohren. Diese poetische und relationale Bildsprache soll nicht abstrahiert werden.
- issue: Bedeutungsumfang von תַּחֲנוּנָי
  choice: „mein Flehen um Gnade“
  alternative: „meine Bitten“ oder „mein Flehen“
  rationale: Die Übersetzung macht den Aspekt des Erbarmens beziehungsweise der erbetenen Gunst sichtbar, ohne eine weitergehende dogmatische Deutung einzutragen.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Der Parallelismus und die konkrete Bildsprache des Hebräischen bleiben erhalten; „Flehen um Gnade“ ist allgemein verständlich und zugleich feierlich.
