base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/001.yaml
  text: A Song of Ascents[a]. Of David. Behold[c][b], how good and how pleasant it is when brothers dwell together!
translation:
  language: de
  text: 'Ein Wallfahrtslied.[a] Von David.[b]


    Seht, wie gut und wie angenehm es ist, wenn Brüder miteinander wohnen![c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ein Lied der Aufstiege“. Gemeint sein können die Aufstiege nach Jerusalem beziehungsweise zum Heiligtum; daher die traditionelle Wiedergabe „Wallfahrtslied“.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Form kann „von David“, „für David“ oder „David zugeordnet“ bedeuten.
    reason: source_ambiguity
  - marker: c
    text: „Brüder“ kann leibliche Brüder, Verwandte oder weiter gefasst die Angehörigen der Gemeinschaft bezeichnen.
    reason: lexical_alternative
  - marker: d
    text: Das Hebräische betont das Miteinander; im Zusammenhang kann damit auch einträchtiges Zusammenleben gemeint sein.
    reason: source_ambiguity
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die traditionelle Psalmenüberschrift bezeichnet die Sammlung Psalm 120–134. „Wallfahrtslied“ ist im Deutschen natürlich und verständlich, deutet den nicht völlig eindeutigen Ausdruck jedoch als Lied für den Aufstieg zum Heiligtum; die wörtlichere Form steht deshalb in der Fußnote.
- source_word: לְדָוִד
  choice: Von David
  rationale: Die geläufige deutsche Überschrift wahrt den knappen Charakter des Hebräischen. Da לְ sowohl Urheberschaft als auch Zuordnung oder Widmung anzeigen kann, wird die Mehrdeutigkeit in einer Fußnote ausdrücklich offengehalten.
- source_word: הִנֵּה
  choice: Seht
  rationale: Der Aufmerksamkeitsruf leitet eine staunende Feststellung ein. „Seht“ ist gegenwärtiges, würdiges Deutsch und bewahrt den auffordernden Charakter besser als ein bloßes Ausrufezeichen.
- source_word: מַה טּוֹב וּמַה נָּעִים
  choice: wie gut und wie wohltuend
  rationale: Das zweimalige מַה bildet einen parallelen Ausruf. „Wohltuend“ gibt נָעִים als angenehm und erfreulich wieder, ohne den Ausdruck auf bloß ästhetische Schönheit zu verengen.
- source_word: שֶׁבֶת אַחִים
  choice: wenn Brüder … wohnen
  rationale: Der Infinitiv שֶׁבֶת bezeichnet den Zustand des Wohnens oder Beisammenseins. Eine deutsche Wenn-Konstruktion gibt diesen verbalen Sinn natürlich wieder; „Brüder“ erhält die grammatisch männliche und zugleich potenziell gemeinschaftliche Bezeichnung.
- source_word: גַּם יָחַד
  choice: miteinander
  rationale: „Miteinander“ gibt das gemeinsame Wohnen idiomatisch und knapp wieder. גַּם verstärkt hier wahrscheinlich יָחַד; die mögliche Betonung von Eintracht wird nicht als zusätzliche Bedeutung in den Haupttext eingeführt, sondern in der Fußnote erläutert.
theological_decisions:
- issue: Reichweite von אַחִים („Brüder“)
  choice: „Brüder“ im Haupttext, mit Hinweis auf die mögliche weitere Gemeinschaftsbedeutung
  alternative: „Geschwister“, „Verwandte“ oder „Angehörige des Gottesvolkes“
  rationale: אַחִים kann leibliche Brüder, Verwandte oder gemeinschaftlich verbundene Angehörige Israels bezeichnen. „Brüder“ bewahrt die konkrete Form des Ausgangstextes; die weitere mögliche Reichweite wird nicht ausgeschlossen, sondern in der Fußnote genannt.
- issue: Bedeutung von גַּם יָחַד
  choice: „miteinander“ mit erläuternder Fußnote zur Verstärkung
  alternative: „einträchtig beieinander“ oder „in Einheit“
  rationale: Der Ausdruck betont das gemeinsame Beisammensein, kann im Kontext aber auch harmonisches Zusammenleben nahelegen. Der Haupttext bleibt nah an יָחַד und macht aus dieser Nuance keine ausdrücklich theologische Aussage über „Einheit“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelität. „Seht“ erhält den feierlichen Aufmerksamkeitsruf, ohne das heute altertümlich wirkende „Siehe“ zu verwenden. Die Überschrift bleibt knapp; echte Mehrdeutigkeiten der hebräischen Präposition und des gemeinschaftlichen Ausdrucks werden in den Fußnoten offengehalten.
