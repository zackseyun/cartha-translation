base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/000.yaml
  text: A Song of Ascents[a]. Of David. Behold[c][b], how good and how pleasant it is for brothers to dwell together.
translation:
  language: de
  text: 'Ein Wallfahrtslied[a]. Von David.


    Seht, wie gut und wie angenehm es ist, wenn Brüder[b] zusammen wohnen![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ein Lied der Aufstiege« oder »Ein Stufenlied«. Die Überschrift wird häufig mit dem Aufstieg zu den Wallfahrtsfesten in Jerusalem verbunden.'
    reason: lexical_alternative
  - marker: b
    text: »Brüder« kann leibliche Brüder, Verwandte oder allgemeiner Angehörige einer Gemeinschaft bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »zu wohnen [als] Brüder, auch/zugleich zusammen«. Das Hebräische betont ihr gemeinsames Beieinanderwohnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Wallfahrtslied
  rationale: Wörtlich etwa »Lied der Aufstiege«. Als Überschrift der Psalmen 120–134 bezeichnet die Wendung wahrscheinlich Lieder für den Aufstieg nach Jerusalem; »Wallfahrtslied« ist im Deutschen verständlich, während die wörtlichere Alternative in der Fußnote erhalten bleibt.
- source_word: הִנֵּה
  choice: Seht
  rationale: Gibt den aufmerksamkeitslenkenden Ausruf natürlich und würdevoll wieder.
- source_word: נָעִים
  choice: schön
  rationale: Das Wort bezeichnet etwas Angenehmes, Liebliches oder Wohltuendes. »Schön« passt in diesem poetischen Ausruf gut zum parallelen »gut«.
- source_word: אַחִים
  choice: Brüder
  rationale: Bewahrt die konkrete Bedeutung und lässt zugleich den im Psalm möglichen weiteren Bezug auf Verwandte oder Angehörige der Gemeinschaft offen.
- source_word: גַּם יָחַד
  choice: einträchtig beieinander
  rationale: יָחַד bedeutet »zusammen/beieinander«; גַּם verstärkt hier den Gedanken. »Einträchtig beieinander« bringt die betonte, harmonische Gemeinsamkeit idiomatisch zum Ausdruck, ohne sie auf bloße räumliche Nähe zu reduzieren.
theological_decisions:
- issue: Bezugsumfang von »Brüder«
  choice: Die konkrete Bezeichnung »Brüder« bleibt im Text stehen; der mögliche weitere gemeinschaftliche Sinn wird angemerkt.
  alternative: Verwandte; Angehörige des Gottesvolkes
  rationale: Der hebräische Ausdruck kann leibliche Brüder bezeichnen, im Zusammenhang aber auch weiter auf verwandtschaftlich oder gemeinschaftlich Verbundene bezogen sein. Der Text soll diese Offenheit nicht vorschnell festlegen.
- issue: Art des gemeinsamen Wohnens
  choice: »einträchtig beieinander wohnen«
  alternative: zusammen wohnen
  rationale: Die Verbindung גַּם יָחַד betont mehr als bloße räumliche Nähe und lässt harmonisches Zusammenleben anklingen; die Fußnote nennt die wörtlichere Möglichkeit.
translation_notes:
  register: Moderne, würdige Psalmsprache mit knapper Überschrift und poetischem Ausruf. »Seht« ist gegenwärtig und verständlich; »einträchtig beieinander« vermeidet sowohl eine flache rein räumliche Lesart als auch konfessionell geprägte Zusatzdeutungen.
