source:
  edition: WLC
  text: כַּ/שֶּׁ֤מֶן הַ/טּ֨וֹב עַל הָ/רֹ֗אשׁ יֹרֵ֗ד עַֽל הַ/זָּקָ֥ן זְקַֽן אַהֲרֹ֑ן שֶׁ֝/יֹּרֵ֗ד עַל פִּ֥י מִדּוֹתָֽי/ו׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/002.yaml
  text: It is like the good oil on the head[a], running down on the beard, on Aaron’s beard[b], which runs down on the collar of his robes.
translation:
  language: de
  text: Wie das gute Öl auf dem Kopf, das auf den Bart hinabfließt, auf Aarons Bart, das auf den Halsausschnitt seiner Gewänder hinabfließt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf den Mund seiner Gewänder«; gemeint sein kann auch die Öffnung oder der Rand seiner Gewänder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּשֶּׁמֶן הַטּוֹב
  choice: wie das gute Öl
  rationale: כְּ kennzeichnet den Vergleich; טוֹב wird grundlegend und idiomatisch mit »gut« wiedergegeben, ohne die mögliche Qualitätsnuance zu übersteigern.
- source_word: יֹרֵד / שֶׁיֹּרֵד
  choice: das hinabfließt / das hinabfließt
  rationale: Das Partizip von ירד bezeichnet die abwärtsgerichtete Bewegung. Bei Öl ist »hinabfließen« natürlich; die Wiederholung bewahrt die poetische Struktur.
- source_word: עַל הָרֹאשׁ
  choice: auf dem Kopf
  rationale: Direkte anatomische Wiedergabe mit der im Deutschen nach »auf« hier natürlichen Ortsangabe.
- source_word: עַל הַזָּקָן זְקַן אַהֲרֹן
  choice: auf den Bart, auf Aarons Bart
  rationale: Die Wiederholung von זָקָן wird erhalten; die hebräische Konstruktverbindung wird natürlich als »Aarons Bart« wiedergegeben.
- source_word: עַל פִּי מִדּוֹתָיו
  choice: bis zum Halsausschnitt seiner Gewänder
  rationale: פֶּה bedeutet wörtlich »Mund«, kann bei Kleidung aber deren Öffnung oder Rand bezeichnen. Im Bild ist der obere Ausschnitt der Gewänder wahrscheinlich; »bis zu« drückt das erreichte Ziel der Abwärtsbewegung im Deutschen idiomatisch aus.
theological_decisions:
- issue: Bedeutung des Öls im Aaronbild
  choice: Das Bild des reichlich herabfließenden Öls und der Bezug auf Aaron bleiben ohne ausdrückliche dogmatische Deutung stehen.
  alternative: Das Öl im Haupttext ausdrücklich als priesterliches Salböl oder als Symbol einer bestimmten geistlichen Wirklichkeit bezeichnen.
  rationale: Der Vers ruft zwar Aarons Salbung und priesterliche Weihe in Erinnerung, formuliert jedoch selbst nur einen poetischen Vergleich. Eine explizite Auslegung würde über den Wortlaut hinausgehen.
translation_notes:
  register: Moderne, würdige Psalmsprache. Die zweimalige Wendung »das hinabfließt« und die Wiederholung von »Bart« bewahren den feierlichen Parallelismus des Hebräischen. »Gewänder« hält den Plural und den priesterlichen Kontext fest.
