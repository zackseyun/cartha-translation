  text: כְּ/טַל חֶרְמ֗וֹן שֶׁ/יֹּרֵד֮ עַל הַרְרֵ֪י צִ֫יּ֥וֹן כִּ֤י שָׁ֨ם צִוָּ֣ה יְ֭הוָה אֶת הַ/בְּרָכָ֑ה חַ֝יִּ֗ים עַד הָ/עוֹלָֽם־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/003.yaml
  text: like the dew of Hermon[a], which falls on the mountains of Zion. For there Yahweh commanded the blessing[b], life forever.
translation:
  language: de
  text: 'wie der Tau des Hermon, der auf die Berge Zions herabfällt.[a] Denn dort hat Jahwe den Segen verordnet: Leben für immer.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der auf die Berge Zions herabsteigt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Leben auf ewig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/טַל חֶרְמוֹן
  choice: wie der Tau des Hermon
  rationale: Das Präfix כְּ kennzeichnet den Vergleich; טַל bedeutet „Tau“. Der Ortsname חֶרְמוֹן wird als „Hermon“ wiedergegeben.
- source_word: שֶׁ/יֹּרֵד
  choice: der … herabfällt
  rationale: ירד bezeichnet eine Abwärtsbewegung. Bei Tau ist „herabfallen“ im Deutschen natürlich und bewahrt zugleich diese Bewegungsrichtung.
- source_word: עַל הַרְרֵי צִיּוֹן
  choice: auf die Berge Zions
  rationale: הַרְרֵי ist eine Plural-Konstruktverbindung („Berge von“). „Zions“ gibt die Zugehörigkeit knapp und natürlich wieder.
- source_word: כִּי שָׁם
  choice: Denn dort
  rationale: כִּי leitet hier die Begründung ein; שָׁם bleibt bewusst als „dort“ stehen, ohne seinen Bezug erklärend festzulegen.
- source_word: צִוָּה
  choice: hat … geboten
  rationale: Das Verb צוה bedeutet grundsätzlich „gebieten/befehlen“. „Den Segen gebieten“ wahrt die starke, autoritative Aussage des Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner geläufigen wissenschaftlichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶת הַ/בְּרָכָה
  choice: den Segen
  rationale: Die definite Nominalgruppe bezeichnet das direkte Objekt; „den Segen“ ist die unmittelbare deutsche Entsprechung.
- source_word: חַיִּים עַד הָ/עוֹלָם
  choice: Leben für immer
  rationale: Die Wendung bezeichnet dauerhaftes, unbegrenztes Leben. „Für immer“ ist gegenwärtiges, verständliches Deutsch und vermeidet archaisches „ewiglich“.
theological_decisions:
- issue: Verhältnis der Schlusswendung zu „dem Segen“
  choice: „Leben für immer“ wird durch einen Doppelpunkt als nähere Bestimmung des Segens verstanden.
  alternative: Die Worte können als eigenständige abschließende Aussage oder als knappe Apposition mit Komma gelesen werden.
  rationale: Die hebräische Folge „den Segen, Leben für immer“ legt eine appositionelle Erläuterung nahe. Der Doppelpunkt macht diese im Deutschen verständlich, ohne eine weitergehende dogmatische Deutung einzutragen.
- issue: Bezug von „dort“
  choice: Der adverbiale Ausdruck bleibt unaufgelöst als „dort“ stehen.
  alternative: Man könnte ausdrücklich „auf Zion“ oder „in der brüderlichen Eintracht“ ergänzen.
  rationale: Der hebräische Text nennt den Bezug nicht ausdrücklich. Die knappe poetische Offenheit soll erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Bildsprache und die knappe Schlussformulierung bleiben erhalten; unnötige erklärende Zusätze werden vermieden.
