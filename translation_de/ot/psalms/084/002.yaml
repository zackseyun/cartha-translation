  text: נִכְסְפָ֬ה וְ/גַם כָּלְתָ֨ה נַפְשִׁ/י֮ לְ/חַצְר֪וֹת יְה֫וָ֥ה לִבִּ֥/י וּ/בְשָׂרִ֑/י יְ֝רַנְּנ֗וּ אֶ֣ל אֵֽל חָֽי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/002.yaml
  text: My soul longs—indeed[a], it even faints—for the courts of Yahweh; my heart and my flesh cry out to the living God.
translation:
  language: de
  text: Meine Seele sehnt sich, ja, sie verzehrt sich nach den Vorhöfen Jahwes; mein Herz und mein Leib jubeln dem lebendigen Gott zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „rufen zum lebendigen Gott“. Das hebräische Verb bezeichnet meist einen lauten, klingenden Freudenruf, kann hier im Zusammenhang der tiefen Sehnsucht aber auch allgemeiner als intensives Rufen verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְסְפָה
  choice: sehnt sich
  rationale: Das Verb bezeichnet starkes Verlangen; „sehnt sich“ ist im modernen Deutschen natürlich und bewahrt die emotionale Intensität.
- source_word: וְגַם כָּלְתָה
  choice: ja, sie verzehrt sich
  rationale: וְגַם steigert die Aussage, während כלה hier ein vom Verlangen aufgezehrtes Sein ausdrückt. Die Formulierung gibt die Klimax natürlich wieder.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: „Seele“ entspricht dem hebräischen Ausdruck unmittelbar und bezeichnet hier das verlangende innere Selbst.
- source_word: לְחַצְרוֹת
  choice: nach den Vorhöfen
  rationale: Gemeint sind die Tempelvorhöfe. Nach „sich sehnen/verzehren“ ist „nach“ idiomatisches Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לִבִּי וּבְשָׂרִי
  choice: mein Herz und mein Leib
  rationale: „Herz“ bewahrt die Bezeichnung des inneren Menschen; „Leib“ gibt בשר im Gegensatz dazu als leibliche Seite der Person würdig und verständlich wieder.
- source_word: יְרַנְּנוּ
  choice: jubeln … zu
  rationale: Das Verb bezeichnet gewöhnlich einen lauten, klingenden Freudenruf. Der Plural stimmt mit „Herz und Leib“ überein; „jubeln … zu“ bewahrt die positive Grundbedeutung besser als das kontextuell mögliche „rufen“.
- source_word: אֶל אֵל חָי
  choice: dem lebendigen Gott zu
  rationale: Die Zielrichtung von אֶל wird durch die deutsche Konstruktion „jemandem zujubeln“ natürlich und genau ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Transliteration bewahrt ihn, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von ירננו
  choice: jubeln … zu
  alternative: rufen zu
  rationale: Das Verb trägt regelmäßig die Bedeutung eines lauten Freudenrufs. Der Sehnsuchtskontext erlaubt zwar „rufen“, hebt die freudige Nuance aber nicht auf; die Alternative wird daher in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. „Vorhöfe“, „Seele“, „Herz“ und „Leib“ bewahren die Bildwelt des Hebräischen, ohne altertümliche Syntax zu verwenden.
