id: PSA.84.11
reference: Psalms 84:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י שֶׁ֨מֶשׁ וּ/מָגֵן֮ יְהוָ֪ה אֱלֹ֫הִ֥ים חֵ֣ן וְ֭/כָבוֹד יִתֵּ֣ן יְהוָ֑ה לֹ֥א יִמְנַע ט֝֗וֹב לַֽ/הֹלְכִ֥ים בְּ/תָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/011.yaml
  text: For Yahweh God is a sun and shield[a]; Yahweh gives favor and honor[b]. He does not withhold good from those who walk blamelessly.
translation:
  language: de
  text: Denn Jahwe Gott ist Sonne und Schild; Gunst und Ehre[a] gibt Jahwe. Nichts Gutes versagt er denen, die untadelig leben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gnade und Herrlichkeit“.'
    reason: lexical_alternative
  - marker: b
    text: „Untadelig“ meint hier, aufrichtig und integer zu leben, nicht sündlose Vollkommenheit.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und entspricht dem argumentativen Zusammenhang des Psalms.
- source_word: שֶׁמֶשׁ וּמָגֵן
  choice: Sonne und Schild
  rationale: Bewahrt beide konkreten poetischen Bilder für göttliches Licht beziehungsweise Wohlergehen und Schutz, ohne sie ausdeutend aufzulösen.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe Gott
  rationale: Gibt den Gottesnamen als „Jahwe“ wieder und lässt אֱלֹהִים als eng verbundene Bezeichnung „Gott“ folgen.
- source_word: חֵן וְכָבוֹד
  choice: Gunst und Ehre
  rationale: חֵן bezeichnet hier wohlwollende Zuwendung; כָבוֹד kann die von Gott verliehene Ehre oder Herrlichkeit meinen. „Gunst und Ehre“ ist im Deutschen natürlich und wahrt die Gabe-Perspektive.
- source_word: יִתֵּן
  choice: gibt
  rationale: Das Imperfekt beschreibt hier am ehesten Gottes kennzeichnendes Handeln beziehungsweise eine allgemeine Wahrheit; dafür ist das deutsche Präsens passend.
- source_word: לֹא יִמְנַע טוֹב
  choice: Nichts Gutes versagt er
  rationale: Gibt die Negation und das Zurückhalten von Gutem knapp und idiomatisch wieder.
- source_word: לַהֹלְכִים בְּתָמִים
  choice: denen, die untadelig leben
  rationale: הלך bezeichnet im ethischen Zusammenhang die Lebensführung. בְּתָמִים meint dabei ein integres, aufrichtiges Leben und nicht absolute Sündlosigkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird erkennbar wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von בְּתָמִים
  choice: untadelig leben
  alternative: aufrichtig leben / in Lauterkeit wandeln
  rationale: „Untadelig“ bewahrt die starke ethische Aussage, ohne bei sachgerechtem Verständnis sündlose Vollkommenheit zu behaupten; die Fußnote stellt diese Nuance klar.
- issue: Bedeutung von כָבוֹד als göttliche Gabe
  choice: Ehre
  alternative: Herrlichkeit
  rationale: Im Zusammenhang mit dem, was Gott Menschen schenkt, bezeichnet „Ehre“ gut die verliehene Würde. Die ebenso mögliche Wiedergabe „Herrlichkeit“ bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Die Metaphern „Sonne“ und „Schild“ bleiben erhalten; die ethische Weg-Metapher wird zugunsten unmittelbar verständlichen Deutschs mit „leben“ wiedergegeben.
