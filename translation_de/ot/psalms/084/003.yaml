  to: Sogar der Sperling hat ein Zuhause gefunden und die Schwalbe ein Nest für sich, wo sie ihre Jungen niederlegen kann — bei deinen Altären, Jahwe der Heerscharen, mein König und mein Gott!
  rationale: Die Revision ersetzt die syntaktisch problematische Kombination „wohin … bei“ durch eine natürliche Ortsformulierung. Sie nimmt „kann“ als funktionale Beschreibung des Nests in den Haupttext auf und erhält die mögliche perfektische Lesart ausdrücklich in Fußnote a. Die Altäre bleiben als bildhafte Näheangabe erhalten, ohne eine unmittelbare Platzierung auf den Altären zu behaupten.
