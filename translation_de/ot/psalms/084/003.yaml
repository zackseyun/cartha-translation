source:
  edition: WLC
  text: גַּם צִפּ֨וֹר מָ֪צְאָה בַ֡יִת וּ/דְר֤וֹר קֵ֥ן לָ/הּ֮ אֲשֶׁר שָׁ֪תָה אֶפְרֹ֫חֶ֥י/הָ אֶֽת מִ֭זְבְּחוֹתֶי/ךָ יְהוָ֣ה צְבָא֑וֹת מַ֝לְכִּ֗/י וֵ/אלֹהָֽ/י־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/003.yaml
  text: Even the sparrow has found a home[a], and the swallow a nest for herself, where she may lay her young—at your altars, O Yahweh of Armies[c][b], my King and my God.
translation:
  language: de
  text: Sogar der Sperling hat ein Zuhause gefunden und die Schwalbe ein Nest für sich, wo sie ihre Jungen niederlegen kann — bei deinen Altären, Jahwe der Heerscharen, mein König und mein Gott!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם
  choice: Sogar
  rationale: 'Gibt die hervorhebende Kraft wieder: Selbst die kleinen Vögel finden am Heiligtum einen Ort.'
- source_word: צִפּוֹר
  choice: Sperling
  rationale: Das Wort kann allgemein einen kleinen Vogel bezeichnen; „Sperling“ ist hier eine traditionsreiche, plausible Konkretisierung und bildet ein natürliches Paar mit „Schwalbe“.
- source_word: מָצְאָה בַיִת
  choice: hat ein Zuhause gefunden
  rationale: Gibt sowohl den perfektischen Ergebnisaspekt als auch den idiomatischen Sinn eines Wohnortes wieder.
- source_word: דְרוֹר
  choice: Schwalbe
  rationale: Eine geläufige und lexikalisch vertretbare Wiedergabe des nicht völlig sicher bestimmbaren Vogelnamens.
- source_word: קֵן לָהּ
  choice: ein Nest für sich
  rationale: Bewahrt den Dativ des Vorteils beziehungsweise Besitzes und den femininen Bezug auf die Schwalbe.
- source_word: אֲשֶׁר שָׁתָה אֶפְרֹחֶיהָ
  choice: wohin sie ihre Jungen gelegt hat
  rationale: Nimmt das hebräische Perfekt zunächst als vollendete Handlung und שׁית im Sinn von „setzen/legen“; die funktionale Lesart wird in der Fußnote offengehalten.
- source_word: אֶת מִזְבְּחוֹתֶיךָ
  choice: bei deinen Altären
  rationale: Die kompakte Konstruktion bezeichnet im Zusammenhang plausibel den Ort beziehungsweise die Nähe zu den Altären, nicht ein Nest unmittelbar auf deren Oberfläche.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Bewahrt den etablierten deutschen Ausdruck für himmlische oder militärische Scharen und den majestätischen Charakter des Gottesprädikats.
- source_word: מַלְכִּי וֵאלֹהָי
  choice: mein König und mein Gott
  rationale: Erhält die direkte, persönliche Anrede mit beiden Titeln.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich; „Jahwe“ bewahrt den persönlichen Namen, während die traditionelle Ersetzung als Alternative bekannt ist.
- issue: Verständnis der Vögel bei den Altären
  choice: bei deinen Altären
  alternative: an deinen Altären / deine Altäre
  rationale: Die Syntax ist gedrängt. Eine räumliche Nähe zum Heiligtum ist sachlich plausibel, ohne zu behaupten, die Vögel nisteten direkt auf den Opferaltären.
translation_notes:
  register: Modernes, verständliches und zugleich poetisch-würdevolles Standarddeutsch. „Sogar“ setzt den rhetorischen Akzent; die Satzstellung folgt dem hebräischen Parallelismus. Der Ausruf am Ende bewahrt die innige direkte Anrede.
