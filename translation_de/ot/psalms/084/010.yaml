id: PSA.84.10
reference: Psalms 84:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י טֽוֹב י֥וֹם בַּ/חֲצֵרֶ֗י/ךָ מֵ֫/אָ֥לֶף בָּחַ֗רְתִּי הִ֭סְתּוֹפֵף בְּ/בֵ֣ית אֱלֹהַ֑/י מִ֝/דּ֗וּר בְּ/אָהֳלֵי רֶֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/010.yaml
  text: For a day in your courts is better than a thousand[b][a]; I would rather stand at the threshold in the house of my God than dwell in the tents of wickedness.
translation:
  language: de
  text: Denn ein Tag in deinen Vorhöfen ist besser als tausend[a]. Lieber will ich an der Schwelle im Haus meines Gottes stehen[b], als in den Zelten des Unrechts zu wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nur: »als tausend«. Gemeint sein können tausend Tage anderswo; diese Wörter stehen jedoch nicht im hebräischen Text.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Ich habe gewählt, an der Schwelle im Haus meines Gottes zu sein«; traditionell: »Türhüter im Haus meines Gottes zu sein«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב ... מֵאָלֶף
  choice: besser als tausend
  rationale: Die Vergleichskonstruktion verlangt im Deutschen idiomatisch den Komparativ »besser«. Das im Hebräischen nicht ausdrücklich genannte Bezugswort nach »tausend« bleibt unergänzt.
- source_word: בַּחֲצֵרֶיךָ
  choice: in deinen Vorhöfen
  rationale: חָצֵר bezeichnet einen Hof oder Vorhof; im Heiligtumskontext ist »Vorhöfe« natürlich und bewahrt den Plural.
- source_word: בָּחַרְתִּי
  choice: Lieber will ich
  rationale: Das Perfekt bedeutet formal »ich habe gewählt«, drückt hier im poetischen Vergleich aber eine entschiedene Vorliebe aus.
- source_word: הִסְתּוֹפֵף
  choice: an der Schwelle ... stehen
  rationale: Das seltene Verb bezeichnet wohl das Verweilen oder Stehen an der Schwelle. Die Wiedergabe vermeidet die nicht ausdrücklich bezeichnete Amtsfunktion eines Türhüters.
- source_word: בְּבֵית אֱלֹהַי
  choice: im Haus meines Gottes
  rationale: Die konkrete Heiligtumsmetapher »Haus« wird bewahrt, ohne sie durch »Tempel« näher festzulegen.
- source_word: מִדּוּר
  choice: als ... zu wohnen
  rationale: Der Infinitiv von דור bezeichnet das Wohnen oder Sichaufhalten und bildet den zweiten Teil des Vergleichs.
- source_word: בְּאָהֳלֵי רֶשַׁע
  choice: in den Zelten des Unrechts
  rationale: Das abstrakte רֶשַׁע wird als »Unrecht« wiedergegeben; so bleibt die moralische Qualität erhalten, ohne die Formulierung zu »Zelten der Frevler« zu personalisieren.
theological_decisions:
- issue: Sprache für das Heiligtum
  choice: deine Vorhöfe / das Haus meines Gottes
  alternative: deine Höfe / der Tempel meines Gottes
  rationale: Die konkreten Bilder des hebräischen Textes bleiben erhalten; »Tempel« würde das allgemeinere »Haus« interpretierend präzisieren.
- issue: Niedriger Platz am Heiligtum
  choice: an der Schwelle stehen
  alternative: Türhüter sein
  rationale: Der Text stellt die geringste Nähe zu Gottes Haus dem Wohnen beim Unrecht gegenüber. Eine formelle kultische Amtsbezeichnung ist lexikalisch nicht sicher und wird daher nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter Psalmsprache. Der parallele Vergleich und die konkrete Bildwelt des Heiligtums bleiben erhalten; nicht ausdrücklich genannte Ergänzungen werden nur in den Fußnoten erläutert.
