  text: יֵ֭לְכוּ מֵ/חַ֣יִל אֶל חָ֑יִל יֵרָאֶ֖ה אֶל אֱלֹהִ֣ים בְּ/צִיּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/007.yaml
  text: They go from strength to strength[b][a]; each one appears before God in Zion.
translation:
  language: de
  text: Sie gehen von Kraft zu Kraft[a]; jeder erscheint vor Gott in Zion.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von Schar zu Schar« beziehungsweise »von Sieg zu Sieg«; das hebräische Wort für »Kraft« kann auch Stärke, Tapferkeit oder ein Heer bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »erscheint zu Gott hin«. Gemeint ist wahrscheinlich, dass jeder sich zur Anbetung vor Gott einfindet. Möglich ist auch: »Jeder wird von Gott in Zion gesehen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  choice: Sie gehen
  rationale: Das Qal-Imperfekt 3. Person Plural von הלך bezeichnet hier die fortschreitende Bewegung der Pilger. »Gehen« ist natürlich und legt die Art der Bewegung nicht unnötig fest.
- source_word: מֵחַיִל אֶל חָיִל
  choice: von Kraft zu Kraft
  rationale: חַיִל umfasst unter anderem Kraft, Stärke, Tapferkeit und Heer. Im Wallfahrtszusammenhang gibt »von Kraft zu Kraft« die wahrscheinlich gemeinte fortschreitende beziehungsweise erneuerte Kraft wieder, ohne die weiteren Möglichkeiten zu verdecken.
- source_word: יֵרָאֶה
  choice: erscheint
  rationale: Das Nifal-Imperfekt 3. Person Singular von ראה kann im kultischen Zusammenhang das Erscheinen beziehungsweise Sich-Einfinden vor Gott bezeichnen. »Erscheint« bewahrt zugleich die knappe Formulierung und eine gewisse Mehrdeutigkeit.
- source_word: אֶל אֱלֹהִים
  choice: vor Gott
  rationale: אֶל bedeutet formal »zu/auf … hin«; zusammen mit dem kultischen Erscheinen ist »vor Gott« im Deutschen die idiomatische Wiedergabe.
- source_word: בְצִיּוֹן
  choice: auf dem Zion
  rationale: Bei der Bezeichnung des Berges beziehungsweise Heiligtumsortes ist »auf dem Zion« im Deutschen idiomatisch und bewahrt den Eigennamen.
- source_word: יֵרָאֶה (Singular im pluralischen Kontext)
  choice: jeder erscheint
  rationale: 'Der singularische Verbgebrauch nach dem pluralischen »sie gehen« wird distributiv wiedergegeben: Jeder einzelne Pilger erscheint.'
theological_decisions:
- issue: Bedeutung des Erscheinens vor Gott
  choice: Die Pilger finden sich zur Anbetung vor Gott auf dem Zion ein.
  alternative: Der Einzelne wird von Gott auf dem Zion gesehen.
  rationale: Das Nifal von ראה kann in Wallfahrts- und Kultzusammenhängen idiomatisch »vor Gott erscheinen« bedeuten. Die Übersetzung hält diese wahrscheinliche Lesart fest; die passivere Möglichkeit wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Wendung »von Kraft zu Kraft« bleibt wegen ihrer Prägnanz und Nähe zum Hebräischen erhalten. Die Verteilung des singularischen Verbs wird durch »jeder« sichtbar gemacht; Fußnoten bewahren die lexikalische und grammatische Mehrdeutigkeit.
