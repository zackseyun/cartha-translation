  text: אַ֭שְׁרֵי יוֹשְׁבֵ֣י בֵיתֶ֑/ךָ ע֝֗וֹד יְֽהַלְל֥וּ/ךָ סֶּֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/004.yaml
  text: Blessed are those who dwell in your house[a]; they will still praise you[c][b]. Selah
translation:
  language: de
  text: Glücklich[a] sind, die in deinem Haus[b] wohnen; sie werden dich weiterhin loben.[c] Sela[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie glücklich sind …“'
    reason: lexical_alternative
  - marker: b
    text: Mit „deinem Haus“ ist wahrscheinlich Gottes Heiligtum beziehungsweise der Tempel gemeint.
    reason: cultural_note
  - marker: c
    text: 'Oder: „Sie loben dich immerfort.“ Die hebräische Verbform kann zukünftiges oder fortdauerndes, wiederholtes Handeln bezeichnen.'
    reason: translation_ambiguity
  - marker: d
    text: „Sela“ ist ein hebräischer liturgischer oder musikalischer Ausdruck, dessen genaue Bedeutung unsicher ist; traditionell bleibt er unübersetzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich sind
  rationale: Die hebräische Ausrufform leitet einen Glückwunsch beziehungsweise eine Seligpreisung ein. „Glücklich sind“ ist im heutigen Deutsch klar und würdevoll; der Ausrufcharakter bleibt in der Fußnote sichtbar.
- source_word: יוֹשְׁבֵי
  choice: die … wohnen
  rationale: Das Partizip von ישׁב bezeichnet hier ein andauerndes Wohnen oder Verweilen, nicht bloß ein Sitzen.
- source_word: בֵיתֶךָ
  choice: in deinem Haus
  rationale: Die wörtliche Bildsprache des Hebräischen bleibt erhalten. Im Kontext ist wahrscheinlich Gottes Heiligtum gemeint, doch „Tempel“ würde den Ausdruck im Haupttext stärker festlegen.
- source_word: עוֹד
  choice: weiterhin
  rationale: Das Adverb bezeichnet hier am ehesten Fortdauer. „Weiterhin“ verbindet sich natürlich mit dem imperfektiven Verb, ohne die Bedeutung so stark wie „immerfort“ zu intensivieren.
- source_word: יְהַלְלוּךָ
  choice: sie werden dich … loben
  rationale: Die Verbform kann zukünftiges oder wiederholtes beziehungsweise andauerndes Handeln ausdrücken. Die Zukunftsform bewahrt diese Offenheit zusammen mit „weiterhin“ weitgehend; eine habituelle Wiedergabe wird als Alternative genannt.
- source_word: סֶּלָה
  choice: Sela
  rationale: Da die genaue Bedeutung des liturgischen oder musikalischen Fachworts unsicher ist, wird es traditionell und transparent unübersetzt übernommen.
theological_decisions:
- issue: Bedeutung von „deinem Haus“
  choice: Die Formulierung „deinem Haus“ bleibt im Haupttext stehen.
  alternative: „deinem Tempel“ oder „deinem Heiligtum“
  rationale: Gemeint ist wahrscheinlich Gottes Heiligtum beziehungsweise der Tempelbereich. Die wörtliche Wiedergabe bewahrt jedoch die poetische und theologische Bildsprache und vermeidet eine unnötige Verengung.
- issue: Zeitlicher oder habitueller Sinn von יְהַלְלוּךָ
  choice: „sie werden dich weiterhin loben“
  alternative: „sie loben dich immerfort“
  rationale: Der hebräische Imperfekt lässt sowohl eine zukünftige als auch eine wiederholte oder fortdauernde Aussage zu. Die gewählte Form wahrt den Zukunftsaspekt, während „weiterhin“ die Fortdauer ausdrückt; die alternative habituelle Lesart wird in einer Fußnote erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, poetischer Satzführung. Das Semikolon erhält die enge Parallelität der beiden Vershälften; „Sela“ bleibt als eigenständiger liturgischer Abschluss stehen.
