  terminology: »Jahwe« folgt der vorgegebenen Namenswiedergabe. »Heerscharen« vermeidet die stärker deutende Wiedergabe »der Allmächtige«. »Der Mensch« gibt den generischen hebräischen Singular ohne unnötige geschlechtliche oder dogmatische Festlegung wieder. Die Fußnoten markieren sowohl den generischen Bezug als auch legitime Bedeutungsalternativen von אַשְׁרֵי sachgerecht.
