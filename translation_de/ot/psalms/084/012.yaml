  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des Hebräischen angemessen wieder: den Gottesnamen יהוה als »Jahwe«, den Titel צבאות als »der Heerscharen«, die Ausrufs-/Seligpreisungsformel אַשְׁרֵי, das repräsentative Singularwort אָדָם sowie das partizipiale »der auf dich vertraut«. Die direkte Anrede und der Ausrufcharakter bleiben erhalten.'
