id: PSA.84.12
reference: Psalms 84:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָ֥ה צְבָא֑וֹת אַֽשְׁרֵ֥י אָ֝דָ֗ם בֹּטֵ֥חַ בָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/012.yaml
  text: O Yahweh of hosts[b][a], blessed is the man who trusts in you.
translation:
  language: de
  text: Jahwe der Heerscharen, wie glücklich ist der Mensch[a], der auf dich vertraut![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »der Mensch« ist hier jeder Mensch gemeint, der auf Jahwe vertraut.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »gesegnet ist«; auch: »wohl dem Menschen« beziehungsweise »wie gut hat es der Mensch«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel wie »der HERR« zu ersetzen.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die traditionelle und bildhafte Wiedergabe bewahrt den Bezug auf die himmlischen beziehungsweise irdischen Heere, ohne ihn deutend zu »Allmächtiger« aufzulösen.
- source_word: אַשְׁרֵי
  choice: wie glücklich ist
  rationale: Die ausrufende Seligpreisungsformel bezeichnet den Menschen als glücklich beziehungsweise beneidenswert gestellt; die Formulierung klingt im heutigen Deutsch natürlich und behält den Ausrufcharakter.
- source_word: אָדָם
  choice: der Mensch
  rationale: Das singularische אָדָם bezeichnet hier repräsentativ einen Menschen unabhängig vom Geschlecht. »Der Mensch« bewahrt sowohl den Singular als auch den allgemeinen Bezug.
- source_word: בֹּטֵחַ
  choice: der … vertraut
  rationale: Das Partizip beschreibt eine kennzeichnende, fortdauernde Haltung des Vertrauens.
- source_word: בָּךְ
  choice: auf dich
  rationale: Im Deutschen verbindet sich »vertrauen« in dieser Aussage idiomatisch mit »auf«; die direkte Anrede Jahwes bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottestitels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: Jahwe Zebaot; HERR, der Allmächtige
  rationale: Die gewählte Fassung erhält sowohl den persönlichen Gottesnamen als auch das militärisch-kosmische Bild von צְבָאוֹת und vermeidet eine interpretierende Gleichsetzung mit »der Allmächtige«.
- issue: Bedeutungsnuance der Seligpreisungsformel אַשְׁרֵי
  choice: wie glücklich ist
  alternative: gesegnet ist; wohl dem
  rationale: Die hebräische Formel kann Glück, Wohlergehen oder eine besonders günstige Stellung ausdrücken. »Wie glücklich« wahrt den Ausruf und legt nicht einseitig fest, dass hier ausdrücklich ein Segensakt bezeichnet wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und der Ausrufcharakter des hebräischen Verses bleiben erhalten; »Heerscharen« ist bewusst bibelsprachlich, aber verständlich.
