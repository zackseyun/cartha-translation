base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/005.yaml
  text: Blessed is the man whose strength is in you[b][a], in whose heart are the highways.
translation:
  language: de
  text: Glücklich ist der Mensch, dessen Stärke in dir ist, in dessen Herzen[a] gebahnte Wege[b] sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „in ihrem Herzen“; das hebräische Suffix ist pluralisch, obwohl der Vers mit dem singularischen „Mensch“ beginnt. Es kann die Menschen bezeichnen, die durch diesen singularischen Ausdruck allgemein angesprochen sind.
    reason: grammatical_ambiguity
  - marker: b
    text: Die „gebahnten Wege“ sind im Zusammenhang wahrscheinlich Pilgerwege zu Gottes Wohnstätte; ein Ziel wie Zion wird in diesem Vers jedoch nicht ausdrücklich genannt.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die idiomatische Pluralform leitet einen Weisheitsspruch ein. „Glücklich ist“ gibt die Seligpreisung in natürlichem, gehobenem Gegenwartsdeutsch wieder.
- source_word: אָדָם
  choice: der Mensch
  rationale: Das maskuline Singularwort wird hier allgemein und stellvertretend gebraucht. „Der Mensch“ wahrt Numerus und Allgemeingültigkeit, ohne das Geschlecht stärker hervorzuheben, als es das Hebräische verlangt.
- source_word: עֹז
  choice: Stärke
  rationale: Gemeint ist die in Gott gegründete Kraft; „Stärke“ entspricht dem Grundsinn, ohne das Bild zu einem „Zufluchtsort“ umzudeuten.
- source_word: לוֹ ... בָךְ
  choice: dessen Stärke in dir ist
  rationale: Wörtlich steht etwa „dem Stärke in dir ist“. Die Relativkonstruktion ist im Deutschen natürlich und bewahrt das metaphorisch-lokative „in dir“.
- source_word: מְסִלּוֹת
  choice: gebahnte Wege
  rationale: Das Wort bezeichnet aufgeschüttete beziehungsweise gebahnte Straßen oder Hauptwege. „Gebahnte Wege“ bewahrt das konkrete Wegbild, ohne das im Vers nicht ausdrücklich genannte Ziel Zion einzufügen.
- source_word: בִּלְבָבָם
  choice: in dessen Herzen
  rationale: Für einen verständlichen deutschen Satz wird der Bezug auf den singularischen „Menschen“ angeglichen. Der hebräische Wechsel zum pluralischen Suffix wird in einer Fußnote ausdrücklich ausgewiesen.
theological_decisions:
- issue: Allgemeiner Gebrauch von אָדָם
  choice: der Mensch
  alternative: der Mann
  rationale: אָדָם bezeichnet hier einen einzelnen Menschen in stellvertretend-allgemeinem Sinn. „Der Mensch“ ist lexikalisch sachgerecht und vermeidet eine unnötige Beschränkung auf männliche Personen.
- issue: Ziel der מְסִלּוֹת
  choice: gebahnte Wege
  alternative: Pilgerwege nach Zion
  rationale: Der Zusammenhang des Psalms legt Pilgerwege zu Gottes Wohnstätte nahe, doch weder „Pilger-“ noch „nach Zion“ steht ausdrücklich in diesem Vers. Die Übersetzung belässt die Offenheit im Haupttext und erläutert den Kontext in der Fußnote.
- issue: Numeruswechsel in בִּלְבָבָם
  choice: in dessen Herzen
  alternative: in ihrem Herzen / in ihren Herzen
  rationale: Der Vers beginnt mit dem singularischen „Mensch“, während das hebräische Suffix an „Herz“ pluralisch ist. Der Haupttext folgt für flüssiges Deutsch dem singularischen Bezug; die echte grammatische Spannung bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Seligpreisungsformel bleibt knapp; das ungewöhnliche innere Bild der Wege im Herzen wird nicht erklärend aufgelöst.
