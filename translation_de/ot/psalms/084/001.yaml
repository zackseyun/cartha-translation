source:
  edition: WLC
  text: מַה יְּדִיד֥וֹת מִשְׁכְּנוֹתֶ֗י/ךָ יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/001.yaml
  text: How lovely are your dwelling places[a], O Yahweh of hosts!
translation:
  language: de
  text: Wie lieblich sind deine Wohnstätten[a], Jahwe der Heerscharen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie geliebt sind deine Wohnungen“; oder: „Wie angenehm sind deine Wohnstätten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Wie
  rationale: Das exklamative מַה leitet hier keine Frage, sondern einen bewundernden Ausruf ein; deutsches „Wie“ gibt dies natürlich und knapp wieder.
- source_word: יְדִידוֹת
  choice: lieblich
  rationale: Das feminine Pluraladjektiv bezeichnet etwas Liebenswertes, Angenehmes oder Schönes. „Lieblich“ bewahrt den poetischen und gefühlsbetonten Klang, ohne lediglich Besitz oder persönliche Zuneigung auszudrücken.
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: deine Wohnstätten
  rationale: „Wohnstätten“ erhält den Plural und den Grundgedanken des Wohnens. Es lässt den Bezug auf Gottes Heiligtum und dessen Bereiche offen, statt ihn auf die Stiftshütte einzuengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Im festen Gottesprädikat bewahrt „Heerscharen“ die breite poetisch-theologische Bedeutung möglicher himmlischer und kosmischer Heere besser als das engere „Armeen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; die Transliteration bewahrt diesen Unterschied gegenüber einem bloßen Herrschaftstitel.
- issue: Wiedergabe des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: Jahwe der Heere
  rationale: „Heerscharen“ erhält die traditionelle Weite des Titels, ohne dessen Bezug vorschnell ausschließlich auf menschliche Armeen festzulegen.
translation_notes:
  register: Poetisch, würdig und zugleich in modernem Standarddeutsch verständlich. Die Wortstellung folgt einem natürlichen deutschen Ausruf; der Plural und die Mehrdeutigkeit von יְדִידוֹת werden bewahrt und in der Fußnote erläutert.
