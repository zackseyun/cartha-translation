source:
  edition: WLC
  text: מָ֭גִנֵּ/נוּ רְאֵ֣ה אֱלֹהִ֑ים וְ֝/הַבֵּ֗ט פְּנֵ֣י מְשִׁיחֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/009.yaml
  text: Look on our shield[a], O God[b], and look on the face of your anointed.
translation:
  language: de
  text: Sieh unseren Schild[a] an, Gott, und blicke auf das Angesicht deines Gesalbten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »unseren Schild«; gemeint sein kann auch »unseren Beschützer«. Das Bild kann sich auf Gott als Beschützer oder auf den König beziehen.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort für »Gesalbter« liegt auch dem Titel »Messias« zugrunde. Hier ist zunächst wahrscheinlich der davidische König gemeint; eine weitergehende messianische Bedeutung bleibt möglich.
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנֵּנוּ
  choice: unseren Schild
  rationale: מָגֵן bezeichnet wörtlich einen Schild und kann hier bildlich einen Beschützer, möglicherweise Gott oder den König, meinen. Das konkrete Bild und seine Mehrdeutigkeit bleiben erhalten.
- source_word: רְאֵה
  choice: Sieh … an
  rationale: Der Imperativ bittet um zugewandte, günstige Beachtung. „Sieh … an“ ist im heutigen Deutsch natürlich und bleibt nah am hebräischen Ausdruck.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Wort ist hier direkte Anrede. Der deutsche Vokativ benötigt keine zusätzliche Partikel.
- source_word: וְהַבֵּט
  choice: und blicke auf
  rationale: נבט bezeichnet ein bewusstes, gerichtetes Hinschauen. „Blicke auf“ wahrt den poetischen Parallelismus und unterscheidet das Verb leicht von ראה.
- source_word: פְּנֵי
  choice: das Angesicht
  rationale: פָּנִים bedeutet wörtlich „Gesicht/Angesicht“. „Angesicht“ bewahrt in würdigem poetischem Deutsch das konkrete und relationale Bild.
- source_word: מְשִׁיחֶךָ
  choice: deines Gesalbten
  rationale: מָשִׁיחַ bedeutet „Gesalbter“. Im unmittelbaren Zusammenhang ist wahrscheinlich der davidische König gemeint; die Übersetzung vermeidet eine vorschnelle Festlegung auf den Titel „Messias“.
theological_decisions:
- issue: Bezug von „unser Schild“
  choice: Das Bild „unser Schild“ bleibt ohne eindeutige Zuordnung stehen.
  alternative: Deutende Wiedergabe als „unser Beschützer“ oder ausdrückliche Beziehung auf Gott beziehungsweise den König.
  rationale: Der hebräische Wortlaut lässt offen, ob „Schild“ Gott als Beschützer oder den König bezeichnet. Die Übersetzung bewahrt diese poetische und theologische Spannung.
- issue: Bezug von „dein Gesalbter“
  choice: „deines Gesalbten“ ohne christologische Großschreibung oder Wiedergabe als „Messias“
  alternative: „deines Messias“
  rationale: Im ursprünglichen Kontext bezeichnet die Wendung wahrscheinlich zunächst den gesalbten davidischen König. Zugleich bleibt die sprachliche Verbindung zum Begriff „Messias“ in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Psalmenpoesie. „Angesicht“ ist bewusst poetisch, aber allgemein verständlich; die beiden hebräischen Verben des Sehens werden mit „ansehen“ und „aufblicken“ leicht unterschieden.
