id: PSA.84.6
reference: Psalms 84:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עֹבְרֵ֤י בְּ/עֵ֣מֶק הַ֭/בָּכָא מַעְיָ֣ן יְשִׁית֑וּ/הוּ גַּם בְּ֝רָכ֗וֹת יַעְטֶ֥ה מוֹרֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/006.yaml
  text: As they pass through the Valley of Baca[a], they make it a spring[b]; even the early rain covers it with blessings.
translation:
  language: de
  text: Wenn sie durch das Baka-Tal[a] ziehen, machen sie es zu einer Quelle; auch der Frühregen[b] hüllt es in Segen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baka kann an das hebräische Wort für „Weinen“ anklingen; daher ist auch die Deutung „Tal des Weinens“ möglich.
    reason: alternative_reading
  - marker: b
    text: Gemeint ist der erste jahreszeitliche Regen, also der Herbstregen. Das hebräische Wort kann auch „Lehrer“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבְרֵי
  choice: wenn sie … ziehen
  rationale: Das substantivisch gebrauchte Qal-Partizip bezeichnet die hindurchziehenden Pilger. Ein temporaler Nebensatz gibt den fortlaufenden Vorgang im Deutschen natürlich wieder.
- source_word: בְּעֵמֶק
  choice: durch das … Tal
  rationale: In Verbindung mit עבר bezeichnet die Präposition die Bewegung durch einen Ort.
- source_word: הַבָּכָא
  choice: Baka
  rationale: Der Ausdruck kann als Ortsname beziehungsweise deutungsreicher Flurname verstanden werden. Die Umschrift bewahrt die mögliche Anspielung auf Weinen, ohne sie im Haupttext festzulegen.
- source_word: מַעְיָן
  choice: eine Quelle
  rationale: Das Wort bezeichnet eine natürliche Wasserquelle und passt zum poetischen Bild.
- source_word: יְשִׁיתוּהוּ
  choice: machen sie es zu
  rationale: שׁית bedeutet hier ‚setzen, machen‘; das maskuline Suffix bezieht sich auf das Tal, das bildlich zu einer Quelle gemacht wird.
- source_word: גַּם
  choice: auch
  rationale: Das Wort fügt eine weitere, steigernde Aussage hinzu. ‚Auch‘ wahrt diese Funktion, ohne die Betonung stärker festzulegen als der hebräische Text.
- source_word: בְּרָכוֹת
  choice: in Segen
  rationale: Die vokalisierte Form bedeutet ‚Segnungen/Segen‘. Der kollektive Singular ist im Deutschen poetisch und natürlich; zugleich bleibt die Verbindung von Segen und lebensspendendem Wasser erhalten.
- source_word: יַעְטֶה
  choice: hüllt … ein
  rationale: Das Verb bezeichnet das Bedecken oder Umhüllen. Die deutsche Wendung bewahrt das poetische Bild.
- source_word: מוֹרֶה
  choice: der Frühregen
  rationale: Im Zusammenhang mit Quelle, Wasser und Segen ist die Bezeichnung für den ersten jahreszeitlichen Regen am wahrscheinlichsten. Die ebenfalls mögliche Bedeutung ‚Lehrer‘ wird in einer Fußnote erhalten.
theological_decisions:
- issue: Deutung von הַבָּכָא
  choice: Im Haupttext als Ortsname „Baka“ wiedergeben
  alternative: „Tal des Weinens“ oder „Tränental“
  rationale: Der Ausdruck funktioniert wahrscheinlich als Flurname, kann aber zugleich an das hebräische Wort für Weinen anklingen. Die Umschrift vermeidet eine vorschnelle Auflösung dieser poetischen Mehrdeutigkeit.
- issue: Bedeutung von מוֹרֶה
  choice: „Frühregen“
  alternative: „Lehrer“
  rationale: Die Wasserbilder des unmittelbaren Kontexts sprechen für den jahreszeitlichen Regen. Da dieselbe hebräische Form auch „Lehrer“ bedeuten kann, wird diese echte lexikalische Mehrdeutigkeit in der Fußnote genannt.
- issue: Bezug und Bild von יְשִׁיתוּהוּ
  choice: Die Durchziehenden machen das Tal zu einer Quelle
  alternative: Sie setzen beziehungsweise machen eine Quelle darin
  rationale: Das Suffix bezieht sich grammatisch am ehesten auf das Tal, während מַעְיָן als prädikative Ergänzung steht. Die Formulierung wahrt die starke poetische Aussage, ohne zu erklären, ob dies wörtlich, bildlich oder durch Gottes Segen geschieht.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Bildhaftigkeit. „Baka“ bleibt als deutungsoffener Ortsname erhalten; „hüllt es in Segen“ bildet die hebräische Metapher natürlich ab.
