  language: de
  text: Für den Chorleiter. Nach der Gittit[a]. Ein Psalm der Söhne Korachs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Gittit; vermutlich eine musikalische Angabe, etwa eine Melodie, Spielweise oder ein Instrument. Die genaue Bedeutung ist unbekannt.
    reason: lexical_alternative
  - marker: b
