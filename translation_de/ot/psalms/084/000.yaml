lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Die Form bezeichnet in Psalmüberschriften üblicherweise den für die musikalische Aufführung Verantwortlichen. „Chorleiter“ ist im heutigen Deutsch klar und passt zum musikalischen Kontext.
- source_word: עַל הַגִּתִּית
  choice: Nach der Gittit
  rationale: עַל kann hier eine Melodie, musikalische Art oder ein Instrument einführen. „Nach“ bewahrt diese Offenheit, während „Gittit“ wegen der unsicheren Bedeutung transliteriert wird.
- source_word: לִבְנֵי קֹרַח
  choice: der Söhne Korachs
  rationale: Die Präposition ל kann Urheberschaft, Zugehörigkeit oder Widmung ausdrücken. Der knappe Genitiv lässt das genaue Verhältnis angemessen offen.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: מִזְמוֹר ist eine etablierte Gattungsbezeichnung für ein musikalisch vorgetragenes Lied; „Psalm“ ist dafür die natürliche deutsche Wiedergabe.
