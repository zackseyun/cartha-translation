id: PSA.84.8
reference: Psalms 84:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְה֘וָ֤ה אֱלֹהִ֣ים צְ֭בָאוֹת שִׁמְעָ֣/ה תְפִלָּתִ֑/י הַאֲזִ֨ינָ/ה אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/008.yaml
  text: O Yahweh God of hosts[a], hear my prayer; give ear, O God of Jacob[b]. Selah
translation:
  language: de
  text: Jahwe[a], Gott der Heerscharen, höre mein Gebet; schenke mir Gehör, Gott Jakobs! Sela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text hat den Gottesnamen JHWH, hier als „Jahwe“ wiedergegeben; traditionell steht in deutschen Übersetzungen dafür „der HERR“.
    reason: alternative_reading
  - marker: b
    text: „Sela“ ist ein hebräischer liturgischer oder musikalischer Ausdruck mit unsicherer Bedeutung; möglich sind etwa „Pause“ oder „Zwischenspiel“.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Wort steht hier als Gottesbezeichnung in Verbindung mit dem Namen Jahwe.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die traditionelle deutsche Wiedergabe bewahrt die semantische Weite des Ausdrucks, der Heere beziehungsweise himmlische Mächte bezeichnen kann, ohne ihn unnötig festzulegen.
- source_word: שִׁמְעָה
  choice: höre
  rationale: Der Imperativ wird in der direkten Gebetsbitte knapp und natürlich mit „höre“ wiedergegeben.
- source_word: תְפִלָּתִי
  choice: mein Gebet
  rationale: Direkte Wiedergabe des Substantivs mit dem Suffix der ersten Person Singular.
- source_word: הַאֲזִינָה
  choice: schenke mir Gehör
  rationale: Die Formulierung erhält die poetische Parallele zu „höre“, ohne beide hebräischen Verben gleich wiederzugeben. Das ergänzte „mir“ ist im Deutschen idiomatisch und aus der Gebetssituation eindeutig.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Gott Jakobs
  rationale: Die knappe deutsche Genitivverbindung gibt die Beziehung Gottes zu Jakob beziehungsweise Israel transparent wieder.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und liturgische Funktion des Ausdrucks unsicher sind, wird er transliteriert und nicht spekulativ übersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Transliteration „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von סֶלָה
  choice: Sela
  alternative: Pause; Zwischenspiel
  rationale: Die genaue Bedeutung ist umstritten. Die Transliteration erhält diese Unbestimmtheit und die liturgische Textgestalt.
- issue: Bedeutungsumfang von צְבָאוֹת
  choice: der Heerscharen
  alternative: der Heere; der himmlischen Heere
  rationale: „Heerscharen“ lässt offen, ob irdische oder himmlische Heere beziehungsweise kosmische Mächte im Vordergrund stehen, und vermeidet eine theologische Verengung.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch mit poetischer Parallelität. „Heerscharen“ ist bewusst als etablierter, semantisch weiter Ausdruck beibehalten; „schenke mir Gehör“ wirkt gehoben, bleibt aber allgemein verständlich.
