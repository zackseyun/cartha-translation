id: PSA.101.1
reference: Psalms 101:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר חֶֽסֶד וּ/מִשְׁפָּ֥ט אָשִׁ֑ירָה לְ/ךָ֖ יְהוָ֣ה אֲזַמֵּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/001.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, O Yahweh[b], I will sing praise.
translation:
  language: de
  text: 'Von David[a]. Ein Psalm.


    Von beständiger Liebe und Recht will ich singen;

    dir, Jahwe[b], will ich musizieren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Überschrift kann auch „Für David“ oder „David zugehörig“ bedeuten; sie kann Urheberschaft, Widmung oder Verbindung anzeigen.
    reason: alternative_reading
  - marker: b
    text: Hebräisch יהוה (JHWH), der Gottesname; traditionell wird er mit „der HERR“ wiedergegeben.
    reason: divine_name
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Präposition לְ in Psalmüberschriften kann Urheberschaft, Zugehörigkeit, Widmung oder Verbindung anzeigen. „Von David“ ist im Deutschen natürlich, ohne die mögliche Beziehung völlig auf Urheberschaft einzuengen.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Dies ist die etablierte und kontextgerechte deutsche Wiedergabe der musikalischen Gattungsbezeichnung.
- source_word: חֶסֶד
  choice: beständige Liebe
  rationale: חֶסֶד umfasst Liebe, Güte, Erbarmen und verlässliche Loyalität. „Beständige Liebe“ bringt sowohl die Zuwendung als auch ihre Verlässlichkeit zur Geltung.
- source_word: וּמִשְׁפָּט
  choice: und Recht
  rationale: מִשְׁפָּט kann Recht, gerechte Ordnung, Rechtsprechung oder Gericht bezeichnen. In der Verbindung mit חֶסֶד passt das umfassende deutsche „Recht“ gut und lässt den ethischen wie richterlichen Sinn offen.
- source_word: אָשִׁירָה
  choice: will ich singen
  rationale: Die Kohortativform drückt Entschluss oder Absicht aus; „will ich singen“ gibt dies idiomatisch und knapp wieder.
- source_word: לְךָ
  choice: dir
  rationale: Die Präposition bezeichnet hier den Adressaten des Singens und Musizierens.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲזַמֵּרָה
  choice: will ich musizieren
  rationale: זמר bezeichnet musikalisches Singen oder Spielen zum Lob. „Musizieren“ bewahrt den Unterschied zum unmittelbar vorausgehenden אָשִׁירָה, ohne eine bestimmte instrumentale Ausführung festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ macht den persönlichen Namen sichtbar; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt.
- issue: Bedeutungsumfang von חֶסֶד und מִשְׁפָּט
  choice: beständige Liebe und Recht
  alternative: Gnade und Gericht
  rationale: Die gewählte Fassung wahrt den umfassenden Sinn von verlässlicher Zuwendung und gerechter Ordnung. Die Alternative ist möglich, würde beide Begriffe hier jedoch stärker verengen.
translation_notes:
  register: Moderne, würdige Psalmsprache mit knapper poetischer Parallelstruktur. „Beständige Liebe“ ist verständlich und hält den Beziehungs- und Treueaspekt von חֶסֶד fest; „musizieren“ vermeidet eine unnötige Wiederholung von „singen“ und bewahrt die musikalische Nuance von זמר.
