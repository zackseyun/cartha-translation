source:
  edition: WLC
  text: לַ/בְּקָרִ֗ים אַצְמִ֥ית כָּל רִשְׁעֵי אָ֑רֶץ לְ/הַכְרִ֥ית מֵֽ/עִיר יְ֝הוָ֗ה כָּל פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/008.yaml
  text: Morning by morning I will destroy all the wicked of the land[b][a], cutting off from the city of Yahweh all workers of iniquity.
translation:
  language: de
  text: Morgen für Morgen werde ich alle Frevler im Land[a] vernichten, um aus der Stadt Jahwes[b] alle auszurotten, die Unrecht tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der Erde“. Das hebräische Wort אֶרֶץ kann sowohl „Land“ als auch „Erde“ bedeuten; zum königlichen Zusammenhang dieses Psalms passt hier „Land“ besser.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: JHWH, hier als „Jahwe“ wiedergegeben; traditionell mit „der HERR“ wiedergegeben. Eine weitere Wiedergabe ist „Jehova“.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַבְּקָרִים
  choice: Morgen für Morgen
  rationale: Die pluralische Form mit Präposition und Artikel hat hier einen wiederholenden, distributiven Sinn. „Morgen für Morgen“ gibt dieses regelmäßige Handeln im Deutschen idiomatisch wieder.
- source_word: אַצְמִית
  choice: werde ich … vernichten
  rationale: Das Hifil von צמת bezeichnet hier, jemanden zugrunde zu richten beziehungsweise zu vernichten. Die Wiedergabe passt zum königlichen und richterlichen Zusammenhang.
- source_word: כָּל רִשְׁעֵי אָרֶץ
  choice: alle Frevler im Land
  rationale: רִשְׁעֵי ist substantivisch gebraucht und bezeichnet schuldige beziehungsweise gottlose Menschen. „Frevler“ bewahrt die moralisch-religiöse Schwere; אָרֶץ wird wegen des königlichen Kontexts als „Land“ verstanden, wobei „Erde“ möglich bleibt.
- source_word: לְהַכְרִית
  choice: um … auszurotten
  rationale: Der Infinitiv kann Zweck oder Ergebnis der zuvor genannten Handlung ausdrücken. „Um … auszurotten“ macht den Zweckzusammenhang deutlich und bewahrt die starke gerichtliche Aussage von כרת im Hifil.
- source_word: מֵעִיר יְהוָה
  choice: aus der Stadt Jahwes
  rationale: Die knappe Genitivverbindung bildet die Zugehörigkeitsbeziehung des Hebräischen natürlich und würdevoll ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Form „Jahwe“ gibt den hebräischen Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: alle, die Unrecht tun
  rationale: Die Formulierung gibt den handelnden Sinn von פֹּעֲלֵי („die … tun“) und den moralischen Gehalt von אָוֶן verständlich und natürlich wieder, ohne ihn auf eine einzelne Art des Unrechts einzuengen.
theological_decisions:
- issue: Bedeutungsumfang von אָרֶץ
  choice: Land
  alternative: Erde
  rationale: Der König spricht von der Beseitigung des Bösen aus seinem Herrschaftsbereich und anschließend ausdrücklich aus der Stadt Jahwes. Daher ist „Land“ im Kontext wahrscheinlicher; die umfassendere Bedeutung „Erde“ bleibt als echte lexikalische Möglichkeit in der Fußnote erhalten.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ bewahrt diese Namensfunktion; die traditionelle Ersetzung durch „der HERR“ und die Form „Jehova“ werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die wiederholende Zeitangabe und der Zweckzusammenhang werden ausdrücklich wiedergegeben; „Frevler“ erhält das starke moralische Gewicht des Ausgangstextes, während „die Unrecht tun“ die abschließende Wendung natürlich und allgemein verständlich formuliert.
