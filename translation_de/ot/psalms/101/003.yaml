  text: לֹֽא אָשִׁ֨ית לְ/נֶ֥גֶד עֵינַ֗/י דְּֽבַר בְּלִ֫יָּ֥עַל עֲשֹֽׂה סֵטִ֥ים שָׂנֵ֑אתִי לֹ֖א יִדְבַּ֣ק בִּֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/003.yaml
  text: I will not set any worthless thing before my eyes[a]; I hate the work of those who turn aside[b]; it will not cling to me.
translation:
  language: de
  text: Ich stelle mir nichts Niederträchtiges vor Augen.[a] Das Tun derer, die vom rechten Weg abweichen, hasse ich;[b] es wird nicht an mir haften.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich stelle mir nichts Wertloses vor Augen.“ Das hebräische Wort kann Wertloses, Verderbliches oder Niederträchtiges bezeichnen; ein Eigenname „Belial“ ist hier wenig wahrscheinlich.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Das Tun der Abtrünnigen“ beziehungsweise „das Handeln der Verkehrten“. Das hebräische Wort bezeichnet Menschen, die abweichen oder sich abwenden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁית
  choice: Ich halte … vor Augen
  rationale: Das Qal-Imperfekt in der verneinten Selbstverpflichtung bezeichnet ein bewusstes Vorsetzen bzw. Vor-Augen-Halten. Die deutsche Wendung ist natürlich und bewahrt das konkrete Bild.
- source_word: לְנֶגֶד עֵינַי
  choice: vor Augen
  rationale: Die Wendung bezeichnet das, was absichtlich in das eigene Blickfeld gestellt wird; „vor Augen“ gibt Bild und moralische Absicht knapp wieder.
- source_word: דְּבַר בְּלִיָּעַל
  choice: nichts Niederträchtiges
  rationale: דבר bedeutet hier „Sache/Ding“, während בליעל am ehesten Wertlosigkeit, Verderbtheit oder Niedertracht bezeichnet. Die substantivierte Form klingt im Deutschen natürlich und vermeidet eine unbegründete Deutung als Eigenname.
- source_word: עֲשֹׂה סֵטִים
  choice: das Tun derer, die vom rechten Weg abweichen
  rationale: עֲשֹׂה bezeichnet das Tun oder Handeln; סֵטִים meint Menschen, die abweichen bzw. sich abwenden. Die Ergänzung „vom rechten Weg“ macht das im hebräischen Bild vorausgesetzte moralische Abweichen im Deutschen verständlich, ohne „Abtrünnige“ als engere Deutung festzulegen.
- source_word: שָׂנֵאתִי
  choice: hasse ich
  rationale: Das Perfekt drückt hier eine feste, bleibende Haltung aus. Das deutsche Präsens vermittelt diesen entschiedenen Grundsatz angemessen.
- source_word: לֹא יִדְבַּק בִּי
  choice: es soll nicht an mir haften
  rationale: דבק bezeichnet Haften, Kleben oder Sich-Anschließen. „An mir haften“ bewahrt die Metapher; „soll“ passt zur selbstverpflichtenden Sprache des Psalms, wobei auch eine futurische Aussage möglich ist.
theological_decisions:
- issue: Bedeutung von בְּלִיָּעַל
  choice: als Bezeichnung für Niederträchtigkeit bzw. Verderbtheit, nicht als Eigenname
  alternative: „eine Sache Belials“ oder „etwas Wertloses“
  rationale: Die hebräische Konstruktion דְּבַר בְּלִיָּעַל bezeichnet hier am natürlichsten eine niederträchtige oder verderbliche Sache. Eine Personifizierung als „Belial“ wird vom Kontext nicht verlangt und würde eine spätere Vorstellung in den Text eintragen.
- issue: Bezug des Pronomens in לֹא יִדְבַּק בִּי
  choice: Das „es“ bezieht sich offen auf das zuvor genannte Tun bzw. das Niederträchtige.
  alternative: Ausdrückliche Festlegung auf „ihr Tun“ oder auf „nichts Niederträchtiges“
  rationale: Das maskuline Singularverb kann grammatisch an עֲשֹׂה („Tun“) oder gedanklich an דְּבַר („Sache“) anschließen. Das neutrale „es“ erhält diese echte Bezugsoffenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der bildhaften Sprache des Hebräischen. „Niederträchtig“ bewahrt die starke moralische Wertung, ohne den späteren Eigennamen „Belial“ einzuführen. Die Satzstellung hebt wie im poetischen Kontext den entschiedenen persönlichen Vorsatz hervor.
