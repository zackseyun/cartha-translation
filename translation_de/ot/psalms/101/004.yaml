  text: לֵבָ֣ב עִ֭קֵּשׁ יָס֣וּר מִמֶּ֑/נִּי רָ֝֗ע לֹ֣א אֵדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/004.yaml
  text: A crooked heart will depart from me[a]; I will not know evil.
translation:
  language: de
  text: Ein verkehrtes Herz soll von mir weichen; Böses will ich nicht kennen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Mit Bösem will ich nichts zu tun haben.“ Wörtlich steht im Hebräischen: „Böses will ich nicht kennen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵבָב
  choice: Herz
  rationale: Das hebräische Wort bezeichnet den inneren Menschen einschließlich Denken, Wollen und moralischer Ausrichtung. „Herz“ ist im Deutschen transparent und bewahrt das biblische Bild.
- source_word: עִקֵּשׁ
  choice: verkehrt
  rationale: Das Adjektiv bezeichnet etwas moralisch Verdrehtes oder von einem geraden Weg Abweichendes. „Verkehrt“ gibt diese ethische Wertung in natürlichem, würdigem Deutsch wieder.
- source_word: יָסוּר מִמֶּנִּי
  choice: soll von mir weichen
  rationale: סור bezeichnet das Abweichen oder Sich-Entfernen; מן mit Suffix markiert die Trennung vom Sprecher. Im Zusammenhang der Selbstverpflichtungen des Psalms gibt „soll … weichen“ den willentlichen beziehungsweise entschiedenen Ton des hebräischen Imperfekts wieder.
- source_word: רָע
  choice: Böses
  rationale: Das substantivisch gebrauchte Wort bezeichnet allgemein moralisch Böses. Die Wiedergabe bleibt bewusst ebenso weit wie das Hebräische.
- source_word: לֹא אֵדָע
  choice: will ich nicht kennen
  rationale: ידע bedeutet wörtlich „kennen/wissen“, kann hier jedoch auch persönliche Beteiligung oder Gemeinschaft ausdrücken. Die Hauptfassung bewahrt das hebräische Bild und seine Mehrdeutigkeit; die mögliche idiomatische Bedeutung wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von „kennen“ im Verhältnis zum Bösen
  choice: Die wörtlich-nahe Formulierung „Böses will ich nicht kennen“ bleibt im Haupttext stehen.
  alternative: „Mit Bösem will ich nichts zu tun haben.“
  rationale: Im ethischen Zusammenhang kann „kennen“ eine erfahrungsbezogene oder gemeinschaftliche Beteiligung bezeichnen. Die gewählte Fassung legt diese Deutung nicht ausschließlich fest, sondern bewahrt die Spannung zwischen wörtlicher Aussage und idiomatischem Sinn.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem psalmischem Ton. Die parallele Satzstruktur und die knappe moralische Aussage des Hebräischen bleiben erhalten.
