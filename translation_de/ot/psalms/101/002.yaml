source:
  edition: WLC
  text: אַשְׂכִּ֤ילָה בְּ/דֶ֬רֶךְ תָּמִ֗ים מָ֭תַי תָּב֣וֹא אֵלָ֑/י אֶתְהַלֵּ֥ךְ בְּ/תָם לְ֝בָבִ֗/י בְּ/קֶ֣רֶב בֵּיתִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/002.yaml
  text: I will give attention to the blameless way—when will you come to me? I will walk with integrity of heart within my house[a][b].
translation:
  language: de
  text: Ich will auf dem Weg der Lauterkeit verständig handeln – wann wirst du zu mir kommen? Mit lauterem Herzen will ich in meinem Haus leben.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht: „Wann wirst du zu mir kommen?“ Das Subjekt wird nicht ausdrücklich genannt; vielfach wird dies als Anrede an Gott verstanden.'
    reason: alternative_reading
  - marker: b
    text: 'Der erste Satz kann auch heißen: „Ich will den Weg der Lauterkeit bedenken“ oder „Ich will auf den untadeligen Weg achten“. Statt „leben“ kann wörtlicher „wandeln“ stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׂכִּילָה
  choice: Ich will … achten
  rationale: Das Hifil von שׂכל kann kluges Handeln oder aufmerksames Bedachtsein bezeichnen. Mit בְּדֶרֶךְ תָּמִים gibt „auf den … Weg achten“ die bewusste Ausrichtung auf eine untadelige Lebensführung natürlich wieder.
- source_word: בְּדֶרֶךְ תָּמִים
  choice: auf den untadeligen Weg
  rationale: דֶּרֶךְ bezeichnet im ethischen Zusammenhang den Lebensweg; תָּמִים meint hier Ganzheit und Unbescholtenheit, nicht absolute Sündlosigkeit.
- source_word: מָתַי תָּבוֹא אֵלָי
  choice: wann wirst du zu mir kommen?
  rationale: Das Verb steht in der zweiten Person Maskulin Singular, während das Subjekt unausgesprochen bleibt. Die direkte Wiedergabe bewahrt diese Offenheit.
- source_word: אֶתְהַלֵּךְ
  choice: will ich … leben
  rationale: Das Hitpael von הלך beschreibt hier die Lebensführung. „Leben“ vermittelt diesen idiomatischen Sinn im heutigen Deutsch; die wörtlichere Alternative „wandeln“ wird in der Fußnote genannt.
- source_word: בְּתָם לְבָבִי
  choice: in der Lauterkeit meines Herzens
  rationale: תֹּם bezeichnet Unversehrtheit, Redlichkeit oder Lauterkeit. Zusammen mit „Herz“ hebt die Wendung die innere Aufrichtigkeit hervor.
- source_word: בְּקֶרֶב בֵּיתִי
  choice: in meinem Haus
  rationale: בְּקֶרֶב bedeutet wörtlich „inmitten“ beziehungsweise „im Inneren“. Im Deutschen gibt „in meinem Haus“ den häuslichen Lebensbereich klar und natürlich wieder.
theological_decisions:
- issue: Unausgesprochenes Subjekt von „wann wirst du zu mir kommen?“
  choice: Die Anrede in der zweiten Person bleibt stehen, ohne das Subjekt im Haupttext ausdrücklich als Gott zu bestimmen.
  alternative: Die Anrede ausdrücklich auf Gott beziehen oder die Aussage unpersönlich auf den untadeligen Weg beziehen.
  rationale: Die hebräische Verbform ist zweite Person Maskulin Singular, nennt aber kein Subjekt. Eine Anrede an Gott ist im Kontext naheliegend, soll jedoch nicht als eindeutig in den Haupttext eingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ethische Weg-Metapher bleibt im ersten Halbvers erhalten; beim idiomatischen אֶתְהַלֵּךְ wurde zugunsten natürlicher Verständlichkeit „leben“ gewählt. Gedankenstrich und Fragezeichen bilden den abrupten Wechsel zur direkten Anrede ab.
