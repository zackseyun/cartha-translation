  text: עֵינַ֤/י בְּ/נֶֽאֶמְנֵי אֶרֶץ֮ לָ/שֶׁ֪בֶת עִמָּ֫דִ֥/י הֹ֭לֵךְ בְּ/דֶ֣רֶךְ תָּמִ֑ים ה֝֗וּא יְשָׁרְתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/006.yaml
  text: My eyes are on the faithful of the land[a], that they may dwell with me; he who walks in a blameless way[b], he shall serve me.
translation:
  language: de
  text: Meine Augen richten sich auf die Treuen im Land, damit sie bei mir wohnen[a]. Wer auf untadeligem Weg geht[b], der wird mir dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei mir sitzen“. Das hebräische Verb kann „sitzen“ oder „wohnen“ bedeuten; hier ist wahrscheinlich eine dauerhafte Zugehörigkeit zur Umgebung des Königs gemeint.'
    reason: lexikalische Alternative
  - marker: b
    text: 'Oder: „auf dem Weg der Lauterkeit“. „Untadelig“ bezeichnet hier Integrität und aufrichtige Lebensführung, nicht absolute Sündlosigkeit.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: עֵינַי
  choice: Meine Augen richten sich auf
  rationale: Die konkrete Bildsprache des Hebräischen bleibt erhalten; zugleich gibt die Formulierung die gerichtete Aufmerksamkeit und wohlwollende Hinwendung natürlich auf Deutsch wieder.
- source_word: בְּנֶאֶמְנֵי אֶרֶץ
  choice: die Treuen im Land
  rationale: נֶאֱמָן bezeichnet hier zuverlässige, treue Menschen. אֶרֶץ meint im Zusammenhang wahrscheinlich das Land beziehungsweise Herrschaftsgebiet, nicht die ganze Erde.
- source_word: לָשֶׁבֶת עִמָּדִי
  choice: damit sie bei mir wohnen
  rationale: יָשַׁב kann „sitzen“ oder „wohnen“ bedeuten. „Bei mir wohnen“ vermittelt hier eine dauerhafte Zugehörigkeit zur Umgebung des Königs; die mit ל eingeleitete Form wird als Zweck verstanden.
- source_word: הֹלֵךְ
  choice: Wer … geht
  rationale: Das substantivisch gebrauchte Partizip beschreibt die beständige Lebensführung eines Menschen. Die deutsche Wer-Konstruktion gibt dies klar und sprichwörtlich wieder.
- source_word: בְּדֶרֶךְ תָּמִים
  choice: auf untadeligem Weg
  rationale: דֶּרֶךְ ist ein Bild für die Lebensführung; תָּמִים bezeichnet hier Lauterkeit und Integrität, nicht absolute Sündlosigkeit.
- source_word: הוּא
  choice: der
  rationale: Das rückverweisende „der“ nimmt die beschriebene Person ausdrücklich auf und bewahrt so die Hervorhebung durch das hebräische Pronomen.
- source_word: יְשָׁרְתֵנִי
  choice: soll mir dienen
  rationale: שׁרת bezeichnet persönlichen, oft auch höfischen Dienst. „Dienen“ ist weit genug, um sowohl persönliche Nähe als auch eine amtliche Aufgabe einzuschließen; „soll“ passt zum programmatischen Entschluss des königlichen Sprechers.
theological_decisions:
- issue: Ethische Voraussetzung für die Nähe und den Dienst beim König
  choice: Der Sprecher richtet seine wohlwollende Aufmerksamkeit auf die Treuen im Land und bestimmt den Menschen mit untadeliger Lebensführung zu seinem Dienst.
  alternative: Der Vers kann enger auf die Auswahl königlicher Hofbeamter oder weiter auf die persönlichen Gefährten des Sprechers bezogen werden.
  rationale: „Bei mir wohnen“ deutet auf dauerhafte Nähe, „mir dienen“ zugleich auf eine mögliche offizielle Aufgabe. Die Übersetzung lässt beide Aspekte bestehen und verengt den Vers weder auf private Gemeinschaft noch auf ein formales Amt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache von Augen und Weg bleibt erhalten; die Satzstruktur ist klar und für heutige Leser gut verständlich. Die höfische Dimension wird angedeutet, aber nicht durch spezialisiertes Amtsvokabular festgelegt.
