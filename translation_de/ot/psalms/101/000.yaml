  variant: modern standard German
source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר חֶֽסֶד וּ/מִשְׁפָּ֥ט אָשִׁ֑ירָה לְ/ךָ֖ יְהוָ֣ה אֲזַמֵּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/000.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, Yahweh[b], I will sing praise.
translation:
  language: de
  text: 'Von David[a]. Ein Psalm.


    Von treuer Liebe[b] und Recht will ich singen; dir, Jahwe, will ich lobsingen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „von/für David“. Die Überschrift kann Autorschaft, Widmung oder Zuordnung bezeichnen.
    reason: alternative_reading
  - marker: b
    text: Auch „Barmherzigkeit“. Das hebräische Wort bezeichnet beständige, verlässliche Güte und Liebe.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: treue Liebe
  rationale: Die Wendung gibt die beständige, verlässliche und oft bundbezogene Güte des hebräischen Begriffs natürlicher und umfassender wieder als das engere „Barmherzigkeit“.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: „Recht“ bewahrt sowohl den Gedanken gerechter Ordnung als auch den möglichen Bezug auf richterliches Handeln.
- source_word: אֲזַמֵּרָה
  choice: will ich lobsingen
  rationale: Das Verb bezeichnet musikalisches Singen beziehungsweise Musizieren zum Lob; „lobsingen“ passt zum Gottesbezug und zum poetischen Register.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
theological_decisions:
- issue: Bedeutung der Überschrift לְדָוִד
  choice: Von David
  alternative: Für David / David zugehörig
  rationale: Die knappe traditionelle Wiedergabe lässt im Haupttext offen, ob Autorschaft, Widmung oder Zuordnung gemeint ist; die Fußnote macht diese echte Mehrdeutigkeit ausdrücklich.
- issue: Semantischer Umfang von חֶסֶד וּמִשְׁפָּט
  choice: treue Liebe und Recht
  alternative: Barmherzigkeit und Gericht
  rationale: Die gewählte Fassung wahrt den breiteren ethischen und beziehungsbezogenen Sinn, ohne die engeren möglichen Bedeutungen auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Die Parallelität der beiden Verbzeilen bleibt erhalten; „Jahwe“ gibt den hebräischen Gottesnamen unmittelbar wieder.
