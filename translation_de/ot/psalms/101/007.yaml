id: PSA.101.7
reference: Psalms 101:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹֽא יֵשֵׁ֨ב בְּ/קֶ֥רֶב בֵּיתִ/י֮ עֹשֵׂ֪ה רְמִ֫יָּ֥ה דֹּבֵ֥ר שְׁקָרִ֑ים לֹֽא יִ֝כּ֗וֹן לְ/נֶ֣גֶד עֵינָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/007.yaml
  text: One who practices deceit will not dwell within my house[b][a]; one who speaks lies will not stand before my eyes.
translation:
  language: de
  text: Wer trügerisch handelt[a], wird nicht in meinem Haus wohnen; wer Lügen redet, wird vor meinen Augen nicht bestehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wer Täuschung übt“. Die hebräische Wendung bezeichnet jemanden, dessen Handeln von Täuschung geprägt ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird vor meinen Augen keinen Bestand haben“. Das hebräische Verb kann „feststehen“, „Bestand haben“ oder „bestehen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: wird … wohnen
  rationale: Das Verb kann „sitzen“, „wohnen“ oder „bleiben“ bedeuten. In Verbindung mit „meinem Haus“ gibt „wohnen“ die fortdauernde Zugehörigkeit zum Haushalt natürlich wieder.
- source_word: בְּקֶרֶב בֵּיתִי
  choice: in meinem Haus
  rationale: בְּקֶרֶב bezeichnet das Innere bzw. die Mitte eines Bereichs. Im Deutschen gibt „in meinem Haus“ den räumlichen und sozialen Sinn idiomatisch wieder.
- source_word: עֹשֵׂה רְמִיָּה
  choice: wer trügerisch handelt
  rationale: Das Partizip beschreibt kennzeichnendes oder wiederholtes Verhalten. „Trügerisch handelt“ bewahrt den Handlungsaspekt und klingt im modernen Deutschen natürlicher als die wörtliche Formulierung „Täuschung übt“.
- source_word: דֹּבֵר שְׁקָרִים
  choice: wer Lügen redet
  rationale: Die partizipiale Wendung bezeichnet charakteristisches Reden; der Plural שְׁקָרִים wird direkt mit „Lügen“ wiedergegeben. Zugleich bleibt die Parallelstruktur zum ersten Versglied erhalten.
- source_word: יִכּוֹן
  choice: wird … nicht bestehen
  rationale: Das Nifal von כון kann „feststehen“, „Bestand haben“ oder „bestehen“ bedeuten. „Nicht bestehen“ bewahrt die mögliche Bedeutung des Nicht-etabliert-Seins und passt zugleich zum Stehen in der Gegenwart des Sprechers.
- source_word: לְנֶגֶד עֵינַי
  choice: vor meinen Augen
  rationale: Die Wiedergabe erhält das konkrete hebräische Bild und lässt sowohl die räumliche Gegenwart als auch die prüfende Wahrnehmung des Sprechers anklingen.
theological_decisions:
- issue: Reichweite des Ausschlusses betrügerischer Menschen
  choice: Der Vers wird als persönliche beziehungsweise königliche Verpflichtung des Psalmisten wiedergegeben, die seinen Haushalt und seine Gegenwart betrifft.
  alternative: Die Aussage könnte verallgemeinernd auf Gottes Haus bezogen oder ausschließlich als Bild innerer moralischer Reinheit verstanden werden.
  rationale: Der Psalm formuliert in der ersten Person Vorsätze für gerechte Herrschaft und die Ordnung des eigenen Hauses. Daher bleiben „mein Haus“ und „meine Augen“ unverändert stehen, ohne die Aussage zu spiritualisieren oder über ihren unmittelbaren Zusammenhang hinaus auszuweiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Wendungen „wer … handelt“ und „wer … redet“ geben die beiden hebräischen Partizipialkonstruktionen wieder. Die konkrete Bildsprache „mein Haus“ und „vor meinen Augen“ bleibt erhalten.
