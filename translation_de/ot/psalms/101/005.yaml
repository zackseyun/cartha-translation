source:
  edition: WLC
  text: מלושני בַ/סֵּ֨תֶר רֵעֵ/הוּ֮ אוֹת֪/וֹ אַ֫צְמִ֥ית גְּֽבַהּ עֵ֭ינַיִם וּ/רְחַ֣ב לֵבָ֑ב אֹ֝ת֗/וֹ לֹ֣א אוּכָֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/005.yaml
  text: Whoever secretly slanders his neighbor[a], him I will destroy; one with haughty eyes and a proud heart[b], him I cannot endure.
translation:
  language: de
  text: Wer seinen Nächsten heimlich verleumdet[a], den vernichte ich; wer hochmütige Augen und ein stolzes Herz hat[b], den kann ich nicht ertragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer seinen Nächsten im Verborgenen verleumdet.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „hoch an Augen und weit an Herz“ – hebräische Bilder für einen überheblichen Blick und eine stolze innere Haltung.'
    reason: cultural_note
lexical_decisions:
- source_word: מְלוֹשְׁנִי
  choice: Wer … verleumdet
  rationale: Die substantivisch gebrauchte Form von לשׁן bezeichnet jemanden, der einen anderen durch böswillige Rede herabsetzt. „Wer … verleumdet“ gibt die allgemeine Einzelaussage natürlich und präzise wieder.
- source_word: בַסֵּתֶר
  choice: heimlich
  rationale: Wörtlich „im Verborgenen“; „heimlich“ bewahrt den Gedanken einer verdeckten Handlung in natürlichem Deutsch.
- source_word: רֵעֵהוּ
  choice: seinen Nächsten
  rationale: רֵעַ bezeichnet hier einen Mitmenschen aus dem sozialen Umfeld. „Nächsten“ ist breit genug und schränkt die Aussage nicht auf einen engen Freund ein.
- source_word: אַצְמִית
  choice: bringe ich zum Schweigen
  rationale: Das Hifil von צמת kann je nach Kontext „zum Schweigen bringen“, „vernichten“ oder „ausrotten“ bedeuten. Hier passt „zum Schweigen bringen“ unmittelbar zum Verleumder, ohne die mögliche härtere Gerichtsbedeutung auszuschließen; diese wird in der Fußnote genannt.
- source_word: גְּבַהּ עֵינַיִם
  choice: hochmütige Augen
  rationale: Die konkrete hebräische Metapher für einen arroganten Blick und eine überhebliche Haltung bleibt erhalten.
- source_word: וּרְחַב לֵבָב
  choice: ein stolzes Herz
  rationale: Wörtlich „weit/breit an Herz“; im Kontext bezeichnet die Wendung eine selbstüberhebliche innere Haltung. Eine wörtliche deutsche Wiedergabe wäre missverständlich.
- source_word: לֹא אוּכָל
  choice: kann ich nicht ertragen
  rationale: Wörtlich „ich kann nicht“ mit sinngemäß ergänztem Dulden oder Ertragen. Die Formulierung bewahrt sowohl die Unfähigkeit als auch die entschiedene Weigerung.
theological_decisions:
- issue: Reichweite des Gerichts in der königlich-ethischen Erklärung
  choice: Der Sprecher erklärt, dass er Verleumdung unterbindet und hochmütige Menschen nicht duldet; die genaue Form der Sanktion bleibt offen.
  alternative: Der Sprecher kündigt ausdrücklich die Vernichtung oder Hinrichtung solcher Menschen an.
  rationale: אַצְמִית trägt eine Spannweite von „zum Schweigen bringen“ bis „vernichten/ausrotten“. Die Hauptfassung nutzt den unmittelbaren Bezug zur verleumderischen Rede, während die Fußnote die härtere und in königlichem Kontext mögliche Gerichtsbedeutung offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur bildet den hebräischen Aufbau ab; konkrete Körperbilder werden soweit verständlich bewahrt und andernfalls knapp erläutert.
