  text: נוֹדָ֣ע בִּֽ/יהוּדָ֣ה אֱלֹהִ֑ים בְּ֝/יִשְׂרָאֵ֗ל גָּד֥וֹל שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/001.yaml
  text: God is known in Judah[b][a]; his name is great in Israel.
translation:
  language: de
  text: In Juda ist Gott bekannt[a], in Israel ist sein Name groß.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gott hat sich in Juda zu erkennen gegeben.“ Die hebräische Form kann sowohl einen Zustand („ist bekannt“) als auch, je nach Zusammenhang, ein Geschehen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: „Sein Name“ kann seine offenbarte Identität, sein Ansehen oder seinen Ruhm bezeichnen, nicht nur den ausgesprochenen Namen.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדָע
  choice: ist bekannt
  rationale: Das Nifal von ידע kann hier einen zuständlichen beziehungsweise passiven Sinn ausdrücken. „Ist bekannt“ bewahrt die knappe poetische Aussage; die mögliche ereignishafte Nuance wird in einer Fußnote genannt.
- source_word: בִּיהוּדָה
  choice: in Juda
  rationale: Die Präposition בְּ wird bei der Gebiets- und Volksbezeichnung am natürlichsten mit „in“ wiedergegeben und lässt sowohl den geografischen als auch den gemeinschaftlichen Bezug offen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das morphologisch plurale Wort bezeichnet hier nach Syntax und Kontext im Singular den Gott Israels.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: „In“ entspricht der Präposition בְּ und wahrt den Parallelismus mit „in Juda“.
- source_word: גָּדוֹל
  choice: groß
  rationale: Das Adjektiv bedeutet unmittelbar „groß“. Die prädikative Formulierung bleibt dadurch erhalten.
- source_word: שְׁמוֹ
  choice: sein Name
  rationale: Die wörtliche Wendung trägt die biblische Bedeutung von Gottes offenbarter Identität und seinem Ansehen, ohne sie auf bloßen Ruhm zu verengen.
theological_decisions:
- issue: Bedeutung des göttlichen Namens
  choice: Die konkrete Formulierung „sein Name ist groß“ bleibt erhalten.
  alternative: „Sein Ruhm ist groß“ oder „er wird hoch geehrt“.
  rationale: „Name“ kann Gottes offenbarte Identität, sein Ansehen und seinen Ruhm umfassen. Die wörtliche Wiedergabe bewahrt diese theologische Bedeutungsbreite.
- issue: Zuständliche oder ereignishafte Bedeutung von נוֹדָע
  choice: „Gott ist bekannt“ im Haupttext.
  alternative: „Gott hat sich zu erkennen gegeben“.
  rationale: Die hebräische Form erlaubt einen zuständlichen beziehungsweise passiven Sinn, kann im Zusammenhang aber auch ein Sich-zu-erkennen-Geben anklingen lassen. Diese Spannung wird nicht durch eine eindeutige Paraphrase aufgelöst.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knappem poetischem Parallelismus. Die Wortstellung ist natürlich deutsch und bleibt eng an der hebräischen Struktur.
