  text: Dort zerschmetterte er die Pfeile des Bogens[a], den Schild, das Schwert und den Krieg[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Flammen“ oder „die Blitze des Bogens“. Gemeint sind in lebhafter Bildsprache die Pfeile; ob ausdrücklich Brandpfeile bezeichnet werden, bleibt offen.'
    reason: lexical_alternative
