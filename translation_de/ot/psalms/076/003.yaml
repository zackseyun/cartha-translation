lexical_decisions:
- source_word: שָׁמָּה
  choice: Dort
  rationale: Das Ortsadverb verweist auf den im vorherigen Vers genannten Ort zurück, ohne ihn hier erneut zu benennen.
- source_word: שִׁבַּר
  choice: zerschmetterte
  rationale: Die Piel-Form von שׁבר bezeichnet ein kraftvolles, endgültiges Zerbrechen; „zerschmetterte“ erhält die Eindringlichkeit des poetischen Bildes.
- source_word: רִשְׁפֵי קָשֶׁת
  choice: die flammenden Pfeile des Bogens
  rationale: רשׁף kann Flamme, feurigen Schein oder blitzendes Geschoss bezeichnen. Im Zusammenhang mit dem Bogen sind Pfeile gemeint; „flammend“ bewahrt zugleich die lebhafte Bildsprache des Hebräischen.
- source_word: מָגֵן
  choice: den Schild
  rationale: Die übliche Bezeichnung für die Schutzwaffe; der bestimmte Artikel ist im Deutschen für die kontextuell bestimmte Aufzählung natürlich.
- source_word: וְחֶרֶב
  choice: das Schwert
  rationale: Gibt die konkrete Kriegswaffe knapp und idiomatisch wieder.
- source_word: וּמִלְחָמָה
  choice: und den Krieg
  rationale: מִלְחָמָה kann „Krieg“, „Kampf“ oder „Schlacht“ bedeuten. „Krieg“ bildet nach den einzelnen Waffen den umfassenden, steigernden Abschluss der Reihe.
- source_word: סֶלָה
  choice: Sela
  rationale: Die traditionelle Umschrift bleibt erhalten, da Bedeutung und genaue liturgisch-musikalische Funktion des Ausdrucks unsicher sind.
theological_decisions:
- issue: Subjekt der maskulinen Verbform in der 3. Person Singular
  choice: Das unausgesprochene Subjekt wird mit „er“ wiedergegeben und bezieht sich aus dem Zusammenhang auf Gott.
  alternative: Ein nicht näher bestimmtes männliches Subjekt
  rationale: Im Vers selbst steht kein ausdrückliches Subjekt; der unmittelbare Kontext weist jedoch Gott als Handelnden aus. Die Übersetzung macht keine über den Kontext hinausgehende Aussage.
translation_notes:
  register: Moderne, würdige Psalmsprache mit kräftigem Verb und knapper Aufzählung. Die ungewöhnliche Verbindung „den Krieg zerschmettern“ bewahrt die poetische Steigerung des Hebräischen, statt sie erklärend aufzulösen.
