  text: יִ֭בְצֹר ר֣וּחַ נְגִידִ֑ים נ֝וֹרָ֗א לְ/מַלְכֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/012.yaml
  text: He cuts off the spirit of princes[b][a]; he is feared by the kings of the earth.
translation:
  language: de
  text: Er zügelt den Geist der Fürsten[a]; furchteinflößend ist er für die Könige der Erde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er nimmt den Fürsten den Mut.« »Geist« kann auch »Atem«, »Mut« oder »Gesinnung« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Die Könige der Erde fürchten ihn.«'
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְצֹר
  choice: bricht
  rationale: Das Qal Imperfekt von בצר bezeichnet hier ein entschiedenes Niederhalten oder Brechen. »Bricht« gibt die kraftvolle Demütigung der Herrschenden natürlich wieder, ohne die Aussage eindeutig auf Tötung zu verengen.
- source_word: רוּחַ
  choice: Geist
  rationale: רוּחַ kann Geist, Atem, Mut oder Gemütsart bezeichnen. »Geist« bewahrt im Haupttext die Bedeutungsbreite und lässt sowohl innere Kraft als auch stolzen Herrscherwillen anklingen.
- source_word: נְגִידִים
  choice: Fürsten
  rationale: נְגִידִים bezeichnet Führer oder Herrscher. »Fürsten« passt zum gehobenen poetischen Register und zur Parallelzeile über die Könige der Erde.
- source_word: נוֹרָא
  choice: furchtbar
  rationale: נוֹרָא bezeichnet jemanden, der Furcht einflößt. »Furchtbar« wird hier in seinem würdevollen, biblisch-poetischen Sinn gebraucht und vermeidet das im Deutschen oft wertende »schrecklich«.
- source_word: לְמַלְכֵי אָרֶץ
  choice: für die Könige der Erde
  rationale: Die Präposition ל bezeichnet die Könige als diejenigen, denen Gott furchteinflößend gegenübertritt. »Für die Könige der Erde« bildet diese Relation eng und idiomatisch ab.
theological_decisions:
- issue: Art des göttlichen Handelns an Herrschern
  choice: Gott bricht die innere Kraft beziehungsweise den stolzen Willen irdischer Herrscher.
  alternative: Gott nimmt ihnen den Atem oder das Leben; oder er zügelt ihren Mut beziehungsweise Zorn.
  rationale: Die Verbindung von בצר und רוּחַ ist mehrdeutig. Der Haupttext wahrt die umfassende Aussage von Gottes Macht über Herrscher, während die Fußnote engere Deutungen nennt.
- issue: Bedeutung von נוֹרָא gegenüber den Königen
  choice: Gott ist für die Könige furchteinflößend.
  alternative: Gott wird von den Königen gefürchtet.
  rationale: Die prädikative Form mit ל beschreibt zunächst Gottes furchteinflößende Wirkung auf die Könige; die passive Wiedergabe ist sinngemäß möglich, aber grammatisch weniger unmittelbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. Die bewusst offene Wiedergabe »Geist« erhält die Mehrdeutigkeit des Hebräischen; »furchtbar« ist im Sinn von »Furcht einflößend« zu verstehen.
