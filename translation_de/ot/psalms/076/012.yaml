revisions:
- from: Er bricht den Geist der Fürsten[a]; furchtbar ist er für die Könige der Erde.[b]
  to: Er zügelt den Geist der Fürsten[a]; furchteinflößend ist er für die Könige der Erde.[b]
  rationale: Die Überarbeitung ersetzt zwei im modernen Deutsch missverständliche beziehungsweise weniger idiomatische Ausdrücke. „Zügelt den Geist“ wahrt die lexikalische Offenheit von בצר und רוח, ohne die Aussage auf Lebensentzug, Mut oder Zorn festzulegen. „Furchteinflößend“ entspricht נוֹרָא klar und vermeidet die heutige negative Konnotation von „furchtbar“. Die Fußnoten bewahren die wesentlichen alternativen Nuancen und die mögliche Umschreibung der zweiten Zeile.
