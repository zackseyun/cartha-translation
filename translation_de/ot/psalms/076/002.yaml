lexical_decisions:
- source_word: וַיְהִי
  choice: stand
  rationale: Die Form von היה bezeichnet hier schlicht das örtliche Vorhandensein von Gottes Behausung. Im Deutschen verbindet „stand“ sich natürlich mit „Schutzdach“ und gibt den Sinn idiomatisch wieder.
- source_word: בְשָׁלֵם
  choice: in Salem
  rationale: Der Ortsname שָׁלֵם wird bewahrt und nicht deutend durch „Jerusalem“ ersetzt.
- source_word: סֻכּוֹ
  choice: sein Schutzdach
  rationale: סֻכָּה bezeichnet eine Hütte, einen Schutzbau oder ein schützendes Dach. „Schutzdach“ hält die konkrete Bildhaftigkeit fest, ohne den im Deutschen kultisch-technischen Beiklang von „Stiftshütte“ einzutragen.
- source_word: וּמְעוֹנָתוֹ
  choice: und seine Wohnstätte
  rationale: מְעוֹנָה bezeichnet einen Wohnort oder eine Behausung. „Wohnstätte“ ist würdig, verständlich und bildet den poetischen Parallelismus gut ab.
- source_word: בְצִיּוֹן
  choice: auf dem Zion
  rationale: צִיּוֹן bleibt als Eigenname erhalten. Beim Berg- und Ortsnamen ist „auf dem Zion“ im Deutschen die natürliche Wendung.
theological_decisions:
- issue: Verhältnis von Salem und Zion
  choice: Beide Ortsnamen werden im Haupttext unterschieden wiedergegeben.
  alternative: Salem im Haupttext als Jerusalem wiedergeben.
  rationale: Der hebräische Parallelismus nennt Salem und Zion eigens. Die Übersetzung bewahrt diese poetische und theologische Spannung, während die traditionelle Zuordnung in einer Fußnote erläutert wird.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knapper poetischer Satzgestalt. Die Ortsnamen und der Parallelismus des Hebräischen bleiben erhalten; „Schutzdach“ wahrt die konkrete Bildsprache.
