  text: Seine Hütte war in Salem[a], und seine Wohnstätte in Zion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Salem wird traditionell mit Jerusalem gleichgesetzt; der Vers stellt Salem und Zion als Bezeichnungen für Gottes Wohnort parallel zueinander.
