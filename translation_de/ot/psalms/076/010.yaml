base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/010.yaml
  text: For the wrath of man will praise you[b][a]; with the remnant of wrath you will gird yourself.
translation:
  language: de
  text: Denn der Zorn der Menschen wird dich preisen[a]; mit dem Rest des Zorns wirst du dich umgürten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier ein Singular: »der Zorn des Menschen«; gemeint ist menschlicher Zorn allgemein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Den Rest des Zorns wirst du zurückhalten.« Der hebräische Schluss des Verses ist schwer verständlich; der Haupttext folgt enger der masoretischen Textgestalt und bewahrt ihr Bild.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Gibt die begründende beziehungsweise erklärende Funktion im Zusammenhang natürlich wieder.
- source_word: חֲמַת אָדָם
  choice: der Zorn der Menschen
  rationale: חֵמָה bezeichnet Zorn oder Grimm; אָדָם meint hier die Menschheit allgemein. Die deutsche Formulierung vermeidet die mögliche Verengung auf einen einzelnen Mann.
- source_word: תּוֹדֶךָּ
  choice: wird dich preisen
  rationale: Das Hifil von ידה bedeutet häufig »danken« oder »preisen«; hier bringt selbst menschlicher Zorn letztlich Gottes Ehre zur Geltung.
- source_word: שְׁאֵרִית חֵמֹת
  choice: mit dem Rest des Zorns
  rationale: שְׁאֵרִית bezeichnet das Verbleibende. Der hebräische Plural חֵמֹת wird im Deutschen idiomatisch als abstrakter Singular wiedergegeben.
- source_word: תַּחְגֹּר
  choice: wirst du dich umgürten
  rationale: Bewahrt das Bild des hebräischen Verbs חגר, etwas um sich zu gürten oder anzulegen, ohne die schwierige Aussage vorschnell auszudeuten.
theological_decisions:
- issue: Deutung von שְׁאֵרִית חֵמֹת תַּחְגֹּר
  choice: Gott ist das Subjekt und umgürtet sich bildlich mit dem verbleibenden Zorn.
  alternative: Den Rest des Zorns wirst du zurückhalten.
  rationale: Die masoretisch vokalisierte Verbform ist 2. Person maskulin Singular und legt Gott als Subjekt nahe. Da die Klausel schwierig und das Bild mehrdeutig ist, bleibt die Metapher im Haupttext erhalten; die verbreitete Deutung als Zurückhalten wird in der Fußnote genannt.
translation_notes:
  register: Moderne, gehobene Psalmsprache. »Umgürten« ist bewusst bildhaft und leicht archaisierend, bleibt aber verständlich; die schwierige hebräische Metapher wird nicht geglättet.
