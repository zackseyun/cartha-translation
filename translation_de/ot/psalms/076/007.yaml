base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/007.yaml
  text: You—you are to be feared[a]; and who can stand before you from the time of your anger[b]?
translation:
  language: de
  text: Du — du bist furchtgebietend[a]; und wer kann vor dir bestehen, seit deinem Zorn?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du bist zu fürchten“; das hebräische Wort kann furchterregende Macht und ehrfürchtige Scheu ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „seit der Zeit deines Zorns“ oder „wenn dein Zorn einsetzt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה ... אַתָּה
  choice: Du — du
  rationale: Die Wiederholung des Personalpronomens wird beibehalten, um die hebräische Hervorhebung und den poetischen Nachdruck wiederzugeben, ohne die nicht ausdrücklich genannte Exklusivität „du allein“ einzutragen.
- source_word: נוֹרָא
  choice: furchtgebietend
  rationale: Das Adjektiv bezeichnet jemanden, der Furcht beziehungsweise ehrfürchtiges Erschrecken hervorruft. „Furchtgebietend“ bewahrt sowohl den beschreibenden als auch den reaktionsbezogenen Sinn und klingt im Deutschen würdig, ohne die Bedeutung auf bloßen Schrecken zu verengen.
- source_word: וּמִי
  choice: und wer
  rationale: Die Verbindung aus Konjunktion und Fragewort wird unmittelbar als „und wer“ wiedergegeben. Die rhetorische Frage setzt voraus, dass niemand vor Gott bestehen kann.
- source_word: יַעֲמֹד לְפָנֶיךָ
  choice: kann vor dir bestehen
  rationale: In der rhetorischen Frage drückt das Imperfekt Möglichkeit beziehungsweise Fähigkeit aus. „Vor dir bestehen“ ist die natürliche deutsche Entsprechung und kann sowohl das Standhalten vor Gottes Gegenwart als auch vor seinem Gericht umfassen.
- source_word: מֵאָז
  choice: seit
  rationale: 'מֵאָז bezeichnet einen zeitlichen Ausgangspunkt: „von da an“ beziehungsweise „seit“. „Seit“ erhält diese temporale Nuance knapper und natürlicher als eine erklärende Umschreibung.'
- source_word: אַפֶּךָ
  choice: dein Zorn
  rationale: אַף bedeutet wörtlich „Nase“, bezeichnet hier jedoch idiomatisch den Zorn. „Zorn“ entspricht dem feierlich-poetischen Kontext und der überwältigenden göttlichen Reaktion, ohne die Metonymie wörtlich abzubilden.
theological_decisions:
- issue: Wesen der Gottesfurcht
  choice: „furchtgebietend“ bewahrt die Verbindung von Schrecken und ehrfürchtiger Scheu.
  alternative: „zu fürchten“ oder „schrecklich“
  rationale: Der Kontext spricht von Gottes überwältigender Hoheit und davon, dass niemand angesichts seines Zorns bestehen kann. Die gewählte Formulierung beschränkt die Aussage weder auf bloße Angst noch auf abgeschwächte Bewunderung.
- issue: Zeitlicher Bezug von מֵאָז אַפֶּךָ
  choice: „seit dein Zorn entbrannt ist“
  alternative: „zur Zeit deines Zorns“ oder „wenn du zornig bist“
  rationale: מֵאָז verlangt grundsätzlich einen zeitlichen Ausgangspunkt. Die idiomatische Ergänzung „entbrannt ist“ macht im Deutschen verständlich, dass der Zorn eingesetzt hat, ohne den Gedanken auf einen bloß gleichzeitigen Zustand zu reduzieren.
translation_notes:
  register: Moderne, würdevolle Psalmsprache mit bewahrter pronominaler Wiederholung. „Furchtgebietend“ ist gehoben, aber allgemein verständlich. Das Semikolon erhält die enge poetische Verbindung zwischen Gottes furchterregender Hoheit und der rhetorischen Frage.
