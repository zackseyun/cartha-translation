source:
  edition: WLC
  text: מִ֭/שָּׁמַיִם הִשְׁמַ֣עְתָּ דִּ֑ין אֶ֖רֶץ יָֽרְאָ֣ה וְ/שָׁקָֽטָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/008.yaml
  text: From heaven you made judgment heard[c][b][a]; the earth feared and was quiet.
translation:
  language: de
  text: Vom Himmel[a] her hast du das Urteil hören lassen; die Erde[b] fürchtete sich und wurde still.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Von den Himmeln her“.'
    reason: lexical_alternative
  - marker: b
    text: „Die Erde“ kann auch mit „das Land“ wiedergegeben werden; der Gegensatz von Himmel und Erde spricht hier jedoch für den umfassenderen Sinn.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „kam zur Ruhe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: Vom Himmel her
  rationale: מִן bezeichnet den Ausgangspunkt. שָׁמַיִם steht formal im Plural, wird im Deutschen hier aber idiomatisch als der kollektive Singular „Himmel“ wiedergegeben; „her“ verdeutlicht die Richtung, ohne zusätzliche Bedeutung einzutragen.
- source_word: הִשְׁמַעְתָּ
  choice: hast du … hören lassen
  rationale: 'Der Hifil von שׁמע hat kausative Bedeutung: Gott bewirkt, dass das Urteil gehört wird. Die Formulierung bewahrt diesen Sinn und ist im modernen Deutschen natürlicher als ein gehobenes „ließest“.'
- source_word: דִּין
  choice: das Urteil
  rationale: דִּין bezeichnet hier Gottes richterliche Entscheidung beziehungsweise sein Gerichtshandeln. „Urteil“ wahrt den konkreten forensischen Sinn besser als das breitere „Gerechtigkeit“.
- source_word: אֶרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der Gegensatz zum Himmel legt hier den umfassenden kosmischen Sinn „Erde“ nahe.
- source_word: יָרְאָה
  choice: fürchtete sich
  rationale: ירא kann Furcht oder ehrfürchtiges Erschrecken ausdrücken. Im Zusammenhang mit dem göttlichen Urteil bleibt „fürchtete sich“ bewusst direkt und deutet die Nuance nicht einseitig als Ehrfurcht aus.
- source_word: וְשָׁקָטָה
  choice: und wurde still
  rationale: שׁקט bezeichnet Ruhe, Stille oder das Aufhören von Unruhe. „Wurde still“ gibt die Reaktion auf das hörbar gewordene Urteil prägnant wieder; „kam zur Ruhe“ bleibt als mögliche Nuance erhalten.
theological_decisions:
- issue: Reichweite von אֶרֶץ im Gegensatz zum Himmel
  choice: die Erde als ganze irdische Welt
  alternative: das Land, möglicherweise ein bestimmtes Land oder das irdische Gebiet in engerem Sinn
  rationale: Die Gegenüberstellung von Himmel und Erde bildet einen kosmischen Rahmen. „Die Erde“ bewahrt diesen universalen Horizont, ohne einen engeren nationalen Bezug in den Text einzutragen.
- issue: Art der Reaktion in יָרְאָה
  choice: wirkliche Furcht angesichts des göttlichen Urteils
  alternative: ehrfürchtiges Staunen
  rationale: Das Verb lässt beide Nuancen zu. Der Gerichtskontext stützt „fürchtete sich“, ohne auszuschließen, dass diese Furcht zugleich Ehrfurcht umfasst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzstruktur. Das Perfekt vermeidet die heute gehoben oder altertümlich wirkende Form „ließest“, während die kausative Bedeutung des hebräischen Verbs erhalten bleibt.
