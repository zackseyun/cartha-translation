source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינֹ֑ת מִזְמ֖וֹר לְ/אָסָ֣ף שִֽׁיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/000.yaml
  text: For the choirmaster[a]; with stringed instruments. A psalm of Asaph[b], a song.
translation:
  language: de
  text: Für den musikalischen Leiter; mit Saiteninstrumenten. Ein Psalm Asafs[a], ein Lied.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bezeichnung „Asafs“ kann auf Verfasserschaft, auf die Zugehörigkeit zur asafitischen Sängergruppe oder auf eine Widmung an Asaf hinweisen.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: Die Bezeichnung meint in Psalmüberschriften wahrscheinlich die für die musikalische Aufführung verantwortliche Person. „Musikalischer Leiter“ ist im heutigen Deutsch verständlich und vermeidet die möglicherweise zu enge Festlegung auf einen Chor.
- source_word: בִּנְגִינֹת
  choice: mit Saiteninstrumenten
  rationale: Der Ausdruck bezeichnet hier die musikalische Begleitung durch Saiteninstrumente; „mit“ gibt die Aufführungsanweisung natürlich wieder.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Dies ist die übliche Gattungsbezeichnung und bleibt von der folgenden Bezeichnung „Lied“ unterschieden.
- source_word: לְאָסָף
  choice: Asafs
  rationale: Die knappe deutsche Genitivform bewahrt als Überschrift die mögliche Bedeutung von Verfasserschaft oder Zuordnung, ohne im Haupttext ausdrücklich eine einzige Beziehung festzulegen.
- source_word: שִׁיר
  choice: ein Lied
  rationale: Die zweite Gattungsbezeichnung wird appositionell neben „Psalm“ wiedergegeben und erhält so die doppelte Charakterisierung des Textes.
theological_decisions:
- issue: Bedeutung der Zuordnung לְאָסָף
  choice: „Asafs“ mit erläuternder Fußnote
  alternative: „für Asaf“ oder „von Asaf“
  rationale: Das hebräische לְ kann in Psalmüberschriften Verfasserschaft, Zugehörigkeit, Verbindung mit einer Sängergruppe oder Widmung anzeigen. Die Übersetzung soll diese sachliche Unbestimmtheit nicht dogmatisch oder historisch verengen.
translation_notes:
  register: Moderne, würdevolle Überschriftensprache. Das Semikolon trennt zwei zusammengehörige, aber eigenständige Aufführungsangaben. „Musikalischer Leiter“ ist gegenüber „Chorleiter“ weniger eng und im gegenwärtigen Standarddeutsch natürlich.
