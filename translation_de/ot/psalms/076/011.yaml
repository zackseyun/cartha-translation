id: PSA.76.11
reference: Psalms 76:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: נִֽדֲר֣וּ וְ/שַׁלְּמוּ֮ לַ/יהוָ֪ה אֱֽלֹהֵ֫י/כֶ֥ם כָּל סְבִיבָ֑י/ו יוֹבִ֥ילוּ שַׁ֝֗י לַ/מּוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/011.yaml
  text: Make vows to Yahweh your God and fulfill them[b][a]; let all around him bring tribute to the Fearsome One.
translation:
  language: de
  text: Legt Jahwe, eurem Gott, Gelübde ab und erfüllt sie! Alle rings um ihn sollen dem Furchtgebietenden[a] Tribut[b] bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem, den man fürchten muss“ oder „dem Ehrfurchtgebietenden“. Die hebräische Bezeichnung betont, dass Gott Furcht und Ehrfurcht hervorruft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Gabe“ beziehungsweise „Geschenke“. Das hebräische Wort bezeichnet eine Gabe für einen geehrten Höhergestellten; „Tribut“ hebt den ehrerbietigen und möglicherweise politischen Beiklang hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדֲרוּ
  choice: Legt … Gelübde ab
  rationale: Der pluralische Imperativ von נדר fordert dazu auf, Gelübde zu machen. „Gelübde ablegen“ ist dafür im modernen Deutschen die natürliche, zugleich würdevolle Wendung.
- source_word: וְשַׁלְּמוּ
  choice: und erfüllt sie
  rationale: שלם bezeichnet hier das Einlösen beziehungsweise Erfüllen der zuvor genannten Gelübde. Das Pronomen macht den im Hebräischen vorausgesetzten Bezug im Deutschen ausdrücklich.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: Jahwe, eurem Gott
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; אֱלֹהֵיכֶם steht dazu erläuternd als „eurem Gott“.
- source_word: כָּל סְבִיבָיו
  choice: Alle rings um ihn
  rationale: Die Formulierung lässt offen, ob insbesondere umliegende Völker, Herrscher oder allgemein alle in seiner Umgebung gemeint sind, und bewahrt so die Weite des Hebräischen.
- source_word: יוֹבִילוּ
  choice: sollen … bringen
  rationale: Das Hifil von יבל bedeutet hier, eine Gabe herbeizubringen. Die deutsche Soll-Konstruktion gibt den auffordernden Sinn im Zusammenhang natürlich wieder.
- source_word: שַׁי
  choice: Tribut
  rationale: שַׁי bezeichnet eine Gabe an einen Höhergestellten. „Tribut“ bringt den ehrerbietigen und möglicherweise königlichen oder politischen Beiklang zur Geltung.
- source_word: לַמּוֹרָא
  choice: dem Furchtgebietenden
  rationale: מוֹרָא trägt die Bedeutungen Furcht, Schrecken und Ehrfurcht. Als Bezeichnung Gottes wahrt „der Furchtgebietende“ sowohl seine erschreckende Majestät als auch den ehrfürchtigen Ton.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von לַמּוֹרָא als Gottesbezeichnung
  choice: dem Furchtgebietenden
  alternative: dem, den man fürchten muss; dem Ehrfurchtgebietenden
  rationale: Die gewählte Formulierung erhält die Spannung zwischen Schrecken und Ehrfurcht und schwächt Gottes überwältigende Majestät nicht zu bloßer Bewunderung ab.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit poetisch-würdevollem Ton. Die knappe Parallelstruktur des hebräischen Verses bleibt erhalten; die mehrdeutigen Bezüge bei den Umstehenden und bei der Gottesbezeichnung werden nicht konfessionell vereindeutigt.
