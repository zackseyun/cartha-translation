  text: מִ֭/גַּעֲרָ֣תְ/ךָ אֱלֹהֵ֣י יַעֲקֹ֑ב נִ֝רְדָּ֗ם וְ/רֶ֣כֶב וָ/סֽוּס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/006.yaml
  text: At your rebuke[a], O God of Jacob[b], both chariot and horse were cast into a deep sleep.
translation:
  language: de
  text: Vor deinem Schelten[a], du Gott Jakobs, sanken Wagen und Pferd in tiefen Schlaf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Durch dein Schelten“ oder „Auf dein Schelten hin“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich nennt der hebräische Text „Wagen und Pferd“. Das Wortpaar steht poetisch für militärische Macht; möglicherweise sind die zugehörigen Kämpfer mitgemeint.
    reason: cultural_note
lexical_decisions:
- source_word: מִגַּעֲרָתְךָ
  choice: Von deinem Schelten
  rationale: Die Präposition מִן kann hier Ursprung oder Ursache bezeichnen. „Von deinem Schelten“ bleibt nahe am Hebräischen und gibt Gottes machtvolles, unmittelbar wirksames Zurechtweisen in würdigem Deutsch wieder.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: du Gott Jakobs
  rationale: Die Konstruktverbindung ist als Gottesbezeichnung zu verstehen; „du“ macht die im poetischen Zusammenhang naheliegende direkte Anrede natürlich sichtbar.
- source_word: נִרְדָּם
  choice: sanken … in tiefen Schlaf
  rationale: Das Nifal von רדם bezeichnet tiefen Schlaf oder Erstarrung. Die Formulierung wahrt das Schlafbild und vermittelt zugleich das plötzliche Wehrloswerden, ohne ausdrücklich Tod festzulegen.
- source_word: וְרֶכֶב וָסוּס
  choice: Wagen und Pferd
  rationale: Der hebräische Text nennt den Streitwagen und das Pferd als zusammengehörige Elemente militärischer Macht. Die Wiedergabe vermeidet die interpretierende Ersetzung des Wagens durch seinen Fahrer.
theological_decisions:
- issue: Art der geschilderten Niederlage
  choice: Gottes Schelten lässt die feindliche Kriegsmacht in tiefen Schlaf sinken und macht sie damit völlig wehrlos.
  alternative: Das Bild bezeichnet ausdrücklich den Tod oder lediglich den buchstäblichen Schlaf von Tieren und Menschen.
  rationale: Das hebräische Schlafbild kann im Siegeskontext Erstarrung, Ausschaltung oder Tod anklingen lassen, legt aber keine dieser Ausdeutungen allein ausdrücklich fest. Die Übersetzung bewahrt diese poetische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Satzbau. „Schelten“ ist bewusst gehobener als „Zurechtweisung“, bleibt aber verständlich und entspricht der kraftvollen göttlichen גערה. Das Singularpaar „Wagen und Pferd“ bewahrt die kollektive Bildsprache des Hebräischen.
