  text: אֶשְׁתּוֹלְל֨וּ אַבִּ֣ירֵי לֵ֭ב נָמ֣וּ שְׁנָתָ֑/ם וְ/לֹא מָצְא֖וּ כָל אַנְשֵׁי חַ֣יִל יְדֵי/הֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/005.yaml
  text: The stouthearted were plundered; they slept their sleep[a], and none of the men of valor could find their hands.
translation:
  language: de
  text: 'Die Mutigen wurden ausgeplündert;

    sie schliefen ihren Schlaf[a].

    Keiner der tapferen Krieger

    fand seine Hände[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Zusammenhang lässt an den Todesschlaf denken; wörtlich steht jedoch nur: »Sie schliefen ihren Schlaf.«'
    reason: Mehrdeutigkeit des poetischen Bildes
  - marker: b
    text: 'Das heißt: Keiner konnte seine Hände gebrauchen; sie waren völlig machtlos.'
    reason: Erläuterung einer hebräischen Redewendung
lexical_decisions:
- source_word: אֶשְׁתּוֹלְלוּ
  choice: wurden ausgeplündert
  rationale: Die passive/reflexive Form der Wurzel שלל bezeichnet hier, dass die zuvor Mächtigen selbst zur Beute gemacht und ausgeplündert wurden. Die Formulierung bewahrt den militärischen Zusammenhang.
- source_word: אַבִּירֵי לֵב
  choice: die Beherzten
  rationale: Wörtlich etwa »die an Herz Mächtigen«. »Die Beherzten« bezeichnet mutige, entschlossene Männer und bewahrt den Bezug auf das Herz in einer natürlichen deutschen Wendung.
- source_word: נָמוּ שְׁנָתָם
  choice: sie schliefen ihren Schlaf
  rationale: Die bewusst beibehaltene figura etymologica gibt die eindringliche Bildsprache des Hebräischen wieder, ohne den Schlaf ausdrücklich als Tod zu deuten.
- source_word: אַנְשֵׁי חַיִל
  choice: die tapferen Krieger
  rationale: Der Ausdruck bezeichnet tüchtige, kampfstarke oder tapfere Männer. Im militärischen Kontext ist »tapfere Krieger« natürlich und präzise.
- source_word: וְלֹא מָצְאוּ ... יְדֵיהֶם
  choice: Keiner ... fand seine Hände
  rationale: Die wörtliche Wiedergabe erhält das markante hebräische Bild. Gemeint sein kann, dass die Krieger ihre Hände nicht mehr einsetzen konnten und völlig handlungsunfähig waren.
theological_decisions:
- issue: Bedeutung des Schlafes
  choice: Das Bild »sie schliefen ihren Schlaf« bleibt im Haupttext unaufgelöst.
  alternative: »Sie schliefen den Todesschlaf«
  rationale: Der Zusammenhang legt Tod oder endgültige Niederlage nahe, doch das Hebräische nennt den Tod nicht ausdrücklich. Die Übersetzung bewahrt diese poetische Spannung.
translation_notes:
  register: Poetisch-gehobene, aber allgemein verständliche Sprache. Der Parallelismus und die konkreten hebräischen Bilder bleiben erhalten; erläuternde Fußnoten verhindern, dass ihre wahrscheinliche Bedeutung verloren geht.
