source:
  edition: WLC
  text: נָ֭אוֹר אַתָּ֥ה אַדִּ֗יר מֵֽ/הַרְרֵי טָֽרֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/004.yaml
  text: You are radiant[a], more majestic than the mountains of prey.
translation:
  language: de
  text: Strahlend bist du, herrlicher als die Berge der Beute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Strahlend bist du, herrlicher als die Berge des Raubguts.“ Das hebräische Wort kann „Beute“ und in übertragener Bedeutung „Raubgut“ oder „Plündergut“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוֹר
  choice: strahlend
  rationale: Das Wort bezeichnet leuchtenden Glanz. „Strahlend“ gibt dieses Bild natürlich und würdevoll wieder, ohne anzudeuten, dass das Licht nur empfangen sei.
- source_word: אַתָּה
  choice: bist du
  rationale: Die hebräische Nominalklausel enthält keine ausdrückliche Kopula; im Deutschen wird sie für einen natürlichen Satzbau mit „bist“ ergänzt.
- source_word: אַדִּיר
  choice: herrlicher
  rationale: Das Adjektiv kann Majestät, Hoheit und Macht ausdrücken. Mit dem folgenden מִן liegt eine Steigerung nahe. „Herrlicher“ bewahrt den poetischen Klang und verengt die Aussage nicht auf Macht allein.
- source_word: מֵהַרְרֵי
  choice: als die Berge der
  rationale: 'Das Präfix מִן wird hier angesichts von אַדִּיר am natürlichsten vergleichend verstanden: „herrlicher als“. Die Genitivverbindung „Berge der“ bildet den Status constructus ab.'
- source_word: טָרֶף
  choice: Beute
  rationale: Das Substantiv bezeichnet zunächst gerissene Beute und kann erweitert auch Raubgut oder Plündergut meinen. „Beute“ erhält das kräftige poetische Bild und lässt die Bedeutungsweite teilweise offen.
theological_decisions:
- issue: Sinn der Wendung מֵהַרְרֵי טָרֶף
  choice: 'Vergleich: Gott ist herrlicher als „die Berge der Beute“.'
  alternative: 'Räumlich/separativ: Gott leuchtet von den Bergen der Beute her; oder טָרֶף wird ausdrücklich als Raubgut/Plündergut verstanden.'
  rationale: Die Verbindung von אַדִּיר mit מִן spricht am stärksten für einen Vergleich. Das ungewöhnliche Bild wird nicht auf einen bestimmten geschichtlichen oder theologischen Bezug festgelegt; die mögliche Bedeutung „Raubgut/Plündergut“ wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Moderne, poetische Standardsprache mit würdigem Ton. Die markierte Wortstellung „Strahlend bist du“ bewahrt den Nachdruck des hebräischen Satzanfangs. Das rätselhafte Bild „Berge der Beute“ bleibt bewusst erhalten.
