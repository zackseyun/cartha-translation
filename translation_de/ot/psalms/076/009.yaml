lexical_decisions:
- source_word: בְּקוּם
  choice: als Gott sich … erhob
  rationale: ב mit dem Infinitivus constructus von קום bezeichnet hier den Zeitpunkt. Das Präteritum fügt sich in den unmittelbar vorausgehenden Rückblick des Psalms ein; „sich erheben“ gibt das machtvolle Eingreifen Gottes natürlich wieder.
- source_word: לַמִּשְׁפָּט
  choice: zum Gericht
  rationale: מִשְׁפָּט bezeichnet hier Gottes richterliches Handeln. „Zum Gericht“ wahrt den juristischen Sinn, ohne ihn auf abstrakte Gerechtigkeit oder eine konkrete Gerichtsszene einzuengen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch pluralische Form bezeichnet hier mit singularischem Bezug den Gott Israels und wird daher schlicht mit „Gott“ wiedergegeben.
- source_word: לְהוֹשִׁיעַ
  choice: um … zu retten
  rationale: Der Hifil-Infinitiv von ישׁע drückt Zweck aus und bedeutet „retten“ oder „befreien“. „Retten“ ist direkt, allgemein verständlich und lässt den konkreten Sinn der Befreiung zu.
- source_word: כָּל
  choice: alle
  rationale: כָּל bezeichnet zusammen mit der folgenden Genitivverbindung die Gruppe in ihrer Gesamtheit.
- source_word: עַנְוֵי
  choice: die Demütigen
  rationale: עָנָו kann Demütige, Sanftmütige oder Bedrängte bezeichnen. „Die Demütigen“ bewahrt die ethische und geistliche Dimension, ohne die mögliche soziale Bedrängnis auszuschließen.
- source_word: אֶרֶץ
  choice: der Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Der umfassende Ausdruck „alle Demütigen der Erde“ passt gut zum poetischen Zusammenhang; „des Landes“ bleibt möglich und wird in der Fußnote erhalten.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und Funktion des vermutlich liturgischen oder musikalischen Ausdrucks nicht sicher sind, wird er traditionsgemäß transkribiert.
theological_decisions:
- issue: Bedeutungsbreite von עַנְוֵי
  choice: die Demütigen
  alternative: die Sanftmütigen; die Bedrängten
  rationale: Der Vers beschreibt Gottes richterliches Eingreifen zur Rettung einer niedrigen beziehungsweise demütigen Gruppe. „Die Demütigen“ wahrt sowohl die innere Haltung als auch die soziale Dimension; die engeren Möglichkeiten werden nicht dogmatisch ausgeschlossen.
- issue: Zeitbezug von בְּקוּם
  choice: als Gott sich erhob
  alternative: wenn Gott sich erhebt
  rationale: Die Form selbst kann je nach Zusammenhang zeitlich mit „als“ oder „wenn“ wiedergegeben werden. Der vorangehende Kontext schildert Gottes bereits erfolgtes Eingreifen, weshalb hier die rückblickende Wiedergabe gewählt wird, ohne eine allgemeingültige Aussage über Gottes Gericht auszuschließen.
translation_notes:
  register: Moderne, würdige Psalmsprache mit knapper poetischer Zeilengliederung. „Gericht“, „Demütige“ und „Sela“ wahren den biblisch-poetischen Ton, bleiben aber allgemein verständlich. Der einzige Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Verbindung עַנְוֵי אֶרֶץ.
