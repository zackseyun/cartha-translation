  text: קַוֵּ֗ה אֶל יְה֫וָ֥ה חֲ֭זַק וְ/יַאֲמֵ֣ץ לִבֶּ֑/ךָ וְ֝/קַוֵּ֗ה אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/014.yaml
  text: Wait for Yahweh[a]; be strong, and let your heart take courage; yes[c][b], wait for Yahweh.
translation:
  language: de
  text: Warte auf Jahwe[a]! Sei stark, und dein Herz fasse Mut[b]! Und warte auf Jahwe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Auf Jahwe warten“ kann auch mit „auf Jahwe hoffen“ wiedergegeben werden; gemeint ist ein erwartungsvolles, vertrauensvolles Warten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und er wird dein Herz stärken“; dabei kann Jahwe als nicht ausdrücklich genanntes Subjekt verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַוֵּה / וְקַוֵּה
  choice: Warte auf / warte auf
  rationale: Das Piel des Verbs קוה bezeichnet erwartungsvolles Warten und schließt vertrauensvolle Hoffnung ein. „Warte auf“ bewahrt den zeitlichen Aspekt und bleibt in modernem Deutsch natürlich; die Wiederholung am Versende wird beibehalten.
- source_word: אֶל
  choice: auf
  rationale: In Verbindung mit קוה bezeichnet אֶל die Person, auf die sich das erwartungsvolle Warten richtet. Die idiomatische deutsche Verbindung lautet „auf jemanden warten“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: חֲזַק
  choice: Sei stark
  rationale: Der Imperativ wird direkt wiedergegeben, ohne näher festzulegen, ob körperliche, innere oder geistliche Stärke gemeint ist.
- source_word: וְיַאֲמֵץ לִבֶּךָ
  choice: und dein Herz fasse Mut
  rationale: Im Zusammenhang der Aufforderungen wird die Verbform exhortativ verstanden. „Dein Herz fasse Mut“ bewahrt das ausdrücklich genannte Herz und klingt würdig sowie verständlich. Die grammatisch mögliche Lesart mit Jahwe als implizitem Subjekt wird in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; seine Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen statt ihn durch einen Titel zu ersetzen.
- issue: Syntaktische Funktion von וְיַאֲמֵץ
  choice: 'Exhortativ: „dein Herz fasse Mut“'
  alternative: 'Prädiktiv beziehungsweise mit implizitem göttlichem Subjekt: „er wird dein Herz stärken“'
  rationale: Die umgebenden Imperative sprechen für eine fortgesetzte Aufforderung. Da die Form jedoch auch als Aussage über Jahwes stärkendes Handeln verstanden werden kann, bleibt diese theologisch bedeutsame Spannung in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, klares und zugleich poetisch-würdiges Standarddeutsch. Die kurzen Aufforderungen und die abschließende Wiederholung bilden die eindringliche Struktur des hebräischen Verses nach.
