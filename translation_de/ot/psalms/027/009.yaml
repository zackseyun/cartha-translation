  text: אַל תַּסְתֵּ֬ר פָּנֶ֨י/ךָ מִמֶּ/נִּי֮ אַֽל תַּט בְּ/אַ֗ף עַ֫בְדֶּ֥/ךָ עֶזְרָתִ֥/י הָיִ֑יתָ אַֽל תִּטְּשֵׁ֥/נִי וְ/אַל תַּֽ֝עַזְבֵ֗/נִי אֱלֹהֵ֥י יִשְׁעִֽ/י־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/009.yaml
  text: Do not hide your face from me[a]; do not turn your servant away in anger. You have been my help. Do not cast me off, and do not forsake me[c][b], O God of my salvation.
translation:
  language: de
  text: Verbirg dein Angesicht nicht vor mir; weise deinen Diener nicht im Zorn ab.[a] Du bist meine Hilfe gewesen. Verstoß mich nicht und verlass mich nicht, du Gott meines Heils.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wende deinen Diener nicht im Zorn ab.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »du Gott meiner Rettung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתֵּר פָּנֶיךָ מִמֶּנִּי
  choice: Verbirg dein Angesicht nicht vor mir
  rationale: Die konkrete Bildsprache vom Angesicht Gottes bleibt erhalten; „Angesicht“ ist im gehobenen modernen Deutsch verständlich und trägt die poetische Bedeutung von Nähe und Zuwendung.
- source_word: תַּט בְּאַף עַבְדֶּךָ
  choice: weise deinen Diener nicht im Zorn ab
  rationale: נטה bezeichnet grundsätzlich ein Neigen oder Wenden; mit dem Diener als Objekt und בְּאַף gibt „abweisen“ die hier gemeinte zornige Zurückweisung natürlich wieder, ohne die Aussage unnötig festzulegen.
- source_word: עַבְדֶּךָ
  choice: deinen Diener
  rationale: Im Gebetskontext ist dies eine demütige Selbstbezeichnung gegenüber Gott; „Diener“ trifft den Zusammenhang besser als „Sklave“.
- source_word: עֶזְרָתִי הָיִיתָ
  choice: Du bist meine Hilfe gewesen
  rationale: Die prädikative Wendung wird eng am Hebräischen wiedergegeben. Das Perfekt bezeichnet Gottes bereits erfahrene Hilfe mit Bedeutung für die gegenwärtige Bitte.
- source_word: תִּטְּשֵׁנִי
  choice: Verstoß mich nicht
  rationale: נטש kann verlassen, preisgeben oder verstoßen bedeuten. „Verstoßen“ bewahrt die starke relationale Zurückweisung und unterscheidet sich vom folgenden עזב.
- source_word: תַּעַזְבֵנִי
  choice: verlass mich nicht
  rationale: „Verlassen“ ist eine natürliche und gewichtige Wiedergabe von עזב und wahrt den Unterschied zum vorangehenden „verstoßen“.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: du Gott meines Heils
  rationale: Die hebräische Status-constructus-Verbindung bleibt formal und theologisch offen erhalten; „Heil“ kann Rettung und umfassendes Wohlergehen bezeichnen.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Angesicht
  choice: „dein Angesicht“ im Haupttext beibehalten
  alternative: „deine Gegenwart“
  rationale: Der hebräische Text nennt ausdrücklich Gottes Angesicht. Das konkrete Bild vermittelt Gegenwart und Gunst, ohne diese Bedeutungsfülle auf eine abstrakte Deutung zu reduzieren.
- issue: Bedeutung von עבד gegenüber Gott
  choice: „Diener“
  alternative: „Sklave“
  rationale: Hier steht die demütige Hingabe des Betenden im Vordergrund, nicht sein rechtlicher Status; „Diener“ entspricht daher dem Gebetskontext.
- issue: Bedeutungsweite von יֶשַׁע
  choice: „Heil“ im Haupttext
  alternative: „Rettung“
  rationale: „Heil“ bewahrt die traditionelle und umfassende Bedeutungsweite des hebräischen Nomens; die konkretere Bedeutung „Rettung“ wird als Übersetzungsalternative kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch mit bewahrter poetischer Bildsprache. „Angesicht“ und „Heil“ sind bewusst gehoben, aber allgemein verständlich; veraltete Verbformen und unnötige Archaismen werden vermieden.
