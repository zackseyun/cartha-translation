base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/004.yaml
  text: 'One thing I have asked from Yahweh[a]; this I will seek: that I may dwell in the house of Yahweh all the days of my life[c][b], to behold the beauty of Yahweh and to inquire in his temple.'
translation:
  language: de
  text: 'Eines habe ich von Jahwe[a] erbeten, danach will ich trachten: im Haus Jahwes alle Tage meines Lebens zu wohnen, die Schönheit[b] Jahwes zu schauen und in seinem Tempel zu forschen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „die Lieblichkeit Jahwes“, „die Güte Jahwes“ oder „die Gunst Jahwes“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und in seinem Tempel zu suchen“ oder „nachzusinnen“. Das hebräische Verb ist hier nicht eindeutig und kann auf aufmerksames Fragen, Suchen oder Betrachten im Heiligtum zielen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת שָׁאַלְתִּי
  choice: Eines habe ich … erbeten
  rationale: אַחַת steht substantivisch und hebt den einen, alles bestimmenden Wunsch hervor. Das Perfekt bezeichnet eine bereits ausgesprochene Bitte mit fortdauernder Bedeutung.
- source_word: מֵאֵת יְהוָה
  choice: von Jahwe
  rationale: מֵאֵת bezeichnet hier die Person, von der etwas erbeten wird. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אוֹתָהּ אֲבַקֵּשׁ
  choice: danach trachte ich
  rationale: Das Pronomen greift die eine Bitte nachdrücklich wieder auf. „Danach trachte ich“ gibt die anhaltende, zielgerichtete Suche des Imperfekts in natürlichem Deutsch wieder.
- source_word: שִׁבְתִּי בְּבֵית יְהוָה
  choice: im Haus Jahwes zu wohnen
  rationale: Der Infinitiv mit Suffix benennt den Inhalt der Bitte. „Wohnen“ vermittelt das dauerhafte Bleiben besser als das wörtlich mögliche „Sitzen“.
- source_word: כָּל יְמֵי חַיַּי
  choice: alle Tage meines Lebens
  rationale: Die formnahe Wendung bewahrt den zeitlichen Nachdruck des Hebräischen und ist im Deutschen verständlich.
- source_word: לַחֲזוֹת בְּנֹעַם יְהוָה
  choice: um die Schönheit Jahwes zu schauen
  rationale: חזה bezeichnet ein betrachtendes Schauen; נֹעַם umfasst Schönheit, Anmut, Lieblichkeit und Wohltat. „Schönheit“ passt zum kontemplativen Heiligtumskontext, ohne die Bedeutungsbreite vollständig festzulegen.
- source_word: וּלְבַקֵּר בְּהֵיכָלוֹ
  choice: und in seinem Tempel nach ihm zu fragen
  rationale: בקר ist an dieser Stelle semantisch schwierig. Im Heiligtumskontext liegt ein aufmerksames Suchen, Fragen oder Nachsinnen nahe. „Nach ihm zu fragen“ bewahrt den Suchcharakter und macht das implizite Ziel verständlich; Alternativen werden in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von נֹעַם יהוה
  choice: die Schönheit Jahwes
  alternative: die Lieblichkeit / Güte / Gunst Jahwes
  rationale: Das Wort bezeichnet das Angenehme, Liebliche oder Wohltuende. „Schönheit“ entspricht dem Zusammenhang des betrachtenden Schauens; eine Fußnote wahrt die weiteren möglichen Nuancen.
- issue: Deutung von ולבקר בהיכלו
  choice: in seinem Tempel nach ihm zu fragen
  alternative: in seinem Tempel zu forschen / nachzusinnen
  rationale: Die seltene Konstruktion lässt mehrere eng verwandte Deutungen zu. Die Hauptfassung legt keine besondere kultische oder konfessionelle Praxis fest; die Alternativen bleiben ausdrücklich sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Rhythmus. „Haus Jahwes“ und „Tempel“ bewahren die Bildwelt des Heiligtums; „schauen“ trägt den kontemplativen Ton. Die drei Fußnotenmarker stehen jeweils unmittelbar an der einschlägigen Stelle.
