base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/008.yaml
  text: On your behalf my heart says[a], “Seek my face.” Your face, Yahweh[c][b], I seek.
translation:
  language: de
  text: 'Mein Herz sagt zu dir[a]: »Sucht mein Angesicht!« Dein Angesicht[b], Jahwe, suche ich[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Anfang ist schwierig und mehrdeutig. Die Übersetzung folgt möglichst nahe der Wortstellung. Möglich sind auch: »Zu dir sagt mein Herz« oder, bei anderer Zuordnung: »Mein Herz sagt von dir: ›Sucht sein Angesicht!‹«'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Deine Gegenwart«. Das hebräische Wort für »Angesicht« kann die persönliche Gegenwart bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »will ich suchen«. Die hebräische Verbform kann gegenwärtige Entschlossenheit oder zukünftige Absicht ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: Für dich
  rationale: Die Präposition mit Suffix steht in einer syntaktisch schwierigen Eröffnung. »Für dich« bewahrt den möglichen Bezug auf Jahwe und lässt erkennen, dass das Herz gleichsam von ihm her oder in seinem Sinn spricht, ohne den hebräischen Text zu ändern.
- source_word: אָמַר לִבִּי
  choice: sagt mein Herz
  rationale: Obwohl אָמַר formal eine abgeschlossene Verbform ist, kann sie in poetischer Rede eine gegenwärtige innere Aussage wiedergeben. Das Präsens klingt im Deutschen natürlich und passt zur unmittelbar folgenden Antwort.
- source_word: בַּקְּשׁוּ
  choice: Sucht
  rationale: Der Pluralimperativ wird knapp und direkt wiedergegeben. Der unerwartete Plural bleibt erhalten.
- source_word: פָנָי / פָּנֶיךָ
  choice: mein Angesicht / dein Angesicht
  rationale: »Angesicht« erhält die wörtliche Wiederholung und die personale Bildsprache. Die mögliche Bedeutung »Gegenwart« wird in einer Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname in der im Deutschen gebräuchlichen Form »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲבַקֵּשׁ
  choice: suche ich
  rationale: Die Verbform kann gegenwärtige Entschlossenheit oder zukünftige Absicht ausdrücken. Das Präsens bildet die unmittelbare Antwort des Beters ab; die Zukunftsnuance bleibt in einer Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. »Jahwe« bewahrt diesen als Namen, während »der HERR« ihn durch einen Titel ersetzt.
- issue: Deutung der schwierigen Eröffnung לְךָ אָמַר לִבִּי
  choice: 'Für dich sagt mein Herz: »Sucht mein Angesicht!«'
  alternative: 'Zu dir sagt mein Herz: »Sucht mein Angesicht!« / Mein Herz sagt von dir: »Sucht sein Angesicht!«'
  rationale: Die gewählte Fassung wahrt den masoretischen Konsonantentext und versteht den Ruf als Gottes Aufforderung, die im Herzen des Beters laut wird. Da die Syntax mehrere Zuordnungen zulässt, werden andere mögliche Lesarten ausdrücklich offengehalten.
translation_notes:
  register: Moderne, würdige Standardsprache mit dichterischer Wortstellung. »Angesicht« ist gehobener als »Gesicht«, bewahrt hier aber die biblisch-poetische Bildsprache und die bewusste Wiederholung des hebräischen Wortes.
