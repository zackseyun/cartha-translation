base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/011.yaml
  text: Teach me your way[a], O Yahweh, and lead me on a level path because of my enemies.
translation:
  language: de
  text: Lehre mich, Jahwe, deinen Weg, und führe mich auf ebenem Pfad wegen meiner Feinde[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen derer, die mir feindselig auflauern“. Das hebräische Wort bezeichnet Gegner und kann Menschen meinen, die den Beter feindselig beobachten oder auf eine Gelegenheit warten, gegen ihn vorzugehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: Lehre mich
  rationale: Der Hifil von ירה bedeutet hier „lehren, unterweisen“. „Lehre mich“ bewahrt den pädagogischen Sinn und klingt als Gebet natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des göttlichen Eigennamens wahrt, dass im Hebräischen ein Name und nicht der Titel „Herr“ steht.
- source_word: דַּרְכֶּךָ
  choice: deinen Weg
  rationale: דֶּרֶךְ bezeichnet einen Weg und kann zugleich die Lebensführung meinen. „Deinen Weg“ erhält beide Bedeutungsebenen.
- source_word: וּנְחֵנִי
  choice: und führe mich
  rationale: נחה bedeutet „führen, leiten“. „Führe mich“ hält das Wegbild anschaulich aufrecht.
- source_word: בְּאֹרַח מִישׁוֹר
  choice: auf ebenem Pfad
  rationale: אֹרַח ist ein Pfad oder Weg; מִישׁוֹר bezeichnet zunächst ebenes Gelände und kann übertragen Geradheit oder Rechtschaffenheit ausdrücken. Die konkrete Bildsprache bleibt so erhalten.
- source_word: לְמַעַן
  choice: wegen
  rationale: Die Präposition gibt hier den Anlass für die Bitte angesichts feindlicher Gegner beziehungsweise Beobachter an. „Wegen“ ist knapp und idiomatisch.
- source_word: שׁוֹרְרָי
  choice: meiner Feinde
  rationale: Das Wort bezeichnet feindliche Widersacher und kann die Nuance von Gegnern tragen, die den Beter beobachten oder ihm auflauern. Die klare Hauptbedeutung steht im Text, die engere Nuance in der Fußnote.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: „Jahwe“ gibt den persönlichen Gottesnamen in einer im Deutschen gebräuchlichen Form wieder, statt ihn durch einen Titel zu ersetzen. Die genaue antike Aussprache lässt sich nicht mit letzter Sicherheit bestimmen.
- issue: Bildliche und ethische Bedeutung von מִישׁוֹר
  choice: eben
  alternative: gerade; rechtschaffen
  rationale: „Eben“ bewahrt das konkrete Bild eines sicheren, hindernisfreien Pfades, ohne die mögliche ethische Nuance von Geradheit auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Die Wegmetaphorik des Hebräischen wird konsequent beibehalten; der Fußnotenmarker steht bei dem Ausdruck, auf den sich die lexikalische Alternative tatsächlich bezieht.
