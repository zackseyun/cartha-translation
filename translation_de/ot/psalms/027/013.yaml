translation:
  language: de
  text: Wenn ich nicht geglaubt hätte, die Güte Jahwes im Land der Lebenden zu sehen …[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Satz ist unvollständig: Wörtlich beginnt er mit „Wenn ich nicht geglaubt hätte …“, doch der erwartete Folgesatz bleibt unausgesprochen.'
    reason: alternative_reading
  - marker: b
    text: 'Sinngemäß lässt sich ergänzen: „Dann hätte ich den Mut verloren“ oder „Dann wäre ich verzweifelt.“'
