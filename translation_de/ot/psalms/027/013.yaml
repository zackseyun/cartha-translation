lexical_decisions:
- source_word: לוּלֵא
  choice: Wenn … nicht
  rationale: Die Partikel leitet eine irreale Bedingung ein. Da der hebräische Folgesatz unausgesprochen bleibt, wahrt die offene deutsche Konstruktion die auffällige Ellipse.
- source_word: הֶאֱמַנְתִּי
  choice: ich geglaubt hätte
  rationale: Der Hifil von אמן bezeichnet hier Glauben beziehungsweise festes Vertrauen. Der Konjunktiv II der Vorvergangenheit entspricht der irrealen Bedingung im Deutschen.
- source_word: לִרְאוֹת
  choice: zu sehen
  rationale: Der Infinitiv gibt das Hebräische unmittelbar wieder und bezeichnet den erwarteten Inhalt des Glaubens.
- source_word: בְּטוּב
  choice: die Güte
  rationale: טוּב kann Güte, Wohlergehen oder gute Gaben meinen. „Güte“ erhält die umfassende Bedeutung und verengt sie nicht auf materiellen Segen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּאֶרֶץ חַיִּים
  choice: im Land der Lebenden
  rationale: Die feste hebräische Wendung bezeichnet den Lebensbereich der Lebenden im Gegensatz zum Tod oder Totenreich.
- source_word: '[unausgesprochener Folgesatz nach לוּלֵא]'
  choice: nicht im Haupttext ergänzt
  rationale: Der überlieferte hebräische Wortlaut bricht nach dem Bedingungssatz ab. Auslassungspunkte und Ausrufezeichen lassen diese rhetorische Ellipse im Deutschen erkennbar, ohne eine bestimmte Ergänzung in den Text einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt diese Form, statt sie durch einen Titel zu ersetzen.
- issue: Unausgesprochener Folgesatz der irrealen Bedingung
  choice: Die Ellipse im Haupttext bewahren und erläutern
  alternative: „Dann hätte ich den Mut verloren“ beziehungsweise „Dann wäre ich verzweifelt“ ergänzen
  rationale: Der Kontext legt einen drohenden Zusammenbruch nahe, doch der genaue Wortlaut des Folgesatzes steht nicht im Hebräischen. Die offene Form bewahrt sowohl die Spannung als auch die genuine Mehrdeutigkeit; eine geläufige sinngemäße Ergänzung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Infinitivkonstruktion bleibt nah am Hebräischen; Auslassungspunkte und Ausrufezeichen machen den emotionalen, abgebrochenen Satz auch für heutige Leser verständlich.
