  text: אַֽל תִּ֭תְּנֵ/נִי בְּ/נֶ֣פֶשׁ צָרָ֑/י כִּ֥י קָֽמוּ בִ֥/י עֵֽדֵי שֶׁ֝֗קֶר וִ/יפֵ֥חַ חָמָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/012.yaml
  text: Do not give me over to the desire of my adversaries[a], for false witnesses have risen against me[c][b], and they breathe out violence.
translation:
  language: de
  text: Liefere mich nicht dem Verlangen meiner Bedränger aus[a]; denn falsche Zeugen sind gegen mich aufgestanden und stoßen Gewalt aus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Liefere mich nicht dem Willen meiner Bedränger aus.« Das hebräische Wort נֶפֶשׁ bezeichnet hier wahrscheinlich das Verlangen oder den Willen, nicht die »Seele« im engeren Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Formnäher: »und einer, der Gewalt ausstößt«. Die hebräische Form ist singularisch, kann hier aber die falschen Zeugen gemeinsam oder jeden Einzelnen von ihnen kennzeichnen.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: תִּתְּנֵנִי
  choice: Liefere mich … aus
  rationale: נתן mit אַל und Personenobjekt bezeichnet hier das Ausliefern in die Gewalt anderer. Die deutsche Wendung ist natürlich und wahrt den bedrohlichen Zusammenhang.
- source_word: בְּנֶפֶשׁ
  choice: der Gier
  rationale: נֶפֶשׁ bezeichnet in dieser Verbindung nicht eng die »Seele«, sondern Begehren, Verlangen oder Willen. »Gier« bringt das feindselige Verlangen der Bedränger knapp und anschaulich zum Ausdruck.
- source_word: צָרָי
  choice: meiner Bedränger
  rationale: צַר bezeichnet feindliche Widersacher. »Bedränger« passt sowohl zur persönlichen Verfolgung als auch zur gerichtlichen Anklagesituation.
- source_word: קָמוּ בִי
  choice: sind gegen mich aufgestanden
  rationale: קום mit בְּ bei einer Person bedeutet, sich gegen sie zu erheben beziehungsweise gegen sie aufzutreten. Die Wiedergabe erhält Bild und Aspekt des Hebräischen.
- source_word: עֵדֵי שֶׁקֶר
  choice: falsche Zeugen
  rationale: Die Konstruktverbindung bezeichnet Zeugen, die Falsches aussagen. »Falsche Zeugen« ist die geläufige deutsche Entsprechung im rechtlichen Kontext.
- source_word: וִיפֵחַ חָמָס
  choice: die Gewalt schnauben
  rationale: יפח bezeichnet ein heftiges Hauchen, Blasen oder Ausstoßen; חָמָס umfasst Gewalt und gewaltsames Unrecht. »Gewalt schnauben« bewahrt das kräftige Bild, während der Relativsatz die Aussage natürlich auf die zuvor genannten Zeugen bezieht.
theological_decisions:
- issue: Numerus und Bezug von וִיפֵחַ nach dem pluralischen עֵדֵי שֶׁקֶר
  choice: 'Als Beschreibung der falschen Zeugen im Plural wiedergegeben: »die Gewalt schnauben«.'
  alternative: »und einer, der Gewalt schnaubt« beziehungsweise »und ein Zeuge, der Gewalt schnaubt«.
  rationale: Die hebräische Form ist singularisch und kann substantivisch oder kollektiv/distributiv verstanden werden. Der Kontext legt einen engen Bezug zu den falschen Zeugen nahe; die Fußnote hält die formnähere singularische Lesart offen, ohne einen sicher eigenständigen weiteren Gegner einzuführen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. »Gier« und »Gewalt schnauben« erhalten die körperlich-konkrete Bildsprache des Hebräischen; der Satz bleibt zugleich für heutige Leser unmittelbar verständlich.
