  text: שְׁמַע יְהוָ֖ה קוֹלִ֥/י אֶקְרָ֗א וְ/חָנֵּ֥/נִי וַ/עֲנֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/007.yaml
  text: Hear[a], O Yahweh, when I cry aloud[b]; be gracious to me and answer me.
translation:
  language: de
  text: Höre, Jahwe, meine Stimme, wenn ich rufe[a]; sei mir gnädig und antworte mir!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Höre, Jahwe, meine Stimme! Ich rufe.“ Das Hebräische setzt „ich rufe“ ohne ausdrückliches Wort für „wenn“ an den vorausgehenden Satz.'
    reason: syntaktische Alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Höre
  rationale: Der Imperativ richtet die dringende Bitte an Gott, aufmerksam zuzuhören. „Höre“ bewahrt sowohl die knappe hebräische Form als auch den würdigen Gebetston.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: קוֹלִי
  choice: meine Stimme
  rationale: Die konkrete hebräische Wendung „meine Stimme hören“ ist auch im Deutschen verständlich und sollte nicht zu „mich“ verflacht werden.
- source_word: אֶקְרָא
  choice: wenn ich rufe
  rationale: Das Imperfekt bezeichnet hier das Rufen des Beters. Die temporale Verknüpfung ergibt einen natürlichen deutschen Satz; die mögliche parataktische Lesart wird in der Fußnote bewahrt.
- source_word: וְחָנֵּנִי
  choice: sei mir gnädig
  rationale: חנן bittet um gnädige Zuwendung oder Gunst. „Sei mir gnädig“ ist lexikalisch genauer als die mögliche traditionelle Wiedergabe „erbarme dich meiner“.
- source_word: וַעֲנֵנִי
  choice: antworte mir
  rationale: ענה bedeutet in diesem Gebetszusammenhang unmittelbar „antworten“; die deutsche Wendung ist klar und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ erhält seinen Charakter als Eigenname, ohne ihn durch den traditionellen Ersatztitel zu verdecken.
- issue: Bedeutung von חנן
  choice: sei mir gnädig
  alternative: erbarme dich meiner
  rationale: Die gewählte Formulierung hält die Bitte um Gnade beziehungsweise Gunst fest, ohne sie unnötig mit dem Bedeutungsfeld eines anderen hebräischen Erbarmenswortes gleichzusetzen.
translation_notes:
  register: Moderne, würdige Gebetssprache. Die konkrete Wendung „meine Stimme“ bleibt erhalten; der abschließende Ausruf unterstreicht die Dringlichkeit der beiden Bitten.
