  text: וְ/עַתָּ֨ה יָר֪וּם רֹאשִׁ֡/י עַ֤ל אֹֽיְבַ֬/י סְֽבִיבוֹתַ֗/י וְ/אֶזְבְּחָ֣ה בְ֭/אָהֳל/וֹ זִבְחֵ֣י תְרוּעָ֑ה אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/006.yaml
  text: And now my head will be lifted up above my enemies around me[a], and I will offer in his tent sacrifices of joyful shouting; I will sing, yes[b], I will make music to Yahweh.
translation:
  language: de
  text: Und nun wird sich mein Haupt über die Feinde erheben, die mich ringsum umgeben. In seinem Zelt[a] will ich Opfer unter Jubelrufen[b] darbringen; ich will für Jahwe singen und musizieren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Pronomen in »seinem Zelt« bezieht sich im Zusammenhang am ehesten auf Jahwe; rein grammatisch wird der Bezug jedoch nicht ausdrücklich genannt.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Jubelopfer«. Die hebräische Verbindung kann entweder den Charakter der Opfer oder die sie begleitenden Jubelrufe hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Kraft von וְ als auch den zeitlichen Wendepunkt, den עַתָּה bezeichnet.
- source_word: יָרוּם רֹאשִׁי
  choice: wird sich mein Haupt … erheben
  rationale: Gibt das Qal-Imperfekt als erwartete künftige Erhöhung wieder und bewahrt das hebräische Bild des erhobenen Hauptes für Ehre, Zuversicht und Rechtfertigung.
- source_word: עַל אֹיְבַי סְבִיבוֹתַי
  choice: über meine Feinde rings um mich
  rationale: עַל bezeichnet hier die Erhöhung über die Feinde; סְבִיבוֹתַי hält zugleich fest, dass sie den Beter umgeben.
- source_word: וְאֶזְבְּחָה
  choice: will ich … darbringen
  rationale: Die Kohortativform drückt Entschlossenheit aus. Mit dem Objekt ‚Opfer‘ ist ‚darbringen‘ im Deutschen natürlicher als die Wiederholung ‚Opfer opfern‘.
- source_word: בְּאָהֳלוֹ
  choice: in seinem Zelt
  rationale: Gibt das Substantiv אָהֶל transparent wieder und lässt das Heiligtumsbild bestehen; der maskuline Suffixbezug weist im Kontext am ehesten auf Jahwe.
- source_word: זִבְחֵי תְרוּעָה
  choice: Opfer unter Jubelrufen
  rationale: תְרוּעָה bezeichnet einen lauten Ruf oder Jubelruf. Die Formulierung bewahrt den hörbaren, feierlichen Charakter und vermeidet eine zu enge Festlegung der hebräischen Genitivverbindung.
- source_word: אָשִׁירָה וַאֲזַמְּרָה
  choice: ich will singen und … musizieren
  rationale: Beide Kohortative drücken den entschlossenen Lobpreis aus; ‚musizieren‘ unterscheidet זמר von שׁיר und lässt Gesang mit möglicher instrumentaler Begleitung zu.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Der Gottesname יהוה wird als ‚Jahwe‘ wiedergegeben; לְ markiert den Adressaten beziehungsweise den, dem die Musik gilt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. ‚Jahwe‘ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug des Pronomens in בְּאָהֳלוֹ
  choice: sein Zelt = Jahwes Zelt
  alternative: sein Zelt = das Zelt des Beters
  rationale: Opfer und Lobpreis gelten unmittelbar Jahwe; zudem entspricht der Bezug auf Gottes Heiligtum dem Tempel- und Schutzmotiv des Psalms. Da das Pronomen allein den Bezug nicht ausdrücklich nennt, wird die Alternative in einer Fußnote offengehalten.
- issue: Verhältnis von זִבְחֵי und תְרוּעָה
  choice: Opfer, die unter Jubelrufen dargebracht werden
  alternative: Opfer, deren Charakter durch Jubel bestimmt ist
  rationale: Die hebräische Constructusverbindung lässt offen, ob תְרוּעָה die Opfer näher kennzeichnet oder die sie begleitende Akklamation bezeichnet. Der Haupttext bietet eine natürliche Lesart; die Fußnote bewahrt die andere.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das traditionelle biblische Bild vom erhobenen Haupt bleibt erhalten. Die Willensform mit »will ich« bildet die Entschlossenheit der Kohortative natürlich ab; »Zelt« vermeidet das konfessionell oder historisch stärker geprägte »Stiftshütte«.
