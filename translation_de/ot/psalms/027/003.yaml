source:
  edition: WLC
  text: אִם תַּחֲנֶ֬ה עָלַ֨/י מַחֲנֶה֮ לֹֽא יִירָ֪א לִ֫בִּ֥/י אִם תָּק֣וּם עָ֭לַ/י מִלְחָמָ֑ה בְּ֝/זֹ֗את אֲנִ֣י בוֹטֵֽחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/003.yaml
  text: Though an army encamps against me[a], my heart will not fear; though war rises against me[c][b], even then I will trust.
translation:
  language: de
  text: Wenn auch ein Heer gegen mich lagert,[a] fürchtet sich mein Herz nicht; wenn auch Krieg sich gegen mich erhebt, vertraue ich selbst dann.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn ein Heer gegen mich lagert“. Das hebräische אִם kann sowohl bedingend („wenn“) als auch einräumend („wenn auch“, „obwohl“) verstanden werden. Das mit „Heer“ wiedergegebene Wort bedeutet wörtlich auch „Lager“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Darin vertraue ich“; auch: „Darin bin ich zuversichtlich“ oder „Trotzdem bin ich zuversichtlich“. Das Hebräische lässt offen, ob „darin“ auf die bedrohliche Lage oder möglicherweise auf den HERRN im vorausgehenden Zusammenhang verweist.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: wenn auch
  rationale: אִם kann eine Bedingung („wenn“) oder eine Einräumung („wenn auch/obwohl“) einleiten. Im poetischen Zusammenhang bringt „wenn auch“ die standhafte Zuversicht trotz der Bedrohung natürlich zum Ausdruck, ohne die konditionale Färbung ganz aufzugeben.
- source_word: תַּחֲנֶה ... מַחֲנֶה
  choice: ein Heer ... lagert
  rationale: Das Verb חנה bezeichnet das Lagern, während מַחֲנֶה wörtlich „Lager“ heißen kann. Im militärischen Zusammenhang und parallel zu „Krieg“ bezeichnet das Substantiv hier das lagernde Heer.
- source_word: לֹא יִירָא לִבִּי
  choice: fürchtet sich mein Herz nicht
  rationale: Die ausdrückliche Nennung des Herzens bleibt erhalten. Das Präsens ist im Deutschen für die entschlossene, allgemein geltende Aussage natürlicher als ein Futur.
- source_word: תָּקוּם עָלַי מִלְחָמָה
  choice: Krieg gegen mich aufsteht
  rationale: Die bildhafte Formulierung mit קום („aufstehen, sich erheben“) wird bewahrt und nicht zu „ausbrechen“ oder „angreifen“ geglättet.
- source_word: בְּזֹאת אֲנִי בוֹטֵחַ
  choice: vertraue ich selbst dann
  rationale: בטח bezeichnet Vertrauen beziehungsweise Zuversicht. „Selbst dann“ gibt die situationsbezogene Kraft des knappen בְּזֹאת idiomatisch wieder; die mögliche wörtlichere Lesart wird in der Fußnote offengehalten.
theological_decisions:
- issue: Bezug und Sinn von בְּזֹאת
  choice: 'Als Verweis auf die eben geschilderte Bedrohung: „selbst dann vertraue ich“'
  alternative: Wörtlicher „darin bin ich zuversichtlich“; möglicherweise weist das Demonstrativ auf den HERRN beziehungsweise auf die zuvor ausgesprochene Gewissheit zurück.
  rationale: Der unmittelbare Parallelismus spricht dafür, die Wendung auf die Lage angesichts von Heer und Krieg zu beziehen. Da das Hebräische den Gegenstand des Vertrauens jedoch nicht ausdrücklich nennt, wird keine theologische Ergänzung in den Haupttext eingefügt und die Mehrdeutigkeit in der Fußnote benannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter hebräischer Bildsprache. „Wenn auch“ klingt natürlich und hält zugleich etwas von der möglichen Bedingungsbedeutung fest. Die knappe Schlussaussage bleibt ohne ausdrücklich ergänztes Objekt des Vertrauens.
