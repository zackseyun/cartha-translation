base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/001.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: de
  text: 'Von David.[a]


    Jahwe ist mein Licht und meine Rettung – vor wem sollte ich mich fürchten?


    Jahwe ist die Schutzburg meines Lebens – vor wem sollte ich Angst haben?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Für David“ oder „David zugeordnet“. Das hebräische לְדָוִד kann Urheberschaft oder Zuordnung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Überschrift bleibt knapp und bewahrt die mögliche Bedeutung von Urheberschaft oder Zuordnung; die Mehrdeutigkeit der Präposition ל wird in der Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אוֹרִי
  choice: mein Licht
  rationale: Das transparente hebräische Bild wird wörtlich und natürlich bewahrt.
- source_word: וְיִשְׁעִי
  choice: und meine Rettung
  rationale: יֵשַׁע bezeichnet Rettung oder Befreiung. „Rettung“ ist hier idiomatisch und lässt sowohl konkrete Bewahrung als auch den weiteren theologischen Sinn offen.
- source_word: מִמִּי אִירָא
  choice: vor wem sollte ich mich fürchten?
  rationale: Das hebräische מִן wird im Deutschen nach „sich fürchten“ natürlich mit „vor“ wiedergegeben; der Imperfekt hat in der rhetorischen Frage modalen Sinn.
- source_word: מָעוֹז חַיַּי
  choice: die Zuflucht meines Lebens
  rationale: מָעוֹז bezeichnet einen Ort oder eine Quelle schützender Stärke. „Zuflucht“ ist im modernen Deutsch natürlicher als „Festung meines Lebens“, ohne den Schutzgedanken aufzugeben.
- source_word: מִמִּי אֶפְחָד
  choice: vor wem sollte ich erschrecken?
  rationale: פחד kann Furcht, Schrecken oder Bangen ausdrücken. „Erschrecken“ erhält die Variation gegenüber ירא und bildet eine natürliche parallele Frage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Bedeutungsumfang von יֵשַׁע
  choice: Rettung
  alternative: Heil
  rationale: „Rettung“ vermeidet eine vorschnelle Beschränkung auf einen dogmatischen Heilsbegriff und passt zum unmittelbaren Zusammenhang von Gefahr, Furcht und Schutz.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Parallelität der beiden rhetorischen Fragen bleibt erhalten; Gedankenstriche gliedern die beiden Aussagen. Der Gottesname erscheint in der im Deutschen üblichen Form „Jahwe“.
