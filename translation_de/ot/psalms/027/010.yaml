  text: For my father and my mother have forsaken me[a], but Yahweh will take me in.
translation:
  language: de
  text: Denn mein Vater und meine Mutter haben mich verlassen, doch Jahwe wird mich aufnehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird mich sammeln“; auch: „wird mich bei sich aufnehmen“ oder „wird mich zu sich nehmen“. Das hebräische Verb vermittelt hier den Gedanken einer willkommenen, schützenden Aufnahme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet bzw. erläutert hier die Zuversicht des Beters. „Denn“ bewahrt diese Verknüpfung, ohne sie unnötig als Einräumung zu deuten.
- source_word: אָבִי וְאִמִּי
  choice: mein Vater und meine Mutter
  rationale: Die Possessivformen und die Verbindung werden unmittelbar und natürlich wiedergegeben.
- source_word: עֲזָבוּנִי
  choice: haben mich verlassen
  rationale: עזב bezeichnet verlassen, aufgeben oder im Stich lassen. „Verlassen“ trägt im Deutschen die emotionale Schwere und gibt die hebräische Perfektform hier passend wieder.
- source_word: וַיהוָה
  choice: doch Jahwe
  rationale: Das Waw markiert im Zusammenhang einen deutlichen Gegensatz zwischen menschlichem Verlassen und Gottes Aufnahme; „doch“ bringt diesen Kontrast idiomatisch zum Ausdruck. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: יַאַסְפֵנִי
  choice: nimmt mich auf
  rationale: אסף bedeutet wörtlich „sammeln“ und kann bei Personen das Aufnehmen bzw. Zu-sich-Nehmen bezeichnen. „Nimmt mich auf“ ist natürliches Deutsch und bewahrt den Gedanken schützender, willkommener Annahme; das hebräische Imperfekt kann hier zuversichtliche Erwartung ausdrücken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ gibt den Eigennamen als solchen wieder und entspricht der vorgegebenen Projektentscheidung, ohne ihn durch einen Titel zu ersetzen.
- issue: Zeitwert von יַאַסְפֵנִי
  choice: nimmt mich auf
  alternative: wird mich aufnehmen
  rationale: Das hebräische Imperfekt lässt sowohl eine gegenwärtig-charakteristische als auch eine zukünftige, zuversichtliche Nuance zu. Das deutsche Präsens kann beides offenhalten und klingt in diesem Kontrast natürlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus bleibt knapp; „doch“ hebt den Gegensatz hervor. Die Formulierung „nimmt mich auf“ ist verständlich und idiomatisch, während die Fußnote das konkrete Bild des hebräischen Verbs und dessen zeitliche Offenheit bewahrt.
