id: PSA.27.5
reference: Psalms 27:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י יִצְפְּנֵ֨/נִי בְּ/סֻכֹּ/ה֮ בְּ/י֪וֹם רָ֫עָ֥ה יַ֭סְתִּרֵ/נִי בְּ/סֵ֣תֶר אָהֳל֑/וֹ בְּ֝/צ֗וּר יְרוֹמְמֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/005.yaml
  text: For he will hide me in his shelter in the day of trouble[a]; he will conceal me in the secret place of his tent[c][b]; he will lift me high upon a rock.
translation:
  language: de
  text: Denn er birgt mich in seiner Hütte[a] am Tag des Unheils[b]; er verbirgt mich im Verborgenen seines Zeltes; auf einen Felsen hebt er mich empor.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „in seinem Schutzdach“ beziehungsweise „in seiner Laubhütte“. Das hebräische Wort bezeichnet eine schützende Hütte und kann hier auch an das Heiligtum erinnern.
    reason: lexical_alternative
  - marker: b
    text: Oder „am Tag der Not“ beziehungsweise „am Tag des Unglücks“.
    reason: lexical_alternative
  - marker: c
    text: Oder „auf einen Felsen stellt er mich hoch“.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die im vorausgehenden Zusammenhang ausgedrückte Zuversicht, ohne den Aussagegehalt zu verstärken.
- source_word: יִצְפְּנֵנִי
  choice: er birgt mich
  rationale: צפן bezeichnet hier schützendes Verbergen. „Bergen“ verbindet im Deutschen knapp die Aspekte von Schutz und Verborgenheit.
- source_word: בְּסֻכּוֹ
  choice: in seiner Hütte
  rationale: סֻכָּה bezeichnet konkret eine Hütte oder einen schützenden Unterstand. „Hütte“ bewahrt das Bild und lässt mögliche Heiligtumsanklänge offen.
- source_word: בְּיוֹם רָעָה
  choice: am Tag des Unheils
  rationale: רָעָה meint im Kontext bedrängendes Unheil oder eine Notlage, nicht notwendig moralisch Böses.
- source_word: יַסְתִּרֵנִי
  choice: er verbirgt mich
  rationale: סתר setzt den Parallelismus des schützenden Verbergens fort. Das Verb wird direkt und natürlich wiedergegeben.
- source_word: בְּסֵתֶר אָהֳלוֹ
  choice: im Verborgenen seines Zeltes
  rationale: סֵתֶר bezeichnet einen verborgenen, unzugänglichen Ort; אֹהֶל ist konkret ein Zelt. Die Formulierung bewahrt sowohl die räumliche Bildhaftigkeit als auch die mögliche Heiligtumsassoziation.
- source_word: בְּצוּר
  choice: auf einen Felsen
  rationale: צוּר bezeichnet einen Felsen oder Felsblock als erhöhten, sicheren Ort.
- source_word: יְרוֹמְמֵנִי
  choice: hebt er mich empor
  rationale: רום drückt das Erhöhen aus. Die Wendung bewahrt das vertikale Bild von Rettung und Sicherheit.
theological_decisions:
- issue: Möglicher Heiligtumsbezug von סֻכּוֹ und אָהֳלוֹ
  choice: Die konkreten Bilder werden mit „Hütte“ und „Zelt“ wiedergegeben, ohne sie ausdrücklich als Stiftshütte oder Heiligtum festzulegen.
  alternative: Beide Begriffe ausdrücklich kultisch als „Stiftshütte“, „Heiligtum“ oder „Tempelzelt“ deuten.
  rationale: Die gewöhnlichen Nomina können im Kontext des Psalms Heiligtumsanklänge tragen, erzwingen aber keine ausschließlich kultische Deutung. Die Übersetzung erhält diese Offenheit.
- issue: Bedeutung von רָעָה in בְּיוֹם רָעָה
  choice: situatives Unheil
  alternative: moralisch Böses
  rationale: Der Zusammenhang handelt von Bedrohung und Schutz; daher bezeichnet רָעָה hier am ehesten Not, Unglück oder Unheil.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. „Bergen“, „im Verborgenen“ und „emporheben“ sind allgemein verständlich, zugleich dem gehobenen Ton eines Psalms angemessen. Die konkreten Schutzbilder und die dreifache Verbfolge bleiben erhalten.
