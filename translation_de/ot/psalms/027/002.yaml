id: PSA.27.2
reference: Psalms 27:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בִּ/קְרֹ֤ב עָלַ֨/י מְרֵעִים֮ לֶ/אֱכֹ֪ל אֶת בְּשָׂ֫רִ֥/י צָרַ֣/י וְ/אֹיְבַ֣/י לִ֑/י הֵ֖מָּה כָשְׁל֣וּ וְ/נָפָֽלוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/002.yaml
  text: When evildoers came near me to devour my flesh[b][a], my adversaries and my enemies—they stumbled and fell.
translation:
  language: de
  text: Als Übeltäter auf mich zukamen, um mein Fleisch zu verschlingen[a] — meine Bedränger und meine Feinde —, da strauchelten sie und fielen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um mein Fleisch zu essen“. Die hebräische Wendung ist ein drastisches Bild für einen gewaltsamen Angriff.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקְרֹב
  choice: Als ... auf mich zukamen
  rationale: Der Infinitiv mit בְּ bezeichnet hier den zeitlichen Umstand. „Als ... zukamen“ gibt dies natürlich wieder; „auf mich“ erfasst עָלַי im feindlichen Kontext.
- source_word: מְרֵעִים
  choice: Übeltäter
  rationale: Das Partizip bezeichnet Menschen, die Böses tun. „Übeltäter“ ist knapp, verständlich und bewahrt die moralische Aussage.
- source_word: לֶאֱכֹל אֶת־בְּשָׂרִי
  choice: um mein Fleisch zu verschlingen
  rationale: „Verschlingen“ wahrt das drastische Bild eines gewaltsamen Angriffs und klingt im Deutschen natürlicher als das ganz wörtliche „essen“; „Fleisch“ bewahrt die körperliche Bildsprache.
- source_word: צָרַי
  choice: meine Bedränger
  rationale: „Bedränger“ gibt feindlich gegen den Beter auftretende Personen wieder und bleibt vom folgenden „Feinde“ unterscheidbar.
- source_word: וְאֹיְבַי לִי
  choice: und meine Feinde
  rationale: „Meine Feinde“ gibt die feindliche Beziehung bereits idiomatisch wieder. Eine zusätzliche Wiedergabe von לִי als „gegen mich“ wäre im Deutschen redundant.
- source_word: הֵמָּה
  choice: sie
  rationale: Das selbstständige Pronomen hebt die Angreifer hervor. Die deutsche Satzgliederung mit Gedankenstrichen und dem anschließenden „da ... sie“ trägt diese Hervorhebung ohne schwerfälliges „sie selbst“.
- source_word: כָשְׁלוּ וְנָפָלוּ
  choice: strauchelten ... und fielen
  rationale: Die beiden Verben werden als Abfolge bewahrt, ohne festzulegen, ob der Zusammenbruch körperlich, militärisch oder bildlich gemeint ist.
theological_decisions: []
