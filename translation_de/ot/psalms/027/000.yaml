base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/000.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: de
  text: 'Von David.[a]


    JHWH ist mein Licht und meine Rettung – vor wem sollte ich mich fürchten? JHWH ist die Schutzburg meines Lebens – vor wem sollte ich Angst haben?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Überschrift kann auch „Für David“ bedeuten oder eine Zuordnung zu David ausdrücken.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Präposition לְ kann hier Autorschaft oder Zuordnung ausdrücken. „Von David“ ist als Psalmüberschrift natürlich, ohne die mögliche weitere Bedeutung zu verschweigen.
- source_word: יְהוָה
  choice: JHWH
  rationale: Das Tetragramm wird transparent mit „JHWH“ wiedergegeben, statt es durch einen Titel zu ersetzen.
- source_word: אוֹרִי
  choice: mein Licht
  rationale: Die konkrete Metapher des Hebräischen wird direkt bewahrt.
- source_word: וְיִשְׁעִי
  choice: und meine Rettung
  rationale: „Rettung“ gibt יֶשַׁע im Kontext natürlich und umfassend wieder.
- source_word: מָעוֹז חַיַּי
  choice: die Zuflucht meines Lebens
  rationale: מָעוֹז bezeichnet einen befestigten, sicheren Ort beziehungsweise Schutz. „Zuflucht“ vermittelt die Schutzmetapher in natürlichem Deutsch; „meines Lebens“ wahrt die hebräische Konstruktion.
- source_word: אִירָא / אֶפְחָד
  choice: sollte ich mich fürchten / sollte ich erschrecken
  rationale: Die beiden verwandten Verben werden differenziert wiedergegeben, sodass Parallelismus und leichte lexikalische Variation erhalten bleiben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens
  choice: JHWH
  alternative: der HERR / Jahwe
  rationale: „JHWH“ hält die besondere Namensform des Ausgangstextes sichtbar und vermeidet sowohl die Ersetzung durch einen Titel als auch die Festlegung auf eine rekonstruierte Aussprache.
- issue: Bedeutung von לְדָוִד in der Überschrift
  choice: Von David, mit Fußnote zur Mehrdeutigkeit
  alternative: Für David / David zugeordnet
  rationale: Die traditionelle und im Deutschen natürliche Lesart bleibt im Haupttext stehen; die grammatisch mögliche Zuordnungs- oder Widmungsbedeutung wird ausdrücklich offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Parallelismus. Die Gedankenstriche gliedern Aussage und rhetorische Frage. Der Gottesname bleibt als JHWH sichtbar.
