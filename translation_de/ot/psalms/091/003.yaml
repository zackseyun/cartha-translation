id: PSA.91.3
reference: Psalms 91:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י ה֣וּא יַ֭צִּֽילְ/ךָ מִ/פַּ֥ח יָק֗וּשׁ מִ/דֶּ֥בֶר הַוּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/003.yaml
  text: For he will deliver you from the snare of the fowler[b][a], from the deadly pestilence.
translation:
  language: de
  text: Denn er wird dich aus der Falle des Vogelfängers retten, vor der verheerenden Seuche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »vor der Seuche des Verderbens«; möglich ist ebenso: »vor der tödlichen Seuche«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Vertrauensaussage und verbindet die Verse im Deutschen natürlich.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen hebt den Handelnden hervor; die deutsche Wortstellung trägt diese Hervorhebung ausreichend, ohne ein zusätzliches »selbst« zu erzwingen.
- source_word: יַצִּילְךָ
  choice: wird dich … retten
  rationale: Der Hifil von נצל bezeichnet die Rettung oder Befreiung aus einer Gefahr. »Retten« ist gegenwärtig, klar und dem feierlichen Kontext angemessen.
- source_word: מִפַּח
  choice: aus der Falle
  rationale: פַּח bezeichnet eine Falle oder Fangschlinge. »Falle« ist im heutigen Deutsch unmittelbar verständlich und bewahrt das konkrete Bild.
- source_word: יָקוּשׁ
  choice: des Vogelfängers
  rationale: Das Wort bezeichnet jemanden, der insbesondere Vögeln Fallen stellt. »Vogelfänger« gibt diese Bedeutung präzise und verständlich wieder.
- source_word: מִדֶּבֶר
  choice: vor der … Seuche
  rationale: דֶּבֶר bezeichnet eine schwere, verbreitete Seuche oder Pest. »Seuche« ist im modernen Deutsch natürlicher als »Pestilenz«; nach »retten« ist der Wechsel von »aus« zu idiomatischem »vor« sachgerecht.
- source_word: הַוּוֹת
  choice: verheerenden
  rationale: Das Wort vermittelt Verderben, Zerstörung oder tödliches Unheil. »Verheerend« verbindet sich natürlich mit »Seuche« und lässt offen, ob vor allem ihre zerstörerische oder tödliche Wirkung betont wird.
theological_decisions:
- issue: Art der genannten Gefahren
  choice: Die konkreten Bilder von Falle und Seuche bleiben erhalten, ohne ihre Aussagekraft auf ausschließlich körperliche oder ausschließlich geistliche Gefahren einzugrenzen.
  alternative: Die Gefahren nur wörtlich-physisch oder nur metaphorisch-geistlich deuten.
  rationale: Der hebräische Text nennt reale Gefahren, während die poetische Rede ihnen zugleich umfassendere exemplarische Bedeutung geben kann. Die Übersetzung entscheidet diese Spannung nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die klare Formulierung bewahrt den Parallelismus der beiden Gefahrenbilder; »Falle« und »Seuche« sind allgemein verständlich, während die Fußnote die substantivische hebräische Wendung הַוּוֹת sichtbar hält.
