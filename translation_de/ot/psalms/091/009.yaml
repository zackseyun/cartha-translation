  text: כִּֽי אַתָּ֣ה יְהוָ֣ה מַחְסִ֑/י עֶ֝לְי֗וֹן שַׂ֣מְתָּ מְעוֹנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/009.yaml
  text: Because you[a], O Yahweh, are my refuge, you have made the Most High your dwelling place.
translation:
  language: de
  text: Denn du, Jahwe, bist meine Zuflucht; den Höchsten hast du zu deiner Wohnung gemacht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer verbreiteten Deutung des schwierigen hebräischen Satzes: „Denn du hast gesagt: ‚Jahwe ist meine Zuflucht‘, und den Höchsten zu deiner Wohnung gemacht.“'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet den Grund für den im Zusammenhang zugesagten Schutz ein und bewahrt den kausalen Zusammenhang in würdigem, natürlichem Deutsch.
- source_word: אַתָּה
  choice: du
  rationale: Das ausdrücklich gesetzte Personalpronomen der zweiten Person Singular wird zur Hervorhebung beibehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als im Deutschen geläufige Transliteration wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: מַחְסִי
  choice: meine Zuflucht
  rationale: מַחְסֶה bezeichnet einen Schutz- oder Zufluchtsort; „Zuflucht“ entspricht dem Sprachgebrauch der Psalmen und ist allgemein verständlich.
- source_word: עֶלְיוֹן
  choice: den Höchsten
  rationale: Gibt den als Gottesbezeichnung verwendeten Titel wieder; der Akkusativ folgt aus der deutschen Satzkonstruktion.
- source_word: שַׂמְתָּ
  choice: hast du … gemacht
  rationale: Das Qal Perfekt der zweiten Person Singular bezeichnet hier, etwas zu etwas zu bestimmen oder zu machen; die Verbklammer ist im Deutschen idiomatisch.
- source_word: מְעוֹנֶךָ
  choice: zu deiner Wohnung
  rationale: מָעוֹן bezeichnet einen Wohn- oder Aufenthaltsort. „Wohnung“ ist klar und unterscheidet den Ausdruck von „Zuflucht“ im ersten Satzteil.
theological_decisions:
- issue: Sprecher- und Adressatensyntax in Psalm 91,9
  choice: 'Direkte Anrede bei möglichst enger Wahrung des masoretischen Wortlauts: „Denn du, Jahwe, bist meine Zuflucht; den Höchsten hast du zu deiner Wohnung gemacht.“'
  alternative: '„Denn du hast gesagt: ‚Jahwe ist meine Zuflucht‘, und den Höchsten zu deiner Wohnung gemacht.“'
  rationale: Der punktierte hebräische Text enthält kein ausdrückliches Verb für „gesagt“ und wechselt unvermittelt von „meine Zuflucht“ zu „deiner Wohnung“. Der Haupttext ergänzt daher kein unausgedrücktes Redeverb und lässt die schwierige Spannung stehen; die verbreitete alternative Deutung wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Semikolon macht die beiden syntaktisch spannungsreichen Satzteile lesbar, ohne dem Hebräischen ein nicht vorhandenes Redeverb hinzuzufügen.
