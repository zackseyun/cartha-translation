source:
  edition: WLC
  text: יִפֹּ֤ל מִ/צִּדְּ/ךָ֨ אֶ֗לֶף וּ/רְבָבָ֥ה מִ/ימִינֶ֑/ךָ אֵ֝לֶ֗י/ךָ לֹ֣א יִגָּֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/007.yaml
  text: A thousand may fall at your side[a], and ten thousand at your right hand[b], but it will not come near you.
translation:
  language: de
  text: Tausend mögen an deiner Seite fallen[a] und zehntausend zu deiner Rechten; doch an dich kommt es nicht heran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tausend werden an deiner Seite fallen und zehntausend zu deiner Rechten.“ Die hebräischen Imperfektformen können in diesem poetischen Zusammenhang zukünftig oder modal verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Es wird sich dir nicht nähern.“ Das Subjekt ist im Hebräischen nicht ausdrücklich genannt; im Zusammenhang ist die drohende Gefahr beziehungsweise das Unheil gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפֹּל
  choice: mögen … fallen
  rationale: Das Qal-Imperfekt von נפל kann hier zukünftig oder modal verstanden werden. „Mögen … fallen“ bewahrt diese Offenheit und den poetischen Charakter.
- source_word: מִצִּדְּךָ
  choice: an deiner Seite
  rationale: Die Präposition מִן bezeichnet in dieser Verbindung idiomatisch den Ort neben dem Angesprochenen; „an deiner Seite“ erhält das räumliche Bild.
- source_word: אֶלֶף
  choice: Tausend
  rationale: Die Kardinalzahl wird wörtlich wiedergegeben und wahrt den Parallelismus.
- source_word: וּרְבָבָה
  choice: und zehntausend
  rationale: רְבָבָה bezeichnet zehntausend beziehungsweise eine sehr große Zahl; „zehntausend“ erhält die Steigerung gegenüber „Tausend“.
- source_word: מִימִינֶךָ
  choice: zu deiner Rechten
  rationale: Die Wendung gibt die räumliche Lage natürlich und würdig wieder und bewahrt den Parallelismus.
- source_word: אֵלֶיךָ לֹא יִגָּשׁ
  choice: doch an dich kommt es nicht heran
  rationale: נגשׁ mit אֶל bezeichnet eine Annäherung. Das deutsche „es“ ergänzt das im Hebräischen unausgesprochene Subjekt, ohne die Bedrohung näher festzulegen.
theological_decisions:
- issue: Unausgesprochenes Subjekt im Schlusssatz
  choice: Das Subjekt wird mit dem unbestimmten Pronomen „es“ wiedergegeben und verweist kontextuell auf die Bedrohung beziehungsweise das Unheil.
  alternative: Ein konkretes Subjekt wie „das Unheil“ oder „die Seuche“ einsetzen.
  rationale: Der hebräische Vers nennt das Subjekt nicht ausdrücklich. „Es“ ergibt natürliches Deutsch, lässt den Bezug aber so offen wie möglich und vermeidet eine unnötige Präzisierung.
- issue: Modaler oder zukünftiger Sinn des Imperfekts יִפֹּל
  choice: 'Modal: „mögen … fallen“.'
  alternative: 'Zukünftig: „werden … fallen“.'
  rationale: Beide Lesarten sind grammatisch möglich. Die modale Wiedergabe erhält die Aussage als Darstellung dessen, was ringsum geschehen mag, ohne die poetische Form vorschnell als festgelegte Vorhersage zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem poetischem Parallelismus. Die Formulierung vermeidet konfessionelle Zusätze und lässt sowohl die aspektuell-modale Offenheit als auch das unausgesprochene Subjekt des Hebräischen erkennbar.
