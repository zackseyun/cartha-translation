id: PSA.91.8
reference: Psalms 91:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רַ֭ק בְּ/עֵינֶ֣י/ךָ תַבִּ֑יט וְ/שִׁלֻּמַ֖ת רְשָׁעִ֣ים תִּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/008.yaml
  text: You will only look with your eyes and see the repayment of the wicked[a].
translation:
  language: de
  text: Du wirst nur mit deinen Augen hinschauen und sehen, wie den Gottlosen vergolten wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »welche Vergeltung die Gottlosen trifft«; auch: »wie die Gottlosen bestraft werden«.'
    reason: Lexikalische Alternative zu שִׁלֻּמַת; der Ausdruck kann als Vergeltung, entsprechende Wiedererstattung oder im Kontext als Bestrafung verstanden werden.
lexical_decisions:
- source_word: רַק
  choice: nur
  rationale: 'Kennzeichnet hier die Begrenzung: Der Angesprochene wird das Geschick lediglich beobachten und nicht selbst davon getroffen werden.'
- source_word: בְּעֵינֶיךָ
  choice: mit deinen Augen
  rationale: Bewahrt das hebräische Bild der persönlichen Augenzeugenschaft, ohne das im Ausgangstext nicht ausdrücklich vorhandene »eigenen« hinzuzufügen.
- source_word: תַבִּיט
  choice: hinschauen
  rationale: Das Hifil von נבט bezeichnet ein gerichtetes Schauen. »Hinschauen« ist gegenwärtig und unterscheidet sich noch erkennbar vom folgenden ראה.
- source_word: וְשִׁלֻּמַת
  choice: wie … vergolten wird
  rationale: Die verbale Wiedergabe klingt im Deutschen natürlicher als »die Vergeltung der Gottlosen« und bewahrt den Gedanken einer entsprechenden Erwiderung, ohne ihn auf eine bestimmte Strafart festzulegen.
- source_word: רְשָׁעִים
  choice: den Gottlosen
  rationale: »Die Gottlosen« ist in den Psalmen eine geläufige, knappe Bezeichnung für Menschen, die sich Gott und dem Recht widersetzen.
- source_word: תִּרְאֶה
  choice: sehen
  rationale: Gibt das einfache Qal von ראה unmittelbar wieder und erhält zusammen mit »hinschauen« die zwei Seh-Verben des Hebräischen.
theological_decisions:
- issue: Art dessen, was die Gottlosen trifft
  choice: wie den Gottlosen vergolten wird
  alternative: die Bestrafung der Gottlosen
  rationale: שִׁלֻּמָה bezeichnet eine Vergeltung beziehungsweise Rückerstattung, ist aber breiter als eine ausdrücklich benannte Strafe. Die Formulierung erhält den moralisch-gerichtlichen Sinn, ohne die Art der Folge näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung zweier Verben des Sehens wird entsprechend dem Hebräischen beibehalten; die syntaktisch schwerfällige nominale Wendung wird für natürliches Deutsch verbal wiedergegeben.
