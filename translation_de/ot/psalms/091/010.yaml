id: PSA.91.10
reference: Psalms 91:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹֽא תְאֻנֶּ֣ה אֵלֶ֣י/ךָ רָעָ֑ה וְ֝/נֶ֗גַע לֹא יִקְרַ֥ב בְּ/אָהֳלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/010.yaml
  text: No harm will happen to you[b][a], and no plague will come near your tent.
translation:
  language: de
  text: Kein Unheil wird dir widerfahren,[a] und keine Plage wird sich deinem Zelt nahen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kein Böses wird dir begegnen.“'
    reason: lexical_alternative
  - marker: b
    text: „Zelt“ kann hier auch die Wohnstätte oder das Zuhause einschließlich der Hausgemeinschaft bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאֻנֶּה
  choice: wird widerfahren
  rationale: Das Verb אנה bezeichnet hier ein Geschehen oder Widerfahren. „Widerfahren“ verbindet sich im Deutschen natürlich mit „Unheil“ und bewahrt die auf die angesprochene Person gerichtete Aussage.
- source_word: רָעָה
  choice: Unheil
  rationale: Im Zusammenhang des Schutzpsalms bezeichnet רָעָה schädliches Unglück beziehungsweise Not, nicht notwendig moralisch Böses. „Unheil“ wahrt diese Bedeutungsbreite und den poetischen Ton.
- source_word: נֶגַע
  choice: Plage
  rationale: נֶגַע kann eine schwere Heimsuchung, einen Schlag oder eine Plage bezeichnen. „Plage“ passt zum Kontext tödlicher Gefahren, ohne die Bedeutung unnötig auf eine bestimmte Krankheit zu verengen.
- source_word: יִקְרַב
  choice: wird sich nahen
  rationale: Die Wiedergabe bewahrt das räumliche Bild des hebräischen קרב und klingt in poetischem Standarddeutsch würdig und verständlich.
- source_word: אָהֶל
  choice: Zelt
  rationale: „Zelt“ gibt das konkrete hebräische Bild unmittelbar wieder; zugleich kann es im Kontext für Wohnstätte und Hausgemeinschaft stehen.
- source_word: אֵלֶיךָ
  choice: dir
  rationale: Die Dativkonstruktion „dir widerfahren“ gibt die Richtung auf den Angesprochenen im Deutschen idiomatisch wieder.
theological_decisions:
- issue: Art der zugesagten Bewahrung
  choice: Die Aussage bleibt als uneingeschränkte poetische Zusage formuliert, ohne erläuternde Abschwächung oder Ausweitung.
  alternative: Die Aussage ausdrücklich als Garantie deuten, dass Glaubende niemals irgendein körperliches Leid erfahren, oder sie im Text auf geistlichen Schutz beschränken.
  rationale: Der hebräische Vers spricht direkt und kraftvoll. Die Übersetzung bewahrt diese Spannung, ohne eine umfassende Lehre über Leiden und Vorsehung in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-poetischem Klang. Die parallele Satzstruktur und das räumliche Bild des Nahens bleiben erhalten.
