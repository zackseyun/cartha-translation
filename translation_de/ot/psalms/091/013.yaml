  text: עַל שַׁ֣חַל וָ/פֶ֣תֶן תִּדְרֹ֑ךְ תִּרְמֹ֖ס כְּפִ֣יר וְ/תַנִּֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/013.yaml
  text: You will tread on the lion and the cobra[b][a]; you will trample the young lion and the serpent.
translation:
  language: de
  text: Auf den Löwen und die Kobra[a] wirst du treten; den Junglöwen und die Schlange[b] wirst du zertreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Otter“; das hebräische Wort bezeichnet eine Giftschlange und wird oft als Kobra gedeutet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Drache“. Das hebräische Wort kann in anderen Zusammenhängen auch ein großes Reptil oder ein Seeungeheuer bezeichnen; hier passt „Schlange“ am besten zur Reihe gefährlicher Landtiere.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל
  choice: auf
  rationale: Die Präposition bezeichnet hier das Treten auf gefährliche Tiere; „auf“ ist im Deutschen die natürliche räumliche Entsprechung.
- source_word: שַׁחַל
  choice: Löwe
  rationale: Das poetische Wort bezeichnet einen Löwen, möglicherweise mit dem Beiklang besonderer Wildheit. „Löwe“ gibt den klaren Sinn wieder, ohne eine im Kontext nicht notwendige Zusatzdeutung einzuführen.
- source_word: פֶתֶן
  choice: Kobra
  rationale: Gemeint ist eine gefährliche Giftschlange. „Kobra“ ist für heutige Leser verständlich und entspricht der wahrscheinlichen zoologischen Zuordnung besser als das traditionelle „Otter“.
- source_word: תִּדְרֹךְ
  choice: wirst du treten
  rationale: Die Form bezeichnet das Treten auf etwas. Die Wiedergabe bewahrt sowohl den Zukunftsbezug als auch den gehobenen poetischen Ton.
- source_word: תִּרְמֹס
  choice: wirst du zertreten
  rationale: Das Verb ist stärker als das vorangehende und beschreibt ein gewaltsames Nieder- oder Zertreten. „Zertreten“ erhält diese Steigerung.
- source_word: כְּפִיר
  choice: Junglöwe
  rationale: Das Wort bezeichnet einen jungen, kräftigen Löwen, nicht notwendig ein kleines Löwenjunges. „Junglöwe“ ist präzise und knapp.
- source_word: תַנִּין
  choice: Schlange
  rationale: Das Wort kann je nach Zusammenhang eine große Schlange, ein gewaltiges Reptil, ein Seeungeheuer oder einen Drachen bezeichnen. In der Reihe gefährlicher Landtiere ist „Schlange“ die naheliegendste Wiedergabe.
theological_decisions:
- issue: Ob תַנִּין zoologisch als „Schlange“ oder bildhaft-mythologisch als „Drache“ wiederzugeben ist
  choice: Schlange
  alternative: Drache
  rationale: Der unmittelbare Parallelismus mit Löwe, Kobra und Junglöwe legt ein gefährliches Landtier nahe. Die traditionelle und symbolisch mögliche Wiedergabe „Drache“ bleibt in einer Fußnote erhalten, damit die Bedeutungsbreite nicht verdeckt wird.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die Voranstellung der beiden Objekte folgt dem Nachdruck des Hebräischen; „zertreten“ bewahrt die Steigerung gegenüber „treten“. Die bestimmten Artikel sorgen im Deutschen für einen natürlichen generischen Ausdruck.
