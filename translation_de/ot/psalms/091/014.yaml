  text: כִּ֤י בִ֣/י חָ֭שַׁק וַ/אֲפַלְּטֵ֑/הוּ אֲ֝שַׂגְּבֵ֗/הוּ כִּֽי יָדַ֥ע שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/014.yaml
  text: Because he clings to me[a], I will rescue him; I will set him securely on high[b], because he knows my name.
translation:
  language: de
  text: Weil er an mir hängt[a], will ich ihn retten; ich will ihn hoch in Sicherheit bringen[b], weil er meinen Namen kennt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Weil er mich liebt« oder »Weil er sich fest an mich bindet«. Das hebräische Verb bezeichnet starke Zuneigung und feste Verbundenheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ich will ihn hoch erheben« oder »ich will ihn schützen«. Das hebräische Verb kann das In-Sicherheit-Bringen durch eine hohe, unzugängliche Lage ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: weil
  rationale: Die Konjunktion leitet an beiden Stellen den Grund für Gottes Handeln ein; »weil« gibt die kausale Bedeutung natürlich wieder.
- source_word: בִי חָשַׁק
  choice: er an mir hängt
  rationale: חָשַׁק bezeichnet starke Zuneigung und feste Bindung; »an mir hängt« bewahrt sowohl die emotionale als auch die relationale Seite der Wendung.
- source_word: וַאֲפַלְּטֵהוּ
  choice: will ich ihn retten
  rationale: Die Form verheißt Gottes rettendes Handeln. »retten« ist gegenwärtig, klar und erfasst die Befreiung aus Gefahr.
- source_word: אֲשַׂגְּבֵהוּ
  choice: ich will ihn in sichere Höhe bringen
  rationale: Das Verb verbindet das Bild unerreichbarer Höhe mit Schutz. Die Wiedergabe erhält die räumliche Metapher und macht zugleich ihren Sicherheitsaspekt verständlich.
- source_word: יָדַע שְׁמִי
  choice: er meinen Namen kennt
  rationale: Die wörtliche Wendung bewahrt die persönliche und relationale Bedeutung von Gottes Namen, ohne sie durch eine auslegende Paraphrase einzuengen.
theological_decisions:
- issue: Bindung und Zuneigung zu Gott in חָשַׁק
  choice: »er an mir hängt«
  alternative: »er mich liebt« / »er seine Liebe auf mich richtet«
  rationale: Die gewählte Formulierung lässt die im Hebräischen enthaltene Spannung zwischen Liebe, Zuneigung und festem Sich-Anschließen bestehen.
- issue: Schutzmetapher in אֲשַׂגְּבֵהוּ
  choice: »ich will ihn in sichere Höhe bringen«
  alternative: »ich will ihn schützen« / »ich will ihn erhöhen«
  rationale: Die Übersetzung bewahrt das poetische Bild einer unzugänglichen, sicheren Höhe, ohne das Verb lediglich als abstrakten Schutz oder als Ehren-Erhöhung zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener hebräischer Bildsprache. Das wiederholte »weil« bildet die doppelte Begründungsstruktur des Verses ab; »will ich« gibt den Verheißungscharakter natürlich wieder.
