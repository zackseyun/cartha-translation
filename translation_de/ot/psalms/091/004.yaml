base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/004.yaml
  text: With his pinions he will cover you[a], and under his wings you will find refuge[b]; his faithfulness is a shield and a bulwark.
translation:
  language: de
  text: Mit seinem Gefieder wird er dich bedecken[a], und unter seinen Flügeln wirst du Zuflucht finden. Seine Treue ist Schild und Schutzwehr.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mit seinen Schwingen wird er dich bedecken.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Seine Wahrheit ist Langschild und Rundschild.“ Die Bedeutung des zweiten hebräischen Wortes ist unsicher.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֶבְרָתוֹ
  choice: mit seinem Gefieder
  rationale: אֶבְרָה bezeichnet das Gefieder beziehungsweise die Schwingen eines Vogels. „Gefieder“ bewahrt das Vogelbild und ist im heutigen Deutsch natürlicher als „Fittiche“.
- source_word: יָסֶךְ
  choice: wird er dich bedecken
  rationale: Die Hifil-Form von סכך bezeichnet schützendes Bedecken. „Bedecken“ gibt die Handlung direkt wieder und passt zum Bild des schützenden Vogels.
- source_word: לָךְ
  choice: dich
  rationale: Das Suffix bezeichnet die angeredete Person; modernes Deutsch verlangt hier ein Pronomen, ohne dass das grammatische Geschlecht des Hebräischen eigens markiert werden muss.
- source_word: וְתַחַת כְּנָפָיו
  choice: und unter seinen Flügeln
  rationale: Die räumliche Formulierung wird unmittelbar wiedergegeben und führt das Vogelbild fort.
- source_word: תֶּחְסֶה
  choice: wirst du Zuflucht finden
  rationale: חסה bedeutet Zuflucht suchen beziehungsweise nehmen. „Zuflucht finden“ ist idiomatisch und drückt im Kontext die erfahrene Geborgenheit aus.
- source_word: צִנָּה
  choice: Schild
  rationale: צִנָּה bezeichnet einen Schild, häufig einen großen Schutzschild. „Schild“ ist klar und bewahrt das militärische Schutzbild.
- source_word: וְסֹחֵרָה
  choice: und Schutzwehr
  rationale: Das seltene Wort ist semantisch unsicher und bezeichnet wahrscheinlich eine umgebende Schutzvorrichtung. „Schutzwehr“ hält die defensive Bildsprache fest, ohne eine bestimmte Waffenform vorzutäuschen.
- source_word: אֲמִתּוֹ
  choice: seine Treue
  rationale: אֱמֶת kann Wahrheit, Zuverlässigkeit oder Treue bedeuten. Im Zusammenhang des Schutzes bezeichnet „Treue“ treffend Gottes Verlässlichkeit, ohne die mögliche Bedeutung „Wahrheit“ auszuschließen.
theological_decisions:
- issue: Wiedergabe von אֲמִתּוֹ im Schutzbild des Psalms
  choice: seine Treue
  alternative: seine Wahrheit
  rationale: Beide Bedeutungen sind lexikalisch möglich. „Treue“ hebt hier die verlässliche Beständigkeit Gottes hervor; „Wahrheit“ bleibt als echte Alternative in der Fußnote erhalten.
- issue: Deutung des seltenen Wortes סֹחֵרָה
  choice: Schutzwehr
  alternative: Rundschild
  rationale: Die genaue Art des Schutzmittels ist unsicher. Die Hauptfassung wahrt den Gedanken umgebender Verteidigung; die traditionelle waffenbezogene Deutung wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Psalmsprache mit klarer Parallelstruktur. Das Vogel- und das Schutzwaffenbild bleiben erhalten; veraltete Wörter wie „Fittiche“ und „Tartsche“ werden vermieden. Die Fußnotenmarker stehen vollständig im Haupttext.
