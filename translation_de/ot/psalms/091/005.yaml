id: PSA.91.5
reference: Psalms 91:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹא תִ֭ירָא מִ/פַּ֣חַד לָ֑יְלָה מֵ֝/חֵ֗ץ יָע֥וּף יוֹמָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/005.yaml
  text: You will not fear the terror of the night[b][a], nor the arrow that flies by day.
translation:
  language: de
  text: Du wirst dich nicht fürchten vor dem Schrecken der Nacht[a] noch vor dem Pfeil, der am Tag fliegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor dem Grauen der Nacht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִירָא
  choice: du wirst dich nicht fürchten
  rationale: Das Qal-Imperfekt 2. Person Singular mit לֹא wird im Zusammenhang am besten als Zusicherung wiedergegeben, nicht zwingend als Verbot.
- source_word: פַּחַד
  choice: Schrecken
  rationale: Das Wort bezeichnet etwas, das Furcht oder Grauen auslöst; »Schrecken« bewahrt sowohl die Bedrohlichkeit als auch die poetische Kürze.
- source_word: לָיְלָה
  choice: der Nacht
  rationale: Die Genitivverbindung »Schrecken der Nacht« ist im Deutschen natürlich und erhält den Gegensatz zu »am Tag«.
- source_word: חֵץ
  choice: Pfeil
  rationale: Die konkrete Bildsprache des gewöhnlichen hebräischen Ausdrucks bleibt erhalten, ohne sie vorschnell metaphorisch aufzulösen.
- source_word: יָעוּף
  choice: fliegt
  rationale: Das Qal-Imperfekt von עוּף bedeutet hier schlicht »fliegen« und wird als Relativsatz natürlich wiedergegeben.
- source_word: יוֹמָם
  choice: am Tag
  rationale: Die adverbiale Zeitangabe wird idiomatisch übersetzt und bildet den poetischen Gegenpol zur Nacht.
- source_word: מִן ... מִן
  choice: vor ... noch vor
  rationale: Bei »sich fürchten« bezeichnet vor im Deutschen idiomatisch den Gegenstand der Furcht; die Wiederholung bildet zugleich die hebräische Parallelstruktur ab.
theological_decisions:
- issue: Gebot oder Zusicherung
  choice: 'Zusicherung: »Du wirst dich nicht fürchten«'
  alternative: 'Gebot: »Fürchte dich nicht«'
  rationale: לֹא mit dem Imperfekt drückt in diesem poetischen Zusammenhang am ehesten eine Zusicherung über den unter Gottes Schutz stehenden Menschen aus. Die Form wird daher nicht ohne Not zu einem Imperativ gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede im Singular und die parallele Wiederholung von »vor« bleiben erhalten; die konkrete Bildsprache wird nicht gedeutet oder konfessionell zugespitzt.
