lexical_decisions:
- source_word: עַל כַּפַּיִם
  choice: Auf ihren Händen
  rationale: עַל bezeichnet hier die tragende Fläche; כַּפַּיִם ist die Dualform von כַּף („Handfläche/Hand“). „Auf ihren Händen“ bewahrt das Bild und klingt im Deutschen natürlich.
- source_word: יִשָּׂאוּנְךָ
  choice: werden sie dich tragen
  rationale: נָשָׂא kann „heben, tragen“ bedeuten. Im schützenden Zusammenhang gibt „tragen“ den Sinn klar wieder, ohne eine nicht zwingend vorhandene Aufwärtsbewegung einzutragen.
- source_word: פֶּן
  choice: damit … nicht
  rationale: פֶּן leitet hier einen verneinten Zweck- beziehungsweise Vermeidungssatz ein. „Damit … nicht“ ist modernes, idiomatisches Deutsch und erhält den vorbeugenden Sinn.
- source_word: תִּגֹּף
  choice: stößt
  rationale: נָגַף bezeichnet hier das Anstoßen des Fußes. „Stoßen“ passt zur Konstruktion mit einem Stein und vermeidet die stärkere Deutung „stolpern“.
- source_word: בָּאֶבֶן
  choice: an einen Stein
  rationale: Die Präposition ב wird mit dem Verb idiomatisch als „an“ wiedergegeben; אֶבֶן ist in diesem Zusammenhang unbestimmt, daher „einen Stein“.
- source_word: רַגְלֶךָ
  choice: dein Fuß
  rationale: Das hebräische Substantiv steht im Singular mit Suffix der 2. Person maskulin Singular; auch die deutsche Wendung verwendet natürlich den Singular.
theological_decisions:
- issue: Traditionelle Formulierung gegenüber moderner, quellennaher Sprache
  choice: Auf ihren Händen werden sie dich tragen
  alternative: Sie werden dich auf Händen tragen
  rationale: Die gewählte Wortfolge bewahrt die Hervorhebung von עַל כַּפַּיִם am Versanfang und bleibt zugleich verständliches modernes Deutsch. Sie trägt keine über den hebräischen Text hinausgehende konfessionelle Deutung ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Wendung „Auf ihren Händen“ erhält die Bildhaftigkeit und den Fokus des hebräischen Satzes; der bekannte Ausdruck „auf Händen tragen“ bleibt erkennbar, ohne den Satz unnötig zu traditionalisieren.
