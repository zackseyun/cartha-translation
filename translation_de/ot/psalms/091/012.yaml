  - severity: low
    issue: Fußnote enthält „stützen“ als lexikalische Alternative
    rationale: „Stützen“ ist für נָשָׂא hier keine direkte lexikalische Alternative zu „tragen/heben“, sondern eine kontextuelle Ausdeutung. Die Fußnote sollte nur die tatsächlich gedeckte Alternative nennen.
