  text: יֹ֭שֵׁב בְּ/סֵ֣תֶר עֶלְי֑וֹן בְּ/צֵ֥ל שַׁ֝דַּ֗י יִתְלוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/001.yaml
  text: He who dwells in the shelter of the Most High will lodge in the shadow of the Almighty[a][b][c].
translation:
  language: de
  text: Wer im Schutz[a] des Höchsten wohnt, wird im Schatten des Allmächtigen übernachten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer im Versteck des Höchsten wohnt“. Das hebräische Wort bezeichnet einen verborgenen oder bergenden Ort.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird … bleiben“. Das hebräische Verb bedeutet konkret „übernachten“ und kann darüber hinaus ein Bleiben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב
  choice: Wer … wohnt
  rationale: Das substantivisch gebrauchte Partizip bezeichnet einen Menschen, dessen Leben durch beständiges Wohnen oder Bleiben gekennzeichnet ist. „Wer“ gibt den repräsentativen Sinn des grammatisch maskulinen Singulars im natürlichen Deutschen wieder.
- source_word: בְּסֵתֶר
  choice: im Schutz
  rationale: סֵתֶר bezeichnet einen verborgenen, bergenden Ort. „Schutz“ bringt die im Kontext hervortretende Geborgenheit idiomatisch zum Ausdruck; die räumlichere Alternative „im Versteck“ wird in einer Fußnote bewahrt.
- source_word: עֶלְיוֹן
  choice: des Höchsten
  rationale: Der etablierte deutsche Gottes­titel gibt die Bedeutung des substantivisch gebrauchten עֶלְיוֹן klar und würdig wieder.
- source_word: בְּצֵל
  choice: im Schatten
  rationale: Dies bildet Präposition und Substantiv unmittelbar ab und bewahrt das poetische Bild von Nähe und Schutz.
- source_word: שַׁדַּי
  choice: des Allmächtigen
  rationale: „Der Allmächtige“ ist die geläufige Bedeutungswiedergabe des Gottestitels שַׁדַּי und ist modernen Lesern verständlicher als eine bloße Transliteration.
- source_word: יִתְלוֹנָן
  choice: wird … übernachten
  rationale: Das Verb לון bezeichnet konkret das Übernachten oder nächtliche Herbergen und kann erweitert auch ein Bleiben ausdrücken. „Übernachten“ bewahrt das konkrete Bild und die Zukunftsform.
theological_decisions:
- issue: Repräsentativer Sinn des grammatisch maskulinen Singulars
  choice: Wer im Schutz des Höchsten wohnt
  alternative: Der im Schutz des Höchsten Wohnende
  rationale: Das Hebräische steht im maskulinen Singular, hat hier aber repräsentative Kraft. Das deutsche „wer“ gibt diesen offenen Bezug natürlich wieder, ohne den Anwendungsbereich auf einen einzelnen Mann zu beschränken.
- issue: Wiedergabe des Gottestitels שַׁדַּי
  choice: der Allmächtige
  alternative: Schaddai
  rationale: Die Übersetzung des Titels vermittelt seine herkömmlich verstandene Bedeutung unmittelbar; die Transliteration würde deutschen Lesern diese Bedeutung nicht ohne Erklärung erschließen.
translation_notes:
  register: Moderne, würdige Psalmsprache mit klarer Parallelstruktur. „Wer“ ist idiomatischer als eine schwerfällige substantivische Partizipialkonstruktion; „übernachten“ erhält bewusst das konkrete hebräische Bild.
