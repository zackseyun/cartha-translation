lexical_decisions:
- source_word: דֶּבֶר
  choice: Seuche
  rationale: Das Wort bezeichnet gewöhnlich eine Pest oder Seuche. „Seuche“ ist im heutigen Deutsch verständlich und lässt die genaue Krankheitsart offen.
- source_word: בָּאֹפֶל
  choice: im Dunkeln
  rationale: אֹפֶל bezeichnet tiefe Dunkelheit oder Finsternis. „Im Dunkeln“ gibt das Bild natürlich und prägnant wieder.
- source_word: יַהֲלֹךְ
  choice: umhergeht
  rationale: הלך bedeutet gehen oder umhergehen. Die Wiedergabe bewahrt die poetische Personifikation der Seuche.
- source_word: קֶּטֶב
  choice: Verderben
  rationale: קֶטֶב kann vernichtendes Unheil und möglicherweise eine tödliche Seuche bezeichnen. „Verderben“ erhält die Weite und die Parallelität, ohne das Bild vorschnell auf Krankheit zu beschränken.
- source_word: יָשׁוּד
  choice: verwüstet
  rationale: Das Verb beschreibt gewaltsames Verheeren oder Verwüsten. „Verwüstet“ ist anschaulich und entspricht der zerstörerischen Kraft des Ausdrucks.
- source_word: צָהֳרָיִם
  choice: am Mittag
  rationale: Das Wort bedeutet Mittag. Die Formulierung bewahrt den poetischen Gegensatz zum Dunkel des ersten Halbverses.
- source_word: מִן
  choice: weder … noch
  rationale: Die Präposition bedeutet wörtlich „vor/aus“. Im Zusammenhang von Psalm 91,5–6 setzt sie die Reihe der Gefahren fort, vor denen man sich nicht fürchten muss; „weder … noch“ stellt diese syntaktische Verbindung natürlich her.
theological_decisions: []
