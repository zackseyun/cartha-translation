  text: nor the plague that walks in darkness[a], nor the destruction that devastates at noon.
translation:
  language: de
  text: weder vor der Seuche, die im Dunkeln umhergeht,[a] noch vor dem Verderben, das am Mittag verwüstet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Pest“, und für „Verderben“ möglicherweise „tödliche Seuche“; im Hebräischen stehen poetische Parallelbegriffe für vernichtende Bedrohungen.'
