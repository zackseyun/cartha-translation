source:
  edition: WLC
  text: אֹ֣רֶךְ יָ֭מִים אַשְׂבִּיעֵ֑/הוּ וְ֝/אַרְאֵ֗/הוּ בִּֽ/ישׁוּעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/016.yaml
  text: I will satisfy him with length of days[a], and I will show him my salvation.
translation:
  language: de
  text: Mit langem Leben werde ich ihn sättigen und ihn mein Heil sehen lassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Rettung“. Das hebräische Wort kann sowohl die Rettung aus Gefahr als auch Heil in einem umfassenderen Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  choice: mit langem Leben
  rationale: Die hebräische Wendung bedeutet wörtlich „Länge der Tage“. „Mit langem Leben“ gibt das Bild natürlich und würdevoll auf Deutsch wieder.
- source_word: אַשְׂבִּיעֵהוּ
  choice: werde ich ihn sättigen
  rationale: Der Hifil von שׂבע bezeichnet das Bewirken von Sättigung oder Erfüllung. „Ihn sättigen“ bewahrt sowohl die Bildhaftigkeit als auch die Person als direktes Objekt.
- source_word: וְאַרְאֵהוּ
  choice: und ihn … sehen lassen
  rationale: Der Hifil von ראה bedeutet „sehen lassen“ beziehungsweise „zeigen“. Die gewählte Form ist im Deutschen natürlich und hält Gottes Wirken ausdrücklich fest.
- source_word: בִּישׁוּעָתִי
  choice: mein Heil
  rationale: יְשׁוּעָה kann konkrete Rettung wie auch Heil im umfassenderen Sinn bezeichnen. „Mein Heil“ bewahrt diese Breite und passt zum gehobenen, aber verständlichen Register des Psalms.
theological_decisions:
- issue: Bedeutungsumfang von יְשׁוּעָה in der abschließenden Schutzverheißung
  choice: Heil
  alternative: Rettung
  rationale: „Heil“ lässt die umfassendere theologische Bedeutung anklingen, ohne die konkrete Rettung aus Gefahr auszuschließen. Die mögliche engere Bedeutung wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Psalmton. „Sättigen“ erhält die hebräische Bildsprache; „mit langem Leben“ vermeidet die im Deutschen schwerfällige wörtliche Form „mit Länge der Tage“.
