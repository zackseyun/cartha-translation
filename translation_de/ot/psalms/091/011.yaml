  language: en
  yaml_path: translation/ot/psalms/091/011.yaml
  text: For he will command his angels concerning you[b][a], to guard you in all your ways.
translation:
  language: de
  text: Denn er wird seinen Engeln befehlen[a], dich auf allen deinen Wegen zu behüten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann die hebräische Konstruktion den Befehl als auf dich bezogen oder zu deinem Nutzen ergangen kennzeichnen; vgl. „für dich“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu bewahren“ oder „über dich zu wachen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Zusage ein und bewahrt den erklärenden Zusammenhang.
- source_word: מַלְאָכָיו
  choice: seinen Engeln
  rationale: Im Kontext des Psalms sind himmlische Boten gemeint; „Engel“ ist dafür im modernen Deutsch die natürliche und eindeutige Bezeichnung.
- source_word: יְצַוֶּה
  choice: wird ... befehlen
  rationale: Die Piel-Form bezeichnet das Erteilen eines Befehls oder Auftrags. Das Futur passt zur Zusage des Verses und gibt die Form direkt wieder.
- source_word: לָּךְ
  choice: deinetwegen
  rationale: Die Präposition bezeichnet hier wahrscheinlich die Person, auf die sich der Befehl bezieht beziehungsweise zu deren Gunsten er ergeht. „Deinetwegen“ ist knapp und idiomatisch; „für dich“ bleibt möglich.
- source_word: לִשְׁמָרְךָ
  choice: dich ... zu behüten
  rationale: שׁמר umfasst bewahren, behüten und bewachen. „Behüten“ drückt den schützenden Sinn würdig und im heutigen Deutsch verständlich aus.
- source_word: בְּכָל דְּרָכֶיךָ
  choice: auf allen deinen Wegen
  rationale: Bewahrt das hebräische Bild und lässt sowohl konkrete Wege als auch den Lebensweg anklingen.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt der Verbform יְצַוֶּה
  choice: Das Subjekt wird mit „er“ wiedergegeben und im Kontext auf Gott bezogen.
  alternative: Den Gottesnamen oder „Gott“ ausdrücklich einsetzen.
  rationale: Die maskuline Singularform verweist im Zusammenhang auf Gott. Das Pronomen wahrt jedoch die Ausdrucksweise des hebräischen Textes, ohne den Gottesnamen ergänzend einzutragen.
- issue: Umfang der zugesagten Bewahrung
  choice: „auf allen deinen Wegen“ bleibt uneingeschränkt und metaphorisch offen formuliert.
  alternative: Die Wege ausdrücklich als von Gott gebilligte Wege bestimmen.
  rationale: Eine solche Einschränkung steht nicht ausdrücklich im Vers und würde eine auslegende theologische Präzisierung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter poetischer Bildsprache. Die Satzstellung bleibt gut verständlich und folgt zugleich eng dem Aufbau des Hebräischen.
