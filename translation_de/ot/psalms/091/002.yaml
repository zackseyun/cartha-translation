id: PSA.91.2
reference: Psalms 91:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֹמַ֗ר לַֽ֭/יהוָה מַחְסִ֣/י וּ/מְצוּדָתִ֑/י אֱ֝לֹהַ֗/י אֶבְטַח בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/002.yaml
  text: I say to Yahweh[a], “My refuge and my fortress, my God, in whom I trust.”
translation:
  language: de
  text: 'Ich sage zu Jahwe[a]: »Meine Zuflucht und meine Festung, mein Gott, auf den ich vertraue.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit »der HERR« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Ich sage
  rationale: Das Qal-Imperfekt der 1. Person Singular kann gegenwärtig oder zukünftig verstanden werden. Im Zusammenhang dieses fortdauernden Vertrauensbekenntnisses ist das Präsens natürlich, ohne eine nicht erforderliche Zukunftsbedeutung einzutragen.
- source_word: לַיהוָה
  choice: zu Jahwe
  rationale: Die Präposition ל bezeichnet hier am besten den Adressaten der Aussage. Daher wird die Wendung als direkte Hinwendung zu Jahwe wiedergegeben.
- source_word: יהוה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben; eine Fußnote nennt die hebräische Form und die traditionelle Wiedergabe.
- source_word: מַחְסִי
  choice: meine Zuflucht
  rationale: מַחְסֶה bezeichnet einen schützenden Zufluchtsort. »Zuflucht« bewahrt das vertraute Schutzbild der Psalmen.
- source_word: וּמְצוּדָתִי
  choice: und meine Festung
  rationale: מְצוּדָה bezeichnet eine befestigte Schutzanlage oder einen starken Zufluchtsort. »Festung« erhält das konkrete Wehrbild.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Das Suffix der 1. Person Singular macht das persönliche Bekenntnis ausdrücklich.
- source_word: אֶבְטַח
  choice: ich vertraue
  rationale: Das Qal-Imperfekt von בטח bezeichnet Vertrauen oder Zuversicht. Das Präsens passt zum gegenwärtigen Bekenntnis; eine zukünftige Wiedergabe bleibt grammatisch möglich.
- source_word: בּוֹ
  choice: auf den
  rationale: Die Verbindung aus ב und dem maskulinen Suffix bedeutet wörtlich etwa »auf/in ihn«. Bezogen auf »mein Gott« ist »auf den ich vertraue« im Deutschen idiomatisch und semantisch genau.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen JHWH unmittelbar. »Jahwe« bewahrt ihn als Eigennamen; die traditionelle Ersatzlesung wird in der Fußnote kenntlich gemacht, ohne sie in den Haupttext einzusetzen.
- issue: Zeitwert der Imperfektformen אֹמַר und אֶבְטַח
  choice: 'Präsens: »Ich sage … ich vertraue«'
  alternative: 'Futur bzw. voluntativ: »Ich will sagen … ich will vertrauen«'
  rationale: Die poetische Aussage lässt sowohl gegenwärtiges als auch modales oder zukünftiges Verständnis zu. Das Präsens gibt hier das fortdauernde Vertrauensbekenntnis natürlich wieder, ohne die grammatische Offenheit grundsätzlich zu leugnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Bekenntnisstruktur und die parallelen Schutzbilder »Zuflucht« und »Festung« bleiben erhalten; die Zeichensetzung macht Jahwe als Adressaten deutlich.
