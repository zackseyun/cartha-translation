  text: He will call on me[a], and I will answer him; I am with him in trouble[b]; I will rescue him and honor him.
translation:
  language: de
  text: Er wird mich anrufen, und ich werde ihm antworten. Ich bin bei ihm in der Not. Ich werde ihn befreien und ehren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִקְרָאֵנִי
  choice: Er ruft mich an
  rationale: קרא mit persönlichem Objekt bezeichnet hier das an Gott gerichtete Rufen. „Mich anrufen“ ist im Deutschen natürlich und bewahrt den Gebets- und Anrufungscharakter.
- source_word: וְאֶעֱנֵהוּ
  choice: und ich antworte ihm
  rationale: ענה bedeutet in diesem Stamm „antworten“. Die Formulierung gibt die unmittelbare Entsprechung zwischen Anrufen und Antworten klar wieder.
- source_word: עִמּוֹ אָנֹכִי
  choice: bin ich bei ihm
  rationale: Die hebräische Voranstellung von „bei ihm“ setzt einen Akzent auf Gottes Gegenwart. Durch „In der Not bin ich bei ihm“ bleibt dieser Akzent im natürlichen deutschen Satzbau erhalten.
- source_word: בְצָרָה
  choice: in der Not
  rationale: צָרָה bezeichnet Bedrängnis, Not oder Drangsal. „In der Not“ ist würdig, verständlich und im Deutschen idiomatisch.
- source_word: אֲחַלְּצֵהוּ
  choice: Ich befreie ihn
  rationale: חלץ im Piel bezeichnet das Herausziehen beziehungsweise Befreien aus einer Gefahr. „Befreien“ gibt die rettende Intervention klar wieder, ohne ein im Deutschen ungewöhnliches Bild aufzuzwingen.
- source_word: וַאֲכַבְּדֵהוּ
  choice: und bringe ihn zu Ehren
  rationale: כבד im Piel bedeutet „ehren“ oder „zu Ehren bringen“. Die gewählte Wendung klingt im Deutschen natürlich und bewahrt, dass Gott dem Geretteten Ehre verleiht.
theological_decisions:
- issue: Göttliche Verheißungen ohne zusätzliche Bedingungen wiedergeben
  choice: 'Eine unmittelbare Folge göttlicher Antworten: Antwort, Gegenwart, Befreiung und Ehrung'
  alternative: Die Aussage ausdrücklich von zuvor erfüllten Bedingungen oder bewiesener Treue abhängig machen
  rationale: Der hebräische Vers nennt an dieser Stelle keine zusätzlichen Bedingungen. Die Übersetzung bewahrt die Verheißungen in ihrer direkten Form und fügt keine dogmatischen Einschränkungen hinzu.
