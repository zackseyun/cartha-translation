revisions:
- from: Er ruft mich an, und ich antworte ihm. In der Not bin ich bei ihm. Ich befreie ihn und bringe ihn zu Ehren.
  to: Er wird mich anrufen, und ich werde ihm antworten. Ich bin bei ihm in der Not. Ich werde ihn befreien und ehren.
  rationale: Die Revision stellt die zukunftsbezogene Form der hebräischen Verheißungen im Deutschen klar heraus und ersetzt die umschreibende Schlusswendung durch die direkte, natürliche Entsprechung von כבד im Piel. Fußnoten sind für den deutschen Text nicht erforderlich; die im englischen Audit-Trail festgestellten Ankerprobleme betreffen dessen Metadaten, nicht die deutsche Passage.
