  text: אִֽם תִּשְׁכְּבוּ/ן֮ בֵּ֪ין שְׁפַ֫תָּ֥יִם כַּנְפֵ֣י י֭וֹנָה נֶחְפָּ֣ה בַ/כֶּ֑סֶף וְ֝/אֶבְרוֹתֶ֗י/הָ בִּֽ/ירַקְרַ֥ק חָרֽוּץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/013.yaml
  text: Though you lie down among the sheepfolds[a], the wings of a dove are covered with silver[b], and her pinions with yellow gold.
translation:
  language: de
  text: Auch wenn ihr zwischen den Hürden liegt[a], sind die Flügel einer Taube mit Silber überzogen und ihre Schwungfedern mit gelbgrünem Gold[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwischen den Satteltaschen“ oder „zwischen den Herdsteinen“; der hebräische Ausdruck ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „mit grünlichem Gold“; die Farbbezeichnung kann auch „gelbgrün“ meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Auch wenn
  rationale: אִם kann eine Bedingung oder, wie hier wahrscheinlich, eine Einräumung einleiten. „Auch wenn“ gibt den wahrscheinlichen konzessiven Sinn wieder, ohne die Bildfolge auszudeuten.
- source_word: תִּשְׁכְּבוּן
  choice: ihr … liegt
  rationale: Die Form von שׁכב bezeichnet das Liegen oder Sich-Hinlegen. Das Präsens bewahrt die knappe poetische Aussage.
- source_word: בֵּין שְׁפַתָּיִם
  choice: zwischen den Hürden
  rationale: Der Ausdruck ist lexikalisch unsicher. „Hürden“ folgt einer alten, im Kontext möglichen Deutung als Einfriedungen für Kleinvieh; wichtige Alternativen werden in der Fußnote genannt.
- source_word: כַּנְפֵי יוֹנָה
  choice: die Flügel einer Taube
  rationale: Die Konstruktion wird direkt und in natürlichem Deutsch wiedergegeben.
- source_word: נֶחְפָּה בַכֶּסֶף
  choice: sind mit Silber überzogen
  rationale: חפה bezeichnet ein Bedecken oder Überziehen. Die Formulierung erhält das kostbare, glänzende Bild.
- source_word: אֶבְרוֹתֶיהָ
  choice: ihre Schwungfedern
  rationale: אברה meint die kräftigen Flügel- oder Schwungfedern. „Schwungfedern“ ist im modernen Deutsch präzise und verständlich.
- source_word: בִּירַקְרַק חָרוּץ
  choice: mit gelbgrün schimmerndem Gold
  rationale: חָרוּץ kann Gold bezeichnen; יְרַקְרַק beschreibt hier einen gelblich-grünlichen Farbton. „Gelbgrün schimmernd“ erhält die ungewöhnliche Farbangabe, statt sie zu glätten.
