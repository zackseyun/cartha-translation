  text: מַלְכֵ֣י צְ֭בָאוֹת יִדֹּד֣וּ/ן יִדֹּד֑וּ/ן וּ/נְוַת בַּ֝֗יִת תְּחַלֵּ֥ק שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/012.yaml
  text: Kings of armies flee[a], they flee, and the woman at home divides the spoil.
translation:
  language: de
  text: Die Könige der Heere fliehen, sie fliehen, und die Frau zu Hause verteilt die Beute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und die Bewohnerin des Hauses verteilt die Beute«; traditionell auch: »und die Hausfrau verteilt die Beute«. Die hebräische Wendung steht im Femininum Singular und bezeichnet wahrscheinlich die zu Hause gebliebene Frau; das Verb besagt, dass sie die Kriegsbeute verteilt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי צְבָאוֹת
  choice: die Könige der Heere
  rationale: מַלְכֵי ist der Konstruktus Plural von »Könige«, und צְבָאוֹת bezeichnet hier im militärischen Zusammenhang Heere. Die Wiedergabe bewahrt die hebräische Konstruktusverbindung, ohne sie näher festzulegen.
- source_word: יִדֹּדוּן יִדֹּדוּן
  choice: fliehen, sie fliehen
  rationale: Die Wiederholung des Verbs נדד bezeichnet nachdrücklich die Flucht. Die direkte Wiederholung erhält die poetische Eindringlichkeit des Hebräischen.
- source_word: וּנְוַת בַּיִת
  choice: die Frau zu Hause
  rationale: Die Wendung steht im Femininum Singular und bezeichnet eine Frau, die sich im Haus aufhält bzw. dort wohnt. »Die Frau zu Hause« ist verständlich und bewahrt Geschlecht und Numerus, ohne eine moderne soziale Rolle wie »Hausfrau« vorauszusetzen.
- source_word: תְּחַלֵּק
  choice: verteilt
  rationale: Das Piel von חלק bedeutet hier, etwas aufzuteilen oder zu verteilen. »Verteilt« passt natürlich zur Verteilung erbeuteter Güter.
- source_word: שָׁלָל
  choice: die Beute
  rationale: שָׁלָל bezeichnet Kriegsbeute. »Beute« ist im modernen Deutschen klar, knapp und für den militärischen Zusammenhang idiomatisch.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller poetischer Stil. Die emphatische Verbwiederholung und die knappe militärische Bildsprache des Hebräischen bleiben erhalten.
