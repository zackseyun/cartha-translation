  text: But the righteous will be glad[a]; they will exult before God[b], and they will rejoice with gladness.
translation:
  language: de
  text: Doch die Gerechten werden sich freuen[a], sie werden vor Gott jubeln[b] und in Freude frohlocken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und die Gerechten werden sich freuen.“ Die hebräische Konjunktion kann schlicht mit „und“ wiedergegeben werden; „doch“ hebt den Gegensatz zum vorhergehenden Vers hervor.'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch „vor Gott“, das heißt: in Gottes Gegenwart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַדִּיקִים
  choice: Doch die Gerechten
  rationale: צַדִּיקִים bezeichnet Menschen, die gerecht sind. „Die Gerechten“ ist im Deutschen natürlich und psalmtypisch. Das vorangestellte וְ kann schlicht „und“ bedeuten; „doch“ macht hier den Gegensatz zum Schicksal der Frevler im vorhergehenden Vers sichtbar.
- source_word: יִשְׂמְחוּ
  choice: werden sich freuen
  rationale: שׂמח bezeichnet Freude oder Frohsein. „Sich freuen“ ist gegenwärtiges, klares Deutsch und lässt die Steigerung durch die folgenden Ausdrücke erkennen.
- source_word: יַעַלְצוּ
  choice: werden … jubeln
  rationale: עלץ bezeichnet ausgelassene, triumphierende Freude. „Jubeln“ gibt die gesteigerte Intensität natürlich wieder.
- source_word: לִפְנֵי אֱלֹהִים
  choice: vor Gott
  rationale: 'Wörtlich „vor dem Angesicht Gottes“. „Vor Gott“ bewahrt knapp den räumlich-relationalen Sinn: in Gottes Gegenwart.'
- source_word: וְיָשִׂישׂוּ
  choice: und sich … freuen
  rationale: שׂוש bezeichnet freudiges Frohlocken oder Sichfreuen. Die Wiedergabe mit „sich freuen“ ist verständlich und erhält zusammen mit בְשִׂמְחָה die hebräische Häufung der Freudensprache.
- source_word: בְשִׂמְחָה
  choice: voller Freude
  rationale: שִׂמְחָה bezeichnet Freude und bestimmt hier die Art oder Intensität des Sichfreuens. „Voller Freude“ klingt im modernen Deutschen natürlicher als „mit Freude“ und wahrt die emphatische Wiederholung.
