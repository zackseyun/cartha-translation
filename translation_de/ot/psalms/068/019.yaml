source:
  edition: WLC
  text: בָּ֤ר֣וּךְ אֲדֹנָ/י֮ י֤וֹם י֥וֹם יַֽעֲמָס לָ֗/נוּ הָ֘/אֵ֤ל יְֽשׁוּעָתֵ֬/נוּ סֶֽלָה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/019.yaml
  text: Blessed be the Lord[a], who day by day bears us up—God is our salvation. Selah
translation:
  language: de
  text: Gepriesen sei der Herr, der uns Tag für Tag trägt[a] – Gott ist unsere Rettung. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der Tag für Tag für uns trägt“; auch möglich: „der Tag für Tag unsere Last trägt“ oder „der uns Tag für Tag eine Last auflädt“. Traditionell: „der uns täglich mit Wohltaten belädt“. Das hebräische Verb kann „beladen“ oder „tragen“ bedeuten; was getragen oder aufgeladen wird, ist nicht ausdrücklich genannt.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Die passive Partizipialform steht in einer doxologischen Segensformel. „Gepriesen sei“ gibt deren lobpreisenden Charakter im Deutschen natürlich und würdig wieder.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Der göttliche Hoheitstitel wird in der Segensformel idiomatisch mit „der Herr“ wiedergegeben.
- source_word: יוֹם יוֹם
  choice: Tag für Tag
  rationale: Die distributive Wiederholung wird im Deutschen transparent und idiomatisch bewahrt.
- source_word: יַעֲמָס לָנוּ
  choice: der uns … trägt
  rationale: עמס bezeichnet das Beladen oder Tragen; לָנוּ heißt formal „für uns“, während ein ausdrückliches Objekt fehlt. „Der uns … trägt“ gibt im Kontext die stützende Tätigkeit Gottes natürlich wieder, ohne die traditionell ergänzten „Wohltaten“ in den Haupttext aufzunehmen; die syntaktische Unbestimmtheit bleibt in der Fußnote sichtbar.
- source_word: הָאֵל
  choice: Gott
  rationale: אֵל ist hier eine Gottesbezeichnung. Der Artikel verlangt im natürlichen Deutschen keine Wiedergabe als „der Gott“.
- source_word: יְשׁוּעָתֵנוּ
  choice: unsere Rettung
  rationale: Das Substantiv bezeichnet Rettung oder Befreiung. „Rettung“ bewahrt die Breite des hebräischen Ausdrucks und passt zur prädikativen deutschen Formulierung.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und liturgische Funktion des Ausdrucks nicht sicher feststehen, wird er traditionell transliteriert.
theological_decisions:
- issue: Deutung der verkürzten Wendung יַעֲמָס לָנוּ
  choice: Gott wird als der gepriesen, der sein Volk Tag für Tag trägt.
  alternative: 'Möglich sind auch: „der Tag für Tag unsere Last trägt“, „der Tag für Tag für uns trägt“ oder traditionell „der uns täglich mit Wohltaten belädt“.'
  rationale: Das Verb umfasst Beladen und Tragen, doch das Getragene oder Aufgeladene wird nicht ausdrücklich genannt; לָנוּ bedeutet formal „für uns“. Der Haupttext wählt eine im Deutschen klare, kontextgerechte Aussage über Gottes tragende Hilfe, während die Fußnote die echte sprachliche Mehrdeutigkeit offenhält.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Der Gedankenstrich bildet die knappe hebräische Apposition ab; „Sela“ bleibt wegen seiner unsicheren Bedeutung unübersetzt.
