  text: so that your foot may crush them in blood[b][a], and the tongue of your dogs may have its portion from the enemies.
translation:
  language: de
  text: damit dein Fuß sie im Blut zermalmt[a] und die Zunge deiner Hunde ihren Anteil an den Feinden erhält.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen ist das Objekt von »zermalmt« nicht ausdrücklich genannt; »sie« ist aus dem Zusammenhang, den Feinden, ergänzt.
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Versschluss ist schwierig und elliptisch. מִנֵּהוּ bedeutet formal »von ihm/davon«; seine genaue syntaktische Beziehung ist unsicher. Die Übersetzung versteht die Wendung als Anteil der Hunde an den besiegten Feinden.
    reason: textual_difficulty
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Gibt den Zweck- oder Folgesinn der Konjunktion knapp und natürlich wieder.
- source_word: תִּמְחַץ
  choice: zermalmt
  rationale: Bewahrt die heftige Bildsprache von מחץ. Das hebräische Verb kann transitiv verstanden werden, doch ein ausdrückliches Objekt fehlt; die deutsche Fassung lässt diese Ellipse bestehen.
- source_word: רַגְלְךָ
  choice: dein Fuß
  rationale: Bewahrt den Singular und die Anrede in der zweiten Person Maskulinum Singular.
- source_word: בְּדָם
  choice: im Blut
  rationale: Gibt die Präposition ב relativ wörtlich wieder und erhält das konkrete Schlachtbild.
- source_word: לְשׁוֹן כְּלָבֶיךָ
  choice: die Zunge deiner Hunde
  rationale: Bewahrt den kollektiven Singular »Zunge« bei pluralischem »Hunde«.
- source_word: מֵאֹיְבִים מִנֵּהוּ
  choice: ihren Anteil von den Feinden bekommt
  rationale: Der Versschluss ist schwierig und elliptisch. Die Wiedergabe folgt einer kontextuell plausiblen Deutung, nach der die Hunde Beute von den besiegten Feinden erhalten, ohne die Unsicherheit zu verschweigen.
theological_decisions:
- issue: Gewaltsame Siegesbildsprache
  choice: Das konkrete Bild von Fuß, Blut und Hunden bleibt erhalten.
  alternative: Die Aussage zu einem allgemeinen Bild des Sieges abschwächen.
  rationale: Der hebräische Text verwendet bewusst drastische Schlachtbilder; eine theologische Glättung wäre nicht vom Ausgangstext gedeckt.
- issue: Nicht ausdrücklich genanntes Objekt von תִּמְחַץ
  choice: Im Haupttext kein Objekt ergänzen.
  alternative: »damit dein Fuß sie im Blut zermalmt«
  rationale: Im Hebräischen steht kein ausdrückliches Objekt. Die Ellipse bleibt im Haupttext gewahrt; die kontextuell naheliegende Ergänzung »sie« wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Bildsprache und die grammatische Ellipse werden bewahrt; die schwer verständliche Schlusswendung wird im Haupttext behutsam verständlich gemacht und in der Fußnote offengelegt.
