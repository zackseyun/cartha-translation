id: PSA.68.31
reference: Psalms 68:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יֶאֱתָ֣יוּ חַ֭שְׁמַנִּים מִנִּ֣י מִצְרָ֑יִם כּ֥וּשׁ תָּרִ֥יץ יָ֝דָ֗י/ו לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/031.yaml
  text: Nobles shall come from Egypt[b][a]; Cush shall quickly stretch out its hands to God.
translation:
  language: de
  text: Vornehme[a] werden aus Ägypten kommen; Kusch wird seine Hände rasch zu Gott ausstrecken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gesandte“ oder „Fürsten“. Das seltene hebräische Wort bezeichnet wahrscheinlich hochgestellte Personen aus Ägypten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Kusch wird sich beeilen, seine Hände zu Gott auszustrecken.“ Kusch wird als Nation in der Einzahl personifiziert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱתָיוּ
  choice: werden kommen
  rationale: Das Qal-Imperfekt in der 3. Person Plural bezeichnet hier am natürlichsten ein Kommen oder Eintreffen; eine ausdrückliche Erwähnung von Tribut wäre eine kontextuelle Ergänzung.
- source_word: חַשְׁמַנִּים
  choice: Vornehme
  rationale: Das seltene Substantiv bezeichnet im Zusammenhang wahrscheinlich hochgestellte Personen. „Vornehme“ wahrt diese Bedeutung, ohne ihre politische oder diplomatische Funktion näher festzulegen.
- source_word: מִנִּי מִצְרָיִם
  choice: aus Ägypten
  rationale: Die Präposition bezeichnet Herkunft; „aus Ägypten“ ist im modernen Deutschen die natürliche Formulierung.
- source_word: כּוּשׁ
  choice: Kusch
  rationale: Die Transliteration bewahrt den hebräischen Orts- beziehungsweise Volksnamen und vermeidet die Gleichsetzung mit einem späteren geografischen Gebilde.
- source_word: תָּרִיץ
  choice: wird … rasch … ausstrecken
  rationale: Das Hifil von רוץ vermittelt Eile oder Beschleunigung. In Verbindung mit „Hände“ ergibt sich idiomatisch das rasche Ausstrecken der Hände.
- source_word: יָדָיו
  choice: seine Hände
  rationale: Das Suffix steht in der 3. Person maskulin Singular und stimmt mit dem als personifizierte Nation aufgefassten Namen Kusch überein.
- source_word: לֵאלֹהִים
  choice: zu Gott
  rationale: Die Präposition bezeichnet die Ausrichtung der Geste auf Gott; „zu Gott“ ist hier knapp und natürlich.
theological_decisions:
- issue: Bedeutung des Ausstreckens der Hände zu Gott
  choice: Die Geste wird offen als Hinwendung zu Gott wiedergegeben, ohne sie ausschließlich als Gebet, Anbetung oder Unterwerfung zu bestimmen.
  alternative: Eine ausdrücklich diplomatische Tributleistung oder eine eng bestimmte Aussage über die vollständige Aufnahme in den Bund.
  rationale: Das Ausstrecken der Hände zu Gott kann Flehen, Gebet, Anbetung oder Unterwerfung ausdrücken. Der hebräische Text legt die genaue Bedeutung der Geste hier nicht eindeutig fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die seltene Personenbezeichnung wird verständlich, aber nicht überpräzise wiedergegeben; die Personifizierung Kuschs und die Offenheit der Handgeste bleiben erhalten.
