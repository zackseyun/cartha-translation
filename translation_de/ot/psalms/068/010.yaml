  text: חַיָּתְ/ךָ֥ יָֽשְׁבוּ בָ֑/הּ תָּ֤כִ֥ין בְּ/טוֹבָתְ/ךָ֖ לֶ/עָנִ֣י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/010.yaml
  text: Your creatures settled in it; in your goodness[a], O God, you provided for the poor.
translation:
  language: de
  text: Deine Geschöpfe[a] ließen sich darin nieder; in deiner Güte sorgtest du für den Armen, Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ist hier schwer zu deuten; möglich sind auch „deine Lebewesen“, „deine Schar“ oder „deine Gemeinde“.
    reason: alternative_reading
lexical_decisions:
- source_word: חַיָּתְךָ
  choice: deine Geschöpfe
  rationale: חַיָּה bezeichnet grundsätzlich ein Lebewesen oder Tier und kann hier kollektiv gebraucht sein. „Geschöpfe“ wahrt den breiten, belebten Sinn, ohne die schwierige Stelle vorschnell ausschließlich auf eine Herde oder Gemeinde festzulegen.
- source_word: יָשְׁבוּ בָהּ
  choice: ließen sich darin nieder
  rationale: ישׁב kann „sitzen“, „wohnen“ oder „sich niederlassen“ bedeuten. Die Formulierung bezeichnet hier das Beziehen des zuvor genannten Landes oder Erbteils; das feminine Suffix wird mit „darin“ wiedergegeben.
- source_word: תָּכִין
  choice: sorgtest du
  rationale: כון im Hifil bedeutet „bereiten“, „bereitstellen“ oder „fest einrichten“. Zusammen mit לֶעָנִי drückt es idiomatisch Gottes Fürsorge beziehungsweise Versorgung aus.
- source_word: בְּטוֹבָתְךָ
  choice: in deiner Güte
  rationale: טוֹבָה bezeichnet Güte, Wohltat oder Fülle. „In deiner Güte“ bewahrt die Präposition und lässt sowohl Gottes gute Gesinnung als auch seine Wohltätigkeit anklingen.
- source_word: לֶעָנִי
  choice: für den Armen
  rationale: עָנִי kann einen Armen, Bedürftigen oder Bedrängten bezeichnen. Im Zusammenhang der Versorgung ist „der Arme“ eine direkte Wiedergabe des singularischen Ausdrucks.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das abschließende אֱלֹהִים ist als Anrede zu verstehen. Im heutigen Deutschen wirkt die unmarkierte Anrede „Gott“ natürlich und würdevoll.
theological_decisions:
- issue: Deutung von חַיָּתְךָ im schwierigen poetischen Zusammenhang
  choice: Breite kollektive Wiedergabe als „deine Geschöpfe“
  alternative: „deine Lebewesen“, „deine Schar“ oder „deine Gemeinde“
  rationale: Der hebräische Ausdruck kann wörtlich auf Lebewesen oder Tiere weisen, wird hier aber möglicherweise kollektiv für Gottes Volk beziehungsweise seine Schar gebraucht. Der Haupttext wahrt den Grundsinn; die Fußnote legt die möglichen menschlich-kollektiven Deutungen offen, ohne die Mehrdeutigkeit dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. „Ließen sich darin nieder“ stellt den Bezug auf das zuvor erwähnte Land natürlich her; die Schlussanrede „Gott“ bleibt bewusst schlicht.
