  text: In the assemblies[a], bless God, the Lord[b], from the fountain of Israel.
translation:
  language: de
  text: Preist in den Versammlungen Gott, Jahwe, ihr aus Israels Quelle![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung »aus Israels Quelle« ist elliptisch: Ein ausdrückliches Bezugswort fehlt. Sie kann die Angeredeten als aus Israel Stammende bezeichnen; möglich ist auch ein engerer Anschluss an den Aufruf. »Quelle« kann zugleich im Sinn von »Ursprung« verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמַקְהֵלוֹת
  choice: In den Versammlungen
  rationale: Der Plural bezeichnet zusammengekommene Gruppen. »Versammlungen« wahrt den Plural, ohne einen spezifisch kirchlichen Institutionsbegriff einzutragen.
- source_word: בָּרְכוּ
  choice: preist
  rationale: Der Pluralimperativ von ברך bedeutet bei Gott als Objekt, ihn im Gottesdienst segnend zu rühmen. Das natürliche deutsche »preist« gibt diese Funktion verständlich wieder; das wörtlichere »segnet« wäre möglich, klingt im heutigen Deutsch gegenüber Gott jedoch missverständlich.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Bezeichnung ist hier singularisch und steht neben dem Gottesnamen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text bietet ausdrücklich das Tetragramm; »Jahwe« gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: מִמְּקוֹר יִשְׂרָאֵל
  choice: ihr aus Israels Quelle
  rationale: מָקוֹר bezeichnet Quelle oder Ursprung. Die elliptische Wendung wird plausibel als Anrede an die aus Israel Stammenden verstanden; die Bildsprache »Quelle« bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der masoretische Text den Gottesnamen selbst enthält, wahrt die Transliteration den Unterschied zwischen Name und Titel.
- issue: Bezug der elliptischen Wendung מִמְּקוֹר יִשְׂרָאֵל
  choice: 'Anrede an die Gottesdienstgemeinde: »ihr aus Israels Quelle«'
  alternative: 'adverbial an den Aufruf angeschlossen: »aus Israels Quelle«'
  rationale: Im Hebräischen fehlt ein ausdrückliches Bezugswort. Die Anrede ergibt einen verständlichen deutschen Satz, ohne die alternative syntaktische Zuordnung zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kurze poetische Aufruf bleibt knapp; die Ellipse wird im Haupttext behutsam verdeutlicht und in der Fußnote offengelegt.
