  text: קִדְּמ֣וּ שָׁ֭רִים אַחַ֣ר נֹגְנִ֑ים בְּ/ת֥וֹךְ עֲ֝לָמ֗וֹת תּוֹפֵפֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/025.yaml
  text: The singers went before[a], the musicians after[b], in the midst of young women beating tambourines.
translation:
  language: de
  text: Vorn gingen die Sänger, danach die Musiker, inmitten junger Frauen, die Tamburine schlugen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִדְּמוּ
  choice: vorn gingen
  rationale: Das Piel Perfekt beschreibt hier die Sänger an der Spitze des Festzugs. „Vorn gingen“ gibt sowohl die Bewegung als auch die räumliche Anordnung natürlich wieder.
- source_word: שָׁרִים
  choice: die Sänger
  rationale: Die Form gehört zu שׁיר („singen“), nicht zu שׂר („Fürst“). Der Parallelismus mit den Instrumentalisten und das Prozessionsbild sprechen eindeutig für Sänger.
- source_word: אַחַר
  choice: danach
  rationale: Kennzeichnet die nachfolgende Position beziehungsweise Reihenfolge im Zug; „danach“ ist knapp und in diesem Kontext natürlich.
- source_word: נֹגְנִים
  choice: die Musiker
  rationale: Das Wort bezeichnet Personen, die Instrumente spielen. „Musiker“ ist im modernen Deutsch verständlich und passt zum poetischen Gegenüber „Sänger“.
- source_word: בְּתוֹךְ
  choice: inmitten
  rationale: Bewahrt die räumliche Vorstellung, dass sich die jungen Frauen mitten im Festzug beziehungsweise zwischen den genannten Gruppen befanden.
- source_word: עֲלָמוֹת
  choice: junger Frauen
  rationale: Bezeichnet junge Frauen im heiratsfähigen Alter. „Junge Frauen“ ist präzise und modern; „Jungfrauen“ würde sexuelle Unberührtheit stärker festlegen, als das Wort hier verlangt.
- source_word: תּוֹפֵפוֹת
  choice: die Tamburine schlugen
  rationale: Die denominative Form beschreibt das Spielen beziehungsweise Schlagen von תֹּף-Handtrommeln. „Tamburine schlugen“ gibt den hörbaren, rhythmischen Vorgang anschaulich wieder.
