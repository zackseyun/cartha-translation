base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/016.yaml
  text: Why do you leap about[a], O many-peaked mountains, at the mountain God desired for his dwelling? Indeed, Yahweh will dwell there forever.
translation:
  language: de
  text: Warum blickt ihr neidisch[a], ihr gipfelreichen Berge, auf den Berg, den Gott als Wohnstätte begehrt hat? Ja, Jahwe wird dort für immer wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum hüpft ihr umher, ihr gipfelreichen Berge?“ Das hebräische Verb ist selten und in seiner Bedeutung unsicher; es kann ein Springen oder Hüpfen, möglicherweise aber auch einen neidischen oder argwöhnischen Blick bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַצְּדוּן
  choice: blickt ihr neidisch
  rationale: Das seltene und unsichere Verb kann möglicherweise eine springende Bewegung oder einen missgünstigen, argwöhnischen Blick bezeichnen. Im rhetorischen Gegensatz zwischen den mächtigen Bergen und Gottes begehrtem Berg ist die zweite Deutung im Deutschen verständlicher; die Bewegungsdeutung bleibt in der Fußnote erhalten.
- source_word: הָרִים גַּבְנֻנִּים
  choice: gipfelreiche Berge
  rationale: Die Form bezeichnet wahrscheinlich Berge mit ausgeprägten Rücken, Erhebungen oder zahlreichen Gipfeln. „Gipfelreich“ bewahrt das anschauliche Bild, ohne es auf bloße Höhe zu reduzieren.
- source_word: הָהָר
  choice: den Berg
  rationale: Der bestimmte Ausdruck verweist auf den im Zusammenhang gemeinten Berg. Der Name Zion wird nicht ergänzt, da er in diesem Vers nicht ausdrücklich steht.
- source_word: חָמַד
  choice: begehrt hat
  rationale: Das Verb bezeichnet Begehren, Verlangen oder Gefallen. „Begehrt“ bleibt näher am hebräischen Ausdruck als das stärker deutende „erwählt“.
- source_word: לְשִׁבְתּוֹ
  choice: als Wohnstätte
  rationale: Die Infinitivkonstruktion bezeichnet den Zweck beziehungsweise die Bestimmung des Berges als Ort, an dem Gott wohnen will.
- source_word: אַף
  choice: Ja
  rationale: Hier bekräftigt die Partikel die folgende Aussage, statt lediglich etwas Zusätzliches anzufügen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יִשְׁכֹּן לָנֶצַח
  choice: wird dort für immer wohnen
  rationale: שׁכן bezeichnet dauerhaftes Wohnen oder Sich-Niederlassen. „Dort“ ergibt sich aus dem unmittelbar genannten Berg; לָנֶצַח bezeichnet unbegrenzte Dauer.
theological_decisions:
- issue: Ausdrückliche Identifikation des Berges mit Zion
  choice: Im Haupttext steht lediglich „den Berg“.
  alternative: „den Berg Zion“
  rationale: Der weitere Psalmzusammenhang legt Zion nahe, doch der hebräische Wortlaut dieses Verses nennt nur den bestimmten Berg. Die Übersetzung fügt den Eigennamen daher nicht ein.
- issue: Rhetorischer Gegensatz zwischen den Bergen und Gottes begehrtem Berg
  choice: Das seltene Verb wird im Haupttext als neidischer Blick verstanden.
  alternative: Eine Bewegungsbedeutung wie „springen“ oder „hüpfen“
  rationale: Der Kontext erlaubt eine missgünstige Reaktion der rivalisierenden Berge, doch die lexikalische Unsicherheit wird nicht verschwiegen, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt lebendig und verständlich; das seltene Verb wird kontextgerecht wiedergegeben, seine echte Mehrdeutigkeit jedoch durch die Fußnote offengehalten.
