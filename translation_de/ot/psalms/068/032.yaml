  text: מַמְלְכ֣וֹת הָ֭/אָרֶץ שִׁ֣ירוּ לֵ/אלֹהִ֑ים זַמְּר֖וּ אֲדֹנָ֣/י סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/032.yaml
  text: Kingdoms of the earth[a], sing to God; sing praises to the Lord—Selah
translation:
  language: de
  text: 'Königreiche der Erde, singt Gott;

    lobsingt dem Herrn[a] – Sela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: spielt dem Herrn.'
    reason: זמר kann neben preisendem Singen auch instrumentales Musizieren bezeichnen.
lexical_decisions:
- source_word: מַמְלְכוֹת הָאָרֶץ
  choice: Ihr Königreiche der Erde
  rationale: Die Anrede richtet sich umfassend an die politischen Reiche der ganzen Erde. Das vorangestellte „Ihr“ macht den deutschen Vokativ natürlich, ohne den Sinn zu erweitern.
- source_word: שִׁירוּ לֵאלֹהִים
  choice: singt Gott
  rationale: Der Pluralimperativ fordert zum Singen auf; ל bezeichnet hier den Empfänger beziehungsweise Adressaten des Gesangs. Der knappe Dativ bewahrt die poetische Parallelität.
- source_word: זַמְּרוּ
  choice: lobsingt
  rationale: Das Piel von זמר bezeichnet musikalisches, besonders preisendes Singen oder Spielen. „Lobsingt“ gibt den gottesdienstlichen Klang prägnant wieder; die mögliche instrumentale Nuance wird in der Fußnote genannt.
- source_word: אֲדֹנָי
  choice: dem Herrn
  rationale: אֲדֹנָי ist der göttliche Titel „Herr“, nicht der Gottesname יהוה. Der deutsche Dativ ergibt sich aus dem parallel verstandenen Aufruf zum Lobgesang.
- source_word: סֶלָה
  choice: Sela
  rationale: Die genaue Funktion des liturgisch-musikalischen Ausdrucks ist unsicher; daher wird er traditionsgemäß transliteriert und nicht ausdeutend übersetzt.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנָי
  choice: dem Herrn
  alternative: Herr
  rationale: Der Text verwendet den Titel אֲדֹנָי und nicht das Tetragramm. Deshalb steht „Herr“ in normaler Schreibung; der Artikel und der Dativ dienen der natürlichen deutschen Syntax.
- issue: Verhältnis der beiden Lobaufforderungen
  choice: „singt Gott; lobsingt dem Herrn“ als parallele Aussagen
  alternative: 'אֲדֹנָי als direkte Anrede: „spielt, o Herr“'
  rationale: Der poetische Parallelismus und der übliche Gebrauch von זמר mit einer göttlichen Zielangabe sprechen dafür, „dem Herrn“ als sinngemäßes Gegenstück zu „Gott“ zu verstehen, obwohl vor אֲדֹנָי keine Präposition steht.
translation_notes:
  register: Moderne, würdige Psalmsprache mit knapper poetischer Parallelität. „Lobsingt“ ist leicht gehoben, aber im gottesdienstlichen Zusammenhang verständlich. Die Zeilentrennung folgt den beiden parallelen Imperativen.
