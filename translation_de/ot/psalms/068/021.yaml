  text: אַךְ אֱלֹהִ֗ים יִמְחַץ֮ רֹ֤אשׁ אֹ֫יְבָ֥י/ו קָדְקֹ֥ד שֵׂעָ֑ר מִ֝תְהַלֵּ֗ךְ בַּ/אֲשָׁמָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/021.yaml
  text: Surely God will crush the head of his enemies[a], the hairy crown of the one who walks in his guilt.
translation:
  language: de
  text: Ja, Gott wird seinen Feinden den Kopf zerschmettern, den behaarten Scheitel dessen, der in seiner Schuld einhergeht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den behaarten Schädel dessen, der in seinen Vergehen weitergeht“.'
    reason: Lexikalische Alternativen für קָדְקֹד und בַּאֲשָׁמָיו sowie der fortdauernde Aspekt von מִתְהַלֵּךְ.
lexical_decisions:
- source_word: אַךְ
  choice: Ja
  rationale: Die Partikel bekräftigt hier nachdrücklich die Aussage. „Ja“ gibt diese Gewissheit natürlich und würdevoll wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Trotz der formal pluralischen Gestalt bezeichnet das Wort wegen des singularischen Verbs den Gott Israels.
- source_word: יִמְחַץ
  choice: wird … zerschmettern
  rationale: Das Verb bezeichnet gewaltsames Zerschlagen oder Zerquetschen; „zerschmettern“ bewahrt die Wucht des Gerichtsbildes.
- source_word: רֹאשׁ
  choice: Kopf
  rationale: Das konkrete Körperbild bleibt erhalten.
- source_word: אֹיְבָיו
  choice: seinen Feinden
  rationale: Der maskuline Singularsuffix bezieht sich im unmittelbaren Satzgefüge am natürlichsten auf Gott.
- source_word: קָדְקֹד שֵׂעָר
  choice: den behaarten Scheitel
  rationale: קָדְקֹד bezeichnet den oberen Teil des Kopfes, שֵׂעָר charakterisiert ihn als behaart. Die kompakte, anschauliche Parallelzeile wird bewahrt.
- source_word: מִתְהַלֵּךְ
  choice: dessen, der … einhergeht
  rationale: Das Partizip bezeichnet fortgesetztes oder charakteristisches Verhalten. „Einhergeht“ erhält das hebräische Bild des Wandelns, ohne bloß eine einzelne Bewegung auszudrücken.
- source_word: בַּאֲשָׁמָיו
  choice: in seiner Schuld
  rationale: Das Substantiv kann Schuld, Verschuldung oder schuldhafte Vergehen bezeichnen. Die singularische und bewusst offene Formulierung „in seiner Schuld“ vermeidet eine unnötige Festlegung auf einzelne Taten.
theological_decisions:
- issue: Bezug des Pronominalsuffixes in אֹיְבָיו
  choice: '„seinen Feinden“: Der Suffix bezieht sich auf Gott.'
  alternative: Allgemeiner Bezug auf die Feinde des göttlichen Königs oder des Gottesvolkes.
  rationale: Gott ist das unmittelbar vorausgehende Subjekt des singularischen Verbs und damit der natürlichste Bezugspunkt; ein engerer nationaler oder messianischer Bezug wird nicht ergänzt.
- issue: Bedeutung von בַּאֲשָׁמָיו
  choice: „in seiner Schuld“
  alternative: „in seinen Vergehen“ oder „in seinen schuldhaften Taten“
  rationale: Die Wendung kann sowohl einen Schuldzustand als auch schuldhaftes Verhalten bezeichnen. Die Übersetzung wahrt diese Spannung, während der Zusammenhang mit dem Partizip fortgesetztes schuldhaftes Leben anklingen lässt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, poetischem Ton. Die kräftige Gerichtssprache und der Parallelismus von „Kopf“ und „Scheitel“ bleiben erhalten; die ethische Metapher des Gehens wird nicht aufgelöst.
