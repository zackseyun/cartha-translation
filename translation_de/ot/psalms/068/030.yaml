  text: גְּעַ֨ר חַיַּ֪ת קָנֶ֡ה עֲדַ֤ת אַבִּירִ֨ים בְּ/עֶגְלֵ֬י עַמִּ֗ים מִתְרַפֵּ֥ס בְּ/רַצֵּי כָ֑סֶף בִּזַּ֥ר עַ֝מִּ֗ים קְרָב֥וֹת יֶחְפָּֽצוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/030.yaml
  text: Rebuke the beast of the reeds[a], the herd of bulls among the calves of the peoples, trampling on pieces of silver[b]. Scatter the peoples who delight in wars.
translation:
  language: de
  text: Weise das Tier im Schilf[a] zurecht, die Herde der Stiere inmitten der Kälber der Völker, die auf Silberstücken trampelt[b]. Zerstreue die Völker, die Gefallen an Kriegen haben!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das wilde Tier im Schilf“. Gemeint sein könnte bildlich Ägypten oder eine andere feindliche Macht.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut dieses Satzteils ist schwierig. Möglich ist auch: „die sich mit Silberstücken unterwirft“ oder „die sich mit Silberbarren niederwirft“, also Tribut darbringt.'
    reason: alternative_reading
lexical_decisions:
- source_word: גְּעַר
  choice: Bedrohe
  rationale: Der Imperativ von גער bezeichnet ein machtvolles Schelten oder Bedrohen, das feindliche Mächte in die Schranken weist. „Bedrohe“ bewahrt hier die kraftvolle göttliche Machtausübung, ohne bereits „vernichte“ auszusagen.
- source_word: חַיַּת קָנֶה
  choice: das Tier im Schilf
  rationale: Die wörtliche Bildsprache („Tier des Schilfs“) bleibt erhalten. Sie kann ein gefährliches Sumpftier und bildlich eine feindliche Macht bezeichnen, ohne dass der Text diese ausdrücklich mit Ägypten identifiziert.
- source_word: עֲדַת אַבִּירִים
  choice: die Herde der Stiere
  rationale: עֲדָה bezeichnet eine Versammlung oder Gruppe; אַבִּירִים kann „Starke“ oder im Tierbild „Stiere“ bedeuten. „Herde der Stiere“ führt das Tierbild des Verses natürlich fort.
- source_word: בְּעֶגְלֵי עַמִּים
  choice: unter den Kälbern der Völker
  rationale: ב wird räumlich-assoziativ als „unter“ verstanden; עֶגְלֵי bedeutet „Kälber“. Das Bild kann untergeordnete Herrscher oder Völker darstellen, wird aber in der Übersetzung nicht aufgelöst.
- source_word: מִתְרַפֵּס בְּרַצֵּי כָסֶף
  choice: die auf Silberstücken herumtrampelt
  rationale: Die Wendung ist lexikalisch und syntaktisch schwierig. Die gewählte Fassung folgt der möglichen Bedeutung eines gewaltsamen Tretens und passt zum feindlichen Tierbild; die wichtige Deutung als Unterwerfung beziehungsweise Tributzahlung steht in der Fußnote.
- source_word: בִּזַּר
  choice: Zerstreue
  rationale: Obwohl die masoretische Punktierung formal eine Perfektform nahelegt, wird sie im poetischen Zusammenhang als Fortsetzung der eröffnenden Bitte verstanden. Der deutsche Imperativ gibt diesen Zusammenhang klar wieder; die formal mögliche Vergangenheitslesart wird in einer Fußnote genannt.
- source_word: קְרָבוֹת יֶחְפָּצוּ
  choice: die Gefallen an Kriegen haben
  rationale: Die Wendung bezeichnet Völker, die Kämpfe oder Kriege wünschen und daran Freude haben. Die Formulierung ist natürliches, würdevolles Deutsch und erhält die moralische Wertung.
theological_decisions:
- issue: Identität des „Tieres im Schilf“
  choice: Das Bild bleibt im Haupttext unaufgelöst.
  alternative: Ausdrückliche Identifizierung mit Ägypten oder allgemein mit einer feindlichen Großmacht.
  rationale: Der Schilf- und Sumpfbezug kann besonders an Ägypten denken lassen, doch der hebräische Vers nennt Ägypten nicht. Die metaphorische Offenheit soll erhalten bleiben.
- issue: Bedeutung von מִתְרַפֵּס in Verbindung mit Silber
  choice: Gewaltsames Herumtrampeln im Haupttext.
  alternative: Sich mit Silberstücken unterwerfen oder sich mit Silberbarren niederwerfen, also Tribut entrichten.
  rationale: Die Form ist umstritten. Das feindliche Tierbild und die abschließende Bitte gegen kriegslustige Völker stützen die gewählte Fassung; die Unterwerfungs- und Tributdeutung ist jedoch textlich gewichtig und wird ausdrücklich dokumentiert.
- issue: Verbform בִּזַּר
  choice: Als bittender Imperativ im poetischen Zusammenhang wiedergegeben.
  alternative: 'Als Perfekt: „Er hat die Völker zerstreut“ oder „Du hast die Völker zerstreut“.'
  rationale: Die eröffnende Aufforderung und der Inhalt des Verses sprechen für eine fortgesetzte Bitte. Die Morphologie lässt dennoch eine Vergangenheitslesart zu, die in der Fußnote bewahrt wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Ton. Die Tiermetaphorik und die knappen Aufforderungen des Hebräischen bleiben erhalten; historisch-theologische Identifizierungen werden nicht in den Haupttext eingetragen.
