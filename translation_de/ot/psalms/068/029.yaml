lexical_decisions:
- source_word: מֵהֵיכָלֶךָ
  choice: Von deinem Tempel … her
  rationale: מִן bezeichnet zunächst Herkunft oder Ausgangspunkt; הֵיכָל meint hier den Tempel. Die deutsche Wendung bewahrt diesen räumlichen Grundsinn, ohne die mögliche kausale Deutung auszuschließen, die in der Fußnote genannt wird.
- source_word: עַל יְרוּשָׁלִָם
  choice: über Jerusalem
  rationale: עַל hat den räumlichen Grundsinn „auf, über“. „Über Jerusalem“ gibt die erhöhte Lage des Tempels wieder und bleibt näher am Hebräischen als eine bloße Ortsangabe wie „in Jerusalem“.
- source_word: לְךָ
  choice: dir
  rationale: Das Pronomen bezeichnet den Empfänger dessen, was die Könige bringen; im Deutschen verlangt „bringen“ hier natürlich den Dativ.
- source_word: יוֹבִילוּ
  choice: werden … bringen
  rationale: Der Hifil von יבל kann „bringen, herbeiführen“ bedeuten. Zusammen mit שַׁי ist „bringen“ idiomatisch und sachlich passend.
- source_word: מְלָכִים
  choice: Könige
  rationale: Die direkte Entsprechung bewahrt das königliche und internationale Bild des Verses.
- source_word: שַׁי
  choice: Tribut
  rationale: שַׁי bezeichnet eine Gabe oder ein Geschenk, das besonders einem Höhergestellten dargebracht wird. „Tribut“ bringt in diesem Zusammenhang die politische und ehrerbietige Nuance zum Ausdruck.
theological_decisions:
- issue: Syntaktische Beziehung von Tempel, Jerusalem und dem Bringen der Gabe
  choice: 'Die Hauptfassung versteht מִן räumlich als „von … her“ und עַל als „über“: „Von deinem Tempel über Jerusalem her“.'
  alternative: „Wegen deines Tempels in Jerusalem werden Könige dir Gaben bringen.“
  rationale: Der knappe hebräische Satz erlaubt sowohl eine räumliche als auch eine kausale Auffassung von מִן; ebenso kann עַל in diesem Zusammenhang freier als Ortsangabe verstanden werden. Die Hauptfassung bewahrt die konkreten Grundbedeutungen der Präpositionen, während die Fußnote die verbreitete alternative Syntax offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche räumliche Formulierung bleibt bewusst nahe am Hebräischen; die alternative, flüssigere kausale Deutung wird transparent in der Fußnote geboten.
