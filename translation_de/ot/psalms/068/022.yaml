source:
  edition: WLC
  text: אָמַ֣ר אֲ֭דֹנָ/י מִ/בָּשָׁ֣ן אָשִׁ֑יב אָ֝שִׁ֗יב מִֽ/מְּצֻל֥וֹת יָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/022.yaml
  text: The Lord said[a], “I will bring them back from Bashan; I will bring them back from the depths of the sea,”
translation:
  language: de
  text: 'Der Herr sagte[a]: »Aus Baschan werde ich sie zurückbringen, aus den Tiefen des Meeres werde ich sie zurückbringen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Aus Baschan werde ich zurückbringen; aus den Tiefen des Meeres werde ich zurückbringen.« Im Hebräischen bleibt das Objekt unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Das hebräische אֲדֹנָי ist ein Gottestitel, nicht der Gottesname JHWH. »Der Herr« ist die natürliche und würdige deutsche Wiedergabe.
- source_word: אָמַר
  choice: sagte
  rationale: Das Qatal leitet hier unmittelbar die göttliche Rede ein; »sagte« gibt dies schlicht und direkt wieder.
- source_word: מִבָּשָׁן
  choice: aus Baschan
  rationale: Die Präposition bezeichnet die Herkunft beziehungsweise das Hervorholen aus einem Gebiet; »aus« ist im Deutschen bei dem folgenden »zurückbringen« idiomatisch. Der Ortsname wird als Baschan wiedergegeben.
- source_word: אָשִׁיב ... אָשִׁיב
  choice: werde ich sie zurückbringen ... werde ich sie zurückbringen
  rationale: Der Hifil von שׁוב bedeutet hier »zurückbringen«. Die Wiederholung wird zur Betonung bewahrt. Das Objekt »sie« ist im Hebräischen nicht ausgedrückt, wird aber für natürliches Deutsch aus dem Kontext ergänzt.
- source_word: מִמְּצֻלוֹת יָם
  choice: aus den Tiefen des Meeres
  rationale: מְצֻלוֹת bezeichnet tiefe Stellen, besonders Wassertiefen. Die Formulierung bewahrt das Bild äußerster Ferne oder Unzugänglichkeit; יָם wird allgemein als »Meer« verstanden.
theological_decisions:
- issue: Unausgesprochenes Objekt des wiederholten Verbs אָשִׁיב
  choice: Das Objekt »sie« wird im Haupttext ergänzt.
  alternative: 'Formal ohne ausgedrücktes Objekt: »Aus Baschan werde ich zurückbringen; aus den Tiefen des Meeres werde ich zurückbringen.«'
  rationale: Der hebräische Text lässt das Objekt offen. Da »zurückbringen« im Deutschen normalerweise ein Objekt verlangt, wird »sie« kontextgemäß ergänzt. Die Fußnote macht kenntlich, dass diese Ergänzung nicht ausdrücklich im Hebräischen steht, und bewahrt so die echte syntaktische Offenheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die parallele Wiederholung des Verbs bleibt erhalten; die Satzstellung hebt entsprechend dem Hebräischen die beiden Herkunftsangaben hervor.
