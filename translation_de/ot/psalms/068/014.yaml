base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/014.yaml
  text: When the Almighty scattered kings there, it snowed on Zalmon.
translation:
  language: de
  text: Als der Allmächtige dort[a] Könige zerstreute, schneite es auf dem Zalmon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in ihr“; worauf sich das feminine Pronomen bezieht, bleibt hier unausgesprochen.'
    reason: Bewahrt die grammatische Form und die echte Unbestimmtheit des hebräischen Bezugs.
  - marker: b
    text: 'Die hebräische Verbform kann auch als 2. Person Maskulinum verstanden werden; außerdem kann das Schneemotiv bildhaft gemeint sein, etwa: „Am Zalmon wurde es schneeweiß“.'
    reason: Dokumentiert die grammatische und bildsprachliche Mehrdeutigkeit, ohne eine kausative Bedeutung als gesichert darzustellen.
lexical_decisions:
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: Die traditionelle und kontextuell passende Wiedergabe des Gottesnamens bzw. Gottesepithetons Schaddai.
- source_word: מְלָכִים
  choice: Könige
  rationale: Direkte Wiedergabe des hebräischen Plurals.
- source_word: בָּהּ
  choice: dort
  rationale: Das feminine Pronomen bedeutet wörtlich „in ihr“; da sein Bezug im unmittelbaren Vers nicht genannt wird, gibt „dort“ den lokalen Sinn natürlich wieder, ohne einen Bezug ausdrücklich zu ergänzen.
- source_word: תַּשְׁלֵג
  choice: schneite es
  rationale: Die Verbform kann unpersönlich als Schneefall verstanden werden und entspricht der naheliegenden Lesart des Satzes; eine bildhafte Deutung bleibt in der Fußnote sichtbar.
- source_word: צַלְמוֹן
  choice: Zalmon
  rationale: Der Orts- oder Bergname wird in gebräuchlicher deutscher Form transliteriert.
theological_decisions:
- issue: Handelnder beim Zerstreuen der Könige
  choice: Der Allmächtige wird ausdrücklich als Handelnder wiedergegeben.
  alternative: Eine unpersönliche oder passive Formulierung.
  rationale: Der hebräische Text nennt שַׁדַּי direkt als Subjekt zu בְּפָרֵשׂ.
- issue: Deutung des Schneemotivs
  choice: Der Haupttext versteht die Formulierung als Schneefall auf dem Zalmon.
  alternative: „Da wurde es schneeweiß am Zalmon“ oder „du ließest es am Zalmon schneien“.
  rationale: Die knappe hebräische Form ist mehrdeutig. Der Haupttext folgt der syntaktisch gut möglichen unpersönlichen Wetterformulierung, während die Fußnote alternative Nuancen offenhält.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der knappe poetische Satzbau bleibt erhalten; erklärende Ergänzungen werden vermieden und textliche Mehrdeutigkeiten in Fußnoten ausgewiesen.
