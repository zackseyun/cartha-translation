source:
  edition: WLC
  text: צִוָּ֥ה אֱלֹהֶ֗י/ךָ עֻ֫זֶּ֥/ךָ עוּזָּ֥/ה אֱלֹהִ֑ים ז֝֗וּ פָּעַ֥לְתָּ לָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/028.yaml
  text: Your God has commanded your strength. Show strength[a], O God, you who have worked for us.
translation:
  language: de
  text: Dein Gott hat deine Stärke bestimmt. Zeige Stärke[a], Gott, du, der für uns gehandelt hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische עוּזָה ist schwierig. Es kann auch „Sei stark, Gott“ bedeuten oder – in Verbindung mit dem folgenden Vers – „Stärke, Gott, was du für uns getan hast“.
    reason: alternative_reading
lexical_decisions:
- source_word: צִוָּה
  choice: hat … aufgeboten
  rationale: Das Perfekt bezeichnet eine vollzogene Anordnung mit fortwirkender Bedeutung. In Verbindung mit „Stärke“ gibt „aufgeboten“ den autoritativen und aktivierenden Sinn natürlich wieder.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: אֱלֹהִים bezeichnet hier trotz seiner pluralischen Form den Gott Israels; das Suffix der 2. Person Singular ergibt „dein Gott“.
- source_word: עֻזֶּךָ
  choice: deine Stärke
  rationale: Das Substantiv bezeichnet Stärke oder Macht. „Stärke“ bewahrt die direkte nominale Aussage.
- source_word: עוּזָה
  choice: Zeige deine Macht
  rationale: Die schwierige imperativische Form wird als Bitte verstanden, Gottes Macht sichtbar zu erweisen. Die Ergänzung „deine“ ist im Deutschen idiomatisch, wird wegen der formalen und syntaktischen Unsicherheit jedoch in einer Fußnote erläutert.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Ausdruck ist vokativisch; im modernen Deutschen ist die Anrede „Gott“ ohne ein zusätzliches „o“ natürlich und würdig.
- source_word: זוּ
  choice: du, der
  rationale: Die Relativpartikel leitet eine auf den angeredeten Gott bezogene Beschreibung ein.
- source_word: פָּעַלְתָּ
  choice: gehandelt hat
  rationale: Das Verb bezeichnet wirksames Tun. „Gehandelt“ klingt im Deutschen natürlicher als „gearbeitet“ und lässt die Art des göttlichen Wirkens offen.
- source_word: לָּנוּ
  choice: für uns
  rationale: 'Die Präposition wird benefaktiv verstanden: Gottes Handeln geschah zugunsten seines Volkes.'
theological_decisions:
- issue: Mehrdeutige Form עוּזָה
  choice: Bitte an Gott, seine Macht zu zeigen
  alternative: „Sei stark, Gott“ oder, mit dem folgenden Vers verbunden, „Stärke, Gott, was du für uns getan hast“
  rationale: Die hebräische Form und ihre syntaktische Anbindung sind schwierig. Der Haupttext bietet eine verständliche Bitte innerhalb dieses Verses; die Fußnote bewahrt die echten Alternativen, ohne die Spannung dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aufgeboten“ wahrt den autoritativen Charakter des ersten Verbs, während „Zeige deine Macht“ die Bitte idiomatisch ausdrückt. Die schwierige hebräische Form wird im Haupttext lesbar wiedergegeben und in der Fußnote transparent offengehalten.
