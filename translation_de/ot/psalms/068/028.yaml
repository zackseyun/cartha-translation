review_pass:
  verdict: revise
  source_fidelity: 'Die Anrede und der benefaktive Sinn von „für uns“ sind zutreffend. „hat deine Stärke aufgeboten“ trifft צִוָּה jedoch nicht gut: Aufbieten bedeutet, vorhandene Kräfte einzusetzen oder zu mobilisieren, während das Hebräische eine Verfügung bzw. Bestimmung über die Stärke ausdrückt. Die Wiedergabe der schwierigen Form עוּזָה als Bitte, Stärke zu erweisen, ist vertretbar, sofern die Alternativen in der Anmerkung erhalten bleiben.'
  naturalness: 'Der Relativsatz muss bei direkter Anrede in der zweiten Person stehen: „du, der ... gehandelt hast“, nicht „gehandelt hat“. „Dein Gott hat deine Stärke bestimmt“ ist modernes, verständliches Standarddeutsch und wahrt den Dekretcharakter besser als „aufgeboten“.'
  terminology: „Stärke“ ist für עֻזֶּךָ passend. „Zeige Stärke“ gibt die in ihrer Form und Syntax unsichere Aufforderung knapp wieder, ohne ein im Hebräischen nicht ausgedrücktes Possessivpronomen einzutragen. „Gott“ als Vokativ ist angemessen.
  issues:
  - severity: medium
    issue: „hat deine Stärke aufgeboten“ verschiebt die Bedeutung von צִוָּה.
    rationale: „Aufbieten“ bezeichnet gewöhnlich das Mobilisieren bzw. Einsetzen von Kräften. צִוָּה bezeichnet hier das Anordnen/Bestimmen; „bestimmt“ bildet diese Aussage angemessener ab.
  - severity: high
    issue: Personenkongruenz im Relativsatz.
    rationale: 'Nach der Anrede „Gott, du, der“ verlangt das finite Verb die zweite Person Singular: „gehandelt hast“.'
  - severity: low
    issue: „deine Macht“ bei עוּזָה ist eine mögliche, aber zusätzliche possessive Explikation.
    rationale: Da die Form schwierig ist und kein Possessivsuffix trägt, ist „Zeige Stärke“ zurückhaltender; die Deutung als Aufforderung an Gott bleibt durch den Kontext und die Fußnote klar.
  revised_text: Dein Gott hat deine Stärke bestimmt. Zeige Stärke[a], Gott, du, der für uns gehandelt hast.
