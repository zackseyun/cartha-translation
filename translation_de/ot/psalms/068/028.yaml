revisions:
- from: Dein Gott hat deine Stärke aufgeboten. Zeige deine Macht[a], Gott, du, der für uns gehandelt hat.
  to: Dein Gott hat deine Stärke bestimmt. Zeige Stärke[a], Gott, du, der für uns gehandelt hast.
  rationale: Die Revision ersetzt die semantisch unpassende Mobilisierungsvorstellung von „aufgeboten“ durch „bestimmt“, korrigiert die zwingende zweite Person im Relativsatz und formuliert die Hauptlesart der schwierigen Form עוּזָה zurückhaltend. Die Fußnote bewahrt die wesentlichen alternativen Deutungen, einschließlich der versübergreifenden Lesart.
