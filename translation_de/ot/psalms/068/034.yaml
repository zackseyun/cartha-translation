id: PSA.68.34
reference: Psalms 68:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תְּנ֥וּ עֹ֗ז לֵֽ/אלֹ֫הִ֥ים עַֽל יִשְׂרָאֵ֥ל גַּאֲוָת֑/וֹ וְ֝/עֻזּ֗/וֹ בַּ/שְּׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/034.yaml
  text: Ascribe strength to God[a]; his majesty is over Israel[b], and his strength is in the skies.
translation:
  language: de
  text: Erkennt Gottes Stärke an[a]! Seine Hoheit ist über Israel, und seine Stärke ist in den Himmelsweiten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gebt Gott Stärke!“ Gemeint ist hier, Gottes Stärke anzuerkennen oder ihm Stärke zuzuschreiben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in den Wolken“ beziehungsweise „in den Himmeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: Erkennt … an
  rationale: נתן bedeutet wörtlich „geben“. In dieser poetischen Aufforderung bezeichnet es jedoch idiomatisch das anerkennende Zuschreiben von Gottes Stärke; „erkennt … an“ ist im modernen Deutsch natürlich und vermeidet den Eindruck, Menschen würden Gott Stärke verleihen.
- source_word: עֹז / וְעֻזּוֹ
  choice: Stärke / seine Stärke
  rationale: עֹז bezeichnet Stärke oder Macht. Die gleiche Wiedergabe an beiden Stellen bewahrt die bewusste Wiederholung und die poetische Verbindung.
- source_word: לֵאלֹהִים
  choice: Gottes
  rationale: Die deutsche Konstruktion „Gottes Stärke anerkennen“ gibt die durch ל markierte Zuordnung idiomatisch wieder.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: עַל bezeichnet hier am ehesten den Bereich, über dem sich Gottes Hoheit zeigt oder erstreckt. „Über Israel“ erhält zugleich die räumliche Parallelität zur folgenden Zeile.
- source_word: גַּאֲוָתוֹ
  choice: seine Hoheit
  rationale: גַּאֲוָה kann Stolz, Erhabenheit oder Hoheit bedeuten. Im Lob Gottes bezeichnet „Hoheit“ den positiven Sinn würdevoller Erhabenheit, ohne die negative Färbung von „Stolz“.
- source_word: בַּשְּׁחָקִים
  choice: in den Himmelsweiten
  rationale: שְׁחָקִים kann poetisch Wolken, Himmel oder die Höhen des Himmels bezeichnen. „Himmelsweiten“ wahrt das erhabene kosmische Bild, ohne die Bedeutung ausschließlich auf Wolken festzulegen.
theological_decisions:
- issue: Ob die Aufforderung besagt, Menschen gäben Gott buchstäblich Stärke
  choice: „Erkennt Gottes Stärke an“ als idiomatische Wiedergabe
  alternative: „Gebt Gott Stärke“
  rationale: Die poetische Aufforderung ruft dazu auf, Gottes vorhandene Stärke anzuerkennen und zu verkünden, nicht dazu, ihm etwas Fehlendes zuzuführen. Die Fußnote bewahrt dennoch die wörtliche Ausdrucksweise des Hebräischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Klang. Die Wiederholung von „Stärke“ bildet die hebräische Wiederaufnahme ab; „Himmelsweiten“ hält die Bildsprache bewusst offen.
