  source_fidelity: 'Die Übersetzung gibt die drei hebräischen Aussageglieder zuverlässig wieder: die Aufforderung, Gott Stärke zuzuschreiben bzw. anzuerkennen, seine positive גַּאֲוָה über Israel und seine עֹז in den שְׁחָקִים. „Erkennt Gottes Stärke an“ ist eine sachgerechte idiomatische Entfaltung von תְּנוּ עֹז לֵאלֹהִים und vermeidet die im Deutschen missverständliche Vorstellung, Gott werde Stärke verliehen.'
