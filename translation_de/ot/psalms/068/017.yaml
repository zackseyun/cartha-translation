  text: רֶ֤כֶב אֱלֹהִ֗ים רִבֹּתַ֣יִם אַלְפֵ֣י שִׁנְאָ֑ן אֲדֹנָ֥/י בָ֝֗/ם סִינַ֥י בַּ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/017.yaml
  text: The chariots of God are myriads[a], thousands upon thousands; the Lord is among them[c][b], Sinai in holiness.
translation:
  language: de
  text: Gottes Wagen sind Zehntausende, Tausende und Abertausende[a]; der Herr ist unter ihnen – Sinai in Heiligkeit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „zwei Zehntausende, Tausende von Schin''an“. Das seltene Wort שִׁנְאָן ist in seiner Bedeutung unsicher; wahrscheinlich drückt es Wiederholung oder Vielzahl aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Klausel ist stark verkürzt und schwer zu deuten. Möglich sind auch: „Der Herr ist unter ihnen wie am Sinai, in Heiligkeit“ oder „Der Herr ist vom Sinai ins Heiligtum gekommen“. „Im Heiligtum“ ist ebenfalls eine mögliche Wiedergabe von „in Heiligkeit“.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֶכֶב אֱלֹהִים
  choice: Gottes Wagen
  rationale: רֶכֶב kann kollektiv die Wagenmacht bezeichnen. „Gottes Wagen“ bewahrt das konkrete poetische Bild und gibt die Konstruktverbindung natürlich possessiv wieder.
- source_word: רִבֹּתַיִם
  choice: Zehntausende
  rationale: Die Dualform bezeichnet wörtlich etwa „zwei Zehntausende“, wirkt hier aber als poetischer Ausdruck einer sehr großen Menge. Der Plural vermeidet eine unangebrachte rechnerische Genauigkeit.
- source_word: אַלְפֵי שִׁנְאָן
  choice: Tausende und Abertausende
  rationale: שִׁנְאָן ist selten und unsicher; wahrscheinlich verstärkt es den Gedanken der Wiederholung oder Vielzahl. Die deutsche Wendung gibt diese wahrscheinliche Bedeutung idiomatisch wieder.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Das göttliche Herrschaftsprädikat wird im modernen Standarddeutsch angemessen mit „der Herr“ wiedergegeben.
- source_word: בָם
  choice: unter ihnen
  rationale: ב mit Suffix kann „in, unter, bei ihnen“ bedeuten. Im Zusammenhang der himmlischen Wagen ist „unter ihnen“ natürlich und wahrt die Vorstellung göttlicher Gegenwart.
- source_word: סִינַי
  choice: Sinai
  rationale: Der Ortsname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: בַּקֹּדֶשׁ
  choice: im Heiligtum
  rationale: קֹדֶשׁ kann abstrakt „Heiligkeit“ oder konkret einen heiligen Ort beziehungsweise das Heiligtum bezeichnen. „Im Heiligtum“ ergibt eine knappe, mögliche syntaktische Verbindung mit „Sinai“, ohne die schwierige Klausel durch eine nicht ausdrücklich genannte Bewegung zu ergänzen.
theological_decisions:
- issue: Deutung der komprimierten Klausel אֲדֹנָי בָם סִינַי בַּקֹּדֶשׁ
  choice: der Herr ist unter ihnen – Sinai im Heiligtum
  alternative: der Herr ist unter ihnen wie am Sinai, in Heiligkeit; der Herr ist vom Sinai ins Heiligtum gekommen
  rationale: Der hebräische Wortlaut ist elliptisch und syntaktisch mehrdeutig. Die Hauptfassung bewahrt seine knappe Spannung und vermeidet sowohl das ergänzte Vergleichswort „wie“ als auch ein im Text nicht ausdrücklich vorhandenes Bewegungsverb. Die wichtigsten Deutungsmöglichkeiten werden in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Psalmsprache mit konkretem Wagenbild. „Tausende und Abertausende“ ist allgemein verständlich und poetisch. Der Gedankenstrich markiert die im Hebräischen unaufgelöste, abrupte Schlusswendung.
