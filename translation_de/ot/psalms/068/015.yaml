    rationale: Der hebräische Plural bezeichnet Gipfel bzw. eine entsprechende Geländeform, enthält aber keine ausdrückliche Angabe wie »voller«. »mit Gipfeln« gibt die Mehrzahl wieder, ohne den Grad der Fülle festzulegen.
