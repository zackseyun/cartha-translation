  text: הַר אֱ֭לֹהִים הַר בָּשָׁ֑ן הַ֥ר גַּ֝בְנֻנִּ֗ים הַר בָּשָֽׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/015.yaml
  text: A mountain of God is the mountain of Bashan[b][a]; a mountain of peaks is the mountain of Bashan.
translation:
  language: de
  text: Ein Berg Gottes ist der Berg Baschan[a]; ein Berg mit Gipfeln[b] ist der Berg Baschan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein mächtiger Berg« oder »ein majestätischer Berg«. Der hebräische Ausdruck »Berg Gottes« kann als verstärkender Superlativ gebraucht sein.'
    reason: alternative_reading
  - marker: b
    text: Das seltene hebräische Wort kann auch einen zerklüfteten oder höckerigen Berg bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: Berg
  rationale: Die übliche Bedeutung ist »Berg«. Die dreifache Wiederholung wird entsprechend der betonten poetischen Struktur des Hebräischen bewahrt.
- source_word: אֱלֹהִים
  choice: Gottes
  rationale: In der Genitivverbindung הַר אֱלֹהִים ist »Berg Gottes« die naheliegende formale Wiedergabe. Die mögliche superlativische Bedeutung wird in einer Fußnote offengehalten.
- source_word: בָּשָׁן
  choice: Baschan
  rationale: Der geografische Eigenname wird in der im Deutschen etablierten biblischen Form »Baschan« wiedergegeben.
- source_word: גַּבְנֻנִּים
  choice: voller Gipfel
  rationale: Das seltene Wort bezeichnet wahrscheinlich eine Formation mit mehreren Erhebungen oder Gipfeln. »Voller Gipfel« ist verständlich, bewahrt den poetischen Parallelismus und vermeidet eine zu eng festgelegte bildliche Deutung.
theological_decisions:
- issue: Ist הַר אֱלֹהִים wörtlich oder als idiomatischer Superlativ wiederzugeben?
  choice: Im Haupttext steht wörtlich »Berg Gottes«.
  alternative: »mächtiger Berg« oder »majestätischer Berg«
  rationale: Die wörtliche Wiedergabe erhält sowohl die hebräische Form als auch ihren möglichen theologischen Klang. Die möglicherweise superlativische Funktion wird nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Satzstruktur des hebräischen Verses bleibt erhalten. Die Fußnotenmarker stehen jeweils unmittelbar bei der Wendung, auf die sie sich beziehen.
