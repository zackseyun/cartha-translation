id: PSA.68.11
reference: Psalms 68:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲדֹנָ֥/י יִתֶּן אֹ֑מֶר הַֽ֝/מְבַשְּׂר֗וֹת צָבָ֥א רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/011.yaml
  text: The Lord gives the word[c][b][a]; the women who announce the good news are a great host.
translation:
  language: de
  text: Der Herr gibt das Wort[a]; die Frauen, die die gute Nachricht verkünden[b], sind ein großes Heer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Botschaft« oder »den Befehl«.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen steht ein feminines Partizip im Plural: Frauen, die gute Nachricht bringen oder verkünden.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »eine große Schar« beziehungsweise »eine große Heerschar«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Die Form ist der göttliche Titel Adonaj, nicht das Tetragramm; »der Herr« ist dafür die natürliche und traditionsnahe deutsche Wiedergabe.
- source_word: יִתֶּן
  choice: gibt
  rationale: Das Yiqtol kann je nach Zusammenhang gegenwärtig, zukünftig oder modal verstanden werden. Hier passt das präsentische »gibt« zur knappen poetischen Aussage.
- source_word: אֹמֶר
  choice: das Wort
  rationale: אֹמֶר bezeichnet ein Wort, einen Ausspruch, eine Botschaft oder einen Befehl. »Das Wort« bewahrt die Kürze und Offenheit des Hebräischen; Alternativen stehen in der Fußnote.
- source_word: הַמְבַשְּׂרוֹת
  choice: die Frauen, die die gute Nachricht verkünden
  rationale: Das Partizip steht ausdrücklich im Femininum Plural und bezeichnet Frauen, die gute Nachricht bringen oder verkünden. Die Übersetzung erhält sowohl das markierte Geschlecht als auch den Bedeutungsgehalt des Verbs.
- source_word: צָבָא רָב
  choice: ein großes Heer
  rationale: צָבָא kann Heer, Schar oder Heerschar bedeuten, רָב bezeichnet dessen Größe oder Vielzahl. »Ein großes Heer« bewahrt die mögliche militärische Bildsprache; die weniger militärische Alternative »eine große Schar« wird in der Fußnote genannt.
theological_decisions:
- issue: Femininum Plural bei הַמְבַשְּׂרוֹת
  choice: ausdrücklich als Frauen wiedergeben
  alternative: geschlechtsneutral »die Boten« oder »die Verkündenden«
  rationale: Die feminine Form ist ein erkennbares Merkmal des hebräischen Textes und darf nicht neutralisiert werden. Damit wird keine über den Text hinausgehende Lehrentscheidung getroffen.
- issue: Bildgehalt von צָבָא
  choice: »Heer« im Haupttext
  alternative: »Schar« oder »Heerschar«
  rationale: Der militärische Sinn ist lexikalisch gut belegt und passt zum weiteren Sieges- und Kriegszusammenhang des Psalms; zugleich bleibt eine kollektivische, weniger militärische Lesart möglich und wird angemerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzstruktur. Das ausdrücklich feminine Subjekt bleibt sichtbar. »Heer« erhält die mögliche militärische Spannung des Kontexts, während die Fußnote die kollektivische Alternative dokumentiert.
