source:
  edition: WLC
  text: אֲבִ֣י יְ֭תוֹמִים וְ/דַיַּ֣ן אַלְמָנ֑וֹת אֱ֝לֹהִ֗ים בִּ/מְע֥וֹן קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/005.yaml
  text: God is a father of the fatherless and a judge of widows in his holy dwelling[a][b][c].
translation:
  language: de
  text: Ein Vater der Vaterlosen[a] und ein Richter der Witwen[b] ist Gott in seiner heiligen Wohnung[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Waisen“. Das hebräische Wort bezeichnet besonders Kinder, die keinen Vater mehr haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Verteidiger der Witwen“; das hebräische Wort bezeichnet wörtlicher jemanden, der richtet oder Recht verschafft.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „von seiner heiligen Wohnung aus“; manche Übersetzungen verstehen die Wendung als den Ort, von dem aus Gott handelt, obwohl die hebräische Präposition wörtlich „in“ bedeutet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבִי
  choice: ein Vater der
  rationale: Die Konstruktform von אָב wird prädikativ auf אֱלֹהִים bezogen. „Ein Vater der“ bewahrt die nominale Aussage und klingt im Deutschen würdig und verständlich.
- source_word: יְתוֹמִים
  choice: Vaterlosen
  rationale: Das Wort bezeichnet insbesondere Kinder, die ihren Vater verloren haben. „Vaterlose“ erhält diese genauere soziale Bedeutung; „Waisen“ ist die geläufigere, aber potenziell weiter gefasste Alternative.
- source_word: וְדַיַּן
  choice: und ein Richter der
  rationale: דַיַּן bezeichnet einen Richter beziehungsweise jemanden, der Recht spricht oder Recht verschafft. „Richter“ erhält das Rechtsbild des hebräischen Textes, ohne die Schutzfunktion ausdrücklich hineinzulesen.
- source_word: אַלְמָנוֹת
  choice: Witwen
  rationale: Direkte und natürliche Wiedergabe des Plurals für Frauen, deren Ehemänner gestorben sind.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch plurale Form bezeichnet hier den einen Gott und ist Subjekt des verblosen Satzes.
- source_word: בִּמְעוֹן
  choice: in seiner … Wohnung
  rationale: מָעוֹן bezeichnet einen Wohnort oder eine Wohnstätte; die Präposition בְּ bedeutet ihrem normalen Wortsinn nach „in“. „Wohnung“ ist eine direkte, gegenwärtige Wiedergabe.
- source_word: קָדְשׁוֹ
  choice: heiligen
  rationale: Wörtlich steht „seiner Heiligkeit“; in Verbindung mit מָעוֹן wird dies im Deutschen natürlich als „seiner heiligen Wohnung“ ausgedrückt.
theological_decisions:
- issue: Ob דַיַּן ausdrücklich als schützende oder als richterliche Funktion wiederzugeben ist
  choice: ein Richter der Witwen
  alternative: ein Verteidiger der Witwen
  rationale: Der Zusammenhang schließt Gottes Eintreten für schutzbedürftige Menschen ein, doch das hebräische Substantiv bezeichnet zunächst einen Richter beziehungsweise jemanden, der Recht ausübt. Die gewählte Fassung bewahrt das rechtliche Bild und lässt seine konkrete Schutzwirkung offen.
- issue: Ob בִּמְעוֹן קָדְשׁוֹ einen Ort oder den Ausgangspunkt des Handelns bezeichnet
  choice: in seiner heiligen Wohnung
  alternative: von seiner heiligen Wohnung aus
  rationale: Die Präposition בְּ ist regulär lokativ und bedeutet „in“. Die alternative Fassung verdeutlicht einen möglichen Handlungsausgangspunkt, fügt diesen Gedanken jedoch interpretierend hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Nominalstruktur. Die Satzstellung setzt die beiden Rollen Gottes hervor. „Vaterlose“ ist präziser als das geläufigere „Waisen“, während die Fußnote die natürliche Alternative nennt.
