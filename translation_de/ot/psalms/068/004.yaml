  text: שִׁ֤ירוּ לֵֽ/אלֹהִים֮ זַמְּר֪וּ שְׁ֫מ֥/וֹ סֹ֡לּוּ לָ/רֹכֵ֣ב בָּ֭/עֲרָבוֹת בְּ/יָ֥הּ שְׁמ֗/וֹ וְ/עִלְז֥וּ לְ/פָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/004.yaml
  text: Sing to God[a]; sing praise to his name. Lift up a song for the one who rides through the deserts; Yah is his name[b]; exult before him.
translation:
  language: de
  text: Singt Gott, singt seinem Namen Lob! Bahnt dem, der durch die Steppen[a] fährt, einen Weg! Jah ist sein Name; jubelt vor ihm!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den Wolken“. Das hebräische Wort bedeutet gewöhnlich „Steppen“ oder „Wüstenebenen“; im Bild des göttlichen Fahrers wird es jedoch auch auf die Wolken bezogen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ לֵאלֹהִים
  choice: Singt Gott
  rationale: Der pluralische Imperativ wird als unmittelbarer Aufruf wiedergegeben; אֱלֹהִים bezeichnet hier eindeutig den Gott Israels.
- source_word: זַמְּרוּ שְׁמוֹ
  choice: singt seinem Namen Lob
  rationale: זמר bezeichnet im Lobpreiskontext Singen beziehungsweise Musizieren; die Formulierung bewahrt den Namen als ausdrückliches Gegenüber des Lobes und klingt im Deutschen natürlich.
- source_word: סֹלּוּ
  choice: Bahnt … einen Weg
  rationale: סלל bedeutet grundlegend, etwas aufzuschütten beziehungsweise einen Weg zu bereiten. Die Ergänzung „einen Weg“ macht das im Hebräischen elliptisch ausgedrückte Bild verständlich, ohne es in einen bloßen Aufruf zum Singen umzudeuten.
- source_word: לָרֹכֵב בָּעֲרָבוֹת
  choice: dem, der durch die Steppen fährt
  rationale: Das Partizip רֹכֵב zeichnet Gott als fahrenden beziehungsweise reitenden Herrscher; עֲרָבוֹת bezeichnet im gewöhnlichen hebräischen Sprachgebrauch trockene Ebenen oder Steppen. „fährt“ lässt ein Reiten oder Fahren auf einem Wagen offen.
- source_word: בְּיָהּ שְׁמוֹ
  choice: Jah ist sein Name
  rationale: יָהּ ist die Kurzform des Gottesnamens und wird deshalb als Eigenname transliteriert. Die deutsche Wortfolge bewahrt die nachdrückliche Nennung des Namens.
- source_word: וְעִלְזוּ לְפָנָיו
  choice: jubelt vor ihm
  rationale: עלז bezeichnet ausgelassene, triumphierende Freude. „jubelt“ ist gegenwärtig, verständlich und entspricht dem feierlichen Ton.
theological_decisions:
- issue: Wiedergabe der Kurzform יָהּ
  choice: Jah
  alternative: der HERR
  rationale: Der Ausgangstext bietet ausdrücklich die Kurzform יָהּ und nicht das Tetragramm in voller Schreibweise. Die Transliteration bewahrt diese formale und klangliche Eigenheit.
- issue: Bild des göttlichen Fahrers in בָּעֲרָבוֹת
  choice: der durch die Steppen fährt
  alternative: der auf den Wolken fährt
  rationale: „Steppen“ folgt dem üblichen hebräischen Sinn von עֲרָבוֹת und passt zum Wüstenzug, der den Psalm prägt. Die traditionsgeschichtlich bedeutsame Deutung als Wolkenfahrer bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Psalmsprache mit kurzen Imperativen. „Jah“ erhält die besondere Form des Gottesnamens; „Steppen“ und „einen Weg bahnen“ bewahren die konkrete Wüsten- und Prozessionsbildwelt.
