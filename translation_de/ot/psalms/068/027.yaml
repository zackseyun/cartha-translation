  text: שָׁ֤ם בִּנְיָמִ֨ן צָעִ֡יר רֹדֵ֗/ם שָׂרֵ֣י יְ֭הוּדָה רִגְמָתָ֑/ם שָׂרֵ֥י זְ֝בֻל֗וּן שָׂרֵ֥י נַפְתָּלִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/027.yaml
  text: There is little Benjamin[a], leading them; the princes of Judah in their throng; the princes of Zebulun[b]; the princes of Naphtali.
translation:
  language: de
  text: Dort ist der kleine Benjamin, der sie anführt[a], die Fürsten Judas in ihrer Schar[b], die Fürsten Sebulons, die Fürsten Naftalis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der über sie herrscht« beziehungsweise »der sie beherrscht«. Das hebräische Partizip kann Herrschaft oder Vorrang bezeichnen; im Zusammenhang wird es hier auf die Führung des Festzugs bezogen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in ihrer Menge«, »in ihrer Gruppe« beziehungsweise »in ihrem Gedränge«. Das hebräische Wort ist selten und seine genaue Bedeutung unsicher; wahrscheinlich bezeichnet es die versammelte Schar um Juda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Dort ist
  rationale: Das Ortsadverb bedeutet »dort«. Zusammen mit »ist« führt es die im Festzug anwesenden Stämme in natürlichem Deutsch ein.
- source_word: בִּנְיָמִן צָעִיר
  choice: Benjamin, der Kleinste
  rationale: צָעִיר kann »klein«, »jung« oder »der Kleinste« bedeuten. Im Blick auf den Stamm bezeichnet es wahrscheinlich seine geringe Größe oder Stellung; die substantivierte Form klingt im Deutschen würdig und prägnant.
- source_word: רֹדֵם
  choice: der sie anführt
  rationale: Das Partizip mit Suffix kann Herrschaft oder Vorrang ausdrücken. Im Zusammenhang eines Festzugs gibt »anführt« den wahrscheinlichen Prozessionssinn wieder, ohne die mögliche Bedeutung »beherrscht« zu verschweigen.
- source_word: שָׂרֵי
  choice: die Fürsten
  rationale: Der Konstruktplural von שַׂר bezeichnet hochgestellte Führer, Amtsträger oder Fürsten. »Fürsten« bewahrt den gehobenen poetischen Rang.
- source_word: רִגְמָתָם
  choice: in ihrer Schar
  rationale: Das seltene Wort ist in seiner genauen Bedeutung unsicher, bezeichnet hier aber wahrscheinlich eine versammelte Gruppe oder Menge. »In ihrer Schar« passt syntaktisch und zum Bild des Festzugs.
- source_word: יְהוּדָה / זְבֻלוּן / נַפְתָּלִי
  choice: Juda / Sebulon / Naftali
  rationale: Die Stammesnamen folgen den im modernen deutschen Bibelgebrauch üblichen Formen.
theological_decisions: []
