  register: Poetisch-reihender, gehobener Stil mit gut verständlicher moderner Syntax. Die Wiederholung »die Fürsten« bildet die Struktur des Hebräischen nach; die Unsicherheiten bei רֹדֵם und רִגְמָתָם bleiben durch Fußnoten sichtbar.
