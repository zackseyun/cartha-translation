  text: יָק֣וּם אֱ֭לֹהִים יָפ֣וּצוּ אוֹיְבָ֑י/ו וְ/יָנ֥וּסוּ מְ֝שַׂנְאָ֗י/ו מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/001.yaml
  text: God rises up; his enemies are scattered[a], and those who hate him flee from before him.
translation:
  language: de
  text: Gott erhebt sich; seine Feinde zerstreuen sich[a], und die ihn hassen, fliehen vor ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach der traditionellen Wiedergabe als Wunsch: „Gott möge sich erheben; seine Feinde mögen sich zerstreuen, und die ihn hassen, mögen vor ihm fliehen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: יָקוּם
  choice: erhebt sich
  rationale: Das Qal-Imperfekt von קום kann im poetischen Zusammenhang als lebendige Aussage oder als Wunsch aufgefasst werden. „Erhebt sich“ bewahrt das Bild und legt den Haupttext auf eine gegenwärtig-deklarative Wiedergabe fest, ohne die optativische Möglichkeit zu verschweigen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Obwohl die Form morphologisch pluralisch ist, steht sie hier mit einem Verb im Singular und bezeichnet den Gott Israels.
- source_word: יָפוּצוּ
  choice: zerstreuen sich
  rationale: Das Qal-Imperfekt Plural von פוץ bezeichnet hier das Auseinandergetriebenwerden bzw. Sich-Zerstreuen der Feinde. Die reflexive deutsche Form ist natürlich und bewahrt den Ergebnischarakter, ohne ausdrücklich ein Passiv einzuführen.
- source_word: אֹיְבָיו
  choice: seine Feinde
  rationale: Die Konstruktform mit Suffix der 3. Person maskulin Singular wird direkt possessiv wiedergegeben.
- source_word: וְיָנוּסוּ
  choice: und … fliehen
  rationale: Das Qal-Imperfekt Plural von נוס wird mit dem im poetischen Kontext natürlichen und würdigen Verb „fliehen“ wiedergegeben.
- source_word: מְשַׂנְאָיו
  choice: die ihn hassen
  rationale: Das substantivisch gebrauchte Partizip mit Suffix wird als Relativsatz wiedergegeben; so bleibt die aktive Bedeutung des Hassens erhalten.
- source_word: מִפָּנָיו
  choice: vor ihm
  rationale: Die Wendung bedeutet wörtlich „von seinem Angesicht/vor seinem Angesicht weg“. „Vor ihm fliehen“ ist im Deutschen idiomatisch und vermittelt sowohl Gegenwart als auch Rückzug.
theological_decisions:
- issue: Aussage- oder Wunschcharakter der Imperfektformen im poetischen Kontext einer militärischen Theophanie
  choice: 'Lebendige Aussage: „Gott erhebt sich; seine Feinde zerstreuen sich …“'
  alternative: 'Wunsch bzw. Gebet: „Gott möge sich erheben; seine Feinde mögen sich zerstreuen …“'
  rationale: Die hebräischen Imperfektformen können hier als lebendige Aussage oder jussivisch-optativ verstanden werden. Der Haupttext folgt der deklarativen Lesart; die traditionsreiche Wunschlesart wird in einer Fußnote bewahrt, damit die echte grammatische und theologische Spannung sichtbar bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzstruktur. „Erhebt sich“ und „fliehen“ halten ein leicht gehobenes, aber allgemein verständliches Register; die alternative optativische Lesart steht vollständig in der Fußnote.
