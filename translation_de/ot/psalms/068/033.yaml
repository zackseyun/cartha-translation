lexical_decisions:
- source_word: לָרֹכֵב
  choice: dem, der … fährt
  rationale: Das vorangestellte ל knüpft als indirektes Objekt an die Aufforderung des vorherigen Verses an. Das Partizip רֹכֵב bezeichnet Gott als den Fahrenden beziehungsweise Reitenden; „fährt“ ist bei der Bewegung durch den Himmel im Deutschen natürlich.
- source_word: בִּשְׁמֵי שְׁמֵי
  choice: durch die höchsten Himmel
  rationale: Die Konstruktverbindung „Himmel der Himmel“ wirkt als Steigerungsform. „Die höchsten Himmel“ gibt diesen Sinn verständlich wieder; „durch“ erfasst den räumlichen Bewegungscharakter von בְּ in Verbindung mit רכב.
- source_word: קֶדֶם
  choice: die seit Urzeiten bestehen
  rationale: קֶדֶם ist hier zeitlich zu verstehen. Die Relativkonstruktion macht deutlich, dass die Himmel als seit uralter Zeit bestehend beschrieben werden.
- source_word: הֵן
  choice: siehe
  rationale: Die Aufmerksamkeitspartikel behält mit „siehe“ ihre hervorgehobene, poetisch-gehobene Wirkung.
- source_word: יִתֵּן בְּקוֹלוֹ
  choice: er lässt seine Stimme erschallen
  rationale: Die Verbindung von נתן mit קול bezeichnet das Erheben oder Ertönenlassen der Stimme. Diese Wiedergabe ist idiomatisch und bewahrt zugleich das kraftvolle Bild.
- source_word: קוֹל עֹז
  choice: eine mächtige Stimme
  rationale: Die Konstruktverbindung bedeutet wörtlich „eine Stimme der Stärke“. „Eine mächtige Stimme“ gibt die Aussage in natürlichem Deutsch wieder.
theological_decisions:
- issue: Bezug des durch die Himmel Fahrenden
  choice: Die Aussage beschreibt im unmittelbaren Zusammenhang den Gott Israels, ohne den Bezug im Vers eigens enger zu bestimmen.
  alternative: Eine typologische Auslegung kann das Bild später messianisch deuten.
  rationale: Der hebräische Kontext verwendet erhabene Bildsprache für Gott. Die Übersetzung bewahrt diesen unmittelbaren Bezug, ohne eine spätere theologische Identifikation in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Satzrhythmus. Der Versanfang bleibt als Anschluss an die Aufforderung des vorherigen Verses bewusst syntaktisch abhängig.
