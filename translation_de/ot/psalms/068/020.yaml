id: PSA.68.20
reference: Psalms 68:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָ֤/אֵ֣ל לָ/נוּ֮ אֵ֤ל לְֽ/מוֹשָׁ֫ע֥וֹת וְ/לֵ/יהוִ֥ה אֲדֹנָ֑/י לַ֝/מָּ֗וֶת תּוֹצָאֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/020.yaml
  text: God is to us a God of salvations[b][a], and to the Lord GOD belong escapes from death.
translation:
  language: de
  text: Gott ist für uns ein Gott der Rettungen[a], und bei Jahwe, dem Herrn, gibt es Auswege aus dem Tod[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „ein Gott von Rettungen“. Der hebräische Plural kann wiederholte oder vielfältige Rettungstaten hervorheben.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bedeutet wörtlich „Ausgänge“ oder „Herausführungen“; gemeint sind hier Wege, dem Tod zu entrinnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Gott
  rationale: Der bestimmte Ausdruck bezeichnet hier den einen Gott. Im Deutschen ist „Gott“ als Eigenbezeichnung ohne Artikel natürlich.
- source_word: לָנוּ
  choice: für uns
  rationale: Die Präposition bezeichnet hier Beziehung und Zuwendung; „für uns“ gibt dies im Deutschen idiomatisch wieder.
- source_word: אֵל לְמוֹשָׁעוֹת
  choice: ein Gott der Rettungen
  rationale: Die Wiederholung von אֵל und der auffällige Plural מוֹשָׁעוֹת bleiben erhalten. So werden Gottes vielfache oder wiederholte Rettungstaten ausgedrückt, ohne die Bild- und Satzstruktur aufzulösen.
- source_word: וְלֵיהוָה אֲדֹנָי
  choice: und bei Jahwe, dem Herrn
  rationale: יהוה wird als „Jahwe“ wiedergegeben, während אֲדֹנָי als appositionelles „dem Herrn“ beide Bezeichnungen unterscheidbar bewahrt. Die Präposition ל wird in der deutschen Besitz- bzw. Zuständigkeitswendung mit „bei … gibt es“ ausgedrückt.
- source_word: לַמָּוֶת תּוֹצָאוֹת
  choice: Auswege aus dem Tod
  rationale: תּוֹצָאוֹת bezeichnet wörtlich Ausgänge oder Herausführungen. Zusammen mit לַמָּוֶת liegt hier der Sinn von Möglichkeiten des Entrinnens aus dem Tod nahe; der Plural bleibt gewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה zusammen mit אֲדֹנָי
  choice: Jahwe, der Herr
  alternative: der Herr HERR / der Herr, Jahwe
  rationale: Die Wiedergabe „Jahwe“ lässt den im hebräischen Text ausdrücklich stehenden Gottesnamen erkennen; „der Herr“ gibt das zusätzlich vorhandene אֲדֹנָי wieder, ohne beide Ausdrücke miteinander zu verschmelzen.
- issue: Art und Umfang der göttlichen Rettung
  choice: Gott der Rettungen
  alternative: Gott, der rettet / Gott vielfältiger Befreiungen
  rationale: Der hebräische Plural lässt wiederholte oder vielfältige Rettungen anklingen. Die Übersetzung bewahrt diese Offenheit, statt sie auf eine einzelne Rettungstat oder eine bestimmte heilsgeschichtliche Deutung festzulegen.
- issue: Verhältnis Gottes zum Tod
  choice: bei Jahwe, dem Herrn, gibt es Auswege aus dem Tod
  alternative: Jahwe, dem Herrn, gehören die Ausgänge des Todes
  rationale: Die Formulierung beschreibt Gottes Verfügung über Rettung aus dem Tod, ohne näher festzulegen, ob zeitliche Bewahrung, Wiederbelebung oder endgültige Überwindung des Todes gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Wendung „Gott der Rettungen“ bewahrt bewusst den hebräischen Plural; die Fußnote erklärt sie. Der Gottesname wird transparent als „Jahwe“ wiedergegeben.
