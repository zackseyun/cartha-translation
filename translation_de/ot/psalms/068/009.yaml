  text: גֶּ֣שֶׁם נְ֭דָבוֹת תָּנִ֣יף אֱלֹהִ֑ים נַחֲלָתְ/ךָ֥ וְ֝/נִלְאָ֗ה אַתָּ֥ה כֽוֹנַנְתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/009.yaml
  text: You sent abundant rain[a], O God; when your inheritance was weary[b], you established it.
translation:
  language: de
  text: Du ließest reichlichen Regen fallen, Gott; dein Erbteil war erschöpft – du festigtest es[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Dein Erbteil“ kann in der poetischen Sprache Gottes Volk, das Land oder beides zusammen bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: גֶּשֶׁם נְדָבוֹת
  choice: reichlichen Regen
  rationale: Die Verbindung bezeichnet idiomatisch großzügig geschenkten, ergiebigen Regen. „Reichlichen Regen“ ist im Deutschen natürlich und bewahrt den Gedanken verschwenderischer Versorgung, ohne eine Opferterminologie einzutragen.
- source_word: תָּנִיף
  choice: ließest du fallen
  rationale: Das Hifil von נוּף hat die Grundvorstellung des Schwingens oder Bewegens; beim Regen bezeichnet es hier, dass Gott ihn herabfallen lässt. Die Formulierung erhält die göttliche Verursachung und bleibt poetisch verständlich.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das nachgestellte „Gott“ wird als direkte Anrede verstanden. Im Deutschen ist die Anrede auch ohne „o“ klar und wirkt würdevoll, aber gegenwärtig.
- source_word: נַחֲלָתְךָ
  choice: dein Erbteil
  rationale: „Erbteil“ bildet die Vorstellung eines zugeteilten Besitzes ab und lässt offen, ob Gottes Volk, das Land oder beides gemeint ist.
- source_word: וְנִלְאָה
  choice: war erschöpft
  rationale: Die feminine Form bezieht sich auf נַחֲלָה und bezeichnet Ermattung oder Erschöpfung. Der deutsche Hauptsatz gibt den knappen hebräischen Zustand natürlich wieder.
- source_word: כּוֹנַנְתָּהּ
  choice: du gabst ihm wieder festen Bestand
  rationale: כון bedeutet im Polel, etwas festzumachen, zu gründen oder dauerhaft herzurichten. Die Wiedergabe verbindet Festigung und Wiederherstellung, die der Zusammenhang mit dem erschöpften Erbteil nahelegt, ohne den möglichen Bezug auf Land oder Volk festzulegen.
theological_decisions:
- issue: Bezug von „dein Erbteil“
  choice: Die mehrdeutige Bezeichnung „dein Erbteil“ bleibt erhalten.
  alternative: Ausdrückliche Festlegung auf das Land Israel oder das Volk Israel.
  rationale: Die poetische Formulierung kann Gottes Land, sein Volk oder beide als zusammengehörige Bundeswirklichkeit bezeichnen. Eine engere Festlegung würde die echte Mehrdeutigkeit des Hebräischen auflösen.
- issue: Art der göttlichen Hilfe
  choice: „gabst ihm wieder festen Bestand“
  alternative: „erquicktest du es“ oder „versorgtest du es“
  rationale: Der Regen legt Erquickung und Versorgung nahe, doch das Verb selbst betont Festigung beziehungsweise Wiederherstellung. Die gewählte Fassung wahrt diesen Schwerpunkt.
translation_notes:
  register: Moderne, gehobene Psalmsprache ohne altertümliches „o“. Der Satzrhythmus bleibt knapp und parallel. „Erbteil“ bewahrt die bundesbezogene und zugleich offene Bildsprache des Hebräischen.
