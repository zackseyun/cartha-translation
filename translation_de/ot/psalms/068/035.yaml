  text: נ֤וֹרָ֥א אֱלֹהִ֗ים מִֽ/מִּקְדָּ֫שֶׁ֥י/ךָ אֵ֤ל יִשְׂרָאֵ֗ל ה֤וּא נֹתֵ֨ן עֹ֖ז וְ/תַעֲצֻמ֥וֹת לָ/עָ֗ם בָּר֥וּךְ אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/035.yaml
  text: Awesome is God from your sanctuaries; the God of Israel—he gives strength and mighty power to the people[a]. Blessed be God!
translation:
  language: de
  text: Ehrfurchtgebietend ist Gott aus deinen Heiligtümern[a]. Der Gott Israels – er gibt dem Volk Kraft und Machtfülle. Gepriesen sei Gott!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus deinem Heiligtum“ oder „in deinem Heiligtum“. Im Hebräischen steht „aus deinen Heiligtümern“; die Mehrzahl kann Gottes heilige Wohnstätte in majestätischem oder kollektivem Sinn bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: נוֹרָא
  choice: Ehrfurcht gebietend
  rationale: Das Adjektiv bezeichnet jemanden, der überwältigende Ehrfurcht und Scheu hervorruft. Die Formulierung ist im modernen Deutschen verständlich und vermeidet die missverständliche Bedeutung von „furchtbar“.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch plurale Form bezeichnet hier den einen Gott Israels und wird daher singularisch wiedergegeben.
- source_word: מִמִּקְדָּשֶׁיךָ
  choice: aus deinen Heiligtümern
  rationale: Die hebräische Form ist morphologisch Plural mit einem Suffix der 2. Person Singular; מִן wird in seiner üblichen räumlichen Bedeutung mit „aus“ wiedergegeben. Die ungewöhnliche Mehrzahl bleibt im Haupttext erhalten.
- source_word: אֵל יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Nominalfügung identifiziert den zuvor genannten Gott als Israels Gott; der bestimmte Artikel ist im Deutschen idiomatisch.
- source_word: הוּא
  choice: er
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten und durch die Gedankenstrichkonstruktion hervorgehoben.
- source_word: נֹתֵן
  choice: gibt
  rationale: Das Partizip beschreibt Gottes charakteristisches Handeln; dafür ist das deutsche Präsens angemessen.
- source_word: עֹז
  choice: Kraft
  rationale: Das Substantiv bezeichnet Stärke oder Macht. „Kraft“ hält es vom folgenden, intensivierenden Ausdruck unterscheidbar.
- source_word: וְתַעֲצֻמוֹת
  choice: und Machtfülle
  rationale: Der Ausdruck bezeichnet gewaltige beziehungsweise gesteigerte Macht. „Machtfülle“ bewahrt die Intensivierung und vermeidet, beide hebräischen Begriffe mit demselben deutschen Wort wiederzugeben.
- source_word: לָעָם
  choice: dem Volk
  rationale: Der hebräische Text sagt schlicht „dem Volk“; ein nicht ausdrücklich vorhandenes Possessivpronomen wird nicht ergänzt.
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Diese geläufige deutsche Lobpreisformel gibt die doxologische Segensaussage natürlich und würdig wieder.
theological_decisions:
- issue: Numerus und Sinn von מִמִּקְדָּשֶׁיךָ
  choice: aus deinen Heiligtümern
  alternative: aus deinem Heiligtum; in deinem Heiligtum
  rationale: Der masoretische Text hat eindeutig eine Pluralform mit singularischem Anredesuffix. Der Haupttext wahrt diesen Befund, während die mögliche kollektiv-majestätische Bedeutung und eine abweichende Deutung der Präposition in der Fußnote genannt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ehrfurcht gebietend“ vermittelt heilige Scheu ohne die heute meist negative Färbung von „furchtbar“. Die ungewöhnliche Wendung „aus deinen Heiligtümern“ folgt bewusst der formalen Mehrzahl des hebräischen Textes; die Fußnote unterstützt die Verständlichkeit.
