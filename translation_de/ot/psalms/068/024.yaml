  text: רָא֣וּ הֲלִיכוֹתֶ֣י/ךָ אֱלֹהִ֑ים הֲלִ֘יכ֤וֹת אֵלִ֖/י מַלְכִּ֣/י בַ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/024.yaml
  text: They have seen your processions[a], O God— the processions of my God, my King, into the sanctuary.
translation:
  language: de
  text: Sie haben deine Prozessionen gesehen, Gott – die Prozessionen meines Gottes, meines Königs, im Heiligtum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie sahen deine Schritte, Gott – die Schritte meines Gottes, meines Königs, in Heiligkeit.“'
    reason: Bewahrt die Möglichkeit, הֲלִיכוֹת allgemeiner als Bewegungen oder Schritte und בַּקֹּדֶשׁ abstrakt als „in Heiligkeit“ zu verstehen.
lexical_decisions:
- source_word: רָאוּ
  choice: Sie haben gesehen
  rationale: Das Qal Perfekt 3. Person Plural bezeichnet eine abgeschlossene, bezeugte Wahrnehmung; das deutsche Perfekt gibt dies im heutigen Standarddeutsch natürlich wieder.
- source_word: הֲלִיכוֹתֶיךָ / הֲלִיכוֹת
  choice: deine Prozessionen / die Prozessionen
  rationale: Das zweimal verwendete Pluralwort bezeichnet hier im festlich-kultischen Zusammenhang am ehesten feierliche Prozessionsbewegungen. Wiederholung und Plural bleiben erhalten.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Zusammenhang lässt eine direkte Anrede erkennen; im Deutschen genügt dafür die anredende Stellung ohne ein zusätzliches „o“.
- source_word: אֵלִי
  choice: meines Gottes
  rationale: Die Form mit Suffix der 1. Person Singular bedeutet „mein Gott“; nach „Prozessionen“ verlangt die deutsche Konstruktion den Genitiv.
- source_word: מַלְכִּי
  choice: meines Königs
  rationale: Der parallele Gottestitel wird passend zur Genitivkonstruktion wiedergegeben.
- source_word: בַקֹּדֶשׁ
  choice: ins Heiligtum
  rationale: Wörtlich ist „im Heiligen“ beziehungsweise „im Heiligtum“ möglich; der Prozessionskontext legt eine gerichtete Bewegung zum beziehungsweise ins Heiligtum nahe.
theological_decisions:
- issue: Bezug und Ziel der Prozessionen
  choice: Der Vers beschreibt die feierlichen Prozessionen Gottes ins Heiligtum.
  alternative: Der Vers kann allgemeiner von Gottes Wegen „im Heiligen“ oder „in Heiligkeit“ sprechen.
  rationale: Die Wiederholung von הֲלִיכוֹת und der kultische Kontext stützen die Prozessionsdeutung. Weil בַקֹּדֶשׁ formal auch örtlich-statisch oder abstrakter verstanden werden kann, bleibt diese Alternative in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Psalmsprache. „Prozessionen“ macht den kultisch-feierlichen Zusammenhang deutlich; die doppelte Nennung und der hebräische Plural werden bewahrt. Die Gottesbezeichnungen werden als Titel großgeschrieben.
