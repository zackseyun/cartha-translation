source:
  edition: WLC
  text: כְּ/הִנְדֹּ֥ף עָשָׁ֗ן תִּ֫נְדֹּ֥ף כְּ/הִמֵּ֣ס דּ֭וֹנַג מִ/פְּנֵי אֵ֑שׁ יֹאבְד֥וּ רְ֝שָׁעִ֗ים מִ/פְּנֵ֥י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/002.yaml
  text: As smoke is driven away[a], so you drive them away; as wax melts before fire[c][b], so the wicked perish before God.
translation:
  language: de
  text: Wie Rauch verweht wird[a], so vertreibst du sie; wie Wachs vor dem Feuer schmilzt[b][c], so gehen die Gottlosen vor Gott zugrunde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische kann auch bedeuten: „Wie Rauch zerstreut wird“. Beim folgenden Verb ist kein Objekt ausgedrückt; „sie“ bezieht es auf die Gegner beziehungsweise die Gottlosen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht sowohl hier als auch am Versende „von vor dem Angesicht des Feuers/Gottes“; gemeint ist die Wirkung ihrer Gegenwart.
    reason: lexical_alternative
  - marker: c
    text: Die hebräischen Verbformen können auch futurisch („wirst vertreiben … werden zugrunde gehen“) oder im Zusammenhang wunschhaft verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּ/הִנְדֹּף עָשָׁן
  choice: Wie Rauch verweht wird
  rationale: כ mit dem Infinitiv von נדף leitet einen Vergleich ein. „Verweht wird“ gibt die Bewegung von Rauch natürlich wieder und bewahrt den passivischen Vergleich.
- source_word: תִּנְדֹּף
  choice: so vertreibst du sie
  rationale: Das Qal-Imperfekt 2. Person maskulin Singular richtet sich unmittelbar an Gott. Das ergänzte plurale „sie“ nimmt im poetischen Zusammenhang die Feinde beziehungsweise die später genannten Gottlosen auf; ein ausdrücklich genanntes Objekt steht im Hebräischen nicht.
- source_word: כְּ/הִמֵּס דּוֹנַג
  choice: wie Wachs ... schmilzt
  rationale: Die Vergleichspartikel mit dem Infinitiv wird im Deutschen idiomatisch durch einen finiten Vergleichssatz wiedergegeben.
- source_word: מִ/פְּנֵי אֵשׁ
  choice: vor dem Feuer
  rationale: מִפְּנֵי bezeichnet wörtlich die Bewegung oder Wirkung „von vor dem Angesicht“ und hier idiomatisch die Einwirkung beziehungsweise Gegenwart des Feuers.
- source_word: יֹאבְדוּ
  choice: gehen ... zugrunde
  rationale: אבד bedeutet hier „zugrunde gehen, umkommen“. Die Wendung ist natürlich und lässt die genaue Art des Untergangs offen.
- source_word: רְשָׁעִים
  choice: die Gottlosen
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die schuldig oder böse handeln. „Die Gottlosen“ ist eine knappe, im deutschen Psalmenstil geläufige moralische Kategorie.
- source_word: מִ/פְּנֵי אֱלֹהִים
  choice: vor Gott
  rationale: Die Formulierung bewahrt die räumlich-präsentische Bildsprache des Hebräischen und kann zugleich die ursächliche Wirkung von Gottes Gegenwart ausdrücken.
theological_decisions:
- issue: Aussageweise der hebräischen Imperfektformen im poetischen Zusammenhang
  choice: 'Präsentisch-allgemein: „vertreibst ... gehen ... zugrunde“'
  alternative: 'Futurisch: „wirst vertreiben ... werden zugrunde gehen“; oder wunschhaft: „Mögest du vertreiben ... mögen zugrunde gehen“'
  rationale: Die Imperfektformen können Zukunft, wiederholtes Geschehen oder modalen Wunsch ausdrücken. Das Präsens stellt den Vorgang anschaulich dar, ohne den Vers ausschließlich als Vorhersage oder Verwünschung festzulegen.
- issue: Nicht ausgedrücktes Objekt von תִּנְדֹּף
  choice: Plural „sie“ als Bezug auf die Gegner beziehungsweise Gottlosen
  alternative: Singular „ihn“ als Rückbezug auf den Rauch oder objektlos „so verwehst du“
  rationale: Das Hebräische nennt kein Objekt. Der Plural stellt die inhaltliche Verbindung zu den Gottlosen her, bleibt aber als Ergänzung aus dem Kontext in einer Fußnote kenntlich.
translation_notes:
  register: Moderne, würdige Psalmsprache mit klaren, allgemein verständlichen Bildern. Die Parallelstruktur wird bewahrt; „vor Gott“ erhält bewusst die Gegenwarts- und Wirkungsnuance des hebräischen Idioms.
