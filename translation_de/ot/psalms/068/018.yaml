base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/018.yaml
  text: You ascended on high[a]; you led captivity captive; you received gifts among men, even among the rebellious[b], so that Yah God might dwell there.
translation:
  language: de
  text: Du bist zur Höhe hinaufgestiegen; du hast eine Schar Gefangener weggeführt. Du hast Gaben unter den Menschen[a] empfangen, sogar unter den Aufsässigen, damit Jah, der Gott, dort wohne.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast Gaben von den Menschen empfangen.“ Die hebräische Präposition kann hier sowohl den Bereich als auch die Herkunft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „damit Jah, der Gott, unter ihnen wohne“ oder: „als Wohnstätte für Jah, den Gott“. Die hebräische Schlusswendung ist knapp und lässt mehrere syntaktische Deutungen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָלִיתָ לַמָּרוֹם
  choice: Du bist zur Höhe hinaufgestiegen
  rationale: Die Verbindung gibt sowohl die Aufwärtsbewegung als auch das erhabene Ziel wieder. „Zur Höhe“ bleibt räumlich offen und wahrt den poetischen Ton.
- source_word: שָׁבִיתָ שֶּׁבִי
  choice: du hast Gefangene gefangen weggeführt
  rationale: Die Formulierung bildet die eindringliche figura etymologica des Hebräischen im verständlichen Deutschen nach; „weggeführt“ verdeutlicht den Triumphzug, ohne die Wendung auf ein bloßes „gefangen genommen“ zu reduzieren.
- source_word: לָקַחְתָּ מַתָּנוֹת
  choice: du hast Gaben empfangen
  rationale: לקח bedeutet grundsätzlich „nehmen“, kann bei dargebrachten Gaben aber natürlich als „empfangen“ wiedergegeben werden. „Gaben“ bleibt allgemeiner als das stärker deutende „Tribut“.
- source_word: בָּאָדָם
  choice: unter den Menschen
  rationale: Die Präposition ב kann hier den Bereich bezeichnen; zugleich bleibt die mögliche Herkunftsbedeutung „von den Menschen“ in einer Fußnote erhalten.
- source_word: וְאַף סוֹרְרִים
  choice: sogar unter den Aufsässigen
  rationale: וְאַף steigert beziehungsweise erweitert die Aussage. סוֹרְרִים bezeichnet Menschen, die sich hartnäckig widersetzen; „Aufsässige“ bewahrt diesen aktiven Widerstand.
- source_word: לִשְׁכֹּן
  choice: damit … dort wohnt
  rationale: Der Infinitiv mit ל wird als Zweck- oder Folgeangabe verstanden. Das ergänzte „dort“ macht die elliptische Aussage im Deutschen lesbar, ohne den Ort genauer festzulegen.
- source_word: יָהּ אֱלֹהִים
  choice: Jah, Gott
  rationale: יָהּ ist die Kurzform des Gottesnamens und wird als „Jah“ bewahrt; אֱלֹהִים wird unmittelbar mit „Gott“ wiedergegeben. Die Apposition lässt die ungewöhnlich knappe hebräische Formulierung erkennen.
theological_decisions:
- issue: Bedeutung der Präposition in בָּאָדָם
  choice: unter den Menschen
  alternative: von den Menschen
  rationale: Die hebräische Präposition kann hier entweder den Bereich oder die Herkunft der Gaben bezeichnen. Der Haupttext folgt der Bereichsdeutung; die Herkunftsdeutung wird wegen ihrer sprachlichen und auslegungsgeschichtlichen Bedeutung ausdrücklich offengehalten.
- issue: Syntax und Bezug der Schlusswendung לִשְׁכֹּן יָהּ אֱלֹהִים
  choice: damit Jah, Gott, dort wohnt
  alternative: 'damit Jah, Gott, unter ihnen wohnt; oder: als Wohnstätte für Jah, Gott'
  rationale: Die hebräische Wendung ist stark verdichtet und nennt den Ort des Wohnens nicht ausdrücklich. „Dort“ vermeidet eine vorschnelle Festlegung; mögliche personale und nominale Deutungen stehen in der Fußnote.
translation_notes:
  register: Moderne, würdige Psalmenprosa mit poetischer Verdichtung. Die figura etymologica in „Gefangene gefangen weggeführt“ spiegelt bewusst die rhetorische Kraft des Hebräischen. Der Gottesname „Jah“ bleibt als Kurzform erhalten; schwer entscheidbare Präpositions- und Satzbezüge werden nicht dogmatisch vereindeutigt.
