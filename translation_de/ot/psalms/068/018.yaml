  source_fidelity: 'Die wesentlichen Elemente des hebräischen Textes sind zutreffend wiedergegeben: Aufstieg zur Höhe, die emphatische Gefangenen-/Gefangenschaftsformel, das Empfangen von Gaben, die schwierige Präposition בָּאָדָם, die Aufsässigen und die elliptische Schlussklausel. Die beiden textlich wichtigen Mehrdeutigkeiten bleiben durch Fußnoten gewahrt. Die wörtlich nachgebildete Formulierung „Gefangene gefangen weggeführt“ ist jedoch im modernen Deutschen semantisch und stilistisch missglückt; sie lässt eher eine unnötige Wiederholung als die hebräische figura etymologica erkennen.'
