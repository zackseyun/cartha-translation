  terminology: „Jah“ bewahrt angemessen die Kurzform יָהּ. „der Gott“ macht אֱלֹהִים als Titel/Apposition im Deutschen verständlich, ohne die Gottesbezeichnung mit dem vollen Tetragramm zu vermischen. „Aufsässige“ ist für סוֹרְרִים treffend. Die Alternativen zur Richtung von בָּאָדָם und zum Bezug der letzten Klausel bleiben ausdrücklich offen.
