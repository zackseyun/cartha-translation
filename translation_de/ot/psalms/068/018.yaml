  rationale: 'Die Revision ersetzt allein die im Deutschen missglückte Nachahmung der hebräischen Doppelungsfigur durch eine natürliche kollektive Formulierung und glättet die Gottesbezeichnung samt Satzmodus. Der Sinn wird nicht verändert: Die Gefangenen bleiben Objekt des triumphalen Wegführens; die Gabe kann weiterhin „unter“ oder „von“ Menschen empfangen sein; und der nicht ausdrücklich genannte Ort bzw. Bezug des göttlichen Wohnens bleibt offen.'
