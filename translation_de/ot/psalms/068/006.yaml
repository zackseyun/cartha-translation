  source_fidelity: 'Die Übersetzung gibt die drei poetischen Aussagen des Hebräischen treffend wieder: Gottes fürsorgliches Ansiedeln der Einsamen, das Herausführen der Gefangenen in einen Zustand des Wohlergehens und den kontrastierenden Aufenthalt der Widerspenstigen in einem ausgedörrten Land. Die kausative Kraft von מוֹשִׁיב und מוֹצִיא sowie der adversative Kontrast von אַךְ sind gewahrt. Die Unsicherheit von בַּכּוֹשָׁרוֹת wird angemessen in der Fußnote angezeigt.'
