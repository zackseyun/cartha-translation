source:
  edition: WLC
  text: אֱלֹהִ֤ים מ֘וֹשִׁ֤יב יְחִידִ֨ים בַּ֗יְתָ/ה מוֹצִ֣יא אֲ֭סִירִים בַּ/כּוֹשָׁר֑וֹת אַ֥ךְ ס֝וֹרֲרִ֗ים שָׁכְנ֥וּ צְחִיחָֽה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/006.yaml
  text: God settles the solitary in a home; he brings out prisoners into prosperity[a], but the rebellious dwell in a parched land.
translation:
  language: de
  text: Gott gibt den Einsamen ein Zuhause; er führt die Gefangenen hinaus ins Wohlergehen[a]. Doch die Widerspenstigen wohnen in dürrem Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Fülle“. Der seltene hebräische Ausdruck wird von manchen auch als „unter Jubelgesang“ oder als eine andere Wendung für freudige Befreiung verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Gottesbezeichnung ist hier singularisch gebraucht, wie die folgenden Partizipien zeigen.
- source_word: מוֹשִׁיב
  choice: gibt … ein Zuhause
  rationale: Das Hifil-Partizip von ישׁב bezeichnet das Veranlassen, dass jemand wohnt beziehungsweise sesshaft wird. Die deutsche Wendung gibt die kausative Bedeutung natürlich wieder.
- source_word: יְחִידִים
  choice: den Einsamen
  rationale: Das Wort bezeichnet alleinstehende oder isolierte Menschen. „Den Einsamen“ ist verständlich, ohne die Aussage auf ein bloßes Gefühl zu beschränken.
- source_word: בַּיְתָה
  choice: ein Zuhause
  rationale: בַּיִת kann Haus oder Hausgemeinschaft bedeuten; „Zuhause“ bewahrt das Bild eines Wohnorts und lässt zugleich die soziale Geborgenheit anklingen.
- source_word: מוֹצִיא
  choice: führt … hinaus
  rationale: Das Hifil-Partizip von יצא bedeutet, jemanden hinauszubringen. „Hinausführen“ passt besonders gut zur Befreiung von Gefangenen.
- source_word: אֲסִירִים
  choice: die Gefangenen
  rationale: Das Wort bezeichnet Gebundene oder Inhaftierte; „Gefangene“ ist im Deutschen klar und umfasst beide Aspekte.
- source_word: בַּכּוֹשָׁרוֹת
  choice: ins Wohlergehen
  rationale: Der seltene und schwierige Ausdruck wird häufig mit Wohlergehen, Gedeihen oder Fülle verbunden. „Ins Wohlergehen“ passt zur Richtung des Hinausführens; andere Deutungen werden in der Fußnote offengehalten.
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel markiert hier den scharfen Gegensatz zwischen Gottes befreiendem Handeln und dem Los der Widerspenstigen.
- source_word: סוֹרֲרִים
  choice: die Widerspenstigen
  rationale: Das Partizip bezeichnet Menschen, die sich hartnäckig widersetzen. „Widerspenstige“ bewahrt sowohl den Aspekt der Auflehnung als auch den der Verstocktheit.
- source_word: שָׁכְנוּ
  choice: wohnen
  rationale: Das Qal-Perfekt wird in der poetischen Sentenz als allgemeine Feststellung wiedergegeben; deutsches Präsens ist dafür natürlich.
- source_word: צְחִיחָה
  choice: in dürrem Land
  rationale: Das Substantiv bezeichnet einen ausgetrockneten, dürren Ort. „Dürres Land“ erhält das konkrete poetische Gegenbild zum Zuhause und Wohlergehen.
theological_decisions:
- issue: Gottes Handeln an den Einsamen
  choice: Gott verschafft isolierten Menschen ein Zuhause und einen festen Wohnort.
  alternative: Gott stellt einsame Menschen in Familien.
  rationale: Der hebräische Text nennt „Einsame“ und „Haus/Zuhause“. Die traditionelle Wiedergabe „Familien“ ist möglich als Deutung von Hausgemeinschaft, würde das Bild jedoch stärker festlegen, als es der Wortlaut verlangt.
- issue: Schicksal der Widerspenstigen
  choice: 'Die Aussage wird als kontrastierende Feststellung wiedergegeben: Sie wohnen in dürrem Land.'
  alternative: Die Aussage könnte ausdrücklich als göttliches Strafhandeln formuliert werden.
  rationale: Der Vers nennt beim zweiten Halbvers grammatisch nur ihr Wohnen, ohne Gott ausdrücklich als Handelnden zu bezeichnen. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Moderne, würdevolle Psalmsprache mit gut verständlichen Bildern. „Zuhause“ ist bewusst natürlicher als „Haus“, während „Widerspenstige“ und „dürres Land“ den poetischen Ton erhalten. Der Fußnotenmarker [a] steht unmittelbar beim strittigen Ausdruck.
