  text: אֱֽלֹהִ֗ים בְּ֭/צֵאתְ/ךָ לִ/פְנֵ֣י עַמֶּ֑/ךָ בְּ/צַעְדְּ/ךָ֖ בִֽ/ישִׁימ֣וֹן סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/007.yaml
  text: God[a], when you went out before your people, when you marched through the wilderness—Selah
translation:
  language: de
  text: Gott, als du vor deinem Volk auszogst, als du durch die Wüste schrittest – Sela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die vorangestellte Gottesbezeichnung wird im Zusammenhang als direkte Anrede verstanden. Das Hebräische hat keine eigene Anredepartikel; daher ist „Gott“ natürlicher und quellennäher als „O Gott“.
- source_word: בְּצֵאתְךָ
  choice: als du … auszogst
  rationale: Die Präposition ב mit dem Infinitivus constructus von יצא und dem Suffix der 2. Person Singular bezeichnet hier temporal das Ausziehen. „Ausziehen“ bewahrt zudem den feierlichen, gemeinschaftsbezogenen Bewegungssinn.
- source_word: לִפְנֵי עַמֶּךָ
  choice: vor deinem Volk
  rationale: לִפְנֵי bezeichnet die Stellung vor beziehungsweise an der Spitze des Volkes und lässt das Bild göttlicher Führung bestehen.
- source_word: בְּצַעְדְּךָ
  choice: als du … schrittest
  rationale: צעד bezeichnet ein Schreiten oder Marschieren. „Schrittest“ gibt die machtvolle, zielgerichtete Bewegung würdig wieder, ohne das stärker militärisch gefärbte „marschiertest“ aufzuzwingen.
- source_word: בִישִׁימוֹן
  choice: durch die Wüste
  rationale: יְשִׁימוֹן bezeichnet eine öde, unbewohnte Wüstenlandschaft. Wegen des Verbs der Bewegung wird die hebräische Ortsangabe im Deutschen idiomatisch mit „durch“ wiedergegeben.
- source_word: סֶלָה
  choice: Sela
  rationale: Der vermutlich liturgische oder musikalische Ausdruck wird wegen seiner unsicheren genauen Bedeutung transkribiert statt gedeutet.
theological_decisions:
- issue: Gottes Handeln beim Weg seines Volkes durch die Wüste
  choice: Der Vers wird als direkte Anrede an Gott wiedergegeben und erinnert daran, dass er seinem Volk vorauszog.
  alternative: Eine rein beschreibende Wiedergabe ohne unmittelbare Anrede.
  rationale: Die Syntax und der Zusammenhang des Psalms stützen die direkte Anrede. Die Übersetzung bewahrt die Erinnerung an Gottes Führung, ohne über den Wortlaut hinaus weitere theologische Einzelheiten einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Parallelismus. Die Wiederholung „als du … als du …“ bildet die hebräische Struktur nach; „Sela“ bleibt als unübersetzter liturgisch-musikalischer Ausdruck stehen.
