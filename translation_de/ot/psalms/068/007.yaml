  source_fidelity: Die Übersetzung gibt die temporalen Infinitivkonstruktionen (»als du … auszogst / als du … schrittest«), Gottes Vorangehen vor seinem Volk und die Ortsangabe יְשִׁימוֹן sachgerecht wieder. »Durch die Wüste« ist als idiomatische deutsche Bewegungsangabe für die hebräische Konstruktion vertretbar. »Sela« wahrt die bewusste Unbestimmtheit des liturgisch-musikalischen Ausdrucks.
  naturalness: Modernes, würdiges und poetisch angemessenes Standarddeutsch. Die wiederholte Einleitung mit »als du« bildet den Parallelismus des Hebräischen natürlich ab. »Schrittest« ist leicht gehoben, aber im Psalmregister idiomatisch.
