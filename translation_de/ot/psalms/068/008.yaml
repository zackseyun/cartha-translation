  language: en
  yaml_path: translation/ot/psalms/068/008.yaml
  text: The earth quaked; even the heavens dripped before God—this Sinai—before God, the God of Israel.
translation:
  language: de
  text: Die Erde erbebte; auch die Himmel tropften vor Gott – dieser Sinai – vor Gott, dem Gott Israels.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָשָׁה
  choice: bebte
  rationale: Gibt die Erschütterung der Erde natürlich und prägnant wieder.
- source_word: נָטְפוּ
  choice: ließ Regen herab
  rationale: Das Verb bedeutet wörtlich „tropfen/träufeln“. Im Zusammenhang mit dem Himmel ist eine natürliche deutsche Wiedergabe mit Regen sachgerecht, ohne das Bild fallenden Wassers aufzugeben.
- source_word: מִפְּנֵי
  choice: vor
  rationale: Bewahrt die räumlich-ursächliche Offenheit der hebräischen Wendung („vor/angesichts von“).
- source_word: זֶה סִינַי
  choice: dieser Sinai
  rationale: Folgt der schwierigen, knappen hebräischen Formulierung eng und erhält ihre deiktische Hervorhebung, ohne sie syntaktisch auszudeuten.
theological_decisions:
- issue: Bezug und Funktion von זֶה סִינַי
  choice: dieser Sinai
  alternative: der Sinai bebte / selbst der Sinai
  rationale: Die elliptische Formulierung des Hebräischen wird nicht stillschweigend zu einem vollständigen Satz ergänzt; so bleibt die genuine syntaktische Mehrdeutigkeit erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die ungewöhnliche Parenthese „dieser Sinai“ ist bewusst beibehalten, um die markante und mehrdeutige Gestalt des Ausgangstextes abzubilden.
