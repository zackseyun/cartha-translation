    issue: „selbst der Himmel ließ Regen herab“
    rationale: Der Plural שָׁמַיִם wird zum Singular reduziert; außerdem wird das bildhafte Verb „tropfen/träufeln“ zu einer expliziten Aussage über Regen und zu einer kausativen deutschen Konstruktion umgestaltet. Das ist unnötig einengend gegenüber dem hebräischen Bild und dem englischen Audittext („the heavens dripped“).
