base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/000.yaml
  text: For the choir director[a]. Of David. A psalm[b]. A song.
translation:
  language: de
  text: Für den musikalischen Leiter.[a] Von David.[b] Ein Psalm. Ein Lied.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Für den Chorleiter« oder »Für den Leiter«; die genaue Amtsbezeichnung ist nicht sicher.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Form kann Urheberschaft, Zugehörigkeit, Widmung oder eine andere Verbindung mit David bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: In Psalmüberschriften bezeichnet der Ausdruck wahrscheinlich die für die musikalische Ausführung verantwortliche Person. »Musikalischer Leiter« ist im heutigen Deutsch verständlich und legt sich weniger als »Chorleiter« darauf fest, dass ausdrücklich ein Chor gemeint ist.
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Präposition לְ in Psalmüberschriften ist bedeutungsweit und kann Urheberschaft, Zugehörigkeit, Widmung oder Verbindung ausdrücken. »Von David« ist eine natürliche traditionelle Wiedergabe; eine Fußnote bewahrt die im Hebräischen verbleibende Offenheit.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: »Psalm« ist die etablierte deutsche Bezeichnung für diese Gattung eines musikalisch vorzutragenden Liedes, ohne die Art der Begleitung näher festzulegen.
- source_word: שִׁיר
  choice: Ein Lied
  rationale: Die eigenständige Wiedergabe erhält die beiden nebeneinanderstehenden Gattungsangaben des Hebräischen, statt »Psalm« und »Lied« zusammenzuziehen.
theological_decisions:
- issue: Verhältnis Davids zum Psalm
  choice: Von David, mit Hinweis auf die Bedeutungsbreite der Präposition
  alternative: Für David; David zugehörig
  rationale: Der hebräische Wortlaut lässt offen, ob Urheberschaft, Widmung, Zugehörigkeit oder eine andere Verbindung gemeint ist. Die Übersetzung entscheidet diese Frage daher nicht uneingeschränkt.
translation_notes:
  register: Knapp gehaltener, würdiger Überschriftenstil in modernem Standarddeutsch. Die vier Glieder des Hebräischen bleiben jeweils eigenständig erhalten.
