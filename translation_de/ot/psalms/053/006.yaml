  text: מִ֥י יִתֵּ֣ן מִ/צִּיּוֹן֮ יְשֻׁע֪וֹת יִשְׂרָ֫אֵ֥ל בְּ/שׁ֣וּב אֱ֭לֹהִים שְׁב֣וּת עַמּ֑/וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/006.yaml
  text: Oh[a], that the salvation of Israel would come out of Zion! When God restores the fortunes of his people, let Jacob rejoice; let Israel be glad.
translation:
  language: de
  text: Ach, käme doch aus Zion die Rettung für Israel! Wenn Gott das Geschick seines Volkes wendet[a], wird Jakob jubeln, wird Israel sich freuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn Gott sein gefangenes Volk zurückführt“ beziehungsweise „die Gefangenschaft seines Volkes wendet“. Die hebräische Wendung kann allgemein die Wiederherstellung aus einer Notlage bezeichnen und schließt häufig die Rückkehr aus Gefangenschaft ein.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Ach, käme doch
  rationale: Die hebräische Wendung drückt einen sehnsüchtigen Wunsch aus, keine wörtliche Frage. Die deutsche Wunschform mit „doch“ gibt diesen optativischen Ton natürlich wieder.
- source_word: מִצִּיּוֹן
  choice: aus Zion
  rationale: Die Präposition מִן bezeichnet Quelle oder Ursprung; „aus Zion“ bewahrt die Vorstellung, dass die Rettung von dort hervorgeht.
- source_word: יְשֻׁעוֹת יִשְׂרָאֵל
  choice: die Rettung für Israel
  rationale: Der morphologische Plural kann hier abstrakt oder intensivierend gebraucht sein. Der Singular ist im Deutschen natürlich; „für Israel“ verdeutlicht, wem die Rettung gilt, ohne den Genitiv unnötig festzulegen.
- source_word: בְּשׁוּב אֱלֹהִים שְׁבוּת עַמּוֹ
  choice: Wenn Gott das Geschick seines Volkes wendet
  rationale: בְּ mit dem Infinitiv bezeichnet den zeitlichen Umstand. Die idiomatische Verbindung שׁוּב שְׁבוּת meint häufig die Umkehr einer Notlage, kann aber auch die Rückführung aus Gefangenschaft einschließen.
- source_word: יָגֵל
  choice: soll ... jubeln
  rationale: Im Zusammenhang mit dem einleitenden Wunsch lässt sich die Yiqtol-Form als Wunsch oder Aufforderung verstehen. „Jubeln“ gibt die freudige Intensität wieder.
- source_word: יִשְׂמַח
  choice: soll sich freuen
  rationale: Die Form wird parallel zu יָגֵל als Wunsch wiedergegeben; die abweichende Wortwahl erhält die leichte Variation des hebräischen Parallelismus.
theological_decisions:
- issue: Bedeutung der Wendung שׁוּב שְׁבוּת
  choice: das Geschick seines Volkes wendet
  alternative: sein Volk aus der Gefangenschaft zurückbringt / die Gefangenschaft seines Volkes wendet
  rationale: Die Wendung kann allgemein die Wiederherstellung nach einer Notlage oder konkreter die Rückkehr aus Gefangenschaft bezeichnen. Der Haupttext verwendet die breitere idiomatische Bedeutung; die konkretere Möglichkeit bleibt in der Fußnote sichtbar.
- issue: Modus von יָגֵל und יִשְׂמַח
  choice: soll Jakob jubeln, Israel soll sich freuen
  alternative: wird Jakob jubeln, wird Israel sich freuen
  rationale: Die Formen können als zukünftige Folge oder im Sog des einleitenden Wunsches als jussivisch-optativ verstanden werden. Die gewählte Fassung bewahrt den Gebets- und Wunschton, ohne die zeitliche Folge auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ach, käme doch“ bildet den sehnsüchtigen Auftakt idiomatisch ab; „das Geschick wenden“ ist gehoben, aber allgemein verständlich und passt zum poetischen Register des Psalms.
