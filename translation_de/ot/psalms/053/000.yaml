base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/000.yaml
  text: 'For the choir director: according to Mahalath[a]. A Maskil[b] of David[c].'
translation:
  language: de
  text: Für den musikalischen Leiter. Nach Machalat[a]. Ein Maskil[b] Davids[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Machalat“ ist möglicherweise der Name einer Melodie oder ein musikalischer beziehungsweise liturgischer Fachausdruck; die Bedeutung ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: „Maskil“ ist ein Fachausdruck in Psalmüberschriften und bezeichnet möglicherweise ein lehrhaftes oder zur Besinnung bestimmtes Lied.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische „Davids“ kann auf Autorschaft, Zugehörigkeit, Widmung oder die Zuordnung zu einer Sammlung hinweisen.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: In Psalmüberschriften bezeichnet der Ausdruck wahrscheinlich den Verantwortlichen für die musikalische Aufführung. Die Wiedergabe ist modernes, verständliches Deutsch und legt nicht unnötig fest, ob ein Chor gemeint ist.
- source_word: עַל
  choice: Nach
  rationale: In musikalischen Überschriften kann עַל eine Melodie, Vortragsweise oder sonstige Aufführungsangabe einführen. „Nach“ ist im Deutschen knapp und lässt die genaue technische Beziehung offen.
- source_word: מָחֲלַת
  choice: Machalat
  rationale: Die Bedeutung und der Bezug des Ausdrucks sind unsicher; möglicherweise handelt es sich um einen Melodienamen oder musikalisch-liturgischen Fachbegriff. Eine Transliteration vermeidet die spekulative Übersetzung „Krankheit“.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Dies ist ein technischer Ausdruck in Psalmüberschriften, dessen genaue Bedeutung umstritten ist. Die übertragene Form bewahrt diese Unbestimmtheit, statt „Lehrgedicht“ oder „Betrachtungslied“ vorzugeben.
- source_word: לְדָוִד
  choice: Davids
  rationale: Die knappe deutsche Genitivform entspricht der traditionellen Zuordnung, ohne im Haupttext ausdrücklich „von David verfasst“ zu behaupten. Eine Fußnote nennt die mögliche Bandbreite des hebräischen ל.
theological_decisions:
- issue: Stellung der Überschrift und Art der davidischen Zuordnung
  choice: Die Überschrift wird als Bestandteil des hebräischen Textes übersetzt; לְדָוִד erscheint als „Davids“, wobei eine Fußnote die Mehrdeutigkeit erläutert.
  alternative: „Von David“ beziehungsweise ausdrücklich „verfasst von David“ oder die Behandlung der Überschrift als unübersetztes redaktionelles Material.
  rationale: Der masoretische Text überliefert die Überschrift als Teil des Psalms. Zugleich kann die Präposition ל Autorschaft, Zugehörigkeit, Widmung oder Zuordnung zu einer Sammlung ausdrücken; diese Spannung darf nicht zugunsten einer einzigen Deutung aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Form entspricht dem Charakter einer Psalmüberschrift. Unklare musikalische Fachbegriffe werden transliteriert und in Fußnoten erläutert; konfessionell oder historisch überbestimmte Deutungen werden vermieden.
