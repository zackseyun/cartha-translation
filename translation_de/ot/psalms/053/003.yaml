  text: כֻּלּ֥/וֹ סָג֮ יַחְדָּ֪ו נֶ֫אֱלָ֥חוּ אֵ֤ין עֹֽשֵׂה ט֑וֹב אֵ֝֗ין גַּם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/003.yaml
  text: All of them have turned aside; together they have become corrupt; there is none who does good[a], not even one.
translation:
  language: de
  text: Sie alle sind abgewichen, gemeinsam sind sie verdorben; keiner tut Gutes, auch nicht einer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gemeinsam sind sie verkommen“. Das hebräische Verb kann moralisches Unrein- oder Verdorbensein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלּוֹ
  choice: sie alle
  rationale: Die Wendung bezeichnet die gesamte zuvor angesprochene Gruppe; „sie alle“ gibt den kollektiven Umfang natürlich und prägnant wieder.
- source_word: סָג
  choice: sind abgewichen
  rationale: Das Verb bezeichnet ein Abweichen oder Sich-Abwenden vom rechten Weg. „Abgewichen“ wahrt das bildhafte moralische Moment, ohne es näher auszudeuten.
- source_word: יַחְדָּו
  choice: miteinander
  rationale: Das Adverb hebt hervor, dass die Aussage die Betroffenen gemeinsam beziehungsweise insgesamt erfasst. „Miteinander“ erhält den poetischen Parallelismus.
- source_word: נֶאֱלָחוּ
  choice: sind sie verdorben
  rationale: Die Niphal-Form beschreibt das Verdorben- oder moralisch Unreinwerden. „Verdorben“ vermittelt die ethische Bedeutung in natürlichem Deutsch; die mögliche Nuance „besudelt“ wird in der Fußnote bewahrt.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: keiner tut Gutes
  rationale: Die Existenzverneinung mit Partizip bestreitet, dass es jemanden gibt, der Gutes tut. Die deutsche Formulierung ist klar, umfassend und würdevoll.
- source_word: גַּם אֶחָד
  choice: auch nicht einer
  rationale: Die Wortgruppe verstärkt die vorausgehende Verneinung. „Auch nicht einer“ bildet die hebräische Struktur und ihren Nachdruck eng ab.
theological_decisions:
- issue: Umfang der moralischen Anklage im Psalm
  choice: 'Die umfassende Aussage des Hebräischen wird beibehalten: „sie alle“, „keiner“, „auch nicht einer“.'
  alternative: Die Aussage ausdrücklich nur auf eine enger bestimmte Gruppe von Übeltätern zu begrenzen.
  rationale: Der Vers gebraucht durchgehend umfassende Ausdrücke. Die Übersetzung gibt diesen Wortlaut wieder, ohne daraus über den unmittelbaren poetischen Kontext hinaus ein vollständiges Lehrsystem abzuleiten.
translation_notes:
  register: Modernes, standarddeutsches und zugleich würdiges Psalmregister. Der knappe Parallelismus und die dreifache umfassende Aussage bleiben erhalten. Die Fußnotenmarkierung [a] steht im Haupttext.
