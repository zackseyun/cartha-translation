id: PSA.53.4
reference: Psalms 53:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲ/לֹ֥א יָדְעוּ֮ פֹּ֤עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּ/י אָ֣כְלוּ לֶ֑חֶם אֱ֝לֹהִ֗ים לֹ֣א קָרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/004.yaml
  text: Do not the workers of wickedness know—those who eat up my people as they eat bread? They do not call on God[a][b][c].
translation:
  language: de
  text: Haben denn die Übeltäter keine Einsicht — sie, die mein Volk verzehren, als äßen sie Brot? Gott rufen sie nicht an.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „sie, die mein Volk essen; sie essen Brot“. Gemeint ist, dass sie das Volk ebenso selbstverständlich verzehren wie gewöhnliche Nahrung.'
    reason: lexical_alternative
  - marker: b
    text: „Mein Volk“ kann hier entweder als Wort Gottes oder als Wort des Psalmisten verstanden werden; der hebräische Text nennt den Sprecher in dieser Zeile nicht ausdrücklich.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יָדְעוּ
  choice: Haben denn ... keine Einsicht
  rationale: Die rhetorische Frage erwartet, dass das schuldhafte Unverständnis der Täter offenkundig ist. „Einsicht haben“ gibt ידע hier im Kontext natürlicher wieder als das isolierte „wissen“.
- source_word: פֹּעֲלֵי אָוֶן
  choice: die Übeltäter
  rationale: Die kompakte deutsche Bezeichnung gibt die Täter von Unrecht beziehungsweise Verderben klar und würdig wieder; die wörtlichere Form „Täter des Unrechts“ wäre ebenfalls möglich.
- source_word: אֹכְלֵי עַמִּי
  choice: sie, die mein Volk verzehren
  rationale: „Verzehren“ bewahrt das Bild des Essens und vermittelt zugleich die räuberische Unterdrückung.
- source_word: אָכְלוּ לֶחֶם
  choice: als äßen sie Brot
  rationale: Die knappe hebräische Reihung wird als Vergleich verständlich gemacht, ohne das zugrunde liegende Bild aufzugeben.
- source_word: אֱלֹהִים לֹא קָרָאוּ
  choice: Gott rufen sie nicht an
  rationale: קרא mit Gott als Bezug bezeichnet hier das Anrufen Gottes; die Voranstellung von „Gott“ erhält den nachdrücklichen Abschluss.
theological_decisions:
- issue: Sprecherbezug in „mein Volk“
  choice: „mein Volk“ ohne ausdrückliche Bestimmung des Sprechers beibehalten
  alternative: Die Wendung ausdrücklich Gott oder dem Psalmisten als Sprecher zuordnen
  rationale: Das hebräische Suffix steht in der ersten Person Singular, doch die Zeile kennzeichnet den Sprecher nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit.
- issue: Zeitbezug von יָדְעוּ und קָרָאוּ
  choice: Die erste Verbform als gegenwärtig relevante rhetorische Frage und die zweite als allgemeine Charakterisierung wiedergeben
  alternative: 'Beide Perfektformen strikt vergangen übersetzen: „Haben sie nicht erkannt ...? Sie haben Gott nicht angerufen.“'
  rationale: Im poetischen Kontext charakterisiert der Vers die Übeltäter grundsätzlich. Deutsches Präsens beziehungsweise die idiomatische rhetorische Perfektfrage vermittelt diese Aussage, ohne eine ausschließlich vergangene Situation festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache des Essens bleibt erhalten; der Vergleich wird für natürliche deutsche Verständlichkeit knapp verdeutlicht. Die Sprechermehrdeutigkeit von „mein Volk“ wird nicht aufgelöst.
