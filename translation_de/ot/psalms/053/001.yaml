  terminology: »Tor« bewahrt die ethisch-religiöse Bedeutung von נָבָל besser als ein rein intellektuelles »Dummkopf«. »Herz« erhält die hebräische Bildsprache. »Gott«, »verdorben«, »Unrecht« und »Gutes« sind registergerecht und ohne unnötige konfessionelle Prägung gewählt.
