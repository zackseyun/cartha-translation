id: PSA.53.1
reference: Psalms 53:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽ֝שְׁחִ֗יתוּ וְ/הִֽתְעִ֥יבוּ עָ֝֗וֶל אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/001.yaml
  text: The fool says in his heart[a], “There is no God.” They are corrupt; they commit abominable injustice; there is no one who does good.
translation:
  language: de
  text: 'Der Tor sagt in seinem Herzen: »Es gibt keinen Gott.« Sie sind verdorben und begehen abscheuliches Unrecht.[a] Keiner tut Gutes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »und tun verabscheuungswürdiges Unrecht« oder: »und machen ihr Tun abscheulich«. Das Hebräische verbindet ein Verb für verabscheuungswürdiges Handeln mit einem Substantiv für Unrecht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָל
  choice: der Tor
  rationale: Das Wort bezeichnet nicht bloß einen unverständigen, sondern einen moralisch verwerflichen und gottlosen Menschen. »Der Tor« bewahrt den etablierten biblischen Sinn knapp und würdig.
- source_word: בְּלִבּוֹ
  choice: in seinem Herzen
  rationale: Die hebräische Wendung bezeichnet das innere Denken und die grundlegende Haltung. Die bildhafte Rede vom Herzen bleibt erhalten.
- source_word: אֵין אֱלֹהִים
  choice: Es gibt keinen Gott
  rationale: Die Formulierung gibt die im Hebräischen naheliegende existentielle Verneinung natürlich wieder; »Gott« bezeichnet im israelitischen Zusammenhang den wahren Gott.
- source_word: הִשְׁחִיתוּ
  choice: Sie sind verdorben
  rationale: Das Verb steht im Plural und beschreibt den entstandenen sittlichen Zustand. Die Übersetzung wahrt den rhetorischen Wechsel vom repräsentativen Singular zur Mehrzahl.
- source_word: וְהִתְעִיבוּ עָוֶל
  choice: und begehen abscheuliches Unrecht
  rationale: Die Verbindung aus einem Verb für verabscheuungswürdiges Handeln und עָוֶל wird in natürlichem Deutsch wiedergegeben, ohne ihre ungewöhnliche Ausdrucksweise ganz einzuebnen.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Keiner tut Gutes
  rationale: Die knappe deutsche Form entspricht der Aussage, dass niemand als Täter des Guten zu finden ist, und bewahrt den abschließenden Nachdruck.
theological_decisions:
- issue: Wechsel vom singularischen »Tor« zu pluralischen Verben
  choice: Der erste Satz bleibt im Singular; danach folgt »Sie sind verdorben …« im Plural.
  alternative: Den ganzen Vers in den Singular setzen oder von Anfang an »Die Toren« schreiben.
  rationale: Der hebräische Text wechselt bewusst vom repräsentativen Einzelnen zur Mehrzahl und weitet damit die Aussage auf die entsprechende Menschengruppe aus.
- issue: Maskuliner repräsentativer Singular
  choice: »in seinem Herzen«
  alternative: »in ihrem Herzen« oder »im Herzen«
  rationale: Das maskuline Singularsuffix bezieht sich unmittelbar auf den singularischen נָבָל. Die Übersetzung bildet diese grammatische und rhetorische Gestalt ab.
- issue: Reichweite der Schlussaussage
  choice: »Keiner tut Gutes« bleibt ohne erklärende Einschränkung stehen.
  alternative: Die Aussage ausdrücklich auf die zuvor beschriebene Gruppe begrenzen oder universal ausdeuten.
  rationale: Der knappe hebräische Wortlaut lässt die genaue rhetorische Reichweite unausgeführt; die Übersetzung soll diese theologische Spannung nicht vorentscheiden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der prägnante Parallelismus und der auffällige Numeruswechsel des Hebräischen bleiben erhalten; altertümliche Wörter wie »Frevel« oder »Missetat« werden vermieden.
