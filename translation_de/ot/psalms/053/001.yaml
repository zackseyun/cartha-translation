  source_fidelity: 'Der Entwurf gibt die hebräische Abfolge und Aussage zuverlässig wieder: repräsentativer Singular bei נָבָל und בְּלִבּוֹ, dann der plurale Wechsel bei הִשְׁחִיתוּ / וְהִתְעִיבוּ sowie die abschließende Verneinung. »Es gibt keinen Gott«, »Sie sind verdorben«, »abscheuliches Unrecht« und »Keiner tut Gutes« sind semantisch tragfähig. Die Fußnote bildet die schwierige Verbindung וְהִתְעִיבוּ עָוֶל angemessen als Alternative ab, ohne eine umstrittene syntaktische Deutung als einzig möglich festzulegen.'
