source:
  edition: WLC
  text: שָׁ֤ם פָּֽחֲדוּ פַחַד֮ לֹא הָ֪יָה֫ פָ֥חַד כִּֽי אֱלֹהִ֗ים פִּ֭זַּר עַצְמ֣וֹת חֹנָ֑/ךְ הֱ֝בִשֹׁ֗תָה כִּֽי אֱלֹהִ֥ים מְאָסָֽ/ם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/005.yaml
  text: There they were in great fear[a], where there was no fear; for God scattered the bones of the one encamping against you. You put them to shame[c][b], for God rejected them.
translation:
  language: de
  text: Dort fürchteten sie sich sehr[a], wo keine Furcht war. Denn Gott zerstreute die Knochen dessen, der gegen dich lagert[b]. Du hast sie zuschanden gemacht[c], denn Gott hat sie verworfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Dort fürchteten sie eine Furcht.“ Das Hebräische verbindet ein Verb mit einem stammverwandten Substantiv und verstärkt so die Aussage.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „dessen, der um dich lagert“ oder „deines Belagerers“. Die hebräische Form steht im Singular und kann den Feind kollektiv bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Der hebräische Text wechselt hier unvermittelt von der Rede über Gott zur direkten Anrede: „Du hast sie zuschanden gemacht.“ Wer mit „du“ gemeint ist, wird nicht ausdrücklich genannt. Die zuvor angesprochene Person ist in der hebräischen Form bei „dich“ feminin; die Verbform „du hast“ ist maskulin.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Da
  rationale: Das Orts- bzw. Szenenadverb eröffnet die Aussage abrupt; „Da“ bewahrt diese knappe poetische Wirkung.
- source_word: פָּחֲדוּ פַחַד
  choice: gerieten sie in große Angst
  rationale: Die Verbindung aus stammverwandtem Verb und Substantiv verstärkt die Aussage. Die gewählte idiomatische Form gibt diese Intensität in natürlichem Deutsch wieder.
- source_word: לֹא הָיָה פָחַד
  choice: obwohl es keinen Grund zur Angst gab
  rationale: Die knappe hebräische Aussage verneint eine tatsächlich bestehende Bedrohung bzw. einen Anlass zur Angst. „Obwohl“ macht den im Nebeneinander liegenden Gegensatz verständlich, ohne ihn theologisch weiter auszudeuten.
- source_word: פִּזַּר
  choice: zerstreute
  rationale: Das Piel bezeichnet ein kräftiges Auseinanderstreuen; „zerstreute“ passt sowohl zum Verb als auch zum Bild der Knochen besiegter Feinde.
- source_word: עַצְמוֹת חֹנָךְ
  choice: die Knochen dessen, der dich belagerte
  rationale: Das Partizip von חנה steht formal im Singular und bezeichnet im Zusammenhang feindliches Lagern. Die Formulierung bewahrt sowohl den Singular als auch die gegen die angesprochene Person gerichtete Handlung.
- source_word: הֱבִשֹׁתָה
  choice: Du hast sie zuschanden gemacht
  rationale: Das Hiphil von בוש bedeutet, jemanden der Schande preiszugeben bzw. zuschanden zu machen. Die zweite Person und der vollendete Aspekt werden unmittelbar wiedergegeben.
- source_word: מְאָסָם
  choice: hat sie verworfen
  rationale: מאס bezeichnet ein entschiedenes Zurückweisen, oft mit Geringschätzung. „Verworfen“ ist hier prägnant und dem gewichtigen poetischen Register angemessen.
theological_decisions:
- issue: Unvermittelter Wechsel zur direkten Anrede
  choice: Die zweite Person bleibt als „Du hast sie zuschanden gemacht“ erhalten; ihr Bezug wird im Haupttext nicht ausdrücklich festgelegt.
  alternative: 'Den Satz zur dritten Person glätten: „Gott hat sie zuschanden gemacht“, oder das „Du“ ausdrücklich auf Gott beziehungsweise Zion/Israel beziehen.'
  rationale: Der masoretische Text wechselt unvermittelt zur zweiten Person. Der unmittelbar vorausgehende feminine Suffixbezug in חֹנָךְ kann auf Zion bzw. die angesprochene Gemeinschaft weisen, während manche Auslegungen in dem „Du“ eine Anrede Gottes sehen. Die Übersetzung bewahrt die Anrede und lässt den nicht ausdrücklich genannten Bezug offen.
- issue: Feindlicher Sinn von חֹנָךְ
  choice: „der dich belagerte“
  alternative: „der um dich lagerte“ oder neutral „der bei dir lagerte“
  rationale: Das Zerstreuen der Knochen, die Schande und Gottes Verwerfung kennzeichnen das Lager im Kontext eindeutig als feindlich. „Belagerte“ drückt diese Funktion knapp aus, ohne weitere militärische Einzelheiten hinzuzufügen.
- issue: Numerischer Übergang vom einzelnen Belagerer zu „sie“
  choice: Der formale Singular wird in „dessen, der dich belagerte“ bewahrt; das folgende „sie“ bleibt wie im Hebräischen pluralisch.
  alternative: 'Den Belagerer kollektiv pluralisieren: „die Knochen derer, die dich belagerten“.'
  rationale: Der hebräische Text verbindet die Knochen eines singularisch bezeichneten Belagerers mit einem späteren Pluralsuffix. Diese poetische bzw. kollektive Spannung wird nicht stillschweigend eingeebnet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Ton. Die Wiederholung von „Angst“ nimmt die hebräische Wortfigur teilweise auf; „zuschanden gemacht“ und „verworfen“ bewahren das Gewicht der Gerichtssprache. Abrupte Wechsel in Person und Zahl werden im Text erhalten und in den Fußnoten erläutert.
