  text: אֱֽלֹהִ֗ים מִ/שָּׁמַיִם֮ הִשְׁקִ֪יף עַֽל בְּנֵ֫י אָדָ֥ם לִ֭/רְאוֹת הֲ/יֵ֣שׁ מַשְׂכִּ֑יל דֹּ֝רֵ֗שׁ אֶת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/002.yaml
  text: God looks down from heaven on the children of man to see whether there is anyone who has understanding[a], who seeks God.
translation:
  language: de
  text: Gott hat vom Himmel auf die Menschenkinder[a] herabgeschaut, um zu sehen, ob es einen Verständigen gibt, einen, der Gott sucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Menschheit. Wörtlich steht hier eine hebräische Sammelbezeichnung für die Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch plurale Form bezeichnet hier den einen Gott und wird im Deutschen kontextgemäß im Singular wiedergegeben.
- source_word: מִשָּׁמַיִם
  choice: vom Himmel
  rationale: Der hebräische Plural wird in dieser Wendung im Deutschen natürlich mit dem singularischen Kollektivbegriff „Himmel“ wiedergegeben.
- source_word: הִשְׁקִיף
  choice: blickt … herab
  rationale: Das Verb bezeichnet das Schauen von einem erhöhten Standort aus. Das poetische Präsens vergegenwärtigt die Aussage, ohne den Sinn zu verändern.
- source_word: בְּנֵי אָדָם
  choice: die Menschenkinder
  rationale: Die deutsche Sammelbezeichnung bewahrt das Bild der hebräischen Wendung und bezeichnet Menschen insgesamt, ohne sie auf männliche Personen zu beschränken.
- source_word: לִרְאוֹת
  choice: um zu sehen
  rationale: Der Infinitiv drückt den Zweck des Herabblickens aus.
- source_word: הֲיֵשׁ מַשְׂכִּיל
  choice: ob es einen Verständigen gibt
  rationale: Die Verbindung aus Fragepartikel, Existenzwort und Partizip fragt, ob überhaupt ein einsichtiger beziehungsweise verständiger Mensch vorhanden ist.
- source_word: דֹּרֵשׁ אֶת אֱלֹהִים
  choice: einen, der Gott sucht
  rationale: Das Partizip beschreibt eine fortdauernde Haltung oder Ausrichtung; „Gott suchen“ ist dafür die klare und sachlich entsprechende deutsche Formulierung.
theological_decisions:
- issue: Wiedergabe von אָדָם in der Wendung בְּנֵי אָדָם
  choice: die Menschenkinder
  alternative: die Menschheit
  rationale: „Menschenkinder“ erhält die konkrete hebräische Ausdrucksform, während die Fußnote verdeutlicht, dass die gesamte Menschheit gemeint ist. So wird weder eine ausschließlich männliche Personengruppe vorausgesetzt noch die Bildsprache eingeebnet.
- issue: Bedeutungsumfang von מַשְׂכִּיל
  choice: einen Verständigen
  alternative: einen, der einsichtig handelt
  rationale: Das Partizip kann Einsicht ebenso wie daraus hervorgehendes kluges Handeln bezeichnen. „Verständiger“ wahrt diese Offenheit besser als eine rein intellektuelle oder ausdrücklich handlungsbezogene Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht poetischem Klang. „Menschenkinder“ bewahrt die Bildsprache des Hebräischen; die Apposition „einen, der Gott sucht“ gibt die parallelen Partizipien verständlich wieder.
