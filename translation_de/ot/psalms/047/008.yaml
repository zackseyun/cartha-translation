  text: מָלַ֣ךְ אֱ֭לֹהִים עַל גּוֹיִ֑ם אֱ֝לֹהִ֗ים יָשַׁ֤ב עַל כִּסֵּ֬א קָדְשֽׁ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/008.yaml
  text: God reigns over the nations[a]; God sits on his holy throne.
translation:
  language: de
  text: Gott herrscht über die Völker[a]; Gott sitzt auf seinem heiligen Thron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gott ist König geworden über die Völker; Gott hat auf seinem heiligen Thron Platz genommen.“ Die hebräischen Perfektformen können die Einsetzung seiner Königsherrschaft betonen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: herrscht
  rationale: Das Qatal kann in dieser poetischen Proklamation einen gegenwärtigen, resultativen Zustand ausdrücken. „Herrscht“ gibt Gottes Königsherrschaft im modernen Deutschen natürlich wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch plurale Form bezeichnet hier eindeutig den einen Gott. Die Wiederholung in beiden Vershälften bleibt zur Betonung erhalten.
- source_word: עַל
  choice: über
  rationale: In Verbindung mit Königsherrschaft bezeichnet עַל die Herrschaft über die Völker.
- source_word: גּוֹיִם
  choice: die Völker
  rationale: „Die Völker“ bezeichnet hier die Völkerwelt insgesamt; „Heiden“ wäre missverständlich und würde unnötige spätere Konnotationen eintragen.
- source_word: יָשַׁב
  choice: sitzt
  rationale: Die konkrete Bedeutung „sitzen“ wird bewahrt; der folgende Thron macht den königlichen Zusammenhang deutlich.
- source_word: כִּסֵּא
  choice: Thron
  rationale: Im königlichen und göttlichen Kontext ist „Thron“ die sachgemäße Wiedergabe.
- source_word: קָדְשׁוֹ
  choice: seinem heiligen
  rationale: Wörtlich steht „Thron seiner Heiligkeit“. Die attributive Wiedergabe „seinem heiligen Thron“ ist idiomatisch und bedeutungstreu.
theological_decisions:
- issue: Gottes Königsherrschaft in den hebräischen Perfektformen
  choice: 'Gegenwärtige Proklamation: „Gott herrscht … Gott sitzt auf seinem heiligen Thron.“'
  alternative: 'Ingressiv beziehungsweise perfektiv: „Gott ist König geworden … Gott hat auf seinem heiligen Thron Platz genommen.“'
  rationale: Der Psalm verkündet liturgisch Gottes gegenwärtige universale Königsherrschaft. Das deutsche Präsens gibt diese fortdauernde Wirklichkeit natürlich wieder; die mögliche Betonung ihres Eintretens wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Wiederholung von „Gott“ und das konkrete Thronbild bleiben erhalten.
