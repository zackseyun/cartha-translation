id: PSA.47.9
reference: Psalms 47:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: נְדִ֘יבֵ֤י עַמִּ֨ים נֶאֱסָ֗פוּ עַם֮ אֱלֹהֵ֪י אַבְרָ֫הָ֥ם כִּ֣י לֵֽ֭/אלֹהִים מָֽגִנֵּי אֶ֗רֶץ מְאֹ֣ד נַעֲלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/009.yaml
  text: The nobles of the peoples have gathered as the people of the God of Abraham[a], for the shields of the earth belong to God[b]; he is greatly exalted.
translation:
  language: de
  text: Die Edlen der Völker haben sich versammelt als das Volk des Gottes Abrahams[a]; denn Gott gehören die Schilde der Erde[b]. Hoch erhaben ist er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben sich zusammen mit dem Volk des Gottes Abrahams versammelt“. Die hebräische Formulierung kann enge Verbindung oder Identifikation ausdrücken; der unvokalisierte Konsonantentext erlaubt auch die Lesung „mit“.'
    reason: alternative_reading
  - marker: b
    text: 'Das heißt möglicherweise: die Herrscher oder Beschützer der Erde; wörtlich: „die Schilde der Erde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדִיבֵי
  choice: die Edlen
  rationale: נָדִיב bezeichnet hier wahrscheinlich hochgestellte Personen, Fürsten oder Vornehme. „Die Edlen“ ist würdig, verständlich und lässt den Rang anklingen, ohne eine bestimmte Amtsbezeichnung festzulegen.
- source_word: עַמִּים
  choice: der Völker
  rationale: Der Plural bezeichnet verschiedene ethnische oder politische Gemeinschaften. „Völker“ gibt diesen kollektiven Sinn im Deutschen natürlich wieder.
- source_word: נֶאֱסָפוּ
  choice: haben sich versammelt
  rationale: Der Nifal von אסף beschreibt hier ein Zusammenkommen. Die reflexive Wiedergabe ist im Deutschen idiomatisch und bewahrt den deklarativen Charakter des Verses.
- source_word: עַם אֱלֹהֵי אַבְרָהָם
  choice: als das Volk des Gottes Abrahams
  rationale: 'Die hebräische Wortfolge ist knapp und kann appositionell verstanden werden: Die versammelten Edlen werden als das Volk des Gottes Abrahams bezeichnet. „Als“ macht diese Beziehung lesbar, ohne die mögliche alternative Zuordnung zu verschweigen.'
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung der vorausgehenden Aussage ein. „Denn“ ist im modernen Deutschen klar und zugleich dem poetischen Register angemessen.
- source_word: לֵאלֹהִים
  choice: Gott gehören
  rationale: Die Präposition לְ drückt hier Zugehörigkeit aus. Die deutsche Konstruktion mit „gehören“ gibt dieses Verhältnis ausdrücklich und natürlich wieder.
- source_word: מָגִנֵּי אֶרֶץ
  choice: die Schilde der Erde
  rationale: Die wörtliche Metapher wird im Haupttext bewahrt. Gemeint sein können die Herrscher oder Beschützer der Erde; diese Deutung wird in der Fußnote genannt.
- source_word: מְאֹד נַעֲלָה
  choice: Hoch erhaben ist er
  rationale: Das maskuline Verb bezieht sich am naheliegendsten auf Gott. Die vorangestellte Formulierung bewahrt den feierlichen Nachdruck von מְאֹד und passt zur Lobpreissprache des Psalms.
theological_decisions:
- issue: Verhältnis der versammelten Völker zum Volk des Gottes Abrahams
  choice: Die Edlen der Völker werden als das Volk des Gottes Abrahams bezeichnet.
  alternative: Die Edlen haben sich zusammen mit dem Volk des Gottes Abrahams versammelt.
  rationale: Die masoretische Vokalisierung עַם legt das Substantiv „Volk“ und eine appositionelle Identifikation nahe. Der Konsonantentext kann jedoch auch als עִם, „mit“, verstanden werden. Der Haupttext folgt der masoretischen Lesung, während die Fußnote die echte syntaktische und theologische Spannung offenhält.
- issue: Bedeutung der „Schilde der Erde“
  choice: Das Bild bleibt wörtlich stehen und kann irdische Machthaber oder Beschützer bezeichnen.
  alternative: Direkte Wiedergabe als „Herrscher der Erde“.
  rationale: Die Aussage unterstellt alle irdischen Schutz- und Herrschaftsträger Gottes Hoheit. Da der hebräische Text eine konkrete Metapher verwendet, sollte die Übersetzung sie nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer Satzführung. Die Bildsprache des Hebräischen bleibt erhalten; die knappe Schlussaussage wird zur Betonung als eigener Satz formuliert.
