base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/004.yaml
  text: He chooses for us our inheritance[a], the pride of Jacob, whom he loves[c][b]. Selah
translation:
  language: de
  text: Er erwählt für uns unser Erbteil[a], den Stolz Jakobs, den er liebt.[b] Sela[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wird für uns unser Erbteil erwählen, die Herrlichkeit Jakobs, den er liebt.“'
    reason: lexical_alternative
  - marker: b
    text: „Den er liebt“ kann sich auch auf „den Stolz Jakobs“ und damit auf das Erbteil beziehungsweise das Land beziehen.
    reason: alternative_reading
  - marker: c
    text: „Sela“ ist ein hebräischer liturgischer oder musikalischer Ausdruck mit unsicherer Bedeutung und bleibt daher unübersetzt.
    reason: cultural_note
lexical_decisions:
- source_word: יִבְחַר
  choice: Er erwählt
  rationale: Das Qal-Imperfekt kann gegenwärtige, fortdauernde oder zukünftige Handlung ausdrücken. Das Präsens passt zum Lob von Gottes gegenwärtigem königlichem Handeln; die mögliche Zukunftsbedeutung wird in der Fußnote bewahrt.
- source_word: לָנוּ
  choice: für uns
  rationale: Die Präposition ל mit Suffix bezeichnet hier Vorteil oder Bezug und wird im Deutschen natürlich mit „für uns“ wiedergegeben.
- source_word: נַחֲלָתֵנוּ
  choice: unser Erbteil
  rationale: נחלה bezeichnet häufig den als Erbe zugeteilten Besitz, besonders das Bundesland. „Erbteil“ bewahrt sowohl den Erb- als auch den Zuteilungsgedanken.
- source_word: אֶת ... אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Beide Vorkommen markieren das direkte Objekt; das zweite führt wahrscheinlich eine appositionelle Erläuterung zu „unser Erbteil“ ein.
- source_word: גְּאוֹן
  choice: den Stolz
  rationale: גאון kann Stolz, Hoheit, Herrlichkeit oder Pracht bedeuten. Hier ist es positiv und bezeichnet das, worauf Jakob stolz sein darf beziehungsweise was seine besondere Herrlichkeit ausmacht.
- source_word: יַעֲקֹב
  choice: Jakobs
  rationale: Der hebräische Name wird beibehalten und nicht deutend durch „Israel“ ersetzt; gemeint ist Jakob auch in seiner gemeinschaftlichen Bedeutung als Volk.
- source_word: אֲשֶׁר אָהֵב
  choice: den er liebt
  rationale: Der Relativsatz lässt sich am natürlichsten auf Jakob beziehen. Das Perfekt אָהֵב kann eine bestehende Liebe ausdrücken und wird daher präsentisch übersetzt. Der Bezug auf das Erbteil bleibt grammatisch möglich und wird vermerkt.
- source_word: סֶלָה
  choice: Sela
  rationale: Die genaue Bedeutung des liturgischen oder musikalischen Fachworts ist ungewiss; deshalb wird es entsprechend etablierter deutscher Bibeltradition transkribiert.
theological_decisions:
- issue: Bezugswort von „den er liebt“
  choice: Der Relativsatz bezieht sich im Haupttext auf Jakob.
  alternative: 'Der Relativsatz kann sich auf das Erbteil beziehungsweise das Land beziehen: „den Stolz Jakobs, den er liebt“.'
  rationale: Jakob ist der naheliegende personale Bezug, und Gottes Liebe zu Jakob/Israel entspricht geläufiger biblischer Sprache. Da die hebräische Form den Bezug auf das Erbteil nicht ausschließt und beide deutschen Bezugswörter maskulin sind, wird die echte Mehrdeutigkeit in einer Fußnote ausdrücklich bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erbteil“ erhält die biblische Vorstellung eines zugeteilten Besitzes, ohne altertümliche Satzstellung. „Stolz Jakobs“ bewahrt die positive, aber im Deutschen leicht spannungsreiche Bildsprache des Hebräischen. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
