lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In Psalmüberschriften bezeichnet der Ausdruck herkömmlich den musikalischen Leiter. »Chorleiter« ist knapp, verständlich und würdevoll; die Präposition ל wird hier mit »für« wiedergegeben, kann aber auch als »an« verstanden werden.
- source_word: לִבְנֵי
  choice: Von den Söhnen
  rationale: Die Präposition ל kann in Psalmüberschriften Zugehörigkeit, Bestimmung oder Urheberschaft anzeigen. »Von« ist im Deutschen eine natürliche Überschriftform, ohne die Beziehung eindeutig auf Verfasserschaft festzulegen; die Alternativen werden in der Fußnote bewahrt.
- source_word: קֹרַח
  choice: Korachs
  rationale: Der Personenname wird nach der im Deutschen üblichen Form »Korah« wiedergegeben und in der Genitivverbindung entsprechend flektiert.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: מִזְמוֹר ist die übliche Gattungsbezeichnung »Psalm«. Der unbestimmte Artikel ergibt in der deutschen Überschrift eine natürliche Formulierung.
