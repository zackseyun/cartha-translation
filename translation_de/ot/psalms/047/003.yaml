source:
  edition: WLC
  text: יַדְבֵּ֣ר עַמִּ֣ים תַּחְתֵּ֑י/נוּ וּ֝/לְאֻמִּ֗ים תַּ֣חַת רַגְלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/003.yaml
  text: He subdues peoples under us[a], and nations under our feet.
translation:
  language: de
  text: Er macht Völker uns untertan[a] und Nationen unseren Füßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er unterwirft uns Völker.« Das hebräische Verb bedeutet hier »unterwerfen, untertan machen«, nicht »sprechen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַדְבֵּר
  choice: unterwirft
  rationale: Die Hifil-Form bezeichnet hier im Zusammenhang mit den Objekten »Völker« und dem Parallelbild »unter unsere Füße« das Unterwerfen, nicht das Sprechen.
- source_word: עַמִּים
  choice: Völker
  rationale: Der Plural von עַם bezeichnet Volksgruppen; »Völker« bewahrt zudem die begriffliche Unterscheidung zum parallelen לְאֻמִּים.
- source_word: תַּחְתֵּינוּ
  choice: uns
  rationale: Beim deutschen Verb »unterwerfen« wird die untergeordnete Instanz idiomatisch als Dativ ausgedrückt; so wird der Sinn von »unter uns« natürlich wiedergegeben, ohne das Parallelbild des zweiten Halbverses vorwegzunehmen.
- source_word: וּלְאֻמִּים
  choice: und Nationen
  rationale: »Nationen« gibt לְאֻמִּים angemessen wieder und erhält die poetische Variation gegenüber »Völker«.
- source_word: תַּחַת רַגְלֵינוּ
  choice: unter unsere Füße
  rationale: Die wörtliche und im Deutschen verständliche Wendung bewahrt das Bild von Herrschaft und Unterwerfung.
theological_decisions:
- issue: Gemeinschaftliche Stimme und Gottes Handeln in der Unterwerfungssprache
  choice: Gott ist das Subjekt und unterwirft andere Völker dem sprechenden »uns«.
  alternative: Eine allgemein-königliche Aussage über Israels militärischen Erfolg.
  rationale: Der unmittelbare Zusammenhang schreibt Königtum und Sieg Gott zu. Die Übersetzung bewahrt das gemeinschaftliche »uns/unsere« und mildert die Unterwerfungsmetaphorik nicht ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Parallelstruktur und das Herrschaftsbild des hebräischen Textes bleiben erhalten.
