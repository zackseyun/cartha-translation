source:
  edition: WLC
  text: כָּֽל הָ֭/עַמִּים תִּקְעוּ כָ֑ף הָרִ֥יעוּ לֵ֝/אלֹהִ֗ים בְּ/ק֣וֹל רִנָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/001.yaml
  text: Clap your hands[a], all peoples[b]; shout to God with a voice of joy.
translation:
  language: de
  text: Ihr Völker alle, klatscht in die Hände! Jubelt Gott mit Freudenrufen zu![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „mit einer Stimme des Jubels“; auch „mit Jubelschall“ oder „mit jubelnder Stimme“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעַמִּים
  choice: ihr Völker alle
  rationale: „Völker“ bewahrt den Plural und den ethnisch-korporativen Sinn von עַמִּים; die Anredeform entspricht den hebräischen Imperativen und klingt im Deutschen natürlich.
- source_word: תִּקְעוּ כָף
  choice: klatscht in die Hände
  rationale: Die hebräische Wendung bezeichnet das Schlagen beziehungsweise Klatschen der Handflächen. Die deutsche idiomatische Form gibt die gemeinschaftliche, feierliche Handlung klar wieder.
- source_word: הָרִיעוּ
  choice: jubelt … zu
  rationale: Der Hifil-Imperativ von רוע bezeichnet hier einen lauten Jubel- oder Huldigungsruf. „Jubelt … zu“ verbindet Lautstärke, Freude und die auf Gott gerichtete Akklamation.
- source_word: לֵאלֹהִים
  choice: Gott … zu
  rationale: Die Präposition ל kennzeichnet hier die Richtung beziehungsweise den Empfänger des Jubels; die deutsche Verbverbindung „Gott zujubeln“ bildet dies natürlich ab.
- source_word: בְּקוֹל רִנָּה
  choice: mit Freudenrufen
  rationale: Die Wendung bezeichnet hörbar geäußerten Jubel. „Freudenrufe“ ist im modernen Deutschen natürlicher als die formale Wiedergabe „mit einer Stimme des Jubels“, ohne den akustischen und freudigen Charakter zu verlieren.
theological_decisions:
- issue: Umfang der Anrede an die Völker
  choice: Der Aufruf richtet sich ausdrücklich an alle Völker.
  alternative: Die Anrede könnte rhetorisch besonders die Israel umgebenden Völker im Blick haben.
  rationale: כָּל הָעַמִּים bezeichnet seinem Wortlaut nach die Gesamtheit der Völker. Die Übersetzung lässt diesen universalen Umfang stehen, ohne ihn konfessionell weiter auszudeuten.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die beiden Aufforderungen werden durch Ausrufezeichen als festlicher Aufruf gestaltet; „Völker“ vermeidet die primär staatspolitische Färbung von „Nationen“.
