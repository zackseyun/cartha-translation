  text: Sing praises to God[a], sing praises; sing praises to our King, sing praises.
translation:
  language: de
  text: Singt Gott Lob[a], singt Lob; singt unserem König Lob, singt Lob!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Macht Musik für Gott, macht Musik; macht Musik für unseren König, macht Musik!“ Das hebräische Verb kann musikalisches Lob allgemein bezeichnen, nicht nur Gesang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ / זַמֵּרוּ
  choice: singt … Lob
  rationale: Der mehrfach wiederholte Imperativ von זמר fordert im gottesdienstlichen Zusammenhang zu gesungenem beziehungsweise musikalischem Lob auf. Die Wendung ist im modernen Deutsch natürlich und bewahrt die vierfache Wiederholung des hebräischen Verbs.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים bezeichnet hier den Gott Israels als Empfänger des Lobes; daher ist der Singular „Gott“ angemessen.
- source_word: לְמַלְכֵּנוּ
  choice: unserem König
  rationale: Die Präposition לְ kennzeichnet hier den Empfänger des Lobes. Der Dativ ist im Deutschen idiomatisch; „König“ wird großgeschrieben, da Gott im unmittelbaren Kontext als König bezeichnet wird.
theological_decisions:
- issue: Göttliches Königtum als Titel
  choice: unserem König
  alternative: unserem König (ohne Verständnis als besonderer Titel)
  rationale: Im Zusammenhang feiert der Psalm Gottes Herrschaft. Die Wiedergabe bewahrt diese ausdrückliche Königsaussage, ohne sie dogmatisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, eindringliche Vierfachwiederholung des hebräischen Verbs bleibt erhalten; das abschließende Ausrufezeichen gibt den auffordernden Charakter wieder.
