  yaml_path: translation/ot/psalms/047/007.yaml
  text: For God is the King of all the earth[a]; sing a psalm with understanding.
translation:
  language: de
  text: Denn Gott ist König der ganzen Erde; singt mit Einsicht![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Singt kunstvoll!“; möglicherweise auch: „Singt ein Maskil!“ (eine musikalische oder literarische Bezeichnung).'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Aufruf zum Lob ein und gibt die kausale beziehungsweise erklärende Funktion natürlich wieder.
- source_word: מֶלֶךְ
  choice: König
  rationale: Gibt das prädikative Nomen direkt und würdig wieder.
- source_word: כָּל הָאָרֶץ
  choice: der ganzen Erde
  rationale: Bewahrt die natürliche universale Bedeutung der hebräischen Genitivverbindung, ohne den Herrschaftsbereich einzuengen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch plurale Form bezeichnet hier mit singularischer Bedeutung den Gott Israels.
- source_word: זַמְּרוּ
  choice: singt
  rationale: Der Pluralimperativ von זמר fordert zu musikalischem Gotteslob auf; „singt“ ist knapp und idiomatisch.
- source_word: מַשְׂכִּיל
  choice: ein kunstvolles Lied
  rationale: Die schwierige Form kann eine verständige beziehungsweise kunstfertige Ausführung oder eine musikalisch-literarische Gattungsbezeichnung meinen. Die Haupttextfassung wahrt den poetisch-musikalischen Bezug; die echte Mehrdeutigkeit wird in der Fußnote ausgewiesen.
theological_decisions:
- issue: Umfang der Königsherrschaft Gottes
  choice: Gott wird als König der ganzen Erde dargestellt.
  alternative: „Erde“ könnte kontextabhängig auch „Land“ bedeuten.
  rationale: כָּל הָאָרֶץ bezeichnet hier im Zusammenhang des Psalms am natürlichsten die gesamte Erde und damit die universale Königsherrschaft Gottes; die Übersetzung fügt darüber hinaus keine Lehrbestimmung hinzu.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Klang. Der Pluralimperativ „singt“ bleibt erhalten; die umstrittene Bedeutung von מַשְׂכִּיל wird nicht stillschweigend vereindeutigt.
