  text: God has gone up with a shout[a]; Yahweh[b], with the sound of a trumpet.
translation:
  language: de
  text: 'Gott ist hinaufgestiegen[a] unter Jubelrufen,

    Jahwe beim Klang des Schofars[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ist hinaufgegangen.'
    reason: lexical_alternative
  - marker: b
    text: Ein Schofar ist ein Blashorn, meist ein Widderhorn.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָה
  choice: ist hinaufgestiegen
  rationale: Das Verb bezeichnet ein Hinaufgehen oder Aufsteigen. Das deutsche Perfekt gibt die abgeschlossene poetische Aussage natürlich wieder, ohne eine speziell christologische Himmelfahrtsaussage festzuschreiben.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Trotz der morphologischen Pluralform ist hier aufgrund des Parallelismus mit יהוה eindeutig der Gott Israels im Singular gemeint.
- source_word: בִּתְרוּעָה
  choice: unter Jubelrufen
  rationale: תְּרוּעָה bezeichnet einen lauten Ruf der Akklamation, des Sieges oder des Gottesdienstes. Im Kontext des Königsjubels erfasst „Jubelrufe“ den Sinn natürlich, ohne ihn auf einen Schlachtruf zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt den im Hebräischen ausdrücklich stehenden Namen, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּקוֹל
  choice: beim Klang
  rationale: קוֹל kann Stimme, Laut oder Klang bedeuten. In Verbindung mit einem Blasinstrument ist „Klang“ die natürliche deutsche Entsprechung; „beim“ gibt die begleitende akustische Szene wieder.
- source_word: שׁוֹפָר
  choice: Schofar
  rationale: Die direkte Bezeichnung bewahrt die konkrete israelitische Horn­trompete genauer als das allgemeinere „Trompete“; eine Fußnote erklärt das Instrument.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Eigennamen. „Jahwe“ bewahrt ihn als Namen und entspricht der üblichen wissenschaftlich begründeten deutschen Form.
- issue: Möglicherweise christologisch klingende Aufstiegssprache
  choice: ist hinaufgestiegen
  alternative: ist aufgefahren; steigt empor
  rationale: „Hinaufgestiegen“ bildet die räumliche beziehungsweise königliche Bildsprache des Psalms ab, ohne durch „aufgefahren“ ausdrücklich eine spätere christologische Deutung in den Vers einzutragen.
translation_notes:
  register: Moderne, gehobene und zugleich allgemein verständliche Psalmsprache. Der zweizeilige Parallelismus des Hebräischen bleibt erhalten; die knappe zweite Zeile ergänzt das in der ersten Zeile vorausgesetzte Verb.
