  text: כִּֽי יְהוָ֣ה עֶלְי֣וֹן נוֹרָ֑א מֶ֥לֶךְ גָּ֝דוֹל עַל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/002.yaml
  text: For Yahweh Most High is to be feared[a], a great King over all the earth.
translation:
  language: de
  text: Denn Jahwe, der Höchste, ist furchtgebietend[a], ein großer König über die ganze Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu fürchten« oder »Ehrfurcht gebietend«. Das hebräische Wort beschreibt jemanden, der Furcht und ehrfürchtiges Staunen hervorruft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung für den Aufruf zum Lob ein und bewahrt den kausalen Zusammenhang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als im Deutschen geläufige Transliteration wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: עֶלְיוֹן
  choice: der Höchste
  rationale: Bewahrt den als Gottesbezeichnung gebrauchten superlativischen Titel und klingt im Deutschen natürlich.
- source_word: נוֹרָא
  choice: ist furchtgebietend
  rationale: Bezeichnet jemanden, der ehrfürchtige Furcht und Staunen hervorruft; die Wiedergabe vermeidet sowohl eine Abschwächung als auch die Beschränkung auf bloßen Schrecken.
- source_word: מֶלֶךְ גָּדוֹל
  choice: ein großer König
  rationale: Bewahrt das königliche Bild und gibt die Größe und Majestät unmittelbar wieder.
- source_word: עַל כָּל הָאָרֶץ
  choice: über die ganze Erde
  rationale: Im Kontext von Gottes universaler Königsherrschaft bezeichnet אֶרֶץ hier am ehesten die gesamte Erde.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen; die Transliteration bewahrt ihn, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutungsumfang von נוֹרָא
  choice: furchtgebietend
  alternative: zu fürchten; ehrfurchtgebietend; schrecklich
  rationale: Die Formulierung wahrt die Spannung zwischen Furcht und ehrfürchtigem Staunen, ohne sie ausschließlich als Angst oder als unverbindliche Bewunderung zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dichterischer Knappheit. Die Apposition »der Höchste« bewahrt den göttlichen Titel; »furchtgebietend« erhält die Bedeutungsbreite des Hebräischen.
