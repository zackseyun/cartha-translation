  text: And let the assembly of peoples surround you[b][a]; and over them return on high.
translation:
  language: de
  text: Die Versammlung der Völker[a] umgebe dich; und über ihr[b] kehre zur Höhe zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nationen«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Suffix ist feminin Singular und bezieht sich auf die Versammlung als kollektive Einheit; dem Sinn nach ist auch »über ihnen« möglich.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲדַת
  choice: Versammlung
  rationale: Das Substantiv bezeichnet eine zusammengekommene Gruppe. »Versammlung« ist im heutigen Deutsch natürlich und vermeidet eine unnötige kirchliche Färbung.
- source_word: לְאֻמִּים
  choice: Völker
  rationale: Der Plural bezeichnet ethnische oder nationale Gruppen. »Völker« bewahrt diese Mehrzahl und passt idiomatisch zur Versammlung.
- source_word: תְּסוֹבְבֶךָּ
  choice: umgebe dich
  rationale: Die Imperfektform von סבב wird im Zusammenhang als Wunsch beziehungsweise Aufforderung verstanden. Der Konjunktiv »umgebe« gibt diese jussivische Nuance knapp und würdig wieder.
- source_word: וְעָלֶיהָ
  choice: über ihr
  rationale: Das feminine Singularsuffix verweist grammatisch auf die feminine kollektive »Versammlung«. Das Deutsche kann diesen Singular anders als das Englische unmittelbar bewahren.
- source_word: לַמָּרוֹם
  choice: zur Höhe
  rationale: מָרוֹם bezeichnet die Höhe oder einen erhöhten Ort. »Zur Höhe« erhält sowohl die räumliche Bildsprache als auch die mögliche Bedeutung erhabener Herrschaft, ohne »Himmel« oder »Thron« einzutragen.
- source_word: שׁוּבָה
  choice: kehre zurück
  rationale: Der verstärkte Imperativ von שוב fordert zur Rückkehr oder Umkehr auf. »Kehre zurück« bleibt nahe am Wortlaut und vermeidet die nicht ausdrücklich genannte Deutung als Thronbesteigung.
theological_decisions:
- issue: Ob der Vers Gottes richterliche Herrschaft in erhabener Stellung oder eine buchstäbliche Bewegung in die Höhe beschreibt
  choice: 'Die räumlich-erhabene Bildsprache bleibt offen: Gott wird gebeten, über der Versammlung zur Höhe zurückzukehren.'
  alternative: Gott soll körperlich zum Himmel aufsteigen oder erneut seinen Richterthron einnehmen.
  rationale: Imperativ und Kontext sprechen für eine Bitte. Der Wortlaut nennt jedoch weder ausdrücklich den Himmel noch einen Thron; deshalb wird die Spannung zwischen räumlicher Bewegung und erhabener Herrschaft nicht aufgelöst.
- issue: Ob תְּסוֹבְבֶךָּ als jussivischer Wunsch oder als Zukunftsaussage zu lesen ist
  choice: 'Jussivischer Wunsch: »umgebe dich«'
  alternative: 'Zukunftsaussage: »wird dich umgeben«'
  rationale: Im Zusammenhang der Bitten des Psalms ist die Wunsch- beziehungsweise Aufforderungsnuance wahrscheinlich, doch die hebräische Imperfektform lässt auch eine indikativische Zukunftsdeutung zu.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit poetischer Satzstellung. Der Konjunktiv »umgebe« und der Imperativ »kehre zurück« bilden die Gebetssprache des hebräischen Verses nach. Der feminine Singularbezug wird im Deutschen grammatisch bewahrt.
