  text: 'Look: he labors with wickedness, conceives trouble, and gives birth to falsehood.[a]'
translation:
  language: de
  text: 'Sieh: Er ist in Wehen mit Unrecht, wird schwanger mit Unheil und gebiert Lüge.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen überlagern sich Bilder von Wehen, Empfängnis beziehungsweise Schwangerschaft und Geburt. Das erste Verb kann auch allgemeiner als „sich abmühen“ wiedergegeben werden; zudem überschneiden sich die Bedeutungsbereiche von „Unrecht“ und „Unheil“.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Interjektion lenkt unmittelbar die Aufmerksamkeit auf das eindringliche Bild; „Sieh“ ist knapp, gegenwärtig und würdevoll.
- source_word: יְחַבֶּל
  choice: liegt in Wehen mit
  rationale: Das Verb bezeichnet hier im Geburtsbild das schmerzhafte Kreißen beziehungsweise die Wehen. Die Formulierung bewahrt diese konkrete Bildsprache und glättet die ungewöhnliche Abfolge nicht zu einer biologisch chronologischen Darstellung.
- source_word: אָוֶן
  choice: Unrecht
  rationale: Das Wort umfasst moralische Bosheit sowie deren unheilvolle Wirkung. „Unrecht“ hält die moralische Bedeutung fest und bleibt vom folgenden עָמָל unterscheidbar.
- source_word: הָרָה
  choice: wird schwanger mit
  rationale: Das Verb bezeichnet Empfangen beziehungsweise Schwangerwerden. „Wird schwanger mit“ erhält das körperliche Bild und gibt die verbale Dynamik wieder.
- source_word: עָמָל
  choice: Unheil
  rationale: Im Zusammenhang bezeichnet das Wort leidbringende Mühsal oder schädliches Tun. „Unheil“ passt zur Hervorbringung des Bösen, ohne es mit אָוֶן gleichzusetzen.
- source_word: יָלַד שָׁקֶר
  choice: gebiert Lüge
  rationale: Die Wendung vollendet das Geburtsbild. „Gebiert Lüge“ ist knapp und bewahrt sowohl die Konkretheit des Verbs als auch den abstrakten, poetischen Charakter von שָׁקֶר.
