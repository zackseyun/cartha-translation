id: PSA.7.6
reference: Psalms 7:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ק֘וּמָ֤/ה יְהוָ֨ה בְּ/אַפֶּ֗/ךָ הִ֭נָּשֵׂא בְּ/עַבְר֣וֹת צוֹרְרָ֑/י וְ/ע֥וּרָ/ה אֵ֝לַ֗/י מִשְׁפָּ֥ט צִוִּֽיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/006.yaml
  text: Rise up[a], O Yahweh, in your anger; lift yourself up against the fury of my enemies; awake for me[c][b]; you have appointed judgment.
translation:
  language: de
  text: Steh auf, Jahwe, in deinem Zorn! Erhebe dich[a] gegen das Wüten meiner Bedränger! Wach für mich auf[b]; du hast Gericht angeordnet.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zeige dich erhaben gegenüber dem Wüten meiner Bedränger.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Wach zu mir auf“, das heißt: Wach auf, um für mich zu handeln.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Wach für mich auf zu dem Gericht, das du angeordnet hast.“ Die knappe hebräische Satzfolge lässt auch diese Verbindung zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Steh auf
  rationale: Der Imperativ von קום ruft Gott bildhaft zum Eingreifen auf. „Steh auf“ ist gegenwärtiges, natürliches Deutsch und bewahrt das poetische Bild.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּאַפֶּךָ
  choice: in deinem Zorn
  rationale: אַף bezeichnet wörtlich die Nase, idiomatisch jedoch den Zorn. Die Präposition ב wird transparent mit „in“ wiedergegeben.
- source_word: הִנָּשֵׂא
  choice: Erhebe dich
  rationale: Der Nifal-Imperativ von נשׂא kann sowohl ein machtvolles Sich-Erheben zum Handeln als auch Erhöhung ausdrücken. „Erhebe dich“ erhält diese Spannweite weitgehend.
- source_word: בְּעַבְרוֹת
  choice: gegen das Wüten
  rationale: Der Plural von עֶבְרָה bezeichnet heftige Zornesausbrüche. Im feindlichen Zusammenhang gibt „gegen das Wüten“ sowohl die Intensität als auch die Richtung des erbetenen Eingreifens natürlich wieder.
- source_word: צוֹרְרָי
  choice: meiner Bedränger
  rationale: Das substantivierte Partizip von צרר bezeichnet Menschen, die den Beter anfeinden oder bedrängen. „Bedränger“ bewahrt diesen aktiven Zug genauer als das allgemeinere „Feinde“.
- source_word: וְעוּרָה
  choice: Wach … auf
  rationale: Der Imperativ von עור setzt die Reihe bildhafter Bitten fort. Die anthropomorphe Sprache wird beibehalten, ohne daraus eine Aussage über tatsächlichen göttlichen Schlaf abzuleiten.
- source_word: אֵלַי
  choice: für mich
  rationale: Wörtlich steht „zu mir“; im Zusammenhang einer Bitte um richterliches Eingreifen liegt der benefaktive Sinn „für mich“ beziehungsweise „meinetwegen“ nahe.
- source_word: מִשְׁפָּט
  choice: Gericht
  rationale: מִשְׁפָּט bezeichnet hier richterliches Handeln oder eine richterliche Entscheidung. Das deutsche „Gericht“ erhält die rechtliche und zugleich ereignishafte Bedeutung.
- source_word: צִוִּיתָ
  choice: du hast … angeordnet
  rationale: צוה bedeutet gewöhnlich „befehlen“ oder „anordnen“. In Verbindung mit Gericht ist „angeordnet“ idiomatisch und bewahrt Gottes bestimmende Initiative.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die übliche deutsche Form „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Anthropomorphe Aufforderungen an Gott
  choice: Die Bilder „Steh auf“, „Erhebe dich“ und „Wach auf“ werden bewahrt.
  alternative: Paraphrase wie „Greif ein“ oder „Handle“
  rationale: Die imperativische Bildsprache prägt die Dringlichkeit des Gebets. Ihre Beibehaltung behauptet weder göttliche Untätigkeit noch tatsächlichen Schlaf.
- issue: Syntaktische Zuordnung von מִשְׁפָּט צִוִּיתָ
  choice: 'Selbstständiger Satz: „du hast Gericht angeordnet“'
  alternative: 'Anschluss an den Imperativ: „Wach für mich auf zu dem Gericht, das du angeordnet hast“'
  rationale: Die knappe hebräische Wortfolge erlaubt beide Bezüge. Die Hauptfassung folgt der akzentbedingten Gliederung, während die Fußnote die mögliche attributive beziehungsweise finale Verbindung offenhält.
translation_notes:
  register: Poetisch, eindringlich und würdevoll, zugleich in modernem Standarddeutsch. Die kurzen Imperative bilden die Steigerung des hebräischen Gebets nach; Ausrufezeichen machen dessen Dringlichkeit hörbar. „Bedränger“ und „Wüten“ sind gehoben, aber allgemein verständlich.
