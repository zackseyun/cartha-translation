  text: יָשׁ֣וּב עֲמָל֣/וֹ בְ/רֹאשׁ֑/וֹ וְ/עַ֥ל קָ֝דְקֳד֗/וֹ חֲמָס֥/וֹ יֵרֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/016.yaml
  text: His trouble returns on his own head[b][a], and his violence descends on his own skull.
translation:
  language: de
  text: 'Sein Unheil kehrt auf seinen eigenen Kopf zurück,[a]

    und seine Gewalttat kommt auf seinen Scheitel herab.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sein böses Tun kehrt auf seinen eigenen Kopf zurück.“ Das hebräische Wort עָמָל kann Unheil, Mühsal oder böswilliges Tun bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf den höchsten Punkt seines Kopfes“. Das hebräische Wort קָדְקֹד bezeichnet den Scheitel beziehungsweise den obersten Teil des Kopfes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  choice: kehrt … zurück
  rationale: Das Qal-Imperfekt von שׁוב bezeichnet hier, wie das vom Täter verursachte Unheil auf ihn selbst zurückfällt. „kehrt … zurück“ bewahrt die Umkehrungs- und Vergeltungsbildlichkeit.
- source_word: עֲמָלוֹ
  choice: sein Unheil
  rationale: עָמָל kann Mühsal, Unheil oder böswilliges Tun bezeichnen. Im Zusammenhang meint es das schädliche Tun beziehungsweise das dadurch verursachte Unheil; „Unheil“ wahrt diese Bedeutungsbreite besser als das allgemeinere „Mühe“.
- source_word: בְרֹאשׁוֹ
  choice: auf seinen eigenen Kopf
  rationale: Die Wendung bezeichnet bildhaft, dass die Folgen den Täter selbst treffen. „eigenen“ macht den im Kontext liegenden Rückbezug im Deutschen natürlich deutlich.
- source_word: קָדְקֳדוֹ
  choice: seinen Scheitel
  rationale: קָדְקֹד bezeichnet den Scheitel beziehungsweise den obersten Teil des Kopfes. „Scheitel“ ist präzise, würdevoll und erhält den poetischen Parallelismus zu „Kopf“.
- source_word: חֲמָסוֹ
  choice: seine Gewalttat
  rationale: חָמָס bezeichnet Gewalt, gewaltsames Unrecht oder Frevel. Der Singular „Gewalttat“ lässt erkennen, dass sein eigenes gewaltsames Handeln auf ihn zurückkommt.
- source_word: יֵרֵד
  choice: kommt … herab
  rationale: Das Qal-Imperfekt von ירד bedeutet „herabgehen/herabkommen“. „kommt … herab“ bewahrt das räumliche Bild und klingt im modernen Deutschen natürlicher als „steigt herab“.
theological_decisions:
- issue: Vergeltungsbild poetischer Gerechtigkeit
  choice: Das vom Gewalttäter verursachte Unheil trifft ihn selbst.
  alternative: Der Vers könnte allgemeiner von Leid sprechen, das zu einem Menschen zurückkehrt, ohne den moralischen Rückbezug ausdrücklich hervorzuheben.
  rationale: Die parallelen Aussagen – sein Unheil kehrt auf seinen Kopf zurück und seine Gewalttat kommt auf seinen Scheitel herab – stellen deutlich dar, dass das eigene böse Tun auf den Täter zurückfällt. Die Übersetzung bewahrt dies, ohne eine weitergehende Vergeltungslehre einzutragen.
translation_notes:
  register: Moderne, gehobene Standardsprache mit bewahrtem poetischem Parallelismus. „Unheil“ und „Gewalttat“ machen den moralischen Zusammenhang verständlich, während die Fußnoten die echte lexikalische Bedeutungsbreite offenhalten.
