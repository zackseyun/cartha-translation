base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/003.yaml
  text: O Yahweh my God[a], if I have done this, if there is injustice in my hands—
translation:
  language: de
  text: Jahwe, mein Gott, wenn ich das getan habe, wenn an meinen Händen Unrecht ist[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn Unrecht in meinen Händen ist“. Die hebräische Wendung kann schuldhaftes Handeln oder persönliche Schuld bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des Gottesnamens bewahrt dessen Charakter als Eigenname.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Die Form mit dem Suffix der 1. Person Singular bezeichnet den von dem Beter direkt angeredeten Gott.
- source_word: אִם
  choice: wenn
  rationale: Die Partikel leitet hier eine bedingte Selbstverwünschung ein; „wenn“ ist im Deutschen die natürliche Entsprechung.
- source_word: עָשִׂיתִי זֹאת
  choice: ich das getan habe
  rationale: Die Form bezeichnet eine vollendete Handlung, deren mögliche Folgen für die gegenwärtige Lage des Beters relevant sind.
- source_word: יֶשׁ
  choice: ist
  rationale: Die Existenzpartikel wird im deutschen Satz idiomatisch mit „ist“ wiedergegeben.
- source_word: עָוֶל
  choice: Unrecht
  rationale: Das Wort bezeichnet moralisches oder rechtliches Fehlverhalten; „Unrecht“ bewahrt den forensischen Ton und bleibt allgemein verständlich.
- source_word: בְּכַפָּי
  choice: an meinen Händen
  rationale: Die wörtliche Körpermetapher wird bewahrt und zugleich so formuliert, dass sie im Deutschen Schuld oder Verantwortlichkeit andeuten kann.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text gebraucht den Eigennamen direkt; „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des Unrechts an den Händen
  choice: Die bildhafte, mehrdeutige Wendung bleibt stehen
  alternative: wenn ich mich schuldig gemacht habe
  rationale: Der Text kann sowohl schuldhaftes Handeln als auch anhaftende moralische Schuld bezeichnen. Eine ausdrückliche Auflösung auf nur eine dieser Bedeutungen wäre enger als das Hebräische.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Wenn-Sätze und der Gedankenstrich bewahren den offenen Anschluss an die folgende Selbstverwünschung; die Handmetapher bleibt erhalten.
