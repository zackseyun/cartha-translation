base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/012.yaml
  text: If he does not turn back[a], he will sharpen his sword[c][b]; he has bent his bow and made it ready.
translation:
  language: de
  text: Wenn er nicht umkehrt[a], wird er sein Schwert schärfen; seinen Bogen hat er gespannt und bereitgemacht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn er nicht Buße tut.“ Das hebräische Verb bedeutet „umkehren/zurückkehren“ und kann im Zusammenhang die Bedeutung von Buße einschließen.'
    reason: lexical_alternative
  - marker: b
    text: Die Fürwörter können sich auf Gott beziehen, der seine Waffen zum Gericht bereitmacht, oder – weniger wahrscheinlich – auf den Frevler, der seine eigenen Waffen vorbereitet.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  choice: Wenn ... nicht
  rationale: Gibt die hebräische Bedingungskonstruktion transparent und natürlich wieder.
- source_word: יָשׁוּב
  choice: umkehrt
  rationale: שׁוב bezeichnet ein Umkehren oder Zurückkehren und kann hier Reue einschließen, ohne dass der deutsche Haupttext diese Bedeutung verengt.
- source_word: חַרְבּוֹ יִלְטוֹשׁ
  choice: schärft er sein Schwert
  rationale: ילטש bedeutet, eine Klinge zu schärfen; das Präsens gibt die im Hebräischen dargestellte drohende Handlung im Deutschen prägnant wieder.
- source_word: קַשְׁתּוֹ דָרַךְ
  choice: seinen Bogen hat er gespannt
  rationale: דרך bezeichnet beim Bogen dessen Spannen beziehungsweise Zurichten zum Schuss; „gespannt“ ist die natürliche deutsche Entsprechung.
- source_word: וַיְכוֹנְנֶהָ
  choice: und bereitgemacht
  rationale: כון bezeichnet hier das Fertigmachen oder Bereitstellen; das feminine Suffix bezieht sich auf den Bogen.
theological_decisions:
- issue: Bezug der Pronomen in der dritten Person Singular
  choice: Die Pronomen bleiben unausgedeutet; im unmittelbaren Zusammenhang liegt Gott als richtender Krieger nahe.
  alternative: Die Pronomen können auf den Frevler bezogen werden, der seine eigenen Waffen vorbereitet.
  rationale: Der hebräische Text nennt das Subjekt in diesem Vers nicht ausdrücklich. Der Kontext stützt vor allem den Bezug auf Gott, doch die echte syntaktische Mehrdeutigkeit soll nicht durch einen eingefügten Gottesnamen beseitigt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Waffenmetaphorik und die Mehrdeutigkeit des Subjekts bleiben erhalten; „umkehrt“ ist verständlich und zugleich näher am Bedeutungsumfang des Hebräischen als das enger theologische „bereut“.
