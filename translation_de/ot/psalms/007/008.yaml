id: PSA.7.8
reference: Psalms 7:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָה֮ יָדִ֪ין עַ֫מִּ֥ים שָׁפְטֵ֥/נִי יְהוָ֑ה כְּ/צִדְקִ֖/י וּ/כְ/תֻמִּ֣/י עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/008.yaml
  text: Yahweh judges the peoples[a]; judge me, O Yahweh[c][b], according to my righteousness and according to my integrity that is upon me.
translation:
  language: de
  text: Jahwe richtet die Völker[a]. Richte mich, Jahwe[b], nach meiner Gerechtigkeit und nach meiner Lauterkeit, die mir eigen ist[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe wird die Völker richten.“'
    reason: Das hebräische Imperfekt kann hier entweder eine allgemein gültige Handlung oder ein zukünftiges Gericht ausdrücken.
  - marker: b
    text: '„Richte mich“ kann hier auch bedeuten: „Verschaffe mir Recht.“'
    reason: Der hebräische Imperativ kann im Zusammenhang die Bitte um einen günstigen Richterspruch beziehungsweise um Rechtverschaffung ausdrücken.
  - marker: c
    text: 'Wörtlich: „die auf mir ist“; gemeint sein kann auch: „die mir zukommt“ oder „die mich betrifft“.'
    reason: Die Präposition עַל lautet wörtlich „auf/über“; ihre genaue Beziehung zur Lauterkeit ist im Hebräischen knapp und lässt sich im Deutschen nicht zugleich natürlich und vollständig wörtlich wiedergeben.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: יָדִין
  choice: richtet
  rationale: Das Imperfekt kann hier in poetischer Sprache eine allgemeine, gegenwärtig gültige Aussage bezeichnen; zugleich bleibt die richterliche Wortverbindung zur folgenden Bitte erhalten.
- source_word: עַמִּים
  choice: die Völker
  rationale: Der Plural bezeichnet menschliche Volksgruppen; „Völker“ ist im Deutschen die natürliche kollektive Wiedergabe.
- source_word: שָׁפְטֵנִי
  choice: Richte mich
  rationale: Die direkte Bedeutung des Imperativs wird bewahrt. Im Zusammenhang kann die Bitte auf einen günstigen Richterspruch zielen, ohne dass dies im Haupttext festgelegt wird.
- source_word: כְּצִדְקִי
  choice: nach meiner Gerechtigkeit
  rationale: Die Form bezeichnet die eigene Gerechtigkeit beziehungsweise das rechte Verhalten des Beters als Maßstab des Urteils; die ausdrückliche Ich-Aussage bleibt erhalten.
- source_word: וּכְתֻמִּי
  choice: und nach meiner Lauterkeit
  rationale: „Lauterkeit“ gibt moralische Ganzheit und Redlichkeit wieder, ohne zwingend absolute Sündlosigkeit zu behaupten.
- source_word: עָלָי
  choice: die mir eigen ist
  rationale: Die idiomatische deutsche Formulierung drückt aus, dass die Lauterkeit dem Beter zukommt. Die wörtliche räumliche Fassung wird in einer Fußnote dokumentiert.
theological_decisions:
- issue: Behauptet der Beter mit „meiner Gerechtigkeit“ und „meiner Lauterkeit“ absolute Sündlosigkeit?
  choice: Die Ich-Aussage wird ohne Abschwächung als Berufung auf die eigene Gerechtigkeit und Lauterkeit wiedergegeben.
  alternative: Die Aussage im Haupttext auf „Unschuld in dieser Sache“ oder „gerechte Sache“ einzugrenzen.
  rationale: Der hebräische Text formuliert die persönliche Berufung ausdrücklich, bestimmt ihren Umfang aber nicht näher. Die Übersetzung bewahrt diese theologische Spannung und legt weder absolute Sündlosigkeit noch ausschließlich relative Unschuld fest.
- issue: Soll שָׁפְטֵנִי bereits als Bitte um Rechtfertigung beziehungsweise Freispruch übersetzt werden?
  choice: „Richte mich“
  alternative: „Verschaffe mir Recht“ oder „Sprich mich frei“
  rationale: Der Kontext erlaubt einen erhofften günstigen Richterspruch, doch das Verb selbst fordert zunächst Gottes Urteil. Die offenere Wiedergabe bewahrt die Ernsthaftigkeit, sich Gottes Gericht zu stellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „richtet/Richte“ bildet die hebräische Verbindung zweier verschiedener richterlicher Verben sinngemäß nach. „Lauterkeit“ ist gehoben, aber allgemein verständlich und weniger missverständlich als „Vollkommenheit“.
