source:
  edition: WLC
  text: שִׁגָּי֗וֹן לְ/דָ֫וִ֥ד אֲשֶׁר שָׁ֥ר לַ/יהוָ֑ה עַל דִּבְרֵי כ֝֗וּשׁ בֶּן יְמִינִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/000.yaml
  text: A Shiggaion of David[a], which he sang to Yahweh concerning the words of Cush, a Benjaminite.
translation:
  language: de
  text: Ein Schiggajon von David[a], das er für Jahwe sang, über die Worte des Kusch, eines Benjaminiters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise ein musikalischer oder poetischer Fachausdruck, etwa „Klagelied“ oder „wild bewegtes Lied“; das seltene hebräische Wort ist in seiner Bedeutung unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁגָּיוֹן
  choice: Schiggajon
  rationale: Der seltene hebräische Ausdruck ist in seiner genauen Bedeutung unsicher. Die eingedeutschte Umschrift bewahrt seinen möglichen musikalischen oder poetischen Fachcharakter, ohne eine umstrittene Deutung festzuschreiben.
- source_word: לְדָוִד
  choice: von David
  rationale: Die Präposition ל kann in Psalmüberschriften Urheberschaft, Zugehörigkeit oder Widmung bezeichnen. „Von David“ ist knapp und lässt diese Nuancen eher offen als eine ausdrücklichere Formulierung.
- source_word: אֲשֶׁר שָׁר
  choice: das er … sang
  rationale: Dies gibt den Relativsatz und das Verb שׁיר unmittelbar und in natürlichem Deutsch wieder; das Relativpronomen bezieht sich auf „Schiggajon“.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Bei einem Lied bezeichnet ל hier den Adressaten. „Für Jahwe sang“ ist idiomatisches Deutsch und bewahrt diese Ausrichtung.
- source_word: עַל
  choice: über
  rationale: עַל kann hier das Thema oder den Anlass des Liedes angeben. „Über“ bleibt bewusst weiter als eindeutig kausale Wiedergaben wie „wegen“.
- source_word: דִּבְרֵי
  choice: die Worte
  rationale: Die Mehrzahl von דָּבָר kann „Worte“, „Angelegenheiten“ oder „Vorgänge“ bedeuten. „Worte“ ist die formal naheliegende Wiedergabe und vermeidet die unbelegte Präzisierung als „Anschuldigungen“.
- source_word: כּוּשׁ
  choice: Kusch
  rationale: Der Personenname wird nach gängiger deutscher Bibeltransliteration wiedergegeben.
- source_word: בֶּן יְמִינִי
  choice: eines Benjaminiters
  rationale: Die Wendung bezeichnet idiomatisch einen Angehörigen des Stammes Benjamin. Die Apposition ist im Deutschen klarer als eine wörtliche, missverständliche Wiedergabe mit „Sohn“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdige Überschriftensprache. Die seltene Gattungsbezeichnung bleibt transliteriert; Mehrdeutigkeiten bei לְדָוִד, עַל und דִּבְרֵי werden nicht unnötig aufgelöst.
