id: PSA.7.10
reference: Psalms 7:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מָֽגִנִּ֥/י עַל אֱלֹהִ֑ים מ֝וֹשִׁ֗יעַ יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/010.yaml
  text: My shield is with God[b][a], who saves the upright in heart.
translation:
  language: de
  text: Mein Schild ist bei Gott[a], der die rettet, die aufrichtigen Herzens sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gott ist mein Schild.« Die knappe hebräische Formulierung lässt auch diese sinngemäße Umstellung zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנִּי
  choice: Mein Schild
  rationale: Die konkrete Schildmetapher wird bewahrt; abstraktere Wiedergaben wie »mein Schutz« würden das Bild abschwächen.
- source_word: עַל
  choice: ist bei
  rationale: Die Präposition bezeichnet hier wahrscheinlich, dass der Schutz des Beters bei Gott zu finden ist bzw. auf ihm beruht. »Bei« hält die knappe hebräische Konstruktion offen, ohne ein rein räumliches Verständnis festzuschreiben.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch plurale Form bezeichnet hier eindeutig den einen Gott Israels und wird daher im Singular wiedergegeben.
- source_word: מוֹשִׁיעַ
  choice: der … rettet
  rationale: Das Partizip beschreibt Gottes kennzeichnendes Handeln. Ein Relativsatz ist im Deutschen natürlich und erhält diesen beschreibenden Sinn.
- source_word: יִשְׁרֵי לֵב
  choice: die aufrichtigen Herzens sind
  rationale: Die Wendung bezeichnet Menschen, deren Inneres moralisch aufrichtig ist. Die idiomatische deutsche Formulierung bewahrt sowohl »aufrichtig« als auch das Bild des Herzens.
theological_decisions:
- issue: Syntaktisches Verhältnis im ersten Halbvers
  choice: '»Mein Schild ist bei Gott«: Der Schutz des Beters ist bei Gott zu finden.'
  alternative: »Gott ist mein Schild«
  rationale: Im Hebräischen fehlt ein ausdrückliches Verb, und die knappe Verbindung מָגִנִּי עַל אֱלֹהִים lässt mehrere idiomatische Deutungen zu. Der Haupttext bleibt nahe an der Wortfolge und bewahrt die Spannung; die geläufigere Umstellung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Schildmetapher bleibt erhalten; »aufrichtigen Herzens« ist gehoben, aber allgemein verständlich und entspricht dem poetischen Register des Psalms.
