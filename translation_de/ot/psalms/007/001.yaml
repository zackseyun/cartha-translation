  text: יְהוָ֣ה אֱ֭לֹהַ/י בְּ/ךָ֣ חָסִ֑יתִי הוֹשִׁיעֵ֥/נִי מִ/כָּל רֹ֝דְפַ֗/י וְ/הַצִּילֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/001.yaml
  text: O Yahweh my God[a], in you I have taken refuge; save me from all who pursue me, and deliver me.
translation:
  language: de
  text: Jahwe, mein Gott, bei dir habe ich Zuflucht gesucht[a]. Rette mich vor allen, die mich verfolgen, und befreie mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei dir suche ich Zuflucht“. Das hebräische Perfekt kann im Gebetskontext auch mit einem deutschen Präsens wiedergegeben werden.'
    reason: Bewahrt die aspektuelle und zeitliche Mehrdeutigkeit von חָסִיתִי.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen ausdrücklich stehenden Gottesnamen in der im Deutschen etablierten Form wieder.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Die Form mit Suffix der 1. Person Singular bedeutet im direkten Anruf natürlich „mein Gott“.
- source_word: בְּךָ
  choice: bei dir
  rationale: ב mit Personalsuffix bezeichnet hier die Person, bei der Schutz gesucht wird; „bei dir“ ist im Deutschen idiomatisch und fügt kein nicht ausdrücklich vorhandenes „allein“ hinzu.
- source_word: חָסִיתִי
  choice: habe ich Zuflucht gesucht
  rationale: Das Qal-Perfekt von חסה bezeichnet das Suchen von Schutz. Das deutsche Perfekt bewahrt den vollendeten Aspekt mit gegenwärtiger Bedeutung; der Gebetskontext erlaubt jedoch auch eine präsentische Wiedergabe.
- source_word: הוֹשִׁיעֵנִי
  choice: Rette mich
  rationale: Der Hifil-Imperativ von ישׁע fordert hier Rettung; „rette“ ist in einem Gebet klar und natürlich.
- source_word: מִכָּל רֹדְפַי
  choice: vor allen, die mich verfolgen
  rationale: Das Partizip mit Suffix beschreibt fortdauernd Verfolgende. Der Relativsatz erhält die verbale Dynamik und vermeidet die möglicherweise stärker religiös konnotierte Bezeichnung „Verfolger“.
- source_word: וְהַצִּילֵנִי
  choice: und befreie mich
  rationale: Der Hifil-Imperativ von נצל bezeichnet Herausreißen oder Befreien. „Befreie“ unterscheidet ihn leicht vom vorhergehenden „rette“, ohne den Sinn zu überspezifizieren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Eigennamen in einer im modernen Deutschen geläufigen Form, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitbezug von חָסִיתִי
  choice: bei dir habe ich Zuflucht gesucht
  alternative: bei dir suche ich Zuflucht
  rationale: Das hebräische Perfekt wird formal als vollzogene, gegenwärtig relevante Zufluchtnahme wiedergegeben. Weil Perfektformen in Gebeten auch einen gegenwärtigen Vertrauensakt ausdrücken können, bleibt die präsentische Lesart in der Fußnote erhalten.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Die parallelen Imperative werden mit „rette“ und „befreie“ unterschieden; die hebräische Kürze und direkte Anrede bleiben erhalten.
