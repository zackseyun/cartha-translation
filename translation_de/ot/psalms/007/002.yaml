  text: פֶּן יִטְרֹ֣ף כְּ/אַרְיֵ֣ה נַפְשִׁ֑/י פֹּ֝רֵ֗ק וְ/אֵ֣ין מַצִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/002.yaml
  text: lest he tear my soul like a lion[a], rending it apart with no one to rescue.
translation:
  language: de
  text: Sonst zerreißt er wie ein Löwe mein Leben[a], zerfetzt es, und niemand rettet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „meine Seele“. נַפְשִׁי meint hier das bedrohte Leben oder die ganze Person des Beters.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: sonst
  rationale: Leitet die befürchtete Folge ein. Im Deutschen gibt „sonst“ die warnende Kraft in diesem Vers natürlich und knapp wieder.
- source_word: יִטְרֹף
  choice: zerreißt
  rationale: Das Verb טרף bezeichnet das Zerreißen von Beute durch ein Raubtier; „zerreißt“ bewahrt das gewaltsame Löwenbild.
- source_word: כְּאַרְיֵה
  choice: wie ein Löwe
  rationale: Die Präposition כ markiert einen Vergleich, der im Deutschen idiomatisch mit „wie“ wiedergegeben wird.
- source_word: נַפְשִׁי
  choice: mein Leben
  rationale: נֶפֶשׁ bezeichnet hier angesichts tödlicher Bedrohung das Leben beziehungsweise die ganze Person. „Mein Leben“ vermeidet die moderne Verengung von „Seele“ auf einen immateriellen Teil des Menschen.
- source_word: פֹּרֵק
  choice: zerfetzt es
  rationale: Das Partizip führt das Bild des zerreißenden Raubtiers verstärkend fort. Das im Hebräischen unausgesprochene Objekt wird im Deutschen mit „es“ auf „mein Leben“ bezogen.
- source_word: וְאֵין מַצִּיל
  choice: und niemand rettet
  rationale: Die existentielle Verneinung und das rettende Handeln werden knapp und unmittelbar wiedergegeben; der fehlende Retter bleibt wie im Hebräischen unbestimmt.
theological_decisions:
- issue: Bedeutungsumfang von נֶפֶשׁ
  choice: mein Leben
  alternative: meine Seele / mich
  rationale: Im Zusammenhang der Raubtiermetaphorik steht die bedrohte lebendige Person im Vordergrund. Die Übersetzung legt keine dualistische Anthropologie in den Ausdruck hinein, während die Fußnote die formnähere Alternative sichtbar hält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kräftiger poetischer Bildsprache. Die kurzen Verben „zerreißt“ und „zerfetzt“ bilden die hebräische Steigerung ab, ohne altertümliche Ausdrucksweise.
