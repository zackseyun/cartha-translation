id: PSA.7.11
reference: Psalms 7:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֱ֭לֹהִים שׁוֹפֵ֣ט צַדִּ֑יק וְ֝/אֵ֗ל זֹעֵ֥ם בְּ/כָל יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/011.yaml
  text: God is a righteous judge[b][a], and a God who is indignant every day.
translation:
  language: de
  text: Gott ist ein gerechter Richter, und Gott zürnt jeden Tag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gott ist ein gerechter Richter und ein Gott, der jeden Tag zürnt.“'
    reason: Die zweite Gottesbezeichnung kann appositionell an die erste Aussage angeschlossen werden; die Hauptfassung gibt die parallele hebräische Satzstruktur unmittelbarer wieder.
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die formal plurale Bezeichnung meint hier im Zusammenhang des Psalms den einen Gott und wird singularisch wiedergegeben.
- source_word: שׁוֹפֵט
  choice: ist ein Richter
  rationale: Das Partizip kann verbal („richtet“) oder substantivisch-prädikativ verstanden werden. „Ist ein Richter“ kennzeichnet Gottes Wesen und entspricht dem Parallelismus des Verses.
- source_word: צַדִּיק
  choice: gerecht
  rationale: „Gerecht“ gibt die Übereinstimmung mit dem Rechten wieder und bewahrt die moralisch-theologische Aussage.
- source_word: וְאֵל
  choice: und ein Gott
  rationale: Die Wiedergabe bewahrt sowohl die Konjunktion als auch die parallele erneute Gottesbezeichnung, ohne eine nicht zwingende Bedeutungsnuance wie „mächtig“ einzutragen.
- source_word: זֹעֵם
  choice: der zürnt
  rationale: Das Partizip bezeichnet anhaltenden beziehungsweise regelmäßig bekundeten göttlichen Zorn. „Zürnt“ ist würdevoll, prägnant und bringt moralisch begründeten Zorn zum Ausdruck.
- source_word: בְּכָל יוֹם
  choice: jeden Tag
  rationale: Die Wendung bezeichnet am natürlichsten die tägliche Wiederkehr, nicht notwendig eine ununterbrochene Dauer während eines einzelnen Tages.
theological_decisions:
- issue: Aussage über Gottes Zorn
  choice: der jeden Tag zürnt
  alternative: der jeden Tag entrüstet ist
  rationale: Der hebräische Text schreibt Gott ausdrücklich fortdauernden beziehungsweise täglich auftretenden Zorn zu. Diese Spannung wird nicht abgeschwächt; „zürnt“ bleibt zugleich natürlich und würdevoll.
- issue: Syntaktische Zuordnung von צַדִּיק
  choice: '„gerecht“ beschreibt „Richter“: „ein gerechter Richter“'
  alternative: „Gott richtet den Gerechten“
  rationale: Die masoretische Akzentuierung und die naheliegende prädikative Lesart stützen die Charakterisierung Gottes als gerechten Richter. Eine objektbezogene Lesart ist grammatisch diskutierbar, im vorliegenden Text jedoch weniger wahrscheinlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zürnen“ liegt leicht über der Alltagssprache, ist jedoch allgemein verständlich und für die poetisch-theologische Sprache des Psalms angemessen. Die koordinierte Apposition bewahrt das hebräische „und“ und vermeidet zugleich eine schwerfällige Wiederholung.
