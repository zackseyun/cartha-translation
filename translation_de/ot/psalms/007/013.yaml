source:
  edition: WLC
  text: וְ֭/ל/וֹ הֵכִ֣ין כְּלֵי מָ֑וֶת חִ֝צָּ֗י/ו לְֽ/דֹלְקִ֥ים יִפְעָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/013.yaml
  text: And for him he has prepared weapons of death[a]; he makes his arrows fiery.
translation:
  language: de
  text: Und für ihn hat er tödliche Waffen bereitgemacht; seine Pfeile macht er zu Brandpfeilen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Pfeile richtet er gegen die Verfolger“ beziehungsweise „bestimmt er für die Verfolger“. Das hebräische Wort kann von einem Verb mit der Bedeutung „verfolgen“ statt „brennen“ her verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹו
  choice: Und für ihn
  rationale: Die Präposition ל mit dem Suffix der 3. Person Singular bezeichnet hier am natürlichsten denjenigen, für den die Waffen bestimmt sind. Das Pronomen bleibt wie im Hebräischen stehen, ohne den Bezug ausdrücklich aufzulösen.
- source_word: הֵכִין
  choice: hat er … bereitgemacht
  rationale: Der Hifil von כון bedeutet hier „vorbereiten, bereitmachen“. Das Perfekt gibt die vollendete Vorbereitung mit gegenwärtiger Relevanz wieder.
- source_word: כְּלֵי מָוֶת
  choice: tödliche Waffen
  rationale: כְּלִי kann Gerät, Werkzeug oder Waffe bedeuten. Wegen der unmittelbar folgenden Pfeile ist „Waffen“ sachgerecht; „tödliche“ gibt den hebräischen Genitiv מָוֶת natürlich wieder.
- source_word: חִצָּיו
  choice: seine Pfeile
  rationale: Direkte Wiedergabe des Plurals mit Suffix der 3. Person Singular.
- source_word: לְדֹלְקִים
  choice: zu Brandpfeilen
  rationale: דלק kann mit Brennen oder Verfolgen verbunden werden. Im Zusammenhang mit Pfeilen ergibt die Deutung als brennende Geschosse ein geschlossenes Kriegsbild. Die Konstruktion mit ל wird durch „zu“ wiedergegeben; die andere lexikalische Deutung bleibt in der Fußnote erhalten.
- source_word: יִפְעָל
  choice: macht er
  rationale: פעל bedeutet im Qal häufig „tun, machen, herstellen“. Zusammen mit לְדֹלְקִים lässt sich die Wendung natürlich als „zu Brandpfeilen machen“ wiedergeben.
