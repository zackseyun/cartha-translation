lexical_decisions:
- source_word: אִם
  choice: wenn
  rationale: Leitet als Protasis den bedingten Selbstverwünschungseid ein.
- source_word: גָּמַלְתִּי
  choice: vergolten habe
  rationale: Gibt den reziproken Sinn von גמל und die deutsche Verbindung »Böses vergelten« natürlich wieder.
- source_word: שׁוֹלְמִי
  choice: dem, der mit mir in Frieden lebte
  rationale: Bewahrt den Beziehungssinn von שלם genauer als das engere »Verbündeter«.
- source_word: רָע
  choice: Böses
  rationale: Erhält die moralische Qualität des hebräischen Ausdrucks.
- source_word: וָאֲחַלְּצָה
  choice: oder … ausgeplündert habe
  rationale: Folgt der im Kontext möglichen feindseligen Bedeutung und wahrt den Parallelismus zweier bestrittener Vergehen; die häufigere Bedeutung »retten/befreien« bleibt in der Fußnote sichtbar.
- source_word: צוֹרְרִי
  choice: meinen Feind
  rationale: Klare, gegenwärtige Wiedergabe der Bezeichnung für einen feindlich Handelnden.
- source_word: רֵיקָם
  choice: grundlos
  rationale: Gibt hier den adverbialen Sinn »ohne Anlass/ohne Grund« knapp und idiomatisch wieder.
theological_decisions:
- issue: Deutung von וָאֲחַלְּצָה צוֹרְרִי רֵיקָם
  choice: 'negativer Parallelismus: »oder meinen Feind grundlos ausgeplündert habe«'
  alternative: 'konzessiv-positive Aussage: »obwohl ich den gerettet habe, der grundlos mein Feind war«'
  rationale: Die negative Deutung ergibt zwei parallele, im Eid bestrittene Vergehen. Weil חלץ jedoch gewöhnlich »retten/befreien« bedeutet und ריקם unterschiedlich zugeordnet werden kann, wird die alternative Lesart ausdrücklich dokumentiert.
