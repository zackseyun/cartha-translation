  text: אוֹדֶ֣ה יְהוָ֣ה כְּ/צִדְק֑/וֹ וַ֝/אֲזַמְּרָ֗ה שֵֽׁם יְהוָ֥ה עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/017.yaml
  text: I will give thanks to Yahweh according to his righteousness[a], and I will sing praise to the name of Yahweh Most High.
translation:
  language: de
  text: Ich will Jahwe gemäß seiner Gerechtigkeit[a] danken und den Namen Jahwes, des Höchsten, besingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen seiner Gerechtigkeit“; „gemäß seinem gerechten Handeln“. Das hebräische Wort kann sowohl Gottes Gerechtigkeit als Eigenschaft als auch sein gerechtes, Recht schaffendes Handeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: Ich will … danken
  rationale: Die Hifil-Form von ידה bezeichnet im Kontext eines Psalms das Danken oder lobende Preisen. Die volitive Wiedergabe „Ich will“ entspricht hier dem poetischen Entschluss des Sprechers.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כְּצִדְקוֹ
  choice: gemäß seiner Gerechtigkeit
  rationale: „Gemäß“ bildet die Präposition כְ formal ab, während „Gerechtigkeit“ die semantische Breite von צדק zwischen rechter Beschaffenheit und gerechtem Handeln bewahrt.
- source_word: וַאֲזַמְּרָה
  choice: und … besingen
  rationale: זמר bezeichnet hier das preisende Singen. „Besingen“ ist im Deutschen natürlich und bewahrt sowohl den musikalischen als auch den lobenden Sinn.
- source_word: שֵׁם
  choice: den Namen
  rationale: Die direkte Wiedergabe „Name“ bewahrt den biblischen Bezug auf Gottes offenbarte Identität und Ansehen.
- source_word: עֶלְיוֹן
  choice: des Höchsten
  rationale: עליון ist ein göttlicher Hoheitstitel. Die Apposition „des Höchsten“ bezieht ihn natürlich auf Jahwe, ohne das im Hebräischen nicht vorhandene Wort „Gott“ hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von צדק bei Gott
  choice: Gerechtigkeit
  alternative: Recht; gerechtes Handeln
  rationale: „Gerechtigkeit“ wahrt den umfassenden Bezug auf Gottes rechtes Wesen und Handeln. Die mögliche Nuance richterlicher Gerechtigkeit wird in der Fußnote offengehalten.
- issue: Funktion der Präposition כְ in כְּצִדְקוֹ
  choice: gemäß
  alternative: wegen; für
  rationale: „Gemäß“ erhält den naheliegenden Gedanken der Entsprechung, ohne eine ausschließlich kausale Deutung festzulegen. Eine kausale Auffassung bleibt als Alternative möglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gemäß seiner Gerechtigkeit“ ist bewusst etwas formal, um die hebräische Präposition und ihre mögliche Entsprechungsrelation zu bewahren; die Fußnote nennt die idiomatischere kausale Alternative. „Besingen“ vermeidet das altertümliche „lobsingen“, hält den Lobpreischarakter aber fest.
