  terminology: „Frevler“, „Gerechter“ und „gerechter Gott“ treffen Register und Terminologie des Psalms. „Festen Bestand geben“ ist eine natürliche Wiedergabe von תְכוֹנֵן und vermeidet eine unangemessen technische oder konfessionell festgelegte Deutung.
