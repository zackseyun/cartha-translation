id: PSA.7.9
reference: Psalms 7:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִגְמָר נָ֬א רַ֨ע רְשָׁעִים֮ וּ/תְכוֹנֵ֪ן צַ֫דִּ֥יק וּ/בֹחֵ֣ן לִ֭בּ֗וֹת וּ/כְלָי֗וֹת אֱלֹהִ֥ים צַדִּֽיק־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/009.yaml
  text: Please let the evil of the wicked come to an end, but establish the righteous—O righteous God who examines hearts and kidneys.
translation:
  language: de
  text: 'Lass doch die Bosheit der Frevler ein Ende nehmen,

    und gib dem Gerechten festen Bestand!

    Du prüfst Herzen und Nieren,

    du gerechter Gott.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִגְמָר נָא
  choice: Lass doch … ein Ende nehmen
  rationale: Gibt den jussivischen Wunsch mit der Partikel נָא als eindringliche Bitte wieder, ohne ihn als bloße Zukunftsaussage zu glätten.
- source_word: רַע רְשָׁעִים
  choice: die Bosheit der Frevler
  rationale: Bewahrt die mögliche Bedeutung des moralisch Bösen, das von den Frevlern ausgeht; »Frevler« ist würdig und im Psalmenregister verständlich.
- source_word: וּתְכוֹנֵן צַדִּיק
  choice: und gib dem Gerechten festen Bestand
  rationale: תְכוֹנֵן bezeichnet Festigen, Gründen oder Bestandgeben. Die Formulierung klingt im Deutschen natürlicher als »stelle den Gerechten fest hin« und erhält den Gegensatz zum Ende der Bosheit.
- source_word: לִבּוֹת וּכְלָיוֹת
  choice: Herzen und Nieren
  rationale: Bewahrt die konkrete hebräische Körpermetaphorik für inneres Denken, Wollen und tiefste Regungen, statt sie vollständig zu abstrahieren.
- source_word: אֱלֹהִים צַדִּיק
  choice: du gerechter Gott
  rationale: Versteht die Wortgruppe als Anrede bzw. appositionale Charakterisierung Gottes; die deutsche Wortstellung macht diese naheliegende syntaktische Beziehung klar.
theological_decisions:
- issue: 'Singular צַדִּיק: individueller Gerechter oder Kollektivbezeichnung'
  choice: dem Gerechten
  alternative: die Gerechten
  rationale: Der masoretische Text hat den Singular. Er wird bewahrt, ohne festzulegen, ob er einen Einzelnen oder typologisch die gerechte Person bezeichnet.
- issue: Bedeutung von »Herzen und Nieren«
  choice: Die körperbildliche Doppelformel bleibt im Haupttext stehen.
  alternative: Herzen und Gedanken / Herz und Innerstes
  rationale: Die wörtliche Metapher trägt anthropologische und theologische Spannung und entspricht dem vorliegenden Ausgangstext; eine rein funktionale Deutung würde sie vorzeitig auflösen.
translation_notes:
  register: Modernes, würdevolles Psalmendeutsch mit paralleler Zeilenführung. »Frevler« wahrt den poetisch-biblischen Ton, während Satzbau und Verben für heutige Leser zugänglich bleiben. Die ungewöhnliche, aber quellnahe Wendung »Herzen und Nieren« wird bewusst nicht geglättet.
