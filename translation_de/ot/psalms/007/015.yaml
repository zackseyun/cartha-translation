  text: He dug a pit and hollowed it out[a], and he fell into the hole he made.
translation:
  language: de
  text: Eine Grube hat er gegraben und sie ausgehoben; er fiel in die Grube, die er gemacht hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בּוֹר
  choice: Grube
  rationale: בּוֹר bezeichnet häufig eine Grube oder Zisterne. Im Bild einer Falle und parallel zu שַׁחַת passt das allgemeinere »Grube« besser als »Zisterne«.
- source_word: כָּרָה
  choice: hat er gegraben
  rationale: Das Verb bedeutet konkret »graben«; die Formulierung ist im Deutschen natürlich und bewahrt das anschauliche Bild.
- source_word: וַיַּחְפְּרֵהוּ
  choice: und sie ausgehöhlt
  rationale: חפר überschneidet sich semantisch mit כרה. »ausgehöhlt« gibt die fortgesetzte beziehungsweise vertiefende Grabearbeit wieder, ohne das Verb unbeholfen zu wiederholen.
- source_word: וַיִּפֹּל
  choice: doch dann fiel er
  rationale: נפל bedeutet schlicht »fallen«. »doch dann« macht die im Hebräischen knappe Abfolge und die ironische Wendung natürlich verständlich, ohne die Aussage inhaltlich aufzulösen.
- source_word: שַׁחַת
  choice: Loch
  rationale: Hier bezeichnet שַׁחַת angesichts des Grabungsmotivs konkret die Vertiefung, in die der Täter fällt. »Loch« unterscheidet den Ausdruck von בּוֹר und vermeidet eine schwerfällige Wiederholung.
- source_word: יִפְעָל
  choice: das er gemacht hatte
  rationale: פעל ist ein allgemeines Verb des Tuns oder Herstellens. Im Zusammenhang bezeichnet es das durch das Graben hervorgebrachte Loch; »gemacht hatte« ist klar und idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Die Voranstellung von »Eine Grube« erhält den Nachdruck des hebräischen Versanfangs; »doch dann« bringt die selbstverschuldete Umkehr des Geschehens idiomatisch zum Ausdruck.
