base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/005.yaml
  text: let the enemy pursue my life and overtake it[a]; let him trample my life to the ground and make my glory dwell in the dust[b]. Selah
translation:
  language: de
  text: Dann soll ein Feind mich verfolgen und einholen[a], soll er mein Leben zu Boden treten und meine Ehre im Staub wohnen lassen[b]. Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort נַפְשִׁי kann je nach Zusammenhang die Person selbst, ihr Leben oder ihre Seele bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meine Würde“; wörtlicher: „meine Herrlichkeit“ (כְבוֹדִי).'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרַדֹּף
  choice: soll … verfolgen
  rationale: Die Form hat im Zusammenhang des bedingten Selbstfluchs auffordernden beziehungsweise verwünschenden Sinn; „verfolgen“ gibt die Grundbedeutung natürlich wieder.
- source_word: אוֹיֵב
  choice: der Feind
  rationale: Der artikellose Singular kann im Hebräischen unbestimmt sein; im Deutschen bezeichnet „der Feind“ in diesem rhetorischen Zusammenhang natürlich den jeweils gemeinten Gegner, ohne eine bestimmte historische Person festzulegen.
- source_word: נַפְשִׁי
  choice: mich
  rationale: נפשׁ bezeichnet hier die Person beziehungsweise ihr Leben. Das deutsche Personalpronomen gibt den konkreten persönlichen Bezug idiomatisch wieder, ohne eine Trennung von Körper und Seele einzutragen.
- source_word: וְיַשֵּׂג
  choice: und einholen
  rationale: Das Verb bezeichnet das Erreichen oder Einholen eines Verfolgten und führt das Verfolgungsbild unmittelbar fort.
- source_word: וְיִרְמֹס
  choice: soll … treten
  rationale: Das Verb beschreibt gewaltsames Niedertreten; zusammen mit „zu Boden“ bleibt das Bild kraftvoll und im Deutschen flüssig.
- source_word: לָאָרֶץ
  choice: zu Boden
  rationale: Bei einem Verb des Tretens ist „zu Boden“ die natürliche deutsche Entsprechung für die Richtung zur Erde beziehungsweise zum Erdboden.
- source_word: חַיָּי
  choice: mein Leben
  rationale: Die morphologische Pluralform wird idiomatisch für das Leben gebraucht; der Singular ist im Deutschen sachgerecht.
- source_word: וּכְבוֹדִי
  choice: meine Ehre
  rationale: כבוד bezeichnet hier wahrscheinlich Ansehen, Würde oder den geehrten Zustand der Person. „Ehre“ bewahrt den poetischen Gegensatz zur Erniedrigung im Staub besser als das im Deutschen missverständliche „meine Herrlichkeit“.
- source_word: לֶעָפָר
  choice: im Staub
  rationale: Mit dem kausativen „wohnen lassen“ ist „im Staub“ idiomatisch und erhält das Bild von Erniedrigung und Todesnähe.
- source_word: יַשְׁכֵּן
  choice: wohnen lassen
  rationale: 'Der Hifil ist kausativ: jemanden oder etwas wohnen beziehungsweise lagern lassen. Die ungewöhnliche poetische Personifikation bleibt erhalten.'
- source_word: סֶלָה
  choice: Sela
  rationale: Die traditionelle Umschrift wird beibehalten, da Bedeutung und Funktion des Ausdrucks unsicher sind.
theological_decisions:
- issue: Anthropologische Bedeutung von נַפְשִׁי
  choice: mich
  alternative: mein Leben; meine Seele
  rationale: Im Kontext körperlicher Verfolgung bezeichnet נפשׁ die ganze Person beziehungsweise ihr Leben. „Mich“ vermeidet eine nicht erforderliche dualistische Verengung; die wörtlicheren Möglichkeiten werden in der Fußnote genannt.
- issue: Bedeutung von כְבוֹדִי in poetischer Selbstbezeichnung
  choice: meine Ehre
  alternative: meine Herrlichkeit; meine Würde
  rationale: Das Wort kann das Ansehen, die Würde oder den gewichtigen, geehrten Zustand des Beters bezeichnen. „Ehre“ ist im modernen Deutschen klar, lässt aber die poetische Spannung zwischen persönlichem Ansehen und völliger Erniedrigung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Parallelismus. Der einleitende Selbstfluch wird durch „Dann soll …“ an den Bedingungszusammenhang des vorherigen Verses angebunden. Die markante Wendung „im Staub wohnen lassen“ bewahrt das hebräische Bild, ohne es erklärend aufzulösen.
