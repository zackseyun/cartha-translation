source:
  edition: WLC
  text: אַשְׁרֵ֤י הַ/גֶּ֗בֶר אֲשֶׁ֤ר מִלֵּ֥א אֶת אַשְׁפָּת֗/וֹ מֵ֫/הֶ֥ם לֹֽא יֵבֹ֑שׁוּ כִּֽי יְדַבְּר֖וּ אֶת אוֹיְבִ֣ים בַּ/שָּֽׁעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/005.yaml
  text: Blessed is the man who fills his quiver with them[c][b][a]; they will not be put to shame when they speak with enemies in the gate.
translation:
  language: de
  text: Glücklich zu preisen ist der Mann, der seinen Köcher mit ihnen gefüllt hat. Sie werden nicht beschämt werden[a], wenn sie mit Feinden im Tor reden[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie werden sich nicht schämen.“ Manche beziehen die Aussage allein auf den Vater und übersetzen: „Er wird nicht beschämt werden.“ Die hebräischen Verben stehen jedoch im Plural.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „wenn sie mit Feinden streiten“ beziehungsweise „wenn sie ihren Rechtsfall gegen Feinde vertreten“. Das Verb kann in diesem Zusammenhang einen rechtlichen oder gegnerischen Wortwechsel bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Das Stadttor war in einer antiken Stadt ein Ort öffentlicher Rechtsprechung und städtischer Geschäfte.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich zu preisen ist
  rationale: Die idiomatische Pluralform leitet einen weisheitlichen Glückwunsch ein. Die Wendung bewahrt den gehobenen Ton, ohne lediglich ein inneres Glücksgefühl auszudrücken.
- source_word: הַגֶּבֶר
  choice: der Mann
  rationale: Das Substantiv ist grammatisch maskulin und bezeichnet hier im Zusammenhang den Vater; eine geschlechtsneutrale Wiedergabe würde diese konkrete Referenz verwischen.
- source_word: מִלֵּא אֶת־אַשְׁפָּתוֹ מֵהֶם
  choice: der seinen Köcher mit ihnen gefüllt hat
  rationale: Das Perfekt beschreibt den Mann als jemanden, der seinen Köcher gefüllt hat. „Mit ihnen“ bezieht sich auf die zuvor mit Pfeilen verglichenen Söhne; „Köcher“ gibt das Bild präzise und geläufig wieder.
- source_word: לֹא יֵבֹשׁוּ
  choice: Sie werden nicht beschämt werden
  rationale: Die Wiedergabe erhält die pluralische Verbform des hebräischen Textes und bringt zugleich die öffentliche Ehr- und Schanddimension zum Ausdruck.
- source_word: כִּי
  choice: wenn
  rationale: Die Konjunktion bezeichnet hier plausibel die Situation, in der die angekündigte Bewahrung vor Beschämung gilt.
- source_word: יְדַבְּרוּ אֶת־אוֹיְבִים
  choice: sie mit Feinden ... reden
  rationale: „Reden“ bewahrt die lexikalische Breite des Verbs; der öffentliche Kontext kann zusätzlich ein Streiten oder Verhandeln vor Gericht nahelegen, was in der Fußnote offengehalten wird.
- source_word: בַּשָּׁעַר
  choice: im Tor
  rationale: Die knappe Ortsangabe folgt dem Hebräischen und erhält das antike Bild; ihre rechtliche und öffentliche Funktion wird in einer Fußnote erklärt.
theological_decisions:
- issue: Geschlechtsspezifische repräsentative Sprache
  choice: der Mann
  alternative: der Mensch; wer
  rationale: Der hebräische Ausdruck ist maskulin und meint im Kontext den Vater. Die konkrete Geschlechtsreferenz wird daher nicht neutralisiert.
- issue: Pluralisches Subjekt von לֹא יֵבֹשׁוּ und יְדַבְּרוּ
  choice: Sie werden nicht beschämt werden ... wenn sie ... reden
  alternative: Er wird nicht beschämt werden ... wenn er ... redet
  rationale: Der masoretische Text hat ausdrücklich Verben im Plural. Die Übersetzung bewahrt diese Form und lässt offen, ob der Vater mit seinen Söhnen oder die Familie als Gemeinschaft gemeint ist, statt auf den Vater allein zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit einem leicht gehobenen weisheitlichen Ton. Die Satzstruktur bleibt gut verständlich; das traditionelle Bild vom Köcher und die knappe Ortsangabe „im Tor“ werden bewahrt und durch Fußnoten erschlossen.
