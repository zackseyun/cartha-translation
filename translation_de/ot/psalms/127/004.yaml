  text: כְּ/חִצִּ֥ים בְּ/יַד גִּבּ֑וֹר כֵּ֝֗ן בְּנֵ֣י הַ/נְּעוּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/004.yaml
  text: Like arrows in the hand of a warrior[a], so are the sons of one's youth.
translation:
  language: de
  text: Wie Pfeile in der Hand eines Kriegers, so sind die Söhne, die einem in jungen Jahren geboren werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne der Jugend“. Gemeint sind Söhne, die einem in jungen Jahren geboren werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/חִצִּים
  choice: Wie Pfeile
  rationale: חִצִּים ist der Plural von חֵץ und bezeichnet gewöhnlich Pfeile; כְּ leitet den Vergleich ein.
- source_word: בְּ/יַד
  choice: in der Hand
  rationale: Die Wendung bezeichnet hier bildhaft Verfügungsgewalt und Einsatzbereitschaft; der Singular des Hebräischen bleibt erhalten.
- source_word: גִּבּוֹר
  choice: eines Kriegers
  rationale: גִּבּוֹר kann einen starken oder kampferprobten Mann bezeichnen; im Bild von Pfeilen passt „Krieger“ am besten.
- source_word: כֵּן
  choice: so sind
  rationale: כֵּן führt den zweiten Teil des Vergleichs ein und wird im Deutschen natürlich mit „so“ wiedergegeben.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Das hebräische Wort ist ausdrücklich maskulin und bezeichnet hier Söhne; diese Geschlechtsangabe wird nicht verallgemeinert.
- source_word: הַ/נְּעוּרִים
  choice: die man in jungen Jahren bekommt
  rationale: Wörtlich steht „der Jugend“. Gemeint sind idiomatisch Söhne, die einem während der eigenen Jugend beziehungsweise in jungen Jahren geboren werden.
theological_decisions:
- issue: Geschlechtsspezifische Aussage in בְּנֵי הַנְּעוּרִים
  choice: die Söhne, die man in jungen Jahren bekommt
  alternative: die Kinder, die man in jungen Jahren bekommt
  rationale: Der hebräische Ausdruck ist grammatisch maskulin und nennt Söhne. Die Übersetzung bewahrt dies, ohne die Aussage geschlechtsneutral zu erweitern.
- issue: Deutung des Genitivs הַנְּעוּרִים
  choice: die man in jungen Jahren bekommt
  alternative: Söhne der Jugend
  rationale: Der knappe hebräische Genitiv lässt sich im Deutschen so idiomatisch ausdrücken. Die Übersetzung macht die wahrscheinliche zeitliche Beziehung verständlich, während die wörtlichere Form in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Vergleichsstruktur „Wie …, so …“ und das konkrete Kriegsbild des Hebräischen bleiben erhalten.
