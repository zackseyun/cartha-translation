  text: הִנֵּ֤ה נַחֲלַ֣ת יְהוָ֣ה בָּנִ֑ים שָׂ֝כָ֗ר פְּרִ֣י הַ/בָּֽטֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/003.yaml
  text: Behold[a], children are a heritage from Yahweh, the fruit of the womb a reward.
translation:
  language: de
  text: 'Sieh: Kinder sind ein Erbe von Jahwe[a], die Frucht des Mutterleibs ist ein Lohn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kinder sind Jahwes Erbe.“'
    reason: Die hebräische Constructusverbindung kann entweder Herkunft („von Jahwe“) oder Zugehörigkeit („Jahwes“) ausdrücken.
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Bewahrt den aufmerksamkeitslenkenden, ausrufenden Charakter der hebräischen Partikel in natürlichem poetischem Deutsch.
- source_word: נַחֲלַת יְהוָה
  choice: ein Erbe von Jahwe
  rationale: Die Wendung kann Besitz oder Herkunft bezeichnen. Der Parallelismus mit „ein Lohn“ legt hier nahe, Kinder als von Jahwe gegebene Gabe zu verstehen; „Erbe“ erhält zugleich das Bild des Ausgangstextes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בָּנִים
  choice: Kinder
  rationale: Der maskuline Plural bezeichnet hier allgemein Nachkommen und nicht ausschließlich Söhne.
- source_word: שָׂכָר
  choice: ein Lohn
  rationale: Entspricht der Grundbedeutung von Vergütung oder Belohnung und bleibt in der poetischen Parallele knapp; ein geschäftlicher Sinn ist hier nicht beabsichtigt.
- source_word: פְּרִי הַבָּטֶן
  choice: die Frucht des Mutterleibs
  rationale: Erhält das verständliche hebräische Bild für Nachkommenschaft und seine poetischen Bezüge.
theological_decisions:
- issue: Sinn der Constructusverbindung נַחֲלַת יְהוָה
  choice: Kinder sind ein Erbe von Jahwe
  alternative: Kinder sind Jahwes Erbe
  rationale: Die hebräische Verbindung lässt sowohl Herkunft als auch Besitz zu. Der Parallelismus mit „ein Lohn“ stützt die Herkunftsdeutung, doch die Besitzdeutung bleibt als echte Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Bildsprache. „Sieh doch“ ist gegenwärtiger als „Siehe“, ohne die hervorhebende Kraft einzuebnen.
