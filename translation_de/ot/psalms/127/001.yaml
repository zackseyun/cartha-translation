  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לִ/שְׁלֹ֫מֹ֥ה אִם יְהוָ֤ה לֹא יִבְנֶ֬ה בַ֗יִת שָׁ֤וְא עָמְל֣וּ בוֹנָ֣י/ו בּ֑/וֹ אִם יְהוָ֥ה לֹֽא יִשְׁמָר עִ֝֗יר שָׁ֤וְא שָׁקַ֬ד שׁוֹמֵֽר־׀־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/001.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor in vain; unless Yahweh guards the city[c][b], the watchman stays awake in vain.
translation:
  language: de
  text: 'Ein Lied der Aufstiege. Von Salomo[a].


    Wenn Jahwe das Haus[b] nicht baut,

    arbeiten seine Erbauer vergeblich daran.[c]


    Wenn Jahwe die Stadt nicht bewacht,

    hält der Wächter vergeblich Wache.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Von Salomo“ kann auch „für Salomo“ oder „Salomo zugehörig“ bedeuten; die hebräische Präposition kann in Psalmüberschriften Autorschaft, Widmung oder Zuordnung bezeichnen. „Lied der Aufstiege“ kann auch als „Wallfahrtslied“ oder „Lied zum Hinaufsteigen“ wiedergegeben werden; die genaue Bedeutung der traditionellen hebräischen Sammlungsüberschrift ist nicht sicher.
    reason: alternative_reading
  - marker: b
    text: „Haus“ kann im Hebräischen auch eine Hausgemeinschaft, Familie oder Dynastie bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „seine Erbauer arbeiten vergeblich in ihm/an ihm“. Das hebräische Pronomen bezieht sich auf das Haus.'
    reason: source_clarity
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Lied der Aufstiege
  rationale: Die wörtungsnahe Wiedergabe bewahrt die traditionelle Überschrift dieser Psalmengruppe und die Grundbedeutung von מַעֲלוֹת, ohne eine bestimmte Deutung als Pilgerreise oder Tempelaufstieg festzulegen.
- source_word: לִשְׁלֹמֹה
  choice: Von Salomo
  rationale: Die knappe, in Psalmüberschriften geläufige Formulierung ist natürliches Deutsch; eine Fußnote hält offen, ob ל Autorschaft, Widmung oder Zuordnung bezeichnet.
- source_word: אִם ... לֹא
  choice: Wenn ... nicht
  rationale: Diese deutsche Bedingungskonstruktion gibt beide parallelen hebräischen Konditionalsätze klar und idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: יִבְנֶה בַיִת
  choice: das Haus baut
  rationale: Das konkrete Bild eines Hauses passt zur parallelen Stadt. Der mögliche weitere Sinn von Haus als Hausgemeinschaft oder Dynastie wird in einer Fußnote bewahrt.
- source_word: שָׁוְא
  choice: vergeblich
  rationale: Die Wiederholung in beiden Vershälften wahrt den Parallelismus und bezeichnet die Nutzlosigkeit menschlicher Anstrengung ohne Jahwes Wirken.
- source_word: עָמְלוּ בֹנָיו בּוֹ
  choice: mühen sich seine Erbauer vergeblich daran ab
  rationale: Die Formulierung gibt sowohl die angestrengte Arbeit als auch die Rückbezüge der Suffixe auf das Haus wieder und bleibt im Deutschen verständlich.
- source_word: יִשְׁמָר עִיר
  choice: die Stadt bewacht
  rationale: Bewachen bezeichnet hier den schützenden Aspekt von שׁמר und passt zum Wächter in der folgenden Zeile.
- source_word: שָׁקַד שׁוֹמֵר
  choice: hält der Wächter ... Wache
  rationale: Die idiomatische deutsche Wendung umfasst die im Verb שׁקד liegende Wachsamkeit beziehungsweise das Wachbleiben und bewahrt das konkrete Bild des Stadtwächters.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen; die traditionelle Ersetzung durch einen Titel würde diese Unterscheidung verdecken.
- issue: Bedeutungsumfang von בַיִת
  choice: Haus
  alternative: Hausgemeinschaft oder Dynastie
  rationale: Der Parallelismus mit Stadt, Bauen und Wächter stützt zunächst das konkrete Bild. Die im Hebräischen mögliche übertragene Bedeutung wird nicht in den Haupttext eingetragen, aber in der Fußnote offengehalten.
- issue: Verhältnis von göttlichem und menschlichem Handeln
  choice: Die Bedingungssätze werden ohne erklärenden Zusatz wiedergegeben
  alternative: Menschliche Arbeit sei grundsätzlich wertlos oder Jahwe ersetze menschliches Handeln
  rationale: Der Vers stellt menschliches Bauen und Wachen nicht als unnötig dar, sondern als vergeblich, wenn Jahwes Wirken und Schutz fehlen. Die Übersetzung bewahrt diese Spannung, ohne sie systematisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem poetischem Parallelismus. „Erbauer“ ist leicht gehoben, aber allgemein verständlich; „hält Wache“ ist natürlicher als eine mechanische Wiedergabe mit „bleibt wach“. Die Zeilenstruktur folgt den beiden hebräischen Satzhälften.
