  text: שָׁ֤וְא לָ/כֶ֨ם מַשְׁכִּ֪ימֵי ק֡וּם מְאַֽחֲרֵי שֶׁ֗בֶת אֹ֭כְלֵי לֶ֣חֶם הָ/עֲצָבִ֑ים כֵּ֤ן יִתֵּ֖ן לִֽ/ידִיד֣/וֹ שֵׁנָֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/002.yaml
  text: It is in vain for you to rise early[a], to sit up late, eating the bread of toil; for he gives sleep to his beloved.
translation:
  language: de
  text: Vergeblich ist es für euch, früh aufzustehen und lange aufzubleiben, während ihr das Brot mühevoller Arbeit esst; denn er gibt seinem Geliebten Schlaf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn so gibt er seinem Geliebten im Schlaf [Gaben]«, oder: »Denn er gibt seinem Geliebten, während dieser schläft.« Das Hebräische ist knapp formuliert und kann entweder bedeuten, dass Gott Schlaf schenkt, oder dass er seine Gaben sogar im Schlaf gibt.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁוְא
  choice: vergeblich
  rationale: Gibt die Nutzlosigkeit des beschriebenen angestrengten Tuns prägnant und idiomatisch wieder.
- source_word: מַשְׁכִּימֵי קוּם
  choice: früh aufzustehen
  rationale: Entspricht der Wendung für frühes Aufstehen und fügt sich natürlich in die deutsche Satzfolge ein.
- source_word: מְאַחֲרֵי שֶׁבֶת
  choice: euch erst spät hinzusetzen
  rationale: Bewahrt das hebräische Bild des späten Sitzens; gemeint sein kann, die Arbeit bis spät auszudehnen.
- source_word: אֹכְלֵי לֶחֶם הָעֲצָבִים
  choice: während ihr das Brot mühevoller Arbeit esst
  rationale: Erhält das Brotmotiv und gibt עֲצָבִים als belastende, schmerzliche Mühe wieder, ohne es auf Sorge oder Kummer einzuengen.
- source_word: כֵּן
  choice: denn
  rationale: Markiert im Deutschen verständlich die begründende beziehungsweise kontrastierende Beziehung; das wörtlichere „so“ bleibt in der alternativen Deutung der Fußnote erkennbar.
- source_word: יִתֵּן
  choice: er gibt
  rationale: Das Präsens eignet sich für die allgemeine Aussage; das unausgesprochene Subjekt verweist im Psalmzusammenhang auf Gott.
- source_word: לִידִידוֹ
  choice: seinem Geliebten
  rationale: Bewahrt Singular, Zugehörigkeitsbezug und die liebevolle Nuance des hebräischen Ausdrucks.
- source_word: שֵׁנָא
  choice: Schlaf
  rationale: Die Hauptfassung versteht das Substantiv als direktes Objekt; seine mögliche adverbiale Zuordnung wird in der Fußnote erhalten.
theological_decisions:
- issue: Die gedrängte Syntax von כֵּן יִתֵּן לִידִידוֹ שֵׁנָא
  choice: denn er gibt seinem Geliebten Schlaf
  alternative: 'so gibt er seinem Geliebten im Schlaf; oder: er gibt seinem Geliebten, während dieser schläft'
  rationale: Das Hebräische lässt offen, ob „Schlaf“ die Gabe selbst bezeichnet oder den Zeitpunkt beziehungsweise Zustand, in dem Gott gibt. Die Hauptfassung ist im Deutschen besonders natürlich und entspricht dem Gegensatz zwischen rastloser Mühe und Gottes Gabe; die Alternativen bewahren die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Sprache von frühem Aufstehen, spätem Sitzen und dem Brot mühevoller Arbeit bleibt erhalten; die syntaktische Mehrdeutigkeit des Schlusses wird nicht stillschweigend aufgelöst.
