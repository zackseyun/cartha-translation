base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/000.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor over it in vain. Unless Yahweh guards the city[c][b], the watchman stays awake in vain.
translation:
  language: de
  text: 'Ein Lied der Aufstiege.[a] Von Salomo.[b]


    Wenn der HERR[c] das Haus nicht baut,

    mühen sich die Bauleute vergeblich daran ab.[d]


    Wenn der HERR die Stadt nicht bewacht,

    hält der Wächter vergeblich Wache.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ein Lied der Aufstiege“. Die Bezeichnung wird häufig mit dem Aufstieg nach Jerusalem zu den Wallfahrtsfesten verbunden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Für Salomo“ oder „Salomo zugehörig“. Die hebräische Überschrift kann Autorschaft, Widmung oder Zugehörigkeit bezeichnen.'
    reason: alternative_reading
  - marker: c
    text: Im Hebräischen steht hier der Gottesname JHWH, wahrscheinlich „Jahwe“ ausgesprochen.
    reason: divine_name
  - marker: d
    text: „Haus“ kann im Hebräischen auch eine Hausgemeinschaft, Familie oder Dynastie bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die Wendung bezeichnet die Sammlung der Aufstiegslieder (Psalmen 120–134). „Wallfahrtslied“ gibt den wahrscheinlich kultisch-pilgerlichen Zusammenhang in natürlichem Deutsch wieder, ohne die wörtliche Bildsprache im Haupttext sperrig wirken zu lassen.
- source_word: בַיִת
  choice: das Haus
  rationale: „Haus“ wahrt die konkrete Grundbedeutung und lässt zugleich die im Hebräischen mögliche weitere Bedeutung „Hausgemeinschaft/Dynastie“ offen.
- source_word: עָמְלוּ
  choice: mühen sich … ab
  rationale: Das Verb bezeichnet mühevolle Arbeit; die Formulierung ist idiomatisch und bewahrt den Nachdruck auf vergeblicher Anstrengung.
- source_word: שָׁקַד שׁוֹמֵר
  choice: hält der Wächter … Wache
  rationale: שׁקד bezeichnet hier wachsames Wachbleiben. Die deutsche Wendung gibt Funktion und fortgesetzte Aufmerksamkeit natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR mit Fußnote
  alternative: Jahwe
  rationale: Die traditionelle deutsche Bibelkonvention bleibt im Lesetext erhalten; die Fußnote macht den zugrunde liegenden Eigennamen transparent.
- issue: Bezug der Überschrift לִשְׁלֹמֹה
  choice: Von Salomo
  alternative: Für Salomo / Salomo zugehörig
  rationale: Die Präposition ל kann Autorschaft, Widmung oder Zugehörigkeit anzeigen. Die geläufige Haupttextfassung wird verwendet, während die echte Mehrdeutigkeit ausdrücklich vermerkt wird.
- issue: Möglicher weiterer Sinn von בַיִת
  choice: Haus im Haupttext
  alternative: Hausgemeinschaft oder Dynastie
  rationale: Der unmittelbare Parallelismus mit Stadt und Wächter stützt den konkreten Gebäudesinn, doch ein weiterreichender Bezug auf Familie oder Dynastie bleibt sprachlich möglich und wird nicht ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelstruktur. Die Zeilen sind knapp und gut vorlesbar; unnötige Wiederholungen werden vermieden, während die zweimalige Bedingungsform und „vergeblich“ als tragende Struktur erhalten bleiben.
