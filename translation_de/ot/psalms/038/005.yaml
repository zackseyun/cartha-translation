  text: הִבְאִ֣ישׁוּ נָ֭מַקּוּ חַבּוּרֹתָ֑/י מִ֝/פְּנֵ֗י אִוַּלְתִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/005.yaml
  text: My wounds stink and fester because of my foolishness[a].
translation:
  language: de
  text: Meine Wunden stinken und eitern wegen meiner Torheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meine Striemen sind übel riechend geworden und verfaulen wegen meiner Torheit.“'
    reason: Lexikalische Alternativen für חַבּוּרֹתָי, הִבְאִישׁוּ und נָמַקּוּ.
lexical_decisions:
- source_word: הִבְאִישׁוּ
  choice: stinken
  rationale: Das Verb bezeichnet hier einen widerwärtigen Geruch. „Stinken“ ist anschaulich, unmittelbar und im heutigen Deutsch natürlich.
- source_word: נָמַקּוּ
  choice: eitern
  rationale: Das Verb kann Verfaulen, Zerfallen oder Dahinschwinden ausdrücken. Bei Wunden gibt „eitern“ die fortschreitende Verderbnis idiomatisch wieder; die Alternative „faulen“ bleibt in der Fußnote sichtbar.
- source_word: חַבּוּרֹתָי
  choice: meine Wunden
  rationale: Das Substantiv kann Striemen, Verletzungen oder Wunden bezeichnen. Wegen des Gestanks und der fortschreitenden Zersetzung passt „Wunden“ im Kontext am besten.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Die Präposition bezeichnet hier die Ursache. „Wegen“ gibt diesen Zusammenhang knapp und natürlich wieder.
- source_word: אִוַּלְתִּי
  choice: meine Torheit
  rationale: Das Wort bezeichnet törichtes Verhalten mit moralischem Gewicht. „Torheit“ bewahrt den würdevollen poetischen Ton und vermeidet eine Verengung auf bloße Unwissenheit.
theological_decisions:
- issue: Ursächlicher Zusammenhang zwischen Leiden und eigener Torheit
  choice: wegen meiner Torheit
  alternative: aufgrund meiner törichten Art
  rationale: Der Vers führt den beschriebenen Zustand ausdrücklich auf die eigene Torheit des Beters zurück. Die Übersetzung wahrt diesen Zusammenhang, ohne daraus eine allgemeine Lehre über die Ursache allen Leidens abzuleiten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem poetischem Ton. Die körperlich drastische Bildsprache des Hebräischen bleibt erhalten.
