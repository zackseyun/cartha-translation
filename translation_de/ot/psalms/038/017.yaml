source:
  edition: WLC
  text: כִּֽי אֲ֭נִי לְ/צֶ֣לַע נָכ֑וֹן וּ/מַכְאוֹבִ֖/י נֶגְדִּ֣/י תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/017.yaml
  text: For I am ready to fall, and my pain is always before me.
translation:
  language: de
  text: Denn ich bin nahe daran zu stürzen[a], und mein Schmerz ist ständig vor mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: zu straucheln; auch: zu hinken.'
    reason: Das hebräische צֶלַע kann einen Sturz beziehungsweise ein Straucheln oder ein Hinken bezeichnen.
lexical_decisions:
- source_word: לְצֶלַע
  choice: zu stürzen
  rationale: צֶלַע bezeichnet hier ein Straucheln, Hinken oder einen drohenden Fall. „Zu stürzen“ gibt im Zusammenhang die Gefährdung natürlich wieder, ohne sie näher zu bestimmen.
- source_word: נָכוֹן
  choice: bin nahe daran
  rationale: Das Wort bedeutet wörtlich „bereit/fest hingestellt“. In Verbindung mit לְצֶלַע drückt es aus, dass der drohende Sturz unmittelbar bevorsteht.
- source_word: וּמַכְאוֹבִי נֶגְדִּי תָמִיד
  choice: und mein Schmerz ist ständig vor mir
  rationale: Die Wiedergabe folgt der hebräischen Wortfolge und bewahrt das offene Bild eines Schmerzes, der dem Beter unablässig gegenwärtig ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ständig vor mir“ bewahrt das knappe hebräische Bild, statt es durch „vor Augen“ ausdrücklich zu konkretisieren.
