  yaml_path: translation/ot/psalms/038/021.yaml
  text: Do not forsake me[a], O Yahweh my God; do not be far from me.
translation:
  language: de
  text: Verlass mich nicht, Jahwe, mein Gott; sei nicht fern von mir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּעַזְבֵנִי
  choice: Verlass mich nicht
  rationale: Die Negation אַל mit der Verbform formuliert eine eindringliche Bitte. עזב bedeutet hier „verlassen“; die Wendung ist im Deutschen natürlich und bewahrt den gewichtigen Ton der Klage.
- source_word: יְהוָה
  choice: HERR
  rationale: Der Gottesname יהוה wird nach der im Deutschen verbreiteten Bibelkonvention mit „HERR“ wiedergegeben; eine Fußnote nennt die zugrunde liegende Namensform.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Die Form אֱלֹהַי enthält das Suffix der ersten Person Singular und bedeutet unmittelbar „mein Gott“.
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: bleib mir nicht fern
  rationale: רחק bezeichnet das Fernsein oder Sich-Entfernen. „Bleib mir nicht fern“ gibt die Bitte idiomatisch wieder, ohne ausdrücklich eine Bewegung oder einen absichtlichen Rückzug hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: HERR
  alternative: Jahwe
  rationale: „HERR“ folgt einer geläufigen deutschen Bibelkonvention und bleibt für heutige Leser verständlich; die Fußnote macht transparent, dass im Hebräischen der persönliche Gottesname JHWH steht.
translation_notes:
  register: Kurze, direkte Gebetssprache in würdigem modernem Standarddeutsch. Der Parallelismus der beiden negativen Bitten bleibt erhalten; „bleib mir nicht fern“ ist natürlicher als das formalere „sei nicht fern von mir“.
