  language: en
  yaml_path: translation/ot/psalms/038/010.yaml
  text: My heart throbs[a]; my strength has left me[b], and the light of my eyes—even they are not with me.
translation:
  language: de
  text: Mein Herz schlägt heftig[a], meine Kraft hat mich verlassen, und selbst das Licht meiner Augen ist nicht bei mir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mein Herz taumelt“ beziehungsweise „ist in heftiger Unruhe“. Das hebräische Wort bezeichnet eine kreisende oder taumelnde Bewegung und kann hier das unruhige Schlagen des Herzens beschreiben.'
    reason: lexical_alternative
  - marker: b
    text: '„Das Licht meiner Augen“ kann das Sehvermögen oder den Glanz und die Lebenskraft meinen, die sich in den Augen zeigen. Hebräisch wörtlich: „auch sie sind nicht bei mir“, wobei der Plural auf die Augen zurückweist.'
    reason: ambiguity_and_grammar
lexical_decisions:
- source_word: לִבִּי
  choice: mein Herz
  rationale: לֵב bezeichnet hier im Zusammenhang körperlicher Not am natürlichsten das Herz als Zentrum von Lebenskraft und Empfindung.
- source_word: סְחַרְחַר
  choice: rast
  rationale: Das Wort beschreibt eine kreisende, heftige Unruhe. Auf das Herz bezogen gibt „rast“ die gestörte, heftige Herztätigkeit knapp und idiomatisch wieder, ohne die mögliche Grundvorstellung des Taumelns zu verschweigen.
- source_word: עֲזָבַנִי כֹחִי
  choice: meine Kraft hat mich verlassen
  rationale: Die personifizierende hebräische Wendung wird im Deutschen natürlich und zugleich formnah wiedergegeben; כֹּחַ meint hier körperliche Kraft oder Vitalität.
- source_word: וְאוֹר עֵינַי
  choice: und … das Licht meiner Augen
  rationale: Die poetische Wendung bleibt erhalten und lässt offen, ob das Sehvermögen oder der in den Augen sichtbare Glanz und die Lebenskraft gemeint sind.
- source_word: גַּם הֵם אֵין אִתִּי
  choice: selbst … ist nicht mehr bei mir
  rationale: „Selbst“ bewahrt die Hervorhebung durch גַּם. Die deutsche Form richtet sich grammatisch nach dem Singular „Licht“, während eine Fußnote den auffälligen hebräischen Plural transparent macht.
