id: PSA.38.15
reference: Psalms 38:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי לְ/ךָ֣ יְהוָ֣ה הוֹחָ֑לְתִּי אַתָּ֥ה תַ֝עֲנֶ֗ה אֲדֹנָ֥/י אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/015.yaml
  text: For I wait for you[a], O Yahweh; you will answer[c][b], O Lord my God.
translation:
  language: de
  text: Denn auf dich, Jahwe, hoffe ich[a]; du wirst antworten[b], Herr, mein Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „warte ich voller Hoffnung“. Das hebräische Verb verbindet Hoffen mit erwartungsvollem Warten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wirst du reagieren“. Im Hebräischen steht kein ausdrückliches Objekt; „mir“ ist daher nicht ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet im Zusammenhang die vorausgehende Aussage; „Denn“ bewahrt diese Funktion, ohne die Nuance unnötig festzulegen.
- source_word: לְךָ
  choice: auf dich
  rationale: Bei יחל bezeichnet לְ die Person, auf die sich das hoffende Warten richtet. „Auf dich hoffen“ ist im Deutschen natürlich und erhält Erwartung und Vertrauen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: הוֹחָלְתִּי
  choice: hoffe ich
  rationale: Das Hifil von יחל kann hoffendes Warten oder Hoffen bezeichnen. Das deutsche Präsens gibt die durch die Perfektform ausgedrückte gefestigte Haltung im poetischen Zusammenhang natürlich wieder.
- source_word: אַתָּה
  choice: du
  rationale: Das selbstständige Pronomen ist ausdrücklich gesetzt und trägt Nachdruck; die Voranstellung „du wirst“ bewahrt diesen angemessen.
- source_word: תַעֲנֶה
  choice: wirst antworten
  rationale: Das Verb bedeutet hier „antworten“ oder „reagieren“. Ein Objekt wie „mir“ wird nicht ergänzt, da es im Hebräischen nicht ausdrücklich steht.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: In der direkten Anrede ist „Herr“ die natürliche Wiedergabe des göttlichen Titels.
- source_word: אֱלֹהָי
  choice: mein Gott
  rationale: Das ausdrücklich vorhandene Suffix der ersten Person wird mit „mein“ bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration „Jahwe“ bewahrt den Unterschied zwischen diesem Namen und dem anschließend gebrauchten Titel אֲדֹנָי („Herr“).
- issue: Gewissheit oder Bitte bei תַעֲנֶה
  choice: du wirst antworten
  alternative: du mögest antworten
  rationale: Die Verbform ist formal ein Imperfekt und lässt sich im Zusammenhang als zuversichtliche Zukunftsaussage verstehen. Eine ausdrückliche Wunschform würde die Aussage stärker als Bitte deuten, als es der hebräische Wortlaut verlangt.
translation_notes:
  register: Moderne, würdige Psalmsprache mit direkter Anrede. Die Wortstellung hebt „du“ hervor; die Unterscheidung zwischen dem Eigennamen „Jahwe“ und dem Titel „Herr“ bleibt sichtbar.
