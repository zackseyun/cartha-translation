base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/018.yaml
  text: For I confess my iniquity[b][a]; I am anxious because of my sin.
translation:
  language: de
  text: Denn ich bekenne meine Schuld[a]; wegen meiner Sünde bin ich bekümmert.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ich tue meine Schuld kund“. Das hebräische Verb bedeutet wörtlich „kundtun“ oder „mitteilen“; „bekennen“ entspricht dem Bußkontext.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wegen meiner Sünde bin ich in Sorge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet beziehungsweise erläutert die vorausgehende Aussage; „Denn“ bewahrt diesen Zusammenhang in natürlichem Deutsch.
- source_word: עֲוֺנִי
  choice: meine Schuld
  rationale: עָוֹן kann sowohl das schuldhafte Vergehen als auch die daraus erwachsende Schuld bezeichnen. „Schuld“ erhält diese bewusst nicht ganz auflösbare Bedeutungsbreite besser als ein rein handlungsbezogener Ausdruck.
- source_word: אַגִּיד
  choice: ich bekenne
  rationale: Der Hifil von נגד bedeutet wörtlich „kundtun“ oder „mitteilen“. Mit der eigenen Schuld als Objekt und im Bußkontext gibt „bekennen“ den Sinn idiomatisch wieder; die wörtlichere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: אֶדְאַג
  choice: bin ich bekümmert
  rationale: דאג bezeichnet sorgende Unruhe oder innere Beklemmung. „Bekümmert“ ist in diesem Zusammenhang natürlich und würdevoll, ohne den Ausdruck auf eine moderne klinische Bedeutung von Angst festzulegen.
- source_word: מֵחַטָּאתִי
  choice: wegen meiner Sünde
  rationale: Die Präposition מִן bezeichnet hier am ehesten Ursache oder Anlass der Bekümmernis; „wegen“ macht diese Beziehung klar.
- source_word: חַטָּאתִי
  choice: meine Sünde
  rationale: חַטָּאת ist die übliche Bezeichnung für Sünde; die direkte Wiedergabe ist sachlich und transparent.
theological_decisions:
- issue: Verhältnis von Schuldbekenntnis und innerer Bekümmernis im Bußpsalm
  choice: Der Vers wird als persönliches Bekenntnis der Schuld und als Bekümmernis wegen der eigenen Sünde wiedergegeben.
  alternative: אַגִּיד könnte neutraler mit „ich tue kund“ übersetzt werden; אֶדְאַג könnte stärker als „ich bin in Sorge“ verstanden werden.
  rationale: Der Bußkontext stützt „bekennen“, doch die Übersetzung ergänzt keine weitergehende Lehre über Reue oder Vergebung. Die Fußnoten erhalten die enger am Wortlaut liegenden Alternativen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schuld“ bewahrt die Bedeutungsbreite von עָוֹן, während „bekümmert“ die innere Unruhe ausdrückt, ohne unnötig klinisch zu klingen.
