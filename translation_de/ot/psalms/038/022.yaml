  text: ח֥וּשָׁ/ה לְ/עֶזְרָתִ֑/י אֲ֝דֹנָ֗/י תְּשׁוּעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/022.yaml
  text: Hurry to help me[a], Lord[b], my salvation.
translation:
  language: de
  text: Eile mir zu Hilfe, Herr, meine Rettung!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוּשָׁה
  choice: Beeile dich
  rationale: Der Imperativ von חושׁ drückt eine dringliche Aufforderung zum schnellen Handeln aus. »Beeile dich« ist natürliches modernes Deutsch und wahrt die Dringlichkeit.
- source_word: לְעֶזְרָתִי
  choice: mir zu helfen
  rationale: Wörtlich steht »zu meiner Hilfe«. Die verbale Wiedergabe ist im Deutschen idiomatischer und bewahrt den Sinn.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: אֲדֹנָי ist hier die übliche Gottesbezeichnung »Herr«; die historisch zugrunde liegende Possessivform wird im normalen Gebrauch des Titels nicht eigens hervorgehoben.
- source_word: תְּשׁוּעָתִי
  choice: meine Rettung
  rationale: Das Substantiv bezeichnet Rettung beziehungsweise Heil. »Meine Rettung« ist direkt, verständlich und lässt offen, ob Gott als Ursprung, Vollzug oder Verkörperung der Rettung angesprochen wird.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung אֲדֹנָי
  choice: Herr
  alternative: mein Herr
  rationale: Im Kontext fungiert die Form als etablierter Gottestitel. »Herr« gibt diesen Gebrauch wieder, ohne eine im Hebräischen hier nicht eigens betonte possessive Nuance einzuführen.
- issue: Wiedergabe von תְּשׁוּעָתִי
  choice: meine Rettung
  alternative: mein Retter
  rationale: Die substantivische Form wird beibehalten. Dadurch wird die bildhafte und theologisch offene Gleichsetzung Gottes mit der Rettung nicht auf die handelnde Person »Retter« verengt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe, dringliche Gebetsruf und die nominale Schlussanrede des Hebräischen bleiben erhalten.
