  text: יְֽהוָ֗ה אַל בְּ/קֶצְפְּ/ךָ֥ תוֹכִיחֵ֑/נִי וּֽ/בַ/חֲמָתְ/ךָ֥ תְיַסְּרֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], nor discipline me in your wrath.
translation:
  language: de
  text: Jahwe[a], weise mich nicht in deinem Zorn zurecht und züchtige mich nicht in deinem Grimm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; auch „Yahweh“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: HERR
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Wiedergabe des Tetragramms wahrt einen würdigen, unmittelbar verständlichen Gebetsstil; die Fußnote nennt die hebräische Form und die mögliche Aussprache „Jahwe“.
- source_word: אַל
  choice: nicht
  rationale: Die Negationspartikel leitet zusammen mit den folgenden Verbformen eine flehentliche Bitte ein; im Deutschen wird sie in beiden parallelen Gliedern natürlich mit „nicht“ wiedergegeben.
- source_word: בְּקֶצְפְּךָ
  choice: in deinem Zorn
  rationale: קֶצֶף bezeichnet Zorn beziehungsweise heftiges Missfallen; die Präposition und der Bezug auf Gott bleiben direkt erhalten.
- source_word: תוֹכִיחֵנִי
  choice: weise mich ... zurecht
  rationale: Das Hifil von יכח kann hier tadeln, zurechtweisen oder korrigieren bedeuten. „zurechtweisen“ ist gegenwärtiges, würdevolles Deutsch und lässt den korrigierenden Sinn erkennen.
- source_word: וּבַחֲמָתְךָ
  choice: und ... in deinem Grimm
  rationale: חֵמָה bezeichnet heftigen Zorn beziehungsweise Grimm. Das hebräische ו wird als „und“ bewahrt; die wiederholte Negation macht die parallele Bitte im Deutschen klar.
- source_word: תְיַסְּרֵנִי
  choice: züchtige mich
  rationale: Das Piel von יסר bezeichnet disziplinierende, korrigierende Einwirkung. „züchtigen“ erhält hier die ernste, poetische Kraft, ohne den Vorgang auf bloße Belehrung einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: HERR[a]
  alternative: Jahwe
  rationale: Der Ausgangstext enthält das Tetragramm. „HERR“ entspricht einer verbreiteten deutschen Lesetradition, während die Fußnote die Form JHWH und die mögliche Aussprache „Jahwe“ offenlegt, ohne die unsichere historische Vokalisierung als unumstritten darzustellen.
- issue: Art der erbetenen Verschonung
  choice: Nicht Zurechtweisung oder Züchtigung an sich, sondern ihre Ausübung im Zorn steht sprachlich im Vordergrund.
  alternative: Die Bitte könnte als vollständige Ablehnung jeder Zurechtweisung und Züchtigung gelesen werden.
  rationale: Die beiden ב-Präpositionalgruppen („in deinem Zorn“, „in deinem Grimm“) bestimmen die parallelen Verben. Die Übersetzung erhält diese Verbindung und löst die theologische Spannung nicht durch Zusätze auf.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch mit engem Anschluss an den hebräischen Parallelismus. Die Anrede ist knapp; „Zorn/Grimm“ und „zurechtweisen/züchtigen“ bilden die beiden gesteigerten Parallelpaare.
