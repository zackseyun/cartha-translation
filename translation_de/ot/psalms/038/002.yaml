base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/002.yaml
  text: For your arrows have sunk into me[b][a], and your hand has come down on me.
translation:
  language: de
  text: Denn deine Pfeile sind in mich eingedrungen[a], und deine Hand[b] ist auf mich herabgekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „haben mich durchbohrt“ oder „haben mich getroffen“. Das hebräische Verb bedeutet zunächst „hinabgehen“ oder „niedergehen“ und beschreibt im Bild von Pfeilen ihr Eindringen in den Beter.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Bild von Gottes „Hand“ bezeichnet sein wirksames Handeln; die konkrete Bildsprache bleibt im Haupttext erhalten.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der Klage ein und bewahrt die kausale Funktion in natürlichem, poetischem Deutsch.
- source_word: חִצֶּיךָ
  choice: deine Pfeile
  rationale: Gibt den Plural mit Suffix wörtlich wieder und erhält das konkrete Bild göttlicher Bedrängnis.
- source_word: נִחֲתוּ בִי
  choice: sind in mich eingedrungen
  rationale: נחת bezeichnet hier ein Herabgehen beziehungsweise Niedergehen; zusammen mit den Pfeilen und בִי vermittelt „in mich eingedrungen“ idiomatisch, dass die Pfeile den Beter getroffen haben und in ihm stecken, ohne das Bild aufzulösen.
- source_word: וַתִּנְחַת עָלַי
  choice: hat sich auf mich gesenkt
  rationale: Die Formulierung wahrt die wiederholte Wurzel נחת und das Bild einer von oben niedergehenden, belastenden Hand.
- source_word: יָדֶךָ
  choice: deine Hand
  rationale: Bewahrt die konkrete anthropomorphe Ausdrucksweise des Hebräischen, statt sie als Macht, Gericht oder Züchtigung auszudeuten.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Handeln
  choice: „deine Hand“ wörtlich beibehalten
  alternative: „deine Macht“ oder „dein Gericht“
  rationale: Der hebräische Text spricht in einem konkreten Körperbild von Gottes wirksamem Handeln. Die Übersetzung erhält dieses Bild und legt die Art des Handelns nicht dogmatisch fest.
- issue: Art der durch die Pfeile bezeichneten Bedrängnis
  choice: Das Pfeilbild ohne erklärende Deutung im Haupttext bewahren
  alternative: Die Pfeile ausdrücklich als Strafe, Gericht oder Züchtigung deuten
  rationale: Der Vers beschreibt Gottes bedrängendes Handeln bildhaft, benennt seine genaue theologische Kategorie jedoch nicht ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Parallelität. Die Wiederholung der hebräischen Wurzel נחת wird durch „eingedrungen“ und „gesenkt“ sinngemäß, aber nicht etymologisch identisch wiedergegeben; eine identische deutsche Verblösung wäre unnatürlich.
