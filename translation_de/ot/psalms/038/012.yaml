base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/012.yaml
  text: Those who seek my life set traps[a], and those who seek my harm speak destruction[d][c][b]; all day long they mutter deceit.
translation:
  language: de
  text: Die mir nach dem Leben trachten, legen Schlingen[a]; die meinen Schaden suchen, reden zerstörerische Worte[b] und murmeln den ganzen Tag Trug[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stellen mir Fallen“. Das hebräische Verb gebraucht das Bild des Fangens oder Verstrickens.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „reden Unheil“, „äußern Verderben“ oder „reden von Untergang“. Gemeint sein können zerstörerische Worte oder Vorhaben.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb kann auch „nachsinnen“ oder „murmeln“ bedeuten; es kann hier sowohl fortgesetztes trügerisches Reden als auch trügerisches Planen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַקְשׁוּ
  choice: legen Schlingen
  rationale: Das Verb נקשׁ bezeichnet hier das Legen einer Falle oder Schlinge. Die deutsche Wendung bewahrt das Bild eines heimtückischen Fangens.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: die mir nach dem Leben trachten
  rationale: נפשׁ bezeichnet in diesem feindseligen Zusammenhang das bedrohte Leben. Die idiomatische deutsche Formulierung gibt die tödliche Absicht klar wieder.
- source_word: וְדֹרְשֵׁי רָעָתִי
  choice: die mein Unglück suchen
  rationale: רעה kann Böses, Schaden oder Unglück bezeichnen; mit דרשׁ wird das gezielte Herbeiführen beziehungsweise Suchen dieses Schadens ausgedrückt.
- source_word: דִּבְּרוּ הַוּוֹת
  choice: reden von Verderben
  rationale: הַוּוֹת bezeichnet Verderben, Unheil oder zerstörerische Dinge. „Reden von Verderben“ wahrt den Bezug zur Rede, ohne ausdrücklich festzulegen, ob Drohungen, Pläne oder Unheilsworte gemeint sind.
- source_word: וּמִרְמוֹת
  choice: Täuschung
  rationale: Der Plural מִרְמוֹת bezeichnet Täuschungen oder trügerische Machenschaften; der deutsche Kollektivbegriff ist natürlich und erhält das Bedeutungsfeld.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Natürliche deutsche Wiedergabe der fortdauernden Zeitangabe.
- source_word: יֶהְגּוּ
  choice: sinnen auf
  rationale: הגה kann murmeln, nachsinnen oder sinnen bedeuten. Mit Täuschung als Gegenstand lässt „sinnen auf“ offen, ob inneres Planen oder leise geäußerte Rede im Vordergrund steht.
