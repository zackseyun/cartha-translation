lexical_decisions:
- source_word: נַעֲוֵיתִי
  choice: Ich bin gekrümmt
  rationale: Das Verb עוה bezeichnet ein Gekrümmt-, Verdreht- oder Entstelltsein. »Gekrümmt« bewahrt das körperliche Bild und lässt zugleich die seelische Not mitschwingen.
- source_word: שַׁחֹתִי עַד מְאֹד
  choice: und tief gebeugt
  rationale: שׁחח bezeichnet das Sichbeugen oder Erniedrigtsein; עַד מְאֹד verstärkt die Aussage. »Tief gebeugt« gibt die räumliche Bildsprache natürlich und prägnant wieder.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Eine geläufige moderne Wiedergabe der fortdauernden Zeitangabe.
- source_word: קֹדֵר
  choice: trauernd
  rationale: Das Partizip קֹדֵר kann Dunkelheit, düstere Niedergeschlagenheit oder Trauer ausdrücken. Im Klagezusammenhang ist »trauernd« im Haupttext verständlich; die dunkle Bildkomponente bleibt in der Fußnote sichtbar.
- source_word: הִלָּכְתִּי
  choice: gehe ich … umher
  rationale: הלך beschreibt hier das fortwährende Umhergehen beziehungsweise die Weise, wie der Sprecher seinen Tag verbringt. Das deutsche Präsens entspricht dem fortdauernden Klagezustand.
