  text: אֵין מְתֹ֣ם בִּ֭/בְשָׂרִ/י מִ/פְּנֵ֣י זַעְמֶ֑/ךָ אֵין שָׁל֥וֹם בַּ֝/עֲצָמַ֗/י מִ/פְּנֵ֥י חַטָּאתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/003.yaml
  text: There is no soundness in my flesh because of your indignation[b][a]; there is no peace in my bones because of my sin.
translation:
  language: de
  text: An meinem Leib ist nichts gesund wegen deines Zorns[a]; in meinen Knochen ist kein Frieden[b] wegen meiner Sünde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: deiner Empörung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: kein Wohlergehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתֹם
  choice: nichts heil
  rationale: Das Substantiv bezeichnet Unversehrtheit beziehungsweise einen gesunden, vollständigen Zustand. Die Formulierung »nichts heil« gibt den körperlichen Verfall klar und idiomatisch wieder, ohne ihn medizinisch zu überpräzisieren.
- source_word: בִּבְשָׂרִי
  choice: an meinem Leib
  rationale: בשר bezeichnet hier den leiblichen Körper. »Leib« bewahrt die konkrete Körperlichkeit, klingt im Deutschen natürlicher als »an meinem Fleisch« und vermeidet dessen mögliche missverständliche Nebenbedeutungen.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Die Präposition bezeichnet in beiden Vershälften den Grund. »Wegen« gibt diese kausale Beziehung knapp und eindeutig wieder.
- source_word: זַעְמֶךָ
  choice: deines Zorns
  rationale: זעם bezeichnet heftigen Zorn oder Unwillen. »Zorn« ist im modernen Deutschen klar, gewichtig und in diesem Zusammenhang natürlich.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: שָׁלוֹם kann Frieden, Wohlergehen oder Unversehrtheit bezeichnen. »Frieden« wahrt die Grundbedeutung und den poetischen Kontrast; die kontextuelle Alternative »Wohlergehen« wird in einer Fußnote genannt.
- source_word: בַּעֲצָמַי
  choice: in meinen Gebeinen
  rationale: Das Hebräische spricht wörtlich von den Knochen. »Gebeine« bewahrt dieses poetische Körperbild und bezeichnet im Deutschen passend das tiefste körperliche Innere.
- source_word: חַטָּאתִי
  choice: meiner Sünde
  rationale: Das Wort bezeichnet hier die eigene Sünde des Beters als Ursache seiner Not. »Meine Sünde« ist die direkte und sachlich angemessene Wiedergabe.
theological_decisions:
- issue: Verhältnis zwischen Gottes Zorn, der Sünde des Beters und seinem Leiden
  choice: Der Vers führt die körperliche Not sowohl auf Gottes Zorn als auch auf die eigene Sünde des Beters zurück, ohne den genauen Wirkzusammenhang zu erklären.
  alternative: Die Aussage kann als dichterische Beschreibung erlebter Gottesferne verstanden werden und muss nicht als allgemeine Lehre über die Ursache jedes Leidens gelesen werden.
  rationale: Beide kausalen Aussagen werden unverändert nebeneinandergestellt. Die Übersetzung schwächt weder Gottes Zorn noch die Verantwortung des Beters ab und entwickelt daraus zugleich keine über den Vers hinausgehende Leidenslehre.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Körperbildlichkeit. »Leib« und »Gebeine« sind gehoben, aber allgemein verständlich; Satzbau und Kausalbezüge bleiben klar.
