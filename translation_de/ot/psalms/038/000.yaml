  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Gedenken“ oder „um in Erinnerung zu bringen“. Die knappe hebräische Zweckangabe kann auch eine liturgische Gedächtnisfunktion bezeichnen.'
