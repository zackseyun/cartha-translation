lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psalm
  rationale: Der Ausdruck bezeichnet in Psalmüberschriften ein musikalisch-poetisches Stück; „Psalm“ ist dafür die etablierte und sachlich passende deutsche Gattungsbezeichnung.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der deutsche Genitiv ist in Überschriften natürlich und lässt ähnlich wie die hebräische לְ-Konstruktion offen, ob Urheberschaft, Zuordnung oder Zugehörigkeit gemeint ist.
- source_word: לְהַזְכִּיר
  choice: zur Erinnerung
  rationale: Der Hifil-Infinitiv bezeichnet knapp den Zweck. „Zur Erinnerung“ bewahrt die Offenheit, ob es um ein Erinnern, ein In-Erinnerung-Bringen oder eine liturgische Gedächtnisfunktion geht.
theological_decisions:
- issue: Bezug und Funktion des Erinnerns
  choice: Die knappe Zweckangabe wird nicht durch ein genanntes Subjekt oder Objekt ergänzt.
  alternative: „um Gott zu erinnern“ oder „um sich zu erinnern“
  rationale: Der hebräische Text sagt nicht ausdrücklich, wer wen oder woran erinnern soll; eine Präzisierung würde die echte Mehrdeutigkeit auflösen.
