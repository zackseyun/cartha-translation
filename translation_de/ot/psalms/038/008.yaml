  text: נְפוּג֣וֹתִי וְ/נִדְכֵּ֣יתִי עַד מְאֹ֑ד שָׁ֝אַ֗גְתִּי מִֽ/נַּהֲמַ֥ת לִבִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/008.yaml
  text: I am faint and utterly crushed; I roar because of the groaning of my heart.
translation:
  language: de
  text: Ich bin kraftlos und völlig zerschlagen; ich brülle vor dem Stöhnen meines Herzens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְפוּגוֹתִי
  choice: Ich bin kraftlos
  rationale: Das seltene Verb bezeichnet hier ein Erschlaffen oder Entkräftetsein. „Kraftlos“ gibt den körperlich-seelischen Zustand natürlich wieder, ohne die Bedeutung unnötig einzuengen.
- source_word: וְנִדְכֵּיתִי עַד־מְאֹד
  choice: und völlig zerschlagen
  rationale: נִדְכֵּיתִי beschreibt ein Zermalmt- oder Zerschlagensein; עַד־מְאֹד verstärkt dies nachdrücklich. Die Formulierung bewahrt die starke Bildsprache.
- source_word: שָׁאַגְתִּי
  choice: ich brülle
  rationale: Das Verb bezeichnet ein lautes Brüllen oder Röhren, häufig das eines Löwen. „Brülle“ erhält die außergewöhnliche Intensität und schwächt sie nicht zu „stöhne“ ab.
- source_word: מִנַּהֲמַת לִבִּי
  choice: vor dem Stöhnen meines Herzens
  rationale: נַהֲמָה bezeichnet Stöhnen oder tiefes Ächzen; לֵב ist hier das innere Zentrum von Schmerz und Empfinden. Die kausale Präposition מִן wird idiomatisch mit „vor“ wiedergegeben.
theological_decisions:
- issue: Verhältnis zwischen äußerem Schrei und innerem Leiden
  choice: „ich brülle vor dem Stöhnen meines Herzens“
  alternative: „ich stöhne wegen der Unruhe meines Herzens“
  rationale: Der hebräische Text unterscheidet das heftige äußere Brüllen (שׁאג) vom inneren Stöhnen (נהמה). Diese Spannung wird bewahrt, statt beide Ausdrücke anzugleichen oder das innere Leiden als bloße „Unruhe“ zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst kräftiger Leidenssprache. „Brüllen“ wirkt drastisch, entspricht aber der Intensität des hebräischen Verbs und dem poetischen Kontext.
