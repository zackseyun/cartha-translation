  yaml_path: translation/ot/psalms/038/020.yaml
  text: And those who repay evil for good oppose me[a], because I pursue what is good.
translation:
  language: de
  text: Und die Böses für Gutes vergelten, stellen sich gegen mich, weil ich dem Guten nachjage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Sie stellen sich gegen mich dafür, dass ich dem Guten nachjage.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשַׁלְּמֵי
  choice: Und die … vergelten
  rationale: Das Partizip von שלם bezeichnet Menschen, die etwas als Gegenleistung erwidern. „Vergelten“ bewahrt den Vergeltungs- und Austauschgedanken in natürlichem Deutsch.
- source_word: רָעָה
  choice: Böses
  rationale: Die substantivierte Wiedergabe erhält den moralischen Gegensatz zum Guten.
- source_word: תַּחַת
  choice: für / weil
  rationale: Beim ersten Vorkommen drückt תַּחַת den Austausch aus und wird idiomatisch mit „für“ wiedergegeben. Beim zweiten wird derselbe Vergeltungszusammenhang für verständliches Deutsch kausal mit „weil“ entfaltet; die formnähere Möglichkeit steht in der Fußnote.
- source_word: טוֹבָה
  choice: Gutes
  rationale: „Gutes“ wahrt den knappen Gegensatz zu „Böses“, ohne die Art der Wohltat näher festzulegen.
- source_word: יִשְׂטְנוּנִי
  choice: feinden mich an
  rationale: Das Verb שטן bedeutet, als Gegner aufzutreten oder anzufeinden. „Feinden mich an“ bewahrt die aktive persönliche Gegnerschaft, ohne sie auf eine gerichtliche Anklage zu verengen.
- source_word: רְדֹפִי
  choice: ich … nachjage
  rationale: Die Form von רדף bezeichnet hier das aktive Verfolgen oder Streben nach etwas. „Nachjagen“ erhält die kräftige Bildsprache.
- source_word: טוֹב
  choice: dem Guten
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet das Gute als Ziel des Strebens.
theological_decisions:
- issue: Sinn des zweiten תַּחַת
  choice: weil ich dem Guten nachjage
  alternative: als Vergeltung dafür, dass ich dem Guten nachjage
  rationale: Der hebräische Ausdruck stellt die Anfeindung als Reaktion auf das Streben des Psalmisten nach dem Guten dar. Die kausale Haupttextfassung ist natürliches Deutsch; die Fußnote hält die formale Vergeltungsnuance ausdrücklich offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vergelten“ und „dem Guten nachjagen“ erhalten die knappe Antithese und die starke Bewegungsmetaphorik des Hebräischen; die ungewöhnlichere Wendung „feinden mich an“ bildet die persönliche Gegnerschaft präzise ab.
