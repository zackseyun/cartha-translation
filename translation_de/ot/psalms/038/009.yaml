id: PSA.38.9
reference: Psalms 38:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲֽדֹנָ/י נֶגְדְּ/ךָ֥ כָל תַּאֲוָתִ֑/י וְ֝/אַנְחָתִ֗/י מִמְּ/ךָ֥ לֹא נִסְתָּֽרָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/009.yaml
  text: Lord[a], all my desire is before you[b], and my groaning is not hidden from you.
translation:
  language: de
  text: Herr, all mein Verlangen[a] liegt vor dir, und mein Seufzen[b] ist dir nicht verborgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „all mein Sehnen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mein Stöhnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Die Anrede verwendet den Herrschaftstitel אֲדֹנָי und nicht den Gottesnamen JHWH; „Herr“ ist daher die natürliche und genaue deutsche Wiedergabe.
- source_word: נֶגְדְּךָ
  choice: vor dir
  rationale: Die Wendung bezeichnet Gottes Gegenwart beziehungsweise Blickfeld und bringt zum Ausdruck, dass das Verlangen des Beters offen vor Gott liegt.
- source_word: כָל
  choice: all
  rationale: '„All“ bewahrt ausdrücklich die umfassende Aussage: Kein Teil des Verlangens bleibt außerhalb von Gottes Wahrnehmung.'
- source_word: תַּאֲוָתִי
  choice: mein Verlangen
  rationale: Im Zusammenhang der Klage bezeichnet das Wort ein tiefes Begehren oder Sehnen. „Verlangen“ ist würdig, verständlich und lässt die inhaltliche Weite des hebräischen Ausdrucks bestehen.
- source_word: וְאַנְחָתִי
  choice: und mein Seufzen
  rationale: Das Substantiv bezeichnet den hörbaren oder inneren Ausdruck von Bedrängnis. „Seufzen“ passt natürlich zum deutschen Klagewortlaut, während „Stöhnen“ als mögliche Nuance in der Fußnote erhalten bleibt.
- source_word: מִמְּךָ לֹא נִסְתָּרָה
  choice: ist dir nicht verborgen
  rationale: Die deutsche Dativkonstruktion gibt idiomatisch und präzise wieder, dass das Seufzen vor Gott nicht verborgen ist; das passive Zustandsverb wird im Präsens wiedergegeben.
theological_decisions:
- issue: Göttliche Anrede mit אֲדֹנָי statt mit dem Gottesnamen JHWH
  choice: Herr
  alternative: der HERR
  rationale: Der hebräische Text enthält hier אֲדֹנָי, nicht das Tetragramm. Deshalb wird der Herrschaftstitel mit „Herr“ wiedergegeben und nicht mit der für JHWH vorbehaltenen Form „der HERR“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit engem Anschluss an den hebräischen Parallelismus. Das ergänzte Verb „liegt“ macht den nominalen ersten Satz im Deutschen natürlich, ohne die Aussage inhaltlich zu erweitern.
