id: PSA.38.11
reference: Psalms 38:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֹֽהֲבַ֨/י וְ/רֵעַ֗/י מִ/נֶּ֣גֶד נִגְעִ֣/י יַעֲמֹ֑דוּ וּ֝/קְרוֹבַ֗/י מֵ/רָחֹ֥ק עָמָֽדוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/011.yaml
  text: My loved ones and my friends stand apart from my affliction[c][b][a], and my close kin stand far away.
translation:
  language: de
  text: Menschen, die mich lieben, und meine Freunde halten sich von meinem Leiden[a] fern; meine Angehörigen[b] stehen weit weg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »von meiner Plage«, »von meinem Schlag« oder »von meiner Wunde«. Das hebräische Wort kann eine körperliche Verletzung, eine krankheitsartige Plage oder allgemeiner eine schwere Heimsuchung bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Oder »meine Verwandten« beziehungsweise »die mir Nahestehenden«.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֲבַי
  choice: Menschen, die mich lieben
  rationale: Die substantivierte Partizipialform bezeichnet diejenigen, die den Beter lieben. Die Umschreibung ist im modernen Deutschen natürlich und vermeidet die vorwiegend romantische Bedeutung von »meine Geliebten«.
- source_word: וְרֵעַי
  choice: und meine Freunde
  rationale: רֵעַ bezeichnet hier einen Freund oder Gefährten; »Freunde« passt klar und natürlich zum Parallelbegriff.
- source_word: מִנֶּגֶד נִגְעִי יַעֲמֹדוּ
  choice: halten sich von meinem Leiden fern
  rationale: Die Wiedergabe vermittelt das räumliche Gegenüber- beziehungsweise Abstandhalten in idiomatischem Deutsch. Sie legt nicht genauer fest, ob die Not nur Anlass oder unmittelbar Gegenstand des Abstandhaltens ist.
- source_word: נִגְעִי
  choice: meinem Leiden
  rationale: נֶגַע kann einen Schlag, eine Wunde, eine Krankheit oder allgemeiner eine schwere Heimsuchung bezeichnen. »Leiden« bleibt im körperlichen Kontext verständlich, ohne die Art der Not unnötig festzulegen.
- source_word: וּקְרוֹבַי
  choice: meine Angehörigen
  rationale: קָרוֹב bezeichnet Nahestehende und kann besonders nahe Verwandte meinen. »Angehörige« wahrt den wahrscheinlich familiären Bezug, ohne ihn enger zu bestimmen.
- source_word: מֵרָחֹק עָמָדוּ
  choice: stehen weit weg
  rationale: Die Formulierung erhält das konkrete räumliche Bild. Trotz der hebräischen Perfektform ist wegen des poetischen Parallelismus und der geschilderten gegenwärtigen Lage das deutsche Präsens angemessen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelität. »Halten sich … fern« gibt das räumliche Bild idiomatisch wieder; »stehen weit weg« bewahrt im zweiten Halbvers dessen konkrete Zuspitzung.
