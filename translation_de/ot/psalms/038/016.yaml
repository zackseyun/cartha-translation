    rationale: Das Hebräische lautet wörtlich „denn ich sagte“. Inneres Sprechen ist möglich, aber „ich sagte“ ist quellentreuer und entspricht dem englischen Audit-Trail.
  - severity: medium
    issue: „tun sie groß gegen mich“
    rationale: Die Formulierung ist im heutigen Standarddeutsch nicht idiomatisch; „sich gegen mich großtun“ stellt die erforderliche reflexive Konstruktion her.
  - severity: low
    issue: Indikativ nach „Sonst“
    rationale: „Sonst würden sie“ markiert die befürchtete, hypothetische Folge von פֶּן klarer als der Indikativ Präsens.
