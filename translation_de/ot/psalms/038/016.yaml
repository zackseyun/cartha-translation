source:
  edition: WLC
  text: כִּֽי אָ֭מַרְתִּי פֶּן יִשְׂמְחוּ לִ֑/י בְּ/מ֥וֹט רַ֝גְלִ֗/י עָלַ֥/י הִגְדִּֽילוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/016.yaml
  text: For I said, “Otherwise they would rejoice over me; when my foot slips, they boast against me.”
translation:
  language: de
  text: 'Denn ich sagte: »Sonst würden sie sich über mich freuen; wenn mein Fuß wankt, würden sie sich gegen mich großtun.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: ich dachte
  rationale: Das hebräische »sagen« kann hier inneres Sprechen bezeichnen; im natürlichen Deutschen gibt »dachte« den Zusammenhang treffend wieder.
- source_word: פֶּן
  choice: sonst
  rationale: Drückt hier die befürchtete Folge aus und bewahrt den Sinn von »damit nicht / andernfalls« in natürlichem Deutsch.
- source_word: בְּמוֹט רַגְלִי
  choice: wenn mein Fuß wankt
  rationale: Bewahrt das konkrete Bild des Hebräischen; מוֹט bezeichnet Wanken oder Schwanken, nicht zwingend bereits einen Sturz.
- source_word: עָלַי הִגְדִּילוּ
  choice: tun sie groß gegen mich
  rationale: 'Die ungewöhnliche, aber verständliche Formulierung bildet das hebräische Idiom bewusst ab: Die Gegner überheben sich beziehungsweise prahlen triumphierend gegen den Beter.'
theological_decisions:
- issue: Art der Reaktion der Gegner
  choice: tun sie groß gegen mich
  alternative: triumphieren sie über mich / prahlen sie gegen mich
  rationale: Die offenere Wiedergabe erhält die Bildhaftigkeit und semantische Spannung des hebräischen Verbs, ohne sie ausschließlich als Prahlen oder als endgültigen Triumph festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das körperliche Bild vom wankenden Fuß bleibt erhalten; die markante Wendung »groß tun gegen« ist bewusst leicht fremdartig, aber idiomatisch verständlich.
