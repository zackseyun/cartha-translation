  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist getroffen: Der Beter befürchtet die Schadenfreude seiner Gegner bei seinem Wanken. אָמַרְתִּי bedeutet jedoch primär „ich sagte“; eine Wiedergabe als bloßes „ich dachte“ ist hier ohne zwingenden Anlass weniger quellennah. Die Verbformen beschreiben die befürchtete Folge und sind im Deutschen mit Konjunktiv idiomatischer wiederzugeben.'
  naturalness: „tun sie groß gegen mich“ ist im modernen Standarddeutsch in dieser Stellung und ohne Reflexivpronomen nicht natürlich. „sich gegen mich großtun“ bewahrt die bildhafte Überheblichkeit und ist verständlich. Der Konjunktiv („würden“) macht die von פֶּן eingeleitete Befürchtung klar.
  terminology: Keine besonderen theologischen oder namensbezogenen Fragen. „sich großtun“ gibt עלי הגדילו als selbstüberhebliches Auftreten gegen den Beter wieder, ohne es auf bloßes Prahlen oder endgültigen Triumph festzulegen.
  issues:
