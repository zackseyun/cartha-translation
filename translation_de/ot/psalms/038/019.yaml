  text: Und meine Feinde leben und sind stark; zahlreich sind die, die mich zu Unrecht hassen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die mich ohne Grund hassen“. Das hebräische Wort שָׁקֶר bedeutet wörtlich „Falschheit“ oder „Lüge“ und kann den Hass als von Falschheit geprägt oder als unbegründet kennzeichnen.'
