lexical_decisions:
- source_word: אֹיְבַי
  choice: meine Feinde
  rationale: Die direkte und natürliche Wiedergabe bezeichnet persönliche Gegner des Psalmisten.
- source_word: חַיִּים
  choice: leben
  rationale: Das Adjektiv bedeutet hier „lebend/lebendig“. Die verbale Formulierung klingt im Deutschen natürlich und bewahrt den Gegensatz zum geschwächten Zustand des Psalmisten.
- source_word: עָצֵמוּ
  choice: sind stark
  rationale: Das Verb bezeichnet Stark- oder Mächtigwerden; im Kontext gibt die Zustandsaussage ihre gegenwärtige Übermacht treffend wieder.
- source_word: רַבּוּ
  choice: zahlreich sind
  rationale: Das Verb drückt Vermehrung beziehungsweise große Zahl aus. Die Formulierung ist idiomatisch und bewahrt die parallele Aussage über die Gegner.
- source_word: שֹׂנְאַי
  choice: die, die mich … hassen
  rationale: Die substantivierte Partizipialform wird verbal wiedergegeben, sodass der Vorgang des Hassens erhalten bleibt.
- source_word: שָׁקֶר
  choice: zu Unrecht
  rationale: Das adverbial gebrauchte Substantiv „Falschheit/Lüge“ kennzeichnet den Hass als falsch oder unberechtigt. „Zu Unrecht“ ist im modernen Deutschen natürlich, während die Fußnote die mögliche Nuance „ohne Grund“ offenhält.
