  text: For my loins are filled with burning[b][a], and there is no soundness in my flesh.
translation:
  language: de
  text: Denn meine Lenden[a] sind von Brennen[b] erfüllt, und nichts an meinem Fleisch ist unversehrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Flanken“ oder „Hüften“; das hebräische Wort bezeichnet die mittlere Körperregion beziehungsweise den Lendenbereich.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort ist schwer zu deuten; möglich sind auch „Entzündung“ oder „versengende Hitze“. Geschwüre werden nicht ausdrücklich genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung für die zuvor geschilderte Not ein.
- source_word: כְסָלַי
  choice: meine Lenden
  rationale: Bezeichnet die Körperregion der Lenden, Flanken oder Hüften; „Lenden“ wahrt die körperliche Konkretheit, ohne die Stelle enger festzulegen.
- source_word: מָלְאוּ
  choice: sind voller
  rationale: Gibt den resultativ-stativen Sinn von מלא natürlich wieder.
- source_word: נִקְלֶה
  choice: Brennen
  rationale: Das seltene und schwierige Wort bezeichnet hier im Kontext körperlichen Leidens wahrscheinlich eine brennende oder entzündliche Beschwerde. Die Wiedergabe vermeidet den im Hebräischen nicht ausdrücklich genannten Zusatz „Geschwüre“.
- source_word: וְאֵין מְתֹם
  choice: und nichts … ist unversehrt
  rationale: מְתֹם bezeichnet körperliche Unversehrtheit oder Gesundheit; die deutsche Formulierung gibt die existentielle Verneinung idiomatisch wieder.
- source_word: בִּבְשָׂרִי
  choice: an meinem Fleisch
  rationale: Bewahrt die konkrete körperliche Bezeichnung בשר und passt idiomatisch zu „nichts … ist unversehrt“.
theological_decisions:
- issue: Bedeutung von בשרי im Zusammenhang körperlichen Leidens
  choice: 'wörtlich-körperlich: „mein Fleisch“'
  alternative: „mein Körper“
  rationale: Der Parallelismus mit den Lenden und der fehlenden Unversehrtheit spricht eindeutig von körperlichem Leiden; eine metaphorische oder anthropologisch-theologische Deutung ist hier nicht angezeigt.
- issue: Deutung des schwierigen Wortes נִקְלֶה
  choice: 'körperliche Beschwerde: „Brennen“'
  alternative: „Entzündung“, „Versengung“ oder abstrakt „Schändlichkeit“
  rationale: Der unmittelbare Kontext beschreibt den kranken Körper. Dennoch bleibt die genaue Art der Beschwerde lexikalisch unsicher und wird deshalb in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Parallelismus; „Fleisch“ bewahrt die konkrete Körperlichkeit. Die beiden Fußnoten markieren echte lexikalische Unsicherheiten.
