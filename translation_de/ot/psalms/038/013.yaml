  text: וַ/אֲנִ֣י כְ֭/חֵרֵשׁ לֹ֣א אֶשְׁמָ֑ע וּ֝/כְ/אִלֵּ֗ם לֹ֣א יִפְתַּח פִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/013.yaml
  text: But I[a], like a deaf man, do not hear; and like a mute man[b], I do not open my mouth.
translation:
  language: de
  text: Ich aber bin wie ein Tauber und höre nicht; und wie ein Stummer, der seinen Mund nicht öffnet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und wie ein Stummer – er öffnet seinen Mund nicht“. Das Hebräische wechselt von der ersten Person („ich höre nicht“) in die dritte Person und führt damit wahrscheinlich den Vergleich mit dem Stummen fort. Möglich ist auch die sinngemäß geglättete Wiedergabe: „und wie ein Stummer öffne ich meinen Mund nicht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Die Konjunktion mit dem betonten Pronomen hebt den Gegensatz zu den feindseligen Rednern im Zusammenhang hervor; „Ich aber“ gibt dies im Deutschen natürlich wieder.
- source_word: כְחֵרֵשׁ
  choice: wie ein Tauber
  rationale: Das Präfix כְּ bezeichnet den Vergleich; חֵרֵשׁ meint einen tauben Menschen. Die substantivierte Form bewahrt Bild und Singular.
- source_word: לֹא אֶשְׁמָע
  choice: höre nicht
  rationale: שׁמע bedeutet im Qal gewöhnlich „hören“. Die wörtliche Sinnesmetapher bleibt erhalten, während der Zusammenhang ein bewusstes Nichtreagieren nahelegt.
- source_word: וּכְאִלֵּם
  choice: wie ein Stummer
  rationale: אִלֵּם bezeichnet einen stummen Menschen und steht parallel zu „ein Tauber“.
- source_word: לֹא יִפְתַּח פִּיו
  choice: der seinen Mund nicht öffnet
  rationale: Das Hebräische wechselt formal in die dritte Person („seinen Mund“). Ein Relativsatz bindet diese Form natürlich an den Stummen zurück und bewahrt den Personenwechsel.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Relativsatz erhält den hebräischen Wechsel zur dritten Person, ohne im Deutschen unnötig abgehackt zu wirken.
