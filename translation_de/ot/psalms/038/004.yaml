  text: כִּ֣י עֲ֭וֺנֹתַ/י עָבְר֣וּ רֹאשִׁ֑/י כְּ/מַשָּׂ֥א כָ֝בֵ֗ד יִכְבְּד֥וּ מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/004.yaml
  text: For my iniquities have gone over my head; like a heavy burden[a], they are too heavy for me.
translation:
  language: de
  text: Denn meine Sünden[a] sind mir über den Kopf gestiegen; wie eine schwere Last sind sie zu schwer für mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Schuld«. Das hebräische Wort kann sowohl Sünden als auch die daraus entstehende Schuld bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet den Grund für die Klage ein und entspricht dem erklärenden Zusammenhang natürlich.
- source_word: עֲוֺנֹתַי
  choice: meine Verfehlungen
  rationale: Gibt die moralischen Vergehen in natürlichem, würdigem Deutsch wieder, ohne den möglichen Bedeutungsaspekt der daraus entstehenden Schuld auszuschließen.
- source_word: עָבְרוּ רֹאשִׁי
  choice: sind mir über den Kopf gestiegen
  rationale: Bewahrt das konkrete hebräische Bild von etwas, das über den Kopf steigt, und ist im Deutschen verständlich.
- source_word: כְּמַשָּׂא כָבֵד
  choice: wie eine schwere Last
  rationale: Erhält das körperliche Bild einer schwer zu tragenden Last.
- source_word: יִכְבְּדוּ מִמֶּנִּי
  choice: sind sie zu schwer für mich
  rationale: Bewahrt die Wiederaufnahme des Wortfelds ‚schwer‘ und drückt aus, dass die Last die Kräfte des Sprechers übersteigt.
theological_decisions:
- issue: Bedeutungsbreite von עָוֹן im Bußkontext
  choice: Im Haupttext als „Verfehlungen“ wiedergegeben, mit vorrangigem Bezug auf die moralischen Taten des Beters.
  alternative: „Schuld“, mit Betonung des Schuldzustands oder der aus den Taten erwachsenden Belastung.
  rationale: Das hebräische Wort kann sowohl das Vergehen als auch die daraus folgende Schuld bezeichnen. Der Haupttext wahrt den Bezug auf die Taten; die Fußnote erhält die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die beiden hebräischen Bilder – das Übersteigen des Kopfes und die schwere Last – bleiben erhalten.
