  text: וָ/אֱהִ֗י כְּ֭/אִישׁ אֲשֶׁ֣ר לֹא שֹׁמֵ֑עַ וְ/אֵ֥ין בְּ֝/פִ֗י/ו תּוֹכָחֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/014.yaml
  text: And I became like a man who does not hear[a], and in whose mouth there are no reproofs.
translation:
  language: de
  text: Und ich wurde wie ein Mann, der nicht hört und in dessen Mund keine Erwiderungen[a] sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zurechtweisungen“, „Gegenargumente“ oder „Antworten“. Das hebräische Wort kann sowohl verbale Korrekturen als auch entgegnende oder widerlegende Antworten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: Und ich wurde
  rationale: Das Qal-Wayyiqtol der 1. Person Singular führt die Aussage fort. „Wurde“ bewahrt die im Vergleich anklingende Entwicklung, ohne die Konjunktion adversativ umzudeuten.
- source_word: כְּאִישׁ
  choice: wie ein Mann
  rationale: אִישׁ bezeichnet hier einen einzelnen Mann; die konkrete maskuline Form und der Vergleich werden beibehalten.
- source_word: אֲשֶׁר לֹא שֹׁמֵעַ
  choice: der nicht hört
  rationale: Das Partizip von שׁמע kann „hören“ oder „zuhören“ bedeuten. „Nicht hört“ ist unmittelbar und fügt keine im Hebräischen nicht ausdrücklich genannte Unfähigkeit hinzu.
- source_word: וְאֵין בְּפִיו
  choice: und in dessen Mund keine … sind
  rationale: Die Existenzverneinung אֵין und das Bild vom Mund als Ort der Rede bleiben erhalten; „dessen“ verbindet den Relativsatz natürlich mit „Mann“.
- source_word: תּוֹכָחוֹת
  choice: Erwiderungen
  rationale: Das Wort kann Zurechtweisungen, Gegenargumente oder antwortende Widerlegungen bezeichnen. Im Zusammenhang des schweigenden Beters gibt „Erwiderungen“ den Sinn offen und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Wahrung des hebräischen Parallelismus und des bildhaften Ausdrucks „in dessen Mund“. Die Mehrdeutigkeit von תּוֹכָחוֹת wird durch eine kontextuell passende Hauptübersetzung und eine Fußnote bewahrt.
