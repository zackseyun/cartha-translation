  register: Modernes, würdevolles Standarddeutsch. „Zehntausende“ bewahrt das konkrete hebräische Zahlenbild und bezeichnet idiomatisch eine sehr große Menge; die Satzstellung erhält die poetische Umzingelungsszene.
