source:
  edition: WLC
  text: לֹֽא אִ֭ירָא מֵ/רִבְב֥וֹת עָ֑ם אֲשֶׁ֥ר סָ֝בִ֗יב שָׁ֣תוּ עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/006.yaml
  text: I will not fear myriads of people who have set themselves all around me[a].
translation:
  language: de
  text: Ich fürchte mich nicht vor Zehntausenden Menschen, die sich rings um mich aufgestellt haben[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sich von allen Seiten gegen mich aufgestellt haben“.'
    reason: Die Verbindung von סָבִיב und עָלָי kann sowohl die räumliche Umzingelung als auch die feindliche Ausrichtung hervorheben.
lexical_decisions:
- source_word: לֹא אִירָא
  choice: Ich fürchte mich nicht
  rationale: Das Qal-Imperfekt kann gegenwärtige Zuversicht oder einen entschlossenen Zukunftsbezug ausdrücken. Im Deutschen gibt das Präsens die feste Furchtlosigkeit natürlich wieder, ohne die zeitliche Nuance unnötig festzulegen.
- source_word: מֵרִבְבוֹת
  choice: vor Zehntausenden
  rationale: Die Präposition מִן bezeichnet nach ירא den Gegenstand der Furcht und wird idiomatisch mit „vor“ wiedergegeben. רְבָבוֹת ist der Plural von „Zehntausend“ und bezeichnet hier eine gewaltige Menge.
- source_word: עָם
  choice: Menschen
  rationale: עָם meint hier keine abstrakte Nation, sondern die große Menge derer, die den Beter umringen.
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen leitet den beschreibenden Relativsatz ein und bezieht sich auf die Menschen.
- source_word: סָבִיב
  choice: rings um mich
  rationale: Das Adverb bezeichnet die Umzingelung von allen Seiten und wird zusammen mit עָלָי räumlich wiedergegeben.
- source_word: שָׁתוּ עָלָי
  choice: sich … aufgestellt haben
  rationale: שָׁתוּ bedeutet „sie haben gesetzt/gestellt“. In diesem Zusammenhang ist das Positionieren der Gegner gemeint; das Deutsche verwendet dafür natürlich eine reflexive Form. עָלָי kann zugleich die feindliche Ausrichtung „gegen mich“ ausdrücken, was die Fußnote festhält.
theological_decisions: []
