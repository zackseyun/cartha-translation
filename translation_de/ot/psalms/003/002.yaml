id: PSA.3.2
reference: Psalms 3:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רַבִּים֮ אֹמְרִ֪ים לְ/נַ֫פְשִׁ֥/י אֵ֤ין יְֽשׁוּעָ֓תָ/ה לּ֬/וֹ בֵֽ/אלֹהִ֬ים סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/002.yaml
  text: Many are saying of me[c][b][a], “There is no salvation for him in God.” Selah
translation:
  language: de
  text: 'Viele sagen über mich[a]: »Für ihn gibt es keine Rettung bei Gott.« Sela[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu meiner Seele«; gemeint ist idiomatisch die eigene Person, also »über mich« oder »von mir«.'
    reason: lexical_alternative
  - marker: b
    text: »Sela« ist vermutlich ein musikalischer oder liturgischer Ausdruck; seine genaue Bedeutung ist unsicher.
    reason: cultural_note
lexical_decisions:
- source_word: רַבִּים
  choice: Viele
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet eine unbestimmte große Zahl von Menschen; »Viele« ist knapp und natürlich.
- source_word: אֹמְרִים
  choice: sagen
  rationale: Das Partizip kann fortdauerndes oder wiederholtes Reden ausdrücken. Im Deutschen kann das Präsens »sagen« diesen Sinn natürlich wiedergeben.
- source_word: לְנַפְשִׁי
  choice: über mich
  rationale: Wörtlich steht »zu meiner Seele/meinem Leben«. נֶפֶשׁ bezeichnet hier idiomatisch die eigene Person; »über mich« passt zum Inhalt der folgenden Aussage und vermeidet eine irreführende psychologische Verengung.
- source_word: אֵין
  choice: gibt es keine
  rationale: Die hebräische Existenzverneinung wird mit der natürlichen deutschen Konstruktion »es gibt keine« wiedergegeben.
- source_word: יְשׁוּעָתָה
  choice: Rettung
  rationale: Das Wort bezeichnet Rettung oder Befreiung aus Not. »Rettung« ist im heutigen Deutsch verständlich und bewahrt sowohl den konkreten als auch den theologischen Gehalt.
- source_word: לּוֹ
  choice: für ihn
  rationale: Die zitierenden Gegner sprechen vom Psalmisten in der dritten Person; »für ihn« gibt den Bezug unmittelbar wieder.
- source_word: בֵאלֹהִים
  choice: bei Gott
  rationale: ב kann hier den Bereich oder die Instanz bezeichnen, bei der Rettung zu finden wäre. »Bei Gott« bewahrt diese Beziehung natürlicher als das im Deutschen missverständliche »in Gott« und legt die Herkunft nicht so ausdrücklich fest wie »von Gott«.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und Funktion des Ausdrucks nicht sicher bestimmt sind, wird er transliteriert statt spekulativ übersetzt.
theological_decisions:
- issue: Wiedergabe von יְשׁוּעָה als »Rettung« oder »Heil«
  choice: Rettung
  alternative: Heil
  rationale: Der unmittelbare Kontext handelt von Gottes rettendem Eingreifen in Bedrängnis. »Rettung« wahrt zugleich die breitere theologische Tragweite, ohne den Vers auf einen dogmatischen Heilsbegriff zu verengen.
- issue: Wiedergabe von לְנַפְשִׁי wörtlich oder idiomatisch
  choice: über mich
  alternative: zu meiner Seele
  rationale: נֶפֶשׁ steht hier für die Person selbst. Eine wörtliche Wiedergabe wäre im modernen Deutschen unklar und könnte fälschlich ausschließlich das innere Seelenleben nahelegen.
- issue: Verhältnis der Rettung zu Gott in בֵאלֹהִים
  choice: bei Gott
  alternative: von Gott
  rationale: '»Bei Gott« hält die semantische Offenheit der Präposition eher fest: Die Gegner bestreiten, dass für ihn im Verhältnis zu Gott Rettung vorhanden ist. »Von Gott« wäre kontextuell plausibel, deutete die Präposition aber eindeutiger als der Ausgangstext.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Ton. Die direkte Rede ist klar markiert; »Sela« bleibt wegen seiner unsicheren Bedeutung unübersetzt.
