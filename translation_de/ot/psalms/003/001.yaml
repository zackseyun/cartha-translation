source:
  edition: WLC
  text: יְ֭הוָה מָֽה רַבּ֣וּ צָרָ֑/י רַ֝בִּ֗ים קָמִ֥ים עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/001.yaml
  text: O Yahweh[a], how many are my adversaries! Many are rising up against me.
translation:
  language: de
  text: Jahwe[a], wie zahlreich sind meine Bedränger! Viele erheben sich gegen mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH, der persönliche Name Gottes; traditionell oft mit „der HERR“ wiedergegeben.'
    reason: Erläuterung des Gottesnamens und der verbreiteten Übersetzungsalternative.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen übliche wissenschaftliche Umschrift; ein zusätzliches „O“ steht im Hebräischen nicht.
- source_word: מָה רַבּוּ
  choice: wie zahlreich sind
  rationale: מָה leitet hier einen Ausruf über die große Zahl der Gegner ein. Die Formulierung ist im Deutschen natürlich und bewahrt den klagenden Nachdruck.
- source_word: צָרָי
  choice: meine Bedränger
  rationale: Das Wort bezeichnet Menschen, die den Sprecher bedrängen oder ihm feindlich entgegentreten. „Bedränger“ hält den aktiven Druck fest, ohne ausschließlich militärische Feinde vorauszusetzen.
- source_word: רַבִּים קָמִים עָלָי
  choice: Viele erheben sich gegen mich
  rationale: Das Partizip קָמִים beschreibt anhaltendes oder gegenwärtiges feindliches Auftreten; mit עָלָי bedeutet die Wendung idiomatisch „sich gegen mich erheben“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Umschrift bewahrt diese Unterscheidung gegenüber dem Titel „Herr“, ohne dem Vers eine zusätzliche konfessionelle Deutung aufzuerlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Parallelismus und die Steigerung des hebräischen Klagerufs bleiben erhalten.
