  source_fidelity: Der hebräische Ausruf יְהוָה מָה רַבּוּ צָרָי ist treffend als „Jahwe, wie zahlreich sind meine Bedränger!“ wiedergegeben. מָה leitet einen Ausruf ein, רַבּוּ bezeichnet die große Zahl der Gegner, und צָרָי wird angemessen als aktiv bedrängende feindliche Personen verstanden. רַבִּים קָמִים עָלָי ist mit „Viele erheben sich gegen mich“ quellentreu; das Partizip lässt die gegenwärtige bzw. andauernde feindliche Erhebung erkennen.
