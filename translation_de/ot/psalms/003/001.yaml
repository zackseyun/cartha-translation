  terminology: „Jahwe“ ist im deutschen wissenschaftlichen und bibelübersetzerischen Gebrauch eine etablierte Wiedergabe des Tetragramms. Die Fußnote erklärt sachlich die hebräische Schreibung JHWH sowie die traditionelle Ersatzwiedergabe „der HERR“, ohne den Text zu überladen oder eine konfessionelle Deutung einzuführen.
