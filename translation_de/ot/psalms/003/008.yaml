  text: Salvation belongs to Yahweh[a]; your blessing be on your people[b]. Selah
translation:
  language: de
  text: Jahwe gehört die Rettung. Dein Segen sei auf deinem Volk.[a] Sela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dein Segen ist auf deinem Volk.“ Der hebräische Satz hat kein ausdrückliches Verb und kann sowohl als Feststellung als auch als Bitte verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: „Sela“ ist wahrscheinlich eine liturgische oder musikalische Angabe; die genaue Bedeutung ist ungewiss.
    reason: cultural_note
lexical_decisions:
- source_word: לַיהוָה
  choice: bei Jahwe
  rationale: Das präfigierte ל bezeichnet hier in einem verblosen Satz Zugehörigkeit bzw. den, bei dem Rettung zu finden ist. „Bei Jahwe“ gibt dies im Deutschen knapp und natürlich wieder, ohne die Beziehung unnötig festzulegen.
- source_word: הַיְשׁוּעָה
  choice: die Rettung
  rationale: Das Substantiv bezeichnet Rettung oder Befreiung. Im unmittelbaren Zusammenhang des Psalms ist „Rettung“ konkreter als „Heil“, ohne die weitergehende theologische Bedeutung auszuschließen.
- source_word: עַל
  choice: auf
  rationale: Die Präposition beschreibt den Segen als auf dem Volk ruhend. „Auf“ bildet das hebräische Bild unmittelbar ab.
- source_word: עַמְּךָ
  choice: deinem Volk
  rationale: עַם bezeichnet hier Gottes Volk als gemeinschaftliche und relationale Größe; „dein Volk“ bewahrt diesen Sinn.
- source_word: בִרְכָתֶךָ
  choice: dein Segen
  rationale: בְּרָכָה bedeutet unmittelbar „Segen“. Diese Wiedergabe ist genauer und umfassender als eine Einengung auf „Gunst“.
- source_word: סֶּלָה
  choice: Sela
  rationale: Die genaue Bedeutung ist ungewiss; wahrscheinlich handelt es sich um eine liturgische oder musikalische Angabe. Daher wird das Wort transliteriert statt mutmaßlich übersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den offenbarten Gottesnamen in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung des verblosen zweiten Satzes
  choice: Dein Segen sei auf deinem Volk
  alternative: Dein Segen ist auf deinem Volk
  rationale: Die hebräische Nominalklausel kann im Zusammenhang als Bitte oder als Feststellung verstanden werden. Der Haupttext wahrt mit dem Konjunktiv den Segenswunsch; die ebenfalls mögliche deklarative Lesart wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gottesname wird als „Jahwe“ wiedergegeben. Die knappe Parallelstruktur des hebräischen Verses bleibt erhalten; echte syntaktische Mehrdeutigkeit wird durch eine Fußnote kenntlich gemacht.
