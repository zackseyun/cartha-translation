  text: ק֘וּמָ֤/ה יְהוָ֨ה הוֹשִׁ֘יעֵ֤/נִי אֱלֹהַ֗/י כִּֽי הִכִּ֣יתָ אֶת כָּל אֹיְבַ֣/י לֶ֑חִי שִׁנֵּ֖י רְשָׁעִ֣ים שִׁבַּֽרְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/007.yaml
  text: Rise up[a], O Yahweh; save me, my God. For you have struck all my enemies on the cheek; you have broken the teeth of the wicked.
translation:
  language: de
  text: Steh auf, Jahwe! Rette mich, mein Gott! Denn du hast alle meine Feinde auf die Wange geschlagen; die Zähne der Frevler hast du zerbrochen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn du schlägst alle meine Feinde auf den Kiefer; die Zähne der Frevler zerbrichst du.“ Die hebräischen Perfektformen können eine vollendete Handlung bezeichnen, im poetischen Gebet aber auch Gottes gewisses oder charakteristisches Handeln ausdrücken. Das Wort לֶחִי kann „Wange“ oder „Kiefer“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Steh auf
  rationale: Der Imperativ von קום ist ein eindringlicher Ruf an Gott, einzugreifen. „Steh auf“ ist im modernen Deutschen natürlich und bewahrt das konkrete Bild.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הוֹשִׁיעֵנִי
  choice: Rette mich
  rationale: Der Hifil-Imperativ von ישׁע mit Suffix der 1. Person Singular bezeichnet hier die erbetene Rettung aus unmittelbarer Bedrängnis.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Die Possessivform wird direkt und persönlich wiedergegeben.
- source_word: כִּי
  choice: Denn
  rationale: כִּי führt hier am natürlichsten die Begründung für die Bitte ein.
- source_word: הִכִּיתָ
  choice: du hast … geschlagen
  rationale: Die hebräische Perfektform wird zunächst als vollendete Handlung wiedergegeben; ihre mögliche gewissheitsbezogene beziehungsweise poetische Funktion wird in der Fußnote offengehalten.
- source_word: אֶת כָּל אֹיְבַי
  choice: alle meine Feinde
  rationale: Die direkte Objektphrase wird transparent und idiomatisch übersetzt.
- source_word: לֶחִי
  choice: auf die Wange
  rationale: לֶחִי kann „Wange“ oder „Kiefer“ bedeuten. „Auf die Wange schlagen“ ist im Deutschen idiomatisch und bewahrt das Bild der Demütigung; „Kiefer“ bleibt als mögliche Lesart in der Fußnote erhalten.
- source_word: שִׁנֵּי רְשָׁעִים
  choice: die Zähne der Frevler
  rationale: Das konkrete Bild wird beibehalten. „Frevler“ gibt das substantivierte Pluraladjektiv רְשָׁעִים knapp und in würdigem Psalmregister wieder.
- source_word: שִׁבַּרְתָּ
  choice: hast du zerbrochen
  rationale: Die Perfektform und das kraftvolle konkrete Bild werden direkt wiedergegeben; die Voranstellung des Objekts bildet den poetischen Parallelismus natürlich ab.
theological_decisions:
- issue: Zeit- und Aspektwert der Perfektformen הִכִּיתָ und שִׁבַּרְתָּ im Gebet
  choice: 'Deutsches Perfekt: „du hast … geschlagen; … hast du zerbrochen“'
  alternative: 'Gewissheitsbezogene oder charakterisierende Wiedergabe im Präsens: „du schlägst …; du zerbrichst …“'
  rationale: Die Formen bezeichnen grammatisch eine als vollendet dargestellte Handlung, können im poetischen Gebet jedoch auch Gottes gewisses oder charakteristisches Eingreifen ausdrücken. Der Haupttext folgt der naheliegenden perfektiven Wiedergabe, während die Fußnote die weitere Deutungsmöglichkeit bewahrt.
- issue: Gewaltbild gegenüber den Feinden
  choice: Das Schlagen auf die Wange und das Zerbrechen der Zähne konkret beibehalten
  alternative: Abstrakt als Niederlage oder Entmachtung umschreiben
  rationale: Der hebräische Text verwendet bewusst drastische Körperbilder für Demütigung und Entmachtung. Eine Abschwächung würde die poetische Aussage verflachen.
translation_notes:
  register: Modernes, würdiges Psalmdeutsch mit unmittelbaren Imperativen und bewahrtem Parallelismus. „Frevler“ ist leicht gehoben, aber allgemein verständlich und für רְשָׁעִים prägnanter als eine umständliche Umschreibung. Der Fußnotenmarker steht unmittelbar nach der Aussage, auf die sich die alternative Aspekt- und Wortdeutung bezieht.
