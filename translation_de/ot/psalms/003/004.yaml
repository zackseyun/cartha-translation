source:
  edition: WLC
  text: ק֭וֹלִ/י אֶל יְהוָ֣ה אֶקְרָ֑א וַ/יַּֽעֲנֵ֨/נִי מֵ/הַ֖ר קָדְשׁ֣/וֹ סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/004.yaml
  text: With my voice I cry to Yahweh[a], and he answers me from his holy mountain[b]. Selah
translation:
  language: de
  text: Mit meiner Stimme rufe ich zu Jahwe, und er antwortet mir[a] von seinem heiligen Berg[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und er antwortete mir“. Das hebräische Verb kann im Zusammenhang auch als Vergangenheit wiedergegeben werden.'
    reason: alternative_reading
  - marker: b
    text: Traditionell wird auch „von seinem heiligen Hügel“ übersetzt. Das hebräische Wort bedeutet grundlegender „Berg“ und bezieht sich hier wahrscheinlich auf den Zion.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֭וֹלִי
  choice: Mit meiner Stimme
  rationale: Die vorangestellte Wendung gibt das hebräische Substantiv mit Suffix („meine Stimme“) und seinen instrumentalen Sinn möglichst unmittelbar und zugleich natürlich wieder.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier die Ausrichtung des Rufens an Jahwe; „zu“ ist im Deutschen idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: אֶקְרָא
  choice: rufe ich
  rationale: קרא bezeichnet hier das hörbare, im Gebet an Gott gerichtete Rufen. Zusammen mit „Mit meiner Stimme“ ist „rufe ich“ natürlich und vermeidet eine unnötige emotionale Präzisierung.
- source_word: וַיַּעֲנֵנִי
  choice: und er antwortet mir
  rationale: Das Präsens bringt die lebendige bzw. vertrauensvolle Aussage des Psalms gut zum Ausdruck. Wegen der Form des hebräischen Verbs bleibt die Wiedergabe in der Vergangenheit ebenfalls möglich und wird in einer Fußnote genannt.
- source_word: מֵהַר קָדְשׁוֹ
  choice: von seinem heiligen Berg
  rationale: הַר bedeutet grundlegend „Berg“. Gemeint ist wahrscheinlich der Zion, doch diese Identifizierung wird nicht in den Haupttext hineingetragen.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und Funktion des Ausdrucks nicht sicher geklärt sind, ist eine Transliteration am wenigsten deutend.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Seine Wiedergabe als „Jahwe“ bewahrt diese Eigenname-Funktion, ohne ihn durch einen Titel zu ersetzen.
- issue: Zeit- und Aspektwert von וַיַּעֲנֵנִי in der Poesie
  choice: 'Präsens: „er antwortet mir“'
  alternative: 'Vergangenheit: „er antwortete mir“'
  rationale: Das Präsens erhält die Unmittelbarkeit und kann das zuversichtliche, charakteristische Erleben des Beters ausdrücken. Die formal naheliegende Vergangenheitswiedergabe bleibt jedoch möglich und wird ausdrücklich offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Satzstellung wird mit der vorangestellten Wendung „Mit meiner Stimme“ weitgehend bewahrt. „Jahwe“ entspricht der geläufigen deutschen Form des Gottesnamens; „Sela“ bleibt wegen seiner unsicheren Bedeutung unübersetzt.
