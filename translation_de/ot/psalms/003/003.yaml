  source_fidelity: Die Übersetzung gibt die starke kontrastive Anrede ("Doch du"), den Gottesnamen, das Bild des Schildes, die dichte Prädikation "meine Herrlichkeit" und das partizipiale Bild des Kopfaufrichtens sachgerecht wieder. "Um mich her" ist eine im Kontext gut vertretbare bildliche Auslegung von בַּעֲדִי und wird durch die Fußnote angemessen als nicht einzige mögliche Nuance kenntlich gemacht.
