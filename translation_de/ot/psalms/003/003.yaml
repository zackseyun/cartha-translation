id: PSA.3.3
reference: Psalms 3:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה מָגֵ֣ן בַּעֲדִ֑/י כְּ֝בוֹדִ֗/י וּ/מֵרִ֥ים רֹאשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/003.yaml
  text: But you[a], O Yahweh, are a shield around me, my glory[b], and the one who lifts up my head.
translation:
  language: de
  text: Doch du, Jahwe, bist ein Schild um mich her[a], meine Herrlichkeit und der, der meinen Kopf aufrichtet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „ein Schild für mich“ oder „ein Schild zu meinem Schutz“. Die hebräische Präposition kann Schutz zugunsten einer Person ausdrücken; hier legt die Verbindung mit „Schild“ das Bild schützender Umhüllung nahe.'
    reason: lexical_alternative
  - marker: b
    text: „Den Kopf aufrichten“ ist ein hebräisches Bild für die Wiederherstellung von Würde und Zuversicht oder für Rechtfertigung.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Doch du
  rationale: Die Konjunktion zusammen mit dem selbstständigen Pronomen setzt einen starken Gegensatz zur vorausgehenden Bedrängnis; „Doch du“ gibt zugleich die Hervorhebung des Angeredeten wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מָגֵן
  choice: ein Schild
  rationale: Das Substantiv bezeichnet einen Schutzschild; im deutschen Prädikatsnomen steht natürlich der unbestimmte Artikel.
- source_word: בַּעֲדִי
  choice: um mich her
  rationale: Die Präposition kann Schutz zugunsten einer Person ausdrücken; in Verbindung mit „Schild“ liegt hier das räumliche Bild umfassenden Schutzes nahe, ohne dass alternative Nuancen ausgeschlossen werden.
- source_word: כְּבוֹדִי
  choice: meine Herrlichkeit
  rationale: כבוד kann Herrlichkeit, Ehre oder Würde bezeichnen. „Meine Herrlichkeit“ bewahrt die knappe, poetische Aussage, dass Jahwe selbst die Herrlichkeit und Würde des Beters ist.
- source_word: וּ/מֵרִים רֹאשִׁי
  choice: und der, der meinen Kopf aufrichtet
  rationale: Das Partizip beschreibt ein kennzeichnendes beziehungsweise fortdauerndes Handeln. „Den Kopf aufrichten“ hält das konkrete hebräische Bild fest und klingt zugleich in modernem Deutsch natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Seine Wiedergabe als „Jahwe“ bewahrt den Charakter als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von „meinen Kopf aufrichtet“
  choice: Das konkrete Bild im Haupttext bewahren
  alternative: meine Würde wiederherstellt; mir neuen Mut gibt; mich zu Ehren bringt
  rationale: Das Bild kann Wiederherstellung von Würde, Zuversicht oder Rechtfertigung bezeichnen. Die wörtlich-bildhafte Form lässt diese Bedeutungsbreite offen, statt sie auf eine einzige Auslegung zu verengen.
- issue: Deutung von כְּבוֹדִי
  choice: meine Herrlichkeit
  alternative: meine Ehre; meine Würde
  rationale: Die gewählte Form bewahrt die theologisch und poetisch dichte Identifikation Jahwes mit der Herrlichkeit des Beters; „Ehre“ oder „Würde“ wären mögliche, aber enger deutende Wiedergaben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. „Kopf“ ist gegenwärtiger als „Haupt“, bewahrt aber das konkrete Körperbild. Die leicht ungewöhnliche Wendung „meine Herrlichkeit“ entspricht bewusst der Dichte des Hebräischen.
