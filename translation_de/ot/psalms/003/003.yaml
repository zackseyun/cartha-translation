  terminology: '"Jahwe" entspricht der vorgegebenen Wiedergabe des Tetragramms. "Herrlichkeit" bewahrt die Mehrdeutigkeit von כְּבוֹדִי besser als eine einengende Wiedergabe mit "Ehre" oder "Würde". Die Fußnoten erläutern die Präpositionsnuance und die kulturelle Bildsprache ohne den Haupttext dogmatisch festzulegen.'
