  text: אֲנִ֥י שָׁכַ֗בְתִּי וָֽ/אִ֫ישָׁ֥נָ/ה הֱקִיצ֑וֹתִי כִּ֖י יְהוָ֣ה יִסְמְכֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/005.yaml
  text: I lay down and slept[a]; I awoke[b], because Yahweh sustains me.
translation:
  language: de
  text: Ich legte mich hin und schlief; ich wachte auf, denn Jahwe stützt mich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird mich stützen“; auch: „hält mich aufrecht“.'
    reason: Die hebräische Verbform und das Bedeutungsspektrum von סמך lassen sowohl eine gegenwärtig-fortdauernde als auch eine zukünftige Wiedergabe zu.
lexical_decisions:
- source_word: שָׁכַבְתִּי
  choice: Ich legte mich hin
  rationale: Das Verb bezeichnet hier das Sich-Niederlegen und eröffnet natürlich die Abfolge von Hinlegen, Schlafen und Erwachen.
- source_word: וָאִישָׁנָה
  choice: und schlief
  rationale: Die Form von ישׁן bedeutet schlicht „schlafen“; im Deutschen kann das Subjekt in der knappen poetischen Reihung unausgesprochen bleiben.
- source_word: הֱקִיצוֹתִי
  choice: ich wachte wieder auf
  rationale: Die intransitive Bedeutung „aufwachen“ passt zum Sprecher; „wieder“ gibt idiomatisch das Erwachen nach dem Schlaf wieder, ohne ein zusätzliches theologisches Motiv einzutragen.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet das sichere Erwachen. „Denn“ wahrt den poetischen Zusammenhang und die kausale Aussage.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen; „Jahwe“ gibt ihn wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: יִסְמְכֵנִי
  choice: stützt mich
  rationale: סמך bezeichnet Stützen, Tragen oder Aufrechterhalten. „Stützt mich“ ist unmittelbar verständlich und bewahrt das konkrete Bild.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen; die Transliteration bewahrt diese Unterscheidung gegenüber dem Titel אֲדֹנָי.
- issue: Zeitlicher bzw. aspektueller Wert von יִסְמְכֵנִי
  choice: stützt mich
  alternative: wird mich stützen
  rationale: Die Präformativkonjugation kann je nach Zusammenhang gegenwärtig-andauernd oder zukünftig verstanden werden. Im Rückblick auf Schlaf und Erwachen bezeichnet sie am natürlichsten Jahwes fortdauernde Stütze; die Zukunftsnuance bleibt als Alternative möglich.
translation_notes:
  register: Knappe, würdige und gegenwärtige Standardsprache mit erhaltener poetischer Dreierfolge. Das Semikolon bildet den Übergang vom Schlaf zum Erwachen ab; „denn“ leitet die Begründung ein.
