base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/000.yaml
  text: A psalm of David[a], when he fled from Absalom his son.
translation:
  language: de
  text: Ein Psalm Davids[a], als er vor seinem Sohn Abschalom floh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »von David« beziehungsweise »für David«; die hebräische Überschrift kann Urheberschaft, Widmung oder Zuordnung bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Etablierte und im kanonischen Kontext präzise deutsche Bezeichnung für eine musikalisch-poetische Komposition.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der deutsche Genitiv bewahrt wie die hebräische Präposition לְ eine gewisse Offenheit zwischen Urheberschaft, Zugehörigkeit und Zuordnung.
- source_word: בְּבָרְחוֹ
  choice: als er … floh
  rationale: Die Präposition בְּ mit Infinitivus constructus und Suffix hat hier temporale Bedeutung; die gewählte Formulierung ist natürliches Deutsch.
- source_word: מִפְּנֵי
  choice: vor
  rationale: Beim Verb »fliehen« gibt »vor« die idiomatische Bedeutung des hebräischen Ausdrucks wieder, ohne die wörtliche Wendung »vom Angesicht« nachzubilden.
- source_word: אַבְשָׁלוֹם
  choice: Abschalom
  rationale: Gebräuchliche deutsche Transkription des hebräischen Personennamens.
- source_word: בְּנוֹ
  choice: seinem Sohn
  rationale: Gibt das Nomen mit Suffix unmittelbar wieder und bewahrt die in der Überschrift hervorgehobene familiäre Beziehung.
theological_decisions:
- issue: Bedeutung der davidischen Psalmüberschrift
  choice: »Davids« als mehrdeutige Zuordnung beibehalten
  alternative: »von David« oder »für David«
  rationale: לְדָוִד kann in Psalmüberschriften Urheberschaft, Widmung, Zugehörigkeit oder Verbindung ausdrücken. Der Genitiv legt sich nicht unnötig auf nur eine Deutung fest.
translation_notes:
  register: Moderne, würdige Standardsprache. Die traditionelle Gattungsbezeichnung »Psalm« und die im Deutschen geläufige Namensform »Abschalom« dienen der unmittelbaren Verständlichkeit; die knappe Form entspricht einer Psalmüberschrift.
