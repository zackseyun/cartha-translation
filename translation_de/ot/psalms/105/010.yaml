  text: He confirmed it to Jacob as a statute[b][a], to Israel as an everlasting covenant.
translation:
  language: de
  text: Er setzte dies für Jakob als Satzung fest[a], für Israel als ewigen Bund[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er bestätigte dies“ oder „Er stellte dies auf“. Das hebräische Verb kann ausdrücken, dass etwas festen Bestand erhält.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als immerwährenden Bund“ oder „als unbefristeten Bund“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: Er setzte dies … fest
  rationale: Die Hifil-Form von עמד bedeutet hier, etwas Bestand gewinnen zu lassen, also es festzusetzen, aufzurichten oder zu bestätigen. „Festsetzen“ gibt den verbindlichen Charakter natürlich und prägnant wieder; „dies“ bewahrt den Rückbezug, ohne dessen genauen Bezug vorschnell festzulegen.
- source_word: לְיַעֲקֹב
  choice: für Jakob
  rationale: Die Präposition ל bezeichnet hier den Empfänger beziehungsweise Begünstigten. Im Deutschen klingt „für Jakob“ in Verbindung mit „als Satzung festsetzen“ natürlicher als „Jakob“ mit einem Dativobjekt.
- source_word: לְחֹק
  choice: als Satzung
  rationale: חֹק bezeichnet eine verbindlich festgelegte Bestimmung. „Satzung“ bewahrt den rechtlich-bundesbezogenen Klang und passt zum poetischen Register.
- source_word: לְיִשְׂרָאֵל
  choice: für Israel
  rationale: Die Wiedergabe entspricht der parallelen Formulierung „für Jakob“ und erhält den poetischen Parallelismus.
- source_word: בְּרִית עוֹלָם
  choice: als ewigen Bund
  rationale: בְּרִית ist der übliche Ausdruck für „Bund“. עוֹלָם bezeichnet hier unbegrenzte beziehungsweise fortdauernde Geltung; „ewiger Bund“ ist im Deutschen klar, würdig und geläufig.
theological_decisions:
- issue: Bezug des femininen Suffixes in וַיַּעֲמִידֶהָ
  choice: Der Rückbezug wird mit „dies“ offen gehalten.
  alternative: Das Suffix ausdrücklich auf den Bund, die Zusage oder den Eid im vorausgehenden Zusammenhang beziehen.
  rationale: Der Kontext nennt Bund, zugesagtes Wort und Eid. Das neutrale „dies“ wahrt den anaphorischen Bezug, ohne einen dieser eng verbundenen Begriffe allein als Referenten festzulegen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer poetischer Parallelstruktur. „Satzung“ wahrt den rechtlich-bundesbezogenen Ton, ohne altertümliche Syntax zu verwenden.
