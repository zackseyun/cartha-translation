  text: הָפַ֣ךְ לִ֭בָּ/ם לִ/שְׂנֹ֣א עַמּ֑/וֹ לְ֝/הִתְנַכֵּ֗ל בַּ/עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/025.yaml
  text: He turned their heart to hate his people[b][a], to deal deceitfully with his servants.
translation:
  language: de
  text: Er wandte ihr Herz dahin, sein Volk zu hassen und gegen seine Diener heimtückisch vorzugehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und gegen seine Diener arglistig zu handeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפַךְ
  choice: wandte … dahin
  rationale: Das Verb bedeutet „wenden, verwandeln, umkehren“. Mit „Herz“ und den folgenden Infinitiven bewahrt „wandte … dahin“ die unmittelbare göttliche Verursachung und klingt im Deutschen natürlich.
- source_word: לִבָּם
  choice: ihr Herz
  rationale: Der hebräische Singular mit Pluralsuffix ist eine kollektive Ausdrucksweise. Der Singular „ihr Herz“ erhält sowohl die Form als auch die Vorstellung einer gemeinsamen inneren Haltung.
- source_word: לִשְׂנֹא
  choice: sein Volk zu hassen
  rationale: Der Infinitiv kann Ziel oder Folge bezeichnen. Die deutsche Infinitivkonstruktion wahrt diese Offenheit, ohne sie durch „damit“ oder „sodass“ festzulegen.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: עַם bezeichnet hier das dem HERRN zugehörige Volk Israel; „sein Volk“ ist die sachlich und stilistisch passende Wiedergabe.
- source_word: לְהִתְנַכֵּל
  choice: heimtückisch vorzugehen
  rationale: Der Hitpael von נכל bezeichnet listiges, arglistiges oder betrügerisches Handeln mit feindlicher Absicht. „Heimtückisch vorgehen“ verbindet die List mit der gegen die Diener gerichteten Feindseligkeit.
- source_word: בַּעֲבָדָיו
  choice: gegen seine Diener
  rationale: בְּ bezeichnet bei diesem Verb die von dem listigen Vorgehen Betroffenen. Im Deutschen ist daher „gegen“ idiomatischer als ein formales „mit“. עֶבֶד wird im Kontext der Zugehörigkeit zu Gott angemessen mit „Diener“ wiedergegeben.
theological_decisions:
- issue: Göttliches Handeln beim Wandel der ägyptischen Haltung
  choice: Die direkte Aussage „Er wandte ihr Herz“ bleibt erhalten.
  alternative: „Er ließ ihr Herz sich wenden“ oder eine unpersönliche Passivform.
  rationale: Das hebräische Verb steht aktiv; Gott ist aus dem Zusammenhang das Subjekt. Die Übersetzung schwächt seine unmittelbare Wirksamkeit nicht ab und lässt die Spannung zwischen göttlicher Souveränität und menschlicher Feindschaft bestehen.
- issue: Ziel oder Folge der Wendung
  choice: Die Infinitive werden als „… dahin, … zu … und …“ wiedergegeben.
  alternative: 'Explizit final: „damit sie …“; explizit konsekutiv: „sodass sie …“.'
  rationale: Die hebräischen לְ-Infinitive können Ziel beziehungsweise Folge ausdrücken. Die deutsche Fassung legt die Beziehung nicht enger fest, als es der Ausgangstext tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kollektive Singular „ihr Herz“ wird bewusst bewahrt; „heimtückisch vorgehen“ ist verständlich und gibt die feindliche List des hebräischen Verbs wieder.
