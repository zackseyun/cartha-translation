  yaml_path: translation/ot/psalms/105/037.yaml
  text: He brought them out with silver and gold[a], and among his tribes there was no one who stumbled.
translation:
  language: de
  text: Er führte sie mit Silber und Gold heraus, und unter den Stämmen Israels war keiner, der strauchelte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und unter den Stämmen Israels war keiner schwach.“ Das hebräische Partizip kann Straucheln, Wanken oder Schwäche bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: Er führte sie … heraus
  rationale: Der Hifil von יצא bezeichnet das Herausführen beziehungsweise Herausbringen. „Führte … heraus“ klingt im Deutschen natürlich und bewahrt Gottes handelnde Rolle beim Exodus.
- source_word: בְּכֶסֶף וְזָהָב
  choice: mit Silber und Gold
  rationale: 'Die Präposition ב bezeichnet hier Begleitung beziehungsweise Besitz: Israel zog im Besitz von Silber und Gold aus, ohne dass die Übersetzung eine Beladung oder Menge hinzufügt.'
- source_word: וְאֵין
  choice: und … war keiner
  rationale: Das hebräische Existenzwort אַיִן wird in dieser negativen Konstruktion idiomatisch mit „war keiner“ wiedergegeben.
- source_word: בִּשְׁבָטָיו
  choice: unter seinen Stämmen
  rationale: שֵׁבֶט bedeutet hier „Stamm“. Der maskuline Singularsuffix wird als „seinen“ bewahrt und bezieht sich im poetischen Zusammenhang auf Israel als kollektive Einheit.
- source_word: כּוֹשֵׁל
  choice: der strauchelte
  rationale: Das Partizip von כשל kann körperliches Straucheln, Wanken oder Schwachsein bezeichnen. „Der strauchelte“ erhält das konkrete Bild; die mögliche Bedeutung „schwach“ wird in der Fußnote genannt.
theological_decisions:
- issue: Bezug des Singularsuffixes in „seinen Stämmen“
  choice: Der Singular wird als „seinen Stämmen“ beibehalten und auf Israel/Jakob als kollektive Person bezogen.
  alternative: „unter ihren Stämmen“ oder „unter Israels Stämmen“
  rationale: Der hebräische Text hat einen maskulinen Singularsuffix. Seine Beibehaltung wahrt die poetische Darstellung Israels als kollektive Einheit, ohne eine lehrmäßige Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der hebräischen Parallelstruktur, während die Stellung von „mit Silber und Gold“ im Deutschen natürlich gestaltet ist.
