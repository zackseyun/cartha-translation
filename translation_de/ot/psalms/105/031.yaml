  text: אָ֭מַר וַ/יָּבֹ֣א עָרֹ֑ב כִּ֝נִּ֗ים בְּ/כָל גְּבוּלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/031.yaml
  text: He spoke[a], and swarms of flies came[c][b], and gnats throughout all their territory.
translation:
  language: de
  text: Er sprach, und Fliegenschwärme kamen[a] und Mücken[b] im ganzen Gebiet der Ägypter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Insektenschwärme kamen«; welche Insekten mit dem hebräischen Wort genau gemeint sind, ist unsicher. Traditionell wird es als Schwarm von Fliegen verstanden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Läuse« oder »Stechmücken«; die genaue Bestimmung des hebräischen Wortes ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: Er sprach
  rationale: Das Verb bedeutet schlicht »sagen/sprechen«. »Er sprach« bewahrt die knappe Formel vom wirksamen göttlichen Sprechen, ohne den nicht ausdrücklich genannten Sinn »befehlen« einzutragen.
- source_word: וַיָּבֹא
  choice: kamen
  rationale: Die Form erzählt das Eintreffen der Plage. Der deutsche Plural richtet sich natürlich nach »Fliegenschwärme«.
- source_word: עָרֹב
  choice: Fliegenschwärme
  rationale: Im Zusammenhang der ägyptischen Plagen bezeichnet das Wort herkömmlich Insektenschwärme, meist Fliegen. Die genaue Tierart bleibt jedoch unsicher und wird in einer Fußnote offengehalten.
- source_word: כִּנִּים
  choice: Stechmücken
  rationale: Das Wort bezeichnet kleine lästige oder stechende Insekten, deren genaue Bestimmung unsicher ist. »Stechmücken« ist im heutigen Deutsch verständlich; »Läuse« und »Mücken« bleiben mögliche Alternativen.
- source_word: בְּכָל
  choice: im ganzen
  rationale: Die Wendung bringt die vollständige räumliche Ausbreitung zum Ausdruck.
- source_word: גְּבוּלָם
  choice: Gebiet der Ägypter
  rationale: גְּבוּל meint hier das gesamte Territorium, nicht nur seine Grenze. Das Possessivsuffix verweist im Kontext auf die Ägypter; die explizite Benennung vermeidet im isolierten Vers ein unklares »ihr«.
theological_decisions:
- issue: Wirksamkeit des göttlichen Sprechens
  choice: »Er sprach«
  alternative: »Er befahl«
  rationale: Der knappe Wortlaut lässt Gottes Sprechen unmittelbar von der eintretenden Plage gefolgt sein, verwendet aber kein ausdrückliches Verb für »befehlen«. Daher wird die theologische Wirkung nicht durch eine interpretierende Ergänzung festgelegt.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzführung. »Dazu« macht die beiden Plagen als parallele, eigenständige Erscheinungen kenntlich. Alle Fußnotenmarker stehen unmittelbar bei den betroffenen Ausdrücken.
