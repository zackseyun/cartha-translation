source:
  edition: WLC
  text: אַֽל תִּגְּע֥וּ בִ/מְשִׁיחָ֑/י וְ֝/לִ/נְבִיאַ/י אַל תָּרֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/015.yaml
  text: Do not touch my anointed ones[a], and do my prophets no harm.
translation:
  language: de
  text: »Tastet meine Gesalbten[a] nicht an, und tut meinen Propheten nichts Böses!«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch »meine Gesalbten«. Das zugrunde liegende Wort ist mit »Messias« verwandt; hier steht es jedoch im Plural und bezeichnet von Gott ausgesonderte Menschen, nicht ausdrücklich den einen Messias.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: tastet … nicht an
  rationale: נגע bedeutet grundlegend »berühren, anrühren« und kann je nach Zusammenhang auch einen feindlichen Übergriff bezeichnen. »Nicht antasten« bewahrt die knappe idiomatische Weite des Verbots, ohne es auf körperliche Gewalt zu verengen.
- source_word: בִמְשִׁיחָי
  choice: meine Gesalbten
  rationale: מָשִׁיחַ bezeichnet einen »Gesalbten«. Die Form steht im Plural mit Suffix der ersten Person Singular; daher ist »meine Gesalbten« grammatisch und sachlich angemessen.
- source_word: לִנְבִיאַי
  choice: meinen Propheten
  rationale: נָבִיא bedeutet »Prophet«; hier steht das Wort im Plural mit Suffix der ersten Person Singular.
- source_word: תָּרֵעוּ
  choice: tut … nichts Böses
  rationale: Das Hifil von רעע bezeichnet hier, jemandem Böses beziehungsweise Schaden zuzufügen. »Tut … nichts Böses« bildet die hebräische Ausdrucksweise eng ab und klingt im poetischen Parallelismus natürlich.
- source_word: אַל
  choice: nicht / nichts
  rationale: אַל mit Imperfekt drückt in beiden Vershälften ein Verbot aus. Die deutschen Formulierungen geben diesen prohibitiven Sinn direkt wieder.
theological_decisions:
- issue: Wiedergabe von מְשִׁיחַ in einem nicht spezifisch messianischen Pluralkontext
  choice: Gesalbte
  alternative: Messiasse
  rationale: Der hebräische Ausdruck steht im Plural und meint hier von Gott ausgesonderte Personen im Rückblick auf Israels Geschichte, nicht ausdrücklich den einen endzeitlichen Messias. »Gesalbte« bewahrt den Wortsinn, ohne eine unzutreffende christologische Eindeutigkeit einzutragen.
translation_notes:
  register: Moderne, würdige poetische Sprache. Der Parallelismus der beiden Verbote bleibt erhalten; »antasten« wahrt die idiomatische Mehrdeutigkeit zwischen Berühren und feindlichem Übergriff.
