id: PSA.105.23
reference: Psalms 105:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּבֹ֣א יִשְׂרָאֵ֣ל מִצְרָ֑יִם וְ֝/יַעֲקֹ֗ב גָּ֣ר בְּ/אֶֽרֶץ חָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/023.yaml
  text: Then Israel came to Egypt[b][a], and Jacob lived as a foreigner in the land of Ham.
translation:
  language: de
  text: Da kam Israel nach Ägypten, und Jakob lebte als Fremder im Land Hams.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Das Land Hams“ ist eine poetische Bezeichnung für Ägypten.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kam
  rationale: Das Qal-Wayyiqtol von בוא führt die geschichtliche Folge weiter. „Da kam“ gibt den narrativen Anschluss in gehobenem, aber verständlichem Deutsch wieder.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bleibt erhalten; zusammen mit „Jakob“ bewahrt er den poetischen Parallelismus des hebräischen Textes.
- source_word: מִצְרָיִם
  choice: nach Ägypten
  rationale: Standarddeutsche Wiedergabe des Ortsnamens; bei einer Bewegung wird die hebräische Zielangabe idiomatisch mit „nach“ ausgedrückt.
- source_word: וְיַעֲקֹב
  choice: und Jakob
  rationale: Der Eigenname wird nicht durch ein Pronomen ersetzt, damit die parallele Benennung als „Israel“ und „Jakob“ sichtbar bleibt.
- source_word: גָּר
  choice: lebte als Fremder
  rationale: גור bezeichnet den Aufenthalt als Nicht-Einheimischer bzw. Schutzbürger. „Lebte als Fremder“ vermittelt Wohnsitz und Fremdenstatus in natürlichem modernem Deutsch.
- source_word: בְּאֶרֶץ חָם
  choice: im Land Hams
  rationale: Die poetische Bezeichnung für Ägypten wird formal bewahrt; der deutsche Genitiv „Hams“ ist knapp und idiomatisch.
theological_decisions:
- issue: Soll der poetische Parallelismus „Israel // Jakob“ auf einen einzigen Namen reduziert werden?
  choice: Beide Namen im Haupttext bewahren
  alternative: Nur „Jakob“ oder nur „Israel“ nennen
  rationale: Der hebräische Vers bezeichnet denselben Patriarchen beziehungsweise das in ihm repräsentierte Volk mit beiden Namen. Die Wiedergabe bewahrt diese poetische und mögliche repräsentative Spannung, ohne sie weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da kam“ wahrt den erzählenden Fortgang; „lebte als Fremder“ vermeidet das heute gehobene und weniger klare „weilte“ beziehungsweise „hielt sich als Fremder auf“. Der Fußnotenmarker steht unmittelbar bei der erklärungsbedürftigen Wendung.
