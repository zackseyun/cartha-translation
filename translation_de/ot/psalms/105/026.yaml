  text: שָׁ֭לַח מֹשֶׁ֣ה עַבְדּ֑/וֹ אַ֝הֲרֹ֗ן אֲשֶׁ֣ר בָּֽחַר בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/026.yaml
  text: He sent Moses his servant[a], Aaron whom he had chosen.
translation:
  language: de
  text: Er sandte Mose, seinen Diener, und Aaron, den er erwählt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den er erwählte“. Das hebräische Verb kann als einfache Vergangenheit wiedergegeben werden; „erwählt hatte“ verdeutlicht, dass Aarons Erwählung seinem Gesandtwerden vorausging.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: Er sandte
  rationale: Das Qal Perfekt 3. Person maskulin Singular bezeichnet Gottes Senden. „Er sandte“ wahrt das im Hebräischen unausgesprochene, aus dem Kontext erschließbare Subjekt und entspricht dem würdevollen poetischen Register.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Die im modernen Standarddeutsch etablierte Form des Eigennamens.
- source_word: עַבְדּוֹ
  choice: seinen Diener
  rationale: עֶבֶד mit Suffix der 3. Person maskulin Singular kann „Diener“ oder „Sklave“ bedeuten. Bei Mose ist „Diener“ hier die natürliche ehrende Bezeichnung und bewahrt den geläufigen biblischen Sprachgebrauch.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Die im Deutschen etablierte Form des Eigennamens.
- source_word: אֲשֶׁר
  choice: den
  rationale: Das Relativpronomen bezieht sich auf Aaron und steht im Deutschen als Objekt von „erwählen“ im Akkusativ.
- source_word: בָּחַר בּוֹ
  choice: den er erwählt hatte
  rationale: בחר mit ב bezeichnet die Wahl einer Person. Das Plusquamperfekt macht natürlich deutlich, dass Aarons Erwählung seinem Gesandtwerden vorausging; die mögliche Wiedergabe im Präteritum bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Unausgesprochenes Subjekt des Verbs
  choice: Das Subjekt wird als „Er“ wiedergegeben.
  alternative: „Der HERR sandte“ ausdrücklich ergänzen.
  rationale: Die maskuline Verbform im Singular verweist im Zusammenhang auf Gott. Das Pronomen bewahrt den hebräischen Erzählfluss, ohne einen in diesem Vers nicht ausdrücklich stehenden Gottesnamen einzufügen.
- issue: Verhältnis von Mose und Aaron zum Verb „senden“
  choice: Das deutsche „und“ macht deutlich, dass sowohl Mose als auch Aaron gesandt wurden.
  alternative: 'Ohne „und“ als appositionelle Reihung: „Mose, seinen Diener, Aaron ...“'
  rationale: Im Hebräischen stehen beide Namen ohne ausdrückliche Konjunktion als Objekte zu „sandte“. Im Deutschen verhindert „und“ eine missverständliche Apposition und gibt den Sinn natürlich wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Das ergänzte „und“ dient der natürlichen deutschen Koordination der beiden gesandten Personen; die zeitliche Nuance von בחר bleibt durch Text und Fußnote transparent.
