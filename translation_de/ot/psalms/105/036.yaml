  terminology: „Erstgeborene“ ist der etablierte Ausdruck. „Kraft“ ist für אוֹן eine angemessen offene Haupttextlösung; die Fußnote erschließt mit „Zeugungskraft“ die im Kontext naheliegende spezifischere Nuance, ohne sie dem Text aufzuzwingen. Der Fußnotenanker steht an der erklärungsbedürftigen Wendung.
