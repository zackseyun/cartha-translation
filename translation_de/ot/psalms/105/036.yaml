  source_fidelity: Der Text gibt וַיַּךְ angemessen mit „Er schlug“ wieder und bewahrt damit gegenüber dem kontextuell tödlichen Schlag die verbale Zurückhaltung des Hebräischen. „alle Erstgeborenen in ihrem Land“ entspricht כָּל־בְּכוֹר בְּאַרְצָם. Die Apposition „die Erstlinge ihrer ganzen Kraft“ trifft רֵאשִׁית לְכָל־אוֹנָם und erhält die poetische Metapher samt ihrer möglichen generativen Konnotation.
