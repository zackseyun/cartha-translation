id: PSA.105.36
reference: Psalms 105:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֣ךְ כָּל בְּכ֣וֹר בְּ/אַרְצָ֑/ם רֵ֝אשִׁ֗ית לְ/כָל אוֹנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/036.yaml
  text: He struck down every firstborn in their land[a], the firstfruits of all their strength.
translation:
  language: de
  text: Er schlug alle Erstgeborenen in ihrem Land, die Erstlinge ihrer ganzen Kraft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den ersten Ertrag ihrer ganzen Zeugungskraft«. Der hebräische Ausdruck bezeichnet die frühesten Nachkommen als erste Auswirkung der Kraft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Er schlug
  rationale: Die Hifil-Form von נכה bedeutet hier »schlagen«; der Zusammenhang mit dem Tod der Erstgeborenen macht die tödliche Folge deutlich, ohne sie im Verb ausdrücklich hinzuzufügen.
- source_word: כָּל בְּכוֹר
  choice: alle Erstgeborenen
  rationale: כָּל mit dem singularischen בְּכוֹר bezeichnet umfassend die Erstgeborenen. Der deutsche Plural ist natürlich und bewahrt den kollektiven Sinn.
- source_word: בְּאַרְצָם
  choice: in ihrem Land
  rationale: אַרְצָם bezeichnet ihr Land und erinnert im Zusammenhang an Ägypten als Schauplatz der Plagen.
- source_word: רֵאשִׁית
  choice: die Erstlinge
  rationale: רֵאשִׁית bezeichnet das Erste beziehungsweise den ersten Ertrag. »Erstlinge« gibt das Bild knapp wieder und steht hier als erläuternde Apposition zu den Erstgeborenen.
- source_word: לְכָל אוֹנָם
  choice: ihrer ganzen Kraft
  rationale: לְ bezeichnet hier die Zugehörigkeit; אוֹן kann Kraft, Lebenskraft oder Zeugungskraft meinen. »ganze Kraft« wahrt die Bildhaftigkeit und die mögliche prokreative Bedeutung, ohne sie im Haupttext festzulegen.
theological_decisions:
- issue: Unausgesprochenes Subjekt des Verbs
  choice: »Er« bezieht sich auf Gott
  alternative: Das Subjekt im Vers ausdrücklich als »Gott« benennen
  rationale: Das hebräische Verb hat ein unausgesprochenes maskulines Subjekt in der dritten Person Singular, das aus dem vorangehenden Zusammenhang als Gott erkennbar ist. »Er« bewahrt die Textgestalt, ohne zusätzliche Explizierung.
- issue: Bedeutung von אוֹן im Zusammenhang mit den Erstgeborenen
  choice: »Kraft« mit offengehaltener prokreativer Nebenbedeutung
  alternative: »Zeugungskraft«
  rationale: Das Wort kann allgemein Stärke oder Lebenskraft und in diesem Ausdruck besonders die zeugende Kraft bezeichnen. Die allgemeinere Wiedergabe erhält die poetische und theologische Spannung; die Fußnote erschließt die konkretere Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. »Erstlinge« ist leicht gehoben, aber im biblisch-poetischen Zusammenhang verständlich; die Fußnote erklärt die dichterische Wendung.
