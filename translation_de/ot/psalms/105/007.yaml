  - severity: low
    issue: „Rechtssprüche“ ist unnötig technisch und die Fußnotenalternative „sein Recht“ wechselt ohne Kennzeichnung in den Singular.
    rationale: „Urteile“ ist geläufiger und näher an der Grundbedeutung von מִשְׁפָּטִים; die Alternativen sollten den Plural bzw. die abstrakte Lesart präzise abbilden.
