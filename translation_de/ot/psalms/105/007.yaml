  yaml_path: translation/ot/psalms/105/007.yaml
  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: de
  text: Er ist Jahwe, unser Gott; auf der ganzen Erde ergehen seine Urteile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Rechtsordnungen“; möglicherweise: „sein Recht“ oder „seine Gerechtigkeit“. Das hebräische Wort kann Urteile, Rechtsbestimmungen oder Recht/Gerechtigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Er ist
  rationale: Das selbstständige Pronomen hebt das Subjekt hervor; im Deutschen wird die im Hebräischen nicht ausgedrückte Kopula natürlich ergänzt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Die Form mit dem Suffix der 1. Person Plural bedeutet unmittelbar „unser Gott“.
- source_word: בְּכָל הָאָרֶץ
  choice: auf der ganzen Erde
  rationale: Der Ausdruck ist hier räumlich und angesichts des universalen Zusammenhangs mit „Erde“ statt mit dem engeren „Land“ wiedergegeben.
- source_word: מִשְׁפָּטָיו
  choice: seine Rechtssprüche
  rationale: Das Wort kann richterliche Entscheidungen, Rechtsordnungen oder das Recht bezeichnen. „Rechtssprüche“ bewahrt den juristischen Sinn, ohne ausschließlich Gesetze oder konkrete Strafgerichte zu meinen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen ausdrücklich. „Jahwe“ bewahrt diesen Charakter und vermeidet die Ersetzung durch einen Titel.
- issue: Bedeutungsumfang von מִשְׁפָּטָיו
  choice: seine Rechtssprüche
  alternative: seine Rechtsordnungen; seine Gerichte; sein Recht
  rationale: Die Übersetzung lässt offen, ob vor allem Gottes Entscheidungen, Ordnungen oder richterliches Walten gemeint sind; die möglichen Bedeutungen werden in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des Hebräischen bleibt erhalten; der Gottesname steht unersetzt, und die Bedeutungsbreite des juristischen Ausdrucks wird nicht dogmatisch verengt.
