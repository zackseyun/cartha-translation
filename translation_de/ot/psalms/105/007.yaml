  source_fidelity: 'Die hebräische Syntax besteht aus zwei Nominalsätzen: „Er ist Jahwe, unser Gott; auf/in der ganzen Erde [sind] seine משפטים.“ Der Entwurf gibt die Aussage grundsätzlich treffend wieder. „gelten“ ist jedoch eine interpretierende explizite Ergänzung und verschiebt die knappe Ortsprädikation („auf der ganzen Erde“) zu einer Aussage über Geltungsbereich.'
  naturalness: '„Er ist Jahwe, unser Gott; auf der ganzen Erde sind seine Rechtssprüche“ ist verständlich, wirkt im Deutschen aber elliptisch und bei „Rechtssprüche“ etwas technisch. Die Fassung mit „seine Urteile ergehen auf der ganzen Erde“ ist natürlich und bewahrt den gerichtlichen Bezug, fügt jedoch ein Verb hinzu. Am engsten und idiomatisch bleibt: „Auf der ganzen Erde gelten seine Urteile.“'
  terminology: „Jahwe“ entspricht der festgelegten Wiedergabe von יהוה. Für מִשְׁפָּטָיו ist „Urteile“ im modernen Standarddeutsch unmittelbarer als „Rechtssprüche“ und wahrt die Mehrdeutigkeit zwischen gerichtlichen Entscheidungen und Rechtsnormen eher als „Rechtsordnungen“. Die Fußnote sollte keine ungenaue Alternative wie „sein Recht“ im Singular anbieten und die Optionen klar als mögliche Kontextnuancen kennzeichnen.
