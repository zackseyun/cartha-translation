base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/021.yaml
  text: He made him lord of his house[a], and ruler over all his possessions.
translation:
  language: de
  text: Er setzte ihn als Herrn über sein Haus ein[a] und als Herrscher über seinen ganzen Besitz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er machte ihn zum Herrn seines Hauses und zum Herrscher über alles, was ihm gehörte.«'
    reason: Lexikalische und syntaktische Alternative zu שָׂמוֹ, לְבֵיתוֹ und קִנְיָנוֹ.
lexical_decisions:
- source_word: שָׂמוֹ
  choice: Er setzte ihn … ein
  rationale: Das Qal Perfekt von שׂים/שׂוּם mit Objektsuffix bedeutet »ihn setzen/einsetzen«. Im Deutschen gibt »als … einsetzen« die Ernennung in eine Stellung natürlich und quellennah wieder.
- source_word: אָדוֹן
  choice: Herrn
  rationale: אָדוֹן bezeichnet hier den mit Autorität über einen Haushalt Betrauten. »Herr« bewahrt den gehobenen poetischen Ton und bildet eine klare Parallele zu »Herrscher«.
- source_word: לְבֵיתוֹ
  choice: über sein Haus
  rationale: Das ל bezeichnet in der Einsetzungskonstruktion den Zuständigkeitsbereich. »Über sein Haus« drückt die Autorität über den gesamten Haushalt im heutigen Deutsch eindeutig aus.
- source_word: וּמֹשֵׁל
  choice: und als Herrscher
  rationale: Das Partizip von משל bezeichnet jemanden, der Herrschaft ausübt. »Herrscher« wahrt die substantivische Parallelität zu »Herrn«.
- source_word: בְּכָל
  choice: über seinen ganzen
  rationale: Bei משל kennzeichnet ב den Bereich beziehungsweise Gegenstand der Herrschaft. Im Deutschen wird diese Beziehung idiomatisch mit »über« wiedergegeben; כָל wird durch »ganzen« ausgedrückt.
- source_word: קִנְיָנוֹ
  choice: Besitz
  rationale: קִנְיָן bezeichnet erworbenes Eigentum beziehungsweise Besitz. Der deutsche Kollektivbegriff »Besitz« umfasst Hausstand, Güter und Vermögen knapp und natürlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Parallelität. »Einsetzen« macht den Ernennungscharakter deutlich, ohne über den hebräischen Text hinauszugehen.
