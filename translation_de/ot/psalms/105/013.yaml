lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: sie zogen
  rationale: Der Hitpael von הלך bezeichnet hier ein wiederholtes Umherziehen. „Sie zogen“ ist im Deutschen natürlich und gibt die Ortswechsel der Erzväter im Kontext wieder, ohne zwingend Orientierungslosigkeit anzudeuten.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: von Volk zu Volk
  rationale: גּוֹי bezeichnet hier eine ethnisch-politische Gemeinschaft. „Von Volk zu Volk“ bewahrt die knappe Wiederholung und den Bewegungsausdruck des Hebräischen.
- source_word: מִמַּמְלָכָה
  choice: von einem Königreich
  rationale: Der unbestimmte Artikel macht die hebräische Wechselkonstruktion im Deutschen idiomatisch verständlich, ohne ein im Ausgangstext nicht vorhandenes Zahlwort besonders zu betonen.
- source_word: אֶל עַם אַחֵר
  choice: zu einem anderen Volk
  rationale: „Volk“ entspricht עַם als sozialer oder ethnischer Gemeinschaft, während „anderes“ אַחֵר ausdrücklich wiedergibt. Die Unterscheidung gegenüber מַמְלָכָה („Königreich“) bleibt erhalten.
