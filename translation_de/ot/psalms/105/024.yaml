source:
  edition: WLC
  text: וַ/יֶּ֣פֶר אֶת עַמּ֣/וֹ מְאֹ֑ד וַ֝/יַּֽעֲצִמֵ/הוּ מִ/צָּרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/024.yaml
  text: And he made his people very fruitful[b][a], and made them mightier than their adversaries.
translation:
  language: de
  text: Er ließ sein Volk sehr zahlreich werden[a] und machte es stärker als seine Bedränger.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er machte sein Volk überaus fruchtbar.“ Das hebräische Verb kann Fruchtbarkeit oder starke Vermehrung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich stehen im Hebräischen singularische Pronomen: „machte es stärker als seine Bedränger“; sie beziehen sich auf das als Einheit verstandene Volk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּפֶר
  choice: ließ … zahlreich werden
  rationale: Die Hifil-Form von פרה bezeichnet ein Bewirken von Fruchtbarkeit oder Vermehrung. Im Deutschen gibt „ließ … zahlreich werden“ den gemeinten starken zahlenmäßigen Zuwachs natürlich wieder; die Bildsprache der Fruchtbarkeit bleibt als Alternative in der Fußnote erhalten.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: עַם bezeichnet hier Gottes Volk als kollektive nationale Größe. „Sein Volk“ ist im Kontext des Psalms klar und idiomatisch.
- source_word: מְאֹד
  choice: sehr
  rationale: Das Adverb verstärkt das Ausmaß der Vermehrung. „Sehr“ gibt dies knapp und unmittelbar wieder.
- source_word: וַיַּעֲצִמֵהוּ
  choice: machte es stärker
  rationale: Die Hifil-Form von עצם bedeutet hier „stark machen“. Die Vergleichsform ergibt sich aus der folgenden מן-Konstruktion. Das singularische „es“ entspricht sowohl dem hebräischen Suffix als auch dem deutschen Bezugswort „Volk“.
- source_word: מִצָּרָיו
  choice: als seine Bedränger
  rationale: צַר kann Feind, Gegner oder Bedränger bezeichnen. „Bedränger“ passt zum ägyptischen Unterdrückungskontext, ohne die Bedeutung auf eine einzelne Form der Feindschaft zu verengen; das Pronomen bezieht sich auf das kollektiv-singularische „Volk“.
theological_decisions:
- issue: Kollektivsingular und pronominaler Rückbezug
  choice: Das hebräische Kollektiv „sein Volk“ wird mit den singularischen deutschen Formen „es“ und „seine“ wieder aufgenommen.
  alternative: 'Pluralischer Rückbezug: „machte sie stärker als ihre Bedränger“.'
  rationale: Anders als im Englischen ist der singularische Rückbezug im Deutschen natürlich und entspricht zugleich unmittelbar den singularischen hebräischen Suffixen. Die Entscheidung ist grammatisch und trägt keine zusätzliche theologische Deutung ein.
- issue: Bedeutung von וַיֶּפֶר
  choice: Der im Kontext hervortretende Zuwachs wird im Haupttext mit „ließ … zahlreich werden“ ausgedrückt.
  alternative: „machte sein Volk sehr fruchtbar“.
  rationale: Das Verb bewahrt eine echte Bedeutungsbreite zwischen Fruchtbarkeit und Vermehrung. Der Exodus-Kontext legt zahlenmäßigen Zuwachs nahe, doch die wörtlichere Bildsprache wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zahlreich werden“ ist allgemein verständlich; „Bedränger“ bewahrt den feindlichen und unterdrückenden Sinn des Kontextes. Die singularischen Pronomen sind im Deutschen idiomatisch und quellennah.
