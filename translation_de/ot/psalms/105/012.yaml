  text: בִּֽ֭/הְיוֹתָ/ם מְתֵ֣י מִסְפָּ֑ר כִּ֝/מְעַ֗ט וְ/גָרִ֥ים בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/012.yaml
  text: When they were few in number[a], very few, and sojourners in it,
translation:
  language: de
  text: Als sie nur wenige waren, sehr wenige, und als Fremde darin lebten,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּהְיוֹתָם
  choice: Als sie … waren
  rationale: Die Präposition ב mit dem Infinitivus constructus von היה und dem Suffix der 3. Person Plural leitet einen temporalen Nebensatz ein. „Als sie … waren“ ist im Deutschen natürlich und gibt den zeitlichen Bezug genau wieder.
- source_word: מְתֵי מִסְפָּר
  choice: nur wenige
  rationale: Die hebräische Wendung bezeichnet eine kleine, leicht zählbare Personenzahl. „Nur wenige“ gibt den idiomatischen Sinn knapp und natürlich wieder.
- source_word: כִּמְעַט
  choice: sehr wenige
  rationale: Im Kontext verstärkt die Wendung die unmittelbar vorausgehende Aussage über ihre geringe Zahl. „Sehr wenige“ bewahrt diese Nachdrücklichkeit.
- source_word: וְגָרִים
  choice: und als Fremde … lebten
  rationale: Das Partizip von גור bezeichnet Menschen, die sich als Nichtansässige beziehungsweise ohne eigenes Heimatrecht in einem fremden Land aufhalten. Die verbale Formulierung ist modernes, verständliches Deutsch und wahrt diesen sozialen Sinn.
- source_word: בָּהּ
  choice: darin
  rationale: Das feminine Singularsuffix verweist auf das im Kontext genannte Land. „Darin“ erhält den pronominalen Rückverweis des Hebräischen, ohne den Referenten eigenmächtig einzusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Steigerung „nur wenige, sehr wenige“ bildet die hebräische Hervorhebung nach. „Fremde“ ist hier nicht bloß im Sinn unbekannter Personen gemeint, sondern als Menschen, die in einem Land leben, das ihnen nicht gehört; im unmittelbaren Kontext ist diese Bedeutung ausreichend klar.
