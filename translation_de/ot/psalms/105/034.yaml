base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/034.yaml
  text: He spoke[a], and locusts came—young locusts without number.
translation:
  language: de
  text: Er sprach, da kamen Heuschrecken und junge Heuschrecken ohne Zahl.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er sprach, da kamen Heuschrecken und Fresser ohne Zahl.“ Das hebräische Wort יֶלֶק bezeichnet ein erntevernichtendes Insekt, wahrscheinlich eine Entwicklungsstufe oder Art der Heuschrecke; ältere Übersetzungen geben es mit „Raupe“ wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: Er sprach
  rationale: Das Verb bedeutet schlicht „sagen/sprechen“. „Er sprach“ bewahrt knapp den Zusammenhang zwischen Gottes Wort und dem folgenden Geschehen, ohne die stärkere Bedeutung „Er befahl“ einzutragen.
- source_word: וַיָּבֹא
  choice: da kamen
  rationale: Die Form erzählt das Eintreffen der Plage. „Da kamen“ gibt die unmittelbare Abfolge nach Gottes Sprechen natürlich und würdig wieder.
- source_word: אַרְבֶּה
  choice: Heuschrecken
  rationale: Das formal singularische Wort wird hier kollektiv für die Heuschreckenplage gebraucht; der deutsche Plural vermittelt diesen Sinn klar.
- source_word: יֶלֶק
  choice: junge Heuschrecken
  rationale: Das Wort bezeichnet ein fressendes Insekt aus dem Bereich der Heuschreckenplagen, möglicherweise eine Entwicklungsstufe oder Art. „Junge Heuschrecken“ wahrt diese wahrscheinliche Beziehung, ohne das irreführende traditionelle „Raupen“ zu verwenden.
- source_word: וְאֵין מִסְפָּר
  choice: ohne Zahl
  rationale: Die hebräische Wendung besagt, dass sie nicht zu zählen waren. „Ohne Zahl“ ist knapp, poetisch und formal transparent.
