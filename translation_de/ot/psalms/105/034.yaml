  terminology: „Heuschrecken“ ist für אַרְבֶּה etabliert. „junge Heuschrecken“ ist als vorsichtige Hauptlesart für יֶלֶק vertretbar; die Fußnote nennt sowohl die Funktion als fressendes Insekt als auch die traditionelle Alternative „Raupe“, ohne eine unsichere taxonomische Bestimmung als Gewissheit auszugeben.
