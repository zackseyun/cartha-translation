  source_fidelity: Der Text gibt אָמַר mit „Er sprach“ angemessen wieder und bewahrt die erzählende Folge von וַיָּבֹא durch „da kamen“. אַרְבֶּה ist zutreffend als kollektive „Heuschrecken“ wiedergegeben. Die Wiedergabe von יֶלֶק als „junge Heuschrecken“ folgt einer plausiblen, aber nicht völlig sicheren Einordnung innerhalb der Heuschreckenplage; die Fußnote legt diese Unsicherheit offen. „ohne Zahl“ entspricht der hebräischen Wendung וְאֵין מִסְפָּר knapp und genau.
