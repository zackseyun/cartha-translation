  text: כִּֽי זָ֭כַר אֶת דְּבַ֣ר קָדְשׁ֑/וֹ אֶֽת אַבְרָהָ֥ם עַבְדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/042.yaml
  text: For he remembered his holy word to Abraham his servant[a][b].
translation:
  language: de
  text: Denn er gedachte seines heiligen Wortes[a] und Abrahams, seines Dieners[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Wort“ ist hier Gottes an Abraham ergangene Zusage gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Andere verstehen die Verbindung als: „Denn er gedachte seines heiligen Wortes an Abraham, seinen Diener.“ Der hebräische Text kann Abraham jedoch auch als einen zweiten Gegenstand von Gottes Gedenken hervorheben.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die zuvor geschilderte Handlung Gottes. „Denn“ fügt sich natürlich in den erklärenden Gedankengang des Psalms ein; je nach Abgrenzung des Zusammenhangs wäre auch „weil“ möglich.
- source_word: זָכַר
  choice: gedachte
  rationale: Das Verb bezeichnet hier nicht bloß eine mentale Erinnerung, sondern Gottes wirksames Gedenken an sein Wort und an Abraham. „Gedachte“ bewahrt diese biblische Ausdrucksweise, ohne bereits „erfüllte“ in den Text einzutragen.
- source_word: דְּבַר קָדְשׁוֹ
  choice: seines heiligen Wortes
  rationale: דָּבָר bedeutet wörtlich „Wort“, trägt im Zusammenhang aber den Sinn einer gegebenen Zusage. Die wörtlich nähere Wiedergabe bewahrt beides; „heilig“ gibt קֹדֶשׁ angemessen wieder.
- source_word: אֶת אַבְרָהָם
  choice: und Abrahams
  rationale: Das zweite אֶת kennzeichnet Abraham grammatisch als weiteres Objekt des Gedenkens. Das ergänzte „und“ macht die hebräische Reihung im Deutschen verständlich, ohne Abraham ausdrücklich zum Empfänger des zuvor genannten Wortes zu erklären.
- source_word: עַבְדּוֹ
  choice: seines Dieners
  rationale: „Diener“ ist für Abrahams Verhältnis zu Gott im Deutschen natürlich und kontextgerecht; „Sklave“ würde hier eine nicht im Vordergrund stehende soziale Bedeutung betonen.
theological_decisions:
- issue: Bundestheologische Tragweite des göttlichen Gedenkens
  choice: „gedachte“ bleibt im Haupttext stehen.
  alternative: „erfüllte seine Verheißung“
  rationale: Das Gedenken Gottes führt im Kontext zu seinem rettenden Handeln, doch der hebräische Text sagt nicht ausdrücklich „erfüllte“. Die Übersetzung bewahrt deshalb das theologisch gewichtige Bild, ohne die Folgerung an seine Stelle zu setzen.
- issue: Verhältnis zwischen dem heiligen Wort und Abraham
  choice: Wort und Abraham werden als zwei Gegenstände des Gedenkens wiedergegeben.
  alternative: „sein heiliges Wort an Abraham, seinen Diener“
  rationale: Im masoretischen Text steht vor beiden Satzgliedern die Akkusativpartikel אֶת. Die alternative Deutung als an Abraham gerichtetes Wort ist sachlich gut möglich und wird in der Fußnote genannt, soll aber die grammatische Spannung des Ausgangstextes nicht verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gedachte“ ist leicht gehoben, aber allgemein verständlich und bewahrt den biblischen Ausdruck des wirksamen göttlichen Gedenkens. Die Satzfügung folgt der hebräischen Parallelität, während das ergänzte „und“ im Deutschen für Klarheit sorgt.
