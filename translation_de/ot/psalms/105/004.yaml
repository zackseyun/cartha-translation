id: PSA.105.4
reference: Psalms 105:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דִּרְשׁ֣וּ יְהוָ֣ה וְ/עֻזּ֑/וֹ בַּקְּשׁ֖וּ פָנָ֣י/ו תָּמִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/004.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: de
  text: Sucht Jahwe und seine Stärke; sucht beständig sein Angesicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sucht beständig seine Gegenwart.“ Wörtlich steht im Hebräischen: „Sucht beständig sein Angesicht.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Sucht
  rationale: Der pluralische Imperativ bezeichnet hier die bewusste, hingebungsvolle Hinwendung zu Gott. „Sucht“ gibt dies knapp und im poetischen Zusammenhang natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: וְעֻזּוֹ
  choice: und seine Stärke
  rationale: עֹז bezeichnet Stärke, Macht oder Kraft. „Stärke“ ist direkt, verständlich und bewahrt das Possessivsuffix.
- source_word: בַּקְּשׁוּ
  choice: sucht
  rationale: Der Imperativ bezeichnet aktives Suchen. Die Wiederholung von „sucht“ erhält den prägnanten poetischen Parallelismus der beiden hebräischen Verben.
- source_word: פָנָיו
  choice: sein Angesicht
  rationale: Wörtlich steht „sein Angesicht“; die Wendung kann Gottes Gegenwart meinen. Die bildhafte, relationale Sprache bleibt im Haupttext erhalten, während die idiomatische Bedeutung in der Fußnote genannt wird.
- source_word: תָּמִיד
  choice: beständig
  rationale: Das Wort bezeichnet fortdauernde oder regelmäßig wiederkehrende Beständigkeit. „Beständig“ klingt in einer poetischen Aufforderung natürlich, ohne zwingend eine ausnahmslos ununterbrochene Handlung zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text gebraucht den Gottesnamen selbst. Die Wiedergabe als „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von פָנָיו als Bild oder als aufgelöste Bedeutung
  choice: sein Angesicht
  alternative: seine Gegenwart
  rationale: Die Wendung kann idiomatisch Gottes Gegenwart bezeichnen, doch „sein Angesicht“ bewahrt das konkrete hebräische Bild und seine theologische Spannung. Die mögliche Bedeutung „Gegenwart“ wird in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. „Angesicht“ ist bewusst etwas gehobener als „Gesicht“, da es die etablierte relationale Bildsprache trägt, ohne unverständlich zu sein.
