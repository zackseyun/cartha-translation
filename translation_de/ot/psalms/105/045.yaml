  text: so that they might keep his statutes and observe his laws[b][a]. Praise Yah!
translation:
  language: de
  text: 'damit sie seine Satzungen halten und seine Weisungen bewahren.[a]


    Lobt Jah![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit sie seine Ordnungen halten und seine Gesetze beachten.“'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „Lobt Jah!“ Jah ist die Kurzform des Gottesnamens; der ganze Ausdruck wird auch mit „Halleluja!“ oder „Lobt den HERRN!“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: damit
  rationale: Leitet den Zweck beziehungsweise das beabsichtigte Ergebnis von Gottes Handeln ein und klingt im modernen Deutschen natürlich.
- source_word: יִשְׁמְרוּ
  choice: sie hielten
  rationale: Der Qal-Imperfekt steht nach einer Zweckangabe. „Halten“ bewahrt den üblichen bundesbezogenen Sinn von שמר bei Geboten und Satzungen.
- source_word: חֻקָּיו
  choice: seine Satzungen
  rationale: חֻקִּים bezeichnet festgesetzte Ordnungen oder Satzungen; „Satzungen“ erhält den rechtlich-bundesbezogenen Klang.
- source_word: וְתוֹרֹתָיו
  choice: und seine Weisungen
  rationale: Der Plural von תּוֹרָה kann einzelne Weisungen oder Unterweisungen bezeichnen. „Weisungen“ vermeidet eine vorschnelle Verengung auf ein modernes Gesetzesverständnis.
- source_word: יִנְצֹרוּ
  choice: bewahrten
  rationale: נצר bezeichnet sorgfältiges Hüten und Bewahren. Die Wiedergabe unterscheidet den Ausdruck vom parallelen שמר, ohne den engen Parallelismus aufzulösen.
- source_word: הַלְלוּ יָהּ
  choice: Lobt Jah!
  rationale: Der Imperativ wird übersetzt, und „Jah“ gibt die im Hebräischen stehende Kurzform des Gottesnamens wieder. So bleibt die Struktur aus Aufforderung und Name sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in der abschließenden Aufforderung
  choice: Lobt Jah!
  alternative: Halleluja! / Lobt den HERRN!
  rationale: Der Ausgangstext hat יָהּ, die Kurzform des Gottesnamens, nicht ausdrücklich das volle Tetragramm. „Lobt Jah!“ wahrt diese Unterscheidung und macht zugleich die Bedeutung der Aufforderung verständlich.
- issue: Zweck oder Ergebnis des göttlichen Handelns
  choice: damit sie … hielten und … bewahrten
  alternative: sodass sie … hielten und … bewahrten
  rationale: בַּעֲבוּר mit den folgenden Imperfektformen ist vor allem purposiv. „Damit“ gibt diesen Zweck wieder, ohne zu behaupten, dass Israel ihn ausnahmslos verwirklichte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus wird durch „hielten“ und „bewahrten“ sowie „Satzungen“ und „Weisungen“ hörbar gehalten. Die Präteritalformen schließen natürlich an den erzählenden Rückblick des Psalms an.
