  text: וַ/יּוֹצִ֣א עַמּ֣/וֹ בְ/שָׂשׂ֑וֹן בְּ֝/רִנָּ֗ה אֶת בְּחִירָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/043.yaml
  text: So he brought out his people with joy[b][a], his chosen ones with singing.
translation:
  language: de
  text: So führte er sein Volk mit Freude hinaus, seine Erwählten unter Jubel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit Gesang« oder »mit Freudenrufen«. Das hebräische Wort kann sowohl Jubelrufe als auch freudigen Gesang bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: So führte er … hinaus
  rationale: Die Hifil-Form von יצא bedeutet „hinausbringen/hinausführen“. „führte … hinaus“ ist im Deutschen natürlich und bewahrt den Exodusbezug; „So“ nimmt den erzählerischen Anschluss des וַ auf.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: עַם bezeichnet hier Gottes Volk im Zusammenhang des Exodus; „sein Volk“ ist die sachlich und sprachlich naheliegende Wiedergabe.
- source_word: בְשָׂשׂוֹן
  choice: mit Freude
  rationale: שָׂשׂוֹן bezeichnet Freude oder Fröhlichkeit. „mit Freude“ gibt die adverbiale Funktion der Präpositionalphrase knapp und idiomatisch wieder.
- source_word: בְּרִנָּה
  choice: unter Jubel
  rationale: רִנָּה kann einen klingenden Freudenruf, Jubel oder freudigen Gesang bezeichnen. „unter Jubel“ bewahrt die hörbare, gemeinschaftliche Freude, ohne die Bedeutung unnötig auf Gesang einzuengen.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: Der hebräische Akkusativmarker hat kein selbstständiges deutsches Äquivalent; seine Funktion wird durch die Satzstellung ausgedrückt.
- source_word: בְּחִירָיו
  choice: seine Erwählten
  rationale: Das substantivierte Partizip von בחר bezeichnet diejenigen, die Gott erwählt hat. „seine Erwählten“ ist prägnant, würdevoll und bildet den Parallelismus zu „sein Volk“ ab.
theological_decisions:
- issue: Wiedergabe von בְּחִירָיו
  choice: seine Erwählten
  alternative: die er erwählt hatte / seine Auserwählten
  rationale: Der Ausdruck bezeichnet im Kontext diejenigen, die Gott erwählt hat, parallel zu „sein Volk“. „seine Erwählten“ wahrt diesen Sinn, ohne eine bestimmte spätere Lehrsystematik in den Vers hineinzulesen.
- issue: Bedeutungsumfang von בְּרִנָּה
  choice: unter Jubel
  alternative: mit Gesang / mit Freudenrufen
  rationale: Das hebräische Wort kann sowohl jubelndes Rufen als auch freudigen Gesang bezeichnen. Die Hauptübersetzung lässt diese Spannweite möglichst offen; die Fußnote nennt die engeren Möglichkeiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Aufbau des hebräischen Verses bleibt erhalten; „unter Jubel“ klingt natürlich und wahrt zugleich die lexikalische Offenheit von רִנָּה.
