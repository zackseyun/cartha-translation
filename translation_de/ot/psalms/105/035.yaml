  text: וַ/יֹּ֣אכַל כָּל עֵ֣שֶׂב בְּ/אַרְצָ֑/ם וַ֝/יֹּ֗אכַל פְּרִ֣י אַדְמָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/035.yaml
  text: It ate all the vegetation in their land[b][a], and it ate the fruit of their ground.
translation:
  language: de
  text: Er fraß alles Grün[a] in ihrem Land und fraß die Frucht ihres Bodens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alles Gras“. Das hebräische Wort kann Gras im engeren Sinn oder den Pflanzenwuchs allgemein bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Ertrag ihres Bodens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכַל
  choice: er fraß
  rationale: Die hebräische Verbform ist maskulin Singular und nimmt den im vorherigen Vers genannten kollektiven Schädling wieder auf. „Fraß“ bewahrt das konkrete Bild und passt zu Tieren besser als „aß“.
- source_word: כָּל
  choice: alles
  rationale: Die Wiedergabe drückt die vom hebräischen Quantor bezeichnete Gesamtheit natürlich aus.
- source_word: עֵשֶׂב
  choice: Grün
  rationale: Das hebräische Wort kann Gras im engeren Sinn oder den Pflanzenwuchs allgemein bezeichnen. „Alles Grün“ ist im Deutschen eine natürliche kollektive Bezeichnung und hält die Bedeutung ausreichend weit.
- source_word: בְּאַרְצָם
  choice: in ihrem Land
  rationale: Die Ortsangabe und der territoriale Sinn von אֶרֶץ werden direkt wiedergegeben.
- source_word: פְּרִי
  choice: Frucht
  rationale: „Frucht“ entspricht der Grundbedeutung und kann hier zugleich den landwirtschaftlichen Ertrag bezeichnen.
- source_word: אַדְמָתָם
  choice: ihres Bodens
  rationale: „Boden“ bewahrt den landwirtschaftlichen Bezug und unterscheidet אֲדָמָה vom zuvor genannten אֶרֶץ, „Land“.
theological_decisions: []
translation_notes:
