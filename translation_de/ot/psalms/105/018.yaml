  text: Man quälte seine Füße mit Fesseln; sein Hals geriet ins Eisen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Seine Seele/seine Lebenskraft kam ins Eisen.“ Die hebräische Wendung ist schwierig. נֶפֶשׁ bedeutet gewöhnlich „Seele“, „Leben“ oder „Person“; im Zusammenhang wird sie auch konkret auf den Hals bezogen. Dann kann „Eisen“ einen eisernen Halsreif oder eine Kette meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִנּוּ
  choice: sie zwängten
  rationale: Das Piel von ענה bezeichnet hier ein gewaltsames Quälen oder Bedrücken. Zusammen mit Füßen und Fesseln gibt „zwängten“ die konkrete Misshandlung natürlich wieder, ohne die ungenannten Täter näher zu bestimmen.
- source_word: בַכֶּבֶל
  choice: in Fesseln
  rationale: כבל bezeichnet eine Fessel beziehungsweise Fußfessel; die Präposition ב wird in der deutschen Wendung natürlich mit „in“ wiedergegeben.
- source_word: רַגְלָיו
  choice: seine Füße
  rationale: Die Form bezeichnet hier im Zusammenhang der Gefangenschaft seine Füße.
- source_word: בַּרְזֶל
  choice: ins Eisen
  rationale: Wörtlich steht „Eisen“; die Formulierung bewahrt das knappe poetische Bild, ohne ausdrücklich einen eisernen Halsring oder eine Kette in den Text einzutragen.
- source_word: בָּאָה
  choice: kam
  rationale: Die feminine Singularform stimmt grammatisch mit נַפְשׁוֹ überein, nicht mit dem maskulinen בַּרְזֶל. Daher bleibt „seine Kehle/sein Leben“ das Subjekt.
- source_word: נַפְשׁוֹ
  choice: seine Kehle
  rationale: נפש kann neben Leben, Seele oder Person auch den Hals- und Kehlenbereich bezeichnen. Im Parallelismus mit gefesselten Füßen und „Eisen“ ist die konkrete Wiedergabe „Kehle“ plausibel, bleibt jedoch wegen der schwierigen Wendung in einer Fußnote erläutert.
