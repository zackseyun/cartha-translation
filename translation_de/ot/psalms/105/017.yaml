  source_fidelity: 'Die Übersetzung gibt die hebräische Satzfolge und Aussage zuverlässig wieder: Das implizite göttliche Subjekt von שָׁלַח wird mit „Er“ aufgenommen; „ihnen einen Mann voraus“ entspricht לִפְנֵיהֶם אִישׁ, und „Josef wurde als Sklave verkauft“ gibt לְעֶבֶד נִמְכַּר präzise als passiven Verkauf in einen unfreien Status wieder. Die Nebeneinanderstellung von göttlichem Senden und menschlichem Verkauf bleibt erhalten.'
