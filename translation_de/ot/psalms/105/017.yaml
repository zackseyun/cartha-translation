  terminology: „Josef“ ist die etablierte deutsche biblische Namensform. „Sklave“ ist hier gegenüber „Diener“ sachlich treffend, weil der Verkauf ausdrücklich genannt wird. Die Fußnote bietet mit „vor ihnen“ die wörtlichere räumliche Form von לִפְנֵיהֶם, ohne die idiomatische Hauptübersetzung zu beeinträchtigen.
