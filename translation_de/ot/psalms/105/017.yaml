source:
  edition: WLC
  text: שָׁלַ֣ח לִ/פְנֵי/הֶ֣ם אִ֑ישׁ לְ֝/עֶ֗בֶד נִמְכַּ֥ר יוֹסֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/017.yaml
  text: He sent a man before them[a]; Joseph was sold as a servant.
translation:
  language: de
  text: Er sandte ihnen einen Mann voraus[a]; Josef wurde als Sklave verkauft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: vor ihnen.'
    reason: Die Fußnote bewahrt die räumlich offene Grundbedeutung von לִפְנֵיהֶם neben der idiomatischen Wiedergabe „ihnen voraus“.
lexical_decisions:
- source_word: שָׁלַח
  choice: sandte
  rationale: Das Qal Perfekt 3. Person Singular bezeichnet hier Gottes vorausgehendes Senden; „sandte“ entspricht dem gehobenen, aber allgemein verständlichen Psalmregister.
- source_word: לִפְנֵיהֶם
  choice: ihnen … voraus
  rationale: Die Wendung bedeutet räumlich beziehungsweise zeitlich „vor ihnen“ und bezeichnet hier, dass Josef ihnen vorausgesandt wurde. „Ihnen … voraus“ ist im modernen Deutschen natürlich und präzise.
- source_word: אִישׁ
  choice: einen Mann
  rationale: Das maskuline Singularnomen wird konkret wiedergegeben und durch den folgenden Namen Josef näher bestimmt.
- source_word: לְעֶבֶד
  choice: als Sklave
  rationale: In Verbindung mit „wurde verkauft“ bezeichnet עֶבֶד eindeutig einen unfreien, verkauften Menschen; „Sklave“ gibt diesen Status genauer wieder als „Diener“.
- source_word: נִמְכַּר
  choice: wurde … verkauft
  rationale: Das Niphal Perfekt wird als schlichtes deutsches Passiv wiedergegeben.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Verwendet wird die im Deutschen etablierte biblische Namensform.
theological_decisions:
- issue: Göttliches Senden und menschlicher Verkauf Josefs
  choice: 'Die beiden Aussagen bleiben nebeneinandergestellt: Gott sandte Josef voraus; Josef wurde als Sklave verkauft.'
  alternative: Den Verkauf ausdrücklich als unmittelbare Handlung Gottes formulieren.
  rationale: Der Vers deutet Josefs Weg als Gottes vorausgehendes Handeln, nennt beim Verkauf aber keinen Handelnden. Die Übersetzung bewahrt diese Spannung und macht Gott nicht ausdrücklich zum Verkäufer.
- issue: Bedeutung von עֶבֶד im Zusammenhang von Josefs Verkauf
  choice: Sklave
  alternative: Diener
  rationale: Der ausdrücklich genannte Verkauf macht den rechtlich und sozial unfreien Status in diesem Zusammenhang deutlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur des hebräischen Verses bleibt durch das Semikolon erhalten; die Wortstellung ist für heutige Leser natürlich.
