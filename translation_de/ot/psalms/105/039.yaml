base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/039.yaml
  text: He spread out a cloud as a covering[a], and fire to give light by night.
translation:
  language: de
  text: Er breitete eine Wolke als Bedeckung aus und ließ Feuer die Nacht erhellen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּרַשׂ
  choice: breitete … aus
  rationale: Das Verb bezeichnet das Ausbreiten oder Ausspannen; die trennbare deutsche Wendung gibt das Bild natürlich wieder.
- source_word: עָנָן
  choice: eine Wolke
  rationale: Die direkte lexikalische Entsprechung bewahrt das Bild der Wolke in der Wüstenzeit.
- source_word: לְמָסָךְ
  choice: als Schutz
  rationale: מָסָךְ kann eine Bedeckung, einen Schirm oder Schutz bezeichnen. „Als Schutz“ gibt hier die Funktion der Wolke verständlich wieder, ohne das Bild unnötig architektonisch festzulegen.
- source_word: וְאֵשׁ
  choice: und Feuer
  rationale: Die wörtliche Wiedergabe erhält den poetischen Parallelismus von Wolke und Feuer.
- source_word: לְהָאִיר
  choice: um … zu erhellen
  rationale: Der Infinitiv mit לְ drückt hier den Zweck aus; „um … zu erhellen“ ist im Deutschen klar und idiomatisch.
- source_word: לָיְלָה
  choice: die Nacht
  rationale: Als Objekt zu „erhellen“ ergibt sich eine natürliche deutsche Formulierung, die dem Sinn „nachts Licht geben“ entspricht.
theological_decisions:
- issue: Unausgesprochenes Subjekt des Verbs
  choice: Er = Gott
  alternative: Der HERR
  rationale: Das Hebräische setzt ein maskulines Subjekt in der dritten Person Singular voraus, das aus dem Kontext als Gott hervorgeht. „Er“ bewahrt den Textfluss, ohne den Gottesnamen ergänzend einzusetzen.
- issue: Bildsprache der Gotteserscheinung in der Wüste
  choice: Wolke und Feuer ohne deutende Erweiterung beibehalten
  alternative: Wolken- und Feuersäule ausdrücklich nennen
  rationale: Der Vers spielt auf die Exodusüberlieferung an, nennt jedoch lediglich Wolke und Feuer sowie ihre Funktionen. Die Übersetzung ergänzt daher weder „Säule“ noch eine weitere Auslegung.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Parallelstruktur. „Als Schutz“ ist allgemein verständlich; die Fußnote bewahrt die konkrete Bildbreite des hebräischen מָסָךְ.
