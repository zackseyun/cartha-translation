revisions:
- from: Er breitete eine Wolke als Schutz[a] aus und Feuer, um die Nacht zu erhellen.
  to: Er breitete eine Wolke als Bedeckung aus und ließ Feuer die Nacht erhellen.
  rationale: Die Revision ersetzt die funktional verengende Wiedergabe „Schutz“ durch das bildnähere „Bedeckung“ und glättet die im Deutschen unnatürliche Ellipse beim Feuer. Sie lässt offen, ob die Wolke besonders als Schirm, Vorhang oder Baldachin vorzustellen ist, und fügt keine Deutung wie „Säule“ hinzu.
  reviewer_model: gpt-5.6-terra
