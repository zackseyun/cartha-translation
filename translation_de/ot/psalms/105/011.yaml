lexical_decisions:
- source_word: לֵאמֹר
  choice: indem er sprach
  rationale: Der Infinitiv leitet die wörtliche Rede der göttlichen Verheißung ein und knüpft an den vorhergehenden Vers an.
- source_word: לְךָ
  choice: dir
  rationale: Die maskuline Singularform der direkten Anrede wird ausdrücklich beibehalten.
- source_word: אֶתֵּן
  choice: will ich ... geben
  rationale: Das Imperfekt hat hier verheißenden Zukunftssinn; die deutsche Fügung gibt diesen Zusagecharakter natürlich wieder.
- source_word: אֶרֶץ כְּנָעַן
  choice: das Land Kanaan
  rationale: Die Wendung bezeichnet das kanaanäische Gebiet und wird im Deutschen klar und idiomatisch wiedergegeben.
- source_word: חֶבֶל
  choice: Anteil
  rationale: Das Wort bedeutet wörtlich unter anderem „Schnur“ oder „Messschnur“, bezeichnet im Zusammenhang der Landverteilung aber metonymisch einen zugemessenen Landanteil.
- source_word: נַחֲלַתְכֶם
  choice: eures Erbbesitzes
  rationale: נַחֲלָה bezeichnet einen als Erbe beziehungsweise dauernden Besitz zugewiesenen Anteil. „Erbbesitz“ bewahrt den Bezug auf das verheißene Land und macht zugleich den pluralischen Possessivbezug sichtbar.
theological_decisions:
- issue: Wechsel von singularischer Anrede zu pluralischem Possessivsuffix
  choice: „Dir ... eures Erbbesitzes“
  alternative: „Dir ... deines Erbbesitzes“ oder „Dir ... des Erbbesitzes deiner Nachkommen“
  rationale: Der hebräische Text wechselt bewusst oder jedenfalls tatsächlich vom Singular לְךָ zum Plural נַחֲלַתְכֶם. Die Übersetzung harmonisiert diesen Wechsel nicht und erklärt auch nicht im Haupttext, ob Abraham stellvertretend für seine Nachkommen angeredet wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die appositionelle Fügung „das Land Kanaan, den Anteil ...“ bildet die hebräische Struktur ohne erklärendes „als“ nach. Die Fußnotenzeichen stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
