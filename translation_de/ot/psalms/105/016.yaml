  text: וַ/יִּקְרָ֣א רָ֭עָב עַל הָ/אָ֑רֶץ כָּֽל מַטֵּה לֶ֥חֶם שָׁבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/016.yaml
  text: He called for famine on the land[a]; he broke every staff of bread.
translation:
  language: de
  text: Er rief eine Hungersnot über das Land und zerbrach jede Stütze der Brotversorgung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jeden Stab des Brotes“. Das hebräische Bild bezeichnet die tragende Brot- bzw. Nahrungsversorgung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Er rief
  rationale: קרא bezeichnet hier, mit der Hungersnot als Objekt, deren Herbeirufen. „Er rief“ bewahrt die knappe Ausdrucksweise und die ausdrückliche göttliche Initiative.
- source_word: רָעָב
  choice: eine Hungersnot
  rationale: Im Zusammenhang ist eine das Land treffende Versorgungskrise gemeint; „Hungersnot“ ist daher genauer als das allgemeinere „Hunger“.
- source_word: עַל הָאָרֶץ
  choice: über das Land
  rationale: „Über das Land“ gibt die räumliche Wirkung der Hungersnot idiomatisch wieder, ohne den Bezug unnötig auf die ganze Erde auszuweiten.
- source_word: כָּל
  choice: jede
  rationale: Beim singularischen Ausdruck מַטֵּה לֶחֶם vermittelt „jede“ die umfassende Aussage klar.
- source_word: מַטֵּה לֶחֶם
  choice: Stütze an Brot
  rationale: Die Formulierung hält das hebräische Bild von Brot als tragender Lebensgrundlage fest. „Stütze an Brot“ ist im Deutschen verständlicher als das missverständliche wörtliche „Brotstab“, ohne die Metapher ganz aufzulösen.
- source_word: שָׁבָר
  choice: zerbrach
  rationale: „Zerbrach“ entspricht dem Grundsinn des Verbs und bewahrt das Bild einer beseitigten Stütze.
theological_decisions:
- issue: Göttliches Handeln bei der Hungersnot
  choice: 'Gott bleibt das Subjekt beider Verben: „Er rief … und zerbrach …“'
  alternative: Eine unpersönliche Darstellung der Hungersnot als bloßes Geschehen
  rationale: Der Kontext des Psalms schildert die Taten des HERRN; die maskulinen Singularformen führen dieses Subjekt fort. Die Übersetzung wahrt diese ausdrückliche göttliche Urheberschaft, ohne sie weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelstruktur und das hebräische Bild bleiben erhalten; die Fußnote erläutert dessen idiomatische Bedeutung.
