base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/029.yaml
  text: He turned their waters to blood and caused their fish to die[a].
translation:
  language: de
  text: Er verwandelte ihre Gewässer in Blut und ließ ihre Fische sterben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָפַךְ
  choice: verwandelte
  rationale: Das Verb bezeichnet ein Wenden oder Verändern. Im Zusammenhang der Plage gibt „verwandelte“ den Übergang in einen anderen Zustand natürlich und präzise wieder.
- source_word: מֵימֵיהֶם
  choice: ihre Gewässer
  rationale: Der hebräische Plural wird bewahrt; „Gewässer“ bezeichnet hier gesammelt die Wasserläufe und Wasserbestände Ägyptens.
- source_word: לְדָם
  choice: in Blut
  rationale: Die Präposition לְ kennzeichnet den Ergebniszustand. Im Deutschen ist „in Blut verwandeln“ die natürliche Ausdrucksweise.
- source_word: וַיָּמֶת
  choice: ließ ... sterben
  rationale: Die Hifil-Form ist kausativ. „ließ ... sterben“ bildet diese Verursachung ab, ohne sie durch das stärkere „tötete“ unnötig zuzuspitzen.
- source_word: דְּגָתָם
  choice: ihre Fische
  rationale: Das Substantiv bezeichnet die Fische kollektiv; „ihre Fische“ ist im Deutschen klar und idiomatisch.
