  text: זֶ֭רַע אַבְרָהָ֣ם עַבְדּ֑/וֹ בְּנֵ֖י יַעֲקֹ֣ב בְּחִירָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/006.yaml
  text: offspring of Abraham[a], his servant, sons of Jacob, his chosen ones[c][b],
translation:
  language: de
  text: 'ihr Nachkommen Abrahams[a], seines Dieners,

    ihr Söhne Jakobs[b], seine Erwählten[c]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Same Abrahams«. Das hebräische Singularwort bezeichnet hier kollektiv Abrahams Nachkommen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Kinder Jakobs«. Wörtlich steht im Hebräischen »Söhne Jakobs«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »seine Auserwählten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: Nachkommen
  rationale: Das hebräische Singularwort bezeichnet hier kollektiv Abrahams Nachkommenschaft. »Nachkommen« ist im Deutschen natürlich und schließt die angesprochene Gemeinschaft ein; die wörtliche Bildform »Same« wird in der Fußnote genannt.
- source_word: עַבְדּוֹ
  choice: seines Dieners
  rationale: Der Ausdruck bezeichnet Abraham als Diener Gottes. »Diener« bewahrt den ehrenden Bundes- und Beziehungsbezug, ohne den in diesem Kontext nicht hervorgehobenen Aspekt von »Sklave« in den Vordergrund zu rücken.
- source_word: בְּנֵי
  choice: Söhne
  rationale: Die ausdrücklich maskuline Pluralform wird formal bewahrt. Im Parallelismus bezeichnet sie die von Jakob abstammende Gemeinschaft; »Kinder« bleibt als mögliche sinngemäße Wiedergabe in der Fußnote.
- source_word: בְּחִירָיו
  choice: seine Erwählten
  rationale: Die substantivierte Form gibt die von Gott Ausgewählten knapp und würdig wieder. Die Wahl bewahrt den Bezug des Suffixes auf Gott und vermeidet eine erklärende Erweiterung im Haupttext.
- source_word: זֶרַע אַבְרָהָם // בְּנֵי יַעֲקֹב
  choice: Nachkommen Abrahams // Söhne Jakobs
  rationale: Die beiden parallelen Abstammungsbezeichnungen bleiben unterscheidbar, statt zu einer einzigen Bezeichnung zusammengezogen zu werden.
theological_decisions:
- issue: Bezug der Possessivsuffixe in »seines Dieners« und »seine Erwählten«
  choice: 'Beide Suffixe beziehen sich auf Gott: Abraham ist sein Diener, und die Söhne Jakobs sind seine Erwählten.'
  alternative: Rein mechanisch könnten die Suffixe jeweils auf einen unmittelbar vorher genannten Patriarchen bezogen werden; im Kontext ist dies jedoch unwahrscheinlich.
  rationale: Der Kontext des Psalms bezeichnet Abraham als Gottes Diener und die Linie Jakobs als die von Gott Erwählten. Die deutsche Form lässt den Gottesbezug entsprechend erkennen, ohne zusätzliche dogmatische Aussagen einzutragen.
translation_notes:
  register: Moderne, würdige Anrede mit wiederholtem »ihr«, das im Deutschen den fragmentarischen hebräischen Vokativ natürlich wiedergibt. Der poetische Parallelismus und die männliche Form »Söhne« bleiben erhalten.
