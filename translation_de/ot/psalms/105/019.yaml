lexical_decisions:
- source_word: עַד עֵת
  choice: Bis zu der Zeit
  rationale: Die Wendung bezeichnet die Dauer bis zu einem bestimmten Zeitpunkt und bleibt nah an der hebräischen Formulierung.
- source_word: בֹּא
  choice: eintraf
  rationale: Das Verb bedeutet wörtlich „kommen“. In Verbindung mit „Wort“ kann es dessen Eintreffen beziehungsweise Erfüllung bezeichnen; „eintraf“ bewahrt diese Offenheit besser als eine ausdrücklichere Deutung.
- source_word: דְבָרוֹ
  choice: sein Wort
  rationale: Die Wiedergabe erhält sowohl die lexikalische Form als auch die im Hebräischen offene Frage, ob das Wort Josef oder Gott zuzuordnen ist.
- source_word: אִמְרַת יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ ist eine natürliche Wiedergabe von אִמְרָה; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: צְרָפָתְהוּ
  choice: prüfte ihn
  rationale: צרף bezeichnet wörtlich das Läutern von Metall und übertragen das Erproben eines Menschen. „Prüfte“ vermittelt den Sinn im heutigen Deutsch; das Bild des Läuterns wird in der Fußnote erhalten.
theological_decisions:
- issue: Bezug von „sein Wort“
  choice: Im Haupttext nicht eindeutig festgelegt; im Kontext ist Josefs Wort beziehungsweise Voraussage naheliegend.
  alternative: Gottes Wort über Josef.
  rationale: Das maskuline Suffix lässt den Bezug grammatisch offen. Der Zusammenhang kann auf Josefs Voraussage und deren Erfüllung weisen, während die zweite Vershälfte ausdrücklich vom Wort Jahwes spricht; die alternative Deutung bleibt daher in der Fußnote erhalten.
- issue: Bedeutung des Eintreffens des Wortes
  choice: „eintraf“
  alternative: „sich erfüllte“ oder wörtlich „kam“
  rationale: Die Formulierung bewahrt die Spannung zwischen dem wörtlichen Kommen eines Wortes und seiner sachlichen Erfüllung, ohne die Auslegung im Haupttext festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe poetische Parallelität wird bewahrt; die echte Mehrdeutigkeit des hebräischen Pronomens und das Bild des Läuterns werden nicht stillschweigend aufgelöst.
