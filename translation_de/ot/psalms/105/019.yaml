  text: Until the time his word came to pass[b][a], the word of Yahweh tested him.
translation:
  language: de
  text: Bis zu der Zeit, als sich sein Wort erfüllte[a], prüfte ihn das Wort Jahwes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bis zur Zeit, als sein Wort kam“. „Sein Wort“ kann sich auf Josefs eigene Voraussage beziehen; andere verstehen darunter Gottes Wort über Josef.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „läuterte ihn“. Das Verb bezeichnet ursprünglich das Läutern von Metall und kann übertragen „prüfen“ oder „erproben“ bedeuten.'
