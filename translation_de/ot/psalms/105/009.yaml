  text: אֲשֶׁ֣ר כָּ֭רַת אֶת אַבְרָהָ֑ם וּ/שְׁב֖וּעָת֣/וֹ לְ/יִשְׂחָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/009.yaml
  text: which he made with Abraham[a], and his oath to Isaac,
translation:
  language: de
  text: den er mit Abraham schloss[a], und seinen Eid, den er Isaak schwor,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den er mit Abraham schnitt“; im Hebräischen eine Wendung für „einen Bund schließen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: den
  rationale: Das Relativpronomen nimmt den im vorherigen Vers genannten Bund auf; Genus und Kasus entsprechen dem deutschen Wort „Bund“.
- source_word: כָּרַת
  choice: schloss
  rationale: Im Bundeskontext gehört das Verb zur hebräischen Wendung „einen Bund schneiden“. Deutsch gibt dies natürlich und präzise mit „einen Bund schließen“ wieder; das Objekt ist aus Vers 8 mitzudenken.
- source_word: אֶת אַבְרָהָם
  choice: mit Abraham
  rationale: Obwohl אֶת formal den Objektsmarker darstellt, verlangt die idiomatische deutsche Verbindung „einen Bund schließen“ bei der beteiligten Person die Präposition „mit“.
- source_word: וּשְׁבוּעָתוֹ
  choice: und seinen Eid
  rationale: Die substantivische Form und das Suffix der 3. Person Singular werden knapp als „seinen Eid“ bewahrt.
- source_word: לְיִשְׂחָק
  choice: an Isaak
  rationale: ל bezeichnet hier den Adressaten beziehungsweise die Person, der der Eid gilt; „an Isaak“ wahrt die nominale Konstruktion und ist im Deutschen verständlich.
theological_decisions:
- issue: Der Bund als nur aus dem vorherigen Vers erschlossenes Objekt
  choice: „den er mit Abraham schloss“
  alternative: „den er Abraham zusagte“ / „den er mit Abraham schnitt“
  rationale: Das Relativpronomen greift den Bund aus Vers 8 auf. „Schloss“ bildet die hebräische Bundesformel idiomatisch ab, ohne den ausgelassenen Ausdruck erneut einzufügen oder das Bild des Schneidens unnatürlich zu übertragen.
- issue: Beziehung des Eides zu Isaak
  choice: „seinen Eid an Isaak“
  alternative: „seinen Eid für Isaak“ / „den Eid, den er Isaak schwor“
  rationale: „An Isaak“ lässt die Funktion von ל bewusst relativ offen und bewahrt zugleich die substantivische Form. Die verbale Alternative wäre eindeutiger und paraphrasierender.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt als Fortsetzung von Vers 8 offen; „Bund“ wird nicht wiederholt, sondern durch das Relativpronomen aufgenommen.
