  text: Sing to him[a]; sing praises to him; speak of all his wondrous works.
translation:
  language: de
  text: Singt ihm, singt ihm Loblieder; sprecht von all seinen Wundern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erzählt von allen seinen Wundern“ oder „Denkt über alle seine wunderbaren Taten nach.“ Das hebräische Verb kann sowohl mündliches Erzählen als auch nachsinnendes Betrachten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Singt
  rationale: Der pluralische Imperativ von שׁיר wird direkt und natürlich mit „Singt“ wiedergegeben.
- source_word: ל֭וֹ
  choice: ihm
  rationale: ל mit Pronominalsuffix bezeichnet hier den Empfänger beziehungsweise die Ausrichtung des Lobes; „ihm“ entspricht natürlichem deutschen Sprachgebrauch.
- source_word: זַמְּרוּ
  choice: spielt ihm zum Lob
  rationale: זמר bezeichnet im Lobkontext musikalisches beziehungsweise gesungenes Gotteslob. Die Formulierung bewahrt den musikalischen Aspekt, ohne ein bestimmtes Instrument vorauszusetzen.
- source_word: שִׂיחוּ
  choice: sprecht von
  rationale: שׂיח kann sowohl nachsinnendes Betrachten als auch mündliches Erzählen bezeichnen. In der Reihe öffentlicher Lobaufforderungen liegt die kommunikative Bedeutung näher.
- source_word: בְּכָל
  choice: von all
  rationale: ב wird nach einem Verb des Sprechens im Deutschen idiomatisch mit „von“ wiedergegeben; כל behält mit „all“ seinen umfassenden Sinn.
- source_word: נִפְלְאוֹתָיו
  choice: seinen Wundern
  rationale: נפלאות bezeichnet außergewöhnliche göttliche Taten, die Staunen hervorrufen. „Wunder“ ist prägnant und lässt sowohl die Taten als auch ihren staunenswerten Charakter erkennen.
