review_pass:
  verdict: revise
  source_fidelity: Der Text gibt die drei pluralischen Imperative und die Ausrichtung auf ihn zutreffend wieder. „Spielt ihm zum Lob“ ist jedoch für זמר zu eng bzw. potenziell irreführend, weil es im Deutschen vorrangig instrumentales Spielen nahelegt, während das Hebräische hier allgemein musikalisches bzw. gesungenes Lob ausdrückt. „Singt ihm Loblieder“ trifft den Parallelismus mit שירו und die Bedeutung von זמר idiomatisch.
  naturalness: „Singt ihm, spielt ihm zum Lob“ ist verständlich, aber die Wiederholung von „ihm“ und insbesondere „spielt ihm zum Lob“ wirken weniger natürlich als die übliche Psalmenformulierung „Singt ihm Loblieder“. „Sprecht von all seinen Wundern“ ist natürlich und angemessen.
  terminology: „Wunder“ für נפלאותיו ist gut. Die Fußnote sollte die kommunikative Alternative „erzählt von“ ausdrücklich bewahren und nicht allein eine meditative Lesart als Alternative bieten; außerdem sollte sie die Wiedergabe „sprecht von“ nicht als eindeutig vorzuziehende Deutung festlegen, da die lexikalische Ambiguität real ist.
  issues:
  - severity: medium
    issue: „spielt ihm zum Lob“ für זמר
    rationale: Die Formulierung kann ein Instrumentalspiel als eigenständige Handlung ausdrücken und engt damit die hebräische Bedeutung unnötig ein. „Singt ihm Loblieder“ ist im deutschen Psalmregister natürlich und wahrt den musikalischen Lobcharakter ohne Instrumentierung festzulegen.
  - severity: low
    issue: Fußnote dokumentiert die Alternative zu שׂיח unvollständig und wertend
    rationale: Neben „nachsinnen/meditieren“ kann שׂיח in diesem Kontext auch „erzählen/berichten“ bedeuten. Die Notiz sollte beide Möglichkeiten nennen, ohne die öffentliche Deutung als zwingend auszugeben.
