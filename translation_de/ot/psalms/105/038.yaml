source:
  edition: WLC
  text: שָׂמַ֣ח מִצְרַ֣יִם בְּ/צֵאתָ֑/ם כִּֽי נָפַ֖ל פַּחְדָּ֣/ם עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/038.yaml
  text: Egypt was glad when they departed[b][a], for dread of them had fallen upon them.
translation:
  language: de
  text: Ägypten freute sich über ihren Auszug, denn die Furcht vor ihnen hatte es ergriffen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂמַח
  choice: freute sich
  rationale: Das Qal Perfekt bezeichnet Ägyptens Freude als Reaktion auf Israels Auszug; „freute sich“ ist natürlich, gegenwärtig und würdig.
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Der Ländername steht kollektiv für Land und Volk. Die Wiedergabe als „Ägypten“ bewahrt die Form und vermeidet einen unnötigen Wechsel zu „die Ägypter“.
- source_word: בְּצֵאתָם
  choice: über ihren Auszug
  rationale: ב mit dem Infinitiv constructus kann den zeitlichen Umstand oder den Anlass der Freude bezeichnen. „Über ihren Auszug“ gibt hier idiomatisch sowohl das Ereignis als auch den Anlass wieder; das Suffix bezieht sich auf Israel.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für Ägyptens Freude ein.
- source_word: נָפַל
  choice: hatte ... gepackt
  rationale: Wörtlich ist die Angst „auf“ Ägypten „gefallen“. Die deutsche Wendung „hatte es gepackt“ vermittelt den eingetretenen, bereits bestehenden Zustand natürlich und kräftig.
- source_word: פַּחְדָּם
  choice: die Angst vor ihnen
  rationale: 'פַּחַד bezeichnet starke Furcht oder Angst; das Suffix ist hier sachlich objektiv zu verstehen: die von Israel ausgelöste Angst, also Angst vor ihnen.'
- source_word: עֲלֵיהֶם
  choice: es
  rationale: Das Pronomen nimmt das kollektiv und grammatisch sächlich verstandene „Ägypten“ auf. So bleibt trotz der zwei unterschiedlichen Bezugsgruppen klar, dass die Angst Ägypten ergriffen hatte.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Ton. Die Pronomenbezüge werden im Deutschen durch „ihren/ihnen“ für Israel und „es“ für Ägypten unterschieden.
