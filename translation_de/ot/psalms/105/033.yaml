  text: וַ/יַּ֣ךְ גַּ֭פְנָ/ם וּ/תְאֵנָתָ֑/ם וַ֝/יְשַׁבֵּ֗ר עֵ֣ץ גְּבוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/033.yaml
  text: He struck their vines and their fig trees[a], and shattered the trees of their territory.
translation:
  language: de
  text: Er schlug ihre Weinstöcke und ihre Feigenbäume und zerschmetterte die Bäume ihres Gebiets.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: Er schlug
  rationale: נכה bezeichnet ein kräftiges Schlagen oder Treffen. „Er schlug“ ist gegenwärtiges, würdevolles Deutsch und bewahrt die direkte Handlung.
- source_word: גַּפְנָם
  choice: ihre Weinstöcke
  rationale: גֶּפֶן bezeichnet den Weinstock beziehungsweise die Weinrebe. Die Mehrzahl gibt den kollektiven landwirtschaftlichen Bezug im Deutschen natürlich wieder.
- source_word: וּתְאֵנָתָם
  choice: und ihre Feigenbäume
  rationale: תְּאֵנָה bedeutet „Feigenbaum“. Trotz der singularischen Form ist hier neben den Weinstöcken ein kollektiver beziehungsweise distributiver Sinn naheliegend, den die deutsche Mehrzahl idiomatisch ausdrückt.
- source_word: וַיְשַׁבֵּר
  choice: und zerbrach
  rationale: Der Piel von שׁבר bezeichnet ein nachdrückliches, zerstörerisches Zerbrechen. „Zerbrach“ wahrt die Kraft des Verbs, ohne unnötig umgangssprachlich zu klingen.
- source_word: עֵץ
  choice: die Bäume
  rationale: עֵץ kann „Baum“ oder „Holz“ bedeuten. Im Zusammenhang der Verwüstung sind stehende Bäume gemeint; der kollektive Singular wird im Deutschen sinnvoll als Mehrzahl wiedergegeben.
- source_word: גְּבוּלָם
  choice: in ihrem Gebiet
  rationale: גְּבוּל kann Grenze, abgegrenztes Gebiet oder Territorium bezeichnen. Die Verbindung עֵץ גְּבוּלָם meint hier natürlich die Bäume innerhalb ihres Gebiets; „in ihrem Gebiet“ ist klar und bewahrt die räumliche Aussage.
theological_decisions:
- issue: Unausgesprochenes Subjekt der Verben
  choice: „Er“ bezeichnet im fortlaufenden Zusammenhang Gott.
  alternative: Das Subjekt könnte im Deutschen ausdrücklich als „Gott“ oder „der HERR“ genannt werden.
  rationale: Die hebräischen Verben stehen in der 3. Person maskulin Singular, während das Subjekt aus dem Kontext hervorgeht. „Er“ macht den deutschen Satz vollständig, ohne eine im Vers selbst nicht wiederholte Gottesbezeichnung einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die kraftvollen Verben des Hebräischen bleiben erhalten; kollektive Singularformen werden idiomatisch im Plural wiedergegeben.
