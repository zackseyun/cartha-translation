id: PSA.105.8
reference: Psalms 105:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זָכַ֣ר לְ/עוֹלָ֣ם בְּרִית֑/וֹ דָּבָ֥ר צִ֝וָּ֗ה לְ/אֶ֣לֶף דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/008.yaml
  text: He remembers his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: de
  text: 'Er denkt für immer an seinen Bund,

    an das Wort, das er für tausend Generationen gebot.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an die Zusage, die er für tausend Generationen verordnete.«'
    reason: Lexikalische Alternativen für דָּבָר und צִוָּה im Bundeszusammenhang.
lexical_decisions:
- source_word: זָכַר
  choice: Er denkt … an
  rationale: Das qal Perfekt kann vergangen oder perfektiv wiedergegeben werden; im poetischen Zusammenhang bezeichnet es Gottes fortdauernde Bundestreue. Die deutsche Gegenwartsform drückt diese bleibende Wirklichkeit natürlich aus.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Präposition ל mit עוֹלָם bezeichnet unbegrenzte Dauer; »für immer« ist im modernen Standarddeutsch klar und würdevoll.
- source_word: בְּרִיתוֹ
  choice: seinen Bund
  rationale: »Bund« ist im biblisch-theologischen Zusammenhang die sachgemäße und etablierte Wiedergabe von בְּרִית.
- source_word: דָּבָר
  choice: das Wort
  rationale: דָּבָר bezeichnet hier parallel zum Bund die von Gott ausgesprochene Bundeszusage. »Wort« bewahrt die Breite des Hebräischen; die stärker deutende Wiedergabe »Zusage« steht in der Fußnote.
- source_word: צִוָּה
  choice: gebot
  rationale: Das Piel von צוה bedeutet gewöhnlich »gebieten«. Die Formulierung bewahrt die Kraft des göttlichen Beschlusses, auch wenn im Bundeskontext »verordnete« möglich ist.
- source_word: לְאֶלֶף דּוֹר
  choice: für tausend Generationen
  rationale: ל bezeichnet hier die zeitliche Erstreckung. Obwohl דּוֹר morphologisch im Singular steht, ist nach der Zahl im Deutschen der Plural idiomatisch erforderlich.
theological_decisions:
- issue: Aspekt des göttlichen Gedenkens
  choice: Gegenwart als Ausdruck fortdauernder Bundestreue
  alternative: »Er gedachte für immer seines Bundes« oder »Er hat für immer an seinen Bund gedacht«
  rationale: Der Psalm preist Gottes bleibende Treue. Die Gegenwart vermeidet den Eindruck eines bloß vergangenen Erinnerungsakts.
- issue: Bedeutung von דָּבָר im Bundesparallelismus
  choice: »das Wort« im Haupttext
  alternative: »die Zusage«
  rationale: Das breite hebräische Wort meint wahrscheinlich Gottes Bundeszusage. »Wort« erhält die lexikalische Offenheit und den poetischen Parallelismus; »Zusage« verdeutlicht die wahrscheinliche Bedeutung in der Fußnote.
- issue: Bedeutungsnuance von צִוָּה
  choice: »gebot«
  alternative: »verordnete« oder »festsetzte«
  rationale: Die direkte Bedeutung »gebieten« wird beibehalten, ohne die im Bundeszusammenhang mögliche Nuance eines wirksamen göttlichen Festsetzens auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Zeilenumbruch. »An etwas denken« ist natürlicher als das gehobenere »einer Sache gedenken«, während »Bund«, »Wort« und »gebot« die Dichte des hebräischen Parallelismus bewahren.
