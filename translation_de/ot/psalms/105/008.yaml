  source_fidelity: 'Die Übersetzung gibt die beiden parallelen Satzglieder des Hebräischen vollständig wieder: זָכַר in seiner poetisch-gnomischen Gegenwartsfunktion, לְעוֹלָם als dauerhafte Geltung, בְּרִיתוֹ als „seinen Bund“ sowie דָּבָר und צִוָּה als „Wort“ und „gebot“. „Für tausend Generationen“ gibt die kollektivische Numeralkonstruktion idiomatisch wieder. Die syntaktische Zuordnung der Zeitangabe zum zweiten Glied bleibt wie im Hebräischen gewahrt.'
  naturalness: „Er denkt für immer an seinen Bund“ ist modernes, verständliches Standarddeutsch und hat einen würdigen, poetischen Ton. Die Wiederaufnahme „an das Wort“ bildet den hebräischen Parallelismus gut nach. „… das er für tausend Generationen gebot“ ist etwas dichter und biblisch gefärbt, aber im Psalmenregister natürlich und verständlich.
  terminology: „Bund“ ist der etablierte und sachlich treffende Ausdruck für בְּרִית. „Wort“ bewahrt die lexikalische Offenheit von דָּבָר; die Fußnote bietet mit „Zusage“ eine zulässige kontextuelle Alternative. „Gebot“ bildet צִוָּה direkt ab, ohne eine bestimmte theologische Auslegung einzutragen.
