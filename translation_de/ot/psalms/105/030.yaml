base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/030.yaml
  text: Their land swarmed with frogs[a], even in the chambers of their kings.
translation:
  language: de
  text: Ihr Land wimmelte von Fröschen, auch in den Gemächern ihrer Könige.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „ihrer Könige“. In der Erzählung von der Froschplage im 2. Buch Mose ist dagegen vom Pharao und seinem Haus die Rede. Der Psalm verwendet hier die Mehrzahl, möglicherweise poetisch oder kollektiv.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרַץ
  choice: wimmelte
  rationale: Das Verb bezeichnet massenhaftes Auftreten beziehungsweise Wimmeln. „Wimmelte von“ ist im Deutschen anschaulich und idiomatisch.
- source_word: אַרְצָם
  choice: ihr Land
  rationale: Die Form ist ein Substantiv mit Suffix der 3. Person maskulin Plural und wird im Zusammenhang unmittelbar auf Ägypten bezogen.
- source_word: צְפַרְדְּעִים
  choice: Fröschen
  rationale: Dies ist die übliche und kontextuell eindeutige Wiedergabe.
- source_word: בְּחַדְרֵי
  choice: bis in die Gemächer
  rationale: Wörtlich bezeichnet die Präposition einen Ort („in“). In Verbindung mit der vorangehenden Plage gibt „bis in“ im Deutschen die hervorgehobene Reichweite natürlich wieder, ohne eine Bewegungsrichtung zum Verb hinzuzufügen. „Gemächer“ wahrt den würdigen poetischen Ton.
- source_word: מַלְכֵיהֶם
  choice: ihrer Könige
  rationale: Die hebräische Form steht morphologisch im Plural mit einem Suffix der 3. Person maskulin Plural. Der Plural wird daher nicht an den Singular der Exodus-Erzählung angeglichen.
theological_decisions:
- issue: Plural „Könige“ gegenüber dem einzelnen Pharao in der Exodus-Erzählung
  choice: Der hebräische Plural wird im Haupttext beibehalten.
  alternative: „ihres Königs“ als Angleichung an die Exodus-Erzählung
  rationale: Die Übersetzung soll die Form des Psalms und ihre mögliche poetische oder kollektive Spannung bewahren, statt sie harmonisierend aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-poetischem Klang. „Gemächer“ ist leicht gehoben, passt jedoch zum königlichen Umfeld und zur Psalmdichtung.
