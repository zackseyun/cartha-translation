  text: שָׁאַ֣ל וַ/יָּבֵ֣א שְׂלָ֑ו וְ/לֶ֥חֶם שָׁ֝מַ֗יִם יַשְׂבִּיעֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/040.yaml
  text: They asked[a], and he brought quail[b]; he satisfied them with the bread of heaven.
translation:
  language: de
  text: Sie baten[a], und er brachte Wachteln; mit Himmelsbrot sättigte er sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch steht das Verb in der Einzahl, wörtlich: „Er bat“. Gemeint ist wahrscheinlich das Volk Israel als Gesamtheit.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁאַל
  choice: Sie baten
  rationale: Die hebräische Verbform ist formal 3. Person Singular („er bat“), doch der Zusammenhang legt Israel als kollektives Subjekt nahe. Der Plural gibt den gemeinten Sinn natürlich wieder; die formale Einzahl wird in einer Fußnote bewahrt.
- source_word: וַיָּבֵא
  choice: und er brachte
  rationale: Der Hifil von בוא bedeutet hier „bringen“ bzw. „kommen lassen“. „Er brachte“ ist idiomatisches Deutsch und erhält den kausativen Sinn ausreichend.
- source_word: שְׂלָו
  choice: Wachteln
  rationale: Das Wort bezeichnet im Bericht von der Versorgung Israels in der Wüste Wachteln; der deutsche Plural passt zum kollektiven Nahrungsmittelbezug.
- source_word: לֶחֶם שָׁמַיִם
  choice: Himmelsbrot
  rationale: Die Konstruktion bedeutet wörtlich „Brot des Himmels“. „Himmelsbrot“ bewahrt die dichterische Prägnanz und lässt sowohl die Zuordnung zum Himmel als auch die Herkunftsnuance offen.
- source_word: יַשְׂבִּיעֵם
  choice: sättigte er sie
  rationale: Der Hifil von שׂבע bezeichnet das Sättigen oder reichliche Versorgen. „Sättigte“ erfasst die leibliche Fülle knapp und würdig.
theological_decisions:
- issue: Subjekt der einleitenden Verbform שָׁאַל
  choice: 'Die Israeliten werden kollektiv als Subjekt verstanden: „Sie baten“.'
  alternative: 'Die formale Einzahl wird beibehalten: „Er bat“, möglicherweise mit Israel als kollektiv gedachtem Subjekt oder mit einem einzelnen Vertreter.'
  rationale: Der Psalmzusammenhang schildert Gottes Handeln an Israel, und das spätere pluralische Objektsuffix („sie“) stützt den kollektiven Bezug. Die Fußnote hält die grammatische Spannung sichtbar.
- issue: Verhältnis von לֶחֶם zu שָׁמַיִם
  choice: „Himmelsbrot“
  alternative: „Brot vom Himmel“ oder „Brot des Himmels“
  rationale: Der hebräische Genitiv kann Zugehörigkeit oder Herkunft ausdrücken. „Himmelsbrot“ erhält die poetische Verdichtung, ohne diese Nuance dogmatisch festzulegen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knapper poetischer Satzstellung. „Himmelsbrot“ wahrt den Psalmton; die grammatische Spannung der eröffnenden Einzahl wird transparent in der Fußnote dokumentiert.
