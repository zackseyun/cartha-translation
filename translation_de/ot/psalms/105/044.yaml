source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן לָ֭/הֶם אַרְצ֣וֹת גּוֹיִ֑ם וַ/עֲמַ֖ל לְאֻמִּ֣ים יִירָֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/044.yaml
  text: He gave them the lands of the nations[a], and they inherited the labor of the peoples.
translation:
  language: de
  text: Er gab ihnen die Länder der Völker, und sie nahmen den Ertrag der Arbeit der Völker in Besitz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und die Mühe/Arbeit der Völker nahmen sie in Besitz“. Das hebräische Wort kann die mühevolle Arbeit selbst oder das dadurch Erarbeitete bezeichnen. Das Verb kann auch mit „sie erbten“ wiedergegeben werden.'
    reason: Bewahrt die lexikalische Mehrdeutigkeit von עָמָל und die Bedeutungsbreite von ירש, ohne dem Haupttext ein zusätzliches „anderer“ hinzuzufügen.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Er gab
  rationale: Das Qal-Wayyiqtol von נתן bezeichnet schlicht das Geben. Die deutsche Erzählform gibt den vergangenen Vorgang natürlich wieder; das einleitende ו wird im Satzanschluss nicht eigens übersetzt.
- source_word: לָהֶם
  choice: ihnen
  rationale: Das Suffix der 3. Person maskulin Plural bezeichnet hier den Empfänger und wird idiomatisch als Dativ wiedergegeben.
- source_word: אַרְצוֹת גּוֹיִם
  choice: die Länder der Völker
  rationale: Der Plural אַרְצוֹת bleibt als „Länder“ erhalten. „Völker“ passt in diesem territorial-politischen Zusammenhang besser als „Heiden“.
- source_word: וַעֲמַל לְאֻמִּים
  choice: den Ertrag der Mühe anderer Völker
  rationale: עָמָל kann die mühevolle Arbeit selbst oder metonymisch deren Ertrag bezeichnen. Da dieser Gegenstand in Besitz genommen wird, macht „Ertrag der Mühe“ den wahrscheinlichen Sinn im Deutschen verständlich, ohne die Mühe auszublenden.
- source_word: יִירָשׁוּ
  choice: sie nahmen … in Besitz
  rationale: ירש bezeichnet hier das Erlangen beziehungsweise Inbesitznehmen dessen, was Gott Israel gab. „In Besitz nehmen“ ist im Deutschen natürlicher als „die Mühe erben“ und bewahrt die Handlungsaussage.
theological_decisions:
- issue: Bundestheologische Nuance von ירש
  choice: sie nahmen … in Besitz
  alternative: sie erbten
  rationale: Der vorhergehende Satz stellt das Land ausdrücklich als Gottes Gabe dar. Daher bleibt der Gedanke des durch Gott gewährten Besitzes auch ohne das im Deutschen missverständliche „erben“ erhalten; zugleich wird nicht behauptet, die Völker seien Israels Erblasser gewesen.
- issue: Referent von לְאֻמִּים
  choice: anderer Völker
  alternative: der Völker
  rationale: „Anderer“ verdeutlicht im Deutschen lediglich den im Parallelismus vorausgesetzten Gegensatz zwischen den Empfängern und den Völkern, deren Arbeitsertrag sie übernahmen; es fügt keine konfessionelle Deutung hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus bleibt erkennbar; die ungewöhnliche Verbindung von „Mühe“ und „in Besitz nehmen“ wird im Haupttext behutsam verdeutlicht und in der Fußnote formal näher am Hebräischen wiedergegeben.
