  text: פָּ֣תַח צ֭וּר וַ/יָּז֣וּבוּ מָ֑יִם הָ֝לְכ֗וּ בַּ/צִּיּ֥וֹת נָהָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/041.yaml
  text: He opened the rock[a], and water gushed out; they flowed through the dry places like a river.
translation:
  language: de
  text: Er öffnete den Felsen, da strömte Wasser hervor; wie ein Fluss floss es durch dürres Land.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische lautet knapp: „Sie flossen in den dürren Gegenden – ein Fluss.“ Es setzt kein ausdrückliches „wie“; die Schlussfügung kann das Wasser als Fluss kennzeichnen oder einen Vergleich nahelegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַח
  choice: öffnete
  rationale: Die Grundbedeutung ist „öffnen“. Das wahrt das Bild des Hebräischen, ohne mit „spalten“ eine stärkere Vorstellung einzutragen.
- source_word: צוּר
  choice: den Felsen
  rationale: Obwohl im Hebräischen kein Artikel steht, ist der aus der Wüstenüberlieferung bekannte Felsen kontextuell bestimmt.
- source_word: וַיָּז֣וּבוּ מָיִם
  choice: da strömte Wasser hervor
  rationale: Das Verb bezeichnet das Hervorfließen. „strömte … hervor“ vermittelt die kräftige Wasserbewegung natürlich; deutsches „Wasser“ wird als Stoffbezeichnung im Singular aufgenommen.
- source_word: הָלְכוּ
  choice: floss es
  rationale: Wörtlich „sie gingen“ mit den Wassern als Subjekt; im Deutschen gibt „floss es“ die Bewegung idiomatisch wieder und bezieht sich auf „Wasser“.
- source_word: בַּצִּיּוֹת
  choice: durch dürres Land
  rationale: Der Ausdruck bezeichnet ausgetrocknete, dürre Gegenden. Der kollektive Singular ist im Deutschen poetisch und verständlich und gibt die Bewegung durch das Gelände wieder.
- source_word: נָהָר
  choice: wie ein Fluss
  rationale: Das artikellose Schlusswort kann prädikativ beziehungsweise appositionell verstanden werden. Die explizite Vergleichspartikel macht den wahrscheinlichen Sinn im Deutschen klar, ohne die knappere hebräische Fügung zu verschweigen.
theological_decisions:
- issue: Bezug auf Gottes Versorgung Israels in der Wüste
  choice: Der Vers wird als geschichtlich-poetische Schilderung des Wassers aus dem Felsen übersetzt.
  alternative: Allgemeines Sinnbild göttlicher Versorgung
  rationale: Psalm 105 erzählt Israels Geschichte nach. Daher steht das Wüstenereignis im Vordergrund; eine weitergehende theologische Bedeutung bleibt unausgesprochen möglich.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischem Rhythmus. „Da“ bildet die unmittelbare Folge ab; die Wortstellung „wie ein Fluss floss es“ hebt das starke Schlussbild hervor.
