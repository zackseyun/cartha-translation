source:
  edition: WLC
  text: הִֽ֭תְהַלְלוּ בְּ/שֵׁ֣ם קָדְשׁ֑/וֹ יִ֝שְׂמַ֗ח לֵ֤ב מְבַקְשֵׁ֬י יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/003.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: de
  text: Rühmt euch seines heiligen Namens[a]; das Herz derer, die Jahwe suchen, freue sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Frohlockt über seinen heiligen Namen.“ Das hebräische Verb kann sowohl freudiges Sich-Rühmen als auch Frohlocken ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: Rühmt euch
  rationale: Der Hitpael-Imperativ von הלל bezeichnet hier ein freudiges Sich-Rühmen oder Frohlocken. „Rühmt euch“ bewahrt die reflexive Form und lässt den heiligen Namen als Grund des Rühmens hervortreten.
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: seines heiligen Namens
  rationale: Der deutsche Genitiv nach „sich rühmen“ gibt die hebräische Verbindung mit ב idiomatisch wieder. „Name“ bleibt ausdrücklich stehen und bezeichnet im Kontext zugleich Gottes offenbarten Ruf und Charakter.
- source_word: יִשְׂמַח
  choice: freue sich
  rationale: Das morphologische Imperfekt hat im poetischen Zusammenhang einen jussivischen Sinn und setzt die Aufforderung des ersten Halbverses als Wunsch oder Aufruf fort.
- source_word: לֵב
  choice: das Herz
  rationale: Der kollektive Singular des Hebräischen wird beibehalten. Er bezeichnet das innere Denken, Wollen und Empfinden der Suchenden, nicht nur ein einzelnes Gefühl.
- source_word: מְבַקְשֵׁי יְהוָה
  choice: derer, die Jahwe suchen
  rationale: Das Partizip beschreibt Menschen, deren fortdauernde Haltung darin besteht, Jahwe zu suchen. Die Relativkonstruktion ist in modernem Deutsch natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen übliche Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch den traditionellen Ersatztitel zu verdecken.
- issue: Kollektiver Singular לֵב
  choice: das Herz derer, die Jahwe suchen
  alternative: die Herzen derer, die Jahwe suchen
  rationale: Der Singular des Ausgangstextes wird bewahrt und kollektiv verstanden. So bleibt die hebräische Rede vom gemeinsamen inneren Wesen der Suchenden erkennbar, ohne die Mehrzahl als sachlich falsch auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Rühmt euch“ bewahrt die prägnante Bildsprache des Hebräischen; „freue sich“ spiegelt den poetisch-jussivischen Ton. Der kollektive Singular „das Herz“ wurde bewusst erhalten.
