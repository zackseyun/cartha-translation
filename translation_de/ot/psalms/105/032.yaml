source:
  edition: WLC
  text: נָתַ֣ן גִּשְׁמֵי/הֶ֣ם בָּרָ֑ד אֵ֖שׁ לֶהָב֣וֹת בְּ/אַרְצָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/032.yaml
  text: He gave them hail for rain[a], and flaming fire in their land.
translation:
  language: de
  text: Er gab ihnen Hagel statt Regen und flammendes Feuer[a] in ihrem Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Blitze« oder »feurige Geschosse«; wörtlich etwa: »Flammenfeuer« oder »Feuer von Flammen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: Er gab
  rationale: Die Grundbedeutung von נתן ist »geben«. Die Wiedergabe bewahrt das hebräische Bild und drückt zugleich Gottes Verursachung des Geschehens aus.
- source_word: גִּשְׁמֵיהֶם בָּרָד
  choice: ihnen Hagel statt Regen
  rationale: Wörtlich steht etwa »ihren Regen [als] Hagel«. Die deutsche Formulierung macht natürlich verständlich, dass Hagel an die Stelle ihres gewöhnlichen Regens trat.
- source_word: בָּרָד
  choice: Hagel
  rationale: Dies ist die übliche und eindeutige Bedeutung des hebräischen Substantivs und verweist im Kontext auf die ägyptische Plage.
- source_word: אֵשׁ לֶהָבוֹת
  choice: flammendes Feuer
  rationale: Die Wortverbindung lautet wörtlich etwa »Feuer von Flammen« beziehungsweise »Flammenfeuer«. »Flammendes Feuer« gibt die poetische Verstärkung in natürlichem Deutsch wieder, ohne sie vorschnell auf Blitze einzuengen.
- source_word: בְּאַרְצָם
  choice: in ihrem Land
  rationale: Die Präposition ב wird hier sachgerecht mit »in« wiedergegeben; das Land ist im Zusammenhang Ägypten.
theological_decisions:
- issue: Art des אֵשׁ לֶהָבוֹת im Zusammenhang der Hagelplage
  choice: flammendes Feuer
  alternative: Blitze; feurige Geschosse
  rationale: Der Zusammenhang mit der Hagelplage kann an Blitze denken lassen, doch der hebräische Wortlaut spricht allgemein von Feuer und Flammen. Der Haupttext bewahrt dieses weitere Bild; die kontextuelle Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Kürze bleibt erhalten; »statt Regen« verdeutlicht die knappe hebräische Konstruktion, ohne die Bildaussage auszubauen.
