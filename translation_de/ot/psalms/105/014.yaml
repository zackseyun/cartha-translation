base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/014.yaml
  text: He allowed no man to oppress them[a]; he rebuked kings on their account,
translation:
  language: de
  text: Er ließ nicht zu, dass jemand sie unterdrückte, und wies Könige ihretwegen zurecht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנִּיחַ
  choice: ließ nicht zu
  rationale: Das Hifil von נוח bezeichnet hier das Zulassen einer Handlung. Die deutsche Wendung „ließ nicht zu“ ist natürlich und bildet die Verneinung sowie die folgende Infinitivkonstruktion klar ab.
- source_word: אָדָם
  choice: jemand
  rationale: Der singularische, generische Gebrauch meint hier irgendeinen Menschen. „Jemand“ gibt diese uneingeschränkte Bedeutung im heutigen Deutschen natürlicher wieder als „ein Mann“.
- source_word: לְעָשְׁקָם
  choice: dass jemand sie unterdrückte
  rationale: עשק bezeichnet bedrücken, ausbeuten oder Unrecht zufügen. „Unterdrückte“ bewahrt den breiten und starken Sinn; der deutsche dass-Satz ist idiomatischer als eine wörtliche Infinitivkonstruktion.
- source_word: וַיּוֹכַח
  choice: wies … zurecht
  rationale: יכח bezeichnet hier Gottes tadelndes oder zurechtweisendes Eingreifen gegenüber Königen. „Zurechtweisen“ ist verständlich, würdig und ausreichend bestimmt, ohne ausschließlich eine verbale Form des Eingreifens festzulegen.
- source_word: עֲלֵיהֶם
  choice: ihretwegen
  rationale: 'על mit Suffix bezeichnet hier den Anlass beziehungsweise den Bezug des göttlichen Eingreifens: Gott wies Könige wegen beziehungsweise zugunsten der Genannten zurecht. „Ihretwegen“ erhält diese relationale Offenheit knapp und natürlich.'
- source_word: מְלָכִים
  choice: Könige
  rationale: Das Substantiv bezeichnet ausdrücklich Könige; eine Verallgemeinerung zu „Herrschern“ ist nicht erforderlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Parallelismus, während „jemand“ den generischen Singular idiomatisch wiedergibt. Für עֲלֵיהֶם ist „ihretwegen“ bewusst ohne Fußnote gewählt, da es sowohl den Anlass als auch das Handeln zu ihren Gunsten anklingen lässt.
