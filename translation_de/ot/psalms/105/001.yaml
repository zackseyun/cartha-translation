id: PSA.105.1
reference: Psalms 105:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הוֹד֣וּ לַ֭/יהוָה קִרְא֣וּ בִּ/שְׁמ֑/וֹ הוֹדִ֥יעוּ בָ֝/עַמִּ֗ים עֲלִילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/001.yaml
  text: Give thanks to Yahweh[a]; call on his name; make his deeds known among the peoples.
translation:
  language: de
  text: Dankt Jahwe[a], ruft seinen Namen an; macht unter den Völkern seine Taten bekannt!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH, der Eigenname Gottes; die genaue antike Aussprache ist nicht sicher überliefert. Traditionell wird der Name häufig mit „der HERR“ wiedergegeben.'
    reason: Namensform und traditionelle Alternativwiedergabe erläutern
lexical_decisions:
- source_word: הוֹדוּ
  choice: Dankt
  rationale: Der Hifil-Imperativ Plural von ידה bezeichnet in diesem Lobpreiszusammenhang das Danken bzw. Preisen. „Dankt“ ist knapp, natürlich und passt zur Verbindung mit לַיהוָה.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל kennzeichnet den Empfänger des Dankes. Der Gottesname יהוה wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben.
- source_word: קִרְאוּ בִּשְׁמוֹ
  choice: ruft seinen Namen an
  rationale: קרא mit בְּשֵׁם bedeutet hier, jemanden unter Nennung seines Namens anzurufen. Die Formulierung bewahrt den Gebets- und Gottesdienstbezug und klingt im Deutschen natürlich.
- source_word: הוֹדִיעוּ
  choice: macht … bekannt
  rationale: 'Der Hifil-Imperativ von ידע hat kausative Bedeutung: andere etwas wissen lassen. „Bekannt machen“ gibt diese Bedeutung direkt und verständlich wieder.'
- source_word: בָעַמִּים
  choice: unter den Völkern
  rationale: Die Präposition ב wird räumlich-sozial mit „unter“ wiedergegeben; עַמִּים bezeichnet Völker bzw. Volksgruppen und trägt hier eine internationale Weite.
- source_word: עֲלִילוֹתָיו
  choice: seine Taten
  rationale: עֲלִילוֹת bezeichnet Handlungen oder Taten. „Taten“ bleibt breit genug und fügt die im Wort selbst nicht ausdrücklich enthaltene Wertung „mächtig“ nicht hinzu.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen; die Schreibweise entspricht der im Deutschen geläufigen Form, ohne die unsichere antike Aussprache als völlig geklärt darzustellen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei pluralischen Aufforderungen bleiben erhalten; das Semikolon bildet die hebräische Reihung übersichtlich ab. „Jahwe“ folgt deutscher Schreibkonvention, während die Fußnote die textliche Form und die traditionelle Wiedergabe transparent macht.
