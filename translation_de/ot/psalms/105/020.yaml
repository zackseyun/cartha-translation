    text: 'Wörtlich: „öffnete ihn“ oder „öffnete für ihn“; gemeint ist die Befreiung aus der Gefangenschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: sandte hin
  rationale: Das Qal-Perfekt bedeutet gewöhnlich „senden“. Da im Hebräischen kein Objekt genannt wird, bewahrt „sandte hin“ diese knappe Ausdrucksweise, ohne „Boten“ oder „nach ihm“ zu ergänzen.
- source_word: מֶלֶךְ
  choice: der König
  rationale: 'Obwohl das Substantiv in der hebräischen Poesie artikellos steht, ist der gemeinte König aus dem Zusammenhang bestimmt: der Pharao.'
- source_word: וַיַּתִּירֵהוּ
  choice: ließ ihn frei
  rationale: Das Verb bezeichnet hier das Losmachen beziehungsweise Freilassen aus der Gefangenschaft; die Formulierung ist im modernen Deutsch natürlich.
- source_word: מֹשֵׁל עַמִּים
  choice: der Herrscher über Völker
  rationale: Der substantivierte Partizipialausdruck bezeichnet einen Herrscher; der Plural עַמִּים wird mit „Völker“ bewahrt.
- source_word: וַיְפַתְּחֵהוּ
  choice: entließ ihn aus der Haft
  rationale: פתח bedeutet wörtlich „öffnen“. Mit einer Person als Objekt bezeichnet es hier idiomatisch deren Befreiung aus dem Gewahrsam; „aus der Haft“ macht den im Bild vorausgesetzten Zusammenhang verständlich.
