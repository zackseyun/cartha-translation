  text: The king sent and released him[b][a]; the ruler of peoples set him free.
translation:
  language: de
  text: Der König ließ ihn holen und ließ ihn frei[a]; der Herrscher über Völker entließ ihn aus der Haft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „machte ihn los“ beziehungsweise „befreite ihn“.'
