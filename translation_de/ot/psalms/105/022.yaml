  text: לֶ/אְסֹ֣ר שָׂרָ֣י/ו בְּ/נַפְשׁ֑/וֹ וּ/זְקֵנָ֥י/ו יְחַכֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/022.yaml
  text: to bind his princes at his pleasure[b][a], and to teach his elders wisdom.
translation:
  language: de
  text: seine Fürsten nach seinem Willen zu binden[a] und seine Ältesten Weisheit zu lehren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seine Fürsten mit/durch seine Seele zu binden“; die hebräische Wendung bedeutet hier wahrscheinlich „nach seinem Willen“ oder „nach seinem Belieben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine Ältesten weise zu machen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאְסֹר
  choice: zu binden
  rationale: Der Infinitiv von אסר bezeichnet hier das Binden oder Einschränken und setzt die Zweck- bzw. Folgeaussage des vorangehenden Verses fort. „Binden“ bewahrt die Bildsprache und bleibt hinreichend weit.
- source_word: שָׂרָיו
  choice: seine Fürsten
  rationale: שַׂר kann einen Fürsten, Obersten oder hohen Beamten bezeichnen. Im königlichen Hofkontext erhält „Fürsten“ den gehobenen politischen Sinn.
- source_word: בְּנַפְשׁוֹ
  choice: nach seinem Willen
  rationale: Wörtlich steht „mit/durch seine Seele“. נֶפֶשׁ kann idiomatisch Wunsch oder Willen bezeichnen; „nach seinem Willen“ gibt diesen Sinn in natürlichem, würdigem Deutsch wieder, ohne die hebräische Wendung unnötig zu verengen.
- source_word: וּזְקֵנָיו
  choice: und seine Ältesten
  rationale: זָקֵן bezeichnet wörtlich einen älteren Menschen und im politischen Zusammenhang einen Ältesten bzw. führenden Würdenträger. „Älteste“ bewahrt beide Bedeutungsanteile.
- source_word: יְחַכֵּם
  choice: Weisheit zu lehren
  rationale: Die Piel-Form von חכם kann „weise machen“ oder „Weisheit lehren“ bedeuten. Die gewählte Formulierung ist klar und erhält den unterweisenden bzw. verursachenden Sinn.
