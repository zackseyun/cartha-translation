id: PSA.105.5
reference: Psalms 105:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זִכְר֗וּ נִפְלְאוֹתָ֥י/ו אֲשֶׁר עָשָׂ֑ה מֹ֝פְתָ֗י/ו וּ/מִשְׁפְּטֵי פִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/005.yaml
  text: Remember the wonders that he has done[a], his signs and the judgments of his mouth[c][b],
translation:
  language: de
  text: Denkt an die Wunder, die er getan hat,[a] an seine Zeichen[b] und an die Urteile seines Mundes.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Wundertaten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine Wunderzeichen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die Rechtssprüche, die er verkündet hat“; auch: „die Anordnungen aus seinem Mund“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Denkt an
  rationale: Der pluralische Imperativ fordert zu aktivem Erinnern auf. „Denkt an“ ist im modernen Deutsch natürlich und direkt.
- source_word: נִפְלְאוֹתָיו אֲשֶׁר עָשָׂה
  choice: die Wunder, die er getan hat
  rationale: נִפְלָאוֹת bezeichnet außergewöhnliche, Staunen hervorrufende Taten; der Relativsatz wird eng am Hebräischen wiedergegeben.
- source_word: מֹפְתָיו
  choice: seine Zeichen
  rationale: מוֹפֵת bezeichnet ein Zeichen oder Wunderzeichen, das Gottes Handeln sichtbar macht. „Zeichen“ wahrt die Breite des Begriffs.
- source_word: וּמִשְׁפְּטֵי פִיו
  choice: und an die Urteile seines Mundes
  rationale: Die wörtliche Wiedergabe erhält das poetische Bild und lässt offen, ob מִשְׁפָּט hier Urteile, Rechtssprüche oder Anordnungen meint.
- source_word: פִיו
  choice: seines Mundes
  rationale: Die konkrete anthropomorphe Ausdrucksweise des Hebräischen bleibt bewahrt.
theological_decisions:
- issue: Verhältnis von נִפְלְאוֹת und מֹפְתִים
  choice: Unterschiedliche, sich überschneidende Begriffe als „Wunder“ und „Zeichen“
  alternative: „Wundertaten“ und „Wunderzeichen“
  rationale: Die poetische Häufung wird erhalten, ohne daraus starre theologische Kategorien zu machen.
- issue: Bedeutung von מִשְׁפְּטֵי פִיו
  choice: „die Urteile seines Mundes“
  alternative: „die Rechtssprüche, die er verkündet hat“ oder „die Anordnungen aus seinem Mund“
  rationale: Die wörtliche Fassung bewahrt Bildsprache und Bedeutungsbreite, statt die Aussage vorschnell auf richterliche Urteile oder verbindliche Satzungen festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und das hebräische Bild vom Mund Gottes bleiben erhalten; die Fußnoten dokumentieren wesentliche lexikalische Alternativen.
