base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/028.yaml
  text: He sent darkness and made it dark[a], and they did not rebel against his words.
translation:
  language: de
  text: Er sandte Finsternis und machte es dunkel; und sie widersetzten sich seinem Wort nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wer mit „sie“ gemeint ist, wird im Hebräischen nicht ausdrücklich gesagt; manche beziehen es auf die Ägypter, andere auf Mose und Aaron. „Seinem Wort“ kann sinngemäß auch als „seinem Befehl“ verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלַח
  choice: sandte
  rationale: Die übliche und im poetisch-geschichtlichen Zusammenhang natürliche Wiedergabe des Verbs.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: Bezeichnet hier die Finsternis der ägyptischen Plage; „Finsternis“ ist würdevoll und im biblischen Kontext eindeutig.
- source_word: וַיַּחְשִׁךְ
  choice: machte es dunkel
  rationale: Gibt die verursachende Bedeutung der Verbform natürlich wieder und lässt Gott als handelndes Subjekt erkennen.
- source_word: וְלֹא
  choice: und … nicht
  rationale: Bewahrt die einfache hebräische Verknüpfung, ohne einen stärkeren Gegensatz einzutragen.
- source_word: מָרוּ
  choice: widersetzten sich
  rationale: Das Verb bezeichnet Auflehnung beziehungsweise Ungehorsam. „Sich widersetzen“ ist im modernen Deutschen natürlich und lässt den genauen Grad der Auflehnung offen.
- source_word: אֶת־דבריו
  choice: seinen Worten
  rationale: Folgt der im vorgelegten Quelltext bezeugten pluralischen Auffassung; die mögliche singularische Deutung wird in der Fußnote genannt.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von „sie widersetzten sich nicht“
  choice: Das unbestimmte „sie“ bleibt im Haupttext erhalten.
  alternative: Ausdrückliche Identifizierung entweder mit den Ägyptern oder mit Mose und Aaron.
  rationale: Das Hebräische nennt das Subjekt nicht ausdrücklich. Eine Festlegung würde eine umstrittene Deutung in den Text eintragen.
- issue: Numerus und Sinn von „Wort/Worte“
  choice: Im Haupttext steht „seinen Worten“.
  alternative: „seinem Wort“ oder deutend „seinem Befehl“.
  rationale: Die vorgelegte Textgrundlage und Konsultationsschicht stützen die pluralische Wiedergabe; die mögliche singularische beziehungsweise befehlsbezogene Auffassung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Semikolon bildet die beiden hebräisch koordinierten Aussagen übersichtlich ab. Die genuine Unbestimmtheit des pluralischen Subjekts wird nicht aufgelöst.
