source:
  edition: WLC
  text: שָֽׂמוּ בָ֭/ם דִּבְרֵ֣י אֹתוֹתָ֑י/ו וּ֝/מֹפְתִ֗ים בְּ/אֶ֣רֶץ חָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/027.yaml
  text: They performed among them the words of his signs[c][b][a], and wonders in the land of Ham.
translation:
  language: de
  text: Sie vollführten unter ihnen seine Zeichen[a] und Wunder im Land Hams[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »die Worte seiner Zeichen«; דָּבָר kann auch »Sache«, »Angelegenheit« oder »Geschehen« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Das »Land Hams« ist hier eine poetische Bezeichnung für Ägypten.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂמוּ
  choice: vollführten
  rationale: שׂוּם bedeutet gewöhnlich »setzen, stellen, legen«; in Verbindung mit Zeichen und Wundern bezeichnet es hier deren Ausführung bzw. Vollbringung. »Vollführten« gibt diesen idiomatischen Sinn natürlich wieder.
- source_word: בָם
  choice: unter ihnen
  rationale: Die Präposition ב mit dem pluralischen Suffix verweist im Zusammenhang auf die Ägypter und bezeichnet ihren Lebensbereich bzw. ihre Mitte.
- source_word: דִּבְרֵי אֹתוֹתָיו
  choice: seine Zeichen
  rationale: Die ungewöhnliche hebräische Verbindung lautet formal »die Worte/Sachen seiner Zeichen«. Im Deutschen wäre diese Formulierung missverständlich; im Haupttext wird sie idiomatisch als »seine Zeichen« wiedergegeben, während die formale und semantische Mehrdeutigkeit in der Fußnote erhalten bleibt.
- source_word: וּמֹפְתִים
  choice: und Wunder
  rationale: מוֹפֵת bezeichnet ein staunenerregendes Zeichen oder Wunder und bildet hier die geläufige Paarung »Zeichen und Wunder«.
- source_word: בְּאֶרֶץ חָם
  choice: im Land Hams
  rationale: Die poetische Bezeichnung wird beibehalten und nicht im Haupttext durch »Ägypten« ersetzt.
theological_decisions:
- issue: Bedeutung der ungewöhnlichen Wendung דִּבְרֵי אֹתוֹתָיו
  choice: Im Haupttext idiomatisch »seine Zeichen«, mit einer Fußnote zur wörtlichen Wendung
  alternative: »die Worte seiner Zeichen« oder »die Angelegenheiten seiner Zeichen«
  rationale: Die formale Wiedergabe klingt im Deutschen unverständlich und könnte fälschlich nahelegen, die Zeichen selbst hätten gesprochen. Zugleich darf die im Hebräischen vorhandene Spannung zwischen »Worten«, »Angelegenheiten« und ausgeführten Zeichen nicht verschwinden; deshalb wird sie ausdrücklich in der Fußnote dokumentiert.
- issue: Identität des Landes Ham
  choice: Die poetische Bezeichnung »Land Hams« bleibt im Text erhalten
  alternative: »Ägypten«
  rationale: Der unmittelbare Psalmzusammenhang meint Ägypten, doch die bildhafte genealogisch-poetische Bezeichnung des Ausgangstextes soll nicht ersetzt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Vollführten« ist leicht gehoben, aber verständlich und passt zum poetischen Register des Psalms. Die ungewöhnliche hebräische Konstruktion wird nicht durch eine schwer verständliche Lehnstruktur in den Haupttext übernommen, sondern transparent in einer Fußnote ausgewiesen.
