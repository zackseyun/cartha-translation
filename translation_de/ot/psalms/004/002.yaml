  source_fidelity: Die Übersetzung gibt die hebräische Anrede בני איש idiomatisch als „Ihr Männer“ wieder und bewahrt deren direkte, an männliche Gegner gerichtete Form. „Wie lange“ entspricht עד מה; „meine Ehre“ ist eine tragfähige Wiedergabe von כבודי im Kontext der Beschämung. „zur Schande werden“, „Nichtiges“, „Lüge“ und „Sela“ decken die hebräischen Ausdrücke angemessen ab. Die Wiederaufnahme von „Wie lange“ beim zweiten Fragesatz macht den vom ersten Fragesatz her bestehenden zeitlichen Vorwurf im Deutschen explizit, ohne den Sinn zu verändern.
  naturalness: Modernes, klares und zugleich würdiges Standarddeutsch. Die parallelen Fragen sind gut verständlich und behalten den knappen poetischen Charakter. „Ihr Männer“ ist als unmittelbare Anrede natürlich und weniger künstlich als eine wörtliche Übernahme von „Menschensöhne“.
  terminology: „Ehre“ wahrt bei כבוד die soziale und öffentliche Dimension, ohne die weiter mögliche Bedeutung „Herrlichkeit“ auszuschließen. Die Fußnote bietet diese Alternative sachgerecht an und legt weder den Referenten noch eine bestimmte theologische Deutung fest. „Sela“ ist zutreffend transliteriert, da seine Funktion unsicher ist.
