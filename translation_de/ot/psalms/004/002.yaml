  text: בְּנֵ֥י אִ֡ישׁ עַד מֶ֬ה כְבוֹדִ֣/י לִ֭/כְלִמָּה תֶּאֱהָב֣וּ/ן רִ֑יק תְּבַקְשׁ֖וּ כָזָ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/002.yaml
  text: Sons of men[a], how long will my honor be turned into shame? Will you love emptiness and seek falsehood? Selah
translation:
  language: de
  text: Ihr Männer, wie lange soll meine Ehre[a] noch zur Schande werden? Wie lange wollt ihr Nichtiges lieben und Lüge suchen? Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Herrlichkeit“. Das hebräische Wort kann Ehre, Herrlichkeit oder Ansehen bezeichnen; hier geht es wahrscheinlich um die öffentlich der Schande ausgesetzte Würde des Psalmisten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אִישׁ
  choice: Ihr Männer
  rationale: Die Anrede bezeichnet die männlichen Gegner. „Ihr Männer“ gibt Geschlecht, Anredeform und rhetorische Kraft in natürlichem modernem Deutsch wieder; das wörtliche „Menschensöhne“ wäre heute unnötig altertümlich und missverständlich.
- source_word: עַד מֶה
  choice: wie lange
  rationale: Die übliche deutsche Wiedergabe einer zeitlichen Protestfrage; „noch“ verstärkt idiomatisch den Gedanken des bereits andauernden Zustands.
- source_word: כְבוֹדִי
  choice: meine Ehre
  rationale: כָּבוֹד kann Ehre, Herrlichkeit oder gesellschaftliches Ansehen bezeichnen. Im Zusammenhang mit öffentlicher Schande passt „Ehre“, ohne den möglichen weiteren Sinn auszuschließen.
- source_word: לִכְלִמָּה
  choice: zur Schande werden
  rationale: Die knappe hebräische Nominalfügung lässt eine resultative Bedeutung erkennen. Die Formulierung macht sie im Deutschen verständlich, ohne den Verursacher ausdrücklich festzulegen.
- source_word: תֶּאֱהָבוּן
  choice: wollt ihr … lieben
  rationale: Das Imperfekt in der tadelnden Frage kann fortgesetztes oder künftig fortgesetztes Verhalten ausdrücken. „Wie lange wollt ihr“ bewahrt diesen vorwurfsvollen, offenen Aspekt in idiomatischem Deutsch.
- source_word: רִיק
  choice: Nichtiges
  rationale: Das substantivierte Adjektiv bezeichnet Leeres, Wertloses oder Vergebliches. „Nichtiges“ ist knapp und lässt sowohl inhaltliche Leere als auch Vergeblichkeit anklingen.
- source_word: תְּבַקְשׁוּ
  choice: suchen
  rationale: Direkte und im poetischen Parallelismus natürliche Wiedergabe von בקשׁ.
- source_word: כָזָב
  choice: Lüge
  rationale: Der abstrakte Singular wird bewahrt. „Lüge“ kann sowohl Unwahrheit als auch Täuschung bezeichnen und steht prägnant parallel zu „Nichtiges“.
- source_word: סֶלָה
  choice: Sela
  rationale: Die traditionelle Transliteration wird beibehalten, da Funktion und genaue Bedeutung des liturgisch-musikalischen Zeichens unsicher sind.
theological_decisions:
- issue: Bezug von „meine Ehre“
  choice: Die Formulierung legt nicht fest, ob die eigene Würde, königliche Stellung oder von Gott verliehene Ehre gemeint ist.
  alternative: meine Herrlichkeit; die Ehre, die Gott mir gegeben hat
  rationale: Der hebräische Ausdruck erlaubt einen breiten Sinn. Die Übersetzung bewahrt diese Mehrdeutigkeit und vermeidet eine zusätzliche theologische Festlegung.
- issue: Verursacher der Schande
  choice: „soll … zur Schande werden“ lässt offen, ob die Gegner die Ehre aktiv beschämen oder ob der Sprecher den Zustand beklagt.
  alternative: wie lange macht ihr meine Ehre zur Schande
  rationale: Im elliptischen Hebräisch steht kein ausdrückliches Verb. Die offene deutsche Formulierung ergänzt das sprachlich Nötige, ohne die syntaktische Beziehung stärker festzulegen als der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. „Ihr Männer“ vermeidet das heute künstliche „Menschensöhne“; „Sela“ bleibt wegen seiner unsicheren Bedeutung unübersetzt.
