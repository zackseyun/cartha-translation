  text: רִגְז֗וּ וְֽ/אַל תֶּ֫חֱטָ֥אוּ אִמְר֣וּ בִ֭/לְבַבְ/כֶם עַֽל מִשְׁכַּבְ/כֶ֗ם וְ/דֹ֣מּוּ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/004.yaml
  text: Tremble[a], and do not sin; speak in your hearts on your beds, and be still[b]. Selah
translation:
  language: de
  text: Zittert[a] und sündigt nicht; sprecht in euren Herzen auf euren Betten und schweigt[b]. Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seid zornig und sündigt nicht.“ Das hebräische Verb kann Erregung, Zittern oder Zorn bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „und seid still“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִגְזוּ
  choice: Zittert
  rationale: רגז kann körperliches oder inneres Beben, Erregung oder auch Zorn bezeichnen. „Zittert“ bewahrt hier die emotionale Erschütterung, ohne sie vorschnell auf Zorn festzulegen.
- source_word: וְאַל תֶּחֱטָאוּ
  choice: und sündigt nicht
  rationale: Die verneinte Aufforderung mit חטא wird unmittelbar und idiomatisch wiedergegeben.
- source_word: אִמְרוּ בִלְבַבְכֶם
  choice: Sprecht in eurem Herzen
  rationale: Die Formulierung wahrt das konkrete Verb אמר („sagen, sprechen“) und die hebräische Vorstellung vom Herzen als innerem Ort des Denkens und Wollens. Der distributive Singular „eurem Herzen“ ist im Deutschen natürlicher als „euren Herzen“.
- source_word: עַל מִשְׁכַּבְכֶם
  choice: auf eurem Lager
  rationale: Die Wendung bezeichnet den Ruhe- oder Schlafplatz. Der deutsche distributive Singular entspricht dem hebräischen Substantiv im Singular mit pluralischem Possessivsuffix und klingt würdig und natürlich.
- source_word: וְדֹמּוּ
  choice: und schweigt
  rationale: דמם bezeichnet das Verstummen beziehungsweise Stillwerden. „Schweigt“ schließt unmittelbar an die Aufforderung zum inneren Reden an und bewahrt den Gegensatz zwischen innerer Rede und äußerem Schweigen.
- source_word: סֶלָה
  choice: Sela
  rationale: Die genaue Bedeutung des liturgisch-musikalischen Ausdrucks ist unsicher; daher wird er in der üblichen Form transliteriert.
theological_decisions:
- issue: Bedeutung von רגז innerhalb der moralischen Aufforderung
  choice: Aufforderung zum Zittern oder Erbeben, das nicht zur Sünde führen soll
  alternative: „Seid zornig und sündigt nicht“
  rationale: Das Verb lässt sowohl Erschütterung beziehungsweise Zittern als auch Zorn zu. Der Zusammenhang mit innerer Selbstprüfung und anschließendem Schweigen begünstigt die weitere Bedeutung „zittern“, ohne die traditionsreiche Zorn-Deutung auszuschließen.
- issue: Art der inneren Tätigkeit in אִמְרוּ בִלְבַבְכֶם
  choice: Das bildhafte innere Sprechen bleibt im Haupttext erhalten
  alternative: „Denkt in eurem Herzen nach“ oder „Besinnt euch“
  rationale: אמר bedeutet konkret „sagen/sprechen“. Eine rein deutende Wiedergabe als Nachdenken wäre flüssiger, würde aber das hebräische Bild und seine Offenheit stärker festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit maßvoll bewahrter hebräischer Bildsprache. „Lager“ hält den poetischen Ton des Psalms, während Satzbau und Verben für heutige Leser verständlich bleiben.
