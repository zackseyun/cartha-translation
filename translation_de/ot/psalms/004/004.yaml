  source_fidelity: Die Grundübersetzung gibt die Imperative und die Bedeutungsweite von רִגְזוּ angemessen wieder. Die Fußnote zu „Zittert“ bewahrt zutreffend die mögliche Deutung „Seid zornig“. Für die pluralische Anrede sind bei den inneren und häuslichen Orten im Deutschen jedoch Pluralformen klarer und weniger gemeinschaftlich missverständlich.
  naturalness: „Sprecht in euren Herzen“ ist als bewusst poetisch-biblische Wiedergabe des hebräischen Bildes verständlich. „Auf euren Betten“ ist im modernen Standarddeutsch klarer als „auf eurem Lager“, das leicht einen gemeinsamen Lagerplatz oder ein Lager im Sinn von Camp bezeichnen kann. Das Semikolon gliedert die beiden Aufforderungsfolgen idiomatisch.
  terminology: „Sündigt“, „schweigt“ und „Sela“ sind passend. Die Alternative zu דמם sollte mit „seid still“ den Zustand des Stillwerdens bezeichnen, ohne die Hauptübersetzung „schweigt“ zu verdoppeln.
