    issue: Distributive Singularformen „eurem Herzen“ und „eurem Lager“ können eine gemeinsame Innenhaltung beziehungsweise einen gemeinsamen Lagerplatz nahelegen.
    rationale: Die hebräischen Suffixe richten sich an mehrere Personen. Deutsche Pluralformen („euren Herzen“, „euren Betten“) machen die individuelle Verteilung in der pluralischen Anrede klar und sind hier natürlicher.
  - severity: low
    issue: „Lager“ ist im heutigen Deutsch mehrdeutig.
    rationale: Neben dem poetischen Ruheplatz kann es ein Camp oder eine Aufbewahrungsstätte meinen. „Betten“ gibt den Kontext von מִשְׁכָּב klar und modern wieder.
