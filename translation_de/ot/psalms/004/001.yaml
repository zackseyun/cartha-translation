id: PSA.4.1
reference: Psalms 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/קָרְאִ֡/י עֲנֵ֤/נִי אֱלֹ֘הֵ֤י צִדְקִ֗/י בַּ֭/צָּר הִרְחַ֣בְתָּ לִּ֑/י חָ֝נֵּ֗/נִי וּ/שְׁמַ֥ע תְּפִלָּתִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/001.yaml
  text: When I call[a], answer me, O God of my righteousness. In distress you have made room for me[b]. Be gracious to me and hear my prayer.
translation:
  language: de
  text: Wenn ich rufe, antworte mir, Gott meiner Gerechtigkeit.[a] In der Bedrängnis hast du mir Raum geschaffen.[b] Sei mir gnädig und höre mein Gebet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein gerechter Gott“ oder „Gott, der mir Recht verschafft“. Wörtlich lautet das Hebräische: „Gott meiner Gerechtigkeit“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „hast du mir Erleichterung verschafft“. Das hebräische Bild ist räumlich: Gott schafft Weite aus Bedrängnis oder Enge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקָרְאִי
  choice: Wenn ich rufe
  rationale: Die Präposition ב mit Infinitivus constructus und Suffix der 1. Person Singular ist hier temporal zu verstehen. „Rufe“ bleibt nahe am hebräischen קרא, ohne die stärkere Gefühlsbetonung von „schreie“ einzutragen.
- source_word: עֲנֵנִי
  choice: antworte mir
  rationale: ענה bezeichnet hier die erbetene Antwort Gottes und wird im Deutschen natürlich mit „antworte mir“ wiedergegeben.
- source_word: אֱלֹהֵי צִדְקִי
  choice: Gott meiner Gerechtigkeit
  rationale: Die formnahe Wiedergabe der Status-constructus-Verbindung bewahrt offen, ob Gott als Ursprung der Gerechtigkeit des Beters, als dessen Rechtfertiger oder in verwandter Weise bezeichnet wird.
- source_word: בַּצָּר
  choice: In der Bedrängnis
  rationale: צַר bezeichnet Bedrängnis oder Enge. „Bedrängnis“ gibt die Notsituation würdig und verständlich wieder und lässt zugleich den Gegensatz zur folgenden Weite erkennen.
- source_word: הִרְחַבְתָּ לִּי
  choice: hast du mir Raum geschaffen
  rationale: Der Hifil von רחב bedeutet wörtlich „weit machen“. Die Formulierung bewahrt das räumliche Bild der Befreiung aus Enge und klingt zugleich natürlich.
- source_word: חָנֵּנִי
  choice: Sei mir gnädig
  rationale: חנן bedeutet grundlegend, Gunst oder Gnade zu erweisen. „Sei mir gnädig“ ist präzise und entspricht dem Gebetsregister.
- source_word: וּשְׁמַע
  choice: und höre
  rationale: שׁמע bezeichnet im Gebet ein aufmerksames Hören; „höre“ ist die knappe und traditionelle, weiterhin verständliche Wiedergabe.
- source_word: תְּפִלָּתִי
  choice: mein Gebet
  rationale: תְּפִלָּה ist die gewöhnliche Bezeichnung für ein Gebet; die direkte Wiedergabe ist im Deutschen natürlich.
theological_decisions:
- issue: Bedeutung von אֱלֹהֵי צִדְקִי („Gott meiner Gerechtigkeit“)
  choice: Die formale Wendung „Gott meiner Gerechtigkeit“ steht im Haupttext.
  alternative: „mein gerechter Gott“ oder „Gott, der mir Recht verschafft“
  rationale: Die hebräische Genitivverbindung legt nicht eindeutig fest, ob die Gerechtigkeit als Gabe beziehungsweise Grundlage des Beters oder als Gottes rechtverschaffendes Handeln verstanden werden soll. Die formnahe Wiedergabe bewahrt diese theologische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Die räumliche Gegenüberstellung von Bedrängnis und geschaffenem Raum bleibt erhalten; ungewöhnliche, theologisch offene hebräische Ausdrucksweise wird nicht vorschnell geglättet.
