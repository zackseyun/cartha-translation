  text: רַבִּ֥ים אֹמְרִים֮ מִֽי יַרְאֵ֪/נ֫וּ ט֥וֹב נְֽסָ/ה עָ֭לֵי/נוּ א֨וֹר פָּנֶ֬י/ךָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/006.yaml
  text: Many are saying[a], “Who will show us good? Lift up the light of your face upon us[c][b], O Yahweh.”
translation:
  language: de
  text: 'Viele sagen: »Wer lässt uns Gutes sehen? Lass das Licht deines Angesichts über uns leuchten, Jahwe!«[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wer wird uns Gutes zeigen?« Das hebräische Verb ist kausativ: »sehen lassen, zeigen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »das Licht deines Angesichts« – ein poetisches Bild für Gottes gnädige Zuwendung und Gegenwart. Die zugrunde liegende Verbform ist selten und textlich schwierig; möglich ist auch: »Erhebe über uns das Licht deines Angesichts« beziehungsweise »Lass es über uns aufstrahlen«.'
    reason: textual_and_lexical_ambiguity
lexical_decisions:
- source_word: רַבִּים אֹמְרִים
  choice: Viele sagen
  rationale: רַבִּים wird substantivisch gebraucht; das Partizip אֹמְרִים bezeichnet hier gegenwärtiges beziehungsweise charakteristisches Reden. Das natürliche deutsche Präsens gibt dies angemessen wieder.
- source_word: מִי יַרְאֵנוּ טוֹב
  choice: Wer lässt uns Gutes sehen?
  rationale: Die Hifil-Form von ראה ist kausativ. „Gutes sehen lassen“ bewahrt diese Struktur und lässt טוֹב bewusst in seinem weiten Sinn zwischen Wohlergehen, Nutzen und Gutem stehen.
- source_word: נְסָה עָלֵינוּ אוֹר פָּנֶיךָ
  choice: Lass das Licht deines Angesichts über uns leuchten
  rationale: Die schwierige Verbform wird im Zusammenhang mit dem Licht idiomatisch als Bitte um dessen Aufleuchten verstanden. „Angesicht“ bewahrt das poetische Bild der göttlichen Zuwendung; „über uns leuchten“ ist im modernen Deutsch natürlicher als ein wörtliches „erhebe über uns“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname YHWH wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
theological_decisions:
- issue: Bild vom Licht des göttlichen Angesichts
  choice: Das Bild wird als „Licht deines Angesichts“ beibehalten.
  alternative: Schenke uns deine Gunst / Lass deine Gegenwart über uns leuchten.
  rationale: Die Metapher bezeichnet Gottes gnädige Zuwendung und Gegenwart, soll aber im Haupttext nicht auf eine einzelne Deutung reduziert werden.
- issue: Deutung der Sprecherhaltung
  choice: Frage und Bitte bleiben in einer gemeinsamen direkten Rede.
  alternative: Nur die Frage als Rede der Vielen verstehen und die Bitte als eigene Antwort des Psalmisten absetzen.
  rationale: Der hebräische Wortlaut markiert keinen eindeutigen Sprecherwechsel. Die gewählte Zeichensetzung wahrt den unmittelbaren Zusammenhang, ohne die Haltung der „Vielen“ näher festzulegen.
- issue: Wiedergabe des Tetragramms
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen יהוה; die Transliteration erhält diese Unterscheidung gegenüber einem bloßen Titel.
translation_notes:
  register: Moderne, würdige Psalmsprache. „Angesicht“ ist bewusst poetischer als „Gesicht“, bleibt aber allgemein verständlich. „Jahwe“ gibt den Gottesnamen יהוה wieder. Die direkte Rede umfasst sowohl die Frage als auch die anschließende Bitte.
