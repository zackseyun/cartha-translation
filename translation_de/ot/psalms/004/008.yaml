base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/008.yaml
  text: In peace I will both lie down and sleep[a], for you alone, O Yahweh[b], make me dwell in safety.
translation:
  language: de
  text: In Frieden lege ich mich nieder und schlafe zugleich[a]; denn du allein, Jahwe[b], lässt mich sicher wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In Frieden lege ich mich nieder und schlafe, ganz und gar.“ Das hebräische Adverb kann „zusammen“, „zugleich“ oder intensivierend „ganz und gar“ bedeuten. Es verbindet hier die beiden Handlungen eng miteinander.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Denn du, Jahwe, lässt mich allein sicher wohnen.“ Im Hebräischen kann sich „allein“ auch auf das Wohnen des Beters beziehen; der Haupttext bezieht es auf Jahwe.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּשָׁלוֹם
  choice: In Frieden
  rationale: שָׁלוֹם bezeichnet Frieden, Wohlergehen und Unversehrtheit. „In Frieden“ ist im Deutschen natürlich und entspricht dem Gegensatz zwischen Bedrängnis und sicherer Ruhe.
- source_word: יַחְדָּו
  choice: und
  rationale: Das Adverb bedeutet wörtlich „zusammen“ beziehungsweise „zugleich“. In Verbindung mit den beiden Verben wird seine zusammenfassende Kraft im Deutschen idiomatisch durch die enge Verknüpfung „mich hinlegen und schlafen“ wiedergegeben; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: אֶשְׁכְּבָה
  choice: will ich mich hinlegen
  rationale: Die Imperfektform kann hier einen entschlossenen Willen oder eine zuversichtliche Zukunft ausdrücken. „Will ich mich hinlegen“ gibt diese vertrauensvolle Aussage natürlich wieder.
- source_word: וְאִישָׁן
  choice: und schlafen
  rationale: ישן bedeutet im Qal „schlafen“. Die schlichte Wiedergabe passt zum parallelen „mich hinlegen“ und vermeidet die stärker deutende Übersetzung „einschlafen“.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund für die friedliche Ruhe des Beters ein. „Denn“ ist in gehobener, aber heutiger deutscher Sprache knapp und passend.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname „Jahwe“ wiedergegeben, statt ihn durch den Titel „HERR“ zu ersetzen.
- source_word: לְבָדָד
  choice: allein
  rationale: 'Das Adverb bedeutet „allein“ oder „für sich“. Im Haupttext wird es aufgrund von Wortstellung und Sinn auf „du“ bezogen: Jahwe allein gewährt Sicherheit. Die grammatisch mögliche andere Zuordnung wird in der Fußnote genannt.'
- source_word: לָבֶטַח
  choice: in Sicherheit
  rationale: בֶּטַח bezeichnet einen Zustand der Sicherheit oder Geborgenheit. „In Sicherheit“ verbindet sich im Deutschen natürlich mit „wohnen“.
- source_word: תּוֹשִׁיבֵנִי
  choice: lässt mich wohnen
  rationale: Der Hifil von ישׁב ist kausativ. „Lässt mich wohnen“ vermittelt hier Gottes bewirkendes Handeln idiomatischer als das missverständliche „macht mich wohnen“; der Sinn ist, dass Gott dem Beter sicheres Wohnen gewährt.
theological_decisions:
- issue: Bezug und Aussagekraft von לְבָדָד
  choice: '„Allein“ bezieht sich auf Jahwe: Er allein lässt den Beter sicher wohnen.'
  alternative: '„Allein“ kann den Beter beschreiben: Jahwe lässt ihn allein beziehungsweise abgesondert in Sicherheit wohnen.'
  rationale: Wortstellung und Kontext sprechen eher für die ausschließliche Abhängigkeit von Jahwe, ohne über die Aussage des Verses hinauszugehen. Da die alternative syntaktische Zuordnung möglich bleibt, wird sie in einer Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Satzrhythmus. Der Gottesname steht als „Jahwe“. Die echte syntaktische Mehrdeutigkeit von לְבָדָד wird nicht aufgelöst, sondern durch Fußnote b dokumentiert.
