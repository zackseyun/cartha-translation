base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/003.yaml
  text: And know that Yahweh has set apart the godly for himself[b][a]; Yahweh hears when I call to him.
translation:
  language: de
  text: Und erkennt, dass Jahwe den ihm treuen Menschen für sich ausgesondert hat.[a] Jahwe hört, wenn ich zu ihm rufe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jahwe hat den Getreuen für sich ausgezeichnet.« Das hebräische Wort kann einen Menschen bezeichnen, der durch Treue zu Gott und Frömmigkeit geprägt ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Jahwe wird hören, wenn ich zu ihm rufe.« Die hebräische Verbform kann eine gegenwärtige Gewissheit oder eine zuversichtlich erwartete Zukunft ausdrücken.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: וּדְעוּ
  choice: Und erkennt
  rationale: Der Imperativ steht im Plural und fordert die Angesprochenen auf, eine Tatsache anzuerkennen. Die vorangestellte Konjunktion wird ohne unnötige adversative Zuspitzung mit »und« wiedergegeben.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet hier den Inhalt dessen ein, was die Angesprochenen erkennen sollen.
- source_word: הִפְלָה
  choice: ausgesondert hat
  rationale: Der Hifil von פלא bezeichnet hier im Zusammenhang mit לֹו ein Unterscheiden beziehungsweise besonderes Aussondern. Das deutsche Perfekt gibt die vollzogene Handlung natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die im modernen Deutschen übliche Form.
- source_word: חָסִיד
  choice: den ihm treuen Menschen
  rationale: Das substantivierte Singularwort bezeichnet einen von Treue, Hingabe und Frömmigkeit geprägten Menschen. Die Umschreibung ist im heutigen Deutsch verständlich und lässt den ethisch-bundestheologischen Bedeutungsumfang bestehen.
- source_word: לוֹ
  choice: für sich
  rationale: Die Präposition mit Suffix bezeichnet die besondere Zuordnung zu Jahwe und wird im Deutschen reflexiv ausgedrückt.
- source_word: יִשְׁמַע
  choice: hört
  rationale: Das Imperfekt kann eine regelmäßig erfahrene beziehungsweise zuversichtlich erwartete Handlung ausdrücken. Das Präsens vermittelt hier die gegenwärtige Gewissheit des Beters; die Zukunftsdeutung bleibt in der Fußnote erhalten.
- source_word: בְּקָרְאִי אֵלָיו
  choice: wenn ich zu ihm rufe
  rationale: ב mit Infinitivkonstrukt bezeichnet den zeitlichen Umstand; אֵלָיו gibt die Richtung des Rufens beziehungsweise Betens an.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Wiedergabe als Eigenname bewahrt diese Besonderheit, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von חָסִיד
  choice: den ihm treuen Menschen
  alternative: den Frommen / den Getreuen
  rationale: Die gewählte Formulierung wahrt sowohl die persönliche Hingabe als auch den Aspekt verlässlicher Treue, ohne den Ausdruck auf eine konfessionell geprägte Vorstellung von Frömmigkeit zu verengen.
- issue: Zeitbezug von יִשְׁמַע
  choice: hört
  alternative: wird hören
  rationale: Das hebräische Imperfekt lässt sowohl eine charakteristische Gegenwart als auch eine zuversichtlich erwartete Zukunft zu. Der Haupttext wählt das Präsens, während die echte Alternative ausdrücklich dokumentiert wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Plural des Imperativs und der Singular von חָסִיד bleiben erhalten. Die Formulierung vermeidet altertümliches »der Fromme« im Haupttext, dokumentiert diese knappe Alternative aber in der Fußnote.
