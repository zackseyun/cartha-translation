  text: נָתַ֣תָּה שִׂמְחָ֣ה בְ/לִבִּ֑/י מֵ/עֵ֬ת דְּגָנָ֖/ם וְ/תִֽירוֹשָׁ֣/ם רָֽבּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/007.yaml
  text: You have put joy in my heart more than when their grain and their new wine abound[a].
translation:
  language: de
  text: Du hast mir mehr Freude ins Herz gegeben als zu der Zeit, als ihr Korn und ihr neuer Wein reichlich zunahmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „seit der Zeit, als ihr Korn und ihr neuer Wein zunahmen“. Der hebräische Ausdruck wird gewöhnlich vergleichend verstanden: Die von Gott geschenkte Freude übertrifft die Freude an reicher Ernte.'
    reason: Alternative Lesart der mehrdeutigen vergleichenden beziehungsweise zeitlichen Konstruktion.
lexical_decisions:
- source_word: נָתַתָּה
  choice: Du hast … gegeben
  rationale: Das Qal Perfekt 2. Person maskulin Singular richtet sich an Gott. Das deutsche Perfekt bezeichnet eine vollendete Gabe mit gegenwärtiger Wirkung und klingt im Gebet natürlich.
- source_word: שִׂמְחָה
  choice: Freude
  rationale: Das Substantiv bezeichnet Freude oder Fröhlichkeit; „Freude“ ist im heutigen Deutsch natürlich und gibt die innere Erfahrung passend wieder.
- source_word: בְלִבִּי
  choice: mir … ins Herz
  rationale: לֵב bezeichnet hier das Innere des Menschen. Die Verbindung „Freude ins Herz geben“ ist idiomatisches Deutsch und bewahrt die bildhafte Ortsangabe.
- source_word: מֵעֵת
  choice: mehr … als zu der Zeit, als
  rationale: מִן mit עֵת wird hier entsprechend dem verbreiteten Verständnis als Vergleich aufgefasst. Die Formulierung macht den Vergleich verständlich, ohne die zeitliche Gestalt des hebräischen Ausdrucks ganz aufzugeben.
- source_word: דְּגָנָם
  choice: Korn
  rationale: דָּגָן bezeichnet Getreide beziehungsweise Getreideertrag. „Korn“ ist eine knappe, natürliche deutsche Entsprechung im Erntebild.
- source_word: וְתִירוֹשָׁם
  choice: und neuen Wein
  rationale: תִּירוֹשׁ bezeichnet meist jungen beziehungsweise neuen Wein als Erzeugnis der Ernte. „Neuer Wein“ erhält diesen landwirtschaftlichen Bezug.
- source_word: רָבּוּ
  choice: in Fülle hatten
  rationale: Das Qal Perfekt 3. Person Plural von רבה bezeichnet Zunahme oder Fülle. Im Deutschen bezieht sich „hatten“ natürlich auf die Menschen, deren Korn und neuer Wein reichlich vorhanden waren.
theological_decisions:
- issue: Vergleichende Syntax des Verses
  choice: Die von Gott geschenkte innere Freude ist größer als die Freude zur Zeit materieller Fülle an Korn und neuem Wein.
  alternative: 'Wörtlicher und rein zeitlich: „Seit der Zeit, als ihr Korn und ihr neuer Wein zunahmen, hast du Freude in mein Herz gegeben.“'
  rationale: מֵעֵת wird überwiegend als Vergleichsmaßstab verstanden. Das passt zum Gegensatz zwischen der Freude des Beters an Gottes Gabe und dem Wohlstand anderer; die formal mögliche zeitliche Lesart wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Gebetsanrede. „Korn“ und „neuer Wein“ bewahren das konkrete Erntebild; die Fußnote hält die syntaktische Mehrdeutigkeit offen.
