source:
  edition: WLC
  text: זִבְח֥וּ זִבְחֵי צֶ֑דֶק וּ֝/בִטְח֗וּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/005.yaml
  text: Offer sacrifices of righteousness[a], and trust in Yahweh.
translation:
  language: de
  text: Bringt Opfer der Gerechtigkeit dar[a] und vertraut auf Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bringt rechte Opfer dar“; auch: „Bringt Opfer des Rechts dar“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחוּ זִבְחֵי
  choice: Bringt Opfer … dar
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv bezeichnet das Vollziehen beziehungsweise Darbringen von Opfern. Die im Deutschen idiomatische Wendung „Opfer darbringen“ bewahrt den kultischen Sinn, ohne die unnatürliche Wiederholung „opfert Opfer“ zu erzeugen.
- source_word: צֶדֶק
  choice: der Gerechtigkeit
  rationale: 'Der Genitiv erhält die Bedeutungsbreite von צֶדֶק: Gemeint sein können von Gerechtigkeit geprägte, rechte oder ordnungsgemäße Opfer. So wird weder ausschließlich ethische Aufrichtigkeit noch ausschließlich korrekter Kult festgelegt.'
- source_word: וּבִטְחוּ
  choice: und vertraut
  rationale: Der maskuline Pluralimperativ von בטח ist mit „vertraut“ direkt, natürlich und dem auffordernden Parallelismus entsprechend wiedergegeben.
- source_word: אֶל
  choice: auf
  rationale: Obwohl אֶל grundsätzlich eine Ausrichtung „zu/auf … hin“ ausdrückt, verlangt „vertrauen“ in dieser Verbindung im Deutschen idiomatisch „auf“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bedeutung von זִבְחֵי צֶדֶק („Opfer der Gerechtigkeit“)
  choice: Die Genitivverbindung bleibt erhalten und bezeichnet Opfer, die durch Gerechtigkeit beziehungsweise rechte Ordnung gekennzeichnet sind, ohne den Schwerpunkt näher festzulegen.
  alternative: „rechte Opfer“ im Sinn moralisch aufrichtiger oder kultisch ordnungsgemäßer Opfer; „Opfer des Rechts“
  rationale: Die hebräische Formulierung kann ethische Aufrichtigkeit, kultische Angemessenheit oder beides umfassen. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Opfer darbringen“ ist eine geläufige biblisch-kultische Wendung; „vertraut auf“ bleibt klar und alltagssprachlich verständlich.
