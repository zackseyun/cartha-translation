lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In Psalmüberschriften bezeichnet der Ausdruck wahrscheinlich den musikalischen Leiter. „Chorleiter“ ist eine geläufige, knappe Wiedergabe im liturgisch-musikalischen Zusammenhang.
- source_word: בִּנְגִינוֹת
  choice: Mit Saiteninstrumenten
  rationale: Der Ausdruck bezeichnet hier eine musikalische Ausführungsanweisung mit Saiteninstrumenten, ohne die genaue Aufführungspraxis näher festzulegen.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: „Psalm“ ist die etablierte und sachlich passende deutsche Gattungsbezeichnung.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der deutsche Genitiv entspricht der traditionellen Form und lässt im Kontext einer Überschrift eher als „von David“ offen, ob Autorschaft, Zuordnung oder Widmung gemeint ist.
theological_decisions:
- issue: Autorschaft oder Zuordnung durch לְדָוִד
  choice: Davids
  alternative: von David; für David
  rationale: Die hebräische Präposition לְ kann Autorschaft, Zugehörigkeit, Zuordnung oder Widmung anzeigen. Die Übersetzung soll diese Unbestimmtheit nicht durch eine ausdrückliche Festlegung auf Autorschaft beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappen Nominalsätze bewahren den Charakter einer Psalmüberschrift; der Fußnotenmarker steht unmittelbar bei „Davids“, seinem sachlichen Bezug.
