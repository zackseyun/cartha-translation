  yaml_path: translation/ot/psalms/004/000.yaml
  text: 'For the choirmaster: with stringed instruments. A psalm of David[a].'
translation:
  language: de
  text: Für den Chorleiter. Mit Saiteninstrumenten. Ein Psalm Davids[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von David“ oder „für David“; die hebräische Wendung kann Autorschaft, Zuordnung oder Widmung bezeichnen.'
