source:
  edition: WLC
  text: וְ/אַתָּ֤ה אֱלֹהִ֨ים תּוֹרִדֵ֬/ם לִ/בְאֵ֬ר שַׁ֗חַת אַנְשֵׁ֤י דָמִ֣ים וּ֭/מִרְמָה לֹא יֶחֱצ֣וּ יְמֵי/הֶ֑ם וַ֝/אֲנִ֗י אֶבְטַח בָּֽ/ךְ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/023.yaml
  text: But you[a], God, will bring them down to the pit of destruction; men of bloodshed and deceit will not live out half their days[b], but I will trust in you.
translation:
  language: de
  text: Du aber, Gott, wirst sie in die Grube des Verderbens hinabbringen.[a] Menschen, die Blut vergießen und betrügen, werden nicht die Hälfte ihrer Tage erreichen.[b] Ich aber vertraue auf dich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Grube der Verwesung“, „in die Grabgrube“ oder einfach „in die Grube“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „werden ihre Tage nicht halbieren“; gemeint ist, dass ihr Leben vorzeitig endet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרִדֵם
  choice: wirst sie hinabstürzen
  rationale: Der Hifil von ירד bezeichnet das Veranlassen des Hinabgehens. „Hinabstürzen“ gibt die kausative Bewegung in die Grube natürlich und kraftvoll wieder, ohne die Art des Gerichts näher festzulegen.
- source_word: לִבְאֵר שַׁחַת
  choice: in die Grube des Verderbens
  rationale: בְּאֵר bezeichnet eine Grube oder einen Brunnen, שַׁחַת kann Grube, Verderben oder Verwesung bedeuten. Die Wiedergabe bewahrt sowohl das konkrete Bild als auch dessen zerstörerische Bedeutung.
- source_word: אַנְשֵׁי דָמִים וּמִרְמָה
  choice: Menschen, die Blut vergießen und betrügen
  rationale: Die hebräische Verbindung bezeichnet wörtlich „Männer des Blutes und des Trugs“. Die verbale Formulierung ist im heutigen Deutsch verständlich und bewahrt Gewalt und Täuschung als Kennzeichen dieser Menschen.
- source_word: לֹא יֶחֱצוּ יְמֵיהֶם
  choice: werden nicht die Hälfte ihrer Tage erreichen
  rationale: חצה bedeutet „halbieren/teilen“. Die Formulierung hält das ungewöhnliche hebräische Bild erkennbar und drückt zugleich aus, dass ihr Leben vorzeitig endet.
- source_word: וַאֲנִי אֶבְטַח בָּךְ
  choice: Ich aber vertraue auf dich
  rationale: Das ausdrücklich gesetzte Pronomen אֲנִי trägt Kontrast und Nachdruck. „Ich aber“ gibt diesen Gegensatz prägnant wieder; das deutsche Präsens kann die entschlossene, fortdauernde Haltung des hebräischen Imperfekts natürlich ausdrücken.
theological_decisions:
- issue: Bedeutung des Bildes „Grube des Verderbens“
  choice: Als Bild göttlichen Gerichts mit Tod und Verderben wiedergegeben, ohne einen technischen Begriff für das Jenseits einzusetzen.
  alternative: Grab, Scheol, Verwesung oder Hölle
  rationale: Der hebräische Ausdruck ist bildhaft und mehrdeutig. Er rechtfertigt hier keine eindeutige Identifikation mit einem bestimmten eschatologischen Ort.
- issue: Aussage über die verkürzten Lebenstage
  choice: Die sprichwörtliche Gerichtsaussage bleibt als „nicht die Hälfte ihrer Tage erreichen“ stehen.
  alternative: Sie werden früh sterben oder ihre Lebenszeit nicht vollenden.
  rationale: Die gewählte Form bewahrt die markante Aussage des Hebräischen, ohne daraus eine mathematisch genaue Verheißung über die Lebensdauer jedes Gewalttäters zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Parallelität und der abschließende Kontrast „Ich aber“ bleiben erhalten; schwer verständliche Nominalwendungen werden behutsam verbalisiert.
