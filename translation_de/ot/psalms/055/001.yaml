  text: הַאֲזִ֣ינָ/ה אֱ֭לֹהִים תְּפִלָּתִ֑/י וְ/אַל תִּ֝תְעַלַּ֗ם מִ/תְּחִנָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/001.yaml
  text: Give ear[a], O God, to my prayer, and do not hide yourself from my supplication.
translation:
  language: de
  text: Schenke meinem Gebet Gehör, Gott, und verbirg dich nicht vor meinem Flehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: Ignoriere mein Flehen nicht. Das hebräische Verb bedeutet wörtlich, sich zu verbergen, und bezeichnet hier die Weigerung, auf das Gebet zu achten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Schenke … Gehör
  rationale: Der Imperativ von אזן fordert zu aufmerksamem Hören auf. Die deutsche Wendung bewahrt das anschauliche Bild und klingt zugleich natürlich und würdevoll.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die direkte Anrede bezeichnet Gott; der Gottesname JHWH steht hier nicht.
- source_word: תְּפִלָּתִי
  choice: meinem Gebet
  rationale: תְּפִלָּה ist die allgemeine Bezeichnung für ein Gebet. Der Dativ ergibt sich aus der natürlichen deutschen Verbindung „Gehör schenken“.
- source_word: וְאַל
  choice: und … nicht
  rationale: Die Konjunktion und die verneinende Aufforderung verbinden die zweite Bitte unmittelbar mit der ersten.
- source_word: תִּתְעַלַּם
  choice: verbirg dich
  rationale: Die reflexive Verbform beschreibt bildhaft ein Sichverbergen beziehungsweise Sichentziehen; die Wiedergabe wahrt diese relationale Metapher.
- source_word: מִתְּחִנָּתִי
  choice: vor meinem Flehen
  rationale: תְּחִנָּה bezeichnet eine dringliche Bitte um Gunst oder Erbarmen. „Flehen“ gibt die Intensität prägnant wieder; „vor“ entspricht dem mit dem Verb verbundenen מִן.
