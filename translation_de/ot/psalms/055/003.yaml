  text: מִ/קּ֤וֹל אוֹיֵ֗ב מִ/פְּנֵ֣י עָקַ֣ת רָשָׁ֑ע כִּי יָמִ֥יטוּ עָלַ֥/י אָ֝֗וֶן וּ/בְ/אַ֥ף יִשְׂטְמֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/003.yaml
  text: Because of the voice of the enemy[a], because of the oppression of the wicked; for they cast trouble upon me[b], and in anger they hate me.
translation:
  language: de
  text: wegen der Stimme des Feindes, wegen der Bedrängung durch den Frevler; denn sie laden Unheil auf mich[a], und in ihrem Zorn hassen sie mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie laden mir Böses auf“. Das hebräische Wort אָוֶן kann Unheil, Leid, Böses oder Schuld bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל אוֹיֵב
  choice: wegen der Stimme des Feindes
  rationale: מִן bezeichnet hier parallel zu מִפְּנֵי den Anlass der Bedrängnis. „Stimme“ bewahrt das konkrete Bild des Hebräischen; der Singular „Feind“ entspricht der Ausgangsform.
- source_word: מִפְּנֵי עָקַת רָשָׁע
  choice: wegen des Drucks des Frevlers
  rationale: עָקָה bezeichnet bedrängenden Druck beziehungsweise Bedrückung. „Druck“ erhält die Bildlichkeit und passt zum singularischen רָשָׁע.
- source_word: יָמִיטוּ עָלַי אָוֶן
  choice: sie wälzen Unheil auf mich
  rationale: Der Hifil von מוט bezeichnet hier das Herabbringen oder Aufbürden; „auf mich wälzen“ gibt die feindliche Bewegung bildhaft wieder. אָוֶן bleibt mit „Unheil“ bewusst zwischen zugefügtem Leid und moralischem Bösen offen.
- source_word: וּבְאַף יִשְׂטְמוּנִי
  choice: und verfolgen mich voller Zorn
  rationale: אַף bezeichnet idiomatisch Zorn. שׂטם kann hassen, anfeinden oder feindselig verfolgen bedeuten; „verfolgen“ bringt die aktive Feindseligkeit im Kontext zum Ausdruck.
