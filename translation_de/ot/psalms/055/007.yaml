base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/007.yaml
  text: Look[a], I would wander far away; I would lodge in the wilderness[c][b]. Selah
translation:
  language: de
  text: Siehe, ich würde weit fort fliehen.[a] In der Wildnis würde ich übernachten. Sela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Siehe, ich würde weit wegziehen und umherirren.“ Das Hebräische verbindet ein Verb des Sich-Entfernens mit einem Infinitiv, der „umherziehen“ oder „fliehen“ bedeuten kann.'
    reason: lexical_alternative
  - marker: b
    text: „Sela“ wird traditionell unübersetzt gelassen. Seine genaue Bedeutung ist unsicher; möglicherweise handelt es sich um eine musikalische oder liturgische Angabe.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Das Wort lenkt nachdrücklich die Aufmerksamkeit auf die folgende Aussage. „Siehe“ bewahrt diesen unmittelbaren Ausruf in würdiger, noch verständlicher Sprache.
- source_word: אַרְחִיק נְדֹד
  choice: weit fort würde ich fliehen
  rationale: Die Verbindung aus dem Hifil von רחק („sich weit entfernen“) und dem Infinitiv von נדד („umherziehen, fliehen“) beschreibt eine entschlossene Bewegung in die Ferne. „Fliehen“ passt zum Fluchtwunsch des Zusammenhangs, während „weit fort“ die Distanz ausdrücklich wiedergibt.
- source_word: אָלִין
  choice: würde ich übernachten
  rationale: Das Verb לין bezeichnet gewöhnlich das Verbringen der Nacht oder Übernachten. Die konkrete Zeitbedeutung wird so natürlicher und genauer wiedergegeben als mit dem allgemeineren „bleiben“.
- source_word: בַּמִּדְבָּר
  choice: in der Wildnis
  rationale: מִדְבָּר kann unbewohntes, karges Weide- oder Steppenland bezeichnen und nicht nur eine Sandwüste. „Wildnis“ erhält diese Bedeutungsbreite.
- source_word: סֶלָה
  choice: Sela
  rationale: Die genaue Bedeutung des vermutlich musikalischen oder liturgischen Ausdrucks ist unsicher; daher wird er traditionsgemäß transkribiert.
