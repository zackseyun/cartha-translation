  text: בַּלַּ֣ע אֲ֭דֹנָ/י פַּלַּ֣ג לְשׁוֹנָ֑/ם כִּֽי רָאִ֨יתִי חָמָ֖ס וְ/רִ֣יב בָּ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/009.yaml
  text: Confuse them[a], Lord; divide their speech[b], for I have seen violence and strife in the city.
translation:
  language: de
  text: Verwirre sie[a], Herr; bring ihre Sprache durcheinander[b], denn ich habe Gewalt und Streit in der Stadt gesehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verschlinge sie, Herr«; möglicherweise auch: »Vernichte sie, Herr«. Das hebräische Verb bedeutet gewöhnlich »verschlingen« und kann in diesem Zusammenhang einen zerstörerischen Sinn haben. Im Zusammenhang mit der folgenden Bitte kann es auch bedeuten, ihre Pläne durch Verwirrung zu vereiteln.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »teile ihre Zunge«; gemeint ist, ihre gemeinsame Verständigung zu stören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּע
  choice: Verwirre sie
  rationale: Das Verb bedeutet gewöhnlich »verschlingen« und kann auch Vernichtung ausdrücken. Im Parallelismus mit der Bitte, ihre Sprache durcheinanderzubringen, ist hier wahrscheinlich das Vereiteln ihrer gemeinsamen Pläne durch Verwirrung gemeint. Die wörtlicheren Möglichkeiten bleiben in der Fußnote erhalten.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Das hebräische אֲדֹנָי ist der Gottestitel »Herr«; es steht hier nicht der Gottesname JHWH.
- source_word: פַּלַּג
  choice: bring … durcheinander
  rationale: Das Verb bedeutet wörtlich »teilen« oder »spalten«. Zusammen mit »Sprache« bezeichnet es hier anschaulich die Störung gemeinsamer Verständigung; die wörtliche Formulierung wird in der Fußnote angegeben.
- source_word: לְשׁוֹנָם
  choice: ihre Sprache
  rationale: לָשׁוֹן bedeutet wörtlich »Zunge«, bezeichnet aber häufig Sprache beziehungsweise Sprechen. »Ihre Sprache« ist im modernen Deutsch klar und bewahrt den Bezug auf Verständigung.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund für die vorausgehende Bitte ein und wird im poetischen Zusammenhang natürlich mit »denn« wiedergegeben.
- source_word: רָאִיתִי
  choice: ich habe … gesehen
  rationale: Die hebräische Perfektform bezeichnet die vom Beter wahrgenommene Wirklichkeit, die seine Bitte begründet.
- source_word: חָמָס
  choice: Gewalt
  rationale: חָמָס bezeichnet Gewalt, brutales Unrecht oder gewaltsames Handeln. »Gewalt« ist hier die klare und treffende Wiedergabe.
- source_word: וְרִיב
  choice: und Streit
  rationale: רִיב kann Streit, Auseinandersetzung oder Zwietracht bezeichnen. »Streit« bildet mit »Gewalt« ein natürliches Wortpaar.
- source_word: בָּעִיר
  choice: in der Stadt
  rationale: Die Ortsangabe wird direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Deutung des eröffnenden Imperativs בַּלַּע im Verhältnis zur folgenden Bitte um die Teilung ihrer Sprache
  choice: Als Bitte um Verwirrung der Gegner wiedergeben
  alternative: »Verschlinge sie, Herr« oder »Vernichte sie, Herr«
  rationale: Der unmittelbare Parallelismus legt nahe, dass die Verständigung der Gegner gestört und ihr gemeinsames Vorhaben vereitelt werden soll, möglicherweise mit einem Anklang an Babel. Da das Verb selbst jedoch gewöhnlich »verschlingen« bedeutet und auch eine vernichtende Aussage zulässt, wird diese Spannung nicht beseitigt, sondern in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. »Bring ihre Sprache durcheinander« ist natürlicher als »teile ihre Sprache«, während die Fußnote die konkrete hebräische Formulierung bewahrt. Die Anrede »Herr« unterscheidet אֲדֹנָי vom Gottesnamen JHWH.
