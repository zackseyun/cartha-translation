base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/021.yaml
  text: The words of his mouth are smooth[a], but his heart is war; his words are softer than oil[b], yet they are drawn swords.
translation:
  language: de
  text: Glatt sind die Worte seines Mundes[a], doch in seinem Herzen ist Krieg; seine Worte sind weicher als Öl, doch sie sind gezückte Schwerter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schmeichelworte kommen aus seinem Mund.“ Der seltene hebräische Ausdruck kann butterweiche oder schmeichelnde Rede bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich möglicherweise: „geöffnete Schwerter“, das heißt aus der Scheide gezogene Schwerter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלְקוּ מַחְמָאֹת פִּיו
  choice: Glatt sind die Schmeichelworte seines Mundes
  rationale: Die seltene Verbindung bezeichnet wahrscheinlich glatte, butterweiche beziehungsweise schmeichelnde Rede. Die Wiedergabe wahrt sowohl das Bild der Glätte als auch den Bezug auf Worte aus seinem Mund.
- source_word: וּקֲרָב לִבּוֹ
  choice: doch in seinem Herzen ist Krieg
  rationale: קְרָב ist ein Substantiv mit der Bedeutung „Kampf/Krieg“. Die Formulierung erhält die knappe Metapher und den Gegensatz zwischen äußerer Rede und innerer Feindseligkeit.
- source_word: רַכּוּ דְבָרָיו מִשֶּׁמֶן
  choice: seine Worte sind weicher als Öl
  rationale: Die Vergleichskonstruktion und das sinnliche Bild des Hebräischen werden unmittelbar wiedergegeben; שמן bedeutet allgemein „Öl“.
- source_word: וְהֵמָּה פְתִחוֹת
  choice: doch sie sind gezückte Schwerter
  rationale: פְתִחוֹת wird hier idiomatisch als geöffnete beziehungsweise aus der Scheide gezogene Waffen verstanden. „Gezückte Schwerter“ gibt den bedrohlichen Gegensatz zur weichen Rede natürlich wieder.
