  text: Destruction is within her[b][a]; oppression and deceit do not depart from her square.
translation:
  language: de
  text: Verderben[a] ist in ihrer Mitte; Unterdrückung und Betrug weichen nicht von ihrem öffentlichen Platz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verderbliche Übel sind in ihrer Mitte.“ Das hebräische Substantiv steht im Plural, kann aber kollektiv verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von ihren Straßen“. Das hebräische Wort kann einen öffentlichen Platz oder allgemeiner einen breiten Straßenraum bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: Verderben
  rationale: Der hebräische Plural kann zerstörerische Taten, unheilvolle Zustände oder verderbliche Übel bezeichnen. Das kollektive Singularwort „Verderben“ klingt im Deutschen natürlich und bewahrt die umfassende Bedeutung.
- source_word: בְּקִרְבָּהּ
  choice: in ihrer Mitte
  rationale: Die Wendung gibt den räumlichen Sinn wörtlich wieder und erhält zugleich die weibliche Personifikation der Stadt.
- source_word: יָמִישׁ
  choice: weichen nicht
  rationale: Das Verb bezeichnet hier das Nichtfortgehen beziehungsweise dauernde Verbleiben. Im Deutschen richtet sich der Plural natürlich nach dem verbundenen Subjekt „Unterdrückung und Betrug“.
- source_word: מֵרְחֹבָהּ
  choice: von ihrem öffentlichen Platz
  rationale: רְחוֹב bezeichnet häufig einen offenen öffentlichen Platz innerhalb einer Stadt; „öffentlicher Platz“ ist im heutigen Deutsch klarer als das alleinstehende „Platz“.
- source_word: תֹּךְ
  choice: Unterdrückung
  rationale: Das Substantiv kann Unterdrückung, Erpressung oder betrügerische Ausbeutung bezeichnen. „Unterdrückung“ passt zum Zusammenhang gesellschaftlicher Gewalt, ohne die Bedeutung unnötig einzuengen.
- source_word: וּמִרְמָה
  choice: und Betrug
  rationale: מִרְמָה bezeichnet Täuschung, Betrug oder Arglist. „Betrug“ bildet zusammen mit „Unterdrückung“ ein natürliches und verständliches Begriffspaar.
