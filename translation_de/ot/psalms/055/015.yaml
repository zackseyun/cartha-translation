base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/015.yaml
  text: Let death come upon them[a]; let them go down alive to Sheol, for evil is in their dwelling[d][c][b], in their midst.
translation:
  language: de
  text: Der Tod komme über sie[a]; lebendig sollen sie ins Totenreich hinabsteigen[b], denn in ihrer Wohnstätte, in ihrer Mitte, ist Böses[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder etwa: »Verheerung komme über sie« beziehungsweise »Der Tod überrasche sie«. Das hebräische Eröffnungswort ist schwierig; seine genaue Bedeutung ist unsicher.'
    reason: textual_variant
  - marker: b
    text: 'Hebräisch Scheol: der Bereich der Toten; je nach Zusammenhang auch »Grab«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »an ihrem Aufenthaltsort« beziehungsweise »in ihrer Wohnung«.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »in ihrem Inneren« beziehungsweise »unter ihnen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ישימות
  choice: Der Tod komme
  rationale: Das schwierige Eröffnungswort wird im Zusammenhang als Verwünschung mit »Tod« verstanden. Die genaue Form und Nuance bleiben unsicher und werden in einer Fußnote offengelegt.
- source_word: עָלֵימוֹ
  choice: über sie
  rationale: Gibt die Präposition mit dem Suffix der 3. Person Plural präzise und idiomatisch wieder.
- source_word: יֵרְדוּ
  choice: sollen sie hinabfahren
  rationale: Bewahrt im Kontext den jussivisch-imprekatorischen Sinn und das räumliche Bild des Hinabsteigens.
- source_word: שְׁאוֹל
  choice: Totenreich
  rationale: »Totenreich« vermittelt die alttestamentliche Vorstellung verständlich, ohne sie mit »Hölle« gleichzusetzen.
- source_word: חַיִּים
  choice: lebendig
  rationale: 'Adverbial gebraucht: Sie sollen noch zu Lebzeiten in das Totenreich hinabfahren.'
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung der Verwünschung ein.
- source_word: רָעוֹת
  choice: Bosheit
  rationale: Der feminine Plural bezeichnet hier kollektiv moralisches Böses; »Bosheit« klingt im Deutschen natürlich und konkret.
- source_word: בִּמְגוּרָם
  choice: in ihren Behausungen
  rationale: Gibt den wahrscheinlich lokativen Sinn des Nomens wieder und lässt die mögliche Nuance eines Aufenthaltsortes offen.
- source_word: בְּקִרְבָּם
  choice: in ihrer Mitte
  rationale: Bewahrt die Mehrdeutigkeit zwischen »in ihrem Inneren« und »unter ihnen« besser als eine eindeutig individualisierende Wiedergabe.
theological_decisions:
- issue: Bedeutung von שְׁאוֹל
  choice: Totenreich
  alternative: Scheol; Grab
  rationale: »Totenreich« bewahrt den Bezug auf den Bereich der Toten, ohne spätere Vorstellungen von der Hölle in den Vers einzutragen. Eine Fußnote nennt die sachlich mögliche Transliteration und die engere Alternative.
- issue: Gewaltsame Verwünschung
  choice: Die im Hebräischen ausgesprochene Verwünschung wird direkt beibehalten.
  alternative: Abschwächende Umschreibung als bloße Vorhersage
  rationale: Die jussivische Form und die poetisch-theologische Spannung des Klagepsalms dürfen nicht entschärft werden.
translation_notes:
  register: Moderne, würdevolle Psalmsprache mit klarer Verwünschungsform. »Hinabfahren« erhält das traditionelle räumliche Bild, während »Totenreich« für heutige Leser verständlicher als die unkommentierte Transliteration »Scheol« ist. Alle echten lexikalischen Unsicherheiten werden in den Fußnoten bewahrt.
