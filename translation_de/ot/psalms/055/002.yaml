  yaml_path: translation/ot/psalms/055/002.yaml
  text: Pay attention to me and answer me[a]; I am restless in my complaint[b], and I moan.
translation:
  language: de
  text: Hör aufmerksam auf mich und antworte mir! Ich bin unruhig in meiner Klage[a][b] und stöhne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich irre in meiner Klage rastlos umher.“ Das hebräische Verb kann sowohl rastlose Bewegung als auch innere Unruhe unter Bedrängnis ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: „Klage“ kann auch mit „Nachsinnen“ oder „Selbstgespräch“ wiedergegeben werden; der Zusammenhang des Klagepsalms spricht hier für „Klage“.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Hör aufmerksam
  rationale: Der Imperativ von קשׁב fordert nicht nur zum Hören, sondern zum aufmerksamen Beachten auf. Die Formulierung ist modern und bewahrt die Dringlichkeit der Bitte.
- source_word: לִּי
  choice: auf mich
  rationale: Das Pronomen der ersten Person Singular wird idiomatisch mit der deutschen Wendung „auf mich hören“ verbunden.
- source_word: וַעֲנֵנִי
  choice: und antworte mir
  rationale: ענה bedeutet hier im Gebetszusammenhang direkt „antworten“ oder „erwidern“.
- source_word: אָרִיד
  choice: Ich bin unruhig
  rationale: Das Verb bezeichnet rastlose Bewegung oder innere Erregung unter Bedrängnis. „Ich bin unruhig“ gibt den Zustand natürlich wieder, ohne die mögliche Vorstellung des Umherirrens auszuschließen.
- source_word: בְּשִׂיחִי
  choice: in meiner Klage
  rationale: שׂיח kann Nachsinnen, Selbstgespräch oder Klage bezeichnen. Der Klagekontext des Psalms legt hier „Klage“ nahe.
- source_word: וְאָהִימָה
  choice: und stöhne
  rationale: המה bezeichnet hörbare Unruhe beziehungsweise ein Murmeln, Dröhnen oder Stöhnen. Im Zusammenhang persönlicher Bedrängnis ist „stöhne“ eine natürliche und treffende Wiedergabe.
