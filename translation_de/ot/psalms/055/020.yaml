  source_fidelity: Der Text gibt die beiden hebräischen Perfekta sachgerecht wieder. »Er streckte seine Hände … aus« entspricht שָׁלַח יָדָיו und wahrt den im überlieferten Text vorliegenden Plural. »Gegen die, die mit ihm in Frieden lebten« gibt בִּשְׁלֹמָיו als Personen in friedlichem Verhältnis zu ihm angemessen wieder, ohne sie unzulässig auf Freunde oder politische Verbündete einzugrenzen. »Er entweihte seinen Bund« bewahrt bei חִלֵּל בְּרִיתוֹ die bewusst starke, kultisch-moralische Sprache und legt keinen göttlichen Bund fest.
  naturalness: Modernes, verständliches und würdiges Standarddeutsch. Die Relativkonstruktion ist natürlich und erschließt die kompakte hebräische Friedensbezeichnung gut. Die leicht markierte Formulierung »seinen Bund entweihte« bzw. hier »entweihte seinen Bund« ist angesichts der starken Bildsprache des Ausgangstextes angemessen.
  terminology: »Bund« ist die etablierte, semantisch offene Wiedergabe von בְּרִית. »Entweihte« ist für חִלֵּל treffender als ein bloßes »brach« und wird durch die Fußnote sinnvoll erläutert. Die Alternativen in beiden Fußnoten sind sachgerecht und die Anker stehen bei den jeweils erläuterten Ausdrücken.
