  text: שָׁלַ֣ח יָ֭דָי/ו בִּ/שְׁלֹמָ֗י/ו חִלֵּ֥ל בְּרִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/020.yaml
  text: He stretched out his hands against those at peace with him[b][a]; he profaned his covenant.
translation:
  language: de
  text: Er streckte seine Hände gegen die aus, die mit ihm in Frieden lebten[a]; er entweihte seinen Bund[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegen seine Freunde« oder »gegen seine Verbündeten«. Der hebräische Ausdruck bezeichnet Menschen, die in einer friedlichen Beziehung zu ihm standen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »er verletzte seinen Bund«. Das hebräische Verb bedeutet wörtlicher »entweihen« oder »als unheilig behandeln«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: streckte … aus
  rationale: Mit »Hände« als Objekt bezeichnet das Verb das Ausstrecken der Hände, hier in feindlicher Absicht. Die Wiedergabe bewahrt das konkrete hebräische Bild, ohne es zum allgemeineren »griff an« zu verflachen.
- source_word: יָדָיו
  choice: seine Hände
  rationale: Die im vorliegenden WLC-Text bezeugte Pluralform wird entsprechend als »seine Hände« wiedergegeben.
- source_word: בִּשְׁלֹמָיו
  choice: gegen die, die mit ihm in Frieden lebten
  rationale: Die Wendung bezeichnet Menschen, die in einer friedlichen Beziehung zu ihm standen. »In Frieden lebten« bewahrt diesen relationalen Sinn, ohne ihn auf enge Freundschaft oder ein politisches Bündnis zu verengen; die Präposition wird wegen des feindlichen Zusammenhangs mit »gegen« wiedergegeben.
- source_word: חִלֵּל
  choice: entweihte
  rationale: Der Piel-Stamm von חלל bedeutet, etwas zu entweihen oder als unheilig zu behandeln. »Entweihte« erhält die starke moralisch-religiöse Färbung des Verbs.
- source_word: בְּרִיתוֹ
  choice: seinen Bund
  rationale: »Bund« ist die übliche und prägnante Entsprechung für בְּרִית. Das Possessivsuffix bleibt erhalten, ohne näher festzulegen, um welche Art von Bund es sich handelt.
theological_decisions:
- issue: Art des genannten Bundes
  choice: »seinen Bund« und »entweihte« bewahren die bundestheologische und moralische Schwere der Aussage, ohne ausdrücklich einen Bund mit Gott anzunehmen.
  alternative: »seine Vereinbarung verletzte« oder »seinen Bund brach«
  rationale: Der unmittelbare Zusammenhang beschreibt den Verrat eines vertrauten Menschen. Der hebräische Wortlaut nennt jedoch schlicht einen Bund und verwendet dafür ein starkes Verb aus dem Bereich des Entweihens; diese Spannung bleibt in der Übersetzung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Bildsprache des Hebräischen bleibt erhalten; die Relativkonstruktion erklärt die ungewohnte Friedenswendung natürlich und verständlich.
