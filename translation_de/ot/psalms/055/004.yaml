  text: My heart writhes within me[a], and the terrors of death have fallen upon me.
translation:
  language: de
  text: Mein Herz bebt in mir[a], und die Schrecken des Todes haben mich überfallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mein Herz windet sich in mir“ oder „Mein Herz zittert in mir“. Das hebräische Verb kann sich winden, zittern oder in qualvoller Angst sein bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  choice: mein Herz
  rationale: לֵב bezeichnet hier das innere Zentrum des Empfindens. „Mein Herz“ ist im Deutschen natürlich, traditionsnah und bewahrt die körperlich-seelische Bildkraft.
- source_word: יָחִיל
  choice: windet sich
  rationale: Das Verb aus חול/חיל kann Sichwinden, Zittern oder qualvolle Angst bezeichnen. Im Zusammenhang mit den „Schrecken des Todes“ gibt „windet sich“ die heftige innere Erschütterung anschaulich wieder, ohne die Bedeutungsbreite in der Fußnote zu verschweigen.
- source_word: בְּקִרְבִּי
  choice: in mir
  rationale: קֶרֶב mit Suffix bezeichnet das Innere einer Person. „In mir“ ist knapp, idiomatisch und entspricht der poetischen Wendung.
- source_word: אֵימוֹת
  choice: die Schrecken
  rationale: Der Plural von אֵימָה bezeichnet überwältigende Schrecknisse oder Angstzustände. „Die Schrecken“ bewahrt Numerus und Intensität.
- source_word: מָוֶת
  choice: des Todes
  rationale: Der Genitiv lässt offen, ob der Tod Ursprung, Inhalt oder Ziel des Schreckens ist, und bildet die hebräische Verbindung angemessen nach.
- source_word: נָפְלוּ
  choice: sind ... gefallen
  rationale: Das Qatal beschreibt ein eingetretenes Geschehen mit gegenwärtiger Wirkung. Das Perfekt ist im modernen Deutschen natürlich und bewahrt das Bild des Herab- oder Überfallens.
- source_word: עָלָי
  choice: über mich
  rationale: עַל mit Suffix kann „auf/über mich“ bedeuten. Mit „fallen“ ist „über mich gefallen“ eine verständliche, leicht gehobene Formulierung, die das hebräische Bild eng wiedergibt.
