revisions:
- from: Mein Herz windet sich in mir[a], und die Schrecken des Todes sind über mich gefallen.
  to: Mein Herz bebt in mir[a], und die Schrecken des Todes haben mich überfallen.
  rationale: Die Revision verbessert die idiomatische moderne deutsche Psalmsprache, ohne die hebräische Mehrdeutigkeit einzuengen. Die Hauptfassung wählt mit „bebt“ eine natürliche und intensive Wiedergabe; die Fußnote dokumentiert die bildhaftere Alternative „windet sich“ sowie „zittert“. „Haben mich überfallen“ gibt das Überwältigtwerden durch die Schrecken idiomatisch wieder.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T22:07:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die zentralen Elemente des Hebräischen zutreffend wieder: לִבִּי als „mein Herz“, die innere Lokalisierung, den Plural „Schrecken“, den offenen Genitiv „des Todes“ und das Überwältigtwerden durch diese Schrecken. Für יָחִיל ist „windet sich“ zwar möglich, im Deutschen aber weniger klar und kann unnötig körperliche Schmerzen assoziieren. „Bebt“ gibt die Erschütterung bzw. das Zittern idiomatisch wieder und lässt die Bildsprache offen. „Haben mich überfallen“ ist für נָפְלוּ עָלַי eine natürliche deutsche Wiedergabe des plötzlichen Über-mich-Kommens.'
  naturalness: „Mein Herz windet sich in mir“ wirkt im modernen Standarddeutsch deutlich markiert; ein Herz „bebt“ oder „zittert“ natürlicher. Ebenso ist „sind über mich gefallen“ verständlich, aber weniger idiomatisch als „haben mich überfallen“.
  terminology: „Herz“ und „die Schrecken des Todes“ sind treffend, poetisch angemessen und bewahren sowohl den Plural von אֵימוֹת als auch die nicht weiter spezifizierte Genitivbeziehung zu מָוֶת. Die Fußnote sollte die lexikalische Spannweite ohne die unpräzise nominale Formulierung „qualvolle Angst bezeichnen“ ausdrücken.
  issues:
  - severity: medium
    issue: „windet sich“ ist als deutsche Hauptwiedergabe von יָחִיל unnötig unnatürlich und semantisch enger als erforderlich.
    rationale: Das hebräische Verb kann heftiges Beben, Zittern oder sich Winden ausdrücken. „Bebt“ ist im Deutschen für ein „Herz“ idiomatisch und bewahrt die Intensität, während die Fußnote das Sichwinden als Alternative erhält.
  - severity: low
    issue: „sind über mich gefallen“ ist eine sehr wörtliche, im modernen Deutsch etwas steife Wiedergabe von נָפְלוּ עָלַי.
    rationale: „Haben mich überfallen“ vermittelt das Eintreffen bzw. Überwältigen durch die Schrecken natürlich, ohne die Aussage oder theologische Deutung zu verändern.
  - severity: low
    issue: Die Fußnote formuliert die dritte Bedeutungsoption syntaktisch und semantisch ungenau.
    rationale: Ein Verb „bezeichnet“ nicht gut „qualvolle Angst“ als bloßes Nomen. „In qualvoller Angst sein“ gibt die mögliche verbale Aussage klarer wieder.
  revised_text: Mein Herz bebt in mir[a], und die Schrecken des Todes haben mich überfallen.
