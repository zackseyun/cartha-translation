source:
  edition: WLC
  text: יִשְׁמַ֤ע אֵ֨ל וְֽ/יַעֲנֵ/ם֮ וְ/יֹ֤שֵׁ֥ב קֶ֗דֶם סֶ֥לָה אֲשֶׁ֤ר אֵ֣ין חֲלִיפ֣וֹת לָ֑/מוֹ וְ/לֹ֖א יָרְא֣וּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/019.yaml
  text: God will hear and answer them—he who sits enthroned from of old (Selah)—because they have no changes[c][b][a], and they do not fear God.
translation:
  language: de
  text: Gott wird hören und ihnen antworten[a] – er, der von alters her thront. Sela. Bei ihnen gibt es keine Veränderungen[b], und sie fürchten Gott nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und sie demütigen« beziehungsweise »sie heimsuchen«. Das hebräische Verb kann als »antworten« verstanden werden; im Zusammenhang kann es auch eine strafende Antwort Gottes bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: »bei denen es keine Veränderungen gibt«. Gemeint sein können ausbleibende Umschwünge oder eine ungestörte Lebenslage, die selbstsicher macht; die schwierige hebräische Wendung kann auch auf fehlende innere Veränderung bezogen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע
  choice: wird hören
  rationale: Das Qal-Imperfekt von שׁמע drückt hier im Gebetszusammenhang die zuversichtliche Erwartung aus, dass Gott hört und eingreift.
- source_word: אֵל
  choice: Gott
  rationale: Die übliche und natürliche Wiedergabe des poetischen Gottesnamens אֵל.
- source_word: וְיַעֲנֵם
  choice: und ihnen antworten
  rationale: Die masoretische Vokalisierung lässt sich am unmittelbarsten von ענה I, »antworten«, her verstehen. Da im Zusammenhang eine gerichtliche Antwort Gottes gemeint sein kann, bleibt die mögliche punitive Bedeutung in einer Fußnote erhalten.
- source_word: וְיֹשֵׁב קֶדֶם
  choice: er, der von alters her thront
  rationale: ישׁב kann bei Gott königliches Thronen bezeichnen; קדם verweist auf die fernste Vergangenheit. Die Formulierung bewahrt sowohl das Bild als auch die Aussage von Gottes uralter Herrschaft.
- source_word: סֶלָה
  choice: Sela
  rationale: Die traditionelle Umschrift wird beibehalten, weil Bedeutung und liturgisch-musikalische Funktion des Ausdrucks nicht sicher bestimmt werden können.
- source_word: אֲשֶׁר אֵין חֲלִיפוֹת לָמוֹ
  choice: Denn sie erleben keine Wechselfälle
  rationale: חֲלִיפוֹת bezeichnet wahrscheinlich Veränderungen oder Umschwünge der Lebensumstände. »Wechselfälle erleben« gibt die schwierige Wendung verständlich wieder, ohne sie auf eine bestimmte Art von Veränderung festzulegen.
- source_word: וְלֹא יָרְאוּ אֱלֹהִים
  choice: und fürchten Gott nicht
  rationale: Das Perfekt beschreibt hier passend eine gefestigte Haltung beziehungsweise einen fortdauernden Zustand.
theological_decisions:
- issue: Bedeutung von ענה im zweiten Verb
  choice: Gott wird ihnen antworten
  alternative: Gott wird sie demütigen oder heimsuchen
  rationale: Die Vokalisierung stützt die Bedeutung »antworten«; der Gerichtskontext kann jedoch eine strafende Antwort oder eine Ableitung mit dem Sinn »demütigen/heimsuchen« nahelegen. Diese Spannung wird nicht stillschweigend aufgelöst.
- issue: Bezug der fehlenden חֲלִיפוֹת
  choice: Die Gottlosen erleben keine Wechselfälle
  alternative: Bei ihnen tritt keine innere Veränderung ein beziehungsweise sie erfahren keinen Umschwung
  rationale: Die Wendung ist knapp und mehrdeutig. Die Hauptfassung versteht sie als ungestörte Lebenslage, die ihre fehlende Gottesfurcht begleitet; andere Deutungen bleiben in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gottesname אֵל wird schlicht mit »Gott« wiedergegeben. »Sela« steht als eigener Einschnitt, damit seine unsichere liturgische Funktion nicht durch eine syntaktische Festlegung überdeutet wird.
