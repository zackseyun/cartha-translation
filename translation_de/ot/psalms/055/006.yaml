base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/006.yaml
  text: And I said[a], “Who will give me wings like a dove? I would fly away and dwell.”
translation:
  language: de
  text: 'Und ich sagte[a]: »Wer gäbe mir Flügel wie die einer Taube? Ich würde davonfliegen und mich niederlassen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß auch: »Ach, hätte ich doch Flügel wie die einer Taube! Dann würde ich davonfliegen und Ruhe finden.«'
    reason: Die hebräische Frage מִי יִתֶּן לִּי ist eine Wunschformel; zudem kann das Niederlassen im Zusammenhang als Zur-Ruhe-Kommen verstanden werden.
lexical_decisions:
- source_word: וָאֹמַר
  choice: Und ich sagte
  rationale: Das Wayyiqtol von אמר führt die anschließende Rede in erzählerischer Folge ein; die einfache Verbindung bleibt erhalten.
- source_word: מִי יִתֶּן לִּי
  choice: Wer gäbe mir
  rationale: Die wörtliche Frage drückt hier einen Wunsch aus. Der deutsche Konjunktiv bewahrt sowohl die Frageform als auch den sehnsüchtigen Sinn.
- source_word: אֵבֶר
  choice: Flügel
  rationale: Das formal singularische Wort wird im Bild des Fliegens kollektiv verstanden; „Flügel“ ist im Deutschen die natürliche Wiedergabe.
- source_word: כַּיּוֹנָה
  choice: wie einer Taube
  rationale: Die Vergleichspartikel כ wird direkt wiedergegeben und das Bild bleibt unverändert.
- source_word: אָעוּפָה
  choice: Ich würde davonfliegen
  rationale: Die Kohortativform bezeichnet Wunsch oder Entschluss; der Konjunktiv gibt im Zusammenhang den Wunschcharakter wieder.
- source_word: וְאֶשְׁכֹּנָה
  choice: und mich niederlassen
  rationale: שכן bedeutet wohnen, sich niederlassen oder bleiben. „Mich niederlassen“ bleibt lexikalisch nah und passt zum ersehnten Ziel der Flucht, ohne „Ruhe“ ausdrücklich in den Text einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Wunschfrage und das Taubenbild bleiben erhalten; die kontextuelle Deutung „Ruhe finden“ steht nur in der Fußnote.
