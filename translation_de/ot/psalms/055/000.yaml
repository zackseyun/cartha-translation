  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינֹ֗ת מַשְׂכִּ֥יל לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/000.yaml
  text: 'For the choirmaster: with stringed instruments. A Maskil[a] of David[b].'
translation:
  language: de
  text: Für den Chorleiter. Mit Saiteninstrumenten. Ein Maskil[a] Davids[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Lehrgedicht“ oder „ein nachdenkliches Lied“. Die genaue Bedeutung von „Maskil“ in Psalmüberschriften ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: „Davids“ kann auch „von David“ oder „für David“ bedeuten.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In Psalmüberschriften bezeichnet die Form wahrscheinlich den musikalischen Leiter. „Chorleiter“ ist im modernen Deutschen verständlich und gibt die liturgisch-musikalische Funktion wieder; ל wird mit „für“ wiedergegeben.
- source_word: בִּנְגִינֹת
  choice: Mit Saiteninstrumenten
  rationale: נְגִינֹת verweist hier wahrscheinlich auf die Begleitung durch Saiteninstrumente. „Mit Saiteninstrumenten“ ist natürlich und wahrt den Charakter einer musikalischen Anweisung.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Die genaue Bedeutung dieses Fach- oder Gattungsbegriffs in Psalmüberschriften ist unsicher. Die Umschrift vermeidet eine vorschnelle Festlegung; mögliche Bedeutungen werden in der Fußnote genannt.
- source_word: לְדָוִד
  choice: Davids
  rationale: Die deutsche Genitivform ist knapp und lässt wie die hebräische Wendung offen, ob Autorschaft, Zugehörigkeit, Widmung oder Verbindung mit David gemeint ist.
theological_decisions:
- issue: Art der Beziehung zu David in לְדָוִד
  choice: Davids
  alternative: von David; für David
  rationale: Das hebräische לְ kann in Psalmüberschriften unterschiedliche Beziehungen ausdrücken. „Davids“ bewahrt diese Offenheit besser als eine eindeutige Festlegung auf Autorschaft oder Widmung.
translation_notes:
  register: Moderne, würdige und knappe Sprache einer Psalmüberschrift. Der technische Ausdruck „Maskil“ bleibt wegen seiner unsicheren Bedeutung unübersetzt und wird durch eine Fußnote erschlossen.
