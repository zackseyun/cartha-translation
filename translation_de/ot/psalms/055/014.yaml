  text: Together we sweetened counsel[c][b][a]; in the house of God we walked in the throng.
translation:
  language: de
  text: Mit dem wir gemeinsam vertraute Gespräche genossen[a]; im Haus Gottes gingen wir inmitten der Menge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Mit dem wir gemeinsam vertraulichen Rat versüßten.“ Das Hebräische kann auch ein Geheimnis, vertraulichen Rat oder ein vertrauliches Gespräch bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Gedränge“ beziehungsweise „im Getümmel“. Das hebräische Wort kann eine versammelte, geräuschvolle Menschenmenge bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר יַחְדָּו
  choice: Mit dem ich gemeinsam
  rationale: Das Relativwort knüpft an den Gefährten des vorigen Verses an. Die deutsche Konstruktion mit „mit dem ich“ gibt das im hebräischen „wir“ enthaltene Miteinander idiomatisch wieder; „gemeinsam“ bewahrt zugleich die ausdrückliche Betonung von יַחְדָּו.
- source_word: נַמְתִּיק סוֹד
  choice: vertraute Gespräche genoss
  rationale: Die Verbindung bezeichnet einen angenehmen, vertraulichen Austausch. „Genoss“ vermittelt die Metapher des Süßmachens natürlich, während „vertraute Gespräche“ die Bedeutungsbreite von סוֹד besser trifft als bloß „Geheimnis“ oder „Rat“.
- source_word: בְּבֵית אֱלֹהִים
  choice: im Haus Gottes
  rationale: Die einfache Ortsangabe bleibt erhalten und wahrt die kultische Bezeichnung.
- source_word: נְהַלֵּךְ
  choice: gingen wir
  rationale: Im erinnernden Zusammenhang ist die Verbform als vergangenes beziehungsweise wiederholtes gemeinsames Gehen zu verstehen. Das schlichte „gingen wir“ bewahrt das konkrete Bild.
- source_word: בְּרָגֶשׁ
  choice: inmitten der Menge
  rationale: Das Substantiv kann eine dicht versammelte, möglicherweise geräuschvolle Menschenmenge oder das Gedränge bezeichnen. „Inmitten der Menge“ passt natürlich zum gemeinsamen Gang ins Heiligtum, ohne Unordnung vorauszusetzen.
