base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/010.yaml
  text: Day and night they go around her on her walls[b][a], and trouble and misery are within her.
translation:
  language: de
  text: Tag und Nacht ziehen sie auf ihren Mauern um sie herum[a]; Unheil und Bedrückung sind in ihrer Mitte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie umringen sie auf ihren Mauern.“ Das hebräische Verb kann sowohl das Umherziehen als auch das Umschließen betonen.'
    reason: lexical_alternative
  - marker: b
    text: „Unheil und Bedrückung“ kann auch mit „Bosheit und Elend“ oder „Frevel und Bedrängnis“ wiedergegeben werden. Die hebräischen Wörter können sowohl moralisches Unrecht als auch das dadurch verursachte Leid bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם וָלַיְלָה
  choice: Tag und Nacht
  rationale: Die geläufige deutsche Zeitformel gibt die fortwährende Tätigkeit knapp und natürlich wieder.
- source_word: יְסוֹבְבֻהָ
  choice: ziehen sie … um sie herum
  rationale: Das Verb סבב bezeichnet ein Umherziehen beziehungsweise Umkreisen. Die pluralische, im Vers selbst nicht ausdrücklich genannte Subjektgruppe bleibt mit „sie“ unbestimmt.
- source_word: עַל חוֹמֹתֶיהָ
  choice: auf ihren Mauern
  rationale: עַל wird direkt mit „auf“ wiedergegeben; das feminine Suffix bezieht sich auf die personifizierte Stadt.
- source_word: אָוֶן
  choice: Unheil
  rationale: Das Wort kann sowohl moralisches Böses als auch dessen schädliche Folgen bezeichnen. „Unheil“ bewahrt diese Bedeutungsbreite besser als eine rein schuld- oder leidbezogene Wiedergabe.
- source_word: עָמָל
  choice: Mühsal
  rationale: Das Wort umfasst Mühe, Leid und bedrückendes Unrecht. „Mühsal“ unterscheidet es von אָוֶן, ohne die mögliche soziale und moralische Dimension auszuschließen.
- source_word: בְּקִרְבָּהּ
  choice: sind in ihrem Inneren
  rationale: Die Wendung bedeutet wörtlich „in ihrer Mitte“; „in ihrem Inneren“ bewahrt die räumliche Aussage und die Personifizierung der Stadt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Bildfolge des Hebräischen – ein Umherziehen um die Stadt auf ihren Mauern – bleibt erhalten; die ungenannte Mehrzahl als Subjekt wird nicht näher bestimmt.
