  naturalness: Die Satzfügung ist verständlich, aber die dichte Folge von „sie“ und „ihren“ bleibt bewusst nahe am Hebräischen. „In ihrer Mitte“ ist für בְּקִרְבָּהּ idiomatischer und bildhafter als „in ihrem Inneren“.
  terminology: „Unheil und Bedrückung“ hält die Spannweite von אָוֶן und עָמָל zwischen schädlichem/moralischem Übel und dessen bedrückenden Folgen offen. Es legt weder eine bestimmte Tätergruppe noch eine konfessionelle Deutung fest.
