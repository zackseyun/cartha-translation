source:
  edition: WLC
  text: הַשְׁלֵ֤ךְ עַל יְהוָ֨ה יְהָבְ/ךָ֮ וְ/ה֪וּא יְכַ֫לְכְּלֶ֥/ךָ לֹא יִתֵּ֖ן לְ/עוֹלָ֥ם מ֗וֹט לַ/צַּדִּֽיק־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/022.yaml
  text: Cast your burden on Yahweh[a], and he will sustain you[b]; he will never allow the righteous to be shaken.
translation:
  language: de
  text: Wirf deine Last auf Jahwe[a], und er wird dich erhalten; niemals lässt er zu, dass der Gerechte ins Wanken gerät.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „dein Los“, „deine Sorge“ oder vielleicht „was dir auferlegt wurde“. Das hebräische Wort ist selten und bezeichnet wohl allgemein das, was auf einem Menschen liegt.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen der maskuline Singular „der Gerechte“; wahrscheinlich ist er hier repräsentativ gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁלֵךְ
  choice: Wirf
  rationale: Der Imperativ von שלך bezeichnet ein Werfen oder Abwerfen. „Wirf“ bewahrt das anschauliche Bild und klingt im Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: יְהָבְךָ
  choice: deine Last
  rationale: Das seltene Substantiv bezeichnet wohl das, was einem auferlegt ist. „Last“ passt zur anschließenden Zusage göttlicher Erhaltung; weitere mögliche Bedeutungen stehen in der Fußnote.
- source_word: יְכַלְכְּלֶךָ
  choice: er wird dich erhalten
  rationale: כלכל kann ernähren, versorgen, stützen oder erhalten bedeuten. „Erhalten“ umfasst hier tragende Fürsorge, ohne sie auf materielle Versorgung einzuengen.
- source_word: לֹא יִתֵּן לְעוֹלָם
  choice: niemals lässt er zu
  rationale: Die Verbindung von Negation, נתן und לְעוֹלָם drückt aus, dass Gott etwas auf Dauer nicht zulässt. Die deutsche Wendung gibt diese idiomatische Bedeutung klar wieder.
- source_word: מוֹט
  choice: ins Wanken gerät
  rationale: Das Wort bezeichnet Schwanken, Gleiten oder den Verlust festen Standes. „Ins Wanken geraten“ bewahrt das Bild der Destabilisierung.
- source_word: לַצַּדִּיק
  choice: der Gerechte
  rationale: Der substantivierte maskuline Singular wird formal als „der Gerechte“ wiedergegeben und kann zugleich repräsentative beziehungsweise allgemeine Bedeutung tragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt den Eigennamen, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Reichweite der Zusage über den Gerechten
  choice: niemals lässt er zu, dass der Gerechte ins Wanken gerät
  alternative: er wird den Gerechten nicht für immer wanken lassen
  rationale: לְעוֹלָם kann im Kontext die emphatische Bedeutung „niemals“ haben. Die Übersetzung bewahrt die starke Zusage, ohne daraus ausdrücklich Leidensfreiheit oder völlige Unberührbarkeit abzuleiten.
- issue: Generische oder individuelle Bedeutung von לַצַּדִּיק
  choice: der Gerechte
  alternative: die Gerechten
  rationale: Der hebräische Singular bleibt sichtbar. Eine Fußnote weist darauf hin, dass er wahrscheinlich repräsentativ gebraucht ist, statt diese Spannung im Haupttext aufzulösen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die bildhaften Verben „werfen“ und „ins Wanken geraten“ bleiben erhalten; der seltene Ausdruck יְהָבְךָ und die repräsentative Reichweite des Singulars werden durch Fußnoten offengehalten.
