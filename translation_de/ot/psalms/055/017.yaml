source:
  edition: WLC
  text: עֶ֤רֶב וָ/בֹ֣קֶר וְ֭/צָהֳרַיִם אָשִׂ֣יחָה וְ/אֶהֱמֶ֑ה וַ/יִּשְׁמַ֥ע קוֹלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/017.yaml
  text: Evening[a], morning, and noon I complain and groan[c][b], and he hears my voice.
translation:
  language: de
  text: Abends, morgens und mittags klage[a] und stöhne ich, und er[b] hört meine Stimme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sinne ich nach“ oder „rede ich“. Das hebräische Verb kann Nachsinnen, Reden oder Klagen bezeichnen; im Zusammenhang dieses Klagepsalms ist „klage“ wahrscheinlich.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische sagt lediglich „er hört meine Stimme“. Aus dem Zusammenhang ist Gott gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרֶב וָבֹקֶר וְצָהֳרַיִם
  choice: Abends, morgens und mittags
  rationale: Die adverbialen Formen geben die drei Tageszeiten in einer knappen, parallelen und im Deutschen natürlichen Reihe wieder.
- source_word: אָשִׂיחָה
  choice: klage
  rationale: שׂיח kann je nach Zusammenhang nachsinnen, reden oder klagen bezeichnen. Im Klagekontext und in Verbindung mit אֶהֱמֶה liegt eine hörbar vorgebrachte Klage nahe, ohne die lexikalische Mehrdeutigkeit zu verschweigen.
- source_word: וְאֶהֱמֶה
  choice: und stöhne ich
  rationale: המה bezeichnet hier eine hörbare Äußerung innerer Unruhe. „stöhnen“ passt zum Klagekontext und bewahrt den körperlich-akustischen Ton.
- source_word: וַיִּשְׁמַע
  choice: und er hört
  rationale: Das Waw-Imperfekt wird im poetischen Zusammenhang als gegenwärtige beziehungsweise wiederkehrende Gewissheit wiedergegeben. Das Subjekt bleibt wie im Hebräischen unausgesprochen.
- source_word: קוֹלִי
  choice: meine Stimme
  rationale: Die wörtliche und idiomatische Wiedergabe bewahrt den Gedanken des hörbaren Rufens.
theological_decisions:
- issue: Unausgesprochenes Subjekt von וַיִּשְׁמַע
  choice: „er“; aus dem Zusammenhang auf Gott bezogen
  alternative: „Gott hört meine Stimme“ oder „der HERR hört meine Stimme“
  rationale: Der unmittelbare Zusammenhang macht Gott zum Referenten, doch der Vers selbst nennt weder „Gott“ noch den Gottesnamen. Daher wird im Haupttext nichts ergänzt.
- issue: Zeitwert von וַיִּשְׁמַע
  choice: 'Präsens: „hört“'
  alternative: 'Futur: „wird hören“; Vergangenheit: „hörte“'
  rationale: Im poetischen Kontext drückt die Form plausibel die zuversichtliche Gewissheit aus, dass Gott das fortwährende Klagen hört; das Präsens lässt zugleich einen habitualen Sinn zu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Zeitangabe bleibt rhythmisch parallel; „klage und stöhne ich“ bildet die beiden hörbaren Äußerungen knapp und natürlich ab.
