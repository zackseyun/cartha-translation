  text: אָחִ֣ישָׁה מִפְלָ֣ט לִ֑/י מֵ/ר֖וּחַ סֹעָ֣ה מִ/סָּֽעַר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/008.yaml
  text: I would hasten to a refuge for myself from the rushing wind[a], from the storm.
translation:
  language: de
  text: Ich möchte mir rasch Zuflucht suchen vor dem tosenden Wind, vor dem Sturm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ich würde rasch zu einem Zufluchtsort eilen“ oder „Lass mich rasch zu einer Zuflucht eilen“. Die hebräische Verbform drückt einen dringlichen persönlichen Wunsch oder Entschluss aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִישָׁה
  choice: Ich will … eilen
  rationale: Die Kohortativform von חוּשׁ drückt hier einen dringlichen persönlichen Wunsch oder Entschluss aus. „Ich will … eilen“ bewahrt den volitiven Charakter und klingt im modernen Deutschen natürlich.
- source_word: מִפְלָט
  choice: einem Zufluchtsort
  rationale: Das Substantiv bezeichnet einen Ort beziehungsweise eine Möglichkeit der Flucht und Rettung. „Zufluchtsort“ gibt die räumliche Bedeutung im Zusammenhang deutlich wieder.
- source_word: לִי
  choice: für mich
  rationale: 'Die Präposition mit dem Suffix der ersten Person kennzeichnet das persönliche Interesse: Der Beter sucht einen Zufluchtsort für sich.'
- source_word: מֵרוּחַ
  choice: weg vom … Wind
  rationale: רוּחַ ist wegen der Verbindung mit סֹעָה und סַעַר meteorologisch als „Wind“ zu verstehen. „Weg von“ gibt die Bewegung aus dem Gefahrenbereich idiomatisch wieder.
- source_word: סֹעָה
  choice: tosenden
  rationale: Das Partizip beschreibt die heftige, stürmische Bewegung des Windes. „Tosend“ vermittelt diese Gewalt, ohne das folgende „Sturm“ bloß zu wiederholen.
- source_word: מִסָּעַר
  choice: weg vom Sturm
  rationale: סַעַר bezeichnet einen Sturm oder ein Unwetter. Die Wiederholung von „weg vom“ bildet die parallelen מן-Phrasen des Hebräischen ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Struktur „weg vom …, weg vom …“ bleibt erhalten; „Ich will“ ist hier als Ausdruck dringlicher Absicht und nicht als bloße Zukunft zu verstehen.
