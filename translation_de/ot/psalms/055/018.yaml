  text: פָּ֘דָ֤ה בְ/שָׁל֣וֹם נַ֭פְשִׁ/י מִ/קֲּרָב לִ֑/י כִּֽי בְ֝/רַבִּ֗ים הָי֥וּ עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/018.yaml
  text: He has redeemed my soul in peace from the battle against me[a], for many were with me.
translation:
  language: de
  text: Er hat meine Seele in Frieden erlöst aus dem Kampf gegen mich; denn viele waren mit mir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn viele waren gegen mich.“ Wörtlich etwa: „denn in großer Zahl waren sie mit mir“; im Zusammenhang kann dies idiomatisch auf zahlreiche Gegner bezogen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: פָּדָה
  choice: hat … erlöst
  rationale: Das Verb bezeichnet Loskauf beziehungsweise rettende Befreiung. „Erlöst“ bewahrt sowohl den konkreten Rettungssinn als auch den gehobenen poetischen Klang.
- source_word: בְשָׁלוֹם
  choice: in Frieden
  rationale: Die Wendung kann Frieden, Unversehrtheit und Wohlergehen bezeichnen. „In Frieden“ gibt die hebräische Konstruktion direkt wieder, ohne sie auf bloße Sicherheit zu verengen.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ kann Seele, Leben oder die ganze Person meinen. „Meine Seele“ wahrt hier das hebräische Bild und den poetischen Stil.
- source_word: מִקֲּרָב לִי
  choice: aus dem Kampf gegen mich
  rationale: קְרָב bezeichnet Kampf oder Schlacht; לִי wird im Zusammenhang sinnvoll adversativ als „gegen mich“ verstanden.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier eine Begründung oder Erläuterung ein; „denn“ entspricht dieser Funktion und passt zum poetischen Satzfluss.
- source_word: בְרַבִּים הָיוּ עִמָּדִי
  choice: viele waren mit mir
  rationale: Die Wiedergabe erhält die auffällige und möglicherweise mehrdeutige Aussage des Hebräischen, statt sie im Haupttext kontextuell zu „gegen mich“ umzudeuten.
theological_decisions:
- issue: Deutung des Schlusssatzes בְרַבִּים הָיוּ עִמָּדִי
  choice: denn viele waren mit mir
  alternative: denn viele waren gegen mich
  rationale: עִמָּדִי bedeutet seiner Form nach am naheliegendsten „mit mir“. Wegen des Kampfkontexts ist jedoch auch eine adversative Deutung vertreten. Der Haupttext bewahrt die Spannung des Wortlauts; die kontextuelle Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter poetischer Redeweise („meine Seele“, „in Frieden“). Die ungewöhnliche Mehrdeutigkeit der Schlusszeile bleibt im Haupttext erhalten und wird durch eine Fußnote erläutert.
