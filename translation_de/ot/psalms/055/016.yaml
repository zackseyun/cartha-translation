source:
  edition: WLC
  text: אֲ֭נִי אֶל אֱלֹהִ֣ים אֶקְרָ֑א וַ֝/יהוָ֗ה יוֹשִׁיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/016.yaml
  text: As for me[a], I call to God, and Yahweh will save me.
translation:
  language: de
  text: Ich aber rufe zu Gott, und Jahwe wird mich retten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי
  choice: Ich aber
  rationale: Das selbstständige, vorangestellte Pronomen hebt den Sprecher hervor und wirkt im Zusammenhang kontrastiv. „Ich aber“ gibt diese Betonung im Deutschen natürlich wieder.
- source_word: אֶל אֱלֹהִים
  choice: zu Gott
  rationale: אֶל bezeichnet die Richtung des Rufens; אֱלֹהִים meint hier, parallel zu יהוה, den einen Gott.
- source_word: אֶקְרָא
  choice: rufe
  rationale: Das Qal-Imperfekt kann gegenwärtig, wiederholt oder zukünftig verstanden werden. Das Präsens wahrt diese Offenheit weitgehend und klingt im Deutschen natürlich.
- source_word: וַיהוָה
  choice: und Jahwe
  rationale: Die Konjunktion wird additiv wiedergegeben; der Gottesname יהוה wird als „Jahwe“ transliteriert.
- source_word: יוֹשִׁיעֵנִי
  choice: wird mich retten
  rationale: Das Hifil-Imperfekt von ישׁע drückt hier die zuversichtliche Erwartung künftiger Rettung aus. „Retten“ bewahrt die Grundbedeutung des Verbs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ macht ihn als Eigennamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitbezug von אֶקְרָא und יוֹשִׁיעֵנִי
  choice: „rufe“ und „wird mich retten“
  alternative: „werde rufen“ und „rettet mich“
  rationale: Die hebräischen Imperfektformen lassen Spielraum. Im Kontext verbindet die gewählte Fassung den gegenwärtigen Ruf des Beters mit seiner zuversichtlichen Erwartung der Rettung, ohne aus dem ersten Verb unnötig eine ausschließlich zukünftige Handlung zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Zweigliedrigkeit und der betonte Gegensatz am Versanfang bleiben erhalten.
