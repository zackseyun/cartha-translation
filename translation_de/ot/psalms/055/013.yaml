base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/013.yaml
  text: But you—a man as my equal[a], my companion, and my familiar friend.
translation:
  language: de
  text: Doch du – ein Mensch meinesgleichen, mein Vertrauter[a] und mein guter Freund!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Führer“. Das hebräische Wort kann einen engen Vertrauten oder jemanden bezeichnen, der führt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Doch du
  rationale: Die Konjunktion leitet im Zusammenhang einen scharfen Gegensatz ein. „Doch du“ gibt diesen adversativen Sinn in natürlichem Deutsch wieder und bewahrt die direkte Anrede.
- source_word: אֱנוֹשׁ
  choice: ein Mensch
  rationale: Das Wort bezeichnet einen Menschen und kann dessen Vergänglichkeit oder Schwäche anklingen lassen. Hier steht vor allem der schmerzliche Verrat durch einen Mitmenschen im Vordergrund.
- source_word: כְּעֶרְכִּי
  choice: meinesgleichen
  rationale: Die Wendung bezeichnet Gleichrangigkeit oder Vergleichbarkeit. „Meinesgleichen“ ist knapp, idiomatisch und passt zum persönlichen Verhältnis.
- source_word: אַלּוּפִי
  choice: mein Vertrauter
  rationale: Das Wort kann einen engen Gefährten oder auch einen Anführer beziehungsweise Führer bezeichnen. Im Parallelismus mit dem folgenden Ausdruck liegt hier die enge persönliche Beziehung nahe, ohne die lexikalische Alternative zu verschweigen.
- source_word: וּמְיֻדָּעִי
  choice: und mein guter Freund
  rationale: Die Form bezeichnet eine persönlich und vertraut bekannte Person. „Guter Freund“ vermittelt die im Klagezusammenhang vorausgesetzte Nähe natürlicher als das im Deutschen schwächere „Bekannter“.
