base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/005.yaml
  text: Fear and trembling come upon me[a], and horror covers me.
translation:
  language: de
  text: Furcht und Zittern kommen über mich, und Schauder bedeckt mich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְאָה
  choice: Furcht
  rationale: Das Substantiv bezeichnet Furcht oder Angst. „Furcht“ ist hier eine direkte, würdevolle Entsprechung und bildet mit „Zittern“ eine natürliche Wortverbindung.
- source_word: וָרַעַד
  choice: und Zittern
  rationale: Das Wort bezeichnet körperliches Beben als Ausdruck heftiger Angst. „Zittern“ bewahrt sowohl die körperliche als auch die emotionale Bedeutung.
- source_word: יָבֹא בִי
  choice: kommen über mich
  rationale: Wörtlich steht eine Bewegung „in mich“; im Deutschen gibt „über mich kommen“ idiomatisch wieder, dass Furcht und Zittern den Sprecher erfassen. Wegen des zusammengesetzten Subjekts steht das Verb im Plural.
- source_word: וַתְכַסֵּנִי
  choice: und Schauder bedeckt mich
  rationale: Das Verb כסה bedeutet „bedecken“. Die Übersetzung bewahrt das eindringliche Bild, statt es deutend mit „überwältigt mich“ wiederzugeben.
- source_word: פַּלָּצוּת
  choice: Schauder
  rationale: Das seltene Substantiv kann Entsetzen, Grauen oder ein angstvolles Schaudern bezeichnen. „Schauder“ wahrt die Verbindung von innerem Entsetzen und körperlicher Reaktion und passt natürlich zum Bild des Bedeckens.
