source:
  edition: WLC
  text: כִּ֤י לֹֽא אוֹיֵ֥ב יְחָֽרְפֵ֗/נִי וְ/אֶ֫שָּׂ֥א לֹֽא מְ֭שַׂנְאִ/י עָלַ֣/י הִגְדִּ֑יל וְ/אֶסָּתֵ֥ר מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/012.yaml
  text: For it is not an enemy who taunts me—then I could bear it[b][a]; it is not one who hates me who has magnified himself against me—then I could hide from him.
translation:
  language: de
  text: Denn es ist kein Feind, der mich verhöhnt[a] – das könnte ich ertragen; keiner, der mich hasst, macht sich gegen mich groß[b] – vor ihm könnte ich mich verbergen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mich schmäht“ beziehungsweise „mich beschimpft“. Das hebräische Verb bezeichnet eine verächtliche verbale Herabsetzung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „macht sich groß gegen mich“; gemeint sein kann: „tritt mir gegenüber überheblich auf“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung der Klage ein und bewahrt den poetischen Gedankenfluss.
- source_word: אוֹיֵב
  choice: Feind
  rationale: Die geläufige und klare deutsche Entsprechung für einen persönlichen Gegner.
- source_word: יְחָרְפֵנִי
  choice: der mich verhöhnt
  rationale: חרף bezeichnet eine verächtliche, kränkende verbale Herabsetzung; „verhöhnen“ gibt diese Schärfe in würdigem, heutigem Deutsch wieder.
- source_word: וְאֶשָּׂא
  choice: das könnte ich ertragen
  rationale: נשׂא bedeutet hier idiomatisch „ertragen“. Der deutsche Konjunktiv macht die im Zusammenhang vorausgesetzte irreale Bedingung deutlich; „das“ nimmt das Verhöhnen auf.
- source_word: מְשַׂנְאִי
  choice: keiner, der mich hasst
  rationale: Das substantivierte Partizip wird im Deutschen natürlich als Relativsatz wiedergegeben und behält seine persönliche Aussage bei.
- source_word: עָלַי הִגְדִּיל
  choice: erhebt sich gegen mich
  rationale: Die Wendung beschreibt ein feindseliges Sich-groß-Machen beziehungsweise arrogantes Auftreten. „Erhebt sich gegen mich“ ist verständlich, würdig und bewahrt das Bild.
- source_word: וְאֶסָּתֵר מִמֶּנּוּ
  choice: vor ihm könnte ich mich verbergen
  rationale: Das Niphal bezeichnet ein Sichverbergen. Die Wortstellung betont „vor ihm“ und der Konjunktiv gibt erneut die unausgesprochene irreale Bedingung wieder.
