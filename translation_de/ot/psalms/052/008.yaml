  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Kontrast des Hebräischen zuverlässig wieder: die demonstrative Eröffnung (הִנֵּה), den maskulinen Singular (הַגֶּבֶר), die Verweigerung, Gott zur Zuflucht zu machen, das Vertrauen auf reichen Besitz und das Starkwerden in der eigenen הַוָּה. „Verderben“ ist für das mehrdeutige הַוָּה eine vertretbare Hauptlesart; die Fußnote wahrt relevante Alternativen.'
