id: PSA.52.8
reference: Psalms 52:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּ֤ה הַ/גֶּ֗בֶר לֹ֤א יָשִׂ֥ים אֱלֹהִ֗ים מָֽע֫וּזּ֥/וֹ וַ֭/יִּבְטַח בְּ/רֹ֣ב עָשְׁר֑/וֹ יָ֝עֹ֗ז בְּ/הַוָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/008.yaml
  text: Look[a], this is the man who did not make God his refuge[b], but trusted in the abundance of his riches and sought strength in his destruction.
translation:
  language: de
  text: Seht, das ist der Mann, der Gott nicht zu seiner Zuflucht[a] machte, sondern auf die Fülle seines Reichtums vertraute und in seinem Verderben[b] stark wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Festung« oder »Bollwerk«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch »Untergang«, »verderbliches Begehren« oder »zerstörerisches Treiben« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Die hinweisende Interjektion leitet eine zugespitzte Betrachtung ein. „Seht“ gibt diesen Nachdruck in gegenwärtigem, natürlichem Deutsch wieder.
- source_word: הַגֶּבֶר
  choice: der Mann
  rationale: Das maskuline Substantiv bezeichnet hier den exemplarisch vor Augen gestellten Mann; eine geschlechtsneutrale Verallgemeinerung wäre weniger quellennah.
- source_word: לֹא יָשִׂים אֱלֹהִים מָעוּזוֹ
  choice: der Gott nicht zu seiner Zuflucht machte
  rationale: שׂים bezeichnet hier das Machen oder Setzen zu etwas; מָעוֹז ist ein Ort oder eine Quelle von Schutz und Stärke. „Zuflucht“ ist idiomatisch, während „Festung“ und „Bollwerk“ mögliche Bildvarianten bleiben.
- source_word: וַיִּבְטַח
  choice: sondern … vertraute
  rationale: 'Das Waw verbindet formal, trägt im Zusammenhang aber einen deutlichen Gegensatz: nicht Gott, sondern dem Reichtum galt sein Vertrauen.'
- source_word: בְּרֹב עָשְׁרוֹ
  choice: auf die Fülle seines Reichtums
  rationale: Die Formulierung bewahrt sowohl den Gedanken der großen Menge beziehungsweise Fülle als auch den des Reichtums.
- source_word: יָעֹז
  choice: stark wurde
  rationale: Das Verb bezeichnet Starksein oder Starkwerden. „Stark wurde“ wahrt die knappe Aussage, ohne eine nicht eindeutig markierte reflexive Bedeutung hinzuzufügen.
- source_word: בְּהַוָּתוֹ
  choice: in seinem Verderben
  rationale: הַוָּה kann Verderben oder Untergang, aber auch verderbliches Begehren oder zerstörerisches Treiben bezeichnen. Die Hauptfassung hält die bittere Spannung fest, dass der Mann gerade in dem stark wird, was Verderben bedeutet.
theological_decisions:
- issue: Geschlecht des singularischen הַגֶּבֶר
  choice: der Mann
  alternative: der Mensch
  rationale: Der hebräische Ausdruck ist ausdrücklich maskulin und zeichnet einen bestimmten beziehungsweise exemplarischen Mann. Die Hauptfassung bewahrt diese Form.
- issue: Bedeutung von הַוָּה
  choice: Verderben
  alternative: Untergang; verderbliches Begehren; zerstörerisches Treiben
  rationale: Der Ausdruck ist semantisch mehrdeutig. „Verderben“ bewahrt die mögliche Ironie der falschen Stärke, ohne die anderen kontextuell möglichen Bedeutungen auszuschließen; diese werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der zugespitzten Gegenüberstellung des Hebräischen. Die ungewöhnliche Wendung „in seinem Verderben stark wurde“ bleibt bewusst stehen, damit die Mehrdeutigkeit und theologische Spannung des Ausgangstextes nicht vorschnell aufgelöst werden.
