id: PSA.52.9
reference: Psalms 52:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲנִ֤י כְּ/זַ֣יִת רַ֭עֲנָן בְּ/בֵ֣ית אֱלֹהִ֑ים בָּטַ֥חְתִּי בְ/חֶֽסֶד אֱ֝לֹהִ֗ים עוֹלָ֥ם וָ/עֶֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/009.yaml
  text: But as for me[a], I am like a flourishing olive tree in the house of God[b]; I trust in the steadfast love of God forever and ever.
translation:
  language: de
  text: Ich aber[a] bin wie ein üppig grüner Ölbaum im Haus Gottes. Ich vertraue für immer und ewig auf Gottes beständige Liebe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und ich“; im Zusammenhang hebt die Form den Gegensatz zum Frevler hervor.'
    reason: discourse_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet Gottes verlässliche, bleibende Zuwendung; mögliche Wiedergaben sind auch „Güte“, „Gnade“ oder „Bundestreue“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Die Konjunktion zusammen mit dem selbstständigen Pronomen hebt den Gegensatz zum Frevler im vorausgehenden Zusammenhang hervor; „Ich aber“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: כְּזַיִת רַעֲנָן
  choice: wie ein üppig grüner Ölbaum
  rationale: כְּ kennzeichnet den Vergleich; זַיִת bezeichnet hier den Ölbaum. רַעֲנָן meint frische, grüne Lebenskraft, die „üppig grün“ anschaulich wiedergibt.
- source_word: בְּבֵית אֱלֹהִים
  choice: im Haus Gottes
  rationale: Die direkte Wiedergabe bewahrt das Bild des Heiligtums beziehungsweise der Gegenwart Gottes und klingt zugleich würdig und geläufig.
- source_word: בָּטַחְתִּי
  choice: Ich vertraue
  rationale: Die hebräische Perfektform kann eine gefestigte, fortdauernde Haltung ausdrücken; das Präsens passt zum bleibenden Vertrauen „für immer und ewig“.
- source_word: בְחֶסֶד אֱלֹהִים
  choice: auf Gottes beständige Liebe
  rationale: Bei בָּטַח wird das Ziel des Vertrauens im Deutschen idiomatisch mit „auf“ bezeichnet. חֶסֶד umfasst loyale, verlässliche und dauerhafte Zuwendung; „beständige Liebe“ wahrt diese Breite ohne konfessionelle Einengung.
- source_word: עוֹלָם וָעֶד
  choice: für immer und ewig
  rationale: Die gekoppelte Zeitformel verstärkt die unbegrenzte Dauer; die geläufige deutsche Wendung erhält diesen Nachdruck.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Blick auf Gottes Verhältnis zu seinem Volk
  choice: beständige Liebe
  alternative: Güte; Gnade; Bundestreue
  rationale: „Beständige Liebe“ verbindet liebevolle Zuwendung mit Verlässlichkeit und Dauer. „Bundestreue“ wäre sachlich möglich, würde den Begriff hier jedoch enger und ausdrücklicher deuten, als es das einzelne Wort verlangt.
- issue: Das Bild des Ölbaums „im Haus Gottes“
  choice: Bild unverändert stehen lassen
  alternative: erklärend als Verwurzelung oder Gedeihen in Gottes Gegenwart wiedergeben
  rationale: Die poetische Spannung eines Baumes im Heiligtum soll nicht durch eine deutende Paraphrase aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Das traditionelle und verständliche „Haus Gottes“ bleibt erhalten; ungewöhnliche oder konfessionell festgelegte Fachsprache wird vermieden.
