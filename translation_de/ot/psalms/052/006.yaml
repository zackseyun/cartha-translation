base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/006.yaml
  text: But God will also tear you down forever[a]; he will snatch you up and pull you from your tent, and uproot you from the land of the living[c][b]. Selah
translation:
  language: de
  text: Doch auch Gott wird dich für immer niederreißen; er wird dich packen[a] und aus deinem Zelt herausreißen[b], dich aus dem Land der Lebenden entwurzeln[c]. Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ergreifen“ oder „wegnehmen“. Das seltene hebräische Verb bezeichnet ein kraftvolles Entfernen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „aus deinem Zelt“; gemeint sein kann allgemein die Wohnstätte.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „deine Wurzel aus dem Land der Lebenden“. Gemeint ist, dass Gott den Angesprochenen dort entwurzelt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Doch
  rationale: Das Wort hat gewöhnlich additive oder verstärkende Bedeutung („auch“, „ja“); im Zusammenhang bildet es zugleich den Gegenpunkt zum vorausgehenden Rühmen des Bösen. „Doch“ gibt diese kontextuelle Gegenüberstellung natürlich wieder.
- source_word: אֵל
  choice: Gott
  rationale: אֵל bezeichnet hier den Gott Israels; „Gott“ ist die natürliche deutsche Entsprechung.
- source_word: יִתָּצְךָ
  choice: wird dich ... niederreißen
  rationale: נתץ bezeichnet das gewaltsame Niederreißen oder Zerstören, häufig von Bauwerken. Die Wiedergabe überträgt dieses Bild auf die angesprochene Person und passt zum späteren Entwurzeln.
- source_word: לָנֶצַח
  choice: für immer
  rationale: Die Wendung bezeichnet am ehesten bleibende, dauerhafte Endgültigkeit und nicht lediglich die Stärke der Handlung.
- source_word: יַחְתְּךָ
  choice: er wird dich packen
  rationale: Das seltene Verb bezeichnet hier ein Ergreifen oder gewaltsames Wegnehmen. „Packen“ bewahrt die Plötzlichkeit und Gewalt, ohne eine unsichere Nuance zu stark festzulegen.
- source_word: וְיִסָּחֲךָ
  choice: und ... reißen
  rationale: נסח bedeutet wegziehen, herausreißen oder entfernen. Zusammen mit „aus deinem Zelt“ ergibt „reißen“ im Deutschen ein konkretes, kraftvolles Bild.
- source_word: מֵאֹהֶל
  choice: aus deinem Zelt
  rationale: אֹהֶל bedeutet wörtlich „Zelt“. Das konkrete poetische Bild wird im Haupttext bewahrt, auch wenn allgemein die Wohnstätte gemeint sein kann.
- source_word: וְשֵׁרֶשְׁךָ
  choice: dich ... entwurzeln
  rationale: Der hebräische Ausdruck nennt wörtlich „deine Wurzel“ in einer elliptischen Konstruktion. „Dich entwurzeln“ gibt den Sinn idiomatisch wieder und erhält das Wurzelbild.
- source_word: מֵאֶרֶץ חַיִּים
  choice: aus dem Land der Lebenden
  rationale: Dies ist eine bildhafte hebräische Bezeichnung für den Bereich des Lebens im Gegensatz zum Tod; die traditionelle deutsche Formulierung ist genau und verständlich.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Funktion und genaue Bedeutung des liturgisch-musikalischen Ausdrucks unsicher sind, wird er transliteriert.
theological_decisions:
- issue: Art und Tragweite des durch לָנֶצַח bezeichneten Gerichts
  choice: für immer
  alternative: vollständig; ein für alle Mal
  rationale: Die wahrscheinlichste Bedeutung ist dauerhafte Endgültigkeit. Die Übersetzung wahrt die Schärfe des göttlichen Gerichts, ohne über die Aussage des Verses hinaus dessen metaphysische Tragweite festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit kräftigen, konkreten Bildern. Die Reihe „niederreißen – packen – herausreißen – entwurzeln“ bewahrt die Steigerung des hebräischen Gerichtsbildes. „Sela“ bleibt wegen seiner unsicheren Bedeutung unübersetzt.
