source:
  edition: WLC
  text: מַה תִּתְהַלֵּ֣ל בְּ֭/רָעָה הַ/גִּבּ֑וֹר חֶ֥סֶד אֵ֝֗ל כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/002.yaml
  text: Why do you boast in evil, mighty man? The steadfast love of God endures all day long.
translation:
  language: de
  text: Warum rühmst du dich des Bösen, du Held? Gottes Güte währt den ganzen Tag.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתְהַלֵּל בְּרָעָה
  choice: rühmst du dich des Bösen
  rationale: Das reflexive Verb bezeichnet Sich-Rühmen bzw. Prahlen; בְּ nennt hier den Gegenstand oder Anlass des Rühmens. Die deutsche Genitivkonstruktion gibt dies knapp und idiomatisch wieder.
- source_word: הַגִּבּוֹר
  choice: du Held
  rationale: גִּבּוֹר kann einen starken, mächtigen oder kriegerischen Mann bezeichnen. „Held“ bewahrt die knappe Anrede und ihren im Kontext spöttisch-herausfordernden Klang.
- source_word: חֶסֶד אֵל
  choice: Gottes Güte
  rationale: חֶסֶד umfasst Güte, loyale Zuwendung und beständige Liebe. „Güte“ ist hier natürlich, ohne den Bedeutungsumfang auf eine einzelne theologische Nuance festzulegen; אֵל wird als „Gott“ wiedergegeben.
- source_word: כָּל־הַיּוֹם
  choice: den ganzen Tag
  rationale: Entspricht der gewöhnlichen zeitlichen Bedeutung und erhält die knappe Aussage des Hebräischen.
theological_decisions:
- issue: Verhältnis der beiden Vershälften
  choice: 'Die zweite Hälfte bleibt als eigenständige Aussage stehen: „Gottes Güte währt den ganzen Tag.“'
  alternative: 'Sinngemäße Verknüpfung, etwa: „... obwohl Gottes Güte den ganzen Tag währt.“'
  rationale: Im Hebräischen fehlt eine ausdrückliche Konjunktion. Die unverknüpfte Wiedergabe bewahrt die mögliche Spannung zwischen dem Prahlen mit Bösem und Gottes beständiger Güte, ohne die logische Beziehung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt scharf und knapp; „du Held“ bewahrt die mögliche Ironie. Keine Ergänzung einer im Ausgangstext fehlenden logischen Verknüpfung.
