  text: 'Die Gerechten werden sehen und sich fürchten[a]; über ihn werden sie lachen[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erschrecken“ oder „Angst haben“. Das hebräische Wort kann in diesem Zusammenhang sowohl Schrecken als auch ehrfürchtige Furcht angesichts von Gottes Gericht bezeichnen.'
