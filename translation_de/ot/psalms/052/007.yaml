lexical_decisions:
- source_word: וְיִרְאוּ
  choice: werden es sehen
  rationale: Das Qal-Imperfekt 3. Person Plural von ראה bezeichnet hier in der poetischen Folge ein zukünftiges Wahrnehmen. Das ergänzte „es“ macht den deutschen Satz natürlich und verweist auf das zuvor geschilderte Gericht.
- source_word: צַדִּיקִים
  choice: die Gerechten
  rationale: Das substantivisch gebrauchte Adjektiv im Plural wird mit der geläufigen moralischen Bezeichnung „die Gerechten“ wiedergegeben.
- source_word: וְיִירָאוּ
  choice: sich fürchten
  rationale: Das Qal-Imperfekt von ירא kann Furcht, Schrecken oder ehrfürchtige Scheu bezeichnen. „Sich fürchten“ wahrt im Deutschen die Spannung, ohne die Reaktion ausschließlich als Angst oder Ehrfurcht festzulegen.
- source_word: וְעָלָיו
  choice: über ihn
  rationale: Die Präposition עַל wird eng an שׂחק angeschlossen. „Über ihn lachen“ ist natürliches Deutsch und bewahrt zugleich die hebräische Konstruktion.
- source_word: יִשְׂחָקוּ
  choice: werden sie lachen
  rationale: Das Qal-Imperfekt von שׂחק hat die Grundbedeutung „lachen“. Der spöttische Sinn ergibt sich im Zusammenhang, ohne dass er im Haupttext ausdrücklich ergänzt werden muss.
theological_decisions:
- issue: Bedeutung der Furcht angesichts des Gerichts
  choice: sich fürchten
  alternative: Ehrfurcht haben / erschrecken
  rationale: Die Gerechten sehen das Gericht Gottes. Die gewählte Formulierung lässt offen, ob ihre Reaktion vor allem Schrecken, ehrfürchtige Scheu oder beides umfasst, und bewahrt so die theologische Spannung des Hebräischen.
- issue: Lachen der Gerechten über den Gerichteten
  choice: über ihn lachen
  alternative: ihn verspotten
  rationale: Der Kontext legt spöttisches oder triumphierendes Lachen nahe; die Übersetzung bleibt jedoch bei der lexikalischen Grundbedeutung und macht daraus nicht ausdrücklich eine stärker wertende Handlung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe poetische Parallelstruktur bleibt erhalten; die Formulierung vermeidet sowohl altertümliches „die Frommen“ als auch eine einseitige Auslegung von Furcht und Lachen.
