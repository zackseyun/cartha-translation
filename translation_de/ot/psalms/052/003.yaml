base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/003.yaml
  text: You devise destruction[a]; your tongue is like a sharpened razor[c][b], working deceit.
translation:
  language: de
  text: Du ersinnst Verderben[a]; deine Zunge ist wie ein geschärftes Rasiermesser – betrügerisch am Werk.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen der Plural „Verderbenstaten“ beziehungsweise „Zerstörungen“; gemeint ist kollektiv zerstörerisches Unheil.
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Formulierung kann die angesprochene Person als jemanden bezeichnen, der Betrug übt; sie kann aber auch eng an das Bild der Zunge beziehungsweise des Rasiermessers anschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: Verderben
  rationale: Der hebräische Plural bezeichnet hier idiomatisch ruinöses, zerstörerisches Unheil; der deutsche kollektive Singular gibt dies natürlich und prägnant wieder.
- source_word: תַּחְשֹׁב
  choice: ersinnst
  rationale: Das Verb bezeichnet hier absichtsvolles Ausdenken oder Planen. „Ersinnst“ bewahrt den poetischen Ton und die Vorstellung berechnender Bosheit.
- source_word: לְשׁוֹנֶךָ
  choice: deine Zunge
  rationale: Die körperliche Metapher für schädliche Rede bleibt wörtlich erhalten.
- source_word: כְּתַעַר מְלֻטָּשׁ
  choice: wie ein geschärftes Rasiermesser
  rationale: Die Vergleichspartikel und das Bild einer zum Schneiden zugerichteten Klinge werden unmittelbar und in natürlichem Deutsch wiedergegeben.
- source_word: עֹשֵׂה רְמִיָּה
  choice: du übst Betrug
  rationale: Die Wendung bezeichnet tätiges, fortgesetztes betrügerisches Handeln. Die Hauptfassung bezieht das Partizip auf die angesprochene Person; die syntaktische Bildnähe zu Zunge beziehungsweise Rasiermesser wird in der Fußnote offengehalten.
theological_decisions:
- issue: Bezug von עֹשֵׂה רְמִיָּה
  choice: 'Auf die angesprochene Person bezogen: „du übst Betrug“'
  alternative: 'Als Beschreibung der Zunge beziehungsweise des Rasiermessers: „trügerisch am Werk“'
  rationale: Das maskuline Partizip kann appositionell die angesprochene männliche Person kennzeichnen; zugleich lässt seine Stellung nach dem Rasiermesserbild einen engen bildlichen Anschluss zu. Die Fußnote bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelführung. Das Semikolon gibt die Hauptzäsur wieder; der Gedankenstrich markiert den appositionellen Schluss, ohne die Bildsprache aufzulösen.
