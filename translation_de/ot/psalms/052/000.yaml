lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In Psalmüberschriften bezeichnet der Ausdruck wahrscheinlich den musikalischen Leiter. „Chorleiter“ ist knapp und im Deutschen als liturgisch-musikalische Funktionsbezeichnung verständlich; die Präposition לַ kann hier sowohl auf eine Bestimmung für als auch auf eine Anweisung an ihn weisen.
- source_word: מַשְׂכִּיל
  choice: Ein Maskil
  rationale: Die genaue Bedeutung dieser vermutlich musikalischen oder literarischen Gattungsbezeichnung ist unsicher. Die Übernahme des hebräischen Begriffs vermeidet eine unbelegte Festlegung auf „Lehrpsalm“ oder „Betrachtungslied“.
- source_word: לְדָוִד
  choice: Davids
  rationale: Die knappe Genitivform bewahrt im Deutschen möglichst weit die offene Zuordnung zu David, ohne die Wendung eindeutig als Verfasserangabe oder Widmung auszulegen.
theological_decisions:
- issue: Art der Beziehung zu David in לְדָוִד
  choice: Neutral als „Davids“ wiedergegeben
  alternative: „von David“, „für David“ oder „David zugehörig“
  rationale: Das hebräische לְ kann in Psalmüberschriften Verfasserschaft, Zugehörigkeit, Widmung oder Verbindung bezeichnen. Die Übersetzung legt sich daher nicht auf eine bestimmte historische Aussage fest.
translation_notes:
  register: Moderne, knappe und würdevolle Form einer Psalmüberschrift. Der unklare Fachbegriff „Maskil“ bleibt erhalten; Erläuterungen und mögliche Alternativen stehen in den Fußnoten.
