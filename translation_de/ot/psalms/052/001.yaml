  text: בְּ/ב֤וֹא דּוֹאֵ֣ג הָ/אֲדֹמִי֮ וַ/יַּגֵּ֪ד לְ/שָׁ֫א֥וּל וַ/יֹּ֥אמֶר ל֑/וֹ בָּ֥א דָ֝וִ֗ד אֶל בֵּ֥ית אֲחִימֶֽלֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/001.yaml
  text: when Doeg the Edomite came and told Saul[a], saying to him, “David has come to the house of Ahimelech.”
translation:
  language: de
  text: 'als Doeg, der Edomiter, kam, Saul Bericht erstattete und ihm sagte: »David ist zum Haus Ahimelechs gekommen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »David kam zum Haus Ahimelechs.« Das hebräische Perfekt kann in der direkten Rede sowohl als einfache Vergangenheit als auch als vollendetes Geschehen mit Gegenwartsbezug wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּב֤וֹא
  choice: als … kam
  rationale: ב mit dem Infinitivus constructus von בוא leitet einen temporalen Nebensatz ein; »als … kam« ist im Deutschen natürlich und präzise.
- source_word: דּוֹאֵג
  choice: Doëg
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben; das Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: הָאֲדֹמִי
  choice: der Edomiter
  rationale: Das Gentiliz bezeichnet Doëg nach seiner Herkunft beziehungsweise Volkszugehörigkeit.
- source_word: וַיַּגֵּד לְשָׁאוּל
  choice: Saul Bericht erstattete
  rationale: נגד im Hifil bedeutet hier »berichten, mitteilen«. »Bericht erstatten« passt zum Kontext einer Meldung an den König und unterscheidet die Wendung idiomatisch vom folgenden »sagte«.
- source_word: וַיֹּאמֶר לוֹ
  choice: und ihm sagte
  rationale: Die Formulierung bewahrt die hebräische Abfolge und macht Saul als Empfänger der direkten Mitteilung durch das Pronomen kenntlich.
- source_word: בָּא
  choice: ist … gekommen
  rationale: Das Qal-Perfekt bezeichnet eine vollendete Bewegung. Im direkten Bericht gibt das deutsche Perfekt die vom Standpunkt des Sprechers gegenwärtig relevante Ankunft natürlich wieder; das Präteritum bleibt möglich.
- source_word: דָוִד
  choice: David
  rationale: Wiedergabe des Personennamens in seiner etablierten deutschen Form.
- source_word: אֶל בֵּית
  choice: zum Haus
  rationale: אֶל bezeichnet die Bewegung auf ein Ziel hin. »Zum Haus« gibt dies idiomatisch wieder, ohne zwingend ein Betreten des Gebäudes auszudrücken.
- source_word: אֲחִימֶלֶךְ
  choice: Ahimelech
  rationale: Wiedergabe des Personennamens in seiner etablierten deutschen Form.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Syntax lässt erkennen, dass der Satz zu einer vorangehenden Überschrift gehört. »Bericht erstattete« vermeidet eine schwerfällige Wiederholung von »sagte«, während »und ihm sagte« die hebräische Redeeinleitung bewahrt.
