source:
  edition: WLC
  text: אָהַ֣בְתָּ רָּ֣ע מִ/טּ֑וֹב שֶׁ֓קֶר מִ/דַּבֵּ֖ר צֶ֣דֶק סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/004.yaml
  text: You have loved evil more than good[a], falsehood more than speaking righteousness. Selah
translation:
  language: de
  text: Du hast das Böse mehr geliebt als das Gute, die Lüge mehr als das Rechte zu sagen.[a] Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lüge mehr als gerecht zu reden.“'
    reason: Die Fußnote hält die weitere ethische Nuance von צֶדֶק im Zusammenhang mit Reden fest und bietet eine sprachlich natürliche Alternative.
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: du hast … geliebt
  rationale: Das Qal Perfekt, 2. Person maskulin Singular, richtet die Anklage unmittelbar an den Frevler. Das deutsche Perfekt klingt gegenwärtig und bewahrt die vollendete Aussage.
- source_word: רָע
  choice: das Böse
  rationale: Im ausdrücklichen Gegensatz zu טוֹב bezeichnet das Wort hier moralisch Böses, nicht nur Schaden oder etwas Unangenehmes.
- source_word: מִטּוֹב
  choice: mehr … als das Gute
  rationale: Die Präposition מִן kennzeichnet nach dem Verb des Liebens eine Bevorzugung beziehungsweise einen Vergleich.
- source_word: שֶׁקֶר
  choice: die Lüge
  rationale: Das Substantiv kann Lüge, Falschheit oder Täuschung bezeichnen. „Die Lüge“ ist im Deutschen natürlich und erhält den moralischen Gegensatz zum rechten Reden.
- source_word: מִדַּבֵּר
  choice: mehr, als … zu sagen
  rationale: מִן führt erneut das zurückgesetzte Vergleichsglied ein; die verbale Form wird im Deutschen natürlich durch einen Infinitiv wiedergegeben.
- source_word: צֶדֶק
  choice: das Rechte
  rationale: Im Zusammenhang des Redens bezeichnet צֶדֶק das, was richtig, wahrhaftig und moralisch recht ist. „Das Rechte“ vermeidet die unnatürliche Wendung „Gerechtigkeit reden“, ohne den ethischen Gehalt auf bloße Tatsachenrichtigkeit zu verengen.
- source_word: סֶלָה
  choice: Sela
  rationale: Die genaue Bedeutung des liturgischen oder musikalischen Ausdrucks ist unsicher; daher wird er transliteriert.
theological_decisions:
- issue: Wiedergabe von צֶדֶק im Zusammenhang mit Reden
  choice: das Rechte
  alternative: Gerechtigkeit; gerecht
  rationale: „Das Rechte sagen“ gibt den ethischen Gegensatz zu שֶׁקֶר in verständlichem Deutsch wieder. Zugleich bleibt durch die substantivische Form die umfassendere moralische Bedeutung erhalten, ohne צֶדֶק einseitig als soziale oder forensische „Gerechtigkeit“ festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter poetischer Anklage. Die parallele Vergleichsstruktur des Hebräischen bleibt erhalten; „Sela“ wird wegen seiner unsicheren Bedeutung unübersetzt gelassen.
