source:
  edition: WLC
  text: אוֹדְ/ךָ֣ לְ֭/עוֹלָם כִּ֣י עָשִׂ֑יתָ וַ/אֲקַוֶּ֖ה שִׁמְ/ךָ֥ כִֽי ט֝֗וֹב נֶ֣גֶד חֲסִידֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/010.yaml
  text: I will give thanks to you forever[a], because you have done it; I will wait for your name, for it is good[c][b], in the presence of your faithful ones.
translation:
  language: de
  text: Ich will dir für immer danken, denn du hast es getan; auf deinen Namen will ich hoffen[a], denn er ist gut, vor deinen Getreuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Auf deinen Namen will ich warten.'
    reason: 'Lexikalische Alternative: קוה kann sowohl „hoffen“ als auch „warten“ bedeuten.'
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Ich werde dir danken
  rationale: Das Hifil von ידה bezeichnet hier dankendes Lob. „Danken“ gibt die direkte Anrede natürlich wieder, ohne den Lobaspekt auszuschließen.
- source_word: לְעוֹלָם
  choice: ewig
  rationale: Die Wendung bezeichnet eine unbegrenzte, fortdauernde Zeit; „ewig“ ist im Deutschen knapp und idiomatisch.
- source_word: עָשִׂיתָ
  choice: du hast gehandelt
  rationale: עשה kann „tun“ oder „handeln“ bedeuten. Da im Hebräischen kein ausdrückliches Objekt steht, vermeidet „gehandelt“ ein ergänztes „es“ und lässt den Bezug auf Gottes zuvor beschriebenes Eingreifen offen.
- source_word: וַאֲקַוֶּה
  choice: will ich hoffen
  rationale: קוה umfasst erwartungsvolles Warten und Hoffen. Zusammen mit „deinem Namen“ ist „auf … hoffen“ im heutigen Deutsch verständlicher als „auf einen Namen warten“, bewahrt aber die erwartungsvolle Ausrichtung.
- source_word: שִׁמְךָ
  choice: auf deinen Namen
  rationale: „Name“ bleibt als biblische Bezeichnung für Gottes offenbartes Wesen und seinen Ruf erhalten, statt durch „dich“ erklärend ersetzt zu werden.
- source_word: כִּי טוֹב
  choice: denn es ist gut
  rationale: Der hebräische Satz nennt kein ausdrückliches Subjekt. Das neutrale „es“ bewahrt diese knappe Offenheit, während der unmittelbare Zusammenhang eine Beziehung zu Gottes Namen nahelegt.
- source_word: נֶגֶד
  choice: vor
  rationale: נגד bezeichnet hier die Gegenwart beziehungsweise den Blick einer Gemeinschaft. „Vor“ ist im Deutschen knapp und kann sowohl räumliche Gegenwart als auch öffentliches Bekennen ausdrücken.
- source_word: חֲסִידֶיךָ
  choice: deinen Getreuen
  rationale: חסיד bezeichnet Menschen, die von Bundestreue und Hingabe geprägt sind. „Getreue“ erhält diesen Beziehungsaspekt und vermeidet spätere technische Bedeutungen von „Heilige“.
theological_decisions:
- issue: Bezug von כִּי טוֹב
  choice: denn es ist gut
  alternative: denn dein Name ist gut
  rationale: Der hebräische Text ist elliptisch und setzt kein ausdrückliches Subjekt. Die Hauptfassung bewahrt diese Offenheit; die Fußnote nennt die naheliegende ausdrückliche Zuordnung zu Gottes Namen.
- issue: Wiedergabe von חֲסִידֶיךָ
  choice: deinen Getreuen
  alternative: deinen Frommen / deinen Heiligen
  rationale: „Getreue“ betont die loyale, hingebungsvolle Beziehung zu Gott, ohne den Ausdruck konfessionell oder kirchlich zu verengen.
- issue: Semantik von קוה in Verbindung mit Gottes Namen
  choice: auf deinen Namen hoffen
  alternative: auf deinen Namen warten
  rationale: Das Verb trägt sowohl den Sinn des Wartens als auch des Hoffens. Die Hauptfassung wählt im Deutschen die natürliche Formulierung für erwartungsvolles Vertrauen; die Fußnote bewahrt die formal nähere Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus wird durch zwei Hauptsätze erhalten. „Getreue“ ist verständlich, leicht gehoben und trägt den Gedanken beständiger Hingabe. Die ungewöhnliche Verbindung von Hoffen beziehungsweise Warten und Gottes Namen wird nicht paraphrasierend aufgelöst.
