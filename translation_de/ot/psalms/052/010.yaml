revisions:
- from: Ich werde dir ewig danken, denn du hast gehandelt. Auf deinen Namen will ich hoffen[a], denn es ist gut[b], vor deinen Getreuen.
  to: Ich will dir für immer danken, denn du hast es getan; auf deinen Namen will ich hoffen[a], denn er ist gut, vor deinen Getreuen.
  rationale: Die Revision präzisiert den wahrscheinlichen Bezug von טוֹב auf Gottes Namen, ohne eine über den Text hinausgehende Deutung einzutragen. Sie ersetzt außerdem die etwas allgemeinere Wiedergabe „gehandelt“ durch die nähere deutsche Entsprechung von עשה. Die Fußnote zu „warten“ bleibt als legitime lexikalische Alternative erhalten; die bisherige Fußnote zur expliziten Namensreferenz ist nach der Aufnahme in den Haupttext entbehrlich.
