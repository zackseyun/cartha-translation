source:
  edition: WLC
  text: אָהַ֥בְתָּ כָֽל דִּבְרֵי בָ֗לַע לְשׁ֣וֹן מִרְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/005.yaml
  text: You love all words of destruction[a], O deceitful tongue.
translation:
  language: de
  text: Du liebst alle verschlingenden Worte, du trügerische Zunge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische hat ein Perfekt („Du hast geliebt“) und verbindet „Worte“ mit einem Ausdruck aus der Wortfamilie „verschlingen“; auch „Worte des Verderbens“ ist als Deutung möglich.
    reason: Macht Zeitform und die bildhafte, nicht völlig eindeutig abstrahierte Bedeutung von בָלַע sichtbar.
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Du liebst
  rationale: Das Qal Perfekt 2. Person maskulin Singular bezeichnet hier in der poetischen Anklage eine erkennbare, anhaltende Neigung. Das deutsche Präsens gibt diese gegenwärtige Charakterisierung natürlich wieder; formal ist auch „du hast geliebt“ möglich.
- source_word: כָל דִּבְרֵי
  choice: jedes … Wort
  rationale: כָל mit dem pluralischen Konstrukt דִּבְרֵי umfasst die Gesamtheit der Äußerungen. Im Deutschen ist „jedes … Wort“ idiomatisch und bewahrt den umfassenden Vorwurf.
- source_word: בָלַע
  choice: verschlingende
  rationale: Das Wort gehört zur Wurzel „verschlingen“ und beschreibt bildhaft die vernichtende Wirkung der Rede. „Verschlingend“ erhält dieses kräftige Bild, statt es lediglich als „zerstörerisch“ zu deuten.
- source_word: לְשׁוֹן
  choice: Zunge
  rationale: Die konkrete Bezeichnung „Zunge“ steht metonymisch für das Reden und bewahrt die poetische direkten Anrede.
- source_word: מִרְמָה
  choice: trügerische
  rationale: Das Substantiv bezeichnet Trug oder Täuschung. In der Verbindung mit „Zunge“ ist die adjektivische Wiedergabe im Deutschen natürlich; formaler wäre „Zunge des Trugs“.
theological_decisions: []
translation_notes:
  register: Moderne, verständliche und zugleich poetisch-würdevolle Anklagerede. Die wiederholte direkte Anrede mit „du“ entspricht natürlichem deutschen Sprachgebrauch; ein altertümliches „o“ wird vermieden.
