  text: אָ֭כֵן כְּ/אָדָ֣ם תְּמוּת֑וּ/ן וּ/כְ/אַחַ֖ד הַ/שָּׂרִ֣ים תִּפֹּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/007.yaml
  text: Nevertheless[a], you will die like men[b], and fall like one of the princes.
translation:
  language: de
  text: Doch ihr werdet wie Menschen[a] sterben und wie einer der Fürsten[b] fallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Adam sterben“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Herrscher“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: Doch
  rationale: Markiert prägnant den nachdrücklichen Gegensatz zwischen der zuvor zugesprochenen hohen Stellung und dem nun angekündigten Tod.
- source_word: כְּאָדָם
  choice: wie Menschen
  rationale: אָדָם bezeichnet hier am natürlichsten den Menschen beziehungsweise die Menschheit im Gegensatz zu göttlichem Rang. Der deutsche Plural gibt den kollektiven Vergleich idiomatisch wieder; die mögliche Deutung als Eigenname Adam wird nicht verschwiegen.
- source_word: תְּמוּתוּן
  choice: ihr werdet sterben
  rationale: Das Qal-Imperfekt in der 2. Person Plural kündigt im Gerichtszusammenhang den künftigen Tod der Angeredeten an.
- source_word: וּכְאַחַד
  choice: und wie einer
  rationale: Bewahrt die Konstruktion, die einen einzelnen Angehörigen der folgenden Gruppe zum Vergleich heranzieht.
- source_word: הַשָּׂרִים
  choice: der Fürsten
  rationale: שׂרים bezeichnet hochrangige Herrscher oder Amtsträger. „Fürsten“ wahrt den traditionellen und sozialen Rangbegriff; „Herrscher“ bleibt als lexikalische Alternative möglich.
- source_word: תִּפֹּלוּ
  choice: fallen
  rationale: Bewahrt die knappe Metapher für Untergang beziehungsweise Sturz im Gericht.
theological_decisions:
- issue: Deutung von אָדָם in כְּאָדָם
  choice: 'generisch: „wie Menschen“'
  alternative: „wie Adam“
  rationale: Der unmittelbare Zusammenhang stellt den angeblich göttlichen Rang der Angeredeten ihrer menschlichen Sterblichkeit gegenüber. Da אָדָם zugleich als Eigenname Adam verstanden werden kann, bleibt diese echte Mehrdeutigkeit in einer Fußnote erhalten.
- issue: Bedeutung von שׂרים
  choice: „Fürsten“
  alternative: „Herrscher“
  rationale: Beide Bedeutungen sind lexikalisch möglich. „Fürsten“ erhält den gehobenen Rang und die traditionelle Bildsprache, ohne die Angeredeten näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. Die Wortstellung hält „wie Menschen“ eng bei „sterben“ und „wie einer der Fürsten“ bei „fallen“.
