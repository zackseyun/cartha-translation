lexical_decisions:
- source_word: עַד מָתַי
  choice: Wie lange … noch
  rationale: Die idiomatische Zeitfrage leitet einen vorwurfsvollen Protest ein; „noch“ macht im Deutschen den anhaltenden Charakter natürlich deutlich.
- source_word: תִּשְׁפְּטוּ
  choice: wollt ihr … richten
  rationale: Das Imperfekt in der rhetorischen Frage bezeichnet fortgesetztes Handeln. „Wollt ihr … noch“ gibt den tadelnden Sinn idiomatisch wieder, ohne die Aussage auf die Zukunft zu beschränken.
- source_word: עָוֶל
  choice: ungerecht
  rationale: Das Substantiv wird hier adverbial zum Richten gebraucht; „ungerecht richten“ bewahrt den gerichtlichen Zusammenhang in natürlichem Deutsch.
- source_word: וּפְנֵי … תִּשְׂאוּ
  choice: und … bevorzugen
  rationale: Wörtlich „das Gesicht … erheben“; die hebräische Wendung bezeichnet hier parteiische Begünstigung.
- source_word: רְשָׁעִים
  choice: die Schuldigen
  rationale: Im gerichtlichen Kontext bezeichnet רְשָׁעִים die moralisch beziehungsweise rechtlich im Unrecht Stehenden. „Die Schuldigen“ wahrt diesen forensischen Akzent.
- source_word: סֶלָה
  choice: Sela
  rationale: Die traditionelle Umschrift bleibt stehen, weil Bedeutung und genaue Funktion des Ausdrucks unsicher sind.
theological_decisions:
- issue: Gerichtliche Parteilichkeit zugunsten der רְשָׁעִים
  choice: die Schuldigen bevorzugen
  alternative: die Frevler begünstigen
  rationale: Die Formulierung benennt korrupte Rechtsprechung klar, ohne über den gerichtlichen Kontext hinaus zusätzliche theologische Festlegungen einzutragen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die rhetorische Schärfe des Vorwurfs bleibt erhalten; „Sela“ wird wegen seiner unsicheren Bedeutung nicht gedeutet.
