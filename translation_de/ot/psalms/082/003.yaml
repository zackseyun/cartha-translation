  text: שִׁפְטוּ דַ֥ל וְ/יָת֑וֹם עָנִ֖י וָ/רָ֣שׁ הַצְדִּֽיקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/003.yaml
  text: Defend the weak and the fatherless; vindicate the afflicted and the poor.
translation:
  language: de
  text: Verschafft den Schwachen und Waisen Recht; verhelft den Elenden und Armen zu ihrem Recht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁפְטוּ
  choice: Verteidigt
  rationale: Das Verb bedeutet grundlegend „richten/Recht sprechen“; im Kontext bezeichnet es das Eintreten für die Rechtsansprüche Schutzloser. „Verteidigt“ gibt diese konkrete richterliche Verpflichtung natürlich wieder.
- source_word: דַל
  choice: die Schwachen
  rationale: דַל bezeichnet hier gesellschaftlich Schwache oder Geringe, die Schutz benötigen; der Plural ist im Deutschen als generische Gruppenbezeichnung idiomatisch.
- source_word: יָתוֹם
  choice: die Waisen
  rationale: Das Wort bezeichnet elternlose, besonders schutzbedürftige Menschen. Der deutsche Plural entspricht der kollektiven Aussage.
- source_word: עָנִי
  choice: den Elenden
  rationale: עָנִי kann arm, bedrängt oder elend bedeuten. „Elenden“ bewahrt hier gegenüber רָשׁ den Akzent auf Bedrängnis und Not.
- source_word: רָשׁ
  choice: Armen
  rationale: רָשׁ bezeichnet mittellose bzw. arme Menschen und wird daher direkt mit „Armen“ wiedergegeben.
- source_word: הַצְדִּיקוּ
  choice: verhelft ... zu ihrem Recht
  rationale: Der Hifil-Imperativ bedeutet „für gerecht erklären/rechtfertigen“ und kann im gerichtlichen Zusammenhang heißen, jemandem Recht zu verschaffen. Die Formulierung vermeidet das missverständliche „rechtfertigt die Armen“, ohne den forensischen Sinn aufzugeben.
theological_decisions:
- issue: Gerichtlicher Auftrag an die angesprochenen Mächtigen
  choice: „Verteidigt ...; verhelft ... zu ihrem Recht“
  alternative: „Richtet ...; erklärt ... für gerecht“
  rationale: Der Vers fordert keine pauschale Parteinahme unabhängig vom Recht, sondern gerechtes richterliches Handeln zugunsten von Menschen, deren Ansprüche leicht übergangen werden. Die Übersetzung bewahrt den Rechtskontext in verständlichem Deutsch.
translation_notes:
  register: Dignitatives, klares Standarddeutsch mit parallelen Imperativen. Die Gruppenbezeichnungen stehen im idiomatischen Plural; das Semikolon erhält den hebräischen Parallelismus.
