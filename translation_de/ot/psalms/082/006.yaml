  edition: WLC
  text: אֲֽנִי אָ֭מַרְתִּי אֱלֹהִ֣ים אַתֶּ֑ם וּ/בְנֵ֖י עֶלְי֣וֹן כֻּלְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/006.yaml
  text: I said, “You are gods, and all of you are sons of the Most High.”
translation:
  language: de
  text: 'Ich habe gesagt: »Ihr seid Götter, und ihr alle seid Söhne des Höchsten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי אָמַרְתִּי
  choice: Ich habe gesagt
  rationale: Gibt das betonte Subjekt אֲנִי und das perfektive אָמַרְתִּי natürlich und inhaltlich genau wieder.
- source_word: אֱלֹהִים אַתֶּם
  choice: Ihr seid Götter
  rationale: Bewahrt die direkte, theologisch spannungsreiche Aussage des Hebräischen, ohne אֱלֹהִים durch eine erklärende Deutung wie »Richter« zu ersetzen.
- source_word: וּבְנֵי עֶלְיוֹן כֻּלְּכֶם
  choice: und ihr alle seid Söhne des Höchsten
  rationale: Gibt die koordinierende Konjunktion וּ, den Status constructus בְנֵי עֶלְיוֹן und das umfassende כֻּלְּכֶם ausdrücklich wieder; die ergänzte Kopula ist im Deutschen erforderlich.
theological_decisions:
- issue: Bedeutung von אֱלֹהִים für die Angeredeten
  choice: Götter
  alternative: Richter / göttliche Wesen
  rationale: Der Ausgangstext bezeichnet die Angeredeten unmittelbar als אֱלֹהִים. Die Übersetzung lässt ihre genaue Identität offen und löst die Spannung des Psalms nicht durch eine interpretierende Ersatzbezeichnung auf.
- issue: Wiedergabe von בְנֵי עֶלְיוֹן
  choice: Söhne des Höchsten
  alternative: Kinder des Höchsten
  rationale: »Söhne« entspricht dem maskulinen Plural בְנֵי und bewahrt die traditionelle wie intertextuell bedeutsame Formulierung, ohne festzulegen, ob sie ontologisch, repräsentativ oder statusbezogen gemeint ist.
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die Parallelstruktur und die unmittelbare Anrede des hebräischen Verses bleiben erhalten.
