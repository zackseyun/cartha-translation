  source_fidelity: 'Der deutsche Text gibt die hebräische Aussage und Parallelstruktur präzise wieder: das betonte »Ich«, die direkte Prädikation »Götter«, die Anrede im Plural sowie »Söhne des Höchsten« für בְנֵי עֶלְיוֹן. Die Identität der Angeredeten wird nicht über den Wortlaut hinaus festgelegt.'
