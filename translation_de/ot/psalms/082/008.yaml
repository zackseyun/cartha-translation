lexical_decisions:
- source_word: קוּמָה
  choice: Steh auf
  rationale: Der Imperativ von קום ist ein dringender Aufruf an Gott zum Eingreifen. „Steh auf“ ist im heutigen Deutsch natürlich und bewahrt das Bild, ohne archaisch zu klingen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Singularformen der Imperative und des Pronomens zeigen, dass Gott direkt angeredet wird. Der deutsche Vokativ benötigt kein zusätzliches Anredewort.
- source_word: שָׁפְטָה
  choice: richte
  rationale: Der Imperativ von שׁפט umfasst hier sowohl richterliches Urteilen als auch königliche Rechtsausübung. „Richte“ bewahrt diese Bedeutungsbreite.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Der Parallelbezug auf alle Völker legt den weltweiten Sinn nahe, nicht das örtlich begrenzte „Land“.
- source_word: כִּי
  choice: Denn
  rationale: כִּי führt die Begründung der vorausgehenden Bitte ein; „denn“ gibt diesen Zusammenhang knapp und würdig wieder.
- source_word: אַתָּה
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen hebt den Adressaten hervor. Die direkte deutsche Anrede bewahrt diesen Nachdruck hinreichend.
- source_word: תִנְחַל
  choice: wirst … als Erbe empfangen
  rationale: נחל bezeichnet häufig den Empfang oder Besitz eines Erbteils. Die Formulierung erhält die Erbmetaphorik und klingt im Deutschen natürlicher als „wirst … erben“, wenn Gott Subjekt ist.
- source_word: בְּכָל הַגּוֹיִם
  choice: alle Völker
  rationale: Mit נחל bezeichnet die Wortgruppe idiomatisch den umfassenden Gegenstand des Erbempfangs. „Alle Völker“ bewahrt Universalität und kollektiven Plural.
theological_decisions:
- issue: Gottes Verhältnis zu den Völkern in תִנְחַל בְּכָל הַגּוֹיִם
  choice: Denn du wirst alle Völker als Erbe empfangen.
  alternative: Denn alle Völker werden dein Besitz sein.
  rationale: Die Übersetzung bewahrt das biblische Motiv des Erbempfangs und damit Gottes universalen Anspruch, ohne die Aussage zu einer bloßen Besitzfeststellung zu verflachen. Die Fußnote nennt die sachlich mögliche Besitzwiedergabe.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Der kurze Ausruf wahrt die Dringlichkeit des hebräischen Verses; die Erbmetaphorik bleibt erhalten.
