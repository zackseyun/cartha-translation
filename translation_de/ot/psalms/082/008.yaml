base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/008.yaml
  text: Rise up[a], O God; judge the earth[b], for you will inherit all the nations.
translation:
  language: de
  text: Steh auf, Gott, richte die Erde! Denn du wirst alle Völker erben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Denn du wirst alle Völker in Besitz nehmen.'
