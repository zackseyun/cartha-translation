  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֗ים נִצָּ֥ב בַּ/עֲדַת אֵ֑ל בְּ/קֶ֖רֶב אֱלֹהִ֣ים יִשְׁפֹּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/000.yaml
  text: A psalm of Asaph[a]. God stands in the assembly of God; in the midst of the gods he judges.
translation:
  language: de
  text: 'Ein Psalm Asafs.


    Gott steht in der Versammlung Gottes; inmitten der Götter[a] hält er Gericht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der göttlichen Wesen«. Manche verstehen die »Götter« hier als menschliche Richter oder Herrscher.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Ein Psalm Asafs
  rationale: Die knappe Genitivform gibt die Überschrift natürlich wieder, ohne die Beziehung zu Asaf ausdrücklich auf Verfasserschaft festzulegen.
- source_word: נִצָּב
  choice: steht
  rationale: Entspricht dem präsentisch geschilderten Auftreten Gottes in der Versammlung und bewahrt das markante Bild des Hebräischen.
- source_word: בַּעֲדַת אֵל
  choice: in der Versammlung Gottes
  rationale: Gibt die Konstruktion formal und verständlich wieder; eine Deutung als göttliche Ratsversammlung wird nicht in den Haupttext hineingelesen.
- source_word: בְּקֶרֶב אֱלֹהִים
  choice: inmitten der Götter
  rationale: Bewahrt den Pluralgebrauch von אֱלֹהִים und damit die genuine Mehrdeutigkeit hinsichtlich göttlicher Wesen oder menschlicher Machthaber.
- source_word: יִשְׁפֹּט
  choice: hält er Gericht
  rationale: Gibt die richterliche Tätigkeit idiomatisch und würdevoll wieder; das Subjekt Gott bleibt eindeutig.
theological_decisions:
- issue: Identität der אֱלֹהִים im zweiten Halbvers
  choice: Götter, mit erläuternder Fußnote
  alternative: göttliche Wesen; Richter; Machthaber
  rationale: Der hebräische Plural bezeichnet hier wörtlich »Götter«, während der Kontext unterschiedliche Deutungen zulässt. Der Haupttext wahrt die sprachliche Spannung, die Fußnote nennt die wichtigsten Verständnisweisen.
- issue: Bedeutung von עֲדַת אֵל
  choice: Versammlung Gottes
  alternative: Götterversammlung; göttlicher Rat
  rationale: Die gewählte Wiedergabe bleibt nahe an der hebräischen Formulierung und legt weder eine bestimmte himmlische Ratsvorstellung noch eine rein menschliche Gerichtsversammlung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Parallelität und die auffällige Wiederholung von אֱלֹהִים als »Gott« und »Götter« bleiben erkennbar; theologisch umstrittene Identifizierungen werden nicht stillschweigend entschieden.
