id: PSA.82.1
reference: Psalms 82:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֗ים נִצָּ֥ב בַּ/עֲדַת אֵ֑ל בְּ/קֶ֖רֶב אֱלֹהִ֣ים יִשְׁפֹּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/001.yaml
  text: A psalm of Asaph[a]. God stands in the divine assembly; in the midst of the gods he judges.
translation:
  language: de
  text: Ein Psalm Asafs. Gott steht in der Versammlung Gottes; inmitten der Götter[a] hält er Gericht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der göttlichen Wesen«. Manche verstehen unter den »Göttern« hier menschliche Richter oder Herrscher.'
    reason: Bewahrt die mögliche Bezeichnung himmlischer Wesen sowie die traditionelle Deutung auf menschliche Autoritätsträger.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Die übliche und sachlich passende deutsche Gattungsbezeichnung für מִזְמוֹר in einer Psalmüberschrift.
- source_word: לְאָסָף
  choice: Asafs
  rationale: Der Genitiv ist in deutschen Psalmüberschriften natürlich und lässt das genaue Verhältnis Asafs zum Psalm offen; gemeint sein können Urheberschaft, Zugehörigkeit oder Zuordnung.
- source_word: אֱלֹהִים (erstes Vorkommen)
  choice: Gott
  rationale: Das singularische Partizip נִצָּב und das folgende singularische Verb weisen auf den Gott Israels als einzelnes Subjekt.
- source_word: נִצָּב
  choice: steht
  rationale: Die Form schildert Gott stehend in einer Gerichtsszene; „steht“ bewahrt das Bild knapp und ohne zusätzliche Deutung.
- source_word: בַּעֲדַת אֵל
  choice: in der Versammlung Gottes
  rationale: Die Wiedergabe bleibt nahe an der Verbindung aus „Versammlung“ und אֵל und vermeidet, die Art dieser Versammlung im Haupttext stärker festzulegen, als es der hebräische Ausdruck tut.
- source_word: בְּקֶרֶב
  choice: inmitten
  rationale: Gibt die räumliche Vorstellung prägnant und in gehobenem, aber gegenwärtigem Deutsch wieder.
- source_word: אֱלֹהִים (zweites Vorkommen)
  choice: der Götter
  rationale: Hier bezeichnet אֱלֹהִים eine Mehrzahl, in deren Mitte Gott Gericht hält. „Götter“ ist die direkteste lexikalische Wiedergabe; mögliche Referenten werden in der Fußnote genannt.
- source_word: יִשְׁפֹּט
  choice: hält er Gericht
  rationale: Die Wendung gibt den richterlichen Sinn von שפט in dieser Szene natürlich wieder und erhält zugleich den feierlichen Ton.
theological_decisions:
- issue: Bezug des zweiten אֱלֹהִים in Psalm 82,1
  choice: Im Haupttext „Götter“, verstanden als eine Mehrzahl von Wesen oder Trägern von Autorität, über die Gott Gericht hält.
  alternative: „göttliche Wesen“; nach anderer Auslegung menschliche Richter oder Herrscher
  rationale: Grammatik und Satzbau unterscheiden Gott als singularisches Subjekt von der pluralischen Gruppe. Die direkte Wiedergabe „Götter“ wahrt die sprachliche Spannung; die Fußnote bewahrt die wesentlichen Deutungsalternativen, ohne sie im Haupttext zu entscheiden.
- issue: Deutung von עֲדַת אֵל
  choice: „Versammlung Gottes“
  alternative: „göttliche Versammlung“ oder „Rat Gottes“
  rationale: „Versammlung Gottes“ bildet die hebräische Wortverbindung transparent ab und lässt offen, ob der Ausdruck besonders als himmlischer Rat zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Gerichts- und Versammlungsszene bleibt erhalten; ungewohnte theologische Spannung wird nicht durch eine eindeutige Auslegung im Haupttext geglättet.
