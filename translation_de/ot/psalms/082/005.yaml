id: PSA.82.5
reference: Psalms 82:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹ֤א יָֽדְע֨וּ וְ/לֹ֥א יָבִ֗ינוּ בַּ/חֲשֵׁכָ֥ה יִתְהַלָּ֑כוּ יִ֝מּ֗וֹטוּ כָּל מ֥וֹסְדֵי אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/005.yaml
  text: They do not know[a], and they do not understand; they walk about in darkness[b]; all the foundations of the earth are shaken.
translation:
  language: de
  text: Sie wissen nichts und verstehen nichts; im Dunkeln gehen sie umher. Alle Grundfesten der Erde[a] wanken[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: des Landes.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: werden erschüttert; oder: geben nach.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יָדְעוּ
  choice: sie wissen nichts
  rationale: Das Qal von ידע bedeutet hier „wissen“. Die Perfektform beschreibt im poetischen Zusammenhang einen gegenwärtigen Zustand der Unwissenheit und steht parallel zum folgenden „verstehen“.
- source_word: וְלֹא יָבִינוּ
  choice: und verstehen nichts
  rationale: Das Hifil von בין kann „verstehen“ oder „einsichtig unterscheiden“ bedeuten. „Verstehen“ ist im heutigen Deutsch natürlich und bewahrt den Parallelismus mit „wissen“.
- source_word: בַּחֲשֵׁכָה
  choice: im Dunkeln
  rationale: Die Präposition bezeichnet den Bereich, in dem sie sich bewegen. „Im Dunkeln“ gibt sowohl das Bild als auch den möglichen übertragenen Sinn knapp und idiomatisch wieder.
- source_word: יִתְהַלָּכוּ
  choice: gehen sie umher
  rationale: Der Hitpael von הלך kann ein fortgesetztes oder wiederholtes Umhergehen ausdrücken. Die Wortstellung erhält den poetischen Nachdruck auf „im Dunkeln“.
- source_word: יִמּוֹטוּ
  choice: wanken
  rationale: Das Nifal von מוט bezeichnet das Erschüttertwerden, Schwanken oder Nachgeben. „Wanken“ bewahrt das starke poetische Bild, ohne einen bereits vollendeten Zusammenbruch zu behaupten.
- source_word: כָּל מוֹסְדֵי אָרֶץ
  choice: alle Grundfesten der Erde
  rationale: מוֹסְדֵי bezeichnet Fundamente oder tragende Grundlagen. „Grundfesten“ ist verständlich und poetisch; אָרֶץ wird im umfassenden Kontext als „Erde“ wiedergegeben, kann jedoch auch „Land“ bedeuten.
theological_decisions:
- issue: Reichweite von אָרֶץ und das Bild der erschütterten Weltordnung
  choice: „Erde“ als umfassende, kosmische Aussage
  alternative: „Land“ als örtlich begrenzte Aussage
  rationale: Der Psalm verbindet ungerechtes Richten mit dem Wanken der tragenden Ordnung. „Erde“ bewahrt die mögliche weltweite Tragweite des Bildes; die ebenfalls mögliche lokale Bedeutung wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knapper poetischer Parallelstruktur. „Grundfesten“ bewahrt die Würde und Bildkraft des hebräischen Ausdrucks, bleibt aber für heutige Leser verständlich.
