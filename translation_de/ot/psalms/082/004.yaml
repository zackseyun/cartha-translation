  text: Rettet den Armen und Bedürftigen[a]; entreißt ihn der Hand der Gottlosen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rettet den Schwachen und Bedürftigen.“ Das hebräische Wort דַּל kann „arm“ oder „schwach“ bedeuten und hebt sowohl materielle Not als auch Schutzlosigkeit hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלְּטוּ
  choice: Rettet
  rationale: Der Imperativ Plural von פלט fordert zum aktiven Eingreifen auf, um gefährdete Menschen in Sicherheit zu bringen. „Rettet“ ist im heutigen Deutsch natürlich und gibt die Dringlichkeit wieder.
- source_word: דַל
  choice: den Armen
  rationale: דַּל kann einen armen, schwachen oder gesellschaftlich machtlosen Menschen bezeichnen. Zusammen mit אֶבְיוֹן und im Zusammenhang gerechter Rechtsprechung steht hier die soziale und wirtschaftliche Schutzlosigkeit im Vordergrund.
- source_word: אֶבְיוֹן
  choice: Bedürftigen
  rationale: אֶבְיוֹן bezeichnet jemanden, dem das Lebensnotwendige fehlt. „Bedürftigen“ wahrt gegenüber „Armen“ eine gewisse Bedeutungsabstufung und klingt zugleich natürlich.
- source_word: מִיַּד
  choice: der Hand
  rationale: Die hebräische Wendung bezeichnet Macht oder Gewalt, bewahrt aber bewusst das konkrete Bild der Hand. Dieses Bild ist auch im Deutschen verständlich.
- source_word: רְשָׁעִים
  choice: der Gottlosen
  rationale: Das substantivierte Adjektiv im Plural bezeichnet moralisch schuldige Menschen, hier insbesondere Unterdrücker. „Gottlose“ erhält den ethisch-religiösen Klang des Psalms und fügt kein grammatisches Geschlecht hinzu.
- source_word: הַצִּילוּ
  choice: entreißt
  rationale: Der Imperativ Plural von נצל bezeichnet die Befreiung aus Gefahr oder feindlicher Gewalt. „Entreißt“ unterscheidet den zweiten Befehl von „Rettet“ und verstärkt passend zum Bild der Hand den Gedanken der Befreiung aus fremder Macht.
theological_decisions:
- issue: Wiedergabe der parallelen Imperative, ohne die poetische Kraft des Hebräischen einzuebnen
  choice: 'Zwei aufeinander bezogene Befehle: „Rettet …; entreißt …!“'
  alternative: 'Ein einziger zusammengezogener Befehl, etwa: „Rettet den Armen und Bedürftigen aus der Hand der Gottlosen.“'
  rationale: Im Hebräischen stehen zwei Imperative, welche den Aufruf zum Schutz der Gefährdeten eindringlich verstärken. Beide Verben zu erhalten wahrt die poetische und moralische Dringlichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener hebräischer Bildsprache. Die Anrede steht entsprechend beiden hebräischen Imperativen im Plural. Das Pronomen „sie“ nimmt die beiden singularischen Kollektivbezeichnungen zusammenfassend auf.
