source:
  edition: WLC
  text: לְ/דָוִ֗ד בְּ/שַׁנּוֹת֣/וֹ אֶת טַ֭עְמ/וֹ לִ/פְנֵ֣י אֲבִימֶ֑לֶךְ וַֽ֝/יְגָרֲשֵׁ֗/הוּ וַ/יֵּלַֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/000.yaml
  text: Of David[a], when he changed his behavior before Abimelech, and he drove him away, and he went away.
translation:
  language: de
  text: Von David:[a] Als er vor Abimelech sein Verhalten änderte, Abimelech ihn fortjagte und er wegging.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In 1. Samuel 21,11–16 wird der König als Achisch bezeichnet. »Abimelech« könnte hier ein anderer Name oder ein Königstitel sein.
    reason: Bewahrt die abweichende Namensangabe des hebräischen Psalmtextes und weist zugleich auf die wahrscheinliche Verbindung mit der Samuelerzählung hin.
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Präposition לְ bei einem Personennamen in Psalmüberschriften kann Urheberschaft, Zugehörigkeit oder Widmung anzeigen. »Von David« entspricht der herkömmlichen deutschen Form, ohne die Beziehung völlig festzulegen.
- source_word: בְּשַׁנּוֹתוֹ
  choice: als er … änderte
  rationale: Der Infinitiv mit בְּ hat hier zeitliche Bedeutung. Die finite Wiedergabe ist im Deutschen natürlich und genau.
- source_word: טַעְמוֹ
  choice: sein Verhalten
  rationale: טַעַם bezeichnet wörtlich Geschmack beziehungsweise Urteilsvermögen, meint in diesem Zusammenhang aber Davids wahrnehmbares Auftreten. »Verhalten« gibt den Sinn wieder, ohne ausdrücklich »Vernunft« oder »Geisteszustand« festzulegen.
- source_word: לִפְנֵי אֲבִימֶלֶךְ
  choice: vor Abimelech
  rationale: »Vor« gibt die räumlich-personale Bedeutung von לִפְנֵי knapp und idiomatisch wieder.
- source_word: וַיְגָרֲשֵׁהוּ
  choice: dieser ihn fortjagte
  rationale: Das Verb bedeutet vertreiben oder fortjagen. Das Demonstrativpronomen »dieser« macht im Deutschen deutlich, dass Abimelech handelt, ohne einen Zweckzusammenhang einzuführen.
- source_word: וַיֵּלַךְ
  choice: und er wegging
  rationale: »Weggehen« entspricht dem einfachen Verb und passt zum Zusammenhang nach der Vertreibung. Das Pronomen bewahrt die knappe Ausdrucksweise des Hebräischen.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelech
  rationale: Der im hebräischen Text stehende Name wird beibehalten und nicht mit der Erzählung in 1. Samuel harmonisiert.
theological_decisions:
- issue: Historische Identifizierung Abimelechs
  choice: Im Haupttext bleibt der Name »Abimelech« erhalten.
  alternative: Abimelech als anderen Namen oder als Königstitel des Achisch von Gat verstehen.
  rationale: Der hebräische Wortlaut hat Vorrang. Die Spannung zur Samuelüberlieferung wird nicht durch eine Ersetzung im Haupttext aufgelöst, sondern in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Überschrift bleibt knapp; die ungewöhnliche Satzfügung folgt der Abfolge des Hebräischen. »Dieser« klärt lediglich den naheliegenden Bezug auf Abimelech.
