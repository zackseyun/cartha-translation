source:
  edition: WLC
  text: פְּנֵ֣י יְ֭הוָה בְּ/עֹ֣שֵׂי רָ֑ע לְ/הַכְרִ֖ית מֵ/אֶ֣רֶץ זִכְרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/016.yaml
  text: The face of Yahweh is against those who do evil[b][a], to cut off the memory of them from the earth.
translation:
  language: de
  text: Das Angesicht Jahwes richtet sich gegen die, die Böses tun, um die Erinnerung an sie von der Erde[a] zu tilgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Land“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵי
  choice: das Angesicht
  rationale: Bewahrt das konkrete hebräische Bild der persönlich und wirksam gegen die Übeltäter gerichteten Gegenwart Jahwes. „Angesicht“ ist im Deutschen würdevoll und verständlich, wenn auch poetisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: בְּעֹשֵׂי רָע
  choice: richtet sich gegen die, die Böses tun
  rationale: Die Präposition bezeichnet im Zusammenhang eine feindliche Ausrichtung. Die partizipiale Wendung wird ohne pauschalisierendes Etikett natürlich wiedergegeben.
- source_word: לְהַכְרִית
  choice: um … zu tilgen
  rationale: Der Hifil-Infinitiv bezeichnet hier Zweck beziehungsweise Folge. „Tilgen“ gibt das vollständige Beseitigen der Erinnerung idiomatisch und kräftig wieder.
- source_word: מֵאֶרֶץ
  choice: von der Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Im allgemeinen weisheitlichen Ausspruch ist der umfassende Sinn „Erde“ wahrscheinlich; die lokale Möglichkeit bleibt in der Fußnote erhalten.
- source_word: זִכְרָם
  choice: die Erinnerung an sie
  rationale: Gibt das Substantiv זֵכֶר mit seinem Suffix klar und in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Das Bild vom „Angesicht Jahwes“ als Ausdruck göttlicher Gegnerschaft
  choice: Das konkrete anthropomorphe Bild wird mit „Das Angesicht Jahwes richtet sich gegen …“ bewahrt.
  alternative: 'Abstrakter: „Jahwe ist gegen …“ oder idiomatisch: „Die Gegenwart Jahwes ist gegen …“'
  rationale: Die Formulierung erhält die poetische und theologische Kraft der persönlichen, aktiven Gegnerschaft Gottes, ohne eine grob körperliche Vorstellung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter hebräischer Bildsprache. „Angesicht“ und „tilgen“ setzen einen bewusst poetischen Ton, bleiben aber allgemein verständlich.
