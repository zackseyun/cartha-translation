  text: לְֽכוּ בָ֭נִים שִׁמְעוּ לִ֑/י יִֽרְאַ֥ת יְ֝הוָ֗ה אֲלַמֶּדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/011.yaml
  text: Come[a], children, listen to me[b]; I will teach you the fear of Yahweh.
translation:
  language: de
  text: Kommt, Kinder[a], hört auf mich! Die Furcht Jahwes[b] will ich euch lehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Söhne“. In weisheitlicher Rede ist damit wahrscheinlich der Kreis der Lernenden allgemein gemeint.'
    reason: lexical_alternative
  - marker: b
    text: „Furcht Jahwes“ ist ein weisheitlicher Ausdruck, der ehrfürchtige Scheu, Gehorsam und angemessene Furcht vor Gott umfasst.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Kommt
  rationale: Obwohl הלך grundsätzlich „gehen“ bedeutet, dient der Imperativ hier idiomatisch als einladender Aufruf zur Unterweisung; „Kommt“ ist im Deutschen natürlich und kontextgerecht.
- source_word: בָנִים
  choice: Kinder
  rationale: Wörtlich „Söhne“; in der weisheitlichen Lehrrede bezeichnet die Anrede wahrscheinlich die Lernenden allgemein. „Kinder“ bewahrt den pädagogischen Ton, ohne den Kreis unnötig auf männliche Personen zu beschränken.
- source_word: שִׁמְעוּ לִי
  choice: hört auf mich
  rationale: Die Verbindung fordert nicht nur akustisches Hören, sondern aufmerksames Beachten und Gehorchen. „Hört auf mich“ gibt diesen Sinn im heutigen Deutsch prägnant wieder.
- source_word: יִרְאַת יְהוָה
  choice: die Furcht Jahwes
  rationale: Die zentrale weisheitliche Wendung wird mit „Furcht“ wiedergegeben, damit Ehrfurcht, Gehorsam und angemessenes Erschrecken vor Gott nicht auf bloße Verehrung verengt werden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt, sodass der im hebräischen Text ausdrücklich gebrauchte Bundesname sichtbar bleibt.
- source_word: אֲלַמֶּדְכֶם
  choice: will ich euch lehren
  rationale: Das Piel-Imperfekt bezeichnet hier im Anschluss an die Aufforderung die Absicht des Sprechers. Die deutsche Formulierung „will ich euch lehren“ verbindet diese Absicht natürlich mit dem vorangehenden Aufruf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Wiedergabe von יִרְאַת יְהוָה
  choice: die Furcht Jahwes
  alternative: die Ehrfurcht vor Jahwe
  rationale: „Furcht“ erhält die theologische Spannung und den weiteren Bedeutungsumfang der hebräischen Weisheitsformel; eine ausschließliche Wiedergabe als „Ehrfurcht“ könnte deren Ernst abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und der lehrhafte Ton des Weisheitsspruchs bleiben erhalten; „hört auf mich“ ist bewusst idiomatisch, während „Furcht“ die Spannung des hebräischen Ausdrucks bewahrt.
