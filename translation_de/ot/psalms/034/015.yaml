  text: עֵינֵ֣י יְ֭הוָה אֶל צַדִּיקִ֑ים וְ֝/אָזְנָ֗י/ו אֶל שַׁוְעָתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/015.yaml
  text: The eyes of Yahweh are toward the righteous[a], and his ears toward their cry for help.
translation:
  language: de
  text: Die Augen Jahwes sind auf die Gerechten gerichtet, und seine Ohren auf ihren Hilferuf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינֵי
  choice: Die Augen
  rationale: Der hebräische Konstruktplural wird konkret wiedergegeben; so bleibt das anthropomorphe Bild von Jahwes aufmerksamer Zuwendung erhalten.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Das Tetragramm wird als der im Deutschen etablierte Name „Jahwe“ wiedergegeben; der Genitiv ist durch die Konstruktion „Die Augen Jahwes“ erforderlich.
- source_word: אֶל
  choice: auf … gerichtet / auf
  rationale: Die Präposition bezeichnet hier Ausrichtung oder Zuwendung. Im ersten Halbvers macht „gerichtet“ dies idiomatisch deutlich; im parallelen zweiten Halbvers kann das gemeinsame Prädikat ergänzt werden.
- source_word: צַדִּיקִים
  choice: die Gerechten
  rationale: Das substantivierte maskuline Pluraladjektiv bezeichnet Menschen, die gerecht sind; „die Gerechten“ ist die natürliche und traditionsfähige deutsche Entsprechung.
- source_word: וְאָזְנָיו
  choice: und seine Ohren
  rationale: Der Plural samt Suffix wird wörtlich bewahrt und steht poetisch parallel zu „die Augen“.
- source_word: שַׁוְעָתָם
  choice: ihren Hilferuf
  rationale: Das Substantiv bezeichnet einen aus Bedrängnis hervorgehenden Ruf um Hilfe. „Hilferuf“ gibt diese Bedeutung knapp und natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Transliteration „Jahwe“ wahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Anthropomorphe Rede von Gottes Wahrnehmung
  choice: Die Bilder „Augen“ und „Ohren“ beibehalten
  alternative: Deutende Wiedergabe wie „Jahwe sieht … und hört …“
  rationale: Die konkrete Bildsprache drückt Gottes Aufmerksamkeit aus und trägt den poetischen Parallelismus; sie wird daher nicht interpretierend aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem poetischem Parallelismus. Die Ellipse im zweiten Halbvers ist im Deutschen verständlich und spiegelt die knappe hebräische Form.
