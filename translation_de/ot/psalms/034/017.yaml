  text: צָעֲק֣וּ וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗/ם הִצִּילָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/017.yaml
  text: They cried out[a], and Yahweh heard, and delivered them from all their troubles.
translation:
  language: de
  text: Sie schrien um Hilfe, und Jahwe[a] hörte; aus all ihren Nöten rettete er sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: צָעֲקוּ
  choice: Sie schrien um Hilfe
  rationale: Das Qal Perfekt von צעק bezeichnet hier einen dringenden Hilferuf. „Schrien um Hilfe“ gibt diese Aussage im Deutschen natürlich und präzise wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, damit der im hebräischen Text stehende Eigenname erhalten bleibt und nicht durch einen Titel ersetzt wird.
- source_word: שָׁמֵעַ
  choice: hörte sie
  rationale: Das Partizip steht innerhalb einer poetischen Folge vergangener Handlungen und wird daher idiomatisch mit „hörte“ wiedergegeben. Das Objekt „sie“ ist im Deutschen sinngemäß ergänzt, ohne das stärkere „erhörte“ vorwegzunehmen.
- source_word: מִכָּל צָרוֹתָם
  choice: aus all ihren Nöten
  rationale: מן bezeichnet die Befreiung aus einer bedrängenden Lage; צָרוֹת meint Bedrängnisse oder Nöte. „Aus all ihren Nöten“ ist prägnant und bewahrt den umfassenden Sinn von כָּל.
- source_word: הִצִּילָם
  choice: rettete er sie
  rationale: Das Hifil von נצל bedeutet, jemanden einer Gefahr oder Bedrängnis zu entreißen. „Rettete“ ist im modernen Deutsch natürlich und vermeidet eine unnötige dogmatische Verengung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. Die Transliteration „Jahwe“ bewahrt diesen Namen; die traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt.
- issue: Bedeutung von שָׁמֵעַ
  choice: hörte sie
  alternative: erhörte sie
  rationale: '„Erhörte“ könnte die im folgenden Satzteil berichtete rettende Antwort bereits in das Verb hineinlesen. „Hörte sie“ hält die Abfolge des hebräischen Textes offen: Jahwe hört und rettet.'
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzführung. Das Semikolon bildet die Folge von Hilferuf, Hören und Rettung klar ab.
