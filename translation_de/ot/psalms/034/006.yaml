  text: זֶ֤ה עָנִ֣י קָ֭רָא וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗י/ו הוֹשִׁיעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/006.yaml
  text: This poor man cried out[a], and Yahweh heard[b], and saved him from all his troubles.
translation:
  language: de
  text: Dieser Arme[a] rief, und Jahwe hörte und rettete ihn[b] aus allen seinen Nöten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dieser Bedrängte“ oder „Dieser Elende“. Das hebräische Wort kann Armut, Bedrängnis oder eine niedrige, demütige Stellung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „befreite ihn“. Gemeint ist Rettung aus Gefahr oder Bedrängnis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עָנִי
  choice: Dieser Elende
  rationale: Das Demonstrativpronomen hebt den Betroffenen als konkretes Beispiel hervor. „Elender“ gibt עָנִי im Zusammenhang von Bedrängnis und Rettung wieder, ohne es auf materielle Armut zu beschränken.
- source_word: קָרָא
  choice: rief
  rationale: Im Zusammenhang bezeichnet das Verb einen dringenden Hilferuf; das schlichte „rief“ bleibt nah am Hebräischen und klingt im Deutschen natürlich.
- source_word: יהוה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שָׁמֵעַ
  choice: hörte
  rationale: Die Verbform berichtet in diesem Zeugnis von Gottes erfolgtem Hören; das Präteritum entspricht der anschließenden Rettung.
- source_word: מִכָּל צָרוֹתָיו
  choice: aus all seinen Nöten
  rationale: צָרוֹת bezeichnet Bedrängnisse oder Notlagen. „Nöte“ ist würdig, verständlich und bewahrt den Plural sowie die umfassende Aussage von מִכָּל.
- source_word: הוֹשִׁיעוֹ
  choice: rettete ihn
  rationale: Die Hifil-Form von ישׁע bezeichnet das Retten oder Befreien aus Gefahr; „rettete“ passt unmittelbar zu den genannten Nöten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt den Charakter als persönlicher Bundesname, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug und Bedeutungsumfang von עָנִי
  choice: Dieser Elende
  alternative: Dieser Arme
  rationale: Die maskuline Einzahl bleibt erhalten und kann zunächst auf den Psalmisten, zugleich aber beispielhaft auf einen bedrängten Menschen weisen. „Elende“ lässt offen, ob Armut, Bedrängnis oder niedrige Stellung im Vordergrund steht.
- issue: Semantische Reichweite von ישׁע
  choice: rettete ihn
  alternative: befreite ihn
  rationale: „Retten“ bewahrt den theologischen Wortklang, bezeichnet hier jedoch zunächst konkret die Befreiung aus den Nöten; der Kontext wird nicht auf eine engere Lehrbedeutung festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. „Dieser Elende“ ist leicht gehoben, aber allgemein verständlich und trägt die Bedeutungsbreite des hebräischen Ausdrucks besser als eine rein wirtschaftliche Bezeichnung.
