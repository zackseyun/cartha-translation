source:
  edition: WLC
  text: תְּמוֹתֵ֣ת רָשָׁ֣ע רָעָ֑ה וְ/שֹׂנְאֵ֖י צַדִּ֣יק יֶאְשָֽׁמוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/021.yaml
  text: Evil will put the wicked to death[a], and those who hate the righteous will be held guilty.
translation:
  language: de
  text: Das Böse wird den Gottlosen töten[a], und die den Gerechten hassen, werden schuldig werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Unheil wird den Gottlosen töten.« Das hebräische Wort רָעָה kann »Böses«, »Unheil«, »Schaden« oder »Unglück« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּמוֹתֵת
  choice: wird … töten
  rationale: Das Hifil Imperfekt 3. Person feminin Singular von מות bezeichnet das Verursachen des Todes; die Form stimmt mit dem nachgestellten femininen Subjekt רָעָה überein. „Wird … töten“ gibt die kausative Aussage natürlich und knapp wieder.
- source_word: רָשָׁע
  choice: den Gottlosen
  rationale: Das substantivierte Adjektiv steht im Singular und bezeichnet einen repräsentativen Angehörigen der moralischen Kategorie. „Den Gottlosen“ entspricht dem bestimmten Akkusativ und ist in gehobenem modernem Deutsch geläufig.
- source_word: רָעָה
  choice: das Böse
  rationale: Das Wort kann moralisches Böses, Unheil oder Verderben bezeichnen. „Das Böse“ bewahrt die Prägnanz, die Personifikation und den möglichen Doppelsinn des Hebräischen; die kontextuell plausible Bedeutung „Unheil“ wird in der Fußnote genannt.
- source_word: שֹׂנְאֵי
  choice: wer … hasst
  rationale: Das qalische Partizip Plural im Status constructus beschreibt diejenigen, die den Gerechten hassen. Die generische deutsche Relativkonstruktion „wer … hasst“ klingt natürlich; der anschließende Singular „wird“ fasst die bezeichnete Gruppe distributiv auf.
- source_word: צַדִּיק
  choice: den Gerechten
  rationale: Das substantivierte Adjektiv im Singular bleibt als repräsentative Bezeichnung erhalten. „Den Gerechten“ vermeidet eine unnötige Individualisierung und entspricht dem deutschen biblisch-gehobenen Sprachgebrauch.
- source_word: יֶאְשָׁמוּ
  choice: wird schuldig werden
  rationale: Das Qal Imperfekt von אשם bezeichnet das Schuldigwerden beziehungsweise das Verfallen in Schuld und Haftung. „Wird schuldig werden“ wahrt die direkte Aussage, ohne die mögliche Folge bereits ausdrücklich als Verurteilung auszulegen.
theological_decisions:
- issue: Ob רָעָה moralisch als „das Böse“ oder ereignishaft als „Unheil“ zu verstehen ist
  choice: das Böse
  alternative: Unheil wird den Gottlosen töten
  rationale: „Das Böse“ erhält die moralische Ironie und die semantische Spannung des hebräischen Ausdrucks, der zugleich Unheil oder Verderben meinen kann. Die plausible ereignishafte Lesart wird deshalb in einer Fußnote bewahrt.
- issue: Ob יֶאְשָׁמוּ als Schuldzustand oder als ausdrückliche Verurteilung wiederzugeben ist
  choice: wird schuldig werden
  alternative: wird verurteilt werden / wird seine Schuld tragen
  rationale: Der hebräische Ausdruck kann Schuld und daraus folgende Haftung bezeichnen, nennt aber nicht ausdrücklich einen menschlichen oder göttlichen Gerichtsspruch. Die Übersetzung belässt diese forensische Folgerung unausgesprochen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. „Gottloser“ und „Gerechter“ sind als etablierte moralische Kategorien verständlich; die distributive Konstruktion „wer … hasst“ vermeidet das schwerfällige „diejenigen, die …“.
