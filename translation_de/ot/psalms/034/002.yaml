  text: בַּ֭/יהוָה תִּתְהַלֵּ֣ל נַפְשִׁ֑/י יִשְׁמְע֖וּ עֲנָוִ֣ים וְ/יִשְׂמָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/002.yaml
  text: In Yahweh my soul will boast[b][a]; the humble will hear and rejoice.
translation:
  language: de
  text: In Jahwe rühmt sich meine Seele; die Demütigen[a] werden es hören und sich freuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gebeugten“, „die Bedrängten“ oder „die Sanftmütigen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  choice: In Jahwe
  rationale: Die Präposition ב bezeichnet hier den Grund oder Bezugsbereich des Rühmens. „In Jahwe“ bewahrt diese Aussage und gibt den Gottesnamen als Eigennamen wieder.
- source_word: תִּתְהַלֵּל
  choice: rühmt sich
  rationale: Der Hitpael von הלל bedeutet hier „sich rühmen“. Das Imperfekt kann eine gegenwärtig-anhaltende beziehungsweise charakteristische Handlung ausdrücken; im Deutschen klingt das Präsens in der poetischen Aussage natürlich.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Die wörtliche poetische Wendung bleibt erhalten; נפש bezeichnet hier die eigene Person in ihrer ganzen Lebendigkeit, ohne auf ein bloßes „ich“ eingeebnet zu werden.
- source_word: יִשְׁמְעוּ
  choice: werden es hören
  rationale: Das Qal-Imperfekt wird zukunftsbezogen wiedergegeben. Das ergänzte „es“ macht im Deutschen deutlich, dass die Demütigen das Rühmen hören, ohne den Sinn zu verändern.
- source_word: עֲנָוִים
  choice: die Demütigen
  rationale: Das Wort kann demütige, sanftmütige oder bedrängte Menschen bezeichnen. „Die Demütigen“ gibt die naheliegende geistlich-soziale Nuance wieder; die echte Bedeutungsbreite wird in einer Fußnote bewahrt.
- source_word: וְיִשְׂמָחוּ
  choice: und sich freuen
  rationale: שמח bezeichnet Freude beziehungsweise Frohsein. Die reflexive deutsche Wendung ist natürlich und bewahrt die Folge von Hören und Freude.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdevolle Psalmensprache. Der Parallelismus bleibt klar; „meine Seele“ bewahrt das poetische Menschenbild des Hebräischen, während „werden es hören“ im Deutschen einen natürlichen Satzfluss schafft.
