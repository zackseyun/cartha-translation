source:
  edition: WLC
  text: ס֣וּר מֵ֭/רָע וַ/עֲשֵׂה ט֑וֹב בַּקֵּ֖שׁ שָׁל֣וֹם וְ/רָדְפֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/014.yaml
  text: Turn away from evil and do good[a]; seek peace and pursue it.
translation:
  language: de
  text: Wende dich vom Bösen ab und tu Gutes; suche Frieden[a] und jage ihm nach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort schalom kann neben „Frieden“ auch „Unversehrtheit“ oder „Wohlergehen“ bedeuten und meint mehr als nur die Abwesenheit von Konflikten.
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּר
  choice: Wende dich … ab
  rationale: Der Imperativ bezeichnet ein aktives Sichabwenden oder Entfernen. Die reflexive Formulierung ist im modernen Deutschen natürlich und bewahrt die ethische Neuausrichtung.
- source_word: מֵרָע
  choice: vom Bösen
  rationale: רַע bezeichnet in diesem weisheitlichen Mahnruf vor allem das moralisch Böse; מִן drückt die Trennung davon aus.
- source_word: וַעֲשֵׂה טוֹב
  choice: und tu Gutes
  rationale: Die knappe Imperativform erhält den Gegensatz zwischen dem Bösen und dem Guten. „Tu“ ist die standardsprachliche Imperativform von „tun“.
- source_word: בַּקֵּשׁ
  choice: suche
  rationale: Der Piel-Imperativ fordert zu ernsthaftem, zielgerichtetem Suchen auf. „Suche“ ist prägnant und idiomatisch.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: שָׁלוֹם umfasst Frieden, Unversehrtheit und Wohlergehen. „Frieden“ ist hier die natürliche Hauptwiedergabe; die größere Bedeutungsbreite wird in der Fußnote genannt.
- source_word: וְרָדְפֵהוּ
  choice: und jage ihm nach
  rationale: רדף beschreibt ein energisches Verfolgen. Das maskuline Suffix bezieht sich auf שָׁלוֹם; „jage ihm nach“ bewahrt das anschauliche und nachdrückliche Bild des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vier Imperative und der prägnante Parallelismus des Hebräischen bleiben erhalten; „jage ihm nach“ gibt die Intensität des letzten Verbs anschaulich wieder.
