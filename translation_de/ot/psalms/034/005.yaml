base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/005.yaml
  text: They looked to him and were radiant[b][a], and their faces were not put to shame.
translation:
  language: de
  text: Sie blickten zu ihm[a] und strahlten[b], und ihre Gesichter werden nicht vor Scham erröten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Konsonantentext hat „zu mir“, die überlieferte Lesung „zu ihm“. Der Haupttext folgt im Zusammenhang der Lesung „zu ihm“; „zu mir“ ist als alternative Lesart überliefert.
    reason: textual_variant
  - marker: b
    text: 'Oder: „leuchteten“. Das hebräische Verb kann in diesem Zusammenhang Helligkeit oder strahlendes Leuchten ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: blickten
  rationale: Die Hifil-Form von נבט bezeichnet das Hinblicken auf jemanden oder etwas. „Blickten“ gibt die vollendete Verbform knapp und poetisch wieder, ohne eine besondere Dauer oder Intensität hinzuzufügen.
- source_word: אֵלָי/ו
  choice: zu ihm
  rationale: Die masoretische Überlieferung bewahrt hier eine Spannung zwischen der konsonantischen Form „zu mir“ und der Lesetradition „zu ihm“. Im Zusammenhang ist „zu ihm“ die flüssigere Bezugnahme auf den HERRN; die andere Lesart bleibt in einer Fußnote erhalten.
- source_word: וְנָהָרוּ
  choice: strahlten
  rationale: Das Verb kann je nach Zusammenhang auch ein Strömen bezeichnen. Hier legt die Verbindung mit den Gesichtern und der Scham ein Leuchten oder Strahlen nahe; „strahlten“ ist im Deutschen natürlich und bewahrt das poetische Bild.
- source_word: וּפְנֵיהֶם
  choice: ihre Gesichter
  rationale: Die konkrete Bildsprache des hebräischen Plurals wird beibehalten und nicht zu einer abstrakten Aussage über die Personen verallgemeinert.
- source_word: אַל יֶחְפָּרוּ
  choice: wurden nicht beschämt
  rationale: חפר bezeichnet hier Scham oder Beschämung. Die Wiedergabe folgt dem erzählenden Parallelismus der beiden vorangehenden vollendeten Verbformen und bewahrt zugleich die konkrete Aussage über ihre Gesichter.
theological_decisions:
- issue: Überlieferungsvariante אֵלָי/ו
  choice: zu ihm
  alternative: zu mir
  rationale: Die masoretische Lesetradition und der unmittelbare Zusammenhang stützen „zu ihm“, während die konsonantische Überlieferung „zu mir“ nahelegt. Da der Wechsel die Sprecherperspektive betrifft, wird die echte textliche Spannung ausdrücklich in einer Fußnote bewahrt.
- issue: Zeitwert und Aussagekraft von אַל יֶחְפָּרוּ
  choice: wurden nicht beschämt
  alternative: sollen nicht beschämt werden
  rationale: אַל mit der Imperfektform kann eine verneinte Aufforderung oder einen Wunsch ausdrücken. Im poetischen Parallelismus kann die Wendung jedoch als verneintes Ergebnis der vorausgehenden Handlung verstanden werden; der Haupttext folgt dieser kontextuellen Deutung, ohne daraus eine zeitlose Heilszusage zu machen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knapper poetischer Satzstruktur. Das konkrete Bild der Gesichter bleibt erhalten; altertümliche Wendungen wie „zuschanden werden“ werden vermieden.
