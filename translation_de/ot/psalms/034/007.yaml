source:
  edition: WLC
  text: חֹנֶ֤ה מַלְאַךְ יְהוָ֓ה סָ֘בִ֤יב לִֽ/ירֵאָ֗י/ו וַֽ/יְחַלְּצֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/007.yaml
  text: The angel of Yahweh encamps around those who fear him[a], and rescues them.
translation:
  language: de
  text: Der Engel Jahwes[a] lagert sich rings um die, die ihn fürchten, und rettet sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Jahwes«. Das hebräische Wort מַלְאָךְ kann sowohl »Bote« als auch »Engel« bedeuten; hier ist »Engel« wahrscheinlicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹנֶה
  choice: lagert sich
  rationale: Das Qal-Partizip von חנה bezeichnet das Lagern. Die Formulierung bewahrt das anschauliche Schutzmotiv eines ringsum aufgeschlagenen Lagers.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאָךְ kann »Bote« oder »Engel« bedeuten; in dieser Verbindung liegt die übernatürliche Bedeutung nahe. Die mögliche lexikalische Alternative wird in der Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, damit der im Hebräischen stehende Eigenname erhalten bleibt.
- source_word: סָבִיב
  choice: rings um
  rationale: Die Wendung gibt die umschließende räumliche Lage natürlich wieder und unterstreicht den Schutzgedanken, ohne ihn ausdrücklich hinzuzufügen.
- source_word: לִירֵאָיו
  choice: die, die ihn fürchten
  rationale: Die Form bezeichnet Menschen, die von der Furcht Jahwes geprägt sind. »Fürchten« bewahrt neben ehrfürchtiger Verehrung auch die Stärke des hebräischen Ausdrucks.
- source_word: וַיְחַלְּצֵם
  choice: und rettet sie
  rationale: חלץ bedeutet hier herausziehen, befreien oder retten. »Rettet« ist klares modernes Deutsch und passt zum Schutzbild des Verses.
theological_decisions:
- issue: Ob מַלְאַךְ יְהוָה neutral als »Bote Jahwes« oder traditionell als »Engel Jahwes« wiederzugeben und näher als Theophanie oder Christophanie zu bestimmen ist.
  choice: »Der Engel Jahwes«, ohne seine Identität näher festzulegen.
  alternative: »Der Bote Jahwes«; ferner eine ausdrückliche Deutung als theophanische oder christophanische Gestalt.
  rationale: Der Kontext legt die übernatürliche Bedeutung »Engel« nahe, während der Text selbst keine weitergehende Identifikation vornimmt. Diese theologische Spannung bleibt daher offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Lagert sich rings um« erhält das konkrete Schutz- und Lagerbild; »Jahwe« gibt den Gottesnamen als Eigennamen wieder. Der Fußnotenmarker steht unmittelbar nach der Wendung, auf die sich die Alternative bezieht.
