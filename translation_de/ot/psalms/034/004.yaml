source:
  edition: WLC
  text: דָּרַ֣שְׁתִּי אֶת יְהוָ֣ה וְ/עָנָ֑/נִי וּ/מִ/כָּל מְ֝גוּרוֹתַ֗/י הִצִּילָֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/004.yaml
  text: I sought Yahweh[a], and he answered me; he delivered me from all my fears.
translation:
  language: de
  text: Ich suchte Jahwe, und er antwortete mir; er rettete mich aus all meinen Ängsten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: vor allem, wovor mir graute; oder: aus all meinen Schrecken.'
    reason: 'Lexikalische Alternative: מְגוּרוֹתַי kann die Ängste selbst, ihre furchterregenden Anlässe oder besonders starke Schrecken bezeichnen.'
lexical_decisions:
- source_word: דָּרַשְׁתִּי
  choice: Ich suchte
  rationale: דרשׁ bezeichnet hier das suchende Sich-an-Jahwe-Wenden, besonders im Gebet und Vertrauen. „Ich suchte“ bewahrt das Bild des hebräischen Verbs und passt zum persönlichen Zeugnis des Psalms.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: וְעָנָנִי
  choice: und er antwortete mir
  rationale: ענה mit dem Suffix der ersten Person Singular bedeutet unmittelbar „er antwortete mir“; das Subjekt verweist auf Jahwe.
- source_word: מִכָּל
  choice: aus all
  rationale: מן mit כל drückt eine umfassende Befreiung aus der Gesamtheit der genannten Bedrängnisse aus.
- source_word: מְגוּרוֹתַי
  choice: meinen Ängsten
  rationale: Das Substantiv bezeichnet hier Ängste, Schrecken oder das, wovor der Sprecher sich fürchtet. „Ängste“ ist im Deutschen natürlich und lässt sowohl innere Furcht als auch ihre Anlässe anklingen.
- source_word: הִצִּילָנִי
  choice: er rettete mich
  rationale: Die Hifil-Form von נצל bezeichnet das Herausreißen oder Retten aus Gefahr. „Rettete“ gibt den kräftigen, aber nicht unnötig eingeengten Sinn wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehovah
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Art der Rettung aus מְגוּרוֹתַי
  choice: Rettung aus allen Ängsten
  alternative: Rettung vor allem, wovor dem Sprecher graute; Rettung aus allen Schrecken
  rationale: Der Vers legt nicht eindeutig fest, ob vor allem das innere Erleben der Angst oder deren furchterregende Anlässe gemeint sind. Der Haupttext lässt diese Spannung möglichst offen; die Fußnote nennt die engeren Möglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Das Semikolon wahrt die Zweiteilung zwischen Gebetserhörung und Rettung; der Gottesname erscheint in der geläufigen deutschen Form „Jahwe“.
