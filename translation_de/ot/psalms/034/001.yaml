  revision_rationale: 'Die Übersetzung wird nur in zwei Punkten korrigiert: Das modale „soll“ wird durch das aussagende Futur „wird“ ersetzt, und der Fußnotenanker wird an den erläuterten Gottesnamen gesetzt. Bedeutung, poetische Wiederholung und Register bleiben erhalten.'
