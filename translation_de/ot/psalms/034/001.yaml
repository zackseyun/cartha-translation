source:
  edition: WLC
  text: אֲבָרֲכָ֣ה אֶת יְהוָ֣ה בְּ/כָל עֵ֑ת תָּ֝מִ֗יד תְּֽהִלָּת֥/וֹ בְּ/פִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/001.yaml
  text: I will bless Yahweh at all times[a]; his praise will continually be in my mouth.
translation:
  language: de
  text: Ich will Jahwe[a] allezeit preisen; sein Lob wird immer in meinem Mund sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH (יהוה); die ursprüngliche Aussprache ist nicht sicher überliefert. Traditionell wird der Name auch mit „der HERR“ wiedergegeben.'
    reason: Der Konsonantentext nennt den Gottesnamen; die Fußnote macht sowohl die Ausspracheunsicherheit als auch die verbreitete traditionelle Wiedergabe kenntlich.
lexical_decisions:
- source_word: אֲבָרֲכָה
  choice: Ich will … preisen
  rationale: Die Präformativform mit paragogischem He drückt hier einen entschlossenen, willentlichen Vorsatz aus. Beim Lob Gottes gibt „preisen“ die kontextuelle Bedeutung von ברך im heutigen Deutsch natürlicher wieder als das missverständliche „segnen“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: בְּכָל־עֵת
  choice: allezeit
  rationale: Die Verbindung bezeichnet uneingeschränkte zeitliche Beständigkeit. „Allezeit“ ist knapp, würdig und im Deutschen gut verständlich.
- source_word: תָּמִיד
  choice: immer
  rationale: Das Adverb betont die fortdauernde Gegenwart des Lobes. „Immer“ klingt natürlich und bewahrt die Verstärkung gegenüber „allezeit“.
- source_word: תְּהִלָּתוֹ
  choice: sein Lob
  rationale: תְּהִלָּה bezeichnet Lob beziehungsweise Lobpreis; das Suffix der dritten Person Singular wird direkt mit „sein“ wiedergegeben.
- source_word: בְּפִי
  choice: in meinem Mund
  rationale: Die konkrete hebräische Redeweise wird beibehalten und bezeichnet ausgesprochenes Lob.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen; die Unsicherheit über die ursprüngliche Aussprache wird in der Fußnote offengelegt.
- issue: Bedeutung von ברך in Bezug auf Gott
  choice: preisen
  alternative: segnen
  rationale: „Segnen“ wäre formal näher an einer häufigen Grundbedeutung, kann im modernen Deutsch bei Gott als Objekt jedoch missverständlich wirken. In diesem Lobkontext bezeichnet das Verb das rühmende Preisen Gottes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst poetischer Knappheit. „Allezeit“ erhält den Psalmton, während „immer“ die parallele Aussage natürlich fortführt. Das modale „soll“ bildet den entschlossenen Vorsatz der ersten Zeile ab, ohne bloß eine Zustandsbeschreibung zu geben.
