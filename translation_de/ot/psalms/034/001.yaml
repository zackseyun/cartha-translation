review_pass:
  verdict: revise
  source_fidelity: „Ich will … preisen“ gibt die voluntative 1. Person von אֲבָרֲכָה im Lobkontext treffend wieder. „Jahwe“, „allezeit“, „sein Lob“ und „in meinem Mund“ entsprechen dem hebräischen Text. Die zweite Zeile ist jedoch als Aussage über das fortwährende Vorhandensein des Lobes formuliert; „soll“ kann im Deutschen normativ wirken und ist daher weniger genau als ein Futur.
  naturalness: Der Vers ist insgesamt natürliches, würdiges modernes Standarddeutsch. „Wird immer in meinem Mund sein“ bewahrt die zukunfts-/vorsatzartige Parallelität zur ersten Zeile, ohne den unerwünschten Beiklang einer Verpflichtung von „soll“.
  terminology: „Jahwe“ ist eine etablierte deutsche Umschrift des Tetragramms. „Preisen“ ist in diesem Kontext die angemessene deutsche Wiedergabe von ברך, wenn Gott Objekt des Verbs ist. Die Fußnote ist sachlich, muss aber beim Gottesnamen statt bei „allezeit“ verankert werden.
  issues:
  - severity: medium
    issue: „soll immer in meinem Mund sein“ ist modal missverständlich.
    rationale: Die hebräische Nominalkonstruktion mit תָּמִיד beschreibt, dass sein Lob fortwährend im Mund des Sprechers ist. Das deutsche „soll“ kann eine Forderung oder Pflicht ausdrücken. „wird … sein“ gibt die entschlossene, zukunftsgerichtete Aussage klarer wieder.
  - severity: low
    issue: Der Fußnotenanker steht bei „allezeit“, obwohl die Fußnote den Gottesnamen erläutert.
    rationale: Der Anker soll unmittelbar an „Jahwe“ stehen, damit Bezug und Leseführung eindeutig sind.
  revised_text: Ich will Jahwe[a] allezeit preisen; sein Lob wird immer in meinem Mund sein.
