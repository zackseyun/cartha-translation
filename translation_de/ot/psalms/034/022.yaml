  text: פּוֹדֶ֣ה יְ֭הוָה נֶ֣פֶשׁ עֲבָדָ֑י/ו וְ/לֹ֥א יֶ֝אְשְׁמ֗וּ כָּֽל הַ/חֹסִ֥ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/022.yaml
  text: Yahweh redeems the life of his servants[b][a], and none of those who take refuge in him will be held guilty.
translation:
  language: de
  text: Jahwe erlöst das Leben seiner Diener[a], und keiner von denen, die bei ihm Zuflucht suchen, wird schuldig gesprochen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Seele seiner Diener“. Das hebräische Wort bezeichnet hier das Leben beziehungsweise das lebendige Selbst.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „wird verurteilt“ oder „wird Schuld auf sich laden“. Das hebräische Verb gehört zur Sprache von Schuld und Strafwürdigkeit.'
    reason: alternative_reading
lexical_decisions:
- source_word: פּוֹדֶה
  choice: erlöst
  rationale: Das Partizip von פדה bezeichnet Loskauf beziehungsweise rettende Befreiung. „Erlöst“ bewahrt sowohl den Rettungsaspekt als auch die weitergehende Erlösungsbedeutung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: נֶפֶשׁ
  choice: Leben
  rationale: נֶפֶשׁ bezeichnet hier am ehesten das Leben beziehungsweise das ganze lebendige Selbst. „Leben“ vermeidet die mögliche Verengung von „Seele“ auf einen immateriellen Teil des Menschen.
- source_word: עֲבָדָיו
  choice: seiner Diener
  rationale: עבד kann Knecht, Diener oder Sklave bezeichnen; im poetischen Zusammenhang ist „Diener“ natürlich und gibt die Zugehörigkeit zu Jahwe angemessen wieder.
- source_word: יֶאְשְׁמוּ
  choice: wird schuldig gesprochen
  rationale: Das Verb אשם trägt Schuld- und Haftungssprache. „Schuldig gesprochen“ bewahrt den forensischen Klang, ohne ausdrücklich eine bestimmte eschatologische Verurteilung festzulegen.
- source_word: הַחֹסִים בּוֹ
  choice: die bei ihm Zuflucht suchen
  rationale: חסה bezeichnet das Suchen von Schutz oder Zuflucht. Die Formulierung erhält das konkrete Zufluchtsbild des Psalms besser als das allgemeinere „ihm vertrauen“.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im Zusammenhang der Rettung
  choice: „Leben“ als Bezeichnung für das lebendige Selbst
  alternative: „Seele“ mit möglicher Betonung des inneren Menschen
  rationale: Der hebräische Ausdruck verlangt hier keine Trennung von Leib und immaterieller Seele. „Leben“ lässt die ganzheitliche Bedeutung bestehen.
- issue: Aussagekraft von יֶאְשְׁמוּ
  choice: 'forensisch: „wird schuldig gesprochen“'
  alternative: „wird verurteilt“, „wird Schuld auf sich laden“ oder „muss büßen“
  rationale: אשם kann Schuld, Strafwürdigkeit oder das Tragen von Schuld ausdrücken. Die gewählte Fassung erhält die gerichtliche Dimension, ohne die Aussage unnötig auf das Endgericht oder auf bloße leidvolle Folgen festzulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der poetische Parallelismus bleibt klar; „Jahwe“ bewahrt den persönlichen Gottesnamen, und die Fußnoten machen echte lexikalische Spielräume sichtbar.
