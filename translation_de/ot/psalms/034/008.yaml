id: PSA.34.8
reference: Psalms 34:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: טַעֲמ֣וּ וּ֭/רְאוּ כִּי ט֣וֹב יְהוָ֑ה אַֽשְׁרֵ֥י הַ֝/גֶּ֗בֶר יֶחֱסֶה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/008.yaml
  text: Taste and see that Yahweh is good[a]; blessed is the man who takes refuge in him.
translation:
  language: de
  text: Schmeckt und seht, dass Jahwe gut ist! Glücklich ist der Mann[a], der bei ihm Zuflucht sucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „der Mann“; die männliche Einzahl steht hier repräsentativ für jeden Menschen, der bei Jahwe Zuflucht sucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַעֲמוּ
  choice: Schmeckt
  rationale: Der Imperativ Plural bedeutet wörtlich „schmeckt“. Das konkrete Sinnesbild bleibt erhalten und kann zugleich die Erfahrung von Jahwes Güte ausdrücken.
- source_word: וּרְאוּ
  choice: und seht
  rationale: Der Imperativ Plural bewahrt zusammen mit „schmeckt“ die prägnante Verbindung zweier Sinneswahrnehmungen.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier am natürlichsten den Inhalt dessen ein, was die Angesprochenen schmecken und sehen sollen.
- source_word: טוֹב
  choice: gut
  rationale: „Gut“ bewahrt die breite Aussage über Jahwes Wesen und wohltätiges Handeln, ohne sie auf „angenehm“ oder „gütig“ einzuengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die Seligpreisungsformel bezeichnet einen beneidenswert guten Zustand. „Glücklich ist“ klingt im modernen Deutsch natürlich und wahrt den Ausrufcharakter.
- source_word: הַגֶּבֶר
  choice: der Mann
  rationale: Das hebräische Substantiv ist maskulin Singular und bezeichnet wörtlich einen Mann; hier steht es repräsentativ für jeden Menschen, der Zuflucht sucht.
- source_word: יֶחֱסֶה
  choice: Zuflucht sucht
  rationale: Die Wendung erhält das Schutz- und Bergungsbild des Verbs חסה genauer als eine bloße Wiedergabe mit „vertraut“.
- source_word: בּוֹ
  choice: bei ihm
  rationale: Das Pronomen verweist auf Jahwe zurück. Bei jemandem Zuflucht zu suchen ist idiomatisches Deutsch und bewahrt den personalen Bezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Seine Wiedergabe als „Jahwe“ erhält den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Repräsentatives Maskulinum in הַגֶּבֶר
  choice: der Mann, mit erläuternder Fußnote
  alternative: der Mensch / wer
  rationale: „Der Mann“ bildet die maskuline Singularform formal ab; die Fußnote macht kenntlich, dass die Aussage in diesem Zusammenhang für jeden gilt, der bei Jahwe Zuflucht sucht.
- issue: Bedeutungsumfang von אַשְׁרֵי
  choice: Glücklich ist
  alternative: Gesegnet ist / Wohl dem
  rationale: Die Formel beschreibt den beneidenswerten Zustand des Betreffenden, ohne ausdrücklich einen Segensakt zu benennen. „Glücklich ist“ ist gegenwärtig und verständlich; „Wohl dem“ wäre stärker altertümlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sinnliche Bildsprache „schmeckt und seht“ sowie das Zufluchtsmotiv bleiben konkret erhalten. Der Ausruf nach dem ersten Satzteil gibt dem poetischen Aufruf angemessenen Nachdruck.
