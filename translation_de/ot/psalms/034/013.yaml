base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/013.yaml
  text: Guard your tongue from evil[a], and your lips from speaking deceit.
translation:
  language: de
  text: Bewahre deine Zunge vor Bösem[a] und deine Lippen vor betrügerischer Rede.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hüte deine Zunge vor Bösem und deine Lippen vor trügerischer Rede.«'
    reason: »Hüten« ist eine mögliche Wiedergabe von נצר; »trügerisch« gibt מִרְמָה im Zusammenhang des Redens idiomatisch wieder.
lexical_decisions:
- source_word: נְצֹר
  choice: Bewahre
  rationale: Der Imperativ von נצר bedeutet bewahren, hüten oder achtsam zurückhalten. »Bewahre« ist natürlich, würdevoll und erhält das Bild einer bewusst beaufsichtigten Zunge.
- source_word: לְשׁוֹנְךָ
  choice: deine Zunge
  rationale: Die konkrete Körpermetapher für das Reden ist auch im Deutschen unmittelbar verständlich und bleibt deshalb erhalten.
- source_word: מֵרָע
  choice: vor Bösem
  rationale: רַע bezeichnet hier im Zusammenhang ethischen Redens das moralisch Böse beziehungsweise schlechte Rede; »vor Bösem« bewahrt diese moralische Weite.
- source_word: וּשְׂפָתֶיךָ
  choice: und deine Lippen
  rationale: Die wörtliche Wiedergabe erhält den poetischen Parallelismus zu »deine Zunge«.
- source_word: מִדַּבֵּר
  choice: davor, … zu reden
  rationale: Die Präposition מן mit dem Infinitiv bezeichnet das Fernhalten von einer Handlung. Im Deutschen verbindet »davor« die Aufforderung idiomatisch mit »deine Lippen«.
- source_word: מִרְמָה
  choice: Täuschung
  rationale: מִרְמָה kann Täuschung, Trug oder Hinterlist bezeichnen. »Täuschung« ist modern und klar, ohne das Wort auf eine einzelne Form betrügerischer Rede zu verengen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die parallelen Körperbilder »Zunge« und »Lippen« bleiben erhalten; die knappe ethische Aufforderung wird nicht konfessionell zugespitzt.
