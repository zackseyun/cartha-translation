  naturalness: »Bewahre deine Zunge vor Bösem« ist in einem würdig-poetischen Register möglich. »und deine Lippen vor betrügerischer Rede« ist deutlich natürlicher als »davor, Täuschung zu reden« und wahrt die Aussage ohne Zusatz.
  terminology: »Bösem« gibt רָע in seiner offenen moralischen Bedeutung angemessen wieder. »Betrügerischer Rede« gibt מִרְמָה im Kontext des Sprechens idiomatisch und präzise wieder; es legt keine spezifische Form des Betrugs fest.
