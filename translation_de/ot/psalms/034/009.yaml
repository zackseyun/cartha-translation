source:
  edition: WLC
  text: יְר֣אוּ אֶת יְהוָ֣ה קְדֹשָׁ֑י/ו כִּי אֵ֥ין מַ֝חְס֗וֹר לִ/ירֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/009.yaml
  text: Fear Yahweh[a], his holy ones[b], for those who fear him lack nothing.
translation:
  language: de
  text: Fürchtet Yahweh, ihr seine Heiligen[a]; denn wer ihn fürchtet, dem fehlt nichts[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seine Heiligen“; auch: „seine Geweihten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bei denen, die ihn fürchten, gibt es keinen Mangel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְר֣אוּ
  choice: Fürchtet
  rationale: Der Imperativ Plural von ירא wird direkt wiedergegeben. „Fürchtet“ bewahrt sowohl die ehrfürchtige als auch die ernste Dimension des hebräischen Ausdrucks.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Der Gottesname יהוה wird als „Yahweh“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: קְדֹשָׁיו
  choice: ihr, die ihr zu ihm gehört
  rationale: Das substantivierte Adjektiv mit Suffix bezeichnet seine Heiligen beziehungsweise die ihm Geweihten. Die Formulierung ist im modernen Deutsch verständlich, während eine Fußnote die wörtlichere Wiedergabe nennt.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet die vorausgehende Aufforderung.
- source_word: אֵין מַחְסוֹר
  choice: dem fehlt nichts
  rationale: Diese idiomatische deutsche Wendung gibt das Nichtvorhandensein eines Mangels natürlich und prägnant wieder.
- source_word: לִירֵאָיו
  choice: wer ihn fürchtet
  rationale: Die substantivische Partizipialform wird als natürlicher deutscher Relativsatz wiedergegeben. Die Wiederholung von „fürchten“ erhält die lexikalische Verbindung zum Imperativ.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der im hebräischen Text ausdrücklich stehende Eigenname wird beibehalten, statt durch einen Titel ersetzt zu werden.
- issue: Bedeutungsumfang von ירא
  choice: fürchten
  alternative: Ehrfurcht haben vor
  rationale: „Fürchten“ bewahrt die Spannung zwischen Scheu, Ehrfurcht und ernstem Gottesbezug; eine bloße Auflösung in „verehren“ würde diesen Bedeutungsumfang verengen.
- issue: Identität der קְדֹשָׁיו
  choice: die ihr zu ihm gehört
  alternative: seine Heiligen / seine heiligen Menschen
  rationale: Der Ausdruck bezeichnet hier die zu Gott gehörenden, ihm geweihten Menschen. Die Übersetzung vermeidet eine mögliche konfessionelle Engführung des Wortes „Heilige“, während die Fußnote die Form des Originals offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Plural und die Wiederholung von „fürchten“ bleiben erhalten; die Wendung für קְדֹשָׁיו wird zugunsten unmittelbarer Verständlichkeit leicht entfaltet.
