    text: Diese Zeile wird in Johannes 19,36 im Zusammenhang mit der Kreuzigung Jesu angeführt.
    reason: cross_reference
lexical_decisions:
- source_word: שֹׁמֵר
  choice: bewahrt
  rationale: Das Partizip von שׁמר bezeichnet schützendes Hüten oder Bewahren. „Bewahrt“ ist im Deutschen natürlich und gibt den Gedanken schützender Erhaltung wieder.
- source_word: כָּל עַצְמוֹתָיו
  choice: alle seine Gebeine
  rationale: כָּל bezeichnet die Gesamtheit; עַצְמוֹתָיו bedeutet mit dem Suffix der 3. Person Singular „seine Knochen/Gebeine“. „Gebeine“ wahrt den würdevoll-poetischen Ton des Psalms.
- source_word: אַחַת מֵהֵנָּה
  choice: nicht eines von ihnen
  rationale: אַחַת („eine“) bezieht sich auf ein einzelnes Glied der zuvor genannten Gesamtheit; מן mit Pronomen ist partitiv. Wegen des deutschen Neutrums „Gebeine“ lautet der idiomatische Bezug „eines von ihnen“.
- source_word: לֹא נִשְׁבָּרָה
  choice: wird nicht zerbrochen
  rationale: Das Nifal-Perfekt von שׁבר bezeichnet das Zerbrochenwerden. Im poetisch-gnomischen Zusammenhang gibt das deutsche Präsens mit passivischer Vorgangsform den Schutzgedanken natürlich wieder.
theological_decisions:
- issue: Bezug der singularischen Pronominalsuffixe
  choice: „Er/seine“ bezieht sich im unmittelbaren Psalmkontext auf den leidenden Gerechten.
  alternative: Die Aussage ausdrücklich christologisch auf Jesus beziehen oder allgemeiner „die Gebeine des Gerechten“ formulieren.
  rationale: Der hebräische Text hat Suffixe der 3. Person Singular; der unmittelbare Zusammenhang spricht vom Gerechten, den der HERR rettet. Die neutestamentliche Verwendung wird nicht in den Haupttext eingetragen, sondern in einer Fußnote ausgewiesen.
- issue: Zeitwert von לֹא נִשְׁבָּרָה
  choice: „wird … zerbrochen“ als gegenwartsbezogene, allgemeingültige Aussage
  alternative: „ist … zerbrochen worden“ oder „wurde … zerbrochen“
  rationale: Das hebräische Perfekt lässt im poetischen Kontext unterschiedliche aspektuelle beziehungsweise zeitliche Wiedergaben zu. Die gewählte Form passt zur Aussage über Gottes fortdauernden Schutz, ohne die grammatische Spannung dogmatisch festzulegen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, poetischem Register. „Gebeine“ ist etwas gehobener als „Knochen“, aber in einem Psalm verständlich und klanglich angemessen. Die Fußnotenmarker stehen jeweils unmittelbar bei der einschlägigen Aussage.
