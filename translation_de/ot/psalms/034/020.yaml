base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/020.yaml
  text: He keeps all his bones[b][a]; not one of them is broken.
translation:
  language: de
  text: Er bewahrt alle seine Knochen[a]; keiner von ihnen wird zerbrochen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „behütet“ oder „schützt“ alle seine Knochen.'
