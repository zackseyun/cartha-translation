  source_fidelity: 'Die Übersetzung gibt die hebräische Gegenüberstellung genau wieder: כְּפִירִים sind junge bzw. kräftige Löwen; רָשׁוּ und רָעֵבוּ werden sinnvoll abgestuft als „leiden Not und hungern“ wiedergegeben. Die partizipiale Gruppe וְדֹרְשֵׁי יְהוָה ist angemessen als „denen, die Jahwe suchen“ gefasst. „fehlt nichts Gutes“ gibt die umfassende Verneinung לֹא יַחְסְרוּ כָל־טוֹב idiomatisch wieder, ohne den nicht weiter bestimmten Begriff des Guten ausdeutend einzugrenzen.'
