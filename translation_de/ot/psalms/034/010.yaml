id: PSA.34.10
reference: Psalms 34:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כְּ֭פִירִים רָשׁ֣וּ וְ/רָעֵ֑בוּ וְ/דֹרְשֵׁ֥י יְ֝הוָ֗ה לֹא יַחְסְר֥וּ כָל טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/010.yaml
  text: Young lions suffer want and hunger[a], but those who seek Yahweh lack no good thing.
translation:
  language: de
  text: Junge Löwen leiden Not und hungern[a], doch denen, die Jahwe suchen, fehlt nichts Gutes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Junge Löwen verarmen und hungern.« Das hebräische Verb kann sowohl Mangel leiden als auch arm werden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפִירִים
  choice: Junge Löwen
  rationale: Das Substantiv bezeichnet junge, kräftige Löwen. Die Wendung bewahrt das Bild von starken Raubtieren, bei denen man Mangel am wenigsten erwarten würde.
- source_word: רָשׁוּ
  choice: leiden Not
  rationale: Das Verb bezeichnet Verarmung oder Mangel. »Not leiden« ist natürliches, gehobenes Deutsch und unterscheidet die allgemeine Entbehrung vom anschließenden Hunger.
- source_word: וְרָעֵבוּ
  choice: und hungern
  rationale: Das Verb bedeutet »hungrig sein« beziehungsweise »Hunger leiden«. Die knappe Form erhält den poetischen Parallelismus.
- source_word: וְדֹרְשֵׁי יְהוָה
  choice: doch denen, die Jahwe suchen
  rationale: Die Partizipialkonstruktion bezeichnet Menschen, die dadurch gekennzeichnet sind, dass sie sich an Jahwe wenden und ihn suchen. Die deutsche Relativkonstruktion ist natürlich und bewahrt diesen fortdauernden Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen gebräuchliche wissenschaftliche Umschrift.
- source_word: לֹא יַחְסְרוּ
  choice: fehlt nichts
  rationale: Das Imperfekt formuliert hier eine allgemeine, sprichwortartige Zusage. Die deutsche Wendung gibt die Verneinung idiomatisch wieder.
- source_word: כָל טוֹב
  choice: nichts Gutes
  rationale: Die Verbindung kann umfassend »irgendetwas Gutes« beziehungsweise »alles Gute« bezeichnen. Zusammen mit der Verneinung ist »nichts Gutes« prägnant und natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Wiedergabe als »Jahwe« erhält den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Umfang der Zusage, dass nichts Gutes fehlt
  choice: Die umfassende Formulierung bleibt ohne erklärende Einschränkung stehen.
  alternative: Die Aussage ausdrücklich auf geistlich Förderliches oder auf notwendige Güter begrenzen.
  rationale: כָל טוֹב ist umfassend formuliert. Der Vers selbst erläutert nicht, nach welchem Maßstab etwas gut ist; diese theologische Spannung darf nicht durch einen Zusatz aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. »Not leiden« wahrt den gehobenen Ton, bleibt aber allgemein verständlich; »doch« markiert den starken Gegensatz der beiden Vershälften.
