source:
  edition: WLC
  text: רַ֭בּוֹת רָע֣וֹת צַדִּ֑יק וּ֝/מִ/כֻּלָּ֗/ם יַצִּילֶ֥/נּוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/019.yaml
  text: Many are the afflictions of the righteous man[b][a], but Yahweh delivers him out of them all.
translation:
  language: de
  text: Zahlreich sind die Nöte des Gerechten[a], doch aus ihnen allen rettet ihn Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zahlreich sind die Übel beziehungsweise Unglücksfälle des Gerechten.« Das hebräische Wort kann Böses, Nöte oder Unglück bezeichnen; hier geht es um die leidvollen Erfahrungen, die den Gerechten treffen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: Zahlreich sind
  rationale: Die vorangestellte prädikative Form wird mit natürlicher deutscher Wortstellung wiedergegeben und behält die Betonung der Vielzahl bei.
- source_word: רָעוֹת
  choice: Nöte
  rationale: Das Wort kann Böses, Unglück oder Bedrängnisse bezeichnen. Im Zusammenhang sind leidvolle Widerfahrnisse gemeint, aus denen Jahwe rettet; „Nöte“ gibt dies klar wieder, ohne moralische Schuld des Gerechten anzudeuten.
- source_word: צַדִּיק
  choice: des Gerechten
  rationale: Das substantivierte Adjektiv steht im maskulinen Singular. Die deutsche Form bewahrt Numerus und Genus und kann zugleich repräsentativ verstanden werden.
- source_word: וּמִכֻּלָּם
  choice: doch aus ihnen allen
  rationale: Das ו wird im Zusammenhang kontrastiv mit „doch“ wiedergegeben; „aus ihnen allen“ bewahrt den umfassenden Sinn von כֻּלָּם und nimmt die Nöte grammatisch passend auf.
- source_word: יַצִּילֶנּוּ
  choice: rettet ihn
  rationale: Der Hifil von נצל bedeutet hier, jemanden aus einer Gefahr oder Not zu retten. Das deutsche Präsens entspricht der hebräischen Verbform in ihrer allgemeinen Aussage.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Repräsentativer maskuliner Singular bei צַדִּיק
  choice: des Gerechten
  alternative: eines gerechten Menschen
  rationale: Die gewählte Form wahrt den maskulinen Singular des Hebräischen, ohne auszuschließen, dass die Aussage exemplarisch für gerechte Menschen gilt.
- issue: Bedeutungsumfang von רָעוֹת
  choice: Nöte
  alternative: Übel / Unglücksfälle
  rationale: Der Kontext spricht von dem, was dem Gerechten widerfährt und woraus er gerettet wird. „Nöte“ vermeidet eine vorschnelle moralische Deutung, während die Fußnote die breitere lexikalische Spannweite offenhält.
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext den Gottesnamen selbst verwendet, bewahrt die Übersetzung ihn als persönlichen Namen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Parallelstruktur und der Kontrast zwischen zahlreichen Nöten und umfassender Rettung bleiben erhalten.
