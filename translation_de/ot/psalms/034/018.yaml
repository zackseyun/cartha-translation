id: PSA.34.18
reference: Psalms 34:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: קָר֣וֹב יְ֭הוָה לְ/נִשְׁבְּרֵי לֵ֑ב וְֽ/אֶת דַּכְּאֵי ר֥וּחַ יוֹשִֽׁיעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/018.yaml
  text: Yahweh is near to the brokenhearted[a], and he saves those crushed in spirit.
translation:
  language: de
  text: Jahwe ist denen nahe, deren Herz zerbrochen ist, und er rettet die, deren Geist zerschlagen ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die demütigen Geistes sind«. Das Hebräische kann Menschen bezeichnen, die innerlich zerschlagen oder gedemütigt sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: nahe
  rationale: Das prädikative Adjektiv bezeichnet räumliche oder relationale Nähe; »nahe« bewahrt beide Nuancen und klingt im Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im modernen Deutschen geläufige Umschrift.
- source_word: לְנִשְׁבְּרֵי לֵב
  choice: denen, deren Herz zerbrochen ist
  rationale: Die Formulierung bewahrt das hebräische Bild eines zerbrochenen Herzens, vermeidet aber das im Deutschen oft enger auf Liebeskummer bezogene »denen mit gebrochenem Herzen«.
- source_word: דַּכְּאֵי רוּחַ
  choice: die, deren Geist zerschlagen ist
  rationale: דכא bezeichnet ein Niederdrücken oder Zerschlagen. Die Wiedergabe erhält die Intensität und lässt offen, ob Bedrängnis, innere Gebrochenheit oder Demut im Vordergrund steht.
- source_word: יוֹשִׁיעַ
  choice: er rettet
  rationale: Das Hifil von ישׁע bedeutet retten oder befreien; »rettet« wahrt den Anschluss an den biblischen Wortschatz der Rettung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext gebraucht den Gottesnamen selbst. Die Umschrift bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Nuance von דַּכְּאֵי רוּחַ
  choice: deren Geist zerschlagen ist
  alternative: die demütigen Geistes sind / die innerlich niedergeschlagen sind
  rationale: Der Text kann sowohl tiefes inneres Zerschlagensein als auch Demut bezeichnen. Der Haupttext hält am kräftigen Bild fest; die Fußnote bewahrt die mögliche Nuance der Demut, ohne eine ausdrücklich bußtheologische Bedeutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die beiden Körpermetaphern »Herz« und »Geist« bleiben erhalten; die Relativkonstruktionen vermeiden missverständliche oder altertümliche Substantivierungen.
