  text: מִֽי הָ֭/אִישׁ הֶ/חָפֵ֣ץ חַיִּ֑ים אֹהֵ֥ב יָ֝מִ֗ים לִ/רְא֥וֹת טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/012.yaml
  text: Who is the man who delights in life[b][a], loving days to see good?
translation:
  language: de
  text: Wer ist der Mann[a], der Freude am Leben hat und Tage liebt, um Gutes zu sehen[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Mensch«; das hebräische »der Mann« ist hier allgemein und repräsentativ gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »um Gutes zu erleben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הָאִישׁ
  choice: Wer ist der Mann
  rationale: Bewahrt die rhetorische Frage und die grammatisch maskuline Einzahl des Hebräischen; der Ausdruck hat hier repräsentativen, allgemeinen Sinn.
- source_word: הֶחָפֵץ
  choice: der Freude an … hat
  rationale: חפץ bezeichnet Verlangen, Gefallen oder Freude. Die Formulierung gibt die positive Hinwendung natürlich und würdig wieder.
- source_word: חַיִּים
  choice: Leben
  rationale: Die morphologische Mehrzahl ist im Hebräischen die übliche Bezeichnung für das Leben und wird im Deutschen idiomatisch als Singular wiedergegeben.
- source_word: אֹהֵב יָמִים
  choice: und Tage liebt
  rationale: Gibt das Partizip und die Parallelität zu »Freude am Leben hat« eng wieder, ohne »Tage« als langes Leben auszudeuten.
- source_word: לִרְאוֹת טוֹב
  choice: um Gutes zu sehen
  rationale: Bewahrt sowohl das konkrete Verb »sehen« als auch die offene Bedeutung von טוֹב; der hebräische Ausdruck kann idiomatisch das Erleben von Gutem meinen.
theological_decisions:
- issue: Generisches Maskulinum
  choice: der Mann
  alternative: der Mensch; jemand
  rationale: Der hebräische Text verwendet den bestimmten, grammatisch maskulinen Singular הָאִישׁ. Die Übersetzung erhält diese Form und weist zugleich auf ihren allgemeinen, repräsentativen Sinn hin.
- issue: Bedeutung von »Gutes sehen«
  choice: Gutes sehen
  alternative: Gutes erleben
  rationale: Die wörtliche Bildsprache bleibt erhalten, ohne das Gute auf Wohlergehen oder materiellen Erfolg einzuengen; die idiomatische Bedeutung wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Anlehnung an die hebräische Weisheitsrede. Die etwas markante Wendung »Tage liebt« bleibt stehen, um den Parallelismus von »Leben« und »Tage« zu bewahren.
