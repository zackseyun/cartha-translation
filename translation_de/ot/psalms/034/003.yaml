  text: גַּדְּל֣וּ לַ/יהוָ֣ה אִתִּ֑/י וּ/נְרוֹמְמָ֖ה שְׁמ֣/וֹ יַחְדָּֽו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/003.yaml
  text: Magnify Yahweh with me[a], and let us exalt his name together.
translation:
  language: de
  text: Preist mit mir Jahwe[a], und lasst uns seinen Namen gemeinsam erhöhen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit »der HERR« wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּדְּלוּ
  choice: Preist … die Größe
  rationale: Der pluralische Imperativ von גדל fordert dazu auf, Jahwes Größe im Lob zu bekennen. Die Formulierung ist im modernen Deutschen natürlich und vermeidet die missverständliche Vorstellung, Gott werde buchstäblich größer gemacht.
- source_word: לַיהוָה
  choice: Jahwes
  rationale: Die Präposition ל markiert hier denjenigen, dessen Größe gepriesen wird; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: אִתִּי
  choice: mit mir
  rationale: Die Präposition mit dem Suffix der ersten Person Singular bezeichnet die gemeinsame Beteiligung am Lob.
- source_word: וּנְרוֹמְמָה
  choice: und lasst uns … erheben
  rationale: Die Kohortativform der ersten Person Plural von רום drückt eine gemeinsame Aufforderung aus. »Lasst uns erheben« bewahrt das Bild und den auffordernden Charakter.
- source_word: שְׁמוֹ
  choice: seinen Namen
  rationale: Die wörtliche Wiedergabe ist im Deutschen verständlich und bewahrt den theologischen Bezug auf Gottes offenbarte Identität und Ansehen.
- source_word: יַחְדָּו
  choice: gemeinsam
  rationale: Das Adverb bezeichnet vereintes Handeln; »gemeinsam« klingt in dieser Aufforderung natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm יהוה. »Jahwe« gibt den Eigennamen wieder; die traditionelle Wiedergabe »der HERR« wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Aufbau aus gemeinsamer Aufforderung und Gotteslob bleibt erhalten; »Preist … die Größe« vermittelt die idiomatische Bedeutung von גדל, während »seinen Namen erheben« das hebräische Bild bewahrt.
