lexical_decisions:
- source_word: אָחַזְתָּ
  choice: Du hältst … offen
  rationale: Das Qal Perfekt 2. Person Singular richtet sich im Zusammenhang an Gott. Zusammen mit dem folgenden Ausdruck bezeichnet das Verb ein anhaltendes Offenhalten; das deutsche Präsens gibt den gegenwärtig erfahrenen Zustand natürlich wieder.
- source_word: שְׁמֻרוֹת עֵינָי
  choice: meine Augenlider
  rationale: Wörtlich steht ein Ausdruck wie „die Wachen meiner Augen“. Im Zusammenhang ist wahrscheinlich gemeint, dass Gott den Beter am Schließen der Augen und damit am Schlafen hindert. „Augenlider“ vermittelt diese idiomatische Bedeutung verständlich, während die Fußnote das ungewöhnliche hebräische Bild bewahrt.
- source_word: נִפְעַמְתִּי
  choice: ich bin aufgewühlt
  rationale: Das Niphal bezeichnet hier innere Erregung oder Verstörung. „Aufgewühlt“ wahrt die emotionale Intensität, ohne den Zustand zu eng als Angst, Entsetzen oder bloße Unruhe festzulegen.
- source_word: וְלֹא אֲדַבֵּר
  choice: und kann nicht reden
  rationale: Formal heißt die Wendung „und ich rede nicht“. Im Kontext folgt das Schweigen jedoch wahrscheinlich aus der starken inneren Erschütterung; „kann nicht reden“ gibt diese naheliegende modale Bedeutung in natürlichem Deutsch wieder. Die formalere Alternative wird in einer Fußnote genannt.
theological_decisions:
- issue: Göttliches Handeln und Schlaflosigkeit
  choice: Gott wird unmittelbar als derjenige angesprochen, der die Augen des Beters offen hält.
  alternative: Die Zeile lediglich als unpersönliche Schlaflosigkeit wiederzugeben.
  rationale: Die Verbform der 2. Person Singular bewahrt die direkte Zuschreibung an Gott, ohne zu erklären, aus welchem theologischen Grund Gott dies tut.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Klang. Die direkte Gottesanrede und die Parallelität der beiden Satzteile bleiben erhalten; das ungewöhnliche hebräische Bild wird im Text idiomatisch und in der Fußnote wörtlicher wiedergegeben.
