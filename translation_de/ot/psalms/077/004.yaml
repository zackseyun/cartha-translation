  text: Du hältst meine Augenlider offen[a]; ich bin aufgewühlt und kann nicht reden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Du hältst die Wachen meiner Augen fest.“ Der hebräische Ausdruck meint wahrscheinlich, dass Gott den Beter nicht einschlafen lässt.'
