base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/009.yaml
  text: Has God forgotten to be gracious? Has he in anger shut up his compassion? Selah[a][b]
translation:
  language: de
  text: Hat Gott vergessen, gnädig zu sein? Hat er im Zorn sein Erbarmen verschlossen? Sela.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hat Gott vergessen, Gunst zu erweisen? Oder hat er im Zorn seine Erbarmungen zurückgehalten?“'
    reason: lexical_alternative
  - marker: b
    text: „Sela“ ist wahrscheinlich ein liturgisches oder musikalisches Zeichen; seine genaue Bedeutung ist ungewiss.
    reason: cultural_note
lexical_decisions:
- source_word: הֲ/שָׁכַח
  choice: Hat ... vergessen
  rationale: Die Fragepartikel הֲ mit שׁכח leitet eine rhetorische Frage ein. „Vergessen“ ist die natürliche deutsche Entsprechung und bewahrt die angespannte Klage.
- source_word: חַנּוֹת
  choice: gnädig zu sein
  rationale: Der Infinitiv von חנן bezeichnet das Erweisen von Gnade oder Gunst. „Gnädig zu sein“ erhält den wichtigen sprachlichen Bezug zur Gnade.
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier eine allgemeine Gottesbezeichnung. „Gott“ ist im Deutschen klar und idiomatisch.
- source_word: אִם
  choice: Hat
  rationale: אִם führt nach der ersten rhetorischen Frage die parallele zweite Frage ein. Eine neue deutsche Frage mit „Hat“ klingt natürlich; die alternative Verknüpfung „Oder hat“ wird in der Fußnote genannt.
- source_word: קָפַץ
  choice: verschlossen
  rationale: Das Verb bezeichnet ein festes Schließen oder Verschließen. „Sein Erbarmen verschlossen“ bewahrt die konkrete Metapher des Hebräischen, ohne sie erklärend aufzulösen.
- source_word: בְּ/אַף
  choice: im Zorn
  rationale: אַף bedeutet wörtlich „Nase“ und bezeichnet übertragen Zorn. „Im Zorn“ gibt die Präpositionalfügung knapp und idiomatisch wieder.
- source_word: רַחֲמָיו
  choice: sein Erbarmen
  rationale: Die morphologische Pluralform kann als abstrakter Sammelbegriff für göttliches Erbarmen verstanden werden. Der Singular ist im heutigen Deutsch natürlich; „seine Erbarmungen“ wird als nähere formale Alternative in der Fußnote berücksichtigt.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und genaue Funktion des Ausdrucks unsicher sind, wird er transliteriert statt mutmaßlich übersetzt.
theological_decisions:
- issue: Wiedergabe als rhetorische Fragen oder als Aussagen
  choice: Zwei rhetorische Fragen, die die Not des Psalmisten ausdrücken
  alternative: Aussagen wie „Gott hat vergessen ...“
  rationale: Die Fragepartikel und der poetische Zusammenhang sprechen für rhetorische Fragen. Aussagen würden die Klage zu stark als Feststellung formulieren und die theologische Spannung einebnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen rhetorischen Fragen und die konkrete Metapher des Verschließens bleiben erhalten; „Sela“ wird wegen seiner unsicheren Bedeutung nicht übersetzt.
