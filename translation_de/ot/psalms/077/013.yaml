source:
  edition: WLC
  text: אֱ֭לֹהִים בַּ/קֹּ֣דֶשׁ דַּרְכֶּ֑/ךָ מִי אֵ֥ל גָּ֝ד֗וֹל כֵּֽ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/013.yaml
  text: God[a], your way is in holiness; who is a great god like God?
translation:
  language: de
  text: Gott, dein Weg ist in Heiligkeit.[a] Wer ist ein großer Gott wie Gott?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Heiligtum«. Der hebräische Ausdruck kann sowohl Heiligkeit als Gottes Wesensmerkmal als auch den heiligen Ort bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Als Anrede verstanden; das folgende Suffix der zweiten Person in »dein Weg« legt den Vokativ nahe.
- source_word: בַּקֹּדֶשׁ
  choice: in Heiligkeit
  rationale: קֹדֶשׁ kann Heiligkeit als Bereich oder Wesensmerkmal bezeichnen, aber auch das Heiligtum. Die Hauptlesart wahrt die Aussage über Gottes heiliges Handeln; die örtliche Lesart bleibt in der Fußnote erhalten.
- source_word: דַּרְכֶּךָ
  choice: dein Weg
  rationale: »Weg« gibt sowohl Gottes Vorgehen als auch die Art seines Handelns knapp und natürlich wieder.
- source_word: מִי
  choice: wer
  rationale: Leitet die rhetorische Vergleichsfrage direkt ein.
- source_word: אֵל
  choice: ein ... Gott
  rationale: Hier als Gattungsbegriff in der Vergleichsfrage verstanden, im Unterschied zu אֱלֹהִים als Bezeichnung des einen Gottes.
- source_word: גָּדוֹל
  choice: groß
  rationale: Entspricht der grundlegenden Bedeutung und bewahrt die schlichte Erhabenheit der rhetorischen Frage.
- source_word: כֵּאלֹהִים
  choice: wie Gott
  rationale: Die Präposition כ־ bezeichnet den Vergleich; אֱלֹהִים ist im Kontext singularisch auf Gott bezogen.
theological_decisions:
- issue: Bedeutung von בַּקֹּדֶשׁ
  choice: Gottes Weg ist in Heiligkeit
  alternative: Gottes Weg ist im Heiligtum
  rationale: Der hebräische Ausdruck erlaubt sowohl eine abstrakte als auch eine örtlich-kultische Deutung. Die Hauptfassung betont Gottes heiliges Wesen und Handeln, ohne die alternative Heiligtumslesart zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur und die rhetorische Frage des Hebräischen bleiben erhalten; die echte Mehrdeutigkeit von בַּקֹּדֶשׁ wird durch eine Fußnote sichtbar gemacht.
