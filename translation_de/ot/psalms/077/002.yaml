  text: בְּ/י֥וֹם צָרָתִ/י֮ אֲדֹנָ֪/י דָּ֫רָ֥שְׁתִּי יָדִ֤/י לַ֣יְלָה נִ֭גְּרָה וְ/לֹ֣א תָפ֑וּג מֵאֲנָ֖ה הִנָּחֵ֣ם נַפְשִֽׁ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/002.yaml
  text: In the day of my distress I sought the Lord[a]; my hand was stretched out in the night and did not grow numb; my soul refused to be comforted.
translation:
  language: de
  text: Am Tag meiner Not suchte ich den Herrn. Meine Hand war nachts ausgestreckt und ließ nicht nach[a]; meine Seele weigerte sich, Trost anzunehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise wörtlich: „Meine Hand floss in der Nacht und ließ nicht nach.“ Das hebräische Bild ist schwer verständlich; der Haupttext deutet es als eine im beharrlichen Gebet ausgestreckte Hand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: Am Tag meiner Not
  rationale: Die Zeitangabe wird nah am hebräischen Ausdruck wiedergegeben; „Not“ bezeichnet hier die bedrängende Lage des Beters.
- source_word: אֲדֹנָי
  choice: den Herrn
  rationale: Hier steht der Gottestitel Adonaj, nicht der Gottesname JHWH. Im deutschen Satz verlangt „suchen“ den Akkusativ.
- source_word: דָּרָשְׁתִּי
  choice: suchte ich
  rationale: Das Verb bezeichnet im Bezug auf Gott das ernsthafte Suchen nach ihm.
- source_word: יָדִי לַיְלָה נִגְּרָה
  choice: Meine Hand blieb die ganze Nacht ausgestreckt
  rationale: Das wörtliche Bild des Fließens ist im Hebräischen schwierig. Im Zusammenhang wird es wahrscheinlich als beharrlich ausgestreckte Hand des Betenden verstanden; der Singular „Hand“ bleibt erhalten.
- source_word: וְלֹא תָפוּג
  choice: und ließ nicht nach
  rationale: Das Verb kann Erschlaffen, Nachlassen oder Aufhören bezeichnen. Die Formulierung wahrt die Ausdauer des Gebets, ohne die Bedeutung auf körperliche Taubheit festzulegen.
- source_word: מֵאֲנָה הִנָּחֵם נַפְשִׁי
  choice: meine Seele weigerte sich, Trost anzunehmen
  rationale: „Meine Seele“ erhält die poetische und persönliche Ausdrucksweise von נַפְשִׁי; die aktive deutsche Wendung gibt das Sich-nicht-trösten-Lassen natürlich wieder.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי
  choice: der Herr
  alternative: Herr
  rationale: Der hebräische Text verwendet den Titel Adonaj und nicht das Tetragramm. Daher wird der Titel regulär als „der Herr“ übersetzt.
- issue: Bedeutung von נֶפֶשׁ im Klagegebet
  choice: meine Seele
  alternative: ich selbst / mein Innerstes
  rationale: „Meine Seele“ bewahrt hier die poetische Spannung zwischen der betenden Person und ihrem untröstlichen Inneren, ohne eine engere anthropologische Lehre in den Ausdruck hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Satzführung. Das schwierige hebräische Hand-Bild wird im Haupttext verständlich wiedergegeben und in der Fußnote transparent offengehalten.
