source:
  edition: WLC
  text: אזכיר מַֽעַלְלֵי יָ֑הּ כִּֽי אֶזְכְּרָ֖ה מִ/קֶּ֣דֶם פִּלְאֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/011.yaml
  text: I will remember the deeds of Yah[b][a], for I will remember your wonders from of old.
translation:
  language: de
  text: Ich will der Taten Jahs[a] gedenken; ja, ich will an deine Wunder aus alter Zeit[b] denken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich will die Taten Jahs erwähnen/erzählen.“ Das Verb kann sowohl das Erinnern als auch das erwähnende Nennen oder Berichten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus uralter Zeit“ beziehungsweise „von alters her“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּיר
  choice: ich will … gedenken
  rationale: Der Hifil von זכר kann „in Erinnerung rufen“, „erwähnen“ oder „verkünden“ bedeuten. „Gedenken“ bewahrt hier den bewussten Entschluss zur Erinnerung und lässt offen, ob diese auch ausgesprochen wird.
- source_word: מַעַלְלֵי
  choice: Taten
  rationale: מַעֲלָלִים bezeichnet Handlungen oder Taten; „Taten“ ist im Deutschen natürlich und dem poetischen Register angemessen.
- source_word: יָהּ
  choice: Jah
  rationale: יָהּ ist die poetische Kurzform des Gottesnamens. „Jah“ erhält diese vom vollen Tetragramm unterscheidbare Form.
- source_word: כִּי
  choice: ja
  rationale: כִּי kann hier eine bekräftigende oder erläuternde Wiederaufnahme einleiten. „Ja“ gibt den Nachdruck natürlich wieder, ohne eine streng kausale Beziehung zu erzwingen.
- source_word: אֶזְכְּרָה
  choice: ich will … denken
  rationale: Die Form hat volitionalen Nachdruck. „Ich will an … denken“ drückt den festen Entschluss in modernem Deutsch klar aus.
- source_word: מִקֶּדֶם
  choice: aus alter Zeit
  rationale: Der Ausdruck verweist auf längst vergangene, frühere Zeiten, ohne notwendig den absoluten Anfang zu bezeichnen.
- source_word: פִּלְאֶךָ
  choice: deine Wunder
  rationale: פלא bezeichnet ein Wunder oder eine staunenswerte Tat. Der deutsche Plural „Wunder“ passt zum kollektiven Sinn und zur Parallele mit „Taten“.
theological_decisions:
- issue: Wiedergabe der poetischen Kurzform des Gottesnamens יָהּ
  choice: Jah
  alternative: der HERR
  rationale: Der hebräische Text hat יָהּ, nicht das volle Tetragramm יהוה. „Jah“ bewahrt diese lexikalische und poetische Unterscheidung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelität. Der Wechsel zwischen „gedenken“ und „an … denken“ spiegelt die verwandten hebräischen Verbformen, ohne im Deutschen schwerfällig zu wirken.
