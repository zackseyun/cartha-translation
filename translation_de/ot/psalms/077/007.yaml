  text: הַֽ֭/לְ/עוֹלָמִים יִזְנַ֥ח אֲדֹנָ֑/י וְ/לֹֽא יֹסִ֖יף לִ/רְצ֣וֹת עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/007.yaml
  text: Will the Lord reject forever[a], and never again show favor?
translation:
  language: de
  text: Wird der Herr für immer verwerfen[a] und nie wieder Wohlgefallen zeigen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wird der Herr für immer zurückweisen und nie wieder günstig gesinnt sein?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְעוֹלָמִים
  choice: für immer
  rationale: Die Fragepartikel הַ leitet eine rhetorische Frage ein; „für immer“ gibt die zeitliche Tragweite von לְעוֹלָמִים natürlich und prägnant wieder.
- source_word: יִזְנַח
  choice: verstoßen
  rationale: Das Verb bezeichnet das Zurückweisen oder Verstoßen. „Verstoßen“ bewahrt im Klagekontext den starken relationalen Sinn.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: אֲדֹנָי ist der göttliche Titel „Herr“, nicht der Gottesname JHWH; daher wird der Titel übersetzt.
- source_word: וְלֹא יֹסִיף ... עוֹד
  choice: und nie wieder
  rationale: Die verneinte Konstruktion mit יסף und עוֹד drückt aus, dass etwas künftig nicht noch einmal beziehungsweise nicht länger geschieht.
- source_word: לִרְצוֹת
  choice: Wohlgefallen zeigen
  rationale: רצה bezeichnet hier eine günstige, wohlwollende Haltung. „Wohlgefallen zeigen“ bewahrt sowohl die relationale als auch die gnädige Nuance, ohne sie auf bloßes Gefallen zu verengen.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels אֲדֹנָי
  choice: der Herr
  alternative: Herr
  rationale: Der Ausgangstext verwendet den Titel Adonai und nicht den Gottesnamen JHWH. Die Übersetzung als „der Herr“ gibt den Titel in natürlichem Deutsch wieder, ohne ihn mit der üblichen Wiedergabe des Gottesnamens gleichzusetzen.
- issue: Bedeutung von רצה im Verhältnis Gottes zu seinem Volk
  choice: Wohlgefallen zeigen
  alternative: gnädig sein / Gefallen haben
  rationale: Die Formulierung lässt offen, ob der Schwerpunkt auf Gottes wohlwollender Haltung, seiner Annahme oder seiner Gunst liegt, und vermeidet eine konfessionell verengte Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele rhetorische Frage und die Spannung der Klage bleiben erhalten; „verstoßen“ ist kräftig, aber allgemein verständlich.
