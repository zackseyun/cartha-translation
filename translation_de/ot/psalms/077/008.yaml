source:
  edition: WLC
  text: הֶ/אָפֵ֣ס לָ/נֶ֣צַח חַסְדּ֑/וֹ גָּ֥מַר אֹ֝֗מֶר לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/008.yaml
  text: Has his steadfast love ceased forever? Has his promise come to an end for generation after generation?[a]
translation:
  language: de
  text: Ist seine beständige Liebe für immer zu Ende? Hat seine Zusage ein Ende, von Generation zu Generation?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hat sein Wort ein Ende, von Generation zu Generation?“'
    reason: Lexikalische Alternative zu אֹמֶר; „Wort“ ist formaler als die kontextuelle Wiedergabe „Zusage“.
lexical_decisions:
- source_word: הֶאָפֵס
  choice: ist ... zu Ende
  rationale: Das mit der Fragepartikel verbundene Verb fragt, ob etwas aufgehört hat oder verschwunden ist. Die Formulierung ist im Deutschen natürlich und bewahrt die erschütternde Frage des Klagepsalms.
- source_word: לָנֶצַח
  choice: für immer
  rationale: Die geläufige Zeitangabe bezeichnet unbegrenzte oder dauerhafte Geltung; „für immer“ gibt die Schärfe der Frage idiomatisch wieder.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חֶסֶד verbindet liebevolle Zuwendung mit Verlässlichkeit und Treue. „Beständige Liebe“ bewahrt beide Aspekte, ohne eine bestimmte Bundestheologie ausdrücklich in den Text einzutragen.
- source_word: גָּמַר
  choice: gilt ... nicht mehr
  rationale: Das Verb bezeichnet Vollendung beziehungsweise Aufhören. Zusammen mit „Zusage“ drückt „gilt ... nicht mehr“ das befürchtete Ende ihrer fortdauernden Geltung in natürlichem Deutsch aus.
- source_word: אֹמֶר
  choice: seine Zusage
  rationale: Wörtlich bezeichnet das Substantiv ein Wort oder einen Ausspruch. Im Parallelismus mit Gottes beständiger Liebe liegt eine verbindliche Äußerung nahe; die formalere Wiedergabe „Wort“ bleibt in der Fußnote erhalten.
- source_word: לְדֹר וָדֹר
  choice: von Generation zu Generation
  rationale: Die idiomatische Wendung bezeichnet die fortlaufende Dauer über aufeinanderfolgende Generationen hinweg und lässt sich so würdig und geläufig wiedergeben.
theological_decisions:
- issue: Ob אֹמֶר formal als „Wort“ oder kontextuell als „Zusage“ wiederzugeben ist
  choice: Zusage
  alternative: Wort; Ausspruch
  rationale: Im Zusammenhang der Klage über Gottes Liebe und Verlässlichkeit ist wahrscheinlich Gottes verbindliches Wort gemeint. Da „Zusage“ diese Deutung verdeutlicht, ohne lexikalisch zwingend zu sein, wird „Wort“ als echte Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden rhetorischen Fragen bleiben als Klage stehen und werden theologisch nicht aufgelöst. „Beständige Liebe“ vermeidet Archaismen; „Zusage“ ist kontextuell verständlich, während die Fußnote die lexikalische Offenheit von אֹמֶר sichtbar hält.
