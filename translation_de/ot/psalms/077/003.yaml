source:
  edition: WLC
  text: אֶזְכְּרָ֣ה אֱלֹהִ֣ים וְ/אֶֽהֱמָיָ֑ה אָשִׂ֓יחָה וְ/תִתְעַטֵּ֖ף רוּחִ֣/י סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/003.yaml
  text: I remember God[a], and I groan; I meditate, and my spirit grows faint[b]. Selah
translation:
  language: de
  text: Ich denke an Gott und stöhne; ich sinne nach[a], und mein Geist wird schwach[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ich klage“. Das hebräische Verb kann sowohl nachdenkliches Sinnen als auch klagendes Reden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mein Geist ist überwältigt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: Ich denke an
  rationale: Die Kohortativform von זכר kann gegenwärtiges, zukünftiges oder willentliches Erinnern ausdrücken. Im unmittelbaren Klagezusammenhang gibt „ich denke an“ den fortdauernden inneren Vorgang natürlich wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Gemeint ist hier der Gott Israels; der Singular „Gott“ entspricht dem Zusammenhang.
- source_word: וְאֶהֱמָיָה
  choice: und stöhne
  rationale: המה bezeichnet hörbare innere Erregung oder Klage. „Stöhnen“ passt zur Bedrängnis des Beters und bewahrt die körperlich-hörbare Färbung.
- source_word: אָשִׂיחָה
  choice: ich sinne nach
  rationale: שיח kann in Klagepsalmen nachdenkliches Sinnen, Reden oder Klagen bezeichnen. „Nachsinnen“ wahrt hier den Bezug auf den inneren Reflexionsvorgang, ohne die mögliche Klagebedeutung auszuschließen.
- source_word: וְתִתְעַטֵּף
  choice: wird schwach
  rationale: Der Hitpael von עטף kann ein Schwachwerden, Verschmachten oder Überwältigtwerden ausdrücken. „Wird schwach“ ist verständlich und lässt die Art des inneren Zusammenbruchs offen.
- source_word: רוּחִי
  choice: mein Geist
  rationale: רוּחַ kann Wind, Atem oder Geist bedeuten. Hier bezeichnet es das innere Leben des Beters; „mein Geist“ wahrt diese anthropologische Offenheit besser als eine rein körperliche Wiedergabe.
- source_word: סֶלָה
  choice: Sela
  rationale: Die genaue Bedeutung des musikalisch-liturgischen Ausdrucks ist unsicher; deshalb wird er transliteriert.
theological_decisions: []
