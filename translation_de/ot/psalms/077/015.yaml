id: PSA.77.15
reference: Psalms 77:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: גָּאַ֣לְתָּ בִּ/זְר֣וֹעַ עַמֶּ֑/ךָ בְּנֵי יַעֲקֹ֖ב וְ/יוֹסֵ֣ף סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/015.yaml
  text: You redeemed your people with your arm[a], the sons of Jacob and Joseph[d][c][b]. Selah
translation:
  language: de
  text: Du hast dein Volk mit deinem Arm[a] erlöst, die Söhne Jakobs und Josefs[b]. Sela[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich bleibt das Bild vom Arm Gottes erhalten; es bezeichnet seine machtvolle, rettende Wirksamkeit. Für „erlöst“ sind auch „befreit“ oder „losgekauft“ möglich.
    reason: lexical_alternative
  - marker: b
    text: „Die Söhne Jakobs und Josefs“ ist möglicherweise eine poetische Bezeichnung für Israel; „Josef“ kann dabei besonders auf die von ihm abstammenden Stämme hinweisen.
    reason: alternative_reading
  - marker: c
    text: „Sela“ ist vermutlich eine liturgische oder musikalische Angabe; seine genaue Bedeutung ist unsicher.
    reason: cultural_note
lexical_decisions:
- source_word: גָּאַלְתָּ
  choice: du hast … erlöst
  rationale: Das Verb גאל bezeichnet Erlösung oder Befreiung, oft mit dem Hintergrund des Lösens durch einen nahen Verwandten. „Erlöst“ bewahrt dieses gewichtige Bedeutungsfeld, ohne den Vers enger auszulegen.
- source_word: בִּזְרוֹעַ
  choice: mit deinem Arm
  rationale: זְרוֹעַ bedeutet wörtlich „Arm“ und steht hier bildhaft für Gottes wirksame Macht. Die konkrete poetische Bildsprache bleibt erhalten.
- source_word: עַמֶּךָ
  choice: dein Volk
  rationale: עַם mit dem Suffix der 2. Person Singular bezeichnet unmittelbar das Gott zugehörige Volk.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: בְּנֵי ist die Konstruktform von „Söhne“. Die formnahe Wiedergabe wahrt die genealogisch-poetische Ausdrucksweise; gemeint sein können die Nachkommen.
- source_word: יַעֲקֹב וְיוֹסֵף
  choice: Jakobs und Josefs
  rationale: Die beiden Personennamen werden ohne erklärende Erweiterung beibehalten, da der hebräische Text ihre repräsentative Funktion nicht ausdrücklich festlegt.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und Funktion des wahrscheinlich liturgischen oder musikalischen Zeichens unsicher sind, wird es nach üblicher deutscher Form transliteriert.
theological_decisions:
- issue: Nationale Bezeichnung „die Söhne Jakobs und Josefs“
  choice: Die doppelte Namensnennung wird wörtlich beibehalten.
  alternative: „Die Nachkommen Jakobs und Josefs“ oder eine ausdrückliche Deutung auf ganz Israel beziehungsweise die von Josef abstammenden Stämme.
  rationale: Der Text erklärt nicht, ob Josef speziell für Ephraim und Manasse, das Nordreich oder zusammen mit Jakob für ganz Israel steht. Die Übersetzung erhält diese Offenheit.
translation_notes:
  register: Moderne, würdige Psalmsprache. Das geläufige biblische Bild „mit deinem Arm“ sowie die genealogische Form „Söhne“ werden bewahrt; Satzbau und Wortwahl bleiben für heutige Leser verständlich.
