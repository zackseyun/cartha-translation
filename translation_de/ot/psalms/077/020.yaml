  text: נָחִ֣יתָ כַ/צֹּ֣אן עַמֶּ֑/ךָ בְּֽ/יַד מֹשֶׁ֥ה וְ/אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/020.yaml
  text: You led your people like a flock by the hand of Moses and Aaron[a][b].
translation:
  language: de
  text: Du hast dein Volk wie eine Herde durch Mose und Aaron geführt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »durch die Hand Moses und Aarons«; die hebräische Wendung bezeichnet hier die Führung durch Mose und Aaron.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחִיתָ
  choice: Du hast … geführt
  rationale: Das Qal Perfekt 2. Person maskulin Singular spricht Gott direkt an und bezeichnet sein Führen oder Leiten. Das deutsche Perfekt klingt natürlich und bewahrt den Rückblick auf Gottes Handeln.
- source_word: כַצֹּאן
  choice: wie eine Herde
  rationale: כְּ markiert den Vergleich; צֹאן ist eine Sammelbezeichnung für Kleinvieh, besonders Schafe und Ziegen. „Wie eine Herde“ erhält das kollektive Hirtenbild.
- source_word: עַמֶּךָ
  choice: dein Volk
  rationale: עַם bezeichnet hier Gottes Volk Israel. „Dein Volk“ ist im Deutschen die natürliche und kontextgerechte Wiedergabe.
- source_word: בְּיַד
  choice: durch
  rationale: Die Wendung בְּיַד („durch die Hand von“) bezeichnet hier Vermittlung beziehungsweise Beauftragung. „Durch“ gibt die Funktion idiomatisch und klar wieder; die wörtliche Form wird in der Fußnote festgehalten.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Mose und Aaron
  rationale: Die Personennamen folgen den etablierten deutschen Bibelnamen.
theological_decisions:
- issue: Das Verhältnis von Gottes Führung und dem Handeln von Mose und Aaron
  choice: Gott ist der unmittelbar angesprochene und primäre Handelnde; Mose und Aaron sind die menschlichen Vermittler seiner Führung.
  alternative: Mose und Aaron lediglich als begleitende historische Bezugspersonen zu verstehen.
  rationale: Das Verb steht in der 2. Person Singular und richtet sich an Gott; בְּיַד מֹשֶׁה וְאַהֲרֹן kennzeichnet Mose und Aaron als die Personen, durch die Gott sein Volk führte. „Durch“ bewahrt beide Ebenen, ohne die göttliche oder menschliche Beteiligung abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist verständlich und flüssig; „Herde“ bewahrt das kollektive Hirtenbild, während die Fußnote die hebräische Wendung zur menschlichen Vermittlung dokumentiert.
