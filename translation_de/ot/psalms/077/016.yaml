id: PSA.77.16
reference: Psalms 77:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רָ֘א֤וּ/ךָ מַּ֨יִם אֱֽלֹהִ֗ים רָא֣וּ/ךָ מַּ֣יִם יָחִ֑ילוּ אַ֝֗ף יִרְגְּז֥וּ תְהֹמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/016.yaml
  text: The waters saw you[a], O God; the waters saw you and writhed[b]; even the depths trembled.
translation:
  language: de
  text: Die Wasser sahen dich, Gott; die Wasser sahen dich und wanden sich[a]; selbst die Tiefen erbebten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gerieten in Qual«, »zuckten« oder »zitterten«. Das hebräische Verb kann krampfartiges Beben oder ein Sich-Winden wie unter Geburtswehen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Mit den »Tiefen« sind die tiefen Wasser oder Meerestiefen gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ
  choice: sahen dich
  rationale: Das Qal-Perfekt von ראה mit Suffix der 2. Person Singular bedeutet unmittelbar »sahen dich«. Die Wiederholung bleibt als poetische Verstärkung erhalten.
- source_word: מַיִם
  choice: die Wasser
  rationale: Der poetische Plural »die Wasser« gibt die personifizierten Wassermassen wieder und bewahrt die Wiederholung des Hebräischen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Stellung nach »dich« lässt eine Anrede erkennen; im Deutschen ist »dich, Gott« natürlich und würdevoll, ohne ein zusätzliches »o« zu benötigen.
- source_word: יָחִילוּ
  choice: wanden sich
  rationale: Das Verb חול/חיל kann krampfartiges Beben, Sich-Winden oder geburtswehenartige Qual ausdrücken. »Wanden sich« bewahrt das körperlich-dynamische Bild und unterscheidet sich vom folgenden Verb des Bebens.
- source_word: אַף
  choice: selbst
  rationale: 'Hier steigert die Partikel die Aussage: Nicht nur die Wasser, sondern selbst die Tiefen reagieren auf Gottes Gegenwart.'
- source_word: יִרְגְּזוּ
  choice: erbebten
  rationale: רגז bezeichnet Zittern, Beben oder Erschüttertwerden. »Erbebten« ist im poetischen Register verständlich und vermeidet eine Einebnung mit יָחִילוּ.
- source_word: תְהֹמוֹת
  choice: die Tiefen
  rationale: Der Plural von תהום bezeichnet tiefe Wasser beziehungsweise Meerestiefen. »Die Tiefen« ist gegenwärtiges, natürliches Deutsch und erhält die kosmische Wasserbildwelt.
theological_decisions:
- issue: Personifizierung der kosmischen Wasser vor Gott
  choice: Die poetische Personifizierung der Wasser und Tiefen als auf Gottes Gegenwart reagierend bleibt bestehen.
  alternative: Den Vers ausschließlich als direkte Anspielung auf den Durchzug durch das Schilfmeer oder als Kampf gegen mythische Meeresmächte auslegen.
  rationale: Der hebräische Text schildert, wie die Schöpfungswasser vor Gott zurückschrecken. Die Übersetzung erhält dieses Bild, ohne mögliche heilsgeschichtliche oder altorientalische Bezüge in den Wortlaut hineinzulesen.
translation_notes:
  register: Moderne, würdige Psalmenpoesie mit bewahrter Parallelstruktur. Die zweimalige Nennung der Wasser und die Abstufung von »wanden sich« zu »erbebten« spiegeln die hebräische Bildkraft und vermeiden unnötige interpretative Festlegung.
