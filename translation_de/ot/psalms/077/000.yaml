  text: לַ/מְנַצֵּ֥חַ עַֽל ידיתון לְ/אָסָ֥ף מִזְמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/000.yaml
  text: 'For the choir director: according to Jeduthun[d][c][b][a]. A psalm of Asaph.'
translation:
  language: de
  text: 'Für den Chorleiter: nach Jedutun[a][b]. Ein Psalm Asafs[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für den Musikleiter“ beziehungsweise „Dem leitenden Musiker“.'
    reason: lexical_alternative
  - marker: b
    text: „Nach Jedutun“ kann eine Melodie, eine musikalische Aufführungsweise, ein Ensemble oder die mit Jedutun verbundene Sängergruppe bezeichnen.
    reason: cultural_note
  - marker: c
    text: 'Oder: „Ein Psalm für Asaf“. Die hebräische Präposition kann Urheberschaft, Zugehörigkeit oder Bestimmung ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Die Form bezeichnet in Psalmüberschriften wahrscheinlich den Leiter der musikalischen Aufführung. „Chorleiter“ ist modern, verständlich und funktional, ohne die genaue historische Aufgabe zu eng festzulegen.
- source_word: עַל
  choice: nach
  rationale: In musikalischen Überschriften kann עַל eine Melodie, Aufführungsweise, Gruppe oder Zuordnung einführen. Das knappe deutsche „nach“ bewahrt diese offene musikalische Bezugnahme.
- source_word: יְדוּתוּן
  choice: Jedutun
  rationale: Der Personen- beziehungsweise Gruppenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: לְאָסָף
  choice: Asafs
  rationale: Der hebräische Ausdruck kann Urheberschaft, Zugehörigkeit oder Bestimmung bezeichnen. Der deutsche Genitiv ist natürlich, lässt die genaue Art der Beziehung aber offen.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: „Psalm“ ist die etablierte und sachlich passende deutsche Bezeichnung dieser musikalisch-poetischen Gattung.
theological_decisions:
- issue: Beziehung des Psalms zu Asaf
  choice: Ein Psalm Asafs
  alternative: Ein Psalm für Asaf
  rationale: Die Präposition לְ legt nicht eindeutig fest, ob Asaf Verfasser, Empfänger oder Namensgeber einer Tradition beziehungsweise Gruppe ist. Die Hauptfassung folgt der geläufigen knappen Form; eine Fußnote wahrt die Mehrdeutigkeit.
translation_notes:
  register: Moderne, würdige Sprache einer knappen Psalmüberschrift. Die traditionelle Gattungsbezeichnung „Psalm“ bleibt erhalten; historisch unsichere musikalische Angaben und die Beziehung zu Asaf werden nicht vereindeutigt.
