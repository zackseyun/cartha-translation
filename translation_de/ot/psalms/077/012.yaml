base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/012.yaml
  text: I will meditate on all your work[a], and I will ponder your deeds.
translation:
  language: de
  text: Ich will über all dein Wirken nachsinnen[a] und über deine Taten nachdenken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von all deinem Wirken reden“. Das hebräische Verb kann sowohl sinnendes Nachdenken als auch Reden bezeichnen; der Parallelismus legt hier eher den betrachtenden Sinn nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָגִיתִי
  choice: Ich will … nachsinnen
  rationale: Das Qal in der 1. Person Singular von הגה bezeichnet hier ein sinnendes, betrachtendes Nachdenken. Im poetischen Zusammenhang mit אָשִׂיחָה gibt „ich will“ die volitive beziehungsweise zukunftsgerichtete Nuance natürlich wieder.
- source_word: בְכָל
  choice: über all
  rationale: ב bezeichnet bei Verben des Denkens oder Redens den Gegenstand der Betrachtung; im Deutschen ist „über … nachsinnen“ idiomatisch.
- source_word: פָעֳלֶךָ
  choice: dein Wirken
  rationale: פֹּעַל kann Werk, Tun oder Wirken bezeichnen. „Wirken“ wahrt den kollektiven Singular und unterscheidet sich poetisch vom folgenden Plural „Taten“.
- source_word: וּבַעֲלִילוֹתֶיךָ
  choice: über deine Taten
  rationale: עֲלִילָה bezeichnet eine Tat oder Handlung. „Taten“ ist klar und fügt keine im Wort selbst nicht ausdrücklich enthaltene Wertung wie „machtvolle“ hinzu.
- source_word: אָשִׂיחָה
  choice: nachdenken
  rationale: שיח kann sinnendes Nachdenken, Meditieren oder auch Reden bezeichnen. „Nachdenken“ passt zum reflektierenden Parallelismus, während die mögliche Bedeutung „reden“ in der Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Verben „nachsinnen“ und „nachdenken“ bewahren die semantische Nähe, ohne eintönig zu wirken; „Wirken“ und „Taten“ erhalten die poetische Variation des Hebräischen.
