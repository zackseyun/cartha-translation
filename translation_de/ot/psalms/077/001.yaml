  text: Meine Stimme ruft zu Gott, und ich schreie; meine Stimme ruft zu Gott, und er hört mir zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, als Bitte verstanden: »möge er mir zuhören«. Das hebräische Verb bezeichnet aufmerksames Hinhören.'
