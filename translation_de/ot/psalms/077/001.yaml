lexical_decisions:
- source_word: קוֹלִי אֶל אֱלֹהִים
  choice: Meine Stimme ruft zu Gott
  rationale: Die verblosen Worte bedeuten wörtlich »meine Stimme zu Gott«. Das ergänzte »ruft« ergibt natürliches Deutsch, bewahrt die Stimme als Satzgegenstand und erhält die zweimalige Parallelformel.
- source_word: וְאֶצְעָקָה
  choice: und ich schreie
  rationale: צעק bezeichnet einen eindringlichen Hilferuf. Die poetische Form wird als lebendige gegenwärtige Aussage wiedergegeben.
- source_word: וְהַאֲזִין אֵלָי
  choice: und er hört aufmerksam auf mich
  rationale: אזן bezeichnet aufmerksames Hinhören; אֵלַי ist die Richtungsangabe »auf/zu mir«. Die Form kann im Kontext als gegenwärtige Aussage verstanden werden.
theological_decisions:
- issue: Gottes Reaktion im zweiten Halbvers
  choice: Der Vers sagt aus, dass Gott dem Beter aufmerksam zuhört.
  alternative: »damit er auf mich hört« oder »möge er auf mich hören«
  rationale: Die überlieferte Verbform lässt sich am unmittelbarsten deklarativ auf Gott beziehen. Die Übersetzung macht daraus weder bloßes akustisches Hören noch löst sie die Aussage in eine Bitte auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »Meine Stimme … zu Gott« wahrt den hebräischen Parallelismus; »ruft« wird idiomatisch ergänzt. »Ich schreie« behält die Dringlichkeit des Hilferufs bei.
