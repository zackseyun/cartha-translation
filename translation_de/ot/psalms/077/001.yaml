- from: Meine Stimme ruft zu Gott, und ich schreie; meine Stimme ruft zu Gott, und er hört aufmerksam auf mich.[a]
  to: Meine Stimme ruft zu Gott, und ich schreie; meine Stimme ruft zu Gott, und er hört mir zu.[a]
