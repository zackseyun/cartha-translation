  text: The clouds poured out water; the skies gave forth a sound; indeed[a], your arrows moved about.
translation:
  language: de
  text: 'Die Wolken ergossen Wasser,

    die Himmel erhoben ihre Stimme;

    ja, deine Pfeile flogen hin und her.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ja, deine Blitze zuckten umher.« Im Hebräischen steht wörtlich »deine Pfeile«; im Zusammenhang dieser Gotteserscheinung im Sturm sind damit wahrscheinlich Blitze gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרְמוּ מַיִם עָבוֹת
  choice: Die Wolken ließen Wasser strömen
  rationale: Die hebräische Verbform bezeichnet kräftiges Strömen oder Fließen. Die deutsche Fassung stellt das Subjekt voran und gibt den ergiebigen Wasserstrom natürlich wieder, ohne ausdrücklich bereits von Regen zu sprechen.
- source_word: קוֹל נָתְנוּ
  choice: ließen ihre Stimme hören
  rationale: Wörtlich steht »gaben eine Stimme/einen Laut«. Die gewählte deutsche Wendung bewahrt die Personifikation und deutet den Laut nicht vorschnell ausdrücklich als Donner.
- source_word: שְׁחָקִים
  choice: die Himmel
  rationale: Das Wort kann den Himmel oder Wolken bezeichnen. »Die Himmel« erhält den Unterschied zu עָבוֹת (»Wolken«) und die poetische Parallelität; der Plural spiegelt die hebräische Form.
- source_word: אַף
  choice: ja
  rationale: Die Partikel verstärkt die abschließende Aussage. »Ja« wirkt im Deutschen poetisch und nachdrücklich, ohne eine zusätzliche logische Beziehung festzulegen.
- source_word: חֲצָצֶיךָ
  choice: deine Pfeile
  rationale: Das Substantiv bezeichnet unmittelbar »Pfeile«, die im Zusammenhang der Sturm-Theophanie bildhaft Blitze meinen können. Das Bild bleibt im Haupttext erhalten.
- source_word: יִתְהַלָּכוּ
  choice: flogen hin und her
  rationale: Die Hitpael-Form beschreibt Bewegung in verschiedene Richtungen oder ein Umhergehen. Bei Pfeilen ist »flogen hin und her« natürlich und hält die lebhafte, wiederholte Bewegung fest, ohne im Haupttext ausdrücklich »Blitze« einzusetzen.
theological_decisions:
- issue: 'Bildsprache der Gotteserscheinung: Pfeile oder Blitze'
  choice: Im Haupttext steht »deine Pfeile«; die mögliche Deutung als Blitze wird in einer Fußnote genannt.
  alternative: Direkt »deine Blitze zuckten umher« übersetzen.
  rationale: Der hebräische Ausdruck bedeutet konkret »deine Pfeile«, während der Sturmzusammenhang stark auf Blitze als bildhafte Bedeutung weist. Die Hauptfassung wahrt das poetische Gotteskrieger-Bild und die Fußnote macht die wahrscheinliche meteorologische Referenz transparent.
translation_notes:
  register: Moderne, würdige Psalmensprache mit klarer Dreizeilenstruktur. Die Personifikation »ihre Stimme hören« und das Bild der göttlichen »Pfeile« bleiben erhalten; unnötig altertümliche Wörter werden vermieden.
