id: PSA.77.14
reference: Psalms 77:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַתָּ֣ה הָ֭/אֵל עֹ֣שֵׂה פֶ֑לֶא הוֹדַ֖עְתָּ בָ/עַמִּ֣ים עֻזֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/014.yaml
  text: You are the God who works wonders[b][a]; you have made your strength known among the peoples.
translation:
  language: de
  text: Du bist der Gott, der Wunder tut; du hast unter den Völkern[a] deine Stärke[b] bekannt gemacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter den Nationen“. Das hebräische Wort kann allgemein Völker oder Nationen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deine Macht“ oder „deine Kraft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: der Gott
  rationale: 'Der Artikel hebt Gott bestimmend hervor. „Der Gott“ bewahrt die emphatische Aussage: Du bist der Gott, der so handelt.'
- source_word: עֹשֵׂה
  choice: der … tut
  rationale: Das Partizip bezeichnet Gottes charakteristisches Handeln. Der Relativsatz ist im Deutschen natürlich und erhält diesen beschreibenden Sinn.
- source_word: פֶלֶא
  choice: Wunder
  rationale: Das hebräische Singularwort kann hier kollektiv außergewöhnliche, staunenswerte Taten bezeichnen. Der deutsche Plural ist idiomatisch und weniger einengend als „Mirakel“.
- source_word: הוֹדַעְתָּ
  choice: du hast … bekannt gemacht
  rationale: 'Der Hifil von ידע hat kausativen Sinn: jemanden wissen lassen beziehungsweise etwas bekannt machen. Das Perfekt passt zum rückblickenden Lob des Psalms.'
- source_word: בָעַמִּים
  choice: unter den Völkern
  rationale: Die Präposition ב wird räumlich beziehungsweise im Bereich einer Gruppe als „unter“ wiedergegeben. עַמִּים bezeichnet mehrere Völker und kann je nach Zusammenhang auch mit „Nationen“ übersetzt werden.
- source_word: עֻזֶּךָ
  choice: deine Stärke
  rationale: עֹז bezeichnet Stärke, Macht oder Kraft. „Stärke“ ist direkt, verständlich und lässt die genaue Ausprägung der göttlichen Macht offen.
theological_decisions:
- issue: Reichweite der Offenbarung von Gottes Stärke in בָעַמִּים
  choice: unter den Völkern
  alternative: unter den Nationen; den Völkern
  rationale: Die Formulierung stellt Gottes Stärke als öffentlich unter mehreren Völkern erwiesen dar. Sie bewahrt die Präposition und den weiten Bezug, ohne ein bestimmtes theologisches Programm hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die direkte Anrede bleiben erhalten; das Semikolon bildet die zweigliedrige hebräische Aussage ab.
