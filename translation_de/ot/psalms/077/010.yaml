  text: וָ֭/אֹמַר חַלּ֣וֹתִ/י הִ֑יא שְׁ֝נ֗וֹת יְמִ֣ין עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/010.yaml
  text: 'Then I said[b][a], “This is my grief: the years of the right hand of the Most High.”'
translation:
  language: de
  text: 'Da sagte ich: »Das ist mein Leiden[a]: die Jahre[b] der rechten Hand des Höchsten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Schwäche« beziehungsweise »meine Krankheit«. Das hebräische Wort ist schwierig und kann Leiden, Schwäche oder Krankheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder insgesamt: »Das ist mein Schmerz: Die rechte Hand des Höchsten hat sich verändert.« Das hebräische Wort, das im Haupttext mit »Jahre« wiedergegeben wird, kann hier auch als »Veränderung« verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Da sagte ich
  rationale: Das Wayyiqtol führt die Aussage des Psalmisten als nächsten Schritt seines Gedankengangs ein; „Da sagte ich“ klingt natürlich und bewahrt die erzählerische Wendung.
- source_word: חַלּוֹתִי
  choice: mein Leiden
  rationale: Die schwierige Form kann Krankheit, Schwäche oder Bedrängnis bezeichnen. „Mein Leiden“ ist im Klagekontext verständlich, ohne die Bedeutung unnötig auf körperliche Krankheit oder bloße Trauer einzuengen.
- source_word: הִיא
  choice: Das ist
  rationale: Das Pronomen weist wahrscheinlich auf den zuvor beschriebenen Zustand beziehungsweise die folgende Erkenntnis zurück. „Das ist“ bildet diesen deiktischen Bezug idiomatisch ab.
- source_word: שְׁנוֹת
  choice: die Jahre
  rationale: Die naheliegende Ableitung ist von שָׁנָה „Jahr“. Die ebenfalls vertretene Deutung im Sinn von „Veränderung“ wird wegen der tatsächlichen Mehrdeutigkeit in einer Fußnote bewahrt.
- source_word: יְמִין
  choice: der rechten Hand
  rationale: Die wörtliche Bildsprache bezeichnet in biblischer Dichtung häufig Macht und rettendes Handeln; sie bleibt im Deutschen verständlich und theologisch offen.
- source_word: עֶלְיוֹן
  choice: des Höchsten
  rationale: „Der Höchste“ ist die etablierte und sachgerechte Wiedergabe dieses göttlichen Titels.
theological_decisions:
- issue: Deutung des syntaktisch und lexikalisch schwierigen Verses
  choice: Der Haupttext versteht den Psalmisten so, dass er sein gegenwärtiges Leiden den Jahren des machtvollen Handelns des Höchsten gegenüberstellt beziehungsweise damit in Beziehung setzt.
  alternative: '„Da sagte ich: Das ist mein Schmerz: Die rechte Hand des Höchsten hat sich verändert.“'
  rationale: Besonders חַלּוֹתִי und שְׁנוֹת lassen mehrere Deutungen zu. Der Haupttext folgt der morphologisch naheliegenden Lesart „Jahre“, während die gewichtige Lesart „Veränderung“ ausdrücklich in der Fußnote erhalten bleibt; so wird die theologische Spannung nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Wendung „rechte Hand des Höchsten“ bleibt erhalten; die notorische Mehrdeutigkeit des Hebräischen wird durch knappe Fußnoten transparent gemacht.
