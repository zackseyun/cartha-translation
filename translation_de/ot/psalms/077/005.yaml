  text: חִשַּׁ֣בְתִּי יָמִ֣ים מִ/קֶּ֑דֶם שְׁ֝נ֗וֹת עוֹלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/005.yaml
  text: I considered the days of old[a], the years of ages past.
translation:
  language: de
  text: 'Ich dachte nach über die Tage der Vorzeit,

    über die Jahre längst vergangener Zeiten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über die Jahre uralter Zeiten“. Das hebräische Wort עוֹלָמִים bezeichnet hier wahrscheinlich die ferne Vergangenheit, nicht notwendig die Ewigkeit im absoluten Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִשַּׁבְתִּי
  choice: Ich dachte nach über
  rationale: Das Verb חשׁב bezeichnet hier ein bewusstes Nachdenken oder Erwägen. „Ich dachte nach über“ klingt im modernen Deutsch natürlich und beschränkt die Aussage nicht auf bloßes Erinnern.
- source_word: יָמִים
  choice: die Tage
  rationale: Die Grundbedeutung ist „Tage“; der bestimmte Artikel ergibt sich im Deutschen natürlich durch die nähere Bestimmung „der Vorzeit“.
- source_word: מִקֶּדֶם
  choice: der Vorzeit
  rationale: קדם mit der Präposition מִן verweist auf weit zurückliegende, frühere Zeit. „Der Vorzeit“ bewahrt die knappe poetische Form und den Gedanken hohen Alters.
- source_word: שְׁנוֹת
  choice: die Jahre
  rationale: Die Konstruktform des Plurals von „Jahr“ wird entsprechend der parallelen ersten Zeile mit bestimmtem Artikel wiedergegeben.
- source_word: עוֹלָמִים
  choice: längst vergangener Zeiten
  rationale: עוֹלָמִים kann lange Zeiträume, fernste Vergangenheit oder Ewigkeit bezeichnen. Im Parallelismus mit „Tage der Vorzeit“ liegt hier die ferne Vergangenheit nahe; die Übersetzung wahrt zeitliche Weite, ohne absolute Ewigkeit zu behaupten.
theological_decisions:
- issue: Zeitbedeutung von עוֹלָמִים
  choice: ferne Vergangenheit („längst vergangener Zeiten“)
  alternative: Ewigkeit beziehungsweise ewige Zeiten
  rationale: Der poetische Parallelismus mit מִקֶּדֶם und die Verbindung mit „Jahre“ sprechen in diesem Zusammenhang für weit zurückliegende Zeiten. Die grundsätzlich weitere Bedeutungsbreite des Wortes wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Parallelismus. Die Wiederholung von „über“ macht den Satzfluss klar; „Vorzeit“ und „längst vergangene Zeiten“ bewahren die feierliche zeitliche Weite des Hebräischen.
