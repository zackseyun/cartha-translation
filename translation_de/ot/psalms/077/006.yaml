  text: אֶֽזְכְּרָ֥ה נְגִינָתִ֗/י בַּ֫/לָּ֥יְלָה עִם לְבָבִ֥/י אָשִׂ֑יחָה וַ/יְחַפֵּ֥שׂ רוּחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/006.yaml
  text: I remember my song in the night[a]; with my heart I meditate[d][c][b], and my spirit searches.
translation:
  language: de
  text: Ich denke in der Nacht an mein Lied[a]; in meinem Herzen sinne ich nach[b], und mein Geist[c] sucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an meine Melodie« beziehungsweise »an mein Saitenspiel«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann inneres Nachsinnen, ein Selbstgespräch oder klagendes Reden bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Hier im Sinn des inneren Selbst; auch: »mein Inneres« oder »mein Sinn«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: Ich denke … an
  rationale: Das Qal-Imperfekt der 1. Person Singular kann in der poetischen Rede gegenwärtige, zukünftige oder volitive Bedeutung haben. Der präsentische Ausdruck gibt hier die fortdauernde innere Rückschau natürlich wieder.
- source_word: נְגִינָתִי
  choice: mein Lied
  rationale: נְגִינָה bezeichnet ein Lied beziehungsweise instrumentale Musik. „Mein Lied“ ist im Deutschen idiomatisch und bewahrt den poetischen Bezug.
- source_word: בַּלָּיְלָה
  choice: in der Nacht
  rationale: Die Wendung folgt dem Hebräischen eng und erhält den poetischen Klang.
- source_word: עִם לְבָבִי אָשִׂיחָה
  choice: in meinem Herzen sinne ich nach
  rationale: Wörtlich steht „mit meinem Herzen“, doch die Verbindung bezeichnet hier ein inneres Selbstgespräch beziehungsweise Nachsinnen. Die deutsche Fassung gibt diese Funktion natürlich wieder, ohne einen äußeren Gesprächspartner anzunehmen.
- source_word: וַיְחַפֵּשׂ
  choice: forscht
  rationale: Das Verb חפשׂ bezeichnet gründliches Suchen oder Erforschen. Trotz der waw-präfigierten Form passt im poetischen Gedankengang ein deutsches Präsens; das fehlende Objekt bleibt wie im Hebräischen offen.
- source_word: רוּחִי
  choice: mein Geist
  rationale: רוּחַ bezeichnet hier das innere Selbst des Beters, nicht Wind oder Atem. „Geist“ bewahrt die Bedeutungsbreite besser als eine Einengung auf den Verstand.
theological_decisions:
- issue: Verhältnis von Herz und Geist als Bezeichnungen des inneren Menschen
  choice: Beide hebräischen Begriffe werden unterschieden als „Herz“ und „Geist“ wiedergegeben.
  alternative: Beide vereinheitlichend als „Inneres“ oder „Gedanken“ wiedergeben.
  rationale: Der Parallelismus beschreibt die innere Reflexion mit zwei verschiedenen anthropologischen Begriffen. Die Übersetzung bewahrt diese Spannung, ohne daraus eine feste Lehre über getrennte Bestandteile des Menschen abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzstruktur. „In meinem Herzen“ gibt die hebräische Wendung עִם לְבָבִי idiomatisch wieder; „forscht“ lässt wie der Ausgangstext offen, wonach der Geist sucht.
