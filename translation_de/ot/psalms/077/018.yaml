  text: ק֤וֹל רַעַמְ/ךָ֨ בַּ/גַּלְגַּ֗ל הֵאִ֣ירוּ בְרָקִ֣ים תֵּבֵ֑ל רָגְזָ֖ה וַ/תִּרְעַ֣שׁ הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/018.yaml
  text: The sound of your thunder was in the whirlwind[a]; lightning lit up the world; the earth trembled and quaked.
translation:
  language: de
  text: Dein Donner dröhnte im Wirbelsturm[a]; Blitze erhellten die Welt; die Erde bebte und erzitterte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Rad«; das hebräische Wort bezeichnet wörtlich ein Rad oder etwas Rollendes und meint hier wahrscheinlich einen wirbelnden Sturm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל רַעַמְךָ
  choice: Dein Donner dröhnte
  rationale: קול bezeichnet »Stimme« oder »Schall«. Die verbale Wiedergabe »dröhnte« ist im Deutschen natürlich, bewahrt den akustischen Eindruck und vermeidet die schwerfällige Formulierung »der Schall deines Donners war«.
- source_word: בַּגַּלְגַּל
  choice: im Wirbelsturm
  rationale: גלגל bezeichnet wörtlich ein Rad oder etwas Rollendes; im meteorologischen Zusammenhang liegt ein wirbelnder Sturm nahe. »Wirbelsturm« erhält sowohl den Sturmkontext als auch das Bild kreisender Bewegung.
- source_word: הֵאִירוּ בְרָקִים
  choice: Blitze erhellten
  rationale: Der Hifil von אור bedeutet »Licht geben, erhellen«. Das pluralische ברקים wird mit dem natürlichen deutschen Plural »Blitze« wiedergegeben.
- source_word: תֵּבֵל
  choice: die Welt
  rationale: תבל bezeichnet die Welt beziehungsweise den bewohnten Erdkreis. »Die Welt« ist hier knapp, verständlich und dem kosmischen Zusammenhang angemessen.
- source_word: רָגְזָה
  choice: bebte
  rationale: Das Verb bezeichnet heftige Bewegung, Erregung oder Zittern. »Bebte« passt zum Erdbild und lässt sich vom folgenden Verb unterscheiden.
- source_word: וַתִּרְעַשׁ הָאָרֶץ
  choice: die Erde … erzitterte
  rationale: רעש bezeichnet Erschüttern oder Beben. »Erzitterte« bewahrt gemeinsam mit »bebte« die poetische Intensivierung durch zwei verschiedene Verben; הארץ meint in dieser kosmischen Theophanie die Erde.
