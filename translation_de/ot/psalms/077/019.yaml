base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/019.yaml
  text: Your way was through the sea[a], and your paths through many waters[b], yet your footprints were not known.
translation:
  language: de
  text: Dein Weg führte durch das Meer[a], deine Pfade durch gewaltige Wasser; doch deine Spuren[b] blieben unbekannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Meer … in gewaltigen Wassern“. Die hebräische Präposition kann einen Ort bezeichnen; zusammen mit „Weg“ liegt hier jedoch die Bewegung durch die Wasser nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Fußspuren“ oder „Tritte“. Der folgende Ausdruck kann auch mit „wurden nicht erkannt“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּם
  choice: durch das Meer
  rationale: Die Präposition בְּ bezeichnet häufig einen Ort („im“), kann hier zusammen mit „Weg“ aber den Bereich ausdrücken, durch den die Bewegung verläuft. „Durch das Meer“ gibt dieses Wegmotiv im poetischen Zusammenhang natürlich wieder.
- source_word: דַּרְכֶּךָ
  choice: dein Weg
  rationale: דֶּרֶךְ bezeichnet einen Weg oder eine Straße und kann zugleich bildlich die Art des Handelns meinen. „Weg“ bewahrt diese doppelte Resonanz.
- source_word: שביליך
  choice: deine Pfade
  rationale: שְׁבִיל bezeichnet einen Pfad oder eine Spur. „Pfade“ steht in natürlicher poetischer Parallele zu „Weg“.
- source_word: בְּמַיִם רַבִּים
  choice: durch gewaltige Wasser
  rationale: רַבִּים kann bei Wassermassen sowohl deren Vielzahl als auch ihre Größe oder Mächtigkeit bezeichnen. „Gewaltige Wasser“ klingt im Deutschen idiomatisch und bewahrt die Steigerung des ersten Versglieds.
- source_word: עִקְּבוֹתֶיךָ
  choice: deine Spuren
  rationale: Das Substantiv kann Fußspuren, Tritte oder zurückgelassene Spuren bezeichnen. „Spuren“ erhält das Bild, ohne Gottes Handeln unnötig körperlich festzulegen.
- source_word: לֹא נֹדָעוּ
  choice: blieben unbekannt
  rationale: 'Der Nifal von ידע ist passiv: Die Spuren wurden nicht bekannt beziehungsweise nicht erkannt. „Blieben unbekannt“ ist im Deutschen natürlich und lässt offen, ob sie unsichtbar, nicht erkennbar oder nicht nachzuverfolgen waren.'
theological_decisions:
- issue: Grad der ausdrücklichen Zuordnung zur Exodus-Erzählung
  choice: Das poetische Bild von Gottes Weg durch das Meer bleibt ohne ausdrückliche Nennung des Auszugs oder des Schilfmeers stehen.
  alternative: Den Vers im Haupttext ausdrücklich auf den Durchzug beim Exodus beziehen.
  rationale: Der Vers ruft die Rettung durch die Wasser deutlich in Erinnerung, benennt das geschichtliche Ereignis hier aber nicht ausdrücklich. Die bildhafte Form bewahrt die Spannung zwischen Gottes wirklichem Handeln und seinen für Menschen nicht nachzuverfolgenden Spuren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. „Führte“ wird nur im ersten Versglied ausgesprochen und im zweiten sinngemäß ergänzt. Das adversative „doch“ macht den Kontrast zwischen Gottes machtvollem Weg und den unbekannt bleibenden Spuren natürlich sichtbar.
