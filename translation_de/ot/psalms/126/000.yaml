source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת בְּ/שׁ֣וּב יְ֭הוָה אֶת שִׁיבַ֣ת צִיּ֑וֹן הָ֝יִ֗ינוּ כְּ/חֹלְמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/000.yaml
  text: A Song of Ascents. When Yahweh restored the fortunes of Zion[a], we were like those who dream.
translation:
  language: de
  text: Ein Wallfahrtslied. Als Jahwe Zions Geschick wiederherstellte[a], waren wir wie Träumende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zions Verschleppte zurückbrachte« beziehungsweise »Zions Gefangenschaft wendete«. Der hebräische Ausdruck kann sich konkret auf die Rückkehr aus dem Exil oder allgemeiner auf die Wiederherstellung des Geschicks beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die Überschrift bezeichnet ein Lied der »Aufstiege«; »Wallfahrtslied« gibt im Deutschen die wahrscheinlich gemeinte Pilgerreise hinauf nach Jerusalem natürlich wieder.
- source_word: בְּשׁוּב יְהוָה
  choice: Als Jahwe … wiederherstellte
  rationale: Die Präposition mit Infinitiv wird zeitlich wiedergegeben. Der Gottesname יהוה bleibt als »Jahwe« erkennbar.
- source_word: שִׁיבַת צִיּוֹן
  choice: Zions Geschick
  rationale: Die feste Wendung kann eine Wiederherstellung des Geschicks oder konkret die Rückkehr der Verschleppten bezeichnen; die Hauptübersetzung bewahrt die weitere Bedeutung, die Fußnote nennt die konkretere Möglichkeit.
- source_word: כְּחֹלְמִים
  choice: wie Träumende
  rationale: Die substantivische Form wird knapp und bildhaft wiedergegeben und lässt offen, ob Staunen, Unwirklichkeit oder freudiges Erleben im Vordergrund steht.
theological_decisions:
- issue: Bedeutung der Wiederherstellung Zions
  choice: Allgemeine Wiederherstellung von Zions Geschick im Haupttext
  alternative: Rückführung der Gefangenen beziehungsweise Verschleppten Zions
  rationale: Der hebräische Ausdruck lässt sowohl eine konkrete Rückkehr aus dem Exil als auch eine umfassendere Wende des Geschicks zu; diese Spannung wird nicht dogmatisch aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Wallfahrtslied« ist für heutige Leser verständlicher als das wörtlichere »Lied der Aufstiege«; »Träumende« erhält die poetische Kürze des Hebräischen.
