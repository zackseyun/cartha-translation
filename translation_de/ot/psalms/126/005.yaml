  text: הַ/זֹּרְעִ֥ים בְּ/דִמְעָ֗ה בְּ/רִנָּ֥ה יִקְצֹֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/005.yaml
  text: Those who sow in tears will reap with joyful shouting[a].
translation:
  language: de
  text: Die unter Tränen säen, werden mit Jubelrufen ernten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter Jubel“. Das hebräische Wort רִנָּה kann lautes, freudiges Rufen bezeichnen und auch den Sinn jubelnden Gesangs einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזֹּרְעִים
  choice: Die … säen
  rationale: Das substantivierte Partizip mit Artikel bezeichnet allgemein eine Gruppe von Menschen. Die deutsche Konstruktion „Die … säen“ gibt diesen generischen Plural natürlich wieder.
- source_word: בְּדִמְעָה
  choice: unter Tränen
  rationale: Die Präposition ב mit dem Singular „Träne/Weinen“ beschreibt die Begleitumstände oder Art des Säens. „Unter Tränen“ ist im Deutschen idiomatisch und bewahrt das Bild.
- source_word: בְּרִנָּה
  choice: mit Jubelrufen
  rationale: רִנָּה bezeichnet einen lauten, freudigen Jubelruf und kann auch jubelnden Gesang einschließen. „Mit Jubelrufen“ erhält den hörbaren, ausgelassenen Charakter, ohne den Ausdruck auf Gesang zu verengen.
- source_word: יִקְצֹרוּ
  choice: werden … ernten
  rationale: Das Imperfekt drückt hier das künftige Ergebnis aus. „Werden … ernten“ ist verständlich und bewahrt die landwirtschaftliche Entsprechung zu „säen“.
theological_decisions: []
