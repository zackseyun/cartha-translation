  text: הָ֘ל֤וֹךְ יֵלֵ֨ךְ וּ/בָכֹה֮ נֹשֵׂ֪א מֶֽשֶׁךְ הַ֫/זָּ֥רַע בֹּֽ֬א יָב֥וֹא בְ/רִנָּ֑ה נֹ֝שֵׂ֗א אֲלֻמֹּתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/006.yaml
  text: He surely goes out weeping[a], carrying the seed for sowing; he will surely come in with joyful shouting[b], carrying his sheaves.
translation:
  language: de
  text: Er geht gewiss weinend hinaus und trägt die Saat zur Aussaat[a]; gewiss wird er mit Jubel[b] kommen und seine Garben tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weinend geht er seines Weges und trägt den Saatbeutel.“ Die hebräische Wendung, die hier mit „die Saat zur Aussaat“ wiedergegeben wird, ist schwer zu deuten; manche verstehen sie konkreter als Saatbeutel oder Saatvorrat.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit Gesang“, „mit Freudenrufen“ oder „mit Freude“. Das hebräische Wort bezeichnet einen hörbaren Ausdruck der Freude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ יֵלֵךְ
  choice: geht er hinaus
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage. Die nachdrückliche Gewissheit wird im Deutschen im Zusammenspiel mit dem parallelen „wird er heimkehren“ natürlich wiedergegeben; „hinaus“ passt zum Gang aufs Feld.
- source_word: וּבָכֹה
  choice: weinend
  rationale: Der Infinitiv beschreibt adverbial, auf welche Weise der Sämann hinausgeht.
- source_word: נֹשֵׂא
  choice: trägt
  rationale: Das Partizip bezeichnet eine begleitende Handlung; „trägt“ ist schlicht und präzise.
- source_word: מֶשֶׁךְ הַזָּרַע
  choice: die Saat zum Säen
  rationale: Die schwierige Wendung bezeichnet im Kontext das zum Aussäen mitgeführte Saatgut, ohne die umstrittene Bedeutung von מֶשֶׁךְ vorschnell auf „Saatbeutel“ oder „Saatvorrat“ festzulegen.
- source_word: בֹּא יָבֹא
  choice: wird er heimkehren
  rationale: Infinitivus absolutus und finites Verb drücken Nachdruck und Gewissheit aus. „Heimkehren“ bildet einen natürlichen Gegenpol zu „hinausgehen“ und bezeichnet die Rückkehr vom Feld.
- source_word: בְרִנָּה
  choice: mit Jubel
  rationale: רִנָּה bezeichnet einen hörbaren Freudenruf oder jubelnden Gesang; „Jubel“ wahrt diese Bandbreite knapp und idiomatisch.
- source_word: אֲלֻמֹּתָיו
  choice: seine Garben
  rationale: Das Wort bezeichnet die gebundenen Bündel der Ernte; „Garben“ ist der genaue landwirtschaftliche Ausdruck.
