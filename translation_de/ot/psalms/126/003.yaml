  text: הִגְדִּ֣יל יְ֭הוָה לַ/עֲשׂ֥וֹת עִמָּ֗/נוּ הָיִ֥ינוּ שְׂמֵחִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/003.yaml
  text: Yahweh has done great things for us[a]; we were glad.
translation:
  language: de
  text: Jahwe hat Großes für uns getan[a]; wir waren voller Freude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Jahwe hat Großes mit uns getan.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגְדִּיל לַעֲשׂוֹת
  choice: hat Großes getan
  rationale: Die Verbindung aus Hifil von גדל und dem Infinitiv עשה ist eine hebräische Wendung für das Vollbringen großer Dinge. „Hat Großes getan“ gibt sie im Deutschen idiomatisch, knapp und poetisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עִמָּנוּ
  choice: für uns
  rationale: עם bedeutet formal „mit“, trägt hier in der Wendung jedoch einen benefaktiven Sinn. Natürliches Deutsch verlangt „für uns“; die wörtlichere Möglichkeit bleibt in einer Fußnote erhalten.
- source_word: הָיִינוּ שְׂמֵחִים
  choice: wir waren voller Freude
  rationale: Das Qal-Perfekt von היה mit dem Adjektiv שׂמח beschreibt den damaligen Zustand der Sprechenden. „Voller Freude“ klingt im modernen Deutschen natürlicher und würdevoller als das mögliche, aber schwächere „froh“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit knapper, würdevoller Psalmen-Sprache. Der Satzbau wahrt die Zweigliedrigkeit des hebräischen Verses; die semantische Spannung von עִמָּנוּ zwischen „mit uns“ und dem kontextuell natürlichen „für uns“ wird durch die Fußnote erhalten.
