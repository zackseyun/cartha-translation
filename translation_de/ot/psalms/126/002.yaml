base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/002.yaml
  text: Then our mouth was filled with laughter[a], and our tongue with joyful shouting; then they said among the nations[b], “Yahweh has done great things for them.”
translation:
  language: de
  text: 'Da füllte sich unser Mund mit Lachen und unsere Zunge mit Jubelrufen[a]. Da sagte man unter den Völkern: »Jahwe hat Großes für sie getan[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit Jubel« oder »mit Freudenrufen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: »Jahwe hat Großes getan mit diesen.« Die Wendung bedeutet: Jahwe hat Großes für sie getan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Da
  rationale: Das temporale Adverb knüpft an die in Vers 1 geschilderte Wiederherstellung an; »da« wahrt den poetischen Rückblick und die zeitliche Folge.
- source_word: יִמָּלֵא
  choice: füllte sich
  rationale: Die passive bzw. resultative Form wird im rückblickenden Zusammenhang vergangen wiedergegeben. Die deutsche reflexive Wendung klingt natürlich und erhält das Bild des Erfülltwerdens.
- source_word: שְׂחוֹק
  choice: Lachen
  rationale: Im Parallelismus mit רִנָּה und im Kontext der Wiederherstellung bezeichnet das Wort freudiges, nicht spöttisches Lachen.
- source_word: פִּינוּ
  choice: unser Mund
  rationale: Der kollektive Singular des Hebräischen lässt sich im Deutschen poetisch und verständlich bewahren.
- source_word: וּלְשׁוֹנֵנוּ
  choice: und unsere Zunge
  rationale: Der kollektive Singular wird parallel zu »unser Mund« beibehalten.
- source_word: רִנָּה
  choice: Jubel
  rationale: Das Wort bezeichnet einen hellen, freudigen Ruf und kann auch jubelndes Singen einschließen. »Jubel« wahrt diese Breite knapp und idiomatisch.
- source_word: יֹאמְרוּ
  choice: sagte man
  rationale: Das unbestimmte Pluralsubjekt wird im Deutschen natürlich mit »man« wiedergegeben; der Vergangenheitsbezug folgt dem rückblickenden Kontext.
- source_word: בַגּוֹיִם
  choice: unter den Völkern
  rationale: גּוֹיִם meint hier die umgebenden Nationen beziehungsweise Völker; »Völker« ist im Deutschen klar und nicht unnötig konfessionell geprägt.
- source_word: הִגְדִּיל ... לַעֲשׂוֹת
  choice: hat Großes ... getan
  rationale: Die hebräische Verbindung ist idiomatisch und wird im Deutschen sachgerecht mit »Großes tun« wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: עִם אֵלֶּה
  choice: an ihnen
  rationale: Wörtlich steht »mit diesen«; »Großes an ihnen tun« ist eine natürliche deutsche Wiedergabe der zugunsten dieser Menschen vollbrachten Taten und vermeidet eine unnötige Ergänzung wie »diesen Leuten«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen ausdrücklich. »Jahwe« bewahrt ihn und ersetzt ihn nicht durch einen Titel.
- issue: Zeitbezug von יִמָּלֵא und יֹאמְרוּ
  choice: rückblickende Vergangenheit
  alternative: Zukunft oder vergegenwärtigende Gegenwart
  rationale: Der Zusammenhang blickt auf die erfahrene Wiederherstellung zurück. Die Vergangenheitsform folgt diesem Diskursrahmen, ohne die morphologische Offenheit poetischer Imperfektformen zu leugnen.
- issue: Bedeutung von עִם אֵלֶּה
  choice: 'benefaktiv verstanden: »an ihnen«'
  alternative: 'wörtlicher: »mit diesen«'
  rationale: In Verbindung mit »Großes tun« beschreibt die Wendung Gottes Handeln zugunsten der bezeichneten Menschen. Eine Fußnote bewahrt die ungewöhnlichere hebräische Form.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem poetischem Parallelismus. Der kollektive Singular »unser Mund / unsere Zunge« bleibt erhalten; die ungewöhnliche hebräische Schlusswendung wird idiomatisch übersetzt und in der Fußnote transparent gemacht.
