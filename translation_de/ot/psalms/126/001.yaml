source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת בְּ/שׁ֣וּב יְ֭הוָה אֶת שִׁיבַ֣ת צִיּ֑וֹן הָ֝יִ֗ינוּ כְּ/חֹלְמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/001.yaml
  text: A Song of Ascents. When Yahweh restored the fortunes of Zion[a], we were like those who dream.
translation:
  language: de
  text: Ein Wallfahrtslied. Als Jahwe Zions Geschick wendete[a], waren wir wie Träumende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zions Gefangene zurückbrachte“ beziehungsweise „Zions Gefangenschaft wendete“. Die hebräische Wendung kann speziell die Rückkehr aus dem Exil oder allgemeiner die Wiederherstellung des Geschicks bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die traditionelle Überschrift bezeichnet die Sammlung der Aufstiegslieder. „Wallfahrtslied“ gibt die im Deutschen geläufige Deutung natürlich wieder, ohne im Vers selbst nähere Umstände festzulegen.
- source_word: בְּשׁוּב
  choice: Als ... wendete
  rationale: ב mit dem Infinitivus constructus leitet hier einen temporalen Nebensatz ein. Zusammen mit שִׁיבַת bezeichnet שוב die Wiederherstellung beziehungsweise Wendung eines Zustands.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שִׁיבַת צִיּוֹן
  choice: Zions Geschick
  rationale: Die Wendung kann allgemein die Wiederherstellung des Geschicks oder konkreter die Rückführung aus Gefangenschaft beziehungsweise Exil bezeichnen. „Zions Geschick wenden“ ist im Deutschen idiomatisch und hält den Haupttext bewusst offen.
- source_word: הָיִינוּ
  choice: waren wir
  rationale: Das Qal Perfekt von היה bezeichnet hier einen vergangenen Zustand.
- source_word: כְּחֹלְמִים
  choice: wie Träumende
  rationale: Das Partizip bezeichnet Menschen, die träumen. „Wie Träumende“ bewahrt das Gleichnis knapp und würdevoll.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text enthält das Tetragramm als Eigennamen. „Jahwe“ gibt diesen im modernen Standarddeutsch direkt wieder.
- issue: Bedeutung von שִׁיבַת צִיּוֹן
  choice: Zions Geschick wendete
  alternative: Zions Gefangene zurückbrachte / Zions Gefangenschaft wendete
  rationale: Die hebräische Wendung kann eine umfassende Wiederherstellung oder speziell die Rückkehr aus dem Exil meinen. Der Haupttext lässt diese Spannung bestehen; die Fußnote nennt die engere Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Form bleibt erhalten; „Wallfahrtslied“ ist als etablierte deutsche Bezeichnung der Sammlung verständlich.
