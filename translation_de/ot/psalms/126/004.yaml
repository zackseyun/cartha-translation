source:
  edition: WLC
  text: שׁוּבָ֣/ה יְ֭הוָה אֶת שבות/נו כַּ/אֲפִיקִ֥ים בַּ/נֶּֽגֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/004.yaml
  text: Restore our fortunes[a], O Yahweh[b], like streams in the Negev.
translation:
  language: de
  text: Wende unser Geschick[a], Jahwe, wie die Wasserläufe im Negev[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bring unsere Gefangenen zurück«. Wörtlich: »Bring unsere Gefangenschaft zurück«. Die hebräische Wendung kann konkret die Rückkehr von Verschleppten oder allgemeiner die Wiederherstellung des Geschicks eines Volkes bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: Gemeint sind die gewöhnlich trockenen Wasserläufe im Negev, die sich nach Regen plötzlich mit Wasser füllen.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוּבָה
  choice: Wende
  rationale: Der Imperativ von שוב richtet sich an Jahwe. Zusammen mit אֶת־שבותנו bezeichnet er die erbetene Umkehr einer Notlage; „Wende“ gibt die hebräische Wendung knapp und poetisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶת
  choice: '[Akkusativzeichen, nicht eigens übersetzt]'
  rationale: Das hebräische Objektzeichen besitzt hier keine eigenständige lexikalische Bedeutung; seine Funktion wird durch den deutschen Satzbau ausgedrückt.
- source_word: שבותנו
  choice: unser Geschick
  rationale: In der Verbindung שוב את־שבות kann das Wort die Wiederherstellung des Geschicks bezeichnen, zugleich aber konkret auf Gefangenschaft oder Gefangene bezogen sein. „Unser Geschick“ bewahrt im Haupttext die größere Bedeutungsweite.
- source_word: כַּאֲפִיקִים
  choice: wie die Wasserläufe
  rationale: אֲפִיקִים bezeichnet Rinnen, Bachbetten oder Wasserläufe. „Wasserläufe“ ist verständlich und lässt sowohl die meist trockenen Rinnen als auch die nach Regen darin strömenden Wassermassen anklingen.
- source_word: בַּנֶּגֶב
  choice: im Negev
  rationale: נֶגֶב bezeichnet hier am wahrscheinlichsten die trockene südliche Landschaft Israels; der geografische Name trägt das konkrete poetische Bild besser als das allgemeinere „im Süden“.
theological_decisions:
- issue: Bedeutung der Wendung שוב את־שבות
  choice: Bitte um umfassende Wiederherstellung des Geschicks der Gemeinschaft
  alternative: Bitte um Rückführung der Gefangenen oder Exilierten
  rationale: Die hebräische Wendung kann eine konkrete Rückkehr aus Gefangenschaft meinen, aber auch allgemeiner die Wiederherstellung einer bedrängten Gemeinschaft. Der Haupttext bleibt bewusst weit; die engere, exilische Deutung wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzform. „Wende unser Geschick“ ist eine im Deutschen verständliche, gehobene Wendung und bewahrt die Mehrdeutigkeit des hebräischen Idioms. Das konkrete Naturbild wird mit „Wasserläufe“ wiedergegeben und in der Fußnote erläutert.
