  yaml_path: translation/ot/psalms/017/005.yaml
  text: My steps have held fast in your paths[b][a]; my feet have not slipped.
translation:
  language: de
  text: Meine Schritte hielten fest an deinen Pfaden[a]; meine Füße wankten nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Bitte: »Stütze meine Schritte auf deinen Pfaden; meine Füße sollen nicht wanken.« Der hebräische Wortlaut kann als Bitte oder als Aussage über standhaftes Gehen verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָּמֹךְ
  choice: hielten sich fest
  rationale: Die Form kann im Kontext als Aussage über standhaftes Festhalten verstanden werden; die Wiedergabe bewahrt zugleich die Grundbedeutung des festen Haltens.
- source_word: אֲשֻׁרַי
  choice: meine Schritte
  rationale: Die konkrete Gehmetapher des hebräischen Substantivs wird unmittelbar und natürlich wiedergegeben.
- source_word: בְּמַעְגְּלוֹתֶיךָ
  choice: auf deinen Pfaden
  rationale: מַעְגָּל bezeichnet eine Bahn oder einen gebahnten Pfad; »auf deinen Pfaden« ist im Deutschen bildhaft und idiomatisch.
- source_word: בַּל
  choice: nicht
  rationale: Direkte Wiedergabe der poetischen Verneinungspartikel.
- source_word: נָמֹטּוּ
  choice: wankten nicht
  rationale: מוט bezeichnet Wanken, Schwanken oder Ausgleiten; »wankten« erhält die poetische Bewegungsmetapher.
- source_word: פְעָמָי
  choice: meine Füße
  rationale: Das Wort kann Schritte oder Tritte bezeichnen; zusammen mit מוט ist »meine Füße« im Deutschen natürlich und bildet einen klaren Parallelismus zu »meine Schritte«.
theological_decisions:
- issue: Aussage oder Bitte bei תָּמֹךְ
  choice: 'Als rückblickende Aussage wiedergegeben: »hielten sich fest«'
  alternative: 'Als Bitte: »Halte meine Schritte fest« bzw. »Stütze meine Schritte«'
  rationale: Die unpunktierte beziehungsweise morphologisch knappe Form und der Parallelismus lassen sowohl eine Aufforderung als auch eine Aussage zu. Der Haupttext folgt der Aussage, während die Fußnote die echte syntaktische Mehrdeutigkeit offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Gehmetapher und poetischem Parallelismus. Die syntaktische Mehrdeutigkeit des ersten Verbs wird nicht stillschweigend beseitigt, sondern in einer Fußnote ausgewiesen.
