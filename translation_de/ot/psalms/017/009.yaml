translation:
  language: de
  text: vor den Gottlosen, die mich verheeren, vor meinen Feinden, die mich umringen und mir nach dem Leben trachten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Todfeinde, die mich umringen“. Wörtlich steht hier „mit/gegen [die] Seele/das Leben“. Die hebräische Wendung kann Feinde bezeichnen, die dem Beter nach dem Leben trachten, möglicherweise aber auch ihre entschlossene, rückhaltlose Feindschaft hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי
  choice: vor
  rationale: Im Anschluss an die Schutzbitte des vorangehenden Verses bezeichnet die Wendung diejenigen, vor denen der Beter bewahrt werden möchte. Deutsches „vor“ ist hier natürlich und präzise.
- source_word: רְשָׁעִים
  choice: den Gottlosen
  rationale: Das substantivierte Adjektiv bezeichnet moralisch schuldige Menschen. „Gottlose“ bewahrt die ethisch-religiöse Kategorie und fügt keine Geschlechtsangabe hinzu.
- source_word: זוּ
  choice: die
  rationale: Die Relativpartikel verbindet „die Gottlosen“ mit dem folgenden Verb; im Deutschen ist „die“ als Relativpronomen idiomatisch.
- source_word: שַׁדּוּנִי
  choice: mich verwüsten
  rationale: Das Verb שׁדד beschreibt gewaltsames Verheeren, Plündern oder Zugrunderichten. „Verwüsten“ erhält die starke Bildlichkeit, ohne zwingend vollständige Vernichtung auszudrücken.
- source_word: אֹיְבַי
  choice: meinen Feinden
  rationale: Direkte Wiedergabe des pluralischen Substantivs mit Possessivsuffix.
- source_word: בְּנֶפֶשׁ
  choice: in Lebensgefahr
  rationale: נפש kann „Seele“, „Leben“ oder „Lebenskraft“ bezeichnen. In Verbindung mit den umringenden Feinden liegt eine Bedrohung des Lebens nahe; „in Lebensgefahr“ macht diese Kraft verständlich, ohne „tödliche Feinde“ als einzige grammatische Deutung festzuschreiben.
- source_word: יַקִּיפוּ עָלָי
  choice: mich umringen
  rationale: Die Verbform mit עַל bezeichnet das Umgeben oder Einkreisen. „Umringen“ ist klar, anschaulich und im gehobenen modernen Deutsch natürlich.
theological_decisions:
- issue: Bezug und Funktion von בְּנֶפֶשׁ
  choice: 'als Hinweis auf die Lebensbedrohung des Beters: „die mich in Lebensgefahr umringen“'
  alternative: „meine Todfeinde, die mich umringen“ oder „die mich voller Gier umringen“
  rationale: Die knappe hebräische Fügung ist mehrdeutig. Die Hauptfassung bewahrt den Bezug auf נפש als „Leben“, während die Fußnote die mögliche Zuordnung zu den Feinden offenlegt und eine dogmatische oder psychologisierende Festlegung vermeidet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Wiederholung von „vor“ verdeutlicht die Abhängigkeit von der Schutzbitte im vorhergehenden Vers. „Gottlose“ und „verwüsten“ erhalten die kräftige poetische Sprache; die Fußnote wahrt die syntaktisch-lexikalische Mehrdeutigkeit von בְּנֶפֶשׁ.
