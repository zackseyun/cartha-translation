lexical_decisions:
- source_word: קְרָאתִיךָ
  choice: Ich rufe dich an
  rationale: Das Qal-Perfekt der 1. Person Singular mit Suffix der 2. Person Singular kann im poetischen Gebet einen gegenwärtigen Ruf ausdrücken, wobei eine vergangene oder zuversichtlich vorausblickende Nuance möglich bleibt.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier den Grund für den Ruf ein; „denn“ wahrt die knappe kausale Verknüpfung.
- source_word: תַעֲנֵנִי
  choice: du antwortest mir
  rationale: Das Imperfekt der 2. Person Singular mit Suffix der 1. Person Singular drückt hier Zuversicht auf Gottes Antwort aus; im Deutschen bewahrt das Präsens die zeitliche Offenheit besser als eine ausschließlich futurische Wiedergabe.
- source_word: אֵל
  choice: Gott
  rationale: אֵל steht als direkte Anrede. Im modernen deutschen Gebetston ist „Gott“ natürlich und würdig; ein zusätzliches „o“ ist nicht nötig.
- source_word: הַט אָזְנְךָ לִי
  choice: Neige dein Ohr zu mir
  rationale: Die konkrete hebräische Metapher für aufmerksames Hören bleibt erhalten und ist auch im Deutschen verständlich.
- source_word: שְׁמַע
  choice: höre
  rationale: Der Imperativ wird direkt wiedergegeben und erhält den Parallelismus zur Aufforderung, das Ohr zu neigen.
- source_word: אִמְרָתִי
  choice: meine Worte
  rationale: Die Wiedergabe folgt der im überlieferten Textzusammenhang verstandenen Bedeutung „meine Äußerung/meine Worte“ und klingt im Deutschen natürlicher als das missverständliche Singular „mein Wort“.
theological_decisions:
- issue: Zeitbezug von Ruf und Antwort Gottes
  choice: 'Gegenwartsformen: „Ich rufe … du antwortest“'
  alternative: „Ich habe dich angerufen, denn du wirst mir antworten“
  rationale: Die hebräischen Verbformen lassen in poetischem Gebet vergangene, gegenwärtige und zuversichtlich zukünftige Nuancen zu. Die Hauptfassung liest sie präsentisch, ohne die alternative zeitliche Deutung auszuschließen; diese wird in der Fußnote offengelegt.
translation_notes:
  register: Moderner, würdiger deutscher Gebetston. Die hebräische Hörmetapher und die knappe poetische Parallelstruktur werden bewahrt; die Fußnote hält die zeitliche Mehrdeutigkeit der Verbformen offen.
