review_pass:
  verdict: revise
  source_fidelity: Die Hauptfassung gibt den kausalen Zusammenhang, die zuversichtliche Imperfektform und die beiden Imperative angemessen wieder. Doch אִמְרָתִי ist morphologisch und lexikalisch Singular („meine Rede / meine Äußerung“), nicht Plural. „Meine Worte“ verändert daher die Zahl des hebräischen Ausgangstextes.
  naturalness: „Ich rufe dich an“ ist in einem würdigen Gebetsregister möglich. „Neige dein Ohr mir zu“ ist die im heutigen Deutschen idiomatischere Stellung und bewahrt zugleich das hebräische Bild. Die Anrede wird durch „o Gott“ klar als Vokativ kenntlich gemacht.
  terminology: „Gott“, „neige dein Ohr“ und „höre“ sind angemessene, traditionelle und zugleich verständliche Wiedergaben. „Meine Rede“ gibt das singuläre אִמְרָתִי natürlich wieder, ohne dessen Bedeutung auf ein einzelnes „Wort“ zu verengen.
  issues:
  - severity: medium
    issue: „meine Worte“ gibt אִמְרָתִי im Plural wieder.
    rationale: Die Form trägt das Suffix der 1. Person Singular an dem femininen Singular אִמְרָה. Eine singuläre deutsche Wiedergabe ist erforderlich; „meine Rede“ ist in diesem Gebetskontext idiomatisch und semantisch passend.
  - severity: low
    issue: Die Stellung „Neige dein Ohr zu mir“ ist weniger idiomatisch als „Neige dein Ohr mir zu“.
    rationale: Beide Formulierungen sind verständlich, doch die letztere entspricht der üblichen deutschen Verbindung „jemandem das Ohr zuneigen“ und gibt לִי treffend wieder.
