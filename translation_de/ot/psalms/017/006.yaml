  yaml_path: translation/ot/psalms/017/006.yaml
  text: I call on you[a], for you answer me, O God; incline your ear to me[b]; hear my words.
translation:
  language: de
  text: Ich rufe dich an[a], denn du antwortest mir, o Gott; neige dein Ohr mir zu[b], höre meine Rede!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich habe dich angerufen, denn du wirst mir antworten, o Gott.“ Die hebräischen Verbformen können im poetischen Gebet vergangen, gegenwärtig oder zuversichtlich auf die Zukunft bezogen verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: „Neige dein Ohr mir zu“ ist im Hebräischen eine bildhafte Bitte an Gott, aufmerksam zuzuhören.
