  terminology: „Jahwe“ entspricht dem Tetragramm. „Menschen dieser Welt“ gibt מֵחֶלֶד idiomatisch wieder, ohne einen kosmologischen oder eschatologischen Zusatz einzutragen. „Bauch“ bewahrt das konkrete Bild von בֶּטֶן; „Söhne“ bewahrt die maskuline Form von בָּנִים. Die Fußnote zu den kleinen Kindern bleibt sachgerecht.
