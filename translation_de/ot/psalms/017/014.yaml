source:
  edition: WLC
  text: מִֽ/מְתִ֥ים יָדְ/ךָ֨ יְהוָ֡ה מִֽ/מְתִ֬ים מֵ/חֶ֗לֶד חֶלְקָ֥/ם בַּֽ/חַיִּים֮ ו/צפינ/ך תְּמַלֵּ֪א בִ֫טְנָ֥/ם יִשְׂבְּע֥וּ בָנִ֑ים וְ/הִנִּ֥יחוּ יִ֝תְרָ֗/ם לְ/עוֹלְלֵי/הֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/014.yaml
  text: from men by your hand[a], O Yahweh, from men of the world, whose portion is in this life. You fill their belly with your stored-up treasure; they are satisfied with sons[c][b], and they leave their abundance to their children.
translation:
  language: de
  text: 'Rette mich durch deine Hand vor Menschen, Jahwe,

    vor Menschen dieser Welt,

    deren Anteil in diesem Leben liegt.

    Du füllst ihren Bauch mit dem, was du aufbewahrt hast.

    Sie haben Söhne in Fülle[b]

    und hinterlassen ihren Überfluss ihren Kindern.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Wörtlich: „Söhnen“. Gemeint sein kann zahlreicher männlicher Nachwuchs als Zeichen von Wohlergehen.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort bezeichnet genauer kleine Kinder.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְתִים
  choice: vor Männern
  rationale: Die Präposition wird im Zusammenhang mit der aus dem vorigen Vers fortwirkenden Bitte um Rettung verstanden. „Männer“ bewahrt den maskulinen Plural und den Parallelismus; gemeint sind menschliche Gegner, nicht Tote.
- source_word: יָדְךָ
  choice: durch deine Hand
  rationale: Die instrumentale Wiedergabe wahrt die knappe Aussage, dass die Gegner unter Jahwes Handeln beziehungsweise Herrschaft stehen, ohne ihre genaue Rolle näher festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מֵחֶלֶד
  choice: aus dieser Welt
  rationale: חֶלֶד bezeichnet hier den Bereich des vergänglichen menschlichen Daseins. „Diese Welt“ bringt den gegenwartsbezogenen Horizont der Männer natürlich zum Ausdruck.
- source_word: חֶלְקָם בַּחַיִּים
  choice: deren Anteil dieses Leben ist
  rationale: Die Formulierung bewahrt den Gedanken ihres gegenwärtigen Lebensanteils, ohne eine weitergehende Aussage über ihr künftiges Geschick ausdrücklich in den Text einzutragen.
- source_word: וּצְפוּנְךָ
  choice: mit dem, was du aufbewahrt hast
  rationale: Das Wort bezeichnet etwas Verborgenes beziehungsweise Aufbewahrtes. Die verbale Wendung ist im Deutschen natürlich und vermeidet, die Gabe unnötig eng als materiellen Schatz festzulegen.
- source_word: תְּמַלֵּא בִטְנָם
  choice: füllst du ihren Leib
  rationale: בֶּטֶן kann Bauch, Leib oder Mutterleib bezeichnen. „Leib“ wahrt das körperliche Bild und klingt im poetischen Zusammenhang würdig und natürlich.
- source_word: יִשְׂבְּעוּ בָנִים
  choice: sie werden satt an Söhnen
  rationale: Die Gegner bleiben Subjekt des Verbs; בָּנִים wird entsprechend seiner konkreten maskulinen Form als „Söhne“ wiedergegeben. Die ungewöhnliche Bildlichkeit des Sattwerdens bleibt erhalten.
- source_word: וְהִנִּיחוּ יִתְרָם
  choice: und hinterlassen ihren Überfluss
  rationale: יֶתֶר meint das Übrige, den Überschuss oder Überfluss. „Überfluss“ passt zur geschilderten Fülle und zu dem, was den Nachkommen bleibt.
- source_word: לְעוֹלְלֵיהֶם
  choice: ihren Kindern
  rationale: Im Erbschaftszusammenhang ist „Kindern“ die natürlichste deutsche Wiedergabe; die genauere Bedeutung „kleine Kinder“ wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Verhältnis der Gegner zu Gottes Hand in מִמְתִים יָדְךָ
  choice: „vor Männern durch deine Hand“ lässt Gottes Wirken erkennen, bestimmt aber nicht genauer, ob die Männer Werkzeuge seines Gerichts oder lediglich seiner Herrschaft unterstellt sind.
  alternative: „vor Männern deiner Hand“ oder „durch deine Hand vor Männern“
  rationale: Die hebräische Syntax ist stark verdichtet und lässt mehrere Zuordnungen zu. Die Hauptfassung bewahrt die Spannung, statt eine bestimmte Lehre über die Funktion der Gegner festzuschreiben.
- issue: Der diesseitige Anteil der Gottlosen
  choice: „deren Anteil dieses Leben ist“ beschreibt ihre gegenwärtige Lebensfülle, ohne im Vers selbst eine ausdrückliche Aussage über das Jenseits hinzuzufügen.
  alternative: „deren Anteil unter den Lebenden ist“
  rationale: Der Kontext legt einen zeitlichen Kontrast nahe, formuliert hier aber keine vollständige Lehre über das künftige Gericht. Die Übersetzung macht den Gegenwartsbezug verständlich, ohne ihn auszubauen.
- issue: Gott als Geber ihrer Fülle
  choice: Die direkte Aussage „füllst du ihren Leib“ bleibt stehen.
  alternative: Eine unpersönliche Formulierung, die Gottes unmittelbare Beteiligung abschwächt
  rationale: Der hebräische Text schreibt die Fülle ausdrücklich Gott zu. Diese theologische Spannung darf nicht dadurch geglättet werden, dass Gottes Handeln verschleiert wird.
translation_notes:
  register: Moderne, würdige Psalmenprosa mit bewahrtem Parallelismus. Die ungewöhnlichen Bilder „durch deine Hand“, „Anteil“ und „satt an Söhnen“ wurden nicht eingeebnet. Der Vers beginnt entsprechend dem hebräischen Zusammenhang als Fortsetzung der Bitte aus dem vorigen Vers.
