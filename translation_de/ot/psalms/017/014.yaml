revisions:
- from: 'vor Männern durch deine Hand[a], Jahwe,

    vor Männern aus dieser Welt,

    deren Anteil dieses Leben ist.

    Mit dem, was du aufbewahrt hast, füllst du ihren Leib.

    Sie werden satt an Söhnen[b]

    und hinterlassen ihren Überfluss ihren Kindern.[c]'
  to: 'Rette mich durch deine Hand vor Menschen, Jahwe,

    vor Menschen dieser Welt,

    deren Anteil in diesem Leben liegt.

    Du füllst ihren Bauch mit dem, was du aufbewahrt hast.

    Sie haben Söhne in Fülle[b]

    und hinterlassen ihren Überfluss ihren Kindern.[c]'
  rationale: Die implizite Rettungsbitte aus Psalm 17,13 wird im Deutschen mit „Rette mich“ aufgenommen; dadurch wird kein neuer theologischer Gehalt ergänzt, sondern die im hebräischen Anschluss vorausgesetzte Verbhandlung lesbar gemacht. „Jahwe“ wird ergänzt. Die Bildsprache von Gottes aufbewahrtem Vorrat und dem gefüllten Bauch bleibt erhalten. Die idiomatische Formel „Söhne in Fülle“ vermeidet eine im modernen Deutsch missverständliche Sättigungsmetapher, ohne die männliche Pluralform zu neutralisieren. Fußnote a bleibt als dokumentierte syntaktische Alternative erhalten, ist jedoch am Haupttext nicht verankert, weil sie keine alternative Lesart eines einzelnen übersetzten Wortes, sondern der ganzen Anfangsfügung erläutert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T20:33:21Z'
