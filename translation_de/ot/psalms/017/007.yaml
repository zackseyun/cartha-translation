  text: הַפְלֵ֣ה חֲ֭סָדֶי/ךָ מוֹשִׁ֣יעַ חוֹסִ֑ים מִ֝/מִּתְקוֹמְמִ֗ים בִּֽ/ימִינֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/007.yaml
  text: Show your wondrous steadfast love[a], O Savior of those who take refuge from those who rise up against them[b], by your right hand.
translation:
  language: de
  text: Erweise deine treue Liebe auf wunderbare Weise[a], du, der du mit deiner rechten Hand die rettest, die vor denen Zuflucht suchen, die sich gegen sie erheben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Lass deine treue Liebe wunderbar hervortreten.“ Der hebräische Imperativ kann bedeuten, etwas wunderbar oder außergewöhnlich zu machen beziehungsweise als solches zu erweisen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Schlusswendung kann auch mit den Schutzsuchenden verbunden werden: „die zu deiner Rechten Zuflucht suchen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְלֵה
  choice: Erweise ... auf wunderbare Weise
  rationale: Der Hifil-Imperativ von פלא kann dazu auffordern, etwas als außergewöhnlich zu erweisen oder wunderbar hervortreten zu lassen. Die Formulierung ist im Deutschen natürlich und bewahrt den Gebetscharakter.
- source_word: חֲסָדֶיךָ
  choice: deine treue Liebe
  rationale: חסד umfasst beständige Zuwendung, Loyalität und Erbarmen. „Treue Liebe“ gibt diese Bedeutungsbreite verständlich wieder, ohne den Begriff auf eine einzelne dogmatische Deutung festzulegen.
- source_word: מוֹשִׁיעַ
  choice: du Retter derer
  rationale: Das Partizip bezeichnet Gott in direkter Anrede als den, der rettet. Die substantivische Wiedergabe erhält den feierlichen, persönlichen Gebetston.
- source_word: חוֹסִים
  choice: die ... Zuflucht suchen
  rationale: חסה bezeichnet konkret das Suchen von Schutz und Zuflucht; diese Bildsprache bleibt deutlicher erhalten als mit dem abstrakteren „vertrauen“.
- source_word: מִמִּתְקוֹמְמִים
  choice: vor denen, die sich gegen sie erheben
  rationale: Das Partizip von קום beschreibt ein feindseliges Sich-Erheben. Das im Hebräischen unausgesprochene Ziel der Feindschaft wird im Deutschen aus dem unmittelbaren Zusammenhang mit „sie“ ergänzt.
- source_word: בִּימִינֶךָ
  choice: durch deine rechte Hand
  rationale: Die Präposition ב kann hier das Mittel bezeichnen. „Durch deine rechte Hand“ bewahrt das Bild von Gottes machtvollem Eingreifen.
theological_decisions:
- issue: Syntaktischer Bezug von בִּימִינֶךָ
  choice: 'Die rechte Hand wird als Mittel von Gottes Rettung verstanden: „durch deine rechte Hand“.'
  alternative: 'Die Wendung kann sich auf die Schutzsuchenden beziehen: „die zu deiner Rechten Zuflucht suchen“; weniger wahrscheinlich ist ein Bezug auf Gegner, die sich gegen Gottes rechte Hand erheben.'
  rationale: Die Schlussstellung der Präpositionalphrase lässt im Hebräischen mehrere Bezüge zu. Der Haupttext gibt die im Zusammenhang naheliegende instrumentale Lesart wieder; die echte Mehrdeutigkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich macht den bevorzugten Bezug der Schlusswendung auf Gottes rettendes Handeln lesbar, während die Fußnote die syntaktische Mehrdeutigkeit des Hebräischen bewahrt.
