  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד שִׁמְעָ֤/ה יְהוָ֨ה צֶ֗דֶק הַקְשִׁ֥יבָ/ה רִנָּתִ֗/י הַאֲזִ֥ינָ/ה תְפִלָּתִ֑/י בְּ֝/לֹ֗א שִׂפְתֵ֥י מִרְמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/000.yaml
  text: A prayer of David. Hear righteousness[a], Yahweh; pay attention to my cry; give ear to my prayer from lips without deceit.
translation:
  language: de
  text: Ein Gebet Davids. Höre, HERR, meine gerechte Sache[a]; achte auf meinen Hilferuf, vernimm mein Gebet von Lippen ohne Falschheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Höre Gerechtigkeit«; das hebräische Wort kann auch »Recht« oder »gerechte Sache« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Ein Gebet Davids
  rationale: Die Überschrift wird knapp und idiomatisch wiedergegeben; die Zugehörigkeitsangabe לְדָוִד bleibt als Genitiv bewusst offen für Verfasserschaft oder Zuordnung.
- source_word: צֶדֶק
  choice: meine gerechte Sache
  rationale: Das Substantiv kann »Gerechtigkeit«, »Recht« oder eine gerechte Streitsache bezeichnen. Im Zusammenhang der Bitte um Gehör bezeichnet es wahrscheinlich das gerechte Anliegen des Beters; die Fußnote bewahrt die wörtlichere Lesart.
- source_word: רִנָּתִי
  choice: meinen Hilferuf
  rationale: רִנָּה bezeichnet hier keinen Jubel, sondern einen lauten flehentlichen Ruf; »Hilferuf« vermittelt diese kontextuelle Bedeutung natürlich.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: von Lippen ohne Falschheit
  rationale: Die ungewöhnliche knappe Ausdrucksweise des Hebräischen wird weitgehend bewahrt. »Falschheit« umfasst Täuschung und Unaufrichtigkeit, ohne den Sinn unnötig einzuengen.
- source_word: יְהוָה
  choice: HERR
  rationale: Die im deutschen Bibelgebrauch etablierte Wiedergabe des Gottesnamens durch das typografisch hervorgehobene »HERR« ist verständlich und würdig.
theological_decisions:
- issue: Behauptung der Gerechtigkeit des Beters
  choice: »meine gerechte Sache« bezeichnet das als gerecht vorgebrachte Anliegen.
  alternative: »Höre Gerechtigkeit« als abstrakte oder personifizierte Aussage.
  rationale: Der Kontext spricht für eine Bitte um Recht in einer konkreten Sache. Die Formulierung behauptet nicht allgemein die Sündlosigkeit des Beters und vermeidet damit eine theologische Überdeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Aufforderungen »Höre … achte … vernimm« bilden die hebräische Gebetssprache nach, ohne altertümliche Formen zu verwenden.
