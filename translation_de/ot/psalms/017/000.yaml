review_pass:
  verdict: approve
  source_fidelity: Die Überschrift תְּפִלָּה לְדָוִד ist treffend als „Ein Gebet Davids“ wiedergegeben. Die drei Imperative und ihre parallele Struktur werden angemessen abgebildet. „meine gerechte Sache“ legt צֶדֶק kontextgemäß als gerechtes Anliegen bzw. Streitsache aus; das possessive „meine“ ist im Gebetskontext implizit und macht im Deutschen den Bezug natürlich. „Hilferuf“ gibt רִנָּתִי in diesem Flehkontext passend wieder. Die Schlusswendung „von Lippen ohne Falschheit“ bewahrt die Zuordnung des Gebets zu nicht-trügerischen Lippen.
  naturalness: Der Text ist modernes, würdiges und flüssiges Standarddeutsch. „Höre, HERR …; achte auf …, vernimm …“ bildet den poetischen Parallelismus klar nach. Die Satzstellung und Zeichensetzung sind idiomatisch.
  terminology: Die Wiedergabe des Tetragramms mit „HERR“ entspricht etabliertem deutschem Bibelgebrauch. „Falschheit“ ist für מִרְמָה semantisch tragfähig und vermeidet eine unnötige Einschränkung auf bloßes Lügen. Die Fußnote erläutert die lexikalische Spannweite von צֶדֶק sachlich und bewahrt die wörtlichere, abstraktere Möglichkeit.
