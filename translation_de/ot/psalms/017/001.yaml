base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/001.yaml
  text: A prayer of David. Hear[a], O Yahweh, a just cause; attend to my cry; give ear to my prayer from lips without deceit.
translation:
  language: de
  text: Ein Gebet Davids. Höre, Jahwe, die gerechte Sache[a]; achte auf meinen Hilferuf; vernimm mein Gebet von Lippen ohne Falsch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Höre, was recht ist.« Das hebräische Wort kann Gerechtigkeit, Recht oder eine gerechte Sache bezeichnen; hier kann es den gerechten Rechtsfall des Beters meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Ein Gebet Davids
  rationale: Die Überschrift bezeichnet das Gebet als David zugehörig; der deutsche Genitiv gibt die übliche Bedeutung der Formel knapp und natürlich wieder.
- source_word: שִׁמְעָה
  choice: Höre
  rationale: Der Imperativ eröffnet die unmittelbare Bitte und bewahrt die Abfolge dreier Aufforderungen zum Hören.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und steht hier in direkter Anrede.
- source_word: צֶדֶק
  choice: meine gerechte Sache
  rationale: צֶדֶק ist Objekt von »höre« und bezeichnet im Kontext wahrscheinlich den als gerecht behaupteten Rechtsfall des Beters. Das ergänzte Possessiv macht den Bezug im Deutschen verständlich, ohne die mögliche abstraktere Lesart zu verschweigen.
- source_word: הַקְשִׁיבָה
  choice: achte auf
  rationale: Der Hifil-Imperativ fordert zu aufmerksamem Hinhören auf; »achte auf« ist gegenwärtiges, würdiges Deutsch.
- source_word: רִנָּתִי
  choice: meinen Hilferuf
  rationale: Das Wort kann einen lauten oder jubelnden Ruf bezeichnen; im Klagegebet ist ein dringender Hilferuf gemeint.
- source_word: הַאֲזִינָה
  choice: vernimm
  rationale: »Vernimm« gibt die erneute Bitte um aufmerksames Hören poetisch und verständlich wieder, ohne die Wendung unnötig zu verlängern.
- source_word: תְפִלָּתִי
  choice: mein Gebet
  rationale: Die direkte Wiedergabe erhält die lexikalische Verbindung zur Überschrift.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: von Lippen ohne Falsch
  rationale: Die Formulierung bewahrt das Lippenbild und charakterisiert das Gebet als frei von Täuschung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; die Transliteration bewahrt ihn als persönliche Anrede statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von צֶדֶק als Gegenstand des Hörens
  choice: meine gerechte Sache
  alternative: Gerechtigkeit / was recht ist
  rationale: Der forensische Kontext legt den gerechten Fall des Beters nahe. Da das Hebräische zugleich knapper und mehrdeutig ist, wird die wörtlichere Alternative in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelität. Die drei Hörbitten werden lexikalisch variiert; ungewöhnlichere Bildsprache wie »Lippen ohne Falsch« bleibt bewusst erhalten.
