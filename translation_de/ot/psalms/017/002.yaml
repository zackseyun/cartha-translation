  text: מִ֭/לְּ/פָנֶי/ךָ מִשְׁפָּטִ֣/י יֵצֵ֑א עֵ֝ינֶ֗י/ךָ תֶּחֱזֶ֥ינָה מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/002.yaml
  text: May my judgment come forth from before you[b][a]; may your eyes behold what is upright.
translation:
  language: de
  text: Möge mein Recht von deinem Angesicht ausgehen[a]; deine Augen mögen sehen, was recht ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mein Rechtsspruch gehe aus deiner Gegenwart hervor“; auch: „Meine Rechtfertigung komme von dir.“'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „deine Augen mögen auf Redlichkeit sehen“ beziehungsweise „auf das, was gerade ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּפָנֶיךָ
  choice: von deinem Angesicht
  rationale: 'Die Formulierung bewahrt das räumliche und gerichtliche Bild des Hebräischen: Der Rechtsspruch geht aus Gottes unmittelbarer Gegenwart hervor.'
- source_word: מִשְׁפָּטִי
  choice: mein Recht
  rationale: מִשְׁפָּט kann hier den den Beter betreffenden Rechtsspruch, seinen Rechtsfall oder seine Rechtfertigung bezeichnen. „Mein Recht“ bleibt knapp und lässt diese Bedeutungsbreite weitgehend offen.
- source_word: יֵצֵא
  choice: gehe … aus
  rationale: Das Verb bezeichnet ein Hinaus- oder Hervorgehen. „Ausgehen“ passt im Deutschen natürlich zu einem Rechtsspruch, der von Gottes Angesicht kommt.
- source_word: עֵינֶיךָ
  choice: deine Augen
  rationale: Die konkrete anthropomorphe Bildsprache des Hebräischen wird beibehalten und nicht zu einem bloßen „du“ verflacht.
- source_word: תֶּחֱזֶינָה
  choice: mögen sehen
  rationale: חזה bezeichnet ein aufmerksames Sehen oder Schauen. „Sehen“ ist gegenwärtiges, klares Deutsch; die Gebetsform wird durch „mögen“ ausgedrückt.
- source_word: מֵישָׁרִים
  choice: was recht ist
  rationale: Der Plural kann Geradheit, Rechtschaffenheit, Billigkeit oder das Rechte bezeichnen. „Was recht ist“ verbindet moralischen und gerichtlichen Sinn in natürlichem Deutsch.
theological_decisions:
- issue: Bitte oder zuversichtliche Aussage
  choice: 'Bitte: „gehe … aus“ und „mögen sehen“'
  alternative: 'Zukunftsaussage: „Mein Recht wird von deinem Angesicht ausgehen; deine Augen werden sehen …“'
  rationale: Die Imperfektformen können Zukunft ausdrücken, funktionieren im Zusammenhang des Gebets jedoch natürlich als Wünsche beziehungsweise Bitten. Die deutsche Fassung gibt diese Gebetsbewegung wieder, ohne eine grammatisch zwingende Gewissheit zu behaupten.
- issue: Bedeutung von מִשְׁפָּטִי
  choice: „mein Recht“
  alternative: „mein Urteil“, „mein Rechtsspruch“ oder „meine Rechtfertigung“
  rationale: Der Vers bittet um Gottes gerechte Entscheidung, doch das Hebräische legt nicht eindeutig fest, ob der Rechtsfall, der Urteilsspruch oder die daraus folgende Rechtfertigung im Vordergrund steht. „Mein Recht“ bewahrt diese Spannung besser als eine stärker deutende Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildsprache. „Von deinem Angesicht“ ist bewusst feierlicher als „von dir“, bleibt aber verständlich. Die parallelen Bitten und die ausdrückliche Erwähnung von Gottes Augen folgen der hebräischen Form.
