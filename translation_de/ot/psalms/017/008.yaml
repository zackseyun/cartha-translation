source:
  edition: WLC
  text: שָׁ֭מְרֵ/נִי כְּ/אִישׁ֣וֹן בַּת עָ֑יִן בְּ/צֵ֥ל כְּ֝נָפֶ֗י/ךָ תַּסְתִּירֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/008.yaml
  text: Keep me like the pupil of the eye[a]; hide me in the shadow of your wings.
translation:
  language: de
  text: 'Bewahre mich wie die Pupille des Auges[a];

    verbirg mich im Schatten deiner Flügel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditionell: „Bewahre mich wie den Augapfel.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Bewahre mich
  rationale: שׁמר bezeichnet bewahren, behüten oder schützen. „Bewahre mich“ gibt die Bitte knapp und würdevoll wieder, ohne die Art des Schutzes näher festzulegen.
- source_word: כְּאִישׁוֹן בַּת עָיִן
  choice: wie die Pupille des Auges
  rationale: Die hebräische Wendung bezeichnet die Pupille, den empfindlichen Mittelpunkt des Auges. Diese Wiedergabe macht das Schutzbild für heutige Leser unmittelbar verständlich; die traditionelle deutsche Formulierung „wie den Augapfel“ wird in der Fußnote bewahrt.
- source_word: בְּצֵל
  choice: im Schatten
  rationale: צֵל kann „Schatten“ oder „Schutz spendender Schatten“ bedeuten. „Im Schatten“ erhält das konkrete poetische Bild und verbindet sich natürlich mit den Flügeln.
- source_word: כְּנָפֶיךָ
  choice: deiner Flügel
  rationale: כָּנָף bedeutet „Flügel“. Die wörtliche Wiedergabe bewahrt das anschauliche Bild göttlichen Schutzes.
- source_word: תַּסְתִּירֵנִי
  choice: verbirg mich
  rationale: Die Hifil-Form von סתר bedeutet „verbergen“ oder „verstecken“. „Verbirg mich“ gibt das Verb direkt wieder und lässt die Schutzfunktion aus dem Bildzusammenhang hervorgehen.
theological_decisions:
- issue: Wiedergabe der Schutzmetapher des Auges
  choice: Die hebräische Wendung wird ihrem konkreten Sinn nach mit „die Pupille des Auges“ wiedergegeben.
  alternative: „wie den Augapfel“
  rationale: Das Bild beschreibt etwas Empfindliches, das sorgfältig geschützt wird, ohne eine darüber hinausgehende Lehrentscheidung zu verlangen. Die Hauptfassung ist für heutige Leser transparent; die traditionelle Wendung bleibt als Alternative erhalten.
- issue: Wiedergabe des Flügelbildes
  choice: „deiner Flügel“ wird als Metapher beibehalten.
  alternative: Deutende Wiedergaben wie „unter deinem Schutz“ oder „in deiner Obhut“
  rationale: Der hebräische Text verwendet bewusst ein körperlich-anschauliches poetisches Bild für Gottes Schutz. Seine Beibehaltung wahrt sowohl die literarische Gestalt als auch die theologische Spannung der Bildsprache.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Zeilengliederung. „Pupille“ ist gegenüber dem traditionellen „Augapfel“ sachlich näher am hebräischen Ausdruck; die vertraute traditionelle Form bleibt in der Fußnote zugänglich.
