  yaml_path: translation/ot/psalms/017/015.yaml
  text: As for me[a], in righteousness I will behold your face; when I awake[b], I will be satisfied with your likeness.
translation:
  language: de
  text: Ich aber werde in Gerechtigkeit dein Angesicht schauen; wenn ich erwache[a], werde ich an deiner Gestalt[b] satt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Erwachen kann als gewöhnliches Aufwachen aus dem Schlaf oder als Erwachen zur endgültigen Rechtfertigung beziehungsweise Auferstehung verstanden werden.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „deinem Abbild“ beziehungsweise „deiner Erscheinung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶדֶק
  choice: in Gerechtigkeit
  rationale: Die Wendung bewahrt die knappe hebräische Form und lässt offen, ob die Gerechtigkeit die Rechtschaffenheit des Beters, Gottes gerechte Bestätigung oder einen anderen Aspekt meint.
- source_word: אֶחֱזֶה
  choice: werde ich … schauen
  rationale: חזה bezeichnet ein wahrnehmendes, betrachtendes Sehen. „Schauen“ gibt den gehobenen poetischen Ton natürlich wieder.
- source_word: פָנֶיךָ
  choice: dein Angesicht
  rationale: Das konkrete hebräische Bild wird beibehalten; „Gegenwart“ wäre bereits eine Deutung des Ausdrucks.
- source_word: אֶשְׂבְּעָה
  choice: werde ich … satt
  rationale: שׂבע bedeutet satt oder erfüllt werden. Die idiomatische Wendung „an … satt werden“ bewahrt zugleich die Bildhaftigkeit.
- source_word: בְּהָקִיץ
  choice: wenn ich erwache
  rationale: Die Präposition mit dem Infinitiv bezeichnet hier den Zeitpunkt. Die Formulierung lässt die Art des Erwachens bewusst offen.
- source_word: תְּמוּנָתֶךָ
  choice: deiner Gestalt
  rationale: תְּמוּנָה kann Gestalt, Abbild oder Erscheinungsform bedeuten. „Gestalt“ ist konkret, ohne eine genau bestimmte körperliche Form vorauszusetzen.
theological_decisions:
- issue: Ob בְּהָקִיץ gewöhnliches Erwachen oder endzeitliche Auferweckung bezeichnet
  choice: Der Haupttext sagt lediglich „wenn ich erwache“.
  alternative: Erwachen aus dem nächtlichen Schlaf oder Erwachen zur endgültigen Rechtfertigung beziehungsweise Auferstehung
  rationale: Der hebräische Ausdruck legt die Art des Erwachens nicht ausdrücklich fest. Die Übersetzung erhält diese theologische Spannung und nennt die Möglichkeiten in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Satzbau. „Angesicht“ und „schauen“ erhalten den gehobenen Psalmton, bleiben aber allgemein verständlich.
