base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/003.yaml
  text: You have examined my heart; you have visited me by night; you have tested me and find nothing[a]. I have purposed that my mouth will not transgress.
translation:
  language: de
  text: 'Du hast mein Herz geprüft, hast mich in der Nacht aufgesucht und mich auf die Probe gestellt; nichts findest du. Ich habe mir vorgenommen: Mein Mund soll keine Grenze überschreiten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formnäher: „Ich habe beschlossen; mein Mund wird nicht hinübergehen.“ Der hebräische Schlusssatz ist knapp und syntaktisch mehrdeutig; er kann auch als Aussage über das gegenwärtige Reden des Beters verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּחַנְתָּ
  choice: hast … geprüft
  rationale: בחן bezeichnet das prüfende Erforschen des Inneren. „Prüfen“ gibt den bewertenden Sinn natürlich wieder und passt zu „mein Herz“.
- source_word: לִבִּי
  choice: mein Herz
  rationale: „Herz“ bewahrt die hebräische Redeweise für das Innere des Menschen, einschließlich Denken, Wollen und Absicht.
- source_word: פָּקַדְתָּ
  choice: hast … aufgesucht
  rationale: פקד kann „aufsuchen“, „sich zuwenden“ oder „überprüfen“ bedeuten. Hier verbindet „aufgesucht“ die nächtliche Gegenwart Gottes mit dem Zusammenhang göttlicher Prüfung.
- source_word: לַּיְלָה
  choice: in der Nacht
  rationale: Die adverbiale Zeitangabe wird im modernen Deutschen natürlich mit „in der Nacht“ wiedergegeben.
- source_word: צְרַפְתַּנִי
  choice: hast mich geläutert
  rationale: צרף stammt aus der Metallverhüttung und bezeichnet das Läutern beziehungsweise Prüfen durch Feuer. „Geläutert“ erhält das Bild, ohne seine prüfende Funktion zu verlieren.
- source_word: בַל תִּמְצָא
  choice: nichts hast du gefunden
  rationale: Das Hebräische nennt kein ausdrückliches Objekt. „Nichts“ bewahrt diese Knappheit; eine Ergänzung wie „Böses“ wäre stärker deutend.
- source_word: זַמֹּתִי
  choice: Ich habe mir vorgenommen
  rationale: 'Die Form wird verbal von זמם verstanden: „ich habe geplant/beschlossen“. „Mir vorgenommen“ leitet im Deutschen natürlich den folgenden Entschluss ein.'
- source_word: בַל יַעֲבָר פִּי
  choice: Mein Mund soll sich nicht vergehen
  rationale: עבר bedeutet wörtlich „hinübergehen/überschreiten“. In Verbindung mit „Mund“ bezeichnet es ein Überschreiten im Reden; „sich vergehen“ macht diesen ethischen Sinn verständlich, ohne eine bestimmte Art der Verfehlung festzulegen.
theological_decisions:
- issue: Deutung des abschließenden Satzteils
  choice: 'Der Psalmist fasst einen Entschluss für sein Reden: „Ich habe mir vorgenommen: Mein Mund soll sich nicht vergehen.“'
  alternative: Möglich sind auch eine Feststellung („Mein Mund vergeht sich nicht“) oder die wörtlichere, aber im Deutschen dunkle Fassung „Was ich geplant habe, soll mein Mund nicht überschreiten“.
  rationale: Der hebräische Wortlaut ist gedrängt und syntaktisch mehrdeutig. Die gewählte Fassung versteht זַמֹּתִי verbal und den folgenden Satz als Inhalt des Entschlusses. Die Fußnote hält die formnähere Alternative offen und vermeidet es, die Unsicherheit zu verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Knappheit. Die Reihe göttlicher Prüfhandlungen bleibt erhalten; „geläutert“ bewahrt bewusst das Metallbild von צרף. Die schwierige Syntax des Schlusses wird lesbar gefasst und zugleich in der Fußnote als mehrdeutig kenntlich gemacht.
