  text: He is like a lion eager to tear[c][b][a], like a young lion sitting in hiding places.
translation:
  language: de
  text: Er gleicht einem Löwen, der begierig darauf ist, Beute zu reißen,[a] und einem jungen Löwen, der in Verstecken lauert.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beginnt der hebräische Text mit einem Substantiv: »Seine Ähnlichkeit ist wie ein Löwe«. Der direkte Vergleich »Er gleicht einem Löwen« gibt den Sinn im Deutschen natürlicher wieder.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »der in Verstecken sitzt«. Im Zusammenhang bezeichnet das Sitzen das Lauern im Hinterhalt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמְיֹנוֹ
  choice: Er gleicht
  rationale: Das hebräische Substantiv bezeichnet seine Ähnlichkeit beziehungsweise sein Abbild. Die direkte Vergleichsform gibt den Sinn im heutigen Deutsch natürlich wieder, ohne die schwerfällige Wendung »Seine Ähnlichkeit ist wie« zu übernehmen.
- source_word: כְּאַרְיֵה
  choice: einem Löwen
  rationale: Die Präposition כ markiert den Vergleich; zusammen mit »gleicht« verlangt die deutsche Formulierung den Dativ.
- source_word: יִכְסוֹף
  choice: begierig darauf ist
  rationale: Das Verb bezeichnet starkes Verlangen oder Sehnen. Im Bild eines Raubtiers bringt »begierig« die intensive Ausrichtung auf das Reißen der Beute treffend zum Ausdruck.
- source_word: לִטְרוֹף
  choice: Beute zu reißen
  rationale: טרף bezeichnet im Raubtierbild das Ergreifen oder Zerreißen von Beute. Das ergänzte »Beute« macht den im Verb enthaltenen Bezug im Deutschen verständlich.
- source_word: וְכִכְפִיר
  choice: einem jungen Löwen
  rationale: כפיר bezeichnet einen jungen Löwen. Die zweite Vergleichsphrase wird im Deutschen parallel an »Er gleicht« angeschlossen; ein zusätzliches »und« ist dafür nicht erforderlich.
- source_word: יֹשֵׁב
  choice: lauert
  rationale: Das Partizip bedeutet wörtlich »sitzt«, bezeichnet hier aber im Zusammenhang mit den Verstecken die Haltung eines Raubtiers im Hinterhalt. »Lauert« vermittelt diese kontextuelle Funktion natürlich.
- source_word: בְּמִסְתָּרִים
  choice: in Verstecken
  rationale: Der Plural bezeichnet verborgene Orte. »In Verstecken« bewahrt diese Mehrzahl und ist im modernen Deutsch klar.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Löwenmetapher bleibt anschaulich; die hebräische Nominalkonstruktion am Versanfang und das wörtliche »Sitzen« werden zugunsten natürlicher deutscher Ausdrucksweise idiomatisch wiedergegeben und in den Fußnoten offengelegt.
