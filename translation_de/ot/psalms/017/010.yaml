  yaml_path: translation/ot/psalms/017/010.yaml
  text: They close up their fat hearts[a]; with their mouths they speak arrogantly.
translation:
  language: de
  text: Sie verschließen ihr Herz[a]; mit ihrem Mund reden sie hochmütig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ihr Fett verschließen sie.“ „Fett“ ist hier wahrscheinlich bildlich gebraucht und kann ein abgestumpftes oder selbstzufriedenes Inneres bezeichnen. Sinngemäß auch: „Sie verhärten ihr Herz.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּמוֹ
  choice: ihr Fett
  rationale: Die wörtliche, im Hebräischen bewusst knappe Metapher bleibt erhalten. Ein ergänztes „Herz“ wäre verständlicher, ist im Ausgangstext jedoch nicht ausdrücklich genannt und würde die Bilddeutung im Haupttext festlegen.
- source_word: סָּגְרוּ
  choice: haben sie verschlossen
  rationale: Das Verb bezeichnet das Schließen oder Verschließen. Das Perfekt gibt die hebräische Form wieder und bezeichnet hier einen bestehenden Zustand beziehungsweise ein kennzeichnendes Verhalten.
- source_word: פִּימוֹ
  choice: mit ihrem Mund
  rationale: Die hebräische Form steht im Singular mit pluralischem Suffix; der kollektive Singular lässt sich im Deutschen natürlich als „mit ihrem Mund“ bewahren.
- source_word: דִּבְּרוּ
  choice: reden sie
  rationale: Das hebräische Perfekt kann in poetischer Charakterisierung gegenwärtige beziehungsweise wiederholte Geltung haben; deutsches Präsens passt zum beschreibenden Kontext.
- source_word: בְגֵאוּת
  choice: hochmütig
  rationale: Das Substantiv bezeichnet Stolz, Überheblichkeit oder Hochmut. Die adverbiale Wiedergabe ist im modernen Deutschen natürlich und erhält die negative Wertung.
