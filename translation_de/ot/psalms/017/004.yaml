base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/004.yaml
  text: As for the deeds of man[a], by the word of your lips I have kept myself from the paths of the violent.
translation:
  language: de
  text: 'Was die Taten der Menschen betrifft: Durch das Wort deiner Lippen habe ich mich vor den Pfaden des Gewalttätigen gehütet.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „habe ich die Pfade des Gewalttätigen bewacht“ oder „beobachtet“. Im Zusammenhang ist wahrscheinlich gemeint, dass der Beter sich von ihnen ferngehalten hat.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְעֻלּוֹת אָדָם
  choice: Was das Handeln der Menschen betrifft
  rationale: Die Präposition לְ führt hier wahrscheinlich den Themenbereich ein. „Handeln“ gibt פְעֻלּוֹת als menschliches Tun natürlich wieder; „der Menschen“ versteht אָדָם kollektiv und nicht als Bezeichnung eines bestimmten Mannes.
- source_word: בִּדְבַר שְׂפָתֶיךָ
  choice: Durch das Wort deiner Lippen
  rationale: בְּ wird instrumental verstanden. Die wörtliche Rede von Gottes „Lippen“ bewahrt das poetische Bild für sein gesprochenes Wort.
- source_word: שָׁמַרְתִּי
  choice: habe ich mich … gehütet
  rationale: שׁמר bedeutet grundsätzlich „bewahren, hüten, beachten“. Mit den „Pfaden des Gewalttätigen“ und im Zusammenhang der beteuerten Lauterkeit liegt hier ein Sich-Hüten beziehungsweise Fernhalten nahe; die Ergänzung „mich vor“ macht diesen Sinn im Deutschen verständlich.
- source_word: אָרְחוֹת
  choice: Pfade
  rationale: „Pfade“ erhält das poetische Bild eines Lebens- oder Verhaltenswegs.
- source_word: פָּרִיץ
  choice: des Gewalttätigen
  rationale: Das singularische פָּרִיץ bezeichnet einen gewalttätigen oder rücksichtslosen Menschen. Der Singular bleibt erhalten, ohne ihn auf eine bestimmte Person festzulegen.
theological_decisions:
- issue: Bedeutung der Wendung שָׁמַרְתִּי אָרְחוֹת פָּרִיץ
  choice: Der Beter hat sich durch Gottes Wort vor den gewalttätigen Wegen gehütet.
  alternative: Der Beter hat die Pfade des Gewalttätigen beachtet oder bewacht.
  rationale: Der Grundsinn von שׁמר lässt auch „bewahren“, „beachten“ oder „bewachen“ zu. Im Kontext der Bekräftigung seiner Lauterkeit ist jedoch das Meiden gewalttätiger Wege wahrscheinlicher. Die sprachliche Mehrdeutigkeit wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem poetischem Bild („Wort deiner Lippen“, „Pfade“). Der Doppelpunkt macht die thematische Einleitung verständlich, ohne die knappe hebräische Satzfügung unnötig auszubauen.
