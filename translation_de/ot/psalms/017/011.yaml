  yaml_path: translation/ot/psalms/017/011.yaml
  text: They have now surrounded our steps[c][b][a]; they set their eyes to cast us down to the ground.
translation:
  language: de
  text: Unsere Schritte – nun haben sie mich umringt.[a] Sie richten ihre Augen darauf, mich zu Boden zu beugen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht unvermittelt: „Unsere Schritte – nun haben sie mich umringt.“ Der Wechsel von „unsere“ zu „mich“ ist im masoretischen Text erhalten. „Unsere Schritte“ kann dabei auf den Weg oder die Bewegung der Betenden bezogen sein.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „Sie setzen ihre Augen, um zur Erde niederzubeugen.“ Das Objekt von „niederzubeugen“ wird nicht ausdrücklich genannt; aus dem Zusammenhang kann „mich“ oder „uns“ ergänzt werden. Auch „mich zu Boden zu werfen“ ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשֻּׁרֵינוּ
  choice: unsere Schritte
  rationale: Die konkrete poetische Vorstellung von Schritten wird bewahrt; zugleich bleibt der unvermittelte Wechsel vom Plural „unsere“ zum Singular „mich“ sichtbar.
- source_word: עַתָּה
  choice: jetzt
  rationale: Das Zeitadverb bezeichnet die gegenwärtige Bedrängnis knapp und natürlich.
- source_word: סבבוני
  choice: sie haben mich umringt
  rationale: Das Verb bezeichnet das Umgeben oder Einkreisen. Die Endung der masoretischen Form ist ausdrücklich 1. Person Singular („mich“) und wird trotz des vorausgehenden „unsere“ nicht geglättet.
- source_word: עֵינֵיהֶם יָשִׁיתוּ
  choice: Ihre Augen richten sie darauf
  rationale: Die Körpermetapher und die zielgerichtete feindliche Aufmerksamkeit bleiben erhalten; die deutsche Wendung ist verständlich, ohne das Bild aufzulösen.
- source_word: לִנְטוֹת
  choice: zu drücken
  rationale: נטה bedeutet grundsätzlich „neigen, beugen, ausstrecken“. Im feindlichen Zusammenhang mit „zu Boden“ bezeichnet es hier wahrscheinlich das Niederbeugen oder Niederdrücken; „drücken“ wahrt dieses Bild besser als das stärker deutende „stürzen“.
- source_word: בָּאָרֶץ
  choice: zu Boden
  rationale: אֶרֶץ bezeichnet hier am natürlichsten den Erdboden. Die idiomatische deutsche Fügung „zu Boden“ gibt die Bewegungsrichtung beziehungsweise das Ergebnis wieder.
