  text: קוּמָ֤/ה יְהוָ֗ה קַדְּמָ֣/ה פָ֭נָי/ו הַכְרִיעֵ֑/הוּ פַּלְּטָ֥/ה נַ֝פְשִׁ֗/י מֵ/רָשָׁ֥ע חַרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/013.yaml
  text: Rise up[a], O Yahweh; confront him, bring him low[b]; deliver my life from the wicked by your sword.
translation:
  language: de
  text: Steh auf, Jahwe! Tritt ihm entgegen, zwing ihn in die Knie! Rette mein Leben vor dem Gottlosen durch dein Schwert[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rette mein Leben vor dem Gottlosen, deinem Schwert.“ Der hebräische Wortlaut kann den Gottlosen auch als Schwert, also als Werkzeug in Jahwes Hand, darstellen.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Steh auf
  rationale: Der Imperativ von קום ist ein dringender Aufruf zum Eingreifen; „Steh auf“ ist natürlich, unmittelbar und nicht archaisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der persönliche Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: קַדְּמָה פָנָיו
  choice: Tritt ihm entgegen
  rationale: Wörtlich etwa „komm seinem Angesicht zuvor“; im feindlichen Zusammenhang bezeichnet die Wendung das direkte Entgegentreten.
- source_word: הַכְרִיעֵהוּ
  choice: zwing ihn in die Knie
  rationale: Der Hifil-Imperativ von כרע bedeutet, jemanden niederzubeugen beziehungsweise in die Knie zu zwingen. Die deutsche Wendung bewahrt das konkrete Bild und die kämpferische Dringlichkeit.
- source_word: פַּלְּטָה
  choice: Rette
  rationale: Der Imperativ von פלט verlangt Befreiung aus unmittelbarer Gefahr; „Rette“ ist im modernen Deutsch klar und kräftig.
- source_word: נַפְשִׁי
  choice: mein Leben
  rationale: נפש bezeichnet hier angesichts tödlicher Bedrohung das gefährdete Leben beziehungsweise die eigene Person, nicht ausdrücklich eine vom Körper getrennte Seele.
- source_word: מֵרָשָׁע
  choice: vor dem Gottlosen
  rationale: Der substantivierte Singular bezeichnet hier passend den einzelnen feindlichen Gegner; „Gottloser“ bewahrt die moralisch-religiöse Wertung von רשע.
- source_word: חַרְבֶּךָ
  choice: durch dein Schwert
  rationale: Die Hauptfassung versteht „dein Schwert“ instrumental als das Mittel, mit dem Jahwe rettet. Die syntaktisch mögliche appositionelle Deutung wird in der Fußnote erhalten.
theological_decisions:
- issue: Beziehung von חַרְבֶּךָ („dein Schwert“) zu מֵרָשָׁע („dem Gottlosen“)
  choice: 'Instrumental: Jahwe rettet den Beter durch sein Schwert.'
  alternative: 'Appositionell: Der Gottlose selbst ist Jahwes Schwert beziehungsweise Werkzeug.'
  rationale: Die knappe hebräische Wortfolge erlaubt beide Zuordnungen. Der Zusammenhang des Gebets um unmittelbares göttliches Eingreifen stützt die instrumentale Hauptfassung; die alternative Deutung berührt die Vorstellung göttlicher Wirksamkeit und bleibt deshalb ausdrücklich in der Fußnote stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen, dringlichen Imperativen. Das konkrete Bild des Niederbeugens wird in „zwing ihn in die Knie“ bewahrt. Der einzige Fußnotenmarker steht unmittelbar bei der mehrdeutigen Schlusswendung.
