  yaml_path: translation/ot/psalms/147/003.yaml
  text: He heals the brokenhearted and binds up their wounds[a].
translation:
  language: de
  text: Er heilt die Menschen mit gebrochenem Herzen und verbindet ihre Wunden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Schmerzen« oder »ihre Verletzungen«. Das hebräische Wort kann Verletzung oder Schmerz bezeichnen; »Wunden« wurde gewählt, weil es zum Bild des Verbindens passt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹפֵא
  choice: Er heilt
  rationale: Das Qal-Partizip bezeichnet hier im Lobzusammenhang Gottes kennzeichnendes, fortdauerndes Handeln; das deutsche Präsens gibt dies natürlich wieder.
- source_word: לִשְׁבוּרֵי לֵב
  choice: deren Herz zerbrochen ist
  rationale: Die hebräische Konstruktverbindung bedeutet wörtlich »die Zerbrochenen des Herzens«. Die gewählte Form bewahrt das konkrete Herzbild und klingt im modernen Deutschen natürlich und würdevoll.
- source_word: וּמְחַבֵּשׁ
  choice: und verbindet
  rationale: Das Partizip von חבש bezeichnet im Heilungszusammenhang das Verbinden beziehungsweise Bandagieren und erhält so das medizinische Bild.
- source_word: לְעַצְּבוֹתָם
  choice: ihre Wunden
  rationale: עַצֶּבֶת kann Schmerzen, Verletzungen oder Wunden bezeichnen. »Wunden« passt besonders gut zum Verb »verbindet«, ohne den durch den Parallelismus eingeschlossenen inneren Schmerz auszuschließen.
theological_decisions:
- issue: Reichweite des Heilungsbildes
  choice: Die Verbindung von innerem Zerbruch und konkreter Wundversorgung bleibt erhalten.
  alternative: Den Vers ausschließlich auf seelischen Trost oder ausschließlich auf körperliche Heilung beziehen.
  rationale: Der Parallelismus verbindet das zerbrochene Herz mit dem Verbinden von Wunden. Die Übersetzung wahrt diese Spannung und engt die Aussage nicht lehrmäßig ein.
translation_notes:
  register: Modernes Standarddeutsch in einem klaren, würdevollen Lobpreisregister. Die medizinische Metaphorik bleibt konkret, während der emotionale Bezug des zerbrochenen Herzens gewahrt wird.
