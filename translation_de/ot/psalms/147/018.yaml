source:
  edition: WLC
  text: יִשְׁלַ֣ח דְּבָר֣/וֹ וְ/יַמְסֵ֑/ם יַשֵּׁ֥ב ר֝וּח֗/וֹ יִזְּלוּ מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/018.yaml
  text: He sends out his word and melts them; he makes his wind blow[a], and the waters flow.
translation:
  language: de
  text: Er sendet sein Wort und lässt sie schmelzen; er lässt seinen Wind[a] wehen, und die Wasser fließen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „seinen Geist“ oder „seinen Atem“. Das hebräische Wort kann alle diese Bedeutungen haben; zum Wetterbild passt hier „Wind“ am besten.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: sendet
  rationale: Das Qal-Imperfekt beschreibt hier Gottes charakteristisches Handeln. „Sendet“ gibt die konkrete Verbalbedeutung knapp und natürlich wieder.
- source_word: דְּבָרוֹ
  choice: sein Wort
  rationale: דָּבָר kann „Wort“, „Sache“ oder „Befehl“ bedeuten. „Sein Wort“ bewahrt die poetische Ausdrucksweise und lässt die befehlende Wirksamkeit mitschwingen, ohne sie festzulegen.
- source_word: וַיְמְסֵם
  choice: und lässt sie schmelzen
  rationale: Die Hifil-Form mit pluralischem Objektsuffix bezeichnet das Verursachen des Schmelzens. Das Pronomen „sie“ bewahrt den impliziten Rückbezug auf die gefrorenen Erscheinungen des vorigen Verses.
- source_word: יַשֵּׁב
  choice: lässt … wehen
  rationale: 'Das Hifil von נשׁב hat kausative Bedeutung: Gott lässt den Wind wehen. Diese Formulierung ist im Deutschen idiomatisch und erhält die göttliche Verursachung.'
- source_word: רוּחוֹ
  choice: seinen Wind
  rationale: רוּחַ kann „Wind“, „Atem“ oder „Geist“ bedeuten. Im unmittelbaren Wetterbild von Schmelzen und fließendem Wasser ist „Wind“ die naheliegendste Bedeutung; die weiteren Möglichkeiten werden in der Fußnote erhalten.
- source_word: יִזְּלוּ
  choice: fließt
  rationale: נזל bezeichnet das Fließen oder Strömen von Flüssigkeit. Der deutsche Singular folgt dem grammatisch singularischen Kollektiv „Wasser“, während die Bedeutung des hebräischen Pluralverbs gewahrt bleibt.
- source_word: מָיִם
  choice: das Wasser
  rationale: Das hebräische מַיִם hat eine formal plurale Gestalt, wird im modernen Deutschen in diesem Zusammenhang jedoch natürlich als kollektiver Singular „das Wasser“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von רוּחוֹ als Ausdruck göttlichen Wirkens
  choice: seinen Wind
  alternative: seinen Geist; seinen Atem
  rationale: 'Der Zusammenhang schildert Gottes Herrschaft über das Wetter: Sein Wort bewirkt das Schmelzen, sein Wind weht, und Wasser fließt. „Wind“ passt daher am besten, ohne eine pneumatologische Deutung einzutragen. Die semantische Offenheit des hebräischen Wortes bleibt durch die Fußnote sichtbar.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. „Da fließt das Wasser“ gibt die eintretende Folge anschaulich wieder. Der pronominale Rückbezug „sie“ bleibt wie im Hebräischen unausgeführt und verweist auf die gefrorenen Erscheinungen des vorherigen Verses.
