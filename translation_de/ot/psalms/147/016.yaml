source:
  edition: WLC
  text: הַ/נֹּתֵ֣ן שֶׁ֣לֶג כַּ/צָּ֑מֶר כְּ֝פ֗וֹר כָּ/אֵ֥פֶר יְפַזֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/016.yaml
  text: He gives snow like wool[a]; he scatters frost like ashes.
translation:
  language: de
  text: Er gibt Schnee wie Wolle; Raureif streut er wie Asche aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: Er gibt
  rationale: Das Qal-Partizip beschreibt in der hymnischen Folge Gottes fortdauerndes, charakteristisches Handeln. Das finite Präsens ist im Deutschen natürlich und bewahrt diesen Sinn.
- source_word: שֶׁלֶג
  choice: Schnee
  rationale: Die übliche lexikalische Bedeutung passt ohne Einschränkung in den Zusammenhang.
- source_word: כַּצָּמֶר
  choice: wie Wolle
  rationale: Das vergleichende כְּ wird als »wie« wiedergegeben; das Bild kann sowohl die weiße Farbe als auch die weiche, deckende Erscheinung des Schnees aufrufen.
- source_word: כְּפוֹר
  choice: Raureif
  rationale: Das Substantiv bezeichnet Frost beziehungsweise genauer einen sichtbaren Reifbelag. »Raureif« erhält das konkrete poetische Bild und entspricht dem Vergleich mit ausgestreuter Asche.
- source_word: כָּאֵפֶר
  choice: wie Asche
  rationale: Das vergleichende כְּ bildet eine klare poetische Gleichsetzung; »Asche« ist im Deutschen als Stoffbezeichnung idiomatisch.
- source_word: יְפַזֵּר
  choice: streut er … aus
  rationale: Das Piel-Imperfekt von פזר bezeichnet das Zerstreuen oder Ausbreiten. »ausstreuen« bewahrt das anschauliche Bild einer über die Fläche verteilten Substanz.
theological_decisions: []
