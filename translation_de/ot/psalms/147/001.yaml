source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ כִּי ט֭וֹב זַמְּרָ֣ה אֱלֹהֵ֑י/נוּ כִּֽי נָ֝עִים נָאוָ֥ה תְהִלָּֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/001.yaml
  text: Praise Yah[a], for it is good to sing praises to our God[b]; for it is pleasant and praise is fitting.
translation:
  language: de
  text: Lobt Jah[a]! Denn es ist gut, unserem Gott zu singen; denn es ist angenehm und Lobpreis ist angemessen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Jah«, die Kurzform des Gottesnamens; viele Übersetzungen geben sie mit »der HERR« wieder.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Lobpreis ist schön« beziehungsweise »Lobpreis ist geziemend«. Das hebräische Wort kann sowohl Schönheit als auch Angemessenheit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: Lobt
  rationale: Der pluralische Imperativ von הלל wird als unmittelbare, natürliche Aufforderung wiedergegeben.
- source_word: יָהּ
  choice: Jah
  rationale: Die Kurzform des Gottesnamens wird transliteriert; so bleiben die hebräische Form und der Bezug zu »Halleluja« erkennbar.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier jeweils die Aufforderung zum Lob; »denn« passt zum gehobenen, aber heutigen Register.
- source_word: טוֹב
  choice: gut
  rationale: Bewahrt die breite positive Wertung, ohne sie auf Schönheit oder angenehmes Empfinden zu verengen.
- source_word: זַמְּרָה
  choice: zu singen
  rationale: Die musikalische Bedeutung von זמר wird natürlich wiedergegeben; der Gegenstand des Singens ist durch »unserem Gott« und den Lobkontext hinreichend deutlich.
- source_word: אֱלֹהֵינוּ
  choice: unserem Gott
  rationale: Direkte Wiedergabe der Form mit Suffix der ersten Person Plural; der Dativ ergibt sich aus der deutschen Konstruktion »jemandem singen«.
- source_word: נָעִים
  choice: wohltuend
  rationale: Gibt die angenehme, erfreuliche Qualität in natürlichem Deutsch wieder und vermeidet die mögliche Verwechslung von »angenehm« mit bloßer Bequemlichkeit.
- source_word: נָאוָה
  choice: angemessen
  rationale: Drückt aus, dass Lob passend, geziemend oder angebracht ist; die ebenfalls mögliche ästhetische Nuance wird in einer Fußnote bewahrt.
- source_word: תְהִלָּה
  choice: Lobpreis
  rationale: Bezeichnet das an Gott gerichtete Lob und klingt im Deutschen als selbstständiges Substantiv natürlicher und eindeutiger als das bloße »Lob«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יָהּ
  choice: Jah
  alternative: der HERR
  rationale: Der Ausgangstext verwendet die Kurzform יָהּ und nicht das Tetragramm יהוה. Die Transliteration wahrt diese Unterscheidung sowie den hörbaren Zusammenhang mit »Halleluja«.
- issue: Bedeutung von נָאוָה
  choice: angemessen
  alternative: schön / wohlanständig
  rationale: Das Wort kann sowohl ästhetische Schönheit als auch Schicklichkeit oder Angemessenheit bezeichnen. Im Haupttext steht die im Kontext gut passende Bedeutung »angemessen«; die andere Nuance wird nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit psalmtypischem Aufforderungston. Die Wiederholung von »denn« bildet die zweifache Begründungsstruktur des Hebräischen ab. Die Interpunktion gliedert den knappen poetischen Parallelismus, ohne zusätzliche Aussagen einzuführen.
