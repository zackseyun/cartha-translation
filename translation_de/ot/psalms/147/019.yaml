lexical_decisions:
- source_word: מַגִּיד
  choice: verkündet
  rationale: Das Hifil-Partizip von נגד bezeichnet das Bekanntmachen oder Verkünden. „Verkündet“ bewahrt den Charakter einer ausdrücklichen Mitteilung und passt zum gehobenen poetischen Register.
- source_word: דברו
  choice: sein Wort
  rationale: דָּבָר kann „Wort“, „Sache“ oder „Botschaft“ bedeuten. Im Parallelismus mit Satzungen und Rechtsentscheiden wahrt „sein Wort“ den umfassenden bundesbezogenen Sinn.
- source_word: לְיַעֲקֹב
  choice: Jakob
  rationale: Die Präposition ל kennzeichnet den Empfänger. Der Name wird entsprechend dem hebräischen Parallelismus ohne erklärenden Zusatz wiedergegeben.
- source_word: חֻקָּיו
  choice: seine Satzungen
  rationale: חֹק bezeichnet festgesetzte Bestimmungen oder Satzungen. „Satzungen“ ist im Deutschen ein verständlicher, etablierter Ausdruck für verbindliche Vorschriften.
- source_word: וּמִשְׁפָּטָיו
  choice: und seine Rechtsentscheide
  rationale: מִשְׁפָּטִים kann im rechtlich-bundesbezogenen Zusammenhang richterliche Entscheidungen, Rechtsbestimmungen oder Ordnungen bezeichnen. „Rechtsentscheide“ erhält den juristischen Bezug, ohne den Ausdruck allgemein zu „Geboten“ zu verengen.
- source_word: לְיִשְׂרָאֵל
  choice: Israel
  rationale: Israel steht parallel zu Jakob und bezeichnet kollektiv das Bundesvolk; die direkte Namensform bewahrt die poetische Gestalt.
theological_decisions:
- issue: Kollektiver Sinn von Jakob und Israel
  choice: Beide Namen werden unmittelbar als „Jakob“ und „Israel“ wiedergegeben.
  alternative: „dem Volk Jakob … Israel“ oder „den Nachkommen Jakobs … Israel“
  rationale: Der hebräische Text verwendet die Bundesnamen selbst. Eine direkte Wiedergabe erhält den Parallelismus und vermeidet eine unnötige Ausdeutung.
- issue: Bedeutungsbreite von מִשְׁפָּטִים
  choice: „Rechtsentscheide“ im Haupttext, mit Alternativen in der Fußnote
  alternative: „Rechtsbestimmungen“, „Ordnungen“ oder „Rechtssprüche“
  rationale: Der Kontext ist rechtlich und bundesbezogen. Keine einzelne deutsche Entsprechung deckt die gesamte Bedeutungsbreite ab; die Fußnote bewahrt diese Offenheit.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischem Zeilenparallelismus. Die Satzstellung stellt die beiden Empfängerbezeichnungen und die zugehörigen Gaben einander klar gegenüber; das im Hebräischen nur einmal ausgedrückte Verb gilt auch für die zweite Zeile.
