lexical_decisions:
- source_word: בּוֹנֵה
  choice: baut … wieder auf
  rationale: Das Qal-Partizip von בנה bezeichnet hier ein fortdauerndes bzw. charakteristisches Handeln. Im Zusammenhang der Sammlung Israels bringt „wieder aufbauen“ den Wiederherstellungsaspekt natürlich zum Ausdruck; das im Hebräischen nicht ausdrücklich markierte „wieder“ wird deshalb in einer Fußnote offengelegt.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Der Ortsname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die geläufige deutsche Umschrift.
- source_word: נִדְחֵי
  choice: die Vertriebenen
  rationale: Die Form von נדח bezeichnet Menschen, die fortgetrieben, verstoßen oder zerstreut wurden. „Die Vertriebenen“ bewahrt den Gedanken erzwungener Entfernung, ohne ihn auf eine formelle Deportation zu verengen.
- source_word: יִשְׂרָאֵל
  choice: Israels
  rationale: Die hebräische Genitivverbindung wird im Deutschen idiomatisch durch den vorangestellten bestimmten Ausdruck und den Genitiv „Israels“ wiedergegeben.
- source_word: יְכַנֵּס
  choice: sammelt er
  rationale: Das Piel-Imperfekt von כנס bedeutet „sammeln, zusammenbringen“. Die Nachstellung des Pronomens erhält den poetischen Nachdruck auf „die Vertriebenen Israels“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. Die Umschrift „Jahwe“ bewahrt diesen Unterschied gegenüber dem Titel „Herr“.
- issue: Wiederherstellung Jerusalems
  choice: baut Jerusalem wieder auf
  alternative: baut Jerusalem
  rationale: Der Kontext legt den Wiederaufbau beziehungsweise die Wiederherstellung nahe, doch das Adverb „wieder“ steht nicht ausdrücklich im Hebräischen. Die Übersetzung macht den Kontextbezug lesbar und weist zugleich per Fußnote auf die formal engere Alternative hin.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der erste Halbvers ist flüssig und restaurativ formuliert; im zweiten bewahrt die markierte Wortstellung den poetischen Fokus des Hebräischen.
