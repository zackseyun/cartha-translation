source:
  edition: WLC
  text: הַֽ/מְכַסֶּ֬ה שָׁמַ֨יִם בְּ/עָבִ֗ים הַ/מֵּכִ֣ין לָ/אָ֣רֶץ מָטָ֑ר הַ/מַּצְמִ֖יחַ הָרִ֣ים חָצִֽיר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/008.yaml
  text: who covers the heavens with clouds[a], who prepares rain for the earth, who makes grass sprout on the mountains.
translation:
  language: de
  text: 'der den Himmel mit Wolken bedeckt,

    der Regen für die Erde bereitet,

    der Gras auf den Bergen sprießen lässt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְכַסֶּה
  choice: bedeckt
  rationale: Das Partizip von כסה bezeichnet ein Bedecken oder Verhüllen. „Bedeckt“ gibt Gottes Wirken am Himmel direkt und natürlich wieder.
- source_word: שָׁמַיִם
  choice: den Himmel
  rationale: שָׁמַיִם kann den Himmel beziehungsweise das Himmelsgewölbe bezeichnen. Der deutsche Singular „den Himmel“ ist in diesem Wetterkontext idiomatisch und bewahrt den gehobenen poetischen Ton.
- source_word: עָבִים
  choice: Wolken
  rationale: Das Wort bezeichnet Wolken, mitunter dichte Wolken. Der Kontext verlangt jedoch keine ausdrückliche Wiedergabe ihrer Dichte.
- source_word: מֵּכִין
  choice: bereitet
  rationale: Der Hifil von כון kann „bereiten“, „bereitmachen“ oder „feststellen“ bedeuten. Bei Regen für die Erde drückt „bereitet“ die zielgerichtete Versorgung knapp und quellennah aus.
- source_word: לָאָרֶץ
  choice: für die Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Der umfassende Zusammenhang von Himmel und Wetter spricht hier für „Erde“.
- source_word: מָטָר
  choice: Regen
  rationale: „Regen“ ist die übliche und im poetischen Zusammenhang natürliche Entsprechung.
- source_word: מַּצְמִיחַ
  choice: sprießen lässt
  rationale: 'Der Hifil von צמח ist kausativ: Er bewirkt, dass etwas sprießt oder wächst. „Sprießen lässt“ bewahrt diese Kausalität und klingt im Deutschen natürlich.'
- source_word: הָרִים
  choice: den Bergen
  rationale: הָרִים bezeichnet gewöhnlich Berge; eine Abschwächung zu „Hügeln“ ist nicht erforderlich.
- source_word: חָצִיר
  choice: Gras
  rationale: חָצִיר bezeichnet Gras oder grünen Bewuchs. „Gras“ ist hier klar, prägnant und idiomatisch.
theological_decisions:
- issue: Göttliches Handeln in einer Kette von Partizipien
  choice: Die Folge der Relativsätze wird mit wiederholtem „der“ beibehalten.
  alternative: 'Selbstständige Sätze mit finiten Verben: „Er bedeckt … er bereitet … er lässt …“'
  rationale: Die hebräischen Partizipien beschreiben Gottes charakteristisches, fortdauerndes Handeln und knüpfen syntaktisch an den vorausgehenden Kontext an. Die wiederholten Relativsätze erhalten diese poetische Verbindung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. „Den Himmel“ ist gegenüber dem im Deutschen ungebräuchlicheren Plural „die Himmel“ idiomatischer. Die drei Zeilen bewahren die anaphorische Struktur des Hebräischen.
