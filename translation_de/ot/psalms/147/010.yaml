  yaml_path: translation/ot/psalms/147/010.yaml
  text: He does not delight in the strength of the horse; he takes no pleasure in the legs of the man.
translation:
  language: de
  text: Er hat keine Freude an der Kraft des Pferdes; an den Beinen des Mannes hat er kein Gefallen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְצֶה / יֶחְפָּץ
  choice: hat Gefallen / hat Freude
  rationale: Die beiden weitgehend parallelen Verben werden mit zwei natürlichen deutschen Wendungen wiedergegeben, ohne ihren gemeinsamen Sinn künstlich zu unterscheiden.
- source_word: בִגְבוּרַת הַסּוּס
  choice: an der Kraft des Pferdes
  rationale: Bewahrt das konkrete Bild militärischer Stärke und folgt der hebräischen Genitivverbindung.
- source_word: בְשׁוֹקֵי הָאִישׁ
  choice: an den Schenkeln des Mannes
  rationale: שׁוֹק bezeichnet hier die kräftigen Unterschenkel beziehungsweise Schenkel; die konkrete Körpermetapher für menschliche Leistungsfähigkeit bleibt erhalten. Der bestimmte Artikel wird als »des Mannes« wiedergegeben.
theological_decisions:
- issue: Gegenstand göttlichen Wohlgefallens
  choice: Die Aussage bleibt bei Pferdekraft und menschlicher Körperkraft als Gegenständen, an denen Gott keinen Gefallen hat.
  alternative: Eine ausdeutende Wiedergabe wie »militärische Macht« und »menschliche Stärke«
  rationale: Der Parallelismus legt diese Bedeutung nahe, doch die Übersetzung bewahrt die konkreten Bilder und nimmt die Auslegung nicht vorweg.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die konkreten Kraftbilder des Hebräischen bleiben erhalten; die variierte Wortwahl vermeidet unnötige Eintönigkeit.
