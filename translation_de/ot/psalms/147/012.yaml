  text: שַׁבְּחִ֣י יְ֭רוּשָׁלִַם אֶת יְהוָ֑ה הַֽלְלִ֖י אֱלֹהַ֣יִ/ךְ צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/012.yaml
  text: Praise Yahweh[a], O Jerusalem; praise your God, O Zion.
translation:
  language: de
  text: Preise Jahwe, Jerusalem! Lobe deinen Gott, Zion!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁבְּחִי
  choice: Preise
  rationale: Der feminine Singularimperativ richtet sich an die personifiziert angesprochene Stadt. „Preise“ ist natürlich und würdevoll und bewahrt die Parallelität zu הַֽלְלִי.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Der Eigenname folgt der üblichen deutschen Form und fungiert als direkte Anrede.
- source_word: אֶת יְהוָה
  choice: den HERRN
  rationale: אֶת kennzeichnet das direkte Objekt; der Gottesname יהוה wird nach verbreiteter deutscher Bibeltradition als „der HERR“ wiedergegeben, während eine Fußnote die hebräische Namensform nennt.
- source_word: הַֽלְלִי
  choice: Lobe
  rationale: Der feminine Singularimperativ bildet mit שַׁבְּחִי einen synonymen poetischen Parallelismus. „Lobe“ erhält sowohl die Aufforderung als auch die leichte lexikalische Variation.
- source_word: אֱלֹהַיִךְ
  choice: deinen Gott
  rationale: Die Form mit Suffix der 2. Person feminin Singular bezeichnet den Gott Zions; „deinen Gott“ ist die klare und idiomatische Wiedergabe.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der traditionelle deutsche Eigenname steht parallel zu „Jerusalem“ und wird wie eine Person direkt angeredet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: Die Hauptzeile folgt der im deutschen Bibelgebrauch etablierten Ersatzlesung „der HERR“. Die Fußnote macht transparent, dass im Hebräischen der Eigenname JHWH steht, der häufig als „Jahwe“ wiedergegeben wird; so wird die Quellenlage nicht verdeckt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit dichterischer Würde. Die beiden femininen Singularimperative werden als direkte Anrede der personifizierten Orte wiedergegeben. Unterschiedliche Verben („Preise“, „Lobe“) spiegeln die synonymen, aber lexikalisch verschiedenen hebräischen Verben.
