source:
  edition: WLC
  text: עֱנ֣וּ לַ/יהוָ֣ה בְּ/תוֹדָ֑ה זַמְּר֖וּ לֵ/אלֹהֵ֣י/נוּ בְ/כִנּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/007.yaml
  text: Sing to Yahweh with thanksgiving[b][a]; make melody to our God with the lyre.
translation:
  language: de
  text: Singt Yahweh ein Danklied; spielt unserem Gott auf der Leier.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Antwortet Yahweh mit Dank.« Das hebräische Verb bedeutet gewöhnlich »antworten« oder »erwidern«, kann hier aber responsorisches Singen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell auch: »Harfe«; gemeint ist ein Saiteninstrument, genauer wohl eine Leier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֱנוּ
  choice: Singt
  rationale: Das Qal von ענה bedeutet grundsätzlich »antworten/erwidern«, kann im musikalischen Zusammenhang jedoch responsorisches Singen bezeichnen. Der Parallelismus mit זַמְּרוּ legt hier »Singt« nahe; die Grundbedeutung bleibt in der Fußnote sichtbar.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: ל bezeichnet die Ausrichtung bzw. den Adressaten des Gesangs; der Gottesname יהוה wird als »Yahweh« wiedergegeben.
- source_word: בְּתוֹדָה
  choice: mit Dank
  rationale: תּוֹדָה bezeichnet Dank beziehungsweise dankendes Lob. »Mit Dank« gibt die begleitende oder modale Funktion von ב knapp und natürlich wieder.
- source_word: זַמְּרוּ
  choice: spielt
  rationale: זמר bezeichnet musizierendes Gotteslob und kann Gesang wie Instrumentalspiel einschließen. Da ausdrücklich die Leier genannt wird, gibt »spielt« den instrumentalen Aspekt natürlich wieder, ohne »singt« zu wiederholen.
- source_word: לֵאלֹהֵינוּ
  choice: unserem Gott
  rationale: ל kennzeichnet den Adressaten des Musizierens; das Possessivsuffix wird gemeinschaftlich als »unserem« bewahrt.
- source_word: בְכִנּוֹר
  choice: auf der Leier
  rationale: כִּנּוֹר bezeichnet ein Saiteninstrument, am ehesten eine Leier. Im Deutschen ist bei Instrumenten »auf der Leier spielen« idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der persönliche Gottesname wird transparent als »Yahweh« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עֱנוּ im gottesdienstlich-musikalischen Kontext
  choice: Singt
  alternative: Antwortet
  rationale: Der Parallelismus und der musikalische Kontext sprechen für Singen, möglicherweise in responsorischer Form. Die lexikalische Spannung zur Grundbedeutung »antworten« wird durch eine Fußnote bewahrt.
translation_notes:
  register: Moderne, verständliche und zugleich würdige Psalmsprache. Die beiden parallelen Aufforderungen werden im Deutschen durch »Singt« und »spielt« klar unterschieden; die echte Mehrdeutigkeit des ersten Verbs wird nicht eingeebnet, sondern in der Fußnote dokumentiert.
