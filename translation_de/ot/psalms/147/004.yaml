  source_fidelity: 'Die Übersetzung gibt die beiden hebräischen Aussageglieder sachgerecht wieder: מוֹנֶה מִסְפָּר לַכּוֹכָבִים ist idiomatisch treffend als „Er zählt die Sterne“ gefasst; dies beinhaltet die im Hebräischen hervorgehobene vollständige Erfassung ihrer Zahl. לְכֻלָּם und die Wendung שֵׁמוֹת יִקְרָא werden mit „er ruft sie alle mit Namen“ vollständig und ohne sachliche Einengung wiedergegeben.'
