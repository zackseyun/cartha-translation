  text: מוֹנֶ֣ה מִ֭סְפָּר לַ/כּוֹכָבִ֑ים לְ֝/כֻלָּ֗/ם שֵׁמ֥וֹת יִקְרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/004.yaml
  text: He counts the number of the stars; he calls all of them by name.
translation:
  language: de
  text: Er zählt die Sterne; er ruft sie alle mit Namen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹנֶה מִסְפָּר לַכּוֹכָבִים
  choice: Er zählt die Sterne
  rationale: Die Verbindung bezeichnet das Zählen beziehungsweise genaue Erfassen der Zahl der Sterne. Im Deutschen ist „die Sterne zählen“ natürlich und gibt den Sinn vollständig wieder; „die Zahl der Sterne zählen“ wäre unnötig schwerfällig.
- source_word: לְכֻלָּם
  choice: sie alle
  rationale: 'Die Form betont ausnahmslose Vollständigkeit: Jeder einzelne Stern ist einbezogen.'
- source_word: שֵׁמוֹת יִקְרָא
  choice: ruft … mit Namen
  rationale: קרא mit שֵׁמוֹת kann hier das individuelle Rufen oder Benennen ausdrücken. „Mit Namen rufen“ bewahrt diese mögliche Bedeutungsbreite und klingt in gehobener, moderner Standardsprache natürlich.
theological_decisions:
- issue: Nur aus dem Zusammenhang erschlossener göttlicher Satzgegenstand
  choice: „Er“ als Subjekt, auf Gott im Kontext bezogen
  alternative: Den Gottesnamen ausdrücklich einsetzen
  rationale: Im hebräischen Vers steht kein eigenes Subjektnomen. Das Pronomen führt das Subjekt des Zusammenhangs fort, ohne den Gottesnamen ergänzend in den Vers einzutragen.
- issue: Bedeutung von קרא im Zusammenhang mit den Namen der Sterne
  choice: „ruft sie alle mit Namen“
  alternative: „gibt ihnen allen Namen“
  rationale: Der Ausdruck kann sowohl das Benennen als auch das Rufen bei Namen anklingen lassen. Die gewählte Fassung erhält die persönliche, umfassende Aussage und legt sich nicht unnötig auf einen bloßen Benennungsakt fest.
translation_notes:
  register: Knappes, würdevolles poetisches Deutsch. Der Parallelismus der beiden Halbverse bleibt erhalten; auf eine erklärende Erweiterung wie „die Zahl der Sterne“ wird zugunsten natürlicher deutscher Ausdrucksweise verzichtet.
