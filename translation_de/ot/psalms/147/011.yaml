  text: רוֹצֶ֣ה יְ֭הוָה אֶת יְרֵאָ֑י/ו אֶת הַֽ/מְיַחֲלִ֥ים לְ/חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/011.yaml
  text: Yahweh delights in those who fear him[b][a], in those who hope for his steadfast love.
translation:
  language: de
  text: Jahwe hat Gefallen an denen, die ihn fürchten, an denen, die auf seine beständige Liebe[a] hoffen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Beständige Liebe“ gibt das hebräische chesed wieder, das je nach Zusammenhang auch Güte, Erbarmen und treue Verbundenheit bezeichnen kann.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die auf seine beständige Liebe warten“. Das hebräische Verb kann sowohl erwartungsvolles Warten als auch Hoffen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוֹצֶה
  choice: hat Gefallen an
  rationale: Das Partizip von רצה bezeichnet hier wohlwollendes Gefallen, nicht bloß einen Willensentschluss. „Hat Gefallen an“ ist würdig, verständlich und entspricht dem poetischen Lobkontext.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יְרֵאָיו
  choice: die ihn fürchten
  rationale: Die Form bezeichnet Menschen, deren Haltung von Gottesfurcht geprägt ist. „Fürchten“ bewahrt die Spannung zwischen Ehrfurcht und Furcht, ohne sie auf bloßen Respekt zu verengen.
- source_word: הַמְיַחֲלִים
  choice: die … hoffen
  rationale: יחל kann erwartungsvolles Warten und Hoffen ausdrücken. Im Deutschen ist „auf … hoffen“ in dieser Konstruktion natürlich und bringt die zuversichtliche Erwartung klar zum Ausdruck.
- source_word: לְחַסְדּוֹ
  choice: auf seine beständige Liebe
  rationale: חסד verbindet Liebe, Güte, Loyalität und Verlässlichkeit. „Beständige Liebe“ bewahrt den Beziehungscharakter und die Dauerhaftigkeit, ohne den Ausdruck auf Barmherzigkeit oder einen ausdrücklich genannten Bund zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Umschrift „Jahwe“ bewahrt ihn als persönlichen Namen.
- issue: Bedeutungsumfang der Gottesfurcht
  choice: die ihn fürchten
  alternative: die ihn verehren
  rationale: „Fürchten“ erhält die echte biblische Spannung des Ausdrucks; „verehren“ würde den möglichen Furchtaspekt abschwächen.
- issue: Bedeutungsumfang von חסד
  choice: beständige Liebe
  alternative: Gnade / treue Liebe / Bundestreue
  rationale: Die gewählte Formulierung bewahrt sowohl Liebe als auch Verlässlichkeit. „Bundestreue“ wäre an dieser Stelle stärker deutend, während „Gnade“ den Begriff verengen könnte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelstruktur. Der Gottesname bleibt als „Jahwe“ stehen; theologisch spannungsreiche Begriffe werden nicht geglättet.
