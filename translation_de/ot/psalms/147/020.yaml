  text: לֹ֘א עָ֤שָׂה כֵ֨ן לְ/כָל גּ֗וֹי וּ/מִשְׁפָּטִ֥ים בַּל יְדָע֗וּ/ם הַֽלְלוּ יָֽהּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/020.yaml
  text: He has not done so for any nation; they have not known his judgments[a]. Praise Yah!
translation:
  language: de
  text: So hat er es für kein Volk getan; seine Rechtsbestimmungen kennen sie nicht. Lobt Jah![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Halleluja!“ Hebräisch halelu-jah, wörtlich: „Lobt Jah!“, mit der Kurzform des Gottesnamens.'
    reason: Lexikalische Alternative und Erklärung der traditionellen Wiedergabe.
lexical_decisions:
- source_word: לֹא עָשָׂה כֵן לְכָל גּוֹי
  choice: So hat er an keinem anderen Volk gehandelt
  rationale: Die vorangestellte Wendung „So“ nimmt das zuvor geschilderte besondere Handeln Gottes auf. Im verneinten Satz gibt „an keinem anderen Volk“ den Sinn idiomatisch wieder; „anderen“ verdeutlicht den impliziten Vergleich mit Israel.
- source_word: וּמִשְׁפָּטִים
  choice: seine Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet hier die Israel gegebenen verbindlichen Rechtsordnungen. „Rechtsbestimmungen“ bewahrt die rechtliche Bedeutung, ohne den Ausdruck auf bloße Gerichtsurteile zu verengen; das Possessivpronomen ergibt sich sinngemäß aus dem pronominalen Objekt am folgenden Verb.
- source_word: בַּל יְדָעוּם
  choice: kennen sie nicht
  rationale: Das poetische בַּל wird schlicht verneinend wiedergegeben. ידע bedeutet primär „kennen“; das angehängte Objektpronomen bezieht sich auf die Rechtsbestimmungen und wird im Deutschen durch deren Voranstellung aufgenommen.
- source_word: הַלְלוּ יָהּ
  choice: Lobt Jah!
  rationale: Der Pluralimperativ wird transparent mit „Lobt“ übersetzt; יָהּ ist die Kurzform des Gottesnamens und wird als „Jah“ transliteriert.
theological_decisions:
- issue: Wiedergabe der Kurzform des Gottesnamens יָהּ
  choice: Jah
  alternative: Halleluja! / Lobt den HERRN!
  rationale: Der hebräische Text hat ausdrücklich die Kurzform יָהּ. „Jah“ bewahrt diese Form und macht zugleich den Inhalt des Aufrufs הַלְלוּ („Lobt!“) verständlich, statt beides in der traditionellen Lehnform „Halleluja“ zusammenzuziehen oder die Kurzform zu „HERR“ zu erweitern.
- issue: Reichweite der Aussage über die Völker
  choice: an keinem anderen Volk
  alternative: an keinem Volk / an irgendeinem Volk
  rationale: Die Aussage hebt im Zusammenhang Israels besondere Offenbarung hervor. „anderen“ macht den im Hebräischen kontextuell vorausgesetzten Gegensatz verständlich, ohne über den Aussagegehalt hinaus eine weitergehende theologische Behauptung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der beiden Aussagen bleibt erhalten; „Rechtsbestimmungen“ ist verständlich und zugleich rechtlich präzise. Der Fußnotenmarker steht unmittelbar nach dem Schlussruf.
