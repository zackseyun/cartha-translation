  text: גָּד֣וֹל אֲדוֹנֵ֣י/נוּ וְ/רַב כֹּ֑חַ לִ֝/תְבוּנָת֗/וֹ אֵ֣ין מִסְפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/005.yaml
  text: Great is our Lord[a], and abundant in power; his understanding is beyond number.
translation:
  language: de
  text: Groß ist unser Herr und reich an Kraft; seine Einsicht ist unermesslich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: Für seine Einsicht gibt es keine Zahl; auch: Seine Einsicht ist nicht zu zählen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: Groß
  rationale: Das vorangestellte Prädikatsadjektiv bewahrt die hebräische Wortfolge und den feierlichen Lobpreischarakter.
- source_word: אֲדֹנֵינוּ
  choice: unser Herr
  rationale: אֲדוֹן ist hier ein Herrschaftstitel mit dem Suffix der ersten Person Plural, nicht der Gottesname JHWH.
- source_word: וְרַב כֹּחַ
  choice: und reich an Kraft
  rationale: רַב bezeichnet hier ein hohes Maß oder eine Fülle; „reich an Kraft“ ist natürliches Deutsch und gibt כֹּחַ als Fähigkeit und Macht wieder.
- source_word: לִתְבוּנָתוֹ
  choice: seine Einsicht
  rationale: תְּבוּנָה kann Einsicht, Verständnis oder Urteilsvermögen bezeichnen. „Einsicht“ ist verständlich und passt zur Aussage über Gottes unbegrenztes Erkennen.
- source_word: אֵין מִסְפָּר
  choice: ist unermesslich
  rationale: Die wörtliche Wendung „es gibt keine Zahl“ bezeichnet etwas, das sich nicht beziffern lässt. „Unermesslich“ gibt den Sinn idiomatisch wieder; die Bildsprache des Zählens bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנֵינוּ
  choice: unser Herr
  alternative: unser Gebieter
  rationale: „Herr“ ist die übliche deutsche Wiedergabe des Titels und unterscheidet ihn weiterhin vom Gottesnamen JHWH.
- issue: Aussage über Gottes תְּבוּנָה
  choice: seine Einsicht ist unermesslich
  alternative: für seine Einsicht gibt es keine Zahl
  rationale: Die Übersetzung wahrt die Aussage unbegrenzter göttlicher Einsicht, ohne sie philosophisch näher zu bestimmen; die formnähere Alternative wird als Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die eröffnende Inversion „Groß ist unser Herr“ bewahrt den doxologischen Nachdruck; der Parallelismus bleibt knapp und gut sprechbar.
