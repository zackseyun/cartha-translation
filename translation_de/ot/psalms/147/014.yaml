  text: הַ/שָּׂם גְּבוּלֵ֥/ךְ שָׁל֑וֹם חֵ֥לֶב חִ֝טִּ֗ים יַשְׂבִּיעֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/014.yaml
  text: He makes your borders peaceful[a]; he satisfies you with the finest wheat.
translation:
  language: de
  text: Er schafft Frieden an deinen Grenzen; er sättigt dich mit dem Besten des Weizens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mit dem Fett des Weizens«; eine hebräische Bezeichnung für den reichsten oder besten Weizen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂם
  choice: Er schenkt
  rationale: Das Partizip von שׂים bedeutet hier »setzen, schaffen, bewirken«. In Verbindung mit Frieden gibt »schenkt« die bewirkende göttliche Zuwendung natürlich wieder.
- source_word: גְּבוּלֵךְ
  choice: deinen Grenzen
  rationale: גְּבוּל kann Grenze, Grenzgebiet oder Gebiet bezeichnen. Der feminine Singularsuffix bezieht sich auf das angesprochene Jerusalem; der deutsche Plural »Grenzen« ist in diesem Zusammenhang idiomatisch.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: שָׁלוֹם umfasst Frieden, Wohlergehen und Sicherheit. »Frieden« bewahrt den zentralen Begriff und passt natürlich zur Wendung »den Grenzen Frieden schenken«.
- source_word: חֵלֶב חִטִּים
  choice: dem Besten des Weizens
  rationale: Wörtlich »Fett des Weizens«; חֵלֶב bezeichnet idiomatisch den reichsten oder besten Anteil. »Das Beste des Weizens« vermittelt dieses Bild verständlich, ohne Weizen allgemein zu »Getreide« abzuschwächen.
- source_word: יַשְׂבִּיעֵךְ
  choice: er sättigt dich
  rationale: Der Hifil von שׂבע bedeutet »sättigen« oder »zur Genüge geben«. »Sättigt dich« erhält sowohl das konkrete Bild der Nahrung als auch den Gedanken reichlicher Versorgung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit parallelem Satzbau. Die feminine Anrede Jerusalems ist im deutschen Pronomen »dich« nicht eigens markiert. Die hebräische Bildsprache wird im Haupttext idiomatisch wiedergegeben und in der Fußnote offengelegt.
