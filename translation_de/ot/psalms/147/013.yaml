  text: כִּֽי חִ֭זַּק בְּרִיחֵ֣י שְׁעָרָ֑יִ/ךְ בֵּרַ֖ךְ בָּנַ֣יִ/ךְ בְּ/קִרְבֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/013.yaml
  text: For he has strengthened the bars of your gates[b][a]; he has blessed your children within you.
translation:
  language: de
  text: Denn er hat die Riegel deiner Tore stark gemacht; er hat deine Kinder[a] in deiner Mitte[b] gesegnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Söhne“. Das hebräische Wort kann männliche Nachkommen oder allgemeiner Kinder beziehungsweise Nachkommen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in deiner Mitte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aufforderung zum Lob ein und bewahrt den kausalen Zusammenhang.
- source_word: חִזַּק
  choice: hat … stark gemacht
  rationale: Das Piel-Perfekt bezeichnet ein bewirktes Stärken oder Festmachen. Die Formulierung ist im Deutschen natürlich und bewahrt den Aspekt vollendeten Handelns.
- source_word: בְּרִיחֵי
  choice: die Riegel
  rationale: Bezeichnet die Quer- oder Sperrriegel, mit denen Tore gesichert werden. „Riegel“ ist präzise, ohne die Bauart unnötig festzulegen.
- source_word: שְׁעָרָיִךְ
  choice: deiner Tore
  rationale: Der feminine Singularsuffix richtet sich an die personifizierte Stadt Jerusalem; die deutsche Anrede bewahrt dies ohne Ergänzung des Ortsnamens.
- source_word: בֵּרַךְ
  choice: hat … gesegnet
  rationale: Gibt das Piel-Perfekt von ברך direkt und idiomatisch wieder.
- source_word: בָּנַיִךְ
  choice: deine Kinder
  rationale: בנים kann männliche Nachkommen oder kollektiv Kinder beziehungsweise Einwohner bezeichnen. Im städtischen Zusammenhang passt die umfassendere Wiedergabe, während die engere Möglichkeit in einer Fußnote erhalten bleibt.
- source_word: בְּקִרְבֵּךְ
  choice: in deiner Mitte
  rationale: Gibt die räumliche Wendung קרב mit femininem Singularsuffix eng am Hebräischen wieder und erhält die personifizierte Anrede.
theological_decisions:
- issue: Personifizierte feminine Singularadressatin
  choice: Die Stadt wird unmittelbar mit „deiner“ angesprochen, ohne ihren Namen im Vers einzufügen.
  alternative: Jerusalem oder Zion ausdrücklich als Adressatin nennen.
  rationale: Die femininen Singularsuffixe weisen auf die personifizierte Stadt aus dem Kontext. Eine ausdrückliche Namensnennung wäre eine nicht im Vers stehende Ergänzung.
- issue: Bedeutungsumfang von בנים im städtischen Kontext
  choice: deine Kinder
  alternative: deine Söhne
  rationale: Der Ausdruck kann männlich spezifisch oder kollektiv gebraucht sein. Im Zusammenhang der angesprochenen Stadt liegt die Bedeutung ihrer Kinder beziehungsweise Einwohner nahe; die echte lexikalische Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dichterischer Satzstruktur. Die feminine Anrede der personifizierten Stadt bleibt erhalten; keine Konfessionssprache oder auslegende Ergänzung wurde eingeführt.
