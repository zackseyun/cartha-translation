source:
  edition: WLC
  text: נוֹתֵ֣ן לִ/בְהֵמָ֣ה לַחְמָ֑/הּ לִ/בְנֵ֥י עֹ֝רֵ֗ב אֲשֶׁ֣ר יִקְרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/009.yaml
  text: He gives food to the animals[b][a], and to the young ravens that cry out.
translation:
  language: de
  text: Er gibt den Tieren ihre Nahrung und den jungen Raben, die rufen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die rufen«; der hebräische Text sagt nicht ausdrücklich, zu wem sie rufen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹתֵן
  choice: Er gibt
  rationale: Das Qal-Partizip steht im Lobzusammenhang prädikativ; das deutsche Präsens gibt den anhaltenden, gewöhnlichen Sinn natürlich wieder.
- source_word: לִבְהֵמָה
  choice: den Tieren
  rationale: בְּהֵמָה kann Tiere allgemein oder Vieh bezeichnen. Der Parallelismus mit den Raben spricht hier für den weiteren Sinn.
- source_word: לַחְמָהּ
  choice: ihre Nahrung
  rationale: לֶחֶם bedeutet wörtlich »Brot«, kann aber allgemein Nahrung bezeichnen. Bei Tieren ist »Nahrung« sachgemäß und natürlich; das Suffix wird mit »ihre« wiedergegeben.
- source_word: לִבְנֵי עֹרֵב
  choice: den jungen Raben
  rationale: בְּנֵי in Verbindung mit einer Tierbezeichnung bezeichnet häufig den Nachwuchs. »Junge Raben« ist idiomatisches modernes Deutsch.
- source_word: אֲשֶׁר יִקְרָאוּ
  choice: die rufen
  rationale: קרא bedeutet »rufen«. Da im Hebräischen kein Adressat genannt wird, bewahrt die knappe Wiedergabe die Offenheit des Ausgangstextes.
theological_decisions:
- issue: Ob ausdrücklich gesagt werden soll, dass die jungen Raben zu Gott rufen
  choice: 'Den Adressaten offenlassen: »die rufen«'
  alternative: »die zu ihm rufen« oder »wenn sie schreien«
  rationale: Der Zusammenhang stellt Gottes fürsorgliches Handeln heraus, doch der hebräische Relativsatz nennt keinen Adressaten. Die Übersetzung ergänzt ihn daher nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Nahrung« vermeidet das bei Tieren missverständliche wörtliche »Brot«; »rufen« bewahrt die im Hebräischen vorhandene Offenheit.
