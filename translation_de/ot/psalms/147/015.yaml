  text: He sends his command to the earth[b][a]; his word runs swiftly.
translation:
  language: de
  text: Er sendet seinen Befehl[a] auf die Erde; sein Wort läuft in großer Eile.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
