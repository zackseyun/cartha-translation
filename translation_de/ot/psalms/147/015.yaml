lexical_decisions:
- source_word: הַשֹּׁלֵחַ
  choice: Er sendet
  rationale: Das Partizip beschreibt hier Gottes fortdauerndes Handeln und wird im Deutschen natürlich als finites Verb wiedergegeben.
- source_word: אִמְרָתוֹ
  choice: seinen Befehl
  rationale: Das Wort bezeichnet eine Äußerung oder ein gesprochenes Wort. Im Zusammenhang mit Gottes wirksamem Reden in der Schöpfung bringt „Befehl“ die vollziehende Kraft zum Ausdruck und unterscheidet den Ausdruck zugleich von דְּבָרוֹ.
- source_word: אָרֶץ
  choice: zur Erde
  rationale: Der kosmische Zusammenhang des Psalms spricht für „Erde“ statt für das örtlich begrenztere „Land“; „zur Erde senden“ gibt die Richtung knapp und natürlich wieder.
- source_word: עַד מְהֵרָה
  choice: sehr schnell
  rationale: Die adverbiale Wendung hebt die hohe Geschwindigkeit hervor. „Sehr schnell“ gibt diese verstärkende Wirkung in verständlichem Deutsch wieder.
- source_word: יָרוּץ
  choice: läuft
  rationale: Die Grundbedeutung „laufen“ bewahrt das poetische Bild vom Wort Gottes, das sich rasch fortbewegt.
- source_word: דְּבָרוֹ
  choice: sein Wort
  rationale: „Wort“ ist hier die natürliche Wiedergabe und erhält zusammen mit „Befehl“ die bedeutungsnahe Variation der beiden hebräischen Ausdrücke für Gottes Rede.
theological_decisions:
- issue: Wesen der göttlichen Rede im poetischen Parallelismus
  choice: Gottes Rede wird als wirksamer Befehl und als Wort wiedergegeben, ohne spätere Lehrbegriffe in den Vers einzutragen.
  alternative: Beide hebräischen Substantive identisch mit „Wort“ übersetzen oder den Vers im Haupttext ausdrücklich christologisch deuten.
  rationale: Der Psalm spricht von Gottes machtvollem Reden in Schöpfung und Vorsehung. Diese Aussage bleibt erhalten, ohne eine ausdrückliche personale Logos-Deutung zu behaupten, die der hebräische Vers selbst nicht formuliert.
translation_notes:
  register: Modernes, klares und zugleich poetisch-würdevolles Standarddeutsch. Die Personifikation des laufenden Wortes bleibt bewusst erhalten.
