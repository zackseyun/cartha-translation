base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/017.yaml
  text: He throws down his ice like crumbs[b][a]; who can stand before his cold?
translation:
  language: de
  text: Er wirft sein Eis wie kleine Stücke[a] herab; wer kann vor seiner Kälte standhalten?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Bissen“ oder „wie Brotstücke“. Das hebräische Wort bezeichnet kleine abgebrochene Stücke, besonders auch Brotstücke.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Wer wird vor seiner Kälte stehen?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁלִיךְ
  choice: wirft … herab
  rationale: Das Hifil-Partizip beschreibt anschaulich, wie Gott etwas hinabwirft bzw. ausstreut; das Präsens passt zur poetischen Schilderung.
- source_word: קַרְחוֹ
  choice: sein Eis
  rationale: קֶרַח bezeichnet Eis oder Frost. Zusammen mit dem Verb des Werfens und dem Vergleich mit kleinen Stücken gibt „Eis“ das konkrete Bild am besten wieder.
- source_word: כְפִתִּים
  choice: wie Brotstücke
  rationale: פִּתִּים sind kleine Stücke oder Bissen, besonders abgebrochene Brotstücke. „Brotstücke“ bewahrt dieses Bild deutlicher als das im Deutschen leicht missverständliche „Krümel“.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die übliche räumliche Bedeutung „vor, angesichts von“ ist auch in der rhetorischen Frage natürlich.
- source_word: קָרָתוֹ
  choice: seiner Kälte
  rationale: קָרָה bezeichnet Kälte; das Possessivsuffix wird bewahrt und stellt die Kälte als unter Gottes Verfügung stehend dar.
- source_word: מִי יַעֲמֹד
  choice: wer kann … bestehen
  rationale: Wörtlich heißt die Wendung „wer wird stehen“. „Bestehen“ bewahrt das Bild des Standhaltens und drückt im Deutschen idiomatisch die gemeinte Widerstandsfähigkeit aus.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Sprache. „Brotstücke“ macht den hebräischen Vergleich verständlich, ohne das Bild zu verallgemeinern; „bestehen“ hält die Spannung zwischen wörtlichem Stehen und dem Sinn des Standhaltens aufrecht.
