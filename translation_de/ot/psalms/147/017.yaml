  naturalness: „Er wirft sein Eis wie Brotstücke herab“ ist verständlich und poetisch tragfähig. Die Wendung „vor seiner Kälte bestehen“ wirkt im heutigen Standarddeutsch weniger idiomatisch als „vor seiner Kälte standhalten“.
