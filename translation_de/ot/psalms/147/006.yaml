id: PSA.147.6
reference: Psalms 147:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מְעוֹדֵ֣ד עֲנָוִ֣ים יְהוָ֑ה מַשְׁפִּ֖יל רְשָׁעִ֣ים עֲדֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/006.yaml
  text: Yahweh lifts up the humble[b][a]; he brings the wicked down to the ground.
translation:
  language: de
  text: Jahwe richtet die Demütigen auf[a]; die Frevler drückt er zu Boden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stützt die Gebeugten“ beziehungsweise „stärkt die Bedrängten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „erniedrigt er bis zur Erde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעוֹדֵד
  choice: richtet … auf
  rationale: Das Partizip bezeichnet ein Stärken, Stützen oder Wiederaufrichten. „Richtet … auf“ bewahrt im Deutschen den Gegensatz zum anschließenden Niederdrücken und schließt den Gedanken hilfreicher Stärkung ein.
- source_word: עֲנָוִים
  choice: die Demütigen
  rationale: Das Wort kann demütige, sanftmütige oder durch Bedrängnis erniedrigte Menschen bezeichnen. „Die Demütigen“ wahrt den ethisch-sozialen Gegensatz zu den Frevlern, ohne die Bedeutung auf bloße Armut oder Bedrängnis zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen üblichen Form wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: מַשְׁפִּיל
  choice: drückt … zu Boden
  rationale: Die Kausativform bedeutet, jemanden niedrig zu machen oder zu erniedrigen. Die deutsche Wendung gibt die aktive Bewegung nach unten wieder und bildet einen klaren Gegensatz zu „richtet … auf“.
- source_word: רְשָׁעִים
  choice: die Frevler
  rationale: „Frevler“ bezeichnet im würdigen Sprachregister der Psalmen Menschen, die schuldhaft und gottwidrig handeln, ohne den Ausdruck unnötig auszuweiten.
- source_word: עֲדֵי אָרֶץ
  choice: zu Boden
  rationale: Die Wendung bedeutet wörtlich „bis zur Erde“ und verstärkt das Erniedrigen. „Zu Boden“ gibt das räumliche Bild idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Die Übersetzung bewahrt ihn in der geläufigen deutschen Schreibweise, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von עֲנָוִים
  choice: die Demütigen
  alternative: die Gebeugten / die Bedrängten
  rationale: Der Ausdruck verbindet häufig eine innere Haltung der Demut mit einer gesellschaftlich bedrängten oder erniedrigten Lage. Der Haupttext gibt die moralische Seite wieder; die Fußnote hält die soziale Bedeutungsnuance offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. „Richtet … auf“ und „drückt … zu Boden“ machen den antithetischen Aufbau des hebräischen Verses hörbar; die Fußnoten bewahren die lexikalische Spannweite.
