base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/004.yaml
  text: 'These things I remember[a], and I pour out my soul within me: how I used to pass along with the throng, leading them to the house of God with the sound of joyful shouting and thanksgiving[b], a festal multitude.'
translation:
  language: de
  text: 'Daran erinnere ich mich und schütte meine Seele in mir aus: wie ich mit der Schar[a] dahinzog und sie zum Haus Gottes führte[b], unter lautem Jubel und Dank einer feiernden Menge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Festzug“. Das hebräische Wort בַּסָּךְ ist schwer zu deuten und kann die versammelte Festgemeinde oder den Prozessionszug bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und mit ihnen zum Haus Gottes ging“. Das seltene hebräische Verb אֶדַּדֵּם kann „sie führen/geleiten“ oder „mit ihnen gehen“ bedeuten; seine genaue Nuance ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֶזְכְּרָה
  choice: Daran erinnere ich mich
  rationale: Das pluralische Demonstrativum verweist auf die folgenden Erinnerungsinhalte. Im Deutschen gibt „daran“ diesen Rückbezug natürlicher wieder als das steife „Diese Dinge“; die Verbform wird im gegenwärtigen, reflektierenden Sinn verstanden.
- source_word: וְאֶשְׁפְּכָה עָלַי נַפְשִׁי
  choice: und schütte mein Herz aus
  rationale: Wörtlich steht „meine Seele über/auf mir ausschütten“. Die deutsche Redewendung „sein Herz ausschütten“ vermittelt den inneren Klagevorgang verständlich und würdig, ohne einen räumlichen Sinn von עָלַי zu erzwingen.
- source_word: כִּי אֶעֱבֹר
  choice: wie ich … dahinzog
  rationale: כִּי leitet hier den Inhalt der Erinnerung ein. Das Imperfekt beschreibt im rückblickenden Zusammenhang den früheren, wiederholten Gang; „dahinzog“ bewahrt zugleich die Bewegung einer Prozession.
- source_word: בַּסָּךְ
  choice: mit der Schar
  rationale: Das seltene und schwierige Substantiv bezeichnet im Kontext wahrscheinlich die versammelte Fest- oder Prozessionsgemeinschaft. Da auch Deutungen wie „im Zug“ möglich sind, wird die Unsicherheit in Fußnote [a] offengelegt.
- source_word: אֶדַּדֵּם
  choice: und sie … führte
  rationale: Das seltene Verb mit dem Suffix „sie“ bezeichnet wahrscheinlich ein Führen oder Geleiten der Gruppe. Wegen seiner unsicheren genauen Nuance nennt Fußnote [b] die Alternative „mit ihnen ging“.
- source_word: עַד בֵּית אֱלֹהִים
  choice: zum Haus Gottes
  rationale: Die Richtungsangabe wird im Wallfahrts- und Prozessionskontext natürlich mit „zum“ wiedergegeben; „Haus Gottes“ bewahrt die Tempelbezeichnung des Hebräischen.
- source_word: בְּקוֹל רִנָּה וְתוֹדָה
  choice: unter lautem Jubel und Dank
  rationale: קוֹל hebt den hörbaren Klang hervor, רִנָּה den freudigen Jubelruf und תוֹדָה den Dank beziehungsweise das Danklob. Die Formulierung gibt die hörbare Feststimmung in natürlichem Deutsch wieder.
- source_word: הָמוֹן חוֹגֵג
  choice: eine festlich feiernde Menge
  rationale: הָמוֹן bezeichnet eine große Menschenmenge; חוֹגֵג beschreibt sie als eine ein Fest begehende Gemeinschaft. Die Wiedergabe erhält sowohl den kollektiven als auch den kultisch-festlichen Sinn.
