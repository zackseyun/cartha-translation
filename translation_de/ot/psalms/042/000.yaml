base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/000.yaml
  text: For the choirmaster[a]. A Maskil[b] of the sons of Korah[c].
translation:
  language: de
  text: Für den Chorleiter[a]. Ein Maskil[b] von den Söhnen Korachs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „An den Chorleiter.“ Die hebräische Präposition kann in Psalmüberschriften sowohl mit „für“ als auch mit „an“ wiedergegeben werden.'
    reason: alternative_reading
  - marker: b
    text: „Maskil“ ist ein Fachbegriff in Psalmüberschriften, dessen genaue Bedeutung unsicher ist. Vorgeschlagen wurden unter anderem „Lehrgedicht“, „Betrachtung“ und „kunstvolles Lied“.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „für die Söhne Korachs“. Die Überschrift kann auf Urheberschaft, Zugehörigkeit oder die vorgesehenen Ausführenden hinweisen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Der Ausdruck bezeichnet in Psalmüberschriften herkömmlich den musikalischen Leiter. „Für“ gibt die wahrscheinlich bestimmende oder zuweisende Funktion der Präposition ל wieder; „Chorleiter“ ist knapp und verständlich.
- source_word: מַשְׂכִּיל
  choice: ein Maskil
  rationale: Die genaue Bedeutung dieses Fachbegriffs in Psalmüberschriften ist unsicher. Die Transliteration vermeidet eine ungesicherte Festlegung auf „Lehrgedicht“, „Betrachtung“ oder „kunstvolles Lied“.
- source_word: לִבְנֵי
  choice: von den Söhnen
  rationale: Die Präposition ל kann hier Urheberschaft, Zugehörigkeit oder Zuweisung bezeichnen. „Von“ ist die herkömmliche knappe Wiedergabe, während eine Fußnote die echte Mehrdeutigkeit offenlegt.
- source_word: קֹרַח
  choice: Korach
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
