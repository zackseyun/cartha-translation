  source_fidelity: 'Die Hauptfassung gibt die hebräische Satzstruktur und die zentralen Lexeme zuverlässig wieder: יְצַוֶּה bleibt als starkes »gebietet«, חַסְדּוֹ als »seine treue Liebe«, und לְאֵל חַיָּי als »zum Gott meines Lebens«. Die offene, poetisch auffällige Vorstellung wird nicht paraphrasiert. Für die adverbial-generiche Zeitangabe יוֹמָם / וּבַלַּיְלָה ist jedoch »bei Tag … bei Nacht« genauer als »am Tag … in der Nacht«.'
