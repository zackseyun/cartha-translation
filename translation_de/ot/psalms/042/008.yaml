  text: יוֹמָ֤ם יְצַוֶּ֬ה יְהוָ֨ה חַסְדּ֗/וֹ וּ֭/בַ/לַּיְלָה שיר/ה עִמִּ֑/י תְּ֝פִלָּ֗ה לְ/אֵ֣ל חַיָּֽ/י׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/008.yaml
  text: By day Yahweh commands his steadfast love[b][a], and at night his song is with me— a prayer to the God of my life.
translation:
  language: de
  text: Bei Tag gebietet Yahweh seine treue Liebe, und bei Nacht ist sein Lied[b] bei mir – ein Gebet zum Gott meines Lebens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu dem Gott, der mir Leben gibt«. Wörtlicher lautet das Hebräische: »zum Gott meines Lebens«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Bei mir ist ein Lied, ein Gebet zu ihm«. Die Hauptfassung versteht die hebräische Form als »sein Lied«.'
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹמָם
  choice: Am Tag
  rationale: Die adverbiale Zeitangabe wird knapp und natürlich wiedergegeben und bildet mit »in der Nacht« ein poetisches Paar.
- source_word: יְצַוֶּה
  choice: befiehlt
  rationale: Das Piel von צוה bezeichnet gewöhnlich ein Befehlen oder Anordnen. Die bewusst kühne Aussage, dass Yahweh seiner Liebe gebietet, bleibt so erhalten.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: חַסְדּוֹ
  choice: seine treue Liebe
  rationale: חסד verbindet Liebe und Güte mit Beständigkeit und Loyalität. »Treue Liebe« gibt diese Bedeutungsbreite in heutigem Deutsch knapp wieder.
- source_word: וּבַלַּיְלָה
  choice: und in der Nacht
  rationale: Die Zeitangabe steht parallel zu »Am Tag«; die Konjunktion wird ohne unnötige adversative Deutung als »und« wiedergegeben.
- source_word: שירה
  choice: sein Lied
  rationale: 'Die Form wird entsprechend der masoretischen morphologischen Analyse mit einem Suffix der dritten Person Singular verstanden: das von Gott kommende oder ihm gehörende Lied.'
- source_word: עִמִּי
  choice: ist … bei mir
  rationale: Die im Hebräischen nominale Wendung benötigt im Deutschen ein Kopulaverb. »Bei mir« bewahrt den Gedanken begleitender Gegenwart.
- source_word: תְּפִלָּה
  choice: ein Gebet
  rationale: Das Substantiv erläutert appositionell das zuvor genannte Lied.
- source_word: לְאֵל
  choice: zum Gott
  rationale: Die Präposition ל bezeichnet hier die Ausrichtung des Gebets auf Gott; zusammen mit dem folgenden Genitiv ist »zum Gott meines Lebens« idiomatisch und formnah.
- source_word: חַיָּי
  choice: meines Lebens
  rationale: Die Form mit Suffix der ersten Person bezeichnet idiomatisch »mein Leben«. Die genitivische Formulierung des Hebräischen bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von חַיָּי in לְאֵל חַיָּי
  choice: zum Gott meines Lebens
  alternative: zu dem Gott, der mir Leben gibt
  rationale: חַיָּי ist hier »mein Leben« und nicht das Adjektiv »lebendig«. Die gewählte Fassung bewahrt die offene genitivische Beziehung, während die Alternative sie als Lebensspende deutet.
- issue: Deutung von שירה
  choice: sein Lied
  alternative: ein Lied für ihn
  rationale: Die masoretische Analyse als Form mit Suffix stützt »sein Lied«. Da die Konsonantenfolge auch anders verstanden werden kann, wird die alternative Deutung in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. Das ungewöhnliche Bild »befiehlt … seine treue Liebe« wird bewusst nicht geglättet; die Gedankenstrichkonstruktion kennzeichnet »ein Gebet« als Erläuterung des Liedes.
