  terminology: »Yahweh«, »treue Liebe«, »Lied«, »Gebet« und »Gott meines Lebens« sind sachgerecht. Die Fußnote zur alternativen Deutung von שירה sollte die alternative Satzauffassung vollständiger wiedergeben, statt nur die isolierte, im Deutschen etwas zu enge Formulierung »ein Lied für ihn« zu bieten.
