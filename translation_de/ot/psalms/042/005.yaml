  verdict: revise
  source_fidelity: Der Vers ist bis zur Schlusswendung treffend wiedergegeben. Die vorliegende WLC-Lesart endet mit יְשׁוּעוֹת פָּנָיו („Rettungen seines Angesichts“) und enthält weder „meines Angesichts“ noch „und mein Gott“. Der deutsche Entwurf folgt darin zu Recht dem hebräischen Text statt der widersprüchlichen englischen Audit-Fassung. Seine Umschreibung „die von seinem Angesicht kommt“ legt jedoch eine Herkunftsrelation fest, die die knappe hebräische Konstruktverbindung nicht ausdrücklich behauptet, und gibt den Plural als Singular wieder.
  naturalness: „Warum bist du niedergeschlagen, meine Seele, und warum bist du so aufgewühlt in mir?“ ist modernes, poetisch angemessenes Deutsch. „Rettungen seines Angesichts“ ist bewusst ungewohnt, aber als bibelpoetische, quellentreue Schlusswendung vertretbar; die Fußnote erschließt sie.
  terminology: „Seele“, „hoffe auf Gott“, „preisen“ und „Angesicht“ sind registergerecht und theologisch nicht überbestimmt. Die Formulierung soll den Plural von יְשׁוּעוֹת und das Bild von פָּנָיו im Text bewahren, ohne es als „Gegenwart“ oder als von Gottes Angesicht ausgehende Rettung einseitig auszudeuten.
