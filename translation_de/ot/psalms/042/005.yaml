revisions:
- from: Warum bist du niedergeschlagen, meine Seele, und warum bist du so aufgewühlt in mir? Hoffe auf Gott! Denn ich werde ihn noch preisen – für die Rettung, die von seinem Angesicht kommt.[a]
  to: Warum bist du niedergeschlagen, meine Seele, und warum bist du so aufgewühlt in mir? Hoffe auf Gott! Denn ich werde ihn noch preisen für die Rettungen seines Angesichts.[a]
  rationale: Die Revision beschränkt sich auf die Schlusswendung. Sie bewahrt Plural und Bildsprache des Masoretentextes und vermeidet die interpretierende Ergänzung „die von ... kommt“. Das zur natürlichen deutschen Anbindung ergänzte „für“ ist weniger semantisch festlegend als eine Herkunftsbehauptung. Die englische Audit-Abweichung wird nicht übernommen, da der Originaltext maßgeblich ist.
