source:
  edition: WLC
  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וַ/תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֥וֹד אוֹדֶ֗/נּוּ יְשׁוּע֥וֹת פָּנָֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him, the salvation of my countenance and my God.
translation:
  language: de
  text: Warum bist du niedergeschlagen, meine Seele, und warum bist du so aufgewühlt in mir? Hoffe auf Gott! Denn ich werde ihn noch preisen für die Rettungen seines Angesichts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Rettungen seines Angesichts“. Der Plural kann mehrere Rettungen oder die Fülle rettender Hilfe bezeichnen. Gottes „Angesicht“ kann seine zugewandte Gegenwart meinen.'
    reason: Die knappe hebräische Wendung ist mehrdeutig und bewahrt eine auffällige Plural- und Bildsprache, die eine flüssigere deutsche Umschreibung leicht einseitig festlegt.
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: bist du niedergeschlagen
  rationale: Das Verb bezeichnet ein Sich-Niederbeugen oder Niedersinken. „Niedergeschlagen“ bewahrt das Bild des Gedrücktseins und bezeichnet zugleich natürlich den seelischen Zustand.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: In der Selbstanrede bezeichnet נֶפֶשׁ das innere Selbst. „Meine Seele“ erhält den poetischen und nach innen gerichteten Charakter, ohne eine bestimmte Lehre vom Menschen vorauszusetzen.
- source_word: וַתֶּהֱמִי
  choice: bist du so aufgewühlt
  rationale: Das Verb kann Lärmen, Tosen oder innere Unruhe bezeichnen. „Aufgewühlt“ gibt die innere Erregung im Deutschen anschaulich und natürlich wieder.
- source_word: עָלָי
  choice: in mir
  rationale: Wörtlich steht „über/auf mir“. Im Zusammenhang der Selbstanrede bezeichnet die Wendung die Unruhe, die den Sprecher innerlich erfasst; „in mir“ ist dafür die natürliche deutsche Formulierung.
- source_word: הוֹחִילִי
  choice: Hoffe
  rationale: Der Imperativ fordert zu vertrauensvollem, erwartungsvollem Warten auf. „Hoffe“ bringt beide Aspekte knapp zum Ausdruck.
- source_word: לֵאלֹהִים
  choice: auf Gott
  rationale: Im Deutschen lautet die idiomatische Verbindung „auf Gott hoffen“; sie gibt Gott als Ziel und Grund der Erwartung wieder.
- source_word: עוֹד
  choice: noch
  rationale: Das Adverb blickt trotz der gegenwärtigen Not auf künftiges Lob voraus. „Noch“ bewahrt diesen zuversichtlichen Gegensatz.
- source_word: אוֹדֶנּוּ
  choice: ich werde ihn noch preisen
  rationale: ידה im Hifil bedeutet hier, Gott lobend zu bekennen beziehungsweise ihm zu danken. „Preisen“ passt zum gottesdienstlichen und poetischen Zusammenhang.
- source_word: יְשׁוּעוֹת
  choice: Rettung
  rationale: Der hebräische Plural kann mehrere Rettungstaten oder eine umfassende Fülle von Hilfe ausdrücken. Der Singular „Rettung“ ist im deutschen Satz natürlich; die Pluralform wird in der Fußnote offengelegt.
- source_word: פָּנָיו
  choice: von seinem Angesicht kommt
  rationale: Wörtlich „sein Angesicht“; gemeint sein kann die rettende Hilfe, die aus Gottes zugewandter Gegenwart hervorgeht. „Angesicht“ bewahrt das hebräische Bild, während die ergänzte Wendung „von … kommt“ den knappen hebräischen Anschluss verständlich macht.
theological_decisions:
- issue: Deutung der knappen Schlusswendung יְשׁוּעוֹת פָּנָיו
  choice: für die Rettung, die von seinem Angesicht kommt
  alternative: die Rettungen seines Angesichts / die Hilfe seiner Gegenwart
  rationale: Der masoretische Text der vorgelegten Verszeile lautet wörtlich etwa „Rettungen seines Angesichts“ und enthält in dieser Zeile weder „meines Angesichts“ noch „mein Gott“. Die Übersetzung versteht die Wendung als Rettung, die von Gottes zugewandtem Angesicht beziehungsweise seiner Gegenwart ausgeht, kennzeichnet die Ergänzung aber durch eine Fußnote und lässt die ungewöhnliche Bildsprache sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Selbstanrede. „Niedergeschlagen“ und „aufgewühlt“ sind allgemein verständlich; „Angesicht“ wird bewusst als gehobenes, biblisch-poetisches Bild beibehalten und in der Fußnote erklärt.
