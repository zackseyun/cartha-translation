  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וּֽ/מַה תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֣וֹד אוֹדֶ֑/נּוּ יְשׁוּעֹ֥ת פָּ֝נַ֗/י וֵֽ/אלֹהָֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/011.yaml
  text: Why are you cast down[a], my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: de
  text: 'Warum bist du so niedergeschlagen, meine Seele, und warum bist du so aufgewühlt in mir? Harre auf Gott, denn ich werde ihn noch preisen: die Rettung meines Angesichts[a] und meinen Gott.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „die Rettungen meines Angesichts“; gemeint sein kann auch: „die Hilfe, die mein Angesicht aufrichtet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: bist du so niedergeschlagen
  rationale: Das Verb bezeichnet ein Sich-Niederbeugen oder Niedersinken. „Niedergeschlagen“ bewahrt das Bild und bezeichnet im modernen Deutschen zugleich den seelischen Zustand.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: In der Selbstanrede meint נֶפֶשׁ das innere Selbst. „Meine Seele“ erhält den poetischen und introspektiven Ton.
- source_word: תֶּהֱמִי
  choice: bist du so aufgewühlt
  rationale: Das Verb kann Lärmen, Tosen oder innere Unruhe ausdrücken. „Aufgewühlt“ gibt die heftige innere Bewegung natürlich wieder.
- source_word: עָלָי
  choice: in mir
  rationale: Wörtlich steht „über/auf mir“; im Zusammenhang bezeichnet die Wendung die den Sprecher erfüllende innere Unruhe. „In mir“ ist im Deutschen idiomatisch.
- source_word: הוֹחִילִי
  choice: Harre
  rationale: Die Form verbindet erwartungsvolles Warten mit Hoffnung. „Harre auf Gott“ bewahrt beide Aspekte in einer knappen, würdigen poetischen Form.
- source_word: עוֹד אוֹדֶנּוּ
  choice: ich werde ihn noch preisen
  rationale: עוֹד blickt über die gegenwärtige Not hinaus, und ידה bezeichnet hier lobendes Bekennen oder Danken. „Noch preisen“ bewahrt diese Zukunftsgewissheit.
- source_word: יְשׁוּעֹת פָּנַי
  choice: die Rettung meines Angesichts
  rationale: Die dichte hebräische Verbindung lautet wörtlich etwa „Rettungen meines Angesichts“. Der Singular „Rettung“ gibt den abstrakten Plural idiomatisch wieder, während „meines Angesichts“ das konkrete, im Deutschen jedoch gehobene Bild erhält.
- source_word: וֵאלֹהָי
  choice: und meinen Gott
  rationale: 'Die Akkusativform setzt die Apposition zu dem vorausgehenden Lobobjekt fort: Der Sprecher wird ihn, die Rettung seines Angesichts und seinen Gott, preisen. Die deutsche Kasusführung macht diesen Bezug deutlich.'
theological_decisions:
- issue: Bezug und Bedeutung von יְשׁוּעֹת פָּנַי וֵאלֹהָי
  choice: die Rettung meines Angesichts und meinen Gott
  alternative: die Hilfe, die mein Angesicht aufrichtet, und meinen Gott
  rationale: Der masoretische Text verbindet die Wendung syntaktisch mit dem, den der Beter preisen wird. Die Übersetzung erhält das ungewöhnliche Bild und löst nicht abschließend auf, ob Gottes Rettung das niedergeschlagene Angesicht hebt oder die Wendung allgemeiner seine rettende Hilfe bezeichnet.
translation_notes:
  register: Modernes Standarddeutsch mit würdig-poetischem Ton. „Harre“ und „Angesicht“ sind bewusst gehoben, aber verständlich; sie bewahren die knappe Bildsprache des hebräischen Psalms. Der Doppelpunkt verdeutlicht die Apposition nach „preisen“, ohne die Mehrdeutigkeit der ungewöhnlichen Wendung aufzulösen.
