base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/010.yaml
  text: As with a shattering in my bones[a], my adversaries taunt me, saying to me all day long, “Where is your God?”
translation:
  language: de
  text: 'Wie ein Zerschmettern in meinen Gebeinen verhöhnen mich meine Gegner, wenn sie den ganzen Tag zu mir sagen: »Wo ist dein Gott?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרֶצַח
  choice: wie ein Zerschmettern
  rationale: רֶצַח bezeichnet gewöhnlich Mord oder Tötung; in der schwierigen poetischen Verbindung mit »in meinen Gebeinen« beschreibt es bildhaft eine vernichtende, tief sitzende Verletzung oder einen zerschmetternden Schmerz. Die gewählte Fassung bewahrt die gewaltsame Bildsprache, ohne einen wörtlichen Mord zu behaupten.
- source_word: בְּעַצְמוֹתַי
  choice: in meinen Gebeinen
  rationale: Die Präposition lokalisiert die empfundene Verletzung im Innersten. »Gebeine« bewahrt das körperlich-poetische Bild und passt zum würdevollen Register eines Psalms.
- source_word: חֵרְפוּנִי
  choice: mich verhöhnen
  rationale: חרף bezeichnet Schmähung, Verhöhnung oder Vorwurf. Der folgende Ausspruch zeigt, dass hier spöttische, feindselige Rede gemeint ist.
- source_word: צוֹרְרָי
  choice: meine Gegner
  rationale: Das Partizip von צרר bezeichnet Menschen, die dem Beter feindlich entgegentreten. »Gegner« ist klar und lässt die genaue Art der Feindschaft offen.
- source_word: בְּאָמְרָם
  choice: indem sie ... sagen
  rationale: Die Konstruktion führt die Weise beziehungsweise den Inhalt der Verhöhnung ein. »Indem« macht deutlich, dass der folgende Satz den Hohn ausdrückt.
- source_word: אֵלַי
  choice: zu mir
  rationale: אֶל bezeichnet hier die Richtung der Rede zum Beter hin.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Die Wendung drückt anhaltende oder immer wiederkehrende Schmähung aus und ist im heutigen Deutsch natürlich.
- source_word: אַיֵּה אֱלֹהֶיךָ
  choice: Wo ist dein Gott?
  rationale: Die direkte Frage bewahrt die Schärfe der feindlichen Herausforderung, ohne eine Erklärung für Gottes scheinbare Abwesenheit hinzuzufügen.
theological_decisions:
- issue: Die Herausforderung der Gegner hinsichtlich Gottes
  choice: »Wo ist dein Gott?« bleibt als unbeantworteter Hohn stehen.
  alternative: »Wo ist denn dein Gott?« oder eine erklärende Ergänzung zu Gottes Gegenwart
  rationale: Der hebräische Text formuliert eine knappe, spöttische Frage. Die Übersetzung bewahrt die Spannung der Klage und deutet Gottes scheinbare Abwesenheit nicht konfessionell oder theologisch aus.
- issue: Deutung des gewaltsamen Bildes בְּרֶצַח בְּעַצְמוֹתַי
  choice: Bildhafte Wiedergabe als »Zerschmettern in meinen Gebeinen« mit Fußnote
  alternative: Wörtlicher »Mord in meinen Gebeinen« oder eindeutig »tödliche Wunde«
  rationale: Die hebräische Formulierung ist semantisch schwierig. Die Hauptfassung vermittelt tiefen, vernichtenden Schmerz, während die Fußnote die wörtlichere Deutung offenhält und so die echte Mehrdeutigkeit bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Klang. »Gebeine« ist bewusst etwas gehobener als »Knochen«, weil es das Psalmregister und die innere körperliche Bildsprache trägt. Die schwierige Anfangskonstruktion wird durch »ist es, wenn« idiomatisch gefasst, ohne die Bildspannung aufzulösen.
