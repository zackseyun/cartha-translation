source:
  edition: WLC
  text: אוֹמְרָ֤ה לְ/אֵ֥ל סַלְעִ/י֮ לָ/מָ֪ה שְׁכַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֵלֵ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/009.yaml
  text: I say to God[a], my rock, “Why have you forgotten me? Why do I go about mourning under the oppression of the enemy?”
translation:
  language: de
  text: 'Ich sage zu Gott, meinem Felsen: »Warum hast du mich vergessen? Warum gehe ich trauernd umher, bedrängt vom Feind?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Warum gehe ich düster umher unter der Bedrängnis des Feindes?«'
    reason: Das hebräische קֹדֵר kann sowohl »trauernd« als auch »düster« bedeuten; בְּלַחַץ lässt sich als Zustand unter Bedrängnis oder als bedrängende Einwirkung auffassen.
lexical_decisions:
- source_word: אוֹמְרָה
  choice: Ich sage
  rationale: Die Kohortativform kann Entschluss oder unmittelbares Sprechen ausdrücken. Im Klagezusammenhang führt »Ich sage« die direkte Anrede natürlich ein, ohne den möglichen volitiven Ton stark auszubauen.
- source_word: לְאֵל
  choice: zu Gott
  rationale: אֵל ist hier die allgemeine Gottesbezeichnung, nicht erkennbar ein Eigenname.
- source_word: סַלְעִי
  choice: meinem Felsen
  rationale: Die konkrete Metapher von Gott als festem Schutz und Halt bleibt erhalten.
- source_word: שְׁכַחְתָּנִי
  choice: hast du mich vergessen
  rationale: Das Perfekt mit Objektsuffix bezeichnet die als gegenwärtig wirksam empfundene Erfahrung des Vergessenseins; »verlassen« wäre interpretierend stärker als der hebräische Wortlaut.
- source_word: קֹדֵר
  choice: trauernd
  rationale: Das Partizip kann dunkel oder düster sein und daraus abgeleitet Trauer bezeichnen. »Trauernd« passt idiomatisch zur Klage, während die Grundbedeutung in der Fußnote erhalten bleibt.
- source_word: אֵלֵךְ
  choice: gehe ich … umher
  rationale: הלך bedeutet gehen; »umhergehen« gibt den fortdauernden Zustand in natürlichem Deutsch wieder.
- source_word: בְּלַחַץ
  choice: bedrängt von
  rationale: לַחַץ bezeichnet Druck oder Bedrängnis. Die knappe Formulierung gibt die belastende Einwirkung des Feindes natürlich wieder, ohne Ursache und Begleitumstand abschließend festzulegen.
- source_word: אוֹיֵב
  choice: vom Feind
  rationale: Der artikellose Singular ist in der Poesie generisch oder kollektiv verständlich; »der Feind« entspricht dem Klagekontext.
theological_decisions:
- issue: Gottesbezeichnung סַלְעִי als Metapher
  choice: meinem Felsen
  alternative: meinem Schutz / meiner Felsenklippe
  rationale: Die Metapher wird nicht in eine abstrakte Aussage aufgelöst. So bleibt die Spannung bestehen, dass der Beter gerade den als sicheren Felsen bekannten Gott wegen seines empfundenen Vergessens anklagt.
- issue: Klage über Gottes Vergessen
  choice: Warum hast du mich vergessen?
  alternative: Warum hast du mich verlassen?
  rationale: Die scharfe Erfahrungsrede der Klage bleibt ungemildert stehen; zugleich wird sie nicht durch das stärkere »verlassen« über den Wortlaut hinaus zugespitzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener Bildsprache und direkter Klagerede. Die Syntax ist flüssig, ohne die poetische Spannung zwischen »meinem Felsen« und »vergessen« zu glätten.
