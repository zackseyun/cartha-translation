  text: צָמְאָ֬ה נַפְשִׁ֨/י לֵ/אלֹהִים֮ לְ/אֵ֪ל חָ֥י מָתַ֥י אָב֑וֹא וְ֝/אֵרָאֶ֗ה פְּנֵ֣י אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/002.yaml
  text: My soul thirsts for God[a], for the living God. When shall I come and appear before God?
translation:
  language: de
  text: Meine Seele dürstet nach Gott, nach dem lebendigen Gott. Wann werde ich kommen und vor Gottes Angesicht erscheinen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָמְאָה
  choice: dürstet
  rationale: Das Verb bezeichnet konkreten Durst. „Dürstet“ bewahrt das starke poetische Bild und lässt im Deutschen einen gegenwärtig andauernden Zustand erkennen.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נפשׁ kann die Seele, das Leben oder die ganze Person bezeichnen. „Meine Seele“ bewahrt hier die hebräische Bildsprache und den Bezug auf das innerste Selbst.
- source_word: לֵאלֹהִים
  choice: nach Gott
  rationale: Beim deutschen Verb „dürsten“ bezeichnet „nach“ idiomatisch das ersehnte Ziel.
- source_word: לְאֵל חָי
  choice: nach dem lebendigen Gott
  rationale: Die bestimmte Wendung bezeichnet Gott als den Lebendigen; „der lebendige Gott“ ist natürlich und inhaltlich präzise.
- source_word: מָתַי
  choice: Wann
  rationale: Das Fragewort fragt schlicht nach dem Zeitpunkt; eine Wiedergabe mit „Wie lange noch“ würde die Klage stärker ausdeuten.
- source_word: אָבוֹא
  choice: werde ich kommen
  rationale: Der Imperfekt bezeichnet in der Frage das erwartete künftige Kommen. Die Formulierung ist im modernen Deutschen natürlicher als „soll ich kommen“.
- source_word: וְאֵרָאֶה
  choice: und … erscheinen
  rationale: Die masoretisch vokalisierte Nifal-Form wird als „erscheinen/sich zeigen“ verstanden und passt zur Sprache des Zugangs zum Heiligtum.
- source_word: פְּנֵי אֱלֹהִים
  choice: vor Gottes Angesicht
  rationale: Die Formulierung bewahrt das hebräische Bild von Gottes Angesicht und ist zugleich als Ausdruck für Gottes Gegenwart verständlich.
theological_decisions:
- issue: Wiedergabe von פְּנֵי אֱלֹהִים
  choice: vor Gottes Angesicht
  alternative: vor Gott; das Angesicht Gottes sehen
  rationale: „Vor Gottes Angesicht“ erhält die relationale und kultische Bildsprache, ohne sie auf ein körperliches Sehen Gottes festzulegen. Die Fußnote erläutert die idiomatische Bedeutung.
- issue: Lesart von וְאֵרָאֶה
  choice: erscheinen
  alternative: sehen
  rationale: Der masoretische Text stützt mit seiner Nifal-Vokalisierung die Bedeutung „erscheinen“. Die alternative Tradition „sehen“ wird nicht in den Haupttext übernommen, da sie eine andere Vokalisierung voraussetzt.
translation_notes:
  register: Moderne, würdevolle Psalmsprache. „Dürstet“ und „Angesicht“ sind poetisch gehoben, aber allgemein verständlich; die Satzstruktur bleibt klar und nah am hebräischen Parallelismus.
