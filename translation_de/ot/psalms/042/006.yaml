  text: אֱֽלֹהַ֗/י עָלַ/י֮ נַפְשִׁ֪/י תִשְׁתּ֫וֹחָ֥ח עַל כֵּ֗ן אֶ֭זְכָּרְ/ךָ מֵ/אֶ֣רֶץ יַרְדֵּ֑ן וְ֝/חֶרְמוֹנִ֗ים מֵ/הַ֥ר מִצְעָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/006.yaml
  text: My God[a], my soul is cast down within me; therefore I remember you from the land of the Jordan and the Hermons[d][c][b], from Mount Mizar.
translation:
  language: de
  text: Mein Gott, meine Seele ist in mir niedergeschlagen; darum gedenke ich deiner[a] aus dem Jordangebiet, von den Hermonbergen[b], vom Berg Mizar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „darum will ich deiner gedenken“. Die hebräische Verbform kann hier gegenwärtiges Erinnern oder einen auf die Zukunft gerichteten Entschluss ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text hat die Pluralform „Hermone“; gemeint sein können das Hermongebirge oder seine Gipfel.
    reason: lexical_alternative
  - marker: c
    text: „Mizar“ kann ein Ortsname sein; möglich ist auch die Wiedergabe „vom kleinen Berg“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Mein Gott
  rationale: Die Form mit Suffix der 1. Person Singular bedeutet „mein Gott“ und lässt sich hier natürlich als direkte Anrede verstehen, ohne einen zusätzlichen Ausruf einzufügen.
- source_word: עָלַי נַפְשִׁי תִשְׁתּוֹחָח
  choice: meine Seele ist in mir niedergedrückt
  rationale: „Seele“ bewahrt die poetische Rede vom inneren Selbst; „in mir niedergedrückt“ gibt den Zustand des Sich-Niederbeugens idiomatisch und bildnah wieder.
- source_word: עַל־כֵּן
  choice: darum
  rationale: Das Wort kennzeichnet die Folgerung aus dem zuvor beschriebenen inneren Zustand.
- source_word: אֶזְכָּרְךָ
  choice: gedenke ich deiner
  rationale: Die gehobene, aber verständliche Wendung passt zum Psalm und bewahrt das bewusste Sich-Erinnern an Gott. Das Imperfekt kann kontextuell auch zukünftig beziehungsweise als Entschluss verstanden werden.
- source_word: מֵאֶרֶץ יַרְדֵּן
  choice: aus dem Jordangebiet
  rationale: Die Wendung bezeichnet das mit dem Jordan verbundene Land beziehungsweise Gebiet; die kompakte deutsche Form ist geografisch klar und natürlich.
- source_word: וְחֶרְמוֹנִים
  choice: und von den Hermonbergen her
  rationale: Der hebräische Ausdruck steht im Plural und kann die Gipfel oder das Bergland des Hermon bezeichnen. Die deutsche Wiedergabe erhält diesen Plural sinnbezogen.
- source_word: מֵהַר מִצְעָר
  choice: vom Berg Mizar
  rationale: Mizar wird in der geografischen Reihung als Ortsname behandelt; die mögliche appellativische Bedeutung „kleiner Berg“ bleibt in einer Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Psalmsprache. „Gedenken“ wahrt den poetischen Ton, bleibt aber allgemein verständlich. Die Ortsangaben werden natürlich formuliert, während Plural, Zeitstufenambiguität und die unsichere Deutung von „Mizar“ in Fußnoten offengehalten werden.
