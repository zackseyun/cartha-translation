source:
  edition: WLC
  text: הָֽיְתָה לִּ֬/י דִמְעָתִ֣/י לֶ֭חֶם יוֹמָ֣ם וָ/לָ֑יְלָה בֶּ/אֱמֹ֥ר אֵלַ֥/י כָּל הַ֝/יּ֗וֹם אַיֵּ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/003.yaml
  text: My tears have been my bread day and night[a], while they say to me all day long, “Where is your God?”
translation:
  language: de
  text: 'Meine Tränen sind mir Tag und Nacht zum Brot geworden[a], während man den ganzen Tag zu mir sagt: »Wo ist dein Gott?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Meine Träne ist mir Tag und Nacht zum Brot geworden.« Der Singular kann im Hebräischen kollektiv gebraucht sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה לִּי
  choice: sind mir … geworden
  rationale: Die Konstruktion היה + ל bezeichnet hier, was die Tränen für den Sprecher geworden sind bzw. welche Funktion sie für ihn haben. Die deutsche Wendung bewahrt diesen resultativen Sinn.
- source_word: דִמְעָתִי
  choice: meine Tränen
  rationale: Obwohl das hebräische Substantiv formal im Singular steht, kann es kollektiv gebraucht sein. Der deutsche Plural passt natürlich zum Klagezusammenhang.
- source_word: לֶחֶם
  choice: Brot
  rationale: Die konkrete Metapher bleibt erhalten; eine Verallgemeinerung zu »Nahrung« wäre weniger anschaulich.
- source_word: יוֹמָם וָלָיְלָה
  choice: Tag und Nacht
  rationale: Die geläufige Zeitformel bezeichnet eine ununterbrochene bzw. fortwährende Dauer und ist im Deutschen knapp und natürlich.
- source_word: בֶּאֱמֹר
  choice: während man … sagt
  rationale: Die Präposition mit Infinitiv bezeichnet eine gleichzeitig ablaufende Handlung. »Während« gibt dieses Verhältnis wieder; das unbestimmte »man« vermeidet ein im Hebräischen nicht ausdrücklich genanntes Subjekt.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition bezeichnet die Richtung der Rede auf den Sprecher hin.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Die Wendung drückt fortgesetztes oder wiederholtes Reden über den Tag hinweg aus.
- source_word: אַיֵּה
  choice: Wo ist
  rationale: Die direkte Frage bleibt als scharfer Spott über Gottes scheinbare Abwesenheit unverändert erhalten.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Das Suffix ist maskulin Singular. »Gott« bezeichnet hier den Gott des angesprochenen Beters, nicht irgendeine Gottheit.
theological_decisions:
- issue: Charakter der Frage der Spötter
  choice: Die direkte Frage »Wo ist dein Gott?« bleibt stehen.
  alternative: 'Deutender: »Was ist aus deinem Gott geworden?«'
  rationale: Der hebräische Text fragt ausdrücklich nach Gottes Ort bzw. Gegenwart. Die wörtlich-nahe Wiedergabe bewahrt die Spannung seiner scheinbaren Abwesenheit, ohne sie auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Brotmetapher und die direkte Spottfrage bleiben erhalten. »Während man … sagt« gibt die Gleichzeitigkeit wieder, ohne ein im Ausgangstext unausgesprochenes Subjekt als Mehrzahl festzulegen.
