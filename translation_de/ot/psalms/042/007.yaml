source:
  edition: WLC
  text: תְּהֽוֹם אֶל תְּה֣וֹם ק֭וֹרֵא לְ/ק֣וֹל צִנּוֹרֶ֑י/ךָ כָּֽל מִשְׁבָּרֶ֥י/ךָ וְ֝/גַלֶּ֗י/ךָ עָלַ֥/י עָבָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/007.yaml
  text: Deep calls to deep at the sound of your waterfalls[b][a]; all your breakers and your waves have passed over me.
translation:
  language: de
  text: Eine Tiefe ruft der anderen beim Tosen deiner Wasserfälle[a] zu; all deine Brandungswellen und Wogen sind über mich hinweggegangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deiner Wasserläufe«; das hebräische Wort kann auch Wasserkanäle oder herabstürzende Wassermassen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהוֹם ... תְּהוֹם
  choice: eine Tiefe ... der anderen
  rationale: תְּהוֹם bezeichnet die Tiefe oder Wassertiefe. Die deutsche Wendung bewahrt Wiederholung, Personifikation und poetische Offenheit, ohne die Aussage kosmologisch festzulegen.
- source_word: קוֹרֵא
  choice: ruft ... zu
  rationale: Das Partizip von קרא wird als lebendige poetische Gegenwart wiedergegeben; „ruft ... zu“ bildet die Beziehung zwischen den beiden Tiefen im Deutschen natürlich ab.
- source_word: לְקוֹל
  choice: beim Tosen
  rationale: קוֹל kann Stimme, Laut oder Geräusch bedeuten. In Verbindung mit den gewaltigen Wassermassen gibt „beim Tosen“ die akustische Szene idiomatisch wieder; die Präposition לְ wird dabei temporal-begleitend verstanden.
- source_word: צִנּוֹרֶיךָ
  choice: deine Wasserfälle
  rationale: צִנּוֹר kann einen Wasserlauf, Kanal oder herabstürzendes Wasser bezeichnen. „Wasserfälle“ ist im Zusammenhang der tosenden, überwältigenden Wasser ein anschauliches und allgemein verständliches deutsches Wort; die lexikalische Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: כָּל
  choice: all
  rationale: Die umfassende Aussage des hebräischen כָּל wird direkt bewahrt.
- source_word: מִשְׁבָּרֶיךָ
  choice: deine Brandungswellen
  rationale: מִשְׁבָּר bezeichnet brechende Wellen oder Brandung. „Brandungswellen“ macht diese Bewegung deutlich und unterscheidet den Ausdruck von גַּל.
- source_word: וְגַלֶּיךָ
  choice: und Wogen
  rationale: גַּל bedeutet Welle. „Wogen“ ist in gehobener, aber verständlicher poetischer Sprache passend und vermeidet eine schwerfällige Wiederholung von „Wellen“.
- source_word: עָלַי עָבָרוּ
  choice: sind über mich hinweggegangen
  rationale: Die Wendung gibt die abgeschlossene, vom Sprecher erfahrene Bewegung der Wassermassen möglichst direkt wieder und bewahrt das Bild, dass sie über ihn hinwegziehen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Psalmsprache mit klarer Wasserbildlichkeit. „Tosen“, „Brandungswellen“ und „Wogen“ sind poetisch, bleiben aber für heutige Leser verständlich. Die zweite Person wird durchgehend auf Gott bezogen, wie es die hebräischen Suffixe verlangen.
