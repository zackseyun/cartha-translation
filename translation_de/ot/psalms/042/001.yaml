  text: כְּ/אַיָּ֗ל תַּעֲרֹ֥ג עַל אֲפִֽיקֵי מָ֑יִם כֵּ֤ן נַפְשִׁ֨/י תַעֲרֹ֖ג אֵלֶ֣י/ךָ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/001.yaml
  text: As a deer longs for streams of water[a], so my soul longs for you[c][b], O God.
translation:
  language: de
  text: Wie ein Hirsch nach Wasserläufen[a] lechzt[b], so lechzt meine Seele[c] nach dir, o Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Wasserrinnen“ beziehungsweise „Bachbetten“.
    reason: lexical_alternative
  - marker: b
    text: Oder „sich sehnt“; das hebräische Verb kann ein heftiges, von Durst geprägtes Verlangen ausdrücken.
    reason: lexical_alternative
  - marker: c
    text: „Meine Seele“ kann hier auch „mein Leben“, „mein Innerstes“ oder „ich selbst“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/אַיָּל
  choice: Wie ein Hirsch
  rationale: אַיָּל bezeichnet ein männliches Hirsch- oder Rehtier; „Hirsch“ ist im Deutschen natürlich, anschaulich und entspricht der maskulinen Form. כְּ leitet den Vergleich mit „wie“ ein.
- source_word: תַּעֲרֹג
  choice: lechzt
  rationale: ערג beschreibt ein starkes, durstartiges Verlangen. „Lechzt“ bewahrt diese körperliche Bildkraft und lässt sich zugleich auf das innere Verlangen nach Gott beziehen. Die Wiederholung des Verbs in beiden Vershälften bildet die hebräische Parallelität nach.
- source_word: עַל
  choice: nach
  rationale: In Verbindung mit „lechzen“ gibt „nach“ das auf das Wasser gerichtete Verlangen idiomatisch wieder.
- source_word: אֲפִיקֵי מָיִם
  choice: Wasserbächen
  rationale: אֲפִיקִים kann Wasserläufe, Bachbetten oder Rinnen bezeichnen. „Wasserbäche“ ist verständlich, poetisch und bewahrt das Pluralbild.
- source_word: כֵּן
  choice: so
  rationale: „So“ führt knapp und natürlich den entsprechenden zweiten Teil des Vergleichs ein.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ kann Seele, Leben oder das ganze Selbst bezeichnen. „Meine Seele“ bewahrt die poetische und geistliche Ausdrucksweise, ohne den hebräischen Begriff auf eine streng vom Körper getrennte Wesenheit festzulegen.
- source_word: אֵלֶיךָ
  choice: nach dir
  rationale: Die Präposition bezeichnet die Ausrichtung auf Gott; mit „lechzen“ ist „nach dir“ die natürliche deutsche Fügung.
- source_word: אֱלֹהִים
  choice: o Gott
  rationale: Der Zusammenhang ist eine direkte Anrede. „O Gott“ kennzeichnet sie in würdigem poetischem Deutsch.
theological_decisions:
- issue: Anthropologische Bedeutungsbreite von נַפְשִׁי
  choice: meine Seele
  alternative: mein Leben; mein Innerstes; ich selbst
  rationale: Der Ausdruck kann den ganzen lebendigen Menschen bezeichnen und setzt keine strikte Leib-Seele-Trennung voraus. „Meine Seele“ erhält die überlieferte poetische Tiefe; eine Fußnote macht die weitere Bedeutungsbreite sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Bildkraft. Die Wiederholung von „lechzt“ erhält die formale Parallelität und die Intensität des hebräischen Textes; die Fußnoten bewahren dessen lexikalische Offenheit.
