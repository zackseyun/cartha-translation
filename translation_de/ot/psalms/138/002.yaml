source:
  edition: WLC
  text: אֶשְׁתַּחֲוֶ֨ה אֶל הֵיכַ֪ל קָדְשְׁ/ךָ֡ וְ/א֘וֹדֶ֤ה אֶת שְׁמֶ֗/ךָ עַל חַסְדְּ/ךָ֥ וְ/עַל אֲמִתֶּ֑/ךָ כִּֽי הִגְדַּ֥לְתָּ עַל כָּל שִׁ֝מְ/ךָ֗ אִמְרָתֶֽ/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/002.yaml
  text: I bow down toward your holy temple and give thanks to your name for your steadfast love and your faithfulness[a], for you have exalted your word above all your name.
translation:
  language: de
  text: Ich werfe mich vor deinem heiligen Tempel nieder und danke deinem Namen für deine beständige Liebe und deine Treue; denn du hast dein Wort über deinen ganzen Namen erhoben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn du hast deine Verheißung über alles erhoben.“ Der hebräische Wortlaut des letzten Satzteils ist schwierig; manche verstehen ihn auch so: „Denn du hast deinen Namen und dein Wort über alles erhoben.“'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשְׁתַּחֲוֶה
  choice: Ich werfe mich nieder
  rationale: Die Verbform bezeichnet häufig das körperliche Niederwerfen als Ausdruck der Verehrung. Die Übersetzung bewahrt diese konkrete Handlung; „ich bete an“ wäre möglich, aber weniger anschaulich.
- source_word: אֶל הֵיכַל קָדְשְׁךָ
  choice: zu deinem heiligen Tempel hin
  rationale: אֶל bezeichnet hier die räumliche Ausrichtung der Niederwerfung. הֵיכָל kann Palast oder Tempel bedeuten; im gottesdienstlichen Zusammenhang ist „Tempel“ sachgemäß.
- source_word: וְאוֹדֶה אֶת שְׁמֶךָ
  choice: und danke deinem Namen
  rationale: ידה im Hifil kann danken oder preisen bedeuten. Die folgenden עַל-Angaben nennen den Grund des Dankes, weshalb „danken“ hier am besten passt.
- source_word: עַל חַסְדְּךָ
  choice: für deine beständige Liebe
  rationale: חסד bezeichnet verlässliche, loyale Güte und Liebe. „Beständige Liebe“ ist verständlich und erhält den Gedanken dauerhafter Zuwendung, ohne einen engeren theologischen Fachbegriff einzutragen.
- source_word: וְעַל אֲמִתֶּךָ
  choice: und deine Treue
  rationale: אמת kann Wahrheit, Verlässlichkeit oder Treue bedeuten. Parallel zu חסד bezeichnet „Treue“ hier treffend Gottes verlässliches Wesen.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier den Grund für den Dank ein. „Denn“ bildet diese begründende Beziehung knapp und würdig ab.
- source_word: הִגְדַּלְתָּ
  choice: du hast … erhoben
  rationale: Der Hifil von גדל bedeutet groß machen oder erhöhen. „Erhoben“ gibt die Steigerung des Ranges bzw. der Ehre natürlich wieder.
- source_word: עַל כָּל שִׁמְךָ
  choice: über deinen ganzen Namen
  rationale: Die masoretische Wortfolge ist schwierig. Diese Wiedergabe bleibt eng bei עַל („über“) und כָּל שִׁמְךָ („dein ganzer Name“), statt die syntaktische Spannung im Haupttext durch eine Deutung aufzulösen.
- source_word: אִמְרָתֶךָ
  choice: dein Wort
  rationale: אִמְרָה kann Wort, Ausspruch oder Verheißung bezeichnen. „Wort“ bewahrt die semantische Breite; der Zusammenhang mit Gottes Treue lässt zugleich den Verheißungscharakter anklingen.
theological_decisions:
- issue: Deutung der schwierigen Schlussklausel כִּי הִגְדַּלְתָּ עַל כָּל שִׁמְךָ אִמְרָתֶךָ
  choice: denn du hast dein Wort über deinen ganzen Namen erhoben
  alternative: 'denn du hast deine Verheißung über alles erhoben; oder: denn du hast deinen Namen und dein Wort über alles erhoben'
  rationale: Der masoretische Text ist syntaktisch ungewöhnlich und wird verschieden verstanden. Der Haupttext folgt möglichst eng der überlieferten Wortfolge und bewahrt so die Spannung zwischen Gottes Wort und seinem Namen. Glättende Deutungen werden in der Fußnote genannt, ohne stillschweigend in den Text aufgenommen zu werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ich werfe mich nieder“ bewahrt die körperliche Dimension des hebräischen Verbs. Die etwas ungewohnte Schlussformulierung ist bewusst textnah; die wichtigsten glättenden Deutungen stehen in der Fußnote.
