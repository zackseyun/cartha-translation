source:
  edition: WLC
  text: אִם אֵלֵ֤ךְ בְּ/קֶ֥רֶב צָרָ֗ה תְּחַ֫יֵּ֥/נִי עַ֤ל אַ֣ף אֹ֭יְבַ/י תִּשְׁלַ֣ח יָדֶ֑/ךָ וְ/ת֖וֹשִׁיעֵ֣/נִי יְמִינֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/007.yaml
  text: If I walk in the midst of trouble[a], you preserve my life; you stretch out your hand against the anger of my enemies[c][b], and your right hand saves me.
translation:
  language: de
  text: Wenn[a] ich inmitten von Not meinen Weg gehe, erhältst du mich am Leben[b]. Gegen den Zorn meiner Feinde[c] streckst du deine Hand aus, und deine rechte Hand rettet mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch wenn“. Das hebräische אִם kann hier eine Bedingung ausdrücken oder konzessiv verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „belebst du mich“ beziehungsweise „hältst du mich am Leben“. Das hebräische Verb kann Belebung, Wiederbelebung oder die Bewahrung des Lebens bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „auf/gegen den Zorn meiner Feinde“. Das hebräische Wort אַף bedeutet eigentlich „Nase“, wird aber als bildhafte Bezeichnung für Zorn gebraucht.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die Partikel kann hier konditional oder konzessiv verstanden werden. „Wenn“ bildet ihre Grundbedeutung ab, ohne die konzessive Möglichkeit auszuschließen.
- source_word: אֵלֵךְ
  choice: ich … meinen Weg gehe
  rationale: הלך bezeichnet das Gehen. Die Ergänzung „meinen Weg“ ergibt im Deutschen eine natürliche poetische Wendung und bewahrt das Bild einer Bewegung durch die Not.
- source_word: בְּקֶרֶב צָרָה
  choice: inmitten von Not
  rationale: קֶרֶב bezeichnet die Mitte beziehungsweise das Innere; צָרָה meint Not, Bedrängnis oder Drangsal. Die Wiedergabe bewahrt das räumliche Bild und klingt zugleich gegenwärtig.
- source_word: תְּחַיֵּנִי
  choice: erhältst du mich am Leben
  rationale: Das Piel von חיה kann beleben, wiederbeleben oder am Leben erhalten bedeuten. Im Zusammenhang mit Not und Feinden liegt die Bewahrung des Lebens nahe, während eine Fußnote die weitere Bedeutungsbreite offenhält.
- source_word: עַל אַף אֹיְבַי
  choice: Gegen den Zorn meiner Feinde
  rationale: אַף bedeutet wörtlich „Nase“ und bezeichnet idiomatisch Zorn. עַל trägt hier gegnerische Stoßrichtung; die Übersetzung bewahrt daher den Zorn als ausdrückliches Ziel des göttlichen Eingreifens.
- source_word: תִּשְׁלַח יָדֶךָ
  choice: streckst du deine Hand aus
  rationale: Die Wendung vom Aussenden der Hand beschreibt tätiges Eingreifen. „Die Hand ausstrecken“ ist im Deutschen idiomatisch und erhält das anthropomorphe Bild.
- source_word: וְתוֹשִׁיעֵנִי
  choice: und … rettet mich
  rationale: ישע im Hifil bedeutet retten oder befreien. „Rettet“ ist die breite, unmittelbare Wiedergabe, ohne die Art der Rettung näher festzulegen.
- source_word: יְמִינֶךָ
  choice: deine rechte Hand
  rationale: Die wörtliche Wiedergabe bewahrt das hebräische Bild für Kraft und rettendes Handeln.
theological_decisions:
- issue: Bedeutungsnuance des göttlichen Handelns in תְּחַיֵּנִי
  choice: Bewahrung des Lebens in gegenwärtiger Gefahr
  alternative: Belebung oder Wiederherstellung
  rationale: Not und feindlicher Zorn sprechen im unmittelbaren Zusammenhang für die Bewahrung des Beters am Leben. Die mögliche Bedeutung „beleben“ wird jedoch nicht ausgeschlossen, sondern in der Fußnote genannt.
- issue: Bezug von עַל אַף אֹיְבַי
  choice: Gott handelt gegen den Zorn der Feinde
  alternative: Gott handelt unmittelbar gegen die Feinde
  rationale: Da אַף idiomatisch „Zorn“ bedeutet, bleibt dieser im Text ausdrücklich erhalten. So wird die hebräische Formulierung nicht zu „gegen meine Feinde“ verflacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildsprache. Veraltete Wörter wie „wandeln“ oder „Drangsal“ wurden vermieden; die Satzstruktur bleibt klar und zum Vorlesen geeignet.
