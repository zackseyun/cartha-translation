  text: לְ/דָוִ֨ד אוֹדְ/ךָ֥ בְ/כָל לִבִּ֑/י נֶ֖גֶד אֱלֹהִ֣ים אֲזַמְּרֶֽ/ךָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/000.yaml
  text: Of David[a]. I will give thanks to you with all my heart; before the gods I will sing praises to you.
translation:
  language: de
  text: Von David. Ich danke dir von ganzem Herzen; vor den Göttern[a] singe ich dir Lob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor den himmlischen Wesen“ beziehungsweise „vor den Engeln“. Das hebräische Wort kann je nach Zusammenhang Gott, Götter oder himmlische Wesen bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die knappe Überschrift gibt die mehrdeutige hebräische Zugehörigkeitsformel idiomatisch wieder, ohne ihre genaue Funktion weiter festzulegen.
- source_word: אוֹדְךָ
  choice: Ich danke dir
  rationale: Das Hifil von ידה bezeichnet hier das dankende bzw. preisende Bekennen; „danken“ ist im Deutschen natürlich und kontextgerecht.
- source_word: בְכָל־לִבִּי
  choice: von ganzem Herzen
  rationale: Diese geläufige deutsche Wendung vermittelt die hebräische Vorstellung ungeteilter innerer Hingabe.
- source_word: נֶגֶד אֱלֹהִים
  choice: vor den Göttern
  rationale: נֶגֶד bedeutet „vor/angesichts“, und אֱלֹהִים kann hier Götter oder himmlische Wesen bezeichnen. Die direkte Wiedergabe bewahrt die Spannung des Ausgangstextes; die Alternative wird in der Fußnote genannt.
- source_word: אֲזַמְּרֶךָּ
  choice: singe ich dir Lob
  rationale: Das Verb זמר bezeichnet musikalisches Loben bzw. Psalmodieren; die Formulierung ist natürlich und erhält den musikalischen Sinn.
theological_decisions:
- issue: Identität der אֱלֹהִים, vor denen der Psalmist singt
  choice: Götter
  alternative: himmlische Wesen oder Engel
  rationale: Der Kontext erlaubt verschiedene Deutungen. Der Haupttext folgt der formnahen Bedeutung, ohne die Existenz oder Gleichrangigkeit anderer Gottheiten zu behaupten; die Fußnote bewahrt die sachlich mögliche himmlische Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus bleibt knapp; „von ganzem Herzen“ ist idiomatisch, während „vor den Göttern“ die echte lexikalische und theologische Mehrdeutigkeit sichtbar hält.
