  text: On the day I called[a], you answered me; you made me bold in my soul with strength.
translation:
  language: de
  text: An dem Tag, als ich rief, hast du mir geantwortet; du hast mich in meiner Seele mit Kraft ermutigt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast mich in meiner Seele mit Stärke kühn gemacht“; möglicherweise auch: „Du hast mich innerlich gestärkt“ oder „weit gemacht“. Das hebräische Verb ist schwierig und kann hier Kühnmachen oder Ermutigen, möglicherweise auch Weiten oder Stärken bezeichnen.'
