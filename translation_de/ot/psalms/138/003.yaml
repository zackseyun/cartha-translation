lexical_decisions:
- source_word: בְּיוֹם
  choice: An dem Tag, als
  rationale: Bewahrt den konkreten Zeitausdruck des Hebräischen und klingt im modernen Deutschen natürlich.
- source_word: קָרָאתִי
  choice: ich rief
  rationale: Gibt das Qal Perfekt direkt wieder, ohne die im Verb nicht zwingend enthaltene emotionale Steigerung „schrie“ einzutragen.
- source_word: וַתַּעֲנֵנִי
  choice: hast du mir geantwortet
  rationale: Gibt das Verb samt Suffix der ersten Person ausdrücklich und idiomatisch wieder.
- source_word: תַּרְהִבֵנִי
  choice: du hast mich … mit Kraft erfüllt
  rationale: Das schwierige Hifil von רהב bezeichnet hier wahrscheinlich ein inneres Stärken oder Ermutigen. Die Formulierung ist verständlich, wahrt die kausative Wirkung und lässt sich mit עֹז verbinden.
- source_word: בְנַפְשִׁי
  choice: in meiner Seele
  rationale: Hält den ausdrücklichen Bezug auf נֶפֶשׁ sichtbar und bezeichnet den inneren Menschen, statt ihn in der glatteren Wiedergabe „in mir“ aufzulösen.
- source_word: עֹז
  choice: mit Kraft
  rationale: Gibt den Begriff für Kraft oder Stärke wieder und versteht ihn als Angabe dessen, womit Gott den Beter innerlich erfüllt beziehungsweise stärkt.
theological_decisions:
- issue: Deutung der schwierigen Wendung תַּרְהִבֵנִי בְנַפְשִׁי עֹז
  choice: Gottes Handeln erfüllt beziehungsweise stärkt den Beter innerlich mit Kraft.
  alternative: „Du machtest mich in meiner Seele kühn durch Kraft“ oder „du hast mich innerlich gestärkt“.
  rationale: Die seltene Verbform lässt ein Bedeutungsspektrum von Weiten über Ermutigen bis Stärken zu. Der Haupttext bietet eine natürliche deutsche Fassung, während die Fußnote die echte lexikalische Unsicherheit offenlegt, ohne eine besondere Lehrtradition einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der konkrete Zeitausdruck und „Seele“ bleiben sichtbar; die schwierige Schlusswendung wird im Haupttext verständlich formuliert und in der Fußnote transparent gemacht.
