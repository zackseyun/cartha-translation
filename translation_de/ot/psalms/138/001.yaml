  text: לְ/דָוִ֨ד אוֹדְ/ךָ֥ בְ/כָל לִבִּ֑/י נֶ֖גֶד אֱלֹהִ֣ים אֲזַמְּרֶֽ/ךָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/001.yaml
  text: Of David[a]. I will give thanks to you with my whole heart; before the gods I will sing praises to you.
translation:
  language: de
  text: Von David. Ich danke dir von ganzem Herzen; vor den Göttern[a] singe ich dir Lob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor den himmlischen Wesen“ beziehungsweise „vor den Engeln“. Das hebräische Wort kann je nach Zusammenhang Götter, Gott oder himmlische Wesen bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Von David
  rationale: Die Präposition ל kann in Psalmüberschriften Urheberschaft, Zugehörigkeit oder Widmung ausdrücken. „Von David“ entspricht dem üblichen deutschen Überschriftenstil, ohne die Beziehung so ausdrücklich wie „verfasst von“ festzulegen.
- source_word: אוֹדְךָ
  choice: Ich danke dir
  rationale: ידה im Hifil kann „danken“, „preisen“ oder „bekennen“ bedeuten. Im gottesdienstlichen Zusammenhang gibt „Ich danke dir“ die Danknuance und das pronominale Objekt natürlich wieder.
- source_word: בְכָל לִבִּי
  choice: von ganzem Herzen
  rationale: Die feste deutsche Wendung gibt wörtlich „mit meinem ganzen Herzen“ idiomatisch wieder und bewahrt den Gedanken ungeteilter innerer Hingabe.
- source_word: נֶגֶד
  choice: vor
  rationale: נגד bezeichnet die Gegenwart oder das Gegenüber. „Vor“ ist knapp, poetisch und lässt sowohl räumliche als auch öffentliche Gegenwart anklingen.
- source_word: אֱלֹהִים
  choice: den Göttern
  rationale: Die Form kann je nach Kontext Gott, Götter oder himmlische Wesen bezeichnen. Hier bewahrt der Plural „den Göttern“ die unmittelbarste Lesart und die rhetorische Spannung; andere mögliche Deutungen stehen in der Fußnote.
- source_word: אֲזַמְּרֶךָ
  choice: singe ich dir Lob
  rationale: זמר im Piel bezeichnet musikalisches Singen oder Spielen zum Lob. „Singe ich dir Lob“ bringt sowohl den musikalischen als auch den lobpreisenden Sinn zum Ausdruck und gibt das Suffix als Anrede „dir“ wieder.
theological_decisions:
- issue: Bezug von אֱלֹהִים in der Wendung נֶגֶד אֱלֹהִים
  choice: den Göttern
  alternative: den himmlischen Wesen; den Engeln; Gott
  rationale: Die morphologisch mögliche und im Kontext naheliegende Mehrzahl soll im Haupttext sichtbar bleiben. Eine Wiedergabe mit „Gott“ würde die Form vorschnell singularisieren; „himmlische Wesen“ wäre bereits eine interpretierende Präzisierung. Die Fußnote erhält deshalb die echte Bedeutungsbreite.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knapper poetischer Satzführung. Die traditionelle Wendung „von ganzem Herzen“ bleibt allgemein verständlich. Das Semikolon bildet die Parallelität der beiden Aussagen ab.
