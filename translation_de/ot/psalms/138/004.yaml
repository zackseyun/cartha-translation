  text: יוֹד֣וּ/ךָ יְ֭הוָה כָּל מַלְכֵי אָ֑רֶץ כִּ֥י שָׁ֝מְע֗וּ אִמְרֵי פִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/004.yaml
  text: All the kings of the earth will give thanks to you[a], O Yahweh, for they have heard the words of your mouth.
translation:
  language: de
  text: Alle Könige der Erde werden dir danken, Jahwe[a], denn sie haben die Worte deines Mundes gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH, der Eigenname Gottes; hier als „Jahwe“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: werden dir danken
  rationale: Das Hifil von ידה bezeichnet häufig Danken oder Preisen. Mit dem Objektsuffix der zweiten Person gibt „dir danken“ die persönliche Ausrichtung und den Dankcharakter des Psalms natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, um den Eigennamen statt eines ersetzenden Titels zu bewahren.
- source_word: כָּל מַלְכֵי אָרֶץ
  choice: alle Könige der Erde
  rationale: Die kollektive Wendung wird direkt und idiomatisch wiedergegeben; „Könige“ bleibt erhalten, da ausdrücklich Herrscher gemeint sind.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier plausibel die Begründung für den Dank der Könige ein. „Denn“ bewahrt diesen Zusammenhang in gehobenem, aber gegenwärtigem Deutsch.
- source_word: שָׁמְעוּ
  choice: sie haben … gehört
  rationale: Das Qatal bezeichnet das dem künftigen Danken vorausliegende Hören als abgeschlossene Handlung.
- source_word: אִמְרֵי פִיךָ
  choice: die Worte aus deinem Mund
  rationale: Die Formulierung bewahrt das hebräische Bild des Mundes, klingt im Deutschen jedoch natürlicher als „die Worte deines Mundes“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname יהוה. „Jahwe“ macht diesen sichtbar, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge folgt dem Hebräischen, während „Worte aus deinem Mund“ die Bildsprache idiomatisch vermittelt.
