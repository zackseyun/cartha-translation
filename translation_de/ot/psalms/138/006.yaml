source:
  edition: WLC
  text: כִּי רָ֣ם יְ֭הוָה וְ/שָׁפָ֣ל יִרְאֶ֑ה וְ֝/גָבֹ֗הַּ מִ/מֶּרְחָ֥ק יְיֵדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/006.yaml
  text: For Yahweh is high[a], yet he sees the lowly[c][b]; but the haughty he knows from afar.
translation:
  language: de
  text: Denn Jahwe ist erhaben, doch den Niedrigen sieht er; den Hochmütigen aber kennt er von fern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „er erkennt ihn von fern“. Das Hebräische lautet wörtlich „kennt er von fern“ und kann eine distanzierte Beziehung andeuten, ohne sie genauer zu bestimmen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Lobpreis ein und entspricht dem erklärenden Zusammenhang.
- source_word: רָם
  choice: erhaben
  rationale: Bezeichnet Jahwes hohe, erhöhte Stellung. „Erhaben“ bewahrt das Höhenbild und klingt im Deutschen natürlicher als das wörtliche „hoch“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: שָׁפָל
  choice: den Niedrigen
  rationale: 'Bewahrt die mögliche soziale wie innere Bedeutung: Menschen von niedrigem Stand beziehungsweise demütiger Haltung.'
- source_word: יִרְאֶה
  choice: sieht er
  rationale: Gibt die Grundbedeutung des Verbs unmittelbar wieder, ohne die darin mögliche fürsorgliche Zuwendung ausdrücklich festzulegen.
- source_word: גָבֹהַּ
  choice: den Hochmütigen
  rationale: Das wörtlich „Hohe“ bezeichnet im Gegensatz zum Niedrigen hier wahrscheinlich einen stolzen oder überheblichen Menschen.
- source_word: מִמֶּרְחָק
  choice: von fern
  rationale: Bewahrt das räumliche Bild und die knappe poetische Ausdrucksweise des Hebräischen.
- source_word: יְיֵדָע
  choice: kennt er
  rationale: Entspricht der Grundbedeutung „kennen/wissen“ und lässt offen, ob der Zusammenhang zusätzlich Erkennen, Beachten oder relationale Distanz nahelegt.
theological_decisions:
- issue: Die Art, wie Jahwe den Hochmütigen kennt
  choice: „kennt er von fern“
  alternative: „er erkennt ihn von fern“ oder „er hält ihn auf Abstand“
  rationale: Der hebräische Text verbindet „kennen“ mit „von fern“. Er kann relationale Distanz andeuten, sagt aber nicht ausdrücklich, dass Jahwe den Hochmütigen zurückweist oder aktiv auf Abstand hält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Das Semikolon hebt den Gegensatz zwischen Jahwes Blick auf den Niedrigen und seinem distanzierten Kennen des Hochmütigen hervor.
