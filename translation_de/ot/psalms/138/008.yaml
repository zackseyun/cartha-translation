source:
  edition: WLC
  text: יְהוָה֮ יִגְמֹ֪ר בַּ֫עֲדִ֥/י יְ֭הוָה חַסְדְּ/ךָ֣ לְ/עוֹלָ֑ם מַעֲשֵׂ֖י יָדֶ֣י/ךָ אַל תֶּֽרֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/008.yaml
  text: Yahweh will fulfill his purpose for me[a]; O Yahweh, your steadfast love endures forever[b]. Do not forsake the work of your hands.
translation:
  language: de
  text: Jahwe wird es für mich vollenden.[a] Jahwe, deine treue Liebe währt ewig. Gib die Werke deiner Hände nicht auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Jahwe wird vollenden, was mich betrifft.“'
    reason: Die Verbindung יִגְמֹר בַּעֲדִי kann sowohl „für mich/zu meinen Gunsten“ als auch, in einer weiter gefassten Wiedergabe, „was mich betrifft“ ausdrücken; der Gegenstand des Vollendens bleibt im Hebräischen ungenannt.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יִגְמֹר בַּעֲדִי
  choice: wird vollenden, was mich betrifft
  rationale: Die Formulierung bewahrt den Sinn des Vollendens und die Offenheit von בַּעֲדִי („für mich“, „meinetwegen“, „was mich betrifft“), ohne das im Hebräischen nicht ausdrücklich genannte Wort „Absicht“ einzufügen.
- source_word: חַסְדְּךָ
  choice: deine treue Liebe
  rationale: חסד bezeichnet hier eine beständige, verlässliche und beziehungsgebundene Liebe; „treue Liebe“ bringt diese Aspekte in natürlichem Deutsch zusammen.
- source_word: לְעוֹלָם
  choice: währt ewig
  rationale: Die Wendung gibt die zeitlich unbegrenzte Dauer knapp und würdevoll wieder.
- source_word: מַעֲשֵׂי יָדֶיךָ
  choice: die Werke deiner Hände
  rationale: Der Plural des hebräischen Textes bleibt erhalten; zugleich bleibt offen, ob Gottes Wirken am Psalmisten oder seine Werke in einem weiteren Sinn gemeint sind.
- source_word: אַל תֶּרֶף
  choice: Gib ... nicht auf
  rationale: רפה kann das Loslassen, Nachlassen oder Aufgeben bezeichnen. Im Deutschen drückt „nicht aufgeben“ die Bitte natürlich aus, Gottes eigenes Werk nicht unvollendet zu lassen.
theological_decisions:
- issue: Gegenstand von Gottes vollendendem Handeln
  choice: „was mich betrifft“ bleibt inhaltlich offen
  alternative: „seine Absicht für mich“ oder „für mich“
  rationale: Das Hebräische nennt keinen ausdrücklichen Gegenstand wie „Absicht“. Die gewählte Fassung vermeidet es, eine bestimmte Deutung einzutragen, lässt aber erkennen, dass Gottes vollendendes Handeln den Beter betrifft.
- issue: Bezug der „Werke deiner Hände“
  choice: Der Plural und der weite Bezug bleiben bestehen
  alternative: Singularisch Gottes Werk am Psalmisten
  rationale: Die Bitte kann Gottes Wirken am Beter einschließen, ist sprachlich jedoch nicht darauf beschränkt. Deshalb wird die Mehrdeutigkeit nicht aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und poetisch; unnötig altertümliche Wendungen werden vermieden.
