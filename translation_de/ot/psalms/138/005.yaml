id: PSA.138.5
reference: Psalms 138:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ֭/יָשִׁירוּ בְּ/דַרְכֵ֣י יְהוָ֑ה כִּ֥י גָ֝ד֗וֹל כְּב֣וֹד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/005.yaml
  text: and they will sing of the ways of Yahweh[a], for great is the glory of Yahweh.
translation:
  language: de
  text: Und sie werden von den Wegen Jahwes[a] singen, denn groß ist die Herrlichkeit Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf den Wegen Jahwes« oder »in den Wegen Jahwes«; wahrscheinlich sind Jahwes Wege das Thema ihres Singens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשִׁירוּ
  choice: Und sie werden … singen
  rationale: Das Qal-Imperfekt 3. Person Plural bezeichnet hier im Anschluss an Vers 4 am natürlichsten ein zukünftiges Singen; eine Aufforderung ist grammatisch möglich, aber nicht erforderlich.
- source_word: בְּדַרְכֵי
  choice: von den Wegen
  rationale: Die Präposition בְּ kann in Verbindung mit »singen« das Thema des Gesangs bezeichnen. »Von den Wegen« ist im Deutschen idiomatisch und bleibt der hebräischen Wendung nahe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier plausibel die Begründung für das Singen ein; »denn« wahrt den knappen poetischen Zusammenhang.
- source_word: גָדוֹל
  choice: groß
  rationale: Die direkte und kontextgerechte Entsprechung bewahrt die schlichte Aussage des Hebräischen.
- source_word: כְּבוֹד
  choice: Herrlichkeit
  rationale: »Herrlichkeit« ist bei Gottes כָּבוֹד eine natürliche, theologisch offene deutsche Wiedergabe und umfasst seine offenbarte Größe und Ehre.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; »Jahwe« bewahrt ihn, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Bezug der Wendung בְּדַרְכֵי יְהוָה
  choice: vom Handeln und den Wegen Jahwes als Thema des Gesangs
  alternative: während sie auf den Wegen Jahwes gehen
  rationale: Nach dem Verb »singen« liegt ein thematischer Gebrauch der Präposition nahe. Da der hebräische Wortlaut wörtlich auch »auf/in den Wegen« heißen kann, wird diese Möglichkeit in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Die Wiederholung des Gottesnamens und die Voranstellung von »groß« im Begründungssatz werden sinngemäß bewahrt.
