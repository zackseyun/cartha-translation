base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/013.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Amen and Amen.
translation:
  language: de
  text: Gepriesen sei Jahwe, der Gott Israels, von Ewigkeit zu Ewigkeit.[a] Amen und Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „von Zeitalter zu Zeitalter“. Der hebräische Ausdruck kann je nach Zusammenhang eine Weltzeit oder eine unabsehbar lange Dauer bezeichnen; in dieser Doxologie liegt die Wiedergabe „von Ewigkeit zu Ewigkeit“ nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Die passive Partizipialform eröffnet eine doxologische Segensformel. „Gepriesen sei“ gibt ihren liturgischen Charakter in natürlichem, gehobenem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Status-constructus-Verbindung bedeutet unmittelbar „Gott Israels“; der bestimmte Artikel entspricht hier natürlichem Deutsch.
- source_word: מֵהָעוֹלָם וְעַד הָעוֹלָם
  choice: von Ewigkeit zu Ewigkeit
  rationale: Die feste doxologische Wendung bezeichnet eine zeitlich unbegrenzte Dauer. Die traditionelle deutsche Formulierung bewahrt sowohl die Wiederholung von עוֹלָם als auch den feierlichen Ton.
- source_word: אָמֵן וְאָמֵן
  choice: Amen und Amen
  rationale: Die zweimalige liturgische Bekräftigung wird ungekürzt und in ihrer vertrauten Umschrift beibehalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Wiedergabe als „Jahwe“ bewahrt den Eigenname-Charakter, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitliche Reichweite von עוֹלָם
  choice: von Ewigkeit zu Ewigkeit
  alternative: von Zeitalter zu Zeitalter
  rationale: עוֹלָם kann je nach Zusammenhang eine sehr lange, unabsehbare Zeit oder Ewigkeit bezeichnen. In dieser Doxologie legt die Verbindung מִן … וְעַד die umfassende, unbegrenzte Dauer nahe, ohne die lexikalische Spannweite zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit liturgischem Klang. Die Wiederholungen „zu Ewigkeit“ und „Amen und Amen“ bleiben als bewusste Elemente der hebräischen Doxologie erhalten.
