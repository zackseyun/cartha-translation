id: PSA.41.8
reference: Psalms 41:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דְּֽבַר בְּ֭לִיַּעַל יָצ֣וּק בּ֑/וֹ וַ/אֲשֶׁ֥ר שָׁ֝כַ֗ב לֹא יוֹסִ֥יף לָ/קֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/008.yaml
  text: A wicked thing is poured out upon him; now that he lies down[a], he will rise no more.
translation:
  language: de
  text: Etwas Verderbliches ist über ihn ausgegossen; nun, da er daliegt,[a] wird er nicht wieder aufstehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Etwas Abscheuliches haftet ihm an«; möglicherweise auch: »Eine böse Anschuldigung ist gegen ihn erhoben worden.« Der hebräische Ausdruck ist schwierig und kann entweder ein bösartiges Leiden oder eine zerstörerische Anschuldigung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר בְּלִיַּעַל
  choice: etwas Verderbliches
  rationale: Die schwierige Wortverbindung kann sowohl ein bösartiges Leiden als auch eine vernichtende Anschuldigung bezeichnen. Die substantivierte Formulierung bewahrt diese Mehrdeutigkeit und gibt die schädliche, unheilvolle Bedeutung von בְּלִיַּעַל wieder.
- source_word: יָצוּק
  choice: ist … ausgegossen
  rationale: Die Wiedergabe folgt dem naheliegenden passiven Bild des hebräischen Verbs, ohne es eindeutig als »haftet an« oder »ist auferlegt« auszulegen.
- source_word: בּוֹ
  choice: über ihn
  rationale: In Verbindung mit »ausgegossen« ist »über ihn« im Deutschen idiomatisch und bewahrt die Vorstellung, dass etwas Unheilvolles auf den Betroffenen kommt.
- source_word: וַאֲשֶׁר שָׁכַב
  choice: nun, da er daliegt
  rationale: »Daliegen« bewahrt das Bild von שׁכב und lässt offen, ob Krankheit, Niederlage oder Tod gemeint ist. »Nun, da« stellt den im Kontext naheliegenden Zusammenhang natürlich her.
- source_word: לֹא יוֹסִיף לָקוּם
  choice: wird er nicht wieder aufstehen
  rationale: Diese natürliche deutsche Wendung gibt das hebräische Idiom genau wieder und lässt sowohl das buchstäbliche Aufstehen als auch die Erholung offen.
theological_decisions:
- issue: Deutung des verderblichen Geschehens
  choice: Die Übersetzung lässt offen, ob von einem bösartigen Leiden oder einer zerstörerischen Anschuldigung die Rede ist.
  alternative: »Eine böse Krankheit haftet ihm an« oder »Eine böse Anschuldigung ist gegen ihn erhoben worden«
  rationale: Die knappe hebräische Formulierung דְּבַר בְּלִיַּעַל יָצוּק בּוֹ ist semantisch umstritten. Eine eindeutige Festlegung würde mehr sagen, als der Ausgangstext sicher erkennen lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist bewusst kompakt und bewahrt die Bildsprache sowie die Mehrdeutigkeit des Hebräischen; »daliegt« klingt natürlicher als ein rein wörtliches »sich hingelegt hat«.
