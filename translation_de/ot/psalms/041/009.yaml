base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/009.yaml
  text: Even my close friend[a], in whom I trusted, who ate my bread[d][c][b], has lifted up his heel against me.
translation:
  language: de
  text: Sogar mein enger Freund[a], dem ich vertraute und der mein Brot aß[b], hat seine Ferse gegen mich erhoben.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Mann meines Friedens«; gemeint ist jemand, der mit dem Beter in Frieden lebte, also ein enger Freund oder vertrauter Verbündeter.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der mein Brot mit mir teilte«. Das Hebräische sagt wörtlich »der mein Brot aß« und ruft damit Tischgemeinschaft und Vertrauen in Erinnerung.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: »hat die Ferse gegen mich groß gemacht«. Das ungewöhnliche hebräische Bild bezeichnet verräterisches oder feindseliges Handeln. Der Vers wird in Johannes 13,18 im Zusammenhang mit dem Verrat des Judas an Jesus angeführt.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: גַּם
  choice: Sogar
  rationale: 'Markiert die erschütternde Steigerung: Nicht nur Feinde, sondern selbst ein besonders nahestehender Mensch handelt gegen den Beter.'
- source_word: אִישׁ שְׁלוֹמִי
  choice: mein enger Freund
  rationale: Wörtlich »der Mann meines Friedens«; die natürliche deutsche Wiedergabe bringt die vertraute, friedliche Beziehung zum Ausdruck, ohne sie auf eine bestimmte gesellschaftliche Rolle festzulegen.
- source_word: אֲשֶׁר בָּטַחְתִּי בוֹ
  choice: dem ich vertraute
  rationale: Gibt die persönliche Zuversicht beziehungsweise das gesetzte Vertrauen idiomatisch und präzise wieder.
- source_word: אוֹכֵל לַחְמִי
  choice: der mein Brot aß
  rationale: Bewahrt das konkrete Bild gemeinsamer Tischgemeinschaft und die durch sie ausgedrückte Nähe.
- source_word: הִגְדִּיל עָלַי עָקֵב
  choice: hat seine Ferse gegen mich erhoben
  rationale: Erhält das ungewöhnliche hebräische Körperbild und vermittelt zugleich dessen feindselige Richtung; seine genaue Nuance wird in der Fußnote erläutert.
theological_decisions:
- issue: Messianische beziehungsweise typologische Resonanz in Johannes 13,18
  choice: Der Haupttext wird aus seinem unmittelbaren psalmischen Zusammenhang übersetzt.
  alternative: Den Wortlaut stärker an die neutestamentliche Zitiertradition angleichen.
  rationale: Zunächst spricht der Psalm von der Untreue eines vertrauten Menschen gegenüber dem Beter. Johannes 13,18 greift den Vers im Zusammenhang mit Judas und Jesus auf; dieser kanonische Bezug wird in einer Fußnote kenntlich gemacht, aber nicht in den Haupttext hineingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der konkrete Bildgehalt von Brot und Ferse bleibt erhalten; schwer verständliche Idiomatik und der neutestamentliche Bezug werden knapp in Fußnoten erläutert.
