  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָ֗ה חָנֵּ֥/נִי וַ/הֲקִימֵ֑/נִי וַֽ/אֲשַׁלְּמָ֥ה לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/010.yaml
  text: But you[a], O Yahweh, be gracious to me and raise me up, that I may repay them.
translation:
  language: de
  text: Doch du, Jahwe, sei mir gnädig und richte mich auf, damit ich es ihnen vergelte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ich will es ihnen vergelten“. Der hebräische Kohortativ kann hier einen Zweck oder eine Folge („damit ich …“) ausdrücken oder einen Entschluss, der auf die Bitten folgt.'
    reason: grammatische Alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Doch du
  rationale: Die Konjunktion zusammen mit dem selbstständigen Pronomen hebt Jahwe kontrastierend von den zuvor genannten Gegnern und dem treulosen Vertrauten ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: חָנֵּנִי
  choice: sei mir gnädig
  rationale: Die Wendung bewahrt den Grundsinn von חנן als Bitte um gnädige Zuwendung, ohne ihn auf bloßes Mitleid einzuengen.
- source_word: וַהֲקִימֵנִי
  choice: und richte mich auf
  rationale: Das Hifil von קום bedeutet, jemanden aufstehen bzw. wieder stehen zu lassen. Im Zusammenhang von Krankheit und Bedrängnis bleibt das konkrete Bild erhalten und schließt Wiederherstellung ein.
- source_word: וַאֲשַׁלְּמָה
  choice: damit ich es ihnen vergelte
  rationale: Das Piel von שלם bezeichnet hier Vergeltung oder Rückzahlung. Der Kohortativ nach den Bitten lässt sich natürlich als Zweck oder Folge ausdrücken; das ergänzte unbetonte „es“ entspricht idiomatischem Deutsch.
- source_word: לָהֶם
  choice: ihnen
  rationale: Die Präposition ל kennzeichnet die von der Vergeltung betroffenen Personen; „es ihnen vergelten“ ist die natürliche deutsche Fügung.
theological_decisions:
- issue: Ob die angekündigte Vergeltung abgeschwächt werden sollte
  choice: „es ihnen vergelte“ beibehalten
  alternative: „mich ihnen gegenüber ins Recht setze“ oder „mit ihnen verfahre, wie sie es verdienen“
  rationale: שלם bezeichnet unmittelbar Vergeltung bzw. Gegenleistung. Eine Abschwächung würde die gerichtliche und imprecatorische Spannung des Verses interpretierend mindern; die konkrete Art der Vergeltung bleibt offen.
- issue: Funktion des Kohortativs וַאֲשַׁלְּמָה
  choice: 'Zweck/Folge: „damit ich es ihnen vergelte“'
  alternative: 'Entschluss/Folgeaussage: „und ich will es ihnen vergelten“'
  rationale: Beide Deutungen sind grammatisch möglich. Im Haupttext wird der enge Anschluss an die vorausgehenden Bitten ausgedrückt; die alternative Entschlusslesart wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch du“ markiert den Kontrast knapp; „richte mich auf“ bewahrt das körperlich-konkrete Bild und seine weiter gefasste Bedeutung der Wiederherstellung. Die Fußnotenmarke steht unmittelbar nach dem betroffenen Satzteil.
