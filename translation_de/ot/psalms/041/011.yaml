  text: בְּ/זֹ֣את יָ֭דַעְתִּי כִּֽי חָפַ֣צְתָּ בִּ֑/י כִּ֤י לֹֽא יָרִ֖יעַ אֹיְבִ֣/י עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/011.yaml
  text: 'By this I know that you delight in me: because my enemy does not triumph over me[a][b].'
translation:
  language: de
  text: Daran erkenne ich, dass du Gefallen an mir hast[a], denn mein Feind jubelt nicht über mich[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass du Freude an mir hast« beziehungsweise »dass du mir wohlgesinnt bist«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »stößt keinen Siegesruf über mich aus«. Das hebräische Verb bezeichnet hier wahrscheinlich lauten Triumph- oder Siegesjubel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: Daran
  rationale: Die Verbindung aus Präposition und Demonstrativpronomen bezeichnet das erkennbare Anzeichen oder den Beweisgrund; »Daran« ist im Deutschen knapp und idiomatisch.
- source_word: יָדַעְתִּי
  choice: erkenne ich
  rationale: Das hebräische Perfekt bezeichnet hier eine gegenwärtige, auf einem Anzeichen beruhende Gewissheit. »Erkenne ich« passt zur deutschen Wendung »Daran erkenne ich«.
- source_word: כִּי חָפַצְתָּ בִּי
  choice: dass du Gefallen an mir hast
  rationale: Das erste כִּי leitet den Inhalt der Erkenntnis ein. חפץ mit ב bezeichnet Gefallen oder Freude an jemandem, ohne den Grund dieser Zuwendung näher zu bestimmen.
- source_word: כִּי
  choice: denn
  rationale: Das zweite כִּי führt das Anzeichen beziehungsweise die Begründung für die vorangehende Aussage ein.
- source_word: לֹא יָרִיעַ
  choice: jubelt nicht
  rationale: Der Hifil von רוע bezeichnet hier einen lauten Jubel, wahrscheinlich einen Siegesruf. »Jubelt nicht« bewahrt das hörbare Bild und vermeidet eine im Hebräischen nicht ausdrücklich vorhandene modale Aussage wie »kann nicht«.
- source_word: אֹיְבִי
  choice: mein Feind
  rationale: Die Einzahl und das Suffix der ersten Person werden unmittelbar wiedergegeben.
- source_word: עָלַי
  choice: über mich
  rationale: Im Zusammenhang mit Siegesjubel bezeichnet עַל das triumphierende Jubeln über den Unterlegenen.
theological_decisions:
- issue: Gottes Gefallen als aus der ausbleibenden Schadenfreude des Feindes erschlossenes Zeichen
  choice: Der Psalmist erkennt Gottes Gefallen daran, dass sein Feind nicht über ihn jubelt.
  alternative: Die Aussage könnte stärker als ausdrückliche göttliche Rechtfertigung oder als moralisches Urteil über den Psalmisten formuliert werden.
  rationale: Der hebräische Text verbindet Gottes Gefallen mit dem ausbleibenden Siegesjubel des Feindes, nennt aber weder den Grund für Gottes Gefallen noch eine umfassende Lehre von Verdienst oder Rechtfertigung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelität und Begründungsstruktur des Hebräischen bleiben erhalten; zugleich wird die Wendung »Daran erkenne ich« natürlich deutsch formuliert.
