source:
  edition: WLC
  text: אֲֽנִי אָ֭מַרְתִּי יְהוָ֣ה חָנֵּ֑/נִי רְפָאָ֥/ה נַ֝פְשִׁ֗/י כִּי חָטָ֥אתִי לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/004.yaml
  text: As for me[a], I said, “O Yahweh, be gracious to me; heal my soul, for I have sinned against you.”
translation:
  language: de
  text: 'Ich aber sagte: »Jahwe, sei mir gnädig! Heile meine Seele[a], denn ich habe gegen dich gesündigt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Heile mein Leben« oder »Heile mich«; das hebräische Wort für »Seele« (nefesch) kann ebenso »Leben«, »Selbst« oder die ganze Person bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Ich aber
  rationale: Das ausdrücklich gesetzte selbstständige Pronomen hebt den Sprecher hervor. »Ich aber« gibt diesen leichten Gegensatz bzw. Nachdruck im Deutschen knapp und natürlich wieder, ohne ihn übermäßig zu verstärken.
- source_word: אָמַרְתִּי
  choice: sagte
  rationale: Das Qal-Perfekt der 1. Person Singular berichtet hier rückblickend, was der Beter sagte; das deutsche Präteritum passt dazu.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. »Jahwe« ist die im Deutschen geläufige Form.
- source_word: חָנֵּנִי
  choice: sei mir gnädig
  rationale: Der Imperativ von חנן bittet um gnädige Zuwendung. Die Formulierung bewahrt die Breite zwischen Gnade, Erbarmen und Gunst.
- source_word: רְפָאָה
  choice: Heile
  rationale: Der Imperativ von רפא bedeutet unmittelbar »heilen«; die konkrete Bildsprache bleibt erhalten, ohne die Heilung ausschließlich körperlich oder geistlich zu deuten.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נפש kann Seele, Leben, Selbst oder die ganze Person bezeichnen. »Meine Seele« wahrt die formale Nähe und die innere Dimension; eine Fußnote hält die größere Bedeutungsbreite offen.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier den Grund für die Bitte an. »Denn« klingt in einem Gebet natürlich und gehoben, ohne altertümlich zu wirken.
- source_word: חָטָאתִי
  choice: ich habe gesündigt
  rationale: Das Perfekt wird als deutsches Perfekt wiedergegeben und bezeichnet ein begangenes Sündigen, dessen Bedeutung für das gegenwärtige Bekenntnis fortbesteht.
- source_word: לָךְ
  choice: gegen dich
  rationale: Bei חטא bezeichnet die Präposition die betroffene bzw. verletzte Person; im Deutschen ist »gegen jemanden sündigen« die idiomatische Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Wiedergabe als »Jahwe« bewahrt den Charakter als Eigenname statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von »meine Seele heilen«
  choice: Heile meine Seele
  alternative: Heile mich / Heile mein Leben
  rationale: Das hebräische נפש kann das innere Leben, das Leben selbst oder die ganze Person meinen. Der Haupttext bewahrt die wörtliche Ausdrucksweise; die Fußnote verhindert eine unnötige Verengung auf einen ausschließlich geistlichen Sinn.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die kurzen Imperative geben die Dringlichkeit des Hebräischen wieder. »Ich aber« markiert den im selbstständigen Pronomen liegenden Nachdruck; »Seele« bleibt durch die Fußnote in der breiteren hebräischen Bedeutung offen.
