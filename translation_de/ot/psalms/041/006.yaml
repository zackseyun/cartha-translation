    issue: „Sein Herz sammelt Unheil für ihn“
    rationale: לֹו bezieht sich hier am naheliegendsten reflexiv auf den Besucher bzw. sein Herz („bei/für sich“). „Für ihn“ ist im Deutschen missverständlich und kann eine Begünstigung oder ein gegen eine andere Person gerichtetes Unheil suggerieren.
  - severity: low
    issue: „erzählt er es weiter“
    rationale: Das hebräische יְדַבֵּר bezeichnet schlichtes Reden/Sprechen. „Weitererzählen“ konkretisiert unnötig, dass ein übernommener Bericht weitergegeben werde.
