- from: Und wenn einer kommt, um mich zu sehen[a], redet er Falsches. Sein Herz sammelt Unheil für ihn; geht er hinaus, erzählt er es weiter[b].
  to: Und wenn einer kommt, um mich zu sehen[a], spricht er Falsches. Sein Herz sammelt Unheil bei sich; geht er hinaus, redet er davon.
  rationale: Die Revision klärt die reflexive Funktion von לֹו mit „bei sich“ und ersetzt das zu stark konkretisierende „erzählt ... weiter“ durch „redet ... davon“. Die knappe, parallele Satzführung und die im Hebräischen nur kontextuell erschlossene Bezugnahme des abschließenden Verbs bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T21:31:44Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: ein feindseliger Besucher spricht Falsches, hegt innerlich אָוֶן und äußert es nach dem Hinausgehen. „Unheil für ihn“ ist jedoch für לֹו semantisch zu offen und kann nahelegen, das Unheil gelte einer anderen Person. Im Zusammenhang bezeichnet die Wendung das Ansammeln von Unheil/Bosheit bei bzw. für sich selbst. „Erzählt es weiter“ fügt zudem den Aspekt eines bereits empfangenen und weitergegebenen Berichts hinzu, der im Hebräischen nicht ausdrücklich steht.'
  naturalness: Der Entwurf ist überwiegend modernes, verständliches Deutsch. „Redet er Falsches“ ist möglich, aber „spricht er Falsches“ wirkt etwas idiomatischer. Die Wiederaufnahme mit „redet er davon“ ist natürlich und macht das nur implizite Objekt kenntlich, ohne den spezifischeren Sinn von „weitererzählen“ einzutragen.
  terminology: „Herz“ bewahrt die hebräische Bezeichnung für das Innere. „Unheil“ ist als Wiedergabe von אָוֶן vertretbar, sofern die reflexive Ausrichtung von לֹו durch „bei sich“ ausgedrückt wird. „Falsches“ gibt שָׁוְא angemessen wieder und wahrt dessen Spielraum zwischen Leerem, Trügerischem und Falschem.
  issues:
