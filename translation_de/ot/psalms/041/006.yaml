  yaml_path: translation/ot/psalms/041/006.yaml
  text: And if he comes to see me[a], he speaks falsehood; his heart gathers wickedness to itself; when he goes out to the street[c][b], he speaks it.
translation:
  language: de
  text: Und wenn einer kommt, um mich zu sehen[a], spricht er Falsches. Sein Herz sammelt Unheil bei sich; geht er hinaus, redet er davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um zu sehen“; das Objekt „mich“ ist aus dem Zusammenhang ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Bewahrt sowohl die Verknüpfung mit dem vorherigen Vers als auch den bedingenden Charakter.
- source_word: בָּא לִרְאוֹת
  choice: einer kommt, um mich zu sehen
  rationale: בוא und ראה werden in ihrem gewöhnlichen Sinn wiedergegeben; das im Hebräischen unausgesprochene Objekt „mich“ ergibt sich aus dem Zusammenhang und ist im Deutschen für einen natürlichen Satz erforderlich.
- source_word: שָׁוְא יְדַבֵּר
  choice: redet er Falsches
  rationale: שָׁוְא kann Nichtigkeit, Falschheit oder Täuschung bezeichnen; angesichts des unaufrichtigen Besuchers passt „Falsches“ gut, ohne den Ausdruck unnötig festzulegen.
- source_word: לִבּוֹ
  choice: sein Herz
  rationale: Bewahrt das hebräische Bild für das innere Denken, Wollen und Planen.
- source_word: יִקְבָּץ אָוֶן לוֹ
  choice: Sein Herz sammelt Unheil für ihn
  rationale: Die syntaktische Zuordnung von לוֹ ist nicht völlig eindeutig. Die formnahe Wiedergabe „für ihn“ lässt offen, ob das Herz Unheil zu seinem eigenen Zweck sammelt oder Unheil gegen den Psalmisten zusammenträgt.
- source_word: יֵצֵא לַחוּץ
  choice: geht er hinaus
  rationale: Gibt die Bewegung nach draußen unmittelbar wieder, ohne „Straße“ oder eine ausdrücklich öffentliche Umgebung in den Text einzutragen.
- source_word: יְדַבֵּר
  choice: erzählt er es weiter
  rationale: Das unausgesprochene Objekt bezieht sich im Zusammenhang auf das gesammelte schädliche Gerede. „Weitererzählen“ macht den Übergang vom inneren Sammeln zum Verbreiten draußen in natürlichem Deutsch deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Hauptsätze bewahren die scharfe Anklage und den Ablauf des Hebräischen. „Unheil“ erhält die Bedeutungsbreite von אָוֶן zwischen Bosheit, schädlichem Planen und daraus entstehendem Schaden.
