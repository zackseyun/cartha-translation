id: PSA.41.12
reference: Psalms 41:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲנִ֗י בְּ֭/תֻמִּ/י תָּמַ֣כְתָּ בִּ֑/י וַ/תַּצִּיבֵ֖/נִי לְ/פָנֶ֣י/ךָ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/012.yaml
  text: But as for me[a], in my integrity you have upheld me[b], and you have set me before your face forever.
translation:
  language: de
  text: Mich aber hast du in meiner Lauterkeit[a] gestützt und mich für immer vor dein Angesicht[b] gestellt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch „in meiner Rechtschaffenheit“; die Präposition kann hier ebenfalls begründend verstanden werden: „wegen meiner Lauterkeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: in deine Gegenwart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mich aber
  rationale: Das selbstständige Pronomen mit der Konjunktion markiert im Zusammenhang einen Gegensatz. Die deutsche Voranstellung „Mich aber“ gibt diesen Kontrast natürlich wieder.
- source_word: בְּתֻמִּי
  choice: in meiner Lauterkeit
  rationale: תֹּם/תֻּם bezeichnet Unversehrtheit, Lauterkeit oder rechtschaffene Lebensführung. „Lauterkeit“ wahrt den moralischen Anspruch, ohne absolute Sündlosigkeit zu behaupten; die Präposition wird mit „in“ formal erhalten.
- source_word: תָּמַכְתָּ בִּי
  choice: hast du … gestützt
  rationale: תמך mit ב bezeichnet das Stützen, Festhalten oder Aufrechterhalten einer Person. „Gestützt“ ist im Deutschen klar und bewahrt das stabilisierende Bild.
- source_word: וַתַּצִּיבֵנִי
  choice: und mich … gestellt
  rationale: Der Hifil von נצב bedeutet jemanden hinstellen, seinen Stand festigen oder ihn einsetzen. „Gestellt“ gibt die konkrete Grundbedeutung wieder, ohne das stärker deutende „fest gegründet“ vorwegzunehmen.
- source_word: לְפָנֶיךָ
  choice: vor dein Angesicht
  rationale: Die Wendung bedeutet wörtlich „vor dein Angesicht“ und idiomatisch „in deine Gegenwart“. Die konkrete hebräische Bildsprache bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: עוֹלָם bezeichnet hier eine unbegrenzte, fortdauernde Zeit. „Für immer“ ist die natürliche moderne deutsche Entsprechung.
theological_decisions:
- issue: Bedeutung des Anspruchs auf תֻּם
  choice: Der Psalmist spricht von seiner Lauterkeit beziehungsweise rechtschaffenen Lebensführung.
  alternative: Der Psalmist behaupte absolute Sündlosigkeit oder einen aufgrund moralischer Vollkommenheit verdienten göttlichen Beistand.
  rationale: Der hebräische Ausdruck erhebt einen wirklichen moralischen Anspruch, verlangt aber weder die Deutung als absolute Sündlosigkeit noch als verdienstliche Selbstgerechtigkeit. „Lauterkeit“ bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Voranstellung „Mich aber“ bildet den Kontrast des Hebräischen ab; „vor dein Angesicht“ bewahrt bewusst dessen konkrete Bildsprache.
