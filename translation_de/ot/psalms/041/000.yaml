lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In den Psalmüberschriften bezeichnet die Form mit ל wahrscheinlich den Leiter der musikalischen Aufführung. »Chorleiter« ist im Deutschen klar, geläufig und dem überschriftartigen Charakter angemessen.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Das hebräische Wort bezeichnet hier die literarisch-musikalische Gattung; »Psalm« ist dafür die präzise und herkömmliche deutsche Wiedergabe.
- source_word: לְדָוִד
  choice: Davids
  rationale: Die Verbindung mit ל kann in Psalmüberschriften Urheberschaft, Zugehörigkeit oder Widmung ausdrücken. Der deutsche Genitiv bewahrt in knapper Überschriftsform eine gewisse Offenheit, ohne ausdrücklich nur »von David« oder »für David« festzulegen.
theological_decisions:
- issue: Deutung der davidischen Überschrift
  choice: Davids
  alternative: von David; für David
  rationale: Die semantische Spannweite des hebräischen לְדָוִד wird nicht einseitig auf unmittelbare Urheberschaft oder Widmung festgelegt; die möglichen Deutungen werden in der Fußnote genannt.
translation_notes:
  register: Kurze, würdevolle Überschriftsform in modernem Standarddeutsch. Der Fußnotenmarker steht unmittelbar bei »Davids«, da sich die Anmerkung auf לְדָוִד bezieht.
