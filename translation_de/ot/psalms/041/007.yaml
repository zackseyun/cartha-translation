  text: Together all who hate me whisper against me[b][a]; against me they devise evil for me.
translation:
  language: de
  text: Alle, die mich hassen, tuscheln gemeinsam gegen mich[a]; sie ersinnen mir Böses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über mich“. Die hebräische Präposition kann sowohl feindliche Ausrichtung als auch das Thema des Redens bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Sie planen Böses gegen mich“ oder „sie planen, mir zu schaden“. Das Hebräische verbindet „denken/planen“ mit „Böses“ und bezeichnet feindliche Absicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: Gemeinsam
  rationale: Das Adverb bezeichnet das gemeinschaftliche, abgestimmte Handeln der Gegner; „gemeinsam“ ist knapp und natürlich.
- source_word: עָלַי
  choice: gegen mich
  rationale: Die Präposition kann das Gesprächsthema („über mich“) oder eine feindliche Ausrichtung bezeichnen. Im Zusammenhang des Hasses und des bösen Planens liegt „gegen mich“ nahe.
- source_word: יִתְלַחֲשׁוּ
  choice: flüstern
  rationale: Die Hitpael-Form beschreibt ein leises Reden untereinander. „Flüstern“ bewahrt das Bild, ohne ausdrücklich eine formelle Verschwörung einzutragen.
- source_word: כָּל שֹׂנְאָי
  choice: alle, die mich hassen
  rationale: Die substantivierte Partizipialform wird verbal und in natürlichem modernem Deutsch wiedergegeben.
- source_word: יַחְשְׁבוּ
  choice: sinnen auf
  rationale: Das Verb kann „denken“, „planen“ oder „ersinnen“ bedeuten. Mit רָעָה drückt „auf Böses sinnen“ absichtsvolles, feindliches Planen aus und entspricht zugleich einem würdigen Psalmregister.
- source_word: רָעָה
  choice: Böses
  rationale: Die Wiedergabe bewahrt die Breite zwischen moralischem Bösen und beabsichtigtem Unheil, statt sie auf bloßen Schaden zu verengen.
- source_word: לִי
  choice: gegen mich
  rationale: Das לִי bezeichnet hier die vom geplanten Bösen betroffene Person. Im Deutschen ist „gegen mich“ idiomatischer als das missverständliche „für mich“.
