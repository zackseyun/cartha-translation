source:
  edition: WLC
  text: יְֽהוָ֗ה יִ֭סְעָדֶ/נּוּ עַל עֶ֣רֶשׂ דְּוָ֑י כָּל מִ֝שְׁכָּב֗/וֹ הָפַ֥כְתָּ בְ/חָלְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/003.yaml
  text: Yahweh will sustain him on his sickbed[a]; in his illness you restore his whole bed.
translation:
  language: de
  text: Jahwe wird ihn auf dem Krankenbett stützen; sein ganzes Lager wendest du in seiner Krankheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »In seiner Krankheit stellst du ihn wieder her.« Das hebräische Verb bedeutet wörtlich »wenden, umwenden«; hier kann das Bild Gottes fürsorgliches Handeln am Krankenlager oder die Wiederherstellung des Kranken bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: יִסְעָדֶנּוּ
  choice: wird ihn … stützen
  rationale: סעד bezeichnet das Stützen oder Aufrechterhalten eines geschwächten Menschen; »stützen« ist im Krankheitskontext klar und bewahrt das konkrete Bild.
- source_word: עַל עֶרֶשׂ דְּוָי
  choice: auf dem Krankenbett
  rationale: Die Verbindung bezeichnet ein Bett beziehungsweise Lager der Krankheit; »Krankenbett« ist eine natürliche und knappe deutsche Entsprechung.
- source_word: כָּל מִשְׁכָּבוֹ
  choice: sein ganzes Lager
  rationale: »Ganzes« erhält die umfassende Bedeutung von כָּל; »Lager« gibt מִשְׁכָּב wieder und vermeidet eine unnötig schwerfällige Wiederholung von »Bett«.
- source_word: הָפַכְתָּ
  choice: wendest du
  rationale: הפך bedeutet grundlegend »wenden/umwenden«. Die relativ formale Wiedergabe bewahrt die Mehrdeutigkeit des hebräischen Bildes, statt es im Haupttext eindeutig als Heilung oder Bettenpflege auszulegen.
- source_word: בְחָלְיוֹ
  choice: in seiner Krankheit
  rationale: Die Präposition bezeichnet hier den Umstand, unter dem das Handeln geschieht; die direkte Wiedergabe ist verständlich und würdevoll.
theological_decisions:
- issue: Wechsel der Anrede innerhalb des Verses
  choice: Der Wechsel von der dritten Person (»Jahwe … ihn«) zur direkten Anrede Gottes (»wendest du«) bleibt erhalten.
  alternative: 'Den ganzen Vers an die dritte Person angleichen: »Jahwe … er wendet …«'
  rationale: Der Personenwechsel steht im hebräischen Text und gehört zum poetisch-gebetshaften Charakter des Psalms; eine Glättung würde die Vorlage unnötig verändern.
- issue: Deutung des Wendens des Lagers
  choice: Das konkrete und mehrdeutige Bild »sein ganzes Lager wendest du« bleibt im Haupttext stehen.
  alternative: 'Deutend übersetzen: »du stellst ihn in seiner Krankheit wieder her« oder »du machst sein ganzes Bett neu«.'
  rationale: Der hebräische Ausdruck kann fürsorgliches Wenden, Verändern beziehungsweise Wiederherstellen andeuten, legt die genaue Handlung aber nicht eindeutig fest. Die Übersetzung soll diese Spannung nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit engem Anschluss an das hebräische Bild. »Krankenbett« ist allgemeinverständlich; »Lager wenden« klingt bewusst poetisch und wird durch die Fußnote erläutert.
