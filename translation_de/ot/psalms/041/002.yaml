id: PSA.41.2
reference: Psalms 41:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָ֤ה יִשְׁמְרֵ֣/הוּ וִֽ֭/יחַיֵּ/הוּ יאשר בָּ/אָ֑רֶץ וְ/אַֽל תִּ֝תְּנֵ֗/הוּ בְּ/נֶ֣פֶשׁ אֹיְבָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/002.yaml
  text: Yahweh will keep him and preserve his life[a]; he will be blessed in the land[d][c][b], and may you not give him over to the desire of his enemies.
translation:
  language: de
  text: Jahwe wird ihn behüten und am Leben erhalten[a]; im Land wird er glücklich gepriesen werden[b], und mögest du ihn nicht dem Verlangen seiner Feinde preisgeben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihm das Leben bewahren“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann bedeuten, dass jemand glücklich genannt oder als glücklich bezeichnet wird.
    reason: lexical_clarification
  - marker: c
    text: 'Wörtlich: „der Begierde seiner Feinde“; gemeint sein kann auch „dem Willen seiner Feinde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יִשְׁמְרֵהוּ
  choice: wird ihn behüten
  rationale: שׁמר bezeichnet hier schützendes Bewahren; „behüten“ ist im Deutschen natürlich, würdevoll und unterscheidet sich klar vom folgenden Erhalten des Lebens.
- source_word: וִיחַיֵּהוּ
  choice: und am Leben erhalten
  rationale: Die Piel-Form von חיה bedeutet hier, jemanden am Leben zu erhalten beziehungsweise sein Leben zu bewahren.
- source_word: יאשר
  choice: wird er glücklich gepriesen werden
  rationale: 'Die Form wird als passive Aussage verstanden: Andere erklären oder preisen ihn als glücklich. Die Formulierung bewahrt diesen deklarativen Sinn, statt lediglich einen inneren Zustand auszudrücken.'
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: אֶרֶץ kann Land, Erde oder Gebiet bedeuten; „im Land“ ist hier die naheliegende, kontextuell offene Wiedergabe.
- source_word: וְאַל תִּתְּנֵהוּ
  choice: und mögest du ihn nicht … preisgeben
  rationale: אַל mit der zweiten Person drückt eine verneinte Bitte aus. „Mögest du nicht“ erhält den unvermittelten Wechsel von der Aussage über Jahwe zur direkten Anrede.
- source_word: בְּנֶפֶשׁ אֹיְבָיו
  choice: dem Verlangen seiner Feinde
  rationale: נֶפֶשׁ bezeichnet in dieser Wendung das Begehren oder den Willen der Feinde, nicht die „Seele“ im neuzeitlichen Sinn.
theological_decisions:
- issue: Wechsel von der Aussage über Jahwe zur direkten Bitte an Jahwe
  choice: 'Die ersten Satzteile stehen als zuversichtliche Aussage in der dritten Person; der letzte wird als Bitte in der zweiten Person wiedergegeben: „mögest du ihn nicht …“'
  alternative: 'Den ganzen Vers als Aussage in der dritten Person wiederzugeben: „und er wird ihn nicht … preisgeben“'
  rationale: תִּתְּנֵהוּ ist grammatisch zweite Person Maskulin Singular. Der Wechsel der Anrede ist im hebräischen Text vorhanden und wird nicht harmonisiert.
- issue: Bedeutung von יאשר
  choice: „wird … glücklich gepriesen werden“ im Sinn einer öffentlichen Erklärung
  alternative: „wird … gesegnet sein“ als reine Zustandsaussage
  rationale: Die passive Form von אשר legt nahe, dass der Betreffende von anderen glücklich genannt oder gepriesen wird. Die Übersetzung hält diesen Unterschied fest, ohne das Glück mit einem engeren theologischen Segensbegriff gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Behüten“ und „glücklich preisen“ bewahren den poetischen Ton, bleiben aber allgemein verständlich. Der auffällige Personenwechsel im letzten Satzteil wird bewusst nicht geglättet.
