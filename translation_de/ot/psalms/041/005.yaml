base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/005.yaml
  text: 'My enemies say evil against me: “When will he die and his name perish?”[a][b]'
translation:
  language: de
  text: Meine Feinde sagen Böses über mich:[a] »Wann wird er sterben und sein Name vergehen?«[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sagen Schädliches über mich«. Wörtlich spricht das Hebräische davon, Böses gegen den Psalmisten zu sagen.'
    reason: lexical_alternative
  - marker: b
    text: Dass sein »Name vergeht«, kann das Ende seines Ansehens oder der Erinnerung an ihn meinen, nicht nur das Verschwinden des gesprochenen Namens.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹיְבַי
  choice: Meine Feinde
  rationale: Das Substantiv im Plural mit Suffix der 1. Person Singular bedeutet unmittelbar »meine Feinde«; die Wiedergabe ist natürlich und bewahrt die feindselige Aussage.
- source_word: יֹאמְרוּ
  choice: reden
  rationale: Das Imperfekt kann hier gegenwärtiges beziehungsweise wiederholtes Handeln bezeichnen. »reden« fügt sich im Deutschen natürlich in die Verbindung »Böses gegen mich reden«.
- source_word: רַע לִי
  choice: Böses gegen mich
  rationale: רַע bezeichnet Böses oder Schädliches, während לִי die feindliche Ausrichtung auf den Psalmisten markiert. Die Formulierung bleibt nahe am Hebräischen, ohne sie auf Verleumdung oder konkrete Schadensabsichten einzuengen.
- source_word: מָתַי יָמוּת
  choice: Wann wird er sterben
  rationale: מָתַי ist die direkte Frage »wann«; das Imperfekt von מות hat in dieser Frage Zukunftssinn. Die feindliche Todessehnsucht wird erkennbar, ohne den Satz ausdrücklich als Wunschform wiederzugeben.
- source_word: וְאָבַד שְׁמוֹ
  choice: und sein Name vergehen
  rationale: אבד bedeutet hier zugrunde gehen beziehungsweise verschwinden. »Name« wird im Haupttext beibehalten und kann nach hebräischem Sprachgebrauch auch Ansehen und fortdauerndes Andenken umfassen.
