base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/001.yaml
  text: Blessed is the one who considers the poor[c][b][a]; in the day of trouble Yahweh will deliver him.
translation:
  language: de
  text: Glücklich ist, wer auf den Armen bedacht ist[a][b]; am Tag des Unheils[c] wird Jahwe ihn retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer sich dem Armen gegenüber verständig verhält“. Das hebräische Verb kann sowohl verständiges Erfassen als auch daraus folgendes umsichtiges Handeln bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem Schwachen“ beziehungsweise „dem Bedürftigen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „am Tag des Bösen“. Gemeint ist hier Unheil oder Not, nicht moralische Bosheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die hebräische Seligpreisungsformel bezeichnet einen Menschen als glücklich beziehungsweise begünstigt. „Glücklich ist“ ist im heutigen Deutsch verständlich und bewahrt den weisheitlichen Charakter, ohne das subjektive Gefühl allein in den Vordergrund zu stellen.
- source_word: מַשְׂכִּיל אֶל
  choice: wer achtsam mit … umgeht
  rationale: Das Hifil von שׂכל bezeichnet einsichtiges, verständiges Handeln; mit אֶל ist dieses Handeln auf den Betroffenen ausgerichtet. Die Formulierung umfasst sowohl aufmerksame Wahrnehmung als auch klugen, angemessenen Umgang.
- source_word: דָּל
  choice: dem Armen
  rationale: דָּל kann einen armen, schwachen oder sozial verletzlichen Menschen bezeichnen. „der Arme“ gibt die häufigste konkrete Bedeutung wieder, während eine Fußnote die größere Bedeutungsbreite offenhält.
- source_word: בְּיוֹם רָעָה
  choice: am Tag des Unheils
  rationale: רָעָה bezeichnet hier widrige Umstände, Not oder Unglück und nicht in erster Linie moralische Bosheit. „Unheil“ bewahrt die Schwere und den bildhaften Ausdruck „Tag des …“.
- source_word: יְמַלְּטֵהוּ
  choice: wird … ihn retten
  rationale: Das Piel von מלט bezeichnet das Entkommenlassen beziehungsweise die Rettung aus Gefahr. „retten“ ist klar, kräftig und im modernen Deutsch natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Generisches Maskulinum beim singularischen Verheißungsempfänger
  choice: Singular mit „wer“ und „ihn“ beibehalten
  alternative: 'Pluralisch formulieren: „die … sie“'
  rationale: Der hebräische Text zeichnet eine repräsentative Einzelperson und verwendet anschließend ein maskulines Singularsuffix. „Wer“ lässt die allgemeine Geltung erkennen; „ihn“ wahrt den grammatischen Singular und legt nicht fest, dass die Aussage nur Männern gilt.
- issue: Verheißung als weisheitliche Aussage
  choice: Die Zusage direkt und uneingeschränkt übersetzen
  alternative: Sie ausdrücklich als bloße allgemeine Lebensregel oder als ausnahmslose Wohlstandsgarantie deuten
  rationale: Der Vers formuliert Jahwes Rettung mit voller Aussagekraft. Die Übersetzung fügt weder eine dogmatische Einschränkung hinzu noch macht sie aus der Aussage eine umfassende Wohlstandsverheißung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem weisheitlich-poetischem Ton. Der Parallelismus und der repräsentative Singular bleiben erhalten; unnötig altertümliche Wendungen wie „Wohl dem“ werden vermieden.
