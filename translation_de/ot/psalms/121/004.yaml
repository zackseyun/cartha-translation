  text: הִנֵּ֣ה לֹֽא יָ֭נוּם וְ/לֹ֣א יִישָׁ֑ן שׁ֝וֹמֵ֗ר יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/004.yaml
  text: Look[a], the keeper of Israel neither slumbers nor sleeps.
translation:
  language: de
  text: Sieh, der Hüter Israels schlummert nicht und schläft nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel hebt die folgende Aussage nachdrücklich hervor. „Sieh“ bewahrt ihren hinweisenden Charakter in knapper, würdiger Sprache.
- source_word: לֹא יָנוּם וְלֹא יִישָׁן
  choice: schlummert nicht und schläft nicht
  rationale: Die beiden Verben und die wiederholte Verneinung werden bewahrt. „Schlummern“ bezeichnet leichten Schlaf beziehungsweise Eindösen und bleibt so von „schlafen“ unterschieden.
- source_word: שֹׁמֵר
  choice: Hüter
  rationale: Das substantivisch gebrauchte Partizip bezeichnet den, der bewahrt oder behütet. „Hüter“ ist knapp, würdig und hält die Leitwortverbindung zum Bewahren und Behüten im Psalm offen.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Übliche deutsche Form des Eigennamens.
theological_decisions:
- issue: Anthropomorphe Beschreibung der Wachsamkeit Gottes
  choice: Das poetische Bild vom Nichtschlummern und Nichtschlafen bleibt unverändert erhalten.
  alternative: Die Aussage abstrakt als Gottes unablässige Wachsamkeit wiederzugeben.
  rationale: Der hebräische Text spricht bildhaft und macht keine darüber hinausgehende philosophische Aussage über Gottes Verhältnis zum Schlaf. Die Übersetzung wahrt dieses Bild und seine theologische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Ton. Der Doppelpunkt nach „Sieh“ gibt der hebräischen Aufmerksamkeitspartikel eigenes Gewicht; die parallelen Verneinungen werden formal bewahrt.
