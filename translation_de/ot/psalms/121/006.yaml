  text: יוֹמָ֗ם הַ/שֶּׁ֥מֶשׁ לֹֽא יַכֶּ֗/כָּה וְ/יָרֵ֥חַ בַּ/לָּֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/006.yaml
  text: By day the sun will not strike you[b][a], nor the moon by night.
translation:
  language: de
  text: Am Tag wird dich die Sonne nicht treffen[a], und bei Nacht auch nicht der Mond.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird dir nicht schaden«. Das hebräische Verb bedeutet wörtlich »schlagen« oder »treffen«, kann hier aber eine schädigende Wirkung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Gegenüberstellung »am Tag … bei Nacht« kann umfassenden Schutz zu jeder Zeit ausdrücken. Sonne und Mond können dabei wörtlich, bildlich oder in beiderlei Sinn verstanden werden.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹמָם
  choice: Am Tag
  rationale: Die adverbiale Zeitangabe wird natürlich und knapp wiedergegeben und bildet mit »bei Nacht« den poetischen Gegensatz.
- source_word: הַשֶּׁמֶשׁ
  choice: die Sonne
  rationale: Direkte Wiedergabe des bestimmten Substantivs.
- source_word: לֹא יַכֶּכָּה
  choice: wird dich nicht treffen
  rationale: נכה bezeichnet konkret ein Schlagen oder Treffen. »Treffen« bewahrt das Bild in heutigem Deutsch; »schaden« wäre möglich, aber stärker deutend.
- source_word: וְיָרֵחַ
  choice: noch der Mond
  rationale: Die vorangehende Verneinung gilt auch für das parallele zweite Glied; »noch« bildet diese Verknüpfung idiomatisch ab.
- source_word: בַּלָּיְלָה
  choice: bei Nacht
  rationale: Bewahrt knapp den zeitlichen und poetischen Parallelismus zu »Am Tag«.
theological_decisions:
- issue: Art und Umfang des zugesagten Schutzes
  choice: Die konkrete Bildsprache von Sonne und Mond bleibt stehen, ohne festzulegen, ob sie wörtlich, bildlich oder in beiderlei Sinn zu verstehen ist.
  alternative: Als ausdrückliche Aussage umfassenden Schutzes zu jeder Zeit paraphrasieren oder auf Schutz vor natürlichen Einwirkungen beziehungsweise alten Vorstellungen mondbedingter Gefährdung einschränken.
  rationale: Die Paarung von Tag und Nacht kann als Merismus umfassenden Schutz ausdrücken, doch der Vers nennt konkret Sonne und Mond. Die Übersetzung soll diese Spannung nicht auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem poetischem Parallelismus. »Treffen« erhält das konkrete hebräische Bild, ohne das altertümliche »schlagen« oder das interpretierende »schaden« in den Haupttext zu setzen.
