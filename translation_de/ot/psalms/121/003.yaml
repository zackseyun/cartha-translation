source:
  edition: WLC
  text: אַל יִתֵּ֣ן לַ/מּ֣וֹט רַגְלֶ֑/ךָ אַל יָ֝נ֗וּם שֹֽׁמְרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/003.yaml
  text: He will not let your foot slip[b][a]; your keeper will not slumber.
translation:
  language: de
  text: Er wird deinen Fuß nicht wanken lassen[a]; dein Hüter wird nicht schlummern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Wunsch oder Gebet: »Er lasse deinen Fuß nicht wanken; dein Hüter schlummere nicht.« Die hebräischen Formen können sowohl als Wunsch wie auch als zuversichtliche Zusage verstanden werden. Für »wanken« sind auch »ausgleiten«, »taumeln« oder »ins Rutschen geraten« möglich.'
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: wird nicht
  rationale: אַל mit den folgenden Imperfektformen kann einen Wunsch oder Jussiv ausdrücken. Im Zusammenhang des Psalms wird die Form im Haupttext als zuversichtliche Zusage wiedergegeben; die mögliche Wunschlesart bleibt in der Fußnote erhalten.
- source_word: יִתֵּן
  choice: wird … lassen
  rationale: נתן bedeutet wörtlich »geben«, hat in dieser Konstruktion jedoch erlaubenden Sinn. Die deutsche Wendung »nicht wanken lassen« gibt dies natürlich wieder.
- source_word: לַמּוֹט
  choice: wanken
  rationale: מוֹט bezeichnet das Verlieren festen Halts, ein Wanken, Gleiten oder Taumeln. »Den Fuß nicht wanken lassen« bewahrt das konkrete Bild und klingt zugleich würdig und verständlich.
- source_word: רַגְלֶךָ
  choice: deinen Fuß
  rationale: Der hebräische Singular mit Suffix der zweiten Person maskulin Singular wird beibehalten.
- source_word: יָנוּם
  choice: wird … schlummern
  rationale: נוּם bezeichnet Dösen oder Schlummern, nicht unbedingt tiefen Schlaf. »Schlummern« bewahrt die poetische Abstufung zum folgenden Vers.
- source_word: שֹׁמְרֶךָ
  choice: dein Hüter
  rationale: Das Partizip von שׁמר bezeichnet den, der bewacht, behütet oder bewahrt. »Hüter« ist knapp, poetisch und ermöglicht die Wiederaufnahme des Schlüsselworts im Psalm.
theological_decisions:
- issue: Aussageweise der Verneinungen אַל mit Imperfektformen
  choice: 'Zuversichtliche Zusage: »Er wird … nicht …; dein Hüter wird nicht …«'
  alternative: 'Wunsch oder Gebet: »Er lasse deinen Fuß nicht wanken; dein Hüter schlummere nicht.«'
  rationale: Die Formen lassen eine jussivische Wunschlesart zu, doch der Zusammenhang von Psalm 121 ist von zuversichtlicher Zusicherung geprägt. Der Haupttext folgt daher der deklarativen Lesart, während die echte grammatische Spannung in der Fußnote offengelegt wird.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdiger Psalmensprache. »Hüter« bewahrt die poetische Wiederholung des hebräischen Schlüsselworts שׁמר; »schlummern« unterscheidet sich passend vom vollen Schlaf im Folgevers.
