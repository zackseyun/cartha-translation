  text: עֶ֭זְרִ/י מֵ/עִ֣ם יְהוָ֑ה עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/002.yaml
  text: My help comes from Yahweh[b][a], the Maker of heaven and earth.
translation:
  language: de
  text: Meine Hilfe kommt[a] von Jahwe, dem Schöpfer von Himmel[b] und Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Meine Hilfe ist von Jahwe.“ Im Hebräischen steht in diesem Satzteil kein ausdrückliches finites Verb.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Wort für „Himmel“ hat eine pluralische Form. Möglich ist auch: „dem Schöpfer der Himmel und der Erde“. Die feste deutsche Wendung lautet gewöhnlich „Himmel und Erde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶזְרִי
  choice: Meine Hilfe
  rationale: עֵזֶר bezeichnet Hilfe oder Beistand. „Meine Hilfe“ ist im Deutschen natürlich, knapp und bewahrt das persönliche Abhängigkeitsbekenntnis des Verses.
- source_word: מֵעִם
  choice: kommt von
  rationale: Die Präposition bezeichnet hier Jahwe als Ursprung der Hilfe. Da im Hebräischen kein finites Verb steht, gibt „kommt von“ den gemeinten Herkunftsbezug idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text verwendet den Gottesnamen יהוה. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: עֹשֵׂה
  choice: Schöpfer
  rationale: Das Partizip bezeichnet Jahwe als denjenigen, der Himmel und Erde macht. „Schöpfer“ ist eine knappe, natürliche und titelartige Wiedergabe, ohne die Aussage allein auf einen vergangenen Vorgang zu beschränken.
- source_word: שָׁמַיִם
  choice: Himmel
  rationale: Das morphologisch pluralische שָׁמַיִם wird in der festen deutschen Verbindung „Himmel und Erde“ idiomatisch im Singular wiedergegeben.
- source_word: וָאָרֶץ
  choice: und Erde
  rationale: In der umfassenden Wortverbindung „Himmel und Erde“ meint אֶרֶץ die Erde beziehungsweise die geschaffene Welt, nicht ein bestimmtes Land.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Charakter als persönlichen Namen und ersetzt ihn nicht durch einen Titel.
- issue: Zeitliche und titelartige Bedeutung von עֹשֵׂה
  choice: dem Schöpfer von Himmel und Erde
  alternative: der Himmel und Erde gemacht hat
  rationale: Das hebräische Partizip kann eine kennzeichnende, titelartige Aussage ausdrücken. „Schöpfer“ bewahrt diese Kraft und legt die Form nicht unnötig ausschließlich als abgeschlossene Vergangenheit aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Bekenntnisform des Hebräischen bleibt erhalten; notwendige deutsche Satzergänzungen und idiomatische Anpassungen werden in den Fußnoten transparent gemacht.
