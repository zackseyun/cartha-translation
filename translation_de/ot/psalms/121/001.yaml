base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/001.yaml
  text: A Song of Ascents[a]. I lift up my eyes to the mountains— from where will my help come?
translation:
  language: de
  text: 'Ein Lied der Aufstiege.[a]


    Ich erhebe meine Augen zu den Bergen[b] –

    woher wird meine Hilfe kommen?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Ein Stufenlied« oder »Ein Lied für die Aufstiege«. Die genaue Bedeutung der Überschrift ist unklar.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Hügel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Ein Lied
  rationale: שִׁיר bezeichnet ein Lied; »Psalm« wäre eine spezifischere Gattungsbezeichnung, die das hebräische Wort selbst nicht ausdrückt.
- source_word: לַמַּעֲלוֹת
  choice: der Aufstiege
  rationale: Die knappe Wiedergabe bewahrt das Bild des Hinaufsteigens und lässt offen, ob Pilgerreisen, Stufen oder eine liturgische Verwendung gemeint sind.
- source_word: אֶשָּׂא
  choice: Ich erhebe
  rationale: Das Qal-Imperfekt der 1. Person Singular wird hier als lebendige gegenwärtige Handlung wiedergegeben; »die Augen erheben« ist im Deutschen idiomatisch und würdevoll.
- source_word: עֵינַי
  choice: meine Augen
  rationale: Direkte Wiedergabe des Substantivs mit Suffix der 1. Person Singular.
- source_word: אֶל הֶהָרִים
  choice: zu den Bergen
  rationale: »Zu« erhält die Richtungsangabe; הָרִים wird seinem üblichen Bedeutungsgewicht entsprechend mit »Bergen« wiedergegeben.
- source_word: מֵאַיִן
  choice: woher
  rationale: Das moderne deutsche Fragewort gibt die Frage nach dem Ursprung der Hilfe natürlich und genau wieder.
- source_word: יָבֹא
  choice: wird … kommen
  rationale: Das Imperfekt bezeichnet hier naheliegend ein erwartetes beziehungsweise zukünftiges Kommen.
- source_word: עֶזְרִי
  choice: meine Hilfe
  rationale: Schlichte und direkte Wiedergabe von עֵזֶר mit Suffix der 1. Person Singular.
theological_decisions:
- issue: Aussage oder direkte Frage im zweiten Versglied
  choice: 'Direkte Frage: »woher wird meine Hilfe kommen?«'
  alternative: 'Aussage beziehungsweise indirekte Frage: »woher meine Hilfe kommt«'
  rationale: מֵאַיִן mit יָבֹא bildet am natürlichsten eine direkte Frage. So bleibt die Spannung bestehen, die erst Vers 2 beantwortet.
- issue: Symbolische Bedeutung der Berge
  choice: Die Berge werden ohne wertende Deutung genannt.
  alternative: Deutung als Zion, als Ort der Gefahr oder als Stätte fremder Gottesverehrung
  rationale: Der hebräische Wortlaut legt in diesem Vers keine bestimmte symbolische Bedeutung fest; die Übersetzung soll diese Offenheit bewahren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Zeilengestaltung. Die ungewöhnliche Überschrift bleibt bewusst nah am offenen hebräischen Ausdruck; mögliche geläufigere Deutungen stehen in der Fußnote. Der Gedankenstrich verbindet Blickrichtung und Frage, ohne die Berge bereits als Quelle der Hilfe zu bestimmen.
