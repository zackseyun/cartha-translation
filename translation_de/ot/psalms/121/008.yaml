source:
  edition: WLC
  text: יְֽהוָ֗ה יִשְׁמָר צֵאתְ/ךָ֥ וּ/בוֹאֶ֑/ךָ מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/008.yaml
  text: Yahweh will keep your going out and your coming in from now on and forever[a][b].
translation:
  language: de
  text: Jahwe wird dein Hinausgehen und dein Hereinkommen behüten, von nun an bis in Ewigkeit.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen Ausgang und deinen Eingang bewachen“. Die hebräische Wendung „Hinausgehen und Hereinkommen“ kann umfassend alle Wege und den ganzen Lebenslauf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „von nun an und bis in Ewigkeit“.'
    reason: previous_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, sodass der im Hebräischen stehende Eigenname erhalten bleibt.
- source_word: יִשְׁמָר
  choice: wird … behüten
  rationale: „Behüten“ gibt die Schutzbedeutung von שׁמר wieder und bewahrt die Verbindung zu den wiederholten Vorkommen dieses Verbs in Psalm 121.
- source_word: צֵאתְךָ
  choice: dein Hinausgehen
  rationale: Die substantivierte Form erhält zusammen mit „Hereinkommen“ das konkrete hebräische Begriffspaar, ohne es auf einen einzelnen Aufbruch einzuengen.
- source_word: וּבוֹאֶךָ
  choice: und dein Hereinkommen
  rationale: Die parallele Wiedergabe bewahrt den Merismus, der umfassend die Wege und Lebensbewegungen des Angesprochenen bezeichnen kann.
- source_word: מֵעַתָּה
  choice: von nun an
  rationale: Diese natürliche deutsche Wendung bezeichnet den gegenwärtigen Ausgangspunkt der fortdauernden Bewahrung.
- source_word: וְעַד עוֹלָם
  choice: bis in Ewigkeit
  rationale: Die Formulierung gibt die zeitlich unbegrenzte Zukunft wieder und entspricht idiomatischem, würdevollem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite von „Hinausgehen und Hereinkommen“
  choice: Das hebräische Begriffspaar im Haupttext bewahren
  alternative: deinen gesamten Lebensweg behüten
  rationale: Die konkrete Bildsprache kann die Gesamtheit der Wege oder des Lebens umfassen, sollte aber nicht im Haupttext auf eine einzige abstrakte Deutung festgelegt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Parallelität. „Hinausgehen und Hereinkommen“ ist bewusst konkreter und etwas formeller als eine rein deutende Umschreibung; die Fußnote erläutert die idiomatische Weite.
