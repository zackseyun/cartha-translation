base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/005.yaml
  text: Yahweh is your keeper[a]; Yahweh is your shade at your right hand.
translation:
  language: de
  text: Jahwe ist dein Hüter; Jahwe ist dein Schatten[a] zu deiner Rechten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist schützender Schatten unmittelbar an deiner Seite.
    reason: Die Fußnote erläutert die Schutzfunktion des wörtlichen Bildes, ohne es im Haupttext aufzulösen.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שֹׁמְרֶךָ
  choice: dein Hüter
  rationale: Das Partizip bezeichnet anhaltendes Hüten und Bewahren. Die substantivische Wiedergabe erhält die Form des Hebräischen und den Leitwortbezug zu שׁמר im Psalm.
- source_word: צִלְּךָ
  choice: dein Schatten
  rationale: צֵל bezeichnet wörtlich Schatten und meint im Kontext schützenden Schatten. Die konkrete Bildsprache bleibt erhalten, statt sie zu „Schutz“ zu abstrahieren.
- source_word: עַל יַד יְמִינֶךָ
  choice: zu deiner Rechten
  rationale: Die idiomatische deutsche Wendung gibt die unmittelbare Nähe an der rechten Seite wieder und bewahrt zugleich das konkrete räumliche Bild.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname Gottes. Seine Wiedergabe als „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hüter“ und „zu deiner Rechten“ bewahren die poetische Prägnanz und die konkrete Bildsprache des Psalms.
