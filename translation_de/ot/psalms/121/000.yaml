base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/000.yaml
  text: A Song of Ascents[a]. I lift up my eyes to the mountains; from where will my help come?
translation:
  language: de
  text: 'Ein Wallfahrtslied.[a]


    Ich erhebe meine Augen zu den Bergen.[b]

    Woher wird meine Hilfe kommen?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ein Lied der Aufstiege«; traditionell auch »Stufenlied« genannt.'
    reason: Die hebräische Überschrift ist mehrdeutig und kann sich auf Pilgeraufzüge, Stufen oder Aufstiege beziehen.
  - marker: b
    text: 'Oder: »Hügeln« beziehungsweise »Anhöhen«.'
    reason: Das hebräische Wort kann je nach Zusammenhang Berge oder kleinere Erhebungen bezeichnen.
lexical_decisions:
- source_word: שִׁיר לַמַּעֲלוֹת
  choice: Ein Wallfahrtslied
  rationale: Die Überschrift bezeichnet ein Lied der »Aufstiege«; »Wallfahrtslied« gibt im Deutschen die wahrscheinlich gemeinten Aufzüge der Pilger nach Jerusalem natürlich und verständlich wieder, während die wörtlichere Deutung in der Fußnote erhalten bleibt.
- source_word: אֶשָּׂא עֵינַי
  choice: Ich erhebe meine Augen
  rationale: Die bildhafte hebräische Formulierung wird würdevoll und eng am Ausgangstext wiedergegeben, ohne sie zum bloßen »Hinaufblicken« abzuschwächen.
- source_word: הֶהָרִים
  choice: den Bergen
  rationale: »Berge« ist die übliche Grundbedeutung; je nach Landschaft und Kontext kann das Wort auch Anhöhen oder Hügel bezeichnen.
- source_word: מֵאַיִן יָבֹא עֶזְרִי
  choice: Woher wird meine Hilfe kommen?
  rationale: Die Frageform und die Zukunftsorientierung des hebräischen Imperfekts bleiben erhalten; die Spannung wird nicht durch eine vorweggenommene Antwort aufgelöst.
theological_decisions:
- issue: Bezug der Berge zur erwarteten Hilfe
  choice: Die Frage bleibt offen formuliert.
  alternative: Die Berge ausdrücklich als Quelle der Hilfe oder ausschließlich als heidnische Kultstätten deuten.
  rationale: Der Vers selbst bestimmt noch nicht, ob der Blick auf die Berge Hoffnung, Unsicherheit oder beides ausdrückt; die folgenden Verse geben erst die Antwort.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Klang. Die Parallelstruktur aus Aussage und anschließender Frage bleibt sichtbar; echte lexikalische und kontextuelle Mehrdeutigkeit wird in den Fußnoten bewahrt.
