  source_fidelity: Der hebräische Titel שִׁיר לַמַּעֲלוֹת wird mit „Ein Wallfahrtslied“ als plausible, im Deutschen idiomatische Deutung wiedergegeben; die wörtlichere und breitere Bedeutung ist korrekt in der Fußnote gesichert. „Ich erhebe meine Augen zu den Bergen“ entspricht אֶשָּׂא עֵינַי אֶל־הֶהָרִים. Die offene Frage „Woher wird meine Hilfe kommen?“ gibt מֵאַיִן יָבֹא עֶזְרִי samt seiner zukunftsgerichtet möglichen Imperfektform wieder, ohne die Antwort der folgenden Verse vorwegzunehmen.
