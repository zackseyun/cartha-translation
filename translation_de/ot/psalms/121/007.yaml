source:
  edition: WLC
  text: יְֽהוָ֗ה יִשְׁמָרְ/ךָ֥ מִ/כָּל רָ֑ע יִ֝שְׁמֹ֗ר אֶת נַפְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/007.yaml
  text: Yahweh will keep you from all evil[a]; he will keep your soul.
translation:
  language: de
  text: 'Jahwe wird dich vor allem Bösen[a] bewahren;

    er wird dein Leben[b] bewahren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: vor allem Unheil. Das hebräische Wort kann Böses, Unheil oder Schaden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: deine Seele. Das hebräische Wort nefesch kann je nach Zusammenhang das Leben, die Person selbst oder die Seele bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen JHWH in der im Deutschen etablierten Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: יִשְׁמָרְךָ / יִשְׁמֹר
  choice: wird dich … bewahren / wird … bewahren
  rationale: שׁמר bezeichnet behütendes Bewahren und Beschützen. Die Wiederholung im Hebräischen wird als prägendes Motiv des Psalms beibehalten.
- source_word: מִכָּל רָע
  choice: vor allem Bösen
  rationale: Bewahrt die umfassende und zugleich mehrdeutige Aussage des Hebräischen; רָע kann sowohl moralisch Böses als auch Unheil oder Schaden bezeichnen.
- source_word: נַפְשֶׁךָ
  choice: dein Leben
  rationale: נֶפֶשׁ bezeichnet hier wahrscheinlich das Leben beziehungsweise die ganze lebende Person. „Leben“ vermeidet eine unnötige Verengung auf eine vom Körper getrennte Seele.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen; die Übersetzung macht ihn sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von נַפְשֶׁךָ
  choice: dein Leben
  alternative: deine Seele
  rationale: „Leben“ passt zum Schutzthema des Psalms und lässt die althebräische ganzheitliche Rede vom Menschen bestehen; die traditionelle Alternative wird in der Fußnote genannt.
- issue: Bedeutungsumfang von רָע
  choice: allem Bösen
  alternative: allem Unheil
  rationale: Die Hauptfassung erhält die moralische und allgemeine Weite des Ausdrucks, während die Fußnote darauf hinweist, dass auch drohendes Unheil oder Schaden gemeint sein kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und die Wiederholung von „bewahren“ bilden die hebräische Gestaltung und das Leitmotiv von Psalm 121 nach.
