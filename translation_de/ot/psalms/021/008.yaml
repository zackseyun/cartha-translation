  text: תִּמְצָ֣א יָ֭דְ/ךָ לְ/כָל אֹיְבֶ֑י/ךָ יְ֝מִֽינְ/ךָ תִּמְצָ֥א שֹׂנְאֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/008.yaml
  text: Your hand will find all your enemies[a]; your right hand will find those who hate you.
translation:
  language: de
  text: Deine Hand wird alle deine Feinde finden[a]; deine rechte Hand wird die finden, die dich hassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erreichen“ oder „einholen“; das hebräische Wort für „finden“ kann hier bedeuten, dass man die Feinde erfolgreich erreicht und ergreift.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: wird … finden
  rationale: מצא bedeutet gewöhnlich „finden“. Im kriegerischen Kontext schwingt mit, dass die Hand die Feinde erreicht und ihrer habhaft wird; „finden“ bewahrt zugleich das hebräische Bild.
- source_word: יָדְךָ
  choice: deine Hand
  rationale: Die konkrete Körpermetapher für wirksame Macht und handelnde Kraft bleibt erhalten.
- source_word: לְכָל
  choice: all deine
  rationale: Gibt die umfassende Bedeutung von כל im Deutschen natürlich wieder.
- source_word: אֹיְבֶיךָ
  choice: Feinde
  rationale: Übliche Wiedergabe von אויב; das Suffix der 2. Person Singular wird durch „deine“ ausgedrückt.
- source_word: יְמִינְךָ
  choice: deine rechte Hand
  rationale: Bewahrt den hebräischen Parallelismus und das traditionelle Bild von Stärke und siegreicher Tatkraft.
- source_word: שֹׂנְאֶיךָ
  choice: die, die dich hassen
  rationale: Gibt den verbalen Charakter des Partizips wieder und vermeidet, es lediglich durch ein weiteres Substantiv wie „Feinde“ zu ersetzen.
theological_decisions:
- issue: Anthropomorphe Sprache für göttliche beziehungsweise königliche Macht in einem Königspsalm
  choice: Die konkreten Bilder „Hand“ und „rechte Hand“ werden beibehalten.
  alternative: Deine Macht wird all deine Feinde einholen.
  rationale: Der hebräische Text verwendet eine poetisch und theologisch bedeutsame Körpermetaphorik. Ihre Beibehaltung vermeidet eine erklärende Abstraktion und wahrt Parallelismus und Aussagekraft.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Singular. Der Parallelismus und die konkrete Bildsprache des Hebräischen bleiben erhalten.
