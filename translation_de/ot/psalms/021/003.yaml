source:
  edition: WLC
  text: כִּֽי תְ֭קַדְּמֶ/נּוּ בִּרְכ֣וֹת ט֑וֹב תָּשִׁ֥ית לְ֝/רֹאשׁ֗/וֹ עֲטֶ֣רֶת פָּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/003.yaml
  text: For you meet him with blessings of good[c][b][a]; you set a crown of fine gold on his head.
translation:
  language: de
  text: Denn du kommst ihm mit guten Segnungen entgegen[a]; du setzt ihm eine Krone aus Feingold[b] aufs Haupt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du gehst ihm mit guten Segnungen voraus“ beziehungsweise „du kommst ihm mit guten Segnungen zuvor“. Das hebräische Verb kann sowohl entgegenkommen als auch jemandem mit etwas vorausgehen oder zuvorkommen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus reinem Gold“ beziehungsweise „aus geläutertem Gold“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet hier wahrscheinlich die Begründung für die Freude und die erfüllte Bitte des Königs aus dem vorhergehenden Vers ein.
- source_word: תְקַדְּמֶנּוּ
  choice: du kommst ihm … entgegen
  rationale: Das Piel von קדם kann ein Entgegenkommen oder ein Zuvorkommen bezeichnen. Die gewählte Formulierung ist natürlich und bewahrt Gottes Initiative.
- source_word: בִּרְכוֹת טוֹב
  choice: mit guten Segnungen
  rationale: Die Wiedergabe hält sowohl den Plural ‚Segnungen‘ als auch die breite Bedeutung von טוֹב fest, ohne sie auf materiellen Wohlstand oder geistlichen Segen einzuengen.
- source_word: תָּשִׁית
  choice: du setzt
  rationale: Das Verb bezeichnet ein Setzen oder Platzieren; zusammen mit einer Krone ist ‚setzen‘ im Deutschen idiomatisch.
- source_word: לְרֹאשׁוֹ
  choice: aufs Haupt
  rationale: Bei einem Verb des Setzens bezeichnet לְ hier das Ziel der Handlung. ‚Haupt‘ wahrt den gehobenen poetischen Ton.
- source_word: עֲטֶרֶת
  choice: eine Krone
  rationale: Das Substantiv kann Krone oder Kranz bedeuten; im königlichen Zusammenhang ist ‚Krone‘ sachlich und kontextuell angemessen.
- source_word: פָּז
  choice: Feingold
  rationale: פָּז bezeichnet hochwertiges, reines oder geläutertes Gold. ‚Feingold‘ ist prägnant und im Deutschen geläufig.
theological_decisions:
- issue: Art der dem König gewährten Segnungen
  choice: Die Wendung bleibt allgemein und bezeichnet Gottes gutes, segensreiches Handeln, ohne dessen Inhalt näher festzulegen.
  alternative: Die Segnungen ausdrücklich als materiellen Wohlstand oder als geistlich-bundestheologische Gaben deuten.
  rationale: Der hebräische Ausdruck בִּרְכוֹת טוֹב ist weit gefasst. Eine engere Bestimmung würde eine theologische Deutung in den Text eintragen, die der Vers selbst nicht ausdrücklich vornimmt.
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem poetischem Klang. Die Satzstruktur bleibt eng am hebräischen Parallelismus; „aufs Haupt“ hebt das Register leicht an, ohne altertümlich zu wirken.
