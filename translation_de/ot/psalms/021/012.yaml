    rationale: „bereitmachen“ verlangt im Deutschen ein Objekt. Die Fußnote sollte deutlich sagen, dass die hebräische Formulierung das auszurichtende Objekt offenlässt und weder Bogen noch Pfeile ausdrücklich nennt.
