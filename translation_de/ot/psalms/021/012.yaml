  yaml_path: translation/ot/psalms/021/012.yaml
  text: For you will make them turn their back[c][b][a]; with your bowstrings you will aim at their faces.
translation:
  language: de
  text: Denn du wirst sie zum Rückzug zwingen[a]; mit deinen Sehnen wirst du auf ihre Gesichter ausrichten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »du wirst sie zur Schulter machen«. Die knappe hebräische Wendung meint wahrscheinlich, dass die Feinde den Rücken zukehren und zurückweichen; möglich ist auch, dass sie als Ziel ausgerichtet werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mit deinen Sehnen wirst du gegen ihre Gesichter bereitmachen«. Das hebräische Bild ist stark verdichtet; die Sehnen können Bogensehnen meinen, doch weder der Bogen noch Pfeile noch das auszurichtende Objekt werden ausdrücklich genannt.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Partikel begründet hier die vorausgehende Zuversicht und verbindet den Vers natürlich mit seinem Kontext.
- source_word: תְּשִׁיתֵמוֹ שֶׁכֶם
  choice: du wirst sie zur Flucht zwingen
  rationale: Wörtlich steht eine Wendung mit »Schulter«; im militärischen Zusammenhang bezeichnet sie wahrscheinlich das Abwenden beziehungsweise die Flucht. Die Übersetzung gibt den idiomatischen Sinn wieder, ohne eine unnatürliche deutsche Formulierung zu verwenden.
- source_word: בְּמֵיתָרֶיךָ
  choice: mit deinen Bogensehnen
  rationale: מֵיתָר bezeichnet eine Schnur oder Sehne. Der Zusammenhang von Kampf und Zielen legt hier Bogensehnen nahe.
- source_word: תְּכוֹנֵן
  choice: wirst du … zielen
  rationale: Die Verbform kann »bereitmachen« oder »ausrichten« bedeuten. Zusammen mit den Bogensehnen und dem Zielobjekt ist »zielen« die natürliche kontextuelle Wiedergabe.
- source_word: עַל־פְּנֵיהֶם
  choice: auf ihre Gesichter
  rationale: Die Wiedergabe bewahrt das konkrete und eindringliche Bild des hebräischen Textes.
