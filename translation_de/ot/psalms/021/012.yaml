  source_fidelity: Die Grunddeutung von תְּשִׁיתֵמוֹ שֶׁכֶם als erzwungener Rückzug ist im militärischen Kontext gut vertretbar. Die Formulierung „zur Flucht zwingen“ ist jedoch enger als die hebräische Schulter-/Rücken-Wendung, die zunächst das Abwenden bzw. den Rückzug bildhaft ausdrückt. Für בְּמֵיתָרֶיךָ ist „Bogensehnen“ als kontextuelle Deutung möglich; das Verb תְּכוֹנֵן bezeichnet eher das Bereitmachen bzw. Ausrichten als unmittelbar das Zielen.
  naturalness: '„Mit deinen Bogensehnen wirst du auf ihre Gesichter zielen“ ist verständlich, aber im Deutschen etwas unidiomatisch: Gezielt wird gewöhnlich mit dem Bogen, während die Sehne gespannt wird. Eine Formulierung mit „ausrichten“ bewahrt die verdichtete hebräische Bildsprache und klingt natürlicher.'
  terminology: „Rückzug“ gibt die militärische Bildsprache sachlich wieder, ohne die Wendung auf eine bestimmte Fluchtweise festzulegen. „Sehnen“ bleibt im Text, während die Fußnote die mögliche Deutung als Bogensehnen und das nicht ausdrücklich genannte Objekt erklärt.
  issues:
  - severity: medium
    issue: Die Wiedergabe „zur Flucht zwingen“ ist gegenüber der Schulter-/Rücken-Metapher zu spezifisch.
    rationale: Die hebräische Wendung kann Rückzug bzw. das Zukehren des Rückens bezeichnen, ohne notwendig eine volle Flucht zu behaupten. „Zum Rückzug zwingen“ wahrt die militärische Funktion und bleibt weniger festlegend.
  - severity: low
    issue: „Mit deinen Bogensehnen ... zielen“ ist im modernen Deutschen stilistisch und sachlich weniger glatt.
    rationale: Bogensehnen werden gespannt; der Bogen bzw. ein nicht ausdrücklich genanntes Geschoss wird ausgerichtet. „Mit deinen Sehnen wirst du auf ihre Gesichter ausrichten“ lässt die im Hebräischen vorhandene Ellipse bestehen und passt besser zu תְּכוֹנֵן.
