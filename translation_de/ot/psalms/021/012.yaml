translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei parallelen Aussagen bleiben wie im Hebräischen nebeneinandergestellt; eine kausale oder zeitliche Verknüpfung wird nicht ergänzt. Die martialische Bildsprache und die Spannung zwischen Flucht und Zielen auf die Gesichter bleiben erhalten.
