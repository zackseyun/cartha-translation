id: PSA.21.9
reference: Psalms 21:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תְּשִׁיתֵ֤/מוֹ כְּ/תַנּ֥וּר אֵשׁ֮ לְ/עֵ֪ת פָּ֫נֶ֥י/ךָ יְ֭הוָה בְּ/אַפּ֣/וֹ יְבַלְּעֵ֑/ם וְֽ/תֹאכְלֵ֥/ם אֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/009.yaml
  text: You will make them like a fiery furnace at the time of your presence; Yahweh in his anger will swallow them up[a], and fire will consume them.
translation:
  language: de
  text: Du wirst sie wie einen Feuerofen machen, wenn du dich zeigst.[a] Jahwe wird sie in seinem Zorn verschlingen, und Feuer wird sie verzehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zur Zeit deines Angesichts“; auch möglich: „zur Zeit deiner Gegenwart“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשִׁיתֵמוֹ
  choice: Du wirst sie … machen
  rationale: שׁית bedeutet „setzen, stellen“ und kann mit einer Vergleichs- oder Prädikativbestimmung den herbeigeführten Zustand ausdrücken. „Machen“ gibt dies im Deutschen natürlich wieder.
- source_word: כְּתַנּוּר אֵשׁ
  choice: wie einen Feuerofen
  rationale: תנור bezeichnet einen Ofen oder Brennofen; אֵשׁ hebt die zerstörerische Feuerhitze hervor. „Feuerofen“ bewahrt das kräftige Bild knapp und verständlich.
- source_word: לְעֵת פָּנֶיךָ
  choice: wenn du dich zeigst
  rationale: Wörtlich steht „zur Zeit deines Angesichts“. פָּנִים kann hier die sichtbare Gegenwart oder das Erscheinen bezeichnen. Die verbale Formulierung ist im modernen Deutsch natürlich und lässt offen, ob der Akzent auf Gegenwart oder Erscheinen liegt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּאַפּוֹ
  choice: in seinem Zorn
  rationale: אַף bedeutet wörtlich „Nase“ und bezeichnet idiomatisch Zorn. „In seinem Zorn“ gibt den gemeinten Sinn klar wieder.
- source_word: יְבַלְּעֵם
  choice: wird sie … verschlingen
  rationale: בלע bedeutet „verschlingen, hinunterschlucken“. „Verschlingen“ erhält das lebhafte Bild und unterscheidet das Verb vom folgenden אכל.
- source_word: וְתֹאכְלֵם אֵשׁ
  choice: und Feuer wird sie verzehren
  rationale: אכל bedeutet grundsätzlich „essen“, wird bei Feuer jedoch natürlich mit „verzehren“ wiedergegeben. Die Wortstellung erhält „Feuer“ als ausdrückliches Subjekt.
theological_decisions:
- issue: Anthropomorphe Wendung „zur Zeit deines Angesichts“
  choice: wenn du dich zeigst
  alternative: zur Zeit deiner Gegenwart; zur Zeit deines Angesichts
  rationale: Die Übersetzung gibt die göttliche beziehungsweise königliche Manifestation wieder, ohne daraus einen fest umrissenen eschatologischen Fachbegriff zu machen. Die wörtliche Bildsprache wird in der Fußnote dokumentiert.
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen יהוה; „Jahwe“ bewahrt diesen Namenscharakter.
- issue: Wechsel von der zweiten zur dritten Person
  choice: Du wirst …; Jahwe wird …
  alternative: Jahwe, in deinem Zorn wirst du …
  rationale: Der masoretische Text wechselt nach dem an den König gerichteten „du/dein“ ausdrücklich zu „Jahwe … seinem“. Dieser grammatische und mögliche referenzielle Spannungswechsel wird nicht eingeebnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftigen Bilder „Feuerofen“, „verschlingen“ und „verzehren“ bleiben erhalten; die schwerfällige hebräische Wendung mit „Angesicht“ wird im Haupttext idiomatisch formuliert und in der Fußnote transparent gemacht.
