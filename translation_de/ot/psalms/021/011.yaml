  text: Denn sie richteten Böses gegen dich[a]; sie ersannen einen Anschlag[b], doch sie werden ihn nicht ausführen können.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Denn sie streckten Böses gegen dich aus.“ Gemeint ist, dass sie Böses gegen dich richteten oder beabsichtigten.'
