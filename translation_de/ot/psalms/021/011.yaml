  - marker: b
    text: 'Oder: „Sie planten einen Plan, doch werden sie ihn nicht ausführen können.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Gerichtsaussage ein und entspricht dem erklärenden Zusammenhang natürlich.
- source_word: נָטוּ עָלֶיךָ רָעָה
  choice: sie hatten Böses gegen dich im Sinn
  rationale: נָטָה bedeutet wörtlich „ausstrecken/neigen“; zusammen mit רָעָה und עַל bezeichnet die Wendung hier, Böses gegen jemanden zu richten oder zu beabsichtigen. Die deutsche idiomatische Wiedergabe wahrt die feindselige Absicht.
- source_word: חָשְׁבוּ
  choice: sie schmiedeten
  rationale: Das Verb bezeichnet hier überlegtes Planen. In Verbindung mit „einen Plan“ vermittelt „schmiedeten“ die berechnende, feindliche Planung in natürlichem Deutsch.
- source_word: מְזִמָּה
  choice: einen Plan
  rationale: Das Wort kann einen Plan, Anschlag oder ein Vorhaben bezeichnen. „Plan“ bewahrt die lexikalische Breite; der negative Zusammenhang wird bereits durch den Parallelismus und „Böses“ deutlich.
- source_word: בַּל יוּכָלוּ
  choice: doch sie konnten ihn nicht ausführen
  rationale: בַּל ist eine poetische Verneinung, und יכל bedeutet „fähig sein/können“. Das Pronomen und „ausführen“ ergänzen im Deutschen den aus dem vorigen Satzglied erschließbaren Bezug auf den Plan.
