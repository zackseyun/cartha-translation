  text: ר֣וּמָ/ה יְהוָ֣ה בְּ/עֻזֶּ֑/ךָ נָשִׁ֥ירָה וּֽ֝/נְזַמְּרָה גְּבוּרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/013.yaml
  text: Be exalted[a], O Yahweh[b], in your strength! We will sing and make music to your might.
translation:
  language: de
  text: Erhebe dich[a], Jahwe, in deiner Kraft! Wir wollen von deiner Macht singen und musizieren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sei erhaben, Jahwe, in deiner Kraft!“ Das hebräische Verb kann als Aufforderung verstanden werden, sich zu erheben, oder als Bitte beziehungsweise Ruf, dass Jahwe als erhaben sichtbar werde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּמָה
  choice: Erhebe dich
  rationale: Der Imperativ von רום kann zum Sich-Erheben aufrufen oder die Erhöhung beziehungsweise Erhabenheit Gottes ausdrücken. „Erhebe dich“ bewahrt diese Spannung und ist im Deutschen als Gebetsruf natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּעֻזֶּךָ
  choice: in deiner Kraft
  rationale: Die Präposition ב kann hier den Bereich oder das Mittel bezeichnen. „In deiner Kraft“ folgt der hebräischen Form eng und lässt die genaue Beziehung offen.
- source_word: נָשִׁירָה
  choice: Wir wollen … singen
  rationale: Der Kohortativ der ersten Person Plural drückt hier den gemeinsamen Entschluss der Betenden aus; „wir wollen“ gibt diesen willentlichen Zug im heutigen Deutsch wieder.
- source_word: וּנְזַמְּרָה
  choice: und musizieren
  rationale: זמר bezeichnet im Lobkontext musikalisches Singen oder Musizieren. „Musizieren“ bewahrt gegenüber „singen“ den eigenständigen musikalischen Akzent.
- source_word: גְּבוּרָתֶךָ
  choice: von deiner Macht
  rationale: גְּבוּרָה bezeichnet Kraft, Macht oder machtvolles Handeln. „Macht“ unterscheidet den Ausdruck poetisch von עֹז („Kraft“); „von“ formuliert im Deutschen idiomatisch den Inhalt des Singens und Musizierens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den Eigennamen יהוה. Die Umschrift „Jahwe“ bewahrt diesen Namen, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Deutung des Aufrufs רוּמָה
  choice: Erhebe dich
  alternative: Sei erhaben
  rationale: Der Kontext erlaubt sowohl den Ruf, Gott möge sich machtvoll erheben, als auch die Bitte beziehungsweise Akklamation, er möge als erhaben sichtbar werden. Der Haupttext legt die Aussage nicht ausdrücklich auf die passive Deutung fest; die Fußnote nennt die Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Entschluss der beiden Kohortative wird mit „Wir wollen“ wiedergegeben; „singen und musizieren“ erhält die poetische Doppelung, ohne im Deutschen künstlich zu wirken.
