source:
  edition: WLC
  text: פִּ֭רְיָ/מוֹ מֵ/אֶ֣רֶץ תְּאַבֵּ֑ד וְ֝/זַרְעָ֗/ם מִ/בְּנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/010.yaml
  text: You will destroy their fruit from the earth[a], and their offspring from among the sons of man.
translation:
  language: de
  text: 'Ihre Frucht wirst du von der Erde[a] tilgen

    und ihre Nachkommen aus der Mitte der Menschen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Land“. Das hebräische Wort kann sowohl „Erde“ als auch „Land“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von den Menschensöhnen“; gemeint sind die Menschen beziehungsweise die Menschheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּרְיָמוֹ
  choice: ihre Frucht
  rationale: פְּרִי bezeichnet wörtlich „Frucht“ oder „Ertrag“ und kann bildlich für Nachkommen stehen. „Frucht“ bewahrt das konkrete poetische Bild und den Parallelismus mit „Nachkommen“.
- source_word: מֵאֶרֶץ
  choice: von der Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Der umfassende Gerichtskontext und die Verbindung mit dem Tilgen sprechen hier für „Erde“; „Land“ bleibt als mögliche Lesart in der Fußnote erhalten.
- source_word: תְּאַבֵּד
  choice: wirst du … tilgen
  rationale: 'Die Piel-Form von אבד hat kausative Bedeutung: vernichten, zugrunde richten oder verschwinden lassen. „Tilgen“ gibt die direkte Anrede im maskulinen Singular wieder und lässt sich im Deutschen natürlich mit „von der Erde“ verbinden.'
- source_word: וְזַרְעָם
  choice: ihre Nachkommen
  rationale: זֶרַע bedeutet wörtlich „Same“ und bei Menschen häufig „Nachkommenschaft“. „Nachkommen“ ist im heutigen Deutsch klar, während „Frucht“ in der ersten Zeile das Bildhafte bewahrt.
- source_word: מִבְּנֵי אָדָם
  choice: aus der Mitte der Menschen
  rationale: בְּנֵי אָדָם lautet wörtlich „Söhne des Menschen/Adams“, ist hier jedoch eine feste poetische Bezeichnung für die Menschen beziehungsweise die Menschheit. Die gewählte Form gibt den generischen Sinn natürlich wieder; die hebräische Bildform wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Wiedergabe von אָדָם in בְּנֵי אָדָם
  choice: Menschen
  alternative: Söhne des Menschen; Menschheit
  rationale: Die Wendung bezeichnet die Menschheit allgemein und nicht ausschließlich männliche Nachkommen. „Menschen“ wahrt den generischen Bezug, ohne eine geschlechtliche Einschränkung einzutragen; die formalere hebräische Ausdrucksweise bleibt in der Fußnote sichtbar.
- issue: Bezug von „Frucht“ und „Nachkommen“
  choice: Das Bild „Frucht“ bleibt neben der eindeutigen Bezeichnung „Nachkommen“ stehen.
  alternative: Beide Ausdrücke ausdrücklich als Nachkommenschaft wiedergeben.
  rationale: Der Parallelismus legt nahe, dass „Frucht“ hier die Nachkommenschaft meint. Die Bildsprache wird dennoch nicht aufgelöst, damit die poetische Spannung des Hebräischen erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Wortstellung. „Tilgen“ ist gehoben, aber allgemein verständlich und passt zur Gerichtssprache des Psalms. Der Zeilenumbruch bildet den hebräischen Parallelismus ab.
