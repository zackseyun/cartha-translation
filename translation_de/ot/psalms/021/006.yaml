  source_fidelity: 'Der zweite Halbvers gibt die kausative Piel-Form von חדה sowie die Wendung „vor/in deiner Gegenwart“ sachgerecht wieder. Im ersten Halbvers ist die hebräische prädikative Mehrzahl בְּרָכוֹת bewusst mehrdeutig: Sie kann den König als bleibenden Segen kennzeichnen oder reichliche, ihm verliehene Segnungen bezeichnen. „Zu lauter Segen“ zielt auf die erstere Nuance, ist in dieser Prädikatsverbindung jedoch sprachlich nicht ausreichend klar.'
