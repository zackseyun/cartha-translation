  terminology: „Segen“, „Freude“ und „deiner Gegenwart“ sind angemessene, registergerechte Wiedergaben. Die Fußnote soll die Mehrzahl „Segnungen“ nicht als alleinige wörtliche Bedeutung ausgeben, sondern die zugrunde liegende knappe Konstruktion und ihre Deutungsmöglichkeiten erläutern.
