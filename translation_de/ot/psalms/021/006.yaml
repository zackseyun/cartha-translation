  text: כִּֽי תְשִׁיתֵ֣/הוּ בְרָכ֣וֹת לָ/עַ֑ד תְּחַדֵּ֥/הוּ בְ֝/שִׂמְחָ֗ה אֶת פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/006.yaml
  text: For you make him blessings forever[b][a]; you gladden him with joy in your presence.
translation:
  language: de
  text: Denn du machst ihn für immer zu einem Segen[a]; du erfreust ihn mit Freude in deiner Gegenwart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Du machst/setzt ihn für immer zu Segnungen.« Die knappe hebräische Wendung kann bedeuten: »Du überschüttest ihn für immer mit Segen« oder: »Du machst ihn für immer zu einem Segen.«'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Lobpreis ein und gibt die kausale beziehungsweise erläuternde Funktion natürlich wieder.
- source_word: תְשִׁיתֵהוּ בְרָכוֹת
  choice: du machst ihn … zu lauter Segen
  rationale: שׁית bedeutet „setzen, stellen, machen“; das ungewöhnliche prädikative Pluralwort „Segnungen“ wird mit der deutschen Mengenformel „lauter Segen“ wiedergegeben. So bleiben Segensfülle und die mögliche Vorstellung, dass der König selbst zum Segen wird, erkennbar, ohne unverständliches Deutsch zu erzeugen.
- source_word: לָעַד
  choice: für immer
  rationale: Eine geläufige und dem Kontext angemessene Wiedergabe unbegrenzter beziehungsweise dauerhafter Zeit.
- source_word: תְּחַדֵּהוּ
  choice: du erfreust ihn
  rationale: Die Piel-Form bezeichnet das Verursachen von Freude; „erfreust“ bewahrt diesen kausativen Sinn knapp und natürlich.
- source_word: בְשִׂמְחָה
  choice: mit Freude
  rationale: Gibt das instrumentale oder begleitende בְ idiomatisch wieder und bewahrt das ausdrücklich genannte Substantiv „Freude“.
- source_word: אֶת־פָּנֶיךָ
  choice: in deiner Gegenwart
  rationale: „Dein Angesicht“ bezeichnet hier idiomatisch Gottes persönliche Gegenwart. Die Wiedergabe ist in modernem Deutsch klar und erhält den relationalen Sinn.
theological_decisions:
- issue: Sinn der Wendung „ihn zu Segnungen machen“
  choice: Die ungewöhnliche Mehrzahl wird als „zu lauter Segen“ wiedergegeben und lässt den König als von Segensfülle geprägt beziehungsweise als Segen erscheinen.
  alternative: „Du überschüttest ihn für immer mit Segen“ oder „du machst ihn für immer zu einem Segen“.
  rationale: Die hebräische Konstruktion kann sowohl reich verliehenen Segen als auch den König als Verkörperung oder Quelle des Segens nahelegen. Der Haupttext wahrt durch seine kompakte Form diese Spannung; die Fußnote nennt die beiden deutlicher ausformulierten Möglichkeiten, ohne die Aussage ausschließlich materiell oder messianisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lauter Segen“ ist bewusst etwas verdichtet, bleibt aber verständlich und bildet die ungewöhnliche hebräische Prädikatskonstruktion besser ab als das unidiomatische „zu Segnungen“. Der zweite Halbvers ist klar und relational formuliert.
