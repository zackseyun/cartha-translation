id: PSA.21.1
reference: Psalms 21:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְֽהוָ֗ה בְּ/עָזְּ/ךָ֥ יִשְׂמַח מֶ֑לֶךְ וּ֝/בִ/ישׁ֥וּעָתְ/ךָ֗ מַה יגיל מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/001.yaml
  text: O Yahweh[a], in your strength the king rejoices, and in your salvation how greatly he exults!
translation:
  language: de
  text: Jahwe, über deine Stärke freut sich der König, und über deine Rettung[a] – wie sehr jubelt er!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Rettung“ kann hier auch „Befreiung“ oder „Sieg“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. Die direkte Anrede ist im Deutschen ohne ein zusätzliches „O“ natürlich und würdevoll.
- source_word: בְּעָזְּךָ
  choice: über deine Stärke
  rationale: Die Präposition ב bezeichnet hier den Grund beziehungsweise Gegenstand der Freude. „Über deine Stärke“ gibt dies im Deutschen idiomatisch wieder, ohne die göttliche Kraft lediglich als Mittel festzulegen.
- source_word: יִשְׂמַח
  choice: freut sich
  rationale: Das poetische Yiqtol kann gegenwärtig-allgemein oder zukünftig verstanden werden. Der präsentische Sinn passt zum Lobcharakter des Verses, ohne die Aussage unnötig auf die Zukunft festzulegen.
- source_word: מֶלֶךְ
  choice: der König
  rationale: Obwohl das hebräische Substantiv keinen Artikel trägt, ist im Kontext ein bestimmter König gemeint.
- source_word: וּבִישׁוּעָתְךָ
  choice: und über deine Rettung
  rationale: יְשׁוּעָה umfasst Rettung, Befreiung und im königlichen Kontext auch Sieg. „Rettung“ bewahrt die größere Bedeutungsbreite und bildet eine natürliche Parallele zur ersten Vershälfte.
- source_word: מַה ... מְאֹד
  choice: wie sehr
  rationale: מַה ist hier nicht fragend, sondern ausrufend und wird durch מְאֹד verstärkt. „Wie sehr“ gibt die emphatische Wendung knapp und natürlich wieder.
- source_word: יגיל
  choice: jubelt er
  rationale: גיל bezeichnet eine lebhafte, überschwängliche Freude. „Jubeln“ hebt die Steigerung gegenüber שׂמח („sich freuen“) hervor.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration „Jahwe“ bewahrt den Charakter als Eigenname, ohne eine konfessionell geprägte Ersatzlesung einzuführen.
- issue: Zeitbezug der poetischen Verbformen יִשְׂמַח und יגיל
  choice: 'Präsens: „freut sich“ und „jubelt“'
  alternative: 'Futur: „wird sich freuen“ und „wird jubeln“'
  rationale: Die Yiqtol-Formen lassen in diesem poetischen Zusammenhang sowohl einen gegenwärtig-allgemeinen als auch einen zukünftigen Bezug zu. Das Präsens entspricht am ehesten dem unmittelbaren Lobton; die zeitliche Offenheit wird nicht zu einer prophetischen Festlegung verengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Stellung „über deine Stärke“ greift die hebräische Hervorhebung auf; der Gedankenstrich bildet die gesteigerte, ausrufende zweite Vershälfte ab.
