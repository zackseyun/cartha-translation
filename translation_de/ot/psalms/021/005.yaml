id: PSA.21.5
reference: Psalms 21:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: גָּד֣וֹל כְּ֭בוֹד/וֹ בִּ/ישׁוּעָתֶ֑/ךָ ה֥וֹד וְ֝/הָדָר תְּשַׁוֶּ֥ה עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/005.yaml
  text: Great is his glory through your salvation[b][a]; you bestow splendor and majesty on him.
translation:
  language: de
  text: Groß ist seine Herrlichkeit durch deine Rettung[a][b]; Pracht und Majestät legst du auf ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch deinen Sieg« beziehungsweise »durch deine Befreiung«. Das hebräische Wort kann Rettung oder Befreiung und in diesem königlichen Zusammenhang auch Sieg bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in deiner Rettung«. Die hebräische Präposition kann hier das Mittel oder den Bereich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: Groß ist
  rationale: Das vorangestellte prädikative Adjektiv wird zur Wahrung der poetischen Betonung ebenfalls an den Satzanfang gestellt.
- source_word: כְּבוֹדוֹ
  choice: seine Herrlichkeit
  rationale: כָּבוֹד bezeichnet hier im königlichen Zusammenhang die dem König zukommende Herrlichkeit und Ehre.
- source_word: בִּישׁוּעָתֶךָ
  choice: durch deine Rettung
  rationale: Die Präposition ב kann Mittel oder Sphäre bezeichnen. »Durch« gibt den instrumentalen Sinn natürlich wieder, ohne die mögliche Bedeutung »in« auszuschließen; יְשׁוּעָה wird grundlegend als Rettung wiedergegeben.
- source_word: הוֹד
  choice: Pracht
  rationale: הוֹד bezeichnet stattlichen Glanz oder Pracht und wird vom folgenden הָדָר sprachlich unterschieden.
- source_word: וְהָדָר
  choice: und Majestät
  rationale: הָדָר bezeichnet in der poetischen Paarung königliche Würde und erhabenen Glanz.
- source_word: תְּשַׁוֶּה
  choice: legst du
  rationale: Das Verb שׁוה mit עַל beschreibt hier, dass Gott Pracht und Majestät auf den König legt. Die konkrete Bildsprache des Hebräischen bleibt erhalten.
- source_word: עָלָיו
  choice: auf ihn
  rationale: Die örtlich-bildhafte Bedeutung von עַל mit Pronominalsuffix wird unmittelbar wiedergegeben.
theological_decisions:
- issue: Bedeutung von יְשׁוּעָה in einem Königspsalm
  choice: Rettung
  alternative: Sieg oder Befreiung
  rationale: »Rettung« wahrt den breiten Grundsinn des hebräischen Ausdrucks; im königlichen und möglicherweise militärischen Zusammenhang kann zugleich ein von Gott geschenkter Sieg gemeint sein.
- issue: Bezug der königlichen Herrlichkeit auf Gottes Handeln
  choice: Die Herrlichkeit des Königs ist durch Gottes Rettung groß
  alternative: Die Herrlichkeit des Königs ist in Gottes Rettung groß
  rationale: Die instrumentale Lesart passt gut zum Zusammenhang, doch die hebräische Präposition lässt auch eine lokale beziehungsweise sphärische Nuance zu; diese wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Voranstellung. Die konkrete Wendung »legst du auf ihn« hält das königliche Bekleidungs- oder Ausstattungsbild des Hebräischen fest.
