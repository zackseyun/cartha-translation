  text: For the choirmaster. A psalm of David[a].
translation:
  language: de
  text: Für den musikalischen Leiter. Ein Psalm Davids[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »von David« oder »für David«; die hebräische Überschrift kann Autorschaft, Zugehörigkeit oder Widmung ausdrücken.'
