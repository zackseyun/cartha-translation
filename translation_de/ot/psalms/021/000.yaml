lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den musikalischen Leiter
  rationale: Die Bezeichnung in Psalmüberschriften meint wahrscheinlich die für die musikalische Ausführung verantwortliche Person. »Musikalischer Leiter« ist im heutigen Deutsch verständlich, ohne den im Hebräischen nicht ausdrücklich genannten Chor vorauszusetzen; »für« gibt das vorangestellte ל in seiner überschriftlichen Zuweisungsfunktion wieder.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: מִזְמוֹר ist die übliche Gattungsbezeichnung für ein musikalisch geprägtes Psalmlied; »Psalm« ist hier die etablierte und genaue deutsche Entsprechung.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der deutsche Genitiv wahrt in der knappen Überschrift die Zuordnung zu David besser als das eindeutig nach Autorschaft klingende »von David« oder das nur eine Widmung nahelegende »für David«.
theological_decisions:
- issue: Bedeutung der davidischen Überschrift
  choice: Ein Psalm Davids
  alternative: Ein Psalm von David / ein Psalm für David
  rationale: לְדָוִד kann in Psalmüberschriften Autorschaft, Zugehörigkeit, Verbindung oder Widmung bezeichnen. Der Genitiv lässt diese Zuordnung bewusst offen und legt keine stärkere Aussage zur Autorschaft fest, als der hebräische Wortlaut verlangt.
translation_notes:
  register: Knappe, würdige Überschrift in modernem Standarddeutsch. »Musikalischer Leiter« vermeidet das etwas altertümliche »Chormeister« und die nicht ausdrücklich belegte Einschränkung auf einen Chor.
