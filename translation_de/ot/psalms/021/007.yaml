source:
  edition: WLC
  text: כִּֽי הַ֭/מֶּלֶךְ בֹּטֵ֣חַ בַּ/יהוָ֑ה וּ/בְ/חֶ֥סֶד עֶ֝לְי֗וֹן בַּל יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/007.yaml
  text: For the king trusts in Yahweh[b][a], and through the steadfast love of the Most High he will not be shaken.
translation:
  language: de
  text: Denn der König vertraut auf Jahwe, und durch die beständige Liebe des Höchsten[a] wird er nicht wanken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der beständigen Liebe des Höchsten“ beziehungsweise „durch die Bundestreue des Höchsten“. Die hebräische Präposition kann instrumental oder örtlich verstanden werden; חֶסֶד kann auch „Bundestreue“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird er nicht erschüttert werden“ beziehungsweise „wird er nicht ins Wanken geraten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Aussage ein, ohne den Zusammenhang stärker als nötig kausal festzulegen.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Gibt das bestimmte Substantiv und die königliche Gestalt des Psalms unmittelbar wieder.
- source_word: בֹּטֵחַ
  choice: vertraut
  rationale: Das Qal-Partizip bezeichnet ein anhaltendes oder charakteristisches Vertrauen; das deutsche Präsens gibt dies natürlich wieder.
- source_word: בַּיהוָה
  choice: auf Jahwe
  rationale: Die Präposition bezeichnet hier die Person, auf die sich das Vertrauen richtet; „auf jemanden vertrauen“ ist die natürliche deutsche Fügung. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וּבְחֶסֶד
  choice: und durch die beständige Liebe
  rationale: חֶסֶד bezeichnet treue, verlässliche und oft bundbezogene Liebe. „Beständige Liebe“ bewahrt diesen Kern, während „durch“ die wahrscheinlich instrumentale beziehungsweise kausale Funktion der Präposition ausdrückt.
- source_word: עֶלְיוֹן
  choice: des Höchsten
  rationale: Der substantivisch gebrauchte Gottestitel wird mit der im Deutschen geläufigen Bezeichnung „der Höchste“ wiedergegeben.
- source_word: בַּל
  choice: nicht
  rationale: Gibt die poetische Negationspartikel schlicht wieder, ohne zusätzliche Betonung einzutragen.
- source_word: יִמּוֹט
  choice: wird er nicht wanken
  rationale: Das Verb beschreibt das Wanken, Schwanken oder Erschüttertwerden. „Nicht wanken“ erhält das poetische Bild der Standfestigkeit und klingt im Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm יהוה. Die Transliteration „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von חֶסֶד
  choice: beständige Liebe
  alternative: Bundestreue; treue Liebe; Gnade
  rationale: Die Wendung lässt sowohl den Aspekt verlässlicher Liebe als auch den der Bundestreue anklingen. „Beständige Liebe“ ist verständlich und lässt diesen theologischen Bedeutungsraum offen; die Fußnote nennt die engere Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Die traditionelle Psalmensprache wird nicht archaisiert; die Bildsprache des Wankens und die Mehrdeutigkeit der Präposition bei חֶסֶד bleiben erhalten.
