source:
  edition: WLC
  text: תַּאֲוַ֣ת לִ֭בּ/וֹ נָתַ֣תָּה לּ֑/וֹ וַ/אֲרֶ֥שֶׁת שְׂ֝פָתָ֗י/ו בַּל מָנַ֥עְתָּ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/002.yaml
  text: You have given him his heart’s desire[a], and you have not withheld the request of his lips[b]. Selah
translation:
  language: de
  text: Den Wunsch seines Herzens hast du ihm erfüllt, und die Bitte[a] seiner Lippen hast du nicht verweigert. Sela[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene hebräische Wort bezeichnet wahrscheinlich eine ausgesprochene Bitte oder ein Begehren und steht parallel zum „Wunsch seines Herzens“.
    reason: lexical_alternative
  - marker: b
    text: „Sela“ wird als Umschrift beibehalten, weil seine genaue Bedeutung oder Funktion ungewiss ist; vermutlich kennzeichnet es eine musikalische oder liturgische Zäsur.
    reason: cultural_note
lexical_decisions:
- source_word: תַּאֲוַת לִבּוֹ
  choice: den Wunsch seines Herzens
  rationale: Die Wortgruppe bezeichnet das innere Verlangen des Herzens. „Wunsch seines Herzens“ gibt das hebräische Bild klar und natürlich wieder.
- source_word: נָתַתָּה לּוֹ
  choice: hast du ihm erfüllt
  rationale: Wörtlich steht „hast du ihm gegeben“. In Verbindung mit „Wunsch“ drückt „erfüllt“ im Deutschen denselben Sinn idiomatisch aus.
- source_word: וַאֲרֶשֶׁת
  choice: die Bitte
  rationale: Das seltene hebräische Substantiv wird wahrscheinlich als ausgesprochene Bitte oder Begehren verstanden und steht parallel zum Wunsch des Herzens.
- source_word: שְׂפָתָיו
  choice: seiner Lippen
  rationale: Die konkrete hebräische Bildsprache für die mündlich ausgesprochene Bitte bleibt erhalten.
- source_word: בַּל מָנַעְתָּ
  choice: hast du nicht verweigert
  rationale: Die poetische Verneinung und der Sinn von „zurückhalten, vorenthalten“ werden in einer natürlichen deutschen Verbindung mit „Bitte“ wiedergegeben.
- source_word: סֶּלָה
  choice: Sela
  rationale: Da Bedeutung und Funktion des Ausdrucks nicht sicher geklärt sind, wird er in der im Deutschen üblichen Form transliteriert.
theological_decisions: []
