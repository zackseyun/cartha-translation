source:
  edition: WLC
  text: חַיִּ֤ים שָׁאַ֣ל מִ֭מְּ/ךָ נָתַ֣תָּה לּ֑/וֹ אֹ֥רֶךְ יָ֝מִ֗ים עוֹלָ֥ם וָ/עֶֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/004.yaml
  text: He asked life from you[b][a]; you gave it to him—length of days forever and ever.
translation:
  language: de
  text: 'Leben erbat er von dir; du gabst es ihm: Länge der Tage für immer und ewig.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Für immer und ewig« kann als königliche Überhöhung für ein langes Leben und eine dauerhafte Herrschaft verstanden werden oder als eine Aussage, die im Messias ihre umfassendere Erfüllung findet.
    reason: alternative_reading
lexical_decisions:
- source_word: חַיִּים
  choice: Leben
  rationale: Der morphologische Plural wird im Hebräischen gewöhnlich als abstrakter Singular »Leben« gebraucht. Die Dauer wird erst in der folgenden Wendung entfaltet.
- source_word: שָׁאַל מִמְּךָ
  choice: erbat er von dir
  rationale: »Erbitten« gibt das Bitten um etwas von Gott knapp und in gehobenem, aber heutigem Deutsch wieder; מִן bezeichnet hier die Quelle, daher »von dir«.
- source_word: נָתַתָּה לּוֹ
  choice: du gabst es ihm
  rationale: Das Pronomen »es« nimmt das zuvor genannte Leben auf und macht den deutschen Satz vollständig. Das hebräische Perfekt wird als poetisch erzählendes Präteritum wiedergegeben.
- source_word: אֹרֶךְ יָמִים
  choice: Länge der Tage
  rationale: Die wörtliche Wiedergabe bewahrt das poetische Bild und unterscheidet die Wendung vom vorhergehenden »Leben«; gemeint ist eine lange Lebensdauer.
- source_word: עוֹלָם וָעֶד
  choice: für immer und ewig
  rationale: Die feste deutsche Wendung bewahrt die verstärkende, zeitlich unbegrenzte Aussage des hebräischen Ausdrucks.
theological_decisions:
- issue: Reichweite der dem König gewährten Lebensdauer
  choice: Die Dauer wird im Haupttext uneingeschränkt als »für immer und ewig« wiedergegeben.
  alternative: Die Aussage könnte als königliche Übertreibung für ein langes Leben und eine dauerhafte Herrschaft oder als im Messias umfassender erfüllt verstanden werden.
  rationale: Der hebräische Wortlaut nennt eine unbegrenzte Dauer. Die Übersetzung soll die Spannung zwischen königlicher Poesie und möglicher messianischer Erfüllung nicht im Haupttext auflösen.
translation_notes:
  register: Moderne, würdige Psalmsprache. »Erbat« ist leicht gehoben und passt zum poetischen Register; »Länge der Tage« erhält bewusst die Bildsprache des Hebräischen.
