  text: אֵ֭שׁ לְ/פָנָ֣י/ו תֵּלֵ֑ךְ וּ/תְלַהֵ֖ט סָבִ֣יב צָרָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/003.yaml
  text: Fire goes before him and burns his adversaries all around[a].
translation:
  language: de
  text: Feuer geht vor ihm her und verbrennt ringsum seine Widersacher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine Feinde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשׁ
  choice: Feuer
  rationale: Das Substantiv bezeichnet Feuer; der artikellose Gebrauch entspricht der knappen poetischen Ausdrucksweise.
- source_word: לְפָנָיו
  choice: vor ihm her
  rationale: Die Verbindung mit »Angesicht/Gegenwart« bezeichnet hier den Raum vor ihm; »vor ihm her« gibt zugleich die vorausgehende Bewegung natürlich wieder.
- source_word: תֵּלֵךְ
  choice: geht
  rationale: הלך bedeutet gewöhnlich »gehen«. Mit Feuer als Subjekt bewahrt »geht« das personifizierende poetische Bild.
- source_word: וּתְלַהֵט
  choice: versengt
  rationale: Die Piel-Form von להט bezeichnet heftiges Brennen beziehungsweise sengende Wirkung. »Versengt« vermittelt die zerstörerische Hitze, ohne ausdrücklich ein vollständiges Verbrennen hinzuzufügen.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Adverb bezeichnet die umgebende Ausdehnung; »ringsum« ist knapp, idiomatisch und poetisch.
- source_word: צָרָיו
  choice: seine Widersacher
  rationale: צָר bezeichnet jemanden, der feindlich bedrängt oder sich entgegenstellt. »Widersacher« wahrt diesen Oppositionssinn; »Feinde« ist ebenfalls möglich.
theological_decisions:
- issue: Bezug der Suffixe der 3. Person Singular im theophanischen Zusammenhang von Psalm 97
  choice: Die Pronomen bleiben als »ihm/seine« stehen; der Bezug ergibt sich aus dem Kontext.
  alternative: Feuer geht vor dem HERRN her und versengt ringsum seine Widersacher.
  rationale: Der hebräische Vers verwendet ausschließlich pronominale Suffixe. Die ausdrückliche Einfügung des Gottesnamens würde den Bezug zwar verdeutlichen, aber ein in diesem Vers nicht stehendes Substantiv ergänzen.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die Wortstellung und »vor ihm her« erhalten die Bewegungsrichtung des hebräischen Bildes; »ringsum« hält die Zeile knapp.
