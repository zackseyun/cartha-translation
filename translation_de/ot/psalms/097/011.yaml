base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/011.yaml
  text: Light is sown for the righteous[a], and joy for the upright in heart.
translation:
  language: de
  text: Licht ist ausgesät für den Gerechten[a] und Freude für die, deren Herz aufrichtig ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Licht wird für den Gerechten gesät“ oder „Licht ist für den Gerechten ausgestreut“. Das Hebräische verwendet ein landwirtschaftliches Bild: Licht wird wie Saat gesät.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: Licht
  rationale: Das Substantiv wird direkt als „Licht“ wiedergegeben. So bleibt das im Psalter geläufige, aber hier nicht näher festgelegte Bild für Segen, Rettung oder Wohlergehen offen.
- source_word: זָרֻעַ
  choice: ist ausgesät
  rationale: Das passive Partizip von זרע bedeutet wörtlich „gesät/ausgesät“. „Ist ausgesät“ bewahrt das landwirtschaftliche Bild und klingt im Deutschen bewusst poetisch.
- source_word: לַצַּדִּיק
  choice: für den Gerechten
  rationale: Die Präposition ל bezeichnet hier Begünstigung oder Bestimmung. Der hebräische Singular wird als repräsentativer Singular beibehalten.
- source_word: וּלְיִשְׁרֵי לֵב
  choice: und Freude für die, deren Herz aufrichtig ist
  rationale: Die Wendung bezeichnet Menschen mit innerer Aufrichtigkeit. Die Umformung in einen Relativsatz ist in modernem Deutsch natürlich und erhält den Bezug auf das Herz.
- source_word: שִׂמְחָה
  choice: Freude
  rationale: „Freude“ ist die knappe und natürliche Entsprechung und wahrt den poetischen Parallelismus mit „Licht“.
theological_decisions:
- issue: Metaphorische Bedeutung des Lichts
  choice: Das Bild „Licht ist ausgesät“ bleibt ohne erklärende Einengung erhalten.
  alternative: „Rettung ist bereitet“ oder „Wohlergehen ist aufbewahrt“
  rationale: Der hebräische Text legt nicht fest, ob Licht insbesondere Rettung, Wohlergehen oder Rechtfertigung bezeichnet. Die offene Metapher bewahrt die poetische und theologische Weite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter poetischer Metapher. Der parallele Satzbau wird natürlich geglättet, ohne die Bildsprache oder den repräsentativen Singular aufzulösen.
