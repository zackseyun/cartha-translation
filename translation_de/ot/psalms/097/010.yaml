  text: אֹהֲבֵ֥י יְהוָ֗ה שִׂנְא֫וּ רָ֥ע שֹׁ֭מֵר נַפְשׁ֣וֹת חֲסִידָ֑י/ו מִ/יַּ֥ד רְ֝שָׁעִ֗ים יַצִּילֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/010.yaml
  text: You who love Yahweh[a], hate evil. He guards the lives of his faithful ones; from the hand of the wicked he delivers them.
translation:
  language: de
  text: Ihr, die ihr Jahwe liebt, hasst das Böse! Er bewahrt das Leben seiner Getreuen[a]; aus der Hand der Frevler rettet er sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Seelen seiner Frommen«. Das hebräische Wort nefesch kann »Leben«, »Person« oder »Seele« bedeuten; chasidaw kann auch mit »seine Frommen«, »seine Treuen« oder »seine Heiligen« wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֲבֵי יְהוָה
  choice: Die ihr Jahwe liebt
  rationale: Die hebräische Konstruktverbindung bezeichnet wörtlich die »Jahwe Liebenden«. Als vorangestellte Anrede gibt die deutsche Formulierung den partizipialen Sinn natürlich und klar wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שִׂנְאוּ
  choice: hasst
  rationale: Der Imperativ der 2. Person Plural ist ein unmittelbarer Befehl; die deutliche Bedeutung »hassen« wird nicht abgeschwächt.
- source_word: רָע
  choice: das Böse
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet allgemein das moralisch Böse, ohne es auf bestimmte Taten einzuengen.
- source_word: שֹׁמֵר
  choice: Er bewahrt
  rationale: Das Partizip beschreibt Jahwes charakteristisches schützendes Handeln. »Bewahren« passt sowohl zu »Leben« als auch zum anschließenden Retten.
- source_word: נַפְשׁוֹת
  choice: das Leben
  rationale: נֶפֶשׁ bezeichnet hier angesichts von Schutz und Rettung das Leben beziehungsweise die Person, nicht notwendig eine vom Körper getrennte Seele.
- source_word: חֲסִידָיו
  choice: seiner Getreuen
  rationale: חָסִיד bezeichnet Menschen, die durch Treue und Frömmigkeit in ihrer Beziehung zu Gott geprägt sind. »Getreue« ist würdig, verständlich und bewahrt den relationalen Sinn.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die wörtliche Bildsprache bezeichnet zugleich die Gewalt oder Verfügungsgewalt der Frevler und ist im Deutschen verständlich.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: Das substantivierte Pluralwort bezeichnet schuldhaft böse Menschen. »Frevler« ist im poetisch-biblischen Register prägnant und nicht geschlechtsspezifisch eingeschränkt.
- source_word: יַצִּילֵם
  choice: rettet er sie
  rationale: Der Hifil von נצל bezeichnet aktives Befreien oder Retten aus fremder Gewalt; »retten« gibt dies idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von נַפְשׁוֹת im Zusammenhang
  choice: das Leben
  alternative: die Seelen; die Personen
  rationale: Der Parallelismus spricht von Schutz und Rettung aus der Hand böser Menschen. Daher liegt die konkrete Bedeutung »Leben« nahe, ohne dass eine metaphysische Aussage über die Seele vorausgesetzt wird.
- issue: Wiedergabe von חֲסִידָיו
  choice: seiner Getreuen
  alternative: seiner Frommen; seiner Heiligen; seiner Treuen
  rationale: Die Formulierung bringt die auf Gott bezogene Treue und Frömmigkeit zum Ausdruck, ohne den Begriff unnötig kirchlich oder konfessionell einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Prägnanz. Der direkte Imperativ bleibt kräftig; die hebräische Bildrede »aus der Hand« wird bewahrt. Der Fußnotenmarker [a] steht unmittelbar bei der lexikalisch mehrdeutigen Wortgruppe.
