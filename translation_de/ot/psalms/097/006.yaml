  text: הִגִּ֣ידוּ הַ/שָּׁמַ֣יִם צִדְק֑/וֹ וְ/רָא֖וּ כָל הָ/עַמִּ֣ים כְּבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/006.yaml
  text: The heavens declare his righteousness[a], and all the peoples see his glory.
translation:
  language: de
  text: Die Himmel verkünden seine Gerechtigkeit[a], und alle Völker sehen seine Herrlichkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann sowohl Gottes Gerechtigkeit als auch sein gerechtes Handeln bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידוּ
  choice: verkünden
  rationale: Das Hifil von נגד bezeichnet das Bekanntmachen oder öffentliche Kundtun. „Verkünden“ ist im poetischen Zusammenhang natürlich und würdevoll.
- source_word: הַשָּׁמַיִם
  choice: die Himmel
  rationale: Der Plural „die Himmel“ bildet die hebräische Form ab und passt zum kosmischen, poetischen Rahmen des Psalms besser als das enger gefasste „der Himmel“ im Sinn von „der sichtbare Himmel“.
- source_word: צִדְקוֹ
  choice: seine Gerechtigkeit
  rationale: צֶדֶק kann sowohl moralische Richtigkeit als auch gerechtes, rechtsschaffendes Handeln bezeichnen. „Gerechtigkeit“ bewahrt im Deutschen diese Bedeutungsbreite am besten; die Nuance „Recht“ wird in der Fußnote genannt.
- source_word: וְרָאוּ
  choice: und … sehen
  rationale: Obwohl die hebräische Verbform formal ein Perfekt ist, gibt das Präsens hier die anschauliche, poetisch vergegenwärtigte Aussage natürlich wieder und entspricht dem parallelen deutschen Präsens „verkünden“.
- source_word: כָל הָעַמִּים
  choice: alle Völker
  rationale: עַמִּים bezeichnet Menschengruppen oder Völker. „Alle Völker“ ist im modernen Deutschen idiomatischer als „alle Volksschaften“ und bewahrt den universalen Umfang.
- source_word: כְּבוֹדוֹ
  choice: seine Herrlichkeit
  rationale: כָּבוֹד bezeichnet bei Gott seine offenbarte Majestät und Ehre. „Herrlichkeit“ ist dafür die etablierte, kontextgemäße Wiedergabe.
theological_decisions:
- issue: Bedeutungsumfang von צִדְקוֹ als göttliches Attribut
  choice: seine Gerechtigkeit
  alternative: sein Recht
  rationale: Das hebräische Wort umfasst sowohl Gottes moralische Gerechtigkeit als auch sein gerechtes Recht und Handeln. Der Haupttext verwendet den umfassenderen etablierten Ausdruck „Gerechtigkeit“, während die Fußnote die rechtliche Nuance offenhält.
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem poetischem Ton. Der Parallelismus der beiden Vershälften bleibt erhalten; das Präsens vergegenwärtigt die Aussage.
