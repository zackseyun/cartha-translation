id: PSA.97.1
reference: Psalms 97:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָ֣ה מָ֭לָךְ תָּגֵ֣ל הָ/אָ֑רֶץ יִ֝שְׂמְח֗וּ אִיִּ֥ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/001.yaml
  text: Yahweh reigns[a]; let the earth rejoice; let the many coastlands be glad.
translation:
  language: de
  text: Jahwe herrscht! Die Erde freue sich, die vielen Küstenländer[a] sollen jubeln!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Inseln“. Das hebräische Wort kann Inseln oder ferne Küstenländer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt; „Jahwe“ ist die im Deutschen gebräuchliche wissenschaftliche Umschrift.
- source_word: מָלָךְ
  choice: herrscht
  rationale: Das Qatal kann ein Königwerden oder den bestehenden Zustand königlicher Herrschaft bezeichnen. „herrscht“ gibt die feierliche Proklamation wieder, ohne ein erst jetzt erfolgendes Inthronisieren festzulegen.
- source_word: תָּגֵל
  choice: freue sich
  rationale: Der Imperfekt wird im poetischen Zusammenhang als Aufforderung beziehungsweise Wunsch verstanden und mit einem deutschen Konjunktiv wiedergegeben.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Der Parallelismus mit den vielen Küstenländern weist auf den weltweiten Horizont des Psalms; „Erde“ passt daher besser als „Land“.
- source_word: יִשְׂמְחוּ
  choice: sollen jubeln
  rationale: Auch dieser Imperfekt hat hier auffordernden Charakter. „jubeln“ bildet eine lebendige poetische Entsprechung zu „freue sich“, ohne das gleiche Verb zu wiederholen.
- source_word: אִיִּים
  choice: Küstenländer
  rationale: Der Ausdruck kann Inseln sowie ferne, vom Meer geprägte Länder oder Küstengebiete bezeichnen. „Küstenländer“ wahrt diese weitere geografische Bedeutung; „Inseln“ bleibt als Alternative in der Fußnote erhalten.
- source_word: רַבִּים
  choice: vielen
  rationale: Die schlichte quantitative Bedeutung des Adjektivs wird idiomatisch und unmittelbar wiedergegeben.
theological_decisions:
- issue: Reichweite der Königsherrschaft Jahwes
  choice: Eine weltweite Verkündigung der gegenwärtigen Herrschaft Jahwes
  alternative: 'Eine auf das Land Israel begrenzte Aussage oder eine ausdrücklich ingressive Formel: „Jahwe ist König geworden“'
  rationale: Die Parallele zwischen „der Erde“ und den „vielen Küstenländern“ legt einen weltweiten Horizont nahe. „herrscht“ bekräftigt Jahwes Königsherrschaft, ohne die grammatisch mögliche ingressive Nuance auszuschließen oder festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Rhythmus. Der Konjunktiv „freue sich“ und die Konstruktion „sollen jubeln“ bewahren den auffordernden Charakter der parallelen Verbformen. Das Ausrufezeichen nach der Eröffnungsproklamation unterstreicht den hymnischen Ton.
