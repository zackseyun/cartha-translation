id: PSA.97.5
reference: Psalms 97:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָרִ֗ים כַּ/דּוֹנַ֗ג נָ֭מַסּוּ מִ/לִּ/פְנֵ֣י יְהוָ֑ה מִ֝/לִּ/פְנֵ֗י אֲד֣וֹן כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/005.yaml
  text: The mountains melt like wax before Yahweh[b][a], before the Lord of all the earth.
translation:
  language: de
  text: Die Berge schmelzen wie Wachs vor Jahwe, vor dem Herrn der ganzen Erde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִים
  choice: die Berge
  rationale: Der bestimmte Plural wird direkt wiedergegeben und bewahrt das poetische Bild der erschütterten Schöpfung.
- source_word: כַּדּוֹנַג
  choice: wie Wachs
  rationale: Die Vergleichspartikel כ wird im heutigen Deutsch natürlich mit „wie“ wiedergegeben.
- source_word: נָמַסּוּ
  choice: schmelzen
  rationale: Das Verb bezeichnet Schmelzen oder Zerfließen. Das Präsens vermittelt die lebendige, poetische Darstellung, ohne eine zeitliche Abfolge festzulegen.
- source_word: מִלִּפְנֵי
  choice: vor
  rationale: Die Wendung bedeutet wörtlich etwa „weg vom Angesicht/aus der Gegenwart von“; „vor“ ist im Deutschen knapp und natürlich und bewahrt den Bezug auf Gottes unmittelbare Gegenwart.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: אֲדוֹן
  choice: Herr
  rationale: „Herr“ entspricht dem Titel und wahrt den gehobenen poetischen Ton.
- source_word: כָּל הָאָרֶץ
  choice: der ganzen Erde
  rationale: Die Genitivverbindung gibt die umfassende Herrschaft des Herrn über die gesamte Erde unmittelbar wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ erhält seinen Charakter als Eigenname und unterscheidet ihn vom folgenden Titel אֲדוֹן, „Herr“.
- issue: Zeitbezug von נָמַסּוּ in poetischer Rede
  choice: Präsens „schmelzen“
  alternative: Präteritum „schmolzen“ oder Perfekt „sind geschmolzen“
  rationale: Die hebräische Perfektform kann hier das Geschehen anschaulich und als machtvolle Realität darstellen. Das deutsche Präsens bewahrt diese poetische Unmittelbarkeit, ohne die Form auf ein ausschließlich vergangenes Ereignis festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Die Wiederholung von „vor“ bildet die hebräische Wiederaufnahme von מִלִּפְנֵי ab; „Jahwe“ und „Herr“ bleiben als Eigenname und Titel unterscheidbar.
