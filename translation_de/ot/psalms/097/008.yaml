  text: שָׁמְעָ֬ה וַ/תִּשְׂמַ֨ח צִיּ֗וֹן וַ֭/תָּגֵלְנָה בְּנ֣וֹת יְהוּדָ֑ה לְמַ֖עַן מִשְׁפָּטֶ֣י/ךָ יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/008.yaml
  text: Zion heard and rejoiced[a], and the daughters of Judah exulted because of your judgments, O Yahweh.
translation:
  language: de
  text: Zion hörte es und freute sich; die Töchter Judas[a] jubelten über deine Gerichte, Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Städte Judas« oder »die Ortschaften Judas«. Wörtlich steht im Hebräischen »die Töchter Judas«, eine poetische Wendung, die auch die umliegenden Gemeinwesen Judas bezeichnen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעָה
  choice: hörte es
  rationale: Das Qal Perfekt 3. Person Feminin Singular bezeichnet ein abgeschlossenes Hören; das im Deutschen nötige „es“ nimmt den vorausgehenden Bericht auf, ohne dessen Inhalt näher festzulegen.
- source_word: וַתִּשְׂמַח
  choice: und freute sich
  rationale: שׂמח bezeichnet Freude oder Frohsein. „Freute sich“ ist natürliches modernes Deutsch und bleibt vom stärkeren folgenden „jubelten“ unterschieden.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der Eigenname wird beibehalten; eine mögliche metonymische Bedeutung für Jerusalem oder seine Bevölkerung wird nicht in den Haupttext eingetragen.
- source_word: וַתָּגֵלְנָה
  choice: jubelten
  rationale: גיל drückt häufig lebhafte, überschwängliche Freude aus. „Jubelten“ bewahrt die Steigerung gegenüber „freute sich“.
- source_word: בְּנוֹת יְהוּדָה
  choice: die Töchter Judas
  rationale: Die wörtliche poetische Wendung bleibt im Haupttext erhalten. Ihre mögliche Bedeutung als Städte oder Ortschaften Judas wird in der Fußnote genannt.
- source_word: לְמַעַן
  choice: über
  rationale: Im Zusammenhang bezeichnet die Präposition den Anlass der Freude. Bei „jubeln“ gibt „über“ diese kausale Beziehung im Deutschen idiomatisch wieder.
- source_word: מִשְׁפָּטֶיךָ
  choice: deine Gerichte
  rationale: מִשְׁפָּט kann Recht, richterliche Entscheidung oder Gerichtshandeln bezeichnen. Der Plural „Gerichte“ bleibt nah am Hebräischen und bewahrt die Bandbreite zwischen Urteilen und vollzogenen Gerichtstaten.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; die Transliteration bewahrt den persönlichen Gottesnamen.
- issue: Deutung von בְּנוֹת יְהוּדָה
  choice: die Töchter Judas
  alternative: die Städte Judas / die Ortschaften Judas
  rationale: Die wörtliche Form wahrt Bildkraft und Mehrdeutigkeit. Die geografische Deutung wird in der Fußnote angeboten, statt im Haupttext festgelegt zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelstruktur. Das Semikolon macht die beiden parallelen Reaktionen deutlich; „freute sich“ und „jubelten“ bewahren die Abstufung der beiden hebräischen Freudenverben.
