source:
  edition: WLC
  text: יֵבֹ֤שׁוּ כָּל עֹ֬בְדֵי פֶ֗סֶל הַ/מִּֽתְהַלְלִ֥ים בָּ/אֱלִילִ֑ים הִשְׁתַּחֲווּ ל֝/וֹ כָּל אֱלֹהִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/007.yaml
  text: Let all who serve carved images be put to shame[a], those who boast in idols; bow down to him, all gods.
translation:
  language: de
  text: 'Schämen sollen sich alle, die einem Götterbild dienen,

    die sich ihrer Götzen rühmen.

    Werft euch vor ihm nieder, ihr Götter alle![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihr himmlischen Wesen alle« oder »ihr Engel alle«. Wörtlich steht im Hebräischen »ihr Götter alle«. Das kann eine polemische Bezeichnung für die Götter der Völker sein oder sich auf himmlische Wesen vor dem HERRN beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: Schämen sollen sich
  rationale: Das Verb bezeichnet Scham und Beschämung. Die vorangestellte Formulierung gibt die poetische, jussivartige Aussage wieder, ohne ausdrücklich einen äußeren Verursacher einzutragen.
- source_word: עֹבְדֵי
  choice: die … dienen
  rationale: Das Partizip von עבד bezeichnet hier den kultischen Dienst; „dienen“ wahrt die lexikalische Breite und ist im Zusammenhang eindeutig.
- source_word: פֶסֶל
  choice: Götterbild
  rationale: פֶסֶל bezeichnet ein angefertigtes, besonders ein geschnitztes Kultbild. „Götterbild“ ist im modernen Deutschen natürlich und hält den kultischen Bezug fest.
- source_word: הַמִּתְהַלְלִים
  choice: die sich … rühmen
  rationale: Der Hitpael von הלל drückt hier selbstbezogenes Rühmen oder Prahlen aus. „Sich rühmen“ entspricht der gehobenen poetischen Sprache des Psalms.
- source_word: בָּאֱלִילִים
  choice: ihrer Götzen
  rationale: אֱלִילִים bezeichnet abwertend nichtige Götter beziehungsweise Götzen. Die deutsche Verbindung „sich ihrer Götzen rühmen“ gibt die Präposition idiomatisch wieder.
- source_word: הִשְׁתַּחֲווּ
  choice: Werft euch … nieder
  rationale: Der Imperativ bezeichnet das körperliche Niederwerfen als Ausdruck der Huldigung. Diese Wiedergabe bewahrt die konkrete Handlung deutlicher als das interpretierende „betet an“.
- source_word: לוֹ
  choice: vor ihm
  rationale: Bei Verben des Niederwerfens lässt sich ל im Deutschen natürlich mit „vor“ wiedergeben; der Bezug auf den HERRN aus dem Kontext bleibt erhalten.
- source_word: כָּל אֱלֹהִים
  choice: ihr Götter alle
  rationale: Die wörtliche Wiedergabe erhält die polemische Aussage und die mögliche Mehrdeutigkeit des hebräischen אֱלֹהִים; alternative Deutungen werden in der Fußnote genannt.
theological_decisions:
- issue: Bezugsgruppe von כָּל אֱלֹהִים
  choice: ihr Götter alle
  alternative: ihr himmlischen Wesen alle; ihr Engel alle
  rationale: Der hebräische Text spricht von „allen Göttern“. Gemeint sein können polemisch die Götter der Völker oder Wesen der himmlischen Ratsversammlung. Die Hauptübersetzung bewahrt den Wortlaut und die theologische Spannung; die Deutungsalternativen stehen in der Fußnote.
translation_notes:
  register: Moderne, würdige Psalmsprache mit poetischer Zeilengliederung. „Götterbild“ und „Götzen“ bilden die unterschiedliche Wortwahl des Hebräischen ab. Die direkte Anrede „ihr Götter alle“ erhält die Kraft des abschließenden Imperativs.
