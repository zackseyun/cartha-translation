base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/004.yaml
  text: His lightning lights up the world[a]; the earth sees and trembles.
translation:
  language: de
  text: Seine Blitze erhellen den Erdkreis; die Erde sieht es und erbebt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder für „erbebt“: „zittert“, „bebt“ oder „windet sich“. Das hebräische Verb kann Erbeben, Zittern oder sich winden ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵאִירוּ
  choice: erhellen
  rationale: Das Hifil Perfekt von אור bezeichnet das Verursachen von Licht beziehungsweise Helligkeit. „Erhellen“ gibt diesen kausativen Sinn im Deutschen natürlich wieder.
- source_word: בְרָקָיו
  choice: seine Blitze
  rationale: Der Plural mit Suffix der 3. Person Singular verweist auf Gottes Blitze; der deutsche Plural bewahrt die hebräische Form und klingt idiomatisch.
- source_word: תֵּבֵל
  choice: den Erdkreis
  rationale: תבל bezeichnet häufig die bewohnte Welt. „Erdkreis“ wahrt in gehobener, aber verständlicher Sprache die Unterscheidung zu הָאָרֶץ im zweiten Halbvers.
- source_word: רָאֲתָה
  choice: sieht es
  rationale: Das formal perfektische Verb wird im lebendigen poetischen Zusammenhang präsentisch wiedergegeben. Das ergänzte „es“ macht den deutschen Satz natürlich, ohne den Bezug fest über das Sichtbarwerden der Blitze hinaus auszudeuten.
- source_word: וַתָּחֵל
  choice: und erbebt
  rationale: Das Verb aus חול/חיל kann Beben, Zittern oder Sichwinden ausdrücken. „Erbebt“ passt zur theophanischen Erschütterung der Erde, ohne eindeutig Schmerz- oder Geburtswehenbildlichkeit festzulegen.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Im Parallelismus mit תבל und im kosmischen Zusammenhang ist „die Erde“ gegenüber dem lokaleren „das Land“ vorzuziehen.
theological_decisions:
- issue: Kosmische Reichweite der Gotteserscheinung
  choice: „Erdkreis“ und „Erde“ geben die beiden hebräischen Begriffe unterschieden, aber aufeinander bezogen wieder.
  alternative: הָאָרֶץ könnte lokal als „das Land“ verstanden werden.
  rationale: Der Parallelismus und der Kontext der Gotteserscheinung sprechen für eine weltweite, nicht bloß regionale Perspektive; dies ist eine kontextuelle Sprachentscheidung ohne dogmatische Erweiterung.
- issue: Personifikation der Erde
  choice: Die Erde „sieht“ und „erbebt“, sodass die poetische Personifikation erhalten bleibt.
  alternative: 'Man könnte glätten: „Beim Anblick erbebt die Erde.“'
  rationale: Die direkte Wiedergabe bewahrt die markante Bildsprache und ihre theologische Spannung, statt sie erklärend aufzulösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Prägung. „Erdkreis“ dient der Unterscheidung von תֵּבֵל und הָאָרֶץ; „erbebt“ wahrt den theophanischen Ton. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf den sich die lexikalische Alternative bezieht.
