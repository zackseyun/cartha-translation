source:
  edition: WLC
  text: כִּֽי אַתָּ֤ה יְהוָ֗ה עֶלְי֥וֹן עַל כָּל הָ/אָ֑רֶץ מְאֹ֥ד נַ֝עֲלֵ֗יתָ עַל כָּל אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/009.yaml
  text: For you[a], O Yahweh, are Most High over all the earth; you are exalted far above all gods.
translation:
  language: de
  text: Denn du, Jahwe, bist der Höchste über die ganze Erde; hoch erhaben bist du über alle Götter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »über alle göttlichen Wesen« oder »über alle himmlischen Wesen«. Das hebräische Wort ʾelohim kann je nach Zusammenhang Götter, göttliche Wesen oder himmlische Mächte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und entspricht dem argumentativen Zusammenhang des Psalms.
- source_word: אַתָּה
  choice: du
  rationale: 'Das ausdrücklich gesetzte Pronomen bleibt zur Betonung erhalten: Jahwe selbst ist der Höchste.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den hebräischen Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: עֶלְיוֹן
  choice: der Höchste
  rationale: Bewahrt den Rangbegriff und seine geläufige Verwendung als göttliche Bezeichnung.
- source_word: עַל כָּל הָאָרֶץ
  choice: über die ganze Erde
  rationale: Drückt Jahwes Vorrang beziehungsweise Herrschaft über die gesamte Erde in natürlichem Deutsch aus.
- source_word: מְאֹד נַעֲלֵיתָ
  choice: hoch erhaben bist du
  rationale: Gibt die starke Intensivierung und den resultativ-statischen Sinn des Verbs in würdiger deutscher Psalmsprache wieder.
- source_word: עַל כָּל אֱלֹהִים
  choice: über alle Götter
  rationale: Bewahrt den naheliegenden Pluralsinn sowie die polemische und theologische Spannung, ohne die bezeichneten Wesen näher festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als Name sichtbar gehalten und nicht durch einen Herrschaftstitel ersetzt.
- issue: Bedeutung von אֱלֹהִים im letzten Halbvers
  choice: Götter
  alternative: göttliche Wesen / himmlische Wesen
  rationale: „Götter“ erhält die direkte lexikalische Bedeutung und die Aussage von Jahwes Überlegenheit über alle möglichen göttlichen Rivalen; die genauere Identität der Gemeinten bleibt offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die Voranstellung „hoch erhaben“ bildet die emphatische Steigerung des hebräischen zweiten Halbverses ab; „Jahwe“ folgt der deutschen Standardtranskription des Gottesnamens.
