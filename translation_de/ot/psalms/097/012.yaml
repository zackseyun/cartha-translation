  variant: modern standard German
source:
  edition: WLC
  text: שִׂמְח֣וּ צַ֭דִּיקִים בַּֽ/יהוָ֑ה וְ֝/הוֹד֗וּ לְ/זֵ֣כֶר קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/012.yaml
  text: Rejoice in Yahweh[a], you righteous ones[b], and give thanks at the remembrance of his holiness.
translation:
  language: de
  text: Freut euch an Jahwe, ihr Gerechten, und dankt ihm, wenn ihr seiner Heiligkeit gedenkt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und dankt ihm bei der Erwähnung seiner Heiligkeit.“ Das hebräische Wort זֵכֶר kann Erinnerung, Gedenken, Gedächtnis oder Erwähnung bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Viele Übersetzungen geben die Wendung sinngemäß mit „seinem heiligen Namen“ wieder. Wörtlich steht hier jedoch „seiner Heiligkeit“; das hebräische Wort für „Name“ fehlt.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: Freut euch
  rationale: Der pluralische Imperativ fordert zu einer freudigen Reaktion auf; „Freut euch“ ist gegenwärtiges, natürliches Deutsch und bewahrt die Aufforderung.
- source_word: צַדִּיקִים
  choice: ihr Gerechten
  rationale: Die maskuline Pluralform wird hier als direkte Anrede verstanden. „Ihr Gerechten“ gibt diese Anrede knapp und idiomatisch wieder.
- source_word: בַּיהוָה
  choice: an Jahwe
  rationale: Die Präposition ב bezeichnet hier den Bezug beziehungsweise Grund der Freude. „Sich an Jahwe freuen“ ist im Deutschen natürlich und bleibt dem hebräischen Ausdruck nahe.
- source_word: יהוה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְהוֹדוּ
  choice: und dankt ihm
  rationale: Der Hifil-Imperativ von ידה bezeichnet in diesem Kontext Danken beziehungsweise dankendes Preisen. Das ergänzte Pronomen „ihm“ macht den im Deutschen erforderlichen Adressaten deutlich, der aus dem unmittelbaren Kontext hervorgeht.
- source_word: לְזֵכֶר
  choice: wenn ihr … gedenkt
  rationale: זֵכֶר kann Erinnerung, Gedenken, Gedächtnis oder Erwähnung bezeichnen. Die temporale Formulierung ist in modernem Deutsch verständlich und gibt den Anlass des Dankes wieder, ohne die mögliche Bedeutung „Erwähnung“ auszuschließen.
- source_word: קָדְשׁוֹ
  choice: seiner Heiligkeit
  rationale: Wörtlich steht „seine Heiligkeit“. Die Übersetzung fügt nicht „Name“ hinzu, da שֵׁם im hebräischen Text fehlt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher erkennbar wiedergegeben. Der traditionelle Ersatztitel „der HERR“ ist möglich, würde aber den im Ausgangstext stehenden Namen weniger unmittelbar abbilden.
- issue: Ob bei קָדְשׁוֹ das Wort „Name“ ergänzt werden soll
  choice: seiner Heiligkeit
  alternative: seines heiligen Namens
  rationale: Ähnliche Psalmformulierungen können die traditionelle Wiedergabe „heiliger Name“ nahelegen; hier fehlt jedoch das hebräische Wort für „Name“. Daher bleibt die Übersetzung bei der ausdrücklich genannten „Heiligkeit“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und beide Imperative bleiben erhalten. Der zweite Halbvers wird leicht entfaltet, um die im Deutschen schwer nachbildbare Verbindung לְזֵכֶר קָדְשׁוֹ verständlich wiederzugeben; die lexikalische Mehrdeutigkeit wird in der Fußnote bewahrt.
