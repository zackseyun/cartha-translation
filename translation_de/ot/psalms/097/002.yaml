base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/002.yaml
  text: Clouds and thick darkness are around him[a]; righteousness and justice are the foundation of his throne.
translation:
  language: de
  text: Wolke und dichtes Dunkel sind rings um ihn; Gerechtigkeit und Recht sind das Fundament seines Thrones.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wolke und Dunkelheit umgeben ihn.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנָן
  choice: Wolke
  rationale: Das hebräische Substantiv steht im Singular. Der poetische Singular „Wolke“ bewahrt die Form und passt zur theophanischen Bildsprache.
- source_word: וַעֲרָפֶל
  choice: und Dunkel
  rationale: עֲרָפֶל bezeichnet dichtes Dunkel, Finsternis oder düsteres Gewölk. „Dunkel“ klingt im Deutschen würdevoll und bewahrt die Bildkraft, ohne die Wolkenvorstellung doppelt auszudrücken.
- source_word: סְבִיבָיו
  choice: sind rings um ihn
  rationale: Die Präpositionalform bedeutet wörtlich „rings um ihn“. Die ergänzte Kopula ergibt einen natürlichen deutschen Nominalsatz.
- source_word: צֶדֶק
  choice: Gerechtigkeit
  rationale: In der Verbindung mit מִשְׁפָּט bezeichnet צֶדֶק die gerechte Beschaffenheit beziehungsweise Rechtschaffenheit; „Gerechtigkeit“ erhält die begriffliche Spannung zum folgenden „Recht“.
- source_word: וּמִשְׁפָּט
  choice: und Recht
  rationale: מִשְׁפָּט kann Gericht, Recht oder Rechtsordnung bezeichnen. „Recht“ ist hier knapp, idiomatisch und unterscheidet sich ausreichend von „Gerechtigkeit“.
- source_word: מְכוֹן
  choice: das Fundament
  rationale: Das Wort bezeichnet einen festen Grund, eine Grundlage oder einen fest gegründeten Ort. Beim Thronbild ist „Fundament“ im modernen Deutsch anschaulich und präzise.
- source_word: כִּסְאוֹ
  choice: seines Thrones
  rationale: Der Genitiv gibt die hebräische Status-constructus-Verbindung מְכוֹן כִּסְאוֹ natürlich wieder.
theological_decisions:
- issue: Theophanische Bildsprache göttlicher Verborgenheit
  choice: Wolke und Dunkel als reale poetische Bilder um Gott beibehalten
  alternative: Die Bilder deutend als Majestät oder Geheimnis wiedergeben
  rationale: Der Vers verbindet Gottes Königtum mit einer Gotteserscheinung, in der Offenbarung und Verborgenheit nebeneinanderstehen. Eine abstrakte Deutung würde diese Spannung auflösen.
- issue: Verhältnis von צֶדֶק und מִשְׁפָּט
  choice: „Gerechtigkeit und Recht“ als unterscheidbares Begriffspaar
  alternative: Beide Glieder mit nahezu gleichbedeutenden Ausdrücken wiedergeben
  rationale: Die Wiedergabe wahrt den poetischen Parallelismus und lässt sowohl Gottes gerechtes Wesen als auch seine rechtsetzende beziehungsweise richterliche Ordnung anklingen.
translation_notes:
  register: Moderne, gehobene Standardsprache mit knapper poetischer Satzstruktur. „Rings um ihn“ bewahrt den Psalmton, ohne altertümlich zu wirken. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf den sich die lexikalische Alternative bezieht.
