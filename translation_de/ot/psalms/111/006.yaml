  terminology: „Macht“, „Taten“, „Volk“, „Erbbesitz“ und „Völker“ sind terminologisch tragfähig. „Erbbesitz der Völker“ erhält die knappe hebräische Konstruktverbindung sowie deren landbezogenen historischen Sinn, ohne durch eine zusätzliche Auslegung den Text enger festzulegen.
