  source_fidelity: Die Übersetzung gibt כֹּחַ מַעֲשָׂיו treffend als „die Macht seiner Taten“ wieder und gibt הִגִּיד לְעַמּוֹ idiomatisch und dem gehobenen Psalmregister entsprechend mit „hat er seinem Volk kundgetan“ wieder. „Indem er ihnen den Erbbesitz der Völker gab“ vertritt vertretbar die naheliegende modale/instrumentale beziehungsweise resultative Lesart von לָתֵת, ohne den hebräischen Ausdruck sachlich zu überdehnen.
