source:
  edition: WLC
  text: כֹּ֣חַ מַ֭עֲשָׂי/ו הִגִּ֣יד לְ/עַמּ֑/וֹ לָ/תֵ֥ת לָ֝/הֶ֗ם נַחֲלַ֥ת גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/006.yaml
  text: He has declared to his people the power of his works[a], in giving them the inheritance of the nations.
translation:
  language: de
  text: Die Macht seiner Taten hat er seinem Volk kundgetan, indem er ihnen den Erbbesitz der Völker gab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Macht seiner Taten hat er seinem Volk kundgetan, um ihnen den Erbbesitz der Völker zu geben.« Der hebräische Infinitiv kann einen Zweck statt eines Mittels oder einer Folge ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּחַ
  choice: Macht
  rationale: Das Wort bezeichnet Kraft, Stärke oder Macht. »Macht« passt hier zu Gottes machtvollen Taten und klingt im Deutschen natürlich.
- source_word: מַעֲשָׂיו
  choice: seiner Taten
  rationale: מַעֲשֶׂה kann Werk, Tat oder Handlung bedeuten. »Taten« verweist klar auf Gottes geschichtliches Handeln und vermeidet die mögliche Verengung von »Werken« auf geschaffene Dinge.
- source_word: הִגִּיד
  choice: hat … kundgetan
  rationale: Der Hifil von נגד bedeutet mitteilen, verkünden oder bekannt machen. »Kundgetan« bewahrt den feierlichen, proklamierenden Ton des Psalms, ohne unverständlich zu sein.
- source_word: לְעַמּוֹ
  choice: seinem Volk
  rationale: 'Die Präposition ל kennzeichnet hier am besten den indirekten Gegenstand: Gott hat seinem Volk etwas kundgetan.'
- source_word: לָתֵת
  choice: indem er … gab
  rationale: 'Der Infinitiv mit ל kann Mittel/Folge oder Zweck ausdrücken. Die Wiedergabe mit »indem« bringt die im Kontext wahrscheinliche instrumentale Beziehung zum Ausdruck: In der Gabe des Landes zeigte Gott die Macht seiner Taten.'
- source_word: לָהֶם
  choice: ihnen
  rationale: Das Pronomen verweist auf Gottes Volk zurück und wird zur Klarheit ausdrücklich wiedergegeben.
- source_word: נַחֲלַת
  choice: den Erbbesitz
  rationale: נַחֲלָה bezeichnet Erbe, Besitz oder zugeteiltes Land. »Erbbesitz« bewahrt den Gedanken der verheißenen und zugeteilten Besitzgabe und ist im Landkontext eindeutiger als »Erbe«.
- source_word: גּוֹיִם
  choice: der Völker
  rationale: Gemeint sind die fremden Völker, deren Land Israel als Besitz erhielt. »Völker« ist die sachgemäße und im Psalmenkontext natürliche Wiedergabe.
theological_decisions:
- issue: Beziehung des abschließenden Infinitivsatzes לָתֵת לָהֶם נַחֲלַת גּוֹיִם zum Hauptsatz
  choice: 'Instrumentale Nuance: Gott tat die Macht seiner Taten kund, indem er seinem Volk den Erbbesitz der Völker gab.'
  alternative: 'Finale Nuance: Gott tat seinem Volk die Macht seiner Taten kund, um ihm den Erbbesitz der Völker zu geben.'
  rationale: Der hebräische Infinitiv mit ל kann Zweck, Folge oder Mittel bezeichnen. Im Zusammenhang mit Gottes geschichtlichen Machttaten liegt nahe, dass die Landgabe selbst seine Macht sichtbar machte. Da die finale Deutung grammatisch möglich bleibt, wird sie in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markierte Satzstellung hebt wie im Hebräischen »die Macht seiner Taten« hervor. »Kundgetan« hält den poetisch-feierlichen Ton; »Erbbesitz« verdeutlicht den Zusammenhang mit dem zugeteilten Land.
