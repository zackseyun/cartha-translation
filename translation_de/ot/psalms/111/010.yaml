  text: רֵ֘אשִׁ֤ית חָכְמָ֨ה יִרְאַ֬ת יְהוָ֗ה שֵׂ֣כֶל ט֭וֹב לְ/כָל עֹשֵׂי/הֶ֑ם תְּ֝הִלָּת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/010.yaml
  text: The fear of Yahweh is the beginning of wisdom[a]; good understanding belongs to all who practice it[c][b]. His praise stands forever.
translation:
  language: de
  text: Die Furcht vor Jahwe ist der Anfang der Weisheit; gute Einsicht haben alle, die danach handeln.[a] Sein Lob besteht für immer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gute Einsicht für alle, die sie tun“. Worauf sich „sie“ bezieht, wird im Hebräischen nicht ausdrücklich gesagt; gemeint sein können die im Psalm genannten Gebote Jahwes oder ein Handeln, das der Furcht vor ihm entspricht.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Oder: „Sein Lob bleibt für immer.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית חָכְמָה
  choice: der Anfang der Weisheit
  rationale: רֵאשִׁית bezeichnet hier den grundlegenden Anfang oder Ausgangspunkt. Die geläufige Wendung bewahrt die Breite des hebräischen Ausdrucks, ohne ihn nur zeitlich oder ausschließlich als höchsten Rang zu deuten.
- source_word: יִרְאַת יְהוָה
  choice: die Furcht vor Jahwe
  rationale: „Furcht“ bewahrt neben Ehrfurcht auch das stärkere Moment des hebräischen Ausdrucks. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: שֵׂכֶל טוֹב
  choice: gute Einsicht
  rationale: שֵׂכֶל meint verständige, lebenspraktisch bewährte Einsicht; „gute Einsicht“ gibt die knappe hebräische Verbindung natürlich wieder.
- source_word: לְכָל עֹשֵׂיהֶם
  choice: haben alle, die danach handeln
  rationale: Das Hebräische lautet wörtlich „für alle, die sie tun“, wobei das maskuline Pluralobjekt keinen ausdrücklichen Bezug im Vers hat. „Danach handeln“ ist im Deutschen verständlich, lässt den Bezug aber bewusst offen und betont die praktische Verwirklichung.
- source_word: תְּהִלָּתוֹ
  choice: sein Lob
  rationale: Das Suffix bezieht sich im Zusammenhang am ehesten auf Jahwe. „Sein Lob“ bewahrt die mögliche Bedeutung sowohl des ihm dargebrachten Lobes als auch seines Ruhmes.
- source_word: עֹמֶדֶת לָעַד
  choice: besteht für immer
  rationale: Die Wendung bezeichnet dauerhaften Bestand. „Besteht für immer“ erhält das Bild des Stehens idiomatisch im Deutschen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von יִרְאָה
  choice: Furcht
  alternative: Ehrfurcht
  rationale: „Ehrfurcht“ allein könnte das im hebräischen Weisheitsspruch enthaltene Moment wirklicher Furcht abschwächen. „Furcht“ wahrt die theologische Spannung und schließt ehrfürchtige Verehrung mit ein.
- issue: Unklarer Bezug des pluralischen Suffixes in עֹשֵׂיהֶם
  choice: danach handeln, mit erklärender Fußnote
  alternative: sie tun / sie befolgen
  rationale: Der Text nennt im unmittelbaren Satz keinen eindeutigen pluralischen Bezug. Die Übersetzung vermeidet eine dogmatische Festlegung; die Fußnote legt die grammatische Schwierigkeit und die naheliegenden Bezüge offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der bekannte weisheitliche Kernsatz bleibt knapp und einprägsam. Die schwierige pluralische Rückverweisung wird im Haupttext natürlich formuliert, aber nicht stillschweigend eindeutig aufgelöst; die Fußnote dokumentiert den hebräischen Wortlaut.
