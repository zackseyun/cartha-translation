id: PSA.111.4
reference: Psalms 111:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זֵ֣כֶר עָ֭שָׂה לְ/נִפְלְאֹתָ֑י/ו חַנּ֖וּן וְ/רַח֣וּם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/004.yaml
  text: He has caused his wondrous works to be remembered[a]; Yahweh is gracious and compassionate.
translation:
  language: de
  text: Er hat bewirkt, dass seine Wunderwerke in Erinnerung bleiben[a]; gnädig und barmherzig ist Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er hat für seine Wunderwerke ein Denkmal geschaffen.«'
    reason: 'Lexikalische Alternative: זֵכֶר kann sowohl Erinnerung als auch ein Gedenkzeichen oder Denkmal bezeichnen.'
lexical_decisions:
- source_word: זֵכֶר
  choice: in Erinnerung bleiben
  rationale: Das Substantiv bezeichnet »Erinnerung« oder »Gedenkzeichen«. Zusammen mit עָשָׂה und לְנִפְלְאֹתָיו wird die Wendung im Deutschen natürlich als bewirktes Fortbestehen der Erinnerung wiedergegeben; die konkrete Alternative »ein Denkmal geschaffen« bleibt in der Fußnote erhalten.
- source_word: עָשָׂה
  choice: hat bewirkt
  rationale: Wörtlich bedeutet das Verb »machen/tun«. In der Verbindung mit זֵכֶר gibt »hat bewirkt« die effektive Bedeutung der hebräischen Konstruktion idiomatisch wieder.
- source_word: לְנִפְלְאֹתָיו
  choice: seine Wunderwerke
  rationale: נִפְלָאוֹת bezeichnet hier die außergewöhnlichen Taten Gottes. »Wunderwerke« bewahrt den Bezug auf konkrete machtvolle Taten.
- source_word: חַנּוּן
  choice: gnädig
  rationale: Das Adjektiv bezeichnet Gottes wohlwollende, Gnade gewährende Haltung und wird direkt mit »gnädig« wiedergegeben.
- source_word: וְרַחוּם
  choice: und barmherzig
  rationale: רַחוּם bezeichnet mitfühlendes Erbarmen. »Barmherzig« ist im Deutschen eine natürliche und würdevolle Entsprechung und unterscheidet sich klar von »gnädig«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name transliteriert und nicht durch einen Titel ersetzt; »Jahwe« ist die im modernen Deutschen geläufige Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. Die Transliteration »Jahwe« bewahrt diesen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Subjekt des ersten Satzteils
  choice: Das unausgesprochene Subjekt von עָשָׂה ist Jahwe
  alternative: 'Unpersönlich: »Seiner Wunderwerke wird gedacht«'
  rationale: Das Verb steht in der 3. Person Singular maskulin, während Jahwe erst im abschließenden Satzteil ausdrücklich genannt wird. Die poetische Subjektkontinuität legt nahe, dass derselbe Gott auch das Erinnern seiner Wunderwerke bewirkt.
- issue: Bedeutung von זֵכֶר עָשָׂה
  choice: Er bewirkte bleibende Erinnerung
  alternative: Er schuf ein Denkmal bzw. Gedenkzeichen
  rationale: Die Konstruktion kann sowohl die gestiftete Erinnerung als auch ein konkreteres Gedenkzeichen bezeichnen. Der Haupttext gibt die idiomatische Wirkungsbedeutung wieder; die Fußnote bewahrt die sachliche Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die nachgestellte Formulierung »gnädig und barmherzig ist Jahwe« bewahrt die pointierte poetische Namensnennung am Versende.
