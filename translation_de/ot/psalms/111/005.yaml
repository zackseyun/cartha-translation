  text: He has given food to those who fear him[a]; he will remember his covenant forever.
translation:
  language: de
  text: Nahrung gab er denen, die ihn fürchten; er wird sich für immer an seinen Bund erinnern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טֶרֶף
  choice: Nahrung
  rationale: Das Substantiv kann »Beute« oder durch Jagd gewonnene Nahrung bezeichnen. Im Zusammenhang mit Gottes Wohltaten gibt »Nahrung« den konkreten Sinn natürlich wieder, ohne unnötig ein Bild des Raubens einzutragen.
- source_word: נָתַן
  choice: gab
  rationale: Das hebräische Perfekt bezeichnet hier eine vollendete Handlung. Das schlichte deutsche Präteritum passt zum poetischen Rückblick und bewahrt die knappe Satzform.
- source_word: לִירֵאָיו
  choice: denen, die ihn fürchten
  rationale: Die substantivierte Form bezeichnet Menschen, die durch ihre Gottesfurcht gekennzeichnet sind. »Ihn fürchten« bewahrt das Gewicht von ירא und ist im heutigen Deutsch verständlich.
- source_word: יִזְכֹּר
  choice: er wird … denken
  rationale: Das Imperfekt wird als Zukunftsaussage verstanden. Die feste deutsche Verbindung »an seinen Bund denken« bewahrt das Erinnerungsmotiv, ohne es auf bloße gedankliche Erinnerung zu beschränken.
- source_word: לְעוֹלָם
  choice: ewig
  rationale: »Ewig« gibt die unbegrenzte Dauer in diesem Bundeskontext knapp und idiomatisch wieder.
- source_word: בְּרִיתוֹ
  choice: seinen Bund
  rationale: »Bund« ist die sachlich und theologisch angemessene Standardentsprechung für בְּרִית.
theological_decisions:
- issue: Bedeutung des göttlichen Erinnerns im Bundeskontext
  choice: »er wird ewig an seinen Bund denken« als Ausdruck bleibender Bundestreue, die Handeln einschließt
  alternative: »er denkt immer an seinen Bund« als allgemeingültige Gegenwartsaussage
  rationale: Wenn Gott sich in der Hebräischen Bibel an seinen Bund erinnert, geht es gewöhnlich nicht nur um einen inneren Gedankenvorgang, sondern um bundgemäßes Handeln. Die Übersetzung bewahrt dennoch das biblische Erinnerungsmotiv und deutet es nicht ausdrücklich als »halten« oder »treu sein« aus.
translation_notes:
  register: Knappe, würdige poetische Standardsprache. Die Wortstellung stellt »Nahrung« wie im Hebräischen heraus. Keine Fußnote ist nötig, da »Nahrung« den kontextuell wahrscheinlichen Sinn wiedergibt und »Beute« hier eine weniger wahrscheinliche lexikalische Alternative ist.
