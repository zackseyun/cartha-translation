  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: טֶרֶף ist hier am wahrscheinlichsten „Nahrung“, לִירֵאָיו „denen, die ihn fürchten“, und בְּרִיתוֹ „seinen Bund“. Das Imperfekt יִזְכֹּר kann sachgerecht zukunftsbezogen mit „wird … erinnern“ stehen. Die Wendung „an seinen Bund denken“ ist jedoch gegenüber זכר weniger präzise, da sie im Deutschen stärker bloßes Nachdenken nahelegt.'
  naturalness: „Nahrung gab er“ ist als knappe poetische Wortstellung möglich. „Sich an seinen Bund erinnern“ ist die idiomatischere deutsche Entsprechung des hebräischen Erinnerungsverbs als „an seinen Bund denken“. „Für immer“ klingt in modernem Standarddeutsch in dieser Stellung natürlicher als das isolierte Adverb „ewig“.
  terminology: „Nahrung“, „fürchten“ und „Bund“ sind angemessen und bewahren den biblisch-theologischen Wortlaut ohne konfessionelle Ausdeutung. „Sich erinnern“ erhält das biblische Erinnerungsmotiv, ohne es interpretierend durch „treu bleiben“ oder „seinen Bund halten“ zu ersetzen.
