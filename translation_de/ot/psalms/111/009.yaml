  source_fidelity: 'Die Übersetzung bildet die drei hebräischen Aussagen zuverlässig ab: פְּדוּת als „Erlösung“, שָׁלַח mit dem Empfänger „seinem Volk“, צִוָּה ... בְּרִיתוֹ als autoritative Setzung beziehungsweise Anordnung des Bundes auf Dauer sowie קָדוֹשׁ וְנוֹרָא als „heilig und Ehrfurcht gebietend“. „Verordnet“ ist gegenüber dem formal möglichen, aber im Deutschen sehr unidiomatischen „seinen Bund geboten“ eine vertretbare idiomatische Wiedergabe und behauptet keine über das Hebräische hinausgehende theologische Präzisierung.'
