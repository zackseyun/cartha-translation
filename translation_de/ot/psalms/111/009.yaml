  variant: modern standard German
source:
  edition: WLC
  text: פְּד֤וּת שָׁ֘לַ֤ח לְ/עַמּ֗/וֹ צִוָּֽה לְ/עוֹלָ֥ם בְּרִית֑/וֹ קָד֖וֹשׁ וְ/נוֹרָ֣א שְׁמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/009.yaml
  text: He sent redemption to his people[a]; he has commanded his covenant forever[b]. Holy and awesome is his name.
translation:
  language: de
  text: Er sandte seinem Volk Erlösung; seinen Bund hat er für immer verordnet.[a] Heilig und Ehrfurcht gebietend[b] ist sein Name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „hat seinen Bund für immer geboten“; auch: „für immer eingesetzt“.'
    reason: Die hebräische Formulierung verwendet das Verb „befehlen, anordnen“, das mit „Bund“ im Deutschen nicht ohne Weiteres idiomatisch verbunden werden kann.
  - marker: b
    text: 'Auch: „furchtgebietend“ oder „zu fürchten“. Das Hebräische bezeichnet etwas, das ehrfürchtige Furcht und Staunen hervorruft.'
    reason: Die Bedeutungsbreite schließt nicht nur Bewunderung, sondern auch heilige Furcht ein.
lexical_decisions:
- source_word: פְּדוּת
  choice: Erlösung
  rationale: Das Substantiv bezeichnet Befreiung beziehungsweise Loskauf durch Eingreifen oder Zahlung. „Erlösung“ bewahrt die theologische Tragweite und passt natürlich in den Lobpreis des Psalms.
- source_word: שָׁלַח
  choice: sandte
  rationale: Die Grundbedeutung lautet „senden“. Die konkrete Bildsprache, nach der Gott die Erlösung zu seinem Volk sendet, bleibt erhalten.
- source_word: לְעַמּוֹ
  choice: seinem Volk
  rationale: Die Präposition לְ kennzeichnet hier am ehesten den Empfänger; der deutsche Dativ gibt dies knapp und natürlich wieder.
- source_word: צִוָּה
  choice: verordnet
  rationale: Das Verb bedeutet „befehlen, anordnen, bestimmen“. In Verbindung mit „Bund“ vermittelt „verordnet“ die autoritative Setzung natürlicher als das im Deutschen ungewöhnliche „den Bund gebieten“.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung drückt hier die unbegrenzte Dauer und bleibende Gültigkeit des Bundes aus.
- source_word: בְּרִיתוֹ
  choice: seinen Bund
  rationale: „Bund“ ist die sachlich und theologisch angemessene Wiedergabe von בְּרִית und erhält dessen Beziehungs- und Verpflichtungscharakter.
- source_word: קָדוֹשׁ
  choice: heilig
  rationale: „Heilig“ ist die direkte und etablierte Wiedergabe, besonders als Aussage über Gottes Namen.
- source_word: וְנוֹרָא
  choice: Ehrfurcht gebietend
  rationale: Das Adjektiv bezeichnet etwas, das ehrfürchtiges Erschrecken und Staunen hervorruft. „Ehrfurcht gebietend“ bewahrt beide Aspekte besser als das im heutigen Deutsch oft abgeschwächte „beeindruckend“.
- source_word: שְׁמוֹ
  choice: sein Name
  rationale: Die wörtliche Wiedergabe erhält die biblische Redeweise, in der Gottes Name für seinen offenbarten Charakter und Ruf steht.
theological_decisions:
- issue: Aussagekraft von צִוָּה in Verbindung mit Gottes Bund
  choice: seinen Bund hat er für immer verordnet
  alternative: seinen Bund hat er für immer geboten / für immer eingesetzt
  rationale: „Verordnet“ wahrt die autoritative Kraft des hebräischen Verbs, vermeidet jedoch die missverständliche Vorstellung, der Bund selbst sei ein angesprochener Befehlsempfänger. Die Fußnote hält die wörtlichere Möglichkeit offen.
- issue: Bedeutung von וְנוֹרָא als Eigenschaft des Namens Gottes
  choice: Ehrfurcht gebietend
  alternative: furchtgebietend / zu fürchten
  rationale: Die gewählte Formulierung umfasst sowohl ehrfürchtige Furcht als auch staunende Bewunderung und glättet die im Hebräischen vorhandene ernste Dimension nicht weg.
translation_notes:
  register: Moderne, würdige Psalmsprache mit klarer Satzstruktur. Die ungewöhnliche Bildrede „Erlösung senden“ bleibt als prägnante hebräische Metapher erhalten; „verordnet“ sorgt beim Bund für verständliches Deutsch, ohne Gottes autoritative Setzung abzuschwächen.
