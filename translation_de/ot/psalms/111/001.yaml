  text: הַ֥לְלוּ יָ֨הּ אוֹדֶ֣ה יְ֭הוָה בְּ/כָל לֵבָ֑ב בְּ/ס֖וֹד יְשָׁרִ֣ים וְ/עֵדָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/001.yaml
  text: Praise Yah! I will give thanks to Yahweh with my whole heart[b][a], in the council of the upright and in the congregation.
translation:
  language: de
  text: Preist Jah![a] Von ganzem Herzen will ich Jahwe danken, im Kreis[b] der Aufrichtigen und in der Gemeinde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Preist Jah!“; daraus stammt die traditionelle Form „Halleluja“. „Jah“ ist die Kurzform des Gottesnamens.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Rat der Aufrichtigen“. Das hebräische Wort kann einen vertrauten Kreis, einen Rat oder eine versammelte Gemeinschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: Preist Jah!
  rationale: Der Pluralimperativ von הלל mit der Kurzform des Gottesnamens eröffnet den Psalm als gemeinschaftlichen Lobaufruf. Die Übersetzung bewahrt sowohl die Bedeutung als auch die Unterscheidung zum folgenden יְהוָה.
- source_word: אוֹדֶה
  choice: will ich … danken
  rationale: Die Hifil-Form von ידה bezeichnet hier dankendes Preisen. Die Zukunftsform gibt den entschlossenen persönlichen Lobvorsatz natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und dadurch von Titeln wie „Herr“ unterschieden.
- source_word: בְּכָל לֵבָב
  choice: von ganzem Herzen
  rationale: Die geläufige deutsche Wendung drückt die im Hebräischen bezeichnete ungeteilte innere Hingabe aus.
- source_word: בְּסוֹד
  choice: im Kreis
  rationale: סוֹד kann einen vertrauten Kreis, einen Rat oder eine versammelte Gemeinschaft bezeichnen. „Kreis“ ist im Zusammenhang natürlich und hält die Bezeichnung vom folgenden עֵדָה auseinander.
- source_word: יְשָׁרִים
  choice: der Aufrichtigen
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die moralisch gerade und rechtschaffen handeln.
- source_word: וְעֵדָה
  choice: und in der Gemeinde
  rationale: עֵדָה bezeichnet die versammelte Gemeinschaft; „Gemeinde“ passt zum öffentlichen Gotteslob und bleibt von סוֹד unterschieden.
theological_decisions:
- issue: Wiedergabe der Gottesnamen יָהּ und יְהוָה im selben Vers
  choice: יָהּ als „Jah“ und יְהוָה als „Jahwe“ wiedergeben
  alternative: „Halleluja“ für יָהּ und „der HERR“ für יְהוָה
  rationale: Die getrennte Wiedergabe bewahrt die im hebräischen Text erkennbare Kurzform und Vollform des Gottesnamens, ohne beide durch denselben Titel einzuebnen.
- issue: Verhältnis von סוֹד und עֵדָה
  choice: Als zwei sich ergänzende Bezeichnungen „Kreis“ und „Gemeinde“ wiedergeben
  alternative: Beide mit „Versammlung“ wiedergeben
  rationale: 'Der Parallelismus erlaubt Überschneidung, doch die unterschiedlichen hebräischen Wörter setzen eigene Akzente: סוֹד kann einen engeren vertrauten Kreis bezeichnen, עֵדָה die versammelte Gemeinschaft. Die Übersetzung lässt diese Spannung bestehen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Zuruf bleibt knapp und gemeinschaftlich; die traditionelle Form „Halleluja“ wird in der Fußnote genannt. „Kreis“ und „Gemeinde“ bewahren die lexikalische Unterscheidung des hebräischen Parallelismus.
