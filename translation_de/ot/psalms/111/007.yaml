id: PSA.111.7
reference: Psalms 111:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מַעֲשֵׂ֣י יָ֭דָי/ו אֱמֶ֣ת וּ/מִשְׁפָּ֑ט נֶ֝אֱמָנִ֗ים כָּל פִּקּוּדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/007.yaml
  text: The works of his hands are truth and justice[b][a]; all his precepts are trustworthy.
translation:
  language: de
  text: Die Werke seiner Hände sind Wahrheit und Recht[a]; alle seine Weisungen sind zuverlässig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Treue und Gerechtigkeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Alle seine Vorschriften sind verlässlich.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂי
  choice: Werke
  rationale: Das Konstruktplural bezeichnet das, was getan oder geschaffen wird. „Werke“ ist im poetischen Zusammenhang natürlich und bewahrt die formale Nähe zum Hebräischen.
- source_word: יָדָיו
  choice: seiner Hände
  rationale: Die wörtliche Wiedergabe erhält das poetische Bild der Hände als Ausdruck wirksamen Handelns.
- source_word: אֱמֶת
  choice: Wahrheit
  rationale: „Wahrheit“ wahrt das Bedeutungsfeld von Festigkeit, Verlässlichkeit und Wahrhaftigkeit, ohne die Aussage auf „Treue“ festzulegen.
- source_word: וּמִשְׁפָּט
  choice: und Recht
  rationale: מִשְׁפָּט kann Gericht, Recht oder Gerechtigkeit bezeichnen. Als Eigenschaft der Werke Gottes ist „Recht“ im Deutschen prägnant und idiomatisch.
- source_word: נֶאֱמָנִים
  choice: sind zuverlässig
  rationale: Das Prädikat bezeichnet die Beständigkeit und Verlässlichkeit der Weisungen. „Zuverlässig“ ist klar und gegenwärtig.
- source_word: כָּל
  choice: alle
  rationale: Der uneingeschränkte Universalbegriff wird unmittelbar wiedergegeben.
- source_word: פִּקּוּדָיו
  choice: seine Weisungen
  rationale: פִּקּוּדִים bezeichnet von Gott auferlegte Anordnungen oder Weisungen. „Weisungen“ ist modernes, verständliches Deutsch und bewahrt den verbindlichen Charakter besser als das heute wenig gebräuchliche „Vorschriften“ im poetischen Register.
theological_decisions:
- issue: Bedeutung von אֱמֶת als Kennzeichnung der Werke Gottes
  choice: Wahrheit
  alternative: Treue beziehungsweise Verlässlichkeit
  rationale: Die nominale Formulierung „Wahrheit und Recht“ erhält die poetische Spannung und die lexikalische Breite. Der zweite Halbvers bringt Verlässlichkeit bereits ausdrücklich mit נֶאֱמָנִים zum Ausdruck.
- issue: Wiedergabe von פִּקּוּדָיו als rechtlich verbindlicher Begriff
  choice: seine Weisungen
  alternative: seine Gebote beziehungsweise Vorschriften
  rationale: „Weisungen“ ist allgemein verständlich, bezeichnet hier jedoch nicht bloßen Rat, sondern Gottes verbindliche Anordnungen. Die Fußnote hält die engere rechtliche Wiedergabe offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener hebräischer Hand-Metapher und paralleler Satzstruktur. „Recht“ und „Weisungen“ vermeiden unnötig altertümliche Sprache, ohne den rechtlich-ethischen Gehalt einzuebnen.
