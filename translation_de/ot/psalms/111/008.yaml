translation:
  language: de
  text: Sie stehen für immer und ewig fest[a], in Treue[b] und Aufrichtigkeit gestaltet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie sind für immer und ewig gestützt«; das hebräische Partizip kann sowohl das Gestütztsein als auch das dadurch bewirkte Feststehen betonen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in Wahrheit«; das hebräische Wort kann Wahrheit, Verlässlichkeit oder Treue bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְמוּכִים
  choice: stehen fest
  rationale: Das passive Partizip von סמך bezeichnet etwas, das gestützt und dadurch gefestigt ist. »Stehen fest« gibt die dauerhafte Verlässlichkeit der Gebote im Deutschen natürlich wieder, ohne das Bild auf eine einzige Deutung festzulegen.
- source_word: לָעַד לְעוֹלָם
  choice: für immer und ewig
  rationale: Die beiden Zeitangaben verstärken einander und betonen uneingeschränkte Dauer. Die geläufige deutsche Wendung bewahrt diese emphatische Doppelung.
- source_word: עֲשׂוּיִם
  choice: geschaffen
  rationale: Das passive Partizip von עשה kann »gemacht«, »geschaffen« oder »ausgeführt« bedeuten. »Geschaffen« beschreibt hier würdig, dass Gottes Gebote in Treue und Aufrichtigkeit hervorgebracht beziehungsweise gestaltet sind, ohne eine menschliche Ausführung der Gebote nahezulegen.
- source_word: בֶּאֱמֶת
  choice: in Treue
  rationale: אֱמֶת umfasst Wahrheit, Verlässlichkeit und Treue. Im Zusammenhang mit dem beständigen Charakter der Gebote bringt »Treue« die Verlässlichkeit besonders natürlich zum Ausdruck; »Wahrheit« bleibt als echte Alternative in der Fußnote erhalten.
- source_word: וְיָשָׁר
  choice: und Aufrichtigkeit
  rationale: יָשָׁר bedeutet »gerade«, »richtig« oder »aufrichtig«. Als Parallele zu dem abstrakten »Treue« ist die substantivische Wiedergabe »Aufrichtigkeit« im Deutschen klar und idiomatisch.
