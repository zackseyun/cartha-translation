  text: הוֹד וְ/הָדָ֥ר פָּֽעֳל֑/וֹ וְ֝/צִדְקָת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/003.yaml
  text: Splendor and majesty are his work[a], and his righteousness stands forever.
translation:
  language: de
  text: 'Hoheit und Pracht sind sein Werk,

    und seine Gerechtigkeit bleibt für immer bestehen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein gerechtes Handeln hat für immer Bestand.“'
    reason: 'Lexikalische Alternative: צְדָקָה kann sowohl Gerechtigkeit als Eigenschaft als auch gerechtes Handeln bezeichnen.'
lexical_decisions:
- source_word: הוֹד
  choice: Hoheit
  rationale: הוֹד bezeichnet Hoheit, Glanz oder Herrlichkeit. „Hoheit“ wahrt im Zusammenspiel mit הָדָר den erhabenen poetischen Ton, ohne beide Begriffe gleich wiederzugeben.
- source_word: הָדָר
  choice: Pracht
  rationale: הָדָר bezeichnet prachtvolle, majestätische Schönheit. „Pracht“ bildet mit „Hoheit“ ein natürliches deutsches Wortpaar.
- source_word: פָּעֳלוֹ
  choice: sein Werk
  rationale: פֹּעַל kann Werk, Tat oder Wirken bedeuten. Der Singular „sein Werk“ entspricht der hebräischen Form und kann Gottes gesamtes Wirken zusammenfassend bezeichnen.
- source_word: צִדְקָתוֹ
  choice: seine Gerechtigkeit
  rationale: צְדָקָה umfasst Gerechtigkeit und gerechtes Handeln. „Gerechtigkeit“ bewahrt die semantische Weite des Ausdrucks im Deutschen.
- source_word: עֹמֶדֶת
  choice: bleibt … bestehen
  rationale: Das Partizip von עמד trägt das Bild des Stehens und bezeichnet hier dauernden Bestand. „Bleibt bestehen“ ist natürliches Deutsch und erhält dieses Bild.
- source_word: לָעַד
  choice: für immer
  rationale: לָעַד bezeichnet unbegrenzte Dauer; „für immer“ ist klar, modern und idiomatisch.
theological_decisions:
- issue: Bezug von הוֹד וְהָדָר zu פָּעֳלוֹ
  choice: „Hoheit und Pracht kennzeichnen sein Werk“
  alternative: „Hoheit und Pracht ist sein Werk“
  rationale: Der hebräische Nominalsatz sagt knapp „Hoheit und Pracht [ist] sein Werk“. Die gewählte Form gibt die Aussage in natürlichem Deutsch wieder, ohne Hoheit und Pracht als bloße Begleitumstände abzuschwächen.
- issue: Bedeutungsumfang von צִדְקָתוֹ
  choice: „seine Gerechtigkeit“
  alternative: „sein gerechtes Handeln“
  rationale: Der Ausdruck kann sowohl Gottes gerechte Wesensart als auch sein gerechtes Handeln bezeichnen. „Gerechtigkeit“ erhält diese theologische und poetische Spannung; die Fußnote nennt die stärker handlungsbezogene Möglichkeit.
translation_notes:
  register: Moderne, gehobene Psalmsprache mit klarer Parallelstruktur. „Hoheit und Pracht“ bewahrt die beiden eng verwandten, aber nicht identischen hebräischen Begriffe; „bleibt bestehen“ klingt natürlicher als ein wörtliches „steht“.
