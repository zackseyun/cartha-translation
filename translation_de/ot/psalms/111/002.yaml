  text: גְּ֭דֹלִים מַעֲשֵׂ֣י יְהוָ֑ה דְּ֝רוּשִׁ֗ים לְ/כָל חֶפְצֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/002.yaml
  text: Great are the works of the LORD, studied by all who delight in them.
translation:
  language: de
  text: 'Groß sind die Werke des HERRN,

    erforscht[a] von allen, die Freude an ihnen haben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: aufgesucht; das hebräische Wort kann sowohl das Suchen nach etwas als auch dessen gründliche Untersuchung bezeichnen.'
    reason: Bewahrt die Bedeutungsbreite von דְּרוּשִׁים, ohne die Hauptzeile unnötig zu belasten.
lexical_decisions:
- source_word: גְּדֹלִים
  choice: Groß
  rationale: Gibt die vorangestellte, betonte Aussage des Hebräischen knapp und würdig wieder.
- source_word: מַעֲשֵׂי יְהוָה
  choice: die Werke des HERRN
  rationale: „Werke“ entspricht dem breiten Sinn von מַעֲשִׂים; die Kapitälchenwiedergabe „HERR“ kennzeichnet den Gottesnamen JHWH in geläufiger deutscher Bibeltradition.
- source_word: דְּרוּשִׁים
  choice: erforscht
  rationale: Das passive Partizip bezeichnet die Werke als Gegenstand sorgfältigen Suchens und Untersuchens; „erforscht“ ist hier natürlich und bewahrt diesen Sinn.
- source_word: לְכָל חֶפְצֵיהֶם
  choice: von allen, die Freude an ihnen haben
  rationale: Gibt die idiomatische Bedeutung derer wieder, deren Gefallen bzw. Verlangen auf die Werke gerichtet ist; das Suffix „ihnen“ bezieht sich auf die Werke.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: „HERR“ folgt der etablierten deutschen Lesetradition und der konsultierten POB-Fassung, ohne den Gottesnamen mit dem gewöhnlichen Titel typografisch gleichzusetzen.
- issue: Bedeutung von דְּרוּשִׁים
  choice: erforscht
  alternative: gesucht / aufgesucht
  rationale: Der Kontext preist die Werke Gottes als Gegenstand aufmerksamer Betrachtung. Die mögliche Nuance des Suchens wird in der Fußnote offengehalten.
translation_notes:
  register: Moderne, klare und zugleich poetisch-würdige Standardsprache. Die zweizeilige Form folgt dem Parallelismus und der knappen Aussageweise des hebräischen Verses.
