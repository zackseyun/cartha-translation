  text: אַ֭שְׁרֵי שֹׁמְרֵ֣י מִשְׁפָּ֑ט עֹשֵׂ֖ה צְדָקָ֣ה בְ/כָל עֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/003.yaml
  text: Blessed are those who keep justice[a], who do righteousness at all times.
translation:
  language: de
  text: Glücklich sind die, die das Recht wahren und zu jeder Zeit Gerechtigkeit üben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wohl denen, die das Recht bewahren und jederzeit tun, was recht ist.“'
    reason: Lexikalische Alternativen für אַשְׁרֵי, שׁמר und צְדָקָה; die Variante macht zugleich den handlungsbezogenen Sinn von צְדָקָה ausdrücklich.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich sind
  rationale: Die hebräische Ausrufform leitet eine Seligpreisung ein. „Glücklich sind“ ist im heutigen Deutsch verständlich und bezeichnet hier nicht bloß ein Gefühl, sondern den begünstigten, beneidenswerten Stand der Genannten.
- source_word: שֹׁמְרֵי
  choice: die … wahren
  rationale: Das Partizip bezeichnet eine fortdauernde Haltung und Praxis. „Das Recht wahren“ gibt den Gedanken idiomatisch und würdevoll wieder.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: Im ethischen Zusammenhang meint das Wort die gerechte Ordnung beziehungsweise das, was recht ist. „Das Recht“ ist hier natürlicher als das abstraktere „Gerechtigkeit“ und bleibt vom folgenden צְדָקָה unterscheidbar.
- source_word: עֹשֵׂה
  choice: üben
  rationale: Das singularische Partizip hat nach der pluralischen Seligpreisung generische beziehungsweise kollektive Kraft. Die koordinierte deutsche Form wahrt den habituellen Sinn.
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: Das Wort bezeichnet rechtschaffenes, gemeinschaftsgemäßes Handeln. „Gerechtigkeit üben“ bewahrt sein ethisch-theologisches Gewicht, ohne es mit מִשְׁפָּט gleichzusetzen.
- source_word: בְּכָל עֵת
  choice: zu jeder Zeit
  rationale: Die Wendung betont beständiges Handeln. „Zu jeder Zeit“ bildet die hebräische Form natürlich und mit ihrer vollen Betonung ab.
theological_decisions:
- issue: Verhältnis von מִשְׁפָּט und צְדָקָה
  choice: Die verwandten Begriffe werden als „das Recht“ und „Gerechtigkeit“ unterschieden.
  alternative: Beide Begriffe könnten mit weitgehend derselben Gerechtigkeitssprache wiedergegeben werden.
  rationale: Die Unterscheidung erhält die poetische Parallelität und die begriffliche Spannung zwischen dem Wahren des Rechts und dem aktiven Üben von Gerechtigkeit.
- issue: Bedeutungsumfang von אַשְׁרֵי
  choice: „Glücklich sind“ als Seligpreisungsformel.
  alternative: „Wohl denen“ oder „Gesegnet sind“ wären ebenfalls möglich.
  rationale: „Glücklich sind“ ist modernes Standarddeutsch und drückt den zugesprochenen guten Stand aus; die Fußnote hält die gehobenere traditionelle Alternative offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. Die Formulierung vermeidet sowohl altertümliches „selig“ als Haupttext als auch eine rein psychologische Verengung von „glücklich“; die Fußnote dokumentiert eine traditionellere Seligpreisungsform.
