id: PSA.106.32
reference: Psalms 106:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ֭/יַּקְצִיפוּ עַל מֵ֥י מְרִיבָ֑ה וַ/יֵּ֥רַע לְ֝/מֹשֶׁ֗ה בַּ/עֲבוּרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/032.yaml
  text: They provoked anger at the waters of Meribah[b][a], and it went badly for Moses because of them.
translation:
  language: de
  text: Sie erregten Zorn am Wasser von Meriba[a], und ihretwegen erging es Mose schlecht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meriba bedeutet „Streit“ oder „Hader“.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Sie erzürnten ihn am Wasser von Meriba, und ihretwegen erging es Mose schlecht.“ Im Hebräischen wird nicht ausdrücklich gesagt, wessen Zorn sie erregten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְצִיפוּ
  choice: Sie erregten Zorn
  rationale: Die Kausativform von קצף bezeichnet das Hervorrufen von Zorn. Die Formulierung bewahrt die im Hebräischen bestehende Offenheit darüber, wessen Zorn erregt wurde.
- source_word: עַל מֵי מְרִיבָה
  choice: am Wasser von Meriba
  rationale: עַל bezeichnet hier den Ort beziehungsweise Anlass des Geschehens. מֵי ist formal Plural, wird bei Gewässerbezeichnungen im Deutschen jedoch natürlich mit dem Kollektivsingular „Wasser“ wiedergegeben; Meriba bleibt als Ortsname erhalten.
- source_word: וַיֵּרַע לְמֹשֶׁה
  choice: erging es Mose schlecht
  rationale: Die unpersönliche deutsche Wendung gibt die nachteilige Folge für Mose idiomatisch wieder, ohne רעע als moralisches Bösesein Moses misszuverstehen.
- source_word: בַּעֲבוּרָם
  choice: ihretwegen
  rationale: Die Präposition mit Suffix drückt hier aus, dass die nachteilige Folge für Mose durch sie beziehungsweise um ihretwillen eintrat.
theological_decisions:
- issue: Nicht genanntes Objekt des erregten Zorns
  choice: „Sie erregten Zorn“ ohne ausdrückliches Objekt
  alternative: „Sie erzürnten ihn“
  rationale: Der hebräische Vers nennt das Objekt nicht ausdrücklich. Die Übersetzung vermeidet daher, Gott oder Mose ohne Kennzeichnung in den Text einzusetzen.
- issue: Verhältnis zwischen der Schuld des Volkes und Moses eigener Verantwortung
  choice: Der Vers beschreibt knapp, dass es Mose ihretwegen schlecht erging
  alternative: Ausdrückliche Deutung als alleinige Schuld des Volkes oder als ausdrücklicher Hinweis auf Moses Sünde
  rationale: Die Zeile lässt offen, wie die Verantwortung im Einzelnen zu gewichten ist. Diese theologische Spannung wird nicht über den Wortlaut hinaus aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zorn erregen“ hält die syntaktische Offenheit des Hebräischen fest; „erging es Mose schlecht“ ist verständlich und vermeidet eine unnötig altertümliche oder moralisch missverständliche Wiedergabe.
