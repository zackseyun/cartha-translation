  source_fidelity: Die Übersetzung gibt die Kausativbedeutung von וַיַּקְצִיפוּ angemessen als „Sie erregten Zorn“ wieder und lässt, wie der hebräische Text, das Objekt des Zorns ungenannt. „am Wasser von Meriba“ ist als idiomatische Kollektivsingular-Wiedergabe von מֵי מְרִיבָה vertretbar. „ihretwegen erging es Mose schlecht“ gibt die unpersönliche adverse Aussage וַיֵּרַע לְמֹשֶׁה sowie die kausale Angabe בַּעֲבוּרָם treffend wieder, ohne die im Vers nicht aufgelöste Verantwortungsfrage auszudeuten.
