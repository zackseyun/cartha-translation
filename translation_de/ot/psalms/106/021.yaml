id: PSA.106.21
reference: Psalms 106:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שָׁ֭כְחוּ אֵ֣ל מוֹשִׁיעָ֑/ם עֹשֶׂ֖ה גְדֹל֣וֹת בְּ/מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/021.yaml
  text: They forgot God their Savior[a], who had done great things in Egypt.
translation:
  language: de
  text: Sie vergaßen Gott, ihren Retter[a], der in Ägypten Großes getan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihren Befreier“. Das hebräische Partizip kann Gott als den bezeichnen, der sie rettet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכְחוּ
  choice: sie vergaßen
  rationale: Das Qal Perfekt 3. Person Plural bezeichnet in der geschichtlichen Rückschau eine abgeschlossene Handlung; das deutsche Präteritum passt zum erzählenden Zusammenhang.
- source_word: אֵל
  choice: Gott
  rationale: אֵל kann Macht hervorheben, dient hier jedoch als Bezeichnung für Israels Gott. „Gott“ ist im Deutschen natürlich und fügt keine zusätzliche Betonung ein.
- source_word: מוֹשִׁיעָם
  choice: ihren Retter
  rationale: Das Hifil-Partizip von ישׁע mit Suffix der 3. Person maskulin Plural bezeichnet Gott als den, der sie rettet. „Ihren Retter“ ist knapp, idiomatisch und bewahrt diese charakteristische Rolle.
- source_word: עֹשֶׂה
  choice: der … getan hatte
  rationale: Das Qal-Partizip bestimmt „Gott, ihren Retter“ näher. Ein Relativsatz ist im Deutschen natürlich; das Plusquamperfekt macht deutlich, dass Gottes große Taten dem Vergessen vorausgingen.
- source_word: גְדֹלוֹת
  choice: Großes
  rationale: Das substantivierte feminine Pluraladjektiv bezeichnet große oder mächtige Taten. „Großes“ gibt die offene Ausdrucksweise des Hebräischen natürlich wieder.
- source_word: בְּמִצְרָיִם
  choice: in Ägypten
  rationale: Die Präposition בְּ bezeichnet hier den Ort der großen Taten Gottes.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung אֵל
  choice: Gott
  alternative: der Mächtige / mächtiger Gott
  rationale: Im unmittelbaren Zusammenhang identifiziert אֵל den Gott, den Israel vergaß. Eine ausdrückliche Hervorhebung seiner Macht wäre möglich, ist hier aber nicht zwingend und würde den Titel stärker auslegen.
- issue: Wiedergabe von מוֹשִׁיעָם als Rollenbezeichnung
  choice: ihren Retter
  alternative: den, der sie rettete / ihren Befreier
  rationale: „Retter“ erhält den personalen und charakteristischen Sinn des Partizips, ohne die Rettung auf eine einzige Art der Befreiung einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung folgt natürlichem Deutsch; „Großes“ bewahrt die knappe und umfassende Formulierung des Hebräischen.
