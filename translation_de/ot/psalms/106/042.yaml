source:
  edition: WLC
  text: וַ/יִּלְחָצ֥וּ/ם אוֹיְבֵי/הֶ֑ם וַ֝/יִּכָּנְע֗וּ תַּ֣חַת יָדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/042.yaml
  text: Their enemies oppressed them[a], and they were subdued under their hand.
translation:
  language: de
  text: Ihre Feinde bedrängten sie, und sie wurden ihrer Herrschaft unterworfen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »unter ihrer Hand«; das heißt, unter ihrer Macht oder Gewalt.'
    reason: Das hebräische Bild der Hand bezeichnet hier den Macht- und Herrschaftsbereich der Feinde.
lexical_decisions:
- source_word: וַיִּלְחָצוּם
  choice: bedrängten sie
  rationale: Das Qal von לחץ mit Objektsuffix bezeichnet hier feindlichen Druck beziehungsweise Unterdrückung. »Bedrängten sie« gibt dies natürlich und im Zusammenhang angemessen wieder.
- source_word: אֹיְבֵיהֶם
  choice: ihre Feinde
  rationale: Die übliche und kontextuell eindeutige Wiedergabe von אֹיֵב mit dem Suffix der 3. Person Plural.
- source_word: וַיִּכָּנְעוּ
  choice: sie wurden … unterworfen
  rationale: Das Nifal von כנע beschreibt, dass sie bezwungen und in Unterordnung gebracht wurden. Die passive Form des Hebräischen bleibt erhalten.
- source_word: תַּחַת יָדָם
  choice: ihrer Herrschaft
  rationale: Wörtlich »unter ihrer Hand«; die Hand bezeichnet idiomatisch Macht, Gewalt oder Herrschaft. »Ihrer Herrschaft unterworfen« überträgt den Sinn in natürliches modernes Deutsch, während die Fußnote das hebräische Bild bewahrt.
theological_decisions: []
