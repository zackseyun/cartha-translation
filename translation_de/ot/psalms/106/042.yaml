  register: Modernes, würdevolles Standarddeutsch. Die feindliche Bedrängnis und die passive Unterwerfung bleiben deutlich; die idiomatische Wendung »unter ihrer Hand« wird im Haupttext verständlich wiedergegeben und in der Fußnote wörtlich ausgewiesen.
