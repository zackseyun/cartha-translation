source:
  edition: WLC
  text: אֲב֘וֹתֵ֤י/נוּ בְ/מִצְרַ֨יִם לֹא הִשְׂכִּ֬ילוּ נִפְלְאוֹתֶ֗י/ךָ לֹ֣א זָ֭כְרוּ אֶת רֹ֣ב חֲסָדֶ֑י/ךָ וַ/יַּמְר֖וּ עַל יָ֣ם בְּ/יַם סֽוּף׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/007.yaml
  text: Our fathers in Egypt did not understand your wondrous deeds[a]; they did not remember the abundance of your steadfast love[b], but rebelled at the sea—the Red Sea.
translation:
  language: de
  text: Unsere Väter in Ägypten begriffen deine Wundertaten nicht; sie erinnerten sich nicht an die Fülle deiner treuen Liebe, sondern lehnten sich am Meer auf, am Schilfmeer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „am Roten Meer“. Der hebräische Name lautet Jam Suf und kann als „Schilfmeer“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבוֹתֵינוּ
  choice: Unsere Väter
  rationale: Gibt die maskuline Verwandtschaftsbezeichnung wörtlich wieder; im Zusammenhang bezeichnet sie die früheren Generationen Israels.
- source_word: הִשְׂכִּילוּ
  choice: begriffen … nicht
  rationale: Der Hifil von שׂכל bezeichnet hier das einsichtsvolle Erfassen der Bedeutung von Gottes Handeln; „begriffen“ ist natürlich und prägnant.
- source_word: נִפְלְאוֹתֶיךָ
  choice: deine Wundertaten
  rationale: Bezeichnet außergewöhnliche, Staunen hervorrufende Taten und nicht bloß abstrakte Wunder.
- source_word: רֹב חֲסָדֶיךָ
  choice: die Fülle deiner treuen Liebe
  rationale: רֹב bezeichnet Fülle oder große Menge; חֶסֶד umfasst beständige, loyale und gnädige Zuwendung. „Treue Liebe“ bewahrt diese Breite in verständlichem Deutsch.
- source_word: וַיַּמְרוּ
  choice: sondern lehnten sich … auf
  rationale: מרה bezeichnet Widersetzlichkeit oder Auflehnung. „Sondern“ verdeutlicht den kontextuellen Gegensatz, ohne das Verb theologisch näher zu bestimmen.
- source_word: עַל־יָם בְּיַם־סוּף
  choice: am Meer … am Schilfmeer
  rationale: Die beiden Ortsangaben stehen erläuternd und nachdrücklich nebeneinander. „Schilfmeer“ folgt der lexikalischen Bedeutung von סוּף; die traditionelle Bezeichnung wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von חֶסֶד
  choice: treue Liebe
  alternative: Gnade; Güte; beständige Liebe
  rationale: „Treue Liebe“ lässt sowohl die liebevolle Zuwendung als auch deren loyale Beständigkeit erkennen, ohne den Ausdruck ausschließlich auf einen einzelnen theologischen Aspekt zu verengen.
- issue: Ortsname יַם־סוּף
  choice: Schilfmeer
  alternative: Rotes Meer
  rationale: Die Hauptübersetzung folgt der hebräischen Benennung und bewahrt die traditionelle, weithin bekannte Wiedergabe in einer Fußnote.
- issue: Bezug der Auflehnung
  choice: Das Objekt bleibt unausgesprochen
  alternative: „lehnten sich gegen dich auf“
  rationale: Auch im Hebräischen wird das Ziel der Auflehnung nicht ausdrücklich genannt. Der Zusammenhang legt Gott nahe, doch die Übersetzung ergänzt dies nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen negativen Aussagen und die nachdrückliche doppelte Ortsangabe des Hebräischen bleiben erhalten; das Semikolon macht den Gedankengang gut lesbar.
