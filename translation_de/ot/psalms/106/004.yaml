lexical_decisions:
- source_word: זָכְרֵנִי
  choice: Denk an mich
  rationale: Der Qal-Imperativ mit Suffix der 1. Person Singular ist eine unmittelbare Bitte. „Denk an mich“ gibt sie natürlich und ohne interpretierenden Zusatz wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: בִּרְצוֹן עַמֶּךָ
  choice: wenn du deinem Volk deine Gunst erweist
  rationale: רָצוֹן bezeichnet Gunst oder Wohlwollen. Die Präposition ב wird hier zeitlich-begleitend verstanden; die Formulierung macht zugleich deutlich, dass die Gunst von Gott seinem Volk gilt.
- source_word: פָּקְדֵנִי
  choice: kümmere dich um mich
  rationale: פקד kann in einem Bittgebet Gottes zugewandtes Aufsuchen, Beachten und Eingreifen bezeichnen. „Kümmere dich um mich“ vermittelt diese positive Zuwendung im heutigen Deutsch.
- source_word: בִּישׁוּעָתֶךָ
  choice: mit deiner Rettung
  rationale: יְשׁוּעָה bezeichnet Rettung oder Heil. „Mit deiner Rettung“ bewahrt sowohl das Substantiv als auch die Präposition und lässt den Umfang des rettenden Handelns offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; die Transliteration bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Sinn von בִּרְצוֹן עַמֶּךָ
  choice: 'zeitlich-begleitend: „wenn du deinem Volk deine Gunst erweist“'
  alternative: 'assoziativ: „mit der Gunst für dein Volk“'
  rationale: Die knappe hebräische Verbindung erlaubt mehrere Nuancen. Im Gebetszusammenhang ist die Bitte wahrscheinlich darauf gerichtet, beim gnädigen Handeln Gottes an seinem Volk einbezogen zu werden; die alternative Konstruktion bleibt in der Fußnote sichtbar.
- issue: Nuance von פָּקְדֵנִי
  choice: „kümmere dich um mich“
  alternative: „suche mich auf“
  rationale: Das Verb kann mehr als einen bloßen Besuch meinen, nämlich aufmerksame und wirksame Zuwendung. Die gewählte Formulierung drückt dies idiomatisch aus, ohne die konkretere Alternative zu verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der beiden Bitten bleibt erhalten; „Rettung“ bewahrt die konkrete wie auch die umfassendere theologische Bedeutung von יְשׁוּעָה.
