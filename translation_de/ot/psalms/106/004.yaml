  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder. „Gunst“ und „Rettung“ sind sachgerecht und im Psalmregister natürlich. Die Fußnoten sollen die möglichen, nicht in den Haupttext übernommenen Lesarten idiomatisch formulieren.
