  yaml_path: translation/ot/psalms/106/004.yaml
  text: Remember me[a], O Yahweh, when you show favor to your people[b]; attend to me with your salvation.
translation:
  language: de
  text: Denk an mich, Jahwe, wenn du deinem Volk deine Gunst erweist[a]; wende dich mir mit deiner Rettung zu[b].
  philosophy: optimal-equivalence
  footnotes:
