source:
  edition: WLC
  text: וַ/יִּֽשְׁפְּכ֨וּ דָ֪ם נָקִ֡י דַּם בְּנֵ֘י/הֶ֤ם וּֽ/בְנוֹתֵי/הֶ֗ם אֲשֶׁ֣ר זִ֭בְּחוּ לַ/עֲצַבֵּ֣י כְנָ֑עַן וַ/תֶּחֱנַ֥ף הָ֝/אָ֗רֶץ בַּ/דָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/038.yaml
  text: They poured out innocent blood—the blood of their sons and daughters[c][b][a], whom they sacrificed to the idols of Canaan—and the land was polluted with blood.
translation:
  language: de
  text: Sie vergossen unschuldiges Blut – das Blut ihrer Söhne und Töchter, die sie den Götzen Kanaans opferten – und das Land wurde durch Blutvergießen verunreinigt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und das Land wurde durch Blutschuld entweiht“. Das hebräische Wort steht im Plural („Blute“) und kann Blutvergießen oder Blutschuld bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפְּכוּ
  choice: sie vergossen
  rationale: שׁפך bedeutet wörtlich „ausgießen“, ist bei Blut aber idiomatisch mit „Blut vergießen“ wiederzugeben. So bleiben Bildhaftigkeit und Tötungsbezug erhalten.
- source_word: דָם נָקִי
  choice: unschuldiges Blut
  rationale: Die feste hebräische Verbindung bezeichnet Blut, das zu Unrecht vergossen wurde, und bewahrt das ausdrückliche moralische Urteil des Textes.
- source_word: דַּם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: das Blut ihrer Söhne und Töchter
  rationale: Die appositionelle Wiederholung von דם erläutert, wessen unschuldiges Blut gemeint ist.
- source_word: אֲשֶׁר זִבְּחוּ
  choice: die sie ... opferten
  rationale: זבח bezeichnet hier im kultischen Zusammenhang das Darbringen als Opfer; das Relativpronomen bezieht sich auf die Söhne und Töchter.
- source_word: לַעֲצַבֵּי כְנָעַן
  choice: den Götzen Kanaans
  rationale: עֲצַבִּים bezeichnet polemisch religiöse Götzenbilder. „Götzen Kanaans“ ist knapp, natürlich und bewahrt den abwertenden Sinn.
- source_word: וַתֶּחֱנַף הָאָרֶץ
  choice: das Land wurde ... entweiht
  rationale: חנף beschreibt hier die moralisch-kultische Verunreinigung des Landes. „Entweiht“ macht diese religiöse Dimension deutlicher als das heute oft ökologisch verstandene „verschmutzt“.
- source_word: בַּדָּמִים
  choice: durch Blutschuld
  rationale: Der Plural דמים kann Blutvergießen oder die daraus erwachsende Blutschuld bezeichnen. Im Zusammenhang mit der Entweihung des Landes gibt „Blutschuld“ den moralisch-kultischen Gehalt prägnant wieder; die Alternative wird in der Fußnote offengehalten.
theological_decisions:
- issue: Moralischer Status der beim Kinderopfer Getöteten
  choice: Die Tötungen werden ausdrücklich als Vergießen unschuldigen Blutes bezeichnet.
  alternative: das Blut Unschuldiger
  rationale: „Unschuldiges Blut“ gibt דָם נָקִי unmittelbar wieder und fügt der moralischen Verurteilung des hebräischen Textes keine weitergehende Lehraussage hinzu.
- issue: Art der Entweihung des Landes
  choice: Das Land wird durch Blutschuld entweiht.
  alternative: Das Land wurde durch Blutvergießen verunreinigt.
  rationale: חנף und der Plural דמים verbinden Gewalttat, Schuld und kultisch-moralische Verunreinigung. Die Hauptfassung bringt diesen Zusammenhang zur Geltung, während die Fußnote die lexikalische Mehrdeutigkeit wahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Blut vergießen“ ist eine geläufige, leicht gehobene Wendung; „entweiht“ bewahrt die kultisch-moralische Dimension. Gedankenstriche bilden die erläuternde Wiederaufnahme von „Blut“ übersichtlich ab.
