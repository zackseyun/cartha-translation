  yaml_path: translation/ot/psalms/106/044.yaml
  text: Yet he saw their distress when he heard their cry,[a]
translation:
  language: de
  text: Doch er sah ihre Not, als er ihr Schreien hörte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und er sah die Not, die sie bedrängte, als er ihr Schreien hörte.“'
    reason: Lexikalisch-syntaktische Alternative für וַיַּרְא בַּצַּר לָהֶם; sie gibt לָהֶם formnäher als die sie betreffende bzw. bedrängende Not wieder und bewahrt die einfache verbindende Bedeutung des Waw, ohne einen im Hebräischen nicht ausgedrückten Eintrittsvorgang hinzuzufügen.
lexical_decisions:
- source_word: וַיַּרְא
  choice: er sah
  rationale: ראה bedeutet hier unmittelbar „sehen“, schließt im Zusammenhang aber ein aufmerksames Wahrnehmen ein. „Er sah“ bewahrt die hebräische Ausdrucksweise.
- source_word: בַּצַּר לָהֶם
  choice: ihre Not
  rationale: צַר bezeichnet Bedrängnis oder Not; לָהֶם lässt sich im natürlichen Deutschen possessiv wiedergeben. Die alternative, formnähere Konstruktion wird in der Fußnote bewahrt.
- source_word: בְּשָׁמְעוֹ
  choice: als er … hörte
  rationale: ב mit dem Infinitivus constructus bildet hier einen temporalen Nebensatz. „Als er … hörte“ ist idiomatisch und wahrt den Erzählzusammenhang.
- source_word: רִנָּתָם
  choice: ihr Schreien
  rationale: רִנָּה kann einen lauten Ruf bezeichnen; in diesem Notkontext ist „Schreien“ natürlich und vermeidet die sonst mögliche freudige Bedeutung von „Jubelruf“.
- source_word: וַ
  choice: Doch
  rationale: Das Waw trägt im Kontext nach Israels Auflehnung und Bedrängnis eine adversative Nuance. „Doch“ macht den Kontrast knapp sichtbar, ohne zusätzlichen Inhalt einzutragen.
theological_decisions:
- issue: Aussagekraft der eröffnenden Konjunktion im Übergang von Gericht zu Erbarmen
  choice: Adversative Wiedergabe mit „Doch“
  alternative: Schlichte Verknüpfung mit „Und“ oder zeitliche Folge mit „Da“
  rationale: Das hebräische Waw ist formal offen, doch der Zusammenhang hebt Gottes gnädiges Wahrnehmen trotz der vorausgehenden Auflehnung hervor. „Doch“ bewahrt diese Spannung zwischen Gericht und Erbarmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Not“ und „Schreien“ sind allgemein verständlich und tragen den Klagekontext; die Fußnote erhält die genuine syntaktische und diskursive Mehrdeutigkeit.
