source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֣ף יְהוָ֣ה בְּ/עַמּ֑/וֹ וַ֝/יְתָעֵ֗ב אֶת נַחֲלָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/040.yaml
  text: So Yahweh’s anger burned against his people[b][a], and he abhorred his inheritance.
translation:
  language: de
  text: Da entbrannte Jahwes Zorn gegen sein Volk, und er verabscheute sein Erbteil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: Da entbrannte … Zorn
  rationale: Die hebräische Wendung verbindet חרה mit אַף und beschreibt den Zorn bildhaft als heiß oder entbrannt. Die deutsche Formulierung bewahrt dieses Bild in würdiger, geläufiger Sprache.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: בְּעַמּוֹ
  choice: gegen sein Volk
  rationale: Die Präposition בְּ bezeichnet bei einem Ausdruck des Zorns dessen Ziel; „gegen“ gibt diese Beziehung im Deutschen natürlich wieder.
- source_word: וַיְתָעֵב
  choice: er verabscheute
  rationale: תעב bezeichnet starke Abscheu. „Verabscheute“ erhält die Intensität, ohne die Aussage abzuschwächen oder näher auszudeuten.
- source_word: נַחֲלָתוֹ
  choice: sein Erbteil
  rationale: נַחֲלָה bezeichnet Erbe, Erbteil oder zugewiesenen Besitz. „Erbteil“ bewahrt hier die prägnante Bundes- und Besitzmetaphorik für Israel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt den Charakter eines Eigennamens, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bildhafte Rede vom göttlichen Zorn
  choice: Jahwes Zorn entbrannte
  alternative: Jahwe wurde zornig
  rationale: Die Übersetzung erhält die hebräische Hitze-Metapher und damit die anthropopathische Aussage des Psalms, ohne sie dogmatisch aufzulösen.
- issue: Bezeichnung Israels als Gottes נַחֲלָה
  choice: sein Erbteil
  alternative: sein Besitz
  rationale: „Erbteil“ wahrt das spannungsreiche Bild, dass das Volk Jahwe als besonderer Anteil zugehört, obwohl er es hier verabscheut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Die starken Verben und die Bundesmetaphorik des Hebräischen bleiben erhalten; unnötig archaische Formen werden vermieden.
