id: PSA.106.19
reference: Psalms 106:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יַעֲשׂוּ עֵ֥גֶל בְּ/חֹרֵ֑ב וַ֝/יִּשְׁתַּחֲו֗וּ לְ/מַסֵּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/019.yaml
  text: They made a calf at Horeb and bowed down to a cast image[a][b].
translation:
  language: de
  text: Sie machten am Horeb ein Kalb und warfen sich vor einem gegossenen Bild nieder.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor einem Gussbild“. Das hebräische Wort bezeichnet ein durch Gießen hergestelltes Bild, gewöhnlich aus Metall.'
    reason: lexical_alternative
  - marker: b
    text: Dies erinnert an das am Horeb beziehungsweise Sinai angefertigte Kalb in 2. Mose 32.
    reason: cross_reference
lexical_decisions:
- source_word: יַעֲשׂוּ
  choice: Sie machten
  rationale: Das Qal von עשה bedeutet gewöhnlich „machen“; die schlichte Wiedergabe wahrt die Neutralität des hebräischen Verbs.
- source_word: עֵגֶל
  choice: ein Kalb
  rationale: עֵגֶל bezeichnet ein Kalb beziehungsweise ein junges Rind. „Kalb“ erhält den Bezug zur Erzählung in Exodus 32, ohne das hier nicht genannte Material Gold hinzuzufügen.
- source_word: בְּחֹרֵב
  choice: am Horeb
  rationale: Die Präposition ב bezeichnet hier den Ort; „am Horeb“ ist im Deutschen idiomatisch und entspricht dem Schauplatz.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: und warfen sich … nieder
  rationale: Die Form von שחה bezeichnet das Sich-Niederwerfen als Huldigung oder Anbetung. Die Wiedergabe bewahrt die körperliche Handlung und lässt den kultischen Sinn aus dem Zusammenhang hervorgehen.
- source_word: לְמַסֵּכָה
  choice: vor einem gegossenen Bild
  rationale: מַסֵּכָה bezeichnet ein durch Gießen hergestelltes Bild, meist aus Metall. „gegossenes Bild“ erhält diese konkrete Herstellungsnuance; „vor“ ist bei „sich niederwerfen“ natürliches Deutsch.
theological_decisions:
- issue: Ob das Kalb ausdrücklich als golden bezeichnet werden soll
  choice: Nur „ein Kalb“, ohne „golden“
  alternative: ein goldenes Kalb
  rationale: Exodus 32 nennt Gold als Material, doch dieser Vers selbst sagt lediglich „Kalb“ und „gegossenes Bild“. Die Übersetzung fügt daher keine Information aus dem weiteren Zusammenhang in den Haupttext ein.
- issue: Ob וַיִּשְׁתַּחֲווּ direkt mit „beteten an“ wiederzugeben ist
  choice: „warfen sich … nieder“
  alternative: „beteten … an“
  rationale: Die gewählte Formulierung bewahrt die im Verb bezeichnete körperliche Gebärde, ohne ihren hier klaren kultischen Sinn auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sich vor … niederwerfen“ ist anschaulich und natürlich; „gegossenes Bild“ bewahrt die konkrete Bedeutung des hebräischen Substantivs. Die Fußnotenmarker stehen vollständig im Haupttext.
