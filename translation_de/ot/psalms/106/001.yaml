source:
  edition: WLC
  text: הַֽלְלוּ יָ֨הּ הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/001.yaml
  text: Praise Yah! Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: de
  text: Preist Jah! Dankt Jahwe, denn er ist gut, denn seine beständige Liebe währt ewig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Preist
  rationale: Der Pluralimperativ von הלל ruft die versammelte Gemeinschaft zum Lob auf; „Preist“ gibt Form und Funktion knapp wieder.
- source_word: יָהּ
  choice: Jah
  rationale: Die poetische Kurzform des Gottesnamens wird als „Jah“ bewahrt und von der Vollform יהוה unterschieden.
- source_word: הוֹד֣וּ
  choice: Dankt
  rationale: Der Hifil-Imperativ von ידה bezeichnet im Psalmkontext den dankenden Lobpreis; „Dankt“ ist natürlich und prägnant.
- source_word: לַ/יהוָ֣ה
  choice: Jahwe
  rationale: Die Präposition ל bezeichnet den Adressaten des Dankes; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: כִּי טוֹב
  choice: denn er ist gut
  rationale: כִּי begründet die Aufforderung; beim prädikativen טוֹב ist Jahwe als Subjekt mitzudenken und wird im Deutschen ausdrücklich genannt.
- source_word: כִּי לְ/עוֹלָם חַסְדּ/וֹ
  choice: denn seine beständige Liebe bleibt für immer
  rationale: Die Wiederholung von כִּי bleibt erhalten. חסד bezeichnet verlässliche, loyale Liebe; „bleibt für immer“ ergänzt idiomatisch das im Hebräischen nominal formulierte לְעוֹלָם.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Namensform wird im Haupttext transparent wiedergegeben, ohne sie durch einen Titel zu ersetzen.
- issue: Wiedergabe der Kurzform יָהּ
  choice: Jah
  alternative: Halleluja / der HERR
  rationale: „Jah“ bewahrt die Kurzform des Gottesnamens und macht zugleich die Bedeutung des liturgischen Ausdrucks הַלְלוּ־יָהּ verständlich.
- issue: Bedeutungsumfang von חסד
  choice: beständige Liebe
  alternative: Güte / Gnade / Bundestreue
  rationale: „Beständige Liebe“ verbindet Zuwendung und Verlässlichkeit, ohne den Ausdruck ausschließlich auf einen einzelnen theologischen Aspekt festzulegen.
translation_notes:
  register: Moderner, würdiger Psalmstil mit parallelen Aufforderungs- und Begründungssätzen. Die Gottesnamen werden in unterscheidbarer Form als „Jah“ und „Jahwe“ wiedergegeben.
