  text: תִּפְתַּח אֶ֭רֶץ וַ/תִּבְלַ֣ע דָּתָ֑ן וַ֝/תְּכַ֗ס עַל עֲדַ֥ת אֲבִירָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/017.yaml
  text: The earth opened and swallowed Dathan[c][b][a], and covered the company of Abiram.
translation:
  language: de
  text: Die Erde öffnete sich und verschlang Datan[a][c]; sie bedeckte die Gemeinschaft Abirams[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „spaltete sich“. Das hebräische Verb bedeutet wörtlich „öffnen“; angesichts des Geschehens in 4. Mose 16 ist auch die anschaulichere Wiedergabe möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Versammlung Abirams“ beziehungsweise „die Gemeinde Abirams“.'
    reason: lexical_alternative
  - marker: c
    text: Zum erzählerischen Hintergrund dieses Gerichts siehe 4. Mose 16,31–33.
    reason: cross_reference
lexical_decisions:
- source_word: תִּפְתַּח
  choice: öffnete sich
  rationale: Qal Imperfekt 3. Person feminin Singular von פתח mit אֶרֶץ als Subjekt; im poetischen Rückblick bezeichnet die Form ein vergangenes Ereignis. Das reflexive deutsche „öffnete sich“ gibt den natürlichen Vorgang wieder.
- source_word: אֶרֶץ
  choice: die Erde
  rationale: Gemeint ist die Erde beziehungsweise der Erdboden, der sich unter den Aufständischen öffnet, nicht ein Territorium.
- source_word: וַתִּבְלַע
  choice: und verschlang
  rationale: Die Wayyiqtol-Form von בלע führt die vergangene Handlung fort. „Verschlang“ ist knapp, anschaulich und in diesem poetischen Kontext natürlich.
- source_word: דָּתָן
  choice: Datan
  rationale: Wiedergabe des Personennamens nach geläufiger deutscher Bibelnamenkonvention.
- source_word: וַתְּכַס עַל
  choice: sie bedeckte
  rationale: כסה mit עַל bezeichnet hier das Bedecken der genannten Gruppe. Im Deutschen ist „bedeckte“ ohne zusätzliche Präposition natürlich; das feminine Subjekt „sie“ verweist weiterhin auf die Erde.
- source_word: עֲדַת
  choice: die Gemeinschaft
  rationale: Die Konstruktform von עֵדָה bezeichnet eine zusammengehörige Gruppe. „Gemeinschaft“ ist verständlich und vermeidet den möglicherweise kirchlich verengten Klang von „Gemeinde“.
- source_word: אֲבִירָם
  choice: Abiram
  rationale: Wiedergabe des Personennamens nach geläufiger deutscher Bibelnamenkonvention.
theological_decisions:
- issue: Verhältnis zur ausführlicheren Erzählung in 4. Mose 16
  choice: Der Vers wird als knappe poetische Zusammenfassung des Gerichts übersetzt.
  alternative: Ergänzung von Korach, den Familien oder weiteren Einzelheiten aus 4. Mose 16.
  rationale: Der hebräische Psalmvers nennt Datan und die Gemeinschaft Abirams. Einzelheiten aus dem erzählerischen Hintergrund dürfen nicht in den eigentlichen Text eingefügt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Die Personennamen folgen der im Deutschen geläufigen biblischen Form. Das wiederaufgenommene Pronomen „sie“ verdeutlicht ohne inhaltliche Ergänzung, dass weiterhin die Erde handelt.
