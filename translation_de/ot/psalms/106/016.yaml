  text: וַ/יְקַנְא֣וּ לְ֭/מֹשֶׁה בַּֽ/מַּחֲנֶ֑ה לְ֝/אַהֲרֹ֗ן קְד֣וֹשׁ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/016.yaml
  text: They became jealous of Moses in the camp[a], and of Aaron, the holy one of Yahweh.
translation:
  language: de
  text: Im Lager wurden sie eifersüchtig auf Mose und auf Aaron, den Heiligen Jahwes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aaron, der Jahwe heilig war.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ
  choice: wurden sie eifersüchtig
  rationale: קנא bezeichnet hier neidische Eifersucht gegenüber Mose und Aaron. „Wurden … eifersüchtig“ gibt den einsetzenden Charakter der Verbform wieder und klingt im Deutschen natürlich.
- source_word: לְמֹשֶׁה … לְאַהֲרֹן
  choice: auf Mose und auf Aaron
  rationale: Die Präposition ל markiert bei קנא die Personen, gegen die sich die Eifersucht richtet; idiomatisches Deutsch verlangt „eifersüchtig auf“.
- source_word: בַּמַּחֲנֶה
  choice: im Lager
  rationale: מַחֲנֶה bezeichnet das Lager Israels in der Wüste; „im Lager“ ist direkt und idiomatisch.
- source_word: קְדוֹשׁ יְהוָה
  choice: den Heiligen Jahwes
  rationale: Die appositionale Bezeichnung stellt Aaron als den Jahwe geweihten Heiligen heraus. Die knappe Form bewahrt die Struktur und lässt die mögliche Nuance „Jahwe heilig“ in einer Fußnote sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname „Jahwe“ wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
theological_decisions:
- issue: Bedeutung von קְדוֹשׁ יְהוָה als Bezeichnung Aarons
  choice: Aaron wird „der Heilige Jahwes“ genannt.
  alternative: Aaron war „Jahwe heilig“, das heißt ihm geweiht.
  rationale: Die Hauptfassung bewahrt die knappe appositionale Bezeichnung des Hebräischen; die Alternative macht die Weihebeziehung ausdrücklich, ohne sie konfessionell weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung „Im Lager“ erhält den poetischen Akzent des Ortsausdrucks; „Mose“ folgt der heute üblichen deutschen Namensform.
