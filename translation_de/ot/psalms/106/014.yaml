source:
  edition: WLC
  text: וַ/יִּתְאַוּ֣וּ תַ֭אֲוָה בַּ/מִּדְבָּ֑ר וַ/יְנַסּוּ אֵ֝֗ל בִּֽ/ישִׁימֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/014.yaml
  text: But they craved intensely in the wilderness[b][a], and tested God in the wasteland.
translation:
  language: de
  text: Doch in der Wüste begehrten sie gierig[a] und stellten Gott im Ödland auf die Probe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »begehrten sie ein Begehren«; das Hebräische verstärkt das Begehren durch ein Verb und ein stammverwandtes Substantiv.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוּוּ תַאֲוָה
  choice: verlangten sie voller Gier
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv ist eine verstärkende figura etymologica, wörtlich etwa »sie verlangten ein Verlangen«. »Voller Gier verlangen« gibt die Intensität und das ungeordnete Begehren natürlich wieder, ohne eine ausschließlich sexuelle Bedeutung nahezulegen.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet unbesiedeltes Wüsten- oder Wildnisgebiet. »Wüste« ist im Zusammenhang mit Israels Wüstenwanderung klar und idiomatisch.
- source_word: וַיְנַסּוּ
  choice: stellten … auf die Probe
  rationale: נסה bedeutet hier, jemanden zu prüfen oder herauszufordern. Die feste deutsche Wendung bewahrt den provozierenden Sinn des Handelns.
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier die übliche Gottesbezeichnung; »Gott« ist die klare, kontextgemäße Wiedergabe.
- source_word: בִּישִׁימוֹן
  choice: im Ödland
  rationale: יְשִׁימוֹן bezeichnet eine öde, unfruchtbare Gegend. »Ödland« wahrt die Nuance und unterscheidet das Wort von מִדְבָּר.
theological_decisions:
- issue: Wiedergabe der verstärkenden Verbindung וַיִּתְאַוּוּ תַאֲוָה
  choice: idiomatisch als »verlangten sie voller Gier«
  alternative: wörtlich »verlangten sie ein Verlangen« oder neutraler »hatten sie heftiges Verlangen«
  rationale: Die idiomatische Form erhält sowohl die Verstärkung als auch den im Kontext negativen Charakter des Begehrens, ohne die Konstruktion unnatürlich nachzubilden oder sie auf sexuelles Begehren einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus zwischen »Wüste« und »Ödland« bleibt durch zwei unterschiedliche, bedeutungsverwandte Begriffe erhalten; »auf die Probe stellen« klingt natürlich und bewahrt den negativen Kontext.
