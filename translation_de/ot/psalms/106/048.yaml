id: PSA.106.48
reference: Psalms 106:48
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בָּר֤וּךְ יְהוָ֨ה אֱלֹהֵ֪י יִשְׂרָאֵ֡ל מִן הָ֤/עוֹלָ֨ם וְ/עַ֬ד הָ/עוֹלָ֗ם וְ/אָמַ֖ר כָּל הָ/עָ֥ם אָמֵ֗ן הַֽלְלוּ יָֽהּ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/048.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. And let all the people say[b], “Amen!” Praise Yah!
translation:
  language: de
  text: 'Gepriesen sei Jahwe, der Gott Israels, von Ewigkeit zu Ewigkeit![a] Und das ganze Volk sage: »Amen!« Preist Jah![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »von Weltzeit zu Weltzeit« oder »von Zeitalter zu Zeitalter«.'
    reason: lexical_alternative
  - marker: b
    text: '»Preist Jah« entspricht dem hebräischen Hallelu-Jah, traditionell: »Halleluja«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Die passive Segensformel wird im Deutschen doxologisch und zugleich natürlich mit »Gepriesen sei« wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet in schlichter, natürlicher Form Israels Gott.
- source_word: מִן הָעוֹלָם וְעַד הָעוֹלָם
  choice: von Ewigkeit zu Ewigkeit
  rationale: Die traditionelle deutsche Wendung bewahrt die zeitliche Weite der doxologischen Formel, ohne sie auf eine einzelne begrenzte Epoche festzulegen.
- source_word: וְאָמַר כָּל הָעָם
  choice: Und das ganze Volk sage
  rationale: Obwohl אָמַר formal eine Perfektform ist, liegt in der liturgischen Schlussformel am ehesten eine Aufforderung an die versammelte Gemeinschaft vor; der deutsche Konjunktiv gibt diesen responsorischen Charakter knapp wieder.
- source_word: אָמֵן
  choice: Amen
  rationale: Die im Deutschen etablierte liturgische Lautform erhält die gemeinschaftliche Bekräftigung.
- source_word: הַלְלוּ יָהּ
  choice: Preist Jah
  rationale: Der Imperativ im Plural und die Kurzform des Gottesnamens werden semantisch transparent wiedergegeben; so bleibt der Unterschied zwischen יְהוָה und יָהּ sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה und seiner Kurzform יָהּ im selben Vers
  choice: יְהוָה als »Jahwe« und יָהּ als »Jah«
  alternative: Beide Formen mit »der HERR« wiedergeben oder הַלְלוּ יָהּ als »Halleluja« transliterieren
  rationale: Der hebräische Text verwendet bewusst die volle und die kurze Namensform. Die differenzierte Wiedergabe wahrt diese sprachliche Gestalt, ohne einen Titel an die Stelle des Eigennamens zu setzen.
- issue: Zeitlicher Umfang von עוֹלָם
  choice: von Ewigkeit zu Ewigkeit
  alternative: von Weltzeit zu Weltzeit / von Zeitalter zu Zeitalter
  rationale: עוֹלָם kann eine unabsehbare Zeit oder ein Zeitalter bezeichnen. Im doxologischen Zusammenhang drückt die Formel umfassende, unbegrenzte Dauer aus; die alternative Nuance wird in der Fußnote offengehalten.
- issue: Sprechakt von וְאָמַר
  choice: 'als liturgische Aufforderung: »sage«'
  alternative: narrativ »sagte« oder futurisch »wird sagen«
  rationale: Die Morphologie allein lässt mehr als eine zeitlich-modale Einordnung zu; als Psalmabschluss und Gemeindeantwort ist die auffordernde Lesart kontextuell am überzeugendsten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper liturgischer Satzführung. »Gepriesen sei« und der Konjunktiv »sage« bewahren den doxologischen und responsorischen Charakter. Die Anführungszeichen markieren die Antwort des Volkes; die Ausrufezeichen entsprechen dem Lob- und Aufforderungston.
