  text: וַ/יִּזְבְּח֣וּ אֶת בְּ֭נֵי/הֶם וְ/אֶת בְּנֽוֹתֵי/הֶ֗ם לַ/שֵּֽׁדִים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/037.yaml
  text: They sacrificed their sons and their daughters to demons[a].
translation:
  language: de
  text: Sie opferten ihre Söhne und ihre Töchter den Dämonen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: sie opferten
  rationale: זבח bezeichnet hier das kultische Schlachten beziehungsweise Darbringen als Opfer. „Opferten“ ist im Deutschen knapp, natürlich und bewahrt den kultischen Sinn.
- source_word: אֶת
  choice: '[Akkusativzeichen, unübersetzt]'
  rationale: Das hebräische Kennzeichen des bestimmten direkten Objekts hat keine eigene deutsche Entsprechung; seine Funktion wird durch den Akkusativ und die Wortstellung wiedergegeben.
- source_word: בְּנֵיהֶם
  choice: ihre Söhne
  rationale: Der Plural von בֵּן bezeichnet hier ausdrücklich die Söhne und nicht allgemein die Kinder.
- source_word: וְאֶת
  choice: und [Akkusativzeichen, unübersetzt]
  rationale: Die Konjunktion wird mit „und“ wiedergegeben; das Akkusativzeichen bleibt unübersetzt.
- source_word: בְּנוֹתֵיהֶם
  choice: ihre Töchter
  rationale: Der Plural von בַּת bezeichnet ausdrücklich die Töchter. Die Nennung von Söhnen und Töchtern bewahrt die eindringliche umfassende Anklage des Hebräischen.
- source_word: לַשֵּׁדִים
  choice: den Dämonen
  rationale: שֵׁדִים bezeichnet dämonische Wesen. Die Präposition ל kennzeichnet die Empfänger des Opfers; die kontrahierte Form enthält zudem den bestimmten Artikel, der mit „den“ formal bewahrt wird.
theological_decisions:
- issue: Wiedergabe von שֵׁדִים
  choice: Dämonen
  alternative: falschen Göttern; bösen Geistern
  rationale: Der hebräische Ausdruck bezeichnet übernatürliche, dämonische Wesen und nicht bloß abstrakt Götzen. „Dämonen“ bewahrt diese Aussage, ohne spätere spekulative Einzelheiten einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Formulierung „ihre Söhne und ihre Töchter“ sowie der kultische Sinn von „opferten“ werden eng am Hebräischen bewahrt.
