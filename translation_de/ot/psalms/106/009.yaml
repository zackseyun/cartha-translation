  text: He rebuked the Red Sea[a], and it dried up; he led them through the depths as through the wilderness.
translation:
  language: de
  text: Er wies das Schilfmeer[a] zurecht, und es trocknete aus; er führte sie durch die Tiefen wie durch die Wüste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Rote Meer“. Hebräisch: jam suf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְעַר
  choice: wies ... zurecht
  rationale: Das Verb גער bedeutet gewöhnlich „zurechtweisen“ oder „schelten“. Die Formulierung bewahrt die poetische Personifizierung des Meeres unter Gottes Herrschaft.
- source_word: בְּיַם סוּף
  choice: das Schilfmeer
  rationale: יָם־סוּף lässt sich im Deutschen sachgerecht und etabliert mit „Schilfmeer“ wiedergeben. Die traditionelle geografische Bezeichnung „Rotes Meer“ wird als Alternative in einer Fußnote genannt.
- source_word: וַיֶּחֱרָב
  choice: es trocknete aus
  rationale: Die intransitive Bedeutung von חרב („trocken werden, austrocknen“) wird natürlich und präzise wiedergegeben.
- source_word: וַיּוֹלִיכֵם
  choice: er führte sie
  rationale: Der Hifil von הלך bezeichnet hier das Veranlassen beziehungsweise Führen einer Bewegung; „führte“ ist im Deutschen idiomatisch.
- source_word: בַּתְּהֹמוֹת
  choice: durch die Tiefen
  rationale: Der Plural תְּהֹמוֹת bezeichnet die gewaltigen Wassertiefen. „Durch“ gibt die mit בְּ markierte Bewegung im Deutschen passend wieder.
- source_word: כַּמִּדְבָּר
  choice: wie durch eine Wüste
  rationale: Die Ergänzung „durch“ nimmt die Bewegung des Verbs „führen“ auf; „eine Wüste“ bewahrt den Vergleich mit offenem, trockenem und passierbarem Gelände.
theological_decisions:
- issue: Wiedergabe von יַם סוּף im Rückblick auf den Auszug
  choice: Schilfmeer
  alternative: Rotes Meer
  rationale: „Schilfmeer“ liegt näher an den Bestandteilen der hebräischen Bezeichnung und ist im deutschen Bibelgebrauch etabliert. „Rotes Meer“ bezeichnet traditionell denselben Auszugsort, kann die sprachliche Gestalt des Hebräischen jedoch verdecken; daher steht es in der Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Klang. Die Personifizierung in „wies ... zurecht“ und das Bild der „Tiefen“ bleiben erhalten.
