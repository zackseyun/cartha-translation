lexical_decisions:
- source_word: וַיַּאֲמִינוּ
  choice: Da glaubten sie
  rationale: Das Hifil von אמן bezeichnet hier Glauben beziehungsweise Vertrauen. „Da“ gibt die fortschreitende, zeitliche Erzählfolge des Wayyiqtol im Deutschen natürlich wieder.
- source_word: בִדְבָרָיו
  choice: seinen Worten
  rationale: דבר steht im Hebräischen im Plural mit einem Suffix der 3. Person Singular; daher wird die Mehrzahl bewahrt.
- source_word: יָשִׁירוּ
  choice: und sangen
  rationale: Das Qal-Imperfekt setzt hier im erzählenden Zusammenhang die Abfolge fort und wird im Deutschen passend mit dem Präteritum wiedergegeben.
- source_word: תְּהִלָּתוֹ
  choice: sein Lob
  rationale: תְּהִלָּה mit Suffix bezeichnet hier das ihm geltende Lob. „Sein Lob singen“ ist eine natürliche und quellennah formulierte deutsche Wendung.
