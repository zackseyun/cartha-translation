source:
  edition: WLC
  text: וַ/תֵּחָ֣שֶׁב ל֭/וֹ לִ/צְדָקָ֑ה לְ/דֹ֥ר וָ֝/דֹ֗ר עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/031.yaml
  text: And it was counted to him as righteousness from generation to generation forever[a][b].
translation:
  language: de
  text: Und es wurde ihm als Gerechtigkeit angerechnet, von Generation zu Generation, für immer.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zugerechnet“ beziehungsweise „als Gerechtigkeit gerechnet“. Das Hebräische verwendet die übliche Wendung dafür, dass etwas als Gerechtigkeit angesehen oder angerechnet wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „für Generation und Generation“; eine hebräische Wendung für alle aufeinanderfolgenden Generationen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּחָשֶׁב
  choice: es wurde angerechnet
  rationale: Das Nifal von חשׁב bezeichnet hier ein passives Zurechnen oder Anrechnen. „Angerechnet“ bewahrt die Wertungs- und Rechnungssprache des hebräischen Ausdrucks und ist im modernen Deutschen verständlich.
- source_word: לוֹ
  choice: ihm
  rationale: Die Präposition ל mit Pronominalsuffix bezeichnet die Person, der etwas angerechnet wird; im Deutschen ist der Dativ die natürliche Wiedergabe.
- source_word: לִצְדָקָה
  choice: als Gerechtigkeit
  rationale: צְדָקָה bedeutet hier „Gerechtigkeit“. In der Verbindung חשׁב + ל gibt „als Gerechtigkeit anrechnen“ die hebräische Wendung wieder, ohne sie auf die Bewertung einer einzelnen Tat zu verengen.
- source_word: לְדֹר וָדֹר
  choice: von Generation zu Generation
  rationale: Die wörtliche Wendung „für Generation und Generation“ bezeichnet die fortdauernde Geltung über aufeinanderfolgende Generationen hinweg. Die gewählte Formulierung ist im Deutschen idiomatisch und bewahrt die Wiederholung.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte Dauer. „Für immer“ ist natürliches, klares Deutsch und passt zum poetischen Satzschluss.
theological_decisions:
- issue: Bezug zu Genesis 15,6 und Bedeutung der zugerechneten Gerechtigkeit
  choice: Die Formulierung „ihm als Gerechtigkeit angerechnet“ wird ohne zusätzliche dogmatische Erklärung beibehalten.
  alternative: „ihm als gerechte Tat angerechnet“
  rationale: Der Vers greift bewusst die biblische Wendung vom Anrechnen als Gerechtigkeit auf. Die Übersetzung wahrt diese Resonanz und legt nicht fest, ob ausschließlich eine Tat, ein Status oder eine spätere lehrmäßige Deutung gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht feierliche Formulierung bewahrt den biblischen Anklang, ohne altertümliche Wörter oder konfessionell geprägte Zusätze zu verwenden.
