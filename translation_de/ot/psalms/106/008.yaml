id: PSA.106.8
reference: Psalms 106:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ֭/יּוֹשִׁיעֵ/ם לְמַ֣עַן שְׁמ֑/וֹ לְ֝/הוֹדִ֗יעַ אֶת גְּבוּרָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/008.yaml
  text: Yet he saved them for the sake of his name[c][b][a], to make his might known.
translation:
  language: de
  text: Doch er rettete sie um seines Namens willen[a][b], um seine Macht bekannt zu machen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Und er rettete sie“ oder „Aber er rettete sie“. Die hebräische Konjunktion kann unterschiedlich wiedergegeben werden; hier drückt sie im Zusammenhang einen Gegensatz zum vorherigen Vers aus.'
    reason: lexical_alternative
  - marker: b
    text: „Um seines Namens willen“ kann auch im Sinn von „um seines Ansehens willen“ verstanden werden. „Name“ bezeichnet im Hebräischen jedoch häufig umfassender Gottes offenbartes Wesen und seine Ehre.
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „seine Kraft“ oder „seine Machttat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: Doch er rettete sie
  rationale: Das Verb ישׁע bedeutet „retten, befreien“. „Rettete“ ist im Deutschen natürlich und bewahrt den theologischen Klang. Das vorangestellte וַ kann verbindend oder, wie hier im Gegensatz zur Auflehnung des Volkes im vorherigen Vers, adversativ verstanden werden; „Doch“ gibt diesen Kontrast knapp wieder.
- source_word: לְמַעַן
  choice: um ... willen
  rationale: לְמַעַן bezeichnet hier den Beweggrund beziehungsweise Zweck. Die feste Wendung „um seines Namens willen“ ist idiomatisch, würdig und inhaltlich näher am Hebräischen als ein bloßes „für“.
- source_word: שְׁמוֹ
  choice: seines Namens
  rationale: „Name“ bleibt erhalten, weil das hebräische Wort sowohl Gottes Ansehen als auch seine offenbarte Identität, seinen Charakter und seine Ehre umfasst. Eine Verengung auf „Ruf“ wäre zu eng.
- source_word: לְהוֹדִיעַ
  choice: bekannt zu machen
  rationale: 'Der Hifil-Infinitiv von ידע hat kausative Bedeutung: „wissen lassen, bekannt machen“. Die deutsche Infinitivkonstruktion gibt den Zweck der Rettung klar wieder.'
- source_word: אֶת
  choice: '[nicht gesondert wiedergegeben]'
  rationale: Der hebräische Akkusativmarker hat keine unmittelbare deutsche Entsprechung; seine Funktion wird durch den deutschen Satzbau ausgedrückt.
- source_word: גְּבוּרָתוֹ
  choice: seine Macht
  rationale: גְּבוּרָה kann „Stärke“, „Macht“ oder auch „Machttat“ bezeichnen. Hier passt der abstrakte Singular „Macht“ gut und bezeichnet Gottes machtvolle Fähigkeit, die sich in seiner Rettung zeigt, ohne die mögliche Bedeutung unnötig auf eine einzelne Tat zu verengen.
theological_decisions:
- issue: Bedeutung von „um seines Namens willen“
  choice: Gottes rettendes Handeln geschieht um der Ehre und Offenbarung seines Namens beziehungsweise seines Wesens willen.
  alternative: Gott rettet um seines Rufes oder Ansehens willen.
  rationale: Der hebräische Ausdruck schließt Gottes Ansehen ein, geht aber über öffentliche Reputation hinaus. Die Beibehaltung von „Name“ bewahrt die umfassendere Bedeutung seiner offenbarten Identität, seines Charakters und seiner Ehre, ohne die Spannung durch eine engere Deutung aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Ton. Die traditionelle, aber weiterhin geläufige Wendung „um seines Namens willen“ bewahrt die Dichte des hebräischen Ausdrucks; Satzbau und Wortwahl bleiben zugleich klar und natürlich.
