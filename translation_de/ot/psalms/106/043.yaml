  text: פְּעָמִ֥ים רַבּ֗וֹת יַצִּ֫ילֵ֥/ם וְ֭/הֵמָּה יַמְר֣וּ בַ/עֲצָתָ֑/ם וַ֝/יָּמֹ֗כּוּ בַּ/עֲוֺנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/043.yaml
  text: Many times he delivered them[b][a], but they were rebellious in their counsel, and they were brought low by their iniquity.
translation:
  language: de
  text: Viele Male rettete er sie; doch sie lehnten sich in ihrem Ratschluss[a] auf und sanken durch ihre Schuld[b] nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie rebellierten in ihrem Plan/Ratschluss“. Das Hebräische kann sowohl ihr Aufbegehren als auch ihre rebellische Haltung hervorheben; das Wort kann „Rat“, „Plan“ oder „Vorhaben“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wurden durch ihre Schuld erniedrigt“ oder „verfielen durch ihre Schuld“. Das hebräische Verb kann Niedrigwerden, Absinken oder Verfallen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּעָמִים רַבּוֹת
  choice: Viele Male
  rationale: Gibt die zahlreichen wiederholten Rettungen eng am Hebräischen und in natürlichem Deutsch wieder.
- source_word: יַצִּילֵם
  choice: rettete er sie
  rationale: Das Hifil von נצל bezeichnet das Befreien oder Erretten aus Gefahr; „rettete“ ist im heutigen Deutsch klar und vermeidet unnötig altertümliche Sprache.
- source_word: וְהֵמָּה
  choice: doch sie
  rationale: Das selbstständige Pronomen hebt Israel kontrastierend hervor; „doch sie“ bildet den Gegensatz zu Gottes wiederholtem Retten ab.
- source_word: יַמְרוּ
  choice: widersetzten sich
  rationale: מרה bezeichnet widerspenstiges Aufbegehren oder Widerstand. Die Formulierung gibt die aktive Rebellion wieder, ohne eine bestimmte Einzelhandlung vorauszusetzen.
- source_word: בַעֲצָתָם
  choice: nach ihren eigenen Plänen
  rationale: עֵצָה kann Rat, Plan oder Vorhaben bedeuten. „Nach ihren eigenen Plänen“ ist gegenwärtiges, verständliches Deutsch und bringt den eigenwilligen Ratschluss zum Ausdruck, ohne die lexikalische Spannweite völlig festzulegen.
- source_word: וַיָּמֹכּוּ
  choice: sanken ... tief hinab
  rationale: מוך bezeichnet das Niedrigwerden, Absinken oder Verkommen. Die aktive Ergebnisform vermeidet die Festlegung auf einen ausdrücklich genannten äußeren Urheber.
- source_word: בַּעֲוֺנָם
  choice: durch ihre Schuld
  rationale: עָוֹן umfasst Verfehlung, Schuld und deren Folgen. „Schuld“ bewahrt das moralische Gewicht und lässt den Zusammenhang zwischen Tat, Schuldzustand und Folge offen.
theological_decisions:
- issue: Unausgesprochenes Subjekt der Rettung
  choice: Das Pronomen „er“ bleibt ohne erneute ausdrückliche Nennung Gottes stehen.
  alternative: „Gott rettete sie“ oder „der HERR rettete sie“
  rationale: Im Hebräischen ist das Subjekt nur in der Verbform enthalten und aus dem Zusammenhang als Gott zu erkennen. Die knappe Wiedergabe wahrt die Ökonomie des Verses.
- issue: Art des Niedrigwerdens
  choice: „sanken … tief hinab“
  alternative: „wurden erniedrigt“ oder „verkamen“
  rationale: Die Wiedergabe bewahrt den möglichen Sinn des Absinkens beziehungsweise Niedrigwerdens, ohne einen ausdrücklich handelnden Urheber einzuführen oder den Vorgang ausschließlich als moralischen Verfall auszulegen.
- issue: Bedeutung von עָוֹן
  choice: „Schuld“
  alternative: „Verfehlung“, „Ungerechtigkeit“ oder „Schuldstrafe“
  rationale: Der hebräische Ausdruck kann sowohl die schuldhafte Tat als auch den Schuldzustand und dessen Folgen bezeichnen. „Schuld“ hält diese theologische Spannung im Deutschen weitgehend offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht poetischem Rhythmus. Das Semikolon verdeutlicht den scharfen Gegensatz zwischen Gottes wiederholtem Retten und dem fortgesetzten Widerstand des Volkes. Die Formulierungen vermeiden sowohl unnötigen Archaismus als auch konfessionelle Zusätze.
