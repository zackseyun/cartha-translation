id: PSA.106.10
reference: Psalms 106:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ֭/יּוֹשִׁיעֵ/ם מִ/יַּ֣ד שׂוֹנֵ֑א וַ֝/יִּגְאָלֵ֗/ם מִ/יַּ֥ד אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/010.yaml
  text: So he saved them from the hand of the one who hated them[b][a], and redeemed them from the hand of the enemy.
translation:
  language: de
  text: So rettete er sie aus der Hand dessen, der sie hasste, und erlöste sie aus der Hand des Feindes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Erlöste“ kann hier auch mit „befreite“ oder „löste aus“ wiedergegeben werden; das hebräische Verb bezeichnet ein Zurückgewinnen oder Befreien durch Eingreifen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: rettete er sie
  rationale: Das Verb ישׁע bezeichnet hier die Rettung aus Gefahr und Gewalt. „rettete“ ist natürliches modernes Deutsch und bewahrt das Gewicht göttlichen Eingreifens.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die hebräische Wendung bezeichnet die Befreiung aus der Macht oder Gewalt eines anderen. Die Bildsprache ist auch im Deutschen verständlich und wird in beiden parallelen Satzteilen bewahrt.
- source_word: שׂוֹנֵא
  choice: dessen, der sie hasste
  rationale: Das substantivierte Partizip steht im Singular. Die Wiedergabe bewahrt diesen Singular, der im Zusammenhang möglicherweise eine feindliche Macht wie den Pharao oder Ägypten verkörpert, ohne dies ausdrücklich festzulegen.
- source_word: וַיִּגְאָלֵם
  choice: erlöste sie
  rationale: גאל bezeichnet das Zurückgewinnen oder Befreien durch wirksames Eingreifen. „erlöste“ wahrt neben der konkreten Rettung auch die besondere Bedeutung dieses zweiten Verbs.
- source_word: אוֹיֵב
  choice: des Feindes
  rationale: Der bestimmte Singular entspricht dem Hebräischen und erhält den Parallelismus mit dem zuvor genannten Hassenden.
theological_decisions:
- issue: Ob die beiden Verben ישׁע und גאל zu einem einzigen allgemeinen Begriff eingeebnet werden sollen
  choice: Als „rettete“ und „erlöste“ unterschieden
  alternative: Beide Verben mit „befreite“ oder „rettete“ wiedergeben
  rationale: Der Vers gebraucht zwei verwandte, aber nicht identische Ausdrücke. Ihre Unterscheidung erhält den poetischen Parallelismus sowie die Spannung zwischen Rettung aus Gefahr und erlösender Wiedergewinnung, ohne zusätzliche dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wendung „aus der Hand“ bewahrt die konkrete hebräische Bildsprache; der Singular der beiden feindlichen Bezeichnungen bleibt erhalten.
