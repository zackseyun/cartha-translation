  text: וַ/יִּתְּנֵ֥/ם בְּ/יַד גּוֹיִ֑ם וַֽ/יִּמְשְׁל֥וּ בָ֝/הֶ֗ם שֹׂנְאֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/041.yaml
  text: He gave them into the hand of the nations[b][a], and those who hated them ruled over them.
translation:
  language: de
  text: Er gab sie in die Hand der Völker[a], und diejenigen, die sie hassten, herrschten über sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in die Hand der Völker“; gemeint ist: in ihre Gewalt.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: Er gab sie
  rationale: Die einfache Wiedergabe bewahrt die direkte göttliche Handlung des hebräischen Verbs נתן; im Zusammenhang mit „in die Hand“ bedeutet es, jemanden fremder Gewalt auszuliefern.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Die im Deutschen verständliche biblische Wendung bewahrt das hebräische Bild für Macht und Verfügungsgewalt; die Fußnote erläutert den Sinn.
- source_word: גּוֹיִם
  choice: der Völker
  rationale: Gemeint sind hier fremde Völker, unter deren Gewalt Israel geriet. „Völker“ ist sachgemäß und vermeidet das stärker traditionsgeprägte „Heiden“.
- source_word: וַיִּמְשְׁלוּ בָהֶם
  choice: herrschten über sie
  rationale: Die Verbindung aus משל und ב bezeichnet das Herrschen über jemanden. Diese Wiedergabe ist präzise und natürlich.
- source_word: שֹׂנְאֵיהֶם
  choice: die sie hassten
  rationale: Die substantivierte Partizipialform bezeichnet wörtlich diejenigen, die sie hassten; so bleibt die aktive Feindschaft deutlicher erhalten als bei „ihre Feinde“.
theological_decisions:
- issue: Göttliches Handeln im Gericht über Israel
  choice: „Er gab sie“ stellt Gottes aktives Ausliefern fest.
  alternative: Eine Formulierung, die lediglich göttliche Zulassung ausdrückt.
  rationale: Das hebräische נתן schreibt die Handlung dem im Kontext genannten Gott unmittelbar zu. Diese Spannung wird weder abgeschwächt noch über den Wortlaut hinaus erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem hebräischem Machtbild. Der parallele Satzbau und die Wiederholung von „sie“ geben die knappe poetische Struktur verständlich wieder.
