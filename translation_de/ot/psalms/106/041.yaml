  source_fidelity: 'Die Wiedergabe trifft die Satzstruktur und den Sinn des Hebräischen grundsätzlich genau: Gott gibt Israel in die Gewalt der Völker, und ihre Hasser üben Herrschaft über sie aus. Das Machtbild von בְּיָד und die aktive göttliche Handlung bleiben erhalten.'
  naturalness: „Er gab sie in die Hand der Völker“ ist im würdigen modernen Standarddeutsch verständlich; die Fußnote erklärt die bildhafte Wendung angemessen. Die Formulierung „die sie hassten“ ist jedoch syntaktisch mehrdeutig und kann auch als „diejenigen, die sie hassten“ oder, je nach Verarbeitung, als Objektbeziehung missverstanden werden.
  terminology: „Völker“ ist für גּוֹיִם hier passend und weniger traditionsbeladen als „Heiden“. „herrschten über sie“ gibt וַיִּמְשְׁלוּ בָהֶם präzise wieder. Für שֹׂנְאֵיהֶם sollte die aktive Bedeutung eindeutig formuliert werden.
