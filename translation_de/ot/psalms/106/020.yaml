  text: וַ/יָּמִ֥ירוּ אֶת כְּבוֹדָ֑/ם בְּ/תַבְנִ֥ית שׁ֝֗וֹר אֹכֵ֥ל עֵֽשֶׂב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/020.yaml
  text: They exchanged their glory for the image of an ox that eats grass[a][b].
translation:
  language: de
  text: Sie tauschten ihre Herrlichkeit[a] gegen das Abbild eines Rindes[b], das Gras frisst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihren herrlichen Gott“. Wörtlich: „ihre Herrlichkeit“; damit ist hier Gott gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Stieres“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמִירוּ
  choice: Sie vertauschten
  rationale: Das Verb מוּר bezeichnet einen Austausch oder Ersatz. „vertauschten … mit“ gibt den Vorwurf wieder, dass sie ihre Herrlichkeit gegen ein Götzenbild eintauschten.
- source_word: כְּבוֹדָם
  choice: ihre Herrlichkeit
  rationale: Der hebräische Text sagt wörtlich „ihre Herrlichkeit“. Im Zusammenhang ist damit Gott als Israels Herrlichkeit gemeint; die bildhafte und theologisch spannungsvolle Ausdrucksweise bleibt im Haupttext erhalten.
- source_word: בְּתַבְנִית
  choice: mit dem Abbild
  rationale: תַּבְנִית kann Form, Gestalt oder Abbild bedeuten. „Abbild“ passt natürlich zum Götzenbild und bezeichnet das, womit die Herrlichkeit vertauscht wurde.
- source_word: שׁוֹר
  choice: eines Rindes
  rationale: שׁוֹר bezeichnet ein Rind und kann je nach Kontext auch mit „Stier“ wiedergegeben werden. „Rind“ bewahrt die Geschlechtsneutralität des hebräischen Gattungsbegriffs, während die Alternative in einer Fußnote genannt wird.
- source_word: אֹכֵל עֵשֶׂב
  choice: das Gras frisst
  rationale: 'Das Partizip mit Objekt wird im Deutschen natürlich als Relativsatz wiedergegeben. So bleibt die Ironie erhalten: Das verehrte Abbild stellt ein bloß grasfressendes Geschöpf dar.'
theological_decisions:
- issue: Bezug von „ihre Herrlichkeit“
  choice: Die wörtliche Wendung „ihre Herrlichkeit“ bleibt im Haupttext stehen.
  alternative: „ihren herrlichen Gott“ oder „Gott“
  rationale: Der Kontext weist auf Gott als Bezug hin, doch der hebräische Text nennt ihn hier nicht ausdrücklich. Die Beibehaltung wahrt die Bildsprache und löst die theologische Aussage nicht stillschweigend auf.
- issue: Identität des dargestellten Tieres
  choice: „Rind“ im Haupttext
  alternative: „Stier“
  rationale: Das hebräische שׁוֹר ist weiter als eine ausdrücklich männliche Bezeichnung. Zugleich ist „Stier“ im Zusammenhang mit dem Götzenbild möglich und wird daher als lexikalische Alternative dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „vertauschten … mit“ ist idiomatisch und bewahrt den Austauschgedanken; „Herrlichkeit“ erhält die knappe, ehrfurchtsvolle Ausdrucksweise des Hebräischen.
