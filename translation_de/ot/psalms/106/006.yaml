  text: We have sinned with our fathers[a]; we have done wrong[b]; we have acted wickedly.
translation:
  language: de
  text: Wir haben zusammen mit unseren Vätern[a] gesündigt; wir haben Unrecht getan[b]; wir haben böse gehandelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unseren Vorfahren“. Wörtlich steht im Hebräischen „unseren Vätern“.'
