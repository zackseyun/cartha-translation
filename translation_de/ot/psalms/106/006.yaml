lexical_decisions:
- source_word: חָטָאנוּ
  choice: wir haben gesündigt
  rationale: Das Qal Perfekt 1. Person Plural bezeichnet das Sündigen; das deutsche Perfekt ist in einem gegenwärtigen gemeinschaftlichen Bekenntnis natürlich.
- source_word: עִם
  choice: zusammen mit
  rationale: Die Präposition bezeichnet Gemeinschaft beziehungsweise Verbundenheit. „Zusammen mit“ bewahrt die generationenübergreifende Solidarität und vermeidet die vergleichende Bedeutung „wie“.
- source_word: אֲבוֹתֵינוּ
  choice: unseren Vätern
  rationale: Dies gibt den hebräischen männlichen Verwandtschaftsbegriff formal wieder; „Vorfahren“ ist als sinngemäße Alternative in der Fußnote genannt.
- source_word: הֶעֱוִינוּ
  choice: wir haben Unrecht getan
  rationale: Das Hifil von עוה bezeichnet verkehrtes beziehungsweise schuldhaftes Handeln. Die Formulierung ist verständlich und bewahrt die moralische Aussage.
- source_word: הִרְשָׁעְנוּ
  choice: wir haben gottlos gehandelt
  rationale: Das Hifil von רשע bezeichnet schuldhaftes, frevelhaftes oder gottloses Handeln. „Gottlos gehandelt“ gibt die verbale Aussage wieder und steigert das dreifache Bekenntnis.
theological_decisions:
- issue: Generationübergreifende Solidarität im Sündenbekenntnis
  choice: „zusammen mit unseren Vätern“
  alternative: „wie unsere Väter“
  rationale: עִם bezeichnet hier am natürlichsten Gemeinschaft oder Verbundenheit, nicht bloß Ähnlichkeit. Die Übersetzung bewahrt das gemeinsame Bekenntnis mit früheren Generationen, ohne darüber hinaus eine dogmatische Theorie festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei parallelen Verben bleiben als gesteigertes gemeinschaftliches Bekenntnis erhalten; die Semikolonstruktur bildet den knappen hebräischen Parallelismus ab.
