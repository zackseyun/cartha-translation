- from: Er dachte ihretwegen an seinen Bund und ließ sich seiner großen, treuen Liebe entsprechend umstimmen.[a]
  to: Er erinnerte sich zu ihren Gunsten an seinen Bund und änderte seinen Entschluss entsprechend der Fülle seiner treuen Liebe.[a]
