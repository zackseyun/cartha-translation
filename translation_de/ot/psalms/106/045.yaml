base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/045.yaml
  text: He remembered his covenant for their sake[a], and relented according to the abundance of his steadfast love.
translation:
  language: de
  text: Er erinnerte sich zu ihren Gunsten an seinen Bund und änderte seinen Entschluss entsprechend der Fülle seiner treuen Liebe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hatte Erbarmen“ oder „empfand Reue“. Das hebräische Verb kann eine Änderung des Handelns oder ein Bewegtwerden zum Erbarmen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Er dachte … an
  rationale: זכר bezeichnet hier das Erinnern an die Bundesverpflichtung mit daraus folgendem Handeln. „An seinen Bund denken“ ist im modernen Deutsch transparent und bewahrt den Bezug auf den Bund.
- source_word: לָהֶם
  choice: ihretwegen
  rationale: Die Präposition ל mit Suffix stellt das Erinnern in Beziehung zum Volk und zu dessen Gunsten dar. „Ihretwegen“ gibt dies idiomatisch wieder, ohne einen zusätzlichen Gegenstand einzuführen.
- source_word: בְּרִיתוֹ
  choice: seinen Bund
  rationale: „Bund“ ist die etablierte und sachlich angemessene Wiedergabe von בְּרִית im biblisch-theologischen Zusammenhang.
- source_word: וַיִּנָּחֵם
  choice: ließ sich … umstimmen
  rationale: Das Niphal von נחם kann ein Sich-gereuen-Lassen, eine Änderung des angekündigten Handelns oder ein Bewegtwerden zum Erbarmen ausdrücken. „Ließ sich umstimmen“ wahrt die erkennbare Änderung in Gottes Handeln, ohne die Bedeutungsbreite vollständig festzulegen.
- source_word: כְּרֹב
  choice: seiner großen … entsprechend
  rationale: כ mit רֹב bezeichnet Maß beziehungsweise Entsprechung. Die Formulierung gibt diesen proportionalen Sinn in natürlichem Deutsch wieder.
- source_word: חַסְדּוֹ
  choice: seiner … treuen Liebe
  rationale: חסד verbindet gnädige Zuwendung mit Beständigkeit und Loyalität. „Treue Liebe“ bewahrt beide Aspekte besser als das engere „Erbarmen“; „groß“ nimmt zugleich רֹב auf.
theological_decisions:
- issue: Anthropopathische Rede von Gott in וַיִּנָּחֵם
  choice: ließ sich umstimmen
  alternative: änderte seinen Entschluss; hatte Erbarmen
  rationale: Die Übersetzung lässt die Spannung stehen, dass sich Gottes Handeln gegenüber dem Volk im Zusammenhang mit seinem Bund verändert. Sie behauptet weder, Gott habe sich zuvor geirrt, noch reduziert sie das Verb ausschließlich auf inneres Mitgefühl.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt gut verständlich und bildet zugleich die Abfolge des Hebräischen ab. „Treue Liebe“ vermeidet sowohl das altertümliche „Huld“ als auch eine Verengung auf bloßes Erbarmen.
