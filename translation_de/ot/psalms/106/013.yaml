id: PSA.106.13
reference: Psalms 106:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִֽ֭הֲרוּ שָׁכְח֣וּ מַעֲשָׂ֑י/ו לֹֽא חִ֝כּ֗וּ לַ/עֲצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/013.yaml
  text: They quickly forgot his works[a]; they did not wait for his counsel.
translation:
  language: de
  text: Schnell vergaßen sie seine Taten; sie warteten nicht auf seinen Rat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seinen Plan« oder »seine Absicht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִהֲרוּ
  choice: schnell
  rationale: 'Das Verb מהר drückt Eile oder Schnelligkeit aus und wird zusammen mit שָׁכְחוּ im Deutschen natürlich adverbial wiedergegeben: »Schnell vergaßen sie«. »Bald« wäre möglich, könnte aber bloß zeitliche Nähe statt voreiliger Hast ausdrücken.'
- source_word: שָׁכְחוּ
  choice: vergaßen
  rationale: Qal Perfekt 3. Person Plural von שכח; die schlichte Vergangenheitsform ist im erzählenden Rückblick des Psalms angemessen.
- source_word: מַעֲשָׂיו
  choice: seine Taten
  rationale: מַעֲשֶׂה bezeichnet Werke oder Taten. »Seine Taten« ist im modernen Deutsch natürlich, würdevoll und verweist klar auf Gottes zuvor geschildertes Handeln.
- source_word: לֹא חִכּוּ
  choice: sie warteten nicht
  rationale: חכה bedeutet hier »warten«. Die Negation wird direkt und idiomatisch wiedergegeben.
- source_word: לַעֲצָתוֹ
  choice: auf seinen Rat
  rationale: עֵצָה kann Rat, Plan oder Absicht bedeuten. Mit חכה ist »auf seinen Rat warten« eine natürliche deutsche Verbindung und bewahrt den Gedanken, dass Israel Gottes Weisung nicht abwartete, ohne den Ausdruck auf einen feststehenden Plan zu verengen.
theological_decisions:
- issue: Bedeutung von עֵצָה in Bezug auf Gott
  choice: seinen Rat
  alternative: seinen Plan / seine Absicht
  rationale: »Rat« hält die relationale und richtungsweisende Bedeutung offen. »Plan« oder »Absicht« könnte den Vers stärker auf einen göttlichen Ratschluss festlegen, als es der mehrdeutige hebräische Ausdruck verlangt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, poetischer Satzstruktur. Das vorangestellte »Schnell« spiegelt die hebräische Hervorhebung der Hast. Der Fußnotenmarker steht unmittelbar nach dem Ausdruck, auf den sich die Bedeutungsalternativen beziehen.
