  text: וַ/יִּטְמְא֥וּ בְ/מַעֲשֵׂי/הֶ֑ם וַ֝/יִּזְנוּ֗ בְּ/מַֽעַלְלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/039.yaml
  text: So they became unclean by their deeds[a], and they prostituted themselves by their acts.
translation:
  language: de
  text: So wurden sie durch ihre Taten unrein, und durch ihr Tun prostituierten sie sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie wurden durch ihr Tun untreu.“ Das Hebräische verwendet ein sexualisiertes Bild für moralische Untreue und Untreue gegenüber dem Bund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטְמְאוּ
  choice: So wurden sie … unrein
  rationale: Das Verb טמא bezeichnet hier das Unreinwerden. Die Form nennt keinen äußeren Verursacher; daher wahrt „wurden … unrein“ den resultativen Sinn.
- source_word: בְמַעֲשֵׂיהֶם
  choice: durch ihre Taten
  rationale: מַעֲשֶׂה bezeichnet Taten oder Handlungen. „Durch“ gibt die instrumentale beziehungsweise kausale Funktion der Präposition בְּ natürlich wieder.
- source_word: וַיִּזְנוּ
  choice: prostituierten sie sich
  rationale: זנה trägt ein bewusst sexualisiertes Bild, das im Zusammenhang Israels sittliche und bundbezogene Untreue bezeichnet. Die konkrete Metapher bleibt im Haupttext erhalten.
- source_word: בְמַעַלְלֵיהֶם
  choice: durch ihr Tun
  rationale: מַעֲלָל bezeichnet Tun, Handlungen oder Verhaltensweisen, häufig mit moralischer Färbung. „Tun“ bewahrt die poetische Variation gegenüber „Taten“.
theological_decisions:
- issue: Soll זנה unmittelbar als Bundesuntreue ausgelegt oder als sexualisierte Metapher wiedergegeben werden?
  choice: Die Metapher bleibt im Haupttext als „prostituierten sie sich“ erhalten.
  alternative: „wurden sie untreu“ beziehungsweise „handelten sie treulos“
  rationale: Im Kontext beschreibt das Bild Israels Abfall und Götzendienst. Eine rein deutende Wiedergabe würde jedoch die Schärfe und Mehrdeutigkeit des hebräischen Bildes abschwächen; deshalb erläutert die Fußnote die gemeinte Untreue, ohne sie in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung im zweiten Halbvers hält den parallelen Aufbau erkennbar; „prostituierten sie sich“ ist bewusst kräftig, aber allgemein verständlich.
