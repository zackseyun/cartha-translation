base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/047.yaml
  text: Save us[a], O Yahweh our God, and gather us from among the nations[b], that we may give thanks to your holy name and glory in your praise.
translation:
  language: de
  text: Rette uns[a], Jahwe, unser Gott, und sammle uns aus den Völkern, damit wir deinem heiligen Namen danken und uns deines Lobes rühmen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Befreie uns“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und über dein Lob jubeln“. Das Hebräische kann ein Sichrühmen oder Frohlocken in Gottes Lob bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנוּ
  choice: Rette uns
  rationale: Der Hifil-Imperativ von ישׁע mit Suffix der 1. Person Plural ist eine unmittelbare Bitte um Rettung. „Rette uns“ ist im Deutschen natürlich und bewahrt zugleich das Gewicht der Gebetssprache.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen übliche Transkription.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Die Form mit Suffix der 1. Person Plural bedeutet unmittelbar „unser Gott“ und bewahrt den gemeinschaftlichen Bundesbezug der Bitte.
- source_word: וְקַבְּצֵנוּ
  choice: und sammle uns
  rationale: Das Piel von קבץ bezeichnet hier das Sammeln eines zerstreuten Volkes. „Sammle uns“ ist prägnant und idiomatisch.
- source_word: מִן הַגּוֹיִם
  choice: aus den Völkern
  rationale: גּוֹיִם bezeichnet die Völker, unter denen die Betenden zerstreut sind. „Aus den Völkern“ gibt die räumliche Herkunft wieder, ohne eine zusätzliche Deutung einzutragen.
- source_word: לְהוֹדוֹת לְשֵׁם קָדְשֶׁךָ
  choice: damit wir deinem heiligen Namen danken
  rationale: Die Infinitivkonstruktion bezeichnet den Zweck der erbetenen Rettung und Sammlung. ידה im Hifil wird hier treffend mit „danken“ wiedergegeben.
- source_word: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: und uns deines Ruhmes rühmen
  rationale: Der Hitpael von שׁבח trägt die Bedeutung des Sichrühmens oder Frohlockens. תהלה kann sowohl das Lob als auch den dadurch ausgesprochenen Ruhm bezeichnen; „deines Ruhmes rühmen“ bewahrt die starke, reflexive Ausdrucksweise und klingt im Deutschen würdig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen und nicht den Titel אֲדֹנָי. Die Wiedergabe als „Jahwe“ wahrt diesen Unterschied.
- issue: Bedeutung von לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: uns deines Ruhmes rühmen
  alternative: über dein Lob jubeln
  rationale: Die Wendung verbindet reflexives Rühmen mit Gottes תהלה. Die Hauptfassung erhält das kräftige biblische Bild, ohne es auf menschliche Leistung zu beziehen; die Fußnote zeigt die ebenfalls mögliche Nuance des jubelnden Lobens.
translation_notes:
  register: Moderne, klare und zugleich würdige Gebetssprache. Die Anrede „Jahwe, unser Gott“ bleibt eng am hebräischen Satzbau. Die zweifache Formulierung „Ruhmes rühmen“ ist bewusst als gehobene biblische Wendung gewählt; eine flüssigere Alternative wird in der Fußnote genannt.
