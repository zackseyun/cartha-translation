  text: וַ/יִּתֵּ֣ן אוֹתָ֣/ם לְ/רַחֲמִ֑ים לִ֝/פְנֵ֗י כָּל שׁוֹבֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/046.yaml
  text: He caused them to receive compassion before all who had taken them captive.
translation:
  language: de
  text: Er ließ sie bei allen, die sie gefangen hielten, Erbarmen finden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן אוֹתָם לְרַחֲמִים
  choice: Er ließ sie … Erbarmen finden
  rationale: Die hebräische Konstruktion bedeutet wörtlich, dass Gott sie zum Gegenstand von Erbarmen machte. Die idiomatische deutsche Wendung gibt dieses von Gott bewirkte Wohlwollen natürlich wieder, ohne die Aussage abzuschwächen.
- source_word: לִפְנֵי
  choice: bei
  rationale: Hier bezeichnet die Präposition das Verhältnis zu den betreffenden Personen; „bei“ ist im Deutschen natürlicher als das formale „vor“.
- source_word: כָּל שׁוֹבֵיהֶם
  choice: allen, die sie gefangen hielten
  rationale: Das Partizip bezeichnet ihre Gefangennehmer beziehungsweise diejenigen, die sie in Gefangenschaft hielten. Die Formulierung wahrt den historischen Sinn und klingt in modernem Deutsch natürlich.
theological_decisions:
- issue: Gottes Wirken am Erbarmen der Gefangennehmer
  choice: „Er ließ sie … Erbarmen finden“ bewahrt Gott als den Handelnden.
  alternative: „Sie fanden Erbarmen“
  rationale: Die Alternative würde das kausative וַיִּתֵּן und damit die ausdrückliche Zuschreibung an Gott abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzform entspricht dem poetischen Kontext; keine Fußnote erforderlich.
