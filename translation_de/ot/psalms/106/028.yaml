lexical_decisions:
- source_word: וַיִּצָּמְדוּ
  choice: sie schlossen sich … an
  rationale: Das Verb צמד bezeichnet eine enge Bindung oder Verbindung. Die reflexive deutsche Wendung ist natürlich und gibt die bewusste kultische Hinwendung wieder, ohne das Bild eines Jochs in den Haupttext einzutragen.
- source_word: לְבַעַל פְּעוֹר
  choice: dem Baal von Peor
  rationale: Die Formulierung bezeichnet die mit Peor verbundene Gottheit. „Baal von Peor“ bewahrt beide Namen und gibt ihr Verhältnis in verständlichem Deutsch wieder.
- source_word: וַיֹּאכְלוּ
  choice: und aßen
  rationale: Die schlichte Vergangenheitsform entspricht der hebräischen Erzählfolge und vermeidet unnötig gehobene Ausdrucksweise.
- source_word: זִבְחֵי
  choice: Opfer
  rationale: זֶבַח bezeichnet Schlacht- beziehungsweise Opfergaben. „Opfer“ ist hier knapp und lässt zusammen mit „aßen“ den kultischen Mahlkontext erkennen, ohne „Mahlzeiten“ interpretierend einzusetzen.
- source_word: מֵתִים
  choice: der Toten
  rationale: Die Form bedeutet wörtlich „Tote“ beziehungsweise „die Toten“. Der Genitiv bildet die knappe hebräische Verbindung nach und bewahrt die mögliche Beziehung zu leblosen Göttern oder zu Verstorbenen.
theological_decisions:
- issue: Bezug von מֵתִים in der Wendung זִבְחֵי מֵתִים
  choice: „Opfer der Toten“ ohne nähere Bestimmung
  alternative: „Opfer für Verstorbene“, „Opfer für tote Götter“ oder „Opfer für leblose Götzen“
  rationale: Der hebräische Text legt nicht ausdrücklich fest, ob mit den „Toten“ leblose Gottheiten oder Verstorbene im Rahmen von Totenriten gemeint sind. Die Hauptfassung bewahrt diese echte Mehrdeutigkeit; die Fußnote nennt die Deutungsmöglichkeiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und parallel zum Hebräischen; kultische und theologische Mehrdeutigkeit wird nicht im Haupttext aufgelöst.
