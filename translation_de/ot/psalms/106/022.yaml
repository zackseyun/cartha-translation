lexical_decisions:
- source_word: נִפְלָאוֹת
  choice: Wundertaten
  rationale: Die feminine Pluralform von פלא bezeichnet außergewöhnliche, staunenerregende Taten. „Wundertaten“ ist im Deutschen natürlich, würdig und hält den Handlungscharakter fest.
- source_word: בְּאֶרֶץ
  choice: im Land
  rationale: Die Präposition בְּ ist hier lokativ; „im Land“ gibt die Wendung knapp und idiomatisch wieder.
- source_word: חָם
  choice: Ham
  rationale: Der Eigenname wird entsprechend dem hebräischen Wortlaut beibehalten, statt die kontextuelle Deutung „Ägypten“ in den Haupttext einzusetzen.
- source_word: נוֹרָאוֹת
  choice: furchtgebietende Taten
  rationale: Die Form aus der Wurzel ירא bezeichnet Taten, die Ehrfurcht und Schrecken hervorrufen. „Furchtgebietend“ bewahrt diese Spannung besser als das heute oft abgeschwächte „ehrfurchtgebietend“ oder das missverständliche „schrecklich“.
- source_word: עַל
  choice: am
  rationale: 'Bei einer geografischen Ortsangabe bezeichnet עַל hier den Schauplatz beziehungsweise die Nähe: „am“ ist die natürliche deutsche Wiedergabe.'
- source_word: יַם סוּף
  choice: Schilfmeer
  rationale: Die hebräische Bezeichnung wird lexikalisch transparent als „Schilfmeer“ wiedergegeben. Die traditionelle Benennung „Rotes Meer“ bleibt in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Poetisch parallel gebaut und zugleich in modernem Standarddeutsch verständlich. Die Wiederholung „Taten“ bildet den hebräischen Parallelismus ab; „furchtgebietend“ wahrt sowohl Staunen als auch Schrecken.
