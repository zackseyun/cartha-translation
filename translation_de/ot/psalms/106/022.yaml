translation:
  language: de
  text: Wundertaten im Land Hams[b], furchtgebietende Taten am Schilfmeer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Jam Suf“, wörtlich „Schilfmeer“; traditionell „Rotes Meer“.
