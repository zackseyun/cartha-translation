  text: וַ֭/יַּכְעִיסוּ בְּ/מַֽעַלְלֵי/הֶ֑ם וַ/תִּפְרָץ בָּ֝֗/ם מַגֵּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/029.yaml
  text: They provoked him to anger by their deeds[a], and a plague broke out among them.
translation:
  language: de
  text: Durch ihre Taten reizten sie ihn zum Zorn[a], und eine Plage brach unter ihnen aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Durch ihr Tun machten sie ihn zornig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְעִיסוּ
  choice: reizten sie ihn zum Zorn
  rationale: Der Hifil von כעס bezeichnet das Erregen oder Hervorrufen von Zorn. „Zum Zorn reizen“ gibt die kausative Bedeutung idiomatisch wieder; das im Hebräischen unausgesprochene Objekt wird aus dem Kontext als „ihn“ ergänzt.
- source_word: בְּמַעַלְלֵיהֶם
  choice: durch ihre Taten
  rationale: מַעֲלָלִים bezeichnet Taten oder Handlungen, hier mit moralischer Färbung. Die Präposition בְּ kennzeichnet das Mittel; „durch ihre Taten“ ist knapp und natürlich.
- source_word: וַתִּפְרָץ
  choice: brach ... aus
  rationale: פרץ vermittelt das Bild eines plötzlichen Hervorbrechens. Zusammen mit „Plage“ ist „ausbrechen“ die natürliche deutsche Verbindung.
- source_word: בָּם
  choice: unter ihnen
  rationale: Die Präposition בְּ bezeichnet hier das Geschehen innerhalb der betroffenen Gemeinschaft. „Unter ihnen“ wahrt diesen Sinn ohne die stärker deutende Wiedergabe „gegen sie“.
- source_word: מַגֵּפָה
  choice: eine Plage
  rationale: מַגֵּפָה bezeichnet häufig eine Plage oder einen tödlichen Schlag als Gericht. „Plage“ ist im Deutschen klar, würdig und kontextgerecht.
theological_decisions:
- issue: Unausgesprochenes göttliches Objekt bei וַיַּכְעִיסוּ
  choice: Das Objekt wird mit „ihn“ ergänzt und bezieht sich im Kontext auf Gott.
  alternative: „Sie erregten Zorn“ ohne ausdrückliches Objekt oder „sie machten Gott zornig“.
  rationale: Das Hebräische nennt das Objekt in diesem Satzglied nicht ausdrücklich; der Psalmzusammenhang macht jedoch Gott als Bezugsgröße deutlich. „Ihn“ schafft im Deutschen Klarheit, ohne den Gottesnamen in den Wortlaut einzufügen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Psalmton. Die Satzstruktur bleibt knapp und parallel; die genuine Ellipse des göttlichen Objekts wird durch das kontextuell notwendige Pronomen behutsam aufgelöst.
