source:
  edition: WLC
  text: לִ/רְא֤וֹת בְּ/ט֘וֹבַ֤ת בְּחִירֶ֗י/ךָ לִ֭/שְׂמֹחַ בְּ/שִׂמְחַ֣ת גּוֹיֶ֑/ךָ לְ֝/הִתְהַלֵּ֗ל עִם נַחֲלָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/005.yaml
  text: that I may see the good of your chosen ones[a], rejoice in the joy of your nation[b], and glory with your inheritance.
translation:
  language: de
  text: damit ich das Wohlergehen deiner Erwählten sehe, mich an der Freude deines Volkes freue und mich gemeinsam mit deinem Erbteil rühme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְאוֹת
  choice: damit ich ... sehe
  rationale: Der Infinitiv mit ל setzt die Zweck- bzw. Ergebnisfolge der Bitte aus dem vorherigen Vers fort; das konkrete Verb »sehen« bleibt erhalten.
- source_word: בְּטוֹבַת
  choice: das Wohlergehen
  rationale: טוֹבָה bezeichnet hier das Gute im Sinn des Wohlergehens, das Gottes Erwählte genießen; die Wiedergabe ist konkret und im Deutschen natürlich.
- source_word: בְּחִירֶיךָ
  choice: deiner Erwählten
  rationale: Die Bezeichnung meint die von Gott Erwählten, ohne dass dadurch ein späteres dogmatisches System in den Vers eingetragen wird.
- source_word: לִשְׂמֹחַ בְּשִׂמְחַת
  choice: mich an der Freude ... freue
  rationale: Die deutsche Wortverbindung bewahrt das hebräische Wortspiel zwischen Verb und stammverwandtem Substantiv und drückt zugleich Anteilnahme aus.
- source_word: גּוֹיֶךָ
  choice: deines Volkes
  rationale: גּוֹי kann »Nation« oder »Volk« bedeuten; »Volk« ist im Deutschen für Gottes Bundesvolk natürlicher, ohne die gemeinschaftliche Identität abzuschwächen.
- source_word: לְהִתְהַלֵּל
  choice: jubeln kann
  rationale: Der Hitpael von הלל bezeichnet hier freudiges Sich-Rühmen bzw. Frohlocken. »jubeln« gibt den positiven, gemeinschaftlichen Sinn idiomatisch wieder.
- source_word: עִם נַחֲלָתֶךָ
  choice: zusammen mit deinem Erbteil
  rationale: עִם bezeichnet Gemeinschaft; נַחֲלָה bleibt als theologischer Bundesbegriff mit »Erbteil« erhalten und bezeichnet Gottes Volk als seinen besonderen Besitz.
theological_decisions:
- issue: Bundesbezeichnungen für Gottes Volk
  choice: deiner Erwählten ... deines Volkes ... deinem Erbteil
  alternative: der von dir Erwählten ... deiner Nation ... deinem Eigentumsvolk
  rationale: Die drei unterschiedlichen hebräischen Bezeichnungen werden unterschieden wiedergegeben. So bleibt ihre bundestheologische Dichte erhalten, ohne sie zu einer späteren konfessionellen Lehre auszubauen.
- issue: Bedeutung von לְהִתְהַלֵּל im positiven Kontext
  choice: jubeln
  alternative: sich rühmen
  rationale: Beides ist lexikalisch möglich. »jubeln« vermeidet den im heutigen Deutsch oft negativen Beiklang von »sich rühmen« und passt zum Parallelismus mit Freude.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz ist als Fortsetzung der Bitte des vorherigen Verses formuliert. Das stammverwandte Paar »Freude ... freue« wurde bewusst bewahrt; »Erbteil« erhält die bildhafte und bundestheologische Sprache des Hebräischen.
