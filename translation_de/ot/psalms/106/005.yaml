  source_fidelity: 'Die Zweckfolge aus dem vorhergehenden Vers, das konkrete »sehen«, das Wohlergehen der Erwählten sowie die drei unterschiedlichen Bundesbezeichnungen sind im Wesentlichen treffend wiedergegeben. »Jubeln« ist für לְהִתְהַלֵּל jedoch zu unspezifisch: Es gibt das reflexive Sich-Rühmen bzw. Sich-Rühmen-in/Glorifizieren nicht hinreichend wieder. Das ergänzte »kann« ist im Hebräischen nicht ausgedrückt.'
