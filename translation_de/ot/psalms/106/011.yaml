  text: וַ/יְכַסּוּ מַ֥יִם צָרֵי/הֶ֑ם אֶחָ֥ד מֵ֝/הֶ֗ם לֹ֣א נוֹתָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/011.yaml
  text: The waters covered their adversaries[b][a]; not one of them remained.
translation:
  language: de
  text: Die Wasser bedeckten ihre Bedränger; kein Einziger von ihnen blieb übrig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַסּוּ
  choice: bedeckten
  rationale: Das Verb כסה bedeutet hier konkret „bedecken“. Im Zusammenhang mit dem Schilfmeer gibt diese Wiedergabe die sichtbare Wirkung des Wassers schlicht und unmittelbar wieder.
- source_word: מַיִם
  choice: die Wasser
  rationale: Der hebräische Plural wird beibehalten. Der bestimmte Artikel ist im Deutschen idiomatisch, da auf die bereits bekannten Wasser des Meeres Bezug genommen wird.
- source_word: צָרֵיהֶם
  choice: ihre Bedränger
  rationale: צָר bezeichnet feindlich auftretende Gegner. „Bedränger“ bewahrt sowohl die Gegnerschaft als auch den Aspekt des Bedrängens und passt in ein würdevolles, modernes Psalmregister.
- source_word: אֶחָד מֵהֶם
  choice: kein Einziger von ihnen
  rationale: Die wörtliche Wendung „einer von ihnen“ steht unter der Verneinung. „Kein Einziger von ihnen“ bringt die ausnahmslose Aussage im Deutschen klar und nachdrücklich zum Ausdruck.
- source_word: לֹא נוֹתָר
  choice: blieb übrig
  rationale: Der Nifal von יתר bedeutet „übrig bleiben, zurückbleiben“. „Blieb übrig“ gibt diesen Gedanken direkter wieder als das stärker deutende „überlebte“.
