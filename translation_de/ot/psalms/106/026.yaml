source:
  edition: WLC
  text: וַ/יִּשָּׂ֣א יָד֣/וֹ לָ/הֶ֑ם לְ/הַפִּ֥יל א֝וֹתָ֗/ם בַּ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/026.yaml
  text: So he raised his hand against them[a], to make them fall in the wilderness.
translation:
  language: de
  text: Da erhob er seine Hand gegen sie[a], um sie in der Wüste zu Fall zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da schwor er gegen sie“. Die hebräische Wendung „die Hand erheben“ kann besonders im Zusammenhang eines Gerichtsurteils eine Schwurgeste bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: erhob
  rationale: נשׂא bedeutet hier wörtlich „heben/erheben“. Zusammen mit „Hand“ bleibt das konkrete Bild des hebräischen Ausdrucks erhalten, ohne die mögliche Schwurbedeutung im Haupttext festzulegen.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: Die wörtliche Wiedergabe bewahrt Bild und Idiom; das Suffix der 3. Person Singular bezieht sich im Zusammenhang auf Gott.
- source_word: לָהֶם
  choice: gegen sie
  rationale: Die Präposition bedeutet grundsätzlich „zu/für sie“, bezeichnet in dieser Wendung und im Gerichtskontext jedoch die gegen sie gerichtete Handlung.
- source_word: לְהַפִּיל
  choice: um sie … fallen zu lassen
  rationale: 'Der Hifil-Infinitiv von נפל ist kausativ: „zu Fall bringen/fallen lassen“. Die Formulierung bildet diesen Kausativ transparent ab.'
- source_word: אֹתָם
  choice: sie
  rationale: Das direkte Objektspronomen wird unmittelbar wiedergegeben.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: „Wüste“ ist im Deutschen die natürliche, traditionsnahe Bezeichnung für מִדְבָּר im Zusammenhang der Wüstenwanderung.
theological_decisions:
- issue: Idiomhafte Bedeutung von „seine Hand erheben“
  choice: Das hebräische Bild bleibt im Haupttext erhalten; die mögliche Bedeutung als Schwurgeste wird in einer Fußnote genannt.
  alternative: „Er schwor gegen sie“ beziehungsweise „Er erhob seine Hand zum Schwur gegen sie“.
  rationale: Im Zusammenhang dürfte die Wendung einen feierlichen, gegen Israel gerichteten Gerichtsschwur Gottes bezeichnen. Da der hebräische Text das Schwören jedoch nicht ausdrücklich benennt, bewahrt die bildhafte Hauptfassung die echte sprachliche Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt klar und nah am hebräischen Text; „Da“ gibt die erzählerische Folge wieder. Die bewusste Wiederholung von „sie“ entspricht der hebräischen Struktur und ist im Deutschen verständlich.
