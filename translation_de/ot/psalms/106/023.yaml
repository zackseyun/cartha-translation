  text: וַ/יֹּ֗אמֶר לְֽ/הַשְׁמִ֫ידָ֥/ם לוּלֵ֡י מֹ֘שֶׁ֤ה בְחִיר֗/וֹ עָמַ֣ד בַּ/פֶּ֣רֶץ לְ/פָנָ֑י/ו לְ/הָשִׁ֥יב חֲ֝מָת֗/וֹ מֵֽ/הַשְׁחִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/023.yaml
  text: So he said he would destroy them—had not Moses[a], his chosen one, stood in the breach before him to turn back his wrath from destroying.
translation:
  language: de
  text: Da sagte er, er wolle sie vernichten — wäre nicht Mose, sein Erwählter, vor ihm in die Bresche getreten[a], um seinen Zorn davon abzuwenden, sie zu vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Bresche stand“. Das Bild ist das eines Menschen, der an einer Lücke in einer Mauer steht; hier beschreibt es Moses Eintreten für das Volk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das narrative וַ führt die Handlung weiter; „Da sagte er“ gibt den folgerichtigen Erzählfluss in natürlichem Deutsch wieder.
- source_word: לְהַשְׁמִידָם
  choice: er wolle sie vernichten
  rationale: Der Infinitiv mit ל nach „sagen“ bezeichnet die beabsichtigte Handlung. Der deutsche Konjunktiv I gibt die indirekte Rede präzise und idiomatisch wieder.
- source_word: לוּלֵי
  choice: wäre nicht
  rationale: לוּלֵי leitet eine irreale Ausnahmebedingung ein. Die Konstruktion „wäre nicht … getreten“ bewahrt diesen kontrafaktischen Sinn.
- source_word: בְחִירוֹ
  choice: sein Erwählter
  rationale: Die Bezeichnung meint den von Gott erwählten Mose. „Sein Erwählter“ ist knapp und würdig, ohne eine weitergehende Lehrdeutung einzutragen.
- source_word: עָמַד בַּפֶּרֶץ
  choice: in die Bresche getreten
  rationale: Die deutsche feste Wendung bewahrt das konkrete Bild eines Verteidigers, der sich an die Lücke einer Mauer stellt, und vermittelt zugleich natürlich Moses vermittelndes Eintreten.
- source_word: לְפָנָיו
  choice: vor ihm
  rationale: Das Suffix bezieht sich im Kontext am natürlichsten auf Gott. „Vor ihm“ wahrt die räumlich-relationale Ausdrucksweise des Hebräischen.
- source_word: לְהָשִׁיב חֲמָתוֹ
  choice: seinen Zorn … abzuwenden
  rationale: Der Hifil von שוב bezeichnet das Zurückwenden. Im Deutschen ist „Zorn abwenden“ idiomatisch und erhält die gerichtliche Aussagekraft von חֵמָה.
- source_word: מֵהַשְׁחִית
  choice: vom Verderben
  rationale: מִן mit Infinitiv bezeichnet hier die Verhinderung der zerstörerischen Handlung. Die substantivierte Wiedergabe vermeidet das im Deutschen missverständliche „vom Vernichten abzuwenden“ und lässt offen, ob das Objekt ausdrücklich wiederholt wird.
theological_decisions:
- issue: Anthropopathische Rede vom Zorn Gottes
  choice: „seinen Zorn“ wird ungemildert beibehalten.
  alternative: „sein Gericht“ oder „seinen Unmut“
  rationale: Der hebräische Text spricht ausdrücklich von Gottes חֵמָה. Die Übersetzung wahrt diese personale und theologisch spannungsreiche Rede, statt sie zu abstrahieren.
- issue: Moses vermittelndes Stehen in der Bresche
  choice: Das Bild wird als „in die Bresche getreten“ bewahrt.
  alternative: „für sie eingetreten“ oder „Fürbitte eingelegt“
  rationale: Die konkrete Mauerbreschen-Metapher gehört zur Aussage des Verses. Sie zeigt Moses vermittelndes Handeln, ohne es auf einen abstrakten theologischen Fachbegriff zu reduzieren.
- issue: Abwendung angekündigter Vernichtung
  choice: Der Text stellt Gottes Vernichtungsabsicht und die Abwendung seines Zorns durch Mose nebeneinander.
  alternative: Die Aussage als bloße Warnung oder als unveränderlichen Beschluss erklären.
  rationale: Die Übersetzung löst die Spannung zwischen göttlicher Ankündigung, Zorn und menschlicher Fürsprache nicht systematisch auf, sondern lässt sie wie im Ausgangstext bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bildet die kontrafaktische Unterbrechung nach. „In die Bresche treten“ ist eine geläufige deutsche Wendung und hält zugleich das hebräische Bild sichtbar; die Fußnote nennt die wörtlichere Form.
