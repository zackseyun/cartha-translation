source:
  edition: WLC
  text: מִ֗י יְ֭מַלֵּל גְּבוּר֣וֹת יְהוָ֑ה יַ֝שְׁמִ֗יעַ כָּל תְּהִלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/002.yaml
  text: Who can recount the mighty deeds of Yahweh[b][a], or proclaim all his praise?
translation:
  language: de
  text: Wer kann von Jahwes Machttaten erzählen[a] und sein ganzes Lob verkünden[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Jahwes Machttaten aufzählen“ oder „aussprechen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sein ganzes Lob hören lassen“.'
    reason: literal_rendering
lexical_decisions:
- source_word: מִי
  choice: Wer kann
  rationale: Das Fragewort eröffnet eine rhetorische Frage nach menschlichem Vermögen; „Wer kann“ gibt diese im Hebräischen implizierte Fähigkeit im Deutschen natürlich wieder.
- source_word: יְמַלֵּל
  choice: erzählen
  rationale: Das Piel von מלל bezeichnet hier das aussprechende Berichten oder Aufzählen. „erzählen“ passt zu konkreten Machttaten und wahrt den gehobenen poetischen Ton.
- source_word: גְּבוּרוֹת
  choice: Machttaten
  rationale: Der Plural bezeichnet machtvolle Taten beziehungsweise Erweise von Stärke. „Machttaten“ ist im Deutschen prägnant und konkret.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen übliche Form der wissenschaftlich begründeten Umschrift.
- source_word: יַשְׁמִיעַ
  choice: verkünden
  rationale: Das Hiphil von שמע bedeutet wörtlich „hören lassen“. „verkünden“ gibt die öffentliche, hörbare Bekanntmachung idiomatisch wieder.
- source_word: כָּל
  choice: all
  rationale: 'Die umfassende Aussage des Hebräischen bleibt erhalten: Gottes Lob kann nicht vollständig ausgesprochen werden.'
- source_word: תְּהִלָּתוֹ
  choice: sein Lob
  rationale: Der Singular mit Suffix wird formal gewahrt. „sein Lob“ kann sowohl den ihm zukommenden Lobpreis als auch seinen Ruhm bezeichnen, ohne diese Spannung einseitig aufzulösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen und nicht den Titel אֲדֹנָי. Daher wird der Name in der im Deutschen üblichen Form „Jahwe“ wiedergegeben statt durch einen Titel ersetzt.
- issue: Bedeutungsumfang von תְּהִלָּתוֹ
  choice: sein Lob
  alternative: seinen ganzen Ruhm
  rationale: „sein Lob“ bewahrt die mögliche Beziehung sowohl auf den Lobpreis, der Jahwe gilt, als auch auf das Lobenswerte an ihm. „Ruhm“ wäre flüssig, würde den Sinn jedoch stärker auf Ansehen beziehungsweise Herrlichkeit festlegen.
translation_notes:
  register: Moderne, würdige Psalmsprache. Die parallelen Verben „erzählen“ und „verkünden“ bilden die hebräische Gedankenbewegung natürlich ab; „all sein Lob“ erhält bewusst die knappe, umfassende Ausdrucksweise des Originals.
