id: PSA.106.25
reference: Psalms 106:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּרָגְנ֥וּ בְ/אָהֳלֵי/הֶ֑ם לֹ֥א שָׁ֝מְע֗וּ בְּ/ק֣וֹל יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/025.yaml
  text: So they grumbled in their tents[b][a]; they did not listen to the voice of Yahweh.
translation:
  language: de
  text: Sie murrten in ihren Zelten[a] und hörten nicht auf die Stimme Jahwes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beklagten sich“. Das hebräische Verb bezeichnet missmutiges, unzufriedenes Reden.'
    reason: lexical_alternative
  - marker: b
    text: 'Das kann auch bedeuten: „Sie gehorchten Jahwe nicht.“ Die hebräische Wendung „auf die Stimme hören“ schließt das Beachten und Befolgen ein.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרָגְנוּ
  choice: Sie murrten
  rationale: רגן bezeichnet missmutiges, unzufriedenes Reden. „murrten“ gibt diesen Sinn prägnant und in würdigem, noch allgemein verständlichem Deutsch wieder. Das וַ wird im Deutschen durch die Satzverknüpfung mit „und“ vor dem zweiten Teilsatz ausreichend abgebildet.
- source_word: בְאָהֳלֵיהֶם
  choice: in ihren Zelten
  rationale: אֹהֶל bedeutet konkret „Zelt“; das Bild des Wüstenaufenthalts wird daher bewahrt.
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: hörten nicht auf die Stimme
  rationale: Die Wendung שׁמע בקול umfasst sowohl Hören als auch Beachten beziehungsweise Gehorchen. Die deutsche idiomatische Formulierung „auf die Stimme hören“ bewahrt das Sprachbild und lässt den Gehorsamsaspekt anklingen, ohne ihn festzuschreiben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name mit der im Deutschen üblichen Form „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt diese Unterscheidung gegenüber dem Titel „Herr“.
- issue: Bedeutungsumfang von שׁמע בקול
  choice: hörten nicht auf die Stimme
  alternative: gehorchten nicht
  rationale: Die gewählte Form erhält die konkrete hebräische Redeweise und zugleich deren möglichen Sinn des Beachtens und Gehorchens. Die Fußnote macht diesen Bedeutungsumfang ausdrücklich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „murrten“ bewahrt den knappen und wertenden Ton des Hebräischen; die idiomatische Wendung „auf die Stimme hören“ erhält sowohl das Hörbild als auch den Gehorsamsaspekt.
