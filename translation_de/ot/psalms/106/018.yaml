  text: וַ/תִּבְעַר אֵ֥שׁ בַּ/עֲדָתָ֑/ם לֶ֝הָבָ֗ה תְּלַהֵ֥ט רְשָׁעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/018.yaml
  text: And fire burned among their company[c][b][a]; a flame consumed the wicked.
translation:
  language: de
  text: Und Feuer entbrannte in ihrer Gemeinde; eine Flamme verzehrte die Gottlosen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּבְעַר
  choice: entbrannte
  rationale: Das Verb בער bezeichnet hier das Entbrennen beziehungsweise Brennen eines Feuers. „Entbrannte“ gibt den Ausbruch des Feuers natürlich und prägnant wieder.
- source_word: אֵשׁ
  choice: Feuer
  rationale: Die Grundbedeutung ist „Feuer“; der Zusammenhang bietet keinen Anlass für eine übertragene Wiedergabe.
- source_word: בַּעֲדָתָם
  choice: in ihrer Gemeinde
  rationale: עֵדָה bezeichnet eine versammelte Gemeinschaft. „Gemeinde“ bewahrt den kollektiven Sinn, ohne den Ausdruck auf eine moderne Organisation einzuengen; ב wird örtlich mit „in“ wiedergegeben.
- source_word: לֶהָבָה
  choice: eine Flamme
  rationale: Die konkrete Bedeutung „Flamme“ erhält den poetischen Parallelismus zu „Feuer“.
- source_word: תְּלַהֵט
  choice: verzehrte
  rationale: Die Intensivform von להט bezeichnet heftiges, zerstörerisches Brennen. „Verzehrte“ bringt die Wirkung des Feuers idiomatisch zum Ausdruck.
- source_word: רְשָׁעִים
  choice: die Gottlosen
  rationale: Das substantivierte Pluraladjektiv bezeichnet moralisch Schuldige beziehungsweise Frevler. „Die Gottlosen“ ist eine geläufige, würdevolle Wiedergabe im Psalmenkontext, ohne ein zusätzliches Geschlecht einzutragen.
theological_decisions:
- issue: Bezug der Gerichtssprache
  choice: Konkretes Feuer trifft die Gottlosen innerhalb der versammelten Gemeinschaft.
  alternative: Allgemeines Sinnbild göttlichen Gerichts
  rationale: Der unmittelbare Zusammenhang erinnert an geschichtliche Gerichte während der Auflehnung. Die Übersetzung wahrt daher die konkrete Bild- und Erzählebene, ohne sie dogmatisch auszuweiten.
translation_notes:
  register: Moderne, würdevolle Psalmsprache mit knapper poetischer Parallelstruktur. „Gemeinde“ wird im älteren, allgemeinen Sinn einer versammelten Gemeinschaft gebraucht; der Vers lässt sich ohne erläuterungsbedürftige Fußnote klar wiedergeben.
