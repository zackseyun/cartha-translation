source:
  edition: WLC
  text: וּ/לְ/הַפִּ֣יל זַ֭רְעָ/ם בַּ/גּוֹיִ֑ם וּ֝/לְ/זָרוֹתָ֗/ם בָּ/אֲרָצֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/027.yaml
  text: and to make their offspring fall among the nations[b][a], and to scatter them through the lands.
translation:
  language: de
  text: und ihre Nachkommen unter den Völkern zu Fall zu bringen und sie über die Länder zu zerstreuen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְהַפִּיל
  choice: und … zu Fall zu bringen
  rationale: Der Hifil-Infinitiv von נפל hat kausative Bedeutung. »Zu Fall bringen« bewahrt diese, ohne die Aussage auf Tod oder militärische Niederlage einzuengen.
- source_word: זַרְעָם
  choice: ihre Nachkommen
  rationale: זֶרַע bedeutet wörtlich »Same«, bezeichnet hier jedoch die Nachkommenschaft. »Nachkommen« ist im modernen Deutschen klar und natürlich.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: גּוֹיִם bezeichnet hier die fremden Völker, unter denen Israels Nachkommen zu Fall gebracht werden sollen. »Völker« vermeidet unnötige spätere Konnotationen von »Heiden«.
- source_word: וּלְזָרוֹתָם
  choice: und sie … zu zerstreuen
  rationale: זרה kann »worfeln« oder »zerstreuen« bedeuten. Im Zusammenhang des Gerichts und der Verteilung über mehrere Länder gibt »zerstreuen« den Sinn angemessen wieder.
- source_word: בָּאֲרָצוֹת
  choice: über die Länder
  rationale: Der Plural von אֶרֶץ bezeichnet mehrere Länder. Zusammen mit »zerstreuen« drückt »über die Länder« eine weiträumige Verteilung idiomatisch aus.
theological_decisions:
- issue: Art des angekündigten Gerichts
  choice: Der Vers beschreibt ein Gericht, bei dem die Nachkommen unter den Völkern zu Fall gebracht und über verschiedene Länder zerstreut werden.
  alternative: Die erste Zeile könnte enger als Tötung oder Niederwerfung der Nachkommen unter den Völkern verstanden werden.
  rationale: Das kausative נפל ist weiter gefasst als »töten«. Der Parallelismus mit dem Zerstreuen legt Gericht und Zerstreuung nahe, ohne die erste Aussage eindeutig auf den Tod zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Infinitivanschluss an den vorausgehenden Kontext wird beibehalten. »Zu Fall bringen« wahrt die Spannung der allgemeinen Gerichtsaussage; »über die Länder zerstreuen« klingt natürlich und entspricht dem räumlichen Plural.
