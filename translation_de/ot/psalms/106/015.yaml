  text: So he gave them what they asked for[c][b][a], but sent leanness into their soul.
translation:
  language: de
  text: Er gab ihnen, worum sie gebeten hatten[a], doch sandte er Auszehrung[b] in ihr Leben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Bitte“ oder „das Erbetene“.'
