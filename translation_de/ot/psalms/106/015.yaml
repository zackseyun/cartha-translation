  source_fidelity: Der Entwurf gibt die Satzstruktur und die zentralen Lexeme zutreffend wieder. „Verlangt hatten“ kann jedoch gegenüber שְׁאֵלָתָם („Bitte, Erbetenes“) eine nicht ausdrücklich im Wort selbst liegende Forderungshaltung nahelegen. „Worum sie gebeten hatten“ ist näher am hebräischen Ausdruck. Das einleitende „Da“ ist nicht erforderlich, da die hebräische Verbform hier keine zwingende zeitliche Abfolge über die Erzählfortsetzung hinaus markiert.
  naturalness: „Auszehrung in ihr Leben senden“ ist zwar verständlich, wirkt im Deutschen jedoch leicht ungewohnt. Die vorgeschlagene Fassung behält die knappe, poetische Satzfügung bei; „in ihr Leben“ bleibt als bewusste, weit gefasste Wiedergabe von בְּנַפְשָׁם möglich und wird durch die Fußnote erläutert.
  terminology: „Auszehrung“ ist eine angemessene Wiedergabe von רָזוֹן und wahrt die körperlich-existenzielle Bildsprache. „Leben“ für נֶפֶשׁ vermeidet eine unangemessene Verengung auf die immaterielle Seele; die Fußnote muss die relevante Alternative „Seele“ ausdrücklich nennen.
