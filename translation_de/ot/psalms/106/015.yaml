lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Da gab er
  rationale: Das Verb נתן bedeutet unmittelbar „geben“. „Da“ gibt die fortlaufende hebräische Erzählform natürlich wieder, ohne den Sinn stärker als nötig auszulegen.
- source_word: לָהֶם
  choice: ihnen
  rationale: Das indirekte Objekt wird im Deutschen direkt mit „ihnen“ wiedergegeben.
- source_word: שֶׁאֱלָתָם
  choice: was sie verlangt hatten
  rationale: שְׁאֵלָה bezeichnet eine Bitte beziehungsweise das Erbetene. In diesem Zusammenhang bringt „was sie verlangt hatten“ sowohl den Gegenstand ihrer Bitte als auch den vorwurfsvollen Kontext natürlich zum Ausdruck; „ihre Bitte“ bleibt als Alternative in der Fußnote erhalten.
- source_word: וַיְשַׁלַּח
  choice: doch er sandte
  rationale: Wörtlich steht „und er sandte“. Das deutsche „doch“ macht den im Kontext liegenden Gegensatz zwischen Gewährung und Gericht sichtbar, ohne ein zusätzliches Ereignis einzuführen.
- source_word: רָזוֹן
  choice: Auszehrung
  rationale: רָזוֹן kann Magerkeit, Abmagerung oder Auszehrung bezeichnen. „Auszehrung“ bewahrt den kräftigen, körperlich-existenziellen Charakter des Ausdrucks und ist im modernen Deutschen verständlicher als das substantivierte „Magerkeit“.
- source_word: בְּנַפְשָׁם
  choice: in ihr Leben
  rationale: נֶפֶשׁ bezeichnet hier nicht eindeutig eine vom Körper getrennte Seele, sondern kann Leben, Person oder ganzes Sein meinen. „In ihr Leben“ bewahrt die Präposition und vermeidet zugleich eine unnötige anthropologische Festlegung.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im Zusammenhang göttlichen Gerichts
  choice: „Leben“ im Haupttext
  alternative: „Seele“, „Innerstes“ oder „ganzes Sein“
  rationale: Das hebräische נֶפֶשׁ hat ein breiteres Bedeutungsspektrum als das moderne deutsche „Seele“. „Leben“ lässt offen, ob die Auszehrung körperlich, innerlich oder umfassend verstanden werden soll, und die Fußnote bewahrt die echte lexikalische Mehrdeutigkeit.
- issue: Verhältnis der beiden Satzhälften
  choice: adversatives „doch“
  alternative: wörtliches „und“
  rationale: Die Gewährung des Verlangten und die zugleich gesandte Auszehrung stehen erkennbar in spannungsvollem Gegensatz. „Doch“ bildet diese pragmatische Beziehung ab, ohne das göttliche Handeln harmonisierend zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt knapp und parallel. „Auszehrung“ wahrt die bildhafte Härte des Hebräischen; die Fußnoten markieren die lexikalischen Alternativen, ohne den Haupttext mit Erläuterungen zu belasten.
