  text: but they mixed with the nations and learned their practices[a][b].
translation:
  language: de
  text: Doch sie vermischten sich mit den Völkern[a] und lernten ihre Bräuche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mischten sich unter die Völker“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ihre Taten“ oder „ihre Werke“; gemeint sind hier die üblichen Handlungsweisen der Völker.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעָרְבוּ
  choice: sie vermischten sich
  rationale: Das Hitpael von ערב bezeichnet hier ein Sichvermischen beziehungsweise eine enge soziale Verbindung mit den umliegenden Völkern. „Sie vermischten sich“ ist im Deutschen natürlich und bewahrt den Gedanken zunehmender Angleichung, ohne ihn übermäßig auszudeuten.
- source_word: בַגּוֹיִם
  choice: mit den Völkern
  rationale: גּוֹיִם bedeutet hier die nichtisraelitischen Völker Kanaans. „Mit den Völkern“ passt idiomatisch zu „sich vermischen“; „Heiden“ würde religiöse Wertung und spätere Konnotationen stärker in den Wortlaut eintragen.
- source_word: וַיִּלְמְדוּ
  choice: und lernten
  rationale: Die aktive Qal-Form wird direkt wiedergegeben. So bleibt erkennbar, dass Israel die Handlungen der Völker übernahm, statt lediglich passiv unterwiesen zu werden.
- source_word: מַעֲשֵׂיהֶם
  choice: ihre Bräuche
  rationale: Wörtlich bezeichnet der Ausdruck „ihre Taten/Werke“. Im Zusammenhang sind die gewohnheitsmäßigen, auch religiösen Handlungen der Völker gemeint. „Bräuche“ ist verständlich und kontextgerecht, ohne ausschließlich kultische Praktiken zu behaupten.
theological_decisions:
- issue: Moralisch-religiöse Bedeutung der Verbindung Israels mit den Völkern
  choice: Die schuldhafte Angleichung wird durch „vermischten sich … und lernten ihre Bräuche“ angedeutet, ohne eine ausdrückliche Verurteilung hinzuzufügen.
  alternative: 'Neutraler: „lebten unter den Völkern“; stärker deutend: „verunreinigten sich durch die Völker“.'
  rationale: Der hebräische Vers nennt die Vermischung und das Lernen; die negative Bewertung ergibt sich aus dem Psalmzusammenhang. Die Übersetzung soll diese Spannung bewahren und weder abschwächen noch verschärfen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ stellt den Gegensatz zum vorausgehenden Ungehorsam prägnant heraus. Die Satzstruktur bleibt eng am hebräischen Parallelismus; die Fußnoten sichern die wörtlicheren Alternativen.
