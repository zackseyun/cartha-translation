  source_fidelity: „Doch sie vermischten sich mit den Völkern und lernten ihre Bräuche“ gibt die beiden hebräischen Verben (Hitpael von ערב; Qal von למד) und ihre Ergänzungen sachgerecht wieder. „Mit den Völkern“ ist für בַגּוֹיִם möglich; die Fußnote nennt zutreffend die ebenfalls naheliegende räumliche Nuance „unter die Völker“. Die aktive Form von „lernten“ erhält die im Hebräischen ausgedrückte Eigenbeteiligung. „Bräuche“ ist im Kontext eine angemessene idiomatische Wiedergabe von מַעֲשֵׂיהֶם, ohne die folgenden konkreten Kultpraktiken vorwegzunehmen.
  naturalness: Der Satz ist flüssiges, modernes Standarddeutsch und bewahrt einen würdevollen biblischen Registerton. „Doch“ stellt den kontextuellen Gegensatz verständlich her, ohne dem einzelnen hebräischen Vers eine zusätzliche explizite Wertung aufzuerlegen.
  terminology: „Völker“ vermeidet die anachronistisch oder konfessionell stärker gefärbte Alternative „Heiden“. „Bräuche“ vermittelt die kontextuell gemeinten übernommenen Verhaltensweisen; die Fußnote sichert die wörtlicheren Möglichkeiten „Taten“ und „Werke“.
