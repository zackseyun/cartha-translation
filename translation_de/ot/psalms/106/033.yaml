  text: כִּֽי הִמְר֥וּ אֶת רוּח֑/וֹ וַ֝/יְבַטֵּ֗א בִּ/שְׂפָתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/033.yaml
  text: For they embittered his spirit[b][a], and he spoke rashly with his lips.
translation:
  language: de
  text: Denn sie reizten seinen Geist[a], und er redete unbedacht mit seinen Lippen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie widersetzten sich seinem Geist«. Das hebräische Verb kann widersetzliches Handeln oder das Reizen/Provozieren ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist Mose bei Meriba; vgl. 4. Mose 20,10.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die unmittelbar vorausgehende Aussage und fügt sich natürlich in den erklärenden Zusammenhang ein.
- source_word: הִמְרוּ
  choice: sie erbitterten
  rationale: Mit רוּחוֹ als direktem Objekt gibt die kausative Bedeutung »erbitterten« den Sinn gut wieder; die mögliche Nuance des Reizens wird in der Fußnote bewahrt.
- source_word: אֶת רוּחוֹ
  choice: seinen Geist
  rationale: Gemeint ist hier Moses innere Verfassung, nicht der Heilige Geist. »Geist« bewahrt dennoch den anthropologischen Ausdruck des Hebräischen.
- source_word: וַיְבַטֵּא
  choice: er redete unbedacht
  rationale: Das Verb bezeichnet ein unbesonnenes oder vorschnelles Äußern. »Unbedacht reden« vermittelt die negative Bedeutung in natürlichem, modernem Deutsch.
- source_word: בִּשְׂפָתָיו
  choice: mit seinen Lippen
  rationale: Die konkrete hebräische Redeweise bleibt erhalten und ist auch im Deutschen klar verständlich.
theological_decisions:
- issue: Bezug der Pronomen in »seinen Geist« und »seinen Lippen«
  choice: Die Pronomen beziehen sich auf Mose.
  alternative: Die Pronomen beziehen sich auf das Volk als Kollektiv oder auf einen anderen vorausgehenden Bezugsträger.
  rationale: Im Bericht des Psalms über Meriba führt das Verhalten des Volkes zu Moses unbedachtem Reden. Dies entspricht 4. Mose 20,10 und vermeidet einen vom Zusammenhang nicht angezeigten Bezug auf den Heiligen Geist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Wendung »mit seinen Lippen« und der mehrdeutige anthropologische Begriff »Geist« bleiben erhalten; die Fußnoten erläutern die lexikalische Spannweite und den erzählerischen Bezug.
