  text: וַ/יַּעַבְד֥וּ אֶת עֲצַבֵּי/הֶ֑ם וַ/יִּהְי֖וּ לָ/הֶ֣ם לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/036.yaml
  text: They served their idols[a], and they became a snare to them.
translation:
  language: de
  text: Sie dienten ihren Götzen[a], und diese wurden ihnen zur Falle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie verehrten ihre Götzenbilder, und diese wurden ihnen zur Schlinge.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: sie dienten
  rationale: Das Qal von עבד bezeichnet hier den religiösen Dienst an fremden Göttern. „Dienten“ bewahrt die Ausdrucksweise des Hebräischen; „verehrten“ wäre ebenfalls möglich, aber deutender.
- source_word: עֲצַבֵּיהֶם
  choice: ihren Götzen
  rationale: עֲצַבִּים bezeichnet in polemischem Zusammenhang Götzen beziehungsweise Götzenbilder. „Götzen“ gibt den abwertenden Sinn im modernen Deutsch klar wieder.
- source_word: וַיִּהְיוּ
  choice: diese wurden
  rationale: היה mit לְמוֹקֵשׁ beschreibt hier eine eintretende Wirkung oder Funktion. „Wurden“ gibt diesen Folgesinn natürlich wieder; „diese“ macht den im Deutschen sonst missverständlichen Rückbezug auf die Götzen deutlich.
- source_word: לָהֶם
  choice: ihnen
  rationale: Die Präposition ל bezeichnet die Beziehung beziehungsweise die schädliche Wirkung auf das Volk; „ihnen“ entspricht der deutschen Fügung „jemandem zur Falle werden“.
- source_word: לְמוֹקֵשׁ
  choice: zur Falle
  rationale: מוֹקֵשׁ bezeichnet eine Falle oder Schlinge und wird hier bildlich für etwas gebraucht, das Menschen ins Verderben verstrickt. „Zur Falle“ ist präzise und im heutigen Deutsch natürlich.
theological_decisions:
- issue: Bezugswort des pluralischen וַיִּהְיוּ („sie wurden“)
  choice: Die Götzen wurden dem Volk zur Falle.
  alternative: Der Dienst an den Götzen wurde ihnen zur Falle.
  rationale: Das nächstliegende grammatische Bezugswort ist das pluralische „ihre Götzen“. Durch „diese“ wird dieser Bezug im Deutschen kenntlich gemacht, ohne die Aussage weiter auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „jemandem zur Falle werden“ bewahrt das biblische Bild und bleibt allgemein verständlich; der demonstrative Rückverweis „diese“ verhindert, dass „sie“ fälschlich auf die Israeliten bezogen wird.
