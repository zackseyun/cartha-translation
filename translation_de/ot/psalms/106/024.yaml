  text: וַֽ֭/יִּמְאֲסוּ בְּ/אֶ֣רֶץ חֶמְדָּ֑ה לֹֽא הֶ֝אֱמִ֗ינוּ לִ/דְבָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/024.yaml
  text: Then they despised the pleasant land[b][a]; they did not believe his word.
translation:
  language: de
  text: Dann verschmähten sie das begehrenswerte Land[a]; sie glaubten seinem Wort nicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „das kostbare Land“ oder „das herrliche Land“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „sie vertrauten seinem Wort nicht“; „sein Wort“ kann hier auch als „seine Verheißung“ verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: Dann verschmähten sie
  rationale: מאס bezeichnet ein ablehnendes Verwerfen oder Verachten. „Verschmähten“ gibt die bewusste Geringschätzung kräftig und idiomatisch wieder; „Dann“ bildet die erzählerische Fortführung durch וַ ab.
- source_word: בְּאֶרֶץ חֶמְדָּה
  choice: das begehrenswerte Land
  rationale: אֶרֶץ bezeichnet hier das verheißene Land; חֶמְדָּה hebt dessen begehrenswerte, erfreuliche Qualität hervor. Die deutsche Formulierung bleibt nah am hebräischen Ausdruck, ohne „verheißen“ ausdrücklich einzutragen.
- source_word: לֹא הֶאֱמִינוּ
  choice: sie glaubten … nicht
  rationale: Der Hifil von אמן kann „glauben“ oder „vertrauen“ bedeuten. Mit „seinem Wort glauben“ ist die Formulierung im Deutschen natürlich und bewahrt die Bedeutungsbreite möglichst weit.
- source_word: לִדְבָרוֹ
  choice: seinem Wort
  rationale: דָּבָר kann „Wort“, „Aussage“ oder im Kontext „Verheißung“ meinen. „Seinem Wort“ entspricht der offenen Formulierung des Hebräischen und legt die kontextuelle Zuspitzung nicht im Haupttext fest.
theological_decisions:
- issue: Ob לִדְבָרוֹ ausdrücklich als Gottes Verheißung über das Land wiederzugeben ist
  choice: seinem Wort
  alternative: seiner Verheißung
  rationale: Der Zusammenhang legt Gottes Zusage nahe, doch der hebräische Text verwendet das breitere דָּבָר. Der Haupttext bewahrt diese Breite; die kontextuell plausible Deutung steht in der Fußnote.
- issue: Ob הֶאֱמִינוּ als Glauben oder Vertrauen wiederzugeben ist
  choice: glaubten
  alternative: vertrauten
  rationale: Beide Bedeutungen sind möglich. „Seinem Wort glauben“ entspricht der unmittelbaren Konstruktion und lässt zugleich erkennen, dass ihr Unglaube mangelndes Vertrauen einschloss.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Verschmähten“ bewahrt den scharfen Vorwurfscharakter; „begehrenswert“ bildet חֶמְדָּה transparent ab. Die Satzstruktur folgt der knappen Parallelität des Hebräischen.
