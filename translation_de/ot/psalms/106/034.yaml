id: PSA.106.34
reference: Psalms 106:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹֽא הִ֭שְׁמִידוּ אֶת הָֽ/עַמִּ֑ים אֲשֶׁ֤ר אָמַ֖ר יְהוָ֣ה לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/034.yaml
  text: They did not destroy the peoples whom Yahweh had told them to destroy[a].
translation:
  language: de
  text: Sie vernichteten die Völker nicht, die zu vernichten Jahwe ihnen aufgetragen hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie vernichteten die Völker nicht, die Jahwe ihnen gesagt hatte.“ Der Inhalt der Anweisung bleibt im Hebräischen unausgesprochen; aus dem Zusammenhang ist „zu vernichten“ zu ergänzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: nicht
  rationale: Die einfache hebräische Verneinung wird im deutschen Präteritum natürlich mit „nicht“ wiedergegeben.
- source_word: הִשְׁמִידוּ
  choice: vernichteten
  rationale: Der Hifil von שׁמד bezeichnet das Herbeiführen von Vernichtung oder Beseitigung. „Vernichten“ gibt die Stärke des Verbs wieder, ohne sie durch „ausrotten“ oder „auslöschen“ weiter zu spezifizieren.
- source_word: אֶת הָעַמִּים
  choice: die Völker
  rationale: Der Plural עַמִּים bezeichnet mehrere Volksgruppen; „die Völker“ bewahrt diesen ethnischen Pluralsinn.
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen bezieht sich auf „die Völker“. In der deutschen Satzgestaltung leitet „die“ den Relativsatz ein, dessen elliptischer Inhalt sinngemäß ergänzt wird.
- source_word: אָמַר
  choice: aufgetragen hatte
  rationale: Wörtlich steht „sagte“. Zusammen mit לָהֶם und dem im Hebräischen ausgelassenen Inhalt bezeichnet es hier eine vorausgehende Anweisung. „Aufgetragen hatte“ ist im Deutschen natürlich, vermeidet aber das stärkere und stärker ausdeutende „befohlen hatte“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָהֶם
  choice: ihnen
  rationale: Das pronominale indirekte Objekt wird als „ihnen“ wiedergegeben und in die natürliche deutsche Konstruktion „ihnen aufgetragen hatte“ eingebunden.
theological_decisions:
- issue: Elliptischer Inhalt nach „Jahwe sagte ihnen“
  choice: „die zu vernichten Jahwe ihnen aufgetragen hatte“
  alternative: „von denen Jahwe zu ihnen gesprochen hatte“
  rationale: 'Der hebräische Text lautet wörtlich sinngemäß: „Sie vernichteten die Völker nicht, die Jahwe ihnen gesagt hatte.“ Der Inhalt des Gesagten bleibt grammatisch unausgesprochen. Der vorangehende Satzteil und der weitere Zusammenhang machen das Vernichten der Völker zur naheliegenden Ergänzung. Die Fußnote bewahrt die formale Ellipse und weist auf die Ergänzung hin.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorangestellte Infinitivgruppe „die zu vernichten …“ hält den Bezug auf die Völker klar und vermeidet die mögliche Fehlbeziehung in „die Jahwe ihnen aufzutragen hatte zu vernichten“.
