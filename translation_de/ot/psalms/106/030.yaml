source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד פִּֽ֭ינְחָס וַ/יְפַלֵּ֑ל וַ֝/תֵּעָצַ֗ר הַ/מַּגֵּפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/030.yaml
  text: Then Phinehas stood up and interceded[a], and the plague was stopped.
translation:
  language: de
  text: Da trat Pinhas auf und griff ein[a], und die Plage wurde aufgehalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vollzog das Urteil“; alternativ: „trat fürbittend ein“ oder „betete“. Das hebräische Verb kann hier richterliches oder fürbittendes Handeln bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: trat … auf
  rationale: עמד bedeutet wörtlich „stehen“ oder „sich hinstellen“. Im erzählenden Zusammenhang bezeichnet „trat … auf“ sowohl das Sich-Erheben als auch das entschlossene Handeln, ohne die folgende Tat näher festzulegen.
- source_word: פִּינְחָס
  choice: Pinhas
  rationale: Der Personenname wird nach einer im Deutschen gebräuchlichen, dem Hebräischen nahen Form wiedergegeben.
- source_word: וַיְפַלֵּל
  choice: griff ein
  rationale: Die Verbform von פלל kann hier richterliches Handeln oder ein fürbittendes Eintreten bezeichnen. „griff ein“ bewahrt diese Bedeutungsbreite und passt zum Rückbezug auf Numeri 25, ohne ausschließlich Gebet oder Strafvollzug festzuschreiben.
- source_word: וַתֵּעָצַר
  choice: wurde aufgehalten
  rationale: Das Nifal von עצר bezeichnet hier, dass etwas gehemmt oder zum Stillstand gebracht wurde. „wurde aufgehalten“ ist klar und gibt die Ergebnisfolge natürlich wieder.
- source_word: הַמַּגֵּפָה
  choice: die Plage
  rationale: מגפה bezeichnet eine tödliche Plage oder Seuche. „Plage“ ist im Kontext von Numeri 25 sachgerecht und in biblischer Sprache weiterhin allgemein verständlich.
theological_decisions:
- issue: Bedeutung von וַיְפַלֵּל im Blick auf Pinhas’ Handeln
  choice: Im Haupttext weit gefasst mit „griff ein“ wiedergegeben
  alternative: '„vollzog das Urteil“; alternativ: „trat fürbittend ein“ oder „betete“'
  rationale: Der Psalm spielt auf Numeri 25 an, wo Pinhas durch entschlossenes Handeln die Plage beendet. Das hebräische Verb lässt hier sowohl eine richterliche als auch eine fürbittende Deutung zu. Die offene Formulierung im Haupttext und die Fußnote bewahren diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur folgt dem hebräischen Parallelismus; „griff ein“ bleibt bewusst offen. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
