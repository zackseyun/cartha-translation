  text: כִּ֤י הִצַּ֪לְתָּ נַפְשִׁ֡/י מִ/מָּוֶת֮ הֲ/לֹ֥א רַגְלַ֗/י מִ֫/דֶּ֥חִי לְ֭/הִֽתְהַלֵּךְ לִ/פְנֵ֣י אֱלֹהִ֑ים בְּ֝/א֗וֹר הַֽ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/013.yaml
  text: For you have delivered my soul from death[a]; have you not also kept my feet from stumbling[d][c][b], that I may walk before God in the light of life?
translation:
  language: de
  text: Denn du hast mein Leben vor dem Tod gerettet[a]; hast du nicht auch meine Füße vor dem Sturz bewahrt[b], damit ich vor Gott wandle im Licht des Lebens[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »meine Seele«. Das hebräische Wort kann auch das Leben oder die ganze Person bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »vor dem Straucheln«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »im Licht der Lebenden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Zuversicht beziehungsweise den Dank und klingt im deutschen Psalmstil natürlich.
- source_word: הִצַּלְתָּ נַפְשִׁי מִמָּוֶת
  choice: du hast mein Leben vor dem Tod gerettet
  rationale: נֶפֶשׁ bezeichnet hier angesichts des Todes am natürlichsten das Leben beziehungsweise die ganze Person; die Formulierung vermeidet eine unnötige Festlegung auf eine technische Seelenlehre.
- source_word: הֲלֹא
  choice: ja
  rationale: Die rhetorische Frage erwartet Zustimmung. Im Deutschen gibt „ja“ ihre bekräftigende Kraft natürlich wieder, ohne eine schwerfällige unvollständige Frage zu erzeugen.
- source_word: רַגְלַי מִדֶּחִי
  choice: meine Füße vor dem Sturz
  rationale: Die konkrete Bildsprache der Füße bleibt erhalten; דֶּחִי kann einen Sturz oder ein Straucheln bezeichnen.
- source_word: לְהִתְהַלֵּךְ
  choice: damit ich … wandle
  rationale: לְ kennzeichnet hier Zweck oder Folge. „Wandle“ bewahrt die poetische Vorstellung einer Lebensführung, ist im Deutschen jedoch gehobener als „gehe“.
- source_word: לִפְנֵי אֱלֹהִים
  choice: vor Gott
  rationale: Dies entspricht knapp und unmittelbar der räumlich wie relational deutbaren Wendung „vor dem Angesicht Gottes“.
- source_word: בְּאוֹר הַחַיִּים
  choice: im Licht des Lebens
  rationale: Die Wiedergabe erhält die offene poetische Genitivverbindung und legt sie nicht vorschnell als bloßen Aufenthalt unter den Lebenden aus.
theological_decisions:
- issue: Anthropologische Bedeutung von נַפְשִׁי
  choice: mein Leben
  alternative: meine Seele
  rationale: Im Zusammenhang mit „Tod“ bezeichnet נֶפֶשׁ wahrscheinlich das bedrohte Leben beziehungsweise die ganze Person. „Mein Leben“ ist im heutigen Deutsch verständlich und vermeidet, eine Leib-Seele-Lehre in den Vers hineinzulesen; die formnähere Alternative wird in der Fußnote bewahrt.
- issue: Bedeutung von „im Licht des Lebens“
  choice: im Licht des Lebens
  alternative: im Licht der Lebenden
  rationale: Der hebräische Wortlaut lässt eine poetische Aussage über Leben und Gottes Gegenwart zu. Die Übersetzung bewahrt diese Spannung, statt die Wendung ausschließlich auf das Land der Lebenden zu beziehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Prägung. „Wandle“ ist bewusst gehoben und greift die Lebensweg-Metaphorik auf; ansonsten bleibt die Syntax klar und gegenwärtig. Die bekräftigende Partikel „ja“ gibt die rhetorische Frage idiomatisch wieder.
