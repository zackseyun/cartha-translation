  text: עָלַ֣/י אֱלֹהִ֣ים נְדָרֶ֑י/ךָ אֲשַׁלֵּ֖ם תּוֹדֹ֣ת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/012.yaml
  text: Your vows are upon me[a], O God[b]; I will render thank offerings to you.
translation:
  language: de
  text: Deine Gelübde liegen auf mir[a], Gott; ich werde dir Dankopfer[b] darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß: »Meine Gelübde an dich verpflichten mich.« Wörtlich steht im Hebräischen »deine Gelübde«; gemeint sind wahrscheinlich die Gott geschuldeten Gelübde.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Danksagungen«. Das hebräische Wort kann sowohl Dankäußerungen als auch Dankopfer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי
  choice: liegen auf mir
  rationale: Die Wendung bewahrt das hebräische Bild und lässt zugleich erkennen, dass die Gelübde den Sprecher verpflichten.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv steht hier als direkte Anrede; im Deutschen ist dafür kein zusätzliches Anredewort nötig.
- source_word: נְדָרֶיךָ
  choice: deine Gelübde
  rationale: Die Form trägt ein Suffix der zweiten Person Singular und heißt formal »deine Gelübde«. Gemeint sind wahrscheinlich die Gott geschuldeten, an ihn gerichteten Gelübde; diese Deutung wird jedoch nicht stillschweigend in den Haupttext eingesetzt.
- source_word: אֲשַׁלֵּם
  choice: ich werde … darbringen
  rationale: Das Piel von שלם bezeichnet das Begleichen oder Erfüllen einer Verpflichtung. In Verbindung mit Dankopfern ist »darbringen« natürliches Deutsch und vermittelt die geschuldete Vollziehung.
- source_word: תּוֹדֹת
  choice: Dankopfer
  rationale: Das Wort kann Dankäußerungen oder kultische Dankopfer bezeichnen. Der Zusammenhang mit Gelübden und dem Verb שלם spricht hier eher für Opfergaben.
- source_word: לָךְ
  choice: dir
  rationale: ל kennzeichnet den Empfänger; der deutsche Dativ gibt dies knapp und idiomatisch wieder.
theological_decisions:
- issue: Bezug der Formulierung »deine Gelübde« auf Gott
  choice: Die formal naheliegende Wiedergabe »deine Gelübde« bleibt im Haupttext erhalten.
  alternative: meine Gelübde an dich
  rationale: Die alternative Formulierung erklärt wahrscheinlich den gemeinten Sinn, fügt aber ein Possessiv der ersten Person und eine Zielangabe hinzu, die so nicht ausdrücklich im Hebräischen stehen. Die Fußnote erschließt diese idiomatische Deutung, ohne die Spannung des Wortlauts zu beseitigen.
- issue: Kultische oder allgemeine Bedeutung von תּוֹדֹת
  choice: Dankopfer
  alternative: Danksagungen
  rationale: Gelübde und das Begleichen einer Verpflichtung legen einen kultischen Vollzug nahe; die allgemeinere lexikalische Möglichkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung »deine Gelübde liegen auf mir« bewahrt bewusst das hebräische Bild; die Fußnoten erläutern die idiomatische Bedeutung und die lexikalische Mehrdeutigkeit.
