base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/007.yaml
  text: Because of iniquity[a], do not let them escape; in anger bring down the peoples[b], O God.
translation:
  language: de
  text: Wegen des Unrechts lass sie nicht entkommen[a]; im Zorn stürze die Völker[b] nieder, Gott!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rette sie wegen des Unrechts nicht.“ Die hebräische Klausel ist schwierig; eine Verneinung steht nicht ausdrücklich im Text. Das Verb kann auch „retten“ oder „befreien“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort kann je nach Zusammenhang auch „Nationen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אָוֶן
  choice: Wegen ihres Unrechts
  rationale: עַל wird kausal verstanden; אָוֶן bezeichnet hier moralisch schuldhaftes Unrecht. Das Possessivpronomen verdeutlicht im Deutschen den Bezug auf die Gegner, der sich aus dem Zusammenhang ergibt.
- source_word: פַּלֶּט לָמוֹ
  choice: lass sie nicht entkommen
  rationale: פלט kann ‚entkommen‘ oder im Kausativ ‚retten, entrinnen lassen‘ bedeuten. Im Zusammenhang der Bitte um Gericht wird die knappe, schwierige Wendung als verneinte Bitte verstanden; die im Hebräischen nicht ausdrücklich stehende Verneinung wird in einer Fußnote kenntlich gemacht.
- source_word: בְּאַף
  choice: im Zorn
  rationale: אַף bezeichnet in dieser Fügung Zorn; die Wiedergabe bleibt knapp und ergänzt kein im Hebräischen unausgesprochenes Possessivpronomen.
- source_word: עַמִּים
  choice: die Völker
  rationale: Der Plural עַמִּים bezeichnet Völker beziehungsweise Volksgemeinschaften. ‚Völker‘ ist die direkte und natürliche deutsche Entsprechung.
- source_word: הוֹרֵד
  choice: stürze … nieder
  rationale: Der Hifil-Imperativ von ירד fordert Gott auf, die Völker hinabzubringen, also zu erniedrigen oder zu Fall zu bringen. ‚Niederstürzen‘ bewahrt sowohl das Bild der Abwärtsbewegung als auch den Gerichtskontext.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das abschließende אֱלֹהִים ist eine direkte Anrede. Im Deutschen macht die Stellung nach dem Imperativ den Vokativ ohne zusätzliches ‚o‘ deutlich.
theological_decisions:
- issue: Gerichtsbitte und nicht ausdrücklich gesetzte Verneinung in einer schwierigen hebräischen Klausel
  choice: Die Zeile wird als Bitte verstanden, Gott möge die Schuldigen wegen ihres Unrechts nicht entkommen lassen.
  alternative: '„Wegen des Unrechts rette sie“ oder: „Durch Unrecht entkommen sie“'
  rationale: Der hebräische Wortlaut ist syntaktisch stark verdichtet, und eine ausdrückliche Verneinung fehlt. Der unmittelbare Parallelismus mit der Bitte, Gott möge die Völker im Zorn niederstürzen, stützt jedoch die traditionelle Deutung als negative Gerichtsbitte. Die Fußnote bewahrt die sprachliche Schwierigkeit, statt sie zu verdecken.
translation_notes:
  register: Moderne, würdige Psalmsprache mit direkter Anrede. „Unrecht“ ist verständlicher als das altertümlichere „Frevel“, behält aber das moralische Gewicht. Die kräftige Bitte „stürze … nieder“ gibt das poetische Bild und den Gerichtscharakter wieder.
