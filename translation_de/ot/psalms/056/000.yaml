  text: לַ/מְנַצֵּ֤חַ עַל י֬וֹנַת אֵ֣לֶם רְ֭חֹקִים לְ/דָוִ֣ד מִכְתָּ֑ם בֶּֽ/אֱחֹ֨ז אֹת֖/וֹ פְלִשְׁתִּ֣ים בְּ/גַֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/000.yaml
  text: 'For the choir director: according to “The Silent Dove of Distant Places.” Of David[a]. A miktam[b], when the Philistines seized him in Gath.'
translation:
  language: de
  text: 'Für den Chorleiter: Nach »Die stumme Taube ferner Orte«.[a] Von David. Ein Miktam,[b] als die Philister ihn in Gat ergriffen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wortgruppe kann etwa »Taube der Stummheit ferner Orte« bedeuten; vermutlich ist sie ein Lied- oder Melodietitel. Ihre genaue Bedeutung ist unsicher.
    reason: alternative_reading
  - marker: b
    text: Miktam ist ein Fachausdruck in mehreren Psalmüberschriften; seine genaue Bedeutung ist unbekannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: Die feste Überschriftsformel richtet den Psalm an den Leiter der musikalischen Aufführung; »Chorleiter« ist modern und funktional verständlich.
- source_word: עַל
  choice: Nach
  rationale: In Psalmüberschriften kann die Präposition eine Melodie oder musikalische Vorlage einführen; »Nach« ist dafür im Deutschen knapp und idiomatisch.
- source_word: יוֹנַת אֵלֶם רְחֹקִים
  choice: »Die stumme Taube in der Ferne«
  rationale: Die schwer verständliche Wortgruppe wird als vermutlich überlieferter Lied- oder Melodietitel gekennzeichnet. »stumm« gibt אֵלֶם und »in der Ferne« den räumlichen Sinn von רְחֹקִים wieder, ohne die Unsicherheit zu verdecken.
- source_word: לְדָוִד
  choice: Von David
  rationale: Die traditionelle knappe Wiedergabe bewahrt die mögliche Zuordnung zu David, ohne im Deutschen eine ausführlichere historische Behauptung einzuführen.
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Der technische Ausdruck in Psalmüberschriften ist in seiner genauen Bedeutung unsicher und wird deshalb transliteriert.
- source_word: בֶּאֱחֹז אֹתוֹ
  choice: als ... ihn ergriffen
  rationale: Die Konstruktion bezeichnet den Anlass; »ergriffen« bewahrt den Grundsinn des Festhaltens oder Ergreifens, ohne zwingend eine förmliche Gefangennahme zu behaupten.
- source_word: פְלִשְׁתִּים
  choice: die Philister
  rationale: Übliche deutsche Bezeichnung der Volksgruppe.
- source_word: בְּגַת
  choice: in Gat
  rationale: Natürliche deutsche Wiedergabe der Ortsangabe.
theological_decisions:
- issue: Status und Aussagekraft der Psalmüberschrift
  choice: Die Überschrift wird als Bestandteil des überlieferten Textes übersetzt; musikalische und historische Angaben bleiben erhalten, während unklare Fachbegriffe nicht spekulativ gedeutet werden.
  alternative: Die Überschrift nur als redaktionelle Metainformation behandeln oder מִכְתָּם mit einer vermuteten Bedeutung wie »goldenes Lied« übersetzen.
  rationale: So bleibt die kanonisch überlieferte Form sichtbar, ohne aus sprachlich unsicheren Ausdrücken weitergehende historische oder theologische Aussagen abzuleiten.
- issue: Bezug von לְדָוִד
  choice: »Von David«
  alternative: »Für David« oder »David zugehörig«
  rationale: Die hebräische Präposition kann Autorschaft, Zugehörigkeit oder Widmung anzeigen. Die knappe traditionelle Form lässt den genauen Charakter der Beziehung weitgehend offen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Überschrift bleibt knapp und musikalisch geprägt; Anführungszeichen markieren den vermutlich tradierten Titel. Unsichere hebräische Begriffe werden nicht konfessionell oder spekulativ ausgedeutet.
