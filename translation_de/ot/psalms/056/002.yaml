  yaml_path: translation/ot/psalms/056/002.yaml
  text: My enemies pant after me all day long[a], for many fight against me from on high.
translation:
  language: de
  text: Meine Feinde schnappen den ganzen Tag nach mir[a], denn viele kämpfen gegen mich aus der Höhe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meine Feinde treten mich den ganzen Tag nieder.“ Das hebräische Verb kann feindliches gieriges Nachsetzen, aber auch Zertreten bezeichnen.'
