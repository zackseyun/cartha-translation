lexical_decisions:
- source_word: שָׁאֲפוּ
  choice: schnauben … nach mir
  rationale: Das Verb שׁאף bezeichnet wörtlich ein Schnauben oder gieriges Lechzen und kann im feindlichen Zusammenhang heftiges Verfolgen oder Bedrängen ausdrücken. Die bildhafte Wiedergabe bewahrt das räuberische Moment, ohne eindeutig auf „zertreten“ festzulegen.
- source_word: שׁוֹרְרַי
  choice: meine Feinde
  rationale: Das Wort bezeichnet feindliche Widersacher; „meine Feinde“ ist klar, knapp und im Klagepsalm angemessen.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Natürliche moderne deutsche Entsprechung der hebräischen Zeitangabe.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung der Klage ein; „denn“ erhält den poetischen Zusammenhang.
- source_word: רַבִּים
  choice: viele
  rationale: Direkte und idiomatische Wiedergabe der Mengenangabe.
- source_word: לֹחֲמִים לִי
  choice: kämpfen gegen mich
  rationale: Das Partizip bezeichnet fortdauerndes feindliches Vorgehen; „gegen mich kämpfen“ gibt die militärische Färbung verständlich wieder.
- source_word: מָרוֹם
  choice: von der Höhe her
  rationale: מָרוֹם kann Höhe oder Erhabenheit bezeichnen, wird hier jedoch unterschiedlich als Ortsangabe, als Ausdruck hochmütigen Handelns oder als Anrede Gottes verstanden. „Von der Höhe her“ bewahrt zunächst das räumliche Bild und lässt die Auslegung offen.
theological_decisions:
- issue: Deutung von מָרוֹם
  choice: von der Höhe her
  alternative: „voll Hochmut“ oder als Anrede „du Höchster“
  rationale: Die knappe hebräische Syntax erlaubt mehrere Deutungen. Der Haupttext bewahrt den Höhenbegriff, ohne eine Anrede Gottes oder die moralische Wertung „hochmütig“ stillschweigend festzulegen; die ernsthaften Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Das ungewöhnliche Bild „schnauben … nach mir“ ist bewusst beibehalten; die Fußnote macht die stärker idiomatische Deutung „niedertreten“ sowie die Alternativen für מָרוֹם transparent.
