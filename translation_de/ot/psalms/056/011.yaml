source:
  edition: WLC
  text: בֵּֽ/אלֹהִ֣ים בָּ֭טַחְתִּי לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה אָדָ֣ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/011.yaml
  text: In God I have trusted; I will not fear[a]. What can man do to me?
translation:
  language: de
  text: Auf Gott habe ich vertraut; ich fürchte mich nicht.[a] Was kann ein Mensch mir antun?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich werde mich nicht fürchten.«'
    reason: Das hebräische Imperfekt kann hier eine gegenwärtige Haltung oder eine entschlossene Aussage über die Zukunft bezeichnen.
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Auf Gott
  rationale: Die Präposition ב bezeichnet hier das Ziel beziehungsweise den Gegenstand des Vertrauens. Im Deutschen lautet die natürliche Verbindung »auf Gott vertrauen«.
- source_word: בָּטַחְתִּי
  choice: habe ich vertraut
  rationale: Das Qal-Perfekt in der 1. Person Singular beschreibt ein gefasstes, feststehendes Vertrauen. Das deutsche Perfekt bildet die hebräische Form ab, ohne den fortwirkenden Zustand auszuschließen.
- source_word: לֹא אִירָא
  choice: ich fürchte mich nicht
  rationale: Das Imperfekt kann hier die gegenwärtige Haltung oder den entschlossenen Blick in die Zukunft ausdrücken. Die Hauptfassung gibt die aus dem Vertrauen folgende Haltung in natürlichem Deutsch wieder; die Zukunftsnuance wird in der Fußnote bewahrt.
- source_word: מַה יַּעֲשֶׂה
  choice: Was kann … antun?
  rationale: מַה leitet eine rhetorische Frage ein; das deutsche Modalverb »kann« bringt deren Sinn idiomatisch zum Ausdruck. עשה mit לִי wird natürlich mit »mir antun« wiedergegeben.
- source_word: אָדָם
  choice: ein Mensch
  rationale: אָדָם steht im Singular, bezeichnet hier aber repräsentativ einen Menschen als menschlichen Gegner. »Ein Mensch« bewahrt sowohl den Singular als auch den allgemeinen Sinn und bildet den Gegensatz zu Gott klar ab.
- source_word: לִי
  choice: mir
  rationale: Das ל mit Suffix der 1. Person Singular bezeichnet die auf den Sprecher gerichtete Handlung; zusammen mit »antun« ist »mir« die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Repräsentativer Singular אָדָם im Gegensatz zu Gott
  choice: ein Mensch
  alternative: der Mensch; ein Mann
  rationale: Der Ausdruck meint nicht notwendig einen männlichen Erwachsenen, sondern einen einzelnen Menschen als Vertreter menschlicher Macht. »Ein Mensch« wahrt den Singular und vermeidet eine sachlich unnötige Verengung.
- issue: Zeit- und Aussagewert von לֹא אִירָא
  choice: ich fürchte mich nicht
  alternative: ich werde mich nicht fürchten
  rationale: Das hebräische Imperfekt lässt sowohl eine gegenwärtige Haltung als auch eine zukunftsgerichtete Entschlossenheit zu. Die Hauptfassung klingt im Deutschen natürlich; die alternative Zukunftslesart bleibt ausdrücklich sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und die rhetorische Frage des hebräischen Verses bleiben erhalten.
