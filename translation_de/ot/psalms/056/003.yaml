base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/003.yaml
  text: When I am afraid[a], I will trust in you.
translation:
  language: de
  text: Wenn ich mich fürchte,[a] vertraue ich auf dich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Am Tag, an dem ich mich fürchte, vertraue ich auf dich.“ Das „ich“ ist im Hebräischen hervorgehoben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֥וֹם
  choice: Wenn
  rationale: יוֹם („Tag“) leitet hier idiomatisch einen temporalen Nebensatz ein. „Wenn“ gibt diese Funktion im modernen Deutschen natürlich wieder.
- source_word: אִירָ֑א
  choice: ich mich fürchte
  rationale: Das Qal-Imperfekt 1. Person Singular von ירא bezeichnet hier persönliche Angst, nicht ehrfürchtige Scheu. „Sich fürchten“ ist idiomatisch und bewahrt den Bezug zur Furcht.
- source_word: אֲנִ֗י
  choice: ich
  rationale: Das selbstständige Personalpronomen hebt das Subjekt hervor. Im Deutschen ist diese Hervorhebung nur begrenzt nachbildbar; die Fußnote macht die wörtliche Struktur sichtbar.
- source_word: אֵלֶ֥י/ךָ
  choice: auf dich
  rationale: אֶל bezeichnet mit בטח die Ausrichtung des Vertrauens auf jemanden. Die natürliche deutsche Verbindung lautet „auf dich vertrauen“.
- source_word: אֶבְטָֽח
  choice: vertraue ich
  rationale: Das Imperfekt von בטח kann hier den entschlossenen beziehungsweise wiederholbaren Vertrauensakt ausdrücken. Das Präsens klingt im konditional-temporalen deutschen Satz natürlich und bewahrt die Aussage als gegenwärtige Reaktion auf Furcht.
theological_decisions:
- issue: Verhältnis von Furcht und Vertrauen
  choice: Der Vers lässt die Furcht bestehen und stellt ihr das bewusste Vertrauen auf Gott gegenüber.
  alternative: Man könnte so paraphrasieren, als beseitige das Vertrauen jede Furcht vollständig.
  rationale: Der hebräische Text stellt Furcht und Vertrauen unmittelbar nebeneinander, ohne ausdrücklich zu sagen, dass die Furcht verschwindet. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die idiomatische Zeitangabe „Wenn“ steht im Haupttext; die ungewöhnliche hebräische Satzstruktur und die Hervorhebung durch אֲנִי werden in der Fußnote sichtbar gemacht.
