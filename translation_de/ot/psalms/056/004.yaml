base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/004.yaml
  text: In God I will praise his word[a]; in God I have trusted; I will not fear[c][b]. What can flesh do to me?
translation:
  language: de
  text: In Gott preise ich sein Wort; auf Gott vertraue ich und fürchte mich nicht. Was kann Fleisch mir antun?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formnäher: „Was wird Fleisch mir antun?“ „Fleisch“ meint hier schwache, sterbliche Menschen im Gegensatz zu Gott.'
    reason: lexikalische Alternative und Erklärung des hebräischen Bildes
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: In Gott / auf Gott
  rationale: Das erste בְּ bezeichnet den Bezug der preisenden Aussage und wird natürlich mit „in Gott“ wiedergegeben; beim Vertrauen verlangt modernes Deutsch idiomatisch „auf Gott“. Die Variation entspricht der jeweiligen deutschen Rektion.
- source_word: אֲהַלֵּל
  choice: preise ich
  rationale: Das Piel-Imperfekt kann Zukunft, Entschluss oder gegenwärtig-bekräftigendes Handeln ausdrücken. Im poetischen Bekenntnis klingt das deutsche Präsens natürlich und bewahrt die zeitliche Offenheit.
- source_word: דְּבָרוֹ
  choice: sein Wort
  rationale: Die Wiedergabe wahrt die lexikalische Breite von דָּבָר und legt es nicht vorschnell auf „Verheißung“ fest.
- source_word: בָּטַחְתִּי
  choice: vertraue ich
  rationale: Das Qatal bezeichnet ein begründetes, bereits vollzogenes Vertrauen mit gegenwärtiger Wirkung; das deutsche Präsens drückt diesen bestehenden Zustand am natürlichsten aus.
- source_word: לֹא אִירָא
  choice: fürchte mich nicht
  rationale: Die negierte Imperfektform bezeichnet anhaltende Zuversicht beziehungsweise den Entschluss, sich nicht zu fürchten. Das Präsens passt zur parallelen Vertrauensaussage.
- source_word: מַה יַּעֲשֶׂה
  choice: Was kann … antun?
  rationale: Formal steht eine Zukunftsform („Was wird … tun?“); als rhetorische Frage drückt sie im Deutschen idiomatisch die begrenzte Handlungsmacht des Menschen aus.
- source_word: בָשָׂר
  choice: ein Mensch aus Fleisch
  rationale: בָשָׂר bezeichnet hier den sterblichen, schwachen Menschen im Gegensatz zu Gott. Die Formulierung bewahrt das Bild „Fleisch“, bleibt aber für heutige Leser unmittelbar verständlich.
- source_word: לִי
  choice: mir
  rationale: Mit dem idiomatischen deutschen Verb „antun“ wird לִי knapp und sachgerecht als Dativ wiedergegeben.
theological_decisions:
- issue: בָשָׂר als anthropologischer Kontrast zu Gott
  choice: ein Mensch aus Fleisch
  alternative: Fleisch; ein Sterblicher; ein Mensch
  rationale: Bloßes „Fleisch“ wäre zwar formal näher, wirkt im modernen Deutschen hier jedoch unklar oder unpersönlich. „Ein Mensch aus Fleisch“ hält sowohl den menschlichen Bezug als auch das Bild der geschöpflichen Gebrechlichkeit offen, ohne eine zusätzliche Lehrdeutung einzutragen.
- issue: Zeitwert der Verbformen
  choice: poetisches Präsens für Lob, Vertrauen und Furchtlosigkeit
  alternative: „Ich werde … preisen; ich habe vertraut; ich werde mich nicht fürchten“
  rationale: Die hebräischen Formen tragen unterschiedliche aspektuelle und modale Nuancen. Ein einheitlich natürliches deutsches Präsens gibt das aktuelle Bekenntnis wieder, ohne die Imperfektformen ausschließlich futurisch oder das Qatal ausschließlich vergangen zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelität. Der Semikolon verbindet Lob und Vertrauen eng miteinander; „antun“ ist in der rhetorischen Frage idiomatischer als „tun“. Der Fußnotenmarker steht unmittelbar nach dem betreffenden Satz.
