id: PSA.56.9
reference: Psalms 56:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָ֥֨ז יָ֘שׁ֤וּבוּ אוֹיְבַ֣/י אָ֭חוֹר בְּ/י֣וֹם אֶקְרָ֑א זֶה יָ֝דַ֗עְתִּי כִּֽי אֱלֹהִ֥ים לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/009.yaml
  text: Then my enemies will turn back in the day I call. This I know[a], that God is for me.
translation:
  language: de
  text: 'Dann werden meine Feinde zurückweichen an dem Tag, an dem ich rufe. Das weiß ich[a]: Gott ist für mich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Daran erkenne ich, dass Gott für mich ist.“'
    reason: Das hebräische זֶה יָדַעְתִּי kann entweder „Das weiß ich“ oder instrumental „Daran erkenne ich“ bedeuten.
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Das temporale Adverb leitet die erwartete Folge des Rufens ein; „Dann“ gibt die zeitliche Abfolge natürlich und knapp wieder.
- source_word: יָשׁוּבוּ ... אָחוֹר
  choice: werden ... zurückweichen
  rationale: Die Verbindung von שוב mit אָחוֹר bezeichnet hier ein Zurückgehen beziehungsweise eine Niederlage. „Zurückweichen“ passt zum feindlichen Kontext und klingt im Deutschen natürlicher als das wörtlichere „nach hinten umkehren“.
- source_word: אוֹיְבַי
  choice: meine Feinde
  rationale: Direkte und idiomatische Wiedergabe des Substantivs mit Suffix der ersten Person Singular.
- source_word: בְּיוֹם אֶקְרָא
  choice: an dem Tag, an dem ich rufe
  rationale: Die konkrete Zeitangabe „am/an dem Tag“ bleibt erhalten; „ich rufe“ bewahrt die mögliche Bedeutungsbreite von קרא, wobei der Gebetskontext den Ruf zu Gott nahelegt.
- source_word: זֶה יָדַעְתִּי
  choice: Das weiß ich
  rationale: זֶה wird deiktisch als Gegenstand des Wissens verstanden. Die ebenfalls mögliche instrumentale Deutung „Daran erkenne ich“ wird in der Fußnote bewahrt.
- source_word: כִּי
  choice: dass / Doppelpunkt
  rationale: כִּי führt den Inhalt des Wissens ein. Im deutschen Haupttext macht ein Doppelpunkt diesen inhaltlichen Anschluss natürlicher, ohne die Beziehung aufzulösen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Übliche Wiedergabe der hier singularisch gemeinten Gottesbezeichnung.
- source_word: לִי
  choice: für mich
  rationale: Die Präposition bezeichnet im Kontext Beistand und Gunst. „Gott ist für mich“ erhält die knappe, theologisch starke Formulierung und legt sie nicht unnötig auf „auf meiner Seite“ fest.
theological_decisions:
- issue: Bedeutung von אֱלֹהִים לִי
  choice: Gott ist für mich, also dem Beter zugewandt und zu seinen Gunsten
  alternative: Gott ist mein / gehört mir
  rationale: Der Zusammenhang zwischen Gebetsruf und zurückweichenden Feinden spricht vor allem für göttlichen Beistand. Die knappe Wendung „für mich“ bewahrt zugleich die Ellipse des Hebräischen besser als eine ausführliche Erklärung.
- issue: Bezug von זֶה
  choice: '„Das“ verweist auf den folgenden Wissensinhalt: Gott ist für mich'
  alternative: „Daran“ verweist auf das Zurückweichen der Feinde als Erkenntnisgrund
  rationale: Beide syntaktischen Deutungen sind möglich. Der Haupttext folgt der einfachen deiktischen Lesart; die instrumentale Lesart wird ausdrücklich in der Fußnote erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Vers bleibt knapp und parallel gebaut. „Zurückweichen“ ist im Konfliktkontext idiomatisch; „Gott ist für mich“ bewahrt die prägnante und bewusst offene Aussage des Hebräischen.
