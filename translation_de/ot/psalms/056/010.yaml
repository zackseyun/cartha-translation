  text: בֵּֽ֭/אלֹהִים אֲהַלֵּ֣ל דָּבָ֑ר בַּ֝/יהוָ֗ה אֲהַלֵּ֥ל דָּבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/010.yaml
  text: In God I will praise the word[a]; in Yahweh I will praise the word.
translation:
  language: de
  text: In Gott will ich das Wort preisen[a]; in Jahwe will ich das Wort preisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Verheißung“ – in beiden Verszeilen. Das hebräische Wort kann je nach Zusammenhang „Wort“, „Sache“ oder „Verheißung“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: In Gott
  rationale: Die Präposition ב bezeichnet hier am natürlichsten den Bezugs- oder Vertrauensgrund des Lobens. „In Gott“ bewahrt zudem den Parallelismus mit בַּיהוָה.
- source_word: אֲהַלֵּל
  choice: preise ich
  rationale: Das Piel-Imperfekt der 1. Person Singular kann hier im poetischen Kontext eine gegenwärtige, wiederholte Bekenntnisaussage ausdrücken. Das natürliche deutsche Präsens vermeidet eine unnötige zeitliche Festlegung; auch ein entschlossenes „will ich preisen“ ist grammatisch möglich.
- source_word: דָּבָר
  choice: das Wort
  rationale: דָּבָר kann „Wort“, „Sache“ oder kontextuell „Verheißung“ bedeuten. „Das Wort“ wahrt die lexikalische Offenheit und die markante Wiederholung beider Halbverse.
- source_word: בַּיהוָה
  choice: in Jahwe
  rationale: Die Präposition ב wird parallel zu בֵּאלֹהִים mit „in“ wiedergegeben. Der Gottesname יהוה erscheint als „Jahwe“, eine im modernen Deutschen geläufige Wiedergabe des Tetragramms.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ macht diesen Unterschied gegenüber אֱלֹהִים („Gott“) sichtbar und erhält den Parallelismus der beiden Gottesbezeichnungen.
- issue: Zeit- und Aussagewert von אֲהַלֵּל
  choice: preise ich
  alternative: will ich preisen
  rationale: Das hebräische Imperfekt legt ohne weiteren Kontext nicht ausschließlich Futur fest. Das deutsche Präsens passt zu einer poetischen Bekenntnisaussage und bewahrt die mögliche durative beziehungsweise wiederholte Bedeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und die wörtliche Wiederholung des hebräischen Verses bleiben erhalten.
