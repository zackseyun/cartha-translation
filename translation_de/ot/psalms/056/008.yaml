  text: נֹדִ/י֮ סָפַ֪רְתָּ֫ה אָ֥תָּה שִׂ֣ימָ/ה דִמְעָתִ֣/י בְ/נֹאדֶ֑/ךָ הֲ֝/לֹ֗א בְּ/סִפְרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/008.yaml
  text: You have counted my wanderings[a]; put my tears in your bottle—are they not in your book?
translation:
  language: de
  text: Du hast mein Umherirren gezählt. Lege meine Tränen in deinen Schlauch[a] – sind sie nicht in deinem Buch?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist ein aus Tierhaut gefertigter Flüssigkeitsbehälter, etwa ein Wein- oder Wasserschlauch.
    reason: historical_lexical_clarification
lexical_decisions:
- source_word: נֹדִי
  choice: mein Umherirren
  rationale: Das von נוד abgeleitete Wort bezeichnet ruheloses Umherziehen oder Flüchtlingswandern. „Umherirren“ bewahrt die konkrete Bewegung, ohne sie verengend als bloßes Elend zu deuten.
- source_word: סָפַרְתָּה
  choice: hast gezählt
  rationale: ספר bedeutet zunächst zählen oder nummerieren und kann daraus abgeleitet auch verzeichnen heißen. „Gezählt“ erhält das konkrete Bild von Gottes genauer Aufmerksamkeit.
- source_word: שִׂימָה
  choice: Lege
  rationale: Der Imperativ von שׂים bedeutet setzen, legen oder tun. „Lege“ gibt die Aufforderung knapp und bildhaft wieder.
- source_word: דִמְעָתִי
  choice: meine Tränen
  rationale: Die hebräische Singularform kann kollektiv verstanden werden. Der deutsche Plural ist in diesem Bild idiomatisch und entspricht dem gemeinten fortgesetzten Weinen.
- source_word: בְנֹאדֶךָ
  choice: in deinen Schlauch
  rationale: נֹאד bezeichnet einen aus Tierhaut gefertigten Flüssigkeitsbehälter. „Schlauch“ gibt den antiken Gegenstand genauer wieder als das heute meist an Glas oder Kunststoff denken lassende „Flasche“.
- source_word: הֲלֹא
  choice: sind sie nicht
  rationale: הֲלֹא leitet eine rhetorische Frage ein, die Zustimmung erwartet. Die Frageform bleibt erhalten und wird nicht in eine Behauptung umgewandelt.
- source_word: בְסִפְרָתֶךָ
  choice: in deinem Buch
  rationale: Das Wort bezeichnet hier Gottes schriftliches Verzeichnis oder Buch. „Buch“ ist natürlich und bewahrt das konkrete Bild, ohne das Material als Schriftrolle festzulegen.
theological_decisions:
- issue: Anthropomorphe Bilder von Gott, der Tränen aufbewahrt und ein Buch führt
  choice: Die konkreten Bilder von Schlauch und Buch bleiben unverändert erhalten.
  alternative: Abstrakte Wiedergabe wie „Du vergisst mein Leid nicht“.
  rationale: Der hebräische Vers stellt Gottes persönliche und genaue Anteilnahme durch zwei starke poetische Bilder dar. Eine abstrahierende Paraphrase würde deren theologische und emotionale Kraft abschwächen.
- issue: Rhetorische Frage am Versende
  choice: „Sind sie nicht in deinem Buch?“
  alternative: 'Aussage: „Gewiss stehen sie in deinem Buch.“'
  rationale: Die Frage erwartet zwar eine bejahende Antwort, doch ihre offene, an Gott gerichtete Form gehört zur Spannung des Gebets und soll nicht eingeebnet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Die anschaulichen Körper- und Schriftbilder des Hebräischen bleiben erhalten; der Gedankenstrich verbindet Bitte und rhetorische Frage.
