  text: They gather together[a]; they hide themselves; they watch my steps[d][c][b], as they wait for my life.
translation:
  language: de
  text: Sie rotten sich zusammen[a], halten sich verborgen[b] und beobachten meine Schritte[c], während sie auf mein Leben warten[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb kann hier ein feindseliges Zusammenkommen bezeichnen; möglich ist auch die Wiedergabe: „Sie greifen an.“'
    reason: lexical_alternative
