    text: 'Oder: „lauern“. Das hebräische Verb bedeutet „verbergen“ oder „verstecken“ und kann in diesem Zusammenhang das Verbergen in einem Hinterhalt meinen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „meine Fersen“; gemeint sind die Schritte oder Bewegungen des Beters.'
    reason: lexical_alternative
