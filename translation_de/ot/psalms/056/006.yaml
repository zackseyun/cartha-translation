    text: 'Oder: „wie sie auf mein Leben gewartet haben“ beziehungsweise im feindseligen Sinn: „während sie auf mein Leben lauern“. Die hebräische Formulierung lässt das genaue Verhältnis der Satzteile offen.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: יָגוּרוּ
  choice: sie rotten sich zusammen
  rationale: Im feindseligen Zusammenhang bezeichnet das Verb hier am ehesten ein Zusammenkommen gegen den Beter. „Sich zusammenrotten“ gibt diesen feindlichen Zusammenschluss natürlich und knapp wieder, ohne bereits einen Angriff zu behaupten.
- source_word: יצפינו
  choice: halten sich verborgen
  rationale: Das Verb bezeichnet ein Verbergen oder Verstecken; im Kontext schwingt ein verborgenes Auflauern mit. Die Übersetzung bewahrt zunächst die Grundbedeutung.
- source_word: הֵמָּה
  choice: sie
  rationale: Das selbstständige Pronomen hebt die Gegner hervor. Im Deutschen wird diese Hervorhebung durch das ausdrücklich gesetzte „sie“ am Satzanfang ausreichend und natürlich vermittelt.
- source_word: עֲקֵבַי
  choice: meine Schritte
  rationale: Wörtlich steht „meine Fersen“. Gemeint sind idiomatisch die Schritte beziehungsweise Bewegungen des Beters, die seine Gegner verfolgen.
- source_word: יִשְׁמֹרוּ
  choice: beobachten
  rationale: שמר bedeutet hier nicht schützendes Bewahren, sondern feindseliges Beobachten und Verfolgen der Bewegungen des Beters.
- source_word: כַּאֲשֶׁר
  choice: während
  rationale: Die Konjunktion verknüpft das Beobachten mit dem feindseligen Warten. „Während“ ergibt im Deutschen einen natürlichen Zusammenhang, ohne die mögliche Verhältnisbestimmung völlig festzulegen.
- source_word: קִוּוּ
  choice: warten
  rationale: קוה bezeichnet grundsätzlich erwartungsvolles Warten oder Hoffen. Der feindselige Kontext lässt an ein Auflauern denken; die Hauptübersetzung bewahrt jedoch den lexikalischen Kern.
- source_word: נַפְשִׁי
  choice: mein Leben
  rationale: נפש bezeichnet hier die lebendige Person beziehungsweise das Leben des Beters, auf das seine Gegner aus sind. „Mein Leben“ ist im Kontext klarer als „meine Seele“.
theological_decisions:
- issue: Bedeutung von נַפְשִׁי
  choice: mein Leben
  alternative: meine Seele / mich
  rationale: Der Vers handelt von einer tödlichen Bedrohung der Person. Die Wiedergabe „mein Leben“ vermeidet eine sachlich unpassende Verengung auf einen vom Körper getrennten Seelenteil.
- issue: Feindselige Bedeutung von קִוּוּ
  choice: warten
  alternative: lauern / mir nach dem Leben trachten
  rationale: Die feindselige Absicht ergibt sich aus dem Zusammenhang, doch das Verb selbst bedeutet gewöhnlich „warten“ oder „hoffen“. Deshalb wird die Spannung im Haupttext bewahrt und die stärkere kontextuelle Deutung in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sich zusammenrotten“ kennzeichnet den feindseligen Zusammenschluss, ohne unnötig drastisch zu werden. Die ungewöhnliche Wendung „auf mein Leben warten“ bleibt bewusst stehen, um den Grundsinn von קוה und die Spannung des hebräischen Ausdrucks nicht durch eine ausschließlich interpretierende Formulierung zu ersetzen.
