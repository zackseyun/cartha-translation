  text: כָּל הַ֭/יּוֹם דְּבָרַ֣/י יְעַצֵּ֑בוּ עָלַ֖/י כָּל מַחְשְׁבֹתָ֣/ם לָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/005.yaml
  text: All day long they twist my words[c][b][a]; all their thoughts are against me for evil.
translation:
  language: de
  text: Den ganzen Tag verdrehen sie meine Worte[a]; all ihre Gedanken richten sich gegen mich und zielen auf Böses.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »entstellen sie meine Worte«. Das hebräische Verb ist schwierig und kann auch den Gedanken des Schmerzens oder Verletzens ausdrücken; mit »meine Worte« als Objekt liegt hier eine feindselige Verdrehung nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »all ihre Pläne gegen mich zielen auf Unheil«. Das hebräische Wort kann sowohl Gedanken als auch Pläne oder Absichten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Den ganzen Tag
  rationale: Die Wendung bezeichnet ein fortdauerndes Handeln während des ganzen Tages und wird so im modernen Deutschen natürlich wiedergegeben.
- source_word: דְּבָרַי
  choice: meine Worte
  rationale: דָּבָר kann auch »Angelegenheit« oder »Sache« bedeuten; zusammen mit dem schwierigen Verb passt hier jedoch am besten die feindselige Verdrehung der Worte des Beters.
- source_word: יְעַצֵּבוּ
  choice: verdrehen
  rationale: Das Piel von עצב ist an dieser Stelle schwierig und kann mit Schmerz, Verletzung oder Verformung verbunden sein. Mit »meine Worte« als Objekt gibt »verdrehen« die wahrscheinliche Bedeutung einer böswilligen Entstellung prägnant wieder.
- source_word: עָלַי
  choice: gegen mich
  rationale: Im feindseligen Zusammenhang hat die Präposition adversative Bedeutung.
- source_word: כָּל מַחְשְׁבֹתָם
  choice: all ihre Gedanken
  rationale: מַחְשָׁבוֹת kann Gedanken, Absichten oder Pläne bezeichnen. »Gedanken« bleibt lexikalisch offen; die folgende Zweckangabe verdeutlicht ihre feindselige Ausrichtung.
- source_word: לָרָע
  choice: auf Böses gerichtet
  rationale: Die Formulierung bewahrt sowohl den Gedanken schädlicher Absicht als auch die moralische Färbung von רַע und ergibt zusammen mit »Gedanken« einen verständlichen deutschen Satz.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Zeile ist bewusst knapp gehalten; die zweite bewahrt die doppelte Ausrichtung der Gedanken »gegen mich« und »auf Böses«, ohne die schwierige erste Verbform eindeutiger festzulegen, als es der hebräische Text erlaubt.
