id: PSA.56.1
reference: Psalms 56:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חָנֵּ֣/נִי אֱ֭לֹהִים כִּֽי שְׁאָפַ֣/נִי אֱנ֑וֹשׁ כָּל הַ֝/יּ֗וֹם לֹחֵ֥ם יִלְחָצֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/001.yaml
  text: Be gracious to me[a], O God, for man pants after me; all day long, fighting, he oppresses me.
translation:
  language: de
  text: Sei mir gnädig, Gott, denn ein Mensch jagt gierig hinter mir her[a]; den ganzen Tag bedrängt er mich und kämpft gegen mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »tritt mich nieder«, »schnappt nach mir« oder »will mich verschlingen«. Das hebräische Verb kann feindseliges Keuchen, gieriges Verlangen oder heftige Verfolgung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Sei mir gnädig
  rationale: Der Piël-Imperativ von חנן mit Suffix der 1. Person Singular ist eine Bitte um Gottes Gunst und gnädige Zuwendung. Die Formulierung ist würdevoll und vermeidet die möglicherweise stärker bußtheologische Färbung von »Erbarme dich meiner«.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Gottesname steht in direkter Anrede; im Deutschen wird die Anrede ohne ein zusätzliches »o« natürlich und klar wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die vorausgehende Bitte ein.
- source_word: שְׁאָפַנִי
  choice: jagt gierig hinter mir her
  rationale: שׁאף bezeichnet wörtlich ein Keuchen oder Schnaufen und kann daraus abgeleitet feindseliges Verlangen oder heftige Verfolgung ausdrücken. Die Übersetzung gibt das Bild einer begierigen, bedrohlichen Verfolgung in natürlichem Deutsch wieder, ohne die umstrittene Bildrichtung endgültig festzulegen.
- source_word: אֱנוֹשׁ
  choice: ein Mensch
  rationale: אֱנוֹשׁ bezeichnet hier einen einzelnen sterblichen Menschen. »Ein Mensch« bewahrt den Singular und den Kontrast zwischen Gott und dem menschlichen Gegner, ohne im Deutschen unnötig altertümlich zu klingen.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Dies ist die natürliche moderne deutsche Wiedergabe der Zeitangabe.
- source_word: לֹחֵם
  choice: kämpft gegen mich
  rationale: Das Qal-Partizip von לחם bezeichnet die fortdauernde kämpferische Feindseligkeit. Die koordinierte deutsche Formulierung gibt diesen begleitenden Umstand verständlich wieder.
- source_word: יִלְחָצֵנִי
  choice: bedrängt er mich
  rationale: לחץ bezeichnet Druck, Bedrängung oder Unterdrückung. »Bedrängt« passt zum persönlichen Angriff und bewahrt das Bild anhaltenden Drucks.
theological_decisions:
- issue: Wiedergabe von אֱנוֹשׁ als Bezeichnung des Gegners
  choice: ein Mensch
  alternative: ein Sterblicher; Menschen
  rationale: Der hebräische Singular weist in diesem Vers auf einen einzelnen menschlichen Gegner und unterstreicht dessen Sterblichkeit gegenüber Gott. Die Übersetzung verallgemeinert den Gegner daher nicht zur gesamten Menschheit.
- issue: Mehrdeutigkeit von שׁאף
  choice: jagt gierig hinter mir her, mit Fußnote
  alternative: tritt mich nieder; schnappt nach mir; will mich verschlingen
  rationale: Die genaue Nuance des Verbs ist lexikalisch umstritten. Der Haupttext wahrt das Motiv feindseliger, begieriger Verfolgung; die Fußnote hält die anderen sachlich möglichen Bilder offen und vermeidet eine theologische Überdeutung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Die direkte Anrede bleibt knapp; die feindselige Bewegung des Gegners wird anschaulich, aber nicht umgangssprachlich wiedergegeben.
