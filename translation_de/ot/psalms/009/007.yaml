  text: וַֽ֭/יהוָה לְ/עוֹלָ֣ם יֵשֵׁ֑ב כּוֹנֵ֖ן לַ/מִּשְׁפָּ֣ט כִּסְאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/007.yaml
  text: But Yahweh sits enthroned forever[b][a]; he has established his throne for judgment.
translation:
  language: de
  text: Doch Jahwe thront[a] für immer; er hat seinen Thron zum Gericht aufgerichtet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sitzt“. „Thront“ verdeutlicht den königlichen Sinn im Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Er hat seinen Thron für das Recht fest aufgestellt.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: Doch Jahwe
  rationale: 'Das Waw wird im Zusammenhang adversativ wiedergegeben: Im Gegensatz zum Untergang der Feinde bleibt Jahwes Herrschaft bestehen. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.'
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte Dauer; „für immer“ ist natürliches modernes Deutsch.
- source_word: יֵשֵׁב
  choice: thront
  rationale: Das Verb bedeutet wörtlich „sitzt“. Wegen des ausdrücklich genannten Thrones und des königlich-richterlichen Zusammenhangs gibt „thront“ den kontextuellen Sinn knapp und idiomatisch wieder.
- source_word: כּוֹנֵן
  choice: hat … aufgerichtet
  rationale: Die Polel-Form bezeichnet das feste Aufstellen oder Einrichten. „Hat … aufgerichtet“ bewahrt sowohl die konkrete Thronvorstellung als auch den vollendeten Aspekt.
- source_word: לַמִּשְׁפָּט
  choice: zum Gericht
  rationale: מִשְׁפָּט kann „Gericht“, „Recht“ oder „Gerechtigkeit“ bezeichnen. Beim Thron als Ort richterlichen Handelns wahrt „zum Gericht“ den unmittelbaren forensischen Sinn.
- source_word: כִּסְאוֹ
  choice: seinen Thron
  rationale: Direkte Wiedergabe der Nominalform mit Possessivsuffix.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt den offenbarten Bundesnamen als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Königliche Nuance von יֵשֵׁב
  choice: thront
  alternative: sitzt
  rationale: Das folgende „seinen Thron“ macht die königlich-richterliche Szenerie ausdrücklich. „Thront“ verdeutlicht diese im Kontext vorhandene Nuance; die wörtliche Form wird in der Fußnote genannt.
- issue: Bedeutungsumfang von מִשְׁפָּט
  choice: Gericht
  alternative: Recht; Gerechtigkeit
  rationale: „Gericht“ passt zur Tätigkeit des auf dem Thron sitzenden Richters. Da das hebräische Wort zugleich gerechte Rechtsprechung bezeichnen kann, bleibt diese Alternative in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des Hebräischen bleibt erhalten; königliche und richterliche Bildsprache wird nicht aufgelöst.
