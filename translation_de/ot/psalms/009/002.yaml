  source_fidelity: Die beiden hebräischen Verben sind Volitive der ersten Person und werden mit „Ich will …“ angemessen wiedergegeben. בך bezieht sich auf beide Freudenverben und bezeichnet die auf Gott gerichtete bzw. in ihm gegründete Freude. „Über dich jubeln“ ist zwar möglich, engt bzw. verschiebt diese Beziehung aber in Richtung eines Jubels über/wegen einer Person. Die Stellung „mich über dich freuen und jubeln“ lässt den Bezug natürlicher beide Verben umfassen. זמר mit Gottes „Namen“ hat ausdrücklich lobpreisenden Charakter; „lobsingen“ bildet dies präziser ab als das etwas weitere „besingen“.
  naturalness: „Ich will mich über dich freuen und jubeln“ ist modernes, würdiges und poetisch knappes Standarddeutsch. „Deinem Namen will ich lobsingen“ ist im Psalmregister idiomatisch und vermeidet die mögliche Lesart, der Name selbst werde lediglich besungen. „Höchster“ ist als knappe direkte Anrede in diesem Register möglich.
  terminology: „Höchster“ gibt עֶלְיוֹן als Gottesbezeichnung ohne unnötige Ausdeutung wieder. „Name“ bleibt als zentrale biblische Bezeichnung erhalten; „lobsingen“ macht lediglich die im Piel von זמר angelegte Lobpreisfunktion sichtbar.
