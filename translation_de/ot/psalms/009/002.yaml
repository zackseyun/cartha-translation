lexical_decisions:
- source_word: אֶשְׂמְחָה
  choice: Ich will mich freuen
  rationale: שׂמח bezeichnet Freude. Die Willensform „ich will“ gibt den kohortativ-volitiven Zug der hebräischen Form natürlich wieder.
- source_word: וְאֶעֶלְצָה
  choice: und … jubeln
  rationale: עלץ drückt ausgelassene, gesteigerte Freude aus. „Jubeln“ wahrt die Intensivierung gegenüber „sich freuen“ und klingt im heutigen Deutsch natürlich.
- source_word: בָךְ
  choice: über dich
  rationale: Die Präposition ב bezeichnet hier die Person, an der sich die Freude entzündet bzw. auf die sie sich richtet. „Über dich“ ist im Deutschen idiomatischer als das wörtlichere „in dir“; die mögliche Wiedergabe „in dir“ wird in der Fußnote bewahrt.
- source_word: אֲזַמְּרָה
  choice: ich will … besingen
  rationale: זמר im Piel bezeichnet musikalisches Singen zum Lob. „Besingen“ verbindet den Gesang idiomatisch mit dem folgenden „Namen“ und erhält den lobpreisenden Sinn.
- source_word: שִׁמְךָ
  choice: deinen Namen
  rationale: Der hebräische Ausdruck bleibt wörtlich erhalten; „Name“ bezeichnet im Kontext Gottes offenbarte Person und Ansehen, ohne dies ausdeutend in den Haupttext einzutragen.
- source_word: עֶלְיוֹן
  choice: Höchster
  rationale: עֶלְיוֹן ist hier ein Gottesprädikat in direkter Anrede. „Höchster“ ist eine knappe, würdige und im Deutschen geläufige Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottestitels עֶלְיוֹן
  choice: Höchster
  alternative: du Höchster / Allerhöchster
  rationale: Das artikellose hebräische Wort steht wahrscheinlich als Titel bzw. Vokativ. „Höchster“ erhält die direkte Anrede, ohne ein im Ausgangstext fehlendes Pronomen oder einen verstärkenden Bestandteil hinzuzufügen.
- issue: Bezug der Freude in בָךְ
  choice: über dich
  alternative: in dir
  rationale: Beide Wiedergaben können ausdrücken, dass Gott Mittelpunkt und Grund der Freude ist. Der Haupttext wählt natürliches modernes Deutsch; die traditionellere und formal nähere Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. Die wiederholte Willensform bildet den volitiven Charakter der beiden hebräischen Verbpaare ab; „jubeln“ steigert „sich freuen“, ohne altertümlich zu wirken.
