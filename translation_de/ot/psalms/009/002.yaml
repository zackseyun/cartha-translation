    rationale: „Besingen“ kann schlicht das Singen über etwas bezeichnen. „Deinem Namen lobsingen“ wahrt den Dativbezug und den lobpreisenden Sinn des hebräischen Piel.
  - severity: low
    issue: Die bisherige Fußnote verbindet mehrere Änderungen in einer einzigen „Oder“-Fassung.
    rationale: Dadurch ist nicht klar, welche Alternative sich auf welchen Ausdruck bezieht. Eine gezielte Fußnote zu בך bewahrt die mögliche formal nähere Wiedergabe transparent.
