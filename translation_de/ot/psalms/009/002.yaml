    rationale: Im Hebräischen folgt בך auf die koordinierte Verbgruppe und kann beide Verben bestimmen. Die deutsche Fassung sollte diesen gemeinsamen Bezug klarer und ohne unnötige semantische Einengung abbilden.
  - severity: low
