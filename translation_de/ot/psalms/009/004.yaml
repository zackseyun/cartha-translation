  text: For you have upheld my justice and my cause[a]; you sat on the throne[b], judging righteously.
translation:
  language: de
  text: Denn du hast mir Recht verschafft und meine Sache entschieden[a]; du hast dich auf den Thron gesetzt und richtest in Gerechtigkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »du hast meinen Rechtsanspruch und meine Rechtsache durchgesetzt«; die beiden hebräischen Rechtsbegriffe können auch »mein Urteil und meinen Rechtsfall« bedeuten.'
