lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet das vorausgehende Lob und gibt den gedanklichen Zusammenhang im Deutschen natürlich wieder.
- source_word: עָשִׂיתָ מִשְׁפָּטִי וְדִינִי
  choice: du hast mir Recht verschafft und meine Sache entschieden
  rationale: Die beiden Rechtsbegriffe bezeichnen den Rechtsanspruch und die Streitsache des Beters. Die idiomatische Wiedergabe wahrt das gerichtliche Bild und unterscheidet zugleich die beiden eng verwandten Ausdrücke.
- source_word: יָשַׁבְתָּ לְכִסֵּא
  choice: du hast dich auf den Thron gesetzt
  rationale: Das Verb bezeichnet hier das Einnehmen des königlichen und richterlichen Sitzes; die reflexive Formulierung ist im modernen Deutsch natürlich.
- source_word: שׁוֹפֵט
  choice: richtest
  rationale: Das Partizip beschreibt Gottes richterliches Handeln in Verbindung mit seinem Sitzen auf dem Thron. Das deutsche Präsens erhält diesen fortdauernden Aspekt.
- source_word: צֶדֶק
  choice: in Gerechtigkeit
  rationale: Das Substantiv wird adverbial gebraucht. Die substantivische Wiedergabe bleibt der hebräischen Form nahe und bewahrt den umfassenden moralisch-rechtlichen Sinn.
theological_decisions:
- issue: Gott als thronender Richter
  choice: Der Vers zeigt Gott ausdrücklich als Richter, der dem Beter Recht verschafft und seine Streitsache entscheidet.
  alternative: 'Allgemeiner: Gott habe lediglich zugunsten des Beters gehandelt.'
  rationale: Die Verbindung der beiden Rechtsbegriffe mit Thron und richterlichem Handeln macht die gerichtliche Bildwelt eindeutig, ohne weitere dogmatische Kategorien einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die juristische Bildsprache bleibt klar erkennbar; das Präsens »richtest« gibt die fortdauernde Bedeutung des hebräischen Partizips wieder.
