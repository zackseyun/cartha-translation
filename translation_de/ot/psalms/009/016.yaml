  text: נ֤וֹדַ֨ע יְהוָה֮ מִשְׁפָּ֪ט עָ֫שָׂ֥ה בְּ/פֹ֣עַל כַּ֭פָּי/ו נוֹקֵ֣שׁ רָשָׁ֑ע הִגָּי֥וֹן סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/016.yaml
  text: Yahweh has made himself known[a]; he has executed judgment. The wicked is snared by the work of his own hands. Higgaion[b]. Selah
translation:
  language: de
  text: Yahweh hat sich zu erkennen gegeben[a]; er hat Gericht gehalten. Der Frevler wird durch das Werk seiner eigenen Hände gefangen. Higgajon[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Yahweh ist bekannt; er hat Gericht gehalten.“ Das hebräische נודע kann stativ-passiv („ist bekannt“) oder resultativ („hat sich zu erkennen gegeben“) verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: „Higgajon“ ist wahrscheinlich eine musikalische oder liturgische Angabe; möglich sind auch Bedeutungen wie „Nachsinnen“ oder „klingendes Spiel“.
    reason: lexical_alternative
lexical_decisions:
- source_word: נודע
  choice: hat sich zu erkennen gegeben
  rationale: Das Nifal kann hier stativ-passiv („ist bekannt“) oder resultativ/reflexiv verstanden werden. Die gewählte Form gibt die im Zusammenhang sichtbare Selbstoffenbarung durch das Gericht natürlich wieder, ohne die Alternative auszuschließen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִשְׁפָּט עָשָׂה
  choice: hat Gericht gehalten
  rationale: Die feste Verbindung bezeichnet die Ausübung richterlichen Handelns; die deutsche Wendung bewahrt den forensischen Sinn.
- source_word: בפעל כפיו
  choice: durch das Werk seiner eigenen Hände
  rationale: ב wird instrumental verstanden. Das Werk der Hände des Frevlers ist das Mittel seines eigenen Verderbens; „eigenen“ verdeutlicht den Rückbezug.
- source_word: נוקש
  choice: hat sich … verstrickt
  rationale: Das Verb bezeichnet das Gefangen- oder Verstricktwerden. Die Formulierung bewahrt das Bild einer Falle und klingt im Deutschen in Verbindung mit den eigenen Taten natürlich.
- source_word: רשע
  choice: der Frevler
  rationale: Das substantivierte Singularadjektiv bezeichnet repräsentativ den schuldhaft Bösen. „Frevler“ ist knapp, würdig und erhält den Singular.
- source_word: הגיון
  choice: Higgajon
  rationale: Da die Bedeutung unsicher und vermutlich musikalisch oder liturgisch ist, wird der Ausdruck transliteriert; mögliche Bedeutungen stehen in der Fußnote.
- source_word: סלה
  choice: Sela
  rationale: Der wahrscheinlich musikalisch-liturgische Ausdruck bleibt wegen seiner unsicheren genauen Bedeutung unübersetzt.
theological_decisions:
- issue: Göttliches Erkanntwerden beziehungsweise Sich-zu-erkennen-Geben im Gericht
  choice: Yahweh hat sich zu erkennen gegeben; er hat Gericht gehalten.
  alternative: Yahweh ist bekannt; er hat Gericht gehalten.
  rationale: Die Übersetzung verbindet Yahwehs Erkanntwerden mit seinem richterlichen Handeln, ohne daraus eine über den Vers hinausgehende Lehrbehauptung abzuleiten. Die grammatisch mögliche stativ-passive Lesart bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus bleibt knapp; die seltenen liturgischen Fachwörter werden transliteriert. „Frevler“ wahrt den repräsentativen Singular und den poetischen Ton.
