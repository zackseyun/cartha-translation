  text: שִׁ֘יתָ֤/ה יְהוָ֨ה מוֹרָ֗ה לָ֫/הֶ֥ם יֵדְע֥וּ גוֹיִ֑ם אֱנ֖וֹשׁ הֵ֣מָּה סֶּֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/020.yaml
  text: Put fear in them, O LORD; let the nations know that they are only man. Selah
translation:
  language: de
  text: Versetze sie in Furcht, HERR; lass die Völker erkennen, dass sie nur Menschen sind. Sela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיתָה
  choice: Versetze
  rationale: Der Imperativ von שׁית bedeutet hier, etwas zu setzen bzw. aufzuerlegen; zusammen mit מוֹרָה ergibt sich im Deutschen natürlich »in Furcht versetzen«.
- source_word: מוֹרָה
  choice: Furcht
  rationale: Das seltene Substantiv bezeichnet im Kontext am plausibelsten Furcht bzw. Schrecken.
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen wird im Klartext als HERR dargestellt.
- source_word: גוֹיִם
  choice: Völker
  rationale: Im poetischen Kontext bezeichnet der Plural die nichtisraelitischen Nationen beziehungsweise Völker.
- source_word: אֱנוֹשׁ
  choice: nur Menschen
  rationale: אֱנוֹשׁ hebt die menschliche Schwäche und Sterblichkeit hervor; »nur Menschen« gibt den Kontrast zu Gott knapp und idiomatisch wieder.
- source_word: סֶּלָה
  choice: Sela
  rationale: Der nicht sicher erklärte liturgisch-musikalische Ausdruck wird transliteriert und nicht interpretierend übersetzt.
theological_decisions:
- issue: Aussage über die Völker als אֱנוֹשׁ
  choice: dass sie nur Menschen sind
  alternative: dass sie sterbliche Menschen sind
  rationale: »Nur Menschen« bewahrt die theologische Gegenüberstellung von menschlicher Begrenztheit und Gottes Herrschaft, ohne die lexikalische Nuance auf Sterblichkeit allein festzulegen.
- issue: Bedeutung von מוֹרָה
  choice: Furcht
  alternative: einen Schrecken / einen Lehrer
  rationale: Die Wurzel- und Formdeutung ist nicht völlig unumstritten; der unmittelbare Kontext des göttlichen Gerichts stützt jedoch »Furcht« beziehungsweise »Schrecken« deutlich stärker als »Lehrer«.
translation_notes:
  register: Moderne, würdige Psalmsprache mit direkter Bitte. Die Satzstellung bleibt knapp und poetisch; »Sela« wird als etablierte Transliteration beibehalten.
