id: PSA.9.12
reference: Psalms 9:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי דֹרֵ֣שׁ דָּ֭מִים אוֹתָ֣/ם זָכָ֑ר לֹֽא שָׁ֝כַ֗ח צַעֲקַ֥ת עניים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/012.yaml
  text: For the one who avenges bloodshed remembers them[a]; he does not forget the cry of the afflicted.
translation:
  language: de
  text: Denn er fordert Rechenschaft für vergossenes Blut und denkt an sie; den Hilfeschrei der Bedrängten[a] vergisst er nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Armen«, »Gebeugten« oder »Unterdrückten«. Das hebräische Wort kann Menschen bezeichnen, die arm, leidend, gedemütigt oder unterdrückt sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage und fügt sich natürlich in den erklärenden Gedankengang des Psalms ein.
- source_word: דֹרֵשׁ דָּמִים
  choice: er fordert Rechenschaft für vergossenes Blut
  rationale: Die Wendung bezeichnet nicht die bloße Suche nach Blut, sondern Gottes gerichtliches Ahnden von Blutschuld. Die Übersetzung gibt diesen Sinn wieder, ohne einen bestimmten rechtlichen Amtstitel einzuführen.
- source_word: אוֹתָם
  choice: an sie
  rationale: Das pluralische Objekt wird beibehalten und auf die leidenden Menschen als Gruppe bezogen.
- source_word: זָכָר
  choice: denkt
  rationale: Das Perfekt beschreibt hier im poetischen Zusammenhang Gottes verlässliches, charakteristisches Handeln; das deutsche Präsens gibt dies natürlich wieder.
- source_word: לֹא שָׁכַח
  choice: vergisst … nicht
  rationale: Parallel zu זָכָר wird die fortdauernde Gewissheit ausgedrückt, dass Gott den Ruf der Leidenden nicht unbeachtet lässt.
- source_word: צַעֲקַת
  choice: Hilfeschrei
  rationale: Das Wort bezeichnet einen aus Bedrängnis erhobenen Ruf. »Hilfeschrei« macht diesen situativen Gehalt im Deutschen klar, ohne bereits eine konkrete Antwort vorwegzunehmen.
- source_word: עניים
  choice: Bedrängten
  rationale: Der Ausdruck kann arme, elende, gebeugte oder unterdrückte Menschen bezeichnen. Im Zusammenhang von Blutvergießen und göttlicher Gerechtigkeit erfasst »Bedrängte« die umfassende Notlage, ohne sie auf wirtschaftliche Armut zu beschränken.
theological_decisions:
- issue: Göttliche Gerechtigkeit in דֹרֵשׁ דָּמִים
  choice: Gott fordert für vergossenes Blut Rechenschaft und zieht Blutschuld zur Verantwortung.
  alternative: Gott nimmt das Blutvergießen lediglich wahr oder sucht buchstäblich nach Blut.
  rationale: Die hebräische Wendung spricht von gerichtlicher Ahndung. Die Übersetzung wahrt den Gedanken göttlicher Gerechtigkeit, ohne Gott ein Verlangen nach Blut zuzuschreiben oder ihn ausdrücklich mit dem technischen Rechtsamt eines Bluträchers gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Rechenschaft für vergossenes Blut fordern« verdeutlicht das hebräische Rechtsmotiv; »Bedrängte« bewahrt die soziale und leidensbezogene Bedeutungsbreite. Die Satzstellung im zweiten Halbvers hebt den Hilfeschrei hervor und erhält den poetischen Parallelismus.
