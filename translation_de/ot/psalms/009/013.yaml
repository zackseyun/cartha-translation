source:
  edition: WLC
  text: חָֽנְנֵ֬/נִי יְהוָ֗ה רְאֵ֣ה עָ֭נְיִ/י מִ/שֹּׂנְאָ֑/י מְ֝רוֹמְמִ֗/י מִ/שַּׁ֥עֲרֵי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/013.yaml
  text: Be gracious to me[a], O Yahweh; see my affliction from those who hate me[b], you who lift me up from the gates of death.
translation:
  language: de
  text: Sei mir gnädig[a], Jahwe; sieh mein Elend, das mir die zufügen, die mich hassen – du, der mich aus den Toren des Todes[b] emporhebt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erbarme dich meiner.“'
    reason: lexical_alternative
  - marker: b
    text: Die „Tore des Todes“ sind ein hebräisches Bild für die Schwelle zum Tod oder den Machtbereich des Todes.
    reason: cultural_note
lexical_decisions:
- source_word: חָנְנֵנִי
  choice: Sei mir gnädig
  rationale: Der Imperativ von חנן mit dem Suffix der 1. Person Singular bittet um gnädige Zuwendung. Die Formulierung ist im Deutschen natürlich und bewahrt den Charakter einer direkten Bitte.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: רְאֵה
  choice: sieh
  rationale: Die direkte Imperativform bewahrt den eindringlichen Gebetsruf um Gottes Aufmerksamkeit.
- source_word: עָנְיִי
  choice: mein Elend
  rationale: עֳנִי bezeichnet bedrängendes Leid oder Elend, ohne dessen körperliche, soziale oder seelische Dimension näher festzulegen.
- source_word: מִשֹּׂנְאַי
  choice: das mir die zufügen, die mich hassen
  rationale: Die Präposition מִן bezeichnet hier am wahrscheinlichsten den Ursprung beziehungsweise die Urheber des Elends. Die deutsche Formulierung macht diesen Bezug verständlich, ohne „Feinde“ zusätzlich in den Text einzutragen.
- source_word: מְרוֹמְמִי
  choice: du, der mich emporhebt
  rationale: 'Das Polel-Partizip mit Suffix wird als appositionale Anrede verstanden: Jahwe ist derjenige, der den Betenden erhöht beziehungsweise aus der Todesnähe heraushebt.'
- source_word: מִשַּׁעֲרֵי מָוֶת
  choice: aus den Toren des Todes
  rationale: Die konkrete hebräische Metapher wird bewahrt. Der Text nennt den Tod, nicht ausdrücklich den Scheol.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ gibt ihn im modernen Standarddeutsch als Eigennamen wieder.
- issue: Syntaktischer Bezug von מִשֹּׂנְאַי
  choice: Die Wendung bezeichnet diejenigen, die das Elend verursachen.
  alternative: 'Lockerer Anschluss als zusätzliche Bitte: „sieh mein Elend; [sieh] die, die mich hassen“'
  rationale: Der unmittelbare Anschluss an „mein Elend“ spricht dafür, die Hassenden als dessen Urheber zu verstehen; ein zweiter Imperativ steht nicht im hebräischen Text.
- issue: Bild der „Tore des Todes“
  choice: Die Metapher bleibt unaufgelöst stehen.
  alternative: vom Rand des Todes; aus der Gewalt des Totenreichs
  rationale: Das Bild kann sowohl Todesnähe als auch den Machtbereich des Todes anklingen lassen. Eine erklärende Paraphrase im Haupttext würde diese Offenheit unnötig verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Gebetssprache. Der Gedankenstrich kennzeichnet die appositionale Anrede „du, der …“, ohne einen neuen Satz einzuführen. Die Bildsprache des hebräischen Textes bleibt erhalten.
