  text: קוּמָ֣/ה יְ֭הוָה אַל יָעֹ֣ז אֱנ֑וֹשׁ יִשָּׁפְט֥וּ ג֝וֹיִ֗ם עַל פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/019.yaml
  text: Rise up[a], O Yahweh; do not let man prevail; let the nations be judged before you.
translation:
  language: de
  text: Steh auf, Jahwe! Lass den Menschen[a] nicht die Oberhand gewinnen. Die Völker sollen vor dir gerichtet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den sterblichen Menschen. Das hebräische Wort kann die Schwäche und Sterblichkeit des Menschen betonen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Steh auf
  rationale: Der Imperativ von קום richtet sich an Gott und ist ein dringender Ruf zum Eingreifen. „Steh auf“ ist im modernen Deutschen natürlich und bewahrt die Bildhaftigkeit.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: אַל־יָעֹז
  choice: Lass … nicht die Oberhand gewinnen
  rationale: Die Verbindung aus אַל und der Jussivform bezeichnet die Bitte, menschliche Stärke nicht zum Erfolg kommen zu lassen. Die idiomatische Wendung gibt im Kontext den Sinn von „nicht obsiegen“ wieder.
- source_word: אֱנוֹשׁ
  choice: der sterbliche Mensch
  rationale: Das singularische Kollektivwort bezeichnet den Menschen und kann besonders seine Schwäche und Sterblichkeit hervorheben. „Der sterbliche Mensch“ bewahrt sowohl den repräsentativen Singular als auch diese Nuance.
- source_word: יִשָּׁפְטוּ
  choice: sollen … gerichtet werden
  rationale: Der Nifal bezeichnet hier am ehesten das Unterworfenwerden unter Gottes Gericht; die jussivische Aussage wird mit „sollen“ wiedergegeben.
- source_word: גּוֹיִם
  choice: die Völker
  rationale: Die übliche Bezeichnung für die Völker außerhalb Israels wird im Psalmkontext natürlich mit „die Völker“ wiedergegeben.
- source_word: עַל־פָּנֶיךָ
  choice: vor dir
  rationale: Die wörtliche Wendung „vor deinem Angesicht“ bezeichnet hier Gottes Gegenwart als Ort des Gerichts; „vor dir“ ist knapp und idiomatisch.
theological_decisions:
- issue: Anthropologische Nuance von אֱנוֹשׁ
  choice: der sterbliche Mensch
  alternative: der Mensch
  rationale: Die Formulierung lässt den Gegensatz zwischen der Gebrechlichkeit des Menschen und Gottes souveräner Macht hervortreten, ohne mehr auszusagen, als das hebräische Wort zulässt.
- issue: Bedeutung von שפט im Nifal
  choice: gerichtet werden
  alternative: Recht empfangen / regiert werden
  rationale: Der unmittelbare Zusammenhang ist eine Bitte gegen das Obsiegen des Menschen; daher liegt die gerichtliche Bedeutung am nächsten. Die grammatische Passivform bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Psalmdeutsch. Der direkte Anruf und die drei kurzen Satzglieder bewahren die Dringlichkeit des hebräischen Gebets; unnötig altertümliche Formen wurden vermieden.
