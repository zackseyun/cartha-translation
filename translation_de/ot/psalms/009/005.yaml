base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/005.yaml
  text: You rebuked nations[a]; you destroyed the wicked[b]; you blotted out their name forever and ever.
translation:
  language: de
  text: Du hast die Völker zurechtgewiesen; die Gottlosen[a] hast du vernichtet; ihren Namen[b] hast du für immer und ewig ausgelöscht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Gottlosen“ oder „den Frevler“. Der hebräische Singular kann individuell oder kollektiv beziehungsweise generisch verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „ihren Namen“; gemeint sein können damit auch ihre Erinnerung oder ihr Ansehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּעַרְתָּ
  choice: du hast … zurechtgewiesen
  rationale: גער bezeichnet einen nachdrücklichen, wirksamen Tadel. „Zurechtgewiesen“ gibt die direkte Handlung in natürlichem modernem Deutsch wieder, ohne das Verb auf eine bloße Drohung einzuengen.
- source_word: גּוֹיִם
  choice: die Völker
  rationale: גוים meint hier die Völker als kollektive Größen. „Völker“ ist im deutschen Psalmenkontext natürlicher als „Nationen“ und vermeidet die später geprägte religiöse Bedeutung von „Heiden“.
- source_word: אִבַּדְתָּ
  choice: du hast … vernichtet
  rationale: Die Piel-Form von אבד bezeichnet das Zugrunde-Richten oder Vernichten. „Vernichtet“ bewahrt die Stärke der Gerichtsaussage.
- source_word: רָשָׁע
  choice: den Frevler
  rationale: Der hebräische Ausdruck steht im Singular. Der deutsche generische Singular „den Frevler“ bewahrt diese Form und kann zugleich eine ganze Gruppe bezeichnen; die mögliche individuelle Lesart wird in der Fußnote offengehalten.
- source_word: שְׁמָם
  choice: ihren Namen
  rationale: Dies entspricht der wörtlichen Bedeutung. „Name“ kann im Kontext zugleich Erinnerung und Ansehen umfassen, ohne dass eine dieser Bedeutungen im Haupttext festgelegt wird.
- source_word: מָחִיתָ
  choice: ausgelöscht
  rationale: מחה bezeichnet das Wegwischen oder Tilgen. „Den Namen auslöschen“ ist im Deutschen eine verständliche, kräftige Metapher.
- source_word: לְעוֹלָם וָעֶד
  choice: für immer und ewig
  rationale: Die feste Doppelwendung verstärkt die unbegrenzte Dauer; „für immer und ewig“ gibt diese emphatische Form idiomatisch wieder.
theological_decisions:
- issue: Kollektive oder individuelle Bedeutung von רָשָׁע
  choice: 'Generischer Singular: „den Frevler“'
  alternative: 'Kollektivischer Plural: „die Frevler“; individuell: „den Bösen“'
  rationale: רשע ist morphologisch Singular, kann aber generisch oder kollektiv gebraucht sein. Der Zusammenhang mit den Völkern und dem pluralischen Suffix in „ihren Namen“ spricht für einen kollektiven Bezug. Die Singularform im Haupttext bewahrt dennoch die genuine grammatische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelität. „Völker“ vermeidet das missverständliche „Heiden“. Die hebräische Spannung zwischen dem Singular „Frevler“ und dem pluralischen „ihren Namen“ bleibt bewusst erhalten.
