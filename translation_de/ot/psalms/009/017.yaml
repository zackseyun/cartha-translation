  text: The wicked will return to Sheol—all the nations that forget God[a][b].
translation:
  language: de
  text: Die Frevler kehren[a] in die Scheol[b] zurück – alle Völker, die Gott vergessen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenden sich zurück“. Das hebräische Verb kann sowohl „zurückkehren“ als auch „sich zurückwenden“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Scheol ist der hebräische Ausdruck für den Bereich der Toten; seine Bedeutung ist nicht mit dem späteren, spezifischeren Begriff der Hölle gleichzusetzen.
    reason: cultural_note
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: kehren … zurück
  rationale: Das Qal-Imperfekt von שׁוב bezeichnet ein Zurückkehren oder Sich-zurück-Wenden. „Kehren … zurück“ bewahrt die grundlegende Bewegungsbedeutung, ohne sie als bloße Vernichtung auszudeuten.
- source_word: רְשָׁעִים
  choice: die Frevler
  rationale: Die substantivierte Mehrzahl bezeichnet moralisch schuldige, gottlose Menschen. „Frevler“ ist knapp, verständlich und dem würdevollen Register der Psalmen angemessen.
- source_word: לִשְׁאוֹלָה
  choice: in den Scheol
  rationale: Die Präposition mit Richtungsendung bezeichnet eine Bewegung zum Scheol hin. Die Transliteration bewahrt den hebräischen Begriff für den Bereich der Toten und vermeidet die zu enge Wiedergabe „Grab“ sowie die theologisch spezifischere Wiedergabe „Hölle“.
- source_word: כָּל גּוֹיִם
  choice: alle Völker
  rationale: גּוֹיִם bezeichnet hier Völker oder Nationen. „Alle Völker“ gibt die umfassende Aussage natürlich wieder, ohne einen im Hebräischen nicht ausdrücklich markierten Gegensatz zwischen Juden und Nichtjuden einzutragen.
- source_word: שְׁכֵחֵי אֱלֹהִים
  choice: die Gott vergessen
  rationale: Die aktive Partizipialkonstruktion charakterisiert die genannten Völker. Der deutsche Relativsatz ist natürlich und lässt offen, ob gewohnheitsmäßiges oder fortdauerndes Vergessen im Vordergrund steht.
theological_decisions:
- issue: Bedeutung von שְׁאוֹל im Gerichtskontext
  choice: Scheol
  alternative: Grab; Totenreich; Hölle
  rationale: Obwohl der Vers vom Geschick der Frevler spricht, bezeichnet שְׁאוֹל im hebräischen Text nicht eindeutig den später präzisierten Begriff der Hölle. „Scheol“ wahrt die begriffliche und theologische Offenheit des Ausgangstextes.
- issue: Bedeutungsnuance von שׁוב
  choice: zurückkehren
  alternative: sich zurückwenden
  rationale: Das Verb kann sowohl „zurückkehren“ als auch „sich zurückwenden“ bedeuten. Der Haupttext verwendet die naheliegende Bewegungsbedeutung; die Fußnote bewahrt die echte lexikalische Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Der Gedankenstrich bildet die appositionelle Entfaltung des zweiten Halbverses ab. „Scheol“ bleibt als erklärter hebräischer Fachbegriff stehen.
