  text: הָֽ/אוֹיֵ֨ב תַּ֥מּוּ חֳרָב֗וֹת לָ֫/נֶ֥צַח וְ/עָרִ֥ים נָתַ֑שְׁתָּ אָבַ֖ד זִכְרָ֣/ם הֵֽמָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/006.yaml
  text: The enemy has come to an end in everlasting ruins[a]; you have uprooted cities; the very memory of them has perished.
translation:
  language: de
  text: Der Feind ist für immer vernichtet[a]; Städte hast du entwurzelt; selbst ihre Erinnerung ist vergangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Feind, die Verwüstungen haben für immer ein Ende.“ Der hebräische Versanfang kann auch als direkte Anrede verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאוֹיֵב
  choice: der Feind
  rationale: Der bestimmte Artikel spricht zunächst für eine Bezeichnung des Feindes als Satzgegenstand. Die mögliche Anrede wird wegen der syntaktischen Mehrdeutigkeit in der Fußnote bewahrt.
- source_word: תַּמּוּ
  choice: ist … zugrunde gegangen
  rationale: Das Verb תמם bezeichnet das Zu-Ende-Kommen oder vollständige Aufhören. Zusammen mit „in Trümmern“ gibt „zugrunde gegangen“ die endgültige Vernichtung in natürlichem Deutsch wieder, auch wenn die hebräische Pluralform syntaktisch schwierig bleibt.
- source_word: חֳרָבוֹת
  choice: Trümmern
  rationale: Das Substantiv bezeichnet Verwüstungen oder Ruinen. „Trümmer“ vermittelt hier anschaulich den Zustand völliger Zerstörung.
- source_word: לָנֶצַח
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte Dauer und betont die Endgültigkeit des Untergangs.
- source_word: וְעָרִים
  choice: Städte
  rationale: עִיר bezeichnet gewöhnlich eine Stadt; der Kontext verlangt keine Abschwächung zu „Ortschaften“.
- source_word: נָתַשְׁתָּ
  choice: hast du entwurzelt
  rationale: נתשׁ beschreibt ein gewaltsames Ausreißen. „Entwurzelt“ erhält das Bild vollständiger Beseitigung statt es allgemein mit „zerstört“ wiederzugeben.
- source_word: אָבַד
  choice: ist vergangen
  rationale: Das Verb kann zugrunde gehen, verschwinden oder verlorengehen bedeuten. Bei der Erinnerung klingt „vergangen“ natürlich und würdevoll und bezeichnet ihr völliges Schwinden.
- source_word: זִכְרָם הֵמָּה
  choice: selbst die Erinnerung an sie
  rationale: זִכְרָם bezeichnet die Erinnerung an die zuvor genannten Städte beziehungsweise die Besiegten; das nachgestellte selbstständige Pronomen הֵמָּה verleiht Nachdruck, der im Deutschen mit „selbst“ wiedergegeben wird.
theological_decisions:
- issue: Syntaktische Deutung des Versanfangs
  choice: Der Anfang wird als Aussage über den endgültigen Untergang des Feindes verstanden.
  alternative: „Feind, die Verwüstungen sind für immer zu Ende.“
  rationale: Die Form mit Artikel lässt sich als „der Feind“ lesen, während die Pluralform תַּמּוּ und חֳרָבוֹת auch eine direkte Anrede mit „die Verwüstungen sind zu Ende“ ermöglichen. Der Haupttext folgt dem Zusammenhang des göttlichen Gerichts, ohne die andere grammatisch mögliche Deutung zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markierte Wortstellung „Städte hast du entwurzelt“ bewahrt den poetischen Nachdruck; die Bildsprache des Entwurzelns bleibt erhalten.
