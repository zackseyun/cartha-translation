  source_fidelity: Die Wiedergabe des Versanfangs als Aussage über den Feind ist angesichts der schwierigen hebräischen Syntax vertretbar und die alternative vokativische Analyse ist korrekt vermerkt. „in Trümmern ... zugrunde gegangen“ macht חֳרָבוֹת jedoch zu einer unnatürlichen Umstandsbestimmung und verwischt die Aussage von endgültiger Verwüstung. Das abschließende Suffix ist nicht eindeutig auf die Städte festzulegen; die deutsche Formulierung soll diese Bezugsmehrdeutigkeit wahren.
  naturalness: '„Der Feind ist in Trümmern für immer zugrunde gegangen“ ist im modernen Standarddeutsch semantisch und syntaktisch sperrig: Ein Feind kann nicht ohne Weiteres „in Trümmern zugrunde gehen“. Die knappe Prädikation „ist für immer vernichtet“ ist idiomatisch und bewahrt den poetisch-gerichtlichen Ton. Die vorangestellte Ergänzung in „Städte hast du entwurzelt“ ist natürlich und nachdrücklich.'
  terminology: „entwurzelt“ gibt נתשׁ treffend als Bild gewaltsamen Ausreißens wieder. „Erinnerung“ ist für זכר angemessen. „Ihre Erinnerung“ gibt die possessivische und in der Referenz offene Formulierung wieder, ohne die Erinnerung ausschließlich den Städten zuzuordnen.
