  variant: modern standard German
source:
  edition: WLC
  text: טָבְע֣וּ ג֭וֹיִם בְּ/שַׁ֣חַת עָשׂ֑וּ בְּ/רֶֽשֶׁת ז֥וּ טָ֝מָ֗נוּ נִלְכְּדָ֥ה רַגְלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/015.yaml
  text: The nations have sunk into the pit they made; in the net they hid[a], their own foot has been caught.
translation:
  language: de
  text: Die Völker sind in die Grube gesunken, die sie selbst gegraben haben; im Netz, das sie versteckten, hat sich ihr eigener Fuß verfangen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „ihr Fuß“ im Singular, wahrscheinlich als kollektiver Singular für die Völker.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבְעוּ
  choice: sind … gesunken
  rationale: Das Qal Perfekt bezeichnet das Einsinken oder Versinken. Das deutsche Perfekt bewahrt sowohl das Bild als auch die gegenwärtige Folge.
- source_word: גּוֹיִם
  choice: die Völker
  rationale: גּוֹיִם bezeichnet hier die feindlichen Völker als Gesamtheit; „die Völker“ ist im poetischen Kontext natürlich und würdevoll.
- source_word: בְּשַׁחַת
  choice: in die Grube
  rationale: שַׁחַת bezeichnet eine Grube, die in diesem Zusammenhang zugleich als Falle dient. Bei „sinken“ gibt „in die“ die Bewegungsrichtung idiomatisch wieder.
- source_word: עָשׂוּ
  choice: die sie selbst gegraben haben
  rationale: Das Verb bedeutet allgemein „machen“; bei einer Grube ist „graben“ im Deutschen die natürliche Entsprechung. „selbst“ verdeutlicht die im Parallelismus angelegte Ironie, ohne eine neue Aussage einzuführen.
- source_word: בְּרֶשֶׁת
  choice: im Netz
  rationale: רֶשֶׁת bedeutet „Netz“. Die lokale Wiedergabe passt zum Bild des darin gefangenen Fußes.
- source_word: זוּ
  choice: das
  rationale: זוּ fungiert hier als Relativpartikel und wird natürlich mit dem Relativpronomen „das“ wiedergegeben.
- source_word: טָמָנוּ
  choice: sie versteckten
  rationale: Das Verb bezeichnet das Verbergen oder heimliche Platzieren einer Falle. „versteckten“ hält sich eng an das konkrete Bild.
- source_word: נִלְכְּדָה
  choice: hat sich … verfangen
  rationale: Das Nifal bezeichnet das Gefangenwerden. Die reflexive deutsche Wendung ist beim Fuß in einem Netz idiomatisch und bewahrt den Sinn des passiven Ergebnisses.
- source_word: רַגְלָם
  choice: ihr eigener Fuß
  rationale: Der hebräische Ausdruck steht im Singular mit pluralischem Possessor. „eigener“ hebt die Vergeltungsironie hervor; der Singular bleibt erhalten.
