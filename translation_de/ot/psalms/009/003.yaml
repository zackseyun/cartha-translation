  yaml_path: translation/ot/psalms/009/003.yaml
  text: When my enemies turn back[a], they stumble and perish before you.
translation:
  language: de
  text: Wenn meine Feinde zurückweichen, straucheln sie und kommen um vor dir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »angesichts deiner Gegenwart«; wörtlich: »von vor deinem Angesicht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: Wenn … zurückweichen
  rationale: Die Präposition ב mit dem Infinitivus constructus von שוב leitet einen temporalen Nebensatz ein. „Wenn … zurückweichen“ gibt den zeitlichen Sinn natürlich wieder und lässt zugleich den Gedanken des Rückzugs erkennen.
- source_word: אוֹיְבַי
  choice: meine Feinde
  rationale: אויב mit dem Suffix der 1. Person Singular bedeutet unmittelbar „meine Feinde“.
- source_word: אָחוֹר
  choice: zurück
  rationale: אָחוֹר wird bei שוב adverbial gebraucht und bezeichnet eine Bewegung nach hinten beziehungsweise einen Rückzug.
- source_word: יִכָּשְׁלוּ
  choice: straucheln sie
  rationale: Das Verb כשל im Nifal bezeichnet ein Straucheln oder Zu-Fall-Kommen. „Straucheln“ bewahrt das Bild, ohne die vollständige Vernichtung vorwegzunehmen, die erst das folgende Verb ausdrückt.
- source_word: וְיֹאבְדוּ
  choice: und kommen um
  rationale: אבד im Qal kann „umkommen“ oder „zugrunde gehen“ bedeuten. „Kommen um“ passt zum poetischen Zusammenhang und legt die genaue Art ihres Endes nicht näher fest.
- source_word: מִפָּנֶיךָ
  choice: vor dir
  rationale: Die Wendung bedeutet wörtlich „von deinem Angesicht/deiner Gegenwart her“. „Vor dir“ ist im Deutschen idiomatisch und bewahrt den räumlich-relationalen Sinn; die kausale Nuance wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Göttliches Wirken beim Untergang der Feinde
  choice: Der Vers beschreibt, dass die Feinde vor Gott straucheln und umkommen, ohne die genaue Wirkweise näher auszuführen.
  alternative: Gott vernichtet die Feinde unmittelbar; oder sie brechen allein angesichts seiner Gegenwart zusammen.
  rationale: Das Hebräische sagt, dass sie מִפָּנֶיךָ, „vor dir/von deiner Gegenwart her“, straucheln und umkommen. Die Übersetzung bewahrt diese Spannung, ohne eine bestimmte Art des göttlichen Gerichts hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. „Zurückweichen“ bringt den Rückzug natürlicher zum Ausdruck als das allgemeinere „sich zurückwenden“; „straucheln“ erhält die Bildfolge vor „umkommen“.
