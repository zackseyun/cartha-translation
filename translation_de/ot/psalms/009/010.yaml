source:
  edition: WLC
  text: וְ/יִבְטְח֣וּ בְ֭/ךָ יוֹדְעֵ֣י שְׁמֶ֑/ךָ כִּ֤י לֹֽא עָזַ֖בְתָּ דֹרְשֶׁ֣י/ךָ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/010.yaml
  text: And those who know your name will trust in you[a], for you, O Yahweh[c][b], have not forsaken those who seek you.
translation:
  language: de
  text: Und die deinen Namen kennen[a], werden auf dich vertrauen; denn du, Jahwe[c], hast die nicht verlassen[b], die dich suchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „deinen Namen kennen“ ist nicht nur gemeint, den Namen zu wissen. Der „Name“ steht hier auch für Gottes offenbartes Wesen und seinen Ruf.
    reason: cultural_note
  - marker: b
    text: 'Oder: „nicht im Stich gelassen“.'
    reason: lexical_alternative
  - marker: c
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִבְטְחוּ בְךָ
  choice: Und … werden auf dich vertrauen
  rationale: Das Qal-Imperfekt von בטח bezeichnet zuversichtliches Vertrauen. Die Zukunftsform gibt den hier naheliegenden zukunftsbezogenen Sinn wieder; בְּ markiert das Gegenüber des Vertrauens und wird idiomatisch mit „auf dich“ wiedergegeben.
- source_word: יֹדְעֵי שְׁמֶךָ
  choice: alle, die deinen Namen kennen
  rationale: Die Partizipialkonstruktion bezeichnet eine Gruppe, die dadurch gekennzeichnet ist, Gottes Namen zu kennen. „Name“ bleibt erhalten, weil der Ausdruck zugleich Gottes offenbartes Wesen und seinen Ruf anklingen lässt.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für das zuvor ausgesprochene Vertrauen ein.
- source_word: לֹא עָזַבְתָּ
  choice: hast … nicht verlassen
  rationale: עזב kann „verlassen“, „im Stich lassen“ oder „aufgeben“ bedeuten. Das deutsche Perfekt wahrt den vollendeten Vorgang mit gegenwärtiger Bedeutung.
- source_word: דֹּרְשֶׁיךָ
  choice: die dich suchen
  rationale: דרש bezeichnet in Bezug auf Gott häufig hingebungsvolles, betendes Suchen. „Dich suchen“ ist verständlich und bewahrt die religiöse Weite des Ausdrucks.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname JHWH wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bedeutungsumfang von „deinen Namen kennen“
  choice: Die konkrete Wendung bleibt im Haupttext stehen und wird in einer Fußnote erläutert.
  alternative: „dein Wesen kennen“ oder „wissen, wer du bist“
  rationale: Das hebräische „Name“ meint mehr als die Lautgestalt, darf aber nicht auf eine einzige abstrakte Umschreibung eingeengt werden.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Unterschied gegenüber einem bloßen Titel; die traditionelle Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht poetischer Satzstellung. Die Parallelität und die begründende Verbindung des hebräischen Verses bleiben erhalten; unnötig altertümliche Formen werden vermieden.
