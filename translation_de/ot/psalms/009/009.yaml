source:
  edition: WLC
  text: וִ֘/יהִ֤י יְהוָ֣ה מִשְׂגָּ֣ב לַ/דָּ֑ךְ מִ֝שְׂגָּ֗ב לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/009.yaml
  text: And Yahweh will be a stronghold for the oppressed[b][a], a stronghold in times of trouble.
translation:
  language: de
  text: 'Und Jahwe wird den Unterdrückten[a] eine Zuflucht[b] sein,

    eine Zuflucht in Zeiten der Not.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Niedergedrückten“ beziehungsweise „den Zermalmten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Festung“ beziehungsweise „einen sicheren, hoch gelegenen Schutzort“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: Und … wird … sein
  rationale: Die Verbform kann formal auch als Wunsch verstanden werden; im Zusammenhang der vertrauensvollen Aussagen des Psalms liegt jedoch eine zukunftsgerichtete Feststellung näher. Das einleitende ו wird mit „Und“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִשְׂגָּב
  choice: Zuflucht
  rationale: Das Substantiv bezeichnet einen sicheren, erhöhten und schwer zugänglichen Schutzort. „Zuflucht“ ist im Deutschen natürlich und bewahrt die Schutzfunktion; die räumliche Nuance wird in der Fußnote erläutert. Die Wiederholung bleibt als poetische Verstärkung erhalten.
- source_word: לַדָּךְ
  choice: den Unterdrückten
  rationale: דָּךְ bezeichnet den niedergedrückten, zermalmten oder bedrängten Menschen. Der substantivierte Plural ist im Deutschen idiomatisch und entspricht dem kollektiv verstandenen Singular des Hebräischen.
- source_word: לְעִתּוֹת בַּצָּרָה
  choice: in Zeiten der Not
  rationale: Die Wendung bezeichnet wiederkehrende Situationen der Bedrängnis. „In Zeiten der Not“ ist klar, gegenwärtig und poetisch angemessen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; die Transliteration bewahrt diese Unterscheidung gegenüber einem bloßen Titel.
- issue: Aussage oder Wunsch in וִיהִי
  choice: 'zukunftsgerichtete Aussage: „wird … sein“'
  alternative: 'Wunsch: „Möge … sein“'
  rationale: Die Form lässt grundsätzlich eine jussivische Deutung zu. Der Kontext von Psalm 9 spricht hier jedoch eher für eine vertrauensvolle Feststellung über Jahwes Schutz als für eine Bitte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die syntaktische Wiederholung des hebräischen Textes wurde beibehalten; „Zuflucht sein“ ist verständlich und bibelpoetisch, ohne unnötig altertümlich zu wirken.
