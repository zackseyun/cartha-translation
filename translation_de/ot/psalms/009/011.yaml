id: PSA.9.11
reference: Psalms 9:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זַמְּר֗וּ לַ֭/יהוָה יֹשֵׁ֣ב צִיּ֑וֹן הַגִּ֥ידוּ בָ֝/עַמִּ֗ים עֲלִֽילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/011.yaml
  text: Sing praises to Yahweh[a], who dwells in Zion; declare his deeds among the peoples.
translation:
  language: de
  text: Singt Jahwe Loblieder, der auf dem Zion wohnt[a]; verkündet unter den Völkern seine Taten!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der auf dem Zion thront“.'
    reason: alternative_reading
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Singt … Loblieder
  rationale: Der Imperativ Plural von זמר bezeichnet im Lobkontext musikalischen Gotteslob. „Loblieder singen“ gibt diese Bedeutung natürlich und würdig wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יֹשֵׁב צִיּוֹן
  choice: der auf dem Zion wohnt
  rationale: Das Partizip יֹשֵׁב kann „wohnend“ oder „thronend“ bedeuten. Die Hauptfassung bewahrt den Gedanken der Gegenwart Gottes auf dem Zion, ohne das königliche Bild ausdrücklich festzulegen.
- source_word: הַגִּידוּ
  choice: verkündet
  rationale: Der Hifil-Imperativ fordert zum öffentlichen Bekanntmachen auf; „verkündet“ entspricht dem gehobenen poetischen Register.
- source_word: בָעַמִּים
  choice: unter den Völkern
  rationale: Die Präposition ב bezeichnet hier den Bereich, in dem verkündet wird. Der Plural „Völker“ bewahrt den gemeinschaftlich-ethnischen Sinn von עַמִּים.
- source_word: עֲלִילוֹתָיו
  choice: seine Taten
  rationale: עֲלִילוֹת bezeichnet Handlungen oder Taten. „Seine Taten“ ist prägnant und fügt keine im Substantiv nicht ausdrücklich enthaltene Wertung wie „mächtig“ hinzu.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher erkennbar wiedergegeben, statt ihn durch den traditionellen Ersatztitel „der HERR“ zu ersetzen.
- issue: Bedeutungsnuance von יֹשֵׁב צִיּוֹן
  choice: der auf dem Zion wohnt
  alternative: der auf dem Zion thront
  rationale: Die hebräische Form kann sowohl Gottes Wohnen als auch sein königliches Thronen ausdrücken. Die Hauptfassung vermeidet eine vorschnelle Festlegung; die plausible königliche Nuance bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem poetischem Klang. Die parallelen Imperative werden bewahrt; „auf dem Zion“ entspricht dem üblichen deutschen Sprachgebrauch für den Berg beziehungsweise Heiligtumsort.
