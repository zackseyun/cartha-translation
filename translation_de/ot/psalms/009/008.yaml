  text: וְ/ה֗וּא יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק יָדִ֥ין לְ֝אֻמִּ֗ים בְּ/מֵישָׁרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/008.yaml
  text: And he will judge the world in righteousness[b][a]; he will govern the peoples with fairness.
translation:
  language: de
  text: Und er wird den Erdkreis[a] in Gerechtigkeit richten; über die Völker wird er in Aufrichtigkeit Recht sprechen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die Welt“ oder „die bewohnte Welt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „in Geradheit“ oder „mit Billigkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Und er
  rationale: Die Konjunktion führt den Gedanken fort; das selbstständige Pronomen hebt das Subjekt leicht hervor, ohne dass im Deutschen ein verstärkendes „selbst“ nötig ist.
- source_word: יִשְׁפֹּט
  choice: wird … richten
  rationale: שׁפט bezeichnet hier das richterliche Handeln. Das Futur gibt die poetische Aussage angemessen wieder, ohne einen bestimmten endzeitlichen Ablauf festzulegen.
- source_word: תֵּבֵל
  choice: den Erdkreis
  rationale: תבל meint die Welt als bewohnten Lebensraum beziehungsweise die bewohnte Welt. „Erdkreis“ bewahrt den poetischen und umfassenden Sinn.
- source_word: בְּצֶדֶק
  choice: in Gerechtigkeit
  rationale: Die nominale Form erhält das theologische Gewicht von צדק und bezeichnet den Maßstab beziehungsweise die Art des Richtens.
- source_word: יָדִין
  choice: wird … Recht sprechen
  rationale: דין bezeichnet richterliches Entscheiden. „Recht sprechen“ gibt diesen Sinn natürlich wieder und wahrt zugleich die hebräische Variation gegenüber שׁפט.
- source_word: לְאֻמִּים
  choice: über die Völker
  rationale: לאמים bezeichnet Völker beziehungsweise Volksgemeinschaften; die Präposition wird im Deutschen bei „Recht sprechen“ idiomatisch mit „über“ wiedergegeben.
- source_word: בְּמֵישָׁרִים
  choice: unparteiisch
  rationale: מישרים bezeichnet Geradheit, Rechtschaffenheit oder Billigkeit. Im Kontext eines Urteils bringt „unparteiisch“ die gerechte, ausgewogene Rechtsprechung klar und modern zum Ausdruck.
theological_decisions:
- issue: Gottes richterliche Herrschaft über die ganze Menschheit
  choice: Der Vers beschreibt Gottes umfassendes Richten als gerecht und unparteiisch, ohne es ausdrücklich auf ein bestimmtes endzeitliches Schema festzulegen.
  alternative: Die Verbformen können auch als Ausdruck seines beständigen, charakteristischen Richtens verstanden werden.
  rationale: Hebräische Yiqtol-Formen können in poetischen Aussagen zukünftig oder charakteristisch gebraucht sein. Das deutsche Futur folgt dem Kontext, ohne die zeitliche Spannung dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erdkreis“ erhält den poetischen Ton, während „unparteiisch Recht sprechen“ die zweite Zeile verständlich und juristisch präzise wiedergibt.
