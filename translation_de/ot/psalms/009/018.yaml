  text: כִּ֤י לֹ֣א לָ֭/נֶצַח יִשָּׁכַ֣ח אֶבְי֑וֹן תִּקְוַ֥ת ענוים תֹּאבַ֥ד לָ/עַֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/018.yaml
  text: For the needy will not be forgotten forever[b][a]; the hope of the afflicted will not perish forever.
translation:
  language: de
  text: Denn der Bedürftige wird nicht für immer vergessen[a]; die Hoffnung der Bedrängten wird nicht auf ewig verloren gehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Passiv lässt den Handelnden unausgesprochen; dem Zusammenhang nach ist gemeint, dass Gott den Bedürftigen nicht dauerhaft vergisst.
    reason: grammatical_note
  - marker: b
    text: 'Oder: „der Demütigen“ oder „der Sanftmütigen“. Das hebräische Wort ענוים kann sowohl Bedrängte und Erniedrigte als auch demütige Menschen bezeichnen. Die beiden Ausdrücke „für immer“ und „auf ewig“ sind bedeutungsnahe poetische Parallelen.'
    reason: lexical_and_poetic_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Zusicherung für die vorausgehende Bitte ein und bewahrt den Zusammenhang natürlich.
- source_word: לֹא לָנֶצַח יִשָּׁכַח
  choice: wird nicht für immer vergessen
  rationale: Die passive Form und die zeitliche Wendung werden eng am Hebräischen wiedergegeben; Gott bleibt als Handelnder unausgesprochen.
- source_word: אֶבְיוֹן
  choice: der Bedürftige
  rationale: Bezeichnet einen Menschen in Not oder Armut; die singularische Kollektivform des Hebräischen bleibt erhalten.
- source_word: תִּקְוַת
  choice: die Hoffnung
  rationale: Gibt die Konstruktverbindung mit dem folgenden Personenbegriff natürlich wieder.
- source_word: ענוים
  choice: der Gebeugten
  rationale: Erfasst im Parallelismus mit dem Bedürftigen besonders die Erfahrung von Bedrängnis und Erniedrigung, ohne die mögliche Bedeutung von Demut auszuschließen.
- source_word: תֹּאבַד
  choice: wird nicht … vergehen
  rationale: Das im zweiten Versglied sinngemäß fortwirkende לֹא wird im Deutschen ergänzt; bei Hoffnung ist „vergehen“ eine natürliche Wiedergabe von אבד.
- source_word: לָעַד
  choice: auf ewig
  rationale: Bewahrt die bedeutungsnahe, aber sprachlich variierte Parallele zu לָנֶצַח.
theological_decisions:
- issue: Handelnder beim passiven „wird vergessen“
  choice: Die passive Form bleibt erhalten; Gott wird nicht ausdrücklich als Subjekt eingesetzt.
  alternative: Gott wird den Bedürftigen nicht für immer vergessen.
  rationale: Der Kontext legt Gottes Erinnern nahe, doch der hebräische Wortlaut nennt ihn in diesem Satz nicht ausdrücklich als Handelnden.
- issue: Bedeutung von ענוים
  choice: die Gebeugten
  alternative: die Demütigen / die Sanftmütigen / die Bedrängten
  rationale: Der Parallelismus mit אֶבְיוֹן rückt soziale Not und Erniedrigung in den Vordergrund. Eine Fußnote erhält die ethische Bedeutungsnuance der Demut.
- issue: Negation im zweiten Versglied
  choice: „nicht“ wird im Deutschen ausdrücklich wiederholt.
  alternative: die Hoffnung der Gebeugten wird auf ewig vergehen
  rationale: Die Negation des ersten Versglieds gilt aufgrund des parallelen Satzbaus sinngemäß auch im zweiten; ihre Wiederholung verhindert ein gegenteiliges Verständnis.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und die beiden nah verwandten Ewigkeitsschilderungen bleiben hörbar; unnötig konfessionelle Festlegungen werden vermieden.
