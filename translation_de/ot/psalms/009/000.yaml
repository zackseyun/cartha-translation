  text: לַ֭/מְנַצֵּחַ עַלְמ֥וּת לַבֵּ֗ן מִזְמ֥וֹר לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/000.yaml
  text: 'For the choirmaster: according to “Death of the Son.”[a] A psalm of David.'
translation:
  language: de
  text: Für den Chorleiter. Nach »Almut-Labben«.[a] Ein Psalm Davids.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Bedeutung des hebräischen Ausdrucks עַלְמוּת לַבֵּן (transliteriert: ʿalmût labbēn) ist unsicher. Wahrscheinlich handelt es sich um eine musikalische Anweisung oder den Titel einer Melodie. Er wird traditionell auch als »Tod des Sohnes« verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In Psalmüberschriften bezeichnet die Form mit ל wahrscheinlich eine Aufführungsanweisung für den musikalischen Leiter. »Chorleiter« ist verständlich und bewahrt den gottesdienstlich-musikalischen Bezug.
- source_word: עַלְמוּת לַבֵּן
  choice: Nach »Tod des Sohnes«
  rationale: Die schwierige Wendung fungiert wahrscheinlich als musikalische Angabe oder Liedtitel. »Nach« gibt den Bezug auf eine Melodie knapp wieder; die Übersetzung des mutmaßlichen Titels folgt der masoretischen Lesetradition, während die Unsicherheit in der Fußnote offengelegt wird.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: מִזְמוֹר bezeichnet in Überschriften regelmäßig ein Psalmlied und wird im Deutschen natürlich mit »Psalm« wiedergegeben.
- source_word: לְדָוִד
  choice: Davids
  rationale: 'Der deutsche Genitiv bewahrt eher als »von David« die mögliche Bandbreite des hebräischen לְ: Verfasserschaft, Zugehörigkeit, Widmung oder Sammlung.'
theological_decisions: []
translation_notes:
  register: Moderne, knappe und würdige Form einer Psalmüberschrift. Die Interpunktion gliedert die drei Angaben klar; die sachliche Unsicherheit der musikalischen Wendung wird nicht im Haupttext geglättet, sondern unmittelbar am betreffenden Ausdruck markiert.
