  text: so that I may recount all your praises in the gates of Daughter Zion[a]; I will rejoice in your salvation.
translation:
  language: de
  text: 'damit ich all dein Lob verkünde


    in den Toren der Tochter Zion;


    über deine Rettung[a] will ich jubeln.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: deine Befreiung. Das hebräische Wort kann die Rettung aus gegenwärtiger Gefahr ebenso bezeichnen wie Heil in einem umfassenderen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Leitet einen Zweck- oder Folgesatz ein und gibt die hebräische Funktion knapp und natürlich wieder.
- source_word: אֲסַפְּרָה
  choice: ich … verkünde
  rationale: Das Piel von ספר bezeichnet hier das erzählende, öffentliche Bekanntmachen. „Verkünden“ passt zum Lob Gottes und zum öffentlichen Ort der Tore.
- source_word: כָּל תְּהִלָּתֶיךָ
  choice: all deine Ruhmestaten
  rationale: Der Plural kann sowohl das Gott zukommende Lob als auch seine lobenswerten Taten bezeichnen. „Ruhmestaten“ ist im Deutschen natürlich, bewahrt den Plural und passt zum Verb des Erzählens bzw. Verkündens.
- source_word: בְּשַׁעֲרֵי
  choice: in den Toren
  rationale: Bewahrt die räumliche Bildsprache und den Kontrast zu den Toren des Todes im vorangehenden Vers; die Stadttore waren zugleich öffentliche Versammlungsorte.
- source_word: בַת צִיּוֹן
  choice: der Tochter Zion
  rationale: Bewahrt die poetische Personifikation Zions, ohne sie erklärend mit Jerusalem gleichzusetzen.
- source_word: אָגִילָה
  choice: will ich jubeln
  rationale: גיל bezeichnet freudiges Frohlocken. „Jubeln“ gibt die Intensität natürlich und würdig wieder; „will“ spiegelt den volitiven Charakter der Kohortativform.
- source_word: בִּישׁוּעָתֶךָ
  choice: über deine Rettung
  rationale: יְשׁוּעָה bezeichnet Rettung bzw. Heil. Im unmittelbaren Zusammenhang steht die Befreiung aus gegenwärtiger Bedrängnis im Vordergrund; „Rettung“ bleibt zugleich für die weitere Heilsbedeutung offen. Das hebräische ב wird beim deutschen Verb „jubeln“ idiomatisch mit „über“ wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang von יְשׁוּעָה
  choice: Rettung
  alternative: Heil oder Befreiung
  rationale: „Rettung“ entspricht dem unmittelbaren Kontext der Bewahrung vor Feinden, ohne die umfassendere theologische Bedeutung des Begriffs auszuschließen. Die konkrete Alternative „Befreiung“ wird in der Fußnote genannt.
- issue: Deutung von תְּהִלָּתֶיךָ
  choice: deine Ruhmestaten
  alternative: dein ganzes Lob / alle deine Lobpreisungen
  rationale: Der Ausdruck kann Lob sowie das Lobenswerte an Gottes Handeln bezeichnen. Wegen אֲסַפְּרָה („erzählen/verkünden“) ist die Wiedergabe als „Ruhmestaten“ im Deutschen besonders stimmig, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Zeilengliederung. Die ungewöhnliche, aber verständliche Wendung „Tochter Zion“ bleibt als biblische Personifikation erhalten. Die Wortstellung der Schlusszeile hebt Gottes Rettung hervor.
