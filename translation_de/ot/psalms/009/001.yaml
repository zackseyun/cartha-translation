id: PSA.9.1
reference: Psalms 9:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אוֹדֶ֣ה יְ֭הוָה בְּ/כָל לִבִּ֑/י אֲ֝סַפְּרָ֗ה כָּל נִפְלְאוֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/001.yaml
  text: I will give thanks to Yahweh with all my heart[a]; I will recount all your wondrous deeds.
translation:
  language: de
  text: Ich will Jahwe von ganzem Herzen danken; ich will alle deine Wundertaten[a] erzählen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle deine Wunder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: ich will … danken
  rationale: Das Hifil von ידה bezeichnet im gottesdienstlichen Zusammenhang Dank und Lob. „Danken“ bewahrt hier den Schwerpunkt auf der Dankbarkeit; „ich will“ gibt die volitive Aussage angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben. „Jahwe“ ist die im modernen Deutschen übliche Form der wissenschaftlichen Umschrift.
- source_word: בְּכָל לִבִּי
  choice: von ganzem Herzen
  rationale: Die geläufige deutsche Wendung gibt die hebräische Vorstellung ungeteilter, innerer Hingabe natürlich und vollständig wieder.
- source_word: אֲסַפְּרָה
  choice: ich will … erzählen
  rationale: ספר bezeichnet das berichtende Erzählen oder Verkünden. Die Kohortativform drückt den entschlossenen Willen des Beters aus.
- source_word: כָּל
  choice: alle
  rationale: Die umfassende Aussage des Hebräischen bleibt ausdrücklich erhalten.
- source_word: נִפְלְאוֹתֶיךָ
  choice: deine Wundertaten
  rationale: Das Wort bezeichnet staunenerregende, besonders göttliche Taten. „Wundertaten“ verbindet den Aspekt des Wunders mit dem konkreten Handeln.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von נִפְלְאוֹתֶיךָ
  choice: deine Wundertaten
  alternative: deine Wunder
  rationale: „Wundertaten“ hebt das machtvolle Handeln Gottes hervor, ohne den weiteren Sinn „Wunder“ auszuschließen; diese echte lexikalische Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und das zweimalige „ich will“ bewahren den entschlossenen, poetischen Charakter des hebräischen Verses.
