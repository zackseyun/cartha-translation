  yaml_path: translation/ot/psalms/029/000.yaml
  text: A psalm of David. Ascribe to Yahweh[a], sons of the mighty, ascribe to Yahweh glory and strength.
translation:
  language: de
  text: 'Ein Psalm Davids.


    Gebt Jahwe, ihr Göttersöhne[a], gebt Jahwe Ehre und Stärke!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „Söhne der Götter“; auch möglich: „Söhne Gottes“, „Söhne der Mächtigen“ oder „himmlische Wesen“. Gemeint sind wahrscheinlich Wesen des himmlischen Rates.'
    reason: Die hebräische Wendung בְּנֵי אֵלִים ist mehrdeutig und bezeichnet hier wahrscheinlich übermenschliche Wesen, ohne dass ihre genaue Identität ausdrücklich festgelegt wird.
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Ein Psalm Davids
  rationale: Die knappe deutsche Überschrift gibt sowohl die Gattungsangabe מִזְמוֹר als auch die traditionelle Zuordnung durch לְדָוִד natürlich und ohne zusätzliche Festlegung wieder.
- source_word: הָבוּ
  choice: Gebt
  rationale: Der wiederholte Imperativ wird entsprechend der hebräischen Struktur zweimal wiedergegeben. Im Zusammenhang bedeutet „geben“, Jahwe Ehre und Macht zuzuerkennen beziehungsweise zuzuschreiben.
- source_word: יהוה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּנֵי אֵלִים
  choice: ihr Göttersöhne
  rationale: Die formnahe Wiedergabe bewahrt die Bildsprache und die mögliche Bezugnahme auf Wesen des himmlischen Rates. Die Anredepartikel „ihr“ macht die deutsche Satzfunktion deutlich, ohne ein zusätzliches „o“ zu verwenden.
- source_word: כָּבוֹד וָעֹז
  choice: Ehre und Macht
  rationale: „Ehre“ gibt כָּבוֹד in der Aufforderung idiomatisch wieder; „Macht“ entspricht עֹז und klingt im modernen Deutschen natürlicher als „Stärke“, wenn sie Gott zugeschrieben wird.
theological_decisions:
- issue: Identität der בְּנֵי אֵלִים
  choice: Göttersöhne
  alternative: Söhne Gottes; himmlische Wesen; Söhne der Mächtigen
  rationale: Die ungewöhnliche Bezeichnung wird nicht auf menschliche Herrscher oder Engel verengt. Die formnahe Haupttextfassung und die Fußnote erhalten die sprachliche und theologische Spannung.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Verwendung des Namens wahrt die Unterscheidung zwischen dem Tetragramm und dem Titel אֲדֹנָי.
translation_notes:
  register: Moderne, würdige Standardsprache. Die poetische Wiederholung von „Gebt Jahwe“ bleibt erhalten; „Göttersöhne“ bewahrt die markante Bildsprache des Hebräischen und wird durch eine erklärende Fußnote abgesichert.
