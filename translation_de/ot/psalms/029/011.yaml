id: PSA.29.11
reference: Psalms 29:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְֽהוָ֗ה עֹ֭ז לְ/עַמּ֣/וֹ יִתֵּ֑ן יְהוָ֓ה יְבָרֵ֖ךְ אֶת עַמּ֣/וֹ בַ/שָּׁלֽוֹם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/011.yaml
  text: Yahweh gives strength to his people[b][a]; Yahweh blesses his people with peace.
translation:
  language: de
  text: Jahwe gibt seinem Volk Kraft[a]; Jahwe segnet sein Volk mit Frieden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe wird seinem Volk Kraft geben; Jahwe wird sein Volk mit Frieden segnen.“ Die hebräischen Imperfektformen können auch zukünftig verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort für „Frieden“ (Schalom) kann auch Unversehrtheit und Wohlergehen umfassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: עֹז
  choice: Kraft
  rationale: „Kraft“ gibt die Bedeutung von Stärke oder Macht natürlich wieder und passt als Objekt zu „gibt“.
- source_word: לְעַמּוֹ
  choice: seinem Volk
  rationale: Die Präposition לְ bezeichnet hier den Empfänger der Gabe; im Deutschen wird dies idiomatisch durch den Dativ ausgedrückt.
- source_word: יִתֵּן
  choice: gibt
  rationale: Das Imperfekt kann in diesem poetischen Schluss eine charakteristische beziehungsweise zuversichtlich festgestellte Handlung ausdrücken; die Zukunftsbedeutung bleibt in einer Fußnote erhalten.
- source_word: יְבָרֵךְ
  choice: segnet
  rationale: Parallel zu יִתֵּן wird das Imperfekt als gegenwärtige, zuversichtliche Aussage verstanden; auch hier ist eine zukünftige Wiedergabe möglich.
- source_word: אֶת עַמּוֹ
  choice: sein Volk
  rationale: Die Wiederholung von „sein Volk“ bewahrt den Parallelismus des hebräischen Verses.
- source_word: בַשָּׁלוֹם
  choice: mit Frieden
  rationale: „Mit Frieden“ ist bei „segnen“ idiomatisch und bewahrt den Kerngehalt von שָׁלוֹם, das auch umfassendes Wohlergehen einschließen kann.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Imperfektformen יִתֵּן und יְבָרֵךְ
  choice: 'Gegenwärtig-deklarativ: „gibt … segnet“'
  alternative: 'Zukünftig: „wird … geben; wird … segnen“; als Wunsch: „möge … geben; möge … segnen“'
  rationale: Im poetischen Abschluss können die Formen Jahwes charakteristisches Handeln als zuversichtliche Aussage bezeichnen. Die ebenfalls mögliche Zukunftsbedeutung wird ausdrücklich angemerkt; eine Wunschlesart ist grammatisch denkbar, im Kontext jedoch weniger wahrscheinlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und die Wiederholung des Gottesnamens sowie von „sein Volk“ bleiben erhalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Aussagen.
