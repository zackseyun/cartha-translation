  text: יְ֭הוָה לַ/מַּבּ֣וּל יָשָׁ֑ב וַ/יֵּ֥שֶׁב יְ֝הוָ֗ה מֶ֣לֶךְ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/010.yaml
  text: Yahweh sat enthroned over the flood[a]; Yahweh sits enthroned as King forever.
translation:
  language: de
  text: Jahwe thronte über der Flut[a]; Jahwe thront als König für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „über der Sintflut“, als mögliche Anspielung auf die Flut zur Zeit Noahs.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird in seiner im Deutschen geläufigen wissenschaftlichen Form „Jahwe“ wiedergegeben.
- source_word: לַמַּבּוּל
  choice: über der Flut
  rationale: מַבּוּל bezeichnet eine Flut beziehungsweise Sintflut. Die Präposition ל wird hier im Zusammenhang mit dem königlichen Sitzen als Herrschaft über die Flut verstanden; „über der Flut“ bewahrt zugleich die bildhafte Offenheit.
- source_word: יָשָׁב
  choice: thronte
  rationale: Das Grundverb bedeutet „sitzen“, hat hier aber durch den ausdrücklichen Königstitel einen klaren Thron- und Herrschaftsbezug. „thronte“ gibt diesen in natürlichem, würdigem Deutsch knapp wieder.
- source_word: וַיֵּשֶׁב
  choice: thront
  rationale: Die Form setzt die Aussage fort; zusammen mit „für immer“ hebt sie die fortdauernde Herrschaft hervor. Das deutsche Präsens bringt diese bleibende Wirklichkeit klar zum Ausdruck.
- source_word: מֶלֶךְ
  choice: als König
  rationale: מֶלֶךְ bezeichnet hier Jahwes königliche Stellung. „als König“ fügt sich idiomatisch in die deutsche Konstruktion mit „thronen“ ein.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Eine klare, gegenwärtige Wiedergabe der zeitlich unbegrenzten Dauer.
theological_decisions:
- issue: Bezeichnet מַבּוּל allgemein die Flut beziehungsweise chaotische Wassermassen oder speziell die Sintflut zur Zeit Noahs?
  choice: Im Haupttext steht allgemein „der Flut“.
  alternative: „der Sintflut“ als ausdrückliche Anspielung auf die Flut zur Zeit Noahs.
  rationale: מַבּוּל wird im Alten Testament besonders für die Sintflut gebraucht, doch nennt der Vers Noah nicht; zudem steht Psalm 29 im Zusammenhang einer Sturmtheophanie. Die allgemeinere Formulierung wahrt beide möglichen Bezüge.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Wiederholung von „Jahwe“ und der Wechsel vom Präteritum „thronte“ zum präsentischen „thront“ spiegeln die Bewegung von einer vergangenen Machterweisung zu bleibender Königsherrschaft.
