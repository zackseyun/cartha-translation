  text: ק֤וֹל יְהוָ֨ה יְחוֹלֵ֣ל אַיָּלוֹת֮ וַֽ/יֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת וּ/בְ/הֵיכָל֑/וֹ כֻּ֝לּ֗/וֹ אֹמֵ֥ר כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/009.yaml
  text: The voice of Yahweh makes the deer give birth and strips the forests bare[a], and in his temple all say[b], “Glory!”
translation:
  language: de
  text: 'Die Stimme des HERRN lässt die Hirschkühe gebären[a] und entblößt die Wälder; und in seinem Tempel[b] sagen alle: »Herrlichkeit!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »lässt die Hirschkühe sich winden«, möglicherweise in Geburtswehen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann »Tempel« oder »Palast« bedeuten.
    reason: alternative_reading
lexical_decisions:
- source_word: ק֤וֹל יְהוָ֨ה
  choice: Die Stimme des HERRN
  rationale: Die hebräische Genitivverbindung wird unmittelbar wiedergegeben; der Gottesname JHWH erscheint in der im Deutschen vertrauten Form »der HERR«.
- source_word: יְחוֹלֵ֣ל
  choice: lässt … kalben
  rationale: Das Verb kann ein Sichwinden, besonders in Geburtswehen, bezeichnen. Zusammen mit den weiblichen Hirschen ergibt sich natürlich der Sinn, dass die Stimme des HERRN sie gebären lässt; die wörtlichere Nuance bleibt in der Fußnote erhalten.
- source_word: אַיָּלוֹת
  choice: die Hirschkühe
  rationale: Der feminine Plural bezeichnet weibliche Hirsche. »Hirschkühe« gibt dies präzise und in modernem Deutsch wieder.
- source_word: וַֽיֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת
  choice: und entblößt die Wälder
  rationale: חשׂף bedeutet entblößen oder bloßlegen. Die Formulierung bewahrt das kräftige Bild der verheerenden Wirkung des Sturms.
- source_word: וּבְהֵיכָלוֹ
  choice: und in seinem Tempel
  rationale: הֵיכָל kann Tempel oder Palast bedeuten. Im Zusammenhang mit der ehrenden Akklamation ist »Tempel« naheliegend; die echte Bedeutungsalternative wird in der Fußnote genannt.
- source_word: כֻּלּוֹ אֹמֵר
  choice: sagen alle
  rationale: Die Wendung bezeichnet kollektiv alle, die sich darin befinden. Der formal singularische Ausdruck wird im Deutschen idiomatisch im Plural wiedergegeben; »sagen« entspricht dem gewöhnlichen Sinn von אמר.
- source_word: כָּבֽוֹד
  choice: Herrlichkeit!
  rationale: Das einzelne Ausrufwort bewahrt die knappe kultische Akklamation und die im Lobpreis übliche Bedeutung von כבוד.
theological_decisions:
- issue: Bedeutung von הֵיכָל als Ort der Herrlichkeit Gottes
  choice: Tempel
  alternative: Palast
  rationale: Der Lobpreis im Kontext legt den Tempel als Gottes Heiligtum nahe. Da das Wort zugleich einen Königspalast bezeichnen kann und der Psalm Gottes Königsherrschaft hervorhebt, wird diese Alternative nicht ausgeschlossen, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit anschaulicher Sturmsprache. Der Parallelismus und die knappe abschließende Akklamation bleiben erhalten; echte lexikalische Mehrdeutigkeiten werden durch Fußnoten offengehalten.
