  text: הָב֣וּ לַֽ֭/יהוָה כְּב֣וֹד שְׁמ֑/וֹ הִשְׁתַּחֲו֥וּ לַ֝/יהוָ֗ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/002.yaml
  text: Ascribe to Yahweh the glory of his name[a]; worship Yahweh in holy splendor.
translation:
  language: de
  text: Gebt Jahwe die Ehre, die seinem Namen gebührt; betet Jahwe an in heiliger Pracht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »in der Pracht der Heiligkeit«; möglicherweise ist heilige Kleidung gemeint.'
    reason: Die mehrdeutige hebräische Wendung בְּהַדְרַת קֹדֶשׁ kann eine Eigenschaft heiliger Pracht oder konkrete kultische Kleidung bezeichnen.
lexical_decisions:
- source_word: הָבוּ
  choice: Gebt
  rationale: Der Imperativ Plural steht in einer poetisch-liturgischen Aufforderung. »Gebt … die Ehre« ist im Deutschen idiomatisch und meint, Jahwe die ihm zukommende Ehre zuzuerkennen, nicht eine körperliche Übergabe.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל kennzeichnet den Empfänger der Ehrerweisung; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: כְּבוֹד שְׁמוֹ
  choice: die Ehre, die seinem Namen gebührt
  rationale: כָּבוֹד bezeichnet hier Ehre beziehungsweise Herrlichkeit. Die deutsche Formulierung gibt den Sinn der konstruierten Wendung im Kontext natürlich wieder, ohne den Namen von Jahwes offenbarter Identität zu lösen.
- source_word: הִשְׁתַּחֲווּ
  choice: betet … an
  rationale: Das Verb bezeichnet wörtlich das ehrfürchtige Niederwerfen. Im auf Jahwe bezogenen gottesdienstlichen Kontext gibt »anbeten« die beabsichtigte Handlung in natürlichem Deutsch wieder.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: in heiliger Pracht
  rationale: Die knappe poetische Formulierung bewahrt die Mehrdeutigkeit zwischen heiliger beziehungsweise majestätischer Pracht und einer konkreteren kultischen Ausstattung oder Kleidung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung von בְּהַדְרַת קֹדֶשׁ
  choice: in heiliger Pracht
  alternative: in der Pracht der Heiligkeit; in heiligem Festgewand
  rationale: Die hebräische Wendung kann abstrakt die Pracht der Heiligkeit oder konkreter heilige, festliche Kleidung bezeichnen. Der Haupttext lässt diese Spannung bestehen; die Fußnote nennt die wichtigsten möglichen Deutungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit parallelen Imperativen. Die traditionelle kultische Sprache bleibt verständlich; die schwierige Schlusswendung wird im Haupttext nicht unnötig vereindeutigt.
