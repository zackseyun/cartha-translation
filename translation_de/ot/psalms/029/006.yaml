  text: וַ/יַּרְקִידֵ֥/ם כְּמוֹ עֵ֑גֶל לְבָנ֥וֹן וְ֝/שִׂרְיֹ֗ן כְּמ֣וֹ בֶן רְאֵמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/006.yaml
  text: He makes Lebanon skip like a calf[c][b][a], and Sirion like a young wild ox.
translation:
  language: de
  text: Er lässt den Libanon wie ein Kalb hüpfen und den Sirjon[a] wie einen jungen Wildstier.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sirjon ist ein anderer Name für den Berg Hermon.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich: »wie einen Sohn von Wildstieren«; gemeint ist ein junger Wildstier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְקִידֵם
  choice: Er lässt sie hüpfen
  rationale: 'Die Hifil-Form von רקד ist kausativ: »hüpfen/springen lassen«. Das Suffix der 3. Person Plural wird als »sie« bewahrt und durch die folgenden Ortsnamen näher bestimmt.'
- source_word: כְּמוֹ עֵגֶל
  choice: wie ein Kalb
  rationale: עֵגֶל bezeichnet am natürlichsten ein Kalb; das Bild vermittelt lebhafte, springende Bewegung.
- source_word: לְבָנוֹן
  choice: den Libanon
  rationale: Der Eigenname wird in seiner üblichen deutschen Form wiedergegeben und steht als nachgetragene Bestimmung zu »sie«.
- source_word: וְשִׂרְיֹן
  choice: und den Sirjon
  rationale: Der im hebräischen Text stehende Eigenname wird transliteriert; seine Identifikation mit dem Hermon wird in einer Fußnote erläutert.
- source_word: כְּמוֹ בֶן רְאֵמִים
  choice: wie einen jungen Wildstier
  rationale: בֶן bezeichnet hier idiomatisch ein Jungtier. רְאֵם meint nach heutigem lexikalischem Verständnis einen wilden Auerochsen bzw. Wildstier; »junger Wildstier« ist im Deutschen anschaulich und bewahrt die zoologische Aussage ohne das überholte »Einhorn«.
theological_decisions: []
translation_notes:
  register: Poetisch und würdevoll, zugleich in modernem Standarddeutsch. Die markierte Nachtragskonstruktion bewahrt das hebräische Pronomen »sie« und die anschließende Nennung von Libanon und Sirjon, ohne die Parallelität der beiden Vergleiche völlig einzuebnen.
