  text: ק֣וֹל יְ֭הוָה יָחִ֣יל מִדְבָּ֑ר יָחִ֥יל יְ֝הוָ֗ה מִדְבַּ֥ר קָדֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/008.yaml
  text: The voice of Yahweh shakes the wilderness[a]; Yahweh shakes the wilderness of Kadesh.
translation:
  language: de
  text: Die Stimme Jahwes lässt die Wüste erbeben[a]; Jahwe lässt die Wüste Kadesch erbeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lässt die Wüste sich winden“ oder „bringt die Wüste zum Zittern“.'
    reason: 'Lexikalische Alternative: יָחִיל kann verursachtes Beben, Zittern oder Sichwinden bezeichnen.'
lexical_decisions:
- source_word: ק֣וֹל
  choice: Stimme
  rationale: „Stimme“ bewahrt den persönlichen Charakter und den poetischen Kehrvers קוֹל יְהוָה; „Schall“ wäre unpersönlicher.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יָחִיל
  choice: lässt … erbeben
  rationale: Die Hifil-Form von חול bezeichnet hier ein verursachtes Beben, Zittern oder Sichwinden. „Lässt … erbeben“ ist im Deutschen natürlich, bildkräftig und lässt die Wüste als betroffenes Objekt erkennen.
- source_word: מִדְבָּר
  choice: Wüste
  rationale: „Wüste“ bezeichnet im Deutschen natürlich eine unbewohnte, öde Landschaft und passt zum geografischen Zusammenhang; der Ausdruck ist nicht auf Sandwüste beschränkt.
- source_word: מִדְבַּר קָדֵשׁ
  choice: die Wüste Kadesch
  rationale: Die hebräische Status-constructus-Verbindung wird knapp und idiomatisch wiedergegeben; Kadesch bleibt als Ortsname transliteriert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet das Tetragramm als Eigennamen. „Jahwe“ bewahrt diesen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bildgehalt von יָחִיל
  choice: lässt … erbeben
  alternative: lässt … sich winden; versetzt … in Zittern
  rationale: Das Verb kann Beben, Zittern oder Sichwinden ausdrücken. Die Hauptübersetzung wahrt das Schöpfungsbild, ohne die Wüste unnötig zu personifizieren; die Fußnote erhält die genuine Bedeutungsbreite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „Jahwe lässt die Wüste … erbeben“ bildet den hebräischen Parallelismus nach; „Kadesch“ folgt der im Deutschen üblichen biblischen Namensform.
