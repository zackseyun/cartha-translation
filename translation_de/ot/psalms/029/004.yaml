  text: קוֹל יְהוָ֥ה בַּ/כֹּ֑חַ ק֥וֹל יְ֝הוָ֗ה בֶּ/הָדָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/004.yaml
  text: The voice of Yahweh is powerful[b][a]; the voice of Yahweh is majestic.
translation:
  language: de
  text: Die Stimme Jahwes ist kraftvoll[a]; die Stimme Jahwes ist majestätisch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Stimme Jahwes ergeht mit Kraft; die Stimme Jahwes ergeht mit Majestät.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: Stimme
  rationale: קוֹל kann »Stimme« oder »Schall« bedeuten. »Stimme« bewahrt im wiederkehrenden Leitmotiv des Psalms die persönliche und wirksame Rede Jahwes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: בַּכֹּחַ
  choice: ist kraftvoll
  rationale: Die Präposition ב mit כֹּחַ lässt sich wörtlicher als »mit/in Kraft« oder prädikativ als »kraftvoll« verstehen. Die prädikative Wiedergabe ist im Deutschen natürlich und entspricht dem Sinn.
- source_word: הָדָר
  choice: ist majestätisch
  rationale: הָדָר bezeichnet Majestät, Pracht oder Hoheit. »Majestätisch« bildet den prädikativen Parallelismus mit »kraftvoll« klar und würdig ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. »Jahwe« bewahrt diesen Namen, während »der HERR« die traditionelle Ersatzlesung darstellt.
- issue: Funktion der Präposition ב in בַּכֹּחַ und בֶּהָדָר
  choice: 'prädikativ: »ist kraftvoll … ist majestätisch«'
  alternative: »ergeht mit Kraft … ergeht mit Majestät«
  rationale: Das Hebräische erlaubt eine beschreibende beziehungsweise begleitende Nuance. Die Hauptfassung ist idiomatisches Deutsch; die Fußnote bewahrt die strukturell nähere Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und die zweimalige Nennung Jahwes bleiben erhalten; die genuine Mehrdeutigkeit der Präposition ב wird in der Fußnote dokumentiert.
