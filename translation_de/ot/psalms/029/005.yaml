  text: ק֣וֹל יְ֭הוָה שֹׁבֵ֣ר אֲרָזִ֑ים וַ/יְשַׁבֵּ֥ר יְ֝הוָ֗ה אֶת אַרְזֵ֥י הַ/לְּבָנֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/005.yaml
  text: The voice of Yahweh breaks cedars[b][a]; Yahweh shatters the cedars of Lebanon.
translation:
  language: de
  text: Die Stimme Jahwes zerbricht Zedern[a]; Jahwe zerschmettert die Zedern des Libanon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Schall Jahwes«. Das hebräische Wort qol kann »Stimme« oder »Schall« bedeuten. Im Hebräischen steht in beiden Satzteilen dasselbe Verb für »zerbrechen«; »zerschmettert« gibt hier die poetische Steigerung wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל יְהוָה
  choice: Die Stimme Jahwes
  rationale: קוֹל kann »Stimme« oder »Schall« bedeuten. »Stimme« bewahrt im wiederkehrenden Kehrvers des Psalms die persönliche, theophanische Kraft von Jahwes donnerndem Reden.
- source_word: שֹׁבֵר
  choice: zerbricht
  rationale: Das Qal-Partizip bezeichnet hier eine lebhaft vergegenwärtigte bzw. charakteristische Handlung. Das Präsens gibt dies im Deutschen natürlich und kraftvoll wieder.
- source_word: אֲרָזִים
  choice: Zedern
  rationale: Der unbestimmte Plural bezeichnet Zedern allgemein; die knappe Form entspricht der hebräischen Poesie.
- source_word: וַיְשַׁבֵּר
  choice: zerschmettert
  rationale: Im Hebräischen wird die Wurzel שבר wiederholt. Der stärkere deutsche Ausdruck bildet die poetische Steigerung natürlich ab, während die Fußnote auf die Wiederholung hinweist. Die Form wird im parallelen poetischen Zusammenhang als fortgesetzte gegenwärtige Handlung verstanden.
- source_word: אֶת אַרְזֵי הַלְּבָנוֹן
  choice: die Zedern des Libanon
  rationale: Die Constructusverbindung bezeichnet die berühmten Zedern des Libanon und bleibt in dieser gehobenen, geläufigen deutschen Wendung nahe an der Form des Ausgangstextes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm als persönlichen Gottesnamen. »Jahwe« bewahrt diesen Eigennamecharakter, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdige und rhythmisch knappe Psalmsprache. Die Wortstellung ist natürlich deutsch; der parallele Bau und die Steigerung der beiden Halbverse bleiben hörbar.
