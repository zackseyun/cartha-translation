  text: ק֥וֹל יְהוָ֗ה עַל הַ֫/מָּ֥יִם אֵֽל הַ/כָּב֥וֹד הִרְעִ֑ים יְ֝הוָ֗ה עַל מַ֥יִם רַבִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/003.yaml
  text: The voice of Yahweh is over the waters[a]; the God of glory thunders[b], Yahweh is over many waters.
translation:
  language: de
  text: Die Stimme Jahwes ist über den Wassern; der Gott der Herrlichkeit donnert. Jahwe ist über großen Wassern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוֹל
  choice: Stimme
  rationale: „Stimme“ bewahrt die personale und poetische Kraft des wiederholten Ausdrucks קוֹל יְהוָה; im Zusammenhang wird diese Stimme als Donner hörbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַל
  choice: über
  rationale: „Über“ gibt die räumliche Bildsprache der Sturmtheophanie natürlich und direkt wieder.
- source_word: הַמָּיִם
  choice: den Wassern
  rationale: Der poetische Plural des Hebräischen bleibt erhalten.
- source_word: אֵל הַכָּבוֹד
  choice: der Gott der Herrlichkeit
  rationale: Die hebräische Genitivverbindung wird eng und ohne interpretierende Umformung wiedergegeben.
- source_word: הִרְעִים
  choice: lässt es donnern
  rationale: Die Hifil-Form von רעם hat kausative Kraft. „Lässt es donnern“ ist im Deutschen natürlich und bildet diese Form genauer ab als das schlichte „donnert“.
- source_word: מַיִם רַבִּים
  choice: gewaltigen Wassern
  rationale: רַבִּים bezeichnet hier im poetischen Zusammenhang die große, mächtige Wassermasse; „gewaltige Wasser“ klingt im Deutschen natürlicher als „viele Wasser“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt ihn als Eigennamen, ohne einen Titel einzusetzen.
- issue: Donner als Stimme Gottes
  choice: „Stimme“ und „lässt es donnern“ bleiben als miteinander verbundene poetische Aussagen stehen
  alternative: Die Stimme Jahwes als bloßes Synonym für Donner wiedergeben
  rationale: Der Psalm setzt Gottes Stimme und das Donnergeschehen poetisch zueinander, ohne die Stimme auf ein rein meteorologisches Phänomen zu reduzieren.
- issue: Verbloser Schlusssatz
  choice: „Jahwe ist über gewaltigen Wassern“
  alternative: „Jahwe über gewaltigen Wassern“ als elliptische Apposition
  rationale: Das ergänzte „ist“ macht den eigenständigen Parallelismus im Deutschen deutlich, ohne dem hebräischen Sinn eine zusätzliche Handlung hinzuzufügen.
translation_notes:
  register: Moderne, würdevolle Psalmen-Sprache mit klaren parallelen Aussagen. Der poetische Plural „Wasser“ bleibt erhalten; unnötig altertümliche Wortstellung und konfessionelle Titelersetzung werden vermieden.
