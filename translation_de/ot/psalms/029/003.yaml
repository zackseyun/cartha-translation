    issue: „der Gott der Herrlichkeit lässt es donnern“
    rationale: Das unpersönliche „es“ schwächt die im Hebräischen direkte Prädikation אֵל הַכָּבוֹד הִרְעִים. „Donnert“ ist im Psalmkontext klar und bewahrt das Subjekt.
  - severity: low
    issue: „gewaltigen Wassern“ für מַיִם רַבִּים
    rationale: „Gewaltig“ legt Stärke bzw. Bedrohlichkeit nahe. „Großen Wassern“ bewahrt die poetische Weite der hebräischen Wendung mit geringerer interpretativer Einengung.
