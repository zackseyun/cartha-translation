  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד הָב֣וּ לַֽ֭/יהוָה בְּנֵ֣י אֵלִ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/001.yaml
  text: A psalm of David. Ascribe to Yahweh[a], O sons of God, ascribe to Yahweh glory and strength.
translation:
  language: de
  text: Ein Psalm Davids. Schreibt Jahwe zu, ihr Söhne Gottes,[a] schreibt Jahwe Ehre und Stärke zu!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Göttersöhne“; sinngemäß auch: „Himmelswesen“. Die hebräische Wendung meint wahrscheinlich Angehörige des himmlischen Hofstaats.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: „Psalm“ ist im Deutschen die etablierte und sachlich passende Bezeichnung für diese Liedgattung und Überschrift.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der Genitiv bewahrt wie das hebräische לְ die mögliche Zuordnung zu David, ohne eindeutig zwischen Autorschaft, Zugehörigkeit und Widmung zu entscheiden.
- source_word: הָבוּ
  choice: Gebt
  rationale: Die Grundbedeutung des Imperativs wird bewahrt; im Zusammenhang bedeutet das Geben die Anerkennung dessen, was Jahwe zukommt. Das folgende Objekt „Ehre und Macht“ macht den idiomatischen Sinn verständlich.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: בְּנֵי אֵלִים
  choice: ihr Söhne Gottes
  rationale: Die bildhafte hebräische Wendung wird eng am Wortlaut wiedergegeben und nicht im Haupttext zu „Himmelswesen“ aufgelöst. Die Anrede wird durch „ihr“ natürlich markiert.
- source_word: כָּבוֹד
  choice: Ehre
  rationale: כָּבוֹד bezeichnet hier die Gott zukommende Herrlichkeit bzw. Ehre. „Ehre geben“ ist im Deutschen idiomatisch und passt zum Imperativ הָבוּ.
- source_word: וָעֹז
  choice: und Macht
  rationale: עֹז bezeichnet Stärke oder Macht; „Macht“ klingt in der Verbindung mit göttlicher Ehre natürlich und würdevoll.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Übersetzung gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von בְּנֵי אֵלִים
  choice: Söhne Gottes
  alternative: Himmelswesen / Göttersöhne / Söhne der Mächtigen
  rationale: Der Haupttext bewahrt das hebräische Bild und seine Spannung; die Fußnote erläutert, dass wahrscheinlich Wesen des himmlischen Hofstaats gemeint sind, ohne die Mehrdeutigkeit zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Parallelismus. Die zweimalige Aufforderung „Gebt Jahwe“ folgt der Struktur des Hebräischen; das Ausrufezeichen kennzeichnet den zusammengehörigen Aufruf.
