  text: The voice of Yahweh hews out flames of fire[a].
translation:
  language: de
  text: Die Stimme Jahwes spaltet Feuerflammen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Feuerblitze“; im Gewitterbild des Psalms sind wahrscheinlich Blitze gemeint.'
