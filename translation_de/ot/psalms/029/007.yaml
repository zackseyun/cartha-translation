lexical_decisions:
- source_word: קוֹל
  choice: Stimme
  rationale: „Stimme“ bewahrt im wiederkehrenden Kehrvers von Psalm 29 sowohl den gewöhnlichen Wortsinn als auch die poetische Darstellung des Donners als machtvolle Äußerung Jahwes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: חֹצֵב
  choice: haut … heraus
  rationale: Das Partizip bezeichnet kraftvolles Hauen oder Heraushauen, häufig aus festem Material. Die konkrete, ungewöhnliche Bildsprache des Hebräischen bleibt so erhalten.
- source_word: לַהֲבוֹת
  choice: Flammen
  rationale: Das Substantiv bezeichnet unmittelbar Flammen beziehungsweise Feuerzungen; im Gewitterbild können damit Blitze gemeint sein.
- source_word: אֵשׁ
  choice: Feuer
  rationale: Zusammen mit „Flammen“ entsteht die emphatische Wendung „Feuerflammen“, die das hebräische לַהֲבוֹת אֵשׁ knapp nachbildet.
theological_decisions:
- issue: Gewitterbild und göttliches Handeln ohne meteorologische Überdeutung
  choice: Die Stimme Jahwes haut Feuerflammen heraus.
  alternative: Die Stimme Jahwes lässt Feuerblitze aufflammen.
  rationale: Die Hauptfassung erhält das konkrete und spannungsreiche Bild des hebräischen Verbs; die wahrscheinliche Deutung als Blitze wird nur in der Fußnote erläutert.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die markante Wendung „haut … heraus“ ist bewusst kräftig und leicht fremdartig, um das konkrete hebräische Bild nicht in eine bloße Wetterbeschreibung aufzulösen.
