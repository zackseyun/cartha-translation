source:
  edition: WLC
  text: וַ/יִּ֤ירְא֨וּ יֹשְׁבֵ֣י קְ֭צָוֺת מֵ/אוֹתֹתֶ֑י/ךָ מ֤וֹצָֽאֵי בֹ֖קֶר וָ/עֶ֣רֶב תַּרְנִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/008.yaml
  text: Those who dwell at the ends of the earth fear because of your signs[b][a]; you make the dawn and the evening shout for joy.
translation:
  language: de
  text: Die Bewohner der fernsten Gegenden fürchten sich wegen deiner Zeichen[a]; die Anbrüche von Morgen und Abend lässt du jubeln[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stehen vor deinen Zeichen in Ehrfurcht“. Das hebräische Verb kann Furcht, Schrecken oder ehrfürchtiges Staunen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Ausgänge des Morgens und des Abends“. Gemeint sein können poetisch das Hervortreten von Morgen und Abend oder die Orte beziehungsweise Horizonte, an denen sie erscheinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: fürchten sich
  rationale: Das Verb ירא kann Furcht, Schrecken oder ehrfürchtiges Staunen bezeichnen. „Fürchten sich“ bewahrt diese Bedeutungsbreite eher, als sie eindeutig auf Entsetzen oder Verehrung festzulegen.
- source_word: יֹשְׁבֵי קְצָוֺת
  choice: die Bewohner der fernsten Gegenden
  rationale: Die Wendung bezeichnet wörtlich die an den Enden oder äußersten Rändern Wohnenden und idiomatisch die Menschen in den entlegensten Regionen.
- source_word: מֵאוֹתֹתֶיךָ
  choice: wegen deiner Zeichen
  rationale: Die Präposition מִן kann nach einem Verb des Fürchtens den Grund angeben. „Wegen“ gibt diesen kausalen Zusammenhang im Deutschen klar wieder.
- source_word: אוֹתֹתֶיךָ
  choice: deine Zeichen
  rationale: אוֹת bezeichnet direkt ein Zeichen, hier ein machtvolles Handeln Gottes, das auf ihn und seine Macht verweist. „Wunder“ wäre stärker deutend.
- source_word: מוֹצָאֵי בֹקֶר וָעֶרֶב
  choice: die Aufgänge des Morgens und des Abends
  rationale: מוֹצָאֵי bedeutet wörtlich „Ausgänge“, „Hervorgänge“ oder „Orte des Hervorkommens“. Die bewusst poetische Wiedergabe „Aufgänge“ wahrt die ungewöhnliche Bildsprache und lässt offen, ob Zeiten, Erscheinungen oder Horizonte gemeint sind.
- source_word: תַּרְנִין
  choice: lässt du jubeln
  rationale: Der Hifil von רנן bedeutet, jemanden oder etwas jubeln beziehungsweise freudig rufen zu lassen. Die Konstruktion bewahrt Gott als den Verursacher des Jubels.
theological_decisions:
- issue: Art der Reaktion auf Gottes Zeichen
  choice: „fürchten sich“ ohne nähere Bestimmung
  alternative: „stehen ehrfürchtig da“ oder „erschrecken“
  rationale: Das Hebräische umfasst sowohl Furcht und Schrecken als auch ehrfürchtiges Staunen. Die Übersetzung legt die Reaktion nicht einseitig fest.
- issue: Personifikation von Morgen und Abend
  choice: Gott lässt ihre „Aufgänge“ jubeln
  alternative: Gott lässt Morgenrot und Abend jubeln
  rationale: Die hebräische Formulierung personifiziert nicht schlicht Morgen und Abend, sondern deren מוֹצָאֵי. Die gewählte Fassung erhält diese poetische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Fernste Gegenden“ gibt die räumliche Universalität idiomatisch wieder; „Aufgänge“ bleibt bewusst poetisch und etwas ungewöhnlich, um das hebräische Bild nicht einzuebnen.
