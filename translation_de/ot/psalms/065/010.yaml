source:
  edition: WLC
  text: תְּלָמֶ֣י/הָ רַ֭וֵּה נַחֵ֣ת גְּדוּדֶ֑י/הָ בִּ/רְבִיבִ֥ים תְּ֝מֹגְגֶ֗/נָּה צִמְחָ֥/הּ תְּבָרֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/010.yaml
  text: Saturate its furrows; settle its ridges. With showers you soften it; you bless its growth.
translation:
  language: de
  text: Tränke ihre Furchen, lass ihre Erdkämme sich setzen. Mit Regengüssen weichst du sie auf; ihr Wachstum segnest du.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּלָמֶיהָ רַוֵּה
  choice: Tränke ihre Furchen
  rationale: רוה bezeichnet reichliches Tränken oder Sättigen mit Wasser; תלמים sind die beim Pflügen entstehenden Furchen.
- source_word: נַחֵת גְּדוּדֶיהָ
  choice: lass ihre Erdkämme sich setzen
  rationale: נחת kann hier ein Senken oder Sichsetzenlassen ausdrücken. גדודים bezeichnet in diesem landwirtschaftlichen Parallelismus am ehesten die zwischen den Furchen aufgeworfenen Erdkämme. Die Formulierung bewahrt diese Bildlichkeit, ohne das Verb stärker als „ebnen“ festzulegen.
- source_word: בִּרְבִיבִים תְּמֹגְגֶנָּה
  choice: Mit Regengüssen weichst du sie auf
  rationale: רביבים sind reichliche Regenschauer; מוג beschreibt das Aufweichen beziehungsweise Zerfließenlassen des Bodens.
- source_word: צִמְחָהּ תְּבָרֵךְ
  choice: ihr Wachstum segnest du
  rationale: צמח bezeichnet hier das Hervorsprießen beziehungsweise den Pflanzenwuchs. Die vorangestellte Objektphrase wird durch die deutsche Wortstellung hervorgehoben.
theological_decisions:
- issue: Göttliches Handeln in der Fruchtbarkeit der Erde
  choice: Die direkte Anrede und die Verben des göttlichen Handelns bleiben erhalten.
  alternative: Eine unpersönliche Beschreibung natürlicher Niederschläge und natürlichen Wachstums.
  rationale: Der hebräische Text redet Gott unmittelbar als den an, der bewässert, den Boden aufweicht und das Wachstum segnet.
translation_notes:
  register: Poetisches, aber allgemein verständliches modernes Standarddeutsch. „Erdkämme“ hält den konkreten Ackerbaukontext fest; die markierte Schlussstellung „segnest du“ wahrt den gehobenen Parallelismus des Verses.
