  text: עִ֭טַּרְתָּ שְׁנַ֣ת טוֹבָתֶ֑/ךָ וּ֝/מַעְגָּלֶ֗י/ךָ יִרְעֲפ֥וּ/ן דָּֽשֶׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/011.yaml
  text: You crown the year with your goodness[b][a], and your paths drip with abundance.
translation:
  language: de
  text: 'Du krönst das Jahr mit deiner Güte,

    und deine Pfade triefen von Fülle.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht für »Fülle« ein Wort, das »Fettigkeit« bedeutet und bildlich reichen Ertrag und üppige Fruchtbarkeit bezeichnet. »Pfade« kann auch mit »Bahnen« oder »Fahrspuren« übersetzt werden; möglicherweise ist Gottes Weg durch das Land gemeint, der Fruchtbarkeit zurücklässt.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִטַּרְתָּ
  choice: Du krönst
  rationale: Das Verb bezeichnet hier ein Krönen oder schmückendes Umgeben. Das poetische Präsens gibt die vollendete hebräische Form im Zusammenhang als anschauliche Aussage über Gottes Wirken wieder.
- source_word: שְׁנַת טוֹבָתֶךָ
  choice: das Jahr mit deiner Güte
  rationale: Die Konstruktverbindung kann wörtlich als »das Jahr deiner Güte« verstanden werden. Die Wiedergabe mit »mit« macht im Deutschen natürlich deutlich, womit Gott das Jahr krönt, ohne das Bild auf eine bloße Ernteaussage zu verengen.
- source_word: וּמַעְגָּלֶיךָ
  choice: und deine Spuren
  rationale: מַעְגָּל bezeichnet Pfade, Bahnen oder Fahrspuren. »Spuren« bewahrt hier das konkrete Bild, dass Gottes Weg durch das Land Fruchtbarkeit hinterlässt.
- source_word: יִרְעֲפוּן
  choice: triefen
  rationale: Das Verb bezeichnet Tropfen, Träufeln oder reichliches Herabfließen. »Triefen« erhält das kräftige, konkrete Bild des überströmenden Segens.
- source_word: דָּשֶׁן
  choice: Fülle
  rationale: Das Wort bedeutet wörtlich »Fettigkeit« und bezeichnet übertragen Üppigkeit, Fruchtbarkeit und reichen Ertrag. »Fülle« ist im heutigen Deutsch verständlich und bewahrt die Vorstellung reichen Segens.
theological_decisions:
- issue: Das Bild von Gottes Wirken in der Fruchtbarkeit des Jahres
  choice: Die Bilder des Krönens und der von Fülle triefenden Spuren bleiben erhalten.
  alternative: 'Dynamisch erklären: »Du segnest das Erntejahr und schenkst überall reichen Ertrag.«'
  rationale: Der hebräische Vers schreibt die landwirtschaftliche Fülle Gottes gütigem Handeln zu, tut dies jedoch durch offene poetische Bilder. Eine erklärende Paraphrase würde diese Bilder und ihre theologische Weite verflachen.
translation_notes:
  register: Moderne, würdevolle Psalmsprache. »Du krönst« und »triefen« bewahren die starken hebräischen Bilder; »Spuren« ist konkreter als »Pfade« und lässt die mögliche Vorstellung einer göttlichen Prozession beziehungsweise von Fahrspuren offen.
