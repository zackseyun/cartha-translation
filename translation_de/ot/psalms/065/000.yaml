  yaml_path: translation/ot/psalms/065/000.yaml
  text: For the choirmaster[a]. A psalm of David[b]; a song.
translation:
  language: de
  text: Für den Chorleiter. Ein Psalm Davids[a]; ein Lied.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Davids“ kann hier bedeuten, dass der Psalm von David stammt, ihm gewidmet ist oder mit ihm in Verbindung steht.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In Psalmüberschriften bezeichnet der Ausdruck wahrscheinlich den Verantwortlichen für die musikalische Aufführung. „Chorleiter“ ist im modernen Deutsch verständlich; die Präposition ל wird richtungsbezogen mit „für“ wiedergegeben.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: Der etablierte deutsche Ausdruck gibt die übliche Bezeichnung einer musikalischen Psalmkomposition angemessen wieder.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der Genitiv bewahrt im Deutschen eher als „von David“ die mögliche Bandbreite von Urheberschaft, Zugehörigkeit und Zuordnung, ohne sie vollständig festzulegen.
- source_word: שִׁיר
  choice: ein Lied
  rationale: Der vom Wort für „Psalm“ verschiedene Gattungsbegriff wird eigens wiedergegeben. Das Semikolon verbindet beide Bezeichnungen, ohne sie gleichzusetzen.
theological_decisions:
- issue: Bedeutung von לְדָוִד in der Überschrift
  choice: Davids
  alternative: von David / für David
  rationale: Die hebräische Präposition kann in Psalmüberschriften Urheberschaft, Zugehörigkeit, Widmung oder Verbindung anzeigen. Die Übersetzung vermeidet eine eindeutige Festlegung auf die Verfasserschaft.
translation_notes:
  register: Knappe, würdevolle Überschrift in modernem Standarddeutsch. Die traditionellen und allgemein verständlichen Begriffe „Psalm“ und „Chorleiter“ bleiben erhalten; die Mehrdeutigkeit der David-Zuordnung wird durch eine Fußnote offengelegt.
