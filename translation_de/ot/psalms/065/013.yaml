source:
  edition: WLC
  text: לָבְשׁ֬וּ כָרִ֨ים הַ/צֹּ֗אן וַ/עֲמָקִ֥ים יַֽעַטְפוּ בָ֑ר יִ֝תְרוֹעֲע֗וּ אַף יָשִֽׁירוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/013.yaml
  text: The pastures are clothed with flocks[a], and the valleys wrap themselves in grain; they shout for joy, yes[b], they sing.
translation:
  language: de
  text: 'Die Weiden kleiden sich mit Herden[a],

    und die Täler hüllen sich in Korn.

    Sie jubeln, ja, sie singen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Die Wiesen kleiden sich mit Herden.“ Das hebräische Wort kann hier Weide- oder Wiesenland bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische personifiziert die Landschaft: Weiden und Täler hüllen sich in Herden und Korn und jubeln und singen anschließend.'
    reason: cultural_note
lexical_decisions:
- source_word: לָבְשׁוּ
  choice: kleiden sich in
  rationale: 'Die aktive Form und das poetische Bild bleiben erhalten: Die Weiden erscheinen wie Personen, die ein Gewand anlegen.'
- source_word: כָרִים
  choice: Weiden
  rationale: Im Parallelismus zu den Tälern bezeichnet das Wort hier am wahrscheinlichsten Weide- oder Wiesenland, nicht Widder.
- source_word: הַצֹּאן
  choice: Herden
  rationale: Das hebräische Kollektiv bezeichnet Kleinvieh, besonders Schafe und Ziegen. „Herden“ ist im Bild der bedeckten Weiden natürlich und wahrt die kollektive Bedeutung.
- source_word: וַעֲמָקִים
  choice: und die Täler
  rationale: „Täler“ ist die direkte und natürliche deutsche Entsprechung und passt zum Landschaftsbild.
- source_word: יַעַטְפוּ
  choice: hüllen sich in
  rationale: Die aktive Form mit den Tälern als Subjekt wird beibehalten und die Personifikation anschaulich wiedergegeben.
- source_word: בָר
  choice: Korn
  rationale: Das Wort bezeichnet Getreide allgemein. „Korn“ ist hier eine natürliche, poetische Sammelbezeichnung, ohne die Getreideart unnötig festzulegen.
- source_word: יִתְרוֹעֲעוּ
  choice: sie jubeln
  rationale: Das Verb bezeichnet einen lauten, hier freudigen Ruf. „Jubeln“ bringt die positive Bedeutung knapp zum Ausdruck.
- source_word: אַף
  choice: ja
  rationale: Die Partikel verstärkt die anschließende parallele Aussage; „ja“ gibt diese emphatische Steigerung natürlich wieder.
- source_word: יָשִׁירוּ
  choice: sie singen
  rationale: Die schlichte Wiedergabe bewahrt den poetischen Höhepunkt nach dem Jubeln.
theological_decisions: []
