  text: מַשְׁבִּ֤יחַ שְׁא֣וֹן יַ֭מִּים שְׁא֥וֹן גַּלֵּי/הֶ֗ם וַ/הֲמ֥וֹן לְאֻמִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/007.yaml
  text: stilling the roar of the seas[a], the roar of their waves[b], and the tumult of the peoples.
translation:
  language: de
  text: der das Brausen der Meere stillt[a], das Brausen ihrer Wellen und das Getümmel der Völker[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beruhigt“ oder „zum Schweigen bringt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Aufruhr der Völker“. Das hebräische Wort kann lärmende Unruhe und in manchen Zusammenhängen auch eine Menschenmenge bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁבִּיחַ
  choice: der … stillt
  rationale: Das Hifil-Partizip bezeichnet hier den, der den Lärm zum Schweigen bringt. Die Relativkonstruktion gibt den beschreibenden Partizipialcharakter im Deutschen natürlich wieder.
- source_word: שְׁאוֹן
  choice: Brausen
  rationale: Das Substantiv bezeichnet lauten Lärm oder Aufruhr. Bei Meeren und Wellen vermittelt „Brausen“ das Klangbild treffend; die Wiederholung bewahrt die hebräische Parallelstruktur.
- source_word: יַמִּים
  choice: der Meere
  rationale: Der Plural des hebräischen Textes wird beibehalten und bezeichnet die Wasserwelt in poetischer Weite.
- source_word: גַּלֵּיהֶם
  choice: ihrer Wellen
  rationale: Das maskuline Pluralsuffix verweist natürlich auf die im Plural genannten Meere zurück.
- source_word: הֲמוֹן
  choice: Getümmel
  rationale: Im Parallelismus mit dem Brausen der Meere steht die lärmende Unruhe im Vordergrund. „Getümmel“ wahrt zugleich die mögliche Vorstellung einer bewegten Menschenmenge.
- source_word: לְאֻמִּים
  choice: der Völker
  rationale: „Völker“ ist eine natürliche Wiedergabe des Plurals und vermeidet eine unnötige Festlegung auf moderne Nationalstaaten.
theological_decisions:
- issue: Reichweite des Parallelismus zwischen natürlicher und menschlicher Unruhe
  choice: Gott wird als der beschrieben, der sowohl das Brausen der Meere als auch das Getümmel der Völker stillt.
  alternative: Die Aussage könnte enger nur auf Naturgewalten oder stärker politisch als Unterwerfung von Nationen zugespitzt werden.
  rationale: Der hebräische Parallelismus verbindet die Unruhe der Meere mit derjenigen der Völker. Die Übersetzung bewahrt diese Verbindung, ohne sie politisch, endzeitlich oder konfessionell auszudeuten.
translation_notes:
  register: Moderne, würdige Psalmsprache. „Brausen“ erhält das akustische Bild und die hebräische Wiederholung; „Getümmel“ bildet den Übergang von der Naturgewalt zur unruhigen Menschenwelt ab.
