  yaml_path: translation/ot/psalms/065/006.yaml
  text: who establishes the mountains by his power[a], being girded with might.
translation:
  language: de
  text: der die Berge durch seine Kraft festigt[a], mit Macht umgürtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der die Berge durch seine Macht festigt, mit Kraft umgürtet.«'
    reason: 'Lexikalische Alternative: Sowohl כֹּחַ als auch גְּבוּרָה können je nach Zusammenhang mit »Kraft«, »Stärke« oder »Macht« wiedergegeben werden.'
lexical_decisions:
- source_word: מֵכִין
  choice: fest gründet
  rationale: Das Hifil-Partizip von כון bezeichnet hier, dass Gott die Berge fest macht beziehungsweise dauerhaft gründet. »Fest gründet« bewahrt sowohl den Gedanken des Gründens als auch den der Beständigkeit, ohne eine bestimmte Schöpfungsweise vorauszusetzen.
- source_word: הָרִים
  choice: die Berge
  rationale: הָרִים bezeichnet die Berge; der bestimmte Artikel wird im Deutschen natürlich wiedergegeben.
- source_word: בְּכֹחוֹ
  choice: durch seine Kraft
  rationale: כֹּחַ kann »Kraft« oder »Macht« bedeuten. »Durch seine Kraft« gibt das instrumentale בְּ klar und idiomatisch wieder.
- source_word: נֶאְזָר
  choice: umgürtet
  rationale: Das Nifal-Partizip von אזר bewahrt als »umgürtet« das körperhafte poetische Bild des Ausgerüstetseins.
- source_word: בִּגְבוּרָה
  choice: mit Macht
  rationale: גְּבוּרָה bezeichnet Stärke oder Macht. »Mit Macht« passt zum Bild des Umgürtens und vermeidet die unmittelbare Wiederholung von »Kraft«.
theological_decisions:
- issue: Verhältnis der beiden Partizipien
  choice: 'Beide werden als auf Gott bezogene partizipiale Beschreibungen wiedergegeben: »der … fest gründet, mit Macht umgürtet«.'
  alternative: 'Den zweiten Ausdruck als eigenen Relativsatz wiedergeben: »der … fest gründet und mit Macht umgürtet ist«.'
  rationale: Die knappe Fügung erhält die Abfolge der beiden hebräischen Partizipien und lässt ihr genaues syntaktisches Verhältnis offen.
- issue: Bildhafte Rede von Gottes Stärke
  choice: Das Bild des Umgürtetseins wird mit »mit Macht umgürtet« bewahrt.
  alternative: Das Bild abstrahieren, etwa als »voller Macht« oder »mächtig«.
  rationale: Die hebräische Formulierung beschreibt Gottes Macht in einem körperhaften poetischen Bild; eine abstrakte Wiedergabe würde diese Bildkraft abschwächen.
translation_notes:
  register: Moderne, gehobene Psalmenprosa mit knapper poetischer Syntax. »Fest gründet« ist verständlich und würdevoll; »umgürtet« bleibt bewusst bildhaft und leicht archaisierend, ohne unverständlich zu sein.
