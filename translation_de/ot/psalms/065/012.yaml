source:
  edition: WLC
  text: יִ֭רְעֲפוּ נְא֣וֹת מִדְבָּ֑ר וְ֝/גִ֗יל גְּבָע֥וֹת תַּחְגֹּֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/012.yaml
  text: The pastures of the wilderness drip[b][a], and the hills gird themselves with rejoicing.
translation:
  language: de
  text: Die Weideplätze der Steppe triefen[a], und die Hügel umgürten sich mit Jubel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »strömen über«; das hebräische Verb kann reichlich herabtropfende oder strömende Feuchtigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעֲפוּ
  choice: triefen
  rationale: Das Verb רָעַף bezeichnet das Tropfen oder Herabströmen, besonders von Regen und Fülle. »Triefen« bewahrt das anschauliche Bild und lässt offen, was genau herabtropft.
- source_word: נְאוֹת
  choice: Weideplätze
  rationale: נָוֶה kann einen Weide- oder Aufenthaltsort bezeichnen. Im Zusammenhang der fruchtbaren Landschaft gibt »Weideplätze« den konkreten Sinn natürlich wieder.
- source_word: מִדְבָּר
  choice: Steppe
  rationale: מִדְבָּר bezeichnet häufig unbebautes, trockenes Weideland und nicht zwingend eine Sandwüste. »Steppe« passt daher besonders gut zu den genannten Weideplätzen.
- source_word: גִיל
  choice: Jubel
  rationale: גִיל bezeichnet ausgelassene, frohlockende Freude. »Jubel« ist im Deutschen knapp und lässt sich anschaulich mit dem Umgürten der Hügel verbinden.
- source_word: גְּבָעוֹת
  choice: die Hügel
  rationale: Die direkte Wiedergabe bewahrt die poetische Landschaft und die Personifikation des hebräischen Textes.
- source_word: תַּחְגֹּרְנָה
  choice: umgürten sich mit
  rationale: חָגַר bedeutet, etwas umzugürten oder anzulegen. Die reflexive Formulierung erhält hier das Bild der Hügel, die Jubel wie einen Gürtel anlegen.
theological_decisions: []
translation_notes:
  register: Moderne, gehobene und zugleich gut verständliche poetische Sprache. »Steppe« vermeidet die irreführende Vorstellung einer völlig kahlen Sandwüste; »umgürten« bewahrt die markante Personifikation des Originals.
