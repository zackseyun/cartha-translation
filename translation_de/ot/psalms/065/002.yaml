  text: שֹׁמֵ֥עַ תְּפִלָּ֑ה עָ֝דֶ֗י/ךָ כָּל בָּשָׂ֥ר יָבֹֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/002.yaml
  text: O you who hear prayer[a], to you all flesh will come.
translation:
  language: de
  text: Du erhörst Gebet; zu dir wird alles Fleisch kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Menschen“ oder „die ganze Menschheit“. Hebräisch: „alles Fleisch“, eine poetische Bezeichnung für die Menschheit in ihrer Gesamtheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵעַ
  choice: Du erhörst
  rationale: Das substantivisch und anredend gebrauchte Qal-Partizip bezeichnet Gott als den, der Gebet hört. „Erhören“ ist im Deutschen bei Gebet idiomatisch und gibt hier mehr als bloß akustisches Hören wieder, ohne eine bestimmte Art der Antwort festzulegen.
- source_word: תְּפִלָּה
  choice: Gebet
  rationale: Der Singular ist generisch beziehungsweise kollektiv gebraucht; der artikellose Singular „Gebet“ bewahrt diese allgemeine Bedeutung.
- source_word: עָדֶיךָ
  choice: zu dir
  rationale: Die Präposition mit Suffix bezeichnet hier die Bewegung auf den angeredeten Gott hin; „zu dir“ ist die natürliche deutsche Entsprechung.
- source_word: כָּל־בָּשָׂר
  choice: alles Fleisch
  rationale: Die wörtliche poetische Wendung bezeichnet die Menschheit in ihrer Gesamtheit. Sie bewahrt Bildsprache und universale Weite des Hebräischen.
- source_word: יָבֹאוּ
  choice: wird … kommen
  rationale: Das Imperfekt kann eine zukünftige beziehungsweise noch nicht abgeschlossene Bewegung ausdrücken. Wegen des grammatisch singularischen „alles Fleisch“ steht das deutsche Verb im Singular.
theological_decisions:
- issue: Reichweite von כָּל־בָּשָׂר
  choice: universale menschliche Reichweite, ausgedrückt als „alles Fleisch“
  alternative: „alle Menschen“ oder „die ganze Menschheit“
  rationale: Die Wendung weist umfassend auf die Menschheit, ohne im Haupttext ihre poetische Körperlichkeit und theologische Weite durch eine rein erklärende Formulierung zu ersetzen.
- issue: Bedeutungsumfang von שֹׁמֵעַ beim Gebet
  choice: „Du erhörst“
  alternative: „Du hörst“ oder „Hörer des Gebets“
  rationale: Im deutschen religiösen Sprachgebrauch bezeichnet „Gebet erhören“ idiomatisch Gottes aufmerksames Hören. Die Übersetzung behauptet dabei weder, dass jede Bitte wie gewünscht erfüllt wird, noch legt sie die Form der göttlichen Antwort fest.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter hebräischer Bildsprache. Die direkte Anrede „Du“ gibt den vokativischen Charakter des Partizips natürlich wieder; das Semikolon hält die beiden eng verbundenen Aussagen zusammen.
