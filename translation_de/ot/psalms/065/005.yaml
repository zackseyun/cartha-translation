source:
  edition: WLC
  text: נ֤וֹרָא֨וֹת בְּ/צֶ֣דֶק תַּ֭עֲנֵ/נוּ אֱלֹהֵ֣י יִשְׁעֵ֑/נוּ מִבְטָ֥ח כָּל קַצְוֵי אֶ֝֗רֶץ וְ/יָ֣ם רְחֹקִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/005.yaml
  text: With awesome deeds in righteousness you answer us[a], O God of our salvation[b], the confidence of all the ends of the earth and of the distant sea.
translation:
  language: de
  text: Mit ehrfurchtgebietenden Taten antwortest du uns in Gerechtigkeit[a], Gott unseres Heils, du, auf den alle Enden der Erde und die fernen Meere[b] vertrauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Recht“ beziehungsweise „mit gerechten Taten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht „Meer“ im Singular; es kann hier kollektiv gemeint sein, daher „ferne Meere“. Oder: „das ferne Meer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נ֤וֹרָא֨וֹת
  choice: Ehrfurcht gebietende Taten
  rationale: Die substantivisch gebrauchte Form bezeichnet Dinge oder Taten, die Ehrfurcht, Staunen oder auch Schrecken hervorrufen. Im Zusammenhang mit Gottes rettendem Handeln gibt „Ehrfurcht gebietende Taten“ die positive und zugleich gewichtige Wirkung wieder; „Taten“ wird zur natürlichen deutschen Wiedergabe ergänzt.
- source_word: בְּצֶ֣דֶק
  choice: in Gerechtigkeit
  rationale: 'Die Präposition ב bezeichnet hier am ehesten die Art und Weise beziehungsweise den Bereich des Handelns: Gott antwortet seinem gerechten Wesen entsprechend. „Gerechtigkeit“ bewahrt im Deutschen sowohl die moralische Richtigkeit als auch den Aspekt gerechten Handelns.'
- source_word: תַּ֭עֲנֵנוּ
  choice: antwortest du uns
  rationale: Das Qal von ענה bedeutet hier „antworten“; das Suffix ist erste Person Plural und verlangt „uns“.
- source_word: אֱלֹהֵ֣י יִשְׁעֵ֑נוּ
  choice: Gott unseres Heils
  rationale: Die deutsche Genitivverbindung bildet die hebräische Konstruktverbindung eng ab und lässt ישׁע in seinem breiten Sinn von Heil, Rettung und Befreiung stehen.
- source_word: מִבְטָ֥ח
  choice: Zuversicht
  rationale: מבטח bezeichnet das, worauf man vertraut. „Zuversicht“ ist in der direkten Anrede idiomatisch und bewahrt den Vertrauensaspekt, ohne das Wort vorschnell als „Zuflucht“ zu konkretisieren.
- source_word: כָּל קַצְוֵי אֶ֝֗רֶץ
  choice: aller Enden der Erde
  rationale: Die feste bildhafte Wendung bezeichnet die fernsten Gegenden und damit die ganze bewohnte Welt.
- source_word: וְיָ֣ם רְחֹקִֽים
  choice: und der fernen Meere
  rationale: Obwohl יָם formal Singular ist, kann es kollektiv gebraucht sein; der pluralische Ausdruck רְחֹקִים stützt eine distributive beziehungsweise kollektive Wiedergabe. „Ferne Meere“ ist natürliches Deutsch und bezeichnet abgelegene maritime Regionen.
theological_decisions:
- issue: Bedeutungsumfang von צֶדֶק
  choice: Gerechtigkeit
  alternative: Recht
  rationale: „Gerechtigkeit“ wahrt die Spannung zwischen Gottes moralischer Rechtschaffenheit, seiner Treue und seinem gerechten Handeln. „Recht“ wäre ebenfalls möglich, würde den Ausdruck aber stärker auf den forensischen Aspekt verengen.
- issue: Bezug von מִבְטָח
  choice: Gott wird direkt als „Zuversicht“ der fernsten Regionen angeredet
  alternative: „auf den alle Enden der Erde vertrauen“
  rationale: Die nominale Formulierung bleibt näher am Hebräischen und lässt offen, ob tatsächliches bewusstes Vertrauen oder Gottes objektive Verlässlichkeit als Vertrauensgrund im Vordergrund steht.
translation_notes:
  register: Modernes, würdiges Psalmendeutsch. Die direkte Anrede wird ohne altertümliches „o“ wiedergegeben. „Ehrfurcht gebietend“ vermeidet sowohl das missverständliche „furchtbar“ als auch eine Abschwächung zu bloß „wunderbar“.
