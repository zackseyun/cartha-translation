base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/001.yaml
  text: To you[a], silence is praise, O God, in Zion, and to you a vow will be paid.
translation:
  language: de
  text: Dir gilt Schweigen als Lob[a], Gott, auf Zion, und dir wird ein Gelübde erfüllt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lob wartet in Stille auf dich, Gott, auf Zion“, oder: „Dir gebührt stilles Lob, Gott, auf Zion.“ Die hebräische Wendung ist verkürzt und lässt sich auf mehrere Arten verstehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: דֻמִיָּה
  choice: Schweigen
  rationale: Das Substantiv bezeichnet Schweigen oder Stille. Die direkte Wiedergabe bewahrt die auffällige poetische Aussage, ohne eine im Hebräischen nicht ausdrücklich vorhandene Tätigkeit einzufügen.
- source_word: תְהִלָּה
  choice: Lob
  rationale: Die übliche Bedeutung ist „Lob“. Zusammen mit דֻמִיָּה bleibt die knappe, verblos formulierte Aussage erhalten.
- source_word: לְךָ דֻמִיָּה תְהִלָּה
  choice: Dir gilt Schweigen als Lob
  rationale: Die elliptische Nominalkonstruktion ist mehrdeutig. Diese Fassung lässt beide Substantive ausdrücklich stehen und bewahrt den paradoxen Gedanken, dass Schweigen vor Gott als Lob gilt, ohne ein Verb wie „wartet“ zu ergänzen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Form bezeichnet hier den einen Gott Israels und wird im Deutschen singularisch wiedergegeben.
- source_word: בְּצִיּוֹן
  choice: auf Zion
  rationale: Bei Bergen und den als Ort gedachten biblischen Zion ist „auf Zion“ im Deutschen die natürliche örtliche Wiedergabe der Präposition בְּ.
- source_word: יְשֻׁלַּם
  choice: wird erfüllt
  rationale: Das Pual von שלם bezeichnet hier das Einlösen beziehungsweise Erfüllen dessen, was gelobt wurde. „Ein Gelübde erfüllen“ ist im heutigen Deutschen klar und idiomatisch.
- source_word: נֶדֶר
  choice: ein Gelübde
  rationale: Das Wort bezeichnet ein Gott gegebenes Gelübde. „Gelübde“ ist präziser als das allgemeinere „Versprechen“ und legt den Begriff nicht auf eine Opfergabe fest.
theological_decisions:
- issue: Deutung der elliptischen Wendung לְךָ דֻמִיָּה תְהִלָּה
  choice: Schweigen gilt vor Gott als Lob.
  alternative: „Lob wartet schweigend auf dich“ oder „Dir gebührt stilles Lob“.
  rationale: Im Hebräischen fehlt ein ausdrückliches Verb, sodass mehrere syntaktische Deutungen möglich sind. Der Haupttext bewahrt die poetische Spannung; die Fußnote nennt die echten Alternativen, ohne die Mehrdeutigkeit dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Formulierung „Dir gilt Schweigen als Lob“ ist bewusst poetisch und eng am elliptischen Hebräisch; die mögliche Härte wird durch die Fußnote aufgefangen.
