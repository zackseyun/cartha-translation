  text: פָּקַ֥דְתָּ הָ/אָ֨רֶץ וַ/תְּשֹׁ֪קְקֶ֡/הָ רַבַּ֬ת תַּעְשְׁרֶ֗/נָּה פֶּ֣לֶג אֱ֭לֹהִים מָ֣לֵא מָ֑יִם תָּכִ֥ין דְּ֝גָנָ֗/ם כִּי כֵ֥ן תְּכִינֶֽ/הָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/009.yaml
  text: You visit the earth and water it[a]; you greatly enrich it. The river of God is full of water; you prepare their grain[b], for so you prepare the earth.
translation:
  language: de
  text: Du kümmerst dich um die Erde und tränkst sie; du machst sie überaus reich. Der Strom Gottes[a] ist voll Wasser. Du bereitest ihr Korn[b], denn so bereitest du die Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Gottes Wasserlauf“ oder „Gottes Kanal“. Die poetische hebräische Wendung kann an die himmlische Quelle von Regen und Fruchtbarkeit denken lassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „du stellst ihr Korn bereit“ oder „du richtest ihr Korn her“. Das hebräische Verb kann „bereiten“, „bereitmachen“ oder „fest gründen“ bedeuten. „Ihr“ steht im Hebräischen in der Mehrzahl und meint wohl die Menschen, die vom Ertrag leben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקַדְתָּ
  choice: du suchst … auf
  rationale: פָּקַד bezeichnet ein Aufsuchen oder Sich-Zuwenden, das je nach Zusammenhang prüfend oder fürsorglich sein kann. Im Kontext der Fruchtbarkeit bringt „aufsuchen“ die konkrete hebräische Bildsprache und die wohltätige Zuwendung zum Ausdruck.
- source_word: וַתְּשֹׁקְקֶהָ
  choice: und tränkst sie
  rationale: Das Verb beschreibt hier die reichliche Versorgung der Erde mit Wasser. „Tränken“ ist im Deutschen anschaulich, poetisch und für bewässerten Boden idiomatisch.
- source_word: רַבַּת תַּעְשְׁרֶנָּה
  choice: du machst sie überaus reich
  rationale: Die Form von עשר ist kausativ, und רַבַּת verstärkt sie. Die Wiedergabe bewahrt sowohl das Reichmachen als auch dessen starke Intensivierung.
- source_word: פֶּלֶג אֱלֹהִים
  choice: der Strom Gottes
  rationale: פֶּלֶג kann einen Strom, Wasserlauf oder Kanal bezeichnen. Die direkte Genitivverbindung wahrt die erhabene poetische Formulierung und legt ihre genaue Bildwelt nicht vorschnell fest.
- source_word: מָלֵא מָיִם
  choice: ist voll Wasser
  rationale: Die knappe prädikative Formulierung gibt das Bild überreicher Wasserversorgung natürlich und unmittelbar wieder.
- source_word: תָּכִין דְּגָנָם
  choice: du bereitest ihr Korn
  rationale: כון im Hifil kann „bereiten“, „bereitmachen“ oder „fest gründen“ bedeuten. „Bereiten“ passt zur göttlichen Versorgung. Das maskuline Pluralsuffix an „Korn“ bleibt durch „ihr“ erhalten und wird nicht mit der grammatisch femininen Erde gleichgesetzt.
- source_word: כִּי כֵן תְּכִינֶהָ
  choice: denn so bereitest du die Erde
  rationale: Das feminine Singularsuffix verweist auf die Erde. Die Wiederholung von „bereiten“ erhält die lexikalische Verbindung zum vorherigen Verb; „die Erde“ macht den Rückbezug im Deutschen eindeutig.
theological_decisions:
- issue: Bezug des maskulinen Pluralsuffixes in דְּגָנָם
  choice: „ihr Korn“ bezieht sich auf die Menschen, die vom Ertrag der Erde leben.
  alternative: Die Wendung könnte allgemeiner als Aussage über den Ertrag der Erde wiedergegeben werden, ohne einen menschlichen Bezug ausdrücklich erkennen zu lassen.
  rationale: Das hebräische Suffix ist maskulin plural und kann sich daher grammatisch nicht unmittelbar auf die feminine Singularform „Erde“ beziehen. Die wörtliche Wiedergabe „ihr Korn“ bewahrt diese Unterscheidung, ohne die nicht ausdrücklich genannten Nutznießer näher zu bestimmen.
- issue: Deutung von פֶּלֶג אֱלֹהִים
  choice: Die poetische Genitivverbindung wird als „Strom Gottes“ bewahrt.
  alternative: Möglich sind „Gottes Wasserlauf“ oder eine deutende Wiedergabe als himmlische Quelle von Regen und Fruchtbarkeit.
  rationale: Der Ausdruck kann Gottes eigenen Wasserstrom bezeichnen und zugleich den Gedanken einer göttlichen beziehungsweise himmlischen Quelle anklingen lassen. Die Übersetzung sollte diese Bildspannung nicht auf eine einzige Erklärung verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. „Aufsuchen“, „tränken“ und „bereiten“ bewahren die konkreten landwirtschaftlichen Bilder; die Wiederholung von „bereiten“ bildet die Wiederholung des hebräischen Verbstamms ab.
