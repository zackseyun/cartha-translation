source:
  edition: WLC
  text: אַשְׁרֵ֤י תִּֽבְחַ֣ר וּ/תְקָרֵב֮ יִשְׁכֹּ֪ן חֲצֵ֫רֶ֥י/ךָ נִ֭שְׂבְּעָה בְּ/ט֣וּב בֵּיתֶ֑/ךָ קְ֝דֹ֗שׁ הֵיכָלֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/004.yaml
  text: Blessed is the one you choose and bring near to dwell in your courts[a]; we will be satisfied with the goodness of your house[b], the holiness of your temple.
translation:
  language: de
  text: Glücklich ist der, den du erwählst und zu dir kommen lässt, damit er in deinen Höfen wohnt.[a] Wir werden satt an dem Guten deines Hauses[b], an dem Heiligen deines Tempels.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Glücklich ist der, den du erwählst und zu dir kommen lässt; er wird in deinen Höfen wohnen.“'
    reason: Die Verbform kann als Ziel- beziehungsweise Folgesatz oder als selbstständige Aussage verstanden werden.
  - marker: b
    text: „Das Gute“ kann auch die guten Gaben oder die Fülle bezeichnen.
    reason: Das hebräische טוּב umfasst sowohl die abstrakte Güte als auch ihre konkreten Wohltaten.
  - marker: c
    text: 'Auch: „an der Heiligkeit deines Tempels“.'
    reason: Das hebräische קְדֹשׁ kann das Heilige oder die Heiligkeit bezeichnen.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die hebräische Ausrufform leitet eine Seligpreisung ein. „Glücklich ist“ ist in modernem Deutsch verständlich und bezeichnet hier nicht bloß ein Gefühl, sondern den begünstigten, beneidenswert guten Stand des Erwählten.
- source_word: תִּבְחַר
  choice: du erwählst
  rationale: בחר bezeichnet das Auswählen. „Erwählen“ passt zum gehobenen Psalmregister und bewahrt die göttliche Initiative, ohne sie durch dogmatische Zusätze näher festzulegen.
- source_word: וּתְקָרֵב
  choice: und zu dir nahen lässt
  rationale: 'Der Hifil von קרב ist kausativ: Gott ermöglicht beziehungsweise bewirkt die Annäherung. Die Formulierung gibt diese Kausalität natürlich wieder und lässt den Bezug auf Gottes Nähe erkennen.'
- source_word: יִשְׁכֹּן
  choice: damit er … wohnt
  rationale: Der Imperfekt der dritten Person Singular bezeichnet hier plausibel Ziel oder Folge des Erwählens und Nahenlassens. „Damit“ gibt diese syntaktische Beziehung lesbar wieder; die alternative selbstständige Aussage bleibt in einer Fußnote erhalten.
- source_word: חֲצֵרֶיךָ
  choice: in deinen Vorhöfen
  rationale: חצר bezeichnet im Heiligtumskontext die Höfe beziehungsweise Vorhöfe des Tempelbezirks. „Vorhöfe“ bewahrt die konkrete kultische Bildwelt.
- source_word: נִשְׂבְּעָה
  choice: Wir werden satt
  rationale: Die Kohortativform kann zuversichtliche Erwartung oder willentliche Ausrichtung ausdrücken. „Wir werden satt“ bringt im Zusammenhang die vertrauensvolle Erwartung knapp und natürlich zum Ausdruck.
- source_word: בְּטוּב
  choice: am Guten
  rationale: טוּב kann die Güte, das Gute oder die guten Gaben und die Fülle bezeichnen. „Am Guten“ erhält die semantische Weite; konkretere Möglichkeiten werden in der Fußnote genannt.
- source_word: בֵּיתֶךָ
  choice: deines Hauses
  rationale: Im Parallelismus mit Tempel und Vorhöfen bezeichnet „Haus“ Gottes Heiligtum und bewahrt zugleich die hebräische Metapher.
- source_word: קְדֹשׁ
  choice: am Heiligen
  rationale: Das Substantiv bezeichnet das Heilige beziehungsweise die Heiligkeit. Die substantivische Wiedergabe „am Heiligen“ wahrt die knappe und etwas offene Formulierung des Hebräischen.
- source_word: הֵיכָלֶךָ
  choice: deines Tempels
  rationale: היכל kann Palast oder Tempel bedeuten; Vorhöfe, Gottes Haus und der Gottesdienstkontext machen hier „Tempel“ zur naheliegenden Bedeutung.
theological_decisions:
- issue: Gottes Erwählen und das Nahen zu ihm
  choice: 'Die Initiative Gottes bleibt ausdrücklich erhalten: Er erwählt und lässt den Menschen zu sich nahen.'
  alternative: Eine ausdrücklich systematisch-prädestinarische Deutung oder eine ausschließlich kultisch-amtliche Auswahl.
  rationale: Der hebräische Text schreibt Gott die Initiative beim Zugang zu seiner Nähe zu, legt aber keine vollständige Lehrformel über Erwählung vor. Die Übersetzung bewahrt diese Aussage und ihre theologische Spannung, ohne sie konfessionell einzuengen.
- issue: Konkrete Sprache des Heiligtums
  choice: „Vorhöfe“, „Haus“ und „Tempel“ werden als konkrete Heiligtumsbegriffe wiedergegeben.
  alternative: Eine durchgehend vergeistigende Wiedergabe wie „Gegenwart“ oder „Wohnstätte“.
  rationale: Der Vers ist in Israels Tempelgottesdienst verankert. Die konkrete Bildwelt soll stehen bleiben, damit weitergehende theologische Anwendungen aus dem Text hervorgehen und nicht in ihn eingetragen werden.
- issue: Das Heilige beziehungsweise die Heiligkeit des Tempels
  choice: Die Hauptfassung lautet „am Heiligen deines Tempels“.
  alternative: „an der Heiligkeit deines Tempels“ oder eine Konkretisierung als „an den heiligen Gaben“.
  rationale: Die hebräische Wendung ist knapp und lässt offen, ob stärker die heilige Beschaffenheit oder das zum Tempel gehörende Heilige gemeint ist. Die Hauptfassung bewahrt diese Offenheit; „Heiligkeit“ wird als mögliche Wiedergabe in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klar erkennbarer Psalmsprache. Konkrete Tempelbegriffe und die knappe Parallelstruktur bleiben erhalten; veraltete Formen wie „Wohl dem“ werden vermieden.
