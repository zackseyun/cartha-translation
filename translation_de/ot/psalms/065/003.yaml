  text: Schuldtaten haben mich überwältigt[a]; unsere Vergehen – du wirst für sie Sühne schaffen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Dinge/Worte von Schuld sind mir zu mächtig geworden.“ Der hebräische Anfang ist stark verdichtet.'
