  - marker: b
    text: 'Oder: „du wirst sie tilgen“. Das hebräische Verb bezeichnet das Schaffen von Sühne und, je nach Zusammenhang, die Beseitigung von Schuld.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי עֲוֺנֹת
  choice: Schuldtaten
  rationale: Die hebräische Verbindung ist stark verdichtet. „Schuldtaten“ gibt דִּבְרֵי im Sinn von Taten bzw. Dingen und עֲוֺנֹת als moralische Schuld knapp und verständlich wieder, ohne die mögliche Bedeutung „Worte/Angelegenheiten der Schuld“ zu verschweigen.
- source_word: גָּבְרוּ מֶנִּי
  choice: haben mich überwältigt
  rationale: גבר bezeichnet Stärke oder Überlegenheit. Die Formulierung vermittelt natürlich das Bild, dass die Schuldverfehlungen für den Sprecher zu mächtig geworden sind.
- source_word: פְּשָׁעֵינוּ
  choice: unsere Vergehen
  rationale: פֶּשַׁע bezeichnet Übertretung oder Auflehnung. „Vergehen“ ist verständlich, bewahrt den moralischen Ernst und vermeidet unnötig technische Sprache.
- source_word: אַתָּה
  choice: du
  rationale: Das ausdrücklich gesetzte Pronomen ist betont. Der Gedankenstrich vor „du“ bildet diesen Nachdruck im Deutschen ab.
- source_word: תְכַפְּרֵם
  choice: du wirst sie sühnen
  rationale: Das Piel von כפר bezeichnet hier das Schaffen von Sühne bzw. die Beseitigung von Sünde. „Sühnen“ bewahrt das theologische Gewicht und bleibt knapper als „Sühne für sie schaffen“.
theological_decisions:
- issue: Wiedergabe von כפר bei der Beseitigung von Sünde
  choice: du wirst sie sühnen
  alternative: du wirst sie tilgen / für sie Sühne schaffen
  rationale: „Sühnen“ erhält die kultisch-theologische Bedeutung, ohne eine bestimmte Theorie der Sühne festzulegen. Die Fußnote weist auf mögliche kontextuelle Wiedergaben hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlich verdichtete Eröffnung wird im Haupttext verständlich wiedergegeben und in der Fußnote formal näher erläutert; der Gedankenstrich erhält die Betonung des ausdrücklichen „du“.
