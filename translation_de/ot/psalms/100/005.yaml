  text: כִּי ט֣וֹב יְ֭הֹוָה לְ/עוֹלָ֣ם חַסְדּ֑/וֹ וְ/עַד דֹּ֥ר וָ֝/דֹ֗ר אֱמוּנָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/005.yaml
  text: For Yahweh is good[a]; his steadfast love is forever[d][c][b], and his faithfulness endures from generation to generation.
translation:
  language: de
  text: Denn Jahwe ist gut; seine beständige Liebe[a] währt ewig, und seine Treue währt von Generation zu Generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort חֶסֶד umfasst beständige Liebe, Güte, Barmherzigkeit und verlässliche Loyalität.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aufforderung ein und gibt die erklärende Funktion des hebräischen Ausdrucks natürlich wieder.
- source_word: טוֹב
  choice: gut
  rationale: Die direkte und umfassende Wiedergabe bezeichnet Jahwes Güte sowohl in seinem Wesen als auch in seinem Handeln.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als im Deutschen gebräuchliche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: חַסְדּוֹ
  choice: seine beständige Liebe
  rationale: חֶסֶד umfasst Liebe, Güte, Barmherzigkeit und verlässliche Loyalität. „Beständige Liebe“ bewahrt sowohl die Zuwendung als auch ihre Dauerhaftigkeit, ohne den Begriff auf nur einen Aspekt zu verengen.
- source_word: לְעוֹלָם
  choice: währt ewig
  rationale: Bezeichnet unbegrenzte Dauer. Das ergänzte Verb „währt“ macht den im Hebräischen nominal formulierten Satz im Deutschen idiomatisch.
- source_word: אֱמוּנָתוֹ
  choice: seine Treue
  rationale: Bezeichnet Zuverlässigkeit, Festigkeit und Treue; „Treue“ ist im parallelen Lobpreis Gottes die natürliche deutsche Entsprechung.
- source_word: וְעַד דֹּר וָדֹר
  choice: und … von Generation zu Generation
  rationale: Die hebräische Wiederholung von דּוֹר bezeichnet die fortdauernde Geltung über alle aufeinanderfolgenden Generationen hinweg. Die deutsche Wendung ist idiomatisch und erhält den Generationenbezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen Gottes. „Jahwe“ bewahrt diesen als Namen und ersetzt ihn nicht durch einen Titel.
- issue: Bedeutungsbreite von חֶסֶד
  choice: beständige Liebe
  alternative: Güte; Barmherzigkeit; Bundestreue
  rationale: Der Ausdruck verbindet liebevolle Zuwendung mit verlässlicher Loyalität. Die gewählte Formulierung wahrt diese Breite, ohne eine bestimmte bundestheologische Auslegung in den Haupttext einzutragen.
- issue: Verblose Parallelstruktur
  choice: „währt“ gilt sinngemäß auch für „seine Treue“
  alternative: „und seine Treue währt von Generation zu Generation“
  rationale: Das Hebräische stellt zwei Zeitangaben parallel, ohne ein ausdrückliches Verb. Die knappe deutsche Ellipse bewahrt diese dichterische Parallelität und bleibt verständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. „Währt ewig“ entspricht dem Psalmton, ohne altertümlich oder schwer verständlich zu wirken.
