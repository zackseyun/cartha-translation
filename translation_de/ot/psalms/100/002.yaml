  text: עִבְד֣וּ אֶת יְהוָ֣ה בְּ/שִׂמְחָ֑ה בֹּ֥אוּ לְ֝/פָנָ֗י/ו בִּ/רְנָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/002.yaml
  text: Serve Yahweh with gladness[a]; come before him with joyful shouting.
translation:
  language: de
  text: Dient Jahwe mit Freude; kommt vor ihn mit Jubelrufen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit Jubelgesang«; das hebräische Wort kann freudigen Lobpreis bezeichnen, der gerufen oder gesungen wird.'
    reason: Lexikalische Alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: Dient
  rationale: Der pluralische Imperativ von עבד bezeichnet hier den Dienst für Jahwe in Hingabe und gehorsamer Verehrung. »Dient« wahrt die lexikalische Breite, ohne die Aussage auf gottesdienstliche Handlungen zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּשִׂמְחָה
  choice: mit Freude
  rationale: Die Präposition בְּ bezeichnet die Art und Weise des Dienens; »mit Freude« ist natürliches, klares Deutsch.
- source_word: בֹּאוּ
  choice: kommt
  rationale: Der pluralische Imperativ von בוא wird mit dem direkten und semantisch breiten »kommt« wiedergegeben; »tretet ein« würde einen ausdrücklich genannten Innenraum voraussetzen.
- source_word: לְפָנָיו
  choice: vor ihn
  rationale: Die Wendung bedeutet wörtlich »vor sein Angesicht/in seine Gegenwart«. In Verbindung mit »kommen« gibt »vor ihn« den räumlich-relationalen Sinn knapp wieder.
- source_word: בִּרְנָנָה
  choice: mit Jubelrufen
  rationale: רְנָנָה bezeichnet lauten, freudigen Lobpreis, der als Jubelruf oder Jubelgesang geäußert werden kann. »Mit Jubelrufen« bewahrt den hörbaren und überschwänglichen Charakter.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet unmittelbar das Tetragramm. »Jahwe« gibt den persönlichen Namen in der im modernen Deutschen üblichen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die parallelen Imperative und die knappe poetische Satzstruktur des Hebräischen bleiben erhalten.
