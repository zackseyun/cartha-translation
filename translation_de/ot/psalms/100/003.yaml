source:
  edition: WLC
  text: דְּע֗וּ כִּֽי יְהוָה֮ ה֤וּא אֱלֹ֫הִ֥ים הֽוּא עָ֭שָׂ/נוּ ו/לא אֲנַ֑חְנוּ עַ֝מּ֗/וֹ וְ/צֹ֣אן מַרְעִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/003.yaml
  text: Know that Yahweh[a], he is God. He made us, and not we ourselves; we are his people and the sheep of his pasture.
translation:
  language: de
  text: 'Erkennt: Jahwe – er ist Gott. Er hat uns gemacht, nicht wir selbst[a]; wir sind sein Volk und die Schafe seiner Weide.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach der traditionellen Randlesart: »Er hat uns gemacht, und wir gehören ihm.«'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּעוּ
  choice: Erkennt
  rationale: Der Imperativ Plural von ידע fordert die Angesprochenen auf, diese Wahrheit bewusst anzuerkennen. »Erkennt« ist im Deutschen prägnant, würdevoll und passt zum öffentlichen Bekenntnis des Psalms.
- source_word: כִּי
  choice: ':'
  rationale: כִּי leitet hier den Inhalt dessen ein, was erkannt werden soll. Ein Doppelpunkt gibt diese Funktion im Deutschen natürlicher wieder als ein schwerfälliger dass-Satz.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הוּא אֱלֹהִים
  choice: er ist Gott
  rationale: Das ausdrücklich gesetzte Pronomen הוּא hebt die Aussage hervor. Die Formulierung »Jahwe – er ist Gott« bewahrt diesen Nachdruck, ohne ein nicht ausdrücklich vorhandenes »allein« hinzuzufügen.
- source_word: הוּא עָשָׂנוּ
  choice: Er hat uns gemacht
  rationale: עשה bezeichnet hier Gottes schöpferisches beziehungsweise begründendes Handeln an seinem Volk. Das deutsche Perfekt ist natürlich und bewahrt die knappe Aussage.
- source_word: וְלֹא אֲנַחְנוּ
  choice: und nicht wir selbst
  rationale: Der geschriebene masoretische Text (Ketiv לא) bedeutet »nicht« und stellt Gottes Handeln dem eigenen gegenüber. Die knappe Ellipse des Hebräischen bleibt erhalten; die traditionelle Randlesart wird in der Fußnote genannt.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: Die direkte possessive Wiedergabe bewahrt die Bundes- und Zugehörigkeitssprache des hebräischen Ausdrucks.
- source_word: וְצֹאן מַרְעִיתוֹ
  choice: und die Schafe seiner Weide
  rationale: Die Formulierung erhält sowohl das konkrete Bild der Schafe als auch das Bild der Weide und entspricht eng der hebräischen Hirtenmetaphorik.
theological_decisions:
- issue: Ketiv/Qere in וְלֹא אֲנַחְנוּ
  choice: 'Der Haupttext folgt dem Ketiv: »Er hat uns gemacht, und nicht wir selbst.«'
  alternative: 'Die traditionelle Qere-Lesart לו ergibt: »Er hat uns gemacht, und wir gehören ihm.«'
  rationale: Der Konsonantentext לא trägt eindeutig die Bedeutung »nicht«, während die überlieferte Randlesart לו Zugehörigkeit ausdrückt. Beide Lesarten sind alt und kontextuell möglich. Der Haupttext bewahrt den geschriebenen Text; die verbreitete traditionelle Lesart wird als echte Textvariante in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bekenntnishaftem Rhythmus. Der Gedankenstrich bildet den Nachdruck des hebräischen Pronomens natürlich ab. Die knappe Ellipse »und nicht wir selbst« bewahrt die Form des geschriebenen Textes, während die Fußnote die alternative Lesart transparent macht.
