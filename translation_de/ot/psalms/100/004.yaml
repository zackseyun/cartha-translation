    rationale: Das Verb ברך bedeutet hier „segnen“. Da Lob/Praise bereits durch תְּהִלָּה ausgedrückt ist, sollte die deutsche Übersetzung die unterschiedliche Wortwahl des Ausgangstextes nicht einebnen.
