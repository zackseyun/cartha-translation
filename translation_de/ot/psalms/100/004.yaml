source:
  edition: WLC
  text: בֹּ֤אוּ שְׁעָרָ֨י/ו בְּ/תוֹדָ֗ה חֲצֵרֹתָ֥י/ו בִּ/תְהִלָּ֑ה הֽוֹדוּ ל֝֗/וֹ בָּרֲכ֥וּ שְׁמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/004.yaml
  text: Enter his gates with thanksgiving[a], his courts with praise; give thanks to him; bless his name.
translation:
  language: de
  text: Tretet mit Dank durch seine Tore ein, mit Lobpreis in seine Höfe! Dankt ihm, segnet seinen Namen!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּאוּ
  choice: Geht durch
  rationale: Der Imperativ Plural von בוא bezeichnet hier die Bewegung in den durch Tore zugänglichen heiligen Bereich. „Geht durch“ ist im Deutschen mit „Tore“ natürlich und anschaulich.
- source_word: שְׁעָרָיו
  choice: seine Tore
  rationale: Die Pluralform mit Suffix bezeichnet die Tore des Heiligtums; die konkrete räumliche Bildsprache bleibt erhalten.
- source_word: בְּתוֹדָה
  choice: mit Dank
  rationale: תּוֹדָה kann Dank oder ein Dankopfer bezeichnen. Im Parallelismus mit „Lobpreis“ liegt die abstrakte Bedeutung nahe; die kultische Alternative wird in einer Fußnote bewahrt.
- source_word: חֲצֵרֹתָיו
  choice: seine Vorhöfe
  rationale: Das Wort bezeichnet hier die Höfe des Heiligtums. „Vorhöfe“ gibt den kultischen Zusammenhang im Deutschen prägnant wieder.
- source_word: בִּתְהִלָּה
  choice: mit Lobpreis
  rationale: תְּהִלָּה bezeichnet Lob beziehungsweise Lobpreis. „Mit Lobpreis“ wahrt die Parallelität zu „mit Dank“.
- source_word: הוֹדוּ לוֹ
  choice: Dankt ihm
  rationale: ידה im Hifil bedeutet im gottesdienstlichen Zusammenhang „danken“. Die knappe deutsche Imperativform entspricht dem Hebräischen.
- source_word: בָּרֲכוּ
  choice: preist
  rationale: ברך bedeutet gegenüber Gott wörtlich „segnen“. Im heutigen Deutschen ist „Gottes Namen segnen“ jedoch leicht missverständlich; „preist“ vermittelt hier die gemeinte ehrende Anrede natürlich, während die Verbindung mit „seinem Namen“ erhalten bleibt.
- source_word: שְׁמוֹ
  choice: seinen Namen
  rationale: Die wörtliche Wendung bewahrt die biblische Aussage über Gottes offenbare Identität und seinen Ruf.
theological_decisions:
- issue: Kultische Bildsprache von Toren und Vorhöfen
  choice: Die räumliche Tempelbildsprache wird konkret als „Tore“ und „Vorhöfe“ wiedergegeben.
  alternative: Verallgemeinerung zu „Gegenwart“ oder „Haus“.
  rationale: Der hebräische Text beschreibt ausdrücklich den Zugang zu heiligen Bezirken. Eine Abstraktion würde eine theologische Deutung in den Vers eintragen.
- issue: Bedeutung von תּוֹדָה
  choice: Im Haupttext steht „Dank“.
  alternative: „Dankopfer“.
  rationale: Der Parallelismus mit „Lobpreis“ stützt die abstrakte Bedeutung, doch die mögliche kultische Bedeutung bleibt in der Fußnote ausdrücklich offen.
- issue: ברך in Bezug auf Gottes Namen
  choice: „preist seinen Namen“
  alternative: „segnet seinen Namen“
  rationale: Die Alternative bildet das hebräische Verb formaler ab. Die gewählte Fassung vermeidet im modernen Deutschen die mögliche Vorstellung, Menschen verliehen Gott Segen, und gibt die kontextuelle Bedeutung ehrenden Lobens wieder, ohne den Gegenstand „seinen Namen“ aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappen pluralischen Imperativen. Der Parallelismus und die konkrete kultische Bildsprache werden gewahrt; die Satzzeichen machen die vier Aufforderungen klar erkennbar.
