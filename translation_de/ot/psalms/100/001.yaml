  text: מִזְמ֥וֹר לְ/תוֹדָ֑ה הָרִ֥יעוּ לַ֝/יהוָ֗ה כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/001.yaml
  text: A psalm for thanksgiving[a]. Shout joyfully to Yahweh[d][c][b], all the earth.
translation:
  language: de
  text: 'Ein Psalm zum Dank[a].


    Jubelt Jahwe zu, alle Welt!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein Psalm zum Dankopfer«; auch möglich: »Ein Dankpsalm«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psalm
  rationale: Das Substantiv bezeichnet besonders in Überschriften ein zur musikalischen Darbietung bestimmtes Lied; »Psalm« ist hier die präzise und eingebürgerte Gattungsbezeichnung.
- source_word: לְתוֹדָה
  choice: zum Dank
  rationale: תּוֹדָה kann Dank, Lobpreis oder ein Dankopfer bezeichnen. »Zum Dank« ist im Deutschen natürlich, gibt die Zweckrichtung von לְ wieder und legt sich nicht unnötig auf einen Opferzusammenhang fest.
- source_word: הָרִיעוּ
  choice: Jubelt … zu
  rationale: Der Hifil-Imperativ fordert zu einem lauten, freudigen Zuruf auf. »Jubelt … zu« verbindet die hörbare Akklamation mit dem festlichen Ton und klingt im Deutschen natürlich.
- source_word: לַיהוָה
  choice: Jahwe zu
  rationale: Die Präposition לְ bezeichnet hier den Adressaten des Jubelrufs. »Jahwe« gibt den Gottesnamen יהוה als im Deutschen übliche Transkription wieder.
- source_word: כָּל־הָאָרֶץ
  choice: die ganze Erde
  rationale: אֶרֶץ kann »Land« oder »Erde« bedeuten. Der umfassende Aufruf des Psalms spricht hier für die universale Bedeutung »die ganze Erde«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen יהוה. Die Wiedergabe »Jahwe« bewahrt diesen Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von תּוֹדָה in der Überschrift
  choice: Dank
  alternative: Dankopfer
  rationale: Der Ausdruck kann sowohl dankenden Lobpreis als auch ein Dankopfer meinen. Der Haupttext wahrt mit »Dank« die weitere Bedeutung; die mögliche kultische Deutung wird in der Fußnote ausdrücklich genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Jubelt Jahwe zu« ist verständlich und bewahrt den Charakter eines lauten gemeinschaftlichen Zurufs. Die knappe Überschrift folgt der Form des Hebräischen; ihre sachliche Mehrdeutigkeit wird durch die Fußnote offengehalten.
