  yaml_path: translation/ot/psalms/100/000.yaml
  text: A psalm for thanksgiving[a]. Shout joyfully to Yahweh[d][c][b], all the earth.
translation:
  language: de
  text: 'Ein Psalm zum Dank.[a]


    Jauchzt Jahwe zu, alle Welt![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Überschrift kann auch bedeuten: „Ein Psalm für ein Dankopfer“ oder „Ein Dankpsalm“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jubelt Jahwe zu, alle Welt!“ Traditionell wird der Gottesname יהוה mit „der HERR“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר לְתוֹדָה
  choice: Ein Psalm zum Dank
  rationale: „Zum Dank“ gibt die Ziel- oder Zweckbeziehung der Präposition לְ natürlich wieder, ohne תּוֹדָה ausschließlich auf ein Danklied oder ein Dankopfer festzulegen.
- source_word: הָרִיעוּ
  choice: Jubelt … zu
  rationale: Das Verb bezeichnet hier einen lauten, freudigen Zuruf. „Jubelt … zu“ ist im modernen Deutsch klar und wahrt den auffordernden Charakter.
- source_word: יהוה
  choice: Jahwe
  rationale: Die Wiedergabe als Eigenname entspricht dem hebräischen Gottesnamen und vermeidet, ihn im Haupttext durch einen Titel zu ersetzen.
- source_word: כָּל־הָאָרֶץ
  choice: ganze Erde
  rationale: Die Anrede ist umfassend und kann sowohl das Land als auch die gesamte Erde beziehungsweise ihre Bewohner bezeichnen; im hymnischen Zusammenhang ist „ganze Erde“ die natürliche Wiedergabe.
theological_decisions:
- issue: Bedeutung der Psalmüberschrift לְתוֹדָה
  choice: zum Dank
  alternative: für ein Dankopfer; ein Dankpsalm
  rationale: Der hebräische Ausdruck kann Dank, Dankbekenntnis oder ein Dankopfer bezeichnen. Die Hauptübersetzung bleibt offen, während die Fußnote die kultische Möglichkeit ausdrücklich nennt.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält einen Eigennamen. „Jahwe“ macht dies sichtbar; die traditionelle Ersatzlesung „der HERR“ wird als Alternative dokumentiert.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die kurze Überschrift bleibt knapp; der Imperativ ist als unmittelbarer, freudiger Aufruf formuliert.
