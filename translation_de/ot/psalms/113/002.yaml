id: PSA.113.2
reference: Psalms 113:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהִ֤י שֵׁ֣ם יְהוָ֣ה מְבֹרָ֑ךְ מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/002.yaml
  text: May the name of Yahweh be blessed from now and forever[a].
translation:
  language: de
  text: Der Name Jahwes sei gepriesen von jetzt an bis in Ewigkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Der Name Jahwes sei gesegnet.“'
    reason: 'Lexikalische Alternative: מְבֹרָךְ bedeutet formal „gesegnet“, wird bei Gott jedoch idiomatisch oft im Sinn von „gepriesen“ gebraucht.'
lexical_decisions:
- source_word: יְהִי
  choice: sei
  rationale: Der Qal-Jussiv von היה drückt hier einen Wunsch beziehungsweise eine Aufforderung aus. Der deutsche Konjunktiv „sei“ gibt diese feierliche, benediktive Kraft knapp und natürlich wieder.
- source_word: שֵׁם
  choice: Name
  rationale: Die wörtliche Wiedergabe bewahrt den hebräischen Sinn des Namens als Ausdruck der Person und ihres Ansehens, ohne ihn erklärend zu erweitern.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname wird im Deutschen in der etablierten Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מְבֹרָךְ
  choice: gepriesen
  rationale: Das passive Partizip von ברך bedeutet grundsätzlich „gesegnet“. Wenn jedoch Menschen den Namen Gottes „segnen“, bezeichnet dies idiomatisch sein Preisen. „Gepriesen“ ist daher im Deutschen natürlich und kontextgerecht; die formalere Alternative wird in der Fußnote bewahrt.
- source_word: מֵעַתָּה
  choice: von jetzt an
  rationale: Die Wendung bezeichnet den gegenwärtigen Zeitpunkt als Beginn einer fortdauernden Zeitspanne.
- source_word: וְעַד עוֹלָם
  choice: bis in Ewigkeit
  rationale: Die Präposition עַד bezeichnet die zeitliche Erstreckung bis in unbegrenzte Dauer; „bis in Ewigkeit“ ist würdig, verständlich und semantisch präzise.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt diesen als Eigennamen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
- issue: Bedeutung von מְבֹרָךְ beim Namen Gottes
  choice: gepriesen
  alternative: gesegnet
  rationale: Die Grundbedeutung „gesegnet“ bleibt möglich und wird in der Fußnote genannt. Im Zusammenhang menschlicher Rede über Gott vermittelt „gepriesen“ die idiomatische Funktion besser, ohne die Aussage konfessionell einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die jussivische Form wird mit dem feierlichen Konjunktiv „sei“ wiedergegeben. Der Gottesname erscheint als „Jahwe“; archaische Wendungen werden vermieden.
