source:
  edition: WLC
  text: מִ֭י כַּ/יהוָ֣ה אֱלֹהֵ֑י/נוּ הַֽ/מַּגְבִּיהִ֥י לָ/שָֽׁבֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/005.yaml
  text: Who is like Yahweh our God[a], who is seated on high[b],
translation:
  language: de
  text: Wer ist wie Jahwe, unser Gott[a], der hoch oben thront[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Wer ist wie Jahwe, unser Gott?“ Der Gottesname יהוה wird traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher etwa: „der sich hoch erhebt, um zu sitzen“; gemeint ist Jahwes erhabenes Thronen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי כַּ/יהוָה
  choice: Wer ist wie Jahwe
  rationale: Die rhetorische Frage drückt Jahwes Unvergleichlichkeit aus. Das im Hebräischen fehlende Kopulaverb wird im Deutschen mit „ist“ ergänzt; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Die Form mit Suffix der 1. Person Plural bedeutet unmittelbar „unser Gott“ und steht als Apposition zu „Jahwe“.
- source_word: הַמַּגְבִּיהִי
  choice: der hoch oben thront
  rationale: Das Partizip bezeichnet den, der sich hoch erhebt beziehungsweise hoch erhöht ist. Zusammen mit לָשָׁבֶת vermittelt es Gottes erhabenes Sitzen; „thront“ bewahrt das Bild königlicher Erhöhung in natürlichem, würdigem Deutsch.
- source_word: לָשָׁבֶת
  choice: thront
  rationale: Das Verb kann „sitzen“ oder „wohnen“ bedeuten. Hier legt die Verbindung mit dem Hochsein ein erhabenes, thronendes Sitzen nahe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird im Haupttext als „Jahwe“ wiedergegeben, statt ihn durch den traditionellen Ersatztitel „der HERR“ zu ersetzen.
- issue: Bedeutung von Gottes hohem Sitzen
  choice: der hoch oben thront
  alternative: der sich hoch erhebt, um zu sitzen
  rationale: Die gewählte Fassung erhält das Bild erhabener Herrschaft, ohne aus der ungewöhnlichen hebräischen Konstruktion eine Aussage darüber abzuleiten, dass Gott sich selbst erhöht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem poetischem Register. „Thront“ gibt die Bildwelt des hohen Sitzens knapp und natürlich wieder; die ungewöhnlichere wörtliche Konstruktion bleibt in der Fußnote sichtbar.
