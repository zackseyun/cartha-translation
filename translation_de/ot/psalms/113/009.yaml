  text: מֽוֹשִׁיבִ֨י עֲקֶ֬רֶת הַ/בַּ֗יִת אֵֽם הַ/בָּנִ֥ים שְׂמֵחָ֗ה הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/009.yaml
  text: He gives the barren woman a home[a], as a joyful mother of children[b]. Praise Yah!
translation:
  language: de
  text: Er gibt der Kinderlosen ein Zuhause, als frohe Mutter von Kindern.[a] Lobt Jah![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er lässt die Kinderlose im Haus wohnen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „Halleluja!“'
    reason: alternative_reading
lexical_decisions:
- source_word: מֽוֹשִׁיבִי
  choice: Er lässt … wohnen
  rationale: Das Hifil-Partizip von ישׁב bezeichnet ein Veranlassen zum Wohnen oder Ansiedeln. Die deutsche Wiedergabe bewahrt den kausativen Sinn und bleibt zugleich verständlich.
- source_word: עֲקֶרֶת
  choice: die Kinderlose
  rationale: Das Substantiv bezeichnet eine Frau, die keine Kinder bekommen kann oder hat. „Die Kinderlose“ ist knapp, poetisch und weniger klinisch als „die unfruchtbare Frau“.
- source_word: הַבַּיִת
  choice: im Haus
  rationale: בית kann das konkrete Haus ebenso wie den häuslichen Lebensbereich bezeichnen. „Im Haus“ folgt der hebräischen Form eng; die idiomatischere Deutung „ein Zuhause“ wird in der Fußnote genannt.
- source_word: אֵם הַבָּנִים
  choice: Mutter von Kindern
  rationale: בנים kann je nach Zusammenhang „Söhne“ oder allgemeiner „Kinder“ bedeuten. Hier steht der Gegensatz zur Kinderlosigkeit im Vordergrund, nicht das Geschlecht der Kinder.
- source_word: שְׂמֵחָה
  choice: froh
  rationale: Das prädikative Adjektiv beschreibt die Freude der Mutter. „Froh“ ist natürlich, würdig und poetisch knapp.
- source_word: הַֽלְלוּ יָהּ
  choice: Lobt Jah!
  rationale: Die Wendung besteht aus einem pluralischen Imperativ und der Kurzform des Gottesnamens. „Lobt Jah!“ übersetzt beides unmittelbar; „Halleluja“ ist die geläufige Transliteration.
theological_decisions:
- issue: Wiedergabe der Kurzform יָהּ
  choice: Jah
  alternative: Halleluja; der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich die Kurzform יָהּ und nicht das Tetragramm יהוה. „Jah“ bewahrt diesen Unterschied; „Halleluja“ wird als vertraute liturgische Form in der Fußnote angegeben.
- issue: Verhältnis zwischen der Kinderlosen und der Mutter von Kindern
  choice: als frohe Mutter von Kindern
  alternative: eine frohe Mutter von Kindern
  rationale: Die Formulierung gibt die Apposition und die im Vers dargestellte Umkehrung wieder, ohne genauer festzulegen, auf welche Weise Gott diese Veränderung bewirkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Kürze. Die relativ formnahe Wendung „im Haus wohnen“ bewahrt das hebräische Bild; eine natürlichere deutsche Alternative steht in der Fußnote. Die Schlussaufforderung gibt die Kurzform des Gottesnamens ausdrücklich wieder.
