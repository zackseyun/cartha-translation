id: PSA.113.1
reference: Psalms 113:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ הַ֭לְלוּ עַבְדֵ֣י יְהוָ֑ה הַֽ֝לְלוּ אֶת שֵׁ֥ם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/001.yaml
  text: Praise Yah! Praise[a], servants of Yahweh[b]; praise the name of Yahweh.
translation:
  language: de
  text: Lobt Jah![a] Lobt, ihr Diener[b] Jahwes; lobt den Namen Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Hallelu-Jah“ bedeutet wörtlich „Lobt Jah“; „Jah“ ist die Kurzform des Gottesnamens.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sklaven“. Das hebräische Wort kann Menschen im Dienst oder in einem Abhängigkeitsverhältnis bezeichnen; hier passt „Diener“ zum Zusammenhang des Gotteslobs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: Lobt
  rationale: Der Pluralimperativ im Piel fordert die Angesprochenen unmittelbar zum Lob auf. „Lobt“ ist klar, würdig und bewahrt die dreifache Wiederholung.
- source_word: יָהּ
  choice: Jah
  rationale: „Jah“ gibt die Kurzform des Gottesnamens wieder und bewahrt ihren formalen Unterschied zu יְהוָה im weiteren Vers.
- source_word: עַבְדֵי
  choice: Diener
  rationale: Das Wort kann Diener oder Sklaven bezeichnen. Im Aufruf an die Gott Dienenden passt „Diener“ zum gottesdienstlichen Zusammenhang, ohne die Zugehörigkeit zu Jahwe aufzuheben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Wiedergabe mit „Jahwe“ behandelt den Ausdruck als Gottes Eigennamen und erhält zugleich den Unterschied zur Kurzform „Jah“.
- source_word: אֶת שֵׁם יְהוָה
  choice: den Namen Jahwes
  rationale: Die Formulierung gibt die hebräische Genitivverbindung natürlich wieder und behält den Namen ausdrücklich als Gegenstand des Lobes bei.
theological_decisions:
- issue: Unterschiedliche Wiedergabe von יָהּ und יְהוָה im selben Vers
  choice: יָהּ als „Jah“ und יְהוָה als „Jahwe“
  alternative: Beide Formen mit „der HERR“ oder beide unterschiedslos mit einer Form von „Jahwe“ wiedergeben
  rationale: Der hebräische Text verwendet bewusst die Kurzform und die volle Form des Gottesnamens. Die unterschiedliche Wiedergabe bewahrt diese textliche Unterscheidung, ohne sie theologisch aufzulösen.
- issue: Bedeutung von עַבְדֵי
  choice: „Diener“
  alternative: „Sklaven“
  rationale: Beide Bedeutungen liegen im möglichen Spektrum des hebräischen Ausdrucks. Im Kontext eines liturgischen Lobaufrufs ist „Diener“ im Deutschen angemessener; die lexikalische Alternative wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappen Imperative und ihre dreifache Wiederholung bleiben erhalten; „Jah“ und „Jahwe“ bewahren die zwei Formen des Gottesnamens im Ausgangstext.
