  yaml_path: translation/ot/psalms/113/004.yaml
  text: Yahweh is high above all nations; his glory is above the heavens.
translation:
  language: de
  text: Hoch über allen Völkern ist Jahwe, über den Himmeln seine Herrlichkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָם
  choice: hoch
  rationale: Das prädikative Adjektiv bezeichnet Höhe und Erhabenheit. „Hoch“ bewahrt das räumliche Bild und klingt im Deutschen natürlich und würdevoll.
- source_word: עַל כָּל גּוֹיִם
  choice: über allen Völkern
  rationale: עַל drückt hier erhöhte Stellung beziehungsweise Überlegenheit aus. Die Formulierung erhält zugleich den Parallelismus mit „über den Himmeln“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַל הַשָּׁמַיִם
  choice: über den Himmeln
  rationale: Der poetische Plural שָׁמַיִם wird mit „Himmel“ im deutschen Plural wiedergegeben; das wiederholte „über“ erhält die hebräische Parallelstruktur.
- source_word: כְּבוֹדוֹ
  choice: seine Herrlichkeit
  rationale: כָּבוֹד bezeichnet hier Gottes sichtbare beziehungsweise offenbarte Majestät und Würde. „Herrlichkeit“ ist im Lobpreiskontext treffend, ohne den Ausdruck unnötig einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ gibt die in der Forschung weithin angenommene Aussprache wieder und bewahrt den Namen statt ihn durch „der HERR“ zu ersetzen.
translation_notes:
  register: Poetisch, knapp und würdevoll. Die Voranstellung „Hoch über allen Völkern“ und die elliptische zweite Vershälfte bewahren den hebräischen Parallelismus in natürlichem modernem Deutsch.
