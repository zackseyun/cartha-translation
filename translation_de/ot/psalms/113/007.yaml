source:
  edition: WLC
  text: מְקִֽימִ֣י מֵ/עָפָ֣ר דָּ֑ל מֵֽ֝/אַשְׁפֹּ֗ת יָרִ֥ים אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/007.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap.
translation:
  language: de
  text: Er richtet den Armen aus dem Staub auf; vom Abfallhaufen[a] hebt er den Bedürftigen empor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aschenhaufen“; das hebräische Wort bezeichnet einen Ort, an dem Asche oder Abfälle weggeworfen werden, als Bild äußerster Erniedrigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקִימִי
  choice: richtet … auf
  rationale: Das Hifil-Partizip von קום bezeichnet ein verursachtes Aufstehen. „Richtet … auf“ gibt die Handlung natürlich wieder und bewahrt das Bild, dass Gott den Erniedrigten aus seiner Lage erhebt.
- source_word: מֵעָפָר
  choice: aus dem Staub
  rationale: עָפָר bedeutet „Staub“ oder lockere Erde; מִן bezeichnet den Ausgangspunkt. Die konkrete Metapher tiefer Erniedrigung bleibt erhalten.
- source_word: דָּל
  choice: den Armen
  rationale: דָּל kann einen armen, schwachen oder gesellschaftlich unbedeutenden Menschen bezeichnen. „Den Armen“ ist im Kontext klar und lässt die mitgemeinte Niedrigkeit bestehen.
- source_word: מֵאַשְׁפֹּת
  choice: vom Abfallhaufen
  rationale: אַשְׁפֹּת bezeichnet einen Ort weggeworfener Asche oder Abfälle. „Abfallhaufen“ ist im modernen Deutsch verständlich und vermeidet die zu enge Festlegung auf Asche oder Mist.
- source_word: יָרִים
  choice: hebt … empor
  rationale: Das Hifil von רום bedeutet „erheben“ oder „emporheben“. Die Formulierung entspricht dem poetischen Parallelismus, ohne bereits die gesellschaftliche Erhöhung des folgenden Verses ausdrücklich vorwegzunehmen.
- source_word: אֶבְיוֹן
  choice: den Bedürftigen
  rationale: אֶבְיוֹן bezeichnet einen bedürftigen oder mittellosen Menschen. „Den Bedürftigen“ unterscheidet das Wort von דָּל und wahrt zugleich die semantische Parallelität.
theological_decisions:
- issue: Anthropologische und soziale Bildsprache
  choice: Die konkrete Sprache sozialer Umkehr bleibt erhalten.
  alternative: Der Vers könnte verallgemeinernd auf geistliche Demut und Erhöhung bezogen werden.
  rationale: Der hebräische Text nennt materielle Bilder („Staub“, „Abfallhaufen“) und soziale Gruppen („Armer“, „Bedürftiger“). Die Übersetzung spiritualisiert diese Aussagen nicht, schließt eine weiterführende theologische Anwendung aber auch nicht aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. „Vom“ ist idiomatisch und entspricht „von dem“; die beiden Verben werden bewusst variiert. Der Fußnotenmarker steht unmittelbar beim lexikalisch erklärten Ausdruck.
