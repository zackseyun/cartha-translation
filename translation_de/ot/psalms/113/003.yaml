id: PSA.113.3
reference: Psalms 113:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִ/מִּזְרַח שֶׁ֥מֶשׁ עַד מְבוֹא֑/וֹ מְ֝הֻלָּ֗ל שֵׁ֣ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/003.yaml
  text: From the rising of the sun to its setting[b][a], the name of Yahweh is to be praised.
translation:
  language: de
  text: Vom Aufgang der Sonne bis zu ihrem Untergang[a] soll der Name Jahwes[b] gelobt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vom Osten bis zum Westen“; wörtlich: „vom Aufgang der Sonne bis zu ihrem Untergang“.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: Vom Aufgang der Sonne
  rationale: מִזְרַח kann den Osten oder das Aufgehen bezeichnen. Zusammen mit שֶׁמֶשׁ und als Gegenstück zu מְבוֹאוֹ gibt „vom Aufgang der Sonne“ die poetische Zeit- und Raumspanne natürlich wieder.
- source_word: מְבוֹאוֹ
  choice: bis zu ihrem Untergang
  rationale: Das Wort bezeichnet hier wörtlich das Hineingehen der Sonne; „ihr Untergang“ ist die natürliche deutsche Entsprechung und bewahrt die Parallelität zum Sonnenaufgang.
- source_word: מְהֻלָּל
  choice: soll … gelobt werden
  rationale: Das passive Partizip kann einen bestehenden Zustand oder Lobwürdigkeit ausdrücken. Die Formulierung bewahrt sowohl die allgemeine Aussage als auch den mitschwingenden Aufruf zum Lob, ohne einen ausdrücklichen Imperativ einzuführen.
- source_word: שֵׁם
  choice: der Name
  rationale: 'Die wörtliche Wiedergabe erhält die Bedeutungsbreite des hebräischen Ausdrucks: Ruf, offenbarte Identität und die im Gottesdienst angerufene Person.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ ist die im Deutschen geläufige Umschrift des göttlichen Eigennamens JHWH und gibt den Namen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen; die traditionelle Ersetzung durch „der HERR“ wird in einer Fußnote genannt.
- issue: Aussagekraft des passiven Partizips מְהֻלָּל
  choice: soll … gelobt werden
  alternative: ist gepriesen / sei gelobt
  rationale: „Soll … gelobt werden“ verbindet die allgemeine Feststellung der Lobwürdigkeit mit dem impliziten Aufruf zum Lob. Es vermeidet sowohl eine rein beschreibende Festlegung als auch die Umformung in einen eindeutigen Imperativ.
translation_notes:
  register: Poetisch, würdig und zugleich in modernem Standarddeutsch verständlich. Das Bild von Sonnenaufgang und Sonnenuntergang bewahrt die hebräische Merismus-Struktur und kann sowohl die ganze Tageszeit als auch die gesamte Weite von Osten bis Westen umfassen.
