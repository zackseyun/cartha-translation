  yaml_path: translation/ot/psalms/113/006.yaml
  text: who stoops down to look on the heavens and the earth[a].
translation:
  language: de
  text: der sich herabneigt, um auf den Himmel und die Erde zu schauen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der sich erniedrigt, um den Himmel und die Erde zu sehen“.'
    reason: Lexikalische Alternative zu הַמַּשְׁפִּילִי und לִרְאוֹת.
lexical_decisions:
- source_word: הַמַּשְׁפִּילִי
  choice: der sich herabneigt
  rationale: Das Hifil-Partizip von שׁפל bezeichnet ein Sich-niedrig-Machen bzw. Sich-Herablassen. „Sich herabneigen“ bewahrt das anschauliche Bild, passt zum erhabenen Gott des vorhergehenden Verses und vermeidet den möglichen moralischen Beiklang von „sich erniedrigen“.
- source_word: לִרְאוֹת
  choice: um … zu schauen
  rationale: Der Infinitiv mit ל drückt hier Zweck oder Folge aus. „Schauen“ gibt das betrachtende Sehen in einem natürlichen, würdigen poetischen Register wieder.
- source_word: בַּשָּׁמַיִם
  choice: auf den Himmel
  rationale: שׁמים bezeichnet im poetisch-kosmischen Zusammenhang den Himmel beziehungsweise die Himmel. Im Deutschen bildet der singularische Kollektivbegriff „der Himmel“ zusammen mit „die Erde“ das geläufige Wortpaar.
- source_word: וּבָאָרֶץ
  choice: und die Erde
  rationale: אָרֶץ ist das irdische Gegenstück zum Himmel. Die Präposition ב wird in der deutschen Verbindung idiomatisch durch das gemeinsame „auf“ vor der koordinierten Wortgruppe wiedergegeben.
theological_decisions:
- issue: Anthropomorphe Darstellung von Gottes Erhabenheit und Herablassung
  choice: Das Bild des Sich-Herabneigens bleibt erhalten.
  alternative: der sich erniedrigt, um zu sehen
  rationale: 'Die poetische Spannung bleibt bestehen: Gott ist so erhaben, dass er sich selbst zum Himmel herabneigt, und zugleich wendet er sich Himmel und Erde zu. Eine abstrakte Wiedergabe wie „der Notiz nimmt“ würde dieses Bild einebnen.'
translation_notes:
  register: Moderne, würdige Psalmsprache. „Sich herabneigen“ ist anschaulich und verständlich; „schauen“ hält den poetischen Ton, ohne altertümlich zu wirken.
