lexical_decisions:
- source_word: לְהוֹשִׁיבִי
  choice: um ihn … sitzen zu lassen
  rationale: Der Hifil-Infinitiv von ישׁב mit לְ führt den Zweck bzw. das Ergebnis der Handlung aus Vers 7 fort und enthält ein maskulines Objekt im Singular. Die deutsche Formulierung bewahrt den kausativen Sinn („jemanden sitzen lassen/einen Sitz geben“).
- source_word: עִם
  choice: bei
  rationale: עִם bedeutet grundsätzlich „mit“. In Verbindung mit dem Sitzen klingt „bei“ im Deutschen natürlich und bezeichnet die ehrenvolle Gemeinschaft, ohne das Bild aufzulösen. Die Wiederholung wird beibehalten.
- source_word: נְדִיבִים / נְדִיבֵי
  choice: Edlen / den Edlen
  rationale: נָדִיב kann hochgestellte, vornehme oder fürstliche Personen bezeichnen. „Edle“ gibt den sozialen Rang wieder, ohne ausdrücklich eine königliche Abstammung vorauszusetzen.
- source_word: עַמּוֹ
  choice: seines Volkes
  rationale: עַם bezeichnet hier ein Volk beziehungsweise eine Gemeinschaft. Das Possessivsuffix bleibt in seiner grammatischen Mehrdeutigkeit im Haupttext erhalten.
theological_decisions:
- issue: Bezug von „seines“ in „seines Volkes“
  choice: Der Haupttext lässt den grammatisch möglichen Bezug offen; im Kontext ist wahrscheinlich das Volk des HERRN gemeint.
  alternative: '„Seines“ kann sich auf den emporgehobenen Bedürftigen beziehen: die Edlen seines eigenen Volkes.'
  rationale: Das hebräische Suffix der 3. Person Singular legt den Bezug nicht ausdrücklich fest. Da der HERR im Zusammenhang das handelnde Subjekt ist, liegt ein Bezug auf ihn näher; die andere grammatische Möglichkeit wird jedoch nicht beseitigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Wiederholung von עִם und נְדִיב wird bewahrt. „Bei … sitzen zu lassen“ ist idiomatisch und erhält zugleich das konkrete Bild einer ehrenvollen Sitzgemeinschaft.
