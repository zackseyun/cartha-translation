  text: um ihn mit Edlen[a] sitzen zu lassen, mit den Edlen seines Volkes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Fürsten“; das hebräische Wort kann Edle oder fürstliche Personen bezeichnen.'
