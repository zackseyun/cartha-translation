source:
  edition: WLC
  text: כִּֽי אַתָּה֮ תְּבָרֵ֪ךְ צַ֫דִּ֥יק יְהוָ֑ה כַּ֝/צִּנָּ֗ה רָצ֥וֹן תַּעְטְרֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/012.yaml
  text: For you bless the righteous[a], O Yahweh; like a shield, favor surrounds him.
translation:
  language: de
  text: Denn du segnest den Gerechten, Jahwe; mit Gunst umgibst du ihn wie mit einem Schild.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mit Gunst krönst du ihn wie mit einem Schild.“ Das hebräische Verb kann „krönen“ oder „umgeben“ bedeuten; das Bild des Schildes spricht für eine schützende Umschließung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Zuversicht beziehungsweise Bitte ein und gibt die kausale oder erklärende Funktion natürlich wieder.
- source_word: תְּבָרֵךְ
  choice: segnest
  rationale: Das Imperfekt bezeichnet hier Gottes charakteristisches oder gewiss erwartetes Handeln; das deutsche Präsens bringt diese Zuversicht angemessen zum Ausdruck.
- source_word: צַדִּיק
  choice: den Gerechten
  rationale: Das substantivierte Adjektiv im Singular bezeichnet einen repräsentativen gerechten Menschen und kann zugleich allgemein verstanden werden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen wieder.
- source_word: כַּצִּנָּה
  choice: wie mit einem Schild
  rationale: Das Präfix כְּ kennzeichnet den Vergleich. צִנָּה kann einen großen Schutzschild bezeichnen; im Haupttext genügt das natürliche deutsche Wort „Schild“.
- source_word: רָצוֹן
  choice: mit Gunst
  rationale: Bezeichnet hier Gottes wohlwollende Zuwendung. Die Präposition „mit“ fügt sich in das Bild ein, dass Gottes Gunst den Gerechten schützend umgibt.
- source_word: תַּעְטְרֶנּוּ
  choice: umgibst du ihn
  rationale: Das Verb kann „krönen“ oder „umgeben“ bedeuten. In Verbindung mit dem Schildbild liegt eine schützende Umschließung nahe; die lexikalische Alternative bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet das Tetragramm ausdrücklich. „Jahwe“ wahrt den Eigennamen und ist in der heutigen wissenschaftlichen und bibelkundlichen deutschen Sprache die geläufige Form.
- issue: Verhältnis von Segen, Gerechtigkeit und göttlicher Gunst
  choice: Die Aussage bleibt als Vertrauensbekenntnis stehen, dass Jahwe den Gerechten segnet und schützend mit Gunst umgibt.
  alternative: Eine nähere dogmatische Erklärung, wie die Gerechtigkeit des Menschen und Gottes Gunst zueinander stehen
  rationale: Der Vers selbst erläutert dieses Verhältnis nicht; deshalb wird die theologische Spannung nicht durch eine konfessionelle Deutung aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede „Jahwe“ und der bildhafte Parallelismus bleiben erhalten; der Satzbau ist zugleich für heutige Leser klar und natürlich.
