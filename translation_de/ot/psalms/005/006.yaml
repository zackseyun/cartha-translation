  yaml_path: translation/ot/psalms/005/006.yaml
  text: You destroy those who speak lies[b][a]; Yahweh abhors a man of bloodshed and deceit.
translation:
  language: de
  text: Du vernichtest die, die Lügen reden[a]. Einen Mann des Blutvergießens und des Trugs[b] verabscheut Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du wirst die vernichten, die Lügen reden.“ Die hebräische Verbform kann als zukünftige Aussage oder als allgemeine Aussage über Gottes Handeln verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „einen Mann von Blut und Trug“; die hebräische Wendung bezeichnet einen Mann, der durch Blutvergießen und Täuschung gekennzeichnet ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּאַבֵּד
  choice: Du vernichtest
  rationale: Das Piel von אבד bezeichnet das Zugrunde-Richten oder Vernichten. Das deutsche Präsens gibt hier eine allgemeine Aussage über Gottes Handeln natürlich wieder; ein futurisches Verständnis bleibt möglich und wird in der Fußnote genannt.
- source_word: דֹּבְרֵי כָזָב
  choice: alle, die Lügen reden
  rationale: Die hebräische Verbindung bedeutet wörtlich „Redende von Falschheit“. Die Wiedergabe erhält den verbalen Charakter und klingt im Deutschen klar und würdig.
- source_word: אִישׁ דָּמִים
  choice: einen Mann, der Blut vergießt
  rationale: Der maskuline Singular אִישׁ bleibt als „Mann“ erhalten. Das idiomatische דָּמִים bezeichnet hier Bluttat, Blutvergießen oder schwere Gewalt; die verbale Formulierung ist in modernem Deutsch verständlich, ohne die Aussage auf Mord allein zu verengen.
- source_word: וּמִרְמָה
  choice: und Trug übt
  rationale: מִרְמָה bezeichnet Täuschung, Trug oder Hinterlist. „Trug üben“ bewahrt den nominalen, charakterisierenden Sinn des Hebräischen und passt zum gehobenen poetischen Register.
- source_word: יְתָעֵב
  choice: verabscheut
  rationale: Das Piel von תעב drückt starke Abscheu aus. „Verabscheut“ wahrt diese moralische Intensität in natürlichem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der persönliche Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Zeitbezug von תְּאַבֵּד
  choice: 'allgemeine Aussage im Präsens: „Du vernichtest“'
  alternative: 'futurische Aussage: „Du wirst vernichten“'
  rationale: Das hebräische Imperfekt kann in diesem poetischen Zusammenhang entweder Gottes grundsätzliches Handeln oder ein zukünftiges Handeln ausdrücken. Der Haupttext verwendet das im Deutschen natürliche allgemeine Präsens, während die Fußnote die echte Mehrdeutigkeit bewahrt.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. Die Transliteration bewahrt den persönlichen Namen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Maskuliner Singular אִישׁ
  choice: einen Mann
  alternative: einen Menschen / den Gewalttätigen
  rationale: Der hebräische Text verwendet ausdrücklich den grammatisch maskulinen Singular. Die Übersetzung erhält diese Form, ohne sie zu einer geschlechtsneutralen oder kollektiven Bezeichnung umzudeuten.
- issue: Idiomhafte Verbindung אִישׁ דָּמִים וּמִרְמָה
  choice: einen Mann, der Blut vergießt und Trug übt
  alternative: einen Mann von Blut und Trug
  rationale: Die verständliche deutsche Verbalkonstruktion gibt beide kennzeichnenden Eigenschaften wieder, ohne „Blut“ vorschnell ausschließlich als Mord oder „Trug“ ausschließlich als finanziellen Betrug festzulegen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdig-poetischem Ton. „Trug üben“ ist bewusst leicht gehoben, um die parallele Charakterisierung durch die beiden hebräischen Substantive zu erhalten. Beide Fußnotenmarker stehen unmittelbar an den betreffenden Formulierungen im Haupttext.
