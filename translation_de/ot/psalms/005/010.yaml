source:
  edition: WLC
  text: הַֽאֲשִׁימֵ֨/ם אֱֽלֹהִ֗ים יִפְּלוּ֮ מִֽ/מֹּעֲצ֪וֹתֵ֫י/הֶ֥ם בְּ/רֹ֣ב פִּ֭שְׁעֵי/הֶם הַדִּיחֵ֑/מוֹ כִּי מָ֥רוּ בָֽ/ךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/010.yaml
  text: Declare them guilty[a], O God; let them fall by their own counsels. Drive them away because of their many transgressions[b], for they have rebelled against you.
translation:
  language: de
  text: 'Erkläre sie für schuldig, Gott!


    Lass sie durch ihre eigenen Pläne zu Fall kommen.[a]


    Vertreibe sie[b] wegen ihrer vielen Vergehen,


    denn sie haben sich gegen dich aufgelehnt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lass sie an ihren eigenen Plänen scheitern.“ Die Präposition kann den Sturz auch als Folge ihrer eigenen Pläne kennzeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Verstoße sie“ oder „Verbanne sie“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲשִׁימֵם
  choice: Sprich sie schuldig
  rationale: Der Hifil-Imperativ von אשם mit Suffix hat hier einen gerichtlichen Sinn. Die Formulierung bittet Gott, ihre Schuld festzustellen, ohne die konkrete Strafe vorwegzunehmen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die direkte Anrede wird im Deutschen natürlich ohne ein zusätzliches Anredewort wiedergegeben.
- source_word: יִפְּלוּ
  choice: Lass sie … zu Fall kommen
  rationale: Das Imperfekt hat in diesem Gebetszusammenhang auffordernden beziehungsweise wünschenden Sinn. Die Wiedergabe bewahrt die Bitte um Gottes Eingreifen.
- source_word: מִמֹּעֲצוֹתֵיהֶם
  choice: durch ihre eigenen Pläne
  rationale: מוֹעֵצוֹת bezeichnet Pläne oder Vorhaben. מן kann Herkunft beziehungsweise Trennung, aber auch Ursache oder Mittel ausdrücken; der Haupttext gibt die naheliegende Ironie wieder, dass ihre eigenen Pläne ihren Sturz bewirken, während die Fußnote die sprachliche Offenheit festhält.
- source_word: בְּרֹב פִּשְׁעֵיהֶם
  choice: wegen ihrer vielen Vergehen
  rationale: בְּ mit רֹב wird hier kausal verstanden. פֶּשַׁע bezeichnet schuldhafte Übertretung und kann zugleich den Beiklang von Auflehnung tragen; „Vergehen“ ist verständlich und gewichtig, ohne die folgende Begründung unnötig zu verdoppeln.
- source_word: הַדִּיחֵמוֹ
  choice: Treibe sie fort
  rationale: Der Hifil-Imperativ von נדח bezeichnet das Vertreiben, Verstoßen oder Verbannen. „Treibe sie fort“ wahrt die Kraft der Bitte und bleibt im modernen Deutschen natürlich.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund für die vorausgehenden Bitten ein.
- source_word: מָרוּ בָךְ
  choice: sie haben sich gegen dich aufgelehnt
  rationale: מרה mit בְּ bezeichnet Auflehnung gegen Gott. Die reflexive deutsche Formulierung ist idiomatisch und bewahrt den persönlichen Widerstand gegen Gott.
theological_decisions:
- issue: Sprache des Fluch- beziehungsweise Vergeltungsgebets
  choice: Die unmittelbaren Bitten um ein göttliches Schuldurteil und um Vertreibung bleiben als Bitten stehen.
  alternative: Die Verbformen als bloße Vorhersagen wiedergeben oder die Gerichtssprache abschwächen.
  rationale: Der hebräische Text verwendet Imperative und ein aufforderndes beziehungsweise wünschendes Imperfekt in direkter Anrede an Gott. Die Übersetzung bewahrt deshalb die theologische Spannung des Gebets, statt sie durch Umdeutung zu beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappen poetischen Zeilen. Der gerichtliche Ton und die direkte Gebetssprache bleiben erhalten; veraltete oder konfessionell geprägte Wendungen werden vermieden.
