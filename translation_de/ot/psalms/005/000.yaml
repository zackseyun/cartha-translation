base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/000.yaml
  text: 'For the choirmaster: according to the flutes[a]. A psalm of David[b].'
translation:
  language: de
  text: Für den Chorleiter. Zu Flöten[a]. Ein Psalm Davids[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „zu Blasinstrumenten“. Der hebräische Ausdruck ist unsicher und könnte eine technische musikalische Angabe sein; traditionell wird er auch unübersetzt als „Nehilot“ wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: Die Angabe „Davids“ kann auf Verfasserschaft, Widmung, Zugehörigkeit oder die Zuordnung zur davidischen Sammlung hinweisen.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In Psalmüberschriften bezeichnet die Form wahrscheinlich den für die musikalische Ausführung Verantwortlichen. „Chorleiter“ ist im Deutschen verständlich und bewahrt den liturgisch-musikalischen Bezug.
- source_word: אֶל הַנְּחִילוֹת
  choice: Nach Flötenweise
  rationale: אֶל kann hier eine musikalische Vorgabe einleiten. הַנְּחִילוֹת wird wahrscheinlich mit Flöten oder Blasinstrumenten verbunden, ist als technischer Ausdruck jedoch unsicher. „Nach Flötenweise“ gibt die vermutete musikalische Funktion wieder, ohne eine bloße Instrumentenangabe zu erzwingen.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: „Psalm“ ist im kanonischen Zusammenhang die etablierte und sachgerechte Wiedergabe des musikalischen Gattungsbegriffs.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der hebräische Ausdruck kann Urheberschaft, Zugehörigkeit, Widmung oder Einordnung in eine davidische Sammlung bezeichnen. Der deutsche Genitiv bewahrt diese Mehrdeutigkeit besser als „von David verfasst“.
theological_decisions:
- issue: Bedeutung der Zuschreibung לְדָוִד
  choice: Davids
  alternative: von David
  rationale: Die Überschrift wird nicht ausdrücklich auf direkte Verfasserschaft festgelegt; die im Hebräischen mögliche Zugehörigkeit oder Zuordnung bleibt offen.
translation_notes:
  register: Moderne, würdige Psalmüberschrift in knapper Form. „Flötenweise“ macht den wahrscheinlichen musikalischen Charakter verständlich; die Unsicherheit wird in der Fußnote ausdrücklich erhalten.
