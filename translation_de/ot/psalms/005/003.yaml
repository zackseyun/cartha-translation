id: PSA.5.3
reference: Psalms 5:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְֽהוָ֗ה בֹּ֭קֶר תִּשְׁמַ֣ע קוֹלִ֑/י בֹּ֥קֶר אֶֽעֱרָךְ לְ֝/ךָ֗ וַ/אֲצַפֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/003.yaml
  text: Yahweh[a], in the morning you hear my voice[b]; in the morning I lay my request before you and watch expectantly.
translation:
  language: de
  text: Jahwe, am Morgen hörst du meine Stimme; am Morgen bringe ich dir mein Anliegen vor[a] und halte erwartungsvoll Ausschau.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „ich ordne es dir“ oder „ich lege es geordnet vor“. Was der Beter vorbringt, bleibt im Hebräischen unausgesprochen; gemeint ist wahrscheinlich sein Gebet oder Anliegen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und warte erwartungsvoll“. Das hebräische Verb kann ein Ausschauen, Beobachten oder hoffnungsvolles Warten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: בֹּקֶר
  choice: am Morgen
  rationale: Das zeitlich-adverbial gebrauchte Substantiv wird an beiden Stellen gleich wiedergegeben, sodass die poetische Wiederholung erhalten bleibt.
- source_word: תִּשְׁמַע
  choice: hörst du
  rationale: Das Imperfekt kann hier gegenwärtig-gewohnheitsmäßig oder zukünftig verstanden werden. Das deutsche Präsens bringt die zuversichtliche Erwartung des Beters natürlich zum Ausdruck, ohne die Aussage stark auf die Zukunft festzulegen.
- source_word: קוֹלִי
  choice: meine Stimme
  rationale: Die direkte Entsprechung ist im Gebetszusammenhang verständlich; „mein Rufen“ wäre bereits stärker ausdeutend.
- source_word: אֶעֱרָךְ
  choice: bringe ich mein Anliegen vor
  rationale: Das Verb bezeichnet ein Ordnen oder geordnetes Darlegen. Da das Objekt im Hebräischen unausgesprochen bleibt, gibt „mein Anliegen vorbringen“ den wahrscheinlichen Gebetssinn natürlich wieder; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: לְךָ
  choice: dir
  rationale: Die Präposition bedeutet formal „dir/für dich“ und verbindet sich im Deutschen idiomatisch mit „ein Anliegen vorbringen“.
- source_word: וַאֲצַפֶּה
  choice: und halte erwartungsvoll Ausschau
  rationale: Die Form bezeichnet ein aufmerksames Schauen oder Ausschauen und kann im Zusammenhang zugleich hoffnungsvolles Warten ausdrücken. Die gewählte Formulierung erhält beide Aspekte.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jahweh; Jehova; der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ ist die im modernen Deutschen geläufige wissenschaftliche Umschrift und wahrt den Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Unausgesprochenes Objekt von אֶעֱרָךְ
  choice: mein Anliegen
  alternative: meine Bitte; mein Gebet; kein ergänztes Objekt („ich ordne vor dir“)
  rationale: Der Gebetskontext legt ein vor Gott gebrachtes Anliegen nahe, doch der hebräische Text nennt das Objekt nicht ausdrücklich. Daher steht die Ergänzung im Haupttext, während die formale Offenheit in der Fußnote kenntlich bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelität. Die zweimalige Wendung „am Morgen“ bleibt erhalten. „Jahwe“ folgt der üblichen deutschen Form des Gottesnamens; die syntaktischen und lexikalischen Mehrdeutigkeiten werden nicht dogmatisch aufgelöst, sondern in den Fußnoten offengelegt.
