  text: כִּ֤י לֹ֤א אֵֽל חָפֵ֘ץ רֶ֥שַׁע אָ֑תָּה לֹ֖א יְגֻרְ/ךָ֣ רָֽע׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/004.yaml
  text: For you are not a God who delights in wickedness[a]; evil may not dwell with you.
translation:
  language: de
  text: Denn du bist kein Gott, der an Bosheit Gefallen hat; Böses kann nicht bei dir wohnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Böser kann nicht bei dir wohnen“; auch: „Kein Übeltäter kann bei dir wohnen.“'
    reason: Alternative Deutung des substantivierten רָע als Personenbezeichnung statt als abstraktes Böses.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Bitte ein und entspricht dem argumentativen Zusammenhang des Psalms.
- source_word: אֵל
  choice: Gott
  rationale: Bezeichnet in der direkten Anrede den Gott Israels; „Gott“ ist die natürliche deutsche Wiedergabe.
- source_word: חָפֵץ
  choice: Gefallen hat
  rationale: Drückt Wohlgefallen oder Freude an etwas aus, nicht bloß einen Willensentschluss.
- source_word: רֶשַׁע
  choice: Gottlosigkeit
  rationale: Das abstrakte Substantiv bezeichnet schuldhaftes, frevelhaftes Handeln; „Gottlosigkeit“ bewahrt die ausgeprägte moralisch-religiöse Dimension.
- source_word: יְגֻרְךָ
  choice: kann nicht bei dir wohnen
  rationale: גור bezeichnet das Wohnen oder Verweilen, besonders als Gast oder Fremder. Die Formulierung gibt hier die Unvereinbarkeit mit Gottes Gegenwart wieder, ohne ein bloßes Futur auszudrücken.
- source_word: רָע
  choice: Böses
  rationale: Die substantivierte Form kann abstrakt das Böse oder konkret einen bösen Menschen bezeichnen. „Böses“ entspricht dem Parallelismus mit „Gottlosigkeit“, während die alternative persönliche Deutung in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Ob רָע abstrakt als „Böses“ oder persönlich als „ein Böser“ zu verstehen ist
  choice: Böses
  alternative: Ein Böser / ein Übeltäter
  rationale: Der Parallelismus mit dem abstrakten רֶשַׁע spricht für die abstrakte Wiedergabe. Da die hebräische Form jedoch auch eine Person bezeichnen kann und der folgende Vers von Übeltätern spricht, bleibt diese echte Mehrdeutigkeit in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gefallen haben an“ wahrt den gehobenen Psalmton, bleibt aber allgemein verständlich. Die knappe Parallelstruktur des Hebräischen wird erhalten.
