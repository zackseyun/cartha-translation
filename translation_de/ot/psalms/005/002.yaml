base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/002.yaml
  text: Pay attention to the sound of my cry for help[a], my King and my God, for to you I pray.
translation:
  language: de
  text: Höre auf meinen Hilferuf, mein König und mein Gott, denn zu dir bete ich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde ich beten“. Die hebräische Form kann je nach Zusammenhang eine gegenwärtige, fortdauernde oder zukünftige Handlung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Achte auf
  rationale: Der Imperativ von קשׁב fordert zu aufmerksamem Hören auf. „Achte auf“ ist modernes, natürliches Deutsch und bewahrt den Nachdruck der Bitte.
- source_word: לְקוֹל
  choice: auf den Klang
  rationale: קוֹל bezeichnet Stimme oder Laut/Klang. In Verbindung mit „meinem Hilferuf“ gibt „den Klang“ die hebräische Konstruktion verständlich wieder.
- source_word: שַׁוְעִי
  choice: meines Hilferufs
  rationale: שַׁוְעָה bezeichnet einen Ruf aus Not beziehungsweise um Hilfe; „Hilferuf“ bringt diesen Sinn knapp und idiomatisch zum Ausdruck.
- source_word: מַלְכִּי
  choice: mein König
  rationale: Der direkt an Gott gerichtete Königstitel wird ohne Abschwächung beibehalten.
- source_word: וֵאלֹהָי
  choice: und mein Gott
  rationale: Direkte und natürliche Wiedergabe des Gottesnamens beziehungsweise Gottestitels mit Suffix der ersten Person Singular.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die vorausgehende Bitte ein; „denn“ passt zum würdigen Gebetsstil.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Die Präposition bezeichnet die Ausrichtung des Gebets auf Gott; „zu dir“ ist im Deutschen idiomatisch.
- source_word: אֶתְפַּלָּל
  choice: bete ich
  rationale: Die Präfixkonjugation im Hitpael von פלל kann je nach Kontext gegenwärtige, fortdauernde oder zukünftige Handlung ausdrücken. Im unmittelbaren Gebet ist das Präsens natürlich, ohne die aspektuelle Offenheit in der Fußnote zu verschweigen.
theological_decisions:
- issue: Göttliche Anrede mit Königstitel
  choice: mein König und mein Gott
  alternative: mein König, mein Gott
  rationale: Beide Titel stehen im Hebräischen als direkte Anrede an Gott. Die Übersetzung bewahrt sie, ohne zusätzliche dogmatische Aussagen einzutragen.
- issue: Zeitbezug von אֶתְפַּלָּל
  choice: bete ich
  alternative: werde ich beten
  rationale: Die hebräische Form kann gegenwärtig, fortdauernd oder zukünftig verstanden werden. Der unmittelbare Gebetskontext legt im Haupttext das deutsche Präsens nahe; die echte Mehrdeutigkeit bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Gebetston. Die Formulierung bleibt nah an der hebräischen Bildlichkeit, ohne altertümliche Wendungen wie „leihe dein Ohr“ zu verwenden.
