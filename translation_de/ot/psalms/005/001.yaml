  text: אֲמָרַ֖/י הַאֲזִ֥ינָ/ה יְהוָ֗ה בִּ֣ינָ/ה הֲגִֽיגִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/001.yaml
  text: Give ear to my words[a], O Yahweh; understand my groaning.
translation:
  language: de
  text: Höre meine Worte an, Jahwe; verstehe mein Seufzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mein Sinnen« oder »mein Murmeln«. Das hebräische Wort kann inneres Nachsinnen oder eine leise Äußerung bezeichnen; im Zusammenhang dieses Klagegebets ist es hier mit »Seufzen« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָרַי
  choice: meine Worte
  rationale: Der Plural mit Suffix der 1. Person Singular bezeichnet die gesprochenen Worte des Beters; »meine Worte« ist direkt und natürlich.
- source_word: הַאֲזִינָה
  choice: Höre aufmerksam auf
  rationale: Die Aufforderung von אזן bittet um aufmerksames Hinhören. Diese Wiedergabe bewahrt den Nachdruck des hebräischen Ausdrucks in natürlichem modernem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בִּינָה
  choice: verstehe
  rationale: Der Imperativ von בין bittet darum, das nur teilweise Ausgesprochene wahrzunehmen und zu erfassen; »verstehe« erhält diese kognitive Nuance.
- source_word: הֲגִיגִי
  choice: mein Seufzen
  rationale: הגיג kann inneres Sinnen, leises Murmeln oder eine gedämpfte Äußerung bezeichnen. Im Klagegebet gibt »Seufzen« die schmerzvolle, womöglich kaum artikulierte Äußerung natürlich wieder, ohne die anderen Möglichkeiten zu verschweigen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. »Jahwe« bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Höre aufmerksam auf« vermeidet das heute ungebräuchliche »Neige dein Ohr«, erhält aber die nachdrückliche Bitte. Die knappe Parallelstruktur des hebräischen Verses bleibt gewahrt.
