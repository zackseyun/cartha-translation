id: PSA.5.9
reference: Psalms 5:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י אֵ֪ין בְּ/פִ֡י/הוּ נְכוֹנָה֮ קִרְבָּ֪/ם הַ֫וּ֥וֹת קֶֽבֶר פָּת֥וּחַ גְּרוֹנָ֑/ם לְ֝שׁוֹנָ֗/ם יַחֲלִֽיקוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/009.yaml
  text: For there is nothing trustworthy in their mouth[a]; their inward part is destruction. Their throat is an open grave[c][b]; with their tongue they flatter.
translation:
  language: de
  text: Denn in ihrem Mund ist nichts Verlässliches[a]; ihr Inneres ist Verderben[b]. Ein offenes Grab ist ihre Kehle; mit ihrer Zunge schmeicheln sie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher nach der singularischen Form: „in seinem Mund ist nichts Verlässliches“. Der weitere Vers hat Pluralformen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Ihr Inneres ist Unheil“ beziehungsweise „voller Verderben“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Mit ihrer Zunge reden sie glatt.“ Gemeint ist glatte, einschmeichelnde Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Bitte ein und bewahrt den logischen Zusammenhang.
- source_word: אֵין בְּפִיהוּ נְכוֹנָה
  choice: in ihrem Mund ist nichts Verlässliches
  rationale: נְכוֹנָה bezeichnet hier Festigkeit beziehungsweise Zuverlässigkeit; im Zusammenhang trügerischer Rede gibt „nichts Verlässliches“ den Sinn natürlich und präzise wieder.
- source_word: בְּפִיהוּ
  choice: in ihrem Mund
  rationale: Die Form ist morphologisch singularisch („in seinem Mund“), doch die anschließenden Pluralsuffixe beziehen sich auf dieselbe Gruppe. Der Plural stellt im Deutschen den kontextuellen Gruppenbezug klar; die streng formale Alternative wird in einer Fußnote bewahrt.
- source_word: קִרְבָּם
  choice: ihr Inneres
  rationale: Gibt den umfassenden anthropologischen Ausdruck für das Innere wieder, ohne ihn auf das Herz oder eine einzelne innere Fähigkeit zu verengen.
- source_word: הַוּוֹת
  choice: Verderben
  rationale: Der Plural kann zerstörerische Absichten, Unheil oder ruinöse Wesensart bezeichnen. Das abstrakte Singularwort „Verderben“ passt zur prädikativen Aussage und erhält ihre Härte.
- source_word: קֶבֶר פָּתוּחַ
  choice: ein offenes Grab
  rationale: Bewahrt das konkrete, tödliche Bild des hebräischen Textes in geläufigem Deutsch.
- source_word: גְּרוֹנָם
  choice: ihre Kehle
  rationale: Im Bildfeld von Mund, Zunge und Rede ist „Kehle“ die naheliegende anatomische Wiedergabe.
- source_word: לְשׁוֹנָם
  choice: mit ihrer Zunge
  rationale: Der hebräische kollektive Singular lässt sich im Deutschen ebenso natürlich als „ihre Zunge“ wiedergeben.
- source_word: יַחֲלִיקוּן
  choice: sie schmeicheln
  rationale: Das Hifil von חלק bezeichnet hier glatte, einschmeichelnde und dadurch irreführende Rede. „Schmeicheln“ ist knapp und kontextgerecht.
theological_decisions:
- issue: Anthropologische Metapher in קִרְבָּם
  choice: ihr Inneres
  alternative: ihr Herz / ihr innerstes Wesen
  rationale: „Ihr Inneres“ erhält die umfassende poetische Aussage über die innere Verderbtheit, ohne den Ausdruck stillschweigend auf das Herz als bestimmte menschliche Fähigkeit festzulegen.
- issue: Numerus von בְּפִיהוּ im Kontext
  choice: in ihrem Mund
  alternative: in seinem Mund
  rationale: Obwohl die vorliegende Form singularisch ist, folgen mehrere eindeutige Pluralbezüge. Die Hauptübersetzung folgt dem kollektiven Kontext; die formnähere singularische Lesart bleibt in der Fußnote sichtbar.
- issue: Bedeutungsumfang von הַוּוֹת
  choice: Verderben
  alternative: Unheil / Verderbliches
  rationale: Der Ausdruck kann sowohl den verderbten inneren Zustand als auch daraus hervorgehende zerstörerische Absichten bezeichnen. „Verderben“ wahrt diese Spannung besser als eine engere moralische oder psychologische Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dichterischer Parallelstruktur. Die anschaulichen Körperbilder „Mund“, „Inneres“, „Kehle“ und „Zunge“ bleiben erhalten. Der Gruppenbezug wird im Haupttext einheitlich pluralisch formuliert; die auffällige singularische Ausgangsform wird transparent in der Fußnote dokumentiert.
