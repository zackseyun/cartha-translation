source:
  edition: WLC
  text: וַ/אֲנִ֗י בְּ/רֹ֣ב חַ֭סְדְּ/ךָ אָב֣וֹא בֵיתֶ֑/ךָ אֶשְׁתַּחֲוֶ֥ה אֶל הֵֽיכַל קָ֝דְשְׁ/ךָ֗ בְּ/יִרְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/007.yaml
  text: But as for me[a], by the abundance of your steadfast love I will enter your house[b]; I will bow down toward your holy temple in fear of you.
translation:
  language: de
  text: Ich aber[a] werde dank der Fülle deiner beständigen Liebe in dein Haus kommen; ich werde mich in Ehrfurcht vor dir[b] zu deinem heiligen Tempel hin niederbeugen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch ich“.'
    reason: Die hebräische Verbindung kann je nach Gewichtung des Kontrasts knapp mit „Ich aber“ oder stärker abgesetzt mit „Doch ich“ wiedergegeben werden.
  - marker: b
    text: 'Oder: „in Furcht vor dir“ beziehungsweise „in heiliger Scheu vor dir“.'
    reason: Das hebräische יִרְאָה umfasst Furcht, Ehrfurcht und Scheu; keine einzelne deutsche Entsprechung bildet den gesamten Bedeutungsumfang ab.
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Die Konjunktion mit dem selbstständigen Pronomen hebt den Beter kontrastierend von den zuvor genannten Frevlern ab. „Ich aber“ gibt diesen Gegensatz natürlich und knapp wieder.
- source_word: בְּרֹב
  choice: durch die Fülle
  rationale: בְּ kann hier die Grundlage oder das Mittel des Kommens bezeichnen. „Durch die Fülle“ macht deutlich, dass der Zugang auf Gottes reichlicher Güte beruht, ohne die mögliche Nuance „inmitten der Fülle“ auszuschließen.
- source_word: חַסְדְּךָ
  choice: deiner beständigen Liebe
  rationale: חֶסֶד bezeichnet verlässliche, loyale Zuwendung, häufig im Rahmen einer Bundesbeziehung. „Beständige Liebe“ bewahrt sowohl die persönliche als auch die dauerhafte Dimension.
- source_word: אָבוֹא
  choice: werde ... kommen
  rationale: Das Imperfekt drückt hier Erwartung oder Entschlossenheit aus. Mit „in dein Haus kommen“ bleibt die Bewegungsrichtung des Hebräischen natürlich erhalten.
- source_word: בֵיתֶךָ
  choice: dein Haus
  rationale: Die Grundbedeutung ist „Haus“. Die kultische Bedeutung ergibt sich aus dem Zusammenhang; eine vorzeitige Gleichsetzung mit „Tempel“ würde zudem die folgende Bezeichnung הֵיכַל einebnen.
- source_word: אֶשְׁתַּחֲוֶה
  choice: werde mich ... niederbeugen
  rationale: Das Verb bezeichnet eine körperliche Verneigung oder Niederwerfung als Ausdruck der Anbetung. Die Übersetzung bewahrt diese konkrete Bildlichkeit.
- source_word: אֶל
  choice: zu ... hin
  rationale: Die Präposition bezeichnet nach dem Verb des Niederbeugens die Ausrichtung auf das Heiligtum, ohne zu behaupten, der Beter befinde sich im inneren Tempelbereich.
- source_word: הֵיכַל קָדְשְׁךָ
  choice: deinem heiligen Tempel
  rationale: הֵיכַל kann „Palast“ oder „Tempel“ bedeuten. Im kultischen Zusammenhang ist „Tempel“ angemessen; קָדְשְׁךָ wird idiomatisch als Adjektiv wiedergegeben.
- source_word: בְּיִרְאָתֶךָ
  choice: in Ehrfurcht vor dir
  rationale: יִרְאָה umfasst Furcht, Ehrfurcht und Scheu angesichts Gottes. „Ehrfurcht“ ist im modernen Deutschen natürlich und bewahrt die ernste, heilige Haltung; die stärkere Wiedergabe „Furcht“ wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutungsumfang von חֶסֶד als Grundlage des Zugangs zu Gottes Haus
  choice: beständige Liebe
  alternative: Bundestreue; Güte
  rationale: Der Vers gründet das Kommen des Beters nicht in dessen eigenem Verdienst, sondern in Gottes verlässlicher Zuwendung. „Beständige Liebe“ bewahrt die relationale und dauerhafte Dimension, ohne den Ausdruck ausschließlich auf einen einzelnen theologischen Aspekt festzulegen.
- issue: Nuance von יִרְאָה in der Anbetung
  choice: Ehrfurcht vor dir
  alternative: Furcht vor dir; Scheu vor dir
  rationale: Der Ausdruck verbindet Anbetung mit heiliger Scheu. „Ehrfurcht“ vermeidet sowohl die Verengung auf bloßes Entsetzen als auch eine Abschwächung zu unverbindlichem Respekt; die wörtlichere Möglichkeit „Furcht“ bleibt ausdrücklich sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die körperliche Bildsprache des Niederbeugens bleiben erhalten. „Haus“ und „Tempel“ werden unterschieden; „Ehrfurcht“ hält die Spannung zwischen Furcht und anbetender Scheu aufrecht.
