id: PSA.5.8
reference: Psalms 5:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָ֤ה נְחֵ֬/נִי בְ/צִדְקָתֶ֗/ךָ לְמַ֥עַן שׁוֹרְרָ֑/י הושר לְ/פָנַ֣/י דַּרְכֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/008.yaml
  text: O Yahweh[a], lead me in your righteousness because of my enemies[b]; make your way straight before me.
translation:
  language: de
  text: Jahwe, führe mich in deiner Gerechtigkeit um meiner Widersacher willen[a]; ebne deinen Weg vor mir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen derer, die mir feindselig auflauern“. Das hebräische Wort kann Gegner bezeichnen, die den Beter argwöhnisch beobachten oder ihm auflauern.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mach deinen Weg vor mir gerade“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen direkt in der im Deutschen geläufigen Form „Jahwe“ wieder; die Anrede benötigt kein zusätzliches „O“.
- source_word: נְחֵנִי
  choice: führe mich
  rationale: Das Verb נחה bezeichnet Führen oder Leiten; „führe mich“ ist im Gebetskontext natürlich und bewahrt den aktiven Bildgehalt.
- source_word: בְצִדְקָתֶךָ
  choice: in deiner Gerechtigkeit
  rationale: Bewahrt die mögliche räumlich-normative Kraft der Präposition ב und den breiten moralischen Sinn von צדקה, ohne ihn auf gerichtliche Gerechtigkeit zu verengen.
- source_word: לְמַעַן
  choice: um ... willen
  rationale: Die Wendung gibt den Anlass beziehungsweise Beweggrund wieder und folgt zugleich dem formalen Ausdruck des Hebräischen.
- source_word: שׁוֹרְרָי
  choice: meiner Widersacher
  rationale: „Widersacher“ bezeichnet feindliche Gegner und lässt die mögliche Nuance feindseliger Beobachter offen, die in einer Fußnote erläutert wird.
- source_word: הושר
  choice: ebne
  rationale: Der Hifil-Imperativ von ישר kann „gerade machen“ oder „ebnen“ bedeuten. „Ebne“ ergibt mit „Weg“ eine natürliche deutsche Wegmetapher.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Direkte und idiomatische Wiedergabe der präpositionalen Wendung.
- source_word: דַּרְכֶּךָ
  choice: deinen Weg
  rationale: „Weg“ bewahrt sowohl die konkrete Wegmetapher als auch den übertragenen Sinn einer von Gott gewiesenen Lebensführung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von צדקה
  choice: Gerechtigkeit
  alternative: Recht
  rationale: „Gerechtigkeit“ erhält den breiten moralischen und beziehungsbezogenen Sinn des Begriffs; „Recht“ könnte die Bitte unnötig auf eine gerichtliche Dimension beschränken.
- issue: Bild des geraden oder ebenen Weges
  choice: ebne deinen Weg
  alternative: mach deinen Weg gerade
  rationale: Beide Bedeutungen sind lexikalisch möglich. Die Hauptfassung verwendet die im Deutschen natürliche Wegmetapher „ebnen“; die Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Moderne, würdevolle Gebetssprache mit enger Bindung an die hebräische Satzstruktur. „Widersacher“ ist leicht gehoben, aber allgemein verständlich und trägt die feindselige Nuance besser als das allgemeinere „Feinde“.
