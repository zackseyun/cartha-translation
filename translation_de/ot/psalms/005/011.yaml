base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/011.yaml
  text: But let all who take refuge in you rejoice[a]; let them shout for joy forever. Spread your protection over them[b], so that those who love your name may exult in you.
translation:
  language: de
  text: Doch alle, die bei dir Zuflucht suchen, sollen sich freuen; für immer sollen sie jubeln.[a] Breite deinen Schutz über sie aus,[b] damit alle, die deinen Namen lieben, an dir frohlocken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für immer sollen sie Freudenlieder singen“. Das hebräische Verb bezeichnet laute Jubelrufe und kann auch Singen einschließen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Beschirme sie“ beziehungsweise „Bedecke sie“. Das hebräische Bild ist das einer schützenden Bedeckung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂמְחוּ
  choice: sollen sich freuen
  rationale: Der Qal-Imperfekt kann im Gebetszusammenhang einen Wunsch ausdrücken. „Sollen sich freuen“ bewahrt diesen volitiven Ton, ohne die Form als bloße Zukunft festzulegen.
- source_word: כָל חוֹסֵי בָךְ
  choice: alle, die bei dir Zuflucht suchen
  rationale: Das Partizip von חסה bezeichnet das Aufsuchen von Schutz. Die Formulierung erhält das konkrete Zufluchtsbild und klingt im modernen Deutsch natürlich.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet eine unbegrenzte beziehungsweise fortdauernde Zeit und wird idiomatisch mit „für immer“ wiedergegeben.
- source_word: יְרַנֵּנוּ
  choice: sollen sie jubeln
  rationale: Das Piel von רנן bezeichnet lauten, jubelnden Ausdruck der Freude und kann auch Singen einschließen. „Jubeln“ lässt diese Spannweite eher offen als das engere „singen“.
- source_word: וְתָסֵךְ עָלֵימוֹ
  choice: Breite deinen Schutz über sie aus
  rationale: Das Hiphil von סכך vermittelt das Bild eines schützenden Bedeckens oder Überschirmens. Die Wiedergabe macht den Schutzsinn deutlich und bewahrt zugleich das räumliche Bild.
- source_word: וְיַעְלְצוּ בְךָ
  choice: damit ... über dich frohlocken
  rationale: עלץ bezeichnet überschwängliche Freude. „Frohlocken“ erhält die gehobene, feierliche Intensität; „über dich“ gibt den Gegenstand beziehungsweise Grund der Freude im Deutschen natürlich wieder.
- source_word: אֹהֲבֵי שְׁמֶךָ
  choice: alle, die deinen Namen lieben
  rationale: Der hebräische Text nennt ausdrücklich Gottes Namen. Diese Bundes- und Offenbarungssprache wird nicht zu „die dich lieben“ verflacht.
theological_decisions:
- issue: Gebetswunsch oder Vorhersage bei den Imperfektformen
  choice: 'Die Formen werden überwiegend als Bitten beziehungsweise Wünsche wiedergegeben: „sollen sich freuen“, „sollen sie jubeln“ und final „damit ... frohlocken“.'
  alternative: „Alle ... werden sich freuen; sie werden für immer jubeln ... und ... werden über dich frohlocken.“
  rationale: Im Gebetskontext des Psalms liegt eine jussivisch-volitive Lesart nahe. Die deutsche Fassung wahrt den Gebetscharakter, ohne aus den Formen sichere Zukunftsvorhersagen zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. „Frohlocken“ ist bewusst gehoben, aber im Psalmregister verständlich. Die Satzfolge folgt der hebräischen Bewegung von Zuflucht über Jubel und Schutz zur Freude an Gott.
