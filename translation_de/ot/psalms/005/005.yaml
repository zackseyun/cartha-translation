  text: לֹֽא יִתְיַצְּב֣וּ הֽ֭וֹלְלִים לְ/נֶ֣גֶד עֵינֶ֑י/ךָ שָׂ֝נֵ֗אתָ כָּל פֹּ֥עֲלֵי אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/005.yaml
  text: The boastful will not stand before your eyes[b][a]; you hate all workers of wickedness.
translation:
  language: de
  text: Die Prahler[a] werden vor deinen Augen nicht bestehen; du hasst alle, die Unrecht tun[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Überheblichen“, „die Törichten“ oder „die Frechen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „alle Täter des Unrechts“; auch möglich: „alle, die Böses tun“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: können nicht bestehen
  rationale: Der Hitpael von יצב bezeichnet das Sich-Hinstellen bzw. Bestehen in jemandes Gegenwart. Mit „können nicht bestehen“ wird im Deutschen natürlich ausgedrückt, dass sie vor Gott keinen Bestand haben, ohne die Aussage auf bloße Körperhaltung zu verengen.
- source_word: הוֹלְלִים
  choice: die Prahler
  rationale: Die Form bezeichnet hier ruhmredige, überhebliche Menschen. „Prahler“ bewahrt den Bezug zum selbstgefälligen Rühmen und passt zum moralischen Parallelismus.
- source_word: לְנֶגֶד עֵינֶיךָ
  choice: vor deinen Augen
  rationale: Die konkrete hebräische Bildsprache bleibt erhalten und bezeichnet zugleich Gottes Blick und Gegenwart.
- source_word: שָׂנֵאתָ
  choice: du hasst
  rationale: Das Verb bedeutet direkt „hassen“. Die scharfe Aussage des Ausgangstextes wird nicht zu „ablehnen“ oder „sich widersetzen“ abgeschwächt.
- source_word: פֹּעֲלֵי אָוֶן
  choice: alle, die Unrecht tun
  rationale: Die Wendung bezeichnet Menschen, die אָוֶן aktiv ausüben. „Die Unrecht tun“ ist gegenwärtiges, verständliches Deutsch und erhält sowohl den tätigen als auch den moralischen Sinn.
theological_decisions:
- issue: Aussage über Gottes Hass
  choice: „du hasst alle, die Unrecht tun“
  alternative: „du lehnst alle ab, die Unrecht tun“ oder „du widersetzt dich allen, die Unrecht tun“
  rationale: שָׂנֵאתָ ist eine ausdrückliche Aussage des Hassens. Die theologische Spannung, dass Gottes Hass hier den Übeltätern selbst gilt, wird bewahrt und nicht erklärend abgeschwächt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Wendung „vor deinen Augen“ und das ungemilderte „du hasst“ bewahren die Bildkraft und Schärfe des Hebräischen; „die Unrecht tun“ vermeidet zugleich unnötig altertümliches Deutsch.
