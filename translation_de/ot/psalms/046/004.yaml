  text: נָהָ֗ר פְּלָגָ֗י/ו יְשַׂמְּח֥וּ עִיר אֱלֹהִ֑ים קְ֝דֹ֗שׁ מִשְׁכְּנֵ֥י עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/004.yaml
  text: A river—its streams make glad the city of God[b][a], the holy dwelling place of the Most High.
translation:
  language: de
  text: Ein Strom[a] – seine Wasserläufe erfreuen die Stadt Gottes, das Heiligtum der Wohnstätten des Höchsten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Es gibt einen Strom, dessen Wasserläufe die Stadt Gottes erfreuen.“ Der hebräische poetische Auftakt enthält kein ausdrückliches Verb.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen der Plural „Wohnstätten“. Gemeint sein können mehrere heilige Wohnbereiche oder der gesamte heilige Bezirk; viele Übersetzungen geben den Sinn mit „Wohnung“ oder „Heiligtum“ wieder.
    reason: alternative_reading
lexical_decisions:
- source_word: נָהָר
  choice: Ein Strom
  rationale: Das Substantiv steht ohne Artikel. „Ein Strom“ gibt die unbestimmte Form und den knappen, verblosen poetischen Auftakt wieder.
- source_word: פְּלָגָיו
  choice: seine Arme
  rationale: Das Wort bezeichnet die Verzweigungen oder Wasserläufe des Stromes; „Arme“ ist im Deutschen eine natürliche Bezeichnung für Flussarme und bewahrt den Rückbezug des Suffixes.
- source_word: יְשַׂמְּחוּ
  choice: erfreuen
  rationale: Die Piel-Form bezeichnet, dass die Arme des Stromes Freude bewirken. „Erfreuen“ gibt diese verursachende Bedeutung knapp und poetisch wieder.
- source_word: עִיר אֱלֹהִים
  choice: die Stadt Gottes
  rationale: Die deutsche Genitivverbindung entspricht der hebräischen Konstruktverbindung und ist zugleich klar und würdevoll.
- source_word: קְדֹשׁ
  choice: die heilige Stätte
  rationale: Das Wort wird als Bezeichnung des heiligen Ortes verstanden, der appositionell auf „die Stadt Gottes“ folgt. Das ergänzte „Stätte“ macht die elliptische hebräische Wendung im Deutschen verständlich.
- source_word: מִשְׁכְּנֵי
  choice: der Wohnungen
  rationale: Die Übersetzung wahrt bewusst den hebräischen Plural, auch wenn im Deutschen häufig glättend ein Singular verwendet wird.
- source_word: עֶלְיוֹן
  choice: des Höchsten
  rationale: „Der Höchste“ ist die geläufige und sachlich genaue Wiedergabe dieses göttlichen Titels.
theological_decisions:
- issue: Soll der Plural מִשְׁכְּנֵי als Singular geglättet werden?
  choice: Den Plural mit „Wohnungen“ bewahren.
  alternative: „Wohnung“ oder „Heiligtum“
  rationale: Der masoretische Text hat eine Pluralform. Ihre Beibehaltung wahrt die Offenheit, ob mehrere heilige Wohnbereiche, der gesamte Tempelbezirk oder ein poetisch intensivierter Plural gemeint ist.
- issue: Wie ist קְדֹשׁ syntaktisch zu verstehen?
  choice: 'Als appositionelle Ortsbezeichnung: „die heilige Stätte“.'
  alternative: 'Adjektivisch auf die Wohnungen bezogen: „die heiligen Wohnungen“'
  rationale: Die gewählte Fassung bildet die Stadt Gottes und die heilige Stätte als parallele Bezeichnungen ab, ohne die hebräische Wendung in eine eigenständige Aussage umzudeuten.
translation_notes:
  register: Moderne, gehobene Psalmenpoesie mit knapper Satzform. Der Gedankenstrich erhält den markanten verblosen Auftakt; ungebräuchliche Archaismen werden vermieden. Die ungewöhnliche Pluralform „Wohnungen“ bleibt aus Quellentreue stehen und wird in einer Fußnote erläutert.
