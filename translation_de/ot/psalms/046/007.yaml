  text: יְהוָ֣ה צְבָא֣וֹת עִמָּ֑/נוּ מִשְׂגָּֽב לָ֝/נוּ אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/007.yaml
  text: Yahweh of Armies is with us; the God of Jacob is a stronghold for us[a]. Selah
translation:
  language: de
  text: Jahwe der Heerscharen ist mit uns; der Gott Jakobs ist uns eine Festung. Sela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch den Titel „HERR“ zu ersetzen.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die traditionelle, im Deutschen weiterhin verständliche Wendung bewahrt die militärische und kosmische Weite des hebräischen Titels.
- source_word: עִמָּנוּ
  choice: ist mit uns
  rationale: Die Formulierung gibt Gottes schützende und solidarische Gegenwart unmittelbar und idiomatisch wieder.
- source_word: מִשְׂגָּב
  choice: sichere Zuflucht
  rationale: Das Substantiv bezeichnet einen erhöhten, uneinnehmbaren Schutzort; „sichere Zuflucht“ vermittelt diese Schutzfunktion natürlich, ohne eine bestimmte Bauform festzulegen.
- source_word: לָנוּ
  choice: uns
  rationale: 'Der Dativ drückt im Deutschen die Beziehung und Begünstigung idiomatisch aus: Gott ist uns eine Zuflucht.'
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: der Gott Jakobs
  rationale: Die Genitivverbindung bewahrt den Bezug auf den Stammvater und die Bundesgeschichte Israels.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und Funktion des Ausdrucks unsicher sind, wird er transliteriert statt deutend übersetzt.
theological_decisions:
- issue: Wiedergabe des Gottestitels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: der HERR der Heerscharen; Jahwe der Heere
  rationale: „Jahwe“ bewahrt den persönlichen Gottesnamen. „Heerscharen“ lässt offen, ob vor allem irdische, himmlische oder kosmische Heere gemeint sind, und vermeidet damit eine unnötige Eingrenzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit psalmtypischer Parallelität. Der Satz bleibt knapp und liturgisch sprechbar; „Sela“ wird als eigenständiger Schlussausdruck beibehalten.
