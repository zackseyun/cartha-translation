  text: Its waters roar and foam; the mountains quake at its swelling[a]. Selah
translation:
  language: de
  text: Seine Wasser brausen und schäumen, die Berge erbeben bei seinem Anschwellen.[a] Sela
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Berge erbeben bei seiner Erhebung/Hoheit“, „bei seinem Stolz“ oder „bei seinem Aufwallen“. Das hebräische Wort kann Erhebung oder Hoheit, Stolz oder Anschwellen bezeichnen; im Zusammenhang mit den aufgewühlten Wassern liegt die konkrete Bedeutung „Anschwellen“ nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶהֱמוּ
  choice: brausen
  rationale: Das Verb המה bezeichnet ein lautes, unruhiges Getöse; „brausen“ gibt Klang und Bewegung auf Deutsch anschaulich wieder.
- source_word: יֶחְמְרוּ
  choice: schäumen
  rationale: Im Zusammenhang mit aufgewühltem Wasser beschreibt חמר wahrscheinlich dessen Schäumen oder turbulente Bewegung; „schäumen“ bildet mit „brausen“ ein natürliches Wortpaar.
- source_word: מֵימָיו
  choice: seine Wasser
  rationale: Das maskuline Suffix der 3. Person Singular wird formal als „seine“ wiedergegeben und verweist im poetischen Zusammenhang auf den Fluss aus Vers 2 bzw. dessen Strom; die Bezugnahme bleibt wie im Hebräischen implizit.
- source_word: יִרְעֲשׁוּ
  choice: erbeben
  rationale: רעשׁ bezeichnet heftiges, erdbebenartiges Erschüttern; „erbeben“ passt besonders zu den Bergen als Subjekt.
- source_word: הָרִים
  choice: die Berge
  rationale: Der bestimmte Artikel des Hebräischen wird beibehalten.
- source_word: בְּגַאֲוָתוֹ
  choice: wenn es anschwillt
  rationale: גאוה kann Erhebung, Stolz oder ein Anschwellen bezeichnen. Im Bild aufgewühlten Wassers ist die physische Deutung wahrscheinlich; die temporale Formulierung gibt die begleitende bzw. auslösende Beziehung idiomatisch wieder.
- source_word: סֶלָה
  choice: Sela
  rationale: Der vermutlich liturgische oder musikalische Ausdruck wird transliteriert, weil seine genaue Bedeutung unsicher ist.
