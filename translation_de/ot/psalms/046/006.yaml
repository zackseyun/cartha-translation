id: PSA.46.6
reference: Psalms 46:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָמ֣וּ ג֭וֹיִם מָ֣טוּ מַמְלָכ֑וֹת נָתַ֥ן בְּ֝/קוֹל֗/וֹ תָּמ֥וּג אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/006.yaml
  text: Nations raged[a], kingdoms tottered; he uttered his voice, the earth melted.
translation:
  language: de
  text: Völker tobten[a], Königreiche wankten; er ließ seine Stimme erschallen, da schmolz die Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Völker waren in Aufruhr.“'
    reason: 'Lexikalische Alternative: הָמוּ kann neben lärmendem Toben allgemein tumultartige Unruhe bezeichnen.'
lexical_decisions:
- source_word: הָמוּ
  choice: tobten
  rationale: Das Verb bezeichnet lärmende Unruhe und heftige Bewegung. „tobten“ bewahrt im Deutschen sowohl den hörbaren Aufruhr als auch die feindselige Erregung.
- source_word: גּוֹיִם
  choice: Völker
  rationale: Gemeint sind politische Völker in Aufruhr. „Völker“ entspricht dem Hebräischen natürlich und steht passend parallel zu „Königreiche“, ohne einen besonderen Juden-Heiden-Gegensatz einzutragen.
- source_word: מָטוּ
  choice: wankten
  rationale: Das Verb bezeichnet Instabilität, Schwanken oder drohenden Sturz. „wankten“ erhält das poetische Bild, ohne bereits einen vollendeten Fall auszudrücken.
- source_word: מַמְלָכוֹת
  choice: Königreiche
  rationale: Dies ist die direkte und im poetisch-politischen Zusammenhang natürliche Wiedergabe.
- source_word: נָתַן בְּקוֹלוֹ
  choice: er ließ seine Stimme erschallen
  rationale: Wörtlich steht „er gab seine Stimme“. Die gewählte deutsche Wendung gibt den kraftvollen Einsatz der göttlichen Stimme idiomatisch und würdevoll wieder, ohne die Aussage auf bloße Lautstärke zu verengen.
- source_word: תָּמוּג
  choice: schmolz
  rationale: Das Verb kann Schmelzen, Sich-Auflösen oder den Verlust von Festigkeit bezeichnen. „schmolz“ bewahrt das starke poetische Bild der vor Gottes Stimme ihre Festigkeit verlierenden Erde.
- source_word: אָרֶץ
  choice: die Erde
  rationale: Der universale Zusammenhang von Völkern und Königreichen spricht hier für „die Erde“ statt für das örtlich begrenztere „das Land“.
theological_decisions:
- issue: Unausgesprochenes Subjekt von נָתַן
  choice: „er“ bezeichnet Gott
  alternative: Den Gottesnamen ausdrücklich einsetzen
  rationale: Das Hebräische hat ein unausgesprochenes maskulines Subjekt. „er“ erhält die knappe Form und lässt den Kontext Gott als Handelnden bestimmen, ohne einen in diesem Vers nicht ausdrücklich stehenden Gottesnamen einzufügen.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die kurzen Hauptsätze erhalten den drängenden Parallelismus; „da“ macht die im Hebräischen knappe Folge natürlich verständlich, ohne eine weitergehende zeitliche oder kausale Deutung festzuschreiben.
