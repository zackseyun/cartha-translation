  source_fidelity: 'Die Wiedergabe folgt dem hebräischen Parallelismus genau: הָמוּ („tobten“), מָטוּ („wankten“), die implizite göttliche Handlung bei נָתַן בְּקוֹלוֹ und das bildhafte תָּמוּג („schmolz“) sind angemessen wiedergegeben. „Die Erde“ ist im psalmischen, universalen Kontext für אָרֶץ gut begründet. Das einleitende „da“ macht die knappe hebräische Folge idiomatisch verständlich, ohne den Sinn unzulässig festzulegen.'
