base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/000.yaml
  text: For the choir director. Of the sons of Korah. According to Alamoth[a]. A song.
translation:
  language: de
  text: Für den Chorleiter. Von den Söhnen Korachs. Nach Alamot[a]. Ein Lied.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „nach Mädchen“, das heißt für Frauenstimmen oder hohe Stimmen; der hebräische Ausdruck „Alamot“ ist wahrscheinlich eine musikalische Anweisung oder der Name einer Melodie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In Psalmüberschriften bezeichnet der Ausdruck gewöhnlich den Leiter der musikalischen Aufführung. „Chorleiter“ ist im heutigen Deutsch klar und dem musikalisch-liturgischen Zusammenhang angemessen.
- source_word: לִבְנֵי קֹרַח
  choice: Von den Söhnen Korachs
  rationale: Die Präposition ל kann hier Zugehörigkeit, Urheberschaft oder Zuweisung ausdrücken. „Von den Söhnen Korachs“ bleibt knapp und lässt diese Zuordnung angemessen offen.
- source_word: עַל
  choice: Nach
  rationale: In musikalischen Überschriften kann עַל eine Melodie, Vortragsweise oder Aufführungsanweisung einleiten. „Nach“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: עֲלָמוֹת
  choice: Alamot
  rationale: Die Bedeutung des vermutlich musikalischen Fachausdrucks ist unsicher. Eine Umschrift vermeidet es, ihn vorschnell als Mädchen-, Frauen- oder hohe Stimmen beziehungsweise als Melodienamen festzulegen.
- source_word: שִׁיר
  choice: Ein Lied
  rationale: Das Substantiv bezeichnet die Gattung des Stücks; „Ein Lied“ ist eine natürliche und genaue deutsche Wiedergabe.
