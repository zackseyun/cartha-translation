  language: en
  yaml_path: translation/ot/psalms/046/008.yaml
  text: Come, see the works of the LORD, who has set desolations in the earth.
translation:
  language: de
  text: Kommt, seht die Werke des HERRN, der auf der Erde Verwüstungen angerichtet hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכוּ חֲזוּ
  choice: Kommt und seht
  rationale: Die beiden Imperative werden als natürliche deutsche Aufforderung wiedergegeben; חזה bezeichnet hier das bewusste Anschauen bzw. Betrachten.
- source_word: מִפְעֲלוֹת
  choice: Taten
  rationale: Das Wort bezeichnet die von Gott vollbrachten Werke; „Taten“ ist im heutigen Deutsch klar und würdevoll.
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen wird beibehalten.
- source_word: שָׂם שַׁמּוֹת
  choice: Verwüstungen … angerichtet hat
  rationale: שׂים bedeutet wörtlich „setzen, machen“; zusammen mit שַׁמּוֹת gibt „angerichtet“ die idiomatische Bedeutung wieder, ohne die Aussage abzuschwächen.
- source_word: בָּאָרֶץ
  choice: auf der Erde
  rationale: Die Präposition und das Substantiv werden räumlich-global wiedergegeben; „im Land“ bleibt grammatisch möglich, ist im Kontext jedoch weniger wahrscheinlich.
theological_decisions:
- issue: Gott als Urheber der Verwüstungen
  choice: der Verwüstungen auf der Erde angerichtet hat
  alternative: der Verwüstungen auf der Erde ein Ende setzt
  rationale: Der masoretische Text enthält שָׂם („setzte/machte“) und nicht eine ausdrückliche Aussage über das Beenden von Verwüstung. Die spannungsreiche Zuschreibung wird daher nicht harmonisierend umgedeutet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Psalmton. Die direkte Aufforderung und die theologisch spannungsreiche Urheberschaft bleiben erhalten.
