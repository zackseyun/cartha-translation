  text: עַל כֵּ֣ן לֹא נִ֭ירָא בְּ/הָמִ֣יר אָ֑רֶץ וּ/בְ/מ֥וֹט הָ֝רִ֗ים בְּ/לֵ֣ב יַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/002.yaml
  text: Therefore we will not fear though the earth changes[b][a], though the mountains slip into the heart of the seas.
translation:
  language: de
  text: Darum fürchten wir uns nicht, auch wenn sich die Erde wandelt[a] und die Berge im Herzen der Meere wanken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auch wenn die Erde verändert wird“. Das hebräische Verb kann ein Verändern oder Austauschen bezeichnen; hier steht es im Bild einer kosmischen Erschütterung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und die Berge im Herzen der Meere schwanken“. Das Hebräische beschreibt die Berge als im Inneren oder inmitten der Meere wankend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung zieht die Folgerung aus dem vorangehenden Bekenntnis zu Gott als Zuflucht und Stärke; „Darum“ ist im Deutschen knapp und natürlich.
- source_word: לֹא נִירָא
  choice: fürchten wir uns nicht
  rationale: Das Imperfekt der 1. Person Plural drückt hier zuversichtliche Entschlossenheit aus. Im Deutschen kann das Präsens diese bleibende Haltung idiomatisch wiedergeben.
- source_word: בְּהָמִיר אָרֶץ
  choice: auch wenn sich die Erde wandelt
  rationale: Die Konstruktion mit ב und Infinitiv bezeichnet den Begleitumstand; מור kann Veränderung oder Austausch bezeichnen. „Sich wandelt“ bewahrt die offene Bildsprache, ohne die Art der kosmischen Veränderung vorschnell festzulegen.
- source_word: וּבְמוֹט הָרִים
  choice: und die Berge ... wanken
  rationale: מוט bezeichnet den Verlust festen Standes, etwa Wanken oder Schwanken. „Wanken“ gibt dies präzise wieder, ohne bereits einen Sturz ausdrücklich zu machen.
- source_word: בְּלֵב יַמִּים
  choice: im Herzen der Meere
  rationale: „Herz“ ist die konkrete Metapher des Hebräischen für das Innere oder die Mitte. Die Präposition ב wird zunächst örtlich mit „im“ wiedergegeben; eine gerichtete Auffassung ist als Alternative vermerkt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Psalmsprache. Die Metapher „im Herzen der Meere“ bleibt erhalten; die zweifache Konstruktion wird mit „auch wenn ... und ...“ flüssig verbunden.
