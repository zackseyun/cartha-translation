  text: אֱלֹהִ֣ים בְּ֭/קִרְבָּ/הּ בַּל תִּמּ֑וֹט יַעְזְרֶ֥/הָ אֱ֝לֹהִ֗ים לִ/פְנ֥וֹת בֹּֽקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/005.yaml
  text: God is within her[a]; she will not be moved[c][b]. God will help her when morning dawns.
translation:
  language: de
  text: Gott ist in ihrer Mitte[a]; sie wird nicht wanken[b]. Gott hilft ihr beim Anbruch des Morgens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ihrem Inneren“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie wird nicht erschüttert werden“ oder „sie wird nicht ins Wanken geraten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „beim Sich-Wenden des Morgens“; gemeint ist der Tagesanbruch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die grammatisch plurale Form bezeichnet in diesem Psalm eindeutig den einen Gott Israels; daher ist der Singular erforderlich.
- source_word: בְּקִרְבָּהּ
  choice: in ihrer Mitte
  rationale: Die Wendung bezeichnet Gottes Gegenwart im Inneren der zuvor genannten Stadt. „In ihrer Mitte“ ist natürlich und bewahrt den femininen Rückbezug.
- source_word: בַּל
  choice: nicht
  rationale: Die poetische Negationspartikel verneint das folgende Verb; „nicht“ gibt sie ohne unnötige Verstärkung wieder.
- source_word: תִּמּוֹט
  choice: wird nicht wanken
  rationale: Das Nifal von מוט beschreibt Erschütterung oder Schwanken. „Wanken“ bewahrt das poetische Bild gefährdeter, aber durch Gott gesicherter Standfestigkeit.
- source_word: יַעְזְרֶהָ
  choice: hilft ihr
  rationale: Das Imperfekt kann hier eine sichere, erwartete Hilfe ausdrücken. Das deutsche Präsens formuliert diese Gewissheit knapp und idiomatisch.
- source_word: לִפְנוֹת בֹּקֶר
  choice: beim Anbruch des Morgens
  rationale: Die Wendung bezeichnet das Sich-Wenden beziehungsweise Hervortreten des Morgens. „Beim Anbruch des Morgens“ ist im Deutschen natürlich und bleibt dem hebräischen Bild nahe.
theological_decisions:
- issue: Bezug der femininen Singularformen
  choice: Die Pronomen beziehen sich auf die Stadt Gottes beziehungsweise Zion im unmittelbaren Kontext.
  alternative: Eine allgemeinere Deutung auf die Gemeinschaft des Gottesvolkes.
  rationale: Grammatik und Kontext weisen unmittelbar auf die zuvor genannte Stadt. Die Übersetzung bewahrt den femininen Rückbezug, statt den Referenten ausdrücklich einzusetzen.
translation_notes:
  register: Moderne, würdevolle Psalmsprache mit klarer Satzstruktur. „Wanken“ erhält das poetische Stabilitätsmotiv; die feminine Form lässt den kontextuellen Bezug auf die Stadt bestehen. Die Fußnoten stehen jeweils unmittelbar nach der betreffenden Wendung.
