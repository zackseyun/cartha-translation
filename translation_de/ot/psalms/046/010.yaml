source:
  edition: WLC
  text: הַרְפּ֣וּ וּ֭/דְעוּ כִּי אָנֹכִ֣י אֱלֹהִ֑ים אָר֥וּם בַּ֝/גּוֹיִ֗ם אָר֥וּם בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/010.yaml
  text: Be still[a], and know that I am God. I will be exalted among the nations[c][b]; I will be exalted in the earth.
translation:
  language: de
  text: Lasst ab[a] und erkennt, dass ich Gott bin. Ich werde unter den Völkern erhaben sein[b]; ich werde auf der Erde erhaben sein[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hört auf“, „Lasst los“ oder „Werdet still“. Das hebräische Verb kann bedeuten, nachzulassen, aufzuhören oder den Griff zu lösen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ich bin unter den Völkern erhaben.“ Die hebräische Verbform kann hier je nach Verständnis gegenwärtig oder zukünftig wiedergegeben werden.'
    reason: alternative_reading
  - marker: c
    text: „Erde“ kann auch „Land“ bedeuten; der weite Horizont des Psalms spricht hier für den weltweiten Sinn.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְפּוּ
  choice: Lasst ab
  rationale: Der Imperativ von רפה kann bedeuten, loszulassen, nachzulassen oder aufzuhören. „Lasst ab“ bewahrt diese Spannweite besser als eine rein beschauliche Aufforderung zur inneren Stille und passt zum Zusammenhang der aufbegehrenden Völker.
- source_word: וּדְעוּ
  choice: und erkennt
  rationale: ידע bezeichnet hier nicht nur sachliches Wissen, sondern das Erkennen beziehungsweise Anerkennen dessen, wer Gott ist. „Erkennt“ ist im Deutschen direkt und kontextgemäß.
- source_word: כִּי אָנֹכִי אֱלֹהִים
  choice: dass ich Gott bin
  rationale: כִּי leitet den Inhalt des Erkennens ein. Das betonte אָנֹכִי wird durch das ausdrücklich gesetzte „ich“ wiedergegeben, ohne einen nicht vorhandenen Verstärker hinzuzufügen.
- source_word: אָרוּם
  choice: ich werde … erhaben sein
  rationale: Das Qal-Imperfekt von רום bezeichnet Gottes hohes, überlegenes Dasein und kann hier als sichere zukünftige Geltung verstanden werden. „Erhaben sein“ hält die Aussage näher am intransitiven Hebräisch als ein deutsches Passiv wie „erhöht werden“.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: גּוֹיִם bezeichnet hier die Völker als politische und menschliche Gemeinschaften. „Unter den Völkern“ gibt die weltweite Reichweite natürlich wieder.
- source_word: בָּאָרֶץ
  choice: auf der Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der Parallelismus mit den Völkern und der umfassende Horizont des Psalms sprechen hier für „Erde“; bei einer Fläche ist „auf der Erde“ im heutigen Deutsch natürlicher als „in der Erde“.
theological_decisions:
- issue: Bedeutungsumfang des Imperativs הַרְפּוּ
  choice: Eine Aufforderung, vom eigenen Kämpfen und Aufbegehren abzulassen, ohne die mögliche Bedeutung von Stillwerden auszuschließen
  alternative: Eine ausschließlich innerliche Aufforderung zu stiller Andacht oder ein ausschließlich militärischer Befehl, den Kampf einzustellen
  rationale: Das Verb selbst umfasst Loslassen, Nachlassen und Aufhören. Im Kontext von Krieg, Völkerunruhe und Gottes Herrschaft sollte die Übersetzung weder auf private Meditation noch allein auf militärische Feindseligkeit verengt werden.
- issue: Zeitbezug und Aussageweise von אָרוּם
  choice: 'Sichere zukünftige Geltung: „Ich werde … erhaben sein“'
  alternative: 'Gegenwärtige Aussage: „Ich bin … erhaben“; oder passivisch: „Ich werde erhöht werden“'
  rationale: Die Imperfektform kann gegenwärtig-allgemein oder zukünftig verstanden werden. Der Zukunftssinn bringt die Gewissheit von Gottes weltweiter Erhabenheit im Kontext gut zum Ausdruck, während die Fußnote die genuine zeitliche Offenheit bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. „Lasst ab“ ist bewusst etwas gehoben, aber allgemein verständlich und bewahrt den weiteren Sinn des hebräischen Imperativs. Die Wiederholung von „erhaben sein“ bildet den hebräischen Parallelismus nach.
