  text: מַשְׁבִּ֥ית מִלְחָמוֹת֮ עַד קְצֵ֪ה הָ֫/אָ֥רֶץ קֶ֣שֶׁת יְ֭שַׁבֵּר וְ/קִצֵּ֣ץ חֲנִ֑ית עֲ֝גָל֗וֹת יִשְׂרֹ֥ף בָּ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/009.yaml
  text: He makes wars cease to the end of the earth[a]; he breaks the bow and cuts the spear in two[b]; he burns the wagons with fire.
translation:
  language: de
  text: Er beendet die Kriege bis an die Enden der Erde. Den Bogen zerbricht er, den Speer zerhaut er; die Wagen[a] verbrennt er im Feuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Streitwagen“. Das hebräische Wort bedeutet gewöhnlich „Wagen“ oder „Karren“; wegen des militärischen Zusammenhangs wird es auch als „Streitwagen“ verstanden.'
    reason: lexikalische und kontextuelle Alternative
lexical_decisions:
- source_word: מַשְׁבִּית מִלְחָמוֹת
  choice: lässt Kriege aufhören
  rationale: Das Hifil-Partizip von שׁבת bezeichnet das Verursachen eines Aufhörens. Die Formulierung bewahrt diese kausative Bedeutung und klingt zugleich in modernem Deutsch natürlich.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: bis ans Ende der Erde
  rationale: Die Wiedergabe folgt der singularischen hebräischen Wendung eng und bezeichnet die äußerste räumliche Ausdehnung.
- source_word: קֶשֶׁת יְשַׁבֵּר
  choice: Den Bogen zerbricht er
  rationale: Der Singular steht repräsentativ für diese Waffengattung; die Voranstellung erhält den poetischen Parallelismus.
- source_word: וְקִצֵּץ חֲנִית
  choice: den Speer haut er entzwei
  rationale: קצץ bezeichnet ein Ab- oder Zerschneiden. „Entzwei hauen“ gibt die gewaltsame Zerstörung eines Speers anschaulich und idiomatisch wieder, ohne die Handlung bloß als allgemeines Zerbrechen auszudrücken.
- source_word: עֲגָלוֹת
  choice: die Wagen
  rationale: Das hebräische Wort bezeichnet gewöhnlich Wagen oder Karren und ist nicht das übliche Wort für Streitwagen. Der militärische Zusammenhang wird nicht zum Anlass genommen, die allgemeinere lexikalische Bedeutung im Haupttext einzuengen.
- source_word: יִשְׂרֹף בָּאֵשׁ
  choice: verbrennt er mit Feuer
  rationale: Die Formulierung gibt sowohl das Verb als auch die ausdrücklich genannte instrumentale Feuerangabe wieder und bewahrt das konkrete Bild.
theological_decisions:
- issue: Deutung von עֲגָלוֹת im militärischen Zusammenhang
  choice: Wagen
  alternative: Streitwagen
  rationale: Obwohl der Kriegskontext eine militärische Deutung nahelegt und traditionelle Übersetzungen häufig „Streitwagen“ wählen, ist עֲגָלוֹת nicht der gewöhnliche hebräische Ausdruck dafür. Daher steht die breitere Grundbedeutung im Haupttext; die kontextuell mögliche engere Deutung wird in einer Fußnote bewahrt.
translation_notes:
  register: Dichterisches, würdevolles Standarddeutsch mit klaren, geläufigen Verben. Die Voranstellung von „Den Bogen“ und „den Speer“ bildet den hebräischen Parallelismus ab; das Semikolon gliedert die drei Bilder der Entwaffnung.
