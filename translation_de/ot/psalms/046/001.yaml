  text: אֱלֹהִ֣ים לָ֭/נוּ מַחֲסֶ֣ה וָ/עֹ֑ז עֶזְרָ֥ה בְ֝/צָר֗וֹת נִמְצָ֥א מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/001.yaml
  text: God is our refuge and strength[b][a], a very present help in troubles.
translation:
  language: de
  text: Gott ist uns Zuflucht und Stärke; als Hilfe in Nöten hat er sich überaus bewährt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Hilfe in Nöten, überaus gefunden.“ Die Formulierung kann idiomatisch besagen, dass Gott sich in Bedrängnissen in besonderem Maß als Hilfe erweist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die formal plurale Form bezeichnet hier mit singularischem Sinn den Gott Israels; im Deutschen ist „Gott“ die sachgemäße Wiedergabe.
- source_word: לָנוּ
  choice: uns
  rationale: Die Präposition mit Suffix bedeutet wörtlich „für uns/uns“; „Gott ist uns Zuflucht“ bewahrt diese prädikative Konstruktion natürlich und würdevoll.
- source_word: מַחֲסֶה
  choice: Zuflucht
  rationale: „Zuflucht“ gibt den Schutzort knapp wieder und entspricht dem vertrauten, weiterhin gut verständlichen poetischen Sprachgebrauch.
- source_word: וָעֹז
  choice: und Stärke
  rationale: עֹז bezeichnet Stärke oder Macht; „Stärke“ wahrt die abstrakte Nominalform und bildet mit „Zuflucht“ ein natürliches Paar.
- source_word: עֶזְרָה
  choice: als Hilfe
  rationale: Das Substantiv bezeichnet Hilfe oder Beistand. „Als Hilfe“ verbindet die komprimierte hebräische Nominalfolge im Deutschen verständlich mit dem folgenden Verb.
- source_word: בְצָרוֹת
  choice: in Nöten
  rationale: Der Plural bezeichnet Bedrängnisse oder Notlagen. „In Nöten“ erhält den Plural und passt zum gehobenen, aber allgemein verständlichen Psalmregister.
- source_word: נִמְצָא
  choice: hat er sich bewährt
  rationale: Der Niphal von מצא kann wörtlich „wurde gefunden“ und idiomatisch „erwies/bewährte sich“ bedeuten. Die reflexive deutsche Form vermittelt, dass Gott in Not als Hilfe erfahren wird, ohne bloße räumliche Anwesenheit einzutragen.
- source_word: מְאֹד
  choice: überaus
  rationale: Das Adverb verstärkt die Aussage deutlich. „Überaus“ bewahrt die starke Intensivierung in natürlicher poetischer Sprache.
theological_decisions:
- issue: Prädikatsstruktur und Bedeutung des Schlussglieds
  choice: „als Hilfe in Nöten hat er sich überaus bewährt“
  alternative: „eine überaus gegenwärtige Hilfe in Nöten“ / „als Hilfe in Nöten wurde er überaus gefunden“
  rationale: Das Hebräische ist komprimiert und lautet näher am Wortlaut „Hilfe in Nöten, überaus gefunden“. „Gegenwärtig“ deutet נִמְצָא idiomatisch, ist aber keine direkte Entsprechung. „Hat er sich bewährt“ gibt den Erfahrungscharakter natürlich wieder; die Fußnote bewahrt den ungewöhnlichen Wortlaut und seine Offenheit.
translation_notes:
  register: Moderne, würdevolle Psalmsprache. „Zuflucht“, „Stärke“ und „Nöte“ sind allgemein verständlich; die idiomatische Schlusswendung vermeidet sowohl unnatürliches Deutsch als auch eine vorschnelle Verengung auf bloße Gegenwärtigkeit.
