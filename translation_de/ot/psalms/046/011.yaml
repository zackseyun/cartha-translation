id: PSA.46.11
reference: Psalms 46:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָ֣ה צְבָא֣וֹת עִמָּ֑/נוּ מִשְׂגָּֽב לָ֝/נוּ אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/011.yaml
  text: Yahweh of Armies is with us[a]; the God of Jacob is a stronghold for us[c][b]. Selah
translation:
  language: de
  text: Jahwe der Heerscharen ist mit uns; der Gott Jakobs ist uns eine sichere Festung.[a] Sela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Zuflucht« beziehungsweise »eine Höhenburg«. Das hebräische Wort bezeichnet einen sicheren, erhöhten Ort des Schutzes.'
    reason: lexical_alternative
  - marker: b
    text: »Sela« ist ein hebräischer liturgischer oder musikalischer Ausdruck, dessen genaue Bedeutung ungewiss ist.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch den traditionellen Titel »der HERR« ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die traditionelle, im Deutschen weiterhin verständliche Wendung bewahrt die militärische und möglicherweise himmlische Weite des hebräischen Ausdrucks.
- source_word: עִמָּנוּ
  choice: ist mit uns
  rationale: Die Präposition mit dem Suffix der 1. Person Plural bedeutet natürlich »mit uns«; in der deutschen Nominalklausel wird »ist« ergänzt.
- source_word: מִשְׂגָּב
  choice: eine sichere Festung
  rationale: Das Wort bezeichnet einen erhöhten, geschützten Zufluchtsort beziehungsweise eine befestigte Höhe; »sichere Festung« macht Schutz und Wehrhaftigkeit verständlich.
- source_word: לָנוּ
  choice: uns
  rationale: 'Der Dativ gibt hier die Bedeutung des Vorteils wieder: Gott ist für uns eine sichere Festung.'
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: der Gott Jakobs
  rationale: Die deutsche Genitivkonstruktion bewahrt die Bundesidentifikation und klingt natürlich und würdig.
- source_word: סֶלָה
  choice: Sela
  rationale: Da die genaue liturgische oder musikalische Funktion ungewiss ist, wird der hebräische Ausdruck transliteriert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: der HERR der Heerscharen; Jahwe der Heere
  rationale: »Jahwe« bewahrt den persönlichen Gottesnamen. »Heerscharen« lässt offen, ob irdische oder himmlische Streitkräfte beziehungsweise die Gesamtheit der himmlischen Mächte gemeint sind.
- issue: Bildgehalt von מִשְׂגָּב
  choice: eine sichere Festung
  alternative: eine Zuflucht; eine Höhenburg
  rationale: Die Übersetzung erhält das Bild eines befestigten, erhöhten Schutzortes, ohne es auf einen bloß allgemeinen Zufluchtsbegriff zu reduzieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau bleibt erhalten; geläufige bibelsprachliche Begriffe werden nur dort verwendet, wo sie noch verständlich sind und die Mehrdeutigkeit des Hebräischen bewahren.
