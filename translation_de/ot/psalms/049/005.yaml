source:
  edition: WLC
  text: לָ֣/מָּה אִ֭ירָא בִּ֣/ימֵי רָ֑ע עֲוֺ֖ן עֲקֵבַ֣/י יְסוּבֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/005.yaml
  text: Why should I fear in days of evil[a], when the iniquity of my pursuers surrounds me?
translation:
  language: de
  text: Warum sollte ich mich fürchten in bösen Tagen, wenn die Schuld derer, die mir nachstellen[a], mich umgibt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: »wenn die Schuld meiner Fersen mich umgibt«. Die schwierige hebräische Wendung kann die Schuld meinen, die dem Beter auf den Fersen ist, seine eigene Schuld oder die Schuld von Menschen, die ihn verfolgen beziehungsweise zu Fall bringen wollen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה אִירָא
  choice: Warum sollte ich mich fürchten
  rationale: Die rhetorische Frage und der hebräische Imperfekt werden in natürlichem, gehobenem Deutsch idiomatisch wiedergegeben.
- source_word: בִּימֵי רָע
  choice: in bösen Tagen
  rationale: Bewahrt die breite Bedeutung von רָע zwischen moralischem Übel und Zeiten des Unheils, ohne sie vorschnell auf „Not“ einzuengen.
- source_word: עֲוֹן
  choice: Schuld
  rationale: עָוֹן kann Vergehen, Schuld oder deren Folge bezeichnen. „Schuld“ wahrt das moralische Gewicht und klingt im Deutschen in dieser Konstruktion natürlich.
- source_word: עֲקֵבַי
  choice: derer, die mir nachstellen
  rationale: Das wörtliche „meine Fersen“ ist im Deutschen unverständlich. Die Wendung kann Menschen bezeichnen, die dem Sprecher auf den Fersen sind oder ihn zu Fall bringen wollen; „mir nachstellen“ gibt diesen feindlichen Sinn wieder, ohne die Bilddeutung zu eng festzulegen.
- source_word: יְסוּבֵּנִי
  choice: mich umgibt
  rationale: Entspricht dem Qal-Imperfekt von סבב mit Objektsuffix; der Singular richtet sich nach „Schuld“.
theological_decisions:
- issue: Deutung von עֲוֹן עֲקֵבַי
  choice: Die Schuld feindlicher Menschen, die dem Beter nachstellen
  alternative: die Schuld an meinen Fersen; meine eigene Schuld, die mir auf den Fersen folgt; die Schuld derer, die mich zu Fall bringen
  rationale: Der Zusammenhang spricht für eine Bedrohung durch Gegner, doch die knappe hebräische Formulierung bleibt mehrdeutig. Der Haupttext bietet eine verständliche kontextuelle Wiedergabe; die Fußnote bewahrt die anderen ernsthaften Möglichkeiten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem poetischem Register. Die schwierige Wendung wird im Haupttext maßvoll erschlossen und ihre echte Mehrdeutigkeit in der Fußnote erhalten.
