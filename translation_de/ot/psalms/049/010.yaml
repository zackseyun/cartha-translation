id: PSA.49.10
reference: Psalms 49:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י יִרְאֶ֨ה חֲכָ֘מִ֤ים יָמ֗וּתוּ יַ֤חַד כְּסִ֣יל וָ/בַ֣עַר יֹאבֵ֑דוּ וְ/עָזְב֖וּ לַ/אֲחֵרִ֣ים חֵילָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/010.yaml
  text: For he sees that wise men die[a]; together the fool and the brutish man perish[c][b], and they leave their wealth to others.
translation:
  language: de
  text: Denn er sieht, dass die Weisen[a] sterben; Narr und Unvernünftiger[b] gehen gemeinsam zugrunde und hinterlassen anderen ihr Vermögen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch steht eine maskuline Pluralform für den repräsentativen Menschentyp; gemeint sein können die Weisen allgemein.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist ein verständnisloser, stumpfer oder geradezu tierhaft handelnder Mensch.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ihren Reichtum“ beziehungsweise „ihren Besitz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung des vorausgehenden Gedankens ein und bewahrt den Zusammenhang natürlich.
- source_word: יִרְאֶה
  choice: er sieht
  rationale: Das Qal Imperfekt in der 3. Person Singular bezeichnet hier eine allgemeine, wiederkehrende Wahrnehmung; das Präsens gibt diesen gnomischen Sinn wieder.
- source_word: חֲכָמִים
  choice: die Weisen
  rationale: Das substantivierte maskuline Pluraladjektiv bezeichnet die Klasse weiser Menschen. „Die Weisen“ ist im Deutschen idiomatischer als „weise Männer“, ohne die grammatische Form zu verschleiern.
- source_word: יָמוּתוּ
  choice: sterben
  rationale: Gibt die schlichte Aussage über den Tod als allgemein erkennbare Wirklichkeit wieder.
- source_word: יַחַד
  choice: gemeinsam
  rationale: Betont das gleiche Schicksal der beiden anschließend genannten Menschentypen; die Stellung im deutschen Satz bleibt natürlich.
- source_word: כְּסִיל
  choice: Narr
  rationale: Ein geläufiger Weisheitsbegriff für einen moralisch wie verstandesmäßig törichten Menschen; „Narr“ wahrt die prägnante Typenbezeichnung.
- source_word: בַעַר
  choice: Unvernünftiger
  rationale: Bezeichnet einen verständnislosen, stumpfen, beinahe tierhaft handelnden Menschen. „Unvernünftiger“ ist verständlich und weniger altertümlich als „viehischer Mensch“.
- source_word: יֹאבֵדוּ
  choice: gehen zugrunde
  rationale: אבד drückt hier mehr als das bloße Sterben aus und bezeichnet Untergang beziehungsweise Verschwinden.
- source_word: וְעָזְבוּ
  choice: und hinterlassen
  rationale: Im Zusammenhang mit Besitz bedeutet עזב, etwas beim Tod für andere zurückzulassen; „hinterlassen“ ist dafür die natürliche deutsche Wendung.
- source_word: לַאֲחֵרִים
  choice: anderen
  rationale: Gibt den unbestimmten Plural ohne die stärkere, nicht zwingende Bedeutung „Fremden“ wieder.
- source_word: חֵילָם
  choice: ihr Vermögen
  rationale: חֵיל bezeichnet hier Besitz, Reichtum oder materielle Mittel. „Vermögen“ passt zum Gedanken des Hinterlassens und bewahrt die begriffliche Breite.
theological_decisions:
- issue: Geschlecht und repräsentative Menschentypen bei חֲכָמִים, כְּסִיל und בַעַר
  choice: die Weisen … Narr und Unvernünftiger
  alternative: weise Menschen … törichte und unvernünftige Menschen
  rationale: Die hebräischen Formen sind grammatisch maskulin und stellen repräsentative Menschentypen dar. Die deutsche Fassung erhält diese Form, ohne den Aussagebereich ausdrücklich auf Männer zu beschränken.
- issue: Bezug von יַחַד
  choice: „gemeinsam“ bezieht sich unmittelbar auf Narr und Unvernünftigen
  alternative: „alle gleichermaßen“ als Zusammenfassung auch der Weisen
  rationale: Die Wortstellung verbindet יַחַד eng mit den beiden folgenden Typen, während der Gesamtvers dennoch den gemeinsamen Tod aller Gruppen erkennen lässt. Die Übersetzung vermeidet eine weitergehende syntaktische Festlegung.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper weisheitlicher Parallelstruktur. „Narr“ bewahrt den traditionellen Weisheitston; „Unvernünftiger“ vermeidet ein heute unnötig grobes oder altertümliches Wort. Die Zeichensetzung macht die erklärende Wahrnehmung und die beiden parallelen Todesaussagen klar.
