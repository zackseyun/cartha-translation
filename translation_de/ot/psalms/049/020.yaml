  text: אָדָ֣ם בִּ֭/יקָר וְ/לֹ֣א יָבִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/020.yaml
  text: Man in honor[a], yet without understanding, is like the beasts that perish.
translation:
  language: de
  text: Ein Mensch, der Ansehen genießt, aber keine Einsicht hat, gleicht den Tieren, die vergehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Mensch, der Ansehen genießt, aber keine Einsicht hat, gleicht den Tieren; sie gleichen ihm.“ Das letzte hebräische Verb kann möglicherweise im Sinn von „gleichen“ statt „vergehen“ verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: ein Mensch
  rationale: Der Singular wird hier allgemein und sprichwörtlich gebraucht. „Ein Mensch“ gibt diese generische Bedeutung im modernen Deutschen natürlich wieder.
- source_word: בִּיקָר
  choice: der Ansehen genießt
  rationale: Das Wort bezeichnet Würde, Ehre oder hohen Rang. Die Wendung stellt verständlich den gesellschaftlichen Wert des Menschen seiner fehlenden Einsicht gegenüber.
- source_word: וְלֹא יָבִין
  choice: aber keine Einsicht hat
  rationale: בין bezeichnet Verstehen oder Unterscheidungsvermögen. „Aber“ bringt den im Zusammenhang naheliegenden Gegensatz zu seinem Ansehen zum Ausdruck.
- source_word: נִמְשַׁל
  choice: gleicht
  rationale: Der Nifal von משל bedeutet hier, jemandem oder etwas gleichgestellt beziehungsweise verglichen zu werden. „Gleicht“ ist knapp, natürlich und poetisch.
- source_word: כַּבְּהֵמוֹת
  choice: den Tieren
  rationale: בְּהֵמוֹת bezeichnet hier allgemein Tiere und nicht nur Vieh. „Tiere“ ist im heutigen Standarddeutsch klarer und natürlicher als „das Vieh“ oder „die Bestien“.
- source_word: נִדְמוּ
  choice: die vergehen
  rationale: Im Zusammenhang des Psalms wird die Form am plausibelsten auf das Zugrundegehen beziehungsweise Sterben bezogen. Die mögliche Deutung als Ausdruck des Gleichseins wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung des abschließenden Verbs נִדְמוּ
  choice: als „vergehen“ verstanden und auf die Tiere bezogen
  alternative: „Er gleicht den Tieren; sie sind einander gleich“ beziehungsweise eine Deutung im Sinn von „gleichen“
  rationale: Der gesamte Psalm betont, dass menschliches Ansehen den Tod nicht verhindert; daher ergibt die Sterblichkeitsdeutung einen stimmigen Abschluss. Da Form und Wurzel auch eine Deutung im Sinn des Gleichens zulassen, wird diese Möglichkeit nicht verschwiegen, sondern in einer Fußnote festgehalten.
translation_notes:
  register: Moderne, verständliche und zugleich würdige poetische Sprache. „Ansehen genießt“ vermeidet das im Deutschen weniger natürliche „in Ehre ist“, während „gleicht“ die knappe Spruchform bewahrt.
