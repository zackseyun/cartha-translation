  language: en
  yaml_path: translation/ot/psalms/049/013.yaml
  text: This is their way—their folly[a]; yet after them, people approve their words[b]. Selah
translation:
  language: de
  text: 'Dies ist ihr Weg: ihre Torheit[a]; und die nach ihnen kommen, finden Gefallen an ihren Worten[b]. Sela'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dies ist ihr Weg – Torheit für sie.“'
    reason: Die knappe hebräische Formulierung lässt verschiedene syntaktische Zuordnungen zu.
  - marker: b
    text: 'Wörtlich: „an/in ihrem Mund“. Der Ausdruck kann auch bedeuten, dass die nach ihnen Kommenden Gefallen an dem finden, was sie selbst sagen.'
    reason: Das Hebräische ist beim Bezug der Fürwörter und bei der Zuordnung von „Mund“ mehrdeutig.
lexical_decisions:
- source_word: זֶה דַרְכָּם
  choice: So ist ihr Weg
  rationale: Die Wendung fasst den zuvor beschriebenen Lebenswandel wertend zusammen. „Weg“ bewahrt sowohl das Bild als auch den ethischen Sinn.
- source_word: כֵּסֶל לָמוֹ
  choice: Torheit ist ihr Teil
  rationale: כֶּסֶל bezeichnet hier am ehesten Torheit; לָמוֹ wird als Zugehörigkeits- bzw. Zuordnungsangabe wiedergegeben. Die Formulierung wahrt die knappe, mehrdeutige Satzstruktur besser als eine eindeutige Gleichsetzung des Weges mit Torheit.
- source_word: וְאַחֲרֵיהֶם
  choice: und die nach ihnen kommen
  rationale: Die Formulierung kann allgemein spätere Nachfolger oder enger Nachkommen bezeichnen. Die gewählte Wiedergabe lässt diese Bezugsspanne offen.
- source_word: בְּפִיהֶם
  choice: an ihren Worten
  rationale: Wörtlich steht „an/in ihrem Mund“. „An ihren Worten“ gibt die metonymische Bedeutung im Deutschen natürlich wieder; die wörtliche Bildsprache wird in einer Fußnote genannt.
- source_word: יִרְצוּ
  choice: finden Gefallen
  rationale: רצה im Qal kann Wohlgefallen, Gefallen oder Zustimmung ausdrücken. „Gefallen finden“ bewahrt den affektiven Sinn, ohne ihn auf bloße intellektuelle Billigung zu verengen.
- source_word: סֶלָה
  choice: Sela
  rationale: Die traditionelle Umschrift bleibt stehen, da Funktion und genaue Bedeutung des vermutlich musikalisch-liturgischen Zeichens unsicher sind.
theological_decisions:
- issue: Bezug von וְאַחֲרֵיהֶם
  choice: die nach ihnen kommen
  alternative: ihre Nachkommen
  rationale: Der hebräische Ausdruck kann sowohl zeitlich nachfolgende Menschen als auch Nachkommen meinen. Die offene Formulierung vermeidet eine unbegründete Festlegung.
- issue: Syntaktische Zuordnung von בְּפִיהֶם
  choice: Spätere Menschen finden Gefallen an den Worten der zuvor Beschriebenen
  alternative: Ihre Nachkommen haben Gefallen an ihrem eigenen Mund beziehungsweise an dem, was sie selbst sagen
  rationale: Pronomenbezug und knappe Syntax lassen mehr als eine Deutung zu. Die Hauptfassung folgt der naheliegenden Fortführung der Kritik, während die alternative Zuordnung in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Kürze wird gewahrt; ungewöhnliche hebräische Verdichtung und echter Deutungsspielraum werden durch zwei knappe Fußnoten kenntlich gemacht.
