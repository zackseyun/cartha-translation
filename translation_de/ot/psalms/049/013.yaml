  naturalness: '„Dies ist ihr Weg: ihre Torheit“ ist als bewusst knappe poetische Apposition im modernen, würdevollen Deutsch verständlich. „Die nach ihnen kommen, finden Gefallen an ihren Worten“ ist natürlich und wahrt den offenen Bezug von „nach ihnen“.'
