source:
  edition: WLC
  text: קִרְבָּ֤/ם בָּתֵּ֨י/מוֹ לְֽ/עוֹלָ֗ם מִ֭שְׁכְּנֹתָ/ם לְ/דֹ֣ר וָ/דֹ֑ר קָֽרְא֥וּ בִ֝/שְׁמוֹתָ֗/ם עֲלֵ֣י אֲדָמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/011.yaml
  text: Their inward thought is that their houses will last forever[a], their dwelling places from generation to generation[b]; they have called lands by their own names.
translation:
  language: de
  text: 'In ihrem Innern meinen sie: Ihre Häuser bleiben für immer[a], ihre Wohnungen von Generation zu Generation; sie haben Ländereien nach ihren eigenen Namen benannt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einem anderen Textverständnis: »Ihre Gräber sind für immer ihre Häuser, ihre Wohnungen von Generation zu Generation.«'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: »Sie riefen ihre Namen über Ländereien aus.« Gemeint ist vermutlich, dass sie Ländereien oder Besitzungen nach sich selbst benannten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבָּם
  choice: In ihrem Innern denken sie
  rationale: Die masoretische Vokalisierung weist auf קֶרֶב, »Inneres/Mitte«. Da der hebräische Satz kein ausdrückliches Verb für das Denken enthält, macht diese Wiedergabe den gemeinten inneren Gedanken im Deutschen verständlich, ohne die alternative Lesart »Gräber« in den Haupttext zu übernehmen.
- source_word: בָּתֵּימוֹ
  choice: ihre Häuser
  rationale: בית bezeichnet hier passend zum Parallelwort »Wohnungen« die Häuser bzw. den bleibenden Besitz der Reichen.
- source_word: לְעוֹלָם
  choice: bleiben für immer
  rationale: Das Hebräische ist nominal formuliert; »bleiben« ergänzt im Deutschen natürlich die von ihnen erwartete Dauerhaftigkeit.
- source_word: מִשְׁכְּנֹתָם
  choice: ihre Wohnungen
  rationale: Die allgemeine Bedeutung »Wohnstätten« wird in modernem, verständlichem Deutsch mit »Wohnungen« wiedergegeben und wahrt den Parallelismus zu »Häuser«.
- source_word: לְדֹר וָדֹר
  choice: von Generation zu Generation
  rationale: Dies ist die geläufige deutsche Entsprechung der hebräischen Wendung für eine durch aufeinanderfolgende Generationen fortdauernde Zeit.
- source_word: קָרְאוּ בִשְׁמוֹתָם
  choice: sie haben … nach ihren eigenen Namen benannt
  rationale: קרא bedeutet hier »nennen/benennen«; die deutsche Formulierung macht deutlich, dass die Grundstücke ihre Namen tragen.
- source_word: עֲלֵי אֲדָמוֹת
  choice: Ländereien
  rationale: Der Ausdruck bezeichnet hier Landbesitz oder Grundflächen. »Ländereien« ist idiomatisch und passt zum Zusammenhang von Besitz und vermeintlicher Dauer.
theological_decisions: []
