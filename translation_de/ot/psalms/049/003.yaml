  yaml_path: translation/ot/psalms/049/003.yaml
  text: My mouth will speak wisdom[a], and the meditation of my heart will be understanding.
translation:
  language: de
  text: Mein Mund wird Weisheit aussprechen, und das Sinnen meines Herzens ist Einsicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Wörter für „Weisheit“ und „Einsicht“ stehen im Plural, sind hier aber wahrscheinlich als abstrakte Begriffe gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: mein Mund
  rationale: Bewahrt das hebräische Körperbild für das Sprechen und klingt im Deutschen natürlich.
- source_word: יְדַבֵּר
  choice: wird … aussprechen
  rationale: Das Imperfekt bezeichnet hier passend die erklärte Absicht des Psalmisten; „aussprechen“ lässt sich im Deutschen natürlich mit „Weisheit“ verbinden.
- source_word: חָכְמוֹת
  choice: Weisheit
  rationale: Die formal plurale Form dient wahrscheinlich als Abstraktplural; der deutsche Singular gibt den Sinn idiomatisch wieder.
- source_word: הָגוּת
  choice: das Sinnen
  rationale: Bezeichnet inneres Nachdenken oder erwägendes Meditieren und wahrt den Parallelismus zwischen Mund und Herz.
- source_word: לִבִּי
  choice: meines Herzens
  rationale: Gibt die Genitivbeziehung direkt wieder und bewahrt das Herz als Sitz des inneren Denkens.
- source_word: תְבוּנוֹת
  choice: Einsicht
  rationale: Auch diese formal plurale Form ist wahrscheinlich abstrakt gebraucht; „Einsicht“ ist eine natürliche deutsche Entsprechung und passt zur Weisheitssprache.
