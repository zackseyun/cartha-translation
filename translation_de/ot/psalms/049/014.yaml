base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/014.yaml
  text: Like sheep they are appointed for Sheol[a]; death will shepherd them, and the upright will rule over them in the morning. Their form will waste away in Sheol[d][c][b], far from its lofty dwelling.
translation:
  language: de
  text: Wie Schafe sind sie dem Totenreich bestimmt; der Tod wird sie weiden. Am Morgen werden die Aufrichtigen über sie herrschen. Ihre Gestalt wird im Totenreich vergehen,[a] fern von seiner erhabenen Wohnstätte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck ist schwierig. Statt „ihre Gestalt“ kann man auch „ihr Fels“ oder „ihre Stärke“ verstehen.
    reason: lexical_alternative
  - marker: b
    text: 'Auch der Schluss des Verses ist im Hebräischen schwer verständlich. Möglich ist etwa: „Das Totenreich wird sie verzehren, fern von seiner erhabenen Wohnstätte.“'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּצֹּאן
  choice: Wie Schafe
  rationale: Die kollektive Bezeichnung צֹאן meint Kleinvieh, hier im Bild einer hilflosen Herde; „wie Schafe“ ist im Deutschen natürlich und prägnant.
- source_word: לִשְׁאוֹל שַׁתּוּ
  choice: sind sie dem Totenreich bestimmt
  rationale: שַׁתּוּ bezeichnet das Setzen oder Platzieren, und ל markiert hier Ziel beziehungsweise Bestimmung. Die Formulierung gibt die verhängte Bestimmung wieder, ohne mehr als der Kontext auszusagen.
- source_word: שְׁאוֹל
  choice: Totenreich
  rationale: „Totenreich“ wahrt den weiteren Sinn von שְׁאוֹל und verengt ihn nicht auf ein einzelnes Grab. Zugleich ist es für heutige deutschsprachige Leser unmittelbar verständlich.
- source_word: מָוֶת יִרְעֵם
  choice: der Tod wird sie weiden
  rationale: רעה bedeutet hüten oder weiden. „Weiden“ hält das Schafbild und die bittere Personifikation des Todes als Hirten fest.
- source_word: וַיִּרְדּוּ בָם יְשָׁרִים
  choice: werden die Aufrichtigen über sie herrschen
  rationale: Die Verbform wird im Zusammenhang am plausibelsten von רדה/רדד im Sinn von herrschen verstanden. יְשָׁרִים bezeichnet die Aufrichtigen, nicht ausdrücklich die mit einem anderen hebräischen Wort bezeichneten „Gerechten“.
- source_word: לַבֹּקֶר
  choice: Am Morgen
  rationale: Die knappe Zeitangabe bleibt erhalten; ihre mögliche symbolische oder eschatologische Bedeutung wird nicht festgelegt.
- source_word: וְצוּרָם
  choice: Ihre Gestalt
  rationale: Der schwierige Ausdruck wird kontextbezogen als „ihre Gestalt“ verstanden, passend zum folgenden Vergehen. Die mögliche Herleitung als „Fels/Stärke“ wird wegen der textlichen Unsicherheit in der Fußnote genannt.
- source_word: לְבַלּוֹת
  choice: wird … vergehen
  rationale: בלה bezeichnet Abnutzen, Verfallen oder Vergehen. Die finite deutsche Form ergibt einen natürlichen Satz und bewahrt den Gedanken des Zerfalls.
- source_word: מִזְּבֻל לוֹ
  choice: fern von ihrer erhabenen Wohnstätte
  rationale: זְבֻל kann eine hohe oder erhabene Wohnstätte bezeichnen. Die schwierige Syntax wird als räumlicher Gegensatz zum Totenreich wiedergegeben; alternative Konstruktionen bleiben in der Fußnote offen.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Totenreich
  alternative: Scheol; Grab
  rationale: „Totenreich“ bezeichnet verständlich den Bereich der Toten und vermeidet die sachlich zu enge Gleichsetzung mit einem Grab. Die Wiedergabe legt keine spätere konfessionelle Jenseitslehre in den Vers hinein.
- issue: Bedeutung von „am Morgen“
  choice: uninterpretiert als Zeitangabe bewahrt
  alternative: ausdrücklicher Bezug auf Auferstehung oder Gericht
  rationale: Der Text nennt den Morgen, erklärt aber an dieser Stelle nicht eindeutig, worauf er theologisch verweist. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Das fortlaufende Herdenbild bleibt durch „Schafe“ und „weiden“ erhalten. „Totenreich“ ist verständlicher als die bloße Transkription „Scheol“ und sachlich weiter als „Grab“. Die beiden besonders unsicheren hebräischen Wendungen werden im Haupttext lesbar wiedergegeben und in Fußnoten ausdrücklich als umstritten markiert.
