  text: כִּ֤י לֹ֣א בְ֭/מוֹת/וֹ יִקַּ֣ח הַ/כֹּ֑ל לֹא יֵרֵ֖ד אַחֲרָ֣י/ו כְּבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/017.yaml
  text: For at his death he will take nothing[c][b][a]; his glory will not go down after him.
translation:
  language: de
  text: Denn wenn er stirbt, nimmt er nichts davon mit[a]; seine Herrlichkeit[b] wird ihm nicht hinabfolgen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nimmt er nicht das Ganze/alles“; gemeint sein kann auch: „nimmt er nichts davon mit“.'
    reason: lexical_alternative
  - marker: b
    text: „Herrlichkeit“ kann hier auch Ansehen, Pracht, Reichtum oder gesellschaftlichen Rang bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Das Hinabsteigen weist wahrscheinlich auf Tod, Grab oder Scheol hin; das Ziel bleibt im Hebräischen unausgesprochen.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Mahnung ein und gibt den argumentativen Zusammenhang natürlich wieder.
- source_word: בְמוֹתוֹ
  choice: wenn er stirbt
  rationale: Die Präposition בְּ mit „Tod“ und Suffix ist hier zeitlich zu verstehen; die verbale Formulierung ist im modernen Deutsch natürlich.
- source_word: יִקַּח הַכֹּל
  choice: nimmt er nichts davon mit
  rationale: Wörtlich steht „nimmt er nicht das Ganze/alles“. Im Zusammenhang meint die Formulierung, dass er von seinem Besitz und Glanz nichts in den Tod mitnehmen kann; „mitnehmen“ macht die kontextuell angelegte Richtung deutlich.
- source_word: יֵרֵד
  choice: steigt … hinab
  rationale: Bewahrt das konkrete Bild des Hinabsteigens, ohne das im Hebräischen unausgesprochene Ziel als Grab oder Scheol festzulegen.
- source_word: אַחֲרָיו
  choice: hinter ihm
  rationale: 'Gibt die räumlich-sequenzielle Bildhaftigkeit wieder: Seine Herrlichkeit folgt ihm beim Hinabsteigen nicht.'
- source_word: כְּבוֹדוֹ
  choice: seine Herrlichkeit
  rationale: Bewahrt die Bedeutungsbreite von כָּבוֹד zwischen Herrlichkeit, Ansehen, Pracht und gesellschaftlich-materiellem Gewicht.
theological_decisions:
- issue: Ziel des Hinabsteigens nach dem Tod
  choice: Das Bild des Hinabsteigens bleibt ohne ausdrückliche Zielangabe erhalten.
  alternative: „Seine Herrlichkeit folgt ihm nicht ins Grab / in den Scheol.“
  rationale: Das Hebräische kann Grab oder Scheol anklingen lassen, nennt das Ziel jedoch nicht. Die Übersetzung vermeidet deshalb eine unnötige dogmatische Präzisierung.
- issue: Bedeutungsumfang von כְּבוֹדוֹ
  choice: „Herrlichkeit“ als offener, poetischer Ausdruck
  alternative: „Reichtum“, „Ansehen“ oder „Pracht“
  rationale: Im Kontext gehören Wohlstand und gesellschaftliches Ansehen dazu, doch das hebräische Wort ist weiter und sollte nicht auf nur einen Aspekt verengt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Abwärtsbewegung. Die Formulierung bleibt verständlich, ohne die Mehrdeutigkeit von כָּבוֹד oder das unausgesprochene Ziel des Hinabsteigens aufzulösen.
