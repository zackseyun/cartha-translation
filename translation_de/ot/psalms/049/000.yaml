lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Für den Chorleiter
  rationale: In Psalmüberschriften bezeichnet der Ausdruck wahrscheinlich den musikalischen Leiter. »Chorleiter« ist knapp, geläufig und bewahrt den liturgisch-musikalischen Bezug; die Präposition ל wird hier mit »für« wiedergegeben, ohne die mögliche Richtung »an« auszuschließen.
- source_word: לִבְנֵי
  choice: Von den Söhnen
  rationale: Die Verbindung mit ל kann Zugehörigkeit, Zuschreibung, Bestimmung oder Urheberschaft ausdrücken. »Von« ist in einer deutschen Psalmüberschrift natürlich, legt die genaue Art der Zuordnung aber nicht abschließend fest.
- source_word: קֹרַח
  choice: Korachs
  rationale: Der Personenname Korach wird nach gängiger deutscher Bibeltradition wiedergegeben; der Genitiv stellt die hebräische Verbindung »Söhne Korachs« natürlich dar.
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: מִזְמוֹר ist die übliche Gattungsbezeichnung für ein musikalisch vorzutragendes Psalmlied. »Ein Psalm« ist die etablierte und verständliche deutsche Wiedergabe.
