id: PSA.49.18
reference: Psalms 49:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי נַ֭פְשׁ/וֹ בְּ/חַיָּ֣י/ו יְבָרֵ֑ךְ וְ֝/יוֹדֻ֗/ךָ כִּי תֵיטִ֥יב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/018.yaml
  text: For his soul blesses itself during his life[a], and they praise you when you do well for yourself.
translation:
  language: de
  text: Denn zu seinen Lebzeiten preist er sich selbst glücklich[a], und man lobt dich, wenn du es dir gut gehen lässt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „segnet er seine Seele“; gemeint ist auch: Er hält sich selbst für gesegnet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wenn es dir gut geht“; auch: „wenn du Erfolg hast“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Begründung beziehungsweise Erläuterung zum vorhergehenden Gedanken ein und entspricht dem argumentativen Zusammenhang des Psalms.
- source_word: נַפְשׁוֹ ... יְבָרֵךְ
  choice: preist er sich selbst glücklich
  rationale: נַפְשׁוֹ bezeichnet hier idiomatisch die eigene Person und steht als vorangestelltes Objekt zu dem maskulinen Verb. Die deutsche Wendung gibt den reflexiven Sinn natürlich wieder, ohne eine vom Kontext nicht gemeinte Segnung Gottes anzudeuten.
- source_word: בְּחַיָּיו
  choice: zu seinen Lebzeiten
  rationale: Gibt den zeitlichen Bereich der Handlung präzise und in natürlichem Deutsch wieder.
- source_word: וְיוֹדֻךָ
  choice: und man lobt dich
  rationale: Die dritte Person Plural hat hier wahrscheinlich ein unbestimmtes, allgemeines Subjekt. Das deutsche „man“ drückt diese gesellschaftliche Anerkennung klar aus.
- source_word: כִּי
  choice: wenn
  rationale: Bezeichnet hier den Umstand, unter dem jemand Anerkennung erfährt.
- source_word: תֵיטִיב לָךְ
  choice: wenn du es dir gut gehen lässt
  rationale: Die Formulierung bewahrt sowohl den Gedanken des eigenen Wohlergehens als auch die aktive beziehungsweise reflexive Nuance des Hiphil und des Dativs לָךְ.
theological_decisions:
- issue: Bezug von נַפְשׁוֹ und יְבָרֵךְ
  choice: 'Idiomatish-reflexiv: Der Mensch preist sich selbst glücklich.'
  alternative: 'Wörtlicher: „Er segnet seine Seele“ oder „seine Seele segnet sich“.'
  rationale: Das maskuline Verb spricht gegen „Seele“ als grammatisches Subjekt; im Kontext bezeichnet נֶפֶשׁ die Person selbst. Die Fußnote bewahrt die hebräische Bildsprache.
- issue: Bedeutungsbreite von תֵיטִיב לָךְ
  choice: 'Aktives Sorgen für das eigene Wohlergehen: „du lässt es dir gut gehen“.'
  alternative: 'Zustandsbezogen: „es geht dir gut“ oder „du hast Erfolg“.'
  rationale: Der Kontext betrifft Wohlstand und gesellschaftliches Lob. Die Übersetzung hält die Spannung zwischen eigenem Handeln und Wohlergehen offen; eine Fußnote nennt die stärker zustandsbezogene Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Preist sich glücklich“ ist eine geläufige Wendung, die den reflexiven Sinn des Hebräischen wiedergibt. Der Wechsel von „er“ zu „du“ wird als bewusster Wechsel der Anrede im hebräischen Text beibehalten.
