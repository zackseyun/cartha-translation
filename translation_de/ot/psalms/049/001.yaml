lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der pluralische Imperativ ruft unmittelbar und poetisch zum aufmerksamen Hören auf.
- source_word: זֹאת
  choice: dies
  rationale: Das Demonstrativpronomen verweist auf die nun folgende Weisheitsrede des Psalmisten.
- source_word: כָּל הָעַמִּים
  choice: ihr Völker alle
  rationale: Der Plural bezeichnet umfassend Menschengruppen beziehungsweise Völker; die Anrede mit „ihr“ klingt im Deutschen natürlich und bewahrt den universalen Ruf.
- source_word: הַאֲזִינוּ
  choice: horcht auf
  rationale: Der Imperativ fordert nachdrücklich zu aufmerksamem Hören auf und bildet eine gehobene, verständliche Parallele zu „Hört“.
- source_word: כָּל יֹשְׁבֵי
  choice: ihr Bewohner … alle
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet alle, die in einem Bereich wohnen; die direkte Anrede entspricht der ersten Vershälfte.
- source_word: חָלֶד
  choice: der Welt
  rationale: חָלֶד kann die bewohnte Welt beziehungsweise den Bereich des menschlichen Lebens bezeichnen. „Welt“ passt hier zum universalen Aufruf, ohne eine mögliche zeitlich-vergängliche Nuance ausdrücklich festzulegen.
