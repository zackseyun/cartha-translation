  yaml_path: translation/ot/psalms/049/001.yaml
  text: Hear this[a], all peoples; give ear, all inhabitants of the world,
translation:
  language: de
  text: Hört dies, alle Völker; hört zu, alle Bewohner der Welt,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle Bewohner der Erde«. Das hebräische Wort חָלֶד kann die Welt menschlichen Lebens oder den irdischen Lebensbereich bezeichnen.'
