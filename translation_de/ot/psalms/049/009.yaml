  text: וִֽ/יחִי ע֥וֹד לָ/נֶ֑צַח לֹ֖א יִרְאֶ֣ה הַ/שָּֽׁחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/009.yaml
  text: that he should still live on forever and not see the Pit[a].
translation:
  language: de
  text: damit er für immer weiterlebt und die Grube[a] nicht sieht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Grab« oder »die Verwesung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיחִי
  choice: damit er … weiterlebt
  rationale: Die Verbform führt den Gedanken des vorausgehenden Zusammenhangs als unerreichbares Ziel oder Ergebnis fort. „damit“ gibt diesen modalen Zusammenhang natürlich wieder.
- source_word: עוֹד
  choice: weiter
  rationale: עוֹד bezeichnet hier die Fortdauer des Lebens; im Deutschen wird dies idiomatisch durch „weiterlebt“ ausgedrückt.
- source_word: לָנֶצַח
  choice: für immer
  rationale: Die Präposition ל mit נצח bezeichnet unbegrenzte Dauer. „für immer“ ist klar, gegenwärtig und bewahrt die zeitliche Aussage.
- source_word: לֹא
  choice: nicht
  rationale: Die übliche Verneinung bezieht sich unmittelbar auf das folgende Verb.
- source_word: יִרְאֶה
  choice: sieht
  rationale: Die Grundbedeutung „sehen“ bewahrt die hebräische Bildsprache; die übertragene Bedeutung „erfahren“ bleibt dabei offen.
- source_word: הַשָּׁחַת
  choice: die Grube
  rationale: שחת kann im poetischen Todeskontext Grube, Grab oder Verwesung bezeichnen. „die Grube“ erhält das konkrete Bild und legt die Bedeutung nicht vorschnell auf Grab oder Zerfall fest.
theological_decisions:
- issue: Bedeutung von שחת im Zusammenhang mit dem Tod
  choice: die Grube
  alternative: das Grab; die Verwesung
  rationale: „die Grube“ bewahrt die poetische und theologische Bedeutungsbreite des hebräischen Bildes, das Grab, Untergang und den Abstieg in den Tod umfassen kann. Die traditionellen Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Ton. „weiterlebt“ verbindet die Bedeutung von חיה und עוֹד idiomatisch, ohne den Gedanken der fortdauernden Existenz abzuschwächen.
