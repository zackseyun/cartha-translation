base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/006.yaml
  text: those who trust in their wealth and boast in the abundance of their riches—[a][b]
translation:
  language: de
  text: die auf ihr Vermögen vertrauen und sich der Fülle ihres Reichtums rühmen —[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit der Fülle ihres Reichtums prahlen“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort חַיִל kann auch „Stärke“, „Machtmittel“ oder „Ressourcen“ bedeuten; der Parallelismus mit „Reichtum“ legt hier materielles Vermögen nahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּטְחִים
  choice: die … vertrauen
  rationale: Das mit dem Artikel versehene Qal-Partizip im maskulinen Plural wird substantivisch gebraucht. Die Formulierung beschreibt eine Personengruppe durch ihre anhaltende Haltung.
- source_word: עַל
  choice: auf
  rationale: Bei בּטח bezeichnet עַל das, worauf man sein Vertrauen setzt; „auf etwas vertrauen“ ist im Deutschen idiomatisch und bildet die hebräische Konstruktion angemessen ab.
- source_word: חֵילָם
  choice: ihr Vermögen
  rationale: חַיִל kann unter anderem Stärke, Machtmittel oder Besitz bezeichnen. Der Parallelismus mit עֹשֶׁר weist hier auf materielle Mittel; „Vermögen“ bewahrt zugleich etwas von der weiteren Bedeutung „Ressourcen“.
- source_word: וּבְרֹב
  choice: und … der Fülle
  rationale: רֹב bezeichnet große Menge oder Fülle. „Fülle“ gibt den quantitativen Nachdruck knapp und poetisch wieder.
- source_word: עָשְׁרָם
  choice: ihres Reichtums
  rationale: עֹשֶׁר bezeichnet Reichtum oder Wohlstand. Die Wiedergabe unterscheidet das Wort von חַיִל und erhält so den poetischen Parallelismus.
- source_word: יִתְהַלָּלוּ
  choice: sich … rühmen
  rationale: Der Hitpael von הלל bedeutet hier, sich einer Sache zu rühmen oder mit ihr zu prahlen. „Sich rühmen“ ist würdig, verständlich und lässt sowohl Selbstruhm als auch Stolz anklingen.
