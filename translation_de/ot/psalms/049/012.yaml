source:
  edition: WLC
  text: וְ/אָדָ֣ם בִּ֭/יקָר בַּל יָלִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/012.yaml
  text: But man in honor does not remain[c][b][a]; he is like the beasts that perish.
translation:
  language: de
  text: Doch der Mensch[a] bleibt nicht in Ehren[b]; er gleicht den Tieren, die vergehen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Menschheit“. Das hebräische Wort אָדָם kann „Mensch“ oder „Menschheit“ bedeuten; der Singular steht hier stellvertretend.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „übernachtet nicht“ oder „verbringt nicht die Nacht“. Das Bild besagt, dass der Mensch in seinem ehrenvollen Zustand nicht fortbesteht.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die vernichtet werden“. Das letzte hebräische Verb wird hier traditionell als Hinweis auf das Vergehen verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: der Mensch
  rationale: Das singularische אָדָם bezeichnet hier den Menschen als Vertreter der Menschheit. „Der Mensch“ ist im Deutschen natürlich und bewahrt sowohl den Einzelbezug als auch die allgemeine Aussage.
- source_word: בִּיקָר
  choice: in Ehren
  rationale: יְקָר bezeichnet Ehre, Ansehen, Wert oder Pracht. „In Ehren“ passt zum Zusammenhang menschlichen Ranges und bewahrt den gehobenen Weisheitston.
- source_word: בַּל יָלִין
  choice: bleibt nicht
  rationale: Das Verb bedeutet wörtlich „übernachten“ oder „die Nacht verbringen“. Hier beschreibt es bildhaft, dass der Mensch in seinem ehrenvollen Zustand nicht fortbesteht.
- source_word: נִמְשַׁל
  choice: er gleicht
  rationale: Der Niphal von משל drückt hier einen Vergleich aus. „Er gleicht“ ist knapp, natürlich und dem feierlichen Stil angemessen.
- source_word: כַּבְּהֵמוֹת
  choice: den Tieren
  rationale: בְּהֵמוֹת bezeichnet hier allgemein Tiere. Das moderne „Tiere“ vermeidet den heute oft abwertend oder altertümlich wirkenden Ausdruck „Vieh“, ohne den Sinn einzuengen.
- source_word: נִדְמוּ
  choice: die vergehen
  rationale: Das Verb wird in diesem Zusammenhang traditionell im Sinn von „vergehen/vernichtet werden“ verstanden. Die relative Formulierung verbindet es im Deutschen klar mit den Tieren und bringt den Vergleichspunkt der Sterblichkeit zum Ausdruck.
