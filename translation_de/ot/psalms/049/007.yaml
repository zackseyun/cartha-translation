source:
  edition: WLC
  text: אָ֗ח לֹא פָדֹ֣ה יִפְדֶּ֣ה אִ֑ישׁ לֹא יִתֵּ֖ן לֵ/אלֹהִ֣ים כָּפְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/007.yaml
  text: Surely no man can redeem a brother[a], or give to God his ransom—
translation:
  language: de
  text: 'Kein Mensch kann einen Bruder jemals loskaufen[a]

    oder Gott das Lösegeld für ihn geben –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Kein Mensch kann seinen Bruder auch nur irgendwie loskaufen.'
    reason: Die hebräische Wortstellung ist markiert, und אָח (»Bruder«) steht ohne ausdrückliches Possessivsuffix. Die Alternative macht sowohl die verstärkende Konstruktion als auch den naheliegenden persönlichen Bezug sichtbar.
lexical_decisions:
- source_word: אָח
  choice: einen Bruder
  rationale: Das Substantiv bedeutet wörtlich »Bruder« und steht hier ohne Possessivsuffix. Die Formulierung bewahrt dies und lässt offen, ob ein leiblicher Bruder oder allgemeiner ein Mitmensch gemeint ist.
- source_word: פָדֹה יִפְדֶּה
  choice: jemals loskaufen kann
  rationale: Der Infinitivus absolutus mit der finiten Verbform verstärkt den Vorgang. Zusammen mit der Verneinung drückt »jemals … kann« die völlige Unmöglichkeit idiomatisch aus.
- source_word: אִישׁ
  choice: kein Mensch
  rationale: אִישׁ bezeichnet hier den einzelnen Menschen als Vertreter der Menschheit. »Kein Mensch« ist im modernen Deutschen natürlich und macht deutlich, dass die Aussage nicht auf männliche Personen beschränkt ist.
- source_word: לֵאלֹהִים
  choice: Gott
  rationale: אֱלֹהִים bezeichnet im Kontext des Psalms den einen Gott; nach der Präposition ist »Gott … geben« die natürliche deutsche Fügung.
- source_word: כָּפְרוֹ
  choice: das Lösegeld für ihn
  rationale: כֹּפֶר ist der Preis, durch den jemand ausgelöst oder freigekauft werden soll. »Lösegeld« erhält das wirtschaftlich-rechtliche Bild, ohne zusätzliche kultische Vorstellungen einzutragen; »für ihn« gibt den Bezug des Suffixes im Deutschen verständlich wieder.
theological_decisions:
- issue: Bedeutung von כֹּפֶר gegenüber Gott
  choice: ein Gott angebotenes Lösegeld für das Leben eines anderen Menschen
  alternative: ein Sühnepreis oder allgemeiner ein Preis zur Befreiung
  rationale: Der Vers bestreitet, dass ein Mensch durch eine Zahlung an Gott das Leben eines anderen loskaufen kann. »Lösegeld« bewahrt dieses Bild, ohne es vorschnell als kultische Sühne zu deuten.
- issue: Reichweite von אִישׁ
  choice: allgemeinmenschliche Aussage
  alternative: Aussage ausdrücklich nur über einen Mann
  rationale: Obwohl אִישׁ grammatisch maskulin und singularisch ist, betrifft die Weisheitsaussage erkennbar menschliche Unfähigkeit allgemein. »Kein Mensch« gibt diese Reichweite wieder, ohne den Singular aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bleibt stehen, weil der Satz in Vers 8 weitergeführt wird. »Loskaufen« und »Lösegeld« bewahren die wiederholte Lösepreis-Metaphorik des Hebräischen.
