  text: אַל תִּ֭ירָא כִּֽי יַעֲשִׁ֣ר אִ֑ישׁ כִּֽי יִ֝רְבֶּה כְּב֣וֹד בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/016.yaml
  text: Do not fear when a man becomes rich[a], when the glory of his house increases;
translation:
  language: de
  text: Fürchte dich nicht, wenn ein Mann reich wird, wenn das Ansehen seines Hauses[a] zunimmt;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seines Hausstands“; das hebräische Wort für „Haus“ kann auch die Familie, den Haushalt oder den Besitz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Fürchte dich nicht
  rationale: אַל mit der entsprechenden Verbform drückt ein Verbot aus; die Wendung ist im Deutschen natürlich und bewahrt den gehobenen poetischen Ton.
- source_word: כִּי
  choice: wenn
  rationale: Beide Vorkommen leiten hier die Umstände ein, die keine Furcht auslösen sollen, nicht eine Begründung.
- source_word: יַעֲשִׁר
  choice: reich wird
  rationale: 'Die Hifil-Form von עשר hat hier intransitive Bedeutung: reich werden.'
- source_word: אִישׁ
  choice: ein Mann
  rationale: Die maskuline Einzahl und der sprichwortartige Stil des Hebräischen bleiben erhalten.
- source_word: יִרְבֶּה
  choice: zunimmt
  rationale: רבה bezeichnet ein Größer- oder Mehrwerden; mit כָּבוֹד ist „zunimmt“ idiomatisch.
- source_word: כְּבוֹד
  choice: der Ruhm
  rationale: כָּבוֹד kann Ehre, Ansehen, Pracht oder gewichtigen Besitz bezeichnen. „Ruhm“ erhält die Bildsprache, ohne den Sinn auf Geld zu verengen.
- source_word: בֵּיתוֹ
  choice: seines Hauses
  rationale: בַּיִת kann das Haus, den Hausstand, die Familie oder den Besitz bezeichnen. Die wörtliche Bildsprache wird im Haupttext bewahrt und in der Fußnote erläutert.
