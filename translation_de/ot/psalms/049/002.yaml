  - severity: low
    issue: „miteinander“ kann יַחַד zu eng auf das Verhältnis von Reichen und Armen beziehen.
    rationale: יַחַד fasst die aufgeführten Gruppen gemeinsam zusammen. „allesamt“ bewahrt diese umfassende Aussage in natürlichem modernen Deutsch.
