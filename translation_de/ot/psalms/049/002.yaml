  source_fidelity: 'Die soziale Deutung der Paarung בְּנֵי אָדָם / בְּנֵי אִישׁ ist im Kontext gut vertretbar und entspricht der englischen Auditspur, sollte jedoch als Deutung kenntlich bleiben. Die Fußnote bezeichnet ihre gegenwärtige Wiedergabe fälschlich als wörtlich: אָדָם ist hier nicht zwingend der Eigenname Adam. יַחַד umfasst die genannten Gruppen insgesamt; „allesamt“ gibt dies idiomatisch wieder.'
  naturalness: Die Verszeilen sind poetisch und gut verständlich. „sowohl ... als auch“ bildet die wiederholte hebräische Partikel expliziter ab als „wie ... wie“. „Allesamt“ ist am Zeilenende natürlicher und weniger missverständlich als „miteinander“, das vor allem ein wechselseitiges Verhältnis von Reichen und Armen nahelegen kann.
  terminology: „Reiche und Arme“ ist als soziales Gegensatzpaar treffend. „Menschen von niedrigem beziehungsweise hohem gesellschaftlichem Stand“ wahrt in der Anmerkung die vorsichtige, nicht völlig eindeutige soziale Auslegung. Die wörtliche Anmerkung wird auf „Menschen/Mann“ statt auf den Eigennamen „Adam“ korrigiert.
