translation:
  language: de
  text: 'Menschen von niedrigem und hohem Stand,[a]

    Reiche und Arme allesamt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sowohl Söhne des Menschen als auch Söhne eines Mannes«; die beiden Ausdrücke bezeichnen hier wahrscheinlich Menschen von niedrigem beziehungsweise hohem gesellschaftlichem Stand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם
  choice: von … wie von
  rationale: Die wiederholte Partikel schließt beide genannten Gruppen ein; die deutsche Paarformel gibt diese umfassende Bedeutung natürlich wieder.
- source_word: בְּנֵי אָדָם
  choice: Menschen von niedrigem … Stand
  rationale: In Verbindung mit בְּנֵי אִישׁ bezeichnet der Ausdruck hier wahrscheinlich Menschen mit geringerem gesellschaftlichem Rang; eine wörtliche Wiedergabe wäre im Deutschen missverständlich.
- source_word: בְּנֵי אִישׁ
  choice: Menschen von … hohem Stand
  rationale: Als Gegenstück zu בְּנֵי אָדָם weist die Wendung wahrscheinlich auf Menschen mit höherem gesellschaftlichem Rang hin. Die Fußnote bewahrt die ungewöhnliche hebräische Ausdrucksweise.
- source_word: יַחַד
  choice: miteinander
  rationale: Das Wort fasst die genannten gesellschaftlichen Gruppen gemeinsam zusammen und steht entsprechend der hebräischen Wortstellung bei »Reiche und Arme«.
- source_word: עָשִׁיר
  choice: Reiche
  rationale: Die substantivierte Form ist im Deutschen die natürliche Entsprechung innerhalb des sozialen Gegensatzpaares.
- source_word: וְאֶבְיוֹן
  choice: und Arme
  rationale: Im Gegensatz zu »Reiche« ist »Arme« die klare und idiomatische Wiedergabe; »Bedürftige« wäre lexikalisch möglich, würde den Gegensatz jedoch weniger prägnant ausdrücken.
