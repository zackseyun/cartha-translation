  text: For the ransom of their life is costly[a], and it ceases forever[b],
translation:
  language: de
  text: Denn das Lösegeld für ihr Leben ist teuer[a] – er muss für immer davon ablassen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Teuer“ kann auch „kostspielig“ heißen; das Hebräische sagt nicht ausdrücklich „zu teuer“.
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische ist stark verkürzt. Möglich sind auch: „es hört für immer auf“ oder sinngemäß: „es reicht niemals aus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵקַר
  choice: ist kostbar
  rationale: יקר bezeichnet hier den hohen Wert beziehungsweise Preis. „Kostbar“ bewahrt sowohl den Wertaspekt als auch die Aussage, dass der Preis schwer aufzubringen ist, ohne ausdrücklich „zu teuer“ einzutragen.
- source_word: פִּדְיוֹן
  choice: Lösegeld
  rationale: Das Substantiv bezeichnet den Preis für eine Auslösung. „Lösegeld“ erhält die konkrete wirtschaftliche Metapher besser als das breitere „Erlösung“.
- source_word: נַפְשָׁם
  choice: ihr Leben
  rationale: נפש meint in diesem Zusammenhang das Leben beziehungsweise die lebende Person, nicht zwingend eine vom Körper getrennte Seele. Der kollektive Singular des Hebräischen wird mit „ihr Leben“ bewahrt.
- source_word: וְחָדַל
  choice: man muss davon ablassen
  rationale: חדל bedeutet aufhören oder ablassen. Da das hebräische Subjekt unausgesprochen und der Satz stark verdichtet ist, gibt die unpersönliche Formulierung den möglichen Sinn wieder, ohne den Lösepreis ausdrücklich als Subjekt einzusetzen.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet hier zeitlich unbegrenzte Dauer. „Für immer“ entspricht ihrer Verbindung mit dem Gedanken des Aufhörens beziehungsweise Ablassens.
theological_decisions:
- issue: Bedeutung von נפש im Zusammenhang mit Tod und Loskauf
  choice: Leben
  alternative: Seele
  rationale: Der Kontext handelt von der Unmöglichkeit, menschliches Leben vom Tod freizukaufen. „Leben“ entspricht dem hebräischen Gebrauch, ohne eine besondere anthropologische Lehre vorauszusetzen.
- issue: Deutung der elliptischen Wendung וחדל לעולם
  choice: man muss für immer davon ablassen
  alternative: es hört für immer auf; es reicht niemals aus
  rationale: Die Formulierung bleibt nahe an der Grundbedeutung „aufhören/ablassen“ und vermeidet, die Ellipse stillschweigend als Aussage über das Genügen des Lösegeldes festzulegen. Die anderen sachlich möglichen Deutungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich macht die verdichtete zweite Klausel lesbar; die Übersetzung bewahrt ihre Mehrdeutigkeit durch eine zurückhaltende Haupttextfassung und eine Fußnote.
