  text: תָּ֭בוֹא עַד דּ֣וֹר אֲבוֹתָ֑י/ו עַד נֵ֝֗צַח לֹ֣א יִרְאוּ אֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/019.yaml
  text: He will go to the generation of his fathers[c][b][a]; they will never again see the light.
translation:
  language: de
  text: Du[a] wirst zum Geschlecht seiner Väter[b] kommen; sie werden bis in Ewigkeit kein Licht sehen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Form kann auch „sie wird kommen“ bedeuten und dann auf „seine Seele“ im vorherigen Vers bezogen werden. Der folgende Satzteil steht jedoch im Plural: „sie werden sehen“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „zu der Generation seiner Vorfahren“. Wörtlich: „zum Geschlecht seiner Väter“.'
    reason: lexical_alternative
  - marker: c
    text: „Das Licht sehen“ ist ein hebräisches Bild für Leben beziehungsweise Lebendigkeit. Hier bezeichnet es das endgültige Nichtsehen des Lichts.
    reason: cultural_note
lexical_decisions:
- source_word: תָּבוֹא
  choice: sie wird … kommen
  rationale: Die Form kann als Qal-Imperfekt 3. Person feminin Singular verstanden werden und dann auf נַפְשׁוֹ („seine Seele“) im vorangehenden Vers zurückverweisen. Formal ist zugleich auch die Deutung als 2. Person maskulin Singular möglich; diese Mehrdeutigkeit wird in einer Fußnote offengelegt.
- source_word: עַד
  choice: zu
  rationale: Vor דּוֹר אֲבוֹתָיו bezeichnet עַד hier das Ziel beziehungsweise die erreichte Gemeinschaft.
- source_word: דּוֹר
  choice: Generation
  rationale: Die grundsätzlich zeitliche und gemeinschaftliche Bedeutung von דּוֹר bleibt erhalten; im Zusammenhang ist die Gemeinschaft der verstorbenen Vorfahren gemeint.
- source_word: אֲבוֹתָיו
  choice: seine Väter
  rationale: Die wörtliche familiäre Bildsprache des Hebräischen wird bewahrt; gemeint sein können allgemein seine Vorfahren.
- source_word: עַד נֵצַח
  choice: für immer … nicht mehr
  rationale: In Verbindung mit der Verneinung bezeichnet die Wendung ein endgültiges Ausbleiben.
- source_word: לֹא יִרְאוּ
  choice: sie werden … nicht mehr sehen
  rationale: Das Verb steht in der 3. Person maskulin Plural und bezieht sich natürlich auf die Väter beziehungsweise die Gemeinschaft der Toten. Der Wechsel vom femininen Singular zum Plural bleibt bestehen.
- source_word: אוֹר
  choice: das Licht
  rationale: Die hebräische Bildsprache wird bewahrt; Licht bezeichnet hier im Zusammenhang das Erleben des Lebens.
theological_decisions:
- issue: Person- und Numeruswechsel im Vers
  choice: Der erste Satzteil wird als femininer Singular mit Rückbezug auf „seine Seele“ im vorangehenden Vers wiedergegeben, der zweite als Plural.
  alternative: „Du wirst zur Generation seiner Väter kommen; sie werden …“ oder eine durchgehend singularische Wiedergabe.
  rationale: תָּבוֹא kann formal sowohl 3. Person feminin Singular als auch 2. Person maskulin Singular sein. Der feminine Rückbezug auf נַפְשׁוֹ im vorangehenden Vers ist kontextuell naheliegend, während יִרְאוּ eindeutig im Plural steht. Die Übersetzung glättet diesen Wechsel nicht.
- issue: Bedeutung von „das Licht sehen“
  choice: Das Bild bleibt im Haupttext wörtlich stehen und wird in der Fußnote als Ausdruck für Leben erläutert.
  alternative: Im Haupttext unmittelbar „nicht mehr leben“ wiedergeben.
  rationale: So bleiben die poetische Bildkraft und die Aussage über die Endgültigkeit des Todes erhalten, ohne darüber hinausgehende dogmatische Folgerungen in den Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht ungewohnte Wendung „Generation seiner Väter“ bewahrt das hebräische Bild und wird durch die Fußnote verständlich gemacht. Die Kleinschreibung von „sie“ lässt den Wechsel vom femininen Singular zum Plural im Deutschen formal zu; die Fußnote erläutert ihn ausdrücklich.
