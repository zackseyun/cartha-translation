  source_fidelity: Der Entwurf erkennt zutreffend die formale Mehrdeutigkeit von תָּבוֹא (2. Person maskulin Singular oder 3. Person feminin Singular) und den eindeutigen Plural יִרְאוּ. Die Entscheidung für „Sie wird“ als wahrscheinlichen Rückbezug auf „seine Seele“ legt jedoch eine kontextuelle Deutung im Haupttext fest, obwohl der hebräische Wortlaut diese nicht eindeutig verlangt. Die revidierte Fassung gibt die punktierte 2.-Person-Form wieder und dokumentiert die feminine Alternative in der Anmerkung; der auffällige Personen- und Numeruswechsel bleibt erhalten.
  naturalness: „Für immer das Licht nicht mehr sehen“ ist im modernen Deutsch schwerfällig und verbindet zwei Daueradverbiale redundant. „Bis in Ewigkeit kein Licht sehen“ ist idiomatisch, würdevoll und gibt עַד־נֵצַח mit der Negation klar wieder. „Zum Geschlecht seiner Väter“ ist bewusst leicht gehoben, aber als poetisch-biblische Wiedergabe von דּוֹר אֲבוֹתָיו verständlich.
  terminology: „Geschlecht seiner Väter“ bewahrt die gemeinschaftliche und generationale Bildsprache; die Fußnote bietet „Vorfahren“ als verständlichere lexikalische Alternative. „Das Licht sehen“ bleibt als zentrale hebräische Lebensmetapher stehen, ohne eine weitergehende Lehraussage über den Zustand der Toten einzutragen.
