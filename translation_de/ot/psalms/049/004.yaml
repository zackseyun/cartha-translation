lexical_decisions:
- source_word: אַטֶּה
  choice: Ich neige
  rationale: Der Hifil von נטה bezeichnet hier das bewusste Hinwenden des Ohrs. „Mein Ohr neigen“ bewahrt das hebräische Bild und ist in gehobenem modernem Deutsch verständlich.
- source_word: לְמָשָׁל
  choice: einem Weisheitsspruch zu
  rationale: מָשָׁל kann Sprichwort, Gleichnis oder weisheitliche Rede bezeichnen. Im Kontext des Weisheitspsalms gibt „Weisheitsspruch“ die Gattung wieder, ohne sie auf ein gewöhnliches Sprichwort zu verengen.
- source_word: אָזְנִי
  choice: mein Ohr
  rationale: Der hebräische Text hat den Singular mit Suffix der ersten Person; dieser wird beibehalten.
- source_word: אֶפְתַּח
  choice: ich eröffne
  rationale: פתח bedeutet wörtlich „öffnen“. „Eröffnen“ bewahrt die Metapher, klingt im Deutschen aber natürlicher als „mein Rätsel öffnen“ und legt nicht vorschnell „erklären“ fest.
- source_word: בְּכִנּוֹר
  choice: zum Klang der Leier
  rationale: כִּנּוֹר bezeichnet ein leierartiges Saiteninstrument. Die Präposition ב kann instrumental oder begleitend verstanden werden; „zum Klang der Leier“ gibt die musikalische Begleitung idiomatisch wieder.
- source_word: חִידָתִי
  choice: mein Rätsel
  rationale: חִידָה bezeichnet ein Rätsel oder einen dunklen, deutungsbedürftigen Ausspruch. „Rätsel“ ist klar und erhält den enigmatischen Charakter.
