source:
  edition: WLC
  text: אַךְ אֱלֹהִ֗ים יִפְדֶּ֣ה נַ֭פְשִׁ/י מִֽ/יַּד שְׁא֑וֹל כִּ֖י יִקָּחֵ֣/נִי סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/015.yaml
  text: But God will redeem my life from the hand of Sheol[a], for he will take me[b]. Selah
translation:
  language: de
  text: Doch Gott wird mein Leben aus der Hand des Scheols[a] erlösen, denn er wird mich nehmen[b]. Sela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Scheol ist der hebräische Ausdruck für das Totenreich; auch: „das Grab“ oder „das Reich der Toten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn er wird mich aufnehmen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel setzt die Zuversicht des Beters in deutlichen Gegensatz zum zuvor beschriebenen Schicksal sterblicher Menschen; „Doch“ gibt diesen adversativen Sinn natürlich wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Wort bezeichnet hier im Singular den Gott Israels; „Gott“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: יִפְדֶּה
  choice: wird … erlösen
  rationale: Das Verb פדה bezeichnet das Loskaufen oder Befreien aus einer Machtlage. „Erlösen“ bewahrt sowohl den Gedanken der Befreiung als auch die weiterreichende theologische Resonanz.
- source_word: נַפְשִׁי
  choice: mein Leben
  rationale: נפש bezeichnet hier im Zusammenhang von Tod und Rettung eher das Leben beziehungsweise die ganze Person als eine vom Körper getrennte Seele.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die wörtliche Wendung bewahrt das hebräische Bild von der Hand als Macht oder Zugriff und bleibt im Deutschen verständlich.
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Die Transliteration erhält den besonderen hebräischen Begriff für den Bereich der Toten, ohne ihn vorschnell auf das Grab oder eine spätere Vorstellung von Hölle festzulegen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt hier die Begründung für die zuvor ausgesprochene Zuversicht ein.
- source_word: יִקָּחֵנִי
  choice: er wird mich zu sich nehmen
  rationale: לקח bedeutet grundsätzlich „nehmen“. Bei Gott als Subjekt kann die Wendung ein Aufnehmen zu ihm ausdrücken; „zu sich nehmen“ ist im Deutschen natürlich, ohne die genaue Art der göttlichen Rettung näher festzulegen.
- source_word: סֶלָה
  choice: Sela
  rationale: Da Bedeutung und liturgisch-musikalische Funktion des Ausdrucks unsicher sind, wird er in der traditionellen Form wiedergegeben.
theological_decisions:
- issue: Bedeutung von נַפְשִׁי im Zusammenhang mit Tod und Rettung
  choice: „mein Leben“ statt „meine Seele“
  alternative: „meine Seele“ oder „mich selbst“
  rationale: Damit wird kein späteres Leib-Seele-Schema in den hebräischen Text hineingetragen. Im Kontext steht die ganze Person in ihrer Sterblichkeit und Rettung im Blick.
- issue: Art der Rettung aus dem Scheol
  choice: Die offene Aussage von Erlösung und göttlichem Zu-sich-Nehmen bleibt bestehen.
  alternative: Ausdrückliche Auferstehungssprache oder ausschließliche Deutung als Bewahrung vor vorzeitigem Tod
  rationale: Der hebräische Vers bekennt zuversichtlich Gottes endgültige Rettungsmacht, bestimmt aber nicht systematisch, ob Auferstehung, Gemeinschaft mit Gott nach dem Tod oder eine andere Form der Rechtfertigung im Vordergrund steht.
- issue: Bedeutung von יִקָּחֵנִי
  choice: „er wird mich zu sich nehmen“
  alternative: „er wird mich aufnehmen“ oder wörtlicher „er wird mich nehmen“
  rationale: Die gewählte Formulierung macht das Deutsche idiomatisch, wahrt aber die im Verb liegende Offenheit. Die Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzführung. Das Bild „aus der Hand“ bleibt erhalten; „Scheol“ und „Sela“ werden wegen ihrer besonderen beziehungsweise unsicheren Bedeutung transliteriert.
