source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֡ים בָּ֤אוּ גוֹיִ֨ם בְּֽ/נַחֲלָתֶ֗/ךָ טִ֭מְּאוּ אֶת הֵיכַ֣ל קָדְשֶׁ֑/ךָ שָׂ֖מוּ אֶת יְרוּשָׁלִַ֣ם לְ/עִיִּֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/001.yaml
  text: A psalm of Asaph. O God[a], the nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem a heap of ruins.
translation:
  language: de
  text: Ein Psalm Asafs. Gott, Völker sind in dein Erbteil gekommen; sie haben deinen heiligen Tempel entweiht; sie haben Jerusalem zu Trümmerhaufen gemacht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie haben Jerusalem zu Ruinen gemacht.“'
    reason: Lexikalisch mögliche Wiedergabe von לְעִיִּים („zu Ruinen/Trümmerhaufen“) im resultativen Ausdruck.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Ein Psalm
  rationale: „Psalm“ ist die übliche und sachlich passende Bezeichnung dieser Liedgattung und Überschrift.
- source_word: לְאָסָף
  choice: Asafs
  rationale: Die Genitivform gibt die in Psalmüberschriften offene Zuordnung zu Asaf natürlich wieder, ohne ausdrücklich zwischen Autorschaft, Zugehörigkeit und Widmung zu entscheiden.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv steht als direkte Anrede; im heutigen Deutschen ist dafür kein zusätzliches „O“ erforderlich.
- source_word: בָּאוּ גוֹיִם
  choice: Völker sind … eingedrungen
  rationale: בוא bedeutet grundsätzlich „kommen“; mit בְּ und im Zusammenhang der Tempelschändung bezeichnet es hier das feindliche Eindringen. „Völker“ wahrt die allgemeine Bezeichnung fremder Nationen.
- source_word: בְּנַחֲלָתֶךָ
  choice: in dein Erbteil
  rationale: „Erbteil“ bewahrt die bundestheologisch mitschwingende, aber nicht näher auf Land oder Volk eingeengte Vorstellung von Gottes Besitz.
- source_word: טִמְּאוּ
  choice: entweiht
  rationale: Das Verb bezeichnet kultische Verunreinigung; „entweiht“ gibt im Zusammenhang mit dem Tempel die sakrale Verletzung klar und idiomatisch wieder.
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: deinen heiligen Tempel
  rationale: Die deutsche Adjektivkonstruktion gibt die hebräische Verbindung „Tempel deiner Heiligkeit“ natürlich und genau wieder.
- source_word: שָׂמוּ אֶת יְרוּשָׁלִַם לְעִיִּים
  choice: sie haben Jerusalem zu Trümmerhaufen gemacht
  rationale: שׂים mit resultativem לְ bedeutet hier „zu etwas machen“; der Plural עִיִּים bezeichnet Ruinen beziehungsweise Trümmerhaufen.
theological_decisions:
- issue: Umfang von Gottes „Erbteil“
  choice: Die mehrdeutige Bezeichnung „dein Erbteil“ bleibt erhalten.
  alternative: „dein Land“ oder „dein Volk“
  rationale: Der hebräische Ausdruck kann Gottes Bundesbesitz umfassend bezeichnen. Eine Festlegung allein auf Land oder Volk würde den Text unnötig verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Klage bleibt knapp und unmittelbar; „Erbteil“ erhält bewusst den biblischen Bundeskontext, während „entweiht“ die kultische Dimension verständlich ausdrückt.
