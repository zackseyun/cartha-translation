  terminology: „Erbteil“, „heiliger Tempel“, „entweiht“ und „Trümmerhaufen“ geben die kultische und bundesbezogene Sprache angemessen wieder. Die Fußnote wird auf eine engere lexikalische Alternative abgestimmt.
