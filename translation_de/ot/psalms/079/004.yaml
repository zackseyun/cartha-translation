  text: הָיִ֣ינוּ חֶ֭רְפָּה לִ/שְׁכֵנֵ֑י/נוּ לַ֥עַג וָ֝/קֶ֗לֶס לִ/סְבִיבוֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/004.yaml
  text: We have become a reproach to our neighbors[a], a mockery and derision to those around us.
translation:
  language: de
  text: Wir sind unseren Nachbarn zur Schmach geworden und für die, die um uns herum wohnen, zu Spott und Gespött.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִינוּ
  choice: Wir sind … geworden
  rationale: Das Qal-Perfekt in der 1. Person Plural beschreibt einen eingetretenen Zustand, der fortbesteht; das deutsche Perfekt gibt Ergebnis und Gegenwartsbezug natürlich wieder.
- source_word: חֶרְפָּה
  choice: zum Hohn
  rationale: Das Substantiv bezeichnet öffentliche Schmach beziehungsweise das Objekt verächtlichen Redens. Die feste deutsche Wendung „jemandem zum Hohn werden“ bewahrt die prädikative Nominalstruktur und den relationalen Sinn.
- source_word: לִשְׁכֵנֵינוּ
  choice: unseren Nachbarn
  rationale: Die Präposition ל bezeichnet hier die Personengruppe, für die Israel zum Gegenstand des Hohns geworden ist. Der deutsche Dativ ist idiomatisch.
- source_word: לַעַג
  choice: zum Spott
  rationale: Das Wort bezeichnet höhnisches Verspotten. „Spott“ ist gegenwärtiges, klares Deutsch und erhält die nominale Parallelstruktur.
- source_word: קֶלֶס
  choice: Gespött
  rationale: Das Wort bezeichnet Verhöhnung beziehungsweise das Objekt des Spottes. „Gespött“ lässt die poetische Häufung der Schmachbegriffe erkennen, ohne es völlig mit לַעַג gleichzusetzen.
- source_word: לִסְבִיבוֹתֵינוּ
  choice: denen rings um uns
  rationale: Die Wendung meint die Menschen beziehungsweise Völker in der Umgebung. „Denen rings um uns“ ist knapp und wahrt den weiteren Kreis gegenüber den zuvor genannten Nachbarn.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelität. Die Häufung „Hohn … Spott und Gespött“ bildet die drei verwandten Schmachbegriffe des Hebräischen ab, ohne ihre Bedeutungsnähe künstlich zu beseitigen.
