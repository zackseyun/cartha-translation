id: PSA.79.13
reference: Psalms 79:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲנַ֤חְנוּ עַמְּ/ךָ֨ וְ/צֹ֥אן מַרְעִיתֶ/ךָ֮ נ֤וֹדֶ֥ה לְּ/ךָ֗ לְ/ע֫וֹלָ֥ם לְ/דֹ֥ר וָ/דֹ֑ר נְ֝סַפֵּ֗ר תְּהִלָּתֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/013.yaml
  text: But we[a], your people and the sheep of your pasture, will give thanks to you forever[b]; from generation to generation we will recount your praise.
translation:
  language: de
  text: Wir aber, dein Volk und die Schafe deiner Weide[a], werden dir für immer danken; von Generation zu Generation werden wir dein Lob verkünden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Herde auf deiner Weide“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „werden wir erzählen, was an dir lobenswert ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Wir aber
  rationale: Das selbstständige Pronomen mit der vorangestellten Konjunktion hebt die betende Gemeinschaft gegenüber den zuvor genannten Völkern und der Verwüstung ab. „Wir aber“ gibt diesen Kontrast im Deutschen natürlich wieder.
- source_word: עַמְּךָ
  choice: dein Volk
  rationale: Die schlichte und geläufige Wiedergabe der Bundesbezeichnung für Israel in seiner Beziehung zu Gott.
- source_word: וְצֹאן מַרְעִיתֶךָ
  choice: und die Schafe deiner Weide
  rationale: Die konkrete Hirtenmetapher bleibt ausdrücklich erhalten. צֹאן kann je nach Blickrichtung sowohl die einzelnen Schafe als auch die Herde bezeichnen.
- source_word: נוֹדֶה לְּךָ
  choice: werden dir … danken
  rationale: ידה im Hifil bezeichnet hier das Danken beziehungsweise Loben. „Danken“ wahrt den begrifflichen Unterschied zum nachfolgenden תְּהִלָּה, „Lob“.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Eine natürliche moderne Wiedergabe für unbegrenzte, fortdauernde Zeit.
- source_word: לְדֹר וָדֹר
  choice: von Generation zu Generation
  rationale: Die deutsche Wendung gibt die Fortdauer durch alle aufeinanderfolgenden Generationen idiomatisch wieder.
- source_word: נְסַפֵּר
  choice: werden wir … verkünden
  rationale: ספר im Piel bedeutet erzählen, berichten oder bekannt machen. Zusammen mit „Lob“ ist „verkünden“ im Deutschen natürlich und bewahrt den öffentlichen Charakter der Aussage.
- source_word: תְּהִלָּתֶךָ
  choice: dein Lob
  rationale: Die Formulierung lässt sowohl das Gott dargebrachte Lob als auch das an ihm Lobenswerte anklingen, ohne die Aussage auf einzelne Taten einzuengen.
theological_decisions:
- issue: Hirtenbild für Gottes Volk
  choice: Die Metapher wird ausdrücklich als „die Schafe deiner Weide“ beibehalten.
  alternative: deine Herde
  rationale: Der Vers bezeichnet die betende Gemeinschaft zugleich als Gottes Volk und als die von ihm versorgten Schafe. Die konkrete Bildsprache bleibt so erhalten, ohne spätere theologische Aussagen einzutragen.
- issue: Bedeutungsumfang von תְּהִלָּתֶךָ
  choice: dein Lob
  alternative: deine ruhmwürdigen Taten / deinen Ruhm
  rationale: Das hebräische Substantiv kann sowohl den Lobpreis als auch dessen lobenswerten Gegenstand bezeichnen. „Dein Lob“ bewahrt diese Spannung am ehesten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelstruktur. „Für immer“ ist bewusst gegenwärtiger als „auf ewig“, während „von Generation zu Generation“ den feierlichen Psalmton wahrt.
