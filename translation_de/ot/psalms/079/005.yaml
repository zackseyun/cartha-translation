source:
  edition: WLC
  text: עַד מָ֣ה יְ֭הוָה תֶּאֱנַ֣ף לָ/נֶ֑צַח תִּבְעַ֥ר כְּמוֹ אֵ֝֗שׁ קִנְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/005.yaml
  text: How long[a], O Yahweh? Will you be angry forever? Will your jealousy burn like fire?
translation:
  language: de
  text: Wie lange noch, Jahwe? Willst du für immer zornig sein? Wird deine Eifersucht[a] wie Feuer brennen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Eifer“. Das hebräische Wort קִנְאָה kann „Eifersucht“ oder „Eifer“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָה
  choice: Wie lange noch
  rationale: Die geläufige Klageformel fragt eindringlich nach der Dauer; „noch“ gibt im Deutschen die Dringlichkeit natürlich wieder, ohne den Sinn zu erweitern.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen übliche Form.
- source_word: תֶּאֱנַף
  choice: zornig sein
  rationale: Das Verb bezeichnet Zorn. Die Formulierung ist klar, würdig und in der direkten Anrede natürlich.
- source_word: לָנֶצַח
  choice: für immer
  rationale: Im Klagekontext wird gefragt, ob Gottes Zorn ohne Ende andauern wird.
- source_word: תִּבְעַר
  choice: brennen
  rationale: Das Verb bezeichnet hier das Brennen und verbindet sich unmittelbar mit dem Vergleich „wie Feuer“.
- source_word: כְּמוֹ אֵשׁ
  choice: wie Feuer
  rationale: Der bildhafte Vergleich wird knapp und unmittelbar bewahrt.
- source_word: קִנְאָתֶךָ
  choice: deine Eifersucht
  rationale: קִנְאָה kann „Eifersucht“ oder „Eifer“ bedeuten. „Eifersucht“ bewahrt hier den schärferen, auf die Bundesbeziehung bezogenen Sinn; die echte Alternative wird in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die deutsche Form „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch „der HERR“ zu ersetzen.
- issue: Wiedergabe von קִנְאָה als Eigenschaft Gottes
  choice: Eifersucht
  alternative: Eifer
  rationale: Im Zusammenhang mit Gottes Zorn ist „Eifersucht“ als Ausdruck seines ausschließlichen Anspruchs in der Bundesbeziehung naheliegend. Da das Wort ebenso „Eifer“ bezeichnen kann, bleibt diese theologisch bedeutsame Spannung in der Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Klagecharakter. Die drei kurzen Fragen erhalten die eindringliche rhetorische Bewegung des hebräischen Verses.
