source:
  edition: WLC
  text: תָּ֤ב֣וֹא לְ/פָנֶי/ךָ֮ אֶנְקַ֪ת אָ֫סִ֥יר כְּ/גֹ֥דֶל זְרוֹעֲ/ךָ֑ ה֝וֹתֵ֗ר בְּנֵ֣י תְמוּתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/011.yaml
  text: Let the groaning of the prisoner come before you; according to the greatness of your arm[a], preserve the children of death.
translation:
  language: de
  text: Das Stöhnen des Gefangenen komme vor dich; bewahre nach der Größe deines Arms die dem Tod Geweihten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne des Todes“; eine hebräische Wendung für Menschen, die dem Tod verfallen, zum Sterben bestimmt oder vom Tod bedroht sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא לְפָנֶיךָ
  choice: dringe zu dir
  rationale: Der Qal-Imperfekt ist in diesem Gebet als Bitte zu verstehen. „Dringe zu dir“ gibt die Bewegung in Gottes Gegenwart natürlich und mit dem Nachdruck des Hilferufs wieder.
- source_word: אֶנְקַת אָסִיר
  choice: das Stöhnen des Gefangenen
  rationale: אֶנְקָה bezeichnet ein hörbares Stöhnen oder Seufzen aus Not; אָסִיר ist ein Gefangener beziehungsweise Inhaftierter. Der Singular bleibt entsprechend dem Hebräischen erhalten und kann repräsentativ verstanden werden.
- source_word: כְּגֹדֶל זְרוֹעֲךָ
  choice: nach der Größe deines Arms
  rationale: כְּ bezeichnet hier Maßstab oder Entsprechung. Das konkrete Bild des Arms als Ausdruck göttlicher Macht wird bewahrt.
- source_word: הוֹתֵר
  choice: bewahre
  rationale: Der Hifil-Imperativ von יתר bittet darum, Menschen übrig beziehungsweise am Leben bleiben zu lassen. „Bewahre“ ist würdig und schließt die Rettung vor dem Tod ein.
- source_word: בְּנֵי תְמוּתָה
  choice: die dem Tod Geweihten
  rationale: Die Wendung bedeutet wörtlich „Söhne des Todes“ und bezeichnet Menschen, die dem Tod verfallen, zum Tod bestimmt oder unmittelbar vom Tod bedroht sind. Die deutsche Fassung wahrt diese Spannung, ohne eine förmliche Verurteilung ausdrücklich vorauszusetzen.
theological_decisions:
- issue: Status der als בְּנֵי תְמוּתָה bezeichneten Menschen
  choice: die dem Tod Geweihten
  alternative: die zum Tod Verurteilten; die dem Tod Verfallenen
  rationale: Der hebräische Ausdruck lässt offen, ob eine Todesverurteilung, eine Bestimmung zum Sterben oder allgemeine tödliche Bedrohung gemeint ist. Die gewählte Formulierung hält diese Mehrdeutigkeit eher offen als „zum Tod Verurteilte“.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Der konkrete Ausdruck „Arm“ bleibt als verständliches biblisches Bild für Gottes Macht erhalten; die ungewöhnliche hebräische Schlusswendung wird im Text idiomatisch und in der Fußnote wörtlich wiedergegeben.
