  text: שָׁפְכ֬וּ דָמָ֨/ם כַּ/מַּ֗יִם סְֽבִ֘יב֤וֹת יְֽרוּשָׁלִָ֗ם וְ/אֵ֣ין קוֹבֵֽר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/003.yaml
  text: They have poured out their blood like water all around Jerusalem[a], and there is no one to bury them.
translation:
  language: de
  text: Sie haben ihr Blut wie Wasser rings um Jerusalem vergossen[a], und niemand war da, um sie zu begraben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie haben ihr Blut wie Wasser rings um Jerusalem ausgegossen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְכוּ
  choice: haben … vergossen
  rationale: Das Qal Perfekt bezeichnet eine abgeschlossene Handlung. Bei Blut ist „vergießen“ im Deutschen natürlich; die wörtlichere Vorstellung des Ausgießens bleibt durch den Vergleich mit Wasser und die Fußnote erkennbar.
- source_word: דָמָם
  choice: ihr Blut
  rationale: Die direkte Wiedergabe des Substantivs דָּם mit Suffix der 3. Person Plural bewahrt das konkrete Bild, ohne deutend „Lebensblut“ einzusetzen.
- source_word: כַמַּיִם
  choice: wie Wasser
  rationale: Die Vergleichspartikel כ wird im modernen Deutschen natürlich mit „wie“ wiedergegeben.
- source_word: סְבִיבוֹת יְרוּשָׁלִָם
  choice: rings um Jerusalem
  rationale: „Rings um“ gibt die räumliche Ausdehnung von סְבִיבוֹת knapp und idiomatisch wieder.
- source_word: וְאֵין
  choice: und niemand war da
  rationale: Die negative Existenzformel wird entsprechend der geschilderten vergangenen Verwüstung idiomatisch wiedergegeben, ohne im Hebräischen nicht ausdrücklich markierte Einzelheiten hinzuzufügen.
- source_word: קוֹבֵר
  choice: der sie begrub
  rationale: Das Partizip bezeichnet jemanden, der bestattet. Das im Deutschen nötige Objekt „sie“ ergibt sich aus dem Kontext der Getöteten.
