base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/000.yaml
  text: A psalm of Asaph. God[a], nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem into ruins.
translation:
  language: de
  text: 'Ein Psalm Asafs.


    Gott, Völker sind in dein Erbteil gekommen. Sie haben deinen heiligen Tempel entweiht und Jerusalem zu Trümmerhaufen gemacht.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jerusalem in Trümmer gelegt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Ein Psalm Asafs
  rationale: Der deutsche Genitiv gibt die knappe hebräische Überschrift natürlich wieder, ohne ausdrücklich festzulegen, ob Asaf als Verfasser, Urheber oder zugehörige Person gemeint ist.
- source_word: גוֹיִם
  choice: Völker
  rationale: Die unbestimmte Mehrzahl entspricht dem Hebräischen; der feindliche Charakter ergibt sich aus dem Kontext, ohne dass „fremde“ ausdrücklich ergänzt werden muss.
- source_word: נַחֲלָתֶךָ
  choice: dein Erbteil
  rationale: „Erbteil“ bewahrt die biblisch-theologische Weite des Ausdrucks, der Gottes Land, Volk oder beides bezeichnen kann.
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: deinen heiligen Tempel
  rationale: Eine natürliche und genaue Wiedergabe von „Tempel deines Heiligtums/deiner Heiligkeit“ im modernen Deutschen.
- source_word: לְעִיִּים
  choice: zu Trümmerhaufen
  rationale: Der hebräische Plural bezeichnet Ruinen beziehungsweise Schutthaufen; „Trümmerhaufen“ bildet das konkrete Zerstörungsbild ab.
theological_decisions:
- issue: Bedeutungsumfang von Gottes „Erbteil“
  choice: dein Erbteil
  alternative: dein Land / dein Eigentum
  rationale: Die Übersetzung lässt bewusst offen, ob vor allem das Land, die Stadt, der Tempelbereich oder Gottes Volk im Blick ist, und löst die im Hebräischen vorhandene theologische Mehrdeutigkeit nicht auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede „Gott“ erhält die Dringlichkeit der Klage; die kurzen Hauptsätze folgen der hebräischen Abfolge und bleiben gut verständlich.
