  text: אַֽל תִּזְכָּר לָ/נוּ֮ עֲוֺנֹ֪ת רִאשֹׁ֫נִ֥ים מַ֭הֵר יְקַדְּמ֣וּ/נוּ רַחֲמֶ֑י/ךָ כִּ֖י דַלּ֣וֹנוּ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/008.yaml
  text: Do not remember against us the iniquities of former times; let your mercies quickly come to meet us[a], for we have been brought very low.
translation:
  language: de
  text: Rechne uns die Schuld früherer Zeiten[a] nicht an! Dein Erbarmen komme uns schnell entgegen, denn wir sind sehr geschwächt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Schuld unserer Vorfahren«; auch möglich: »unsere frühere Schuld«. Der hebräische Ausdruck ist zeitlich mehrdeutig.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּזְכָּר לָנוּ
  choice: Rechne uns … nicht an
  rationale: Die hebräische Wendung bedeutet wörtlich etwa „gedenke uns nicht“, hat hier aber einen nachteiligen, gleichsam gerichtlichen Sinn. „Rechne uns … nicht an“ gibt diesen im heutigen Deutsch natürlich wieder.
- source_word: עֲוֺנֹת
  choice: Schuld
  rationale: עָוֹן bezeichnet sowohl schuldhaftes Vergehen als auch die daraus erwachsende Schuld. „Schuld“ bewahrt dieses moralische Gewicht und passt idiomatisch zu „anrechnen“.
- source_word: רִאשֹׁנִים
  choice: früherer Zeiten
  rationale: Das Adjektiv bedeutet „frühere/erste“. Die zeitliche Formulierung lässt offen, ob die Schuld früherer Generationen oder eigene frühere Schuld gemeint ist.
- source_word: מַהֵר יְקַדְּמוּנוּ
  choice: komme uns schnell entgegen
  rationale: קדם kann „zuvorkommen“ oder „entgegenkommen/begegnen“ bedeuten. Mit Gottes Erbarmen als Subjekt bewahrt „entgegenkommen“ das räumliche Bild und die Dringlichkeit.
- source_word: רַחֲמֶיךָ
  choice: dein Erbarmen
  rationale: Der hebräische Plural רַחֲמִים wird im Deutschen am natürlichsten durch das kollektive Singularwort „Erbarmen“ wiedergegeben.
- source_word: כִּי דַלּוֹנוּ מְאֹד
  choice: denn wir sind sehr tief erniedrigt
  rationale: דלל beschreibt einen Zustand starker Schwächung, Verminderung oder Erniedrigung. Die Formulierung gibt den resultierenden Tiefstand wieder, ohne ihn ausschließlich wirtschaftlich zu deuten.
theological_decisions:
- issue: Bezug der „Schuld früherer Zeiten“
  choice: Die zeitliche Mehrdeutigkeit bleibt im Haupttext bestehen.
  alternative: „die Schuld unserer Vorfahren“ oder „unsere frühere Schuld“
  rationale: Das Hebräische nennt keinen ausdrücklichen Besitzer der „früheren“ Schuld. Eine Festlegung auf die Vorfahren oder auf frühere eigene Vergehen würde eine mögliche Deutung ausschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gebetscharakter wird durch den verneinten Imperativ und den Wunsch-/Bitte-Ton „komme“ bewahrt; unnötig altertümliche Wendungen werden vermieden.
