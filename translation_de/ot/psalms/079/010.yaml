review_pass:
  verdict: revise
  source_fidelity: 'Die Hauptfassung gibt den Spott der Völker, das öffentliche Bekanntwerden und das vergossene Blut der Diener Gottes zutreffend wieder. Die Wiedergabe „wie ... gerächt wird“ verschiebt jedoch den hebräischen Nominalsatz: Bekannt werden soll die Rache/Vergeltung selbst, nicht primär die Art und Weise, wie das Blut gerächt wird.'
  naturalness: Die vorgeschlagene nominale Fassung ist modernes, würdiges und gut verständliches Standarddeutsch. „Möge“ gibt den hebräischen jussivischen Gebetswunsch klarer wieder als ein bloß zukunftsbezogen lesbares „soll“.
  terminology: „Völker“, „Gott“, „Diener“, „vergossenes Blut“ und besonders „Rache“ entsprechen dem Kontext und den Schlüsselbegriffen. „Rache für das vergossene Blut“ bildet die hebräische Konstruktverbindung idiomatisch ab, ohne die imprekatorische Aussage abzuschwächen.
  issues:
  - severity: medium
    issue: Die Konstruktion „bekannt werden, wie das vergossene Blut deiner Diener gerächt wird“ führt eine indirekte Frage nach der Weise des Rächens ein.
    rationale: יִוָּדַע bezieht sich im Hebräischen auf נִקְמַת („die Rache/Vergeltung“). Die Nominalkonstruktion sollte daher im deutschen Haupttext erhalten bleiben; die bisherige Fußnote trifft die Quellsyntax genauer als die Hauptfassung.
  revised_text: 'Warum sollen die Völker sagen: »Wo ist ihr Gott?« Möge unter den Völkern vor unseren Augen die Rache für das vergossene Blut deiner Diener bekannt werden.'
