  rationale: Die Revision stellt die nominale Beziehung von יִוָּדַע zu נִקְמַת wieder her und bewahrt damit die Aussage, dass Gottes Rache öffentlich erkennbar werden soll. Zugleich bleiben die syntaktische Zuordnung von „vor unseren Augen“ und der ausdrückliche Charakter der Bitte um Rache erhalten. Eine Fußnote ist nicht erforderlich, da die deutsche Fassung die relevante hebräische Struktur direkt und natürlich abbildet.
