  text: לָ֤/מָּה יֹאמְר֣וּ הַ/גּוֹיִם֮ אַיֵּ֪ה אֱֽלֹהֵ֫י/הֶ֥ם יִוָּדַ֣ע ב/גיים לְ/עֵינֵ֑י/נוּ נִ֝קְמַ֗ת דַּֽם עֲבָדֶ֥י/ךָ הַ/שָּׁפֽוּךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/010.yaml
  text: Why should the nations say[b][a], “Where is their God?” Let the vengeance of your servants' shed blood be made known among the nations before our eyes.
translation:
  language: de
  text: 'Warum sollen die Völker sagen: »Wo ist ihr Gott?« Möge unter den Völkern vor unseren Augen die Rache für das vergossene Blut deiner Diener bekannt werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ
  choice: Warum sollen … sagen
  rationale: Die Formulierung gibt den rhetorischen Protest und den kontextuellen Wunsch wieder, den Völkern keinen Anlass zu diesem Spott zu lassen.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: Gemeint sind die fremden Nationen; „Völker“ ist im Deutschen natürlich und vermeidet eine spätere religiös-ethnische Engführung.
- source_word: אַיֵּה אֱלֹהֵיהֶם
  choice: Wo ist ihr Gott?
  rationale: Die knappe Ortsfrage bewahrt den spöttischen Ton des hebräischen Zurufs.
- source_word: יִוָּדַע
  choice: soll … bekannt werden
  rationale: Das Nifal wird passiv wiedergegeben und zugleich als Gebetswunsch verständlich gemacht.
- source_word: בַגּוֹיִם לְעֵינֵינוּ
  choice: Vor unseren Augen … unter den Völkern
  rationale: „Unter den Völkern“ bezeichnet den öffentlichen Bereich des Bekanntwerdens; „vor unseren Augen“ betont, dass die Betenden es selbst sichtbar erleben wollen.
- source_word: נִקְמַת
  choice: wie … gerächt wird
  rationale: Die verbale Wiedergabe klingt im modernen Deutsch natürlicher als „die Rache des Blutes“, ohne den ausdrücklichen Gedanken göttlicher Vergeltung abzuschwächen.
- source_word: דַּם עֲבָדֶיךָ הַשָּׁפוּךְ
  choice: das vergossene Blut deiner Diener
  rationale: Die Wortgruppe wird eng am Hebräischen und in geläufiger deutscher Ausdrucksweise wiedergegeben; „Diener“ passt zur Beziehung der Betenden zu Gott.
theological_decisions:
- issue: Bitte um göttliche Vergeltung
  choice: „wie das vergossene Blut deiner Diener gerächt wird“
  alternative: „wie für das vergossene Blut deiner Diener Gerechtigkeit geschaffen wird“
  rationale: נקמה bezeichnet ausdrücklich Rache beziehungsweise Vergeltung. Eine bloße Wiedergabe mit „Gerechtigkeit“ würde die imprekatorische Schärfe des Gebets abschwächen.
- issue: Syntaktische Zuordnung von לְעֵינֵינוּ
  choice: „Vor unseren Augen“ auf das öffentliche Bekanntwerden der Vergeltung beziehen
  alternative: Die Wendung unmittelbar mit der Vergeltung verbinden
  rationale: Die hebräische Wortfolge lässt eine gewisse Zuordnungsbreite zu. Die gewählte Stellung macht deutlich, dass die Betenden Gottes vergeltendes Handeln selbst sehen möchten, ohne die Alternative auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und spöttisch. „Rächen“ bewahrt die Härte des hebräischen נקמה; die Verbalkonstruktion vermeidet zugleich die im Deutschen missverständliche Formulierung „Rache des Blutes“.
