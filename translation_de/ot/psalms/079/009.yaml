  text: עָזְרֵ֤/נוּ אֱלֹ֘הֵ֤י יִשְׁעֵ֗/נוּ עַל דְּבַ֥ר כְּבֽוֹד שְׁמֶ֑/ךָ וְ/הַצִּילֵ֥/נוּ וְ/כַפֵּ֥ר עַל חַ֝טֹּאתֵ֗י/נוּ לְמַ֣עַן שְׁמֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/009.yaml
  text: Help us[a], God of our salvation, for the glory of your name[b]; deliver us and atone for our sins for your name’s sake.
translation:
  language: de
  text: Hilf uns, Gott unseres Heils, um der Herrlichkeit deines Namens willen; rette uns und sühne unsere Sünden um deines Namens willen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָזְרֵנוּ
  choice: Hilf uns
  rationale: Der Imperativ mit Suffix der 1. Person Plural wird direkt und natürlich wiedergegeben.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: Gott unseres Heils
  rationale: Bewahrt die hebräische Genitivverbindung und einen würdigen, im Deutschen verständlichen Psalmton.
- source_word: עַל דְּבַר כְּבוֹד שְׁמֶךָ
  choice: um der Herrlichkeit deines Namens willen
  rationale: Gibt den Grund beziehungsweise Beweggrund des erbetenen Handelns wieder und hält כבוד und שם begrifflich auseinander.
- source_word: וְהַצִּילֵנוּ
  choice: rette uns
  rationale: נצל im Hifil bezeichnet hier die Befreiung aus Bedrängnis; „rette“ ist gegenwärtig, klar und dringlich.
- source_word: וְכַפֵּר עַל
  choice: schaffe Sühne für
  rationale: Bewahrt die Sühnebedeutung von כפר, statt sie auf bloßes Vergeben zu reduzieren, ohne einen bestimmten Mechanismus der Sühne hinzuzufügen.
- source_word: חַטֹּאתֵינוּ
  choice: unsere Sünden
  rationale: Entspricht dem Plural mit Suffix der 1. Person Plural.
- source_word: לְמַעַן שְׁמֶךָ
  choice: um deines Namens willen
  rationale: Gibt die geläufige Berufung auf Gottes Namen, das heißt seinen Charakter und seine Ehre, idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von כפר in der Bußbitte
  choice: schaffe Sühne für unsere Sünden
  alternative: vergib unsere Sünden; sühne unsere Sünden
  rationale: „Schaffe Sühne“ erhält das kultisch-theologische Gewicht des Verbs und lässt offen, auf welche Weise die Sühne bewirkt wird. „Vergib“ wäre semantisch enger; „sühne“ könnte im heutigen Deutsch missverständlich so klingen, als seien die Sünden selbst die handelnde oder leidende Größe.
- issue: Beweggrund des göttlichen Handelns
  choice: um der Herrlichkeit deines Namens willen … um deines Namens willen
  alternative: wegen der Herrlichkeit deines Namens … deines Namens wegen
  rationale: Die doppelte Berufung auf Gottes Namen bleibt erhalten und gründet die Bitte in Gottes Ehre, nicht im Verdienst der Bittenden.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Psalmton. „Gott unseres Heils“ ist bewusst etwas feierlicher, aber allgemein verständlich. Die Wiederholung „um … willen“ bildet die doppelte Namensmotivation des Hebräischen ab; ein Fußnotenapparat ist für diesen Einzelvers nicht erforderlich.
