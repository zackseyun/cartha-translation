lexical_decisions:
- source_word: וְהָשֵׁב
  choice: Und zahl … heim
  rationale: Der Hifil-Imperativ von שוב fordert hier, etwas auf die Täter zurückfallen zu lassen. „Heimzahlen“ gibt den Vergeltungssinn im Deutschen natürlich und deutlich wieder.
- source_word: לִשְׁכֵנֵינוּ
  choice: unseren Nachbarn
  rationale: Die Wendung bezeichnet die ringsum wohnenden Nachbarn und meint im Zusammenhang wohl benachbarte Völker; die Übersetzung bewahrt die offene Bezeichnung des Hebräischen.
- source_word: שִׁבְעָתַיִם
  choice: siebenfach
  rationale: Die adverbiale Form bedeutet „siebenfach“ beziehungsweise „siebenmal“ und unterstreicht das volle Maß der erbetenen Vergeltung.
- source_word: אֶל חֵיקָם
  choice: in ihren Schoß
  rationale: חֵיק bezeichnet Schoß oder Brustbereich. Das Bild stellt dar, dass die Schmach auf sie selbst zurückkommt; „Schoß“ bewahrt diese hebräische Metapher.
- source_word: חֶרְפָּתָם
  choice: die Schmach
  rationale: Das Substantiv bezeichnet entehrende Schmähung. „Schmach“ passt zum würdevollen poetischen Register und lässt sich durch die Wiederaufnahme im Relativsatz verständlich zuordnen.
- source_word: אֲשֶׁר חֵרְפוּךָ
  choice: mit der sie dich verhöhnt haben
  rationale: Das Verb חרף bezeichnet höhnendes Schmähen. Im Deutschen wäre eine etymologische Wiederholung mit „Schmach/schmähen“ möglich, klänge hier jedoch steif; „verhöhnt“ gibt den natürlichen Sinn wieder.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: אֲדֹנָי ist die direkte Anrede Gottes als „Herr“. Die deutsche Wortstellung kennzeichnet den Vokativ ohne ein zusätzliches, heute gehoben-archaisch wirkendes „o“.
theological_decisions:
- issue: Bitte um siebenfache Vergeltung
  choice: Die unmittelbare Bitte um göttliche Heimzahlung bleibt ungemildert stehen.
  alternative: Als allgemeine Bitte um Gerechtigkeit umschreiben.
  rationale: Der hebräische Text formuliert ausdrücklich eine Vergeltungsbitte. Die Übersetzung bewahrt diese theologische Spannung, ohne sie zu billigen, abzuschwächen oder dogmatisch zu erklären.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. „Heimzahlen“ ist gegenwärtig verständlich und gibt den Vergeltungssinn wieder; der Gedankenstrich macht die im Hebräischen gedrängte Bildfügung lesbar. Die Schoß-Metapher bleibt erhalten.
