id: PSA.79.6
reference: Psalms 79:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שְׁפֹ֤ךְ חֲמָתְ/ךָ֨ אֶֽל הַ/גּוֹיִם֮ אֲשֶׁ֪ר לֹא יְדָ֫ע֥וּ/ךָ וְ/עַ֥ל מַמְלָכ֑וֹת אֲשֶׁ֥ר בְּ֝/שִׁמְ/ךָ֗ לֹ֣א קָרָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/006.yaml
  text: Pour out your wrath on the nations that do not know you[b][a], and on the kingdoms that do not call on your name.
translation:
  language: de
  text: Gieße deinen Zorn über die Völker aus, die dich nicht kennen[a], und über die Königreiche, die deinen Namen nicht anrufen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die dich nicht anerkennen“. Das hebräische Wort für „kennen“ kann eine persönliche, relationale Anerkennung bezeichnen, nicht nur verstandesmäßiges Wissen.'
    reason: lexical_alternative
  - marker: b
    text: „Den Namen anrufen“ bezeichnet hier die betende Anrufung oder Verehrung Gottes.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפֹךְ
  choice: Gieße … aus
  rationale: Der Imperativ bewahrt das anschauliche Bild, dass Gottes Zorn wie eine Flüssigkeit über die Betroffenen ausgegossen wird.
- source_word: חֲמָתְךָ
  choice: deinen Zorn
  rationale: חֵמָה bezeichnet heftigen, glühenden Zorn; „Zorn“ ist im Deutschen würdig, verständlich und kontextgemäß.
- source_word: אֶל / וְעַל
  choice: über … und über
  rationale: In Verbindung mit „ausgießen“ gibt „über“ die Zielrichtung idiomatisch wieder und erhält den Parallelismus.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: גּוֹיִם bezeichnet hier fremde Völker; „Völker“ vermeidet spätere Assoziationen von „Heiden“ und passt zum poetischen Parallelismus.
- source_word: אֲשֶׁר לֹא יְדָעוּךָ
  choice: die dich nicht kennen
  rationale: Die direkte Wiedergabe bewahrt sowohl die gewöhnliche Bedeutung „kennen“ als auch die mögliche relationale Nuance des Anerkennens.
- source_word: מַמְלָכוֹת
  choice: die Königreiche
  rationale: מַמְלָכוֹת bezeichnet politische Herrschaftsgebiete; „Königreiche“ ist die klare formale Entsprechung.
- source_word: אֲשֶׁר בְּשִׁמְךָ לֹא קָרָאוּ
  choice: die deinen Namen nicht anrufen
  rationale: קרא בשם ist eine feste Wendung für betendes Anrufen beziehungsweise gottesdienstliche Hinwendung; „den Namen anrufen“ erhält das biblische Sprachbild.
theological_decisions:
- issue: Bedeutung des Kennens Gottes bei den Völkern
  choice: „die dich nicht kennen“
  alternative: „die dich nicht anerkennen“
  rationale: יָדַע kann relationale Anerkennung einschließen, doch die offenere Wiedergabe „kennen“ bewahrt die theologische Spannung und verengt die Aussage nicht auf einen einzelnen Aspekt.
- issue: Bedeutung des Anrufens des göttlichen Namens
  choice: „die deinen Namen nicht anrufen“
  alternative: „die sich nicht im Gebet an dich wenden“
  rationale: Die gewählte Form erhält die hebräische Namensformel und lässt ihren Bedeutungsumfang von Gebet, Anrufung und Verehrung bestehen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewahrtem poetischem Parallelismus. Die traditionelle Bildsprache „Zorn ausgießen“ und „den Namen anrufen“ bleibt verständlich und quellennah.
