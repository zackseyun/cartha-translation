source:
  edition: WLC
  text: כִּ֭י אָכַ֣ל אֶֽת יַעֲקֹ֑ב וְֽ/אֶת נָוֵ֥/הוּ הֵשַֽׁמּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/007.yaml
  text: For they have devoured Jacob and laid waste his dwelling place[a].
translation:
  language: de
  text: Denn sie haben Jakob verschlungen und seine Wohnstätte verwüstet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn sie haben Jakob verzehrt und seine Wohnstätte öde gemacht.“'
    reason: Lexikalische Alternativen für אָכַל und הֵשַׁמּוּ.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung für die vorausgehende Bitte ein und wahrt den erklärenden Zusammenhang in natürlichem deutschem Psalmstil.
- source_word: אָכַל
  choice: haben verschlungen
  rationale: Das Verb bedeutet wörtlich „essen“, bezeichnet in diesem feindlichen Bild aber gewaltsames Verzehren oder Vernichten. „Verschlungen“ bewahrt die Bildhaftigkeit und Härte.
- source_word: אֶת יַעֲקֹב
  choice: Jakob
  rationale: Der poetische Bundesname des hebräischen Textes bleibt erhalten, statt ihn deutend durch „Israel“ oder „die Nachkommen Jakobs“ zu ersetzen.
- source_word: נָוֵהוּ
  choice: seine Wohnstätte
  rationale: נָוֶה kann Wohnort, Heimstätte oder Weide bezeichnen. „Wohnstätte“ bewahrt hier den räumlichen Sinn und legt den Ausdruck nicht unnötig auf den Tempel fest.
- source_word: הֵשַׁמּוּ
  choice: verwüstet
  rationale: Die Hifil-Form bezeichnet das Herbeiführen von Verwüstung. „Verwüstet“ ist prägnant, kräftig und in modernem Deutsch natürlich.
theological_decisions:
- issue: Bezug von „seine Wohnstätte“
  choice: Als Wohnstätte Jakobs beziehungsweise Israels verstanden, ohne sie näher einzugrenzen.
  alternative: Speziell der Tempel oder allgemein das Land.
  rationale: Das Suffix bezieht sich am natürlichsten auf Jakob in der parallelen Aussage. Der weitere Psalmzusammenhang lässt Tempel oder Land mitanklingen, doch der Vers selbst verlangt keine solche Verengung.
translation_notes:
  register: Moderner, würdevoller Psalmstil. „Verschlungen“ erhält das gewaltsame Bild; „Wohnstätte“ ist gehoben, aber allgemein verständlich und wahrt die sachliche Offenheit des hebräischen Ausdrucks.
