  text: נָֽתְנ֡וּ אֶת נִבְלַ֬ת עֲבָדֶ֗י/ךָ מַ֭אֲכָל לְ/ע֣וֹף הַ/שָּׁמָ֑יִם בְּשַׂ֥ר חֲ֝סִידֶ֗י/ךָ לְ/חַיְת/וֹ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/002.yaml
  text: They have given the corpses of your servants as food to the birds of the heavens[b][a], the flesh of your faithful ones to the beasts of the earth.
translation:
  language: de
  text: Sie haben die Leichen deiner Diener den Vögeln des Himmels als Nahrung gegeben, das Fleisch deiner Getreuen[a] den Tieren der Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deiner Frommen“, „deiner Heiligen“ oder „der dir Treuen“. Das hebräische Wort bezeichnet Menschen, die Gott in treuer, hingebungsvoller Verbundenheit zugehören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְנוּ
  choice: Sie haben … gegeben
  rationale: Das Qal Perfekt 3. Person Plural bezeichnet die vollendete feindliche Handlung; das deutsche Perfekt wirkt in der gegenwärtigen Klage natürlich und bewahrt den abgeschlossenen Sinn.
- source_word: נִבְלַת
  choice: die Leichen
  rationale: נְבֵלָה bezeichnet einen Leichnam beziehungsweise Kadaver. „Leichen“ ist bei Menschen idiomatisch und vermittelt die Schande der unbestatteten Toten.
- source_word: עֲבָדֶיךָ
  choice: deiner Diener
  rationale: Im Gebet zu Gott bezeichnet עֶבֶד hier Menschen, die ihm angehören und dienen; „Diener“ ist im Psalmenkontext angemessener als „Sklaven“.
- source_word: מַאֲכָל
  choice: zum Fraß
  rationale: Im Zusammenhang mit Vögeln, die Leichen fressen, gibt „Fraß“ die brutale Bildsprache idiomatisch und eindringlich wieder.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: den Vögeln des Himmels
  rationale: עוֹף ist kollektiv für Flugtiere beziehungsweise Vögel; „Vögel des Himmels“ bewahrt die hebräische poetische Wendung.
- source_word: בְּשַׂר
  choice: das Fleisch
  rationale: Die wörtliche Wiedergabe bewahrt die drastische Körperlichkeit und den Parallelismus zu „Leichen“.
- source_word: חֲסִידֶיךָ
  choice: deiner Getreuen
  rationale: חָסִיד bezeichnet hier Menschen, die Gott in loyaler, hingebungsvoller Verbundenheit zugehören. „Getreue“ bewahrt diese Bedeutung in würdigem poetischem Deutsch.
- source_word: לְחַיְתוֹ אָרֶץ
  choice: den wilden Tieren der Erde
  rationale: חַיְתוֹ־אָרֶץ meint hier die Tiere des Landes, im Kontext wohl aasfressende Wildtiere. Die Wiedergabe ist klar und erhält den Parallelismus mit den Himmelsvögeln.
theological_decisions:
- issue: Wiedergabe der Bundes- und Loyalitätsbezeichnung חֲסִידֶיךָ
  choice: deiner Getreuen
  alternative: deiner Frommen; deiner Heiligen; der dir Treuen
  rationale: „Getreue“ bringt loyale Hingabe an Gott zum Ausdruck, ohne den Ausdruck auf kultische Heiligkeit oder eine spätere kirchliche Kategorie festzulegen. Die Fußnote hält die echte Bedeutungsbreite offen.
translation_notes:
  register: Modernes, würdiges poetisches Standarddeutsch. Die drastischen Bilder des unbestatteten Fleisches bleiben erhalten; „zum Fraß“ ist bewusst kräftig, aber nicht archaisch. Der Parallelismus zwischen Himmel und Erde wird bewahrt.
