  naturalness: Die Formulierung ist modernes, gut verständliches Deutsch. „Tröster“ ist möglich, wirkt in heutiger Standardsprache jedoch etwas substantiviert und weniger natürlich als „um dich zu trösten“. Die revidierte Fassung bewahrt den würdigen Erzählton bei flüssigerem Satzbau.
  terminology: „Fürsten“, „Ehre erweisen“, „Diener“, „erkunden“ und „ausspionieren“ passen zum politischen und erzählerischen Kontext. Für וּלְהָפֵךְ ist „umzustürzen“ als kontextuelle Deutung vertretbar; die Anmerkung sollte jedoch die lexikalische Alternative knapp und ohne die unzutreffende Erweiterung „durchwühlen“ nennen.
