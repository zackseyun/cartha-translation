translation_notes:
  register: Moderne, würdige Erzählsprache. Die erste rhetorische Frage wird mit »Meinst du« natürlich wiedergegeben; »nicht vielmehr« macht den im Hebräischen angelegten scharfen Gegensatz deutlich. Die dreigliedrige Aufzählung der unterstellten Absichten bleibt erhalten.
