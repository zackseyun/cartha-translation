base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/003.yaml
  text: But the princes of the Ammonites said to Hanun[a], “Is David honoring your father in your sight because he has sent comforters to you? Have not his servants come to you in order to search out, to overthrow[b], and to spy out the land?”
translation:
  language: de
  text: 'Aber die Fürsten der Ammoniter sagten zu Hanun: »Ehrt David deinen Vater in deinen Augen dadurch, dass er Boten gesandt hat, um dich zu trösten? Sind seine Diener nicht zu dir gekommen, um das Land zu erkunden, es umzustürzen[a] und auszuspionieren?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »es umzukehren«. Das hebräische Verb bedeutet wörtlich »umwenden« oder »umstürzen«; im Zusammenhang kann es eine feindliche Umwälzung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: Fürsten
  rationale: Bezeichnet hochrangige Herrscher oder Amtsträger und bewahrt den höfisch-politischen Rang.
- source_word: הַמְכַבֵּד ... בְּעֵינֶיךָ
  choice: Meinst du, David erweise ... Ehre
  rationale: Gibt die rhetorische Frage und die hebräische Wahrnehmungsformel idiomatisch wieder, ohne die Behauptung als objektive Tatsache darzustellen.
- source_word: מְנַחֲמִים
  choice: Tröster
  rationale: Bezeichnet Personen, die nach einem Todesfall Trost spenden; die knappe Personenbezeichnung entspricht dem Hebräischen.
- source_word: לַחְקֹר
  choice: zu erkunden
  rationale: Passt zum Zusammenhang feindlicher Aufklärung und klingt im Deutschen natürlicher als das allgemeinere »zu untersuchen«.
- source_word: וְלַהֲפֹךְ
  choice: es umzustürzen
  rationale: Bewahrt das Bild des Umwendens beziehungsweise Umstürzens und lässt die genaue Art der feindlichen Absicht offen.
- source_word: וּלְרַגֵּל
  choice: auszuspionieren
  rationale: Gibt die Piel-Bedeutung der gezielten geheimen Erkundung klar und idiomatisch wieder.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Bezeichnet hier das Gebiet der Ammoniter, ohne es enger als Staat oder einzelnes Territorium festzulegen.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: Ist die direkte Wiedergabe und lässt offen, ob es sich genauer um Hofbeamte oder Gesandte handelt.
