id: 1CH.19.11
reference: 1 Chronicles 19:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵת֙ יֶ֣תֶר הָ/עָ֔ם נָתַ֕ן בְּ/יַ֖ד אַבְשַׁ֣י אָחִ֑י/ו וַ/יַּ֣עַרְכ֔וּ לִ/קְרַ֖את בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/011.yaml
  text: He put the rest of the troops under the command of Abishai his brother[a], and they drew up in battle formation to meet the Ammonites.
translation:
  language: de
  text: Den Rest der Truppen stellte er unter den Befehl seines Bruders Abischai[a], und sie stellten sich den Ammonitern zum Kampf entgegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gab er in die Hand seines Bruders Abischai“; damit ist gemeint, dass er ihm die Befehlsgewalt übertrug.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: den Rest der Truppen
  rationale: יֶתֶר bezeichnet den Rest oder den verbleibenden Teil. הָעָם bedeutet wörtlich „das Volk“, meint im militärischen Zusammenhang jedoch die noch übrigen Truppen.
- source_word: נָתַן בְּיַד
  choice: stellte ... unter den Befehl
  rationale: Die Wendung bedeutet wörtlich „gab in die Hand“ und bezeichnet hier die Übertragung von Befehlsgewalt.
- source_word: אַבְשַׁי אָחִיו
  choice: seines Bruders Abischai
  rationale: Die natürliche deutsche Wortstellung gibt die Beziehung eindeutig wieder; „Abischai“ ist die im Deutschen gebräuchliche Namensform.
- source_word: וַיַּעַרְכוּ
  choice: sie stellten sich ... zum Kampf entgegen
  rationale: ערך bezeichnet in militärischem Zusammenhang das Aufstellen oder Formieren zum Kampf. Die Formulierung verbindet diesen Sinn natürlich mit לִקְרַאת.
- source_word: לִקְרַאת
  choice: entgegen
  rationale: לִקְרַאת bedeutet „zur Begegnung mit“ beziehungsweise „entgegen“; der Kampfzusammenhang macht die feindliche Konfrontation deutlich.
- source_word: בְּנֵי עַמּוֹן
  choice: den Ammonitern
  rationale: Die wörtliche Bezeichnung „Söhne Ammons“ fungiert als Volksname und wird im Deutschen natürlich mit „Ammoniter“ wiedergegeben.
