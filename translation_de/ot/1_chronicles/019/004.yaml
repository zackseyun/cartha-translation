  text: וַ/יִּקַּ֨ח חָנ֜וּן אֶת עַבְדֵ֤י דָוִיד֙ וַֽ/יְגַלְּחֵ֔/ם וַ/יִּכְרֹ֧ת אֶת מַדְוֵי/הֶ֛ם בַּ/חֵ֖צִי עַד הַ/מִּפְשָׂעָ֑ה וַֽ/יְשַׁלְּחֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/004.yaml
  text: So Hanun took David’s servants[a], shaved them, cut their garments in half up to the hips[b], and sent them away.
translation:
  language: de
  text: Da nahm Hanun Davids Diener[a], rasierte sie, schnitt ihre Gewänder zur Hälfte ab, bis zum Gesäß[b], und schickte sie fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Parallelbericht in 2. Samuel 10,4 heißt es genauer, dass Hanun ihnen jeweils die Hälfte des Bartes abrasieren ließ. Der Chroniktext sagt nur, dass er sie rasierte.
    reason: cross_reference
  - marker: b
    text: 'Oder: „bis zum Hinterteil“. Das hebräische Wort bezeichnet den Bereich des Gesäßes; durch das Abschneiden der Gewänder wurden die Männer öffentlich bloßgestellt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: Diener
  rationale: Das Substantiv kann Diener oder Sklaven bezeichnen. Hier sind Männer im königlichen Dienst Davids gemeint, die als Gesandte auftreten; ihr rechtlicher Status steht nicht im Mittelpunkt.
- source_word: וַיְגַלְּחֵם
  choice: rasierte sie
  rationale: Das Verb bedeutet „rasieren/scheren“. Da der Chroniktext das rasierte Körperteil nicht nennt, wird die genauere Angabe aus 2. Samuel 10,4 nicht in den Haupttext übernommen.
- source_word: מַדְוֵיהֶם
  choice: ihre Gewänder
  rationale: Der Ausdruck bezeichnet Kleidung, möglicherweise ihre amtliche Kleidung. „Gewänder“ wahrt den leicht gehobenen Erzählstil.
- source_word: בַּחֵצִי
  choice: zur Hälfte ab
  rationale: Die Formulierung beschreibt, dass ein erheblicher Teil der Gewänder abgeschnitten wurde. Die deutsche Wendung gibt die Halbierung verständlich wieder, ohne den Vorgang unnötig auszudeuten.
- source_word: עַד הַמִּפְשָׂעָה
  choice: bis zum Gesäß
  rationale: Das seltene Substantiv bezeichnet den Bereich des Gesäßes beziehungsweise Hinterteils. Die Übersetzung bewahrt die körperliche Konkretheit und den beschämenden Charakter der Handlung.
- source_word: וַיְשַׁלְּחֵם
  choice: schickte sie fort
  rationale: Das Verb bedeutet „senden/schicken“. „Fortschicken“ gibt in diesem Zusammenhang auch den abweisenden Abschluss der Demütigung wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter Wiedergabe der öffentlichen Demütigung. Die im Chroniktext vorhandene Unbestimmtheit darüber, was genau rasiert wurde, bleibt im Haupttext erhalten.
