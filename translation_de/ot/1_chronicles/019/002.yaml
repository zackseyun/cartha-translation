  text: וַ/יֹּ֨אמֶר דָּוִ֜יד אֶֽעֱשֶׂה חֶ֣סֶד עִם חָנ֣וּן בֶּן נָחָ֗שׁ כִּֽי עָשָׂ֨ה אָבִ֤י/ו עִמִּ/י֙ חֶ֔סֶד וַ/יִּשְׁלַ֥ח דָּוִ֛יד מַלְאָכִ֖ים לְ/נַחֲמ֣/וֹ עַל אָבִ֑י/ו וַ/יָּבֹאוּ֩ עַבְדֵ֨י דָוִ֜יד אֶל אֶ֧רֶץ בְּנֵי עַמּ֛וֹן אֶל חָנ֖וּן לְ/נַחֲמֽ/וֹ־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, because his father showed kindness to me.” So David sent messengers to comfort him concerning his father. And David’s servants came to the land of the Ammonites, to Hanun, to comfort him.
translation:
  language: de
  text: 'Und David sagte: „Ich will Hanun, dem Sohn des Nahasch, Güte erweisen, denn sein Vater hat mir Güte erwiesen.“ Da sandte David Boten, um ihn wegen seines Vaters zu trösten.[a] Und Davids Diener kamen in das Land der Ammoniter zu Hanun, um ihn zu trösten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische lautet wörtlich „wegen seines Vaters“. Gemeint ist, dass Hanun über den Tod seines Vaters getröstet werden sollte.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: Güte
  rationale: In diesem zwischenmenschlichen und politischen Zusammenhang bezeichnet חֶסֶד wohlwollende, loyale Güte. „Güte erweisen“ gibt beide Vorkommen einheitlich und idiomatisch wieder, ohne den Ausdruck auf einen ausdrücklich bundestheologischen Sinn festzulegen.
- source_word: עָשָׂה ... חֶסֶד עִם
  choice: jemandem Güte erweisen
  rationale: Die hebräische Wendung bedeutet idiomatisch, jemandem Güte oder Wohlwollen zu erweisen. Die deutsche Dativkonstruktion ist natürlich und bewahrt den gehobenen Erzählton.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Gemeint sind menschliche Abgesandte Davids. „Boten“ bleibt nahe am allgemeinen Bedeutungsumfang, ohne den stärker amtlichen Status von „Gesandten“ vorauszusetzen.
- source_word: לְנַחֲמוֹ
  choice: um ihn zu trösten
  rationale: נחם bezeichnet hier das Trösten eines Trauernden. Die Zweckkonstruktion gibt den hebräischen Infinitiv klar und natürlich wieder.
- source_word: עַל אָבִיו
  choice: wegen seines Vaters
  rationale: Die Präposition bezeichnet den Anlass des Trostes. Die Formulierung bleibt nahe am Hebräischen; dass der Vater gestorben ist, ergibt sich aus dem Trauerzusammenhang und wird in der Fußnote erläutert.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: das Land der Ammoniter
  rationale: „Ammoniter“ ist die übliche deutsche Volksbezeichnung für בְּנֵי עַמּוֹן; die Wiedergabe bewahrt zugleich den geografischen Ausdruck אֶרֶץ.
- source_word: עַבְדֵי דָוִיד
  choice: Davids Diener
  rationale: עבדים bezeichnet hier Männer in Davids Dienst. „Diener“ ist die direkte Wiedergabe; der Kontext zwingt nicht zu dem spezifischeren „Beamte“ oder „Hofleute“.
- source_word: וַיֹּאמֶר ... וַיִּשְׁלַח ... וַיָּבֹאוּ
  choice: Und David sagte ... Da sandte David ... Und Davids Diener kamen
  rationale: Die Abfolge der Wayyiqtol-Formen wird als fortlaufende Erzählung wiedergegeben. „Da“ macht den Folgezusammenhang zwischen Davids Entschluss und der Entsendung natürlich erkennbar.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „Güte erweisen“ und „trösten“ wurde entsprechend der bewussten Wiederholung im hebräischen Text beibehalten. Der Name נָחָשׁ wird in der im Deutschen verbreiteten Form „Nahasch“ wiedergegeben.
