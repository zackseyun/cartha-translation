  source_fidelity: 'Der Entwurf gibt die hebräische Erzählfolge und die wesentlichen Ausdrücke zuverlässig wieder: חֶסֶד als „Güte“, die menschlichen מַלְאָכִים als „Boten“, die Trauertröstung durch לְנַחֲמוֹ sowie אֶרֶץ בְּנֵי עַמּוֹן als „Land der Ammoniter“. Die Wiederholung von „Güte erweisen“ und „trösten“ entspricht dem Ausgangstext. „Wegen seines Vaters“ bewahrt den im Hebräischen durch עַל אָבִיו bezeichneten Anlass der Tröstung, ohne die Todesursache in den Verskörper einzutragen.'
