translation_notes:
  register: Moderne, würdige Erzählsprache. Die indirekte Mitteilung des Königs wird mit »ließ ihnen sagen« natürlich ausgedrückt. Die nicht genannten Handlungsträger werden weder als bestimmte Boten noch als die gedemütigten Männer identifiziert.
