base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/005.yaml
  text: They went and told David about the men[a], and he sent to meet them, because the men were greatly humiliated. And the king said, “Stay in Jericho until your beards have grown back[b], then return.”
translation:
  language: de
  text: 'Man ging hin und berichtete David von den Männern[a]. Da schickte er ihnen Boten entgegen[b], denn die Männer waren zutiefst gedemütigt. Der König sagte: »Bleibt in Jericho, bis eure Bärte wieder gewachsen sind; dann kehrt zurück.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie gingen hin und berichteten David von den Männern.« Wer David Bericht erstattete, wird im Hebräischen nicht ausdrücklich gesagt.'
    reason: Die pluralischen Verbformen haben kein genanntes Subjekt; sowohl ein unpersönliches Verständnis als auch die Wiedergabe mit »sie« ist möglich.
  - marker: b
    text: 'Wörtlich: »Da schickte er ihnen entgegen.« Wen David sandte, wird im Hebräischen nicht ausdrücklich gesagt; Boten sind aus dem Zusammenhang naheliegend.'
    reason: Das Objekt zu »schickte« bleibt im Hebräischen unausgedrückt.
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיַּגִּידוּ לְדָוִיד עַל הָאֲנָשִׁים
  choice: Man ging hin und berichtete David von den Männern
  rationale: Die hebräischen Verben stehen im Plural, doch das Subjekt bleibt ungenannt. Das unpersönliche »man« bewahrt diese Offenheit und vermeidet die missverständliche Aussage, die gedemütigten Männer selbst hätten David berichtet.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: Da schickte er ihnen jemanden entgegen
  rationale: Das Objekt von שׁלח ist im Hebräischen nicht genannt. »Jemanden« gibt die syntaktisch vorausgesetzte Person natürlich wieder, ohne sie genauer als Boten zu bestimmen.
- source_word: נִכְלָמִים מְאֹד
  choice: zutiefst gedemütigt
  rationale: Der Niphal von כלם bezeichnet erfahrene Beschämung beziehungsweise Demütigung; מְאֹד verstärkt den Ausdruck. Im Zusammenhang öffentlicher Entehrung trifft »zutiefst gedemütigt« den Sinn.
- source_word: שְׁבוּ בִירֵחוֹ
  choice: Bleibt in Jericho
  rationale: ישׁב bedeutet hier nicht wörtlich »sitzt«, sondern »bleibt« beziehungsweise »haltet euch auf«.
- source_word: עַד אֲשֶׁר יְצַמַּח זְקַנְכֶם
  choice: bis eure Bärte wieder gewachsen sind
  rationale: צמח bedeutet »wachsen, sprießen«. »Wieder« ist durch das Abschneiden der Bärte im vorhergehenden Vers kontextuell begründet; der kollektive Singular זְקַנְכֶם wird im Deutschen natürlich als Plural wiedergegeben.
- source_word: וְשַׁבְתֶּם
  choice: dann kehrt zurück
  rationale: Nach dem mit עַד אֲשֶׁר eingeleiteten Zeitsatz bezeichnet die Verbform die anschließende Handlung; »dann« macht diese zeitliche Folge idiomatisch deutlich.
- source_word: הַמֶּלֶךְ
  choice: Der König
  rationale: Der Titel wird entsprechend dem hebräischen Wortlaut beibehalten und nicht durch Davids Namen ersetzt.
