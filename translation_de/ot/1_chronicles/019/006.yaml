reference: 1 Chronicles 19:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י הִֽתְבָּאֲשׁ֖וּ עִם דָּוִ֑יד וַ/יִּשְׁלַ֣ח חָ֠נוּן וּ/בְנֵ֨י עַמּ֜וֹן אֶ֣לֶף כִּכַּר כֶּ֗סֶף לִ/שְׂכֹּ֣ר לָ֠/הֶם מִן אֲרַ֨ם נַהֲרַ֜יִם וּ/מִן אֲרַ֤ם מַעֲכָה֙ וּ/מִ/צּוֹבָ֔ה רֶ֖כֶב וּ/פָרָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/006.yaml
  text: When the Ammonites saw that they had become odious to David[a], Hanun and the Ammonites sent a thousand talents of silver to hire for themselves chariots and horsemen from Aram-naharaim, from Aram-maacah[b], and from Zobah.
translation:
  language: de
  text: Als die Ammoniter erkannten, dass sie sich David gegenüber verhasst gemacht hatten,[a] schickten Hanun und die Ammoniter tausend Talente Silber, um für sich Streitwagen und Reiter aus Aram-Naharajim,[b] Aram-Maacha und Zoba anzuheuern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „dass sie sich bei David stinkend gemacht hatten“ – eine hebräische Redewendung dafür, dass sie für ihn abstoßend oder verhasst geworden waren.'
    reason: lexical_alternative
  - marker: b
    text: Aram-Naharajim wird traditionell als „Aram der zwei Flüsse“, also als Mesopotamien, verstanden.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: erkannten
  rationale: ראה bedeutet grundsätzlich „sehen“, bezeichnet hier aber das Erfassen ihrer nun feindseligen Lage; „erkannten“ ist im Deutschen natürlich und kontextgerecht.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Die idiomatische Volksbezeichnung gibt „Söhne Ammons“ in modernem Deutsch sachgerecht wieder.
- source_word: הִתְבָּאֲשׁוּ עִם דָּוִיד
  choice: dass sie sich bei David verhasst gemacht hatten
  rationale: Die Wendung bedeutet wörtlich, dass sie sich gegenüber David „stinkend gemacht“ hatten, idiomatisch also, dass sie für ihn anstößig oder verhasst geworden waren. Die gewählte Formulierung erhält ihre eigene Verantwortlichkeit und die Perspektive Davids.
- source_word: וַיִּשְׁלַח
  choice: schickten
  rationale: שלח bezeichnet hier das Übersenden des Silbers als Zahlung; das deutsche „schickten“ bewahrt die schlichte Erzählweise.
- source_word: אֶלֶף כִּכַּר כֶּסֶף
  choice: tausend Talente Silber
  rationale: כִּכָּר ist eine antike Gewichtseinheit. „Talent“ ist die herkömmliche deutsche Wiedergabe; eine unsichere moderne Umrechnung wird vermieden.
- source_word: לִשְׂכֹּר לָהֶם
  choice: um für sich … anzuwerben
  rationale: שׂכר meint das Anheuern gegen Bezahlung; לָהֶם kennzeichnet den Nutzen für sie selbst.
- source_word: אֲרַם נַהֲרַיִם
  choice: Aram-Naharajim
  rationale: Die Transliteration wahrt den Charakter als geografischer Eigenname; seine traditionelle Deutung wird in einer Fußnote erklärt.
- source_word: אֲרַם מַעֲכָה
  choice: Aram-Maacha
  rationale: Der zusammengesetzte Regionsname wird in deutscher Transliteration wiedergegeben.
- source_word: מִצּוֹבָה
  choice: Zoba
  rationale: Der Orts- beziehungsweise Gebietsname wird nach üblicher deutscher biblischer Namensform transliteriert.
- source_word: רֶכֶב
  choice: Streitwagen
  rationale: Das kollektiv gebrauchte Singularwort bezeichnet hier die für den Krieg angeworbenen Wagen; der deutsche Plural ist natürlich.
- source_word: וּפָרָשִׁים
  choice: Reiter
  rationale: פָרָשִׁים bezeichnet berittene Kämpfer; „Reiter“ ist konkret und weniger modern-militärisch als „Kavallerie“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählstruktur. Die bildhafte hebräische Wendung wird idiomatisch im Haupttext und wörtlich in der Fußnote wiedergegeben. Die Fußnotenzuordnung der englischen Konsultationsfassung war offenbar vertauscht; im deutschen Entwurf stehen die Marker bei den jeweils sachlich passenden Ausdrücken.
