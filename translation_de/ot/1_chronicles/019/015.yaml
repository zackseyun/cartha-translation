  terminology: „Ammoniter“, „Aramäer“, „Abischai“ und „Joab“ sind im Deutschen geläufig und konsistent. „Abischai, Joabs Bruder“ löst den im Hebräischen kontextuell auf Joab bezogenen pronominalen Rückverweis klar auf, ohne den Sinn zu verändern.
