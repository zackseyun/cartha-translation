  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des Hebräischen zuverlässig wieder: Die Ammoniter nehmen die Flucht der aramäischen Streitkräfte wahr, fliehen ihrerseits vor Abischai, gehen in die Stadt, und Joab kommt nach Jerusalem. Das Plusquamperfekt „geflohen waren“ bildet die vorzeitige Wahrnehmung im Deutschen angemessen ab.'
