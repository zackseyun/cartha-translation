id: 1CH.19.15
reference: 1 Chronicles 19:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְנֵ֨י עַמּ֤וֹן רָאוּ֙ כִּי נָ֣ס אֲרָ֔ם וַ/יָּנ֣וּסוּ גַם הֵ֗ם מִ/פְּנֵי֙ אַבְשַׁ֣י אָחִ֔י/ו וַ/יָּבֹ֖אוּ הָ/עִ֑ירָ/ה וַ/יָּבֹ֥א יוֹאָ֖ב יְרוּשָׁלִָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/015.yaml
  text: When the Ammonites saw that Aram had fled[a], they also fled before Abishai his brother and entered the city[b]. Then Joab came to Jerusalem.
translation:
  language: de
  text: Als die Ammoniter sahen, dass die Aramäer geflohen waren, flohen auch sie vor Abischai, Joabs Bruder, und zogen sich in die Stadt zurück. Danach kam Joab nach Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Die hebräische Wendung »Söhne Ammons« bezeichnet das Volk; das deutsche Ethnonym gibt den Sinn natürlich und genau wieder.
- source_word: רָאוּ כִּי
  choice: sahen, dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was die Ammoniter wahrnahmen.
- source_word: נָס אֲרָם
  choice: die Aramäer geflohen waren
  rationale: אֲרָם bezeichnet hier kollektiv die aramäischen Truppen. Das Plusquamperfekt macht die zeitliche Abfolge im Deutschen deutlich.
- source_word: וַיָּנוּסוּ גַם הֵם מִפְּנֵי
  choice: flohen auch sie vor
  rationale: Die Formulierung bewahrt sowohl die vergleichende Hervorhebung von גַם הֵם als auch den militärischen Sinn von מִפְּנֵי.
- source_word: אַבְשַׁי אָחִיו
  choice: Abischai, Joabs Bruder
  rationale: Das Suffix »sein Bruder« bezieht sich im Erzählzusammenhang auf Joab; die explizite Namensnennung verhindert im Deutschen einen unklaren Rückbezug.
- source_word: וַיָּבֹאוּ הָעִירָה
  choice: zogen sich in die Stadt zurück
  rationale: Die Richtungsendung bezeichnet Bewegung in die Stadt hinein; »zogen sich … zurück« bringt im militärischen Zusammenhang den Rückzug in ihren Schutz natürlich zum Ausdruck.
- source_word: וַיָּבֹא יוֹאָב יְרוּשָׁלִָם
  choice: Danach kam Joab nach Jerusalem
  rationale: »Danach« gibt den Erzählfortschritt wieder, während »kam« dem einfachen hebräischen Verb entspricht, ohne ein nicht ausdrücklich genanntes »kehrte zurück« einzuführen.
