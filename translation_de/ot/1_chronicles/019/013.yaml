  text: חֲזַ֤ק וְ/נִֽתְחַזְּקָה֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה הַ/טּ֥וֹב בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/013.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: de
  text: Sei stark[a], und lasst uns stark sein für unser Volk und für die Städte unseres Gottes. Und Jahwe möge tun, was in seinen Augen gut ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sei mutig“. Der folgende Ausdruck kann auch mit „lasst uns uns stärken“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Und Jahwe wird tun, was in seinen Augen gut ist.“ Die hebräische Verbform kann hier als Wunsch oder als Zukunftsaussage verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: Sei stark
  rationale: Der Qal-Imperativ 2. Person Maskulin Singular fordert unmittelbar zu Stärke und Mut auf. „Sei stark“ ist knapp, würdevoll und entspricht der Wiederaufnahme des Stammes חזק im folgenden Verb.
- source_word: וְנִתְחַזְּקָה
  choice: und lasst uns mutig … eintreten
  rationale: Der Hitpael-Kohortativ bezeichnet gemeinsames entschlossenes Sichstärken bzw. Sichbehaupten. Im militärischen Zusammenhang gibt „mutig … eintreten“ die selbstverpflichtende und aktive Nuance natürlich wieder.
- source_word: בְּעַד
  choice: für
  rationale: Die Präposition bezeichnet hier das Handeln zugunsten bzw. zur Verteidigung von Volk und Städten. Das deutsche „für“ deckt diesen Sinn knapp und idiomatisch ab.
- source_word: עַמֵּנוּ
  choice: unser Volk
  rationale: עַם bezeichnet das Volk insgesamt, nicht lediglich das Heer.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: die Städte unseres Gottes
  rationale: Die Genitivkonstruktion bewahrt die Aussage, dass die Städte Gott zugeordnet sind.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im modernen Deutschen geläufige wissenschaftliche Form.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: was gut ist in seinen Augen
  rationale: Die Wiedergabe bewahrt das hebräische Bild und bleibt im Deutschen verständlich.
- source_word: יַעֲשֶׂה
  choice: möge tun
  rationale: 'Der Imperfekt kann nach den vorausgehenden Aufforderungen volitiv verstanden werden: Der Ausgang wird Jahwe anheimgestellt. Die mögliche futurische Lesart wird in einer Fußnote genannt.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Charakter als Eigenname.
- issue: Modalität von יַעֲשֶׂה im Schlusssatz
  choice: Jahwe aber möge tun
  alternative: Jahwe aber wird tun
  rationale: Die volitive Wiedergabe passt zur Verbindung von menschlicher Entschlossenheit und demütiger Überlassung des Ausgangs an Gott. Da die Verbform auch futurisch verstanden werden kann, bleibt diese Möglichkeit durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mutig … eintreten“ vermeidet die im Deutschen schwerfällige Wiederholung „Sei stark, und lasst uns stark sein“, ohne die aktive, gemeinschaftliche Entschlossenheit des Hitpael-Kohortativs abzuschwächen. Das „aber“ markiert natürlich den Übergang von menschlicher Verantwortung zu Gottes Entscheidung.
