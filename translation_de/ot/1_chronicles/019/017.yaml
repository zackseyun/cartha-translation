source:
  edition: WLC
  text: וַ/יֻּגַּ֣ד לְ/דָוִ֗יד וַ/יֶּאֱסֹ֤ף אֶת כָּל יִשְׂרָאֵל֙ וַ/יַּעֲבֹ֣ר הַ/יַּרְדֵּ֔ן וַ/יָּבֹ֣א אֲלֵ/הֶ֔ם וַֽ/יַּעֲרֹ֖ךְ אֲלֵ/הֶ֑ם וַ/יַּעֲרֹ֨ךְ דָּוִ֜יד לִ/קְרַ֤את אֲרָם֙ מִלְחָמָ֔ה וַ/יִּֽלָּחֲמ֖וּ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, came against them, and drew up in battle formation against them. Then David drew up for battle to meet Aram, and they fought with him.
translation:
  language: de
  text: Als David davon erfuhr, versammelte er ganz Israel, überquerte den Jordan, rückte gegen sie vor und stellte sich ihnen in Schlachtordnung entgegen. Dann stellte sich David zum Kampf auf, um Aram entgegenzutreten, und sie kämpften gegen ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִיד
  choice: Als David davon berichtet wurde
  rationale: Die unpersönliche Passivform bleibt erhalten; „davon“ nimmt den vorausgehenden Sachverhalt auf, ohne einen Berichterstatter zu ergänzen.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: versammelte er ganz Israel
  rationale: „Versammeln“ gibt אָסַף natürlich wieder und lässt den militärischen Aufgebotscharakter aus dem Kontext hervorgehen.
- source_word: וַיַּעֲבֹר הַיַּרְדֵּן
  choice: überquerte den Jordan
  rationale: Knappes und idiomatisches Deutsch für das Überschreiten des Flusses.
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: rückte gegen sie vor
  rationale: Die feindliche Bewegung wird im militärischen Zusammenhang deutlich, ohne übermäßig frei zu formulieren.
- source_word: וַיַּעֲרֹךְ אֲלֵיהֶם
  choice: stellte sich ihnen in Schlachtordnung entgegen
  rationale: ערך bezeichnet hier das Ordnen beziehungsweise Aufstellen zum Kampf; die Wiedergabe macht den militärischen Sinn verständlich.
- source_word: וַיַּעֲרֹךְ דָּוִיד לִקְרַאת אֲרָם מִלְחָמָה
  choice: So stellte sich David zum Kampf auf, um Aram entgegenzutreten
  rationale: Die Wiederholung von ערך wird durch „stellte sich … auf“ gewahrt; לִקְרַאת bleibt mit „entgegenzutreten“ in seiner Begegnungs- und Gegenrichtung erkennbar, während מִלְחָמָה ausdrücklich als Kampf erscheint.
- source_word: אֲרָם
  choice: Aram
  rationale: Der hebräische Eigenname wird beibehalten und weder durch das spätere „Syrien“ noch durch das interpretierende „Aramäer“ ersetzt.
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: und sie kämpften gegen ihn
  rationale: Obwohl עִם wörtlich „mit“ bedeutet, bezeichnet die Verbindung mit לחם hier idiomatisch den Kampf gegen David; „kämpften mit ihm“ könnte im Deutschen fälschlich ein gemeinsames Kämpfen nahelegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Bedeutung von ערך wird explizit, aber knapp wiedergegeben. Die Satzfolge folgt der hebräischen Erzählbewegung; „So“ verbindet die teilweise wiederholende zweite Aufstellung natürlich mit dem Vorangehenden.
