source:
  edition: WLC
  text: וַ/יַּ֣רְא יוֹאָ֗ב כִּֽי הָיְתָ֧ה פְנֵי הַ/מִּלְחָמָ֛ה אֵלָ֖י/ו פָּנִ֣ים וְ/אָח֑וֹר וַ/יִּבְחַ֗ר מִ/כָּל בָּחוּר֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יַּעֲרֹ֖ךְ לִ/קְרַ֥את אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/010.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose some of the best men from all Israel and arranged them to meet Aram.
translation:
  language: de
  text: Als Joab sah, dass ihm die Schlachtfront vorn und hinten gegenüberstand, wählte er aus den auserlesenen Kriegern ganz Israels[a] einige aus und stellte sie Aram[b] entgegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus allen jungen Männern Israels«. Das hebräische Wort kann junge Männer oder ausgewählte, besonders geeignete Krieger bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind die aramäischen Streitkräfte.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Die Grundbedeutung von ראה passt zum hebräischen Erzählstil und schließt hier das Erkennen der taktischen Lage ein.
- source_word: פְנֵי הַמִּלְחָמָה
  choice: die Schlachtfront
  rationale: Wörtlich bezeichnet die Wendung die »Vorderseite der Schlacht«; im militärischen Zusammenhang gibt »Schlachtfront« die gegnerische Aufstellung natürlich wieder.
- source_word: אֵלָיו פָּנִים וְאָחוֹר
  choice: von vorn und von hinten gegen ihn gerichtet war
  rationale: Die Formulierung wahrt den Gegensatz von vorn und hinten und macht verständlich, dass Joab aus beiden Richtungen bedroht wurde, ohne eine vollständige Einkesselung ausdrücklich zu behaupten.
- source_word: וַיִּבְחַר
  choice: wählte ... aus
  rationale: Dies ist die übliche und im Erzählzusammenhang natürliche Wiedergabe von בחר.
- source_word: מִכָּל בָּחוּר בְּיִשְׂרָאֵל
  choice: aus allen ausgewählten Kriegern Israels einige
  rationale: בָּחוּר kann einen jungen Mann oder einen ausgewählten, besonders geeigneten Kämpfer bezeichnen. Der militärische Kontext spricht für »ausgewählte Krieger«; »einige« gibt den partitiven Gebrauch von מִן wieder.
- source_word: וַיַּעֲרֹךְ
  choice: stellte sie ... auf
  rationale: ערך bezeichnet im militärischen Kontext das geordnete Aufstellen von Truppen.
- source_word: לִקְרַאת אֲרָם
  choice: zum Kampf gegen Aram
  rationale: לִקְרַאת bezeichnet ein Entgegengehen oder Begegnen; der feindliche militärische Zusammenhang wird im Deutschen mit »zum Kampf gegen« klar und natürlich ausgedrückt.
- source_word: אֲרָם
  choice: Aram
  rationale: Der hebräische Eigenname wird bewahrt; im Kontext sind damit die aramäischen Streitkräfte gemeint.
