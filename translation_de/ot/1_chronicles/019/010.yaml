  rationale: Die Revision beseitigt allein die stilistisch redundante Wendung bei der Auswahl der Krieger und fasst die militärische Aufstellung mit dem natürlichen »stellte sie Aram entgegen«. Die Aussage des hebräischen Textes, einschließlich der taktischen Front-vorn-und-hinten-Situation und des partitiven Charakters der Auswahl, bleibt unverändert.
