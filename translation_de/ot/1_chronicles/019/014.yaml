id: 1CH.19.14
reference: 1 Chronicles 19:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּגַּ֨שׁ יוֹאָ֜ב וְ/הָ/עָ֧ם אֲשֶׁר עִמּ֛/וֹ לִ/פְנֵ֥י אֲרָ֖ם לַ/מִּלְחָמָ֑ה וַ/יָּנ֖וּסוּ מִ/פָּנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/014.yaml
  text: So Joab and the people who were with him advanced before Aram for battle[a], and they fled before him.
translation:
  language: de
  text: Da rückten Joab und die Leute, die bei ihm waren, zum Kampf gegen Aram[a] vor, und die Aramäer flohen vor ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vor Aram«; gemeint sein kann auch: »vor den Aramäern« beziehungsweise »gegen Aram«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: rückten … vor
  rationale: נגשׁ bedeutet grundsätzlich »sich nähern/herantreten«; im Zusammenhang einer bevorstehenden Schlacht gibt »vorrücken« die militärische Bewegung natürlich und präzise wieder.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: und die Leute, die bei ihm waren
  rationale: הָעָם heißt wörtlich »das Volk/die Leute«. Der Kontext bezeichnet Joabs Kampftruppe; »die Leute, die bei ihm waren« bleibt nahe am Wortlaut, ohne den Begriff unnötig als »Heer« zu spezifizieren.
- source_word: לִפְנֵי אֲרָם
  choice: gegen Aram
  rationale: לִפְנֵי bedeutet räumlich »vor/im Angesicht von«. Im Kampfkontext gibt »gegen Aram« die gemeinte Bewegung zur feindlichen Streitmacht in natürlichem Deutsch wieder; der räumliche Wortlaut wird in der Fußnote bewahrt.
- source_word: אֲרָם
  choice: Aram
  rationale: Der Eigenname wird als »Aram« wiedergegeben. »Syrien« wäre für diesen historischen Zusammenhang missverständlich beziehungsweise anachronistisch.
- source_word: לַמִּלְחָמָה
  choice: zum Kampf
  rationale: Die Präposition bezeichnet hier den Zweck des Vorrückens. »Zum Kampf« ist knapp, idiomatisch und entspricht dem militärischen Zusammenhang.
- source_word: וַיָּנוּסוּ
  choice: die Aramäer flohen
  rationale: נוס bedeutet »fliehen«. Das im Hebräischen nur durch die Pluralform ausgedrückte Subjekt wird im Deutschen als »die Aramäer« verdeutlicht, da ein bloßes »sie« fälschlich auf Joabs Leute bezogen werden könnte.
- source_word: מִפָּנָיו
  choice: vor ihm
  rationale: Wörtlich »von seinem Angesicht/seiner Gegenwart weg«. Die deutsche Wendung »vor ihm fliehen« gibt dies natürlich wieder; das Singularsuffix bezieht sich am naheliegendsten auf Joab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Bewegung wird mit »vorrücken« idiomatisch ausgedrückt; der Eigenname »Aram« bleibt erhalten. Das pluralische Subjekt des letzten Satzteils wird zur Vermeidung eines falschen Bezugs ausdrücklich als »die Aramäer« bezeichnet.
