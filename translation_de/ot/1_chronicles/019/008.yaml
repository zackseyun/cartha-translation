  text: וַ/יִּשְׁמַ֖ע דָּוִ֑יד וַ/יִּשְׁלַח֙ אֶת יוֹאָ֔ב וְ/אֵ֥ת כָּל צָבָ֖א הַ/גִּבּוֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/008.yaml
  text: When David heard, he sent Joab and all the army of the mighty men.
translation:
  language: de
  text: Als David davon hörte[a], schickte er Joab und das ganze Heer der Kriegshelden[b] aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „davon erfuhr“ beziehungsweise „darüber unterrichtet wurde“.'
    reason: lexical_alternative
  - marker: b
    text: „Kriegshelden“ kann Davids besonders tapfere Krieger oder seine Elitetruppe bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: davon hörte
  rationale: שׁמע bezeichnet hier im Erzählzusammenhang das Erhalten einer Nachricht. „Davon hörte“ ist im Deutschen natürlich und bewahrt die direkte Bedeutung des Verbs.
- source_word: וַיִּשְׁלַח
  choice: schickte … aus
  rationale: שׁלח bezeichnet hier die Entsendung zu einem militärischen Einsatz. Die trennbare Formulierung „schickte … aus“ ist modern und idiomatisch, ohne den Sinn zu verstärken.
- source_word: יוֹאָב
  choice: Joab
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: כָּל
  choice: das ganze
  rationale: כָּל umfasst hier die gesamte nachfolgend bezeichnete Streitmacht.
- source_word: צָבָא
  choice: Heer
  rationale: צָבָא bezeichnet in diesem militärischen Zusammenhang eine organisierte Streitmacht. „Heer“ ist prägnant, verständlich und dem würdevollen Erzählregister angemessen.
- source_word: הַגִּבּוֹרִים
  choice: der Kriegshelden
  rationale: גִּבּוֹרִים bezeichnet kampferprobte, tapfere oder besonders starke Krieger und kann hier auf Davids Elitetruppe verweisen. „Kriegshelden“ erhält diese lexikalische Färbung, ohne die mögliche Referenz endgültig festzulegen.
- source_word: וְאֵת כָּל צָבָא הַגִּבּוֹרִים
  choice: und das ganze Heer der Kriegshelden
  rationale: Die Wiedergabe bewahrt die hebräische Genitiv- beziehungsweise Status-constructus-Verbindung zwischen „Heer“ und „Kriegshelden“, statt sie zu „sein ganzes Heer“ zu verflachen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Als“ gibt die zeitliche Erzählfolge wieder, ohne ausdrücklich einen Kausalzusammenhang zu behaupten. Die Formulierung „Heer der Kriegshelden“ bewahrt die markante hebräische Verbindung und ihre mögliche Bezeichnung einer Elitetruppe.
