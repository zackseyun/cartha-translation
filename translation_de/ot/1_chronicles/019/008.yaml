  source_fidelity: 'Die Übersetzung gibt die beiden hebräischen Erzählverben zutreffend wieder: David erhält die Nachricht und entsendet Joab sowie die gesamte bezeichnete Streitmacht. „Das ganze Heer der Kriegshelden“ bewahrt die Status-constructus-Verbindung von צָבָא הַגִּבּוֹרִים und legt weder die genaue Zusammensetzung noch eine exklusive militärische Organisationsform über den Text hinaus fest.'
