id: 1CH.19.19
reference: 1 Chronicles 19:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּרְא֞וּ עַבְדֵ֣י הֲדַדְעֶ֗זֶר כִּ֤י נִגְּפוּ֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּשְׁלִ֥ימוּ עִם דָּוִ֖יד וַ/יַּֽעַבְדֻ֑/הוּ וְ/לֹא אָבָ֣ה אֲרָ֔ם לְ/הוֹשִׁ֥יעַ אֶת בְּנֵי עַמּ֖וֹן עֽוֹד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/019.yaml
  text: When the servants of Hadadezer saw that they had been defeated before Israel[a], they made peace with David and served him. And Aram was no longer willing to help the sons of Ammon.
translation:
  language: de
  text: Als die Diener Hadad-Esers sahen, dass sie vor Israel besiegt worden waren, schlossen sie mit David Frieden und dienten ihm. Und Aram war nicht mehr bereit, den Ammonitern[a] zu helfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen Ammons“; die hebräische Wendung ist eine Volksbezeichnung für die Ammoniter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: Diener
  rationale: Im königlich-politischen Zusammenhang bezeichnet das Wort Untergebene beziehungsweise Gefolgsleute Hadad-Esers; „Diener“ bewahrt die Unterordnung, ohne unnötig Sklavenstatus zu behaupten.
- source_word: נִגְּפוּ
  choice: besiegt worden waren
  rationale: Die Niphal-Form bezeichnet hier eine erlittene militärische Niederlage. Die vorzeitige Form passt zum Wahrnehmen der bereits eingetretenen Niederlage.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: vor Israel
  rationale: Die Wiedergabe erhält die hebräische Wendung und lässt sowohl die räumlich-bildhafte als auch die militärische Bedeutung erkennen.
- source_word: וַיַּשְׁלִימוּ עִם דָּוִיד
  choice: schlossen sie mit David Frieden
  rationale: Die Hiphil-Form von שלם mit עִם bezeichnet hier das Schließen eines Friedens beziehungsweise einer Vereinbarung.
- source_word: וַיַּעַבְדֻהוּ
  choice: dienten ihm
  rationale: Das Verb bezeichnet im Kontext den politischen Dienst beziehungsweise die Unterordnung unter David; die knappe Form bleibt nahe am Hebräischen.
- source_word: אֲרָם
  choice: Aram
  rationale: Der Eigenname wird als Aram beibehalten und nicht durch die spätere geografische Bezeichnung „Syrien“ ersetzt; hier ist er kollektiv gebraucht.
- source_word: לְהוֹשִׁיעַ
  choice: zu helfen
  rationale: Im militärischen Bündniskontext bedeutet das Verb, den Ammonitern zu Hilfe zu kommen; „helfen“ gibt diese kontextuelle Bedeutung natürlich wieder.
- source_word: בְּנֵי עַמּוֹן
  choice: den Ammonitern
  rationale: Die wörtliche Wendung „Söhne Ammons“ dient als Volksbezeichnung. „Ammoniter“ ist im modernen Deutschen klar und idiomatisch; die wörtliche Form wird in der Fußnote dokumentiert.
- source_word: לֹא אָבָה ... עוֹד
  choice: war nicht mehr bereit
  rationale: Die Verbindung aus Verneinung, אָבָה und עוֹד drückt aus, dass Aram künftig nicht länger dazu bereit war.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Ablauf, während „Ammoniter“ als geläufige deutsche Volksbezeichnung verwendet wird. Der Name הֲדַדְעֶזֶר wird entsprechend seiner Bestandteile als „Hadad-Eser“ wiedergegeben.
