  source_fidelity: 'Die Übersetzung gibt die Abfolge und die wesentlichen Angaben des Hebräischen vollständig wieder: das Anwerben für sich, die Zahl von 32.000, רֶכֶב als „Streitwagen“ mit bewahrter kollektiver Lesemöglichkeit, den König von Maacha samt seinem Volk, das Lagern vor Medeba sowie die Mobilisierung der Ammoniter aus ihren Städten zum Kampf. „Zogen in den Kampf“ ist eine idiomatische, dem Kontext entsprechende Wiedergabe von „kamen zum Kampf“ und fügt keine sachliche Einengung hinzu.'
