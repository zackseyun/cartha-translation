source:
  edition: WLC
  text: וַ/יִּשְׂכְּר֣וּ לָ/הֶ֡ם שְׁנַיִם֩ וּ/שְׁלֹשִׁ֨ים אֶ֜לֶף רֶ֗כֶב וְ/אֶת מֶ֤לֶךְ מַעֲכָה֙ וְ/אֶת עַמּ֔/וֹ וַ/יָּבֹ֕אוּ וַֽ/יַּחֲנ֖וּ לִ/פְנֵ֣י מֵידְבָ֑א וּ/בְנֵ֣י עַמּ֗וֹן נֶאֶסְפוּ֙ מֵ/עָ֣רֵי/הֶ֔ם וַ/יָּבֹ֖אוּ לַ/מִּלְחָמָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/007.yaml
  text: So they hired for themselves thirty-two thousand chariots[a], and the king of Maacah with his people. They came and camped before Medeba[b], and the sons of Ammon gathered from their cities and came to battle.
translation:
  language: de
  text: So warben sie für sich 32.000 Streitwagen[a] an sowie den König von Maacha mit seinem Volk. Sie kamen und schlugen vor Medeba ihr Lager auf. Die Ammoniter[b] sammelten sich aus ihren Städten und zogen in den Kampf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Streitwagen“ kann hier auch kollektiv die Streitwagenstreitmacht bezeichnen, nicht nur eine Anzahl einzelner Fahrzeuge.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Söhne Ammons“; dies ist eine übliche hebräische Bezeichnung für die Ammoniter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכְּרוּ לָהֶם
  choice: So warben sie für sich … an
  rationale: שׂכר bezeichnet das Anwerben gegen Bezahlung; der Dativ לָהֶם wird mit „für sich“ natürlich wiedergegeben, ohne ausdrücklich „Söldner“ einzutragen.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף
  choice: '32.000'
  rationale: Der Zahlenwert wird exakt in üblicher deutscher Schreibweise wiedergegeben.
- source_word: רֶכֶב
  choice: Streitwagen
  rationale: רֶכֶב kann einzelne Streitwagen oder kollektiv die Streitwagenstreitmacht bezeichnen; „Streitwagen“ wahrt diese mögliche kollektive Bedeutung, die in einer Fußnote erläutert wird.
- source_word: מֶלֶךְ מַעֲכָה
  choice: den König von Maacha
  rationale: Die Constructusverbindung bezeichnet den Herrscher des Gebietes Maacha.
- source_word: עַמּוֹ
  choice: seinem Volk
  rationale: עַם bedeutet wörtlich „Volk“; im militärischen Zusammenhang kann die kampffähige Gefolgschaft gemeint sein, doch die Übersetzung vermeidet eine unnötige Verengung auf „Heer“.
- source_word: וַיָּבֹאוּ וַיַּחֲנוּ
  choice: Sie kamen und schlugen … ihr Lager auf
  rationale: Die beiden narrativen Verbformen werden geradlinig und in natürlichem modernem Deutsch wiedergegeben.
- source_word: לִפְנֵי מֵידְבָא
  choice: vor Medeba
  rationale: לִפְנֵי bezeichnet hier eine räumliche Lage vor beziehungsweise gegenüber der Stadt; „vor Medeba“ erhält diese Beziehung knapp und offen.
- source_word: בְנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Die wörtliche Wendung „Söhne Ammons“ ist eine übliche ethnische Bezeichnung; „Ammoniter“ ist im modernen Deutsch die natürliche Wiedergabe. Die wörtliche Form wird in einer Fußnote genannt.
- source_word: נֶאֶסְפוּ מֵעָרֵיהֶם
  choice: sammelten sich aus ihren Städten
  rationale: Der Niphal bezeichnet das Zusammenkommen beziehungsweise Sammeln; die Herkunft aus den eigenen Städten bleibt ausdrücklich erhalten.
- source_word: וַיָּבֹאוּ לַמִּלְחָמָה
  choice: zogen in den Kampf
  rationale: Wörtlich „sie kamen zum Kampf“; „zogen in den Kampf“ ist idiomatisches Deutsch und bewahrt die militärische Zielrichtung.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches und zugleich würdiges Standarddeutsch. Die Satzteilung entlastet den langen hebräischen Erzählfluss. „Anwerben“ erhält den Gedanken der Bezahlung, ohne das Objekt als ausdrücklich genannte Söldner zu überdeuten; die Mehrdeutigkeit von רֶכֶב wird durch die Fußnote bewahrt.
