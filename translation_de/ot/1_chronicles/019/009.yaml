source:
  edition: WLC
  text: וַ/יֵּצְאוּ֙ בְּנֵ֣י עַמּ֔וֹן וַ/יַּֽעַרְכ֥וּ מִלְחָמָ֖ה פֶּ֣תַח הָ/עִ֑יר וְ/הַ/מְּלָכִ֣ים אֲשֶׁר בָּ֔אוּ לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/009.yaml
  text: And the sons of Ammon came out and drew up for battle at the entrance of the city[d][c][b][a], while the kings who had come were by themselves in the field.
translation:
  language: de
  text: Die Ammoniter[a] rückten aus und stellten sich am Eingang der Stadt[b] zum Kampf auf[c]; die Könige aber, die gekommen waren, standen getrennt von ihnen auf dem Feld.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Ammons“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „am Stadttor“. Das hebräische Wort bedeutet allgemeiner „Eingang“ oder „Öffnung“ und ist nicht das übliche Wort für „Tor“.'
    reason: lexical_alternative
  - marker: c
    text: Das heißt, sie ordneten ihre Truppen in Schlachtformation.
    reason: lexical_alternative
  - marker: d
    text: Die verbündeten Könige hatten also getrennt von den ammonitischen Truppen draußen auf dem Feld Stellung bezogen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: rückten aus
  rationale: Das Verb יצא bedeutet hinausgehen bzw. ausziehen. Im militärischen Zusammenhang gibt „rückten aus“ die Bewegung aus der Stadt natürlich und präzise wieder.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Die idiomatische deutsche Völkerbezeichnung vermittelt den Sinn der wörtlichen hebräischen Wendung „Söhne Ammons“ klar und ohne altertümliche Wirkung.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: stellten sich zum Kampf auf
  rationale: ערך mit מלחמה bezeichnet das Ordnen bzw. Aufstellen der Truppen zur Schlacht. Die deutsche Formulierung bewahrt diesen taktischen Sinn.
- source_word: פֶּתַח הָעִיר
  choice: am Eingang der Stadt
  rationale: פֶּתַח bezeichnet allgemein eine Öffnung oder einen Eingang; der Text verwendet nicht das übliche hebräische Wort für „Tor“.
- source_word: וְהַמְּלָכִים אֲשֶׁר בָּאוּ
  choice: die Könige aber, die gekommen waren
  rationale: „Aber“ macht den örtlichen Gegensatz zwischen den Ammonitern und den verbündeten Königen deutlich, ohne den Satzinhalt zu erweitern.
- source_word: לְבַדָּם
  choice: getrennt von ihnen
  rationale: לְבַדָּם bezeichnet hier die gesonderte Stellung der verbündeten Könige, nicht notwendigerweise, dass sie ohne Truppen waren.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: Die schlichte Wiedergabe bleibt nahe am hebräischen שׂדה und passt zur deutschen Beschreibung einer Truppenstellung außerhalb der Stadt.
