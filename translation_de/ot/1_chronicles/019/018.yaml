source:
  edition: WLC
  text: וַ/יָּ֣נָס אֲרָם֮ מִ/לִּ/פְנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜יד מֵ/אֲרָ֗ם שִׁבְעַ֤ת אֲלָפִים֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף אִ֣ישׁ רַגְלִ֑י וְ/אֵ֛ת שׁוֹפַ֥ךְ שַֽׂר הַ/צָּבָ֖א הֵמִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/018.yaml
  text: And Aram fled before Israel[a], and David killed seven thousand chariot warriors from Aram and forty thousand foot soldiers[b], and he put Shophach the commander of the army to death.
translation:
  language: de
  text: Und Aram floh vor Israel[a], und David tötete siebentausend Streitwagenkämpfer Arams und vierzigtausend Fußsoldaten; auch Schofach, den Befehlshaber des Heeres, tötete er.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Parallelbericht in 2. Samuel 10,18 stehen „siebenhundert Streitwagen“ und „vierzigtausend Reiter“. Der Chroniktext lautet hier „siebentausend Streitwagenkämpfer“ und „vierzigtausend Fußsoldaten“.
    reason: textual_variant
  - marker: b
    text: Schofach heißt im Parallelbericht in 2. Samuel 10,16.18 Schobach.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרָם
  choice: Aram
  rationale: Der überlieferte Name wird beibehalten; im Zusammenhang bezeichnet er die aramäische Streitmacht, ohne den späteren geopolitischen Namen „Syrien“ einzutragen.
- source_word: וַיָּנָס
  choice: floh
  rationale: נוּס bezeichnet unmittelbar die Flucht beziehungsweise das Weichen in einer Schlacht.
- source_word: מִלִּפְנֵי יִשְׂרָאֵל
  choice: vor Israel
  rationale: Die hebräische Wendung beschreibt eine Flucht angesichts des Gegners; „vor Israel fliehen“ ist im Deutschen natürlich und quellennah.
- source_word: וַיַּהֲרֹג דָּוִיד
  choice: David tötete
  rationale: הרג bedeutet „töten“; die schlichte Formulierung ist klar, modern und nicht beschönigend.
- source_word: שִׁבְעַת אֲלָפִים רֶכֶב
  choice: siebentausend Streitwagenkämpfer
  rationale: רֶכֶב bezeichnet wörtlich Streitwagen beziehungsweise die Streitwagenstreitmacht. Die metonymische Wiedergabe benennt deren Kämpfer, ohne sie enger als bloße Wagenlenker zu bestimmen.
- source_word: וְאַרְבָּעִים אֶלֶף אִישׁ רַגְלִי
  choice: vierzigtausend Fußsoldaten
  rationale: אִישׁ רַגְלִי bezeichnet einen Mann zu Fuß, hier einen Infanteristen; „Fußsoldaten“ gibt den militärischen Gegensatz verständlich wieder.
- source_word: שׁוֹפַךְ
  choice: Schofach
  rationale: Der Name wird nach seiner Form im Chroniktext ins Deutsche übertragen; die abweichende Namensform in Samuel wird in einer Fußnote dokumentiert.
- source_word: שַׂר הַצָּבָא
  choice: Befehlshaber des Heeres
  rationale: Die Formulierung gibt die militärische Leitungsfunktion von שַׂר und die Streitmacht צָבָא in würdigem, verständlichem Deutsch wieder.
- source_word: הֵמִית
  choice: tötete er
  rationale: Der Hifil von מות bedeutet „sterben lassen/töten“. Die deutsche Wiederaufnahme von „töten“ ist natürlich; ein förmliches Hinrichtungsurteil ist im Hebräischen nicht ausdrücklich ausgesagt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze erhalten den zügigen Erzählstil. „Streitwagenkämpfer“ wahrt die gewisse Bedeutungsbreite von רֶכֶב besser als das engere „Wagenlenker“.
