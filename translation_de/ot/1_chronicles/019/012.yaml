  text: וַ/יֹּ֗אמֶר אִם תֶּחֱזַ֤ק מִמֶּ֨/נִּי֙ אֲרָ֔ם וְ/הָיִ֥יתָ לִּ֖/י לִ/תְשׁוּעָ֑ה וְ/אִם בְּנֵ֥י עַמּ֛וֹן יֶֽחֶזְק֥וּ מִמְּ/ךָ֖ וְ/הוֹשַׁעְתִּֽי/ךָ־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/012.yaml
  text: And he said[a], “If Aram is too strong for me, then you shall be my salvation; but if the Ammonites are too strong for you[b], then I will save you.”
translation:
  language: de
  text: 'Und er sagte: »Wenn Aram mir überlegen ist, dann komm du mir zu Hilfe; wenn aber die Ammoniter dir überlegen sind, dann werde ich dir helfen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּחֱזַק / יֶחֶזְקוּ (חזק)
  choice: überlegen sein
  rationale: חזק mit מן bezeichnet hier im militärischen Zusammenhang, stärker zu sein beziehungsweise die Oberhand zu haben. „Überlegen sein“ gibt den Vergleich in natürlichem Deutsch wieder.
- source_word: אֲרָם
  choice: Aram
  rationale: Der hebräische Text nennt Aram; die Transliteration bewahrt die historische Bezeichnung und vermeidet das spätere geopolitische „Syrien“.
- source_word: וְהָיִיתָ לִּי לִתְשׁוּעָה
  choice: dann komm du mir zu Hilfe
  rationale: Wörtlich etwa „dann sei du mir zur Rettung“. Die gewählte Formulierung gibt die idiomatische Bedeutung konkreter Hilfe im Kampf natürlich wieder, ohne den Ausdruck unnötig zu theologisieren.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Dies ist die geläufige deutsche Volksbezeichnung für „Söhne Ammons“.
- source_word: וְהוֹשַׁעְתִּיךָ (ישע)
  choice: dann werde ich dir helfen
  rationale: Der Hifil von ישע bedeutet retten oder befreien. Im Zusammenhang gegenseitiger militärischer Unterstützung ist „dir helfen“ idiomatisch und bildet die Entsprechung zum ersten Satzglied klar ab.
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Die Form setzt die hebräische Erzählfolge fort; „Und er sagte“ wahrt diesen Anschluss.
