  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung vermeidet eine schwerfällige Reihung; „zog vor ihnen her“ bewahrt zugleich die Bildsprache des Ausgangstextes.
