source:
  edition: WLC
  text: וַ/יַּ֣רְא אֲרָ֗ם כִּ֣י נִגְּפוּ֮ לִ/פְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים וַ/יּוֹצִ֣יאוּ אֶת אֲרָ֔ם אֲשֶׁ֖ר מֵ/עֵ֣בֶר הַ/נָּהָ֑ר וְ/שׁוֹפַ֛ךְ שַׂר צְבָ֥א הֲדַדְעֶ֖זֶר לִ/פְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/016.yaml
  text: When Aram saw that they had been defeated before Israel[a], they sent messengers and brought out the Arameans who were from beyond the River[b], with Shophach the commander of Hadadezer’s army before them.
translation:
  language: de
  text: Als Aram sah, dass es vor Israel geschlagen worden war, sandte es Boten und ließ die Aramäer von jenseits des Stromes[b] ausrücken. Schofach, der Heerführer Hadad-Esers, zog vor ihnen her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Wahrscheinlich ist der Euphrat gemeint; im Hebräischen steht lediglich „jenseits des Stromes“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: die Aramäer
  rationale: Der Name bezeichnet hier kollektiv das aramäische Volk beziehungsweise seine Streitkräfte. „Aramäer“ gibt die anschließenden Pluralformen im Deutschen natürlich wieder und bewahrt den hebräischen Eigennamen.
- source_word: נִגְּפוּ
  choice: geschlagen worden waren
  rationale: Die Nifal-Form bezeichnet im militärischen Zusammenhang eine erlittene Niederlage. Die Formulierung ist klar und übertreibt das Ausmaß der Niederlage nicht.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: vor Israel
  rationale: Die Wiedergabe bewahrt die hebräische Wendung „vor dem Angesicht Israels“, die hier eine Niederlage im Kampf gegen Israel ausdrückt.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im politischen und militärischen Zusammenhang sind menschliche Überbringer gemeint, nicht Engel.
- source_word: וַיּוֹצִיאוּ אֶת אֲרָם
  choice: ließen die Aramäer … ausrücken
  rationale: Der Hifil von יצא bedeutet, jemanden herauskommen beziehungsweise ausziehen zu lassen. „Ausrücken lassen“ macht die militärische Mobilisierung im Deutschen verständlich.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: von jenseits des Stromes
  rationale: Dies entspricht der unbestimmten hebräischen Bezeichnung. Gemeint ist wahrscheinlich der Euphrat, doch der Ausgangstext nennt ihn nicht ausdrücklich.
- source_word: שַׂר צְבָא הֲדַדְעֶזֶר
  choice: der Heerführer Hadad-Esers
  rationale: שַׂר צְבָא ist ein militärischer Titel. „Heerführer“ ist eine knappe, verständliche und würdige Wiedergabe.
- source_word: לִפְנֵיהֶם
  choice: zog vor ihnen her
  rationale: Die Formulierung wahrt das Bild des hebräischen „vor ihnen“ und lässt im militärischen Zusammenhang erkennen, dass Schofach die Truppen anführte.
theological_decisions: []
