  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יָּ֕מָת נָחָ֖שׁ מֶ֣לֶךְ בְּנֵי עַמּ֑וֹן וַ/יִּמְלֹ֥ךְ בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/001.yaml
  text: After this, Nahash king of the Ammonites died, and his son reigned in his place.
translation:
  language: de
  text: Danach starb Nahasch, der König der Ammoniter, und sein Sohn wurde an seiner Stelle König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Danach
  rationale: Die hebräische Erzählungsformel bedeutet wörtlich »Und es geschah danach«. »Danach« gibt den zeitlichen Übergang im modernen Deutschen knapp und natürlich wieder.
- source_word: וַיָּמָת
  choice: starb
  rationale: מות bezeichnet hier schlicht das Sterben; »starb« entspricht dem hebräischen Ausdruck ohne beschönigende Abschwächung.
- source_word: נָחָשׁ
  choice: Nahasch
  rationale: Der Personenname wird nach einer im Deutschen geläufigen bibelnahen Umschrift wiedergegeben.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: der König der Ammoniter
  rationale: Wörtlich steht »König der Söhne Ammons«; »König der Ammoniter« ist die natürliche deutsche Bezeichnung für das betreffende Volk.
- source_word: וַיִּמְלֹךְ
  choice: wurde … König
  rationale: מלך bezeichnet in diesem Zusammenhang den Antritt der Königsherrschaft. »Wurde König« drückt die Thronfolge im Deutschen natürlicher aus als das mögliche »herrschte«.
- source_word: בְּנוֹ
  choice: sein Sohn
  rationale: Das Suffix bezieht sich eindeutig auf Nahasch und wird direkt wiedergegeben.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Der Ausdruck bezeichnet die Nachfolge in Amt und Stellung; »an seiner Stelle« bewahrt dieses Bild idiomatisch.
