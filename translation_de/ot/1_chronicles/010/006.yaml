source:
  edition: WLC
  text: וַ/יָּ֤מָת שָׁאוּל֙ וּ/שְׁלֹ֣שֶׁת בָּנָ֔י/ו וְ/כָל בֵּית֖/וֹ יַחְדָּ֥ו מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/006.yaml
  text: So Saul died[a], and his three sons, and all his house died together.
translation:
  language: de
  text: So starb Saul, und seine drei Söhne und sein ganzes Haus[a] starben alle zusammen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine ganze Hausgemeinschaft«, »seine ganze Familie« oder »sein ganzes Geschlecht«. Wörtlich steht im Hebräischen »sein ganzes Haus«; damit kann eine Hausgemeinschaft oder Familienlinie gemeint sein, nicht ein Gebäude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: So starb
  rationale: Das Wayyiqtol führt die Erzählung fort und bezeichnet hier Sauls Tod. „So“ gibt im Deutschen den folgernden Erzählanschluss natürlich wieder.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: und seine drei Söhne
  rationale: Die Status-constructus-Verbindung aus Zahlwort, Substantiv und Suffix bezeichnet die drei bereits aus dem Zusammenhang bekannten Söhne Sauls.
- source_word: וְכָל בֵּיתוֹ
  choice: und sein ganzes Haus
  rationale: בַּיִת kann außer einem Gebäude auch Hausgemeinschaft, Familie oder Geschlecht bezeichnen. „Haus“ bewahrt diese Bedeutungsbreite, ohne den Bezug vorschnell einzuengen.
- source_word: יַחְדָּו
  choice: alle zusammen
  rationale: Das Adverb bezeichnet das gemeinsame Geschick der genannten Personen; „alle zusammen“ ist im Deutschen idiomatisch und lässt den kollektiven Nachdruck erkennen.
- source_word: מֵתוּ
  choice: starben
  rationale: Das Qal Perfekt 3. Person Plural von מוּת wird als einfaches Präteritum wiedergegeben. Die Wiederholung von „starb/starben“ bewahrt Struktur und Nachdruck des Hebräischen.
theological_decisions:
- issue: Umfang von „sein ganzes Haus“
  choice: Die wörtliche Wendung „sein ganzes Haus“ bleibt im Haupttext stehen.
  alternative: seine ganze Hausgemeinschaft; seine ganze Familie; sein ganzes Geschlecht
  rationale: Die hebräische Formulierung kann Hausgemeinschaft, Familie oder dynastisches Haus bezeichnen und muss nicht ausnahmslos jeden Verwandten Sauls einschließen. Die gewählte Fassung bewahrt diese Offenheit und vermeidet eine historisch oder theologisch überpräzise Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Verwendung von „starb/starben“ folgt dem hebräischen Satzbau und erhält dessen Nachdruck; die Satzstellung bleibt dennoch gut verständlich.
