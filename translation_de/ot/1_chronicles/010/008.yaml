source:
  edition: WLC
  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים לְ/פַשֵּׁ֖ט אֶת הַֽ/חֲלָלִ֑ים וַֽ/יִּמְצְא֤וּ אֶת שָׁאוּל֙ וְ/אֶת בָּנָ֔י/ו נֹפְלִ֖ים בְּ/הַ֥ר גִּלְבֹּֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/008.yaml
  text: It happened on the next day that the Philistines came to strip the slain[b][a], and they found Saul and his sons fallen on Mount Gilboa.
translation:
  language: de
  text: Am nächsten Tag kamen die Philister, um die Erschlagenen[a] auszuplündern. Da fanden sie Saul und seine Söhne, die auf dem Berg Gilboa gefallen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „ausplündern“ wiedergegebene Verb meint in diesem Zusammenhang, den Gefallenen Kleidung, Rüstung, Waffen und andere Beute abzunehmen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Am nächsten Tag
  rationale: Die hebräische Erzählungsformel führt den nächsten Vorgang ein; im natürlichen modernen Deutsch genügt hier die Zeitangabe. מִמָּחֳרָת bezeichnet den Tag nach den zuvor erzählten Ereignissen.
- source_word: לְפַשֵּׁט
  choice: um … auszuplündern
  rationale: Das Verb bezeichnet in diesem Schlachtfeldkontext das Abnehmen von Kleidung, Waffen und sonstiger Beute von den Gefallenen. „Ausplündern“ gibt die Handlung im Deutschen natürlich wieder; eine Fußnote präzisiert den konkreten Sinn.
- source_word: הַחֲלָלִים
  choice: die Erschlagenen
  rationale: Das Wort bezeichnet gewaltsam Getötete, besonders Gefallene einer Schlacht, und bewahrt damit den kriegerischen Kontext genauer als das allgemeinere „die Toten“.
- source_word: נֹפְלִים
  choice: gefallen waren
  rationale: Die wörtliche Bildsprache „gefallen“ ist zugleich im Deutschen die übliche Bezeichnung für im Kampf Getötete. Die finite Form fügt sich natürlich in den Relativsatz ein.
- source_word: בְּהַר גִּלְבֹּעַ
  choice: auf dem Berg Gilboa
  rationale: Entspricht der Ortsangabe und der üblichen deutschen Wiedergabe des benannten Berges.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die hebräische Anfangsformel wird nicht schwerfällig mit „Und es geschah“ nachgebildet, da die zeitliche und narrative Fortführung durch „Am nächsten Tag“ klar ist. „Erschlagene“ und „gefallen“ bewahren den Schlachtfeldcharakter des Ausgangstextes.
