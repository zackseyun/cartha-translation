  source_fidelity: 'Der Text gibt die Abfolge des Hebräischen zutreffend wieder: Am Tag nach der Schlacht kommen die Philister, um die im Kampf Getöteten ihrer Habe zu berauben, und finden Saul und seine Söhne auf dem Berg Gilboa gefallen. „Ausplündern“ trifft לְפַשֵּׁט im Schlachtfeldkontext angemessen, ohne die Beute auf einen einzelnen Gegenstand einzuengen.'
