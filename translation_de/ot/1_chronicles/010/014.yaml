source:
  edition: WLC
  text: וְ/לֹֽא דָרַ֥שׁ בַּֽ/יהוָ֖ה וַ/יְמִיתֵ֑/הוּ וַ/יַּסֵּב֙ אֶת הַ/מְּלוּכָ֔ה לְ/דָוִ֖יד בֶּן יִשָֽׁי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/014.yaml
  text: He did not seek Yahweh[b][a], so he put him to death and turned the kingdom over to David son of Jesse.
translation:
  language: de
  text: Er befragte Jahwe nicht[a]. Darum tötete Jahwe ihn und übertrug das Königtum[b] David, dem Sohn Isais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Er suchte Jahwe nicht; auch: Er holte bei Jahwe keinen Rat ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: die Königsherrschaft; traditionell auch: das Königreich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָרַשׁ בַּיהוָה
  choice: Jahwe befragen
  rationale: דרשׁ mit ב und einer göttlichen Person als Bezugswort bezeichnet hier das Einholen göttlicher Weisung. „Befragen“ gibt im unmittelbaren Zusammenhang den konkreten Sinn präzise wieder; die weitere Bedeutung „suchen“ bleibt in der Fußnote erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: וַיְמִיתֵהוּ
  choice: tötete Jahwe ihn
  rationale: Der Hifil von מות drückt verursachende Handlung aus. „Tötete“ bewahrt die ausdrücklich ausgesagte göttliche Verursachung. Die Wiederholung von „Jahwe“ macht den im Hebräischen nur durch die Verbform bezeichneten Subjektwechsel im Deutschen eindeutig.
- source_word: וַיַּסֵּב
  choice: übertrug
  rationale: Der Hifil von סבב kann ein Übergehenlassen oder Übertragen bezeichnen. In Verbindung mit dem Königtum und dem Empfänger David ist „übertrug“ natürlich und präzise.
- source_word: הַמְּלוּכָה
  choice: das Königtum
  rationale: מְלוּכָה bezeichnet hier vor allem Königsherrschaft beziehungsweise Königswürde, die von Saul auf David übergeht, nicht primär ein Staatsgebiet.
- source_word: לְדָוִיד בֶּן־יִשַׁי
  choice: David, dem Sohn Isais
  rationale: Die hebräische Herkunftsangabe wird in natürlichem, würdigem Deutsch als Apposition wiedergegeben; „Isai“ steht nach „Sohn“ im Genitiv.
theological_decisions:
- issue: Göttliche Urheberschaft bei Sauls Tod
  choice: Der Vers schreibt Sauls Tod ausdrücklich Jahwe zu.
  alternative: Jahwe ließ lediglich zu, dass Saul starb.
  rationale: Der Hifil von מות bezeichnet Verursachung, und Jahwe ist im Zusammenhang das Subjekt der anschließenden Verbfolge. Die Übersetzung schwächt diese Aussage nicht zu bloßer Zulassung ab, entwickelt daraus aber auch keine weitergehende Theorie über unmittelbare oder mittelbare Ursachen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze bewahren die pointierte Begründungsfolge. Die Wiederholung des Gottesnamens verhindert eine im Deutschen sonst naheliegende falsche Zuordnung des Pronomens.
