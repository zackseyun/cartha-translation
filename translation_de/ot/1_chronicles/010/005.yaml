source:
  edition: WLC
  text: וַ/יַּ֥רְא נֹשֵֽׂא כֵלָ֖י/ו כִּ֣י מֵ֣ת שָׁא֑וּל וַ/יִּפֹּ֥ל גַּם ה֛וּא עַל הַ/חֶ֖רֶב וַ/יָּמֹֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/005.yaml
  text: When his armor-bearer saw that Saul was dead[b][a], he too fell on the sword and died.
translation:
  language: de
  text: Als sein Waffenträger[a] sah, dass Saul tot war, stürzte auch er sich in das Schwert[b] und starb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der Träger seiner Waffen“.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung bezeichnet hier die Selbsttötung mit einem Schwert.
    reason: cultural_note
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: sein Waffenträger
  rationale: Die Konstruktverbindung bezeichnet wörtlich den Träger seiner Waffen beziehungsweise Ausrüstung. „Waffenträger“ ist im Deutschen die natürliche und sachlich passende Bezeichnung für diese militärische Funktion.
- source_word: כִּי
  choice: dass
  rationale: 'כִּי leitet hier den Inhalt dessen ein, was der Waffenträger wahrnahm: Er sah, dass Saul tot war.'
- source_word: מֵת
  choice: tot war
  rationale: Die Form bezeichnet Sauls festgestellten Zustand. „Tot war“ gibt dies nach „sah, dass“ idiomatisch und ohne zusätzliche zeitliche Deutung wieder.
- source_word: וַיִּפֹּל
  choice: stürzte ... sich
  rationale: נפל bedeutet grundsätzlich „fallen“. In Verbindung mit dem Schwert beschreibt die Wendung hier eine absichtliche Selbsttötung; die reflexive deutsche Form gibt den gemeinten Vorgang natürlich wieder.
- source_word: גַּם הוּא
  choice: auch er
  rationale: 'Die Formulierung bewahrt den additiven und leicht emphatischen Sinn: Der Waffenträger folgt Saul in den Tod.'
- source_word: עַל הַחֶרֶב
  choice: in das Schwert
  rationale: Der hebräische Text hat wörtlich „auf das Schwert“. Im Deutschen lautet die traditionelle und verständliche Wendung „sich in das Schwert stürzen“. Der bestimmte Artikel bleibt erhalten; „sein Schwert“ wäre eine nicht ausdrücklich im Text stehende Präzisierung.
- source_word: וַיָּמֹת
  choice: und starb
  rationale: Die knappe koordinierte Form entspricht der nüchternen Erzählfolge des hebräischen Textes und nennt das Ergebnis ausdrücklich.
