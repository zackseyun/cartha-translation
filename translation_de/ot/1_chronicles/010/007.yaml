  text: וַ֠/יִּרְאוּ כָּל אִ֨ישׁ יִשְׂרָאֵ֤ל אֲשֶׁר בָּ/עֵ֨מֶק֙ כִּ֣י נָ֔סוּ וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ עָרֵי/הֶם֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/007.yaml
  text: When all the men of Israel who were in the valley saw that they had fled and that Saul and his sons were dead[a], they abandoned their cities and fled[c][b]; then the Philistines came and lived in them.
translation:
  language: de
  text: Als alle Männer Israels, die im Tal[a] waren, sahen, dass sie geflohen und Saul und seine Söhne tot waren, verließen sie ihre Städte und flohen. Da kamen die Philister und ließen sich darin nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in der Ebene.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: sahen
  rationale: Die Grundbedeutung von ראה ist visuelles Wahrnehmen; „sahen“ bewahrt die konkrete Erzählweise und vermeidet das deutendere „erkannten“.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: alle Männer Israels
  rationale: Die Verbindung mit אִישׁ ist ausdrücklich maskulin und hat nach כָּל distributiven Sinn. Im militärischen Zusammenhang ist „Männer“ sachgerecht und quellentreu.
- source_word: אֲשֶׁר בָּעֵמֶק
  choice: die in der Talebene waren
  rationale: עֵמֶק bezeichnet ein Tal beziehungsweise eine tiefer gelegene Ebene. „Talebene“ gibt beide topografischen Aspekte natürlich wieder; die Alternative „Tal“ wird in der Fußnote genannt.
- source_word: כִּי נָסוּ
  choice: dass sie geflohen
  rationale: Das Subjekt bleibt wie im Hebräischen unausgesprochen. Im Deutschen bezeichnet das Perfekt innerhalb der dass-Konstruktion die bereits eingetretene Flucht natürlich.
- source_word: וְכִי מֵתוּ שָׁאוּל וּבָנָיו
  choice: und Saul und seine Söhne tot waren
  rationale: „Tot waren“ gibt den im Zusammenhang beobachteten Ergebniszustand idiomatisch wieder.
- source_word: וַיַּעַזְבוּ עָרֵיהֶם
  choice: verließen sie ihre Städte
  rationale: עזב bedeutet verlassen oder zurücklassen. „Verließen“ ist im Deutschen natürlich und lässt den militärischen Kontext die erzwungene Aufgabe der Städte vermitteln, ohne die Intensität unnötig zu steigern.
- source_word: וַיָּנֻסוּ
  choice: und flohen
  rationale: נוס ist das übliche Verb für die Flucht; „flohen“ ist präzise und für erzählende Prosa angemessen.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: Da kamen die Philister
  rationale: „Da“ macht die fortschreitende Ereignisfolge der hebräischen Narrativform deutlich, ohne einen zusätzlichen Kausalzusammenhang einzutragen.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: und ließen sich darin nieder
  rationale: ישב kann wohnen, sich niederlassen oder ansässig werden bedeuten. „Ließen sich darin nieder“ bringt hier die Inbesitznahme und Besiedlung der verlassenen Städte klar zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle deutsche Erzählsprache. Die ausdrücklich maskuline Form des Hebräischen bleibt mit „Männer Israels“ erhalten. Die Wiederholung von Flucht und Tod folgt der knappen hebräischen Ereignisfolge; „darin“ bezieht sich eindeutig auf die Städte.
