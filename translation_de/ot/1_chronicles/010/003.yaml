  text: The battle grew heavy against Saul, and the archers found him, and he was badly wounded by the archers.
translation:
  language: de
  text: Der Kampf wurde für Saul immer härter. Die Bogenschützen fanden ihn, und er wurde von ihnen verwundet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und er geriet wegen der Schützen in große Angst (oder: Qual).“ Das hebräische Verb kann statt einer körperlichen Verwundung auch schwere innere Bedrängnis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד
  choice: wurde immer heftiger
  rationale: כבד bedeutet wörtlich „schwer werden“; im Zusammenhang eines Kampfes bezeichnet es dessen zunehmende Heftigkeit beziehungsweise den wachsenden Druck. Die deutsche Formulierung gibt das Idiom natürlich wieder.
- source_word: הַמִּלְחָמָה עַל שָׁאוּל
  choice: Der Kampf gegen Saul
  rationale: מִלְחָמָה bezeichnet hier das Kampfgeschehen; עַל hat in diesem feindlichen Zusammenhang die Bedeutung „gegen“.
- source_word: וַיִּמְצָאֻהוּ
  choice: da stießen ... auf ihn
  rationale: מצא heißt grundsätzlich „finden“, kann in militärischer Erzählung aber das Erreichen oder Antreffen einer Person bezeichnen. „Auf ihn stoßen“ ist im Deutschen hier natürlicher als „ihn finden“.
- source_word: הַמּוֹרִים בַּקָּשֶׁת
  choice: die Bogenschützen
  rationale: Die Wendung bedeutet wörtlich „die mit dem Bogen Schießenden“ und wird idiomatisch mit „Bogenschützen“ wiedergegeben.
- source_word: וַיָּחֶל
  choice: er wurde ... schwer verwundet
  rationale: Die schwierige Verbform kann als körperliche Verwundung oder als heftige Angst beziehungsweise Qual verstanden werden. Im Erzählzusammenhang ist die Verwundung eine plausible Hauptlesart; „schwer“ bildet die Intensität der traditionellen Deutung ab, ohne die alternative Analyse zu verschweigen.
- source_word: מִן הַיּוֹרִים
  choice: von den Schützen
  rationale: מִן bezeichnet bei der gewählten passivischen Wiedergabe den Urheber. Der allgemeinere Ausdruck „Schützen“ entspricht dem Hebräischen und vermeidet im selben Satz eine unnötige Wortwiederholung.
