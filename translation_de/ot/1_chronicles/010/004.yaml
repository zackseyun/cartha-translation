base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and mistreat me.” But his armor-bearer was not willing, because he was very afraid[c][b]. So Saul took the sword and fell on it.
translation:
  language: de
  text: 'Da sagte Saul zu seinem Waffenträger: „Zieh dein Schwert und durchbohre mich damit, sonst kommen diese Unbeschnittenen und misshandeln mich.[a]“ Doch sein Waffenträger wollte nicht, denn er hatte große Angst. Da nahm Saul das Schwert und fiel darauf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mich zum Gespött machen“ oder „mich verhöhnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: sein Waffenträger
  rationale: Die Wendung bezeichnet den Mann, der Sauls Waffen beziehungsweise Ausrüstung trug; „Waffenträger“ ist im militärischen Zusammenhang natürlich und präzise.
- source_word: שְׁלֹף חַרְבְּךָ
  choice: Zieh dein Schwert
  rationale: שלף bezeichnet bei einem Schwert das Herausziehen aus der Scheide; die knappe deutsche Wendung entspricht dem Imperativ.
- source_word: וְדָקְרֵנִי בָהּ
  choice: und durchbohre mich damit
  rationale: דקר bezeichnet das Durchstechen mit einer Waffe. „Durchbohre“ gibt die beabsichtigte tödliche Handlung deutlich wieder, ohne zusätzliche Einzelheiten einzutragen.
- source_word: פֶּן
  choice: sonst
  rationale: פֶּן leitet hier die von Saul befürchtete Folge ein. „Sonst“ ist im modernen Deutschen natürlicher als „damit nicht“ oder „auf dass nicht“.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: diese Unbeschnittenen
  rationale: Die substantivierte Bezeichnung wird unmittelbar wiedergegeben und nicht durch das kontextuell naheliegende, aber im Vers unausgesprochene „Philister“ ersetzt.
- source_word: וְהִתְעַלְּלוּ בִי
  choice: und treiben ihr grausames Spiel mit mir
  rationale: Die Hitpael-Form von עלל bezeichnet hier demütigende, gewaltsame Misshandlung beziehungsweise ein grausames Spiel. Die Formulierung bewahrt diese Breite und vermeidet eine Festlegung auf eine bestimmte Art des Missbrauchs.
- source_word: וְלֹא אָבָה
  choice: wollte nicht
  rationale: אָבָה bedeutet bereit oder willens sein; die Verneinung wird im Deutschen schlicht und idiomatisch wiedergegeben.
- source_word: כִּי יָרֵא מְאֹד
  choice: denn er hatte große Angst
  rationale: Die Begründung und die Verstärkung durch מְאֹד werden in natürlichem Deutsch bewahrt.
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: und stürzte sich darauf
  rationale: Wörtlich steht „fiel darauf“. Da Saul das Schwert zuvor selbst nimmt und die Handlung absichtlich ist, gibt „stürzte sich darauf“ den gemeinten Vorgang im Deutschen eindeutig und knapp wieder.
theological_decisions:
- issue: Art der von Saul befürchteten Behandlung
  choice: treiben ihr grausames Spiel mit mir
  alternative: mich misshandeln / mich verhöhnen
  rationale: Der hebräische Ausdruck umfasst entehrende und wahrscheinlich gewaltsame Behandlung, legt deren genaue Form jedoch nicht fest. Die Übersetzung wahrt diese Unbestimmtheit und die Schwere der Bedrohung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper erzählerischer Syntax. Die militärische Terminologie bleibt geläufig; die polemische Bezeichnung „Unbeschnittene“ wird als Bestandteil des Ausgangstextes bewahrt. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung.
