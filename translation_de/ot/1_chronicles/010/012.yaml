base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/012.yaml
  text: Then all the valiant men arose and carried away the body of Saul and the bodies of his sons[a], and brought them to Jabesh[b]. They buried their bones under the oak in Jabesh and fasted seven days.
translation:
  language: de
  text: Da machten sich alle tapferen Männer auf, nahmen den Leichnam Sauls und die Leichname seiner Söhne auf, trugen sie fort und brachten sie nach Jabesch.[a] Sie begruben ihre Gebeine unter der Terebinthe[b] in Jabesch und fasteten sieben Tage lang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im weiteren Erzählzusammenhang ist Jabesch-Gilead gemeint; der hebräische Text dieses Verses sagt verkürzt „Jabesch“.
    reason: cross_reference
  - marker: b
    text: 'Oder: „unter der Eiche“. Das hebräische Wort אֵלָה kann einen großen Baum aus dem Bereich Terebinthe/Eiche bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: alle tapferen Männer
  rationale: Die feste Wendung bezeichnet Männer, die sich durch Kraft, Mut oder militärische Tüchtigkeit auszeichnen. „Tapfere Männer“ ist im modernen Deutsch natürlich und bewahrt den Sinn von Mut und Einsatzbereitschaft.
- source_word: וַיָּקוּמוּ
  choice: machten sich ... auf
  rationale: Das Verb bedeutet wörtlich „standen auf“, bezeichnet hier aber idiomatisch den entschlossenen Beginn der Handlung. „Machten sich auf“ gibt dies natürlich wieder.
- source_word: גּוּפַת ... גּוּפֹת
  choice: den Leichnam Sauls und die Leichname seiner Söhne
  rationale: גּוּפָה bezeichnet hier ausdrücklich einen toten Körper. „Leichnam“ ist eindeutig, würdevoll und weniger grob als „Leiche“.
- source_word: וַיִּשְׂאוּ
  choice: nahmen
  rationale: נשא bezeichnet hier das Aufnehmen und Forttragen der Leichname. In Verbindung mit „brachten sie nach Jabesch“ vermeidet „nahmen“ eine schwerfällige Doppelung, ohne den Vorgang zu glätten.
- source_word: וַיְבִיאוּם יָבֵישָׁה
  choice: brachten sie nach Jabesch
  rationale: Der Vers selbst nennt die Kurzform „Jabesch“. Die im weiteren Erzählzusammenhang erkennbare Bezeichnung Jabesch-Gilead wird nicht in den Haupttext eingetragen, sondern in einer Fußnote erläutert.
- source_word: עַצְמוֹתֵיהֶם
  choice: ihre Gebeine
  rationale: Das hebräische Wort bedeutet konkret „Knochen“. „Gebeine“ bewahrt diesen konkreten Bezug und passt zugleich zum würdevollen Erzählton einer Bestattung.
- source_word: תַּחַת הָאֵלָה
  choice: unter der Terebinthe
  rationale: אֵלָה bezeichnet einen großen Baum aus dem Bedeutungsbereich Terebinthe/Eiche. „Terebinthe“ ist eine mögliche präzise Wiedergabe; die botanische Unsicherheit wird in der Fußnote offengehalten.
- source_word: וַיָּצֻמוּ שִׁבְעַת יָמִים
  choice: fasteten sieben Tage lang
  rationale: Die Formulierung gibt das Trauerfasten klar und in natürlichem modernem Deutsch wieder.
