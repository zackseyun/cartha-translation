lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Als … hörte
  rationale: Das Narrativ-Waw führt die Handlung weiter; im Zusammenhang bildet der Satz zugleich den zeitlichen Ausgangspunkt für die Reaktion im folgenden Vers. „Als“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: כֹּל יָבֵישׁ גִּלְעָד
  choice: ganz Jabesch-Gilead
  rationale: Die hebräische Ortsbezeichnung steht metonymisch für die Bevölkerung. Die knappe Ausdrucksweise des Ausgangstextes bleibt im Haupttext erhalten; die gemeinte Personengruppe wird in einer Fußnote erläutert.
- source_word: אֵת כָּל אֲשֶׁר
  choice: alles, was
  rationale: Die Wendung bezeichnet die Gesamtheit dessen, was geschehen war, und lässt sich so idiomatisch und quellennah wiedergeben.
- source_word: עָשׂוּ
  choice: getan hatten
  rationale: Das Plusquamperfekt verdeutlicht ohne inhaltlichen Zusatz, dass das Handeln der Philister dem Hören vorausging.
- source_word: פְלִשְׁתִּים
  choice: die Philister
  rationale: Dies ist die etablierte deutsche Bezeichnung der Volksgruppe.
- source_word: לְשָׁאוּל
  choice: an Saul
  rationale: Die Präposition לְ kennzeichnet hier Saul als die vom Handeln betroffene Person. „An Saul“ bewahrt die knappe und nicht vollständig festgelegte Beziehung besser als das stärker deutende „gegen Saul“.
