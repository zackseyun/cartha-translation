    rationale: Im Deutschen lautet die übliche Konstruktion „Saul etwas antun“. Sie vermittelt weiterhin nur, dass Saul von den Taten betroffen war, ohne „gegen“ als stärkere Deutung in den Haupttext aufzunehmen.
