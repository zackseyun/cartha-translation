  naturalness: „Als alle in Jabesch-Gilead hörten“ ist modernes, natürliches Standarddeutsch und erhält die knappe Ortsbezeichnung. „was die Philister Saul angetan hatten“ ist die idiomatische deutsche Wiedergabe, ohne die Art der gegen Saul verübten Handlungen näher zu bestimmen. Das abschließende Komma bleibt erforderlich, da der mit „Als“ eingeleitete Satz im nächsten Vers fortgesetzt wird.
  terminology: „Jabesch-Gilead“, „Philister“ und „Saul“ sind korrekt und etabliert. Die Fußnote zur metonymischen Ortsbezeichnung sollte nach der Änderung des Haupttexts die wörtliche hebräische Form angeben, statt eine bereits im Haupttext ausgedrückte Einwohnerlesart als bloße Alternative zu behandeln.
