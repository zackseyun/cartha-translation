    issue: „alles“ in „Sie zogen ihm alles aus“
    rationale: Das hebräische Verb besagt, dass sie ihn entkleideten beziehungsweise ihm etwas auszogen; ein allumfassendes „alles“ wird nicht ausgedrückt und sollte nicht ergänzt werden.
  - severity: low
    issue: „sandten die Nachricht ... umher“
    rationale: Die Formulierung ist zwar verständlich, wirkt aber im Deutschen weniger idiomatisch. Eine Konstruktion mit „ließen ... verkünden“ gibt den Zweck der Aussendung natürlich wieder, ohne die im Hebräischen nicht genannten Boten zu spezifizieren.
  revised_text: Sie zogen ihn aus, nahmen seinen Kopf und seine Waffen und ließen im ganzen Land der Philister die Nachricht ihren Götzen[a] und dem Volk verkünden.
