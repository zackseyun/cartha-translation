base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/009.yaml
  text: They stripped him[a], took his head and his weapons, and sent word throughout the land of the Philistines to proclaim the news to their idols and to the people.
translation:
  language: de
  text: Sie zogen ihn aus, nahmen seinen Kopf und seine Waffen und ließen im ganzen Land der Philister die Nachricht ihren Götzen[a] und dem Volk verkünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihren Götterbildern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשִׁיטֻהוּ
  choice: Sie zogen ihm alles aus
  rationale: פשט im Hifil bedeutet hier, jemanden zu entkleiden beziehungsweise ihm Kleidung oder Rüstung abzunehmen. Die Formulierung lässt offen, was genau abgenommen wurde, und ergänzt nicht ausdrücklich „Rüstung“.
- source_word: וַיִּשְׂאוּ אֶת־רֹאשׁוֹ
  choice: nahmen seinen Kopf
  rationale: נשא kann „heben“, „tragen“ oder „nehmen“ bedeuten. Im Zusammenhang mit der Behandlung des gefallenen Saul bezeichnet es das Ergreifen beziehungsweise Mitnehmen seines Kopfes, ohne die Enthauptung in diesem Vers eigens auszudrücken.
- source_word: כֵּלָיו
  choice: seine Waffen
  rationale: כְּלִי bezeichnet Geräte, Ausrüstung oder Waffen. Im Schlachtkontext ist „Waffen“ eine natürliche und wahrscheinliche Wiedergabe, auch wenn der hebräische Begriff weiter gefasst ist.
- source_word: וַיְשַׁלְּחוּ
  choice: sandten die Nachricht
  rationale: Das Verb bedeutet schlicht „sie sandten“. Der folgende Zwecksatz mit לְבַשֵּׂר zeigt, dass eine Nachricht verbreitet wurde; „die Nachricht senden“ gibt dies idiomatisch wieder, ohne ausdrücklich Boten einzuführen.
- source_word: בְאֶרֶץ פְּלִשְׁתִּים סָבִיב
  choice: im ganzen Land der Philister umher
  rationale: Die Formulierung bringt sowohl das philistäische Gebiet als auch die Verbreitung ringsum beziehungsweise überall darin zum Ausdruck.
- source_word: לְבַשֵּׂר
  choice: um sie … zu verkünden
  rationale: בשר bezeichnet das Überbringen oder öffentliche Verkünden einer Nachricht. Das Pronomen greift im Deutschen idiomatisch „die Nachricht“ auf; der triumphale Charakter ergibt sich aus dem Kontext.
- source_word: עֲצַבֵּיהֶם
  choice: ihren Götzen
  rationale: עֶצֶב kann ein kultisches Bild oder einen Götzen bezeichnen. „Götzen“ bewahrt die wertende, polemische Färbung des hebräischen Sprachgebrauchs; „Götterbilder“ bleibt als sachlich mögliche Alternative in der Fußnote erhalten.
- source_word: הָעָם
  choice: dem Volk
  rationale: Der hebräische Text hat den bestimmten kollektiven Singular „das Volk“. Gemeint ist im Kontext die Bevölkerung der Philister; ein zusätzliches „ihrem“ wird nicht eingefügt.
theological_decisions:
- issue: Wiedergabe von עֲצַבֵּיהֶם im kultischen Zusammenhang
  choice: ihren Götzen
  alternative: ihren Götterbildern
  rationale: Der Ausdruck kann die verehrten Kultbilder bezeichnen und trägt im Sprachgebrauch der Hebräischen Bibel häufig eine negative Wertung. „Götzen“ erhält diese Perspektive, während die Fußnote die gegenständlichere Übersetzung offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng am Hebräischen; zugleich sorgen „die Nachricht senden“ und die pronominale Wiederaufnahme für natürliche deutsche Syntax. Die im Ausgangstext nicht ausdrücklich genannte Rüstung und nicht ausdrücklich genannten Boten werden nicht ergänzt.
