  rationale: Die Revision entfernt die nicht im Ausgangstext enthaltene Verstärkung „alles“ und glättet die deutsche Wiedergabe der Aussendung zur Verkündigung. Die knappe, sachliche Darstellung des historischen Gewaltkontexts bleibt erhalten; weder eine Enthauptung noch Rüstung oder Boten werden über den Wortlaut hinaus ausdrücklich ergänzt.
