  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Abfolge und die zentralen Begriffe des Hebräischen insgesamt zutreffend wieder: Entkleiden, Kopf, Waffen, Verbreitung der Nachricht, Götzen und Volk. „Sie zogen ihm alles aus“ ist jedoch zu weitgehend, da „alles“ im hebräischen Text nicht steht. Die Umformung der Sendung als Veranlassung einer Verkündigung ist im Deutschen idiomatischer und bewahrt den Sinn von וַיְשַׁלְּחוּ ... לְבַשֵּׂר, ohne ausdrücklich Boten einzuführen.'
  naturalness: „Sie zogen ihn aus“ ist modernes, würdiges Standarddeutsch und genauer als „zogen ihm alles aus“. „Sie ließen im ganzen Land der Philister die Nachricht ... verkünden“ ist klarer und natürlicher als „sandten die Nachricht ... umher“, ohne den öffentlichen Charakter der Mitteilung zu verlieren.
  terminology: „Waffen“ ist im Schlachtkontext eine vertretbare kontextuelle Wiedergabe von כֵּלָיו. „Götzen“ gibt die polemische kultische Färbung von עֲצַבֵּיהֶם angemessen wieder; die Fußnote mit „Götterbildern“ bewahrt die sachlichere lexikalische Alternative. „dem Volk“ entspricht dem bestimmten kollektiven Singular הָעָם.
  issues:
