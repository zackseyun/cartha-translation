id: 1CH.10.13
reference: 1 Chronicles 10:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֣מָת שָׁא֗וּל בְּ/מַֽעֲל/וֹ֙ אֲשֶׁ֣ר מָעַ֣ל בַּֽ/יהוָ֔ה עַל דְּבַ֥ר יְהוָ֖ה אֲשֶׁ֣ר לֹא שָׁמָ֑ר וְ/גַם לִ/שְׁא֥וֹל בָּ/א֖וֹב לִ/דְרֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/013.yaml
  text: So Saul died for his unfaithfulness by which he was unfaithful to Yahweh[a], because of the word of Yahweh, which he did not keep, and also because he asked counsel of a medium[b], to inquire.
translation:
  language: de
  text: 'So starb Saul wegen des Treubruchs[a], den er gegen Yahweh begangen hatte: Er hatte das Wort Yahwehs nicht befolgt und außerdem einen Totengeist[b] befragt, um Rat zu suchen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „wegen seiner Untreue, durch die er Yahweh untreu geworden war“. Das Hebräische verbindet ein Substantiv und ein stammverwandtes Verb.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann einen Totengeist oder ein Totenorakel bezeichnen und auch auf die Person bezogen werden, die einen solchen Geist befragt; vergleiche 1. Samuel 28,7.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: So starb
  rationale: Das narrative וַ führt die Erzählung fort und hat im Zusammenhang zugleich folgernden Sinn; „So starb“ gibt beides im Deutschen knapp wieder.
- source_word: בְּמַעֲלוֹ אֲשֶׁר מָעַל
  choice: wegen des Treubruchs, den er … begangen hatte
  rationale: Nomen und stammverwandtes Verb bezeichnen einen schweren Bruch geschuldeter, besonders bundeshafter Treue. „Treubruch“ bewahrt dieses Gewicht besser als das allgemeinere „Vergehen“, auch wenn sich das hebräische Wortspiel im Deutschen nicht vollständig nachbilden lässt.
- source_word: בַּיהוָה
  choice: gegen Yahweh
  rationale: Bei מָעַל bezeichnet die Präposition denjenigen, gegen den sich der Treubruch richtet. Der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: עַל דְּבַר יְהוָה אֲשֶׁר לֹא שָׁמָר
  choice: Er hatte das Wort Yahwehs nicht befolgt
  rationale: Die kausale Beziehung wird in einen natürlichen deutschen Hauptsatz überführt. שׁמר bedeutet hier nicht bloß bewahren, sondern das göttliche Wort beachten und ihm gehorchen.
- source_word: וְגַם לִשְׁאוֹל בָּאוֹב
  choice: und außerdem einen Totengeist befragt
  rationale: Die Konstruktion fügt einen zweiten Grund für Sauls Tod hinzu. אוֹב kann den heraufbeschworenen Totengeist, das Totenorakel oder metonymisch die vermittelnde Person bezeichnen; „Totengeist“ bleibt nahe an der kultisch-okkulten Bezeichnung.
- source_word: לִדְרֹשׁ
  choice: um Rat zu suchen
  rationale: Der Infinitiv bezeichnet den Zweck der Befragung. „Rat suchen“ ist verständliches modernes Deutsch und bewahrt den Sinn gezielter Auskunftssuche.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich den persönlichen Bundesnamen. Die Umschrift „Yahweh“ macht dies sichtbar, ohne einen Titel an seine Stelle zu setzen.
- issue: Charakterisierung von Sauls Schuld
  choice: Treubruch
  alternative: Untreue; Vergehen
  rationale: מעל bezeichnet hier nicht nur allgemeines Fehlverhalten, sondern den Bruch der Yahweh geschuldeten Treue. „Treubruch“ erhält diese theologische Schärfe.
- issue: Bezug von אוֹב
  choice: Totengeist
  alternative: Totenbeschwörerin; Medium; Totenorakel
  rationale: Der Ausdruck ist lexikalisch und kulturell mehrdeutig. Der Haupttext wahrt mit „Totengeist“ den unmittelbaren Gegenstand der Befragung; die Fußnote nennt die mögliche metonymische Beziehung zur vermittelnden Person und vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert die lange Begründung und macht die beiden Aspekte von Sauls Treubruch verständlich. Fachsprachlich-archaische Ausdrücke wie „Wahrsagegeist“ oder „Totenbeschwörerin“ werden im Haupttext vermieden; die echte Bedeutungsbreite von אוֹב bleibt durch die Fußnote sichtbar.
