  terminology: „Yahweh“ folgt dem ausdrücklich im Ausgangstext stehenden Gottesnamen. „Treubruch“ vermittelt den gewichtigen, auf verletzte Treue bezogenen Charakter von מעל; die Fußnote weist zusätzlich auf die mögliche Wiedergabe „Untreue“ und die hebräische Wortverbindung hin. Die Anker sind korrekt gesetzt und die Fußnoten erläutern jeweils den markierten Ausdruck.
