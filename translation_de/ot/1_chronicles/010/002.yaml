  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. Die Wiederholung von „die Philister“ bewahrt den Nachdruck des hebräischen Textes. „… schlugen … nieder“ ist natürlich und wahrt die lexikalische Offenheit besser als „erschlugen“.
  terminology: „Philister“, „Saul“, „Jonatan“, „Abinadab“ und „Malkischua“ sind im Deutschen gebräuchlich. „Söhne Sauls“ gibt sowohl בָנָיו als auch die abschließende Apposition בְּנֵי שָׁאוּל angemessen wieder.
