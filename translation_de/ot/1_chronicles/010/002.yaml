base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/002.yaml
  text: And the Philistines pursued Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua, the sons of Saul.
translation:
  language: de
  text: Die Philister setzten Saul und seinen Söhnen hart nach[a], und die Philister schlugen Jonatan, Abinadab und Malkischua nieder, die Söhne Sauls.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »hefteten sich an Saul und seine Söhne«. Das hebräische Verb vermittelt hier das Bild einer unerbittlichen, dicht folgenden Verfolgung im Kampf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵי
  choice: setzten ... hart nach
  rationale: דבק bedeutet grundsätzlich »haften, sich anschließen«; mit אַחֲרֵי bezeichnet es hier im Kampf eine hartnäckige, unmittelbare Verfolgung. Die deutsche Wendung gibt sowohl den Verfolgungssinn als auch dessen Intensität natürlich wieder.
- source_word: פְלִשְׁתִּים
  choice: die Philister
  rationale: Die übliche deutsche Bezeichnung des Volkes; die Wiederholung in beiden hebräischen Teilsätzen bleibt erhalten und bewahrt den erzählerischen Nachdruck.
- source_word: בָנָיו
  choice: seinen Söhnen
  rationale: Das hebräische Wort bezeichnet hier männliche Nachkommen; die anschließend genannten Personen bestätigen dies.
- source_word: וַיַּכּוּ
  choice: erschlugen
  rationale: נכה kann allgemein »schlagen« oder »niederschlagen« bedeuten. Im vorliegenden Schlachtbericht bezeichnet es den tödlichen Ausgang; »erschlugen« ist knapp, würdig und kontextgerecht.
- source_word: יוֹנָתָן
  choice: Jonatan
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: אֲבִינָדָב
  choice: Abinadab
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malkischua
  rationale: Gebräuchliche deutsche Umschrift des aus zwei Bestandteilen gebildeten hebräischen Personennamens.
- source_word: בְּנֵי שָׁאוּל
  choice: die Söhne Sauls
  rationale: Die Apposition identifiziert die drei genannten Männer und wird entsprechend der hebräischen Satzstruktur ausdrücklich beibehalten.
