- from: Die Philister setzten Saul und seinen Söhnen hart nach[a]. Dann erschlugen die Philister Jonatan, Abinadab und Malkischua, die Söhne Sauls.
  to: Die Philister setzten Saul und seinen Söhnen hart nach[a], und die Philister schlugen Jonatan, Abinadab und Malkischua nieder, die Söhne Sauls.
  rationale: Die Überarbeitung ersetzt die den Tod ausdrücklich behauptende Wiedergabe „erschlugen“ durch „schlugen … nieder“, entsprechend der weiteren Bedeutung von נכה. Außerdem wird das nicht eigens markierte „Dann“ durch die dem hebräischen Anschluss entsprechende Konjunktion „und“ ersetzt. Die Verfolgungsformulierung, Namensformen, Wiederholung der Philister und Fußnotenverankerung bleiben erhalten.
