  text: וַ/יָּשִׂ֨ימוּ֙ אֶת כֵּלָ֔י/ו בֵּ֖ית אֱלֹהֵי/הֶ֑ם וְ/אֶת גֻּלְגָּלְתּ֥/וֹ תָקְע֖וּ בֵּ֥ית דָּגֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/010.yaml
  text: They put his armor in the house of their gods[b][a], and they fastened his skull in the house of Dagon.
translation:
  language: de
  text: Sie legten seine Waffen[a] in den Tempel ihrer Götter[b] und befestigten seinen Schädel[c] im Tempel Dagons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Ausrüstung“ beziehungsweise „seine Rüstung“. Das hebräische Wort kann Geräte, Ausrüstung oder Waffen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in das Haus ihrer Götter“. „Haus“ ist im Hebräischen eine übliche Bezeichnung für den Tempel einer Gottheit; ebenso beim Tempel Dagons.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „seinen Kopf“. Das hebräische Wort bezeichnet genauer den Schädel, kann aber auch für den Kopf stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: sie legten
  rationale: שׂים bedeutet „setzen, legen, stellen“. „Legten“ ist in diesem Zusammenhang natürlich und beschreibt das Deponieren der Waffen im Heiligtum, ohne die Art der Aufstellung näher festzulegen.
- source_word: כֵּלָיו
  choice: seine Waffen
  rationale: כְּלִי kann Gerät, Ausrüstung oder Waffen bezeichnen. Im Zusammenhang mit Sauls Tod im Kampf bezeichnet „Waffen“ am ehesten seine militärischen Gegenstände, ohne sie auf eine Rüstung zu beschränken.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: in den Tempel ihrer Götter
  rationale: בַּיִת heißt wörtlich „Haus“, bezeichnet bei einer Gottheit jedoch idiomatisch deren Tempel. „Tempel“ vermittelt diese kultische Bedeutung im heutigen Deutsch klar.
- source_word: גֻּלְגָּלְתּוֹ
  choice: seinen Schädel
  rationale: גֻּלְגֹּלֶת bezeichnet den Schädel und kann im weiteren Sinn für den Kopf stehen. „Schädel“ gibt den konkreten Ausdruck präzise wieder.
- source_word: תָקְעוּ
  choice: befestigten
  rationale: תקע kann „hineintreiben, festmachen, befestigen“ bedeuten. „Befestigten“ beschreibt die öffentliche Anbringung, ohne die nicht ausdrücklich genannte Vorstellung einer Pfählung einzutragen.
- source_word: בֵּית דָּגוֹן
  choice: im Tempel Dagons
  rationale: Das wörtliche „Haus Dagons“ bezeichnet hier Dagons Heiligtum. Der Eigenname Dagon bleibt unverändert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tempel“ vermeidet die im Deutschen missverständliche wörtliche Form „Haus ihrer Götter“, während die Fußnote den hebräischen Ausdruck bewahrt. Die knappe, drastische Darstellung des Ausgangstextes bleibt erhalten.
