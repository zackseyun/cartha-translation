    rationale: „fielen erschlagen“ vermittelt dieselbe Aussage – im Kampf getötet zu werden – knapper und idiomatischer.
  - severity: low
    issue: Die Fußnote zur angeblichen geographischen Mehrdeutigkeit ist nicht erforderlich.
    rationale: Der hebräische Text verwendet eindeutig den Singular הַר; eine Anmerkung zu einem möglichen Berggebiet schafft hier eher eine nicht notwendige Unsicherheit.
