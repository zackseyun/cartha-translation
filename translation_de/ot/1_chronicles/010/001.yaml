  text: וּ/פְלִשְׁתִּ֖ים נִלְחֲמ֣וּ בְ/יִשְׂרָאֵ֑ל וַ/יָּ֑נָס אִֽישׁ יִשְׂרָאֵל֙ מִ/פְּנֵ֣י פְלִשְׁתִּ֔ים וַ/יִּפְּל֥וּ חֲלָלִ֖ים בְּ/הַ֥ר גִּלְבֹּֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/001.yaml
  text: The Philistines fought against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: de
  text: Die Philister kämpften gegen Israel, und die Männer Israels flohen vor den Philistern und fielen erschlagen auf dem Berg Gilboa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Die Philister
  rationale: Der Volksname wird in seiner geläufigen deutschen Form wiedergegeben. Das einleitende ו verbindet den Satz mit dem Kontext; im Deutschen ist dafür kein ausdrückliches „Und“ nötig.
- source_word: נִלְחֲמוּ בְיִשְׂרָאֵל
  choice: kämpften gegen Israel
  rationale: Die Nifal-Form von לחם mit ב bezeichnet hier im militärischen Zusammenhang eindeutig den Kampf gegen einen Gegner.
- source_word: וַיָּנָס אִישׁ יִשְׂרָאֵל
  choice: die Männer Israels flohen
  rationale: Das formal singularische אִישׁ wird hier kollektiv gebraucht. „Die Männer Israels“ bewahrt den Bezug auf die israelitischen Kämpfer und klingt im Deutschen natürlich.
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: vor den Philistern
  rationale: Die Wendung מִפְּנֵי bezeichnet hier die Flucht angesichts beziehungsweise weg von den Philistern. „Vor den Philistern fliehen“ ist die natürliche deutsche Entsprechung.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: fielen als Erschlagene
  rationale: חֲלָלִים bezeichnet gewaltsam Getötete beziehungsweise im Kampf Erschlagene. Die Formulierung erhält sowohl das Verb „fallen“ als auch den militärischen Todessinn.
- source_word: בְּהַר גִּלְבֹּעַ
  choice: auf dem Gebirge Gilboa
  rationale: הַר kann einen Berg oder ein Bergland bezeichnen. Gilboa ist eine Bergkette; „Gebirge Gilboa“ ist daher geografisch angemessen und gibt die hebräische Konstruktion würdig wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die kollektiv gebrauchte Singularform wird idiomatisch als „die Männer Israels“ wiedergegeben; die Schlachtformel bleibt mit „fielen als Erschlagene“ nah am Hebräischen.
