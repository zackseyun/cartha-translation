  text: For the Amramites[a], the Izharites, the Hebronites, and the Uzzielites.
translation:
  language: de
  text: Für die Amramiter[a], die Jizhariter, die Hebroniter und die Usiëliter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Von den Amramitern, den Jizharitern, den Hebronitern und den Usiëlitern.“ Der hebräische Text besteht nur aus vier Sippenbezeichnungen mit der Präposition ל und dient als Listenüberschrift.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעַמְרָמִי
  choice: Für die Amramiter
  rationale: Das vorangestellte ל kennzeichnet hier wahrscheinlich eine überschriftartige Zuordnung innerhalb der administrativen Liste. „Für die Amramiter“ gibt diese Funktion natürlich wieder, ohne den elliptischen Charakter des Hebräischen durch ein Verb zu ergänzen.
- source_word: לַיִּצְהָרִי
  choice: die Jizhariter
  rationale: Die gentilizische Form bezeichnet die Sippe beziehungsweise die Nachkommen Jizhars. Die knappe Bildung auf „-iter“ bewahrt Form und Listencharakter.
- source_word: לַחֶבְרוֹנִי
  choice: die Hebroniter
  rationale: Die gentilizische Form wird als Bezeichnung der von Hebron abgeleiteten Sippe wiedergegeben und parallel zu den übrigen Gruppennamen formuliert.
- source_word: לָעָזִּיאֵלִי
  choice: die Usiëliter
  rationale: Die gentilizische Form bezeichnet die Sippe beziehungsweise Nachkommen Usiëls. „und“ wird für eine natürliche deutsche Aufzählung ergänzt.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Standarddeutsch. Die Ellipse und der Charakter einer Listenüberschrift bleiben erhalten; ein im Hebräischen nicht vorhandenes Verb wird nicht ergänzt. Die Sippennamen werden einheitlich mit der deutschen Endung „-iter“ wiedergegeben.
