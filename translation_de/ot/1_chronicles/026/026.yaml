source:
  edition: WLC
  text: ה֧וּא שְׁלֹמ֣וֹת וְ/אֶחָ֗י/ו עַ֣ל כָּל אֹצְר֤וֹת הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר הִקְדִּ֜ישׁ דָּוִ֣יד הַ/מֶּ֗לֶךְ וְ/רָאשֵׁ֧י הָ/אָב֛וֹת לְ/שָׂרֵֽי הָ/אֲלָפִ֥ים וְ/הַ/מֵּא֖וֹת וְ/שָׂרֵ֥י הַ/צָּבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/026.yaml
  text: Shelomoth and his brothers were over all the treasuries of the holy things that King David[a], the heads of the fathers’ houses, the commanders of thousands and of hundreds[b], and the commanders of the army had dedicated.
translation:
  language: de
  text: Schelomot und seine Brüder waren für sämtliche Schatzkammern für die geweihten Gaben[a] verantwortlich, die König David, die Oberhäupter der Großfamilien[b], die Befehlshaber über Tausendschaften und Hundertschaften sowie die Heerführer geweiht hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die heiligen Dinge“ beziehungsweise „die heiligen Gaben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Oberhäupter der Väter“; gemeint sind Leiter abstammungsbezogener Großfamilien oder Sippen.'
    reason: cultural_note
lexical_decisions:
- source_word: הוּא שְׁלֹמוֹת וְאֶחָיו
  choice: Schelomot und seine Brüder waren
  rationale: Das vorangestellte הוּא nimmt Schelomot hervorhebend auf; mit dem zusammengesetzten Subjekt verlangt natürliches Deutsch den Plural. אָח wird direkt als „Brüder“ wiedergegeben, kann im levitischen Zusammenhang aber auch nähere männliche Verwandte oder Amtsgenossen einschließen.
- source_word: עַל
  choice: waren … verantwortlich
  rationale: עַל bezeichnet hier administrative Aufsicht oder Zuständigkeit. Die deutsche Wendung ist klarer und natürlicher als das wörtliche „waren über“.
- source_word: כָּל אֹצְרוֹת הַקֳּדָשִׁים
  choice: sämtliche Schatzkammern mit den heiligen Gaben
  rationale: אֹצָר kann Schatz, Vorrat oder den Aufbewahrungsort bezeichnen; im administrativen Tempelkontext sind Schatzkammern gemeint. הַקֳּדָשִׁים bezeichnet die geheiligten Gegenstände beziehungsweise Gaben darin.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: die … geweiht hatten
  rationale: קדשׁ im Hifil bedeutet „heiligen, weihen, als heilig aussondern“. Der Relativsatz bezieht sich sinngemäß auf die heiligen Gaben, nicht auf die Kammern.
- source_word: דָּוִיד הַמֶּלֶךְ
  choice: König David
  rationale: Die im Deutschen übliche Titelstellung gibt die hebräische Bezeichnung natürlich wieder.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: die Oberhäupter der Großfamilien
  rationale: Die wörtliche Wendung „Oberhäupter der Väter“ ist ein auf Abstammung beruhender Verwaltungsbegriff. „Großfamilien“ vermittelt diese soziale Einheit im heutigen Deutsch, ohne sie mit modernen Kleinfamilien gleichzusetzen.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: die Befehlshaber über Tausendschaften und Hundertschaften
  rationale: שַׂר bezeichnet hier militärische Führer; „Tausendschaften“ und „Hundertschaften“ geben die benannten militärisch-administrativen Einheiten wieder, ohne zwingend exakte Mannschaftsstärken zu behaupten.
- source_word: שָׂרֵי הַצָּבָא
  choice: die Heerführer
  rationale: צָבָא bezeichnet in diesem Zusammenhang das Heer. „Heerführer“ ist knapp, verständlich und unterscheidet diese Gruppe sprachlich von den zuvor genannten Einheitsbefehlshabern.
theological_decisions:
- issue: Wer die heiligen Gaben weihte
  choice: Alle aufgezählten Gruppen werden als gemeinsam handelnde Stifter verstanden.
  alternative: Nur David weihte die Gaben; die folgenden Gruppen wären anders an den Satz anzuschließen.
  rationale: Die mit וְ verbundenen Glieder bilden am natürlichsten eine gemeinsame Subjektliste. Das hebräische Verb steht zwar im Singular und folgt unmittelbar auf „König David“, doch eine solche Kongruenz mit dem ersten Glied ist im biblischen Hebräisch möglich. Der deutsche Plural gibt die wahrscheinlichste Syntax wieder, ohne eine besondere theologische Aussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schelomot“ folgt einer gebräuchlichen deutschen Umschrift des hebräischen Namens. Die technischen Verwaltungs- und Militärbegriffe werden verständlich, aber ohne moderne institutionelle Gleichsetzungen wiedergegeben.
