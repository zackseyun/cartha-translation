  text: לַ/יִּצְהָרִ֞י כְּנַנְיָ֣הוּ וּ/בָנָ֗י/ו לַ/מְּלָאכָ֤ה הַ/חִֽיצוֹנָה֙ עַל יִשְׂרָאֵ֔ל לְ/שֹׁטְרִ֖ים וּ/לְ/שֹׁפְטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/029.yaml
  text: For the Izharites[a], Chenaniah and his sons were assigned to the outside work over Israel, as officers and judges.
translation:
  language: de
  text: Von den Jizharitern waren Kenanja und seine Söhne für den äußeren Dienst[a] über Israel als Beamte und Richter eingesetzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für die äußere Arbeit“. Gemeint sind wohl Aufgaben außerhalb des zentralen Heiligtumsdienstes, insbesondere Verwaltungs- und Rechtsprechungsaufgaben in Israel.'
    reason: Die hebräische Wendung bezeichnet wörtlich einen „äußeren“ Dienst bzw. eine „äußere“ Arbeit. Die Einordnung als Tätigkeit außerhalb des zentralen Heiligtumsdienstes ist kontextuell naheliegend, bleibt jedoch eine Erläuterung und wird daher nicht in den Haupttext aufgenommen.
lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: Von den Jizharitern
  rationale: Das vorangestellte ל leitet in dieser Aufgabenliste die betreffende Sippe ein. „Von den Jizharitern“ ist im Deutschen idiomatisch und lässt Kenanja und seine Söhne als Angehörige dieser Gruppe erkennen.
- source_word: כְּנַנְיָהוּ
  choice: Kenanja
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert.
- source_word: וּבָנָיו
  choice: und seine Söhne
  rationale: בנים bezeichnet hier im genealogischen Zusammenhang ausdrücklich die Söhne.
- source_word: לַמְּלָאכָה הַחִיצוֹנָה
  choice: für die Aufgaben außerhalb des Heiligtums
  rationale: מלאכה bezeichnet Arbeit oder Aufgaben; חיצונה bedeutet „außen gelegen/äußerlich“. Der Kontext kontrastiert diese Tätigkeit mit dem zentralen Heiligtumsdienst. Die Verdeutlichung wird durch eine Fußnote als kontextuelle Deutung kenntlich gemacht.
- source_word: עַל יִשְׂרָאֵל
  choice: in Israel zuständig
  rationale: על kann hier den Zuständigkeits- oder Aufsichtsbereich bezeichnen. Natürliches Deutsch verlangt eher „in Israel zuständig“ als das missverständliche „über Israel“.
- source_word: לְשֹׁטְרִים
  choice: als Verwaltungsbeamte
  rationale: שׁטרים meint hier Amtsträger mit administrativen Aufgaben, nicht Polizeibeamte. „Verwaltungsbeamte“ macht die Funktion für heutige Leser verständlich.
- source_word: וּלְשֹׁפְטִים
  choice: und Richter
  rationale: שׁפטים bezeichnet Personen, die richterliche Aufgaben wahrnehmen; „Richter“ ist die direkte und transparente Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp wie die hebräische Ämterliste, wird aber durch „waren … zuständig“ idiomatisch geglättet. Funktionsbezeichnungen werden verständlich und ohne konfessionelle Zusätze wiedergegeben.
