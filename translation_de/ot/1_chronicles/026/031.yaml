  text: לַֽ/חֶבְרוֹנִי֙ יְרִיָּ֣ה הָ/רֹ֔אשׁ לַֽ/חֶבְרוֹנִ֥י לְ/תֹלְדֹתָ֖י/ו לְ/אָב֑וֹת בִּ/שְׁנַ֨ת הָֽ/אַרְבָּעִ֜ים לְ/מַלְכ֤וּת דָּוִיד֙ נִדְרָ֔שׁוּ וַ/יִּמָּצֵ֥א בָ/הֶ֛ם גִּבּ֥וֹרֵי חַ֖יִל בְּ/יַעְזֵ֥יר גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/031.yaml
  text: For the Hebronites[a], Jeriah was the chief of the Hebronites according to his generations by fathers’ houses. In the fortieth year of David’s reign they were sought out[c][b], and among them mighty men of valor were found at Jazer of Gilead.
translation:
  language: de
  text: Bei den Hebronitern war Jerija das Oberhaupt der Hebroniter nach seinen Geschlechterfolgen, nach den Vaterhäusern.[a] Im vierzigsten Jahr der Herrschaft Davids forschte man nach ihnen; und unter ihnen fanden sich in Jaser in Gilead tüchtige Männer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vaterhäuser“ bezeichnet Großfamilien beziehungsweise Sippen, die nach gemeinsamen Vorfahren gegliedert waren, nicht nur einzelne Kernfamilien.
    reason: cultural_note
  - marker: b
    text: 'Oder: „tapfere Krieger“ beziehungsweise „fähige Männer“. Die hebräische Wendung kann Stärke, Tapferkeit oder besondere Tüchtigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֶבְרוֹנִי ... לַחֶבְרוֹנִי
  choice: Bei den Hebronitern ... der Hebroniter
  rationale: Das erste ל führt die Sippe als neues Thema ein; die Wiederholung bezeichnet die Gruppe, deren Oberhaupt Jerija war.
- source_word: יְרִיָּה
  choice: Jerija
  rationale: Moderne deutsche Umschrift des Personennamens entsprechend der hebräischen Konsonantenform.
- source_word: הָרֹאשׁ
  choice: das Oberhaupt
  rationale: רֹאשׁ bezeichnet hier den führenden Vertreter innerhalb einer genealogisch-administrativen Gliederung.
- source_word: לְתֹלְדֹתָיו לְאָבוֹת
  choice: nach ihren Geschlechterfolgen und ihren Stammhäusern
  rationale: Die Formulierung bewahrt sowohl den genealogischen Bezug von תולדות als auch den technischen Sippenbegriff אָבוֹת. Das deutsche Pluralpronomen bezieht die Gliederung natürlich auf die Hebroniter, ohne die sperrige hebräische Konstruktion nachzuahmen.
- source_word: בִּשְׁנַת הָאַרְבָּעִים לְמַלְכוּת דָּוִיד
  choice: Im vierzigsten Jahr der Herrschaft Davids
  rationale: Natürliche Wiedergabe der Regierungsdatierung; „Herrschaft“ gibt מַלְכוּת in diesem Kontext angemessen wieder.
- source_word: נִדְרָשׁוּ
  choice: forschte man nach ihnen
  rationale: Der Niphal bezeichnet hier eine gezielte Nachforschung oder Ermittlung. Die deutsche unpersönliche Konstruktion wahrt den passivischen Sinn und lässt offen, ob Personen oder genealogische Verhältnisse überprüft wurden.
- source_word: וַיִּמָּצֵא בָהֶם
  choice: und unter ihnen fanden sich
  rationale: Idiomatiches Deutsch für die hebräische Existenz- bzw. Auffindungskonstruktion; „unter ihnen“ gibt בָהֶם wieder.
- source_word: גִּבּוֹרֵי חַיִל
  choice: tüchtige Männer
  rationale: Die feste Wendung kann Stärke, Tapferkeit, militärische Tüchtigkeit oder allgemein erwiesene Befähigung bezeichnen. Im administrativen Zusammenhang vermeidet diese Wiedergabe eine unbegründete Verengung auf Krieger.
- source_word: בְּיַעְזֵיר גִּלְעָד
  choice: in Jaser in Gilead
  rationale: Die Ortsangabe wird in natürlichem Deutsch wiedergegeben; Jaser ist die gebräuchliche deutsche Namensform.
