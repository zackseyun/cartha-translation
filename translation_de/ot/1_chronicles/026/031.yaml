  to: Bei den Hebronitern war Jerija das Oberhaupt der Hebroniter nach seinen Geschlechterfolgen, nach den Vaterhäusern.[a] Im vierzigsten Jahr der Herrschaft Davids forschte man nach ihnen; und unter ihnen fanden sich in Jaser in Gilead tüchtige Männer.[b]
