  text: From the wars and from the spoil they had dedicated things to strengthen the house of Yahweh.
translation:
  language: de
  text: Von den Kriegen und von der Beute hatten sie etwas geweiht, um das Haus Jahwes zu stärken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Von den Kriegen und von der Beute weihten sie [etwas], um das Haus Jahwes zu stärken.“ Das Hebräische nennt das Objekt nicht ausdrücklich; „Beute“ kann auch mit „Plündergut“ wiedergegeben werden. „Stärken“ kann im Zusammenhang mit einem Gebäude dessen Erhaltung oder Ausbesserung einschließen.'
    reason: Das unausgesprochene Objekt sowie die Bedeutungsbreite von שָׁלָל und חזק werden kenntlich gemacht, ohne den Haupttext auf eine bestimmte Art von Gegenständen oder Baumaßnahmen festzulegen.
lexical_decisions:
- source_word: מִן הַמִּלְחָמוֹת
  choice: Von den Kriegen
  rationale: מִן bezeichnet Herkunft oder Quelle; der Plural מִלְחָמוֹת wird seinem breiten kollektiven Sinn entsprechend mit „Kriegen“ wiedergegeben.
- source_word: וּמִן הַשָּׁלָל
  choice: und von der Beute
  rationale: שָׁלָל bezeichnet im Krieg erbeutete Güter. „Beute“ ist im modernen Deutschen natürlich und lässt den militärischen Zusammenhang erkennen.
- source_word: הִקְדִּישׁוּ
  choice: hatten sie Gaben geheiligt
  rationale: Der Hifil von קדשׁ bedeutet, etwas als heilig auszusondern oder zu weihen. Das im Hebräischen unausgesprochene Objekt wird für verständliches Deutsch als „Gaben“ ergänzt; das Plusquamperfekt fügt den Vorgang in den erzählerischen Rückblick ein.
- source_word: לְחַזֵּק
  choice: um … instand zu halten
  rationale: חזק bedeutet grundsätzlich „stärken“. Auf ein Gebäude bezogen bezeichnet es hier dessen bauliche Stärkung, Erhaltung oder Ausbesserung; „instand halten“ gibt diesen Zweck idiomatisch wieder, ohne ihn auf eine einzelne Reparatur zu verengen.
- source_word: לְבֵית יְהוָה
  choice: das Haus Jahwes
  rationale: „Haus“ bewahrt die hebräische Bezeichnung für das Heiligtum; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname bleibt als solcher erkennbar. Die im Deutschen geläufige Form „Jahwe“ wahrt den Bezug zum hebräischen Tetragramm, ohne ihn durch einen Titel zu ersetzen.
- issue: Sakrale Bedeutung von הִקְדִּישׁוּ
  choice: geheiligt
  alternative: geweiht
  rationale: „Geheiligt“ bewahrt ausdrücklich den Gedanken, dass die Güter für einen heiligen Zweck ausgesondert wurden; „geweiht“ wäre ebenfalls möglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gaben“ macht das implizite Objekt verständlich; die Fußnote dokumentiert die formnähere Fassung. „Instand halten“ ist bei einem Gebäude natürlicher als das wörtliche „stärken“.
