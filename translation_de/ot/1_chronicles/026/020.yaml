  text: וְֽ/הַ/לְוִיִּ֑ם אֲחִיָּ֗ה עַל אֽוֹצְרוֹת֙ בֵּ֣ית הָ/אֱלֹהִ֔ים וּ/לְ/אֹֽצְר֖וֹת הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/020.yaml
  text: And of the Levites[b][a], Ahijah was over the treasuries of the house of God and the treasuries of the holy things.
translation:
  language: de
  text: Und von den Leviten[a] war Achija über die Schatzkammern des Hauses Gottes und über die Schatzkammern der geweihten Dinge eingesetzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und die Leviten: Achija war über … eingesetzt.« Der hebräische Satzanfang ist knapp und elliptisch und kann wie eine überschriftartige Überleitung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Und von den Leviten
  rationale: Die elliptische hebräische Eröffnung wird als thematischer Übergang verstanden. Die Formulierung bewahrt die Unvollständigkeit des Ausdrucks, bleibt im Deutschen aber verständlich.
- source_word: אֲחִיָּה
  choice: Achija
  rationale: Gebräuchliche deutsche Umschrift des hebräischen Personennamens.
- source_word: עַל
  choice: war über … eingesetzt
  rationale: In diesem Verwaltungskontext bezeichnet die Präposition Aufsicht beziehungsweise Zuständigkeit. Die Ergänzung „eingesetzt“ ergibt natürliches, würdevolles Deutsch.
- source_word: אֹצְרוֹת
  choice: Schatzkammern
  rationale: Im Zusammenhang mit dem Heiligtum bezeichnet das Wort Räume oder Bestände zur Aufbewahrung von Wertgegenständen und Vorräten.
- source_word: בֵּית הָאֱלֹהִים
  choice: Haus Gottes
  rationale: Die direkte Wiedergabe erhält das hebräische Bild; gemeint ist der Heiligtums- beziehungsweise Tempelkomplex.
- source_word: וּלְאֹצְרוֹת
  choice: und über die Schatzkammern
  rationale: Die Wiederholung von „über“ macht im Deutschen eindeutig, dass Achijas Aufsicht beide Arten von Schatzkammern umfasst.
- source_word: הַקֳּדָשִׁים
  choice: die heiligen Gaben
  rationale: Der Ausdruck bezeichnet Dinge, die für den heiligen Gebrauch ausgesondert oder Gott geweiht waren. „Gaben“ passt zum Schatzkammerkontext, ohne die genaue Art der Gegenstände festzulegen.
