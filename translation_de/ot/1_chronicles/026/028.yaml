  to: Und alles, was Samuel, der Seher[a], Saul, der Sohn Kischs, Abner, der Sohn Ners, und Joab, der Sohn der Zeruja, geweiht hatten – alles, was geweiht worden war –, stand unter der Aufsicht Schelomits und seiner Brüder.[b]
