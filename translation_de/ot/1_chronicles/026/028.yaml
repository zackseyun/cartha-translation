  text: וְ/כֹ֨ל הַֽ/הִקְדִּ֜ישׁ שְׁמוּאֵ֤ל הָ/רֹאֶה֙ וְ/שָׁא֣וּל בֶּן קִ֔ישׁ וְ/אַבְנֵ֣ר בֶּן נֵ֔ר וְ/יוֹאָ֖ב בֶּן צְרוּיָ֑ה כֹּ֚ל הַ/מַּקְדִּ֔ישׁ עַ֥ל יַד שְׁלֹמִ֖ית וְ/אֶחָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/028.yaml
  text: And all that Samuel the seer[a], Saul son of Kish, Abner son of Ner[b], and Joab son of Zeruiah had dedicated—everything that anyone had dedicated—was under the care of Shelomith and his brothers.
translation:
  language: de
  text: Und alles, was Samuel, der Seher[a], Saul, der Sohn Kischs, Abner, der Sohn Ners, und Joab, der Sohn der Zeruja, geweiht hatten – alles, was geweiht worden war –, stand unter der Aufsicht Schelomits und seiner Brüder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Seher“ ist die ältere hebräische Bezeichnung רֹאֶה für eine prophetische Gestalt.
    reason: cultural_note
  - marker: b
    text: 'Oder: „seiner Verwandten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Und alles
  rationale: Gibt die umfassende Bedeutung von כֹל natürlich wieder und knüpft den Vers an den vorausgehenden Zusammenhang an.
- source_word: הַהִקְדִּישׁ / הַמַּקְדִּישׁ
  choice: geheiligt hatte
  rationale: Die Hifil-Form von קדשׁ bezeichnet hier das Aussondern beziehungsweise Übergeben von Gegenständen für den heiligen Gebrauch. „Heiligen“ bewahrt den sakralen Gehalt; das Plusquamperfekt entspricht dem rückblickenden Zusammenhang.
- source_word: שְׁמוּאֵל הָרֹאֶה
  choice: Samuel, der Seher
  rationale: „Seher“ bewahrt die besondere ältere Amtsbezeichnung רֹאֶה, ohne sie mit dem allgemeineren Ausdruck „Prophet“ gleichzusetzen.
- source_word: בֶּן
  choice: Sohn des / Sohn der
  rationale: Die genealogische Formel wird direkt und in idiomatischem Deutsch wiedergegeben.
- source_word: צְרוּיָה
  choice: Zeruja
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenkonvention transliteriert.
- source_word: כֹּל הַמַּקְדִּישׁ
  choice: alles, was jemand geheiligt hatte
  rationale: Der substantivierte Singularpartizip kann kollektiv beziehungsweise verallgemeinernd verstanden werden. Die Formulierung macht deutlich, dass die Zusammenfassung über die zuvor genannten Personen hinaus alle Stiftungen umfasst.
- source_word: עַל יַד
  choice: stand unter der Aufsicht
  rationale: Die Wendung bezeichnet im administrativen Zusammenhang Zuständigkeit oder Verwaltung, nicht wörtlich eine Lage „auf der Hand“.
- source_word: שְׁלֹמִית
  choice: Schelomit
  rationale: Der Personenname wird in einer im Deutschen geläufigen, quellenahen Form wiedergegeben.
- source_word: וְאֶחָיו
  choice: und seiner Brüder
  rationale: Die direkte Bedeutung ist „seine Brüder“; eine weitere Bedeutung wie „Verwandte“ ist möglich und wird in einer Fußnote kenntlich gemacht.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederaufnahme durch „alles“ bleibt erhalten, weil sie die hebräische Struktur und den umfassenden Sinn abbildet. Die Namensappositionen werden zur besseren Lesbarkeit durch Kommas gegliedert.
