revisions:
- from: Für die Hebroniter waren Haschabja und seine Brüder, 1.700 tüchtige Männer, mit der Aufsicht über Israel westlich des Jordan[a] betraut, und zwar mit allen Aufgaben des HERRN und mit dem Dienst des Königs.
  to: Für die Hebroniter waren Haschabja und seine Brüder, 1.700 tüchtige Männer, mit der Aufsicht über Israel westlich des Jordan[a] betraut, für alle Aufgaben des HERRN und für den Dienst des Königs.
  rationale: Die Revision beschränkt sich auf die präpositionale Anbindung der beiden Zuständigkeitsbereiche. Sie bildet die hebräischen לְ-Präpositionen genauer ab und verbessert zugleich den deutschen Satzfluss. Die räumliche Wendung bleibt idiomatisch im Haupttext und wird durch die vorhandene Fußnote transparent erläutert.
