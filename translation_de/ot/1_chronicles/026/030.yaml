  text: לַֽ/חֶבְרוֹנִ֡י חֲשַׁבְיָהוּ֩ וְ/אֶחָ֨י/ו בְּנֵי חַ֜יִל אֶ֣לֶף וּ/שְׁבַע מֵא֗וֹת עַ֚ל פְּקֻדַּ֣ת יִשְׂרָאֵ֔ל מֵ/עֵ֥בֶר לַ/יַּרְדֵּ֖ן מַעְרָ֑בָ/ה לְ/כֹל֙ מְלֶ֣אכֶת יְהוָ֔ה וְ/לַ/עֲבֹדַ֖ת הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/030.yaml
  text: 'For the Hebronites: Hashabiah and his brothers[a], 1,700 capable men, were in charge of the oversight of Israel west of the Jordan, for all the work of the LORD and for the service of the king.'
translation:
  language: de
  text: Für die Hebroniter waren Haschabja und seine Brüder, 1.700 tüchtige Männer, mit der Aufsicht über Israel westlich des Jordan[a] betraut, für alle Aufgaben des HERRN und für den Dienst des Königs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jenseits des Jordan, westwärts“, das heißt auf der Westseite des Jordan.'
    reason: Die Fußnote bewahrt die ungewöhnliche räumliche Formulierung des Hebräischen, während der Haupttext ihre kontextuelle Bedeutung verständlich wiedergibt.
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: Für die Hebroniter
  rationale: Die singularische Gruppenbezeichnung meint im Zusammenhang die hebronitische levitische Sippe; der deutsche Plural gibt diese kollektive Bedeutung natürlich wieder.
- source_word: חֲשַׁבְיָהוּ
  choice: Haschabja
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenschreibung wiedergegeben.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: Dies bewahrt die konkrete Verwandtschaftsbezeichnung des Hebräischen; im Sippenzusammenhang können auch weitere männliche Verwandte eingeschlossen sein.
- source_word: בְּנֵי חַיִל
  choice: tüchtige Männer
  rationale: חַיִל bezeichnet hier angesichts der Verwaltungsaufgabe eher Befähigung und Tüchtigkeit als militärische Tapferkeit.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת
  choice: '1.700'
  rationale: Die Zahl wird nach moderner deutscher Schreibweise mit Tausenderpunkt wiedergegeben.
- source_word: עַל פְּקֻדַּת יִשְׂרָאֵל
  choice: mit der Aufsicht über Israel betraut
  rationale: פְּקֻדָּה bezeichnet hier Aufsicht beziehungsweise eine übertragene Zuständigkeit; die Formulierung macht das administrative Verantwortungsverhältnis idiomatisch deutlich.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מַעְרָבָה
  choice: westlich des Jordan
  rationale: Die Wendung bezeichnet in diesem Zusammenhang die westliche Seite des Jordan. Die wörtlichere, perspektivisch mehrdeutige Ausdrucksweise wird in der Fußnote bewahrt.
- source_word: לְכֹל מְלֶאכֶת יְהוָה
  choice: mit allen Aufgaben des HERRN
  rationale: מְלָאכָה umfasst Arbeit, Aufgabe oder Angelegenheit. „Aufgaben“ passt zum administrativen Zusammenhang, ohne die Art der Tätigkeiten unnötig einzuengen.
- source_word: וְלַעֲבֹדַת הַמֶּלֶךְ
  choice: und mit dem Dienst des Königs
  rationale: עֲבֹדָה bezeichnet den Dienst beziehungsweise die Pflicht gegenüber dem König und bleibt von den zuvor genannten Aufgaben des HERRN unterschieden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: HERR
  alternative: Jahwe
  rationale: Die im deutschen Bibelgebrauch etablierte Wiedergabe „HERR“ kennzeichnet den Gottesnamen und entspricht hier der konsultierten POB-Konvention. Die Alternative „Jahwe“ würde den Namen transliterieren; der Vers selbst verlangt keine darüber hinausgehende theologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau erhält den Charakter einer Verwaltungsliste, wird aber durch „und zwar“ verständlich gegliedert. „Tüchtige Männer“ vermeidet eine unpassende militärische Zuspitzung. Der Fußnotenmarker steht unmittelbar bei der räumlichen Wendung, die er erläutert.
