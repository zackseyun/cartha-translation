base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/012.yaml
  text: For these divisions of the gatekeepers[a], the chief men had assigned duties corresponding to those of their brothers, to minister in the house of Yahweh.
translation:
  language: de
  text: Für diese Abteilungen der Torwächter waren den führenden Männern Dienstaufgaben entsprechend denen ihrer Brüder zugeteilt,[a] um im Haus Jahwes Dienst zu tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die führenden Männer hatten Wachdienste neben ihren Brüdern.« Das Hebräische ist knapp; מִשְׁמָרוֹת kann auch »Wachen«, »Wachdienste« oder »Dienstordnungen« bedeuten.'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: לְאֵלֶּה מַחְלְקוֹת הַשֹּׁעֲרִים
  choice: Für diese Abteilungen der Torwächter
  rationale: Die Präposition לְ leitet die zusammenfassende Aussage ein; מַחְלְקוֹת bezeichnet die geordneten Dienstabteilungen und הַשֹּׁעֲרִים die Torwächter.
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: die führenden Männer
  rationale: Die kompakte Wendung bezeichnet die Männer in leitender Stellung, ohne גְּבָרִים unnötig militärisch als »Krieger« zu deuten.
- source_word: מִשְׁמָרוֹת
  choice: hatten ... Dienstaufgaben
  rationale: Das Substantiv kann Wachen, Dienstordnungen oder zugewiesene Aufgaben bezeichnen. Die ergänzte Verbform macht die elliptische hebräische Konstruktion im Deutschen verständlich.
- source_word: לְעֻמַּת אֲחֵיהֶם
  choice: wie ihre Brüder
  rationale: לְעֻמַּת drückt hier eine entsprechende oder parallele Zuordnung aus; »wie« gibt diese Beziehung natürlich wieder, während »Brüder« die konkrete Ausdrucksweise des Hebräischen bewahrt.
- source_word: לְשָׁרֵת
  choice: um ... zu dienen
  rationale: Das Verb bezeichnet den Dienst im Heiligtum. »Dienen« ist im Deutschen natürlich und bewahrt den kultischen Sinn im gegebenen Kontext.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: Die wörtliche Wendung »Haus Jahwes« bewahrt sowohl das hebräische Bild als auch den Gottesnamen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifische Wiedergabe von גְּבָרִים
  choice: Männer
  alternative: Personen / Verantwortliche
  rationale: Die maskuline Bezeichnung entspricht den männlichen Tempelbediensteten im historischen Zusammenhang und wird nicht neutralisiert.
- issue: Beziehung der Dienstaufgaben zu denen der Brüder
  choice: Dienstaufgaben wie ihre Brüder
  alternative: Dienstaufgaben neben ihren Brüdern
  rationale: Die Präposition kann Entsprechung oder räumlich-organisatorische Zuordnung ausdrücken; der Haupttext gibt die wahrscheinliche Entsprechung wieder, die Fußnote hält die Mehrdeutigkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Ellipse wird für die Verständlichkeit vorsichtig verbalisiert; die genuine Mehrdeutigkeit von מִשְׁמָרוֹת und לְעֻמַּת bleibt in der Fußnote sichtbar.
