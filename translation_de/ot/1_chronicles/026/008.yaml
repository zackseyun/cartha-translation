base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/008.yaml
  text: All these were from the sons of Obed-edom—they and their sons and their brothers, able men with strength for the service—sixty-two belonging to Obed-edom.
translation:
  language: de
  text: 'Alle diese waren von den Söhnen Obed-Edoms: sie, ihre Söhne und ihre Brüder[a], tüchtige Männer, die für den Dienst die nötige Kraft hatten[b] – zweiundsechzig von Obed-Edom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Verwandten“. Das hebräische Wort für „Brüder“ kann auch männliche Angehörige der weiteren Sippe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung kann auch „tapfere Männer“, „starke Männer“ oder „fähige Männer“ bedeuten; sie bezeichnet Männer von Kraft und Leistungsfähigkeit für den Dienst.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי עֹבֵד אֱדֹם
  choice: von den Söhnen Obed-Edoms
  rationale: מִן bezeichnet hier die Herkunft beziehungsweise Zugehörigkeit zur Familienlinie Obed-Edoms. Die Formulierung bewahrt den genealogischen Sinn und klingt im Deutschen natürlich.
- source_word: הֵמָּה וּבְנֵיהֶם וַאֲחֵיהֶם
  choice: sie selbst, ihre Söhne und ihre Brüder
  rationale: Die betonten Männer werden zusammen mit ihren Söhnen und männlichen Angehörigen genannt. „Brüder“ gibt אֲחֵיהֶם direkt wieder; die mögliche weitere Bedeutung „Verwandte“ wird in einer Fußnote offengehalten.
- source_word: אִישׁ חַיִל
  choice: tüchtige Männer
  rationale: חַיִל kann Tapferkeit, Stärke, Leistungsfähigkeit oder Tüchtigkeit bezeichnen. Im Zusammenhang des Tempeldienstes steht wahrscheinlich ihre Eignung im Vordergrund, ohne dass die Wendung ausschließlich militärisch verstanden werden muss.
- source_word: בַּכֹּחַ לַעֲבֹדָה
  choice: stark genug für den Dienst
  rationale: Die Wiedergabe verbindet die konkrete Bedeutung von כֹּחַ, „Kraft“, idiomatisch mit ihrer Befähigung zum Dienst. „Dienst“ lässt den im Kontext naheliegenden Tempeldienst erkennen, ohne ihn ausdrücklich in den Text einzutragen.
- source_word: שִׁשִּׁים וּשְׁנַיִם
  choice: zweiundsechzig
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: לְעֹבֵד אֱדֹם
  choice: aus dem Haus Obed-Edoms
  rationale: Das abschließende לְ fasst die Obed-Edom zugeordnete Gruppe zusammen. „Aus dem Haus“ macht den familiären Zusammenhang im Deutschen klar; die Vorstellung eines ausdrücklich genannten „Hauses“ ist dabei sinngemäß und nicht lexikalisch im Hebräischen ausgedrückt.
