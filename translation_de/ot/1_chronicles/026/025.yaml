base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/025.yaml
  text: 'And his brothers belonging to Eliezer: Rehabiah his son[a], and Jeshaiah his son, and Joram his son, and Zichri his son, and Shelomith his son.'
translation:
  language: de
  text: 'Und seine Verwandten von Elieser her[a]: dessen Sohn Rehabja, dessen Sohn Jeschaja, dessen Sohn Joram, dessen Sohn Sichri und dessen Sohn Schelomot.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „seine Brüder zu Elieser“. Die hebräische Wendung leitet wahrscheinlich den Familienzweig Eliesers ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶחָיו
  choice: Und seine Verwandten
  rationale: אָח bezeichnet wörtlich den Bruder, kann im pluralischen genealogischen Zusammenhang aber auch weitere männliche Verwandte meinen. Da hier keine Brüderliste, sondern eine Abstammungslinie folgt, gibt „Verwandten“ die Funktion im Kontext natürlich wieder; die wörtliche Möglichkeit wird in der Fußnote bewahrt.
- source_word: לֶאֱלִיעֶזֶר
  choice: aus der Linie Eliesers
  rationale: Die Präposition לְ kennzeichnet hier wahrscheinlich die Zuordnung zum Familienzweig Eliesers. Die Formulierung macht diese genealogische Beziehung im Deutschen verständlich, ohne eine bestimmte Art von Bruderschaft vorzutäuschen.
- source_word: רְחַבְיָהוּ
  choice: Rehabja
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, der hebräischen Form entsprechenden Gestalt wiedergegeben.
- source_word: בְנוֹ
  choice: dessen Sohn
  rationale: Die wiederholte Angabe markiert jeweils die nächste Generation. „Dessen Sohn“ erhält die ausdrücklich wiederholte Sohnschaft und lässt die fortlaufende Abstammungskette erkennen.
- source_word: וִישַׁעְיָהוּ
  choice: Jeschaja
  rationale: Die Namensform wird nahe am Hebräischen transliteriert und zugleich von der im Deutschen für den Propheten geläufigen Form „Jesaja“ unterschieden.
- source_word: וְיֹרָם
  choice: dessen Sohn Joram
  rationale: Die kürzere, im Vers belegte Namensform יוֹרָם wird als „Joram“ wiedergegeben, nicht als die verwandte längere Form „Joram/Jehoram“ mit zusätzlich angenommenem Gottesnamenselement.
- source_word: וְזִכְרִי
  choice: dessen Sohn Sichri
  rationale: „Sichri“ ist eine geläufige deutsche Wiedergabe des hebräischen Personennamens זִכְרִי.
- source_word: וּשְׁלֹמוֹת
  choice: dessen Sohn Schelomit
  rationale: Der Personenname wird nach der in Chronikübersetzungen geläufigen deutschen Namensform „Schelomit“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdige genealogische Prosa. Der Doppelpunkt leitet die Abstammungsreihe ein; die Wiederholung von „dessen Sohn“ bewahrt die Struktur des Hebräischen und verdeutlicht, dass jede genannte Person Sohn der unmittelbar zuvor genannten ist.
