base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/018.yaml
  text: 'For the Parbar on the west: four at the road[b][a], and two at the Parbar.'
translation:
  language: de
  text: 'Für den Parbar an der Westseite: vier an der Straße[b] und zwei am Parbar.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Parbar“ gibt ein seltenes hebräisches Wort wieder. Gemeint sein könnte ein Bezirk, Hof, Nebengebäude oder – nach traditioneller Wiedergabe – eine Vorstadt; der genaue bauliche Bezug ist ungewiss.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „am Dammweg“ beziehungsweise „am aufgeschütteten Weg“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּרְבָּר
  choice: Parbar
  rationale: Das seltene hebräische Wort bezeichnet offenbar einen bestimmten Bereich oder Bau an der Tempelanlage, doch seine genaue Bedeutung ist unsicher. Die Transliteration bewahrt diese Unsicherheit, statt eine Deutung wie „Säulenhalle“ oder „Nebengebäude“ festzuschreiben.
- source_word: מַעֲרָב
  choice: Westseite
  rationale: Das Substantiv bezeichnet hier die westliche Richtung beziehungsweise Seite; „an der Westseite“ ist im Deutschen natürlich und räumlich eindeutig.
- source_word: אַרְבָּעָה
  choice: vier
  rationale: Die Kardinalzahl gibt die Zahl der dort eingeteilten Torwächter an; das Bezugswort bleibt wie im knappen hebräischen Listenstil unausgesprochen.
- source_word: מְסִלָּה
  choice: Straße
  rationale: Das Wort kann eine Straße, einen aufgeschütteten Weg oder einen Dammweg bezeichnen. „Straße“ ist eine neutrale, gut verständliche Wiedergabe; Alternativen werden in der Fußnote genannt.
- source_word: שְׁנַיִם
  choice: zwei
  rationale: Die Kardinalzahl bezeichnet die zweite Gruppe; auch hier wird das im Kontext erschließbare Bezugswort nicht ergänzt.
- source_word: לְ
  choice: für / an / am
  rationale: Die wiederholte Präposition markiert Zuordnung und Standort. Je nach syntaktischer Verbindung wird sie im Deutschen idiomatisch mit „für“, „an“ oder „am“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Knapp gehaltener, würdiger Verwaltungsstil entsprechend der Aufzählung im Hebräischen. Die elliptischen Zahlenangaben werden nicht durch „Torwächter“ ergänzt. Der seltene Ortsbegriff bleibt als „Parbar“ stehen, damit die sachliche Unsicherheit sichtbar bleibt.
