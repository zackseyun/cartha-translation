  text: וַ/יַּפִּ֨ילוּ גוֹרָל֜וֹת כַּ/קָּטֹ֧ן כַּ/גָּד֛וֹל לְ/בֵ֥ית אֲבוֹתָ֖/ם לְ/שַׁ֥עַר וָ/שָֽׁעַר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/013.yaml
  text: And they cast lots[a], small and great alike, according to their fathers’ houses, for each gate.
translation:
  language: de
  text: Und sie warfen Lose, Kleine wie Große, nach ihren Vaterhäusern, für jedes einzelne Tor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für Tor und Tor“. Die Wiederholung des Singulars hebt die Verteilung auf die einzelnen Tore hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ גוֹרָלוֹת
  choice: sie warfen Lose
  rationale: Die Verbindung aus dem Hifil von נפל und גוֹרָלוֹת ist die übliche Wendung für das Loswerfen; die natürliche deutsche Entsprechung lautet „Lose werfen“.
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: die Geringen wie die Großen
  rationale: Die Formulierung bewahrt den Gegensatz von gering und groß und bezeichnet eine Beteiligung ohne Rangunterschied; eine Festlegung auf Jung und Alt wäre stärker deutend.
- source_word: לְבֵית אֲבוֹתָם
  choice: nach ihren Vaterhäusern
  rationale: „Vaterhäuser“ bezeichnet die patrilinear geordneten Familien- beziehungsweise Sippenverbände; „nach“ gibt hier die Zuordnung gemäß diesen Verbänden wieder.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: für jedes einzelne Tor
  rationale: Die Wiederholung des Singulars hat distributive Bedeutung. „Jedes einzelne Tor“ gibt diese Betonung in natürlichem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur und der Losentscheid bleiben erhalten; „die Geringen wie die Großen“ bewahrt die soziale beziehungsweise rangbezogene Offenheit des Hebräischen, ohne sie auf das Alter einzuengen.
