base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/002.yaml
  text: 'And Shelemiah had sons: Zechariah the firstborn[a], Jediael the second, Zebadiah the third[b], and Jathniel the fourth.'
translation:
  language: de
  text: 'Und Schelemja hatte folgende Söhne: Sacharja, den Erstgeborenen, Jediaël, den Zweiten, Sebadja, den Dritten, und Jatniël, den Vierten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִמְשֶׁלֶמְיָהוּ בָּנִים
  choice: Und Schelemja hatte folgende Söhne
  rationale: Die wörtlich verblos formulierte genealogische Wendung »und dem Schelemja Söhne« wird im Deutschen idiomatisch als Besitzkonstruktion wiedergegeben. »Söhne« bewahrt die männliche Spezifizierung des Hebräischen; »folgende« leitet die anschließende Namensliste natürlich ein.
- source_word: זְכַרְיָהוּ הַבְּכוֹר
  choice: Secharja, den Erstgeborenen
  rationale: »Erstgeborener« gibt בְּכוֹר genauer wieder als lediglich »Ältester«. Der Akkusativ entspricht der deutschen Konstruktion mit »hatte«.
- source_word: יְדִיעֲאֵל הַשֵּׁנִי
  choice: Jediaël, den zweiten
  rationale: Der Name wird in geläufiger deutscher Bibeltransliteration wiedergegeben; die Ordnungszahl folgt dem Hebräischen unmittelbar.
- source_word: זְבַדְיָהוּ הַשְּׁלִישִׁי
  choice: Sebadja, den dritten
  rationale: Geläufige deutsche Bibeltransliteration des Namens und direkte Wiedergabe der Ordnungszahl.
- source_word: יַתְנִיאֵל הָרְבִיעִי
  choice: Jatniël, den vierten
  rationale: »Jatniël« folgt der im Deutschen üblichen Wiedergabe des anlautenden hebräischen Jod mit J; die Diärese macht die getrennte Aussprache der Vokale kenntlich. Die Ordnungszahl wird direkt übertragen.
