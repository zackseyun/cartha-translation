  text: וּ/לְ/חֹסָ֥ה מִן בְּנֵי מְרָרִ֖י בָּנִ֑ים שִׁמְרִ֤י הָ/רֹאשׁ֙ כִּ֣י לֹא הָיָ֣ה בְכ֔וֹר וַ/יְשִׂימֵ֥/הוּ אָבִ֖י/הוּ לְ/רֹֽאשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/010.yaml
  text: 'And Hosah[a], from the sons of Merari, had sons: Shimri the chief, though he was not the firstborn; his father made him chief.'
translation:
  language: de
  text: 'Und Hosa, von den Söhnen Meraris, hatte Söhne: Schimri war das Oberhaupt, obwohl er nicht der Erstgeborene war[a]; sein Vater setzte ihn zum Oberhaupt ein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn er war nicht der Erstgeborene“; die hebräische Konjunktion kann hier sowohl erläuternd beziehungsweise begründend als auch sinngemäß einräumend verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְחֹסָה
  choice: Und Hosa hatte
  rationale: Die Verbindungspartikel führt die Liste fort; die Präposition לְ bei einem Personennamen bezeichnet in diesem genealogischen Zusammenhang die Zugehörigkeit beziehungsweise den Besitz. Die Ergänzung „hatte“ ergibt zusammen mit בָּנִים einen natürlichen deutschen Satz.
- source_word: מִן בְּנֵי מְרָרִי
  choice: von den Söhnen Meraris
  rationale: Die Formulierung bewahrt die hebräische Abstammungsangabe und macht Hosas Zugehörigkeit zur Sippe Meraris deutlich.
- source_word: בָּנִים
  choice: Söhne
  rationale: Der maskuline Plural bezeichnet hier im genealogischen Zusammenhang Söhne; das im Hebräischen fehlende Verb wird im Deutschen durch „hatte“ ergänzt.
- source_word: שִׁמְרִי
  choice: Schimri
  rationale: Der Personenname wird in einer im Deutschen geläufigen biblischen Umschrift wiedergegeben.
- source_word: הָרֹאשׁ
  choice: das Oberhaupt
  rationale: רֹאשׁ bezeichnet hier nicht den Körperteil, sondern den Vorrang beziehungsweise die leitende Stellung innerhalb der Familie. „Oberhaupt“ ist im genealogischen Zusammenhang klar und würdevoll.
- source_word: כִּי לֹא הָיָה בְכוֹר
  choice: obwohl er nicht der Erstgeborene war
  rationale: Im Zusammenhang besteht ein deutlicher Gegensatz zwischen Schimris Stellung als Oberhaupt und seinem fehlenden Erstgeburtsrang. Da כִּי jedoch auch begründend oder erläuternd verstanden werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
- source_word: וַיְשִׂימֵהוּ אָבִיהוּ לְרֹאשׁ
  choice: sein Vater hatte ihn zum Oberhaupt eingesetzt
  rationale: שׂים mit לְ bezeichnet hier die Einsetzung in eine Stellung. Das Plusquamperfekt verdeutlicht im Deutschen natürlich, dass die Einsetzung seine zuvor genannte Stellung erklärt; „Oberhaupt“ bewahrt zugleich die Wiederholung von רֹאשׁ.
