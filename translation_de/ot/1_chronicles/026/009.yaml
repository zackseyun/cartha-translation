  text: וְ/לִ/מְשֶֽׁלֶמְיָ֗הוּ בָּנִ֧ים וְ/אַחִ֛ים בְּנֵי חָ֖יִל שְׁמוֹנָ֥ה עָשָֽׂר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/009.yaml
  text: And Shelemiah had sons and brothers[a], valiant men[b], eighteen.
translation:
  language: de
  text: Und Meschelemja[a] hatte Söhne und Brüder, tüchtige Männer[b], insgesamt achtzehn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und für Meschelemja“; diese hebräische Konstruktion führt die Person ein, deren Gruppe gezählt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „tapfere Männer“; wörtlich: „Söhne der Kraft/Tüchtigkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְשֶֽׁלֶמְיָ֗הוּ
  choice: Und Meschelemja hatte
  rationale: Die Präposition לְ bedeutet wörtlich „für/zu Meschelemja“ und führt hier die Person ein, deren Gruppe gezählt wird. Im Deutschen gibt „Meschelemja hatte“ diese Aufzählung natürlich und verständlich wieder; die wörtliche Konstruktion bleibt in Fußnote [a] sichtbar.
- source_word: בָּנִים
  choice: Söhne
  rationale: Das hebräische Wort bezeichnet hier männliche Nachkommen und wird daher nicht mit dem allgemeineren „Kinder“ wiedergegeben.
- source_word: וְ/אַחִים
  choice: und Brüder
  rationale: אַחִים bedeutet gewöhnlich „Brüder“. Ein weiterer Sinn wie „Verwandte“ ist möglich, wird vom unmittelbaren Zusammenhang aber nicht verlangt.
- source_word: בְּנֵי חָיִל
  choice: tüchtige Männer
  rationale: Die Wendung bedeutet wörtlich „Söhne der Kraft/Tüchtigkeit“ und bezeichnet leistungsfähige, angesehene oder tapfere Männer. „Tüchtige Männer“ passt zum Dienstzusammenhang, ohne die Bedeutung unnötig auf militärische Tapferkeit zu verengen.
- source_word: שְׁמוֹנָה עָשָׂר
  choice: insgesamt achtzehn
  rationale: „Achtzehn“ gibt die Kardinalzahl direkt wieder; „insgesamt“ macht im natürlichen Deutschen deutlich, dass dies die Gesamtzahl der genannten Söhne und Brüder ist.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die appositionelle Reihenfolge des Hebräischen („tüchtige Männer, achtzehn“) bleibt annähernd erhalten; „insgesamt“ verdeutlicht idiomatisch die Zählung.
