  text: וּ/לְ/עֹבֵ֥ד אֱדֹ֖ם בָּנִ֑ים שְׁמַֽעְיָ֤ה הַ/בְּכוֹר֙ יְהוֹזָבָ֣ד הַ/שֵּׁנִ֔י יוֹאָ֤ח הַ/שְּׁלִשִׁי֙ וְ/שָׂכָ֣ר הָ/רְבִיעִ֔י וּ/נְתַנְאֵ֖ל הַ/חֲמִישִֽׁי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/004.yaml
  text: 'And Obed-edom had sons: Shemaiah the firstborn[a], Jehozabad the second, Joah the third, and Sakar the fourth[b], and Nethanel the fifth.'
translation:
  language: de
  text: 'Und Obed-Edom hatte Söhne: Schemaja, den Erstgeborenen, Josabad, den zweiten, Joach, den dritten, Sachar, den vierten, und Netanel, den fünften.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/עֹבֵד אֱדֹם בָּנִים
  choice: Und Obed-Edom hatte Söhne
  rationale: Die hebräische genealogische Kurzform lautet wörtlich etwa »Und dem Obed-Edom Söhne«. Das ergänzte Verb »hatte« gibt sie im Deutschen natürlich und präzise wieder.
- source_word: שְׁמַעְיָה
  choice: Schemaja
  rationale: Hebräischer Personenname in gebräuchlicher deutscher Bibeltransliteration.
- source_word: הַבְּכוֹר
  choice: den Erstgeborenen
  rationale: בכור bezeichnet den Erstgeborenen und nicht lediglich den Ersten einer Aufzählung; der Akkusativ entspricht der deutschen Ergänzung zu »hatte«.
- source_word: יְהוֹזָבָד
  choice: Josabad
  rationale: Der Personenname wird in einer im Deutschen geläufigen, hebräisch begründeten Form wiedergegeben.
- source_word: הַשֵּׁנִי … הַשְּׁלִשִׁי … הָרְבִיעִי … הַחֲמִישִׁי
  choice: den zweiten … den dritten … den vierten … den fünften
  rationale: Die Ordnungszahlen kennzeichnen unmittelbar die Reihenfolge der Söhne und werden formal entsprechend wiedergegeben.
- source_word: יוֹאָח
  choice: Joach
  rationale: Direkte deutsche Transliteration des hebräischen Namens.
- source_word: וְ/שָׂכָר
  choice: Sachar
  rationale: Die Namensform ist hier שׂכר (Sachar) und nicht ישׂשׂכר (Issachar); die Übersetzung wahrt diesen Unterschied.
- source_word: וּ/נְתַנְאֵל
  choice: Netanel
  rationale: Die Form folgt unmittelbar dem hebräischen Namen und vermeidet die stärker griechisch geprägte Variante »Nathanael«.
