translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe genealogische Listenform bleibt erhalten; nur das im Hebräischen elliptische Verb wird für natürliches Deutsch ergänzt. Auf Fußnoten wurde verzichtet, da die relevanten Namens- und Syntaxentscheidungen im deutschen Haupttext ohne erklärungsbedürftige Mehrdeutigkeit darstellbar sind.
