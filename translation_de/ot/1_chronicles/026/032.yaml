base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/032.yaml
  text: And his brothers[a], valiant men, were two thousand seven hundred heads of fathers’ houses; and King David appointed them over the Reubenites, the Gadites, and the half-tribe of Manasseh for every matter of God and of the king.
translation:
  language: de
  text: 'Seine Brüder[a], tüchtige Männer, waren 2.700 Oberhäupter von Großfamilien; König David übertrug ihnen die Aufsicht über die Rubeniter, die Gaditer und den halben Stamm Manasse für alle Angelegenheiten Gottes und des Königs.


    [a] Oder: seine Verwandten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine Verwandten.'
    reason: אחים kann neben leiblichen Brüdern im Sippenzusammenhang auch männliche Verwandte beziehungsweise Angehörige derselben Verwandtschaftsgruppe bezeichnen.
lexical_decisions:
- source_word: וְאֶחָיו
  choice: Seine Brüder
  rationale: אחים bezeichnet zunächst Brüder, kann im Sippenzusammenhang aber auch weitere männliche Verwandte meinen; die direkte Bedeutung steht im Text, die weitere Möglichkeit in der Fußnote.
- source_word: בְּנֵי חַיִל
  choice: tüchtige Männer
  rationale: Die Wendung bezeichnet hier Männer von Kraft, Befähigung und Ansehen. Im administrativen Zusammenhang trifft „tüchtige Männer“ den Sinn natürlicher als das vorwiegend militärisch klingende „tapfere Männer“.
- source_word: אַלְפַּיִם וּשְׁבַע מֵאוֹת
  choice: '2.700'
  rationale: Direkte Wiedergabe der Kardinalzahl in üblicher deutscher Schreibweise.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: Oberhäupter von Großfamilien
  rationale: Die technische Wendung bezeichnet Leiter väterlich organisierter Familien- beziehungsweise Sippenverbände. „Großfamilien“ ist im heutigen Deutsch verständlich und bewahrt die soziale Ebene besser als das allgemeinere „Familien“.
- source_word: וַיַּפְקִידֵם ... עַל
  choice: übertrug ihnen die Aufsicht über
  rationale: Das Hifil von פקד bezeichnet die offizielle Einsetzung in einen Verantwortungsbereich; zusammen mit עַל wird die übertragene Aufsicht idiomatisch und präzise ausgedrückt.
- source_word: הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: die Rubeniter, die Gaditer und den halben Stamm Manasse
  rationale: Die singularischen Gentilizia bezeichnen kollektiv die Angehörigen der beiden Stämme; im Deutschen stehen dafür natürlich die Pluralformen.
- source_word: לְכָל דְּבַר הָאֱלֹהִים וּדְבַר הַמֶּלֶךְ
  choice: für alle Angelegenheiten Gottes und des Königs
  rationale: דבר bedeutet hier Angelegenheit oder Amtsgeschäft. Die knappe parallele Formulierung bewahrt die beiden Zuständigkeitsbereiche, ohne sie näher zu definieren.
theological_decisions:
- issue: Umfang der Verantwortung für göttliche und königliche Angelegenheiten
  choice: Die Männer tragen Verantwortung für Angelegenheiten Gottes und des Königs.
  alternative: Die Wendung kann erläuternd als „für den gesamten Dienst Gottes und den Dienst des Königs“ verstanden werden.
  rationale: Der hebräische Text unterscheidet zwei Zuständigkeitsbereiche, legt aber weder ihr genaues Verhältnis noch eine spätere religiös-staatliche Ordnung fest. Die Übersetzung erhält diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tüchtige Männer“ vermeidet eine unnötige militärische Verengung; „Oberhäupter von Großfamilien“ macht die genealogisch-administrative Funktion verständlich. Die Punktsetzung teilt den langen hebräischen Satz zur besseren Lesbarkeit, ohne seinen Gedankengang zu verändern.
