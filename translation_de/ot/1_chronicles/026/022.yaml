  source_fidelity: 'Der Entwurf gibt die hebräische Satzstruktur und die Verwaltungsfunktion zuverlässig wieder: „Die Söhne Jehiëlis“ entspricht בְּנֵי יְחִיאֵלִי; Setam und Joël werden als Brüder genannt; „waren für ... verantwortlich“ gibt עַל in diesem Kontext angemessen wieder. „Schatzkammern des Hauses Jahwes“ entspricht אֹצְרוֹת בֵּית יְהוָה ohne unnötig auf „Tempel“ zu deuten.'
