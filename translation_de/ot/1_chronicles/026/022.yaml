  terminology: „Jahwe“ ist eine sachgerechte Wiedergabe von יהוה und wird durch die Fußnote transparent mit der traditionellen Wiedergabe „der HERR“ in Beziehung gesetzt. „Haus Jahwes“ bewahrt den Wortlaut; „Schatzkammern“ ist für אֹצְרוֹת im Tempelverwaltungszusammenhang passend. Die Namensformen Jehiëli, Setam und Joël sind im Deutschen gut lesbar und konsistent transliteriert.
