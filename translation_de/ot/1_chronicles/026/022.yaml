id: 1CH.26.22
reference: 1 Chronicles 26:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּנֵ֖י יְחִֽיאֵלִ֑י זֵתָם֙ וְ/יוֹאֵ֣ל אָחִ֔י/ו עַל אֹצְר֖וֹת בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/022.yaml
  text: 'The sons of Jehieli: Zetham and Joel his brother were over the treasuries of the house of Yahweh[a].'
translation:
  language: de
  text: 'Die Söhne Jehiëlis: Setam und sein Bruder Joël waren für die Schatzkammern des Hauses Jahwes[a] verantwortlich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Haus Jahwes“; traditionell wiedergegeben als „Haus des HERRN“.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יְחִיאֵלִי
  choice: Die Söhne Jehiëlis
  rationale: בְּנֵי ist der Konstruktplural von בן und bezeichnet hier am natürlichsten die Söhne. יְחִיאֵלִי wird im administrativ-genealogischen Zusammenhang als Personenname verstanden; der deutsche Genitiv macht die Beziehung idiomatisch deutlich.
- source_word: זֵתָם
  choice: Setam
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert.
- source_word: וְיוֹאֵל אָחִיו
  choice: und sein Bruder Joël
  rationale: 'Das Suffix in אָחִיו ist singularisch und bezieht sich am natürlichsten auf Setam: Joël ist sein Bruder. Die deutsche Wortstellung ist klarer als eine streng formale Nachbildung.'
- source_word: עַל אֹצְרוֹת
  choice: waren für die Schatzkammern … verantwortlich
  rationale: עַל bezeichnet in diesem Verwaltungskontext Zuständigkeit oder Aufsicht. אֹצְרוֹת meint die institutionellen Schatz- bzw. Vorratskammern; „Schatzkammern“ passt hier am besten.
- source_word: בֵּית יְהוָה
  choice: des Hauses Jahwes
  rationale: בֵּית wird als „Haus“ bewahrt, statt deutend „Tempel“ zu setzen. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen im Deutschen erkennbar wieder; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Listen- und Verwaltungssprache des hebräischen Verses bleibt erkennbar; „verantwortlich“ formuliert die Aufsichtsfunktion natürlich. Die Schreibweisen Jehiëli und Joël verwenden Trema zur klaren Silbentrennung.
