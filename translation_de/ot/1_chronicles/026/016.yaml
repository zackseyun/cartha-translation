  text: לְ/שֻׁפִּ֤ים וּ/לְ/חֹסָה֙ לַֽ/מַּעֲרָ֔ב עִ֚ם שַׁ֣עַר שַׁלֶּ֔כֶת בַּֽ/מְסִלָּ֖ה הָ/עוֹלָ֑ה מִשְׁמָ֖ר לְ/עֻמַּ֥ת מִשְׁמָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/016.yaml
  text: For Shuppim and Hosah[a], the lot fell to the west, with the Gate of Shallecheth on the ascending highway, guard corresponding to guard.
translation:
  language: de
  text: Für Schuppim und Hosa fiel das Los auf die Westseite, beim Schallechet-Tor[a] an der ansteigenden Straße, Wache gegenüber Wache.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Tor des Hinauswerfens“. „Schallechet“ ist wahrscheinlich ein Torname, der von einem Verb mit der Bedeutung „hinauswerfen“ oder „hinabwerfen“ abgeleitet ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֻׁפִּים וּלְחֹסָה
  choice: Für Schuppim und Hosa
  rationale: Das Präfix ל bezeichnet im Zusammenhang der Losverteilung die Zuweisung; die zusammengezogene deutsche Form gibt beide Dative natürlich wieder.
- source_word: לַמַּעֲרָב
  choice: auf die Westseite
  rationale: Bezeichnet den westlichen Bereich, der durch das Los zugewiesen wurde; im Deutschen ist die Seitenangabe hier klarer als eine bloße Richtungsangabe.
- source_word: עִם
  choice: beim
  rationale: Kennzeichnet das Tor als zugehörigen örtlichen Bezugspunkt; „beim“ ist in diesem topografischen Zusammenhang natürlich und bleibt nahe an der relationalen Bedeutung.
- source_word: שַׁעַר שַׁלֶּכֶת
  choice: Schallechet-Tor
  rationale: שַׁלֶּכֶת wird wahrscheinlich als Eigenname des Tores gebraucht und daher im Haupttext transkribiert; die mögliche Wortbedeutung wird in der Fußnote bewahrt.
- source_word: בַּמְסִלָּה הָעוֹלָה
  choice: an der ansteigenden Straße
  rationale: מְסִלָּה bezeichnet eine gebahnte beziehungsweise erhöhte Straße, und das Partizip הָעוֹלָה beschreibt ihren aufwärtsführenden Verlauf.
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: Wache gegenüber Wache
  rationale: Die knappe Form wahrt die Mehrdeutigkeit zwischen einander gegenüberliegenden Wachen, Wachposten oder Wachabteilungen, ohne die räumliche oder organisatorische Beziehung weiter festzulegen.
