source:
  edition: WLC
  text: לְ/מַחְלְק֖וֹת לְ/שֹׁעֲרִ֑ים לַ/קָּרְחִ֕ים מְשֶֽׁלֶמְיָ֥הוּ בֶן קֹרֵ֖א מִן בְּנֵ֥י אָסָֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/001.yaml
  text: 'For the divisions of the gatekeepers: of the Korahites[a], Meshelemiah son of Kore, from the sons of Asaph.'
translation:
  language: de
  text: 'Für die Abteilungen der Torwächter[a]: von den Korachitern Meschelemja, der Sohn Kores, von den Söhnen Asafs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Nach den Abteilungen der Torwächter“. Die einleitende Wendung dient als Überschrift für die folgende Aufstellung der Torwächterabteilungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלְקוֹת
  choice: Für die Abteilungen
  rationale: Das vorangestellte לְ eröffnet hier wahrscheinlich überschriftartig das Thema. מַחְלְקוֹת bezeichnet eingeteilte Gruppen oder Dienstabteilungen; „Abteilungen“ bewahrt den organisatorischen Sinn.
- source_word: לְשֹׁעֲרִים
  choice: der Torwächter
  rationale: שֹׁעֲרִים sind die an den Toren eingesetzten Wächter. Im Deutschen gibt „Torwächter“ die Aufgabe klar und natürlich wieder; die Zuordnung zur Überschrift wird mit dem Genitiv ausgedrückt.
- source_word: לַקָּרְחִים
  choice: von den Korachitern
  rationale: Die Form bezeichnet die Angehörigen beziehungsweise Nachkommen Korachs als Untergruppe. „Von den Korachitern“ passt zur knappen Listenform und vermeidet die Ergänzung eines im Hebräischen nicht vorhandenen Verbs.
- source_word: מְשֶׁלֶמְיָהוּ
  choice: Meschelemja
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenkonvention wiedergegeben und entspricht der längeren Namensform dieses Verses.
- source_word: בֶן קֹרֵא
  choice: der Sohn Kores
  rationale: בֶן bezeichnet hier am natürlichsten die unmittelbare Sohnesbeziehung. Der Name קֹרֵא wird als „Kore“ transliteriert; im deutschen Genitiv lautet er „Kores“.
- source_word: מִן בְּנֵי אָסָף
  choice: von den Söhnen Asafs
  rationale: מִן bezeichnet Herkunft oder Zugehörigkeit aus einer größeren Familiengruppe. Die wörtungsnahe Formulierung erhält die genealogische Ausdrucksweise und legt nicht fest, ob „Söhne“ an dieser Stelle unmittelbare Söhne oder Nachkommen meint.
