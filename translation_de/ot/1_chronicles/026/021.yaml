  text: בְּנֵ֣י לַ֠עְדָּן בְּנֵ֨י הַ/גֵּרְשֻׁנִּ֜י לְ/לַעְדָּ֗ן רָאשֵׁ֧י הָ/אָב֛וֹת לְ/לַעְדָּ֥ן הַ/גֵּרְשֻׁנִּ֖י יְחִיאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/021.yaml
  text: 'The sons of Ladan[b][a], the sons of the Gershonite belonging to Ladan: the heads of the fathers’ houses belonging to Ladan the Gershonite were Jehieli.'
translation:
  language: de
  text: 'Die Söhne Ladans[a], die Söhne des Gerschoniters, die zu Ladan gehörten: die Oberhäupter der Vaterhäuser[b] Ladans, des Gerschoniters: Jehieli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Nachkommen Ladans«. In Geschlechtsregistern kann »Söhne« auch eine weiter gefasste Nachkommenschaft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Vaterhäuser« waren größere, durch gemeinsame Abstammung verbundene Familienverbände oder Sippen.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: Söhne
  rationale: Die konstruktische Pluralform bedeutet zunächst »Söhne«, kann in genealogischem Zusammenhang aber auch Nachkommen bezeichnen; die formale Chronik-Sprache bleibt erhalten.
- source_word: לַעְדָּן
  choice: Ladan
  rationale: Der Personenname wird in einer knappen, dem Hebräischen entsprechenden deutschen Form wiedergegeben.
- source_word: הַגֵּרְשֻׁנִּי
  choice: der Gerschoniter
  rationale: Das Gentiliz bezeichnet die Zugehörigkeit zur Sippe beziehungsweise Abstammungslinie Gerschons.
- source_word: לְלַעְדָּן
  choice: die zu Ladan gehörten / Ladans
  rationale: Die Präposition bezeichnet hier genealogische Zuordnung. Im ersten Satzteil wird sie zur Verständlichkeit explizit, im zweiten idiomatisch als Genitiv wiedergegeben.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: Oberhäupter der Vaterhäuser
  rationale: Die Wendung bezeichnet Leiter größerer, durch gemeinsame Abstammung verbundener Familienverbände; »Oberhäupter« ist im Deutschen natürlicher als das wörtliche »Häupter«.
- source_word: יְחִיאֵלִי
  choice: die Jehiëliter
  rationale: Die Form יְחִיאֵלִי ist morphologisch am ehesten ein Gentiliz beziehungsweise Sippenname, nicht einfach der Personenname »Jehiëli«. Der Plural passt zudem zum pluralischen Prädikatsnomen »Oberhäupter«.
