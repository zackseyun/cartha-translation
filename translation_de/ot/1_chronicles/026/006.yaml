  register: Modernes, würdiges Standarddeutsch. „Vaterhaus“ bewahrt den genealogischen und sozialen Sinn des hebräischen Ausdrucks; „geboten“ kennzeichnet Autorität knapp und verständlich. Die beiden Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
