  text: וְ/לִֽ/שְׁמַֽעְיָ֤ה בְנ/וֹ֙ נוֹלַ֣ד בָּנִ֔ים הַ/מִּמְשָׁלִ֖ים לְ/בֵ֣ית אֲבִי/הֶ֑ם כִּֽי גִבּ֥וֹרֵי חַ֖יִל הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/006.yaml
  text: And to Shemaiah his son[a], sons were born who ruled over their fathers’ house[b], for they were mighty men of valor.
translation:
  language: de
  text: Und Schemaja, seinem Sohn, wurden Söhne geboren, die ihrem Vaterhaus vorstanden[a]; denn sie waren starke und tüchtige Männer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die die Leiter ihres Vaterhauses waren“.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck kann starke, tapfere oder besonders befähigte und bewährte Männer bezeichnen; er ist nicht ausschließlich militärisch gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁמַעְיָה בְנוֹ
  choice: Auch Schemaja, seinem Sohn
  rationale: Die Verbindung aus וְ und לְ führt ein weiteres Glied der genealogischen Aufzählung ein; der deutsche Dativ bewahrt die hebräische Geburtsformel. בְנוֹ bezeichnet Schemaja als den Sohn des zuvor genannten Obed-Edom.
- source_word: נוֹלַד בָּנִים
  choice: wurden Söhne geboren
  rationale: Obwohl נוֹלַד formal im Singular steht, fungiert בָּנִים in der Geburtsnotiz als pluralischer Sinnträger; im Deutschen ist deshalb der Plural erforderlich.
- source_word: הַמִּמְשָׁלִים
  choice: die … geboten
  rationale: Das Partizip von משל bezeichnet das Ausüben von Leitung oder Herrschaft. „Geboten“ gibt tatsächliche Autorität wieder, ohne bloß einen Amtstitel einzutragen.
- source_word: לְבֵית אֲבִיהֶם
  choice: über ihr Vaterhaus
  rationale: בֵּית אָב bezeichnet den väterlichen Familien- oder Sippenverband. Der Singular „Vaterhaus“ folgt der Form des hebräischen Ausdrucks; לְ wird im Zusammenhang mit משל idiomatisch als Herrschaftsbereich verstanden.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für ihre leitende Stellung ein.
- source_word: גִּבּוֹרֵי חַיִל
  choice: starke, tüchtige Männer
  rationale: Die feste Wortverbindung umfasst Stärke, Befähigung, Bewährung und gegebenenfalls Tapferkeit. Im Zusammenhang mit Torhütern und Familienleitung vermeidet diese Wiedergabe eine unnötige Beschränkung auf militärische Krieger.
- source_word: הֵמָּה
  choice: sie waren
  rationale: Das selbstständige Pronomen hebt das Subjekt hervor; im natürlichen deutschen Satz wird dies durch die ausdrückliche Formulierung „sie waren“ angemessen wiedergegeben.
