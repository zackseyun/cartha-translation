    rationale: „Söhne des Korachiters“ klingt im Deutschen nach Nachkommen einer einzelnen Person namens „der Korachiter“. Das Hebräische hat hier eine clanbezogene Gentilizform; die Fußnote bewahrt diese Funktion nicht verlässlich.
