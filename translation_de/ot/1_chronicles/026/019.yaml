  source_fidelity: 'Die Hauptfassung trifft den Sinn der Zugehörigkeit der Torwächter zu den korachitischen und meraritischen Gruppen grundsätzlich. „Dienstabteilungen“ ist jedoch gegenüber מַחְלְקוֹת leicht interpretierend, da der Dienst nicht ausdrücklich im Vers steht. Die Fußnote ist als wörtliche Wiedergabe problematisch: „Söhne des Korachiters“ ist im Deutschen irreführend und bildet die kollektive Clanbezeichnung הַקָּרְחִי nicht angemessen ab.'
  naturalness: Die Hauptfassung ist gut verständlich und modern. „Abteilungen“ ist hier ebenso natürlich wie „Dienstabteilungen“ und näher am hebräischen Wortlaut. Eine Fußnote ist nicht nötig, da die präsentische Alternative des verblosen Satzes keine sachliche Mehrdeutigkeit erzeugt, die erläutert werden müsste.
  terminology: „Torwächter“, „Korachiter“ und „Nachkommen Meraris“ sind passende, verständliche Bezeichnungen. Die parallele Zuordnung wird mit zweimaligem „für“ klar bewahrt.
