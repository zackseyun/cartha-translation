  text: אֵ֗לֶּה מַחְלְקוֹת֙ הַ/שֹּׁ֣עֲרִ֔ים לִ/בְנֵ֥י הַ/קָּרְחִ֖י וְ/לִ/בְנֵ֥י מְרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/019.yaml
  text: These were the divisions of the gatekeepers for the sons of the Korahites and for the sons of Merari[a].
translation:
  language: de
  text: Das waren die Abteilungen der Torwächter für die Korachiter und für die Nachkommen Meraris.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Das waren
  rationale: Der pluralische Demonstrativausdruck leitet eine zusammenfassende Feststellung ein. Das Deutsche verlangt hier ein Kopulaverb; das Präteritum fügt sich natürlich in den rückblickenden Listen- und Erzählrahmen ein.
- source_word: מַחְלְקוֹת
  choice: Dienstabteilungen
  rationale: Das Substantiv bezeichnet eingeteilte Gruppen im organisierten Tempeldienst. „Dienstabteilungen“ macht den institutionellen Zusammenhang deutlich, ohne die konkrete Organisation weiter festzulegen.
- source_word: הַשֹּׁעֲרִים
  choice: der Torwächter
  rationale: Gemeint sind die Männer, die für die Bewachung beziehungsweise Beaufsichtigung der Tore zuständig waren. „Torwächter“ ist die geläufige moderne Bezeichnung.
- source_word: לִבְנֵי הַקָּרְחִי
  choice: aus den Reihen der Korachiter
  rationale: Die Verbindung bezeichnet die Zugehörigkeit zu einer Sippe. Da das Hebräische wörtlich ungewöhnlich „Söhne des Korachiters“ sagt, gibt die idiomatische deutsche Formulierung den kollektiven Sinn verständlich wieder.
- source_word: וְלִבְנֵי מְרָרִי
  choice: und der Nachkommen Meraris
  rationale: „Nachkommen“ gibt בְּנֵי im genealogischen Zusammenhang natürlich wieder und bewahrt durch die Wiederaufnahme der Zuordnung die Parallelität der beiden Gruppen.
