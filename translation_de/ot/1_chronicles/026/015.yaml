  yaml_path: translation/ot/1_chronicles/026/015.yaml
  text: To Obed-edom[a], the south; and to his sons, the house of stores.
translation:
  language: de
  text: Obed-Edom fiel das Südtor zu, und seinen Söhnen das Vorratshaus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Haus der Speicher“ oder „das Haus der Sammlungen“. Der hebräische Ausdruck kann einen Aufbewahrungsort oder Sammelräume bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹבֵד אֱדֹם
  choice: Obed-Edom fiel … zu
  rationale: Das Präfix לְ kennzeichnet im Zusammenhang der Losverteilung die Zuweisung; die deutsche Wendung gibt diese knapp und natürlich wieder.
- source_word: נֶגְבָּה
  choice: das Südtor
  rationale: Die Richtungsform bezeichnet die südliche Zuweisung. Aus dem Kontext der Torposten wird das elliptisch vorausgesetzte Tor ergänzt, um im Deutschen einen verständlichen Satz zu bilden.
- source_word: וּלְבָנָיו
  choice: und seinen Söhnen
  rationale: Die parallele Zuweisung an Obed-Edoms Söhne bleibt erhalten; בָּנִים wird konkret mit „Söhne“ wiedergegeben.
- source_word: בֵּית הָאֲסֻפִּים
  choice: das Vorratshaus
  rationale: בֵּית bezeichnet das Gebäude, während אֲסֻפִּים auf Gesammeltes beziehungsweise Vorräte verweist. „Vorratshaus“ ist im Tempelkontext eine natürliche und prägnante Wiedergabe.
