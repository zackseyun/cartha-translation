source:
  edition: WLC
  text: עַמִּיאֵ֤ל הַ/שִּׁשִּׁי֙ יִשָׂשכָ֣ר הַ/שְּׁבִיעִ֔י פְּעֻלְּתַ֖י הַ/שְּׁמִינִ֑י כִּ֥י בֵרֲכ֖/וֹ אֱלֹהִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/005.yaml
  text: Ammiel the sixth[a], Issachar the seventh, Peullethai the eighth; for God had blessed him.
translation:
  language: de
  text: Ammiel, der sechste, Issachar, der siebte, und Peulletai, der achte; denn Gott hatte ihn gesegnet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „denn Gott segnete ihn“. Das Hebräische legt die im Deutschen gewählte Vorvergangenheit nicht ausdrücklich fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּיאֵל
  choice: Ammiel
  rationale: Der Personenname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: הַשִּׁשִּׁי
  choice: der sechste
  rationale: Der bestimmte Ordinal setzt die Aufzählung der Söhne nach ihrer Reihenfolge fort.
- source_word: יִשָׂשכָר
  choice: Issachar
  rationale: Hier bezeichnet der bekannte Name eine Einzelperson; die etablierte deutsche Namensform bleibt erhalten.
- source_word: הַשְּׁבִיעִי
  choice: der siebte
  rationale: Bestimmter Ordinal, parallel zu den übrigen Gliedern der Liste.
- source_word: פְּעֻלְּתַי
  choice: Peulletai
  rationale: Die Umschrift gibt den Personennamen und die im Hebräischen erkennbare Konsonantenverdopplung angemessen wieder.
- source_word: הַשְּׁמִינִי
  choice: der achte
  rationale: Bestimmter Ordinal zum Abschluss der fortlaufenden Aufzählung.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt hier am natürlichsten eine Begründung für die zahlreichen Nachkommen ein.
- source_word: בֵרֲכוֹ
  choice: hatte ihn gesegnet
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass Gottes Segen der hier beschriebenen großen Nachkommenschaft vorausging; die hebräische Verbform selbst legt diese deutsche Zeitstufe nicht ausdrücklich fest.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Gottesbezeichnung ist aufgrund von Form und Kontext singularisch zu verstehen.
theological_decisions:
- issue: Bezug des Suffixes in בֵרֲכוֹ („ihn gesegnet“)
  choice: Das Pronomen bezieht sich auf Obed-Edom, den Vater der unmittelbar zuvor aufgezählten Söhne.
  alternative: Das Pronomen kann weiter gefasst auf Obed-Edom als Stammvater seiner Hauslinie bezogen werden.
  rationale: Der Zusammenhang in 1. Chronik 26,4–8 nennt Obed-Edoms Söhne und weitere Nachkommen; die Begründung verweist daher am natürlichsten auf Gottes Segen für ihn. Die deutsche Fassung lässt den Namen unausgesprochen und bewahrt damit die pronominale Form des Hebräischen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Listenform des Hebräischen bleibt erhalten; Kommas um die Ordinalangaben und „und“ vor dem letzten Namen sorgen für natürliche deutsche Lesbarkeit.
