  text: וַ/יִּפֹּ֧ל הַ/גּוֹרָ֛ל מִזְרָ֖חָ/ה לְ/שֶֽׁלֶמְיָ֑הוּ וּ/זְכַרְיָ֨הוּ בְנ֜/וֹ יוֹעֵ֣ץ בְּ/שֶׂ֗כֶל הִפִּ֨ילוּ֙ גּֽוֹרָל֔וֹת וַ/יֵּצֵ֥א גוֹרָל֖/וֹ צָפֽוֹנָ/ה׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/014.yaml
  text: The lot for the east fell to Shelemyahu. Then they cast lots for his son Zekaryahu[a], a counselor with insight, and his lot came out for the north.
translation:
  language: de
  text: Das Los für den Osten fiel auf Schelemjahu. Dann warfen sie Lose für seinen Sohn Secharjahu[a], einen Ratgeber mit Einsicht, und sein Los fiel auf den Norden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen klugen Ratgeber“. Wörtlich beschreibt die hebräische Wendung Secharjahu als „einen Ratgeber mit Einsicht/Klugheit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל הַגּוֹרָל
  choice: Das Los ... fiel
  rationale: Die Verbindung נפל + גורל ist die übliche Wendung für das Fallen beziehungsweise Zuteilen eines Loses. „Fiel“ bewahrt das konkrete Bild und ist im Deutschen idiomatisch.
- source_word: מִזְרָחָה
  choice: für den Osten
  rationale: Das Richtungs-He bezeichnet hier im Zusammenhang der Torzuteilungen den zugewiesenen Bereich. „Für den Osten“ gibt diesen Sinn natürlich wieder.
- source_word: לְשֶׁלֶמְיָהוּ
  choice: auf Schelemjahu
  rationale: Das ל markiert den Empfänger der Loszuteilung; bei der deutschen Wendung „das Los fiel auf“ wird dies idiomatisch mit „auf“ ausgedrückt.
- source_word: וּזְכַרְיָהוּ בְנוֹ
  choice: Dann ... für seinen Sohn Secharjahu
  rationale: Die Wendung führt den Sohn als nächste Person der Auslosung ein. „Dann“ gibt den erzählerischen Anschluss des Waw wieder, ohne den Ablauf stärker festzulegen als nötig.
- source_word: יוֹעֵץ בְּשֶׂכֶל
  choice: einen Ratgeber mit Einsicht
  rationale: יוֹעֵץ bezeichnet einen Ratgebenden beziehungsweise Ratgeber; בְּשֶׂכֶל nennt Einsicht oder Klugheit. Die Formulierung erhält beide Bestandteile, statt sie in einem Adjektiv zusammenzuziehen.
- source_word: הִפִּילוּ גּוֹרָלוֹת
  choice: warfen sie Lose
  rationale: Der Hifil von נפל mit גורלות bezeichnet das Loswerfen. „Lose werfen“ ist die natürliche deutsche Entsprechung.
- source_word: וַיֵּצֵא גוֹרָלוֹ
  choice: und sein Los fiel auf
  rationale: יצא mit גורל beschreibt das Hervorgehen des Ergebnisses. Im Deutschen führt „sein Los fiel auf“ die Loszuteilung klar und idiomatisch fort, auch wenn die Unterscheidung der beiden hebräischen Verben dadurch weniger sichtbar ist.
- source_word: צָפוֹנָה
  choice: den Norden
  rationale: Das Richtungs-He bezeichnet den zugewiesenen nördlichen Bereich. Zusammen mit „fiel auf“ lautet die natürliche deutsche Form „auf den Norden“.
