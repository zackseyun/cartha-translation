base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/007.yaml
  text: 'The sons of Shemaiah: Othni[a], Rephael, Obed, Elzabad, whose brothers were capable men, Elihu and Semakiah.'
translation:
  language: de
  text: 'Die Söhne Schemajas: Otni, Refaël, Obed und Elsabad; seine Brüder Elihu und Semachja waren tüchtige Männer.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „tapfere Männer“ oder „fähige Männer“. Der hebräische Ausdruck kann Stärke, Tapferkeit oder Befähigung bezeichnen; hier dürfte die Tüchtigkeit für den Dienst gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שְׁמַעְיָה
  choice: Die Söhne Schemajas
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet die Söhne Schemajas und wird in einem genealogischen Verzeichnis natürlich und würdig wiedergegeben.
- source_word: עָתְנִי וּרְפָאֵל וְעוֹבֵד אֶלְזָבָד
  choice: Otni, Refaël, Obed und Elsabad
  rationale: Die Personennamen werden nach gut verständlichen deutschen Bibelnamen-Konventionen transliteriert; Refaël erhält ein Trema zur eindeutigen Aussprache.
- source_word: אֶחָיו
  choice: seine Brüder
  rationale: Die Form trägt ein Suffix der 3. Person maskulin Singular. Der Singular wird bewahrt und am ehesten auf den unmittelbar vorausgehenden Elsabad bezogen.
- source_word: בְּנֵי חָיִל
  choice: tüchtige Männer
  rationale: Die Wendung kann Stärke, Tapferkeit oder Befähigung ausdrücken. Im Zusammenhang des Torhüterdienstes vermittelt „tüchtige Männer“ Kompetenz, ohne die Bedeutung unnötig auf militärische Tapferkeit festzulegen.
- source_word: אֱלִיהוּ וּסְמַכְיָהוּ
  choice: Elihu und Semachja
  rationale: Die Namen werden in geläufiger deutscher Form wiedergegeben und als Apposition zu „seine Brüder“ verstanden.
