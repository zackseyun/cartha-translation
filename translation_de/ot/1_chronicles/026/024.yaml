  text: וּ/שְׁבֻאֵל֙ בֶּן גֵּרְשׁ֣וֹם בֶּן מֹשֶׁ֔ה נָגִ֖יד עַל הָ/אֹצָרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/024.yaml
  text: And Shebuel son of Gershom[a], son of Moses[b], was chief over the treasuries.
translation:
  language: de
  text: Und Schebuel, der Sohn Gerschoms, des Sohnes Moses, war der Vorsteher über die Schatzkammern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Schätze; das hebräische Wort kann sowohl die Aufbewahrungsorte als auch die darin verwahrten Bestände bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁבֻאֵל
  choice: Und Schebuel
  rationale: Das Präfix ו verbindet den Vers mit der vorausgehenden Aufzählung; der Personenname wird in einer im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: בֶּן גֵּרְשׁוֹם בֶּן מֹשֶׁה
  choice: der Sohn Gerschoms, des Sohnes Moses
  rationale: Die beiden Vorkommen von בֶּן bilden eine direkte genealogische Kette. Die Genitivkonstruktion macht im Deutschen eindeutig, dass Gerschom der Sohn Moses ist.
- source_word: נָגִיד
  choice: Vorsteher
  rationale: Das Wort bezeichnet hier einen mit Leitungsgewalt betrauten Verantwortlichen. „Vorsteher“ passt zum administrativen Zusammenhang, ohne Königtum oder einen bestimmten Amtsrang zu unterstellen.
- source_word: עַל
  choice: über
  rationale: Die Präposition bezeichnet hier Zuständigkeit und Aufsicht; „über“ bewahrt die knappe hebräische Ausdrucksweise.
- source_word: הָ/אֹצָרוֹת
  choice: die Schatzkammern
  rationale: אֹצָרוֹת kann sowohl Vorrats- oder Schatzräume als auch die darin verwahrten Schätze bezeichnen. Im administrativen Zusammenhang des Kapitels ist die räumlich-institutionelle Bedeutung wahrscheinlich, doch die Alternative bleibt in der Fußnote erhalten.
