  text: לַ/מִּזְרָח֮ הַ/לְוִיִּ֣ם שִׁשָּׁה֒ לַ/צָּפ֤וֹנָ/ה לַ/יּוֹם֙ אַרְבָּעָ֔ה לַ/נֶּ֥גְבָּ/ה לַ/יּ֖וֹם אַרְבָּעָ֑ה וְ/לָ/אֲסֻפִּ֖ים שְׁנַ֥יִם שְׁנָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/017.yaml
  text: On the east were six Levites; on the north[a], four a day; on the south, four a day; and at the storehouses, two by two.
translation:
  language: de
  text: Im Osten waren sechs Leviten eingeteilt, im Norden täglich vier, im Süden täglich vier und bei den Vorratsräumen[a] je zwei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Asuppim; der Ausdruck kann statt allgemeiner Vorratsräume auch einen bestimmten Ort oder einen Raumkomplex bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמִּזְרָח
  choice: im Osten
  rationale: Die Richtungsangabe mit Präposition bezeichnet hier den Ort beziehungsweise den zugewiesenen Bereich.
- source_word: הַלְוִיִּם שִׁשָּׁה
  choice: waren sechs Leviten eingeteilt
  rationale: Der knappe hebräische Nominalsatz nennt sechs Leviten für die Ostseite; „eingeteilt“ macht den administrativen Zusammenhang natürlich verständlich, ohne eine tägliche Einteilung zu ergänzen, die der hebräische Text hier nicht ausdrücklich nennt.
- source_word: לַצָּפוֹנָה ... לַנֶּגְבָּה
  choice: im Norden ... im Süden
  rationale: Die parallelen Richtungsangaben werden im Deutschen idiomatisch und einheitlich wiedergegeben.
- source_word: לַיּוֹם
  choice: täglich
  rationale: In diesem Einteilungskontext bezeichnet die Wendung die jeweilige Zahl pro Tag.
- source_word: וְלָאֲסֻפִּים
  choice: und bei den Vorratsräumen[a]
  rationale: Der Ausdruck bezeichnet wahrscheinlich Vorrats- oder Lagerräume im Tempelkomplex; da der genaue Bezug unsicher ist und auch eine Ortsbezeichnung vorliegen kann, wird die Mehrdeutigkeit in einer Fußnote bewahrt.
- source_word: שְׁנַיִם שְׁנָיִם
  choice: je zwei
  rationale: Die Wiederholung der Zahl hat distributive Bedeutung; „je zwei“ gibt dies im Deutschen knapp und natürlich wieder.
