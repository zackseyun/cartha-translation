  text: לַ/זָּהָ֤ב לַ/זָּהָב֙ וְ/לַ/כֶּ֣סֶף לַ/כֶּ֔סֶף וּ/לְ/כָל מְלָאכָ֖ה בְּ/יַ֣ד חָרָשִׁ֑ים וּ/מִ֣י מִתְנַדֵּ֔ב לְ/מַלֹּ֥אות יָד֛/וֹ הַ/יּ֖וֹם לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/005.yaml
  text: gold for the things of gold[a], and silver for the things of silver, and for every kind of work by the hands of craftsmen. And who is willing to fill his hand today for Yahweh?
translation:
  language: de
  text: das Gold für die Goldarbeiten und das Silber für die Silberarbeiten sowie für jede Arbeit, die Kunsthandwerker ausführen. Wer ist nun bereit, heute seine Hand für Jahwe zu füllen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »seine Hand zu füllen«. Die hebräische Wendung kann bedeuten, sich für den heiligen Dienst zu weihen oder eine Gabe dafür darzubringen.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַזָּהָב לַזָּהָב
  choice: das Gold für die Goldarbeiten
  rationale: Die elliptische Wiederholung bezeichnet Gold, das für Arbeiten beziehungsweise Gegenstände aus Gold bestimmt ist. „Goldarbeiten“ macht diesen Bezug im Deutschen knapp und verständlich.
- source_word: וְלַכֶּסֶף לַכֶּסֶף
  choice: und das Silber für die Silberarbeiten
  rationale: Die parallele Formulierung wird entsprechend wiedergegeben; das Silber ist für Arbeiten beziehungsweise Gegenstände aus Silber bestimmt.
- source_word: וּלְכָל מְלָאכָה בְּיַד חָרָשִׁים
  choice: sowie für jede Arbeit, die Kunsthandwerker ausführen
  rationale: בְּיַד bezeichnet hier die Ausführung durch die Handwerker. Die Wiedergabe ist natürliches Deutsch und bewahrt den umfassenden Sinn von מְלָאכָה.
- source_word: וּמִי מִתְנַדֵּב
  choice: Wer ist nun bereit
  rationale: Das Hitpael von נדב bezeichnet freiwillige Bereitschaft. „Nun“ unterstützt im Deutschen den rhetorischen Aufruf, ohne Zwang anzudeuten.
- source_word: לְמַלֹּאות יָדוֹ
  choice: seine Hand zu füllen
  rationale: Die wörtliche Wiedergabe bewahrt das kultische Bild und dessen mögliche Bezüge auf Weihe, Dienst und freiwillige Gabe, statt die Mehrdeutigkeit im Haupttext aufzulösen.
- source_word: הַיּוֹם
  choice: heute
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל wird im Zusammenhang mit der freiwilligen Hingabe zweck- beziehungsweise empfängerbezogen mit „für“ wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im hebräischen Text ausdrücklich gebrauchte Bundesname erkennbar bleibt.
- issue: Kultische Wendung לְמַלֹּאות יָדוֹ
  choice: seine Hand zu füllen
  alternative: sich zu weihen / eine volle Gabe darzubringen
  rationale: Die hebräische Wendung kann eine Weihe oder eine für den heiligen Dienst bestimmte Gabe bezeichnen. Die wörtliche Form im Haupttext bewahrt diese Spannung; die Fußnote erläutert die möglichen Bedeutungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Materialangaben werden wegen der hebräischen Ellipse leicht verdeutlicht; die auffällige kultische Wendung bleibt dagegen bewusst wörtlich und wird in der Fußnote erklärt.
