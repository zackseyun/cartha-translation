review_pass:
  verdict: revise
  source_fidelity: 'Der Grundsinn wird zutreffend wiedergegeben: David stellt seine und des Volkes Befähigung zum freiwilligen Geben als von Gott abhängig dar; alles stammt von Gott, und die Gabe kommt aus seiner Hand. Bei כָּזֹאת ist jedoch „so bereitwillig“ weniger präzise, da es die Intensität der Bereitwilligkeit nahelegt, während die Wendung eher die hier beschriebene Art bzw. das konkrete Geben bezeichnet.'
  naturalness: „Doch wer bin ich ...?“ und die zweite Satzhälfte sind würdiges, modernes Standarddeutsch. „Die Kraft hätten, so bereitwillig zu geben“ ist verständlich, klingt aber leicht unidiomatisch und kann körperliche Kraft meinen. „Imstande wären, auf diese Weise freiwillig zu geben“ gibt den idiomatischen Sinn klarer wieder.
  terminology: „freiwillig geben“ trifft להתנדב angemessen, ohne eine unnötig technische Opferterminologie aufzuzwingen. „Aus deiner Hand“ bewahrt das hebräische Bild. Die Fußnote bleibt am idiomatischen Ausdruck נַעְצֹר כֹּחַ verankert.
  issues:
  - severity: medium
    issue: Die Stellung und Nuance von כָּזֹאת wird in „so bereitwillig“ verschoben.
    rationale: Das Demonstrativum bezieht sich auf das beschriebene Geben bzw. dessen Weise („auf diese Weise“), nicht vorrangig auf den Grad der Bereitwilligkeit. Die Formulierung kann daher bedeuten, sie seien in so hohem Maß bereitwillig, statt dass sie zu einem solchen Geben fähig seien.
  - severity: low
    issue: „die Kraft hätten“ kann im Deutschen zu eng als körperliche Energie verstanden werden.
    rationale: Das hebräische Idiom bezeichnet hier die Möglichkeit, Fähigkeit oder verfügbaren Mittel. „Imstande wären“ ist im Kontext idiomatischer und umfasst diese Bedeutung ohne sachliche Einengung.
  revised_text: Doch wer bin ich, und wer ist mein Volk, dass wir imstande wären, auf diese Weise freiwillig zu geben?[a] Denn alles kommt von dir, und aus deiner Hand haben wir dir gegeben.
