revisions:
- from: Doch wer bin ich, und wer ist mein Volk, dass wir die Kraft hätten, so bereitwillig zu geben?[a] Denn alles kommt von dir, und aus deiner Hand haben wir dir gegeben.
  to: Doch wer bin ich, und wer ist mein Volk, dass wir imstande wären, auf diese Weise freiwillig zu geben?[a] Denn alles kommt von dir, und aus deiner Hand haben wir dir gegeben.
  rationale: Die Revision stellt die Demonstrativnuance von כָּזֹאת mit „auf diese Weise“ wieder her und ersetzt die potenziell missverständliche, körperlich konnotierte „Kraft“ durch die kontextgerechte Fähigkeit zum Geben. Aussagegehalt, rhetorische Demut und das Bild der Hand Gottes bleiben erhalten.
