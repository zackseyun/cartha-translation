source:
  edition: WLC
  text: וְ/כִ֨י מִ֤י אֲנִי֙ וּ/מִ֣י עַמִּ֔/י כִּֽי נַעְצֹ֣ר כֹּ֔חַ לְ/הִתְנַדֵּ֖ב כָּ/זֹ֑את כִּֽי מִמְּ/ךָ֣ הַ/כֹּ֔ל וּ/מִ/יָּדְ/ךָ֖ נָתַ֥נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/014.yaml
  text: But who am I[a], and who are my people, that we should be able to offer willingly like this? For everything comes from you, and from your hand we have given to you.
translation:
  language: de
  text: Doch wer bin ich, und wer ist mein Volk, dass wir imstande wären, auf diese Weise freiwillig zu geben?[a] Denn alles kommt von dir, und aus deiner Hand haben wir dir gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dass wir Kraft zurückhalten/festhalten könnten, um uns so freiwillig zu beteiligen?“ Die hebräische Wendung bezeichnet hier die Fähigkeit oder die Mittel zum freiwilligen Geben.'
    reason: Erläutert das idiomatische נַעְצֹר כֹּחַ und erhält zugleich die im Haupttext gewählte, natürliche Wiedergabe.
lexical_decisions:
- source_word: וְכִי
  choice: Doch
  rationale: Leitet in Davids Gebet einen demütigen rhetorischen Gegensatz ein und klingt im modernen Deutschen natürlich.
- source_word: מִי אֲנִי וּמִי עַמִּי
  choice: wer bin ich, und wer ist mein Volk
  rationale: Bewahrt die mit מִי formulierte rhetorische Frage nach Stellung und Würdigkeit.
- source_word: נַעְצֹר כֹּחַ
  choice: dass wir die Kraft hätten
  rationale: Gibt das Bild des Verfügens über beziehungsweise Zurückhaltens von Kraft verständlich wieder, ohne es auf bloße finanzielle Mittel zu verengen.
- source_word: לְהִתְנַדֵּב
  choice: bereitwillig zu geben
  rationale: Der Hitpael von נדב bezeichnet freiwilliges, aus eigenem Willen erfolgendes Geben; die Formulierung bleibt natürlich und vermeidet unnötig kultische Fachsprache.
- source_word: כָזֹאת
  choice: so
  rationale: Verweist knapp und idiomatisch auf die zuvor beschriebene außergewöhnliche Freigebigkeit.
- source_word: מִמְּךָ הַכֹּל
  choice: alles kommt von dir
  rationale: Drückt Gott als Ursprung des Ganzen klar aus und entspricht natürlichem deutschen Sprachgebrauch.
- source_word: וּמִיָּדְךָ
  choice: aus deiner Hand
  rationale: Bewahrt das transparente hebräische Bild der Hand als Quelle und Geberin.
- source_word: נָתַנּוּ לָךְ
  choice: haben wir dir gegeben
  rationale: Gibt die abgeschlossene Gabe im Gebetszusammenhang wieder und erhält die betonte Ausrichtung auf Gott.
theological_decisions:
- issue: Göttlicher Ursprung und menschliches Geben
  choice: Die menschliche Gabe wird ausdrücklich als etwas dargestellt, das zuvor von Gott stammt.
  alternative: 'Deutender: „Wir geben dir nur zurück, was ohnehin dir gehört.“'
  rationale: Der hebräische Text bezeugt, dass alles von Gott kommt und die Gabe aus seiner Hand stammt, sagt jedoch nicht ausdrücklich „zurück“ oder „gehört dir“; diese Folgerung wird daher nicht in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Demut und das Bild „aus deiner Hand“ bleiben erhalten; die ungewöhnliche Wendung נַעְצֹר כֹּחַ wird im Haupttext relativ formnah und in der Fußnote sinngemäß erläutert.
