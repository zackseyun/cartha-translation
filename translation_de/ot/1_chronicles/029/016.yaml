id: 1CH.29.16
reference: 1 Chronicles 29:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֔י/נוּ כֹ֣ל הֶ/הָמ֤וֹן הַ/זֶּה֙ אֲשֶׁ֣ר הֲכִינֹ֔נוּ לִ/בְנֽוֹת לְ/ךָ֥ בַ֖יִת לְ/שֵׁ֣ם קָדְשֶׁ֑/ךָ מִ/יָּדְ/ךָ֥ היא וּ/לְ/ךָ֥ הַ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/016.yaml
  text: O Yahweh our God[a], all this abundance that we have prepared to build you a house for your holy name is from your hand[c][b], and all things are yours.
translation:
  language: de
  text: Jahwe, unser Gott, all dieser Reichtum[a], den wir bereitgestellt haben, um dir ein Haus für deinen heiligen Namen zu bauen, stammt aus deiner Hand[b], und alles gehört dir.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese ganze Fülle“; gemeint ist die große Menge der für den Tempel zusammengetragenen Güter und Materialien.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ist aus deiner Hand“.'
    reason: literal_rendering
  - marker: c
    text: 'Wörtlich auch möglich: „und dein ist alles“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Jahwe, unser Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; אֱלֹהֵינוּ bezeichnet in dieser Anrede eindeutig den einen Gott Israels.
- source_word: כֹל הֶהָמוֹן הַזֶּה
  choice: all dieser Reichtum
  rationale: הָמוֹן bezeichnet hier die große Menge der für den Tempel zusammengetragenen wertvollen Güter. „Reichtum“ ist im Deutschen natürlich und lässt sowohl den Umfang als auch den Wert anklingen.
- source_word: אֲשֶׁר הֲכִינֹנוּ
  choice: den wir bereitgestellt haben
  rationale: Das Verb bezeichnet das Vorbereiten oder Bereitmachen; „bereitgestellt haben“ passt besonders zu den bereits zusammengetragenen Baumaterialien und Gaben.
- source_word: לִבְנוֹת לְךָ בַיִת
  choice: um dir ein Haus … zu bauen
  rationale: „Haus“ bewahrt das hebräische בַּיִת und damit das biblische Motiv des Tempels als Haus Gottes, ohne vorschnell mit „Tempel“ zu erläutern.
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: für deinen heiligen Namen
  rationale: Die knappe Formulierung bewahrt die theologische Betonung des Namens Gottes und ist zugleich verständliches modernes Deutsch.
- source_word: מִיָּדְךָ הִיא
  choice: stammt aus deiner Hand
  rationale: Die Wendung gibt das Herkunftsverhältnis idiomatisch wieder und bewahrt zugleich das Bild der gebenden Hand.
- source_word: וּלְךָ הַכֹּל
  choice: und alles gehört dir
  rationale: Die deutsche Besitzkonstruktion bringt die knappe hebräische Aussage „und dir [gehört] alles“ klar und natürlich zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des Hauses
  choice: Haus
  alternative: Tempel
  rationale: Obwohl sachlich der Tempel gemeint ist, wird בַּיִת als „Haus“ übersetzt, damit das im Ausgangstext prägnante Haus-Motiv erhalten bleibt.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Die Satzstruktur folgt dem Hebräischen eng, wird aber durch idiomatische deutsche Wendungen wie „stammt aus deiner Hand“ und „alles gehört dir“ natürlich lesbar gehalten.
