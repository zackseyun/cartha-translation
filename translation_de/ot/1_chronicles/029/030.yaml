base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/030.yaml
  text: along with all his reign and his might[b][a], and the times that passed over him and over Israel and over all the kingdoms of the lands.
translation:
  language: de
  text: samt seiner gesamten Herrschaft und seiner Macht und den Zeiten, die über ihn[a], über Israel und über alle Königreiche der Länder[b] hinweggegangen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die über ihn kamen. Wörtlich spricht das Hebräische von den Zeiten, die „über ihn hinweggingen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: alle Königreiche der Staaten. Der hebräische Text hat hier den Plural „Länder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִם
  choice: samt
  rationale: Schließt die genannten Aspekte knapp und natürlich an die Aufzählung im vorangehenden Vers an und bewahrt den begleitenden Sinn der Präposition.
- source_word: מַלְכוּתוֹ
  choice: seiner ganzen Königsherrschaft
  rationale: Bezeichnet hier Davids Herrschaft beziehungsweise Regierungszeit, nicht in erster Linie sein Herrschaftsgebiet. „Königsherrschaft“ hält beide Aspekte offen.
- source_word: גְבוּרָתוֹ
  choice: seiner Macht
  rationale: Gibt Stärke und Tatkraft wieder, ohne das Wort enger als „Heldentaten“ zu deuten.
- source_word: הָעִתִּים
  choice: den Zeiten
  rationale: Bewahrt die allgemeine Bezeichnung für die Zeitläufe und Umstände, statt sie ausdrücklich zu „Ereignissen“ umzudeuten.
- source_word: אֲשֶׁר עָבְרוּ עָלָיו
  choice: die über ihn hinweggegangen waren
  rationale: Erhält das hebräische Bild des Hinweggehens über jemanden und bleibt im Deutschen verständlich.
- source_word: וְעַל יִשְׂרָאֵל
  choice: über Israel
  rationale: 'Bewahrt die wiederholte Präposition und damit den Parallelismus: über ihn, über Israel und über die Königreiche.'
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: alle Königreiche der Länder
  rationale: Gibt den hebräischen Plural „Länder“ wieder und vermeidet die umfassendere Deutung „der Erde“.
