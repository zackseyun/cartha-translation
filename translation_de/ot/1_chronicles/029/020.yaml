  text: וַ/יֹּ֤אמֶר דָּוִיד֙ לְ/כָל הַ/קָּהָ֔ל בָּֽרְכוּ נָ֖א אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וַ/יְבָרֲכ֣וּ כָֽל הַ/קָּהָ֗ל לַ/יהוָה֙ אֱלֹהֵ֣י אֲבֹֽתֵי/הֶ֔ם וַ/יִּקְּד֧וּ וַ/יִּֽשְׁתַּחֲו֛וּ לַ/יהוָ֖ה וְ/לַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/020.yaml
  text: Then David said to all the assembly, “Now bless Yahweh your God.” And all the assembly blessed Yahweh, the God of their fathers, and bowed their heads and prostrated themselves before Yahweh and before the king.
translation:
  language: de
  text: 'Da sagte David zu der ganzen Versammlung: „Preist doch[a] Jahwe, euren Gott!“ Da pries die ganze Versammlung Jahwe, den Gott ihrer Väter. Sie verneigten sich und warfen sich vor Jahwe und vor dem König nieder.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bitte preist Jahwe, euren Gott!“ Das hebräische נָא kann der Aufforderung einen bittenden oder dringlichen Nachdruck geben.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich beschreibt das Hebräische eine körperliche Huldigung vor „Jahwe und dem König“. Die Formulierung lässt offen, inwiefern sich die Art der erwiesenen Ehre unterscheidet.
    reason: theological_ambiguity
lexical_decisions:
- source_word: בָּרְכוּ נָא
  choice: Preist doch
  rationale: Das imperative בָּרְכוּ fordert hier dazu auf, Gott preisend zu segnen. Im heutigen Deutschen gibt „preisen“ diese auf Gott gerichtete Bedeutung natürlicher wieder als „segnen“. „Doch“ lässt den auffordernden beziehungsweise bittenden Nachdruck von נָא anklingen, ohne ihn zu überbestimmen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: הַקָּהָל
  choice: die ganze Versammlung
  rationale: קָהָל bezeichnet hier das öffentlich versammelte Volk; „Versammlung“ ist präzise, verständlich und dem feierlichen Zusammenhang angemessen.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: den Gott ihrer Väter
  rationale: Die Wiedergabe bewahrt die konkrete männliche Pluralform und die bundesgeschichtliche Wendung des Hebräischen.
- source_word: וַיִּקְּדוּ
  choice: sie verneigten sich
  rationale: קדד beschreibt eine verbeugende Bewegung. „Sich verneigen“ wahrt den Unterschied zum anschließenden vollständigen Niederwerfen, ohne das im Hebräischen nicht ausdrücklich genannte Wort „Kopf“ einzufügen.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: warfen sich nieder
  rationale: Die Form bezeichnet hier eine körperliche Huldigung beziehungsweise Prostration. Die konkrete Handlung wird wiedergegeben, statt sie vorab als „Anbetung“ theologisch auszulegen.
- source_word: לַיהוָה וְלַמֶּלֶךְ
  choice: vor Jahwe und vor dem König
  rationale: In Verbindung mit dem Niederwerfen gibt „vor“ die Relation im Deutschen idiomatisch wieder. Die Wiederholung von „vor“ hält beide Bezugsgrößen deutlich fest, ohne zu behaupten, ihnen sei dieselbe Art von Ehre erwiesen worden.
theological_decisions:
- issue: Die körperliche Huldigung gilt grammatisch sowohl Jahwe als auch dem König.
  choice: 'Die gemeinsame körperliche Handlung wird ausdrücklich beibehalten: „warfen sich vor Jahwe und vor dem König nieder“.'
  alternative: „Sie beteten Jahwe an und huldigten dem König.“
  rationale: Der hebräische Satz verwendet dieselben Verben für beide Bezugsgrößen. Eine Aufteilung in „anbeten“ und „huldigen“ wäre eine plausible Deutung, würde aber eine im Wortlaut nicht ausdrücklich vorgenommene Unterscheidung in den Haupttext eintragen. Die konkrete Körperhaltung bewahrt die Spannung, ohne göttliche Verehrung des Königs zu unterstellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Gebrauch von „preist/pries“ bildet die Wiederholung des hebräischen Verbs ab. Die beiden aufeinanderfolgenden Körperbewegungen bleiben unterscheidbar; zugleich werden weder „Kopf“ noch eine ausdrückliche theologische Deutung ergänzt.
