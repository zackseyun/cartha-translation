  text: וַ/יָּ֨מָת֙ בְּ/שֵׂיבָ֣ה טוֹבָ֔ה שְׂבַ֥ע יָמִ֖ים עֹ֣שֶׁר וְ/כָב֑וֹד וַ/יִּמְלֹ֛ךְ שְׁלֹמֹ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/028.yaml
  text: And he died in a good old age[a], full of days, riches, and honor; and Solomon his son reigned in his place.
translation:
  language: de
  text: Und er starb in hohem, erfülltem Alter, lebenssatt[a], reich und geehrt; sein Sohn Salomo regierte an seiner Stelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „satt an Tagen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Und er starb
  rationale: Das Wayyiqtol führt die Erzählung mit dem nächsten Ereignis fort; „Und er starb“ gibt diese schlichte narrative Folge wieder.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: in hohem Alter
  rationale: Die Wendung bezeichnet ein gutes, erfülltes Greisenalter. „In hohem Alter“ ist im modernen Deutschen natürlich; die positive Wertung wird zusammen mit „lebenssatt, reich und geehrt“ deutlich.
- source_word: שְׂבַע יָמִים
  choice: lebenssatt
  rationale: Wörtlich steht „satt an Tagen“. „Lebenssatt“ bewahrt das Bild einer langen, erfüllten Lebenszeit in knapper und würdiger Form.
- source_word: עֹשֶׁר וְכָבוֹד
  choice: reich und geehrt
  rationale: עֹשֶׁר bezeichnet Reichtum, כָבוֹד in diesem königlichen Zusammenhang Ehre beziehungsweise gesellschaftliches Ansehen. Die adjektivische Fassung fügt sich natürlich in die Beschreibung seines Todeszustands ein.
- source_word: וַיִּמְלֹךְ
  choice: wurde ... König
  rationale: Im Zusammenhang der Thronfolge bezeichnet מלך den Antritt beziehungsweise das Ausüben der Königsherrschaft. „Wurde König“ ist hier modernes, idiomatisches Deutsch.
- source_word: שְׁלֹמֹה בְנוֹ
  choice: Sein Sohn Salomo
  rationale: Diese Wortstellung ist im Deutschen natürlicher als eine formale Nachbildung der hebräischen Reihenfolge.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die feste Nachfolgeformel bezeichnet, dass Salomo Davids Stellung als König einnahm.
