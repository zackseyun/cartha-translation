source:
  edition: WLC
  text: וְ/הַ/נִּמְצָ֤א אִתּ/וֹ֙ אֲבָנִ֔ים נָתְנ֖וּ לְ/אוֹצַ֣ר בֵּית יְהוָ֑ה עַ֥ל יַד יְחִיאֵ֖ל הַ/גֵּרְשֻׁנִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/008.yaml
  text: Whoever had precious stones gave them to the treasury of the house of Yahweh, into the care of Jehiel the Gershonite.
translation:
  language: de
  text: Wer Edelsteine besaß, gab sie in die Schatzkammer des Hauses Jahwes, in die Obhut Jehiëls, des Gerschoniters.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Steine«; im Zusammenhang sind wertvolle Schmuck- oder Edelsteine gemeint. »In die Obhut Jehiëls« gibt die hebräische Wendung »durch die Hand Jehiëls« wieder.'
    reason: Der Ausgangstext nennt lediglich »Steine« und verwendet für Jehiëls Zuständigkeit eine wörtlich schwer verständliche Hand-Redewendung.
lexical_decisions:
- source_word: וְהַנִּמְצָא אִתּוֹ
  choice: Wer … besaß
  rationale: Die Konstruktion mit dem Nifal-Partizip von מצא und אִתּוֹ bezeichnet idiomatisch etwas, das sich im Besitz einer Person befindet. Die deutsche Formulierung gibt dies natürlich und distributiv wieder.
- source_word: אֲבָנִים
  choice: Edelsteine
  rationale: Wörtlich steht »Steine«; im Zusammenhang der Wertgaben für das Heiligtum sind wertvolle Schmuck- oder Edelsteine gemeint. »Edelsteine« vermittelt diesen kontextuellen Sinn, ohne bestimmte Arten festzulegen.
- source_word: נָתְנוּ
  choice: gab sie
  rationale: נתן bezeichnet hier das Übergeben als freiwillige Gabe. »gab« ist direkt und idiomatisch.
- source_word: לְאוֹצַר בֵּית יְהוָה
  choice: in die Schatzkammer des Hauses Jahwes
  rationale: אוֹצָר bezeichnet hier den Aufbewahrungsort für Wertgegenstände; »Schatzkammer« passt zum Kontext. »Haus Jahwes« bewahrt die konkrete hebräische Ausdrucksweise statt sie mit »Tempel« zu interpretieren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַל יַד
  choice: in die Obhut
  rationale: Die Wendung bedeutet wörtlich »unter/durch die Hand« und bezeichnet hier die anvertraute Zuständigkeit beziehungsweise Aufsicht Jehiëls.
- source_word: יְחִיאֵל
  choice: Jehiël
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibelnamenform wiedergegeben; das Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: הַגֵּרְשֻׁנִּי
  choice: des Gerschoniters
  rationale: Die Bezeichnung ordnet Jehiël der gerschonitischen Sippe zu und bleibt nahe an der Form des Ausgangstextes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Vers steht der Eigenname ausdrücklich. »Jahwe« bewahrt ihn als Namen, statt ihn durch den traditionellen Titel »der HERR« zu ersetzen.
- issue: Bedeutung von אֲבָנִים
  choice: Edelsteine
  alternative: Steine
  rationale: Der hebräische Ausdruck ist formal unspezifisch, doch der Kontext einer Abgabe wertvoller Güter an die Schatzkammer legt kostbare Steine nahe. Die Fußnote wahrt die wörtliche Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am Hebräischen, wird aber idiomatisch geglättet. Die Formulierung »Haus Jahwes« bewahrt das biblische Bild; »Obhut« macht die administrative Verantwortung verständlich.
