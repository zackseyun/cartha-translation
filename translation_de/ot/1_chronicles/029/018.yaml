source:
  edition: WLC
  text: יְהוָ֗ה אֱ֠לֹהֵי אַבְרָהָ֞ם יִצְחָ֤ק וְ/יִשְׂרָאֵל֙ אֲבֹתֵ֔י/נוּ שֳׁמְרָ/ה זֹּ֣את לְ/עוֹלָ֔ם לְ/יֵ֥צֶר מַחְשְׁב֖וֹת לְבַ֣ב עַמֶּ֑/ךָ וְ/הָכֵ֥ן לְבָבָ֖/ם אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/018.yaml
  text: O Yahweh[a], God of Abraham, Isaac, and Israel, our fathers, keep this forever in the intentions of the thoughts of the heart of your people[d][c][b], and direct their heart toward you.
translation:
  language: de
  text: Jahwe[a], Gott Abrahams, Isaaks und Israels, unserer Väter, bewahre dies für immer als die Neigung der Gedanken im Herzen deines Volkes[b] und richte ihr Herz auf dich aus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text nennt hier den Gottesnamen JHWH, traditionell häufig mit „der HERR“ wiedergegeben.
    reason: divine_name
  - marker: b
    text: 'Wörtlicher etwa: „Bewahre dies für immer als das Gebilde (oder: die Neigung) der Gedanken im Herzen deines Volkes.“ Die hebräische Wendung ist mehrdeutig.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „festige ihr Herz zu dir hin“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen übliche Form.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל אֲבֹתֵינוּ
  choice: Gott Abrahams, Isaaks und Israels, unserer Väter
  rationale: Die Genitivfügung ist im Deutschen natürlich. „Israel“ folgt dem hebräischen Text und wird nicht zu „Jakob“ harmonisiert; „Väter“ bezeichnet hier ausdrücklich die drei Patriarchen.
- source_word: שָׁמְרָה זֹּאת לְעוֹלָם
  choice: bewahre diese Gesinnung für immer
  rationale: שׁמר bezeichnet hier das dauerhafte Erhalten. Das demonstrative „dies“ verweist im Kontext auf die zuvor gezeigte willige Haltung; „diese Gesinnung“ macht diesen Bezug im Deutschen verständlich.
- source_word: לְיֵצֶר מַחְשְׁבוֹת לְבַב עַמֶּךָ
  choice: in den Gedanken des Herzens deines Volkes
  rationale: יֵצֶר kann Gebilde, Neigung oder Gesinnung bedeuten. Sein Sinn wird in „diese Gesinnung“ aufgenommen, während „Gedanken des Herzens“ die hebräische Verbindung und deren ganzheitliche Anthropologie bewahrt.
- source_word: וְהָכֵן לְבָבָם אֵלֶיךָ
  choice: und richte ihr Herz fest auf dich
  rationale: Das Hifil von כון kann „fest machen“, „gründen“, „bereiten“ oder „ausrichten“ bedeuten. „fest auf dich richten“ verbindet Festigkeit und Hinwendung; der kollektive Singular „ihr Herz“ bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. Die Wiedergabe als „Jahwe“ erhält seinen Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Patriarchenname יִשְׂרָאֵל
  choice: Israel
  alternative: Jakob
  rationale: Obwohl in einer solchen Väterformel „Jakob“ erwartet werden könnte, steht im hebräischen Text ausdrücklich „Israel“.
- issue: Bedeutung von יֵצֶר und Bezug von זֹּאת
  choice: „diese Gesinnung“ als kontextuelle Wiedergabe
  alternative: „dies … als das Gebilde/Trachten der Gedanken“
  rationale: Die Wendung ist im Hebräischen dicht und mehrdeutig. Der Haupttext versteht זֹּאת als Rückverweis auf die bereitwillige Haltung des Volkes und gibt den volitionalen Sinn von יֵצֶר natürlich wieder; die formnähere Möglichkeit wird in der Fußnote offengehalten.
- issue: Bedeutung von וְהָכֵן
  choice: richte … fest auf dich
  alternative: festige … zu dir hin / bereite … auf dich vor
  rationale: Die Form kann sowohl Festigung als auch Ausrichtung ausdrücken. Die gewählte Formulierung bewahrt beide Sinnanteile, ohne eine besondere Lehrtradition einzutragen.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die Anrede „Jahwe“ und die patriarchale Formel bleiben quellentreu; schwer verständliche hebräische Innensprache wird im Haupttext behutsam geglättet und in den Fußnoten formnäher dokumentiert.
