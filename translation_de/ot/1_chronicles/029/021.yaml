id: 1CH.29.21
reference: 1 Chronicles 29:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּזְבְּח֣וּ לַ/יהוָ֣ה זְ֠בָחִים וַ/יַּעֲל֨וּ עֹל֜וֹת לַ/יהוָ֗ה לְֽ/מָחֳרַת֮ הַ/יּ֣וֹם הַ/הוּא֒ פָּרִ֨ים אֶ֜לֶף אֵילִ֥ים אֶ֛לֶף כְּבָשִׂ֥ים אֶ֖לֶף וְ/נִסְכֵּי/הֶ֑ם וּ/זְבָחִ֥ים לָ/רֹ֖ב לְ/כָל יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/021.yaml
  text: 'They sacrificed sacrifices to Yahweh and offered up burnt offerings to Yahweh on the next day after that day: one thousand bulls[a], one thousand rams, one thousand lambs, and their drink offerings[c][b], and sacrifices in abundance for all Israel.'
translation:
  language: de
  text: 'Am folgenden Tag[a] brachten sie Yahweh Schlachtopfer dar und opferten Yahweh Brandopfer: tausend Stiere, tausend Widder und tausend Lämmer samt den dazugehörigen Trankopfern[b] sowie Schlachtopfer in großer Zahl für ganz Israel.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „am nächsten Tag nach jenem Tag“.'
    reason: lexical_alternative
  - marker: b
    text: Trankopfer waren Flüssigkeiten, die zusammen mit den Tieropfern ausgegossen wurden; auch „Gussopfer“.
    reason: cultural_note
  - marker: c
    text: 'Oder: „im Namen von ganz Israel“ beziehungsweise „zugunsten von ganz Israel“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְבְּחוּ ... זְבָחִים
  choice: brachten sie ... Schlachtopfer dar
  rationale: Die Verbindung aus dem Verb זבח und dem gleichstämmigen Substantiv bezeichnet kultisches Schlachten beziehungsweise Darbringen. „Schlachtopfer darbringen“ ist im Deutschen idiomatischer als die formale Wiederholung „Opfer opfern“ und unterscheidet diese Opfer von den anschließend genannten Brandopfern.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Der Gottesname יהוה wird als Eigenname „Yahweh“ wiedergegeben; die Präposition ל kennzeichnet die Ausrichtung beziehungsweise Widmung der Opfer.
- source_word: וַיַּעֲלוּ עֹלוֹת
  choice: opferten ... Brandopfer
  rationale: עֹלוֹת bezeichnet Opfer, die auf dem Altar vollständig verbrannt werden. „Brandopfer“ ist der geläufige und sachlich passende deutsche Kultbegriff.
- source_word: לְמָחֳרַת הַיּוֹם הַהוּא
  choice: am folgenden Tag
  rationale: Die wörtliche Formulierung lautet ungefähr „am morgigen Tag nach jenem Tag“. „Am folgenden Tag“ gibt die zeitliche Folge natürlich und präzise wieder; die hebräische Ausdrucksweise wird in einer Fußnote dokumentiert.
- source_word: פָּרִים אֶלֶף
  choice: tausend Stiere
  rationale: פָּרִים bezeichnet hier männliche Rinder als Opfertiere; „Stiere“ ist die natürliche deutsche Entsprechung.
- source_word: אֵילִים אֶלֶף
  choice: tausend Widder
  rationale: אֵילִים bezeichnet spezifisch männliche Schafe, daher „Widder“ statt des allgemeineren „Schafe“.
- source_word: כְּבָשִׂים אֶלֶף
  choice: tausend Lämmer
  rationale: כְּבָשִׂים bezeichnet im Opferkontext Lämmer beziehungsweise junge Schafe; „Lämmer“ ist hier die übliche Wiedergabe.
- source_word: וְנִסְכֵּיהֶם
  choice: samt den dazugehörigen Trankopfern
  rationale: Das Suffix verweist auf die zuvor aufgezählten Brandopfer. „Dazugehörig“ macht diese Zuordnung deutlich, während „Trankopfer“ den kultischen Fachbegriff verständlich wiedergibt.
- source_word: וּזְבָחִים לָרֹב
  choice: sowie Schlachtopfer in großer Zahl
  rationale: לָרֹב bezeichnet eine große Menge. Die Formulierung lässt erkennen, dass zusätzlich zu den bezifferten Brandopfern zahlreiche Schlachtopfer dargebracht wurden.
- source_word: לְכָל יִשְׂרָאֵל
  choice: für ganz Israel
  rationale: ל kann hier Ziel, Bezug oder begünstigte Gruppe ausdrücken. „Für ganz Israel“ bewahrt diese Weite, ohne eine spezifischere stellvertretende Bedeutung festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen יהוה. Die Transliteration „Yahweh“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לְכָל יִשְׂרָאֵל im Opferzusammenhang
  choice: für ganz Israel
  alternative: im Namen von ganz Israel; zugunsten von ganz Israel
  rationale: Die Präposition ל lässt mehrere Beziehungsnuancen zu. Das allgemeine „für“ erhält diese Offenheit und vermeidet es, dem Vers ausdrücklich eine bestimmte Theorie stellvertretenden Opferns zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Fachbegriffe „Schlachtopfer“, „Brandopfer“ und „Trankopfer“ bleiben erhalten, werden aber in einen natürlichen deutschen Satzbau eingebettet. Die Wiederholung von „Yahweh“ folgt der hebräischen Wiederholung und wahrt ihren Nachdruck.
