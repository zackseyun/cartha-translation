source:
  edition: WLC
  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֤ר מָלַךְ֙ עַל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָ֑ה בְּ/חֶבְר֤וֹן מָלַךְ֙ שֶׁ֣בַע שָׁנִ֔ים וּ/בִ/ירוּשָׁלִַ֥ם מָלַ֖ךְ שְׁלֹשִׁ֥ים וְ/שָׁלֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/027.yaml
  text: The days that he reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: de
  text: Die Zeit, in der er über Israel regierte, betrug vierzig Jahre. In Hebron regierte er sieben Jahre und in Jerusalem dreiunddreißig Jahre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: Die Zeit, in der er … regierte
  rationale: Die hebräische Wendung lautet wörtlich »und die Tage, die er regierte«. Im modernen Deutschen gibt »die Zeit, in der« die Dauer idiomatisch wieder, ohne den Sinn zu erweitern.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: עַל bezeichnet in Verbindung mit מָלַךְ den Herrschaftsbereich. Ein zusätzliches »ganz« ist im Vers nicht ausdrücklich vorhanden.
- source_word: אַרְבָּעִים שָׁנָה
  choice: vierzig Jahre
  rationale: Natürliche deutsche Wiedergabe der hebräischen Zahlwortverbindung.
- source_word: בְּחֶבְרוֹן
  choice: In Hebron
  rationale: Die Präposition בְּ kennzeichnet hier den Ort der Herrschaft.
- source_word: מָלַךְ
  choice: regierte
  rationale: Im königlichen Zusammenhang gibt »regierte« die Tätigkeit des Herrschens präzise und in natürlichem Deutsch wieder.
- source_word: וּבִירוּשָׁלַ͏ִם
  choice: und in Jerusalem
  rationale: Die Verbindung aus Konjunktion, Ortspräposition und Ortsname wird unmittelbar wiedergegeben.
- source_word: שְׁלֹשִׁים וְשָׁלוֹשׁ
  choice: dreiunddreißig
  rationale: Die Bestandteile der hebräischen Zahl werden nach heutiger deutscher Konvention als zusammengesetztes Zahlwort wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wörtliche hebräische Rede von den »Tagen« wird zugunsten der im Deutschen natürlichen Dauerangabe »Die Zeit … betrug« idiomatisch wiedergegeben; die parallele Wiederholung von »regierte« für Hebron und Jerusalem bleibt erhalten.
