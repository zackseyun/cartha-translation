base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/019.yaml
  text: And give to Solomon my son a whole heart to keep your commandments[a], your testimonies, and your statutes, and to do all of them, and to build the fortress that I have prepared.
translation:
  language: de
  text: Und gib meinem Sohn Salomo ein ungeteiltes Herz, damit er deine Gebote, deine Zeugnisse und deine Satzungen hält und sie alle ausführt und die Tempelburg[a] baut, die ich vorbereitet habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort kann eine Burg, eine befestigte oder palastartige Anlage bezeichnen; hier bezeichnet es den Tempelbau, den David für Salomo vorbereitet hat. Möglich ist daher auch: »den Tempel« oder »die Burganlage«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה בְנִי תֵּן
  choice: Und gib meinem Sohn Salomo
  rationale: Die Konstruktion kennzeichnet Salomo als Empfänger der Bitte. Die deutsche Wortstellung ist natürlich und bewahrt sowohl die direkte Bitte »gib« als auch »meinem Sohn«.
- source_word: לֵבָב שָׁלֵם
  choice: ein ungeteiltes Herz
  rationale: לֵבָב bezeichnet das innere Denken, Wollen und Begehren; שָׁלֵם meint Ganzheit, Vollständigkeit und Lauterkeit. »Ein ungeteiltes Herz« gibt die konkrete Herzmetapher verständlich wieder, ohne eine sündlose Vollkommenheit zu behaupten.
- source_word: לִשְׁמוֹר
  choice: damit er … hält
  rationale: שׁמר bedeutet bei Geboten gewöhnlich »halten« oder »befolgen«. Der deutsche Finalsatz gibt den Zweck des erbetenen Herzens idiomatisch wieder.
- source_word: מִצְוֺתֶיךָ עֵדְוֺתֶיךָ וְחֻקֶּיךָ
  choice: deine Gebote, deine Zeugnisse und deine Satzungen
  rationale: Die drei unterschiedlichen hebräischen Rechtsbegriffe bleiben auch im Deutschen unterschieden. »Zeugnisse« bewahrt die besondere Bundesterminologie von עֵדוֹת, während »Satzungen« die festgesetzten Vorschriften von חֻקִּים bezeichnet.
- source_word: וְלַעֲשׂוֹת הַכֹּל
  choice: und sie alle ausführt
  rationale: הַכֹּל bezieht sich hier am natürlichsten auf die zuvor genannten Gebote, Zeugnisse und Satzungen. »Sie alle ausführt« macht diesen Bezug deutlich und gibt עשה als tätige Umsetzung wieder.
- source_word: וְלִבְנוֹת הַבִּירָה
  choice: und die Tempelburg baut
  rationale: בִּירָה bezeichnet eine bedeutende, palastartige oder befestigte Anlage. Im Kontext ist Davids vorbereitetes Heiligtum gemeint. »Tempelburg« bewahrt sowohl den kultischen Bezug als auch die ungewöhnliche architektonische Nuance; die möglichen einfacheren Wiedergaben werden in der Fußnote genannt.
- source_word: אֲשֶׁר הֲכִינוֹתִי
  choice: die ich vorbereitet habe
  rationale: Das Hifil von כון bedeutet »vorbereiten« oder »bereitmachen«. Das Perfekt wird im Deutschen natürlich mit dem Perfekt wiedergegeben; die Formulierung lässt offen, ob besonders Pläne, Material oder das Bauvorhaben als Ganzes vorbereitet sind.
theological_decisions:
- issue: Bedeutung von לֵבָב שָׁלֵם
  choice: ein ungeteiltes Herz
  alternative: ein ganzes Herz; ein vollkommenes Herz; ein aufrichtiges Herz
  rationale: Die Bitte betrifft eine vollständige, loyale innere Ausrichtung auf Gottes Willen. »Ungeteilt« vermittelt dies, ohne שָׁלֵם dogmatisch als absolute moralische Vollkommenheit festzulegen.
- issue: Bezeichnung des Jerusalemer Heiligtums durch בִּירָה
  choice: Tempelburg
  alternative: Burg; Palast; Tempel
  rationale: Der seltene Ausdruck trägt eine befestigte oder palastartige Nuance, bezeichnet hier jedoch eindeutig das von Salomo zu errichtende Heiligtum. Die gewählte Zusammensetzung wahrt beide Aspekte, während die Fußnote die echte lexikalische Spannweite offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Gebetssprache. Die traditionelle biblische Rechtsterminologie »Gebote, Zeugnisse und Satzungen« bleibt erhalten; der Satzbau wurde durch einen Finalsatz natürlich gestaltet. Der markierte Ausdruck »Tempelburg« wird wegen seiner ungewöhnlichen, aber quellengetreuen Aussage in einer Fußnote erläutert.
