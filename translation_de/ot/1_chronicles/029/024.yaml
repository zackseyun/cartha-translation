base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/024.yaml
  text: And all the officials[a], the mighty men, and also all the sons of King David pledged allegiance to King Solomon.
translation:
  language: de
  text: Und alle führenden Männer, die Helden und auch alle Söhne König Davids leisteten König Salomo[a] Gefolgschaft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gaben die Hand unter König Salomo“; eine hebräische Wendung dafür, sich seiner Herrschaft zu unterstellen oder ihm Treue zu geloben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָּׂרִים
  choice: führenden Männer
  rationale: Der Ausdruck bezeichnet hochrangige Amts- und Führungsträger. „Führende Männer“ ist im Zusammenhang natürlich und lässt offen, ob vor allem Hofbeamte, politische Würdenträger oder militärische Befehlshaber gemeint sind.
- source_word: גִּבֹּרִים
  choice: Helden
  rationale: Das Wort bezeichnet mächtige oder besonders tapfere Männer, häufig mit militärischem Bezug. „Helden“ bewahrt diese traditionelle, zugleich nicht ausschließlich militärische Bedeutungsbreite.
- source_word: בְּנֵי הַמֶּלֶךְ דָּוִיד
  choice: alle Söhne König Davids
  rationale: Die Wiedergabe erhält sowohl die ausdrückliche Sohnschaft als auch Davids Königstitel und klingt in modernem Standarddeutsch natürlich.
- source_word: נָתְנוּ יָד תַּחַת
  choice: unterwarfen sich
  rationale: Die Wendung lautet wörtlich „gaben die Hand unter“ und bezeichnet das Anerkennen der Herrschaft beziehungsweise loyale Unterordnung. „Unterwarfen sich“ gibt den Kern des Bildes knapp wieder; die Fußnote bewahrt die wörtliche Form und den möglichen Loyalitätsaspekt.
- source_word: שְׁלֹמֹה הַמֶּלֶךְ
  choice: König Salomo
  rationale: Die im Deutschen übliche Titelfolge gibt die hebräische Apposition natürlich wieder und hebt Salomos anerkannte königliche Stellung hervor.
theological_decisions:
- issue: Art und Stärke der Bindung an Salomo
  choice: unterwarfen sich
  alternative: schworen König Salomo die Treue
  rationale: Der hebräische Ausdruck kann Unterordnung und Loyalitätsbekundung umfassen, nennt aber keinen ausdrücklichen Schwur. Die Hauptfassung vermeidet daher, einen formellen Treueeid in den Text einzutragen; die Fußnote nennt die Bedeutungsbreite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Aufzählungsstil, ohne hölzern zu wirken. „Helden“ erhält den traditionsreichen Ausdruck; die idiomatische Wendung wird verständlich übersetzt und in der Fußnote transparent gemacht.
