  text: וַ/יִּֽתְנַדְּבוּ֩ שָׂרֵ֨י הָ/אָב֜וֹת וְ/שָׂרֵ֣י שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/הַ/מֵּא֔וֹת וּ/לְ/שָׂרֵ֖י מְלֶ֥אכֶת הַ/מֶּֽלֶךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/006.yaml
  text: Then the leaders of the fathers’ houses[a], and the leaders of the tribes of Israel, and the commanders of the thousands and of the hundreds, and the overseers of the king’s work[c][b], gave willingly.
translation:
  language: de
  text: Da gaben die Oberhäupter der Sippen[a], die Oberhäupter der Stämme Israels, die Befehlshaber der Tausendschaften und Hundertschaften[b] sowie die Verantwortlichen für die Arbeit des Königs freiwillig[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich etwa „Vaterhäuser“; gemeint sind nach gemeinsamer Abstammung gegliederte Großfamilien oder Sippen.
    reason: cultural_note
  - marker: b
    text: „Tausendschaften“ und „Hundertschaften“ waren militärische oder administrative Einheiten.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: „brachten freiwillige Gaben dar“ oder „zeigten sich bereit“. Das hebräische Verb betont die freie Bereitschaft; im Zusammenhang geht es um freiwillige Gaben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַדְּבוּ
  choice: gaben … freiwillig
  rationale: Der Hitpael von נדב bezeichnet hier eine freiwillige materielle Gabe als Antwort auf Davids Aufruf. Die Formulierung gibt sowohl die Freiwilligkeit als auch den durch den Kontext bestimmten Vorgang des Gebens wieder.
- source_word: שָׂרֵי הָאָבוֹת
  choice: Oberhäupter der Sippenverbände
  rationale: Die Wendung bezeichnet führende Personen der väterlich-ancestral gegliederten Großfamilien oder Sippen. „Oberhäupter der Sippenverbände“ ist im heutigen Deutsch verständlich und bildet die soziale Gliederung genauer ab als bloß „Familienoberhäupter“.
- source_word: שָׂרֵי שִׁבְטֵי יִשְׂרָאֵל
  choice: Oberhäupter der Stämme Israels
  rationale: „Oberhäupter“ gibt שָׂרֵי als Autoritätsträger wieder; „Stämme Israels“ ist die direkte und etablierte Entsprechung für שִׁבְטֵי יִשְׂרָאֵל.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: Befehlshaber der Tausendschaften und Hundertschaften
  rationale: Die Zahlenwörter bezeichnen hier militärische oder administrative Einheiten. Da שָׂרֵי beide Gruppen regiert, macht „Befehlshaber“ die im Hebräischen vorausgesetzte Funktion deutlich.
- source_word: וּלְשָׂרֵי מְלֶאכֶת הַמֶּלֶךְ
  choice: sowie die Verantwortlichen für die Arbeit des Königs
  rationale: Die Wendung bezeichnet Amtsträger, die für königliche Arbeiten oder Aufgaben zuständig waren. „Verantwortliche“ ist breit genug für die administrative Funktion; „Arbeit des Königs“ bewahrt den offenen Umfang von מְלָאכָה.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung bleibt eng an der hebräischen Struktur, wird aber durch „sowie“ und funktionsbezogene Amtsbezeichnungen natürlich lesbar. Die soziale Bedeutung der „Vaterhäuser“ und die Einheitsbezeichnungen werden nicht im Haupttext übererklärt, sondern in Fußnoten erschlossen.
