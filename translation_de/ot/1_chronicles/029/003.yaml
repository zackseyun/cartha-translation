source:
  edition: WLC
  text: וְ/ע֗וֹד בִּ/רְצוֹתִ/י֙ בְּ/בֵ֣ית אֱלֹהַ֔/י יֶשׁ לִ֥/י סְגֻלָּ֖ה זָהָ֣ב וָ/כָ֑סֶף נָתַ֤תִּי לְ/בֵית אֱלֹהַ/י֙ לְ/מַ֔עְלָ/ה מִ/כָּל הֲכִינ֖וֹתִי לְ/בֵ֥ית הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/003.yaml
  text: Moreover[a], because of my delight in the house of my God, I have a personal treasure of gold and silver, and I have given it to the house of my God[c][b], over and above all that I have prepared for the holy house.
translation:
  language: de
  text: 'Und außerdem: Weil mir das Haus meines Gottes am Herzen liegt, habe ich aus meinem persönlichen Schatz an Gold und Silber für das Haus meines Gottes gegeben, zusätzlich zu allem, was ich für das heilige Haus bereitgestellt habe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעוֹד
  choice: darüber hinaus
  rationale: Kennzeichnet den zusätzlichen persönlichen Beitrag Davids und stellt ihn als Ergänzung zu den zuvor genannten Vorbereitungen heraus.
- source_word: בִּרְצוֹתִי בְּבֵית אֱלֹהַי
  choice: weil mir das Haus meines Gottes am Herzen liegt
  rationale: Gibt Davids Wohlgefallen und innere Zuneigung als Beweggrund natürlich und würdig wieder; ב bezeichnet hier den Gegenstand beziehungsweise Bereich seines Wohlgefallens.
- source_word: יֶשׁ לִי סְגֻלָּה זָהָב וָכָסֶף
  choice: aus meinem persönlichen Schatz an Gold und Silber
  rationale: סְגֻלָּה bezeichnet wertvollen persönlichen Besitz. Die deutsche Formulierung macht den Unterschied zwischen Davids Privatvermögen und den bereits bereitgestellten Mitteln deutlich.
- source_word: נָתַתִּי
  choice: gebe ich
  rationale: Der hebräische Perfekt kann im Zusammenhang der öffentlichen Ankündigung die hiermit vollzogene Gabe ausdrücken. Das deutsche Präsens gibt diesen performativen Sinn natürlich wieder, ohne eine zeitlich weit zurückliegende Handlung nahezulegen.
- source_word: לְבֵית אֱלֹהַי
  choice: für das Haus meines Gottes
  rationale: לְ markiert Ziel beziehungsweise Bestimmung der Gabe; im Deutschen ist „für“ in diesem Zusammenhang natürlicher als „an“ oder „zu“.
- source_word: לְמַעְלָה מִכָּל הֲכִינוֹתִי
  choice: zusätzlich zu allem, was ich … bereitgestellt habe
  rationale: 'Bewahrt den additiven und steigernden Sinn: Die persönliche Gabe kommt zu sämtlichen früheren Vorbereitungen hinzu.'
- source_word: לְבֵית הַקֹּדֶשׁ
  choice: für das heilige Haus
  rationale: Entspricht wörtlich dem „Haus der Heiligkeit“ und bewahrt die Wiederholung von בַּיִת sowie die Vorstellung des Gott geweihten Hauses.
theological_decisions:
- issue: Bezeichnung des künftigen Heiligtums
  choice: Haus meines Gottes / heiliges Haus
  alternative: Tempel / Heiligtum
  rationale: Der hebräische Text verwendet wiederholt בַּיִת („Haus“). Diese Wiedergabe bewahrt die sprachliche Wiederholung und den theologischen Klang von Gottes Haus, ohne den Ausdruck interpretierend zu ersetzen.
- issue: Zeitwert von נָתַתִּי
  choice: gebe ich
  alternative: habe ich gegeben
  rationale: Im Redekontext kann der Perfekt eine durch die Erklärung vollzogene oder verbindlich erklärte Gabe bezeichnen. Beide Zeitauffassungen sind möglich; die Fußnote hält die Alternative offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Am Herzen liegen“ vermittelt Davids inneres Wohlgefallen idiomatisch; „persönlicher Schatz“ unterscheidet seinen privaten Besitz von den zuvor bereitgestellten Mitteln. Die Wiederholung von „Haus“ wurde bewusst erhalten.
