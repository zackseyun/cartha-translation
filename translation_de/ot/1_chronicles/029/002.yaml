  text: וּֽ/כְ/כָל כֹּחִ֞/י הֲכִינ֣וֹתִי לְ/בֵית אֱלֹהַ֗/י הַ/זָּהָ֣ב לַ֠/זָּהָב וְ/הַ/כֶּ֨סֶף לַ/כֶּ֜סֶף וְ/הַ/נְּחֹ֣שֶׁת לַ/נְּחֹ֗שֶׁת הַ/בַּרְזֶל֙ לַ/בַּרְזֶ֔ל וְ/הָ/עֵצִ֖ים לָ/עֵצִ֑ים אַבְנֵי שֹׁ֨הַם וּ/מִלּוּאִ֜ים אַבְנֵי פ֣וּךְ וְ/רִקְמָ֗ה וְ/כֹ֨ל אֶ֧בֶן יְקָרָ֛ה וְ/אַבְנֵי שַׁ֖יִשׁ לָ/רֹֽב־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/002.yaml
  text: 'And with all my strength I have prepared for the house of my God: the gold for the things of gold[a], and the silver for the things of silver, and the bronze for the things of bronze, the iron for the things of iron, and the wood for the things of wood; onyx stones, settings, stones of antimony, variegated stones, every precious stone[d][c][b], and marble stones in abundance.'
translation:
  language: de
  text: 'Mit all meiner Kraft habe ich für das Haus meines Gottes bereitgestellt: das Gold für die goldenen Gegenstände, das Silber für die silbernen, die Bronze für die bronzenen, das Eisen für die eisernen und das Holz für die hölzernen; außerdem Onyxsteine[a], Fassungssteine[b], Antimonsteine[c], bunt gemusterte Steine[d], allerlei Edelsteine und Marmorsteine[e] in großer Menge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Welche Steinart mit שֹׁהַם gemeint ist, lässt sich nicht sicher bestimmen. Traditionell wird das Wort mit „Onyx“ wiedergegeben; auch andere Edelsteine wurden vorgeschlagen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Einlagen“ oder „Fassungen“. Das hebräische Wort מִלּוּאִים kann Einfassungs- oder Einlegearbeit beziehungsweise dafür bestimmte Steine bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „Steine des פוּךְ“. פוּךְ bezeichnet sonst ein dunkles Mineral, das als Augenschminke diente; ob hier ein entsprechendes Mineral, dunkle Steine oder ein anderes Schmuckmaterial gemeint ist, bleibt unsicher.'
    reason: lexical_alternative
  - marker: d
    text: Das Wort רִקְמָה kann „bunte“ oder „kunstvoll gemusterte Arbeit“ bedeuten und bezeichnet andernorts auch Stickerei. Hier sind wegen des Zusammenhangs vermutlich verschiedenfarbige oder gemusterte Steine gemeint.
    reason: lexical_alternative
  - marker: e
    text: Die genaue Bestimmung von שַׁיִשׁ ist unsicher. Neben „Marmor“ wird auch „Alabaster“ vorgeschlagen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכָל־כֹּחִי
  choice: Mit all meiner Kraft
  rationale: כֹּחַ bezeichnet Kraft oder Leistungsvermögen. Die Formulierung gibt Davids vollen persönlichen Einsatz in natürlichem Deutsch wieder.
- source_word: הֲכִינוֹתִי
  choice: habe ich … bereitgestellt
  rationale: Das Verb bezeichnet hier das Bereiten beziehungsweise Bereitstellen der Baustoffe. Das deutsche Perfekt passt zur abgeschlossenen Handlung mit gegenwärtigem Ergebnis.
- source_word: לְבֵית אֱלֹהַי
  choice: für das Haus meines Gottes
  rationale: Die wörtliche Wendung bewahrt sowohl den Bezug auf das Heiligtum als auch Davids persönliche Gottesbeziehung, ohne bereits mit „Tempel“ zu interpretieren.
- source_word: הַזָּהָב לַזָּהָב ... וְהָעֵצִים לָעֵצִים
  choice: das Gold für die goldenen Gegenstände … und das Holz für die hölzernen
  rationale: Die wiederholte Konstruktion aus Material und ל bezeichnet die jeweilige Bestimmung. „Gegenstände“ wird einmal ausdrücklich genannt und in den parallelen Gliedern natürlich mitgedacht.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Das Wort kann Kupfer oder Bronze bezeichnen. Im Zusammenhang bearbeiteter Gegenstände für das Heiligtum ist „Bronze“ die übliche und plausible Wiedergabe.
- source_word: אַבְנֵי שֹׁהַם
  choice: Onyxsteine
  rationale: „Onyx“ ist die traditionelle Identifizierung; da sie nicht sicher ist, wird die Unsicherheit in einer Fußnote offengelegt.
- source_word: וּמִלּוּאִים
  choice: Steine zum Einsetzen
  rationale: Das Wort gehört zum Bedeutungsfeld des Füllens beziehungsweise Einsetzens und bezeichnet hier wahrscheinlich Steine, die in Fassungen oder Einlegearbeiten eingesetzt werden.
- source_word: אַבְנֵי פוּךְ
  choice: schwarze Steine
  rationale: פּוּךְ bezeichnet sonst ein dunkles, meist als Augenschminke verwendetes Mineral. „Schwarze Steine“ gibt den wahrscheinlichen Farbeindruck wieder, während die genaue Sachbedeutung in der Fußnote offenbleibt.
- source_word: וְרִקְמָה
  choice: bunt gemusterte Steine
  rationale: רִקְמָה bezeichnet sonst vielfarbige oder kunstvoll gemusterte Arbeit. Im Kontext einer Liste von Steinen und Baustoffen liegt eine Bezeichnung gemusterter oder verschiedenfarbiger Steine nahe.
- source_word: אַבְנֵי שַׁיִשׁ
  choice: Marmorsteine
  rationale: „Marmor“ entspricht einer verbreiteten traditionellen Deutung; die genaue Gesteinsart ist jedoch unsicher und wird daher mit einer Fußnote versehen.
- source_word: לָרֹב
  choice: in großer Menge
  rationale: Die Wendung bezeichnet eine reichliche, große Menge und wird idiomatisch wiedergegeben.
