  text: כִּֽי גֵרִ֨ים אֲנַ֧חְנוּ לְ/פָנֶ֛י/ךָ וְ/תוֹשָׁבִ֖ים כְּ/כָל אֲבֹתֵ֑י/נוּ כַּ/צֵּ֧ל יָמֵ֛י/נוּ עַל הָ/אָ֖רֶץ וְ/אֵ֥ין מִקְוֶֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/015.yaml
  text: For we are sojourners before you[a], and temporary residents, as all our fathers were. Our days on the earth are like a shadow[c][b], and there is no hope.
translation:
  language: de
  text: Denn wir sind Fremde vor dir[a] und nur zeitweise Ansässige[b], wie alle unsere Vorfahren. Unsere Tage auf der Erde sind wie ein Schatten, und es gibt keine Hoffnung.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Menschen in der Fremde“ beziehungsweise „Fremdlinge“.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck bezeichnet ansässige Bewohner ohne vollen einheimischen Status; traditionell auch „Beisassen“.
    reason: lexical_alternative
  - marker: c
    text: „Keine Hoffnung“ steht hier im Zusammenhang mit der Flüchtigkeit des menschlichen Lebens auf der Erde. Die Formulierung bewahrt die Härte des hebräischen Wortlauts und ist nicht ohne Weiteres als Leugnung jeder Hoffnung auf Gott zu verstehen.
    reason: contextual_clarification
lexical_decisions:
- source_word: גֵרִים
  choice: Fremde
  rationale: Das Wort bezeichnet Menschen, die außerhalb ihrer angestammten Heimat und ohne vollen einheimischen Status an einem Ort leben. „Fremde“ ist im Deutschen verständlich und bewahrt diesen sozialen Sinn.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: Die Wendung bedeutet wörtlich „vor deinem Angesicht“. „Vor dir“ gibt die unmittelbare Ausrichtung auf Gott knapp und natürlich wieder.
- source_word: תוֹשָׁבִים
  choice: nur vorläufig Ansässige
  rationale: Gemeint sind ansässige Menschen ohne dauerhaftes Heimatrecht oder vollen einheimischen Status. Die Formulierung macht sowohl das Wohnen als auch die fehlende Dauerhaftigkeit deutlich.
- source_word: כְּכָל אֲבֹתֵינוּ
  choice: wie alle unsere Vorfahren
  rationale: אָבוֹת bezeichnet hier die früheren Generationen Israels. „Vorfahren“ gibt diesen kollektiven Sinn in modernem Deutsch natürlicher wieder als „Väter“.
- source_word: כַּצֵּל
  choice: wie ein Schatten
  rationale: Das Bild des Schattens vermittelt Kürze, Flüchtigkeit und fehlenden Bestand, ohne die Metapher auszudeuten.
- source_word: יָמֵינוּ עַל הָאָרֶץ
  choice: unsere Tage auf der Erde
  rationale: Die direkte Wiedergabe ist klar und bewahrt sowohl die zeitliche als auch die räumliche Aussage.
- source_word: וְאֵין מִקְוֶה
  choice: und es gibt keine Hoffnung
  rationale: מִקְוֶה kann „Hoffnung“ oder „Erwartung“ bezeichnen. Die gewählte Fassung bewahrt die schroffe Aussage des Hebräischen und löst ihre theologische Spannung nicht im Haupttext auf.
theological_decisions:
- issue: Bedeutung von וְאֵין מִקְוֶה im Zusammenhang menschlicher Vergänglichkeit
  choice: „und es gibt keine Hoffnung“ bleibt als uneingeschränkte Formulierung im Haupttext stehen; eine Fußnote erläutert den unmittelbaren Zusammenhang.
  alternative: „und es gibt keine Aussicht auf Dauer“ oder „und es gibt kein Bleiben“
  rationale: Der Vers spricht von der Flüchtigkeit des irdischen Lebens. Eine abschwächende Umschreibung im Haupttext würde die echte Härte und mögliche Mehrdeutigkeit der hebräischen Aussage vorschnell auflösen. Zugleich verhindert die Kontextnotiz, dass der Satz ohne Weiteres als umfassende Leugnung jeder Hoffnung auf Gott gelesen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche soziale Kategorie תוֹשָׁבִים wird im Haupttext verständlich umschrieben und in der Fußnote genauer erläutert. Die Metapher des Schattens und die theologische Spannung des Schlusssatzes bleiben erhalten.
