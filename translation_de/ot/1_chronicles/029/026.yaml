  text: וְ/דָוִיד֙ בֶּן יִשָׁ֔י מָלַ֖ךְ עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/026.yaml
  text: And David son of Jesse reigned over all Israel.
translation:
  language: de
  text: Und David, der Sohn Isais, regierte über ganz Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/דָוִיד
  choice: Und David
  rationale: Die Konjunktion וְ führt den abschließenden Rückblick als schlichte Fortsetzung ein; „Und“ bewahrt diesen Zusammenhang.
- source_word: בֶּן יִשָׁי
  choice: der Sohn Isais
  rationale: Die Konstruktverbindung bezeichnet David genealogisch. Im Deutschen ist „der Sohn Isais“ natürlich und präzise; der Name Isai erhält im Genitiv die Endung -s.
- source_word: מָלַךְ
  choice: regierte
  rationale: Das Qal-Perfekt bezeichnet hier die Ausübung der Königsherrschaft, nicht den Regierungsantritt. „Regierte“ gibt diesen durativen Sinn im Rückblick idiomatisch wieder.
- source_word: עַל
  choice: über
  rationale: In Verbindung mit מלך bezeichnet עַל das Volk beziehungsweise Herrschaftsgebiet, über das jemand regiert.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: כָּל drückt die Gesamtheit des Volkes aus; „ganz Israel“ ist im modernen Standarddeutsch knapp und natürlich.
