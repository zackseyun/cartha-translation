source:
  edition: WLC
  text: לְ/ךָ֣ יְ֠הוָה הַ/גְּדֻלָּ֨ה וְ/הַ/גְּבוּרָ֤ה וְ/הַ/תִּפְאֶ֨רֶת֙ וְ/הַ/נֵּ֣צַח וְ/הַ/ה֔וֹד כִּי כֹ֖ל בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֑רֶץ לְ/ךָ֤ יְהוָה֙ הַ/מַּמְלָכָ֔ה וְ/הַ/מִּתְנַשֵּׂ֖א לְ/כֹ֥ל לְ/רֹֽאשׁ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/011.yaml
  text: Yours[a], O Yahweh, are the greatness and the power and the splendor and the victory and the majesty, for everything in the heavens and on the earth is yours. Yours, O Yahweh, is the kingdom, and you are exalted as head over all.
translation:
  language: de
  text: Dir, Yahweh, gehören die Größe und die Macht, die Pracht, der Sieg[a] und die Majestät; denn alles im Himmel und auf der Erde ist dein. Dir, Yahweh, gehört das Königtum, und du bist als Haupt über alles erhaben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Beständigkeit“ oder „der Vorrang“. Das hebräische Wort נֵצַח kann hier neben „Sieg“ auch dauerhafte Überlegenheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְךָ
  choice: Dein / ist dein
  rationale: Die vorangestellte Besitzangabe trägt Nachdruck; ihre Wiederholung wird im Deutschen bewahrt.
- source_word: הַגְּדֻלָּה
  choice: die Größe
  rationale: Direkte und im Lobpreis natürliche Wiedergabe des Abstraktums.
- source_word: הַגְּבוּרָה
  choice: die Macht
  rationale: Bezeichnet Kraft beziehungsweise Macht und passt zum königlichen Kontext.
- source_word: הַתִּפְאֶרֶת
  choice: die Pracht
  rationale: Gibt Schönheit, Herrlichkeit und Glanz in einem natürlichen deutschen Lobpreisbegriff wieder.
- source_word: הַנֵּצַח
  choice: der Sieg
  rationale: Im Zusammenhang der königlichen Hoheitsbegriffe ist „Sieg“ eine gut belegte Deutung; die weiter reichende Bedeutung wird in der Fußnote offengehalten.
- source_word: הַהוֹד
  choice: die Majestät
  rationale: Bringt den königlichen Glanz und die Hoheit des Begriffs zum Ausdruck.
- source_word: כִּי כֹל בַּשָּׁמַיִם וּבָאָרֶץ
  choice: denn alles im Himmel und auf der Erde
  rationale: כִּי wird kausal verstanden; כֹל bezeichnet umfassend alles, was Himmel und Erde einschließen.
- source_word: הַמַּמְלָכָה
  choice: das Königtum
  rationale: Betont hier eher königliche Herrschaft und Souveränität als ein räumlich verstandenes Reich.
- source_word: וְהַמִּתְנַשֵּׂא
  choice: und du erhebst dich
  rationale: Die reflexive Form des Partizips wird formal erkennbar wiedergegeben; im Kontext bezeichnet sie Gottes erhabene Stellung.
- source_word: לְכֹל לְרֹאשׁ
  choice: als Haupt über alles
  rationale: Bewahrt das Bild des Hauptes und drückt höchste Stellung über allem aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: HERR; Jahwe
  rationale: Der hebräische Text nennt den Eigennamen; „Yahweh“ bewahrt ihn als solchen.
- issue: Bedeutung von נֵצַח in der Lobpreisreihe
  choice: Sieg
  alternative: Beständigkeit; Vorrang
  rationale: „Sieg“ passt zur Abfolge königlicher Hoheitsbegriffe, doch das hebräische Wort kann auch dauerhafte Überlegenheit oder Beständigkeit bezeichnen; diese Spannung bleibt in der Fußnote sichtbar.
- issue: Nuance von הַמַּמְלָכָה
  choice: Königtum
  alternative: Königreich; Herrschaft
  rationale: „Königtum“ bezeichnet die Yahweh eigene Königsherrschaft, ohne den Ausdruck auf ein Gebiet zu verengen.
- issue: Syntaktische Deutung von וְהַמִּתְנַשֵּׂא
  choice: du erhebst dich
  alternative: du bist erhaben; der sich Erhebende
  rationale: Die gewählte Fassung wahrt die reflexive Form, während die Alternative den im Kontext naheliegenden Zustandscharakter stärker hervorhebt.
translation_notes:
  register: Gehobene, aber gut verständliche Sprache für einen liturgischen Lobpreis. Die wiederholte Anrede „Dein, Yahweh“ und die Reihung mit Artikeln bewahren Nachdruck und Würde des Hebräischen.
