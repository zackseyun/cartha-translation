source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֱלֹהֵ֔י/נוּ מוֹדִ֥ים אֲנַ֖חְנוּ לָ֑/ךְ וּֽ/מְהַֽלְלִ֖ים לְ/שֵׁ֥ם תִּפְאַרְתֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/013.yaml
  text: And now[a], our God, we give thanks to you and praise the name of your glory.
translation:
  language: de
  text: Und nun, unser Gott, danken wir dir und preisen deinen herrlichen Namen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „den Namen deiner Herrlichkeit“; תִּפְאֶרֶת kann auch „Pracht“ oder „Hoheit“ bedeuten.'
    reason: Bewahrt die formale hebräische Genitivverbindung und die Bedeutungsbreite des Substantivs.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl das verbindende וְ als auch den zeitlich-rhetorischen Übergang עַתָּה im Gebet.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Gibt das Substantiv mit dem Suffix der 1. Person Plural unmittelbar wieder; ein zusätzliches „o“ steht nicht im Hebräischen und wäre im heutigen Deutsch unnötig feierlich.
- source_word: מוֹדִים אֲנַחְנוּ לָךְ
  choice: danken wir dir
  rationale: ידה im Hifil bezeichnet hier im gottesdienstlichen Zusammenhang das Danken. Die nachgestellte ausdrückliche Subjektangabe אֲנַחְנוּ wird durch die natürliche deutsche Wortstellung wiedergegeben.
- source_word: וּמְהַלְלִים
  choice: und preisen
  rationale: הלל im Piel bezeichnet lobendes Preisen. „Preisen“ wahrt den gehobenen Gebetsklang und unterscheidet sich klar von „danken“.
- source_word: לְשֵׁם תִּפְאַרְתֶּךָ
  choice: deinen herrlichen Namen
  rationale: Die attributive deutsche Fassung gibt die Bedeutung der hebräischen Genitivverbindung natürlich wieder, behält aber das theologisch bedeutsame Motiv des Namens ausdrücklich bei. Die formalere Struktur wird in der Fußnote genannt.
theological_decisions:
- issue: Göttliche Anrede ohne ergänzte liturgische Partikel
  choice: unser Gott
  alternative: o unser Gott
  rationale: Das Hebräische enthält keine eigene Anredepartikel. Die unmittelbare Anrede bleibt auch ohne ein hinzugefügtes „o“ eindeutig und klingt in modernem Standarddeutsch natürlicher.
- issue: Wiedergabe der Verbindung von Name und Herrlichkeit
  choice: deinen herrlichen Namen
  alternative: den Namen deiner Herrlichkeit
  rationale: Die Hauptfassung bewahrt das biblisch-theologische Namensmotiv und gibt תִּפְאֶרֶת idiomatisch als Eigenschaft des Namens wieder. Die Fußnote hält die formale Konstruktion sichtbar, ohne sie dogmatisch umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Gebetsrhythmus. „Preisen“ trägt den feierlichen Ton des hebräischen Lobverbs, ohne altertümliche Formen einzuführen.
