source:
  edition: WLC
  text: וַֽ/יִּתְּנ֞וּ לַ/עֲבוֹדַ֣ת בֵּית הָ/אֱלֹהִ֗ים זָהָ֞ב כִּכָּרִ֣ים חֲמֵֽשֶׁת אֲלָפִים֮ וַ/אֲדַרְכֹנִ֣ים רִבּוֹ֒ וְ/כֶ֗סֶף כִּכָּרִים֙ עֲשֶׂ֣רֶת אֲלָפִ֔ים וּ/נְחֹ֕שֶׁת רִבּ֛וֹ וּ/שְׁמוֹנַ֥ת אֲלָפִ֖ים כִּכָּרִ֑ים וּ/בַרְזֶ֖ל מֵֽאָה אֶ֥לֶף כִּכָּרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/007.yaml
  text: And they gave for the service of the house of God five thousand talents of gold and ten thousand darics[a], and ten thousand talents of silver, and eighteen thousand talents of bronze[c][b], and one hundred thousand talents of iron.
translation:
  language: de
  text: Sie gaben für den Dienst am Haus Gottes 5.000 Talente[a] Gold und 10.000 Dareiken[b], 10.000 Talente Silber, 18.000 Talente Bronze[c] und 100.000 Talente Eisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein „Talent“ war eine große antike Gewichtseinheit; gemeint ist hier nicht ein Talent im Sinn einer Begabung.
    reason: cultural_note
  - marker: b
    text: Eine Dareike war eine persische Goldmünze.
    reason: cultural_note
  - marker: c
    text: 'Das hebräische Wort kann auch „Kupfer“ bedeuten. Die Mengenangabe lautet wörtlich: „zehntausend und achttausend Talente Bronze“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Sie gaben
  rationale: Das Verb נתן bezeichnet hier im Erzählzusammenhang eine abgeschlossene Gabe. „Gaben“ ist schlicht und legt nicht stärker als der Ausgangstext fest, ob es sich um eine Spende oder Abgabe handelte.
- source_word: לַעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: für den Dienst am Haus Gottes
  rationale: עֲבוֹדָה kann sowohl Arbeit als auch Dienst bezeichnen. „Dienst“ bewahrt im Kontext des Gotteshauses die praktische und kultische Bedeutungsweite; „Haus Gottes“ gibt die hebräische Formulierung wieder, ohne sie vorzeitig durch „Tempel“ zu konkretisieren.
- source_word: כִּכָּרִים
  choice: Talente
  rationale: כִּכָּר bezeichnet hier eine große antike Gewichtseinheit. Die traditionelle Wiedergabe „Talent“ ist präzise und wird durch eine Fußnote gegen die moderne Bedeutung als Begabung abgegrenzt.
- source_word: אֲדַרְכֹנִים
  choice: Dareiken
  rationale: Das persische Lehnwort bezeichnet persische Goldmünzen. Die historisch spezifische deutsche Bezeichnung „Dareike“ ist genauer als das allgemeinere „Goldmünze“.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen. Im Zusammenhang antiker Baumaterialien ist „Bronze“ die herkömmliche und wahrscheinlichere Wiedergabe, ohne die lexikalische Alternative völlig auszuschließen.
- source_word: רִבּוֹ וּשְׁמוֹנַת אֲלָפִים
  choice: '18.000'
  rationale: Die hebräische Zahlenfolge lautet wörtlich „zehntausend und achttausend“. Die zusammengezogene Zahl entspricht natürlichem modernem Deutsch und bewahrt den Gesamtwert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe an der hebräischen Aufzählung, während die Zahlen nach deutscher Schreibweise gegliedert und die zusammengesetzte Bronze-Menge natürlich als Gesamtzahl wiedergegeben werden.
