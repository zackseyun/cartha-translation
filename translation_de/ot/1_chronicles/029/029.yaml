base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/029.yaml
  text: The acts of David the king[a], the former and the latter, are written in the records of Samuel the seer, and in the records of Nathan the prophet[c][b], and in the records of Gad the seer.
translation:
  language: de
  text: Die Taten Davids, des Königs, von den ersten bis zu den letzten, sind aufgezeichnet in den Aufzeichnungen Samuels, des Sehers, und in den Aufzeichnungen Natans, des Propheten, und in den Aufzeichnungen Gads, des Sehers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen tragen Samuel und Gad verschiedene, aber verwandte prophetische Titel (rō’eh beziehungsweise ḥōzeh). Beide werden hier mit „Seher“ wiedergegeben; „Visionär“ wäre für Gads Titel möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי דָּוִיד הַמֶּלֶךְ
  choice: die Geschichte König Davids
  rationale: דִּבְרֵי bezeichnet hier nicht bloß Worte, sondern die Begebenheiten beziehungsweise Taten aus Davids Königszeit. „Geschichte“ gibt diesen umfassenden Sinn im Deutschen natürlich wieder.
- source_word: הָרִאשֹׁנִים וְהָאֲחרֹנִים
  choice: die frühere und die spätere
  rationale: Die substantivierten Adjektive werden eng am Hebräischen wiedergegeben und beziehen sich grammatisch auf die Geschichte beziehungsweise die Begebenheiten Davids; die Formulierung umfasst seine gesamte Regierungszeit.
- source_word: הִנָּם כְּתוּבִים
  choice: ist aufgezeichnet
  rationale: Die deiktische Hervorhebung von הִנָּם wird im Deutschen nicht eigens mit „siehe“ ausgedrückt, da „ist aufgezeichnet“ die Aussage würdig und idiomatisch wiedergibt.
- source_word: עַל דִּבְרֵי
  choice: in den Schriften
  rationale: Wörtlich steht „auf/über den Worten/Begebenheiten“. Im Zusammenhang verweist die Wendung auf schriftliche Quellen; „in den Schriften“ ist dafür natürlich, ohne die genaue literarische Gattung festzulegen.
- source_word: הָרֹאֶה
  choice: der Seher
  rationale: רֹאֶה ist ein prophetischer Titel und wird mit dem geläufigen deutschen Ausdruck „Seher“ wiedergegeben.
- source_word: הַנָּבִיא
  choice: der Prophet
  rationale: „Prophet“ ist die übliche und genaue Wiedergabe von נָבִיא.
- source_word: הַחֹזֶה
  choice: der Schauer
  rationale: „Schauer“ bewahrt die im Hebräischen vorhandene lexikalische Unterscheidung zwischen חֹזֶה und רֹאֶה, obwohl beide prophetische Seher bezeichnen.
theological_decisions:
- issue: Unterscheidung der prophetischen Titel רֹאֶה und חֹזֶה
  choice: רֹאֶה als „Seher“ und חֹזֶה als „Schauer“
  alternative: Beide Titel als „Seher“ wiedergeben
  rationale: Der Ausgangstext verwendet zwei verschiedene, inhaltlich verwandte Titel. Die differenzierte Wiedergabe wahrt diese Unterscheidung, ohne daraus einen theologischen Rangunterschied abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Geschichte“ ist verständlicher als eine wörtliche Wiedergabe mit „Worte“ und weniger gattungsspezifisch als „Chronik“. Die Reihung der drei Quellen bleibt erhalten; wiederholtes „und in“ wird im Deutschen zur flüssigeren Aufzählung leicht gestrafft.
