revisions:
- from: Die Geschichte König Davids, die frühere und die spätere, ist aufgezeichnet in den Schriften Samuels, des Sehers, in den Schriften Natans, des Propheten, und in den Schriften Gads, des Schauers.[a]
  to: Die Taten Davids, des Königs, von den ersten bis zu den letzten, sind aufgezeichnet in den Aufzeichnungen Samuels, des Sehers, und in den Aufzeichnungen Natans, des Propheten, und in den Aufzeichnungen Gads, des Sehers.[a]
  rationale: Die Revision ersetzt die unnatürliche und missverständliche Titelwiedergabe „Schauer“ durch „Seher“ und vermerkt die hebräische lexikalische Variation transparent in der Fußnote. Sie gibt דִּבְרֵי im königlichen Rückblick mit „Taten“ wieder und fasst „die ersten und die letzten“ idiomatisch als „von den ersten bis zu den letzten“, ohne die Aussage über den vollständigen Verlauf zu verändern. „Aufzeichnungen“ wahrt den Bezug auf schriftliche Quellen und bleibt hinsichtlich ihrer literarischen Gattung offen.
