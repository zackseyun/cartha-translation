    issue: „Schauer“ für חֹזֶה
    rationale: „Schauer“ ist im modernen Standarddeutsch keine natürliche Bezeichnung für einen prophetischen Seher und wird überwiegend als Schauder bzw. als anders gelagerte Berufsbezeichnung verstanden. Die Wiedergabe ist daher missverständlich.
  - severity: medium
    issue: „die Geschichte König Davids, die frühere und die spätere“
    rationale: 'Die Formulierung ist grammatisch zwar analysierbar, aber unnatürlich und semantisch weniger präzise: דִּבְרֵי steht hier für Taten bzw. Ereignisse, und „die ersten und die letzten“ bildet einen Merismus für deren gesamten Verlauf.'
  - severity: low
