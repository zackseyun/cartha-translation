    rationale: Bei einer Wiedergabe von דִּבְרֵי als „Geschichte“ ist der Singular möglich, aber die idiomatischere Wiedergabe „Taten“ folgt der pluralischen Form und verlangt entsprechend „sind aufgezeichnet“.
  revised_text: Die Taten Davids, des Königs, von den ersten bis zu den letzten, sind aufgezeichnet in den Aufzeichnungen Samuels, des Sehers, und in den Aufzeichnungen Natans, des Propheten, und in den Aufzeichnungen Gads, des Sehers.[a]
