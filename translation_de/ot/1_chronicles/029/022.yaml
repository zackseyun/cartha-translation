  text: וַ/יֹּאכְל֨וּ וַ/יִּשְׁתּ֜וּ לִ/פְנֵ֧י יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא בְּ/שִׂמְחָ֣ה גְדוֹלָ֑ה וַ/יַּמְלִ֤יכוּ שֵׁנִית֙ לִ/שְׁלֹמֹ֣ה בֶן דָּוִ֔יד וַ/יִּמְשְׁח֧וּ לַ/יהוָ֛ה לְ/נָגִ֥יד וּ/לְ/צָד֖וֹק לְ/כֹהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/022.yaml
  text: And they ate and drank before Yahweh on that day with great joy[a], and they made Solomon son of David king a second time, and they anointed him for Yahweh as ruler[d][c][b], and Zadok as priest.
translation:
  language: de
  text: An jenem Tag aßen und tranken sie vor Jahwe mit großer Freude. Dann machten sie Salomo, den Sohn Davids, zum zweiten Mal zum König und sie salbten ihn für Jahwe zum Herrscher[a] und Zadok zum Priester.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor Jahwe zum Herrscher“. Das Hebräische kann eine Bestimmung für Jahwe oder eine Handlung in seiner Gegenwart ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Wendung bezeichnet ein Handeln vor beziehungsweise in der Gegenwart Jahwes. „Vor Jahwe“ ist knapp, natürlich und bewahrt den kultischen Bezug.
- source_word: בְּשִׂמְחָה גְדוֹלָה
  choice: mit großer Freude
  rationale: Die Präposition mit Substantiv und Adjektiv bezeichnet die Art und Weise; „mit großer Freude“ ist idiomatisches modernes Deutsch.
- source_word: וַיַּמְלִיכוּ
  choice: machten … zum König
  rationale: Der Hifil von מלך bedeutet, jemanden zum König zu machen beziehungsweise als König einzusetzen; die Wiedergabe fügt keine ausdrücklich erwähnte Krönungszeremonie hinzu.
- source_word: שֵׁנִית
  choice: zum zweiten Mal
  rationale: Die Form bezeichnet ausdrücklich eine Wiederholung und wird genauer wiedergegeben als durch das allgemeinere „erneut“.
- source_word: וַיִּמְשְׁחוּ
  choice: salbten
  rationale: משׁח ist der übliche Ausdruck für die rituelle Salbung bei der Einsetzung in ein königliches oder priesterliches Amt.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Das ל kann Zugehörigkeit, Bestimmung oder Bezug ausdrücken. „Für Jahwe“ bewahrt diese relationale beziehungsweise weihende Nuance, ohne sie weiter festzulegen.
- source_word: לְנָגִיד
  choice: zum Herrscher
  rationale: נָגִיד bezeichnet hier den von Gott eingesetzten Leiter des Volkes. „Herrscher“ vermittelt die königliche Leitungsgewalt deutlicher als das im Deutschen missverständliche „Fürst“.
- source_word: לְכֹהֵן
  choice: zum Priester
  rationale: Die Form bezeichnet die Einsetzung Zadoks in das Priesteramt und steht parallel zu Salomos Einsetzung.
- source_word: בֶן דָּוִיד
  choice: den Sohn Davids
  rationale: Die dynastische Sohnesbezeichnung wird unmittelbar und natürlich wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als persönlicher Name transliteriert und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen.
- issue: Bedeutung von לַיהוָה im Salbungssatz
  choice: für Jahwe
  alternative: vor Jahwe
  rationale: Das ל kann die Bestimmung beziehungsweise Zugehörigkeit zu Jahwe ausdrücken, während im Zusammenhang auch eine Handlung in seiner Gegenwart denkbar ist. Der Haupttext wahrt die erstgenannte Nuance; die Fußnote nennt die echte Alternative.
- issue: Syntaktischer Bezug der Salbung Zadoks
  choice: und Zadok zum Priester
  alternative: und sie salbten Zadok zum Priester
  rationale: Das gemeinsame Verb „salbten“ regiert im Hebräischen sowohl Salomo als auch Zadok. Die deutsche Ellipse erhält diese Parallelstruktur, ohne ein zusätzliches Verb einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde leicht gegliedert, um den langen hebräischen Koordinationssatz gut verständlich wiederzugeben. Fachlich etablierte Begriffe wie „salben“ und „Priester“ bleiben erhalten; vermeidbare altertümliche Formulierungen wurden nicht verwendet.
