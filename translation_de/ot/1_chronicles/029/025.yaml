  text: וַ/יְגַדֵּ֨ל יְהוָ֤ה אֶת שְׁלֹמֹה֙ לְ/מַ֔עְלָ/ה לְ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּתֵּ֤ן עָלָי/ו֙ ה֣וֹד מַלְכ֔וּת אֲ֠שֶׁר לֹֽא הָיָ֧ה עַל כָּל מֶ֛לֶךְ לְ/פָנָ֖י/ו עַל יִשְׂרָאֵֽל־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/025.yaml
  text: And Yahweh made Solomon exceedingly great in the sight of all Israel[a], and gave him royal majesty such as had not been on any king before him over Israel.
translation:
  language: de
  text: Und Jahwe machte Salomo vor den Augen ganz Israels überaus groß und verlieh ihm eine königliche Hoheit[a], wie sie vor ihm kein König über Israel besessen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „königlichen Glanz“ oder „Majestät des Königtums“.'
    reason: Lexikalische Bandbreite von הוֹד מַלְכוּת.
lexical_decisions:
- source_word: וַיְגַדֵּל ... לְמַעְלָה
  choice: machte ... überaus groß
  rationale: Der Hifil von גדל ist kausativ („groß machen“); לְמַעְלָה verstärkt die Aussage. „Überaus groß“ gibt beides natürlich und präzise wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des göttlichen Eigennamens bewahrt das Tetragramm als Namen, statt es durch einen Titel zu ersetzen.
- source_word: לְעֵינֵי כָּל־יִשְׂרָאֵל
  choice: vor den Augen ganz Israels
  rationale: Die hebräische Wendung bezeichnet die öffentliche Wahrnehmung und Anerkennung durch das ganze Volk.
- source_word: וַיִּתֵּן עָלָיו
  choice: verlieh ihm
  rationale: Wörtlich steht „gab auf ihn“; gemeint ist das Verleihen beziehungsweise Übertragen von Würde. „Verlieh ihm“ ist im Deutschen idiomatisch.
- source_word: הוֹד מַלְכוּת
  choice: königliche Hoheit
  rationale: הוֹד bezeichnet Hoheit, Majestät oder Glanz; מַלְכוּת bestimmt diese Würde als königlich. Die gewählte Formulierung wahrt beide Aspekte.
- source_word: אֲשֶׁר לֹא הָיָה עַל כָּל־מֶלֶךְ לְפָנָיו עַל־יִשְׂרָאֵל
  choice: wie sie vor ihm kein König über Israel besessen hatte
  rationale: Die relative Aussage bezieht sich auf die königliche Hoheit. „Vor ihm“ ist zeitlich gemeint, und „über Israel“ bezeichnet den Herrschaftsbereich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als persönlichen Namen und folgt der üblichen deutschen Schreibweise.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, ohne unnatürlich zu wirken; die vergleichende Aussage wurde idiomatisch als Besitz der verliehenen Hoheit formuliert.
