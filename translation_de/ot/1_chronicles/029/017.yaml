id: 1CH.29.17
reference: 1 Chronicles 29:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יָדַ֣עְתִּי אֱלֹהַ֔/י כִּ֤י אַתָּה֙ בֹּחֵ֣ן לֵבָ֔ב וּ/מֵישָׁרִ֖ים תִּרְצֶ֑ה אֲנִ֗י בְּ/יֹ֤שֶׁר לְבָבִ/י֙ הִתְנַדַּ֣בְתִּי כָל אֵ֔לֶּה וְ/עַתָּ֗ה עַמְּ/ךָ֙ הַ/נִּמְצְאוּ פֹ֔ה רָאִ֥יתִי בְ/שִׂמְחָ֖ה לְ/הִֽתְנַדֶּב לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/017.yaml
  text: And I know[a], my God, that you test the heart and take pleasure in uprightness. I, in the uprightness of my heart, have willingly offered all these things[b], and now I have seen your people who are present here willingly offer to you with joy.
translation:
  language: de
  text: Und ich weiß, mein Gott, dass du das Herz prüfst und an Aufrichtigkeit Gefallen hast.[a] Ich habe mit aufrichtigem Herzen all dies freiwillig gegeben. Und nun habe ich mit Freude gesehen, wie dein Volk, das hier anwesend ist,[b] dir freiwillig gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an Geradheit Wohlgefallen hast“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das hier vorgefunden wird“, das heißt: das hier anwesend ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּחֵן לֵבָב
  choice: das Herz prüfst
  rationale: בֹּחֵן bezeichnet ein prüfendes oder untersuchendes Ergründen. Der Singular „das Herz“ bewahrt die hebräische Metapher für das Innere des Menschen.
- source_word: וּמֵישָׁרִים תִּרְצֶה
  choice: an Aufrichtigkeit Gefallen hast
  rationale: מֵישָׁרִים bezeichnet moralische Geradheit oder Aufrichtigkeit; רצה drückt hier Wohlgefallen aus. Die Formulierung ist natürlich und erhält Gottes positive Wertung dieser Haltung.
- source_word: בְּיֹשֶׁר לְבָבִי
  choice: mit aufrichtigem Herzen
  rationale: Die Wendung beschreibt die innere Haltung, in der David gibt. „Mit aufrichtigem Herzen“ gibt den Sinn idiomatisch wieder, ohne die Herzmetapher aufzugeben.
- source_word: הִתְנַדַּבְתִּי
  choice: habe ... freiwillig gegeben
  rationale: Der Hitpael von נדב bezeichnet freiwilliges, bereitwilliges Geben. „Gegeben“ passt zum Spendenkontext und vermeidet die im Deutschen mögliche Bedeutung von „sich freiwillig melden“.
- source_word: כָל אֵלֶּה
  choice: all dies
  rationale: Der Ausdruck verweist auf die zuvor genannten Gaben. „All dies“ ist im Deutschen knapp und natürlich.
- source_word: עַמְּךָ הַנִּמְצְאוּ פֹה
  choice: dein Volk, das hier versammelt ist
  rationale: נמצא kann wörtlich „gefunden werden“ und idiomatisch „anwesend sein“ bedeuten. „Hier versammelt“ entspricht der konkreten Szene und klingt im Deutschen natürlicher.
- source_word: רָאִיתִי בְשִׂמְחָה
  choice: habe ich mit Freude gesehen
  rationale: Die Präpositionalfügung beschreibt die Freude, mit der David das Geben des Volkes wahrnimmt; die deutsche Stellung bewahrt diesen Bezug.
- source_word: לְהִתְנַדֶּב לָךְ
  choice: dir freiwillig gibt
  rationale: Der Infinitiv desselben Verbs נדב wird zur lexikalischen Einheitlichkeit erneut mit „freiwillig geben“ wiedergegeben. Das Präsens stellt das von David gerade beobachtete Geschehen lebendig dar.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Direkte und im Deutschen übliche Wiedergabe der possessiven Anrede.
theological_decisions:
- issue: Anthropologische Bedeutung von לֵבָב
  choice: „Herz“ als Inneres des Menschen, einschließlich Wille und Absicht
  alternative: „Sinn“, „Inneres“ oder „Gesinnung“
  rationale: Das hebräische „Herz“ umfasst Denken, Wollen und Absicht. Die Beibehaltung von „Herz“ bewahrt das biblische Bild und reduziert den Begriff nicht auf Gefühl oder Verstand allein.
- issue: Gottes Wohlgefallen an מֵישָׁרִים
  choice: Gefallen an Aufrichtigkeit
  alternative: das Rechte anerkennen oder Geradheit lieben
  rationale: Die Übersetzung lässt offen, ob der Schwerpunkt stärker auf innerer Integrität oder rechtem Verhalten liegt, und vermeidet eine konfessionelle Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Formulierung „freiwillig geben“ bildet das wiederholte נדב ab; „mit aufrichtigem Herzen“ ist gegenüber einer streng formalen Wiedergabe idiomatischer.
