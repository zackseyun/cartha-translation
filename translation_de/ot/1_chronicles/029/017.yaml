  to: Und ich weiß, mein Gott, dass du das Herz prüfst und an Aufrichtigkeit Gefallen hast.[a] Ich habe mit aufrichtigem Herzen all dies freiwillig gegeben. Und nun habe ich mit Freude gesehen, wie dein Volk, das hier anwesend ist,[b] dir freiwillig gibt.
