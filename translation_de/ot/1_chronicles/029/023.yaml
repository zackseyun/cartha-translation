source:
  edition: WLC
  text: וַ/יֵּ֣שֶׁב שְׁ֠לֹמֹה עַל כִּסֵּ֨א יְהוָ֧ה לְ/מֶ֛לֶךְ תַּֽחַת דָּוִ֥יד אָבִ֖י/ו וַ/יַּצְלַ֑ח וַ/יִּשְׁמְע֥וּ אֵלָ֖י/ו כָּל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/023.yaml
  text: Then Solomon sat on the throne of Yahweh as king in place of David his father[a], and he prospered, and all Israel listened to him.
translation:
  language: de
  text: Dann saß Salomo als König auf dem Thron Jahwes anstelle seines Vaters David. Er hatte Erfolg, und ganz Israel hörte auf ihn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gehorchte ihm“. Der hebräische Ausdruck kann aufmerksames Hören bezeichnen, hat im Zusammenhang königlicher Autorität aber auch den Sinn, jemandem Folge zu leisten.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: saß
  rationale: Das Verb bezeichnet wörtlich das Sitzen; zusammen mit „auf dem Thron“ bringt die konkrete hebräische Ausdrucksweise zugleich die Thronbesteigung zum Ausdruck.
- source_word: כִּסֵּא יְהוָה
  choice: der Thron Jahwes
  rationale: Die Constructusverbindung wird formal bewahrt. Sie stellt Salomos Königtum als Herrschaft unter Gottes Oberhoheit dar, ohne diesen Gedanken erläuternd auszuweiten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְמֶלֶךְ
  choice: als König
  rationale: Die Präposition bezeichnet hier Amt und Funktion; „als König“ ist im Deutschen idiomatisch.
- source_word: תַּחַת דָּוִיד אָבִיו
  choice: anstelle seines Vaters David
  rationale: תַּחַת bezeichnet in diesem Zusammenhang die dynastische Nachfolge, also das Einnehmen von Davids Stelle.
- source_word: וַיַּצְלַח
  choice: er hatte Erfolg
  rationale: Die Hifil-Form von צלח bezeichnet erfolgreiches Vorankommen. Die Formulierung ist modern und lässt offen, worin sich der Erfolg konkret zeigte.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: hörte auf ihn
  rationale: שׁמע אל kann aufmerksames Hören und im Verhältnis zu einem Herrscher auch Gehorsam bezeichnen. Die deutsche Wendung „auf jemanden hören“ bewahrt das Bild des Hörens und vermittelt zugleich das Befolgen seiner Weisungen.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Die kollektive Bezeichnung für das gesamte Volk wird ohne Erweiterung wiedergegeben.
theological_decisions:
- issue: Bedeutung des Ausdrucks „Thron Jahwes“ für Salomos Königtum
  choice: Die Formulierung „Thron Jahwes“ wird unverändert beibehalten.
  alternative: Den Ausdruck als bloß politischen Thron Salomos wiederzugeben oder erklärend als einen Jahwe gehörenden Thron zu umschreiben.
  rationale: Der Chronist stellt das davidische Königtum bewusst als eine unter Jahwes Herrschaft ausgeübte Königsherrschaft dar. Die formale Wendung bewahrt diese Aussage, ohne sie durch eine bestimmte spätere Lehrbildung festzulegen.
- issue: Bedeutung von Israels Hören auf Salomo
  choice: „hörte auf ihn“ bewahrt sowohl das Hören als auch den in diesem Herrschaftskontext naheliegenden Gehorsam.
  alternative: „gehorchte ihm“ legt den politischen Gehorsam eindeutiger fest; „hörte ihm zu“ betont dagegen lediglich das aufmerksame Zuhören.
  rationale: Der hebräische Ausdruck kann je nach Kontext Hören, Beachten oder Gehorchen bedeuten. Die gewählte deutsche Wendung erhält diese Bedeutungsnähe, ohne den königlichen Autoritätsbezug zu verlieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Bildsprache bleibt erhalten, während Satzbau und Wortwahl für heutige Leser natürlich sind.
