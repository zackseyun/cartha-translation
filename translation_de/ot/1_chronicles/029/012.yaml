  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָ/עֹ֤שֶׁר וְ/הַ/כָּבוֹד֙ מִ/לְּ/פָנֶ֔י/ךָ וְ/אַתָּה֙ מוֹשֵׁ֣ל בַּ/כֹּ֔ל וּ/בְ/יָדְ/ךָ֖ כֹּ֣חַ וּ/גְבוּרָ֑ה וּ/בְ/יָ֣דְ/ךָ֔ לְ/גַדֵּ֥ל וּ/לְ/חַזֵּ֖ק לַ/כֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/012.yaml
  text: Both riches and honor come from before you[a], and you rule over all. In your hand are power and might[c][b], and in your hand it is to make great and to strengthen all.
translation:
  language: de
  text: Reichtum und Ehre[a] kommen aus deiner Gegenwart[b], und du herrschst über alles. In deiner Hand sind Kraft und Macht, und in deiner Hand liegt es, alle[d] groß zu machen[c] und zu stärken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ehre“ kann auch mit „Herrlichkeit“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von vor deinem Angesicht“; auch: „von dir“.'
    reason: lexical_alternative
  - marker: c
    text: „Groß zu machen“ kann hier auch „zu erhöhen“ bedeuten.
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „jeden“ beziehungsweise „alles“.'
    reason: ambiguity
lexical_decisions:
- source_word: הָעֹשֶׁר
  choice: Reichtum
  rationale: Das Substantiv bezeichnet materiellen Wohlstand. „Reichtum“ ist im Deutschen natürlich und passt zum gehobenen Gebetsstil.
- source_word: הַכָּבוֹד
  choice: Ehre
  rationale: Im Zusammenhang mit Reichtum und göttlicher Verleihung steht der soziale Rang beziehungsweise das Ansehen im Vordergrund; „Herrlichkeit“ bleibt eine mögliche Wiedergabe.
- source_word: מִלְּפָנֶיךָ
  choice: kommen aus deiner Gegenwart
  rationale: Die Wendung bedeutet wörtlich „von vor deinem Angesicht“. „Aus deiner Gegenwart“ bewahrt das hebräische Bild der göttlichen Gegenwart, ohne im modernen Deutsch unverständlich zu wirken.
- source_word: מוֹשֵׁל בַּכֹּל
  choice: du herrschst über alles
  rationale: Das Partizip beschreibt fortdauernde Herrschaft; die Formulierung ist prägnant und idiomatisch.
- source_word: בְיָדְךָ
  choice: in deiner Hand
  rationale: Die konkrete Metapher für Verfügungsgewalt und Kontrolle wird beibehalten.
- source_word: כֹּחַ
  choice: Kraft
  rationale: Das Wort bezeichnet Fähigkeit oder wirksame Stärke. „Kraft“ bildet mit „Macht“ ein natürliches, aber nicht völlig gleichbedeutendes Paar.
- source_word: גְבוּרָה
  choice: Macht
  rationale: Das Substantiv bezeichnet gewaltige Stärke oder Macht. „Macht“ unterscheidet sich ausreichend von כֹּחַ und passt zur Aussage göttlicher Herrschaft.
- source_word: לְגַדֵּל
  choice: groß zu machen
  rationale: Die Wiedergabe bleibt nah an der Grundbedeutung; im Kontext kann die Wendung auch „zu erhöhen“ bedeuten.
- source_word: לְחַזֵּק
  choice: zu stärken
  rationale: Dies ist die direkte und im Kontext natürliche Wiedergabe des Verbs.
- source_word: לַכֹּל
  choice: alle
  rationale: Die substantivische Wendung ist umfassend und lässt im Deutschen offen, ob alle Menschen oder alles Geschaffene gemeint ist.
theological_decisions:
- issue: Ursprung von Reichtum und Ehre in מִלְּפָנֶיךָ
  choice: kommen aus deiner Gegenwart
  alternative: kommen von dir; kommen von deinem Angesicht her
  rationale: Die Übersetzung wahrt das Bild, dass Reichtum und Ehre aus Gottes Gegenwart hervorgehen, ohne daraus eine weitergehende Lehrbestimmung abzuleiten.
- issue: Reichweite von לַכֹּל
  choice: alle
  alternative: jeden; alles
  rationale: Das Hebräische lässt den Bezug auf Personen oder einen umfassenderen Bereich offen. „Alle“ erhält diese Spannung weitgehend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung „in deiner Hand“ erhält den poetischen Parallelismus und die konkrete Metapher des Hebräischen.
