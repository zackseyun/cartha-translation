base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/001.yaml
  text: Then King David said to all the assembly, “Solomon my son, the one God has chosen, is young and inexperienced, and the work is great; for the palace is not for man, but for the LORD God.”
translation:
  language: de
  text: 'Dann sagte König David zur ganzen Versammlung: »Mein Sohn Salomo, derjenige, den Gott erwählt hat, ist jung und unerfahren, und das Werk ist groß; denn der Palast ist nicht für einen Menschen bestimmt, sondern für den HERRN, Gott.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶחָד
  choice: der eine
  rationale: Die appositionelle Stellung nach »mein Sohn Salomo« wird bewahrt; sie hebt Salomo als den von Gott erwählten Einzelnen hervor, ohne das Hebräische ausdrücklich zu »allein« zu verstärken.
- source_word: נַעַר וָרָךְ
  choice: jung und unerfahren
  rationale: »Jung« gibt נַעַר wieder; רַךְ bedeutet wörtlich »zart/schwach« und bezeichnet hier im Kontext der großen Aufgabe am natürlichsten mangelnde Erfahrung.
- source_word: הַמְּלָאכָה
  choice: das Werk
  rationale: Bezeichnet die anstehende große Bauaufgabe; »Werk« erhält den würdigen, umfassenden Sinn.
- source_word: הַבִּירָה
  choice: der Palast
  rationale: בִּירָה kann Palast, Burg oder Tempelanlage bezeichnen. »Palast« bewahrt Davids Bild eines königlichen Hauses für Gott.
- source_word: לַיהוָה אֱלֹהִים
  choice: für den HERRN, Gott
  rationale: Der Gottesname wird nach verbreiteter deutscher Bibelkonvention als »HERR« wiedergegeben; אֱלֹהִים steht appositionell dazu.
theological_decisions:
- issue: Träger der Erwählung Salomos
  choice: der eine, den Gott erwählt hat
  alternative: den allein Gott erwählt hat / den Gott erwählt hat
  rationale: Die Formulierung lässt אֶחָד Salomo bestimmen und vermeidet zugleich die mögliche Fehlauffassung, nur Gott und kein anderer habe gewählt.
- issue: Bestimmung des Heiligtums
  choice: nicht für einen Menschen bestimmt, sondern für den HERRN, Gott
  alternative: nicht für Menschen, sondern für den HERRN, Gott
  rationale: Der hebräische Singular אָדָם wird gewahrt; die Aussage kontrastiert den menschlichen Bewohner mit Gott, ohne weitergehende Tempeltheologie einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und feierlich; traditionelle Schlüsselbegriffe wie »Werk« und »HERR« werden beibehalten, während »unerfahren« die kontextuelle Bedeutung von רַךְ verständlich ausdrückt.
