- from: 'Dann sagte König David zur ganzen Versammlung: »Mein Sohn Salomo, der eine, den Gott erwählt hat, ist jung und unerfahren, und das Werk ist groß; denn der Palast ist nicht für einen Menschen bestimmt, sondern für den HERRN, Gott.«'
  to: 'Dann sagte König David zur ganzen Versammlung: »Mein Sohn Salomo, derjenige, den Gott erwählt hat, ist jung und unerfahren, und das Werk ist groß; denn der Palast ist nicht für einen Menschen bestimmt, sondern für den HERRN, Gott.«'
  rationale: Eine eng begrenzte stilistische Korrektur ersetzt die unidiomatische Apposition „der eine“ durch „derjenige“. Dadurch bleiben die Erwählung Salomos und die durch אֶחָד markierte Bezugnahme erhalten, ohne zu behaupten, Gott habe ausschließlich Salomo erwählt oder Salomo sei Davids einziger Sohn.
