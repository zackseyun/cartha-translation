reference: 1 Chronicles 29:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׂמְח֤וּ הָ/עָם֙ עַל הִֽתְנַדְּבָ֔/ם כִּ֚י בְּ/לֵ֣ב שָׁלֵ֔ם הִֽתְנַדְּב֖וּ לַ/יהוָ֑ה וְ/גַם֙ דָּוִ֣יד הַ/מֶּ֔לֶךְ שָׂמַ֖ח שִׂמְחָ֥ה גְדוֹלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/009.yaml
  text: Then the people rejoiced because they had offered willingly[a], for with a whole heart they had offered willingly to Yahweh[b]; and David the king also rejoiced with great joy.
translation:
  language: de
  text: Da freute sich das Volk darüber, dass sie freiwillig gegeben hatten[a]; denn mit ungeteiltem Herzen[b] hatten sie Jahwe freiwillig gegeben. Auch König David freute sich mit großer Freude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über ihre freiwillige Gabe“. Die hebräische Wortwurzel hebt hervor, dass das Geben aus freiem Willen geschah.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit ganzem Herzen“; gemeint ist eine aufrichtige, ungeteilte Bereitschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ הָעָם
  choice: Da freute sich das Volk
  rationale: Das narrative וַ wird mit „Da“ wiedergegeben; das kollektive Subjekt „Volk“ steht im Deutschen idiomatisch im Singular.
- source_word: עַל הִתְנַדְּבָם
  choice: darüber, dass sie freiwillig gegeben hatten
  rationale: Die Konstruktion bezeichnet den Anlass der Freude. Der Hitpael-Stamm von נדב betont die freiwillige Bereitschaft zum Geben.
- source_word: בְּלֵב שָׁלֵם
  choice: mit ungeteiltem Herzen
  rationale: Die konkrete Herz-Metapher bleibt erhalten; „ungeteilt“ vermittelt hier Ganzheit, Aufrichtigkeit und vorbehaltlose Hingabe natürlicher als das missverständliche „mit vollkommenem Herzen“.
- source_word: הִתְנַדְּבוּ
  choice: hatten sie ... freiwillig gegeben
  rationale: Die wiederholte Wurzel נדב wird entsprechend auch im Deutschen wiederholt; der Kontext nennt materielle Beiträge für den Tempel.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: וְגַם דָּוִיד הַמֶּלֶךְ
  choice: Auch König David
  rationale: „Auch“ bewahrt den additiven Nachdruck von וְגַם; „König David“ ist die natürliche deutsche Wortstellung.
- source_word: שָׂמַח שִׂמְחָה גְדוֹלָה
  choice: freute sich mit großer Freude
  rationale: Die Formulierung bewahrt die emphatische Verbindung von Verb und stammverwandtem Substantiv, ohne sie zu einem bloßen Gradadverb einzuebnen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Transliteration wahrt dessen Eigenname-Charakter, ohne durch eine Ersatzbezeichnung eine zusätzliche Deutung einzutragen.
- issue: Bedeutung von לֵב שָׁלֵם
  choice: mit ungeteiltem Herzen
  alternative: mit ganzem Herzen
  rationale: „Ungeteilt“ bringt die im Kontext gemeinte aufrichtige und vorbehaltlose Hingabe zum Ausdruck, ohne moralische Fehlerlosigkeit zu behaupten; die Fußnote hält die wörtlichere Möglichkeit offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Aussage des freiwilligen Gebens und die verstärkende Wortwiederholung in der abschließenden Freude Davids bleiben sichtbar. Das Plusquamperfekt ordnet die Gabe als Anlass der anschließenden Freude ein.
