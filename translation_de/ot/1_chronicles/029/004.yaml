  text: שְׁלֹ֧שֶׁת אֲלָפִ֛ים כִּכְּרֵ֥י זָהָ֖ב מִ/זְּהַ֣ב אוֹפִ֑יר וְ/שִׁבְעַ֨ת אֲלָפִ֤ים כִּכַּר כֶּ֨סֶף֙ מְזֻקָּ֔ק לָ/ט֖וּחַ קִיר֥וֹת הַ/בָּתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/004.yaml
  text: three thousand talents of gold[a], from the gold of Ophir, and seven thousand talents of refined silver, to overlay the walls of the buildings[b],
translation:
  language: de
  text: dreitausend Talente[b] Gold aus Ofir[a] und siebentausend Talente geläutertes Silber, um die Wände der Gebäude zu überziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ofirgold“. Die hebräische Formulierung kann die Herkunft des Goldes angeben oder „Ofirgold“ als besondere Art beziehungsweise Qualität bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Ein Talent ist hier eine antike Gewichtseinheit, keine Begabung.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: dreitausend
  rationale: Die hebräische Kardinalzahl wird direkt und im Deutschen orthografisch als zusammengeschriebenes Zahlwort wiedergegeben.
- source_word: כִּכְּרֵי / כִּכַּר
  choice: Talente
  rationale: כִּכָּר bezeichnet hier eine große antike Gewichtseinheit. „Talente“ ist die etablierte historische Wiedergabe und vermeidet eine ungesicherte Umrechnung.
- source_word: זָהָב
  choice: Gold
  rationale: Direkte Bezeichnung des Edelmetalls.
- source_word: מִזְּהַב אוֹפִיר
  choice: vom Gold aus Ofir
  rationale: Die Präposition מִן wird mit „von“ bewahrt; „aus Ofir“ bezeichnet natürlich die Herkunft des Goldes, ohne die mögliche attributive Lesart zu verschweigen.
- source_word: וְשִׁבְעַת אֲלָפִים
  choice: und siebentausend
  rationale: Die Zahlformulierung wird unmittelbar und idiomatisch wiedergegeben.
- source_word: כֶּסֶף
  choice: Silber
  rationale: Im Zusammenhang mit Baumaterial bezeichnet das Wort das Edelmetall, nicht Geld.
- source_word: מְזֻקָּק
  choice: geläutertes
  rationale: Das passive Partizip bezeichnet durch Läuterung gereinigtes Metall; „geläutert“ ist im Deutschen präzise und für Edelmetalle geläufig.
- source_word: לָטוּחַ
  choice: zu überziehen
  rationale: Bei der Anbringung von Edelmetall auf Wänden gibt „überziehen“ den Zweck sachgerecht wieder; „verputzen“ würde irreführend an Mörtel denken lassen.
- source_word: קִירוֹת
  choice: die Wände
  rationale: Direkte und natürliche Wiedergabe des Plurals.
- source_word: הַבָּתִּים
  choice: der Gebäude
  rationale: Wörtlich steht „der Häuser“. Im Tempelbaukontext bezeichnet der Plural bauliche Einheiten; „Gebäude“ ist verständlich und lässt deren genaue Art offen.
