source:
  edition: WLC
  text: וַ/יְבָ֤רֶךְ דָּוִיד֙ אֶת יְהוָ֔ה לְ/עֵינֵ֖י כָּל הַ/קָּהָ֑ל וַ/יֹּ֣אמֶר דָּוִ֗יד בָּר֨וּךְ אַתָּ֤ה יְהוָה֙ אֱלֹהֵי֙ יִשְׂרָאֵ֣ל אָבִ֔י/נוּ מֵ/עוֹלָ֖ם וְ/עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/010.yaml
  text: Then David blessed Yahweh in the sight of all the assembly[a], and David said, “Blessed are you, Yahweh, the God of Israel our father, from everlasting to everlasting.”
translation:
  language: de
  text: 'Da pries David Jahwe vor den Augen der ganzen Versammlung. David sagte: »Gepriesen seist du, Jahwe, du Gott unseres Vaters Israel[a], von Ewigkeit zu Ewigkeit!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jahwe, Gott Israels, unser Vater«, wenn »unser Vater« als direkte Anrede Gottes verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: pries
  rationale: Das Piel von ברך mit Gott als Objekt bezeichnet hier das preisende Segnen Gottes. »pries« ist im heutigen Deutsch natürlich; die Verbindung zum anschließenden בָּרוּךְ bleibt durch »Gepriesen« erkennbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die Wendung bewahrt das bildhafte und öffentliche Moment des hebräischen Ausdrucks.
- source_word: כָּל הַקָּהָל
  choice: die ganze Versammlung
  rationale: קָהָל bezeichnet die vollständig versammelte Gemeinschaft; »Versammlung« ist klar und dem feierlichen Rahmen angemessen.
- source_word: בָּרוּךְ אַתָּה
  choice: Gepriesen seist du
  rationale: Diese natürliche deutsche Lobpreisformel bewahrt die direkte Anrede und den doxologischen Ton.
- source_word: אֱלֹהֵי יִשְׂרָאֵל אָבִינוּ
  choice: du Gott unseres Vaters Israel
  rationale: Die Wiedergabe versteht אָבִינוּ als Apposition zu Israel, also Jakob, und macht diesen syntaktischen Bezug im Deutschen klar.
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: von Ewigkeit zu Ewigkeit
  rationale: Die etablierte deutsche Wendung gibt die unbegrenzte Dauer in gehobenem, liturgischem Register wieder.
theological_decisions:
- issue: Bezugswort von אָבִינוּ („unser Vater“)
  choice: 'Bezug auf Israel/Jakob: „unseres Vaters Israel“'
  alternative: 'Direkte Anrede Gottes: „Gott Israels, unser Vater“'
  rationale: Die Stellung lässt אָבִינוּ am ehesten als Apposition zu Israel verstehen. Die Hauptfassung verdeutlicht diese Lesart, ohne die grammatisch mögliche direkte Anrede Gottes zur Grundlage des Textes zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Gebetston. Die Wiederholung von »David« folgt dem Hebräischen. »pries« vermeidet das im Deutschen missverständliche »segnete Gott«, während »Gepriesen seist du« den lexikalischen Zusammenhang innerhalb des Verses wahrt.
