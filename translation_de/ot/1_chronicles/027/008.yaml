base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/008.yaml
  text: The fifth[a], for the fifth month, was the commander Shamhuth the Izrahite; and over his division were twenty-four thousand.
translation:
  language: de
  text: Der fünfte, für den fünften Monat, war der Befehlshaber Schamhut, der Jisrachiter[a]. Seine Abteilung umfasste 24.000 Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Serachiter“. Die hebräische Herkunftsbezeichnung wird in manchen Übersetzungen traditionell so wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: Der fünfte
  rationale: Das substantivisch gebrauchte Ordinal bezeichnet in der fortlaufenden Liste den fünften Heeresverband beziehungsweise dessen Monatsdienst; im Deutschen kann das Bezugswort wie im Hebräischen unausgesprochen bleiben.
- source_word: לַחֹדֶשׁ הַחֲמִישִׁי
  choice: für den fünften Monat
  rationale: Die Präposition ל bezeichnet hier die Zuweisung des Verbandes zum jeweiligen Dienstmonat.
- source_word: הַשַּׂר
  choice: der Befehlshaber
  rationale: שַׂר bezeichnet einen führenden Amtsträger; im militärischen Zusammenhang der Liste ist „Befehlshaber“ präzise und gegenwärtig verständlich.
- source_word: שַׁמְהוּת
  choice: Schamhut
  rationale: Der Personenname wird gemäß der hebräischen Vokalisierung in üblicher deutscher Umschrift wiedergegeben.
- source_word: הַיִּזְרָח
  choice: der Jisrachiter
  rationale: Die Bezeichnung wird formnah nach dem masoretischen Text transliteriert; die mögliche beziehungsweise traditionell angenommene Zuordnung zu Serach wird in einer Fußnote offengehalten.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Seine Abteilung umfasste
  rationale: מַחֲלֻקָה bezeichnet hier den militärischen Verband. Die hebräische Konstruktion mit עַל ist elliptisch; die deutsche Formulierung gibt den administrativen Sinn natürlich wieder.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24.000 Mann
  rationale: Die Zahl wird in heutiger deutscher Schreibweise wiedergegeben; „Mann“ verdeutlicht den im militärischen Kontext implizierten Zählgegenstand.
