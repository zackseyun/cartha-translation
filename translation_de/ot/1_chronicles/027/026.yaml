  text: וְ/עַ֗ל עֹשֵׂי֙ מְלֶ֣אכֶת הַ/שָּׂדֶ֔ה לַ/עֲבֹדַ֖ת הָ/אֲדָמָ֑ה עֶזְרִ֖י בֶּן כְּלֽוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/026.yaml
  text: And over those who did the work of the field for the cultivation of the ground was Ezri son of Chelub[a][b].
translation:
  language: de
  text: Für die Feldarbeiter[a], die den Ackerboden bestellten[b], war Esri, der Sohn Kelubs, zuständig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „diejenigen, die die Arbeit des Feldes verrichteten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zur Bearbeitung des Erdbodens“. Die Wendung bezeichnet die landwirtschaftliche Bodenbearbeitung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: war … zuständig
  rationale: עַל bezeichnet in dieser Verwaltungsliste die Aufsicht oder Zuständigkeit für einen Arbeitsbereich. Die deutsche Satzkonstruktion gibt diesen Sinn natürlich wieder; die verbindende Funktion von וְ ergibt sich aus dem fortlaufenden Listenstil.
- source_word: עֹשֵׂי מְלֶאכֶת הַשָּׂדֶה
  choice: die Feldarbeiter
  rationale: Die partizipiale Wendung bezeichnet die Personen, die die Feldarbeit verrichteten. „Feldarbeiter“ ist eine knappe, natürliche Wiedergabe, ohne ihre konkrete Tätigkeit enger festzulegen.
- source_word: לַעֲבֹדַת הָאֲדָמָה
  choice: die den Ackerboden bestellten
  rationale: עֲבֹדָה bezeichnet hier zusammen mit אֲדָמָה die landwirtschaftliche Bearbeitung des Bodens. „Ackerboden bestellen“ drückt diesen Sinn im modernen Deutschen klar aus.
- source_word: עֶזְרִי בֶּן כְּלוּב
  choice: Esri, der Sohn Kelubs
  rationale: Die Personennamen werden in deutscher Transliteration als „Esri“ und „Kelub“ wiedergegeben. בֶּן wird entsprechend der üblichen genealogischen Formulierung mit „der Sohn“ übersetzt.
