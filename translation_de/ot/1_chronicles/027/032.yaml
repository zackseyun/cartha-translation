  text: וִֽ/יהוֹנָתָ֤ן דּוֹד דָּוִיד֙ יוֹעֵ֔ץ אִישׁ מֵבִ֥ין וְ/סוֹפֵ֖ר ה֑וּא וִֽ/יחִיאֵ֥ל בֶּן חַכְמוֹנִ֖י עִם בְּנֵ֥י הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/032.yaml
  text: Jonathan[a], David’s uncle, was a counselor, a man of understanding, and a scribe[b]; and Jehiel son of Hachmoni was with the king’s sons.
translation:
  language: de
  text: Jonatan, Davids Onkel[a], war Ratgeber, ein verständiger Mann und Schreiber[b]. Jehiël, der Sohn Hachmonis, war bei den Söhnen des Königs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann je nach Zusammenhang auch einen anderen nahen Verwandten oder Vertrauten bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Sekretär; gemeint sein kann ein schriftkundiger Hofbeamter.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: war mit den Söhnen des Königs. Möglicherweise ist damit ein Dienst oder eine Aufsicht bei ihnen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד
  choice: Onkel
  rationale: Im Zusammenhang mit dem ausdrücklich genannten David bezeichnet das Wort am ehesten ein Verwandtschaftsverhältnis. „Onkel“ ist hier die naheliegende Bedeutung, auch wenn das hebräische Wort je nach Kontext weitere Beziehungsausdrücke zulässt.
- source_word: יוֹעֵץ
  choice: Ratgeber
  rationale: Das Partizip bezeichnet jemanden, der Rat erteilt, hier wahrscheinlich in einer Funktion am Königshof. „Ratgeber“ ist natürlich und legt keinen genaueren Amtstitel fest.
- source_word: אִישׁ מֵבִין
  choice: ein verständiger Mann
  rationale: Die Wendung hebt Jonatans Einsicht und Urteilsvermögen hervor und bewahrt zugleich die konkrete Formulierung des Hebräischen.
- source_word: סוֹפֵר
  choice: Schreiber
  rationale: Das Wort kann einen schriftkundigen Beamten oder Sekretär bezeichnen. „Schreiber“ bewahrt die Breite des Ausdrucks, ohne die spätere religiöse Bedeutung von „Schriftgelehrter“ einzutragen.
- source_word: עִם
  choice: war bei
  rationale: Die Präposition bedeutet wörtlich „mit/bei“. Der Zusammenhang kann eine betreuende oder beaufsichtigende Aufgabe nahelegen, nennt sie aber nicht ausdrücklich.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: den Söhnen des Königs
  rationale: Dies entspricht der ausdrücklichen hebräischen Formulierung. „Königssöhne“ oder „Prinzen“ wären kontextuell möglich, aber weniger unmittelbar.
- source_word: חַכְמוֹנִי
  choice: Hachmoni
  rationale: Der Personenname wird in einer im Deutschen verständlichen, quellenahen Form wiedergegeben.
