id: 1CH.27.20
reference: 1 Chronicles 27:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לִ/בְנֵ֣י אֶפְרַ֔יִם הוֹשֵׁ֖עַ בֶּן עֲזַזְיָ֑הוּ לַ/חֲצִי֙ שֵׁ֣בֶט מְנַשֶּׁ֔ה יוֹאֵ֖ל בֶּן פְּדָיָֽהוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/020.yaml
  text: 'For the sons of Ephraim: Hoshea son of Azaziah[a]; for the half-tribe of Manasseh: Joel son of Pedaiah.'
translation:
  language: de
  text: 'Für die Nachkommen Ephraims: Hoschea, der Sohn Asasjas; für den halben Stamm Manasse: Joël, der Sohn Pedajas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי
  choice: Für die Nachkommen
  rationale: Die Präposition ל bezeichnet in dieser Verwaltungsliste die Zuordnung zu einer Stammesgruppe. בְּנֵי bedeutet wörtlich »Söhne«, bezeichnet hier jedoch die Angehörigen beziehungsweise Nachkommen Ephraims; »Nachkommen« ist im modernen Deutschen natürlich und sachlich präzise.
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Eingebürgerte deutsche Form des Stammesnamens.
- source_word: הוֹשֵׁעַ
  choice: Hoschea
  rationale: Die Form gibt den hebräischen Personennamen im Deutschen lautnah wieder und unterscheidet ihn nicht künstlich von seiner bekannten Namensform.
- source_word: בֶּן
  choice: der Sohn
  rationale: Übliche deutsche Wiedergabe der genealogischen Verknüpfung; mit Artikel entsteht in der Aufzählung ein natürlicher deutscher Satzbau.
- source_word: עֲזַזְיָהוּ
  choice: Asasja
  rationale: Lautnahe, in deutschen Bibeln gebräuchliche Form des hebräischen Personennamens.
- source_word: לַחֲצִי שֵׁבֶט
  choice: für den halben Stamm
  rationale: ל bezeichnet erneut die Zuständigkeit; חֲצִי שֵׁבֶט wird im Deutschen idiomatisch als »der halbe Stamm« wiedergegeben.
- source_word: מְנַשֶּׁה
  choice: Manasse
  rationale: Eingebürgerte deutsche Form des Stammesnamens.
- source_word: יוֹאֵל
  choice: Joël
  rationale: Die Trema-Schreibung macht kenntlich, dass die Vokale getrennt gesprochen werden, und entspricht einer etablierten deutschen Namensform.
- source_word: פְּדָיָהוּ
  choice: Pedaja
  rationale: Lautnahe, in deutschen Bibeln gebräuchliche Form des hebräischen Personennamens.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Listendeutsch mit parallelem Satzbau. Die im Hebräischen elliptisch vorausgesetzte Leitungsfunktion wird nicht ergänzt; dadurch bleibt die Form der Verwaltungsliste erhalten. Keine Fußnote ist nötig, da »Hoschea« im Deutschen die reguläre Namensform ist und die englische Schreibvariante für die deutsche Ausgabe keine relevante Alternative darstellt.
