  naturalness: Das knappe, parallele Listendeutsch ist im modernen Standarddeutsch natürlich und gut lesbar. Die Formulierung „der halbe Stamm Manasse“ ist verständlich und gibt die im Hebräischen gemeinte Stammeshälfte angemessen wieder.
