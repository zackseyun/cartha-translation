base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/011.yaml
  text: 'The eighth[a], for the eighth month: Sibbecai the Hushathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: de
  text: Der Achte, für den achten Monat, war Sibbechai, der Huschathiter, von den Serachitern[a]; seine Abteilung umfasste 24.000 Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „für den Serachiter“. Die hebräische Form ist ein Gentiliz im Singular, bezeichnet hier aber wahrscheinlich die Zugehörigkeit zur Sippe der Serachiter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: Der Achte
  rationale: Die Ordnungszahl steht in der militärischen Dienstliste elliptisch für den achten Befehlshaber beziehungsweise die achte Monatseinheit. Die knappe Form bewahrt diese Ellipse.
- source_word: לַחֹדֶשׁ הַשְּׁמִינִי
  choice: für den achten Monat
  rationale: Das Präfix ל bezeichnet hier die Zuweisung zum betreffenden Dienstmonat.
- source_word: סִבְּכַי
  choice: Sibbechai
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenkonvention wiedergegeben.
- source_word: הַחֻשָׁתִי
  choice: der Huschathiter
  rationale: Das Gentiliz bezeichnet Sibbechai nach Herkunft oder Zugehörigkeit; „Huschathiter“ bildet die hebräische Form präzise und in deutscher Lautung ab.
- source_word: לַזַּרְחִי
  choice: von den Serachitern
  rationale: Das mit ל gebildete Gentiliz bezeichnet im Zusammenhang wahrscheinlich die Zugehörigkeit zur Sippe der Serachiter. Die Mehrzahl macht diese Sippenzugehörigkeit im Deutschen verständlich.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: seine Abteilung umfasste
  rationale: Wörtlich steht „und über seiner Abteilung“; in der Listenform leitet dies die Truppenstärke unter seinem Befehl ein. Die gewählte Form ist natürliches modernes Deutsch.
- source_word: מַחֲלֻקְתּוֹ
  choice: Abteilung
  rationale: מַחֲלֻקָה bezeichnet hier eine organisierte militärische Einheit beziehungsweise Dienstgruppe.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24.000 Mann
  rationale: Die Zahl lautet eindeutig vierundzwanzigtausend. „Mann“ wird zur natürlichen Bezeichnung der Truppenstärke ergänzt, ohne eine zusätzliche Einheit einzuführen.
