base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/009.yaml
  text: 'The sixth, for the sixth month: Ira son of Ikkesh the Tekoite; and over his division were twenty-four thousand.'
translation:
  language: de
  text: 'Der sechste, für den sechsten Monat: Ira, der Sohn Ikkeschs, aus Tekoa; zu seiner Abteilung gehörten 24.000 Mann.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: Der sechste
  rationale: Das substantivisch gebrauchte Ordnungszahlwort steht in der Listenformel elliptisch; die aus dem Kontext erschließbare Bezeichnung »Befehlshaber« oder »Abteilung« wird nicht ausdrücklich ergänzt.
- source_word: לַחֹדֶשׁ הַשִּׁשִּׁי
  choice: für den sechsten Monat
  rationale: Die Präposition ל bezeichnet hier im administrativen Zusammenhang die Zuweisung zum monatlichen Dienstturnus.
- source_word: עִירָא בֶן עִקֵּשׁ
  choice: Ira, der Sohn Ikkeschs
  rationale: Die Personennamen werden in geläufiger deutscher Transliteration wiedergegeben; die Abstammungsangabe wird natürlich formuliert.
- source_word: הַתְּקוֹעִי
  choice: aus Tekoa
  rationale: Das Herkunftsadjektiv bezeichnet einen Mann aus Tekoa; die Umschreibung ist im heutigen Deutsch verständlicher als »der Tekoiter«.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: zu seiner Abteilung gehörten
  rationale: מַחֲלֻקָה bezeichnet in diesem Kapitel eine militärische, turnusmäßig eingesetzte Abteilung. Die deutsche Formulierung gibt idiomatisch an, wie viele Männer unter seiner Leitung standen.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24.000 Mann
  rationale: Die Zahl wird in moderner deutscher Schreibweise wiedergegeben; »Mann« verdeutlicht die im militärischen Kontext implizite Zähleinheit.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Listenform des Hebräischen bleibt erhalten; nur die implizite Zähleinheit »Mann« wird zur natürlichen Verständlichkeit ergänzt.
