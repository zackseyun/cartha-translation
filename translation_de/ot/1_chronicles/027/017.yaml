  text: for Levi[a], Hashabiah son of Kemuel; for Aaron, Zadok.
translation:
  language: de
  text: 'Für Levi: Haschabja, Sohn Kemuëls; für Aaron[a]: Zadok.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Aaron“ ist hier wahrscheinlich Aarons priesterliche Nachkommenschaft gemeint.
    reason: Kulturgeschichtliche Erläuterung der Verwendung eines Stammvaters als Bezeichnung seiner Nachkommen.
lexical_decisions:
- source_word: לְ/לֵוִי
  choice: für Levi
  rationale: Die Präposition לְ kennzeichnet in dieser Verwaltungsliste die Gruppe, der die genannte Person zugeordnet bzw. über die sie eingesetzt ist. „Für Levi“ wahrt die knappe Form mit dem Stammvater als Gruppenbezeichnung.
- source_word: חֲשַׁבְיָה
  choice: Haschabja
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, am Hebräischen orientierten Form wiedergegeben.
- source_word: בֶן קְמוּאֵל
  choice: der Sohn Kemuëls
  rationale: Die hebräische Abstammungsformel wird natürlich und eindeutig ins Deutsche übertragen.
- source_word: לְ/אַהֲרֹן
  choice: für Aaron
  rationale: Die parallele Konstruktion zu „für Levi“ bleibt erhalten. Der hebräische Text nennt den Stammvater Aaron und bezeichnet damit wahrscheinlich dessen priesterliches Haus.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert.
theological_decisions:
- issue: Ob ausdrücklich ergänzt werden soll, dass „Aaron“ das aaronitische Priesterhaus bezeichnet
  choice: Den Namen „Aaron“ im Haupttext unverändert als Gruppenbezeichnung beibehalten
  alternative: „für das Haus Aaron“ oder „für die Aaroniter“
  rationale: Der hebräische Wortlaut lautet knapp „für Aaron“. Die wahrscheinliche metonymische Bedeutung wird in einer Fußnote erläutert, ohne sie im Haupttext festzuschreiben.
translation_notes:
  register: Knapper, würdevoller Listenstil in modernem Standarddeutsch. Doppelpunkte verdeutlichen die Zuordnung der Verantwortlichen zu den jeweiligen Gruppen; das Semikolon bewahrt die Parallelstruktur des hebräischen Verses.
