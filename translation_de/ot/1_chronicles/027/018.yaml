lexical_decisions:
- source_word: לִיהוּדָה
  choice: Für Juda
  rationale: Das präfigierte לְ kennzeichnet in dieser Verwaltungsliste die Stammeszuordnung. „Für Juda“ bewahrt die knappe Listenstruktur.
- source_word: אֱלִיהוּ
  choice: Elihu
  rationale: Der masoretische Text liest eindeutig אֱלִיהוּ; der Name wird nach üblicher deutscher Form als „Elihu“ wiedergegeben.
- source_word: מֵאֲחֵי דָוִיד
  choice: einer von Davids Brüdern
  rationale: 'מִן vor dem Plural in der Constructusverbindung ist partitiv: Elihu gehörte zu Davids Brüdern.'
- source_word: לְיִשָּׂשכָר
  choice: für Issachar
  rationale: Wie bei Juda führt לְ den betreffenden Stamm innerhalb der Liste ein.
- source_word: עָמְרִי
  choice: Omri
  rationale: Der Eigenname wird in seiner geläufigen deutschen biblischen Form wiedergegeben.
- source_word: בֶּן מִיכָאֵל
  choice: der Sohn Michaels
  rationale: Die hebräische Patronymkonstruktion wird idiomatisch und eindeutig ins Deutsche übertragen.
