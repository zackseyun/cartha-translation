base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/016.yaml
  text: 'And over the tribes of Israel: for the Reubenites[a], Eliezer son of Zichri was leader; for the Simeonites, Shephatiah son of Maacah.'
translation:
  language: de
  text: 'Über die Stämme Israels: Für die Rubeniter war Eliëser, der Sohn Sichris, Oberster; für die Simeoniter Schefatja, der Sohn Maachas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: Über … waren eingesetzt
  rationale: Die Präposition bezeichnet hier die Zuständigkeit für die Stämme. Die ergänzte Verbform macht den elliptischen Listenstil im Deutschen verständlich, ohne eine zusätzliche Amtsfunktion festzulegen.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: die Stämme Israels
  rationale: Die hebräische Status-constructus-Verbindung wird direkt und idiomatisch wiedergegeben.
- source_word: לָרְאוּבֵנִי
  choice: für die Rubeniter
  rationale: Die Gentilform bezeichnet die Angehörigen des Stammes Ruben, nicht den Stammvater persönlich.
- source_word: נָגִיד
  choice: Oberster
  rationale: Das Wort bezeichnet einen Menschen in leitender Stellung. »Oberster« passt zum administrativen Zusammenhang und vermeidet die königlichen Nebenbedeutungen von »Fürst«.
- source_word: אֱלִיעֶזֶר בֶּן זִכְרִי
  choice: Eliëser, der Sohn Sichris
  rationale: Die Namen folgen gebräuchlichen deutschen Bibelformen; die Abstammungsangabe wird transparent wiedergegeben.
- source_word: לַשִּׁמְעוֹנִי
  choice: für die Simeoniter
  rationale: Die Gentilform verweist parallel zu den Rubenitern auf die Stammesangehörigen.
- source_word: שְׁפַטְיָהוּ בֶּן מַעֲכָה
  choice: Schefatja, der Sohn Maachas
  rationale: Die Personennamen werden in einer gebräuchlichen deutschen Transliteration wiedergegeben. Das grammatisch männliche בֶּן bezeichnet Schefatja als Sohn Maachas, ohne das Geschlecht der Person Maacha ausdrücklich zu bestimmen.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Listenstil. Das im Hebräischen fehlende Prädikat wird durch »waren eingesetzt« ergänzt, damit die Zuständigkeitsstruktur auf Deutsch klar wird; der Doppelpunkt bewahrt den katalogartigen Charakter.
