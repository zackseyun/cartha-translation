base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/006.yaml
  text: This was Benaiah[a], a mighty man of the Thirty and over the Thirty; and his division was under Ammizabad his son.
translation:
  language: de
  text: Das war Benaja, ein Held der Dreißig; er stand über den Dreißig. Seine Abteilung stand unter seinem Sohn Ammisabad.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Und seine Abteilung: Ammisabad, sein Sohn.« Das Hebräische enthält kein ausdrückliches Verb; die Zuordnung Ammisabads zur Abteilung wird aus dem Zusammenhang erschlossen.'
    reason: Die deutsche Formulierung ergänzt die im elliptischen hebräischen Nominalsatz nur implizierte Zuständigkeit.
lexical_decisions:
- source_word: הוּא בְנָיָהוּ
  choice: Das war Benaja
  rationale: Die Wendung greift den im Zusammenhang genannten Befehlshaber auf. „Das war Benaja“ gibt diese rückbezügliche, leicht hervorhebende Funktion in natürlichem Deutsch wieder.
- source_word: גִּבּוֹר הַשְּׁלֹשִׁים
  choice: ein Held unter den Dreißig
  rationale: גִּבּוֹר bezeichnet hier einen ausgezeichneten, kampferprobten Mann. „Held“ ist knapp und würdig; „unter den Dreißig“ kennzeichnet seine Zugehörigkeit zu der bekannten Elitegruppe.
- source_word: וְעַל הַשְּׁלֹשִׁים
  choice: und über die Dreißig gesetzt
  rationale: עַל bezeichnet in diesem Zusammenhang eine übergeordnete Stellung oder Befehlsgewalt. Die Formulierung wahrt dies, ohne einen im Hebräischen nicht ausdrücklich genannten militärischen Rang einzuführen.
- source_word: מַחֲלֻקְתּוֹ
  choice: seine Abteilung
  rationale: Im Zusammenhang von 1. Chronik 27 bezeichnet das Wort eine der turnusmäßig eingeteilten militärischen Abteilungen.
- source_word: עַמִּיזָבָד בְּנוֹ
  choice: führte sein Sohn Ammisabad
  rationale: Der hebräische Nominalsatz nennt Ammisabad, Benajas Sohn, in Verbindung mit dessen Abteilung. Das ergänzte Verb „führte“ macht den im Kontext naheliegenden Verwaltungssinn im Deutschen verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bezeichnung „die Dreißig“ bleibt als Name der bekannten Elitegruppe erhalten. Die Spannung, dass Benaja zu den Dreißig gehört und zugleich über ihnen steht, wird nicht geglättet.
