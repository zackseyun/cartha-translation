- from: Das war Benaja, ein Held unter den Dreißig und über die Dreißig gesetzt. Seine Abteilung führte sein Sohn Ammisabad.[a]
  to: Das war Benaja, ein Held der Dreißig; er stand über den Dreißig. Seine Abteilung stand unter seinem Sohn Ammisabad.[a]
