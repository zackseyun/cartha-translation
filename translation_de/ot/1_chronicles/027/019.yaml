base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/019.yaml
  text: for Zebulun, Ishmaiah son of Obadiah; for Naphtali, Jerimoth son of Azriel.
translation:
  language: de
  text: 'für Sebulon: Jischmaja, der Sohn Obadjas; für Naftali: Jerimot, der Sohn Asriëls.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִזְבוּלֻן
  choice: für Sebulon
  rationale: Die Präposition ל bezeichnet in dieser Liste die Zuordnung des Amtsträgers zum jeweiligen Stamm. „Für Sebulon“ gibt dies knapp und natürlich wieder.
- source_word: יִשְׁמַעְיָהוּ
  choice: Jischmaja
  rationale: Der Personenname wird in einer im Deutschen üblichen bibelnahen Form wiedergegeben.
- source_word: בֶּן
  choice: der Sohn
  rationale: בן bezeichnet hier die direkte Abstammung und dient zugleich zur Identifizierung der genannten Person.
- source_word: עֹבַדְיָהוּ
  choice: Obadja
  rationale: Verwendet wird die geläufige deutsche Form des biblischen Personennamens.
- source_word: לְנַפְתָּלִי
  choice: für Naftali
  rationale: Wie zuvor markiert ל die Zuordnung beziehungsweise Vertretung des Stammes in der Amtsträgerliste.
- source_word: יְרִימוֹת
  choice: Jerimot
  rationale: Der Personenname wird nahe an der hebräischen Lautgestalt und entsprechend gebräuchlicher deutscher Bibeltradition wiedergegeben.
- source_word: עַזְרִיאֵל
  choice: Asriël
  rationale: Die Schreibung folgt einer geläufigen deutschen Wiedergabe; das Trema verdeutlicht, dass die beiden Vokale getrennt gesprochen werden.
