  text: וְ/לֹא נָשָׂ֤א דָוִיד֙ מִסְפָּרָ֔/ם לְ/מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָ֑טָּה כִּ֚י אָמַ֣ר יְהוָ֔ה לְ/הַרְבּ֥וֹת אֶת יִשְׂרָאֵ֖ל כְּ/כוֹכְבֵ֥י הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/023.yaml
  text: But David did not count them from twenty years old and under[b][a], because Yahweh had said he would multiply Israel like the stars of the heavens.
translation:
  language: de
  text: Doch David zählte die Zwanzigjährigen und Jüngeren nicht[a], denn Jahwe hatte gesagt, er werde Israel so zahlreich machen wie die Sterne am Himmel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „erhob ihre Zahl nicht“. Die hebräische Wendung bedeutet, jemanden zu zählen oder bei einer Volkszählung zu erfassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „wie die Sterne des Himmels“. Das Bild erinnert an Jahwes Verheißung, Israel überaus zahlreich zu machen.'
    reason: cross_reference
lexical_decisions:
- source_word: וְלֹא
  choice: Doch … nicht
  rationale: Die Verbindung knüpft mit einem sachlichen Gegensatz an den vorherigen Zusammenhang der Zählung an; „doch“ gibt diesen Übergang im Deutschen natürlich wieder.
- source_word: נָשָׂא … מִסְפָּרָם
  choice: zählte … nicht
  rationale: Die wörtliche Wendung „ihre Zahl erheben/tragen“ bezeichnet hier idiomatisch das Zählen beziehungsweise die Erfassung bei einer Volkszählung.
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וּלְמָטָּה
  choice: die Zwanzigjährigen und Jüngeren
  rationale: Die hebräische Altersformel umfasst Menschen im Alter von zwanzig Jahren abwärts. Diese Formulierung ist präzise und in modernem Deutsch gut verständlich.
- source_word: כִּי
  choice: denn
  rationale: Die Partikel führt den Grund dafür an, weshalb David diese Altersgruppe nicht zählte.
- source_word: אָמַר יְהוָה
  choice: Jahwe hatte gesagt
  rationale: Das Plusquamperfekt macht deutlich, dass die göttliche Aussage Davids Entscheidung vorausging; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: לְהַרְבּוֹת אֶת יִשְׂרָאֵל
  choice: er werde Israel so zahlreich machen
  rationale: Der Infinitiv bezeichnet den Inhalt der vorausgehenden göttlichen Aussage. Die indirekte Rede mit „werde“ ist im Deutschen natürlich und bewahrt den Zukunftsbezug.
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: wie die Sterne am Himmel
  rationale: Die geläufige deutsche Wendung bewahrt das Bild und den Anklang an die Verheißung, Israel unzählbar zu vermehren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Gottesnamen JHWH. „Jahwe“ gibt ihn als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Verheißung der Vermehrung Israels
  choice: Jahwe werde Israel so zahlreich machen wie die Sterne am Himmel
  alternative: Jahwe habe Israel bereits so zahlreich gemacht
  rationale: Der hebräische Infinitiv nach „sagte“ lässt sich am besten als Inhalt einer vorausliegenden, auf die Zukunft gerichteten Verheißung verstehen. Die Formulierung bewahrt den Verheißungscharakter und den patriarchalischen Anklang.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Die Zwanzigjährigen und Jüngeren“ gibt die Altersgrenze knapp und verständlich wieder; „so zahlreich machen“ formuliert das hebräische Vermehrungsverb natürlich aus, ohne den Verheißungscharakter abzuschwächen.
