  text: וְ/אַחֲרֵ֣י אֲחִיתֹ֗פֶל יְהוֹיָדָ֤ע בֶּן בְּנָיָ֨הוּ֙ וְ/אֶבְיָתָ֔ר וְ/שַׂר צָבָ֥א לַ/מֶּ֖לֶךְ יוֹאָֽב־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/034.yaml
  text: After Ahithophel came Jehoiada son of Benaiah and Abiathar[a]; and Joab was commander of the army for the king.
translation:
  language: de
  text: Nach Ahitofel kamen Jojada, der Sohn Benajas, und Abjatar[a]. Joab war der Heerführer des Königs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Nach Ahitofel Jojada, der Sohn Benajas, und Abjatar.« Im Hebräischen bleibt das Verb unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי אֲחִיתֹפֶל
  choice: Nach Ahitofel kamen
  rationale: אַחֲרֵי bedeutet »nach«. Da der hebräische Satz kein ausdrückliches Verb enthält, wird im Deutschen für den in dieser Ämterliste naheliegenden Gedanken der Nachfolge »kamen« ergänzt.
- source_word: יְהוֹיָדָע בֶּן בְּנָיָהוּ
  choice: Jojada, der Sohn Benajas
  rationale: Wiedergabe des Eigennamens und der üblichen hebräischen Abstammungsangabe in natürlichem Deutsch.
- source_word: וְ/אֶבְיָתָר
  choice: und Abjatar
  rationale: Die Konjunktion verbindet Abjatar syntaktisch mit Jojada; beide folgen im Text auf Ahitofel.
- source_word: וְ/שַׂר צָבָא
  choice: Joab war der Heerführer
  rationale: שַׂר צָבָא bezeichnet den militärischen Oberbefehlshaber. Das im nominalen hebräischen Satz fehlende Verb wird im Deutschen mit »war« ergänzt.
- source_word: לַ/מֶּלֶךְ
  choice: des Königs
  rationale: Das ל bezeichnet hier die Zuordnung beziehungsweise den Dienst für den König; »Heerführer des Königs« ist eine knappe und natürliche deutsche Wiedergabe.
- source_word: יוֹאָב
  choice: Joab
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
