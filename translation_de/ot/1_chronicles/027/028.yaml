base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/028.yaml
  text: Over the olive trees and the sycamore trees in the Shephelah was Baal-hanan the Gederite[b][a]; and over the stores of oil was Joash.
translation:
  language: de
  text: Für die Olivenbäume und die Maulbeerfeigenbäume in der Schefela[a] war Baal-Hanan aus Geder verantwortlich, und für die Ölvorräte war Joasch verantwortlich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Schefela ist das Hügelland zwischen dem judäischen Bergland und der Küstenebene. Der Name kann auch mit „Niederung“ wiedergegeben werden.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  choice: Für … war … verantwortlich
  rationale: In der Verwaltungsliste bezeichnet עַל den Zuständigkeitsbereich einer Person. Diese Formulierung gibt die Funktion im modernen Deutschen klar und natürlich wieder.
- source_word: הַזֵּיתִים
  choice: die Olivenbäume
  rationale: Im Zusammenhang der Landverwaltung bezeichnet der Plural die Bäume, nicht die Früchte.
- source_word: וְהַשִּׁקְמִים
  choice: die Maulbeerfeigenbäume
  rationale: שִׁקְמִים bezeichnet die Maulbeerfeige (Ficus sycomorus); die botanisch präzisere deutsche Bezeichnung vermeidet eine Verwechslung mit dem europäischen Bergahorn, der ebenfalls Sykomore genannt wird.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: in der Schefela
  rationale: שְׁפֵלָה ist hier am besten als Bezeichnung der Hügellandregion Judas zu verstehen; die Transliteration bewahrt den geografischen Eigennamen.
- source_word: בַּעַל חָנָן
  choice: Baal-Hanan
  rationale: Der Personenname wird nach geläufiger deutscher Bibelkonvention transliteriert und zur Lesbarkeit mit Bindestrich geschrieben.
- source_word: הַגְּדֵרִי
  choice: aus Geder
  rationale: Das Herkunftsadjektiv wird im Deutschen natürlich als Herkunftsangabe wiedergegeben, ohne einen ungebräuchlichen Bewohnernamen zu bilden.
- source_word: אֹצְרוֹת הַשֶּׁמֶן
  choice: die Ölvorräte
  rationale: Die Verbindung kann Lagerstätten oder eingelagerte Bestände meinen. „Ölvorräte“ ist idiomatisch und wahrt den administrativen Zusammenhang, ohne ein bestimmtes Gebäude vorauszusetzen.
- source_word: יוֹעָשׁ
  choice: Joasch
  rationale: Der Personenname wird entsprechend der üblichen deutschen Bibeltradition transliteriert.
