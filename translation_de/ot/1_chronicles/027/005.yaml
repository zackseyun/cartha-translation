base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/005.yaml
  text: The commander of the third division for the third month was Benaiah son of Jehoiada the chief[a], and in his division were twenty-four thousand.
translation:
  language: de
  text: Der Befehlshaber der dritten Heeresabteilung für den dritten Monat war Benaja, der Sohn Jojadas, des führenden Priesters[a]. Seine Abteilung umfasste 24.000 Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische lautet knapp: »Benaja, Sohn Jojadas, der Priester, Oberster«. Dabei kann sich »Oberster« entweder auf Jojada oder auf Benaja beziehen.'
    reason: syntaktische und lexikalische Mehrdeutigkeit
lexical_decisions:
- source_word: שַׂר הַצָּבָא
  choice: der Befehlshaber der Heeresabteilung
  rationale: שַׂר bezeichnet hier den militärischen Befehlshaber; הַצָּבָא steht im Zusammenhang der monatlich eingeteilten Heeresabteilungen.
- source_word: הַשְּׁלִישִׁי לַחֹדֶשׁ הַשְּׁלִישִׁי
  choice: der dritten Heeresabteilung für den dritten Monat
  rationale: Das erste »dritte« bezeichnet in der elliptischen Listenform die dritte Abteilung, das zweite den dritten Monat. »Heeresabteilung« wird zum natürlichen Verständnis ergänzt.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaja, der Sohn Jojadas
  rationale: Die Namen werden in einer im Deutschen gebräuchlichen biblischen Form wiedergegeben; die Abstammungsangabe bleibt ausdrücklich erhalten.
- source_word: הַכֹּהֵן רֹאשׁ
  choice: des führenden Priesters
  rationale: הַכֹּהֵן bedeutet »der Priester«, רֹאשׁ »Haupt/Oberster«. Die Wiedergabe versteht beide Wörter als nähere Bezeichnung Jojadas und formuliert ihre appositionelle Verbindung idiomatisch, ohne die syntaktische Alternative zu verschweigen.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Seine Abteilung umfasste
  rationale: מַחֲלֻקָה bezeichnet hier eine militärische Abteilung. Die deutsche Form gibt die Funktion der wiederkehrenden Listenformel natürlich wieder, nämlich die Stärke der Abteilung anzugeben.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24.000 Mann
  rationale: Die Zahl lautet wörtlich »vierundzwanzigtausend«. »Mann« verdeutlicht im militärischen Kontext, dass die Truppenstärke gemeint ist.
theological_decisions:
- issue: Bezug von הַכֹּהֵן רֹאשׁ
  choice: 'Beide Bezeichnungen werden auf Jojada bezogen: »Jojadas, des führenden Priesters«.'
  alternative: »Benaja, der Sohn des Priesters Jojada, war der Oberste«; dabei bezieht sich רֹאשׁ auf Benaja.
  rationale: Die knappe hebräische Listenform erlaubt beide syntaktischen Zuordnungen. Der Haupttext folgt der Lesart, nach der Jojada ein führender Priester war; die Fußnote bewahrt die echte Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Listenform wird flüssig wiedergegeben; »Heeresabteilung« und »Mann« machen die im Hebräischen knappen Angaben verständlich. Die Mehrdeutigkeit bei »Priester/Oberster« bleibt durch die Fußnote sichtbar.
