  register: Modernes, gut verständliches Standarddeutsch mit knapper, würdiger Listenform. Die Ellipse bei „Der vierte“ wird bewahrt und in der Fußnote erläutert; die Nachfolgeformel bleibt mit „nach ihm“ nah am Hebräischen.
