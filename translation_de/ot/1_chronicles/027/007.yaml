base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/007.yaml
  text: The fourth[a], for the fourth month, was Asahel the brother of Joab, and Zebadiah his son after him; and over his division were twenty-four thousand.
translation:
  language: de
  text: Der vierte[a] für den vierten Monat war Asaël, der Bruder Joabs, und nach ihm sein Sohn Sebadja. Seine Abteilung umfasste 24.000 Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der vierte Befehlshaber in der monatlichen Reihenfolge.
    reason: Das hebräische Ordinalzahlwort steht substantivisch; seine maskuline Form weist im Kontext auf den ausgelassenen Befehlshaber.
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: Der vierte
  rationale: Das substantivisch gebrauchte Ordinalzahlwort bezeichnet elliptisch den vierten Befehlshaber beziehungsweise die vierte Stelle in der monatlichen Reihenfolge; die knappe Listenform bleibt erhalten.
- source_word: לַחֹדֶשׁ הָרְבִיעִי
  choice: für den vierten Monat
  rationale: Die Präposition ל kennzeichnet hier die Zuweisung innerhalb des monatlichen Dienstturnus.
- source_word: עֲשָׂהאֵל
  choice: Asaël
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens; der Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: אֲחִי יוֹאָב
  choice: der Bruder Joabs
  rationale: Die deutsche Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung knapp und würdig wieder.
- source_word: וּזְבַדְיָה בְנוֹ אַחֲרָיו
  choice: und nach ihm sein Sohn Sebadja
  rationale: אַחֲרָיו bedeutet wörtlich „nach ihm“ und weist im Kontext auf die Nachfolge hin, ohne ausdrücklich zu ergänzen, worin diese bestand.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Zu seiner Abteilung gehörten
  rationale: מַחֲלֻקָה bezeichnet in diesem Kapitel eine militärische Abteilung. Die natürliche deutsche Formulierung drückt ihre Zuordnung zu dem genannten Befehlshaber aus.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24.000 Mann
  rationale: Die Zahl wird nach heutiger deutscher Schreibweise wiedergegeben; „Mann“ ist aus dem militärischen Kontext erschlossen und macht die Bezugsgröße verständlich.
