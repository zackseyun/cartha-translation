base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/015.yaml
  text: The twelfth[a], for the twelfth month, was Heldai the Netophathite, of Othniel[b]; and over his division were twenty-four thousand.
translation:
  language: de
  text: Der zwölfte für den zwölften Monat war Heldai[a], der Netofatiter, aus Otniels Sippe[b]. Zu seiner Abteilung gehörten 24.000 Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der parallelen Überlieferung steht statt Heldai die Namensform »Heled«.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich: »zu Otniel«. Gemeint ist wahrscheinlich die Zugehörigkeit zu Otniels Familie oder Sippe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: Der zwölfte
  rationale: Der Ausdruck ist im Zusammenhang der durchnummerierten monatlichen Heeresabteilungen als Ordinalzahl zu verstehen; das Bezugswort »Befehlshaber« bleibt wie im Hebräischen unausgesprochen.
- source_word: לִשְׁנֵים עָשָׂר הַחֹדֶשׁ
  choice: für den zwölften Monat
  rationale: Die Präposition ל kennzeichnet hier die Zuweisung zum jeweiligen Dienstmonat und wird in natürlichem Deutsch mit »für« wiedergegeben.
- source_word: חֶלְדַּי
  choice: Heldai
  rationale: Der Eigenname wird entsprechend der hier vorliegenden masoretischen Form transliteriert; die abweichende Namensform »Heled« in 1. Chronik 11,30 wird nicht in diesen Vers eingetragen.
- source_word: הַנְּטוֹפָתִי
  choice: der Netofatiter
  rationale: Das Gentiliz bezeichnet einen Mann aus Netofa; »Netofatiter« ist die knappe, in deutscher Bibelsprache verständliche Herkunftsbezeichnung.
- source_word: לְעָתְנִיאֵל
  choice: aus der Sippe Otnïels
  rationale: Das ל bezeichnet hier wahrscheinlich die Zugehörigkeit zu einer Familie oder Sippe. Die Formulierung macht diese wahrscheinlichste Beziehung verständlich, ohne eine unmittelbare Dienststellung unter Otnïel anzunehmen.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Zu seiner Abteilung gehörten
  rationale: מַחֲלֻקָה bezeichnet in diesem Kapitel die militärische Abteilung beziehungsweise Dienstgruppe. Die deutsche Wendung gibt die durch עַל eingeleitete Zuordnung idiomatisch wieder.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24.000 Mann
  rationale: Die Zahl bezeichnet die Stärke der militärischen Abteilung. »Mann« ist aus dem Sachzusammenhang ergänzt und macht die elliptische Zahlenangabe im Deutschen klar.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Listenform des Hebräischen bleibt erhalten. Die militärische Ellipse wird durch »Mann« verdeutlicht; die mehrdeutige Präposition bei Otnïel wird im Haupttext wahrscheinlichkeitsgemäß und in der Fußnote wörtlicher wiedergegeben.
