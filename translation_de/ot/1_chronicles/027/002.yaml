  text: עַ֞ל הַ/מַּחֲלֹ֤קֶת הָ/רִֽאשׁוֹנָה֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן יָֽשָׁבְעָ֖ם בֶּן זַבְדִּיאֵ֑ל וְ/עַל֙ מַֽחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/002.yaml
  text: Over the first division for the first month was Jashobeam son of Zabdiel[a], and in his division were twenty-four thousand.
translation:
  language: de
  text: Über der ersten Abteilung für den ersten Monat stand Jaschobam, der Sohn Sabdiëls. Seine Abteilung zählte 24.000 Mann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und über seiner Abteilung: 24.000“. Der hebräische Text ist verkürzt; „zählte“ und „Mann“ sind sinngemäß ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הַמַּחֲלֹקֶת
  choice: Über der Abteilung stand
  rationale: עַל kennzeichnet in dieser Verwaltungsliste die Aufsicht über eine Einheit. Die deutsche Konstruktion „über … stand“ gibt die Leitungsfunktion klar und relativ formnah wieder.
- source_word: הַמַּחֲלֹקֶת
  choice: Abteilung
  rationale: מַחֲלֹקֶת bezeichnet hier eine organisierte militärische Einheit im monatlichen Turnus. „Abteilung“ ist im modernen Deutschen verständlich und passt zum Zusammenhang.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: für den ersten Monat
  rationale: Die Präposition ל bezeichnet hier die Zuordnung der Abteilung zum ersten Monat des jährlichen Dienstplans.
- source_word: יָשָׁבְעָם
  choice: Jaschobam
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamen- und Transliterationspraxis wiedergegeben.
- source_word: בֶּן זַבְדִּיאֵל
  choice: der Sohn Sabdiëls
  rationale: בֶּן bezeichnet hier die übliche genealogische Identifikation. Die deutsche Genitivkonstruktion ist natürlich und präzise.
- source_word: וְעַל מַחֲלֻקְתּוֹ עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: Seine Abteilung zählte 24.000 Mann
  rationale: Der hebräische Satz ist elliptisch und nennt nach „über seiner Abteilung“ lediglich die Zahl. „zählte“ ergänzt idiomatisch die gemeinte Stärke; „Mann“ macht im militärischen Zusammenhang die Bezugsgröße verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Verwaltungs- und Militärsprache bleibt klar, ohne das altertümliche „Heerordnung“ oder „Dienstabteilung“ zu verwenden. Die Zahl wird nach deutscher Schreibweise mit Tausenderpunkt gesetzt.
