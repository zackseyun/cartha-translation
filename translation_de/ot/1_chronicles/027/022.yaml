lexical_decisions:
- source_word: לְ/דָן
  choice: Für Dan
  rationale: Die Präposition לְ leitet in dieser Verwaltungsliste die Zuordnung zum jeweiligen Stamm ein; „Für Dan“ gibt dies knapp und idiomatisch wieder.
- source_word: עֲזַרְאֵל
  choice: Asarel
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenkonvention wiedergegeben.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die Abstammungsangabe wird im Deutschen natürlich als Apposition „der Sohn …“ formuliert.
- source_word: יְרֹחָם
  choice: Jerohams
  rationale: Der Personenname folgt der geläufigen deutschen Form; der Genitiv gibt die hebräische Konstruktverbindung wieder.
- source_word: אֵלֶּה
  choice: Das waren
  rationale: Das hebräische Demonstrativpronomen steht in einem verblosen zusammenfassenden Satz; „Das waren“ ist im Deutschen idiomatisch und bezieht sich auf die zuvor aufgezählten Amtsträger.
- source_word: שָׂרֵי
  choice: Oberhäupter
  rationale: שָׂרִים bezeichnet hier die führenden Vertreter der Stämme. „Oberhäupter“ wahrt den leitenden Rang, ohne königliche Bedeutung anzunehmen.
- source_word: שִׁבְטֵי
  choice: der Stämme
  rationale: Der Konstruktplural wird direkt als Genitivverbindung wiedergegeben.
- source_word: יִשְׂרָאֵל
  choice: Israels
  rationale: Der Eigenname steht als abhängiger Genitiv zu „Stämme“.
