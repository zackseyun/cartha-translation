  yaml_path: translation/ot/1_chronicles/027/022.yaml
  text: 'For Dan: Azarel son of Jeroham[a]. These were the leaders of the tribes of Israel.'
translation:
  language: de
  text: 'Für Dan: Asarel, der Sohn Jerohams. Das waren die Oberhäupter[a] der Stämme Israels.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Anführer“ oder „Fürsten“.'
