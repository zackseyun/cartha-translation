  yaml_path: translation/ot/1_chronicles/027/010.yaml
  text: 'The seventh[a], for the seventh month: Helez the Pelonite, from the sons of Ephraim; and over his division were twenty-four thousand.'
translation:
  language: de
  text: Der siebte für den siebten Monat war Helez, der Peloniter[a], von den Nachkommen Ephraims. Unter seinem Befehl standen 24.000 Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise: der Paltiter. Diese Form beruht auf einer anderen überlieferten Zuordnung von Helez’ Sippenbezeichnung.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְּׁבִיעִי
  choice: Der siebte
  rationale: Das substantivisch gebrauchte Ordnungszahlwort bezeichnet im Zusammenhang der Liste den siebten Befehlshaber; die knappe Form bewahrt die elliptische Struktur des Hebräischen.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: für den siebten Monat
  rationale: Die Präposition ל bezeichnet hier die monatliche Zuweisung des Dienstes.
- source_word: חֶלֶץ
  choice: Helez
  rationale: Der Personenname wird nach üblicher deutscher Bibeltradition transliteriert.
- source_word: הַפְּלוֹנִי
  choice: der Peloniter
  rationale: Die Wiedergabe folgt der Konsonantenform des masoretischen Textes; die abweichende traditionelle Zuordnung wird in einer Fußnote genannt.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: von den Nachkommen Ephraims
  rationale: Dies gibt die hebräische Stammesformel verständlich und natürlich wieder, ohne eine engere biologische Aussage als nötig festzulegen.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Seine Abteilung umfasste
  rationale: מַחֲלֻקָה bezeichnet hier die militärische Abteilung unter dem jeweiligen Befehlshaber. Die natürliche deutsche Formulierung bringt die Zuordnung und die folgende Truppenstärke klar zum Ausdruck.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24.000 Mann
  rationale: Die Zahl wird in moderner deutscher Schreibweise wiedergegeben; „Mann“ verdeutlicht im militärischen Listenzusammenhang die gezählten Angehörigen, ohne die Zahl zu verändern.
