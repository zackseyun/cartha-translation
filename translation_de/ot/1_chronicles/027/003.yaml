  text: מִן בְּנֵי פֶ֗רֶץ הָ/רֹ֛אשׁ לְ/כָל שָׂרֵ֥י הַ/צְּבָא֖וֹת לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/003.yaml
  text: From the sons of Perez[b][a], the chief over all the commanders of the divisions for the first month.
translation:
  language: de
  text: Er gehörte zu den Söhnen[a] des Perez und war im ersten Monat der Oberste aller Befehlshaber der Truppenverbände[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu den Nachkommen des Perez“. Wörtlich steht im Hebräischen „zu den Söhnen des Perez“, eine genealogische Wendung, die auch eine weiter gefasste Nachkommenschaft bezeichnen kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Heere“. Das hebräische Wort bedeutet häufig „Heere“ oder „Heerscharen“; in diesem Kapitel sind damit die nach Monaten eingeteilten Truppenverbände gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן בְּנֵי פֶרֶץ
  choice: Er gehörte zu den Söhnen des Perez
  rationale: מִן bezeichnet hier Herkunft beziehungsweise Abstammung. Die traditionelle genealogische Wendung „Söhne des Perez“ bleibt im Haupttext erhalten; dass damit auch Nachkommen im weiteren Sinn gemeint sein können, wird in einer Fußnote erläutert.
- source_word: הָרֹאשׁ
  choice: der Oberste
  rationale: רֹאשׁ bezeichnet hier die Person in höchster Leitungsstellung. „Der Oberste“ gibt die Rang- und Leitungsfunktion in natürlichem, würdigem Deutsch wieder.
- source_word: לְכָל שָׂרֵי הַצְּבָאוֹת
  choice: aller Befehlshaber der Truppenverbände
  rationale: Die Konstruktion beschreibt den Zuständigkeitsbereich des Obersten. שָׂרִים sind hier militärische Befehlshaber; צְבָאוֹת kann „Heere“ bedeuten, bezeichnet im Kapitelkontext jedoch die in monatliche Einheiten gegliederten Truppen.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: im ersten Monat
  rationale: Die Wendung ordnet seine Leitungsfunktion dem ersten Monat des in diesem Abschnitt beschriebenen Dienstturnus zu. „Im ersten Monat“ ist im Deutschen knapp und idiomatisch.
theological_decisions: []
