base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/030.yaml
  text: Over the camels was Obil the Ishmaelite[a], and over the female donkeys was Jehdeiah the Meronothite.
translation:
  language: de
  text: Über die Kamele war Obil, der Ismaeliter, eingesetzt, und über die Eselinnen Jechdeja, der Meronotiter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: Über … war … eingesetzt
  rationale: עַל bezeichnet in dieser Verwaltungsliste die Aufsicht oder Zuständigkeit. Die ergänzte Wendung „war … eingesetzt“ macht die knappe hebräische Konstruktion im Deutschen natürlich verständlich.
- source_word: הַגְּמַלִּים
  choice: die Kamele
  rationale: Direkte Wiedergabe des bestimmten Plurals.
- source_word: אוֹבִיל
  choice: Obil
  rationale: Der Personenname wird nach gängiger deutscher Form transliteriert.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: der Ismaeliter
  rationale: Das Gentiliz bezeichnet Obils ethnische oder sippenmäßige Zugehörigkeit; „Ismaeliter“ ist die etablierte deutsche Wiedergabe.
- source_word: הָאֲתֹנוֹת
  choice: die Eselinnen
  rationale: אָתוֹן bezeichnet ausdrücklich weibliche Esel. „Eselinnen“ bewahrt diese lexikalische Genauigkeit knapp und idiomatisch.
- source_word: יֶחְדְּיָהוּ
  choice: Jechdeja
  rationale: Der Personenname wird in einer geläufigen deutschen Transliterationsform wiedergegeben.
- source_word: הַמֵּרֹנֹתִי
  choice: der Meronotiter
  rationale: Das Gentiliz wird formgetreu als Herkunfts- oder Zugehörigkeitsbezeichnung wiedergegeben.
