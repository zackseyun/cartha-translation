base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/031.yaml
  text: Over the flocks was Jaziz the Hagrite[a]. All these were officers over the property that belonged to King David.
translation:
  language: de
  text: Über die Herden war Jasiz, der Hagriter[a], eingesetzt. Alle diese waren die Verwalter des Besitzes, der König David gehörte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Hagariter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Über … war … eingesetzt
  rationale: עַל bezeichnet in dieser Verwaltungsliste die Zuständigkeit. Die deutsche Konstruktion macht diese Aufsichtsfunktion natürlich und klar.
- source_word: הַצֹּאן
  choice: die Herden
  rationale: צֹאן kann Schafe oder Kleinvieh insgesamt, einschließlich Ziegen, bezeichnen. „Herden“ vermeidet eine unnötige Verengung.
- source_word: יָזִיז
  choice: Jasiz
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren, quellenahen Form wiedergegeben.
- source_word: הַהַגְרִי
  choice: der Hagriter
  rationale: Das Gentiliz bezeichnet einen Angehörigen der Hagriter; „Hagriter“ ist die übliche knappe deutsche Form. Die alternative Ableitung „Hagariter“ wird in einer Fußnote bewahrt.
- source_word: כָּל אֵלֶּה
  choice: Sie alle
  rationale: Die Formulierung fasst die zuvor genannten Amtsträger natürlich zusammen.
- source_word: שָׂרֵי
  choice: die Verwalter
  rationale: שָׂרֵי bezeichnet hier die für königliche Vermögensbereiche zuständigen Amtsträger. „Verwalter“ trifft ihre Funktion besser als „Fürsten“ oder „Oberste“.
- source_word: הָרְכוּשׁ
  choice: des Besitzes
  rationale: רְכוּשׁ bezeichnet Besitz, Vermögen oder Güter. „Besitz“ passt zum umfassenden königlichen Ressourcenbestand.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: der König David gehörte
  rationale: Die Relativkonstruktion drückt die Zugehörigkeit des Besitzes zu König David aus und wird so in natürlichem modernem Deutsch wiedergegeben.
