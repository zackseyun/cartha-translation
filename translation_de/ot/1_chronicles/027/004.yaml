  text: וְ/עַ֞ל מַחֲלֹ֣קֶת הַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֗י דּוֹדַ֤י הָ/אֲחוֹחִי֙ וּ/מַ֣חֲלֻקְתּ֔/וֹ וּ/מִקְל֖וֹת הַ/נָּגִ֑יד וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/004.yaml
  text: Over the division for the second month was Dodai the Ahohite[a], and Mikloth was the leader over his division; and in his division were twenty-four thousand.
translation:
  language: de
  text: An der Spitze der Abteilung für den zweiten Monat stand Dodai, der Ahoachiter. Miklot war der Anführer über seiner Abteilung.[a] Sie zählte 24.000 Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dodai, der Ahoachiter, und seine Abteilung sowie Miklot, der Anführer«. Die hebräische Wortfolge ist stark verkürzt; es ist nicht eindeutig, ob Miklot als zweiter Befehlshaber innerhalb von Dodais Abteilung genannt wird oder als derjenige, der über ihr stand.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַחֲלֹקֶת
  choice: Abteilung
  rationale: Im militärisch-administrativen Zusammenhang bezeichnet das Wort eine Einheit, die turnusmäßig für einen Monat zum Dienst eingeteilt war. »Abteilung« ist im modernen Deutschen natürlich und bewahrt den organisatorischen Sinn.
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: den zweiten Monat
  rationale: Die einfache Ordinalangabe bezeichnet den zweiten Monat des Dienstturnus.
- source_word: דּוֹדַי
  choice: Dodai
  rationale: Der Eigenname wird entsprechend der hier überlieferten hebräischen Form transliteriert.
- source_word: הָאֲחוֹחִי
  choice: der Ahoachiter
  rationale: Die Form bezeichnet die Zugehörigkeit zu einer Sippe oder Herkunftsgruppe; die deutsche Bildung auf »-iter« ist verständlich und bibelsprachlich geläufig.
- source_word: וּמַחֲלֻקְתּוֹ
  choice: seiner Abteilung
  rationale: Das Substantiv wird konsistent mit »Abteilung« wiedergegeben; das Suffix der dritten Person Singular erscheint als Possessivpronomen.
- source_word: וּמִקְלוֹת
  choice: Miklot
  rationale: Der Eigenname wird in einer dem Hebräischen entsprechenden deutschen Form transliteriert.
- source_word: הַנָּגִיד
  choice: der Anführer
  rationale: Das Wort bezeichnet hier eine leitende Person innerhalb des militärisch-administrativen Gefüges, ohne dass ein genauer formaler Rang festgelegt wird.
- source_word: וְעַל־מַחֲלֻקְתּוֹ
  choice: Seine Abteilung umfasste
  rationale: Die wiederholte Wendung eröffnet im Kontext die abschließende Angabe zur Stärke der Einheit. Im Deutschen wird sie idiomatisch als eigener Satz formuliert, ohne die Zugehörigkeit der Zahl zur Abteilung zu verändern.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24.000 Mann
  rationale: Die Zahl wird nach deutscher Schreibweise gesetzt. »Mann« verdeutlicht im militärischen Kontext, dass die Zahl die Personalstärke bezeichnet.
theological_decisions:
- issue: Zuordnung Miklots in der komprimierten hebräischen Wortfolge
  choice: Miklot wird als Anführer von Dodais Abteilung verstanden.
  alternative: 'Die Folge kann enger und parataktisch gelesen werden: »Dodai, der Ahoachiter, und seine Abteilung, und Miklot, der Anführer«; dann bleibt Miklots genaue Stellung weniger bestimmt.'
  rationale: Die Syntax ist stark verdichtet. Die Hauptfassung bietet eine natürliche administrative Lesart, während die Fußnote die echte strukturelle Mehrdeutigkeit offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Militärisch-administrative Begriffe werden verständlich, aber ohne unnötig moderne Rangbezeichnungen wiedergegeben. Die verdichtete Syntax des Hebräischen wird lesbar entfaltet; ihre sachliche Mehrdeutigkeit bleibt durch die Fußnote erhalten.
