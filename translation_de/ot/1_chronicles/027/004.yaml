revisions:
- from: Über die Abteilung für den zweiten Monat war Dodai, der Ahoachiter; Miklot war der Anführer seiner Abteilung.[a] Seine Abteilung umfasste 24.000 Mann.
  to: An der Spitze der Abteilung für den zweiten Monat stand Dodai, der Ahoachiter. Miklot war der Anführer über seiner Abteilung.[a] Sie zählte 24.000 Mann.
  rationale: Die Revision glättet die deutsche Satzstellung und korrigiert die sachlich unzutreffende Begründung, die עַל in der letzten Formel als bloße Größenangabe behandelte. Die Hauptfassung folgt weiterhin der möglichen und im englischen Audit gewählten Lesart, nach der Miklot über Dodais Abteilung eingesetzt war. Die Fußnote bewahrt die tatsächlich bestehende Unsicherheit der komprimierten hebräischen Wortfolge, ohne eine bestimmte hierarchische Deutung vorzuschreiben.
