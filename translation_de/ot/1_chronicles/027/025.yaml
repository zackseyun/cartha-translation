id: 1CH.27.25
reference: 1 Chronicles 27:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַל֙ אֹצְר֣וֹת הַ/מֶּ֔לֶךְ עַזְמָ֖וֶת בֶּן עֲדִיאֵ֑ל וְ/עַ֣ל הָֽ/אֹצָר֡וֹת בַּ/שָּׂדֶ֞ה בֶּ/עָרִ֤ים וּ/בַ/כְּפָרִים֙ וּ/בַ/מִּגְדָּל֔וֹת יְהוֹנָתָ֖ן בֶּן עֻזִּיָּֽהוּ־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/025.yaml
  text: Over the king’s treasuries was Azmaveth son of Adiel[a], and over the treasuries in the countryside, in the cities, in the villages, and in the towers[b], was Jehonathan son of Uzziah.
translation:
  language: de
  text: Für die Schatzkammern des Königs war Asmawet, der Sohn Adiëls, zuständig; für die Schatzkammern auf dem Land[a], in den Städten, in den Dörfern und in den Türmen war Jehonatan[b], der Sohn Usijas, zuständig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf dem Feld“; der hebräische Singular bezeichnet hier wahrscheinlich zusammenfassend das ländliche Gebiet im Unterschied zu Städten, Dörfern und Türmen.'
    reason: lexical_alternative
  - marker: b
    text: „Jehonatan“ gibt hier die längere hebräische Namensform wieder; andernorts erscheint auch die kürzere Form „Jonatan“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: für … war … zuständig
  rationale: עַל bezeichnet in dieser Verwaltungsliste die Aufsicht beziehungsweise Zuständigkeit. Die gewählte Formulierung gibt dies in natürlichem modernem Deutsch wieder.
- source_word: אֹצְרוֹת / הָאֹצָרוֹת
  choice: Schatzkammern
  rationale: אֹצָר kann eine Schatzkammer, ein Vorratshaus oder dessen Bestand bezeichnen. „Schatzkammern“ passt zum königlichen Verwaltungszusammenhang und bewahrt für beide Vorkommen denselben Ausdruck.
- source_word: הַמֶּלֶךְ
  choice: des Königs
  rationale: Der hebräische Genitivanschluss wird im Deutschen natürlich mit „des Königs“ wiedergegeben.
- source_word: עַזְמָוֶת
  choice: Asmawet
  rationale: Die Form folgt einer im Deutschen gut lesbaren, quellennahen Umschrift des hebräischen Personennamens.
- source_word: בֶּן עֲדִיאֵל
  choice: der Sohn Adiëls
  rationale: בֶּן wird in der genealogischen Identifizierung unmittelbar als „Sohn“ wiedergegeben; das Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: בַּשָּׂדֶה
  choice: auf dem Land
  rationale: Das hebräische Singularwort bedeutet wörtlich „auf dem Feld“, hat hier im Gegensatz zu Städten, Dörfern und Türmen aber wahrscheinlich kollektiven Sinn und bezeichnet den ländlichen Raum.
- source_word: בֶּעָרִים
  choice: in den Städten
  rationale: Die lokative Wiedergabe entspricht der Aufzählung der Orte, an denen sich die Schatzkammern befanden.
- source_word: וּבַכְּפָרִים
  choice: in den Dörfern
  rationale: כְּפָרִים bezeichnet Dörfer oder kleinere ländliche Siedlungen; „Dörfer“ ist die klare, übliche deutsche Entsprechung.
- source_word: וּבַמִּגְדָּלוֹת
  choice: in den Türmen
  rationale: מִגְדָּלוֹת bedeutet allgemein „Türme“. Eine nähere Bestimmung als Wach- oder Festungstürme wäre möglich, ist im hebräischen Text jedoch nicht ausdrücklich enthalten.
- source_word: יְהוֹנָתָן
  choice: Jehonatan
  rationale: Die Wiedergabe bewahrt die an dieser Stelle belegte längere Namensform und verkürzt sie nicht zu „Jonatan“.
- source_word: בֶּן עֻזִּיָּהוּ
  choice: der Sohn Usijas
  rationale: Die genealogische Wendung wird direkt wiedergegeben; „Usija“ ist die im Deutschen etablierte Form des Namens.
theological_decisions: []
