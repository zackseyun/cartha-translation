base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/014.yaml
  text: For the twelfth month[a], Benaiah the Pirathonite, from the sons of Ephraim; and over his division were twenty-four thousand.
translation:
  language: de
  text: Der Elfte für den elften Monat war Benaja, der Piratoniter, von den Nachkommen Ephraims.[a] Seine Abteilung zählte 24.000 Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von den Söhnen Ephraims«; gemeint ist die stammesmäßige Abstammung von Ephraim.'
    reason: Die Fußnote bewahrt die konkrete hebräische Verwandtschaftsformulierung neben der im Haupttext natürlicheren deutschen Wiedergabe.
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר לְעַשְׁתֵּי עָשָׂר הַחֹדֶשׁ
  choice: Der Elfte für den elften Monat
  rationale: 'Die hebräische Zahlform bezeichnet elf beziehungsweise den elften Rang, nicht zwölf. Die Wiederholung gehört zur Listenformel: Der elfte Befehlshaber beziehungsweise Dienstturnus ist dem elften Monat zugeordnet.'
- source_word: בְּנָיָה
  choice: Benaja
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: הַפִּרְעָתוֹנִי
  choice: der Piratoniter
  rationale: Das Gentiliz bezeichnet einen Mann aus Piraton; die traditionelle deutsche Form bewahrt diese Herkunftsangabe knapp.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: von den Nachkommen Ephraims
  rationale: Wörtlich steht »von den Söhnen Ephraims«; im genealogisch-stammesbezogenen Zusammenhang meint die Wendung die Zugehörigkeit zu Ephraims Nachkommenschaft.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Seine Abteilung zählte
  rationale: מַחֲלֻקָה bezeichnet hier die militärische Abteilung beziehungsweise Dienstgruppe unter Benajas Leitung. Die deutsche Form gibt die Verwaltungs- und Zahlenangabe natürlich wieder.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24.000 Mann
  rationale: Die Zahl ist 24.000; »Mann« wird aus dem militärischen Kontext ergänzt und macht die elliptische hebräische Angabe im Deutschen verständlich.
