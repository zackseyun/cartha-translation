    issue: Abweichung zwischen dem bereitgestellten hebräischen Text und der englischen POB-Audit-Fassung
    rationale: Der bereitgestellte hebräische Text liest zweimal עַשְׁתֵּי עָשָׂר (»elf/der Elfte«), während die englische Audit-Fassung »twelfth« hat. Die deutsche Fassung folgt korrekt dem vorgelegten hebräischen Text. Da dies zugleich von der in vielen Textzeugen erwarteten Reihenfolge der Monatsliste abweicht, sollte die hebräische Eingabe bzw. Textgrundlage redaktionell geprüft werden.
  revised_text: Der Elfte für den elften Monat war Benaja, der Piratoniter, von den Nachkommen Ephraims.[a] Seine Abteilung zählte 24.000 Mann.
