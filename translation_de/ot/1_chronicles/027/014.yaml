  register: 'Modernes, gut verständliches Standarddeutsch mit würdigem Listenstil. Die Übersetzung folgt gegen die englische Konsultationsfassung der hebräischen Zahlform: Der Vers nennt den elften, nicht den zwölften Monat.'
