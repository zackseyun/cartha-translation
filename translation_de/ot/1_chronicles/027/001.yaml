source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֣ל לְֽ/מִסְפָּרָ֡/ם רָאשֵׁ֣י הָ/אָב֣וֹת וְ/שָׂרֵ֣י הָֽ/אֲלָפִ֣ים וְ/הַ/מֵּא֡וֹת וְ/שֹׁטְרֵי/הֶם֩ הַ/מְשָׁרְתִ֨ים אֶת הַ/מֶּ֜לֶךְ לְ/כֹ֣ל דְּבַ֣ר הַֽ/מַּחְלְק֗וֹת הַ/בָּאָ֤ה וְ/הַ/יֹּצֵאת֙ חֹ֣דֶשׁ בְּ/חֹ֔דֶשׁ לְ/כֹ֖ל חָדְשֵׁ֣י הַ/שָּׁנָ֑ה הַֽ/מַּחֲלֹ֨קֶת֙ הָֽ/אַחַ֔ת עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׀׀־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/001.yaml
  text: The sons of Israel according to their number—the heads of fathers’ houses[a], and the commanders of thousands and of hundreds[c][b], and their officers who served the king in every matter of the divisions that came in and went out month by month throughout all the months of the year—each division was twenty-four thousand.
translation:
  language: de
  text: Die Söhne Israels nach ihrer Zahl – die Häupter der Vaterhäuser[a], die Befehlshaber über Tausende und Hunderte[b] und ihre Amtsträger – dienten dem König in allen Angelegenheiten der Abteilungen, die Monat für Monat, alle Monate des Jahres hindurch, kamen und gingen[c]. Jede Abteilung umfasste vierundzwanzigtausend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Häupter der Vaterhäuser“; ein Vaterhaus war ein abstammungsbezogener Familienverband.'
    reason: cultural_note
  - marker: b
    text: Die Bezeichnungen beziehen sich auf Leitungsämter über Einheiten von jeweils tausend beziehungsweise hundert.
    reason: cultural_note
  - marker: c
    text: Gemeint ist der monatliche Wechsel der Abteilungen im Dienst für den König.
    reason: clarification
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Die Söhne Israels
  rationale: Bewahrt die formale hebräische Bezeichnung; im Zusammenhang ist das Volk Israel als Kollektiv gemeint.
- source_word: לְמִסְפָּרָם
  choice: nach ihrer Zahl geordnet
  rationale: Gibt nicht nur eine Zählung, sondern die administrative Erfassung und Gliederung nach der jeweiligen Stärke wieder.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: die Oberhäupter der Großfamilien
  rationale: Bezeichnet Leiter abstammungsbezogener Familienverbände; „Großfamilien“ ist im heutigen Deutsch verständlicher als die wörtliche Wendung „Vaterhäuser“.
- source_word: וְשָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: die Befehlshaber über Tausend und über Hundert
  rationale: Bewahrt die militärisch-administrativen Einheiten und ihre abgestuften Leitungsämter.
- source_word: וְשֹׁטְרֵיהֶם
  choice: ihre Amtsträger
  rationale: Der Ausdruck kann Verwaltungsbeamte oder Aufseher mit unterschiedlichen Aufgaben bezeichnen; „Amtsträger“ lässt diese funktionale Breite bestehen.
- source_word: הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: Sie dienten dem König
  rationale: Gibt den fortdauernden offiziellen Dienst schlicht und umfassend wieder.
- source_word: לְכֹל דְּבַר הַמַּחְלְקוֹת
  choice: in allen Angelegenheiten der Abteilungen
  rationale: Erhält die umfassende administrative Bedeutung von דָּבָר als Angelegenheit oder Geschäft.
- source_word: הַבָּאָה וְהַיֹּצֵאת
  choice: die … zum Dienst antraten und wieder abtraten
  rationale: Macht im Deutschen den aus dem Kontext erkennbaren monatlichen Wechsel der Abteilungen verständlich, ohne die Richtung des hebräischen Ausdruckspaars aufzugeben.
- source_word: חֹדֶשׁ בְּחֹדֶשׁ לְכֹל חָדְשֵׁי הַשָּׁנָה
  choice: Monat für Monat während des ganzen Jahres
  rationale: Natürliche deutsche Wiedergabe des distributiven Ausdrucks und des vollständigen Jahreszyklus.
- source_word: הַמַּחֲלֹקֶת הָאַחַת
  choice: Jede Abteilung
  rationale: Die wörtliche Form „die eine Abteilung“ hat hier distributiven Sinn und bezeichnet jede einzelne Abteilung des Turnus.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24.000 Mann
  rationale: Die Zahl wird direkt wiedergegeben; „Mann“ verdeutlicht, dass die Personalstärke der militärisch-administrativen Abteilung gemeint ist.
