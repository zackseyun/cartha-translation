base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/027.yaml
  text: Over the vineyards was Shimei the Ramathite[b][a]; and over the produce of the vineyards for the wine cellars was Zabdi the Shiphmite.
translation:
  language: de
  text: Für die Weinberge war Schimi, der Ramatiter, verantwortlich; und für den Ertrag der Weinberge[b] für die Lagerräume für Wein[a] war Sabdi, der Schifmiter, verantwortlich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Weinkeller«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »das, was in den Weinbergen war«; wahrscheinlich ist der Ertrag der Weinberge gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: war … verantwortlich
  rationale: In dieser Verwaltungsliste bezeichnet עַל die Zuständigkeit oder Aufsicht einer genannten Person. Die deutsche Wendung ist natürlich und gibt die wiederholte Verwaltungsformel klar wieder.
- source_word: הַכְּרָמִים
  choice: die Weinberge
  rationale: כֶּרֶם bezeichnet gewöhnlich einen Weinberg; der bestimmte Plural bezieht sich hier auf die verwalteten Weinberge.
- source_word: שִׁמְעִי
  choice: Schimi
  rationale: Der Personenname wird in einer im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: הָרָמָתִי
  choice: der Ramatiter
  rationale: Das Herkunftsadjektiv wird als deutsche Einwohnerbezeichnung wiedergegeben und nicht auf einen bestimmten, möglicherweise unsicheren Ort namens Rama festgelegt.
- source_word: שֶׁבַּכְּרָמִים
  choice: der Ertrag der Weinberge
  rationale: Wörtlich steht hier »das, was in den Weinbergen war«. Im Gegensatz zu den Weinbergen selbst und im Zusammenhang mit der Weinlagerung ist damit wahrscheinlich ihr Ertrag gemeint.
- source_word: לְאֹצְרוֹת הַיַּיִן
  choice: für die Weinlager bestimmt
  rationale: אֹצָר bezeichnet einen Vorrats- oder Lagerraum. Zusammen mit »Wein« sind Lagerräume für Wein gemeint; לְ wird als Zweck- oder Zielangabe verstanden.
- source_word: זַבְדִּי
  choice: Sabdi
  rationale: Der Personenname wird in einer im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: הַשִּׁפְמִי
  choice: der Schifmiter
  rationale: Die Herkunftsbezeichnung wird transliteriert, da der zugrunde liegende Ort nicht sicher bestimmt werden kann.
