lexical_decisions:
- source_word: אֲחִיתֹפֶל
  choice: Ahitofel
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, dem Hebräischen nahen Form wiedergegeben.
- source_word: יוֹעֵץ
  choice: Ratgeber
  rationale: Das Wort bezeichnet jemanden, der Rat erteilt; »Ratgeber« ist im höfischen Zusammenhang natürlich und präzise.
- source_word: לַמֶּלֶךְ
  choice: des Königs
  rationale: Das ל bezeichnet hier die Zuordnung beziehungsweise den Dienst am König. Die deutsche Genitivverbindung gibt dies idiomatisch wieder.
- source_word: חוּשַׁי
  choice: Huschai
  rationale: Der Personenname wird transliteriert.
- source_word: הָאַרְכִּי
  choice: der Arkiter
  rationale: Die Bezeichnung weist auf Huschais Herkunft oder Gruppenzugehörigkeit hin; »Arkiter« ist eine verständliche deutsche Transliteration.
- source_word: רֵעַ
  choice: Freund
  rationale: Die Grundbedeutung ist »Freund«, kann im königlichen Umfeld aber zugleich einen vertrauten Gefährten oder Hofvertrauten bezeichnen; die offenere Wiedergabe bleibt im Haupttext erhalten.
- source_word: הַמֶּלֶךְ
  choice: des Königs
  rationale: Die Zugehörigkeitsbeziehung wird in natürlichem Deutsch durch den Genitiv ausgedrückt.
- source_word: וַ / וְ
  choice: Und … und
  rationale: Die Konjunktionen verbinden diesen Eintrag mit der umgebenden Liste und die beiden Aussagen miteinander.
