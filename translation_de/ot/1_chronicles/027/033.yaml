  text: And Ahithophel was counselor to the king[a], and Hushai the Archite was the king’s friend.
translation:
  language: de
  text: Und Ahitofel war der Ratgeber des Königs, und Huschai, der Arkiter, war der Freund des Königs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Vertraute« beziehungsweise »Gefährte«; das hebräische Wort bezeichnet allgemein einen Freund, kann im königlichen Umfeld aber auch einen vertrauten Hofgefährten meinen.'
