base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/024.yaml
  text: Joab son of Zeruiah began to count[a], but he did not finish; and because of this wrath came upon Israel[b]. And the number was not entered in the account of the chronicles of King David.
translation:
  language: de
  text: Joab, der Sohn Zerujas, begann zu zählen, führte die Zählung aber nicht zu Ende. Deshalb kam Zorn über Israel. Und die Zahl wurde nicht in die Aufzeichnungen der Chronik[a] des Königs David aufgenommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit der „Chronik“ sind die König David zugeordneten königlichen Annalen beziehungsweise amtlichen Aufzeichnungen gemeint.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „Die Zahl ging nicht hinauf“; gemeint ist vermutlich, dass sie nicht in die amtliche Aufzeichnung eingetragen oder darin berücksichtigt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵחֵל לִמְנוֹת
  choice: begann zu zählen
  rationale: Die Verbindung von החל („beginnen“) und מנה („zählen“) wird direkt und natürlich wiedergegeben, ohne den im Hebräischen nicht ausdrücklich genannten Begriff „Volkszählung“ einzufügen.
- source_word: וְלֹא כִלָּה
  choice: führte die Zählung aber nicht zu Ende
  rationale: כלה bezeichnet hier das Vollenden. Die Wiederaufnahme von „Zählung“ macht den Bezug im Deutschen eindeutig und bleibt inhaltlich eng am Ausgangstext.
- source_word: וַיְהִי בָזֹאת קֶצֶף עַל יִשְׂרָאֵל
  choice: Deshalb kam Zorn über Israel
  rationale: בזאת wird kausal als „deshalb“ verstanden; קצף bleibt als „Zorn“ stehen. Die Formulierung bewahrt den im Hebräischen nicht ausdrücklich genannten Urheber des Zorns.
- source_word: הַמִּסְפָּר
  choice: die Zahl
  rationale: Die direkte Wiedergabe bezeichnet das Ergebnis der begonnenen Zählung und erhält die Wortverbindung zum vorherigen Satz.
- source_word: וְלֹא עָלָה
  choice: wurde nicht … aufgenommen
  rationale: עלה bedeutet wörtlich „hinaufgehen“, wird hier aber im Zusammenhang amtlicher Aufzeichnungen idiomatisch im Sinn von „eingetragen/aufgenommen werden“ verstanden.
- source_word: בְּמִסְפַּר דִּבְרֵי הַיָּמִים
  choice: in das Verzeichnis der Chronik
  rationale: דברי הימים bezeichnet Annalen beziehungsweise eine Chronik; מספר trägt hier den Gedanken eines geordneten Verzeichnisses oder einer amtlichen Aufstellung.
- source_word: לַמֶּלֶךְ דָּוִיד
  choice: König Davids
  rationale: Der Lamed kennzeichnet hier die Zuordnung der Chronik zu König David; der deutsche Genitiv gibt diese Beziehung knapp und natürlich wieder.
theological_decisions:
- issue: Ob der Urheber des Zorns ausdrücklich als Gott benannt werden soll
  choice: 'Den Urheber unausgesprochen lassen: „Zorn kam über Israel“'
  alternative: „Der Zorn des HERRN kam über Israel“ oder „Gott wurde zornig über Israel“
  rationale: Der weitere Erzählzusammenhang legt göttlichen Zorn nahe, doch in diesem hebräischen Satz wird Gott nicht ausdrücklich genannt. Die Übersetzung bewahrt diese Zurückhaltung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zeru­ja“ folgt der üblichen deutschen Namensform; die Satzfolge bleibt nah am Hebräischen. Das einleitende „Und“ im letzten Satz bildet die hebräische Verknüpfung ab, ohne eine stärkere Folgerungsbeziehung einzutragen.
