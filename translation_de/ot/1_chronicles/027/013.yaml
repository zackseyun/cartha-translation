base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/013.yaml
  text: 'The tenth[a], for the tenth month: Mahrai the Netophathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: de
  text: 'Der Zehnte für den zehnten Monat: Mahrai aus Netofa, aus dem Clan der Serachiter; seine Abteilung zählte 24.000 Mann.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: Der zehnte
  rationale: Das substantivisch gebrauchte Ordinalwort bezeichnet im Zusammenhang der Liste den zehnten Befehlshaber beziehungsweise den zehnten Turnus; die knappe Form bewahrt die Ausdrucksweise des Hebräischen.
- source_word: לַחֹדֶשׁ הָעֲשִׂירִי
  choice: für den zehnten Monat
  rationale: Die Präposition ל kennzeichnet hier die Zuweisung zum monatlichen Dienstturnus.
- source_word: מַהְרַי
  choice: Mahrai
  rationale: Der Personenname wird in einer dem Hebräischen nahen deutschen Umschrift wiedergegeben.
- source_word: הַנְּטוֹפָתִי
  choice: aus Netofa
  rationale: Das Nisbe bezeichnet die Herkunft aus Netofa; diese Wiedergabe ist im modernen Deutschen natürlicher als eine eingedeutschte Gentilform.
- source_word: לַזַּרְחִי
  choice: vom Serachiterklan
  rationale: Die Form bezeichnet wahrscheinlich die Zugehörigkeit zur Sippe beziehungsweise zum Klan der Serachiter; die Übersetzung macht diesen genealogischen Sinn verständlich.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: seine Abteilung umfasste
  rationale: מַחֲלֻקָה bezeichnet hier die militärische Dienstabteilung. Die idiomatische deutsche Form gibt die im Hebräischen elliptisch ausgedrückte Zuordnung der Truppenstärke wieder.
- source_word: עֶשְׂרִים וְאַרְּבָעָה אָלֶף
  choice: 24.000 Mann
  rationale: Die Zahl wird in üblicher deutscher Schreibweise wiedergegeben; „Mann“ verdeutlicht aus dem militärischen Kontext, was gezählt wird.
