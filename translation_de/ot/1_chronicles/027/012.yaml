  yaml_path: translation/ot/1_chronicles/027/012.yaml
  text: 'The ninth, for the ninth month: Abiezer the Anathothite, from Benjamin; and over his division were twenty-four thousand.'
translation:
  language: de
  text: Der neunte Befehlshaber für den neunten Monat war Abiëser, der Anatotiter, ein Benjaminiter. Seine Abteilung umfasste 24.000 Mann.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעַנְתֹתִי
  choice: aus Anatot
  rationale: Das Gentiliz bezeichnet Abiëser als Mann aus dem Ort Anatot; eine natürliche deutsche Herkunftsangabe ist verständlicher als „der Anatotiter“.
- source_word: ל/בנימיני
  choice: aus Benjamin
  rationale: Der unvokalisierte Konsonantentext und der Kontext stützen die Zuordnung zu Benjamin; die Formulierung wahrt die knappe Herkunftsangabe der Vorlage.
- source_word: מַחֲלֻקְתּוֹ
  choice: seine Abteilung
  rationale: Im Zusammenhang der monatlichen Heereseinteilungen bezeichnet das Wort eine organisierte Abteilung.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24.000 Mann
  rationale: Die Zahl wird im Deutschen übersichtlich in Ziffern wiedergegeben; „Mann“ ergibt sich aus dem militärischen Kontext und macht die elliptische Angabe natürlich verständlich.
