base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/029.yaml
  text: Over the herds grazing in Sharon was Shitrai the Sharonite[b][a], and over the herds in the valleys was Shaphat son of Adlai.
translation:
  language: de
  text: Für die Rinderherden, die in Scharon weideten, war Schitrai, der Scharoniter[a], zuständig; für die Rinderherden in den Tälern war Schafat, der Sohn Adlais, zuständig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Scharoniter«; gemeint ist ein Mann aus der Region Scharon.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  choice: über … war … eingesetzt
  rationale: עַל bezeichnet in dieser Verwaltungsliste die Zuständigkeit. Die deutsche Formulierung macht das elliptische hebräische Satzgefüge verständlich, ohne eine konkrete Amtsbezeichnung hinzuzufügen.
- source_word: הַבָּקָר
  choice: die Rinderherden
  rationale: בקר bezeichnet Rinder beziehungsweise Rindvieh; »Rinderherden« passt zum Weiden und zum administrativen Zusammenhang.
- source_word: הָרֹעִים
  choice: die … weideten
  rationale: Das Partizip von רעה beschreibt die Rinder als weidend. Ein deutscher Relativsatz gibt diese Beziehung natürlich wieder.
- source_word: בַּשָּׁרוֹן
  choice: in der Scharon-Ebene
  rationale: Scharon ist hier die Küstenebene Israels. Die Ergänzung »-Ebene« macht den geografischen Bezug für heutige Leser unmittelbar verständlich.
- source_word: שטרי
  choice: Schitrai
  rationale: Der Personenname wird in einer dem Hebräischen angenäherten deutschen Form wiedergegeben.
- source_word: הַשָּׁרוֹנִי
  choice: aus Scharon
  rationale: Das Gentiliz bezeichnet einen Mann aus der Region Scharon; »aus Scharon« ist im modernen Deutsch natürlicher als eine substantivierte Herkunftsbezeichnung.
- source_word: בָּעֲמָקִים
  choice: in den Tälern
  rationale: Der Plural von עמק bedeutet wörtlich »Täler« beziehungsweise tiefer gelegene Gebiete; die direkte Wiedergabe bewahrt die geografische Offenheit.
- source_word: שָׁפָט
  choice: Schafat
  rationale: Der Personenname wird nach üblicher deutscher Bibeltransliteration wiedergegeben.
- source_word: בֶּן עַדְלָי
  choice: der Sohn Adlais
  rationale: Die hebräische Abstammungsangabe wird in natürlichem, zugleich formal transparentem Deutsch wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Verwaltungsformel des Hebräischen bleibt erkennbar; »war … eingesetzt« verdeutlicht lediglich die im Ausgangstext elliptisch ausgedrückte Zuständigkeit. Der Fußnotenmarker steht unmittelbar nach der Herkunftsangabe.
