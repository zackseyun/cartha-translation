  yaml_path: translation/ot/1_chronicles/027/021.yaml
  text: 'for the half-tribe of Manasseh in Gilead: Iddo son of Zechariah[a]; for Benjamin: Jaasiel son of Abner.'
translation:
  language: de
  text: 'für die Hälfte des Stammes Manasse in Gilead: Jiddo, der Sohn Secharjas; für Benjamin: Jaasiel[a], der Sohn Abners.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Andere Schreibweise: Jaschiel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַ/חֲצִי הַ/מְנַשֶּׁה
  choice: für den halben Stamm Manasse
  rationale: חֲצִי bezeichnet hier im Zusammenhang der Verwaltungsliste die Hälfte des Stammes Manasse. „Stamm“ wird zum natürlichen und eindeutigen Verständnis ergänzt.
- source_word: גִּלְעָדָ/ה
  choice: in Gilead
  rationale: Die Form mit lokal-direktionaler Endung bezeichnet hier die Region, der diese Hälfte Manasses zugeordnet ist; im Deutschen gibt „in Gilead“ den Sinn des Listenkontexts natürlich wieder.
- source_word: יִדּוֹ
  choice: Jiddo
  rationale: Der Personenname wird in einer dem Hebräischen nahen, im Deutschen gut lesbaren Form wiedergegeben.
- source_word: בֶּן זְכַרְיָהוּ
  choice: der Sohn Secharjas
  rationale: Die genealogische Formel בֶּן wird idiomatisch mit „der Sohn“ wiedergegeben; Secharja ist die im Deutschen geläufige Form des Namens.
- source_word: לְ/בִנְיָמִן
  choice: für Benjamin
  rationale: Das Präfix לְ kennzeichnet wie zuvor die Stammesgruppe, für die der genannte Amtsträger zuständig ist.
- source_word: יַעֲשִׂיאֵל
  choice: Jaasiël
  rationale: Diese Umschrift folgt der masoretischen Vokalisierung und macht durch das Trema die getrennte Aussprache der Vokale sichtbar.
- source_word: בֶּן אַבְנֵר
  choice: der Sohn Abners
  rationale: Die genealogische Wendung wird in natürlichem Deutsch wiedergegeben; „Abner“ ist die geläufige Namensform.
