  register: Knappes, würdiges Listendeutsch mit ergänztem „Stamm“ zur Klarheit. Die parallele Verwaltungsstruktur des hebräischen Textes bleibt durch die zweimalige Formulierung mit „für“ und den Doppelpunkt erhalten. Der Fußnotenmarker steht unmittelbar beim tatsächlich betroffenen Namen.
