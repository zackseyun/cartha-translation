base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/006.yaml
  text: So David and all Israel went up to Baalah[a], that is, to Kiriath-jearim, which belongs to Judah, to bring up from there the ark of God, Yahweh who is enthroned above the cherubim, whose name is called upon it.
translation:
  language: de
  text: Da zogen David und ganz Israel nach Baala hinauf, das heißt nach Kirjat-Jearim, das zu Juda gehört, um von dort die Lade Gottes, Jahwes, der über den Cherubim thront und dessen Name genannt wird, heraufzubringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit Bezug auf die Lade: „die nach seinem Namen genannt wird.“ Die hebräische Schlussklausel ist knapp und ihr syntaktischer Bezug nicht eindeutig; vgl. 2. Samuel 6,2.'
    reason: Bewahrt die objektsbezogene Lesart und erläutert die Ellipse, ohne die im Hebräischen nicht ausdrücklich vorhandene räumliche Ergänzung als alleinige Bedeutung festzulegen.
lexical_decisions:
- source_word: וַיַּעַל
  choice: zogen … hinauf
  rationale: Das Verb עלה bezeichnet ein Hinaufziehen; im deutschen Reisebericht gibt „zogen … hinauf“ Richtung und gemeinschaftliche Bewegung natürlich wieder.
- source_word: בַּעֲלָתָה אֶל־קִרְיַת יְעָרִים
  choice: nach Baala hinauf, das heißt nach Kirjat-Jearim
  rationale: Die beiden Ortsnamen stehen identifizierend nebeneinander. „Das heißt“ macht diese Apposition verständlich, ohne zwei Reiseziele anzunehmen.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: das zu Juda gehört
  rationale: Die Lamed-Verbindung bezeichnet hier die territoriale Zugehörigkeit zu Juda.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: um von dort … heraufzubringen
  rationale: Der kausative Infinitiv von עלה bezeichnet das Hinaufbringen der Lade und bewahrt zugleich den sprachlichen Bezug zum vorausgehenden Hinaufziehen.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Dies ist die natürliche deutsche Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: יוֹשֵׁב הַכְּרוּבִים
  choice: der über den Kerubim thront
  rationale: ישׁב kann im königlichen Kontext „thronen“ bedeuten. „Über“ entspricht der mit der Lade verbundenen Thronvorstellung, ist jedoch gegenüber dem präpositionslosen Hebräisch leicht deutend.
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  choice: dessen Name über ihr ausgerufen wird
  rationale: Die elliptische Passivkonstruktion wird auf Jahwe und die Lade bezogen. Die Formulierung bewahrt das Motiv des über der Lade ausgerufenen Namens; eine andere mögliche syntaktische Deutung steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Wiedergabe als Eigenname wahrt diese Unterscheidung und vermeidet die Ersetzung durch einen Titel.
- issue: Bezug und Sinn von אֲשֶׁר נִקְרָא שֵׁם
  choice: dessen Name über ihr ausgerufen wird
  alternative: die nach dem Namen genannt ist
  rationale: Die hebräische Schlussklausel ist elliptisch und syntaktisch mehrdeutig. Der Haupttext folgt der möglichen Beziehung des Relativsatzes auf Jahwe und ergänzt den Bezug zur Lade idiomatisch; die Fußnote hält die objektbezogene Deutung offen.
- issue: Königliche Bildsprache in יוֹשֵׁב הַכְּרוּבִים
  choice: der über den Kerubim thront
  alternative: der bei den Kerubim sitzt
  rationale: „Thront“ bringt die in der Lade- und Kerubimvorstellung liegende Königssymbolik natürlich zum Ausdruck, ohne die Kerubim mit Gott gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle biblische Ortsnamensform „Kirjat-Jearim“ und der etablierte Begriff „Lade“ bleiben erhalten. Der Doppelpunkt verdeutlicht die nachgestellte nähere Bestimmung, ohne zusätzliche theologische Aussagen einzuführen.
