source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ כָֽל הַ/קָּהָ֖ל לַ/עֲשׂ֣וֹת כֵּ֑ן כִּֽי יָשַׁ֥ר הַ/דָּבָ֖ר בְּ/עֵינֵ֥י כָל הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/004.yaml
  text: And all the assembly said to do so[a], for the matter was right in the eyes of all the people.
translation:
  language: de
  text: Da sagte die ganze Versammlung, man solle es so machen[a], denn die Sache war in den Augen des ganzen Volkes richtig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ganze Versammlung sagte, dass man es so machen solle“; die hebräische Formulierung bringt die Zustimmung der Versammlung zu dem Vorschlag zum Ausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagte
  rationale: Die Form ist ein Wayyiqtol von אמר („sagen“). Im Zusammenhang bringt das Sagen zugleich die Zustimmung der Versammlung zum Ausdruck, ohne das Verb unmittelbar mit „zustimmen“ wiederzugeben.
- source_word: כָל הַקָּהָל
  choice: die ganze Versammlung
  rationale: קָהָל bezeichnet hier die versammelte Gemeinschaft. „Die ganze Versammlung“ ist im modernen Deutsch natürlich und bewahrt den umfassenden Sinn von כָל.
- source_word: לַעֲשׂוֹת כֵּן
  choice: man solle es so machen
  rationale: Der Infinitiv mit כֵּן bedeutet idiomatisch „es so tun/machen“. Der abhängige Aufforderungssatz gibt die Zustimmung der Versammlung im Deutschen klar und natürlich wieder.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die Zustimmung ein; „denn“ bewahrt diesen erklärenden Zusammenhang.
- source_word: יָשַׁר
  choice: richtig
  rationale: יָשַׁר bewertet die Angelegenheit hier als recht, angemessen oder gut. „Richtig“ ist knapp, verständlich und lässt die genaue Nuance offen.
- source_word: הַדָּבָר
  choice: die Sache
  rationale: דָּבָר kann „Wort“, „Sache“ oder „Angelegenheit“ bedeuten. „Die Sache“ verweist auf den besprochenen Vorschlag, ohne ihn im Text ausdrücklich als solchen festzulegen.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die hebräische Wendung bezeichnet die Beurteilung aus der Sicht einer Personengruppe. Das entsprechende deutsche Bild ist verständlich und bewahrt die Ausdrucksweise des Ausgangstextes.
- source_word: כָל הָעָם
  choice: des ganzen Volkes
  rationale: עָם bezeichnet das Volk als Gesamtheit; „des ganzen Volkes“ gibt כָל und die kollektive Bedeutung präzise wieder.
