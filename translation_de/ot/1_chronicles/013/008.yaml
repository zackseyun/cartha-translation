  text: וְ/דָוִ֣יד וְ/כָל יִשְׂרָאֵ֗ל מְשַׂחֲקִ֛ים לִ/פְנֵ֥י הָ/אֱלֹהִ֖ים בְּ/כָל עֹ֑ז וּ/בְ/שִׁירִ֤ים וּ/בְ/כִנֹּרוֹת֙ וּ/בִ/נְבָלִ֣ים וּ/בְ/תֻפִּ֔ים וּ/בִ/מְצִלְתַּ֖יִם וּ/בַ/חֲצֹצְרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/008.yaml
  text: And David and all Israel were celebrating before God with all their might[a], with songs, lyres, harps, tambourines, cymbals, and trumpets.
translation:
  language: de
  text: David und ganz Israel feierten[a] vor Gott mit ganzer Kraft, mit Liedern, Leiern, Harfen, Tamburinen, Zimbeln und Trompeten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »spielten« beziehungsweise »waren fröhlich«; das hebräische Verb kann eine spielerische oder ausgelassen-freudige Tätigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: feierten
  rationale: Das Partizip von שׂחק bezeichnet hier im Zusammenhang der Prozession und der Musik eine ausgelassene, freudige Tätigkeit. »Feierten« gibt diesen festlichen Sinn im heutigen Deutsch natürlich wieder, ohne das Verb auf das Spielen von Instrumenten einzuengen.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: vor Gott
  rationale: Die Wendung bezeichnet das Handeln in Gottes Gegenwart. »Vor Gott« ist knapp, idiomatisch und bewahrt den gottesdienstlichen Bezug.
- source_word: בְּכָל עֹז
  choice: mit ganzer Kraft
  rationale: עֹז bezeichnet Stärke oder Kraft. Die Formulierung bringt die volle, tatkräftige Beteiligung der gesamten Gruppe zum Ausdruck.
- source_word: שִׁירִים
  choice: Liedern
  rationale: Der hebräische Plural bezeichnet wörtlich Lieder; die nominale Form bleibt erhalten.
- source_word: כִנֹּרוֹת
  choice: Leiern
  rationale: כִּנּוֹר bezeichnet wahrscheinlich ein leierartiges Saiteninstrument. »Leiern« ist sachlich genauer als die traditionelle Wiedergabe »Harfen«.
- source_word: נְבָלִים
  choice: Harfen
  rationale: נֵבֶל bezeichnet ein weiteres, von der כִּנּוֹר unterschiedenes Saiteninstrument. Da seine genaue Bauart unsicher ist, bietet »Harfen« eine verständliche Wiedergabe und hält die Unterscheidung zu den Leiern aufrecht.
- source_word: תֻפִּים
  choice: Tamburinen
  rationale: תֹּף bezeichnet eine Rahmentrommel beziehungsweise ein tamburinartiges Schlaginstrument. »Tamburinen« ist die allgemein verständliche moderne Entsprechung.
- source_word: מְצִלְתַּיִם
  choice: Zimbeln
  rationale: Dies ist die übliche und sachlich gesicherte Bezeichnung für das genannte Schlaginstrument.
- source_word: חֲצֹצְרוֹת
  choice: Trompeten
  rationale: Das Wort bezeichnet gerade zeremonielle Trompeten. Das Material wird im Vers nicht genannt und daher nicht ergänzt.
- source_word: וְדָוִיד וְכָל יִשְׂרָאֵל
  choice: David und ganz Israel
  rationale: »Ganz Israel« gibt das kollektive כָל יִשְׂרָאֵל natürlich wieder. Das einleitende וְ wird im Deutschen nicht eigens mit »und« wiedergegeben, da der Vers als selbstständig zitierter Satz so flüssiger beginnt.
theological_decisions:
- issue: Wiedergabe von הָאֱלֹהִים
  choice: Gott
  alternative: der Gott
  rationale: Der bestimmte Artikel kennzeichnet hier den Gott Israels, verlangt im Deutschen aber nicht die unnatürliche Formulierung »der Gott«. »Gott« erhält den eindeutigen Bezug und entspricht dem normalen deutschen Sprachgebrauch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Aufzählung der Instrumente. Die festliche Dynamik der Prozession bleibt erhalten; die unsichere Bedeutungsbreite von מְשַׂחֲקִים wird durch eine Fußnote offengelegt.
