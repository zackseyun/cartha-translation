  text: וַ/יָּבֹ֖אוּ עַד גֹּ֣רֶן כִּידֹ֑ן וַ/יִּשְׁלַ֨ח עֻזָּ֜א אֶת יָד֗/וֹ לֶ/אֱחֹז֙ אֶת הָ֣/אָר֔וֹן כִּ֥י שָֽׁמְט֖וּ הַ/בָּקָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/009.yaml
  text: When they came to the threshing floor of Kidon[a], Uzza reached out his hand to take hold of the ark, because the oxen stumbled.
translation:
  language: de
  text: Als sie zur Tenne Kidons[a] kamen, streckte Usa seine Hand aus, um die Lade festzuhalten, denn die Rinder waren ausgerutscht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Tenne bei Kidon“. Die hebräische Namensverbindung kann unterschiedlich aufgefasst werden.'
    reason: syntactic_alternative
  - marker: b
    text: 'Oder: „denn die Rinder strauchelten“. Das hebräische Verb kann ein Ausgleiten oder eine Bewegung bezeichnen, durch die etwas fallengelassen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן כִּידֹן
  choice: Tenne Kidons
  rationale: גֹּרֶן bezeichnet eine Tenne; כִּידֹן wird als Eigenname Kidon wiedergegeben. Der Genitiv entspricht der hebräischen Verbindung, ohne zu entscheiden, ob Kidon eine Person oder ein Ort ist.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ
  choice: streckte ... seine Hand aus
  rationale: Die Wendung mit שׁלח und ‚Hand‘ bezeichnet das Ausstrecken der Hand und wird im Deutschen natürlich und körperlich konkret wiedergegeben.
- source_word: לֶאֱחֹז
  choice: um ... festzuhalten
  rationale: אחז bedeutet ergreifen oder festhalten. Im Zusammenhang bezeichnet es den Versuch, die Lade zu stabilisieren, ohne einen gewaltsamen Zugriff anzudeuten.
- source_word: הָאָרוֹן
  choice: die Lade
  rationale: Der hebräische Text hat hier nur ‚die Lade‘. Eine Ergänzung wie ‚Gottes‘ wird nicht aus dem Kontext in den Vers eingefügt.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt den Grund für Usas Handlung an. ‚Denn‘ erhält den erzählenden Satzfluss in natürlichem Deutsch.
- source_word: שָׁמְטוּ
  choice: waren ausgerutscht
  rationale: Das Verb kann ein Ausgleiten oder Fallenlassen bezeichnen. Mit den Rindern als Subjekt liegt eine destabilisierende Bewegung der Zugtiere nahe; die genaue Nuance bleibt in der Fußnote sichtbar.
- source_word: הַבָּקָר
  choice: die Rinder
  rationale: בָּקָר bezeichnet Rinder beziehungsweise Großvieh. ‚Rinder‘ ist im modernen Standarddeutsch präzise und vermeidet die mögliche Engführung von ‚Ochsen‘ auf kastrierte männliche Tiere.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. ‚Tenne‘ ist der sachlich genaue und im biblischen Zusammenhang weiterhin verständliche Ausdruck. Die Satzstellung folgt natürlichem Standarddeutsch und bewahrt zugleich die Abfolge des hebräischen Berichts.
