base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/001.yaml
  text: And David consulted with the commanders of the thousands and the hundreds[a], with every leader.
translation:
  language: de
  text: David beriet sich mit den Befehlshabern der Tausendschaften und Hundertschaften, mit jedem Anführer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »mit jedem Führenden«; möglich ist auch: »mit den Obersten über Tausend und Hundert, mit jedem Anführer«.'
    reason: Die hebräische Formulierung לְכָל נָגִיד und die Amtsbezeichnungen lassen sich unterschiedlich eng und wörtlich wiedergeben.
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: beriet sich
  rationale: Das Nifal von יעץ bezeichnet hier gemeinsames Beraten; die reflexive deutsche Wendung gibt den wechselseitigen, deliberativen Sinn natürlich wieder.
- source_word: עִם
  choice: mit
  rationale: Die Präposition bezeichnet die Personen, mit denen David sich beriet.
- source_word: שָׂרֵי
  choice: Befehlshabern
  rationale: Im Zusammenhang mit Tausend- und Hundertschaften bezeichnet שָׂרֵי militärische beziehungsweise organisatorische Führer.
- source_word: הָאֲלָפִים וְהַמֵּאוֹת
  choice: der Tausendschaften und Hundertschaften
  rationale: Die Ausdrücke bezeichnen wahrscheinlich militärische oder administrative Einheiten. »Tausendschaften« und »Hundertschaften« bewahren diese organisatorische Bedeutung besser als bloße Zahlwörter.
- source_word: לְכָל נָגִיד
  choice: mit allen führenden Männern
  rationale: נָגִיד bezeichnet eine Person in leitender Stellung. Die Wiedergabe bleibt breit und lässt offen, ob militärische, politische oder administrative Führer gemeint sind; לְ wird als Fortführung des Kreises der Beratenen verstanden.
