  text: וַ/יַּרְכִּ֜יבוּ אֶת אֲר֤וֹן הָ/אֱלֹהִים֙ עַל עֲגָלָ֣ה חֲדָשָׁ֔ה מִ/בֵּ֖ית אֲבִינָדָ֑ב וְ/עֻזָּ֣א וְ/אַחְי֔וֹ נֹהֲגִ֖ים בָּ/עֲגָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/007.yaml
  text: So they set the ark of God on a new cart from the house of Abinadab[a], and Uzza and Ahio were guiding the cart.
translation:
  language: de
  text: Sie luden die Lade Gottes auf einen neuen Wagen und brachten sie aus dem Haus Abinadabs weg. Usa und Achjo lenkten[a] den Wagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: führten. Das hebräische Wort kann das Führen oder Antreiben eines Fahrzeugs beziehungsweise seiner Zugtiere bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכִּיבוּ
  choice: sie setzten … auf
  rationale: Die Kausativform von רכב bezeichnet hier, dass die Lade auf einem Fahrzeug befördert werden sollte. „Auf einen Wagen setzen“ gibt die konkrete Handlung natürlich und quellenah wieder.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: „Lade“ ist im kultischen Zusammenhang die etablierte und genaue deutsche Wiedergabe von אֲרוֹן; die Genitivverbindung entspricht der hebräischen Status-constructus-Verbindung.
- source_word: עַל עֲגָלָה חֲדָשָׁה
  choice: auf einen neuen Wagen
  rationale: עֲגָלָה bezeichnet einen Wagen oder Karren. „Wagen“ ist in diesem Erzählzusammenhang natürlich; das ausdrücklich genannte „neu“ bleibt erhalten.
- source_word: מִבֵּית אֲבִינָדָב
  choice: aus dem Haus Abinadabs weg
  rationale: מִן bezeichnet hier den Ausgangspunkt. Die Ergänzung „brachten sie … weg“ macht den räumlichen Bezug im Deutschen verständlich, ohne das Transportgeschehen inhaltlich zu verändern.
- source_word: עֻזָּא
  choice: Usa
  rationale: Gebräuchliche deutsche Umschrift des Personennamens.
- source_word: אַחְיוֹ
  choice: Achjo
  rationale: Gebräuchliche deutsche Umschrift des Personennamens.
- source_word: נֹהֲגִים
  choice: lenkten
  rationale: Das Partizip von נהג kann das Führen oder Antreiben eines Fahrzeugs beziehungsweise seiner Zugtiere bezeichnen. „Lenkten“ drückt die fortlaufende Kontrolle des Wagens in natürlichem Deutsch aus.
- source_word: בָּעֲגָלָה
  choice: den Wagen
  rationale: Bei נהג bezeichnet ב das geführte Fahrzeug. Im Deutschen wird dies idiomatisch als direktes Objekt wiedergegeben.
