source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לְ/כֹ֣ל קְהַ֣ל יִשְׂרָאֵ֗ל אִם עֲלֵי/כֶ֨ם ט֜וֹב וּ/מִן יְהוָ֣ה אֱלֹהֵ֗י/נוּ נִפְרְצָה֙ נִשְׁלְחָ֞ה עַל אַחֵ֣י/נוּ הַ/נִּשְׁאָרִ֗ים בְּ/כֹל֙ אַרְצ֣וֹת יִשְׂרָאֵ֔ל וְ/עִמָּ/הֶ֛ם הַ/כֹּהֲנִ֥ים וְ/הַ/לְוִיִּ֖ם בְּ/עָרֵ֣י מִגְרְשֵׁי/הֶ֑ם וְ/יִקָּבְצ֖וּ אֵלֵֽי/נוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/002.yaml
  text: And David said to all the assembly of Israel[a], “If it seems good to you, and if it is from Yahweh our God, let us send word to our brothers who remain in all the lands of Israel, and also to the priests and Levites with them in the cities of their pasturelands[d][c][b], that they may gather to us.”
translation:
  language: de
  text: 'Und David sagte zur ganzen Versammlung Israels: »Wenn es euch gut erscheint und wenn es von Jahwe, unserem Gott, kommt, dann lasst uns überallhin Botschaft senden[a] zu unseren Brüdern[b], die in allen Gebieten Israels[c] geblieben sind, ebenso zu den Priestern und Leviten bei ihnen in ihren Städten mit den dazugehörigen Weideflächen[d], damit sie sich bei uns versammeln.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Lasst uns ausbrechen; lasst uns senden.« Wahrscheinlich ist damit gemeint, die Botschaft weithin auszusenden.'
    reason: lexical_alternative
  - marker: b
    text: Mit »Brüdern« sind hier die anderen Israeliten gemeint.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »in allen Ländern Israels«; gemeint sind die verschiedenen Gebiete des Landes.'
    reason: lexical_alternative
  - marker: d
    text: Das sind die offenen Nutz- und Weideflächen, die zu diesen Städten gehörten.
    reason: cultural_note
lexical_decisions:
- source_word: קְהַל
  choice: Versammlung
  rationale: Bezeichnet hier die versammelte Gesamtheit Israels; „Versammlung“ ist natürlich und vermeidet unnötige kirchliche Nebenbedeutungen.
- source_word: אִם עֲלֵיכֶם טוֹב
  choice: Wenn es euch gut erscheint
  rationale: Gibt die hebräische Zustimmungsformel idiomatisch wieder und bewahrt den Aufruf an das Urteil der Versammlung.
- source_word: וּמִן יְהוָה אֱלֹהֵינוּ
  choice: und wenn es von Jahwe, unserem Gott, kommt
  rationale: Das im zweiten Bedingungsglied ausgelassene Prädikat wird im Deutschen ergänzt; „von Jahwe kommt“ bewahrt den Gedanken göttlicher Billigung, ohne ihn näher festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Form des im Hebräischen ausdrücklich stehenden Gottesnamens.
- source_word: נִפְרְצָה נִשְׁלְחָה
  choice: lasst uns überallhin Botschaft senden
  rationale: Die aufeinanderfolgenden Kohortative lauten wörtlich etwa „lasst uns ausbrechen; lasst uns senden“. Im Zusammenhang bezeichnet der erste wahrscheinlich die weite Ausbreitung der Aussendung; die Fußnote bewahrt die ungewöhnliche Bildsprache und ihre Unsicherheit.
- source_word: עַל אַחֵינוּ
  choice: zu unseren Brüdern
  rationale: Mit dem Verb des Sendens bezeichnet עַל hier die Adressaten. „Brüder“ erhält die Verwandtschaftsbezeichnung des Ausgangstextes.
- source_word: הַנִּשְׁאָרִים
  choice: die ... geblieben sind
  rationale: Gibt das Partizip schlicht wieder, ohne durch „Rest“ eine hier nicht zwingende heilsgeschichtliche Deutung einzutragen.
- source_word: בְּכֹל אַרְצוֹת יִשְׂרָאֵל
  choice: in allen Gebieten Israels
  rationale: „Gebiete“ gibt den hebräischen Plural natürlich wieder und bezeichnet die verschiedenen Landesteile Israels.
- source_word: וְעִמָּהֶם הַכֹּהֲנִים וְהַלְוִיִּם
  choice: ebenso zu den Priestern und Leviten bei ihnen
  rationale: Macht deutlich, dass auch die unter den übrigen Israeliten wohnenden Priester und Leviten Adressaten der Botschaft sind.
- source_word: בְּעָרֵי מִגְרְשֵׁיהֶם
  choice: in ihren Städten mit den dazugehörigen Weideflächen
  rationale: מִגְרָשׁ bezeichnet das einer Stadt zugeordnete offene Nutz- oder Weideland. Die Formulierung stellt die Zugehörigkeit zur jeweiligen Stadt verständlich dar.
- source_word: וְיִקָּבְצוּ אֵלֵינוּ
  choice: damit sie sich bei uns versammeln
  rationale: Der Imperfekt drückt hier den Zweck der Aussendung aus; אֵלֵינוּ gibt die Bewegung hin zu David und der Versammlung an.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht ausdrücklich im hebräischen Text. „Jahwe“ bewahrt ihn als Namen; die deutsche Schreibweise entspricht der üblichen Wiedergabe von YHWH.
- issue: Bedeutung von הַנִּשְׁאָרִים
  choice: die ... geblieben sind
  alternative: der Rest / die Übriggebliebenen
  rationale: Der Ausdruck bezeichnet in diesem Zusammenhang zunächst die außerhalb der gegenwärtigen Versammlung verbliebenen Israeliten. Eine besondere theologische Bedeutung von „Rest“ ist nicht zwingend und wird daher nicht eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und feierlich, ohne altertümliche Satzstellung. Die ungewöhnliche Doppelverbform נִפְרְצָה נִשְׁלְחָה wird im Haupttext verständlich wiedergegeben und in der Fußnote transparent gemacht.
