source:
  edition: WLC
  text: וַ/יִּ֣חַר לְ/דָוִ֔יד כִּֽי פָרַ֧ץ יְהוָ֛ה פֶּ֖רֶץ בְּ/עֻזָּ֑א וַ/יִּקְרָ֞א לַ/מָּק֤וֹם הַ/הוּא֙ פֶּ֣רֶץ עֻזָּ֔א עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/011.yaml
  text: And David was angry because Yahweh had broken out against Uzza[a]; so he called that place Perez-uzza to this day.
translation:
  language: de
  text: Da wurde David zornig, weil Jahwe gegen Usa eine Bresche geschlagen hatte.[a] Darum nannte er jenen Ort Perez-Usa; so heißt er bis auf den heutigen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Perez-Usa“ klingt im Hebräischen wie „Bresche gegen Usa“ oder „Ausbruch gegen Usa“ und greift das Wortspiel in „Jahwe hatte gegen Usa eine Bresche geschlagen“ auf.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְדָוִיד
  choice: Da wurde David zornig
  rationale: Die hebräische Wendung bezeichnet aufflammenden Zorn. Die deutsche Formulierung gibt die Gefühlsreaktion klar und würdig wieder, ohne sie zum bloßen Missfallen abzuschwächen.
- source_word: כִּי
  choice: weil
  rationale: Die Konjunktion leitet hier den Grund für Davids Zorn ein; „weil“ ist im modernen Deutsch die natürliche kausale Entsprechung.
- source_word: פָרַץ יְהוָה פֶּרֶץ בְּעֻזָּא
  choice: weil Jahwe gegen Usa losgebrochen war
  rationale: Verb und verwandtes Substantiv bilden im Hebräischen ein Wortspiel um einen plötzlichen Durchbruch oder Ausbruch. „losgebrochen“ gibt die heftige Bewegung natürlich wieder; die Fußnote erläutert das im Ortsnamen fortgeführte Wortspiel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: Darum nannte er jenen Ort
  rationale: Die Benennungsformel wird idiomatisch wiedergegeben. „Darum“ verdeutlicht den aus dem Zusammenhang hervorgehenden Folgezusammenhang.
- source_word: פֶּרֶץ עֻזָּא
  choice: Perez-Usa
  rationale: Der Ortsname wird in einer im Deutschen gut lesbaren Form transliteriert; seine Bedeutung und sein Bezug zum vorangehenden Wortspiel werden in der Fußnote erklärt.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: so heißt er bis auf den heutigen Tag
  rationale: Die feste Wendung besagt, dass der Name zur Zeit der Abfassung weiterhin gebräuchlich war. Die Ergänzung „so heißt er“ macht den Bezug im Deutschen eindeutig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als persönlichen Gottesnamen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Davids Zorn und sein Bezug
  choice: Da wurde David zornig, weil Jahwe gegen Usa losgebrochen war
  alternative: Da missfiel es David, dass Jahwe Usa getroffen hatte
  rationale: Der Text nennt Davids Zorn, ohne ausdrücklich zu beurteilen, ob dieser Zorn berechtigt war oder gegen wen er sich letztlich richtete. Die Übersetzung bewahrt diese Spannung und fügt keine theologische Bewertung hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist flüssig und verständlich; der hebräische Wortklang wird im Haupttext so weit wie natürlich möglich aufgenommen und in der Fußnote erläutert. Der Name עֻזָּא erscheint in der üblichen deutschen Form „Usa“.
