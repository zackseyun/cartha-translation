  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן הָ/אֱלֹהִ֜ים עִם בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם בְּ/בֵית֖/וֹ שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית עֹבֵֽד אֱדֹ֖ם וְ/אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/014.yaml
  text: And the ark of God remained with the household of Obed-edom[a], in his house, for three months. And Yahweh blessed the household of Obed-edom and all that belonged to him.
translation:
  language: de
  text: Und die Lade Gottes blieb drei Monate lang bei Obed-Edom und seiner Familie, in seinem Haus. Und Jahwe segnete Obed-Edoms Familie und alles, was ihm gehörte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: ישׁב kann „sitzen“, „wohnen“ oder „bleiben“ bedeuten. Im Zusammenhang mit dem vorübergehenden Aufenthaltsort der Lade gibt „blieb“ die fortdauernde Anwesenheit natürlich wieder.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Der hebräische Ausdruck lautet hier schlicht „Lade Gottes“; ein nicht ausdrücklich vorhandener Hinweis auf den Bund wird nicht ergänzt.
- source_word: עִם בֵּית עֹבֵד אֱדֹם
  choice: bei der Hausgemeinschaft Obed-Edoms
  rationale: בֵּית kann sowohl das Gebäude als auch Hausgemeinschaft bzw. Haushalt bezeichnen. Da unmittelbar danach בְּבֵיתוֹ den konkreten Ort „in seinem Haus“ nennt, bildet „Hausgemeinschaft“ die wahrscheinlich soziale Bedeutung ab und wahrt die Unterscheidung.
- source_word: בְּבֵיתוֹ
  choice: in seinem Haus
  rationale: Die Wendung bezeichnet den konkreten räumlichen Aufenthaltsort der Lade.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: drei Monate lang
  rationale: Die deutsche Dauerangabe mit „lang“ ist idiomatisch und entspricht dem hebräischen Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶת בֵּית עֹבֵד אֱדֹם
  choice: die Hausgemeinschaft Obed-Edoms
  rationale: בֵּית bezeichnet hier wahrscheinlich die zu Obed-Edom gehörende Hausgemeinschaft; die Fußnote hält die sachlich mögliche Wiedergabe „Haus“ offen.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: und alles, was ihm gehörte
  rationale: Die Formulierung bewahrt den weiten Umfang des Hebräischen und kann Besitz sowie alles ihm Zugeordnete einschließen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text gebraucht ausdrücklich das Tetragramm. „Jahwe“ gibt den Namen als Namen wieder, ohne ihn durch den traditionellen Ersatztitel zu verdecken.
- issue: Bedeutungsumfang von בֵּית in Bezug auf Obed-Edom
  choice: Hausgemeinschaft
  alternative: Haus
  rationale: Die soziale Bedeutung ist angesichts des anschließenden „in seinem Haus“ wahrscheinlich; da „Haus“ an beiden Stellen dennoch möglich ist, wird diese Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Lade Gottes“ bewahrt die knappe Bezeichnung des Ausgangstextes; „Hausgemeinschaft“ ist allgemein verständlich und unterscheidet die Personen- und Haushaltsgruppe vom ausdrücklich genannten Gebäude.
