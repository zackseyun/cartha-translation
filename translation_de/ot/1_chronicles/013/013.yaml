  text: וְ/לֹֽא הֵסִ֨יר דָּוִ֧יד אֶת הָ/אָר֛וֹן אֵלָ֖י/ו אֶל עִ֣יר דָּוִ֑יד וַ/יַּטֵּ֕/הוּ אֶל בֵּ֥ית עֹבֵֽד אֱדֹ֖ם הַ/גִּתִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/013.yaml
  text: So David did not bring the ark to himself[a], into the City of David; instead[b], he turned it aside to the house of Obed-edom the Gittite.
translation:
  language: de
  text: David brachte die Lade nicht zu sich in die Stadt Davids, sondern bog sie zum Haus Obed-Edoms, des Gatiters, ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sondern leitete sie zum Haus Obed-Edoms, des Gatiters, um.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: brachte … nicht
  rationale: Das Hifil von סור kann „entfernen“, „wegbringen“ oder kontextuell „bringen“ bedeuten. Da anschließend das nicht erreichte Ziel genannt wird, gibt „brachte … nicht“ den Sinn natürlich wieder.
- source_word: אֵלָיו
  choice: zu sich
  rationale: Die Präposition mit Suffix bedeutet wörtlich „zu ihm“; da David zugleich Subjekt ist, ist im Deutschen die reflexive Wiedergabe „zu sich“ angemessen.
- source_word: עִיר דָּוִיד
  choice: die Stadt Davids
  rationale: Die Genitivverbindung bezeichnet den festen Ortsnamen und wird im Deutschen idiomatisch als „Stadt Davids“ wiedergegeben.
- source_word: וַיַּטֵּהוּ
  choice: ließ sie … abbiegen
  rationale: Das Verb נטה bezeichnet hier das Abwenden beziehungsweise Umlenken der Lade von der vorgesehenen Route. Die kausative Form „ließ … abbiegen“ bewahrt das Bild einer Richtungsänderung.
- source_word: בֵּית
  choice: zum Haus
  rationale: בַּיִת kann Haus oder Haushalt bezeichnen; da die Lade an einen Aufbewahrungsort gebracht wird, liegt hier zunächst das konkrete „Haus“ nahe.
- source_word: עֹבֵד אֱדֹם
  choice: Obed-Edoms
  rationale: Der Personenname wird nach geläufiger deutscher Transliterationsweise als „Obed-Edom“ wiedergegeben und in die Genitivkonstruktion eingebunden.
- source_word: הַגִּתִּי
  choice: des Gatiters
  rationale: Das Gentiliz wird direkt und in der traditionellen deutschen Form als „Gatiter“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lade“ folgt dem etablierten biblischen Sprachgebrauch. Die etwas bildhafte Richtungsangabe des Hebräischen bleibt erhalten, wird jedoch mit einer Fußnote erläutert.
