source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/עֻזָּ֔א וַ/יַּכֵּ֕/הוּ עַ֛ל אֲשֶׁר שָׁלַ֥ח יָד֖/וֹ עַל הָ/אָר֑וֹן וַ/יָּ֥מָת שָׁ֖ם לִ/פְנֵ֥י אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/010.yaml
  text: Then Yahweh’s anger burned against Uzza[a], and he struck him down because he had put out his hand to the ark; and he died there before God.
translation:
  language: de
  text: Da entbrannte Yahwehs Zorn gegen Usa, und er schlug ihn nieder, weil er seine Hand nach der Lade ausgestreckt hatte[a]; und er starb dort vor Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil er seine Hand zur Lade ausgestreckt hatte“.'
    reason: Die alternative deutsche Formulierung gibt die Richtung der Handlung wieder, ohne eine Berührung der Lade als ausdrücklich im Vers enthalten auszugeben.
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: Da entbrannte Yahwehs Zorn
  rationale: Die Wendung חרה אף beschreibt bildhaft aufflammenden Zorn. „entbrannte“ bewahrt die Kraft des hebräischen Idioms und klingt im Deutschen natürlich und würdevoll.
- source_word: בְּעֻזָּא
  choice: gegen Usa
  rationale: Die Präposition ב bezeichnet bei dieser Zorneswendung die Person, gegen die sich der Zorn richtet.
- source_word: וַיַּכֵּהוּ
  choice: er schlug ihn nieder
  rationale: נכה kann „schlagen“ oder „niederschlagen“ bedeuten. Der unmittelbar berichtete Tod stützt hier die stärkere, kontextgerechte Wiedergabe.
- source_word: עַל אֲשֶׁר
  choice: weil
  rationale: Die Verbindung leitet den im Text genannten Grund für das Gericht ein.
- source_word: שָׁלַח יָדוֹ עַל הָאָרוֹן
  choice: er seine Hand nach der Lade ausgestreckt hatte
  rationale: Die Formulierung gibt die körperliche Bewegung wieder, ohne Usas Absicht näher zu bestimmen. Das Plusquamperfekt verdeutlicht im Deutschen das vorausgehende Handeln.
- source_word: הָאָרוֹן
  choice: die Lade
  rationale: Der hebräische Text sagt hier nur „die Lade“; der unmittelbare Zusammenhang bestimmt den Gegenstand hinreichend.
- source_word: וַיָּמָת שָׁם
  choice: So starb er dort
  rationale: Die schlichte Folge des Erzähltexts und das Ortsadverb שׁם bleiben erhalten. „So“ stellt den engen Zusammenhang mit dem Niederschlagen natürlich dar.
- source_word: לִפְנֵי אֱלֹהִים
  choice: vor Gott
  rationale: לִפְנֵי bedeutet „vor“ beziehungsweise „in der Gegenwart von“. Die knappe Wendung wahrt die Feierlichkeit des Ausgangstextes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Yahweh“ entspricht der vorgegebenen Namensform und vermeidet, den Namen durch einen Titel zu ersetzen.
- issue: Wechsel von יְהוָה zu אֱלֹהִים innerhalb des Verses
  choice: „Yahweh“ … „vor Gott“
  alternative: Beide Bezeichnungen vereinheitlichen
  rationale: Der lexikalische Wechsel des hebräischen Textes wird bewahrt und nicht harmonisiert.
- issue: Grund von Usas Tod
  choice: Die im Text genannte Handlung wird als Grund wiedergegeben, ohne sein Motiv zu beurteilen
  alternative: Die Handlung ausdrücklich als Ehrfurchtslosigkeit, Ungehorsam oder gut gemeinte Hilfe deuten
  rationale: Der Vers nennt das Ausstrecken der Hand nach der Lade, erläutert aber an dieser Stelle weder Usas innere Absicht noch eine weitergehende theologische Bewertung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt nah am Hebräischen, ohne unnatürliche Hebraismen. Der Name wird in der im Auftrag vorgegebenen Form „Usa“ geschrieben.
