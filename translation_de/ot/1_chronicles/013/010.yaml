  source_fidelity: 'Der Haupttext gibt die Abfolge und den Wortlaut des Hebräischen insgesamt zuverlässig wieder: Yahwehs Zorn richtet sich gegen Usa, er schlägt ihn, der Grund ist das Ausstrecken seiner Hand zur Lade, und Usa stirbt dort vor Gott. „Niederschlug“ ist angesichts des unmittelbar folgenden Todes vertretbar. Die Fußnote ist jedoch als wörtliche Wiedergabe nicht haltbar: שׁלח יד על bedeutet hier nicht wörtlich, er habe die Hand „an die Lade gelegt“; eine tatsächliche Berührung wird durch diesen Vers allein nicht ausdrücklich gesagt.'
  naturalness: Der Stil ist modernes, würdiges Standarddeutsch. „Da entbrannte Yahwehs Zorn“ und „vor Gott“ sind natürlich. Die Satzverbindung „So starb er“ ist zwar verständlich, gibt aber das einfache narrative וַ– („und“) weniger genau wieder als „und er starb“.
  terminology: „Yahweh“ für יהוה und „Gott“ für אֱלֹהִים bewahren den Wechsel der Gottesbezeichnungen. „Lade“ ist im deutschen Bibelregister die angemessene Bezeichnung. Die vorgegebene Namensform „Usa“ bleibt erhalten.
