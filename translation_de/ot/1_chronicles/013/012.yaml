id: 1CH.13.12
reference: 1 Chronicles 13:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּירָ֤א דָוִיד֙ אֶת הָ֣/אֱלֹהִ֔ים בַּ/יּ֥וֹם הַ/ה֖וּא לֵ/אמֹ֑ר הֵ֚יךְ אָבִ֣יא אֵלַ֔/י אֵ֖ת אֲר֥וֹן הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/012.yaml
  text: And David feared God that day[a], saying, “How can I bring the ark of God to me?”
translation:
  language: de
  text: 'Und David fürchtete sich an jenem Tag vor Gott[a] und sagte: »Wie kann ich die Lade Gottes zu mir bringen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hatte Furcht vor Gott«; das hebräische Verb kann je nach Zusammenhang Furcht, Schrecken oder Ehrfurcht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: fürchtete sich … vor
  rationale: Das Verb ירא bezeichnet hier angesichts des unmittelbar vorausgehenden göttlichen Gerichts konkrete Furcht, kann aber zugleich ehrfürchtiges Erschrecken mitschwingen lassen.
- source_word: אֶת הָאֱלֹהִים
  choice: vor Gott
  rationale: Nach dem reflexiven deutschen Verb »sich fürchten« wird das hebräische direkte Objekt idiomatisch mit »vor« wiedergegeben.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die übliche deutsche Wiedergabe des temporalen Ausdrucks bewahrt dessen Rückbezug auf den erzählten Tag.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Der Infinitiv zur Einführung direkter Rede wird im modernen Deutschen natürlicher als koordinierte Redeeinleitung wiedergegeben.
- source_word: הֵיךְ
  choice: Wie kann
  rationale: Die Formulierung lässt offen, ob David vor allem nach Möglichkeit, Vorgehensweise oder Angemessenheit fragt.
- source_word: אָבִיא
  choice: ich … bringen
  rationale: Der Hifil von בוא hat hier die direkte kausative Bedeutung »bringen«.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die wörtliche Wiedergabe erhält die Unbestimmtheit darüber, ob David sich selbst, seinen Aufenthaltsort oder seinen Herrschaftsbereich meint.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Die traditionelle und verständliche Bezeichnung »Lade« gibt den Kultgegenstand wieder; der Genitiv bewahrt die formale Prägung der hebräischen Verbindung.
theological_decisions:
- issue: Art von Davids Reaktion auf Gottes Gericht
  choice: »fürchtete sich … vor Gott«
  alternative: »hatte Ehrfurcht vor Gott«
  rationale: Der Zusammenhang mit Ussas Tod verlangt, die konkrete Angst beziehungsweise das Erschrecken nicht zu einer bloß positiven Ehrfurcht abzuschwächen. Die Fußnote hält zugleich den weiteren Bedeutungsraum des Verbs offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »An jenem Tag« trägt einen leicht gehobenen biblischen Ton, bleibt aber allgemein verständlich; die direkte Rede ist natürlich und knapp.
