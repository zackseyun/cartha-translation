  register: Modernes, würdiges Standarddeutsch. Die hebräischen Ortsnamen werden in gebräuchlicher deutscher Umschrift wiedergegeben. Die beiden Fußnotenmarker stehen bei den jeweils erläuterten geographischen Bezeichnungen; damit wird die in den bereitgestellten englischen Angaben offenbar vertauschte Markerzuordnung sachlich berichtigt.
