source:
  edition: WLC
  text: וַ/יַּקְהֵ֤ל דָּוִיד֙ אֶת כָּל יִשְׂרָאֵ֔ל מִן שִׁיח֥וֹר מִצְרַ֖יִם וְ/עַד לְב֣וֹא חֲמָ֑ת לְ/הָבִיא֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים מִ/קִּרְיַ֖ת יְעָרִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/005.yaml
  text: So David assembled all Israel[a], from the Shihor of Egypt to Lebo-hamath[b], to bring the ark of God from Kiriath-jearim.
translation:
  language: de
  text: So versammelte David ganz Israel, vom Schihor Ägyptens[a] bis Lebo-Hamat[b], um die Lade Gottes aus Kirjat-Jearim zu holen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Schihor Ägyptens“ ist eine Bezeichnung der Südgrenze; manche verstehen darunter den „Bach Ägyptens“.
    reason: cultural_note
  - marker: b
    text: 'Oder wörtlicher: „bis zum Eingang von Hamat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: versammelte
  rationale: Der Hifil von קהל bezeichnet hier, dass David die Gemeinschaft zusammenkommen ließ. „Versammelte“ ist im Deutschen natürlich und entspricht einer Zusammenkunft des ganzen Volkes.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Bewahrt den kollektiven nationalen Ausdruck des Hebräischen. Die Wendung kann das ganze Volk in repräsentativem Sinn bezeichnen, ohne zwingend jeden Einzelnen zu meinen.
- source_word: מִן שִׁיחוֹר מִצְרַיִם
  choice: vom Schihor Ägyptens
  rationale: Die Wiedergabe als Eigenname wahrt die Formulierung des Ausgangstextes und legt die genaue Identifizierung des Gewässers nicht vorschnell fest.
- source_word: וְעַד לְבוֹא חֲמָת
  choice: bis Lebo-Hamat
  rationale: Die Wendung dient hier als geographische Grenzbezeichnung und kann als Ortsname wiedergegeben werden. Die wörtlichere Deutung bleibt in der Fußnote erhalten.
- source_word: לְהָבִיא
  choice: um … herbeizubringen
  rationale: Der Infinitiv drückt den Zweck der Versammlung aus. „Herbeizubringen“ gibt das Bringen von Kirjat-Jearim zum vorgesehenen Ort natürlich wieder, ohne ein im Vers nicht genanntes Ziel hinzuzufügen.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Entspricht knapp und sachlich der hebräischen Konstruktverbindung, ohne eine zusätzliche theologische Präzisierung einzutragen.
- source_word: מִקִּרְיַת יְעָרִים
  choice: aus Kirjat-Jearim
  rationale: Verwendet eine im Deutschen verständliche Umschrift des hebräischen Ortsnamens; „aus“ bezeichnet passend den Ausgangsort der Lade.
theological_decisions: []
