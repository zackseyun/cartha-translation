  text: וְ/נָסֵ֛בָּה אֶת אֲר֥וֹן אֱלֹהֵ֖י/נוּ אֵלֵ֑י/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ בִּ/ימֵ֥י שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/003.yaml
  text: And let us bring the ark of our God back to us[a], for we did not seek it in the days of Shaul.
translation:
  language: de
  text: Lasst uns die Lade unseres Gottes zu uns zurückbringen; denn in den Tagen Schauls haben wir sie nicht gesucht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben wir nicht nach ihr gefragt“ beziehungsweise, wenn der hebräische Objektsuffix auf Gott bezogen wird: „haben wir ihn nicht gesucht“ oder „nicht nach ihm gefragt“. Das hebräische Verb kann sowohl „suchen“ als auch „sich erkundigen/nach jemandem oder etwas fragen“ bedeuten. Der Suffix kann sich grammatisch auf die Lade beziehen; manche verstehen ihn jedoch als Hinweis auf Gott.'
    reason: lexikalische und referenzielle Mehrdeutigkeit
lexical_decisions:
- source_word: וְנָסֵבָּה
  choice: Lasst uns … zurückbringen
  rationale: Der Kohortativ der 1. Person Plural formuliert einen gemeinsamen Vorschlag. סבב bezeichnet hier im Zusammenhang mit der Lade deren Rückführung zur Gemeinschaft; „zurückbringen“ gibt dies natürlich wieder.
- source_word: אֶת אֲרוֹן אֱלֹהֵינוּ
  choice: die Lade unseres Gottes
  rationale: Die Constructusverbindung mit dem Suffix der 1. Person Plural bedeutet unmittelbar „die Lade unseres Gottes“. „Lade“ bewahrt die konkrete kultische Bezeichnung.
- source_word: אֵלֵינוּ
  choice: zu uns
  rationale: Die Präposition mit Suffix bezeichnet die Richtung hin zur sprechenden Gemeinschaft.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für den Vorschlag ein; „denn“ wahrt den erklärenden Zusammenhang und den würdigen Erzählton.
- source_word: לֹא דְרַשְׁנֻהוּ
  choice: haben wir nicht nach ihr gefragt
  rationale: דרש kann „suchen“, „sich erkundigen“ oder „befragen“ bedeuten. Der Objektsuffix kann grammatisch auf אֲרוֹן („Lade“, im Hebräischen maskulin) zurückweisen. Im Deutschen nimmt das Pronomen entsprechend dem Genus von „Lade“ die feminine Form „ihr“ an. „Nach ihr fragen“ bewahrt sowohl den konkreten Bezug als auch den Gedanken der Vernachlässigung.
- source_word: בִּימֵי שָׁאוּל
  choice: in den Tagen Schauls
  rationale: Die Wendung bedeutet wörtlich „in den Tagen Schauls“. „Schaul“ gibt den hebräischen Namen שָׁאוּל in deutscher Transliteration wieder.
theological_decisions:
- issue: Objekt von „nicht nach … gefragt“
  choice: 'Das grammatisch naheliegende Objekt bleibt die Lade: „nicht nach ihr gefragt“.'
  alternative: „ihn nicht gesucht“ oder „nicht nach ihm gefragt“, mit ausdrücklichem Bezug auf Gott
  rationale: Der hebräische maskuline Singularsuffix kann unmittelbar auf das ebenfalls maskuline אֲרוֹן („Lade“) zurückweisen. Ein ausdrücklicher Bezug auf Gott würde die theologische Implikation bereits im Haupttext festlegen. Die Übersetzung bewahrt daher den konkreten Bezug und nennt die andere mögliche Deutung in der Fußnote.
translation_notes:
  register: Natürliches, gegenwärtiges Standarddeutsch mit würdigem biblischem Ton. Der gemeinsame Aufforderungscharakter wird mit „Lasst uns“ ausgedrückt; die echte Mehrdeutigkeit des hebräischen Objekts bleibt durch eine Fußnote sichtbar.
