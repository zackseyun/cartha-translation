source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח אֶת הֲדֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִיד ל/שאול ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עוּ הָיָ֣ה הֲדַדְעָ֑זֶר וְ/כֹ֗ל כְּלֵ֛י זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/010.yaml
  text: So he sent Hadoram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Tou[d][c][b]; and he sent all kinds of articles of gold and silver and bronze.
translation:
  language: de
  text: Da sandte er seinen Sohn Hadoram zu König David, um sich nach seinem Wohlergehen zu erkundigen[a] und ihn zu segnen[b], weil David gegen Hadad-Eser gekämpft und ihn besiegt hatte. Denn Hadad-Eser hatte mit Toï Krieg geführt.[c] Außerdem sandte er allerlei Gegenstände aus Gold, Silber und Bronze.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um ihn nach Frieden zu fragen“. „Frieden“ bezeichnet hier sein Wohlergehen oder Ergehen.'
    reason: lexical_alternative
  - marker: b
    text: In diesem diplomatischen Zusammenhang kann „ihn segnen“ auch den Sinn „ihn beglückwünschen“ haben.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Denn Hadad-Eser war ein Mann von Kriegen mit Toï.“ Gemeint ist, dass Hadad-Eser mit Toï Krieg geführt hatte.'
    reason: lexical_alternative
  - marker: d
    text: 'Der hebräische Text lautet nur: „und allerlei Gegenstände aus Gold, Silber und Bronze“. Das Verb „sandte“ ist aus dem Zusammenhang ergänzt.'
    reason: textual_clarity
lexical_decisions:
- source_word: וַיִּשְׁלַח אֶת הֲדוֹרָם בְּנוֹ
  choice: Da sandte er seinen Sohn Hadoram
  rationale: Die fortlaufende Erzählform wird mit „Da“ natürlich wiedergegeben; das Besitzverhältnis und der Eigenname bleiben ausdrücklich erhalten.
- source_word: לִשְׁאוֹל לוֹ לְשָׁלוֹם
  choice: um sich nach seinem Wohlergehen zu erkundigen
  rationale: Die hebräische Wendung fragt wörtlich nach dem „Frieden“ eines Menschen, meint hier aber umfassend sein Ergehen bzw. Wohlergehen.
- source_word: וּלְבָרֲכוֹ
  choice: und ihn zu segnen
  rationale: Die Grundbedeutung von ברך bleibt erhalten. Im diplomatischen Zusammenhang schwingt zugleich Beglückwünschung nach dem Sieg mit.
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: weil David gegen Hadad-Eser gekämpft und ihn besiegt hatte
  rationale: „David“ verdeutlicht das im Deutschen sonst potenziell mehrdeutige Subjekt. נכה bezeichnet hier die militärische Niederlage; „besiegt“ vermeidet die unbelegte Festlegung, Hadad-Eser sei getötet worden.
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעוּ הָיָה הֲדַדְעָזֶר
  choice: Denn Hadad-Eser hatte mit Toï Krieg geführt
  rationale: Die wörtliche Wendung „ein Mann von Kriegen“ bezeichnet idiomatisch ein bestehendes Kriegsverhältnis zwischen Hadad-Eser und Toï.
- source_word: וְכֹל כְּלֵי זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: Außerdem sandte er allerlei Gegenstände aus Gold, Silber und Bronze
  rationale: כְּלֵי ist allgemein als „Gegenstände“ wiedergegeben; „Bronze“ passt zum antiken Metallkontext. Das Verb „sandte“ wird sinngemäß aus dem Satzkontext ergänzt.
