    issue: Die Präpositionalgruppe „bei seinem ganzen Volk“ ist semantisch nicht die beste Wiedergabe von לְכָל עַמּוֹ.
    rationale: Sie kann den Ort bzw. Bereich des Handelns bezeichnen. Im Kontext ist vielmehr Davids gesamtes Volk der Personenkreis, dem gerechtes Regierungshandeln zugutekommt. Ein Dativ („seinem ganzen Volk“) bildet dies klarer ab.
  - severity: low
    issue: Die Fußnote nennt „übte Recht und Gerechtigkeit für sein ganzes Volk“ als wörtlichere Wiedergabe.
    rationale: Dies ist keine wesentlich wörtlichere oder idiomatischere deutsche Alternative; insbesondere bleibt „für“ bei „übte“ syntaktisch und stilistisch unerquicklich. Die Erklärung des durativen Verbgefüges kann knapp und korrekt ohne diese Pseudo-Wörtlichkeit gegeben werden.
