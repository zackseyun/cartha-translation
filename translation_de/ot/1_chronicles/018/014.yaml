  verdict: revise
  source_fidelity: 'Der Vers gibt Davids Herrschaft über ganz Israel sowie sein fortgesetztes gerechtes Regierungshandeln zutreffend wieder. „Sorgte bei seinem ganzen Volk für“ ist jedoch hinsichtlich לְכָל עַמּוֹ weniger präzise: Es lokalisiert das Handeln eher innerhalb des Volkes, während das Hebräische das ganze Volk als Empfänger bzw. Nutznießer bezeichnet.'
  naturalness: „So herrschte David“ ist möglich, wirkt im modernen Standarddeutsch aber unnötig literarisch. „David herrschte“ ist klarer. Die Verbindung „bei seinem ganzen Volk für Recht und Gerechtigkeit sorgen“ ist zwar verständlich, aber weniger idiomatisch und semantisch weniger direkt als eine Formulierung mit Dativ.
  terminology: '„Recht und Gerechtigkeit“ bewahrt die Zweigliedrigkeit von מִשְׁפָּט וּצְדָקָה gut: der erste Begriff trägt den rechtlich-gerichtlichen, der zweite den weitergehenden ethischen Aspekt. „Seinem ganzen Volk“ gibt das Suffix und den umfassenden Adressatenkreis angemessen wieder.'
  issues:
