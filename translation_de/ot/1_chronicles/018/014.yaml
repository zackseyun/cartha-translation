base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/014.yaml
  text: So David reigned over all Israel[a], and he administered justice and righteousness to all his people.
translation:
  language: de
  text: David herrschte über ganz Israel und sorgte für Recht und Gerechtigkeit für sein ganzes Volk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und er war dabei, Recht und Gerechtigkeit für sein ganzes Volk zu tun“. Die hebräische Verbform kann fortgesetztes oder regelmäßiges Handeln ausdrücken.'
    reason: Die Anmerkung erläutert die durative Konstruktion היה + Partizip und wahrt die Transparenz gegenüber der idiomatischen Haupttextwiedergabe.
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: herrschte
  rationale: Das Qal-Wayyiqtol von מלך bezeichnet Davids königliche Herrschaft. „Herrschte“ ist im modernen deutschen Erzählstil natürlich; dass er als König herrschte, ergibt sich eindeutig aus dem Kontext.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: über ganz Israel
  rationale: עַל bezeichnet bei מלך den Herrschaftsbereich. „Ganz Israel“ gibt den umfassenden Geltungsbereich knapp und genau wieder.
- source_word: וַיְהִי עֹשֶׂה
  choice: und sorgte … für
  rationale: Die Verbindung von היה mit Partizip beschreibt ein fortgesetztes beziehungsweise regelmäßiges Handeln. In Verbindung mit Recht und Gerechtigkeit bringt „sorgte … für“ die dauerhafte Ausübung königlicher Verantwortung idiomatisch zum Ausdruck.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: Im königlich-administrativen Zusammenhang bezeichnet מִשְׁפָּט die gerechte Rechtsordnung und Rechtsprechung. „Recht“ bewahrt den juridischen Akzent und bildet mit „Gerechtigkeit“ ein natürliches deutsches Begriffspaar.
- source_word: וּצְדָקָה
  choice: und Gerechtigkeit
  rationale: צְדָקָה bezeichnet rechtes, gerechtes Handeln beziehungsweise eine gerechte Ordnung. „Gerechtigkeit“ wahrt neben „Recht“ den ethisch-moralischen Gehalt des zweiten Begriffs.
- source_word: לְכָל עַמּוֹ
  choice: bei seinem ganzen Volk
  rationale: לְ kennzeichnet hier den Personenkreis, dem Davids gerechte Regierung zugutekommt. „Bei seinem ganzen Volk“ ist natürliches Deutsch und bewahrt sowohl den umfassenden Bezug als auch das Possessivsuffix.
theological_decisions:
- issue: Wiedergabe des königsethischen Begriffspaars מִשְׁפָּט וּצְדָקָה
  choice: Recht und Gerechtigkeit
  alternative: Rechtsprechung und gerechtes Handeln
  rationale: Die knappe Paarformel hält den juridischen und den ethisch-moralischen Aspekt zusammen, ohne beide Begriffe gleichzusetzen oder die idealtypische Aussage über Davids Herrschaft konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und narrativ; „Recht und Gerechtigkeit“ bewahrt die traditionelle Dichte der hebräischen Paarformel.
