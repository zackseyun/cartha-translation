  text: וְ/יוֹאָ֥ב בֶּן צְרוּיָ֖ה עַל הַ/צָּבָ֑א וִ/יהוֹשָׁפָ֥ט בֶּן אֲחִיל֖וּד מַזְכִּֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/015.yaml
  text: And Joab son of Zeruiah was over the army[a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: de
  text: Und Joab, der Sohn Zerujas, hatte den Oberbefehl über das Heer, und Joschafat, der Sohn Ahiluds, war Schriftführer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Sekretär“ oder „Chronist“; der hebräische Ausdruck bezeichnet einen königlichen Amtsträger, der Vorgänge festhielt und dem König Angelegenheiten zur Kenntnis brachte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹאָב
  choice: Und Joab
  rationale: Das verbindende וְ wird mit „Und“ wiedergegeben und bewahrt den listenartigen Charakter des Abschnitts; der Name wird in der im Deutschen gebräuchlichen biblischen Form „Joab“ geschrieben.
- source_word: בֶּן־צְרוּיָה
  choice: der Sohn Zerujas
  rationale: Die hebräische Abstammungsangabe wird in natürlichem Standarddeutsch wiedergegeben; „Zeruja“ entspricht der etablierten deutschen Namensform.
- source_word: עַל־הַצָּבָא
  choice: war über das Heer gesetzt
  rationale: עַל bezeichnet hier den Zuständigkeits- und Befehlsbereich eines Amtsträgers. Die Formulierung bleibt nahe an der hebräischen Struktur, ist aber idiomatischer als das wörtliche „war über dem Heer“ und legt den konkreten militärischen Rang nicht unnötig fest.
- source_word: וִיהוֹשָׁפָט
  choice: und Joschafat
  rationale: Das zweite וְ führt die Liste der Amtsträger fort; „Joschafat“ ist die gebräuchliche deutsche Form des Namens.
- source_word: בֶּן־אֲחִילוּד
  choice: der Sohn Ahiluds
  rationale: Die genealogische Zuordnung wird klar und natürlich wiedergegeben; „Ahilud“ wird entsprechend deutscher Bibelnamenschreibung transliteriert.
- source_word: מַזְכִּיר
  choice: Schriftführer
  rationale: Der Ausdruck bezeichnet einen königlichen Amtsträger, der Vorgänge festhielt und dem König Angelegenheiten in Erinnerung beziehungsweise zur Kenntnis brachte. „Schriftführer“ ist verständlich, ohne die genaue Funktion stärker festzulegen, als der hebräische Begriff erlaubt.
