source:
  edition: WLC
  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יַּ֥ךְ דָּוִ֛יד אֶת פְּלִשְׁתִּ֖ים וַ/יַּכְנִיעֵ֑/ם וַ/יִּקַּ֛ח אֶת גַּ֥ת וּ/בְנֹתֶ֖י/הָ מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/001.yaml
  text: After this[a], David struck the Philistines and subdued them, and he took Gath and its surrounding towns from the hand of the Philistines.
translation:
  language: de
  text: Danach schlug David die Philister und unterwarf sie. Er nahm ihnen Gat und die dazugehörigen Ortschaften[a] ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ihre Töchter«; gemeint sind die kleineren Ortschaften, die von Gat abhängig waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Danach
  rationale: Die knappe Erzählüberleitung gibt die zeitliche Abfolge natürlich wieder, ohne die hebräische Formel »und es geschah« unnötig wörtlich nachzubilden.
- source_word: וַיַּךְ
  choice: besiegte
  rationale: נכה bezeichnet hier einen militärischen Schlag. Im Deutschen gibt »besiegte« den kontextuellen Sinn natürlich wieder; die anschließende Unterwerfung bleibt als eigener Handlungsschritt erhalten.
- source_word: פְּלִשְׁתִּים
  choice: die Philister
  rationale: Eingebürgerte deutsche Bezeichnung der Volksgruppe.
- source_word: וַיַּכְנִיעֵם
  choice: unterwarf sie
  rationale: Die Hifil-Form von כנע bezeichnet das Herbeiführen von Unterordnung beziehungsweise Unterwerfung und hat hier militärisch-politischen Sinn.
- source_word: וַיִּקַּח
  choice: nahm … ab
  rationale: לקח bedeutet grundsätzlich »nehmen«. Zusammen mit מִיַּד wird im Deutschen idiomatisch ausgedrückt, dass David den Philistern die Orte entriss beziehungsweise ihre Kontrolle darüber beendete.
- source_word: גַּת
  choice: Gat
  rationale: Übliche deutsche Schreibweise des Namens der Philisterstadt.
- source_word: וּבְנֹתֶיהָ
  choice: die dazugehörigen Ortschaften
  rationale: Wörtlich »ihre Töchter«; gemeint sind die von Gat abhängigen kleineren Siedlungen. »Dazugehörige Ortschaften« wahrt diese Beziehung, ohne bloße geografische Nähe zu behaupten.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: nahm ihnen … ab
  rationale: Das hebräische Bild lautet »aus der Hand der Philister«. Die natürliche deutsche Konstruktion vermittelt hier denselben Gedanken von Besitz beziehungsweise Herrschaft.
