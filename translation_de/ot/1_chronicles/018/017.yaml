  yaml_path: translation/ot/1_chronicles/018/017.yaml
  text: And Benaiah son of Jehoiada was over the Kerethites and the Pelethites[c][b][a], and David’s sons were the chief officials at the king’s side.
translation:
  language: de
  text: Benaja, der Sohn Jojadas, war den Keretitern und den Peletitern vorgesetzt; Davids Söhne aber waren die Ersten[a] beim König[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Ranghöchsten«; das hebräische Wort bedeutet wörtlich »die Ersten« oder »die Vordersten« und kann hier eine hohe Stellung am Hof bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »zur Hand des Königs«; die Wendung bezeichnet unmittelbare Nähe zum König beziehungsweise Dienst für ihn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: stand über
  rationale: Die Präposition bezeichnet hier im militärisch-administrativen Zusammenhang die Aufsicht oder Befehlsgewalt Benajas über die beiden Gruppen.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: den Keretitern und den Peletitern
  rationale: Beide Bezeichnungen werden als Gruppennamen transliteriert und nicht durch eine sachliche Deutung ersetzt.
- source_word: וּבְנֵי דָוִיד
  choice: Davids Söhne
  rationale: Die hebräische Genitivverbindung wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: הָרִאשֹׁנִים
  choice: die Ersten
  rationale: Die formnahe Wiedergabe bewahrt die Mehrdeutigkeit zwischen Vorrang, Rangstellung und einer möglichen Amtsbezeichnung, statt das Wort eindeutig als »höchste Beamte« auszulegen.
- source_word: לְיַד הַמֶּלֶךְ
  choice: an der Seite des Königs
  rationale: Die hebräische Wendung bedeutet wörtlich »zur/an der Hand des Königs« und bezeichnet wahrscheinlich unmittelbare Nähe und Dienst am König; die deutsche Formulierung bewahrt beide Nuancen.
- source_word: בְּנָיָהוּ בֶּן־יְהוֹיָדָע
  choice: Benaja, der Sohn Jojadas
  rationale: Die Namen folgen geläufiger deutscher Bibeltransliteration; das Abstammungsverhältnis wird klar und würdig formuliert.
theological_decisions:
- issue: Stellung der Söhne Davids am Königshof
  choice: die Ersten an der Seite des Königs
  alternative: die höchsten Beamten im Dienst des Königs
  rationale: Der hebräische Text nennt sie הָרִאשֹׁנִים und lässt die genaue Amtsfunktion offen. Die Übersetzung vermeidet es, eine bestimmte institutionelle oder priesterliche Funktion einzutragen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer Satzstruktur. Die traditionelle erzählerische Wendung »stand über« bleibt verständlich und bildet das Autoritätsverhältnis knapp ab. Die sachliche Unbestimmtheit der Stellung von Davids Söhnen wird im Haupttext bewahrt und in den Fußnoten erläutert.
