  yaml_path: translation/ot/1_chronicles/018/013.yaml
  text: He placed garrisons in Edom, and all Edom became servants to David. And the LORD gave David victory wherever he went.
translation:
  language: de
  text: Er richtete in Edom Garnisonen ein, und ganz Edom wurde David untertan. Und der HERR schenkte David den Sieg, wohin er auch zog.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצִיבִים
  choice: Statthalter
  rationale: Das Wort bezeichnet hier am ehesten eingesetzte Amtsträger beziehungsweise Besatzungsverwalter. Die Parallelstelle 2 Samuel 8,14 liest den Singular kollektiv; „Statthalter“ bewahrt den Personenbezug des masoretischen Plurals besser als „Besatzungstruppen“.
- source_word: עֲבָדִים
  choice: untertan
  rationale: עבד kann je nach Verhältnis „Sklave“, „Diener“ oder politisch „Vasall/Untertan“ bedeuten. Im Kontext der Unterwerfung eines ganzen Landes bezeichnet es politische Dienst- und Tributpflicht; „wurde … untertan“ gibt dies natürlich wieder, ohne individuelle Versklavung festzuschreiben.
- source_word: וַיּוֹשַׁע
  choice: schenkte … den Sieg
  rationale: Die Hifil-Form von ישׁע bedeutet „retten, helfen, Sieg verleihen“. Im militärischen Zusammenhang ist „den Sieg schenken“ idiomatisch und hält ausdrücklich den HERRN als Urheber fest.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: wohin er auch zog
  rationale: Die Wendung meint jeden Ort beziehungsweise Feldzug, zu dem David aufbrach. „zog“ passt zum militärischen Kontext und entspricht der offenen räumlichen Formulierung.
theological_decisions:
- issue: Göttliche Urheberschaft an Davids militärischem Erfolg
  choice: „der HERR schenkte David den Sieg“
  alternative: „der HERR half David“ / „rettete David“
  rationale: Der hebräische Text schreibt den Erfolg ausdrücklich JHWH zu. Die Übersetzung bewahrt diese Aussage, ohne daraus eine allgemeine theologische Billigung jedes einzelnen Handelns Davids abzuleiten.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: „der HERR“
  alternative: „JHWH“ / „Jahwe“
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen wird beibehalten und unterscheidet den Eigennamen Gottes vom gewöhnlichen Titel „Herr“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kurze erzählende Stil und die Satzfolge des Hebräischen bleiben erhalten; „So“ macht den zusammenfassenden Anschluss des zweiten Satzes natürlich sichtbar.
