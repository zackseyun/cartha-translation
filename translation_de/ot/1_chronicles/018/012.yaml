source:
  edition: WLC
  text: וְ/אַבְשַׁ֣י בֶּן צְרוּיָ֗ה הִכָּ֤ה אֶת אֱדוֹם֙ בְּ/גֵ֣יא הַמֶּ֔לַח שְׁמוֹנָ֥ה עָשָׂ֖ר אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/012.yaml
  text: And Abishai son of Zeruiah struck down eighteen thousand Edomites in the Valley of Salt[a].
translation:
  language: de
  text: Und Abischai, der Sohn Zerujas, schlug im Salztal achtzehntausend Edomiter[a] nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen: „Edom“; im Zusammenhang der Schlacht und der Zahl sind die Menschen aus Edom, also Edomiter, gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשַׁי
  choice: Und Abischai
  rationale: Das ו wird als „Und“ wiedergegeben und bewahrt so die erzählerische Verknüpfung; der Personenname folgt der im Deutschen gebräuchlichen biblischen Form.
- source_word: בֶּן צְרוּיָה
  choice: der Sohn Zerujas
  rationale: Die Abstammungsangabe wird in natürlichem Deutsch mit bestimmtem Artikel und Genitiv wiedergegeben.
- source_word: הִכָּה
  choice: schlug
  rationale: „Schlug“ bildet die Grundbedeutung von נכה ab und lässt im militärischen Zusammenhang offen, ob Abischai persönlich handelte oder als Heerführer genannt wird.
- source_word: אֶת אֱדוֹם
  choice: Edomiter
  rationale: Obwohl im Hebräischen „Edom“ steht, zeigen das militärische Verb und die anschließende Zahl, dass die Menschen Edoms gemeint sind; „Edomiter“ macht dies im Deutschen natürlich deutlich.
- source_word: בְּ/גֵיא הַמֶּלַח
  choice: im Salztal
  rationale: Die Konstruktion bedeutet wörtlich „im Tal des Salzes“; „Salztal“ ist die knappe und gebräuchliche deutsche Wiedergabe des Ortsnamens.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: achtzehntausend
  rationale: Die Zahl wird in literarischem Bibelstil ausgeschrieben und bezieht sich auf die als Objekt erschlossenen Edomiter.
theological_decisions:
- issue: Bezeichnet „Edom“ das Land oder dessen Bevölkerung?
  choice: die Bevölkerung Edoms („Edomiter“)
  alternative: das Gebiet Edom
  rationale: Das militärische Verb zusammen mit der Zahl von achtzehntausend weist stark auf Personen hin. Diese kontextuelle Verdeutlichung legt keine konfessionelle Deutung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur des Hebräischen bleibt erhalten; „schlug“ bewahrt die Härte und zugleich die gewisse semantische Offenheit des Ausgangsverbs.
