base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/008.yaml
  text: And from Tibhath and from Cun, cities of Hadadezer, David took a very great amount of bronze; with it Solomon made the bronze sea, the pillars, and the bronze articles.
translation:
  language: de
  text: Aus Tibhat und Kun, den Städten Hadad-Esers, nahm David sehr viel Bronze mit. Daraus fertigte Salomo das bronzene Meer, die Säulen und die bronzenen Geräte an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Im Zusammenhang mit Tempelgerät bezeichnet das Wort das verwendete Kupfermetall beziehungsweise eine Kupferlegierung; „Bronze“ ist hier die geläufige und sachlich passende Wiedergabe.
- source_word: יָם הַנְּחֹשֶׁת
  choice: das bronzene Meer
  rationale: „Meer“ wird als etablierte Bezeichnung für das große bronzene Wasserbecken des Tempels beibehalten.
- source_word: כְּלֵי הַנְּחֹשֶׁת
  choice: die bronzenen Geräte
  rationale: כְּלִי ist ein Sammelbegriff für Geräte, Gefäße oder Gegenstände; „Geräte“ bewahrt die Breite des Ausdrucks im kultischen Kontext.
- source_word: בָּהּ
  choice: Daraus
  rationale: Das feminine Pronomen verweist auf die zuvor genannte Bronze und bezeichnet sie als Material, aus dem Salomo die Gegenstände anfertigte.
