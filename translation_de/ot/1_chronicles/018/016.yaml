base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/016.yaml
  text: Zadok son of Ahitub and Abimelech son of Abiathar were priests[a], and Shavsha was secretary.
translation:
  language: de
  text: Zadok, der Sohn Ahitubs, und Abimelech, der Sohn Abjatars, waren Priester[a], und Schawscha war Schreiber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der Parallelstelle 2. Samuel 8,17 steht »Ahimelech, der Sohn Abjatars« statt »Abimelech, der Sohn Abjatars«. Die Übersetzung folgt hier dem hebräischen Text der Chronik.
    reason: textual_variant
lexical_decisions:
- source_word: צָדוֹק
  choice: Zadok
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: בֶּן
  choice: Sohn
  rationale: In dieser Verwaltungsliste bezeichnet בֶּן am natürlichsten die unmittelbare Abstammung.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Der Personenname wird transliteriert.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelech
  rationale: Der masoretische Text der Chronik liest Abimelech; diese Lesart wird trotz der Abweichung in 2. Samuel 8,17 beibehalten.
- source_word: אֶבְיָתָר
  choice: Abjatar
  rationale: Verwendet wird die im Deutschen etablierte biblische Namensform.
- source_word: כֹּהֲנִים
  choice: Priester
  rationale: כֹּהֵן bezeichnet hier angesichts Zadoks und der Familie Abjatars das kultische Priesteramt.
- source_word: שַׁוְשָׁא
  choice: Schawscha
  rationale: Der Personenname wird lautnah und nach deutschen Schreibkonventionen transliteriert.
- source_word: סוֹפֵר
  choice: Staatsschreiber
  rationale: סוֹפֵר bezeichnet in diesem königlichen Verwaltungszusammenhang einen hohen Schreiber beziehungsweise Sekretär; Staatsschreiber macht sowohl die amtliche Funktion als auch den Schreiberdienst deutlich.
