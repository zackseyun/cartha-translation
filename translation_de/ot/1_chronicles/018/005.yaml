  text: וַ/יָּבֹא֙ אֲרַ֣ם דַּרְמֶ֔שֶׂק לַ/עְז֕וֹר לַ/הֲדַדְעֶ֖זֶר מֶ֣לֶךְ צוֹבָ֑ה וַ/יַּ֤ךְ דָּוִיד֙ בַּ/אֲרָ֔ם עֶשְׂרִֽים וּ/שְׁנַ֥יִם אֶ֖לֶף אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: de
  text: Und Aram aus Damaskus[a] kam, um Hadad-Eser[b], dem König von Zoba, zu helfen; und David schlug von den Aramäern zweiundzwanzigtausend Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »die Aramäer von Damaskus«; traditionell: »die Syrer von Damaskus«.'
    reason: lexical_alternative
  - marker: b
    text: Der Name lautet hier »Hadad-Eser«; in einigen Parallelstellen steht die Namensvariante »Hadar-Eser«.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרַם דַּרְמֶשֶׂק
  choice: die Aramäer von Damaskus
  rationale: אֲרַם kann das Land Aram oder die Aramäer bezeichnen. Da das Verb im Hebräischen zwar formal im Singular steht, die Aussage aber eine militärische Gruppe als Handelnde beschreibt, ist die ethnische Wiedergabe im Deutschen natürlich; »Syrer« würde eine spätere geografische Bezeichnung eintragen.
- source_word: לַעְזוֹר
  choice: um … zu helfen
  rationale: Der Infinitiv von עזר bezeichnet schlicht Hilfe oder Unterstützung; die deutsche Finalkonstruktion gibt לַ־ natürlich wieder.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadeser
  rationale: Die Namensform des vorliegenden hebräischen Textes wird deutsch transliteriert; die abweichende Form »Hadreser« begegnet in Parallelüberlieferungen und wird in einer Fußnote genannt.
- source_word: מֶלֶךְ צוֹבָה
  choice: dem König von Zoba
  rationale: Die Genitivverbindung wird als geläufiger deutscher Herrschertitel mit Ortsnamen wiedergegeben.
- source_word: וַיַּךְ
  choice: erschlug
  rationale: נכה bezeichnet im Kampfkontext Schlagen, Niederstrecken oder Töten. Zusammen mit der unmittelbar genannten Zahl der Betroffenen drückt »erschlug« die tödliche militärische Gewalt prägnant aus.
- source_word: בַּאֲרָם
  choice: aramäische Männer
  rationale: Die Präposition ב mit dem ethnogeografischen Ausdruck bezeichnet hier diejenigen, unter denen David die Verluste verursachte. Die attributive deutsche Form ist idiomatisch und bewahrt den Bezug auf Aram.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: 22.000 … Männer
  rationale: Dies entspricht der hebräischen Zahl und gibt אִישׁ ohne die nicht ausdrücklich genannten Zusätze »Soldaten« oder »Krieger« wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bewahrt den erzählerischen Anschluss des hebräischen Textes. »Aramäer« vermeidet den anachronistisch möglichen modernen Staatsbezug von »Syrer«; die traditionelle Wiedergabe bleibt in der Fußnote sichtbar.
