revisions:
- from: Und die Aramäer von Damaskus[a] kamen, um Hadadeser, dem König von Zoba,[b] zu helfen. Da erschlug David 22.000 aramäische Männer.
  to: Und Aram aus Damaskus[a] kam, um Hadad-Eser[b], dem König von Zoba, zu helfen; und David schlug von den Aramäern zweiundzwanzigtausend Mann.
  rationale: Die Revision bewahrt den hebräischen Kollektivsingular bei »Aram«, gibt die Finalhandlung und den Königstitel direkt wieder und vermeidet mit »schlug« eine über das Grundverb hinausgehende Aussage über die Art der Verluste. Die Namen und die Fußnotenvarianten wurden an die hebräischen Formen angepasst; die Fußnotenanker stehen jeweils unmittelbar bei ihrem Bezug.
