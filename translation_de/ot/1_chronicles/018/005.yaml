review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von אֲרַם als »die Aramäer« ist möglich, doch der hebräische Text bezeichnet die heranrückende Gruppe mit dem ethnogeografischen Kollektivsingular »Aram« und hat ein Singularverb. »Aram aus Damaskus kam« bewahrt diese Form und die damit verbundene Nuance besser. »erschlug« legt zudem stärker als das hebräische נכה fest, dass sämtliche Genannten getötet wurden; »schlug ... Mann« lässt den militärischen Ausgang angemessen offen.
  naturalness: Der Entwurf ist insgesamt verständlich und würdig. »aramäische Männer« klingt jedoch im Deutschen unnötig markiert und weniger idiomatisch als »von den Aramäern ... Mann«. Die Namensform »Hadad-Eser« folgt der im Deutschen transparenten Wiedergabe der Namensbestandteile und liest sich natürlich.
  terminology: »Hadadeser« und insbesondere die Fußnotenvariante »Hadreser« bilden die hebräischen Namensformen nicht zuverlässig ab. Der Text hat הֲדַדְעֶזֶר (Hadad-Eser); die relevante Parallelvariante ist Hadar-Eser (nicht »Hadreser«). Die Fußnote zu Aram sollte die begründete ethnische Alternative nennen, ohne die traditionelle, später geprägte Bezeichnung »Syrer« als Textform zu übernehmen.
  issues:
  - severity: medium
    issue: »erschlug« überbestimmt וַיַּךְ.
    rationale: Das Verb נכה kann im Kampfkontext schlagen, niederstrecken oder besiegen; die Zahl macht die Szene gewaltsam, verlangt aber nicht zwingend die explizite Aussage, dass alle 22.000 getötet wurden.
  - severity: medium
    issue: Die Namensvariante in Fußnote b ist fehlerhaft verkürzt.
    rationale: Die belegte abweichende Namensform lautet Hadar-Eser/Hadarezer; »Hadreser« lässt einen Bestandteil aus und ist keine genaue Wiedergabe der einschlägigen Variante.
  - severity: low
    issue: »aramäische Männer« ist stilistisch unnatürlich und interpretiert die Präpositionalfügung unnötig attributiv.
    rationale: »von den Aramäern ... Mann« ist im modernen Standarddeutsch idiomatischer und erhält die durch בַּאֲרָם angezeigte Zuordnung.
  revised_text: Und Aram aus Damaskus[a] kam, um Hadad-Eser[b], dem König von Zoba, zu helfen; und David schlug von den Aramäern zweiundzwanzigtausend Mann.
