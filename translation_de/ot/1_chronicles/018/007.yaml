base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/007.yaml
  text: And David took the shields of gold that were on the servants of Hadadezer and brought them to Jerusalem[a][b][c].
translation:
  language: de
  text: Und David nahm die goldenen Schilde[a], die die Diener Hadadesers bei sich hatten[b], und brachte sie nach Jerusalem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Schilde aus Gold“. Gemeint sein können auch mit Gold überzogene Schilde.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Dienern“ sind hier wahrscheinlich königliche Gefolgsleute oder militärische Begleiter Hadadesers gemeint, nicht unbedingt Haussklaven im engen modernen Sinn.
    reason: cultural_note
  - marker: c
    text: Einige Textüberlieferungen und die Parallelstelle in 2. Samuel schreiben den Namen „Hadareser“.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: לקח bedeutet in erzählender Prosa gewöhnlich „nehmen“. Der militärische Zusammenhang lässt „erbeutete“ zu, doch „nahm“ bewahrt den schlichten Wortlaut.
- source_word: שִׁלְטֵי הַזָּהָב
  choice: die goldenen Schilde
  rationale: שׁלט bezeichnet hier Schilde, möglicherweise kleinere Rundschilde. Die deutsche Wendung „goldene Schilde“ gibt die hebräische Genitivverbindung natürlich wieder; ob sie vollständig aus Gold oder mit Gold überzogen waren, bleibt offen.
- source_word: אֲשֶׁר הָיוּ עַל
  choice: die … getragen wurden
  rationale: Wörtlich steht „die auf/bei … waren“. Im militärischen Zusammenhang bezeichnet dies wahrscheinlich Schilde, welche die Männer bei sich trugen; die passive Formulierung ist im Deutschen verständlicher als „auf den Dienern waren“.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: den Dienern Hadadesers
  rationale: עבדים ist das übliche Wort für „Diener“. Im königlich-militärischen Umfeld kann es Gefolgsleute, Amtsträger oder militärische Begleiter meinen, ohne notwendig Sklaven im engen modernen Sinn zu bezeichnen.
- source_word: הֲדַדְעָזֶר
  choice: Hadadeser
  rationale: Der masoretische Text dieses Verses bietet die Namensform Hadadezer; nach üblicher deutscher Wiedergabe des hebräischen Zischlauts wird daraus „Hadadeser“.
- source_word: וַיְבִיאֵם יְרוּשָׁלִָם
  choice: und brachte sie nach Jerusalem
  rationale: בוא im Hifil bedeutet „bringen“. Bei einer Zielstadt ist „nach Jerusalem“ im Deutschen idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem knappen hebräischen Erzählstil, während „getragen wurden“ die im Deutschen schwer verständliche wörtliche Wendung „auf den Dienern waren“ kontextgerecht wiedergibt.
