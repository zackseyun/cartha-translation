  terminology: „Diener“ ist als transparente Grundbedeutung passend; die kulturelle Erläuterung vermeidet die unzutreffende Einengung auf moderne Haussklaverei. Die Fußnote zur Namensvariante enthält jedoch einen offensichtlichen Zeichensatzfehler („Had 膝reser“) und muss korrigiert werden. Der Variantenname lautet im Deutschen hier „Hadareser“.
