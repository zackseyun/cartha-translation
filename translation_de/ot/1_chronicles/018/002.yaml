  source_fidelity: „Er schlug Moab“ gibt וַיַּךְ bewusst konkret wieder. Die Wiedergabe des Kollektivnamens im zweiten Satzglied als „die Moabiter“ ist idiomatisch und sachgerecht. „wurden David dienstbar“ vermittelt die durch den Kontext vorausgesetzte Unterordnung, ohne die bei עֲבָדִים bestehende Bedeutungsbreite unzulässig auf persönliche Sklaverei festzulegen. „brachten Tribut“ gibt נֹשְׂאֵי מִנְחָה im politischen Kontext treffend wieder.
  naturalness: Der Satz ist knapp, klar und in modernem Standarddeutsch gut verständlich. „dienstbar“ hat einen leicht gehobenen, aber für biblische Erzählprosa passenden Ton und ist syntaktisch natürlich mit dem Dativ „David“ verbunden.
  terminology: „Moab“ / „die Moabiter“ und „Tribut“ sind angemessen. Die Fußnote erläutert die möglichen engeren Wiedergaben von עֲבָדִים und bewahrt damit die lexikalische und historische Offenheit, ohne eine konfessionelle oder überpräzise Deutung vorzuschreiben.
