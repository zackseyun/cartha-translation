source:
  edition: WLC
  text: וַ/יַּ֖ךְ אֶת מוֹאָ֑ב וַ/יִּהְי֤וּ מוֹאָב֙ עֲבָדִ֣ים לְ/דָוִ֔יד נֹשְׂאֵ֖י מִנְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/002.yaml
  text: And he struck Moab[a], and the Moabites became servants to David, bringing tribute.
translation:
  language: de
  text: Er schlug Moab, und die Moabiter wurden David dienstbar[a] und brachten Tribut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wurden David zu Knechten“; je nach Verständnis kann עֲבָדִים auch „Sklaven“ oder „Diener“ bedeuten. Hier bezeichnet es die Unterordnung des besiegten Volkes unter David.'
    reason: lexikalische Alternative und Bewahrung der Bedeutungsbreite
lexical_decisions:
- source_word: וַיַּךְ
  choice: schlug
  rationale: Das Verb נכה bezeichnet zunächst das Schlagen; im militärischen Zusammenhang ist ein siegreicher Angriff mitgemeint. „Schlug“ bewahrt die konkrete Ausdrucksweise des Hebräischen, ohne ausdrücklich „besiegte“ einzutragen.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: Hebräische Kennzeichnung des bestimmten direkten Objekts ohne selbstständige deutsche Entsprechung.
- source_word: מוֹאָב
  choice: Moab / die Moabiter
  rationale: Beim ersten Vorkommen steht Moab als angegriffenes Land beziehungsweise Volk; beim zweiten wird derselbe Kollektivname wegen des deutschen Satzbaus idiomatisch als „die Moabiter“ wiedergegeben.
- source_word: וַיִּהְיוּ
  choice: wurden
  rationale: היה mit Prädikatsangabe kann im Erzählzusammenhang den Eintritt in einen neuen Zustand bezeichnen; nach dem Feldzug ist daher „wurden“ angemessener als „waren“.
- source_word: עֲבָדִים
  choice: dienstbar
  rationale: עֲבָדִים kann Knechte, Diener oder Sklaven bezeichnen. Hier geht es um die erzwungene Unterordnung eines besiegten Volkes. „Dienstbar“ wahrt diese politische Abhängigkeit, ohne die lexikalische Spannweite vorschnell auf persönliche Sklaverei einzuengen.
- source_word: לְדָוִיד
  choice: David
  rationale: Die Präposition ל bezeichnet hier die Person, der die Moabiter untergeordnet wurden; im Ausdruck „David dienstbar“ ist dieses Verhältnis im Deutschen ohne zusätzliche Präposition natürlich wiedergegeben.
- source_word: נֹשְׂאֵי
  choice: brachten
  rationale: Das Partizip von נשׂא bedeutet wörtlich „tragend“. Mit מִנְחָה bezeichnet es idiomatisch das Herbeibringen beziehungsweise Leisten von Tribut.
- source_word: מִנְחָה
  choice: Tribut
  rationale: Im politisch-militärischen Zusammenhang meint מִנְחָה eine Abgabe an den übergeordneten Herrscher, nicht ein kultisches Opfer; „Tribut“ gibt diesen Sinn klar wieder.
theological_decisions:
- issue: Art der Unterordnung Moabs
  choice: „wurden David dienstbar“
  alternative: „wurden Davids Knechte/Sklaven“
  rationale: Der Kontext verlangt echte, durch Eroberung entstandene Unterwerfung. Zugleich entscheidet das hebräische עֲבָדִים allein nicht eindeutig zwischen politischer Vasallität, Knechtschaft und Sklaverei. Die Hauptfassung erhält die Unterordnung, während die Fußnote die konkreteren lexikalischen Möglichkeiten offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählweise und die militärische Bildsprache des Hebräischen bleiben erhalten; „dienstbar“ ist gehoben, aber allgemein verständlich und vermeidet eine vorschnelle Festlegung innerhalb der Bedeutungsbreite von עֲבָדִים.
