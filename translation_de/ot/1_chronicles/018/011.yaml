source:
  edition: WLC
  text: גַּם אֹתָ֗/ם הִקְדִּ֞ישׁ הַ/מֶּ֤לֶךְ דָּוִיד֙ לַ/יהוָ֔ה עִם הַ/כֶּ֨סֶף֙ וְ/הַ/זָּהָ֔ב אֲשֶׁ֥ר נָשָׂ֖א מִ/כָּל הַ/גּוֹיִ֑ם מֵֽ/אֱד֤וֹם וּ/מִ/מּוֹאָב֙ וּ/מִ/בְּנֵ֣י עַמּ֔וֹן וּ/מִ/פְּלִשְׁתִּ֖ים וּ/מֵֽ/עֲמָלֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/011.yaml
  text: 'King David also dedicated these to Yahweh[a], along with the silver and the gold that he had taken from all the nations: from Edom, Moab, the Ammonites, the Philistines[c][b], and Amalek.'
translation:
  language: de
  text: 'Auch diese[a] weihte König David Jahwe, zusammen mit dem Silber und dem Gold, die er von all den Völkern genommen hatte[b]: von Edom, Moab, den Ammonitern[c], den Philistern und Amalek.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Pronomen bezieht sich auf die im vorherigen Vers genannten Gegenstände aus Bronze.
    reason: cross_reference
  - marker: b
    text: 'Oder: „fortgetragen hatte“. Das hebräische Verb kann „heben“ oder „tragen“ bedeuten und bezeichnet hier das Wegnehmen von Beute oder Tribut.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „den Söhnen Ammons“, das heißt den Ammonitern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֹתָם
  choice: Auch diese
  rationale: גַּם führt den Gedanken des vorherigen Verses weiter; das Pronomen verweist auf die dort genannten Bronzegegenstände. „Diese“ macht den Rückbezug im Deutschen verständlich, ohne den Bezug in den Haupttext einzufügen.
- source_word: הִקְדִּישׁ
  choice: weihte
  rationale: Das Verb bezeichnet hier das Aussondern und Übergeben von Gegenständen für Jahwe. „Weihte“ ist im kultischen Zusammenhang natürlich und prägnant.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben.
- source_word: עִם הַכֶּסֶף וְהַזָּהָב
  choice: zusammen mit dem Silber und dem Gold
  rationale: „Zusammen mit“ verdeutlicht, dass David die zuvor erwähnten Gegenstände gemeinsam mit Silber und Gold weihte; die bestimmten Artikel des Hebräischen bleiben erhalten.
- source_word: אֲשֶׁר נָשָׂא
  choice: das er … genommen hatte
  rationale: נשׂא bedeutet grundsätzlich „heben/tragen“ und bezeichnet hier das Wegnehmen von Beute oder Tribut. „Genommen hatte“ ist natürlich und hält offen, auf welche genaue Weise die Güter in Davids Besitz gelangten.
- source_word: מִכָּל הַגּוֹיִם
  choice: von all den Völkern
  rationale: גּוֹיִם bezeichnet hier die umliegenden politischen und ethnischen Gemeinschaften; „Völker“ ist im Deutschen idiomatisch und wahrt den Sinn.
- source_word: בְּנֵי עַמּוֹן
  choice: den Ammonitern
  rationale: Die wörtliche Wendung „Söhne Ammons“ ist eine hebräische Volksbezeichnung und wird im natürlichen Deutschen als „Ammoniter“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen in gebräuchlicher deutscher Form wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der Aufzählungsstruktur des Hebräischen, bleibt aber flüssig. „Weihte“ bewahrt den kultischen Sinn; „genommen hatte“ vermeidet eine unnötig eng festgelegte Deutung als ausschließlich gewaltsam erbeutete Güter.
