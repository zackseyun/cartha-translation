lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Als ... hörte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; zusammen mit dem folgenden Inhaltssatz bildet der Vers den zeitlichen Auftakt zur Handlung in Vers 10.
- source_word: תֹּעוּ
  choice: Toë
  rationale: Der Personenname wird entsprechend der hebräischen Form in der Chronik transkribiert; die Schreibung unterscheidet sich von der Parallelstelle in 2. Samuel 8,9.
- source_word: מֶלֶךְ חֲמָת
  choice: der König von Hamat
  rationale: Die Status-constructus-Verbindung bezeichnet Amt und Herrschaftsgebiet Toës.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was Toë hörte.
- source_word: הִכָּה
  choice: geschlagen hatte
  rationale: נכה bezeichnet im militärischen Zusammenhang das Schlagen beziehungsweise Besiegen; das Plusquamperfekt gibt das zeitliche Verhältnis im Deutschen natürlich wieder.
- source_word: כָּל
  choice: das ganze
  rationale: Der ausdrücklich gesetzte umfassende Quantor wird bewahrt.
- source_word: חֵיל
  choice: Heer
  rationale: חֵיל bezeichnet hier die Streitmacht; „Heer“ ist eine klare und würdige deutsche Entsprechung.
- source_word: הֲדַדְעֶזֶר
  choice: Hadad-Eser
  rationale: Der Personenname wird aus der masoretischen Form transparent transkribiert.
- source_word: מֶלֶךְ צוֹבָה
  choice: des Königs von Zoba
  rationale: Die Verbindung bezeichnet den königlichen Titel und das Herrschaftsgebiet Hadad-Esers.
