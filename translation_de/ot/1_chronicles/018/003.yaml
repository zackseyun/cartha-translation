  text: וַ/יַּ֥ךְ דָּוִ֛יד אֶת הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָ֖ה חֲמָ֑תָ/ה בְּ/לֶכְתּ֕/וֹ לְ/הַצִּ֥יב יָד֖/וֹ בִּֽ/נְהַר פְּרָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/003.yaml
  text: David struck Hadadezer king of Zobah[b][a], as he went to establish his power at the Euphrates River.
translation:
  language: de
  text: David schlug Hadad-Eser, den König von Zoba, auf dem Weg nach Hamat, als dieser auszog, um seine Herrschaft am Euphrat aufzurichten.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »um seine Hand am Euphrat aufzurichten«; gemeint sein kann, seine Herrschaft dort zu begründen, zu festigen oder wiederherzustellen.'
    reason: lexical_alternative
  - marker: b
    text: Der Name lautet hier »Hadad-Eser«; als abweichende Überlieferungs- oder Wiedergabeform findet sich auch »Hadad-Reser«.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  choice: schlug
  rationale: Das Verb נכה bezeichnet wörtlich ein Schlagen und wird hier militärisch gebraucht. »Schlug« bewahrt die Bildhaftigkeit, ohne den Ausgang als vollständige Niederlage auszudeuten.
- source_word: הֲדַדְעֶזֶר
  choice: Hadad-Eser
  rationale: Der Personenname wird entsprechend der Schreibung des Chroniktextes wiedergegeben; die Bindestrichschreibung macht seine beiden Bestandteile im Deutschen lesbar.
- source_word: מֶלֶךְ צוֹבָה
  choice: den König von Zoba
  rationale: Die hebräische Genitivverbindung bezeichnet Amt und Herrschaftsgebiet Hadad-Esers.
- source_word: חֲמָתָה
  choice: auf dem Weg nach Hamat
  rationale: Das direktionale He bezeichnet eine Bewegung in Richtung Hamat. Die Formulierung gibt diese Richtung natürlich wieder, ohne zu behaupten, dass die Stadt erreicht wurde.
- source_word: בְּלֶכְתּוֹ
  choice: als dieser auszog
  rationale: Die Infinitivkonstruktion mit בְּ bezeichnet den zeitlichen Begleitumstand. »Dieser« macht im Deutschen kenntlich, dass Hadad-Eser als naheliegendes Subjekt des Ausziehens verstanden wird.
- source_word: לְהַצִּיב יָדוֹ
  choice: um seine Herrschaft aufzurichten
  rationale: Wörtlich steht »seine Hand aufrichten/aufstellen«. Im militärisch-politischen Zusammenhang bezeichnet »Hand« die ausgeübte Macht oder Herrschaft; »aufrichten« lässt offen, ob sie neu begründet oder wiederhergestellt werden sollte.
- source_word: בִּנְהַר פְּרָת
  choice: am Euphrat
  rationale: נְהַר פְּרָת bezeichnet den Euphrat; im heutigen Deutschen enthält der Eigenname bereits eindeutig die Bezeichnung des Flusses.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die militärische Aussage bleibt knapp; die hebräische Herrschaftsmetapher wird im Text idiomatisch und in der Fußnote wörtlich wiedergegeben. Die Zuordnung von חֲמָתָה zu Davids Feldzug wird als Richtungsangabe ausgedrückt, während Hadad-Eser als naheliegendes Subjekt von בְּלֶכְתּוֹ kenntlich gemacht wird.
