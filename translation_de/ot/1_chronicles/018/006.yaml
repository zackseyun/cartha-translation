  text: וַ/יָּ֤שֶׂם דָּוִיד֙ בַּ/אֲרַ֣ם דַּרְמֶ֔שֶׂק וַ/יְהִ֤י אֲרָם֙ לְ/דָוִ֔יד עֲבָדִ֖ים נֹשְׂאֵ֣י מִנְחָ֑ה וַ/יּ֤וֹשַׁע יְהוָה֙ לְ/דָוִ֔יד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and the Arameans became David’s servants, bringing tribute[c][b]. And Yahweh gave victory to David wherever he went.
translation:
  language: de
  text: Und David stationierte Besatzungen in Aram von Damaskus[a]. Die Aramäer wurden David zu Dienern und brachten Tribut. Und Jahwe verhalf David zum Sieg, wohin er auch ging[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „David setzte in Aram von Damaskus“. Das Objekt ist im Hebräischen nicht genannt; aus dem militärischen Zusammenhang sind Besatzungen oder stationierte Truppen zu ergänzen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jahwe rettete David“ beziehungsweise „half David“, wohin er auch ging.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: legte Besatzungen
  rationale: Das Verb bedeutet wörtlich „setzen/legen“. Das im Hebräischen unausgesprochene Objekt wird aus dem militärischen Zusammenhang und der Parallelstelle als „Besatzungen“ erschlossen; die Fußnote macht diese Ergänzung transparent.
- source_word: בַּאֲרָם דַּרְמֶשֶׂק
  choice: in das Aram von Damaskus
  rationale: Bewahrt die hebräische Gebietsbezeichnung, statt sie auf die Stadt Damaskus zu verkürzen. Die Richtungsangabe „in das“ entspricht hier dem Setzen beziehungsweise Stationieren von Besatzungen in einem Gebiet.
- source_word: אֲרָם
  choice: die Aramäer
  rationale: An dieser Stelle bezeichnet „Aram“ kollektiv das unterworfene Volk. „Aramäer“ gibt das Ethnonym genauer wieder als das traditionelle „Syrer“.
- source_word: עֲבָדִים
  choice: Diener
  rationale: Im politischen Zusammenhang bezeichnet das Wort ein Abhängigkeits- oder Vasallenverhältnis. „Diener“ bleibt lexikalisch nah, ohne die konkretere Bedeutung „Sklaven“ vorauszusetzen.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: brachten Tribut
  rationale: Die Wendung bezeichnet hier fortlaufende Abgaben an einen übergeordneten Herrscher. „Tribut bringen“ ist im Deutschen natürlich und dem politischen Zusammenhang angemessen.
- source_word: וַיּוֹשַׁע
  choice: schenkte ... den Sieg
  rationale: Der Hifil von יָשַׁע bedeutet „retten/befreien“. Im militärischen Erzählzusammenhang drückt er aus, dass Jahwe David Erfolg beziehungsweise Sieg gewährte; die alternative, formalere Wiedergabe wird in der Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: wohin er auch zog
  rationale: Die idiomatische Wendung bezeichnet die Gesamtheit von Davids Unternehmungen. „Zog“ passt zum militärischen Kontext, ohne ausdrücklich nur das Marschieren zu bezeichnen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Bedeutung von וַיּוֹשַׁע im Kriegskontext
  choice: schenkte David den Sieg
  alternative: rettete David / half David
  rationale: Die Übersetzung macht den militärischen Erfolg deutlich, bewahrt aber durch die Fußnote die Grundbedeutung „retten/helfen“ und damit die mögliche theologische Spannung zwischen Rettung und Sieg.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge des Hebräischen bleibt weitgehend erhalten. „Aram“ und „Aramäer“ bewahren die historischen Bezeichnungen; „Besatzungen“ wird als kontextuell notwendige Ergänzung ausdrücklich in einer Fußnote erläutert.
