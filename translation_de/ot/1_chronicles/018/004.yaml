- from: David erbeutete von ihm 1.000 Streitwagen, 7.000 Reiter und 20.000 Fußsoldaten. Dann ließ David alle Streitwagenpferde lähmen[a], behielt aber genug von ihnen für 100 Streitwagen zurück.[b]
