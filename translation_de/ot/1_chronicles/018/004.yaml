base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/004.yaml
  text: David captured from him 1,000 chariots, 7,000 horsemen, and 20,000 foot soldiers. Then David hamstrung all the chariot horses, but left from them enough for 100 chariots.
translation:
  language: de
  text: David nahm ihm 1.000 Streitwagen, 7.000 Reiter[b] und 20.000 Fußsoldaten ab. Dann durchtrennte David bei allen Streitwagenpferden die Sehnen[a], verschonte jedoch genug von ihnen für 100 Streitwagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den ganzen Streitwagenbestand“ beziehungsweise „alle Streitwagen“. Weil das Verb das Lähmen durch Durchtrennen der Sehnen bezeichnet, sind hier die Pferde der Streitwagenmacht gemeint.'
    reason: lexical_alternative
  - marker: b
    text: In 2. Samuel 8,4 stehen 1.700 Reiter statt 7.000 Reiter. Dies ist ein Zahlenunterschied zwischen den überlieferten Parallelberichten.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: erbeutete
  rationale: לכד bezeichnet hier das Ergreifen bzw. Erbeuten im Krieg. „Erbeutete“ passt zu den anschließend genannten militärischen Gütern und Truppen.
- source_word: מִמֶּנּוּ
  choice: von ihm
  rationale: Das hebräische Suffix ist Singular und verweist im Zusammenhang auf Hadad-Eser.
- source_word: אֶלֶף רֶכֶב
  choice: 1.000 Streitwagen
  rationale: רכב kann die Streitwagenmacht kollektiv bezeichnen; mit der Zahl wird es im Deutschen natürlich als „Streitwagen“ wiedergegeben.
- source_word: פָּרָשִׁים
  choice: Reiter
  rationale: Das Wort bezeichnet berittene Kämpfer; „Reiter“ ist knapp, verständlich und quellennah.
- source_word: אִישׁ רַגְלִי
  choice: Fußsoldaten
  rationale: Wörtlich sind Männer zu Fuß gemeint. „Fußsoldaten“ gibt den militärischen Sinn in heutigem Deutsch klar wieder.
- source_word: וַיְעַקֵּר
  choice: ließ … lähmen
  rationale: עקר meint in diesem militärischen Zusammenhang das Durchtrennen der Sehnen, um Pferde unbrauchbar zu machen. „Lähmen“ ist verständlich und vermeidet die im Deutschen potenziell missverständliche Formulierung „die Sehnen durchschneiden“ ohne Objektangabe; die genauere Handlung wird in der Fußnote erläutert.
- source_word: אֶת כָּל הָרֶכֶב
  choice: alle Streitwagenpferde
  rationale: Wörtlich steht „den ganzen Streitwagenbestand/die gesamten Streitwagen“. Da das Verb das Lähmen durch Sehnendurchtrennung bezeichnet, ist רכב hier metonymisch auf die Pferde der Streitwagenmacht bezogen.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: behielt aber genug von ihnen für 100 Streitwagen zurück
  rationale: Die Formulierung wahrt den Bezug auf die zuvor erschlossenen Streitwagenpferde und drückt aus, dass David eine für 100 Streitwagen ausreichende Zahl verschonte.
