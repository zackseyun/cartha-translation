  rationale: Die Revision beseitigt die im Deutschen unpassende Verbindung von „erbeuten“ mit Personen, gibt die direkte und konkrete Handlung des hebräischen Verbs präziser wieder und setzt den textkritischen Fußnotenanker an die betroffene Zahl. Die metonymische Deutung von „Streitwagen“ bleibt transparent in der Fußnote und der Schlusssatz bewahrt die Aussage, dass eine für 100 Streitwagen ausreichende Zahl Pferde nicht lahmgelegt wurde.
