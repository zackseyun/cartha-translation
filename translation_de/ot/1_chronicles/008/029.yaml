  source_fidelity: 'Die Übersetzung gibt alle Elemente des Hebräischen angemessen wieder: die anschließende Lokalangabe („Und in Gibeon“), das pluralische „wohnten“, die wörtliche, bewusst offene Bezeichnung „der Vater von Gibeon“, die Erwähnung seiner Frau und ihren Namen Maacha. Die Pluralform wird im Deutschen zutreffend auf den Vater und seine Frau bezogen. Die Fußnote wahrt die semantische Offenheit von אֲבִי גִבְעוֹן und entspricht dem englischen Audit-Trail.'
  naturalness: „Und in Gibeon wohnten der Vater von Gibeon und seine Frau; sie hieß Maacha“ ist verständliches, modernes und zugleich für einen genealogischen Kontext würdiges Standarddeutsch. Die Satzteilung durch das Semikolon ist idiomatisch und macht den Bezug von „sie“ klar.
  terminology: „Gibeon“ und „Maacha“ entsprechen geläufiger deutscher biblischer Namensschreibung. „Vater von Gibeon“ erhält die quellentreue Formulierung; die Alternativen „Gründer“ und „Oberhaupt“ stehen zutreffend nur in der Fußnote und legen keine einzelne Deutung fest.
