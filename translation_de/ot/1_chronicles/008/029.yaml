  text: וּ/בְ/גִבְע֥וֹן יָשְׁב֖וּ אֲבִ֣י גִבְע֑וֹן וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ מַעֲכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/029.yaml
  text: In Gibeon lived the father of Gibeon[a], and his wife’s name was Maacah.
translation:
  language: de
  text: Und in Gibeon wohnten der Vater von Gibeon[a] und seine Frau; sie hieß Maacha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Gründer von Gibeon“ oder „das Oberhaupt von Gibeon“; wörtlich: „der Vater von Gibeon“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/גִבְעוֹן
  choice: Und in Gibeon
  rationale: Die Verbindung aus Konjunktion und Präposition wird als „Und in Gibeon“ wiedergegeben; so bleiben sowohl der Anschluss an den Kontext als auch die Ortsangabe erhalten.
- source_word: יָשְׁבוּ
  choice: wohnten
  rationale: ישׁב bezeichnet hier in einer genealogisch-topografischen Notiz den Wohnsitz. „wohnten“ ist natürliches modernes Deutsch und berücksichtigt die Pluralform des Verbs.
- source_word: אֲבִי גִבְעוֹן
  choice: der Vater von Gibeon
  rationale: Die hebräische Konstruktverbindung bedeutet wörtlich „Vater von Gibeon“. Die möglicherweise übertragene Bedeutung als Gründer oder Oberhaupt wird nicht stillschweigend festgelegt, sondern in der Fußnote genannt.
- source_word: וְ/שֵׁם אִשְׁתּוֹ
  choice: und seine Frau; sie hieß
  rationale: Die wörtliche Wendung „und der Name seiner Frau“ wird in natürlichem Deutsch prädikativ wiedergegeben. Zugleich wird die Frau als zweites Subjekt des vorausgehenden Pluralverbs verständlich einbezogen.
- source_word: מַעֲכָה
  choice: Maacha
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition als „Maacha“ transliteriert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die syntaktische Spannung zwischen dem pluralischen Verb יָשְׁבוּ und der anschließenden Benennung des „Vaters von Gibeon“ sowie seiner Frau wird durch eine koordinierte deutsche Formulierung nachvollziehbar gemacht, ohne die lexikalische Mehrdeutigkeit von „Vater“ aufzulösen.
