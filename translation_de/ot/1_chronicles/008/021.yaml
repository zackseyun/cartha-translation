base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/021.yaml
  text: Adaiah[a], Beraiah, and Shimrath, the sons of Shimei.
translation:
  language: de
  text: Adaja, Beraja und Schimrat, die Söhne Schimis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲדָיָה
  choice: Adaja
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition wiedergegeben; die Form bildet die hebräischen Namensbestandteile angemessen ab.
- source_word: בְרָאיָה
  choice: Beraja
  rationale: Die Wiedergabe bewahrt das innere Alef der hebräischen Namensform und unterscheidet sie von der kürzeren Form Beria.
- source_word: שִׁמְרָת
  choice: Schimrat
  rationale: Der Personenname wird quellennah in moderner deutscher Umschrift wiedergegeben; das abschließende Tav erscheint als t.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der Status constructus im Plural bezeichnet in diesem genealogischen Zusammenhang die Söhne des folgenden Namensträgers.
- source_word: שִׁמְעִי
  choice: Schimis
  rationale: Schimi ist die im Deutschen geläufige Form des Personennamens; der Genitiv markiert natürlich und eindeutig die genealogische Zuordnung.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Standarddeutsch entsprechend dem genealogischen Listenstil. Die Eigennamen werden in geläufiger deutscher Bibelumschrift wiedergegeben; der bestimmte Artikel vor „Söhne“ macht den Satz als eigenständigen Vers natürlich lesbar.
