source:
  edition: WLC
  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִֽינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/033.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: de
  text: Und Ner zeugte Kisch, und Kisch zeugte Saul. Saul zeugte Jonatan, Malkischua, Abinadab und Eschbaal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eschbaal wird in 2. Samuel Isch-Boschet genannt.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Im Stammbaum bezeichnet der Hifil von ילד die männliche Abstammung. „Zeugte“ gibt diese genealogische Aussage knapp und präzise wieder und entspricht dem würdigen Register des Textes.
- source_word: נֵר
  choice: Ner
  rationale: Der Personenname wird nach etablierter deutscher Bibeltradition transliteriert.
- source_word: קִישׁ
  choice: Kisch
  rationale: Übliche deutsche Transliteration des Personennamens.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Etablierte deutsche Namensform.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Etablierte deutsche Form des Namens von Sauls Sohn; sie wahrt seine Identität, obwohl die hebräische Form hier Jehonatan lautet.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malkischua
  rationale: Die zusammenhängende deutsche Transliteration gibt den zweiteiligen hebräischen Personennamen natürlich wieder.
- source_word: אֲבִינָדָב
  choice: Abinadab
  rationale: Etablierte deutsche Transliteration des Personennamens.
- source_word: אֶשְׁבָּעַל
  choice: Eschbaal
  rationale: Der hebräische Text der Chronik bietet ausdrücklich Eschbaal; daher wird diese Namensform im Haupttext beibehalten und nicht mit der Form aus Samuel harmonisiert.
theological_decisions:
- issue: Namensform des zuletzt genannten Sohnes Sauls
  choice: Eschbaal im Haupttext
  alternative: Isch-Boschet
  rationale: Die Frage betrifft die überlieferte Namensform, nicht eine Lehrentscheidung. Chronik liest ausdrücklich Eschbaal, während derselbe Sohn Sauls in Samuel Isch-Boschet genannt wird. Der Haupttext folgt daher dem vorliegenden hebräischen Wortlaut; die bekannte Parallelform steht zur Orientierung in der Fußnote.
translation_notes:
  register: Moderne, klare und zugleich würdige Standardsprache. Die wiederholte genealogische Formel bleibt erhalten; vor der Aufzählung der Söhne wird sie zur besseren deutschen Lesbarkeit in einen neuen Satz gefasst.
