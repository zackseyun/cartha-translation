id: 1CH.8.13
reference: 1 Chronicles 8:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְרִעָ֣ה וָ/שֶׁ֔מַע הֵ֚מָּה רָאשֵׁ֣י הָ/אָב֔וֹת לְ/יוֹשְׁבֵ֖י אַיָּל֑וֹן הֵ֥מָּה הִבְרִ֖יחוּ אֶת י֥וֹשְׁבֵי גַֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/013.yaml
  text: And Beriah and Shema—they were heads of fathers’ houses among the inhabitants of Aijalon[b][a]; they were the ones who drove out the inhabitants of Gath.
translation:
  language: de
  text: Und Beria und Schema – sie waren die Oberhäupter der Sippen unter den Einwohnern von Ajalon.[a] Sie waren es, die die Einwohner von Gat vertrieben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier eine Bezeichnung für die Oberhäupter väterlich gegliederter Familien- oder Sippenverbände.
    reason: cultural_note
  - marker: b
    text: 'Oder: „in die Flucht schlugen“ beziehungsweise „zur Flucht zwangen“. Das hebräische Verb hebt hervor, dass die Einwohner von Gat zur Flucht gebracht wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרִעָה וָשֶׁמַע
  choice: Und Beria und Schema
  rationale: Die Personennamen werden in einer im Deutschen gebräuchlichen, quellennahen Form wiedergegeben; die vorangestellten Konjunktionen erhalten den genealogischen Erzählfluss.
- source_word: הֵמָּה
  choice: sie / Sie waren es
  rationale: Die selbstständigen Pronomen sind jeweils betont. Bei der zweiten Setzung bringt „Sie waren es“ diese Hervorhebung idiomatisch zum Ausdruck.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: die Oberhäupter der Sippen
  rationale: Der Ausdruck bezeichnet führende Männer väterlich-ancestral gegliederter Familienverbände. „Sippen“ ist im heutigen Deutsch verständlicher als eine wörtliche Wiedergabe mit „Vaterhäusern“, ohne die soziale Gliederung auf die moderne Kleinfamilie zu verengen.
- source_word: לְיוֹשְׁבֵי אַיָּלוֹן
  choice: unter den Einwohnern von Ajalon
  rationale: 'Das לְ wird hier am natürlichsten als Zuordnung innerhalb der Einwohnerschaft verstanden: Sie waren Sippenoberhäupter unter beziehungsweise innerhalb der Bewohner Ajalons. Die Präposition bleibt jedoch semantisch offen genug für eine Beziehung zu dieser Bevölkerung.'
- source_word: הִבְרִיחוּ
  choice: vertrieben
  rationale: Der Hifil-Stamm von ברח bezeichnet das Veranlassen zur Flucht. „Vertrieben“ gibt im Kontext sowohl den kausativen Vorgang als auch dessen wahrscheinliches Ergebnis natürlich wieder.
- source_word: אֶת יֹשְׁבֵי גַת
  choice: die Einwohner von Gat
  rationale: Die Formulierung gibt das direkte Objekt schlicht wieder und wahrt die lexikalische Entsprechung zum vorangehenden „Einwohner“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich und „Sie waren es“ bilden die zweimalige Hervorhebung durch הֵמָּה ab. Die Fußnotenmarker stehen jeweils unmittelbar nach der betreffenden Wendung.
