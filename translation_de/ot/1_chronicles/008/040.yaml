  text: וַֽ/יִּהְי֣וּ בְנֵי א֠וּלָם אֲנָשִׁ֨ים גִּבֹּרֵי חַ֜יִל דֹּ֣רְכֵי קֶ֗שֶׁת וּ/מַרְבִּ֤ים בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים מֵאָ֖ה וַ/חֲמִשִּׁ֑ים כָּל אֵ֖לֶּה מִ/בְּנֵ֥י בִנְיָמִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/040.yaml
  text: The sons of Ulam were mighty men of valor[a], drawers of the bow, and had many sons and grandsons, one hundred and fifty[c][b]. All these were from the sons of Benjamin.
translation:
  language: de
  text: Die Söhne Ulams waren tapfere Krieger und Bogenschützen.[a] Sie hatten viele Söhne und Enkel, insgesamt 150. Sie alle stammten von Benjamin ab.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die auf den Bogen treten“; gemeint sind Bogenschützen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sie alle waren von den Söhnen Benjamins“, das heißt, sie gehörten zu den Nachkommen beziehungsweise zum Stamm Benjamins.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: waren
  rationale: Das Wayyiqtol von היה leitet hier eine beschreibende Aussage innerhalb des Geschlechtsregisters ein; „waren“ ist im Deutschen natürlich und sachgerecht.
- source_word: בְנֵי אוּלָם
  choice: die Söhne Ulams
  rationale: Die Status-constructus-Verbindung bezeichnet Ulams Söhne und wird in einem genealogischen Zusammenhang knapp und formal wiedergegeben.
- source_word: אֲנָשִׁים גִּבֹּרֵי חַיִל
  choice: tapfere Krieger
  rationale: Die feste Wendung bezeichnet hier Männer von Stärke und militärischer Tüchtigkeit. „Tapfere Krieger“ gibt den Sinn natürlich wieder, ohne die Wendung auf bloße körperliche Kraft zu verengen.
- source_word: דֹּרְכֵי קֶשֶׁת
  choice: Bogenschützen
  rationale: Wörtlich sind Männer gemeint, die den Bogen spannen beziehungsweise niederdrücken; idiomatisch bezeichnet die Wendung geübte Bogenschützen.
- source_word: וּמַרְבִּים בָּנִים וּבְנֵי בָנִים
  choice: Sie hatten viele Söhne und Enkel
  rationale: Das Hifil-Partizip von רבה drückt hier eine große Zahl an Nachkommen aus. „Söhne und Enkel“ ist die natürliche deutsche Entsprechung von „Söhne und Söhne der Söhne“.
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: insgesamt 150
  rationale: Die Zahl folgt auf Söhne und Enkel und wird am natürlichsten als deren Gesamtzahl verstanden; „insgesamt“ verhindert, dass sie nur auf die Enkel bezogen wird.
- source_word: כָּל אֵלֶּה מִבְּנֵי בִנְיָמִן
  choice: Sie alle stammten von Benjamin ab
  rationale: Die Präposition מן mit בני kennzeichnet hier die stammesgeschichtliche Herkunft. Die Formulierung ist klarer und natürlicher als eine wörtliche Wiedergabe mit „von den Söhnen Benjamins“.
