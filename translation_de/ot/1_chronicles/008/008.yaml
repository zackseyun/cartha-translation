source:
  edition: WLC
  text: וְ/שַׁחֲרַ֗יִם הוֹלִיד֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב מִן שִׁלְח֖/וֹ אֹתָ֑/ם חוּשִׁ֥ים וְ/אֶֽת בַּעֲרָ֖א נָשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/008.yaml
  text: And Shaharaim fathered children in the country of Moab after he sent away Hushim and Baara[b][a], his wives.
translation:
  language: de
  text: Und Schaharajim zeugte im Gebiet von Moab Kinder, nachdem er seine Frauen Huschim und Baara fortgeschickt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „nach/seit seinem Wegschicken von ihnen“; möglich ist auch: „als er sie fortschickte“.'
    reason: Die knappe hebräische Konstruktion מִן mit Infinitiv kann zeitlich verschieden nuanciert werden; „nachdem“ ist wahrscheinlich, aber nicht völlig eindeutig.
lexical_decisions:
- source_word: וְ/שַׁחֲרַיִם
  choice: Und Schaharajim
  rationale: Das וְ verbindet den Vers mit der fortlaufenden Genealogie. Der Personenname wird in einer dem Hebräischen nahen, deutsch lesbaren Form wiedergegeben.
- source_word: הוֹלִיד
  choice: zeugte … Kinder
  rationale: Die Hifil-Form von ילד bezeichnet in genealogischem Zusammenhang das Zeugen beziehungsweise Vaterwerden. „Kinder“ macht den im Deutschen sonst unvollständigen Gebrauch verständlich, ohne die erst im Folgevers genannten Nachkommen vorwegzunehmen.
- source_word: בִּ/שְׂדֵה מוֹאָב
  choice: im Gebiet von Moab
  rationale: שָׂדֶה bedeutet wörtlich „Feld“, kann in geografischen Wendungen aber Land oder Gebiet bezeichnen. „Gebiet“ ist hier natürlich und wahrt den räumlichen Sinn.
- source_word: מִן שִׁלְח/וֹ אֹתָם
  choice: nachdem er … fortgeschickt hatte
  rationale: מִן mit dem Infinitivus constructus bezeichnet hier wahrscheinlich einen zeitlichen Ausgangspunkt. Die deutsche Vorzeitigkeit wird idiomatisch mit „nachdem … hatte“ ausgedrückt.
- source_word: חוּשִׁים וְ/אֶת בַּעֲרָא נָשָׁיו
  choice: seine Frauen Huschim und Baara
  rationale: נָשָׁיו bezeichnet hier seine Ehefrauen; die beiden Namen stehen als nähere Bestimmung dazu. Die deutsche Wortstellung ist klarer als eine nachgestellte Apposition.
theological_decisions: []
translation_notes:
  register: Moderne, würdige genealogische Prosa. „Zeugte“ bewahrt den sachlichen Abstammungssinn; „fortgeschickt“ lässt offen, ob eine formelle Scheidung gemeint ist.
