lexical_decisions:
- source_word: וֶ/אֱלִיעֵנַי
  choice: und Elienai
  rationale: Die Präposition ו wird als „und“ wiedergegeben. Der Personenname אֱלִיעֵנַי wird gemäß den im Deutschen üblichen biblischen Namensformen als „Elienai“ transliteriert.
- source_word: וְ/צִלְּתַי
  choice: Zilletai
  rationale: Der Personenname צִלְּתַי wird als „Zilletai“ transliteriert. Das vorangestellte ו gehört zur hebräischen Aufzählungsstruktur; im natürlichen deutschen Reihungsstil wird hier kein zusätzliches „und“ gesetzt.
- source_word: וֶ/אֱלִיאֵל
  choice: und Elïel
  rationale: Das vorangestellte ו wird am letzten Glied der deutschen Aufzählung mit „und“ wiedergegeben. Die Schreibung „Elïel“ kennzeichnet, dass die beiden Vokale getrennt gesprochen werden, und unterscheidet den Namen lesefreundlich von einer möglichen Diphthongierung.
theological_decisions: []
translation_notes:
  register: Knappes Glied einer Namensliste in natürlichem, würdigem Standarddeutsch. Die wiederholten hebräischen Konjunktionen werden als idiomatische deutsche Aufzählung wiedergegeben; die Eigennamen bleiben transliteriert.
