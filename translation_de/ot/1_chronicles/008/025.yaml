- source_word: פניאל
  choice: Pnuël
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen biblischen Form wiedergegeben; die Schreibung mit ë macht die getrennte Aussprache der Vokale kenntlich. Die mögliche Form Pniël wird in einer Fußnote genannt.
- source_word: בְּנֵי
  choice: waren die Söhne
  rationale: Der maskuline Konstruktplural bedeutet »Söhne von«. Im verblosen genealogischen Satz wird für natürliches modernes Deutsch »waren« ergänzt.
- source_word: שָׁשָׁק
