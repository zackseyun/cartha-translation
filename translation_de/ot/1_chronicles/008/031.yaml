lexical_decisions:
- source_word: וּגְדוֹר
  choice: und Gedor
  rationale: Die vorangestellte Konjunktion ו wird entsprechend dem Stil der Namensreihe mit „und“ wiedergegeben; גְדוֹר wird als Personenname nach üblicher deutscher Schreibweise transliteriert.
- source_word: וְאַחְיוֹ
  choice: Ahio
  rationale: אַחְיוֹ wird als Personenname „Ahio“ transliteriert. Die Konjunktion ו wird im Deutschen nicht eigens wiederholt, da eine natürliche Aufzählung vor dem letzten Glied nur ein „und“ verlangt.
- source_word: וָזָכֶר
  choice: und Secher
  rationale: Die Konjunktion ו wird mit „und“ wiedergegeben. זָכֶר wird entsprechend der masoretischen Vokalisierung und deutscher Transliterationskonvention als „Secher“ wiedergegeben.
theological_decisions: []
