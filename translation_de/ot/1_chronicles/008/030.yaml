  yaml_path: translation/ot/1_chronicles/008/030.yaml
  text: His firstborn son was Abdon[a], then Zur, Kish, Baal, and Nadab.
translation:
  language: de
  text: Sein erstgeborener Sohn war Abdon[a], danach Zur, Kisch, Baal und Nadab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und sein erstgeborener Sohn: Abdon, Zur, Kisch, Baal und Nadab.“'
