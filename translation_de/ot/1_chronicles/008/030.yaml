lexical_decisions:
- source_word: וּבְנוֹ
  choice: Sein … Sohn
  rationale: Das einleitende Waw verbindet den Vers mit der fortlaufenden Genealogie. Im Deutschen wird die Verbindung natürlich durch den Satzanschluss wiedergegeben; das Suffix wird mit „sein“ ausgedrückt.
- source_word: הַבְּכוֹר
  choice: erstgeborener
  rationale: Der Ausdruck bezeichnet den ersten Sohn nach der Geburtsfolge. „Erstgeborener“ bewahrt den unmittelbaren genealogischen Sinn.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Personenname in der im Deutschen üblichen biblischen Schreibweise.
- source_word: וְצוּר
  choice: danach Zur
  rationale: Der Personenname צוּר wird entsprechend der etablierten deutschen biblischen Form als „Zur“ wiedergegeben. „Danach“ macht den Übergang zur Aufzählung natürlich, ohne eine genaue zeitliche Abfolge über die Reihenfolge der Söhne hinaus zu behaupten.
- source_word: וְקִישׁ
  choice: Kisch
  rationale: Personenname in der üblichen deutschen biblischen Schreibweise.
- source_word: וּבַעַל
  choice: Baal
  rationale: Hier steht das Wort syntaktisch als Personenname in einer Genealogie und wird daher transliteriert, nicht als Titel oder Bezeichnung einer Gottheit übersetzt.
- source_word: וְנָדָב
  choice: Nadab
  rationale: Personenname in der üblichen deutschen biblischen Schreibweise.
