lexical_decisions:
- source_word: וַ/אֲבִישׁוּעַ
  choice: und Abischua
  rationale: Das vorangestellte ו wird als „und“ wiedergegeben und führt die genealogische Aufzählung fort. Der Personenname folgt der im Deutschen üblichen biblischen Namensform.
- source_word: וְ/נַעֲמָן
  choice: Naaman
  rationale: Das ו verbindet auch diesen Namen mit der Reihe; nach natürlichem deutschem Aufzählungsstil muss „und“ jedoch nicht vor jedem Glied wiederholt werden. Der Personenname wird in seiner geläufigen deutschen biblischen Form wiedergegeben.
- source_word: וַ/אֲחוֹחַ
  choice: und Achoach
  rationale: Das ו erscheint als abschließendes „und“ der deutschen Aufzählung. Der seltene Personenname wird quellennah als „Achoach“ transliteriert.
