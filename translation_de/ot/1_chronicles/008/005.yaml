translation:
  language: de
  text: Gera, Schefufan[a] und Huram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Schefufan; in verwandten Geschlechtsregistern begegnet die abweichende Namensform Schufam.
    reason: alternative_reading
  - marker: b
    text: Hebräisch Huram; in anderen Textzusammenhängen und Überlieferungen begegnet auch die Namensform Hiram.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵרָא
  choice: Gera
  rationale: Der Personenname wird entsprechend der hebräischen Lautgestalt und der im Deutschen geläufigen Namensform als »Gera« wiedergegeben.
- source_word: שְׁפוּפָן
  choice: Schefufan
  rationale: Der in diesem Vers vokalisierte hebräische Name wird lautnah und nach deutschen Umschriftgewohnheiten wiedergegeben. Die abweichende Form »Schufam« aus verwandten Geschlechtsregistern wird nicht in den Haupttext übernommen.
- source_word: חוּרָם
  choice: Huram
  rationale: Die Wiedergabe »Huram« folgt unmittelbar der hebräischen Namensform dieses Verses; die andernorts vorkommende beziehungsweise traditionell gebrauchte Form »Hiram« wird nicht stillschweigend eingesetzt.
- source_word: וְ
  choice: und
  rationale: Die vorangestellte hebräische Konjunktion verbindet die Namen als einfache Aufzählung; im natürlichen Deutschen steht »und« vor dem letzten Namen.
