  text: and Naaman[a], Ahijah[b], and Gera—he carried them into exile and fathered Uzza and Ahihud.
translation:
  language: de
  text: Und Naaman, Ahija und Gera – er[a] führte sie ins Exil[b] und zeugte Usa und Ahihud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische »er« bezieht sich am ehesten auf Gera; der genealogische Zusammenhang ist jedoch textlich und syntaktisch schwierig.
    reason: Mehrdeutiger Pronomenbezug.
  - marker: b
    text: 'Auch möglich: »verbannte sie« oder »verschleppte sie«. Das hebräische Verb ist kausativ: Er bewirkte, dass sie ins Exil gingen.'
    reason: Lexikalische Alternative und Erläuterung der Verbform.
lexical_decisions:
- source_word: נַעֲמָן
  choice: Naaman
  rationale: Personenname in der im Deutschen üblichen biblischen Form.
- source_word: אֲחִיָּה
  choice: Ahija
  rationale: Personenname in einer geläufigen deutschen Umschrift.
- source_word: גֵרָא
  choice: Gera
  rationale: Personenname; wird transliteriert.
- source_word: הוּא
  choice: Er
  rationale: Das selbstständige Pronomen greift den Handelnden nachdrücklich wieder auf; sein genauer Bezug bleibt im schwierigen genealogischen Zusammenhang offen.
- source_word: הֶגְלָם
  choice: führte sie in die Verbannung
  rationale: Die Hifil-Form von גלה mit dem Suffix der 3. Person Plural bezeichnet, dass jemand andere ins Exil gehen lässt beziehungsweise sie dorthin wegführt. Die Formulierung bewahrt sowohl den kausativen Sinn als auch das Objekt »sie«.
- source_word: וְהוֹלִיד
  choice: und zeugte
  rationale: Die Hifil-Form von ילד bezeichnet in genealogischem Zusammenhang das männliche Zeugen. »Zeugte« ist knapp, präzise und im Deutschen weiterhin verständlich.
- source_word: עֻזָּא
  choice: Usa
  rationale: Personenname in einer üblichen deutschen biblischen Schreibweise.
- source_word: אֲחִיחֻד
  choice: Ahihud
  rationale: Personenname; wird transliteriert.
theological_decisions:
- issue: Bezug des singularischen Pronomens הוּא
  choice: Der Haupttext gibt lediglich »Er« wieder und lässt den Bezug grammatisch offen.
  alternative: 'Das Pronomen ausdrücklich auf Gera beziehen: »Gera war es, der sie …«'
  rationale: Gera ist zwar das nächstliegende singularische Bezugswort, doch Syntax und Textüberlieferung dieses genealogischen Abschnitts sind schwierig. Eine ausdrückliche Identifizierung würde die echte Unsicherheit unnötig auflösen.
translation_notes:
  register: Moderne, würdige genealogische Prosa. »Zeugte« ist sachlich und präzise; »führte sie in die Verbannung« bildet die hebräische Kausativform transparent ab. Die Satzgrenze nach der Namensreihe macht die schwierige Syntax lesbar, ohne den Bezug von »Er« im Haupttext festzulegen.
