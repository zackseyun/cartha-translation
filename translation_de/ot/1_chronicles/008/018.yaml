  text: Jischmerai, Jislia und Jobab waren die Söhne Elpaals.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Söhne Elpaals«; das Verb »waren« ist im Hebräischen nicht ausdrücklich vorhanden.'
