lexical_decisions:
- source_word: יִשְׁמְרַי
  choice: Jischmerai
  rationale: Der Personenname wird nach im Deutschen üblichen biblischen Umschriftkonventionen wiedergegeben; anlautendes J entspricht dem hebräischen Jod, und sch gibt den Sch-Laut wieder.
- source_word: יִזְלִיאָה
  choice: Jislia
  rationale: Der Personenname wird in einer gut lesbaren, im Deutschen gebräuchlichen biblischen Form umschrieben.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: בְּנֵי
  choice: waren die Söhne
  rationale: Das hebräische Konstrukt bedeutet »Söhne von«. Für einen natürlichen deutschen Satz wird in der verblosen genealogischen Angabe »waren« ergänzt.
- source_word: אֶלְפָּעַל
  choice: Elpaals
  rationale: Der Personenname wird als Elpaal umschrieben und im Deutschen durch den Genitiv auf -s mit »Söhne« verbunden.
