  text: וּ/בְנֵ֖י עֵ֣שֶׁק אָחִ֑י/ו אוּלָ֣ם בְּכֹר֔/וֹ יְעוּשׁ֙ הַ/שֵּׁנִ֔י וֶֽ/אֱלִיפֶ֖לֶט הַ/שְּׁלִשִֽׁי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/039.yaml
  text: 'The sons of Eshek his brother: Ulam his firstborn[a], Jeush the second, and Eliphelet the third.'
translation:
  language: de
  text: 'Und die Söhne seines Bruders Eschek: Ulam, sein Erstgeborener, Jeusch, der zweite, und Elifelet, der dritte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Der vorangestellte hebräische Anschluss וּ wird ausdrücklich mit »Und« wiedergegeben; der Status constructus בְנֵי leitet die genealogische Zuordnung ein.
- source_word: עֵשֶׁק אָחִיו
  choice: seines Bruders Eschek
  rationale: Die deutsche Wortstellung macht eindeutig, dass Eschek als »sein Bruder« bezeichnet wird. אָחִיו wird in seiner gewöhnlichen Bedeutung »sein Bruder« wiedergegeben.
- source_word: אוּלָם
  choice: Ulam
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamentradition transliteriert.
- source_word: בְּכֹרוֹ
  choice: sein Erstgeborener
  rationale: »Erstgeborener« bewahrt die genealogische Genauigkeit des hebräischen Ausdrucks besser als das allgemeinere »Ältester«.
- source_word: יְעוּשׁ
  choice: Jëusch
  rationale: Die Schreibung kennzeichnet die getrennte Aussprache der Vokale und entspricht einer gebräuchlichen deutschen Wiedergabe des hebräischen Namens.
- source_word: הַשֵּׁנִי
  choice: der zweite
  rationale: Die Ordnungszahl bezeichnet die Reihenfolge der Söhne und wird direkt wiedergegeben.
- source_word: וֶאֱלִיפֶלֶט
  choice: und Elifelet
  rationale: Die Konjunktion vor dem letzten Glied der Aufzählung bleibt erhalten; der Personenname wird in einer geläufigen deutschen Form wiedergegeben.
- source_word: הַשְּׁלִשִׁי
  choice: der dritte
  rationale: Die Ordnungszahl wird unmittelbar und idiomatisch übersetzt.
theological_decisions: []
translation_notes:
  register: Natürliche, würdige genealogische Prosa in modernem Standarddeutsch. Das im Hebräischen nominal formulierte Verzeichnis erhält zur Lesbarkeit das ergänzte »waren«; dadurch wird keine inhaltliche Aussage hinzugefügt. Die hebräische Eingangskonjunktion bleibt sichtbar.
