  text: וּ/בְנֵ֣י אֶלְפַּ֔עַל עֵ֥בֶר וּ/מִשְׁעָ֖ם וָ/שָׁ֑מֶד ה֚וּא בָּנָ֣ה אֶת אוֹנ֔וֹ וְ/אֶת לֹ֖ד וּ/בְנֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/012.yaml
  text: 'The sons of Elpaal: Eber[a], Misham, and Shemed[b]; he built Ono and Lod and its villages.'
translation:
  language: de
  text: 'Und die Söhne Elpaals: Eber, Mischam und Schemed. Er[a] baute Ono und Lod und seine Ortschaften[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Er“ bezieht sich am ehesten auf Schemed, den zuletzt genannten Sohn; möglicherweise ist die Aussage aber allgemeiner auf die Familienlinie bezogen.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „und ihre Töchter“; damit sind die von Lod abhängigen Ortschaften gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶלְפַּעַל
  choice: Und die Söhne Elpaals waren
  rationale: Die Konstruktverbindung bezeichnet Elpaals Söhne und leitet ihre Aufzählung ein. „waren“ wird für einen natürlichen deutschen genealogischen Satz ergänzt; das anknüpfende וּ־ bleibt als „Und“ erhalten.
- source_word: עֵבֶר וּמִשְׁעָם וָשָׁמֶד
  choice: Eber, Mischam und Schemed
  rationale: Die Personennamen werden möglichst unmittelbar und nach gängiger deutscher Lautentsprechung wiedergegeben; die Konjunktion vor dem letzten Namen erscheint als „und“.
- source_word: הוּא
  choice: Er
  rationale: Das selbstständige Pronomen der dritten Person Singular Maskulinum greift am ehesten den zuletzt genannten Schemed auf. Die mögliche lockerere Bezugnahme auf die Familienlinie wird in einer Fußnote offengehalten.
- source_word: בָּנָה
  choice: baute
  rationale: Das Qal-Perfekt von בנה bedeutet schlicht „bauen“. „gründete“ oder „wiederaufbaute“ wäre stärker interpretierend.
- source_word: אֶת אוֹנוֹ וְאֶת לֹד
  choice: Ono und Lod
  rationale: Die direkten Objektmarker bleiben unübersetzt; die Ortsnamen werden aus dem Hebräischen transliteriert.
- source_word: וּבְנֹתֶיהָ
  choice: samt den dazugehörigen Ortschaften
  rationale: Wörtlich „und ihre Töchter“; bei Städten bezeichnet der Ausdruck abhängige kleinere Siedlungen. Die idiomatische Wiedergabe wahrt die Zugehörigkeitsbeziehung, ohne zwingend räumliche Nähe als einzige Nuance festzulegen.
theological_decisions:
- issue: Bezugswort des männlichen Pronomens הוּא
  choice: „Er“ bezieht sich im Haupttext am naheliegendsten auf Schemed.
  alternative: Das Pronomen kann lockerer auf die genannte Familienlinie beziehungsweise deren Angehörige bezogen werden.
  rationale: Die unmittelbare Syntax begünstigt Schemed als letzten männlichen Singularreferenten, doch die knappe genealogische Ausdrucksweise lässt die weiter gefasste Deutung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper genealogischer Satzführung. „Samt“ gibt die enge Verbindung der abhängigen Ortschaften mit Lod natürlich wieder; die Fußnoten bewahren die echte Referenz- und Idiomatikfrage.
