  text: und Sebadja, Meschullam, Hiski und Heber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/זְבַדְיָה
  choice: und Sebadja
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition wiedergegeben; das vorangestellte וּ wird mit „und“ übersetzt.
- source_word: וּ/מְשֻׁלָּם
  choice: Meschullam
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Umschrift wiedergegeben. Das verbindende וּ ist in der natürlichen deutschen Aufzählung durch das einleitende und abschließende „und“ vertreten.
- source_word: וְ/חִזְקִי
  choice: Hiski
  rationale: Die Form gibt חִזְקִי möglichst unmittelbar wieder und vermeidet eine Gleichsetzung mit dem anders lautenden Namen Hiskia.
- source_word: וָ/חָבֶר
  choice: und Heber
  rationale: „Heber“ ist die etablierte deutsche Wiedergabe dieses Personennamens; das Präfix וָ wird als abschließendes „und“ der Aufzählung wiedergegeben.
