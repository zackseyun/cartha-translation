  rationale: Der Personenname wird lautnah und nach deutschen Schreibkonventionen transliteriert.
- source_word: וִ/ירֵמֽוֹת
  choice: und Jeremot
  rationale: Das Präfix וִ wird als „und“ wiedergegeben. Die masoretisch vokalisierte Namensform יְרֵמוֹת wird in deutscher Transliteration als „Jeremot“ wiedergegeben.
