base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/036.yaml
  text: Ahaz fathered Jehoaddah[a], and Jehoaddah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: de
  text: Ahas zeugte Jehoadda[a]. Jehoadda zeugte Alemet, Asmawet und Simri; und Simri zeugte Moza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Jehoaddah; einige englische Bibeltraditionen lesen „Jehoadah“.
    reason: textliche Namensvariante in englischen Bibeltraditionen
lexical_decisions:
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet der Hifil von ילד das Hervorbringen eines direkten Nachkommen. „zeugte“ ist im Deutschen knapp, würdig und sachlich präzise.
- source_word: אֶת
  choice: '[nicht gesondert übersetzt]'
  rationale: Die hebräische Akkusativpartikel hat keine eigenständige deutsche Entsprechung; ihre Funktion zeigt sich in der deutschen Satzstellung.
- source_word: יְהוֹעַדָּה
  choice: Jehoadda
  rationale: Der Personenname wird entsprechend der im hebräischen Text bezeugten Form transliteriert; die Verdoppelung in „-adda“ gibt das Dagesch im Dalet wieder.
- source_word: עָלֶמֶת
  choice: Alemet
  rationale: Der Eigenname wird nach einer im Deutschen gut lesbaren, quellennahen Transliteration wiedergegeben.
- source_word: עַזְמָוֶת
  choice: Asmawet
  rationale: Quellennahe deutsche Transliteration des Eigennamens; ז wird als s und ו in dieser Lautumgebung als w wiedergegeben.
- source_word: זִמְרִי
  choice: Simri
  rationale: Der Name wird an beiden Stellen einheitlich nach üblicher deutscher Bibelnamen-Schreibung wiedergegeben.
- source_word: מוֹצָא
  choice: Moza
  rationale: Quellennahe Wiedergabe des Eigennamens; צ wird mit z wiedergegeben.
- source_word: וְ
  choice: und
  rationale: Die Konjunktion verbindet Personen beziehungsweise genealogische Aussagen. „und“ bewahrt die parataktische Struktur, ohne eine zusätzliche zeitliche oder logische Deutung einzutragen.
