source:
  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י אֵח֑וּד אֵ֣לֶּה הֵ֞ם רָאשֵׁ֤י אָבוֹת֙ לְ/י֣וֹשְׁבֵי גֶ֔בַע וַ/יַּגְל֖וּ/ם אֶל מָנָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/006.yaml
  text: 'These were the sons of Ehud[a]. These were the heads of fathers’ houses for the inhabitants of Geba[b], and they carried them into exile to Manahath:'
translation:
  language: de
  text: 'Und dies waren die Söhne Ehuds. Sie waren die Oberhäupter der Großfamilien[a] der Einwohner von Geba und verschleppten sie[b] nach Manahat:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Häupter der Vaterhäuser“; gemeint sind Leiter abstammungsbezogener Großfamilien oder Sippen.'
    reason: cultural_note
  - marker: b
    text: Das hebräische Pronomen nennt die Verschleppten nicht ausdrücklich; wahrscheinlich sind die Einwohner von Geba gemeint.
    reason: ambiguity_note
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Die einleitende Verknüpfung und die genealogische Vorstellungsformel werden in natürlichem Deutsch bewahrt.
- source_word: בְּנֵי אֵחוּד
  choice: die Söhne Ehuds
  rationale: „Söhne“ entspricht der genealogischen Ausdrucksweise und kann im Kontext auch Nachkommen bezeichnen; der Personenname wird als Ehud wiedergegeben.
- source_word: אֵלֶּה הֵם
  choice: Sie waren
  rationale: Die wiederaufnehmende hebräische Wendung wird im Deutschen flüssig auf die zuvor genannten Söhne bezogen; das Präteritum passt zum erzählenden Rückblick.
- source_word: רָאשֵׁי אָבוֹת
  choice: die Oberhäupter der Großfamilien
  rationale: Die Wendung bezeichnet Leiter größerer, abstammungsbezogener Familienverbände. Die verständliche Wiedergabe wird durch eine Fußnote zur wörtlichen Form ergänzt.
- source_word: לְיֹשְׁבֵי גֶבַע
  choice: der Einwohner von Geba
  rationale: Der Zugehörigkeitsbezug des ל wird im Deutschen idiomatisch mit dem Genitiv ausgedrückt.
- source_word: וַיַּגְלוּם
  choice: und verschleppten sie
  rationale: Der Hifil von גלה bezeichnet das erzwungene Wegführen in die Fremde. „Verschleppen“ ist prägnant, modern und erhält das Objektpronomen, ohne dessen Bezug im Haupttext festzulegen.
- source_word: אֶל מָנָחַת
  choice: nach Manahat
  rationale: Bei Ortsnamen ist „nach“ die natürliche deutsche Richtungsangabe; der Name wird als Manahat transliteriert.
