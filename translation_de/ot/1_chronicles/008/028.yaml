base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/028.yaml
  text: These were heads of fathers’ houses according to their generations[a], chief men. These lived in Jerusalem.
translation:
  language: de
  text: Diese waren die Oberhäupter der Großfamilien, nach ihren Geschlechterfolgen[a] führende Männer. Diese wohnten in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die Oberhäupter der Großfamilien nach ihren Geschlechterfolgen, Oberhäupter“. Im Hebräischen wird das Wort für „Haupt/Oberhaupt“ zur Hervorhebung wiederholt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי אָבוֹת
  choice: Oberhäupter der Großfamilien
  rationale: Die hebräische Konstruktverbindung bezeichnet die Leiter väterlich bestimmter Familien- oder Sippenverbände. „Oberhäupter der Großfamilien“ gibt die soziale Funktion verständlich wieder, ohne den missverständlichen Ausdruck „Häupter der Väter“ wörtlich nachzubilden.
- source_word: לְתֹלְדוֹתָם
  choice: nach ihren Geschlechterfolgen
  rationale: תולדות bezeichnet hier die genealogische Abfolge beziehungsweise Abstammungsgliederung. Die Formulierung bewahrt den genealogischen Sinn, ohne ausdrücklich schriftliche Register vorauszusetzen.
- source_word: רָאשִׁים
  choice: führende Männer
  rationale: Das zweite Vorkommen des Wortstamms für „Haupt“ hebt den Rang der Genannten hervor. „Führende Männer“ vermeidet eine unnatürliche deutsche Wiederholung, während eine Fußnote auf die bewusste Wiederholung im Hebräischen hinweist.
- source_word: יָשְׁבוּ
  choice: wohnten
  rationale: Das Verb bezeichnet in diesem genealogischen Zusammenhang den Wohnsitz. „Wohnten“ ist modernes, natürliches Deutsch und passt zur dauerhaften Ansässigkeit.
- source_word: בִירוּשָׁלָם
  choice: in Jerusalem
  rationale: Standardwiedergabe des Ortsnamens unter Beibehaltung der Präposition.
- source_word: אֵלֶּה ... אֵלֶּה
  choice: Diese ... Diese
  rationale: Die zweimalige Demonstrativform wird zur Wahrung der hebräischen Gliederung und Hervorhebung in beiden Sätzen beibehalten.
