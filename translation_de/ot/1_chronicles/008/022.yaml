lexical_decisions:
- source_word: יִשְׁפָּן
  choice: Jischpan
  rationale: Der Personenname wird nach der hebräischen Form ins Deutsche übertragen; „sch“ gibt den Laut שׁ wieder.
- source_word: עֵבֶר
  choice: Eber
  rationale: Der Personenname wird unmittelbar nach der masoretischen Form עֵבֶר wiedergegeben; die traditionelle Nebenform „Heber“ wird in einer Fußnote genannt.
- source_word: אֱלִיאֵל
  choice: Eliël
  rationale: Der Personenname wird transliteriert, nicht nach seinen theophoren Bestandteilen übersetzt; das Trema macht die getrennte Aussprache der Vokale deutlich.
- source_word: וְ / וָ / וֶ
  choice: und
  rationale: Die vorangestellten Waw-Konjunktionen verbinden die Namen einer Aufzählung; im natürlichen Deutschen stehen Kommas und nur vor dem letzten Namen „und“.
