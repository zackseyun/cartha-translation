lexical_decisions:
- source_word: וּלְאָצֵל
  choice: Azel hatte
  rationale: Die hebräische genealogische Besitzformel mit ל wird im Deutschen natürlich mit »hatte« wiedergegeben; die wörtlichere Struktur wird in der Fußnote genannt.
- source_word: שִׁשָּׁה בָנִים
  choice: sechs Söhne
  rationale: בָנִים bezeichnet in dieser genealogischen Aufzählung männliche Nachkommen.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: und so hießen sie
  rationale: Die deutsche Namensformel gibt den Sinn des hebräischen »und dies waren ihre Namen« flüssig und präzise wieder.
- source_word: עַזְרִיקָם בֹּכְרוּ
  choice: Asrikam, sein Erstgeborener
  rationale: בֹּכְרוּ steht als Apposition zu Asrikam und bezeichnet ihn als Azels Erstgeborenen.
- source_word: יִשְׁמָעֵאל
  choice: Jismael
  rationale: Im modernen deutschen Bibeldeutsch geläufige Umschrift des Personennamens.
- source_word: שְׁעַרְיָה
  choice: Schearja
  rationale: Deutsche Umschrift des hebräischen Personennamens.
- source_word: עֹבַדְיָה
  choice: Obadja
  rationale: Im Deutschen geläufige Form des hebräischen Personennamens.
- source_word: חָנָן
  choice: Hanan
  rationale: Nahe Umschrift des hebräischen Personennamens.
- source_word: כָּל אֵלֶּה בְּנֵי אָצַל
  choice: Sie alle waren Söhne Azels
  rationale: Die zusammenfassende genealogische Aussage wird in natürlicher deutscher Wortstellung wiedergegeben.
