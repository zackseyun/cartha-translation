base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/038.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan. All these were the sons of Azel.'
translation:
  language: de
  text: 'Azel hatte sechs Söhne[a], und so hießen sie: Asrikam, sein Erstgeborener, Jismael, Schearja, Obadja und Hanan. Sie alle waren Söhne Azels.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Azel wurden sechs Söhne zuteil.« Das Hebräische verwendet eine genealogische Besitzformel.'
