lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: Und Miklot
  rationale: Die Konjunktion וּ wird als „Und“ wiedergegeben; der Personenname wird in einer dem Hebräischen nahen deutschen Form transliteriert.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Das Hifil von ילד bezeichnet in genealogischem Zusammenhang das Zeugen beziehungsweise Vaterwerden; „zeugte“ ist knapp, präzise und im deutschen Bibelregister verständlich.
- source_word: אֶת שִׁמְאָה
  choice: Schima
  rationale: Die Akkusativpartikel bleibt unübersetzt; der Personenname wird nach deutscher Transliterationskonvention wiedergegeben.
- source_word: וְאַף הֵמָּה
  choice: Auch sie
  rationale: Die Wendung drückt einschließende Hervorhebung aus; „Auch sie“ gibt dies natürlich wieder.
- source_word: נֶגֶד
  choice: gegenüber
  rationale: Das Wort bezeichnet eine räumliche Lage vor oder gegenüber jemandem; „gegenüber“ erhält die konkrete Ortsbeziehung, ohne sie auf bloße Nähe zu verengen.
- source_word: אֲחֵיהֶם
  choice: ihren Brüdern
  rationale: Die wörtliche Wiedergabe bewahrt die männliche Verwandtschaftsbezeichnung; im genealogischen Kontext können damit auch weitere Angehörige derselben Sippe gemeint sein.
- source_word: יָשְׁבוּ
  choice: wohnten
  rationale: ישב kann sitzen, wohnen oder ansässig sein bedeuten; hier bezeichnet es den Wohnort.
- source_word: בִּירוּשָׁלִַם
  choice: in Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: עִם אֲחֵיהֶם
  choice: zusammen mit ihren Brüdern
  rationale: עִם wird als „mit“ wiedergegeben; „zusammen“ macht die gemeinschaftliche Bedeutung idiomatisch deutlich und die Wiederholung von „ihren Brüdern“ bleibt erhalten.
