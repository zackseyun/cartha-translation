translation:
  language: de
  text: Und Mikloth zeugte Schimah. Auch sie wohnten ihren Brüdern gegenüber[a] in Jerusalem, zusammen mit ihren Brüdern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor ihren Brüdern« beziehungsweise »in der Nähe ihrer Brüder«; das hebräische Wort kann eine Lage vor, gegenüber oder nahe bei jemandem bezeichnen.'
