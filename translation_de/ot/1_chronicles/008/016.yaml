lexical_decisions:
- source_word: וּ/מִיכָאֵל
  choice: und Michael
  rationale: Der vorangestellte Konjunktion wird mit „und“ wiedergegeben; für den Personennamen wird die im Deutschen etablierte Form „Michael“ verwendet.
- source_word: וְ/יִשְׁפָּה
  choice: Jischpa
  rationale: Der hebräische Personenname wird nach gebräuchlicher deutscher Umschrift wiedergegeben. Die Reihung klingt im Deutschen natürlicher, wenn nicht jede hebräische Konjunktion einzeln abgebildet wird.
- source_word: וְ/יוֹחָא
  choice: und Joha
  rationale: Die Konjunktion kennzeichnet das letzte Glied der Aufzählung; „Joha“ entspricht einer geläufigen deutschen Namensform.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Im genealogischen Zusammenhang bezeichnet der Ausdruck unmittelbar die männlichen Nachkommen beziehungsweise Söhne; hier ist „Söhne“ die präziseste Wiedergabe.
- source_word: בְרִיעָה
  choice: Berias
  rationale: Der Name wird in der etablierten deutschen Form „Beria“ wiedergegeben und wegen der Zugehörigkeitsbeziehung idiomatisch in den Genitiv gesetzt.
