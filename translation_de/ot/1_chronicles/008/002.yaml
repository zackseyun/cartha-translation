lexical_decisions:
- source_word: נוֹחָה
  choice: Noha
  rationale: Personenname; nach dem Hebräischen transliteriert. Die Form „Noha“ gibt die hebräische Aussprache im Deutschen knapp und natürlich wieder.
- source_word: הָרְבִיעִי
  choice: der vierte
  rationale: Der bestimmte Ordinalausdruck bezeichnet in der genealogischen Aufzählung die Reihenfolge; der Artikel wird entsprechend wiedergegeben.
- source_word: וְ
  choice: und
  rationale: Einfache verbindende Konjunktion zwischen den beiden Gliedern der Aufzählung.
- source_word: רָפָא
  choice: Rafa
  rationale: Personenname; die Schreibung mit „f“ entspricht der modernen deutschen Wiedergabe des hebräischen Lautes פ ohne Dagesch.
- source_word: הַחֲמִישִׁי
  choice: der fünfte
  rationale: Bestimmter Ordinalausdruck, parallel zu „der vierte“, der die Reihenfolge innerhalb der Genealogie angibt.
