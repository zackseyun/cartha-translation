lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: hatte
  rationale: Die Verbindung von »sein« mit לְ und dem Namen des Vaters ist eine genealogische Besitzkonstruktion; im natürlichen Deutschen entspricht ihr »hatte«.
- source_word: בָנִים
  choice: Söhne
  rationale: Im unmittelbaren genealogischen Zusammenhang bezeichnet בָנִים männliche Nachkommen; die genannten Personen sind als Söhne Belas aufgeführt.
- source_word: לְבָלַע
  choice: Bela
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: אַדָּר
  choice: Addar
  rationale: Die Umschrift »Addar« bildet die Verdoppelung des hebräischen Dalet ab; die vereinfachte Form »Adar« ist ebenfalls möglich.
- source_word: וְגֵרָא
  choice: Gera
  rationale: Der Personenname wird in gebräuchlicher deutscher Umschrift wiedergegeben.
- source_word: וַאֲבִיהוּד
  choice: Abihud
  rationale: Der Personenname wird in gebräuchlicher deutscher Umschrift wiedergegeben.
