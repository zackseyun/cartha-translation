source:
  edition: WLC
  text: וּ/בֶן יְהוֹנָתָ֖ן מְרִ֣יב בָּ֑עַל וּ/מְרִ֥יב בַּ֖עַל הוֹלִ֥יד אֶת מִיכָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/034.yaml
  text: And the son of Jehonathan was Merib-baal[a], and Merib-baal fathered Micah.
translation:
  language: de
  text: Und Jehonatans Sohn war Merib-Baal; Merib-Baal zeugte Micha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'In 2. Samuel 9,12 wird der Name im Hebräischen etwas anders geschrieben: מִיכָא statt מִיכָה hier in 1. Chronik.'
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן יְהוֹנָתָן
  choice: Und Jehonatans Sohn
  rationale: Die Verbindung וּ wird mit „Und“ wiedergegeben und führt die genealogische Reihe fort. Der Genitiv „Jehonatans Sohn“ ist im Deutschen natürlicher als „der Sohn von Jehonatan“. Die Namensform „Jehonatan“ gibt die im Ausgangstext stehende volle Form יְהוֹנָתָן wieder, statt sie zu „Jonatan“ zu vereinheitlichen.
- source_word: מְרִיב בָּעַל / מְרִיב בַּעַל
  choice: Merib-Baal
  rationale: Der aus zwei Bestandteilen geschriebene Personenname wird durch einen Bindestrich als zusammengehöriger Name kenntlich gemacht. Beide Vorkommen bezeichnen dieselbe Person.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet die Hifil-Form von ילד die Vaterschaft beziehungsweise direkte Abstammung. „zeugte“ ist knapp, idiomatisch und entspricht dem Stil eines Geschlechtsregisters.
- source_word: אֶת מִיכָה
  choice: Micha
  rationale: אֶת ist das nicht eigens zu übersetzende Akkusativzeichen. מִיכָה wird in der üblichen deutschen Namensform als „Micha“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Gegenwartsdeutsch im Stil eines Geschlechtsregisters. Das Semikolon bildet die Wiederaufnahme von Merib-Baal ab, ohne zwei Personen anzunehmen. Der Fußnotenmarker steht bei „Micha“, da sich die erläuterte Schreibvariante auf diesen Namen bezieht.
