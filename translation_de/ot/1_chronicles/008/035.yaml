base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/035.yaml
  text: 'And the sons of Micah: Pithon[a], Melech, Tarea, and Ahaz.'
translation:
  language: de
  text: 'Und die Söhne Michas: Pithon, Melech, Tarea und Ahas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Das ו wird als „Und“ wiedergegeben, um die fortlaufende genealogische Aufzählung zu bewahren; בְנֵי bezeichnet hier die unmittelbar genannten Söhne.
- source_word: מִיכָה
  choice: Michas
  rationale: Der Personenname wird in der im Deutschen etablierten Form wiedergegeben; der Genitiv fügt sich natürlich in die Wendung „die Söhne Michas“ ein.
- source_word: פִּיתוֹן
  choice: Piton
  rationale: Direkte, im Deutschen gut lesbare Umschrift des hebräischen Personennamens.
- source_word: וָמֶלֶךְ
  choice: Melech
  rationale: Im genealogischen Zusammenhang ist מֶלֶךְ ein Personenname und nicht als das Gattungswort „König“ zu übersetzen. Die einzelnen hebräischen Konjunktionen werden nach natürlichem deutschem Listenstil zusammengezogen.
- source_word: וְתַאְרֵעַ
  choice: Tarea
  rationale: Der Personenname wird entsprechend der masoretischen Form תַאְרֵעַ als „Tarea“ umschrieben.
- source_word: וְאָחָז
  choice: Ahas
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
