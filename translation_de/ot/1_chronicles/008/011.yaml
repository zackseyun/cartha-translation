  source_fidelity: Die Wiedergabe von הוֹלִיד mit „zeugte er“ trifft die genealogische Bedeutung des Hifil von ילד. Die Namen sind quellennahe und konsistent transliteriert. „mit Huschim“ gibt jedoch die hebräische Präposition מִן nicht unmittelbar wieder und legt die Beziehung stärker als partnerschaftliches Mitwirken aus; „von Huschim“ bewahrt die Formulierung und ihre genealogische Nuance besser.
