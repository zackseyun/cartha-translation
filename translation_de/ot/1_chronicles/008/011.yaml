  yaml_path: translation/ot/1_chronicles/008/011.yaml
  text: And by Hushim he fathered Abitub and Elpaal[a].
translation:
  language: de
  text: Und von Huschim zeugte er Abitub und Elpaal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Huschim“. Wörtlich: „von Huschim“. Die hebräische Präposition bezeichnet im genealogischen Zusammenhang die Abstammungsbeziehung durch Huschim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֻשִׁים
  choice: Und mit Huschim
  rationale: Die Verbindung aus Konjunktion und der Präposition מִן bezeichnet hier Herkunft beziehungsweise die Mutter, durch die die Nachkommen geboren wurden. Im Deutschen gibt „mit Huschim“ die genealogische Beziehung natürlich wieder; die wörtlichere Möglichkeit „von Huschim“ bleibt in der Fußnote erhalten.
- source_word: הוֹלִיד
  choice: zeugte er
  rationale: Der Hifil von ילד bezeichnet in genealogischen Zusammenhängen das Zeugen beziehungsweise Vaterwerden. „zeugte“ ist knapp, würdevoll und im Deutschen für Geschlechtsregister geläufig.
- source_word: אֶת
  choice: nicht eigens wiedergegeben
  rationale: Der hebräische Akkusativmarker besitzt keine eigenständige deutsche Entsprechung.
- source_word: אֲבִיטוּב
  choice: Abitub
  rationale: Der Personenname wird in einer im Deutschen lesbaren, quellenahen Form transliteriert.
- source_word: וְ/אֶת
  choice: und
  rationale: Die Konjunktion wird mit „und“ wiedergegeben; der angefügte Akkusativmarker bleibt unübersetzt.
- source_word: אֶלְפָּעַל
  choice: Elpaal
  rationale: Der Personenname wird in der gebräuchlichen, gut lesbaren Form ohne Apostroph transliteriert.
