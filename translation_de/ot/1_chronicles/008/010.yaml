translation_notes:
  register: Moderner, würdiger genealogischer Stil. Die Namensreihe setzt syntaktisch den vorhergehenden Vers fort; deshalb beginnt der Vers mit »und«. Der knappe hebräische Nominalsatz wird natürlich mit »waren« wiedergegeben.
