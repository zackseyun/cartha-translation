  yaml_path: translation/ot/1_chronicles/008/010.yaml
  text: and Jeuz[a], and Sachia, and Mirmah. These were his sons, heads of fathers’ houses.
translation:
  language: de
  text: Und Jeuz, Sachja und Mirma. Diese waren seine Söhne, die Oberhäupter von Großfamilien.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Oberhäupter der Väter«. Gemeint sind die führenden Männer von Großfamilien oder Sippen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְעוּץ
  choice: Jeuz
  rationale: Personenname; in einer im Deutschen gebräuchlichen, eng am Hebräischen orientierten Form wiedergegeben.
- source_word: שָׂכְיָה
  choice: Sachja
  rationale: Personenname; die Form gibt die hebräischen Konsonanten und Vokale in natürlicher deutscher Schreibweise wieder.
- source_word: מִרְמָה
  choice: Mirma
  rationale: Im genealogischen Zusammenhang eindeutig ein Personenname; daher nicht nach der möglichen Bedeutung des gleichlautenden Substantivs übersetzt.
- source_word: אֵלֶּה
  choice: Diese
  rationale: Der pluralische Demonstrativausdruck verweist auf die zuvor genannten Söhne zurück.
- source_word: בָנָיו
  choice: seine Söhne
  rationale: Der maskuline Plural bezeichnet in diesem genealogischen Zusammenhang Söhne, nicht allgemein Kinder.
- source_word: רָאשֵׁי אָבוֹת
  choice: die Oberhäupter von Großfamilien
  rationale: Die hebräische Wendung bezeichnet führende Männer größerer, von gemeinsamen Vorfahren hergeleiteter Familienverbände. Diese Wiedergabe ist im modernen Deutsch verständlich, ohne den Ausdruck auf politische Stammesführer einzuengen.
