  rationale: Der Personenname wird als „Arad“ transliteriert. Das vorangestellte וַ muss in der natürlichen deutschen Aufzählung nicht eigens wiederholt werden.
- source_word: וָ/עָדֶר
  choice: und Eder
  rationale: Die Konjunktion וָ wird vor dem letzten Glied der Aufzählung mit „und“ wiedergegeben; der masoretisch vokalisierte Name עָדֶר wird als „Eder“ transliteriert.
