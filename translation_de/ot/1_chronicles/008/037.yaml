  text: וּ/מוֹצָ֖א הוֹלִ֣יד אֶת בִּנְעָ֑א רָפָ֥ה בְנ֛/וֹ אֶלְעָשָׂ֥ה בְנ֖/וֹ אָצֵ֥ל בְּנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/037.yaml
  text: And Moza fathered Binea; Rephah was his son, Eleasah his son, Azel his son.
translation:
  language: de
  text: Und Moza zeugte Binea; dessen Sohn war Rafa, dessen Sohn war Elasa, dessen Sohn war Azel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מוֹצָא
  choice: Und Moza
  rationale: Die Konjunktion ו wird beibehalten, da sie den Vers mit der fortlaufenden Geschlechtsfolge verbindet; מוֹצָא wird als Personenname „Moza“ wiedergegeben.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in einer Genealogie das Zeugen beziehungsweise Vaterwerden. „zeugte“ ist knapp, präzise und im gehobenen modernen Deutsch verständlich.
- source_word: אֶת
  choice: '[nicht gesondert wiedergegeben]'
  rationale: Der hebräische Akkusativmarker besitzt im Deutschen keine eigene lexikalische Entsprechung.
- source_word: בִּנְעָא
  choice: Bina
  rationale: „Bina“ ist die im Deutschen geläufige und der hebräischen Lautgestalt angemessene Form dieses Personennamens.
- source_word: רָפָה
  choice: Rafa
  rationale: Die Schreibung „Rafa“ bildet die hebräische Lautung רָפָה in moderner deutscher Umschrift verständlich ab.
- source_word: בְנ/וֹ
  choice: sein Sohn
  rationale: Die dreimal wiederholte Wendung bedeutet jeweils „sein Sohn“ und kennzeichnet die aufeinanderfolgenden Generationen.
- source_word: אֶלְעָשָׂה
  choice: Elasa
  rationale: „Elasa“ gibt den hebräischen Personennamen in einer natürlichen deutschen Namensform wieder.
- source_word: אָצֵל
  choice: Azel
  rationale: „Azel“ ist eine direkte und im Deutschen gut lesbare Wiedergabe des hebräischen Personennamens.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges genealogisches Deutsch. Nach dem vollständigen Satzanfang bleibt die dreifache Formel „sein Sohn“ erhalten; beim ersten Glied wird zur natürlichen deutschen Syntax „war“ ergänzt. Das abschließende „und“ gliedert die Reihe idiomatisch, ohne die Abstammungsverhältnisse zu verändern.
