  text: וַ/יּ֖וֹלֶד מִן חֹ֣דֶשׁ אִשְׁתּ֑/וֹ אֶת יוֹבָב֙ וְ/אֶת צִבְיָ֔א וְ/אֶת מֵישָׁ֖א וְ/אֶת מַלְכָּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/009.yaml
  text: And he fathered Jobab[a], Zibia, Mesha, and Malcam by Hodesh his wife.
translation:
  language: de
  text: Mit seiner Frau Hodesch zeugte er Jobab[a], Zibja, Mescha und Malkam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Von seiner Frau Hodesch zeugte er Jobab …“ Die hebräische Präposition kann in dieser genealogischen Formulierung sowohl mit „mit“ als auch mit „von“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: zeugte er
  rationale: Der Hifil wayyiqtol von ילד bezeichnet in diesem genealogischen Zusammenhang das Zeugen von Kindern. „zeugte“ ist präzise und im Deutschen für Geschlechtsregister geläufig.
- source_word: מִן
  choice: mit
  rationale: Die Präposition bezeichnet hier Hodesch als Mutter der genannten Söhne. „Mit seiner Frau Hodesch“ ist natürliches modernes Deutsch; die mögliche wörtlichere Wiedergabe „von“ wird in der Fußnote bewahrt.
- source_word: חֹדֶשׁ
  choice: Hodesch
  rationale: Der Personenname wird nach üblichen deutschen Transkriptionsgewohnheiten wiedergegeben.
- source_word: אִשְׁתּוֹ
  choice: seiner Frau
  rationale: אִשָּׁה mit Suffix bezeichnet in diesem Zusammenhang eindeutig die Ehefrau.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: '[nicht eigens wiedergegeben; Namen als Aufzählung verbunden]'
  rationale: Die wiederholten direkten Objektmarker besitzen keine unmittelbare deutsche Entsprechung. Ihre syntaktische Funktion wird durch die Aufzählung der Namen ausgedrückt.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Übliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: צִבְיָא
  choice: Zibja
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren, hebräisch orientierten Form transkribiert.
- source_word: מֵישָׁא
  choice: Mescha
  rationale: Deutsche Transkription des hebräischen Personennamens.
- source_word: מַלְכָּם
  choice: Malkam
  rationale: Der Ausdruck fungiert hier als Personenname und wird entsprechend transkribiert.
