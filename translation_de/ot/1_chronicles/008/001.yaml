  text: וּ/בִ֨נְיָמִ֔ן הוֹלִ֖יד אֶת בֶּ֣לַע בְּכֹר֑/וֹ אַשְׁבֵּל֙ הַ/שֵּׁנִ֔י וְ/אַחְרַ֖ח הַ/שְּׁלִישִֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/001.yaml
  text: Benjamin fathered Bela his firstborn[a], Ashbel the second, and Aharah the third.
translation:
  language: de
  text: Und Benjamin zeugte Bela, seinen Erstgeborenen, Aschbel als den zweiten und Aharach als den dritten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִנְיָמִן
  choice: Und Benjamin
  rationale: Die vorangestellte Konjunktion wird als „Und“ wiedergegeben; der Eigenname folgt der etablierten deutschen Form.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet im genealogischen Zusammenhang das Zeugen beziehungsweise Vaterwerden; „zeugte“ ist präzise und im biblischen Stammbaumregister verständlich.
- source_word: אֶת
  choice: '[nicht gesondert übersetzt]'
  rationale: Der hebräische Akkusativmarker hat im Deutschen keine eigenständige Entsprechung.
- source_word: בֶּלַע
  choice: Bela
  rationale: Übliche deutsche Transliteration des Eigennamens.
- source_word: בְּכֹרוֹ
  choice: seinen Erstgeborenen
  rationale: Gibt die Besitzbeziehung und die geburtsrechtlich geprägte Bezeichnung direkt wieder.
- source_word: אַשְׁבֵּל
  choice: Aschbel
  rationale: Deutsche Transliteration, bei der שׁ durch „sch“ wiedergegeben wird.
- source_word: הַשֵּׁנִי
  choice: als den zweiten
  rationale: Die Ergänzung „als“ schafft in der deutschen Aufzählung einen natürlichen Anschluss, ohne die Rangfolge zu verändern.
- source_word: וְאַחְרַח
  choice: und Aharach
  rationale: Die masoretische Form אַחְרַח wird entsprechend ihrer Konsonanten- und Vokalgestalt als „Aharach“ transliteriert; dadurch bleibt sie von abweichenden Namensformen unterscheidbar.
- source_word: הַשְּׁלִישִׁי
  choice: als den dritten
  rationale: Bewahrt die ausdrücklich nummerierte Geburtsfolge in natürlichem Deutsch.
