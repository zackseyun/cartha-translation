  rationale: Die Umschrift mit f gibt die wahrscheinlich spirantische Aussprache des hebräischen פ ohne Dagesch wieder und ist für deutschsprachige Leser transparent.
- source_word: יָפִיעַ
  choice: Jafia
  rationale: J gibt im Deutschen den anlautenden hebräischen j-Laut wieder; die Form bleibt eine Umschrift des Personennamens und wird nicht übersetzt.
