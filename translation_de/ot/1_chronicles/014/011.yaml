  text: וַ/יַּעֲל֥וּ בְּ/בַֽעַל פְּרָצִים֮ וַ/יַּכֵּ֣/ם שָׁ֣ם דָּוִיד֒ וַ/יֹּ֣אמֶר דָּוִ֔יד פָּרַ֨ץ הָֽ/אֱלֹהִ֧ים אֶת אוֹיְבַ֛/י בְּ/יָדִ֖/י כְּ/פֶ֣רֶץ מָ֑יִם עַל כֵּ֗ן קָֽרְא֛וּ שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בַּ֥עַל פְּרָצִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/011.yaml
  text: So they went up to Baal-perazim[a], and David struck them down there. And David said, “God has broken through my enemies by my hand, like a bursting flood of waters.” Therefore they called the name of that place Baal-perazim.
translation:
  language: de
  text: 'Da zogen sie nach Baal-Perazim[a] hinauf, und David schlug sie dort. David sagte: »Gott ist gegen meine Feinde losgebrochen durch meine Hand, wie Wasser hervorbricht.« Darum nannte man diesen Ort Baal-Perazim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Baal-Perazim klingt etwa wie »Herr der Durchbrüche« und nimmt das hebräische Wort für »losbrechen/durchbrechen« in Davids Aussage auf.
    reason: Erklärt das hebräische Wortspiel zwischen dem Ortsnamen und dem Verb פרץ, ohne die umstrittene genaue Richtung der Wendung mit den Feinden festzulegen.
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Da zogen sie … hinauf
  rationale: עלה bezeichnet hier eine gerichtete, militärische Bewegung. »Hinaufziehen« bewahrt das hebräische Bewegungsbild und ist im erzählenden Kontext natürlich.
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: Baal-Perazim
  rationale: Der Ortsname wird transliteriert. Seine Verbindung mit פרץ bleibt durch die Formulierung »hindurchgebrochen« hörbar und wird in der Fußnote erläutert.
- source_word: וַיַּכֵּם
  choice: David schlug sie
  rationale: נכה bezeichnet im Kampf das Schlagen oder Besiegen. »Schlug sie« erhält die konkrete militärische Ausdrucksweise, ohne über den Text hinaus ausdrücklich eine Tötung zu behaupten.
- source_word: פָּרַץ
  choice: ist … hindurchgebrochen
  rationale: פרץ beschreibt ein gewaltsames Durchbrechen. Die Wiedergabe erhält das Wortspiel mit Perazim und die Verbindung zum folgenden Wasserbild.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Trotz des Artikels ist hier der eine Gott gemeint; das singularische Verb bestätigt den singularischen Bezug.
- source_word: אֶת אֹיְבַי
  choice: durch meine Feinde
  rationale: Nach פרץ kann אֶת in diesem Satz die Größe bezeichnen, durch die hindurchgebrochen wird. Diese Wiedergabe bewahrt das Bild eines Durchbruchs durch die feindlichen Reihen.
- source_word: בְּיָדִי
  choice: durch meine Hand
  rationale: Die wörtlich-bildhafte Wendung bezeichnet David als menschliches Werkzeug des göttlichen Handelns und bewahrt das hebräische Hand-Motiv.
- source_word: כְּפֶרֶץ מָיִם
  choice: wie Wasser, das sich mit Gewalt Bahn bricht
  rationale: Die Formulierung gibt das Bild von Wasser wieder, das einen Damm oder eine Begrenzung durchbricht, und klingt zugleich in modernem Deutsch verständlich und kraftvoll.
- source_word: עַל כֵּן
  choice: Darum
  rationale: »Darum« gibt die Schlussfolgerung knapp und natürlich wieder.
- source_word: קָרְאוּ שֵׁם הַמָּקוֹם הַהוּא
  choice: nannte man diesen Ort
  rationale: Das unbestimmte deutsche »man« entspricht dem hebräischen Verb in der 3. Person Plural, ohne einen ausdrücklich genannten Namensgeber einzuführen; die idiomatische deutsche Benennungsformel vermeidet unnötige Wörtlichkeit.
theological_decisions:
- issue: Verhältnis von göttlichem und menschlichem Handeln
  choice: Gott bewirkt den Durchbruch durch Davids Hand
  alternative: Die Wendung lediglich als »Gott hat mir den Sieg gegeben« wiederzugeben
  rationale: Der Text nennt Gott als singularisches Subjekt und David durch »meine Hand« als menschliches Werkzeug. Die Übersetzung bewahrt beide Ebenen sowie das konkrete Durchbruchsbild.
- issue: Bedeutung von אֶת nach פָּרַץ
  choice: Gott bricht durch die Feinde hindurch
  alternative: Gott bricht gegen die Feinde los beziehungsweise schlägt sie nieder
  rationale: Die Konstruktion lässt eine dynamische Deutung zu. »Durch meine Feinde hindurchgebrochen« passt unmittelbar zum Bild durchbrechenden Wassers und zum Ortsnamen, ohne das göttliche Handeln abstrakt als bloßen Sieg wiederzugeben.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Der Ortsname bleibt transliteriert; das zentrale Durchbruchsbild und die hebräische Wortwiederholung werden soweit möglich bewahrt. »Durch meine Hand« ist bewusst bildhaft und etwas formeller, um die doppelte Aussage von göttlicher Urheberschaft und menschlicher Mitwirkung nicht einzuebnen.
