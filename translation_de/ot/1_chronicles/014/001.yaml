source:
  edition: WLC
  text: וַ֠/יִּשְׁלַח חירם מֶֽלֶךְ צֹ֥ר מַלְאָכִים֮ אֶל דָּוִיד֒ וַ/עֲצֵ֣י אֲרָזִ֔ים וְ/חָרָשֵׁ֣י קִ֔יר וְ/חָרָשֵׁ֖י עֵצִ֑ים לִ/בְנ֥וֹת ל֖/וֹ בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/001.yaml
  text: Then Hiram king of Tyre sent messengers to David[a], and cedar timber, masons, and carpenters[b], to build a house for him.
translation:
  language: de
  text: Darauf sandte Hiram, der König von Tyrus, Boten zu David[a], dazu Zedernholz, Maurer und Zimmerleute, um ihm ein Haus zu bauen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gesandte“. Das hebräische Wort kann in einem königlichen Zusammenhang offizielle Vertreter bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um ihm einen Palast zu bauen“. Das hebräische Wort für „Haus“ kann auch eine königliche Residenz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Darauf sandte
  rationale: Das narrative Waw führt die Handlung fort. „Darauf“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: חירם
  choice: Hiram
  rationale: Die Namensform folgt an dieser Stelle dem Konsonantentext und der im Deutschen üblichen Wiedergabe.
- source_word: מֶלֶךְ צֹר
  choice: der König von Tyrus
  rationale: Die Constructusverbindung bezeichnet Hirams Amt und Herrschaftsgebiet; „Tyrus“ ist die etablierte deutsche Namensform.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Der Ausdruck bezeichnet allgemein Gesandte oder Boten. „Boten“ bleibt nahe an der lexikalischen Grundbedeutung, ohne einen bestimmten diplomatischen Rang vorauszusetzen.
- source_word: וַעֲצֵי אֲרָזִים
  choice: dazu Zedernholz
  rationale: Im Bauzusammenhang sind nicht lebende Bäume, sondern bereitgestelltes Bauholz gemeint. „Dazu“ macht die koordinierte Aufzählung im Deutschen verständlich.
- source_word: חָרָשֵׁי קִיר
  choice: Maurer
  rationale: Wörtlich handelt es sich um Handwerker für Mauern; „Maurer“ ist dafür im Baukontext die natürliche deutsche Bezeichnung.
- source_word: חָרָשֵׁי עֵצִים
  choice: Zimmerleute
  rationale: Die Wortgruppe bezeichnet Holzhandwerker. Bei einem Hausbau ist „Zimmerleute“ präziser und natürlicher als das allgemeinere „Holzarbeiter“.
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: um ihm ein Haus zu bauen
  rationale: Der Infinitiv bezeichnet den Zweck. „Haus“ bewahrt die Grundbedeutung von בַּיִת, während der königliche Kontext auch an einen Palast denken lässt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Erzählfluss, wird aber durch „dazu“ idiomatisch gegliedert. Die mögliche Bedeutung „Palast“ wird nicht in den Haupttext eingetragen, sondern als echte kontextuelle Alternative in der Fußnote bewahrt.
