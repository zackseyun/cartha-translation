source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ דָּוִ֔יד כַּֽ/אֲשֶׁ֥ר צִוָּ֖/הוּ הָֽ/אֱלֹהִ֑ים וַ/יַּכּוּ֙ אֶת מַחֲנֵ֣ה פְלִשְׁתִּ֔ים מִ/גִּבְע֖וֹן וְ/עַד גָּֽזְרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/016.yaml
  text: So David did as God had commanded him, and they struck down the Philistine army from Gibeon as far as Gezer.
translation:
  language: de
  text: So führte David aus, was Gott ihm geboten hatte, und sie schlugen das Heerlager der Philister von Gibeon bis nach Geser.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּאֲשֶׁר
  choice: So führte David aus, was
  rationale: Die Wendung bezeichnet Davids Handeln in Übereinstimmung mit Gottes Gebot. „führte ... aus, was“ ist im Deutschen natürlich und gibt den Gehorsamsgedanken wieder, ohne ihn auszudeuten.
- source_word: צִוָּהוּ הָאֱלֹהִים
  choice: Gott ihm geboten hatte
  rationale: צוה bedeutet „gebieten/befehlen“. Das Plusquamperfekt macht in natürlichem Deutsch deutlich, dass das Gebot dem Handeln vorausging; הָאֱלֹהִים bezeichnet hier Gott.
- source_word: וַיַּכּוּ
  choice: sie schlugen
  rationale: Die Verbform ist Plural und verweist im Zusammenhang auf David und seine Truppen. „schlugen“ bewahrt die militärische Bedeutung, ohne das Ergebnis stärker festzulegen als der hebräische Ausdruck.
- source_word: מַחֲנֵה פְלִשְׁתִּים
  choice: das Heerlager der Philister
  rationale: מַחֲנֶה bedeutet wörtlich „Lager“ und kann zugleich die dort versammelte Streitmacht bezeichnen. „Heerlager“ erhält das konkrete Bild und macht den militärischen Zusammenhang verständlich.
- source_word: מִגִּבְעוֹן וְעַד גָּזְרָה
  choice: von Gibeon bis nach Geser
  rationale: Die Konstruktion bezeichnet die räumliche Ausdehnung bis zu einem Endpunkt. „bis nach“ ist bei Ortsnamen idiomatisches Deutsch; die Namen folgen geläufigen deutschen Bibelformen.
theological_decisions:
- issue: Subjekt des pluralischen Verbs וַיַּכּוּ
  choice: 'Plural: David und seine Truppen („sie“)'
  alternative: David allein als zusammenfassend genanntes Subjekt
  rationale: Die hebräische Verbform ist eindeutig pluralisch. Die Wiedergabe mit „sie“ bewahrt dieses grammatische Detail und setzt keine namentlich nicht genannten Männer in den Text ein.
- issue: Bedeutung von מַחֲנֵה im Kampfzusammenhang
  choice: „Heerlager“ mit konkreter und metonymischer Offenheit
  alternative: „Heer“ beziehungsweise „Armee“
  rationale: „Heerlager“ bleibt näher am lexikalischen Bild des Ausgangstextes, lässt aber offen, ob vor allem das Lager oder die darin befindliche Streitmacht gemeint ist.
translation_notes:
  register: Moderne, würdige Erzählsprache. „Geboten“ passt zum biblischen Kontext, bleibt aber allgemein verständlich. „Heerlager“ bewahrt die Bildlichkeit des Hebräischen und vermeidet eine unnötige Festlegung auf „Armee“.
