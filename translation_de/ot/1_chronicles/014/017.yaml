source:
  edition: WLC
  text: וַ/יֵּצֵ֥א שֵׁם דָּוִ֖יד בְּ/כָל הָֽ/אֲרָצ֑וֹת וַֽ/יהוָ֛ה נָתַ֥ן אֶת פַּחְדּ֖/וֹ עַל כָּל הַ/גּוֹיִֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/017.yaml
  text: And David’s name went out into all the lands[b][a], and Yahweh put the fear of him on all the nations.
translation:
  language: de
  text: Davids Name verbreitete sich in allen Ländern[a], und Jahwe ließ alle Völker sich vor ihm fürchten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Davids Name ging hinaus in alle Länder“; gemeint ist, dass sein Ruf sich überall verbreitete.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Jahwe legte seine Furcht auf alle Völker.“ Das Possessivsuffix kann sich auf David beziehen, was im Zusammenhang wahrscheinlicher ist; formal ist auch ein Bezug auf Jahwe möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: verbreitete sich
  rationale: Das Verb bedeutet wörtlich „hinausgehen“. In Verbindung mit „Name“ bezeichnet es idiomatisch die Ausbreitung von Ruf oder Ansehen; „verbreitete sich“ gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: שֵׁם
  choice: Name
  rationale: „Name“ kann im Hebräischen metonymisch für Ruf oder Ruhm stehen. Die Beibehaltung von „Name“ bewahrt das hebräische Bild, ohne im Deutschen unverständlich zu sein.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: in allen Ländern
  rationale: Der Plural von אֶרֶץ bezeichnet hier die umliegenden Länder oder Gebiete. „In allen Ländern“ ist im Deutschen natürlich und entspricht dem räumlichen Umfang der Aussage.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נָתַן
  choice: ließ … sich fürchten
  rationale: Wörtlich bedeutet נָתַן „geben, setzen“. Zusammen mit „Furcht“ und עַל drückt es hier aus, dass Jahwe die Furcht bei den Völkern bewirkte; die kausative Formulierung ist idiomatisches modernes Deutsch.
- source_word: פַּחְדּוֹ
  choice: sich vor ihm fürchten
  rationale: Das maskuline Suffix bedeutet wörtlich „seine Furcht“ beziehungsweise „Furcht vor ihm“. Im Kontext verweist „ihm“ am wahrscheinlichsten auf David.
- source_word: עַל כָּל הַגּוֹיִם
  choice: alle Völker
  rationale: גּוֹיִם bezeichnet die umliegenden Völker oder Nationen. Die Bedeutung der Präposition עַל ist in der deutschen Konstruktion „alle Völker sich fürchten lassen“ idiomatisch aufgenommen.
theological_decisions:
- issue: Bezug des pronominalen Suffixes in פַּחְדּוֹ
  choice: 'Das Pronomen wird auf David bezogen: Jahwe bewirkte, dass die Völker David fürchteten.'
  alternative: 'Das Pronomen kann formal auf Jahwe bezogen werden: Die Völker fürchteten Jahwe.'
  rationale: David ist der unmittelbar vorausgehende Bezugspunkt, und der Zusammenhang handelt von seinem wachsenden Ansehen nach den Siegen. Der Bezug auf David ist daher kontextuell wahrscheinlicher; die grammatisch mögliche Alternative wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Satzhälfte bewahrt das hebräische Bild vom „Namen“, während „verbreitete sich“ dessen idiomatischen Sinn verständlich ausdrückt. Die zweite Hälfte wird natürlich-kausativ formuliert; die wörtliche Konstruktion und die mögliche Mehrdeutigkeit des Pronomens stehen in der Fußnote.
