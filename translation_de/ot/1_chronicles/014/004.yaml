id: 1CH.14.4
reference: 1 Chronicles 14:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת הַ/יְלוּדִ֔ים אֲשֶׁ֥ר הָיוּ ל֖/וֹ בִּ/ירוּשָׁלִָ֑ם שַׁמּ֣וּעַ וְ/שׁוֹבָ֔ב נָתָ֖ן וּ/שְׁלֹמֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/004.yaml
  text: 'And these are the names of the children born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: de
  text: 'Und dies sind die Namen der Kinder, die ihm in Jerusalem geboren wurden[a]: Schammua, Schobab, Nathan und Salomo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Geborenen, die ihm in Jerusalem waren“. Das Hebräische verwendet hier nicht das gewöhnliche Wort für „Söhne“, obwohl alle genannten Personen männlich sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Die Verbindung aus Konjunktion und Demonstrativpronomen leitet den folgenden Listeneintrag ein; „Und dies sind“ bewahrt den Anschluss an den Zusammenhang.
- source_word: שְׁמוֹת
  choice: die Namen
  rationale: Der Konstruktplural von „Name“ führt die anschließende Personenliste ein.
- source_word: הַיְלוּדִים
  choice: die Kinder, die … geboren wurden
  rationale: Das substantivierte passive Partizip bedeutet wörtlich „die Geborenen“. „Die Kinder, die … geboren wurden“ ist im Deutschen natürlich und legt nicht unnötig den gewöhnlichen hebräischen Ausdruck für „Söhne“ zugrunde.
- source_word: אֲשֶׁר הָיוּ לוֹ
  choice: die ihm … geboren wurden
  rationale: Die Relativkonstruktion mit היה und ל drückt Zugehörigkeit beziehungsweise Beziehung aus. Zusammen mit dem Partizip gibt „ihm geboren wurden“ den Sinn knapp und idiomatisch wieder.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präpositionalphrase bezeichnet den Ort der Geburt.
- source_word: שַׁמּוּעַ
  choice: Schammua
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition transkribiert.
- source_word: שׁוֹבָב
  choice: Schobab
  rationale: Transkription des hebräischen Personennamens in geläufiger deutscher Form.
- source_word: נָתָן
  choice: Nathan
  rationale: Verwendung der im Deutschen etablierten Namensform.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Verwendung der im Deutschen etablierten Namensform.
