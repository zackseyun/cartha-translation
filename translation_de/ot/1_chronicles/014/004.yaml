  terminology: „Kinder“ bewahrt die gegenüber dem üblichen hebräischen Wort für „Söhne“ abweichende Formulierung. Schammua, Schobab, Nathan und Salomo sind im Deutschen geeignete etablierte Namensformen. Die Fußnote erläutert die lexikalische Besonderheit korrekt, ohne eine weitergehende Aussage über den Text zu erzwingen.
