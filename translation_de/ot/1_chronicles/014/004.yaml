  source_fidelity: Der Text gibt וְאֵלֶּה als anschließendes „Und dies sind“ angemessen wieder, führt mit „die Namen“ korrekt in die Liste ein und bildet הַיְלוּדִים nicht überpräzis als „Söhne“, sondern als „Kinder, die … geboren wurden“, ab. Die possessive Wendung אֲשֶׁר הָיוּ לוֹ ist mit „die ihm … geboren wurden“ sachgerecht integriert. „in Jerusalem“ und sämtliche Namen entsprechen dem hebräischen Text und den im Deutschen etablierten Namensformen.
