id: 1CH.14.12
reference: 1 Chronicles 14:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּעַזְבוּ שָׁ֖ם אֶת אֱלֹֽהֵי/הֶ֑ם וַ/יֹּ֣אמֶר דָּוִ֔יד וַ/יִּשָּׂרְפ֖וּ בָּ/אֵֽשׁ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/012.yaml
  text: And they left their gods there[a], and David gave the order[b], and they were burned with fire.
translation:
  language: de
  text: Und sie ließen dort ihre Götter[a] zurück. David gab den Befehl[b], und sie wurden im Feuer verbrannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Götzenbilder«. Wörtlich steht im Hebräischen »ihre Götter«; gemeint sind wahrscheinlich deren Kultbilder.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Parallelstelle in 2. Samuel 5,21 formuliert anders: »David und seine Männer nahmen sie mit.« Nach der Chronik wurden sie dagegen auf Davids Anordnung im Feuer verbrannt.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: sie ließen … zurück
  rationale: עזב bezeichnet hier das Zurücklassen der Kultbilder bei der Flucht; die deutsche Wendung ist natürlich und fügt keine zusätzliche Wertung hinzu.
- source_word: שָׁם
  choice: dort
  rationale: Gibt das schlichte Ortsadverb knapp und idiomatisch wieder.
- source_word: אֶת אֱלֹהֵיהֶם
  choice: ihre Götter
  rationale: Bewahrt die wörtliche Bezeichnung des Hebräischen. Gemeint sind im Zusammenhang wahrscheinlich die bildlichen Darstellungen dieser Götter; die interpretierende Alternative wird in der Fußnote genannt.
- source_word: וַיֹּאמֶר דָּוִיד
  choice: David gab den Befehl
  rationale: Wörtlich steht »David sagte«. Da kein Redeinhalt folgt und unmittelbar die angeordnete Verbrennung genannt wird, gibt »gab den Befehl« die Funktion der Äußerung im Deutschen verständlich wieder.
- source_word: וַיִּשָּׂרְפוּ
  choice: sie wurden … verbrannt
  rationale: Die Form wird hier passiv verstanden, wobei »ihre Götter« das fortwirkende Subjekt sind. So wird kein im Hebräischen unausgesprochenes Objekt ergänzt.
- source_word: בָּאֵשׁ
  choice: im Feuer
  rationale: Gibt das Mittel beziehungsweise den Vorgang der Verbrennung in natürlichem Deutsch wieder.
theological_decisions:
- issue: Bezeichnung heidnischer Kultgegenstände als אֱלֹהֵיהֶם
  choice: ihre Götter
  alternative: ihre Götzenbilder
  rationale: Die Übersetzung bewahrt die Ausdrucksweise des hebräischen Textes und ersetzt sie nicht stillschweigend durch eine polemisch oder sachlich stärker deutende Bezeichnung.
- issue: Verhältnis zur Parallelstelle 2. Samuel 5,21
  choice: 'Die eigenständige Aussage der Chronik wird übersetzt: Verbrennung auf Davids Anordnung.'
  alternative: David und seine Männer trugen sie fort.
  rationale: Die Parallelstelle darf die abweichende Formulierung der Chronik nicht ersetzen; die Textspannung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung erhöht die Lesbarkeit, ohne die Abfolge der hebräischen Waw-Sätze zu verändern. Die genuine Abweichung von der Samuel-Parallele und die mögliche Bedeutung von אֱלֹהֵיהֶם werden nicht harmonisiert.
