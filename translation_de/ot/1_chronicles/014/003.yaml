source:
  edition: WLC
  text: וַ/יִּקַּ֨ח דָּוִ֥יד ע֛וֹד נָשִׁ֖ים בִּ/ירוּשָׁלִָ֑ם וַ/יּ֧וֹלֶד דָּוִ֛יד ע֖וֹד בָּנִ֥ים וּ/בָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/003.yaml
  text: And David took more wives in Jerusalem[a], and David fathered more sons and daughters.
translation:
  language: de
  text: David nahm sich in Jerusalem noch weitere Frauen[a] und zeugte weitere Söhne und Töchter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »heiratete in Jerusalem noch weitere Frauen«; wörtlich: »nahm sich … noch weitere Frauen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm sich
  rationale: לקח bedeutet grundsätzlich »nehmen«. In Verbindung mit Frauen bezeichnet es hier, dass David sie zu Frauen nahm; »nahm sich« bewahrt die hebräische Ausdrucksweise besser als das ausdrücklich heiratsspezifische »heiratete«.
- source_word: עוֹד
  choice: noch weitere / weitere
  rationale: עוֹד hat in beiden Satzteilen quantitativen Sinn und bezeichnet zusätzliche Frauen beziehungsweise zusätzliche Söhne und Töchter. Die leicht variierte Wiedergabe ist natürliches modernes Deutsch.
- source_word: נָשִׁים
  choice: Frauen
  rationale: נָשִׁים kann »Frauen« oder »Ehefrauen« bedeuten. Mit »nahm sich ... Frauen« wird der relationale Sinn im Deutschen verständlich, ohne die lexikalische Mehrdeutigkeit unnötig zu verengen.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition בְּ wird hier eindeutig lokal gebraucht.
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Die Hifil-Form von ילד mit männlichem Subjekt bezeichnet das Zeugen beziehungsweise Vaterwerden. »Zeugte« ist präzise, verständlich und weniger altertümlich als »zeugte ... hervor« oder »begat« entsprechende Formen.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Der hebräische Text nennt beide Gruppen ausdrücklich; die Wiedergabe bewahrt diese Konkretheit statt zu »Kinder« zu verallgemeinern.
- source_word: דָּוִיד
  choice: David
  rationale: Etablierte deutsche Form des Personennamens.
theological_decisions:
- issue: Erzählende Darstellung von Davids Polygamie
  choice: Der Vers wird ohne moralischen Zusatz rein beschreibend wiedergegeben.
  alternative: Eine wertende Formulierung, die Zustimmung oder Missbilligung erkennen lässt.
  rationale: Der Vers berichtet Davids Aufnahme weiterer Frauen und die Geburt weiterer Kinder, bewertet diese Praxis an dieser Stelle jedoch nicht. Die Übersetzung fügt daher kein theologisches Urteil hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Nahm sich ... Frauen« wahrt die quellensprachliche Bildlichkeit, während die Fußnote die idiomatischere Deutung »heiratete« nennt. Die Wiederholung des Namens David im zweiten Teilsatz wird im Deutschen zugunsten eines natürlichen Satzflusses nicht wiederholt; das Subjekt bleibt eindeutig.
