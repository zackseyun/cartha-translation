  terminology: »Jahwe« gibt den Gottesnamen konsistent als Eigenname wieder. »Königtum« deckt die hier relevante Bedeutung von מַלְכוּת angemessen ab. Die Fußnote bewahrt sowohl die Bildlichkeit von נִשֵּׂאת לְמַעְלָה als auch die tatsächlich mögliche Zuordnung von »seines Volkes«; sie legt keine konfessionelle Deutung fest.
