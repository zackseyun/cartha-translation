reference: 1 Chronicles 14:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּ֣דַע דָּוִ֔יד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל כִּֽי נִשֵּׂ֤את לְ/מַ֨עְלָ/ה֙ מַלְכוּת֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/002.yaml
  text: And David knew that Yahweh had established him as king over Israel[b][a], for his kingdom had been greatly exalted for the sake of his people Israel.
translation:
  language: de
  text: Und David erkannte, dass Jahwe ihn als König über Israel eingesetzt hatte; denn sein Königtum war um seines Volkes Israel willen hoch erhoben worden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »nach oben erhoben worden«. »Seines Volkes« bezieht sich wahrscheinlich auf Jahwe; möglich ist auch der Bezug auf David.'
    reason: lexikalische Alternative und mehrdeutiger Pronomenbezug
lexical_decisions:
- source_word: וַיֵּדַע
  choice: erkannte
  rationale: Das Qal wayyiqtol von ידע kann sowohl »wissen« als auch »erkennen« bezeichnen. Im erzählenden Zusammenhang drückt »erkannte« natürlich aus, dass David anhand seiner Lage zu dieser Einsicht gelangte.
- source_word: הֱכִינוֹ
  choice: ihn … eingesetzt hatte
  rationale: Das Hifil von כון bezeichnet hier das Festmachen beziehungsweise Bestätigen Davids im Königsamt. »Als König eingesetzt« gibt die königliche Amtseinsetzung in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְמֶלֶךְ עַל־יִשְׂרָאֵל
  choice: als König über Israel
  rationale: לְ markiert die Einsetzung in ein Amt, während עַל die Herrschaft über Israel ausdrückt.
- source_word: נִשֵּׂאת לְמַעְלָה
  choice: hoch erhoben worden
  rationale: Die Verbindung bezeichnet eine Erhöhung zu hohem Rang. Die Formulierung wahrt das konkrete Bild des hebräischen Ausdrucks und klingt zugleich würdevoll.
- source_word: מַלְכוּתוֹ
  choice: sein Königtum
  rationale: מַלְכוּת kann Reich, Königsherrschaft oder Königtum bedeuten. Hier steht Davids königliche Stellung beziehungsweise Herrschaft im Vordergrund; »Königtum« vermeidet die mögliche räumliche Verengung von »Königreich«.
- source_word: בַּעֲבוּר
  choice: um … willen
  rationale: 'Die Wendung bezeichnet Zweck oder Begünstigung: Davids Erhöhung geschah zugunsten Israels.'
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: seines Volkes Israel
  rationale: Die Formulierung bewahrt das Possessivpronomen und die Bezeichnung Israels als Volk, ohne den im Hebräischen formal möglichen Bezug des Pronomens im Haupttext ausdrücklich aufzulösen.
theological_decisions:
- issue: Bezugswort des Possessivpronomens in עַמּוֹ יִשְׂרָאֵל
  choice: Im Haupttext bleibt »seines Volkes Israel« formal mehrdeutig; im Zusammenhang liegt Jahwe als Bezug nahe.
  alternative: 'Das Pronomen kann auf David bezogen werden: »Davids Volk Israel«.'
  rationale: Das hebräische Pronomen ist grammatisch nicht eindeutig. Der größere Zusammenhang begünstigt Israel als Jahwes Volk, doch die Übersetzung soll die echte syntaktische Mehrdeutigkeit nicht verdecken.
- issue: Funktion des zweiten כִּי
  choice: 'kausal: »denn«'
  alternative: 'erklärend oder inhaltlich: »dass«'
  rationale: Der zweite Satz nennt am natürlichsten den Grund beziehungsweise das erkennbare Zeichen dafür, dass Jahwe David bestätigt hatte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Plusquamperfekt bildet die vor Davids Erkenntnis liegenden Handlungen ab. »Königtum« wahrt die Bedeutungsbreite von מַלְכוּת; die Fußnote kennzeichnet sowohl das hebräische Höhenbild als auch den nicht völlig eindeutigen Pronomenbezug.
