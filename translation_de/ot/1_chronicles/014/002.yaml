  source_fidelity: 'Der deutsche Text gibt die Satzstruktur und den Sinn des Hebräischen zuverlässig wieder: David erkennt Jahwes bestätigendes Handeln, seine Einsetzung als König über Israel und die Erhöhung seines Königtums zum Wohl Israels. Das Plusquamperfekt ist im deutschen Erzählzusammenhang angemessen. Die kausale Wiedergabe des zweiten כִּי mit »denn« ist gut vertretbar.'
