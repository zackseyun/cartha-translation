  text: וִ֠/יהִי כְּֽ/שָׁמְעֲ/ךָ֞ אֶת ק֤וֹל הַ/צְּעָדָה֙ בְּ/רָאשֵׁ֣י הַ/בְּכָאִ֔ים אָ֖ז תֵּצֵ֣א בַ/מִּלְחָמָ֑ה כִּֽי יָצָ֤א הָֽ/אֱלֹהִים֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת אֶת מַחֲנֵ֥ה פְלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/015.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then go out to battle, for God has gone out before you to strike down the camp of the Philistines.
translation:
  language: de
  text: Und wenn du das Geräusch von Schritten in den Wipfeln der Balsambäume[a] hörst, dann zieh zum Kampf aus; denn Gott ist vor dir ausgezogen, um das Heerlager der Philister zu schlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Baka-Bäume; traditionell auch: Maulbeerbäume. Welche Baumart das hebräische Wort genau bezeichnet, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי כְּשָׁמְעֲךָ
  choice: Und sobald du … hörst
  rationale: Die Verbindung aus וִיהִי und כ mit Infinitiv leitet den zeitlichen Umstand ein. „Sobald“ gibt hier den handlungsauslösenden Zeitpunkt natürlich wieder, ohne einen zeitlichen Abstand anzunehmen.
- source_word: קוֹל הַצְּעָדָה
  choice: das Geräusch von Schritten
  rationale: קוֹל bezeichnet hier ein hörbares Geräusch, הַצְּעָדָה das Schreiten beziehungsweise Marschieren. „Schritte“ bewahrt die sinnliche Bildhaftigkeit und vermeidet, eine sichtbare Armee in den Baumwipfeln vorauszusetzen.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: in den Wipfeln der Balsambäume
  rationale: רָאשׁ bezeichnet bei Bäumen den oberen Teil beziehungsweise Wipfel. Die Baumart ist unsicher; „Balsambäume“ ist eine verbreitete sachliche Identifikation, deren Unsicherheit in der Fußnote kenntlich bleibt.
- source_word: תֵּצֵא בַמִּלְחָמָה
  choice: zieh zum Kampf aus
  rationale: יצא bedeutet „hinausgehen/ausziehen“ und hat hier eindeutig militärischen Bezug. „Zum Kampf ausziehen“ ist im Deutschen natürlich und bewahrt das Bewegungsbild.
- source_word: כִּי יָצָא הָאֱלֹהִים לְפָנֶיךָ
  choice: denn Gott ist vor dir ausgezogen
  rationale: כִּי begründet den Befehl. Das Perfekt stellt Gottes Ausziehen als bereits erfolgt dar; die Wiederholung von „ausziehen“ bildet die Beziehung zwischen Gottes vorausgehendem und Davids folgendem Handeln ab.
- source_word: לְהַכּוֹת אֶת מַחֲנֵה פְלִשְׁתִּים
  choice: um das Heerlager der Philister zu schlagen
  rationale: נכה kann „schlagen“ oder im militärischen Zusammenhang „besiegen“ bedeuten. „Schlagen“ wahrt die lexikalische Breite; מַחֲנֶה ist hier das Lager beziehungsweise die gelagerte Streitmacht.
theological_decisions:
- issue: Wiedergabe von הָאֱלֹהִים
  choice: Gott
  alternative: die Götter
  rationale: Obwohl אֱלֹהִים formal pluralisch ist, kennzeichnen das singularische Verb und der Kontext Israels Gott eindeutig als singularisches Subjekt.
- issue: Verhältnis zwischen göttlichem und menschlichem Handeln
  choice: Gott ist vor dir ausgezogen; David soll daraufhin ausziehen
  alternative: Gott wird vor dir ausziehen
  rationale: 'Das hebräische Perfekt wird als bereits eingeleitetes göttliches Handeln wiedergegeben. So bleibt die Spannung erhalten: Gott handelt vorausgehend, während David dennoch zum Kampf aufgerufen ist.'
translation_notes:
  register: Moderne, würdige Standardsprache. „Zieh zum Kampf aus“ bewahrt den leicht erhöhten erzählerischen Ton, bleibt aber allgemein verständlich. Das Semikolon macht die Begründungsstruktur des hebräischen Satzes deutlich.
