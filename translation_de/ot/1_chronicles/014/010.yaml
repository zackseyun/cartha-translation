source:
  edition: WLC
  text: וַ/יִּשְׁאַ֨ל דָּוִ֤יד בֵּ/אלֹהִים֙ לֵ/אמֹ֔ר הַ/אֶֽעֱלֶה֙ עַל פלשתיים וּ/נְתַתָּ֖/ם בְּ/יָדִ֑/י וַ/יֹּ֨אמֶר ל֤/וֹ יְהוָה֙ עֲלֵ֔ה וּ/נְתַתִּ֖י/ם בְּ/יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/010.yaml
  text: And David inquired of God[a], saying, “Shall I go up against the Philistines, and will you give them into my hand?” And Yahweh said to him, “Go up, and I will give them into your hand.”
translation:
  language: de
  text: 'David befragte Gott: »Soll ich gegen die Philister hinaufziehen? Wirst du sie in meine Hand geben[a]?« Da sagte Jahwe zu ihm: »Zieh hinauf! Ich werde sie in deine Hand geben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wirst du sie in meine Gewalt ausliefern?« Wörtlich lautet die hebräische Wendung: »sie in meine Hand geben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: David befragte Gott
  rationale: שׁאל mit ב bezeichnet hier das Einholen göttlicher Weisung. »Gott befragen« ist im Deutschen natürlich und bewahrt den formellen Sinn der Wendung.
- source_word: הַאֶעֱלֶה
  choice: Soll ich ... hinaufziehen?
  rationale: Die Frage betrifft Davids militärisches Vorgehen. »Hinaufziehen« erhält sowohl die Bewegungsrichtung als auch den militärischen Sprachgebrauch von עלה.
- source_word: עַל פלשתיים
  choice: gegen die Philister
  rationale: עַל bezeichnet in diesem militärischen Zusammenhang die feindliche Ausrichtung gegen ein Volk.
- source_word: וּנְתַתָּם בְּיָדִי
  choice: Wirst du sie in meine Hand geben?
  rationale: Die feste Wendung נתן ביד bedeutet, jemanden der Gewalt eines anderen zu übergeben. Die Übersetzung bewahrt bewusst das hebräische Bild und die Entsprechung mit Jahwes Antwort.
- source_word: עֲלֵה
  choice: Zieh hinauf!
  rationale: Der Imperativ wiederholt das Verb עלה aus Davids Frage; dieselbe deutsche Wortwahl erhält diese literarische Verbindung.
- source_word: וּנְתַתִּים בְּיָדֶךָ
  choice: Ich werde sie in deine Hand geben.
  rationale: Die Antwort greift Davids Formulierung nahezu wörtlich auf. Das wird im Deutschen entsprechend gespiegelt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Gottesnamen in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählweise des Hebräischen und die wörtliche Spiegelung zwischen Davids Frage und Jahwes Antwort bleiben erhalten; die hebräische Hand-Metapher wird nicht stillschweigend aufgelöst.
