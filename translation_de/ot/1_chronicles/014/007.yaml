  yaml_path: translation/ot/1_chronicles/014/007.yaml
  text: and Elishama[a], and Beeliada, and Eliphelet.
translation:
  language: de
  text: und Elischama, Beeljada[a] und Elifelet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der parallelen Liste in 2. Samuel 5,16 lautet der Name „Eljada“. Hier steht im hebräischen Text „Beeljada“.
    reason: alternative_reading
lexical_decisions:
- source_word: וֶ/אֱלִישָׁמָע
  choice: und Elischama
  rationale: Die vorangestellte Konjunktion ו wird mit „und“ wiedergegeben. Der Personenname אֱלִישָׁמָע wird in der im Deutschen üblichen, am Hebräischen orientierten Form „Elischama“ transkribiert.
- source_word: וּ/בְעֶלְיָדָע
  choice: Beeljada
  rationale: Der masoretische Text bietet hier בְעֶלְיָדָע; daher wird die Namensform „Beeljada“ beibehalten. Das hebräische ו wird innerhalb der deutschen Aufzählung nicht eigens vor diesem zweiten Glied wiederholt, da die Verbindung durch Komma und abschließendes „und“ natürlich ausgedrückt wird.
- source_word: וֶ/אֱלִיפָלֶט
  choice: und Elifelet
  rationale: Die Konjunktion ו wird mit „und“ wiedergegeben. אֱלִיפָלֶט wird in der geläufigen deutschen Namensform „Elifelet“ transkribiert.
theological_decisions: []
translation_notes:
  register: Knappe, würdige Wiedergabe eines fortlaufenden Namensverzeichnisses. Die mehrfachen hebräischen Konjunktionen werden in eine natürliche deutsche Aufzählungsstruktur überführt; der einleitende Anschluss „und“ bleibt erhalten.
