base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/014.yaml
  text: So David inquired of God again[a], and God said to him, “You shall not go up after them. Circle around from behind them, and come against them opposite the balsam trees.”
translation:
  language: de
  text: 'Da befragte David Gott noch einmal. Gott sagte zu ihm: »Zieh nicht hinter ihnen her. Mach einen Bogen um sie und rück von den Balsambäumen[a] her gegen sie vor.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »die Baka-Bäume«; die genaue Baumart ist ungewiss. Traditionell wird auch »Maulbeerbäume« übersetzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל עוֹד דָּוִיד בֵּאלֹהִים
  choice: Da befragte David Gott noch einmal
  rationale: שׁאל mit ב bezeichnet hier das Einholen göttlicher Weisung. »befragte Gott« wahrt diesen beratenden Sinn; עוֹד wird im Zusammenhang natürlich mit »noch einmal« wiedergegeben.
- source_word: לֹא תַעֲלֶה אַחֲרֵיהֶם
  choice: Zieh nicht hinter ihnen her
  rationale: עלה bezeichnet wörtlich das Hinauf- oder Losziehen und hat hier militärischen Sinn. »Zieh nicht hinter ihnen her« bleibt nahe am Wortlaut, ohne bereits eine bestimmte Angriffsform hineinzulesen.
- source_word: הָסֵב מֵעֲלֵיהֶם
  choice: Mach einen Bogen um sie
  rationale: הָסֵב fordert zu einer Richtungsänderung beziehungsweise Umgehungsbewegung auf; מֵעֲלֵיהֶם weist vom direkten Vorgehen gegen sie weg. Die Formulierung gibt das taktische Manöver idiomatisch wieder, ohne das im Chroniktext nicht ausdrücklich genannte »von hinten« einzufügen.
- source_word: וּבָאתָ לָהֶם
  choice: und tritt ihnen … entgegen
  rationale: בוא mit ל bezeichnet im militärischen Zusammenhang das Herankommen gegen den Feind. »entgegentreten« macht den feindlichen Bezug aus dem Kontext deutlich und klingt im Deutschen natürlich.
- source_word: מִמּוּל
  choice: gegenüber
  rationale: Das Wort bezeichnet eine Position gegenüber oder vor etwas und wird bewusst räumlich offen wiedergegeben.
- source_word: הַבְּכָאִים
  choice: die Balsambäume
  rationale: Die genaue Baumart ist unsicher. »Balsambäume« folgt einer verbreiteten lexikalischen Bestimmung, während die Fußnote sowohl die Unsicherheit als auch traditionelle Alternativen offenlegt.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die direkte Rede ist knapp gehalten; die militärische Bewegung wird verständlich formuliert, ohne die gegenüber dem Paralleltext bestehende räumliche Unbestimmtheit durch »von hinten« aufzulösen.
