  rationale: Die Form folgt der masoretischen Vokalisierung des hebräischen Personennamens.
- source_word: וְ
  choice: und
  rationale: Die vorangestellte Konjunktion verbindet die Namen als einfache Aufzählung; im Deutschen genügt ein »und« vor dem letzten Namen.
