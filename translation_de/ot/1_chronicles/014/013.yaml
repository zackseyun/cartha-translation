  text: And the Philistines again spread out in the valley[a].
translation:
  language: de
  text: Die Philister breiteten sich erneut im Tal aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Philister stellten sich erneut im Tal auf.«'
    reason: Lexikalische Alternative für das im militärischen Zusammenhang verwendete Verb פשט.
lexical_decisions:
- source_word: וַיֹּסִיפוּ עוֹד
  choice: erneut
  rationale: Die Verbindung aus יסף und עוֹד bezeichnet idiomatisch die Wiederholung der Handlung. »Erneut« gibt diese gemeinsame Funktion natürlich wieder, ohne beide Elemente schwerfällig einzeln abzubilden.
- source_word: פְּלִשְׁתִּים
  choice: die Philister
  rationale: Die übliche deutsche Bezeichnung für diese Volksgruppe; der bestimmte Artikel entspricht dem im Kontext bestimmten Bezug.
- source_word: וַיִּפְשְׁטוּ
  choice: breiteten sich … aus
  rationale: פשט kann in militärischem Zusammenhang das Ausschwärmen, Aufstellen oder Vordringen von Truppen bezeichnen. »Sich ausbreiten« bewahrt das Bild räumlicher Entfaltung, ohne einen Plünderungszug zu unterstellen.
- source_word: בָּעֵמֶק
  choice: im Tal
  rationale: Die Präposition ב wird hier am einfachsten lokal verstanden; der hebräische Artikel wird mit »dem« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem erzählerischem Ton. Der einleitende hebräische Anschluss mit וַ wird nicht eigens durch »und« wiedergegeben, da der Vers im Deutschen auch ohne diese Reihung natürlich an den Kontext anschließt.
