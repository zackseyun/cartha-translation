  text: The Philistines came and raided the Valley of Rephaim[a].
translation:
  language: de
  text: Die Philister kamen und breiteten sich im Tal Refaïm aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fielen in das Tal Refaïm ein“. Das hebräische Verb kann das Ausbreiten oder Aufstellen von Truppen, auch einen feindlichen Einfall, bezeichnen.'
