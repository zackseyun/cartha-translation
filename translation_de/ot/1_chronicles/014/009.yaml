lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Und die Philister
  rationale: פְלִשְׁתִּים bezeichnet die Philister; das vorangestellte ו wird als natürlicher erzählerischer Anschluss mit „Und“ wiedergegeben.
- source_word: בָּאוּ
  choice: kamen
  rationale: Das Qal Perfekt von בוא bedeutet hier schlicht „kamen“.
- source_word: וַֽ/יִּפְשְׁטוּ
  choice: fielen … ein
  rationale: פשט kann im militärischen Zusammenhang ein Sich-Ausbreiten, Ausschwärmen oder einen feindlichen Einfall bezeichnen. „fielen … ein“ gibt den feindlichen militärischen Vorgang natürlich wieder, ohne Plünderung ausdrücklich hinzuzufügen.
- source_word: בְּ/עֵמֶק
  choice: in das Tal
  rationale: עֵמֶק bedeutet „Tal“; mit dem Verb „einfallen“ wird die Präposition ב richtungsbezogen idiomatisch als „in das“ wiedergegeben.
- source_word: רְפָאִים
  choice: Refaïm
  rationale: Hier ist רְפָאִים Bestandteil eines Ortsnamens und wird daher transliteriert.
