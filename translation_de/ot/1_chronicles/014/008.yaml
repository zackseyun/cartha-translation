source:
  edition: WLC
  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּי נִמְשַׁ֨ח דָּוִ֤יד לְ/מֶ֨לֶךְ֙ עַל כָּל יִשְׂרָאֵ֔ל וַ/יַּעֲל֥וּ כָל פְּלִשְׁתִּ֖ים לְ/בַקֵּ֣שׁ אֶת דָּוִ֑יד וַ/יִּשְׁמַ֣ע דָּוִ֔יד וַ/יֵּצֵ֖א לִ/פְנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/008.yaml
  text: When the Philistines heard that David had been anointed king over all Israel[a], all the Philistines went up to seek David. And David heard, and went out before them.
translation:
  language: de
  text: Als die Philister hörten, dass David zum König über ganz Israel gesalbt worden war, zogen alle Philister herauf, um David zu suchen. David hörte davon und zog ihnen entgegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zog vor ihnen hinaus“. Gemeint sein kann auch: „zog hinaus, um ihnen zu begegnen“ oder „zog gegen sie aus“. Der hebräische Ausdruck legt in diesem Zusammenhang eine militärische Konfrontation nahe, spricht sie aber nicht ausdrücklich aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Als die Philister hörten
  rationale: שׁמע bezeichnet hier das Empfangen einer Nachricht. Die Konstruktion mit „als“ verbindet im Deutschen den zeitlichen Rahmen natürlich mit dem folgenden Geschehen.
- source_word: נִמְשַׁח דָּוִיד לְמֶלֶךְ
  choice: dass David zum König … gesalbt worden war
  rationale: Das Nifal von משׁח wird passiv wiedergegeben; das Plusquamperfekt macht deutlich, dass die Salbung der Nachricht zeitlich vorausging. לְמֶלֶךְ bezeichnet das Amt beziehungsweise Ergebnis.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: über ganz Israel
  rationale: עַל bezeichnet hier den Herrschaftsbereich und כָּל den vollständigen politischen Umfang von Davids Königtum.
- source_word: וַיַּעֲלוּ
  choice: zogen … herauf
  rationale: עלה enthält die räumliche Vorstellung des Hinaufziehens. „Zogen herauf“ passt zu einer sich bewegenden Gruppe und bewahrt die geografische Perspektive, ohne ausdrücklich „marschierten“ einzutragen.
- source_word: כָל פְּלִשְׁתִּים
  choice: alle Philister
  rationale: Die kollektive Formulierung des Hebräischen wird direkt bewahrt, statt sie deutend auf das Heer oder das Land Philistäa einzuengen.
- source_word: לְבַקֵּשׁ אֶת דָּוִיד
  choice: um David zu suchen
  rationale: בקשׁ bedeutet „suchen“. Der feindliche Zusammenhang legt Verfolgung nahe, doch die Übersetzung lässt die vom Verb selbst nicht näher bestimmte Absicht offen.
- source_word: וַיִּשְׁמַע דָּוִיד
  choice: David hörte davon
  rationale: „Davon“ ergänzt im Deutschen den aus dem Kontext klaren Inhalt des Hörens und vermeidet einen unvollständig wirkenden Satz.
- source_word: וַיֵּצֵא לִפְנֵיהֶם
  choice: zog ihnen entgegen
  rationale: Die idiomatische Wiedergabe vermittelt, dass David auszieht und sich ihnen stellt. Da לִפְנֵיהֶם wörtlich „vor ihnen“ heißt und auch weniger eindeutig verstanden werden kann, wird die Ambiguität in der Fußnote offengelegt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Wiederholung des Hörens bleibt erhalten; „zog herauf“ wahrt die räumliche Nuance, während „ihnen entgegen“ im Haupttext natürliches Deutsch bietet und die echte Bedeutungsbreite durch die Fußnote sichtbar bleibt.
