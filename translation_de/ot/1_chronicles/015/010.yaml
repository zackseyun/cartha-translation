  text: לִ/בְנֵ֖י עֻזִּיאֵ֑ל עַמִּינָדָ֣ב הַ/שָּׂ֔ר וְ/אֶחָ֕י/ו מֵאָ֖ה וּ/שְׁנֵ֥ים עָשָֽׂר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/010.yaml
  text: 'For the sons of Uzziel: Amminadab the chief[a], and his brothers, one hundred and twelve.'
translation:
  language: de
  text: 'Von den Söhnen Usiëls: Amminadab, das Oberhaupt[a], und seine Brüder: hundertzwölf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Anführer“; auch: „der Fürst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי
  choice: Von den Söhnen
  rationale: Das vorangestellte ל führt in dieser Aufzählung die nächste Sippe ein. Im Deutschen gibt „Von den Söhnen“ diese Gliederungsfunktion natürlich wieder und bewahrt zugleich die genealogische Ausdrucksweise.
- source_word: עֻזִּיאֵל
  choice: Usiël
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition transliteriert; die Trema-Schreibung verdeutlicht die getrennte Aussprache der Vokale.
- source_word: עַמִּינָדָב
  choice: Amminadab
  rationale: Transliteration des Personennamens nach gängiger deutscher Form.
- source_word: הַ/שָּׂר
  choice: das Oberhaupt
  rationale: שַׂר kann einen Anführer, Obersten, Fürsten oder Amtsträger bezeichnen. In der Liste levitischer Sippen bezeichnet „Oberhaupt“ natürlich den Leiter der Gruppe, ohne einen fürstlichen Rang vorauszusetzen.
- source_word: וְ/אֶחָי/ו
  choice: und seine Brüder
  rationale: אָח bezeichnet Brüder, kann in einem solchen Sippenverzeichnis aber auch weitere männliche Verwandte oder Sippenangehörige einschließen. „Brüder“ bewahrt die konkrete familiäre Ausdrucksweise des Hebräischen.
- source_word: מֵאָה וּ/שְׁנֵים עָשָׂר
  choice: '112'
  rationale: Die Kardinalzahl wird in der knappen Listenform übersichtlich als Ziffer wiedergegeben.
