base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/024.yaml
  text: And Shebaniah[a], Jehoshaphat, Nethanel, Amasai, Zechariah, Benaiah, and Eliezer the priests were blowing the trumpets before the ark of God[c][b], and Obed-edom and Jehiah were gatekeepers for the ark.
translation:
  language: de
  text: Und die Priester Schebanja, Joschafat, Netanel, Amasai, Secharja, Benaja und Eliëser bliesen vor der Lade Gottes die Trompeten[a][b]; Obed-Edom und Jehia waren Torhüter für die Lade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließen die Trompeten erklingen“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet häufig gerade Trompeten, die im Kult verwendet wurden.
    reason: cultural_note
  - marker: c
    text: 'Oder: „Türhüter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Der bestimmte Artikel kennzeichnet die sieben zuvor genannten Männer als Priester; die Apposition ist im Deutschen natürlich und eindeutig.
- source_word: מחצצרים
  choice: bliesen
  rationale: Das Partizip bezeichnet eine andauernde, die Prozession begleitende Handlung. Das Präteritum „bliesen“ gibt dies in einer deutschen Erzählung natürlich wieder.
- source_word: בַּחֲצֹצְרוֹת
  choice: die Trompeten
  rationale: Das Wort bezeichnet Trompeten, besonders die geraden kultischen Priestertrompeten. „Trompeten“ ist die direkte Wiedergabe; „silberne“ wird nicht in den Haupttext aufgenommen, da das Material in diesem Vers nicht ausdrücklich genannt wird.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition hat hier räumlichen Sinn und beschreibt die Stellung beziehungsweise das Handeln der Priester vor der Lade.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Die Konstruktverbindung bedeutet unmittelbar „Lade Gottes“ und entspricht der eingebürgerten, würdigen deutschen Bibelsprache.
- source_word: שֹׁעֲרִים
  choice: Torwächter
  rationale: Der Ausdruck bezeichnet Wächter beziehungsweise Hüter an Zugängen heiliger Bereiche. „Torwächter“ bewahrt die kultisch-institutionelle Bedeutung.
- source_word: לָאָרוֹן
  choice: für die Lade
  rationale: 'Die Präposition bezeichnet hier Zuständigkeit oder Zuordnung: Obed-Edom und Jehia versahen den Torwächterdienst in Bezug auf die Lade.'
- source_word: וְעֹבֵד אֱדֹם
  choice: Obed-Edom
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen Form mit Bindestrich wiedergegeben.
- source_word: וִיחִיָּה
  choice: Jehia
  rationale: Der Personenname wird in einer geläufigen deutschen Transkriptionsform wiedergegeben.
