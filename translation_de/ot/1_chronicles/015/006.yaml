  yaml_path: translation/ot/1_chronicles/015/006.yaml
  text: 'For the sons of Merari: Asaiah the chief[a], and 220 of his brothers.'
translation:
  language: de
  text: 'Von den Söhnen Meraris: Asaja, der Oberste, und seine Brüder[a], 220.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verwandte“. Das hebräische Wort kann auch männliche Angehörige derselben Familie oder Sippe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: Von den Söhnen Meraris
  rationale: Das Präfix ל führt in der fortlaufenden Aufzählung die nächste Gruppe ein. „Von den Söhnen Meraris“ bewahrt die genealogische Ausdrucksweise und klingt in einer deutschen Liste natürlich.
- source_word: עֲשָׂיָה
  choice: Asaja
  rationale: Der Eigenname wird nach einer im Deutschen geläufigen biblischen Umschrift wiedergegeben.
- source_word: הַשָּׂר
  choice: der Oberste
  rationale: שַׂר bezeichnet hier den anerkannten Leiter der Gruppe; „Oberste“ gibt Rang und Leitungsfunktion wieder, ohne königlichen Status anzudeuten.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: „Brüder“ ist die direkte Wiedergabe von אחים. Da das Wort hier auch männliche Verwandte oder Angehörige derselben Sippe bezeichnen kann, wird diese Bedeutungsbreite in einer Fußnote vermerkt.
- source_word: מָאתַיִם וְעֶשְׂרִים
  choice: 220 Mann
  rationale: Die Zahl wird zur modernen Lesbarkeit in Ziffern gesetzt. „Mann“ verdeutlicht, dass die Zahl die zuvor genannten Brüder beziehungsweise männlichen Sippenangehörigen zählt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Listenstruktur des Hebräischen bleibt erhalten; die genuine Bedeutungsbreite von „Brüder“ wird nicht im Haupttext aufgelöst, sondern in der Fußnote ausgewiesen.
