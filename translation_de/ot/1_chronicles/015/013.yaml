source:
  edition: WLC
  text: כִּ֛י לְ/מַ בָּ/רִ֥אשׁוֹנָ֖ה לֹ֣א אַתֶּ֑ם פָּרַ֨ץ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ בָּ֔/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ כַּ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/013.yaml
  text: Because you were not there the first time[a], Yahweh our God broke out against us[b], because we did not seek him according to the ordinance.
translation:
  language: de
  text: Weil ihr beim ersten Mal nicht dabei wart[a], brach Jahwe, unser Gott, gegen uns los, denn wir suchten ihn nicht nach der Vorschrift[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Satzanfang ist elliptisch; etwa: „weil ihr es beim ersten Mal nicht wart“. Im Zusammenhang kann dies darauf hinweisen, dass die Leviten am ersten Versuch, die Lade heraufzubringen, nicht beteiligt waren.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „denn wir befragten ihn nicht in der vorgeschriebenen Weise“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַ בָּרִאשׁוֹנָה לֹא אַתֶּם
  choice: weil ihr beim ersten Mal nicht dabei wart
  rationale: Die hebräische Eröffnung ist stark verkürzt. Im Zusammenhang richtet David sich an die Leviten und verweist auf ihren fehlenden Einsatz beim ersten Versuch, die Lade heraufzubringen. „Nicht dabei wart“ macht die naheliegende Ergänzung verständlich, ohne die konkrete Tätigkeit des Tragens ausdrücklich in den Text einzufügen.
- source_word: פָּרַץ ... בָּנוּ
  choice: brach ... gegen uns los
  rationale: Die Wendung bezeichnet ein plötzliches, heftiges Eingreifen Gottes gegen die Betroffenen und nimmt die Erzählung von Perez-Usa auf. Die deutsche Formulierung bewahrt sowohl das Bild des Losbrechens als auch den Gerichtscharakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Die Verbindung mit dem Suffix der ersten Person Plural wird unmittelbar und mit ihrer gemeinschaftlichen Aussage wiedergegeben.
- source_word: דְרַשְׁנֻהוּ
  choice: wir suchten ihn
  rationale: דרשׁ kann „suchen“, „befragen“ oder „sich erkundigen“ bedeuten. „Ihn suchen“ bewahrt hier die weitere Bedeutung einer angemessenen Hinwendung zu Gott, während die Fußnote die engere Möglichkeit nennt.
- source_word: כַּמִּשְׁפָּט
  choice: nach der Vorschrift
  rationale: מִשְׁפָּט bezeichnet hier die verbindliche, vorgeschriebene Weise, in der die Lade zu transportieren war. „Nach der Vorschrift“ ist präzise und zugleich gegenwärtiges, verständliches Deutsch.
theological_decisions:
- issue: Elliptische Eröffnung und Rolle der Leviten
  choice: Die Aussage bezieht sich darauf, dass die Leviten beim ersten Versuch nicht beteiligt waren.
  alternative: '„Denn beim ersten Mal wart nicht ihr es“ oder allgemeiner: „Denn beim ersten Mal brach Jahwe, unser Gott, gegen uns los.“'
  rationale: Der unmittelbare Zusammenhang in 1. Chronik 15,2.12–15 erklärt den gescheiterten ersten Versuch damit, dass die Lade nicht von den Leviten nach der vorgeschriebenen Ordnung getragen wurde. Wegen der sprachlichen Kürze des Hebräischen bleibt die alternative Wiedergabe in einer Fußnote sichtbar.
- issue: Art des göttlichen Handelns in פָּרַץ
  choice: Jahwe bricht in einem plötzlichen Gericht gegen die Gemeinschaft los.
  alternative: Jahwe „riss eine Bresche unter uns“.
  rationale: Die Übersetzung bewahrt die Härte des göttlichen Gerichts und zugleich die sprachliche Verbindung zur vorausgehenden Erzählung, ohne das Geschehen abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche, aber verständliche Wendung „gegen uns losbrechen“ erhält das hebräische Bild und dessen Bezug zum Gericht über Usa. Die Satzstruktur bleibt nah am doppelten כִּי („denn weil …; denn …“), ohne im Deutschen unverständlich zu werden.
