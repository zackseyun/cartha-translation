lexical_decisions:
- source_word: לִבְנֵי
  choice: Von den Söhnen
  rationale: Das vorangestellte ל führt in dieser Liste die jeweilige Sippe beziehungsweise Gruppe ein. „Von den Söhnen“ entspricht natürlichem deutschen Listenstil und bewahrt die wörtliche Familienbezeichnung.
- source_word: אֱלִיצָפָן
  choice: Elizafan
  rationale: Der Personenname wird nach einer im Deutschen gebräuchlichen bibelnahen Umschrift wiedergegeben.
- source_word: שְׁמַעְיָה
  choice: Schemaja
  rationale: Der Personenname wird in der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: הַשָּׂר
  choice: das Oberhaupt
  rationale: שַׂר bezeichnet hier den führenden Vertreter der Sippe. „Oberhaupt“ passt zum genealogischen Listenkontext, ohne einen königlichen oder ausdrücklich militärischen Rang anzudeuten.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: אָח kann sowohl leibliche Brüder als auch weitere männliche Verwandte oder Sippenangehörige bezeichnen. Die Übersetzung bewahrt den konkreten Grundsinn; die kontextuell mögliche weitere Bedeutung wird in der Fußnote genannt.
- source_word: מָאתָיִם
  choice: zweihundert
  rationale: Direkte Wiedergabe der Kardinalzahl.
