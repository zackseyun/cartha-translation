  yaml_path: translation/ot/1_chronicles/015/008.yaml
  text: 'For the sons of Elizaphan: Shemaiah the chief[a], and two hundred of his brothers.'
translation:
  language: de
  text: 'Von den Söhnen Elizafans: Schemaja, das Oberhaupt, und seine zweihundert Brüder.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ kann hier auch „Verwandte“ oder „Sippenangehörige“ bedeuten.
