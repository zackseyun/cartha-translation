base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/011.yaml
  text: 'Then David called for Zadok and Abiathar the priests, and for the Levites: Uriel, Asaiah, Joel, Shemaiah, Eliel, and Amminadab.'
translation:
  language: de
  text: Da rief David die Priester Zadok und Abjatar sowie die Leviten Uriel, Asaja, Joel, Schemaja, Eliël und Amminadab zu sich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Da rief … zu sich
  rationale: Das Verb קרא bezeichnet hier im Zusammenhang das Herbeirufen bestimmter Personen. Die deutsche Wendung „zu sich rufen“ gibt diesen Sinn natürlich und textnah wieder; „da“ führt die fortlaufende Erzählung weiter.
- source_word: לְצָדוֹק וּלְאֶבְיָתָר הַכֹּהֲנִים
  choice: die Priester Zadok und Abjatar
  rationale: Die Apposition הַכֹּהֲנִים kennzeichnet Zadok und Abjatar als die Priester. Im Deutschen ist die vorangestellte Berufsbezeichnung klar und idiomatisch.
- source_word: וְלַלְוִיִּם
  choice: sowie die Leviten
  rationale: Das wiederholte ל hängt weiterhin von „rief … zu sich“ ab. „Sowie“ verbindet die zweite Personengruppe klar mit den Priestern, ohne im Deutschen ein unnatürliches „nach“ oder „für“ zu wiederholen.
- source_word: לְאוּרִיאֵל עֲשָׂיָה וְיוֹאֵל שְׁמַעְיָה וֶאֱלִיאֵל וְעַמִּינָדָב
  choice: Uriel, Asaja, Joel, Schemaja, Eliël und Amminadab
  rationale: Die Personennamen werden in gebräuchlicher deutscher biblischer Form wiedergegeben. Sie stehen als nähere Bestimmung zu „die Leviten“.
- source_word: דָוִיד
  choice: David
  rationale: Gebräuchliche deutsche Form des Eigennamens.
theological_decisions: []
