base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/009.yaml
  text: 'For the sons of Hebron: Eliel the chief[a], and eighty of his brothers.'
translation:
  language: de
  text: 'Von den Söhnen Hebrons: Eliel, das Oberhaupt, und achtzig seiner Brüder.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „männlichen Verwandten“. Wörtlich steht im Hebräischen „Brüder“; wahrscheinlich sind hier männliche Angehörige der von Eliel vertretenen Sippe gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Von den Söhnen
  rationale: Die Präposition ל leitet in dieser Liste die betreffende Sippengruppe ein. „Von den Söhnen“ ist im Deutschen idiomatisch und bewahrt die hebräische Verwandtschaftsbezeichnung.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Der Personen- beziehungsweise Sippenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Der Personenname wird transliteriert.
- source_word: הַשָּׂר
  choice: das Oberhaupt
  rationale: שַׂר bezeichnet hier den führenden Vertreter der Sippe. „Oberhaupt“ passt zum administrativen Sippenkontext, ohne königliche oder militärische Bedeutung zu unterstellen.
- source_word: וְאֶחָיו
  choice: und seiner Brüder
  rationale: Das Hebräische sagt wörtlich „seine Brüder“. Im Zusammenhang können damit männliche Angehörige seiner Sippe gemeint sein; die Übersetzung bewahrt zunächst die konkrete Verwandtschaftsbezeichnung.
- source_word: שְׁמוֹנִים
  choice: achtzig
  rationale: Die Kardinalzahl gibt die Anzahl der Eliel zugeordneten Männer an.
