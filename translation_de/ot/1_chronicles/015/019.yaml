  text: וְ/הַ/מְשֹׁ֣רְרִ֔ים הֵימָ֥ן אָסָ֖ף וְ/אֵיתָ֑ן בִּ/מְצִלְתַּ֥יִם נְחֹ֖שֶׁת לְ/הַשְׁמִֽיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/019.yaml
  text: The singers were Heman[a], Asaph, and Ethan, with bronze cymbals to sound aloud.
translation:
  language: de
  text: Die Sänger Heman, Asaf und Etan ließen die bronzenen Zimbeln laut erklingen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »um hören zu lassen« oder »um hörbar zu machen«; ein ausdrückliches Objekt steht im Hebräischen nicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְשֹׁרְרִים
  choice: Die Sänger
  rationale: Das substantivierte Partizip bezeichnet hier ausdrücklich die Singenden. Das einleitende ו wird im natürlichen deutschen Satzanschluss nicht eigens wiedergegeben.
- source_word: הֵימָן אָסָף וְאֵיתָן
  choice: Heman, Asaf und Etan
  rationale: Die Personennamen werden in ihren im Deutschen gebräuchlichen biblischen Formen wiedergegeben; das ו vor Etan verbindet das letzte Glied der Aufzählung.
- source_word: בִּמְצִלְתַּיִם נְחֹשֶׁת
  choice: die bronzenen Zimbeln
  rationale: ב ist instrumental zu verstehen. מְצִלְתַּיִם bezeichnet paarweise gespielte Zimbeln, und נְחֹשֶׁת hier am ehesten Bronze.
- source_word: לְהַשְׁמִיעַ
  choice: ließen … laut erklingen
  rationale: Der Hifil-Infinitiv von שׁמע bedeutet wörtlich »hören lassen« beziehungsweise »hörbar machen«. Im musikalischen Zusammenhang gibt »laut erklingen lassen« die kausative und akustische Aussage natürlich wieder.
