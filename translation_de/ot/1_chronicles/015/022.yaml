source:
  edition: WLC
  text: וּ/כְנַנְיָ֥הוּ שַֽׂר הַ/לְוִיִּ֖ם בְּ/מַשָּׂ֑א יָסֹר֙ בַּ/מַּשָּׂ֔א כִּ֥י מֵבִ֖ין הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/022.yaml
  text: And Chenaniah[a], chief of the Levites, directed the carrying[b], because he was skillful at it.
translation:
  language: de
  text: Kenanja, der Oberste der Leviten, leitete das Tragen[a], denn er verstand sich darauf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „leitete den Gesang, denn er verstand sich darauf“. Das hebräische Wort מַשָּׂא bedeutet gewöhnlich „Last“ oder „Tragen“; wegen der Sänger und Musiker im Zusammenhang wird es hier teilweise musikalisch verstanden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich wird dasselbe Substantiv wiederholt: „beim Tragen … beim Tragen“. Die Übersetzung gibt die zweite Wendung idiomatisch mit „darauf“ wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְנַנְיָהוּ
  choice: Kenanja
  rationale: Die im Deutschen übliche biblische Namensform gibt den hebräischen Personennamen angemessen wieder.
- source_word: שַׂר הַלְוִיִּם
  choice: der Oberste der Leviten
  rationale: שַׂר bezeichnet hier eine leitende Person im kultisch-organisatorischen Zusammenhang; „Oberste“ ist prägnant und würdevoll.
- source_word: בְּמַשָּׂא
  choice: das Tragen
  rationale: מַשָּׂא bedeutet gewöhnlich „Last“ beziehungsweise das Tragen einer Last. Im Zusammenhang mit der Überführung der Bundeslade ist dies die naheliegende Bedeutung, auch wenn eine musikalische Deutung möglich bleibt.
- source_word: יָסֹר
  choice: leitete
  rationale: Das Verb bezeichnet hier Anweisung oder Aufsicht. „leitete“ bringt diese Funktion in natürlichem Deutsch zum Ausdruck.
- source_word: כִּי מֵבִין הוּא
  choice: denn er verstand sich darauf
  rationale: Das Partizip von בין bezeichnet in diesem Zusammenhang praktische Sachkenntnis oder Befähigung. Die Formulierung bewahrt zugleich die Grundidee des Verstehens.
theological_decisions:
- issue: Bedeutung von מַשָּׂא im kultischen Kontext
  choice: Tragen
  alternative: Gesang beziehungsweise Singen
  rationale: Die gewöhnliche lexikalische Bedeutung und der Erzählzusammenhang der Überführung der Bundeslade sprechen für „Tragen“. Wegen der benachbarten Sänger und Musiker wird die mögliche musikalische Deutung jedoch in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt knapp; die echte lexikalische Mehrdeutigkeit wird nicht im Haupttext aufgelöst, sondern in der Fußnote kenntlich gemacht.
