  text: וַ/יִּֽתְקַדְּשׁ֔וּ הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/הַעֲל֕וֹת אֶת אֲר֥וֹן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/014.yaml
  text: So the priests and the Levites consecrated themselves to bring up the ark of Yahweh[a], the God of Israel.
translation:
  language: de
  text: Da heiligten sich[a] die Priester und die Leviten, um die Lade Jahwes, des Gottes Israels, hinaufzubringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weihten sich“; gemeint ist die Vorbereitung für den heiligen Dienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַדְּשׁוּ
  choice: Da heiligten sich
  rationale: Das reflexive Hitpael von קדשׁ bezeichnet hier die rituelle Heiligung beziehungsweise Vorbereitung für einen heiligen Dienst. „Sich heiligen“ bewahrt den Heiligkeitsbezug und den reflexiven Sinn des Hebräischen.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die übliche und kontextgerechte Wiedergabe der kultischen Amtsträger.
- source_word: וְהַלְוִיִּם
  choice: und die Leviten
  rationale: Die bestimmte Form und die koordinierende Verbindung werden direkt wiedergegeben.
- source_word: לְהַעֲלוֹת
  choice: um … hinaufzubringen
  rationale: Der Hifil von עלה bedeutet „hinaufbringen“. Die Formulierung bezeichnet die Verbringung der Lade nach Jerusalem, ohne die konkrete Trageweise eigens auszudrücken.
- source_word: אֶת אֲרוֹן
  choice: die Lade
  rationale: „Lade“ ist die etablierte deutsche Bezeichnung für den heiligen Schrein. Auf „Bundeslade“ wird verzichtet, weil „Bund“ in diesem Vers nicht ausdrücklich steht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: des Gottes Israels
  rationale: Die hebräische Genitivverbindung wird unmittelbar wiedergegeben und steht als Apposition zu „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt dessen Charakter als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Ritueller Sinn von וַיִּתְקַדְּשׁוּ
  choice: heiligten sich
  alternative: weihten sich
  rationale: „Heiligten sich“ hält sowohl den reflexiven Wortlaut als auch den Bezug auf rituelle Reinheit und Vorbereitung offen; „weihten sich“ könnte stärker eine einmalige Einsetzung nahelegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Satzbau folgt dem hebräischen Handlungsablauf, bleibt aber im Deutschen flüssig. „Lade“ vermeidet eine nicht ausdrücklich genannte Erweiterung zu „Bundeslade“.
