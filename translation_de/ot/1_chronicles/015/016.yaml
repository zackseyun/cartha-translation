base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/016.yaml
  text: Then David told the leaders of the Levites to appoint their brothers, the singers, with musical instruments—harps, lyres, and cymbals—sounding aloud, to raise songs of joy.
translation:
  language: de
  text: Dann wies David die Leiter der Leviten an, ihre Brüder[b], die Sänger, mit Musikinstrumenten – Harfen, Leiern und Zimbeln – aufzustellen, damit sie die Instrumente laut erklingen ließen und voller Freude die Stimme erhoben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um mit Stimme oder Klang Freude zum Ausdruck zu bringen“. Wörtlich etwa: „mit einer Stimme/einem Klang zur Freude erheben“.'
    reason: lexical_alternative
  - marker: b
    text: Mit „ihre Brüder“ sind ihre Mit-Leviten gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִיד
  choice: Dann wies David … an
  rationale: Das narrative וַ führt die Handlung fort. Zusammen mit dem folgenden Infinitiv bezeichnet אָמַר hier eine Anweisung; „wies … an“ ist im Deutschen natürlicher als „sagte …, aufzustellen“.
- source_word: לְשָׂרֵי הַלְוִיִּם
  choice: die Leiter der Leviten
  rationale: שָׂרִים bezeichnet führende oder verantwortliche Personen. „Leiter“ ist gegenwärtiges, klares Deutsch und passt zum organisatorischen Zusammenhang.
- source_word: לְהַעֲמִיד
  choice: aufzustellen
  rationale: Der Hifil von עמד kann „hinstellen“, „aufstellen“ oder „einsetzen“ bedeuten. „Aufstellen“ wahrt sowohl den konkreten als auch den organisatorischen Sinn.
- source_word: אֶת אֲחֵיהֶם
  choice: ihre Brüder
  rationale: Die wörtliche Verwandtschaftsbezeichnung wird beibehalten; gemeint sind die levitischen Stammesbrüder beziehungsweise Mit-Leviten.
- source_word: הַמְשֹׁרְרִים
  choice: die Sänger
  rationale: Das Partizip von שׁיר bezeichnet ausdrücklich Singende, nicht allgemein Musiker.
- source_word: בִּכְלֵי שִׁיר
  choice: mit Musikinstrumenten
  rationale: Dies gibt die Wendung „Instrumente der Musik/des Gesangs“ idiomatisch und sachlich wieder.
- source_word: נְבָלִים וְכִנֹּרוֹת וּמְצִלְתָּיִם
  choice: Harfen, Leiern und Zimbeln
  rationale: Die traditionellen Bezeichnungen unterscheiden נֶבֶל und כִּנּוֹר, obwohl die genaue Bauart der antiken Saiteninstrumente nicht sicher ist; מְצִלְתַּיִם bezeichnet Zimbeln.
- source_word: מַשְׁמִיעִים
  choice: damit sie diese laut erklingen ließen
  rationale: Der Hifil von שׁמע bedeutet „hörbar machen/erklingen lassen“. Das Pronomen bezieht sich im deutschen Satz natürlich auf die Instrumente, ohne die musikalische Ausführung unnötig zu präzisieren.
- source_word: לְהָרִים בְּקוֹל לְשִׂמְחָה
  choice: und ihre Stimme mit Freude erhoben
  rationale: Die Wiedergabe bleibt nahe bei „mit/bei einer Stimme bzw. einem Klang erheben, zur Freude“ und vermeidet, das im Hebräischen nicht ausdrücklich genannte Wort „Lieder“ in den Haupttext einzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für gute Lesbarkeit gegliedert; die instrumentalen Begriffe bleiben voneinander unterschieden. Die schwer eindeutige Schlusswendung wird im Haupttext relativ formal wiedergegeben und in der Fußnote als echte lexikalisch-syntaktische Alternative offengehalten.
