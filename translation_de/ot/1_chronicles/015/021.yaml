base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/021.yaml
  text: and Mattithiah[a], Eliphelehu, Mikneiah, Obed-edom, Jeiel, and Azaziah were to lead with lyres according to the Sheminith.
translation:
  language: de
  text: Mattitja, Elifelehu, Mikneja, Obed-Edom, Jeïel und Asasja sollten mit Leiern nach der Scheminit[a] die Leitung übernehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der Achten“ oder „in der tieferen Oktave“. Der hebräische Ausdruck „Scheminit“ ist eine musikalische Bezeichnung, deren genaue Bedeutung unsicher ist.'
    reason: Bewahrt die lexikalische Unsicherheit eines nicht eindeutig erklärbaren musikalischen Fachausdrucks.
lexical_decisions:
- source_word: מַתִּתְיָהוּ
  choice: Mattitja
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, dem Hebräischen angenäherten Form wiedergegeben.
- source_word: אֱלִיפְלֵהוּ
  choice: Eliflehu
  rationale: Transliteration des Personennamens unter Beibehaltung der im hebräischen Text vorhandenen Endung -hu.
- source_word: מִקְנֵיָהוּ
  choice: Mikneja
  rationale: Der Personenname wird in einer gut lesbaren deutschen Transliteration wiedergegeben; das abschließende Element verweist auf den Gottesnamen.
- source_word: עֹבֵד אֱדֹם
  choice: Obed-Edom
  rationale: Der zusammengesetzte Personenname wird transliteriert und zur besseren Lesbarkeit mit Bindestrich geschrieben.
- source_word: יעִיאֵל
  choice: Jëiël
  rationale: Die Trema-Schreibung macht im Deutschen sichtbar, dass die aufeinanderfolgenden Vokale getrennt gesprochen werden.
- source_word: עֲזַזְיָהוּ
  choice: Asasja
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenkonvention transliteriert.
- source_word: בְּכִנֹּרוֹת
  choice: mit Leiern
  rationale: כִּנּוֹר bezeichnet ein Saiteninstrument, das sachlich genauer als Leier denn als Harfe wiedergegeben wird; ב ist hier instrumental.
- source_word: עַל הַשְּׁמִינִית
  choice: nach der Scheminit
  rationale: Die Wendung ist ein musikalischer Fachausdruck mit ungeklärter genauer Bedeutung. Die Transliteration wahrt diese Unsicherheit; עַל wird im Sinn einer musikalischen Vorgabe mit „nach“ wiedergegeben.
- source_word: לְנַצֵּחַ
  choice: die Leitung übernehmen
  rationale: Im musikalischen Zusammenhang kann נצח das Leiten, Beaufsichtigen oder Dirigieren einer Darbietung bezeichnen. Die Formulierung gibt die Funktion wieder, ohne sie auf einen modernen Dirigententitel festzulegen.
