  text: And David gathered the sons of Aaron and the Levites.
translation:
  language: de
  text: Und David versammelte die Söhne Aarons und die Leviten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: versammelte
  rationale: Das Verb אסף bezeichnet hier im fortlaufenden Erzählzusammenhang das Zusammenbringen von Personen. „Versammelte“ ist im modernen Deutschen natürlich und gibt die Handlung präzise wieder.
- source_word: דָּוִיד
  choice: David
  rationale: Im Deutschen etablierte Form des Personennamens.
- source_word: בְּנֵי אַהֲרֹן
  choice: die Söhne Aarons
  rationale: Die Formulierung bewahrt die genealogische Ausdrucksweise des Hebräischen. Im Zusammenhang bezeichnet sie wahrscheinlich die aaronitische Priesterschaft, doch diese Deutung wird nicht an die Stelle des Quelltextausdrucks gesetzt.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: „Leviten“ ist die etablierte und sachlich passende deutsche Bezeichnung für die hier genannte levitische Gruppe.
- source_word: אֵת ... וְאֵת
  choice: nicht gesondert wiedergegeben; koordinierte direkte Objekte
  rationale: אֵת kennzeichnet im Hebräischen bestimmte direkte Objekte und besitzt keine eigene deutsche Entsprechung. Die Wiederholung wird durch die natürliche Verbindung „die Söhne Aarons und die Leviten“ abgebildet.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; knapp und eng an der hebräischen Satzstruktur, ohne die genealogische Bezeichnung interpretierend aufzulösen.
