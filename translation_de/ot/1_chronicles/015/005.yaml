base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/005.yaml
  text: 'For the sons of Kohath: Uriel the chief[a], and 120 of his brothers.'
translation:
  language: de
  text: 'Von den Söhnen Kehats: Uriel, das Oberhaupt, und 120 seiner Brüder.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seiner Verwandten“. Mit „Brüder“ sind hier wahrscheinlich Angehörige der kehatitischen Sippe gemeint, nicht nur leibliche Brüder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Von den Söhnen
  rationale: Das Präfix ל leitet in der Aufzählung die betreffende levitische Sippengruppe ein. „Von den Söhnen“ entspricht dem deutschen Listenstil und bewahrt בני als genealogisch-sippenbezogene Bezeichnung.
- source_word: קְהָת
  choice: Kehat
  rationale: Der Eigenname des levitischen Ahnherrn wird in der im Deutschen etablierten biblischen Form „Kehat“ wiedergegeben.
- source_word: אוּרִיאֵל
  choice: Uriel
  rationale: Der Personenname wird nach gebräuchlicher deutscher Konvention als „Uriel“ transliteriert.
- source_word: הַשָּׂר
  choice: das Oberhaupt
  rationale: שַׂר bezeichnet hier den anerkannten Leiter der Sippengruppe. „Oberhaupt“ passt zum genealogisch-administrativen Zusammenhang, ohne die königliche Bedeutung von „Fürst“ nahezulegen.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: Die Wiedergabe bleibt beim wörtlichen Verwandtschaftsausdruck, obwohl אָח im Kontext auch weitere männliche Verwandte oder Angehörige derselben Sippe bezeichnen kann.
- source_word: מֵאָה וְעֶשְׂרִים
  choice: '120'
  rationale: Die Zahl wird in der listenartigen Passage zur guten Lesbarkeit als Ziffer wiedergegeben.
