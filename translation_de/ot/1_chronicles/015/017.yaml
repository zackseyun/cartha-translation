  text: וַ/יַּעֲמִ֣ידוּ הַ/לְוִיִּ֗ם אֵ֚ת הֵימָ֣ן בֶּן יוֹאֵ֔ל וּ/מִ֨ן אֶחָ֔י/ו אָסָ֖ף בֶּן בֶּֽרֶכְיָ֑הוּ וּ/מִן בְּנֵ֤י מְרָרִי֙ אֲחֵי/הֶ֔ם אֵיתָ֖ן בֶּן קֽוּשָׁיָֽהוּ־־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/017.yaml
  text: So the Levites appointed Heman son of Joel[a], and from his brothers Asaph son of Berechiah, and from the sons of Merari, their brothers[b], Ethan son of Kushaiah.
translation:
  language: de
  text: Die Leviten setzten Heman, den Sohn Joëls, ein[a] und aus dem Kreis seiner Brüder Asaf, den Sohn Berechjas, und aus dem Kreis der Söhne Meraris[b], ihrer Brüder, Etan, den Sohn Kuschajas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »stellten … auf«. Das hebräische Verb kann bedeuten, jemanden für eine bestimmte Aufgabe an seinen Platz zu stellen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Söhne Meraris«; gemeint ist die von Merari abstammende levitische Sippe.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲמִידוּ
  choice: setzten … ein
  rationale: Das Hifil von עמד bezeichnet hier, dass jemand für eine bestimmte Aufgabe aufgestellt beziehungsweise in eine Funktion eingesetzt wird. „Einsetzen“ gibt diese förmliche Zuweisung im heutigen Deutsch natürlich wieder.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Übliche deutsche Bezeichnung der ausdrücklich bestimmten Gruppe.
- source_word: אֵת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker hat im Deutschen keine eigene lexikalische Entsprechung.
- source_word: הֵימָן בֶּן יוֹאֵל
  choice: Heman, den Sohn Joëls
  rationale: Die Eigennamen werden in gängiger deutscher Form wiedergegeben; die ausdrücklich genannte Abstammungsbeziehung bleibt erhalten.
- source_word: וּמִן אֶחָיו
  choice: dazu aus dem Kreis seiner Brüder
  rationale: מן kennzeichnet die Auswahl aus einer Gruppe. „Aus dem Kreis“ macht diese Bedeutung idiomatisch deutlich, ohne den Verwandtschaftsausdruck abzuschwächen.
- source_word: אָסָף בֶּן בֶּרֶכְיָהוּ
  choice: Asaf, den Sohn Berechjas
  rationale: Gängige deutsche Namensformen und formgetreue Wiedergabe der Sohnschaft.
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: und aus dem Kreis der Söhne Meraris
  rationale: Die genealogische Wendung „Söhne Meraris“ wird bewahrt; zugleich verdeutlicht „aus dem Kreis“ die durch מן bezeichnete Auswahl.
- source_word: אֲחֵיהֶם
  choice: ihrer Brüder
  rationale: Der wörtliche Verwandtschaftsbegriff und der pronominale Bezug bleiben erhalten, statt deutend durch „Stammesgenossen“ ersetzt zu werden.
- source_word: אֵיתָן בֶּן קוּשָׁיָהוּ
  choice: Etan, den Sohn Kuschajas
  rationale: Die Personennamen erscheinen in geläufiger deutscher Transkription, und die genealogische Angabe wird ausdrücklich bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt die dreigliedrige Aufzählung und die verwandtschaftlichen Bezeichnungen des Hebräischen, während „aus dem Kreis“ die Auswahlfunktion der Präposition מן natürlich ausdrückt.
