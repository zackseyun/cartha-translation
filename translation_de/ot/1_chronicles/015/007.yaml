  text: לִ/בְנֵ֖י גֵּרְשׁ֑וֹם יוֹאֵ֣ל הַ/שָּׂ֔ר וְ/אֶחָ֖י/ו מֵאָ֥ה וּ/שְׁלֹשִֽׁים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/007.yaml
  text: 'For the sons of Gershom: Joel the chief[b][a], and 130 of his brothers.'
translation:
  language: de
  text: 'Von den Söhnen Gerschoms[a]: Joel, das Oberhaupt, und 130 seiner Brüder[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Gerschon“, entsprechend der geläufigeren traditionellen Form des Namens dieser levitischen Familie; der hebräische Text lautet hier Gerschom.
    reason: alternative_reading
  - marker: b
    text: Mit „Brüdern“ sind hier männliche Angehörige derselben levitischen Familiengruppe gemeint, nicht unbedingt leibliche Brüder Joels.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Von den Söhnen
  rationale: Die Präposition ל leitet hier innerhalb einer Aufzählung die nächste levitische Familiengruppe ein. „Von den Söhnen“ gibt diese Gliederungsfunktion natürlich wieder und bewahrt zugleich die genealogische Ausdrucksweise.
- source_word: גֵּרְשׁוֹם
  choice: Gerschom
  rationale: Die Form des hebräischen Textes lautet Gerschom. Die Schreibweise folgt einer im Deutschen üblichen Transliteration des Namens.
- source_word: יוֹאֵל
  choice: Joel
  rationale: Eingebürgerte deutsche Form des hebräischen Personennamens.
- source_word: הַשָּׂר
  choice: das Oberhaupt
  rationale: שַׂר bezeichnet je nach Zusammenhang einen Anführer, Vorsteher oder Würdenträger. In dieser Aufzählung einer levitischen Familienabteilung bezeichnet „Oberhaupt“ Joels leitende Stellung, ohne einen königlichen Rang anzudeuten.
- source_word: וְאֶחָיו
  choice: und 130 seiner Brüder
  rationale: אָח kann neben leiblichen Brüdern auch männliche Angehörige derselben Großfamilie oder Sippe bezeichnen. Die Grundbedeutung „Brüder“ bleibt erhalten; die Fußnote erläutert die weitere Bedeutung im Kontext.
- source_word: מֵאָה וּשְׁלֹשִׁים
  choice: '130'
  rationale: Die Kardinalzahl bedeutet eindeutig „hundertdreißig“. Ziffern sind in dieser listenartigen Passage gut lesbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Form einer genealogisch-administrativen Liste bleibt erhalten; „Oberhaupt“ ist verständlicher und kontextgerechter als das rangmäßig missverständliche „Fürst“.
