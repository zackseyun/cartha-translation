base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/027.yaml
  text: David was clothed with a robe of fine linen[a], as were all the Levites who were carrying the ark, and the singers, and Chenaniah, the leader of the singing of the singers; and on David was a linen ephod.
translation:
  language: de
  text: David war mit einem Obergewand aus feinem Leinen bekleidet, ebenso alle Leviten, die die Lade trugen, die Sänger und Kenanja, der Leiter des Tragens[a]. David trug auch ein leinenes Efod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „der Leiter des Gesangs“ oder „der Leiter der Musik“. Die hebräische Wortfolge ist schwierig und lässt sich unterschiedlich verstehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְכֻרְבָּל
  choice: war … bekleidet
  rationale: Das passive Partizip bezeichnet das Bekleidetsein mit einem Gewand; die Formulierung ist im Deutschen natürlich und wahrt die Zustandsbeschreibung.
- source_word: מְעִיל בּוּץ
  choice: Mantel aus feinem Leinen
  rationale: מְעִיל bezeichnet ein Obergewand, während בּוּץ den hochwertigen Leinenstoff nennt. „Mantel aus feinem Leinen“ ist verständlich und würdig.
- source_word: הַנֹּשְׂאִים אֶת הָאָרוֹן
  choice: die die Lade trugen
  rationale: Das Partizip beschreibt die fortdauernde Tätigkeit der Leviten während des Zuges.
- source_word: הַמְשֹׁרְרִים
  choice: die Sänger
  rationale: Das Wort bezeichnet spezifisch die Singenden und sollte nicht allgemein zu „Musikern“ erweitert werden.
- source_word: כְנַנְיָה
  choice: Kenanja
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: הַשַּׂר
  choice: der Leiter
  rationale: Bezeichnet den Verantwortlichen oder Vorsteher; „Leiter“ passt zu der hier genannten Aufgabe.
- source_word: הַמַּשָּׂא הַמְשֹׁרְרִים
  choice: des Gesangs der Sänger
  rationale: Die hebräische Wortfolge ist schwierig. Diese Wiedergabe folgt einer kontextuell plausiblen Deutung von מַשָּׂא als musikalischem Vortrag, ohne die Unsicherheit zu verschweigen.
- source_word: אֵפוֹד בָּד
  choice: ein leinenes Efod
  rationale: „Efod“ bleibt als Bezeichnung des besonderen kultischen Kleidungsstücks erhalten; בָּד bezeichnet hier Leinen.
- source_word: וְעַל דָּוִיד
  choice: Außerdem trug David
  rationale: Die hebräische Konstruktion lautet wörtlich „und auf David [war]“. Die deutsche Formulierung macht natürlich verständlich, dass das Efod ein zusätzliches Kleidungsstück war.
theological_decisions:
- issue: Davids Kleidung im gottesdienstlichen Zusammenhang
  choice: Efod als konkrete Kleidungsbezeichnung beibehalten
  alternative: „priesterliches Gewand“ oder eine ausdrückliche Aussage über ein Priesteramt Davids
  rationale: Der Vers nennt Davids Kleidung, schreibt ihm an dieser Stelle aber nicht ausdrücklich ein Priesteramt zu. „Efod“ bewahrt die Textaussage, ohne eine weitergehende theologische Folgerung einzutragen.
- issue: Schwierige Wortfolge הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים
  choice: „der Leiter des Gesangs der Sänger“ mit Fußnote
  alternative: „der Leiter des Tragens, die Sänger“, „der Leiter beim Tragen“ oder „der Leiter der Musik“
  rationale: Der masoretische Text ist syntaktisch und lexikalisch schwierig. Die Haupttextfassung ist im Zusammenhang verständlich; die Fußnote erhält die wörtlichere Möglichkeit und macht die Unsicherheit transparent.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Der Fachbegriff „Efod“ bleibt erhalten; die schwierige hebräische Formulierung wird im Haupttext lesbar wiedergegeben und in der Fußnote als unsicher gekennzeichnet.
