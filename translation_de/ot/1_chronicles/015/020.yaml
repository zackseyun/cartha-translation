base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/020.yaml
  text: and Zechariah[a], Aziel, Shemiramoth, Jehiel, Unni, Eliab, Maaseiah, and Benaiah, with harps according to Alamoth.
translation:
  language: de
  text: und Sacharja, Asiël, Schemiramot, Jehiël, Unni, Eliab, Maaseja und Benaja mit Harfen auf Alamot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit Harfen in hoher Tonlage«. Der hebräische Ausdruck »Alamot« ist möglicherweise eine musikalische Anweisung, die mit jungen Frauen oder einer hohen Stimmlage zusammenhängt.'
    reason: lexikalische Alternative bei einem unsicheren musikalischen Fachausdruck
lexical_decisions:
- source_word: בִּנְבָלִים
  choice: mit Harfen
  rationale: נְבָלִים bezeichnet Saiteninstrumente, die im Deutschen meist als Harfen oder Leiern wiedergegeben werden. »Harfen« ist hier verständlich und fügt sich natürlich in die Aufzählung der Musikinstrumente ein; das Präfix ב wird instrumental mit »mit« wiedergegeben.
- source_word: עַל
  choice: nach
  rationale: Im musikalischen Zusammenhang leitet עַל wahrscheinlich eine Spielweise, Tonlage oder musikalische Anweisung ein. »nach« bewahrt diese Offenheit, ohne eine bestimmte Deutung festzulegen.
- source_word: עֲלָמוֹת
  choice: Alamot
  rationale: Das Wort hängt sprachlich mit der Bezeichnung für junge Frauen zusammen, dient hier aber wahrscheinlich als musikalischer Fachausdruck, dessen genaue Bedeutung unsicher ist. Die Umschrift »Alamot« erhält diese Unbestimmtheit; eine mögliche Deutung wird in der Fußnote genannt.
- source_word: וּ/זְכַרְיָה וַ/עֲזִיאֵל וּ/שְׁמִירָמוֹת וִֽ/יחִיאֵל וְ/עֻנִּי וֶֽ/אֱלִיאָב וּ/מַעֲשֵׂיָהוּ וּ/בְנָיָהוּ
  choice: und Secharja, Asiël, Schemiramot, Jehiël, Unni, Eliab, Maaseja und Benaja
  rationale: Die Personennamen werden in einer im Deutschen lesbaren, quellennahen Form wiedergegeben. Die einleitende Konjunktion bleibt als »und« erhalten.
