  text: אָ֚ז אָמַ֣ר דָּוִ֔יד לֹ֤א לָ/שֵׂאת֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כִּ֖י אִם הַ/לְוִיִּ֑ם כִּי בָ֣/ם בָּחַ֣ר יְהוָ֗ה לָ/שֵׂ֞את אֶת אֲר֧וֹן יְהוָ֛ה וּֽ/לְ/שָׁרְת֖/וֹ עַד עוֹלָֽם־־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/002.yaml
  text: Then David said[a], “No one is to carry the ark of God except the Levites[b], for Yahweh has chosen them to carry the ark of Yahweh and to minister to him forever.”
translation:
  language: de
  text: 'Da sagte David[a]: »Niemand außer den Leviten darf die Lade Gottes tragen; denn Jahwe hat sie dazu erwählt, die Lade Jahwes zu tragen und ihm für immer zu dienen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da sagte David: ›Die Lade Gottes darf von niemandem außer den Leviten getragen werden.‹« Im Hebräischen bleibt das vorausgesetzte Subjekt unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Damals
  rationale: Der temporale Diskursmarker ordnet Davids Aussage in die vorausgehenden Ereignisse ein; »Damals« ist natürlich und würdevoll.
- source_word: לֹא לָשֵׂאת אֶת אֲרוֹן הָאֱלֹהִים כִּי אִם הַלְוִיִּם
  choice: Niemand außer den Leviten darf die Lade Gottes tragen
  rationale: Der hebräische Ausdruck ist elliptisch und lässt das Subjekt unausgesprochen. »Niemand außer den Leviten« ergänzt es zurückhaltend; »darf« gibt die ausschließende Anordnung idiomatisch wieder.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: »Lade« ist im Deutschen die etablierte Bezeichnung für diesen heiligen Kultgegenstand.
- source_word: כִּי בָם בָּחַר יְהוָה
  choice: denn sie hat Jahwe dazu erwählt
  rationale: כִּי begründet die vorausgehende Einschränkung; die Voranstellung des Pronomens gibt das betonte בָם wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Wiedergabe als Eigenname bewahrt die Funktion des Tetragramms als Gottes persönlicher Name.
- source_word: לָשֵׂאת
  choice: zu tragen
  rationale: נשא bezeichnet hier das tatsächliche Tragen der Lade; »tragen« ist die direkte und natürliche Entsprechung.
- source_word: וּלְשָׁרְתוֹ
  choice: und ihm zu dienen
  rationale: שרת bezeichnet hier den heiligen bzw. kultischen Dienst. »Dienen« ist im modernen Deutsch natürlich und behält durch den Kontext diese besondere Bedeutung.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet die dauerhafte Geltung der Berufung; »für immer« ist klar und idiomatisch.
theological_decisions:
- issue: Bezug des Suffixes in וּלְשָׁרְתוֹ
  choice: »ihm zu dienen«, wobei »ihm« auf Jahwe verweist
  alternative: Dienst vor der Lade bzw. bei ihr
  rationale: Jahwe ist der nächstliegende personale Bezugspunkt, und der levitische Dienst wird regelmäßig als Dienst für Jahwe beschrieben. Die grammatische Form bleibt als Pronomen erhalten.
- issue: Dauer in עַד עוֹלָם
  choice: »für immer«
  alternative: »auf unabsehbare Zeit« oder »für alle Zeit«
  rationale: Die Übersetzung bewahrt die starke, offene Dauerformulierung des Hebräischen, ohne sie durch eine zeitlich begrenzende Deutung abzuschwächen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Ellipse des Hebräischen wird im Haupttext idiomatisch ergänzt und in der Fußnote kenntlich gemacht; der Gottesname wird als »Jahwe« wiedergegeben.
