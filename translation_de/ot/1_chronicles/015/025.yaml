  text: וַ/יְהִ֥י דָוִ֛יד וְ/זִקְנֵ֥י יִשְׂרָאֵ֖ל וְ/שָׂרֵ֣י הָ/אֲלָפִ֑ים הַ/הֹֽלְכִ֗ים לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מִן בֵּ֥ית עֹבֵֽד אֱדֹ֖ם בְּ/שִׂמְחָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/025.yaml
  text: So David, and the elders of Israel, and the commanders of the thousands went to bring up the ark of the covenant of Yahweh from the house of Obed-edom with joy.
translation:
  language: de
  text: Da zogen David, die Ältesten Israels und die Obersten der Tausendschaften hin, um die Lade des Bundes Jahwes mit Freude aus dem Haus Obed-Edoms heraufzubringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי ... הַהֹלְכִים
  choice: So zogen ... hin
  rationale: Die Konstruktion eröffnet den nächsten Erzählschritt; eine finite deutsche Form gibt die Funktion des Partizips natürlich wieder, ohne ein schwerfälliges »Und es geschah«.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: die Ältesten Israels
  rationale: Dies ist die übliche und sachlich genaue Bezeichnung der anerkannten Führung Israels.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: die Obersten der Tausendschaften
  rationale: שָׂרֵי bezeichnet hier führende Amtsträger beziehungsweise Befehlshaber; אֲלָפִים meint in diesem Zusammenhang gegliederte Großverbände. »Tausendschaften« bewahrt den hebräischen Bezug, ohne moderne exakte Truppenstärken vorauszusetzen.
- source_word: לְהַעֲלוֹת
  choice: heraufzubringen
  rationale: Das Hifil von עלה bezeichnet hier das Hinaufbringen der Lade; »heraufbringen« ist im Deutschen kontextgerecht und bewahrt die räumliche Perspektive.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Jahwes
  rationale: Die Wiedergabe folgt der hebräischen Genitivkette und verwendet für אֲרוֹן die im biblischen Kontext etablierte Bezeichnung »Lade«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im modernen Standarddeutsch in der geläufigen deutschen Form »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: מִן בֵּית עֹבֵד אֱדֹם
  choice: aus dem Haus Obed-Edoms
  rationale: Die Formulierung gibt die Herkunft aus Obed-Edoms Haus knapp und idiomatisch wieder und bewahrt den Personennamen.
- source_word: בְּשִׂמְחָה
  choice: voll Freude
  rationale: Die adverbiale Wendung drückt die freudige Art der Handlung natürlich aus und bewahrt den festlichen Ton.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Eigennamen Gottes ausdrücklich. »Jahwe« erhält diesen Charakter als Name, während »der HERR« ihn durch einen Titel ersetzen würde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gut lesbar, bleibt aber durch »Obersten der Tausendschaften« und »Lade des Bundes Jahwes« eng am hebräischen Wortlaut.
