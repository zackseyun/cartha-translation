  rationale: Die Überarbeitung beseitigt ausschließlich die deutsche Bezugsmehrdeutigkeit bei den Tragstangen. Der Relativsatz macht deutlich, dass „ihnen“ die Schultern meint, ohne die knappe räumliche Aussage des Hebräischen inhaltlich zu erweitern. Der Fußnotenanker wurde an das Ende des Satzes gesetzt, weil die Anmerkung die betreffende Konstruktion erläutert.
