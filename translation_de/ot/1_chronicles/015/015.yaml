base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/015.yaml
  text: And the sons of the Levites carried the ark of God on their shoulders with the poles upon them[a], just as Moses had commanded according to the word of Yahweh.
translation:
  language: de
  text: Und die Söhne der Leviten trugen die Lade Gottes auf ihren Schultern, mit den Tragstangen, die auf ihnen auflagen, genau wie Mose es nach dem Wort Jahwes geboten hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit den Tragstangen auf ihnen“. Die hebräische Wendung beschreibt, dass die Tragstangen beim Tragen auf ihren Schultern lagen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: trugen
  rationale: נשא bezeichnet hier das Tragen beziehungsweise Befördern der Lade, nicht nur ein kurzes Anheben.
- source_word: בְנֵי הַלְוִיִּם
  choice: die Söhne der Leviten
  rationale: Die ausdrückliche hebräische Verwandtschafts- und Stammesbezeichnung wird bewahrt, statt sie zum bloßen Kollektiv „die Leviten“ zu verkürzen.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Der Vers sagt nur „Lade Gottes“; „Bundeslade“ würde ein hier nicht vorhandenes Element ergänzen.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: genau wie Mose es … geboten hatte
  rationale: כַּאֲשֶׁר drückt Übereinstimmung aus; das Plusquamperfekt verdeutlicht, dass das Gebot dem Tragen vorausging.
- source_word: כִּדְבַר יְהוָה
  choice: nach dem Wort Jahwes
  rationale: Die Formulierung erhält דבר als „Wort“ und gibt den Gottesnamen יהוה als „Jahwe“ wieder.
- source_word: בִּכְתֵפָם
  choice: auf ihren Schultern
  rationale: Die Wendung bezeichnet den Ort, an dem die Last beim Tragen auflag.
- source_word: בַּמֹּטוֹת עֲלֵיהֶם
  choice: wobei die Tragstangen auf ihnen ruhten
  rationale: Die Formulierung gibt sowohl das Tragen mittels der Stangen als auch deren Aufliegen auf den Trägern wieder, ohne die knappe hebräische Raumangabe unnötig auszubauen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet das Tetragramm; die Wiedergabe als Eigenname bewahrt den ausdrücklich genannten Gottesnamen.
- issue: Geschlechtsspezifische Stammesbezeichnung בְנֵי הַלְוִיִּם
  choice: die Söhne der Leviten
  alternative: die Leviten
  rationale: Das Hebräische verwendet ausdrücklich eine maskuline filiale Bezeichnung; diese wird nicht zu einem allgemeinen Kollektiv eingeebnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Lade“ und „Tragstangen“ sind verständliche, im biblischen Zusammenhang präzise Begriffe; die Satzstellung bewahrt den Ablauf und die Begründung des hebräischen Textes.
