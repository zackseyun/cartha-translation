source:
  edition: WLC
  text: וַֽ/יְהִי֙ בֶּ/עְזֹ֣ר הָֽ/אֱלֹהִ֔ים אֶ֨ת הַ/לְוִיִּ֔ם נֹשְׂאֵ֖י אֲר֣וֹן בְּרִית יְהוָ֑ה וַ/יִּזְבְּח֥וּ שִׁבְעָֽה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/026.yaml
  text: And when God helped the Levites who were carrying the ark of the covenant of Yahweh[a], they sacrificed seven bulls and seven rams.
translation:
  language: de
  text: Als Gott den Leviten half, die die Lade des Bundes Jahwes[a] trugen, opferten sie sieben Stiere und sieben Widder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Lade von Jahwes Bund“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּעְזֹר
  choice: als … half
  rationale: Der Infinitivkonstrukt mit ב nach ויהי bildet hier einen Temporalsatz. „Als … half“ gibt die Konstruktion klar und natürlich wieder.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Der Ausdruck bezeichnet hier den Gott Israels; im Deutschen ist „Gott“ die natürliche Wiedergabe, ohne den hebräischen Artikel eigens abzubilden.
- source_word: הַלְוִיִּם
  choice: den Leviten
  rationale: Übliche deutsche Bezeichnung; der Dativ ergibt sich aus dem Verb „helfen“.
- source_word: נֹשְׂאֵי
  choice: die … trugen
  rationale: Das Partizip beschreibt die Leviten als diejenigen, die die Lade während des Geschehens trugen. Der Relativsatz ist im modernen Deutsch klar und idiomatisch.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Jahwes
  rationale: Die Wiedergabe erhält die hebräische Genitivkette und ihre mögliche Zuordnung zu „Bund“; die alternative deutsche Fassung wird in einer Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיִּזְבְּחוּ
  choice: opferten sie
  rationale: Das Verb bezeichnet in diesem kultischen Zusammenhang das Darbringen von Opfertieren. Die Pluralform des hebräischen Verbs bleibt erhalten.
- source_word: שִׁבְעָה פָרִים
  choice: sieben Stiere
  rationale: „Stiere“ ist die direkte und in einem Opferzusammenhang natürliche Wiedergabe von פָרִים.
- source_word: וְשִׁבְעָה אֵילִים
  choice: und sieben Widder
  rationale: „Widder“ gibt אֵילִים präzise wieder; die Wiederholung der Zahl wird entsprechend dem Hebräischen beibehalten.
theological_decisions:
- issue: Subjekt der Opferhandlung
  choice: opferten sie
  alternative: opferte er / es wurden geopfert
  rationale: וַיִּזְבְּחוּ steht in der 3. Person maskulin Plural. Die Übersetzung bewahrt diese grammatische Mehrzahl, ohne eine im Hebräischen nicht ausdrücklich genannte Einzelperson zum Subjekt zu machen.
- issue: Zuordnung des Gottesnamens in der Genitivkette
  choice: die Lade des Bundes Jahwes
  alternative: die Lade von Jahwes Bund
  rationale: Die knappe hebräische Konstruktverbindung אֲרוֹן בְּרִית יְהוָה lässt sich im Deutschen unterschiedlich gliedern. Der Haupttext bleibt eng an der Formulierung „Lade des Bundes Jahwes“; die Fußnote macht die alternative Zuordnung transparent.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nahe am Hebräischen, ohne unnatürlich zu wirken; der Gottesname erscheint als „Jahwe“.
