  text: וַ/יַּקְהֵ֥ל דָּוִ֛יד אֶת כָּל יִשְׂרָאֵ֖ל אֶל יְרֽוּשָׁלִָ֑ם לְ/הַעֲלוֹת֙ אֶת אֲר֣וֹן יְהוָ֔ה אֶל מְקוֹמ֖/וֹ אֲשֶׁר הֵכִ֥ין לֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/003.yaml
  text: And David assembled all Israel at Jerusalem to bring up the ark of Yahweh to its place[b][a], which he had prepared for it.
translation:
  language: de
  text: Und David versammelte ganz Israel in Jerusalem, um die Lade Jahwes an ihren Platz zu bringen, den er für sie vorbereitet hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „für ihn“; gemeint ist im Zusammenhang wahrscheinlich die Lade. Es kann jedoch auch „für Jahwe“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: versammelte
  rationale: Der Hifil von קהל bezeichnet hier das Zusammenrufen beziehungsweise Zusammenbringen einer Gruppe; „versammelte“ ist im Deutschen natürlich und sachlich.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Die kollektive Wendung bezeichnet Israel als Gesamtheit, gegebenenfalls vertreten durch seine Repräsentanten, ohne dies ausdrücklich festzulegen.
- source_word: אֶל יְרוּשָׁלִָם
  choice: in Jerusalem
  rationale: אֶל bezeichnet grundsätzlich eine Bewegung auf ein Ziel hin; beim deutschen Verb „versammeln“ gibt „in Jerusalem“ jedoch idiomatisch den erreichten Versammlungsort wieder.
- source_word: לְהַעֲלוֹת
  choice: zu bringen
  rationale: Der Hifil von עלה kann „hinaufbringen“ bedeuten. Da die deutsche Wendung „die Lade hinaufbringen“ ohne ausdrücklich genannten Ausgangspunkt schwerfällig wirkt, gibt „bringen“ die beabsichtigte Überführung natürlich wieder, ohne eine zusätzliche Richtung festzulegen.
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: Die Konstruktverbindung wird knapp und würdevoll wiedergegeben; „Lade“ ist die etablierte Bezeichnung für den heiligen Kultgegenstand.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל מְקוֹמוֹ
  choice: an ihren Platz
  rationale: Das maskuline Suffix bezieht sich im Kontext am natürlichsten auf אָרוֹן, „Lade“; wegen des grammatischen Geschlechts im Deutschen steht entsprechend „ihren“.
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: den er für sie vorbereitet hatte
  rationale: Das Relativpronomen bezieht sich grammatisch auf „Platz“. Das Suffix לוֹ kann sich auf die Lade beziehen; im Deutschen wird dies entsprechend ihrem Genus mit „für sie“ ausgedrückt. Das Plusquamperfekt kennzeichnet die vorausgehende Vorbereitung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen ausdrücklich. „Jahwe“ bewahrt diese Funktion, statt einen traditionellen Ersatztitel einzusetzen.
- issue: Bezug des Pronomens in לוֹ
  choice: für sie, auf die Lade bezogen
  alternative: für ihn, auf Jahwe bezogen
  rationale: Der unmittelbare Zusammenhang handelt vom Platz der Lade, weshalb der Bezug auf die Lade am wahrscheinlichsten ist. Da der hebräische maskuline Singular formal auch einen männlichen Bezug zulässt, bleibt die alternative Deutung grundsätzlich möglich.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, klar verständlichem Erzählstil. Die Satzstruktur bleibt nahe am Hebräischen, wird aber idiomatisch geglättet. Keine Fußnote ist nötig, da die wahrscheinlichste Lesart im Haupttext natürlich wiedergegeben werden kann und die formale Pronominalambiguität in den Entscheidungsnotizen dokumentiert ist.
