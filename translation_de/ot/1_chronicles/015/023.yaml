  text: Berechiah and Elkanah were gatekeepers for the ark[a].
translation:
  language: de
  text: Berechja und Elkana waren Torhüter für die Bundeslade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Torhüter bei der Bundeslade«. Die hebräische Präposition kann entweder die Zuordnung zu einem Dienst oder den Ort bei der Bundeslade bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּרֶכְיָה
  choice: Berechja
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenkonvention transliteriert.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenkonvention transliteriert.
- source_word: שֹׁעֲרִים
  choice: Torhüter
  rationale: Das Substantiv bezeichnet Personen, die einen Zugang bewachen. »Torhüter« ist im kultischen Zusammenhang natürlich und genauer als das allgemeinere »Wächter«.
- source_word: לָאָרוֹן
  choice: für die Bundeslade
  rationale: Die Präposition ל kann hier eine Zuordnung oder einen Dienstauftrag bezeichnen. »Für die Bundeslade« gibt diese Beziehung verständlich wieder; eine örtliche Deutung bleibt möglich und wird in der Fußnote genannt.
- source_word: וְ
  choice: und
  rationale: Die Konjunktion verbindet die beiden Personennamen.
theological_decisions: []
