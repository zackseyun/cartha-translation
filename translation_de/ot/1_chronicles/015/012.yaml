  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם אַתֶּ֛ם רָאשֵׁ֥י הָ/אָב֖וֹת לַ/לְוִיִּ֑ם הִֽתְקַדְּשׁוּ֙ אַתֶּ֣ם וַ/אֲחֵי/כֶ֔ם וְ/הַֽעֲלִיתֶ֗ם אֵ֣ת אֲר֤וֹן יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֶל הֲכִינ֖וֹתִי לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/012.yaml
  text: And he said to them[a], “You are the heads of the fathers’ houses of the Levites. Sanctify yourselves, you and your brothers, and bring up the ark of Yahweh, the God of Israel, to the place I have prepared for it.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Ihr seid die Familienoberhäupter der Leviten. Heiligt euch[a], ihr und eure Brüder, und bringt die Lade Jahwes, des Gottes Israels, zu dem Ort hinauf, den ich für sie vorbereitet habe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Weiht euch.« Das hebräische Verb bezeichnet rituelle Selbstheiligung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת לַלְוִיִּם
  choice: die Oberhäupter der Sippen der Leviten
  rationale: Die Wendung bezeichnet die führenden Männer der väterlich bestimmten Großfamilien bzw. Sippen innerhalb der Leviten. „Oberhäupter der Sippen“ gibt die soziale Struktur verständlich und relativ quellennah wieder.
- source_word: הִתְקַדְּשׁוּ
  choice: Heiligt euch
  rationale: Der Hitpael von קדשׁ bezeichnet hier die rituelle Vorbereitung bzw. Selbstheiligung für eine heilige Aufgabe. „Heiligt euch“ bewahrt den kultischen und theologischen Wortlaut.
- source_word: וַאֲחֵיכֶם
  choice: eure Brüder
  rationale: Das hebräische Wort bedeutet wörtlich „eure Brüder“ und meint im Kontext die levitischen Stammes- und Amtsbrüder.
- source_word: וְהַעֲלִיתֶם
  choice: bringt … hinauf
  rationale: Der Hifil von עלה bedeutet „hinaufbringen“. Die Richtungsangabe passt zum Transport der Lade an den vorbereiteten Ort.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: die Lade Jahwes, des Gottes Israels
  rationale: „Lade“ ist die geläufige deutsche Bezeichnung für den heiligen Kultgegenstand; die Apposition „des Gottes Israels“ bleibt vollständig erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל הֲכִינוֹתִי לוֹ
  choice: an den Ort, den ich für sie vorbereitet habe
  rationale: Nach אֶל ist ein Ziel vorausgesetzt. Aus dem unmittelbaren Erzählzusammenhang ergibt sich ein vorbereiteter Ort; „Ort“ wird zur natürlichen deutschen Verständlichkeit ergänzt. Das feminine Pronomen „sie“ bezieht sich auf die Lade.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als Gottes Eigenname, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Bedeutung von הִתְקַדְּשׁוּ
  choice: Heiligt euch
  alternative: Weiht euch / Bereitet euch rituell vor
  rationale: Der Wortlaut bezeichnet kultische Selbstheiligung. Die Übersetzung wahrt die theologische Kategorie der Heiligkeit; die Fußnote erläutert den rituellen Sinn, ohne ihn auf eine einzelne konkrete Handlung einzuengen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Sippen“ verdeutlicht die väterlich gegliederte Sozialstruktur, ohne die schwer verständliche Lehnformel „Vaterhäuser“ zu verwenden. Der Gottesname erscheint als „Jahwe“.
