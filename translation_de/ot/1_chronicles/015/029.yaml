base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/029.yaml
  text: And as the ark of the covenant of Yahweh came to the city of David[a], Michal the daughter of Saul looked out through the window and saw King David dancing and playing, and she despised him in her heart.
translation:
  language: de
  text: Als die Lade des Bundes Jahwes zur Stadt Davids kam, schaute Michal, die Tochter Sauls, aus dem Fenster hinaus. Sie sah König David tanzen und spielen[a], und sie verachtete ihn in ihrem Herzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sich freuen oder feiern.'
    reason: Das hebräische Wort kann spielerisches, fröhliches oder festliches Handeln bezeichnen.
lexical_decisions:
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Jahwes
  rationale: Die deutsche Genitivkette gibt die hebräische Status-constructus-Verbindung präzise und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בָּא עַד עִיר דָּוִיד
  choice: bis zur Stadt Davids kam
  rationale: בוא mit עַד bezeichnet hier das Herankommen bis zum Ziel, ohne ausdrücklich zu behaupten, die Lade sei bereits in die Stadt eingezogen.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Michal, die Tochter Sauls
  rationale: Die Apposition bleibt erhalten und wahrt die erzählerische Hervorhebung ihrer Zugehörigkeit zu Saul.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: schaute … durch das Fenster hinaus
  rationale: Die Formulierung gibt den Blick aus dem Fenster idiomatisch wieder, ohne die mögliche Blickrichtung nach unten unnötig festzulegen.
- source_word: וַתֵּרֶא אֶת הַמֶּלֶךְ דָּוִיד
  choice: Sie sah König David
  rationale: Die Verbindung aus Titel und Name wird im Deutschen natürlich als „König David“ ausgedrückt.
- source_word: מְרַקֵּד
  choice: tanzen
  rationale: Das Partizip bezeichnet eine lebhafte, tanzartige Bewegung.
- source_word: וּמְשַׂחֵק
  choice: ausgelassen feiern
  rationale: שׂחק kann spielerisches, fröhliches oder festliches Handeln bezeichnen; im Prozessionskontext vermittelt „ausgelassen feiern“ die festliche Freude, ohne die Bedeutung auf bloßes Spielen zu verengen.
- source_word: וַתִּבֶז לוֹ
  choice: sie verachtete ihn
  rationale: בזה bezeichnet starke Geringschätzung oder Verachtung; die direkte deutsche Wiedergabe bewahrt diese Schärfe.
- source_word: בְּלִבָּהּ
  choice: in ihrem Herzen
  rationale: Die wörtliche und im Deutschen verständliche Wendung hebt hervor, dass ihre Verachtung zunächst innerlich blieb.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ wahrt diese Namensfunktion, statt sie durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Zwei Hauptsätze vermeiden eine überladene Satzperiode; „bis zur Stadt Davids“ erhält die räumliche Nuance von עַד.
