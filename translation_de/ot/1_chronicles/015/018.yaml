base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/018.yaml
  text: 'And with them were their brothers of the second rank: Zechariah[a], Ben-Jaaziel, and Shemiramoth, and Jehiel, and Unni, Eliab, and Benaiah, and Maaseiah, and Mattithiah, and Eliphelehu, and Mikneiah, and Obed-edom, and Jeiel, the gatekeepers.'
translation:
  language: de
  text: 'Und bei ihnen waren ihre Brüder vom zweiten Rang[a]: Secharja, Ben, Jaasiël, Schemiramot, Jehiël, Unni, Eliab, Benaja, Maaseja, Mattitja, Elifalehu, Mikneja, Obed-Edom und Jeïel, die Torhüter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Brüder, die zweite Gruppe« beziehungsweise »ihre Brüder von der zweiten Ordnung«. Der hebräische Ausdruck unterscheidet wahrscheinlich eine nachgeordnete Gruppe oder Rangstufe unter den Leviten beziehungsweise Musikern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Und bei ihnen waren
  rationale: Die Präpositionalgruppe führt eine weitere, begleitende Gruppe ein; »waren« ergänzt im Deutschen natürlich den im nominalen hebräischen Satz fehlenden Ausdruck des Seins.
- source_word: אֲחֵיהֶם
  choice: ihre Brüder
  rationale: Bewahrt die wörtliche Verwandtschaftsbezeichnung, die hier zugleich levitische Stammes- oder Amtsgenossen bezeichnen kann.
- source_word: הַמִּשְׁנִים
  choice: vom zweiten Rang
  rationale: Das von »zweiter« abgeleitete Wort kennzeichnet wahrscheinlich eine nachgeordnete Gruppe oder Rangstufe; die Formulierung erhält diese sachliche Unbestimmtheit.
- source_word: זְכַרְיָהוּ בֵּן וְיַעֲזִיאֵל
  choice: Secharja, Ben, Jaasiël
  rationale: Der masoretische Wortlaut setzt vor Jaasiël eine Konjunktion und behandelt »Ben« innerhalb der koordinierten Namensliste am natürlichsten als eigenen Namen. Die englische Verbindung »Ben-Jaaziel« wird daher nicht übernommen.
- source_word: הַשֹּׁעֲרִים
  choice: die Torhüter
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die an den Toren Wache halten beziehungsweise den Zugang beaufsichtigen.
