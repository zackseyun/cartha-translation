id: 1CH.15.1
reference: 1 Chronicles 15:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּֽעַשׂ ל֥/וֹ בָתִּ֖ים בְּ/עִ֣יר דָּוִ֑יד וַ/יָּ֤כֶן מָקוֹם֙ לַֽ/אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יֶּט ל֖/וֹ אֹֽהֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/001.yaml
  text: And he made houses for himself in the city of David[a], and he prepared a place for the ark of God and pitched a tent for it.
translation:
  language: de
  text: Und er baute sich Häuser in der Stadt Davids. Dann bereitete er einen Platz für die Lade Gottes vor und schlug für sie[a] ein Zelt auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schlug für sich ein Zelt auf“. Das hebräische Suffix kann sich auf die Lade oder auf David beziehen; der unmittelbare Zusammenhang spricht eher für die Lade.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ בָתִּים
  choice: er baute sich Häuser
  rationale: עָשָׂה bedeutet allgemein „machen, anfertigen“; zusammen mit „Häuser“ gibt „bauen“ den gemeinten Vorgang im Deutschen natürlich und präzise wieder. Das לוֹ wird reflexiv mit „sich“ ausgedrückt.
- source_word: בְּעִיר דָּוִיד
  choice: in der Stadt Davids
  rationale: Die Formulierung gibt die hebräische Genitivverbindung direkt und in würdigem Standarddeutsch wieder.
- source_word: וַיָּכֶן מָקוֹם
  choice: bereitete einen Platz … vor
  rationale: Das Hifil von כון bezeichnet hier das Herrichten oder Bereitmachen eines Platzes; „vorbereiten“ passt zum unmittelbaren Zusammenhang.
- source_word: לַאֲרוֹן הָאֱלֹהִים
  choice: für die Lade Gottes
  rationale: „Lade Gottes“ ist die etablierte und sachlich genaue Wiedergabe der heiligen אֲרוֹן in diesem Zusammenhang.
- source_word: וַיֶּט … אֹהֶל
  choice: schlug … ein Zelt auf
  rationale: נטה bezeichnet bei einem Zelt idiomatisch dessen Aufschlagen. Der fehlende Artikel bei אֹהֶל wird mit „ein Zelt“ abgebildet.
- source_word: לוֹ
  choice: für sie
  rationale: Das maskuline Suffix kann sich im Hebräischen auf die grammatisch maskuline „Lade“ beziehen. Im Deutschen verlangt „Lade“ das feminine Pronomen „sie“; der unmittelbare Kontext begünstigt diesen Bezug.
theological_decisions:
- issue: Bezugswort des Suffixes in וַיֶּט לוֹ אֹהֶל
  choice: 'Das Suffix bezieht sich auf die Lade: „schlug für sie ein Zelt auf“.'
  alternative: 'Das Suffix bezieht sich auf David: „schlug für sich ein Zelt auf“.'
  rationale: Die unmittelbar vorausgehende Aussage handelt von dem für die Lade vorbereiteten Platz; ein anschließend für sie aufgeschlagenes Zelt bildet eine schlüssige Fortsetzung. Da der hebräische Wortlaut den Bezug auf David grammatisch nicht ausschließt, bleibt diese Lesart in der Fußnote erhalten.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die kurzen Hauptsätze bewahren den erzählenden Stil; „Dann“ macht die Handlungsfolge natürlich, ohne den Sinn zu erweitern.
