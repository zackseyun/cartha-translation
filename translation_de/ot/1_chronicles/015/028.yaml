id: 1CH.15.28
reference: 1 Chronicles 15:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֗ל מַעֲלִים֙ אֶת אֲר֣וֹן בְּרִית יְהוָ֔ה בִּ/תְרוּעָה֙ וּ/בְ/ק֣וֹל שׁוֹפָ֔ר וּ/בַ/חֲצֹצְר֖וֹת וּ/בִ/מְצִלְתָּ֑יִם מַשְׁמִעִ֕ים בִּ/נְבָלִ֖ים וְ/כִנֹּרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/028.yaml
  text: And all Israel was bringing up the ark of the covenant of Yahweh with shouting[a], with the sound of a horn, with trumpets, and with cymbals[b], making music with harps and lyres.
translation:
  language: de
  text: Und ganz Israel brachte die Lade des Bundes Jahwes hinauf, unter Jubelrufen[a], unter dem Klang des Schofarhorns[b], mit Trompeten und Zimbeln; dazu ließen sie Harfen und Leiern erklingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter lautem Zuruf«; das hebräische Wort kann einen lauten Ruf des Jubels oder der Huldigung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Ein Schofar ist ein Blasinstrument aus einem Tierhorn und von den anschließend genannten Trompeten zu unterscheiden.
    reason: lexical_clarification
lexical_decisions:
- source_word: מַעֲלִים
  choice: brachte … hinauf
  rationale: Das Hifil-Partizip bezeichnet den im Gang befindlichen feierlichen Transport hinauf nach Jerusalem; das deutsche Präteritum gibt den Erzählfluss natürlich wieder.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Jahwes
  rationale: Die Constructusverbindung wird direkt wiedergegeben; „Bund“ bleibt als theologisch bestimmende Bezeichnung der Lade erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תְרוּעָה
  choice: Jubelrufen
  rationale: Das Wort bezeichnet einen lauten Ruf beziehungsweise Zuruf; im festlichen Prozessionskontext ist „Jubelrufe“ natürlich, ohne die mögliche allgemeinere Bedeutung zu verschweigen.
- source_word: קוֹל שׁוֹפָר
  choice: Klang des Schofarhorns
  rationale: קוֹל wird als „Klang“ ausgedrückt; „Schofarhorn“ hält das Instrument von den anschließend genannten Trompeten unterschieden.
- source_word: חֲצֹצְרוֹת
  choice: Trompeten
  rationale: Dies ist die übliche Bezeichnung für die geraden kultischen Trompeten; das Material wird nicht ergänzt, da es im Vers nicht genannt ist.
- source_word: מְצִלְתַּיִם
  choice: Zimbeln
  rationale: Gängige und sachlich passende Bezeichnung des Schlaginstruments.
- source_word: מַשְׁמִיעִים
  choice: ließen … erklingen
  rationale: Das Hifil von שמע hebt das Hörbarwerden hervor. Die Formulierung verbindet den Ausdruck natürlich mit den folgenden Saiteninstrumenten.
- source_word: נְבָלִים
  choice: Harfen
  rationale: Die genaue moderne Entsprechung des antiken Saiteninstruments ist unsicher; „Harfen“ wahrt die herkömmliche Unterscheidung zu כִנֹּרוֹת.
- source_word: כִנֹּרוֹת
  choice: Leiern
  rationale: „Leiern“ unterscheidet dieses antike Saiteninstrument im Deutschen von den zuvor genannten Harfen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bewahrt den feierlichen Prozessionscharakter, unterscheidet Schofar und Trompeten und verwendet für die antiken Saiteninstrumente die konventionellen, annähernden deutschen Bezeichnungen „Harfen“ und „Leiern“.
