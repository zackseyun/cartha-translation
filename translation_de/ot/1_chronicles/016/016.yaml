source:
  edition: WLC
  text: אֲשֶׁ֤ר כָּרַת֙ אֶת אַבְרָהָ֔ם וּ/שְׁבוּעָת֖/וֹ לְ/יִצְחָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/016.yaml
  text: which he made with Abraham[a], and his oath to Isaac—
translation:
  language: de
  text: den er mit Abraham schloss[a], und seinen Eid an Isaak—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den er mit Abraham schnitt«; eine hebräische Redewendung für das Schließen eines Bundes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: den
  rationale: Das Relativpronomen nimmt den im vorherigen Vers genannten Bund auf; wegen des maskulinen Akkusativs von »Bund« steht »den«.
- source_word: כָּרַת
  choice: schloss
  rationale: Wörtlich bedeutet das Verb »schnitt«; zusammen mit dem aus dem vorherigen Vers ergänzten »Bund« bezeichnet es idiomatisch das Schließen eines Bundes. »schloss« ist im Deutschen natürlich und präzise.
- source_word: אֶת אַבְרָהָם
  choice: mit Abraham
  rationale: Obwohl אֶת formal den direkten Gegenstand kennzeichnet, verlangt die deutsche Wendung »einen Bund schließen« hier idiomatisch »mit Abraham«.
- source_word: וּשְׁבוּעָתוֹ
  choice: und seinen Eid
  rationale: Die Wiedergabe bewahrt sowohl das Substantiv »Eid« als auch das maskuline Possessivsuffix »seinen« und erhält den Parallelismus.
- source_word: לְיִצְחָק
  choice: an Isaak
  rationale: Die Präposition ל bezeichnet hier den Adressaten des Eides. »an Isaak« gibt diese Richtung knapp und natürlich wieder; »gegenüber Isaak« wäre ebenfalls möglich, aber schwerfälliger.
theological_decisions:
- issue: Bundesformel כרת ברית, wobei »Bund« aus dem vorherigen Vers zu ergänzen ist
  choice: den er mit Abraham schloss
  alternative: den er mit Abraham schnitt
  rationale: Die hebräische Wendung wird ihrem Sinn nach wiedergegeben, ohne das im Deutschen missverständliche Bild des »Schneidens« in den Haupttext zu übernehmen. Die Bundesaussage bleibt ausdrücklich durch den Rückbezug »den« erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als syntaktische Fortsetzung von Vers 15 fragmentarisch und endet entsprechend mit einem Gedankenstrich.
