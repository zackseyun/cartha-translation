  terminology: „Jahwe“, „Brandopferaltar“, „Brandopfer“ und „Gesetz Jahwes“ sind sachgerecht. Die Fußnote zu Tora/Weisung bewahrt die lexikalische Alternative. „Geboten hat“ gibt die Schlusswendung in natürlichem, neutralem Deutsch wieder.
