  text: לְֽ/הַעֲלוֹת֩ עֹל֨וֹת לַ/יהוָ֜ה עַל מִזְבַּ֧ח הָ/עֹלָ֛ה תָּמִ֖יד לַ/בֹּ֣קֶר וְ/לָ/עָ֑רֶב וּ/לְ/כָל הַ/כָּתוּב֙ בְּ/תוֹרַ֣ת יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה עַל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/040.yaml
  text: to offer burnt offerings to Yahweh on the altar of burnt offering continually[a], morning and evening, and according to all that is written in the law of Yahweh, which he commanded for Israel.
translation:
  language: de
  text: um Jahwe auf dem Brandopferaltar regelmäßig, morgens und abends, Brandopfer darzubringen, nach allem, was im Gesetz[a] Jahwes geschrieben steht, das er Israel geboten hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in der Weisung Jahwes«. Das hebräische Wort Tora kann sowohl »Gesetz« als auch »Weisung« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַעֲלוֹת
  choice: darzubringen
  rationale: Der Hifil-Infinitiv von עלה bedeutet wörtlich »aufsteigen lassen«, bezeichnet im Opferkontext aber idiomatisch das Darbringen eines Opfers.
- source_word: עֹלוֹת
  choice: Brandopfer
  rationale: עֹלָה ist der übliche kultische Ausdruck für ein Opfer, das vollständig auf dem Altar verbrannt wird.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben; die Präposition kennzeichnet den Empfänger der Opfergabe.
- source_word: מִזְבַּח הָעֹלָה
  choice: Brandopferaltar
  rationale: Das deutsche Kompositum bezeichnet knapp und eindeutig den für Brandopfer bestimmten Altar.
- source_word: תָּמִיד
  choice: beständig
  rationale: Das Wort bezeichnet die geregelte, fortdauernde Wiederholung; »morgens und abends« erläutert den täglichen Rhythmus.
- source_word: לַבֹּקֶר וְלָעָרֶב
  choice: morgens und abends
  rationale: Die natürliche deutsche Zeitangabe bewahrt den zweimal täglichen Vollzug.
- source_word: וּלְכָל הַכָּתוּב
  choice: und zwar nach allem, was … geschrieben steht
  rationale: Die Wiedergabe drückt aus, dass die Opferpraxis allen schriftlichen Vorschriften entsprechen sollte.
- source_word: בְּתוֹרַת יְהוָה
  choice: im Gesetz Jahwes
  rationale: תּוֹרָה bezeichnet hier die schriftlich festgehaltene göttliche Ordnung; »Gesetz« ist im kultisch-rechtlichen Kontext verständlich, während eine Fußnote die weitere Bedeutung »Weisung« bewahrt.
- source_word: אֲשֶׁר צִוָּה עַל יִשְׂרָאֵל
  choice: das er Israel auferlegt hatte
  rationale: Die Verbindung von צוה mit על beschreibt, was Israel verbindlich aufgetragen beziehungsweise auferlegt wurde.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Bundesnamen ausdrücklich; »Jahwe« gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von אֲשֶׁר in der Schlusswendung
  choice: Bezug auf das Gesetz als Israel auferlegte Weisung
  alternative: Bezug auf alles, was geschrieben steht
  rationale: Das maskuline Relativpronomen kann sich grammatisch auf תורת יהוה beziehungsweise deren Inhalt beziehen. Die Formulierung bewahrt den Sinn, dass die schriftliche Weisung Israel verbindlich geboten wurde, ohne einen zusätzlichen theologischen Gehalt einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Infinitivkonstruktion »um … darzubringen« bewahrt den Anschluss an den vorausgehenden Kontext. Kultische Fachbegriffe bleiben präzise, werden aber in natürlicher deutscher Wortstellung formuliert.
