  text: And he confirmed it to Jacob as a statute[a], to Israel as an everlasting covenant[b],
translation:
  language: de
  text: Und er bestimmte es für Jakob zur Satzung[a], für Israel zum ewigen Bund[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er bestätigte es für Jakob als Satzung.“ Das hebräische Verb kann ausdrücken, dass etwas fest aufgerichtet oder verbindlich gemacht wird.'
