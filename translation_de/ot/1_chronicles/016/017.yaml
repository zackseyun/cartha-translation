    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: Und er setzte es … ein
  rationale: Das Hifil von עמד bezeichnet hier, dass Gott das zuvor genannte Bundeswort beziehungsweise den Eid fest bestehen lässt oder verbindlich einsetzt. „setzte … ein“ gibt den kausativen Sinn natürlich wieder; das Pronomen „es“ bewahrt den offenen Rückbezug des Hebräischen.
- source_word: לְיַעֲקֹב לְחֹק
  choice: für Jakob als feste Bestimmung
  rationale: לְיַעֲקֹב bezeichnet hier den Empfänger beziehungsweise Begünstigten. חֹק meint eine festgesetzte, verbindliche Ordnung; „feste Bestimmung“ erhält den rechtlich-bundestheologischen Klang und ist im modernen Deutschen verständlich.
- source_word: לְיִשְׂרָאֵל
  choice: für Israel
  rationale: Die parallele Formulierung zum Namen Jakob wird beibehalten, statt die beiden Namen erklärend zusammenzuziehen.
- source_word: בְּרִית עוֹלָם
  choice: als ewigen Bund
  rationale: בְּרִית wird mit dem zentralen theologischen Begriff „Bund“ wiedergegeben. עוֹלָם bezeichnet hier bleibende, unabsehbare Dauer; „ewig“ ist die natürliche und traditionsübergreifend verständliche Wiedergabe.
theological_decisions:
- issue: Bezugswort des femininen Pronominalsuffixes in וַיַּעֲמִידֶהָ
  choice: Der offene Rückbezug wird mit „es“ bewahrt.
  alternative: Das Pronomen ausdrücklich auf den Bund, das Wort oder den Eid der vorhergehenden Verse beziehen.
  rationale: Der unmittelbare Zusammenhang nennt Bund, Wort und Eid in dichter Parallelität. Eine ausdrückliche Festlegung würde die im Hebräischen vorhandene Offenheit unnötig verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Wahrung der hebräischen Parallelstruktur. „Feste Bestimmung“ vermeidet das heute leicht missverständliche „Statut“, während die rechtliche Verbindlichkeit von חֹק erhalten bleibt. Die Kleinschreibung des Pronomens folgt modernem deutschen Bibelstil.
