revisions:
- from: Und er setzte es für Jakob als feste Bestimmung ein[a], für Israel als ewigen Bund[b],
  to: Und er bestimmte es für Jakob zur Satzung[a], für Israel zum ewigen Bund[b],
  rationale: Die Revision ersetzt die schwerfällige und leicht bedeutungserweiternde Formulierung „setzte … als feste Bestimmung ein“ durch eine natürliche, quellensprachlich tragfähige Formulierung. Sie bewahrt sowohl die Parallelstruktur als auch den offenen Bezug von „es“ und die zentrale Terminologie „Satzung“ und „Bund“.
  reviewer_model: gpt-5.6-terra
