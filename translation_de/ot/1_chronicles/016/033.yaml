  text: אָ֥ז יְרַנְּנ֖וּ עֲצֵ֣י הַ/יָּ֑עַר מִ/לִּ/פְנֵ֣י יְהוָ֔ה כִּי בָ֖א לִ/שְׁפּ֥וֹט אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/033.yaml
  text: Then the trees of the forest will sing for joy before Yahweh[c][b][a], for he comes to judge the earth.
translation:
  language: de
  text: Dann werden die Bäume des Waldes vor Jahwe jubeln[a], denn er kommt[b], um die Erde[c] zu richten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „laut vor Freude rufen“. Das hebräische Verb kann jubelndes Singen wie auch lautes Freudenrufen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ist im Kommen“. Die hebräische Form kann im poetischen Zusammenhang ein bevorstehendes Geschehen mit lebendiger Gewissheit ausdrücken.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „das Land“. Das hebräische Wort kann sowohl das Land als auch die Erde bezeichnen; der weitere Zusammenhang legt hier „Erde“ nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Das Zeitadverb leitet die folgende Szene beziehungsweise Folge ein; „Dann“ ist knapp und natürlich.
- source_word: יְרַנְּנוּ
  choice: werden … jubeln
  rationale: Das Piel von רנן bezeichnet ein laut erklingendes, freudiges Rufen oder Singen. „Jubeln“ bewahrt diese Bedeutungsbreite besser als eine Festlegung allein auf Gesang.
- source_word: עֲצֵי הַיָּעַר
  choice: die Bäume des Waldes
  rationale: Die hebräische Genitivverbindung wird unmittelbar und idiomatisch wiedergegeben; die poetische Personifikation bleibt erhalten.
- source_word: מִלִּפְנֵי
  choice: vor
  rationale: In diesem Zusammenhang bezeichnet die Wendung das Jubeln in Jahwes Gegenwart; „vor“ ist im Deutschen die natürliche Entsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund für den Jubel der Schöpfung an.
- source_word: בָא
  choice: er kommt
  rationale: Die finite Form beschreibt im poetischen Kontext das Kommen anschaulich und gewiss. Das deutsche Präsens erhält diese lebendige Aussage.
- source_word: לִשְׁפּוֹט
  choice: um … zu richten
  rationale: Der Infinitiv mit ל bezeichnet hier den Zweck des Kommens. „Richten“ bewahrt den gerichtlichen und herrschaftlichen Sinn.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Der kosmische Lobpreis legt den universalen Bezug nahe; zugleich bleibt die mögliche Bedeutung „Land“ in einer Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Wiedergabe als Eigenname erhält diesen Unterschied gegenüber einem Titel, ohne weitergehende konfessionelle Deutung.
- issue: Reichweite von הָאָרֶץ
  choice: die Erde
  alternative: das Land
  rationale: Der Zusammenhang, in dem die Schöpfung jubelt, spricht für den umfassenden Sinn. Da das hebräische Wort auch „Land“ bedeuten kann, wird die Alternative nicht ausgeschlossen, sondern angemerkt.
- issue: Zeitlicher Aspekt von בָא
  choice: er kommt
  alternative: er ist im Kommen
  rationale: Das Präsens gibt das poetisch als gegenwärtig beziehungsweise gewiss dargestellte Kommen knapp wieder, ohne es eindeutig auf einen einzigen zeitlichen Aspekt festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. „Jubeln“ ist allgemein verständlich und lässt die im Hebräischen offene Ausdrucksweise zwischen Singen und Rufen bestehen. Die Wortstellung „denn er kommt, um …“ folgt natürlichem Deutsch und erhält Begründung und Zweckangabe des Ausgangstextes.
