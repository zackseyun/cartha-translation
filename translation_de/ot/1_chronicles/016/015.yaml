  text: זִכְר֤וּ לְ/עוֹלָם֙ בְּרִית֔/וֹ דָּבָ֥ר צִוָּ֖ה לְ/אֶ֥לֶף דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/015.yaml
  text: Remember his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: de
  text: Erinnert euch für immer an seinen Bund, das Wort[a], das er für tausend Generationen geboten hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann hier auch „Zusage“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Denkt … an
  rationale: Der Qal-Imperativ Plural richtet die Aufforderung unmittelbar an die Gemeinschaft. „An etwas denken“ ist im heutigen Standarddeutsch natürlich und gibt זכר in diesem Zusammenhang klar wieder.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte beziehungsweise fortdauernde Zeit. „Für immer“ ist verständlich und bewahrt die zeitliche Weite des Hebräischen.
- source_word: בְּרִיתוֹ
  choice: seinen Bund
  rationale: בְּרִית bezeichnet hier Gottes bindende Bundesverpflichtung. „Bund“ ist die sachlich und theologisch angemessene deutsche Entsprechung.
- source_word: דָּבָר
  choice: das Wort
  rationale: דָּבָר kann „Wort“, „Sache“ oder im Zusammenhang auch „Zusage“ bedeuten. „Das Wort“ bleibt nahe am hebräischen Ausdruck und lässt dessen Bedeutungsbreite bestehen; „Zusage“ wird in einer Fußnote genannt.
- source_word: צִוָּה
  choice: geboten hat
  rationale: צוה bedeutet gewöhnlich „gebieten“ oder „befehlen“. Die Wiedergabe bewahrt den Charakter einer wirksamen göttlichen Anordnung, ohne zu „gegeben“ oder „verheißen“ zu glätten.
- source_word: לְאֶלֶף דּוֹר
  choice: für tausend Generationen
  rationale: Die Präposition לְ bezeichnet hier die zeitliche Erstreckung. Die Formulierung lässt offen, ob „tausend“ exakt oder als Ausdruck außerordentlich langer Dauer verstanden wird.
theological_decisions:
- issue: Bedeutung von דָּבָר im Parallelismus zu „Bund“
  choice: das Wort
  alternative: die Zusage
  rationale: Der hebräische Ausdruck ist weiter als „Zusage“. Der Haupttext bewahrt deshalb die lexikalische Offenheit, während die im Bundeszusammenhang naheliegende Deutung als „Zusage“ in der Fußnote sichtbar bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Aufforderung bleibt erhalten; „geboten hat“ bewahrt bewusst die kräftige und leicht ungewohnte Verbindung des hebräischen Textes.
