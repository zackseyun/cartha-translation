source:
  edition: WLC
  text: הוֹד֤וּ לַֽ/יהוָה֙ קִרְא֣וּ בִ/שְׁמ֔/וֹ הוֹדִ֥יעוּ בָ/עַמִּ֖ים עֲלִילֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/008.yaml
  text: Give thanks to Yahweh[a]; call on his name[b]; make his deeds known among the peoples.
translation:
  language: de
  text: Dankt Jahwe; ruft seinen Namen an; macht unter den Völkern seine Taten bekannt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: Dankt
  rationale: Der Hifil-Imperativ Plural von ידה bedeutet in diesem Lobpreiskontext, Gott zu danken beziehungsweise ihn zu preisen. „Dankt“ ist im Deutschen knapp, natürlich und präzise.
- source_word: לַֽיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, sodass der im Hebräischen ausdrücklich gebrauchte Bundesname erhalten bleibt.
- source_word: קִרְא֣וּ בִשְׁמוֹ
  choice: ruft seinen Namen an
  rationale: קרא mit בְּ und „Name“ bezeichnet hier das an Gott gerichtete Anrufen. Die deutsche Wendung bewahrt sowohl den kultischen Sinn als auch den ausdrücklichen Bezug auf seinen Namen.
- source_word: הוֹדִ֥יעוּ
  choice: macht … bekannt
  rationale: 'Der Hifil-Imperativ von ידע hat kausative Bedeutung: Andere sollen etwas erfahren beziehungsweise kennenlernen. „Macht … bekannt“ gibt dies klar wieder.'
- source_word: בָעַמִּים
  choice: unter den Völkern
  rationale: עַמִּים bezeichnet verschiedene Völker oder Volksgruppen. „Unter den Völkern“ wahrt den Plural und vermeidet eine moderne, rein staatspolitische Verengung.
- source_word: עֲלִילֹתָיו
  choice: seine Taten
  rationale: עֲלִילוֹת bezeichnet vollbrachte Handlungen oder Taten. „Taten“ ist weit genug und fügt keine im Ausdruck selbst nicht ausdrücklich enthaltene Wertung wie „mächtig“ hinzu.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache mit drei parallelen Imperativen. Die knappe Satzstruktur bildet den hebräischen Aufrufcharakter nach; „unter den Völkern“ und „Taten“ bewahren die lexikalische Weite des Ausgangstextes.
