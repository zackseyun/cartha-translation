base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/038.yaml
  text: And Obed-edom and their brothers[a], sixty-eight; and Obed-edom son of Jeduthun and Hosah were gatekeepers.
translation:
  language: de
  text: Und Obed-Edom und ihre Brüder, achtundsechzig; und Obed-Edom, der Sohn Jedutuns, und Hosa waren Torwächter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עֹבֵד אֱדֹם
  choice: und Obed-Edom
  rationale: Das vorangestellte וְ führt die Aufzählung aus dem vorherigen Vers weiter; der Eigenname wird nach gängiger deutscher Form wiedergegeben.
- source_word: וַ/אֲחֵי/הֶם
  choice: und ihre Brüder
  rationale: Das Suffix der 3. Person Plural wird entsprechend dem überlieferten hebräischen Text als „ihre“ wiedergegeben, obwohl der Bezug in der knappen Liste nicht ausdrücklich genannt ist.
- source_word: שִׁשִּׁים וּ/שְׁמוֹנָה
  choice: achtundsechzig
  rationale: Die Zahl wird in natürlicher moderner deutscher Form ausgedrückt.
- source_word: בֶּן יְדִיתוּן
  choice: der Sohn Jedutuns
  rationale: Die Abstammungsangabe wird klar und idiomatisch wiedergegeben; der Genitiv bezeichnet Jedutun als Vater.
- source_word: וְ/חֹסָה
  choice: und Hosa
  rationale: Der Eigenname wird transliteriert; die Konjunktion verbindet Hosa mit Obed-Edom.
- source_word: לְ/שֹׁעֲרִים
  choice: als Torwächter
  rationale: לְ bezeichnet hier Aufgabe beziehungsweise Bestimmung; „als Torwächter“ bewahrt die elliptische Listenstruktur und ist im Deutschen verständlich.
