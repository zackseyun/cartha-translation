id: 1CH.16.1
reference: 1 Chronicles 16:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּבִ֨יאוּ֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יַּצִּ֣יגוּ אֹת֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָֽטָה ל֖/וֹ דָּוִ֑יד וַ/יַּקְרִ֛יבוּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/001.yaml
  text: So they brought in the ark of God and set it in the midst of the tent that David had pitched for it[b][a], and they offered burnt offerings and peace offerings before God.
translation:
  language: de
  text: So brachten sie die Lade Gottes hinein und stellten sie mitten in das Zelt, das David für sie aufgeschlagen hatte.[a] Dann brachten sie vor Gott Brandopfer und Heilsopfer dar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das Innere des Zeltes“. Das Hebräische kann sowohl eine Lage mitten darin als auch allgemein innerhalb des Zeltes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Gemeinschaftsopfer“, „Friedensopfer“ oder „Wohlergehensopfer“. Der hebräische Ausdruck bezeichnet eine Opferart, die mit Frieden, Wohlergehen und Gemeinschaft verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: brachten ... hinein
  rationale: Der Hifil von בוא bedeutet „bringen“ bzw. „hineinbringen“; im Zusammenhang wird die Lade in das vorbereitete Zelt gebracht.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Bewahrt die knappe hebräische Formulierung, ohne „Bundeslade“ oder eine zusätzliche Bundesformel einzutragen.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: stellten sie
  rationale: יצג bezeichnet hier das Aufstellen beziehungsweise Platzieren an einem bestimmten Ort.
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: mitten in das Zelt
  rationale: בְּתוֹךְ kann sowohl „inmitten“ als auch allgemeiner „innerhalb“ bedeuten; „mitten in“ erhält die konkrete räumliche Aussage.
- source_word: הָאֹהֶל
  choice: das Zelt
  rationale: Das gewöhnliche Wort für „Zelt“ ist gemeint; „Stiftshütte“ würde eine Identifizierung eintragen, die der Vers nicht ausdrücklich vornimmt.
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִיד
  choice: das David für sie aufgeschlagen hatte
  rationale: נטה bezeichnet bei einem Zelt dessen Aufschlagen oder Ausspannen. Das feminine Pronomen „sie“ bezieht sich im Deutschen natürlich auf „Lade“.
- source_word: וַיַּקְרִיבוּ
  choice: brachten ... dar
  rationale: Im Opferkontext bedeutet der Hifil von קרב, ein Opfer darzubringen; die deutsche Wendung ist sachlich und idiomatisch.
- source_word: עֹלוֹת
  choice: Brandopfer
  rationale: Etablierter deutscher Fachausdruck für das auf dem Altar vollständig verbrannte Opfer.
- source_word: שְׁלָמִים
  choice: Heilsopfer
  rationale: Gängige, knappe deutsche Wiedergabe des kultischen Begriffs; die mögliche Bedeutungsbreite in Richtung Gemeinschaft, Frieden oder Wohlergehen wird in einer Fußnote kenntlich gemacht.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: vor Gott
  rationale: Gibt die Wendung „vor dem Angesicht/in der Gegenwart Gottes“ knapp und transparent wieder.
theological_decisions:
- issue: Wiedergabe der Opferarten
  choice: Die spezifischen Begriffe „Brandopfer“ und „Heilsopfer“ bleiben erhalten.
  alternative: allgemein „Opfer“ beziehungsweise „Brandopfer und Gemeinschaftsopfer“
  rationale: Der Text unterscheidet konkrete Opferarten. Diese kultische Differenzierung darf nicht eingeebnet werden; zugleich erläutert eine Fußnote die Bedeutungsbreite von שְׁלָמִים.
- issue: Identifizierung des Zeltes
  choice: „Zelt“ statt „Stiftshütte“
  alternative: „Stiftshütte“
  rationale: Der hebräische Text verwendet den gewöhnlichen Ausdruck für ein Zelt und sagt, David habe es für die Lade aufgeschlagen. Eine Gleichsetzung mit der mosaischen Stiftshütte wäre hier interpretierend.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „So“ hält den Anschluss an den vorausgehenden Zusammenhang fest; „darbringen“ bewahrt die kultische Präzision. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
