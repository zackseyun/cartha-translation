source:
  edition: WLC
  text: הוֹד֤וּ לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/034.yaml
  text: Give thanks to Yahweh[a], for he is good[b]; for his steadfast love endures forever.
translation:
  language: de
  text: Dankt Jahwe[a], denn er ist gut; denn seine treue Liebe[b] bleibt für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: יהוה (JHWH), der Gottesname; traditionell oft mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „seine Bundestreue“. Das hebräische Wort חֶסֶד bezeichnet beständige Liebe, Güte und verlässliche Loyalität.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: Dankt
  rationale: Der Hifil-Imperativ Plural von ידה bedeutet in diesem liturgischen Zusammenhang, Dank und Lob auszudrücken. „Dankt“ gibt die Aufforderung knapp und idiomatisch wieder.
- source_word: לַ/יהוָה֙
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, sodass der im Hebräischen ausdrücklich verwendete Eigenname erhalten bleibt.
- source_word: כִּ֣י … כִּ֥י
  choice: denn … denn
  rationale: Beide Vorkommen von כִּי begründen die Aufforderung zum Dank. Die Wiederholung von „denn“ bewahrt Parallelismus und liturgischen Rhythmus.
- source_word: ט֔וֹב
  choice: gut
  rationale: „Gut“ gibt die umfassende moralische und wohltätige Güte Gottes schlicht und treffend wieder.
- source_word: לְ/עוֹלָ֖ם
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte Dauer. „Für immer“ ist in modernem Deutsch natürlich und bewahrt die zeitliche Aussage.
- source_word: חַסְדּֽ/וֹ
  choice: seine treue Liebe
  rationale: חֶסֶד verbindet Liebe, Güte, Loyalität und beständige Verbundenheit. „Treue Liebe“ hält diese Bedeutungsbreite besser offen als das allgemeinere „Güte“ oder das enger gefasste „Barmherzigkeit“.
- source_word: לְ/עוֹלָ֖ם חַסְדּֽ/וֹ
  choice: seine treue Liebe bleibt für immer
  rationale: Im Hebräischen steht ein verbloser Satz. Das ergänzte „bleibt“ macht die fortdauernde Beständigkeit im Deutschen natürlich verständlich, ohne den Sinn unnötig einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt diesen Eigennamecharakter, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
- issue: Wiedergabe von חֶסֶד in einer liturgischen Bundesformel
  choice: treue Liebe
  alternative: Bundestreue
  rationale: „Treue Liebe“ bewahrt sowohl die liebevolle Zuwendung als auch die verlässliche Loyalität des Begriffs. „Bundestreue“ macht den möglichen Bundesbezug deutlicher, würde den Ausdruck hier aber stärker festlegen, als es das einzelne Wort verlangt.
translation_notes:
  register: Kurze, würdige und gut verständliche liturgische Sprache. Der zweimalige Gebrauch von „denn“ erhält den hebräischen Parallelismus; „bleibt“ ergänzt das im verblosen hebräischen Satz sinngemäß vorausgesetzte Prädikat.
