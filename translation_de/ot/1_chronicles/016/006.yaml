  text: וּ/בְנָיָ֥הוּ וְ/יַחֲזִיאֵ֖ל הַ/כֹּהֲנִ֑ים בַּ/חֲצֹצְר֣וֹת תָּמִ֔יד לִ/פְנֵ֖י אֲר֥וֹן בְּרִית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/006.yaml
  text: And Benaiah and Jahaziel the priests were continually with the trumpets before the ark of the covenant of God[a].
translation:
  language: de
  text: Und die Priester Benaja und Jahasiel waren ständig mit den Trompeten vor der Bundeslade Gottes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bliesen ständig die Trompeten vor der Bundeslade Gottes“. Im Hebräischen steht hier kein ausdrückliches Verb; dies ist jedoch wahrscheinlich gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנָיָהוּ וְ/יַחֲזִיאֵל
  choice: Und … Benaja und Jahasiël
  rationale: Die Eigennamen werden nach gebräuchlicher deutscher Bibeltradition wiedergegeben; die vorangestellte Konjunktion eröffnet den Satz mit „Und“.
- source_word: הַ/כֹּהֲנִים
  choice: die Priester
  rationale: Der bestimmte Plural bezeichnet das Amt der beiden genannten Männer.
- source_word: בַּ/חֲצֹצְרוֹת
  choice: mit den Trompeten
  rationale: Das Wort bezeichnet speziell Trompeten; die Präposition wird instrumental beziehungsweise begleitend mit „mit“ wiedergegeben. Das naheliegende Blasen ist nicht ausdrücklich verbalisiert.
- source_word: תָּמִיד
  choice: ständig
  rationale: Das Adverb drückt fortdauernden beziehungsweise regelmäßigen Dienst aus, ohne dessen genaue zeitliche Ausgestaltung festzulegen.
- source_word: לִ/פְנֵי
  choice: vor
  rationale: Die knappe Wiedergabe bewahrt sowohl die räumliche als auch die kultische Bedeutung.
- source_word: אֲרוֹן בְּרִית הָ/אֱלֹהִים
  choice: der Bundeslade Gottes
  rationale: Die hebräische Konstruktverbindung wird in natürlichem, etabliertem Deutsch als „Bundeslade Gottes“ wiedergegeben.
theological_decisions:
- issue: Soll das Blasen der Trompeten ausdrücklich genannt werden?
  choice: Im Haupttext bleibt die elliptische Formulierung „waren ständig mit den Trompeten“ erhalten.
  alternative: „bliesen ständig die Trompeten“
  rationale: Im Hebräischen fehlt ein ausdrückliches Verb für „blasen“. Der Zusammenhang legt diese Tätigkeit nahe, doch die Übersetzung soll sie nicht ohne Kennzeichnung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung „die Priester Benaja und Jahasiël“ ist im Deutschen natürlicher als eine nachgestellte Amtsbezeichnung und bewahrt den Aussagegehalt. Die ungewohnte Ellipse wird wegen der hebräischen Offenheit beibehalten und durch die Fußnote erläutert.
