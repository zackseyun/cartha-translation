base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/036.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Then all the people said[b], “Amen!” and praised Yahweh.
translation:
  language: de
  text: 'Gepriesen sei Jahwe, der Gott Israels, von Ewigkeit zu Ewigkeit![a] Da sagte das ganze Volk: »Amen!«, und pries Jahwe.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „von Ewigkeit her bis in Ewigkeit“ oder „für immer und ewig“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch knapp: „Amen, und: ‚Preist Jahwe!‘“; die Form kann als liturgischer Ruf („Halleluja“) verstanden werden. Im Zusammenhang ist gemeint, dass das Volk mit Amen und Lob antwortete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Das passive Partizip steht in einer doxologischen Segensformel. „Gepriesen sei“ gibt deren feierlichen, bekenntnishaften Charakter im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet Jahwe als den Gott Israels; die Apposition mit Artikel ist im Deutschen idiomatisch.
- source_word: מִן הָעוֹלָם וְעַד הָעֹלָם
  choice: von Ewigkeit zu Ewigkeit
  rationale: Die feste doxologische Wendung bezeichnet eine zeitlich unbegrenzte Dauer, ohne eine präzisere philosophische Definition von עוֹלָם aufzuzwingen.
- source_word: וַיֹּאמְרוּ כָל הָעָם
  choice: Da sagte das ganze Volk
  rationale: Das narrative וַ־ führt die Handlung weiter. עָם bezeichnet hier das versammelte Volk; als Kollektiv verlangt „das ganze Volk“ im Deutschen den Singular.
- source_word: אָמֵן
  choice: Amen!
  rationale: Die geläufige liturgische Umschrift bewahrt den Charakter der gemeinsamen bestätigenden Antwort.
- source_word: וְהַלֵּל לַיהוָה
  choice: und pries Jahwe
  rationale: Im Zusammenhang wird die knappe hebräische Form als weitere Reaktion des Volkes verstanden. Die syntaktische Mehrdeutigkeit wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Umschrift bewahrt ihn als Eigennamen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Zeitlicher Umfang von עוֹלָם
  choice: von Ewigkeit zu Ewigkeit
  alternative: für immer und ewig
  rationale: Die gewählte Fassung erhält den gehobenen doxologischen Ton und die Aussage unbegrenzter Dauer, ohne dem hebräischen Ausdruck zusätzliche philosophische Präzision beizulegen.
- issue: Deutung von וְהַלֵּל לַיהוָה
  choice: 'Erzählende Fortsetzung: „und pries Jahwe“'
  alternative: 'Wörtlich-knappe Rede: „Amen und Lob für Jahwe“ oder Aufforderung: „Amen! Lobt Jahwe!“'
  rationale: Die hebräische Wendung ist außerordentlich knapp und lässt sich verbal, nominal oder als Teil der wiedergegebenen Antwort auffassen. Der Haupttext folgt dem Erzählzusammenhang; die Fußnote bewahrt die Alternativen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit liturgischem Klang. „Gepriesen sei“ und „von Ewigkeit zu Ewigkeit“ bewahren die Doxologie; die Satzführung bleibt für heutige Leser klar. Die Ausrufezeichen markieren den feierlichen Lobpreis und die hörbare Antwort des Volkes.
