source:
  edition: WLC
  text: וַ/יְכַ֣ל דָּוִ֔יד מֵ/הַעֲל֥וֹת הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֥רֶךְ אֶת הָ/עָ֖ם בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/002.yaml
  text: When David finished offering up the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh.
translation:
  language: de
  text: Als David damit fertig war, das Brandopfer und die Heilsopfer[a] darzubringen, segnete er das Volk im Namen Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Friedensopfer“ oder „Gemeinschaftsopfer“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל ... מֵהַעֲלוֹת
  choice: Als ... damit fertig war, ... darzubringen
  rationale: Die Verbindung von כלה mit מִן und dem Infinitiv bezeichnet den Abschluss einer Handlung. Die gewählte Form gibt zugleich den zeitlichen Anschluss an Davids anschließenden Segen natürlich wieder; „darbringen“ entspricht dem kultischen Zusammenhang.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: עֹלָה ist die übliche Bezeichnung für das vollständig auf dem Altar verbrannte Opfer; „Brandopfer“ ist im Deutschen der etablierte und verständliche Fachbegriff.
- source_word: וְהַשְּׁלָמִים
  choice: und die Heilsopfer
  rationale: שְׁלָמִים bezeichnet Opfer, die mit Heil, Wohlergehen, Frieden und Gemeinschaft verbunden sind. „Heilsopfer“ ist eine etablierte deutsche Wiedergabe, ohne die Bedeutungsbreite auf nur einen Aspekt festzulegen.
- source_word: וַיְבָרֶךְ
  choice: segnete er
  rationale: ברך bedeutet hier, über jemanden einen Segen auszusprechen; die einfache Verbform ist präzise und idiomatisch.
- source_word: אֶת־הָעָם
  choice: das Volk
  rationale: Der hebräische Text nennt schlicht „das Volk“. Ein zusätzliches „ganze“ wäre nicht ausdrücklich belegt.
- source_word: בְּשֵׁם יְהוָה
  choice: im Namen Jahwes
  rationale: בְּשֵׁם wird idiomatisch mit „im Namen“ wiedergegeben. Der Gottesname יהוה erscheint als persönlicher Name in der im Deutschen geläufigen Form „Jahwe“.
theological_decisions:
- issue: Wiedergabe der Opferbezeichnung שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer; Gemeinschaftsopfer
  rationale: Der Ausdruck umfasst Bedeutungsaspekte von Heil beziehungsweise Wohlergehen, Frieden und kultischer Gemeinschaft. „Heilsopfer“ wahrt diese Breite am besten; sachlich mögliche Alternativen werden in einer Fußnote genannt.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen; die Schreibweise entspricht deutscher Konvention.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfügung mit „Als ... fertig war“ bildet den zeitlichen Zusammenhang natürlich ab. Kultische Schlüsselbegriffe bleiben erkennbar, während die Bedeutungsbreite von שְׁלָמִים durch die Fußnote gewahrt wird.
