source:
  edition: WLC
  text: ה֤וֹד וְ/הָדָר֙ לְ/פָנָ֔י/ו עֹ֥ז וְ/חֶדְוָ֖ה בִּ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/027.yaml
  text: Splendor and majesty are before him[a]; strength and joy are in his place.
translation:
  language: de
  text: Pracht und Majestät sind vor ihm; Stärke und Freude an seinem Ort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in seiner Wohnstätte« oder »in seinem Heiligtum«. Im Hebräischen steht »an seinem Ort«, ein allgemeinerer Ausdruck als in der parallelen Formulierung in Psalm 96,6.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹד
  choice: Hoheit
  rationale: Bezeichnet glanzvolle, würdevolle Erhabenheit. „Hoheit“ bewahrt den gehobenen königlichen Ton und bildet mit „Majestät“ ein natürliches poetisches Paar.
- source_word: הָדָר
  choice: Majestät
  rationale: Bezeichnet in poetischem Zusammenhang häufig majestätische Würde und Pracht. „Majestät“ ergänzt „Hoheit“, ohne beide Begriffe gleichzusetzen.
- source_word: לְפָנָיו
  choice: vor ihm
  rationale: Gibt die räumlich-relationale Bildsprache des Hebräischen knapp und unmittelbar wieder.
- source_word: עֹז
  choice: Stärke
  rationale: Die geläufige Grundbedeutung passt zum poetischen Zusammenhang und bleibt gegenüber „Macht“ oder „Kraft“ semantisch offen.
- source_word: חֶדְוָה
  choice: Freude
  rationale: Eine klare, heutige Wiedergabe für Freude beziehungsweise Fröhlichkeit; sie entspricht dem poetischen Gleichgewicht mit „Stärke“.
- source_word: בִּמְקֹמוֹ
  choice: an seinem Ort
  rationale: Bewahrt den breiten Ausdruck מָקוֹם („Ort“) und vermeidet es, ihn im Haupttext vorschnell als Heiligtum oder Wohnstätte zu bestimmen.
theological_decisions:
- issue: Ob מְקוֹמוֹ ausdrücklich als Heiligtum beziehungsweise Wohnstätte Gottes zu verstehen ist
  choice: Der breitere Ausdruck „an seinem Ort“ bleibt im Haupttext erhalten.
  alternative: „in seiner Wohnstätte“ oder „in seinem Heiligtum“
  rationale: Der liturgische Zusammenhang und Psalm 96,6 legen eine kultische Deutung nahe; der Chroniktext verwendet jedoch das allgemeinere מָקוֹם. Die Übersetzung harmonisiert diese Abweichung nicht, sondern nennt die engeren Deutungen in der Fußnote.
translation_notes:
  register: Gehobene, aber gut verständliche poetische Standardsprache. Die Parallelstruktur der beiden Nominalaussagen bleibt erhalten; „an seinem Ort“ klingt im Deutschen leicht markiert, bewahrt jedoch bewusst die Breite des hebräischen Ausdrucks.
