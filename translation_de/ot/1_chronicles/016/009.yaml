base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/009.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous deeds.
translation:
  language: de
  text: Singt ihm, spielt zu seinem Lob; erzählt von all seinen Wundertaten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sprecht von all seinen Wundertaten“ beziehungsweise „Sinnt über all seine Wundertaten nach.“ Das hebräische Verb kann sowohl Reden und Erzählen als auch Nachsinnen bezeichnen; der öffentliche Aufruf spricht hier eher für eine mündliche Bedeutung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Singt
  rationale: Der pluralische Imperativ von שׁיר wird direkt und natürlich mit „Singt“ wiedergegeben.
- source_word: לֹו
  choice: ihm
  rationale: 'Die Präposition ל mit Suffix bezeichnet hier den Adressaten: Der Gesang gilt Gott.'
- source_word: זַמְּרוּ
  choice: spielt ihm zum Lob
  rationale: זמר im Piel kann sowohl das Musizieren als auch den Lobgesang bezeichnen. Die Formulierung unterscheidet den Ausdruck vom vorausgehenden „Singt“ und bewahrt zugleich seinen gottesdienstlichen Sinn.
- source_word: שִׂיחוּ
  choice: erzählt von
  rationale: שׂיח kann Reden, Erzählen oder Nachsinnen bedeuten. Im Zusammenhang des öffentlichen Aufrufs liegt eine nach außen gerichtete, mündliche Bedeutung nahe.
- source_word: בְּכָל
  choice: von all
  rationale: Nach „erzählt“ entspricht „von“ natürlichem Deutsch; „all“ bewahrt die umfassende Bedeutung von כָּל.
- source_word: נִפְלְאֹתָיו
  choice: seinen Wundertaten
  rationale: Das Wort bezeichnet Staunen erregende, außergewöhnliche Taten, hier Gottes machtvolle Werke. „Wundertaten“ ist prägnant, würdig und im modernen Deutsch verständlich.
theological_decisions:
- issue: Bedeutung von שִׂיחוּ
  choice: erzählt von
  alternative: sinnt nach über / sprecht von
  rationale: Der hebräische Ausdruck lässt sowohl gesprochenes Erzählen als auch inneres Nachsinnen zu. Der öffentliche Aufforderungszusammenhang begünstigt den mündlichen Sinn, ohne die lexikalische Mehrdeutigkeit zu leugnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. „Spielt ihm zum Lob“ vermeidet die unmittelbare Wiederholung von „Singt“, ohne den möglichen musikalischen und lobpreisenden Sinn von זמר einseitig festzulegen.
