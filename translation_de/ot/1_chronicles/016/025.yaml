  yaml_path: translation/ot/1_chronicles/016/025.yaml
  text: For Yahweh is great and greatly to be praised[a], and he is to be feared above all gods.
translation:
  language: de
  text: Denn Jahwe ist groß und überaus zu loben; er ist mehr zu fürchten als alle Götter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „furchtgebietend über allen Göttern“. Das hebräische Wort bezeichnet jemanden, der Furcht und Ehrfurcht hervorruft.'
    reason: lexikalische Alternative und syntaktische Mehrdeutigkeit
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Aufruf zur Anbetung ein und bewahrt den erklärenden Zusammenhang.
- source_word: גָדוֹל
  choice: groß
  rationale: Gibt die Größe und Erhabenheit Jahwes direkt und in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: מְהֻלָּל מְאֹד
  choice: überaus zu loben
  rationale: Bewahrt den passivischen, auffordernden Sinn des Partizips und die starke Intensivierung durch מְאֹד.
- source_word: נוֹרָא
  choice: zu fürchten
  rationale: Bewahrt den Gedanken ehrfürchtigen Erschreckens und heiliger Scheu; das heute oft abgeschwächte „beeindruckend“ wäre zu schwach, „furchterregend“ könnte bloßen Schrecken nahelegen.
- source_word: עַל כָּל אֱלֹהִים
  choice: mehr als alle Götter
  rationale: Gibt den hier vergleichenden Sinn von עַל knapp und verständlich wieder; אֱלֹהִים bezeichnet in diesem Zusammenhang die Götter der Völker.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen; die Transliteration bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von נוֹרָא in Bezug auf Gott
  choice: zu fürchten
  alternative: furchtgebietend / Ehrfurcht gebietend
  rationale: Die Form bezeichnet jemanden, der Furcht und Ehrfurcht hervorruft. „Zu fürchten“ erhält das theologische Gewicht, ohne den Ausdruck auf bloßen Schrecken zu verengen.
- issue: Vergleich mit „allen Göttern“
  choice: mehr als alle Götter
  alternative: über allen Göttern
  rationale: Der Vergleich wird ausdrücklich bewahrt, ohne die Existenz oder den ontologischen Rang dieser Götter näher zu bestimmen; der folgende Kontext entfaltet die polemische Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt den Vergleich mit allen Göttern hervor; „überaus“ wahrt die starke Intensivierung, ohne altertümlich zu wirken.
