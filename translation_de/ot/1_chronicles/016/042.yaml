  text: וְ/עִמָּ/הֶם֩ הֵימָ֨ן וִֽ/ידוּת֜וּן חֲצֹצְר֤וֹת וּ/מְצִלְתַּ֨יִם֙ לְ/מַשְׁמִיעִ֔ים וּ/כְלֵ֖י שִׁ֣יר הָ/אֱלֹהִ֑ים וּ/בְנֵ֥י יְדוּת֖וּן לַ/שָּֽׁעַר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/042.yaml
  text: And with them were Heman and Jeduthun with trumpets and cymbals for sounding aloud[a], and instruments for the songs of God; and the sons of Jeduthun were at the gate.
translation:
  language: de
  text: Und bei ihnen waren Heman und Jedutun mit Trompeten und Zimbeln, um sie erklingen zu lassen, sowie mit Instrumenten für die Lieder Gottes; die Söhne Jedutuns waren am Tor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „waren für das Tor eingeteilt“ beziehungsweise „waren Torwächter“. Wörtlich steht im Hebräischen „zum/für das Tor“, was einen zugewiesenen Tordienst bezeichnen kann.'
    reason: Die knappe hebräische Wendung kann sowohl den Ort als auch eine dienstliche Zuweisung bezeichnen.
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Und bei ihnen waren
  rationale: Die Präpositionalphrase bezeichnet die anwesenden Begleiter; das im Hebräischen unausgesprochene Verb wird für einen vollständigen, natürlichen deutschen Satz ergänzt.
- source_word: הֵימָן וִידוּתוּן
  choice: Heman und Jedutun
  rationale: Die Personennamen werden in ihrer im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: חֲצֹצְרוֹת וּמְצִלְתַּיִם
  choice: Trompeten und Zimbeln
  rationale: Dies sind die geläufigen deutschen Bezeichnungen für die kultischen Metalltrompeten und Schlaginstrumente.
- source_word: לְמַשְׁמִיעִים
  choice: um sie laut erklingen zu lassen
  rationale: Die Hifil-Form von שמע bedeutet wörtlich, etwas hörbar zu machen. Die Wiedergabe bezieht die Wendung natürlich auf den öffentlichen, lauten Einsatz der Trompeten und Zimbeln, ohne eine Melodie vorauszusetzen.
- source_word: וּכְלֵי שִׁיר הָאֱלֹהִים
  choice: sowie mit Instrumenten für die Lieder Gottes
  rationale: Die Formulierung bewahrt die Beziehung zwischen den Instrumenten, den Liedern und Gott, statt sie zum allgemeinen Ausdruck „Musikinstrumente“ zu verflachen.
- source_word: וּבְנֵי יְדוּתוּן
  choice: die Söhne Jedutuns aber
  rationale: „Söhne“ gibt die genealogische und levitische Bezeichnung geschlechtsgenau wieder; „aber“ gliedert den knappen hebräischen Anschluss im Deutschen.
- source_word: לַשָּׁעַר
  choice: waren am Tor
  rationale: Die hebräische Wendung lautet knapp „zum/für das Tor“. „Am Tor“ wahrt diese Offenheit, während eine ausdrückliche Amtsbezeichnung bereits deutender wäre.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der hebräischen Aufzählung, wird aber durch „sowie“ und „aber“ übersichtlich gegliedert. Die mögliche Amtsfunktion der Söhne Jedutuns wird nicht stillschweigend in den Haupttext eingetragen, sondern in der Fußnote ausgewiesen.
