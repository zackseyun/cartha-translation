base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/039.yaml
  text: And Zadok the priest and his fellow priests were before the tabernacle of Yahweh at the high place that was in Gibeon,[a]
translation:
  language: de
  text: Zadok, den Priester, und seine Brüder, die Priester, ließ er vor der Stiftshütte Yahwehs auf der Kulthöhe zurück, die in Gibeon lag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Verb „ließ er zurück“ ist aus dem vorherigen Vers ergänzt; wörtlich beginnt der Vers: „und Zadok, den Priester, und seine Brüder, die Priester …“'
    reason: syntaktischer Kontext und im Hebräischen elliptische Fortführung
lexical_decisions:
- source_word: וְאֵת
  choice: und … ließ er zurück
  rationale: וְ verbindet den Satz mit dem vorherigen Vers; אֵת markiert das direkte Objekt. Das im Hebräischen aus dem Kontext fortwirkende Verb wird für einen selbstständig verständlichen deutschen Satz ergänzt.
- source_word: צָדוֹק הַכֹּהֵן
  choice: Zadok, den Priester
  rationale: Der Name wird nach üblicher deutscher Form wiedergegeben; der bestimmte Amtstitel steht als Apposition zum direkten Objekt.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: und seine Brüder, die Priester
  rationale: Die Wiedergabe bewahrt das konkrete אֶחָיו („seine Brüder“) und die erklärende Apposition, ohne eine bloß biologische Verwandtschaft festzulegen.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier die räumliche Stellung vor beziehungsweise im Dienstbereich des Heiligtums.
- source_word: מִשְׁכַּן יְהוָה
  choice: der Wohnstätte Yahwehs
  rationale: מִשְׁכָּן bezeichnet Gottes Wohnstätte beziehungsweise das transportable Heiligtum; „Wohnstätte“ erhält die Wortbedeutung und klingt würdig und verständlich.
- source_word: בַּבָּמָה
  choice: auf der Kulthöhe
  rationale: בָּמָה ist eine erhöhte Kultstätte. „Kulthöhe“ gibt den kultischen Sinn wieder, ohne den an diesem Ort legitimen Gottesdienst abzuwerten.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: in Gibeon
  rationale: Der Relativsatz bestimmt die Lage der Kulthöhe. Im Deutschen kann dies knapp und natürlich als Ortsangabe wiedergegeben werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der im Ausgangstext ausdrücklich stehende Eigenname wird als Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bedeutung von אֶחָיו im priesterlichen Zusammenhang
  choice: seine Brüder, die Priester
  alternative: seine Priesterkollegen; seine Mitpriester
  rationale: „Brüder“ bewahrt die Ausdrucksweise und mögliche soziale beziehungsweise verwandtschaftliche Nuance des Hebräischen. Die Apposition macht deutlich, dass die Gruppe als Priester bezeichnet wird.
- issue: Im Vers nur implizit fortgeführtes Prädikat
  choice: ließ er … zurück
  alternative: Und Zadok … waren vor der Wohnstätte
  rationale: Die hebräische Konstruktion hängt syntaktisch am vorherigen Vers und führt dessen Handlung fort. Das ergänzte Prädikat macht diesen Zusammenhang in einem einzeln zitierten deutschen Vers verständlich, ohne die Personen in Subjekte eines im Hebräischen fehlenden Satzes umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wohnstätte“ und „Kulthöhe“ sind präzise, verständliche kultische Begriffe. Der Satz wird wegen der versübergreifenden hebräischen Syntax mit einem transparent gekennzeichneten Prädikat vervollständigt.
