id: 1CH.16.24
reference: 1 Chronicles 16:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: סַפְּר֤וּ בַ/גּוֹיִם֙ אֶת כְּבוֹד֔/וֹ בְּ/כָל הָ/עַמִּ֖ים נִפְלְאֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/024.yaml
  text: Declare his glory among the nations, his wondrous deeds among all the peoples.
translation:
  language: de
  text: Verkündet unter den Nationen seine Herrlichkeit, unter allen Völkern seine Wundertaten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַפְּרוּ
  choice: Verkündet
  rationale: Der Pluralimperativ von ספר fordert dazu auf, öffentlich von etwas zu erzählen beziehungsweise es bekannt zu machen. „Verkündet“ gibt diesen feierlichen, öffentlichen Aufruf im Deutschen natürlich wieder.
- source_word: בַגּוֹיִם
  choice: unter den Nationen
  rationale: גּוֹיִם bezeichnet hier allgemein die Nationen beziehungsweise Völker. „Unter“ entspricht der Präposition ב und bewahrt den weltweiten Horizont der Aufforderung.
- source_word: כְּבוֹדוֹ
  choice: seine Herrlichkeit
  rationale: כָּבוֹד umfasst Gottes Ehre, Hoheit und strahlende Gegenwart. „Herrlichkeit“ ist im biblischen Deutsch verständlich und bewahrt die theologische Bedeutungsfülle.
- source_word: בְּכָל־הָעַמִּים
  choice: unter allen Völkern
  rationale: עַמִּים wird mit „Völkern“ wiedergegeben, sodass die begriffliche Abstufung gegenüber גּוֹיִם („Nationen“) im poetischen Parallelismus erhalten bleibt.
- source_word: נִפְלְאֹתָיו
  choice: seine Wundertaten
  rationale: Das Wort bezeichnet außergewöhnliche Taten, die Staunen hervorrufen. „Wundertaten“ bringt sowohl ihren wunderbaren Charakter als auch den konkreten Handlungsbezug knapp zum Ausdruck.
theological_decisions:
- issue: Bezug der pronominalen Suffixe („seine“)
  choice: Die Pronomen beziehen sich im unmittelbaren Zusammenhang auf den Gott Israels, dessen Herrlichkeit und Wundertaten weltweit verkündet werden sollen.
  alternative: Den Gottesnamen im Vers ausdrücklich einzusetzen.
  rationale: Der hebräische Text verwendet Pronomen und lässt deren Bezug aus dem Kontext hervorgehen. Die Übersetzung bewahrt diese Ausdrucksweise, ohne zusätzliche dogmatische Erläuterung in den Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Parallelismus. „Nationen“ und „Völker“ bilden die zwei unterschiedlichen hebräischen Begriffe ab; die wiederholte Präposition wird jeweils mit „unter“ wiedergegeben.
