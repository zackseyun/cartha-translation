lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Natürliche deutsche Wiedergabe der temporalen Präpositionalverbindung.
- source_word: אָז
  choice: damals
  rationale: Markiert den Zeitpunkt beziehungsweise den Fortgang der Erzählung; „damals“ lässt sich im Deutschen natürlich mit der einleitenden Zeitangabe verbinden.
- source_word: נָתַן
  choice: beauftragte
  rationale: Das wörtliche „gab“ bezeichnet hier im Zusammenhang mit einer liturgischen Aufgabe idiomatisch die Übertragung eines Auftrags.
- source_word: בָּרֹאשׁ
  choice: zum ersten Mal
  rationale: Die schwierige adverbiale Wendung kann den erstmaligen Beginn der hier beschriebenen Ordnung bezeichnen; andere mögliche Nuancen werden in der Fußnote erhalten.
- source_word: לְהֹדוֹת
  choice: zu danken
  rationale: Das Hifil von ידה bezeichnet im liturgischen Zusammenhang Dank beziehungsweise Lob; „danken“ ist hier prägnant und idiomatisch.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen יהוה als Eigennamen wieder.
- source_word: בְּיַד
  choice: beauftragte … Asaf und seine Brüder
  rationale: Die Wendung bedeutet wörtlich „durch die Hand von“ und kennzeichnet Trägerschaft oder Ausführung; im Deutschen wird sie idiomatisch in die Beauftragung einbezogen.
- source_word: אָסָף וְאֶחָיו
  choice: Asaf und seine Brüder
  rationale: Direkte Wiedergabe; gemeint sind in diesem Zusammenhang vermutlich seine levitischen Amtsbrüder beziehungsweise Gefährten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לְהֹדוֹת im Gottesdienst
  choice: zu danken
  alternative: zu loben
  rationale: Das Verb kann Dank und Lob umfassen. „Danken“ entspricht der üblichen Grundbedeutung in diesem liturgischen Zusammenhang, ohne die weitere Bedeutungsnähe zu leugnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwer deutbare Wendung בָּרֹאשׁ wird im Haupttext flüssig wiedergegeben; ihre echte Mehrdeutigkeit bleibt in der Fußnote sichtbar.
