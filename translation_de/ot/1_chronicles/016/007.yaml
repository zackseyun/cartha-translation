  text: On that day then David first appointed Asaph and his brothers to give thanks to Yahweh[a].
translation:
  language: de
  text: An jenem Tag übertrug David nun erstmals Asaf und seinen Brüdern die Aufgabe, Jahwe zu danken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „An jenem Tag übertrug David Asaf und seinen Brüdern als Ersten oder in führender Stellung die Aufgabe, Jahwe zu danken.“ Die hebräische Wendung kann zeitlichen Vorrang, eine leitende Stellung oder die erstmalige Einrichtung dieses Dienstes hervorheben.'
