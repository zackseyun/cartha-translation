source:
  edition: WLC
  text: וְ/עִמָּ/הֶם֙ הֵימָ֣ן וִֽ/ידוּת֔וּן וּ/שְׁאָר֙ הַ/בְּרוּרִ֔ים אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמ֑וֹת לְ/הֹדוֹת֙ לַֽ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/041.yaml
  text: And with them were Heman and Jeduthun and the rest of those chosen, who were designated by name to give thanks to Yahweh, for his steadfast love endures forever.
translation:
  language: de
  text: 'Mit ihnen waren Heman und Jedutun sowie die übrigen Ausgewählten, die namentlich bestimmt worden waren,[a] um Jahwe zu danken: »Denn seine beständige Liebe währt ewig.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die einzeln beim Namen genannt worden waren«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Denn seine beständige Liebe ist für ewig.« Dies ist ein wiederkehrender liturgischer Kehrvers.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Bei ihnen waren
  rationale: Die Präpositionalphrase nennt weitere Personen, die bei den zuvor erwähnten Beauftragten waren; das im Hebräischen fehlende Verb wird im Deutschen natürlich ergänzt.
- source_word: הֵימָן וִידוּתוּן
  choice: Heman und Jedutun
  rationale: Die Eigennamen werden nach gebräuchlicher deutscher Bibeltradition transliteriert.
- source_word: וּשְׁאָר הַבְּרוּרִים
  choice: sowie die übrigen Ausgewählten
  rationale: שְׁאָר bezeichnet den Rest bzw. die Übrigen; הַבְּרוּרִים ist ein passives Partizip und bezeichnet die Ausgewählten, ohne dass ausdrücklich »Männer« ergänzt werden muss.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: die namentlich bestimmt worden waren
  rationale: Der Nifal von נקב in Verbindung mit »Namen« bezeichnet die ausdrückliche Benennung oder Bestimmung einzelner Personen.
- source_word: לְהֹדוֹת
  choice: um … zu danken
  rationale: ידה im Hifil bedeutet in diesem liturgischen Zusammenhang vor allem danken beziehungsweise lobpreisend danken.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext stehende Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: Denn seine beständige Liebe währt ewig
  rationale: כִּי leitet hier den Inhalt beziehungsweise Grund des Dankes ein. חֶסֶד bezeichnet verlässliche, treue Zuwendung; »beständige Liebe« bewahrt diesen Sinn, während »währt ewig« die nominale hebräische Formulierung idiomatisch wiedergibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird sichtbar als Name wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von חֶסֶד
  choice: beständige Liebe
  alternative: Gnade; Güte; Bundestreue
  rationale: Der Ausdruck verbindet Liebe, Güte, Loyalität und Verlässlichkeit. »Beständige Liebe« hält diese Breite offen, ohne den Begriff ausschließlich auf eine bestimmte dogmatische Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am Hebräischen, wird aber durch »Bei ihnen waren« und den Zwecksatz natürlich lesbar. Der abschließende Kehrvers wird als direkt zitierte liturgische Formel kenntlich gemacht.
