  yaml_path: translation/ot/1_chronicles/016/020.yaml
  text: And they wandered from nation to nation[a], and from one kingdom to another people.
translation:
  language: de
  text: Und sie zogen von Nation zu Nation und von einem Königreich zu einem anderen Volk.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: sie zogen
  rationale: Der Hitpael von הלך bezeichnet hier ein fortgesetztes Umherziehen beziehungsweise den wiederholten Ortswechsel. Im Zusammenhang mit den beiden Von-zu-Angaben gibt „sie zogen“ dies natürlich und würdig wieder, ohne eine Ziellosigkeit zu behaupten.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: von Nation zu Nation
  rationale: גּוֹי bedeutet hier „Nation“. Die Wiederholung der hebräischen Konstruktion bleibt erhalten und klingt im Deutschen idiomatisch.
- source_word: וּמִמַּמְלָכָה
  choice: und von einem Königreich
  rationale: מַמְלָכָה heißt „Königreich“. Der unbestimmte Artikel macht die distributive Parallelkonstruktion im Deutschen verständlich, ohne dem Ausdruck eine bestimmte Herrschaft zuzuweisen.
- source_word: אֶל עַם אַחֵר
  choice: zu einem anderen Volk
  rationale: עַם wird als „Volk“ und אַחֵר als „anderes“ wiedergegeben. So bleibt die lexikalische Unterscheidung gegenüber גּוֹי („Nation“) gewahrt.
