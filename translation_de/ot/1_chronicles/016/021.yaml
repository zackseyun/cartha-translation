  variant: modern standard German
source:
  edition: WLC
  text: לֹא הִנִּ֤יחַ לְ/אִישׁ֙ לְ/עָשְׁקָ֔/ם וַ/יּ֥וֹכַח עֲלֵי/הֶ֖ם מְלָכִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/021.yaml
  text: He allowed no man to oppress them[a], and he rebuked kings on their account,
translation:
  language: de
  text: Er ließ nicht zu, dass jemand sie unterdrückte, und wies Könige ihretwegen zurecht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנִּיחַ
  choice: ließ nicht zu
  rationale: Im Hifil mit לֹא und folgendem Infinitiv bedeutet das Verb hier „nicht erlauben/zulassen“. Die Formulierung ist im modernen Deutschen natürlich und gibt Gottes verhinderndes Handeln wieder.
- source_word: אִישׁ
  choice: jemand
  rationale: Das maskuline Singularwort wird hier generisch gebraucht. Nach der deutschen Verneinung ist „jemand“ idiomatischer als „ein Mann“, ohne den Sinn einzuschränken.
- source_word: לְעָשְׁקָם
  choice: dass jemand sie unterdrückte
  rationale: עשׁק bezeichnet Unterdrückung, Ausbeutung oder widerrechtliche Bedrängung. „Unterdrücken“ bewahrt den umfassenden Sinn und fügt sich natürlich in die deutsche Satzkonstruktion ein.
- source_word: וַיּוֹכַח
  choice: wies ... zurecht
  rationale: יכח bezeichnet hier ein tadelndes oder zurechtweisendes Eingreifen. „Zurechtweisen“ ist klar, würdig und gegenüber Königen angemessen kräftig.
- source_word: עֲלֵיהֶם
  choice: ihretwegen
  rationale: עַל mit Suffix bezeichnet hier den Anlass beziehungsweise den Bezug von Gottes Eingreifen. „Ihretwegen“ lässt offen, ob stärker „um ihretwillen“ oder „wegen ihnen“ gemeint ist.
- source_word: מְלָכִים
  choice: Könige
  rationale: Das Substantiv bedeutet unmittelbar „Könige“; eine Verallgemeinerung zu „Herrschern“ ist nicht erforderlich.
theological_decisions:
- issue: Unausgesprochenes Subjekt der Verben
  choice: „Er“ als Rückverweis auf Gott
  alternative: Ein unbestimmtes, nicht ausdrücklich genanntes Subjekt
  rationale: Der Zusammenhang führt Gottes schützendes Handeln fort. Da ein ausdrückliches Subjekt im Deutschen nötig ist, wird „Er“ ergänzt, ohne den Kontext theologisch auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur bleibt erhalten; „jemand“ gibt den generischen Gebrauch von אִישׁ idiomatisch wieder. Die mögliche Bedeutungsbreite von עֲלֵיהֶם wird durch „ihretwegen“ im Haupttext bewahrt, sodass keine Fußnote erforderlich ist.
