id: 1CH.16.30
reference: 1 Chronicles 16:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חִ֤ילוּ מִ/לְּ/פָנָי/ו֙ כָּל הָ/אָ֔רֶץ אַף תִּכּ֥וֹן תֵּבֵ֖ל בַּל תִּמּֽוֹט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/030.yaml
  text: Tremble before him[a], all the earth; indeed, the world is established; it shall not be moved.
translation:
  language: de
  text: Bebt vor ihm, die ganze Erde! Ja, die Welt steht fest; sie wird nicht wanken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie wird nicht schwanken“ oder „nicht erschüttert werden.“ Das hebräische Bild bezeichnet festen Bestand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִילוּ
  choice: Bebt
  rationale: Der Qal-Imperativ von חול kann körperliches Zittern oder Beben bezeichnen und drückt hier angesichts der göttlichen Gegenwart ehrfürchtiges Erschauern aus. „Bebt“ ist knapp, natürlich und erhält die Bildhaftigkeit.
- source_word: מִלְּפָנָיו
  choice: vor ihm
  rationale: Die Wendung bedeutet wörtlich „von seinem Angesicht/seiner Gegenwart her“; im Deutschen gibt „vor ihm“ die Stellung angesichts seiner Gegenwart idiomatisch wieder.
- source_word: כָּל הָאָרֶץ
  choice: die ganze Erde
  rationale: Im Zusammenhang des universalen Gotteslobs bezeichnet אֶרֶץ die gesamte Erde und nicht ein einzelnes Land.
- source_word: אַף
  choice: Ja
  rationale: Die Partikel verstärkt hier die folgende Aussage. „Ja“ gibt diesen bekräftigenden Übergang in natürlichem Deutsch wieder.
- source_word: תִּכּוֹן
  choice: steht fest
  rationale: Das Nifal von כון bezeichnet einen gefestigten, sicher gegründeten Zustand. „Steht fest“ ist im Deutschen anschaulich und vermeidet eine unnötig abstrakte Passivform.
- source_word: תֵּבֵל
  choice: die Welt
  rationale: תֵּבֵל bezeichnet häufig die geordnete, bewohnte Welt. „Die Welt“ ist die geläufige und knappe deutsche Entsprechung.
- source_word: בַּל
  choice: nicht
  rationale: Die poetische Negationspartikel wird hier schlicht und sachgemäß mit „nicht“ wiedergegeben.
- source_word: תִּמּוֹט
  choice: sie wird nicht wanken
  rationale: Das Nifal von מוט beschreibt Wanken, Schwanken oder Erschüttertwerden. „Nicht wanken“ bewahrt das hebräische Bild fester Stabilität und vermeidet die mögliche Fehlauffassung absoluter Bewegungslosigkeit.
theological_decisions:
- issue: Kosmische Stabilität
  choice: Die Welt „steht fest“ und „wird nicht wanken“ als Aussage über die von Gott gewährte Beständigkeit der Schöpfungsordnung.
  alternative: „Sie wird nicht bewegt werden“ könnte die Form wörtlicher nachbilden, jedoch als Aussage absoluter räumlicher Bewegungslosigkeit missverstanden werden.
  rationale: Die hebräische Poesie betont Sicherheit und festen Bestand unter Gottes Herrschaft, ohne eine naturwissenschaftliche Aussage über Bewegung oder Unbeweglichkeit zu formulieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Knappheit. Der Imperativ „Bebt“ bewahrt die eindringliche Anrede; „steht fest“ und „wird nicht wanken“ geben den Parallelismus und das Stabilitätsbild natürlich wieder.
