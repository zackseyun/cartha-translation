  text: יִרְעַ֤ם הַ/יָּם֙ וּ/מְלוֹא֔/וֹ יַעֲלֹ֥ץ הַ/שָּׂדֶ֖ה וְ/כָל אֲשֶׁר בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/032.yaml
  text: Let the sea thunder[a], and all that fills it; let the field exult[b], and all that is in it.
translation:
  language: de
  text: Das Meer soll brausen[a] und alles, was es erfüllt; das Feld soll jubeln und alles, was darauf ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Meer soll tosen.“ Das hebräische Verb kann ein lautes Dröhnen, Brausen oder Tosen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעַם
  choice: soll donnern
  rationale: Das Verb רעם bezeichnet ein lautes Dröhnen oder Tosen. „Donnern“ bewahrt das kraftvolle, beinahe sturmartige Klangbild und lässt das Meer als handelndes Subjekt hervortreten.
- source_word: הַיָּם
  choice: das Meer
  rationale: „Meer“ ist die übliche und kontextuell passende Wiedergabe von יָם.
- source_word: וּמְלוֹאוֹ
  choice: und alles, was es erfüllt
  rationale: מְלוֹא bezeichnet die Fülle beziehungsweise das, was etwas erfüllt. Die Relativkonstruktion gibt das Bild im heutigen Deutsch verständlich wieder, ohne es auf bloßes „Darinsein“ zu verengen.
- source_word: יַעֲלֹץ
  choice: soll jubeln
  rationale: עלץ drückt lebhafte, triumphierende Freude aus. „Jubeln“ ist im Deutschen natürlich, poetisch kraftvoll und allgemein verständlich.
- source_word: הַשָּׂדֶה
  choice: das Feld
  rationale: „Feld“ ist die direkte Wiedergabe von שׂדה und erhält den poetischen Parallelismus mit dem Meer.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: und alles, was darauf ist
  rationale: Das Suffix bezieht sich auf das Feld. Bei einer Fläche ist „darauf“ im Deutschen natürlicher als „darin“ und wahrt dennoch die umfassende Aussage des Hebräischen.
theological_decisions: []
translation_notes:
  register: Poetisch-erhabene, zugleich verständliche Standardsprache. Die beiden Aufforderungssätze und der Parallelismus zwischen Meer und Feld bleiben erhalten. Die personifizierende Bildsprache wird nicht abgeschwächt.
