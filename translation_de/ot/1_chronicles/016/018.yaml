  text: לֵ/אמֹ֗ר לְ/ךָ֙ אֶתֵּ֣ן אֶֽרֶץ כְּנָ֔עַן חֶ֖בֶל נַחֲלַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/018.yaml
  text: saying[a], “To you I will give the land of Canaan[b], the portion of your inheritance.”
translation:
  language: de
  text: 'indem er sagte[a]: »Dir will ich das Land Kanaan geben, den Anteil eures Erbes[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen folgt auf die einleitende Wendung zunächst die Einzahl (»dir«), später jedoch die Mehrzahl (»eures Erbes«). Wahrscheinlich geht der Blick vom angesprochenen Stammvater zu seinen Nachkommen als Erben der Bundeszusage über.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Zuteilung eures Erbes«. Das hebräische Wort bezeichnet wörtlich eine Schnur beziehungsweise Messlinie und davon abgeleitet einen vermessenen oder zugeteilten Landanteil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: indem er sagte
  rationale: Der Infinitivus constructus von אמר führt den Inhalt der im vorherigen Vers genannten Bundeszusage ein. Die finite deutsche Wendung bindet den Vers natürlich an seinen Kontext an.
- source_word: לְךָ
  choice: dir
  rationale: Die Präposition mit Suffix der 2. Person maskulin Singular bezeichnet den Empfänger der Verheißung und bewahrt die Einzahl des Hebräischen.
- source_word: אֶתֵּן
  choice: will ich geben
  rationale: Das Qal-Imperfekt der 1. Person Singular hat im Kontext einer Zusage futurisch-promissorische Bedeutung.
- source_word: אֶרֶץ כְּנָעַן
  choice: das Land Kanaan
  rationale: Die Wiedergabe erhält den konkreten territorialen Bezug und entspricht natürlichem modernem Deutsch.
- source_word: חֶבֶל
  choice: Anteil
  rationale: Das Wort bezeichnet ursprünglich eine Messschnur und davon abgeleitet einen vermessenen beziehungsweise zugeteilten Landanteil.
- source_word: נַחֲלַתְכֶם
  choice: eures Erbes
  rationale: נחלה bezeichnet hier den erblich zugesprochenen Besitz; das Suffix der 2. Person Plural wird ausdrücklich als »eures« bewahrt.
theological_decisions:
- issue: Wechsel vom singularischen Adressaten zum pluralischen Possessivsuffix
  choice: »Dir … eures Erbes«
  alternative: »Dir … deines Erbes« oder erläuternd »dir und deinen Nachkommen«
  rationale: Der hebräische Text stellt לְךָ in der Einzahl und נַחֲלַתְכֶם in der Mehrzahl unmittelbar nebeneinander. Die Übersetzung bewahrt diesen auffälligen Wechsel, statt die Beziehung zwischen dem angesprochenen Stammvater und den Erben der Verheißung harmonisierend auszudeuten.
- issue: Verhältnis von »Land Kanaan« und חֶבֶל נַחֲלַתְכֶם
  choice: 'Apposition: »das Land Kanaan, den Anteil eures Erbes«'
  alternative: »das Land Kanaan als Anteil eures Erbes«
  rationale: Im Hebräischen steht keine ausdrückliche Vergleichs- oder Zuordnungspräposition. Die Apposition gibt die knappe Struktur wieder, ohne eine zusätzliche Relation einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Numerusverschiebung wird bewusst nicht geglättet. »Anteil« erhält die Landzuteilungsmetaphorik, ohne im Deutschen unnötig technisch zu klingen.
