  text: הִֽתְהַֽלְלוּ֙ בְּ/שֵׁ֣ם קָדְשׁ֔/וֹ יִשְׂמַ֕ח לֵ֖ב מְבַקְשֵׁ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/010.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: de
  text: Rühmt euch seines heiligen Namens! Die Herzen derer, die Jahwe[a] suchen, sollen sich freuen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH, der Gottesname; traditionell wird er mit „der HERR“ wiedergegeben.'
    reason: Erläutert die Wiedergabe des Tetragramms im Haupttext und nennt die traditionelle Ersatzwiedergabe, ohne fälschlich „Jahwe“ als Alternative zur bereits verwendeten Form zu bezeichnen.
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: Rühmt euch
  rationale: Der Hitpael-Imperativ Plural von הלל bezeichnet hier ein freudiges Sich-Rühmen oder Frohlocken. „Rühmt euch“ bewahrt sowohl die reflexive Form als auch den Aufforderungscharakter.
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: seines heiligen Namens
  rationale: Die Verbindung mit בְּ bezeichnet den Bezug oder Grund des Rühmens. Im Deutschen ist der Genitiv nach „sich rühmen“ eine natürliche, gehobene und genaue Wiedergabe; קָדְשׁוֹ wird idiomatisch mit „seines heiligen“ übersetzt.
- source_word: יִשְׂמַח
  choice: freue sich
  rationale: Das morphologische Imperfekt hat im poetisch-auffordernden Zusammenhang jussivischen Sinn. Der deutsche Konjunktiv „freue sich“ gibt diesen Wunsch beziehungsweise Aufruf angemessen wieder.
- source_word: לֵב
  choice: Das Herz
  rationale: Der hebräische Singular wird als kollektive Bezeichnung für das innere Wesen der Suchenden bewahrt. „Das Herz derer“ ist im Deutschen verständlich und erhält die Bildsprache des Ausgangstextes.
- source_word: מְבַקְשֵׁי
  choice: derer, die … suchen
  rationale: Das substantivierte Partizip beschreibt Menschen, deren fortdauernde Haltung das Suchen ist. Die Relativkonstruktion ist natürliches modernes Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Eigenname „Jahwe“ wiedergegeben, statt es durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ wahrt dessen Funktion als persönlicher Gottesname; die traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt.
- issue: Numerus von לֵב bei einer Mehrzahl von Suchenden
  choice: Das Herz derer
  alternative: Die Herzen derer
  rationale: Der Ausgangstext hat den Singular „Herz“, der kollektiv gebraucht ist. Die Übersetzung erhält diesen Singular und löst die Spannung zur pluralischen Personengruppe nicht stillschweigend auf.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit poetisch-aufforderndem Klang. Der Genitiv bei „sich rühmen“ ist bewusst gewählt: Er ist etwas gehoben, aber klar und idiomatisch. Der hebräische Singular „Herz“ bleibt erhalten.'
