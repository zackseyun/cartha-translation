source:
  edition: WLC
  text: וַ/יֵּלְכ֥וּ כָל הָ/עָ֖ם אִ֣ישׁ לְ/בֵית֑/וֹ וַ/יִּסֹּ֥ב דָּוִ֖יד לְ/בָרֵ֥ךְ אֶת בֵּיתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/043.yaml
  text: Then all the people went[a], each man to his house, and David turned to bless his household.
translation:
  language: de
  text: Dann ging das ganze Volk fort, jeder in sein Haus. David aber wandte sich um, um seinem Haus[a] Segen zuzusprechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seiner Hausgemeinschaft« beziehungsweise »seiner Familie«. Das hebräische Wort kann sowohl das Haus als Gebäude als auch die dazugehörige Hausgemeinschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: ging … fort
  rationale: Das Wayyiqtol führt die Erzählung mit der nächsten Handlung fort. »Fortgehen« gibt im Deutschen den Aufbruch der versammelten Menschen natürlich wieder.
- source_word: כָל הָעָם
  choice: das ganze Volk
  rationale: עַם bezeichnet hier die versammelte Bevölkerung; »Volk« ist die direkte und geläufige Wiedergabe.
- source_word: אִישׁ לְבֵיתוֹ
  choice: jeder in sein Haus
  rationale: אִישׁ wird nach »das ganze Volk« distributiv gebraucht. Das natürliche deutsche »jeder« bewahrt diesen Sinn, ohne unnötig nur erwachsene Männer zu bezeichnen; בַּיִת meint hier zunächst die jeweilige Wohnstätte.
- source_word: וַיִּסֹּב
  choice: wandte sich um
  rationale: Die Form von סבב bezeichnet einen Richtungswechsel. »Wandte sich um« bleibt näher am Verbsinn als das stärker deutende »kehrte zurück«.
- source_word: לְבָרֵךְ
  choice: um … Segen zuzusprechen
  rationale: Der Infinitiv mit לְ gibt den Zweck an. »Segen zusprechen« ist in diesem Zusammenhang natürlich und bewahrt den Vorgang des Segnens.
- source_word: בֵּיתוֹ
  choice: seinem Haus
  rationale: בַּיִת kann sowohl das Gebäude als auch die Hausgemeinschaft bzw. Familie bezeichnen. »Haus« erhält diese im Hebräischen vorhandene Bedeutungsweite, die in einer Fußnote erläutert wird.
theological_decisions:
- issue: Worauf sich Davids Segnen seines »Hauses« bezieht
  choice: Die mehrdeutige Bezeichnung »seinem Haus« wird im Haupttext beibehalten.
  alternative: »seiner Hausgemeinschaft« oder »seiner Familie«
  rationale: Der Kontext legt die Angehörigen seines Hauses nahe, doch das hebräische בַּיִת lässt sowohl die häusliche Gemeinschaft als auch das Haus als solche Bezeichnung zu. Die Übersetzung soll diese Spannung nicht unnötig festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt erzählerisch klar; »David aber« markiert den Wechsel vom Volk zu David. Die Wiederholung von »Haus« spiegelt bewusst die Wiederholung desselben hebräischen Wortes.
