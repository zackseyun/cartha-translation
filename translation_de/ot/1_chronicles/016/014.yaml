id: 1CH.16.14
reference: 1 Chronicles 16:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ה֚וּא יְהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָל הָ/אָ֖רֶץ מִשְׁפָּטָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/014.yaml
  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: de
  text: Er ist Jahwe, unser Gott.[a] Seine Urteile gelten auf der ganzen Erde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Gottesname lautet JHWH; traditionell wird er mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „im ganzen Land“. Das hebräische Wort kann sowohl „Erde“ als auch „Land“ bedeuten; hier legt der Zusammenhang den weltweiten Sinn nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Er ist
  rationale: Das selbstständige Pronomen ist betont und bildet das Subjekt eines verblosen Satzes; im Deutschen gibt „Er ist“ die Aussage natürlich und mit angemessener Hervorhebung wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige wissenschaftliche Umschrift.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Obwohl אֱלֹהִים der Form nach pluralisch ist, bezeichnet es hier mit dem Suffix der ersten Person Plural eindeutig den einen Gott Israels.
- source_word: בְּכָל הָאָרֶץ
  choice: auf der ganzen Erde
  rationale: בְּ mit כָּל und אֶרֶץ bezeichnet hier am ehesten weltweite Erstreckung. Die deutsche Wendung „auf der ganzen Erde“ ist natürlich und bewahrt den universalen Horizont des Lobgesangs.
- source_word: מִשְׁפָּטָיו
  choice: seine Urteile
  rationale: מִשְׁפָּטָיו kann Urteile, Rechtssprüche, Rechtsordnungen oder richterliches Handeln bezeichnen. „Seine Urteile“ wahrt diese gerichtliche Bedeutung, ohne sie auf abstrakte Gerechtigkeit oder einzelne Gebote zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Umschrift „Jahwe“ macht dies sichtbar; die traditionelle Ersatzlesung „der HERR“ wird in einer Fußnote genannt.
- issue: Reichweite von הָאָרֶץ
  choice: die ganze Erde
  alternative: das ganze Land
  rationale: Der Kontext des Lobgesangs spricht für einen weltweiten Horizont. Zugleich kann אֶרֶץ auch „Land“ bedeuten; diese echte lexikalische Möglichkeit bleibt in der Fußnote erhalten.
- issue: Bedeutungsumfang von מִשְׁפָּטָיו
  choice: seine Urteile
  alternative: seine Rechtsordnungen / sein richterliches Handeln
  rationale: Die knappe Übersetzung bewahrt die Mehrdeutigkeit zwischen ergangenen Urteilen, Rechtsbestimmungen und Gottes richterlichem Wirken, ohne eine einzelne Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus bleibt in zwei kurzen Hauptsätzen erhalten. „Gelten“ gibt die räumliche Reichweite idiomatisch wieder, ohne die Art der Urteile näher festzulegen.
