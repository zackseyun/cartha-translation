  text: when you were few in number[a], very few, and sojourners in it,
translation:
  language: de
  text: als ihr nur wenige an Zahl wart, ja, sehr wenige, und dort als Fremde lebtet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּהְיוֹתְכֶם
  choice: als ihr … wart
  rationale: Die Präposition ב mit dem Infinitiv constructus von היה und dem Suffix der 2. Person Plural leitet einen temporalen Nebensatz ein. „Als ihr … wart“ gibt dies im Deutschen natürlich wieder.
- source_word: מְתֵי מִסְפָּר
  choice: nur wenige an Zahl
  rationale: Die Wendung bezeichnet eine kleine, leicht zählbare Personenzahl. „Wenige an Zahl“ bewahrt das hebräische Bild; „nur“ verdeutlicht die geringe Zahl idiomatisch.
- source_word: כִּמְעַט
  choice: sehr wenige
  rationale: Im Zusammenhang verstärkt die Wendung die unmittelbar zuvor genannte geringe Zahl. „Sehr wenige“ gibt diesen Nachdruck klar und natürlich wieder; weitere mögliche Nuancen werden in der Fußnote bewahrt.
- source_word: וְגָרִים
  choice: und als Fremde … lebten
  rationale: Das Partizip von גור bezeichnet Menschen, die sich ohne angestammtes Heimatrecht vorübergehend in einem Land aufhalten. Die verbale Wiedergabe ist im Deutschen natürlicher als „Beisassen“ oder „Fremdlinge“ und bewahrt den sozialen Sinn.
- source_word: בָּהּ
  choice: in ihr
  rationale: Das feminine Suffix verweist im Kontext auf „das Land“. „In ihr“ wahrt diesen Bezug und ist im Deutschen bei einem vorausgesetzten femininen Bezugswort möglich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt als abhängiger temporaler Teilsatz offen, wie es der Vers im poetischen Zusammenhang verlangt. „Fremde“ ist allgemein verständlich; die Ergänzung „lebten“ vermittelt den Aufenthaltscharakter von גור.
