id: 1CH.16.31
reference: 1 Chronicles 16:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִשְׂמְח֤וּ הַ/שָּׁמַ֨יִם֙ וְ/תָגֵ֣ל הָ/אָ֔רֶץ וְ/יֹאמְר֥וּ בַ/גּוֹיִ֖ם יְהוָ֥ה מָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/031.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; and let them say among the nations, “Yahweh reigns!”
translation:
  language: de
  text: 'Der Himmel freue sich, und die Erde juble! Unter den Nationen soll man sagen: »Jahwe ist König!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: freue sich
  rationale: Der Qal-Imperfekt steht im poetischen Zusammenhang auffordernd; der deutsche Konjunktiv I gibt diesen volitiven Sinn würdig und natürlich wieder.
- source_word: הַשָּׁמַיִם
  choice: der Himmel
  rationale: Das hebräische שׁמים hat zwar eine formal plurale Gestalt, wird im Deutschen für den kosmischen Bereich jedoch idiomatisch als Singular »der Himmel« wiedergegeben.
- source_word: וְתָגֵל
  choice: und ... juble
  rationale: גיל bezeichnet freudiges Jubeln. »Juble« bewahrt die poetische Steigerung und vermeidet eine bloße Wiederholung von »freuen«.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Im Parallelismus mit dem Himmel ist der gesamte Erdkreis gemeint, nicht ein einzelnes Land.
- source_word: וְיֹאמְרוּ
  choice: soll man sagen
  rationale: Der Imperfekt setzt die auffordernde Folge fort. Das unbestimmte »man« bildet die nicht ausdrücklich genannte menschliche Sprechergruppe natürlich ab, ohne Himmel und Erde zu den Sprechern zu machen.
- source_word: בַגּוֹיִם
  choice: unter den Nationen
  rationale: גּוֹיִם bezeichnet hier die Völker beziehungsweise Nationen allgemein; »unter« gibt den Bereich der öffentlichen Verkündigung idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מָלָךְ
  choice: ist König
  rationale: Das Qal-Perfekt kann in dieser Proklamationsformel die gegenwärtige, feststehende Königsherrschaft ausdrücken. »Ist König« bewahrt zugleich die mögliche königliche Zustandsaussage, ohne einen Beginn der Herrschaft zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. »Jahwe« bewahrt ihn als Eigennamen, statt ihn durch den Titel »der HERR« zu ersetzen.
- issue: Bedeutung von מָלָךְ in der Königsproklamation
  choice: ist König
  alternative: herrscht / ist König geworden
  rationale: Die Form kann die wirksame Königsherrschaft verkünden; »ist König« lässt die Aussage als gegenwärtige königliche Wirklichkeit stehen und vermeidet die nicht zwingende Vorstellung, Gott habe erst zu einem bestimmten Zeitpunkt die Königswürde erlangt.
translation_notes:
  register: Poetisch, feierlich und zugleich gegenwärtig verständlich. Die parallelen Aufforderungen werden durch Konjunktivformen gestaltet; der abschließende Ausruf bleibt knapp und proklamatorisch.
