source:
  edition: WLC
  text: זִכְר֗וּ נִפְלְאֹתָי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה מֹפְתָ֖י/ו וּ/מִשְׁפְּטֵי פִֽי/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/012.yaml
  text: Remember his wondrous deeds that he has done[a], his signs[c][b], and the judgments of his mouth.
translation:
  language: de
  text: Denkt an seine Wundertaten[a], die er vollbracht hat, an seine Zeichen[b] und an die Urteile seines Mundes.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine Wunder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: seine Wunderzeichen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: die Rechtssprüche, Satzungen oder Verfügungen seines Mundes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Denkt an
  rationale: Der Pluralimperativ von זכר fordert die Angesprochenen zu aktivem Erinnern auf. „Denkt an“ ist im heutigen Deutsch natürlich und bewahrt den auffordernden Charakter.
- source_word: נִפְלְאֹתָיו
  choice: seine Wundertaten
  rationale: Das Wort bezeichnet außergewöhnliche Taten, die Staunen hervorrufen. „Wundertaten“ gibt sowohl den Wundercharakter als auch den Handlungsaspekt wieder.
- source_word: אֲשֶׁר עָשָׂה
  choice: die er vollbracht hat
  rationale: Der Relativsatz bezeichnet die Wundertaten als von Gott ausgeführte Handlungen. „Vollbracht hat“ drückt die abgeschlossene Tat idiomatisch aus.
- source_word: מֹפְתָיו
  choice: seine Zeichen
  rationale: מופת bezeichnet ein Zeichen oder Wunderzeichen, das göttliche Macht erkennen lässt. „Zeichen“ ist knapp, verständlich und legt die Bedeutung nicht vorschnell auf „Wunder“ fest.
- source_word: וּמִשְׁפְּטֵי פִיהוּ
  choice: und die Urteile seines Mundes
  rationale: מִשְׁפָּט kann Urteil, Rechtsspruch, Satzung oder Verfügung bedeuten. Die Formulierung bewahrt das anschauliche hebräische Bild des göttlichen Mundes und lässt die richterliche wie die verfügende Nuance bestehen.
theological_decisions:
- issue: Wiedergabe der beiden parallelen Bezeichnungen für Gottes Taten
  choice: Die verschiedenen Begriffe פלאות und מופתים werden mit „Wundertaten“ und „Zeichen“ unterschieden wiedergegeben.
  alternative: Beide Begriffe könnten vereinheitlichend mit „Wunder“ oder als „Wunder“ und „Wunderzeichen“ übersetzt werden.
  rationale: Der hebräische Parallelismus verwendet verwandte, aber unterschiedliche Wörter. Die differenzierte Wiedergabe erhält diese sprachliche und theologische Spannung, ohne die Begriffe gleichzusetzen.
- issue: Bedeutungsumfang von מִשְׁפְּטֵי פִיהוּ
  choice: „die Urteile seines Mundes“
  alternative: „die Satzungen“ oder „die Verfügungen seines Mundes“
  rationale: Die wörtlich-nahe Formulierung lässt offen, ob vor allem richterliche Entscheidungen, verbindliche Verfügungen oder Rechtssatzungen gemeint sind.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Klang. Die dreigliedrige Aufzählung und das Bild „seines Mundes“ bleiben erhalten.
