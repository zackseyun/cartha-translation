id: 1CH.16.29
reference: 1 Chronicles 16:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָב֥וּ לַ/יהוָ֖ה כְּב֣וֹד שְׁמ֑/וֹ שְׂא֤וּ מִנְחָה֙ וּ/בֹ֣אוּ לְ/פָנָ֔י/ו הִשְׁתַּחֲו֥וּ לַ/יהוָ֖ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/029.yaml
  text: Ascribe to Yahweh the glory due his name; bring an offering and come before him[a]. Bow down to Yahweh in holy splendor.
translation:
  language: de
  text: Gebt Jahwe die Ehre, die seinem Namen gebührt! Bringt eine Opfergabe und kommt vor ihn! Werft euch vor Jahwe nieder in heiliger Pracht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »in der Pracht der Heiligkeit«; möglicherweise: »in heiligem Schmuck«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Gebt
  rationale: Der Imperativ bedeutet in dieser liturgischen Wendung, Jahwe die ihm gebührende Ehre zuzuerkennen. Das schlichte „Gebt“ bewahrt die Bildsprache des Hebräischen und ist im Zusammenhang klar verständlich.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, damit der im hebräischen Text ausdrücklich verwendete Bundesname erkennbar bleibt.
- source_word: כְּבוֹד שְׁמוֹ
  choice: die Ehre, die seinem Namen gebührt
  rationale: 'Die deutsche Formulierung gibt den idiomatischen Sinn der kompakten hebräischen Genitivverbindung wieder: Seinem Namen soll die ihm zukommende Ehre zuerkannt werden.'
- source_word: שְׂאוּ מִנְחָה
  choice: Bringt eine Opfergabe
  rationale: שׂאוּ heißt wörtlich „hebt/tragt“, bezeichnet mit מִנְחָה jedoch das Herbeibringen einer Gabe. „Opfergabe“ lässt die kultische Bedeutung erkennen, ohne eine bestimmte Opferart festzulegen.
- source_word: וּבֹאוּ לְפָנָיו
  choice: und kommt vor ihn
  rationale: Die Wendung bezeichnet das Herantreten in Gottes Gegenwart. Die knappe Wiedergabe erhält sowohl die Bewegung als auch die ehrfürchtige Ausrichtung auf Gott.
- source_word: הִשְׁתַּחֲווּ
  choice: Werft euch … nieder
  rationale: Das Verb bezeichnet ein körperliches Sich-Niederwerfen als Ausdruck der Verehrung. Diese Übersetzung bewahrt die leibliche Handlung deutlicher als das allgemeinere „betet an“.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: in heiliger Pracht
  rationale: Die poetisch verdichtete Wendung kann die herrliche Schönheit der Heiligkeit oder heiligen Schmuck beziehungsweise Festkleidung bezeichnen. „In heiliger Pracht“ bewahrt diese Mehrdeutigkeit weitgehend; die Alternativen stehen in der Fußnote.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Da im Ausgangstext der Eigenname יהוה steht, wird er als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Deutung von בְּהַדְרַת קֹדֶשׁ
  choice: in heiliger Pracht
  alternative: in der Pracht der Heiligkeit; in heiligem Schmuck
  rationale: Die gewählte Formulierung erhält die Verbindung von Heiligkeit und Schönheit, ohne abschließend festzulegen, ob abstrakte Herrlichkeit oder kultischer Schmuck gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus und klaren Imperativen. „Jahwe“ gibt den Gottesnamen direkt wieder; „Opfergabe“ und „werft euch nieder“ halten den kultischen und körperlichen Gehalt des Verses fest.
