id: 1CH.16.26
reference: 1 Chronicles 16:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֠י כָּל אֱלֹהֵ֤י הָ/עַמִּים֙ אֱלִילִ֔ים וַ/יהוָ֖ה שָׁמַ֥יִם עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/026.yaml
  text: For all the gods of the peoples are idols[b][a], but Yahweh made the heavens.
translation:
  language: de
  text: Denn alle Götter der Völker sind Götzen, doch Jahwe hat den Himmel gemacht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Aufruf zur Anbetung ein und gibt die erklärende Funktion natürlich wieder.
- source_word: כָּל אֱלֹהֵי הָעַמִּים
  choice: alle Götter der Völker
  rationale: Bewahrt den umfassenden Sinn von כָּל und gibt den hebräischen Konstruktus direkt und idiomatisch wieder.
- source_word: אֱלִילִים
  choice: Götzen
  rationale: Bezeichnet abwertend die verehrten Götter als nichtige Götzen; „Götzen“ ist im Deutschen knapp, verständlich und trägt diese Wertung.
- source_word: וַיהוָה
  choice: doch Jahwe
  rationale: Das Waw ist formal verbindend, hat hier aufgrund des scharfen Gegensatzes jedoch adversative Kraft. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: שָׁמַיִם
  choice: den Himmel
  rationale: Der formale hebräische Plural bezeichnet hier in üblicher Schöpfungssprache den Himmel; der deutsche Singular ist natürlich und semantisch angemessen.
- source_word: עָשָׂה
  choice: hat ... gemacht
  rationale: Gibt das allgemeine Verb עשה direkt wieder, ohne es durch das spezifischere „erschaffen“ interpretativ zu verstärken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der im Text ausdrücklich stehende Eigenname wird transparent als „Jahwe“ wiedergegeben.
- issue: Sinn der Konjunktion ו vor יהוה
  choice: 'adversativ: „doch“'
  alternative: 'additiv: „und“'
  rationale: Die beiden Satzhälften stellen die Götzen der Völker Jahwe als dem Schöpfer gegenüber. „Doch“ bewahrt diesen im Zusammenhang klaren Kontrast, ohne zusätzliche Aussage einzuführen.
- issue: Aussage über die Götter der Völker
  choice: „sind Götzen“
  alternative: „sind Nichtse“; „sind nichtige Götzen“
  rationale: Die abwertende Aussage des hebräischen אֱלִילִים bleibt erhalten, ohne die ontologische oder theologische Spannung durch eine stärker deutende Formulierung vorzeitig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe antithetische Struktur des hebräischen Verses bleibt erhalten; „doch“ klingt im Kontrast natürlicher und etwas näher an der markierten Gegenüberstellung als ein bloßes „und“.
