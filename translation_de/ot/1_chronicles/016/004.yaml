revisions:
- from: Er setzte einige von den Leviten als Diener vor der Lade Jahwes ein. Sie sollten Jahwe, den Gott Israels, in Erinnerung rufen[a], ihm danken und ihn loben.
  to: Er bestimmte einige Leviten dazu, vor der Lade Jahwes Dienst zu tun, Jahwe zu gedenken[a], ihm zu danken und ihn zu loben.
  rationale: Die Revision ersetzt die missverständliche Wendung „Jahwe in Erinnerung rufen“ durch „Jahwe zu gedenken“ und gestaltet den Satz als natürliche Wiedergabe der hebräischen Einsetzung mit ihren drei Dienstaufgaben. Die Fußnote bewahrt die lexikalische Offenheit von לְהַזְכִּיר und verankert sie unmittelbar an der betreffenden Wendung.
