  text: וַ/יִּתֵּ֞ן לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה מִן הַ/לְוִיִּ֖ם מְשָׁרְתִ֑ים וּ/לְ/הַזְכִּיר֙ וּ/לְ/הוֹד֣וֹת וּ/לְ/הַלֵּ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/004.yaml
  text: He appointed some of the Levites to minister before the ark of Yahweh[a], to commemorate, to give thanks, and to praise Yahweh, the God of Israel.
translation:
  language: de
  text: Er bestimmte einige Leviten dazu, vor der Lade Jahwes Dienst zu tun, Jahwe zu gedenken[a], ihm zu danken und ihn zu loben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe zu erwähnen“. Das hebräische Verb kann hier ein liturgisches Gedenken oder öffentliches Erwähnen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Er setzte … ein
  rationale: נתן bedeutet wörtlich „geben/setzen“; mit Personen und einer Dienstaufgabe bezeichnet es hier idiomatisch ihre Einsetzung.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: vor der Lade Jahwes
  rationale: Die Wendung bewahrt sowohl die räumlich-kultische Bedeutung von לִפְנֵי als auch die direkte Genitivverbindung des hebräischen Ausdrucks.
- source_word: מִן הַלְוִיִּם מְשָׁרְתִים
  choice: einige von den Leviten als Diener
  rationale: מִן wird partitiv wiedergegeben; das Partizip מְשָׁרְתִים bezeichnet ihre kultische Dienstfunktion.
- source_word: וּלְהַזְכִּיר
  choice: in Erinnerung rufen
  rationale: Der Hifil von זכר kann ein Erinnern beziehungsweise Erwähnen bewirken und hier eine liturgische Vergegenwärtigung oder Verkündigung bezeichnen. Die Formulierung lässt diese Breite eher bestehen als das engere „gedenken“.
- source_word: וּלְהוֹדוֹת
  choice: ihm danken
  rationale: ידה bezeichnet in diesem gottesdienstlichen Zusammenhang das Danken; das Pronomen macht im Deutschen den Bezug auf Jahwe natürlich verständlich.
- source_word: וּלְהַלֵּל
  choice: ihn loben
  rationale: הלל im Piel bedeutet „loben“. Ein ausdrücklicher Bezug auf Gesang wird nicht ergänzt.
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Jahwe, den Gott Israels
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; אֱלֹהֵי יִשְׂרָאֵל erscheint als erklärende Apposition.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Transliteration „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der liturgischen Aufgabe לְהַזְכִּיר
  choice: Jahwe in Erinnerung rufen
  alternative: gedenken; erwähnen; das Gedenken vollziehen
  rationale: Der hebräische Ausdruck lässt offen, ob vor allem liturgisches Gedenken, öffentliches Erwähnen oder ein Vergegenwärtigen gemeint ist. Die Übersetzung legt keine engere konfessionelle Deutung fest; die Fußnote nennt die wichtigsten Möglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange hebräische Satzfolge wurde in zwei Sätze gegliedert, damit Auftrag und Zweck klar verständlich bleiben. Die wiederholten Pronomen sind im Deutschen für einen natürlichen Satzbau erforderlich und beziehen die drei Tätigkeiten ausdrücklich auf Jahwe.
