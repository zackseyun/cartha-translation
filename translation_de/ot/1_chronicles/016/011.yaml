id: 1CH.16.11
reference: 1 Chronicles 16:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דִּרְשׁ֤וּ יְהוָה֙ וְ/עֻזּ֔/וֹ בַּקְּשׁ֥וּ פָנָ֖י/ו תָּמִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/011.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: de
  text: Sucht Jahwe und seine Stärke; sucht stets sein Angesicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Gegenwart«; wörtlich: »sein Angesicht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Sucht
  rationale: Der Imperativ fordert dazu auf, sich Jahwe aktiv zuzuwenden und ihn zu suchen; „sucht“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: וְעֻזּוֹ
  choice: und seine Stärke
  rationale: עֹז bezeichnet hier am naheliegendsten Jahwes Stärke oder Macht; „seine Stärke“ bewahrt die direkte Formulierung.
- source_word: בַּקְּשׁוּ
  choice: sucht
  rationale: בקש bezeichnet ernsthaftes Suchen. Die gleiche Wiedergabe wie bei דרש erhält den poetischen Parallelismus, ohne einen künstlichen Bedeutungsunterschied einzuführen.
- source_word: פָנָיו
  choice: sein Angesicht
  rationale: Wörtlich steht „sein Angesicht“. Die im Deutschen verständliche und theologisch ausdrucksstarke Bildsprache bleibt im Haupttext erhalten; die idiomatische Bedeutung „seine Gegenwart“ wird in der Fußnote genannt.
- source_word: תָּמִיד
  choice: stets
  rationale: תמיד bezeichnet beständige oder fortwährende Ausrichtung; „stets“ ist prägnant, würdig und in modernem Standarddeutsch gut verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von פָנָיו
  choice: sein Angesicht
  alternative: seine Gegenwart
  rationale: Die konkrete Wendung wird bewahrt, während ihre idiomatische Bedeutung durch eine Fußnote zugänglich gemacht wird, ohne die Bildsprache im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. „Angesicht“ ist bewusst gehobener als „Gesicht“, da es die biblische Wendung natürlich trägt und zugleich verständlich bleibt.
