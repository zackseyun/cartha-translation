id: 1CH.16.28
reference: 1 Chronicles 16:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָב֤וּ לַֽ/יהוָה֙ מִשְׁפְּח֣וֹת עַמִּ֔ים הָב֥וּ לַ/יהוָ֖ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/028.yaml
  text: Ascribe to Yahweh[a], families of the peoples, ascribe to Yahweh glory and strength.
translation:
  language: de
  text: Gebt Yahweh, ihr Sippen der Völker, gebt Yahweh Ehre und Macht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבוּ
  choice: Gebt
  rationale: Der pluralische Imperativ wird im Deutschen natürlich mit »Gebt« wiedergegeben. Im Lobpreiszusammenhang bedeutet er, Yahweh das ihm Gebührende zuzuerkennen; die wörtliche Form bewahrt zugleich die kraftvolle Wiederholung.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Die Präposition ל kennzeichnet den Empfänger, während der Gottesname יהוה als »Yahweh« wiedergegeben wird.
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: ihr Sippen der Völker
  rationale: מִשְׁפָּחוֹת bezeichnet größere Verwandtschaftsgruppen beziehungsweise Sippen; עַמִּים steht im Plural. Das eingefügte »ihr« macht die Anrede im modernen Deutsch deutlich, ohne ihren Umfang einzuengen.
- source_word: כָּבוֹד
  choice: Ehre
  rationale: כָּבוֹד bezeichnet hier die Anerkennung und Herrlichkeit, die Gott gebührt. In Verbindung mit »Gebt« ist »Ehre« im Deutschen natürlicher als »Herrlichkeit«.
- source_word: וָעֹז
  choice: und Macht
  rationale: עֹז kann Stärke oder Macht bezeichnen. »Macht« benennt hier idiomatisch die Gott zuerkannte Kraft und bildet mit »Ehre« ein natürliches Wortpaar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen יהוה. Die Transliteration »Yahweh« bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Sinn von »Gebt« im Aufruf zum Lob
  choice: Anerkennendes Zuerkennen, ausgedrückt durch das wörtliche »Gebt«
  alternative: Erweist / Schreibt zu
  rationale: Der Aufruf besagt nicht, dass Menschen Gott Ehre und Macht erst verschaffen. Sie sollen öffentlich anerkennen, was ihm zukommt; die knappe hebräische Bildsprache bleibt dennoch erhalten.
translation_notes:
  register: Moderner, würdevoller liturgischer Aufruf. Die zweimalige Imperativform und die Parallelstruktur des Hebräischen bleiben erhalten; »Sippen« gibt die verwandtschaftliche Bedeutung genauer wieder als das allgemeinere »Familien«.
