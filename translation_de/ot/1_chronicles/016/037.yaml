source:
  edition: WLC
  text: וַ/יַּֽעֲזָב שָׁ֗ם לִ/פְנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה לְ/אָסָ֖ף וּ/לְ/אֶחָ֑י/ו לְ/שָׁרֵ֞ת לִ/פְנֵ֧י הָ/אָר֛וֹן תָּמִ֖יד לִ/דְבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/037.yaml
  text: So he left Asaph and his brothers there before the ark of the covenant of Yahweh[a], to minister before the ark continually, according to each day's requirement.
translation:
  language: de
  text: So ließ er Asaf und seine Brüder dort vor der Lade des Bundes Jahwes zurück, damit sie beständig vor der Lade Dienst taten, wie es der jeweilige Tag erforderte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »gemäß der Angelegenheit eines Tages an seinem Tag«; auch: »wie es jeder Tag erforderte«.'
    reason: Die knappe hebräische Zeit- und Aufgabenformel lässt sich im Deutschen nicht zugleich wörtlich und natürlich wiedergeben.
lexical_decisions:
- source_word: וַיַּעֲזָב
  choice: ließ … zurück
  rationale: Das Verb עזב bedeutet grundsätzlich »lassen« oder »zurücklassen«. Hier bezeichnet es, dass David Asaf und dessen Brüder für den fortdauernden Dienst an diesem Ort zurückließ; »bestellte« wäre stärker auslegend.
- source_word: לִפְנֵי אֲרוֹן בְּרִית יְהוָה
  choice: vor der Lade des Bundes Jahwes
  rationale: לִפְנֵי wird in diesem räumlich-kultischen Zusammenhang natürlich mit »vor« wiedergegeben. Die hebräische Genitivverbindung bleibt vollständig erhalten.
- source_word: לְאָסָף וּלְאֶחָיו
  choice: Asaf und seine Brüder
  rationale: אֶחָיו bedeutet wörtlich »seine Brüder« und kann hier zugleich die mit ihm verbundenen levitischen Dienstbrüder bezeichnen.
- source_word: לְשָׁרֵת
  choice: Dienst taten
  rationale: שרת bezeichnet hier den geregelten kultischen Dienst. Die Formulierung ist im Deutschen verständlich und bewahrt den liturgischen Bezug.
- source_word: תָּמִיד
  choice: beständig
  rationale: תמיד bezeichnet eine fortdauernde beziehungsweise regelmäßig wiederkehrende Ausübung des Dienstes.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: wie es der jeweilige Tag erforderte
  rationale: Die idiomatische Wendung meint die für jeden einzelnen Tag anfallende oder vorgeschriebene Aufgabe. Die Übersetzung gibt diesen Sinn natürlich wieder, während die Fußnote die hebräische Ausdrucksweise erkennen lässt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt erzählerisch und gut verständlich; die kultische Bedeutung von שרת sowie die Wiederholung von »vor der Lade« werden bewahrt.
