  terminology: „Lade des Bundes Jahwes“ bewahrt sowohl die Bundesbezeichnung als auch den Gottesnamen. „Asaf“ ist die im Deutschen übliche Namensform. „Brüder“ wahrt die hebräische Bezeichnung, ohne die mögliche weitere kultische Bezugsgruppe unnötig einzuengen.
