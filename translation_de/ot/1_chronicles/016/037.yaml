  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des Hebräischen zuverlässig wieder: David ließ Asaf und seine Brüder bei der Lade zurück, damit sie dort fortlaufend den kultischen Dienst verrichteten. Die Wiederholung von „vor der Lade“ entspricht dem hebräischen Text. „wie es der jeweilige Tag erforderte“ trifft die idiomatische Formel לִדְבַר יוֹם בְּיוֹמוֹ angemessen.'
