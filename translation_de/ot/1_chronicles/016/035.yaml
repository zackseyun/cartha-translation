source:
  edition: WLC
  text: וְ/אִמְר֕וּ הוֹשִׁיעֵ֨/נוּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/נוּ וְ/קַבְּצֵ֥/נוּ וְ/הַצִּילֵ֖/נוּ מִן הַ/גּוֹיִ֑ם לְ/הֹדוֹת֙ לְ/שֵׁ֣ם קָדְשֶׁ֔/ךָ לְ/הִשְׁתַּבֵּ֖חַ בִּ/תְהִלָּתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/035.yaml
  text: And say[a], “Save us, O God of our salvation; gather us and deliver us from the nations[b], that we may give thanks to your holy name and glory in your praise.”
translation:
  language: de
  text: 'Und sagt: „Rette uns, Gott unseres Heils! Sammle uns und befreie uns aus den Völkern, damit wir deinem heiligen Namen danken und uns deines Lobes rühmen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִמְרוּ
  choice: Und sagt
  rationale: Der Imperativ Plural leitet die gemeinsame gesprochene Antwort ein; die Konjunktion wahrt den liturgischen Fortgang.
- source_word: הוֹשִׁיעֵנוּ
  choice: Rette uns
  rationale: Der Hifil-Imperativ von ישׁע bezeichnet hier Gottes rettendes Eingreifen; „rette“ ist im heutigen Deutsch unmittelbar und prägnant.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: Gott unseres Heils
  rationale: Die Wiedergabe bewahrt die hebräische Genitivverbindung und den würdevollen Gebetsstil, ohne sie zu einem späteren Hoheitstitel umzuformen.
- source_word: וְקַבְּצֵנוּ
  choice: Sammle uns
  rationale: קבץ bezeichnet das Zusammenbringen der Zerstreuten; „sammle“ erhält den möglichen Wiederherstellungsbezug.
- source_word: וְהַצִּילֵנוּ
  choice: befreie uns
  rationale: Der Hifil von נצל meint das Herausreißen oder Befreien aus einer Bedrängnis; die Wortwahl unterscheidet es vom vorausgehenden ישׁע.
- source_word: מִן־הַגּוֹיִם
  choice: aus den Völkern
  rationale: גוים bezeichnet hier die Völker, unter denen Israel zerstreut ist. „Aus“ gibt die Bewegung aus ihrer Mitte natürlich wieder.
- source_word: לְהוֹדוֹת לְשֵׁם קָדְשֶׁךָ
  choice: damit wir deinem heiligen Namen danken
  rationale: Die Infinitivkonstruktion drückt den Zweck aus; ידה im Hifil bedeutet in diesem Zusammenhang „danken“ beziehungsweise dankend preisen.
- source_word: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: und uns deines Lobes rühmen
  rationale: Der Hitpael von שׁבח trägt den Sinn „sich rühmen“ oder „sich glücklich preisen“; der Genitiv ist im Deutschen idiomatisch und hält den Gegenstand des Rühmens bei Gottes Lob.
theological_decisions:
- issue: Bedeutung von הַגּוֹיִם
  choice: aus den Völkern
  alternative: aus den Heidenvölkern
  rationale: Im Kontext sind die Völker gemeint, unter denen Israel zerstreut ist. „Völker“ vermeidet eine unnötige spätere Juden-Heiden-Terminologie.
- issue: Sinn der Schlusswendung
  choice: uns deines Lobes rühmen
  alternative: über dein Lob jubeln
  rationale: Die Formulierung bewahrt die positive, auf Gott bezogene Bedeutung des Sich-Rühmens und lässt die Spannung offen, ob תהלה das Gott dargebrachte Lob oder seine Lobenswürdigkeit bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gebetssprachlicher Prägnanz. Der poetische Parallelismus der drei Bitten und der beiden Zweckangaben bleibt erhalten; auf das im modernen Deutsch altertümlich wirkende vokativische „o“ wird verzichtet.
