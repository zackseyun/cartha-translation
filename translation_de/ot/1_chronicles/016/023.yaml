  terminology: „Jahwe“ gibt יְהוָה konsequent als Eigenname wieder. „Rettung“ ist für יְשׁוּעָתוֹ breit, natürlich und ohne konfessionelle Einengung geeignet. Der englische Audit-Hinweis zu Marker a ist intern widersprüchlich, weil sein Text von „the LORD“ spricht, während der englische Vers „Yahweh“ bietet; dies betrifft jedoch keinen deutschen Textanker.
