  variant: modern standard German
source:
  edition: WLC
  text: שִׁ֤ירוּ לַֽ/יהוָה֙ כָּל הָ/אָ֔רֶץ בַּשְּׂר֥וּ מִ/יּֽוֹם אֶל י֖וֹם יְשׁוּעָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/023.yaml
  text: Sing to Yahweh[a], all the earth[b]; proclaim his salvation from day to day.
translation:
  language: de
  text: Singt für Jahwe, ganze Erde; verkündet Tag für Tag seine Rettung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁירוּ
  choice: Singt
  rationale: Der pluralische Imperativ von שׁיר ist eine direkte Aufforderung zum Singen; „Singt“ gibt ihn ohne interpretierenden Zusatz wieder.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל bezeichnet hier den Adressaten des Singens. „Für Jahwe“ ist im heutigen Deutsch natürlicher als „Jahwe zu“, und „Jahwe“ gibt den Gottesnamen יְהוָה wieder.
- source_word: כָּל הָאָרֶץ
  choice: ihr Bewohner der ganzen Erde
  rationale: Wörtlich steht „die ganze Erde“. Da diese im Hebräischen direkt zum Singen aufgefordert wird, macht die deutsche Anrede die Personifikation verständlich, ohne den weltweiten Umfang einzuschränken.
- source_word: בַּשְּׂרוּ
  choice: verkündet
  rationale: Der Piel-Imperativ von בשׂר bezeichnet das Überbringen oder öffentliche Bekanntmachen einer guten Botschaft. „Verkündet“ bewahrt diesen feierlichen und positiven Sinn im Zusammenhang.
- source_word: מִיּוֹם אֶל יוֹם
  choice: Tag für Tag
  rationale: Die Wendung bezeichnet fortgesetzte tägliche Wiederholung. „Tag für Tag“ ist eine natürliche, rhythmische deutsche Entsprechung.
- source_word: יְשׁוּעָתוֹ
  choice: seine Rettung
  rationale: יְשׁוּעָה kann Rettung, Heil oder Befreiung bezeichnen. „Rettung“ ist konkret, breit verständlich und lässt offen, in welcher Gestalt Gottes rettendes Handeln hier gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen ausdrücklich. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von יְשׁוּעָה
  choice: Rettung
  alternative: Heil
  rationale: „Rettung“ bewahrt den grundlegenden Sinn von Befreiung und Hilfe, ohne den Ausdruck ausschließlich als theologischen Fachbegriff zu lesen.
translation_notes:
  register: Poetisch-feierlicher, zugleich moderner Standardstil. Der Parallelismus der beiden pluralischen Imperative und der universale Aufruf bleiben erhalten. Die personifizierende Anrede „ihr Bewohner der ganzen Erde“ verdeutlicht im Deutschen, wer zum Singen aufgefordert ist.
