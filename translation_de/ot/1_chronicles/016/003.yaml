  text: וַ/יְחַלֵּק֙ לְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל מֵ/אִ֖ישׁ וְ/עַד אִשָּׁ֑ה לְ/אִישׁ֙ כִּכַּר לֶ֔חֶם וְ/אֶשְׁפָּ֖ר וַ/אֲשִׁישָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/003.yaml
  text: He distributed to every person of Israel[a], from man to woman, to each one a loaf of bread, a portion of meat, and a raisin cake.
translation:
  language: de
  text: Er verteilte an alle Israeliten, vom Mann bis zur Frau, an jeden einen Laib Brot, eine Portion Fleisch[a] und einen Rosinenkuchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder möglicherweise »eine Portion« oder eine andere Speise. Das seltene hebräische Wort אֶשְׁפָּר (eschpar) hat eine unsichere genaue Bedeutung; häufig wird es hier als eine Portion Fleisch verstanden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: Er verteilte
  rationale: Das Piel von חלק bezeichnet hier das Austeilen einzelner Gaben an eine Menschenmenge. »Verteilte« ist im Deutschen natürlich und sachlich genau.
- source_word: לְכָל אִישׁ יִשְׂרָאֵל
  choice: an jeden in Israel
  rationale: אִישׁ hat hier distributive Bedeutung. Die Formulierung bezieht jede einzelne Person ein; der folgende Ausdruck stellt ausdrücklich klar, dass Männer und Frauen gemeint sind.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: vom Mann bis zur Frau
  rationale: Die nahe Wiedergabe bewahrt die hebräische Spannweitenformel und macht deutlich, dass beide Geschlechter eingeschlossen sind.
- source_word: לְאִישׁ
  choice: je
  rationale: Das distributive »je« gibt knapp und idiomatisch wieder, dass jede einzelne Person die genannten Gaben erhielt.
- source_word: כִּכַּר לֶחֶם
  choice: einen Laib Brot
  rationale: כִּכָּר bezeichnet hier wahrscheinlich einen runden Laib oder eine brotartige Backware. »Laib Brot« ist klar und geläufig.
- source_word: אֶשְׁפָּר
  choice: eine Portion Fleisch
  rationale: Das seltene Wort ist in seiner genauen Bedeutung unsicher. Im Zusammenhang eines Festmahls ist »Portion Fleisch« eine verbreitete und plausible Deutung; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: אֲשִׁישָׁה
  choice: einen Rosinenkuchen
  rationale: Das Wort bezeichnet wahrscheinlich einen gepressten Kuchen, der gewöhnlich als Rosinenkuchen verstanden wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die distributive Struktur des Hebräischen bleibt erhalten; zugleich macht »vom Mann bis zur Frau« die umfassende Empfängergruppe ausdrücklich sichtbar. Die lexikalische Unsicherheit bei אֶשְׁפָּר wird nicht im Haupttext ausgebreitet, sondern transparent in der Fußnote kenntlich gemacht.
