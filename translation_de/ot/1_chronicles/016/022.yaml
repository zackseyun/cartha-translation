source:
  edition: WLC
  text: אַֽל תִּגְּעוּ֙ בִּ/מְשִׁיחָ֔/י וּ/בִ/נְבִיאַ֖/י אַל תָּרֵֽעוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/022.yaml
  text: Do not touch my anointed ones[a], and do not harm my prophets.
translation:
  language: de
  text: Rührt meine Gesalbten[a] nicht an und tut meinen Propheten nichts Böses!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »meine Gesalbten«. Das hebräische Wort ist mit »Messias« verwandt, bezeichnet hier aber im Plural allgemein Gottes Gesalbte und nicht speziell den Messias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: rührt … nicht an
  rationale: נגע bedeutet grundlegend „berühren“. In Verbindung mit der Präposition ב und im Verbot bezeichnet es hier ein feindliches Antasten; „anrühren“ gibt dies knapp und idiomatisch wieder.
- source_word: בִּמְשִׁיחָי
  choice: meine Gesalbten
  rationale: מָשִׁיחַ bedeutet „Gesalbter“. Die hebräische Form ist ein Plural mit Suffix der ersten Person Singular; daher wird der Plural ausdrücklich wiedergegeben.
- source_word: וּבִנְבִיאַי
  choice: meinen Propheten
  rationale: נָבִיא bedeutet „Prophet“; die vorliegende Form ist ein Plural mit Suffix der ersten Person Singular.
- source_word: תָּרֵעוּ
  choice: tut … nichts Böses
  rationale: Die Hifil-Form von רעע kann bedeuten, jemandem Böses zu tun oder ihn zu schädigen. „Tut … nichts Böses“ bleibt nahe an der Wortbildung und bewahrt die Breite des Ausdrucks.
- source_word: אַל
  choice: nicht / nichts
  rationale: אַל mit den folgenden Imperfektformen kennzeichnet jeweils ein Verbot; im Deutschen wird dies durch den verneinten Imperativ ausgedrückt.
theological_decisions:
- issue: Wiedergabe von מְשִׁיחָי in einem nicht spezifisch messianischen Pluralkontext
  choice: meine Gesalbten
  alternative: meine Messiasse
  rationale: Der Ausdruck steht im Plural und bezeichnet hier allgemein Menschen, die Gott als die Seinen ausgesondert hat. „Messiasse“ würde im heutigen Deutsch irreführend auf den einzigartigen Messiastitel hinweisen.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Stil. Die parallelen Verbote werden knapp und direkt formuliert; „anrühren“ bewahrt den bildhaften Ausdruck des Hebräischen, während „nichts Böses tun“ dessen semantische Breite erhält.
