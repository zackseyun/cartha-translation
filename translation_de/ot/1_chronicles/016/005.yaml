  text: אָסָ֥ף הָ/רֹ֖אשׁ וּ/מִשְׁנֵ֣/הוּ זְכַרְיָ֑ה יְעִיאֵ֡ל וּ/שְׁמִֽירָמ֡וֹת וִֽ/יחִיאֵ֡ל וּ/מַתִּתְיָ֡ה וֶ/אֱלִיאָ֡ב וּ/בְנָיָהוּ֩ וְ/עֹבֵ֨ד אֱדֹ֜ם וִֽ/יעִיאֵ֗ל בִּ/כְלֵ֤י נְבָלִים֙ וּ/בְ/כִנֹּר֔וֹת וְ/אָסָ֖ף בַּֽ/מְצִלְתַּ֥יִם מַשְׁמִֽיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/005.yaml
  text: Asaph was the chief[a], and second to him was Zechariah; then Jeiel, Shemiramoth, Jehiel, Mattithiah, Eliab, Benaiah, Obed-edom, and Jeiel, with instruments of harps and lyres[b]; and Asaph sounded the cymbals.
translation:
  language: de
  text: Asaf war der Leiter[a], und Secharja war der Zweite nach ihm; dann Jeïel, Schemiramot, Jehiël, Mattitja, Eliab, Benaja, Obed-Edom und Jeïel mit Harfen und Leiern[b]. Asaf ließ die Zimbeln erklingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Asaf war das Oberhaupt, und Secharja war sein Zweiter.« Der hebräische Ausdruck bezeichnet Secharjas Rang unmittelbar nach Asaf.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen stehen zwei verschiedene Bezeichnungen für Saiteninstrumente: nebalim und kinnorot, hier mit »Harfen« und »Leiern« wiedergegeben.'
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: der Leiter
  rationale: רֹאשׁ bezeichnet in dieser Personalliste den führenden Rang Asafs; »Leiter« ist im modernen Deutschen natürlich und gibt die Funktion statt der wörtlichen Körperteilbedeutung wieder.
- source_word: וּמִשְׁנֵהוּ
  choice: und nach ihm kam
  rationale: מִשְׁנֶה mit Suffix bezeichnet Secharjas zweiten Rang in Beziehung zu Asaf. Die Formulierung ist idiomatisch und vermeidet das missverständliche deutsche »sein Zweiter«; die Rangbedeutung wird in der Fußnote erläutert.
- source_word: יְעִיאֵל / וִיעִיאֵל
  choice: Jëiël
  rationale: Beide Vorkommen geben denselben hebräischen Namen wieder und werden deshalb einheitlich transkribiert; die Tremazeichen helfen, die aufeinanderfolgenden Vokale getrennt zu lesen.
- source_word: בִּכְלֵי נְבָלִים וּבְכִנֹּרוֹת
  choice: mit Harfen und Leiern
  rationale: נֵבֶל und כִּנּוֹר bezeichnen zwei verschiedene Arten von Saiteninstrumenten. »Harfen und Leiern« wahrt diese Unterscheidung in geläufiger deutscher Terminologie; das allgemeine כְּלֵי muss dabei nicht schwerfällig mit »Instrumenten von« wiedergegeben werden.
- source_word: בַּמְצִלְתַּיִם
  choice: die Zimbeln
  rationale: »Zimbeln« ist die etablierte deutsche Bezeichnung für die paarweise geschlagenen Metallinstrumente; der bestimmte Artikel des Hebräischen wird beibehalten.
- source_word: מַשְׁמִיעַ
  choice: ließ ... erklingen
  rationale: 'Das Hifil-Partizip von שמע hat hier kausativen Sinn: Asaf bewirkte, dass die Zimbeln zu hören waren. »ließ ... erklingen« gibt dies natürlich und präzise wieder.'
