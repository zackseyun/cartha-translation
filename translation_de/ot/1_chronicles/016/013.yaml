  text: O offspring of Israel his servant[a], sons of Jacob[c][b], his chosen ones.
translation:
  language: de
  text: Ihr Nachkommen[a] Israels, seines Dieners, ihr Söhne Jakobs,[b] seine Erwählten!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Same Israels; das hebräische Wort steht in der Einzahl und bezeichnet kollektiv die Nachkommen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Kinder Jakobs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: Nachkommen
  rationale: Das kollektive Singularwort bezeichnet die Nachkommenschaft Israels. „Nachkommen“ gibt den gemeinten Personenkreis im heutigen Deutsch natürlich wieder; die wörtliche Bildform „Same“ wird in der Fußnote genannt.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Eingebürgerte deutsche Namensform.
- source_word: עַבְדּוֹ
  choice: seines Dieners
  rationale: עבד bezeichnet hier Israel in seinem Dienst- und Zugehörigkeitsverhältnis zu Gott. „Diener“ passt zum Kontext besser als „Sklave“ und bewahrt das maskuline Singularsuffix.
- source_word: בְּנֵי
  choice: Söhne
  rationale: Die grammatisch maskuline Pluralform wird wörtlich und in der genealogisch-korporativen Ausdrucksweise als „Söhne“ wiedergegeben; „Kinder“ ist als mögliche Wiedergabe in der Fußnote vermerkt.
- source_word: יַעֲקֹב
  choice: Jakobs
  rationale: Eingebürgerte deutsche Namensform im vom Hebräischen verlangten Genitiv.
- source_word: בְּחִירָיו
  choice: seine Erwählten
  rationale: Die substantivierte Form bezeichnet die von Gott ausgewählten Menschen im Plural. „Erwählte“ ist würdig, verständlich und entspricht der etablierten biblischen Ausdrucksweise, ohne die Aussage weiter auszulegen.
theological_decisions:
- issue: Bezug der maskulinen Singularsuffixe in „seines Dieners“ und „seine Erwählten“
  choice: Die Pronomen bleiben als „seines/seine“ erhalten und beziehen sich im Kontext auf Gott.
  alternative: Gottes Namen zur ausdrücklichen Klärung einsetzen.
  rationale: Der hebräische Text nennt den Bezugsträger in diesem Vers nicht erneut. Die pronominale Wiedergabe wahrt den Wortlaut und lässt den aus dem Zusammenhang erkennbaren Gottesbezug bestehen.
translation_notes:
  register: Moderne, würdige poetische Anrede. Das wiederholte „ihr“ macht die parallelen Anreden im Deutschen klar, ohne den Sinn zu erweitern. Die Ausrufeform entspricht dem anrufenden Charakter der Zeile.
