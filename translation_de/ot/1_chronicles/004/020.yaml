base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/020.yaml
  text: 'The sons of Shimon: Amnon and Rinnah[a], Ben-Hanan and Tilon[b]. And the sons of Ishi: Zoheth and Ben-Zoheth.'
translation:
  language: de
  text: 'Die Söhne Schimons: Amnon, Rinna, Ben-Hanan[a] und Tilon. Und die Söhne Jischis: Zochet und Ben-Zochet[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Sohn Hanans“. In dieser genealogischen Namensreihe ist Ben-Hanan jedoch wahrscheinlich ein Eigenname.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Sohn Zochets“. In dieser genealogischen Namensreihe ist Ben-Zochet jedoch wahrscheinlich ein Eigenname.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁימוֹן
  choice: Die Söhne Schimons
  rationale: Die genealogische Konstruktverbindung wird direkt wiedergegeben. Das einleitende וּ wird im Deutschen nicht eigens ausgedrückt, da der Vers als Fortsetzung einer Namensliste auch ohne ein eröffnendes „und“ natürlich lesbar bleibt.
- source_word: שִׁימוֹן
  choice: Schimon
  rationale: Der hebräische Personenname wird in einer für deutsche Leser nachvollziehbaren Form transliteriert, ohne ihn durch die traditionelle Form „Simeon“ zu ersetzen.
- source_word: אַמְנוֹן
  choice: Amnon
  rationale: Direkte Transliteration des Eigennamens.
- source_word: וְרִנָּה
  choice: Rinna
  rationale: Der Eigenname wird entsprechend der hebräischen Lautung wiedergegeben; das verbindende וְ erscheint in der deutschen Aufzählung durch die Zeichensetzung.
- source_word: בֶּן חָנָן
  choice: Ben-Hanan
  rationale: In der fortlaufenden Namensreihe ist die Verbindung wahrscheinlich als zusammengesetzter Eigenname zu verstehen. Der Bindestrich macht diese Lesart sichtbar, ohne die wörtlich mögliche Deutung „Sohn Hanans“ auszuschließen.
- source_word: וְתולון
  choice: und Tilon
  rationale: Der Ausdruck wird als weiterer Eigenname der Aufzählung transliteriert; die im masoretischen Text überlieferte Namensform wird nicht semantisch gedeutet.
- source_word: וּבְנֵי יִשְׁעִי
  choice: Und die Söhne Jischis
  rationale: Die wiederholte genealogische Formel und ihr einleitendes וּ werden hier ausdrücklich wiedergegeben. Der Genitiv bezeichnet Jischi als Vater beziehungsweise Stammvater.
- source_word: זוֹחֵת
  choice: Zochet
  rationale: Direkte, deutsch lesbare Transliteration des Eigennamens.
- source_word: וּבֶן זוֹחֵת
  choice: und Ben-Zochet
  rationale: Da auf „Sohn von“ kein weiterer Name folgt und der Ausdruck parallel zu anderen Namen steht, wird die ganze Verbindung wahrscheinlich als Eigenname verstanden. Die alternative syntaktische Deutung bleibt in der Fußnote erhalten.
