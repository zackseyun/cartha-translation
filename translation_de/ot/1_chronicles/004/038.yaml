base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/038.yaml
  text: These[a], who were mentioned by name, were leaders in their clans[b], and their ancestral houses increased greatly.
translation:
  language: de
  text: Diese namentlich Aufgeführten[a] waren Oberhäupter ihrer Sippen, und ihre Vaterhäuser vermehrten sich stark.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Diese, die mit Namen kommen/kamen“. Im Zusammenhang eines Geschlechtsregisters sind wahrscheinlich die Männer gemeint, die namentlich verzeichnet wurden.'
    reason: lexical_alternative
  - marker: b
    text: „Vaterhäuser“ sind größere, über die väterliche Abstammung verbundene Familien- oder Sippenverbände. Der hebräische Ausdruck kann auch mit „das Haus ihrer Väter breitete sich zu großer Zahl aus“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Diese
  rationale: Das pluralische Demonstrativpronomen verweist auf die zuvor genannten Männer; die knappe Form entspricht dem Hebräischen und ist im Zusammenhang eindeutig.
- source_word: הַבָּאִים בְּשֵׁמוֹת
  choice: namentlich Aufgeführten
  rationale: Das Partizip von בוא bedeutet wörtlich „kommend“, bezeichnet hier zusammen mit „mit Namen“ aber wahrscheinlich diejenigen, die im genealogischen Verzeichnis namentlich eingetragen oder aufgeführt sind.
- source_word: נְשִׂיאִים
  choice: Oberhäupter
  rationale: Das Wort bezeichnet führende Männer einer Sippe oder Stammesgruppe. „Oberhäupter“ gibt die soziale Leitungsstellung wieder, ohne eine monarchische Bedeutung wie bei „Fürsten“ nahezulegen.
- source_word: בְּמִשְׁפְּחוֹתָם
  choice: ihrer Sippen
  rationale: מִשְׁפָּחָה bezeichnet im genealogischen Zusammenhang eine größere verwandtschaftliche Einheit und nicht nur die moderne Kernfamilie.
- source_word: וּבֵית אֲבוֹתֵיהֶם
  choice: und ihre Vaterhäuser
  rationale: Der Ausdruck bezeichnet väterliche Abstammungs- und Haushaltsverbände. Der eingebürgerte biblische Begriff „Vaterhäuser“ bewahrt diese besondere soziale Bedeutung; eine Fußnote erläutert ihn.
- source_word: פָּרְצוּ לָרֹב
  choice: vermehrten sich stark
  rationale: פרץ beschreibt ein machtvolles Ausbreiten oder Anwachsen, während לָרֹב die große Zahl beziehungsweise Fülle hervorhebt. Die Formulierung gibt hier die starke zahlenmäßige Zunahme wieder.
