source:
  edition: WLC
  text: וְ/אֶשְׁתּ֗וֹן הוֹלִ֞יד אֶת בֵּ֤ית רָפָא֙ וְ/אֶת פָּסֵ֔חַ וְ/אֶת תְּחִנָּ֖ה אֲבִ֣י עִ֣יר נָחָ֑שׁ אֵ֖לֶּה אַנְשֵׁ֥י רֵכָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/012.yaml
  text: Eshton fathered Beth-rapha[a], Paseah, and Tehinnah, the father of Ir-nahash[b]. These were the men of Rekah.
translation:
  language: de
  text: Eschton zeugte Bet-Rafa, Paseach und Tehinna, den Vater[a] von Ir-Nahasch[b]. Diese waren die Männer von Recha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Geschlechtsregistern kann „Vater“ auch einen Vorfahren oder den Gründer eines Ortes beziehungsweise einer Sippe bezeichnen, nicht nur den unmittelbaren leiblichen Vater.
    reason: lexical_alternative
  - marker: b
    text: Ir-Nahasch kann „Stadt des Nahasch“ bedeuten; hier wird die Wendung wahrscheinlich als Ortsname gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet der Hifil von ילד das Hervorbringen von Nachkommenschaft. „Zeugte“ ist im Deutschen präzise, verständlich und für ein Geschlechtsregister angemessen.
- source_word: בֵּית רָפָא
  choice: Bet-Rafa
  rationale: Die Verbindung wird im onomastischen Zusammenhang als Eigenname behandelt und nicht wörtlich als „Haus Rafas“ wiedergegeben.
- source_word: פָּסֵחַ
  choice: Paseach
  rationale: Der Personenname wird nach gängiger deutscher Umschrift wiedergegeben.
- source_word: תְּחִנָּה
  choice: Tehinna
  rationale: Hier liegt ein Eigenname vor; deshalb wird das Wort nicht nach seiner sonst möglichen Bedeutung „Flehen“ übersetzt.
- source_word: אֲבִי עִיר נָחָשׁ
  choice: den Vater von Ir-Nahasch
  rationale: „Vater“ bewahrt die genealogische Ausdrucksweise des Hebräischen. Das Wort kann hier auch einen Vorfahren oder Gründer bezeichnen; diese Offenheit wird durch eine Fußnote erhalten. Ir-Nahasch wird im Namenskontext als Ortsname aufgefasst.
- source_word: אֵלֶּה אַנְשֵׁי רֵכָה
  choice: Diese waren die Männer von Recha
  rationale: „Männer von“ bildet אַנְשֵׁי formal ab und kann Angehörige eines Ortes oder einer Sippe bezeichnen. Das Präteritum fügt sich natürlich in den deutschen genealogischen Bericht.
- source_word: רֵכָה
  choice: Recha
  rationale: Der Eigen- beziehungsweise Ortsname wird in deutscher Umschrift wiedergegeben.
theological_decisions: []
