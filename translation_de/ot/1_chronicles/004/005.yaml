  text: וּ/לְ/אַשְׁחוּר֙ אֲבִ֣י תְק֔וֹעַ הָי֖וּ שְׁתֵּ֣י נָשִׁ֑ים חֶלְאָ֖ה וְ/נַעֲרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/005.yaml
  text: 'Ashhur the father of Tekoa had two wives: Helah and Naarah[a].'
translation:
  language: de
  text: 'Aschhur, der Vater von Tekoa[a], hatte zwei Frauen: Helah und Naara.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Gründer von Tekoa« beziehungsweise »der Stammvater von Tekoa«. In Geschlechtsregistern kann »Vater von« auch den Gründer einer Sippe oder einer Ortschaft bezeichnen und muss nicht den unmittelbaren leiblichen Vater meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַשְׁחוּר
  choice: Aschhur
  rationale: Die Präposition mit Konjunktion dient hier im genealogischen Zusammenhang als lockere Anknüpfung. Eine wörtliche Wiedergabe wie »Und für Aschhur« wäre im Deutschen unnatürlich; der Name kann unmittelbar als Satzgegenstand stehen.
- source_word: אֲבִי תְקוֹעַ
  choice: der Vater von Tekoa
  rationale: אָב kann in genealogischen Texten den leiblichen Vater, einen Vorfahren oder den Gründer beziehungsweise Stammvater eines Ortes oder einer Sippe bezeichnen. »Vater von Tekoa« wahrt die Ausdrucksweise und ihre Mehrdeutigkeit.
- source_word: הָיוּ
  choice: hatte
  rationale: Das Hebräische verwendet »waren«, doch die Konstruktion bezeichnet Besitz beziehungsweise Zuordnung. Im heutigen Deutschen gibt »hatte zwei Frauen« den Sinn idiomatisch wieder.
- source_word: שְׁתֵּי נָשִׁים
  choice: zwei Frauen
  rationale: Im Zusammenhang sind Ehefrauen gemeint. Das natürliche deutsche »Frauen« trägt diese eheliche Bedeutung in der Verbindung mit »hatte« und vermeidet unnötige Schwerfälligkeit.
- source_word: חֶלְאָה
  choice: Hela
  rationale: Der hebräische Eigenname wird nach geläufigen deutschen Transkriptionskonventionen als »Hela« wiedergegeben.
- source_word: וְנַעֲרָה
  choice: und Naara
  rationale: Die Konjunktion verbindet die beiden Namen; der Eigenname wird im Deutschen als »Naara« transkribiert.
theological_decisions:
- issue: Bedeutung von »Vater von Tekoa«
  choice: Die mehrdeutige genealogische Formulierung bleibt im Haupttext erhalten.
  alternative: »Gründer von Tekoa« oder »Stammvater von Tekoa«
  rationale: Der hebräische Ausdruck legt nicht eindeutig fest, ob unmittelbare Vaterschaft, Abstammung oder eine Gründerbeziehung gemeint ist. Eine Festlegung im Haupttext würde die genuine Offenheit des Textes einschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe genealogische Stil bleibt gewahrt; die hebräische Besitzkonstruktion wird idiomatisch wiedergegeben, während die Mehrdeutigkeit von »Vater« durch eine Fußnote sichtbar bleibt.
