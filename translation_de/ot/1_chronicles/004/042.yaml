  text: וּ/מֵ/הֶ֣ם מִן בְּנֵ֣י שִׁמְע֗וֹן הָלְכוּ֙ לְ/הַ֣ר שֵׂעִ֔יר אֲנָשִׁ֖ים חֲמֵ֣שׁ מֵא֑וֹת וּ/פְלַטְיָ֡ה וּ֠/נְעַרְיָה וּ/רְפָיָ֧ה וְ/עֻזִּיאֵ֛ל בְּנֵ֥י יִשְׁעִ֖י בְּ/רֹאשָֽׁ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/042.yaml
  text: And some of them[a], from the sons of Simeon, went to Mount Seir—five hundred men—with Pelatiah, Neariah, Rephaiah, and Uzziel, sons of Ishi, at their head.
translation:
  language: de
  text: Von ihnen, von den Söhnen Simeons, zogen fünfhundert Männer zum Berg Seïr. An ihrer Spitze standen Pelatja, Nearja, Refaja und Usiel, die Söhne Jischis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֵהֶם מִן בְּנֵי שִׁמְעוֹן
  choice: Von ihnen zogen einige aus den Reihen der Söhne Simeons
  rationale: Die Formulierung gibt den partitivischen Sinn von מֵהֶם und die genealogische Bezeichnung בְּנֵי שִׁמְעוֹן natürlich wieder, ohne das schlichte »Söhne Simeons« durch »Simeoniter« zu ersetzen.
- source_word: הָלְכוּ לְהַר שֵׂעִיר
  choice: zogen … zum Berg Seïr
  rationale: »Zogen« ist im Deutschen für die gemeinsame Bewegung einer größeren Männergruppe natürlicher als »gingen«, ohne ausdrücklich einen militärischen Marsch vorauszusetzen. הַר שֵׂעִיר wird als der herkömmliche geografische Name »Berg Seïr« wiedergegeben.
- source_word: אֲנָשִׁים חֲמֵשׁ מֵאוֹת
  choice: 500 Männer
  rationale: Die knappe Zahlenangabe entspricht der appositionellen hebräischen Formulierung und fügt keinen ausdrücklich militärischen Begriff wie »Truppe« hinzu.
- source_word: וּפְלַטְיָה וּנְעַרְיָה וּרְפָיָה וְעֻזִּיאֵל
  choice: Pelatja, Nearja, Refaja und Usiël
  rationale: Die Namen werden in für deutsche Bibeltexte geläufigen, am Hebräischen orientierten Formen transliteriert.
- source_word: בְּנֵי יִשְׁעִי
  choice: die Söhne Jischis
  rationale: Die genealogische Zuordnung der vier genannten Männer bleibt ausdrücklich erhalten.
- source_word: בְּרֹאשָׁם
  choice: An ihrer Spitze standen
  rationale: Die hebräische Wendung bedeutet wörtlich »an ihrer Spitze« und bezeichnet hier die leitende Stellung der unmittelbar zuvor genannten Söhne Jischis.
theological_decisions: []
