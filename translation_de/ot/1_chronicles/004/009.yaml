  text: וַ/יְהִ֣י יַעְבֵּ֔ץ נִכְבָּ֖ד מֵ/אֶחָ֑י/ו וְ/אִמּ֗/וֹ קָרְאָ֨ה שְׁמ֤/וֹ יַעְבֵּץ֙ לֵ/אמֹ֔ר כִּ֥י יָלַ֖דְתִּי בְּ/עֹֽצֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/009.yaml
  text: Jabez was more honored than his brothers[a], and his mother called his name Jabez, saying[b], “Because I bore him in pain.”
translation:
  language: de
  text: 'Jabez war angesehener als seine Brüder, und seine Mutter gab ihm den Namen Jabez[a], denn sie sagte: »Ich habe ihn unter Schmerzen[b] geboren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Jabez ähnelt im Hebräischen dem Wort für Schmerz oder Kummer in der Erklärung seiner Mutter.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mit Kummer«. Das hebräische Wort עֹצֶב kann Schmerz, Kummer oder Mühsal bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: war
  rationale: Die Erzählform mit היה leitet die Aussage ein. Im heutigen Deutschen genügt die finite Form ohne ein zusätzliches, im Hebräischen nicht ausdrücklich vorhandenes »nun«.
- source_word: יַעְבֵּץ
  choice: Jabez
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben; die Wiederholung erhält den Bezug zur anschließenden Namensdeutung.
- source_word: נִכְבָּד מֵאֶחָיו
  choice: angesehener als seine Brüder
  rationale: נִכְבָּד bezeichnet hier eine geehrte beziehungsweise hochgeachtete Stellung; מִן trägt im Zusammenhang die vergleichende Bedeutung »als«.
- source_word: קָרְאָה שְׁמוֹ
  choice: gab ihm den Namen
  rationale: Die hebräische Namensgebungsformel lautet wörtlich »rief seinen Namen«. Die gewählte deutsche Wendung ist natürlich und bewahrt den ausdrücklichen Vorgang der Namensgebung.
- source_word: לֵאמֹר
  choice: denn sie sagte
  rationale: Die Redeeinleitung wird mit dem kausalen Zusammenhang der folgenden Erklärung idiomatisch verbunden.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt die Begründung für die Namensgebung ein. »Denn« gibt diese Funktion in direkter Rede natürlich wieder.
- source_word: יָלַדְתִּי
  choice: ich habe ihn … geboren
  rationale: Das Verb bezeichnet das Gebären; das im Deutschen erforderliche Objekt »ihn« ergibt sich eindeutig aus dem Zusammenhang.
- source_word: בְּעֹצֶב
  choice: unter Schmerzen
  rationale: עֹצֶב kann Schmerz, Kummer oder Mühsal bezeichnen. Im Zusammenhang der Geburt liegt körperlicher Schmerz nahe, ohne dass die weiter reichende Bedeutung verschwiegen wird.
