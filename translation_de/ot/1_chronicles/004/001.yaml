  yaml_path: translation/ot/1_chronicles/004/001.yaml
  text: 'The sons of Judah: Perez[a], Hezron, Carmi, Hur, and Shobal.'
translation:
  language: de
  text: 'Die Söhne[a] Judas: Perez, Hezron, Karmi, Hur und Schobal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für »Söhne« kann in Stammbäumen sowohl unmittelbare Söhne als auch Nachkommen im weiteren Sinn bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Söhne
  rationale: Der Status constructus Plural von בֵּן bezeichnet in der genealogischen Liste »Söhne von«. Die direkte Formulierung wird beibehalten; dass damit auch Nachkommen in einem weiteren Sinn gemeint sein können, erläutert die Fußnote.
- source_word: יְהוּדָה
  choice: Judas
  rationale: Für den Stammvater Juda ist im Deutschen nach »Söhne« der Genitiv »Judas« idiomatisch und eindeutig.
- source_word: פֶּרֶץ
  choice: Perez
  rationale: Gebräuchliche moderne deutsche Wiedergabe des hebräischen Eigennamens.
- source_word: חֶצְרוֹן
  choice: Hezron
  rationale: Gebräuchliche deutsche Transliteration des hebräischen Eigennamens.
- source_word: כַרְמִי
  choice: Karmi
  rationale: Gebräuchliche deutsche Transliteration; der hebräische Anlaut כ wird hier mit K wiedergegeben.
- source_word: חוּר
  choice: Hur
  rationale: Gebräuchliche deutsche Wiedergabe des Eigennamens.
- source_word: שׁוֹבָל
  choice: Schobal
  rationale: Gebräuchliche deutsche Transliteration, bei der hebräisches שׁ durch »Sch« wiedergegeben wird.
- source_word: וְ
  choice: und
  rationale: Die wiederholte hebräische Konjunktion strukturiert eine einfache Aufzählung. Im natürlichen Deutschen stehen Kommas und nur vor dem letzten Namen »und«.
theological_decisions:
- issue: Genealogische Reichweite von בְּנֵי
  choice: Die wörtlich-nahe Bezeichnung »Söhne« bleibt im Haupttext stehen, ihre mögliche weitere Bedeutung wird in einer Fußnote offengehalten.
  alternative: »Nachkommen Judas«
  rationale: Die genannten Personen sind genealogisch nicht zwingend sämtlich unmittelbare Söhne Judas. Das Hebräische verwendet בְּנֵי jedoch und kann damit auch eine weiter gefasste Abstammungsbeziehung ausdrücken; die Übersetzung soll diese Spannung nicht stillschweigend auflösen.
translation_notes:
  register: Knapper, würdevoller genealogischer Stil in modernem Standarddeutsch. Die Eigennamen folgen gebräuchlichen deutschen Formen; die hebräische Reihung wird mit natürlicher deutscher Zeichensetzung wiedergegeben.
