lexical_decisions:
- source_word: וּ/בְ/בִלְהָה
  choice: und in Bilha
  rationale: Die Verbindung aus ו und ב wird in der Ortsliste natürlich mit „und in“ wiedergegeben. בִלְהָה ist hier ein Ortsname und wird als „Bilha“ transkribiert.
- source_word: וּ/בְ/עֶצֶם
  choice: in Ezem
  rationale: Die Präposition ב bezeichnet auch hier den Aufenthalts- beziehungsweise Siedlungsort. עֶצֶם wird als Ortsname „Ezem“ transkribiert; das wiederholte hebräische ו wird im Deutschen in der Aufzählung idiomatisch nicht bei jedem Glied wiedergegeben.
- source_word: וּ/בְ/תוֹלָד
  choice: und in Tolad
  rationale: Die gleiche hebräische Konstruktion setzt die Ortsliste fort. תוֹלָד wird als Eigenname „Tolad“ transkribiert.
