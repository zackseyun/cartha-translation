  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „bei Bilha … bei Ezem … bei Tolad“. Die hebräische Präposition ב kann in einer Liste von Orten auf beide Weisen wiedergegeben werden.'
