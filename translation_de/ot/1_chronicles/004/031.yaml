base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/031.yaml
  text: and in Beth-marcaboth[a], and in Hazar-susim, and in Beth-biri, and in Shaaraim[d][c][b]. These were their cities until David reigned.
translation:
  language: de
  text: und in Bet-Markabot[a], in Hazar-Susim[b], in Bet-Biri[c] und in Schaarajim[d]. Dies waren ihre Städte bis zur Königsherrschaft Davids.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bet-Markabot kann wörtlicher mit »Haus der Streitwagen« wiedergegeben werden; hier wird die Bezeichnung als Ortsname behandelt.
    reason: lexical_alternative
  - marker: b
    text: Hazar-Susim kann wörtlicher »Hof der Pferde« oder »Pferdedorf« bedeuten; hier wird die Bezeichnung als Ortsname behandelt.
    reason: lexical_alternative
  - marker: c
    text: Der Ortsname Bet-Biri kann auch Bet-Birei geschrieben werden.
    reason: alternative_reading
  - marker: d
    text: Schaarajim kann seiner Wortbildung nach etwa »zwei Tore« bedeuten; hier wird die Bezeichnung als Ortsname behandelt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/בֵית מַרְכָּבוֹת
  choice: und in Bet-Markabot
  rationale: Die Wortgruppe bezeichnet in der Siedlungsliste einen Ortsnamen. Daher wird sie nach geläufiger deutscher Bibelnamenkonvention transliteriert statt als »Haus der Streitwagen« übersetzt.
- source_word: וּ/בַ/חֲצַר סוּסִים
  choice: in Hazar-Susim
  rationale: Der Ausdruck wird parallel zu den umgebenden Namen als Toponym behandelt. Die Bestandteile könnten wörtlich »Hof der Pferde« beziehungsweise »Pferdedorf« bedeuten, doch der Listencharakter spricht für Transliteration.
- source_word: וּ/בְ/בֵית בִּרְאִי
  choice: in Bet-Biri
  rationale: Die Form wird als Ortsname verstanden und entsprechend transliteriert. Die Unsicherheit bei der Wiedergabe des zweiten Namensbestandteils wird in einer Fußnote erhalten.
- source_word: וּֽ/בְ/שַׁעֲרָיִם
  choice: und in Schaarajim
  rationale: Der Name wird als Toponym transliteriert. Ein möglicher etymologischer Bezug auf »zwei Tore« wird nicht in den Haupttext eingetragen, sondern als lexikalische Möglichkeit angemerkt.
- source_word: אֵלֶּה עָרֵי/הֶם
  choice: Dies waren ihre Städte
  rationale: Das Demonstrativpronomen weist auf die genannten Orte zurück. »Städte« ist eine direkte, im chronistischen Territorialregister angemessene Wiedergabe von עָרִים.
- source_word: עַד מְלֹךְ דָּוִיד
  choice: bis David König wurde
  rationale: Die Konstruktion mit עַד und dem Infinitiv constructus bezeichnet eine zeitliche Grenze. Die deutsche Formulierung ist natürlich und gibt hier den Beginn von Davids Königsherrschaft wieder.
