  source_fidelity: 'Der Haupttext trifft die Identifikation der Töpfer und der Bewohner von Netaïm und Gedera sowie das abschließende „sie wohnten dort“ grundsätzlich. Die Aufspaltung von בִּמְלַאכְתּוֹ in „und arbeiteten für ihn“ verändert jedoch die Satzverknüpfung: Im Hebräischen bestimmt „in/bei seiner Arbeit“ das Wohnen bzw. die Anwesenheit beim König und enthält kein eigenes Verb „arbeiten“.'
  naturalness: „Sie wohnten dort beim König, bei seiner Arbeit“ ist im Deutschen verständlich, aber stilistisch weniger glatt. „Beim König wohnten sie dort wegen seiner Arbeit“ ist natürlich, doch „wegen“ kann den Bezug leicht kausal verengen. Die revidierte Fassung bewahrt die hebräische Konstruktion mit einer knappen, verständlichen Präpositionalgruppe.
  terminology: „Töpfer“, „Netaïm“ und „Gedera“ sind angemessen. Die Fußnote sollte die Alternative zu וְיֹשְׁבֵי nicht als räumliches „zwischen“ festlegen; das Hebräische bedeutet „Bewohner von/bei“ und die beiden folgenden Ausdrücke können Appellativa sein. „Einfriedungen“ ist als mögliche Wiedergabe von גְּדֵרָה passend.
  issues:
