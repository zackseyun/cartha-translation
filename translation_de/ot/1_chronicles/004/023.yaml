    issue: Eigenständiges Verb „arbeiteten“ ergänzt
    rationale: בִּמְלַאכְתּוֹ ist eine Präpositionalphrase („in/bei seiner Arbeit“) und nicht ein finites Verb. „und arbeiteten für ihn“ macht aus der hebräischen Konstruktion eine koordinierte Aussage und legt „für ihn“ stärker als das Original fest.
  - severity: low
    issue: 'Fußnote: „zwischen Pflanzungen und Einfriedungen“'
    rationale: Das Partizip יֹשְׁבֵי mit den anschließenden Ausdrücken bezeichnet Bewohner von bzw. bei ihnen; „zwischen“ ist nicht im hebräischen Text ausgedrückt und sollte nicht als lexikalische Alternative eingeführt werden.
