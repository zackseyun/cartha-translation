base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/023.yaml
  text: These were the potters and the inhabitants of Netaim and Gederah[a]; they lived there with the king for his work.
translation:
  language: de
  text: Diese waren die Töpfer und die Bewohner von Netaïm und Gedera[a]. Beim König wohnten sie dort bei seiner Arbeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder vielleicht: „Diese waren die Töpfer und die Bewohner von Pflanzungen und Einfriedungen.“ Die hebräischen Wörter Netaïm und Gedera können als Ortsnamen oder als gewöhnliche Hauptwörter verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Diese waren
  rationale: Das selbstständige Pronomen weist auf die zuvor genannte Gruppe zurück; im Deutschen wird die kopulative Verbindung mit „waren“ ausgedrückt.
- source_word: הַיּוֹצְרִים
  choice: die Töpfer
  rationale: Die Bildung von יצר bezeichnet hier am wahrscheinlichsten Handwerker, die Ton formen; „Töpfer“ ist die konkrete und herkömmliche Bedeutung.
- source_word: וְיֹשְׁבֵי
  choice: und die Bewohner von
  rationale: Das Partizip im Status constructus bezeichnet ansässige Bewohner und verbindet sich natürlich mit den folgenden Ortsbezeichnungen.
- source_word: נְטָעִים
  choice: Netaïm
  rationale: Im genealogisch-geografischen Zusammenhang ist das Wort wahrscheinlich als Ortsname zu verstehen; die Schreibung mit Trema macht die getrennte Aussprache der Vokale deutlich.
- source_word: וּגְדֵרָה
  choice: und Gedera
  rationale: Parallel zu Netaïm wird das Wort wahrscheinlich als Ortsname gebraucht; die mögliche appellativische Bedeutung bleibt in der Fußnote erhalten.
- source_word: עִם הַמֶּלֶךְ
  choice: beim König
  rationale: עִם bedeutet grundsätzlich „mit“; „beim König“ bewahrt die unmittelbare Zuordnung, ohne vorschnell eine amtliche Dienststellung festzulegen.
- source_word: בִּמְלַאכְתּוֹ
  choice: und arbeiteten für ihn
  rationale: מְלָאכָה bezeichnet Arbeit, Tätigkeit oder Dienst. Die verbale Wiedergabe ist im modernen Deutschen natürlich und macht deutlich, dass ihre Tätigkeit dem König galt.
- source_word: יָשְׁבוּ שָׁם
  choice: Sie wohnten dort
  rationale: ישב mit שָׁם bezeichnet hier den Aufenthalt beziehungsweise Wohnsitz an diesem Ort.
