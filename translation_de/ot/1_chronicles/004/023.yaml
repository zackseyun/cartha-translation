translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die mehrdeutigen geografischen beziehungsweise appellativischen Ausdrücke werden im Haupttext als Ortsnamen wiedergegeben und in der Fußnote offengehalten. Die königliche Zuordnung wird natürlich formuliert, ohne eine spezifische institutionelle Dienstform einzutragen.
