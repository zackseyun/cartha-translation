id: 1CH.4.4
reference: 1 Chronicles 4:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/פְנוּאֵל֙ אֲבִ֣י גְדֹ֔ר וְ/עֵ֖זֶר אֲבִ֣י חוּשָׁ֑ה אֵ֤לֶּה בְנֵי חוּר֙ בְּכ֣וֹר אֶפְרָ֔תָה אֲבִ֖י בֵּ֥ית לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/004.yaml
  text: Penuel[a], the father of Gedor, and Ezer, the father of Hushah—these were the sons of Hur, the firstborn of Ephrathah[b], the father of Bethlehem.
translation:
  language: de
  text: Penuël[a], der Vater[b] von Gedor, und Eser, der Vater von Huscha – das sind die Söhne Hurs, des Erstgeborenen Efratas, des Vaters von Bethlehem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name erscheint an anderen Stellen auch in der Form »Peniël«; beide Schreibungen sind Varianten desselben Namens.
    reason: lexical_alternative
  - marker: b
    text: »Vater von« kann in diesem genealogischen Zusammenhang auch »Gründer von«, »Stammvater von« oder das Oberhaupt einer Ortschaft beziehungsweise Sippe bedeuten. Das gilt ebenso für die weiteren Vorkommen der Wendung in diesem Vers.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנוּאֵל
  choice: Penuël
  rationale: Der Personenname wird nach der hier vorliegenden hebräischen Form wiedergegeben; das Trema zeigt im Deutschen die getrennte Aussprache der Vokale an.
- source_word: אֲבִי
  choice: Vater von
  rationale: Die formale Wiedergabe bewahrt die hebräische Verwandtschafts- und Zuordnungsformel. Bei Orten oder Sippen kann sie zugleich Gründer, Stammvater oder Oberhaupt bezeichnen; darauf weist die Fußnote hin.
- source_word: גְדֹר
  choice: Gedor
  rationale: Eigenname eines Ortes oder einer Sippe; daher transliteriert.
- source_word: עֵזֶר
  choice: Eser
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren lautnahen Form wiedergegeben.
- source_word: חוּשָׁה
  choice: Huscha
  rationale: Eigenname eines Ortes oder einer Sippe; die deutsche Umschrift gibt שׁ mit „sch“ wieder.
- source_word: אֵלֶּה
  choice: das sind
  rationale: Der hebräische Nominalsatz enthält keine ausdrücklich markierte Zeitstufe. Das Präsens ist für eine genealogische Identifikation im Deutschen natürlich und erhält diese Offenheit.
- source_word: בְנֵי
  choice: die Söhne
  rationale: Die wörtliche Verwandtschaftsbezeichnung wird beibehalten; je nach genealogischem Zusammenhang kann sie auch weiter gefasst sein.
- source_word: חוּר
  choice: Hur
  rationale: Personenname; transliteriert.
- source_word: בְּכֹר
  choice: der Erstgeborene
  rationale: Die Statusbezeichnung wird ohne den im Hebräischen nicht ausdrücklich stehenden Zusatz „Sohn“ wiedergegeben.
- source_word: אֶפְרָתָה
  choice: Efrata
  rationale: Eigenname in einer etablierten deutschen Umschrift.
- source_word: בֵּית לָחֶם
  choice: Bethlehem
  rationale: Der im Deutschen etablierte Ortsname wird verwendet, statt die Namensbestandteile wörtlich zu übersetzen.
theological_decisions:
- issue: Bezug der Schlussformel אֲבִי בֵּית לָחֶם
  choice: „des Vaters von Bethlehem“ wird auf Hur bezogen.
  alternative: Bezug auf Efrata oder allgemeinere Wiedergabe als „Gründer/Stammvater Bethlehems“.
  rationale: 'Kasus und Satzbau der deutschen Wiedergabe spiegeln die naheliegende Abfolge der hebräischen Appositionen: Hur ist der Erstgeborene Efratas und der „Vater“ Bethlehems. Die semantische Weite von „Vater“ wird nicht dogmatisch festgelegt, sondern in der Fußnote offengehalten.'
translation_notes:
  register: Moderne, würdevolle Standardsprache mit weitgehend erhaltener genealogischer Satzstruktur. Die Eigennamen folgen einer deutsch lesbaren Umschrift. Der Gedankenstrich gliedert den langen Nominalsatz, ohne seine Beziehungen aufzulösen.
