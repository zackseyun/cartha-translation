base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/039.yaml
  text: They went to the entrance of Gedor[a], as far as the east side of the valley[b], to seek pasture for their flocks.
translation:
  language: de
  text: Sie zogen zum Zugang zu Gedor[a], bis zur Ostseite des Tals[b], um Weideland für ihre Herden zu suchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Zugang nach Gedor“. Das hebräische Wort kann einen Eingang, einen Zugang oder einen Zugangsweg zu einem Ort bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „östlich des Tals“ oder „in östlicher Richtung vom Tal aus“. Der hebräische Ausdruck ist eine knappe topografische Angabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Sie zogen
  rationale: Das Wayyiqtol von הלך führt die Erzählung fort. „Sie zogen“ klingt bei einer Gruppe auf der Suche nach Weideland natürlich und gibt die räumliche Bewegung wieder.
- source_word: לִמְבוֹא
  choice: zum Zugang von
  rationale: מָבוֹא kann Eingang, Zugang oder Annäherungsweg bezeichnen. „Zugang“ bewahrt den räumlichen Sinn, ohne einen befestigten Eingang vorauszusetzen.
- source_word: גְדֹר
  choice: Gedor
  rationale: Der Ortsname wird transliteriert und nicht übersetzt.
- source_word: עַד
  choice: bis
  rationale: עַד bezeichnet hier die räumliche Ausdehnung beziehungsweise das erreichte Ziel.
- source_word: לְמִזְרַח
  choice: zur Ostseite
  rationale: מִזְרָח bezeichnet Osten oder eine östliche Richtung. Im knappen topografischen Ausdruck gibt „Ostseite“ eine mögliche konkrete Lokalisierung wieder; die Mehrdeutigkeit wird in der Fußnote erhalten.
- source_word: הַגָּיְא
  choice: des Tals
  rationale: גַּיְא bezeichnet ein Tal oder eine Schlucht. „Tal“ ist im Deutschen der natürliche, weniger einengende Oberbegriff.
- source_word: לְבַקֵּשׁ
  choice: um … zu suchen
  rationale: Der Infinitiv von בקש drückt den Zweck der Wanderung aus.
- source_word: מִרְעֶה
  choice: Weideland
  rationale: Das Wort bezeichnet Weide beziehungsweise einen Weideplatz. „Weideland“ passt hier als gesuchtes Gelände besonders gut.
- source_word: לְצֹאנָם
  choice: für ihre Herden
  rationale: צֹאן kann Schafe und Ziegen zusammen bezeichnen. „Herden“ wahrt diesen umfassenden Sinn, ohne die Tierart unnötig festzulegen.
