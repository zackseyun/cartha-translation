source:
  edition: WLC
  text: וַֽ/יִּמְצְא֤וּ מִרְעֶה֙ שָׁמֵ֣ן וָ/ט֔וֹב וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם וְ/שֹׁקֶ֖טֶת וּ/שְׁלֵוָ֑ה כִּ֣י מִן חָ֔ם הַ/יֹּשְׁבִ֥ים שָׁ֖ם לְ/פָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/040.yaml
  text: And they found rich and good pasture[a], and the land was broad, quiet, and peaceful, for those from Ham who had lived there formerly were there before.
translation:
  language: de
  text: Sie fanden dort üppiges, gutes Weideland. Das Land war weitläufig, ruhig und friedlich, denn die Menschen, die früher dort gewohnt hatten, stammten von Ham ab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִרְעֶה
  choice: Weideland
  rationale: Das Substantiv bezeichnet einen Ort zum Weiden; „Weideland“ passt natürlich zum Zusammenhang der Herden und bezeichnet deutlicher eine Fläche als das abstraktere „Weide“.
- source_word: שָׁמֵן
  choice: üppig
  rationale: Wörtlich „fett“; auf Weideland bezogen bezeichnet das Wort reichen, fruchtbaren Bewuchs. „Üppig“ gibt diesen idiomatischen Sinn in natürlichem Deutsch wieder.
- source_word: טוֹב
  choice: gut
  rationale: Das einfache positive Werturteil des hebräischen Adjektivs bleibt erhalten.
- source_word: רַחֲבַת יָדַיִם
  choice: weitläufig
  rationale: Die Wendung bedeutet wörtlich etwa „weit an beiden Seiten“ und beschreibt ein geräumiges, ausgedehntes Land.
- source_word: שֹׁקֶטֶת
  choice: ruhig
  rationale: Das Partizip beschreibt das Land als ungestört oder in Ruhe.
- source_word: שְׁלֵוָה
  choice: friedlich
  rationale: Das Wort kann Ruhe, Sicherheit oder ungestörtes Wohlergehen bezeichnen. Zusammen mit „ruhig“ bringt „friedlich“ den Zustand verständlich zum Ausdruck, ohne wirtschaftlichen Wohlstand hineinzulesen.
- source_word: כִּי מִן חָם הַיֹּשְׁבִים שָׁם לְפָנִים
  choice: denn die Menschen, die früher dort gewohnt hatten, stammten von Ham ab
  rationale: Die elliptische hebräische Formulierung besagt, dass die früher dort Wohnenden „von Ham“ waren. „Stammten von Ham ab“ macht die Abstammungsangabe im Deutschen natürlich und eindeutig, ohne ein nicht vorhandenes Mengenwort wie „einige“ einzufügen.
- source_word: חָם
  choice: Ham
  rationale: Der überlieferte deutsche Name der biblischen Person wird beibehalten.
theological_decisions: []
