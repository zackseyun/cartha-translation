base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/021.yaml
  text: 'The sons of Shelah son of Judah: Er the father of Lecah[a], and Laadah the father of Mareshah, and the clans of the house of linen workers of the house of Ashbea.'
translation:
  language: de
  text: 'Die Söhne Schelas, des Sohnes Judas: Er, der Vater von Lecha, und Laada, der Vater von Marescha, sowie die Sippen des Hauses der Leinenarbeit in Bet-Aschbea.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Formulierung ist stark verkürzt. Wörtlicher etwa: »die Sippen des Hauses der Arbeit mit feinem Leinen in Bet-Aschbea«. »Vater von« kann hier außerdem »Stammvater von« oder »Gründer von« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Bewahrt die ausdrückliche genealogische Formulierung des Hebräischen; in diesem Zusammenhang können auch Nachkommen gemeint sein.
- source_word: שֵׁלָה בֶן יְהוּדָה
  choice: Schelas, des Sohnes Judas
  rationale: Gibt die Abstammungsangabe ausdrücklich wieder und verwendet im Deutschen geläufige biblische Namensformen.
- source_word: אֲבִי
  choice: der Vater von
  rationale: Die formale Wiedergabe wahrt die genealogische Bildsprache; je nach Orts- oder Sippenbezug kann auch Stammvater oder Gründer gemeint sein.
- source_word: לֵכָה
  choice: Lecha
  rationale: Transliteration des möglicherweise als Ort oder Sippe verstandenen Eigennamens.
- source_word: לַעְדָּה
  choice: Laada
  rationale: Transliteration des Personennamens in einer für modernes Deutsch lesbaren Form.
- source_word: מָרֵשָׁה
  choice: Marescha
  rationale: Verwendet die im Deutschen übliche biblische Namensform.
- source_word: מִשְׁפְּחוֹת
  choice: die Sippen
  rationale: Bezeichnet hier am treffendsten größere genealogische Verwandtschaftsgruppen.
- source_word: בֵּית עֲבֹדַת הַבֻּץ
  choice: des Hauses der Leinenarbeiter
  rationale: Gibt die verdichtete Wendung als ein durch Verwandtschaft oder Gewerbe verbundenes Haus wieder; בוץ bezeichnet Leinen, oft feines Leinen.
- source_word: לְבֵית אַשְׁבֵּעַ
  choice: vom Haus Aschbea
  rationale: Bewahrt den Bezug auf ein Haus namens Aschbea, ohne dieses sicher als Ortsnamen festzulegen; die Präposition ל bezeichnet hier wahrscheinlich Zugehörigkeit oder Zuordnung.
theological_decisions: []
translation_notes:
  register: Moderne, würdige genealogische Prosa. Die ungewöhnliche Häufung von »Haus« bleibt erhalten, weil sie die Mehrdeutigkeit der komprimierten hebräischen Konstruktion besser wahrt als eine glättende Ortsangabe.
