id: 1CH.4.14
reference: 1 Chronicles 4:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מְעוֹנֹתַ֖י הוֹלִ֣יד אֶת עָפְרָ֑ה וּ/שְׂרָיָ֗ה הוֹלִ֤יד אֶת יוֹאָב֙ אֲבִי֙ גֵּ֣יא חֲרָשִׁ֔ים כִּ֥י חֲרָשִׁ֖ים הָיֽוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/014.yaml
  text: Meonothai fathered Ophrah[a], and Seraiah fathered Joab, the father of Ge-harashim[b], for they were craftsmen.
translation:
  language: de
  text: Meonotai zeugte Ofra, und Seraja zeugte Joab, den Vater[b] von Ge-Haraschim[a]; denn sie waren Handwerker.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge-Haraschim bedeutet wahrscheinlich „Tal der Handwerker“. Das Hebräische behandelt die Wendung als Ortsnamen und erklärt sie anschließend mit dem Hinweis auf die Handwerker.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Gründer von Ge-Haraschim“. In genealogischen Zusammenhängen kann „Vater“ auch einen Gründer oder den Stammvater einer Gruppe bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְעוֹנֹתַי
  choice: Meonotai
  rationale: Hebräischer Personenname; in einer dem Hebräischen angenäherten deutschen Umschrift wiedergegeben.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Die Hifil-Form von ילד bezeichnet in diesem genealogischen Zusammenhang das Hervorbringen beziehungsweise Zeugen eines Nachkommen; „zeugte“ ist knapp und wahrt den genealogischen Charakter.
- source_word: עָפְרָה
  choice: Ofra
  rationale: Eigenname; die deutsche Umschrift gibt den hebräischen Namen verständlich und ohne unnötige Anglisierung wieder.
- source_word: שְׂרָיָה
  choice: Seraja
  rationale: Eigenname in gebräuchlicher deutscher Bibelnamensform.
- source_word: יוֹאָב
  choice: Joab
  rationale: Gebräuchliche deutsche Form des hebräischen Eigennamens.
- source_word: אֲבִי
  choice: den Vater von
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt im Haupttext erhalten; bei einem Ortsnamen kann sie jedoch auch „Gründer“ oder „Stammvater“ bedeuten, was die Fußnote ausweist.
- source_word: גֵּיא חֲרָשִׁים
  choice: Ge-Haraschim
  rationale: Die Verbindung wird als Ortsname transliteriert. Ihre erkennbare Bedeutung „Tal der Handwerker“ wird in einer Fußnote erläutert, während der Namenscharakter im Haupttext gewahrt bleibt.
- source_word: כִּי
  choice: denn
  rationale: Leitet eine Begründung beziehungsweise Namenserklärung ein.
- source_word: חֲרָשִׁים
  choice: Handwerker
  rationale: Der Ausdruck bezeichnet allgemein fachkundige Handwerker und sollte nicht ohne weiteren Hinweis auf Schmiede oder eine bestimmte handwerkliche Berufsgruppe verengt werden.
- source_word: הָיוּ
  choice: sie waren
  rationale: Die einfache Kopula wird direkt wiedergegeben; der nicht ausdrücklich genannte Bezug von „sie“ bleibt wie im Hebräischen offen.
theological_decisions:
- issue: Bedeutung von „Vater“ bei einem Ortsnamen
  choice: Die wörtliche Formulierung „Vater von“ bleibt im Haupttext stehen.
  alternative: „Gründer von“ oder „Stammvater der Bewohner von“
  rationale: Der hebräische Ausdruck kann sowohl eine verwandtschaftliche als auch eine gründende beziehungsweise führende Beziehung bezeichnen. Die Übersetzung soll diese Mehrdeutigkeit nicht vorschnell auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper genealogischer Satzstruktur. Die Eigennamen folgen deutschen beziehungsweise hebraisch orientierten Formen. Der Ortsname bleibt transliteriert; seine Bedeutung und die Mehrdeutigkeit von „Vater“ werden in den Fußnoten erläutert.
