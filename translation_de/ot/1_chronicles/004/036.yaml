base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/036.yaml
  text: and Elioenai, and Jaakobah, and Jeshohaiah, and Asaiah, and Adiel, and Jesimiel, and Benaiah.
translation:
  language: de
  text: Und Eljoënai und Jaakoba und Jeschochaja und Asaja und Adiël und Jesimiël und Benaja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְיוֹעֵינַי
  choice: Eljoënai
  rationale: Hebräische Personenbezeichnung in einer im Deutschen lesbaren, zugleich quellennahen Umschrift; die Trema kennzeichnet die getrennte Aussprache der Vokale.
- source_word: יַעֲקֹבָה
  choice: Jaakoba
  rationale: Quellennahe deutsche Umschrift des Eigennamens; die doppelte Vokalfolge bewahrt die Silbenstruktur besser als die eingedeutschte Form „Jakoba“.
- source_word: יְשׁוֹחָיָה
  choice: Jeschochaja
  rationale: Deutsche Umschrift mit „sch“ für שׁ und „j“ für י; die Namensform wird nicht inhaltlich übersetzt.
- source_word: עֲשָׂיָה
  choice: Asaja
  rationale: Lesbare deutsche Bibelnamensform, die den hebräischen Eigennamen angemessen wiedergibt.
- source_word: עֲדִיאֵל
  choice: Adiël
  rationale: Quellennahe Umschrift; die Trema macht deutlich, dass i und e zu verschiedenen Silben gehören.
- source_word: יְשִׂימִיאֵל
  choice: Jesimiël
  rationale: Deutsche Umschrift des Eigennamens; die Trema verdeutlicht die Silbentrennung vor dem Gottesnamenselement „El“.
- source_word: בְּנָיָה
  choice: Benaja
  rationale: Im Deutschen geläufige und zugleich quellennah gebildete Form des hebräischen Personennamens.
- source_word: וְ / וַ / וִ / וּ
  choice: und
  rationale: Das jedem Namen vorangestellte Waw wird jeweils mit „und“ wiedergegeben, um den polysyndetischen Listenstil des Hebräischen zu bewahren.
