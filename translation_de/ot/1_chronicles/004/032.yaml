base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/032.yaml
  text: And their settlements were Etam[a], Ain, Rimmon, Tochen, and Ashan—five cities.
translation:
  language: de
  text: Zu ihren Ortschaften[a] gehörten Etam, Ajin, Rimmon, Tochen und Aschan – fünf Städte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Dörfer“. Das hebräische Wort kann kleinere Siedlungen oder umfriedete Wohnplätze bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: ihre Ortschaften
  rationale: חָצֵר kann eine kleinere Siedlung, ein Dorf oder einen umfriedeten Wohnplatz bezeichnen. „Ortschaften“ ist im Deutschen natürlich und bewahrt die Bedeutungsbreite im topografischen Zusammenhang.
- source_word: עֵיטָם
  choice: Etam
  rationale: Ortsname; in üblicher deutscher Form transliteriert.
- source_word: עַיִן
  choice: Ajin
  rationale: Im Kontext einer Ortsliste als Eigenname verstanden und entsprechend transliteriert; die möglichen gemeinsprachlichen Bedeutungen „Auge“ oder „Quelle“ sind hier nicht gemeint.
- source_word: רִמּוֹן
  choice: Rimmon
  rationale: Ortsname; transliteriert, nicht nach der gemeinsprachlichen Bedeutung „Granatapfel“ übersetzt.
- source_word: תֹכֶן
  choice: Tochen
  rationale: Ortsname; die Form gibt den hebräischen Namen in einer für deutsche Leser verständlichen Transliteration wieder.
- source_word: עָשָׁן
  choice: Aschan
  rationale: Ortsname; nach deutscher Lautkonvention transliteriert.
- source_word: עָרִים חָמֵשׁ
  choice: fünf Städte
  rationale: עִיר bezeichnet eine Stadt oder Ortschaft. „Städte“ entspricht der üblichen Wiedergabe und der abschließenden Zählung der genannten Orte.
