  text: וּ/בְנֵ֖י חֶלְאָ֑ה צֶ֥רֶת יצחר וְ/אֶתְנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/007.yaml
  text: 'And the sons of Helah: Zereth[a], Izhar[b], and Ethnan.'
translation:
  language: de
  text: 'Und die Söhne[a] Helas: Zeret, Jizhar und Etnan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genealogische Formel „Söhne“ kann unmittelbare Söhne oder allgemeiner Nachkommen beziehungsweise Angehörige einer Familienlinie bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Das ו wird als schlichte Verknüpfung mit „Und“ wiedergegeben. בְנֵי ist die übliche genealogische Konstruktform „Söhne von“ und kann je nach Zusammenhang auch Angehörige einer Nachkommenlinie bezeichnen.
- source_word: חֶלְאָה
  choice: Hela
  rationale: Der Personenname wird nach gängiger deutscher Bibelnamenkonvention transkribiert; die Endung ה wird mit „a“ wiedergegeben.
- source_word: צֶרֶת
  choice: Zeret
  rationale: Der Eigenname wird lautnah ins Deutsche übertragen; ת erscheint als „t“, nicht nach englischer Konvention als „th“.
- source_word: יצחר
  choice: Jizhar
  rationale: Die unpunktierte Namensform wird entsprechend der masoretischen Lesetradition und der gebräuchlichen deutschen Schreibweise als „Jizhar“ wiedergegeben.
- source_word: וְאֶתְנָן
  choice: und Etnan
  rationale: Das Präfix ו verbindet den letzten Namen mit der Reihe; der Eigenname wird nach deutscher Konvention als „Etnan“ transkribiert.
theological_decisions:
- issue: Bedeutungsumfang der genealogischen Formel „Söhne“
  choice: Die formale Wiedergabe „Söhne“ bleibt im Haupttext erhalten.
  alternative: „Nachkommen“ oder „Angehörige der Linie“
  rationale: בְנֵי bezeichnet wörtlich „Söhne“, kann in Genealogien jedoch weiter gefasst sein. Der Haupttext bewahrt die konkrete hebräische Form; eine Fußnote weist auf den möglichen weiteren Sinn hin.
translation_notes:
  register: Knappes, würdevolles Standarddeutsch im Stil einer genealogischen Aufzählung. Deutsche statt englische Transkriptionskonventionen wurden verwendet. Die im englischen Beratungstext an Zeret gesetzte Fußnote zur möglichen Namensform „Heleh“ betrifft offenbar Hela und ist durch die hebräische Form חֶלְאָה nicht als echte textliche Alternative geboten; daher wurde sie nicht übernommen.
