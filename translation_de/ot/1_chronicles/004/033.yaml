  text: וְ/כָל חַצְרֵי/הֶ֗ם אֲשֶׁ֧ר סְבִיב֛וֹת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה עַד בָּ֑עַל זֹ֚את מוֹשְׁבֹתָ֔/ם וְ/הִתְיַחְשָׂ֖/ם לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/033.yaml
  text: And all their villages that were around these cities, as far as Baal—these were their settlements, and they had their genealogy recorded.
translation:
  language: de
  text: Und alle ihre Dörfer[a], die rings um diese Städte lagen, bis Baal – das waren ihre Wohnorte, und sie hatten ihre Geschlechtsregister[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Gehöfte“ oder „ihre Siedlungen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und sie waren nach ihren Geschlechtern verzeichnet“. Der hebräische Ausdruck bezeichnet eine genealogische Registrierung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: ihre Dörfer
  rationale: חָצֵר kann einen umfriedeten Platz, einen Hof oder eine kleinere Siedlung bezeichnen. Im Zusammenhang der bewohnten Orte um die genannten Städte gibt „Dörfer“ den geografischen Sinn natürlich wieder.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: die rings um diese Städte lagen
  rationale: Die Wendung beschreibt die Lage der Dörfer im Umkreis der zuvor genannten Städte; „rings um“ gibt סְבִיבוֹת prägnant wieder.
- source_word: עַד בָּעַל
  choice: bis nach Baal
  rationale: עַד bezeichnet hier die räumliche Ausdehnung bis zu einem Grenz- oder Zielort; Baal wird als Ortsname beibehalten.
- source_word: זֹאת
  choice: das waren
  rationale: Das formal feminine Singularpronomen fasst die vorherige Ortsangabe zusammen. Im Deutschen ist „das waren“ mit dem pluralischen Prädikatsnomen idiomatisch und bewahrt die zusammenfassende Funktion.
- source_word: מוֹשְׁבֹתָם
  choice: ihre Wohnorte
  rationale: מוֹשָׁב bezeichnet einen Wohn- oder Siedlungsort. „Wohnorte“ vermeidet eine unnötige Wiederholung von „Dörfer“ und bleibt dem hebräischen Ausdruck nahe.
- source_word: וְהִתְיַחְשָׂם לָהֶם
  choice: und sie waren genealogisch verzeichnet
  rationale: Der Hitpael von יחס bezeichnet die genealogische Zuordnung beziehungsweise Registrierung. Die knappe deutsche Passivform gibt den Sinn verständlich wieder, ohne die komprimierte hebräische Aussage weiter auszudeuten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geografische Aufzählung bleibt knapp; der Gedankenstrich bildet die zusammenfassende Funktion von זֹאת ab. Die genealogische Wendung wird verständlich, aber ohne konfessionelle oder interpretative Zusätze wiedergegeben.
