  text: בְּנֵ֖י שִׁמְע֑וֹן נְמוּאֵ֣ל וְ/יָמִ֔ין יָרִ֖יב זֶ֥רַח שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/024.yaml
  text: 'The sons of Simeon: Nemuel[a], Jamin, Jarib, Zerah[c][b], and Shaul.'
translation:
  language: de
  text: 'Die Söhne Simeons: Nemuel[a], Jamin, Jarib, Serach[b] und Schaul[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In den Parallelgenealogien in 1. Mose 46,10 und 2. Mose 6,15 heißt er Jemuel; der hebräische Text an dieser Stelle lautet Nemuel.
    reason: alternative_reading
  - marker: b
    text: In den Parallelgenealogien in 1. Mose 46,10 und 2. Mose 6,15 steht für Serach die Namensform Zohar.
    reason: textual_variant
  - marker: c
    text: Schaul ist die hebräische Form des Namens, der im Deutschen gewöhnlich als Saul wiedergegeben wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Der Status constructus im Plural leitet eine genealogische Liste namentlich genannter Söhne ein; die direkte Wiedergabe ist hier präziser als „Nachkommen“.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: נְמוּאֵל
  choice: Nemuel
  rationale: Der Name folgt der hebräischen Form dieses Verses; die abweichende Form Jemuel in der Parallelüberlieferung wird in einer Fußnote genannt.
- source_word: וְיָמִין
  choice: Jamin
  rationale: Der Personenname wird nach üblicher deutscher Transkription wiedergegeben. Die Konjunktion wird im Deutschen natürlich vor dem letzten Glied der Aufzählung gesetzt statt bereits hier.
- source_word: יָרִיב
  choice: Jarib
  rationale: Der Eigenname wird transkribiert und nicht nach seiner möglichen lexikalischen Bedeutung übersetzt.
- source_word: זֶרַח
  choice: Serach
  rationale: Diese Form gibt זֶרַח nach üblicher deutscher biblischer Namenstradition wieder; die abweichende Form Zohar in den Parallelgenealogien bleibt als Fußnote erhalten.
- source_word: שָׁאוּל
  choice: Schaul
  rationale: Die Transkription bildet die hebräische Namensform transparent und deutsch lesbar ab; „Saul“ ist die vertraute eingedeutschte Form.
theological_decisions: []
