  text: וְ/אִשְׁתּ֣/וֹ הַ/יְהֻדִיָּ֗ה יָלְדָ֞ה אֶת יֶ֨רֶד אֲבִ֤י גְדוֹר֙ וְ/אֶת חֶ֨בֶר֙ אֲבִ֣י שׂוֹכ֔וֹ וְ/אֶת יְקֽוּתִיאֵ֖ל אֲבִ֣י זָנ֑וֹחַ וְ/אֵ֗לֶּה בְּנֵי֙ בִּתְיָ֣ה בַת פַּרְעֹ֔ה אֲשֶׁ֥ר לָקַ֖ח מָֽרֶד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/018.yaml
  text: And his wife the Jewess bore Jered the father of Gedor[a], Heber the father of Soco, and Jekuthiel the father of Zanoah. These are the sons of Bithiah daughter of Pharaoh[c][b], whom Mered took as wife.
translation:
  language: de
  text: Und seine Frau aus Juda[a] gebar Jered, den Vater von Gedor[b], Heber, den Vater von Socho, und Jekutiël, den Vater von Sanoach. Dies sind die Söhne Bitjas, der Tochter des Pharaos[c], die Mered zur Frau nahm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine judäische Frau“ oder „seine jüdische Frau“.'
    reason: lexical_alternative
  - marker: b
    text: „Vater von“ kann in den Chronikbüchern auch einen Gründer, Ahnherrn oder Sippenführer bezeichnen, der mit einem Ort verbunden ist.
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Satz ist schwierig. Umstritten ist, ob „seine Frau aus Juda“ und Bitja, die Tochter des Pharaos, dieselbe Frau oder verschiedene Frauen Mereds sind.
    reason: alternative_reading
lexical_decisions:
- source_word: הַיְהֻדִיָּה
  choice: seine judäische Frau
  rationale: Das feminine Ethnikon bezeichnet eine Frau aus Juda beziehungsweise eine Judäerin. „Judäische Frau“ ist im Deutschen natürlich, würdevoll und vermeidet die heute leicht missverständliche zeitliche Einengung von „Jüdin“.
- source_word: יָלְדָה
  choice: gebar
  rationale: Die knappe genealogische Formel wird mit dem passenden deutschen Verb „gebären“ wiedergegeben.
- source_word: אֲבִי
  choice: den Vater von
  rationale: Die formale Wiedergabe bewahrt die hebräische Ausdrucksweise und legt nicht fest, ob ein leiblicher Vater, Ahnherr, Gründer oder Sippenoberhaupt gemeint ist.
- source_word: שׂוֹכוֹ
  choice: Socho
  rationale: Der Ortsname wird in einer im Deutschen etablierten bibelsprachlichen Transliteration wiedergegeben.
- source_word: יְקוּתִיאֵל
  choice: Jekutiël
  rationale: Der Personenname wird quellennah transliteriert; das Trema zeigt die getrennte Aussprache der Vokale an.
- source_word: זָנוֹחַ
  choice: Sanoach
  rationale: Der Ortsname wird nach gebräuchlicher deutscher Bibeltransliteration wiedergegeben.
- source_word: בְּנֵי
  choice: Söhne
  rationale: Das ausdrücklich männliche hebräische Substantiv wird in diesem genealogischen Zusammenhang direkt wiedergegeben.
- source_word: בִּתְיָה בַת פַּרְעֹה
  choice: Bitjas, der Tochter des Pharaos
  rationale: Die Apposition und das Verwandtschaftsverhältnis bleiben ausdrücklich erhalten.
- source_word: לָקַח
  choice: zur Frau nahm
  rationale: Im ehelichen Kontext bezeichnet לקח das Nehmen einer Frau zur Ehe; die deutsche Formulierung ist klar und bleibt der hebräischen Wendung nahe.
- source_word: וְאֵלֶּה
  choice: Dies sind
  rationale: Die Wendung leitet eine zusammenfassende Zuordnung ein; das anfängliche Bindewort muss im Deutschen nicht eigens ausgedrückt werden.
theological_decisions:
- issue: Verhältnis zwischen „seiner judäischen Frau“ und „Bitja, der Tochter des Pharaos“
  choice: Die schwierige hebräische Abfolge bleibt im Haupttext bestehen, ohne beide Bezeichnungen gleichzusetzen oder ausdrücklich zwei Frauen anzunehmen.
  alternative: „Die judäische Frau“ mit Bitja identifizieren oder durch Umstellung beziehungsweise Textänderung deutlicher zwischen zwei Frauen unterscheiden.
  rationale: Die Syntax lässt die genaue Beziehung offen. Eine Entscheidung im Haupttext würde eine umstrittene genealogische Zuordnung festschreiben, die der überlieferte Wortlaut nicht eindeutig macht.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knapper genealogischer Satzführung. Die Eigennamen folgen geläufigen deutschen Bibelformen. Die echte syntaktische Spannung des hebräischen Textes wird nicht harmonisiert; alle Fußnotenmarker stehen an den einschlägigen Stellen im Haupttext.
