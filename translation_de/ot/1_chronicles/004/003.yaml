  text: וְ/אֵ֨לֶּה֙ אֲבִ֣י עֵיטָ֔ם יִזְרְעֶ֥אל וְ/יִשְׁמָ֖א וְ/יִדְבָּ֑שׁ וְ/שֵׁ֥ם אֲחוֹתָ֖/ם הַצְלֶלְפּֽוֹנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/003.yaml
  text: 'These were the sons of the father of Etam: Jezreel[a], Ishma, and Idbash[b]; and the name of their sister was Hazzelelponi.'
translation:
  language: de
  text: 'Dies waren die Söhne des Vaters von Etam[a]: Jesreel, Jischma und Jidbasch; ihre Schwester hieß Hazzelelponi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen fehlt das Wort „Söhne“; die Formulierung ist elliptisch und lautet wörtlich etwa: „Und diese: Vater Etams“. „Söhne“ ist aus dem genealogischen Zusammenhang ergänzt. „Vater“ kann hier auch „Vorfahre“ oder „Begründer“ bedeuten.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Dies waren
  rationale: Die Wendung leitet eine genealogische Angabe ein. Das einleitende וְ muss im Deutschen nicht eigens mit „und“ wiedergegeben werden.
- source_word: אֲבִי עֵיטָם
  choice: des Vaters von Etam
  rationale: Die direkte Wiedergabe wahrt die im Chronikbuch mögliche Bedeutungsbreite von אָב als Vater, Vorfahr oder Begründer einer Siedlung beziehungsweise Sippe.
- source_word: יִזְרְעֶאל
  choice: Jesreel
  rationale: Gebräuchliche deutsche Umschrift des Personennamens.
- source_word: וְיִשְׁמָא
  choice: Jischma
  rationale: Deutsche Umschrift des hebräischen Personennamens unter Wiedergabe von שׁ durch „sch“.
- source_word: וְיִדְבָּשׁ
  choice: und Jidbasch
  rationale: Der Personenname wird deutsch umschrieben; die Konjunktion bleibt als Abschluss der Aufzählung erhalten.
- source_word: וְשֵׁם אֲחוֹתָם
  choice: ihre Schwester hieß
  rationale: Natürliches modernes Deutsch für die hebräische Nominalfügung „und der Name ihrer Schwester [war]“; das Pluralsuffix „ihre“ bezieht sich auf die zuvor genannten Männer.
- source_word: הַצְלֶלְפּוֹנִי
  choice: Hazzelelponi
  rationale: Der weibliche Personenname wird in einer dem Deutschen angemessenen Form umschrieben; צ wird mit „z“ wiedergegeben.
