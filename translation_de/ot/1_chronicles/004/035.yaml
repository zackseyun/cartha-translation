  language: de
  text: und Joël[a] und Jehu, der Sohn Joschibjas, des Sohnes Serajas, des Sohnes Asiëls.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische „Sohn“ kann in Stammbäumen mitunter auch einen entfernteren Nachkommen bezeichnen; hier wird die genealogische Formel wörtlich wiedergegeben.
