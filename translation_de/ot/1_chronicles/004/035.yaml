lexical_decisions:
- source_word: וְ
  choice: und
  rationale: Die vorangestellte Konjunktion verbindet den Namen mit der vorausgehenden Aufzählung und wird schlicht mit „und“ wiedergegeben.
- source_word: יוֹאֵל
  choice: Joël
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben; der Trema vermeidet die Aussprache als Umlaut.
- source_word: וְ
  choice: und
  rationale: Die zweite Konjunktion führt die nächste Person der Aufzählung ein und bewahrt deren Reihungsstruktur.
- source_word: יֵהוּא
  choice: Jehu
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: בֶּן
  choice: Sohn
  rationale: In der genealogischen Formel bezeichnet בֶּן gewöhnlich einen Sohn, kann aber mitunter auch einen entfernteren Nachkommen meinen; die wörtliche Wiedergabe wahrt hier die Form des Hebräischen.
- source_word: יֹשִׁבְיָה
  choice: Joschibja
  rationale: Der Personenname wird nach geläufiger deutscher Bibelorthografie transliteriert.
- source_word: בֶּן
  choice: Sohn
  rationale: Das wiederholte genealogische Glied wird konsistent als „Sohn“ wiedergegeben.
- source_word: שְׂרָיָה
  choice: Seraja
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: בֶּן
  choice: Sohn
  rationale: Die wiederholte genealogische Formel wird formal und rhythmisch einheitlich wiedergegeben.
- source_word: עֲשִׂיאֵל
  choice: Asiël
  rationale: Der Personenname wird in deutscher Transliteration wiedergegeben; der Trema kennzeichnet die getrennte Aussprache der Vokale.
