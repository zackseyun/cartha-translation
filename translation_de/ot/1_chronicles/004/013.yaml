  yaml_path: translation/ot/1_chronicles/004/013.yaml
  text: 'The sons of Kenaz: Othniel and Seraiah[a]. And the sons of Othniel: Hathath.'
translation:
  language: de
  text: 'Und die Söhne des Kenas: Otniel und Seraja. Und die Söhne Otniels: Hatat.[a]'
  philosophy: optimal-equivalence
  footnotes:
