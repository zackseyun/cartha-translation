lexical_decisions:
- source_word: וּבְנֵי קְנַז
  choice: Und die Söhne des Kenas
  rationale: Die hebräische Konstruktverbindung wird in der genealogischen Formel transparent mit „die Söhne des“ wiedergegeben; das einleitende וּ bleibt als „Und“ erhalten.
- source_word: עָתְנִיאֵל
  choice: Otniël
  rationale: Traditionelle deutsche Namensform; das Trema macht die getrennte Aussprache der Vokale sichtbar.
- source_word: וּשְׂרָיָה
  choice: und Seraja
  rationale: Der Eigenname wird in einer im Deutschen gebräuchlichen, der hebräischen Lautgestalt entsprechenden Form wiedergegeben; das Präfix וּ wird mit „und“ übersetzt.
- source_word: וּבְנֵי עָתְנִיאֵל
  choice: Und die Söhne Otniëls
  rationale: Die wiederholte genealogische Formel bezeichnet die nächste Generation; der Genitiv ist im Deutschen natürlich und präzise.
- source_word: חֲתַת
  choice: Hatat
  rationale: Lautnahe deutsche Wiedergabe des hebräischen Eigennamens.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Standarddeutsch im Stil einer genealogischen Liste. Das im Hebräischen wiederholte „Und“ und der Wechsel von einem vollständigen Satz zur elliptischen Aufzählung bleiben erkennbar; zur besseren deutschen Lesbarkeit wurde im ersten Satz „waren“ ergänzt.
