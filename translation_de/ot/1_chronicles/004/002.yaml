  register: Moderne, würdige genealogische Prosa. „Zeugte“ wahrt die knappe Struktur des Hebräischen; „Sippen“ verdeutlicht den weiteren verwandtschaftlichen Sinn. Der Fußnotenmarker steht unmittelbar nach der Aussage, auf die sich die Alternative bezieht.
