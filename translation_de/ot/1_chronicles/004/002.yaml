base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/002.yaml
  text: Reaiah son of Shobal fathered Jahath[a], and Jahath fathered Ahumai and Lahad. These were the clans of the Zorathites.
translation:
  language: de
  text: Reaja, der Sohn Schobals, zeugte Jahat, und Jahat zeugte Ahumai und Lahad. Dies sind die Sippen der Zorathiter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Familien der Zorathiter“. Das hebräische Wort bezeichnet größere Verwandtschaftsgruppen und kann auch mit „Familien“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאָיָה
  choice: Reaja
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibelnamenschreibung wiedergegeben.
- source_word: בֶן
  choice: der Sohn
  rationale: Bewahrt die formale genealogische Angabe; eine weiter gefasste Bedeutung im Sinn von Nachkomme ist grundsätzlich möglich, hier aber nicht eigens angezeigt.
- source_word: הוֹלִיד / הֹלִיד
  choice: zeugte
  rationale: Die Hifil-Form von ילד bezeichnet in Genealogien das männliche Zeugen. „Zeugte“ ist knapp, präzise und im gehobenen modernen Deutsch verständlich.
- source_word: יַחַת
  choice: Jahat
  rationale: Deutsche Umschrift des hebräischen Personennamens.
- source_word: אֲחוּמַי
  choice: Ahumai
  rationale: Umschrift des hebräischen Personennamens.
- source_word: לָהַד
  choice: Lahad
  rationale: Umschrift des hebräischen Personennamens.
- source_word: אֵלֶּה
  choice: Das waren
  rationale: Natürliches Deutsch für die rückverweisende Identifikation; das Hebräische nennt kein zusätzliches Substantiv wie „Männer“.
- source_word: מִשְׁפְּחֹות
  choice: Sippen
  rationale: Bezeichnet hier größere verwandtschaftlich organisierte Gruppen und vermeidet die heute meist engere Bedeutung von „Familien“.
- source_word: הַצָּרְעָתִי
  choice: der Zoratiter
  rationale: Das Gentiliz bezeichnet die mit Zora verbundene Bevölkerungs- beziehungsweise Abstammungsgruppe.
theological_decisions: []
