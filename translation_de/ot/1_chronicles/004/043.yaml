  text: וַ/יַּכּ֕וּ אֶת שְׁאֵרִ֥ית הַ/פְּלֵטָ֖ה לַ/עֲמָלֵ֑ק וַ/יֵּ֣שְׁבוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/043.yaml
  text: And they struck down the remnant of the survivors of Amalek[b][a], and they lived there to this day.
translation:
  language: de
  text: Und sie schlugen den Rest der entkommenen Amalekiter nieder[a] und wohnten dort[b] bis zum heutigen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Rest, der von Amalek entkommen war“. Im Hebräischen stehen zwei bedeutungsnahe Ausdrücke für diejenigen, die nach einer Vernichtung übrig geblieben sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ließen sich dort nieder“. Das Verb kann sowohl das Wohnen als auch das Sichniederlassen an einem Ort bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: sie schlugen … nieder
  rationale: נכה bezeichnet hier im militärischen Zusammenhang das Schlagen beziehungsweise Niederschlagen. „Niederschlagen“ gibt den wahrscheinlich tödlichen Ausgang wieder, ohne das Verb ausdrücklich mit „töten“ gleichzusetzen.
- source_word: שְׁאֵרִית הַפְּלֵטָה
  choice: den Rest der Entronnenen
  rationale: Die beiden eng verwandten Substantive bezeichnen das nach einer Verwüstung Übriggebliebene und die Entkommenen. Die Wiedergabe bewahrt beide Begriffe und damit die betonte hebräische Formulierung.
- source_word: לַעֲמָלֵק
  choice: Amaleks
  rationale: Der Eigenname bezeichnet hier das Volk Amalek. Der Genitiv bleibt eng an der hebräischen Zuordnung; sinngemäß ist „der Amalekiter“ möglich.
- source_word: וַיֵּשְׁבוּ
  choice: sie wohnten
  rationale: ישב kann „sitzen“, „wohnen“ oder „sich niederlassen“ bedeuten. „Wohnten“ ist im Deutschen natürlich und lässt offen, ob der Beginn der Ansiedlung oder das fortdauernde Leben am Ort betont wird.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb verweist auf den zuvor genannten Ort.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis auf diesen Tag
  rationale: Diese geläufige, würdige Wendung entspricht der hebräischen Zeitangabe aus der Perspektive des Erzählers.
theological_decisions: []
