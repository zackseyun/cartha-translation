  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die bewusst verdichtete Formulierung „Rest der Entronnenen“ erhält die Doppelung des Hebräischen; die Fußnote bietet eine flüssigere Auflösung. Sämtliche Fußnotenmarker stehen an der jeweils erläuterten Textstelle.
