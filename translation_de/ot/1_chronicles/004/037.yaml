source:
  edition: WLC
  text: וְ/זִיזָ֨א בֶן שִׁפְעִ֧י בֶן אַלּ֛וֹן בֶּן יְדָיָ֥ה בֶן שִׁמְרִ֖י בֶּן שְׁמַֽעְיָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/037.yaml
  text: and Ziza son of Shiphi[a], son of Allon, son of Jedaiah, son of Shimri, son of Shemaiah.
translation:
  language: de
  text: und Sisa, Sohn Schifis, Sohn Allons, Sohn Jedajas, Sohn Schimris, Sohn Schemajas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/זִיזָא
  choice: und Sisa
  rationale: Das Präfix וְ wird als „und“ wiedergegeben und führt die genealogische Aufzählung fort. Der Personenname זִיזָא wird nach gängiger deutscher Bibelnamenkonvention als „Sisa“ transkribiert; das hebräische Zajin wird dabei wie üblich mit deutschem S wiedergegeben.
- source_word: בֶן
  choice: der Sohn … / des Sohnes …
  rationale: בֶן bezeichnet in der genealogischen Formel jeweils „Sohn“. Der erste Ausdruck wird mit „der Sohn“ angeschlossen; die folgenden Generationen stehen natürlich und zugleich strukturell transparent im Genitiv als „des Sohnes“.
- source_word: שִׁפְעִי
  choice: Schifi
  rationale: Der Personenname wird lesbar ins Deutsche transkribiert; „Sch“ gibt den hebräischen Schin-Laut wieder, „f“ den unbegadierten Pe-Laut.
- source_word: אַלּוֹן
  choice: Allon
  rationale: In diesem Zusammenhang ist das Wort ein Personenname und wird daher transkribiert, nicht mit der möglichen Bedeutung des gleichlautenden Nomens übersetzt.
- source_word: יְדָיָה
  choice: Jedaja
  rationale: Der Personenname wird entsprechend vertrauter deutscher Bibelnamenkonvention wiedergegeben.
- source_word: שִׁמְרִי
  choice: Schimri
  rationale: Die Transkription bewahrt Schin als „Sch“ und bietet eine im Deutschen gut lesbare Namensform.
- source_word: שְׁמַעְיָה
  choice: Schemaja
  rationale: Die Form folgt der üblichen deutschen Wiedergabe dieses hebräischen Personennamens und bleibt dem Lautbestand erkennbar nahe.
theological_decisions: []
translation_notes:
  register: Knapper, würdiger genealogischer Stil in modernem Standarddeutsch. Die wiederholte Abstammungsformel des Hebräischen bleibt erhalten; die Genitivkette vermeidet eine schwerfällige Wiederholung von „Sohn von“.
