  text: וּ/לְ/שִׁמְעִ֞י בָּנִ֨ים שִׁשָּׁ֤ה עָשָׂר֙ וּ/בָנ֣וֹת שֵׁ֔שׁ וּ/לְ/אֶחָ֕י/ו אֵ֖ין בָּנִ֣ים רַבִּ֑ים וְ/כֹל֙ מִשְׁפַּחְתָּ֔/ם לֹ֥א הִרְבּ֖וּ עַד בְּנֵ֥י יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/027.yaml
  text: Shimei had sixteen sons and six daughters[a], but his brothers did not have many sons, and all their clans did not multiply as much as the sons of Judah.
translation:
  language: de
  text: Schimi hatte sechzehn Söhne und sechs Töchter. Seine Brüder dagegen hatten nicht viele Söhne, und ihre ganze Sippe wurde nicht so zahlreich wie die Nachkommen Judas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… und ihre ganze Sippe nahm nicht bis zur Zahl der Nachkommen Judas zu.“'
    reason: Die Fußnote gibt die mit עַד ausgedrückte Vergleichsgrenze näher am hebräischen Bild wieder, ohne die idiomatische Hauptübersetzung zu beeinträchtigen.
lexical_decisions:
- source_word: וּלְשִׁמְעִי
  choice: Schimi hatte
  rationale: Die Verbindung mit לְ bezeichnet in dieser genealogischen Aussage Besitz beziehungsweise Zugehörigkeit; im natürlichen Deutschen wird sie mit „Schimi hatte“ wiedergegeben.
- source_word: בָּנִים שִׁשָּׁה עָשָׂר וּבָנוֹת שֵׁשׁ
  choice: sechzehn Söhne und sechs Töchter
  rationale: Die Zahlen und Verwandtschaftsbezeichnungen werden direkt übernommen und der deutschen Wortstellung entsprechend angeordnet.
- source_word: וּלְאֶחָיו אֵין בָּנִים רַבִּים
  choice: Seine Brüder dagegen hatten nicht viele Söhne
  rationale: Das existenzanzeigende אֵין mit לְ wird idiomatisch als „nicht haben“ wiedergegeben. „Dagegen“ macht den im Zusammenhang erkennbaren Kontrast deutlich, ohne den Inhalt zu verstärken.
- source_word: וְכֹל מִשְׁפַּחְתָּם
  choice: und ihre ganze Sippe
  rationale: מִשְׁפָּחָה steht hier im Singular mit Possessivsuffix und bezeichnet im genealogischen Zusammenhang eine größere Verwandtschaftsgruppe; daher „ihre ganze Sippe“ statt „alle ihre Familien“.
- source_word: לֹא הִרְבּוּ
  choice: wurde nicht so zahlreich
  rationale: Die Hifil-Form von רבה beschreibt hier eine zahlenmäßige Vermehrung. Die deutsche Formulierung gibt den populationsbezogenen Sinn natürlich wieder.
- source_word: עַד בְּנֵי יְהוּדָה
  choice: wie die Nachkommen Judas
  rationale: עַד bezeichnet hier das nicht erreichte Maß. בְּנֵי kann im genealogischen Kontext über unmittelbare Söhne hinaus die Nachkommenschaft bezeichnen; „Nachkommen Judas“ verhindert ein Missverständnis als ausschließlich direkte Söhne.
