  text: וּ/בְנֵ֖י מִשְׁמָ֑ע חַמּוּאֵ֥ל בְּנ֛/וֹ זַכּ֥וּר בְּנ֖/וֹ שִׁמְעִ֥י בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/026.yaml
  text: 'The sons of Mishma: Hammuel his son, Zaccur his son, Shimei his son.'
translation:
  language: de
  text: 'Und die Söhne Mischmas: Hammuel, sein Sohn; Sakkur, sein Sohn; Schimi, sein Sohn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: בְנֵי ist die Konstruktform des Plurals von „Sohn“. Das vorangestellte וּ wird als „Und“ wiedergegeben, weil es den Eintrag mit der fortlaufenden Genealogie verbindet.
- source_word: מִשְׁמָע
  choice: Mischma
  rationale: Der Personenname wird in einer im Deutschen üblichen, der hebräischen Lautung angenäherten Form transkribiert.
- source_word: חַמּוּאֵל
  choice: Hammuel
  rationale: Der Personenname wird möglichst lautnah transkribiert; die Schreibung mit Doppel-m bildet die Konsonantenverdopplung ab.
- source_word: בְּנוֹ
  choice: sein Sohn
  rationale: Die Form bezeichnet jeweils ausdrücklich „seinen Sohn“ und markiert so die genealogische Abfolge.
- source_word: זַכּוּר
  choice: Sakkur
  rationale: Der Personenname wird deutsch transkribiert; „S“ gibt den hebräischen Zajin-Laut wieder, „kk“ die Konsonantenverdopplung.
- source_word: שִׁמְעִי
  choice: Schimi
  rationale: Der Personenname wird der masoretischen Vokalisierung entsprechend in deutscher Lautschrift wiedergegeben.
