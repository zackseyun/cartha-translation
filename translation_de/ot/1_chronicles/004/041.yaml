  text: וַ/יָּבֹ֡אוּ אֵלֶּה֩ הַ/כְּתוּבִ֨ים בְּ/שֵׁמ֜וֹת בִּ/ימֵ֣י יְחִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֗ה וַ/יַּכּ֨וּ אֶת אָהֳלֵי/הֶ֜ם וְ/אֶת ה/מעינים אֲשֶׁ֤ר נִמְצְאוּ שָׁ֨מָּ/ה֙ וַ/יַּחֲרִימֻ/ם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יֵּשְׁב֖וּ תַּחְתֵּי/הֶ֑ם כִּֽי מִרְעֶ֥ה לְ/צֹאנָ֖/ם שָֽׁם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/041.yaml
  text: These[a], who were recorded by name, came in the days of Hezekiah king of Judah, and they struck down their tents and the Meunites who were found there, and devoted them to destruction to this day. Then they settled in their place, because there was pasture there for their flocks.
translation:
  language: de
  text: Diese, die namentlich verzeichnet waren, kamen in den Tagen Hiskias, des Königs von Juda. Sie schlugen ihre Zelte und die dort angetroffenen Meuniter[a] nieder und weihten sie dem Bann bis auf den heutigen Tag. Dann ließen sie sich an ihrer Stelle nieder, denn dort gab es Weideland für ihre Herden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort הַמְּעִינִים ist schwierig. Traditionell wird es als Name einer Volksgruppe verstanden: „die Meuniter“. Andere deuten es als „die Wohnstätten“ oder „die Behausungen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּתוּבִים בְּשֵׁמוֹת
  choice: die namentlich verzeichnet waren
  rationale: Die passive Partizipialkonstruktion bezeichnet Personen, die in einem Register oder Geschlechtsverzeichnis namentlich eingetragen sind. Die Formulierung ist natürlich und bewahrt den administrativen Sinn.
- source_word: וַיָּבֹאוּ
  choice: kamen
  rationale: בוא bedeutet gewöhnlich „kommen“ oder „eintreffen“; „kamen“ passt zur Erzählfolge, ohne ein Ziel zu ergänzen.
- source_word: וַיַּכּוּ
  choice: schlugen ... nieder
  rationale: נכה bezeichnet im militärischen Zusammenhang einen gewaltsamen Angriff mit Niederlage oder Tötung. „Niederschlagen“ bewahrt die Gewalt, ohne den Umfang genauer festzulegen als der hebräische Text.
- source_word: אָהֳלֵיהֶם
  choice: ihre Zelte
  rationale: Das Substantiv ist das gewöhnliche Wort für Zelte und entspricht dem vermutlich halbnomadischen Umfeld.
- source_word: המעינים
  choice: die Meuniter
  rationale: Die schwierige Form wird traditionell als Volksbezeichnung verstanden. Das passt syntaktisch zur folgenden pluralischen Relativkonstruktion und sachlich dazu, dass neben den Zelten eine dort lebende Gruppe getroffen wird; andere Deutungen werden in der Fußnote genannt.
- source_word: אֲשֶׁר נִמְצְאוּ שָׁמָּה
  choice: die dort angetroffenen
  rationale: Bei der Deutung als Personenbezeichnung gibt die Formulierung den Relativsatz idiomatisch wieder, ohne das bloße Vorhandensein unnötig auszubauen.
- source_word: וַיַּחֲרִימֻם
  choice: weihten sie ... der Vernichtung
  rationale: Das Hiphil von חרם bezeichnet das Übergeben an den Bann beziehungsweise die Vernichtung. Die Wiedergabe erhält den kultisch-technischen und gewaltsamen Gehalt, statt ihn zu einem bloßen „vernichten“ zu verflachen.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis auf den heutigen Tag
  rationale: Geläufige deutsche Wiedergabe der hebräischen Zeitformel; sie bleibt im Satz bewusst beim Verb des Vernichtungsbanns, obwohl der genaue Bezug im Kontext schwierig wirkt.
- source_word: וַיֵּשְׁבוּ תַּחְתֵּיהֶם
  choice: ließen sie sich an ihrer Stelle nieder
  rationale: תחת mit Personen bedeutet hier „anstelle von“. Die Formulierung verbindet das Wohnen beziehungsweise Siedeln mit dem Ersatz der früheren Bewohner.
- source_word: מִרְעֶה לְצֹאנָם
  choice: Weideland für ihre Herden
  rationale: מִרְעֶה bezeichnet Weide oder Weideland; צֹאן umfasst Kleinvieh, insbesondere Schafe und Ziegen, und wird angemessen mit „Herden“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von חרם
  choice: weihten sie der Vernichtung
  alternative: vernichteten sie vollständig / belegten sie mit dem Bann
  rationale: Die gewählte Formulierung bewahrt sowohl die technische Vorstellung der Bannweihe als auch ihre tödliche Konsequenz, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählsyntax. „Hiskia“ und „Meuniter“ folgen geläufigen deutschen Namensformen. Die echte textliche Unsicherheit bei המעינים wird nicht im Haupttext aufgelöst, sondern durch eine unmittelbar markierte Fußnote offengelegt.
