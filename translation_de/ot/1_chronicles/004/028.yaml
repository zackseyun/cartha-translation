base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/028.yaml
  text: They lived in Beer-sheba[a], Moladah[b], and Hazar-shual.
translation:
  language: de
  text: Sie wohnten in Beerscheba, Molada und Hazar-Schual.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Sie wohnten
  rationale: Das Verb ישׁב bezeichnet hier im Zusammenhang einer Ortsliste das Wohnen bzw. Ansässigsein. „Sie wohnten“ ist natürliches, würdevolles Gegenwartsdeutsch und vermeidet die mögliche Zusatzbedeutung einer erstmaligen Ansiedlung.
- source_word: בִּבְאֵר שֶׁבַע
  choice: in Beerscheba
  rationale: Der Ortsname wird in der im Deutschen etablierten biblischen Form „Beerscheba“ wiedergegeben und nicht übersetzt.
- source_word: וּמוֹלָדָה
  choice: Molada
  rationale: Der Ortsname wird nach seiner hebräischen Aussprache in einer für deutsche Leser natürlichen Form wiedergegeben.
- source_word: וַחֲצַר שׁוּעָל
  choice: und Hazar-Schual
  rationale: Der zusammengesetzte Ortsname wird transliteriert; „z“ gibt צ und „sch“ gibt ש in üblicher deutscher Umschrift verständlich wieder. Der Bindestrich macht die beiden Namensbestandteile erkennbar.
theological_decisions: []
translation_notes:
  register: Moderne, klare und zugleich würdevolle Standardsprache. Die Ortsnamen folgen einer leserfreundlichen deutschen Bibelumschrift. Das einleitende waw der Verbform wird nicht eigens mit „und“ wiedergegeben, da der Vers im Deutschen als selbstständiger Listensatz natürlich anschließt.
