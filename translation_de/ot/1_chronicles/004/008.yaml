  source_fidelity: 'Der Entwurf gibt die hebräische Satzstruktur und die genealogische Aussage zuverlässig wieder: קוֹץ als Subjekt, Hifil von ילד im genealogischen Sinn („zeugte“), die drei Objekte beziehungsweise Objektgruppen sowie die Zugehörigkeit der Sippen zu Aharhel, dem Sohn Harums. Die Namensformen folgen plausibel der masoretischen Vokalisierung. Die Fußnotenanker sind im deutschen Text sachgerecht an Hazzobeba beziehungsweise Sippen gesetzt.'
  naturalness: „Koz zeugte Anub, Hazzobeba und die Sippen Aharhels, des Sohnes Harums“ ist knapp, verständlich und für eine Genealogie in modernem Standarddeutsch angemessen. „Sippen“ ist hier idiomatisch und verdeutlicht, dass nicht bloß einzelne Kernfamilien gemeint sind.
  terminology: Die Wiedergabe von מִשְׁפָּחוֹת mit „Sippen“ ist im genealogischen Kontext treffend; die Fußnote bewahrt „Familien“ als mögliche Alternative. „Zeugte“ entspricht dem genealogischen Register, ohne unnötig archaisch zu wirken. Die Umschrift Hazzobeba sowie die alternative Form Zobeba behandeln den artikulierten hebräischen Namen angemessen.
