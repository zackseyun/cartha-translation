id: 1CH.4.8
reference: 1 Chronicles 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/ק֣וֹץ הוֹלִ֔יד אֶת עָנ֖וּב וְ/אֶת הַ/צֹּבֵבָ֑ה וּ/מִשְׁפְּח֥וֹת אֲחַרְחֵ֖ל בֶּן הָרֽוּם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/008.yaml
  text: Koz fathered Anub[a], Hazzobebah[b], and the families of Aharhel son of Harum.
translation:
  language: de
  text: Koz zeugte Anub, Hazzobeba[a] und die Sippen[b] Aharhels, des Sohnes Harums.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zobeba«, wenn der vorangestellte Artikel bei der Umschrift des Namens nicht wiedergegeben wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Familien«; gemeint sind hier genealogische Familienverbände.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹץ
  choice: Koz
  rationale: Der Eigenname wird entsprechend der masoretischen Konsonanten- und Vokalgestalt transliteriert; der Artikel, der die Form »Hakkoz« begründen könnte, fehlt hier.
- source_word: הוֹלִ֔יד
  choice: zeugte
  rationale: Die Hifil-Form von ילד bezeichnet in diesem genealogischen Zusammenhang das Zeugen beziehungsweise Hervorbringen von Nachkommen; »zeugte« ist knapp, würdevoll und im Deutschen idiomatisch.
- source_word: עָנ֖וּב
  choice: Anub
  rationale: Direkte Transliteration des Eigennamens.
- source_word: הַ/צֹּבֵבָ֑ה
  choice: Hazzobeba
  rationale: Die Transliteration bildet den vorangestellten hebräischen Artikel und die dadurch verdoppelte Anfangskonsonanz ab. »Zobeba« bleibt möglich, wenn der Artikel im Namen nicht wiedergegeben wird.
- source_word: וּ/מִשְׁפְּח֥וֹת
  choice: und die Sippen
  rationale: מִשְׁפָּחוֹת bezeichnet in genealogischen Listen größere Familienverbände. »Sippen« gibt diesen Zusammenhang genauer wieder als das im heutigen Deutsch leicht auf Kernfamilien bezogene »Familien«.
- source_word: אֲחַרְחֵ֖ל
  choice: Aharhel
  rationale: Direkte Transliteration des Eigennamens.
- source_word: בֶּן
  choice: des Sohnes
  rationale: Der Genitivanschluss gibt die genealogische Beziehung »Aharhel, Sohn Harums« natürlich und eindeutig wieder.
- source_word: הָרֽוּם
  choice: Harum
  rationale: Die Form folgt der masoretischen Vokalisierung; »Haram« wäre eine abweichende traditionelle Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. Die genealogische Formulierung bleibt eng am Hebräischen; »Sippen« vermeidet das mögliche Missverständnis heutiger Kernfamilien. Alle Eigennamen folgen möglichst direkt der masoretischen Form.
