base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/015.yaml
  text: 'And the sons of Caleb son of Jephunneh: Iru[a], Elah, and Naam; and the sons of Elah: Kenaz.'
translation:
  language: de
  text: 'Und die Söhne Kalebs, des Sohnes Jefunnes: Iru, Ela und Naam; und die Söhne Elas: Kenas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי כָּלֵב
  choice: Und die Söhne Kalebs
  rationale: בְּנֵי bezeichnet hier im genealogischen Zusammenhang am unmittelbarsten die Söhne; der deutsche Genitiv gibt die knappe hebräische Zuordnung natürlich wieder.
- source_word: בֶּן יְפֻנֶּה
  choice: des Sohnes Jefunnes
  rationale: Die Apposition identifiziert Kaleb als den Sohn Jefunnes. Die deutsche Genitivform schließt sich eindeutig an Kaleb an.
- source_word: עִירוּ
  choice: Iru
  rationale: Transliteration des Personennamens in einer gut lesbaren deutschen Form.
- source_word: אֵלָה
  choice: Ela
  rationale: Im Kontext handelt es sich um einen Personennamen; die Form Ela entspricht einer gebräuchlichen deutschen Wiedergabe.
- source_word: וָנָעַם
  choice: und Naam
  rationale: Konsonanten und masoretische Vokalisierung stützen den männlichen Personennamen Naam, nicht Naama.
- source_word: וּבְנֵי אֵלָה
  choice: und die Söhne Elas
  rationale: Die Wiederholung der genealogischen Formel bleibt erhalten und führt einen Unterzweig der Familie ein.
- source_word: וּקְנַז
  choice: Kenas
  rationale: Gebräuchliche deutsche Wiedergabe des Personennamens קְנַז.
