base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/006.yaml
  text: Naarah bore to him Ahuzzam[a], Hepher, Temeni, and Haahashtari[b]. These were the sons of Naarah.
translation:
  language: de
  text: Naara gebar ihm Achussam, Chefer, Temeni[a] und Ha-Achaschtari[b]. Diese waren die Söhne Naaras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Temeni kann auch als Bezeichnung mit adjektivischer Bedeutung verstanden werden, etwa „Temaniter“ oder „Südländer“; in dieser Geschlechtsfolge wird die Form jedoch als Personenname wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: Ha-Achaschtari kann auch „Achaschtari“ geschrieben werden. Die hebräische Form enthält den vorangestellten Artikel, der möglicherweise zu einem festen Bestandteil des Namens geworden ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: gebar
  rationale: Das Verb ילד bezeichnet hier in einer genealogischen Notiz das Gebären. „Gebar“ ist knapp, würdig und bewahrt Naara als mütterliches Subjekt.
- source_word: לוֹ
  choice: ihm
  rationale: Die Präposition ל mit Suffix kennzeichnet in dieser genealogischen Formel den männlichen Elternteil, ohne das Verhältnis über den unmittelbaren Kontext hinaus näher zu bestimmen.
- source_word: נַעֲרָה
  choice: Naara
  rationale: Der Personenname wird in einer für deutsche Leser klaren Form transliteriert und an beiden Stellen einheitlich wiedergegeben.
- source_word: אֲחֻזָּם
  choice: Achussam
  rationale: Der Eigenname wird nach deutschsprachigen Laut- und Schreibkonventionen transliteriert; „ch“ gibt ח und „ss“ die Konsonantenverdopplung wieder.
- source_word: חֵפֶר
  choice: Chefer
  rationale: Der Eigenname wird nach deutschsprachiger Konvention transliteriert.
- source_word: תֵּימְנִי
  choice: Temeni
  rationale: Obwohl die Form adjektivisch verstanden werden könnte, steht sie in dieser genealogischen Aufzählung wahrscheinlich als Personenname und wird daher transliteriert.
- source_word: הָאֲחַשְׁתָּרִי
  choice: Ha-Achaschtari
  rationale: Das vorangestellte ה wird als „Ha-“ sichtbar bewahrt, da es im hebräischen Text möglicherweise zu einem festen Bestandteil des Namens geworden ist.
- source_word: אֵלֶּה בְּנֵי נַעֲרָה
  choice: Diese waren die Söhne Naaras
  rationale: Die Zusammenfassung wird in natürlichem Deutsch wiedergegeben; בְּנֵי bezeichnet im genealogischen Zusammenhang ausdrücklich Söhne.
