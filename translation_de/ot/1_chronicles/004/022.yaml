base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/022.yaml
  text: and Jokim[a], and the men of Cozeba, and Joash, and Saraph, who ruled in Moab and returned to Lehem[c][b]. These records are ancient.
translation:
  language: de
  text: und Jokim, die Männer von Koseba, Joasch und Saraf, die Herren über Moab wurden[a], und Jaschubi-Lehem[b]. Diese Berichte stammen aus alter Zeit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Moab in Besitz nahmen“, „die in Moab herrschten“; möglicherweise auch: „die moabitische Frauen heirateten“. Der knappe hebräische Ausdruck ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch unsicher. Möglich ist auch eine verbale Deutung: „und sie kehrten nach Lehem zurück“ oder „und sie kehrten nach Bethlehem zurück“.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlicher auch: „Und die Angelegenheiten sind alt“ oder: „Und diese Dinge stammen aus alter Zeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹקִים
  choice: Jokim
  rationale: Der Personenname wird nach seiner hebräischen Form ins Deutsche übertragen.
- source_word: אַנְשֵׁי כֹזֵבָא
  choice: die Männer von Koseba
  rationale: אַנְשֵׁי ist der Constructus Plural von אִישׁ und bezeichnet hier ausdrücklich „Männer“. כֹזֵבָא wird als Ortsname verstanden und formnah mit „Koseba“ wiedergegeben.
- source_word: יוֹאָשׁ
  choice: Joasch
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: שָׂרָף
  choice: Saraf
  rationale: Im genealogischen Zusammenhang liegt ein Personenname vor; daher wird das Wort nicht nach seiner möglichen lexikalischen Bedeutung übersetzt.
- source_word: אֲשֶׁר בָּעֲלוּ לְמוֹאָב
  choice: die Herren über Moab wurden
  rationale: בעל bezeichnet hier wahrscheinlich das Erlangen oder Ausüben einer Herrenstellung. Die knappe, unsichere Formulierung wird durch eine Fußnote offengehalten.
- source_word: וְיָשֻׁבִי לָחֶם
  choice: sowie Jaschubi-Lehem
  rationale: Die masoretisch vokalisierte Form יָשֻׁבִי lässt sich am unmittelbarsten als Bestandteil eines Eigennamens auffassen. Wegen der schwierigen Textform werden die verbreiteten verbalen Deutungen in der Fußnote genannt.
- source_word: וְהַדְּבָרִים עַתִּיקִים
  choice: Diese Berichte stammen aus alter Zeit
  rationale: דְּבָרִים kann „Worte“, „Angelegenheiten“ oder kontextuell überlieferte Berichte bezeichnen; עַתִּיקִים kennzeichnet sie als alt beziehungsweise aus früher Zeit stammend.
theological_decisions:
- issue: Bedeutung von בָּעֲלוּ לְמוֹאָב
  choice: die Herren über Moab wurden
  alternative: Moab in Besitz nahmen; in Moab herrschten; moabitische Frauen heirateten
  rationale: Der hebräische Ausdruck ist sehr knapp und lexikalisch mehrdeutig. Die Hauptfassung gibt die wahrscheinlich gemeinte Stellung oder Herrschaft wieder, ohne die anderen Möglichkeiten zu verschweigen.
- issue: Deutung von יָשֻׁבִי לָחֶם
  choice: Jaschubi-Lehem als Eigenname
  alternative: sie kehrten nach Lehem zurück; sie kehrten nach Bethlehem zurück
  rationale: Die überlieferte Vokalisierung und die Reihung von Namen sprechen für einen Eigennamen, doch die Stelle bleibt textlich und syntaktisch unsicher.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Aufzählung bleibt knapp und genealogisch geprägt. Ungewöhnliche Eigennamen werden formnah wiedergegeben; die erheblichen Unsicherheiten der beiden schwierigen Wendungen werden nicht im Haupttext geglättet, sondern transparent in Fußnoten bewahrt.
