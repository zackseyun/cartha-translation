base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/011.yaml
  text: Chelub[a], the brother of Shuhah, fathered Mehir; he was the father of Eshton.
translation:
  language: de
  text: Und Kelub, der Bruder Schuchas, zeugte Mehir; dieser war der Vater Eschtons.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Vorfahr oder Gründer Eschtons“. In genealogischen Listen kann „Vater von“ mitunter den Stammvater einer Sippe oder den Gründer einer Siedlung bezeichnen und muss nicht den unmittelbaren leiblichen Vater meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְלוּב
  choice: Und Kelub
  rationale: Der Eigenname wird nach der hebräischen Form als „Kelub“ wiedergegeben; die vorangestellte Konjunktion וּ bleibt mit „Und“ sichtbar.
- source_word: אֲחִי שׁוּחָה
  choice: der Bruder Schuchas
  rationale: Die hebräische Genitivverbindung bezeichnet eine geschwisterliche Beziehung und wird knapp und natürlich wiedergegeben.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Die Hifil-Form von ילד bezeichnet in diesem genealogischen Zusammenhang das Hervorbringen eines Nachkommen; „zeugte“ ist präzise und im Deutschen weiterhin verständlich.
- source_word: מְחִיר
  choice: Mehir
  rationale: Der Eigenname wird transliteriert.
- source_word: הוּא
  choice: dieser
  rationale: Das selbstständige Pronomen greift den unmittelbar zuvor genannten Mehir als Subjekt des folgenden Satzteils auf; „dieser“ macht diesen Bezug im Deutschen klar.
- source_word: אֲבִי
  choice: der Vater Eschtons
  rationale: Die Grundbedeutung „Vater von“ wird beibehalten; die in genealogischen Texten mögliche weitere Bedeutung wird in einer Fußnote offengehalten.
- source_word: אֶשְׁתּוֹן
  choice: Eschton
  rationale: Der Eigenname wird in einer dem Deutschen angepassten Form transliteriert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper genealogischer Satzstruktur. „Zeugte“ wahrt die Präzision des hebräischen Verbs; die mögliche weitere Bedeutung von „Vater“ wird nicht in den Haupttext eingetragen, sondern transparent in der Fußnote genannt.
