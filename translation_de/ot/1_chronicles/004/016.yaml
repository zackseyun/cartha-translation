  text: וּ/בְנֵ֖י יְהַלֶּלְאֵ֑ל זִ֣יף וְ/זִיפָ֔ה תִּירְיָ֖א וַ/אֲשַׂרְאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/016.yaml
  text: 'And the sons of Jehallelel: Ziph[a], Ziphah, Tiria, and Asarel.'
translation:
  language: de
  text: 'Und die Söhne Jehallelels: Sif, Sifa, Tirja und Asarel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: בְּנֵי ist der Status constructus im Plural und bezeichnet in der Genealogie die Söhne beziehungsweise Nachkommen; das vorangestellte וּ wird zur Wahrung der genealogischen Verknüpfung mit „Und“ wiedergegeben.
- source_word: יְהַלֶּלְאֵל
  choice: Jehallelel
  rationale: Der Personenname wird nach einer im Deutschen gut lesbaren, quellennahen Umschrift wiedergegeben.
- source_word: זִיף
  choice: Sif
  rationale: 'Der Eigenname wird in deutscher Bibelnamenschreibung mit S für צ? Nein: Hier steht ז; dennoch ist „Sif“ die im Deutschen etablierte Form für den hebräischen Namen זִיף und vermeidet die englische Schreibweise „Ziph“.'
- source_word: וְזִיפָה
  choice: Sifa
  rationale: Der Eigenname זִיפָה wird in deutscher Laut- und Bibelnamenschreibung als „Sifa“ wiedergegeben; die Konjunktion wird in der deutschen Aufzählung nur vor dem letzten Glied ausdrücklich gesetzt.
- source_word: תִּירְיָא
  choice: Tirja
  rationale: Die Folge יָא wird in einer natürlichen deutschen Umschrift als „ja“ wiedergegeben.
- source_word: וַאֲשַׂרְאֵל
  choice: und Asarel
  rationale: Der Personenname wird entsprechend der masoretischen Form als „Asarel“ transliteriert; das Präfix וַ wird als abschließendes „und“ der Aufzählung wiedergegeben.
theological_decisions: []
