id: 1CH.4.10
reference: 1 Chronicles 4:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א יַ֠עְבֵּץ לֵ/אלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אִם בָּרֵ֨ךְ תְּבָרֲכֵ֜/נִי וְ/הִרְבִּ֤יתָ אֶת גְּבוּלִ/י֙ וְ/הָיְתָ֤ה יָדְ/ךָ֙ עִמִּ֔/י וְ/עָשִׂ֥יתָ מֵּ/רָעָ֖ה לְ/בִלְתִּ֣י עָצְבִּ֑/י וַ/יָּבֵ֥א אֱלֹהִ֖ים אֵ֥ת אֲשֶׁר שָׁאָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/010.yaml
  text: And Jabez called on the God of Israel[a], saying, “If you would indeed bless me and enlarge my territory, and let your hand be with me[b], and keep me from harm so that I may not suffer pain!” And God granted what he asked.
translation:
  language: de
  text: 'Jabez rief den Gott Israels an und sagte: »Wenn du mich doch wirklich segnen und mein Gebiet erweitern würdest! Lass deine Hand mit mir sein und bewahre mich vor Unheil[a], damit ich keinen Schmerz erleide[b]!« Und Gott gewährte ihm, worum er gebeten hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor dem Bösen«. Das hebräische Wort רָעָה kann moralisches Böses oder schädliches Unheil bezeichnen; der Zusammenhang mit dem folgenden Schmerz spricht hier eher für Unheil.'
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung »keinen Schmerz erleide« greift die Erklärung des Namens Jabez im vorherigen Vers auf; siehe 1. Chronik 4,9.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief … an
  rationale: Im Gebetskontext bezeichnet das Verb die an Gott gerichtete Anrufung, nicht bloß ein Rufen oder Benennen.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet eindeutig Israels Gott; der bestimmte Artikel ist im Deutschen idiomatisch.
- source_word: אִם בָּרֵךְ תְּבָרֲכֵנִי
  choice: Wenn du mich doch wirklich segnen … würdest
  rationale: אִם wird als konditionales »wenn« bewahrt, während »doch« und der Konjunktiv den Satz als innigen Wunsch kennzeichnen. Die Verbindung aus Infinitivus absolutus und finitem Verb wird durch »wirklich« verstärkt wiedergegeben.
- source_word: וְהִרְבִּיתָ אֶת גְּבוּלִי
  choice: und mein Gebiet erweitern würdest
  rationale: גְּבוּל kann Grenze oder das von ihr umschlossene Gebiet bezeichnen. Hier ist »Gebiet« im Zusammenhang mit Landbesitz am natürlichsten, ohne eine moderne metaphorische Deutung einzutragen.
- source_word: וְהָיְתָה יָדְךָ עִמִּי
  choice: Lass deine Hand mit mir sein
  rationale: Das hebräische Bild von Gottes Hand als Ausdruck seiner wirksamen Macht und Hilfe bleibt erhalten; der deutsche Imperativ bringt die Gebetsbitte natürlich zum Ausdruck.
- source_word: וְעָשִׂיתָ מֵּרָעָה
  choice: und bewahre mich vor Unheil
  rationale: Die knappe und schwierige hebräische Formulierung zielt im Zusammenhang wahrscheinlich auf Schutz vor schädlichem Unglück. »Unheil« wahrt zugleich die Nähe zum weiteren Bedeutungsfeld von רָעָה besser als das allgemeinere »Schaden«.
- source_word: לְבִלְתִּי עָצְבִּי
  choice: damit ich keinen Schmerz erleide
  rationale: Die Wendung bezeichnet Schmerz, Verletzung oder Kummer und greift die Namensdeutung von Jabez im vorherigen Vers auf. Die Wiedergabe lässt den Schmerz Jabez treffen, statt unbegründet anzunehmen, dass er anderen Schmerz zufüge.
- source_word: וַיָּבֵא אֱלֹהִים אֵת אֲשֶׁר שָׁאָל
  choice: Und Gott gewährte ihm, worum er gebeten hatte
  rationale: Die Konstruktion mit בוא besagt hier idiomatisch, dass Gott das Erbetene eintreten ließ. »Gewährte« gibt diesen Sinn in natürlichem Deutsch wieder.
theological_decisions:
- issue: Art der erbetenen Erweiterung von גְּבוּל
  choice: Als Erweiterung von Jabez’ Gebiet wiedergegeben
  alternative: Ausweitung seines Einflussbereichs
  rationale: Der hebräische Ausdruck bezeichnet am ehesten Grenze beziehungsweise Landgebiet. Die Übersetzung vermeidet sowohl eine vorschnelle Spiritualisierung als auch eine Deutung im Sinn moderner Wohlstandstheologie.
- issue: Bedeutung von רָעָה im Gebet
  choice: Im Haupttext mit »Unheil« wiedergegeben
  alternative: das Böse
  rationale: Die anschließende Bitte, keinen Schmerz zu erleiden, legt schädliches Unglück oder eine leidvolle Widerfahrnis nahe. Da רָעָה auch moralisches Böses bedeuten kann, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
- issue: Form der mit אִם eingeleiteten Bitte
  choice: 'Als unabgeschlossener, inniger Wunsch formuliert: »Wenn du mich doch … würdest!«'
  alternative: 'Direkte Bitte: »Segne mich doch …«'
  rationale: Die gewählte Form erhält das hebräische אִם und bildet zugleich die emphatische Gebetsfunktion ab, ohne einen im Text nicht ausgesprochenen Nachsatz zu ergänzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gebetssprache bleibt eindringlich, aber verständlich. Das traditionelle biblische Bild von Gottes Hand wird beibehalten; ungewöhnliche hebräische Spannung und lexikalische Mehrdeutigkeit werden nicht konfessionell vereindeutigt.
