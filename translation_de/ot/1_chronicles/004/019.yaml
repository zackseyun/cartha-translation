source:
  edition: WLC
  text: וּ/בְנֵי֙ אֵ֣שֶׁת הֽוֹדִיָּ֔ה אֲח֣וֹת נַ֔חַם אֲבִ֥י קְעִילָ֖ה הַ/גַּרְמִ֑י וְ/אֶשְׁתְּמֹ֖עַ הַ/מַּעֲכָתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/019.yaml
  text: And the sons of the wife of Hodiah[a], the sister of Naham[b], were the father of Keilah the Garmite and Eshtemoa the Maacathite.
translation:
  language: de
  text: Und die Söhne von Hodijas Frau, der Schwester Nahams, waren der Vater[a][b] von Keïla, dem Garmiter, und der Vater von Eschtemoa, dem Maachatiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Vater« kann in biblischen Stammbäumen auch einen Ahnherrn, Gründer oder Sippenvorsteher bezeichnen, nicht nur den unmittelbaren leiblichen Vater.
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht zuerst der Plural »Söhne«, danach aber der Singular »Vater«. Die knappe Formulierung beschreibt möglicherweise eine Sippenbeziehung und nicht eine einfache Vater-Sohn-Folge.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne von
  rationale: בְּנֵי bezeichnet zunächst »Söhne«, kann in Stammbäumen aber auch Nachkommen meinen. Die direkte Wiedergabe bewahrt die genealogische Formulierung und ihre Spannung zum folgenden Singular.
- source_word: אֵשֶׁת הוֹדִיָּה
  choice: Hodijas Frau
  rationale: Die Status-constructus-Verbindung bezeichnet die Frau beziehungsweise Ehefrau Hodijas. Die gewählte Wortstellung ist im modernen Deutschen natürlich.
- source_word: אֲחוֹת נַחַם
  choice: der Schwester Nahams
  rationale: Die Apposition bestimmt Hodijas Frau näher und gibt die Verwandtschaftsangabe transparent wieder.
- source_word: אֲבִי
  choice: waren der Vater
  rationale: אָב kann in genealogischen Zusammenhängen einen leiblichen Vater, Ahnherrn, Gründer oder Sippenvorsteher bezeichnen. Die auffällige Singularform nach »Söhne« wird nicht stillschweigend geglättet.
- source_word: קְעִילָה
  choice: Keïla
  rationale: Der Eigenname wird in einer im Deutschen gut lesbaren Form wiedergegeben; der Trema verhindert die Aussprache als Diphthong.
- source_word: הַגַּרְמִי
  choice: dem Garmiter
  rationale: Die mit Artikel versehene Herkunfts- oder Sippenbezeichnung wird als deutsches Gentiliz wiedergegeben, ohne zwischen ethnischer und genealogischer Bedeutung zu entscheiden.
- source_word: וְאֶשְׁתְּמֹעַ
  choice: und Eschtemoa
  rationale: Der Eigenname ist durch die Konjunktion mit Keïla koordiniert und wird deutsch transliteriert.
- source_word: הַמַּעֲכָתִי
  choice: dem Maachatiter
  rationale: Die Herkunfts- oder Sippenbezeichnung wird als deutsches Gentiliz wiedergegeben; die genaue Art der Zugehörigkeit bleibt offen.
theological_decisions:
- issue: Bedeutung von »Vater« in der genealogischen Angabe
  choice: Die wörtliche Bezeichnung »Vater« bleibt im Haupttext stehen und wird in einer Fußnote erläutert.
  alternative: »Ahnherr«, »Gründer« oder »Sippenoberhaupt« unmittelbar in den Text setzen.
  rationale: Der hebräische Ausdruck lässt mehrere genealogische beziehungsweise soziale Beziehungen zu. Eine eindeutige Festlegung würde die echte Mehrdeutigkeit des Ausgangstextes beseitigen.
- issue: Numerusspannung zwischen »Söhne« und »Vater«
  choice: Plural und Singular werden trotz der ungewöhnlichen deutschen Konstruktion bewahrt und erläutert.
  alternative: Die Aussage durch eine Ergänzung oder Umstellung zu einer normalen Vater-Sohn-Folge glätten.
  rationale: Die komprimierte oder möglicherweise gestörte genealogische Formulierung lässt sich nicht sicher auflösen; der Text soll keine ungesicherte Familienstruktur festschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Eigennamen sind deutsch lesbar transliteriert. Die ungewöhnliche Numerusverbindung bleibt bewusst sichtbar, weil eine Glättung die unsichere genealogische Beziehung interpretierend festlegen würde.
