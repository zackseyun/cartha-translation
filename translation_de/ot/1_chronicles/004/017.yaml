  register: Moderne, würdige Standardsprache. Die Namensformen folgen einer gut lesbaren deutschen Umschrift. Die syntaktische Unebenheit und die nicht genannte weibliche Person werden nicht durch eine zusätzliche Identifizierung geglättet.
