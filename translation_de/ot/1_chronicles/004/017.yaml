base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/017.yaml
  text: 'The sons of Ezrah: Jether[a], Mered, Epher, and Jalon; and she conceived Miriam, Shammai, and Ishbah[c][b], the father of Eshtemoa.'
translation:
  language: de
  text: 'Die Söhne Esras: Jeter[a], Mered, Efer und Jalon; und sie wurde schwanger mit Mirjam, Schammai und Jischbach[b], dem Vater von Eschtemoa[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Und der Sohn Esras«. Da mehrere Namen folgen, ist die Formulierung hier kollektiv als »die Söhne Esras« verstanden.'
    reason: textual_variant
  - marker: b
    text: 'Im Hebräischen steht nur: »Und sie wurde schwanger«; die Frau wird in diesem Satz nicht genannt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »dem Gründer Eschtemoas«, falls Eschtemoa eine Sippe oder einen Ort bezeichnet und nicht eine einzelne Person.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן עֶזְרָה
  choice: Die Söhne Esras
  rationale: Der hebräische Text hat wörtlich den Singular »und der Sohn Esras«, doch es folgen mehrere Namen. Als genealogische Überschrift ist daher der kollektive Plural im Deutschen am verständlichsten; der auffällige Singular bleibt in einer Fußnote erhalten.
- source_word: יֶתֶר
  choice: Jeter
  rationale: Der Personenname wird in einer im Deutschen geläufigen, am Hebräischen orientierten Form wiedergegeben.
- source_word: וּמֶרֶד
  choice: Mered
  rationale: Personenname, lautnah übertragen.
- source_word: וְעֵפֶר
  choice: Efer
  rationale: Personenname; פ wird hier als f wiedergegeben.
- source_word: וְיָלוֹן
  choice: Jalon
  rationale: Personenname, lautnah übertragen.
- source_word: וַתַּהַר
  choice: Und sie wurde schwanger mit
  rationale: Das Verb הרה bedeutet »schwanger werden/empfangen«. Die Form ist feminin Singular, doch die betreffende Frau wird in diesem Satz nicht genannt. Die deutsche Fassung bewahrt diese Unbestimmtheit.
- source_word: מִרְיָם
  choice: Mirjam
  rationale: Personenname in gebräuchlicher deutscher Umschrift; trotz seiner sonst häufig weiblichen Verwendung wird der Name ohne Deutung wiedergegeben.
- source_word: שַׁמַּי
  choice: Schammai
  rationale: Personenname in deutscher Umschrift.
- source_word: יִשְׁבָּח
  choice: Jischbach
  rationale: Personenname in deutscher Umschrift.
- source_word: אֲבִי אֶשְׁתְּמֹעַ
  choice: dem Vater Eschtemoas
  rationale: אָב bezeichnet formal den »Vater«, kann in genealogischen Listen aber auch den Stammvater oder Gründer eines Ortes beziehungsweise einer Sippe meinen. Die Hauptfassung bleibt nah am Wortlaut; die weitere Möglichkeit steht in der Fußnote.
