  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בִ/בְתוּאֵל
  choice: und in Betuël
  rationale: Die Konjunktion וּ führt die Ortsliste weiter; die Präposition ב wird bei Siedlungsnamen natürlich mit »in« wiedergegeben. בְתוּאֵל ist hier ein Ortsname und wird als »Betuël« transliteriert.
- source_word: וּ/בְ/חָרְמָה
  choice: in Horma
  rationale: חָרְמָה ist ein Ortsname und wird entsprechend der im Deutschen üblichen biblischen Namensform als »Horma« wiedergegeben. Das hebräische וּ/בְ wird syntaktisch durch die fortlaufende deutsche Reihung »in … und in …« abgebildet.
- source_word: וּ/בְ/צִיקְלָג
  choice: und in Ziklag
  rationale: Die Verbindung וּ/בְ wird mit »und in« wiedergegeben; צִיקְלָג bleibt als Ortsname »Ziklag«.
theological_decisions: []
translation_notes:
  register: Knappe, würdige Listenform in modernem Standarddeutsch. Die wiederholte Ortspräposition bleibt erhalten; auf eine unnatürliche vollständige Wiederholung jedes hebräischen »und« wird verzichtet.
