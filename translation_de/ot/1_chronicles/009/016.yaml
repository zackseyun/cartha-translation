source:
  edition: WLC
  text: וְ/עֹבַדְיָה֙ בֶּֽן שְׁמַֽעְיָ֔ה בֶּן גָּלָ֖ל בֶּן יְדוּת֑וּן וּ/בֶרֶכְיָ֤ה בֶן אָסָא֙ בֶּן אֶלְקָנָ֔ה הַ/יּוֹשֵׁ֖ב בְּ/חַצְרֵ֥י נְטוֹפָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/016.yaml
  text: and Obadiah son of Shemaiah[a], son of Galal, son of Jeduthun, and Berechiah son of Asa, son of Elkanah, who lived in the villages of the Netophathites.
translation:
  language: de
  text: und Obadja, der Sohn Schemajas, des Sohnes Galals, des Sohnes Jedutuns, und Berechja, der Sohn Asas, des Sohnes Elkanas, der in den Dörfern der Netofatiter[a] wohnte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den Siedlungen von Netofa«. Das hebräische Bewohnerwort kann entweder mit der Volksbezeichnung »Netofatiter« oder mit dem Ortsnamen »Netofa« wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עֹבַדְיָה
  choice: und Obadja
  rationale: Das vorangestellte וְ verbindet den Namen mit der vorausgehenden Aufzählung. Der Personenname wird in der geläufigen deutschen Form wiedergegeben.
- source_word: בֶּן
  choice: Sohn / Sohn des
  rationale: In dieser genealogischen Aufzählung bezeichnet בֶּן unmittelbar die Abstammungsbeziehung. Die abgestufte deutsche Formulierung macht die Abfolge der Generationen deutlich, ohne mögliche ausgelassene Zwischengenerationen ausdrücklich auszuschließen.
- source_word: שְׁמַעְיָה
  choice: Schemaja
  rationale: Geläufige deutsche Wiedergabe des hebräischen Personennamens.
- source_word: גָּלָל
  choice: Galal
  rationale: Transliteration des Personennamens.
- source_word: יְדוּתוּן
  choice: Jedutun
  rationale: Geläufige deutsche Wiedergabe des Personennamens.
- source_word: וּ/בֶרֶכְיָה
  choice: und Berechja
  rationale: Die Konjunktion führt die Aufzählung fort; der Name wird in einer gebräuchlichen deutschen Form wiedergegeben.
- source_word: אָסָא
  choice: Asa
  rationale: Transliteration des Personennamens; der Text kennzeichnet ihn hier lediglich als Vorfahren Berechjas.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Geläufige deutsche Wiedergabe des Personennamens.
- source_word: הַ/יּוֹשֵׁב
  choice: der … wohnte
  rationale: Das artikulierte Partizip beschreibt im Zusammenhang am natürlichsten Berechja. „Wohnte“ gibt den dauerhaften Aufenthalts- beziehungsweise Wohnsinn idiomatisch wieder.
- source_word: בְּ/חַצְרֵי
  choice: in den Dörfern
  rationale: חָצֵר kann einen umfriedeten Ort, einen Weiler oder eine ländliche Siedlung bezeichnen. Im geografischen Zusammenhang ist „Dörfer“ eine natürliche, sachgerechte Wiedergabe.
- source_word: נְטוֹפָתִי
  choice: der Netofatiter
  rationale: Das Gentiliz bezeichnet die mit Netofa verbundene Bevölkerungsgruppe. Die Formulierung lässt sich im Deutschen direkt als Bewohnerbezeichnung wiedergeben; die mögliche ortsbezogene Fassung wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die genealogischen Beziehungen werden durch „der Sohn …, des Sohnes …“ klar gestaffelt; das einleitende „und“ bleibt erhalten, weil der Vers die vorausgehende Liste fortsetzt.
