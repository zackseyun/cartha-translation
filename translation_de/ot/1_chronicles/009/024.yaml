source:
  edition: WLC
  text: לְ/אַרְבַּ֣ע רוּח֔וֹת יִהְי֖וּ הַ/שֹּׁעֲרִ֑ים מִזְרָ֥ח יָ֖מָּ/ה צָפ֥וֹנָ/ה וָ/נֶֽגְבָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/024.yaml
  text: 'The gatekeepers were at the four directions: east[a], west, north, and south.'
translation:
  language: de
  text: 'Die Torwächter waren an den vier Himmelsrichtungen[a]: im Osten, im Westen, im Norden und im Süden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »an den vier Winden«; gemeint sind hier die vier Himmelsrichtungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבַּע רוּחוֹת
  choice: an den vier Himmelsrichtungen
  rationale: Die Wendung lautet wörtlich »an/zu den vier Winden«, bezeichnet hier aber angesichts der folgenden Aufzählung die vier Himmelsrichtungen. Die Präposition לְ kennzeichnet dabei die räumliche Verteilung.
- source_word: יִהְיוּ
  choice: waren
  rationale: Die schlichte Form von היה gibt hier den Aufenthaltsort beziehungsweise die Verteilung an. »Waren« bleibt näher am Hebräischen als das stärker deutende »waren aufgestellt«.
- source_word: הַשֹּׁעֲרִים
  choice: die Torwächter
  rationale: Das Substantiv bezeichnet die für die Tore zuständigen Wächter; »Torwächter« ist im Tempelkontext klar und idiomatisch.
- source_word: מִזְרָח
  choice: im Osten
  rationale: In der Reihe der Himmelsrichtungen bezeichnet das Wort den Osten.
- source_word: יָמָּה
  choice: im Westen
  rationale: Die Richtungsform bedeutet wörtlich »meerwärts«, bezeichnet im geografischen Sprachgebrauch Israels jedoch den Westen.
- source_word: צָפוֹנָה
  choice: im Norden
  rationale: Die Richtungsform wird im Deutschen idiomatisch mit »im Norden« wiedergegeben.
- source_word: וָנֶגְבָּה
  choice: und im Süden
  rationale: נֶגֶב bezeichnet hier innerhalb der vollständigen Richtungsreihe die südliche Himmelsrichtung und nicht eigens die Landschaft Negev.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Übersetzung bleibt beim schlichten »waren« und vermeidet die nicht ausdrücklich im Verb enthaltene Präzisierung »waren aufgestellt«.
