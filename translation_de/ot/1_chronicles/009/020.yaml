base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/020.yaml
  text: And Phinehas son of Eleazar had formerly been chief over them[a]; Yahweh was with him.
translation:
  language: de
  text: Und Pinhas, der Sohn Eleasars, war früher ihr Vorsteher[a]; Jahwe war mit ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und Pinhas, der Sohn Eleasars, war ihr Vorsteher in früherer Zeit.“ Die hebräische Wortstellung lässt zu, „früher“ enger mit „war Vorsteher“ oder mit der gesamten ersten Aussage zu verbinden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס
  choice: Und Pinhas
  rationale: Der Eigenname wird nach gängiger deutscher Bibeltradition als „Pinhas“ wiedergegeben; das vorangestellte וּ hält mit „Und“ die Verbindung zum Kontext aufrecht.
- source_word: בֶּן אֶלְעָזָר
  choice: der Sohn Eleasars
  rationale: Die deutsche Genitivkonstruktion gibt die genealogische Beziehung knapp und natürlich wieder.
- source_word: נָגִיד
  choice: Anführer
  rationale: נָגִיד bezeichnet eine Person in leitender Stellung. „Anführer“ passt zum kultisch-administrativen Zusammenhang, ohne unnötig königliche Herrschaft anzudeuten.
- source_word: הָיָה
  choice: war
  rationale: Zusammen mit לְפָנִים bezeichnet das Verb einen in früherer Zeit bestehenden Zustand. Im Deutschen bringt „war früher“ dies natürlicher zum Ausdruck als ein Plusquamperfekt.
- source_word: עֲלֵיהֶם
  choice: ihr
  rationale: Das Possessiv in „ihr Anführer“ gibt die durch עַל ausgedrückte Leitungs- oder Aufsichtsfunktion idiomatisch wieder.
- source_word: לְפָנִים
  choice: früher
  rationale: Das Wort wird hier adverbial gebraucht und verweist auf eine frühere Zeit.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עִמּוֹ
  choice: war mit ihm
  rationale: Die knappe Formulierung bewahrt die mögliche Bedeutung von Gottes Gegenwart und Beistand, ohne sie ausdeutend zu erweitern.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von „Jahwe war mit ihm“
  choice: wörtlich und offen als „Jahwe war mit ihm“
  alternative: „Jahwe unterstützte ihn“
  rationale: Die wörtliche Fassung bewahrt die theologische Weite der Aussage, die sowohl Gegenwart als auch Beistand und Gunst einschließen kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist knapp und gut verständlich; „Anführer“ vermeidet sowohl umgangssprachliche als auch übermäßig herrschaftliche Konnotationen.
