source:
  edition: WLC
  text: וּ/מוֹצָ֖א הוֹלִ֣יד אֶת בִּנְעָ֑א וּ/רְפָיָ֥ה בְנ֛/וֹ אֶלְעָשָׂ֥ה בְנ֖/וֹ אָצֵ֥ל בְּנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/043.yaml
  text: And Moza fathered Binea[a], and his son was Rephaiah, his son Eleasah, his son Azel.
translation:
  language: de
  text: Und Moza zeugte Binea; dessen Sohn war Refaja[a], dessen Sohn Elasa und dessen Sohn Azel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und Refaja, sein Sohn, Elasa, sein Sohn, Azel, sein Sohn“.'
    reason: Die deutsche Fassung ergänzt „war“ und ordnet die nominale hebräische Geschlechtsfolge für einen natürlichen und eindeutigen Satzbau um.
lexical_decisions:
- source_word: מוֹצָא
  choice: Moza
  rationale: Personenname; nach der masoretischen Vokalisierung in einer im Deutschen gut lesbaren Form wiedergegeben.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in genealogischem Zusammenhang das Zeugen beziehungsweise Hervorbringen eines Nachkommen. „Zeugte“ ist knapp, sachlich und für eine Geschlechtsfolge angemessen.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Hebräisches Kennzeichen des bestimmten direkten Objekts ohne eigene deutsche Entsprechung.
- source_word: בִּנְעָא
  choice: Binea
  rationale: Personenname; die Form folgt eng der masoretischen Vokalisierung.
- source_word: וּרְפָיָה בְנוֹ
  choice: dessen Sohn war Refaja
  rationale: Die hebräische nominale Fügung lautet wörtlich „und Refaja, sein Sohn“. Die deutsche Wortstellung macht die Abstammungsfolge eindeutig, ohne dem Hebräischen eine inhaltliche Aussage hinzuzufügen.
- source_word: אֶלְעָשָׂה בְנוֹ
  choice: dessen Sohn Elasa
  rationale: Setzt die knappe genealogische Kette fort; „dessen“ bezeichnet jeweils den Sohn des unmittelbar zuvor genannten Mannes.
- source_word: אָצֵל בְנוֹ
  choice: dessen Sohn Azel
  rationale: Gibt das letzte Glied der genealogischen Folge samt ausdrücklich genannter Sohnschaft wieder.
