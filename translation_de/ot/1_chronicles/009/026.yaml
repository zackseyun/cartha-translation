  text: כִּ֣י בֶ/אֱמוּנָ֞ה הֵ֗מָּה אַרְבַּ֨עַת֙ גִּבֹּרֵ֣י הַ/שֹּׁעֲרִ֔ים הֵ֖ם הַ/לְוִיִּ֑ם וְ/הָיוּ֙ עַל הַ/לְּשָׁכ֔וֹת וְ/עַ֥ל הָ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/026.yaml
  text: For these four mighty gatekeepers[a], who were Levites[b], were entrusted with the chambers and with the storehouses of the house of God.
translation:
  language: de
  text: Denn diese vier führenden Torwächter – sie waren Leviten – führten zuverlässig[a] Aufsicht über die Kammern und die Vorratsräume[b] des Hauses Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Treue“. Die hebräische Wendung kann auch auf ein ihnen anvertrautes Vertrauensamt hinweisen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Schatzkammern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Begründung bzw. Erläuterung der zuvor beschriebenen Dienstordnung ein.
- source_word: בֶאֱמוּנָה
  choice: anvertraut
  rationale: אֱמוּנָה bezeichnet Zuverlässigkeit oder Treue. Zusammen mit וְהָיוּ עַל wird der Gedanke eines vertrauensvoll übertragenen Aufsichtsamtes im Deutschen natürlich durch „ihnen waren … anvertraut“ wiedergegeben.
- source_word: אַרְבַּעַת גִּבֹּרֵי הַשֹּׁעֲרִים
  choice: diese vier mächtigen Torwächter
  rationale: „Mächtig“ bewahrt die lexikalische Kraft von גִּבּוֹרֵי, das hier wohl auf angesehene, tüchtige oder führende Männer weist; „Torwächter“ ist die sachgerechte Bezeichnung für dieses Tempelamt.
- source_word: הֵם הַלְוִיִּם
  choice: waren Leviten
  rationale: Gibt die identifizierende, appositionelle Aussage knapp und natürlich wieder, ohne eine Ausschließlichkeit hinzuzufügen.
- source_word: הַלְּשָׁכוֹת
  choice: die Kammern
  rationale: Bezeichnet Räume, die dem Tempeldienst und der Aufbewahrung dienten; „Kammern“ ist eine formale und verständliche Wiedergabe.
- source_word: הָאֹצְרוֹת
  choice: die Vorratsräume
  rationale: אֹצָר kann Lagerraum oder Schatzkammer bedeuten. „Vorratsräume“ hält den Bezug auf gelagerte Güter offen; die finanziellere Alternative wird in einer Fußnote genannt.
- source_word: בֵּית הָאֱלֹהִים
  choice: im Haus Gottes
  rationale: Bewahrt das hebräische Bild und bezeichnet im Kontext den Tempel. „Im“ gibt die Zugehörigkeit bzw. Lage der Räume im Bereich des Gotteshauses natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung macht die Zuordnung der Leviten und ihre Aufsichtsverantwortung klar. Die Fußnoten bewahren die Mehrdeutigkeit von בֶאֱמוּנָה und אֹצָר.
