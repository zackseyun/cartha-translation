    rationale: Die hebräische Wendung bezieht sich auf die vier Amtsträger und ihre zuverlässige bzw. vertrauensvolle Amtsführung. Im Entwurf steht die Anmerkung bei „Torwächter“, während die Übersetzung den Gedanken in die passive Konstruktion „ihnen waren ... anvertraut“ verlagert. Eine explizite Wiedergabe bei der Amtsausübung bewahrt den Wortlaut und die Ambiguität besser.
  - severity: low
