  text: אֵלֶּה֩ רָאשֵׁ֨י הָ/אָב֧וֹת לַ/לְוִיִּ֛ם לְ/תֹלְדוֹתָ֖/ם רָאשִׁ֑ים אֵ֖לֶּה יָשְׁב֥וּ בִ/ירוּשָׁלִָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/034.yaml
  text: These were the heads of the fathers’ houses of the Levites[a], according to their generations, heads[b]. These lived in Jerusalem.
translation:
  language: de
  text: Dies waren die Oberhäupter der levitischen Sippen[a] nach ihren Abstammungslinien, die führenden Männer[b]. Sie lebten in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Sippen“ sind hier größere, nach gemeinsamer Abstammung geordnete Familienverbände gemeint, nicht nur einzelne Haushalte.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „Häupter“. Im Hebräischen wird dasselbe Wort wie zuvor bei „Oberhäupter“ zur Hervorhebung wiederholt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: Oberhäupter der … Sippen
  rationale: Die Wendung bezeichnet die leitenden Männer clanartig gegliederter Abstammungsverbände. „Oberhäupter“ gibt die soziale Leitungsfunktion wieder; „Sippen“ ist im heutigen Deutsch verständlicher als das wörtlichere „Vaterhäuser“.
- source_word: לַלְוִיִּם
  choice: levitischen
  rationale: Das Präfix ל kennzeichnet hier die Zugehörigkeit; die adjektivische Wiedergabe verbindet die Sippen natürlich mit den Leviten.
- source_word: לְתֹלְדוֹתָם
  choice: nach ihren Geschlechterfolgen
  rationale: תּוֹלְדוֹת bezeichnet hier genealogische Abfolgen beziehungsweise Abstammungslinien. Die Formulierung bewahrt den genealogischen Sinn, ohne ausdrücklich schriftliche Register vorauszusetzen.
- source_word: רָאשִׁים
  choice: die führenden Männer
  rationale: Das erneut verwendete Wort רֹאשׁ steht appositionell und hebt ihren Rang hervor. Die Wiedergabe vermeidet die im Deutschen missverständliche Wiederholung „Oberhäupter … Häupter“, während eine Fußnote die hebräische Wiederholung sichtbar macht.
- source_word: יָשְׁבוּ
  choice: lebten
  rationale: ישׁב bezeichnet hier den Wohnsitz. „Lebten“ ist modernes, neutrales Deutsch und impliziert anders als „siedelten“ keinen Ansiedlungsvorgang.
- source_word: בִירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Übliche lokative Wiedergabe des Ortsnamens.
