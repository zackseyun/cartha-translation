base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/044.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan[b]. These were the sons of Azel.'
translation:
  language: de
  text: 'Azel hatte sechs Söhne[a], und ihre Namen waren: Asrikam, Bochru[b], Jischmael, Schearja, Obadja und Hanan. Das waren die Söhne Azels.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und für Azel: sechs Söhne.“ Der Haupttext gibt die übliche hebräische genealogische Formel in natürlichem Deutsch wieder.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräischen Konsonanten können auch als „sein Erstgeborener“ verstanden werden. Die masoretische Vokalisierung liest jedoch „Bochru“ als Eigennamen; so werden sechs Söhne aufgezählt, wie auch in der Parallelstelle 1. Chronik 8,38.
    reason: textual_ambiguity
