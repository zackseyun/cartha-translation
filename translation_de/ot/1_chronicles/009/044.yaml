  rationale: Die masoretische Vokalisierung versteht das Wort als Bezeichnung des erstgeborenen Sohnes mit Possessivsuffix.
- source_word: יִשְׁמָעֵאל
  choice: Jischmael
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: שְׁעַרְיָה
  choice: Schearja
  rationale: Dem hebräischen Namen entsprechende deutsche Transkription.
- source_word: עֹבַדְיָה
  choice: Obadja
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: חָנָן
  choice: Hanan
  rationale: Der Personenname wird in einer im Deutschen etablierten Form wiedergegeben.
- source_word: אֵלֶּה בְּנֵי אָצַל
  choice: Das waren die Söhne Azels
  rationale: Die abschließende genealogische Formel wird klar und strukturgerecht wiedergegeben.
