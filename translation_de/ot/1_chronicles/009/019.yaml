source:
  edition: WLC
  text: וְ/שַׁלּ֣וּם בֶּן ק֠וֹרֵא בֶּן אֶבְיָסָ֨ף בֶּן קֹ֜רַח וְֽ/אֶחָ֧י/ו לְ/בֵית אָבִ֣י/ו הַ/קָּרְחִ֗ים עַ֚ל מְלֶ֣אכֶת הָ/עֲבוֹדָ֔ה שֹׁמְרֵ֥י הַ/סִּפִּ֖ים לָ/אֹ֑הֶל וַ/אֲבֹֽתֵי/הֶם֙ עַל מַחֲנֵ֣ה יְהוָ֔ה שֹׁמְרֵ֖י הַ/מָּבֽוֹא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/019.yaml
  text: And Shallum son of Kore[a], son of Ebiasaph, son of Korah, and his brothers from his father’s house, the Korahites, were over the work of the service, keepers of the thresholds of the tent; and their fathers had been over the camp of Yahweh[b], keepers of the entrance.
translation:
  language: de
  text: 'Und Schallum, der Sohn Kores, des Sohnes Ebjasafs, des Sohnes Korachs, und seine Brüder aus seinem Vaterhaus, die Korachiter, waren für die Arbeit des Dienstes verantwortlich: Sie bewachten die Schwellen[a] des Zeltes. Ihre Väter hatten das Lager Jahwes[b] beaufsichtigt und den Eingang bewacht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „die Tore des Zeltes“. Wörtlich steht im Hebräischen: „die Schwellen des Zeltes“.'
    reason: lexical_alternative
  - marker: b
    text: „Jahwe“ gibt den hebräischen Gottesnamen JHWH wieder, der traditionell auch mit „der HERR“ übersetzt wird.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁלּוּם
  choice: Und Schallum
  rationale: Das vorangestellte וְ verbindet den Vers mit der vorausgehenden Aufzählung; „Und“ bewahrt diesen schlichten Anschluss.
- source_word: בֶּן קוֹרֵא בֶּן אֶבְיָסָף בֶּן קֹרַח
  choice: der Sohn Kores, des Sohnes Ebjasafs, des Sohnes Korachs
  rationale: Die wiederholte genealogische Formel wird ausdrücklich wiedergegeben; die deutschen Genitive machen die Abstammungskette verständlich.
- source_word: וְאֶחָיו לְבֵית אָבִיו
  choice: und seine Brüder aus seinem Vaterhaus
  rationale: „Brüder“ wahrt die konkrete Verwandtschaftsbezeichnung; „Vaterhaus“ ist ein etablierter, noch verständlicher Ausdruck für den väterlichen Familien- oder Sippenverband.
- source_word: הַקָּרְחִים
  choice: die Korachiter
  rationale: Die pluralische Herkunftsbezeichnung benennt die Angehörigen der Linie Korachs.
- source_word: עַל מְלֶאכֶת הָעֲבוֹדָה
  choice: waren für die Arbeit des Dienstes verantwortlich
  rationale: עַל bezeichnet hier Zuständigkeit oder Aufsicht. Die Formulierung ist natürlicher als eine wörtliche Wiedergabe mit „über“, ohne den Dienst kirchlich zu überdeuten.
- source_word: שֹׁמְרֵי הַסִּפִּים לָאֹהֶל
  choice: Sie bewachten die Schwellen des Zeltes
  rationale: שֹׁמְרֵי beschreibt eine fortdauernde Wächteraufgabe; „Schwellen“ erhält das konkrete Bild von סִפִּים, und „Zelt“ gibt אֹהֶל ohne technische Erweiterung wieder.
- source_word: וַאֲבֹתֵיהֶם
  choice: Ihre Väter hatten
  rationale: „Väter“ bewahrt die familiale Ausdrucksweise; das Plusquamperfekt verdeutlicht den Rückblick auf die frühere Generation.
- source_word: עַל מַחֲנֵה יְהוָה
  choice: das Lager Jahwes beaufsichtigt
  rationale: עַל drückt erneut eine Aufsichtsfunktion aus; מַחֲנֶה wird als „Lager“ wiedergegeben, und der Gottesname erscheint als „Jahwe“.
- source_word: שֹׁמְרֵי הַמָּבוֹא
  choice: den Eingang bewacht
  rationale: Die zweite Partizipialfügung bezeichnet die Aufgabe der Vorfahren; „Eingang“ gibt מָבוֹא konkret und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn im Deutschen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung des Heiligtums in לָאֹהֶל
  choice: Zelt
  alternative: Stiftshütte
  rationale: Der Ausgangstext verwendet das gewöhnliche Wort für „Zelt“. Die Übersetzung erhält diese Wortwahl und lässt den Bezug auf das Heiligtum aus dem Zusammenhang hervorgehen.
- issue: Verhältnis der Wächterbegriffe zu Torhüterdienst
  choice: Schwellen bewachen
  alternative: die Tore des Zeltes hüten
  rationale: Die konkrete Formulierung wahrt die hebräische Bildsprache, ohne die funktional plausible Bedeutung „Tore“ in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die langen hebräischen Satzglieder wurden behutsam gegliedert, ohne Informationen auszulassen. „Vaterhaus“ und „Korachiter“ erhalten den genealogisch-institutionellen Ton; „verantwortlich“, „beaufsichtigt“ und „bewacht“ sorgen für natürliche Lesbarkeit.
