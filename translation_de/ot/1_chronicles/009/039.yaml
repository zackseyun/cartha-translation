source:
  edition: WLC
  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/039.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: de
  text: Ner zeugte Kisch, Kisch zeugte Saul, und Saul zeugte Jonatan, Malkischua, Abinadab und Eschbaal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eschbaal wird in 2. Samuel 2,8 und verwandten Stellen Isch-Boschet genannt.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet die Hifil-Form das Zeugen beziehungsweise Vaterwerden. »Zeugte« ist im Deutschen knapp, verständlich und für ein Geschlechtsregister angemessen.
- source_word: נֵר
  choice: Ner
  rationale: Herkömmliche deutsche Form des Personennamens.
- source_word: קִישׁ
  choice: Kisch
  rationale: Herkömmliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Eingebürgerte moderne deutsche Form des Personennamens.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malkischua
  rationale: Der im Hebräischen aus zwei Bestandteilen geschriebene Ausdruck ist ein einziger Personenname; die zusammengeschriebene Form entspricht gängiger deutscher Bibelnamenschreibung.
- source_word: אֲבִינָדָב
  choice: Abinadab
  rationale: Herkömmliche deutsche Form des Personennamens.
- source_word: אֶשְׁבָּעַל
  choice: Eschbaal
  rationale: Der Ausgangstext bietet ausdrücklich Eschbaal; die Übersetzung folgt dieser Form, statt sie an die abweichende Namensform in Samuel anzugleichen.
- source_word: וְ
  choice: und / syntaktische Reihung
  rationale: Die Konjunktionen werden so wiedergegeben, dass die genealogische Abfolge erhalten bleibt, ohne im Deutschen jede hebräische Verbindung mechanisch zu wiederholen.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker besitzt keine direkte deutsche Entsprechung; seine Funktion wird durch den deutschen Satzbau ausgedrückt.
theological_decisions:
- issue: Abweichende Namensform Eschbaal/Isch-Boschet
  choice: Im Haupttext steht entsprechend dem hebräischen Chroniktext »Eschbaal«.
  alternative: Angleichung an »Isch-Boschet« aus 2. Samuel 2,8 und verwandten Stellen.
  rationale: Die Namensform des vorliegenden Ausgangstextes wird bewahrt; die bekannte Parallelform wird transparent in einer Fußnote genannt, ohne die Texte stillschweigend zu harmonisieren.
translation_notes:
  register: Knapper, würdevoller genealogischer Stil in modernem Standarddeutsch. Die Wiederholung von »zeugte« bewahrt die klare Abstammungsfolge; bei der abschließenden Aufzählung wird natürliches deutsches Satzgefüge verwendet.
