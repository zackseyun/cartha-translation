  text: Zechariah son of Meshelemiah was gatekeeper at the entrance to the tent of meeting[a].
translation:
  language: de
  text: Sacharja, der Sohn Meschelemjas, war Torwächter am Eingang zum Zelt der Begegnung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Türhüter am Eingang des Zeltes der Begegnung“.'
    reason: Lexikalische Alternative für שֹׁעֵר sowie eine mögliche relationale Wiedergabe der Präposition לְ.
lexical_decisions:
- source_word: זְכַרְיָה
  choice: Sacharja
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: בֶּן
  choice: der Sohn
  rationale: Der unmittelbare genealogische Zusammenhang spricht für die gewöhnliche Bedeutung „Sohn“ und nicht für das weitere „Nachkomme“.
- source_word: מְשֶׁלֶמְיָה
  choice: Meschelemja
  rationale: Der Personenname wird in einer im Deutschen üblichen, der hebräischen Form entsprechenden Schreibweise wiedergegeben.
- source_word: שֹׁעֵר
  choice: Torwächter
  rationale: Das Substantiv bezeichnet einen Wächter an einem Zugang; „Torwächter“ ist klar, gegenwärtig und passt zum kultischen Zusammenhang.
- source_word: פֶּתַח
  choice: Eingang
  rationale: Das Wort bezeichnet die Öffnung beziehungsweise den Zugangsbereich; „Eingang“ ergibt mit „Torwächter“ eine natürliche deutsche Formulierung.
- source_word: לְאֹהֶל
  choice: zum Zelt
  rationale: 'Die Präposition wird in ihrer räumlich-relationalen Funktion wiedergegeben: der Eingang, der zum Zelt gehört beziehungsweise hineinführt.'
- source_word: מוֹעֵד
  choice: Begegnung
  rationale: Im festen Ausdruck אֹהֶל מוֹעֵד bezeichnet das Wort die von Gott bestimmte Begegnung; „Begegnung“ bewahrt diesen Sinn in natürlichem Deutsch.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Wiedergabe bleibt nah an der hebräischen Heiligtumsbezeichnung und vermeidet die stärker zusammenfassende Bezeichnung „Stiftshütte“.
