  text: וּ/בַקְבַּקַּ֥ר חֶ֖רֶשׁ וְ/גָלָ֑ל וּ/מַתַּנְיָה֙ בֶּן מִיכָ֔א בֶּן זִכְרִ֖י בֶּן אָסָֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/015.yaml
  text: and Bakbakkar[a], Heresh, and Galal, and Mattaniah son of Mica, son of Zichri[b], son of Asaph.
translation:
  language: de
  text: und Bakbakkar, Heresch und Galal sowie Mattanja, der Sohn Michas, des Sohnes Sichris, des Sohnes Asafs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַקְבַּקַּר
  choice: und Bakbakkar
  rationale: Das Präfix ו wird als „und“ wiedergegeben und führt die Aufzählung aus dem Zusammenhang fort; der Personenname wird in einer im Deutschen üblichen Form transliteriert.
- source_word: חֶרֶשׁ
  choice: Heresch
  rationale: Der Eigenname wird nach deutscher Bibeltradition mit „sch“ für שׁ wiedergegeben.
- source_word: וְ/גָלָל
  choice: und Galal
  rationale: Die Konjunktion bleibt zur Gliederung der Namensreihe erhalten; der Eigenname wird transliteriert.
- source_word: וּ/מַתַּנְיָה
  choice: sowie Mattanja
  rationale: „Sowie“ gibt die verbindende Konjunktion natürlich wieder und hebt zugleich den anschließenden Abstammungshinweis ab; Mattanja ist die geläufige deutsche Namensform.
- source_word: בֶּן
  choice: Sohn
  rationale: In dieser genealogischen Kette ist die unmittelbare Wiedergabe „Sohn“ angemessen; ein weiterer Nachkomme ist sprachlich zwar möglich, wird hier aber nicht ausdrücklich angezeigt.
- source_word: מִיכָא
  choice: Micha
  rationale: „Micha“ ist die natürliche deutsche Wiedergabe der hier vorliegenden hebräischen Namensform מִיכָא.
- source_word: זִכְרִי
  choice: Sichri
  rationale: Der Eigenname wird gemäß verbreiteter deutscher Bibelorthografie wiedergegeben.
- source_word: אָסָף
  choice: Asaf
  rationale: „Asaf“ ist die moderne deutsche Transkription des hebräischen Namens.
theological_decisions: []
