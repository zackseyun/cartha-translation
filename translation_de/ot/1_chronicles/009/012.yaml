  text: וַ/עֲדָיָה֙ בֶּן יְרֹחָ֔ם בֶּן פַּשְׁח֖וּר בֶּן מַלְכִּיָּ֑ה וּ/מַעְשַׂ֨י בֶּן עֲדִיאֵ֧ל בֶּן יַחְזֵ֛רָה בֶּן מְשֻׁלָּ֥ם בֶּן מְשִׁלֵּמִ֖ית בֶּן אִמֵּֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/012.yaml
  text: and Adaiah son of Jeroham[a], son of Pashhur, son of Malchijah, and Maasai son of Adiel, son of Jahzerah, son of Meshullam, son of Meshillemith, son of Immer.
translation:
  language: de
  text: Und Adaja, der Sohn Jerohams, des Sohnes Paschhurs, des Sohnes Malkijas, und Maasai, der Sohn Adiëls, des Sohnes Jachseras, des Sohnes Meschullams, des Sohnes Meschillemits[a], des Sohnes Immers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch מְשִׁלֵּמִית wird hier als „Meschillemit“ wiedergegeben; an anderer Stelle erscheint die verwandte Namensform „Meschillemot“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲדָיָה
  choice: und Adaja
  rationale: Das Präfix ו führt die Aufzählung aus dem vorigen Vers fort; der Personenname wird nach gängiger deutscher Bibelnamenkonvention wiedergegeben.
- source_word: בֶּן
  choice: Sohn / des Sohnes
  rationale: In dieser Geschlechtsfolge ist die Grundbedeutung „Sohn“ angemessen; die flektierte Wiederholung bewahrt die hebräische genealogische Struktur in natürlichem Deutsch.
- source_word: יְרֹחָם
  choice: Jeroham
  rationale: Transliteration nach geläufiger deutscher Bibelnamenkonvention.
- source_word: פַּשְׁחוּר
  choice: Paschhur
  rationale: Die Schreibweise gibt den hebräischen Namen in einer im Deutschen verständlichen Form wieder und lässt den doppelten Kehllaut erkennen.
- source_word: מַלְכִּיָּה
  choice: Malkija
  rationale: Nahe Umschrift des masoretischen Namens in deutscher Orthografie; gegenüber „Malchija“ wird das hebräische כ hier als k wiedergegeben.
- source_word: וּ/מַעְשַׂי
  choice: und Maasai
  rationale: Die Konjunktion wird ausdrücklich wiedergegeben. „Maasai“ folgt der hier bezeugten kürzeren Namensform und unterscheidet sie von Maaseja.
- source_word: עֲדִיאֵל
  choice: Adiël
  rationale: Deutsche Transliteration; das Trema verdeutlicht, dass i und e getrennt gesprochen werden.
- source_word: יַחְזֵרָה
  choice: Jachsera
  rationale: Nahe deutsche Transliteration des im masoretischen Text stehenden Namens.
- source_word: מְשֻׁלָּם
  choice: Meschullam
  rationale: Geläufige deutsche Wiedergabe des hebräischen Personennamens.
- source_word: מְשִׁלֵּמִית
  choice: Meschillemit
  rationale: Die Wiedergabe folgt unmittelbar der hier im masoretischen Text belegten Form und gleicht sie nicht an die verwandte Form Meschillemot an.
- source_word: אִמֵּר
  choice: Immer
  rationale: Geläufige und formnahe deutsche Wiedergabe des Personennamens.
