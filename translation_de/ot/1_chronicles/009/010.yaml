  text: 'And from the priests: Jedaiah, Jehoiarib, and Jakin.'
translation:
  language: de
  text: 'Und von den Priestern: Jedaja, Jojarib und Jachin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: Und von
  rationale: Die Verbindung aus ו und מִן leitet innerhalb der Aufzählung die nächste Gruppe ein; „Und von“ bewahrt sowohl den Anschluss als auch die hebräische Listenstruktur.
- source_word: הַכֹּהֲנִים
  choice: den Priestern
  rationale: Sachgemäße und im Deutschen natürliche Wiedergabe der bestimmten Pluralform; nach „von“ steht der Dativ.
- source_word: יְדַעְיָה
  choice: Jedaja
  rationale: Im deutschen Bibelgebrauch etablierte Umschrift des Personennamens.
- source_word: וִיהוֹיָרִיב
  choice: Jojarib
  rationale: Im deutschen Bibelgebrauch übliche Namensform; das vorangestellte ו wird im Deutschen durch die Aufzählungsstruktur wiedergegeben.
- source_word: וְיָכִין
  choice: und Jachin
  rationale: Konventionelle deutsche Namensform; das ו kennzeichnet das letzte Glied der Aufzählung und wird mit „und“ wiedergegeben.
