    text: 'Oder: „Jëuël und seine Brüder, sechshundertneunzig“, wenn Jëuël als stellvertretendes Haupt der Sippe verstanden wird. Das hebräische Suffix in „ihre Brüder“ steht jedoch im Plural.'
