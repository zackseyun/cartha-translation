lexical_decisions:
- source_word: וּ/מִן
  choice: Und von
  rationale: Das vorangestellte ו verbindet den Vers additiv mit der vorausgehenden Aufzählung; „Und von“ bewahrt diesen Listenfluss.
- source_word: בְּנֵי
  choice: den Söhnen
  rationale: Die direkte genealogische Wiedergabe lässt zugleich den weiteren Sinn „Nachkommen/Clanangehörige“ zu.
- source_word: זֶרַח
  choice: Serach
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert.
- source_word: יְעוּאֵל
  choice: Jëuël
  rationale: Die Schreibung bildet die hebräischen Vokale und die Silbentrennung des Namens im Deutschen nachvollziehbar ab.
- source_word: וַ/אֲחֵי/הֶם
  choice: und ihre Brüder
  rationale: Das hebräische Suffix steht in der 3. Person Plural. Die wörtliche Wiedergabe bewahrt diese grammatische Form und glättet sie nicht zu einem Singularbezug auf Jëuël.
- source_word: שֵׁשׁ מֵאוֹת וְ/תִשְׁעִים
  choice: sechshundertneunzig
  rationale: Die ausgeschriebene Zahl entspricht einem würdigen deutschen Bibelstil und bezeichnet die Gesamtzahl der aufgeführten Gruppe.
