  text: וְ/אָחָז֙ הוֹלִ֣יד אֶת יַעְרָ֔ה וְ/יַעְרָ֗ה הוֹלִ֛יד אֶת עָלֶ֥מֶת וְ/אֶת עַזְמָ֖וֶת וְ/אֶת זִמְרִ֑י וְ/זִמְרִ֖י הוֹלִ֥יד אֶת מוֹצָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/042.yaml
  text: Ahaz fathered Jarah[a], and Jarah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: de
  text: Ahas zeugte Jara[a], und Jara zeugte Alemet, Asmawet und Simri; und Simri zeugte Moza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im parallelen Geschlechtsregister in 1. Chronik 8,36 steht „Jehoadda“ statt „Jara“. Die hier überlieferten Chronik-Handschriften lesen „Jara“; diese Form bleibt im Haupttext erhalten.
    reason: textual_variant
lexical_decisions:
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet der Hifil von ילד das Zeugen beziehungsweise Vaterwerden. „zeugte“ ist im Deutschen knapp, verständlich und für biblische Geschlechtsregister angemessen.
- source_word: יַעְרָה
  choice: Jara
  rationale: Der Personenname wird nach der hier überlieferten hebräischen Form wiedergegeben und nicht an die Parallelstelle angeglichen.
- source_word: עָלֶמֶת
  choice: Alemet
  rationale: Der Eigenname wird in einer im Deutschen lesbaren, quellenahen Umschrift wiedergegeben.
- source_word: עַזְמָוֶת
  choice: Asmawet
  rationale: Der Eigenname wird quellenah und nach geläufiger deutscher Umschrift wiedergegeben.
- source_word: זִמְרִי
  choice: Simri
  rationale: Der Eigenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: מוֹצָא
  choice: Moza
  rationale: Der Eigenname wird in einer quellenahen deutschen Umschrift wiedergegeben.
- source_word: וְ
  choice: und
  rationale: Die vorangestellte Konjunktion verbindet die Glieder des Geschlechtsregisters additiv; „und“ gibt dies unmittelbar wieder.
- source_word: אֶת
  choice: '[nicht eigens übersetzt]'
  rationale: Der hebräische Akkusativmarker besitzt keine direkte deutsche Entsprechung; seine syntaktische Funktion zeigt sich in der Satzstruktur.
