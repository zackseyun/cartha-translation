  text: וּ/מִקְל֖וֹת הוֹלִ֣יד אֶת שִׁמְאָ֑ם וְ/אַף הֵ֗ם נֶ֧גֶד אֲחֵי/הֶ֛ם יָשְׁב֥וּ בִ/ירֽוּשָׁלִַ֖ם עִם אֲחֵי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/038.yaml
  text: Mikloth fathered Shimeam[a]. They also lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: de
  text: Und Miklot zeugte Schimeam[a]. Auch sie wohnten ihren Brüdern gegenüber[b] in Jerusalem, zusammen mit ihren Brüdern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Schimeam; manche Übersetzungen lesen wohl in Angleichung an parallele Namensformen „Schima“.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „vor ihren Brüdern“ beziehungsweise „in der Nähe ihrer Brüder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: Und Miklot
  rationale: Der Eigenname wird nach der hebräischen Form als „Miklot“ wiedergegeben; das vorangestellte וּ wird als fortführendes „Und“ beibehalten.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet die Hifil-Form von ילד das Zeugen beziehungsweise Vaterwerden. „zeugte“ ist knapp, geläufig und sachlich präzise.
- source_word: אֶת שִׁמְאָם
  choice: Schimam
  rationale: Die Form folgt dem Konsonantentext dieses Verses; die Akkusativpartikel אֶת bleibt unübersetzt.
- source_word: וְאַף הֵם
  choice: Auch sie
  rationale: Die additive Hervorhebung von אַף wird mit „Auch“ natürlich wiedergegeben; der Anschluss der neuen deutschen Satzperiode benötigt kein zusätzliches „und“.
- source_word: נֶגֶד
  choice: gegenüber
  rationale: Das Wort bezeichnet hier am ehesten eine räumliche Lage gegenüber beziehungsweise vor einer anderen Gruppe, ohne die genaue Anordnung näher festzulegen.
- source_word: אֲחֵיהֶם
  choice: ihren Brüdern
  rationale: Die wörtliche Verwandtschaftsbezeichnung wird beibehalten; im genealogischen Kontext kann sie zugleich Angehörige derselben Sippe bezeichnen.
- source_word: יָשְׁבוּ
  choice: wohnten
  rationale: ישׁב bezeichnet hier den dauerhaften Wohnsitz; „wohnten“ ist modernes, natürliches Deutsch.
- source_word: בִירוּשָׁלִַם
  choice: in Jerusalem
  rationale: Der Ortsname und die Präposition werden in ihrer üblichen deutschen Form wiedergegeben.
- source_word: עִם אֲחֵיהֶם
  choice: zusammen mit ihren Brüdern
  rationale: עִם drückt Gemeinschaft aus. Die Wiederholung von „ihren Brüdern“ wird entsprechend dem Hebräischen bewahrt; „zusammen mit“ macht die Zuordnung im Deutschen klar.
