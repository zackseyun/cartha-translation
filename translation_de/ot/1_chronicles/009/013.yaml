  text: וַ/אֲחֵי/הֶ֗ם רָאשִׁים֙ לְ/בֵ֣ית אֲבוֹתָ֔/ם אֶ֕לֶף וּ/שְׁבַ֥ע מֵא֖וֹת וְ/שִׁשִּׁ֑ים גִּבּ֣וֹרֵי חֵ֔יל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/013.yaml
  text: And their brothers[a], heads of their fathers’ houses[c][b], were 1,760 mighty men of valor for the work of the service of the house of God.
translation:
  language: de
  text: Und ihre Brüder[a], die Oberhäupter ihrer Vaterhäuser[b], zählten 1.760 tüchtige Männer[c] für die Arbeit im Dienst am Haus Gottes[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verwandten“ beziehungsweise „Sippenangehörigen“. Das hebräische Wort für „Brüder“ kann auch Angehörige eines weiteren Familienverbands bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ihrer Vaterhäuser“; gemeint sind die väterlichen Familien- oder Sippenverbände.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „tapfere Männer“, „starke Männer“ beziehungsweise „fähige Männer“. Die hebräische Wendung bezeichnet Stärke oder bewährte Leistungsfähigkeit und ist hier nicht notwendig militärisch gemeint.'
    reason: lexical_alternative
  - marker: d
    text: Das „Haus Gottes“ ist hier der Tempel.
    reason: clarification
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Und ihre Brüder
  rationale: „Brüder“ bewahrt die konkrete männliche Verwandtschaftsbezeichnung; im genealogischen Zusammenhang kann das Wort auch Angehörige derselben Sippe bezeichnen.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: die Oberhäupter ihrer Großfamilien
  rationale: Die hebräische Verwaltungs- und Verwandtschaftsformel bezeichnet die leitenden Männer der jeweiligen väterlichen Familienverbände. „Großfamilien“ ist im heutigen Deutsch verständlicher als die wörtliche Wendung „Vaterhäuser“.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: '1.760'
  rationale: Die Zahlwörter ergeben eindeutig 1.760 und werden nach moderner deutscher Schreibweise wiedergegeben.
- source_word: גִּבּוֹרֵי חֵיל
  choice: tüchtige Männer
  rationale: Die feste Wendung kann Tapferkeit, Stärke, Leistungsfähigkeit oder bewährte Tüchtigkeit ausdrücken. Da hier der Tempeldienst und nicht der Kampf gemeint ist, passt „tüchtige Männer“ zum Kontext, ohne den ehrenden Charakter zu verlieren.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: für die Arbeit im Dienst
  rationale: Die Wiedergabe lässt sowohl מְלָאכָה („Arbeit, Aufgabe“) als auch עֲבוֹדָה („Dienst“) erkennen und vermeidet zugleich die im Deutschen schwerfällige Formulierung „Arbeit des Dienstes“.
- source_word: בֵּית הָאֱלֹהִים
  choice: Haus Gottes
  rationale: Die wörtliche hebräische Bezeichnung wird bewahrt; im Zusammenhang ist damit der Tempel gemeint.
theological_decisions:
- issue: Verwandtschaftsbezeichnung im männlichen Plural
  choice: Brüder
  alternative: Verwandte / Sippenangehörige
  rationale: Der konkrete männliche Ausdruck des Hebräischen bleibt erhalten; eine Fußnote weist auf seine mögliche weitere Bedeutung hin.
- issue: Bedeutung von גִּבּוֹרֵי חֵיל im kultischen Kontext
  choice: tüchtige Männer
  alternative: tapfere Männer / starke Männer
  rationale: Die Übersetzung beschränkt die ehrende Wendung nicht auf militärische Tapferkeit, da der Satz ausdrücklich vom Dienst am Haus Gottes handelt.
- issue: Bezeichnung des Heiligtums
  choice: Haus Gottes
  alternative: Tempel Gottes
  rationale: Die Quellmetapher bleibt sichtbar, ohne zu bestreiten, dass sie hier den Tempel bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwer verständliche wörtliche Sozialbezeichnung „Vaterhäuser“ wird im Haupttext als „Großfamilien“ wiedergegeben und in der Fußnote offengelegt. Die doppelte Aussage von „Arbeit“ und „Dienst“ bleibt in natürlicher deutscher Form erhalten.
