  to: In Gibeon wohnte Jeïël[b], der Vater Gibeons[a]; der Name seiner Frau war Maacha.
  rationale: Die Revision beseitigt die sachlich und syntaktisch irreführende Einbeziehung der Frau in das Verb »wohnten«. Die formal auffällige Pluralform des Hebräischen wird nicht durch eine deutsche Konstruktion wiedergegeben, die den folgenden Nominalsatz umdeutet; der Singular ist in dieser genealogischen Formel die natürliche, semantisch zutreffende Lösung. Die Namensvarianten-Fußnote wird korrekt bei Jeïël platziert und neutral formuliert.
