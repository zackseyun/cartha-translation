  text: וּ/בְ/גִבְע֛וֹן יָשְׁב֥וּ אֲבִֽי גִבְע֖וֹן יעואל וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ מַעֲכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/035.yaml
  text: In Gibeon lived Jeiel the father of Gibeon[b][a], and his wife's name was Maacah.
translation:
  language: de
  text: In Gibeon wohnte Jeïël[b], der Vater Gibeons[a]; der Name seiner Frau war Maacha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Vater Gibeons«; gemeint sein kann auch der Gründer, Ahnherr oder führende Mann von Gibeon.'
    reason: lexical_alternative
  - marker: b
    text: Der hier überlieferte Name kann auch als »Jeïuël« wiedergegeben werden; vergleiche 1. Chronik 8,29.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְ/גִבְע֛וֹן
  choice: In Gibeon
  rationale: Die Ortsangabe wird im Deutschen natürlich vorangestellt. Das einleitende וּ bleibt unübersetzt, da es hier lediglich den Anschluss an den Zusammenhang markiert.
- source_word: יָשְׁב֥וּ
  choice: wohnten
  rationale: Die Pluralform des Verbs wird bewahrt und auf Jeïël und seine anschließend erwähnte Frau bezogen. Das ist grammatisch transparent und vermeidet die Glättung zum Singular.
- source_word: יעואל
  choice: Jeïël
  rationale: Die Vokalisierung und die Parallelstelle 1. Chronik 8,29 stützen die überlieferte Namensform Jeïël; der abweichende Konsonantentext wird in einer Fußnote dokumentiert.
- source_word: אֲבִֽי גִבְע֖וֹן
  choice: der Vater Gibeons
  rationale: Die wörtliche Wendung bleibt im Haupttext erhalten. Im Siedlungs- oder Sippenzusammenhang kann »Vater« auch einen Gründer, Ahnherrn oder führenden Mann bezeichnen.
- source_word: וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ מַעֲכָֽה
  choice: und seine Frau, die Maacha hieß
  rationale: Natürliches modernes Deutsch für die nominale hebräische Formulierung »und der Name seiner Frau war Maacha«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung »Vater Gibeons« wird aus Gründen der Textnähe bewahrt und erläutert. Die hebräische Verbform im Plural wird anders als in manchen Übersetzungen ausdrücklich wiedergegeben.
