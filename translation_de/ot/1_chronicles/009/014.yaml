  variant: modern standard German
source:
  edition: WLC
  text: וּ/מִֽן הַ/לְוִיִּ֑ם שְׁמַֽעְיָ֧ה בֶן חַשּׁ֛וּב בֶּן עַזְרִיקָ֥ם בֶּן חֲשַׁבְיָ֖ה מִן בְּנֵ֥י מְרָרִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/014.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, from the sons of Merari.'
translation:
  language: de
  text: 'Und von den Leviten: Schemaja, der Sohn Haschubs, des Sohnes Asrikams, des Sohnes Haschabjas, von den Söhnen Meraris[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Nachkommen Meraris. Die hebräische Wendung „Söhne Meraris“ kann auch eine weiter gefasste Sippenzugehörigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Und von
  rationale: Die Konjunktion ו verbindet den Eintrag mit der vorausgehenden Aufzählung; מִן bezeichnet die Zugehörigkeit zu einer Gruppe.
- source_word: הַלְוִיִּם
  choice: den Leviten
  rationale: Übliche und klare deutsche Bezeichnung der Stammes- beziehungsweise Dienstgruppe; der bestimmte Artikel ist berücksichtigt.
- source_word: שְׁמַעְיָה
  choice: Schemaja
  rationale: Im Deutschen gebräuchliche, am Hebräischen orientierte Umschrift des Personennamens.
- source_word: בֶן
  choice: Sohn
  rationale: In der vorliegenden genealogischen Kette bezeichnet בֶן am naheliegendsten die jeweilige Sohn-Vater-Beziehung.
- source_word: חַשּׁוּב
  choice: Haschub
  rationale: Deutsche Umschrift des hebräischen Personennamens; die Konsonantenverdopplung wird in der geläufigen deutschen Namensform nicht eigens wiedergegeben.
- source_word: עַזְרִיקָם
  choice: Asrikam
  rationale: Am hebräischen Lautbestand orientierte deutsche Umschrift des Personennamens.
- source_word: חֲשַׁבְיָה
  choice: Haschabja
  rationale: Am Hebräischen orientierte und im Deutschen verständliche Umschrift des Personennamens.
- source_word: מִן בְּנֵי מְרָרִי
  choice: von den Nachkommen Meraris
  rationale: בְּנֵי bezeichnet hier die weitere Sippenzugehörigkeit und nicht notwendig unmittelbare Söhne; »Nachkommen« gibt die genealogische Funktion im natürlichen Deutschen präzise wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die elliptische Listenform des Hebräischen bleibt erhalten. In der unmittelbaren Ahnenreihe wird »Sohn« verwendet, bei der umfassenderen meraritischen Sippenzugehörigkeit dagegen »Nachkommen«, um die unterschiedliche genealogische Funktion natürlich und genau auszudrücken.
