base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/037.yaml
  text: and Gedor[a], and Ahio, and Zechariah, and Mikloth.
translation:
  language: de
  text: und Gedor, Achjo, Sacharja und Miklot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/גְד֣וֹר
  choice: und Gedor
  rationale: Der Personenname wird nach üblicher deutscher Bibelschreibung als »Gedor« wiedergegeben; das vorangestellte וּ wird mit »und« übersetzt.
- source_word: וְ/אַחְי֔וֹ
  choice: Ahio
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen Form »Ahio« wiedergegeben. Das hebräische וְ verbindet auch diesen Namen; im Deutschen genügt in einer Aufzählung nach dem ersten Glied das Komma.
- source_word: וּ/זְכַרְיָ֖ה
  choice: Secharja
  rationale: »Secharja« ist die etablierte moderne deutsche Bibelform des hebräischen Namens זְכַרְיָה. Die koordinierende Verbindung wird durch die deutsche Zeichensetzung ausgedrückt.
- source_word: וּ/מִקְלֽוֹת
  choice: und Miklot
  rationale: Der Personenname wird gemäß moderner deutscher Transliteration als »Miklot« geschrieben; das Schlusszeichen ת wird als t wiedergegeben. Vor dem letzten Glied steht idiomatisch »und«.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Standarddeutsch. Die wiederholten hebräischen Konjunktionen werden als natürliche deutsche Aufzählung mit Kommas und einem abschließenden »und« gestaltet. Die Namensformen folgen der gebräuchlichen deutschen Bibeltradition.
