source:
  edition: WLC
  text: וּ/מֵ/הֶ֖ם עַל כְּלֵ֣י הָ/עֲבוֹדָ֑ה כִּֽי בְ/מִסְפָּ֣ר יְבִיא֔וּ/ם וּ/בְ/מִסְפָּ֖ר יוֹצִיאֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/028.yaml
  text: Some of them were in charge of the vessels of service[a], for they brought them in by count and took them out by count.
translation:
  language: de
  text: Einige von ihnen waren für die Geräte des Tempeldienstes[a] verantwortlich, denn sie brachten sie gezählt hinein und nahmen sie gezählt heraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gefäße des Tempeldienstes“ beziehungsweise „die beim Tempeldienst verwendeten Gegenstände“. Das hebräische Wort kann Gefäße, Geräte, Werkzeuge oder andere Gegenstände bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם
  choice: Einige von ihnen
  rationale: Die Verbindung aus מִן und Pronominalsuffix bezeichnet eine Teilmenge der zuvor genannten Gruppe; diese Wiedergabe ist im Deutschen natürlich und genau.
- source_word: עַל
  choice: waren für … verantwortlich
  rationale: עַל bezeichnet hier die Zuständigkeit oder Aufsicht über die Geräte; die gewählte Formulierung gibt dies in modernem Deutsch klar wieder.
- source_word: כְּלֵי הָעֲבוֹדָה
  choice: die Geräte des Tempeldienstes
  rationale: כְּלִי kann Gefäße, Geräte, Gegenstände oder Werkzeuge bezeichnen. הָעֲבוֹדָה meint im Kontext den Dienst am Tempel; die Kontextangabe verhindert ein zu allgemeines Verständnis.
- source_word: כִּי
  choice: durch ein Semikolon wiedergegeben
  rationale: כִּי leitet die Erläuterung ihrer Verantwortung ein. Im Deutschen stellt ein Semikolon diesen Zusammenhang flüssig dar, ohne ihn stärker kausal festzulegen.
- source_word: בְמִסְפָּר
  choice: abgezählt
  rationale: Die Wendung bezeichnet zahlenmäßige Erfassung und kontrollierte Ausgabe beziehungsweise Rücknahme. Das wiederholte „abgezählt“ bewahrt den Nachdruck des Hebräischen.
- source_word: יְבִיאוּם
  choice: sie brachten sie … hinein
  rationale: Der Hifil von בוא mit Objektsuffix bedeutet „sie hineinbringen“. Das Präteritum beschreibt im erzählenden Kontext den üblichen Ablauf.
- source_word: יוֹצִיאוּם
  choice: nahmen sie … wieder heraus
  rationale: Der Hifil von יצא bedeutet „hinausbringen“ oder „herausnehmen“. „Wieder“ verdeutlicht idiomatisch den Gegenablauf zum Hineinbringen, ohne den sachlichen Sinn zu verändern.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Tempeldienst“ macht den im Kontext vorausgesetzten Bezug deutlich; „Geräte“ wahrt zugleich die Breite des hebräischen Begriffs. Die Wiederholung von „abgezählt“ erhält den Akzent auf genauer Bestandskontrolle.
