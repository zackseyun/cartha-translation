  text: וְ/כָל יִשְׂרָאֵל֙ הִתְיַחְשׂ֔וּ וְ/הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֖פֶר מַלְכֵ֣י יִשְׂרָאֵ֑ל וִ/יהוּדָ֛ה הָגְל֥וּ לְ/בָבֶ֖ל בְּ/מַעֲלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/001.yaml
  text: So all Israel was enrolled by genealogy[a], and behold, they are written in the Book of the Kings of Israel[b]; and Judah was taken into exile to Babylon because of their unfaithfulness.
translation:
  language: de
  text: Alle Israeliten wurden nach ihrer Abstammung registriert[a]; und siehe, sie sind im Buch der Könige Israels verzeichnet; und Juda wurde wegen seiner Untreue[b] nach Babel verschleppt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurden genealogisch erfasst“; „wurden in die Geschlechtsregister eingetragen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wegen seines Treuebruchs“ beziehungsweise „wegen seiner Treulosigkeit“. Das hebräische Wort bezeichnet häufig einen Treuebruch gegenüber Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַחְשׂוּ
  choice: wurden nach ihrer Abstammung registriert
  rationale: Das Hitpael von יחס bezeichnet die genealogische Zuordnung beziehungsweise Registrierung. Die Formulierung gibt sowohl die Abstammung als auch den verwaltungsmäßigen Vorgang in natürlichem Deutsch wieder.
- source_word: וְהִנָּם
  choice: siehe, sie sind
  rationale: הִנָּם hebt das Folgende präsentierend hervor. „Siehe“ bewahrt diese Aufmerksamkeitsfunktion in würdigem, bibelgemäßem Deutsch.
- source_word: כְּתוּבִים
  choice: verzeichnet
  rationale: Das passive Partizip beschreibt einen bestehenden Eintrag. „Verzeichnet“ ist im Zusammenhang eines schriftlichen Registers idiomatischer als das wörtliche „geschrieben“.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: Bei schriftlichen Einträgen entspricht „im Buch“ dem deutschen Sprachgebrauch, auch wenn עַל grundsätzlich „auf/über“ bedeuten kann.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: der Könige Israels
  rationale: Die Wendung bezeichnet den Titel oder Gegenstand des genannten Quellenwerks, ohne weiter festzulegen, um welches erhaltene oder verlorene Werk es sich handelt.
- source_word: וִיהוּדָה
  choice: Juda aber
  rationale: Juda ist das kollektive Subjekt des folgenden Satzes. „Aber“ markiert den deutlichen Übergang von der Registrierung ganz Israels zur Verbannung Judas, ohne einen inhaltlichen Gegensatz zu überzeichnen.
- source_word: הָגְלוּ
  choice: wurde … verschleppt
  rationale: Die Hofal-Form ist passiv und stellt Juda als von der Deportation betroffen dar. „Verschleppt“ bringt den erzwungenen Charakter klar zum Ausdruck.
- source_word: לְבָבֶל
  choice: nach Babel
  rationale: „Nach Babel“ ist die traditionelle und weiterhin verständliche deutsche Wiedergabe des hebräischen Ortsnamens als Zielangabe.
- source_word: בְּמַעֲלָם
  choice: wegen seiner Untreue
  rationale: מַעַל bezeichnet einen Treuebruch, häufig gegenüber Gott. „Untreue“ bewahrt diese Beziehungs- und Bundesdimension, ohne sie auslegend zu erweitern.
theological_decisions:
- issue: Art von Judas Vergehen in בְּמַעֲלָם
  choice: Untreue
  alternative: Treuebruch; Verfehlung
  rationale: Der Ausdruck bezeichnet mehr als ein beliebiges Fehlverhalten und kann einen Treuebruch gegenüber Gott meinen. „Untreue“ erhält diese theologische Spannung, ohne das im Vers nicht ausdrücklich genannte Bundesverhältnis einzufügen.
- issue: Diathese von הָגְלוּ
  choice: passive Deportation („wurde … verschleppt“)
  alternative: „ging ins Exil“
  rationale: Die Hofal-Form kennzeichnet Juda als Objekt der Verbannung. Die passive Wiedergabe verhindert, dass die erzwungene Deportation wie eine freiwillige Auswanderung klingt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Alle Israeliten“ gibt das kollektive „ganz Israel“ so wieder, dass der anschließende hebräische Plural („sie“) im Deutschen klar anschließen kann. „Babel“ wahrt die geläufige biblische Namensform; „siehe“ erhält bewusst den präsentierenden Akzent des Ausgangstextes.
