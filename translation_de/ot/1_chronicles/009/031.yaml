  text: וּ/מַתִּתְיָה֙ מִן הַ/לְוִיִּ֔ם ה֥וּא הַ/בְּכ֖וֹר לְ/שַׁלֻּ֣ם הַ/קָּרְחִ֑י בֶּ/אֱמוּנָ֕ה עַ֖ל מַעֲשֵׂ֥ה הַ/חֲבִתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/031.yaml
  text: And Mattithiah[a], from the Levites, the firstborn of Shallum the Korahite[b], was entrusted with the work of the flat cakes.
translation:
  language: de
  text: Und Mattitja, einer der Leviten, der Erstgeborene Schallums, des Korachiters, war mit der Zubereitung der Fladen[b] betraut[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „war zuverlässig für die Zubereitung der Fladen verantwortlich“. Die hebräische Wendung kann entweder Mattitjas zuverlässige Amtsführung oder die ihm anvertraute Zuständigkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet eine Art Kuchen oder Fladen, möglicherweise Pfannen- oder Backplattenfladen.
    reason: cultural_note
lexical_decisions:
- source_word: וּמַתִּתְיָה
  choice: Und Mattitja
  rationale: Der Name wird in einer im Deutschen gebräuchlichen, hebräischen Lautung wiedergegeben; die Konjunktion führt die Aufzählung fort.
- source_word: מִן הַלְוִיִּם
  choice: einer der Leviten
  rationale: מִן bezeichnet hier die Zugehörigkeit zu der Gruppe der Leviten; diese Wiedergabe ist im Deutschen natürlicher als „von den Leviten“.
- source_word: הוּא הַבְּכוֹר לְשַׁלֻּם
  choice: der Erstgeborene des … Schallum
  rationale: בְּכוֹר wird sachnah als „Erstgeborener“ wiedergegeben und bezeichnet Mattitjas familiäre Stellung zu Schallum.
- source_word: הַקָּרְחִי
  choice: Korachiters
  rationale: Das Adjektiv bezeichnet Schallum als Angehörigen der Sippe Korachs.
- source_word: בֶּאֱמוּנָה
  choice: zuverlässig
  rationale: Das Substantiv kann in diesem Verwaltungskontext die treue, verlässliche Ausführung einer Aufgabe bezeichnen; die mögliche Bedeutung einer anvertrauten Zuständigkeit bleibt in der Fußnote erhalten.
- source_word: עַל מַעֲשֵׂה
  choice: für die Herstellung … verantwortlich
  rationale: עַל drückt Zuständigkeit oder Aufsicht aus; מַעֲשֵׂה bezeichnet hier sachgerecht die Herstellung bzw. Zubereitung.
- source_word: הַחֲבִתִּים
  choice: der Fladen
  rationale: Das seltene Wort bezeichnet eine Art zubereiteten Kuchens oder Fladens, wahrscheinlich aus der Pfanne oder auf einer Backplatte.
