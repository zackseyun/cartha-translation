source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הַ֠/מְשֹׁרְרִים רָאשֵׁ֨י אָב֧וֹת לַ/לְוִיִּ֛ם בַּ/לְּשָׁכֹ֖ת פטירים כִּֽי יוֹמָ֥ם וָ/לַ֛יְלָה עֲלֵי/הֶ֖ם בַּ/מְּלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/033.yaml
  text: These were the singers[a], heads of fathers’ houses of the Levites, in the chambers, free from other duties, for they were occupied in the work day and night.
translation:
  language: de
  text: Das waren die Sänger, die Oberhäupter der levitischen Sippen. Sie waren in den Kammern und von anderen Aufgaben freigestellt[a], denn Tag und Nacht waren sie mit der Arbeit beschäftigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entbunden“ beziehungsweise „frei“. Das seltene hebräische Wort bedeutet hier wahrscheinlich, dass sie wegen ihrer fortlaufenden Aufgabe als Sänger von anderen Diensten befreit waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: die Sänger
  rationale: Das Partizip von שׁיר bezeichnet hier Personen, die singen; „Sänger“ ist genauer als das weiter gefasste „Musiker“.
- source_word: רָאשֵׁי אָבוֹת לַלְוִיִּם
  choice: die Oberhäupter der levitischen Sippen
  rationale: Die Wendung bezeichnet die leitenden Vertreter der Abstammungsverbände unter den Leviten. „Sippen“ gibt die genealogische Sozialstruktur verständlich wieder, ohne das im Deutschen missverständliche „Vaterhäuser“ zu verwenden.
- source_word: בַּלְּשָׁכֹת
  choice: in den Kammern
  rationale: לשכה bezeichnet Räume oder Kammern, häufig innerhalb eines Heiligtumskomplexes. „Kammern“ bewahrt den institutionellen Zusammenhang, ohne das nicht ausdrücklich genannte Wort „Tempel“ einzufügen.
- source_word: פטירים
  choice: von anderen Aufgaben freigestellt
  rationale: Die seltene Form wird im Zusammenhang am plausibelsten als „frei“, „entbunden“ oder „freigestellt“ verstanden. Der Zusatz „von anderen Aufgaben“ macht die kontextuell gemeinte Abgrenzung verständlich, ohne die Art dieser Aufgaben näher festzulegen.
- source_word: יוֹמָם וָלַיְלָה
  choice: Tag und Nacht
  rationale: Die geläufige deutsche Wortverbindung bildet die hebräische Zeitangabe direkt ab und drückt die fortlaufende Zuständigkeit aus.
- source_word: עֲלֵיהֶם בַּמְּלָאכָה
  choice: waren sie mit der Arbeit beschäftigt
  rationale: Das wörtliche „auf ihnen“ bezeichnet hier eine ihnen obliegende Verantwortung. Die idiomatische deutsche Fassung bewahrt diesen Sinn; „Arbeit“ hält מְלָאכָה bewusst allgemein.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die genealogische Amtsbezeichnung wird verständlich wiedergegeben; die seltene Bezeichnung פטירים bleibt durch eine Fußnote als lexikalisch unsicher erkennbar. Der Tempel wird nicht ausdrücklich ergänzt, da er zwar aus dem Zusammenhang naheliegt, im Vers aber nicht genannt wird.
