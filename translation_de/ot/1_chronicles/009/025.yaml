base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/025.yaml
  text: And their brothers in their villages were to come in every seven days[a], from time to time[b], with these.
translation:
  language: de
  text: Ihre Brüder in ihren Dörfern sollten von Zeit zu Zeit jeweils für sieben Tage mit diesen[a] kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mit diesen«; gemeint sind wahrscheinlich die zuvor genannten Diensttuenden. »Jeweils für sieben Tage« kann im Zusammenhang einen siebentägigen Dienstturnus bezeichnen; möglich ist auch: »alle sieben Tage«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Ihre Brüder
  rationale: אֲחֵיהֶם bedeutet wörtlich »ihre Brüder« und kann hier zugleich die verwandten beziehungsweise mit ihnen verbundenen Leviten bezeichnen. Die direkte Wiedergabe bewahrt den sozialen und familiären Klang.
- source_word: בְּחַצְרֵיהֶם
  choice: in ihren Dörfern
  rationale: חָצֵר kann einen Hof, eine umfriedete Siedlung oder ein Dorf bezeichnen. Da hier die Wohnorte außerhalb des Tempelbereichs gemeint sind, passt »Dörfer« am besten.
- source_word: לָבוֹא
  choice: sollten … kommen
  rationale: Der Infinitiv mit ל bezeichnet im administrativen Zusammenhang den vorgesehenen beziehungsweise verpflichtenden Dienstantritt.
- source_word: לְשִׁבְעַת הַיָּמִים
  choice: alle sieben Tage
  rationale: Die Wendung bezeichnet wahrscheinlich den siebentägigen Turnus des Dienstwechsels. Da auch eine Dauer von sieben Tagen möglich ist, wird diese Alternative in einer Fußnote erhalten.
- source_word: מֵעֵת אֶל עֵת
  choice: von Zeit zu Zeit
  rationale: Die idiomatische Wendung beschreibt wiederkehrende Zeitpunkte oder periodische Anlässe, ohne den Rhythmus genauer festzulegen.
- source_word: עִם אֵלֶּה
  choice: zu ihnen
  rationale: Wörtlich steht »mit diesen«. Das Pronomen verweist auf die zuvor genannten Diensttuenden; »zu ihnen kommen« gibt den Bezug im Deutschen natürlich wieder.
theological_decisions: []
translation_notes:
