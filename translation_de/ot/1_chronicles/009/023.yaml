    rationale: Das Hebräische setzt keine ausdrückliche Ortsangabe „dort“ und verbindet die Dienstangabe nicht als zusätzlichen selbständigen Prädikatssatz. Eine integrierte Wiedergabe vermeidet diese Ergänzung.
