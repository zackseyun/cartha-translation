base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/023.yaml
  text: They and their sons were over the gates of the house of Yahweh[a], that is, the house of the tent, as guards.
translation:
  language: de
  text: Sie und ihre Söhne waren zum Wachdienst an den Toren des Hauses Jahwes, des Hauses des Zeltes, eingeteilt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „für Wachdienste“; möglicherweise auch: „als Wachen“ oder „für Wachposten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Sie
  rationale: Das anknüpfende וְ mit dem Pronomen nimmt das Subjekt wieder auf; im Deutschen ist „Sie“ ohne einleitendes „Und“ natürlicher.
- source_word: וּבְנֵיהֶם
  choice: und ihre Söhne
  rationale: בנים bezeichnet hier die männlichen Nachkommen innerhalb des erblichen Torhüterdienstes.
- source_word: עַל הַשְּׁעָרִים
  choice: waren für die Tore … zuständig
  rationale: עַל bezeichnet in diesem administrativen Zusammenhang Verantwortung und Aufsicht, nicht nur einen Standort.
- source_word: לְבֵית יְהוָה
  choice: des Hauses Jahwes
  rationale: Die Wendung ordnet die Tore dem Heiligtum Jahwes zu; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: לְבֵית הָאֹהֶל
  choice: für das Zelthaus
  rationale: Die kompakte Wiedergabe „Zelthaus“ bewahrt die ungewöhnliche Verbindung von Haus und Zelt und klingt im Deutschen verständlicher als „Haus des Zeltes“.
- source_word: לְמִשְׁמָרוֹת
  choice: versahen dort den Wachdienst
  rationale: Das Substantiv bezeichnet Wache beziehungsweise Bewachungsdienst; diese Wiedergabe ist idiomatisch und erhält den dienstlichen Sinn.
theological_decisions:
- issue: Verhältnis zwischen „Haus Jahwes“ und „Zelthaus“
  choice: Die zweite Bezeichnung wird mit „das heißt“ appositionell auf das Haus Jahwes bezogen, wobei beide Ausdrücke erhalten bleiben.
  alternative: Die Ausdrücke könnten als zwei verschiedene Orte verstanden oder „Zelthaus“ unmittelbar als „Stiftshütte“ gedeutet werden.
  rationale: Der Kontext verbindet wahrscheinlich den gegenwärtigen Tempeldienst mit dem früheren Zeltheiligtum. Die Übersetzung wahrt beide Bezeichnungen und damit die geschichtliche und theologische Spannung, ohne sie durch „Stiftshütte“ vollständig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zelthaus“ bewahrt bewusst die auffällige hebräische Formulierung; „für die Tore … zuständig“ gibt den Aufsichtscharakter von עַל natürlich wieder.
