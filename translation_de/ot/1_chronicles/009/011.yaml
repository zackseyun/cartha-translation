source:
  edition: WLC
  text: וַ/עֲזַרְיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖יד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/011.yaml
  text: and Azariah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub, chief officer of the house of God.
translation:
  language: de
  text: und Asarja, der Sohn Hilkijas, des Sohnes Meschullams, des Sohnes Zadoks, des Sohnes Merajots, des Sohnes Ahitubs, Vorsteher[a] des Hauses Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Leiter, Oberster oder Herrscher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: und Asarja
  rationale: Das vorangestellte ו führt die Aufzählung des vorhergehenden Verses fort; der Personenname folgt der im Deutschen üblichen biblischen Form.
- source_word: בֶן
  choice: Sohn
  rationale: Das wiederholte genealogische בֶן wird einheitlich mit „Sohn“ wiedergegeben. Eine mögliche Verkürzung der Abstammungslinie bleibt dabei wie im Hebräischen unausgesprochen.
- source_word: חִלְקִיָּה
  choice: Hilkija
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: מְשֻׁלָּם
  choice: Meschullam
  rationale: Im Deutschen gebräuchliche Transliteration des Personennamens.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: מְרָיוֹת
  choice: Merajot
  rationale: Deutsche Transliteration des Personennamens.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Im Deutschen gebräuchliche Transliteration des Personennamens.
- source_word: נְגִיד
  choice: Vorsteher
  rationale: Das Wort bezeichnet einen eingesetzten Leiter oder Verantwortlichen. „Vorsteher“ passt zum administrativen Zusammenhang des Heiligtums, ohne eine genauere Amtsbezeichnung vorzutäuschen.
- source_word: בֵּית הָאֱלֹהִים
  choice: Haus Gottes
  rationale: Die formnahe Wiedergabe bewahrt das hebräische Bild und ist im Deutschen als Bezeichnung des Heiligtums verständlich; „Tempel Gottes“ wäre kontextuell möglich, aber interpretierender.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים in der Bezeichnung des Heiligtums
  choice: Gott
  alternative: die Götter
  rationale: Im Zusammenhang mit Israels Heiligtum bezeichnet אֱלֹהִים eindeutig den Gott Israels; die Singularform ist daher sachlich geboten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die genealogische Reihung bleibt sichtbar, wird aber durch Kommas lesbar gegliedert. Der Fußnotenmarker steht unmittelbar bei „Vorsteher“, da die Alternative נְגִיד betrifft.
