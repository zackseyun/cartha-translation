  text: וּ/בִ/ירוּשָׁלִַ֨ם֙ יָשְׁב֔וּ מִן בְּנֵ֥י יְהוּדָ֖ה וּ/מִן בְּנֵ֣י בִנְיָמִ֑ן וּ/מִן בְּנֵ֥י אֶפְרַ֖יִם וּ/מְנַשֶּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/003.yaml
  text: And in Jerusalem some from the sons of Judah, and some from the sons of Benjamin, and some from the sons of Ephraim and Manasseh, lived there.
translation:
  language: de
  text: Und in Jerusalem wohnten einige von den Nachkommen Judas[a], einige von den Nachkommen Benjamins und einige von den Nachkommen Ephraims und Manasses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von den Söhnen Judas … von den Söhnen Benjamins … von den Söhnen Ephraims und Manasses“.'
    reason: Die Fußnote dokumentiert die wörtliche genealogische Ausdrucksweise בני, die im Haupttext natürlich mit „Nachkommen“ wiedergegeben wird.
lexical_decisions:
- source_word: וּ/בִ/ירוּשָׁלִַם
  choice: Und in Jerusalem
  rationale: Das vorangestellte „Und“ wahrt die Verknüpfung mit dem vorherigen Zusammenhang; „in Jerusalem“ gibt die Ortsangabe unmittelbar wieder.
- source_word: יָשְׁבוּ
  choice: wohnten
  rationale: ישב bezeichnet hier das Wohnen bzw. Ansässigsein. „Wohnten“ ist im modernen Deutschen natürlich und benötigt kein ergänztes „dort“.
- source_word: מִן
  choice: einige von
  rationale: Das wiederholte מִן bezeichnet Angehörige, die aus den genannten Gruppen stammen. „Einige von“ schafft im Deutschen ein klares Subjekt, ohne die gesamten Stämme einzuschließen.
- source_word: בְּנֵי יְהוּדָה / בְּנֵי בִנְיָמִן / בְּנֵי אֶפְרַיִם וּמְנַשֶּׁה
  choice: die Nachkommen Judas / Benjamins / Ephraims und Manasses
  rationale: „Nachkommen“ gibt die genealogisch-stammesbezogene Wendung בני in verständlichem modernem Deutsch wieder. Bei Manasse wirkt „Nachkommen“ entsprechend der hebräischen Koordination aus dem Ausdruck mit Ephraim fort.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Wiederholung des Hebräischen bleibt erhalten; „einige“ macht die durch מִן bezeichnete Teilmenge idiomatisch deutlich.
