    issue: Die Fußnote beschreibt die behauptete alternative Lesart fehlerhaft.
    rationale: Die Fußnote behauptet, »aus« könne statt »Bani« gelesen werden, während die Übersetzung zugleich nach Bani bereits die separate Zugehörigkeitsangabe »aus der Nachkommenschaft des Perez« enthält. Damit erzeugt sie eine doppelte beziehungsweise unklare Konstruktion und bildet den überlieferten genealogischen Wortlaut nicht zuverlässig ab.
  - severity: low
    issue: Die abschließende Zuordnungsphrase kann natürlicher formuliert werden.
    rationale: »gehörte zu den Nachkommen« macht im Deutschen die Funktion von מן־בני als Sippenzuordnung deutlicher als die bloße angehängte Präpositionalphrase.
