  text: עוּתַ֨י בֶּן עַמִּיה֤וּד בֶּן עָמְרִי֙ בֶּן אִמְרִ֣י בֶן בני/מן בְּנֵי פֶ֖רֶץ בֶּן יְהוּדָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/004.yaml
  text: Uthai son of Ammihud[a], son of Omri, son of Imri, son of Bani, from the sons of Perez son of Judah.
translation:
  language: de
  text: Utai, Sohn Ammihuds, Sohn Omris, Sohn Imris, Sohn Banis, gehörte zu den Nachkommen des Perez, des Sohnes Judas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוּתַי
  choice: Utai
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: בֶּן
  choice: Sohn
  rationale: In der Geschlechtsfolge ist »Sohn« die unmittelbarste Entsprechung; mögliche genealogische Verkürzungen werden dadurch nicht ausgeschlossen.
- source_word: עַמִּיהוּד
  choice: Ammihud
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibelschreibung transliteriert.
- source_word: עָמְרִי
  choice: Omri
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: אִמְרִי
  choice: Imri
  rationale: Der Personenname wird transliteriert.
- source_word: בני/מן
  choice: Bani
  rationale: Die Lesart als Personenname setzt die Abfolge der Namen fort; die textlich mögliche Lesart »aus/von« wird in der Fußnote bewahrt.
- source_word: בְּנֵי
  choice: Nachkommenschaft
  rationale: In der Sippenzuordnung bezeichnet der Ausdruck die Nachkommen beziehungsweise das Geschlecht des Perez; »Nachkommenschaft« ist im modernen Deutschen natürlich und eindeutig.
- source_word: פֶרֶץ
  choice: Perez
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Gebräuchliche deutsche Form des Personen- und Stammesnamens.
