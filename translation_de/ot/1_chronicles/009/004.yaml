  verdict: revise
  source_fidelity: 'Der masoretische Text führt Bani als Glied der Genealogie an und ordnet Utai anschließend den Nachkommen des Perez, des Sohnes Judas, zu. Der deutsche Haupttext gibt diese Abfolge grundsätzlich wieder. Die vorhandene Fußnote ist jedoch sachlich und logisch nicht stimmig: Sie setzt »aus« als Alternative zu »Bani« an, obwohl die Zugehörigkeitsangabe »aus/von den Nachkommen des Perez« im Haupttext bereits eigenständig folgt.'
  naturalness: Die Genitivreihe ist verständlich, aber die Schlusswendung wird mit einem finiten Verb und »zu den Nachkommen« im modernen Standarddeutsch klarer, ohne den genealogischen Charakter zu verlieren.
  terminology: Die Namensformen Utai, Ammihud, Omri, Imri, Bani, Perez und Juda sind vertretbar. »Nachkommen« ist für בני in dieser Sippenzuordnung angemessen. »Sohn« bewahrt die Form der hebräischen Genealogie.
  issues:
