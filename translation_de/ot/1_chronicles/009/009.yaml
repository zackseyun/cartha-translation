base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/009.yaml
  text: And their brothers[a], according to their generations, were nine hundred and fifty-six[b]. All these men were heads of fathers’ houses in their fathers’ households.
translation:
  language: de
  text: Ihre Brüder[a] zählten gemäß ihren Geschlechterfolgen 956. Alle diese Männer waren Oberhäupter von Vaterhäusern innerhalb ihrer Vaterhäuser.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre männlichen Verwandten« beziehungsweise »ihre Sippenangehörigen«.'
    reason: lexical_alternative
  - marker: b
    text: '„Vaterhäuser“ bezeichnet im genealogischen Sprachgebrauch Familien- und Sippenverbände väterlicher Abstammung. Wörtlich: „Häupter von Vätern für das Haus ihrer Väter“.'
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Ihre Brüder
  rationale: אָח bedeutet grundsätzlich »Bruder«, kann in einem genealogischen Zusammenhang jedoch auch weitere männliche Verwandte oder Sippenangehörige bezeichnen. Die direkte Verwandtschaftsbezeichnung bleibt im Haupttext erhalten; die mögliche weitere Bedeutung wird in einer Fußnote genannt.
- source_word: לְתֹלְדוֹתָם
  choice: nach ihren Abstammungslisten geordnet
  rationale: תּוֹלְדוֹת bezeichnet hier genealogische Abstammungsfolgen beziehungsweise deren Verzeichnung. Die Formulierung gibt den administrativ-genealogischen Zusammenhang der Chronik natürlich und verständlich wieder.
- source_word: תְּשַׁע מֵאוֹת וַחֲמִשִּׁים וְשִׁשָּׁה
  choice: '956'
  rationale: Die eindeutige Kardinalzahl wird in der modernen deutschen Schreibweise als Ziffer wiedergegeben.
- source_word: כָּל אֵלֶּה אֲנָשִׁים
  choice: Alle diese Männer
  rationale: אֲנָשִׁים bezeichnet hier die männlichen Personen, die als genealogische Oberhäupter erfasst werden.
- source_word: רָאשֵׁי אָבוֹת לְבֵית אֲבֹתֵיהֶם
  choice: Familienoberhäupter in ihren jeweiligen Sippen
  rationale: Die hebräischen Wendungen bezeichnen Leiter patrilinear gegliederter Familien- und Sippenverbände. Die gewählte Formulierung vermeidet die im heutigen Deutsch missverständliche wörtliche Wiedergabe »Häupter der Väterhäuser«, während die soziale Struktur in der Fußnote erläutert wird.
theological_decisions: []
