  register: Modernes, würdevolles Standarddeutsch. Der genealogische Verwaltungsstil der Chronik bleibt erkennbar, wird aber durch geläufige Begriffe wie »Abstammungslisten«, »Familienoberhäupter« und »Sippen« verständlich wiedergegeben.
