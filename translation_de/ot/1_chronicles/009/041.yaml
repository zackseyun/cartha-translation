  text: וּ/בְנֵ֖י מִיכָ֑ה פִּית֥וֹן וָ/מֶ֖לֶךְ וְ/תַחְרֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/041.yaml
  text: 'And the sons of Micah: Pithon, Melech, and Tahrea.'
translation:
  language: de
  text: 'Und die Söhne Michas: Pithon, Melech und Tachrea.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Das Präfix וְ verbindet die nächste genealogische Angabe mit dem vorherigen Zusammenhang; der Konstruktplural von בֵּן wird natürlich als »die Söhne« wiedergegeben.
- source_word: מִיכָה
  choice: Michas
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben; der Genitiv nach »Söhne« wird durch die Endung -s ausgedrückt.
- source_word: פִּיתוֹן
  choice: Piton
  rationale: Lautnahe Wiedergabe des hebräischen Personennamens in deutscher Schreibweise.
- source_word: וָמֶלֶךְ
  choice: Melech
  rationale: Der Personenname wird lautnah wiedergegeben. Das vorangestellte וְ wird gemäß natürlichem deutschen Listenstil nicht eigens vor dem mittleren Glied ausgedrückt.
- source_word: וְתַחְרֵעַ
  choice: und Tachrea
  rationale: Der Personenname wird lautnah wiedergegeben; das vorangestellte וְ erscheint als »und« vor dem letzten Glied der Aufzählung.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Standarddeutsch im genealogischen Stil. Der Doppelpunkt bildet den elliptischen hebräischen Nominalsatz natürlich ab; Eigennamen folgen gebräuchlichen deutschen Transliterationsmustern.
