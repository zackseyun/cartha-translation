source:
  edition: WLC
  text: כֻּלָּ֤/ם הַ/בְּרוּרִים֙ לְ/שֹׁעֲרִ֣ים בַּ/סִּפִּ֔ים מָאתַ֖יִם וּ/שְׁנֵ֣ים עָשָׂ֑ר הֵ֤מָּה בְ/חַצְרֵי/הֶם֙ הִתְיַחְשָׂ֔/ם הֵ֣מָּה יִסַּ֥ד דָּוִ֛יד וּ/שְׁמוּאֵ֥ל הָ/רֹאֶ֖ה בֶּ/אֱמוּנָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/022.yaml
  text: All these who were chosen as gatekeepers at the thresholds were two hundred and twelve[a]. They were enrolled by genealogy in their villages. David and Samuel the seer established them in their office of trust.
translation:
  language: de
  text: Alle, die als Torhüter an den Schwellen ausgewählt waren, zählten 212. In ihren Dörfern waren sie in die Geschlechtsregister eingetragen. David und Samuel, der Seher, setzten sie in ihr Vertrauensamt ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „David und Samuel, der Seher, setzten sie wegen ihrer Zuverlässigkeit ein“; wörtlich: „in ihrer Treue/Zuverlässigkeit“. Die Wendung kann auch einen ihnen anvertrauten, zuverlässig auszuübenden Dienst bezeichnen.'
    reason: Die Bedeutung von בֶּאֱמוּנָתָם ist hier nicht eindeutig. Die Anmerkung wahrt sowohl den Bezug auf persönliche Treue bzw. Zuverlässigkeit als auch die mögliche administrative Nuance, ohne für יִסַּד die nicht gedeckte Bedeutung „bestätigen“ einzuführen.
lexical_decisions:
- source_word: הַבְּרוּרִים
  choice: die … ausgewählt waren
  rationale: Das passive Partizip bezeichnet hier Personen, die für eine bestimmte Aufgabe ausgewählt wurden. „Ausgewählt“ gibt den Vorgang wieder, ohne die Art der Ernennung näher festzulegen.
- source_word: לְשֹׁעֲרִים
  choice: als Torhüter
  rationale: שֹׁעֵר bezeichnet jemanden, der einen Eingang oder ein Tor bewacht; „Torhüter“ ist im Zusammenhang des Tempeldienstes klar und idiomatisch.
- source_word: בַּסִּפִּים
  choice: an den Schwellen
  rationale: סַף bezeichnet grundsätzlich die Schwelle beziehungsweise den Eingangsbereich. Die konkrete Bildsprache des Hebräischen bleibt so erhalten.
- source_word: מָאתַיִם וּשְׁנֵים עָשָׂר
  choice: '212'
  rationale: Direkte Wiedergabe der Kardinalzahl in der im modernen Deutschen üblichen Ziffernschreibung.
- source_word: בְחַצְרֵיהֶם
  choice: in ihren Dörfern
  rationale: חָצֵר kann einen Hof oder eine Einfriedung bezeichnen, meint in Siedlungs- und Registerzusammenhängen jedoch häufig kleinere, unbefestigte Ortschaften.
- source_word: הִתְיַחְשָׂם
  choice: waren sie in die Geschlechtsregister eingetragen
  rationale: Das Hitpael von יחס bezeichnet die genealogische Erfassung beziehungsweise Eintragung nach Abstammung. „Geschlechtsregister“ ist präzise und im chronistischen Kontext verständlich.
- source_word: יִסַּד
  choice: hatten … eingesetzt
  rationale: יסד bedeutet grundlegend „gründen, fest begründen“. Im administrativen Zusammenhang bezeichnet es die feste Einrichtung ihrer Stellung; „eingesetzt“ ergibt im Deutschen mit dem Personenobjekt eine natürliche Formulierung.
- source_word: הָרֹאֶה
  choice: der Seher
  rationale: רֹאֶה ist die spezifische ältere Amtsbezeichnung „Seher“ und wird nicht zum allgemeineren „Prophet“ eingeebnet.
- source_word: בֶּאֱמוּנָתָם
  choice: in ihr Vertrauensamt
  rationale: אֱמוּנָה kann Treue, Zuverlässigkeit oder eine anvertraute Aufgabe bezeichnen. Im Zusammenhang der geordneten Tempeldienste passt die institutionelle Bedeutung eines verantwortungsvollen Vertrauensamtes am besten, ohne den Aspekt persönlicher Treue auszuschließen.
theological_decisions:
- issue: Bedeutung von בֶּאֱמוּנָתָם am Versende
  choice: David und Samuel setzten sie in ein Vertrauensamt ein.
  alternative: 'David und Samuel setzten sie wegen ihrer Zuverlässigkeit ein; oder: Sie bestätigten sie in ihrer Treue.'
  rationale: Die knappe hebräische Wendung ist syntaktisch und semantisch mehrdeutig. Der Kontext der geordneten, genealogisch erfassten Tempeldienste spricht für eine anvertraute amtliche Aufgabe. Die möglichen Bezüge auf persönliche Zuverlässigkeit oder Treue werden in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge folgt der hebräischen Informationsstruktur, wird aber idiomatisch geglättet. Das Plusquamperfekt macht deutlich, dass die Einrichtung durch David und Samuel gegenüber der beschriebenen Registrierung zeitlich vorausliegt. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Schlussaussage.
