base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/036.yaml
  text: And his firstborn son was Abdon[a], then Zur, Kish, Baal, Ner, and Nadab.
translation:
  language: de
  text: Und sein erstgeborener Sohn war Abdon. Weitere Söhne waren Zur, Kisch, Baal, Ner und Nadab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und sein Sohn, der Erstgeborene: Abdon und Zur und Kisch und Baal und Ner und Nadab.“ Die wiederholte hebräische Konjunktion wird im Deutschen als natürliche Aufzählung wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנוֹ הַבְּכוֹר
  choice: Und sein erstgeborener Sohn
  rationale: Die Verbindung gibt den hebräischen Anschluss mit וּ wieder, behält den Besitzbezug von בְנוֹ bei und übersetzt הַבְּכוֹר mit dem genealogisch präzisen „erstgeborener“.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Der Personenname wird nach gängiger deutscher biblischer Namensform wiedergegeben.
- source_word: וְצוּר
  choice: danach Zur
  rationale: Das wiederholte וְ eröffnet die Fortsetzung der Namensreihe. „Danach“ macht die Listenstruktur im Deutschen lesbar, ohne eine über die Aufzählung hinausgehende zeitliche Abfolge zu behaupten.
- source_word: וְקִישׁ
  choice: Kisch
  rationale: Der Personenname wird in der etablierten deutschen Form transliteriert; die Konjunktion geht idiomatisch in der Aufzählung auf.
- source_word: וּבַעַל
  choice: Baal
  rationale: Im genealogischen Zusammenhang ist בַעַל ein Personenname und wird unverändert transliteriert.
- source_word: וְנֵר
  choice: Ner
  rationale: Der Personenname wird transliteriert; die Konjunktion wird durch die deutsche Listenstruktur ausgedrückt.
- source_word: וְנָדָב
  choice: und Nadab
  rationale: Der Name wird transliteriert, und die abschließende Konjunktion erscheint im Deutschen vor dem letzten Glied der Reihe.
theological_decisions:
- issue: Wiedergabe von בַּעַל als Personenname in einer israelitischen Genealogie
  choice: Baal
  alternative: Eine beschönigende oder an anderen Namensformen orientierte Ersetzung
  rationale: Der hebräische Text nennt ausdrücklich בַּעַל. Die Wiedergabe als Personenname wahrt den Textbefund, ohne damit eine theologische Billigung des kanaanäischen Gottesnamens auszudrücken.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe genealogische Form bleibt erhalten; die wiederholten hebräischen Konjunktionen werden für einen natürlichen deutschen Listenrhythmus idiomatisch gebündelt.
