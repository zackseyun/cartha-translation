  text: וּ/מִן בְּנֵ֖י בִּנְיָמִ֑ן סַלּוּא֙ בֶּן מְשֻׁלָּ֔ם בֶּן הוֹדַוְיָ֖ה בֶּן הַ/סְּנֻאָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/007.yaml
  text: 'And from the sons of Benjamin: Sallu son of Meshullam[a], son of Hodaviah[c][b], son of Hassenuah.'
translation:
  language: de
  text: 'Und von den Söhnen Benjamins: Sallu, der Sohn Meschullams, des Sohnes Hodawjas, des Sohnes Hassenuas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das wiederholte »Sohn« kann in hebräischen Stammbäumen sowohl einen unmittelbaren Sohn als auch einen späteren Nachkommen bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִן
  choice: Und von
  rationale: Das Präfix וּ verbindet den Vers mit der vorausgehenden Aufzählung; מִן bezeichnet hier die Zugehörigkeit zu der nun genannten Gruppe.
- source_word: בְּנֵי בִּנְיָמִן
  choice: den Söhnen Benjamins
  rationale: Die formnahe Wiedergabe bewahrt den genealogischen Charakter; gemeint sind Angehörige beziehungsweise Nachkommen des Stammes Benjamin.
- source_word: סַלּוּא
  choice: Sallu
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition transliteriert.
- source_word: בֶּן
  choice: Sohn / Sohnes
  rationale: Das wiederholte בֶּן wird in der Abstammungsreihe formal wiedergegeben; dabei kann die hebräische genealogische Ausdrucksweise auch einen entfernteren Nachkommen bezeichnen.
- source_word: מְשֻׁלָּם
  choice: Meschullam
  rationale: Deutsche Transliteration des hebräischen Eigennamens.
- source_word: הוֹדַוְיָה
  choice: Hodawja
  rationale: Die Wiedergabe folgt der masoretischen Namensform des vorliegenden Verses in einer im Deutschen natürlichen Transliteration.
- source_word: הַסְּנֻאָה
  choice: Hassenua
  rationale: Die Form wird im genealogischen Zusammenhang als Eigenname verstanden; der Artikel ist mit dem anlautenden Konsonanten verbunden und wird in der Transliteration berücksichtigt.
