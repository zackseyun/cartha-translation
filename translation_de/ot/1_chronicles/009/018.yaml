  text: וְֽ/עַד הֵ֔נָּה בְּ/שַׁ֥עַר הַ/מֶּ֖לֶךְ מִזְרָ֑חָ/ה הֵ֚מָּה הַ/שֹּׁ֣עֲרִ֔ים לְ/מַחֲנ֖וֹת בְּנֵ֥י לֵוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/018.yaml
  text: Until then they were at the king’s gate on the east[b][a]; they were the gatekeepers for the camps of the sons of Levi.
translation:
  language: de
  text: Bis heute[a] sind sie am Königstor auf der Ostseite; sie sind die Torwächter für die Lager[b] der Söhne Levis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bis dahin“ oder „bis zu diesem Zeitpunkt“. Die hebräische Wendung bezeichnet eine zeitliche Fortdauer; der genaue Bezugspunkt ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: „Lager“ kann hier auch „Abteilungen“ oder „Gruppen“ bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד הֵנָּה
  choice: Bis zu diesem Zeitpunkt
  rationale: Die Wendung bezeichnet eine zeitliche Fortdauer bis zu einem im Zusammenhang vorausgesetzten Zeitpunkt. Die Übersetzung wahrt den rückblickenden Bezug, ohne ihn näher festzulegen.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: am Königstor
  rationale: Die Präposition ist hier lokal gebraucht. „Am Königstor“ ist natürliches Deutsch und gibt die Status-constructus-Verbindung knapp wieder.
- source_word: מִזְרָחָה
  choice: auf der Ostseite
  rationale: Die Richtungsform bezeichnet hier die östliche Lage beziehungsweise Ausrichtung des Tores. „Auf der Ostseite“ ist im Deutschen eindeutig und idiomatisch.
- source_word: הֵמָּה
  choice: sie waren
  rationale: Das selbstständige Pronomen hebt die zuvor genannte Gruppe hervor; in der deutschen Nominalkonstruktion wird die Kopula ergänzt.
- source_word: הַשֹּׁעֲרִים
  choice: die Torwächter
  rationale: Das Substantiv bezeichnet die mit der Bewachung der Tore Beauftragten. „Torwächter“ ist in diesem kultisch-administrativen Zusammenhang präzise und geläufig.
- source_word: לְמַחֲנוֹת
  choice: für die Lager
  rationale: מַחֲנֶה bedeutet grundlegend „Lager“, kann hier aber auch organisierte Gruppen oder Abteilungen bezeichnen. Die Hauptübersetzung bleibt quellennah; die kontextuelle Alternative wird in einer Fußnote bewahrt.
- source_word: בְּנֵי לֵוִי
  choice: der Söhne Levis
  rationale: Die Übersetzung erhält die genealogische Ausdrucksweise des Hebräischen, statt sie zusammenfassend als „Leviten“ wiederzugeben.
