base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/032.yaml
  text: And some of the sons of the Kohathites[a], from among their brothers, were in charge of the bread of the arrangement, to prepare it Sabbath by Sabbath.
translation:
  language: de
  text: Einige ihrer Brüder aus den Kehatitern waren für das Schichtbrot[a] zuständig, um es Sabbat für Sabbat zuzubereiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Brot der Anordnung“, also das geordnet aufgelegte Brot; traditionell auch „Schaubrot“ oder „Brot der Gegenwart“ genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בְּנֵי הַקְּהָתִי
  choice: Einige von den Söhnen der Kehatiter
  rationale: Das einleitende וּמִן bezeichnet eine Teilmenge. Die Formulierung bewahrt zugleich den hebräischen Sippenausdruck בְּנֵי und gibt die Zugehörigkeit zum kehatitischen Geschlecht verständlich wieder.
- source_word: מִן אֲחֵיהֶם
  choice: ihren Brüdern
  rationale: Die Apposition macht deutlich, dass diese Kehatiter zu den zuvor genannten levitischen Brüdern gehörten. „Brüder“ wahrt die konkrete männliche Form des Hebräischen; eine Wiedergabe als „Verwandte“ wäre stärker deutend.
- source_word: עַל
  choice: waren für … verantwortlich
  rationale: עַל bezeichnet hier eine zugewiesene Aufsicht oder Zuständigkeit. Die deutsche Wendung ist natürlich und trifft den administrativen Sinn.
- source_word: לֶחֶם הַמַּעֲרָכֶת
  choice: das Schichtbrot
  rationale: Der Ausdruck bezeichnet das geordnet aufgelegte Brot. „Schichtbrot“ ist die eingebürgerte deutsche Bezeichnung; die Fußnote erläutert den wörtlichen Sinn, damit die Bildhaftigkeit des Hebräischen sichtbar bleibt.
- source_word: לְהָכִין
  choice: mussten es … zubereiten
  rationale: Der Infinitiv bezeichnet die mit der Zuständigkeit verbundene Aufgabe. Das Pronomen „es“ nimmt eindeutig das Brot auf; „mussten“ bringt die dienstliche Verpflichtung im Deutschen natürlich zum Ausdruck.
- source_word: שַׁבַּת שַׁבָּת
  choice: Sabbat für Sabbat
  rationale: Die Wiederholung ist distributiv und bezeichnet jeden einzelnen Sabbat. „Sabbat für Sabbat“ bewahrt Form und Rhythmus des Hebräischen besser als „jeden Sabbat“.
