source:
  edition: WLC
  text: וְ/הַ/יּוֹשְׁבִים֙ הָ/רִ֣אשֹׁנִ֔ים אֲשֶׁ֥ר בַּ/אֲחֻזָּתָ֖/ם בְּ/עָרֵי/הֶ֑ם יִשְׂרָאֵל֙ הַ/כֹּ֣הֲנִ֔ים הַ/לְוִיִּ֖ם וְ/הַ/נְּתִינִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/002.yaml
  text: The first inhabitants who lived in their possessions in their cities were Israel[a], the priests, the Levites, and the temple servants.
translation:
  language: de
  text: Die ersten Bewohner, die auf ihrem Grundbesitz in ihren Städten wohnten, waren Israeliten, die Priester, die Leviten und die Tempeldiener[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Netinim«, die traditionelle Umschrift für eine dem Tempeldienst zugewiesene Personengruppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹשְׁבִים
  choice: die Bewohner
  rationale: Das substantivierte Partizip von ישׁב bezeichnet die dort wohnenden Menschen. »Bewohner« ist im Deutschen natürlich und dem sachlichen Listenstil angemessen; das einleitende וְ muss hier nicht eigens mit »und« wiedergegeben werden.
- source_word: הָרִאשֹׁנִים
  choice: die ersten
  rationale: Das Adjektiv bezeichnet die ersten beziehungsweise früheren Bewohner. Im Zusammenhang der Wiederbesiedlung ist »die ersten« die naheliegende, nicht überdeutende Wiedergabe.
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen leitet den beschreibenden Relativsatz ein und wird idiomatisch durch »die« wiedergegeben.
- source_word: בַּאֲחֻזָּתָם
  choice: auf ihrem Grundbesitz
  rationale: אֲחֻזָּה bezeichnet einen festen, häufig erblichen Landbesitz. »Auf ihrem Grundbesitz« bewahrt den räumlichen und rechtlichen Sinn besser als das im Deutschen missverständliche »in ihrem Besitz«.
- source_word: בְּעָרֵיהֶם
  choice: in ihren Städten
  rationale: עָרִים bezeichnet besiedelte Orte beziehungsweise Städte; »in ihren Städten« entspricht der üblichen Wiedergabe.
- source_word: יִשְׂרָאֵל
  choice: Israeliten
  rationale: Das Kollektiv »Israel« bezeichnet hier Menschen innerhalb einer Aufzählung. »Israeliten« macht diesen Personenbezug im Deutschen klar, ohne eine zusätzliche Gruppe oder theologische Unterscheidung einzuführen.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Dies ist die übliche und kontextuell eindeutige Wiedergabe von כֹּהֲנִים.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Dies ist die übliche Wiedergabe der levitischen Gruppe, die hier neben den Priestern genannt wird.
- source_word: וְהַנְּתִינִים
  choice: und die Tempeldiener
  rationale: נְתִינִים bezeichnet eine an den Tempeldienst gebundene Personengruppe. »Tempeldiener« vermittelt heutigen Lesern ihre Funktion; die traditionelle Umschrift wird in der Fußnote genannt.
theological_decisions:
- issue: Verhältnis von »Israeliten« zu Priestern und Leviten
  choice: Die hebräische Aufzählung wird ohne harmonisierende Erläuterung beibehalten.
  alternative: »übrige Israeliten« oder eine andere ausdrückliche Abgrenzung
  rationale: Der Text nennt zunächst יִשְׂרָאֵל und danach Priester, Leviten und Tempeldiener. Ob »Israel« hier als eigene Gruppe oder als übergeordnete Bezeichnung zu verstehen ist, wird nicht ausdrücklich aufgelöst; eine Ergänzung wie »übrige« würde den Text stärker festlegen.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. Die etwas listenartige Satzstruktur des Hebräischen bleibt erkennbar, wird aber durch eine natürliche deutsche Relativkonstruktion lesbar gemacht. Die Fußnotenmarke steht bei »Tempeldiener«, da sie den hebräischen Ausdruck נְתִינִים erläutert.
