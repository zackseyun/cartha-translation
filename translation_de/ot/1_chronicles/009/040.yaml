  text: וּ/בֶן יְהוֹנָתָ֖ן מְרִ֣יב בָּ֑עַל וּ/מְרִי בַ֖עַל הוֹלִ֥יד אֶת מִיכָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/040.yaml
  text: And the son of Jehonathan was Merib-baal[b][a], and Merib-baal fathered Micah.
translation:
  language: de
  text: Und der Sohn Jehonatans[b] war Merib-Baal, und Merib-Baal[a] zeugte Micha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen erscheint der Name des Vaters in diesem Vers in zwei leicht unterschiedlichen Formen: zunächst »Merib-Baal«, danach in der verkürzten Form »Meri-Baal«. Die Übersetzung vereinheitlicht den Namen zur besseren Verständlichkeit.'
    reason: textual_variant
  - marker: b
    text: In 1. Samuel 14,49 wird Sauls Sohn »Jonatan« genannt; hier steht im hebräischen Text der Chronik die Form »Jehonatan«.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: Und der Sohn
  rationale: בֶן bedeutet »Sohn«; das vorangestellte ו wird als »Und« wiedergegeben und wahrt die Verbindung zur vorausgehenden Genealogie.
- source_word: יְהוֹנָתָן
  choice: Jehonatan
  rationale: Der Personenname wird entsprechend der hier im Chroniktext bezeugten hebräischen Form transliteriert und nicht zum geläufigeren »Jonatan« vereinheitlicht.
- source_word: מְרִיב בָּעַל
  choice: Merib-Baal
  rationale: Der aus zwei Bestandteilen geschriebene Eigenname wird in einer im Deutschen gut lesbaren, mit Bindestrich verbundenen Form transliteriert.
- source_word: וּ/מְרִי בַעַל
  choice: und Merib-Baal
  rationale: Das ו wird als »und« wiedergegeben. Die verkürzte Schreibform מְרִי בַעַל bezeichnet dieselbe Person; im Haupttext wird der Name zur Klarheit vereinheitlicht, während die Abweichung in einer Fußnote dokumentiert wird.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet der Hifil von ילד das Zeugen beziehungsweise Vaterwerden. »zeugte« ist knapp, präzise und im Deutschen für genealogische Aussagen verständlich.
- source_word: אֶת מִיכָה
  choice: Micha
  rationale: אֶת ist der unübersetzte Akkusativmarker; מִיכָה wird in seiner geläufigen deutschen Namensform »Micha« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe genealogische Satzform und die koordinierende Struktur des Hebräischen bleiben erhalten. Eigennamen werden quellennah transliteriert; eine innerverse Schreibvariation wird transparent in der Fußnote ausgewiesen.
