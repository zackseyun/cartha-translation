  text: 'And from the Shilonites: Asaiah the firstborn and his sons[a].'
translation:
  language: de
  text: 'Und von den Schilonitern: Asaja, der Erstgeborene, und seine Söhne.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise auch: „den Schelonitern“, entsprechend einer anderen überlieferten Zuordnung dieses Sippennamens.'
