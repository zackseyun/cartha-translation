lexical_decisions:
- source_word: וּ/מִן
  choice: Und von
  rationale: Das vorangestellte ו verbindet diesen Eintrag mit der vorausgehenden Aufzählung; „Und von“ bewahrt diese additive Funktion.
- source_word: הַ/שִּׁילוֹנִי
  choice: den Schilonitern
  rationale: Obwohl die Form morphologisch singularisch ist, bezeichnet das Gentiliz hier im Zusammenhang kollektiv eine Sippe oder Gruppe. „Schiloniter“ gibt die vorliegende Konsonantenform direkt wieder.
- source_word: עֲשָׂיָה
  choice: Asaja
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibelnamentradition transkribiert.
- source_word: הַ/בְּכֹר
  choice: der Erstgeborene
  rationale: בכור bezeichnet ausdrücklich den erstgeborenen Sohn und nicht nur allgemein den Ältesten.
- source_word: וּ/בָנָיו
  choice: und seine Söhne
  rationale: בנים meint hier Söhne, nicht allgemein Kinder; die Konjunktion erhält die knappe Listenstruktur.
