  text: וּ/מִן בְּנֵי֙ הַ/כֹּ֣הֲנִ֔ים רֹקְחֵ֥י הַ/מִּרְקַ֖חַת לַ/בְּשָׂמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/030.yaml
  text: And some of the sons of the priests were compounders of the ointment of spices[a].
translation:
  language: de
  text: Einige der Söhne der Priester stellten die Salbenmischung aus aromatischen Stoffen her[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: stellten die Salbenmischung für aromatische Stoffe her.'
    reason: Das Verhältnis der mit ל eingeleiteten aromatischen Stoffe zur Mischung kann als Zusammensetzung oder als Zweck beziehungsweise Zuordnung verstanden werden.
lexical_decisions:
- source_word: וּמִן
  choice: Einige von
  rationale: Die Verbindung aus Konjunktion und Präposition hat hier partitive Bedeutung. „Einige von“ gibt sie im Deutschen natürlich wieder; das anschließende „und“ des Hebräischen muss in diesem knappen Listensatz nicht eigens ausgedrückt werden.
- source_word: בְּנֵי הַכֹּהֲנִים
  choice: den Söhnen der Priester
  rationale: Die formale Verwandtschaftsbezeichnung bewahrt den genealogischen Ton der Chronik. Gemeint sind Angehörige priesterlicher Familien.
- source_word: רֹקְחֵי
  choice: stellten … her
  rationale: Das Partizip bezeichnet Personen, die eine zusammengesetzte aromatische Zubereitung fachkundig mischen beziehungsweise herstellen. „stellten … her“ ist gegenwärtiges, klares Deutsch und passt zur Aufzählung von Zuständigkeiten.
- source_word: הַמִּרְקַחַת
  choice: die Salbenmischung
  rationale: Das Substantiv bezeichnet eine durch Mischen hergestellte Zubereitung, besonders im Bereich von Salbe oder Duftwerk. „Salbenmischung“ hält beide Bedeutungsanteile zusammen, ohne eine moderne Darreichungsform vorauszusetzen.
- source_word: לַבְּשָׂמִים
  choice: aus Duftstoffen
  rationale: בְּשָׂמִים sind wohlriechende aromatische Stoffe. Im Zusammenhang lässt sich ל als Angabe der Beziehung beziehungsweise Zusammensetzung verstehen; idiomatisches Deutsch gibt dies mit „aus Duftstoffen“ wieder. Die formalere Zweckbeziehung wird in der Fußnote erhalten.
