  text: וּ/מֵ/הֶ֗ם מְמֻנִּים֙ עַל הַ/כֵּלִ֔ים וְ/עַ֖ל כָּל כְּלֵ֣י הַ/קֹּ֑דֶשׁ וְ/עַל הַ/סֹּ֨לֶת֙ וְ/הַ/יַּ֣יִן וְ/הַ/שֶּׁ֔מֶן וְ/הַ/לְּבוֹנָ֖ה וְ/הַ/בְּשָׂמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/029.yaml
  text: And some of them were appointed over the vessels[a], over all the holy vessels, and over the fine flour, the wine, the oil, the frankincense, and the spices.
translation:
  language: de
  text: Einige von ihnen waren für die Geräte[a], für alle heiligen Geräte sowie für das Feinmehl, den Wein, das Öl, den Weihrauch und die Gewürze verantwortlich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für sämtliche Geräte des Heiligtums“; so lässt sich die Verbindung mit den folgenden Worten auffassen.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: וּמֵהֶם
  choice: Einige von ihnen
  rationale: Die Präposition מִן mit Suffix hat partitiven Sinn; die Formulierung bezeichnet einen Teil der zuvor genannten Gruppe.
- source_word: מְמֻנִּים עַל
  choice: waren für … verantwortlich
  rationale: Das passive Partizip bezeichnet eine übertragene Zuständigkeit. Die natürliche deutsche Wendung gibt diesen Sinn klar wieder, ohne ein bestimmtes Amt zu unterstellen.
- source_word: הַכֵּלִים
  choice: die Geräte
  rationale: כְּלִי ist ein weiter Begriff für Geräte, Gegenstände oder Utensilien. Im Heiligtumskontext ist „Geräte“ verständlich und hinreichend umfassend.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: alle heiligen Geräte
  rationale: Die Konstruktverbindung kann den geheiligten Charakter der Geräte oder ihre Zugehörigkeit zum Heiligtum ausdrücken. Die Hauptübersetzung bleibt nah an der formalen Struktur.
- source_word: הַסֹּלֶת
  choice: das Feinmehl
  rationale: סֹלֶת bezeichnet besonders feines, für Opfer verwendetes Mehl; „Feinmehl“ bewahrt diese kultische Spezifik.
- source_word: הַיַּיִן
  choice: den Wein
  rationale: Direkte und kontextgerechte Wiedergabe.
- source_word: הַשֶּׁמֶן
  choice: das Öl
  rationale: Der hebräische Text nennt Öl, ohne es hier ausdrücklich als Olivenöl zu bestimmen.
- source_word: הַלְּבוֹנָה
  choice: den Weihrauch
  rationale: לְבוֹנָה bezeichnet Weihrauchharz und nicht Räucherwerk im Allgemeinen; „Weihrauch“ ist die übliche präzise deutsche Bezeichnung.
- source_word: הַבְּשָׂמִים
  choice: die Gewürze
  rationale: Der Ausdruck bezeichnet wohlriechende beziehungsweise aromatische Stoffe. „Gewürze“ ist im kultischen Zusammenhang eine natürliche breite Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Verantwortlich“ drückt die zugewiesene Zuständigkeit idiomatischer aus als eine wörtliche Wiedergabe mit „über“. Die mögliche syntaktische Verbindung von הַכֵּלִים mit כָּל כְּלֵי הַקֹּדֶשׁ bleibt durch eine Fußnote sichtbar.
