base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/027.yaml
  text: They spent the night around the house of God[a], because the duty of guarding it was upon them, and they were in charge of opening it morning by morning.
translation:
  language: de
  text: Sie verbrachten die Nacht rings um das Haus Gottes, denn ihnen oblag der Wachdienst, und sie waren dafür zuständig, es Morgen für Morgen aufzuschließen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie waren für den Schlüssel zuständig.« Wörtlich: »Sie waren über dem Schlüssel/Öffnen«; das Hebräische kann entweder die Verwahrung eines Schlüssels oder die Verantwortung für das Öffnen des Hauses Gottes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְבִיבוֹת
  choice: rings um
  rationale: Gibt den räumlichen Sinn der Umgebung natürlich und prägnant wieder.
- source_word: בֵּית הָאֱלֹהִים
  choice: das Haus Gottes
  rationale: Bewahrt die hebräische Ausdrucksweise, obwohl sachlich der Tempelkomplex gemeint ist.
- source_word: יָלִינוּ
  choice: verbrachten die Nacht
  rationale: Bezeichnet idiomatisch das Übernachten beziehungsweise nächtliche Verweilen, ohne Schlaf ausdrücklich vorauszusetzen.
- source_word: עֲלֵיהֶם מִשְׁמֶרֶת
  choice: sie waren mit dem Wachdienst betraut
  rationale: Bringt die ihnen auferlegte Verantwortung für die Bewachung in natürlichem Deutsch zum Ausdruck.
- source_word: וְהֵם עַל הַמַּפְתֵּחַ
  choice: sie waren für den Schlüssel zuständig
  rationale: Bleibt nahe am hebräischen Wortlaut und wahrt die mögliche Bedeutung der Schlüsselverwahrung ebenso wie die Verantwortung für das Aufschließen.
- source_word: וְלַבֹּקֶר לַבֹּקֶר
  choice: Morgen für Morgen
  rationale: Bewahrt die Wiederholung und den regelmäßigen, fortlaufenden Charakter der Wendung.
