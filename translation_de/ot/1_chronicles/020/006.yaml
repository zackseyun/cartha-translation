base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/006.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six each, twenty-four in all; he also was born to Rapha.
translation:
  language: de
  text: Und wieder kam es in Gat zum Krieg. Dort war ein Mann von gewaltiger Größe, der an jeder Hand sechs Finger und an jedem Fuß sechs Zehen hatte, insgesamt vierundzwanzig. Auch er stammte von Rafa ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Auch er wurde dem Rafa geboren.“ „Rafa“ kann einen Ahnherrn, eine Gruppenbezeichnung oder „den Riesen“ meinen; möglich ist auch: „Auch er gehörte zu den Refaitern.“'
    reason: Die hebräische Wendung לְהָרָפָא ist in ihrer genauen Referenz umstritten. Die Anmerkung bewahrt diese Mehrdeutigkeit, während der Haupttext die Abstammungsrelation idiomatisch ausdrückt.
lexical_decisions:
- source_word: עוֹד
  choice: wieder
  rationale: Im erzählenden Zusammenhang bezeichnet das Wort die Wiederholung des Kriegsgeschehens.
- source_word: מִלְחָמָה
  choice: Krieg
  rationale: Das Substantiv bezeichnet allgemein Krieg beziehungsweise bewaffneten Kampf; „Krieg“ entspricht der zusammenfassenden Erzählweise.
- source_word: בְּגַת
  choice: bei Gat
  rationale: Die Präposition kann den Ort des Geschehens bezeichnen; „bei Gat“ ist für einen Kriegsschauplatz natürliches Deutsch.
- source_word: אִישׁ מִדָּה
  choice: ein Mann von gewaltiger Größe
  rationale: Wörtlich handelt es sich um einen „Mann von Maß/Statur“; im Zusammenhang ist seine außergewöhnliche Körpergröße gemeint.
- source_word: אֶצְבְּעֹתָיו
  choice: Finger beziehungsweise Zehen
  rationale: Das Wort bezeichnet wörtlich die Finger, schließt in dieser Beschreibung aber die entsprechenden Glieder an Händen und Füßen ein; der Paralleltext in 2. Samuel 21,20 macht dies ausdrücklich.
- source_word: שֵׁשׁ וָשֵׁשׁ
  choice: jeweils sechs
  rationale: 'Die verdoppelte Zahl hat hier verteilenden Sinn: sechs an jeder Hand beziehungsweise jedem Fuß.'
- source_word: עֶשְׂרִים וְאַרְבַּע
  choice: insgesamt vierundzwanzig
  rationale: „Insgesamt“ verdeutlicht, dass die Zahl die zuvor genannten Finger und Zehen zusammenfasst.
- source_word: וְגַם הוּא
  choice: Auch er
  rationale: Die Formulierung ordnet diesen Mann wie die anderen außergewöhnlichen Krieger im Kontext derselben Herkunft zu.
- source_word: נוֹלַד לְהָרָפָא
  choice: wurde dem Rafa geboren
  rationale: Die ungewöhnliche deutsche Formulierung bildet die wörtliche Aussage „wurde dem Rafa geboren“ nach und bewahrt die Unklarheit, ob Rafa ein Ahnherr, eine Sippe oder eine Bezeichnung für einen Riesen ist.
theological_decisions:
- issue: Identität von הָרָפָא
  choice: Rafa als mehrdeutige Bezeichnung in Umschrift
  alternative: „der Riese“, „von den Refaitern“ oder „von Rafa abstammend“
  rationale: Der hebräische Ausdruck steht im Singular mit Artikel, lässt aber offen, ob ein Ahnherr, eine Sippe oder eine Gruppe von Riesen gemeint ist. Die Umschrift vermeidet eine unbegründete Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Hauptsätze halten den erzählenden Stil klar. Die absichtlich fremdartige Schlusswendung bewahrt mit Hilfe der Fußnote die Mehrdeutigkeit des Hebräischen.
