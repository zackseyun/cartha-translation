  terminology: „Gat“ und die Umschrift „Rafa“ sind angemessen. „Refaiter“ ist als Gruppenbezeichnung vorzuziehen. Die Fußnote soll den hebräischen Artikel bei „dem Rafa“ berücksichtigen und keine unnötig holprige deutsche Alternative wie „dem Riesen geboren“ präsentieren.
