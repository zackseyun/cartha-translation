base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/005.yaml
  text: And there was war with the Philistines again[a], and Elhanan son of Jair struck down Lahmi, the brother of Goliath the Gittite, whose spear shaft was like a weaver’s beam.
translation:
  language: de
  text: Und wieder kam es zum Krieg mit den Philistern.[a] Elhanan, der Sohn Jairs, erschlug Lachmi, den Bruder des Gatiters Goliat. Der Schaft seines Speeres war wie ein Weberbaum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Parallelstelle in 2. Samuel 21,19 hat einen schwierigen hebräischen Wortlaut und wird häufig im Zusammenhang mit diesem Vers erörtert. In der Chronik heißt es ausdrücklich, dass Elhanan Lachmi, den Bruder Goliats, erschlug.
    reason: textual_variant
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: Und wieder kam es zum Krieg
  rationale: עוֹד führt im Zusammenhang eine weitere Kriegsepisode ein; die deutsche Wendung ist natürlich und bewahrt diesen Fortgang.
- source_word: אֶת פְּלִשְׁתִּים
  choice: mit den Philistern
  rationale: Bei מִלְחָמָה bezeichnet אֶת die gegnerische Partei; „Krieg mit den Philistern“ entspricht natürlichem Deutsch.
- source_word: וַיַּךְ
  choice: erschlug
  rationale: נכה bezeichnet hier ein tödliches Niederschlagen im Kampf. „Erschlug“ gibt sowohl Handlung als auch Ergebnis knapp wieder.
- source_word: אֶלְחָנָן בֶּן יעור
  choice: Elhanan, der Sohn Jaïrs
  rationale: Die Namensform folgt der überlieferten Identifizierung; die Apposition ist im Deutschen klar und würdig.
- source_word: אֶת לַחְמִי
  choice: Lachmi
  rationale: לַחְמִי wird gemäß der masoretischen Punktierung und dem Satzbau der Chronik als Eigenname verstanden.
- source_word: אֲחִי גָּלְיָת הַגִּתִּי
  choice: den Bruder des Gatiters Goliat
  rationale: Die ausdrückliche Verwandtschaftsangabe bleibt erhalten; הַגִּתִּי wird als Herkunftsbezeichnung zu Goliat gestellt.
- source_word: וְעֵץ חֲנִיתוֹ
  choice: Der Schaft seines Speeres
  rationale: Wörtlich steht das „Holz“ seines Speeres; gemeint ist idiomatisch dessen hölzerner Schaft.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: war wie ein Weberbaum
  rationale: „Weberbaum“ ist die präzise deutsche Bezeichnung für den schweren Balken eines Webstuhls und erhält das Bild von der außergewöhnlichen Größe der Waffe.
theological_decisions:
- issue: Verhältnis zur schwierigen Parallelstelle in 2. Samuel 21,19
  choice: 'Der ausdrückliche Wortlaut der Chronik wird wiedergegeben: Elhanan erschlug Lachmi, den Bruder Goliats.'
  alternative: Die Chronik aufgrund der Parallelstelle so zu deuten oder umzuformen, als habe Elhanan Goliat selbst erschlagen oder als sei „Lachmi“ Bestandteil einer Herkunftsangabe.
  rationale: Der vorliegende hebräische Text nennt Lachmi eindeutig als Goliats Bruder. Die textliche Schwierigkeit der Parallelstelle darf nicht stillschweigend in diesen Vers eingetragen werden, wird aber in einer Fußnote angezeigt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Erschlug“ und „Weberbaum“ bewahren die konkrete Bildsprache, ohne altertümliche Satzformen zu verwenden.
