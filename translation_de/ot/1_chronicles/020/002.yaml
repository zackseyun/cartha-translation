  terminology: „Krone“, „Talent Gold“, „kostbarer Stein“ und „Beute“ sind treffende, registergerechte Entsprechungen. Die Lesart „ihres Königs“ ist im Haupttext syntaktisch naheliegend; die plausible Alternative als Gottesname wird korrekt und neutral in Fußnote a dokumentiert. Fußnote b erläutert die Gewichtseinheit zurückhaltend und ohne Scheingenauigkeit.
