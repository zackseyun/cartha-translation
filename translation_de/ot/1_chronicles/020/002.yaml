source:
  edition: WLC
  text: וַ/יִּקַּ֣ח דָּוִ֣יד אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וַֽ/יִּמְצָאָ֣/הּ מִשְׁקַ֣ל כִּכַּר זָהָ֗ב וּ/בָ/הּ֙ אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑יד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/002.yaml
  text: And David took the crown of their king from his head and found that it weighed a talent of gold, and in it was a precious stone; and it was placed on David’s head. And he carried off very much plunder from the city.
translation:
  language: de
  text: Und David nahm die Krone ihres Königs[a] von dessen Kopf. Er stellte fest, dass sie ein Talent[b] Gold wog und dass sich ein kostbarer Stein darin befand. Sie war auf Davids Kopf. Aus der Stadt führte er sehr viel Beute fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Krone Milkoms“ (auch „Malkams“), wenn מַלְכָּם als Name des ammonitischen Gottes und nicht als „ihres Königs“ verstanden wird.'
    reason: alternative_reading
  - marker: b
    text: Ein Talent war eine große antike Gewichtseinheit. Es wird häufig auf ungefähr 34 Kilogramm geschätzt; der genaue Wert war jedoch nicht überall gleich.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: Krone
  rationale: Die geläufige und kontextuell passende Bezeichnung für den königlichen Kopfschmuck.
- source_word: מַלְכָּם
  choice: ihres Königs
  rationale: Die Form lässt sich am natürlichsten als מֶלֶךְ mit Suffix der 3. Person Plural verstehen; die mögliche Lesart als Göttername wird in einer Fußnote bewahrt.
- source_word: מֵעַל רֹאשׁוֹ
  choice: von dessen Kopf
  rationale: Gibt die konkrete räumliche Aussage wieder und macht den Rückbezug auf den König im Deutschen eindeutig.
- source_word: וַיִּמְצָאָהּ מִשְׁקַל
  choice: Er stellte fest, dass sie … wog
  rationale: Natürliches modernes Deutsch für das Feststellen des Gewichts, ohne den Inhalt zu erweitern.
- source_word: כִּכַּר זָהָב
  choice: ein Talent Gold
  rationale: Bewahrt die antike Gewichtseinheit, statt sie mit einer unsicheren modernen Umrechnung im Haupttext zu ersetzen.
- source_word: אֶבֶן יְקָרָה
  choice: ein kostbarer Stein
  rationale: Entspricht der unbestimmten singularischen Formulierung, ohne die Art des Edelsteins zu spezifizieren.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִיד
  choice: Sie war auf Davids Kopf
  rationale: Folgt der knappen Zustandsaussage des Hebräischen und vermeidet es, eine nicht ausdrücklich genannte passive Handlung einzuführen.
- source_word: שְׁלַל הָעִיר
  choice: Beute aus der Stadt
  rationale: „Beute“ ist im militärischen Zusammenhang die klare und gegenwärtige Entsprechung.
- source_word: הוֹצִיא הַרְבֵּה מְאֹד
  choice: führte er sehr viel … fort
  rationale: Gibt sowohl das Wegschaffen der Kriegsbeute als auch die starke Mengenangabe idiomatisch wieder.
theological_decisions:
- issue: Bezeichnet מַלְכָּם den König der Ammoniter oder den Gott Milkom/Malkam?
  choice: ihres Königs
  alternative: Milkom bzw. Malkam
  rationale: Die Analyse als „ihr König“ passt unmittelbar zum anschließenden singularischen „dessen Kopf“. Da die Konsonanten zugleich als Name der ammonitischen Gottheit verstanden werden können, bleibt diese echte Mehrdeutigkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den hebräischen Satzgehalt. Die ungewöhnliche Aussage, die schwere Krone sei auf Davids Kopf gewesen, bleibt bewusst unverändert stehen; eine nicht ausdrücklich genannte Handlung wie „wurde aufgesetzt“ wird nicht ergänzt.
