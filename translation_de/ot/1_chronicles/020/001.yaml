  text: וַ/יְהִ֡י לְ/עֵת֩ תְּשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מְּלָכִ֗ים וַ/יִּנְהַ֣ג יוֹאָב֩ אֶת חֵ֨יל הַ/צָּבָ֜א וַ/יַּשְׁחֵ֣ת אֶת אֶ֣רֶץ בְּנֵֽי עַמּ֗וֹן וַ/יָּבֹא֙ וַ/יָּ֣צַר אֶת רַבָּ֔ה וְ/דָוִ֖יד יֹשֵׁ֣ב בִּ/ירֽוּשָׁלִָ֑ם וַ/יַּ֥ךְ יוֹאָ֛ב אֶת רַבָּ֖ה וַ/יֶּֽהֶרְסֶֽ/הָ׀־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/001.yaml
  text: And it happened at the time of the turning of the year[a], at the time when kings go out, that Joab led out the army and devastated the land of the Ammonites, and he came and besieged Rabbah. But David stayed in Jerusalem. And Joab struck Rabbah and tore it down.
translation:
  language: de
  text: Als sich das Jahr wendete,[a] zur Zeit, in der die Könige ausziehen, führte Joab das Heer ins Feld. Er verwüstete das Land der Ammoniter, zog vor Rabba und belagerte die Stadt. David aber blieb in Jerusalem. Joab griff Rabba an und riss die Stadt nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder interpretierend: »Im Frühling, zu der Zeit, in der die Könige in den Krieg ziehen.« Wörtlicher heißt es im Hebräischen: »Bei der Wende des Jahres, zu der Zeit, in der die Könige ausziehen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשׁוּבַת הַשָּׁנָה
  choice: als sich das Jahr wendete
  rationale: Die Wendung bewahrt das hebräische Bild von der Wende beziehungsweise Wiederkehr des Jahres. Die jahreszeitliche Deutung »im Frühling« wird nicht in den Haupttext eingetragen.
- source_word: לְעֵת צֵאת הַמְּלָכִים
  choice: zu der Zeit, in der die Könige ausziehen
  rationale: Die Übersetzung lässt wie das Hebräische das Ziel des Ausziehens unausgesprochen; der militärische Zusammenhang ist durch den Folgesatz deutlich.
- source_word: וַיִּנְהַג ... אֶת חֵיל הַצָּבָא
  choice: führte Joab das Heer ins Feld
  rationale: נָהַג bezeichnet hier das Führen beziehungsweise Voranführen der Streitmacht. »Ins Feld« gibt den militärischen Aufbruch natürlich wieder, ohne eine konkrete Schlacht hinzuzufügen.
- source_word: וַיַּשְׁחֵת אֶת אֶרֶץ בְּנֵי עַמּוֹן
  choice: Er verwüstete das Land der Ammoniter
  rationale: שׁחת bezeichnet das Verderben oder Verwüsten; im Feldzugskontext ist »verwüstete« präzise. »Ammoniter« ist die geläufige deutsche Volksbezeichnung für »Söhne Ammons«.
- source_word: וַיָּצַר אֶת רַבָּה
  choice: zog vor Rabba und belagerte die Stadt
  rationale: צוּר bezeichnet das Einschließen beziehungsweise Belagern einer Stadt. Die Wiederaufnahme durch »die Stadt« macht den deutschen Satz flüssig, ohne zusätzliche Sachinformation einzuführen.
- source_word: וְדָוִיד יֹשֵׁב בִּירוּשָׁלִָם
  choice: David aber blieb in Jerusalem
  rationale: Das Partizip beschreibt den andauernden Zustand Davids während Joabs Feldzug. »Aber« bringt den im Zusammenhang liegenden Kontrast natürlich zum Ausdruck.
- source_word: וַיַּךְ יוֹאָב אֶת רַבָּה
  choice: Joab nahm Rabba ein
  rationale: נכה kann im militärischen Zusammenhang schlagen, angreifen oder besiegen bedeuten. Da anschließend der Abriss der Stadt berichtet wird, gibt »nahm ... ein« den erreichten militärischen Erfolg im Deutschen klar und idiomatisch wieder.
- source_word: וַיֶּהֶרְסֶהָ
  choice: riss die Stadt nieder
  rationale: הרס bedeutet niederreißen oder abbrechen. Die Form enthält ein feminines Objektssuffix, das auf Rabba zurückweist; »die Stadt« macht diesen Bezug im Deutschen eindeutig.
- source_word: רַבָּה
  choice: Rabba
  rationale: Der Ortsname wird in seiner etablierten deutschen Form transliteriert.
