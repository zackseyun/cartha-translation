review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt Demonstrativpronomen, Geburts-/Abstammungsaussage, Ortsangabe, das Bild des Fallens und die doppelte ביד-Agentivformel grundsätzlich wieder. Das hebräische לְהָרָפָא enthält jedoch einen bestimmten Artikel; die bisherige Fassung „Rafa“ lässt diesen Bezug unmarkiert und die Wortstellung „Rafa in Gat geboren“ ist im modernen Deutschen unnötig schwer verständlich.
  naturalness: „Diese wurden Rafa in Gat geboren“ ist zwar an einem biblisch-genealogischen Sprachgebrauch orientiert, klingt ohne Dativartikel aber missverständlich und unnatürlich. „Diese wurden dem Rafa in Gat geboren“ erhält die enge Formulierung und ist als gehobene, aber verständliche genealogische Aussage lesbar. „Durch die Hand“ ist hier als bewusst bildhafte, würdevolle Wiedergabe akzeptabel.
  terminology: „Rafa“ wahrt die umstrittene Singularbezeichnung, ohne sie zu „Riese“ oder „Refaïter“ aufzulösen. Die Fußnote soll den möglichen Zusammenhang mit den Refaïtern vorsichtig benennen, nicht aber Rafa mit ihnen gleichsetzen. „Diener“ ist für עֲבָדָיו vertretbar, auch wenn im Kontext Kämpfer im Dienst Davids gemeint sind.
  issues:
  - severity: medium
    issue: Die Fassung „Diese wurden Rafa in Gat geboren“ markiert die hebräische Bestimmtheit von לְהָרָפָא nicht und ist syntaktisch missverständlich.
    rationale: Der bestimmte Artikel des Hebräischen kann im Deutschen mit „dem Rafa“ wiedergegeben werden. Der Dativ macht zugleich die genealogische Relation von „jemandem geboren werden“ deutlich.
  - severity: low
    issue: Der Fußnotenanker steht nach „Gat“, obwohl die Anmerkung hauptsächlich „Rafa“ erläutert.
    rationale: Der Anker sollte unmittelbar an der umstrittenen Bezeichnung stehen; die Ortsangabe ist nicht selbst Gegenstand der Variantenfrage.
  - severity: low
    issue: Die Fußnote formuliert den Bezug zu den Refaïtern etwas zu direkt als Verweis auf eine Abstammungslinie.
    rationale: Der Zusammenhang ist plausibel, aber nicht sicher. „Möglicherweise mit ... zusammenhängen“ bewahrt die Auslegungsunsicherheit besser.
  revised_text: Diese wurden dem Rafa[a] in Gat geboren und fielen durch die Hand Davids und durch die Hand seiner Diener.
