source:
  edition: WLC
  text: אֵ֛ל נוּלְּד֥וּ לְ/הָ/רָפָ֖א בְּ/גַ֑ת וַ/יִּפְּל֥וּ בְ/יַד דָּוִ֖יד וּ/בְ/יַד עֲבָדָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/008.yaml
  text: These were born to Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: de
  text: Diese wurden dem Rafa[a] in Gat geboren und fielen durch die Hand Davids und durch die Hand seiner Diener.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: Diese stammten in Gat von Rafa ab. „Rafa“ kann einen Vorfahren oder eine Sippe bezeichnen und hängt möglicherweise mit den Refaïtern zusammen, einer als riesenhaft geltenden Abstammungslinie in Gat.'
    reason: Die Wendung „dem Rafa geboren werden“ bezeichnet wahrscheinlich Abstammung; die genaue Identität von Rafa und sein möglicher Zusammenhang mit den Refaïtern bleiben unsicher.
lexical_decisions:
- source_word: אֵל
  choice: Diese
  rationale: Das Demonstrativpronomen verweist auf die zuvor genannten Kämpfer; „Diese“ gibt den Rückverweis ohne erklärenden Zusatz wieder.
- source_word: נוּלְּדוּ
  choice: wurden … geboren
  rationale: Der Nifal von ילד bezeichnet gewöhnlich das Geborenwerden. Die wörtliche Formulierung lässt hier zugleich die Bedeutung genealogischer Abstammung anklingen.
- source_word: לְהָרָפָא
  choice: Rafa
  rationale: Die Form kann einen namensgebenden Vorfahren oder eine Sippenbezeichnung meinen. Die Wiedergabe als „Rafa“ vermeidet die interpretierende Festlegung auf „Riese“ oder „Refaïter“; die Unsicherheit wird in der Fußnote erläutert.
- source_word: בְּגַת
  choice: in Gat
  rationale: Die Präposition ב wird hier regulär lokal gebraucht.
- source_word: וַיִּפְּלוּ
  choice: und fielen
  rationale: „Fielen“ bewahrt das hebräische Bild des Fallens und bezeichnet im kriegerischen Zusammenhang ihren Tod beziehungsweise ihre Niederlage.
- source_word: בְיַד
  choice: durch die Hand
  rationale: Die Wendung bezeichnet die handelnde Person. „Durch die Hand“ bewahrt das hebräische Bild und bleibt im Deutschen verständlich.
- source_word: עֲבָדָיו
  choice: seiner Diener
  rationale: עבד bedeutet grundsätzlich „Diener“ und kann hier Männer im königlichen beziehungsweise militärischen Dienst Davids bezeichnen.
theological_decisions:
- issue: Identität von הָרָפָא
  choice: Rafa als nicht näher festgelegter Vorfahr oder Sippenname
  alternative: der Riese; die Refaïter; ein persönlicher Ahnherr namens Rafa
  rationale: Die hebräische Singularform mit Artikel erlaubt keine sichere Entscheidung, ob ein einzelner Ahnherr oder eine durch ihn bezeichnete Abstammungslinie gemeint ist. Deshalb wird die Bezeichnung nicht zu „Riese“ konkretisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht ungewohnte genealogische Wendung „Rafa … geboren“ folgt bewusst eng dem Hebräischen; die Fußnote bietet die natürlichere Sinnwiedergabe. Das wiederholte Bild „durch die Hand“ bleibt erhalten.
