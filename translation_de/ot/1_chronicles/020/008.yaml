revisions:
- from: Diese wurden Rafa in Gat geboren[a] und fielen durch die Hand Davids und durch die Hand seiner Diener.
  to: Diese wurden dem Rafa[a] in Gat geboren und fielen durch die Hand Davids und durch die Hand seiner Diener.
  rationale: Die Revision macht die genealogische Dativkonstruktion und die im Hebräischen vorhandene Bestimmtheit sichtbar, ohne die unsichere Identität von הָרָפָא auf einen Riesen, eine Volksgruppe oder einen bestimmten Ahnherrn festzulegen. Der Fußnotenanker und die vorsichtigere Formulierung der Anmerkung ordnen die Auslegungsfrage präziser zu.
