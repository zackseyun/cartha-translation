  text: וְ/אֶת הָ/עָ֨ם אֲשֶׁר בָּ֜/הּ הוֹצִ֗יא וַ/יָּ֨שַׂר בַּ/מְּגֵרָ֜ה וּ/בַ/חֲרִיצֵ֤י הַ/בַּרְזֶל֙ וּ/בַ/מְּגֵר֔וֹת וְ/כֵן֙ יַעֲשֶׂ֣ה דָוִ֔יד לְ/כֹ֖ל עָרֵ֣י בְנֵי עַמּ֑וֹן וַ/יָּ֧שָׁב דָּוִ֛יד וְ/כָל הָ/עָ֖ם יְרוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/003.yaml
  text: He brought out the people who were in it and put them to work with saws[a], iron tools, and axes. Thus David did to all the cities of the Ammonites[b]. Then David and all the people returned to Jerusalem.
translation:
  language: de
  text: Die Bewohner, die darin waren, führte er heraus und ließ sie mit Sägen, eisernen Geräten und Schneidwerkzeugen arbeiten.[a][b] So verfuhr David mit allen Städten der Ammoniter. Dann kehrten David und das ganze Volk nach Jerusalem zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „stellte sie unter Sägen, eiserne Dreschschlitten und Schneidwerkzeuge“. Manche verstehen den Vers, besonders im Licht von 2. Samuel 12,31, so, dass David sie mit solchen Geräten hinrichten ließ.'
    reason: alternative_reading
  - marker: b
    text: Die hebräischen Bezeichnungen der Geräte sind zum Teil unsicher. Die Ausdrücke für die eisernen Geräte und die Schneidwerkzeuge können allgemeiner verschiedene scharfe oder schneidende Geräte bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיא
  choice: führte er heraus
  rationale: Der Hifil von יצא bezeichnet hier das Herausführen der Bevölkerung aus der eroberten Stadt. Die Formulierung ist konkret und im Deutschen natürlich.
- source_word: וַיָּשַׂר
  choice: ließ sie … arbeiten
  rationale: Die schwierige Verbform lässt sich im chronistischen Wortlaut als Zuweisung von Arbeit mit den anschließend genannten Geräten verstehen. Diese Wiedergabe vermeidet es, die gewaltsamere Formulierung aus 2. Samuel 12,31 unbemerkt in den Text der Chronik einzutragen; die andere Deutung wird in einer Fußnote offengelegt.
- source_word: בַּמְּגֵרָה
  choice: mit Sägen
  rationale: מְגֵרָה bezeichnet eine Säge. Der deutsche Plural passt zu einer allgemeinen Aufzählung von Arbeitsgeräten.
- source_word: בַּחֲרִיצֵי הַבַּרְזֶל
  choice: mit eisernen Werkzeugen
  rationale: Die Wendung bezeichnet scharfe beziehungsweise schneidende Geräte aus Eisen, doch ihre genaue Art ist unsicher. „Eiserne Werkzeuge“ wahrt diese Unbestimmtheit.
- source_word: וּבַמְּגֵרוֹת
  choice: und Äxten
  rationale: Das seltene Wort ist in diesem Zusammenhang lexikalisch unsicher und wird als weiteres Schneidwerkzeug verstanden. „Äxte“ ergibt eine verständliche Geräteliste, während die Unsicherheit in der Fußnote genannt wird.
- source_word: וְכֵן יַעֲשֶׂה
  choice: So verfuhr David
  rationale: Die Wendung fasst Davids entsprechendes Vorgehen gegenüber den übrigen ammonitischen Städten zusammen. Das deutsche Präteritum ist im Erzählzusammenhang idiomatisch.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: mit allen Städten der Ammoniter
  rationale: „Ammoniter“ ist die übliche deutsche Volksbezeichnung für בְנֵי עַמּוֹן; „mit … verfahren“ gibt die hebräische Präposition im Zusammenhang natürlich wieder.
- source_word: וַיָּשָׁב … יְרוּשָׁלִָם
  choice: kehrten … nach Jerusalem zurück
  rationale: שׁוב mit Zielangabe bedeutet im Erzählstil „zurückkehren“. Das zusammengesetzte Subjekt verlangt im Deutschen den Plural.
theological_decisions:
- issue: Ob der Vers Zwangsarbeit oder Hinrichtung beziehungsweise grausame Tötung der Ammoniter beschreibt
  choice: Der Haupttext versteht die Aussage als Arbeit mit den genannten Geräten.
  alternative: Möglich ist die Deutung, David habe die Menschen unter Sägen, eiserne Dreschschlitten und Schneidwerkzeuge gebracht und sie damit getötet; diese Auffassung wird besonders durch 2. Samuel 12,31 beeinflusst.
  rationale: Der hebräische Wortlaut der Chronik ist schwierig und unterscheidet sich vom Samueltext. Daher wird die weniger gewaltsame, im chronistischen Wortlaut mögliche Deutung im Haupttext geboten, ohne die ethisch und theologisch bedeutsame Alternative zu verschweigen.
translation_notes:
  register: Moderner, würdiger deutscher Erzählstil. „Bewohner“ gibt das kollektive הָעָם im konkreten Stadtbezug verständlich wieder. Die Hauptfassung ist gut lesbar, während zwei unmittelbar platzierte Fußnoten sowohl die umstrittene Handlungsdeutung als auch die lexikalische Unsicherheit der Geräteliste bewahren.
