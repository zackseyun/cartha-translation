source:
  edition: WLC
  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/תַּעֲמֹ֧ד מִלְחָמָ֛ה בְּ/גֶ֖זֶר עִם פְּלִשְׁתִּ֑ים אָ֣ז הִכָּ֞ה סִבְּכַ֣י הַ/חֻֽשָׁתִ֗י אֶת סִפַּ֛י מִ/ילִדֵ֥י הָ/רְפָאִ֖ים וַ/יִּכָּנֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/004.yaml
  text: After this[a], war arose at Gezer with the Philistines. Then Sibbecai the Hushathite struck down Sippai, one of the descendants of the Rephaim[b], and they were subdued.
translation:
  language: de
  text: Danach kam es bei Geser zum Krieg mit den Philistern. Da erschlug Sibbechai, der Huschathiter, Sippai[a], einen der Nachkommen der Rephaim[b], und sie wurden unterworfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name wird auch „Safai“ wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „die Rephaim“; traditionell auch mit „die Riesen“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Danach
  rationale: Eine natürliche deutsche Erzählüberleitung, die die zeitliche Abfolge wiedergibt, ohne die hebräische Eröffnungsformel unnötig wörtlich nachzubilden.
- source_word: וַתַּעֲמֹד מִלְחָמָה
  choice: kam es … zum Krieg
  rationale: Die Verbindung bezeichnet hier das Entstehen beziehungsweise Eintreten eines Krieges. Die gewählte Formulierung ist idiomatisch und bleibt semantisch nahe am Hebräischen.
- source_word: בְּגֶזֶר
  choice: bei Geser
  rationale: Bei einem Kampfgeschehen bezeichnet die Präposition den Ort; „bei Geser“ ist im Deutschen natürlich und lässt offen, ob innerhalb oder im Umfeld der Stadt gekämpft wurde.
- source_word: עִם פְּלִשְׁתִּים
  choice: mit den Philistern
  rationale: „Mit“ entspricht der Grundbedeutung von עִם; der kriegerische Zusammenhang macht die Gegnerschaft deutlich.
- source_word: אָז
  choice: Da
  rationale: „Da“ dient als knapper zeitlich-folgernder Erzählanschluss und entspricht hier dem hebräischen אָז.
- source_word: הִכָּה
  choice: erschlug
  rationale: נכה bezeichnet im Kampfzusammenhang das tödliche Niederschlagen; „erschlug“ gibt diese martialische Bedeutung knapp wieder.
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: Sibbechai, der Huschathiter
  rationale: Der Personenname und die Herkunftsbezeichnung werden in einer im Deutschen lesbaren, bibelnahen Form wiedergegeben.
- source_word: סִפַּי
  choice: Sippai
  rationale: Die Wiedergabe folgt der masoretischen Vokalisierung; eine abweichende Namensform wird in der Fußnote genannt.
- source_word: מִילִדֵי הָרְפָאִים
  choice: einen der Nachkommen der Refaïter
  rationale: יְלִידֵי bezeichnet Abstammung beziehungsweise Zugehörigkeit durch Geburt. „Refaïter“ bewahrt den möglichen Volks- oder Gruppennamen, statt ihn vorschnell als Größenangabe zu deuten.
- source_word: וַיִּכָּנֵעוּ
  choice: sie wurden unterworfen
  rationale: Der Niphal von כנע bezeichnet im militärischen Zusammenhang, dass eine Gruppe bezwungen und in Unterordnung gebracht wurde. Das unbestimmte Pronomen des Ausgangstextes bleibt erhalten.
theological_decisions:
- issue: Deutung von הָרְפָאִים
  choice: die Refaïter
  alternative: die Riesen
  rationale: Der Ausdruck kann eine Volks-, Sippen- oder Gruppenbezeichnung sein. Die transliterierende Wiedergabe vermeidet es, die umstrittene Identität als körperliche Beschreibung festzulegen; die traditionelle Deutung wird in der Fußnote bewahrt.
- issue: Bezugsgruppe von וַיִּכָּנֵעוּ
  choice: sie wurden unterworfen
  alternative: die Philister wurden unterworfen
  rationale: Das hebräische Verb hat nur ein unausgedrücktes pluralisches Subjekt. Der Zusammenhang legt die Philister nahe, doch die Übersetzung ergänzt die Bezugsgruppe nicht ausdrücklich und bewahrt so die Form des Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper erzählerischer Syntax. Eigennamen folgen gut lesbaren deutschen Transliterationsformen. Die Wiederholung von „Krieg“ und die passive Schlussformulierung bewahren die sachliche, militärische Erzählweise des Hebräischen.
