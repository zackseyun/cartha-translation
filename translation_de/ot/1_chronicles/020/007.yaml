  text: וַ/יְחָרֵ֖ף אֶת יִשְׂרָאֵ֑ל וַ/יַּכֵּ֨/הוּ֙ יְה֣וֹנָתָ֔ן בֶּן שִׁמְעָ֖א אֲחִ֥י דָוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/007.yaml
  text: And when he taunted Israel[a], Jonathan son of Shimea, David’s brother, struck him down.
translation:
  language: de
  text: Als er Israel verhöhnte[a], erschlug ihn Jonatan, der Sohn Schimas, des Bruders Davids.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „forderte Israel heraus“. Das hebräische Verb kann verächtliche Schmähung oder offene Herausforderung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: verhöhnte
  rationale: Das Verb חרף bezeichnet hier eine verächtliche, herausfordernde Schmähung. „Verhöhnte“ gibt den feindseligen Sprechakt in natürlichem, würdigem Deutsch wieder.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Text nennt die nationale Gemeinschaft unmittelbar „Israel“; diese Form kann im Deutschen ebenso für das Volk stehen.
- source_word: וַיַּכֵּהוּ
  choice: erschlug ihn
  rationale: נכה bezeichnet hier im erzählerischen Zusammenhang einen tödlichen Schlag. „Erschlug ihn“ drückt sowohl die Handlung als auch ihren tödlichen Ausgang knapp aus.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: בֶּן שִׁמְעָא
  choice: der Sohn von Schima
  rationale: Die Abstammungsangabe wird unmittelbar und in der im Deutschen üblichen Namensform wiedergegeben.
- source_word: אֲחִי דָוִיד
  choice: dem Bruder Davids
  rationale: 'Die Apposition bezieht sich grammatisch am natürlichsten auf Schima: Jonatan war der Sohn Schimas, der Davids Bruder war. Die Formulierung vermeidet die mögliche Fehlauffassung, Jonatan selbst sei Davids Bruder gewesen.'
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die syntaktische Beziehung von „Bruder Davids“ wird im Deutschen ausdrücklich kenntlich gemacht; die lexikalische Spannweite von חרף bleibt durch die Fußnote erhalten.
