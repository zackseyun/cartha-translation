  text: לִ/בְנֵי֮ גֵּרְשׁוֹם֒ מִ/מִּשְׁפַּ֗חַת חֲצִי֙ מַטֵּ֣ה מְנַשֶּׁ֔ה אֶת גּוֹלָ֥ן בַּ/בָּשָׁ֖ן וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת עַשְׁתָּר֖וֹת וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/056.yaml
  text: 'To the sons of Gershom[a], from the clan of the half-tribe of Manasseh: Golan in Bashan with its pasturelands, and Ashtaroth with its pasturelands.'
translation:
  language: de
  text: 'Den Nachkommen Gerschoms gab man aus der Sippe des halben Stammes Manasse: Golan im Baschan mit seinem Weideland[a] und Aschtarot mit seinem Weideland.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit seinem Gemeindeland“. Das hebräische Wort bezeichnet das offene Land, das zu einer Stadt gehörte und häufig als Weideland genutzt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גֵּרְשׁוֹם
  choice: Den Nachkommen Gerschoms gab man
  rationale: Die Präposition לְ kennzeichnet hier die Empfänger der Zuteilung. „Nachkommen“ gibt den genealogischen Gebrauch von בָּנִים im heutigen Deutsch natürlich wieder; das ergänzte „gab man“ macht die im hebräischen Listenstil ausgelassene Zuteilungshandlung verständlich.
- source_word: מִמִּשְׁפַּחַת
  choice: aus der Sippe
  rationale: מִשְׁפָּחָה bezeichnet in diesem Stammeszusammenhang eine größere Verwandtschaftsgruppe beziehungsweise Sippe, nicht nur eine Kernfamilie.
- source_word: חֲצִי מַטֵּה מְנַשֶּׁה
  choice: des halben Stammes Manasse
  rationale: Diese Formulierung bewahrt die Struktur des Hebräischen und bezeichnet den territorial gegliederten halben Stamm Manasse.
- source_word: אֶת גּוֹלָן בַּבָּשָׁן
  choice: Golan im Baschan
  rationale: Golan ist der Stadtname, Baschan die Region; die deutsche Namensform mit Artikel und verschmolzener Präposition ist idiomatisch.
- source_word: מִגְרָשֶׁיהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das offene, zur Stadt gehörende Umland, das besonders als Weidefläche diente. Der Singular „Weideland“ ist im Deutschen natürlich und konkret.
- source_word: עַשְׁתָּרוֹת
  choice: Aschtarot
  rationale: „Aschtarot“ ist eine geläufige deutsche Umschrift des hebräischen Ortsnamens.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Listenstil. Die elliptische hebräische Konstruktion wird durch „gab man“ behutsam ergänzt, ohne den Inhalt der Zuteilung zu verändern. Orts- und Stammesnamen folgen geläufigen deutschen Bibelformen.
