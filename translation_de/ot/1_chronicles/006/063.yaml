source:
  edition: WLC
  text: וּ/מֵ/עֵ֜בֶר לְ/יַרְדֵּ֣ן יְרֵחוֹ֮ לְ/מִזְרַ֣ח הַ/יַּרְדֵּן֒ מִ/מַּטֵּ֣ה רְאוּבֵ֔ן אֶת בֶּ֥צֶר בַּ/מִּדְבָּ֖ר וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת יַ֖הְצָ/ה וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/063.yaml
  text: 'And beyond the Jordan at Jericho[a], east of the Jordan, from the tribe of Reuben: Bezer in the wilderness, with its pasturelands, and Jahzah, with its pasturelands.'
translation:
  language: de
  text: 'Und jenseits des Jordan bei Jericho, östlich des Jordan, erhielten sie vom Stamm Ruben: Bezer in der Wüste mit seinen Weideflächen und Jahza[a] mit seinen Weideflächen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jahza wird in manchen deutschen Bibelübersetzungen auch „Jahaz“ genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרֵחוֹ
  choice: Und jenseits des Jordan bei Jericho
  rationale: Die Wendung setzt die Aufzählung fort und bezeichnet das Gebiet auf der anderen Seite des Jordan, näher bestimmt durch Jericho. „Jenseits des Jordan bei Jericho“ ist knapp und bewahrt die räumliche Perspektive des Hebräischen.
- source_word: לְמִזְרַח הַיַּרְדֵּן
  choice: östlich des Jordan
  rationale: מִזְרָח bezeichnet die östliche Richtung beziehungsweise Lage; die deutsche Formulierung ist natürlich und geografisch eindeutig.
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: vom Stamm Ruben
  rationale: מַטֶּה bezeichnet hier im Zusammenhang der Landzuteilung einen israelitischen Stamm.
- source_word: בֶּצֶר בַּמִּדְבָּר
  choice: Bezer in der Wüste
  rationale: Der Ortsname wird transliteriert; מִדְבָּר bezeichnet hier die Wüste beziehungsweise das unbesiedelte Steppenland. „Wüste“ ist die geläufige und kontextuell passende Wiedergabe.
- source_word: מִגְרָשֶׁיהָ
  choice: seinen Weideflächen
  rationale: מִגְרָשׁ bezeichnet bei den Levitenstädten das offene, zur Stadt gehörende Umland, insbesondere für das Vieh. „Weideflächen“ ist verständlich und sachlich präzise.
- source_word: יַהְצָה
  choice: Jahza
  rationale: Der deutsche Ortsname wird eng an die hebräische Form Jahṣāh angelehnt; die in deutschen Bibeln ebenfalls verbreitete Form „Jahaz“ wird in einer Fußnote genannt.
theological_decisions:
- issue: Implizites Prädikat in der fortgesetzten Städteliste
  choice: erhielten sie
  alternative: kein ergänztes Verb beziehungsweise „gab man ihnen“
  rationale: Der hebräische Vers ist als elliptische Fortsetzung der vorausgehenden Zuteilung formuliert. „Erhielten sie“ macht den deutschen Satz verständlich, ohne die Begünstigten oder die Art der Zuteilung neu festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die wiederholte Jordan-Angabe bleibt als geografische Präzisierung erhalten. Das im Hebräischen elliptische Satzgefüge wird durch „erhielten sie“ behutsam vervollständigt; der Fußnotenmarker steht unmittelbar beim betreffenden Ortsnamen.
