- source_word: מִיכָאֵל
  choice: Michael
  rationale: Michael ist die im Deutschen geläufige Form dieses hebräischen Personennamens.
- source_word: בַּעֲשֵׂיָה
  choice: Baaseja
  rationale: Die Form Baaseja gibt den überlieferten hebräischen Text בַּעֲשֵׂיָה wieder; Maaseja ist zwar aus anderen Genealogien und Übersetzungstraditionen bekannt, entspricht hier aber nicht der vorliegenden Konsonantenfolge.
- source_word: מַלְכִּיָּה
  choice: Malkija
  rationale: Malkija bildet die hebräischen Konsonanten und die Kurzform des Gottesnamens angemessen und in gut lesbarer deutscher Umschrift ab.
