base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/057.yaml
  text: 'And from the tribe of Issachar: Kedesh with its pasturelands[a], and Daberath with its pasturelands.'
translation:
  language: de
  text: 'Und vom Stamm Issachar: Kedesch mit seinen Weideflächen und Daberat[a] mit seinen Weideflächen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname wird auch Daberath geschrieben.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: Und vom Stamm
  rationale: מַטֶּה bezeichnet in diesem Zuteilungskontext den Stamm; וּ und מִ werden als „und vom“ wiedergegeben und führen die vorherige Aufzählung fort.
- source_word: יִשָׂשכָר
  choice: Issachar
  rationale: Eingebürgerte deutsche Schreibung des Stammesnamens.
- source_word: קֶדֶשׁ
  choice: Kedesch
  rationale: Übliche deutsche Umschrift des Ortsnamens; der hebräische Text fügt keine nähere Ortsbestimmung hinzu.
- source_word: מִגְרָשֶׁיהָ
  choice: mit seinen Weideflächen
  rationale: מִגְרָשׁ bezeichnet das offene, gemeinschaftlich nutzbare Weideland um eine Levitenstadt. Das feminine Suffix bezieht sich grammatisch auf die jeweilige Stadt; im Deutschen steht beim Ortsnamen idiomatisch „seinen“.
- source_word: דָּבְרַת
  choice: Daberat
  rationale: Quellnahe deutsche Umschrift des Ortsnamens; abweichende traditionelle Schreibungen werden in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Listenform des Hebräischen bleibt erhalten; „Weideflächen“ ist verständlicher und genauer als das traditionelle „Vorstädte“.
