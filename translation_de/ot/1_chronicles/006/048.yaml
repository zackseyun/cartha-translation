  text: לִ/בְנֵ֨י מְרָרִ֜י לְ/מִשְׁפְּחוֹתָ֗/ם מִ/מַּטֵּ֣ה רְ֠אוּבֵן וּֽ/מִ/מַּטֵּה גָ֞ד וּ/מִ/מַּטֵּ֤ה זְבוּלֻן֙ בַּ/גּוֹרָ֔ל עָרִ֖ים שְׁתֵּ֥ים עֶשְׂרֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/048.yaml
  text: To the sons of Merari, according to their clans, from the tribe of Reuben, from the tribe of Gad, and from the tribe of Zebulun, twelve cities by lot.
translation:
  language: de
  text: Den Söhnen Meraris wurden nach ihren Sippen aus dem Stamm Ruben, aus dem Stamm Gad und aus dem Stamm Sebulon durch das Los zwölf Städte zugeteilt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: den Söhnen Meraris
  rationale: Die genealogische Wendung bleibt erhalten; der Dativ gibt die Empfänger der Zuteilung wieder.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet im Zusammenhang der Stammesgliederung eher eine Sippe beziehungsweise Untergruppe als die moderne Kernfamilie.
- source_word: מִמַּטֵּה
  choice: aus dem Stamm
  rationale: מַטֶּה bedeutet in diesem Zuteilungskontext »Stamm«; die Wiederholung des Hebräischen wird bewahrt.
- source_word: רְאוּבֵן ... גָד ... זְבוּלֻן
  choice: Ruben ... Gad ... Sebulon
  rationale: Gebräuchliche deutsche Formen der Stammesnamen.
- source_word: בַּגּוֹרָל
  choice: durch das Los
  rationale: Die Formulierung bezeichnet das Los als Mittel der Zuteilung, ohne den Vorgang unnötig auszudeuten.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: zwölf Städte
  rationale: Natürliche deutsche Wortstellung für Zahlwort und Substantiv; עִיר wird im Zuteilungskontext konventionell mit »Stadt« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das im Hebräischen elliptische Zuteilungsstatement wird mit »wurden ... zugeteilt« vervollständigt, damit der Satz im Deutschen natürlich und eindeutig verständlich ist; die wiederholte Herkunftsangabe »aus dem Stamm« bleibt erhalten.
