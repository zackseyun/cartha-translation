  source_fidelity: 'Der Entwurf gibt sämtliche Bestandteile des Hebräischen angemessen wieder: die Empfänger („den Söhnen Meraris“), die Gliederung nach Sippen, die drei Herkunftsstämme, die Zuteilung durch das Los sowie die Zahl von zwölf Städten. Die im Hebräischen elliptische Zuteilungsaussage wird im Deutschen sachgerecht ergänzt, ohne zusätzliche inhaltliche Festlegung.'
