  text: They gave them Hebron in the land of Judah[a], with its pasturelands around it.
translation:
  language: de
  text: Sie gaben ihnen Hebron im Land Juda mit den Weideflächen[a] rings um die Stadt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das zugehörige offene Umland“. Das hebräische Wort bezeichnet die unbebaute Fläche, die zu einer Stadt gehörte und häufig als Weideland diente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Sie gaben
  rationale: Das Qal-Wayyiqtol von נתן führt die Erzählung fort und bezeichnet hier eine vollendete Handlung. Im Deutschen gibt das Präteritum den schlichten Erzählstil natürlich wieder; das einleitende ו muss nicht eigens mit „und“ wiedergegeben werden.
- source_word: לָהֶם
  choice: ihnen
  rationale: Die Präposition ל kennzeichnet den indirekten Empfänger; „sie gaben ihnen“ ist die natürliche deutsche Konstruktion.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Der Ortsname wird in seiner im Deutschen etablierten Form wiedergegeben.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: im Land Juda
  rationale: אֶרֶץ bezeichnet hier das geografische Gebiet Judas. „Land Juda“ bewahrt die ausdrückliche Gebietsbezeichnung des Hebräischen und klingt zugleich würdig und verständlich.
- source_word: מִגְרָשֶׁיהָ
  choice: die Weideflächen
  rationale: מִגְרָשׁ bezeichnet das zu einer Stadt gehörende offene Umland, das unter anderem als Weideland diente. „Weideflächen“ vermittelt in diesem Zusammenhang die Hauptfunktion verständlich; die breitere Bedeutung wird in der Fußnote genannt.
- source_word: סְבִיבֹתֶיהָ
  choice: rings um die Stadt
  rationale: Das Wort bezeichnet das umliegende Gebiet. Das feminine Suffix bezieht sich auf Hebron als Stadt; die ausdrückliche Wiedergabe „die Stadt“ vermeidet im Deutschen einen unklaren Pronomenbezug.
theological_decisions: []
translation_notes:
  register: Moderner, klarer und würdiger Erzählstil. Die Formulierung folgt eng der hebräischen Satzstruktur, löst aber den im Deutschen missverständlichen Bezug des femininen Suffixes durch „die Stadt“ auf. Der Fachbegriff für das städtische Umland wird im Haupttext funktional und in der Fußnote umfassender wiedergegeben.
