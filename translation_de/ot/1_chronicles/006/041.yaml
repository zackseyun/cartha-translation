  register: Modernes, würdiges Standarddeutsch. „Doch“ verdeutlicht den im Kontext angelegten Gegensatz, ohne zusätzliche Information einzuführen. „Dazugehörig“ macht den Bezug des Possessivsuffixes idiomatisch deutlich.
