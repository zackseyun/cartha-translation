  text: וְ/אֶת שְׂדֵ֥ה הָ/עִ֖יר וְ/אֶת חֲצֵרֶ֑י/הָ נָתְנ֖וּ לְ/כָלֵ֥ב בֶּן יְפֻנֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/041.yaml
  text: But the fields of the city and its pasturelands they gave to Caleb son of Jephunneh[a].
translation:
  language: de
  text: Doch das Ackerland der Stadt und die dazugehörigen Dörfer[a] gaben sie Kaleb, dem Sohn Jefunnes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gehöfte“ beziehungsweise „Siedlungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: das Ackerland der Stadt
  rationale: שָׂדֶה bezeichnet Feld, offenes Land oder landwirtschaftlich genutztes Gebiet. Der kollektive Singular wird hier natürlich mit „Ackerland“ wiedergegeben.
- source_word: חֲצֵרֶיהָ
  choice: die dazugehörigen Dörfer
  rationale: חָצֵר kann Dörfer, Gehöfte oder abhängige Siedlungen bezeichnen. Im unmittelbaren Zuteilungskontext ist es von den zuvor erwähnten Weideflächen (מִגְרָשׁ) zu unterscheiden; deshalb ist „Dörfer“ hier sachlich näher als „Weideflächen“.
- source_word: נָתְנוּ
  choice: gaben sie
  rationale: Das Qal Perfekt von נתן bedeutet schlicht „geben“. Die deutsche Wortstellung bewahrt zugleich den Gegensatz zur vorherigen Zuteilung.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: Kaleb, dem Sohn Jefunnes
  rationale: Das לְ kennzeichnet den Empfänger. Die Namen werden in ihrer im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: וְאֶת ... וְאֶת
  choice: Doch ... und ...
  rationale: 'Das erste וְ stellt im Zusammenhang einen Gegensatz her: Die Stadt mit ihren Weideflächen fiel den Priestern zu, das Ackerland und die zugehörigen Dörfer dagegen Kaleb.'
theological_decisions: []
