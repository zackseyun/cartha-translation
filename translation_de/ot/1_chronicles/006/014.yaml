  text: בְּנֵ֥י מְרָרִ֖י מַחְלִ֑י לִבְנִ֥י בְנ֛/וֹ שִׁמְעִ֥י בְנ֖/וֹ עֻזָּ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/014.yaml
  text: 'The sons of Merari: Mahli[a], Libni his son, Shimei his son, Uzzah his son.'
translation:
  language: de
  text: 'Die Söhne Meraris: Machli[a], dessen Sohn Libni, dessen Sohn Schimi, dessen Sohn Usa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Geschlechtsregistern kann „Söhne“ auch allgemeiner „Nachkommen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Der Plural im Status constructus leitet die Geschlechtsfolge ein. „Söhne“ gibt die Form unmittelbar wieder; im genealogischen Sprachgebrauch kann der Ausdruck weiter gefasst auch Nachkommen bezeichnen.
- source_word: מְרָרִי
  choice: Meraris
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben und wegen der Konstruktion als Genitiv markiert.
- source_word: מַחְלִי
  choice: Machli
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: לִבְנִי
  choice: Libni
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: בְנוֹ
  choice: dessen Sohn
  rationale: Das Substantiv mit Suffix der 3. Person Singular bezeichnet jeweils die Sohnschaft zum unmittelbar zuvor genannten Mann. „Dessen Sohn“ macht die fortlaufende Abstammungskette im Deutschen eindeutig.
- source_word: שִׁמְעִי
  choice: Schimi
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: עֻזָּה
  choice: Usa
  rationale: Gebräuchliche deutsche Form dieses hebräischen Personennamens.
theological_decisions: []
