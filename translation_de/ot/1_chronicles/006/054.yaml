  text: and Aijalon with its pasturelands[a], and Gath-rimmon with its pasturelands.
translation:
  language: de
  text: und Ajalon mit seinem Weideland[a] und Gat-Rimmon mit seinem Weideland.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinem Gemeindeland“ oder „seinem Umland“. Das hebräische Wort bezeichnet das offene Land, das zu einer Stadt gehörte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּלוֹן
  choice: Ajalon
  rationale: Der Ortsname wird nach der im Deutschen gebräuchlichen biblischen Form transliteriert und nicht übersetzt.
- source_word: מִגְרָשֶׁיהָ
  choice: mit seinem Weideland
  rationale: Das hebräische Wort bezeichnet das offene, zur Stadt gehörende Umland, das unter anderem als Weidefläche diente. Der Singular „Weideland“ klingt im Deutschen natürlich und passt zum Listencharakter.
- source_word: גַּת רִמּוֹן
  choice: Gat-Rimmon
  rationale: Der zusammengesetzte Ortsname wird transliteriert; der Bindestrich macht kenntlich, dass es sich um einen einzigen Ortsnamen handelt.
- source_word: וְאֶת
  choice: und
  rationale: Die Konjunktion wird wiedergegeben, während der nicht übersetzbare Akkusativmarker unmarkiert bleibt; so bleibt die koordinierende Listenstruktur erhalten.
