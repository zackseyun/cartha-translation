source:
  edition: WLC
  text: וְ/אֵ֥לֶּה הָ/עֹמְדִ֖ים וּ/בְנֵי/הֶ֑ם מִ/בְּנֵי֙ הַ/קְּהָתִ֔י הֵימָן֙ הַ/מְשׁוֹרֵ֔ר בֶּן יוֹאֵ֖ל בֶּן שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/018.yaml
  text: 'And these are the ones who stood[a], and their sons: from the sons of the Kohathites: Heman the singer, son of Joel[b], son of Samuel.'
translation:
  language: de
  text: 'Und dies sind die, die standen[a], und ihre Söhne: aus den Nachkommen Kehats[b]: Heman, der Sänger, Sohn Joels, Sohn Samuels.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bedeutet wörtlich „standen“; im Zusammenhang kann damit gemeint sein, dass sie zum Dienst bereitstanden oder ihren Dienst versahen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von den Söhnen des Kehatiters“; gemeint sind die Kehatiter beziehungsweise Kehats Nachkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind diejenigen
  rationale: Bewahrt sowohl das verbindende וְ als auch die hinweisende und einleitende Funktion von אֵלֶּה und führt die folgende Namensliste in natürlichem Deutsch ein.
- source_word: הָעֹמְדִים
  choice: die dort standen
  rationale: Gibt das konkrete Bild des Partizips von עמד („stehen“) wieder. Im Zusammenhang kann das Stehen zugleich den zugewiesenen Dienst bezeichnen, doch diese Deutung wird nicht an die Stelle des hebräischen Bildes gesetzt.
- source_word: וּבְנֵיהֶם
  choice: und ihre Söhne
  rationale: Entspricht der einfachen hebräischen Verbindung mit וְ. „Samt ihren Söhnen“ wäre im Deutschen flüssig, würde die Beziehung aber stärker auslegen.
- source_word: מִבְּנֵי הַקְּהָתִי
  choice: von den Nachkommen Kehats
  rationale: Gibt die im Ausdruck „von den Söhnen des Kehatiters“ bezeichnete Sippenabstammung natürlich und präzise wieder.
- source_word: הֵימָן
  choice: Heman
  rationale: Gebräuchliche deutsche Wiedergabe des Personennamens.
- source_word: הַמְשׁוֹרֵר
  choice: der Sänger
  rationale: Die direkte und allgemein verständliche Wiedergabe der Bezeichnung für denjenigen, der singt; „Musiker“ wäre weiter, „Kantor“ spezieller.
- source_word: בֶּן יוֹאֵל בֶּן שְׁמוּאֵל
  choice: der Sohn Joels, des Sohnes Samuels
  rationale: Bildet die genealogische Kette idiomatisch ab und macht deutlich, dass Samuel der Vater Joels ist.
theological_decisions:
- issue: Bedeutung des Stehens im kultischen Zusammenhang
  choice: Das konkrete Bild „standen“ bleibt im Haupttext erhalten.
  alternative: „ihren Dienst versahen“
  rationale: Der Kontext legt einen amtlichen beziehungsweise kultischen Dienst nahe, doch das Verb selbst bezeichnet zunächst das Stehen. Die Übersetzung bewahrt daher die mögliche Doppelschicht, statt sie auf eine Funktionsbezeichnung zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt listenartig und nahe am Hebräischen; die genealogische Formulierung wird zugleich so gestaltet, dass die Abstammungsfolge klar verständlich ist.
