  text: וּ/בְנֵ֧י שְׁמוּאֵ֛ל הַ/בְּכֹ֥ר וַשְׁנִ֖י וַ/אֲבִיָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/013.yaml
  text: 'And the sons of Samuel: the firstborn[a], Vashni, and Abijah.'
translation:
  language: de
  text: 'Und die Söhne Samuels: der Erstgeborene, Waschni[a] und Abija.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: Waschni. Die Form kann auch als »und der zweite« verstanden werden. Nach 1. Samuel 8,2 hießen Samuels Söhne Joel und Abija.'
    reason: Textvariante beziehungsweise ungewöhnliche hebräische Form
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Das ו führt die genealogische Reihe fort; בְנֵי bezeichnet im Status constructus die »Söhne« Samuels.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Der Personenname wird in seiner im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: הַבְּכֹר
  choice: der Erstgeborene
  rationale: Das substantivierte Wort mit Artikel bezeichnet den rangmäßig beziehungsweise der Geburt nach ersten Sohn.
- source_word: וַשְׁנִי
  choice: Waschni
  rationale: Die masoretische Punktierung lässt die Form hier als Eigennamen erscheinen. Da sie auch als »und der zweite« verstanden werden kann, wird diese echte Unklarheit in der Fußnote bewahrt.
- source_word: וַאֲבִיָּה
  choice: und Abija
  rationale: Die Konjunktion und der Personenname werden direkt wiedergegeben; »Abija« ist die gebräuchliche deutsche Namensform.
theological_decisions:
- issue: Schwierigkeit bei Namen und Reihenfolge der Söhne Samuels
  choice: Die masoretische Form wird im Haupttext als Eigenname »Waschni« beibehalten.
  alternative: Die Wendung kann als »der Erstgeborene und der zweite, Abija« verstanden werden; im Vergleich mit 1. Samuel 8,2 könnte beim Erstgeborenen der Name Joel ausgefallen sein.
  rationale: Der überlieferte hebräische Text wird nicht stillschweigend an 1. Samuel 8,2 angeglichen. Zugleich macht die Fußnote die sprachliche und textgeschichtliche Schwierigkeit transparent.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem genealogischem Stil. Die Satzellipse des Hebräischen bleibt erhalten; die Namensform »Waschni« folgt einer natürlichen deutschen Umschrift.
