  text: Ramoth with its pasturelands[a], and Anem with its pasturelands.
translation:
  language: de
  text: Ramot mit seinem Weideland und Anem[a] mit seinem Weideland.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im hebräischen Text steht „Anem“; die Parallelliste in Josua 21,25 hat „Aner“.
