lexical_decisions:
- source_word: רָאמוֹת
  choice: Ramot
  rationale: Der Ortsname wird nach der hebräischen Form in einer im Deutschen üblichen Umschrift wiedergegeben.
- source_word: מִגְרָשֶׁיהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das einer Stadt zugehörige offene Land, besonders als Weidefläche. Der feminine Singularsuffix bezieht sich jeweils auf die Stadt; im Deutschen steht wegen des grammatischen Geschlechts von „Weideland“ beziehungsweise des Ortsnamens idiomatisch „seinem“.
- source_word: עָנֵם
  choice: Anem
  rationale: Der masoretische Text liest עָנֵם. Die abweichende Namensform der Parallelliste wird nicht in den Haupttext übernommen, sondern in einer Fußnote dokumentiert.
- source_word: וְאֶת
  choice: und
  rationale: Die Konjunktion verbindet die Listenelemente; der nicht übersetzbare Akkusativmarker אֵת wird im Deutschen nicht eigens wiedergegeben.
theological_decisions: []
translation_notes:
  register: Schlichte, würdige Listenprosa in modernem Standarddeutsch. „Weideland“ ist verständlich und bildet den levitischen Städtekontext genauer ab als ältere Wiedergaben wie „Vorstädte“.
