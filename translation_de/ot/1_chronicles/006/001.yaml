lexical_decisions:
- source_word: בְּנֵי
  choice: Söhne
  rationale: Der Konstruktplural von בֵּן bezeichnet hier in der unmittelbaren Genealogie Levis direkte Söhne; „Söhne“ ist daher zugleich formal genau und kontextgerecht.
- source_word: לֵוִי
  choice: Levi
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: גֵּרְשֹׁם
  choice: Gerschom
  rationale: Die masoretische Form lautet גֵּרְשֹׁם und wird im Deutschen entsprechend als „Gerschom“ wiedergegeben; in verwandten Stellen begegnet auch die Namensform „Gerschon“.
- source_word: קְהָת
  choice: Kehat
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibeltransliteration als „Kehat“ wiedergegeben.
- source_word: וּמְרָרִי
  choice: und Merari
  rationale: Die Konjunktion וּ wird mit „und“ wiedergegeben; „Merari“ ist die etablierte deutsche Form des Personennamens.
