lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: und vom Stamm
  rationale: מַטֶּה bezeichnet im Zusammenhang der Land- und Städteverteilung einen Stamm; die vorangestellten Konjunktion und Präposition werden mit »und vom« wiedergegeben.
- source_word: אָשֵׁר
  choice: Asser
  rationale: Der Name des Stammes wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: מָשָׁל
  choice: Maschal
  rationale: Der Ortsname folgt der masoretischen Form im Chroniktext; die abweichende Form der Parallele in Josua 21,30 wird in einer Fußnote bewahrt.
- source_word: מִגְרָשֶׁיהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das zu einer Stadt gehörende offene Weidegebiet. Der feminine Singularsuffix bezieht sich auf die Stadt; im Deutschen richtet sich das Pronomen grammatisch nach dem Ortsnamen.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Der Ortsname wird in der üblichen deutschen Transliteration wiedergegeben.
