  yaml_path: translation/ot/1_chronicles/006/059.yaml
  text: 'and from the tribe of Asher: Mashal with its pasturelands[a], and Abdon with its pasturelands.'
translation:
  language: de
  text: 'und vom Stamm Asser: Maschal mit ihren Weideflächen[a] und Abdon mit ihren Weideflächen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hier steht im Chroniktext »Maschal«; die entsprechende Liste in Josua 21,30 hat »Mischal«.
