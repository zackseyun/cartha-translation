lexical_decisions:
- source_word: בֶּן
  choice: Sohn
  rationale: In der knappen genealogischen Reihung bezeichnet בֶּן die jeweilige Sohnschaft. Die wiederholte Formulierung „Sohn …“ bildet Struktur und Aussage des Hebräischen transparent ab.
- source_word: תַּחַת
  choice: Tahat
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition und entsprechend der hebräischen Form transliteriert.
- source_word: אַסִּיר
  choice: Assir
  rationale: Der Personenname wird in einer im Deutschen geläufigen, quellennahen Form wiedergegeben.
- source_word: אֶבְיָסָף
  choice: Ebjasaf
  rationale: Die Schreibung gibt den masoretisch vokalisierten hebräischen Namen אֶבְיָסָף quellennah und deutsch lesbar wieder.
- source_word: קֹרַח
  choice: Korach
  rationale: „Korach“ ist die im Deutschen etablierte und zugleich dem Hebräischen nahe Transkription des Namens.
