  text: וְ/אֵ֖לֶּה בְּנֵ֣י אַהֲרֹ֑ן אֶלְעָזָ֥ר בְּנ֛/וֹ פִּֽינְחָ֥ס בְּנ֖/וֹ אֲבִישׁ֥וּעַ בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/035.yaml
  text: 'And these were the sons of Aaron: Eleazar his son, Phinehas his son, Abishua his son.'
translation:
  language: de
  text: 'Und dies waren die Söhne Aarons: Eleasar, sein Sohn; Pinhas, sein Sohn; Abischua, sein Sohn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies waren
  rationale: Die Verbindung aus Konjunktion und Demonstrativpronomen leitet die genealogische Aufzählung ein. Das Präteritum entspricht im Deutschen dem erzählend-genealogischen Zusammenhang; formal wäre auch „Und dies sind“ möglich.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Obwohl der Plural in Genealogien auch Nachkommen bezeichnen kann, nennt die anschließende Kette jeweils die unmittelbare Sohnschaft. Daher bleibt die formale genealogische Bezeichnung erhalten.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: אֶלְעָזָר
  choice: Eleasar
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: בְּנוֹ
  choice: sein Sohn
  rationale: Das Substantiv mit Suffix der 3. Person Singular maskulin bezeichnet in der genealogischen Folge jeweils die unmittelbare Sohnschaft.
- source_word: פִּינְחָס
  choice: Pinhas
  rationale: Moderne, dem Hebräischen nahe deutsche Wiedergabe des Eigennamens.
- source_word: אֲבִישׁוּעַ
  choice: Abischua
  rationale: Im Deutschen gebräuchliche und dem hebräischen Namen entsprechende Form.
