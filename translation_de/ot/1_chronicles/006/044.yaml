  text: Ashan with its pasturelands[a], and Beth-shemesh with its pasturelands.
translation:
  language: de
  text: Aschan[a] mit seinen Weideflächen und Bet-Schemesch mit seinen Weideflächen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Parallelüberlieferungen und Übersetzungen nennen hier »Ajin« statt »Aschan«; der masoretische Text der Chronik liest »Aschan«.
    reason: textual_variant
lexical_decisions:
- source_word: עָשָׁן
  choice: Aschan
  rationale: Ortsname; nach der masoretischen Lesart des Chroniktextes ins Deutsche transkribiert. Die abweichende Lesart »Ajin« wird in einer Fußnote dokumentiert.
- source_word: מִגְרָשֶׁיהָ
  choice: mit seinen Weideflächen
  rationale: מִגְרָשׁ bezeichnet das zu einer Stadt gehörende offene Weide- oder Umland. »Weideflächen« ist im Zusammenhang der Levitenstädte verständlich und sachlich präzise; das pronominale Suffix wird im Deutschen passend zum grammatischen Geschlecht des Ortsnamens mit »seinen« wiedergegeben.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bet-Schemesch
  rationale: Der Ortsname wird nach gängiger deutscher Bibelnamenkonvention transkribiert und nicht als »Haus der Sonne« übersetzt.
- source_word: וְאֶת
  choice: und / mit
  rationale: Die wiederholte Verbindung aus Konjunktion und Objektmarker gliedert die Aufzählung. Der unübersetzbare Objektmarker bleibt unausgedrückt; die syntaktischen Beziehungen werden im Deutschen idiomatisch durch »und« und »mit« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Listenform des hebräischen Textes bleibt erhalten; Ortsnamen folgen geläufigen deutschen Transkriptionskonventionen.
