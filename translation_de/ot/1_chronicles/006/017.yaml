base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/017.yaml
  text: They were ministering before the tabernacle[a], the tent of meeting, with song until Solomon built the house of Yahweh in Jerusalem[c][b], and they stood according to their ordinance over their service.
translation:
  language: de
  text: Sie dienten vor der Wohnung[a], dem Zelt der Begegnung, mit Gesang[b], bis Salomo das Haus Jahwes in Jerusalem baute. Sie traten gemäß ihrer Ordnung zu ihrem Dienst an.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: die Stiftshütte.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: durch Gesang.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: Sie standen gemäß ihrer Ordnung bei ihrem Dienst.'
    reason: literal_rendering
lexical_decisions:
- source_word: מְשָׁרְתִים
  choice: versahen … ihren Dienst
  rationale: Das Partizip bezeichnet hier den kultischen Dienst. Die deutsche Wendung ist natürlich und hält den sachlichen Bezug zum Heiligtum fest.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: die Wohnung, das Zelt der Begegnung
  rationale: Beide hebräischen Bezeichnungen bleiben erhalten; die zweite steht erläuternd zur ersten. „Wohnung“ gibt מִשְׁכָּן transparent wieder, ohne den traditionellen Fachausdruck vorauszusetzen.
- source_word: בַּשִּׁיר
  choice: mit Gesang
  rationale: Die Präposition bezeichnet hier am ehesten die Art und Weise, in der der Dienst ausgeübt wurde; „mit Gesang“ ist knapp und idiomatisch.
- source_word: עַד בְּנוֹת שְׁלֹמֹה
  choice: bis Salomo … gebaut hatte
  rationale: Der Infinitiv mit עַד bezeichnet den zeitlichen Endpunkt. Das deutsche Plusquamperfekt fügt sich natürlich in die vergangene Erzählung ein.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: „Haus“ bewahrt die konkrete hebräische Benennung, während „Jahwe“ den Gottesnamen und nicht einen ersetzenden Titel wiedergibt.
- source_word: וַיַּעַמְדוּ כְמִשְׁפָּטָם עַל עֲבוֹדָתָם
  choice: Sie nahmen ihren Dienst nach der für sie geltenden Ordnung wahr
  rationale: Die Formulierung gibt die feste Aufstellung beziehungsweise Dienstordnung idiomatisch wieder. כְמִשְׁפָּטָם bezeichnet die für sie festgelegte Regelung, nicht ein gerichtliches Urteil.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen; die traditionelle Ersetzung durch einen Titel wird nicht in den Haupttext übernommen.
- issue: Verhältnis von מִשְׁכָּן und אֹהֶל מוֹעֵד
  choice: 'appositionell: „die Wohnung, das Zelt der Begegnung“'
  alternative: 'zusammengezogen: „die Stiftshütte“'
  rationale: Die appositionelle Wiedergabe bewahrt beide Begriffe des Ausgangstextes und legt ihr Verhältnis nicht weiter aus, als es der Satz verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kultische Fachsprache wird verständlich gehalten; der traditionelle Ausdruck „Stiftshütte“ erscheint als Fußnotenalternative. Der letzte Satz wird idiomatisch formuliert, während die wörtlichere Bewegungs- beziehungsweise Aufstellungsnuance in der Fußnote erhalten bleibt.
