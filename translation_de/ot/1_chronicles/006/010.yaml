  text: 'And the sons of Elkanah: Amasai and Ahimoth[a].'
translation:
  language: de
  text: 'Und die Söhne Elkanas: Amasai und Ahimot.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Und die Söhne
  rationale: Die Konjunktion ו wird als „Und“ wiedergegeben, um die fortlaufende genealogische Aufzählung zu bewahren; בְנֵי im Status constructus bedeutet hier natürlich „Söhne“.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form „Elkana“ wiedergegeben.
- source_word: עֲמָשַׂי
  choice: Amasai
  rationale: Der Personenname wird entsprechend der hebräischen Form und der gängigen deutschen Bibeltradition als „Amasai“ transliteriert.
- source_word: וַ/אֲחִימוֹת
  choice: und Ahimot
  rationale: Die vorangestellte Konjunktion wird mit „und“ übersetzt; der Personenname wird in der gebräuchlichen deutschen Form „Ahimot“ wiedergegeben.
theological_decisions: []
