source:
  edition: WLC
  text: וְ/אֵ֗לֶּה אֲשֶׁ֨ר הֶעֱמִ֥יד דָּוִ֛יד עַל יְדֵי שִׁ֖יר בֵּ֣ית יְהוָ֑ה מִ/מְּנ֖וֹחַ הָ/אָרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/016.yaml
  text: These are the men whom David appointed over the service of song in the house of Yahweh[b][a], after the ark came to rest.
translation:
  language: de
  text: Und dies sind diejenigen, die David für den Gesang[a] im Haus Yahwehs einsetzte, nachdem die Lade zur Ruhe gekommen war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für den Gesangsdienst“ oder „als Verantwortliche für den Gesang“. Die hebräische Wendung bezeichnet wahrscheinlich die Zuständigkeit für den gottesdienstlichen Gesang.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vom Ruhen der Lade an“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind die
  rationale: Die Wendung leitet die folgende Namensliste ein. Das וְ wird als „Und“ wiedergegeben, und „die“ bezeichnet ohne unnötige Ergänzung die anschließend genannten Personen.
- source_word: הֶעֱמִיד דָּוִיד
  choice: die David … betraute
  rationale: Der Hifil von עמד bezeichnet hier nicht bloß räumliches Aufstellen, sondern die Einsetzung in eine Aufgabe. „Mit … betraute“ klingt im Deutschen natürlich und bewahrt den administrativen Sinn.
- source_word: עַל יְדֵי שִׁיר
  choice: mit der Leitung des Gesangs
  rationale: Die ungewöhnliche Verbindung bezeichnet wahrscheinlich die Zuständigkeit für den Gesang. Die Formulierung wahrt sowohl den Verantwortungsaspekt als auch die musikalische Funktion.
- source_word: בֵּית יְהוָה
  choice: im Haus Yahwehs
  rationale: „Haus“ gibt בַּיִת unmittelbar wieder und vermeidet die interpretierende Festlegung auf „Tempel“. Der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: מִמְּנוֹחַ הָאָרוֹן
  choice: nachdem die Lade zur Ruhe gekommen war
  rationale: Die Präposition מִן mit מְנוֹחַ markiert hier den zeitlichen Ausgangspunkt vom Ruhen beziehungsweise festen Aufstellen der Lade an. Die gewählte Fassung ist idiomatisches Deutsch.
- source_word: הָאָרוֹן
  choice: die Lade
  rationale: Der Ausgangstext sagt lediglich „die Lade“; „Bundeslade“ würde eine im Kontext zutreffende, aber hier nicht ausdrücklich genannte Bestimmung ergänzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Yahweh“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des Ruhens der Lade
  choice: zur Ruhe gekommen war
  alternative: ihren Ruheplatz gefunden hatte
  rationale: Die Formulierung bewahrt das Bild von מְנוֹחַ, ohne ausdrücklich festzulegen, ob vor allem das Ende des Transports oder die dauerhafte Aufstellung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax bleibt nahe am Hebräischen, wird aber durch „mit der Leitung … betraute“ idiomatisch gestaltet. „Haus Yahwehs“ bewahrt die konkrete Ausdrucksweise des Ausgangstextes; „Gottesdienst“ wird nur erläuternd in der Fußnote verwendet.
