revisions:
- from: Und dies sind die, die David mit der Leitung des Gesangs[a] im Haus Yahwehs betraute, nachdem die Lade zur Ruhe gekommen war.[b]
  to: Und dies sind diejenigen, die David für den Gesang[a] im Haus Yahwehs einsetzte, nachdem die Lade zur Ruhe gekommen war.[b]
  rationale: Die Revision ersetzt die stärker interpretierende „Leitung des Gesangs“ durch die offenere und quellennahe Formulierung „für den Gesang“. Zugleich wird die einleitende Relativkonstruktion idiomatischer gefasst. Der zeitliche Bezug, die Bezeichnung der Lade und die Wiedergabe des Gottesnamens bleiben erhalten.
