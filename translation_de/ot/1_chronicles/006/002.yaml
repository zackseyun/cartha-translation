lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Die Verbindung aus Konjunktion und Demonstrativpronomen leitet die Namensliste ein. „Und dies sind“ bewahrt den fortlaufenden genealogischen Zusammenhang und klingt im Deutschen würdig und verständlich.
- source_word: שְׁמוֹת
  choice: die Namen
  rationale: In der Konstruktverbindung שְׁמוֹת בְּנֵי entspricht „die Namen der Söhne“ natürlichem modernem Deutsch.
- source_word: בְּנֵי
  choice: der Söhne
  rationale: Hier werden zwei unmittelbar als Söhne Gerschoms aufgeführte Personen genannt; daher ist „Söhne“ genauer als das weiter gefasste „Nachkommen“.
- source_word: גֵרְשׁוֹם
  choice: Gerschom
  rationale: Der Personenname wird entsprechend der hebräischen Form גֵרְשׁוֹם in einer geläufigen deutschen Umschrift wiedergegeben.
- source_word: לִבְנִי
  choice: Libni
  rationale: Der Personenname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: וְשִׁמְעִי
  choice: und Schimi
  rationale: Die vorangestellte Konjunktion verbindet den zweiten Namen mit dem ersten; שִׁמְעִי wird in geläufiger deutscher Umschrift als „Schimi“ wiedergegeben.
