lexical_decisions:
- source_word: בֶּן
  choice: Sohn
  rationale: Die wiederholte genealogische Konstruktverbindung wird direkt mit „Sohn“ wiedergegeben. Obwohl בֶּן in Stammbäumen mitunter auch einen entfernteren Nachkommen bezeichnen kann, verlangt der unmittelbare Zusammenhang hier keine allgemeinere Wiedergabe.
- source_word: יִצְהָר
  choice: Jizhar
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform transliteriert.
- source_word: קְהָת
  choice: Kehat
  rationale: Der Personenname wird in der etablierten deutschen biblischen Form wiedergegeben.
- source_word: לֵוִי
  choice: Levi
  rationale: Der Eigenname wird in seiner geläufigen deutschen Form beibehalten.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Text nennt ausdrücklich Israel und nicht Jakob; deshalb bleibt der Quellname im Haupttext erhalten.
theological_decisions:
- issue: Identität Israels in der Stammbaumformel
  choice: „Israel“ bleibt im Haupttext stehen; eine Fußnote identifiziert ihn als Jakob.
  alternative: Im Haupttext „Jakob“ schreiben.
  rationale: Die Wiedergabe bewahrt den tatsächlichen Wortlaut יִשְׂרָאֵל, während die Fußnote modernen Lesern die genealogische Identität erläutert, ohne die Namenswahl des hebräischen Textes zu ersetzen.
