- source_word: בְנ/וֹ
  choice: sein Sohn
  rationale: בֵּן mit dem Suffix der 3. Person Singular maskulin bedeutet wörtlich „sein Sohn“. Die Wiederholung bildet die knappe genealogische Abfolge des hebräischen Textes ab.
- source_word: עֻזִּי
  choice: Usi
  rationale: Der Personenname wird in einer im Deutschen üblichen, gut lesbaren Form wiedergegeben; das hebräische Zajin erscheint dabei als „s“.
- source_word: זְרַחְיָה
  choice: Serachja
  rationale: Der theophore Personenname wird nach verbreiteter deutscher Transliteration wiedergegeben; „-ja“ entspricht dem Namenselement יָה.
