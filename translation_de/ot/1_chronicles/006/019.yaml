lexical_decisions:
- source_word: בֶּן
  choice: Sohn
  rationale: In der genealogischen Reihe bezeichnet בֶּן die unmittelbare oder weitere Abstammung. Die formale Wiedergabe „Sohn“ bewahrt den knappen, wiederholenden Stil des hebräischen Textes.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition als „Elkana“ transkribiert; nach „Sohn“ steht der Genitiv „Elkanas“.
- source_word: יְרֹחָם
  choice: Jeroham
  rationale: Der Personenname wird in geläufiger deutscher Form als „Jeroham“ wiedergegeben; im Text steht der Genitiv „Jerohams“.
- source_word: אֱלִיאֵל
  choice: Eliël
  rationale: „Eliël“ gibt die hebräische Namensform wieder; das Trema macht im Deutschen die getrennte Aussprache der Vokale kenntlich. Im Text steht der Genitiv „Eliëls“.
- source_word: תּוֹחַ
  choice: Toach
  rationale: „Toach“ folgt der masoretischen Form תּוֹחַ und gibt den Schlusslaut ח in geläufiger deutscher Umschrift mit „ch“ wieder; im Text steht der Genitiv „Toachs“.
theological_decisions: []
translation_notes:
  register: Knapper, würdiger genealogischer Listenstil. Die wiederholte Genitivkonstruktion „Sohn …“ bildet die hebräische Reihung natürlich im modernen Standarddeutsch ab. Beide überlieferten Fußnoten beziehen sich inhaltlich auf תּוֹחַ und stehen deshalb nach „Toachs“, nicht bei den zuvor genannten Namen.
