  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת עָרֵ֧י הַ/מִּקְלָ֛ט אֶת שְׁכֶ֥ם וְ/אֶת מִגְרָשֶׁ֖י/הָ בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת גֶּ֖זֶר וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/052.yaml
  text: 'They gave them the cities of refuge: Shechem with its pasturelands in the hill country of Ephraim[a], and Gezer with its pasturelands.'
translation:
  language: de
  text: 'Sie gaben ihnen die Zufluchtsstädte: Sichem mit seinem Weideland im Bergland von Ephraim[a] und Geser mit seinem Weideland.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die Zufluchtsstädte: Sichem und sein Weideland im Bergland von Ephraim sowie Geser und sein Weideland“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Sie gaben
  rationale: Das Wayyiqtol von נתן führt die folgende Erzählhandlung fort. Im modernen Deutschen kann die einleitende Konjunktion unausgedrückt bleiben.
- source_word: לָהֶם
  choice: ihnen
  rationale: Das Pronomen verweist auf die im weiteren Zusammenhang genannten Empfänger.
- source_word: עָרֵי הַמִּקְלָט
  choice: die Zufluchtsstädte
  rationale: Dies ist die geläufige und verständliche Wiedergabe des Fachbegriffs für die als Zufluchtsorte bestimmten Städte.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Der Ortsname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: מִגְרָשֶׁיהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das einer Stadt zugehörige offene Umland, besonders zur Viehweide. Der Singular „Weideland“ ist im Deutschen natürlich und bewahrt den sachlichen Sinn.
- source_word: בְּהַר אֶפְרָיִם
  choice: im Bergland von Ephraim
  rationale: Die Wendung bezeichnet das mit Ephraim verbundene Hochland, nicht einen einzelnen Berg.
- source_word: גֶּזֶר
  choice: Geser
  rationale: Der Ortsname wird in der etablierten deutschen biblischen Schreibweise wiedergegeben.
- source_word: וְאֶת ... וְאֶת
  choice: und ... mit
  rationale: Die wiederholten Konjunktionen und Akkusativmarker werden in natürlicher deutscher Syntax so gefasst, dass jede Stadt mit ihrem Weideland verbunden ist.
