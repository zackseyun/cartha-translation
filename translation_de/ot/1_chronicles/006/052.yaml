  source_fidelity: 'Der deutsche Text gibt alle Satzglieder des Hebräischen sachgerecht wieder: die Gabe an die zuvor genannten Empfänger, die technische Bezeichnung „Zufluchtsstädte“, Sichem samt zugehörigem Weideland im Bergland Ephraims sowie Geser samt Weideland. Die glättende Verbindung mit „mit“ ist im Deutschen idiomatisch und verändert die Zuordnung nicht.'
