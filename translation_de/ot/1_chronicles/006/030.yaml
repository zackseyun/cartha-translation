lexical_decisions:
- source_word: בֶּן
  choice: Sohn
  rationale: In dieser fortlaufenden Geschlechtslinie bezeichnet בֶּן die unmittelbare oder genealogische Abstammung. Die knappe Wiederholung „Sohn …, Sohn …“ bewahrt die Form des hebräischen Listenstils und schließt natürlich an den vorausgehenden Vers an.
- source_word: חֲשַׁבְיָה
  choice: Haschabja
  rationale: Der Personenname wird nach gebräuchlichen deutschen Bibelkonventionen wiedergegeben; die Endung -ja spiegelt den Gottesnamenbestandteil des Hebräischen wider.
- source_word: אֲמַצְיָה
  choice: Amazja
  rationale: Der hebräische Personenname wird in seiner etablierten deutschen Bibelform wiedergegeben.
- source_word: חִלְקִיָּה
  choice: Hilkija
  rationale: Der hebräische Personenname wird in der geläufigen deutschen Bibelform wiedergegeben und bleibt dadurch wiedererkennbar.
