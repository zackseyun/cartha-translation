  text: and Hilen with its pasturelands[a], Debir with its pasturelands.
translation:
  language: de
  text: und Hilen mit seinen Weideflächen[a], Debir mit seinen Weideflächen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname „Hilen“ entspricht der hebräischen Form in der Chronik. In der parallelen Liste in Josua 21,15 steht „Holon“.
