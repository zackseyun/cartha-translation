lexical_decisions:
- source_word: חִילֵז
  choice: Hilen
  rationale: Der Ortsname wird gemäß der masoretischen Form in der Chronik transliteriert. Obwohl der letzte Konsonant im vorliegenden WLC-Text als ז erscheint, stützt die Punktierung und Texttradition die Wiedergabe „Hilen“; die Parallelstelle Josua 21,15 liest „Holon“.
- source_word: מִגְרָשֶׁיהָ
  choice: seinen Weideflächen
  rationale: מִגְרָשׁ bezeichnet das offene, einer Stadt zugehörige Umland, besonders als Weideland. „Weideflächen“ ist im Deutschen verständlich und passt zur Funktion dieser Flächen bei den Levitenstädten.
- source_word: דְּבִיר
  choice: Debir
  rationale: Der Ortsname wird nach gebräuchlicher deutscher Form transliteriert.
- source_word: וְאֶת / אֶת
  choice: und / nicht eigens wiedergegeben
  rationale: Die Akkusativpartikel אֶת besitzt keine unmittelbare deutsche Entsprechung. Das einleitende וְ wird in der fortlaufenden Aufzählung mit „und“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Natürliche, knappe Listenform in modernem Standarddeutsch. „Weideflächen“ ist allgemein verständlich und zugleich für das Umland einer Levitenstadt sachgerecht.
