    issue: Unklare syntaktische Anbindung von „für die Söhne Aarons“
    rationale: Im Entwurf kann die Präpositionalgruppe nach „Gebiet“ nicht ohne Weiteres an „Wohnorte“ angeschlossen werden. Die Zugehörigkeit der Wohnorte zu den Söhnen Aarons sollte explizit und natürlich formuliert sein.
  - severity: low
    issue: „nach ihren Siedlungen“ ist im Deutschen semantisch und stilistisch sperrig
    rationale: Die hebräische Präposition kann hier den Bezug auf die jeweiligen Siedlungen markieren. „in ihren Siedlungen“ gibt diesen Ortsbezug idiomatisch wieder; die lexikalische Unsicherheit von טִירָה wird in der Fußnote bewahrt.
