base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/039.yaml
  text: These were their dwelling places according to their settlements within their territory[a], for the sons of Aaron, of the family of the Kohathites; for the lot was theirs.
translation:
  language: de
  text: Dies waren die Wohnorte der Söhne Aarons aus der Sippe der Kehatiter in ihren Siedlungen innerhalb ihres Gebiets[a]; denn ihnen gehörte das Los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei ihren Lagerplätzen« oder »in ihren Dörfern«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשְׁבוֹתָם
  choice: ihre Wohnorte
  rationale: Das Substantiv bezeichnet Orte des Wohnens oder Aufenthalts. »Wohnorte« ist im modernen Deutschen natürlich und konkret.
- source_word: לְטִירוֹתָם
  choice: nach ihren Siedlungen
  rationale: טִירָה kann eine Siedlung, ein Lager oder ein umfriedetes Dorf bezeichnen. »Siedlungen« passt zum Kontext der Gebietszuweisung, ohne die Art der Orte zu eng festzulegen.
- source_word: בִּגְבוּלָם
  choice: in ihrem Gebiet
  rationale: גְּבוּל kann Grenze oder das von ihr umschlossene Gebiet bedeuten. Hier ist wegen der zugewiesenen Wohnorte der territoriale Sinn gemeint.
- source_word: לִבְנֵי אַהֲרֹן
  choice: für die Söhne Aarons
  rationale: Die direkte Wiedergabe erhält die biblische Familien- und Priesterbezeichnung, ohne sie ausdrücklich als »Nachkommen« auszudeuten.
- source_word: לְמִשְׁפַּחַת הַקְּהָתִי
  choice: aus der Sippe der Kehatiter
  rationale: מִשְׁפָּחָה bezeichnet hier den genealogischen Sippenverband. Die deutsche Formulierung macht die Zugehörigkeit der Söhne Aarons zu den Kehatitern verständlich.
- source_word: כִּי לָהֶם הָיָה הַגּוֹרָל
  choice: denn ihnen gehörte das Los
  rationale: Die Formulierung gibt die hebräische Besitzkonstruktion direkt wieder und bewahrt zugleich das Bild der Zuweisung durch das Los.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Aufzählungsstil; das Semikolon trennt die Ortsangabe von der Begründung. »Sippe« ist hier präziser und geläufiger als das allgemeinere »Familie«.
