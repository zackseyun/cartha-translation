base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/065.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead with its pasturelands[a], and Mahanaim with its pasturelands.'
translation:
  language: de
  text: 'Und vom Stamm Gad: Ramot in Gilead mit seinen Weideflächen und Mahanajim mit seinen Weideflächen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: Und vom Stamm
  rationale: מַטֶּה bezeichnet im Zusammenhang der Landzuteilung einen Stamm; die vorangestellten Konjunktion und Präposition werden natürlich mit „Und vom“ wiedergegeben.
- source_word: גָד
  choice: Gad
  rationale: Der Eigenname des Stammes wird nach üblicher deutscher Form wiedergegeben.
- source_word: רָאמוֹת בַּגִּלְעָד
  choice: Ramot in Gilead
  rationale: Die Wiedergabe erhält die hebräische Präposition בְּ und bezeichnet Ramot als einen Ort in Gilead.
- source_word: מִגְרָשֶׁיהָ
  choice: mit seinen Weideflächen
  rationale: מִגְרָשׁ bezeichnet das offene Weide- und Nutzland, das zu einer Levitenstadt gehörte; das Suffix bezieht sich jeweils auf die Stadt.
- source_word: מַחֲנַיִם
  choice: Mahanajim
  rationale: Der Ortsname wird in einer im Deutschen geläufigen, dem Hebräischen nahen Form transliteriert.
- source_word: וְאֶת
  choice: und
  rationale: Der wiederholte Akkusativmarker mit Konjunktion gliedert die Aufzählung und wird im Deutschen natürlich durch „und“ ausgedrückt.
