  rationale: Der hebräische Personenname wird in der im Deutschen üblichen biblischen Form „Simma“ wiedergegeben; eine mögliche lexikalische Bedeutung der zugrunde liegenden Wurzel ist hier nicht maßgeblich.
- source_word: שִׁמְעִי
  choice: Schimi
  rationale: Der Personenname wird gemäß der etablierten deutschen biblischen Namensform als „Schimi“ wiedergegeben.
