lexical_decisions:
- source_word: חוּקֹק
  choice: Hukok
  rationale: Der masoretische Text nennt hier den Ortsnamen Hukok; er wird nach den üblichen deutschen Umschriftkonventionen wiedergegeben. Die abweichende Parallele in Josua 21,31 wird in einer Fußnote dokumentiert.
- source_word: מִגְרָשֶׁיהָ
  choice: seinem Weideland
  rationale: Das Wort bezeichnet das zu einer Stadt gehörende offene Umland, das besonders als Weidefläche diente. Der deutsche Singular »Weideland« ist hier natürlich und sachlich präzise.
- source_word: רְחֹב
  choice: Rehob
  rationale: Der Ortsname wird in seiner etablierten deutschen Form transliteriert.
- source_word: וְאֶת
  choice: und … mit
  rationale: Das wiederholte וְ mit dem Akkusativmarker אֶת gliedert die Aufzählung; im Deutschen wird die Zuordnung des Weidelands idiomatisch mit »mit« ausgedrückt.
