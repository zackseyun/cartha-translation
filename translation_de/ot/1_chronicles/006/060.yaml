  text: and Hukok with its pasturelands[a], and Rehob with its pasturelands.
translation:
  language: de
  text: und Hukok mit seinem Weideland[a] und Rehob mit seinem Weideland.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text hat hier »Hukok«; in der parallelen Liste in Josua 21,31 steht »Helkat«.
