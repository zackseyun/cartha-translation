  text: וְ/אָחִ֣י/ו אָסָ֔ף הָ/עֹמֵ֖ד עַל יְמִינ֑/וֹ אָסָ֥ף בֶּן בֶּרֶכְיָ֖הוּ בֶּן שִׁמְעָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/024.yaml
  text: 'And his brother Asaph stood at his right hand: Asaph son of Berechiah[a], son of Shimea.'
translation:
  language: de
  text: 'Und sein Bruder Asaf stand zu seiner Rechten[a]: Asaf, der Sohn Berechjas, des Sohnes Schimas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an seiner rechten Seite«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָחִיו
  choice: Und sein Bruder
  rationale: Die einfache Konjunktion וְ wird mit »und« wiedergegeben; אָח mit Suffix der 3. Person Singular bedeutet hier am natürlichsten »sein Bruder«. Der weitere Sinn »Verwandter« ist möglich, wird vom Kontext aber nicht erzwungen.
- source_word: אָסָף
  choice: Asaf
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben. Seine zweimalige Nennung im hebräischen Text bleibt erhalten.
- source_word: הָעֹמֵד
  choice: stand
  rationale: Das Qal-Partizip bezeichnet eine stehende beziehungsweise zugewiesene Position. Die finite Form »stand« ist im Deutschen natürlich und bewahrt den beschreibenden Sinn.
- source_word: עַל יְמִינוֹ
  choice: zu seiner Rechten
  rationale: Die Wendung bezeichnet die Position an der rechten Seite einer Person. »Zu seiner Rechten« ist eine natürliche, würdevolle und räumlich genaue deutsche Wiedergabe.
- source_word: בֶּן
  choice: Sohn
  rationale: Die zweimalige genealogische Formel wird als »Sohn …, des Sohnes …« wiedergegeben und bildet so die hebräische Abstammungsfolge klar ab.
- source_word: בֶּרֶכְיָהוּ
  choice: Berechja
  rationale: Übliche deutsche Form des hebräischen Personennamens.
- source_word: שִׁמְעָא
  choice: Schima
  rationale: Der hebräische Personenname wird in einer gebräuchlichen deutschen Bibelnamenform wiedergegeben.
