translation:
  language: de
  text: 'und vom Stamm Benjamin: Geba mit seinen Weideflächen, Alemet[a] mit seinen Weideflächen und Anatot mit seinen Weideflächen. Alle ihre Städte nach ihren Sippen: dreizehn Städte.'
