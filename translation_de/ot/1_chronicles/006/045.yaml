lexical_decisions:
- source_word: וּמִמַּטֵּה בִנְיָמִן
  choice: und vom Stamm Benjamin
  rationale: מַטֶּה bezeichnet hier im Zusammenhang der Landzuteilung einen Stamm. Die vorangestellten Partikeln führen die Aufzählung aus dem vorigen Vers mit „und vom“ fort.
- source_word: גֶּבַע
  choice: Geba
  rationale: Der Ortsname wird nach geläufiger deutscher Transkription wiedergegeben.
- source_word: מִגְרָשֶׁיהָ
  choice: mit seinen Weideflächen
  rationale: מִגְרָשׁ bezeichnet das offene, gemeinschaftlich nutzbare Weideland rings um eine Stadt. Der deutsche Plural „Weideflächen“ entspricht hier der hebräischen Form und ist verständlich.
- source_word: עָלֶמֶת
  choice: Alemet
  rationale: Der Ortsname wird entsprechend der Form des masoretischen Textes wiedergegeben; die abweichende Namensform der Parallelliste wird in einer Fußnote genannt.
- source_word: עֲנָתוֹת
  choice: Anatot
  rationale: Der Ortsname wird in einer im Deutschen geläufigen, am Hebräischen orientierten Form transkribiert.
- source_word: כָּל עָרֵיהֶם שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: Insgesamt waren es dreizehn Städte
  rationale: Die zusammenfassende hebräische Wendung wird idiomatisch wiedergegeben. „Insgesamt“ vermittelt die Funktion von כָּל עָרֵיהֶם, ohne das unbeholfene „alle ihre Städte waren“ nachzubilden.
- source_word: בְּמִשְׁפְּחוֹתֵיהֶם
  choice: ihren Sippen entsprechend
  rationale: מִשְׁפָּחוֹת bezeichnet hier größere Familienverbände beziehungsweise Sippen. Die Formulierung bewahrt den Gedanken einer Zuordnung nach diesen Gruppen.
