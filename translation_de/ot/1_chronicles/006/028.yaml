  language: de
  text: Sohn Jahats[a], Sohn Gerschoms[b], Sohn Levis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im weiteren genealogischen Sinn: »Nachkomme Jahats … Nachkomme Gerschoms … Nachkomme Levis.«'
