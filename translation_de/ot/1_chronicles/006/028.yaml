  - marker: b
    text: Im Hebräischen steht »Gerschom«; in anderen genealogischen Zusammenhängen kommt die ähnliche Namensform »Gerschon« vor, doch hier hat der Ausgangstext ausdrücklich »Gerschom«.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: Sohn
  rationale: In dieser knappen Genealogie bezeichnet בֶּן am natürlichsten den Sohn. Da biblische Geschlechtsregister Generationen bisweilen überspringen, wird die weitere Bedeutung »Nachkomme« in einer Fußnote genannt.
- source_word: יַחַת
  choice: Jahat
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form »Jahat« wiedergegeben.
- source_word: גֵּרְשֹׁם
  choice: Gerschom
  rationale: Die hebräische Form lautet ausdrücklich גֵּרְשֹׁם und wird daher als »Gerschom« wiedergegeben, nicht an das andernorts vorkommende »Gerschon« angeglichen.
- source_word: לֵוִי
  choice: Levi
  rationale: Der Personenname wird in seiner etablierten deutschen Form »Levi« wiedergegeben.
