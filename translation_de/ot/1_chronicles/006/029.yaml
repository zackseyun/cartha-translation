base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/029.yaml
  text: 'And the sons of Merari[a], their brothers, were on the left: Ethan son of Kishi, son of Abdi, son of Malluch.'
translation:
  language: de
  text: 'Und die Söhne Meraris, ihre Brüder[a], standen auf der linken Seite: Etan, Sohn Kischis, Sohn Abdis, Sohn Malluchs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Verwandten“; das hebräische Wort für „Brüder“ kann in genealogischen Zusammenhängen auch Sippenangehörige im weiteren Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מְרָרִי
  choice: Und die Söhne Meraris
  rationale: Die wörtliche genealogische Formulierung wird bewahrt; „Söhne“ kann im Zusammenhang auch Nachkommen beziehungsweise Angehörige der meraritischen Linie bezeichnen.
- source_word: אֲחֵיהֶם
  choice: ihre Brüder
  rationale: Das hebräische Wort bezeichnet zunächst Brüder, kann in genealogischen und stammesbezogenen Zusammenhängen aber auch weitere Verwandte oder Sippenangehörige einschließen.
- source_word: עַל הַשְּׂמֹאול
  choice: standen zur Linken
  rationale: Der hebräische Ausdruck lautet wörtlich „auf/zu der Linken“. Das ergänzte Verb „standen“ gibt die im Kontext vorausgesetzte räumliche Anordnung natürlich wieder.
- source_word: אֵיתָן
  choice: Etan
  rationale: Wiedergabe des Eigennamens in einer im Deutschen gebräuchlichen biblischen Form.
- source_word: בֶּן
  choice: Sohn … / des Sohnes …
  rationale: Die genealogische Kette wird entsprechend der hebräischen בן-Formel ausdrücklich als Sohnschaft wiedergegeben.
- source_word: קִישִׁי
  choice: Kischi
  rationale: Lautnahe deutsche Umschrift des Eigennamens.
- source_word: עַבְדִּי
  choice: Abdi
  rationale: Lautnahe deutsche Umschrift des Eigennamens.
- source_word: מַלּוּךְ
  choice: Malluch
  rationale: Lautnahe deutsche Umschrift des Eigennamens.
