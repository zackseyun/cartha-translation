base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/047.yaml
  text: 'And to the sons of Gershom[a], according to their clans, from the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali[b], and from the tribe of Manasseh in Bashan: thirteen cities.'
translation:
  language: de
  text: Und den Söhnen Gerschoms[a] wurden nach ihren Sippen aus dem Stamm Issachar, aus dem Stamm Ascher, aus dem Stamm Naftali und aus dem Stamm Manasse in Baschan[b] dreizehn Städte zuteil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text schreibt den Sippennamen hier „Gerschom“; häufig wird er als „Gerschon“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: Einige Übersetzungen geben zur geografischen Einordnung „aus dem halben Stamm Manasse in Baschan“ wieder. „Halber Stamm“ steht in diesem Vers jedoch nicht ausdrücklich im Hebräischen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: Und die Söhne … erhielten
  rationale: Die hebräische Zuteilungsformel lautet wörtlich „und für die Söhne“. Das im Hebräischen aus dem Zusammenhang ergänzte Verb wird im Deutschen mit „erhielten“ ausgedrückt, damit der Satz natürlich und verständlich ist.
- source_word: גֵרְשׁוֹם
  choice: Gerschom
  rationale: Die Namensform des masoretischen Textes endet hier auf Mem und wird daher als „Gerschom“ wiedergegeben; die verbreitete Form „Gerschon“ wird in einer Fußnote genannt.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet in diesem Stammes- und Zuteilungskontext die Untergliederungen eines Stammes; „Sippen“ ist hier genauer als das allgemeinere „Familien“.
- source_word: מִמַּטֵּה
  choice: aus dem Stamm
  rationale: מַטֶּה bedeutet in diesem genealogischen und territorialen Zusammenhang „Stamm“. Die wiederholte Präposition bezeichnet die Herkunft der zugeteilten Städte.
- source_word: יִשָׂשכָר
  choice: Issachar
  rationale: Gebräuchliche deutsche Namensform des Stammes.
- source_word: אָשֵׁר
  choice: Ascher
  rationale: Gebräuchliche deutsche Namensform des Stammes.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Gebräuchliche moderne deutsche Umschrift des Stammesnamens.
- source_word: מְנַשֶּׁה בַּבָּשָׁן
  choice: Manasse in Baschan
  rationale: Der hebräische Text nennt schlicht „Manasse in Baschan“. Die sachlich naheliegende Präzisierung „der halbe Stamm Manasse“ wird nicht in den Haupttext aufgenommen, weil „halber Stamm“ in diesem Vers nicht ausdrücklich steht.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: dreizehn Städte
  rationale: Direkte und idiomatische Wiedergabe der hebräischen Kardinalzahlkonstruktion.
