lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Der Personenname wird nach der im Deutschen üblichen, dem Hebräischen nahen Form wiedergegeben.
- source_word: בְנוֹ
  choice: sein Sohn
  rationale: בֵּן mit Suffix der 3. Person maskulin Singular bezeichnet unmittelbar „sein Sohn“. Obwohl der Ausdruck in Stammbäumen gelegentlich auch einen Nachkommen meinen kann, wird die konkrete Sohnesbezeichnung nicht verallgemeinert.
- source_word: וְ
  choice: und
  rationale: Die einfache hebräische Konjunktion verbindet die aufeinanderfolgenden Glieder des Stammbaums.
- source_word: אֶבְיָסָף
  choice: Ebjasaf
  rationale: Die Form gibt die vorliegende hebräische Schreibung möglichst unmittelbar und in deutscher Umschrift wieder; die traditionell geläufigere Variante „Abiasaf“ wird in einer Fußnote genannt.
- source_word: אַסִּיר
  choice: Assir
  rationale: Der Personenname wird in einer dem Hebräischen entsprechenden deutschen Umschrift wiedergegeben.
