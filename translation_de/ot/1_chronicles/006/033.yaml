  source_fidelity: Der Entwurf gibt die Satzglieder und den administrativ-kultischen Sinn von נְתוּנִים zutreffend wieder. Die beiden Ausdrücke מִשְׁכָּן und בֵּית הָאֱלֹהִים sollen beide sichtbar bleiben. Die Konstruktion „Wohnzelt des Hauses Gottes“ legt jedoch im Deutschen eine kaum nachvollziehbare Besitzbeziehung nahe und bildet die im Hebräischen verdichtete, spannungsvolle Bezeichnung weniger klar ab.
  naturalness: „Für den gesamten Dienst“ und „eingesetzt“ sind modernes, würdiges Deutsch. Die appositionelle Wiedergabe „an der Zeltwohnung, dem Haus Gottes“ ist verständlicher und erhält dennoch beide hebräischen Bezeichnungen ohne Harmonisierung zu „Tempel“.
  terminology: „Leviten“, „Dienst“ und „Haus Gottes“ sind angemessen. „Zeltwohnung“ ist als moderne, transparente Wiedergabe von מִשְׁכָּן gegenüber dem missverständlicheren Kompositum „Wohnzelt des Hauses Gottes“ vorzuziehen. Die Fußnote sollte die wörtliche Formulierung als solche markieren, ohne „gegeben“ als idiomatische deutsche Alternative auszugeben.
  issues:
