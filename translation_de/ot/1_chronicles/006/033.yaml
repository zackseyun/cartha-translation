    issue: „Wohnzelt des Hauses Gottes“ ist im Deutschen semantisch und stilistisch schwer verständlich.
    rationale: Die Formulierung klingt, als besitze ein Haus ein Zelt. Der hebräische Ausdruck enthält zwar beide Begriffe, seine Verbindung kann aber im Deutschen klarer durch Apposition wiedergegeben werden, ohne einen der Begriffe auszulassen.
  - severity: low
    issue: Die Fußnote bezeichnet „waren gegeben“ pauschal als Alternative.
    rationale: Dies ist zwar die wörtliche Grundbedeutung von נְתוּנִים, aber kein idiomatisches deutsches Äquivalent in diesem Kontext. Die Anmerkung sollte ausdrücklich sagen, dass es sich um die wörtliche Wiedergabe handelt.
