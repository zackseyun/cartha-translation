base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/033.yaml
  text: And their brothers the Levites were appointed for all the service of the tabernacle of the house of God[a].
translation:
  language: de
  text: Und ihre Brüder, die Leviten, waren für den gesamten Dienst an der Zeltwohnung, dem Haus Gottes, eingesetzt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „waren gegeben“. Das hebräische Partizip bezeichnet hier, dass sie zum Dienst zugewiesen waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Und ihre Brüder
  rationale: Das Waw wird im fortlaufenden Listen- und Erzählzusammenhang mit „Und“ wiedergegeben. „Brüder“ bewahrt den hebräischen Verwandtschaftsbegriff, der hier auch Stammes- oder Sippenangehörige bezeichnen kann.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die übliche und präzise Bezeichnung für die Angehörigen des Stammes Levi.
- source_word: נְתוּנִים
  choice: waren … eingesetzt
  rationale: Das passive Partizip von נתן bedeutet wörtlich „gegeben“, bezeichnet hier aber die Zuweisung zu einem kultischen Dienst. „Eingesetzt“ gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: לְכָל עֲבוֹדַת
  choice: für den gesamten Dienst
  rationale: Die Präposition לְ bezeichnet hier den Bereich oder Zweck der Zuweisung; כָל umfasst die Gesamtheit der kultischen Aufgaben. „Dienst“ vermeidet das anachronistisch kirchlich klingende „Amt“.
- source_word: מִשְׁכַּן
  choice: Wohnzelt
  rationale: „Wohnzelt“ gibt den Grundgedanken von משכן als heiliger Wohnstätte Gottes wieder und ist für heutige Leser verständlicher als das traditionelle „Stiftshütte“, ohne den Ausdruck mit „Tempel“ gleichzusetzen.
- source_word: בֵּית הָאֱלֹהִים
  choice: Haus Gottes
  rationale: Die wörtliche Wiedergabe bewahrt den vom Text verwendeten Ausdruck und vermeidet eine vorschnelle Gleichsetzung mit „Tempel“.
theological_decisions:
- issue: Verhältnis von „Wohnzelt“ und „Haus Gottes“ im chronistischen Kontext
  choice: Beide Ausdrücke bleiben in der Formulierung „Wohnzelt des Hauses Gottes“ unterscheidbar erhalten.
  alternative: Die Verbindung zu „Tempel Gottes“ oder „Heiligtum Gottes“ zusammenziehen.
  rationale: Der hebräische Text enthält sowohl מִשְׁכַּן als auch בֵּית הָאֱלֹהִים. Die ungewohnte Verbindung wird nicht harmonisiert, damit die Spannung zwischen Zelt- und Hausbezeichnung sichtbar bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wohnzelt“ ist anschaulich und gegenwärtig verständlich; die bewusst ungewöhnliche Verbindung mit „Haus Gottes“ bewahrt die Form und Spannung des hebräischen Textes.
