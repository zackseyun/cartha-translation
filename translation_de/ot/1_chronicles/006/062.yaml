base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/062.yaml
  text: 'To the sons of Merari who remained[a], from the tribe of Zebulun: Rimmono and its pasturelands, Tabor and its pasturelands.'
translation:
  language: de
  text: Den übrigen Nachkommen Meraris wurden aus dem Stamm Sebulon Rimmono[a] mit seinem Weideland und Tabor mit seinem Weideland zugeteilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text lautet »Rimmono«; in der Parallelstelle Josua 21,35 steht »Dimna«.
    reason: textual_variant
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי הַנּוֹתָרִים
  choice: den übrigen Nachkommen Meraris
  rationale: בְּנֵי bezeichnet hier die zur Sippe Meraris gehörenden Nachkommen; הַנּוֹתָרִים meint die nach den zuvor genannten Zuteilungen noch übrige Gruppe.
- source_word: מִמַּטֵּה זְבוּלֻן
  choice: aus dem Stamm Sebulon
  rationale: מַטֶּה bezeichnet im Zusammenhang der Land- und Städtezuteilung einen israelitischen Stamm.
- source_word: רִמּוֹנוֹ
  choice: Rimmono
  rationale: Der masoretische Text bietet hier den Ortsnamen Rimmono; die abweichende Lesart der Parallelstelle wird in einer Fußnote genannt.
- source_word: מִגְרָשֶׁיהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das offene Nutz- und Weideland im Umfeld einer Levitenstadt. Der Singular ist im Deutschen hier natürlich und entspricht dem grammatischen Bezug auf die jeweilige Stadt.
- source_word: תָּבוֹר
  choice: Tabor
  rationale: Der Ortsname wird in seiner üblichen deutschen Form wiedergegeben; hier ist die Stadt dieses Namens gemeint.
