  text: and Kedemoth with its pasturelands[a], and Mephaath with its pasturelands.
translation:
  language: de
  text: und Kedemot mit seinem Weideland[a] und Mefaat mit seinem Weideland.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gemeindeland«. Das hebräische Wort bezeichnet das offene Land, das zu einer Stadt gehörte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵמוֹת
  choice: Kedemot
  rationale: Der Ortsname wird nach einer im Deutschen natürlichen, am Hebräischen orientierten Umschrift wiedergegeben.
- source_word: מִגְרָשֶׁיהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das zu einer Stadt gehörende offene Land, das besonders als Weidefläche diente. Der feminine Singularsuffix bezieht sich jeweils auf die Stadt; im Deutschen steht wegen des grammatisch sächlichen Ortsnamens »seinem«.
- source_word: מֵיפַעַת
  choice: Mefaat
  rationale: Der Ortsname wird nach einer im Deutschen verständlichen, am Hebräischen orientierten Umschrift wiedergegeben.
- source_word: וְאֶת ... וְאֶת
  choice: und ... und
  rationale: Die wiederholte Verbindung aus Konjunktion und Akkusativzeichen gliedert die Aufzählung der zugeteilten Städte samt ihrem Land; die additive Struktur wird natürlich mit »und« wiedergegeben.
