  source_fidelity: Der Entwurf gibt die beiden Ortsnamen und die jeweils zugehörigen מִגְרָשֶׁיהָ präzise wieder. Die Verbindung mit „mit“ bildet die in dieser Listenform gemeinte Zuordnung von Stadt und zugehörigem offenen Land idiomatisch ab. Die possessive Wiedergabe im Singular („seinem“) entspricht dem Suffix bei jedem einzelnen Ortsnamen.
