  text: וַ/יִּתְּנ֥וּ בְנֵי יִשְׂרָאֵ֖ל לַ/לְוִיִּ֑ם אֶת הֶ/עָרִ֖ים וְ/אֶת מִגְרְשֵׁי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/049.yaml
  text: And the sons of Israel gave to the Levites the cities and their pasturelands[a][b].
translation:
  language: de
  text: Und die Israeliten gaben den Leviten die Städte und die dazugehörigen Weideflächen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das zu ihnen gehörende Umland“ beziehungsweise „ihre Allmendeflächen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: gaben
  rationale: Das Qal-Wayyiqtol von נתן bezeichnet hier schlicht das Geben beziehungsweise Überlassen; „gaben“ entspricht dem Erzählstil und bewahrt die Grundbedeutung.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich „die Söhne Israels“; im heutigen Standarddeutsch bezeichnet „die Israeliten“ natürlich und präzise das Volk insgesamt, ohne die Referenz unnötig auf männliche Personen einzuengen.
- source_word: לַלְוִיִּם
  choice: den Leviten
  rationale: Die Präposition ל markiert die Empfänger; „den Leviten“ ist die geläufige und genaue deutsche Wiedergabe.
- source_word: הֶעָרִים
  choice: die Städte
  rationale: עָרִים kann Städte oder Ortschaften bezeichnen; „Städte“ entspricht der etablierten Bezeichnung für die Levitenstädte im Kontext.
- source_word: מִגְרְשֵׁיהֶם
  choice: die dazugehörigen Weideflächen
  rationale: מִגְרָשׁ bezeichnet das offene, einer Stadt zugeordnete Umland, das besonders als Weideland diente. „Dazugehörige Weideflächen“ macht sowohl die Zuordnung zu den Städten als auch die konkrete Nutzung verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die idiomatische Volksbezeichnung „Israeliten“ wird gegenüber dem im Deutschen missverständlicheren wörtlichen Ausdruck „Söhne Israels“ bevorzugt. Der Hauptsatz bleibt eng an der knappen hebräischen Struktur.
