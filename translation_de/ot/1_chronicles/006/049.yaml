  source_fidelity: 'Der Text gibt die hebräische Satzstruktur und alle Sinnträger zuverlässig wieder: וַיִּתְּנוּ als „gaben“, בְנֵי יִשְׂרָאֵל idiomatisch als „die Israeliten“, לַלְוִיִּם als Empfängerangabe, הֶעָרִים als „die Städte“ und מִגְרְשֵׁיהֶם als den Städten zugeordnete offene Land- bzw. Weideflächen. „Dazugehörigen“ verdeutlicht angemessen den possessiven Bezug der Endung „-יהם“, ohne einen im Hebräischen nicht vorhandenen Eigentumsmodus zu behaupten.'
