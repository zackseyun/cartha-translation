- source_word: מִגְרָשֶׁיהָ
  choice: seinem Weideland
  rationale: Der Ausdruck bezeichnet im Zusammenhang der Levitenstädte das zu einer Stadt gehörende offene Weide- beziehungsweise Gemeindeland. Der feminine Singularsuffix bezieht sich im Hebräischen auf die jeweilige Stadt; im Deutschen richtet sich das Pronomen grammatisch nach dem Ortsnamen.
- source_word: יַעְזֵיר
  choice: Jaser
  rationale: Ortsname; in einer im Deutschen geläufigen Form wiedergegeben.
- source_word: וְאֶת
  choice: und
  rationale: Die Konjunktion führt die Glieder der Aufzählung weiter; der hebräische Akkusativmarker wird im Deutschen nicht eigens wiedergegeben.
