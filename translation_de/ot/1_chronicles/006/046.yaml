translation_notes:
  register: Moderne, würdige Standardsprache. Die schwerfällige und wiederholende Stammesformel des Hebräischen bleibt im Haupttext erkennbar; die Ergänzung »wurden … gegeben« macht den im Hebräischen elliptischen Zuteilungssatz verständlich.
