base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/046.yaml
  text: And to the sons of Kohath[a] who remained, from the families of the tribe, from the half-tribe, the half of Manasseh, ten cities were given by lot.
translation:
  language: de
  text: Und den übrigen Söhnen Kehats wurden durch das Los zehn Städte aus der Sippe des Stammes, aus der Hälfte des Stammes Manasse, zugeteilt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »aus der Sippe des Stammes, aus der Hälfte des Stammes, der Hälfte Manasses«; die formelhafte hebräische Wendung bezieht sich auf die halbe Stammesgruppe Manasses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי קְהָת
  choice: Und den Söhnen Kehats
  rationale: Die genealogische Wendung »Söhne Kehats« wird beibehalten; die Präposition kennzeichnet die Empfänger der Zuteilung.
- source_word: הַנּוֹתָרִים
  choice: die übrig geblieben waren
  rationale: Das Partizip bezeichnet die nach den vorherigen Zuteilungen noch nicht berücksichtigten Kehatiter und bleibt als Relativsatz eng am hebräischen Ausdruck.
- source_word: מִמִּשְׁפַּחַת הַמַּטֶּה
  choice: aus der Sippe des Stammes
  rationale: מִשְׁפַּחַת steht formal im Singular und מַטֶּה bedeutet im Zusammenhang der Landverteilung »Stamm«. Die ungewöhnliche Formulierung wird nicht geglättet.
- source_word: מִמַּחֲצִית מַטֵּה חֲצִי מְנַשֶּׁה
  choice: aus dem halben Stamm, der Hälfte Manasses
  rationale: Die auffällige Wiederholung von »halb/Hälfte« wird als formelhafte, syntaktisch schwierige Wendung erhalten; gemeint ist der halbe Stamm Manasse.
- source_word: בַּגּוֹרָל
  choice: durch das Los
  rationale: Die Wendung bezeichnet die Zuteilung mittels Losentscheid.
- source_word: עָרִים עָשֶׂר
  choice: zehn Städte gegeben
  rationale: Der hebräische Versteil ist ohne ausdrückliches Verb; »gegeben« wird aus dem Zusammenhang der Zuteilung ergänzt. עָרִים wird in dieser Liste mit »Städte« wiedergegeben.
