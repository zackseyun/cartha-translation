    issue: Die Wendung »aus dem halben Stamm, der Hälfte Manasses« ist grammatisch und sachlich unpräzise.
    rationale: Das Hebräische enthält eine formelhafte Wiederholung um die halbe Stammesgruppe Manasses. Deutsch kann dies nicht mit »halber Stamm, Hälfte Manasses« nachbilden, da die Konstruktion keinen klaren Bezug hat. »aus der Hälfte des Stammes Manasse« gibt den referierten Stammesteil verständlich wieder; die Fußnote dokumentiert die hebräische Formel.
  revised_text: Und den übrigen Söhnen Kehats wurden durch das Los zehn Städte aus der Sippe des Stammes, aus der Hälfte des Stammes Manasse, zugeteilt.[a]
