  text: וַ/יִּתְּנ֣וּ בַ/גּוֹרָ֗ל מִ/מַּטֵּ֤ה בְנֵי יְהוּדָה֙ וּ/מִ/מַּטֵּ֣ה בְנֵי שִׁמְע֔וֹן וּ/מִ/מַּטֵּ֖ה בְּנֵ֣י בִנְיָמִ֑ן אֵ֚ת הֶ/עָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁר יִקְרְא֥וּ אֶתְ/הֶ֖ם בְּ/שֵׁמֽוֹת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/050.yaml
  text: They assigned by lot from the tribe of the sons of Judah[a], and from the tribe of the sons of Simeon, and from the tribe of the sons of Benjamin, these cities, which they called by name.
translation:
  language: de
  text: Durch das Los teilten sie aus dem Stamm der Nachkommen Judas, aus dem Stamm der Nachkommen Simeons und aus dem Stamm der Nachkommen Benjamins folgende Städte zu, die namentlich genannt werden:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die sie mit Namen nennen«. Die hebräische Formulierung leitet die namentliche Aufzählung ein, die im nächsten Vers beginnt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: teilten sie ... zu
  rationale: נתן bedeutet grundsätzlich »geben«; im Zusammenhang mit der Verteilung levitischer Städte bezeichnet »zuteilen« natürlich und präzise den administrativen Vorgang.
- source_word: בַגּוֹרָל
  choice: durch das Los
  rationale: Die Wendung bezeichnet das Losverfahren, durch das die Zuteilung bestimmt wurde; »durch das Los« wahrt den konkreten Sinn.
- source_word: מִמַּטֵּה
  choice: aus dem Stamm
  rationale: מַטֶּה bedeutet in diesem Zusammenhang »Stamm«; die Präposition מִן wird mit »aus« wiedergegeben.
- source_word: בְנֵי יְהוּדָה / בְנֵי שִׁמְעוֹן / בְּנֵי בִנְיָמִן
  choice: Nachkommen Judas / Simeons / Benjamins
  rationale: בְּנֵי heißt wörtlich »Söhne«, bezeichnet hier jedoch die Angehörigen beziehungsweise Nachkommen der jeweiligen Stammväter. »Nachkommen« ist im modernen Deutschen klar und erhält die genealogische Ausdrucksweise.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: folgende Städte
  rationale: Wörtlich heißt die Wendung »diese Städte«. Da unmittelbar die namentliche Aufzählung folgt, ist »folgende Städte« im Deutschen die natürliche deiktische Entsprechung.
- source_word: אֲשֶׁר יִקְרְאוּ אֶתְהֶם בְּשֵׁמוֹת
  choice: die namentlich genannt werden
  rationale: Die etwas formelhafte hebräische Wendung verwendet קרא (»rufen/nennen«) mit »nach Namen« und leitet die anschließende Namensliste ein. Die Übersetzung wahrt das Benennungsmotiv und ist zugleich idiomatisch.
