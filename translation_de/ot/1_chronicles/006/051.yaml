  yaml_path: translation/ot/1_chronicles/006/051.yaml
  text: And from the families of the sons of Kohath[b][a], the cities of their territory were from the tribe of Ephraim.
translation:
  language: de
  text: Und den Sippen der Söhne Kehats[a] fielen Städte ihres Gebiets[b] aus dem Stamm Ephraim zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Sippen der Nachkommen Kehats“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Grenzstädte“. Das hebräische Wort kann „Grenze“, „Grenzgebiet“ oder „Territorium“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמִּשְׁפְּחוֹת
  choice: Was die Sippen … betrifft
  rationale: Die hebräische Wendung eröffnet hier ein vorangestelltes Thema. Die deutsche Themenkonstruktion gibt diese Funktion natürlich wieder; מִשְׁפָּחוֹת bezeichnet verwandtschaftlich gegliederte Sippen oder Großfamilien.
- source_word: בְּנֵי קְהָת
  choice: die Söhne Kehats
  rationale: Die wörtliche genealogische Bezeichnung wird beibehalten; gemeint sein können Kehats Nachkommen, doch diese Auslegung wird nicht in den Haupttext eingetragen.
- source_word: וַיְהִי
  choice: stammten
  rationale: Das Verb היה dient in diesem Zuteilungssatz als einfache Zuordnung. „Stammten … aus“ ergibt zusammen mit מִן eine natürliche deutsche Formulierung.
- source_word: עָרֵי גְבוּלָם
  choice: die Städte ihres Gebiets
  rationale: גְּבוּל kann Grenze, Grenzgebiet oder Territorium bedeuten. Im Zusammenhang der Städteverteilung ist „Gebiet“ wahrscheinlich, während die alternative Deutung in der Fußnote erhalten bleibt.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: aus dem Stamm Ephraim
  rationale: מַטֶּה bezeichnet in diesem Zusammenhang einen israelitischen Stamm; מִן wird mit „aus“ wiedergegeben.
