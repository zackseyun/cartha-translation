  rationale: Der Personenname wird gemäß einer gebräuchlichen deutschen Transkription wiedergegeben; die vorangestellte Konjunktion wird durch die deutsche Aufzählungsstruktur aufgenommen.
- source_word: וְחֶבְרוֹן
