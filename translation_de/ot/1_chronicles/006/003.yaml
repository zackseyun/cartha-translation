  rationale: חֶבְרוֹן ist hier ein Personenname und wird in der etablierten deutschen Form „Hebron“ wiedergegeben.
- source_word: וְעֻזִּיאֵל
  choice: Usiël
  rationale: Der Personenname wird in einer deutschen Form wiedergegeben, die die getrennte Aussprache der Vokale durch Trema kenntlich macht; das ו erscheint als „und“ vor dem letzten Glied.
