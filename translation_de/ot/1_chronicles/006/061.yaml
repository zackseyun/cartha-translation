base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/061.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee with its pasturelands[a], Hammon with its pasturelands, and Kiriathaim with its pasturelands.'
translation:
  language: de
  text: 'Und vom Stamm Naftali: Kedesch in Galiläa mit seinen Weideflächen[a], Hammon mit seinen Weideflächen und Kirjatajim mit seinen Weideflächen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit seinem Umland“. Das hebräische Wort bezeichnet die offenen Flächen, die zu der jeweiligen Stadt gehörten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  choice: Und vom Stamm Naftali
  rationale: מַטֶּה bezeichnet im Zusammenhang der Landzuteilung einen Stamm; Konjunktion und Präposition werden natürlich mit „Und vom“ wiedergegeben.
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: Kedesch in Galiläa
  rationale: Der Ortsname wird nach gängiger deutscher Bibeltradition als „Kedesch“ wiedergegeben; בַּגָּלִיל ist eine regionale Bestimmung und bedeutet „in Galiläa“.
- source_word: מִגְרָשֶׁיהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das offene, zu einer Stadt gehörende Umland, besonders die Weidefläche levitischer Städte. Der feminine Singularsuffix bezieht sich jeweils auf die Stadt; im Deutschen steht wegen des grammatischen Geschlechts von „Kedesch/Hammon/Kirjatajim“ idiomatisch „seinem“.
- source_word: חַמּוֹן
  choice: Hammon
  rationale: Der Ortsname wird unmittelbar aus der hebräischen Konsonantenform übertragen.
- source_word: קִרְיָתַיִם
  choice: Kirjatajim
  rationale: Die Form gibt den hebräischen Ortsnamen in einer für deutsche Leser verständlichen, bibelsprachlich etablierten Umschrift wieder.
