  text: וּ/מִֽ/מַּחֲצִית֙ מַטֵּ֣ה מְנַשֶּׁ֔ה אֶת עָנֵר֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת בִּלְעָ֖ם וְ/אֶת מִגְרָשֶׁ֑י/הָ לְ/מִשְׁפַּ֥חַת לִ/בְנֵי קְהָ֖ת הַ/נּוֹתָרִֽים־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/055.yaml
  text: 'And from the half-tribe of Manasseh: Aner with its pasturelands[a], and Bileam with its pasturelands, for the clan of the remaining sons of Kohath.'
translation:
  language: de
  text: 'Und vom halben Stamm Manasse: Aner samt seinen Weideflächen und Bileam[a] samt seinen Weideflächen für die Sippe der übrigen Söhne Kehats.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Bileam; in der Parallelstelle Josua 21,25 steht Jibleam.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה מְנַשֶּׁה
  choice: Und vom halben Stamm Manasse
  rationale: מַחֲצִית bezeichnet eine Hälfte und מַטֶּה hier einen Stamm. Die Formulierung gibt die territoriale Hälfte des Stammes Manasse natürlich und eng am Hebräischen wieder.
- source_word: עָנֵר
  choice: Aner
  rationale: Der Ortsname wird gemäß seiner hebräischen Form transliteriert.
- source_word: מִגְרָשֶׁיהָ
  choice: samt seinen Weideflächen
  rationale: מִגְרָשׁ bezeichnet das offene, zur Stadt gehörende Land, das besonders bei den Levitenstädten als Weideland diente. Das Possessivpronomen bezieht sich im Deutschen auf den grammatisch maskulinen Ortsnamen.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Der masoretische Text liest hier בִּלְעָם. Die abweichende Namensform der Parallelstelle wird in einer Fußnote bewahrt.
- source_word: לְמִשְׁפַּחַת לִבְנֵי קְהָת הַנּוֹתָרִים
  choice: für die Sippe der übrigen Söhne Kehats
  rationale: מִשְׁפָּחָה bezeichnet hier eine größere Familien- oder Sippengruppe; der Singular wird bewahrt. הַנּוֹתָרִים meint die noch übrigen, zuvor nicht bedachten Nachkommen Kehats.
