lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: Die Söhne Meraris
  rationale: Die Konstruktverbindung bezeichnet hier die unmittelbar genannten Söhne Meraris. Der deutsche Genitiv ist natürlich und wahrt die genealogische Formulierung.
- source_word: מַחְלִי וּמֻשִׁי
  choice: Machli und Muschi
  rationale: Die Eigennamen werden nach geläufiger deutscher Bibeltransliteration wiedergegeben; die Konjunktion wird mit „und“ übersetzt.
- source_word: וְאֵלֶּה
  choice: Dies sind
  rationale: Die Wendung leitet eine zusammenfassende genealogische Feststellung ein. Das einleitende וְ muss im Deutschen nicht eigens mit „und“ wiedergegeben werden.
- source_word: מִשְׁפְּחוֹת
  choice: Sippen
  rationale: Das Wort bezeichnet im genealogisch-stammesbezogenen Zusammenhang größere Verwandtschaftsgruppen und nicht nur moderne Kernfamilien.
- source_word: הַלֵּוִי
  choice: der Leviten
  rationale: Der hebräische Singular bezeichnet hier kollektiv die levitische Zugehörigkeit. Der deutsche Plural ist in diesem Zusammenhang verständlich und idiomatisch; die formale Abweichung wird in einer Fußnote kenntlich gemacht.
- source_word: לַאֲבוֹתֵיהֶם
  choice: geordnet nach ihren Vaterhäusern
  rationale: Wörtlich steht „nach ihren Vätern“. Im genealogischen Kontext geht es um die Zuordnung zu den väterlichen Abstammungsverbänden; „Vaterhäuser“ gibt diese implizite soziale Einheit prägnant wieder.
