base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/034.yaml
  text: And Aaron and his sons were offering on the altar of burnt offering and on the altar of incense[a], for all the work of the Most Holy Place and to make atonement for Israel, according to all that Moses the servant of God had commanded.
translation:
  language: de
  text: Aaron und seine Söhne ließen auf dem Brandopferaltar und auf dem Räucheraltar Opfergaben in Rauch aufgehen, um den gesamten Dienst an den hochheiligen Dingen[a] zu verrichten und für Israel Sühne zu erwirken, nach allem, was Mose, der Diener Gottes, geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um den gesamten Dienst im Allerheiligsten zu verrichten“. Die hebräische Wendung kann auch den innersten Raum des Heiligtums bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְטִירִים
  choice: ließen … die Opfer in Rauch aufgehen
  rationale: Das Hifil-Partizip bezeichnet das Verbrennen beziehungsweise In-Rauch-Aufgehen-Lassen von Opfergaben und Räucherwerk. Die Formulierung deckt beide im Vers genannten Altäre ab; „Opfer“ ist hier als umfassende Bezeichnung für die dargebrachten Gaben zu verstehen.
- source_word: מִזְבַּח הָעוֹלָה
  choice: Brandopferaltar
  rationale: Die etablierte und natürliche deutsche Bezeichnung für den Altar, auf dem Brandopfer dargebracht wurden.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: Räucheraltar
  rationale: Eine prägnante, geläufige Wiedergabe des Altars für das Räucherwerk.
- source_word: לְכֹל מְלֶאכֶת
  choice: den gesamten Dienst an
  rationale: מְלָאכָה bezeichnet hier die zugewiesene kultische Arbeit beziehungsweise den Dienst. „Den gesamten Dienst“ gibt auch den umfassenden Sinn von כֹל wieder.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: die hochheiligen Dinge
  rationale: Die superlativische Wendung kann das Allerheiligste als Ort oder besonders heilige Dinge bezeichnen. Im Zusammenhang mit den gesamten priesterlichen Aufgaben an beiden Altären ist die sachliche Lesart plausibel; die örtliche Alternative bleibt in der Fußnote erhalten.
- source_word: וּלְכַפֵּר עַל יִשְׂרָאֵל
  choice: und schafften Sühne für Israel
  rationale: „Sühne schaffen“ bewahrt den weiten kultischen Sinn von כפר, ohne eine bestimmte Sühnetheorie in den Text hineinzulesen.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: ganz wie … es geboten hatte
  rationale: Die Formulierung bringt die vollständige Übereinstimmung mit Moses Gebot natürlich zum Ausdruck.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: der Diener Gottes
  rationale: Die würdevolle appositionelle Amtsbezeichnung für Mose wird formal und verständlich bewahrt.
theological_decisions:
- issue: Bedeutung von קֹדֶשׁ הַקֳּדָשִׁים
  choice: die hochheiligen Dinge
  alternative: das Allerheiligste
  rationale: Die hebräische Wendung ist mehrdeutig und kann sowohl den innersten Heiligtumsraum als auch besonders heilige Dinge bezeichnen. Der Haupttext wählt wegen des umfassenden priesterlichen Dienstes an beiden Altären die sachliche Lesart, während die Fußnote die Ortslesart ausdrücklich bewahrt.
- issue: Wiedergabe von כפר
  choice: Sühne schaffen
  alternative: entsühnen; Versöhnung erwirken
  rationale: „Sühne schaffen“ bleibt im kultischen Bedeutungsfeld des hebräischen Verbs, legt aber keinen engeren konfessionellen Mechanismus der Sühne fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die Beziehungen des hebräischen Satzes aufzulösen. „Aaron aber“ markiert den im Hebräischen hervorgehobenen Wechsel zu Aaron und seinen Söhnen.
