  to: Aaron und seine Söhne ließen auf dem Brandopferaltar und auf dem Räucheraltar Opfergaben in Rauch aufgehen, um den gesamten Dienst an den hochheiligen Dingen[a] zu verrichten und für Israel Sühne zu erwirken, nach allem, was Mose, der Diener Gottes, geboten hatte.
  rationale: Die Revision hält an der sachlichen Hauptlesart von קֹדֶשׁ הַקֳּדָשִׁים fest und dokumentiert die mögliche Ortslesart in der Fußnote. Sie gibt den umfassenden Gehorsamsbezug von כְּכֹל präziser wieder, formuliert die deutsche Sühneaussage natürlicher und bildet die zweckbestimmenden Anschlüsse des Hebräischen enger ab. „Opfergaben“ bleibt als weiter Ausdruck gewählt, damit sowohl die Handlung am Brandopferaltar als auch die Räucherhandlung erfasst werden.
