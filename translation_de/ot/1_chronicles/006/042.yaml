id: 1CH.6.42
reference: 1 Chronicles 6:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י אַהֲרֹ֗ן נָתְנוּ֙ אֶת עָרֵ֣י הַ/מִּקְלָ֔ט אֶת חֶבְר֥וֹן וְ/אֶת לִבְנָ֖ה וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת יַתִּ֥ר וְ/אֶֽת אֶשְׁתְּמֹ֖עַ וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/042.yaml
  text: 'And to the sons of Aaron they gave the cities of refuge: Hebron[a], and Libnah with its pasturelands, and Jattir, and Eshtemoa with its pasturelands.'
translation:
  language: de
  text: 'Den Söhnen Aarons gaben sie die Zufluchtsstädte: Hebron, Libna mit seinem Weideland[a], Jattir und Eschtemoa mit seinem Weideland.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Gemeindeland“; das hebräische Wort bezeichnet das offene Land, das zu einer Stadt gehörte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי אַהֲרֹן
  choice: Den Söhnen Aarons
  rationale: Die Präposition ל kennzeichnet hier die Empfänger. „Söhne Aarons“ gibt den hebräischen Wortlaut und den genealogischen Zusammenhang unmittelbar wieder.
- source_word: נָתְנוּ
  choice: gaben sie
  rationale: נתן bedeutet gewöhnlich „geben“. Diese schlichte Wiedergabe bleibt auch im Zusammenhang einer Landzuteilung verständlich.
- source_word: עָרֵי הַמִּקְלָט
  choice: die Zufluchtsstädte
  rationale: „Zufluchtsstädte“ ist die klare und etablierte deutsche Wiedergabe des rechtlichen Begriffs für Städte, in denen Verfolgte Schutz suchen konnten.
- source_word: אֶת חֶבְרוֹן
  choice: Hebron
  rationale: Der Ortsname wird in seiner gebräuchlichen deutschen Form wiedergegeben.
- source_word: וְאֶת לִבְנָה
  choice: Libna
  rationale: Der Ortsname wird nach gebräuchlicher deutscher Bibelschreibung wiedergegeben.
- source_word: מִגְרָשֶׁיהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das offene, zu einer Stadt gehörende Umland, besonders als Weidefläche. Das feminine Suffix bezieht sich jeweils auf die unmittelbar zuvor genannte Stadt; im Deutschen verlangt „Weideland“ das sächliche Pronomen „seinem“.
- source_word: וְאֶת יַתִּר
  choice: Jattir
  rationale: Der Ortsname wird in einer gebräuchlichen deutschen Umschrift wiedergegeben.
- source_word: וְאֶת אֶשְׁתְּמֹעַ
  choice: Eschtemoa
  rationale: Der Ortsname wird in einer gebräuchlichen deutschen Umschrift wiedergegeben.
theological_decisions:
- issue: Umfang der Bezeichnung „Zufluchtsstädte“
  choice: Die hebräische Listenform wird mit einem Doppelpunkt bewahrt, ohne ausdrücklich festzulegen, ob die Bezeichnung auf alle folgenden Orte oder besonders auf Hebron bezogen ist.
  alternative: „die Zufluchtsstadt Hebron sowie Libna …“
  rationale: Der masoretische Text hat den Plural עָרֵי הַמִּקְלָט und zählt danach die Orte auf. Eine Umformulierung in den Singular würde die aus Parallelüberlieferungen gewonnene Zuordnung ausdrücklich machen, aber vom vorliegenden Wortlaut abweichen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Aufzählungsstruktur des Hebräischen bleibt erhalten; bei den Ortsnamen stehen etablierte deutsche Formen.
