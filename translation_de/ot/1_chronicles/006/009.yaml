translation:
  language: de
  text: Tahat, sein Sohn, Uriel, sein Sohn, Usija, sein Sohn, und Schaul[a], sein Sohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Schaul wird in deutschen Bibeln gewöhnlich als Saul wiedergegeben.
