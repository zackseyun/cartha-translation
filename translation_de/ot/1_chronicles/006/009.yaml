lexical_decisions:
- source_word: תַּחַת
  choice: Tahat
  rationale: Personenname in einem Geschlechtsregister; nach üblicher deutscher Umschrift wiedergegeben.
- source_word: בְּנוֹ
  choice: sein Sohn
  rationale: Die wiederkehrende genealogische Formel bedeutet wörtlich »sein Sohn«. Obwohl בֵּן in Geschlechtsregistern auch einen weiter entfernten Nachkommen bezeichnen kann, wird die offene, quellennahe Formulierung beibehalten.
- source_word: אוּרִיאֵל
  choice: Uriel
  rationale: Der Personenname wird in der im Deutschen etablierten Form wiedergegeben.
- source_word: עֻזִּיָּה
  choice: Usija
  rationale: Der Personenname wird gemäß gängiger deutscher Bibel- und Umschrifttradition wiedergegeben.
- source_word: וְשָׁאוּל
  choice: und Schaul
  rationale: Die Form »Schaul« bildet die hebräische Aussprache genauer ab als die traditionell eingedeutschte Namensform »Saul«; die Konjunktion וְ wird mit »und« wiedergegeben.
theological_decisions: []
