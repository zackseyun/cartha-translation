lexical_decisions:
- source_word: יוֹאָח
  choice: Joach
  rationale: Hebräische Personenbezeichnung; nach geläufiger deutscher Umschrift als Eigenname wiedergegeben.
- source_word: בְּנוֹ
  choice: sein Sohn
  rationale: בֵּן mit Suffix der 3. Person maskulin Singular bezeichnet in dieser genealogischen Reihung am natürlichsten den Sohn. Dass biblische Stammbäume bisweilen Generationen überspringen können, ändert den unmittelbaren lexikalischen Wert nicht.
- source_word: עִדּוֹ
  choice: Iddo
  rationale: Eigenname in einer im Deutschen üblichen, quellennahen Umschrift.
- source_word: זֶרַח
  choice: Serach
  rationale: Eigenname; die Wiedergabe mit S entspricht der üblichen deutschen Umschrift des hebräischen Zajin.
- source_word: יְאָתְרַי
  choice: Jeatrai
  rationale: Eigenname; quellennahe deutsche Umschrift der masoretischen Form. Die abweichende Form „Jeterai“ wird als Namensvariante in der Fußnote bewahrt.
