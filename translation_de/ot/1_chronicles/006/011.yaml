lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Der hebräische Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: בְּנוֹ / בנו
  choice: sein Sohn
  rationale: Die Status-constructus-Form mit Suffix der 3. Person Maskulin Singular bezeichnet in der Geschlechtsfolge jeweils „sein Sohn“. Die Wiederholung bewahrt den knappen genealogischen Rhythmus des Hebräischen.
- source_word: צוֹפַי
  choice: Zofai
  rationale: Der Personenname wird entsprechend der masoretischen Vokalisierung und in einer für deutsche Leser transparenten Umschrift wiedergegeben.
- source_word: וְ
  choice: und
  rationale: Die einfache Konjunktion verbindet das letzte Glied der Namensfolge.
- source_word: נַחַת
  choice: Nahat
  rationale: Der hebräische Personenname wird in deutscher Umschrift wiedergegeben; ח wird in der eingebürgerten Namensform mit „h“ dargestellt.
theological_decisions: []
translation_notes:
  register: Knapper, würdiger genealogischer Stil. Die wiederholte Wendung „sein Sohn“ folgt bewusst der Struktur des hebräischen Textes; die Namensformen sind für modernes Standarddeutsch angepasst.
