  yaml_path: translation/ot/1_chronicles/006/053.yaml
  text: and Jokmeam with its pasturelands[b][a], and Beth-horon with its pasturelands.
translation:
  language: de
  text: und Jokmeam[a] mit seinem Weideland[b] und Bet-Horon mit seinem Weideland.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jokneam«. Der hebräische Text der Chronik lautet »Jokmeam«; »Jokneam« begegnet aufgrund paralleler Ortsnamentraditionen in manchen Übersetzungen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Gemeindeland« oder »umliegendes Weideland«; gemeint sind die einer Stadt zugehörigen offenen Flächen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְמְעָם
  choice: Jokmeam
  rationale: Der Ortsname wird entsprechend der Konsonantenform des masoretischen Textes in der Chronik transliteriert; die Form »Jokneam« beruht auf verwandten Ortsnamentraditionen.
- source_word: מִגְרָשֶׁיהָ
  choice: sein Weideland
  rationale: מִגְרָשׁ bezeichnet im Zusammenhang mit den Levitenstädten das einer Stadt zugehörige offene Land, besonders als Weidefläche. Der deutsche Singular »Weideland« gibt den kollektiven Sinn natürlich wieder.
- source_word: בֵּית חוֹרוֹן
  choice: Bet-Horon
  rationale: Der zusammengesetzte hebräische Ortsname wird in einer im Deutschen üblichen, quellennahen Form mit Bindestrich wiedergegeben.
- source_word: וְאֶת
  choice: und
  rationale: Der wiederholte Akkusativmarker אֶת bleibt unübersetzt; die vorangestellte Konjunktion wird in dieser Aufzählung natürlich mit »und« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, schlichte und würdige Listensprache. »Weideland« ist für heutige Leser verständlich und wahrt den kollektiven Singular des Hebräischen. Der Vers beginnt entsprechend seinem Zusammenhang als Fortsetzung einer Aufzählung mit »und«.
