lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Der Status constructus im Plural leitet die Geschlechtsfolge ein. „Die Söhne“ gibt die hebräische Form unmittelbar wieder, ohne eine mögliche genealogische Verkürzung durch „Nachkommen“ vorwegzunehmen.
- source_word: קְהָת
  choice: Kehat
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamensform wiedergegeben.
- source_word: עַמִּינָדָב
  choice: Amminadab
  rationale: Der masoretische Text nennt hier ausdrücklich Amminadab; diese Lesart bleibt trotz abweichender Parallelgenealogien im Haupttext erhalten.
- source_word: בְּנוֹ
  choice: sein Sohn
  rationale: Die dreimal wiederholte Form bezeichnet jeweils die Sohnschaft und wird zur Wahrung der hebräischen Kettenstruktur einheitlich übersetzt.
- source_word: קֹרַח
  choice: Korach
  rationale: Der Personenname wird in der etablierten deutschen Form transliteriert.
- source_word: אַסִּיר
  choice: Assir
  rationale: Die Form ist hier ein Personenname und wird daher transliteriert, nicht nach einer möglichen Wortbedeutung übersetzt.
