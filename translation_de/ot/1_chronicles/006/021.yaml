lexical_decisions:
- source_word: בֶּן
  choice: der Sohn
  rationale: In dieser genealogischen Reihe bezeichnet בֶּן jeweils die direkte Abstammungsbeziehung. Die wiederholte Wiedergabe erhält den listenartigen Stil des Hebräischen; grundsätzlich kann das Wort in Genealogien auch einen weiter entfernten Nachkommen bezeichnen.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Für den Personennamen wird die im Deutschen gebräuchliche biblische Namensform verwendet; nach dem vorausgehenden Genitivausdruck steht hier die Form „Elkanas“.
- source_word: יוֹאֵל
  choice: Joël
  rationale: Die etablierte deutsche Namensform wird verwendet. Das Trema macht deutlich, dass o und e getrennt gesprochen werden.
- source_word: עֲזַרְיָה
  choice: Asarja
  rationale: Die im Deutschen gebräuchliche biblische Form des hebräischen Personennamens wird verwendet.
- source_word: צְפַנְיָה
  choice: Zefanja
  rationale: Die im Deutschen gebräuchliche biblische Form des hebräischen Personennamens wird verwendet.
