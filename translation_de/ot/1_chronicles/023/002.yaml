base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/002.yaml
  text: And he gathered all the leaders of Israel[a], and the priests and the Levites.
translation:
  language: de
  text: Und er versammelte alle führenden Männer Israels[a] sowie die Priester und die Leviten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Fürsten Israels“, „die Amtsträger Israels“ oder „die Obersten Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: Und er versammelte
  rationale: Das narrative Wayyiqtol führt die Handlung weiter. „Versammelte“ gibt אסף in diesem Zusammenhang natürlich und präzise wieder.
- source_word: כָּל
  choice: alle
  rationale: Der Quantor bezeichnet die Gesamtheit der folgenden Personengruppe und wird im Deutschen idiomatisch mit „alle“ wiedergegeben.
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: die führenden Männer Israels
  rationale: שָׂרִים kann Fürsten, Oberste, Amtsträger oder Anführer bezeichnen. „Führende Männer“ ist in diesem administrativen Zusammenhang verständlich, ohne eine königliche Abstammung zu unterstellen.
- source_word: וְהַכֹּהֲנִים
  choice: sowie die Priester
  rationale: Die bestimmte Pluralform wird direkt wiedergegeben; „sowie“ verbindet die aufgezählten Gruppen im Deutschen flüssig.
- source_word: וְהַלְוִיִּם
  choice: und die Leviten
  rationale: „Leviten“ ist die geläufige deutsche Bezeichnung für diese Stammes- beziehungsweise Dienstgruppe.
