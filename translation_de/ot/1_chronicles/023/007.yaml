  rationale: Der Personenname wird nach seiner masoretischen Form transliteriert. „Ladan“ ist im Deutschen eine klare und angemessene Wiedergabe.
- source_word: וְשִׁמְעִי
  choice: und Schimi
  rationale: Die Konjunktion וְ wird mit „und“ wiedergegeben. Der Personenname שִׁמְעִי wird in gebräuchlicher deutscher Form als „Schimi“ transliteriert.
