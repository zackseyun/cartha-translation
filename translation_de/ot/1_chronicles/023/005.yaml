  text: וְ/אַרְבַּ֥עַת אֲלָפִ֖ים שֹׁעֲרִ֑ים וְ/אַרְבַּ֤עַת אֲלָפִים֙ מְהַֽלְלִ֣ים לַ/יהוָ֔ה בַּ/כֵּלִ֕ים אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/הַלֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/005.yaml
  text: and four thousand gatekeepers[a], and four thousand praising Yahweh with the instruments that I made to praise him.
translation:
  language: de
  text: und viertausend Torhüter und viertausend, die Jahwe mit den Instrumenten loben, die ich zum Lobpreis angefertigt habe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit den Instrumenten, die ich angefertigt habe, um zu loben«; die Instrumente können eigens für den Lobpreis bestimmt gewesen sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁעֲרִים
  choice: Torhüter
  rationale: Die Bezeichnung meint die an den Toren eingesetzten Amtsträger; »Torhüter« ist im Tempelzusammenhang präzise und natürlich.
- source_word: מְהַלְלִים
  choice: die … lobten
  rationale: Das Partizip bezeichnet die fortdauernde Aufgabe dieser Gruppe. Der Relativsatz gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname »Jahwe« wiedergegeben.
- source_word: בַּכֵּלִים
  choice: mit den Instrumenten
  rationale: כֵּלִים ist allgemein »Geräte/Werkzeuge«, bezeichnet hier wegen des Lobpreises jedoch Instrumente; »Musikinstrumente« wäre expliziter als der hebräische Ausdruck.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: die ich … angefertigt hatte
  rationale: Der Relativsatz bezieht sich auf die Instrumente. »Angefertigt« passt idiomatisch zu Instrumenten; das Plusquamperfekt ordnet ihre Herstellung dem beschriebenen Dienst zeitlich voraus.
- source_word: לְהַלֵּל
  choice: zum Lobpreis
  rationale: Der Infinitiv mit לְ bezeichnet den Zweck der Instrumente, ohne ein im Hebräischen nicht ausdrücklich genanntes Objekt zu ergänzen.
- source_word: וְאַרְבַּעַת אֲלָפִים ... וְאַרְבַּעַת אֲלָפִים
  choice: und viertausend … und viertausend
  rationale: Die wiederholte Zahlenformel bleibt erhalten und kennzeichnet zwei verschiedene Gruppen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; »Jahwe« bewahrt hier den Charakter eines Eigennamens.
- issue: Nicht genanntes Objekt von לְהַלֵּל
  choice: zum Lobpreis
  alternative: um ihn zu loben
  rationale: Das Hebräische nennt beim abschließenden Infinitiv kein Objekt. Die substantivische Zweckangabe vermeidet es, »ihn« stillschweigend einzufügen, obwohl dies sinngemäß naheliegt.
translation_notes:
  register: Moderner, würdevoller Standardstil. Die Satzform bleibt als Fortsetzung des vorangehenden Verses bewusst mit »und« eröffnet; die beiden Gruppen und die Wiederholung von »viertausend« werden entsprechend dem Hebräischen getrennt genannt.
