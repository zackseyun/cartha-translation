base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/024.yaml
  text: These were the sons of Levi by their fathers’ houses[a], the heads of the fathers’ houses, according to those counted of them, by the number of names, head by head, doing the work for the service of the house of Yahweh, from twenty years old and upward.
translation:
  language: de
  text: 'Dies sind die Nachkommen Levis nach ihren Großfamilien: die Familienoberhäupter, die entsprechend ihrer Erfassung nach der Zahl der Namen einzeln gezählt wurden[a] und vom zwanzigsten Lebensjahr an die Arbeit für den Dienst am Haus Jahwes verrichteten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach der Zahl der Namen, nach ihren Köpfen“; eine Zählungsformel, die die Erfassung jeder einzelnen Person nach Namen bezeichnet.'
    reason: Die Fußnote erläutert die konkrete hebräische Zählungsformel לְגֻלְגְּלֹתָם, ohne die deutsche Hauptübersetzung mit einer unidiomatischen wörtlichen Wendung zu belasten.
lexical_decisions:
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: geordnet nach ihren Großfamilien
  rationale: בֵּית אָבוֹת bezeichnet die väterlich bestimmte größere Familien- oder Sippeneinheit. „Großfamilien“ ist im heutigen Deutsch verständlicher als das wörtliche „Vaterhäuser“; „geordnet nach“ gibt die Einteilung durch לְ wieder.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: die Oberhäupter der Großfamilien
  rationale: Die Wendung bezeichnet die leitenden Vertreter der jeweiligen Abstammungsverbände. Die Ergänzung „Großfamilien“ macht den im Hebräischen verkürzten Bezug natürlich verständlich.
- source_word: לִפְקוּדֵיהֶם בְּמִסְפַּר שֵׁמוֹת לְגֻלְגְּלֹתָם
  choice: Sie wurden einzeln mit Namen erfasst
  rationale: 'Die gebündelte Wiedergabe bewahrt den Zählungs- und Registergedanken: Die Gemusterten wurden namentlich und als Einzelpersonen erfasst. Die konkrete Metapher „nach ihren Schädeln“ wird in der Fußnote offengelegt.'
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: die die Arbeit ... verrichteten
  rationale: Der singularische Partizipialausdruck hat kollektive Bedeutung und bezieht sich auf die erfassten Leviten. Im Deutschen verlangt der pluralische Bezug eine entsprechende Form.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: für den Dienst am Haus Jahwes
  rationale: עֲבֹדָה umfasst hier die praktischen und kultischen Dienstaufgaben am Heiligtum. „Dienst“ hält diese Bedeutungsbreite offen; „Haus Jahwes“ bezeichnet den Tempel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in der etablierten Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: alle ab zwanzig Jahren
  rationale: Die hebräische Altersformel nennt eine Untergrenze und schließt alle Älteren ein. Die deutsche Formulierung ist knapp und eindeutig.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Großfamilien“ ersetzt das missverständliche oder altertümliche „Vaterhäuser“. Die lange hebräische Nominalkette wird für gute Lesbarkeit in zwei Sätze gegliedert, ohne ihre sachlichen Beziehungen aufzulösen.
