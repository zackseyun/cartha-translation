lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Die konstruktusförmige Mehrzahl von בֵּן leitet hier eine genealogische Linie ein. „Söhne“ gibt den hebräischen Ausdruck unmittelbar wieder; „Nachkommen“ wäre möglich, ist hier aber weniger präzise.
- source_word: גֵרְשׁוֹם
  choice: Gerschom
  rationale: Der Personenname wird entsprechend der hebräischen Form גֵרְשׁוֹם wiedergegeben und von Gerschon unterschieden.
- source_word: שְׁבוּאֵל
  choice: Schëbuel
  rationale: Der Personenname wird in einer dem Hebräischen nahen, im Deutschen lesbaren Form wiedergegeben; das Trema macht die getrennte Aussprache der Vokale kenntlich.
- source_word: הָרֹאשׁ
  choice: das Oberhaupt
  rationale: רֹאשׁ mit Artikel bezeichnet in diesem genealogisch-organisatorischen Zusammenhang wahrscheinlich die Person mit Vorrang oder Leitungsfunktion. „Oberhaupt“ ist im Deutschen natürlich und bewahrt zugleich das Bild von „Haupt“.
