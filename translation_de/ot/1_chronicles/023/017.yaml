base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/017.yaml
  text: 'The sons of Eliezer: Rehabiah was the chief[a], and Eliezer had no other sons; but the sons of Rehabiah became very many.'
translation:
  language: de
  text: 'Die Söhne Eliesers: Rechabja war das Oberhaupt[a]. Elieser hatte keine weiteren Söhne; aber die Söhne Rechabjas wurden überaus zahlreich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „war der Erste“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אֱלִיעֶזֶר
  choice: 'Die Söhne Eliesers:'
  rationale: Die genealogische Einleitungsformel wird im Deutschen natürlich als überschriftartige Wendung wiedergegeben.
- source_word: רְחַבְיָה
  choice: Rechabja
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenkonvention wiedergegeben.
- source_word: הָרֹאשׁ
  choice: war das Oberhaupt
  rationale: Im genealogisch-organisatorischen Zusammenhang bezeichnet das Wort wahrscheinlich den führenden Vertreter beziehungsweise das Familienoberhaupt; die mögliche Bedeutung „der Erste“ bleibt in der Fußnote erhalten.
- source_word: וְלֹא הָיָה לֶאֱלִיעֶזֶר בָּנִים אֲחֵרִים
  choice: Elieser hatte keine weiteren Söhne
  rationale: Die hebräische Existenzkonstruktion wird idiomatisch als deutscher Besitzsatz wiedergegeben.
- source_word: וּבְנֵי רְחַבְיָה
  choice: aber die Söhne Rechabjas
  rationale: '„Aber“ macht den im Zusammenhang angelegten Gegensatz deutlich: Elieser hatte nur einen Sohn, dessen Nachkommenschaft jedoch sehr groß wurde.'
- source_word: רָבוּ לְמָעְלָה
  choice: wurden überaus zahlreich
  rationale: Die Verbindung beschreibt eine starke zahlenmäßige Vermehrung; „überaus zahlreich“ gibt Verb und Verstärkung in natürlichem Deutsch wieder.
