base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/009.yaml
  text: 'The sons of Shimei: Shelomoth[a], Haziel, and Haran—three. These were the heads of the fathers’ houses of Ladan.'
translation:
  language: de
  text: 'Die Söhne Schimis: Schelomot[a], Hasiël und Haran, drei an der Zahl. Diese waren die Familienoberhäupter Ladans.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schelomit“, eine verbreitete alternative Wiedergabe des Namens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעִי
  choice: Die Söhne Schimis
  rationale: In dieser genealogischen Aufzählung bezeichnet die Verbindung am natürlichsten unmittelbare Söhne; der deutsche Genitiv gibt das Konstrukt knapp und idiomatisch wieder.
- source_word: שלמות
  choice: Schelomot
  rationale: Die Umschrift folgt der masoretischen Punktierung und gibt die Endung als -ot wieder; die Namensform bleibt dadurch von Schelomit unterscheidbar.
- source_word: וַחֲזִיאֵל
  choice: Hasiël
  rationale: Der Name wird direkt aus der vorliegenden hebräischen Form wiedergegeben; die Trema-Schreibung macht die getrennte Aussprache der Vokale kenntlich. Die anderswo belegte verwandte Form Jahasiël wird nicht eingetragen.
- source_word: וְהָרָן
  choice: und Haran
  rationale: Einfache Verbindung mit einem Eigennamen; Haran ist eine natürliche deutsche Umschrift.
- source_word: שְׁלֹשָׁה
  choice: drei
  rationale: Die ausdrücklich genannte Gesamtsumme wird entsprechend dem Hebräischen beibehalten.
- source_word: אֵלֶּה
  choice: Sie
  rationale: Das Demonstrativpronomen verweist auf die drei genannten Männer. Im Deutschen vermeidet das Personalpronomen die schwerfällige Folge „Diese waren“, ohne den Bezug zu verändern.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: die Oberhäupter der Großfamilien
  rationale: Die Wendung bezeichnet in Chronik genealogisch und administrativ gegliederte väterliche Familienverbände. „Großfamilien“ vermittelt diesen Sinn im heutigen Deutsch verständlicher als das missverständliche wörtliche „Vaterhäuser“.
- source_word: לְלַעְדָּן
  choice: Ladans
  rationale: Das Präfix ל markiert hier die genealogische Zuordnung zu Ladan; der deutsche Genitiv drückt diese Beziehung knapp aus.
