lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Die Konstruktusform des Plurals von בֵּן leitet eine genealogische Aufzählung ein. „Söhne“ ist hier die direkte und natürliche Wiedergabe.
- source_word: עֻזִּיאֵל
  choice: Usiël
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren, dem Hebräischen nahen Form wiedergegeben; das Trema macht die getrennte Aussprache der Vokale kenntlich.
- source_word: מִיכָה
  choice: Micha
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: הָרֹאשׁ
  choice: der Erste
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“ beziehungsweise „Haupt“ und kann Rang oder Vorrang bezeichnen. In der Gegenüberstellung mit „der Zweite“ liegt eine ordinale Wiedergabe nahe, ohne die mögliche Bedeutung „Oberhaupt“ zu verschweigen.
- source_word: וְיִשִּׁיָּה
  choice: und Jischija
  rationale: Der Personenname samt Konjunktion wird lautnah und nach deutschen Schreibkonventionen wiedergegeben.
- source_word: הַשֵּׁנִי
  choice: der Zweite
  rationale: Das bestimmte Ordinaladjektiv bezeichnet den zweiten der aufgeführten Söhne.
