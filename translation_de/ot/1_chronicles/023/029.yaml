  naturalness: Die Konstruktion »was in der Pfanne gebacken« ist im heutigen Standarddeutsch unvollständig, weil das finite Hilfsverb fehlt. Die Nominalformen »das in der Pfanne Zubereitete« und »das Vermengte« sind knapp, idiomatisch und dem listenartigen Stil angemessen.
  terminology: »Speiseopfer« und »ungesäuerte Fladen« sind sachgerecht. Bei לֶחֶם הַמַּעֲרֶכֶת macht die quellennähere Wiedergabe »Brot der Anordnung« die besondere hebräische Formulierung sichtbar; »Schaubrote« bleibt als etablierte alternative Fachbezeichnung in der Anmerkung. Die Fußnote sollte »Brot der Gegenwart« nicht als direkte Benennung dieses hebräischen Ausdrucks darstellen, da diese Bezeichnung an verwandte, aber anders formulierte Priesterschriften anknüpft.
