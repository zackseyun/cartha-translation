base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/029.yaml
  text: and for the bread of the arrangement[a], and for the fine flour for the grain offering, and for the wafers of unleavened bread, and for what is cooked on the griddle, and for what is well-mixed, and for every measure and size,
translation:
  language: de
  text: und für das Brot der Anordnung[a], für das Feinmehl zum Speiseopfer, für die ungesäuerten Fladen, für das in der Pfanne Zubereitete und für das Vermengte sowie für jedes Maß und jede Abmessung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Brot der Anordnung«. Oder: »Schaubrote«. »Brot der Gegenwart« ist eine traditionelle Wiedergabe, die sich an verwandter kultischer Terminologie orientiert.'
    reason: Die Anmerkung bewahrt die wörtliche Bedeutung von לֶחֶם הַמַּעֲרֶכֶת und kennzeichnet die traditionellen Alternativen, ohne sie als identischen hebräischen Wortlaut auszugeben.
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: Schaubrote
  rationale: Der hebräische Ausdruck bezeichnet wörtlich das »Brot der Anordnung«, also die im Heiligtum geordnet aufgelegten Brote. »Schaubrote« ist der etablierte deutsche Kultbegriff; die wörtliche Bedeutung wird in der Fußnote erhalten.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Bezeichnet hochwertiges, fein gemahlenes Mehl für Opfergaben und ist im Deutschen klar und sachgerecht.
- source_word: מִנְחָה
  choice: Speiseopfer
  rationale: Im kultischen Zusammenhang bezeichnet das Wort hier eine aus pflanzlichen Erzeugnissen bestehende Opfergabe, nicht allgemein ein Geschenk.
- source_word: רְקִיקֵי הַמַּצּוֹת
  choice: ungesäuerte Fladen
  rationale: רְקִיקִים sind dünne Fladen oder Kuchen; מַצּוֹת bestimmt sie als ungesäuert. Die Wiedergabe ist knapp und natürlich.
- source_word: מַחֲבַת
  choice: das, was in der Pfanne gebacken wird
  rationale: Das Wort bezeichnet eine flache Back- oder Bratpfanne. Im Zusammenhang der zubereiteten Opfergaben ist das darin Gebackene gemeint, nicht lediglich das Gerät.
- source_word: מֻרְבָּכֶת
  choice: das, was eingerührt wird
  rationale: Die passive Form bezeichnet eine durch Einrühren beziehungsweise Vermengen bereitete Speise. Die Formulierung wahrt die Unsicherheit über den genauen Zubereitungsvorgang.
- source_word: מְשׂוּרָה
  choice: Hohlmaß
  rationale: Bezeichnet ein Maß beziehungsweise eine abgemessene Menge, wahrscheinlich für das Fassungsvermögen; »Hohlmaß« unterscheidet es verständlich vom folgenden Maßbegriff.
- source_word: מִדָּה
  choice: Längenmaß
  rationale: Der zweite Maßbegriff kann Maße oder Abmessungen bezeichnen. Im Paar mit מְשׂוּרָה gibt »Längenmaß« die wahrscheinliche Unterscheidung wieder, ohne konkrete Einheiten einzutragen.
