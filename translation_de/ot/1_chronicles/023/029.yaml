  register: Modernes, würdiges Standarddeutsch. Die kultischen Fachbegriffe »Schaubrote« und »Speiseopfer« bleiben wegen ihrer Präzision erhalten; weniger eindeutige Zubereitungsbegriffe werden beschreibend und ohne unnötige Festlegung wiedergegeben.
