lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der Status constructus im Plural leitet hier jeweils eine genealogische Liste unmittelbarer Söhne ein. „Söhne“ gibt den hebräischen Ausdruck direkt und im Deutschen natürlich wieder.
- source_word: מְרָרִי
  choice: Merari
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: מַחְלִי
  choice: Machli
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert; beim zweiten Vorkommen steht wegen der deutschen Konstruktion der Genitiv „Machlis“.
- source_word: וּמוּשִׁי
  choice: und Muschi
  rationale: Die Konjunktion wird mit „und“ wiedergegeben, der Personenname in der geläufigen deutschen Form „Muschi“.
- source_word: בְּנֵי מַחְלִי
  choice: Die Söhne Machlis
  rationale: Die Wiederholung der genealogischen Überschrift bewahrt die klare Parallelstruktur des Hebräischen.
- source_word: אֶלְעָזָר
  choice: Eleasar
  rationale: Der Personenname wird in der etablierten deutschen biblischen Schreibweise wiedergegeben.
- source_word: וְקִישׁ
  choice: und Kisch
  rationale: Die Konjunktion wird direkt mit „und“ übersetzt; „Kisch“ entspricht der üblichen deutschen Namensform.
