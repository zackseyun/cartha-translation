source:
  edition: WLC
  text: וּ/לְ/כֹ֨ל הַעֲל֤וֹת עֹלוֹת֙ לַ/יהוָ֔ה לַ/שַּׁבָּת֔וֹת לֶ/חֳדָשִׁ֖ים וְ/לַ/מֹּעֲדִ֑ים בְּ/מִסְפָּ֨ר כְּ/מִשְׁפָּ֧ט עֲלֵי/הֶ֛ם תָּמִ֖יד לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/031.yaml
  text: and for all the burnt offerings offered to Yahweh on the Sabbaths[a], at the new moons, and at the appointed feasts, by number according to the ordinance concerning them, continually before Yahweh.
translation:
  language: de
  text: und für das Darbringen aller Brandopfer für Jahwe an den Sabbaten, Neumonden und Festzeiten, in der vorgeschriebenen Zahl, nach der für sie geltenden Ordnung, regelmäßig vor Jahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְכֹל הַעֲלוֹת עֹלוֹת
  choice: und alle Brandopfer … darzubringen
  rationale: Der Infinitiv הַעֲלוֹת mit dem Substantiv עֹלוֹת bezeichnet das Darbringen der Brandopfer. Die deutsche Infinitivkonstruktion bewahrt den Anschluss an die vorausgehende Aufgabenliste und vermeidet eine schwerfällige Wiederholung wie „das Aufsteigenlassen von Brandopfern“.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל markiert hier den Empfänger beziehungsweise die Widmung des Opfers. „Für Jahwe“ ist im Deutschen natürlich und gibt den Opferbezug klar wieder.
- source_word: לַשַּׁבָּתוֹת לֶחֳדָשִׁים וְלַמֹּעֲדִים
  choice: an den Sabbaten, Neumonden und Festzeiten
  rationale: Die drei Ausdrücke bezeichnen die regelmäßig festgelegten kultischen Anlässe. „Festzeiten“ erhält bei מוֹעֲדִים sowohl den Gedanken bestimmter Zeiten als auch den festlichen Charakter.
- source_word: בְּמִסְפָּר כְּמִשְׁפָּט עֲלֵיהֶם
  choice: in der vorgeschriebenen Anzahl, nach der für sie geltenden Ordnung
  rationale: בְּמִסְפָּר bezeichnet die zahlenmäßige Festlegung; כְּמִשְׁפָּט die maßgebende Vorschrift. עֲלֵיהֶם bleibt mit „für sie“ hinsichtlich seines Bezugs auf Opfer beziehungsweise Anlässe ähnlich offen wie im Hebräischen.
- source_word: תָּמִיד לִפְנֵי יְהוָה
  choice: regelmäßig vor Jahwe
  rationale: Im kultischen Zusammenhang bezeichnet תָּמִיד die beständige, wiederkehrende Ausübung. „Regelmäßig“ passt hier zu den genannten Kalenderterminen besser als ein möglicherweise ununterbrochen verstandenes „ständig“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von תָּמִיד
  choice: regelmäßig
  alternative: beständig / ständig
  rationale: Die Opfer werden an Sabbaten, Neumonden und Festzeiten dargebracht; daher steht die geordnete Wiederkehr im Vordergrund. Die allgemeinere Bedeutung „beständig“ bleibt möglich, wird hier aber kontextuell als regelmäßiger Dienst verstanden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Fortsetzung der Aufgabenliste des vorhergehenden Kontexts formuliert. Kultische Fachbegriffe wie „Brandopfer“, „Sabbate“ und „Neumonde“ werden beibehalten; unnötig altertümliche Verwaltungsbegriffe werden vermieden.
