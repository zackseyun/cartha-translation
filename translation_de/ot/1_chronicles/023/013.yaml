base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/013.yaml
  text: 'The sons of Amram: Aaron and Moses. And Aaron was set apart[a], he and his sons forever, to sanctify him as most holy, to burn incense before Yahweh, to minister to him, and to bless in his name forever.'
translation:
  language: de
  text: 'Die Söhne Amrams: Aaron und Mose. Aaron wurde ausgesondert, um ihn – ihn und seine Söhne für immer – als hochheilig[a] zu weihen, vor Jahwe Rauchopfer darzubringen, ihm zu dienen und für immer in seinem Namen zu segnen.


    [a] Wörtlich: »Heiligkeit der Heiligkeiten«; die hebräische Wendung ist eine Steigerungsform und bedeutet »hochheilig«. »Allerheiligstes« ist ebenfalls möglich, bezeichnet im Deutschen jedoch häufig einen heiligen Ort und ist hier daher weniger naheliegend.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Heiligkeit der Heiligkeiten«; die hebräische Wendung ist eine Steigerungsform und bedeutet »hochheilig«. »Allerheiligstes« ist ebenfalls möglich, bezeichnet im Deutschen jedoch häufig einen heiligen Ort und ist hier daher weniger naheliegend.'
    reason: lexikalische Alternative und Erläuterung der hebräischen Steigerungsform
lexical_decisions:
- source_word: בְּנֵי עַמְרָם
  choice: Die Söhne Amrams
  rationale: Die unmittelbar genannten Aaron und Mose sind die leiblichen Söhne Amrams; daher ist die konkrete Wiedergabe natürlicher als »Nachkommen«.
- source_word: וַיִּבָּדֵל
  choice: wurde ausgesondert
  rationale: Das Nifal von בדל bezeichnet hier die Absonderung für einen besonderen heiligen Dienst. »Ausgesondert« bewahrt diesen kultischen Sinn.
- source_word: לְהַקְדִּישׁוֹ
  choice: um ihn … zu heiligen
  rationale: Das Hifil von קדש bedeutet »heiligen/weihen«; das maskuline Singularsuffix wird ausdrücklich mit »ihn« wiedergegeben und auf Aaron bezogen.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  rationale: Die substantivische Wiederholungsform dient als Superlativ. »Hochheilig« gibt die prädikative Aussage wieder, ohne sie vorschnell als Bezeichnung eines Heiligtums zu verstehen.
- source_word: הוּא וּבָנָיו
  choice: ihn und seine Söhne
  rationale: Die Formulierung bewahrt den ausdrücklichen Bezug auf Aaron und seine Söhne als priesterliche Linie; der Kasus wird dem deutschen Satzbau angepasst.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet eine dauerhafte, fortbestehende Ordnung und wird in beiden Vorkommen gleich wiedergegeben.
- source_word: לְהַקְטִיר
  choice: Rauchopfer darzubringen
  rationale: קטר bezeichnet im Kult das Aufsteigenlassen von Opferrauch und kann sowohl Räucherwerk als auch andere in Rauch aufgehende Gaben betreffen. »Rauchopfer« bewahrt diese größere Bedeutungsbreite.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet die Gegenwart vor Gott; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: לְשָׁרְתוֹ
  choice: ihm zu dienen
  rationale: שרת bezeichnet hier den priesterlichen Dienst; das Suffix bezieht sich im unmittelbaren Zusammenhang am natürlichsten auf Jahwe.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: und … in seinem Namen zu segnen
  rationale: Die Formulierung bewahrt die mögliche Bedeutung von Handeln unter Berufung auf Gottes Namen beziehungsweise in seiner Vollmacht.
theological_decisions:
- issue: Bezug der Singularsuffixe in לְהַקְדִּישׁוֹ und לְשָׁרְתוֹ
  choice: »ihn … zu heiligen« bezieht sich auf Aaron; »ihm zu dienen« auf Jahwe
  alternative: Das erste Suffix könnte unpersönlich oder sachlich verstanden werden; das zweite theoretisch auf Aaron bezogen werden.
  rationale: Nach »Aaron wurde ausgesondert« ist Aaron der naheliegende Bezug von »ihn zu heiligen«; nach »vor Jahwe« bezeichnet »ihm zu dienen« am natürlichsten den Dienst für Jahwe. Die unterschiedlichen Bezüge der gleichlautenden deutschen Pronomen bleiben wie im Hebräischen bestehen.
- issue: Verhältnis von Aaron und seinen Söhnen zur Aussage »hochheilig«
  choice: Die enge, spannungsreiche hebräische Abfolge wird beibehalten und durch Gedankenstriche gegliedert.
  alternative: 'Glättende Wiedergabe: »Aaron und seine Söhne wurden für immer zum hochheiligen Dienst ausgesondert«.'
  rationale: Eine Glättung würde den maskulinen Singular in »ihn zu heiligen« und die prädikative Wendung קֹדֶשׁ קָדָשִׁים verdecken. Die Übersetzung bewahrt daher die syntaktische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kultische Fachsprache wird sparsam und verständlich eingesetzt. Die ungewöhnliche Syntax um »ihn als hochheilig zu heiligen« bleibt bewusst erhalten, weil sie die Form und Mehrdeutigkeit des hebräischen Textes abbildet; Gedankenstriche erleichtern die Lesbarkeit.
