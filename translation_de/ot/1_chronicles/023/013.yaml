  to: 'Die Söhne Amrams: Aaron und Mose. Aaron wurde ausgesondert, um ihn – ihn und seine Söhne für immer – als hochheilig[a] zu weihen, vor Jahwe Rauchopfer darzubringen, ihm zu dienen und für immer in seinem Namen zu segnen.


