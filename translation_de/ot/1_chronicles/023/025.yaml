source:
  edition: WLC
  text: כִּ֚י אָמַ֣ר דָּוִ֔יד הֵנִ֛יחַ יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל לְ/עַמּ֑/וֹ וַ/יִּשְׁכֹּ֥ן בִּ/ירוּשָׁלִַ֖ם עַד לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/025.yaml
  text: For David said[a], “Yahweh, the God of Israel, has given rest to his people, and he has dwelt in Jerusalem forever.”
translation:
  language: de
  text: 'Denn David sagte: »Jahwe, der Gott Israels, hat seinem Volk Ruhe verschafft und wohnt für immer in Jerusalem.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »und wird für immer in Jerusalem wohnen« oder »und hat für immer in Jerusalem gewohnt«. Die hebräische Verbform kann Jahwes festes, dauerhaftes Wohnen ausdrücken, ohne dass der Zeitbezug hier eindeutig festgelegt werden muss.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Anordnung ein und gibt die erklärende Funktion natürlich wieder.
- source_word: אָמַר דָּוִיד
  choice: David sagte
  rationale: Schlichte Wiedergabe der hebräischen Vergangenheitsaussage.
- source_word: הֵנִיחַ
  choice: hat … Ruhe verschafft
  rationale: Das Hifil von נוח bezeichnet hier das Gewähren beziehungsweise Herbeiführen von Ruhe; die Formulierung bewahrt den kausativen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als im Deutschen geläufige Umschrift wieder.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Natürliche Wiedergabe der Status-constructus-Verbindung als Apposition zu Jahwe.
- source_word: לְעַמּוֹ
  choice: seinem Volk
  rationale: Kennzeichnet bei „Ruhe verschaffen“ den Empfänger; im Deutschen ist kein zusätzliches Präpositionswort nötig.
- source_word: וַיִּשְׁכֹּן
  choice: und wohnt nun
  rationale: שׁכן bedeutet „wohnen“. „Nun“ bringt den aus der gewährten Ruhe hervorgehenden, bestehenden Zustand zum Ausdruck, ohne die hebräische Verbfolge ausschließlich als Vergangenheit oder Zukunft festzulegen.
- source_word: בִּירוּשָׁלִַם
  choice: in Jerusalem
  rationale: Direkte und natürliche Ortsangabe.
- source_word: עַד לְעוֹלָם
  choice: für immer
  rationale: Klare moderne Wiedergabe der Aussage unbegrenzter Dauer.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. Die Umschrift „Jahwe“ macht dies sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitbezug von וַיִּשְׁכֹּן
  choice: und wohnt nun für immer in Jerusalem
  alternative: und wird für immer in Jerusalem wohnen / und hat für immer in Jerusalem Wohnung genommen
  rationale: Die Form kann im Zusammenhang als Folge der bereits gewährten Ruhe und als dauerhaftes Wohnen verstanden werden. Die Hauptfassung stellt den gegenwärtig geltenden, bleibenden Zustand heraus; die Fußnote bewahrt die mögliche zukünftige beziehungsweise resultative Auffassung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ruhe verschafft“ ist verständlich und bewahrt den kausativen Sinn; „wohnt nun“ vermeidet eine unnötig starre Festlegung der mehrdeutigen hebräischen Zeitperspektive.
