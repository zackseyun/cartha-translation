    rationale: Sie bezeichnet eher einen punktuellen Einzug bzw. Beginn des Wohnens. Das hebräische שכן bezeichnet hier schlichtes bzw. dauerhaftes Wohnen; als Alternative ist „hat ... gewohnt“ näher am Wortlaut.
