  source_fidelity: Die Übersetzung gibt den begründenden Anschluss von כִּי mit „Denn“ zutreffend wieder. „Nach den letzten Worten Davids“ bildet die mögliche maßgebende/basierende Funktion von בְּ sowie „letzten“ für הָאַחֲרֹנִים angemessen ab. Die elliptische Zählungsformel wird mit „wurden ... gezählt“ verständlich und ohne sachliche Erweiterung wiedergegeben. „Im Alter von zwanzig Jahren an“ schließt, wie וּלְמַעְלָה verlangt, die Älteren ein.
