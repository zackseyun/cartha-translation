id: 1CH.23.27
reference: 1 Chronicles 23:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י בְ/דִבְרֵ֤י דָוִיד֙ הָ/אַ֣חֲרֹנִ֔ים הֵ֖מָּה מִסְפַּ֣ר בְּנֵי לֵוִ֑י מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/027.yaml
  text: For by the last words of David[a], the sons of Levi were numbered from twenty years old and upward.
translation:
  language: de
  text: Denn nach den letzten Worten Davids[a] wurden die Söhne Levis im Alter von zwanzig Jahren an gezählt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aufgrund der letzten Worte Davids“. Das Hebräische kann darauf hinweisen, dass diese Zählung auf Davids abschließender Anordnung beruhte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und gibt den Textzusammenhang im Deutschen natürlich wieder.
- source_word: בְּדִבְרֵי דָוִיד הָאַחֲרֹנִים
  choice: nach den letzten Worten Davids
  rationale: Die Präposition ב kann hier die Grundlage beziehungsweise Maßgabe der Zählung bezeichnen. „Nach“ bewahrt diese Bedeutung und lässt zugleich offen, ob Worte oder eine abschließende Anordnung gemeint sind.
- source_word: הָאַחֲרֹנִים
  choice: letzten
  rationale: Bezeichnet hier Davids abschließende Worte oder Anweisungen; „letzten“ ist direkt und vermeidet eine unnötige Deutung.
- source_word: הֵמָּה מִסְפַּר
  choice: wurden … gezählt
  rationale: Die hebräische Formulierung ist elliptisch. Im Zusammenhang bezeichnet sie die Erfassung der Leviten bei einer Zählung; die passive deutsche Wendung gibt diesen Sinn idiomatisch wieder.
- source_word: בְּנֵי לֵוִי
  choice: die Söhne Levis
  rationale: Bewahrt den genealogischen Ausdruck des Hebräischen, der kollektiv die Leviten bezeichnet.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה
  choice: im Alter von zwanzig Jahren an
  rationale: Gibt die übliche hebräische Altersformel in natürlichem modernem Deutsch wieder.
- source_word: וּלְמַעְלָה
  choice: an
  rationale: Zusammen mit der Altersangabe bezeichnet „an“ alle Personen ab zwanzig Jahren einschließlich der Älteren.
theological_decisions: []
