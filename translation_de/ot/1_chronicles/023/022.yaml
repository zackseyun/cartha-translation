  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֨מָת֙ אֶלְעָזָ֔ר וְ/לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וַ/יִּשָּׂא֥וּ/ם בְּנֵי קִ֖ישׁ אֲחֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/022.yaml
  text: Eleazar died and had no sons[a], but only daughters; and the sons of Kish, their brothers[b], married them.
translation:
  language: de
  text: Eleasar starb und hatte keine Söhne, sondern nur Töchter. Die Söhne Kischs, ihre Brüder[a], heirateten sie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Brüder“ sind hier wahrscheinlich nahe männliche Verwandte derselben Sippe gemeint, nicht unbedingt leibliche Brüder.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „nahmen sie zu Frauen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Das Verb מות bedeutet hier schlicht „sterben“; die direkte Wiedergabe vermeidet einen beschönigenden Ausdruck.
- source_word: אֶלְעָזָר
  choice: Eleasar
  rationale: Der Personenname wird in der im Deutschen bibelsprachlich üblichen Form wiedergegeben.
- source_word: וְלֹא הָיוּ לוֹ בָּנִים
  choice: hatte keine Söhne
  rationale: Wörtlich steht „ihm waren keine Söhne“. Wegen des ausdrücklichen Gegensatzes zu den Töchtern bezeichnet בָּנִים hier männliche Nachkommen, nicht allgemein Kinder.
- source_word: כִּי אִם בָּנוֹת
  choice: sondern nur Töchter
  rationale: כִּי אִם drückt nach der Verneinung eine einschränkende Gegenüberstellung aus. „Sondern nur“ ist natürliches Deutsch und erhält den Kontrast.
- source_word: וַיִּשָּׂאוּם
  choice: heirateten sie
  rationale: נשׂא mit Frauen als Objekt bezeichnet in diesem Zusammenhang die Eheschließung. „Heirateten sie“ ist klar und gegenwärtig; die wörtlichere Form wird in einer Fußnote genannt.
- source_word: בְּנֵי קִישׁ
  choice: die Söhne Kischs
  rationale: Die Wiedergabe bewahrt den genealogischen Stil der hebräischen Genitivverbindung.
- source_word: אֲחֵיהֶם
  choice: ihre Brüder
  rationale: Die formnahe Wiedergabe erhält die Verwandtschaftsbezeichnung des hebräischen Textes, ohne sie im Haupttext deutend zu „Verwandte“ zu verallgemeinern.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem genealogischem Ton. Die Hauptaussage bleibt knapp; mögliche Bedeutungsnuancen bei der Verwandtschaftsbezeichnung und beim Heiratsausdruck werden in Fußnoten offengehalten. Die Fußnotenmarker wurden den jeweils tatsächlich erläuterten Ausdrücken zugeordnet.
