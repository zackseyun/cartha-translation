- from: Und auch die Leviten brauchen die Wohnung und all ihre Geräte für ihren Dienst nicht mehr zu tragen.[a]
  to: Und auch die Leviten brauchen die Stiftshütte und alle ihre Geräte für den Dienst darin nicht mehr zu tragen.
