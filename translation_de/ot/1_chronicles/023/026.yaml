  text: וְ/גַ֖ם לַ/לְוִיִּ֑ם אֵין לָ/שֵׂ֧את אֶת הַ/מִּשְׁכָּ֛ן וְ/אֶת כָּל כֵּלָ֖י/ו לַ/עֲבֹדָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/026.yaml
  text: And also[a], the Levites no longer need to carry the tabernacle and all its utensils for its service.
translation:
  language: de
  text: Und auch die Leviten brauchen die Stiftshütte und alle ihre Geräte für den Dienst darin nicht mehr zu tragen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: Und auch
  rationale: Bewahrt sowohl die Verbindung zum vorangehenden Gedanken als auch die additive Hervorhebung.
- source_word: לַלְוִיִּם אֵין לָשֵׂאת
  choice: die Leviten brauchen … nicht mehr zu tragen
  rationale: 'Die hebräische Konstruktion lautet wörtlich etwa: »Für die Leviten gibt es kein Tragen«. Im Zusammenhang bedeutet sie, dass diese Aufgabe nach der dauerhaften Aufstellung der Wohnung nicht länger erforderlich ist, nicht dass das Tragen verboten wäre.'
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: »Wohnung« gibt die Grundbedeutung von מִשְׁכָּן wieder und bezeichnet hier das Zeltheiligtum als Gottes Wohnstätte unter Israel.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: und all ihre Geräte
  rationale: Gibt die koordinierende Konjunktion, die Gesamtheitsangabe כָּל und den breiten Sinn von כֵּלִים als Geräte beziehungsweise Gegenstände genau wieder.
- source_word: לַעֲבֹדָתוֹ
  choice: für ihren Dienst
  rationale: Das Suffix bezieht sich am natürlichsten auf die Wohnung; gemeint sind die Geräte, die ihrem Dienst dienen.
theological_decisions:
- issue: Bedeutung von אֵין לָשֵׂאת
  choice: keine fortbestehende Notwendigkeit zum Tragen
  alternative: Verbot, die Wohnung zu tragen
  rationale: Der Zusammenhang mit Davids Neuordnung der levitischen Aufgaben legt eine entfallene Pflicht nahe, nicht ein moralisches oder kultisches Verbot.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Wohnung« ist quellennäher als das kirchlich geprägte »Stiftshütte«; die Fußnote macht die ungewöhnliche hebräische Satzkonstruktion sichtbar.
