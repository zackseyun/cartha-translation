review_pass:
  verdict: revise
  source_fidelity: Die Aussage einer entfallenen Tragepflicht ist zutreffend wiedergegeben. Die koordinierende Aufzählung („die Wohnung und alle ihre Geräte“) entspricht dem Hebräischen. Das Suffix in לַעֲבֹדָתוֹ bezieht sich wahrscheinlich auf das Heiligtum; die deutsche Formulierung „für ihren Dienst“ kann wegen „die Leviten“ jedoch auch auf die Leviten bezogen werden.
  naturalness: „Wohnung“ ist zwar etymologisch nah an מִשְׁכָּן, bezeichnet im heutigen Standarddeutsch aber primär eine gewöhnliche Wohnstätte und ist hier ohne weitere Kennzeichnung weniger verständlich. „Stiftshütte“ ist im deutschen Bibelregister die etablierte, klare Bezeichnung. Die bestehende Fußnotenalternative mit „es gibt kein Tragen“ ist kein natürliches Deutsch.
  terminology: „Stiftshütte“ bezeichnet in diesem kultischen Kontext das מִשְׁכָּן präzise und idiomatisch. „Geräte“ ist für כֵּלִים angemessen. „für den Dienst darin“ macht den Bezug auf die Stiftshütte klar, ohne eine weitergehende Deutung einzutragen.
  issues:
  - severity: medium
    issue: „Wohnung“ ist im modernen Deutsch kontextuell missverständlich.
    rationale: Ohne einen kultischen Zusatz wird es gewöhnlich als private Wohnstätte verstanden; im Kontext von 1 Chronik 23 ist die Stiftshütte gemeint.
  - severity: medium
    issue: Der Bezug von „für ihren Dienst“ ist mehrdeutig.
    rationale: Das Possessivum kann nach „die Leviten“ auf die Leviten statt auf die „Wohnung“ bezogen werden. Der hebräische Suffixbezug ist am plausibelsten auf das Heiligtum bzw. dessen Dienst zu verstehen.
  - severity: low
    issue: Die Fußnotenformulierung ist unidiomatisch.
    rationale: „Für die Leviten gibt es kein Tragen“ bildet die hebräische Konstruktion zu mechanisch nach und ist keine hilfreiche deutsche Alternative.
  revised_text: Und auch die Leviten brauchen die Stiftshütte und alle ihre Geräte für den Dienst darin nicht mehr zu tragen.
