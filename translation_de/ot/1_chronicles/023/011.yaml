base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/011.yaml
  text: Jahath was the first and Zizah the second[a]; Jeush and Beriah did not have many sons[b], so they became one father’s house for one reckoning.
translation:
  language: de
  text: Jahat war der Erste und Sisa der Zweite.[a] Jeusch und Beria hatten nicht viele Söhne; deshalb wurden sie als ein einziges Vaterhaus gezählt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Sisa wird auch Zisa geschrieben.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zu einem Vaterhaus für eine Erfassung“. Das „Vaterhaus“ bezeichnet eine väterliche Sippen- oder Haushaltseinheit, die hier als eine administrative Einheit erfasst wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַת
  choice: Jahat
  rationale: Der Eigenname wird in einer im Deutschen geläufigen, an der hebräischen Aussprache orientierten Form wiedergegeben.
- source_word: הָרֹאשׁ
  choice: der Erste
  rationale: רֹאשׁ kann „Haupt“ oder „Oberster“ bedeuten; in der Gegenüberstellung mit „der Zweite“ bezeichnet es hier am ehesten die Rang- oder Reihenfolge.
- source_word: זִיזָה
  choice: Sisa
  rationale: Traditionelle deutsche Namensform für זִיזָה; die stärker buchstabennahe Form „Zisa“ wird in der Fußnote genannt.
- source_word: יְעוּשׁ
  choice: Jëusch
  rationale: Die Trema-Schreibung macht kenntlich, dass die Vokale getrennt gesprochen werden, und entspricht einer verbreiteten deutschen Wiedergabe des Namens.
- source_word: בְּרִיעָה
  choice: Beria
  rationale: Geläufige deutsche Wiedergabe des hebräischen Eigennamens.
- source_word: לֹא הִרְבּוּ בָנִים
  choice: hatten nicht viele Söhne
  rationale: Die wörtliche Wendung „vermehrten die Söhne nicht“ wird idiomatisch wiedergegeben; der ausdrücklich männliche Bezug von בָּנִים bleibt erhalten.
- source_word: וַיִּהְיוּ לְבֵית אָב
  choice: bildeten sie ein einziges Vaterhaus
  rationale: Das Verb beschreibt hier den daraus folgenden Status. „Vaterhaus“ bewahrt den technischen Verwandtschaftsbegriff für eine väterliche Sippen- beziehungsweise Haushaltseinheit.
- source_word: לִפְקֻדָּה אֶחָת
  choice: bei der Zählung
  rationale: פְּקֻדָּה bezeichnet in diesem organisatorisch-genealogischen Zusammenhang am ehesten die Erfassung beziehungsweise administrative Zählung als eine Einheit.
