base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/032.yaml
  text: And they were to keep charge of the tent of meeting[a], the charge of the holy place, and the charge of the sons of Aaron their brothers, for the service of the house of Yahweh.
translation:
  language: de
  text: Und sie sollten den Dienst am Zelt der Begegnung, den Dienst am Heiligtum und den Dienst bei den Söhnen Aarons, ihren Brüdern, versehen, für den Dienst am Haus Jahwes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: Und sie sollten … versehen
  rationale: שׁמר bezeichnet hier die pflichtgemäße Wahrnehmung einer übertragenen Aufgabe. Die modale Formulierung gibt im Deutschen den zusammenfassenden Charakter der Dienstanweisung natürlich wieder.
- source_word: מִשְׁמֶרֶת
  choice: Dienst
  rationale: Das dreimalige מִשְׁמֶרֶת meint eine übertragene Obhut, Pflicht oder Dienstaufgabe. »Dienst versehen« ist idiomatisches Deutsch und bewahrt durch die dreifache Wiederholung die Struktur des Hebräischen.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Wiedergabe folgt den beiden hebräischen Bestandteilen transparent; »Stiftshütte« wäre traditioneller, aber für heutige Leser weniger unmittelbar verständlich.
- source_word: הַקֹּדֶשׁ
  choice: Heiligtum
  rationale: Im kultischen Zusammenhang bezeichnet הַקֹּדֶשׁ den heiligen Bereich beziehungsweise das Heiligtum. Das deutsche Wort erhält die mögliche räumliche Weite, ohne unbelegt auf einen einzelnen Innenraum einzuengen.
- source_word: בְּנֵי אַהֲרֹן אֲחֵיהֶם
  choice: die Söhne Aarons, ihre Brüder
  rationale: »Söhne Aarons« bewahrt die familiäre und priesterliche Ausdrucksweise; die Apposition macht deutlich, dass sie als Brüder der Leviten bezeichnet werden.
- source_word: לַעֲבֹדַת
  choice: für den Dienst am
  rationale: עֲבֹדָה bezeichnet hier die am Heiligtum verrichtete Arbeit beziehungsweise den Kultdienst. »Dienst am Haus« ist natürlich und wahrt den sakralen Bezug.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: בֵּית wird wörtlich als »Haus« wiedergegeben; der Gottesname יְהוָה erscheint als »Jahwe«, wodurch der Eigenname erkennbar bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. »Jahwe« gibt ihn im modernen Standarddeutsch als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis des Levitendienstes zu den Söhnen Aarons
  choice: Dienst für die Söhne Aarons
  alternative: Obhut über die Söhne Aarons
  rationale: Die Genitivverbindung מִשְׁמֶרֶת בְּנֵי אַהֲרֹן kann eine ihnen zugeordnete Dienstpflicht bezeichnen. »Für« vermeidet die missverständliche Aussage, die Leviten hätten die Priester beaufsichtigt, ohne das Verhältnis weiter dogmatisch auszugestalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Wiederholung von »Dienst« spiegelt die formale Reihung des Ausgangstextes; der Gedankenstrich markiert den abschließenden Zweckbezug. Keine Fußnote ist erforderlich, da »Heiligtum« die Bedeutungsbreite von הַקֹּדֶשׁ im Deutschen angemessen offenhält.
