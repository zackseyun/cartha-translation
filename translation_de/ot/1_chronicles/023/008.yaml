  text: בְּנֵ֣י לַעְדָּ֗ן הָ/רֹ֧אשׁ יְחִיאֵ֛ל וְ/זֵתָ֥ם וְ/יוֹאֵ֖ל שְׁלֹשָֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/008.yaml
  text: 'The sons of Ladan: Jehiel the head[a], and Zetham and Joel—three.'
translation:
  language: de
  text: 'Die Söhne Ladans: Jehiël, das Haupt[a], und Setam und Joël – drei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Erste«. Das Hebräische kann Jehiël als den führenden oder als den ersten Sohn kennzeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Der hebräische Konstruktplural bedeutet wörtlich »Söhne von«. Da unmittelbar drei Namen aufgezählt werden, ist »Söhne« hier die naheliegende Wiedergabe.
- source_word: לַעְדָּן
  choice: Ladan
  rationale: Der Eigenname wird in einer knappen, dem hebräischen Konsonantenbestand entsprechenden deutschen Form wiedergegeben.
- source_word: הָרֹאשׁ
  choice: das Oberhaupt
  rationale: רֹאשׁ bezeichnet wörtlich den »Kopf« und übertragen das Haupt oder Oberhaupt. Die Wiedergabe wahrt die im Hebräischen mögliche Bedeutung einer führenden Stellung, ohne den Ausdruck eindeutig als Ordnungszahl oder Erstgeburtsangabe zu deuten.
- source_word: יְחִיאֵל
  choice: Jehiël
  rationale: Deutsche Transliteration des hebräischen Eigennamens; das Trema macht die getrennte Aussprache der Vokale kenntlich.
- source_word: וְזֵתָם
  choice: sowie Setam
  rationale: Die Konjunktion und der Eigenname werden natürlich ins Deutsche übertragen; »sowie« vermeidet eine schwerfällige Wiederholung von »und«.
- source_word: וְיוֹאֵל
  choice: und Joël
  rationale: Konjunktion plus Eigenname; das Trema kennzeichnet die getrennte Aussprache der Vokale.
- source_word: שְׁלֹשָׁה
  choice: drei
  rationale: Die ausdrücklich im Hebräischen genannte Gesamtzahl bleibt erhalten.
theological_decisions:
- issue: Bedeutung von הָרֹאשׁ bei Jehiël
  choice: das Oberhaupt
  alternative: der Erste / das Haupt
  rationale: Der Ausdruck kann eine führende Stellung oder möglicherweise Vorrang in der Reihenfolge bezeichnen. »Oberhaupt« gibt die primäre lexikalische Bedeutung wieder; die Fußnote hält die echte Mehrdeutigkeit offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe genealogische Satzform des Hebräischen bleibt erhalten; der Gedankenstrich hebt die abschließende Gesamtzahl hervor.
