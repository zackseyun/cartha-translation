  source_fidelity: Die Aufzählung der drei Söhne und die abschließende Zahl sind zutreffend wiedergegeben. »Oberhaupt« ist jedoch gegenüber הָרֹאשׁ etwas stärker institutionell und kann ein formelles Familien- oder Amtsoberhaupt nahelegen. »das Haupt« gibt den hebräischen Ausdruck unmittelbarer wieder und bewahrt die offene Frage, ob Vorrang bzw. Erststellung oder eine Leitungsfunktion gemeint ist.
  naturalness: Die knappe Listenform ist für eine Genealogie gut verständlich. Die Wiederholung von »und« entspricht der hebräischen Reihung und ist in dieser knappen Aufzählung natürlicher und transparenter als das asymmetrische »sowie … und«.
  terminology: Ladan, Jehiël, Setam und Joël sind als deutsche Namensformen vertretbar. »das Haupt« ist hier der angemessenere, weniger interpretierende Ausdruck als »das Oberhaupt«.
