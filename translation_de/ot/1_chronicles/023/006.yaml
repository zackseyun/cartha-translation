  text: וַ/יֶּֽחָלְקֵ֥/ם דָּוִ֖יד מַחְלְק֑וֹת לִ/בְנֵ֣י לֵוִ֔י לְ/גֵרְשׁ֖וֹן קְהָ֥ת וּ/מְרָרִֽיס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/006.yaml
  text: 'David divided them into divisions for the sons of Levi: Gershon[a], Kohath, and Merari.'
translation:
  language: de
  text: 'David teilte sie für die Söhne Levis in Abteilungen ein: Gerschon[a], Kehat und Merari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für Gerschon, Kehat und Merari“; die Präposition kann die Namensreihe ausdrücklich einleiten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: teilte sie … ein
  rationale: Das Piel von חלק bezeichnet hier das Einteilen beziehungsweise Aufteilen. Das Objektsuffix der 3. Person Plural wird mit „sie“ ausdrücklich wiedergegeben.
- source_word: מַחְלְקוֹת
  choice: in Abteilungen
  rationale: Das Substantiv bezeichnet geordnete Abteilungen oder Dienstgruppen. Zusammen mit „teilte … ein“ gibt „in Abteilungen“ den resultativen Sinn natürlich und quellennah wieder.
- source_word: לִבְנֵי לֵוִי
  choice: für die Söhne Levis
  rationale: Die wörtliche genealogische Formulierung bleibt erhalten und bereitet die anschließenden Namen der drei Söhne beziehungsweise Hauptlinien Levis vor.
- source_word: לְגֵרְשׁוֹן קְהָת וּמְרָרִי
  choice: Gerschon, Kehat und Merari
  rationale: Die drei Namen werden als erläuternde Aufzählung nach dem Doppelpunkt verstanden. Das ל vor Gerschon kann auch ausdrücklich auf die gesamte Namensreihe bezogen werden; diese Möglichkeit wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die genealogische Wendung „Söhne Levis“ bleibt statt der glatteren Bezeichnung „Leviten“ erhalten; „teilte … in Abteilungen ein“ ist idiomatisch und bildet zugleich die Wortverwandtschaft des hebräischen Verbs und Substantivs sinngemäß ab.
