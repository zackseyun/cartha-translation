base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/012.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel—four.'
translation:
  language: de
  text: 'Die Söhne Kehats: Amram, Jizhar, Hebron und Usiël – vier insgesamt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Der Status constructus Plural von בֵּן leitet hier eine genealogische Namensliste ein. Da unmittelbar vier einzelne Söhne genannt werden, ist „Söhne“ genauer als das weiter gefasste „Nachkommen“.
- source_word: קְהָת
  choice: Kehat
  rationale: Die im Deutschen gebräuchliche biblische Namensform wird verwendet.
- source_word: עַמְרָם
  choice: Amram
  rationale: Gebräuchliche deutsche Wiedergabe des Personennamens.
- source_word: יִצְהָר
  choice: Jizhar
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens; das anlautende J entspricht der traditionellen deutschen Transliteration.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Gebräuchliche deutsche Namensform. Im genealogischen Zusammenhang bezeichnet der Name hier eine Person, nicht den gleichnamigen Ort.
- source_word: וְעֻזִּיאֵל
  choice: und Usiël
  rationale: Die Konjunktion wird natürlich mit „und“ wiedergegeben; „Usiël“ ist eine etablierte deutsche Namensform und die Diärese macht die getrennte Aussprache der Vokale sichtbar.
- source_word: אַרְבָּעָה
  choice: vier insgesamt
  rationale: Die Kardinalzahl fasst die Zahl der zuvor genannten Söhne zusammen. „Insgesamt“ macht diese summierende Funktion im Deutschen natürlich und eindeutig deutlich.
