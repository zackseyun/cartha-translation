source:
  edition: WLC
  text: וְ/לַ/עֲמֹד֙ בַּ/בֹּ֣קֶר בַּ/בֹּ֔קֶר לְ/הֹד֥וֹת וּ/לְ/הַלֵּ֖ל לַ/יהוָ֑ה וְ/כֵ֖ן לָ/עָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/030.yaml
  text: and to stand every morning to give thanks and to praise Yahweh[a], and likewise at evening,
translation:
  language: de
  text: und Morgen für Morgen dazustehen, um Yahweh zu danken und zu loben, ebenso am Abend.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לַ/עֲמֹד
  choice: und … bereit zu stehen
  rationale: Der Infinitiv bezeichnet im Zusammenhang die zugewiesene regelmäßige Pflicht. „Bereit zu stehen“ bewahrt die konkrete Vorstellung des Stehens und klingt im Deutschen natürlicher als das bloße „zu stehen“.
- source_word: בַּ/בֹּקֶר בַּ/בֹּקֶר
  choice: Morgen für Morgen
  rationale: Die Wiederholung ist distributiv und bezeichnet eine regelmäßig wiederkehrende tägliche Aufgabe. „Morgen für Morgen“ bildet zugleich die hebräische Wiederholung anschaulich und idiomatisch ab.
- source_word: לְ/הֹדֹות
  choice: zu danken
  rationale: ידה im Hifil bezeichnet in diesem gottesdienstlichen Zusammenhang das Danken beziehungsweise dankende Preisen.
- source_word: וּ/לְ/הַלֵּל
  choice: und … zu loben
  rationale: הלל im Piel bedeutet „loben“. Eine musikalische Ausführung ist möglich, wird vom Verb selbst aber nicht ausdrücklich bezeichnet.
- source_word: לַ/יהוָה
  choice: Yahweh
  rationale: Der hebräische Text nennt das Tetragramm יהוה; die Wiedergabe „Yahweh“ bewahrt den persönlichen Gottesnamen.
- source_word: וְ/כֵן
  choice: ebenso auch
  rationale: Die Wendung überträgt dieselbe Aufgabe vom Morgen auf den Abend.
- source_word: לָ/עָרֶב
  choice: am Abend
  rationale: Die Präpositionalverbindung bezeichnet den entsprechenden abendlichen Zeitpunkt; „am Abend“ ist natürliches modernes Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Yahweh“ gibt ihn als Namen wieder, statt ihn durch den traditionellen Ersatztitel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die formale Dienstsituation bleibt durch „bereit zu stehen“ erkennbar; „Morgen für Morgen“ bewahrt die markante distributive Wiederholung des Hebräischen.
