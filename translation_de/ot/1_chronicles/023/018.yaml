- source_word: שְׁלֹמִית
  choice: Schelomit
  rationale: Der Personenname wird in einer im Deutschen geläufigen, quellennahen Form transliteriert.
- source_word: הָרֹאשׁ
  choice: das Oberhaupt
  rationale: רֹאשׁ mit Artikel bezeichnet hier wahrscheinlich die führende Person innerhalb der genealogischen Gruppe. „Oberhaupt“ ist im Deutschen natürlich und bringt Rang beziehungsweise Leitungsstellung zum Ausdruck.
