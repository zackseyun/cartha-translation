base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/003.yaml
  text: The Levites were counted from thirty years old and upward[a], and their number by heads, man by man, was thirty-eight thousand.
translation:
  language: de
  text: Die Leviten im Alter von dreißig Jahren und älter wurden gezählt. Kopf für Kopf[a] waren es 38.000 Männer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nach ihren Köpfen, nach Männern«; gemeint ist die Einzelzählung der erwachsenen Männer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּפְרוּ
  choice: wurden … gezählt
  rationale: Die passive Wiedergabe entspricht der Nifal-Form und bezeichnet eine Zählung der Leviten.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Dies ist die geläufige deutsche Bezeichnung für die Angehörigen des Stammes Levi.
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמָעְלָה
  choice: vom Alter von dreißig Jahren an
  rationale: Die Formulierung gibt die untere Altersgrenze natürlich und genau wieder.
- source_word: וַיְהִי מִסְפָּרָם
  choice: waren es
  rationale: Im Deutschen führt diese knappe Formulierung die Gesamtzahl natürlich ein.
- source_word: לְגֻלְגְּלֹתָם
  choice: Kopf für Kopf
  rationale: Die Wendung bewahrt das konkrete Bild des hebräischen Ausdrucks und macht zugleich die Einzelzählung deutlich.
- source_word: לִגְבָרִים
  choice: Männer
  rationale: Der Ausdruck bezeichnet hier die gezählten männlichen Erwachsenen und wird daher geschlechtsspezifisch wiedergegeben.
- source_word: שְׁלֹשִׁים וּשְׁמוֹנָה אָלֶף
  choice: '38.000'
  rationale: Direkte Wiedergabe der genannten Gesamtzahl in üblicher deutscher Zahlenschreibweise.
