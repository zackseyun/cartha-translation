source:
  edition: WLC
  text: וְ/דָוִ֥יד זָקֵ֖ן וְ/שָׂבַ֣ע יָמִ֑ים וַ/יַּמְלֵ֛ךְ אֶת שְׁלֹמֹ֥ה בְנ֖/וֹ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/001.yaml
  text: David was old and full of days[a], and he made his son Solomon king over Israel.
translation:
  language: de
  text: David war alt und lebenssatt[a], und er machte seinen Sohn Salomo zum König über Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hochbetagt“; wörtlich: „alt und satt an Tagen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: war alt
  rationale: Die Zustandsform beschreibt Davids fortgeschrittenes Alter. „War alt“ ist knapp, natürlich und fügt dem Hebräischen keine zusätzliche Wertung hinzu.
- source_word: וְשָׂבַע יָמִים
  choice: und lebenssatt
  rationale: Die hebräische Wendung bedeutet wörtlich, mit Tagen gesättigt zu sein. „Lebenssatt“ bewahrt das Bild und den Gedanken eines erreichten vollen Lebensalters; eine Fußnote nennt die wörtliche Form und eine nüchternere Alternative.
- source_word: וַיַּמְלֵךְ
  choice: er machte … zum König
  rationale: 'Die Hifil-Form ist kausativ: David setzte Salomo als König ein. Die Formulierung wahrt diese Bedeutung, ohne eine im Text nicht erwähnte Krönungszeremonie vorauszusetzen.'
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: seinen Sohn Salomo
  rationale: Diese im Deutschen natürliche Wortstellung erhält die ausdrücklich genannte Sohnschaft.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: Die Präposition bezeichnet hier den Herrschaftsbereich. „Über Israel“ gibt dies unmittelbar wieder; „ganz Israel“ wäre ein nicht ausdrücklich vorhandener Zusatz.
- source_word: וְ
  choice: und
  rationale: Das anlautende Waw führt die Erzählung fort. Im Deutschen ist kein zusätzliches zeitliches „nun“ erforderlich.
