lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Der Status constructus im Plural leitet hier eine genealogische Aufzählung der unmittelbaren Söhne Moses ein. „Die Söhne“ ist direkt und im Deutschen natürlich.
- source_word: מֹשֶׁה
  choice: Moses
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: גֵּרְשֹׁם
  choice: Gerschom
  rationale: Die Form gibt den hebräischen Namen גֵּרְשֹׁם nach üblicher deutscher Bibeltradition wieder und unterscheidet ihn von dem ähnlich lautenden Gerschon.
- source_word: וֶאֱלִיעֶזֶר
  choice: und Eliëser
  rationale: Die Konjunktion ו wird additiv mit „und“ wiedergegeben. „Eliëser“ entspricht der im Deutschen gebräuchlichen Form dieses Namens und ist von Eleasar zu unterscheiden.
