  yaml_path: translation/ot/1_chronicles/023/010.yaml
  text: 'And the sons of Shimei: Jahath[a], Zina, Jeush, and Beriah. These were the sons of Shimei—four.'
translation:
  language: de
  text: 'Und die Söhne Schimis: Jahat, Sina[a], Jëusch und Berija. Das waren die vier Söhne Schimis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In 1. Chronik 23,11 lautet der Name „Sisa“. Der hebräische Text dieses Verses hat „Sina“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעִי
  choice: Und die Söhne Schimis waren
  rationale: Das ו wird als einfache Verknüpfung mit „Und“ wiedergegeben. Die deutsche Formulierung ergänzt idiomatisch „waren“ und bewahrt die genealogische Wendung „die Söhne Schimis“.
- source_word: יַחַת
  choice: Jahat
  rationale: Der Personenname wird in einer im Deutschen üblichen, am Hebräischen orientierten Form wiedergegeben.
- source_word: זִינָא
  choice: Sina
  rationale: Die Namensform folgt dem masoretischen Text זִינָא. Die abweichende Form „Sisa“ aus dem folgenden Vers wird in einer Fußnote erwähnt.
- source_word: וִיעוּשׁ
  choice: Jëusch
  rationale: Der Personenname wird so geschrieben, dass die getrennte Aussprache der Vokale im Deutschen erkennbar bleibt; die vorangestellte Konjunktion wird durch die Listenstruktur ausgedrückt.
- source_word: וּבְרִיעָה
  choice: und Berija
  rationale: Der Name wird am Hebräischen orientiert transliteriert; die Konjunktion schließt die Aufzählung ab.
- source_word: אֵלֶּה בְנֵי שִׁמְעִי אַרְבָּעָה
  choice: Das waren die vier Söhne Schimis
  rationale: Die hebräische Nominalkonstruktion wird in natürliches Deutsch übertragen. Die Zahl wird attributiv eingebunden, ohne den Inhalt zu verändern.
