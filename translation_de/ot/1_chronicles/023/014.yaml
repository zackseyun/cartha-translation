  text: וּ/מֹשֶׁ֖ה אִ֣ישׁ הָ/אֱלֹהִ֑ים בָּנָ֕י/ו יִקָּרְא֖וּ עַל שֵׁ֥בֶט הַ/לֵּוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/014.yaml
  text: And as for Moses, the man of God, his sons were counted among the tribe of Levi.
translation:
  language: de
  text: Mose aber, der Mann Gottes, dessen Söhne wurden dem Stamm Levi zugerechnet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die feste hebräische Ehrenbezeichnung wird formal und im Deutschen idiomatisch wiedergegeben.
- source_word: יִקָּרְאוּ עַל שֵׁבֶט הַלֵּוִי
  choice: wurden dem Stamm Levi zugerechnet
  rationale: Wörtlich steht hier etwa „wurden über/bei dem Stamm Levi genannt“. Im genealogisch-organisatorischen Zusammenhang bezeichnet die Wendung ihre Zuordnung beziehungsweise Eintragung beim Stamm Levi; „zugerechnet“ bewahrt diesen Sinn, ohne eine besondere Berufung zu unterstellen.
theological_decisions:
- issue: Status der Söhne Moses innerhalb Levis
  choice: dem Stamm Levi zugerechnet
  alternative: zum Stamm Levi berufen / nach dem Stamm Levi benannt
  rationale: Der Vers beschreibt ihre stammesmäßige Zuordnung, nicht eine geistliche Berufung. Zugleich wird nicht präzisiert, welche konkrete administrative Form diese Zuordnung annahm.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Voranstellung „Mose aber“ bildet den hebräischen Themenwechsel ab; „dessen Söhne“ hält die markierte Satzführung natürlich lesbar.
