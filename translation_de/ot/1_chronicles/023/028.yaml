revisions:
- from: 'Denn ihre Aufgabe[a] war es, den Söhnen Aarons[b] beim Dienst am Haus Jahwes zur Seite zu stehen: bei den Vorhöfen und den Kammern, bei der Reinigung alles Heiligen[c] und bei allen Arbeiten für den Dienst am Haus Gottes.'
  to: 'Denn ihre Aufgabe[a] war es, den Söhnen Aarons[b] beim Dienst am Haus Jahwes zur Seite zu stehen: für die Vorhöfe und die Kammern, für die Reinigung alles Heiligen[c] und für die Arbeit des Dienstes am Haus Gottes.'
  rationale: Die Revision verdeutlicht die im Hebräischen ausgedrückten Verantwortungsbereiche durch „für“ und entfernt die nicht belegte Erweiterung „allen Arbeiten“. Die unterstützende Rolle gegenüber den Aaroniden, die Tempelterminologie und die Offenheit von „alles Heiligen“ bleiben erhalten.
