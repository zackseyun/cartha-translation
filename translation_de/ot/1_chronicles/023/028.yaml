  text: כִּ֣י מַעֲמָדָ֞/ם לְ/יַד בְּנֵ֣י אַהֲרֹ֗ן לַ/עֲבֹדַת֙ בֵּ֣ית יְהוָ֔ה עַל הַ/חֲצֵרוֹת֙ וְ/עַל הַ/לְּשָׁכ֔וֹת וְ/עַֽל טָהֳרַ֖ת לְ/כָל קֹ֑דֶשׁ וּ/מַֽעֲשֵׂ֔ה עֲבֹדַ֖ת בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/028.yaml
  text: For their duty was to assist the sons of Aaron in the service of the house of Yahweh, concerning the courts and the chambers, and the purification of all that is holy, and the work of the service of the house of God.
translation:
  language: de
  text: 'Denn ihre Aufgabe[a] war es, den Söhnen Aarons[b] beim Dienst am Haus Jahwes zur Seite zu stehen: für die Vorhöfe und die Kammern, für die Reinigung alles Heiligen[c] und für die Arbeit des Dienstes am Haus Gottes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Dienstposten“ beziehungsweise „ihr Amt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „an der Hand der Söhne Aarons“; gemeint ist ein Dienst an ihrer Seite beziehungsweise zu ihrer Unterstützung.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „bei der Reinigung jedes heiligen Gegenstands“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang eine begründende beziehungsweise erläuternde Aussage ein.
- source_word: מַעֲמָדָם
  choice: ihre Aufgabe
  rationale: Bezeichnet hier die den Leviten zugewiesene Stellung und Dienstpflicht; „Aufgabe“ gibt den funktionalen Sinn natürlich wieder.
- source_word: לְיַד בְּנֵי אַהֲרֹן
  choice: den Söhnen Aarons zur Seite zu stehen
  rationale: Bewahrt das Bild „an der Hand/Seite“ und bringt den unterstützenden Dienst zum Ausdruck, ohne eine weitergehende Hierarchie festzuschreiben.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: beim Dienst am Haus Jahwes
  rationale: עֲבֹדָה bezeichnet den Tempeldienst; „Haus Jahwes“ bewahrt die Tempelbezeichnung und gibt den Gottesnamen wieder.
- source_word: עַל הַחֲצֵרוֹת וְעַל הַלְּשָׁכוֹת
  choice: bei den Vorhöfen und den Kammern
  rationale: עַל kennzeichnet hier Zuständigkeitsbereiche. „Vorhöfe“ bezeichnet die Tempelhöfe, „Kammern“ die zugehörigen Räume.
- source_word: וְעַל טָהֳרַת לְכָל קֹדֶשׁ
  choice: bei der Reinigung alles Heiligen
  rationale: Die Formulierung wahrt den kollektiven und kultischen Sinn von קֹדֶשׁ, ohne die gemeinten heiligen Dinge näher zu bestimmen.
- source_word: וּמַעֲשֵׂה עֲבֹדַת בֵּית הָאֱלֹהִים
  choice: und bei allen Arbeiten für den Dienst am Haus Gottes
  rationale: Gibt die Verbindung von מַעֲשֶׂה und עֲבֹדָה verständlich wieder und bewahrt zugleich die umfassende Aussage über die Tempelarbeiten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; „Jahwe“ gibt den Eigennamen im modernen Deutschen wieder.
- issue: Verhältnis der Leviten zu den Söhnen Aarons
  choice: zur Seite zu stehen
  alternative: unter der Leitung der Söhne Aarons zu dienen
  rationale: Die gewählte Formulierung bewahrt die unterstützende Beziehung, ohne aus dem Idiom eine ausdrücklich hierarchische Aussage abzuleiten.
- issue: Bedeutung von טָהֳרַת לְכָל קֹדֶשׁ
  choice: Reinigung alles Heiligen
  alternative: Reinigung jedes heiligen Gegenstands
  rationale: Der Singular קֹדֶשׁ ist kollektiv und bleibt hinsichtlich der konkreten Gegenstände offen; diese Offenheit wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde zur besseren Verständlichkeit mit einem Doppelpunkt gegliedert. „Zur Seite stehen“ wahrt das hebräische Bild und die sachliche Spannung zwischen Zusammenarbeit und untergeordneter Unterstützung.
