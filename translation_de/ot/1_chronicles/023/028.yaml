review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die wesentlichen kultisch-administrativen Begriffe sind treffend wiedergegeben. „bei den Vorhöfen und den Kammern“ gibt die mit עַל bezeichneten Zuständigkeitsbereiche jedoch zu unbestimmt wieder. Außerdem fügt „bei allen Arbeiten“ mit „allen“ und dem Plural eine im Hebräischen nicht ausdrücklich vorhandene Nuancierung hinzu; מַעֲשֵׂה steht hier im Singular als „Arbeit/Werk“ in Verbindung mit „Dienst“.
  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. Die wiederholte Präposition „bei“ ist allerdings bei Zuständigkeiten für bauliche Bereiche und für Reinigungsaufgaben weniger idiomatisch als „für“.
  terminology: „Jahwe“, „Söhne Aarons“, „Dienst“, „Vorhöfe“, „Kammern“ und „Haus Gottes“ sind sachgerecht. „Reinigung alles Heiligen“ bewahrt die kollektive und nicht näher bestimmte Bedeutung von קֹדֶשׁ angemessen.
  issues:
  - severity: medium
    issue: Die Zuständigkeit für Vorhöfe und Kammern ist mit „bei den Vorhöfen und den Kammern“ zu schwach beziehungsweise lokal gefasst.
    rationale: עַל leitet hier Bereiche der Dienstzuständigkeit ein. „für die Vorhöfe und die Kammern“ bringt diese Funktion im Deutschen klarer zum Ausdruck, ohne eine stärkere konkrete Aufsichtsfunktion zu behaupten.
  - severity: medium
    issue: „bei allen Arbeiten“ ergänzt Quantität und Pluralität.
    rationale: Der hebräische Ausdruck וּמַעֲשֵׂה עֲבֹדַת בֵּית הָאֱלֹהִים lautet wörtlich etwa „und die Arbeit des Dienstes des Hauses Gottes“. Weder „alle“ noch ein Plural von „Arbeit“ ist im Ausgangstext markiert.
