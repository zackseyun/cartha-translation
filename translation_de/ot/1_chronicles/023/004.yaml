source:
  edition: WLC
  text: מֵ/אֵ֗לֶּה לְ/נַצֵּ֨חַ֙ עַל מְלֶ֣אכֶת בֵּית יְהוָ֔ה עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָ֑לֶף וְ/שֹׁטְרִ֥ים וְ/שֹׁפְטִ֖ים שֵׁ֥שֶׁת אֲלָפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/004.yaml
  text: Of these, twenty-four thousand were to oversee the work of the house of Yahweh, and six thousand were officers and judges.
translation:
  language: de
  text: Von diesen sollten vierundzwanzigtausend die Arbeit im Haus Yahwehs beaufsichtigen, und sechstausend sollten Amtsträger und Richter sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: Von diesen
  rationale: Die Präposition מִן mit dem Demonstrativ bezeichnet eine Teilmenge der zuvor genannten Leviten; „Von diesen“ gibt diesen partitiven Sinn im Deutschen natürlich wieder.
- source_word: לְנַצֵּחַ
  choice: sollten … beaufsichtigen
  rationale: Der Piel-Infinitiv von נצח bezeichnet hier die Leitung beziehungsweise Beaufsichtigung von Arbeiten. Die Formulierung gibt zugleich den Sinn einer Zuweisung oder Bestimmung wieder.
- source_word: עַל מְלֶאכֶת
  choice: die Arbeit am
  rationale: מְלָאכָה bezeichnet Arbeit oder Aufgabe. In Verbindung mit עַל und dem Verb der Aufsicht ist „die Arbeit am“ idiomatisch und bleibt umfassender als eine Eingrenzung auf kultischen Dienst.
- source_word: בֵּית יְהוָה
  choice: Haus Yahwehs
  rationale: „Haus“ bewahrt die konkrete hebräische Bezeichnung, ohne sie deutend durch „Tempel“ zu ersetzen; der Gottesname יְהוָה wird als „Yahweh“ wiedergegeben.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: vierundzwanzigtausend
  rationale: Direkte Wiedergabe der Kardinalzahl; im laufenden Text ausgeschrieben.
- source_word: וְשֹׁטְרִים
  choice: Aufseher
  rationale: שֹׁטְרִים bezeichnet Amtsträger mit ordnender oder verwaltender Funktion. „Aufseher“ ist hier verständlich und unterscheidet die Aufgabe von der richterlichen Funktion.
- source_word: וְשֹׁפְטִים
  choice: Richter
  rationale: Direkte und natürliche Wiedergabe für Personen, die richterliche Aufgaben ausüben.
- source_word: שֵׁשֶׁת אֲלָפִים
  choice: sechstausend
  rationale: Direkte Wiedergabe der Kardinalzahl, entsprechend der ersten Zahl ausgeschrieben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält das Tetragramm ausdrücklich. „Yahweh“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah an der hebräischen Aufteilung der Leviten, wird jedoch durch „sollten“ und ein Semikolon natürlich lesbar gemacht.
