revisions:
- from: Von diesen sollten vierundzwanzigtausend die Arbeit am Haus Yahwehs beaufsichtigen; sechstausend waren Aufseher und Richter.
  to: Von diesen sollten vierundzwanzigtausend die Arbeit im Haus Yahwehs beaufsichtigen, und sechstausend sollten Amtsträger und Richter sein.
  rationale: Die Revision vermeidet die mögliche baubezogene Verengung von „Arbeit am Haus“, gibt שֹׁטְרִים weiter gefasst als „Amtsträger“ wieder und stellt die parallele Zuweisung beider Gruppen klar. Zahlen, Gottesname und die grundlegende Satzstruktur bleiben erhalten.
