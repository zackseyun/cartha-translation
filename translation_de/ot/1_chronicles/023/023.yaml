lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Der Status constructus des Plurals von »Sohn« leitet eine Liste unmittelbarer Söhne ein; »Nachkommen« wäre hier unnötig weit gefasst.
- source_word: מוּשִׁי
  choice: Muschis
  rationale: Der Personenname wird in der im Deutschen geläufigen biblischen Form wiedergegeben und wegen der Konstruktion mit »Söhne« in den Genitiv gesetzt.
- source_word: מַחְלִי
  choice: Machli
  rationale: Transliteration des Personennamens in einer geläufigen deutschen Form.
- source_word: וְעֵדֶר
  choice: Eder
  rationale: Der Personenname wird transliteriert; die hebräische Konjunktion wird in der deutschen Aufzählung erst vor dem letzten Glied als »und« ausgedrückt.
- source_word: וִירֵמוֹת
  choice: und Jeremot
  rationale: Die Konjunktion wird mit »und« wiedergegeben; der Personenname erscheint in einer natürlichen deutschen Transliteration.
- source_word: שְׁלֹשָׁה
  choice: drei
  rationale: Die Kardinalzahl fasst die Zahl der aufgeführten Söhne abschließend zusammen; ein Gedankenstrich bildet diese Listenstruktur klar ab.
