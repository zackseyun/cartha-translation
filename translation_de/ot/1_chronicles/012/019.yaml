source:
  edition: WLC
  text: וְ/ר֣וּחַ לָבְשָׁ֗ה אֶת עֲמָשַׂי֮ רֹ֣אשׁ ה/שלושים לְ/ךָ֤ דָוִיד֙ וְ/עִמְּ/ךָ֣ בֶן יִשַׁ֔י שָׁל֨וֹם שָׁל֜וֹם לְ/ךָ֗ וְ/שָׁלוֹם֙ לְ/עֹ֣זְרֶ֔/ךָ כִּ֥י עֲזָרְ/ךָ֖ אֱלֹהֶ֑י/ךָ וַ/יְקַבְּלֵ֣/ם דָּוִ֔יד וַֽ/יִּתְּנֵ֖/ם בְּ/רָאשֵׁ֥י הַ/גְּדֽוּד־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/019.yaml
  text: And the Spirit clothed Amasai, chief of the Thirty, and he said, “Yours are we, David, and with you, son of Jesse! Peace, peace to you, and peace to your helpers, for your God helps you.” Then David received them and made them chiefs of the troops.
translation:
  language: de
  text: 'Da erfüllte der Geist Amasai[a], den Anführer der Dreißig, und er sagte:


    »Dir gehören wir, David,


    und zu dir halten wir, Sohn Isais!


    Frieden, Frieden sei mit dir,


    und Frieden sei allen, die dir helfen[b],


    denn dein Gott hilft dir[c].«


    Darauf nahm David sie auf und setzte sie zu Anführern der Truppe ein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Da bekleidete der Geist Amasai.« Möglich ist auch: »Da bekleidete ein Geist Amasai.«'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »und Frieden sei deinem Helfer«. Die hebräische Einzahl kann kollektiv gemeint sein.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »denn dein Gott hat dir geholfen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ לָבְשָׁה
  choice: Da erfüllte der Geist
  rationale: Das Hebräische sagt bildhaft, dass der Geist Amasai »bekleidete«. »Erfüllte« gibt die göttliche Ermächtigung in natürlichem Deutsch wieder; die wörtliche Metapher und die mögliche unbestimmte Lesart werden in der Fußnote bewahrt.
- source_word: רֹאשׁ הַשְּׁלֹשִׁים
  choice: das Oberhaupt der Dreißig
  rationale: רֹאשׁ bezeichnet den Anführer oder das Oberhaupt; »die Dreißig« wird als Bezeichnung einer bekannten militärischen Gruppe verstanden.
- source_word: לְךָ דָוִיד
  choice: Dir gehören wir, David
  rationale: Die knappe hebräische Nominalformel erklärt die Zugehörigkeit und Loyalität gegenüber David; die Voranstellung von »Dir« bewahrt den Nachdruck.
- source_word: וְעִמְּךָ בֶן יִשַׁי
  choice: und zu dir halten wir, Sohn Isais
  rationale: Die verblos formulierte Wendung bedeutet, dass Amasai und seine Leute auf Davids Seite stehen. »Zu dir halten wir« ist idiomatisch und erhält den parallelen Bekenntnischarakter.
- source_word: שָׁלוֹם שָׁלוֹם לְךָ
  choice: Frieden, Frieden sei mit dir
  rationale: Die emphatische Wiederholung von שָׁלוֹם bleibt erhalten.
- source_word: וְשָׁלוֹם לְעֹזְרֶךָ
  choice: und Frieden mit allen, die dir helfen
  rationale: Das singularische Partizip kann kollektiv verstanden werden. Der folgende Plural und der Zusammenhang sprechen für Davids Helfer als Gruppe.
- source_word: כִּי עֲזָרְךָ אֱלֹהֶיךָ
  choice: denn dein Gott hilft dir
  rationale: Das Perfekt kann eine bereits erwiesene oder fortdauernd gültige Hilfe bezeichnen. Der deutsche Präsenssatz drückt hier Gottes wirksame Unterstützung aus; die perfektische Möglichkeit steht in der Fußnote.
- source_word: וַיְקַבְּלֵם
  choice: nahm David sie auf
  rationale: קבל bedeutet empfangen oder annehmen; »aufnehmen« passt zur Eingliederung der Männer in Davids Verband.
- source_word: וַיִּתְּנֵם בְּרָאשֵׁי הַגְּדוּד
  choice: setzte sie als Anführer der Truppe ein
  rationale: Die Wendung bezeichnet ihre Einsetzung in Leitungspositionen. הַגְּדוּד steht im Hebräischen im Singular und wird daher als »die Truppe« wiedergegeben.
theological_decisions:
- issue: Ob רוּחַ Gottes Geist oder einen unbestimmten Geist beziehungsweise Antrieb bezeichnet
  choice: der Geist
  alternative: 'ein Geist; wörtlich: der Geist bekleidete Amasai'
  rationale: Der Zusammenhang in den Chronikbüchern und die Ermächtigungsformel legen Gottes Geist nahe. Da im Hebräischen kein Artikel steht und die Identifikation nicht ausdrücklich ausformuliert wird, bleibt die alternative Lesart in der Fußnote sichtbar.
- issue: Zeitlicher Aspekt von עֲזָרְךָ
  choice: dein Gott hilft dir
  alternative: dein Gott hat dir geholfen
  rationale: Die Aussage kann Gottes gegenwärtige beziehungsweise charakteristische Unterstützung oder eine bereits erwiesene Hilfe bezeichnen; der Haupttext wählt die kontextuell passende fortdauernde Aussage, ohne die andere Möglichkeit zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetisch-prophetische Rede ist zeilenweise gesetzt; Wiederholung und Loyalitätsformel bleiben erhalten. »Isai« folgt der im Deutschen etablierten biblischen Namensform.
