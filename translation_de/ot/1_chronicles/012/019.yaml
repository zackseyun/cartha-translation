    issue: „und Frieden mit allen, die dir helfen“
    rationale: Das hebräische לְעֹזְרֶךָ bedeutet „deinem Helfer“ bzw. kollektiv „deinen Helfern [sei Frieden]“. „mit“ verschiebt die syntaktische Beziehung. Die kollektive Auslegung kann beibehalten werden, sollte aber als Dativ formuliert sein.
  - severity: low
    issue: „das Oberhaupt der Dreißig“
    rationale: Die Formulierung ist möglich, aber „der Anführer der Dreißig“ ist im modernen Standarddeutsch idiomatischer und gibt רֹאשׁ im militärischen Kontext präzise wieder.
  - severity: low
    issue: „setzte sie als Anführer der Truppe ein“
    rationale: „Zu Anführern“ gibt die Ernennung bzw. Einsetzung idiomatischer wieder; die Bedeutung bleibt unverändert.
