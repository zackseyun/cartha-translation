  to: 'Da erfüllte der Geist Amasai[a], den Anführer der Dreißig, und er sagte:


    »Dir gehören wir, David,


    und zu dir halten wir, Sohn Isais!


    Frieden, Frieden sei mit dir,


    und Frieden sei allen, die dir helfen[b],


    denn dein Gott hilft dir[c].«


    Darauf nahm David sie auf und setzte sie zu Anführern der Truppe ein.'
  rationale: Die Revision korrigiert die Richtung der Friedenswünschung („allen, die dir helfen“ statt „mit allen, die dir helfen“) und glättet zwei deutsche Rang- und Einsetzungsformulierungen. Die im Hebräischen bildhafte Geistformel, die mögliche Singularlesart bei „Helfer“ und der aspektuell offene Sinn von „hat geholfen/hilft“ bleiben durch die Fußnoten transparent.
  reviewer_model: gpt-5.6-terra
