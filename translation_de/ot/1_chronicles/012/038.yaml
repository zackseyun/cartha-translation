  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das im Deutschen nötige Verb „kamen“ wird aus dem fortlaufenden Satzgefüge ergänzt; der hebräische Vers ist syntaktisch Teil der umgebenden Aufzählung.
