  text: וּ/מֵ/עֵ֣בֶר לַ֠/יַּרְדֵּן מִן הָ/ראוּבֵנִ֨י וְ/הַ/גָּדִ֜י וַ/חֲצִ֣י שֵׁ֣בֶט מְנַשֶּׁ֗ה בְּ/כֹל֙ כְּלֵי֙ צְבָ֣א מִלְחָמָ֔ה מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָֽלֶף־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/038.yaml
  text: And from beyond the Jordan[a], from the Reubenites, the Gadites, and the half-tribe of Manasseh, with every kind of military equipment for war, there were one hundred twenty thousand.
translation:
  language: de
  text: Und von jenseits des Jordan[a], von den Rubenitern, den Gaditern und dem halben Stamm Manasse, kamen 120.000 mit aller Kriegsausrüstung für den Kampf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der anderen Seite des Jordan“. Die hebräische Wendung kann je nach geografischem Standpunkt unterschiedlich verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לַיַּרְדֵּן
  choice: Und von jenseits des Jordan
  rationale: Die Wendung bezeichnet das Gebiet auf der anderen Seite des Jordan, ohne den geografischen Standpunkt ausdrücklich festzulegen. „Jenseits des Jordan“ bewahrt diese Perspektivabhängigkeit knapp und würdig.
- source_word: מִן הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: von den Rubenitern, den Gaditern und dem halben Stamm Manasse
  rationale: Die singularischen Volksbezeichnungen sind kollektiv gebraucht und werden im Deutschen natürlich im Plural wiedergegeben. „Der halbe Stamm Manasse“ entspricht der hebräischen Stammesbezeichnung.
- source_word: בְּכֹל כְּלֵי צְבָא מִלְחָמָה
  choice: mit Kriegsgerät aller Art für den Kampf
  rationale: כְּלֵי bezeichnet Geräte oder Ausrüstungsgegenstände und umfasst im militärischen Zusammenhang mehr als nur einzelne Waffen. „Aller Art“ gibt בְּכֹל idiomatisch wieder, ohne die Formulierung bloß zu „voll ausgerüstet“ zu verallgemeinern.
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: '120.000'
  rationale: Die Zahl wird nach heutiger deutscher Schreibkonvention klar und knapp als Ziffer wiedergegeben.
theological_decisions: []
