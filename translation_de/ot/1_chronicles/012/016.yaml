  text: אֵ֣לֶּה הֵ֗ם אֲשֶׁ֨ר עָבְר֤וּ אֶת הַ/יַּרְדֵּן֙ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן וְ/ה֥וּא מְמַלֵּ֖א עַל כָּל גדיתי/ו וַ/יַּבְרִ֨יחוּ֙ אֶת כָּל הָ֣/עֲמָקִ֔ים לַ/מִּזְרָ֖ח וְ/לַֽ/מַּעֲרָֽב־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/016.yaml
  text: These are the men who crossed the Jordan in the first month[a], when it was overflowing all its banks, and they put to flight all those in the valleys, to the east and to the west.
translation:
  language: de
  text: Das sind die Männer, die im ersten Monat den Jordan überquerten, als er all seine Ufer überschwemmte. Sie trieben alle Bewohner der Täler nach Osten und nach Westen in die Flucht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle Täler“. Gemeint sind die Menschen, die in den Tälern lebten, da das Verb „in die Flucht treiben“ Personen als Objekt voraussetzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הֵם
  choice: Das sind die Männer
  rationale: Die emphatische Identifikationsformel wird im Deutschen natürlich mit „Das sind“ wiedergegeben; „die Männer“ ist aus dem Zusammenhang mit den Kriegern ergänzt.
- source_word: אֲשֶׁר עָבְרוּ אֶת הַיַּרְדֵּן
  choice: die … den Jordan überquerten
  rationale: עָבַר bezeichnet hier konkret das Überqueren eines Gewässers.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: im ersten Monat
  rationale: Nahe und idiomatische Wiedergabe der Zeitangabe, ohne den Monat namentlich zu bestimmen.
- source_word: וְהוּא מְמַלֵּא עַל כָּל גְּדִיתָיו
  choice: als er über alle seine Ufer trat
  rationale: Die Wendung beschreibt den Jordan während des Hochwassers; „über die Ufer treten“ gibt den Sachverhalt in natürlichem Deutsch wieder.
- source_word: וַיַּבְרִיחוּ
  choice: Sie schlugen … in die Flucht
  rationale: Der Hifil von ברח drückt das Veranlassen zur Flucht aus; die deutsche militärische Wendung bewahrt diesen kausativen Sinn.
- source_word: אֶת כָּל הָעֲמָקִים
  choice: alle Bewohner der Täler
  rationale: Wörtlich stehen „alle Täler“ als Objekt eines Verbs des Vertreibens. Gemeint sind metonymisch die dort lebenden Menschen.
- source_word: לַמִּזְרָח וְלַמַּעֲרָב
  choice: nach Osten und nach Westen
  rationale: Die Richtungsangaben werden knapp und unmittelbar wiedergegeben; der genaue Bezug bleibt wie im Hebräischen offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Übersetzung folgt dem hebräischen Satzbau nicht sklavisch, bewahrt aber Inhalt und Bildlichkeit; die metonymische Wendung „alle Täler“ wird im Haupttext verständlich aufgelöst und in der Fußnote dokumentiert.
