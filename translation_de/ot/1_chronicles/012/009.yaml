  text: וּ/מִן הַ/גָּדִ֡י נִבְדְּל֣וּ אֶל דָּוִיד֩ לַ/מְצַ֨ד מִדְבָּ֜רָ/ה גִּבֹּרֵ֣י הַ/חַ֗יִל אַנְשֵׁ֤י צָבָא֙ לַ/מִּלְחָמָ֔ה עֹרְכֵ֥י צִנָּ֖ה וָ/רֹ֑מַח וּ/פְנֵ֤י אַרְיֵה֙ פְּנֵי/הֶ֔ם וְ/כִ/צְבָאיִ֥ם עַל הֶ/הָרִ֖ים לְ/מַהֵֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/009.yaml
  text: Some of the Gadites separated themselves to David at the stronghold in the wilderness[a], mighty warriors, men of the army for battle, able to handle shield and spear, whose faces were like the faces of lions[c][b], and who were as swift as gazelles on the mountains.
translation:
  language: de
  text: Einige Gaditer sonderten sich ab und gingen zu David in die Festung in der Wüste.[a] Es waren tapfere Krieger, zum Kampf gerüstete Soldaten, die Schild und Speer zu führen wussten.[b] Ihre Gesichter waren wie die von Löwen, und sie waren schnell wie Gazellen auf den Bergen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu David bei der Festung in der Wüste“. Die hebräische Fügung lässt offen, ob die Männer zur Festung zogen oder sich bereits bei ihr befanden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „die Schild und Speer bereitmachten“ oder „ordneten“. Gemeint sind für den Waffenkampf vorbereitete und darin geübte Männer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַגָּדִי
  choice: Einige von den Gaditern
  rationale: Die Verbindung aus מִן und der Stammesbezeichnung führt eine Teilgruppe aus dem Stamm Gad ein. Die deutsche Formulierung macht dies natürlich und ohne sachliche Ergänzung deutlich.
- source_word: נִבְדְּלוּ
  choice: sonderten sich ab
  rationale: Der Nifal von בדל bezeichnet ein Sich-Absondern oder Sich-Trennen. Die reflexive Nuance bleibt erhalten, ohne das Motiv näher festzulegen.
- source_word: אֶל דָּוִיד
  choice: gingen zu David
  rationale: אֶל bezeichnet die Bewegung auf David zu. Das Verb „gingen“ wird im Deutschen für einen vollständigen Satz ergänzt; eine ausdrückliche Deutung als politischer Anschluss wird vermieden.
- source_word: לַמְצַד מִדְבָּרָה
  choice: in die Festung in der Wüste
  rationale: מְצַד bezeichnet einen befestigten Zufluchts- oder Verteidigungsort. Die Richtungskomponente von לְ und der lokalen Endung an מִדְבָּרָה wird mit „in die … in der Wüste“ wiedergegeben; die mögliche statische Auffassung wird in der Fußnote genannt.
- source_word: גִּבֹּרֵי הַחַיִל
  choice: tapfere Krieger
  rationale: Die feste militärische Wendung bezeichnet kampfstarke, bewährte Männer. „Tapfere Krieger“ ist würdig, verständlich und weniger altertümlich als „Helden von Stärke“.
- source_word: אַנְשֵׁי צָבָא לַמִּלְחָמָה
  choice: zum Kampf gerüstete Soldaten
  rationale: Die Wendung unterstreicht ihre militärische Eignung und Bereitschaft für den Krieg. „Zum Kampf gerüstet“ gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: עֹרְכֵי צִנָּה וָרֹמַח
  choice: die Schild und Speer zu führen wussten
  rationale: Das Partizip von ערך kann hier das Bereitmachen, Aufstellen oder kampfgerechte Handhaben der Waffen bezeichnen. Die Formulierung vermittelt ihre Kampffertigkeit; die formnähere Wiedergabe steht in der Fußnote.
- source_word: וּפְנֵי אַרְיֵה פְּנֵיהֶם
  choice: Ihre Gesichter waren wie Löwengesichter
  rationale: Die Wiederholung von „Gesicht“ und der ausdrückliche Vergleich des Hebräischen bleiben erhalten. Das Bild vermittelt ein furchteinflößendes, entschlossenes Aussehen, ohne dies erklärend in den Text einzutragen.
- source_word: וְכִצְבָאִים עַל הֶהָרִים לְמַהֵר
  choice: sie waren schnell wie Gazellen auf den Bergen
  rationale: צְבָאִים bezeichnet Gazellen, während לְמַהֵר die Schnelligkeit ausdrücklich hervorhebt. Die deutsche Wortstellung verbindet beides klar und bewahrt das Bergbild.
