  text: 'Von den Nachkommen Simeons: 7.100 tapfere Krieger für den Heeresdienst.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִן בְּנֵי שִׁמְעוֹן
  choice: Von den Nachkommen Simeons
  rationale: מִן bezeichnet die Herkunft des Aufgebots; בְּנֵי heißt wörtlich »Söhne«, meint in der Stammesliste aber die Nachkommen beziehungsweise Stammesangehörigen. »Nachkommen Simeons« ist im heutigen Deutsch natürlich und sachlich genau.
- source_word: גִּבּוֹרֵי חַיִל
  choice: tapfere Krieger
  rationale: Die feste Verbindung bezeichnet im militärischen Zusammenhang kampftüchtige und mutige Männer. »Tapfere Krieger« gibt beide Aspekte knapp und idiomatisch wieder.
- source_word: לַצָּבָא
  choice: für den Heeresdienst
  rationale: לַ kennzeichnet hier die Bestimmung beziehungsweise Eignung, und צָבָא bezeichnet das Heer oder den Kriegsdienst. »Für den Heeresdienst« passt zum aufzählenden Muster des Abschnitts.
- source_word: שִׁבְעַת אֲלָפִים וּמֵאָה
  choice: '7.100'
  rationale: Die genaue Zahl wird in moderner deutscher Ziffernschreibung mit Punkt als Tausendertrennzeichen wiedergegeben.
