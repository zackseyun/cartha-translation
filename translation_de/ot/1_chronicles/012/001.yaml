source:
  edition: WLC
  text: וְ/אֵ֗לֶּה הַ/בָּאִ֤ים אֶל דָּוִיד֙ לְ/צִ֣יקְלַ֔ג ע֣וֹד עָצ֔וּר מִ/פְּנֵ֖י שָׁא֣וּל בֶּן קִ֑ישׁ וְ/הֵ֨מָּה֙ בַּ/גִּבּוֹרִ֔ים עֹזְרֵ֖י הַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/001.yaml
  text: These are the men who came to David at Ziklag while he was still kept back because of Saul son of Kish[a]; and they were among the mighty warriors[b], helpers in war.
translation:
  language: de
  text: Und dies sind die Männer, die zu David nach Ziklag kamen, als er wegen Saul, des Sohnes Kischs, noch zurückgehalten wurde[a]. Sie gehörten zu den Kriegshelden[b], Helfern im Kampf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »noch eingeschlossen war«. Der hebräische Ausdruck bezeichnet einen Zustand des Zurückgehalten- oder Eingeschlossenseins und legt keine bestimmte Art der Einschränkung fest.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zu den tapferen Kriegern«; das hebräische Wort bezeichnet kampfstarke Männer oder Helden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Bewahrt die verbindende Funktion von וְ und leitet zugleich die folgende Liste natürlich ein.
- source_word: הַבָּאִים אֶל דָּוִיד לְצִיקְלַג
  choice: die zu David nach Ziklag kamen
  rationale: Die beiden Präpositionalangaben werden im Deutschen idiomatisch auf Person und Zielort bezogen; לְצִיקְלַג kann räumlich auch als »in Ziklag« verstanden werden.
- source_word: עוֹד עָצוּר
  choice: sich noch nicht frei bewegen konnte
  rationale: Gibt den fortdauernden Zustand der Einschränkung wieder, ohne eine förmliche Gefangenschaft zu behaupten.
- source_word: מִפְּנֵי שָׁאוּל בֶּן קִישׁ
  choice: wegen Saul, des Sohnes des Kisch
  rationale: מִפְּנֵי bezeichnet hier den durch Sauls Verfolgung verursachten Zwang; die Apposition wird im Deutschen ausgeschrieben.
- source_word: בַּגִּבּוֹרִים
  choice: zu den Kriegshelden
  rationale: גִּבּוֹרִים bezeichnet in diesem Zusammenhang besonders tüchtige und tapfere Kämpfer.
- source_word: עֹזְרֵי הַמִּלְחָמָה
  choice: die ihm im Kampf halfen
  rationale: Eine natürliche deutsche Wiedergabe des substantivischen Ausdrucks; das im Zusammenhang naheliegende Bezugsobjekt David wird zur Verständlichkeit explizit gemacht.
