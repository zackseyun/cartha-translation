source:
  edition: WLC
  text: נֹ֣שְׁקֵי קֶ֗שֶׁת מַיְמִינִ֤ים וּ/מַשְׂמִאלִים֙ בָּֽ/אֲבָנִ֔ים וּ/בַ/חִצִּ֖ים בַּ/קָּ֑שֶׁת מֵ/אֲחֵ֥י שָׁא֖וּל מִ/בִּנְיָמִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/002.yaml
  text: They were archers[a], able to use both the right hand and the left in hurling stones and shooting arrows with the bow; they were from Saul’s brothers, from Benjamin.
translation:
  language: de
  text: Sie waren mit Bogen bewaffnet und konnten mit der rechten wie mit der linken Hand Steine schleudern und mit dem Bogen Pfeile schießen. Sie gehörten zu den Brüdern Sauls[a] aus Benjamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verwandten Sauls“ beziehungsweise „Stammesgenossen Sauls“. Das hebräische Wort für „Brüder“ kann auch Angehörige der weiteren Familie, Sippe oder des Stammes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשְׁקֵי קֶשֶׁת
  choice: mit Bogen bewaffnet
  rationale: Die Wendung bezeichnet Männer, die einen Bogen tragen bzw. damit ausgerüstet sind. Die Übersetzung bleibt dem hebräischen Ausdruck näher als die bloße Berufsbezeichnung „Bogenschützen“.
- source_word: מַיְמִינִים וּמַשְׂמִאלִים
  choice: konnten mit der rechten wie mit der linken Hand
  rationale: Die Partizipien beschreiben hier die Fähigkeit, beide Hände im Kampf einzusetzen, nicht lediglich Rechts- oder Linkshändigkeit.
- source_word: בָּאֲבָנִים
  choice: Steine schleudern
  rationale: Im militärischen Zusammenhang ist das Werfen oder Schleudern von Steinen gemeint. „Schleudern“ gibt die Tätigkeit natürlich wieder, ohne ausdrücklich eine im Hebräischen nicht genannte Schleuder einzuführen.
- source_word: וּבַחִצִּים בַּקָּשֶׁת
  choice: mit dem Bogen Pfeile schießen
  rationale: Die idiomatische deutsche Formulierung verdeutlicht den Gebrauch der Pfeile mit dem Bogen und bildet die zweite genannte Kampffertigkeit ab.
- source_word: מֵאֲחֵי שָׁאוּל
  choice: zu den Brüdern Sauls
  rationale: „Brüder“ entspricht dem hebräischen Grundwort unmittelbar. Da dieses auch weitere Verwandte, Sippenangehörige oder Stammesgenossen bezeichnen kann, wird die Bedeutungsbreite in einer Fußnote erhalten.
- source_word: מִבִּנְיָמִן
  choice: aus Benjamin
  rationale: Die Wendung bezeichnet die Stammeszugehörigkeit und lässt sich knapp und quellennah mit „aus Benjamin“ wiedergeben.
