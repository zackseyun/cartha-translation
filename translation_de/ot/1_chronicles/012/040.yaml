base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/040.yaml
  text: They were there with David for three days[a], eating and drinking, because their brothers had prepared for them.
translation:
  language: de
  text: Sie waren drei Tage lang dort bei David und aßen und tranken, denn ihre Brüder[a] hatten für sie vorgesorgt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Verwandten“ beziehungsweise „ihre Stammesbrüder“. Wörtlich steht im Hebräischen „ihre Brüder“; im Zusammenhang können damit auch Angehörige derselben Sippe oder desselben Stammes gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם עִם דָּוִיד
  choice: Sie blieben dort bei David
  rationale: היה bezeichnet hier im Zusammenhang einen dreitägigen Aufenthalt. „Blieben“ gibt dies im Deutschen natürlicher wieder als das statische „waren“; עִם wird in dieser Orts- und Gemeinschaftsangabe idiomatisch mit „bei“ wiedergegeben.
- source_word: יָמִים שְׁלוֹשָׁה
  choice: drei Tage lang
  rationale: Die Zeitdauer wird im modernen Deutschen natürlich mit „lang“ ausgedrückt.
- source_word: אֹכְלִים וְשׁוֹתִים
  choice: aßen und tranken
  rationale: Die beiden Partizipien beschreiben die fortlaufenden Tätigkeiten während des Aufenthalts. Die ausdrückliche Doppelung bleibt erhalten, statt sie zusammenfassend als „feierten“ wiederzugeben.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für Essen und Trinken ein; „denn“ ist in diesem Satz flüssiges modernes Deutsch.
- source_word: הֵכִינוּ לָהֶם
  choice: hatten für sie alles vorbereitet
  rationale: Der Hifil von כון bedeutet „vorbereiten, bereitmachen“. Das Plusquamperfekt verdeutlicht, dass die Vorbereitung dem dreitägigen Aufenthalt vorausging; „alles“ macht den im Hebräischen unausgesprochenen Gegenstand im Deutschen idiomatisch verständlich, ohne ihn auf bestimmte Vorräte einzuengen.
- source_word: אֲחֵיהֶם
  choice: ihre Brüder
  rationale: Die konkrete männliche Verwandtschaftsbezeichnung wird im Haupttext bewahrt. Im Stammeszusammenhang kann sie jedoch einen weiteren Kreis von Verwandten oder Stammesangehörigen bezeichnen; dies wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Möglicher weiterer Verwandtschaftssinn von אֲחֵיהֶם
  choice: ihre Brüder
  alternative: ihre Verwandten; ihre Stammesbrüder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt stehen, ohne den im Kontext möglichen weiteren sozialen Sinn auszuschließen. Da keine lehrmäßige Frage entschieden werden muss, wird die Mehrdeutigkeit durch eine Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Der Satz folgt dem knappen Erzählstil des Hebräischen; „blieben“ und das finite „aßen und tranken“ sorgen für natürliche deutsche Syntax.
