  text: וַ/יֵּצֵ֣א דָוִיד֮ לִ/פְנֵי/הֶם֒ וַ/יַּ֨עַן֙ וַ/יֹּ֣אמֶר לָ/הֶ֔ם אִם לְ/שָׁל֞וֹם בָּאתֶ֤ם אֵלַ/י֙ לְ/עָזְרֵ֔/נִי יִֽהְיֶה לִּ֧/י עֲלֵי/כֶ֛ם לֵבָ֖ב לְ/יָ֑חַד וְ/אִֽם לְ/רַמּוֹתַ֣/נִי לְ/צָרַ֗/י בְּ/לֹ֤א חָמָס֙ בְּ/כַפַּ֔/י יֵ֛רֶא אֱלֹהֵ֥י אֲבוֹתֵ֖י/נוּ וְ/יוֹכַֽח־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/018.yaml
  text: David went out before them and answered and said to them[a], “If you have come to me in peace to help me, my heart will be united with you; but if you have come to betray me to my enemies, though there is no violence in my hands[b], may the God of our fathers see and judge.”
translation:
  language: de
  text: 'David ging zu ihnen hinaus, antwortete ihnen und sagte: „Wenn ihr in Frieden zu mir gekommen seid, um mir zu helfen, wird mein Herz mit euch vereint sein. Wenn ihr aber gekommen seid, um mich an meine Feinde zu verraten[a], obwohl keine Gewalt an meinen Händen ist, möge der Gott unserer Väter sehen und Recht sprechen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mich zu täuschen“. Das hebräische Verb kann arglistige Täuschung bezeichnen; „verraten“ passt hier zum Zusammenhang, weil Davids Feinde genannt werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „urteilen“, „entscheiden“ beziehungsweise „zurechtweisen“. Das hebräische Verb kann eine richterliche Entscheidung, einen Schiedsspruch oder eine Zurechtweisung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא דָוִיד לִפְנֵיהֶם
  choice: David ging zu ihnen hinaus
  rationale: יצא bezeichnet das Hinausgehen; לִפְנֵיהֶם bedeutet wörtlich „vor sie/in ihre Gegenwart“. Die Formulierung gibt die räumliche Bewegung in natürlichem Deutsch wieder, ohne ausdrücklich ein verabredetes Treffen vorauszusetzen.
- source_word: וַיַּעַן וַיֹּאמֶר לָהֶם
  choice: erwiderte und sagte zu ihnen
  rationale: Beide Verben der hebräischen Redeformel bleiben erhalten. „Erwiderte“ gibt ענה wieder, auch wenn keine unmittelbar vorausgehende Äußerung berichtet wird.
- source_word: לְשָׁלוֹם
  choice: in Frieden
  rationale: Die Wendung beschreibt ein friedliches und aufrichtiges Kommen und bleibt eng an der hebräischen Präpositionalfügung.
- source_word: לְעָזְרֵנִי
  choice: um mir zu helfen
  rationale: Der Infinitiv bezeichnet den Zweck ihres Kommens; die gewählte Formulierung ist klar und unmittelbar.
- source_word: יִהְיֶה לִּי עֲלֵיכֶם לֵבָב לְיָחַד
  choice: wird mein Herz mit euch vereint sein
  rationale: Die ungewöhnliche hebräische Wendung bezeichnet einmütige Verbundenheit. Die Übersetzung bewahrt das Bild des Herzens und den Gedanken der Einheit.
- source_word: לְרַמּוֹתַנִי
  choice: um mich … zu verraten
  rationale: Das Piel von רמה kann arglistiges Täuschen oder Verraten bezeichnen. Wegen der anschließenden Nennung von Davids Feinden passt „verraten“ besonders gut, ohne die lexikalische Alternative zu verschweigen.
- source_word: לְצָרַי
  choice: an meine Feinde
  rationale: צר bezeichnet hier feindliche Gegner. Die Präposition „an“ bringt im Deutschen den Gedanken zum Ausdruck, David seinen Feinden auszuliefern.
- source_word: בְּלֹא חָמָס בְּכַפַּי
  choice: obwohl kein Unrecht an meinen Händen ist
  rationale: חמס kann Gewalt oder schuldhaftes Unrecht bezeichnen. Die Übersetzung bewahrt das hebräische Handmotiv als Ausdruck persönlicher Unschuld; „obwohl“ verdeutlicht den konzessiven Zusammenhang.
- source_word: יֵרֶא אֱלֹהֵי אֲבוֹתֵינוּ
  choice: möge der Gott unserer Väter es sehen
  rationale: Der Imperfekt hat in diesem feierlichen Aufruf jussivischen Charakter. „Möge“ bewahrt die Bitte um göttliches Eingreifen, statt daraus eine sichere Vorhersage zu machen.
- source_word: וְיוֹכַח
  choice: und Recht sprechen
  rationale: Das Hifil von יכח kann entscheiden, zurechtweisen oder als Schiedsrichter urteilen bedeuten. „Recht sprechen“ gibt in diesem forensischen Zusammenhang den Aufruf zur göttlichen Entscheidung idiomatisch wieder.
theological_decisions:
- issue: Art des göttlichen Handelns im Schlussappell
  choice: möge der Gott unserer Väter es sehen und Recht sprechen
  alternative: der Gott unserer Väter wird es sehen und urteilen / möge der Gott unserer Väter es sehen und zurechtweisen
  rationale: Die Verbformen lassen sich im Zusammenhang am besten als feierlicher Appell an Gottes richterliches Eingreifen verstehen. Die Wunschform vermeidet es, den Satz als bloße Zukunftsvorhersage festzulegen; „Recht sprechen“ wahrt den forensischen Sinn, ohne die mögliche Bedeutung „zurechtweisen“ zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte hebräische Redeformel bleibt bewusst erhalten. Das biblische Bild vom Herzen und die Wendung „Gott unserer Väter“ werden bewahrt; schwer verständliche Wörtlichkeit wird vermieden.
