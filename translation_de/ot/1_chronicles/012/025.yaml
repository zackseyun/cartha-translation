- source_word: חֲלוּצֵי צָבָא
  choice: zum Kampf gerüstet
  rationale: Die Wendung bezeichnet Männer, die für den militärischen Einsatz ausgerüstet beziehungsweise bereitgemacht waren; die Formulierung passt zugleich zur zuvor genannten Bewaffnung.
