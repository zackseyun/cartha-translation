  text: וּ/מִן בְּנֵ֣י אֶפְרַ֔יִם עֶשְׂרִ֥ים אֶ֖לֶף וּ/שְׁמוֹנֶ֣ה מֵא֑וֹת גִּבּ֣וֹרֵי חַ֔יִל אַנְשֵׁ֥י שֵׁמ֖וֹת לְ/בֵ֥ית אֲבוֹתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/031.yaml
  text: And from the sons of Ephraim[a], twenty thousand eight hundred mighty men of valor, men of renown according to their fathers’ houses.
translation:
  language: de
  text: 'Und von den Nachkommen Ephraims: 20.800 tapfere Krieger, angesehene Männer[a] nach ihren Sippen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Männer von Namen«; gemeint sind bekannte oder besonders angesehene Männer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Und von
  rationale: Die Verbindung aus Konjunktion und Präposition führt die Stammesaufzählung des Zusammenhangs weiter.
- source_word: בְּנֵי אֶפְרַיִם
  choice: den Nachkommen Ephraims
  rationale: Wörtlich steht »Söhne Ephraims«; im Zusammenhang bezeichnet die Wendung die Angehörigen beziehungsweise Nachkommen des Stammes. »Nachkommen« gibt diesen Sinn im heutigen Deutsch natürlich wieder.
- source_word: עֶשְׂרִים אֶלֶף וּשְׁמוֹנֶה מֵאוֹת
  choice: '20.800'
  rationale: Die Ziffernschreibung gibt die genaue Zahl übersichtlich und nach deutscher Konvention wieder.
- source_word: גִּבּוֹרֵי חַיִל
  choice: kampferprobte Krieger
  rationale: Die Wendung bezeichnet im militärischen Zusammenhang Männer von Kraft, Tüchtigkeit und Tapferkeit. »Kampferprobt« bewahrt die militärische Aussage, ohne archaisch zu klingen.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: angesehene Männer
  rationale: Der Ausdruck bedeutet wörtlich »Männer von Namen« und bezeichnet bekannte, hervorgehobene oder angesehene Personen.
- source_word: לְבֵית אֲבוֹתָם
  choice: in ihren Großfamilien
  rationale: Das »Vaterhaus« ist die größere verwandtschaftliche Einheit innerhalb des Stammes. »Großfamilien« macht diese soziale Struktur für heutige Leser verständlich; die Präposition wird hier als Zuordnung innerhalb dieser Verbände verstanden.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Der Doppelpunkt bildet die elliptische Struktur der Stammesliste ab; »Großfamilien« vermeidet den heute missverständlichen Ausdruck »Vaterhäuser«.
