  - severity: medium
    issue: »in ihren Großfamilien« gibt לְבֵית אֲבוֹתָם nicht präzise wieder.
    rationale: Die Wendung ordnet die genannten Männer ihren Vaterhäusern, also Sippen bzw. Familienverbänden, zu. »Nach ihren Sippen« erhält diese klassifikatorische Aussage und vermeidet eine rein örtliche Lesart.
