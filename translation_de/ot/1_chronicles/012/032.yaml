base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/032.yaml
  text: And from the half-tribe of Manasseh[a], eighteen thousand, who were designated by name, came to make David king.
translation:
  language: de
  text: Und vom halben Stamm Manasse kamen 18.000, die namentlich bestimmt waren[a], um David zum König zu machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die mit Namen bezeichnet waren“, das heißt einzeln ausdrücklich benannt oder aufgeführt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: Und vom halben Stamm Manasse
  rationale: Die Präfixe werden ausdrücklich mit „Und vom“ wiedergegeben. חֲצִי מַטֵּה bezeichnet hier die Hälfte des Stammes Manasse; „halber Stamm“ ist im Deutschen natürlich und präzise.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: '18.000'
  rationale: Die Kardinalzahl wird nach heutiger deutscher Schreibweise wiedergegeben.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: die namentlich bestimmt worden waren
  rationale: Der Relativsatz bezieht sich auf die gezählten Männer. Das Niphal von נקב bewahrt mit „bestimmt worden waren“ seinen passiven Sinn; בְּשֵׁמוֹת wird idiomatisch mit „namentlich“ wiedergegeben.
- source_word: לָבוֹא
  choice: kamen
  rationale: Der formale Infinitiv „zu kommen“ wird im deutschen Listenzusammenhang als finites Verb wiedergegeben; der anschließende Zweck bleibt durch „um … zu“ deutlich.
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: um David zum König zu machen
  rationale: Der Hiphil von מלך bedeutet, jemanden zum König zu machen beziehungsweise als König einzusetzen. Die direkte Formulierung vermeidet die engere zeremonielle Bedeutung von „krönen“.
