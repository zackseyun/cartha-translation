source:
  edition: WLC
  text: בְּ/לֶכְתּ֣/וֹ אֶל צִֽיקְלַ֗ג נָפְל֣וּ עָלָ֣י/ו מִֽ/מְּנַשֶּׁ֡ה עַ֠דְנַח וְ/יוֹזָבָ֤ד וִ/ידִֽיעֲאֵל֙ וּ/מִיכָאֵ֣ל וְ/יוֹזָבָ֔ד וֶ/אֱלִיה֖וּא וְ/צִלְּתָ֑י רָאשֵׁ֥י הָ/אֲלָפִ֖ים אֲשֶׁ֥ר לִ/מְנַשֶּֽׁה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/021.yaml
  text: 'As he went to Ziklag[a], some from Manasseh defected to him: Adnah, Jozabad, Jediael, Michael, another Jozabad, Elihu, and Zillethai[c][b], chiefs of the thousands that belonged to Manasseh.'
translation:
  language: de
  text: 'Als David nach Ziklag zog, liefen einige Männer aus Manasse zu ihm über[a]: Adnach, Josabad, Jediaël, Michael, Josabad[b], Elihu und Zilletai. Sie waren Oberhäupter der Tausendschaften Manasses[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fielen ihm zu“; die hebräische Wendung bedeutet hier, dass sie auf Davids Seite übergingen.'
    reason: lexical_alternative
  - marker: b
    text: Der Name Josabad erscheint in der hebräischen Aufzählung zweimal; gemeint sind zwei verschiedene Männer gleichen Namens.
    reason: cultural_note
  - marker: c
    text: „Tausendschaften“ kann militärische Einheiten oder Sippenverbände innerhalb Manasses bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתּוֹ
  choice: Als David … zog
  rationale: Die Konstruktion aus בְּ und dem Infinitiv von הלך mit Suffix hat zeitliche Bedeutung. Der im Hebräischen nur durch das Suffix bezeichnete David wird zur Verständlichkeit namentlich genannt.
- source_word: אֶל צִיקְלַג
  choice: nach Ziklag
  rationale: אֶל bezeichnet hier die Bewegung zu einem Ziel; bei Ortsnamen ist „nach“ im Deutschen idiomatisch.
- source_word: נָפְלוּ עָלָיו
  choice: liefen … zu ihm über
  rationale: Die Wendung bedeutet in einem militärisch-politischen Zusammenhang, auf die Seite eines anderen überzugehen. „Überlaufen“ gibt den Loyalitätswechsel wieder, ohne das hebräische Bild unnatürlich wörtlich abzubilden.
- source_word: מִמְּנַשֶּׁה
  choice: einige Männer aus Manasse
  rationale: Die Präposition bezeichnet die Herkunft aus dem Stamm Manasse. „Männer“ ist als aus dem Zusammenhang erschlossene Ergänzung kenntlich natürlich, während „einige“ die partitive Angabe ausdrückt.
- source_word: עַדְנַח וְיוֹזָבָד וִידִיעֲאֵל וּמִיכָאֵל וְיוֹזָבָד וֶאֱלִיהוּא וְצִלְּתָי
  choice: Adnach, Josabad, Jediaël, Michael, Josabad, Elihu und Zilletai
  rationale: Die Personennamen werden in geläufigen deutschen Transliterationsformen wiedergegeben. Josabad steht entsprechend dem hebräischen Text zweimal; die Wiederholung wird nicht durch einen Zusatz im Haupttext aufgelöst.
- source_word: רָאשֵׁי הָאֲלָפִים
  choice: Oberhäupter der Tausendschaften
  rationale: רָאשֵׁי bezeichnet führende Personen. אֲלָפִים kann militärische Einheiten oder Sippenverbände meinen; „Tausendschaften“ bewahrt diese Offenheit besser als eine eindeutige Festlegung auf militärische Befehlshaber.
- source_word: אֲשֶׁר לִמְנַשֶּׁה
  choice: Manasses
  rationale: Der Genitiv ordnet die genannten Tausendschaften beziehungsweise ihre Oberhäupter Manasse zu und gibt die knappe hebräische Zugehörigkeitsangabe natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Wendung wird verständlich wiedergegeben, während „Tausendschaften“ die institutionelle Mehrdeutigkeit des Hebräischen bewahrt. Die Aufteilung in zwei Sätze macht die nachgestellte Apposition lesbar, ohne ihren Bezug auf alle sieben Genannten zu verändern.
