source:
  edition: WLC
  text: וּ/מִֽ/מְּנַשֶּׁ֞ה נָפְל֣וּ עַל דָּוִ֗יד בְּ/בֹא֨/וֹ עִם פְּלִשְׁתִּ֧ים עַל שָׁא֛וּל לַ/מִּלְחָמָ֖ה וְ/לֹ֣א עֲזָרֻ֑/ם כִּ֣י בְ/עֵצָ֗ה שִׁלְּחֻ֜/הוּ סַרְנֵ֤י פְלִשְׁתִּים֙ לֵ/אמֹ֔ר בְּ/רָאשֵׁ֕י/נוּ יִפּ֖וֹל אֶל אֲדֹנָ֥י/ו שָׁאֽוּל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/020.yaml
  text: Some from Manasseh also defected to David when he came with the Philistines against Saul for battle[a], though they did not help them, because the lords of the Philistines, after taking counsel, sent him away, saying[b], “He may defect to his master Saul at the cost of our heads.”
translation:
  language: de
  text: 'Auch aus Manasse liefen einige zu David über[a], als er mit den Philistern zum Kampf gegen Saul kam. Doch sie halfen ihnen nicht, denn die Fürsten der Philister berieten sich und schickten ihn weg. Sie sagten: »Er könnte zu seinem Herrn Saul überlaufen und uns den Kopf kosten[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »fielen zu David«; die hebräische Wendung bedeutet hier, dass sie auf seine Seite wechselten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »mit unseren Köpfen«; gemeint ist: Er könnte ihnen das Leben kosten oder zu ihrem eigenen Verderben überlaufen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמְּנַשֶּׁה
  choice: Auch aus Manasse … einige
  rationale: Die Verbindung aus Konjunktion und מִן hat ergänzende und partitive Bedeutung. Das im Hebräischen vorausgesetzte »einige« wird im Deutschen ausdrücklich gemacht; die folgenden Namen bestätigen diesen Bezug.
- source_word: נָפְלוּ עַל דָּוִיד
  choice: liefen … zu David über
  rationale: נפל על bezeichnet hier im militärisch-politischen Zusammenhang den Wechsel auf die Seite eines anderen, nicht ein buchstäbliches Fallen.
- source_word: בְּבֹאוֹ עִם פְּלִשְׁתִּים עַל שָׁאוּל לַמִּלְחָמָה
  choice: als er mit den Philistern zum Kampf gegen Saul kam
  rationale: בְּ mit dem Infinitiv bezeichnet den Zeitpunkt; עִם drückt Begleitung, עַל die feindliche Ausrichtung und לַמִּלְחָמָה den Zweck aus.
- source_word: וְלֹא עֲזָרֻם
  choice: Doch sie halfen ihnen nicht
  rationale: Die pronominale Form des Hebräischen bleibt erhalten. »Ihnen« bezieht sich am ehesten auf die unmittelbar zuvor genannten Philister, ohne dies im Haupttext ausdrücklich festzulegen.
- source_word: כִּי בְעֵצָה
  choice: denn … berieten sich
  rationale: בְעֵצָה bezeichnet ein Vorgehen nach Beratung beziehungsweise aufgrund eines gemeinsamen Beschlusses; die verbale deutsche Form ist natürlich und präzise.
- source_word: שִׁלְּחֻהוּ
  choice: schickten ihn weg
  rationale: Der Piel von שלח bezeichnet hier die Entlassung Davids aus dem Heerzug.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: die Fürsten der Philister
  rationale: סְרָנִים ist die besondere Bezeichnung für die führenden Herrscher der Philister. »Fürsten« bewahrt den titelartigen Charakter.
- source_word: בְּרָאשֵׁינוּ
  choice: auf Kosten unserer Köpfe
  rationale: Die bildhafte hebräische Wendung bezeichnet die Gefahr, mit dem eigenen Leben für Davids möglichen Seitenwechsel zu bezahlen.
- source_word: יִפּוֹל אֶל אֲדֹנָיו שָׁאוּל
  choice: Er könnte zu seinem Herrn Saul überlaufen
  rationale: נפל אל bezeichnet erneut den Seitenwechsel. Der Imperfekt drückt hier die Befürchtung einer Möglichkeit aus; »Herr« gibt Davids politisches Dienstverhältnis zu Saul wieder.
theological_decisions:
- issue: Bezeichnung Sauls als אֲדֹנָיו
  choice: sein Herr Saul
  alternative: sein Gebieter Saul / sein Dienstherr Saul
  rationale: »Herr« bewahrt die gewöhnliche politische und persönliche Loyalitätsbezeichnung des Hebräischen, ohne dem Ausdruck eine besondere theologische Bedeutung zu geben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Pronomen in »sie halfen ihnen nicht« bleiben entsprechend dem Hebräischen erhalten; die wahrscheinlichsten Bezüge werden nicht unnötig in den Haupttext eingetragen. Die wiederholte Wendung für den Seitenwechsel wird an beiden Stellen konsequent mit »überlaufen« wiedergegeben.
