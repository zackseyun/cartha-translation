base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/007.yaml
  text: Elkanah[a], Isshiah, Azarel, Joezer, and Jashobeam, the Korahites.
translation:
  language: de
  text: Elkana, Jischijahu, Asarel, Joëser und Jaschobam, die Korachiter[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Nachkommen Korachs“.'
    reason: Lexikalische Erläuterung der gentilizischen Sippenbezeichnung; die alternative Wiedergabe macht die Abstammungsbeziehung ausdrücklich.
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Hebräischer Personenname in einer im Deutschen üblichen, dem Hebräischen nahen Form.
- source_word: יִשִּׁיָּהוּ
  choice: Jischijahu
  rationale: Transliteration des in diesem Vers überlieferten hebräischen Namens; die Endung -jahu wird erkennbar wiedergegeben.
- source_word: עֲזַרְאֵל
  choice: Asarel
  rationale: Transliteration des hebräischen Personennamens nach modernen deutschen Laut- und Schreibkonventionen.
- source_word: יוֹעֶזֶר
  choice: Joëser
  rationale: Transliteration des hebräischen Personennamens; der Trema kennzeichnet, dass o und e getrennt gesprochen werden.
- source_word: יָשָׁבְעָם
  choice: Jaschobam
  rationale: Transliteration der hier bezeugten Namensform, ohne sie mit einer abweichenden Namensform aus einer anderen Textstelle gleichzusetzen.
- source_word: הַקָּרְחִים
  choice: die Korachiter
  rationale: Der bestimmte gentilizische Plural bezeichnet die zu Korach gehörende Sippe beziehungsweise Nachkommenschaft; „Korachiter“ bewahrt die knappe Form des Hebräischen.
theological_decisions: []
