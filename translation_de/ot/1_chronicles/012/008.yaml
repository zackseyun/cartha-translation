  text: and Joelah and Zebadiah[a], the sons of Jeroham from Gedor.
translation:
  language: de
  text: und Joëla und Sebadja, die Söhne Jerohams aus Gedor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יוֹעֵאלָה
  choice: und Joëla
  rationale: Die Konjunktion וְ wird mit „und“ wiedergegeben. Der Personenname wird in einer dem Hebräischen nahen, im Deutschen lesbaren Form transliteriert; die Trema-Schreibung macht die getrennte Aussprache der Vokale deutlich.
- source_word: וּ/זְבַדְיָה
  choice: und Sebadja
  rationale: Die Konjunktion וּ wird mit „und“ wiedergegeben. Sebadja ist eine gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der Status-constructus-Plural von בֵּן bezeichnet hier am natürlichsten unmittelbare Söhne; der bestimmte Artikel wird für einen flüssigen deutschen Listensatz ergänzt.
- source_word: יְרֹחָם
  choice: Jerohams
  rationale: Der Eigenname wird nach deutscher Transliterationskonvention wiedergegeben und zur natürlichen Wiedergabe der hebräischen Genitivverbindung flektiert.
- source_word: מִן הַ/גְּדֽוֹר
  choice: aus Gedor
  rationale: מִן bezeichnet hier die Herkunft. Gedor wird als Ortsname verstanden; der hebräische Artikel wird bei der deutschen Namensform nicht eigens wiedergegeben.
