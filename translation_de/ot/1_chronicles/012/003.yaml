  text: הָ/רֹ֨אשׁ אֲחִיעֶ֜זֶר וְ/יוֹאָ֗שׁ בְּנֵי֙ הַ/שְּׁמָעָ֣ה הַ/גִּבְעָתִ֔י ו/יזואל וָ/פֶ֖לֶט בְּנֵ֣י עַזְמָ֑וֶת וּ/בְרָכָ֕ה וְ/יֵה֖וּא הָ/עֲנְּתֹתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/003.yaml
  text: The chief was Ahiezer[a], then Joash, the sons of Shemaah the Gibeathite; and Jeziel and Pelet, the sons of Azmaveth[b]; and Beracah and Jehu the Anathothite.
translation:
  language: de
  text: An der Spitze stand Ahieser und Joasch, die Söhne Schemaas aus Gibea; außerdem Jesiël[a] und Pelet, die Söhne Asmawets, sowie Berecha[b] und Jehu aus Anatot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name kann auch Jisiël umschrieben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Andere mögliche Umschrift: Beraka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: An der Spitze stand
  rationale: Im Zusammenhang der Namensliste bezeichnet רֹאשׁ den führenden Mann. Die verblose hebräische Wendung wird im Deutschen natürlich mit „stand“ wiedergegeben.
- source_word: אֲחִיעֶזֶר
  choice: Ahiëser
  rationale: Deutsche, an der hebräischen Lautung orientierte Umschrift des Personennamens; das Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: וְיוֹאָשׁ
  choice: danach Joasch
  rationale: Das hebräische ו bedeutet wörtlich „und“; „danach“ macht hier die Abfolge nach der Nennung des Anführers verständlich, ohne eine zusätzliche Rangordnung festzulegen.
- source_word: בְּנֵי הַשְּׁמָעָה
  choice: die Söhne Schemaas
  rationale: בְּנֵי ist die übliche genealogische Bezeichnung „Söhne“. הַשְּׁמָעָה wird als Eigenname Schemaa verstanden; die Form mit scheinbarem Artikel wird nicht zu „Ha-Schemaa“ aufgelöst.
- source_word: הַגִּבְעָתִי
  choice: aus Gibea
  rationale: Das Herkunftsadjektiv bezeichnet einen Mann aus Gibea. Die deutsche Herkunftsangabe ist natürlicher und eindeutiger als eine künstliche Bildung wie „Gibeatiter“.
- source_word: ויזואל
  choice: Jësiël
  rationale: Der unpunktierte beziehungsweise textkritisch auffällige Namenszug wird in Anlehnung an die verbreitete Identifikation als Jësiël wiedergegeben; die mögliche Lesung Jisiël wird in einer Fußnote bewahrt.
- source_word: וָפֶלֶט
  choice: und Pelet
  rationale: Schlichte Umschrift des Personennamens ohne etymologische Ausdeutung.
- source_word: בְּנֵי עַזְמָוֶת
  choice: die Söhne Asmawets
  rationale: Standardmäßige genealogische Konstruktion; der Name wird in deutscher, an der hebräischen Aussprache orientierter Form wiedergegeben.
- source_word: וּבְרָכָה
  choice: sowie Berecha
  rationale: Der Personenname בְּרָכָה wird lautnah als Berecha wiedergegeben; die alternative Umschrift Beraka steht in der Fußnote.
- source_word: וְיֵהוּא
  choice: und Jehu
  rationale: Im Deutschen eingebürgerte Wiedergabe des Personennamens.
- source_word: הָעֲנְּתֹתִי
  choice: aus Anatot
  rationale: Das Herkunftsadjektiv bezeichnet einen Mann aus Anatot. Eine Präpositionalfügung ist im modernen Deutschen verständlicher als „Anatotiter“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Listenform bleibt erhalten; Herkunftsbezeichnungen werden idiomatisch mit „aus“ wiedergegeben. Deutsche Namensformen orientieren sich möglichst an der hebräischen Lautung. Die Satzzeichen gliedern die zusammengehörigen Familien- und Herkunftsangaben.
