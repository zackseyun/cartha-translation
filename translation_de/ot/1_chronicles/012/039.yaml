  text: כָּל אֵ֜לֶּה אַנְשֵׁ֣י מִלְחָמָה֮ עֹדְרֵ֣י מַעֲרָכָה֒ בְּ/לֵבָ֤ב שָׁלֵם֙ בָּ֣אוּ חֶבְר֔וֹנָ/ה לְ/הַמְלִ֥יךְ אֶת דָּוִ֖יד עַל כָּל יִשְׂרָאֵ֑ל וְ֠/גַם כָּל שֵׁרִ֧ית יִשְׂרָאֵ֛ל לֵ֥ב אֶחָ֖ד לְ/הַמְלִ֥יךְ אֶת דָּוִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/039.yaml
  text: All these were men of war[a], arrayed for battle, who came to Hebron with a whole heart to make David king over all Israel; and also all the rest of Israel were of one heart to make David king.
translation:
  language: de
  text: Alle diese waren Krieger, die in Schlachtordnung aufgestellt waren. Mit ungeteiltem Herzen kamen sie nach Hebron, um David zum König über ganz Israel zu machen. Auch das ganze übrige Israel[a] war eines Herzens, David zum König zu machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der ganze Überrest Israels“. Gemeint ist hier wahrscheinlich das übrige Israel, nicht „Überrest“ als prophetisch-theologischer Fachbegriff.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: Kriegsmänner
  rationale: Die konstruktusartige Wendung bezeichnet Männer, die für den Krieg bestimmt oder erfahren sind. „Kriegsmänner“ wahrt die maskuline Form und den militärischen Sinn, ohne den Ausdruck unnötig auszudeuten.
- source_word: עֹדְרֵי מַעֲרָכָה
  choice: die sich zur Schlacht aufstellten
  rationale: Das Partizip bezeichnet das Ordnen bzw. Aufstellen einer Schlachtreihe. Die gewählte Formulierung ist im modernen Deutschen verständlich und bewahrt den Gedanken militärischer Formation.
- source_word: בְּלֵבָב שָׁלֵם
  choice: mit ungeteiltem Herzen
  rationale: Die Wendung beschreibt die Ganzheit und Aufrichtigkeit der inneren Absicht. „Ungeteilt“ gibt den Sinn von שָׁלֵם idiomatisch wieder und behält zugleich das Herzbild bei.
- source_word: בָּאוּ חֶבְרוֹנָה
  choice: kamen sie nach Hebron
  rationale: Das Richtungssuffix an „Hebron“ bezeichnet die Bewegung zum Ort hin; „nach Hebron kommen“ ist die natürliche deutsche Wiedergabe.
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: David zum König zu machen
  rationale: Der Hifil von מלך bedeutet hier, jemanden zum Herrscher zu machen bzw. als König einzusetzen. „Zum König machen“ ist direkt und führt keine ausdrücklich nicht genannte Krönungszeremonie ein.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: über ganz Israel
  rationale: Die Präposition bezeichnet Davids Königsherrschaft über die gesamte Nation; dies ist die knappe und übliche deutsche Form.
- source_word: כָּל שֵׁרִית יִשְׂרָאֵל
  choice: der ganze Rest Israels
  rationale: שְׁאֵרִית kann „Überrest“ bedeuten, bezeichnet im erzählerischen Zusammenhang aber wahrscheinlich die übrigen, zuvor nicht aufgeführten Israeliten. „Rest“ wahrt den Grundsinn, ohne ungefordert einen prophetisch-theologischen Fachklang einzutragen.
- source_word: לֵב אֶחָד
  choice: war eines Herzens
  rationale: Der hebräische Ausdruck lautet wörtlich „ein Herz“ und bezeichnet die Einheit der Absicht. „Eines Herzens sein“ bewahrt das Bild und ist im Deutschen idiomatisch.
theological_decisions:
- issue: Mögliche theologische Nebenbedeutung von שְׁאֵרִית („Überrest“)
  choice: der ganze Rest Israels
  alternative: der ganze Überrest Israels
  rationale: In prophetischen Texten kann שְׁאֵרִית einen theologisch profilierten „Überrest“ bezeichnen. Hier fasst der erzählerische Kontext jedoch die nationale Unterstützung für David zusammen; daher ist die kontextuelle Bedeutung „Rest/übrige Israeliten“ wahrscheinlicher. Die alternative Wiedergabe wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden hebräischen Herzmetaphern werden beibehalten; „ungeteilt“ verdeutlicht die Ganzheit der Absicht, während „eines Herzens“ die gemeinsame Entschlossenheit ausdrückt. Die Satzgliederung in drei Sätze erhöht die Verständlichkeit, ohne den Gedankengang zu verändern.
