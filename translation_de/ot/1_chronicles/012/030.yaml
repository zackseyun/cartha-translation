  text: וּ/מִן בְּנֵ֧י בִנְיָמִ֛ן אֲחֵ֥י שָׁא֖וּל שְׁלֹ֣שֶׁת אֲלָפִ֑ים וְ/עַד הֵ֨נָּה֙ מַרְבִּיתָ֔/ם שֹׁמְרִ֕ים מִשְׁמֶ֖רֶת בֵּ֥ית שָׁאֽוּל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/030.yaml
  text: And from the sons of Benjamin[a], Saul’s brothers, three thousand[b]; until then most of them had been keeping watch over the house of Saul.
translation:
  language: de
  text: Und von den Söhnen Benjamins, den Brüdern Sauls[a], dreitausend Mann; bis dahin hatte die Mehrheit von ihnen noch den Wachdienst für das Haus Sauls[b] versehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ kann hier im weiteren Sinn „Stammesbrüder“, „Verwandte“ oder „Angehörige Sauls“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Das „Haus Sauls“ kann Sauls Familie und Haushalt, aber auch sein Königshaus oder dessen Interessen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Und von
  rationale: Die Verbindung aus Konjunktion und Präposition führt die Aufzählung der Stammesverbände fort und bewahrt ihren additiven Aufbau.
- source_word: בְּנֵי בִנְיָמִן
  choice: den Nachkommen Benjamins
  rationale: „Nachkommen“ gibt die genealogische Stammesbezeichnung natürlich wieder, ohne ausschließlich an unmittelbare Söhne denken zu lassen.
- source_word: אֲחֵי שָׁאוּל
  choice: den Brüdern Sauls
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt im Haupttext erhalten; ihre mögliche weitere Bedeutung als Stammesbrüder oder Verwandte wird in einer Fußnote erläutert.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: 3.000 Mann
  rationale: Die Zahl wird standardgemäß wiedergegeben; „Mann“ ergänzt im Deutschen das aus dem Zusammenhang erkennbare Gezählte.
- source_word: וְעַד הֵנָּה
  choice: bis dahin
  rationale: Die Wendung verweist innerhalb der historischen Erzählung auf den bis zu diesem Zeitpunkt bestehenden Zustand.
- source_word: מַרְבִּיתָם
  choice: die Mehrheit von ihnen
  rationale: Die Form bezeichnet den größeren Teil der genannten Gruppe; diese Wiedergabe ist präzise und modern.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת
  choice: hatte … die Treue gehalten
  rationale: Die hebräische Verbindung bedeutet wörtlich, eine Wache, Pflicht oder Obhut zu bewahren. Im Zusammenhang bezeichnet sie die fortdauernde Bindung an Sauls Haus; „die Treue halten“ gibt diesen Sinn idiomatisch wieder.
- source_word: בֵּית שָׁאוּל
  choice: dem Haus Sauls
  rationale: „Haus“ bewahrt die Bedeutungsbreite zwischen Haushalt, Familie, Königshaus und dynastischen Interessen, ohne sie vorschnell einzuengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die aufzählende Satzform des hebräischen Kontextes bleibt erhalten. „Die Treue gehalten“ ist idiomatischer als eine mechanische Wiedergabe mit „Wache halten“, während „Haus Sauls“ die sachliche Mehrdeutigkeit des Originals bewahrt.
