  text: וּ/מֵ/אָשֵׁ֗ר יוֹצְאֵ֥י צָבָ֛א לַ/עֲרֹ֥ךְ מִלְחָמָ֖ה אַרְבָּעִ֥ים אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/037.yaml
  text: And from Asher[a], forty thousand who went out for military service, to array themselves for battle.
translation:
  language: de
  text: 'Und von Ascher: 40.000, die zum Heeresdienst auszogen, um sich zur Schlacht aufzustellen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »40.000, die zum Heeresdienst auszogen, um sich zum Krieg aufzustellen.« Das Hebräische verbindet die Wendung für das Ausziehen zum Heeresdienst mit einem Verb, das das Ordnen oder Aufstellen in Schlachtordnung bezeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאָשֵׁר
  choice: Und von Ascher
  rationale: Die vorangestellte Konjunktion und Präposition werden direkt wiedergegeben; »Ascher« bezeichnet hier im Zusammenhang den Stamm, ohne dass »Stamm« ergänzt werden muss.
- source_word: יוֹצְאֵי צָבָא
  choice: die zum Heeresdienst auszogen
  rationale: Die Verbindung bezeichnet Personen, die zum organisierten militärischen Dienst ausziehen. Die Formulierung bewahrt sowohl die Bewegung von יצא als auch den militärischen Sinn von צבא.
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: um sich zur Schlacht aufzustellen
  rationale: ערך bezeichnet im militärischen Zusammenhang das Ordnen beziehungsweise Aufstellen in Schlachtordnung. Die reflexive deutsche Formulierung ist natürlich und macht deutlich, dass die Männer selbst die Formation einnehmen.
- source_word: אַרְבָּעִים אָלֶף
  choice: '40.000'
  rationale: Die Kardinalzahl wird im modernen deutschen Bibeltext klar und unmittelbar als Zahl wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt bildet die listenartige Struktur des hebräischen Truppenkatalogs ab; »Heeresdienst« und »zur Schlacht aufstellen« erhalten die militärische Bildsprache, ohne sie unnötig auszudeuten.
