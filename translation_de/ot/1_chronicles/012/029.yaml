  text: וְ/צָד֥וֹק נַ֖עַר גִּבּ֣וֹר חָ֑יִל וּ/בֵית אָבִ֥י/ו שָׂרִ֖ים עֶשְׂרִ֥ים וּ/שְׁנָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/029.yaml
  text: And Zadok[a], a young man mighty in valor[b], and from his father’s house twenty-two commanders.
translation:
  language: de
  text: Und Zadok, ein junger, tapferer Mann, und aus seinem Vaterhaus zweiundzwanzig Anführer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדוֹק
  choice: Zadok
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition transliteriert.
- source_word: נַעַר
  choice: ein junger Mann
  rationale: Im militärischen Zusammenhang bezeichnet das Wort am ehesten einen jungen männlichen Erwachsenen; die Wiedergabe vermeidet die stärker deutenden Möglichkeiten »Krieger« und »Diener«.
- source_word: גִּבּוֹר חָיִל
  choice: tapferer Mann
  rationale: Die feste Verbindung bezeichnet einen durch Kraft und Tüchtigkeit, besonders im Kampf, ausgezeichneten Mann. »Tapferer Mann« ist natürliches modernes Deutsch, ohne den militärischen Sinn unnötig zu verengen.
- source_word: בֵית אָבִיו
  choice: seinem Vaterhaus
  rationale: Die Wiedergabe bewahrt das hebräische Bild für die väterliche Großfamilie beziehungsweise Abstammungsgemeinschaft.
- source_word: שָׂרִים
  choice: Anführer
  rationale: Im Kontext der Truppenaufstellung sind Personen mit Leitungs- oder Befehlsgewalt gemeint. »Anführer« wahrt die Breite des Ausdrucks besser als das spezifischere »Befehlshaber«.
- source_word: עֶשְׂרִים וּשְׁנָיִם
  choice: zweiundzwanzig
  rationale: Direkte und idiomatische Wiedergabe der Kardinalzahl.
- source_word: וְ / וּ
  choice: und
  rationale: Die Konjunktionen verbinden den Eintrag mit der vorausgehenden Liste und seine beiden Satzglieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische Listenform des Hebräischen bleibt erhalten; ein Verb wie »kamen« oder »waren« wird nicht ergänzt. »Vaterhaus« bewahrt die historische Sozialbezeichnung, bleibt aber im Deutschen verständlich.
