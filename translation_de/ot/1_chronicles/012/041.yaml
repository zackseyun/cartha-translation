revisions:
- from: 'Auch die, die in ihrer Nähe wohnten, bis hin nach Issachar, Sebulon und Naftali,[a] brachten auf Eseln, Kamelen, Maultieren und Rindern Lebensmittel herbei: Mehl, Feigenkuchen, Rosinen,[b] Wein, Öl sowie Rinder und Schafe in großer Menge. Denn in Israel herrschte Freude.'
  to: 'Auch diejenigen in ihrer Nähe, bis hin zu Issachar, Sebulon und Naftali,[a] brachten auf Eseln, Kamelen, Maultieren und Rindern Lebensmittel herbei: Mehl, Feigenkuchen, Rosinen,[b] Wein, Öl sowie Rinder und Schafe in großer Menge. Denn in Israel herrschte Freude.'
  rationale: Die einzige notwendige Änderung entfernt die nicht im Ausgangstext enthaltene Aussage, die genannten Personen hätten dort gewohnt. Die Formulierung »diejenigen in ihrer Nähe« wahrt die offene relationale Bedeutung des Hebräischen. Die geringfügige Anpassung von »nach« zu »zu« vermeidet eine unnötige Festlegung auf Ortsnamen und lässt die im Kontext naheliegende Reichweitenangabe offen. Fußnotenanker und Fußnoten bleiben vollständig und korrekt zugeordnet.
