  text: וְ/גַ֣ם הַ/קְּרֽוֹבִים אֲ֠לֵי/הֶם עַד יִשָׂשכָ֨ר וּ/זְבֻל֜וּן וְ/נַפְתָּלִ֗י מְבִיאִ֣ים לֶ֡חֶם בַּ/חֲמוֹרִ֣ים וּ/בַ/גְּמַלִּ֣ים וּ/בַ/פְּרָדִ֣ים וּֽ/בַ/בָּקָ֡ר מַאֲכָ֡ל קֶ֠מַח דְּבֵלִ֨ים וְ/צִמּוּקִ֧ים וְ/יַֽיִן וְ/שֶׁ֛מֶן וּ/בָקָ֥ר וְ/צֹ֖אן לָ/רֹ֑ב כִּ֥י שִׂמְחָ֖ה בְּ/יִשְׂרָאֵֽל־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/041.yaml
  text: 'Also those near them[a], as far as Issachar and Zebulun and Naphtali, were bringing food on donkeys, camels, mules, and cattle: provisions of flour, fig cakes, raisin cakes, wine, oil, cattle, and sheep in abundance[c][b], for there was joy in Israel.'
translation:
  language: de
  text: 'Auch diejenigen in ihrer Nähe, bis hin zu Issachar, Sebulon und Naftali,[a] brachten auf Eseln, Kamelen, Maultieren und Rindern Lebensmittel herbei: Mehl, Feigenkuchen, Rosinen,[b] Wein, Öl sowie Rinder und Schafe in großer Menge. Denn in Israel herrschte Freude.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bis zu Issachar, Sebulon und Naftali«. Die Wendung bezeichnet die geografische Ausdehnung derer, die Vorräte herbeibrachten.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Rosinenkuchen« beziehungsweise »getrocknete Trauben«. Das hebräische Wort legt die genaue Zubereitungsform nicht eindeutig fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Bewahrt den anknüpfenden und ergänzenden Sinn in natürlichem Deutsch.
- source_word: הַקְּרוֹבִים אֲלֵיהֶם
  choice: die, die in ihrer Nähe wohnten
  rationale: Gibt die substantivierte Bezeichnung der Nahen verständlich wieder, ohne sie enger als unmittelbare Nachbarn festzulegen.
- source_word: עַד יִשָׂשכָר וּזְבֻלוּן וְנַפְתָּלִי
  choice: bis hin nach Issachar, Sebulon und Naftali
  rationale: עַד bezeichnet hier wahrscheinlich die geografische Ausdehnung; die Fußnote bewahrt die mögliche alternative Zuordnung.
- source_word: מְבִיאִים
  choice: brachten ... herbei
  rationale: Das Partizip beschreibt im Erzählzusammenhang die fortdauernde Versorgungstätigkeit; die deutsche Verbform ist flüssig und kontextgerecht.
- source_word: לֶחֶם
  choice: Lebensmittel
  rationale: Obwohl das Wort häufig »Brot« bedeutet, dient es hier als Oberbegriff für die anschließend aufgezählten Nahrungsmittel.
- source_word: בַּחֲמוֹרִים וּבַגְּמַלִּים וּבַפְּרָדִים וּבַבָּקָר
  choice: auf Eseln, Kamelen, Maultieren und Rindern
  rationale: Die Präposition bezeichnet das Transportmittel; בָּקָר bedeutet Rinder bzw. Großvieh und nennt keine Wagen.
- source_word: מַאֲכָל
  choice: Lebensmittel (als Einleitung der Liste nicht eigens wiederholt)
  rationale: Eine zweite deutsche Sammelbezeichnung direkt nach »Lebensmittel« wäre schwerfällig; der Doppelpunkt leitet die näher erläuternde Proviantliste klar ein.
- source_word: קֶמַח
  choice: Mehl
  rationale: Übliche und kontextgerechte Wiedergabe des gemahlenen Getreideprodukts.
- source_word: דְּבֵלִים
  choice: Feigenkuchen
  rationale: Bezeichnet gepresste Feigenmassen, die sich lagern und transportieren ließen.
- source_word: צִמּוּקִים
  choice: Rosinen
  rationale: Das Wort bezeichnet getrocknete Trauben; ob lose Rosinen oder gepresste Rosinenkuchen gemeint sind, ist nicht sicher und wird in der Fußnote vermerkt.
- source_word: יַיִן
  choice: Wein
  rationale: Direkte Standardentsprechung.
- source_word: שֶׁמֶן
  choice: Öl
  rationale: Der hebräische Text nennt allgemein Öl; wahrscheinlich war Olivenöl gemeint, doch dies wird nicht ausdrücklich gesagt.
- source_word: לָרֹב
  choice: in großer Menge
  rationale: Gibt den quantitativen Sinn idiomatisch und würdig wieder.
- source_word: כִּי שִׂמְחָה בְּיִשְׂרָאֵל
  choice: Denn in Israel herrschte Freude
  rationale: Bewahrt die begründende Verknüpfung und formuliert den Nominalsatz natürlich auf Deutsch.
