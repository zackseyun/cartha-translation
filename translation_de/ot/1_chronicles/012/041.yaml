  source_fidelity: Die Wiedergabe der Versorgungsgüter und der abschließenden Begründung ist insgesamt quellentreu. »die in ihrer Nähe wohnten« fügt jedoch gegenüber הַקְּרֹבִים אֲלֵיהֶם eine nicht ausgedrückte Wohnsituation hinzu; der Ausdruck bezeichnet schlicht die ihnen Nahen bzw. in ihrer Nähe Befindlichen. Die Liste kann mit »Lebensmittel« als Sammelbegriff idiomatisch wiedergegeben werden, auch wenn מַאֲכָל im Deutschen nicht eigens doppelt ausgedrückt wird.
  naturalness: Der Satz ist gut verständliches modernes Standarddeutsch. »bis hin zu Issachar, Sebulon und Naftali« ist etwas näher am hebräischen Ausdruck als »bis hin nach«, ohne die geographisch-soziale Reichweite festzulegen. »auf ... Rindern« bleibt wegen des genannten Transportmittels zwar leicht ungewöhnlich, ist aber dem Text entsprechend.
  terminology: Die Namensformen Issachar, Sebulon und Naftali sind im deutschen Bibelgebrauch etabliert. »Feigenkuchen«, »Rosinen«, »Wein«, »Öl«, »Rinder« und »Schafe« sind sachgerecht. Die Fußnote zu צִמּוּקִים bewahrt zutreffend die lexikalische Unsicherheit zwischen Rosinen und einer zubereiteten bzw. gepressten Form.
