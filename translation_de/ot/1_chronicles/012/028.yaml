  - severity: medium
    issue: Die Fußnote erklärt die wahrscheinliche Deutung zu spezifisch als „oberste[r] Vertreter des aaronitischen Priesterhauses“.
    rationale: Diese Erklärung geht über die knappe, semantisch offene Formulierung hinaus und sollte als mögliche Lesart, nicht als festgelegte institutionelle Funktion erscheinen.
