  text: וִ/יהוֹיָדָ֖ע הַ/נָּגִ֣יד לְ/אַהֲרֹ֑ן וְ/עִמּ֕/וֹ שְׁלֹ֥שֶׁת אֲלָפִ֖ים וּ/שְׁבַ֥ע מֵאֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/028.yaml
  text: and Jehoiada[a], the leader of Aaron, and with him three thousand seven hundred.
translation:
  language: de
  text: und Jojada, der Anführer für Aaron,[a] und mit ihm 3.700.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Anführer Aarons“; die Präposition kann hier eine Zugehörigkeit oder Beziehung zu Aaron bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹיָדָע
  choice: und Jojada
  rationale: Die Konjunktion ו wird als „und“ wiedergegeben und führt die listenartige Aufzählung fort. Der Personenname יהוידע erscheint in seiner geläufigen deutschen Bibelform „Jojada“.
- source_word: הַנָּגִיד
  choice: der Anführer
  rationale: נָגִיד bezeichnet einen Führer, Vorsteher oder Obersten. „Anführer“ ist im Zusammenhang dieser Aufstellung verständlich und vermeidet die monarchische Nebenbedeutung von „Fürst“.
- source_word: לְאַהֲרֹן
  choice: des Hauses Aaron
  rationale: לְ bezeichnet hier die Zugehörigkeit oder Zuordnung. „Des Hauses Aaron“ macht im Deutschen knapp verständlich, dass Jojada die aaronitische Priesterschaft vertritt, ohne Aaron als noch lebende Person erscheinen zu lassen.
- source_word: וְעִמּוֹ
  choice: und mit ihm
  rationale: Die koordinierte Präpositionalphrase wird eng am Hebräischen wiedergegeben und leitet die Zahl der Jojada zugeordneten Männer ein.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּשְׁבַע מֵאוֹת
  choice: 3.700 Mann
  rationale: Die exakte Zahl wird in moderner deutscher Zahlenschreibung angegeben. „Mann“ wird aus dem militärischen und aufzählenden Kontext ergänzt, damit die Zahl im Deutschen natürlich verständlich ist.
theological_decisions:
- issue: Bezug von לְאַהֲרֹן
  choice: des Hauses Aaron
  alternative: für Aaron / zu Aaron gehörig
  rationale: Die Formulierung bezeichnet wahrscheinlich Jojadas leitende Stellung innerhalb der aaronitischen Priesterschaft. Da die Präposition mehrere Beziehungsnuancen zulässt, wird die wörtlichere Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzstruktur bewahrt den knappen Listenstil des Hebräischen. Die explizierende Wendung „des Hauses Aaron“ und die Ergänzung „Mann“ dienen natürlicher deutscher Verständlichkeit; die genuine Präpositionsnuance wird in der Fußnote offengelegt.
