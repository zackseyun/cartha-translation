base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/036.yaml
  text: From Dan[a], twenty-eight thousand six hundred prepared for battle.
translation:
  language: de
  text: 'Von Dan: 28.600 zum Kampf gerüstete Männer.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Männer, die zum Kampf aufgestellt waren“ oder „in Schlachtordnung Aufgestellte“. Die hebräische Partizipialform kann militärische Bereitschaft oder die Aufstellung zum Kampf bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Von
  rationale: Das einleitende וּ kann in dieser fortlaufenden Stammesliste im Deutschen unausgedrückt bleiben; „Von“ gibt die Herkunft natürlich und präzise wieder.
- source_word: הַדָּנִי
  choice: Dan
  rationale: Das substantivierte Gentiliz bezeichnet hier im Zusammenhang der Truppenaufstellung den Stamm Dan. „Von Dan“ ist im Deutschen idiomatischer als eine singularisch wirkende Wiedergabe wie „vom Daniten“.
- source_word: עֹרְכֵי מִלְחָמָה
  choice: Mann, die sich zur Schlacht aufstellten
  rationale: Die Partizipialverbindung bezeichnet Männer, die den Kampf beziehungsweise die Schlachtordnung aufstellen. Die Wiedergabe bewahrt den aktiven, militärischen Bildgehalt des hebräischen ערך und klingt zugleich in modernem Deutsch verständlich.
- source_word: עֶשְׂרִים וּשְׁמוֹנָה אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: '28.600'
  rationale: Die hebräische Kardinalzahl wird nach heutiger deutscher Schreibweise mit Tausenderpunkt wiedergegeben.
theological_decisions: []
