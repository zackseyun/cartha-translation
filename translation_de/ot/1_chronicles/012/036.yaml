  register: Knapper, listenartiger Satzbau entsprechend dem hebräischen Truppenverzeichnis. „Mann“ wurde zur natürlichen Kennzeichnung der gezählten Kämpfer ergänzt; die Fußnote hält die Bedeutungsbreite der militärischen Wendung offen.
