source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֣י יִשָּׂשכָ֗ר יוֹדְעֵ֤י בִינָה֙ לַֽ/עִתִּ֔ים לָ/דַ֖עַת מַה יַּעֲשֶׂ֣ה יִשְׂרָאֵ֑ל רָאשֵׁי/הֶ֣ם מָאתַ֔יִם וְ/כָל אֲחֵי/הֶ֖ם עַל פִּי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/033.yaml
  text: 'From the sons of Issachar[a], men who understood the times, to know what Israel should do: their chiefs were two hundred[b], and all their brothers were under their command.'
translation:
  language: de
  text: 'Und von den Söhnen Issachars: Männer, die die Zeiten zu beurteilen wussten und erkannten, was Israel tun sollte. Ihre Oberhäupter waren zweihundert, und alle ihre Brüder richteten sich nach ihrer Weisung.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nach ihrem Mund«; gemeint ist, dass sie ihrer Weisung oder ihrem Befehl folgten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשָּׂשכָר
  choice: Und von den Söhnen Issachars
  rationale: Die Formulierung bewahrt die hebräische Stammesbezeichnung und führt den nächsten Teil der Aufzählung mit dem vorangestellten וּ natürlich fort.
- source_word: יוֹדְעֵי בִינָה לָעִתִּים
  choice: Männer, die die Zeiten zu beurteilen wussten
  rationale: Die Verbindung bezeichnet Personen mit Einsicht beziehungsweise Urteilsvermögen hinsichtlich der jeweiligen Zeiten. Die Wiedergabe ist im Deutschen natürlich und lässt offen, ob historische Lage, Umstände oder Zeitpunkte im Vordergrund stehen.
- source_word: לָדַעַת מַה יַעֲשֶׂה יִשְׂרָאֵל
  choice: und erkannten, was Israel tun sollte
  rationale: Der Infinitiv beschreibt Ziel oder Folge ihrer Einsicht; der Imperfekt bezeichnet hier die situationsgemäß erforderliche Handlung, ohne eine Vorhersage auszudrücken.
- source_word: רָאשֵׁיהֶם מָאתַיִם
  choice: Ihre Oberhäupter waren zweihundert
  rationale: רָאשֵׁיהֶם meint die leitenden Männer. „Oberhäupter“ wahrt den formellen Charakter und die knappe Struktur des hebräischen Nominalsatzes.
- source_word: וְכָל אֲחֵיהֶם
  choice: und alle ihre Brüder
  rationale: „Brüder“ gibt אֲחֵיהֶם direkt wieder und bezeichnet im Zusammenhang die männlichen Stammesangehörigen.
- source_word: עַל־פִּיהֶם
  choice: richteten sich nach ihrer Weisung
  rationale: Die wörtliche Wendung „nach ihrem Mund“ ist ein Idiom für Handeln gemäß dem Wort oder der Anordnung anderer. „Nach ihrer Weisung“ vermittelt Leitung und Autorität, ohne unnötig einen strikt militärischen Befehlston festzulegen.
