id: 1CH.12.24
reference: 1 Chronicles 12:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ֠/אֵלֶּה מִסְפְּרֵ֞י רָאשֵׁ֤י הֶֽ/חָלוּץ֙ לַ/צָּבָ֔א בָּ֥אוּ עַל דָּוִ֖יד חֶבְר֑וֹנָ/ה לְ/הָסֵ֞ב מַלְכ֥וּת שָׁא֛וּל אֵלָ֖י/ו כְּ/פִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/024.yaml
  text: And these are the numbers of the heads of the armed troops for war[a], who came to David at Hebron to turn Saul’s kingdom over to him, according to the word of Yahweh.
translation:
  language: de
  text: Und dies sind die Zahlen der Anführer der zum Kriegsdienst Gerüsteten, die zu David nach Hebron kamen, um die Königsherrschaft Sauls auf ihn zu übertragen, gemäß dem Wort Jahwes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gemäß dem Mund Jahwes“; eine hebräische Redeweise für „gemäß dem Wort“ oder „wie Jahwe gesprochen hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפְּרֵי
  choice: die Zahlen
  rationale: Der Plural im Status constructus leitet die nachfolgende Aufzählung der jeweiligen Truppenstärken ein.
- source_word: רָאשֵׁי
  choice: der Anführer
  rationale: „Anführer“ gibt die militärisch-organisatorische Bedeutung von „Köpfe/Häupter“ in natürlichem modernem Deutsch wieder.
- source_word: הֶחָלוּץ לַצָּבָא
  choice: der zum Kriegsdienst Gerüsteten
  rationale: Die Wendung bezeichnet für den militärischen Einsatz ausgerüstete beziehungsweise bereitstehende Männer; die substantivierte Form wahrt den kollektiven Charakter.
- source_word: בָּאוּ עַל דָּוִיד חֶבְרוֹנָה
  choice: die zu David nach Hebron kamen
  rationale: עַל bezeichnet hier die Hinwendung zu David, nicht feindliches Vorgehen; das Richtungs-he an חֶבְרוֹנָה wird mit „nach Hebron“ wiedergegeben.
- source_word: לְהָסֵב מַלְכוּת שָׁאוּל אֵלָיו
  choice: um die Königsherrschaft Sauls auf ihn zu übertragen
  rationale: Der Hifil-Infinitiv von סבב bezeichnet hier das Veranlassen eines Übergangs. „Königsherrschaft“ betont die übertragene Herrschaft und nicht primär das Staatsgebiet.
- source_word: כְּפִי יְהוָה
  choice: gemäß dem Wort Jahwes
  rationale: Wörtlich „gemäß dem Mund Jahwes“; „Wort“ gibt die hebräische Redeweise verständlich wieder, ohne den Bezug auf die göttliche Äußerung abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird im Haupttext sichtbar bewahrt, statt durch einen Titel ersetzt zu werden.
- issue: Bedeutung von מַלְכוּת beim Übergang von Saul zu David
  choice: Königsherrschaft
  alternative: Königreich
  rationale: Der Zusammenhang betrifft den Wechsel der königlichen Herrschaft. „Königsherrschaft“ vermeidet die unnötige Festlegung auf ein übertragenes Territorium.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Formulierung bleibt eng am hebräischen Kollektivbegriff, während schwer verständliche Hebraismen im Haupttext idiomatisch wiedergegeben und in der Fußnote transparent gemacht werden.
