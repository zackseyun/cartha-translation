lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: kamen
  rationale: Das narrative Wayyiqtol von בוא führt die Handlung fort und bezeichnet hier die Bewegung hin zu Davids Aufenthaltsort.
- source_word: מִן בְּנֵי בִנְיָמִן וִיהוּדָה
  choice: einige Männer aus Benjamin und Juda
  rationale: 'מִן hat hier partitive Bedeutung: Nur ein Teil der Angehörigen beider Stämme kam. „Männer aus Benjamin und Juda“ gibt die Stammeszugehörigkeit in natürlichem modernem Deutsch wieder, während „einige“ den partitiven Sinn ausdrücklich macht.'
- source_word: עַד לַמְצָד
  choice: in die Festung
  rationale: עַד mit der folgenden Richtungsangabe bezeichnet in diesem Bewegungskontext das Ziel. מְצָד ist ein befestigter Zufluchts- oder Verteidigungsort; „Festung“ ist knapp und kontextgerecht.
- source_word: לְדָוִיד
  choice: zu David
  rationale: Die Präposition kennzeichnet David als die Person am Zielort. Im Deutschen ist „zu David in die Festung“ natürlich und wahrt beide Zielangaben.
