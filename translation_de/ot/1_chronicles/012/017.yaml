  text: And some of the sons of Benjamin and Judah came to the stronghold[b][a], to David.
translation:
  language: de
  text: Einige aus den Stämmen Benjamin und Juda kamen zu David in die Festung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den befestigten Zufluchtsort“.'
