base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/015.yaml
  text: These were from the sons of Gad[a], heads of the army; the least was for a hundred, and the greatest for a thousand.
translation:
  language: de
  text: Diese waren Gaditer und Anführer des Heeres. Der Geringste konnte es mit hundert aufnehmen, der Größte mit tausend.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Der Geringste: einer für hundert, und der Größte für tausend.“ Die knappe hebräische Wendung bezeichnet wahrscheinlich ihre Kampfkraft oder militärische Wirksamkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מִבְּנֵי גָד
  choice: Diese gehörten zu den Söhnen Gads
  rationale: Die verblos formulierte hebräische Wendung bezeichnet die zuvor genannten Männer als Angehörige des Stammes Gad. „Gehörten zu“ ist im Deutschen natürlich und bewahrt den familiär-stammesbezogenen Ausdruck „Söhne Gads“.
- source_word: רָאשֵׁי הַצָּבָא
  choice: Anführer des Heeres
  rationale: רָאשֵׁי bedeutet wörtlich „Häupter“ und bezeichnet hier militärische Führer. „Anführer“ gibt die Funktion in verständlichem, modernem Deutsch wieder, ohne einen genaueren Rang wie „Befehlshaber“ vorauszusetzen.
- source_word: הַקָּטָן
  choice: der Geringste
  rationale: Im Gegensatz zu הַגָּדוֹל bezeichnet das Wort hier wahrscheinlich den hinsichtlich Rang, Stärke oder Bedeutung Geringsten, nicht notwendig den körperlich Kleinsten.
- source_word: אֶחָד לְמֵאָה ... וְהַגָּדוֹל לְאָלֶף
  choice: konnte es mit hundert aufnehmen, der Größte mit tausend
  rationale: Der hebräische Satz ist elliptisch und stellt den Geringsten zu hundert, den Größten zu tausend ins Verhältnis. Die deutsche idiomatische Wiedergabe versteht dies im militärischen Zusammenhang als Aussage über Kampfkraft; die wörtlichere, mehrdeutige Form wird in der Fußnote bewahrt.
