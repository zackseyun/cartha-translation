source:
  edition: WLC
  text: מִ/זְּבֻל֞וּן יוֹצְאֵ֣י צָבָ֗א עֹרְכֵ֧י מִלְחָמָ֛ה בְּ/כָל כְּלֵ֥י מִלְחָמָ֖ה חֲמִשִּׁ֣ים אָ֑לֶף וְ/לַ/עֲדֹ֖ר בְּ/לֹא לֵ֥ב וָ/לֵֽב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/034.yaml
  text: From Zebulun[a], fifty thousand men fit for military service, prepared for battle with every kind of weapon of war[b], to help without a divided heart.
translation:
  language: de
  text: 'Aus Sebulon: 50.000 wehrfähige Männer, die sich mit allen Kriegswaffen zum Kampf aufstellten, um einmütig[a] Beistand zu leisten[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ohne Herz und Herz«; gemeint ist eine Haltung ohne geteilte Loyalität oder Doppelherzigkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »um sich in die Reihen einzugliedern« bzw. »um Unterstützung zu leisten«. Das hier verwendete hebräische Verb ist selten; gemeint ist offenbar, dass sie sich geschlossen zur Unterstützung anschlossen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְּבֻלוּן
  choice: Aus Sebulon
  rationale: Das Präfix מִן bezeichnet Herkunft; die Männer stammen aus dem Stamm Sebulon.
- source_word: יוֹצְאֵי צָבָא
  choice: wehrfähige Männer
  rationale: Die Wendung bezeichnet Männer, die zum Heeresdienst ausziehen konnten; »wehrfähig« gibt den idiomatischen Sinn knapp und verständlich wieder.
- source_word: עֹרְכֵי מִלְחָמָה
  choice: die sich … zum Kampf aufstellten
  rationale: ערך bezeichnet das Ordnen beziehungsweise Aufstellen zur Schlacht und wird hier als aktive Partizipialform wiedergegeben.
- source_word: בְּכָל כְּלֵי מִלְחָמָה
  choice: mit allen Kriegswaffen
  rationale: כְּלֵי מִלְחָמָה umfasst Kriegsgerät beziehungsweise Waffen; im militärischen Zusammenhang ist »Kriegswaffen« natürlich und präzise.
- source_word: חֲמִשִּׁים אָלֶף
  choice: '50.000'
  rationale: Direkte Wiedergabe der Zahl in moderner deutscher Schreibweise.
- source_word: וְלַעֲדֹר
  choice: um … Beistand zu leisten
  rationale: Das seltene Verb עדר ist an dieser Stelle unsicher. Im Kontext bezeichnet es offenbar unterstützendes Hinzutreten oder Eingliedern, ohne dass die genaue militärische Nuance feststeht.
- source_word: בְּלֹא לֵב וָלֵב
  choice: einmütig
  rationale: Wörtlich »ohne Herz und Herz«; die hebräische Wendung verneint geteilte Loyalität oder Doppelherzigkeit. »Einmütig« drückt die ungeteilte Haltung idiomatisch aus.
theological_decisions:
- issue: Art der Unterstützung und Loyalität
  choice: um einmütig Beistand zu leisten
  alternative: um sich ohne geteiltes Herz in die Reihen einzugliedern
  rationale: Der Text verbindet ein seltenes, in seiner genauen Bedeutung unsicheres Verb mit einer Wendung für ungeteilte Loyalität. Die Übersetzung bewahrt den Sinn militärischer Unterstützung, ohne ein bestimmtes technisches Manöver oder eine weitergehende theologische Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem chronistischem Listenstil. Die militärische Bildsprache bleibt erhalten; die beiden unsicheren beziehungsweise idiomatischen Wendungen werden im Haupttext natürlich und in den Fußnoten genauer wiedergegeben.
