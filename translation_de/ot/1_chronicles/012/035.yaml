source:
  edition: WLC
  text: וּ/מִ/נַּפְתָּלִ֖י שָׂרִ֣ים אָ֑לֶף וְ/עִמָּ/הֶם֙ בְּ/צִנָּ֣ה וַ/חֲנִ֔ית שְׁלֹשִׁ֥ים וְ/שִׁבְעָ֖ה אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/035.yaml
  text: 'From Naphtali: 1,000 commanders[b][a], and with them 37,000 with shield and spear.'
translation:
  language: de
  text: 'Von Naftali: 1.000 Befehlshaber[a] und mit ihnen 37.000 Mann mit Schild[b] und Speer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Anführer«, »Oberste« oder »Hauptleute«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann insbesondere einen großen Schild bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנַּפְתָּלִי
  choice: Von Naftali
  rationale: Die Verbindung bedeutet wörtlich »und von Naftali«. Im fortlaufenden Verzeichnis ist »Von Naftali« im Deutschen natürlich und bewahrt die Angabe der Stammeszugehörigkeit.
- source_word: שָׂרִים
  choice: Befehlshaber
  rationale: שָׂרִים bezeichnet leitende Amtsträger oder militärische Führer. Im Zusammenhang der Heeresaufstellung gibt »Befehlshaber« Rang und Funktion wieder, ohne ein genaueres Amt festzulegen.
- source_word: אָלֶף
  choice: '1.000'
  rationale: Die Zahl wird für die gute Lesbarkeit innerhalb der militärischen Aufzählung in Ziffern wiedergegeben.
- source_word: וְעִמָּהֶם
  choice: und mit ihnen
  rationale: Die Formulierung bewahrt sowohl die verbindende Konjunktion als auch die Zuordnung der größeren Gruppe zu den Befehlshabern.
- source_word: בְּצִנָּה
  choice: mit Schild
  rationale: צִנָּה bezeichnet einen Schild, häufig einen großen Schild. Die allgemeinere Wiedergabe im Haupttext vermeidet eine unnötige Verengung; die mögliche Größenangabe wird in der Fußnote genannt.
- source_word: וַחֲנִית
  choice: und Speer
  rationale: חֲנִית ist die übliche Bezeichnung für einen Speer; die knappe Form entspricht dem Charakter der Ausrüstungsliste.
- source_word: שְׁלֹשִׁים וְשִׁבְעָה אָלֶף
  choice: 37.000 Mann
  rationale: Die Zahl wird zur Lesbarkeit in Ziffern wiedergegeben. »Mann« ist als im Deutschen notwendige Bezeichnung der gezählten und ausgerüsteten Personengruppe ergänzt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Listenform des hebräischen Textes bleibt erhalten; »Mann« wird zur natürlichen deutschen Wiedergabe der gezählten Krieger ergänzt. Die Fußnoten stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
