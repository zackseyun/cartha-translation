id: 1CH.12.22
reference: 1 Chronicles 12:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֵ֗מָּה עָזְר֤וּ עִם דָּוִיד֙ עַֽל הַ/גְּד֔וּד כִּֽי גִבּ֥וֹרֵי חַ֖יִל כֻּלָּ֑/ם וַ/יִּהְי֥וּ שָׂרִ֖ים בַּ/צָּבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/022.yaml
  text: And they helped David against the raiding band[a], for all of them were mighty men of valor[c][b], and they became commanders in the army.
translation:
  language: de
  text: Und sie halfen David gegen die Streifschar[a], denn sie alle waren tapfere Krieger[b] und wurden Befehlshaber[c] im Heer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen die Schar“ oder „gegen die Truppe“; das hebräische Wort kann eine militärische Abteilung oder eine plündernde Streifschar bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „kampfstarke Männer“; die hebräische Wendung bezeichnet tüchtige, tapfere und kampffähige Männer.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Anführer“ beziehungsweise „Oberste“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Und sie
  rationale: Das selbstständige Pronomen hebt die Gruppe hervor; die ausdrückliche Wiedergabe mit „sie“ bewahrt diesen Akzent in natürlichem Deutsch.
- source_word: עָזְרוּ עִם דָּוִיד
  choice: halfen David
  rationale: עזר bedeutet „helfen, unterstützen“. Obwohl עִם gewöhnlich „mit“ heißt, verlangt idiomatisches Deutsch hier den Dativ des Begünstigten.
- source_word: עַל הַגְּדוּד
  choice: gegen die Streifschar
  rationale: גְּדוּד bezeichnet eine bewaffnete Schar, Truppe oder plündernde Streifschar; „Streifschar“ bringt den wahrscheinlichen militärischen und räuberischen Kontext knapp zum Ausdruck, ohne die lexikalische Bandbreite zu verschweigen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier eine Begründung ein; „denn“ bewahrt den erklärenden Zusammenhang und den gehobenen Erzählton.
- source_word: גִבּוֹרֵי חַיִל
  choice: tapfere Krieger
  rationale: Die feste militärische Wendung bezeichnet kampfstarke, tüchtige und tapfere Männer. „Tapfere Krieger“ ist prägnant, natürlich und dem Kontext angemessen.
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Die Form betont, dass die Aussage ausnahmslos für die gesamte Gruppe gilt.
- source_word: וַיִּהְיוּ
  choice: wurden
  rationale: Die Erzählform bezeichnet hier am natürlichsten den Eintritt in eine neue Stellung, nicht nur einen statischen Zustand.
- source_word: שָׂרִים
  choice: Befehlshaber
  rationale: שָׂרִים kann Oberste, Anführer oder Amtsträger bezeichnen; im unmittelbaren Heereskontext ist „Befehlshaber“ die klarste Wiedergabe.
- source_word: בַּצָּבָא
  choice: im Heer
  rationale: צָבָא bezeichnet hier die organisierte Streitmacht; „Heer“ entspricht dem würdigen historischen Erzählregister.
