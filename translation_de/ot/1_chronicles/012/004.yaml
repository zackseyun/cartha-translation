  text: and Ishmaiah the Gibeonite[b][a], a mighty man among the Thirty and over the Thirty.
translation:
  language: de
  text: und Jischmaja, der Gibeoniter, ein Held unter den Dreißig[a] und über den Dreißig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Dreißig“; die hebräische Präposition kann die Zugehörigkeit zu der als „die Dreißig“ bekannten Elitegruppe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung kann eine Führungsstellung oder einen höheren Rang im Verhältnis zu den Dreißig bezeichnen; die genaue Funktion wird nicht näher bestimmt.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/יִֽשְׁמַֽעְיָה
  choice: und Jischmaja
  rationale: Das vorangestellte וְ führt die Aufzählung fort; der Personenname wird in einer im Deutschen gut lesbaren, am Hebräischen orientierten Form wiedergegeben.
- source_word: הַ/גִּבְעוֹנִי
  choice: der Gibeoniter
  rationale: Das Gentiliz mit Artikel bezeichnet Jischmajas Herkunft oder Zugehörigkeit zu Gibeon; die substantivische Form entspricht der knappen hebräischen Ausdrucksweise.
- source_word: גִּבּוֹר
  choice: ein Held
  rationale: Im militärischen Kontext bezeichnet גִּבּוֹר einen kampferprobten, tapferen Mann. „Held“ ist knapp, würdig und stellt einen natürlichen Bezug zu Davids Helden her.
- source_word: בַּ/שְּׁלֹשִׁים
  choice: unter den Dreißig
  rationale: Die Präposition בְּ mit Artikel ordnet Jischmaja am ehesten der als „die Dreißig“ bezeichneten Gruppe zu; die Formulierung lässt die mögliche Nuance einer bloßen Zuordnung offen.
- source_word: וְ/עַל הַ/שְּׁלֹשִׁים
  choice: und Anführer der Dreißig
  rationale: עַל bezeichnet hier wahrscheinlich eine Stellung über der Gruppe. Die idiomatische deutsche Wiedergabe „Anführer“ macht das gemeinte Leitungs- oder Rangverhältnis verständlich, ohne dessen genaue institutionelle Form festzulegen.
theological_decisions: []
