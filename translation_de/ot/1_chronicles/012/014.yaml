- source_word: הָעֲשִׂירִי
  choice: der zehnte
  rationale: Das mit Artikel versehene Ordinalzahlwort bezeichnet Jeremias Stellung in der Namensliste; die Kleinschreibung entspricht der substantivischen Ellipse nach einem Namen.
- source_word: מַכְבַּנַּי
  choice: Machbannai
  rationale: Der Personenname wird nach den üblichen deutschen Umschriftkonventionen wiedergegeben; כ wird hier als „ch“ und der verdoppelte Konsonant als „nn“ dargestellt.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: der elfte
  rationale: Die hebräische Kardinalzahl „elf“ steht in dieser Liste elliptisch und parallel zu „der zehnte“; natürliches Deutsch gibt die gemeinte Rangfolge mit der Ordinalzahl wieder.
