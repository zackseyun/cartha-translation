  text: כִּ֚י לְ/עֶת י֣וֹם בְּ/י֔וֹם יָבֹ֥אוּ עַל דָּוִ֖יד לְ/עָזְר֑/וֹ עַד לְ/מַחֲנֶ֥ה גָד֖וֹל כְּ/מַחֲנֵ֥ה אֱלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/023.yaml
  text: For day by day they came to David to help him[a], until there was a great camp, like the camp of God.
translation:
  language: de
  text: Denn Tag für Tag kamen sie zu David, um ihm zu helfen, bis daraus ein großes Heerlager wurde – wie ein Heerlager Gottes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Gottes Heerlager“ oder „wie ein göttliches/himmlisches Heerlager“. Das Hebräische lässt die Wendung knapp und bildkräftig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Erklärung zum vorausgehenden Zusammenhang ein und wahrt den erzählerischen Anschluss.
- source_word: לְעֶת יוֹם בְּיוֹם
  choice: Tag für Tag
  rationale: Gibt die fortlaufende, wiederholte Handlung an aufeinanderfolgenden Tagen natürlich wieder.
- source_word: יָבֹאוּ
  choice: kamen sie
  rationale: Das Imperfekt beschreibt hier wiederholtes Geschehen in der Vergangenheit; die Wiederholung wird bereits durch „Tag für Tag“ deutlich.
- source_word: עַל דָּוִיד
  choice: zu David
  rationale: Bei einem Verb des Kommens und angesichts der folgenden Zweckangabe bezeichnet die Präposition die Bewegung auf David zu, nicht Feindschaft gegen ihn.
- source_word: לְעָזְרוֹ
  choice: um ihm zu helfen
  rationale: Der Infinitiv mit Suffix drückt den Zweck ihres Kommens aus.
- source_word: עַד לְמַחֲנֶה גָדוֹל
  choice: bis daraus ein großes Heerlager wurde
  rationale: Die knappe hebräische Wendung bezeichnet das erreichte Ergebnis. „Daraus“ macht im Deutschen deutlich, dass die fortgesetzten Zugänge zu dieser Größe führten; „Heerlager“ bewahrt den militärischen Zusammenhang von מַחֲנֶה.
- source_word: כְּמַחֲנֵה אֱלֹהִים
  choice: wie ein Heerlager Gottes
  rationale: Bewahrt den kompakten Genitiv und die eindrückliche Vergleichsform, ohne sie auf bloße Größe oder eine bestimmte übernatürliche Deutung festzulegen.
theological_decisions:
- issue: Bedeutung von אֱלֹהִים im Vergleich כְּמַחֲנֵה אֱלֹהִים
  choice: Gottes
  alternative: göttlich; himmlisch
  rationale: „Gottes“ entspricht am unmittelbarsten der hebräischen Genitivverbindung und erhält deren theologische und bildhafte Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich hebt den abschließenden, ungewöhnlichen Vergleich hervor. „Heerlager“ macht den militärischen Kontext verständlich, ohne das Bild zu einer abstrakten Bezeichnung wie „Armee“ zu verflachen.
