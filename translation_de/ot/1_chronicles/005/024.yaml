  text: וְ/אֵ֖לֶּה רָאשֵׁ֣י בֵית אֲבוֹתָ֑/ם וְ/עֵ֡פֶר וְ/יִשְׁעִ֡י וֶ/אֱלִיאֵ֡ל וְ֠/עַזְרִיאֵל וְ/יִרְמְיָ֨ה וְ/הוֹדַוְיָ֜ה וְ/יַחְדִּיאֵ֗ל אֲנָשִׁים֙ גִּבּ֣וֹרֵי חַ֔יִל אַנְשֵׁ֣י שֵׁמ֔וֹת רָאשִׁ֖ים לְ/בֵ֥ית אֲבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/024.yaml
  text: 'These were the heads of their fathers’ houses: Epher[a], Ishi, Eliel, Azriel, Jeremiah, Hodaviah, and Jahdiel, mighty men of valor, men of renown[b], heads of their fathers’ houses.'
translation:
  language: de
  text: 'Das waren die Oberhäupter ihrer Großfamilien[a]: Efer, Jischi, Eliël, Azriël, Jeremia, Hodawja und Jachdiël. Sie waren tapfere Krieger, angesehene Männer[b] und Oberhäupter ihrer Großfamilien.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Häuser ihrer Väter«; gemeint sind Großfamilien oder Sippen, die auf einen gemeinsamen Vorfahren zurückgeführt wurden.
    reason: cultural_note
  - marker: b
    text: Wörtlich »Männer von Namen«, also bekannte oder besonders angesehene Männer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Das waren
  rationale: Leitet die Namensliste hinweisend ein; das vorangestellte ו wird im natürlichen deutschen Erzählfluss nicht eigens wiedergegeben.
- source_word: רָאשֵׁי בֵית אֲבוֹתָם
  choice: die Oberhäupter ihrer Großfamilien
  rationale: בית אבות bezeichnet einen auf einen gemeinsamen Vorfahren zurückgehenden Familien- oder Sippenverband. »Großfamilien« vermittelt diese Sozialstruktur im heutigen Deutsch verständlich.
- source_word: עֵפֶר
  choice: Efer
  rationale: Nahe Umschrift des hebräischen Personennamens mit deutschem f für פ ohne Dagesch.
- source_word: יִשְׁעִי
  choice: Jischi
  rationale: Deutsche Umschrift des hebräischen Personennamens.
- source_word: אֱלִיאֵל
  choice: Eliël
  rationale: Deutsche Umschrift; das Trema macht die getrennte Aussprache der aufeinanderfolgenden Vokale kenntlich.
- source_word: עַזְרִיאֵל
  choice: Asriël
  rationale: Nahe deutsche Umschrift des hebräischen Namens; ס/ז-Lautwert wird hier mit »s« wiedergegeben.
- source_word: יִרְמְיָה
  choice: Jeremia
  rationale: Im Deutschen etablierte Form des Personennamens.
- source_word: הוֹדַוְיָה
  choice: Hodawja
  rationale: Nahe deutsche Umschrift der im Vers bezeugten Namensform.
- source_word: יַחְדִּיאֵל
  choice: Jachdiël
  rationale: Nahe deutsche Umschrift des hebräischen Personennamens; »ch« gibt ח wieder.
- source_word: אֲנָשִׁים גִּבּוֹרֵי חַיִל
  choice: tapfere Krieger
  rationale: Die feste Wendung bezeichnet hier Männer von Stärke, Mut und militärischer Tüchtigkeit; die knappe Formulierung ist im modernen Deutsch natürlich.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: angesehene Männer
  rationale: Die wörtliche Wendung »Männer von Namen« ist ein Idiom für bekannte, ausgezeichnete oder angesehene Männer.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: Oberhäupter ihrer Großfamilien
  rationale: Die abschließende Wiederholung ihres Ranges wird entsprechend dem Hebräischen beibehalten.
