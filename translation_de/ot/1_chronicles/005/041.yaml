id: 1CH.5.41
reference: 1 Chronicles 5:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וִ/יהוֹצָדָ֣ק הָלַ֔ךְ בְּ/הַגְל֣וֹת יְהוָ֔ה אֶת יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בְּ/יַ֖ד נְבֻכַדְנֶאצַּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/041.yaml
  text: And Jehozadak went away when Yahweh sent Judah and Jerusalem into exile by the hand of Nebuchadnezzar[a].
translation:
  language: de
  text: Und Jozadak zog fort, als Jahwe Juda und Jerusalem durch Nebukadnezar in die Verbannung führte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und Jozadak ging, als Jahwe Juda und Jerusalem durch die Hand Nebukadnezars verbannte.“'
    reason: Die Fußnote bewahrt die hebräischen Ausdrucksweisen הָלַךְ („ging“), גלה („verbannte“) und בְּיַד („durch die Hand von“).
lexical_decisions:
- source_word: וִיהוֹצָדָק
  choice: Und Jozadak
  rationale: Die Konjunktion ו wird mit „Und“ wiedergegeben. „Jozadak“ ist die im Deutschen geläufige Form des hebräischen Eigennamens יְהוֹצָדָק.
- source_word: הָלַךְ
  choice: zog fort
  rationale: הלך bedeutet grundsätzlich „gehen“. Im Zusammenhang der Verschleppung gibt „zog fort“ die Bewegung aus dem Land wieder, ohne eine freiwillige Abreise zu behaupten.
- source_word: בְּהַגְלוֹת
  choice: als … in die Verbannung führte
  rationale: 'ב mit dem Infinitiv von גלה bezeichnet hier den Zeitpunkt: „als … verbannte“. Die gewählte Formulierung ist natürliches Deutsch und bewahrt den Gedanken des Exils.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶת־יְהוּדָה וִירוּשָׁלָם
  choice: Juda und Jerusalem
  rationale: Beide Namen stehen unmittelbar als Objekte der Verbannung. Eine Ergänzung wie „die Bewohner von“ wäre zwar sinngemäß möglich, würde den Wortlaut jedoch interpretierend erweitern.
- source_word: בְּיַד
  choice: durch
  rationale: Die Wendung „durch die Hand von“ bezeichnet das Mittel beziehungsweise den handelnden menschlichen Beauftragten. „Durch“ gibt diese Funktion in natürlichem modernem Deutsch wieder.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Dies ist die etablierte deutsche Namensform des babylonischen Königs.
theological_decisions:
- issue: Göttliches und menschliches Handeln bei der Verbannung
  choice: Jahwe wird als derjenige dargestellt, der Juda und Jerusalem in die Verbannung führt; Nebukadnezar ist das menschliche Werkzeug.
  alternative: Nebukadnezar allein als handelndes Subjekt der Verbannung
  rationale: In der hebräischen Syntax ist Jahwe das Subjekt des Infinitivsatzes; בְּיַד נְבֻכַדְנֶאצַּר kennzeichnet Nebukadnezar als ausführenden menschlichen Akteur. Die Übersetzung bewahrt beide Handlungsebenen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zog fort“ vermeidet ein unnötig altertümliches Register; die Fußnote bietet zugleich eine formalere, hebraismennähere Wiedergabe.
