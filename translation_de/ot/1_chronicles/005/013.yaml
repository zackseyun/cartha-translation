base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/013.yaml
  text: 'And their brothers[a], according to their fathers’ houses: Michael, Meshullam, Sheba, Jorai, Jachan, Zia[d][c][b], and Eber—seven.'
translation:
  language: de
  text: 'Und ihre Brüder[a], nach ihren Vaterhäusern[b]: Michael, Meschullam, Scheba, Jorai, Jakan, Sia[c] und Eber – sieben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Verwandten«; das hebräische Wort für »Brüder« kann in genealogischen Zusammenhängen auch Angehörige der weiteren Sippe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Ein »Vaterhaus« war eine väterliche Großfamilie beziehungsweise eine Untergliederung der Sippe.
    reason: cultural_note
  - marker: c
    text: 'Auch: »Sisa«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Und ihre Brüder
  rationale: Die Grundbedeutung ist »Brüder«; in genealogischen Zusammenhängen kann das Wort auch weitere männliche Verwandte derselben Sippe bezeichnen. Die wörtliche Verwandtschaftsbezeichnung bleibt im Text erhalten, die mögliche weitere Bedeutung wird in einer Fußnote genannt.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: nach ihren Vaterhäusern
  rationale: Die feste genealogische Wendung bezeichnet die Gliederung nach väterlichen Großfamilien oder Sippen. »Vaterhäuser« bewahrt die historische Sozialstruktur knapp und verständlich.
- source_word: מִיכָאֵל
  choice: Michael
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: וּמְשֻׁלָּם
  choice: Meschullam
  rationale: Lautnahe und im Deutschen etablierte Umschrift des Personennamens.
- source_word: וְשֶׁבַע
  choice: Scheba
  rationale: Der masoretisch vokalisierte Personenname wird nach üblicher deutscher Bibeltradition als »Scheba« wiedergegeben.
- source_word: וְיוֹרַי
  choice: Jorai
  rationale: Lautnahe deutsche Umschrift des Personennamens.
- source_word: וְיַעְכָּן
  choice: Jakan
  rationale: Lautnahe deutsche Umschrift der masoretischen Form yaʿkān; der Kehllaut Ajin wird in einer allgemein lesbaren Bibelübersetzung nicht eigens markiert.
- source_word: וְזִיעַ
  choice: Sia
  rationale: Die Wiedergabe folgt unmittelbar der masoretischen Form zîaʿ in deutscher Namensschreibung; abweichende Überlieferungen oder Umschriften werden in der Fußnote vermerkt.
- source_word: וָעֵבֶר
  choice: und Eber
  rationale: »Eber« ist die übliche deutsche Wiedergabe des hebräischen Personennamens עֵבֶר.
- source_word: שִׁבְעָה
  choice: sieben
  rationale: Die Kardinalzahl fasst die sieben zuvor genannten Männer zusammen; der Gedankenstrich kennzeichnet diese nachgestellte Zusammenfassung.
