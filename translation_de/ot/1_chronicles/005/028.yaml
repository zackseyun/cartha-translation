  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Und die Söhne
  rationale: Das ו wird als „Und“ wiedergegeben und führt die genealogische Aufzählung fort; בְנֵי bezeichnet hier im unmittelbaren Stammbaumkontext die Söhne.
- source_word: קְהָת
  choice: Kehat
  rationale: Der Personenname wird in einer im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: עַמְרָם
  choice: Amram
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition transliteriert.
- source_word: יִצְהָר
  choice: Jizhar
  rationale: Die Form bewahrt den anlautenden hebräischen Konsonanten י und entspricht einer gebräuchlichen deutschen Transliteration.
- source_word: וְ/חֶבְרוֹן
  choice: Hebron
  rationale: Hier ist Hebron aufgrund von Form und genealogischem Kontext ein Personenname; die Konjunktion wird in der deutschen Listenstruktur vor dem letzten Glied ausgedrückt.
- source_word: וְ/עֻזִּיאֵל
  choice: und Usïel
  rationale: Der Personenname wird in deutscher Form wiedergegeben; das Trema macht deutlich, dass i und e getrennt gesprochen werden. Das vorangestellte ו erscheint als „und“ vor dem letzten Listenglied.
