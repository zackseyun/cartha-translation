base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/021.yaml
  text: 'They captured their livestock: 50,000 camels[a], 250,000 sheep, 2,000 donkeys, and 100,000 people.'
translation:
  language: de
  text: 'Sie erbeuteten ihr Vieh: 50.000 Kamele, 250.000 Schafe und 2.000 Esel sowie 100.000 Menschen[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Seele eines Menschen“; gemeint sind 100.000 Menschen, die gefangen genommen wurden.
    reason: lexikalische Alternative und Erläuterung des Gefangenschaftskontexts
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: Sie erbeuteten
  rationale: Das Verb שׁבה bezeichnet hier das Wegführen als Beute beziehungsweise das Gefangennehmen. „Erbeuteten“ passt zu den Tieren und lässt zusammen mit der Fußnote erkennen, dass die Menschen als Gefangene weggeführt wurden.
- source_word: מִקְנֵיהֶם
  choice: von ihrem Vieh
  rationale: מִקְנֶה bezeichnet Viehbestand; die folgende Aufzählung nennt die Tierarten. Die partitive Formulierung verbindet den Oberbegriff natürlich mit den genannten Zahlen und grenzt die anschließend erwähnten Menschen davon ab.
- source_word: גְּמַלֵּיהֶם
  choice: 50.000 Kamele
  rationale: Die Zahl und die Tierbezeichnung werden direkt und in moderner deutscher Schreibweise wiedergegeben; die Zugehörigkeit ist bereits durch „ihrem Vieh“ ausgedrückt.
- source_word: וְצֹאן
  choice: 250.000 Schafe
  rationale: צֹאן kann Kleinvieh, besonders Schafe und Ziegen, kollektiv bezeichnen. „Schafe“ ist hier die herkömmliche, kontextuell wahrscheinliche und allgemein verständliche Wiedergabe.
- source_word: וַחֲמוֹרִים
  choice: 2.000 Esel
  rationale: Direkte, gegenwärtige deutsche Bezeichnung.
- source_word: וְנֶפֶשׁ אָדָם
  choice: 100.000 Menschen[a]
  rationale: Die Wendung bedeutet wörtlich etwa „Menschenseele“ beziehungsweise „menschliche Person“ und zählt einzelne Menschen. „Menschen“ ist natürliches modernes Deutsch; die Fußnote erläutert die wörtliche Ausdrucksweise und den Kontext der Gefangennahme.
- source_word: מֵאָה אָלֶף
  choice: '100.000'
  rationale: Ziffern erleichtern bei der Zahlenreihe die Lesbarkeit; deutsche Tausenderpunkte werden verwendet.
