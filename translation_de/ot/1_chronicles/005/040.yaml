  text: Azariah fathered Seraiah, and Seraiah fathered Jehozadak.
translation:
  language: de
  text: Asarja zeugte Seraja, und Seraja zeugte Jozadak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: Asarja
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben; das vorangestellte וַ verbindet diesen Satz mit der vorausgehenden Genealogie, muss am Versanfang aber nicht eigens übersetzt werden.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in einer Genealogie die Vaterschaft beziehungsweise das Hervorbringen eines Nachkommen. „Zeugte“ ist knapp, präzise und im Deutschen weiterhin verständlich.
- source_word: אֶת
  choice: '[nicht gesondert übersetzt]'
  rationale: Der hebräische Akkusativmarker hat kein eigenständiges deutsches Äquivalent; seine Funktion wird durch die deutsche Satzstellung ausgedrückt.
- source_word: שְׂרָיָה
  choice: Seraja
  rationale: Der Personenname wird in der etablierten deutschen biblischen Form wiedergegeben.
- source_word: וּ/שְׂרָיָה
  choice: und Seraja
  rationale: Die vorangestellte Konjunktion ו wird natürlich mit „und“ wiedergegeben und verbindet die beiden genealogischen Aussagen.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Das wiederholte genealogische Verb wird aus Gründen der Genauigkeit und sprachlichen Parallelität ebenso wie beim ersten Vorkommen übersetzt.
- source_word: יְהוֹצָדָק
  choice: Jozadak
  rationale: Der Personenname wird nach einer gebräuchlichen deutschen biblischen Namensform transliteriert.
