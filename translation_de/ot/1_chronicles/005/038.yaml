lexical_decisions:
- source_word: וַ/אֲחִיטוּב
  choice: Ahitub
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben; die vorangestellte Konjunktion wird am Versanfang nicht eigens übersetzt.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in Geschlechtsregistern das Zeugen beziehungsweise Vaterwerden. „Zeugte“ ist knapp, eindeutig und für einen genealogischen Kontext angemessen.
- source_word: אֶת
  choice: '[nicht gesondert wiedergegeben]'
  rationale: Der hebräische Akkusativmarker hat kein eigenständiges deutsches Äquivalent; seine Funktion wird durch den deutschen Satzbau ausgedrückt.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Wiedergabe des Personennamens in der im Deutschen etablierten biblischen Form.
- source_word: וְ/צָדוֹק
  choice: und Zadok
  rationale: Die Konjunktion verbindet die beiden Glieder der genealogischen Folge und wird natürlich mit „und“ wiedergegeben.
- source_word: שַׁלּוּם
  choice: Schallum
  rationale: Wiedergabe des Personennamens in der im Deutschen etablierten biblischen Form.
