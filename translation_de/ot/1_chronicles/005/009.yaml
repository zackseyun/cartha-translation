base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/009.yaml
  text: To the east he settled as far as the entrance to the wilderness from the river Euphrates[a], because their livestock had multiplied in the land of Gilead.
translation:
  language: de
  text: Nach Osten ließ er sich bis zum Zugang zur Wüste vom Euphrat her nieder[a], denn ihr Viehbestand hatte sich im Land Gilead vermehrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bis zur Wüste, vom Euphrat her«. Die hebräische Grenzbeschreibung ist stark verkürzt; die Zuordnung von »vom Euphrat her« kann unterschiedlich verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלַמִּזְרָח
  choice: Nach Osten
  rationale: Die Verbindung aus Konjunktion, Präposition und Richtungsangabe bezeichnet die räumliche Ausdehnung nach Osten; ein ausdrückliches »und« ist im Deutschen für den Satzanschluss nicht nötig.
- source_word: יָשַׁב
  choice: ließ er sich … nieder
  rationale: Das Verb steht im Singular und bezieht sich kollektiv auf den Stamm beziehungsweise seinen Repräsentanten. Im Zusammenhang territorialer Ausbreitung gibt »sich niederlassen« den Sinn treffend wieder.
- source_word: עַד לְבוֹא מִדְבָּרָה
  choice: bis zum Zugang der Wüste
  rationale: Die Wendung bezeichnet die Grenze beziehungsweise den Zugang zur Wüste. »Zugang« bewahrt das konkrete Grenzbild, ohne die Formulierung unnötig zu glätten.
- source_word: לְמִן הַנָּהָר פְּרָת
  choice: vom Euphrat her
  rationale: Die syntaktisch gedrängte Präpositionalfügung wird eng am Hebräischen als Herkunfts- oder Richtungsangabe wiedergegeben. Die Mehrdeutigkeit ihrer Zuordnung bleibt durch die Fußnote sichtbar.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund für die ostwärtige Ausdehnung ein; »denn« klingt in diesem erzählenden Satz natürlich und würdevoll.
- source_word: מִקְנֵיהֶם
  choice: ihr Viehbestand
  rationale: Das Wort bezeichnet Tierbesitz beziehungsweise Nutztiere allgemein, nicht nur Rinder. »Viehbestand« gibt zugleich den kollektiven und mengenmäßigen Sinn wieder.
- source_word: רָבוּ
  choice: hatte sich … vermehrt
  rationale: Das Verb bezeichnet zahlenmäßige Zunahme. Das Plusquamperfekt macht im Deutschen deutlich, dass diese Zunahme den zuvor beschriebenen Siedlungsvorgang begründet.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: im Land Gilead
  rationale: Die Formulierung bewahrt den territorialen Sinn von אֶרֶץ und entspricht natürlichem deutschem Bibelstil.
