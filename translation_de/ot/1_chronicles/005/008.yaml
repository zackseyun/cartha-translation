  text: וּ/בֶ֨לַע֙ בֶּן עָזָ֔ז בֶּן שֶׁ֖מַע בֶּן יוֹאֵ֑ל ה֚וּא יוֹשֵׁ֣ב בַּ/עֲרֹעֵ֔ר וְ/עַד נְב֖וֹ וּ/בַ֥עַל מְעֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/008.yaml
  text: and Bela son of Azaz[a], son of Shema, son of Joel; he lived in Aroer, as far as Nebo and Baal-meon.
translation:
  language: de
  text: Und Bela, Sohn Asas, Sohn Schemas, Sohn Joels; er wohnte in Aroër bis nach Nebo und Baal-Meon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבֶלַע
  choice: und Bela
  rationale: Die Konjunktion wahrt den Zusammenhang der genealogischen Aufzählung; der Personenname wird nach gebräuchlicher deutscher Form wiedergegeben.
- source_word: בֶּן
  choice: Sohn
  rationale: Die dreifache genealogische Verbindung wird formal bewahrt; der deutsche Genitiv vermeidet eine schwerfällige Wiederholung von „von“.
- source_word: עָזָז
  choice: Asas
  rationale: Transliteration des hebräischen Personennamens in einer für deutsche Bibeln üblichen Lautgestalt.
- source_word: שֶׁמַע
  choice: Schema
  rationale: Transliteration des Personennamens; die Schreibung gibt den hebräischen Anlaut im Deutschen verständlich wieder.
- source_word: יוֹאֵל
  choice: Joël
  rationale: Die Trema-Schreibung macht kenntlich, dass o und e getrennt gesprochen werden.
- source_word: הוּא יוֹשֵׁב
  choice: Er wohnte
  rationale: Das selbstständige Pronomen nimmt Bela nach der Abstammungsfolge wieder auf; das Partizip bezeichnet sein Wohnen beziehungsweise Ansässigsein.
- source_word: בַּעֲרֹעֵר
  choice: in Aroër
  rationale: Die Präposition bezeichnet den Wohnort; die Trema-Schreibung erhält die getrennte Aussprache der Vokale.
- source_word: וְעַד
  choice: bis hin nach
  rationale: Die Wendung bezeichnet die räumliche Ausdehnung des Siedlungsgebiets und klingt bei Ortsnamen im modernen Deutschen natürlich.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Der Ortsname wird transliteriert.
- source_word: וּבַעַל מְעוֹן
  choice: und Baal-Meon
  rationale: Der zusammengesetzte Ortsname wird mit Bindestrich wiedergegeben; die Konjunktion verbindet ihn mit Nebo als weiterer Grenz- beziehungsweise Ausdehnungsangabe.
