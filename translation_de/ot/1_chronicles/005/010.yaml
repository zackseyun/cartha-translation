  text: וּ/בִ/ימֵ֣י שָׁא֗וּל עָשׂ֤וּ מִלְחָמָה֙ עִם הַֽ/הַגְרִאִ֔ים וַֽ/יִּפְּל֖וּ בְּ/יָדָ֑/ם וַ/יֵּשְׁבוּ֙ בְּ/אָ֣הֳלֵי/הֶ֔ם עַֽל כָּל פְּנֵ֖י מִזְרָ֥ח לַ/גִּלְעָֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/010.yaml
  text: In the days of Saul they made war with the Hagrites[a], and they fell into their hand[b]; and they lived in their tents throughout all the region east of Gilead.
translation:
  language: de
  text: In den Tagen Sauls führten sie Krieg gegen die Hagriter[a]. Diese fielen in ihre Hand[b], und sie wohnten in deren Zelten im ganzen Gebiet östlich von Gilead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hagariter«. Der hebräische Volksname bezeichnet wahrscheinlich ein mit Hagar verbundenes Volk.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »sie fielen in ihre Hand«, das heißt, in ihre Gewalt. Mit »diese« sind die aus dem Zusammenhang erschlossenen Hagriter gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי שָׁאוּל
  choice: In den Tagen Sauls
  rationale: Die hebräische Zeitangabe wird mit einer im Deutschen verständlichen, bibelsprachlich würdigen Wendung wiedergegeben.
- source_word: עָשׂוּ מִלְחָמָה עִם
  choice: führten sie Krieg gegen
  rationale: Die hebräische Verbindung bezeichnet das Führen eines Krieges; »gegen« macht im Deutschen die feindliche Beziehung natürlich und eindeutig.
- source_word: הַהַגְרִאִים
  choice: die Hagriter
  rationale: Der Volksname wird knapp und nahe an der hebräischen Form wiedergegeben; die mögliche Verbindung mit Hagar bleibt in der Fußnote sichtbar.
- source_word: וַיִּפְּלוּ בְּיָדָם
  choice: Diese fielen in ihre Hand
  rationale: Die hebräische Machtmetapher bleibt erhalten. »Diese« verdeutlicht, dass die Hagriter das sinngemäß erschlossene Subjekt sind.
- source_word: וַיֵּשְׁבוּ בְּאָהֳלֵיהֶם
  choice: und sie wohnten in deren Zelten
  rationale: »Wohnten« gibt ישב natürlich wieder; »deren« unterscheidet die unterlegenen Hagriter als Besitzer der Zelte von den siegreichen, im Kontext genannten Stämmen.
- source_word: עַל כָּל פְּנֵי מִזְרָח לַגִּלְעָד
  choice: im ganzen Gebiet östlich von Gilead
  rationale: Die räumliche Ausdehnung des hebräischen Idioms wird in klarem, modernem Deutsch ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die konkrete hebräische Metapher »in ihre Hand fallen« wird bewahrt; unklare Pronomenbezüge werden nur so weit verdeutlicht, wie es der unmittelbare Zusammenhang erlaubt.
