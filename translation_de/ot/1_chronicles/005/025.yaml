source:
  edition: WLC
  text: וַ/יִּֽמְעֲל֔וּ בֵּ/אלֹהֵ֖י אֲבוֹתֵי/הֶ֑ם וַ/יִּזְנ֗וּ אַחֲרֵי֙ אֱלֹהֵ֣י עַמֵּי הָ/אָ֔רֶץ אֲשֶׁר הִשְׁמִ֥יד אֱלֹהִ֖ים מִ/פְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/025.yaml
  text: But they acted unfaithfully against the God of their fathers and prostituted themselves after the gods of the peoples of the land[b][a], whom God had destroyed before them.
translation:
  language: de
  text: Doch sie wurden dem Gott ihrer Vorfahren untreu und hurten den Göttern der Völker des Landes nach[a], die Gott vor ihnen vernichtet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder weniger bildhaft: »Sie liefen den Göttern … nach.« Das Hebräische verwendet hier eine sexuelle Metapher für Götzendienst und Untreue gegenüber Gott.'
    reason: Die Anmerkung bietet eine idiomatisch weniger markierte Alternative und erläutert die im Haupttext beibehaltene Metapher.
lexical_decisions:
- source_word: וַיִּמְעֲלוּ בֵּאלֹהֵי אֲבוֹתֵיהֶם
  choice: sie wurden dem Gott ihrer Vorfahren untreu
  rationale: מעל bezeichnet hier einen religiösen Treuebruch; das Präfix ב markiert den, dem gegenüber die Untreue begangen wird. Die deutsche Dativkonstruktion ist natürlich und bewahrt den Beziehungssinn.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: liefen … nach
  rationale: Die Hauptübersetzung gibt die mit אַחֲרֵי ausgedrückte Hinwendung und Gefolgschaft idiomatisch wieder. Die sexuelle Metapher von זנה wird wegen ihrer theologischen Bedeutung in der Fußnote ausdrücklich benannt.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: den Göttern der Völker des Landes
  rationale: Die Konstruktverbindung wird eng am Hebräischen wiedergegeben; „Völker“ entspricht עַמֵּי im örtlichen Zusammenhang.
- source_word: אֲשֶׁר הִשְׁמִיד אֱלֹהִים מִפְּנֵיהֶם
  choice: die Gott vor ihnen vernichtet hatte
  rationale: Das Relativpronomen bezieht sich grammatisch und sachlich auf die Völker, nicht auf deren Götter. Der Singular des Verbs kennzeichnet אֱלֹהִים als „Gott“; das Plusquamperfekt macht die zeitlich vorausliegende Vernichtung deutlich.
theological_decisions:
- issue: Sexuelle Metapher für Götzendienst und Bundesbruch
  choice: liefen den Göttern … nach, mit ausdrücklicher Fußnote zur wörtlichen Metapher
  alternative: trieben den Göttern … nach Hurerei / hurten den Göttern … nach
  rationale: Eine wörtliche Wiedergabe wirkt im heutigen Deutschen leicht wie eine Aussage über kultische Sexualpraktiken oder klingt unnötig altertümlich. Der Haupttext bleibt verständlich, während die Fußnote die bewusste sexuelle Metapher und ihren Sinn als religiöse Untreue bewahrt.
- issue: Bezug des Relativsatzes
  choice: die Gott vor ihnen vernichtet hatte – Bezug auf die Völker
  alternative: die Gott vor ihnen vernichtet hatte – missverständlicher Bezug auf die Götter
  rationale: שׁמד bezeichnet hier die Beseitigung der ansässigen Völker vor Israel. Im Deutschen steht der Relativsatz daher unmittelbar semantisch zu „Völker“; die Form „die“ lässt formal eine gewisse Oberflächenmehrdeutigkeit bestehen, der Inhalt klärt jedoch den Bezug.
- issue: אֱלֹהִים im Relativsatz
  choice: Gott
  alternative: Götter
  rationale: Das singularische Verb הִשְׁמִיד weist eindeutig auf den Gott Israels als Subjekt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vorfahren“ ist heute inklusiver und natürlicher als „Väter“, ohne den Sinn von אֲבוֹת zu verändern. „Doch“ setzt den Gegensatz zum vorausgehenden Zusammenhang knapp fort.
