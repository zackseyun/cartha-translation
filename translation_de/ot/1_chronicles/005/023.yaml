source:
  edition: WLC
  text: וּ/בְנֵ֗י חֲצִי֙ שֵׁ֣בֶט מְנַשֶּׁ֔ה יָשְׁב֖וּ בָּ/אָ֑רֶץ מִ/בָּשָׁ֞ן עַד בַּ֧עַל חֶרְמ֛וֹן וּ/שְׂנִ֥יר וְ/הַר חֶרְמ֖וֹן הֵ֥מָּה רָבֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/023.yaml
  text: And the sons of the half-tribe of Manasseh lived in the land from Bashan as far as Baal-hermon[a], Senir, and Mount Hermon[b]; they became numerous.
translation:
  language: de
  text: Die Angehörigen des halben Stammes Manasse lebten im Land von Baschan bis zu Baal-Hermon, Senir und dem Berg Hermon[a]. Sie wurden zahlreich[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baal-Hermon, Senir und der Berg Hermon sind geografische Bezeichnungen im Norden des beschriebenen Gebiets.
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: »Sie vermehrten sich« oder »Ihre Zahl nahm zu.« Das hebräische Verb betont ihr zahlenmäßiges Wachstum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: Die Angehörigen des halben Stammes Manasse
  rationale: בְּנֵי bedeutet wörtlich »Söhne von«, bezeichnet hier im Stammeszusammenhang jedoch die Mitglieder beziehungsweise Nachkommen dieser Stammesgruppe. »Angehörige« gibt diesen Sinn in natürlichem modernem Deutsch wieder, ohne ausschließlich unmittelbare Söhne zu meinen.
- source_word: יָשְׁבוּ בָּאָרֶץ
  choice: lebten in dem Gebiet
  rationale: ישׁב bezeichnet hier das Wohnen beziehungsweise Ansässigsein; ארץ meint in diesem geografischen Zusammenhang das bewohnte Land oder Gebiet.
- source_word: מִבָּשָׁן עַד
  choice: von Baschan bis
  rationale: Die Präpositionen markieren die räumliche Ausdehnung des Siedlungsgebiets.
- source_word: בַּעַל חֶרְמוֹן וּשְׂנִיר וְהַר חֶרְמוֹן
  choice: Baal-Hermon, Senir und zum Hermongebirge
  rationale: Die Eigennamen werden nach üblicher deutscher Form wiedergegeben. הַר חֶרְמוֹן kann den Berg Hermon oder das zugehörige Bergland bezeichnen; »Hermongebirge« passt hier zur Beschreibung eines ausgedehnten Siedlungsraums.
- source_word: הֵמָּה רָבוּ
  choice: Sie wurden zahlreich
  rationale: רבה im Qal bezeichnet das Viele- beziehungsweise Zahlreichwerden. Das ausdrücklich gesetzte Pronomen הֵמָּה hebt die Stammesangehörigen als Subjekt hervor.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Angehörige« vermeidet die im Deutschen missverständliche wörtliche Form »Söhne des halben Stammes«, während »halber Stamm« die historische Stammesgliederung bewahrt. Die Ortsnamen und die knappe erzählende Satzstruktur bleiben deutlich erkennbar.
