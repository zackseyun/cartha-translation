  yaml_path: translation/ot/1_chronicles/005/015.yaml
  text: Ahi son of Abdiel[a], son of Guni, was head of their fathers’ houses.
translation:
  language: de
  text: Ahi, der Sohn Abdiëls, des Sohnes Gunis, war das Oberhaupt ihres Vaterhauses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „des Hauses ihrer Väter“; auch: „ihrer Sippe“ oder „ihrer Großfamilie“.'
    reason: Die hebräische Wendung bezeichnet eine von gemeinsamen Vorfahren hergeleitete Familien- oder Sippeneinheit. „Vaterhaus“ bewahrt die Formulierung des Ausgangstextes; die Alternativen erläutern ihren Sinn.
lexical_decisions:
- source_word: אֲחִי
  choice: Ahi
  rationale: Der Personenname wird nach gebräuchlicher deutscher Transliterationsweise wiedergegeben.
- source_word: בֶּן עַבְדִּיאֵל בֶּן גּוּנִי
  choice: der Sohn Abdiëls, des Sohnes Gunis
  rationale: Die zweimalige genealogische Formel בֶּן wird ausdrücklich bewahrt und bezeichnet hier am natürlichsten die unmittelbare Abstammungsfolge.
- source_word: רֹאשׁ
  choice: Oberhaupt
  rationale: Das Wort bezeichnet hier den Leiter einer verwandtschaftlich gegliederten Einheit; „Oberhaupt“ gibt die Leitungsfunktion im Deutschen natürlich wieder.
- source_word: לְבֵית אֲבוֹתָם
  choice: ihrer Großfamilie
  rationale: Die hebräische Wendung „Haus ihrer Väter“ bezeichnet eine größere, von gemeinsamen Vorfahren hergeleitete Familien- oder Sippeneinheit. „Großfamilie“ vermittelt diese soziale Bedeutung in verständlichem modernem Deutsch.
