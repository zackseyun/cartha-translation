revisions:
- from: Da regte der Gott Israels den Geist Puls, des Königs von Assyrien, an und den Geist Tilgat-Pilnesers, des Königs von Assyrien[a][b]. Dieser führte die Rubeniter, die Gaditer und den halben Stamm Manasse in die Verbannung und brachte sie nach Halach, Habor und Hara sowie an den Fluss Gosan. Dort sind sie bis auf den heutigen Tag.
  to: Da regte der Gott Israels den Geist Puls, des Königs von Assyrien, an und den Geist Tilgat-Pilnesers, des Königs von Assyrien[a][b]. Er führte die Rubeniter, die Gaditer und den halben Stamm Manasse in die Verbannung und brachte sie nach Halach, Habor, Hara und an den Fluss Gosan, wo sie bis heute sind.
  rationale: Die Revision ersetzt das demonstrative „Dieser“ durch das unmarkiertere „Er“ und vermeidet damit eine zusätzliche Festlegung innerhalb der in Fußnote a ausgewiesenen Namensfrage. Die abschließende Zeitangabe wird unmittelbar mit den Zielorten verbunden. Die übrigen Entscheidungen, insbesondere die koordinierte Wiedergabe der zwei Geist-Ausdrücke und die Fußnotenanker, bleiben erhalten.
