  - severity: low
    issue: Abgetrennter Satz „Dort sind sie bis auf den heutigen Tag“
    rationale: Die Aussage ist eine zulässige Explikation des hebräischen Zeitidioms, liest sich aber als eigenständige Zusatzbehauptung. Ein Anschluss mit „wo sie bis heute sind“ bindet sie transparent an die im Hebräischen genannten Zielorte.
