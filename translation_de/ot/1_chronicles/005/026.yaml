source:
  edition: WLC
  text: וַ/יָּעַר֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל אֶת ר֣וּחַ פּ֣וּל מֶֽלֶךְ אַשּׁ֗וּר וְ/אֶת ר֨וּחַ֙ תִּלְּגַ֤ת פִּלְנֶ֨סֶר֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּגְלֵ/ם֙ לָ/ראוּבֵנִ֣י וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֣בֶט מְנַשֶּׁ֑ה וַ֠/יְבִיאֵ/ם לַ/חְלַ֨ח וְ/חָב֤וֹר וְ/הָרָא֙ וּ/נְהַ֣ר גּוֹזָ֔ן עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/026.yaml
  text: So the God of Israel stirred up the spirit of Pul king of Assyria[a], even the spirit of Tilgath-pilneser king of Assyria, and he took the Reubenites, the Gadites, and the half-tribe of Manasseh into exile, and brought them to Halah, Habor, Hara, and the river Gozan[b], to this day.
translation:
  language: de
  text: Da regte der Gott Israels den Geist Puls, des Königs von Assyrien, an und den Geist Tilgat-Pilnesers, des Königs von Assyrien[a][b]. Er führte die Rubeniter, die Gaditer und den halben Stamm Manasse in die Verbannung und brachte sie nach Halach, Habor, Hara und an den Fluss Gosan, wo sie bis heute sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Wortlaut kann Pul und Tilgat-Pilneser entweder als zwei Herrscher oder als zwei Namen desselben assyrischen Königs bezeichnen.
    reason: alternative_reading
  - marker: b
    text: „Tilgat-Pilneser“ gibt die hebräische Namensform an dieser Stelle wieder; geläufiger ist die Form „Tiglat-Pileser“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  choice: regte … an
  rationale: Das Verb bezeichnet hier, dass Gott einen Herrscher innerlich zum Handeln bewegt. „Regte … an“ ist natürliches, gegenwärtiges Deutsch und vermeidet die unnötig negative Färbung von „stachelte … auf“.
- source_word: ר֣וּחַ ... ר֨וּחַ
  choice: den Geist … den Geist
  rationale: „Geist“ gibt רוּחַ unmittelbar wieder und bewahrt die Aussage, dass Gott auf den inneren Antrieb beziehungsweise Willen des Herrschers einwirkt.
- source_word: פּוּל
  choice: Pul
  rationale: Der Personenname wird in der im Deutschen eingebürgerten Form wiedergegeben.
- source_word: תִּלְּגַת פִּלְנֶסֶר
  choice: Tilgat-Pilneser
  rationale: Diese Umschrift folgt der hier in der Chronik bezeugten hebräischen Namensform, ohne sie stillschweigend an die bekanntere Form „Tiglat-Pileser“ anzugleichen.
- source_word: וַיַּגְלֵם
  choice: führte … in die Verbannung
  rationale: Die Hifil-Form von גלה bezeichnet die Wegführung ins Exil. Die gewählte Formulierung ist klar und würdevoll, ohne den modernen Verwaltungston von „deportierte“.
- source_word: לָראוּבֵנִי וְלַגָּדִי
  choice: die Rubeniter, die Gaditer
  rationale: Die hebräischen Stammesbezeichnungen werden mit den geläufigen deutschen Gentilformen wiedergegeben.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: den halben Stamm Manasse
  rationale: Die Formulierung gibt die Konstruktion knapp und verständlich wieder und bezeichnet den ostjordanischen Teil des Stammes.
- source_word: וַיְבִיאֵם
  choice: brachte sie
  rationale: Dies ist eine direkte und im Zusammenhang der Umsiedlung natürliche Wiedergabe des Hifil von בוא.
- source_word: לַחְלַח וְחָבוֹר וְהָרָא וּנְהַר גּוֹזָן
  choice: nach Halach, Habor und Hara sowie an den Fluss Gosan
  rationale: Die Ortsnamen werden in gut erkennbaren deutschen Umschriften wiedergegeben. Bei einem Fluss ist im Deutschen „an den Fluss“ als Zielangabe natürlicher als „zum Fluss“.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis auf den heutigen Tag
  rationale: Die traditionelle deutsche Wendung bildet das hebräische Idiom genau und verständlich ab; „Dort sind sie“ verdeutlicht idiomatisch den im Hebräischen vorausgesetzten örtlichen Bezug.
theological_decisions:
- issue: Verhältnis zwischen Pul und Tilgat-Pilneser
  choice: Die doppelte Formulierung „den Geist Puls … und den Geist Tilgat-Pilnesers“ bleibt im Haupttext erhalten.
  alternative: Pul und Tilgat-Pilneser können als zwei Namen desselben assyrischen Königs verstanden und appositionell wiedergegeben werden.
  rationale: Der hebräische Wortlaut wiederholt sowohl „den Geist“ als auch „König von Assyrien“ und verbindet die Glieder mit וְ. Historisch wird Pul häufig mit Tiglat-Pileser III. identifiziert, doch die Syntax allein entscheidet nicht eindeutig zwischen zwei Namen für einen Herrscher und zwei Herrschern. Die Übersetzung bewahrt deshalb die formale Mehrdeutigkeit und erläutert sie in einer Fußnote.
- issue: Subjekt der Wegführung
  choice: „Dieser“ bezeichnet den handelnden assyrischen König, ohne die Namensfrage eigens aufzulösen.
  alternative: Ein pluralisches Subjekt könnte gewählt werden, wenn Pul und Tilgat-Pilneser als zwei verschiedene Herrscher aufgefasst werden.
  rationale: Das hebräische וַיַּגְלֵם steht im Singular. Die deutsche Singularform folgt dieser Grammatik, während die Fußnote die verbleibende Spannung bei der Zuordnung der Namen offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Wiederholung des hebräischen Ausdrucks wurde trotz einer gewissen Schwere beibehalten, um die Mehrdeutigkeit der Königsnamen nicht im Haupttext aufzulösen. Die abschließende Ortsangabe wurde in zwei Sätze gegliedert, damit „bis auf den heutigen Tag“ im Deutschen eindeutig auf den fortdauernden Aufenthalt der Weggeführten bezogen ist.
