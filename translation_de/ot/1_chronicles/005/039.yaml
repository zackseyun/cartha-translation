- source_word: חִלְקִיָּה
  choice: Hilkija
  rationale: Der wiederholte Personenname wird innerhalb des Verses einheitlich wiedergegeben.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Das wiederholte Verb wird im selben genealogischen Sinn und aus Gründen der sprachlichen Kohärenz gleich übersetzt.
- source_word: עֲזַרְיָה
  choice: Asarja
  rationale: Der Personenname wird in der gebräuchlichen deutschen biblischen Form wiedergegeben.
