source:
  edition: WLC
  text: בְּנֵֽי רְאוּבֵ֨ן וְ/גָדִ֜י וַ/חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁה֮ מִן בְּנֵי חַיִל֒ אֲ֠נָשִׁים נֹשְׂאֵ֨י מָגֵ֤ן וְ/חֶ֨רֶב֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת וּ/לְמוּדֵ֖י מִלְחָמָ֑ה אַרְבָּעִ֨ים וְ/אַרְבָּעָ֥ה אֶ֛לֶף וּ/שְׁבַע מֵא֥וֹת וְ/שִׁשִּׁ֖ים יֹצְאֵ֥י צָבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/018.yaml
  text: The sons of Reuben and the Gadites and the half-tribe of Manasseh[a], valiant men, men who carried shield and sword, who drew the bow, and who were trained for war, were forty-four thousand seven hundred sixty[c][b], able to go out to war.
translation:
  language: de
  text: 'Die Söhne Rubens, die Gaditer und der halbe Stamm Manasse waren tapfere Männer: Sie trugen Schild und Schwert, spannten den Bogen[a] und waren für den Krieg ausgebildet. Insgesamt waren es 44.760 Mann, die zum Kriegsdienst ausziehen konnten[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „den Bogen traten/bogen“; gemeint ist das Spannen eines Bogens zum Schießen.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „die für den Kriegsdienst tauglich waren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רְאוּבֵן
  choice: die Söhne Rubens
  rationale: Bewahrt die ausdrückliche hebräische Verwandtschaftsbezeichnung בְּנֵי und ist im biblisch-genealogischen Zusammenhang verständlich.
- source_word: וְגָדִי
  choice: die Gaditer
  rationale: Die gentilizische Form bezeichnet Angehörige des Stammes Gad; „Gaditer“ ist die natürliche deutsche Entsprechung.
- source_word: וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: der halbe Stamm Manasse
  rationale: Gibt die Konstruktion präzise und in geläufiger deutscher Form wieder.
- source_word: מִן בְּנֵי חַיִל
  choice: wehrfähige Männer
  rationale: בְּנֵי חַיִל bezeichnet im militärischen Kontext tüchtige, leistungsfähige beziehungsweise kampffähige Männer. „Wehrfähig“ passt zudem zur folgenden Ausrüstung und Ausbildung, ohne den Ausdruck unnötig zu heroisieren.
- source_word: נֹשְׂאֵי מָגֵן וְחֶרֶב
  choice: sie trugen Schild und Schwert
  rationale: Gibt das konkrete Bild des partizipialen Ausdrucks direkt und natürlich wieder.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: spannten den Bogen
  rationale: Gibt das hebräische Idiom mit seiner konkreten Handlung wieder; die wörtlichere Vorstellung des Tretens beziehungsweise Biegens wird in einer Fußnote erläutert.
- source_word: וּלְמוּדֵי מִלְחָמָה
  choice: waren für den Krieg ausgebildet
  rationale: Bewahrt den passiv-resultativen Sinn von לְמוּדֵי und formuliert ihn in natürlichem modernem Deutsch.
- source_word: אַרְבָּעִים וְאַרְבָּעָה אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: '44.760'
  rationale: Die Ziffernschreibung ist bei einer exakten größeren Zahl im modernen deutschen Fließtext übersichtlich.
- source_word: יֹצְאֵי צָבָא
  choice: die zum Kriegsdienst ausziehen konnten
  rationale: Bewahrt das Bild des Ausziehens und vermittelt zugleich die idiomatische Bedeutung der militärischen Einsatz- beziehungsweise Dienstfähigkeit.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung wurde durch einen Doppelpunkt gegliedert, damit die militärischen Merkmale klar auf „wehrfähige Männer“ bezogen bleiben. Die konkrete Bildsprache von Schild, Schwert, Bogen und Ausziehen wurde weitgehend erhalten.
