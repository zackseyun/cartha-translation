  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ
  choice: Ahimaaz
  rationale: Der Personenname wird nach der im modernen deutschen Bibelgebrauch üblichen Form wiedergegeben; die vorangestellte Konjunktion muss am Satzanfang nicht eigens übersetzt werden.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in diesem genealogischen Zusammenhang das Zeugen eines Nachkommen. „Zeugte“ ist knapp, präzise und im Deutschen für Stammbäume geläufig.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker hat keine eigenständige deutsche Entsprechung; seine Funktion ergibt sich aus dem deutschen Satzbau.
- source_word: עֲזַרְיָה
  choice: Asarja
  rationale: Der Personenname wird in einer etablierten deutschen biblischen Namensform transliteriert.
- source_word: וַ/עֲזַרְיָה
  choice: und Asarja
  rationale: Die vorangestellte Konjunktion verbindet die beiden genealogischen Aussagen und wird natürlich mit „und“ wiedergegeben.
- source_word: יוֹחָנָן
  choice: Johanan
  rationale: Der Personenname wird in der üblichen deutschen biblischen Form wiedergegeben.
