lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Die Konstruktusform des Plurals von בֵּן leitet die Abstammungsfolge ein. „Söhne“ gibt den hebräischen Ausdruck direkt und in diesem genealogischen Zusammenhang natürlich wieder; eine weitere Bedeutung im Sinn von „Nachkommen“ bleibt in der Fußnote sichtbar.
- source_word: יוֹאֵל
  choice: Joël
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben; das Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: שְׁמַעְיָה
  choice: Schemaja
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: בְנוֹ
  choice: sein Sohn
  rationale: Das Substantiv בֵּן mit Suffix der 3. Person Singular maskulin bezeichnet in der wiederholten genealogischen Formel die Sohnesbeziehung. „Sein Sohn“ entspricht sowohl dem Hebräischen als auch natürlichem Deutsch.
- source_word: גּוֹג
  choice: Gog
  rationale: Direkte und im Deutschen etablierte Wiedergabe des Personennamens; an dieser Stelle bezeichnet er ein Glied der Genealogie.
- source_word: שִׁמְעִי
  choice: Schimi
  rationale: Gebräuchliche deutsche Transkription des hebräischen Personennamens.
