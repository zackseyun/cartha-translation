source:
  edition: WLC
  text: כִּ֤י יְהוּדָה֙ גָּבַ֣ר בְּ/אֶחָ֔י/ו וּ/לְ/נָגִ֖יד מִמֶּ֑/נּוּ וְ/הַ/בְּכֹרָ֖ה לְ/יוֹסֵֽף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/002.yaml
  text: For Judah prevailed over his brothers[a], and from him came the ruler, though the birthright belonged to Joseph.
translation:
  language: de
  text: Denn Juda war seinen Brüdern überlegen, und aus ihm ging ein Herrscher[a] hervor; das Erstgeburtsrecht aber fiel Josef zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Anführer« oder »Fürst«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage über Rubens verlorene Vorrangstellung ein und gibt den Zusammenhang im Deutschen natürlich wieder.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Die im Deutschen etablierte Form des Personen- und Stammesnamens.
- source_word: גָּבַר בְּאֶחָיו
  choice: gewann unter seinen Brüdern die Oberhand
  rationale: גבר bezeichnet Stärke oder Überlegenheit. Die Formulierung gibt Judas Vorrang innerhalb des Bruderkreises wieder, ohne einen konkreten Kampf vorauszusetzen.
- source_word: וּלְנָגִיד מִמֶּנּוּ
  choice: und aus ihm ging ein Herrscher hervor
  rationale: נָגִיד bezeichnet einen Führenden, Herrscher oder Fürsten. Die idiomatische deutsche Wendung bewahrt die Aussage, dass die Herrschaft aus Juda hervorging, ohne die genannte Person ausdrücklich festzulegen.
- source_word: וְהַבְּכֹרָה לְיוֹסֵף
  choice: das Erstgeburtsrecht aber fiel Josef zu
  rationale: בְּכֹרָה bezeichnet Rang und Vorrecht des Erstgeborenen. »Aber« bringt den sachlichen Gegensatz zu Judas Vorrang zum Ausdruck; »fiel … zu« gibt die Zuordnung an Josef natürlich wieder.
theological_decisions:
- issue: Verhältnis zwischen Judas Vorrang und Josefs Erstgeburtsrecht
  choice: Juda erhält die führende Stellung und bringt den Herrscher hervor, während Josef das Erstgeburtsrecht zugeordnet bleibt.
  alternative: Juda könnte lediglich als stärkster Stamm beschrieben sein, während Josef besondere Erbvorrechte besitzt.
  rationale: Der hebräische Text stellt beide Vorrechte nebeneinander und unterscheidet sie. Die Übersetzung wahrt diese Spannung, statt Herrschaft und Erstgeburtsrecht gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Die Oberhand gewinnen« ist allgemein verständlich und bildet die vergleichende Kraft von גבר ab. Das Semikolon hält Judas Herrschaftsvorrang und Josefs Erstgeburtsrecht eng zusammen, während »aber« ihren Gegensatz sichtbar macht.
