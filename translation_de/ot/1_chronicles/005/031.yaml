  yaml_path: translation/ot/1_chronicles/005/031.yaml
  text: Abishua fathered Bukki, and Bukki fathered Uzzi.
translation:
  language: de
  text: Abischua zeugte Bukki, und Bukki zeugte Usi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲבִישׁוּעַ
  choice: Abischua
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition und in einer dem Hebräischen angenäherten Form wiedergegeben; das vorangestellte וַ führt hier die genealogische Reihe fort und muss am Versanfang nicht eigens mit „und“ übersetzt werden.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet im genealogischen Zusammenhang das Zeugen beziehungsweise Hervorbringen eines Nachkommen. „Zeugte“ ist knapp, präzise und im Deutschen für Stammbäume geläufig.
- source_word: אֶת
  choice: '[nicht wiedergegeben]'
  rationale: Der hebräische Akkusativmarker hat keine eigenständige natürliche Entsprechung im Deutschen.
- source_word: בֻּקִּי
  choice: Bukki
  rationale: Der Personenname wird in der herkömmlichen deutschen Form transliteriert.
- source_word: וּ/בֻקִּי
  choice: und Bukki
  rationale: Die vorangestellte Konjunktion ו wird als „und“ wiedergegeben und wahrt die fortlaufende Struktur des Stammbaums.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Das wiederholte genealogische Verb wird aus Gründen der Transparenz und Parallelität gleich übersetzt.
- source_word: עֻזִּי
  choice: Usi
  rationale: Der Personenname wird gemäß der verbreiteten deutschen Bibeltradition als „Usi“ wiedergegeben.
