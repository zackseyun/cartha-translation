lexical_decisions:
- source_word: מְרָיוֹת
  choice: Merajot
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition wiedergegeben und nicht übersetzt.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Die Hifil-Form von ילד bezeichnet in diesem Stammbaum die männliche Abstammung; „zeugte“ ist knapp, würdig und im genealogischen Zusammenhang verständlich.
- source_word: אֶת
  choice: '[nicht gesondert wiedergegeben]'
  rationale: Der hebräische Akkusativmarker hat kein eigenständiges deutsches Äquivalent; seine Funktion wird durch die deutsche Satzstellung ausgedrückt.
- source_word: אֲמַרְיָה
  choice: Amarja
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: וַ/אֲמַרְיָה
  choice: und Amarja
  rationale: Das verbindende Waw wird mit „und“ wiedergegeben; der Personenname bleibt in deutscher biblischer Form erhalten.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Das wiederholte genealogische Verb wird aus Gründen der Klarheit und lexikalischen Einheitlichkeit gleich übersetzt.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Der Personenname wird in der etablierten deutschen biblischen Form wiedergegeben.
