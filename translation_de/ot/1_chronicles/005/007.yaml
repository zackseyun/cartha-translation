base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/007.yaml
  text: 'And his brothers by their clans[a], in the genealogy of their generations: the chief was Jeiel, and Zechariah.'
translation:
  language: de
  text: 'Und seine Brüder nach ihren Sippen[a], als sie nach ihren Geschlechterfolgen in das Geschlechtsregister eingetragen wurden: Das Oberhaupt war Jëiël und Secharja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: nach seinen Sippen.'
    reason: Das hebräische Suffix bei „Sippen“ ist formal 3. Person Singular; die Übersetzung „ihren“ gibt den kollektiven Bezug auf die zuvor genannten Brüder idiomatisch wieder.
lexical_decisions:
- source_word: וְאֶחָיו
  choice: Und seine Brüder
  rationale: אָח bezeichnet hier männliche Angehörige innerhalb des genealogischen Zusammenhangs. „Brüder“ ist die direkteste Wiedergabe, auch wenn „Verwandte“ grundsätzlich möglich ist.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet in Stammeslisten eine Sippe oder einen Clan. „Sippen“ ist im Deutschen für diesen genealogischen Verband angemessener als das häuslich verstandene „Familien“; das maskuline Suffix wird sinngemäß auf die genannten Brüder bezogen.
- source_word: בְּהִתְיַחֵשׂ
  choice: als sie … in das Geschlechtsregister eingetragen wurden
  rationale: Der Hitpael von יחס bezeichnet in den Chronikbüchern die genealogische Registrierung. Die temporale Formulierung gibt die Funktion des Präpositionalinfinitivs natürlich und präzise wieder.
- source_word: לְתֹלְדוֹתָם
  choice: nach ihren Geschlechterfolgen
  rationale: תּוֹלְדוֹת meint hier die über Generationen verlaufenden Abstammungslinien. „Geschlechterfolgen“ hält den genealogischen Sinn fest, ohne den Ausdruck auf bloße Geburten zu verengen.
- source_word: הָרֹאשׁ
  choice: Das Oberhaupt war
  rationale: רֹאשׁ bezeichnet hier den führenden oder ranghöchsten Mann der genealogischen Gruppe. „Oberhaupt“ ist im Deutschen klarer und natürlicher als das wörtliche „Kopf“.
- source_word: יְעִיאֵל
  choice: Jëiël
  rationale: Der Personenname wird nach gängiger deutscher Bibelnamenform wiedergegeben; die Tremazeichen verdeutlichen die getrennten Vokale.
- source_word: וּזְכַרְיָהוּ
  choice: dann Secharja
  rationale: Der Name wird in der üblichen deutschen Form „Secharja“ wiedergegeben. Das hebräische וּ verbindet das zweite Glied; „dann“ macht in dieser knappen Namensfolge deutlich, dass Secharja ebenfalls genannt wird, ohne ihm ausdrücklich denselben Rang zuzuschreiben.
theological_decisions:
- issue: Verhältnis von Jëiël und Secharja zu הָרֹאשׁ
  choice: „Das Oberhaupt war Jëiël, dann Secharja“
  alternative: „Die Oberhäupter waren Jëiël und Secharja“
  rationale: הָרֹאשׁ steht im Singular und ist unmittelbar mit Jëiël verbunden. Deshalb wird nur Jëiël ausdrücklich als Oberhaupt bezeichnet; Secharja bleibt als weiterer genannter Mann stehen. So wird die syntaktische Spannung nicht durch eine Pluralisierung aufgelöst.
translation_notes:
  register: Moderne, würdige Standardsprache mit genealogischem Fachton. Der Satzbau bewahrt die knappe Listenstruktur des Hebräischen; „Geschlechtsregister“ und „Geschlechterfolgen“ machen den in בְּהִתְיַחֵשׂ und תֹלְדוֹת enthaltenen genealogischen Zusammenhang ausdrücklich.
