  text: כִּֽי חֲלָלִ֤ים רַבִּים֙ נָפָ֔לוּ כִּ֥י מֵ/הָ/אֱלֹהִ֖ים הַ/מִּלְחָמָ֑ה וַ/יֵּשְׁב֥וּ תַחְתֵּי/הֶ֖ם עַד הַ/גֹּלָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/022.yaml
  text: For many slain fell[a], because the battle was from God; and they lived in their place until the exile.
translation:
  language: de
  text: Denn viele Erschlagene fielen, weil der Kampf von Gott ausging; und sie ließen sich an ihrer Stelle nieder bis zum Exil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Das erste כִּי begründet den zuvor berichteten Sieg; „Denn“ gibt diesen erklärenden Zusammenhang im Deutschen natürlich wieder.
- source_word: חֲלָלִים רַבִּים
  choice: viele Erschlagene
  rationale: חֲלָלִים bezeichnet im Kampf Durchbohrte beziehungsweise Getötete. „Erschlagene“ bewahrt den militärischen Sinn der nominalen Form.
- source_word: נָפָלוּ
  choice: fielen
  rationale: נפל wird in Kampfberichten häufig für das tödliche Fallen gebraucht; zusammen mit „Erschlagene“ ist die Bedeutung eindeutig, ohne sie auszuweiten.
- source_word: כִּי
  choice: weil
  rationale: Das zweite כִּי nennt den Grund für die vielen Gefallenen und wird daher kausal wiedergegeben.
- source_word: מֵהָאֱלֹהִים
  choice: von Gott ausging
  rationale: Die Präposition מִן bezeichnet hier Herkunft oder Ursprung. „Von Gott ausging“ ist im Deutschen verständlicher als das wörtlichere „von Gott war“ und bewahrt die Aussage über den göttlichen Ursprung beziehungsweise die entscheidende Bestimmung des Kampfes.
- source_word: הַמִּלְחָמָה
  choice: der Kampf
  rationale: מִלְחָמָה bezeichnet hier die unmittelbar zuvor geschilderte militärische Auseinandersetzung; „Kampf“ passt zum einzelnen Geschehen.
- source_word: וַיֵּשְׁבוּ
  choice: sie ließen sich nieder
  rationale: ישב kann wohnen, sich niederlassen oder siedeln bedeuten. Im Zusammenhang mit der Einnahme des Gebietes bringt „sich niederlassen“ den Besiedlungsaspekt deutlich zum Ausdruck.
- source_word: תַחְתֵּיהֶם
  choice: an ihrer Stelle
  rationale: Die Wendung bezeichnet das Einnehmen des Platzes der besiegten Bewohner, nicht eine räumliche Lage unter ihnen.
- source_word: עַד הַגֹּלָה
  choice: bis zur Verbannung
  rationale: גּוֹלָה meint hier die spätere Wegführung ins Exil. „Verbannung“ gibt das historische Ereignis knapp und verständlich wieder.
theological_decisions:
- issue: Göttliche Beteiligung am Krieg
  choice: weil der Kampf von Gott ausging
  alternative: weil der Kampf Gott gehörte
  rationale: Der hebräische Wortlaut führt den Kampf beziehungsweise seinen Ausgang auf Gott zurück. Die Übersetzung wahrt diese Aussage, ohne eine weitergehende Lehre vom heiligen Krieg in den Vers hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht formelhafte Verbindung „viele Erschlagene fielen“ bewahrt die hebräische Nominalkonstruktion und den Stil eines Schlachtberichts; „ließen sich nieder“ macht den anschließenden Siedlungsvorgang natürlich verständlich.
