id: 1CH.5.6
reference: 1 Chronicles 5:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּאֵרָ֣ה בְנ֔/וֹ אֲשֶׁ֣ר הֶגְלָ֔ה תִּלְּגַ֥ת פִּלְנְאֶ֖סֶר מֶ֣לֶךְ אַשֻּׁ֑ר ה֥וּא נָשִׂ֖יא לָ/רֽאוּבֵנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/006.yaml
  text: Beerah his son[a], whom Tilgath-pilneser king of Assyria carried away into exile—he was a chief of the Reubenites.
translation:
  language: de
  text: Beera, sein Sohn, den Tilgat-Pilneser[a], der König von Assyrien, in die Verbannung führte – er war ein Stammesoberhaupt der Rubeniter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text hat hier die Namensform „Tilgat-Pilneser“; geläufiger ist die historische Form „Tiglat-Pileser“.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵרָה
  choice: Beera
  rationale: Der Personenname wird in einer im Deutschen üblichen, eng am Hebräischen orientierten Form wiedergegeben.
- source_word: בְנוֹ
  choice: sein Sohn
  rationale: Das Substantiv mit Suffix verweist im genealogischen Zusammenhang auf den zuvor genannten Vorfahren; „sein Sohn“ ist die natürliche deutsche Form.
- source_word: אֲשֶׁר
  choice: den
  rationale: Die Relativpartikel leitet einen Satz ein, in dem Beera das direkte Objekt des Verbs ist.
- source_word: הֶגְלָה
  choice: in die Verbannung führte
  rationale: Der Hifil von גלה bezeichnet das Veranlassen des Exils beziehungsweise die Deportation. Die Formulierung wahrt den kausativen Sinn in natürlichem Deutsch.
- source_word: תִּלְגַת פִּלְנְאֶסֶר
  choice: Tilgat-Pilneser
  rationale: Diese Form bildet die Namensgestalt des hebräischen Textes an dieser Stelle direkt ab; die historisch geläufigere Form „Tiglat-Pileser“ würde harmonisieren.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: der König von Assyrien
  rationale: Die Statusangabe steht als Apposition zum Königsnamen; im Deutschen ist hier der bestimmte Artikel natürlich.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen nimmt Beera nach dem Relativsatz nachdrücklich wieder auf.
- source_word: נָשִׂיא
  choice: Stammesoberhaupt
  rationale: Im genealogisch-tribalen Zusammenhang bezeichnet das Wort einen anerkannten führenden Mann. „Stammesoberhaupt“ ist präziser als das möglicherweise königlich verstandene „Fürst“.
- source_word: לָרְאוּבֵנִי
  choice: der Rubeniter
  rationale: Die Präposition ל markiert hier die Gruppe, zu der das Oberhaupt gehört beziehungsweise über die es gesetzt ist; der deutsche Genitiv gibt diese Beziehung natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bewahrt die nachdrückliche Wiederaufnahme durch הוּא. „Stammesoberhaupt“ verdeutlicht den tribalen Kontext ohne königliche Nebenbedeutung.
