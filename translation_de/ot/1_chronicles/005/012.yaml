base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/012.yaml
  text: Joel the chief[a], Shapham the second, and Jaanai and Shaphat in Bashan.
translation:
  language: de
  text: In Baschan waren Joel das Oberhaupt, Schafam der Zweite[a] sowie Jaanai und Schafat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Stellvertreter; der Zweite im Rang.'
    reason: Das hebräische מִשְׁנֶה kann allgemein den zweiten Rang oder konkreter einen Stellvertreter bezeichnen.
lexical_decisions:
- source_word: יוֹאֵל
  choice: Joel
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: הָרֹאשׁ
  choice: das Oberhaupt
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“, bezeichnet hier aber den ersten Rang beziehungsweise eine leitende Stellung. „Oberhaupt“ gibt dies natürlich und würdig wieder.
- source_word: וְשָׁפָם
  choice: Schafam
  rationale: Transliteration des hebräischen Personennamens nach deutscher Schreibkonvention.
- source_word: הַמִּשְׁנֶה
  choice: der Zweite
  rationale: מִשְׁנֶה bezeichnet hier wahrscheinlich den zweiten Rang. Die knappe Wiedergabe bewahrt die appositionelle Struktur und lässt offen, ob ein förmliches Stellvertreteramt gemeint ist.
- source_word: וְיַעְנַי
  choice: Jaanai
  rationale: Transliteration des Personennamens; die Schreibweise macht die zwei aufeinanderfolgenden Vokale der hebräischen Form erkennbar.
- source_word: וְשָׁפָט
  choice: Schafat
  rationale: Transliteration des hebräischen Personennamens nach deutscher Schreibkonvention.
- source_word: בַּבָּשָׁן
  choice: in Baschan
  rationale: Die Präposition בְּ wird mit „in“ wiedergegeben; Baschan ist die etablierte deutsche Form des Ortsnamens.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem, knappem Listenstil. Das im Hebräischen fehlende Verb wird durch „war“ ergänzt, um einen natürlichen deutschen Satz zu bilden; die Rangfolge zwischen Joel und Schafam bleibt erhalten.
