  rationale: Die Form entspricht dem hebräischen Namen hier und der üblichen deutschen Bibelnamenschreibung; sie wird nicht mit dem verwandten Namen Gerschom gleichgesetzt.
- source_word: קְהָת
  choice: Kehat
  rationale: Im Deutschen etablierte, hebräischnahe Wiedergabe des Eigennamens.
- source_word: מְרָרִי
  choice: Merari
  rationale: Im Deutschen etablierte Wiedergabe des Eigennamens.
- source_word: וּ
