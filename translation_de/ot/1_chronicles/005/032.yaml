lexical_decisions:
- source_word: וְ/עֻזִּי
  choice: Uzzi
  rationale: Der Personenname wird nach der im Deutschen gebräuchlichen biblischen Namensform wiedergegeben; die einleitende Konjunktion wird im Deutschen am Versanfang nicht eigens ausgedrückt.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in diesem genealogischen Zusammenhang das Zeugen beziehungsweise Hervorbringen eines Nachkommen. „Zeugte“ ist knapp, würdig und bildet die Abstammungsformel präzise ab.
- source_word: אֶת
  choice: '[nicht gesondert übersetzt]'
  rationale: Der hebräische Akkusativmarker hat keine unmittelbare deutsche Entsprechung; seine Funktion wird durch den deutschen Satzbau ausgedrückt.
- source_word: זְרַחְיָה
  choice: Serachja
  rationale: Der Personenname wird in einer etablierten deutschen biblischen Namensform transliteriert; der Bestandteil -ja gibt den Gottesnamenbestandteil wieder.
- source_word: וּֽ/זְרַֽחְיָה
  choice: und Serachja
  rationale: Die Konjunktion und der wiederholte Personenname werden unmittelbar wiedergegeben, sodass die Kettenstruktur des Geschlechtsregisters erhalten bleibt.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Die wiederholte genealogische Verbform wird aus Gründen der Genauigkeit und Kohärenz ebenso wie beim ersten Vorkommen übersetzt.
- source_word: מְרָיֽוֹת
  choice: Merajot
  rationale: Der Personenname wird entsprechend einer gebräuchlichen deutschen Transliteration wiedergegeben.
