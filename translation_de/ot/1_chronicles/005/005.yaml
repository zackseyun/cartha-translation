  text: מִיכָ֥ה בְנ֛/וֹ רְאָיָ֥ה בְנ֖/וֹ בַּ֥עַל בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/005.yaml
  text: Micah his son[a], Reaiah his son, Baal his son.
translation:
  language: de
  text: Micha, sein Sohn, Reaja, sein Sohn, Baal[a], sein Sohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Baal« ist hier ein Personenname innerhalb des Stammbaums, nicht der mit »Herr« zu übersetzende Titel.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיכָה
  choice: Micha
  rationale: Der Personenname wird gemäß der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: בְנוֹ
  choice: sein Sohn
  rationale: Das Substantiv mit Suffix der 3. Person Singular bedeutet wörtlich »sein Sohn«; die Wiederholung bildet hier die genealogische Abfolge ab.
- source_word: רְאָיָה
  choice: Reaja
  rationale: Der hebräische Personenname wird in einer im Deutschen geläufigen Transliteration wiedergegeben.
- source_word: בַּעַל
  choice: Baal
  rationale: Das Wort steht in dieser genealogischen Reihe als Personenname und wird daher transliteriert, nicht als Titel übersetzt.
theological_decisions:
- issue: Ob בַּעַל als Titel beziehungsweise Gottesbezeichnung zu übersetzen oder als Personenname beizubehalten ist
  choice: Als Personenname »Baal« beibehalten
  alternative: Als Titel »Herr« wiedergeben
  rationale: Syntax und Gattung weisen hier auf einen Personennamen innerhalb einer genealogischen Reihe. »Herr« würde diese Funktion verdunkeln und eine vom Zusammenhang nicht geforderte Deutung eintragen.
translation_notes:
  register: Knappes, würdiges Standarddeutsch; die wiederholte genealogische Formel des Hebräischen bleibt erhalten. Der Fußnotenmarker steht unmittelbar beim erklärten Namen.
