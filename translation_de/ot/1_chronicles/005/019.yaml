  text: וַ/יַּעֲשׂ֥וּ מִלְחָמָ֖ה עִם הַֽ/הַגְרִיאִ֑ים וִ/יט֥וּר וְ/נָפִ֖ישׁ וְ/נוֹדָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/019.yaml
  text: They made war against the Hagrites[a], Jetur, Naphish, and Nodab.
translation:
  language: de
  text: Sie führten Krieg gegen die Hagriter[a], Jetur, Nafisch und Nodab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Hagariter“. Das hebräische Ethnonym lässt beide Wiedergaben zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ מִלְחָמָה
  choice: Sie führten Krieg
  rationale: Die Verbindung aus עשה und מִלְחָמָה ist eine feste Wendung für das Führen eines Krieges. „Krieg führen“ gibt sie im modernen Deutschen natürlich wieder, ohne sie auf einen einzelnen Kampf zu verengen.
- source_word: עִם
  choice: gegen
  rationale: Obwohl die Präposition häufig „mit“ bedeutet, bezeichnet sie in Verbindung mit Kriegführen die gegnerische Partei; daher ist „gegen“ im Deutschen sachlich und idiomatisch.
- source_word: הַהַגְרִיאִים
  choice: die Hagriter
  rationale: Das Ethnonym wird entsprechend seiner hebräischen Form als „Hagriter“ wiedergegeben. Der bestimmte Artikel des Hebräischen erscheint als „die“.
- source_word: וִיטוּר
  choice: Jetur
  rationale: Der Eigenname wird in einer im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: וְנָפִישׁ
  choice: Nafisch
  rationale: Der Eigenname wird nach üblichen deutschen Transkriptionskonventionen wiedergegeben.
- source_word: וְנוֹדָב
  choice: und Nodab
  rationale: Der Eigenname wird transkribiert; die Konjunktion bleibt erhalten und schließt die Aufzählung ab.
theological_decisions: []
