  text: וּ/בְנֵי גָ֣ד לְ/נֶגְדָּ֗/ם יָֽשְׁב֛וּ בְּ/אֶ֥רֶץ הַ/בָּשָׁ֖ן עַד סַלְכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/011.yaml
  text: And the sons of Gad lived opposite them in the land of Bashan[b][a], as far as Salecah.
translation:
  language: de
  text: Und die Söhne Gads wohnten ihnen gegenüber[a] im Land Baschan bis nach Salcha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »neben ihnen« oder »ihnen zugewandt«. Der hebräische Ausdruck beschreibt die Lage im Verhältnis zu der zuvor genannten Gruppe.'
    reason: lexical_alternative
  - marker: b
    text: Der Ortsname Salcha wird auch »Salka« oder »Salkah« geschrieben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי גָד
  choice: Und die Söhne Gads
  rationale: בני bedeutet wörtlich »Söhne« und bezeichnet hier die Angehörigen beziehungsweise Nachkommen des Stammes Gad. Die hebräische Ausdrucksweise bleibt verständlich und wird daher beibehalten.
- source_word: לְ/נֶגְדָּ/ם
  choice: ihnen gegenüber
  rationale: נגד mit Pronominalsuffix bezeichnet eine räumliche Lage vor, gegenüber oder in Bezug auf die zuvor genannten Rubeniter. »Ihnen gegenüber« bewahrt die räumliche Aussage, ohne die nicht eindeutig bestimmbare Lage genauer festzulegen.
- source_word: יָשְׁבוּ
  choice: wohnten
  rationale: ישב bezeichnet hier das dauerhafte Wohnen beziehungsweise Ansässigsein in einem Gebiet. »Wohnten« ist im modernen Deutschen natürlich und vermeidet die mögliche Betonung eines erstmaligen Ansiedelns.
- source_word: בְּ/אֶרֶץ הַ/בָּשָׁן
  choice: im Land Baschan
  rationale: ארץ bezeichnet hier eine benannte Landschaft oder Region. »Land Baschan« ist eine geläufige und sachlich passende Wiedergabe.
- source_word: עַד סַלְכָה
  choice: bis nach Salcha
  rationale: עד kennzeichnet in dieser geografischen Angabe die räumliche Ausdehnung. »Bis nach« gibt diese Reichweite im Deutschen idiomatisch wieder; Salcha folgt einer geläufigen deutschen Form des Ortsnamens.
theological_decisions: []
