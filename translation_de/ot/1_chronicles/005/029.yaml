source:
  edition: WLC
  text: וּ/בְנֵ֣י עַמְרָ֔ם אַהֲרֹ֥ן וּ/מֹשֶׁ֖ה וּ/מִרְיָ֑ם וּ/בְנֵ֣י אַהֲרֹ֔ן נָדָב֙ וַ/אֲבִיה֔וּא אֶלְעָזָ֖ר וְ/אִיתָמָֽרס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/029.yaml
  text: 'The sons of Amram: Aaron[a], Moses, and Miriam; and the sons of Aaron: Nadab and Abihu, Eleazar and Ithamar.'
translation:
  language: de
  text: 'Die Söhne[a] Amrams: Aaron, Mose und Mirjam; und die Söhne Aarons: Nadab, Abihu, Eleasar und Itamar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Söhne“. In diesem genealogischen Zusammenhang bezeichnet das Wort die Kinder beziehungsweise Nachkommen innerhalb einer nach männlichen Linien geordneten Liste; hier wird neben Aaron und Mose auch Mirjam genannt.
    reason: Die wörtliche männliche Form steht in Spannung zur ausdrücklich eingeschlossenen Mirjam; die Anmerkung bewahrt sowohl den hebräischen Wortlaut als auch den Umfang der Liste.
lexical_decisions:
- source_word: וּבְנֵי עַמְרָם
  choice: Die Söhne Amrams
  rationale: בְּנֵי ist der Konstruktplural von בֵּן. Die eröffnende Konjunktion wird im Deutschen in dieser überschriftartigen genealogischen Wendung nicht eigens wiedergegeben. Der Genitiv mit nachgestelltem Eigennamen ist natürlich und würdevoll.
- source_word: אַהֲרֹן וּמֹשֶׁה וּמִרְיָם
  choice: Aaron, Mose und Mirjam
  rationale: Die Namen folgen den etablierten deutschen Bibelnamensformen. Die mehrfachen hebräischen Konjunktionen werden als natürliche deutsche Aufzählung wiedergegeben.
- source_word: וּבְנֵי אַהֲרֹן
  choice: und die Söhne Aarons
  rationale: Die Konjunktion leitet eine zweite, eng verbundene genealogische Unterliste ein und bleibt deshalb erhalten.
- source_word: נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר
  choice: Nadab, Abihu, Eleasar und Itamar
  rationale: Die Namen werden in gebräuchlichen deutschen Formen wiedergegeben; die hebräischen Konjunktionen erscheinen als idiomatische deutsche Aufzählung mit „und“ vor dem letzten Glied.
theological_decisions: []
translation_notes:
  register: Knapp gehaltener genealogischer Stil mit Doppelpunkten und Semikolon; moderne deutsche Namensformen, ohne die nominale Struktur durch ergänzte Verben auszubauen.
