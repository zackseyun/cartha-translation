  register: Modernes, würdiges Standarddeutsch. Die knappe hebräische Namenskette wurde in selbstständige Zuordnungen entfaltet, damit jede genealogische Beziehung eindeutig bleibt. Der bestimmte Artikel vor „Bus“ kennzeichnet den im Deutschen notwendigen Genitiv des kurzen Namens („des Bus“).
