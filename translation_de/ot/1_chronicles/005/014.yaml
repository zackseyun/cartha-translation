base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/014.yaml
  text: These were the sons of Abihail son of Huri[a], son of Jaroah, son of Gilead, son of Michael, son of Jeshishai, son of Jahdo, son of Buz.
translation:
  language: de
  text: Das waren die Söhne Abihajils, des Sohnes Huris, des Sohnes Jaroachs, des Sohnes Gileads, des Sohnes Michaels, des Sohnes Jeschischais, des Sohnes Jachdos, des Sohnes Bus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Ausdrücke „Söhne“ und „Sohn“ bezeichnen in Stammbäumen eine Abstammungslinie; dabei müssen nicht immer sämtliche Generationen ausdrücklich genannt sein.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Das waren
  rationale: Der pluralische Demonstrativausdruck leitet den genealogischen Eintrag ein. Das Präteritum entspricht im Deutschen dem berichtenden Zusammenhang.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Die Grundbedeutung wird bewahrt; in Stammbäumen kann der Ausdruck auch weiter gefasst eine Nachkommenschaft bezeichnen.
- source_word: אֲבִיחַיִל
  choice: Abihajil
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltransliteration wiedergegeben.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die wiederholte genealogische Formel wird formal bewahrt. Zur eindeutigen und natürlichen Wiedergabe der Abstammungskette werden die Namen jeweils erneut genannt.
- source_word: חוּרִי
  choice: Huri
  rationale: Transliteration des Personennamens; der Genitiv lautet im Text „Hurís“.
- source_word: יָרוֹחַ
  choice: Jaroach
  rationale: Die Schreibweise bildet den hebräischen Namen einschließlich des Schlusskonsonanten ח in einer für deutsche Leser verständlichen Form ab.
- source_word: גִּלְעָד
  choice: Gilead
  rationale: Geläufige deutsche Form des Personennamens.
- source_word: מִיכָאֵל
  choice: Michael
  rationale: Geläufige deutsche Form des hebräischen Personennamens.
- source_word: יְשִׁישַׁי
  choice: Jeschischai
  rationale: Deutsche Transliteration, die die hebräische Laut- und Konsonantenfolge möglichst erkennbar erhält.
- source_word: יַחְדּוֹ
  choice: Jachdo
  rationale: Deutsche Transliteration des Personennamens mit „ch“ für ח.
- source_word: בּוּז
  choice: Bus
  rationale: Deutsche Transliteration des Namens; „s“ gibt hier den stimmhaften Schlusslaut ז wieder.
