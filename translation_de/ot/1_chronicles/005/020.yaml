  text: וַ/יֵּעָזְר֣וּ עֲלֵי/הֶ֔ם וַ/יִּנָּתְנ֤וּ בְ/יָדָ/ם֙ הַֽ/הַגְרִיאִ֔ים וְ/כֹ֖ל שֶׁ֣/עִמָּ/הֶ֑ם כִּ֠י לֵ/אלֹהִ֤ים זָעֲקוּ֙ בַּ/מִּלְחָמָ֔ה וְ/נַעְתּ֥וֹר לָ/הֶ֖ם כִּי בָ֥טְחוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/020.yaml
  text: They were helped against them[a], and the Hagrites and all who were with them were given into their hand, because they cried out to God in the battle[c][b], and he answered them because they trusted in him.
translation:
  language: de
  text: Sie erhielten Hilfe gegen sie, und die Hagriter[a] und alle, die bei ihnen waren, wurden in ihre Hand gegeben[b]; denn sie schrien in der Schlacht zu Gott, und er erhörte sie[c], weil sie auf ihn vertrauten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hagariter“.'
    reason: alternative_reading
  - marker: b
    text: „In ihre Hand gegeben“ ist eine hebräische Wendung für die Auslieferung in ihre Gewalt und damit für die Niederlage.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Er ließ sich von ihnen erbitten“; das heißt, er nahm ihr Flehen günstig an und erhörte sie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָזְרוּ עֲלֵיהֶם
  choice: Sie erhielten Hilfe gegen sie
  rationale: Der Nifal von עזר ist passiv. Die Formulierung wahrt diese Aussage und lässt den unmittelbar genannten Urheber wie im Hebräischen unausgesprochen; aus dem Folgenden wird Gottes Hilfe deutlich.
- source_word: וַיִּנָּתְנוּ בְיָדָם
  choice: wurden in ihre Hand gegeben
  rationale: Die feste Verbindung נתן ביד bezeichnet die Auslieferung in die Gewalt eines anderen, hier die Niederlage im Kampf. Das hebräische Bild bleibt erhalten.
- source_word: הַהַגְרִיאִים
  choice: die Hagriter
  rationale: Der Volksname wird in einer im Deutschen gut aussprechbaren, knappen Form wiedergegeben. Die ebenfalls gebräuchliche Form „Hagariter“ steht in der Fußnote.
- source_word: וְכֹל שֶׁעִמָּהֶם
  choice: und alle, die bei ihnen waren
  rationale: Gemeint sind die mit den Hagritern verbundenen oder sie begleitenden Streitkräfte; die Wiedergabe bleibt bewusst allgemein.
- source_word: כִּי לֵאלֹהִים זָעֲקוּ בַּמִּלְחָמָה
  choice: denn sie schrien in der Schlacht zu Gott
  rationale: זעק bezeichnet einen dringlichen Hilferuf. בַּמִּלְחָמָה bezieht sich auf den konkreten Kampf.
- source_word: וְנַעְתּוֹר לָהֶם
  choice: und er ließ sich von ihnen erbitten
  rationale: Der Nifal von עתר bezeichnet hier Gottes günstige Reaktion auf ihr Flehen. Die Formulierung bewahrt die besondere Ausdrucksweise und nennt nicht ausdrücklich ein Objekt wie „Gebet“ oder „Bitte“, das im Hebräischen nicht steht.
- source_word: כִּי בָטְחוּ בוֹ
  choice: weil sie auf ihn vertrauten
  rationale: בטח ב bezeichnet vertrauendes Sichverlassen auf jemanden; die kausale Verbindung zu Gottes Antwort bleibt erhalten.
theological_decisions:
- issue: Urheber der Hilfe im Kampf
  choice: Die passive Formulierung „Sie erhielten Hilfe“ lässt den Urheber im ersten Satzteil unausgesprochen.
  alternative: „Gott half ihnen gegen ihre Feinde.“
  rationale: Die hebräische Verbform ist passiv. Der Zusammenhang macht Gott als letztlichen Helfer deutlich, ohne dass sein Name syntaktisch in den ersten Satzteil eingefügt werden muss.
- issue: Gottes Reaktion auf das Flehen
  choice: „er ließ sich von ihnen erbitten“
  alternative: „er erhörte sie“
  rationale: Die gewählte Fassung wahrt die Ausdrucksweise des Nifal von עתר und die theologische Spannung zwischen menschlichem Flehen und Gottes freier, günstiger Antwort. Die geläufigere Bedeutung wird in der Fußnote erklärt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die passive Struktur, das Bild von der „Hand“ und die eigentümliche Formulierung für Gottes Gebetserhörung werden möglichst quellennah bewahrt; Fußnoten erläutern ungewohnte Wendungen und die Namensvariante.
