  to: Sie erhielten Hilfe gegen sie, und die Hagriter[a] und alle, die bei ihnen waren, wurden in ihre Hand gegeben[b]; denn sie schrien in der Schlacht zu Gott, und er erhörte sie[c], weil sie auf ihn vertrauten.
  rationale: Die Revision beschränkt sich auf die Wiedergabe von וְנַעְתּוֹר לָהֶם. Der Haupttext verwendet mit »er erhörte sie« eine natürliche moderne deutsche Formulierung für die im Kontext gemeinte günstige Antwort Gottes. Die wörtlichere, für das Deutsche ungewohnte Nifal-Wendung bleibt erläuternd in der Fußnote erhalten. Alle übrigen Formulierungen und Anker bleiben bestehen.
