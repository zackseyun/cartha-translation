source:
  edition: WLC
  text: וְ/יוֹחָנָ֖ן הוֹלִ֣יד אֶת עֲזַרְיָ֑ה ה֚וּא אֲשֶׁ֣ר כִּהֵ֔ן בַּ/בַּ֕יִת אֲשֶׁר בָּנָ֥ה שְׁלֹמֹ֖ה בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/036.yaml
  text: And Johanan fathered Azariah[a]; he was the one who served as priest in the house that Solomon built in Jerusalem.
translation:
  language: de
  text: Und Johanan zeugte Asarja. Er war es, der in dem Haus[a] als Priester diente, das Salomo in Jerusalem gebaut hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Tempel“. Wörtlich: „im Haus“; „Haus“ ist eine geläufige Bezeichnung für den Tempel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹחָנָן
  choice: Und Johanan
  rationale: Die Konjunktion ו wird als „Und“ wiedergegeben, um die genealogische Abfolge zu bewahren; der Personenname wird in der im Deutschen gebräuchlichen biblischen Form „Johanan“ wiedergegeben.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet die Hifil-Form von ילד das Zeugen beziehungsweise Vaterwerden. „zeugte“ ist knapp, präzise und im deutschen Bibelregister verständlich.
- source_word: אֶת עֲזַרְיָה
  choice: Asarja
  rationale: Die direkte Objektmarkierung אֶת bleibt unübersetzt; der Personenname wird in der gebräuchlichen deutschen Form „Asarja“ wiedergegeben.
- source_word: הוּא אֲשֶׁר
  choice: Er war es, der
  rationale: Diese Formulierung erhält die hervorhebende Wirkung des selbstständigen Pronomens הוּא und identifiziert Asarja ausdrücklich.
- source_word: כִּהֵן
  choice: als Priester diente
  rationale: Das Verb כהן bezeichnet die Ausübung des Priesterdienstes. „als Priester diente“ bewahrt den verbalen Sinn und klingt im modernen Deutsch natürlich.
- source_word: בַּ/בַּיִת
  choice: in dem Haus
  rationale: Der hebräische Text sagt wörtlich „in dem Haus“. Gemeint ist aufgrund des Relativsatzes der von Salomo errichtete Tempel; im Haupttext bleibt jedoch die Ausdrucksweise der Vorlage erhalten.
- source_word: אֲשֶׁר בָּנָה שְׁלֹמֹה
  choice: das Salomo … gebaut hatte
  rationale: Der Relativsatz wird natürlich deutsch wiedergegeben. Das Plusquamperfekt verdeutlicht, dass der Bau dem Priesterdienst vorausging, ohne den Aussagegehalt zu verändern.
- source_word: בִּ/ירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Standardwiedergabe des Ortsnamens unter Beibehaltung der Präposition.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper genealogischer Satzführung. Die wörtliche Bezeichnung „Haus“ bleibt im Haupttext erhalten; die eindeutige sachliche Bedeutung „Tempel“ wird in der Fußnote erläutert.
