  text: וּ/בְנֵ֨י רְאוּבֵ֥ן בְּכֽוֹר יִשְׂרָאֵל֮ כִּ֣י ה֣וּא הַ/בְּכוֹר֒ וּֽ/בְ/חַלְּל/וֹ֙ יְצוּעֵ֣י אָבִ֔י/ו נִתְּנָה֙ בְּכֹ֣רָת֔/וֹ לִ/בְנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵ֑ל וְ/לֹ֥א לְ/הִתְיַחֵ֖שׂ לַ/בְּכֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/001.yaml
  text: The sons of Reuben[a], the firstborn of Israel—for he was the firstborn, but because he defiled his father’s bed, his birthright was given to the sons of Joseph son of Israel[b], though not to be enrolled by birthright—
translation:
  language: de
  text: Und die Söhne Rubens, des Erstgeborenen Israels – denn er war der Erstgeborene; weil er aber das Bett seines Vaters entweihte,[a] wurde sein Erstgeburtsrecht den Söhnen Josefs, des Sohnes Israels, gegeben, jedoch nicht, um entsprechend dem Erstgeburtsrecht im Geschlechtsregister geführt zu werden[b] –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Lagerstätten seines Vaters“. Der hebräische Plural bezeichnet hier das Ehebett.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jedoch nicht, um nach dem Erstgeburtsrecht genealogisch verzeichnet zu werden“. Die hebräische Infinitivform nennt kein Subjekt. Die Klausel unterscheidet die Übertragung des Erstgeburtsrechts von der genealogischen Einordnung, ohne deren Bezug ausdrücklich festzulegen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Das Waw wird als „Und“ wiedergegeben und wahrt den Anschluss an den vorausgehenden Zusammenhang; zugleich bleibt der im Hebräischen unvollständige, in Vers 2 fortgeführte Satzbau erhalten.
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: des Erstgeborenen Israels
  rationale: בכור bezeichnet hier Ruben nach seiner leiblichen Geburtsordnung und seinem ursprünglichen Rang als Erstgeborenen.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: denn er war der Erstgeborene
  rationale: כִּי leitet eine erläuternde Begründung ein; „denn“ gibt diese Funktion natürlich und präzise wieder.
- source_word: וּבְחַלְּלוֹ
  choice: weil er aber … entweihte
  rationale: Der Infinitiv mit ב bezeichnet hier den ursächlichen Umstand. „entweihte“ bewahrt die kultisch und sittlich gewichtige Bedeutung von חלל, ohne das konkrete Geschehen auszudeuten.
- source_word: יְצוּעֵי אָבִיו
  choice: das Bett seines Vaters
  rationale: Der hebräische Plural „Lagerstätten/Betten“ bezeichnet idiomatisch das Ehebett des Vaters; der deutsche Singular ist in diesem Zusammenhang natürlich.
- source_word: נִתְּנָה בְּכֹרָתוֹ
  choice: wurde sein Erstgeburtsrecht … gegeben
  rationale: בכורה meint hier die mit der Erstgeburt verbundenen Vorrechte, nicht lediglich die zeitliche Geburtsfolge.
- source_word: לִבְנֵי יוֹסֵף בֶּן יִשְׂרָאֵל
  choice: den Söhnen Josefs, des Sohnes Israels
  rationale: Die genealogische Kennzeichnung Josefs als Sohn Israels wird ausdrücklich beibehalten.
- source_word: וְלֹא לְהִתְיַחֵשׂ לַבְּכֹרָה
  choice: ohne dass er dem Erstgeburtsrecht entsprechend ins Geschlechtsregister eingetragen wurde
  rationale: התיחשׂ ist ein genealogischer Fachausdruck für Eintragung beziehungsweise Zuordnung nach Abstammung. Die Formulierung bewahrt die schwierige Aussage, dass die Vorrechte übertragen wurden, ohne die genealogische Erstgeburtsstellung entsprechend neu festzulegen; das implizite Subjekt bleibt auslegungsbedürftig und wird in der Fußnote erläutert.
theological_decisions:
- issue: Verhältnis von leiblicher Erstgeburt, Erstgeburtsrecht und genealogischer Eintragung
  choice: Ruben bleibt als leiblicher Erstgeborener bezeichnet, während sein Erstgeburtsrecht an Josefs Söhne übergeht; die genealogische Zuordnung wird davon unterschieden.
  alternative: Josef beziehungsweise seine Söhne ersetzten Ruben in jeder Hinsicht als genealogisch Erstgeborenen.
  rationale: Der Vers stellt Rubens leiblichen Rang und die Übertragung seiner Vorrechte nebeneinander und begrenzt diese Übertragung durch die Schlussklausel. Die Übersetzung lässt diese Spannung bestehen.
- issue: Subjekt der verneinten genealogischen Eintragung
  choice: Im Haupttext wird „er“ verwendet und die mögliche Beziehung auf Josef beziehungsweise seine Linie in der Fußnote offengelegt.
  alternative: Die Klausel ausdrücklich auf Josef oder auf Josefs Söhne beziehen.
  rationale: Das hebräische Hitpael-Infinitiv ist hinsichtlich seines unausgesprochenen Subjekts nicht eindeutig. Eine eindeutige Festlegung im Haupttext würde die genuine syntaktische Mehrdeutigkeit stärker auflösen als nötig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich und der offene Satzschluss bewahren den parenthetischen Aufbau des hebräischen Verses, dessen Hauptgedanke in Vers 2 weitergeführt wird. Die genealogischen Fachbegriffe werden verständlich, aber nicht paraphrasierend wiedergegeben.
