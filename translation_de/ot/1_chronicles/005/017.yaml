base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/017.yaml
  text: All of them were enrolled by genealogy in the days of Jotham king of Judah[a], and in the days of Jeroboam king of Israel.
translation:
  language: de
  text: Sie alle wurden in den Tagen Jotams, des Königs von Juda, und in den Tagen Jerobeams, des Königs von Israel, in die Geschlechtsregister eingetragen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurden genealogisch erfasst«; auch: »wurden nach ihrer Abstammung registriert«. Das hebräische Verb bezeichnet die Aufnahme in ein genealogisches Verzeichnis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Sie alle
  rationale: Das Wort bezeichnet die Gesamtheit und enthält ein Pronomen der 3. Person Plural. »Sie alle« gibt beides im Deutschen natürlich wieder.
- source_word: הִתְיַחְשׂוּ
  choice: wurden … in die Geschlechtsregister eingetragen
  rationale: Das Hitpael von יחשׂ bezeichnet in den Chronikbüchern die genealogische Erfassung beziehungsweise Eintragung in ein Abstammungsregister. Die Formulierung gibt den administrativen und genealogischen Sinn verständlich wieder.
- source_word: בִּימֵי
  choice: in den Tagen
  rationale: Die wörtliche hebräische Zeitangabe bleibt erhalten; sie ist auch im Deutschen verständlich und dem würdigen biblischen Erzählstil angemessen.
- source_word: יוֹתָם
  choice: Jotam
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: מֶלֶךְ יְהוּדָה
  choice: des Königs von Juda
  rationale: Die Apposition wird im Deutschen idiomatisch in den Genitiv gesetzt.
- source_word: וּבִימֵי
  choice: und in den Tagen
  rationale: Die Wiederholung der Zeitangabe bewahrt den Parallelismus und die zeitliche Zuordnung des hebräischen Textes.
- source_word: יָרָבְעָם
  choice: Jerobeam
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: des Königs von Israel
  rationale: Die hebräische Konstruktverbindung wird als idiomatische deutsche Apposition wiedergegeben.
