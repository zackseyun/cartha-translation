  text: וַ/יֵּֽשְׁב֛וּ בַּ/גִּלְעָ֥ד בַּ/בָּשָׁ֖ן וּ/בִ/בְנֹתֶ֑י/הָ וּ/בְ/כָֽל מִגְרְשֵׁ֥י שָׁר֖וֹן עַל תּוֹצְאוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/016.yaml
  text: They lived in Gilead[a], in Bashan and its towns, and in all the pasturelands of Sharon[c][b], as far as their borders.
translation:
  language: de
  text: Sie wohnten in Gilead, im Baschan und in seinen Ortschaften[a] sowie in allen Weidegebieten[b] des Scharon bis zu ihren äußersten Grenzen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »seinen Töchtern«; eine hebräische Bezeichnung für abhängige Ortschaften oder Siedlungen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Freiflächen« beziehungsweise »Gemeindeländereien«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »bis zu ihren Ausgängen«, das heißt bis zu ihren äußersten Ausläufern oder Grenzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Sie wohnten
  rationale: ישׁב bezeichnet hier das Wohnen bzw. ansässige Leben. »Sie wohnten« ist natürliches modernes Deutsch und vermeidet die mögliche Überbetonung einer erstmaligen Ansiedlung.
- source_word: בַּגִּלְעָד
  choice: in Gilead
  rationale: Der geografische Eigenname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: בַּבָּשָׁן
  choice: im Baschan
  rationale: Der geografische Eigenname wird in der gebräuchlichen deutschen Form mit passendem Artikel wiedergegeben.
- source_word: וּבִבְנֹתֶיהָ
  choice: und in seinen Ortschaften
  rationale: Wörtlich steht »und in ihren Töchtern«. Dies ist eine hebräische Bezeichnung für abhängige Ortschaften oder Siedlungen. Das Suffix bezieht sich am natürlichsten auf das unmittelbar vorausgehende Baschan.
- source_word: וּבְכָל מִגְרְשֵׁי
  choice: sowie in allen Weidegebieten
  rationale: מִגְרָשׁ bezeichnet offenes, zu Siedlungen gehörendes Land, häufig als Weidefläche genutzt. »Weidegebiete« passt zum territorialen Zusammenhang und bleibt allgemein verständlich.
- source_word: שָׁרוֹן
  choice: des Scharon
  rationale: Der regionale Eigenname wird in seiner gebräuchlichen deutschen Form wiedergegeben.
- source_word: עַל תּוֹצְאוֹתָם
  choice: bis zu ihren äußersten Grenzen
  rationale: Die wörtlichen »Ausgänge« bezeichnen hier räumlich die äußersten Ausläufer oder Grenzen. Das Pronomen lässt den Bezug des hebräischen Plurals in angemessener Weise offen.
theological_decisions: []
