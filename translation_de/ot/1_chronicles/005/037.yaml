base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/037.yaml
  text: Azariah fathered Amariah, and Amariah fathered Ahitub.
translation:
  language: de
  text: Asarja zeugte Amarja, und Amarja zeugte Ahitub.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Die Hifil-Form von ילד in der genealogischen Formel bezeichnet, dass Asarja der Vater beziehungsweise Vorfahr Amarjas wurde. »Zeugte« ist im Deutschen knapp, verständlich und für Geschlechtsregister idiomatisch.
- source_word: עֲזַרְיָה
  choice: Asarja
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: Der hebräische Akkusativmarker hat keine eigenständige deutsche Entsprechung; seine Funktion wird durch den deutschen Satzbau ausgedrückt.
- source_word: אֲמַרְיָה
  choice: Amarja
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Dasselbe genealogische Verb ילד wird parallel zum ersten Satzteil einheitlich mit »zeugte« übersetzt.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Der Personenname wird nach der üblichen deutschen biblischen Namensform transliteriert.
theological_decisions:
- issue: Reichweite der genealogischen Abstammungsangabe
  choice: Die knappe Formel »zeugte« wird beibehalten, ohne ausdrücklich eine unmittelbare Vater-Sohn-Beziehung zu behaupten.
  alternative: »wurde der Vater von« oder »war der Vorfahr von«
  rationale: Hebräische Genealogien können Generationen verkürzt darstellen. Der Kontext dieser priesterlichen Linie spricht zwar für direkte Abfolge, doch die Übersetzung sollte keine über den Wortlaut hinausgehende Präzisierung einführen.
translation_notes:
  register: Moderne, würdige Standardsprache; die knappe Parallelstruktur des hebräischen Geschlechtsregisters bleibt erhalten. Keine Fußnoten erforderlich.
