  naturalness: '„Geschlechterfolgen“ und „in das Geschlechtsregister eingetragen“ sind verständlich, aber die Satzfügung „… eingetragen: die Oberhäupter …“ ist im modernen Deutsch holprig. Eine nominale Aufzählung nach dem Doppelpunkt bildet die hebräische Struktur klarer und natürlicher ab.'
