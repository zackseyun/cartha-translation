  text: וְ/הִתְיַחְשָׂ֣/ם לְ/תֹלְדוֹתָ֗/ם רָאשֵׁי֙ בֵּ֣ית אֲבוֹתָ֔/ם גִּבּוֹרֵ֖י חָ֑יִל עֶשְׂרִ֥ים אֶ֖לֶף וּ/מָאתָֽיִם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/009.yaml
  text: 'They were enrolled by genealogy[a], according to their generations, as heads of their fathers’ houses[b], mighty men of valor: twenty thousand two hundred.'
translation:
  language: de
  text: 'Nach ihren Geschlechterfolgen waren sie in den Geschlechtsregistern verzeichnet: Oberhäupter ihrer Vaterhäuser[a], kriegstüchtige Männer, insgesamt 20.200.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Häuser ihrer Väter“. Gemeint sind väterliche Abstammungs- und Haushaltsverbände, nicht nur einzelne Kernfamilien.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְיַחְשָׂם
  choice: Sie waren … in das Geschlechtsregister eingetragen
  rationale: Das Hitpael von יחשׂ bezeichnet in den Chronikbüchern die Erfassung in einem genealogischen Verzeichnis. Die Formulierung gibt sowohl den administrativen als auch den genealogischen Sinn natürlich wieder.
- source_word: לְתֹלְדוֹתָם
  choice: nach ihren Geschlechterfolgen
  rationale: תולדות bezeichnet hier die genealogische Abstammungsfolge. „Geschlechterfolgen“ wahrt diesen Bezug deutlicher als das im heutigen Deutsch missverständliche „Generationen“.
- source_word: רָאשֵׁי בֵּית אֲבוֹתָם
  choice: die Oberhäupter ihrer Großfamilien
  rationale: רָאשֵׁי bezeichnet führende Personen; בֵּית אָבוֹת meint patrilinear organisierte, über die Kernfamilie hinausgehende Verwandtschaftsverbände. „Großfamilien“ vermittelt die soziale Größe natürlicher als die wörtliche Wendung „Vaterhäuser“.
- source_word: גִּבּוֹרֵי חָיִל
  choice: tüchtige Krieger
  rationale: Die feste Wendung bezeichnet kraftvolle, fähige beziehungsweise tapfere Männer und hat in diesem militärischen Verzeichnis einen klaren kriegerischen Bezug. „Tüchtig“ bewahrt zugleich den weiteren Sinn von Leistungsfähigkeit.
- source_word: עֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: '20.200'
  rationale: Die Zahl bedeutet eindeutig zwanzigtausendzweihundert; die Ziffernschreibung ist in einem zahlenreichen Verzeichnis gut lesbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die genealogische Verwaltungssprache bleibt erkennbar, wird aber ohne die im Deutschen ungebräuchliche Lehnprägung „Vaterhäuser“ wiedergegeben. Der abschließende Personenbezug „Mann“ ist zur natürlichen Verdeutlichung der gezählten Krieger ergänzt.
