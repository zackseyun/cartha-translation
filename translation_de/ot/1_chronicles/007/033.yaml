base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/033.yaml
  text: 'The sons of Japhlet: Pasach[a], Bimhal, and Ashvath[b]. These were the sons of Japhlet.'
translation:
  language: de
  text: 'Die Söhne Jaflets: Pasach, Bimhal und Aschwat. Dies sind die Söhne Jaflets.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי
  choice: Söhne
  rationale: Der Status constructus Plural von בֵּן bezeichnet in dieser unmittelbaren genealogischen Aufzählung am natürlichsten leibliche oder unmittelbar zugeordnete Söhne; das allgemeinere „Nachkommen“ ist hier nicht erforderlich.
- source_word: יַפְלֵט
  choice: Jaflet
  rationale: Der Personenname wird in einer im Deutschen geläufigen, hebräisch nahen Form wiedergegeben.
- source_word: פָּסַךְ
  choice: Pasach
  rationale: Der Personenname wird transliteriert; „ch“ gibt den Schlusskonsonanten כ angemessen und für deutsche Leser verständlich wieder.
- source_word: וּבִמְהָל
  choice: Bimhal
  rationale: Die Konjunktion wird als „und“ wiedergegeben, der Eigenname als Bimhal transliteriert.
- source_word: וְעַשְׁוָת
  choice: Aschwat
  rationale: „sch“ und „w“ entsprechen den üblichen deutschen Transliterationswerten für שׁ und ו in diesem Namen.
- source_word: אֵלֶּה בְּנֵי יַפְלֵט
  choice: Das waren die Söhne Jaflets
  rationale: Die wiederholte genealogische Schlussformel bleibt vollständig erhalten. Das Präteritum klingt im deutschen Erzählzusammenhang natürlich, ohne die Referenz zu verändern.
