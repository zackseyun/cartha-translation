id: 1CH.7.1
reference: 1 Chronicles 7:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י יִשָׂשכָ֗ר תּוֹלָ֧ע וּ/פוּאָ֛ה ישיב וְ/שִׁמְר֖וֹן אַרְבָּעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/001.yaml
  text: 'The sons of Issachar: Tola[a], Puah, Jashub[b], and Shimron—four.'
translation:
  language: de
  text: 'Die Söhne Issachars: Tola, Pua[a], Jaschub[b] und Schimron – vier insgesamt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Pua; nach der Namensform in anderen genealogischen Listen wird der Name in manchen Übersetzungen auch Puwa geschrieben.
    reason: alternative_reading
  - marker: b
    text: Hebräisch Jaschub; in 1. Mose 46,13 steht als Parallelform des Namens Jischwi.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: Die Söhne …
  rationale: Die Verbindung aus Konjunktion, Präposition und »Söhne von« leitet den nächsten Stammesabschnitt ein. Im Deutschen gibt eine nominale Überschrift mit Doppelpunkt die knappe genealogische Form natürlich wieder; die einleitende Konjunktion muss nicht eigens ausgedrückt werden.
- source_word: יִשָׂשכָר
  choice: Issachar
  rationale: Der Personen- und Stammesname wird in der im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: תּוֹלָע
  choice: Tola
  rationale: Der Eigenname wird transliteriert und nicht nach seiner möglichen Wortbedeutung übersetzt.
- source_word: וּ/פוּאָה
  choice: Pua
  rationale: Der masoretisch vokalisierte Eigenname wird in einer natürlichen deutschen Umschrift wiedergegeben; abweichende Namensformen aus parallelen Listen werden in der Fußnote genannt.
- source_word: ישיב
  choice: Jaschub
  rationale: Die Konsonantenform des vorliegenden Chroniktextes entspricht dem Namen Jaschub. Die abweichende Parallelform in 1. Mose 46,13 wird nicht in den Haupttext übernommen.
- source_word: וְ/שִׁמְרוֹן
  choice: und Schimron
  rationale: Der Eigenname samt verbindender Konjunktion wird als letztes Glied der deutschen Aufzählung wiedergegeben.
- source_word: אַרְבָּעָה
  choice: vier insgesamt
  rationale: Die Zahl fasst die vier genannten Söhne zusammen. »Insgesamt« macht ihre zusammenfassende Funktion im natürlichen Deutschen deutlich, ohne den Inhalt zu erweitern.
theological_decisions: []
translation_notes:
  register: Knapper, würdiger Listenstil in modernem Standarddeutsch. Die traditionellen deutschen Namensformen bleiben erhalten. Der Doppelpunkt bewahrt den nominalen Charakter des Hebräischen; der Gedankenstrich hebt die abschließende Gesamtzahl hervor. Der Fußnotenmarker [a] steht sachgerecht bei Pua, da sich die Anmerkung auf diesen Namen bezieht.
