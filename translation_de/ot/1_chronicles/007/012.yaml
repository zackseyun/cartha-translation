  text: וְ/שֻׁפִּ֤ם וְ/חֻפִּם֙ בְּנֵ֣י עִ֔יר חֻשִׁ֖ם בְּנֵ֥י אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/012.yaml
  text: And Shuppim and Huppim were the sons of Ir[b][a]; Hushim was the son of Aher.
translation:
  language: de
  text: Und Schuppim und Huppim waren die Söhne Irs; Huschim waren die Söhne Ahers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen: »Huschim, Söhne Ahers«. Die knappe Formulierung ist syntaktisch schwierig. Aher kann als Eigenname verstanden werden, möglicherweise aber auch als »ein anderer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֻׁפִּם
  choice: Und Schuppim
  rationale: Der Eigenname wird nach gängiger deutscher Bibeltransliteration wiedergegeben; die vorangestellte Konjunktion bleibt erhalten.
- source_word: וְ/חֻפִּם
  choice: und Huppim
  rationale: Der Eigenname wird transliteriert und die hebräische Konjunktion wiedergegeben.
- source_word: בְּנֵי עִיר
  choice: waren die Söhne Irs
  rationale: בְּנֵי bezeichnet im genealogischen Zusammenhang grundsätzlich Söhne; das im Hebräischen fehlende Verb wird für einen natürlichen deutschen Satz ergänzt. Der Name עִיר wird als Ir wiedergegeben und im Genitiv flektiert.
- source_word: חֻשִׁם
  choice: Huschim
  rationale: Direkte, an deutsche Laut- und Schreibkonventionen angepasste Transliteration des Eigennamens.
- source_word: בְּנֵי אַחֵר
  choice: war ein Sohn Ahers
  rationale: Der hebräische Ausdruck steht morphologisch im Plural, obwohl חֻשִׁם als singularischer Name erscheint. Der Haupttext gibt die wahrscheinlich gemeinte genealogische Beziehung verständlich wieder; die syntaktische Schwierigkeit und die lexikalische Alternative werden in der Fußnote offengelegt.
theological_decisions: []
