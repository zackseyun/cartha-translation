- source_word: בְּנֵי נַפְתָּלִי
  choice: Die Söhne Naftalis
  rationale: Der hebräische Konstruktus bezeichnet hier die vier unmittelbar genannten männlichen Nachkommen Naftalis; die deutsche Genitivform ist natürlich und präzise.
- source_word: יַחֲצִיאֵל
  choice: Jachzeel
  rationale: Die Form gibt den hebräischen Namen in einer im Deutschen verständlichen Transliteration wieder und unterscheidet ihn nicht künstlich von der entsprechenden Namensform in Genesis 46,24.
- source_word: גוּנִי
  choice: Guni
  rationale: Direkte Transliteration des hebräischen Personennamens.
- source_word: יֵצֶר
  choice: Jezer
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: שַׁלּוּם
  choice: Schallum
  rationale: Folgt der masoretischen Lesart von 1. Chronik 7,13 und gibt den anlautenden ש-Laut deutsch als „Sch“ wieder.
- source_word: בְּנֵי בִלְהָה
  choice: die Söhne Bilhas
  rationale: Die nachgestellte genealogische Bestimmung wird als Apposition wiedergegeben; der Gedankenstrich macht ihre Zuordnung zu allen vier Genannten deutlich.
