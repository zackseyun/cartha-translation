base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/006.yaml
  text: 'The sons of Benjamin: Bela[a], Beker, and Jediael—three.'
translation:
  language: de
  text: 'Die Söhne Benjamins: Bela, Becher und Jediaël – drei.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Eingebürgerte deutsche Form des Personen- und Stammesnamens. Der genealogische Zusammenhang erlaubt, die im Hebräischen elliptisch ausgedrückte Beziehung mit „Die Söhne Benjamins“ wiederzugeben.
- source_word: בֶּלַע
  choice: Bela
  rationale: Übliche und dem Hebräischen entsprechende deutsche Wiedergabe des Eigennamens.
- source_word: בֶּכֶר
  choice: Becher
  rationale: Die etablierte deutsche Bibelform gibt den hebräischen Eigennamen angemessen wieder; eine Umschrift als „Beker“ wäre möglich, ist im Deutschen jedoch weniger geläufig.
- source_word: יְדִיעֲאֵל
  choice: Jediaël
  rationale: Der Trema kennzeichnet im Deutschen, dass die Vokale a und e getrennt gesprochen werden, und bildet die hebräischen Namensbestandteile verständlich ab.
- source_word: שְׁלֹשָׁה
  choice: drei
  rationale: Die Kardinalzahl fasst die Zahl der zuvor genannten Söhne knapp zusammen.
- source_word: '[implizite genealogische Überschrift]'
  choice: 'Die Söhne Benjamins:'
  rationale: Der hebräische Nominalsatz ist genealogisch verkürzt. Die Ergänzung „Die Söhne“ macht die im Zusammenhang erkennbare Beziehung in natürlichem Deutsch ausdrücklich, ohne den Sinn zu erweitern.
