lexical_decisions:
- source_word: חֶבֶר
  choice: Heber
  rationale: Personenname; in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Die Hifil-Form von ילד bezeichnet in genealogischem Zusammenhang das Zeugen beziehungsweise Hervorbringen von Nachkommen; „zeugte“ ist knapp, sachlich und im Deutschen für Stammbäume geläufig.
- source_word: אֶת
  choice: nicht wiedergegeben
  rationale: Der hebräische Akkusativmarker besitzt keine eigenständige deutsche Entsprechung.
- source_word: יַפְלֵט
  choice: Jaflet
  rationale: Personenname; nach der masoretischen Form deutsch transliteriert.
- source_word: שׁוֹמֵר
  choice: Schomer
  rationale: Personenname; die masoretische Vokalisierung wird mit einer geläufigen deutschen Umschrift wiedergegeben.
- source_word: חוֹתָם
  choice: Hotam
  rationale: Personenname; deutsch transliteriert, wobei ח als „H“ wiedergegeben wird.
- source_word: שׁוּעָא
  choice: Schua
  rationale: Personenname; nach der masoretischen Form deutsch transliteriert.
- source_word: אֲחוֹתָם
  choice: ihre Schwester
  rationale: Das Substantiv trägt ein Suffix der 3. Person maskulin Plural und bezeichnet Schua als Schwester der zuvor genannten Männer.
theological_decisions: []
