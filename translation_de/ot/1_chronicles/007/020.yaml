  text: וּ/בְנֵ֥י אֶפְרַ֖יִם שׁוּתָ֑לַח וּ/בֶ֤רֶד בְּנ/וֹ֙ וְ/תַ֣חַת בְּנ֔/וֹ וְ/אֶלְעָדָ֥ה בְנ֖/וֹ וְ/תַ֥חַת בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/020.yaml
  text: 'The sons of Ephraim: Shuthelah[a], and Bered his son, and Tahath his son, and Eleadah his son, and Tahath his son.'
translation:
  language: de
  text: 'Die Söhne Ephraims: Schutelach, dessen Sohn[a] Bered, dessen Sohn Tachat, dessen Sohn Elada und dessen Sohn Tachat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für »Sohn« kann in Stammbäumen mitunter auch einen späteren Nachkommen bezeichnen; hier steht jedoch bei jeder Stufe wörtlich »sein Sohn«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶפְרַיִם
  choice: Die Söhne Ephraims
  rationale: Die Status-constructus-Verbindung bezeichnet die Söhne beziehungsweise die genealogische Linie Ephraims. Das einleitende Waw wird im Deutschen nicht eigens wiedergegeben, da die Formulierung als genealogische Überschrift dient.
- source_word: שׁוּתָלַח
  choice: Schutelach
  rationale: Der Personenname wird nach geläufigen deutschen Transkriptionskonventionen wiedergegeben.
- source_word: וּבֶרֶד
  choice: Bered
  rationale: Personenname in der genealogischen Abfolge; das vorangestellte Waw wird durch die syntaktische Reihung ausgedrückt.
- source_word: בְּנוֹ
  choice: dessen Sohn
  rationale: Wörtlich »sein Sohn«. »Dessen Sohn« macht im Deutschen eindeutig, dass jede folgende Person als Sohn der unmittelbar zuvor genannten Person erscheint, und erhält die stufenweise Genealogie.
- source_word: וְתַחַת
  choice: Tachat
  rationale: תַחַת ist hier aufgrund des genealogischen Zusammenhangs ein Personenname und nicht die Präposition beziehungsweise das Substantiv »unter«.
- source_word: וְאֶלְעָדָה
  choice: Elada
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: וְתַחַת בְּנוֹ
  choice: und dessen Sohn Tachat
  rationale: Die wiederholte genealogische Formel und der erneut vorkommende Name werden bewahrt; die abschließende Konjunktion wird natürlich deutsch wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang von בֵּן in der Genealogie
  choice: Sohn im Haupttext
  alternative: Nachkomme
  rationale: בֵּן bedeutet hier zunächst »Sohn«. Da biblische Genealogien Generationen überspringen können, wird der mögliche weitere Sinn nicht in den Haupttext eingetragen, sondern in einer Fußnote erläutert.
translation_notes:
  register: Moderne, würdige Standardsprache. Die kettenartige Struktur der Genealogie bleibt erkennbar, wird aber mit »dessen Sohn« idiomatisch und eindeutig formuliert. Die Schreibweisen der Namen folgen geläufigen deutschen biblischen Konventionen.
