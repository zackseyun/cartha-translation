base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/007.yaml
  text: 'And the sons of Bela: Ezbon[a], Uzzi, Uzziel, Jerimoth, and Iri—five heads of fathers’ houses, mighty men of valor; and their genealogical enrollment was twenty-two thousand and thirty-four.'
translation:
  language: de
  text: 'Und die Söhne Belas: Ezbon, Usi, Usiel, Jerimot und Iri — fünf Oberhäupter ihrer Vaterhäuser, tapfere Krieger. Ihre genealogische Erfassung belief sich auf 22.034.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Registrierung nach Geschlechtsregistern“. Das hebräische Wort bezeichnet die Eintragung in genealogische Verzeichnisse; die knappe Konstruktion verbindet diese Erfassung mit der genannten Zahl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי בֶלַע
  choice: Und die Söhne Belas
  rationale: Die wörtliche Verwandtschaftsbezeichnung passt zur unmittelbar folgenden Namensliste; der deutsche Genitiv gibt die Zugehörigkeit natürlich wieder.
- source_word: אֶצְבּוֹן וְעֻזִּי וְעֻזִּיאֵל וִירִימוֹת וְעִירִי
  choice: Ezbon, Usi, Usïel, Jerimot und Iri
  rationale: Die Personennamen werden aus dem Hebräischen in einer für deutsche Leser nachvollziehbaren Form wiedergegeben. Die Trema-Schreibung in Usïel verhindert, dass die Vokale als Diphthong gelesen werden.
- source_word: רָאשֵׁי בֵּית אָבוֹת
  choice: Oberhäupter von Großfamilien
  rationale: Der Ausdruck bezeichnet Leiter umfassender, nach väterlicher Abstammung gegliederter Familienverbände. „Großfamilien“ ist im heutigen Deutsch verständlicher als die formale Wendung „Vaterhäuser“.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: tüchtige Krieger
  rationale: Die feste Wendung bezeichnet hier kampffähige beziehungsweise bewährte Männer; im Kontext der militärischen Erfassung ist „Krieger“ sachgerecht, während „tüchtig“ Fähigkeit und Stärke ausdrückt.
- source_word: וְהִתְיַחְשָׂם
  choice: Ihre Eintragung in die Geschlechtsregister
  rationale: Das Hitpael von יחס bezeichnet in den Chronikbüchern die genealogische Registrierung. Die substantivische deutsche Form bewahrt die Konstruktion mit der folgenden Gesamtzahl.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף וּשְׁלֹשִׁים וְאַרְבָּעָה
  choice: 22.034 Mann
  rationale: Die Ziffernschreibung macht die Zählangabe leicht erfassbar. „Mann“ verdeutlicht idiomatisch, dass die Zahl registrierte Personen und nicht Registereinträge bezeichnet.
