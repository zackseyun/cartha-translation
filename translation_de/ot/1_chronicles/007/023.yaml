base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/023.yaml
  text: Then he went in to his wife[a], and she conceived and bore a son, and he called his name Beriah[c][b], because disaster had been in his house.
translation:
  language: de
  text: Dann ging er zu seiner Frau; sie wurde schwanger und gebar einen Sohn. Er gab ihm den Namen Beria[a], denn Unglück war in seinem Haus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name »Beria« klingt im Hebräischen an den Ausdruck für »im Unglück« an.
    reason: wordplay
  - marker: b
    text: Mit »Haus« kann hier auch sein Haushalt oder seine Familie gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל אִשְׁתּוֹ
  choice: ging er zu seiner Frau
  rationale: Die hebräische Wendung ist ein zurückhaltender Ausdruck für ehelichen Geschlechtsverkehr. Die deutsche Formulierung bewahrt diesen Euphemismus; die unmittelbar folgende Empfängnis macht den Sinn deutlich.
- source_word: וַתַּהַר
  choice: sie wurde schwanger
  rationale: Natürliches, allgemein verständliches Deutsch für die Empfängnis in einer Geburtsnotiz.
- source_word: וַתֵּלֶד בֵּן
  choice: gebar einen Sohn
  rationale: Knapp, würdig und der hebräischen Erzählweise entsprechend.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ בְּרִיעָה
  choice: Er gab ihm den Namen Beria
  rationale: Gibt die hebräische Namensformel in natürlichem modernem Deutsch wieder; der Personenname wird transliteriert.
- source_word: בְּרִיעָה
  choice: Beria
  rationale: Übliche deutsche Transliteration des hebräischen Personennamens; der Anklang an בְרָעָה wird in einer Fußnote erläutert.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung der Namensgebung ein und fügt sich natürlich in den deutschen Erzählsatz ein.
- source_word: בְרָעָה
  choice: Unglück
  rationale: Bezeichnet hier das schwere Missgeschick beziehungsweise Leid, das die Familie getroffen hatte, nicht moralische Bosheit.
- source_word: הָיְתָה בְּבֵיתוֹ
  choice: war in seinem Haus
  rationale: Bleibt eng bei der ungewöhnlichen hebräischen Formulierung und vermeidet es, durch eine ereignishafte Umschreibung zusätzliche Deutung einzutragen.
- source_word: בְּבֵיתוֹ
  choice: in seinem Haus
  rationale: Bewahrt das Bild des hebräischen בַּיִת; gemeint sein kann dabei das Haus im Sinn von Haushalt oder Familie.
