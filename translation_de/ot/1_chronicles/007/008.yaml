base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/008.yaml
  text: 'And the sons of Becher: Zemirah[a], Joash, Eliezer, Elioenai, Omri, Jeremoth, Abijah, Anathoth, and Alemeth. All these were the sons of Becher.'
translation:
  language: de
  text: 'Und die Söhne Bechers: Semira, Joas, Elieser, Eljoenai, Omri, Jeremot[a], Abija, Anatot und Alemet. Alle diese waren Söhne Bechers.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name wird auch Jerimot geschrieben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי בֶכֶר
  choice: Und die Söhne Bechers waren
  rationale: Die genealogische Wendung wird mit „Söhne“ präzise wiedergegeben. Das im Hebräischen fehlende Kopulaverb wird für natürliches Deutsch als „waren“ ergänzt.
- source_word: זְמִירָה
  choice: Semira
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltranskription wiedergegeben.
- source_word: אֶלְיוֹעֵינַי
  choice: Eljoënai
  rationale: Die Schreibung folgt deutscher Laut- und Bibelnamenkonvention; das Trema kennzeichnet die getrennte Aussprache der Vokale.
- source_word: יְרֵמוֹת
  choice: Jeremot
  rationale: Die Form gibt die masoretische Vokalisierung des Namens an dieser Stelle angemessen wieder; „Jerimot“ ist als abweichende traditionelle Namensform in der Fußnote vermerkt.
- source_word: כָּל אֵלֶּה בְּנֵי בָכֶר
  choice: Sie alle waren Söhne Bechers
  rationale: Die zusammenfassende genealogische Aussage wird knapp und idiomatisch wiedergegeben; „waren“ ist zur Bildung eines vollständigen deutschen Satzes ergänzt.
