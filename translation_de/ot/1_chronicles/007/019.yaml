  text: The sons of Shemida were Ahian[a], Shechem, Likhi, and Aniam.
translation:
  language: de
  text: Die Söhne[a] Schemidas waren Achjan, Sichem, Likchi und Aniam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „männlichen Nachkommen“. In Stammbäumen kann „Söhne“ auch Nachkommen im weiteren Sinn bezeichnen; der unmittelbare Zusammenhang spricht hier jedoch für „Söhne“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: waren
  rationale: In der genealogischen Aufzählung führt die Form von היה die genannten Personen idiomatisch ein; „waren“ gibt dies im Deutschen natürlich und ohne zusätzliche Bedeutungsnuance wieder.
- source_word: בְּנֵי
  choice: Söhne
  rationale: בָּנִים kann in Stammbäumen auch männliche Nachkommen im weiteren Sinn bezeichnen. Der unmittelbare Kontext mit vier männlichen Namen spricht jedoch für die konkrete Wiedergabe „Söhne“; die mögliche weitere Bedeutung wird in einer Fußnote bewahrt.
- source_word: שְׁמִידָע
  choice: Schemida
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition und in gut lesbarer deutscher Umschrift wiedergegeben.
- source_word: אַחְיָן
  choice: Achjan
  rationale: Die Umschrift gibt die hebräischen Konsonanten und die vokalische Gestalt in einer für deutsche Leser verständlichen Form wieder.
- source_word: שֶׁכֶם
  choice: Sichem
  rationale: Für den hier als Personennamen gebrauchten Namen wird die im Deutschen vertraute biblische Form „Sichem“ verwendet.
- source_word: לִקְחִי
  choice: Likchi
  rationale: Der seltene Personenname wird quellenah und entsprechend deutscher Lautzuordnung umschrieben.
- source_word: אֲנִיעָם
  choice: Aniam
  rationale: Der Personenname wird direkt und lesbar aus dem Hebräischen umschrieben.
