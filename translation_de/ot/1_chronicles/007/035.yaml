base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/035.yaml
  text: 'The son of Helem his brother: Zophah[a], Imna, Shelesh, and Amal.'
translation:
  language: de
  text: 'Und der Sohn seines Bruders Helem: Zofach, Jimna, Schelesch und Amal.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבֶן
  choice: Und der Sohn
  rationale: Das hebräische וּ gibt die Verbindung zum vorausgehenden Stammbaum wieder; בֶן steht ausdrücklich im Singular und wird trotz der anschließenden Namensreihe nicht stillschweigend in den Plural geändert.
- source_word: הֵלֶם אָחִיו
  choice: seines Bruders Helem
  rationale: אָחִיו bezeichnet Helem als Bruder der zuvor genannten Person. Die deutsche Wortstellung macht diese Beziehung verständlich, ohne den im Hebräischen nicht ausdrücklich genannten Bezug einzusetzen.
- source_word: צוֹפַח
  choice: Zofach
  rationale: 'Der Personenname wird nach deutschen Transliterationsgewohnheiten wiedergegeben: צ als Z, פ als f und das auslautende ח als ch.'
- source_word: וְיִמְנָע
  choice: Jimna
  rationale: Der Personenname wird deutsch transliteriert; die koordinierende Konjunktion wird durch die Zeichensetzung der Aufzählung wiedergegeben.
- source_word: וְשֵׁלֶשׁ
  choice: Schelesch
  rationale: Der Personenname wird nach üblichen deutschen Lautwerten transliteriert, insbesondere שׁ als sch.
- source_word: וְעָמָל
  choice: und Amal
  rationale: Die hebräische Konjunktion vor dem letzten Namen wird als deutsches „und“ wiedergegeben.
