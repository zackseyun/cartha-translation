  register: Modernes, würdevolles Standarddeutsch. Die chronistische Gliederung nach Geschlechtern und Vaterhäusern bleibt sichtbar; die ungewöhnlich verdichtete militärische Formulierung wird bewusst nicht vollständig geglättet.
