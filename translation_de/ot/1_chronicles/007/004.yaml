id: 1CH.7.4
reference: 1 Chronicles 7:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/עֲלֵי/הֶ֨ם לְ/תֹלְדוֹתָ֜/ם לְ/בֵ֣ית אֲבוֹתָ֗/ם גְּדוּדֵי֙ צְבָ֣א מִלְחָמָ֔ה שְׁלֹשִׁ֥ים וְ/שִׁשָּׁ֖ה אָ֑לֶף כִּֽי הִרְבּ֥וּ נָשִׁ֖ים וּ/בָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/004.yaml
  text: And with them, by their generations, according to their fathers' houses, were 36,000 troops for the army of war, for they had many wives and sons.
translation:
  language: de
  text: Zu ihnen gehörten, nach ihren Geschlechtern und ihren Vaterhäusern, 36.000 Truppen des Heeres für den Krieg[b]; denn sie hatten viele Frauen[a] und Söhne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Frauen“ kann hier auch ausdrücklich „Ehefrauen“ bedeuten; der genealogische und familiäre Zusammenhang legt diese Bedeutung nahe.
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung häuft mehrere militärische Begriffe und kann auch mit „Heeresabteilungen für den Kampf“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלֵיהֶם
  choice: Zu ihnen gehörten
  rationale: עַל mit Pronominalsuffix bezeichnet hier im Zusammenhang einer Aufzählung die ihnen zugeordneten beziehungsweise mit ihnen verbundenen Personen. Die deutsche Formulierung gibt diesen Zusammenhang idiomatisch wieder.
- source_word: לְתֹלְדוֹתָם
  choice: nach ihren Geschlechtern
  rationale: תּוֹלְדוֹת bezeichnet hier genealogische Gliederungen. „Geschlechter“ bewahrt den Abstammungsbezug und ist im chronistischen Kontext verständlich.
- source_word: לְבֵית אֲבוֹתָם
  choice: nach ihren Vaterhäusern
  rationale: Die feste Wendung bezeichnet die patrilinear geordneten Großfamilien beziehungsweise Sippen. „Vaterhäuser“ erhält die historische Sozialstruktur des Ausdrucks.
- source_word: גְּדוּדֵי צְבָא מִלְחָמָה
  choice: Truppen des Heeres für den Krieg
  rationale: Die Wiedergabe bewahrt die gehäufte militärische Ausdrucksweise aus „Truppen/Abteilungen“, „Heer“ und „Krieg“, ohne sie zu einer bloßen Aussage über Kampffähigkeit zu verengen.
- source_word: שְׁלֹשִׁים וְשִׁשָּׁה אָלֶף
  choice: '36.000'
  rationale: Die moderne Ziffernschreibweise gibt die genaue Zahl klar und knapp wieder.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die hohe Zahl ein.
- source_word: הִרְבּוּ
  choice: hatten viele
  rationale: Der Hifil von רבה drückt Vermehrung aus; mit Frauen und Söhnen als Ergänzung ist „hatten viele“ im Deutschen natürlich und sachlich.
- source_word: נָשִׁים
  choice: Frauen
  rationale: נָשִׁים kann sowohl „Frauen“ als auch „Ehefrauen“ bedeuten. Das deutsche „Frauen“ erhält diese Mehrdeutigkeit, während der genealogische Zusammenhang die Bedeutung „Ehefrauen“ nahelegt.
- source_word: וּבָנִים
  choice: und Söhne
  rationale: בָּנִים bedeutet wörtlich „Söhne“; die genaue genealogische Bezeichnung wird beibehalten und nicht zu „Kinder“ erweitert.
theological_decisions: []
