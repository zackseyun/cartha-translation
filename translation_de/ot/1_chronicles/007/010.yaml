base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/010.yaml
  text: 'And the sons of Jediael: Bilhan. And the sons of Bilhan: Jeush[a], Benjamin, Ehud, Chenaanah, Zethan, Tarshish, and Ahishahar.'
translation:
  language: de
  text: 'Und die Söhne Jediaëls: Bilhan. Und die Söhne Bilhans: Jaïsch[a], Benjamin, Ehud, Kenaana, Setan, Tarschisch und Ahischahar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Form des ersten Namens ist ungewöhnlich (יעיש). »Jaïsch« gibt diese Schreibung unmittelbar wieder; möglich sind auch Lesungen wie »Jaaisch« oder »Jaisch«. Wahrscheinlich ist der sonst bekannte Name »Jeusch« gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Die genealogische Formel wird entsprechend dem unmittelbaren Vater-Sohn-Aufbau wörtlich und natürlich wiedergegeben; grundsätzlich kann בֵּן auch weitere Nachkommen bezeichnen.
- source_word: יְדִיעֲאֵל
  choice: Jediaël
  rationale: Der Personenname wird in einer im Deutschen lesbaren, zugleich quellenahen Form wiedergegeben; das Trema zeigt die getrennte Aussprache der Vokale an.
- source_word: בִּלְהָן
  choice: Bilhan
  rationale: Direkte, im Deutschen gut aussprechbare Umschrift des Personennamens.
- source_word: וּבְנֵי בִלְהָן
  choice: 'Und die Söhne Bilhans:'
  rationale: Die Wiederholung der genealogischen Formel und die Listenstruktur des Hebräischen bleiben erhalten.
- source_word: יעיש
  choice: Jaïsch
  rationale: Die ungewöhnliche beziehungsweise defektive hebräische Namensform wird möglichst unmittelbar wiedergegeben, ohne sie stillschweigend an die geläufigere Form יְעוּשׁ anzugleichen.
- source_word: וּבִנְיָמִן
  choice: Benjamin
  rationale: Verwendung der im Deutschen fest etablierten Form des biblischen Personennamens.
- source_word: וְאֵהוּד
  choice: Ehud
  rationale: Verwendung der im Deutschen gebräuchlichen Form des Personennamens.
- source_word: וּכְנַעֲנָה
  choice: Kenaana
  rationale: Der Personenname wird vom Ländernamen Kanaan unterscheidbar und quellenah transkribiert.
- source_word: וְזֵיתָן
  choice: Setan
  rationale: Quellennahe deutsche Umschrift des hebräischen Personennamens; das anlautende ז wird als stimmhaftes s wiedergegeben.
- source_word: וְתַרְשִׁישׁ
  choice: Tarschisch
  rationale: Die etablierte deutsche Form wird verwendet; der Zusammenhang weist eindeutig auf einen Personennamen, nicht auf einen Ortsnamen.
- source_word: וַאֲחִישָׁחַר
  choice: Ahischahar
  rationale: Quellennahe Umschrift des Personennamens, wobei die beiden Bestandteile des hebräischen Namens erkennbar bleiben.
