  text: His daughter was Sheerah[a], and she built Lower Beth-horon and Upper Beth-horon[b], and Uzzen-sheerah.
translation:
  language: de
  text: Seine Tochter war Scheera[a]. Sie baute das untere Bet-Horon und das obere Bet-Horon[b] und Usen-Scheera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und seine Tochter Scheera«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »und das obere«; Bet-Horon ist aus dem vorhergehenden Ausdruck zu ergänzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִתּוֹ שֶׁאֱרָה
  choice: Seine Tochter war Scheera
  rationale: Die hebräische Wortfolge lautet wörtlich »und seine Tochter Scheera«. Im genealogischen Zusammenhang gibt die prädikative Formulierung die Beziehung und den Namen in natürlichem Deutsch wieder; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: וַתִּבֶן
  choice: sie baute
  rationale: בנה bedeutet gewöhnlich »bauen«. Bei Städten könnte auch ihre Gründung oder ihr Ausbau gemeint sein, doch »baute« vermeidet eine sachlich nicht ausdrücklich markierte Präzisierung.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: das untere Bet-Horon
  rationale: Der Ortsname wird als Bet-Horon transkribiert; das attributive הַתַּחְתּוֹן wird mit »das untere« wiedergegeben.
- source_word: הָעֶלְיוֹן
  choice: das obere
  rationale: Im Hebräischen wird Bet-Horon nicht wiederholt, sondern aus dem parallelen Ausdruck ergänzt. »Das obere« erhält diese knappe Struktur und bleibt verständlich.
- source_word: אֻזֵּן שֶׁאֱרָה
  choice: Usen-Scheera
  rationale: Der zusammengesetzte Ortsname wird transkribiert und durch einen Bindestrich als Einheit kenntlich gemacht.
