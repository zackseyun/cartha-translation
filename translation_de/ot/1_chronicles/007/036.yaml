  text: בְּנֵ֖י צוֹפָ֑ח ס֧וּחַ וְ/חַרְנֶ֛פֶר וְ/שׁוּעָ֖ל וּ/בֵרִ֥י וְ/יִמְרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/036.yaml
  text: 'The sons of Zophah: Suah[a], Harnepher, Shual, Beri, and Imrah.'
translation:
  language: de
  text: 'Die Söhne[a] Zofachs: Suach, Harnefer, Schual, Beri und Jimra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachkommen“. In genealogischen Listen kann das hebräische Wort בְּנֵי auch Angehörige einer weiter gefassten Abstammungslinie bezeichnen; „Söhne“ ist hier jedoch die unmittelbarere Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Die Konstruktusform bedeutet unmittelbar „Söhne von“ und dient hier als Einleitung einer genealogischen Aufzählung. Je nach Reichweite der Genealogie kann sie auch weitere Nachkommen bezeichnen; diese Möglichkeit wird in der Fußnote bewahrt.
- source_word: צוֹפָח
  choice: Zofach
  rationale: Der Personenname wird nach geläufigen deutschen Transliterationskonventionen wiedergegeben; צ erscheint als „Z“ und ח als „ch“.
- source_word: סוּחַ
  choice: Suach
  rationale: Der Personenname wird quellennah ins Deutsche transliteriert; ח wird mit „ch“ wiedergegeben.
- source_word: חַרְנֶפֶר
  choice: Harnefer
  rationale: Der Personenname wird ins Deutsche transliteriert; der Konsonant פ ohne Dagesch wird hier als „f“ wiedergegeben.
- source_word: שׁוּעָל
  choice: Schual
  rationale: Im genealogischen Zusammenhang ist die Form als Personenname zu verstehen und nicht als gleichlautendes Gattungswort zu übersetzen; שׁ wird deutsch mit „Sch“ wiedergegeben.
- source_word: בֵרִי
  choice: Beri
  rationale: Der Personenname wird entsprechend der masoretischen Vokalisierung knapp und direkt transliteriert.
- source_word: יִמְרָה
  choice: Jimra
  rationale: 'Der Personenname wird nach moderner deutscher Konvention transliteriert: anlautendes י als „J“; das unbetonte auslautende ה wird nicht durch ein zusätzliches „h“ dargestellt.'
theological_decisions: []
