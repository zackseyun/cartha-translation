source:
  edition: WLC
  text: בְּנֵ֣י מְנַשֶּׁ֔ה אַשְׂרִיאֵ֖ל אֲשֶׁ֣ר יָלָ֑דָה פִּֽילַגְשׁ/וֹ֙ הָֽ/אֲרַמִּיָּ֔ה יָלְדָ֕ה אֶת מָכִ֖יר אֲבִ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/014.yaml
  text: 'The sons of Manasseh: Asriel[a], whom his Aramean concubine bore[c][b]; she bore Machir the father of Gilead.'
translation:
  language: de
  text: 'Die Söhne[a] Manasses: Asriël, den seine aramäische Nebenfrau[b] gebar; sie gebar Machir, den Vater Gileads[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Geschlechtsregistern kann „Söhne“ auch allgemeiner „Nachkommen“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „seine Nebenfrau, die Aramäerin“; traditionell auch „die Syrerin“.'
    reason: lexical_alternative
  - marker: c
    text: „Vater Gileads“ kann im genealogischen Sprachgebrauch auch „Vorfahr“ oder „Begründer Gileads“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: Die Söhne Manasses
  rationale: בְּנֵי ist die Konstruktus-Pluralform von „Sohn“. Die direkte Wiedergabe bewahrt den genealogischen Stil; in solchen Zusammenhängen kann das Wort auch Nachkommen bezeichnen.
- source_word: אַשְׂרִיאֵל
  choice: Asriël
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben; das Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: אֲשֶׁר יָלָדָה
  choice: den … gebar
  rationale: Das Relativpronomen bezieht sich auf Asriël, und die feminine Verbform bezeichnet die anschließend genannte Nebenfrau als Subjekt.
- source_word: פִּילַגְשׁוֹ
  choice: seine … Nebenfrau
  rationale: פִּילֶגֶשׁ bezeichnet eine Frau mit rechtlich und sozial nachgeordneter Stellung. „Nebenfrau“ ist im heutigen Deutschen verständlich und weniger fremdsprachlich als „Konkubine“, ohne sie zu einer gleichrangigen Ehefrau zu erklären.
- source_word: הָאֲרַמִּיָּה
  choice: aramäische
  rationale: Das Wort bezeichnet eine aramäische Frau. „Aramäisch“ ist historisch präziser als die traditionelle Wiedergabe „syrisch“.
- source_word: יָלְדָה אֶת מָכִיר
  choice: sie gebar Machir
  rationale: Die erneute finite Verbform nimmt dieselbe feminine Person als Subjekt wieder auf. Die Wiederholung von „gebar“ spiegelt die Struktur und Betonung des Hebräischen.
- source_word: אֲבִי גִלְעָד
  choice: den Vater Gileads
  rationale: אָב bedeutet zunächst „Vater“. Die wörtliche Wiedergabe wahrt zugleich die mögliche genealogische Mehrdeutigkeit, da das Wort auch einen Vorfahren oder Begründer bezeichnen kann.
