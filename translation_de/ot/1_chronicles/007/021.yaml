base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/021.yaml
  text: Zabad his son[a], and Shuthelah his son, and Ezer and Elead; the men of Gath who were born in the land killed them[b], because they had gone down to take their livestock.
translation:
  language: de
  text: Zabad, sein Sohn, und Schutelach, sein Sohn, und Eser und Elad; die Männer von Gat, die im Land geboren waren[a], töteten sie, weil sie hinabgegangen waren[b], um ihr Vieh zu nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die einheimischen Männer von Gat«. Wörtlich: »die Männer von Gat, die im Land Geborenen«.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind dem Zusammenhang nach Eser und Elad, die nächststehenden Personen im Plural.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנוֹ
  choice: sein Sohn
  rationale: Das Konstrukt mit Suffix der 3. Person Singular maskulin wird in der genealogischen Aufzählung natürlich als »sein Sohn« wiedergegeben; die Wiederholung bleibt erhalten.
- source_word: וְעֵזֶר וְאֶלְעָד
  choice: und Eser und Elad
  rationale: Die Personennamen werden nach gängiger deutscher Bibeltradition transliteriert; beide Konjunktionen bewahren die Listenstruktur.
- source_word: וַהֲרָגוּם
  choice: töteten sie
  rationale: Das Qal-Wayyiqtol von הרג mit Objektsuffix der 3. Person Plural bezeichnet hier unmittelbar das Töten der Genannten.
- source_word: אַנְשֵׁי גַת
  choice: die Männer von Gat
  rationale: Die Wendung bezeichnet männliche Einwohner beziehungsweise Männer aus Gat; »Männer von Gat« bleibt nah am hebräischen Ausdruck.
- source_word: הַנּוֹלָדִים בָּאָרֶץ
  choice: die im Land geboren waren
  rationale: Das passive Partizip mit Artikel bezieht sich grammatisch auf die Männer von Gat. Die relativ wörtliche Fassung bewahrt den Ausdruck, ohne ihn vorschnell als bloßes »einheimisch« auszulegen.
- source_word: כִּי
  choice: weil
  rationale: Die Konjunktion führt hier den Grund für die Tötung ein.
- source_word: יָרְדוּ
  choice: sie hinabgezogen waren
  rationale: »Hinabziehen« erhält die räumliche Perspektive des Verbs ירד; das Plusquamperfekt markiert, dass dies der Tötung vorausging.
- source_word: לָקַחַת
  choice: um … zu nehmen
  rationale: Das Verb לקח wird mit seiner breiten Grundbedeutung wiedergegeben; »rauben« oder »erbeuten« wäre stärker interpretierend.
- source_word: מִקְנֵיהֶם
  choice: ihr Vieh
  rationale: מִקְנֶה bezeichnet Vieh beziehungsweise Tierbestand; »Vieh« ist im Deutschen knapp und umfasst verschiedene Nutztierarten.
theological_decisions:
- issue: Bezugswort des pluralischen Verbs יָרְדוּ
  choice: Im Haupttext bleibt das Pronomen »sie« formal stehen; die Fußnote nennt Eser und Elad als den kontextuell wahrscheinlichsten Bezug.
  alternative: Das Subjekt im Haupttext ausdrücklich als »Eser und Elad« wiederholen.
  rationale: Das Hebräische nennt das Subjekt nicht erneut. Die offene Pronomenstruktur wird daher bewahrt, während die wahrscheinlichste syntaktische Zuordnung transparent erläutert wird.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit enger Bindung an die hebräische Satzstruktur. Das Semikolon trennt die genealogische Aufzählung vom erzählenden Hauptsatz. Die Namen erscheinen in geläufiger deutscher Form.
