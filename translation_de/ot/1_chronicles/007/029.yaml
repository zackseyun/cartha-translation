base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/029.yaml
  text: And along the borders of the sons of Manasseh were Beth-shean and its daughter towns[a], Taanach and its daughter towns, Megiddo and its daughter towns, Dor and its daughter towns[b]. In these lived the sons of Joseph son of Israel.
translation:
  language: de
  text: Und an der Seite der Nachkommen Manasses lagen Bet-Schean und seine Tochterstädte[a], Taanach und seine Tochterstädte, Megiddo und seine Tochterstädte sowie Dor und seine Tochterstädte. In diesen Orten wohnten die Nachkommen Josefs, des Sohnes Israels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Töchter“. Gemeint sind kleinere, einem Hauptort zugeordnete Ortschaften; auch „Dörfer“ oder „zugehörige Ortschaften“ ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יְדֵי
  choice: Und an der Grenze
  rationale: Die örtliche Wendung bezeichnet hier die Lage neben dem Gebiet beziehungsweise an der Grenze Manasses; eine wörtliche Wiedergabe mit „Hand“ wäre im Deutschen irreführend.
- source_word: בְנֵי מְנַשֶּׁה
  choice: der Nachkommen Manasses
  rationale: „Nachkommen“ gibt die stammesbezogene Bedeutung von „Söhne“ in diesem territorialen Zusammenhang natürlich und eindeutig wieder.
- source_word: בֵּית שְׁאָן
  choice: Bet-Schean
  rationale: Gebräuchliche deutsche Umschrift des masoretisch punktierten Ortsnamens.
- source_word: וּבְנֹתֶיהָ / וּבְנוֹתֶיהָ
  choice: und seine Tochterstädte
  rationale: Der Ausdruck bezeichnet von einer Hauptstadt abhängige Siedlungen; „Tochterstädte“ bewahrt das hebräische Bild und ist im Deutschen verständlich.
- source_word: תַּעְנַךְ
  choice: Taanach
  rationale: Gebräuchliche deutsche Umschrift des Ortsnamens.
- source_word: מְגִדּוֹ
  choice: Megiddo
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: דּוֹר
  choice: Dor
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: בְאֵלֶּה
  choice: In diesen Orten
  rationale: Das Demonstrativpronomen verweist auf die zuvor genannten Städte und ihre Siedlungen; die Ergänzung „Orten“ schafft im Deutschen Klarheit.
- source_word: יָשְׁבוּ
  choice: wohnten
  rationale: Das Verb bezeichnet hier dauerhaftes Wohnen beziehungsweise Ansässigsein, nicht notwendig den Vorgang einer ersten Besiedlung.
- source_word: בְּנֵי יוֹסֵף
  choice: die Nachkommen Josefs
  rationale: Im Stammeszusammenhang ist die genealogische Sammelbezeichnung gemeint; „Nachkommen“ ist in modernem Deutsch natürlicher als „Söhne“.
- source_word: בֶּן יִשְׂרָאֵל
  choice: des Sohnes Israels
  rationale: Die Apposition identifiziert Josef genealogisch als Sohn Israels und wird im Deutschen eindeutig angeschlossen.
theological_decisions: []
