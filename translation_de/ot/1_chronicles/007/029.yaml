  register: Moderne, würdevolle Standardsprache. Die Stammesbezeichnungen werden zur besseren Verständlichkeit mit „Nachkommen“ wiedergegeben. Die Ortsnamen folgen gebräuchlichen deutschen Bibelformen; die wiederholte Siedlungsformel des Hebräischen bleibt erhalten.
