base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/039.yaml
  text: 'The sons of Ulla: Arah[a], Hanniel[d][c][b], and Rizia.'
translation:
  language: de
  text: 'Und die Söhne Ullas: Arach, Hanniel und Rizia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Die Konstruktverbindung בְּנֵי bedeutet wörtlich „Söhne von“. Das vorangestellte וּ wird als „Und“ wiedergegeben, da es den Eintrag mit dem vorausgehenden Stammbaum verbindet und im Deutschen nicht unnatürlich wirkt.
- source_word: עֻלָּא
  choice: Ulla
  rationale: Der Personenname wird entsprechend der hebräischen Form transliteriert; die Verdopplung des l spiegelt den Dagesch wider.
- source_word: אָרַח
  choice: Arach
  rationale: Der Personenname wird nach der hebräischen Form mit deutschem ch für den Schlusslaut ח wiedergegeben.
- source_word: חַנִּיאֵל
  choice: Hanniël
  rationale: Die Umschrift bewahrt das verdoppelte n; das Trema macht kenntlich, dass i und ë getrennt gesprochen werden.
- source_word: רִצְיָא
  choice: Rizia
  rationale: Der Personenname wird anhand der masoretischen Konsonanten und Vokale in einer im Deutschen gut lesbaren Form transliteriert.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Standarddeutsch für einen genealogischen Eintrag. Das ergänzte „waren“ ergibt einen natürlichen vollständigen deutschen Satz, ohne den Sinn zu erweitern. Eigennamen werden quellennah und deutsch lesbar wiedergegeben.
