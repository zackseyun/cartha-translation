base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/002.yaml
  text: 'The sons of Tola: Uzzi[a], Rephaiah, Jeriel, Jahmai, Ibsam, and Samuel, heads of their fathers’ houses belonging to Tola, mighty men of valor according to their generations[c][b]. Their number in the days of David was twenty-two thousand six hundred.'
translation:
  language: de
  text: 'Die Söhne Tolas waren: Usi, Refaja, Jeriël, Jachmai, Jibsam und Samuel. Sie waren Oberhäupter ihrer Familienverbände aus dem Geschlecht Tolas, tüchtige Krieger nach ihren Geschlechterfolgen.[a] In den Tagen Davids betrug ihre Zahl 22.600.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach ihren Abstammungsregistern“. Die hebräische Wendung kann sowohl die Geschlechterfolgen als auch ihre genealogische Erfassung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי תוֹלָע
  choice: Die Söhne Tolas waren
  rationale: Im genealogischen Zusammenhang bezeichnet בְּנֵי zunächst die Söhne beziehungsweise unmittelbaren männlichen Nachkommen; das einleitende ו wird für einen natürlichen deutschen Satzbau nicht eigens wiedergegeben.
- source_word: עֻזִּי וּרְפָיָה וִירִיאֵל וְיַחְמַי וְיִבְשָׂם וּשְׁמוּאֵל
  choice: Usi, Refaja, Jeriël, Jachmai, Jibsam und Samuel
  rationale: Die Eigennamen werden in geläufiger deutscher Bibeltransliteration wiedergegeben; die Trema-Schreibung Jeriël verdeutlicht die Silbentrennung.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: Oberhäupter ihrer Großfamilien
  rationale: רָאשִׁים bezeichnet hier führende Familien- oder Sippenoberhäupter. בֵּית אָבוֹת ist eine größere, von gemeinsamen Vorfahren hergeleitete Verwandtschaftseinheit; „Großfamilien“ vermittelt dies im heutigen Deutsch verständlicher als die wörtliche Wendung „Vaterhäuser“.
- source_word: לְתוֹלָע
  choice: in der Nachkommenschaft Tolas
  rationale: Das ל ordnet die genannten Familienoberhäupter Tolas Linie zu. Die Formulierung gibt diese Zugehörigkeit natürlich wieder, ohne eine besondere Amtsbeziehung zu behaupten.
- source_word: גִּבּוֹרֵי חַיִל
  choice: tüchtige Krieger
  rationale: Die feste Wendung hebt hier im Zusammenhang einer militärisch relevanten Zählung Stärke und Kriegstüchtigkeit hervor; zugleich kann חַיִל auch Tapferkeit oder Leistungsfähigkeit einschließen.
- source_word: לְתֹלְדוֹתָם
  choice: geordnet nach ihren Geschlechterfolgen
  rationale: תּוֹלְדוֹת bezeichnet hier genealogische Abstammungsreihen beziehungsweise deren Gliederung. „Geschlechterfolgen“ bewahrt den genealogischen Sinn, während „geordnet“ die relationale Funktion des ל ausdrückt.
- source_word: מִסְפָּרָם בִּימֵי דָוִיד עֶשְׂרִים וּשְׁנַיִם אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: In den Tagen Davids betrug ihre Zahl 22.600
  rationale: Die Zahlangabe wird im modernen Deutschen numerisch und die Zeitbestimmung idiomatisch wiedergegeben.
theological_decisions: []
