  register: Modernes, würdiges Standarddeutsch. Die schwerfälligen hebräischen Reihungen werden vorsichtig gegliedert, ohne die genealogische und militärische Aussage zu verändern. Der einzige Fußnotenmarker [a] steht im Haupttext.
