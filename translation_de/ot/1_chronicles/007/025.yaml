base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/025.yaml
  text: Rephah his son[a], Resheph, Telah his son, Tahan his son.
translation:
  language: de
  text: und Rephach, sein Sohn, und Reschef und Telach, sein Sohn, und Tachan, sein Sohn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht kein ausdrückliches Verb. Die Namen bilden eine knappe genealogische Reihung; „sein Sohn“ ist bei Rephach, Telach und Tachan ausdrücklich gesetzt, nicht jedoch bei Reschef.
    reason: cultural_note
lexical_decisions:
- source_word: רֶפַח
  choice: Refach
  rationale: Personenname; in einer im Deutschen lesbaren, dem Hebräischen nahen Form wiedergegeben.
- source_word: בְּנוֹ
  choice: sein Sohn / dessen Sohn
  rationale: Das Substantiv בֵּן mit Suffix der 3. Person maskulin Singular bedeutet wörtlich „sein Sohn“. Nach dem ersten Glied verdeutlicht „dessen Sohn“ die fortlaufende Abstammungslinie, ohne ein im Hebräischen fehlendes Verb einzufügen.
- source_word: רֶשֶׁף
  choice: Reschef
  rationale: Im genealogischen Zusammenhang ist die Form ein Personenname und wird daher nicht mit möglichen Bedeutungen wie „Flamme“ oder „Seuche“ übersetzt.
- source_word: תֶלַח
  choice: Telach
  rationale: Personenname; nach deutscher Umschriftkonvention wiedergegeben.
- source_word: תַחַן
  choice: Tachan
  rationale: Personenname; nach deutscher Umschriftkonvention wiedergegeben.
- source_word: וְ
  choice: und
  rationale: Die vorangestellte Konjunktion verbindet diesen Vers mit der vorausgehenden Genealogie und verknüpft auch die Glieder der Abstammungsfolge.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Standarddeutsch. Die formelhafte Genealogie bleibt erkennbar; „dessen Sohn“ macht zugleich die wahrscheinlich gemeinte Abstammungsfolge verständlich. Der Vers beginnt mit „und“, weil auch der hebräische Text ausdrücklich an den vorhergehenden Zusammenhang anschließt.
