  text: כָּל אֵ֣לֶּה בְנֵי אָ֠שֵׁר רָאשֵׁ֨י בֵית הָ/אָב֤וֹת בְּרוּרִים֙ גִּבּוֹרֵ֣י חֲיָלִ֔ים רָאשֵׁ֖י הַ/נְּשִׂיאִ֑ים וְ/הִתְיַחְשָׂ֤/ם בַּ/צָּבָא֙ בַּ/מִּלְחָמָ֔ה מִסְפָּרָ֣/ם אֲנָשִׁ֔ים עֶשְׂרִ֥ים וְ/שִׁשָּׁ֖ה אָֽלֶף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/040.yaml
  text: All these were sons of Asher[a], heads of fathers’ houses, select men, mighty warriors, chief leaders; and they were enrolled for service in the army for war. Their number in men was twenty-six thousand.
translation:
  language: de
  text: Alle diese waren Söhne Aschers, Oberhäupter von Großfamilien, ausgewählte Männer, tapfere Krieger und die Obersten der führenden Männer. Sie waren in den Geschlechtsregistern für den Heeresdienst im Krieg erfasst[a]. Ihre Zahl betrug 26.000 Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihre Abstammung war für den Heeresdienst im Krieg verzeichnet.« Das hebräische Verb bezeichnet in den Chronikbüchern häufig die Eintragung in ein Geschlechtsregister.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי בֵית הָאָבוֹת
  choice: Oberhäupter von Großfamilien
  rationale: Die feste soziale und genealogische Wendung bezeichnet die Leiter väterlicher Sippen- oder Familienverbände. »Großfamilien« vermittelt die damalige soziale Einheit im heutigen Deutsch verständlicher als die wörtliche, aber missverständliche Form »Vaterhäuser«.
- source_word: בְּרוּרִים
  choice: ausgewählte Männer
  rationale: Das passive Partizip bezeichnet ausgewählte beziehungsweise besonders geeignete Personen; »ausgewählte Männer« bewahrt diesen Sinn natürlich.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: tapfere Krieger
  rationale: Die militärische Ehrenbezeichnung verbindet Tüchtigkeit, Stärke und Tapferkeit. »Tapfere Krieger« ist gegenwärtig und würdevoll, ohne die altertümliche Formulierung »Helden von Tapferkeit«.
- source_word: רָאשֵׁי הַנְּשִׂיאִים
  choice: die Obersten der Stammesführer
  rationale: Die Konstruktion bezeichnet hochrangige Häupter unter den נְשִׂיאִים. »Stammesführer« gibt deren gemeinschaftliche Leitungsfunktion wieder, ohne den im modernen Deutsch leicht monarchisch verstandenen Titel »Fürsten« aufzudrängen.
- source_word: וְהִתְיַחְשָׂם
  choice: sie waren in den Geschlechtsregistern … erfasst
  rationale: Das Verb יחס im Hitpael bezeichnet besonders in den Chronikbüchern die genealogische Eintragung oder Registrierung. Die Formulierung macht diesen administrativ-genealogischen Sinn sichtbar und verbindet ihn entsprechend dem Kontext mit dem Heeresdienst.
- source_word: בַּצָּבָא בַּמִּלְחָמָה
  choice: für den Heeresdienst im Krieg
  rationale: צָבָא bezeichnet hier das organisierte Heer beziehungsweise den Militärdienst, während מִלְחָמָה dessen Einsatz im Krieg näher bestimmt.
- source_word: מִסְפָּרָם אֲנָשִׁים
  choice: Ihre Zahl betrug … Mann
  rationale: Die deutsche Zählformel mit »Mann« gibt den ausdrücklichen Personenbezug des Hebräischen idiomatisch wieder.
- source_word: עֶשְׂרִים וְשִׁשָּׁה אָלֶף
  choice: '26.000'
  rationale: Übliche deutsche Wiedergabe der Zahl sechsundzwanzigtausend.
