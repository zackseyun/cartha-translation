  text: וּ/בְנֵ֖י יֶ֑תֶר יְפֻנֶּ֥ה וּ/פִסְפָּ֖ה וַ/אְרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/038.yaml
  text: 'And the sons of Jether: Jephunneh[a], Pispa, and Ara.'
translation:
  language: de
  text: 'Und die Söhne Jeters: Jefunne, Pispa und Ara.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: בְנֵי ist der Konstruktplural von „Sohn“ und bildet hier eine genealogische Formel. „Söhne“ bewahrt diese Form genauer als das weitere „Kinder“; וּ wird als „Und“ wiedergegeben.
- source_word: יֶתֶר
  choice: Jeter
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition und hebräischer Aussprache als „Jeter“ transliteriert.
- source_word: יְפֻנֶּה
  choice: Jefunne
  rationale: Der Personenname wird in der im Deutschen üblichen Form „Jefunne“ wiedergegeben; die Verdopplung des Nun wird bewahrt.
- source_word: וּפִסְפָּה
  choice: Pispa
  rationale: Der Personenname wird transliteriert; das Schluss-He ist hier wahrscheinlich nicht als eigener Konsonant hörbar und wird daher nicht mit „h“ dargestellt. Das Präfix וּ ist in der deutschen Aufzählung durch die Satzstruktur mitgetragen.
- source_word: וַאְרָא
  choice: und Ara
  rationale: Die Form wird im genealogischen Zusammenhang als Personenname mit vorangestellter Konjunktion verstanden; daher „und Ara“.
theological_decisions: []
