source:
  edition: WLC
  text: וּ/בְנֵ֥י אוּלָ֖ם בְּדָ֑ן אֵ֚לֶּה בְּנֵ֣י גִלְעָ֔ד בֶּן מָכִ֖יר בֶּן מְנַשֶּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/017.yaml
  text: 'And the sons of Ulam: Bedan. These were the sons of Gilead son of Machir[a], son of Manasseh.'
translation:
  language: de
  text: 'Und die Söhne Ulams: Bedan. Diese waren die Söhne Gileads, des Sohnes Machirs[a], des Sohnes Manasses.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Diese sind/waren die Söhne Gileads …“ Der Satz kann als genealogische Zusammenfassung dienen, die Ulams Linie über Gilead und Machir mit Manasse verbindet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Das ו wird als einfache Verknüpfung mit „Und“ wiedergegeben; בְּנֵי ist die übliche genealogische Konstruktverbindung „Söhne …s“.
- source_word: אוּלָם
  choice: Ulam
  rationale: Der Personenname wird nach gängiger deutscher Form transkribiert.
- source_word: בְּדָן
  choice: Bedan
  rationale: Der Personenname wird transkribiert.
- source_word: אֵלֶּה
  choice: Diese waren
  rationale: Im Hebräischen steht wörtlich nur „diese“; für natürliches Deutsch wird die Kopula ergänzt. Das Präteritum passt zum rückblickenden genealogischen Zusammenhang.
- source_word: בְּנֵי גִלְעָד
  choice: die Söhne Gileads
  rationale: Die formale genealogische Wendung „Söhne Gileads“ bleibt erhalten, statt sie deutend als „Nachkommen“ wiederzugeben.
- source_word: בֶּן מָכִיר
  choice: des Sohnes Machirs
  rationale: Die genealogische Zuordnung wird im Deutschen als Apposition im Genitiv natürlich und zugleich eng am Ausgangstext wiedergegeben.
- source_word: בֶּן מְנַשֶּׁה
  choice: des Sohnes Manasses
  rationale: Die genealogische Zuordnung wird beibehalten; „Manasse“ erscheint in der im Deutschen eingebürgerten Genitivform „Manasses“.
theological_decisions: []
