base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/031.yaml
  text: 'The sons of Beriah: Heber and Malchiel[b][a]; he was the father of Birzaith.'
translation:
  language: de
  text: 'Und die Söhne Berias: Heber und Malkiël; dieser war der Vater[a] von Birsajit[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Vorfahr von“ beziehungsweise „der Gründer von“. In Geschlechtsregistern kann „Vater von“ auch den Ahnherrn einer Sippe oder den Gründer einer Ortschaft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der seltene Name wird auch Birsot oder Berasot wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי בְרִיעָה
  choice: Und die Söhne Berias waren
  rationale: Die Konstruktverbindung bezeichnet Berias Söhne; das vorangestellte ו wird mit „Und“ wiedergegeben. Das ergänzte „waren“ macht die genealogische Aufzählung im Deutschen natürlich, ohne den Sinn zu verändern.
- source_word: חֶבֶר
  choice: Heber
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: וּמַלְכִּיאֵל
  choice: und Malkiël
  rationale: Der Personenname wird transliteriert; das Trema verdeutlicht, dass i und e getrennt gesprochen werden. Die vorangestellte Konjunktion wird mit „und“ wiedergegeben.
- source_word: הוּא
  choice: Er
  rationale: Das selbstständige maskuline Pronomen nimmt am ehesten den unmittelbar zuvor genannten Malkiël wieder auf; die hebräische Satzstruktur bleibt erhalten.
- source_word: אֲבִי
  choice: der Vater von
  rationale: Die wörtliche genealogische Bezeichnung wahrt die mögliche Bedeutungsspanne zwischen unmittelbarem Vater, Vorfahren und Gründer.
- source_word: ברזות
  choice: Birsajit
  rationale: Der seltene, unvokalisierte Eigenname wird konservativ transliteriert. Ob er eine Person, Sippe oder Ortschaft bezeichnet, bleibt offen.
theological_decisions: []
