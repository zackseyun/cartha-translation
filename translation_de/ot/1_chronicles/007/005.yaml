base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/005.yaml
  text: And their brothers[a], throughout all the families of Issachar, were mighty men of valor, eighty-seven thousand in all[b], enrolled by genealogy.
translation:
  language: de
  text: Und ihre Brüder[a] bei allen Sippen Issachars waren tapfere Krieger, insgesamt 87.000, die in den Geschlechtsregistern verzeichnet waren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Verwandten« beziehungsweise »ihre Sippenangehörigen«. Das hebräische Wort für »Brüder« kann in genealogischen Zusammenhängen auch entferntere Verwandte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »genealogisch erfasst« beziehungsweise »in den genealogischen Verzeichnissen registriert«. Das hebräische Verb bezeichnet die Erfassung in genealogischen Verzeichnissen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Und ihre Brüder
  rationale: אָח bedeutet grundsätzlich »Bruder«, kann sich in genealogischen Zusammenhängen jedoch weiter auf Verwandte oder Sippenangehörige beziehen. Die wörtliche Wiedergabe bewahrt diese hebräische Ausdrucksweise; eine Fußnote erklärt den weiteren Sinn.
- source_word: לְכֹל מִשְׁפְּחוֹת יִשָׂשכָר
  choice: aus allen Sippen Issachars
  rationale: Die Wendung bezeichnet hier den Umfang innerhalb der genealogischen Gliederungen Issachars. »Sippen« trifft מִשְׁפָּחוֹת in diesem Kontext natürlicher und genauer als das moderne, oft engere »Familien«.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: tapfere Krieger
  rationale: Die feste Wendung bezeichnet kampffähige, bewährte Männer. »Tapfere Krieger« gibt sowohl die militärische als auch die wertende Komponente in natürlichem modernem Deutsch wieder.
- source_word: שְׁמוֹנִים וְשִׁבְעָה אֶלֶף
  choice: '87.000'
  rationale: Die Kardinalzahl wird eindeutig als siebenundachtzigtausend wiedergegeben; die Ziffernschreibung erleichtert das Erfassen der hohen Zahl.
- source_word: הִתְיַחְשָׂם
  choice: die in die Geschlechtsregister eingetragen waren
  rationale: Der Hitpael von יחשׂ bezeichnet die genealogische Erfassung beziehungsweise Eintragung. Die Formulierung macht den administrativen Bezug auf genealogische Verzeichnisse deutlich.
- source_word: לַכֹּל
  choice: insgesamt
  rationale: Die Wendung fasst die Gesamtzahl idiomatisch und klar zusammen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sippen« wahrt den genealogischen Kontext, während »tapfere Krieger« die feste militärische Wendung natürlich wiedergibt. Die Satzstellung hält die Gesamtzahl eng bei ihrer zusammenfassenden Angabe und ordnet die genealogische Registrierung eindeutig den genannten Männern zu.
