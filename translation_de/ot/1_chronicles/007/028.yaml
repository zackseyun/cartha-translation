base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/028.yaml
  text: Their holdings and settlements were Bethel and its daughter towns[a], and to the east Naaran, and to the west Gezer and its daughter towns, and Shechem and its daughter towns[c][b], as far as Ayyah and its daughter towns.
translation:
  language: de
  text: Zu ihrem Grundbesitz und ihren Siedlungen gehörten Bethel mit seinen Tochterstädten[b], im Osten Naaran[a], im Westen Geser mit seinen Tochterstädten sowie Sichem mit seinen Tochterstädten bis nach Aija[c] mit seinen Tochterstädten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Manche geben den Ortsnamen aufgrund einer verwandten Namensüberlieferung an anderer Stelle mit »Naara« wieder.
    reason: alternative_reading
  - marker: b
    text: Wörtlich steht im Hebräischen »Töchter«. Gemeint sind kleinere, einer größeren Stadt zugeordnete Städte oder Dörfer.
    reason: cultural_note
  - marker: c
    text: Der hebräische Text hat »Aija«; einige alte Überlieferungen und Übersetzungen weisen stattdessen auf »Gaza« hin.
    reason: textual_variant
lexical_decisions:
- source_word: אֲחֻזָּתָם
  choice: ihr Grundbesitz
  rationale: Das Wort bezeichnet hier territorialen beziehungsweise landgebundenen Besitz. »Grundbesitz« passt zur anschließenden geografischen Aufzählung und vermeidet die in diesem Zusammenhang unnötig theologisch gefärbte Wiedergabe »Erbteil«.
- source_word: מֹשְׁבוֹתָם
  choice: ihre Siedlungsorte
  rationale: Im territorialen Zusammenhang sind bewohnte Orte gemeint. »Siedlungsorte« ist verständlich und gibt den Ortsbezug genauer wieder als das allgemeinere »Wohnsitze«.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: בְנֹתֶיהָ
  choice: seine Tochterstädte
  rationale: Wörtlich steht »seine Töchter«; dies ist eine Ortsmetapher für kleinere, von einer größeren Stadt abhängige Orte. »Tochterstädte« bewahrt das Bild, das in einer Fußnote erläutert wird.
- source_word: לַמִּזְרָח
  choice: im Osten
  rationale: Die Wendung bezeichnet die östliche Lage beziehungsweise Ausdehnung des Gebietes und wird im Deutschen natürlich mit »im Osten« wiedergegeben.
- source_word: נַעֲרָן
  choice: Naaran
  rationale: Die masoretische Form unterstützt »Naaran«. Die verwandte Namensform »Naara« wird als alternative Überlieferung in einer Fußnote genannt.
- source_word: לַמַּעֲרָב
  choice: im Westen
  rationale: Natürliches deutsches Gegenstück zu »im Osten« und passende Wiedergabe der westlichen Lage beziehungsweise Ausdehnung.
- source_word: גֶּזֶר
  choice: Geser
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: עַד
  choice: bis nach
  rationale: Kennzeichnet hier die räumliche Ausdehnung bis zu einem genannten Ort; »bis nach« ist im Deutschen idiomatisch.
- source_word: עַיָּה
  choice: Aija
  rationale: Die deutsche Umschrift »Aija« gibt die masoretische Lesung עַיָּה wieder. Die abweichende antike Überlieferung »Gaza« wird nicht in den Haupttext übernommen, sondern in einer Fußnote dokumentiert.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur bleibt der knappen territorialen Aufzählung des Hebräischen nahe, wird aber durch »mit« und die Richtungsangaben idiomatisch gegliedert. Die Ortsnamen folgen gebräuchlichen deutschen Bibelformen; die Metapher »Tochterstädte« bleibt erhalten und wird erläutert.
