lexical_decisions:
- source_word: בֶּצֶר
  choice: Bezer
  rationale: Personenname in einer genealogischen Aufzählung; in einer im Deutschen geläufigen, hebräisch nahen Form wiedergegeben.
- source_word: הוֹד
  choice: Hod
  rationale: Der Kontext weist trotz der möglichen Bedeutung des gleichlautenden Substantivs („Hoheit/Pracht“) eindeutig auf einen Personennamen; daher Transliteration.
- source_word: שַׁמָּא
  choice: Schamma
  rationale: Direkte, deutschsprachige Wiedergabe des hebräischen Personennamens; das auslautende Alef wird nicht durch ein zusätzliches h dargestellt.
- source_word: שִׁלְשָׁה
  choice: Schilscha
  rationale: Deutsch lesbare Transliteration der masoretisch vokalisierten Namensform; das Schluss-he bezeichnet hier keinen hörbaren h-Laut.
- source_word: יִתְרָן
  choice: Jitran
  rationale: Hebräisches Jod wird nach deutscher Aussprachekonvention mit J wiedergegeben; die Form bleibt dem hebräischen Namen eng verbunden.
- source_word: בְאֵרָא
  choice: Beera
  rationale: Lesbare deutsche Transliteration; die Vokalfolge gibt das Alef hinreichend wieder, ohne einen im deutschen Bibeltext ungewohnten Apostroph einzufügen.
