translation_notes:
  register: Schlichte, würdevolle genealogische Namensreihe. Das wiederholte hebräische וְ/וּ wird im Deutschen idiomatisch nur vor dem letzten Glied mit „und“ wiedergegeben. Die Namen folgen deutschen Transliterationserwartungen (sch für שׁ, j für י) und vermeiden unnötige Anglisierungen.
