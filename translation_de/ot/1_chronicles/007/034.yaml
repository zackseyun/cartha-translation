base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/034.yaml
  text: 'And the sons of Shemer: Ahi[a], Rohgah, Jehubbah[b], and Aram.'
translation:
  language: de
  text: 'Und die Söhne Schemers[a]: Ahi, Rohgah, Jehubbah[b] und Aram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In hebräischen Geschlechtsregistern kann „Söhne“ auch männliche Nachkommen oder Angehörige einer Sippe bezeichnen, nicht nur unmittelbare Söhne.
    reason: cultural_note
  - marker: b
    text: Die Umschrift dieses hebräischen Namens variiert; neben „Jehubbah“ findet sich auch „Hubba“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Und die Söhne
  rationale: Der Konstruktplural von בֵּן mit vorangestellter Konjunktion wird in einer Geschlechtsliste natürlich und quellennah mit „Und die Söhne“ wiedergegeben; dabei kann der hebräische Ausdruck auch männliche Nachkommen oder Sippenangehörige bezeichnen.
- source_word: שָׁמֶר
  choice: Schemer
  rationale: Der Personenname wird nach gängiger deutscher Bibeltransliteration wiedergegeben.
- source_word: אֲחִי
  choice: Ahi
  rationale: In der Namensliste ist die Form als Personenname zu verstehen und wird transliteriert, nicht als gewöhnliches Wort für eine Verwandtschaftsbeziehung übersetzt.
- source_word: ו/רוהגה
  choice: Rohga
  rationale: Der Personenname wird in einer für das Deutsche natürlichen, dem hebräischen Konsonantenbestand nahen Form transliteriert; die vorangestellte Konjunktion wird durch die deutsche Aufzählungsstruktur ausgedrückt.
- source_word: יחבה
  choice: Jehubbah
  rationale: Die Transliteration bewahrt den anlautenden Jod-Laut und folgt einer erkennbaren traditionellen Namensform; aufgrund der ungewöhnlichen Überlieferungsform sind auch andere Wiedergaben möglich.
- source_word: וַ/אֲרָם
  choice: und Aram
  rationale: Der Personenname אֲרָם wird direkt als „Aram“ transliteriert; die Konjunktion markiert das letzte Glied der Aufzählung.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Standarddeutsch im Stil einer genealogischen Aufzählung. Die Eigennamen werden transliteriert; echte Unsicherheiten bei Reichweite und Namensform werden in Fußnoten offengehalten.
