  text: וַ/אֲחֹת֖/וֹ הַ/מֹּלֶ֑כֶת יָלְדָה֙ אֶת אִישְׁה֔וֹד וְ/אֶת אֲבִיעֶ֖זֶר וְ/אֶת מַחְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/018.yaml
  text: His sister Hammoleketh bore Ishhod[a], Abiezer, and Mahlah.
translation:
  language: de
  text: Seine Schwester Hammolechet[a] gebar Ischhod, Abiëser und Machla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Hammolechet; möglicherweise auch „Molechet“. Der Name ist seiner Form nach mit einem Wort verwandt, das „Königin“ oder „Herrscherin“ bedeutet; hier ist er jedoch am besten als Personenname zu verstehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֹתוֹ
  choice: Seine Schwester
  rationale: Das Waw verbindet die Notiz mit dem vorangehenden Stammbaum, muss im Deutschen aber nicht eigens mit „und“ wiedergegeben werden. אֲחֹתוֹ bedeutet eindeutig „seine Schwester“.
- source_word: הַמֹּלֶכֶת
  choice: Hammolechet
  rationale: Im genealogischen Zusammenhang ist die Form am besten als Personenname zu verstehen. „Hammolechet“ bildet auch den anlautenden hebräischen Artikel als Bestandteil der Namensform ab.
- source_word: יָלְדָה
  choice: gebar
  rationale: Die feminine Verbform bezeichnet ausdrücklich die Frau als Mutter. „Gebar“ ist in einem Stammbaum knapp, würdig und eindeutig.
- source_word: אֵת
  choice: nicht eigens wiedergegeben
  rationale: Die Partikel kennzeichnet im Hebräischen das bestimmte direkte Objekt und hat im Deutschen keine eigene Entsprechung.
- source_word: אִישְׁהוֹד
  choice: Ischhod
  rationale: Der Personenname wird nach deutscher Lautkonvention aus dem Hebräischen übertragen.
- source_word: אֲבִיעֶזֶר
  choice: Abiëser
  rationale: Der Personenname wird in einer im Deutschen verständlichen Transliteration wiedergegeben; das Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: מַחְלָה
  choice: Machla
  rationale: Der Personenname wird direkt und nach deutscher Lautkonvention transliteriert.
theological_decisions: []
