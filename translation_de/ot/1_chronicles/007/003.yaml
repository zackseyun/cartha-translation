base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/003.yaml
  text: 'And the sons of Uzzi: Izrahiah. And the sons of Izrahiah: Michael[a], Obadiah, Joel, and Isshiah—five, all of them heads.'
translation:
  language: de
  text: 'Und die Söhne Ussis: Jisrachja. Und die Söhne Jisrachjas: Michael, Obadja, Joël und Jischija – fünf, allesamt Oberhäupter.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fünf Häupter, sie alle“. Nach Jisrachja werden nur vier Söhne genannt; der Text erklärt die Zahl fünf nicht ausdrücklich. „Häupter“ kann auch „führende Männer“ oder „Familienoberhäupter“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Die Konstruktverbindung בְּנֵי bezeichnet in der genealogischen Formel die „Söhne“ beziehungsweise Nachkommen; das vorangestellte ו wird zur Wahrung des Listenfortgangs mit „Und“ wiedergegeben.
- source_word: עֻזִּי
  choice: Ussi
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren, dem hebräischen Konsonantenbestand entsprechenden Form wiedergegeben.
- source_word: יִזְרַחְיָה
  choice: Jisrachja
  rationale: Der Personenname wird an beiden Stellen einheitlich und nach geläufiger deutscher Umschrift wiedergegeben.
- source_word: מִיכָאֵל
  choice: Michael
  rationale: Verwendet wird die im Deutschen etablierte Namensform.
- source_word: עֹבַדְיָה
  choice: Obadja
  rationale: Der Personenname wird in der geläufigen deutschen Bibelnamensform wiedergegeben.
- source_word: יוֹאֵל
  choice: Joël
  rationale: Die Trema-Schreibung zeigt im Deutschen an, dass die Vokale getrennt gesprochen werden, und entspricht einer gebräuchlichen Namensform.
- source_word: יִשִּׁיָּה
  choice: Jischija
  rationale: Die Umschrift bildet den hebräischen Namen lesbar ab, ohne ihn zu deuten oder zu übersetzen.
- source_word: חֲמִשָּׁה
  choice: insgesamt fünf
  rationale: Die Kardinalzahl wird direkt wiedergegeben; „insgesamt“ macht im Deutschen verständlich, dass Jisrachja zusammen mit den vier anschließend genannten Söhnen gezählt wird.
- source_word: רָאשִׁים
  choice: Oberhäupter
  rationale: רָאשִׁים bedeutet wörtlich „Häupter“ und bezeichnet hier führende Personen innerhalb genealogischer Verbände. „Oberhäupter“ wahrt das Bild und ist idiomatisches Deutsch.
- source_word: כֻּלָּם
  choice: allesamt
  rationale: Das zusammenfassende und nachdrückliche כֻּלָּם wird knapp und natürlich mit „allesamt“ wiedergegeben.
