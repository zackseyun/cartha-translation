translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper genealogischer Satzstruktur. Die wiederholte Formel „Und die Söhne …“ bleibt erhalten. Der Gedankenstrich kennzeichnet die zusammenfassende Angabe, ohne die Spannung zwischen den vier aufgezählten Söhnen und der Gesamtzahl fünf zu verdecken.
