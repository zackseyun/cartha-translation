source:
  edition: WLC
  text: וּ/מָכִ֞יר לָקַ֤ח אִשָּׁה֙ לְ/חֻפִּ֣ים וּ/לְ/שֻׁפִּ֔ים וְ/שֵׁ֤ם אֲחֹת/וֹ֙ מַעֲכָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖י צְלָפְחָ֑ד וַ/תִּהְיֶ֥נָה לִ/צְלָפְחָ֖ד בָּנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/015.yaml
  text: Machir took a wife for Huppim and for Shuppim. The name of his sister was Maacah[a], and the name of the second was Zelophehad; and Zelophehad had daughters.
translation:
  language: de
  text: Machir nahm für Huppim und für Schuppim eine Frau. Seine Schwester hieß Maacha, und der Name des Zweiten war Zelofhad[a]. Zelofhad hatte Töchter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und der zweite Sohn hieß Zelofhad.“ Im Hebräischen steht nur „der Zweite“; worauf sich dies bezieht, bleibt unausgesprochen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח אִשָּׁה
  choice: nahm … eine Frau
  rationale: Die hebräische Wendung bezeichnet gewöhnlich das Nehmen einer Frau zur Ehe. Wegen der folgenden Angaben mit לְ wird die ungewöhnliche Konstruktion bewahrt, statt Machir selbst als Ehemann darzustellen.
- source_word: לְחֻפִּים וּלְשֻׁפִּים
  choice: für Huppim und für Schuppim
  rationale: Das wiederholte לְ wird durch das wiederholte „für“ wiedergegeben. So bleibt die ungewöhnliche und möglicherweise verkürzte genealogische Aussage sichtbar.
- source_word: וְשֵׁם אֲחֹתוֹ מַעֲכָה
  choice: Seine Schwester hieß Maacha
  rationale: Natürliche deutsche Wiedergabe der Namensformel; das Pronomen bleibt wie im Hebräischen stehen und wird nicht durch einen ausdrücklich genannten Bezugsträger ersetzt.
- source_word: וְשֵׁם הַשֵּׁנִי צְלָפְחָד
  choice: und der Name des Zweiten war Zelofhad
  rationale: הַשֵּׁנִי bedeutet wörtlich „der Zweite“; da der Bezug im Hebräischen nicht ausdrücklich genannt wird, ergänzt der Haupttext weder „Sohn“ noch eine andere genealogische Bezeichnung.
- source_word: וַתִּהְיֶנָה לִצְלָפְחָד בָּנוֹת
  choice: Zelofhad hatte Töchter
  rationale: Idiomatiche deutsche Wiedergabe der hebräischen Besitzkonstruktion; die genealogisch wichtige Aussage über die Töchter bleibt unverändert.
theological_decisions:
- issue: Genealogische Mehrdeutigkeit bei הַשֵּׁנִי („der Zweite“)
  choice: Die verkürzte Formulierung „der Zweite“ bleibt im Haupttext erhalten.
  alternative: „der zweite Sohn“ oder „der andere“
  rationale: Der hebräische Text nennt den Bezug nicht ausdrücklich. Eine Ergänzung wie „Sohn“ würde die unklare Genealogie stärker festlegen, als es der Wortlaut erlaubt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem genealogischem Ton. Die ungewöhnliche Syntax und die echte Unklarheit des hebräischen Textes werden nicht stillschweigend geglättet.
