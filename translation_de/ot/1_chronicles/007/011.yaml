source:
  edition: WLC
  text: כָּל אֵ֜לֶּה בְּנֵ֤י יְדִֽיעֲאֵל֙ לְ/רָאשֵׁ֣י הָ/אָב֔וֹת גִּבּוֹרֵ֖י חֲיָלִ֑ים שִׁבְעָֽה עָשָׂ֥ר אֶ֨לֶף֙ וּ/מָאתַ֔יִם יֹצְאֵ֥י צָבָ֖א לַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/011.yaml
  text: All these were sons of Jediael[a], according to the heads of the fathers’ houses, mighty men of valor, seventeen thousand two hundred[d][c][b], able to go out in the army for war.
translation:
  language: de
  text: 'Alle diese waren Söhne Jediaëls[a], nach den Häuptern der Vaterhäuser[b]: tapfere Krieger, 17.200 Mann, die zum Kriegsdienst ausrücken konnten[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Söhne“ kann in genealogischen Listen auch „Nachkommen“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Häupter der Vaterhäuser“; gemeint sind die Leiter väterlich bestimmter Familien- oder Sippenverbände.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „die zum Heer für den Krieg Ausziehenden“; die Wendung kann Männer bezeichnen, die für den Kriegsdienst verfügbar waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Alle diese
  rationale: Die knappe hebräische Zusammenfassung bleibt erhalten, ohne ein nicht ausdrücklich genanntes Substantiv einzufügen.
- source_word: בְּנֵי יְדִיעֲאֵל
  choice: Söhne Jediaëls
  rationale: בְּנֵי bedeutet wörtlich „Söhne“, kann in genealogischen Zusammenhängen jedoch auch weiter gefasst „Nachkommen“ bezeichnen; diese Möglichkeit wird in einer Fußnote offengehalten.
- source_word: לְרָאשֵׁי הָאָבוֹת
  choice: nach den Oberhäuptern ihrer Großfamilien
  rationale: Die Wendung bezeichnet die leitenden Männer der väterlichen Familien- beziehungsweise Sippenverbände. „Großfamilien“ ist im heutigen Deutsch verständlicher als das traditionelle „Vaterhäuser“, während „nach“ die Zuordnung des לְ bewahrt.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: tapfere Krieger
  rationale: Die Verbindung bezeichnet kraftvolle, tüchtige beziehungsweise bewährte Männer und hat hier durch die anschließende Heeresangabe klar militärischen Bezug.
- source_word: שִׁבְעָה עָשָׂר אֶלֶף וּמָאתַיִם
  choice: 17.200 Mann
  rationale: Die genaue Musterungszahl wird in geläufiger deutscher Zahlenschreibung wiedergegeben; „Mann“ verdeutlicht natürlich, was gezählt wird.
- source_word: יֹצְאֵי צָבָא לַמִּלְחָמָה
  choice: die zum Kriegsdienst ausrücken konnten
  rationale: Wörtlich handelt es sich um „zum Heer für den Krieg Ausziehende“. Im Zusammenhang einer Aufstellung bezeichnet die Wendung Männer, die für den militärischen Einsatz verfügbar beziehungsweise dazu befähigt waren.
