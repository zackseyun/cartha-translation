  text: וַ/יִּתְאַבֵּ֛ל אֶפְרַ֥יִם אֲבִי/הֶ֖ם יָמִ֣ים רַבִּ֑ים וַ/יָּבֹ֥אוּ אֶחָ֖י/ו לְ/נַחֲמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/022.yaml
  text: And Ephraim their father mourned for many days[a], and his brothers came to comfort him.
translation:
  language: de
  text: Ihr Vater Ephraim trauerte viele Tage lang. Seine Brüder kamen, um ihn zu trösten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: um ihm Trost zuzusprechen.'
    reason: lexikalische Alternative zu לְנַחֲמוֹ
lexical_decisions:
- source_word: וַיִּתְאַבֵּל
  choice: trauerte
  rationale: Das Hitpael von אבל bezeichnet hier die Trauer als Reaktion auf einen Todesfall. „trauerte“ ist im Deutschen natürlich und gibt den Zusammenhang präzise wieder.
- source_word: אֶפְרַיִם אֲבִיהֶם
  choice: Ihr Vater Ephraim
  rationale: Die deutsche Wortstellung gibt die Apposition und den Bezug des Suffixes der 3. Person Plural klar und idiomatisch wieder.
- source_word: יָמִים רַבִּים
  choice: viele Tage lang
  rationale: Die Wendung bezeichnet eine längere Zeitdauer; „viele Tage lang“ ist die natürliche deutsche Entsprechung.
- source_word: וַיָּבֹאוּ
  choice: kamen
  rationale: בוא bezeichnet in diesem Erzählzusammenhang das Herankommen der Brüder an Ephraim.
- source_word: אֶחָיו
  choice: seine Brüder
  rationale: אָח bezeichnet primär einen Bruder. Ein weiterer Sinn wie „Verwandte“ ist möglich, wird durch den unmittelbaren Kontext aber nicht erfordert.
- source_word: לְנַחֲמוֹ
  choice: um ihn zu trösten
  rationale: Das Piel von נחם bezeichnet hier das Trösten eines Trauernden. Die finale Konstruktion mit לְ wird natürlich mit „um … zu“ wiedergegeben.
theological_decisions: []
