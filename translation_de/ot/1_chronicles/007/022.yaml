  source_fidelity: 'Der Text gibt die hebräische Satzfolge und die wesentlichen Bedeutungen zuverlässig wieder: Ephraim wird als Vater der zuvor genannten Personen bezeichnet, seine Trauer dauert viele Tage, und seine Brüder kommen mit dem Zweck, ihn zu trösten. Die finale Wiedergabe „um ihn zu trösten“ entspricht לְנַחֲמוֹ unmittelbar.'
