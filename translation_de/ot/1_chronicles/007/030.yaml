base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/030.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah, and Serah their sister.'
translation:
  language: de
  text: 'Die Söhne Aschers: Jimna, Jischwa, Jischwi und Beria sowie Serach, ihre Schwester.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der Konstruktplural bezeichnet hier angesichts der unmittelbar folgenden Namen die Söhne Aschers, nicht allgemein seine Nachkommen.
- source_word: אָשֵׁר
  choice: Ascher
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Namensform wird beibehalten.
- source_word: יִמְנָה
  choice: Jimna
  rationale: Die Form gibt die masoretische Aussprache in einer geläufigen deutschen Transliteration wieder.
- source_word: יִשְׁוָה
  choice: Jischwa
  rationale: Die Transliteration folgt der masoretischen Vokalisierung und bildet den hebräischen Namen unterscheidbar ab.
- source_word: יִשְׁוִי
  choice: Jischwi
  rationale: Die Transliteration folgt der masoretischen Vokalisierung des Namens.
- source_word: בְרִיעָה
  choice: Beria
  rationale: Geläufige deutsche Wiedergabe des hebräischen Eigennamens.
- source_word: שֶׂרַח
  choice: Serach
  rationale: Die Transliteration bewahrt den hebräischen Namen und unterscheidet ihn von Sara.
- source_word: אֲחוֹתָם
  choice: ihre Schwester
  rationale: Das Suffix steht in der 3. Person maskulin Plural und bezieht Serach als Schwester auf die zuvor genannten Brüder gemeinsam.
theological_decisions: []
translation_notes:
  register: Natürliche, würdevolle genealogische Prosa in modernem Standarddeutsch. Der Doppelpunkt des Hebräischen wird als vollständiger deutscher Satz mit Kopulaverb wiedergegeben; das Semikolon macht Serachs gesonderte Nennung klar, ohne den Inhalt zu erweitern.
