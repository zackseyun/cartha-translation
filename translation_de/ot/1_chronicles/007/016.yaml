source:
  edition: WLC
  text: וַ/תֵּ֨לֶד מַעֲכָ֤ה אֵֽשֶׁת מָכִיר֙ בֵּ֔ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ פֶּ֔רֶשׁ וְ/שֵׁ֥ם אָחִ֖י/ו שָׁ֑רֶשׁ וּ/בָנָ֖י/ו אוּלָ֥ם וָ/רָֽקֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/016.yaml
  text: Maacah the wife of Machir bore a son[a], and she called his name Peresh; and the name of his brother was Sheresh[b], and his sons were Ulam and Rakem.
translation:
  language: de
  text: Maacha, die Frau Machirs, gebar einen Sohn und nannte ihn Peresch. Sein Bruder hieß Scheresch, und seine Söhne waren Ulam und Rekem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wessen Söhne Ulam und Rekem waren, ist im Hebräischen nicht eindeutig; gemeint sein können Peresch oder Scheresch.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: gebar
  rationale: Das Verb ילד bezeichnet hier in einer genealogischen Notiz die Geburt; „gebar“ ist knapp, natürlich und dem Stil des Ausgangstextes angemessen.
- source_word: אֵשֶׁת מָכִיר
  choice: die Frau Machirs
  rationale: Die Constructusverbindung bezeichnet Maacha als Machirs Ehefrau. Die gewählte Form ist im Deutschen klar und bewahrt den genealogischen Stil.
- source_word: בֵּן
  choice: einen Sohn
  rationale: Der maskuline Singular bezeichnet hier ausdrücklich einen Sohn, der anschließend seinen Namen erhält.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: und nannte ihn
  rationale: Die hebräische Wendung lautet wörtlich „und sie rief seinen Namen“; „nannte ihn“ gibt diese Namensgebung in natürlichem modernem Deutsch wieder.
- source_word: פֶּרֶשׁ
  choice: Peresch
  rationale: Der Personenname wird nach gängiger deutscher Wiedergabe transliteriert.
- source_word: וְשֵׁם אָחִיו שָׁרֶשׁ
  choice: Sein Bruder hieß Scheresch
  rationale: 'Die hebräische Nominalwendung „und der Name seines Bruders: Scheresch“ wird idiomatisch und zugleich knapp wiedergegeben.'
- source_word: וּבָנָיו
  choice: und seine Söhne waren
  rationale: בנים bezeichnet in dieser genealogischen Angabe männliche Nachkommen. Das Possessivpronomen bleibt wie im Hebräischen hinsichtlich seines Bezugs formal mehrdeutig.
- source_word: אוּלָם וָרָקֶם
  choice: Ulam und Rekem
  rationale: Die Personennamen werden transliteriert; die verbindende Konjunktion wird als „und“ wiedergegeben.
