  text: וַ/יֵּרְד֡וּ שְֽׁלוֹשָׁה֩ מִן הַ/שְּׁלוֹשִׁ֨ים רֹ֤אשׁ עַל הַ/צֻּר֙ אֶל דָּוִ֔יד אֶל מְעָרַ֖ת עֲדֻלָּ֑ם וּ/מַחֲנֵ֣ה פְלִשְׁתִּ֔ים חֹנָ֖ה בְּ/עֵ֥מֶק רְפָאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/015.yaml
  text: Then three of the thirty chiefs went down to the rock[a], to David, at the cave of Adullam, while the camp of the Philistines was encamped in the Valley of Rephaim.
translation:
  language: de
  text: Da stiegen drei von den dreißig Anführern zum Felsen hinab, zu David, zur Höhle von Adullam, während das Lager der Philister im Tal Refaïm lagerte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Formulierung ist räumlich gedrängt. „Zum Felsen“ kann auch „auf den Felsen“ bedeuten; das genaue Verhältnis zwischen dem Felsen, David und der Höhle von Adullam bleibt offen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: kamen … hinab
  rationale: Die narrative Verbform von ירד bezeichnet eine Abwärtsbewegung. „Kamen … hinab“ gibt zugleich die Bewegung und die Ausrichtung auf David natürlich wieder.
- source_word: שְׁלוֹשָׁה מִן־הַשְּׁלוֹשִׁים רֹאשׁ
  choice: drei von den dreißig Anführern
  rationale: רֹאשׁ kennzeichnet die Männer hier als führende Angehörige der bekannten Dreißig, ohne ein bestimmtes militärisches Amt festzulegen.
- source_word: עַל־הַצּוּר
  choice: an den Felsen
  rationale: עַל kann in Verbindung mit einem Bewegungsverb eine Bewegung an, auf oder zu einem Ort ausdrücken. „An den Felsen“ bewahrt den konkreten topografischen Bezug, ohne die komprimierte Syntax übermäßig festzulegen.
- source_word: אֶל־דָּוִיד אֶל־מְעָרַת עֲדֻלָּם
  choice: zu David … bei der Höhle von Adullam
  rationale: Das erste אֶל bezeichnet das Ziel der Bewegung. Die zweite Wendung wird locativ verstanden und bezeichnet Davids Aufenthaltsort; so bleibt der Sinn in natürlichem Deutsch klar.
- source_word: וּמַחֲנֵה פְלִשְׁתִּים חֹנָה
  choice: während das Heer der Philister … lagerte
  rationale: Die Konstruktion liefert den begleitenden Hintergrund. מַחֲנֶה kann das Lager oder die dort versammelte Streitmacht bezeichnen; „Heer“ verbindet sich im Deutschen natürlich mit „lagerte“.
- source_word: בְּעֵמֶק רְפָאִים
  choice: im Tal Refaïm
  rationale: Der geografische Name wird transliteriert; der Trema macht die getrennte Aussprache der Vokale sichtbar.
