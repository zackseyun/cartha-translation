    rationale: „Auf den Felsen hinabsteigen“ ist im Deutschen ohne weiteren Kontext unnatürlich und kann eine nicht erforderliche Bewegungsrichtung suggerieren. Die Anmerkung sollte stattdessen die mögliche Wiedergabe von עַל als „auf“ benennen und die syntaktische Offenheit erklären.
  - severity: low
    issue: „Heer“ ist für מַחֲנֶה enger als erforderlich.
    rationale: מַחֲנֶה bezeichnet primär ein Lager, kann aber kollektiv die darin befindliche Streitmacht meinen. „Lager“ bewahrt die Grundbedeutung und passt zu „lagerte“.
