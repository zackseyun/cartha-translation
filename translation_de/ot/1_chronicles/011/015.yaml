    issue: Die Hauptfassung verbindet Felsen und Höhle zu einer bestimmten Ortsangabe für David.
    rationale: Die Folge „an den Felsen bei der Höhle von Adullam“ macht den Felsen zum Ort bei der Höhle und David zu dessen eindeutigem Bezugspunkt. Die hebräische Abfolge עַל־הַצּוּר אֶל־דָּוִד אֶל־מְעָרַת עֲדֻלָּם ist syntaktisch komprimiert; das genaue räumliche Verhältnis sollte nicht weiter festgelegt werden.
