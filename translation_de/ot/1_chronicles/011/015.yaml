  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente wieder: drei Angehörige der Dreißig, ihre Abwärtsbewegung, den Felsen, David, die Höhle von Adullam sowie das Lager der Philister im Tal Refaïm. Die räumlich gedrängte hebräische Reihung wird jedoch in der Hauptfassung zu stark geglättet: „zu David an den Felsen bei der Höhle“ legt ein genaueres räumliches Verhältnis fest, als der Text eindeutig hergibt.'
  naturalness: „Kamen … hinab“ ist möglich, aber „stiegen … hinab“ bildet die ausdrückliche Abwärtsbewegung klarer ab. Die reihende Zielformulierung bleibt leicht markiert, ist hier aber angesichts der quellsprachlichen Kompaktheit und der erhaltenen Mehrdeutigkeit vertretbar. „Das Heer der Philister lagerte“ ist natürliches modernes Standarddeutsch.
  terminology: „Anführer“ ist eine angemessene, nicht überpräzisierende Wiedergabe von רֹאשׁ. „Tal Refaïm“ ist als geographische Bezeichnung passend. „Lager der Philister“ ist näher an מַחֲנֶה als „Heer“ und vermeidet eine unnötige Bedeutungsfestlegung.
  issues:
