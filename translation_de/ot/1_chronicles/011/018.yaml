  text: וַ/יִּבְקְע֨וּ הַ/שְּׁלֹשָׁ֜ה בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בּ֤וֹר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑יד וְ/לֹֽא אָבָ֤ה דָוִיד֙ לִ/שְׁתּוֹתָ֔/ם וַ/יְנַסֵּ֥ךְ אֹתָ֖/ם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/018.yaml
  text: So the three broke through into the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But David was not willing to drink it; instead, he poured it out to Yahweh.
translation:
  language: de
  text: Da brachen die drei in das Lager der Philister durch, schöpften Wasser aus dem Brunnen von Bethlehem am Tor, nahmen es mit und brachten es zu David. David aber wollte es nicht trinken, sondern goss es Jahwe aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ausdrücklicher: „Er goss es Jahwe als Trankopfer aus.“ Das hebräische Verb kann das kultische Ausgießen einer Opfergabe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: brachen … durch
  rationale: Im militärischen Zusammenhang bezeichnet das Verb das gewaltsame Durchbrechen feindlicher Linien; die deutsche Wendung ist natürlich und bewahrt die Kraft der Handlung.
- source_word: הַשְּׁלֹשָׁה
  choice: die drei
  rationale: Der hebräische Text sagt hier nur „die drei“; ihre Identität ergibt sich aus dem Zusammenhang, daher wird keine ergänzende Bezeichnung wie „Helden“ eingefügt.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: in das Lager der Philister
  rationale: Zusammen mit „durchbrechen“ drückt die Präposition hier die Bewegung in die feindliche Stellung hinein aus.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: schöpften Wasser
  rationale: „Wasser schöpfen“ ist die übliche und anschauliche deutsche Entsprechung für שׁאב.
- source_word: מִבּוֹר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: aus dem Brunnen von Bethlehem am Tor
  rationale: בּוֹר kann Grube, Zisterne oder Brunnen bezeichnen. Da Trinkwasser geschöpft wird, ist „Brunnen“ hier die natürliche Wahl; „am Tor“ gibt die Ortsangabe knapp wieder.
- source_word: וַיִּשְׂאוּ
  choice: nahmen es mit
  rationale: Im Handlungsablauf bezeichnet das Verb das Aufnehmen und Transportieren des Wassers; „nahmen es mit“ klingt im modernen Deutsch natürlicher als „trugen es“ und vermeidet eine unnötige Wiederholung mit „brachten“.
- source_word: וַיָּבִיאוּ אֶל דָּוִיד
  choice: brachten es zu David
  rationale: Die einfache deutsche Wiedergabe folgt dem Erzählablauf; ein „zurück“ ist zwar aus dem Kontext erschließbar, steht aber nicht ausdrücklich im Hebräischen.
- source_word: וְלֹא אָבָה דָוִיד לִשְׁתּוֹתָם
  choice: David aber wollte es nicht trinken
  rationale: אָבָה bezeichnet Wollen oder Einwilligen. Das hebräische Pluralsuffix bezieht sich auf „Wasser“, das im Deutschen idiomatisch mit dem Singularpronomen „es“ aufgenommen wird.
- source_word: וַיְנַסֵּךְ אֹתָם לַיהוָה
  choice: sondern goss es für Jahwe aus
  rationale: נסך bezeichnet das Ausgießen und kann kultisch ein Trankopfer meinen. Der Haupttext bewahrt die sichtbare Handlung; die kultische Bedeutung wird in der Fußnote kenntlich gemacht. „Für“ drückt die Ausrichtung der Handlung auf Jahwe idiomatisch aus.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Kultische Bedeutung des Ausgießens
  choice: Die konkrete Handlung im Haupttext mit „goss es für Jahwe aus“ wiedergeben und die mögliche Trankopferbedeutung in einer Fußnote erläutern.
  alternative: „Er goss es Jahwe als Trankopfer aus.“
  rationale: Das hebräische Verb trägt kultische beziehungsweise opfersprachliche Bedeutung, beschreibt zugleich aber unmittelbar das Ausgießen. Die gewählte Lösung bewahrt sowohl die Anschaulichkeit als auch die theologische Dimension, ohne die Mehrdeutigkeit vorschnell aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geradlinigem Erzählfluss. Die knappe Bezeichnung „die drei“ bleibt wie im Ausgangstext stehen. Der Gottesname wird als „Jahwe“ wiedergegeben. Der Fußnotenmarker [a] steht unmittelbar nach der betreffenden Aussage.
