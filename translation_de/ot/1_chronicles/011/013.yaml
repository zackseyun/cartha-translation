source:
  edition: WLC
  text: הֽוּא הָיָ֨ה עִם דָּוִ֜יד בַּ/פַּ֣ס דַּמִּ֗ים וְ/הַ/פְּלִשְׁתִּים֙ נֶאֱסְפוּ שָׁ֣ם לַ/מִּלְחָמָ֔ה וַ/תְּהִ֛י חֶלְקַ֥ת הַ/שָּׂדֶ֖ה מְלֵאָ֣ה שְׂעוֹרִ֑ים וְ/הָ/עָ֥ם נָ֖סוּ מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/013.yaml
  text: He was with David at Pas-dammim[a], where the Philistines had gathered for battle. Now the plot of the field was full of barley[b], and the people fled from before the Philistines.
translation:
  language: de
  text: Er war mit David bei Pas-Dammim[a], wo sich die Philister zum Kampf versammelt hatten. Dort lag ein Ackerstück, das voller Gerste war, und das Volk floh vor den Philistern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pas-Dammim ist ein Ortsname. Vergleiche den Parallelbericht in 1. Samuel 17,1, wo der Ort Efes-Dammim genannt wird.
    reason: cross_reference
lexical_decisions:
- source_word: בַּפַּס דַּמִּים
  choice: bei Pas-Dammim
  rationale: Der Ausdruck wird als Ortsname verstanden und daher transliteriert; die Präposition wird bei einem Ort im Deutschen natürlich mit „bei“ wiedergegeben.
- source_word: נֶאֱסְפוּ
  choice: sich versammelt hatten
  rationale: Der Niphal von אסף bezeichnet hier das Zusammenkommen beziehungsweise Sammeln zum Kampf. Das Plusquamperfekt ordnet das Geschehen natürlich zum vorausgehenden Aufenthalt Davids ein.
- source_word: לַמִּלְחָמָה
  choice: zum Kampf
  rationale: Im Kontext einer konkreten militärischen Auseinandersetzung ist „Kampf“ natürlicher und genauer als das allgemeinere „Krieg“.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: ein Ackerstück
  rationale: חלקה bezeichnet ein abgegrenztes Stück Land; zusammen mit שדה ist „Ackerstück“ eine knappe, konkrete und natürliche Wiedergabe.
- source_word: מְלֵאָה שְׂעוֹרִים
  choice: voller Gerste war
  rationale: Die Getreideart Gerste wird ausdrücklich genannt und nicht zum allgemeineren „Getreide“ verflacht.
- source_word: וְהָעָם
  choice: das Volk
  rationale: עם wird ohne unnötige Verengung auf Soldaten oder Männer wiedergegeben, auch wenn im Zusammenhang wohl die israelitischen Kämpfer gemeint sind.
- source_word: נָסוּ מִפְּנֵי פְלִשְׁתִּים
  choice: floh vor den Philistern
  rationale: Die deutsche Wendung „vor jemandem fliehen“ entspricht dem hebräischen Idiom מִפְּנֵי und ist zugleich natürlich und präzise.
theological_decisions: []
