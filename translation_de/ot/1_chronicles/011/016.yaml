lexical_decisions:
- source_word: מְצוּדָה
  choice: Bergfeste
  rationale: Das Wort bezeichnet einen befestigten, gut zu verteidigenden Zufluchtsort. „Bergfeste“ ist im David-Kontext anschaulich und würdevoll; die allgemeinere Alternative „Festung“ wird in der Fußnote genannt.
- source_word: נְצִיב
  choice: Posten
  rationale: Im militärischen Zusammenhang bezeichnet das Wort hier am ehesten einen aufgestellten Besatzungsposten beziehungsweise eine dort stationierte Einheit. „Posten“ bewahrt zudem die mögliche Nuance des Standorts, ohne einen zivilen Amtsträger anzunehmen.
- source_word: פְּלִשְׁתִּים
  choice: Philister
  rationale: Dies ist die im Deutschen gebräuchliche Bezeichnung der Volksgruppe.
- source_word: בְּבֵית לָחֶם
  choice: in Bethlehem
  rationale: Die Präposition bezeichnet hier den Ort; „in Bethlehem“ ist die natürliche deutsche Wiedergabe.
- source_word: אָז ... אָז
  choice: damals ... damals
  rationale: Die Wiederholung des hebräischen Zeitadverbs wird im Haupttext beibehalten. „Damals“ klingt in einer rückblickenden Erzählung natürlicher als zweimaliges „dann“.
- source_word: וְדָוִיד
  choice: David
  rationale: Das einleitende Waw verbindet den Satz mit dem Kontext, verlangt im heutigen Deutsch aber nicht zwingend ein ausdrückliches „und“. Ein nicht im Hebräischen vorhandenes einleitendes „nun“ wird vermieden.
