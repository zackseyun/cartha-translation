base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/021.yaml
  text: He was more honored than the two among the three[a], and he became their commander; but he did not attain to the three.
translation:
  language: de
  text: Von den Dreien war er angesehener als die beiden anderen[a], und er wurde ihr Anführer; doch an die Drei reichte er nicht heran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mehr als die Drei wurde er von den Zweien geehrt.“ Der hebräische Wortlaut ist knapp und schwer zu deuten. Wahrscheinlich ist gemeint, dass er innerhalb einer Rangordnung hohes Ansehen genoss, den Rang der herausragenden „Drei“ jedoch nicht erreichte.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשָׁה בַשְּׁנַיִם
  choice: Unter den Dreien … als die beiden anderen
  rationale: Die hebräische Wendung ist stark verkürzt und syntaktisch schwierig. Die Übersetzung gibt die wahrscheinlichste vergleichende Bedeutung innerhalb einer Dreiergruppe wieder; „anderen“ ist zum natürlichen Verständnis im Deutschen ergänzt. Die alternative Zuordnung wird in der Fußnote bewahrt.
- source_word: נִכְבָּד
  choice: war … angesehener
  rationale: Das Nifal von כבד bezeichnet hier hohes Ansehen oder Ehre. Der Komparativ ergibt sich aus der Konstruktion mit מִן und wird im Deutschen ausdrücklich wiedergegeben.
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: und er wurde ihr Anführer
  rationale: שַׂר bezeichnet in diesem militärischen Zusammenhang einen Führer oder Befehlshaber. „Anführer“ ist würdig, verständlich und lässt die genaue militärische Rangstufe offen.
- source_word: וְעַד הַשְּׁלוֹשָׁה לֹא בָא
  choice: doch an die Drei reichte er nicht heran
  rationale: בוא mit עַד drückt hier bildlich das Erreichen eines Ranges oder Ansehens aus. „reichte … nicht heran“ gibt idiomatisch wieder, dass er den Rang der herausragenden Drei nicht erreichte.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Rangordnung bleibt verständlich, während die echte syntaktische Mehrdeutigkeit des Hebräischen in der Fußnote erhalten wird.
