  text: וַ/יֵּ֥לֶךְ דָּוִ֖יד הָל֣וֹךְ וְ/גָד֑וֹל וַ/יהוָ֥ה צְבָא֖וֹת עִמּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/009.yaml
  text: And David became greater and greater[a], and Yahweh of hosts was with him.
translation:
  language: de
  text: Und David wurde immer größer[a], und Jahwe der Heerscharen war mit ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich etwa: „David ging, gehend und groß werdend“; die Wendung besagt, dass er zunehmend groß bzw. bedeutend wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדוֹל
  choice: wurde immer mächtiger
  rationale: Die Verbindung aus finitem הלך, Infinitivus absolutus und גדול bezeichnet eine fortschreitende Zunahme. „Wurde immer mächtiger“ gibt diesen idiomatischen Verlauf natürlich wieder und passt zum königlichen Kontext.
- source_word: דָּוִיד
  choice: David
  rationale: Im Deutschen übliche Form des Personennamens.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den im Text stehenden Gottesnamen wieder; „der Heerscharen“ bewahrt das traditionelle und bildhafte Verständnis des festen Gottestitels צְבָאוֹת, ohne ihn zur Deutung „der Allmächtige“ aufzulösen.
- source_word: עִמּוֹ
  choice: mit ihm
  rationale: 'Die Präposition עִם mit Suffix bezeichnet hier Gegenwart und Beistand: „mit ihm“.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ lässt den persönlichen Bundesnamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Beziehung zwischen Davids Aufstieg und Jahwes Gegenwart
  choice: und
  alternative: denn/weil
  rationale: Das hebräische וַ verbindet die Aussagen, markiert aber nicht ausdrücklich ein Kausalverhältnis. Daher wird die theologische Spannung bewahrt und keine zusätzliche Begründung eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mächtiger“ ist im Zusammenhang mit Davids wachsender Stellung natürlicher als das missverständliche „größer“. Der traditionelle Ausdruck „Heerscharen“ bewahrt die Bildsprache des hebräischen Gottestitels.
