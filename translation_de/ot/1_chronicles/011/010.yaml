source:
  edition: WLC
  text: וְ/אֵ֨לֶּה רָאשֵׁ֤י הַ/גִּבּוֹרִים֙ אֲשֶׁ֣ר לְ/דָוִ֔יד הַ/מִּתְחַזְּקִ֨ים עִמּ֧/וֹ בְ/מַלְכוּת֛/וֹ עִם כָּל יִשְׂרָאֵ֖ל לְ/הַמְלִיכ֑/וֹ כִּ/דְבַ֥ר יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/010.yaml
  text: These were the chiefs of the mighty men who belonged to David[a], who strengthened themselves with him in his kingdom, together with all Israel, to make him king[b], according to the word of Yahweh concerning Israel.
translation:
  language: de
  text: Das sind die Anführer von Davids Helden, die ihm in seiner Königsherrschaft tatkräftig beistanden[a] und ihn gemeinsam mit ganz Israel zum König machten, wie es dem Wort Jahwes über Israel entsprach.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die sich mit ihm stark machten“. Das kann hier bedeuten, dass sie David bei seiner Königsherrschaft entschieden unterstützten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gemäß dem Wort Jahwes über Israel“.'
    reason: formal_rendering
lexical_decisions:
- source_word: רָאשֵׁי הַגִּבּוֹרִים
  choice: die Anführer von Davids Helden
  rationale: רָאשֵׁי bezeichnet die führenden Männer innerhalb der Gruppe; הַגִּבּוֹרִים meint hier Davids militärisch ausgezeichnete Männer. „Helden“ ist knapp, würdig und im Chronik-Kontext verständlich.
- source_word: אֲשֶׁר לְדָוִיד
  choice: von Davids Helden
  rationale: Die Verbindung mit לְדָוִיד kennzeichnet Zugehörigkeit beziehungsweise Zuordnung zu David. Die deutsche Genitivverbindung gibt dies natürlich wieder.
- source_word: הַמִּתְחַזְּקִים עִמּוֹ
  choice: die ihm … tatkräftig beistanden
  rationale: Die Hitpael-Form von חזק mit עִם kann wörtlich ein Sich-stark-Erweisen mit jemandem bezeichnen; im Zusammenhang der Thronbesteigung ist kräftige Unterstützung gemeint. Die Fußnote bewahrt die formnähere Möglichkeit.
- source_word: בְמַלְכוּתוֹ
  choice: bei der Festigung seiner Königsherrschaft
  rationale: מַלְכוּת kann Königsherrschaft, Königtum oder Reich bedeuten. Da der Vers von Davids Einsetzung zum König handelt, bringt „Königsherrschaft“ den politischen Vorgang deutlicher zum Ausdruck als das territorial missverständliche „Königreich“.
- source_word: עִם כָּל יִשְׂרָאֵל
  choice: gemeinsam mit ganz Israel
  rationale: עִם bezeichnet die gemeinsame Beteiligung der Helden und ganz Israels.
- source_word: לְהַמְלִיכוֹ
  choice: ihn … zum König machten
  rationale: Der Hifil von מלך bedeutet, jemanden zum König zu machen beziehungsweise als König einzusetzen.
- source_word: כִּדְבַר יְהוָה
  choice: wie es dem Wort Jahwes … entsprach
  rationale: Die Wendung bezeichnet die Übereinstimmung des Geschehens mit dem göttlichen Wort. „Wort“ bewahrt die formale Bezugnahme auf Jahwes Ausspruch, ohne es enger als „Verheißung“ festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: עַל kann bei דָּבָר „über, hinsichtlich, betreffend“ bedeuten. „Über Israel“ erhält die Präposition in natürlichem Deutsch und lässt den genauen Bezug offen.
theological_decisions:
- issue: Bedeutung von הַמִּתְחַזְּקִים עִמּוֹ
  choice: tatkräftige Unterstützung Davids bei der Festigung seiner Herrschaft
  alternative: Sie stärkten sich zusammen mit David beziehungsweise erwiesen sich mit ihm als stark.
  rationale: Der unmittelbare Zusammenhang nennt als Ziel, David zum König zu machen. Deshalb ist politische und militärische Unterstützung wahrscheinlich; die Fußnote hält die reflexive Ausdrucksweise des Hebräischen sichtbar.
- issue: Bedeutungsumfang von בְמַלְכוּתוֹ
  choice: Davids Königsherrschaft
  alternative: sein Königreich oder seine Regierungszeit
  rationale: Der Kontext betrifft die Begründung seiner Herrschaft. „Königsherrschaft“ vermeidet eine unnötige Festlegung auf Territorium oder Zeitdauer.
- issue: Bezug des Wortes Jahwes
  choice: Jahwes Wort über Israel
  alternative: Jahwes Wort für Israel oder Jahwes Wort hinsichtlich Davids Herrschaft über Israel
  rationale: Die Übersetzung wahrt die syntaktische Zuordnung von עַל יִשְׂרָאֵל zu דְבַר יְהוָה und legt den Inhalt des göttlichen Wortes nicht weiter aus.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die komplexe hebräische Partizipialkonstruktion wird in einen flüssigen deutschen Relativsatz überführt; zentrale Mehrdeutigkeiten werden in den Fußnoten offengehalten.
