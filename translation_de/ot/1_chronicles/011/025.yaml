  text: מִן הַ/שְּׁלוֹשִׁ֗ים הִנּ֤/וֹ נִכְבָּד֙ ה֔וּא וְ/אֶל הַ/שְּׁלוֹשָׁ֖ה לֹא בָ֑א וַ/יְשִׂימֵ֥/הוּ דָוִ֖יד עַל מִשְׁמַעְתּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/025.yaml
  text: Among the Thirty[a], he was indeed honored, but he did not attain to the Three[b]; and David appointed him over his bodyguard.
translation:
  language: de
  text: Unter den Dreißig war er hoch angesehen, doch an die Drei reichte er nicht heran.[a] David setzte ihn über seine Leibwache.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »doch zu den Drei kam er nicht«; gemeint ist, dass er ihren Rang nicht erreichte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »über seine Wache« beziehungsweise »über die ihm unterstellte Einheit«. Das hebräische Wort kann eine Wach- oder Befehlseinheit beziehungsweise einen übertragenen Verantwortungsbereich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשִׁים
  choice: Unter den Dreißig
  rationale: Die Präposition מִן wird im Zusammenhang mit der Gruppenbezeichnung partitiv verstanden. Die Formulierung bezeichnet seine Stellung innerhalb der Dreißig und bildet den Gegenpol zu den folgenden »Drei«.
- source_word: הִנּוֹ נִכְבָּד
  choice: war er hoch angesehen
  rationale: הִנּוֹ verstärkt die Aussage, während das Niphal נִכְבָּד hohes Ansehen beziehungsweise einen ehrenvollen Rang bezeichnet. »hoch angesehen« gibt beides in natürlichem Deutsch wieder.
- source_word: וְאֶל הַשְּׁלוֹשָׁה לֹא בָא
  choice: doch an die Drei reichte er nicht heran
  rationale: בוא mit אֶל bezeichnet hier idiomatisch das Erreichen einer Rangstufe, nicht eine räumliche Bewegung. »nicht heranreichen« bewahrt den Rangvergleich.
- source_word: הַשְּׁלוֹשָׁה
  choice: die Drei
  rationale: Die Bezeichnung meint die herausgehobene Dreiergruppe unter Davids Kriegern. Der bestimmte Gruppenname wird ohne den im Hebräischen nicht ausdrücklich vorhandenen Zusatz »obersten« wiedergegeben.
- source_word: וַיְשִׂימֵהוּ דָוִיד
  choice: David setzte ihn
  rationale: שׂים bezeichnet hier die Einsetzung in eine Leitungsfunktion. »setzte ihn über« ist würdig, verständlich und bleibt näher an der hebräischen Ausdrucksweise als eine stärker administrative Formulierung.
- source_word: עַל מִשְׁמַעְתּוֹ
  choice: über seine Leibwache
  rationale: מִשְׁמַעַת kann eine dem Befehl unterstehende Einheit, einen Wachdienst oder einen Verantwortungsbereich bezeichnen. Im militärischen Zusammenhang ist »Leibwache« plausibel, bleibt aber wegen der lexikalischen Breite mit einer Fußnote versehen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionellen Gruppenbezeichnungen »die Dreißig« und »die Drei« bleiben als erkennbare Titel erhalten. Der idiomatische Rangvergleich wird im Haupttext verständlich formuliert; die wörtliche Wendung und die Mehrdeutigkeit von מִשְׁמַעַת werden in den Fußnoten bewahrt.
