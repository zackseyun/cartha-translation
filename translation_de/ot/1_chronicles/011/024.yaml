  text: אֵ֣לֶּה עָשָׂ֔ה בְּנָיָ֖הוּ בֶּן יְהוֹיָדָ֑ע וְ/ל/וֹ שֵׁ֖ם בִּ/שְׁלוֹשָׁ֥ה הַ/גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/024.yaml
  text: These things Benaiah son of Jehoiada did[a], and he had a name among the three mighty men.
translation:
  language: de
  text: Diese Taten vollbrachte Benaja, der Sohn Jojadas, und er war unter den drei Helden berühmt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und er hatte unter den drei Helden einen Namen“, das heißt, er genoss unter ihnen Ansehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: Diese Taten vollbrachte
  rationale: Der Demonstrativ verweist zusammenfassend auf die zuvor erzählten Heldentaten. „Diese Taten vollbrachte“ gibt diesen Rückbezug in natürlichem, würdigem Deutsch wieder.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaja, der Sohn Jojadas
  rationale: Die im Deutschen gebräuchlichen biblischen Namensformen werden verwendet; die Konstruktverbindung wird klar als Vater-Sohn-Beziehung wiedergegeben.
- source_word: וְלוֹ שֵׁם
  choice: und er war … berühmt
  rationale: Die hebräische Besitzkonstruktion bedeutet wörtlich „und ihm war ein Name“ beziehungsweise „er hatte einen Namen“ und bezeichnet hier Ansehen oder Ruhm. Die gewählte Formulierung ist natürliches modernes Deutsch; der konkrete hebräische Ausdruck bleibt in der Fußnote sichtbar.
- source_word: בִּשְׁלוֹשָׁה הַגִּבֹּרִים
  choice: unter den drei Helden
  rationale: ב bezeichnet hier die Zuordnung oder Stellung innerhalb der Dreiergruppe. גִּבֹּרִים ist im Zusammenhang die Bezeichnung für Davids herausragende Kämpfer; „Helden“ bewahrt sowohl den militärischen als auch den ehrenden Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die hebräische Wendung „einen Namen haben“ wird im Haupttext sinngemäß wiedergegeben und in der Fußnote transparent gemacht.
