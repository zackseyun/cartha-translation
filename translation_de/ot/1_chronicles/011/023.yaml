translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Kampferzählung. Die alte Maßeinheit „Elle“ bleibt im Text erhalten; die ungewöhnliche hebräische Wendung und die ungefähre moderne Größenordnung werden in der Fußnote erläutert.
