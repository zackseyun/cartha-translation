  naturalness: Die vorgeschlagene Fassung ist modernes, würdiges Standarddeutsch. „Weberbaum“ ist als traditionelle und verständliche Bezeichnung für den Vergleich angemessen; die Satzführung bleibt klar.
  terminology: „Elle“, „Speer“, „Stock“, „entriss“ und „tötete“ sind passend. „Mann von außergewöhnlicher Größe“ gibt איש מדה idiomatisch wieder, während die Fußnote die wörtliche hebräische Formulierung dokumentiert. Die Fußnotenmarke wird an die Größenangabe gesetzt, auf die sie sich bezieht.
