  text: וְ/הֽוּא הִכָּה֩ אֶת הָ/אִ֨ישׁ הַ/מִּצְרִ֜י אִ֥ישׁ מִדָּ֣ה חָמֵ֣שׁ בָּ/אַמָּ֗ה וּ/בְ/יַ֨ד הַ/מִּצְרִ֤י חֲנִית֙ כִּ/מְנ֣וֹר אֹרְגִ֔ים וַ/יֵּ֥רֶד אֵלָ֖י/ו בַּ/שָּׁ֑בֶט וַ/יִּגְזֹ֤ל אֶֽת הַ/חֲנִית֙ מִ/יַּ֣ד הַ/מִּצְרִ֔י וַ/יַּהַרְגֵ֖/הוּ בַּ/חֲנִיתֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/023.yaml
  text: And he struck down the Egyptian[a], a man five cubits tall. In the Egyptian’s hand was a spear like a weaver’s beam, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[c][b], and killed him with his own spear.
translation:
  language: de
  text: Und er schlug den Ägypter nieder, einen Mann von außergewöhnlicher Größe, fünf Ellen groß.[a] Der Ägypter hielt einen Speer in der Hand, der einem Weberbaum glich. Und er ging mit einem Stock zu ihm hinab, entriss dem Ägypter den Speer und tötete ihn mit dessen eigenem Speer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen Mann von Maß, fünf Ellen“. Die Wendung bezeichnet einen Mann von außergewöhnlicher Größe. Eine Elle war ein antikes Längenmaß vom Ellenbogen bis zu den Fingerspitzen; fünf Ellen entsprechen je nach zugrunde gelegtem Maß ungefähr 2,25 bis 2,60 Metern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: erschlug
  rationale: נכה bezeichnet hier das gewaltsame Niederschlagen. „Erschlug“ bewahrt die Kampfhandlung; das ausdrückliche Töten wird mit וַיַּהַרְגֵהוּ anschließend nochmals benannt.
- source_word: הָאִישׁ הַמִּצְרִי
  choice: den Ägypter
  rationale: Im Deutschen bezeichnet „der Ägypter“ die Person natürlich und ohne die unnötige Wiederholung „Mann“.
- source_word: אִישׁ מִדָּה חָמֵשׁ בָּאַמָּה
  choice: einen Mann von fünf Ellen Körpergröße
  rationale: Die wörtliche Wendung „ein Mann von Maß“ bezeichnet hier ungewöhnliche Körpergröße; die folgende Angabe von fünf Ellen bestimmt diese näher.
- source_word: חֲנִית
  choice: Speer
  rationale: „Speer“ passt zur schweren Waffe und zu ihrem Vergleich mit einem Weberbaum.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: dessen Schaft wie ein Weberbaum war
  rationale: מְנוֹר bezeichnet hier den massiven Schaft beziehungsweise Balken eines Webgeräts. Die Formulierung macht deutlich, dass der Speerschaft verglichen wird.
- source_word: וַיֵּרֶד אֵלָיו
  choice: ging ... auf ihn zu
  rationale: Das wörtliche „ging zu ihm hinab“ kann eine räumliche Abwärtsbewegung ausdrücken; im Deutschen vermittelt „ging auf ihn zu“ die sichere narrative Aussage, ohne eine unbelegte Topografie aufzudrängen.
- source_word: בַּשָּׁבֶט
  choice: mit einem Stock
  rationale: שֵׁבֶט kann Stock, Stab, Rute oder Keule bezeichnen. „Stock“ bleibt im Kampfkontext konkret, ohne die Form der Waffe zu stark festzulegen.
- source_word: וַיִּגְזֹל
  choice: entriss
  rationale: Das Verb bezeichnet gewaltsames Wegnehmen; „entriss“ gibt die unmittelbare Kampfhandlung prägnant wieder.
- source_word: וַיַּהַרְגֵהוּ
  choice: tötete ihn
  rationale: הרג ist das ausdrückliche Tötungsverb und wird in modernem Deutsch klar mit „tötete“ wiedergegeben.
- source_word: בַּחֲנִיתוֹ
  choice: mit dessen eigenem Speer
  rationale: Das Suffix bezieht sich am natürlichsten auf den Ägypter, dem der Speer gerade entrissen wurde. „Dessen“ vermeidet im Deutschen eine mehrdeutige Zuordnung.
