  to: Und er schlug den Ägypter nieder, einen Mann von außergewöhnlicher Größe, fünf Ellen groß.[a] Der Ägypter hielt einen Speer in der Hand, der einem Weberbaum glich. Und er ging mit einem Stock zu ihm hinab, entriss dem Ägypter den Speer und tötete ihn mit dessen eigenem Speer.
