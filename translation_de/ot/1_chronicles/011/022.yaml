  text: בְּנָיָ֨ה בֶן יְהוֹיָדָ֧ע בֶּן אִֽישׁ חַ֛יִל רַב פְּעָלִ֖ים מִֽן קַבְצְאֵ֑ל ה֣וּא הִכָּ֗ה אֵ֣ת שְׁנֵ֤י אֲרִיאֵל֙ מוֹאָ֔ב וְ֠/הוּא יָרַ֞ד וְ/הִכָּ֧ה אֶֽת הָ/אֲרִ֛י בְּ/ת֥וֹךְ הַ/בּ֖וֹר בְּ/י֥וֹם הַ/שָּֽׁלֶג־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/022.yaml
  text: Benaiah son of Jehoiada[a], son of a mighty man, a man of many deeds, from Kabzeel—he struck down the two heroes of Moab. He also went down and struck down the lion in the midst of a pit on a snowy day.
translation:
  language: de
  text: Benaja, Sohn Jojadas, dessen Vater ein tapferer Mann aus Kabzeel war, der viele Taten vollbracht hatte, erschlug die beiden Helden Moabs[a]. Auch stieg er in eine Grube hinab und erschlug dort an einem verschneiten Tag einen Löwen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Bedeutung des hebräischen Ausdrucks אֲרִיאֵל מוֹאָב ist unsicher. Möglich sind auch: »die beiden Söhne Ariels aus Moab«, »die beiden Ariels Moabs« oder »die beiden löwengleichen Helden Moabs«.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ חַיִל
  choice: ein tapferer Mann
  rationale: Die Wendung bezeichnet hier im kriegerischen Zusammenhang einen durch Tapferkeit und Tüchtigkeit ausgezeichneten Mann.
- source_word: רַב פְּעָלִים
  choice: der viele Taten vollbracht hatte
  rationale: Die wörtliche Vorstellung »reich an Taten« wird in natürlichem Deutsch als Hinweis auf zahlreiche bemerkenswerte Taten wiedergegeben.
- source_word: מִן קַבְצְאֵל
  choice: aus Kabzeel
  rationale: מִן bezeichnet hier am natürlichsten die Herkunft.
- source_word: הִכָּה
  choice: erschlug
  rationale: נכה kann allgemein »schlagen« oder »niederschlagen« bedeuten; bei den kriegerischen Heldentaten und beim Löwen bezeichnet »erschlug« die wahrscheinlich gemeinte tödliche Handlung knapp und idiomatisch.
- source_word: שְׁנֵי אֲרִיאֵל מוֹאָב
  choice: die beiden Helden Moabs[a]
  rationale: אֲרִיאֵל ist an dieser Stelle unsicher. »Helden« gibt den wahrscheinlich bildhaften, mit dem Löwen verbundenen Sinn verständlich wieder, ohne die anderen möglichen Deutungen zu verschweigen; diese stehen in der Fußnote.
- source_word: יָרַד
  choice: stieg ... hinab
  rationale: Das Verb bezeichnet eine Abwärtsbewegung, hier offenbar in die Grube hinein.
- source_word: הָאֲרִי
  choice: einen Löwen
  rationale: Das Substantiv bezeichnet eindeutig einen Löwen; der bestimmte Artikel des Hebräischen wird im Deutschen bei der Neueinführung des Tieres idiomatisch unbestimmt wiedergegeben.
- source_word: בְּתוֹךְ הַבּוֹר
  choice: in eine Grube ... dort
  rationale: Die hebräische Wendung beschreibt den Ort innerhalb einer Grube. Die deutsche Satzführung verbindet das Hinabsteigen natürlich mit dem Ziel und nimmt den Ort durch »dort« wieder auf.
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: an einem verschneiten Tag
  rationale: Dies ist eine natürliche moderne Wiedergabe von »am Tag des Schnees« und bewahrt die ungewöhnliche Situationsangabe.
