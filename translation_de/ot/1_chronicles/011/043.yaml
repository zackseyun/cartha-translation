base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/043.yaml
  text: Hanan son of Maacah[a], and Joshaphat the Mithnite;
translation:
  language: de
  text: Hanan, der Sohn Maachas, und Joschafat[a], der Mitniter;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Name steht hier in der kürzeren Form Joschafat, nicht in der bekannteren längeren Form Jehoschafat.
    reason: Die Fußnote macht die im hebräischen Text erkennbare Namensform transparent.
lexical_decisions:
- source_word: חָנָן
  choice: Hanan
  rationale: Der Personenname wird in einer im Deutschen geläufigen, quellenahen Form wiedergegeben.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die gewöhnliche Bedeutung der Abstammungsangabe wird im Deutschen ausdrücklich wiedergegeben.
- source_word: מַעֲכָה
  choice: Maacha
  rationale: Der Eigenname wird nach üblicher deutscher Bibelnamen-Schreibung transliteriert; der Genitiv erscheint als „Maachas“.
- source_word: וְיוֹשָׁפָט
  choice: und Joschafat
  rationale: Die Wiedergabe folgt der hier belegten kürzeren Namensform יוֹשָׁפָט und unterscheidet sie von der längeren Form Jehoschafat.
- source_word: הַמִּתְנִי
  choice: der Mitniter
  rationale: Die mit Artikel versehene Herkunfts- oder Sippenbezeichnung wird als deutsches Gentiliz wiedergegeben, ohne eine nicht belegte genaue Ortsbestimmung hinzuzufügen.
theological_decisions: []
