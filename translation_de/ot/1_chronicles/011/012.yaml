base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/012.yaml
  text: After him was Eleazar son of Dodo the Ahohite[a]; he was among the three mighty men.
translation:
  language: de
  text: Nach ihm kam Eleasar, der Sohn Dodos, der Ahohiter. Er gehörte zu den drei Helden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er war unter den drei Helden“; gemeint ist seine Zugehörigkeit zu dieser Dreiergruppe.'
    reason: Die Fußnote macht die hebräische Konstruktion und ihre mögliche wörtlichere Wiedergabe sichtbar.
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Nach ihm kam
  rationale: Die Wendung kennzeichnet die Reihenfolge innerhalb der Aufzählung. Das im Hebräischen fehlende Verb wird im Deutschen natürlich durch „kam“ ergänzt.
- source_word: אֶלְעָזָר
  choice: Eleasar
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בֶּן דּוֹדוֹ
  choice: der Sohn Dodos
  rationale: בֶּן bezeichnet hier am natürlichsten die unmittelbare Abstammung; דּוֹדוֹ wird entsprechend der vorliegenden Namensform als „Dodo“ transliteriert.
- source_word: הָאֲחוֹחִי
  choice: der Achochiter
  rationale: Die Herkunfts- beziehungsweise Sippenbezeichnung wird in der herkömmlichen deutschen Form bewahrt.
- source_word: הוּא בִּשְׁלוֹשָׁה הַגִּבֹּרִים
  choice: Er gehörte zu den drei Helden
  rationale: Die Präposition בְּ mit der Zahl bezeichnet hier die Zugehörigkeit zur bekannten Dreiergruppe. „Helden“ bewahrt die im Chronikbuch nahezu titelartige Bezeichnung für Davids herausragende Kämpfer.
