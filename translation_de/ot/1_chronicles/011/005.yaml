  text: וַ/יֹּ֨אמְר֜וּ יֹשְׁבֵ֤י יְבוּס֙ לְ/דָוִ֔יד לֹ֥א תָב֖וֹא הֵ֑נָּה וַ/יִּלְכֹּ֤ד דָּוִיד֙ אֶת מְצֻדַ֣ת צִיּ֔וֹן הִ֖יא עִ֥יר דָּוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/005.yaml
  text: The inhabitants of Jebus said to David[a], “You will not come in here.” But David captured the stronghold of Zion, that is, the City of David.
translation:
  language: de
  text: 'Die Bewohner von Jebus sagten zu David: »Du kommst hier nicht hinein.[a]« Doch David eroberte die Festung von Zion; das ist die Stadt Davids.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du sollst nicht hierherkommen« beziehungsweise »Du wirst hier nicht hineinkommen.« Wörtlich heißt es im Hebräischen: »Du kommst nicht hierher«; im Zusammenhang wird David damit der Zutritt verweigert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי יְבוּס
  choice: die Bewohner von Jebus
  rationale: Die Constructusverbindung bezeichnet kollektiv die Menschen, die in Jebus wohnen. »Bewohner« ist im modernen Standarddeutsch natürlich und präzise.
- source_word: לֹא תָבוֹא הֵנָּה
  choice: Du kommst hier nicht hinein
  rationale: Wörtlich steht »Du wirst/kommst nicht hierher«. Im Kontext wirkt die Aussage als Verweigerung des Zutritts; »hier nicht hinein« bewahrt den räumlichen Sinn und klingt in direkter Rede natürlich.
- source_word: וַיִּלְכֹּד
  choice: eroberte
  rationale: לכד bezeichnet im militärischen Zusammenhang die Einnahme eines Ortes. »Eroberte« gibt dies idiomatisch und eindeutig wieder.
- source_word: מְצֻדַת צִיּוֹן
  choice: die Festung Zion
  rationale: מְצוּדָה bezeichnet eine befestigte, verteidigungsfähige Anlage. »Festung« ist verständlich und wahrt den militärischen Charakter; »Zion« steht dabei als nähere Bestimmung.
- source_word: הִיא עִיר דָּוִיד
  choice: das ist die Stadt Davids
  rationale: Der nominale Identifikationssatz erläutert, dass die Festung Zion als Stadt Davids bezeichnet wird. »Das ist« bildet diese erklärende Gleichsetzung direkt ab.
- source_word: עִיר דָּוִיד
  choice: die Stadt Davids
  rationale: Die Wendung ist eine feste Ortsbezeichnung. Die Großschreibung von »Stadt« folgt hier der Behandlung als Eigenname beziehungsweise etablierte Bezeichnung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und herausfordernd; die erklärende Identifikation am Versende wird ohne zusätzliche Deutung wiedergegeben.
