  text: Ittai, der Sohn Ribais, aus Gibea der Benjaminiter; Benaja, der Piratoniter;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִיתַי
  choice: Ittai
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibeltradition als »Ittai« wiedergegeben.
- source_word: בֶּן רִיבַי
  choice: der Sohn Ribais
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet direkte Abstammung; der deutsche Genitiv ist natürlich und präzise.
- source_word: מִגִּבְעַת
  choice: aus Gibea
  rationale: Die Präposition מִן bezeichnet hier die Herkunft; גִּבְעַת ist als Ortsname aufzufassen.
- source_word: בְּנֵי בִנְיָמִן
  choice: in Benjamin
  rationale: Wörtlich »der Söhne Benjamins«; im Zusammenhang grenzt die Wendung das gemeinte Gibea als den Ort im Stammesgebiet Benjamin ein. Die knappe deutsche Ortsangabe gibt diese Funktion natürlich wieder.
- source_word: בְּנָיָה
  choice: Benaja
  rationale: Der Personenname wird in der etablierten deutschen Form »Benaja« wiedergegeben.
- source_word: הַפִּרְעָתֹנִי
  choice: der Piratoniter
  rationale: Das Gentiliz bezeichnet Herkunft oder Zugehörigkeit zu Piraton; »Piratoniter« bewahrt die Form und mögliche Bedeutungsbreite des Hebräischen.
