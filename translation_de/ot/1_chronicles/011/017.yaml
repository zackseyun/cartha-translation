  text: ו/יתאו דָּוִ֖יד וַ/יֹּאמַ֑ר מִ֚י יַשְׁקֵ֣/נִי מַ֔יִם מִ/בּ֥וֹר בֵּֽית לֶ֖חֶם אֲשֶׁ֥ר בַּ/שָּֽׁעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/017.yaml
  text: And David longed and said[b][a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: de
  text: 'Und David sehnte sich danach und sagte: „Wer gibt mir Wasser aus dem Brunnen[b] von Bethlehem am Tor zu trinken?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäßer: „Wenn mir doch jemand Wasser aus dem Brunnen von Bethlehem am Tor zu trinken gäbe!“'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „Zisterne“ oder „Grube“ bedeuten; hier bezeichnet es eine Wasserstelle, aus der Trinkwasser geschöpft wurde.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתאו
  choice: sehnte sich danach
  rationale: Die Hitpael-Form von אוה bezeichnet ein starkes Verlangen. „Sehnte sich danach“ gibt diese Intensität in natürlichem, würdigem Deutsch wieder.
- source_word: מי
  choice: Wer gibt mir
  rationale: Das Fragewort leitet in direkter Rede einen Wunsch ein. Die wörtliche Frageform bleibt erhalten, ohne den Wunsch bereits im Haupttext als Ausruf umzuformulieren.
- source_word: ישקני
  choice: gibt mir … zu trinken
  rationale: Der Hifil von שקה bedeutet „zu trinken geben“. Diese Wiedergabe bewahrt den kausativen Sinn und verbindet ihn natürlich mit dem ausdrücklich genannten Wasser.
- source_word: מים
  choice: Wasser
  rationale: Direkte und eindeutige Wiedergabe des gewöhnlichen Substantivs.
- source_word: מבּור
  choice: aus dem Brunnen
  rationale: בּוֹר kann Grube, Zisterne oder Brunnen bezeichnen. Da hier Wasser zum Trinken aus einer bekannten Wasserstelle gemeint ist, passt „Brunnen“ im Kontext am besten; die lexikalische Spannweite wird in einer Fußnote bewahrt.
- source_word: בית לחם
  choice: Bethlehem
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: אשר בשער
  choice: von Bethlehem am Tor
  rationale: Die knappe Formulierung ordnet den Brunnen Bethlehem zu und lokalisiert ihn beim Stadttor. „Am Tor“ gibt בַּשַּׁעַר räumlich natürlich wieder.
