id: 1CH.11.8
reference: 1 Chronicles 11:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּ֤בֶן הָ/עִיר֙ מִ/סָּבִ֔יב מִן הַ/מִּלּ֖וֹא וְ/עַד הַ/סָּבִ֑יב וְ/יוֹאָ֕ב יְחַיֶּ֖ה אֶת שְׁאָ֥ר הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/008.yaml
  text: He built the city all around[a], from the Millo even to the surrounding area[b], and Joab restored the rest of the city.
translation:
  language: de
  text: Er baute die Stadt ringsum aus, vom Millo[a] bis zum Umkreis; und Joab stellte den übrigen Teil der Stadt wieder her.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der „Millo“ war eine Anlage oder ein Bereich in Jerusalem. Die genaue Bedeutung des Namens ist unsicher; möglicherweise handelte es sich um eine Aufschüttung oder Terrassenanlage.
    reason: cultural_note
  - marker: b
    text: Das hebräische Verb bedeutet wörtlich „machte lebendig“; hier ist wohl gemeint, dass Joab den übrigen Teil der Stadt erneuerte oder instand setzte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Er baute
  rationale: Das Qal-Wayyiqtol von בנה bezeichnet eine vergangene Erzählhandlung. Das Subjekt ist David aus dem vorhergehenden Vers; „wieder aufbauen“ wäre ohne ausdrückliches sprachliches Signal zu eng.
- source_word: הָעִיר מִסָּבִיב
  choice: die Stadt ringsum
  rationale: עִיר wird im Zusammenhang mit Jerusalem passend als „Stadt“ wiedergegeben; מִסָּבִיב bezeichnet ihre ringsum reichende Ausdehnung.
- source_word: מִן הַמִּלּוֹא
  choice: vom Millo
  rationale: מִלּוֹא ist eine topografische Bezeichnung in Jerusalem, deren genauer Bezug unsicher ist. Deshalb wird der Name transliteriert statt etwa als „Aufschüttung“ oder „Terrassenanlage“ festgelegt.
- source_word: וְעַד הַסָּבִיב
  choice: bis zu den umliegenden Bereichen
  rationale: Die knappe hebräische Wendung bezeichnet räumliche Ausdehnung bis in die Umgebung beziehungsweise an den Umkreis. Die deutsche Formulierung bleibt verständlich, ohne einen präzisen technischen Sinn vorzutäuschen.
- source_word: יְחַיֶּה
  choice: stellte … wieder her
  rationale: Das Piel von חיה bedeutet wörtlich „lebendig machen“. Auf eine Stadt bezogen bezeichnet es hier idiomatisch deren Wiederherstellung oder Erneuerung.
- source_word: אֶת שְׁאָר הָעִיר
  choice: den übrigen Teil der Stadt
  rationale: שְׁאָר bezeichnet das Verbliebene beziehungsweise den Rest; „den übrigen Teil“ ist in diesem Bauzusammenhang natürlich und eindeutig.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die topografische Unsicherheit der hebräischen Wendung wird bewahrt; der seltene Name „Millo“ wird durch eine Fußnote erklärt.
