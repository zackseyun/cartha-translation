  text: וַ/יֵּ֨לֶךְ דָּוִ֧יד וְ/כָל יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם הִ֣יא יְב֑וּס וְ/שָׁם֙ הַ/יְבוּסִ֔י יֹשְׁבֵ֖י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/004.yaml
  text: Then David and all Israel went to Jerusalem—that is[a], Jebus—where the Jebusites, the inhabitants of the land, were.
translation:
  language: de
  text: Dann zogen David und ganz Israel nach Jerusalem, das heißt Jebus. Dort lebten die Jebusiter, die Bewohner des Landes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִיד וְכָל יִשְׂרָאֵל
  choice: Dann zog David mit ganz Israel
  rationale: Das Waw-Konsekutiv führt die Erzählung fort. »Zog … mit« ist im Deutschen eine natürliche Wiedergabe für eine gemeinsame Unternehmung, ohne die Beteiligung ganz Israels abzuschwächen.
- source_word: יְרוּשָׁלִַם הִיא יְבוּס
  choice: nach Jerusalem, das heißt Jebus
  rationale: Das Pronomen הִיא setzt Jerusalem mit dem damaligen Namen Jebus gleich. »Das heißt« gibt diese Identifizierung klar und knapp wieder.
- source_word: וְשָׁם
  choice: Dort
  rationale: Die wörtliche Ortsangabe »und dort« wird als neuer deutscher Satz natürlich mit »Dort« wiedergegeben.
- source_word: הַיְבוּסִי
  choice: die Jebusiter
  rationale: Das morphologisch singularische Volkswort ist kollektiv gebraucht, wie das folgende pluralische יֹשְׁבֵי zeigt; daher ist im Deutschen der Plural angemessen.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: die Bewohner des Landes
  rationale: Das Partizip im Konstruktus bezeichnet die Bewohner. אֶרֶץ meint hier das örtliche Land beziehungsweise Gebiet, nicht die Erde insgesamt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden hebräischen Teilsätze werden zur besseren Lesbarkeit in zwei deutsche Sätze gegliedert; die sachliche Wiederholung »die Jebusiter, die Bewohner des Landes« bleibt erhalten.
