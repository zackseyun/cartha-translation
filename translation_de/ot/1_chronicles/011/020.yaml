    rationale: Der hebräische Text verbindet das Schwingen/Erheben des Speers mit „dreihundert Erschlagenen“ und formuliert nicht ausdrücklich „und er erschlug sie“. Die Ergebnisimplikation darf nicht stärker als der Ausgangstext festgelegt werden.
  - severity: low
    issue: „so machte er sich unter den Drei einen Namen“ verschiebt „hatte einen Namen“ zu einer kausativen Erfolgsformel.
    rationale: Die deutsche Redewendung ist möglich, besagt aber eher, dass er sich erst durch die Tat Ansehen erwarb. Die hebräische Formulierung stellt schlicht fest, dass er einen Namen/Ruf hatte.
