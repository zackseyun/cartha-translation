revisions:
- from: Abischai, der Bruder Joabs, war das Oberhaupt der Drei.[a] Er schwang seinen Speer gegen dreihundert Männer und erschlug sie[b]; so machte er sich unter den Drei einen Namen.[c]
  to: Abischai, der Bruder Joabs, war der Anführer der Drei.[a] Er schwang seinen Speer gegen dreihundert Erschlagene und hatte unter den Drei einen Namen.[b][c]
  rationale: Die Fassung bewahrt den kompakten und in der genauen syntaktischen Deutung nicht weiter auszudifferenzierenden hebräischen Kampfausdruck, statt eine ausdrückliche Tötungsaussage einzuführen. Zugleich werden die Führungsbezeichnung und das Idiom vom „Namen haben“ idiomatisch, aber quellennah wiedergegeben. Die Fußnoten bleiben an den jeweils erläuterten Ausdrücken verankert.
