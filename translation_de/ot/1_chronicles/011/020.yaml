  text: וְ/אַבְשַׁ֣י אֲחִֽי יוֹאָ֗ב ה֤וּא הָיָה֙ רֹ֣אשׁ הַ/שְּׁלוֹשָׁ֔ה וְ/הוּא֙ עוֹרֵ֣ר אֶת חֲנִית֔/וֹ עַל שְׁלֹ֥שׁ מֵא֖וֹת חָלָ֑ל ו/לא שֵׁ֖ם בַּ/שְּׁלוֹשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/020.yaml
  text: And Abishai[a], the brother of Joab, was chief of the Three. He brandished his spear against three hundred slain[c][b], and had a name among the Three.
translation:
  language: de
  text: Abischai, der Bruder Joabs, war der Anführer der Drei.[a] Er schwang seinen Speer gegen dreihundert Erschlagene und hatte unter den Drei einen Namen.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Drei“. Im Parallelbericht in 2. Samuel 23,18 wird die Gruppenbezeichnung wegen textlicher und kontextueller Schwierigkeiten im Umfeld von „drei“ und „dreißig“ teilweise anders wiedergegeben.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich etwa: „Er schwang (oder: erhob) seinen Speer gegen dreihundert Erschlagene.“'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „und er hatte einen Namen unter den Drei“, das heißt, er war unter ihnen angesehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: Oberhaupt
  rationale: Im militärischen Zusammenhang bezeichnet רֹאשׁ eine Führungsstellung. „Oberhaupt“ gibt Rang und Leitung wieder, ohne das Bild des wörtlichen „Kopfes“ zu übernehmen.
- source_word: הַשְּׁלוֹשָׁה / בַּשְּׁלוֹשָׁה
  choice: die Drei / unter den Drei
  rationale: Der masoretische Text nennt ausdrücklich „die Drei“. Die Übersetzung bewahrt diese Bezeichnung und gleicht sie nicht an die in diesem Überlieferungszusammenhang ebenfalls vorkommende Gruppe der Dreißig an.
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: schwang seinen Speer
  rationale: Das Verb bedeutet hier bildhaft, den Speer zu erregen beziehungsweise in Bewegung zu setzen. „Schwang seinen Speer“ ist im Deutschen anschaulich und bezeichnet eine kämpferische Verwendung, ohne unnötig auszudeuten.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: gegen dreihundert Männer und erschlug sie
  rationale: חָלָל bezeichnet Erschlagene oder tödlich Getroffene. Die natürliche deutsche Formulierung macht den im hebräischen Ausdruck zusammengezogenen Ausgang des Kampfes deutlich; eine Fußnote dokumentiert die nähere Form des Ausgangstextes.
- source_word: שֵׁם
  choice: machte er sich … einen Namen
  rationale: Die hebräische Wendung „einen Namen haben“ bezeichnet Ansehen oder Ruhm. Die deutsche Redewendung „sich einen Namen machen“ bewahrt das Bild und passt zum zuvor geschilderten Heldentat-Kontext.
- source_word: אַבְשַׁי
  choice: Abischai
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: אֲחִי יוֹאָב
  choice: der Bruder Joabs
  rationale: Diese Form gibt die hebräische Genitivverbindung knapp und in natürlichem Standarddeutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Gruppenbezeichnung „die Drei“ bleibt als Titel erhalten. Der verdichtete hebräische Kampfausdruck wird im Haupttext verständlich entfaltet, während die Fußnote seine wörtlichere Gestalt und die mögliche Wiedergabe „erhob“ bewahrt.
