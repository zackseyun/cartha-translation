  naturalness: „Oberhaupt“ ist zwar verständlich, klingt im modernen Deutschen für eine militärische Rangstellung jedoch weniger idiomatisch als „Anführer“. Die revidierte Fassung bleibt würdevoll und gut lesbar, ohne die knappe hebräische Formulierung unnötig auszudeuten.
  terminology: „Abischai“, „Joab“ und „die Drei“ sind angemessen. „Anführer“ gibt רֹאשׁ im Kontext treffend wieder. Die Wendung „hatte … einen Namen“ bewahrt das hebräische Idiom; die Fußnote erläutert seine Bedeutung.
