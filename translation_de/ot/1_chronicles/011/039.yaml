lexical_decisions:
- source_word: צֶלֶק
  choice: Zelek
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen Umschrift wiedergegeben.
- source_word: הָעַמּוֹנִי
  choice: der Ammoniter
  rationale: Das Ethnikon mit Artikel bezeichnet Zeleks Herkunft; »der Ammoniter« ist in einer Namensliste natürlich und quellennah.
- source_word: נַחְרַי
  choice: Naharai
  rationale: Die Umschrift bildet die masoretische Vokalisation des Personennamens erkennbar ab.
- source_word: הַבֵּרֹתִי
  choice: der Beerotiter
  rationale: Das Ethnikon mit Artikel leitet sich vom Ortsnamen Beerot ab; »Beerotiter« hält diesen Zusammenhang im Deutschen transparent.
- source_word: נֹשֵׂא כְּלֵי
  choice: der Waffenträger
  rationale: Die Verbindung aus »tragen« und »Geräte/Waffen« ist eine feste Bezeichnung für einen Waffenträger; die idiomatische deutsche Wiedergabe bewahrt Funktion und Sinn.
- source_word: יוֹאָב
  choice: Joab
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: בֶּן צְרוּיָה
  choice: des Sohnes Zerujas
  rationale: Die Genitivfügung ordnet die Herkunftsangabe eindeutig Joab zu und bewahrt die im Hebräischen ausdrücklich genannte Abstammung über Zeruja.
