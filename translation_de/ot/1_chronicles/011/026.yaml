  source_fidelity: Die Übersetzung gibt die elliptische hebräische Listenfortsetzung sachgerecht wieder. „Zu den Helden gehörten“ entfaltet וְגִבּוֹרֵי הַחֲיָלִים idiomatisch, ohne zusätzliche Sachinformation einzutragen. Die beiden Namen, die Verwandtschafts- bzw. Abstammungsangaben und „aus Bethlehem“ entsprechen dem hebräischen Text; die Ortsangabe bezieht sich in der Reihung natürlich auf Elhanan.
  naturalness: '„Und zu den Helden gehörten: Asaël, der Bruder Joabs, Elhanan, der Sohn Dodos, aus Bethlehem.“ ist modernes, klares Deutsch und für den listenartigen Kontext angemessen würdig. Die Zeichensetzung gliedert die Appositionen verständlich.'
  terminology: „Helden“ ist im militärischen Listen- und Ehrenkontext eine tragfähige, natürliche Wiedergabe von גִּבּוֹרֵי הַחֲיָלִים. „Asaël“, „Joab“, „Elhanan“, „Dodo“ und „Bethlehem“ sind konsistent und angemessen wiedergegeben. „Aus Bethlehem“ bewahrt die Orts-/Herkunftsangabe, ohne die mögliche idiomatische Alternative „der Bethlehemiter“ unnötig zu bevorzugen.
