  text: וְ/גִבּוֹרֵ֖י הַ/חֲיָלִ֑ים עֲשָׂה אֵל֙ אֲחִ֣י יוֹאָ֔ב אֶלְחָנָ֥ן בֶּן דּוֹד֖וֹ מִ/בֵּ֥ית לָֽחֶם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/026.yaml
  text: 'And the mighty warriors were: Asahel the brother of Joab[a], Elhanan son of Dodo, from Bethlehem.'
translation:
  language: de
  text: 'Und zu den Helden gehörten: Asaël, der Bruder Joabs, Elhanan, der Sohn Dodos, aus Bethlehem.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגִבּוֹרֵי הַחֲיָלִים
  choice: Und zu den Helden gehörten
  rationale: Die Verbindung bezeichnet herausragende, kampferprobte Männer. „Helden“ ist im Kontext einer Kriegerliste knapp, würdig und im modernen Deutsch verständlich; die ergänzte Wendung „gehörten“ macht den elliptischen hebräischen Listenstil natürlich lesbar.
- source_word: עֲשָׂה אֵל
  choice: Asaël
  rationale: Der Personenname wird nach üblicher deutscher biblischer Namensform wiedergegeben; das Trema zeigt die getrennte Aussprache der Vokale an.
- source_word: אֲחִי יוֹאָב
  choice: der Bruder Joabs
  rationale: Die hebräische Genitivverbindung wird formal und natürlich wiedergegeben.
- source_word: אֶלְחָנָן
  choice: Elhanan
  rationale: Transliteration des hebräischen Personennamens in gebräuchlicher deutscher Form.
- source_word: בֶּן דּוֹדוֹ
  choice: der Sohn Dodos
  rationale: דּוֹדוֹ wird hier als Personenname verstanden; die genealogische Formel wird unmittelbar wiedergegeben.
- source_word: מִבֵּית לָחֶם
  choice: aus Bethlehem
  rationale: Die Präposition מִן bezeichnet hier die Herkunft. „Aus Bethlehem“ bewahrt den wörtlichen Ortsbezug, ohne ihn in ein Herkunftsadjektiv umzuwandeln.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Listenstil. Die knappe hebräische Nominalkonstruktion wird durch „gehörten“ idiomatisch ergänzt. Da „aus Bethlehem“ unmittelbar und eindeutig ist, ist keine Fußnote nötig.
