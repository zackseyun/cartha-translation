  source_fidelity: 'Der Text gibt die beiden knappen Namensgruppen des Hebräischen vollständig und in derselben Reihenfolge wieder: חוּרַי מִנַּחֲלֵי גָּעַשׁ und אֲבִיאֵל הָעַרְבָתִי. „aus den Bachtälern von Gaasch“ ist eine vertretbare Wiedergabe von מִנַּחֲלֵי; die Fußnote wahrt die lexikalische Spannweite von נחל. Die Eigennamen Hurai, Gaasch und Abiël sowie die Herkunftsbezeichnung „der Arbatiter“ sind quellennah und ohne unbegründete Identifizierung des Herkunftsortes wiedergegeben.'
