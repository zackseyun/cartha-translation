  text: David lived in the stronghold[a]; therefore they called it the City of David.
translation:
  language: de
  text: David ließ sich in der Festung[a] nieder; deshalb nannte man sie Davidsstadt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Burg“. Das hebräische Wort bezeichnet einen befestigten, geschützten Ort.'
