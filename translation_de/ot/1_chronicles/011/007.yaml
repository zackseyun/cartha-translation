lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: ließ sich … nieder
  rationale: ישׁב bezeichnet mit einer Ortsangabe das Wohnen beziehungsweise die dauerhafte Niederlassung. „Ließ sich nieder“ gibt im Erzählzusammenhang natürlich wieder, dass David die eroberte Festung zu seinem Wohnsitz machte.
- source_word: בַּמְצָד
  choice: in der Festung
  rationale: מְצָד bezeichnet einen befestigten, militärisch geschützten Ort. „Festung“ ist im modernen Deutschen klar und bewahrt den defensiven Sinn.
- source_word: עַל כֵּן
  choice: deshalb
  rationale: Die Wendung markiert die Folge aus dem zuvor genannten Sachverhalt. „Deshalb“ bildet diesen Zusammenhang knapp und natürlich ab.
- source_word: קָרְאוּ לוֹ
  choice: nannte man sie
  rationale: Das Hebräische hat eine aktive Pluralform, deren unbestimmtes Subjekt im Deutschen idiomatisch mit „man“ wiedergegeben wird. Das feminine Pronomen bezieht sich auf „Festung“; „nennen“ entspricht dem Benennungssinn von קרא.
- source_word: עִיר דָּוִיד
  choice: Davidsstadt
  rationale: Die etablierte deutsche Ortsbezeichnung „Davidsstadt“ gibt die hebräische Genitivverbindung als Eigennamen knapp und eindeutig wieder.
theological_decisions: []
translation_notes:
