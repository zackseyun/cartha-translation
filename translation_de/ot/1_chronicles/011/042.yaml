  text: עֲדִינָ֨א בֶן שִׁיזָ֜א הָ/רֽאוּבֵנִ֗י רֹ֛אשׁ לָ/רֽאוּבֵנִ֖י וְ/עָלָ֥י/ו שְׁלוֹשִֽׁים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/042.yaml
  text: Adina son of Shiza the Reubenite[a], a chief of the Reubenites, and with him were thirty.
translation:
  language: de
  text: Adina, der Sohn Schisas, der Rubeniter, ein Anführer der Rubeniter; bei ihm waren dreißig Mann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und über ihm waren dreißig«. Gemeint sind wahrscheinlich dreißig Männer, die ihm zugeordnet waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדִינָא
  choice: Adina
  rationale: Der Personenname wird nach üblicher deutscher Bibeltradition in hebräischer Form wiedergegeben.
- source_word: בֶן שִׁיזָא
  choice: der Sohn Schisas
  rationale: בֶן bezeichnet hier in der Heldenliste am natürlichsten die unmittelbare Abstammung; der Genitiv ist idiomatisches Deutsch.
- source_word: הָרְאוּבֵנִי
  choice: der Rubeniter
  rationale: Das substantivierte Gentiliz mit Artikel bezeichnet Adinas Stammeszugehörigkeit.
- source_word: רֹאשׁ
  choice: ein Anführer
  rationale: רֹאשׁ bezeichnet in diesem militärischen Zusammenhang eine führende Stellung, ohne ein genaueres Amt festzulegen.
- source_word: לָרְאוּבֵנִי
  choice: der Rubeniter
  rationale: Die Präposition ל markiert hier den Bereich beziehungsweise die Gruppe, in der Adina Anführer war; der Singular des hebräischen Gentiliz wird im Deutschen kollektiv als Stammesbezeichnung verstanden.
- source_word: וְעָלָיו
  choice: bei ihm waren
  rationale: Wörtlich bedeutet die Verbindung etwa »und über ihm«, doch im Zusammenhang der militärischen Liste bezeichnet sie wahrscheinlich dreißig ihm zugeordnete beziehungsweise ihn begleitende Männer.
- source_word: שְׁלוֹשִׁים
  choice: dreißig Mann
  rationale: Die Zahl steht ohne ausdrückliches Substantiv; aus der militärischen Liste ergibt sich als natürliche Ergänzung »Mann«.
theological_decisions: []
