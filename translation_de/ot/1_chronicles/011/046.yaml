  text: אֱלִיאֵל֙ הַֽ/מַּחֲוִ֔ים וִ/ירִיבַ֥י וְ/יוֹשַׁוְיָ֖ה בְּנֵ֣י אֶלְנָ֑עַם וְ/יִתְמָ֖ה הַ/מּוֹאָבִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/046.yaml
  text: Eliel the Mahavite[a], and Jeribai and Joshaviah, the sons of Elnaam[b], and Ithmah the Moabite.
translation:
  language: de
  text: Elïel, der Machawiter[a], Jeribai und Joschawja, die Söhne Elnaams, und Jitma, der Moabiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Bezeichnung Machawiter ist vermutlich eine Herkunfts- oder Sippenbezeichnung; welcher Ort oder welche Sippe gemeint ist, bleibt ungewiss.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלִיאֵל
  choice: Elïel
  rationale: Personenname; die Schreibung mit Trema hält die Vokale getrennt und vermeidet im Deutschen eine irreführende Aussprache als Diphthong.
- source_word: הַמַּחֲוִים
  choice: der Machawiter
  rationale: Unsichere Herkunfts- oder Sippenbezeichnung; eine formnahe deutsche Umschrift bewahrt die Unbestimmtheit, ohne einen unbekannten Ort zu identifizieren.
- source_word: וִירִיבַי
  choice: Jeribai
  rationale: Personenname; nach deutscher Bibelnamenkonvention transliteriert.
- source_word: וְיוֹשַׁוְיָה
  choice: Joschawja
  rationale: Personenname; sch gibt den hebräischen ש-Laut für deutschsprachige Leser verständlich wieder.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der Status constructus im Plural bezeichnet Jeribai und Joschawja gemeinsam als Söhne Elnaams.
- source_word: אֶלְנָעַם
  choice: Elnaam
  rationale: Personenname; formnah transliteriert.
- source_word: וְיִתְמָה
  choice: Jitma
  rationale: Personenname; das anlautende hebräische Jod wird in deutscher Umschrift mit J wiedergegeben.
- source_word: הַמּוֹאָבִי
  choice: der Moabiter
  rationale: Die Herkunftsbezeichnung mit Artikel wird als identifizierender Beiname wiedergegeben.
