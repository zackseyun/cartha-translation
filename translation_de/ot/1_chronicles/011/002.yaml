  text: גַּם תְּמ֣וֹל גַּם שִׁלְשׁ֗וֹם גַּ֚ם בִּ/הְי֣וֹת שָׁא֣וּל מֶ֔לֶךְ אַתָּ֛ה הַ/מּוֹצִ֥יא וְ/הַ/מֵּבִ֖יא אֶת יִשְׂרָאֵ֑ל וַ/יֹּאמֶר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּה֙ תִּהְיֶ֣ה נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/002.yaml
  text: Even in times past[a], even before, when Saul was king, you were the one who led Israel out and brought them in; and Yahweh your God said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over my people Israel.’
translation:
  language: de
  text: 'Schon früher, auch als Saul König war, warst du es, der Israel hinaus- und hereinführte.[a] Und Jahwe, dein Gott, sagte zu dir: »Du sollst mein Volk Israel weiden, und du sollst Herrscher über mein Volk Israel sein.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auch gestern, auch vorgestern“. Das ist eine hebräische Wendung für die frühere Zeit. Das „Hinaus- und Hereinführen“ beschreibt hier die Führung des Volkes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Fürst“ beziehungsweise „Anführer“. Das hebräische Wort ist nicht das übliche Wort für „König“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם תְּמוֹל גַּם שִׁלְשׁוֹם
  choice: Schon früher
  rationale: Die wörtliche Wendung „auch gestern, auch vorgestern“ ist ein hebräisches Idiom für die zurückliegende Zeit. „Schon früher“ gibt die zeitliche Bedeutung natürlich wieder; das folgende גַּם wird mit „auch“ vor dem Saul-Satz bewahrt.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ
  choice: auch als Saul König war
  rationale: Die Präposition ב mit dem Infinitiv bildet einen temporalen Nebensatz. Das vorangestellte גַּם wird als „auch“ wiedergegeben.
- source_word: אַתָּה הַמּוֹצִיא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: warst du es, der Israel hinaus- und wieder hereinführte
  rationale: Die Formulierung bewahrt das hebräische Bild vom Hinaus- und Hereinführen und macht zugleich Davids leitende Funktion deutlich. „wieder“ klingt im Deutschen natürlich und bezeichnet die Rückführung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in der geläufigen wissenschaftlichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: תִרְעֶה
  choice: weiden
  rationale: Das Verb bezeichnet hier metaphorisch die Aufgabe eines Hirten gegenüber dem Volk. „Weiden“ bewahrt das königliche Hirtenbild und bleibt im Deutschen verständlich.
- source_word: נָגִיד
  choice: Fürst
  rationale: נָגִיד bezeichnet einen eingesetzten führenden Herrscher, ist aber nicht das zuvor verwendete Wort מֶלֶךְ „König“. „Fürst“ erhält diese lexikalische Unterscheidung besser als „König“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen ausdrücklich. „Jahwe“ bewahrt ihn als Namen und ersetzt ihn nicht durch einen Herrschaftstitel.
- issue: Königliches Hirtenbild in תִרְעֶה
  choice: Du sollst mein Volk Israel weiden
  alternative: Du sollst über mein Volk Israel herrschen
  rationale: Der hebräische Text verwendet bewusst die Hirtenmetapher. Ihre Beibehaltung erhält die theologische Spannung zwischen fürsorglicher Führung und Herrschaft.
- issue: Bedeutung von נָגִיד
  choice: Fürst
  alternative: Herrscher / Anführer
  rationale: „Fürst“ bringt den herrscherlichen Rang zum Ausdruck, ohne נָגִיד mit מֶלֶךְ „König“ gleichzusetzen. Die Bedeutungsbreite wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am hebräischen Text, wird aber für flüssiges Deutsch leicht gegliedert. Die Hirtenmetapher und die Unterscheidung zwischen „König“ und נָגִיד bleiben erhalten.
