  text: Jediael son of Shimri[a], and Joha his brother, the Tizite;
translation:
  language: de
  text: Jediaël, der Sohn Schimris, und sein Bruder Joha, der Tiziter[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „der Ziziter“; die Bezeichnung kann je nach Vokalisierung und Zuordnung zu einem Orts- oder Sippennamen unterschiedlich wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעֲאֵל
  choice: Jediaël
  rationale: Personenname; nach einer im Deutschen verständlichen, quellennahen Form transliteriert. Das Trema macht die getrennte Aussprache der Vokale sichtbar.
- source_word: בֶּן שִׁמְרִי
  choice: der Sohn Schimris
  rationale: בֶּן bezeichnet in diesem Listenabschnitt am natürlichsten die unmittelbare Sohnschaft; der deutsche Genitiv gibt die Konstruktion knapp und idiomatisch wieder.
- source_word: וְיֹחָא
  choice: und … Joha
  rationale: Die Konjunktion wird mit „und“ wiedergegeben, der Personenname transliteriert.
- source_word: אָחִיו
  choice: sein Bruder
  rationale: Die gewöhnliche Bedeutung von אָח ist „Bruder“. Für die weiter gefasste Bedeutung „Verwandter“ bietet der Kontext keinen zwingenden Anlass.
- source_word: הַתִּיצִי
  choice: der Tiziter
  rationale: Die Form bezeichnet vermutlich die Zugehörigkeit zu einem Ort oder einer Sippe. „Tiziter“ bewahrt diese Zuordnung, ohne den unbekannten Bezugsnamen näher festzulegen.
theological_decisions: []
