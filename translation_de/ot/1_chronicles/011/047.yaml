- source_word: וְעוֹבֵד
  choice: Obed
  rationale: Der Personenname wird transliteriert; die vorangestellte hebräische Konjunktion wird in der natürlichen deutschen Aufzählung erst vor dem letzten Glied mit „und“ wiedergegeben.
- source_word: וְיַעֲשִׂיאֵל
  choice: und Jaasiel
  rationale: Der Personenname wird in einer gebräuchlichen deutschen Transliteration wiedergegeben; das Präfix וְ wird als „und“ übersetzt.
- source_word: הַמְּצֹבָיָה
  choice: der Mezobaiter
  rationale: Die Form mit Artikel bezeichnet wahrscheinlich die Herkunft oder Clanzugehörigkeit Jaasiels. Eine nahe Transliteration bewahrt diese Funktion, ohne den unsicheren zugrunde liegenden Orts- oder Clannamen näher zu bestimmen.
