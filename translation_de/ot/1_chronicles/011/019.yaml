  terminology: »Blut«, »Leben« und »Helden« sind passend. »Helden« gibt גִּבּוֹרִים im militärisch-heroischen Kontext idiomatisch wieder. Die Fußnote zu »Blut« erläutert die Bildsprache, ohne sie dogmatisch zu überdeuten.
