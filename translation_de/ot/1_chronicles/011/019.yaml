base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/019.yaml
  text: And he said[a], “Far be it from me, by my God, to do this! Shall I drink the blood of these men at the cost of their lives? For they brought it at the cost of their lives.” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: de
  text: 'Er sagte: »Es sei fern von mir, bei meinem Gott, so etwas zu tun! Sollte ich das Blut[b] dieser Männer trinken, die es unter Einsatz ihres Lebens hergebracht haben? Denn unter Einsatz ihres Lebens haben sie es hergebracht.« Er wollte es jedoch nicht trinken. Das taten die drei Helden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: David nennt das Wasser bildhaft »Blut«, weil die Männer es unter tödlicher Gefahr beschafft hatten.
    reason: cultural_note
lexical_decisions:
- source_word: חָלִילָה לִּי מֵאֱלֹהַי
  choice: Es sei fern von mir – bei meinem Gott!
  rationale: חָלִילָה drückt eine entschiedene Zurückweisung aus. Die Wendung „bei meinem Gott“ bewahrt die wahrscheinlich bekräftigende, eidähnliche Kraft von מֵאֱלֹהַי, ohne sie zum schlichten „Gott bewahre“ umzudeuten.
- source_word: מֵעֲשׂוֹת זֹאת
  choice: so etwas zu tun
  rationale: Der Infinitiv bezeichnet hier das entschieden abgelehnte Handeln. „So etwas“ verweist im Deutschen natürlich auf das Trinken des unter Lebensgefahr beschafften Wassers.
- source_word: הֲדַם הָאֲנָשִׁים הָאֵלֶּה אֶשְׁתֶּה
  choice: Sollte ich das Blut dieser Männer trinken
  rationale: Die Fragepartikel leitet eine rhetorische Frage ein. „Blut“ bleibt als bewusst starke, im Kontext bildhafte Bezeichnung erhalten.
- source_word: בְנַפְשׁוֹתָם
  choice: um den Preis ihres Lebens
  rationale: נֶפֶשׁ bezeichnet hier das physische Leben. Die Formulierung gibt wieder, dass die Männer ihr Leben aufs Spiel setzten; die Wiederholung im Hebräischen wird auch im Deutschen bewahrt.
- source_word: כִּי בְנַפְשׁוֹתָם הֱבִיאוּם
  choice: Denn um den Preis ihres Lebens haben sie es hergebracht
  rationale: Das Suffix bezieht sich auf das Wasser. „Es“ nimmt dieses im Deutschen auf, und „hergebracht“ entspricht der Bewegung zu David hin.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: Darum wollte er es nicht trinken
  rationale: אָבָה bezeichnet Willigkeit oder Einverständnis. „Wollte … nicht“ bleibt näher am Wortlaut als das stärkere „weigerte sich“; „darum“ macht den im Zusammenhang liegenden Folgezusammenhang deutlich.
- source_word: אֵלֶּה עָשׂוּ שְׁלֹשֶׁת הַגִּבּוֹרִים
  choice: Das taten die drei Helden
  rationale: גִּבּוֹרִים bezeichnet hier Davids herausragende Krieger. „Helden“ bewahrt den militärisch-heroischen Sinn und klingt im modernen Deutschen natürlicher als „starke Männer“.
theological_decisions:
- issue: Bedeutung von „Blut“ in Davids Aussage
  choice: „Blut“ wörtlich beibehalten und durch den Kontext als wertende Bildsprache verständlich werden lassen
  alternative: Im Haupttext als „Wasser, für das sie ihr Leben riskierten“ umschreiben
  rationale: Der hebräische Text nennt ausdrücklich Blut. Davids Aussage behandelt das Wasser wegen der tödlichen Gefahr, der sich die Männer aussetzten, als ihrem Blut gleichwertig; eine Paraphrase würde diese ethisch-theologische Spannung abschwächen.
- issue: Bedeutung von נֶפֶשׁ
  choice: Leben
  alternative: Seele
  rationale: Im Zusammenhang geht es um das gefährdete leibliche Leben, nicht um eine Aussage über eine immaterielle Seele.
- issue: Kraft von מֵאֱלֹהַי
  choice: als bekräftigenden Gottesbezug mit „bei meinem Gott“ wiedergeben
  alternative: „vor meinem Gott“ oder „mein Gott bewahre“
  rationale: Die genaue Funktion der Präposition ist umstritten. „Bei meinem Gott“ wahrt die eidähnliche Bekräftigung, ohne die Aussage in eine ausdrückliche Bitte an Gott umzuwandeln.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper erzählerischer Form. Die feierliche Zurückweisung und die rhetorische Frage bleiben erhalten. Die markante Wiederholung des Lebenseinsatzes wird nicht geglättet.
