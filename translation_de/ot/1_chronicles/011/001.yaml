  text: וַ/יִּקָּבְצ֧וּ כָֽל יִשְׂרָאֵ֛ל אֶל דָּוִ֖יד חֶבְר֣וֹנָ/ה לֵ/אמֹ֑ר הִנֵּ֛ה עַצְמְ/ךָ֥ וּֽ/בְשָׂרְ/ךָ֖ אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/001.yaml
  text: Then all Israel gathered to David at Hebron, saying, “Look, we are your bone and your flesh.”
translation:
  language: de
  text: 'Da versammelte sich ganz Israel zu David nach Hebron und sagte: »Sieh, wir sind dein Gebein und dein Fleisch.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: Da versammelte sich
  rationale: Das wayyiqtol führt die Erzählung fort; der deutsche Singular richtet sich natürlich nach dem Kollektivausdruck »ganz Israel«.
- source_word: כָל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Bewahrt den kollektiven und umfassenden Wortlaut des Hebräischen.
- source_word: אֶל דָּוִיד חֶבְרוֹנָה
  choice: bei David in Hebron
  rationale: אֶל bezeichnet hier die Zusammenkunft bei David; die Direktivendung an חֶבְרוֹנָה gibt die Bewegung nach Hebron an, die im Deutschen idiomatisch in der Gesamtformulierung ausgedrückt wird.
- source_word: הִנֵּה
  choice: doch
  rationale: Markiert den nachdrücklichen Hinweis auf eine bekannte beziehungsweise offenkundige Verbundenheit natürlicher als das hier steife »Siehe«.
- source_word: עַצְמְךָ וּבְשָׂרְךָ אֲנָחְנוּ
  choice: Wir sind dein Gebein und dein Fleisch
  rationale: Bewahrt die konkrete hebräische Verwandtschaftsformel und ihre bildhafte Reihenfolge.
theological_decisions:
- issue: Bedeutung der Formel »dein Gebein und dein Fleisch«
  choice: Die Formel wird wörtlich und ohne Zusatz wiedergegeben.
  alternative: »Wir sind mit dir blutsverwandt« oder »Wir gehören zu deinem Volk«
  rationale: Die bildhafte Aussage kann Verwandtschaft, gemeinsame Abstammung und solidarische Zugehörigkeit umfassen; eine erklärende Übersetzung würde diese Spannung unnötig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feste Wendung »Gebein und Fleisch« bleibt wegen ihres bewussten Anklangs an eine Verwandtschafts- und Zugehörigkeitsformel erhalten; »doch« vermittelt die deiktisch-bekräftigende Funktion von הִנֵּה ohne Archaismus.
