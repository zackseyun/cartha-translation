    rationale: רֹאשׁ meint hier eine Führungsposition. „Anführer“ ist idiomatischer und wird im Schlusssatz konsistent wieder aufgenommen.
  - severity: low
    issue: Fußnote a nennt eine nicht streng wörtliche Übersetzung „Wörtlich“.
    rationale: Die Anmerkung sollte als lexikalische Alternative gekennzeichnet werden, nicht als Wort-für-Wort-Wiedergabe.
