  verdict: revise
  source_fidelity: 'Die Grundstruktur und der Handlungsablauf entsprechen dem Hebräischen: Davids Zusage betrifft denjenigen, der zuerst einen Jebusiter niederschlägt; Joab zieht als Erster hinauf und erhält daraufhin die Stellung des רֹאשׁ. „Erschlägt“ legt jedoch stärker als der hebräische Ausdruck נכה den Tod des einzelnen Jebusiters fest. „Niederschlägt“ gibt den kriegerischen Sinn wieder, ohne dies zusätzlich festzulegen.'
  naturalness: Der Text ist insgesamt gut verständlich und würdig. „Oberhaupt“ ist im heutigen Deutsch für die militärisch-politische Führungsstellung Joabs weniger idiomatisch und kann an ein Familien-, Staats- oder Kirchenoberhaupt denken lassen. „Anführer“ ist hier natürlicher. „Zog ... hinauf“ bewahrt die knappe, nicht weiter ausgedeutete Aussage von עלה.
  terminology: Die doppelte Amtsbezeichnung רֹאשׁ und שַׂר sollte als „Anführer und Befehlshaber“ wiedergegeben werden; im Schlusssatz steht im Hebräischen nur רֹאשׁ und daher nur „Anführer“. Die bisherige Anmerkung a ist problematisch, weil ihre als wörtlich bezeichnete Formulierung mit „Befehlshaber“ bereits eine sinngemäße, nicht streng wörtliche Wiedergabe enthält. Eine als Alternative formulierte Anmerkung behebt dies.
