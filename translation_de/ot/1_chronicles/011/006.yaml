base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/006.yaml
  text: And David said[a], “Whoever strikes down a Jebusite first shall become chief and commander.” So Joab son of Zeruiah went up first[b], and he became chief.
translation:
  language: de
  text: 'Und David sagte: „Wer zuerst einen Jebusiter niederschlägt, soll Anführer und Befehlshaber werden[a].“ Da zog Joab, der Sohn Zerujas, als Erster hinauf[b] und wurde Anführer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „soll Haupt und Oberster werden“.'
    reason: lexical_alternative
  - marker: b
    text: „Hinaufziehen“ kann hier den Aufstieg zum Angriff auf die Festung bezeichnen; der hebräische Wortlaut selbst sagt lediglich, dass Joab hinaufzog.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל מַכֵּה יְבוּסִי
  choice: Wer … einen Jebusiter erschlägt
  rationale: כָּל mit dem Partizip מַכֵּה bildet hier eine unbestimmte Relativkonstruktion („wer“). נכה bezeichnet im militärischen Zusammenhang das Niederschlagen oder Töten; „erschlägt“ gibt diese kräftige Bedeutung wieder. Der Singular יְבוּסִי wird generisch als „einen Jebusiter“ verstanden.
- source_word: בָּרִאשׁוֹנָה
  choice: zuerst / als Erster
  rationale: Die adverbiale Form bezeichnet den Vorrang bei der Handlung. Im Ausspruch klingt „zuerst“ natürlich; bei Joab verdeutlicht „als Erster“, dass er als erster Angreifer hinaufzog.
- source_word: יִהְיֶה לְרֹאשׁ וּלְשָׂר
  choice: soll Oberhaupt und Befehlshaber werden
  rationale: רֹאשׁ bezeichnet hier die führende Stellung, שַׂר einen Amtsträger beziehungsweise militärischen Befehlshaber. „Oberhaupt und Befehlshaber“ bewahrt die Zweigliedrigkeit; „werden“ gibt היה mit לְ idiomatisch wieder.
- source_word: וַיַּעַל
  choice: zog … hinauf
  rationale: עלה bedeutet wörtlich „hinaufgehen/hinaufziehen“. Im militärischen und topografischen Zusammenhang kann ein Angriff mitgemeint sein, doch die Übersetzung bewahrt die zurückhaltende Formulierung des Hebräischen.
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: Joab, der Sohn Zerujas
  rationale: Die Namen werden in ihrer geläufigen deutschen Form wiedergegeben; die Abstammungsangabe wird natürlich formuliert.
- source_word: וַיְהִי לְרֹאשׁ
  choice: und wurde Oberhaupt
  rationale: Die Formulierung greift רֹאשׁ aus der Verheißung wieder auf. Da hier nur רֹאשׁ und nicht auch שַׂר steht, wird nur „Oberhaupt“ wiederholt.
