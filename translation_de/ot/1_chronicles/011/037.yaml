lexical_decisions:
- source_word: חֶצְרוֹ
  choice: Hezro
  rationale: Der Personenname wird nach der masoretischen Form in 1. Chronik direkt ins Deutsche übertragen; die abweichende Form der Parallelliste wird nicht in den Haupttext eingetragen.
- source_word: הַכַּרְמְלִי
  choice: der Karmeliter
  rationale: Das hebräische Gentiliz mit Artikel bezeichnet einen Mann aus Karmel. „Karmeliter“ ist die knappe traditionelle Ortsbezeichnung; eine Fußnote verhindert die mögliche Verwechslung mit dem späteren Orden.
- source_word: נַעֲרַי
  choice: Naarai
  rationale: Direkte Umschrift des hebräischen Personennamens; die doppelte Vokalfolge bewahrt die erkennbare Namensform.
- source_word: בֶּן
  choice: der Sohn
  rationale: In dieser Namensliste bezeichnet בֶּן am natürlichsten die unmittelbare Sohnschaft.
- source_word: אֶזְבָּי
  choice: Esbai
  rationale: Der Personenname wird in einer im Deutschen üblichen lautnahen Form mit s für den stimmhaften hebräischen Zischlaut wiedergegeben.
