  terminology: »Helden« ist für גִּבֹּרִים im chronistischen Kontext vertretbar. Die Namen »Jaschobam« und »Hachmoni« sind konsistent transliteriert. »Erschlagene« gibt חָלָל präzise wieder, ohne die genaue Art der Tötung zusätzlich festzulegen.
