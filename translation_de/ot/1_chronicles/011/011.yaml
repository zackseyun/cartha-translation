  text: וְ/אֵ֛לֶּה מִסְפַּ֥ר הַ/גִּבֹּרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑יד יָשָׁבְעָ֣ם בֶּן חַכְמוֹנִ֗י רֹ֚אשׁ ה/שלושים הֽוּא עוֹרֵ֧ר אֶת חֲנִית֛/וֹ עַל שְׁלֹשׁ מֵא֥וֹת חָלָ֖ל בְּ/פַ֥עַם אֶחָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/011.yaml
  text: 'And these are the number of David’s mighty men: Jashobeam son of Hachmoni[a], the chief of the Thirty; he wielded his spear against three hundred slain in one encounter.'
translation:
  language: de
  text: 'Und dies ist die Zahl der Helden Davids: Jaschobam, der Sohn Hachmonis, der Anführer der Dreißig. Er schwang seinen Speer gegen dreihundert Erschlagene in einem einzigen Kampf.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפַּר
  choice: die Zahl
  rationale: Die Grundbedeutung ist »Zahl, Anzahl«. Die etwas ungewohnte Formulierung bewahrt den Wortlaut des Hebräischen, der hier eine Aufzählung einleitet.
- source_word: הַגִּבֹּרִים
  choice: die Helden
  rationale: גִּבּוֹר bezeichnet einen starken, tapferen Mann oder Kriegshelden. »Helden« ist im chronistischen Kontext würdig, knapp und verständlich.
- source_word: אֲשֶׁר לְדָוִיד
  choice: Davids
  rationale: Die mit לְ ausgedrückte Zugehörigkeit lässt sich im Deutschen natürlich durch den Genitiv wiedergeben, ohne die genaue Art der Verbindung stärker festzulegen.
- source_word: יָשָׁבְעָם בֶּן חַכְמוֹנִי
  choice: Jaschobam, der Sohn Hachmonis
  rationale: Der Personenname wird deutsch transliteriert; die ausdrücklich genannte Abstammungsangabe bleibt erhalten.
- source_word: רֹאשׁ הַשלושים
  choice: das Oberhaupt der Dreißig
  rationale: רֹאשׁ bedeutet wörtlich »Kopf« und bezeichnet hier den ranghöchsten Angehörigen oder Leiter. »Die Dreißig« wird als Gruppenbezeichnung bewahrt.
- source_word: עוֹרֵר אֶת חֲנִיתוֹ
  choice: Er schwang seinen Speer
  rationale: עורר bedeutet grundsätzlich »wecken, aufreizen, in Bewegung setzen«. Mit חֲנִית bezeichnet es idiomatisch den kämpferischen Einsatz des Speers; »schwang« bleibt bildhaft, ohne eine einzelne Wurf- oder Stoßbewegung festzulegen.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: gegen dreihundert Erschlagene
  rationale: עַל bezeichnet die feindliche Ausrichtung, und חָלָל meint im Kampf Gefallene bzw. Erschlagene. Die kompakte, ergebnisorientierte Ausdrucksweise des Hebräischen bleibt erhalten.
- source_word: בְּפַעַם אֶחָת
  choice: in einem einzigen Kampf
  rationale: Wörtlich heißt die Wendung »bei einem Mal«. Im militärischen Zusammenhang gibt »in einem einzigen Kampf« eine einmalige Kampfbegegnung natürlich wieder, ohne einen einzigen körperlichen Schlag zu behaupten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Bildsprache und die knappe Listenform des Hebräischen bleiben erhalten. Die im masoretischen Text erkennbare Spannung zwischen der geschriebenen Form und der traditionellen Lesung bei »Dreißig« wird nicht stillschweigend aufgelöst, sondern in einer Fußnote offengelegt.
