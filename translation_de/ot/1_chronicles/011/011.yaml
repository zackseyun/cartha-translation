  source_fidelity: 'Der Vers wird im Wesentlichen zutreffend wiedergegeben: Jaschobam wird als Sohn Hachmonis und als Oberhaupt einer als »die Dreißig« bezeichneten Gruppe vorgestellt; die Speerhandlung, die dreihundert Erschlagenen und die Einmaligkeit des Vorgangs bleiben erhalten. Die Fußnote führt jedoch eine nicht durch den angegebenen WLC-Text gestützte Alternative »die Drei« ein und sollte entfernt werden.'
