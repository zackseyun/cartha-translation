source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ כָּל זִקְנֵ֨י יִשְׂרָאֵ֤ל אֶל הַ/מֶּ֨לֶךְ֙ חֶבְר֔וֹנָ/ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם דָּוִ֥יד בְּרִ֛ית בְּ/חֶבְר֖וֹן לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּמְשְׁח֨וּ אֶת דָּוִ֤יד לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל כִּ/דְבַ֥ר יְהוָ֖ה בְּ/יַד שְׁמוּאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and David made a covenant with them at Hebron before Yahweh. Then they anointed David king over Israel, according to the word of Yahweh by Samuel.
translation:
  language: de
  text: So kamen alle Ältesten Israels zum König nach Hebron, und David schloss mit ihnen in Hebron vor Jahwe einen Bund. Dann salbten sie David zum König über Israel, nach dem Wort Jahwes durch Samuel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand Samuels“; eine hebräische Wendung im Sinn von „durch Samuel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: Ältesten
  rationale: Bezeichnet die anerkannten Repräsentanten Israels und entspricht dem konkreten gesellschaftlich-politischen Amt besser als das allgemeinere „Führer“.
- source_word: חֶבְרוֹנָה
  choice: nach Hebron
  rationale: Die Richtungsendung bezeichnet hier eine Bewegung nach Hebron; im Deutschen lässt sich dies natürlich und zugleich genauer wiedergeben.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: schloss ... einen Bund
  rationale: Die wörtliche Wendung „einen Bund schneiden“ wird im modernen Deutschen idiomatisch mit „einen Bund schließen“ wiedergegeben.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Bewahrt knapp den feierlichen Gedanken, dass der Bund in Gottes Gegenwart und unter seiner Bezeugung geschlossen wurde.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen stehenden Gottesnamen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיִּמְשְׁחוּ
  choice: salbten sie
  rationale: Der Ausdruck bezeichnet konkret die Salbung bei der Einsetzung in das Königsamt.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: zum König über Israel
  rationale: Gibt sowohl die Einsetzung zum König als auch den Herrschaftsbereich präzise und idiomatisch wieder.
- source_word: כִּדְבַר יְהוָה
  choice: nach dem Wort Jahwes
  rationale: Bewahrt den direkten Bezug auf das von Jahwe ausgesprochene Wort, ohne es enger als „Verheißung“ auszulegen.
- source_word: בְּיַד שְׁמוּאֵל
  choice: durch Samuel
  rationale: Die hebräische Wendung lautet wörtlich „durch die Hand Samuels“ und bezeichnet Samuel als Vermittler des göttlichen Wortes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen Gottes. „Jahwe“ wahrt diese Namensfunktion, während „der HERR“ den Namen durch einen Titel ersetzt.
- issue: Vermittlung des Wortes Jahwes durch Samuel
  choice: durch Samuel
  alternative: von Samuel
  rationale: „Durch Samuel“ hält fest, dass das Wort von Jahwe stammt und Samuel dessen menschlicher Vermittler ist, ohne die Wendung unnötig auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge und die wiederholte Ortsangabe folgen dem Hebräischen; das einleitende „So“ stellt den erzählerischen Anschluss her.
