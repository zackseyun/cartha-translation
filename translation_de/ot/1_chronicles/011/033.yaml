lexical_decisions:
- source_word: עַזְמָוֶת
  choice: Asmawet
  rationale: Der Personenname wird nach den üblichen Regeln für hebräische Namen im Deutschen transliteriert; die Wiedergabe mit w entspricht dem hebräischen ו als Konsonant.
- source_word: הַבַּחֲרוּמִי
  choice: der Baharumiter
  rationale: Das mit Artikel versehene Herkunftswort wird als Herkunftsbezeichnung wiedergegeben. „Baharumiter“ folgt der masoretischen Vokalisierung, ohne die mögliche Beziehung zu Bahurim im Haupttext festzulegen.
- source_word: אֶלְיַחְבָּא
  choice: Eljachba
  rationale: Der Personenname wird direkt aus dem Hebräischen transliteriert; „j“ gibt den Jod-Laut und „ch“ den Kehllaut ח wieder.
- source_word: הַשַּׁעַלְבֹנִי
  choice: der Schaalboniter
  rationale: Die Herkunftsbezeichnung mit Artikel wird knapp und listenartig wiedergegeben. „Schaalboniter“ folgt der Form des masoretischen Textes.
