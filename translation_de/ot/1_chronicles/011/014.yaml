source:
  edition: WLC
  text: וַ/יִּֽתְיַצְּב֤וּ בְ/תוֹךְ הַ/חֶלְקָה֙ וַ/יַּצִּיל֔וּ/הָ וַ/יַּכּ֖וּ אֶת פְּלִשְׁתִּ֑ים וַ/יּ֥וֹשַׁע יְהוָ֖ה תְּשׁוּעָ֥ה גְדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/014.yaml
  text: And they took their stand in the middle of the plot and delivered it[a], and they struck down the Philistines, and Yahweh saved by a great victory.
translation:
  language: de
  text: Sie stellten sich mitten auf dem Feldstück auf, retteten es und schlugen die Philister. Und Jahwe schenkte einen großen Sieg.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jahwe bewirkte eine große Rettung« beziehungsweise »eine große Befreiung«.'
    reason: Das hebräische תְּשׁוּעָה kann je nach Betonung „Sieg“, „Rettung“ oder „Befreiung“ bedeuten.
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: sie stellten sich … auf
  rationale: Das Hitpael von יצב bezeichnet das bewusste Einnehmen und Behaupten einer Position; die deutsche Wendung passt zum militärischen Zusammenhang.
- source_word: בְתוֹךְ הַחֶלְקָה
  choice: mitten auf dem Feldstück
  rationale: תוך bezeichnet die Mitte, חלקה hier ein abgegrenztes Stück Ackerland. „Feldstück“ ist genauer als das allgemeinere „Feld“.
- source_word: וַיַּצִּילוּהָ
  choice: retteten es
  rationale: נצל bedeutet retten oder entreißen. Das feminine Suffix bezieht sich auf חלקה, das Feldstück; im Deutschen wird der Bezug mit dem sächlichen Pronomen „es“ wiedergegeben.
- source_word: וַיַּכּוּ אֶת־פְּלִשְׁתִּים
  choice: schlugen die Philister
  rationale: נכה bezeichnet im Kampf das Schlagen beziehungsweise vernichtende Besiegen. „Schlugen“ bewahrt sowohl die knappe Form als auch die militärische Aussage.
- source_word: וַיּוֹשַׁע יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: Jahwe schenkte einen großen Sieg
  rationale: Die Verbindung aus ישׁע und תשועה ist eine figura etymologica und besagt, dass Jahwe eine große Rettung beziehungsweise einen großen Sieg bewirkte. „Schenkte einen großen Sieg“ gibt den militärischen Sinn in natürlichem Deutsch wieder, ohne ein im Hebräischen unausgesprochenes Objekt einzufügen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den Gottesnamen; „Jahwe“ wahrt seinen Charakter als Eigenname.
- issue: Bedeutung von תְּשׁוּעָה im militärischen Zusammenhang
  choice: Sieg
  alternative: Rettung oder Befreiung
  rationale: Im unmittelbaren Kampfzusammenhang bezeichnet das Wort den von Jahwe bewirkten Sieg. Die breitere Bedeutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung der hebräischen Erzählformen bleibt weitgehend erhalten; ein Satzpunkt vor der abschließenden Aussage hebt Jahwes entscheidendes Handeln hervor. Der ungewöhnliche Bezug des Rettens auf das Feldstück wird nicht geglättet.
