  text: בְּֽנֵי אֵ֔צֶר בִּלְהָ֥ן וְ/זַעֲוָ֖ן יַעֲקָ֑ן בְּנֵ֥י דִישׁ֖וֹן ע֥וּץ וַ/אֲרָֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/042.yaml
  text: 'The sons of Ezer: Bilhan[a], Zaavan, and Jaakan[b]. The sons of Dishon: Uz and Aran.'
translation:
  language: de
  text: 'Die Söhne Ezers: Bilhan, Saawan[a] und Jaakan[b]. Die Söhne Dischons: Uz und Aran.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Saawan; in der parallelen Genealogie in 1. Mose 36,27 steht Sawan.
    reason: alternative_reading
  - marker: b
    text: In der parallelen Genealogie in 1. Mose 36,27 steht Akan.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der Status constructus des Plurals von בֵּן leitet jeweils eine genealogische Liste ein. »Söhne« ist hier direkter und genauer als das weiter gefasste »Nachkommen«.
- source_word: אֵצֶר
  choice: Ezer
  rationale: Der Personenname wird in seiner im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: בִּלְהָן
  choice: Bilhan
  rationale: Lautnahe Wiedergabe des hebräischen Personennamens.
- source_word: זַעֲוָן
  choice: Saawan
  rationale: Lautnahe, an deutsche Schreibgewohnheiten angepasste Wiedergabe des hebräischen Namens; das doppelte a macht die zwei durch Ajin getrennten Vokale erkennbar.
- source_word: יַעֲקָן
  choice: Jaakan
  rationale: Lautnahe deutsche Wiedergabe der in der Chronik vorliegenden Namensform.
- source_word: דִישׁוֹן
  choice: Dischon
  rationale: Die Schreibweise mit »sch« entspricht deutschen Lautkonventionen und unterscheidet den Namen von Dischan.
- source_word: עוּץ
  choice: Uz
  rationale: Die traditionelle und gut erkennbare deutsche Form des Namens wird beibehalten.
- source_word: אֲרָן
  choice: Aran
  rationale: Lautnahe Wiedergabe des hebräischen Personennamens.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles genealogisches Deutsch. Die elliptische Struktur des Hebräischen bleibt durch Nominalsätze mit Doppelpunkt erhalten. Die in der englischen Konsultationsfassung an Bilhan gesetzte Anmerkung zu Saawan wurde nicht übernommen, da der masoretische Text in 1. Mose 36,27 für Saawan dieselbe hebräische Namensform bietet; die tatsächliche Namensvariante Jaakan/Akan wird dagegen vermerkt.
