id: 1CH.1.19
reference: 1 Chronicles 1:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/019.yaml
  text: 'And to Eber were born two sons: the name of the one was Peleg[a], because in his days the earth was divided; and his brother’s name was Joktan.'
translation:
  language: de
  text: 'Und Eber wurden zwei Söhne geboren: Der eine hieß Peleg[a], denn zu seiner Zeit wurde die Erde geteilt; sein Bruder hieß Joktan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land wurde geteilt“. Das hebräische Wort kann sowohl die ganze Erde als auch ein Land oder Gebiet bezeichnen; worin die Teilung bestand, sagt der Text nicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֵבֶר
  choice: Und Eber
  rationale: Die Verbindung aus Konjunktion und Präposition wird im Deutschen zusammen mit dem Passiv natürlich als „Und Eber wurden … geboren“ wiedergegeben und bewahrt den genealogischen Fortgang.
- source_word: יֻלַּד שְׁנֵי בָנִים
  choice: wurden zwei Söhne geboren
  rationale: Das passive יֻלַּד wird sinngemäß mit dem pluralischen Subjekt „zwei Söhne“ wiedergegeben; „zeugen“ würde die hebräische Konstruktion unnötig ins Aktiv verschieben.
- source_word: שֵׁם הָאֶחָד
  choice: Der eine hieß
  rationale: Dies gibt die Unterscheidung zwischen den beiden Söhnen natürlich wieder, ohne הָאֶחָד als „der erste“ zu interpretieren.
- source_word: פֶּלֶג
  choice: Peleg
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: כִּי בְיָמָיו
  choice: denn zu seiner Zeit
  rationale: כִּי führt hier die Erklärung für den Namen Peleg ein; die Wendung ist in modernem Deutsch natürlich und bewahrt den begründenden Zusammenhang.
- source_word: נִפְלְגָה הָאָרֶץ
  choice: wurde die Erde geteilt
  rationale: Das Verb bezeichnet ein Geteiltwerden. הָאָרֶץ kann „Erde“ oder „Land“ bedeuten; im Haupttext bleibt mit „Erde“ die breitere traditionelle Lesart erhalten, während die Alternative in der Fußnote genannt wird.
- source_word: וְשֵׁם אָחִיו יָקְטָן
  choice: sein Bruder hieß Joktan
  rationale: Die knappe deutsche Form gibt die Besitzbeziehung und die Namensangabe natürlich wieder.
theological_decisions:
- issue: Bedeutung der Teilung zur Zeit Pelegs
  choice: „die Erde wurde geteilt“, ohne die Art der Teilung zu bestimmen
  alternative: „das Land wurde geteilt“ oder eine ausdrückliche Deutung als Teilung von Völkern, Sprachen oder geografischen Gebieten
  rationale: Der hebräische Text lässt sowohl den Bezugsbereich von הָאָרֶץ als auch die Art der Teilung offen. Die Übersetzung wahrt diese interpretative und theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher genealogischer Satzführung. Die knappe Form „Der eine hieß …; sein Bruder hieß …“ vermeidet unnötig hölzerne Nominalkonstruktionen und fügt keine über den Ausgangstext hinausgehende Deutung ein.
