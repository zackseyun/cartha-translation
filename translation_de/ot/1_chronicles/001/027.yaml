- source_word: הוּא
  choice: das ist
  rationale: Das selbstständige Pronomen bedeutet wörtlich »er«; zwischen zwei Namen dient es hier jedoch der Gleichsetzung beziehungsweise erklärenden Identifikation. »Das ist« gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Der Personenname wird in seiner etablierten deutschen biblischen Form wiedergegeben; der Vers identifiziert Abram mit Abraham.
theological_decisions:
- issue: Wiedergabe des verblosen Identifikationssatzes im Stammbaum
  choice: Abram – das ist Abraham.
  alternative: Abram, er ist Abraham. / Abram ist Abraham.
  rationale: Im Hebräischen stehen die beiden Eigennamen in einem Nominalsatz, verbunden durch הוּא. Die gewählte Form bringt die erklärende Identifikation idiomatisch zum Ausdruck, ohne eine zusätzliche theologische Aussage einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Stammbaumformulierung. Der Gedankenstrich kennzeichnet die erklärende Gleichsetzung der beiden Namen.
