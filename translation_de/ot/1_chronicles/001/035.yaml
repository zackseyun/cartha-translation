lexical_decisions:
- source_word: בְּנֵי עֵשָׂו
  choice: Die Söhne Esaus
  rationale: Der Status constructus bezeichnet hier in einer unmittelbaren genealogischen Aufzählung die leiblichen Söhne Esaus; „Söhne“ ist daher genauer als das weiter gefasste „Nachkommen“.
- source_word: אֱלִיפַז
  choice: Elifas
  rationale: Eine im Deutschen geläufige, dem hebräischen Namen eng entsprechende Namensform.
- source_word: רְעוּאֵל
  choice: Reuël
  rationale: Die Form gibt die hebräischen Bestandteile des Namens unmittelbar wieder; das Trema zeigt im Deutschen an, dass u und e getrennt gesprochen werden.
- source_word: וִיעוּשׁ
  choice: Jëusch
  rationale: Deutsche Transliteration des Personennamens; das Trema verhindert, dass „Jeu“ als eine einzige Lautverbindung gelesen wird. Die vorangestellte Konjunktion wird durch die deutsche Reihensyntax wiedergegeben.
- source_word: וְיַעְלָם
  choice: Jalam
  rationale: Gängige deutsche Wiedergabe des hebräischen Personennamens יַעְלָם.
- source_word: וְקֹרַח
  choice: und Korach
  rationale: „Korach“ gibt den abschließenden hebräischen Reibelaut ח in deutscher Bibeltradition erkennbar wieder; die Konjunktion markiert das letzte Glied der Aufzählung.
