source:
  edition: WLC
  text: בְּנֵ֖י אֱלִיפָ֑ז תֵּימָ֤ן וְ/אוֹמָר֙ צְפִ֣י וְ/גַעְתָּ֔ם קְנַ֖ז וְ/תִמְנָ֥ע וַ/עֲמָלֵֽק׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/036.yaml
  text: 'The sons of Eliphaz: Teman[a], Omar, Zephi, Gatam, Kenaz, Timna[b], and Amalek.'
translation:
  language: de
  text: 'Die Söhne Elifas'': Teman, Omar, Zefi[a], Gatam, Kenas, Timna[b] und Amalek.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier Zefi; in 1. Mose 36,11 lautet der Name Zefo.
    reason: textual_variant
  - marker: b
    text: Nach 1. Mose 36,12 war Timna eine Nebenfrau Elifas' und Amalek ihr Sohn. Hier führt die Chronik beide Namen in der Liste der Söhne Elifas' auf.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Der Status constructus im Plural leitet eine genealogische Namensliste ein. „Söhne“ gibt die konkrete Verwandtschaftsbezeichnung direkt wieder; „Nachkommen“ wäre weiter gefasst.
- source_word: אֱלִיפָז
  choice: Elifas
  rationale: Für den Personennamen wird die im Deutschen etablierte biblische Namensform verwendet.
- source_word: תֵּימָן
  choice: Teman
  rationale: Transliteration des Personennamens in gebräuchlicher deutscher Form.
- source_word: אוֹמָר
  choice: Omar
  rationale: Direkte Wiedergabe des Personennamens.
- source_word: צְפִי
  choice: Zefi
  rationale: Die Form des masoretischen Textes in diesem Vers wird mit einer für deutsche Leser natürlichen Umschrift wiedergegeben. Die abweichende Form in 1. Mose 36,11 wird in einer Fußnote genannt.
- source_word: גַעְתָּם
  choice: Gatam
  rationale: Gut lesbare deutsche Umschrift des Personennamens; der Kehllaut wird nicht eigens markiert.
- source_word: קְנַז
  choice: Kenas
  rationale: Etablierte deutsche Wiedergabe des Personennamens.
- source_word: תִמְנָע
  choice: Timna
  rationale: Die vokalisierte Namensform des Verses wird direkt wiedergegeben.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Etablierte deutsche Wiedergabe des Personen- und Stammvatersnamens.
- source_word: וְ / וַ
  choice: Kommas und „und“ vor dem letzten Namen
  rationale: Die wiederholten hebräischen Bindewörter werden in natürlicher deutscher Listenform wiedergegeben, ohne die Struktur der Aufzählung zu verändern.
theological_decisions:
- issue: Das genealogische Verhältnis von Timna und Amalek im Vergleich zu 1. Mose 36,12
  choice: Timna und Amalek stehen beide im Haupttext innerhalb der Liste der Söhne Elifas'.
  alternative: Timna als Nebenfrau Elifas' und Amalek als ihren Sohn einordnen, um den Wortlaut an 1. Mose 36,12 anzugleichen.
  rationale: Der Wortlaut der Chronik bietet nach „Die Söhne Elifas'“ eine ununterbrochene Namensliste. Diese Spannung zum Parallelbericht wird nicht harmonisierend aufgelöst, sondern in einer Fußnote offengelegt.
translation_notes:
  register: Moderne, klare und würdevolle Standardsprache. Die knappe genealogische Satzform des Hebräischen bleibt erhalten. Die Namensformen folgen gebräuchlichen deutschen Bibelkonventionen; erklärungsbedürftige Abweichungen und die Spannung zum Genesisbericht stehen in Fußnoten.
