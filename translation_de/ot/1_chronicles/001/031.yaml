lexical_decisions:
- source_word: יְטוּר
  choice: Jetur
  rationale: Der Personenname wird in der im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: נָפִישׁ
  choice: Nafisch
  rationale: Der Personenname wird nach geläufiger deutscher Bibelkonvention transkribiert; שׁ erscheint als „sch“.
- source_word: וָ/קֵדְמָה
  choice: und Kedma
  rationale: Die Konjunktion ו wird mit „und“ wiedergegeben; der Personenname קֵדְמָה folgt der geläufigen deutschen Form „Kedma“.
- source_word: אֵלֶּה הֵם
  choice: Das waren
  rationale: Die hebräische Identifikationskonstruktion enthält kein ausdrücklich markiertes Tempus. Im rückblickenden genealogischen Zusammenhang ist „Das waren“ natürlich und sinngenau.
- source_word: בְּנֵי
  choice: Söhne
  rationale: Hier werden die männlichen Nachkommen Ismaels aufgezählt; daher ist die konkrete Bedeutung „Söhne“ angemessener als das allgemeinere „Kinder“ oder „Nachkommen“.
- source_word: יִשְׁמָעֵאל
  choice: Ismaels
  rationale: Der Name wird in seiner etablierten deutschen Form wiedergegeben; der Genitiv bildet die hebräische Konstruktverbindung natürlich ab.
