base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/005.yaml
  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: de
  text: 'Die Söhne[a] Jafets: Gomer, Magog, Madai, Jawan, Tubal, Meschech und Tiras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Söhne“ kann in genealogischen Zusammenhängen sowohl unmittelbare Söhne als auch Nachkommen im weiteren Sinn bezeichnen; hier leitet es die Linie Jafets in Listenform ein.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der Status constructus im Plural leitet eine genealogische Liste ein. „Söhne“ gibt die Form genau und im Deutschen natürlich wieder; je nach genealogischem Zusammenhang kann das hebräische Wort auch weiter gefasste Nachkommen bezeichnen.
- source_word: יֶפֶת
  choice: Jafet
  rationale: Personenname in der im Deutschen üblichen biblischen Schreibweise.
- source_word: גֹּמֶר
  choice: Gomer
  rationale: Eigenname; er wird transliteriert und nicht gedeutet.
- source_word: מָגוֹג
  choice: Magog
  rationale: Eigenname; er wird in der etablierten deutschen Form wiedergegeben.
- source_word: מָדַי
  choice: Madai
  rationale: Der genealogische Eigenname wird transliteriert, statt ihn im Haupttext ethnisch als „Meder“ zu deuten.
- source_word: יָוָן
  choice: Jawan
  rationale: Eigenname in üblicher deutscher biblischer Schreibung; die Verbindung mit Ionien beziehungsweise Griechenland wird nicht interpretierend in den Text aufgenommen.
- source_word: תֻבָל
  choice: Tubal
  rationale: Eigenname; transliteriert.
- source_word: מֶשֶׁךְ
  choice: Meschech
  rationale: Eigenname in der üblichen deutschen Umschrift.
- source_word: תִירָס
  choice: Tiras
  rationale: Eigenname; transliteriert.
- source_word: וְ / וּ
  choice: Kommas und „und“ vor dem letzten Namen
  rationale: Das Hebräische verbindet fast alle Listenglieder mit einer Konjunktion. Die deutsche Aufzählungsform mit Kommas und abschließendem „und“ bewahrt die Funktion und klingt natürlich.
theological_decisions: []
