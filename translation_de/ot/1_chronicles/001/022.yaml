lexical_decisions:
- source_word: וְ/אֶת
  choice: und / Aufzählungszeichen nicht eigens wiedergegeben
  rationale: Die Verbindung aus וְ und dem Akkusativmarker אֶת führt jedes Glied der genealogischen Aufzählung ein. Im Deutschen werden die wiederholten Objektmarker nicht abgebildet; die Reihung wird durch Kommas und „und“ natürlich wiedergegeben.
- source_word: עֵיבָל
  choice: Ebal
  rationale: Der Personenname wird entsprechend der hebräischen Form transliteriert. Die abweichende Namensform „Obal“ in der Parallelgenealogie von 1. Mose 10,28 wird in einer Fußnote bewahrt.
- source_word: אֲבִימָאֵל
  choice: Abimaël
  rationale: Der Personenname wird aus dem Hebräischen transliteriert. Das Trema verdeutlicht im Deutschen, dass a und e getrennt gesprochen werden.
- source_word: שְׁבָא
  choice: Saba
  rationale: Für שְׁבָא wird die im Deutschen etablierte biblische Namensform „Saba“ verwendet; der ähnlich klingende Name „Seba“ steht andernorts für eine andere hebräische Schreibung.
