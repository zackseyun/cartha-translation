  text: וְ/אַרְפַּכְשַׁ֖ד יָלַ֣ד אֶת שָׁ֑לַח וְ/שֶׁ֖לַח יָלַ֥ד אֶת עֵֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/018.yaml
  text: Arpachshad fathered Shelah[b][a], and Shelah fathered Eber.
translation:
  language: de
  text: Arpachschad zeugte Schelach[a], und Schelach zeugte Eber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Schelach; in manchen Übersetzungen und verwandten genealogischen Stellen findet sich die traditionelle Form „Salah“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְפַּכְשַׁד
  choice: Arpachschad
  rationale: Direkte, im Deutschen gut lesbare Umschrift der hebräischen Namensform; sie bewahrt den Schlussbestandteil -schad und vermeidet die griechisch beeinflusste Form Arphaxad.
- source_word: יָלַד
  choice: zeugte
  rationale: Im männlichen Stammbaum bezeichnet das Verb die Hervorbringung eines Nachkommen. „Zeugte“ ist knapp, idiomatisch und für genealogische Formeln im Deutschen angemessen, ohne die Aussage auf eine unmittelbar folgende Generation zu verengen.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: Der hebräische Akkusativmarker besitzt keine eigenständige deutsche Entsprechung; seine Funktion wird durch den deutschen Satzbau ausgedrückt.
- source_word: שָׁלַח / שֶׁלַח
  choice: Schelach
  rationale: Beide masoretischen Vokalisierungen bezeichnen hier dieselbe Person und werden einheitlich mit der hebräischen Namensform „Schelach“ wiedergegeben. Die traditionelle Variante „Schela“ wird in einer Fußnote genannt.
- source_word: עֵבֶר
  choice: Eber
  rationale: Gängige und präzise deutsche Umschrift der hebräischen Namensform עֵבֶר.
theological_decisions:
- issue: Reichweite der genealogischen Aussage von יָלַד
  choice: Die knappe Formel „zeugte“ wird beibehalten, ohne ausdrücklich „war der Vater von“ zu sagen.
  alternative: „wurde der Vater von“
  rationale: Hebräische Genealogien können Abstammung ausdrücken, ohne in jedem Fall unmittelbare biologische Vaterschaft festzulegen. Die traditionelle genealogische Formel wahrt diese mögliche Offenheit.
translation_notes:
  register: Moderne standarddeutsche, zugleich würdige genealogische Formulierung. Die Eigennamen folgen möglichst unmittelbar den hebräischen Formen; unnötig gräzisierte oder ältere Varianten werden nicht in den Haupttext aufgenommen.
