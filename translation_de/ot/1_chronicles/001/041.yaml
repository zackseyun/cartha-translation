  register: Knappe, würdige und gut verständliche genealogische Prosa. Die Satzfragmente und das einleitende „Und“ bewahren die Listenstruktur des Hebräischen; die Namen sind nach modernen deutschen Transliterationsgewohnheiten wiedergegeben.
