source:
  edition: WLC
  text: בְּנֵ֥י עֲנָ֖ה דִּישׁ֑וֹן וּ/בְנֵ֣י דִישׁ֔וֹן חַמְרָ֥ן וְ/אֶשְׁבָּ֖ן וְ/יִתְרָ֥ן וּ/כְרָֽןס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/041.yaml
  text: 'The sons of Anah: Dishon. And the sons of Dishon: Hamran[a], Eshban, Ithran, and Keran.'
translation:
  language: de
  text: 'Die Söhne Anas: Dischon. Und die Söhne Dischons: Hamran[a], Eschban, Jitran und Keran.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der parallelen Geschlechtsliste in 1. Mose 36,26 steht „Hemdan“ statt „Hamran“. Der Haupttext folgt hier dem masoretischen Text von 1. Chronik.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der Status constructus Plural von בן bezeichnet in dieser unmittelbaren genealogischen Aufzählung am natürlichsten „die Söhne“. Dies entspricht der männlichen und konkreten Form des Hebräischen.
- source_word: עֲנָה
  choice: Ana
  rationale: Der Personenname wird in einer im Deutschen geläufigen bibelnahen Form wiedergegeben.
- source_word: דִּישׁוֹן
  choice: Dischon
  rationale: Der Personenname wird nach deutscher Laut- und Schreibkonvention transliteriert. Dieselbe Form bleibt für den Sohn Anas und den Vater der folgenden vier Personen erhalten.
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Das vorangestellte ו wird als „Und“ wiedergegeben und bewahrt so die fortlaufende Struktur der Geschlechtsliste.
- source_word: חַמְרָן
  choice: Hamran
  rationale: Der Haupttext folgt dem masoretischen Wortlaut von 1. Chronik, der חַמְרָן liest. Die abweichende Form der Parallelstelle wird in einer Fußnote bewahrt.
- source_word: אֶשְׁבָּן
  choice: Eschban
  rationale: Direkte, für deutsche Leser aussprechbare Transliteration des Personennamens.
- source_word: יִתְרָן
  choice: Jitran
  rationale: Die Wiedergabe mit „J“ entspricht der modernen deutschen Aussprache des hebräischen anlautenden Jod und bleibt nahe an der hebräischen Form.
- source_word: כְרָן
  choice: Keran
  rationale: Direkte Transliteration des Personennamens; das vorangestellte ו wird durch „und“ vor dem letzten Glied der Liste wiedergegeben.
theological_decisions: []
