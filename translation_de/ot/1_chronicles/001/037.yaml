  text: 'Die Söhne Reguëls: Nahat, Serach, Schamma und Missa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Die Konstruktusform des Plurals von בֵּן leitet hier eine Liste unmittelbarer männlicher Nachkommen ein; »Söhne« ist in diesem genealogischen Zusammenhang die direkte und natürliche Wiedergabe.
- source_word: רְעוּאֵל
  choice: Reguël
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Schreibweise wiedergegeben; das Trema macht die getrennte Aussprache der Vokale kenntlich.
- source_word: נַחַת
  choice: Nahat
  rationale: Der Personenname wird transliteriert und nicht nach einer möglichen Wortbedeutung übersetzt.
- source_word: זֶרַח
  choice: Serach
  rationale: Der Personenname wird gemäß einer gebräuchlichen deutschen Umschrift wiedergegeben; seine mögliche lexikalische Bedeutung wird nicht in den Text eingetragen.
- source_word: שַׁמָּה
  choice: Schamma
  rationale: Der Personenname wird in einer natürlichen deutschen Umschrift wiedergegeben.
- source_word: וּ/מִזָּה
  choice: und Missa
  rationale: Die Konjunktion וּ wird mit »und« wiedergegeben; der Personenname מִזָּה erhält eine deutsche Umschrift, wobei der verdoppelte Konsonant berücksichtigt wird.
