lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: Die Söhne Midians
  rationale: Die hebräische Konstruktverbindung wird im Deutschen natürlich mit Genitiv wiedergegeben. Das einleitende וּ wird in der fortlaufenden genealogischen Aufzählung nicht eigens mit „und“ übersetzt.
- source_word: עֵיפָה
  choice: Efa
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Eigennamens.
- source_word: וָעֵפֶר
  choice: Efer
  rationale: Gebräuchliche deutsche Wiedergabe des Eigennamens; die hebräische Konjunktion wird durch die deutsche Listenstruktur ausgedrückt.
- source_word: וַחֲנוֹךְ
  choice: Henoch
  rationale: Im Deutschen etablierte biblische Namensform; eine quellennähere Umschrift wäre „Chanok“.
- source_word: וַאֲבִידָע
  choice: Abida
  rationale: Etablierte deutsche Form des Eigennamens.
- source_word: וְאֶלְדָּעָה
  choice: und Eldaa
  rationale: Der abschließende Listenpunkt gibt die hebräische Konjunktion idiomatisch mit „und“ wieder.
- source_word: כָּל אֵלֶּה
  choice: Sie alle
  rationale: Natürliche deutsche Zusammenfassung der zuvor genannten Personen.
- source_word: בְּנֵי קְטוּרָה
  choice: waren Söhne Keturas
  rationale: Die Konstruktverbindung wird mit Genitiv wiedergegeben; „waren“ wird für einen vollständigen deutschen Satz ergänzt.
