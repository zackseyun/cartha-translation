base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/033.yaml
  text: 'The sons of Midian: Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.'
translation:
  language: de
  text: 'Die Söhne Midians: Efa, Efer, Henoch[a], Abida und Eldaa. Sie alle waren Söhne Keturas.'
  philosophy: optimal-equivalence
  footnotes:
