lexical_decisions:
- source_word: אַלּוּף
  choice: Oberhaupt
  rationale: Im Zusammenhang der edomitischen Geschlechterlisten bezeichnet das Wort den Leiter eines Stammes oder einer Sippe. »Oberhaupt« ist knapp, gegenwartsnah und vermeidet die feudalen Assoziationen von »Fürst« oder »Herzog«.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Der Eigenname wird nach der im Deutschen üblichen biblischen Form transliteriert und nicht übersetzt.
- source_word: אֵלָה
  choice: Ela
  rationale: Der Eigenname wird unmittelbar aus dem Hebräischen transliteriert.
- source_word: פִּינֹן
  choice: Pinon
  rationale: Der Eigenname wird unmittelbar aus dem hebräischen Konsonantenbestand transliteriert.
