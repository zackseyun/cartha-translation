  text: וּ/בְנֵ֣י כ֔וּשׁ סְבָא֙ וַ/חֲוִילָ֔ה וְ/סַבְתָּ֥א וְ/רַעְמָ֖א וְ/סַבְתְּכָ֑א וּ/בְנֵ֥י רַעְמָ֖א שְׁבָ֥א וּ/דְדָֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/009.yaml
  text: 'The sons of Cush: Seba[a], Havilah, Sabta, Raama, and Sabteca[c][b]. And the sons of Raama: Sheba and Dedan.'
translation:
  language: de
  text: 'Die Söhne Kuschs: Seba, Hawila, Sabta, Ragma und Sabtecha. Und die Söhne Ragmas: Scheba und Dedan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי כוּשׁ
  choice: Die Söhne Kuschs
  rationale: Die genealogische Formel wird sachlich mit „Söhne“ wiedergegeben; das einleitende וּ dient hier der Listenfortführung und muss im Deutschen nicht eigens mit „und“ erscheinen.
- source_word: סְבָא
  choice: Seba
  rationale: Eingebürgerte deutsche Umschrift des Eigennamens.
- source_word: חֲוִילָה
  choice: Hawila
  rationale: Die Wiedergabe mit „w“ folgt der üblichen deutschen Laut- und Schreibkonvention für den hebräischen Konsonanten ו.
- source_word: סַבְתָּא
  choice: Sabta
  rationale: Direkte Umschrift des Eigennamens ohne einen im Hebräischen nicht vorhandenen zusätzlichen Endkonsonanten.
- source_word: רַעְמָא
  choice: Ragma
  rationale: Die in deutschen Bibeln geläufige Form bewahrt den hörbaren Guttural durch „g“ und unterscheidet den Namen von Rama.
- source_word: סַבְתְּכָא
  choice: Sabtecha
  rationale: Deutsche Umschrift, in der כ mit „ch“ wiedergegeben wird; der auslautende Vokal bleibt erhalten.
- source_word: וּבְנֵי רַעְמָא
  choice: Und die Söhne Ragmas
  rationale: Das וּ wird beibehalten, weil es innerhalb des Verses einen neuen genealogischen Unterzweig einführt; „Söhne“ wahrt die wiederholte Formel.
- source_word: שְׁבָא
  choice: Scheba
  rationale: Deutsche Umschrift des anlautenden שׁ mit „sch“.
- source_word: דְדָן
  choice: Dedan
  rationale: Direkte und im Deutschen geläufige Umschrift des Eigennamens.
