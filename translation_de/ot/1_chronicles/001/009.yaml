  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die zweigliedrige genealogische Struktur präzise wieder: zunächst die Söhne Kuschs, dann die Söhne Ragmas. Das einleitende וּ wird im Deutschen beim ersten Glied idiomatisch nicht wiederholt, beim zweiten Unterzweig dagegen passend als „Und“ wiedergegeben. Alle genannten Eigennamen sind vorhanden und in der richtigen Reihenfolge.'
  naturalness: '„Die Söhne Kuschs: … Und die Söhne Ragmas: …“ ist knappes, klares und modernes Standarddeutsch, das dem listenartigen Register des hebräischen Textes entspricht.'
  terminology: „Söhne“ wahrt die genealogische Formulierung ohne unzulässige Ausweitung zu „Nachkommen“. Die Namensformen Seba, Hawila, Sabta, Ragma, Sabtecha, Scheba und Dedan sind im Deutschen verständliche und überwiegend bibelsprachlich etablierte Umschriften. Insbesondere ist „Ragma“ als deutsche traditionelle Form von רַעְמָא sachgerecht und verwechselt den Namen nicht mit Rama. Zusätzliche Fußnoten sind nicht erforderlich; die englischen Varianten betreffen vor allem englische Transliterationsgewohnheiten und begründen keinen deutschsprachigen Anker.
