lexical_decisions:
- source_word: הַיְבוּסִי
  choice: die Jebusiter
  rationale: Die morphologisch singularische Volksbezeichnung wird in dieser Völkerliste kollektiv gebraucht. Im Deutschen ist dafür der Plural natürlich.
- source_word: הָאֱמֹרִי
  choice: die Amoriter
  rationale: Wie die benachbarten Volksbezeichnungen bezeichnet die singularische Form kollektiv das Volk; daher steht im Deutschen der Plural.
- source_word: הַגִּרְגָּשִׁי
  choice: die Girgaschiter
  rationale: Die Form wird als kollektive Volksbezeichnung verstanden und entsprechend im deutschen Plural wiedergegeben.
- source_word: וְאֶת / וְאֵת
  choice: und
  rationale: Die direkte Objektmarkierung hat im Deutschen keine eigene Entsprechung. Die Konjunktion wird zu Beginn des Verses und vor dem letzten Listenglied mit „und“ wiedergegeben.
