source:
  edition: WLC
  text: וַ/יָּ֖מָת הֲדָ֑ד וַ/יִּהְיוּ֙ אַלּוּפֵ֣י אֱד֔וֹם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עליה אַלּ֥וּף יְתֵֽתס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/051.yaml
  text: 'Hadad died[a], and the chiefs of Edom were: Chief Timna, Chief Aliah[c][b], Chief Jetheth.'
translation:
  language: de
  text: 'Hadad starb. Die Oberhäupter Edoms waren: Oberhaupt Timna, Oberhaupt Alja[a] und Oberhaupt Jetet.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Genesis 36,40 lautet der entsprechende Name Alwa; der Chroniktext hat hier Alja.
    reason: textual_variant
  - marker: b
    text: Das hebräische Wort für „Oberhaupt“ bezeichnet hier den Anführer einer edomitischen Sippe oder Stammesgruppe. Ältere Übersetzungen geben es teils mit „Fürst“ oder „Herzog“ wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Das Wayyiqtol von מות führt das nächste Ereignis der Erzählfolge ein; das deutsche Präteritum gibt dies natürlich wieder.
- source_word: הֲדָד
  choice: Hadad
  rationale: Übliche deutsche Umschrift des Personennamens.
- source_word: וַיִּהְיוּ
  choice: waren
  rationale: היה leitet hier die anschließende Aufzählung der edomitischen Oberhäupter ein; die kopulative Wiedergabe ist im Deutschen natürlich.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: Oberhäupter / Oberhaupt
  rationale: אַלּוּף bezeichnet in edomitischen Listen ein führendes Oberhaupt einer Sippe oder Stammesgruppe. „Oberhaupt“ ist modern und vermeidet das historisch irreführende „Fürst“ oder „Herzog“; die Wiederholung des Titels bleibt erhalten.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Eingebürgerte deutsche Form des Orts- und Volksnamens.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Nahe Umschrift der hebräischen Namensform.
- source_word: עליה
  choice: Alja
  rationale: Die Konsonantenform des Chroniktextes wird als Alja wiedergegeben und nicht an die abweichende Parallelform in Genesis 36,40 angeglichen.
- source_word: יְתֵת
  choice: Jetet
  rationale: Deutsche Umschrift des hebräischen Eigennamens.
