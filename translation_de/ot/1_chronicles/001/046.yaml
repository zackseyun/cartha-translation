  terminology: „Huscham“, „Hadad“, „Bedad“, „Midian“, „Moab“ und „Awit“ sind als Namensformen vertretbar. „Gebiet von Moab“ gibt שְׂדֵה in seinem möglichen Sinn als offenes Land/Territorium angemessen wieder. Die Fußnote sollte lediglich die Namensvariante benennen, nicht eine weitergehende Unsicherheitsbehauptung aufstellen.
