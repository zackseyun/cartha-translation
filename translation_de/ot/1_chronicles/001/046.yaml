base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/046.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab; and the name of his city was Avith.
translation:
  language: de
  text: Und Huscham starb, und an seiner Stelle wurde Hadad, der Sohn Bedads, König, der Midian im Gebiet von Moab schlug; seine Stadt hieß Awit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ajot“, eine abweichende Transkription des Ortsnamens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Die Wayyiqtol-Form von מות bezeichnet im fortlaufenden Bericht schlicht den Tod; „starb“ ist direkt und ohne beschönigenden Zusatz.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: an seiner Stelle wurde … König
  rationale: מלך bezeichnet hier den Herrschaftsantritt; diese Formulierung gibt zugleich תחתיו natürlich und genau wieder.
- source_word: הֲדַד בֶּן בְּדַד
  choice: Hadad, der Sohn Bedads
  rationale: Die Eigennamen werden transliteriert, und בן wird als Abstammungsangabe ausdrücklich wiedergegeben.
- source_word: הַמַּכֶּה אֶת מִדְיָן
  choice: Er war es, der Midian … schlug
  rationale: Das substantivierte Partizip kennzeichnet Hadad durch eine bekannte Tat. „schlug“ bleibt näher an נכה als das stärker deutende „besiegte“; der neue Satz vermeidet einen unklaren Relativsatzbezug.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: im Gebiet von Moab
  rationale: שׂדה kann neben einem einzelnen Feld auch offenes Land oder ein Territorium bezeichnen. Im Zusammenhang eines militärischen Ereignisses ist „Gebiet“ im modernen Deutsch natürlich, ohne den Ort enger festzulegen.
- source_word: וְשֵׁם עִירוֹ
  choice: Seine Stadt hieß
  rationale: Die hebräische Namensformel wird knapp und idiomatisch ins Deutsche übertragen.
- source_word: עיות
  choice: Awit
  rationale: Der Ortsname wird nach seiner wahrscheinlichen hebräischen Lautgestalt transliteriert; wegen der ungewöhnlichen Überlieferungsform wird eine Variante in der Fußnote genannt.
