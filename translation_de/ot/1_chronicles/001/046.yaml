  source_fidelity: 'Die wesentlichen Inhalte sind korrekt wiedergegeben: Huschams Tod, Hadads Thronfolge, seine Abstammung, sein Schlag gegen Midian im Gebiet Moabs und der Name seiner Stadt. Das hebräische Partizip הַמַּכֶּה beschreibt Hadad jedoch attributiv („der Midian schlug“), ohne die in „Er war es“ enthaltene Hervorhebung.'
