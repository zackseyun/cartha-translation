  text: Mishma[a], Dumah, Massa, Hadad, and Tema.
translation:
  language: de
  text: Mischma, Duma, Massa, Hadad[a] und Tema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der parallelen Liste in 1. Mose 25,15 steht »Hadar«; in 1. Chronik steht »Hadad«.
    reason: textual_variant
lexical_decisions:
- source_word: מִשְׁמָע
  choice: Mischma
  rationale: Eigenname in einem Geschlechtsregister; nach der im Deutschen üblichen biblischen Namensform wiedergegeben statt übersetzt.
- source_word: וְ/דוּמָה
  choice: Duma
  rationale: דוּמָה ist ein Eigenname und wird in deutscher Form wiedergegeben. Die hebräische Konjunktion וְ muss in der deutschen Aufzählung nicht bei jedem Glied eigens erscheinen.
- source_word: מַשָּׂא
  choice: Massa
  rationale: Im Zusammenhang des Geschlechtsregisters ist das Wort als Eigenname zu verstehen, nicht als das gleichlautende gewöhnliche Wort für »Last« oder »Ausspruch«.
- source_word: חֲדַד
  choice: Hadad
  rationale: Der masoretische Text von 1. Chronik liest hier eindeutig Hadad; diese Lesart bleibt im Haupttext erhalten.
- source_word: וְ/תֵימָא
  choice: und Tema
  rationale: Der Eigenname תֵימָא wird als Tema wiedergegeben; die Konjunktion וְ erscheint vor dem letzten Glied als natürliches deutsches »und«.
theological_decisions: []
translation_notes:
