base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/038.yaml
  text: 'And the sons of Seir: Lotan[a], Shobal, Zibeon, Anah, Dishon, Ezer, and Dishan.'
translation:
  language: de
  text: 'Und die Söhne Seïrs[a]: Lotan, Schobal, Zibon, Ana, Dischon, Ezer und Dischan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für »Söhne« kann in Stammbäumen unmittelbare Söhne, aber auch allgemeiner Nachkommen oder Angehörige einer Sippe bezeichnen. Die formale genealogische Ausdrucksweise bleibt hier erhalten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne … waren
  rationale: בְּנֵי ist der Status-constructus-Plural von »Sohn« und leitet eine genealogische Liste ein. Das vorangestellte וּ wird mit »Und« wiedergegeben; »waren« ergänzt im Deutschen natürlich den im Hebräischen nominalen Satz.
- source_word: שֵׂעִיר
  choice: Seïr
  rationale: Personenname im genealogischen Zusammenhang; die Trema-Schreibung macht deutlich, dass e und i getrennt gesprochen werden.
- source_word: לוֹטָן
  choice: Lotan
  rationale: Der Personenname wird nach gebräuchlicher deutscher Umschrift wiedergegeben.
- source_word: שׁוֹבָל
  choice: Schobal
  rationale: Der hebräische sch-Laut wird in deutscher Umschrift mit »sch« wiedergegeben.
- source_word: צִבְעוֹן
  choice: Zibon
  rationale: Der Personenname wird in einer lesbaren deutschen Form wiedergegeben; צ wird durch »z« und die Endung עוֹן durch »on« abgebildet.
- source_word: עֲנָה
  choice: Ana
  rationale: Der Personenname wird in gebräuchlicher deutscher Umschrift wiedergegeben; der nicht unmittelbar nachbildbare Kehllaut wird nicht eigens markiert.
- source_word: דִישֹׁן
  choice: Dischon
  rationale: Der Name wird mit deutschem »sch« umschrieben und von דִישָׁן (»Dischan«) unterschieden.
- source_word: אֵצֶר
  choice: Ezer
  rationale: Der Personenname wird in deutscher Umschrift wiedergegeben; צ wird mit »z« dargestellt.
- source_word: דִישָׁן
  choice: Dischan
  rationale: Die Vokalisierung mit a wird bewahrt, sodass der Name klar von דִישֹׁן (»Dischon«) unterschieden bleibt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Reihungsstruktur des hebräischen Stammbaums wird bewahrt; das im Hebräischen nicht ausdrücklich gesetzte »waren« sorgt für natürliches Deutsch. Die Eigennamen folgen einer lesbaren deutschen Umschrift und bewahren insbesondere den Unterschied zwischen Dischon und Dischan.
