source:
  edition: WLC
  text: בְּנֵ֣י שֵׁ֔ם עֵילָ֣ם וְ/אַשּׁ֔וּר וְ/אַרְפַּכְשַׁ֖ד וְ/ל֣וּד וַ/אֲרָ֑ם וְ/ע֥וּץ וְ/ח֖וּל וְ/גֶ֥תֶר וָ/מֶֽשֶׁךְ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/017.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud, and Aram; Uz, Hul, Gether, and Meshech.'
translation:
  language: de
  text: 'Die Söhne Sems: Elam, Assur, Arpachschad, Lud und Aram; Uz, Hul, Geter und Meschech.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der parallelen Geschlechtsfolge in 1. Mose 10,23 steht „Masch“ statt „Meschech“.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Der Status constructus Plural von בֵּן leitet die genealogische Namensliste ein. „Söhne“ gibt die Form direkt und im Deutschen natürlich wieder; „Nachkommen“ wäre weiter gefasst.
- source_word: שֵׁם
  choice: Sem
  rationale: Verwendet die im modernen deutschen Bibelgebrauch etablierte Namensform.
- source_word: עֵילָם
  choice: Elam
  rationale: Etablierte deutsche Wiedergabe des Eigennamens.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: In der genealogischen Liste als Eigenname wiedergegeben; „Assyrien“ würde die Person vorschnell mit dem späteren Land beziehungsweise Volk gleichsetzen.
- source_word: אַרְפַּכְשַׁד
  choice: Arpachschad
  rationale: Im Deutschen gebräuchliche, am Hebräischen orientierte Namensform.
- source_word: לוּד
  choice: Lud
  rationale: Der hebräische Text bietet den singularischen Eigennamen לוּד, nicht die pluralische Volksbezeichnung Luditer.
- source_word: אֲרָם
  choice: Aram
  rationale: Bewahrt den Eigennamen der genealogischen Liste; „Syrien“ wäre eine geografische Deutung.
- source_word: עוּץ
  choice: Uz
  rationale: Etablierte deutsche Form des Eigennamens.
- source_word: חוּל
  choice: Hul
  rationale: Direkte und im Deutschen lesbare Umschrift des Eigennamens.
- source_word: גֶתֶר
  choice: Geter
  rationale: Etablierte deutsche Umschrift des Eigennamens.
- source_word: מֶשֶׁךְ
  choice: Meschech
  rationale: Gibt den masoretischen Text von 1. Chronik 1,17 unmittelbar wieder. Die abweichende Form in der Parallelgenealogie wird in einer Fußnote dokumentiert.
theological_decisions:
- issue: Zuordnung von Uz, Hul, Geter und Meschech
  choice: Die Namen werden entsprechend dem vorliegenden hebräischen Wortlaut unmittelbar in der Liste der Söhne Sems fortgeführt.
  alternative: '„Die Söhne Arams: Uz, Hul, Geter und Masch“ nach der ausdrücklichen Gliederung von 1. Mose 10,23.'
  rationale: Der WLC-Text von 1. Chronik 1,17 enthält vor Uz keine Wiederholung von „Söhne Arams“. Die Übersetzung ergänzt diese syntaktische Zuordnung daher nicht, sondern bewahrt die Spannung zur Parallelgenealogie.
translation_notes:
  register: Knapper, würdiger genealogischer Stil in modernem Standarddeutsch. Der Doppelpunkt führt die Liste ein; das Semikolon macht ihre im hebräischen Text erkennbare innere Zäsur sichtbar, ohne eine nicht ausdrücklich vorhandene Überschrift „Söhne Arams“ zu ergänzen. Der Fußnotenmarker steht bei „Meschech“, auf das sich die Textvariante bezieht.
