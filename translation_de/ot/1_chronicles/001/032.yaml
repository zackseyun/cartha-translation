source:
  edition: WLC
  text: וּ/בְנֵ֨י קְטוּרָ֜ה פִּילֶ֣גֶשׁ אַבְרָהָ֗ם יָלְדָ֞ה אֶת זִמְרָ֧ן וְ/יָקְשָׁ֛ן וּ/מְדָ֥ן וּ/מִדְיָ֖ן וְ/יִשְׁבָּ֣ק וְ/שׁ֑וּחַ וּ/בְנֵ֥י יָקְשָׁ֖ן שְׁבָ֥א וּ/דְדָֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/032.yaml
  text: 'And the sons of Keturah[a], Abraham’s concubine: she bore Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah. And the sons of Jokshan: Sheba and Dedan.'
translation:
  language: de
  text: 'Und die Söhne Keturas[a], der Nebenfrau Abrahams: sie gebar Simran, Jokschan, Medan, Midian, Jischbak und Schuach. Und die Söhne Jokschans: Saba und Dedan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In 1. Mose 25,1 wird Ketura als Abrahams Frau bezeichnet; hier nennt der Chronist sie ausdrücklich Abrahams Nebenfrau.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Die Konstruktusform bedeutet „Söhne von“; das vorangestellte „Und“ bewahrt die fortlaufende, listenartige Form des Geschlechtsregisters.
- source_word: קְטוּרָה
  choice: Ketura
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: פִּילֶגֶשׁ
  choice: Nebenfrau
  rationale: Das Wort bezeichnet eine anerkannte Partnerin von geringerem Rang als eine Hauptfrau. „Nebenfrau“ ist im heutigen Deutschen verständlich und gibt den Status wieder, ohne den Ausdruck mit „Ehefrau“ zu harmonisieren.
- source_word: אַבְרָהָם
  choice: Abrahams
  rationale: Der Name steht in einer Genitivbeziehung zu „Nebenfrau“ und wird daher als deutscher Genitiv wiedergegeben.
- source_word: יָלְדָה
  choice: sie gebar
  rationale: Das feminine Verb bezieht sich auf Ketura. Das ausdrücklich gesetzte Pronomen macht diesen Rückbezug im Deutschen klar und wahrt den knappen genealogischen Stil.
- source_word: אֶת
  choice: '[nicht wiedergegebener Akkusativmarker]'
  rationale: Der hebräische Marker für ein bestimmtes direktes Objekt hat keine eigenständige deutsche Entsprechung.
- source_word: זִמְרָן
  choice: Simran
  rationale: Wiedergabe des Personennamens in einer etablierten deutschen Bibelform.
- source_word: יָקְשָׁן
  choice: Jokschan
  rationale: Wiedergabe des Personennamens in einer etablierten deutschen Bibelform.
- source_word: מְדָן
  choice: Medan
  rationale: Transliteration des Personennamens; die hebräische Form bleibt im Deutschen nahezu unverändert.
- source_word: מִדְיָן
  choice: Midian
  rationale: Konventionelle deutsche Form des Eigennamens.
- source_word: יִשְׁבָּק
  choice: Jischbak
  rationale: Deutsche Transliteration des Personennamens.
- source_word: שׁוּחַ
  choice: Schuach
  rationale: Deutsche Transliteration, welche den auslautenden hebräischen Kehllaut erkennen lässt.
- source_word: שְׁבָא
  choice: Saba
  rationale: Konventionelle deutsche biblische Namensform.
- source_word: דְדָן
  choice: Dedan
  rationale: Konventionelle deutsche Form des Personennamens.
theological_decisions:
- issue: Bezeichnung von Keturas Stellung gegenüber Abraham
  choice: Nebenfrau
  alternative: Ehefrau; Zweitfrau
  rationale: Der Vers verwendet ausdrücklich פִּילֶגֶשׁ. Diese Statusbezeichnung wird ihrem eigenen Sinn entsprechend übersetzt und nicht an 1. Mose 25,1 angeglichen, wo Ketura als Abrahams Frau bezeichnet wird. So bleibt die Spannung zwischen den Textstellen erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der knappen Reihung eines Geschlechtsregisters. Die Namen folgen gebräuchlichen deutschen Bibelformen beziehungsweise einer transparenten deutschen Transliteration.
