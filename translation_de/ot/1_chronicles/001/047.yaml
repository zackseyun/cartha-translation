base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/047.yaml
  text: Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: de
  text: Hadad starb, und an seiner Stelle[a] regierte Samla aus Masreka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach ihm“. Der hebräische Ausdruck bedeutet „an seiner Stelle“ und kennzeichnet die königliche Nachfolge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Die Wayyiqtol-Form von מוּת bezeichnet hier schlicht den Tod; „starb“ ist die direkte und natürliche deutsche Wiedergabe ohne beschönigende Umschreibung.
- source_word: הֲדָד
  choice: Hadad
  rationale: Der Personenname wird in der im Deutschen üblichen Form transliteriert.
- source_word: וַיִּמְלֹךְ
  choice: regierte
  rationale: מָלַךְ bezeichnet in dieser Königsfolge das Regieren als König. „Regierte“ bewahrt den knappen Listenstil und vermeidet eine unnötige Ausweitung.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: תַּחַת mit Pronominalsuffix kennzeichnet hier die Nachfolge im Königsamt. „An seiner Stelle“ gibt sowohl die Ablösung als auch die Amtsnachfolge natürlich wieder.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Der Personenname wird nach gängiger deutscher Transliterationskonvention wiedergegeben.
- source_word: מִמַּשְׂרֵקָה
  choice: aus Masreka
  rationale: Die Präposition מִן bezeichnet hier Herkunft oder örtliche Zuordnung. „Aus Masreka“ ist im modernen Deutsch klar und idiomatisch.
