  source_fidelity: 'Der Text gibt die Abfolge des hebräischen Wayyiqtol korrekt wieder: Jobab stirbt, und Huscham folgt ihm als König nach. „An seiner Stelle“ entspricht תַּחְתָּיו im Kontext einer Thronfolge. „Aus dem Land der Temaniter“ ist eine gut vertretbare kollektive Wiedergabe von מֵאֶרֶץ הַתֵּימָנִי; die möglichen engeren Deutungen bleiben angemessen in der Fußnote verfügbar.'
