  text: וַ/יָּ֖מָת יוֹבָ֑ב וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו חוּשָׁ֖ם מֵ/אֶ֥רֶץ הַ/תֵּימָנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/045.yaml
  text: And Yobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: de
  text: Und Jobab starb, und Huscham aus dem Land der Temaniter[a] wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Land Teman“ oder „aus dem Land des Temaniters“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Das Wayyiqtol von מות führt das nächste Ereignis der Erzählfolge ein; im Deutschen ist das einfache Präteritum natürlich.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Die im Deutschen eingebürgerte biblische Namensform wird verwendet; sie gibt den hebräischen Namen יוֹבָב konventionell wieder.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: In der Thronfolgeformel bezeichnet מלך die Übernahme der Königsherrschaft. „Wurde König“ klingt im modernen Deutsch natürlicher als „regierte“ und macht den Beginn der Herrschaft deutlich, ohne zusätzliche Dauerangaben einzutragen.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: תחת mit Suffix bezeichnet hier unmittelbare Ablösung beziehungsweise Nachfolge.
- source_word: חוּשָׁם
  choice: Huscham
  rationale: Der Personenname wird nach gängiger deutscher Umschrift wiedergegeben.
- source_word: מֵאֶרֶץ
  choice: aus dem Land
  rationale: מן mit אֶרֶץ bezeichnet die geografische Herkunft; „aus dem Land“ bildet den hebräischen Ausdruck natürlich und vollständig ab.
- source_word: הַתֵּימָנִי
  choice: der Temaniter
  rationale: Die Form ist singularisch und kann eine gentilizische oder regionale Zuordnung ausdrücken. Im Zusammenhang mit „Land“ ist der kollektive deutsche Plural eine natürliche Wiedergabe, während die mögliche Lesart „Teman“ beziehungsweise „des Temaniters“ in der Fußnote erhalten bleibt.
