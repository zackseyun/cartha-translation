  text: וַ/יָּ֖מָת שָׁא֑וּל וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו בַּ֥עַל חָנָ֖ן בֶּן עַכְבּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/049.yaml
  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: de
  text: Und Schaul starb, und an seiner Stelle wurde Baal-Hanan, der Sohn Akbors, König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Das Qal-Wayyiqtol von מות bezeichnet in der fortlaufenden Erzählung schlicht den Tod; „starb“ gibt dies knapp und ohne Euphemismus wieder.
- source_word: שָׁאוּל
  choice: Schaul
  rationale: Die deutschsprachige Transliteration „Schaul“ bildet den hebräischen Namen lautnah ab und unterscheidet ihn nicht künstlich von seiner hebräischen Form.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: Im Zusammenhang der Herrscherfolge bezeichnet מלך hier den Regierungsantritt. „Wurde König“ bringt diesen Übergang im heutigen Deutsch natürlicher zum Ausdruck als das stärker durative „regierte“.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: תחת mit Suffix drückt hier Stellvertretung beziehungsweise Nachfolge aus; „an seiner Stelle“ bewahrt diese Bedeutung.
- source_word: בַּעַל חָנָן
  choice: Baal-Hanan
  rationale: Der Personenname wird in einer verständlichen, hebräisch orientierten Form wiedergegeben; der Bindestrich macht seine Zusammensetzung sichtbar.
- source_word: בֶּן
  choice: der Sohn
  rationale: בן bezeichnet in dieser Abstammungsangabe unmittelbar den Sohn; mit Artikel fügt sich die Wendung idiomatisch als Apposition in den deutschen Satz ein.
- source_word: עַכְבּוֹר
  choice: Akbor
  rationale: „Akbor“ ist eine vereinfachte hebräisch orientierte Wiedergabe des Personennamens עכבור.
