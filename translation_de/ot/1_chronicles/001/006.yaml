  source_fidelity: 'Die Übersetzung gibt וּבְנֵי korrekt als „Und die Söhne“ wieder und bewahrt die genealogische Reihung. Die drei Eigennamen entsprechen dem masoretischen Text: Aschkenas für אַשְׁכֲּנַז, Difat für דִיפַת und Togarma für תוֹגַרְמָה. Insbesondere folgt „Difat“ zutreffend dem Dalet der Chronik und nivelliert die Abweichung zu Genesis 10,3 nicht.'
  naturalness: '„Und die Söhne Gomers: Aschkenas, Difat und Togarma.“ ist knappes, idiomatisches Standarddeutsch und für eine Genealogie angemessen. Der Genitiv „Gomers“ und die Aufzählung nach dem Doppelpunkt sind natürlich.'
