  text: וּ/בְנֵ֖י גֹּ֑מֶר אַשְׁכֲּנַ֥ז וְ/דִיפַ֖ת וְ/תוֹגַרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/006.yaml
  text: 'And the sons of Gomer: Ashkenaz[a], Diphath, and Togarmah.'
translation:
  language: de
  text: 'Und die Söhne Gomers: Aschkenas, Difat[a] und Togarma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im parallelen Geschlechtsregister in 1. Mose 10,3 steht „Rifat“; der hebräische Text der Chronik liest hier „Difat“.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Die Verbindung וּ wird als „Und“ wiedergegeben, um die fortlaufende Listenstruktur zu bewahren. בְנֵי ist der Konstruktplural von „Sohn“; in einer Genealogie ist „die Söhne“ die genaue und natürliche Wiedergabe.
- source_word: גֹּמֶר
  choice: Gomer
  rationale: Der Eigenname wird in der im Deutschen etablierten Form wiedergegeben.
- source_word: אַשְׁכֲּנַז
  choice: Aschkenas
  rationale: Der Eigenname wird nach gebräuchlicher deutscher Bibeltradition und deutscher Laut-Buchstaben-Zuordnung wiedergegeben.
- source_word: דִיפַת
  choice: Difat
  rationale: Der masoretische Text der Chronik bietet דִיפַת mit Dalet; „Difat“ bildet diesen Text ab. Die abweichende Lesart des Paralleltexts in 1. Mose 10,3 wird in einer Fußnote bewahrt.
- source_word: תוֹגַרְמָה
  choice: Togarma
  rationale: Der Eigenname wird in der gebräuchlichen deutschen Form wiedergegeben.
