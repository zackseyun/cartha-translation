  text: וַ/יָּ֖מָת שַׂמְלָ֑ה וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו שָׁא֖וּל מֵ/רְחֹב֥וֹת הַ/נָּהָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/048.yaml
  text: Samlah died[a], and Shaul from Rehoboth by the River reigned in his place.
translation:
  language: de
  text: Samla starb, und Saul aus Rehobot am Strom[a] wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Fluss«; viele verstehen dies hier als Bezeichnung für den Euphrat.'
    reason: Die hebräische Formulierung nennt den Euphrat nicht ausdrücklich, kann aber als geläufige geografische Bezeichnung auf ihn verweisen.
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Das Qal-Wayyiqtol von מות bezeichnet unmittelbar den Tod; »starb« ist die klare, sachliche deutsche Wiedergabe.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Der Personenname wird in einer im Deutschen natürlichen, eng am Hebräischen orientierten Form wiedergegeben.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: In der Thronfolgeformel bezeichnet מלך hier den Herrschaftsantritt. »Wurde König« gibt diesen Zusammenhang im modernen Deutsch präzise und natürlich wieder.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: 'תחת mit Pronominalsuffix bezeichnet in diesem Zusammenhang die Nachfolge im Königtum: jemand tritt an die Stelle seines Vorgängers.'
- source_word: שָׁאוּל
  choice: Saul
  rationale: »Saul« ist die etablierte deutsche Wiedergabe des hebräischen Namens שָׁאוּל; der Kontext macht deutlich, dass hier der edomitische König gemeint ist.
- source_word: מֵרְחֹבוֹת
  choice: aus Rehobot
  rationale: Die Präposition מ־ bezeichnet Herkunft; »aus Rehobot« gibt dies direkt wieder, während der Ortsname transliteriert wird.
- source_word: הַנָּהָר
  choice: am Strom
  rationale: נהר mit Artikel bedeutet wörtlich »der Fluss« und kann als bekannte geografische Bezeichnung, wahrscheinlich für den Euphrat, gebraucht sein. »am Strom« bewahrt diesen Bezeichnungscharakter, ohne den Euphrat ausdrücklich in den Haupttext einzutragen.
