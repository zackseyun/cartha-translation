  text: וּ/מִצְרַ֡יִם יָלַ֞ד אֶת לודיים וְ/אֶת עֲנָמִ֛ים וְ/אֶת לְהָבִ֖ים וְ/אֶת נַפְתֻּחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/011.yaml
  text: Mizraim fathered the Ludites[a], the Anamites, the Lehabites, and the Naphtuhites.
translation:
  language: de
  text: Mizrajim zeugte die Luditer[a], die Anamiter, die Lehabiter und die Naftuhiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder direkter transliteriert: „Ludim, Anamim, Lehabim und Naftuhim“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: Mizrajim
  rationale: Im genealogischen Zusammenhang als Personenname behandelt und daher nach deutscher Laut- und Schreibkonvention transliteriert, nicht als Ortsname „Ägypten“ wiedergegeben.
- source_word: יָלַד
  choice: zeugte
  rationale: Das Verb bezeichnet hier in knapper genealogischer Sprache das Hervorbringen beziehungsweise die Abstammung. „Zeugte“ bewahrt die männliche genealogische Perspektive und ist im Deutschen verständlich.
- source_word: אֶת
  choice: '[nicht gesondert wiedergegeben]'
  rationale: Der direkte Objektmarker besitzt keine eigenständige deutsche Entsprechung; seine Funktion wird durch den Satzbau ausgedrückt.
- source_word: לודיים
  choice: Luditer
  rationale: Als Bezeichnung einer Volksgruppe mit der im Deutschen geläufigen Endung „-iter“ wiedergegeben; die direktere Transliteration „Ludim“ bleibt in der Fußnote erhalten.
- source_word: עֲנָמִים
  choice: Anamiter
  rationale: Als deutsches Ethnonym parallel zu den übrigen Gruppennamen gebildet; „Anamim“ ist als direktere Transliteration möglich.
- source_word: לְהָבִים
  choice: Lehabiter
  rationale: Als deutsches Ethnonym wiedergegeben, um die Reihe natürlich und einheitlich zu formulieren.
- source_word: נַפְתֻּחִים
  choice: Naftuhiter
  rationale: Als deutsches Ethnonym wiedergegeben; „f“ bildet den hebräischen Konsonanten פ ohne Dagesch hier angemessen ab, während „Naftuhim“ die Form direkter transliteriert.
