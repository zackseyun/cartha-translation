source:
  edition: WLC
  text: וּ/כְנַ֗עַן יָלַ֛ד אֶת צִיד֥וֹן בְּכֹר֖/וֹ וְ/אֶת חֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/013.yaml
  text: And Canaan fathered Sidon his firstborn[b][a], and Heth.
translation:
  language: de
  text: Und Kanaan zeugte Sidon[a], seinen Erstgeborenen, und Het[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Zidon“, nach einer älteren Umschrift des Namens.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „Het“; gemeint ist der Stammvater, der mit den Hethitern verbunden wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: Und Kanaan
  rationale: Der Eigenname wird nach der etablierten deutschen Bibeltradition als „Kanaan“ wiedergegeben. Die vorangestellte Konjunktion „Und“ bewahrt die fortlaufende genealogische Reihung.
- source_word: יָלַד
  choice: zeugte
  rationale: Bei einem männlichen Subjekt bezeichnet das Verb im genealogischen Zusammenhang das Zeugen beziehungsweise die Vaterschaft. „Zeugte“ ist präzise, knapp und im Deutschen für Geschlechtsregister geläufig.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: Der hebräische Akkusativmarker hat keine eigenständige deutsche Entsprechung; seine Funktion wird durch den deutschen Satzbau ausgedrückt.
- source_word: צִידוֹן
  choice: Sidon
  rationale: „Sidon“ ist die im modernen Deutschen übliche Form des Eigennamens.
- source_word: בְּכֹר/וֹ
  choice: seinen Erstgeborenen
  rationale: Das Substantiv bezeichnet mit dem Suffix der 3. Person Singular den Erstgeborenen Kanaans. Die appositionelle Formulierung erhält die im Hebräischen betonte Geburtsfolge.
- source_word: וְ/אֶת
  choice: und
  rationale: Die Konjunktion leitet das zweite direkte Objekt ein; der Akkusativmarker wird im Deutschen nicht gesondert ausgedrückt.
- source_word: חֵת
  choice: Het
  rationale: Hier steht der Eigenname eines Stammvaters, nicht die pluralische Volksbezeichnung „Hethiter“. „Het“ folgt einer geläufigen deutschen Wiedergabe des hebräischen Namens.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit der für biblische Geschlechtsregister geläufigen Verbform „zeugte“. Die Zeichensetzung macht „seinen Erstgeborenen“ als Apposition zu Sidon kenntlich. Die Fußnotenmarker wurden unmittelbar den jeweils erläuterten Namen zugeordnet.
