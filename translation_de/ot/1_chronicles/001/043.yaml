source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הַ/מְּלָכִ֗ים אֲשֶׁ֤ר מָלְכוּ֙ בְּ/אֶ֣רֶץ אֱד֔וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֣י יִשְׂרָאֵ֑ל בֶּ֚לַע בֶּן בְּע֔וֹר וְ/שֵׁ֥ם עִיר֖/וֹ דִּנְהָֽבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/043.yaml
  text: 'And these are the kings who reigned in the land of Edom before any king reigned over the sons of Israel: Bela son of Beor, and the name of his city was Dinhabah.'
translation:
  language: de
  text: 'Und dies sind die Könige, die im Land Edom regierten, bevor ein König über die Israeliten herrschte[a]: Bela, der Sohn Beors; seine Stadt hieß Dinhaba.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „bevor irgendein König über die Israeliten herrschte“. Wörtlich steht im Hebräischen: „vor dem Regieren eines Königs für/über die Söhne Israels“.'
    reason: Die hebräische Konstruktion kann sowohl eng mit „ein König“ als auch allgemein im Sinn des Beginns israelitischer Königsherrschaft verstanden werden.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Die Verbindung aus Konjunktion und Demonstrativ eröffnet die folgende Liste und wahrt zugleich den Zusammenhang mit dem vorausgehenden Geschlechtsregister.
- source_word: הַמְּלָכִים אֲשֶׁר מָלְכוּ
  choice: die Könige, die … regierten
  rationale: Das Verb מלך bezeichnet hier die Ausübung der Königsherrschaft; „regierten“ ist im Deutschen natürlich und dem königlichen Kontext angemessen.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: im Land Edom
  rationale: Die Übersetzung bewahrt das ausdrücklich genannte אֶרֶץ („Land“) und klingt zugleich idiomatisch.
- source_word: לִפְנֵי מְלָךְ מֶלֶךְ
  choice: bevor ein König … herrschte
  rationale: Die Konstruktion aus dem Infinitiv von מלך und dem verwandten Substantiv מֶלֶךְ bezeichnet den Beginn beziehungsweise das Bestehen von Königsherrschaft. Die deutsche Formulierung bleibt nahe am unbestimmten Singular.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: über die Israeliten
  rationale: Im Zusammenhang mit königlicher Herrschaft gibt לְ die Beziehung zum regierten Volk an. „Israeliten“ gibt die hebräische Volksbezeichnung „Söhne Israels“ in natürlichem modernem Deutsch wieder.
- source_word: בֶּלַע בֶּן בְּעוֹר
  choice: Bela, der Sohn Beors
  rationale: Die Namen werden nach geläufiger deutscher Form wiedergegeben; die Apposition macht das Abstammungsverhältnis klar.
- source_word: וְשֵׁם עִירוֹ דִּנְהָבָה
  choice: seine Stadt hieß Dinhaba
  rationale: Die hebräische Nominalkonstruktion lautet wörtlich „und der Name seiner Stadt war Dinhaba“; die gewählte Fassung ist prägnant und natürlich, ohne den Inhalt zu verändern.
theological_decisions:
- issue: Ob לִפְנֵי מְלָךְ מֶלֶךְ einen einzelnen König oder überhaupt das israelitische Königtum bezeichnet
  choice: bevor ein König über die Israeliten herrschte
  alternative: bevor irgendein König über die Israeliten herrschte
  rationale: Der hebräische Text hat den unbestimmten Singular „ein König“. Die Hauptfassung erhält diese Form, während die Fußnote die mögliche generische Bedeutung offenlegt, ohne die historische beziehungsweise theologische Spannung einseitig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem chronistischem Listenstil. Die Satzverbindung „Und dies sind“ bewahrt den fortlaufenden Charakter des Abschnitts; „seine Stadt hieß“ vermeidet unnötig schwerfällige Nominalsprache.
