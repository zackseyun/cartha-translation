  text: וַ/יּ֥וֹלֶד אַבְרָהָ֖ם אֶת יִצְחָ֑ק בְּנֵ֣י יִצְחָ֔ק עֵשָׂ֖ו וְ/יִשְׂרָאֵֽל־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/034.yaml
  text: 'Abraham fathered Isaac[a]. The sons of Isaac: Esau and Israel.'
translation:
  language: de
  text: 'Abraham zeugte Isaak. Die Söhne Isaaks: Esau und Israel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Israel ist Jakob.
    reason: Die Anmerkung verdeutlicht, dass mit Israel hier Isaaks Sohn Jakob gemeint ist, während im Haupttext die hebräische Namensform erhalten bleibt.
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in genealogischen Zusammenhängen das Hervorbringen eines Nachkommen. „Zeugte“ ist im Deutschen knapp, idiomatisch und für eine Geschlechtsfolge angemessen.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: Die Akkusativpartikel hat keine eigenständige deutsche Entsprechung; ihre Funktion wird durch die Satzstellung ausgedrückt.
- source_word: בְּנֵי
  choice: Die Söhne Isaaks
  rationale: Die Constructus-Form leitet die nächste genealogische Angabe ein. Die elliptische Formulierung mit Doppelpunkt gibt den listenartigen Charakter natürlich wieder.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: וְיִשְׂרָאֵל
  choice: und Israel
  rationale: Der hebräische Text nennt ausdrücklich „Israel“, den späteren Namen Jakobs. Diese Namensform wird bewahrt und nicht stillschweigend zu „Jakob“ harmonisiert.
theological_decisions:
- issue: Wiedergabe von יִשְׂרָאֵל in der Aufzählung der Söhne Isaaks
  choice: Israel
  alternative: Jakob
  rationale: Gemeint ist Jakob, doch der Ausgangstext verwendet seinen Namen Israel. Die Übersetzung wahrt diese bewusste Namenswahl; eine Fußnote klärt die Identität, ohne den Wortlaut zu ersetzen.
translation_notes:
  register: Knappe, würdige genealogische Prosa in modernem Standarddeutsch. „Zeugte“ bewahrt die Prägnanz der hebräischen Abstammungsformel; der Doppelpunkt bildet die elliptische Listenstruktur ab.
