base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/040.yaml
  text: 'The sons of Shobal: Alian[a], Manahath, Ebal, Shephi, and Onam[b]. And the sons of Zibeon: Aiah and Anah.'
translation:
  language: de
  text: 'Die Söhne Schobals: Aljan[a], Manahat, Ebal, Schefi[b] und Onam. Und die Söhne Zibeons: Aja und Ana.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch »Aljan«; die parallele Genealogie in 1. Mose 36,23 hat »Alwan«.
    reason: alternative_reading
  - marker: b
    text: In der Chronik steht »Schefi«; die Parallelstelle in 1. Mose 36,23 hat »Schefo«.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: In dieser unmittelbaren genealogischen Aufzählung bezeichnet der Ausdruck die namentlich genannten Söhne; die wörtliche Wiedergabe ist im Deutschen klar und angemessen.
- source_word: שׁוֹבָל
  choice: Schobal
  rationale: Der Personenname wird nach üblicher deutscher Bibeltransliteration wiedergegeben.
- source_word: עַלְיָן
  choice: Aljan
  rationale: Die Wiedergabe folgt unmittelbar der in 1. Chronik bezeugten hebräischen Namensform; die abweichende Parallelform in 1. Mose 36,23 wird in einer Fußnote genannt.
- source_word: מָנַחַת
  choice: Manahat
  rationale: Der Personenname wird in einer für deutsche Leser natürlichen Transliteration wiedergegeben.
- source_word: עֵיבָל
  choice: Ebal
  rationale: Die Wiedergabe folgt der hebräischen Namensform des vorliegenden Verses.
- source_word: שְׁפִי
  choice: Schefi
  rationale: Die Wiedergabe folgt der in 1. Chronik bezeugten Form; die Parallelüberlieferung bietet Schefo und wird in einer Fußnote dokumentiert.
- source_word: אוֹנָם
  choice: Onam
  rationale: Direkte Transliteration des hebräischen Personennamens.
- source_word: צִבְעוֹן
  choice: Zibeon
  rationale: Der Personenname wird entsprechend etablierter deutscher Bibeltradition transliteriert.
- source_word: אַיָּה
  choice: Aja
  rationale: Natürliche deutsche Transliteration des hebräischen Personennamens.
- source_word: עֲנָה
  choice: Ana
  rationale: Natürliche deutsche Transliteration des hebräischen Personennamens.
- source_word: וְ / וּ / וַ
  choice: und
  rationale: Die Präfixkonjunktionen verbinden Namen und Satzteile; „und“ wahrt die schlichte genealogische Struktur.
