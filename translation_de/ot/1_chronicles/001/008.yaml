  text: בְּנֵ֖י חָ֑ם כּ֥וּשׁ וּ/מִצְרַ֖יִם פּ֥וּט וּ/כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/008.yaml
  text: 'The sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: de
  text: 'Die Söhne Hams: Kusch, Mizrajim[a], Put und Kanaan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mizrajim ist die hebräische Bezeichnung für Ägypten; hier steht sie als Eigenname in einer genealogischen Liste.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der Status constructus Plural von בֵּן bildet hier die übliche genealogische Formel. »Söhne« bewahrt die konkrete Formulierung des Hebräischen; je nach genealogischem Zusammenhang kann sie auch weiter gefasste Nachkommen einschließen.
- source_word: חָם
  choice: Ham
  rationale: Personenname in der im Deutschen üblichen biblischen Form.
- source_word: כּוּשׁ
  choice: Kusch
  rationale: Eigenname in der etablierten deutschen Umschrift; im genealogischen Zusammenhang wird er als Name bewahrt, ohne ihn auf ein Volk oder Gebiet festzulegen.
- source_word: מִצְרַיִם
  choice: Mizrajim
  rationale: Obwohl das Wort häufig »Ägypten« bezeichnet, steht es hier als Eigenname in einer genealogischen Reihe. Die Umschrift erhält diese Funktion und vermeidet eine vorschnelle geografische Auflösung.
- source_word: פּוּט
  choice: Put
  rationale: Schlichte Umschrift des Eigennamens; ältere Formen wie »Phut« entsprechen weniger dem heutigen deutschen Gebrauch.
- source_word: כְנָעַן
  choice: Kanaan
  rationale: Im Deutschen etablierte Form des Eigennamens; hier genealogisch gebraucht.
theological_decisions:
- issue: Reichweite der genealogischen Bezeichnung »Söhne«
  choice: Die formale Bezeichnung »Söhne« bleibt im Haupttext erhalten.
  alternative: »Nachkommen«
  rationale: Das Hebräische lässt im genealogischen Sprachgebrauch sowohl unmittelbare Söhne als auch eine breitere Abstammungslinie zu. Die Übersetzung wahrt diese Spannung, statt sie im Haupttext festzulegen.
translation_notes:
  register: Knappe, würdige genealogische Prosa in modernem Standarddeutsch. Die Namen folgen geläufigen deutschen Bibelformen beziehungsweise einer transparenten Umschrift. Der Doppelpunkt bildet die nominale Aufzählung des Hebräischen natürlich ab.
