  language: en
  yaml_path: translation/ot/1_chronicles/001/054.yaml
  text: Chief Magdiel[a], chief Iram. These were the chiefs of Edom.
translation:
  language: de
  text: Oberhaupt Magdiël[a], Oberhaupt Iram. Das waren die Oberhäupter Edoms.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sippenoberhaupt Magdiël«; ebenso im weiteren Vers. Das hebräische Wort bezeichnet einen Stammes- oder Sippenführer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: Oberhaupt
  rationale: In den edomitischen Geschlechts- und Herrscherlisten bezeichnet das Wort einen führenden Vertreter eines Stammes oder einer Sippe. »Oberhaupt« ist heute verständlich, würdevoll und lässt den genauen politischen Rang offen.
- source_word: מַגְדִּיאֵל
  choice: Magdiël
  rationale: Der Eigenname wird nach gängiger deutscher Bibeltradition transliteriert; das Trema zeigt, dass i und e getrennt gesprochen werden.
- source_word: עִירָם
  choice: Iram
  rationale: Der Eigenname wird in geläufiger deutscher Form wiedergegeben.
- source_word: אֵלֶּה
  choice: Das waren
  rationale: Der verblosen hebräischen Zusammenfassung entspricht im natürlichen Deutschen eine rückblickende Formulierung mit »waren«.
- source_word: אַלּוּפֵי אֱדוֹם
  choice: die Oberhäupter Edoms
  rationale: Die Status-constructus-Verbindung fasst die zuvor genannten Personen als führende Vertreter Edoms zusammen und wird knapp sowie konsistent wiedergegeben.
theological_decisions: []
translation_notes:
  register: Knapper, listenartiger Stil in modernem Standarddeutsch. Die Wiederholung von »Oberhaupt« bildet die Struktur des Hebräischen ab; »Herzog« wurde als historisch missverständliche und heute altertümliche Wiedergabe vermieden.
