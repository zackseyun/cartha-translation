id: 1CH.1.12
reference: 1 Chronicles 1:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְֽ/אֶת פַּתְרֻסִ֞ים וְ/אֶת כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִ/שָּׁ֛ם פְּלִשְׁתִּ֖ים וְ/אֶת כַּפְתֹּרִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/012.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: de
  text: und die Patrusiter und die Kasluhiter, aus denen die Philister hervorgingen,[a] und die Kaftoriter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von dort kamen die Philister heraus«. Im hebräischen Text der Chronik bezieht sich der Satz am natürlichsten auf die Kasluhiter. In 1. Mose 10,14 steht dieselbe Formulierung; andere biblische Texte bringen die Philister zudem mit Kaftor in Verbindung (vgl. Amos 9,7; Jeremia 47,4).'
    reason: Bewahrt die wörtliche räumliche Formulierung und weist auf die unterschiedliche biblische Zuordnung hin.
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: Patrusiter
  rationale: Volksname, der von Patros abgeleitet ist; die im Deutschen geläufige Form wird beibehalten.
- source_word: כַּסְלֻחִים
  choice: Kasluhiter
  rationale: Der nicht sicher zuzuordnende Volksname wird möglichst formnah wiedergegeben, ohne seine Identität näher festzulegen.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: aus denen ... hervorgingen
  rationale: Die Wendung bedeutet wörtlich »die von dort herauskamen«. Im genealogischen Zusammenhang gibt »aus denen ... hervorgingen« die Herkunft natürlich wieder und bezieht den Relativsatz entsprechend der hebräischen Wortstellung auf die unmittelbar zuvor genannten Kasluhiter.
- source_word: פְּלִשְׁתִּים
  choice: die Philister
  rationale: Dies ist die etablierte deutsche Bezeichnung für das Volk.
- source_word: כַּפְתֹּרִים
  choice: Kaftoriter
  rationale: Der von Kaftor abgeleitete Volksname wird in einer im Deutschen üblichen Form transliteriert.
- source_word: וְאֶת
  choice: und
  rationale: Der hebräische Akkusativmarker bleibt unübersetzt; die Konjunktion bildet die fortlaufende genealogische Aufzählung ab.
theological_decisions:
- issue: Bezug des Herkunftssatzes über die Philister
  choice: Der Satz wird auf die unmittelbar vorher genannten Kasluhiter bezogen.
  alternative: Bezug auf die nachfolgend genannten Kaftoriter beziehungsweise Beibehaltung des räumlichen »von dort« ohne eindeutigen Bezug.
  rationale: Syntax und Wortstellung des vorliegenden hebräischen Textes in 1. Chronik 1,12 legen den Bezug auf die Kasluhiter am nächsten. Andere biblische Texte verbinden die Philister jedoch auch mit Kaftor; diese Spannung wird in der Fußnote offengelegt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die ethnischen Namen werden in etablierten deutschen Formen wiedergegeben; der knappe Listenstil des hebräischen Textes bleibt erhalten.
