  source_fidelity: 'Der Text gibt die hebräische Abfolge und die Nachfolgeformel zutreffend wieder: Baal-Hanans Tod, Hadads Königtum an dessen Stelle, Pai als Stadt Hadads sowie Mehetabels doppelte Abstammungsangabe. „Eine Tochter von Matred, einer Tochter von Me-Sahab“ macht korrekt deutlich, dass die zweite Tochterbezeichnung Matred betrifft. Die Fußnote zu Pai bewahrt die abweichende Form in Genesis, ohne sie in den Haupttext einzutragen.'
