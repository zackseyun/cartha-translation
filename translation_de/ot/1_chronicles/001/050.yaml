source:
  edition: WLC
  text: וַ/יָּ֨מָת֙ בַּ֣עַל חָנָ֔ן וַ/יִּמְלֹ֤ךְ תַּחְתָּי/ו֙ הֲדַ֔ד וְ/שֵׁ֥ם עִיר֖/וֹ פָּ֑עִי וְ/שֵׁ֨ם אִשְׁתּ֤/וֹ מְהֵיטַבְאֵל֙ בַּת מַטְרֵ֔ד בַּ֖ת מֵ֥י זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/050.yaml
  text: Baal-hanan died[a], and Hadad reigned in his place. The name of his city was Pai, and the name of his wife was Mehetabel daughter of Matred[b], daughter of Mezahab.
translation:
  language: de
  text: Baal-Hanan starb, und Hadad wurde an seiner Stelle König. Seine Stadt hieß Pai[a], und seine Frau hieß Mehetabel, eine Tochter von Matred, einer Tochter von Me-Sahab[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In 1. Mose 36,39 lautet der Stadtname „Pau“, während der Chroniktext „Pai“ hat.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich steht zweimal „Tochter“: Mehetabel ist eine Tochter Matreds, und Matred eine Tochter Me-Sahabs. In genealogischen Zusammenhängen kann eine solche Formulierung aus der Sicht Mehetabels auch mit „Enkelin Me-Sahabs“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת בַּעַל חָנָן
  choice: Baal-Hanan starb
  rationale: Die erzählende Verbform bezeichnet Baal-Hanans Tod innerhalb der Abfolge der Könige; die deutsche Wortstellung ist natürlich und gibt den ausdrücklich genannten Namen als Subjekt wieder.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו הֲדַד
  choice: und Hadad wurde an seiner Stelle König
  rationale: מלך bezeichnet hier den Herrschaftsantritt. Die Formulierung gibt sowohl das Königtum als auch die Nachfolgebeziehung von תַּחְתָּיו idiomatisch wieder.
- source_word: וְשֵׁם עִירוֹ פָּעִי
  choice: Seine Stadt hieß Pai
  rationale: Die verblos formulierte hebräische Namensangabe wird im Deutschen natürlich mit „hieß“ wiedergegeben. Die Form פָּעִי des Chroniktextes wird als „Pai“ transliteriert.
- source_word: וְשֵׁם אִשְׁתּוֹ מְהֵיטַבְאֵל
  choice: und seine Frau hieß Mehetabel
  rationale: Die hebräische Namensformel wird in klares, gegenwärtiges Standarddeutsch übertragen.
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: eine Tochter von Matred, einer Tochter von Me-Sahab
  rationale: Die grammatische Form lässt Matred als Tochter Me-Sahabs erkennen. Die Wiedergabe wahrt die zweimalige Abstammungsangabe und macht die deutsche Zuordnung verständlich, ohne die zweite Beziehung einfach durch „Enkelin“ zu ersetzen.
- source_word: מֵי זָהָב
  choice: Me-Sahab
  rationale: Der Ausdruck steht im genealogischen Zusammenhang als Eigenname und wird daher transliteriert, nicht etwa als „Wasser des Goldes“ übersetzt.
