  text: and the Hivites[a], and the Arkites, and the Sinites.
translation:
  language: de
  text: und die Hiwiter[a], die Arkiter und die Siniter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen stehen die Volksbezeichnungen mit Artikel im Singular („der Hiwiter“, „der Arkiter“, „der Siniter“). In diesem genealogischen Zusammenhang bezeichnen sie jedoch Völker oder Sippen; deshalb steht im Deutschen der Plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: und
  rationale: Die Konjunktion ו wird mit „und“ wiedergegeben. Der direkte Objektmarker אֵת hat im Deutschen keine eigene natürliche Entsprechung und bleibt daher unübersetzt.
- source_word: הַחִוִּי
  choice: die Hiwiter
  rationale: Die singularische Volksbezeichnung mit Artikel bezeichnet in diesem genealogischen Zusammenhang ein Volk beziehungsweise eine Sippe; im Deutschen ist dafür der Plural natürlich.
- source_word: הָעַרְקִי
  choice: die Arkiter
  rationale: Die gentilizische Bezeichnung steht kollektiv für eine Volks- oder Sippengruppe und wird daher im Deutschen im Plural wiedergegeben.
- source_word: הַסִּינִי
  choice: die Siniter
  rationale: Die gentilizische Bezeichnung steht in der Völkerliste kollektiv und wird idiomatisch als Plural wiedergegeben.
theological_decisions: []
