  text: וַ/יָּ֖מָת בָּ֑לַע וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו יוֹבָ֥ב בֶּן זֶ֖רַח מִ/בָּצְרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/044.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: de
  text: Bela starb, und Jobab aus Bozra, ein Sohn Serachs, wurde an seiner Stelle König.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jobab von Bozra«. Die hebräische Präposition kann die Herkunft oder die Zugehörigkeit zu der Stadt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: starb
  rationale: Das Wayyiqtol von מוּת führt das nächste Ereignis der Erzählfolge ein; im Deutschen gibt das Präteritum die genealogisch-historische Erzählweise natürlich wieder.
- source_word: בָּלַע
  choice: Bela
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition als »Bela« wiedergegeben.
- source_word: וַיִּמְלֹךְ
  choice: wurde … König
  rationale: מלך im Qal-Wayyiqtol bezeichnet hier im Rahmen der Thronfolge den Regierungsantritt; »wurde König« ist im heutigen Deutsch natürlicher und präziser als das möglicherweise nur fortdauernde »regierte«.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Verbindung mit dem Pronominalsuffix bezeichnet in einer Nachfolgeformel das Einnehmen der Stellung des Vorgängers.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Der Personenname wird in der etablierten deutschen Form wiedergegeben.
- source_word: בֶּן זֶרַח
  choice: der Sohn Serachs
  rationale: Die hebräische Abstammungsangabe wird in natürlichem, zugleich transparentem Deutsch wiedergegeben.
- source_word: מִבָּצְרָה
  choice: aus Bozra
  rationale: Die Präposition מִן bezeichnet hier am ehesten Herkunft, kann jedoch auch eine allgemeinere Zugehörigkeit zur Stadt ausdrücken; diese Spannweite wird in der Fußnote vermerkt.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper chronistischer Nachfolgeformel. Der Regierungsantritt wird idiomatisch als »wurde … König« formuliert; die mögliche Bedeutungsbreite der Herkunftsangabe bleibt durch die Fußnote sichtbar.
