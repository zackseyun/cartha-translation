  text: וְ/אֶת אוֹפִ֥יר וְ/אֶת חֲוִילָ֖ה וְ/אֶת יוֹבָ֑ב כָּל אֵ֖לֶּה בְּנֵ֥י יָקְטָֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/023.yaml
  text: and Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: de
  text: und Ofir, Hawila und Jobab. Alle diese waren Söhne Joktans.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachkommen Joktans“. Im Hebräischen steht „Söhne Joktans“; in genealogischen Zusammenhängen kann „Söhne“ mitunter auch allgemeiner eine Abstammungslinie bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: und
  rationale: אֵת ist hier der nicht eigens wiederzugebende Akkusativmarker; das Präfix וְ führt die Aufzählung mit „und“ fort. Im Deutschen genügt eine natürliche Reihung mit Kommas und einem abschließenden „und“.
- source_word: אוֹפִיר
  choice: Ofir
  rationale: Der Eigenname wird in der im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: חֲוִילָה
  choice: Hawila
  rationale: Der Eigenname wird in der etablierten deutschen biblischen Schreibweise transliteriert.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Der Eigenname wird in seiner geläufigen deutschen biblischen Form wiedergegeben.
- source_word: כָּל אֵלֶּה
  choice: Alle diese
  rationale: Die Formulierung fasst sämtliche zuvor genannten Namen zusammen und bewahrt den demonstrativen Nachdruck des Hebräischen.
- source_word: בְּנֵי
  choice: Söhne
  rationale: Das hebräische maskuline Pluralwort bedeutet wörtlich „Söhne“. Die breitere genealogische Möglichkeit „Nachkommen“ wird nicht in den Haupttext eingetragen, sondern in einer Fußnote offengehalten.
- source_word: יָקְטָן
  choice: Joktan
  rationale: Der Eigenname wird in der traditionellen und gut erkennbaren deutschen biblischen Form wiedergegeben.
theological_decisions:
- issue: Reichweite von בְּנֵי in einer Genealogie
  choice: Söhne Joktans
  alternative: Nachkommen Joktans
  rationale: Der Haupttext folgt der konkreten Wortbedeutung „Söhne“, ohne auszuschließen, dass der Ausdruck in genealogischen Zusammenhängen eine weitere Abstammungslinie bezeichnen kann.
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die knappe genealogische Listenform bleibt erhalten. Das im Hebräischen fehlende Kopulaverb wird idiomatisch durch „waren“ ergänzt. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung und nicht bei „Ofir“.
