source:
  edition: WLC
  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְר֑וֹד ה֣וּא הֵחֵ֔ל לִ/הְי֥וֹת גִּבּ֖וֹר בָּ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/010.yaml
  text: And Cush fathered Nimrod[a]; he began to be a mighty one in the land.
translation:
  language: de
  text: Und Kusch zeugte Nimrod; er begann, ein Mächtiger im Land[a] zu sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der Erde“. Das hebräische Wort אֶרֶץ kann „Land“ oder „Erde“ bedeuten.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְ/כ֖וּשׁ
  choice: Und Kusch
  rationale: וְ verbindet den genealogischen Eintrag schlicht mit dem Vorhergehenden. כּוּשׁ wird nach üblicher deutscher Namensform als „Kusch“ wiedergegeben.
- source_word: יָלַ֣ד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet ילד das Zeugen beziehungsweise die Vaterschaft. „Zeugte“ ist knapp, präzise und im Deutschen für Stammbäume geläufig.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: אֶת kennzeichnet das bestimmte direkte Objekt und hat im Deutschen keine eigenständige Entsprechung.
- source_word: נִמְר֑וֹד
  choice: Nimrod
  rationale: Der Eigenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: ה֣וּא
  choice: er
  rationale: Das selbstständige Pronomen greift Nimrod nachdrücklich wieder auf; im Deutschen wird dies natürlich mit „er“ ausgedrückt.
- source_word: הֵחֵ֔ל
  choice: begann
  rationale: Der Hifil von חלל mit Infinitiv bedeutet gewöhnlich „beginnen“. Diese Wiedergabe bewahrt die Verlaufs- beziehungsweise Anfangsaussage, ohne „war der Erste“ oder „wurde“ interpretierend festzulegen.
- source_word: לִ/הְי֥וֹת
  choice: zu sein
  rationale: Der Infinitiv von היה wird in Verbindung mit „begann“ formal und verständlich als „zu sein“ wiedergegeben.
- source_word: גִּבּ֖וֹר
  choice: ein Mächtiger
  rationale: גִּבּוֹר kann einen Mächtigen, Helden oder Krieger bezeichnen. Da der Vers keine ausdrücklich militärische Tätigkeit nennt, wahrt „ein Mächtiger“ die breite Bedeutung und vermeidet die Einengung auf „Krieger“.
- source_word: בָּ/אָֽרֶץ
  choice: im Land
  rationale: אֶרֶץ kann je nach Zusammenhang „Land“ oder „Erde“ bedeuten. „Im Land“ bewahrt die räumliche Aussage, ohne Nimrods Bedeutung ausdrücklich auf die ganze Erde auszudehnen; die weitere Möglichkeit steht in der Fußnote.
theological_decisions:
- issue: Reichweite von בָּאָרֶץ bei der Beschreibung Nimrods
  choice: im Land
  alternative: auf der Erde
  rationale: Der hebräische Ausdruck ist mehrdeutig und kann regional oder universal verstanden werden. Der Haupttext verwendet die zurückhaltendere Lesart; die ebenso mögliche umfassendere Lesart wird in der Fußnote bewahrt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die genealogische Kürze bleibt erhalten; „ein Mächtiger“ bewahrt die allgemeine Charakterisierung des Hebräischen, und die etwas markante Verbindung „begann … zu sein“ spiegelt bewusst die Formulierung des Ausgangstextes.
