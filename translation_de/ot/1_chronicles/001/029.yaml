source:
  edition: WLC
  text: אֵ֖לֶּה תֹּלְדוֹתָ֑/ם בְּכ֤וֹר יִשְׁמָעֵאל֙ נְבָי֔וֹת וְ/קֵדָ֥ר וְ/אַדְבְּאֵ֖ל וּ/מִבְשָֽׂם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/029.yaml
  text: 'These are their generations: the firstborn of Ishmael[a], Nebaioth, Kedar, Adbeel, and Mibsam.'
translation:
  language: de
  text: 'Dies sind ihre Nachkommen: Ismaels Erstgeborener, Nebajot, Kedar, Adbeël und Mibsam.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Dies sind
  rationale: Die deiktische Pluralform leitet hier eine genealogische Aufzählung ein; die präsentische Formel entspricht dem hebräischen Nominalsatz.
- source_word: תֹּלְדוֹתָם
  choice: ihre Nachkommen
  rationale: Im genealogischen Zusammenhang bezeichnet תּוֹלְדוֹת hier die aus der zuvor genannten Gruppe hervorgegangenen Nachkommen; „Nachkommen“ ist im heutigen Deutsch natürlicher als das formale „Generationen“.
- source_word: בְּכוֹר יִשְׁמָעֵאל
  choice: Ismaels Erstgeborener
  rationale: Die knappe Genitivverbindung wahrt den Sinn des hebräischen Ausdrucks, ohne das nicht ausdrücklich stehende Wort „Sohn“ einzufügen.
- source_word: נְבָיוֹת
  choice: Nebajot
  rationale: Diese in deutschen Bibeln etablierte Namensform gibt den hebräischen Eigennamen angemessen wieder.
- source_word: קֵדָר
  choice: Kedar
  rationale: Etablierte deutsche Wiedergabe des Eigennamens.
- source_word: אַדְבְּאֵל
  choice: Adbeël
  rationale: Die Trema-Schreibung macht die getrennte Aussprache der Vokale sichtbar und entspricht einer gebräuchlichen deutschen Namensform.
- source_word: מִבְשָׂם
  choice: Mibsam
  rationale: Direkte und im Deutschen etablierte Wiedergabe des Eigennamens.
- source_word: וְ
  choice: danach kamen … und
  rationale: Das wiederholte ו verbindet die Namen der Aufzählung. „Danach kamen“ verdeutlicht idiomatisch, dass nur Nebajot als Erstgeborener bezeichnet wird, ohne eine zusätzliche Rangfolge unter den übrigen Söhnen zu behaupten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die genealogische Einleitungsformel bleibt erkennbar, während „Nachkommen“ und die syntaktisch klare Aufzählung für heutige Leser natürlich verständlich sind.
