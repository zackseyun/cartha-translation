base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/039.yaml
  text: 'The sons of Lotan: Hori and Homam[a]; and Lotan’s sister was Timna.'
translation:
  language: de
  text: 'Die Söhne Lotans: Hori und Homam[a]. Lotans Schwester war Timna.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im parallelen Geschlechtsregister in 1. Mose 36,22 lautet der Name Hemam statt Homam.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי לוֹטָן
  choice: Die Söhne Lotans
  rationale: בְּנֵי ist der Konstruktplural von „Sohn“. In einem Geschlechtsregister ist „die Söhne“ die präzise und natürliche Wiedergabe; die vorangestellte Konjunktion muss im Deutschen nicht eigens mit „und“ wiedergegeben werden.
- source_word: חֹרִי
  choice: Hori
  rationale: Der Kontext weist die Form als Personennamen aus; sie wird daher transliteriert und nicht als Volksbezeichnung „Horiter“ übersetzt.
- source_word: וְהוֹמָם
  choice: und Homam[a]
  rationale: Der in der Chronik überlieferte Name הוֹמָם wird als „Homam“ wiedergegeben. Die abweichende Form in 1. Mose 36,22 wird in einer Fußnote dokumentiert, ohne den Wortlaut der Chronik anzugleichen.
- source_word: וַאֲחוֹת לוֹטָן
  choice: Lotans Schwester war
  rationale: אֲחוֹת bedeutet „Schwester“. Das im hebräischen Nominalsatz fehlende Kopulaverb wird im Deutschen idiomatisch durch „war“ ergänzt; das Possessivverhältnis wird mit dem Genitiv ausgedrückt.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Der Personenname wird entsprechend der hier vorliegenden hebräischen Form ohne abschließendes He als „Timna“ transliteriert.
