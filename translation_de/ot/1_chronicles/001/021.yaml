lexical_decisions:
- source_word: הֲדוֹרָם
  choice: Hadoram
  rationale: Der Eigenname wird nach der masoretischen Vokalisierung in einer im Deutschen gut lesbaren Form transliteriert.
- source_word: אוּזָל
  choice: Usal
  rationale: Der hebräische Buchstabe Zajin wird nach üblicher deutscher Wiedergabe mit „s“ transliteriert; dadurch entspricht die Aussprache näher dem Hebräischen als bei englischem „z“.
- source_word: דִּקְלָה
  choice: Dikla
  rationale: Der Eigenname wird entsprechend der masoretischen Vokalisierung transliteriert; das auslautende ה bezeichnet hier den Vokal a und wird nicht als eigener Konsonant wiedergegeben.
- source_word: וְ/אֶת ... וְ/אֶת ... וְ/אֶת
  choice: Aufzählung mit „und“ vor dem letzten Namen
  rationale: Die wiederholte Verbindung aus Konjunktion und Akkusativmarker führt die Namen als aufeinanderfolgende Objekte weiter. Eine natürliche deutsche Aufzählung gibt die Funktion wieder, ohne die bedeutungsarmen Formwörter mechanisch nachzubilden.
