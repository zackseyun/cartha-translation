  text: וּ/בְנֵ֥י יָוָ֖ן אֱלִישָׁ֣ה וְ/תַרְשִׁ֑ישָׁ/ה כִּתִּ֖ים וְ/רוֹדָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/007.yaml
  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Rodanim.'
translation:
  language: de
  text: 'Und die Söhne Jawans: Elischa, Tarschisch, Kittim und Rodanim.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In 1. Mose 10,4 steht »Dodanim« statt »Rodanim«; darin zeigt sich eine Textvariante des Namens.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Die konstruktive Pluralform bedeutet wörtlich »Söhne von«. Die genealogische Ausdrucksweise bleibt so erhalten, auch wenn damit im weiteren Sinn Nachkommen oder Völker gemeint sein können.
- source_word: יָוָן
  choice: Jawan
  rationale: Der Eigenname wird in der im Deutschen üblichen bibelnahen Form wiedergegeben, statt ihn deutend mit »Griechenland« oder »die Griechen« zu übersetzen.
- source_word: אֱלִישָׁה
  choice: Elischa
  rationale: Der Eigenname wird in einer geläufigen deutschen Umschrift wiedergegeben.
- source_word: תַּרְשִׁישָׁה
  choice: Tarschisch
  rationale: Der Eigenname wird in der traditionellen und weiterhin verständlichen deutschen Form wiedergegeben; das auslautende He verlangt hier keine zusätzliche Übersetzung.
- source_word: כִּתִּים
  choice: Kittim
  rationale: Der Volks- beziehungsweise Ortsname wird eng am hebräischen Lautbestand und in gebräuchlicher deutscher Schreibweise wiedergegeben.
- source_word: וְרוֹדָנִים
  choice: und Rodanim
  rationale: Der Haupttext folgt dem masoretischen Text von 1. Chronik, der רוֹדָנִים liest. Die abweichende Namensform der Parallelstelle wird in einer Fußnote bewahrt.
