source:
  edition: WLC
  text: וּ/מִשְׁכַּ֣ן יְ֠הוָה אֲשֶׁר עָשָׂ֨ה מֹשֶׁ֧ה בַ/מִּדְבָּ֛ר וּ/מִזְבַּ֥ח הָ/עוֹלָ֖ה בָּ/עֵ֣ת הַ/הִ֑יא בַּ/בָּמָ֖ה בְּ/גִבְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/029.yaml
  text: The tabernacle of Yahweh, which Moses had made in the wilderness, and the altar of burnt offering were at that time on the high place at Gibeon.
translation:
  language: de
  text: Die Wohnstätte Jahwes, die Mose in der Wüste errichtet hatte, und der Brandopferaltar befanden sich damals auf der Kulthöhe in Gibeon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכַּן
  choice: Wohnung
  rationale: Im kultischen Zusammenhang bezeichnet das Wort das von Mose errichtete Heiligtum als Wohnstätte Gottes. „Wohnung“ ist quellennah und im Zusammenhang verständlich; das traditionellere „Stiftshütte“ würde die Zeltgestalt deutlicher machen, ist aber heute weniger unmittelbar verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֲשֶׁר עָשָׂה מֹשֶׁה
  choice: die Mose … angefertigt hatte
  rationale: Das Plusquamperfekt verdeutlicht den Rückblick auf Moses frühere Herstellung des Heiligtums; „angefertigt“ passt im Deutschen besser zu einem hergestellten Heiligtum als das allgemeinere „gemacht“.
- source_word: בַמִּדְבָּר
  choice: in der Wüste
  rationale: „Wüste“ ist die geläufige deutsche Wiedergabe im Zusammenhang der Wüstenwanderung.
- source_word: מִזְבַּח הָעוֹלָה
  choice: Brandopferaltar
  rationale: Das etablierte deutsche Kompositum bezeichnet präzise den Altar für das vollständig verbrannte Opfer.
- source_word: בָּעֵת הַהִיא
  choice: damals
  rationale: Die knappe natürliche Zeitangabe gibt „zu jener Zeit“ sinngemäß und vollständig wieder.
- source_word: בַּבָּמָה
  choice: auf der Kulthöhe
  rationale: בָּמָה bezeichnet hier eine erhöhte Kultstätte. „Kulthöhe“ macht im modernen Deutsch die religiöse Funktion klarer als das missverständliche bloße „Höhe“.
- source_word: בְּגִבְעוֹן
  choice: bei Gibeon
  rationale: Die Präposition lokalisiert die Kultstätte im Bereich von Gibeon; „bei Gibeon“ ist dafür idiomatisch.
- source_word: וּ
  choice: und / syntaktische Verknüpfung
  rationale: Das erste וּ verbindet die Nominalgruppe mit dem Kontext, erfordert im Deutschen aber keinen vorangestellten Diskursmarker. Das zweite wird als „und“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen. „Jahwe“ bewahrt ihn als solchen und verwendet die im Deutschen übliche wissenschaftliche Form, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung des mosaischen Heiligtums
  choice: Wohnung
  alternative: Stiftshütte; Zeltwohnung
  rationale: „Wohnung“ erhält die theologische Aussage des hebräischen מִשְׁכָּן als göttliche Wohnstätte. Der Vers selbst nennt an dieser Stelle nicht ausdrücklich ein Zelt; diese bauliche Gestalt darf aus dem weiteren Zusammenhang mitgehört, sollte aber nicht zwingend in das Wort hineingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung bleibt nahe am hebräischen Satz, klingt aber natürlich. Kein einleitendes „Nun“, da וּ hier keinen ausdrücklichen Zeitbegriff enthält. „Kulthöhe“ wird zur Vermeidung des im heutigen Deutsch unklaren Fachworts „Höhe“ verwendet.
