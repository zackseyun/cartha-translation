  rationale: Die Revision präzisiert die örtliche Angabe, verbessert die moderne deutsche Verständlichkeit des kultischen Begriffs מִשְׁכָּן und ersetzt eine unnötig technische Formulierung. Die nominale Satzstruktur, der Rückblick durch das Plusquamperfekt und die kultische Terminologie des hebräischen Textes bleiben erhalten.
