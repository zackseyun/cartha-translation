base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/024.yaml
  text: But King David said to Ornan[a], “No, for I will surely buy it for the full price in silver, because I will not take for Yahweh what is yours[b], nor offer up a burnt offering for nothing.”
translation:
  language: de
  text: 'Doch König David sagte zu Ornan: „Nein, ich werde es unbedingt für den vollen Preis in Silber[a] kaufen; denn ich will nicht für Jahwe nehmen, was dir gehört, und auch kein Brandopfer umsonst darbringen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für den vollen Betrag in Silber“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  choice: Nein! … Denn
  rationale: Die feste Ablehnung und die anschließende Begründung werden im Deutschen klar und natürlich wiedergegeben.
- source_word: קָנֹה אֶקְנֶה
  choice: Ich werde es … kaufen
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb betont Davids feste Entschlossenheit. Das vorangestellte „Nein!“ und der bestimmte Zusammenhang tragen diese Bekräftigung im natürlichen Deutschen mit.
- source_word: בְּכֶסֶף מָלֵא
  choice: zum vollen Preis in Silber
  rationale: Die Wendung bezeichnet eine vollständige Bezahlung und nennt zugleich Silber als Zahlungsmittel.
- source_word: אֶשָּׂא אֲשֶׁר לְךָ
  choice: ich will nicht … nehmen, was dir gehört
  rationale: נשׂא bezeichnet hier das Ansichnehmen fremden Eigentums; die Besitzangabe wird unmittelbar und verständlich ausgedrückt.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet hier die Bestimmung für Jahwe; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וְהַעֲלוֹת עוֹלָה חִנָּם
  choice: und kein Brandopfer umsonst darbringen
  rationale: Die deutsche negative Koordination gibt den Sinn wieder, dass David weder fremdes Eigentum für Jahwe nehmen noch ohne eigene Kosten opfern will. „Brandopfer“ bewahrt den spezifischen Opferbegriff.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt dessen Charakter als offenbarten Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug von חִנָּם („umsonst“)
  choice: auf das Darbringen des Brandopfers bezogen
  alternative: als ausdrückliche Aussage, das Opfer dürfe David nichts kosten
  rationale: Grammatisch bestimmt חִנָּם unmittelbar das Darbringen. Der weitere Gedanke persönlicher Kosten ist im Zusammenhang naheliegend, wird aber nicht erklärend in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist entschieden, aber nicht altertümlich. Die Satzstellung „für Jahwe nehmen, was dir gehört“ folgt der hebräischen Gedankenfolge und bleibt im Deutschen verständlich.
