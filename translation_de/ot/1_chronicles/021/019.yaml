  text: וַ/יַּ֤עַל דָּוִיד֙ בִּ/דְבַר גָּ֔ד אֲשֶׁ֥ר דִּבֶּ֖ר בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/019.yaml
  text: So David went up at the word of Gad[b][a], which he had spoken in the name of Yahweh.
translation:
  language: de
  text: Da ging David hinauf, wie Gad es im Namen Jahwes gesagt hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: Da ging … hinauf
  rationale: עלה bezeichnet ein Hinaufgehen. Die Formulierung bewahrt die räumliche Richtung und klingt im Deutschen natürlich.
- source_word: בִּדְבַר גָּד
  choice: auf Gads Wort
  rationale: Die Präposition ב bezeichnet hier Grundlage beziehungsweise Übereinstimmung; die Wendung zeigt, dass David Gads Weisung folgte.
- source_word: אֲשֶׁר דִּבֶּר
  choice: das dieser … gesprochen hatte
  rationale: Das Demonstrativpronomen „dieser“ macht eindeutig, dass Gad der Sprecher ist; das Plusquamperfekt gibt die zeitliche Abfolge natürlich wieder.
- source_word: בְּשֵׁם יְהוָה
  choice: im Namen Jahwes
  rationale: Die formnahe Wendung bewahrt sowohl den Gedanken bevollmächtigten prophetischen Redens als auch den ausdrücklich verwendeten Gottesnamen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen; „der HERR“ wäre die traditionelle deutsche Ersatzlesung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur des Hebräischen bleibt erhalten; „auf Gads Wort“ ist bewusst formnah und dennoch verständlich.
