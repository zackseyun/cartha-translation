  naturalness: '„auf Gads Wort hinauf“ ist im modernen Standarddeutsch keine natürliche Verbindung: Die feste Wendung lautet „auf jemandes Wort hin“, während „hinauf“ die eigenständige Richtungsangabe zu עלה wiedergibt. Eine Umstellung ermöglicht beides ohne Unklarheit.'
