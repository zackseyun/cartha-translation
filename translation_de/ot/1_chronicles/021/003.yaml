base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/003.yaml
  text: But Joab said[a], “May Yahweh add to his people a hundred times as many as they are! Are they not all, my lord the king[c][b], servants of my lord? Why does my lord seek this? Why should it become guilt for Israel?”
translation:
  language: de
  text: 'Doch Joab sagte: »Möge Jahwe zu seinem Volk hundertmal so viele hinzufügen, wie es jetzt zählt! Sind sie nicht alle, mein Herr, der König, Diener meines Herrn?[a] Warum verlangt mein Herr das? Warum soll es Israel zur Schuld werden?[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sklaven meines Herrn«.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist Schuld oder Schuldhaftung, die Israel durch diese Handlung treffen würde.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹסֵף
  choice: Möge … machen
  rationale: Der Jussiv drückt Joabs Wunsch beziehungsweise Gebet aus. Zusammen mit der Mengenangabe gibt »Möge … hundertmal so zahlreich machen« den Sinn im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַל עַמּוֹ כָּהֵם מֵאָה פְעָמִים
  choice: sein Volk hundertmal so zahlreich machen, wie es jetzt ist
  rationale: Die hebräische Wendung bezeichnet eine Vermehrung auf das Hundertfache gegenüber dem gegenwärtigen Bestand.
- source_word: הֲלֹא
  choice: Sind sie nicht
  rationale: Die negative rhetorische Frage erwartet Zustimmung und lässt sich so idiomatisch und formnah wiedergeben.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr und König
  rationale: Die Formulierung bewahrt die ehrerbietige höfische Anrede; »und« macht die Apposition im modernen Deutschen flüssig.
- source_word: כֻּלָּם לַאדֹנִי לַעֲבָדִים
  choice: alle … Diener meines Herrn
  rationale: עֲבָדִים bezeichnet hier die politische Unterordnung unter den König. »Diener« trifft den Kontext, während »Sklaven« als mögliche wörtlichere Alternative vermerkt wird.
- source_word: יְבַקֵּשׁ זֹאת
  choice: verlangt … das
  rationale: בקש kann hier das Fordern beziehungsweise Betreiben der Volkszählung bezeichnen. »Verlangt« ist im Deutschen natürlicher als »sucht dies«.
- source_word: יִהְיֶה לְאַשְׁמָה לְיִשְׂרָאֵל
  choice: soll es Israel zur Schuld werden
  rationale: Die Konstruktion bezeichnet daraus entstehende Schuld oder Haftung für Israel, ohne ausdrücklich festzulegen, ob der Akzent auf Ursache, Zustand oder Folge liegt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Transliteration bewahrt ihn als Namen statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עֲבָדִים im Verhältnis zum König
  choice: Diener
  alternative: Sklaven
  rationale: Im unmittelbaren Zusammenhang steht die Untertanenstellung des Volkes im Vordergrund. Die mögliche stärkere Bedeutung wird in einer Fußnote offengehalten.
- issue: Bedeutung von אַשְׁמָה
  choice: Schuld
  alternative: Anlass zur Schuld / Schuldhaftung
  rationale: Im Kontext ist kein Schuldopfer gemeint, sondern die durch die Handlung entstehende Schuld oder Verantwortlichkeit Israels. Die knappe Wiedergabe wahrt die Spannung der hebräischen Formulierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Joabs höfische Anrede und die rhetorischen Fragen bleiben erhalten. Die Satzstellung wurde für natürliche deutsche Rede behutsam geglättet; echte Bedeutungsbreiten werden in den Fußnoten offengehalten.
