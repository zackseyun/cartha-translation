  text: וַ/יָּבֹ֥א דָוִ֖יד עַד אָרְנָ֑ן וַ/יַּבֵּ֤ט אָרְנָן֙ וַ/יַּ֣רְא אֶת דָּוִ֔יד וַ/יֵּצֵא֙ מִן הַ/גֹּ֔רֶן וַ/יִּשְׁתַּ֧חוּ לְ/דָוִ֛יד אַפַּ֖יִם אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/021.yaml
  text: When David came to Ornan[a], Ornan looked and saw David, and he went out from the threshing floor and bowed down before David with his face to the ground.
translation:
  language: de
  text: Als David zu Ornan kam, blickte Ornan hin und sah David. Er ging von der Tenne hinaus und warf sich vor David nieder, mit dem Gesicht zur Erde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verneigte sich tief vor David«. Das Hebräische beschreibt eine vollständige Niederwerfung mit dem Gesicht zur Erde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא דָוִיד עַד אָרְנָן
  choice: Als David zu Ornan kam
  rationale: בוא bezeichnet je nach Perspektive »kommen« oder »gehen«; עַד gibt hier das Ziel der Annäherung an eine Person an. Die deutsche Wendung ist natürlich und bewahrt die Bewegung zu Ornan hin.
- source_word: וַיַּבֵּט אָרְנָן וַיַּרְא אֶת דָּוִיד
  choice: blickte Ornan hin und sah David
  rationale: 'Die beiden aufeinanderfolgenden Verben נבט und ראה werden nicht zusammengezogen: Ornan richtet den Blick hin und nimmt David wahr. »Hinblicken« vermeidet das im Hebräischen nicht ausdrücklich enthaltene »aufblicken«.'
- source_word: וַיֵּצֵא מִן הַגֹּרֶן
  choice: Da ging er von der Tenne hinaus
  rationale: יצא bezeichnet das Hinausgehen, מן den Ausgangspunkt. »Tenne« ist der geläufige und präzise deutsche Ausdruck für גֹּרֶן.
- source_word: וַיִּשְׁתַּחוּ לְדָוִיד
  choice: warf sich vor David nieder
  rationale: Die Formulierung gibt die körperliche Unterwerfungsgeste von השתחוה konkret wieder, ohne sie als Gottesverehrung zu deuten.
- source_word: אַפַּיִם אָרְצָה
  choice: mit dem Gesicht zur Erde
  rationale: Die wörtlich etwa »Nasen/Gesicht erdwärts« lautende Wendung bezeichnet eine vollständige Niederwerfung und wird im Deutschen idiomatisch wiedergegeben.
theological_decisions:
- issue: Ob Ornans Handlung als Anbetung Davids wiederzugeben ist
  choice: warf sich vor David nieder
  alternative: betete David an; verneigte sich vor David
  rationale: השתחוה kann je nach Zusammenhang menschliche Huldigung oder Gottesverehrung bezeichnen. Hier wird die sichtbare Geste gegenüber dem König beschrieben; die Übersetzung benennt diese, ohne eine religiöse Verehrung zu behaupten. »Verneigte sich« wäre angesichts des Gesichts zur Erde zu schwach.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurze Satzteilung macht die hebräische Handlungsfolge verständlich, während »blickte … hin und sah« ihre Zweistufigkeit bewahrt. »Tenne« ist sachlich präzise und im biblisch-agrarischen Zusammenhang gut verständlich.
