source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֔יא בִּ/רְא֤וֹת דָּוִיד֙ כִּי עָנָ֣/הוּ יְהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֣ן הַ/יְבוּסִ֑י וַ/יִּזְבַּ֖ח שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/028.yaml
  text: At that time[a], when David saw that Yahweh had answered him at the threshing floor of Ornan the Jebusite, he sacrificed there.
translation:
  language: de
  text: Zu jener Zeit, als David sah, dass Jahwe ihm auf der Tenne Ornans, des Jebusiters, geantwortet hatte, brachte er dort Opfer dar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Die feste Zeitangabe wird im Deutschen natürlich wiedergegeben und wahrt die Verknüpfung mit dem vorhergehenden Geschehen, ohne einen einzelnen Augenblick zu behaupten.
- source_word: בִּרְאוֹת דָּוִיד
  choice: als David sah
  rationale: Der Infinitivus constructus mit בְּ bezeichnet hier einen zeitlichen Begleitumstand; die finite deutsche Konstruktion ist idiomatisch und präzise.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet den Inhalt dessen ein, was David erkannte beziehungsweise sah; eine kausale Übersetzung mit „weil“ würde den Zusammenhang stärker festlegen.
- source_word: עָנָהוּ
  choice: ihm ... geantwortet hatte
  rationale: ענה bezeichnet hier Gottes Antwort auf Davids Opfer beziehungsweise Anrufung. Das Plusquamperfekt verdeutlicht, dass die Antwort dem daraus folgenden Opfer vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּגֹרֶן
  choice: auf der Tenne
  rationale: גֹּרֶן bezeichnet den Dreschplatz; „Tenne“ ist die knappe, etablierte deutsche Entsprechung, und „auf“ passt zur Fläche des Ortes.
- source_word: אָרְנָן הַיְבוּסִי
  choice: des Jebusiters Ornan
  rationale: Die deutsche Genitivfügung gibt sowohl den Besitzer der Tenne als auch seine Volkszugehörigkeit klar und natürlich wieder.
- source_word: וַיִּזְבַּח שָׁם
  choice: brachte er dort Opfer dar
  rationale: זבח bezeichnet kultisches Opfern. Die idiomatische deutsche Wendung wahrt den Sinn, ohne eine im Hebräischen nicht genannte Anzahl von Opfern festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt diese Namensfunktion, während „der HERR“ den Namen durch einen Titel ersetzt.
- issue: Art der göttlichen Antwort
  choice: ihm geantwortet hatte
  alternative: ihn erhört hatte
  rationale: „Geantwortet“ wahrt die weitere Bedeutung von ענה und lässt offen, auf welche Weise die Antwort erfolgte. Der Kontext deutet zwar auf Erhörung durch Feuer hin, doch „erhört“ wäre interpretativ enger.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Ablauf, klingt aber natürlich. „Tenne“ und „Opfer darbringen“ sind geläufige biblisch-kultische Begriffe; der Text vermeidet unnötige konfessionelle Festlegungen.
