base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/011.yaml
  text: So Gad came to David and said to him[a], “Thus says Yahweh, ‘Choose for yourself—’”
translation:
  language: de
  text: 'Da kam Gad zu David und sagte zu ihm: „So spricht Jahwe: Entscheide dich[a] —“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Nimm für dich an“. Im Zusammenhang ist David aufgefordert, unter den im folgenden Vers genannten Möglichkeiten zu wählen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kam
  rationale: Die Erzählform von בוא bezeichnet hier Gads Kommen zu David; „Da kam“ gibt den fortlaufenden Erzählstil natürlich wieder.
- source_word: גָד
  choice: Gad
  rationale: Der Personenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: אֶל דָּוִיד
  choice: zu David
  rationale: אֶל bezeichnet die Bewegung auf eine Person zu; „zu David“ ist die natürliche deutsche Entsprechung.
- source_word: וַיֹּאמֶר לוֹ
  choice: und sagte zu ihm
  rationale: אמר mit indirektem Objekt wird eng am Wortlaut und zugleich idiomatisch wiedergegeben.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Dies ist die geläufige, würdevolle deutsche Wiedergabe der prophetischen Botenformel; das Präsens stellt die übermittelte Rede als gegenwärtigen Ausspruch dar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: קַבֶּל
  choice: Entscheide dich
  rationale: Das Verb bedeutet grundsätzlich „annehmen/entgegennehmen“; im Zusammenhang fordert Gad David jedoch auf, unter den anschließend genannten Möglichkeiten zu wählen. Die wörtlichere Alternative bleibt in der Fußnote erhalten.
- source_word: לָךְ
  choice: dich
  rationale: Zusammen mit dem Imperativ wird der persönliche Bezug Davids idiomatisch durch das reflexive „dich“ ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm als Gottes persönlichen Namen. „Jahwe“ bewahrt diesen Charakter, statt den Namen durch einen Titel zu ersetzen.
- issue: Bedeutung von קַבֶּל im Gerichtswort
  choice: Entscheide dich
  alternative: Nimm für dich an
  rationale: Der folgende Vers nennt die Möglichkeiten, zwischen denen David wählen soll. Die kontextuelle Bedeutung wird im Haupttext ausgedrückt, während die lexikalisch wörtlichere Lesart in der Fußnote dokumentiert wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die prophetische Formel „So spricht Jahwe“ bleibt prägnant; der Gedankenstrich wahrt den offenen Übergang zum folgenden Vers.
