source:
  edition: WLC
  text: וּ/דְבַר הַ/מֶּ֖לֶךְ חָזַ֣ק עַל יוֹאָ֑ב וַ/יֵּצֵ֣א יוֹאָ֗ב וַ/יִּתְהַלֵּךְ֙ בְּ/כָל יִשְׂרָאֵ֔ל וַ/יָּבֹ֖א יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/004.yaml
  text: But the king’s word prevailed against Joab[a]. So Joab went out and went throughout all Israel[b], and he came to Jerusalem.
translation:
  language: de
  text: Doch das Wort des Königs setzte sich gegen Joab durch[a]. Da zog Joab aus und bereiste ganz Israel[b]; dann kam er nach Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch der Befehl des Königs setzte sich gegenüber Joab durch.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zog durch ganz Israel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבַר הַמֶּלֶךְ
  choice: Doch das Wort des Königs
  rationale: דָּבָר bedeutet wörtlich „Wort“ und bezeichnet hier den verbindlichen Befehl des Königs. „Wort“ bewahrt die hebräische Ausdrucksweise; „Doch“ markiert den Gegensatz zu Joabs vorherigem Einwand.
- source_word: חָזַק עַל
  choice: setzte sich gegen Joab durch
  rationale: Die Wendung bedeutet wörtlich, dass das Wort gegenüber Joab stark war. „Sich gegen jemanden durchsetzen“ gibt idiomatisch wieder, dass der königliche Wille Joabs Widerstand überwand.
- source_word: וַיֵּצֵא יוֹאָב
  choice: Da zog Joab aus
  rationale: יָצָא bezeichnet das Hinausgehen beziehungsweise Aufbrechen. „Da“ stellt hier den erzählerischen Folgezusammenhang her.
- source_word: וַיִּתְהַלֵּךְ בְּכָל יִשְׂרָאֵל
  choice: und bereiste ganz Israel
  rationale: Die Hitpael-Form von הָלַךְ beschreibt hier ein Umherziehen. „Bereiste“ ist im Deutschen natürlich und drückt die Bewegung durch das gesamte Gebiet aus, ohne den Zweck über den Kontext hinaus auszubuchstabieren.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Die Formulierung gibt den umfassenden nationalen beziehungsweise territorialen Umfang knapp und idiomatisch wieder.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: dann kam er nach Jerusalem
  rationale: בּוֹא bedeutet „kommen/eintreten“. Obwohl der Zusammenhang eine Rückkehr nahelegt, bleibt „kam“ näher am ausdrücklichen Wortlaut.
