  text: וַ/יָּ֣שָׁב אָרְנָ֗ן וַ/יַּרְא֙ אֶת הַ/מַּלְאָ֔ךְ וְ/אַרְבַּ֧עַת בָּנָ֛י/ו עִמּ֖/וֹ מִֽתְחַבְּאִ֑ים וְ/אָרְנָ֖ן דָּ֥שׁ חִטִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/020.yaml
  text: Ornan turned and saw the angel[a], and his four sons with him were hiding themselves, while Ornan was threshing wheat.
translation:
  language: de
  text: Ornan wandte sich um und sah den Engel. Seine vier Söhne, die bei ihm waren, versteckten sich[a], während Ornan Weizen drosch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: hielten sich versteckt.'
    reason: Die hebräische reflexive Form kann sowohl das Sichverstecken als Vorgang als auch das Verborgensein der Söhne ausdrücken.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: wandte sich um
  rationale: שׁוב bezeichnet ein Sichwenden oder Zurückkehren; im erzählerischen Zusammenhang ist eine körperliche Wendung gemeint. „Wandte sich um“ ist im Deutschen natürlich und führt unmittelbar zum Sehen des Engels.
- source_word: וַיַּרְא אֶת הַמַּלְאָךְ
  choice: sah den Engel
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten. Im Zusammenhang des göttlichen Gerichts ist ein übernatürlicher Bote gemeint, daher ist „Engel“ sachgerecht.
- source_word: וְאַרְבַּעַת בָּנָיו עִמּוֹ
  choice: Seine vier Söhne, die bei ihm waren
  rationale: Die Wiedergabe ordnet עִמּוֹ eindeutig den Söhnen zu und klingt im Deutschen natürlicher als „seine vier Söhne bei ihm“.
- source_word: מִתְחַבְּאִים
  choice: versteckten sich
  rationale: Die reflexive bzw. mediale Bedeutung des Hitpael wird durch „sich verstecken“ unmittelbar bewahrt. Die fortlaufende Handlung ergibt sich im Deutschen aus dem Kontext.
- source_word: וְאָרְנָן דָּשׁ חִטִּים
  choice: während Ornan Weizen drosch
  rationale: Die Klausel beschreibt eine begleitende Hintergrundhandlung. „Während“ macht dieses Verhältnis im Deutschen klar; חִטִּים bezeichnet spezifisch Weizen.
