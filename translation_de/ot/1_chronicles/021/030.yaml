source:
  edition: WLC
  text: וְ/לֹא יָכֹ֥ל דָּוִ֛יד לָ/לֶ֥כֶת לְ/פָנָ֖י/ו לִ/דְרֹ֣שׁ אֱלֹהִ֑ים כִּ֣י נִבְעַ֔ת מִ/פְּנֵ֕י חֶ֖רֶב מַלְאַ֥ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/030.yaml
  text: But David could not go before it to seek God[a], because he was terrified by the sword of the angel of Yahweh.
translation:
  language: de
  text: Doch David konnte nicht vor ihn treten, um Gott zu suchen[a], denn er hatte große Angst vor dem Schwert des Engels Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische „ihn“ kann sich auf den zuvor erwähnten Altar beziehungsweise den Kultort in Gibeon beziehen; möglich ist auch ein Bezug auf Gott.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לֹא
  choice: Doch ... nicht
  rationale: Die Verbindung setzt die Erzählung mit einem leichten Gegensatz zum vorherigen Vers fort; „Doch“ klingt im Deutschen natürlich.
- source_word: יָכֹל
  choice: konnte
  rationale: Das Verb bezeichnet Fähigkeit oder Möglichkeit; zusammen mit der Verneinung ist „konnte nicht“ die natürliche deutsche Wiedergabe.
- source_word: לָ/לֶכֶת
  choice: gehen
  rationale: Der Infinitiv bezeichnet hier die Bewegung zu dem zuvor genannten Heiligtum.
- source_word: לְ/פָנָי/ו
  choice: dorthin
  rationale: Das maskuline Singularsuffix bezieht sich im Zusammenhang wahrscheinlich auf die in Vers 29 erwähnte Wohnung beziehungsweise den Ort des Heiligtums in Gibeon. „Dorthin“ gibt den Ortsbezug natürlich wieder, ohne ein im Deutschen auffälliges „vor es“ zu erzwingen.
- source_word: לִ/דְרֹשׁ אֱלֹהִים
  choice: um Gott zu suchen
  rationale: דרשׁ in Verbindung mit Gott kann das Aufsuchen Gottes in Gebet, Gottesdienst oder Befragung bezeichnen. „Gott suchen“ bewahrt diese Bedeutungsbreite.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund dafür an, dass David nicht zum Heiligtum ging; „denn“ passt zum gehobenen, aber gegenwärtigen Erzählstil.
- source_word: נִבְעַת
  choice: war ... in Schrecken geraten
  rationale: Der Niphal bezeichnet ein starkes Erschrecken beziehungsweise von Furcht überwältigt zu sein. Die gewählte Form bringt sowohl den eingetretenen Zustand als auch seine Intensität zum Ausdruck.
- source_word: מִ/פְּנֵי
  choice: vor
  rationale: Bei einem Verb der Furcht kennzeichnet die Präposition deren Ursache; im Deutschen ist „vor dem Schwert“ idiomatisch.
- source_word: חֶרֶב
  choice: Schwert
  rationale: Gemeint ist das sichtbare beziehungsweise gezückte Schwert des Engels aus dem Erzählzusammenhang; die konkrete Waffenbezeichnung bleibt erhalten.
- source_word: מַלְאַךְ
  choice: Engel
  rationale: Obwohl das Wort auch „Bote“ bedeuten kann, bezeichnet es hier eindeutig ein himmlisches Wesen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben, damit der im Hebräischen stehende Gottesname erkennbar bleibt.
theological_decisions:
- issue: Bezugswort des Suffixes in לְפָנָיו
  choice: 'Ortsbezug auf die Wohnung beziehungsweise den Opferplatz in Gibeon: „dorthin“'
  alternative: 'Personaler Bezug auf Gott: „vor ihn“ beziehungsweise „vor sein Angesicht“'
  rationale: Der unmittelbare Zusammenhang nennt in Vers 29 die Wohnung Jahwes und den Brandopferaltar auf der Höhe von Gibeon; Vers 30 erklärt, warum David nicht dorthin ging. Da die hebräische Form auch einen Bezug auf Gott zulässt, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. „Dorthin gehen“ vermeidet eine unnatürliche wörtliche Wiedergabe von לְפָנָיו, während die Fußnote die syntaktische Mehrdeutigkeit offenhält. Der Gottesname wird als „Jahwe“ wiedergegeben.
