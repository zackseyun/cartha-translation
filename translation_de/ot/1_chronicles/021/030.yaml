  naturalness: „in Schrecken geraten“ ist verständlich, wirkt hier jedoch etwas schwerfällig. „hatte große Angst vor“ ist modernes, natürliches Standarddeutsch und gibt die starke Furcht angemessen wieder. „vor ihn treten“ ist als kultisch-räumliche Wendung idiomatisch und bewahrt die Formulierung des Ausgangstextes besser.
  terminology: „Engel Jahwes“, „Schwert“ und „Gott suchen“ sind angemessen. Die Fußnote sollte die Alternative nicht auf das „Heiligtum“ verengen, da im unmittelbaren Kontext auch der maskuline Brandopferaltar als möglicher Bezug in Betracht kommt.
