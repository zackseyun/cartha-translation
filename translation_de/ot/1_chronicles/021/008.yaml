base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/008.yaml
  text: Then David said to God[a], “I have sinned greatly in doing this thing. But now, please take away the guilt of your servant, for I have acted very foolishly.”
translation:
  language: de
  text: 'Da sagte David zu Gott: „Ich habe schwer gesündigt, dass ich diese Tat begangen habe. Doch nun nimm bitte die Schuld[a] deines Dieners weg, denn ich habe sehr töricht gehandelt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Verfehlung deines Dieners“; das hebräische Wort kann auch die Schuldhaftung oder die aus der Schuld erwachsende Folge bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da“ gibt die zeitliche Folge im Deutschen natürlich wieder.
- source_word: אֶל הָאֱלֹהִים
  choice: zu Gott
  rationale: אֱלֹהִים bezeichnet hier den Gott Israels; im Deutschen steht idiomatisch kein Artikel.
- source_word: חָטָאתִי מְאֹד
  choice: Ich habe schwer gesündigt
  rationale: „Schwer“ gibt den Intensivierer מְאֹד in Verbindung mit „sündigen“ natürlich und gewichtig wieder.
- source_word: אֲשֶׁר עָשִׂיתִי אֶת הַדָּבָר הַזֶּה
  choice: als ich dies tat
  rationale: Die Formulierung verbindet die Sünde mit der konkreten Handlung, ohne das im Deutschen unnötig schwerfällige „diese Sache“ zu verwenden.
- source_word: וְעַתָּה
  choice: Doch nun
  rationale: Kennzeichnet den Übergang vom Bekenntnis zur Bitte und wahrt die rhetorische Wendung.
- source_word: הַעֲבֶר נָא
  choice: nimm bitte ... weg
  rationale: Der Hifil-Imperativ von עבר bedeutet in dieser Wendung „wegnehmen/beseitigen“; „bitte“ bildet נָא ab.
- source_word: עֲוֹן
  choice: Schuld
  rationale: Das Wort kann Verfehlung, Schuld oder die daraus erwachsende Haftung bezeichnen; „Schuld“ bewahrt hier die für die Bitte um Vergebung wesentliche Bedeutungsbreite.
- source_word: עַבְדְּךָ
  choice: deines Dieners
  rationale: Dies ist eine ehrerbietige Selbstbezeichnung Davids vor Gott; „Diener“ passt daher besser als „Sklave“.
- source_word: כִּי
  choice: denn
  rationale: Leitet den Grund für Davids Bitte ein und entspricht dem gehobenen, aber gegenwärtigen deutschen Erzählstil.
- source_word: נִסְכַּלְתִּי מְאֹד
  choice: ich habe sehr töricht gehandelt
  rationale: Die Übersetzung wahrt den verbalen Sinn des törichten Handelns sowie die Verstärkung durch מְאֹד.
theological_decisions:
- issue: Bedeutungsumfang von עָוֹן in Davids Bitte
  choice: „Schuld“
  alternative: „Verfehlung“ oder „Strafe für die Schuld“
  rationale: „Schuld“ bezeichnet angemessen die moralische Last, deren Wegnahme David erbittet, ohne den hebräischen Ausdruck ausschließlich auf die Tat oder ausschließlich auf ihre Strafe festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; „schwer gesündigt“ und „sehr töricht gehandelt“ unterscheiden die beiden Vorkommen von מְאֹד idiomatisch, ohne ihre Intensität abzuschwächen.
