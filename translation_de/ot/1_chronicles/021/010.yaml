base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/010.yaml
  text: 'Go and speak to David[a], saying, ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: de
  text: 'Geh und sprich zu David: »So spricht Jahwe: Drei lege ich dir vor.[a] Wähle dir eine davon aus, und ich werde sie dir antun.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Drei strecke ich gegen dich aus.« Das Hebräische nennt nicht ausdrücklich, worum es sich bei den drei handelt; im Zusammenhang sind es die drei Möglichkeiten, zwischen denen David wählen soll.'
    reason: lexikalische Alternative und im Hebräischen nicht genanntes Bezugswort
lexical_decisions:
- source_word: לֵךְ וְדִבַּרְתָּ אֶל דָּוִיד
  choice: Geh und sprich zu David
  rationale: Der Imperativ von הלך und דבר mit אֶל werden nah am Hebräischen und zugleich in natürlichem Deutsch wiedergegeben.
- source_word: לֵאמֹר
  choice: direkte Rede nach Doppelpunkt
  rationale: Der hebräische Redeanzeiger wird im Deutschen idiomatisch durch einen Doppelpunkt ausgedrückt; ein zusätzliches „und sage“ wäre unnötig schwerfällig.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die prophetische Botenformel und gibt den Gottesnamen יְהוָה als Jahwe wieder.
- source_word: שָׁלוֹשׁ אֲנִי נֹטֶה עָלֶיךָ
  choice: Drei lege ich dir vor
  rationale: „Drei“ bleibt wie im Hebräischen substantivlos; „vorlegen“ vermittelt im Zusammenhang die Bedeutung des ausgestreckten beziehungsweise hingestellten Angebots, ohne die drei Möglichkeiten schon als Gerichte oder Plagen zu bestimmen.
- source_word: בְּחַר לְךָ אַחַת מֵהֵנָּה
  choice: Wähle dir eine davon aus
  rationale: Gibt den Imperativ, das persönliche לְךָ und die partitive Wendung אַחַת מֵהֵנָּה natürlich wieder.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: dann werde ich sie dir antun
  rationale: Im strafenden Kontext bezeichnet עשה mit ל eine Handlung, die David widerfährt. „Antun“ bewahrt diese negative Stoßrichtung; das feminine Pronomen bezieht sich auf die eine gewählte Möglichkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im Ausgangstext stehende Eigenname wird als Eigenname wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
- issue: Nicht genanntes Bezugswort zu „drei“
  choice: Drei lege ich dir vor
  alternative: Drei Dinge / drei Gerichte / drei Möglichkeiten lege ich dir vor
  rationale: Das Hebräische nennt kein Substantiv. Die knappe deutsche Form bewahrt diese Offenheit und vermeidet, die folgenden Möglichkeiten vorzeitig theologisch zu bestimmen.
- issue: Bedeutung von וְאֶעֱשֶׂה לָּךְ
  choice: dann werde ich sie dir antun
  alternative: und ich werde sie für dich tun / über dich bringen
  rationale: Der Kontext verlangt eine belastende, gegen David gerichtete Handlung. „Antun“ drückt dies aus, ohne die konkrete Art der Strafe hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Botenformel „So spricht Jahwe“ bleibt erhalten. Die ungewöhnliche Kürze „Drei lege ich dir vor“ ist bewusst gewählt, um die Ellipse und Spannung des hebräischen Textes zu bewahren.
