id: 1CH.21.1
reference: 1 Chronicles 21:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּֽעֲמֹ֥ד שָׂטָ֖ן עַל יִשְׂרָאֵ֑ל וַ/יָּ֨סֶת֙ אֶת דָּוִ֔יד לִ/מְנ֖וֹת אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/001.yaml
  text: Then Satan stood up against Israel and incited David to count Israel[a][b].
translation:
  language: de
  text: Da trat Satan[a] gegen Israel auf und reizte David dazu, Israel zu zählen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Widersacher«. Das hebräische Wort satan kann »Widersacher« bedeuten oder als persönliche Bezeichnung »Satan« gebraucht werden.'
    reason: lexical_alternative
  - marker: b
    text: Nach 2. Samuel 24,1 entbrannte der Zorn des HERRN gegen Israel und reizte David gegen Israel auf. Die Chronik nennt Satan als den unmittelbar Handelnden; die Spannung zwischen beiden Darstellungen bleibt bestehen.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Da trat … auf
  rationale: עמד bedeutet grundsätzlich „stehen“ bzw. „sich hinstellen“. Im feindlichen Zusammenhang gibt „trat … auf“ die Initiative natürlich wieder und bewahrt die konkrete Bildhaftigkeit.
- source_word: שָׂטָן
  choice: Satan
  rationale: Das artikellose Substantiv kann „ein Widersacher“ bedeuten, wird hier jedoch wahrscheinlich als persönliche Bezeichnung gebraucht. Die echte lexikalische Mehrdeutigkeit bleibt in Fußnote [a] erhalten.
- source_word: עַל יִשְׂרָאֵל
  choice: gegen Israel
  rationale: עַל bezeichnet in Verbindung mit dem feindlichen Auftreten die Ausrichtung gegen Israel.
- source_word: וַיָּסֶת
  choice: reizte … dazu
  rationale: Der Hifil von סות bezeichnet das Anstiften oder Aufreizen zu einer Handlung. „reizte … dazu“ drückt die veranlassende Einwirkung aus, ohne Zwang zu unterstellen.
- source_word: לִמְנוֹת
  choice: zu zählen
  rationale: מנה bedeutet „zählen“ oder „abzählen“. Die knappe Wiedergabe vermeidet die erklärende Erweiterung „eine Volkszählung durchführen“.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Text nennt als direktes Objekt schlicht Israel; diese Kürze bleibt erhalten.
theological_decisions:
- issue: Identität und Bedeutung von שָׂטָן
  choice: Satan als persönliche widergöttliche Gestalt
  alternative: ein Widersacher
  rationale: Im Kontext ist die persönliche Bezeichnung „Satan“ wahrscheinlich, doch das hebräische Wort kann auch allgemein „Widersacher“ heißen. Daher wird die Alternative nicht ausgeschlossen, sondern in Fußnote [a] genannt.
- issue: Verhältnis zu 2. Samuel 24,1
  choice: Satan wird in Chronik als unmittelbar handelnder Anstifter genannt
  alternative: Der Zorn des HERRN reizte David gegen Israel auf
  rationale: Die beiden Darstellungen werden nicht harmonisierend ineinander aufgelöst. Fußnote [b] macht die Spannung transparent und lässt beide Aussagen in ihrer jeweiligen Form stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da trat … auf“ hält den erzählerischen Anschluss und die feindliche Initiative fest; „reizte … dazu“ ist verständlich, ohne einen unwiderstehlichen Zwang auszudrücken.
