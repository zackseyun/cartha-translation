  text: וַ/יִּשָּׂ֨א דָוִ֜יד אֶת עֵינָ֗י/ו וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֗ד בֵּ֤ין הָ/אָ֨רֶץ֙ וּ/בֵ֣ין הַ/שָּׁמַ֔יִם וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ נְטוּיָ֖ה עַל יְרוּשָׁלִָ֑ם וַ/יִּפֹּ֨ל דָּוִ֧יד וְ/הַ/זְּקֵנִ֛ים מְכֻסִּ֥ים בַּ/שַּׂקִּ֖ים עַל פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/016.yaml
  text: David lifted up his eyes and saw the angel of Yahweh standing between the earth and the heavens[a], with his sword drawn in his hand, stretched out over Jerusalem. Then David and the elders, covered in sackcloth, fell on their faces.
translation:
  language: de
  text: David erhob seine Augen und sah den Engel Jahwes zwischen der Erde und dem Himmel[a] stehen, mit gezogenem Schwert in seiner Hand, das über Jerusalem ausgestreckt war. Da fielen David und die Ältesten, in Sacktuch gehüllt, auf ihr Angesicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zwischen der Erde und den Himmeln“.'
    reason: Die hebräische Bezeichnung für den Himmel steht der Form nach im Plural; im Deutschen ist hier der Singular natürlicher.
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: erhob seine Augen
  rationale: Bewahrt das konkrete hebräische Bild und den feierlichen Erzählton; „blickte auf“ wäre idiomatischer, aber weniger bildnah.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: Gibt die Status-constructus-Verbindung direkt wieder und bewahrt den im Text stehenden Gottesnamen.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  choice: zwischen der Erde und dem Himmel
  rationale: Der kosmische Gegensatz ist im Deutschen mit „Erde“ und dem idiomatischen Kollektivsingular „Himmel“ natürlich wiedergegeben; die hebräische Form שָׁמַיִם ist formal pluralisch.
- source_word: וְחַרְבּוֹ שְׁלוּפָה
  choice: Sein Schwert war gezogen
  rationale: Gibt den resultativen Zustand des aus der Scheide gezogenen Schwertes klar und natürlich wieder.
- source_word: נְטוּיָה עַל־יְרוּשָׁלִָם
  choice: über Jerusalem ausgestreckt
  rationale: Bewahrt die räumliche und bedrohliche Bildsprache, ohne die genaue Zielrichtung über den Wortlaut hinaus festzulegen.
- source_word: וַיִּפֹּל ... עַל־פְּנֵיהֶם
  choice: fielen ... auf ihr Angesicht
  rationale: Bewahrt die körperliche Handlung der demütigen Niederwerfung und den würdevollen biblischen Ton.
- source_word: מְכֻסִּים בַּשַּׂקִּים
  choice: in Sacktuch gehüllt
  rationale: Vermittelt den passiven Sinn sowie das Zeichen von Trauer und Buße in verständlichem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Identität des מַלְאַךְ יְהוָה
  choice: Engel Jahwes
  alternative: Bote Jahwes
  rationale: „Engel“ ist im Kontext einer himmlischen Erscheinung natürlich, ohne die theologische Identität der Gestalt näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit maßvoll bewahrter hebräischer Bildsprache. „Angesicht“ und „Sacktuch“ halten den feierlichen beziehungsweise kulturgeschichtlichen Ton, bleiben aber allgemein verständlich.
