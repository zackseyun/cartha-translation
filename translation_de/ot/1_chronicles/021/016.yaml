    issue: Unklare Zuordnung der Partizipialbestimmung beim Schwert
    rationale: In „Sein Schwert war gezogen und in seiner Hand über Jerusalem ausgestreckt“ ist die Verbindung von „in seiner Hand“ und „über Jerusalem ausgestreckt“ stilistisch holprig und die Aussage über das ausgestreckte Schwert nicht eindeutig genug. Das Hebräische bezieht beide Angaben auf das Schwert.
  revised_text: David erhob seine Augen und sah den Engel Jahwes zwischen der Erde und dem Himmel[a] stehen, mit gezogenem Schwert in seiner Hand, das über Jerusalem ausgestreckt war. Da fielen David und die Ältesten, in Sacktuch gehüllt, auf ihr Angesicht.
