source:
  edition: WLC
  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤יד מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יִּקְרָא֙ אֶל יְהוָ֔ה וַ/יַּֽעֲנֵ֤/הוּ בָ/אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם עַ֖ל מִזְבַּ֥ח הָ/עֹלָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/026.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings. He called on Yahweh[a], and he answered him with fire from heaven on the altar of burnt offering.
translation:
  language: de
  text: Dort baute David Yahweh einen Altar und brachte Brandopfer und Friedensopfer[a] dar. Er rief zu Yahweh, und dieser antwortete ihm mit Feuer vom Himmel auf dem Brandopferaltar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Gemeinschaftsopfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן שָׁם
  choice: Dort baute
  rationale: Gibt das konkrete Bauen und den Rückbezug auf den zuvor genannten Ort knapp und natürlich wieder.
- source_word: מִזְבֵּחַ לַיהוָה
  choice: Yahweh einen Altar
  rationale: Im Deutschen bezeichnet der Dativ natürlich den Empfänger beziehungsweise den, dem der Altar geweiht ist.
- source_word: וַיַּעַל
  choice: brachte … dar
  rationale: „Darbringen“ ist im Deutschen die geläufige, würdige Bezeichnung für die kultische Opferhandlung.
- source_word: עֹלוֹת
  choice: Brandopfer
  rationale: Traditionelle und präzise deutsche Bezeichnung für die vollständig verbrannte Opferart.
- source_word: שְׁלָמִים
  choice: Friedensopfer
  rationale: Bewahrt den sprachlichen Bezug zur hebräischen Wurzel für Frieden beziehungsweise Wohlergehen; „Gemeinschaftsopfer“ bleibt als mögliche sachliche Wiedergabe in der Fußnote erhalten.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: Er rief zu Yahweh
  rationale: Bewahrt die Richtungskonstruktion mit אֶל und lässt offen, ob besonders an Rufen, Beten oder Anrufen gedacht ist.
- source_word: וַיַּעֲנֵהוּ
  choice: dieser antwortete ihm
  rationale: Das Demonstrativpronomen macht im Deutschen eindeutig, dass Yahweh das implizite Subjekt ist, ohne den Gottesnamen unnötig zu wiederholen.
- source_word: בָאֵשׁ מִן הַשָּׁמַיִם
  choice: mit Feuer vom Himmel
  rationale: Gibt das instrumentale בְּ und die idiomatische Ortsangabe natürlich wieder.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: auf dem Brandopferaltar
  rationale: Das deutsche Kompositum ist knapp, verständlich und bezeichnet den Altar, auf den das Feuer kam.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der Eigenname wird als Eigenname wiedergegeben. „Yahweh“ entspricht der vorgegebenen Projektentscheidung und vermeidet die Ersetzung durch einen Titel.
- issue: Art der Antwort mit Feuer
  choice: Yahweh antwortete David mit Feuer vom Himmel auf dem Altar
  alternative: Yahweh sandte Feuer vom Himmel
  rationale: Die Übersetzung bleibt bei der ausdrücklichen Aussage des Textes, dass die Antwort in beziehungsweise mit Feuer erfolgte, und ergänzt kein nicht ausdrücklich genanntes Verb wie „senden“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufiger biblischer Opfersprache. Der Satzbau bleibt nah an der hebräischen Erzählfolge, ohne im Deutschen schwerfällig zu wirken.
