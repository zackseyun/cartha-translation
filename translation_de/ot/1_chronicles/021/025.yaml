id: 1CH.21.25
reference: 1 Chronicles 21:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן דָּוִ֛יד לְ/אָרְנָ֖ן בַּ/מָּק֑וֹם שִׁקְלֵ֣י זָהָ֔ב מִשְׁקָ֖ל שֵׁ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/025.yaml
  text: And David gave Ornan six hundred shekels of gold by weight for the place[a].
translation:
  language: de
  text: Und David gab Ornan für den Ort Gold im Gewicht von sechshundert Schekel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der Parallelstelle 2. Samuel 24,24 werden fünfzig Schekel Silber genannt. Hier in der Chronik stehen sechshundert Schekel Gold; möglicherweise ist ein anderer Umfang des Kaufs gemeint oder es liegt eine abweichende Textüberlieferung zugrunde.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: gab
  rationale: Das Verb נתן bedeutet gewöhnlich „geben“. Obwohl es sich im Zusammenhang um einen Kaufpreis handelt, bewahrt „gab“ die Ausdrucksweise des Hebräischen, ohne sie unnötig als „bezahlte“ auszudeuten.
- source_word: לְאָרְנָן
  choice: Ornan
  rationale: Der Chroniktext nennt den Mann Ornan; die Namensform Arauna gehört zur Parallelüberlieferung in 2. Samuel 24.
- source_word: בַּמָּקוֹם
  choice: für den Ort
  rationale: 'מָקוֹם bezeichnet einen Ort oder eine Stätte. Im Kaufzusammenhang gibt die Präposition ב hier den Gegenwert an: David gab das Gold für den Ort.'
- source_word: שִׁקְלֵי זָהָב
  choice: Schekel Gold
  rationale: Die Wiedergabe bewahrt die antike Gewichtseinheit und bezeichnet Gold als das gewogene Material; „Schekel Gold“ ist im Deutschen idiomatisch.
- source_word: מִשְׁקָל
  choice: nach Gewicht
  rationale: מִשְׁקָל stellt ausdrücklich klar, dass die Schekel eine Gewichtsangabe sind.
- source_word: שֵׁשׁ מֵאוֹת
  choice: sechshundert
  rationale: Die Zahl wird entsprechend dem masoretischen Chroniktext unverändert wiedergegeben.
theological_decisions:
- issue: Zahlen- und Materialunterschied zur Parallelstelle 2. Samuel 24,24
  choice: „sechshundert Schekel Gold“ gemäß dem Chroniktext beibehalten
  alternative: Mit den „fünfzig Schekel Silber“ aus 2. Samuel 24,24 harmonisieren
  rationale: Der hebräische Text von 1. Chronik nennt ausdrücklich sechshundert Schekel Gold. Die Übersetzung gibt diesen Wortlaut wieder und löst die Spannung zur Parallelstelle nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt nah am Hebräischen, ist aber natürlich lesbar. Die alte Gewichtseinheit „Schekel“ wird nicht in eine moderne Größe umgerechnet.
