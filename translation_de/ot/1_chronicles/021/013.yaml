source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר דָּוִ֛יד אֶל גָּ֖ד צַר לִ֣/י מְאֹ֑ד אֶפְּלָה נָּ֣א בְ/יַד יְהוָ֗ה כִּֽי רַבִּ֤ים רַחֲמָי/ו֙ מְאֹ֔ד וּ/בְ/יַד אָדָ֖ם אַל אֶפֹּֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/013.yaml
  text: Then David said to Gad[a], “I am in great distress. Please let me fall into the hand of Yahweh, for his mercies are very great; but do not let me fall into the hand of man.”
translation:
  language: de
  text: 'Da sagte David zu Gad: „Ich bin in großer Bedrängnis. Lass mich doch in die Hand Jahwes fallen, denn sein Erbarmen ist überaus groß; aber in die Hand eines Menschen[a] will ich nicht fallen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in die Hand des Menschen“. Gemeint ist menschliche Gewalt im Gegensatz zur Hand Jahwes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: Ich bin in großer Bedrängnis
  rationale: Die hebräische Wendung bezeichnet eine äußerst bedrängte, angstvolle Lage. Die gewählte Formulierung ist natürliches, würdevolles Deutsch und bewahrt die emotionale Stärke.
- source_word: אֶפְּלָה נָּא
  choice: Lass mich doch fallen
  rationale: Der Kohortativ mit נָא drückt eine dringliche Bitte aus. „doch“ gibt hier den bittenden Nachdruck idiomatisch wieder.
- source_word: בְיַד יְהוָה
  choice: in die Hand Jahwes
  rationale: Die Hand bezeichnet bildhaft Macht und Verfügungsgewalt. Das Bild wird beibehalten; der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: כִּי רַבִּים רַחֲמָיו מְאֹד
  choice: denn sein Erbarmen ist überaus groß
  rationale: רַחֲמִים bezeichnet inniges Erbarmen beziehungsweise Mitgefühl. Der im Hebräischen grammatisch mögliche deutsche Singular klingt natürlich, während „überaus groß“ sowohl רַבִּים als auch מְאֹד zur Geltung bringt.
- source_word: וּבְיַד אָדָם אַל אֶפֹּל
  choice: aber in die Hand eines Menschen will ich nicht fallen
  rationale: Die Formulierung erhält die Parallelität zur „Hand Jahwes“. אָדָם ist hier generisch; „eines Menschen“ gibt diesen Sinn im modernen Deutschen klar wieder. Die negative Volitivform wird mit „will ich nicht fallen“ aus Davids Perspektive ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Kontrast zwischen Jahwes Hand und der Hand eines Menschen
  choice: in die Hand eines Menschen
  alternative: in Menschenhände
  rationale: Die Singularform und das wiederholte Bild der „Hand“ bleiben erhalten. Zugleich wird אָדָם seinem generischen Sinn entsprechend als „Mensch“ und nicht als geschlechtsspezifischer Mann verstanden.
- issue: Numerus von רַחֲמָיו
  choice: sein Erbarmen
  alternative: seine Erbarmungen
  rationale: Der hebräische Plural ist bei diesem Abstraktum lexikalisch üblich und verlangt im Deutschen keinen formalen Plural. „Sein Erbarmen“ bewahrt den Sinn in idiomatischem Deutsch, ohne eine Mehrzahl einzelner Gnadenerweise auszuschließen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Das wiederholte Bild der „Hand“ wurde zur Wahrung des hebräischen Kontrasts bewusst beibehalten.
