revisions:
- from: Entweder drei Jahre Hungersnot oder drei Monate, in denen du vor deinen Bedrängern dahingerafft wirst und das Schwert deiner Feinde dich einholt, oder drei Tage das Schwert Jahwes, nämlich die Pest[a] im Land, während der Engel Jahwes im ganzen Gebiet Israels Verderben bringt[b]. Nun überlege, welche Antwort ich dem bringen soll, der mich gesandt hat.«
  to: 'Entweder drei Jahre Hungersnot oder drei Monate, in denen du vor deinen Bedrängern aufgerieben wirst und das Schwert deiner Feinde dich einholt, oder drei Tage lang das Schwert Jahwes: eine Seuche im Land, und der Engel Jahwes richtet im ganzen Gebiet Israels Verderben an. Nun überlege, welche Antwort ich dem bringen soll, der mich gesandt hat.«'
  rationale: Die Revision vermeidet eine zu enge Todesnuance bei נִסְפֶּה, gibt דֶבֶר mit dem im heutigen Deutsch weiter gefassten »Seuche« wieder und stellt das Handeln des Engels koordinierend dar. Die appositionelle Erklärung des »Schwertes Jahwes« durch die Seuche bleibt erhalten, ohne die genaue syntaktische Beziehung über das im Hebräischen erkennbare Maß hinaus festzulegen.
