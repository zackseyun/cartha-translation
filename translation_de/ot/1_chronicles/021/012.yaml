source:
  edition: WLC
  text: אִם שָׁל֨וֹשׁ שָׁנִ֜ים רָעָ֗ב וְ/אִם שְׁלֹשָׁ֨ה חֳדָשִׁ֜ים נִסְפֶּ֥ה מִ/פְּנֵי צָרֶי/ךָ֮ וְ/חֶ֣רֶב אוֹיְבֶ֣/ךָ לְ/מַשֶּׂגֶת֒ וְ/אִם שְׁלֹ֣שֶׁת יָ֠מִים חֶ֣רֶב יְהוָ֤ה וְ/דֶ֨בֶר֙ בָּ/אָ֔רֶץ וּ/מַלְאַ֣ךְ יְהוָ֔ה מַשְׁחִ֖ית בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה רְאֵ֔ה מָֽה אָשִׁ֥יב אֶת שֹׁלְחִ֖/י דָּבָֽר־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/012.yaml
  text: either three years of famine[a], or three months of being swept away before your foes while the sword of your enemies overtakes you, or three days of the sword of Yahweh, even pestilence in the land, with the angel of Yahweh destroying throughout all the territory of Israel[b]. Now consider what answer I should return to the one who sent me.
translation:
  language: de
  text: 'Entweder drei Jahre Hungersnot oder drei Monate, in denen du vor deinen Bedrängern aufgerieben wirst und das Schwert deiner Feinde dich einholt, oder drei Tage lang das Schwert Jahwes: eine Seuche im Land, und der Engel Jahwes richtet im ganzen Gebiet Israels Verderben an. Nun überlege, welche Antwort ich dem bringen soll, der mich gesandt hat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָב
  choice: Hungersnot
  rationale: Bezeichnet in diesem nationalen Gerichtszusammenhang eine schwere, länger anhaltende Lebensmittelknappheit; »Hungersnot« ist die natürliche deutsche Entsprechung.
- source_word: נִסְפֶּה
  choice: dahingerafft wirst
  rationale: Das Nifal-Partizip bezeichnet das Zugrundegehen bzw. Vernichtetwerden. Die Wiedergabe bewahrt die drastische Aussage, ohne sie ausschließlich auf eine militärische Niederlage festzulegen.
- source_word: מִפְּנֵי צָרֶיךָ
  choice: vor deinen Bedrängern
  rationale: Die Wendung beschreibt Flucht bzw. Unterliegen angesichts feindlicher Verfolger; »Bedränger« vermeidet die unmittelbare Wiederholung von »Feinde«.
- source_word: חֶרֶב אוֹיְבֶיךָ לְמַשֶּׂגֶת
  choice: das Schwert deiner Feinde dich einholt
  rationale: Bewahrt das Bild des Schwertes und gibt das Erreichen bei einer Verfolgung idiomatisch wieder.
- source_word: חֶרֶב יְהוָה
  choice: das Schwert Jahwes
  rationale: Erhält die bewusste Gegenüberstellung zum Schwert der Feinde.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: דֶבֶר
  choice: Pest
  rationale: Bezeichnet hier eine epidemische Krankheit als Gericht; »Pest« ist im Deutschen prägnant, wobei die Fußnote die weitere Bedeutung »Seuche« nennt.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: Gibt die übliche Bedeutung im erzählerischen Zusammenhang wieder, ohne die genauere Identität der Gestalt theologisch festzulegen.
- source_word: מַשְׁחִית
  choice: Verderben bringt
  rationale: Gibt das verbal gebrauchte Hifil-Partizip als fortdauernde zerstörerische Tätigkeit natürlich und würdig wieder.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: im ganzen Gebiet Israels
  rationale: גְּבוּל bezeichnet hier die gesamte räumliche Ausdehnung des Landes, nicht nur seine Grenzlinien.
- source_word: רְאֵה
  choice: überlege
  rationale: Der Imperativ fordert in diesem Zusammenhang zum Abwägen und Entscheiden auf, nicht zum bloßen Sehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher sichtbar gemacht; der Text verwendet ausdrücklich das Tetragramm.
- issue: Identität von מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  alternative: der Bote Jahwes
  rationale: Die Übersetzung bleibt beim lexikalisch und kontextuell naheliegenden Ausdruck und legt nicht fest, ob es sich um einen geschaffenen Engel oder eine besondere Gotteserscheinung handelt.
- issue: Verhältnis von »Schwert Jahwes« und דֶבֶר
  choice: nämlich die Pest im Land
  alternative: das Schwert Jahwes und die Pest im Land
  rationale: Das verbindende ו kann die folgende Pest erläuternd an das »Schwert Jahwes« anschließen. »Nämlich« macht diese appositionelle Lesart deutlich, ohne das Gerichtsmotiv weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige Auswahlstruktur und die martialischen Bilder des Hebräischen bleiben erhalten. Der Satzbau wurde nur so weit geglättet, dass der lange Vers mündlich und schriftlich verständlich bleibt.
