  - severity: low
    issue: Formulierung der Fußnote
    rationale: Die als „Wörtlich“ gekennzeichnete Formulierung sollte nicht das interpretierende deutsche Anschlusswort „Doch“ enthalten. Die Alternative „missfiel Gott“ betrifft die Bewertung, nicht den Satzanschluss.
