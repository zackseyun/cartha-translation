  text: וַ/יֵּ֨רַע֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה וַ/יַּ֖ךְ אֶת יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/007.yaml
  text: But this matter was evil in the sight of God[a], so he struck Israel.
translation:
  language: de
  text: Diese Sache war in Gottes Augen böse[a], und so schlug er Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Diese Sache missfiel Gott.« Wörtlich: »Diese Sache war böse in den Augen Gottes.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: war böse
  rationale: Bewahrt die starke wertende Aussage des hebräischen Verbs רעע und schwächt sie nicht zu bloßem Missfallen ab.
- source_word: בְּעֵינֵי הָאֱלֹהִים
  choice: in den Augen Gottes
  rationale: Gibt die hebräische Wendung eng, verständlich und im Deutschen natürlich wieder.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Im Text steht אֱלֹהִים und nicht der Gottesname JHWH.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: diese Sache
  rationale: דבר bezeichnet hier allgemein die zuvor berichtete Angelegenheit; „Sache“ bleibt hinreichend offen und deutet nicht mehr aus, als der Vers sagt.
- source_word: וַיַּךְ
  choice: schlug
  rationale: Entspricht der Grundbedeutung von נכה. „Schlug nieder“ würde eine tödliche Wirkung stärker festlegen, als es dieser Vers für sich allein tut.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Der direkte Gegenstand ist Israel als Volk; eine erläuternde Erweiterung ist nicht nötig.
- source_word: וַ
  choice: Doch … und so
  rationale: „Doch“ bringt den leichten Gegensatz zur vorausgehenden Handlung Davids zum Ausdruck; „und so“ kennzeichnet Gottes Schlag als anschließende Folge, ohne eine übermäßig technische Kausalformulierung einzuführen.
theological_decisions:
- issue: Gottes Bewertung von Davids Zählung und das anschließende Gericht
  choice: Der Vers bezeichnet die Sache ausdrücklich als böse in Gottes Augen und sagt, dass er daraufhin Israel schlug.
  alternative: Die Sache lediglich als missfällig zu bezeichnen oder Gottes Schlag als unbestimmte Reaktion abzuschwächen.
  rationale: Die Übersetzung bewahrt sowohl die starke moralische Wertung als auch die Spannung, dass Davids Handlung beurteilt wird, während Israel den Schlag trifft. Diese Spannung wird nicht durch zusätzliche Erklärungen aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wörtliche hebräische Bildsprache „in den Augen Gottes“ ist im Deutschen verständlich und wurde deshalb im Haupttext bewahrt.
