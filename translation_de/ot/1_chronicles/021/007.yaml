  source_fidelity: 'Der Entwurf gibt die hebräischen Kernelemente zutreffend wieder: die negative Bewertung der Angelegenheit durch Gott (וַיֵּרַע), die idiomatische Perspektive „in den Augen Gottes“, die Bezeichnung „Gott“ für הָאֱלֹהִים sowie Gottes Schlag gegen Israel. „Schlug“ legt, anders als „schlug nieder“, keine Todesfolge über den Vers hinaus fest.'
  naturalness: Die Stellung „war böse in den Augen Gottes“ ist verständlich, wirkt im modernen Standarddeutsch jedoch etwas weniger flüssig als „war in Gottes Augen böse“. Diese Umstellung wahrt Sinn und Gewichtung. Die Fußnote sollte die wörtliche Wiedergabe nicht mit dem deutschen narrativen Anschlusswort „Doch“ vermischen.
  terminology: „Gott“, „Israel“ und „schlug“ sind angemessen. „Böse“ bewahrt die starke negative Wertung des hebräischen Verbs, ohne die im Zusammenhang bestehende Spannung weiter auszudeuten. „Diese Sache“ lässt das breite דבר sachgerecht offen.
