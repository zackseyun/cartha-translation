source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֤יד אֶל יוֹאָב֙ וְ/אֶל שָׂרֵ֣י הָ/עָ֔ם לְכ֗וּ סִפְרוּ֙ אֶת יִשְׂרָאֵ֔ל מִ/בְּאֵ֥ר שֶׁ֖בַע וְ/עַד דָּ֑ן וְ/הָבִ֣יאוּ אֵלַ֔/י וְ/אֵדְעָ֖ה אֶת מִסְפָּרָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/002.yaml
  text: Then David said to Joab and to the commanders of the people[a], “Go, count Israel from Beersheba to Dan, and bring it to me, so that I may know their number.”
translation:
  language: de
  text: 'Da sagte David zu Joab und zu den Obersten des Volkes: »Geht und zählt Israel von Beerscheba bis Dan[a]. Bringt mir das Ergebnis, damit ich ihre Zahl erfahre.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wendung »von Beerscheba bis Dan« bedeutet: von einem Ende Israels bis zum anderen.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ gibt diese Abfolge in natürlichem modernem Deutsch wieder.
- source_word: שָׂרֵי הָעָם
  choice: die Obersten des Volkes
  rationale: שָׂרִים kann führende Amtsträger oder militärische Befehlshaber bezeichnen. „Oberste“ bewahrt die breite Bedeutung, ohne den militärischen Aspekt sicherer erscheinen zu lassen, als der hebräische Ausdruck erlaubt.
- source_word: לְכוּ
  choice: Geht
  rationale: Direkte und knappe Wiedergabe des pluralischen Imperativs von הלך.
- source_word: סִפְרוּ
  choice: zählt
  rationale: ספר bedeutet hier zählen beziehungsweise zahlenmäßig erfassen. „Zählt“ ist direkt und vermeidet die erklärende Erweiterung „führt eine Volkszählung durch“.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Text nennt schlicht „Israel“ und gebraucht den Namen kollektiv für das Volk.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: von Beerscheba bis Dan
  rationale: Die Ortsnamen bezeichnen die Ausdehnung des Landes von Süden nach Norden. Die geografische Formulierung bleibt im Haupttext erhalten; ihre idiomatische Bedeutung wird in der Fußnote erläutert.
- source_word: וְהָבִיאוּ אֵלַי
  choice: Bringt mir das Ergebnis
  rationale: Wörtlich steht „und bringt [es] zu mir“, wobei das Objekt unausgesprochen bleibt. Im Deutschen könnte „es“ fälschlich auf „Israel“ bezogen werden; „das Ergebnis“ macht die kontextuell vorausgesetzte Zählung knapp deutlich.
- source_word: וְאֵדְעָה
  choice: damit ich … erfahre
  rationale: Die Kohortativform bezeichnet hier den beabsichtigten Zweck der vorausgehenden Befehle. „Damit ich … erfahre“ gibt diesen Zweck idiomatisch wieder.
- source_word: אֶת מִסְפָּרָם
  choice: ihre Zahl
  rationale: Nahe und natürliche Wiedergabe der Nominalphrase; der Pluralsuffix bezieht sich auf die zu Israel gehörenden Menschen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Satzführung. Die Anrede steht im Plural. „Oberste“ wahrt die mögliche administrative oder militärische Bedeutung des hebräischen Titels, und die im Hebräischen ausgelassene Ergänzung nach „bringen“ wird nur so weit verdeutlicht, wie es für eindeutiges Deutsch nötig ist.
