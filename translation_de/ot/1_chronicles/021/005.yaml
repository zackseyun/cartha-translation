base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/005.yaml
  text: Joab gave the number of the census of the people to David. All Israel was 1,100,000 men drawing the sword[a], and Judah was 470,000 men drawing the sword.
translation:
  language: de
  text: Joab übergab David die Zahl der Musterung des Volkes. Ganz Israel zählte 1.100.000[a] Männer, die das Schwert zogen, und Juda 470.000 Männer, die das Schwert zogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „tausend Tausende und hunderttausend“.'
    reason: Die Fußnote dokumentiert die wörtliche hebräische Form der Zahl, die im Haupttext als Ziffern wiedergegeben ist.
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: die Zahl der gemusterten Männer des Volkes
  rationale: Die Wendung bezeichnet das Ergebnis einer militärischen Musterung. Diese Wiedergabe erhält sowohl den Zahlbegriff als auch den Musterungskontext und klingt im Deutschen natürlicher als eine wörtliche Häufung von Substantiven.
- source_word: וַיְהִי כָל יִשְׂרָאֵל
  choice: Ganz Israel zählte
  rationale: Die resultative Konstruktion führt die Gesamtsumme ein. „Ganz Israel zählte“ ist im modernen Deutschen idiomatisch und bewahrt den kollektiven Bezug.
- source_word: אֶלֶף אֲלָפִים וּמֵאָה אֶלֶף
  choice: 1.100.000
  rationale: Die hebräische Zahlenangabe entspricht 1.100.000; Ziffern sind bei einer so großen Zahl am klarsten.
- source_word: אִישׁ
  choice: Männer
  rationale: Im Zusammenhang der militärischen Musterung sind ausdrücklich männliche, wehrfähige Personen gemeint.
- source_word: שֹׁלֵף חֶרֶב
  choice: die das Schwert ziehen konnten
  rationale: Die Formulierung bewahrt das Bild des Schwertziehens und macht zugleich deutlich, dass hier die militärisch einsatzfähigen Männer gezählt werden.
- source_word: וִיהוּדָה
  choice: und Juda
  rationale: Die knappe Parallelkonstruktion des Hebräischen lässt sich im Deutschen durch Ellipse des bereits genannten Verbs „zählte“ natürlich wiedergeben.
- source_word: אַרְבַּע מֵאוֹת וְשִׁבְעִים אֶלֶף
  choice: '470.000'
  rationale: Die hebräische Zahlenangabe wird für moderne deutsche Leser übersichtlich in Ziffern wiedergegeben.
theological_decisions: []
