  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל גָּ֔ד חֹזֵ֥ה דָוִ֖יד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/009.yaml
  text: And Yahweh spoke to Gad[a], David’s seer, saying,
translation:
  language: de
  text: Und Jahwe sprach zu Gad, dem Seher Davids:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „sagend“; die Formel leitet die folgende direkte Rede ein.'
    reason: Die hebräische Redeformel לֵאמֹר wird im Haupttext idiomatisch durch einen Doppelpunkt wiedergegeben.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Die Form führt das nächste Ereignis der Erzählung ein; „sprach“ gibt דבר in der gehobenen Erzählprosa angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל גָּד
  choice: zu Gad
  rationale: אֶל kennzeichnet hier die Person, an die die Rede gerichtet ist.
- source_word: חֹזֵה דָוִיד
  choice: dem Seher Davids
  rationale: חֹזֶה bezeichnet einen Empfänger göttlicher Schau; die Genitivkonstruktion bewahrt den Bezug zu David, ohne das allgemeinere „Prophet“ einzusetzen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Einleitungsformel für die folgende direkte Rede wird im natürlichen modernen Deutsch idiomatisch durch einen Doppelpunkt wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst; „Jahwe“ bewahrt dessen Charakter als Eigenname.
translation_notes:
  register: Moderne, würdevolle deutsche Erzählprosa. „Seher“ wahrt die spezifische Amtsbezeichnung; der Doppelpunkt vermeidet das im Deutschen schwerfällige „indem er sagte“.
