source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ הָ/אֱלֹהִ֨ים מַלְאָ֥ךְ לִֽ/ירוּשָׁלִַם֮ לְ/הַשְׁחִיתָ/הּ֒ וּ/כְ/הַשְׁחִ֗ית רָאָ֤ה יְהוָה֙ וַ/יִּנָּ֣חֶם עַל הָֽ/רָעָ֔ה וַ/יֹּ֨אמֶר לַ/מַּלְאָ֤ךְ הַ/מַּשְׁחִית֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֔ד עִם גֹּ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי׀׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/015.yaml
  text: And God sent an angel to Jerusalem to destroy it[a], but as he was destroying it, Yahweh saw and relented concerning the calamity, and he said to the destroying angel, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was standing by the threshing floor of Ornan the Jebusite.
translation:
  language: de
  text: 'Und Gott sandte einen Engel nach Jerusalem, um es zu vernichten. Doch während er es vernichtete, sah Yahweh es und ließ von dem Unheil ab.[a] Er sagte zu dem Engel, der die Vernichtung ausführte: »Genug! Zieh jetzt deine Hand zurück.«[b] Der Engel Yahwehs stand bei der Tenne des Jebusiters Ornan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Unheil bedauerte«. Das hebräische Wort für »Unheil« bezeichnet hier das vernichtende Gericht, nicht moralisch Böses.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »Lass jetzt deine Hand ruhen.« Gemeint ist: Hör mit der Vernichtung auf.'
    reason: idiom_clarification
lexical_decisions:
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Der Artikel und der singularische Zusammenhang bezeichnen eindeutig den Gott Israels.
- source_word: מַלְאָךְ
  choice: Engel
  rationale: Im Zusammenhang mit dem von Gott gesandten himmlischen Vollstrecker ist »Engel« treffender als das allgemeinere »Bote«.
- source_word: לִירוּשָׁלִַם לְהַשְׁחִיתָהּ
  choice: nach Jerusalem, um es zu vernichten
  rationale: ל bezeichnet die Richtung nach Jerusalem; der folgende Infinitiv nennt den Zweck. Das Suffix bezieht sich auf die Stadt, die im Deutschen sächlich aufgefasst wird.
- source_word: וּכְהַשְׁחִית
  choice: Doch während er es vernichtete
  rationale: Die Konstruktion bezeichnet eine gleichzeitig ablaufende Handlung; »doch« macht den erzählerischen Umschwung deutlich, ohne ihn inhaltlich auszuweiten.
- source_word: וַיִּנָּחֶם עַל הָרָעָה
  choice: ließ sich das Unheil gereuen
  rationale: נחם schildert hier Yahwehs Reaktion und das Abstehen von weiterem Gericht. Die idiomatische Wendung bewahrt die anthropopathische Aussage; רָעָה bezeichnet hier Unheil, nicht sittlich Böses.
- source_word: הַמַּלְאָךְ הַמַּשְׁחִית
  choice: der Engel, der die Vernichtung ausführte
  rationale: Die verbale Kraft des Partizips bleibt erhalten. Diese Formulierung ist im Deutschen natürlicher und eindeutiger als »der vernichtende Engel«.
- source_word: רַב
  choice: Genug!
  rationale: Das knappe hebräische Ausrufewort bedeutet in diesem Zusammenhang »genug«.
- source_word: הֶרֶף יָדֶךָ
  choice: Lass jetzt deine Hand sinken
  rationale: Die Wendung fordert zum sofortigen Einstellen der ausgeführten Handlung auf und bewahrt zugleich das Bild der Hand.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Yahwehs
  rationale: Die Genitivverbindung gibt den hebräischen Ausdruck transparent wieder, ohne die Identität oder das Wesen des Engels näher zu bestimmen.
- source_word: גֹּרֶן אָרְנָן הַיְבוּסִי
  choice: die Tenne des Jebusiters Ornan
  rationale: »Tenne« ist die präzise, im biblischen Zusammenhang verständliche Bezeichnung für den Dreschplatz; die Herkunftsbezeichnung wird natürlich attributiv wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der persönliche Gottesname wird als »Yahweh« wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Anthropopathische Aussage וַיִּנָּחֶם עַל הָרָעָה
  choice: ließ sich das Unheil gereuen
  alternative: bedauerte das Unheil; nahm sich das Unheil anders vor
  rationale: Die Übersetzung bewahrt die im Text dargestellte Reaktion Gottes und legt weder eine systematische Unveränderlichkeitslehre noch deren Gegenteil in den Vers hinein.
- issue: Identität des מַלְאַךְ יְהוָה
  choice: der Engel Yahwehs
  alternative: Yahweh selbst in Engelsgestalt; ein geschaffener Engel
  rationale: Die wörtliche Bezeichnung lässt die theologisch umstrittene Identität der Gestalt offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem hebräischen Erzählgang, bleibt aber flüssig. Bildhafte und theologisch spannungsreiche Formulierungen werden bewahrt; altertümliche Wendungen wie »Halte deine Hand zurück« werden vermieden.
