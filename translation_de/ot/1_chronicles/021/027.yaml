  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ לַ/מַּלְאָ֔ךְ וַ/יָּ֥שֶׁב חַרְבּ֖/וֹ אֶל נְדָנָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/027.yaml
  text: And Yahweh spoke to the angel[b][a], and he returned his sword to its sheath.
translation:
  language: de
  text: Da sprach Jahwe zu dem Engel, und der steckte sein Schwert wieder in die Scheide.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיֹּאמֶר
  choice: sprach
  rationale: אמר bedeutet grundlegend »sagen/sprechen«; »sprach zu« ist hier natürlich und legt nicht ausdrücklich fest, dass eine formale Anweisung erteilt wurde.
- source_word: לַמַּלְאָךְ
  choice: zu dem Engel
  rationale: מַלְאָךְ kann »Bote« oder »Engel« bedeuten; der himmlische Schwertträger im Kontext ist eindeutig als Engel gemeint.
- source_word: וַיָּשֶׁב
  choice: steckte … wieder
  rationale: Die Hifil-Form von שׁוב bezeichnet ein Zurückbringen; bei einem Schwert und seiner Scheide ist »wieder hineinstecken« die natürliche deutsche Wiedergabe.
- source_word: חַרְבּוֹ
  choice: sein Schwert
  rationale: Die Possessivform bezeichnet das Schwert des unmittelbar zuvor genannten Engels.
- source_word: אֶל נְדָנָהּ
  choice: in die Scheide
  rationale: נְדָן bezeichnet die Scheide eines Schwertes. Deutsch verwendet bei der Bewegung idiomatisch »in die Scheide«.
theological_decisions:
- issue: Subjekt von וַיָּשֶׁב (»und er brachte zurück«)
  choice: Der Engel steckt sein Schwert wieder in die Scheide.
  alternative: Jahwe bringt das Schwert zurück beziehungsweise lässt es zurückkehren.
  rationale: Der unmittelbar zuvor genannte Engel ist im Erzählzusammenhang der naheliegende Handelnde. Das Possessivpronomen in »sein Schwert« lässt den Bezug im Deutschen kontextuell erkennen, ohne eine zusätzliche Erklärung in den Text einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Da sprach« bildet den erzählerischen Anschluss knapp ab; »steckte … wieder in die Scheide« ist anschaulich und idiomatisch, ohne den Sinn zu erweitern.
