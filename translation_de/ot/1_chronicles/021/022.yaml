base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/022.yaml
  text: Then David said to Ornan, “Give me the place of the threshing floor, so that I may build on it an altar to the LORD. Give it to me for the full price, so that the plague may be stopped from upon the people.”
translation:
  language: de
  text: 'Da sagte David zu Ornan: »Gib mir den Platz der Tenne, damit ich darauf dem HERRN einen Altar baue. Gib ihn mir zum vollen Preis, damit die Plage vom Volk aufgehalten wird.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְקוֹם הַגֹּרֶן
  choice: der Platz der Tenne
  rationale: Gibt die räumliche Bedeutung von מָקוֹם und die konkrete landwirtschaftliche Anlage גֹּרֶן natürlich und präzise wieder.
- source_word: בְּכֶסֶף מָלֵא
  choice: zum vollen Preis
  rationale: Die idiomatische deutsche Wiedergabe bewahrt den Sinn einer vollständigen, nicht ermäßigten Bezahlung; כֶּסֶף bezeichnet hier im Zusammenhang den Kaufpreis.
- source_word: וְתֵעָצַר
  choice: damit ... abgewehrt wird
  rationale: Das Verb עצר bezeichnet das Aufhalten oder Zurückhalten. Im Deutschen passt bei einer Plage »abgewehrt« natürlich, ohne die göttliche Handlung näher zu bestimmen.
- source_word: יהוה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen wahrt dessen besonderen Status und entspricht einem vertrauten Bibelregister.
theological_decisions:
- issue: Zweck beziehungsweise erwartete Folge des Altarbaus
  choice: damit die Plage vom Volk abgewehrt wird
  alternative: sodass die Plage vom Volk abgewehrt wird
  rationale: Die mit וְ eingeleitete Verbform kann hier zweck- oder folgebezogen verstanden werden. »Damit« folgt dem unmittelbaren Handlungszusammenhang, ohne den Wirkmechanismus des Opfers auszuführen.
- issue: Agens beim Aufhalten der Plage
  choice: Passivform ohne genanntes Agens
  alternative: damit der HERR die Plage vom Volk abwehrt
  rationale: Auch der hebräische Text nennt in diesem Satz kein ausdrückliches Agens. Die Passivform bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Tenne« ist ein etablierter, weiterhin verständlicher Sachbegriff. Direkte Rede mit deutschen Anführungszeichen; keine erläuternden Zusätze.
