base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/023.yaml
  text: And Ornan said to David, “Take it for yourself, and let my lord the king do what is good in his eyes. See, I have given the cattle for burnt offerings, the threshing sledges for wood, and the wheat for the grain offering. I have given it all.”
translation:
  language: de
  text: 'Und Ornan sagte zu David: »Nimm es dir, und mein Herr, der König, soll tun, was er für gut hält.[a] Sieh, ich habe die Rinder für die Brandopfer, die Dreschschlitten als Brennholz[b] und den Weizen für das Speiseopfer gegeben.[c] Alles habe ich gegeben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »was in seinen Augen gut ist«.'
    reason: Bewahrt die Bildlichkeit des hebräischen Idioms, während der Haupttext dessen Sinn natürlich wiedergibt.
  - marker: b
    text: 'Das heißt: Die Dreschgeräte sollen als Brennstoff für das Opfer dienen.'
    reason: Erläutert die kulturell und sachlich vorausgesetzte Verwendung der Geräte.
  - marker: c
    text: 'Oder: »für die Opfergabe«. Das hebräische Wort kann allgemein eine Gabe bezeichnen, meint im Opferzusammenhang aber gewöhnlich ein Speiseopfer.'
    reason: Dokumentiert den Bedeutungsumfang des Opferbegriffs.
lexical_decisions:
- source_word: קַח לָךְ
  choice: Nimm es dir
  rationale: Der Imperativ mit לָךְ bezeichnet die Aneignung durch David; die deutsche Wendung gibt diese Nuance knapp und natürlich wieder.
- source_word: וְיַעַשׂ אֲדֹנִי הַמֶּלֶךְ הַטּוֹב בְּעֵינָיו
  choice: und mein Herr, der König, soll tun, was er für gut hält
  rationale: Die idiomatische Aussage gestattet dem König, nach seinem eigenen Urteil zu handeln. Die Übersetzung ist im modernen Deutschen verständlich, ohne dem Ausdruck eine moralische Deutung wie »was recht ist« aufzuzwingen.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr, der König
  rationale: אֲדֹנִי ist hier eine höfische Anrede an David und keine Gottesbezeichnung.
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ lenkt nachdrücklich auf Ornans umfassendes Angebot hin und bleibt gegenüber »Siehe« modern.
- source_word: הַבָּקָר לָעֹלוֹת
  choice: die Rinder für die Brandopfer
  rationale: בָּקָר ist eine kollektive Bezeichnung für Rinder und kann kontextuell auch Zugochsen meinen; »Rinder« wahrt den breiteren Wortumfang. עֹלוֹת bezeichnet Brandopfer.
- source_word: הַמּוֹרִגִּים לָעֵצִים
  choice: die Dreschschlitten als Brennholz
  rationale: מוֹרִגִּים bezeichnet Dreschgeräte, wahrscheinlich Dreschschlitten. Sie sollen hier als Holz beziehungsweise Brennstoff für die Opfer dienen.
- source_word: הַחִטִּים לַמִּנְחָה
  choice: den Weizen für das Speiseopfer
  rationale: מִנְחָה bezeichnet im Opferkontext das unblutige, aus Feldfrüchten bereitete Speiseopfer; der traditionelle deutsche Fachausdruck ist präzise und verständlich.
- source_word: הַכֹּל נָתָתִּי
  choice: Alles gebe ich
  rationale: Das hebräische Perfekt kann im Vollzug des unmittelbaren Angebots performativ verstanden werden. Das deutsche Präsens wirkt in direkter Rede natürlich und bringt die gegenwärtige Schenkung zum Ausdruck.
