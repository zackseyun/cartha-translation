revisions:
- from: Und der Engel Jahwes[a] sagte zu Gad, er solle David ausrichten, dass David hinaufgehen und auf der Tenne Ornans, des Jebusiters, einen Altar für Jahwe errichten solle[b].
  to: Und der Engel Jahwes[a] sagte zu Gad, Gad solle David sagen, dass David hinaufgehen solle, um auf der Tenne Ornans, des Jebusiters, einen Altar für Jahwe zu errichten[b].
  rationale: Die Übermittlungsanweisung an Gad wird mit einer im Deutschen klaren Konstruktion wiedergegeben. Zugleich stellt „um ... zu errichten“ die im Hebräischen angelegte Zweckbeziehung zwischen dem Hinaufgehen und dem Errichten des Altars wieder her. Die Fußnote wurde entsprechend angepasst.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:04:27Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Akteure, den Gottesnamen, den Ort und die Weisung im Wesentlichen zutreffend wieder. Die Konstruktion „hinaufgehen und ... errichten“ nivelliert jedoch die hebräische Infinitivfolge יַעֲלֶה ... לְהָקִים, deren zweiter Infinitiv den Zweck des Hinaufgehens ausdrückt.
  naturalness: „Er solle David ausrichten“ ist zwar mit einem nachfolgenden Inhaltssatz grundsätzlich verständlich, klingt aber in dieser Stellung weniger idiomatisch und kann kurz irritieren. „Gad sagen, dass ...“ ist im modernen Standarddeutsch klarer und bildet die Übermittlung der Weisung natürlich ab.
  terminology: „Engel Jahwes“, „Tenne“, „Ornan, der Jebusiter“, „Altar“ und „für Jahwe“ sind treffend. Die Fußnote zum Boten ist passend. Die Modalalternativen sollen die Zweckbeziehung des Errichtens nicht zu einer koordinierten Handlung umformen.
  issues:
