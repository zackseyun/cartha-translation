  text: וּ/מַלְאַ֧ךְ יְהוָ֛ה אָמַ֥ר אֶל גָּ֖ד לֵ/אמֹ֣ר לְ/דָוִ֑יד כִּ֣י יַעֲלֶ֣ה דָוִ֗יד לְ/הָקִ֤ים מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבֻסִֽי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/018.yaml
  text: And the angel of Yahweh said to Gad to tell David that David should go up to set up an altar to Yahweh on the threshing floor of Ornan the Jebusite[a][b].
translation:
  language: de
  text: Und der Engel Jahwes[a] sagte zu Gad, Gad solle David sagen, dass David hinaufgehen solle, um auf der Tenne Ornans, des Jebusiters, einen Altar für Jahwe zu errichten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Jahwes«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »David müsse hinaufgehen, um … zu errichten«, beziehungsweise »David habe hinaufzugehen, um … zu errichten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: Und der Engel Jahwes
  rationale: מַלְאַךְ kann »Bote« oder »Engel« bedeuten; da im Erzählzusammenhang ein himmlisches Wesen gemeint ist, ist »Engel« die natürliche Wiedergabe. Der Gottesname יְהוָה wird im Deutschen als »Jahwe« wiedergegeben.
- source_word: אָמַר אֶל גָּד
  choice: sagte zu Gad
  rationale: Gibt das gewöhnliche Verb אָמַר und die Anrede mit אֶל direkt und idiomatisch wieder.
- source_word: לֵאמֹר לְדָוִיד
  choice: er solle David ausrichten
  rationale: Der Infinitiv לֵאמֹר leitet den Inhalt der weiterzugebenden Weisung ein; »ausrichten« macht im Deutschen deutlich, dass Gad David eine Botschaft übermitteln soll.
- source_word: כִּי יַעֲלֶה דָוִיד
  choice: dass David hinaufgehen ... solle
  rationale: »Hinaufgehen« bewahrt die räumliche Bedeutung von עלה. Der Konjunktiv mit »solle« gibt den auffordernden Gehalt wieder, ohne ihn unnötig zu verstärken.
- source_word: לְהָקִים מִזְבֵּחַ
  choice: einen Altar ... errichten
  rationale: הקים bezeichnet das Aufrichten oder Errichten; bei einem Altar ist »errichten« im Deutschen natürlich und präzise.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Das ל kennzeichnet hier die Widmung des Altars. »Für Jahwe« drückt diese Beziehung im Deutschen natürlich aus.
- source_word: בְּגֹרֶן אָרְנָן הַיְבֻסִי
  choice: auf der Tenne Ornans, des Jebusiters
  rationale: גֹרֶן ist eine »Tenne«; die Präposition wird räumlich mit »auf« wiedergegeben. Der Genitiv wahrt die Zuordnung der Tenne zu Ornan und seine Bezeichnung als Jebusiter.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, um den im hebräischen Text ausdrücklich gebrauchten Gottesnamen sichtbar zu erhalten.
- issue: Verpflichtungsgrad von כִּי יַעֲלֶה דָוִיד
  choice: David solle hinaufgehen
  alternative: David müsse hinaufgehen; David habe hinaufzugehen
  rationale: Der Kontext vermittelt eine Weisung. »Solle« bewahrt deren verpflichtenden Charakter, ohne die im Hebräischen nicht vollständig festgelegte Stärke der Modalität zu überdeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Mitteilungs- und Weisungsgefüge, wird aber durch »ausrichten« und den Konjunktiv idiomatisch gestaltet. Die Wiederholung des Namens David verhindert eine missverständliche Pronomenzuordnung.
