source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֣יד אֶֽל הָ/אֱלֹהִ֡ים הֲ/לֹא֩ אֲנִ֨י אָמַ֜רְתִּי לִ/מְנ֣וֹת בָּ/עָ֗ם וַ/אֲנִי ה֤וּא אֲשֶׁר חָטָ֨אתִי֙ וְ/הָרֵ֣עַ הֲרֵע֔וֹתִי וְ/אֵ֥לֶּה הַ/צֹּ֖אן מֶ֣ה עָשׂ֑וּ יְהוָ֣ה אֱלֹהַ֗/י תְּהִ֨י נָ֤א יָֽדְ/ךָ֙ בִּ֚/י וּ/בְ/בֵ֣ית אָבִ֔/י וּֽ/בְ/עַמְּ/ךָ֖ לֹ֥א לְ/מַגֵּפָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/017.yaml
  text: Then David said to God[a], “Was it not I who ordered the people to be counted? I am the one who has sinned and done great evil. But these sheep—what have they done? O Yahweh my God, please let your hand be against me and against my father’s house[d][c][b], but not against your people for a plague.”
translation:
  language: de
  text: 'Da sagte David zu Gott: »War nicht ich es, der angeordnet hat, das Volk zu zählen? Ich bin es, der gesündigt und sehr böse gehandelt hat. Aber diese Schafe – was haben sie getan?[a] Jahwe, mein Gott, lass doch deine Hand gegen mich und gegen das Haus meines Vaters gerichtet sein,[b] aber nicht gegen dein Volk, um ihm eine Plage zu bringen.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Diese Schafe« ist ein Bild für das Volk.
    reason: cultural_note
  - marker: b
    text: »Deine Hand« bezeichnet hier Gottes wirksame Macht im Gericht. Das »Haus meines Vaters« kann Davids Familie, Hausverband oder Dynastie meinen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich knapp: »aber gegen dein Volk nicht zur Plage«; auch möglich: »aber nicht mit einer Plage gegen dein Volk«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא אֲנִי אָמַרְתִּי לִמְנוֹת בָּעָם
  choice: War nicht ich es, der angeordnet hat, das Volk zu zählen?
  rationale: Die rhetorische Frage und Davids betonte Eigenverantwortung bleiben erhalten. אָמַרְתִּי bedeutet wörtlich »ich sagte«; im Zusammenhang bezeichnet es seine Anordnung zur Volkszählung.
- source_word: וַאֲנִי הוּא אֲשֶׁר חָטָאתִי
  choice: Ich bin es, der gesündigt ... hat
  rationale: Die emphatische Konstruktion hebt David als den persönlich Verantwortlichen hervor.
- source_word: וְהָרֵעַ הֲרֵעוֹתִי
  choice: und sehr böse gehandelt hat
  rationale: Der Infinitivus absolutus mit der finiten Verbform verstärkt die Aussage. »Sehr böse gehandelt« gibt sowohl den verbalen Charakter als auch die Intensivierung natürlich wieder.
- source_word: וְאֵלֶּה הַצֹּאן
  choice: Aber diese Schafe
  rationale: Die konkrete Hirtenmetapher des Hebräischen wird bewahrt; gemeint ist das Volk.
- source_word: יְהוָה אֱלֹהַי
  choice: Jahwe, mein Gott
  rationale: Der Gottesname wird als Eigenname wiedergegeben; אֱלֹהַי ist die direkte Anrede »mein Gott«.
- source_word: תְּהִי נָא יָדְךָ בִּי וּבְבֵית אָבִי
  choice: lass doch deine Hand gegen mich und gegen das Haus meines Vaters gerichtet sein
  rationale: Das Bild der »Hand« als Ausdruck wirksamer Macht beziehungsweise Gerichtshandelns bleibt erhalten. »Haus meines Vaters« bewahrt den möglichen Bezug auf Familie, Hausstand oder Dynastie.
- source_word: וּבְעַמְּךָ לֹא לְמַגֵּפָה
  choice: aber nicht gegen dein Volk, um ihm eine Plage zu bringen
  rationale: Die knappe hebräische Konstruktion wird zu verständlichem Deutsch entfaltet, ohne die Bitte inhaltlich zu verändern.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen ausdrücklich. »Jahwe« bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von »diese Schafe«
  choice: Metapher im Haupttext bewahren
  alternative: diese Menschen / dieses Volk
  rationale: David unterscheidet sich als verantwortlicher Herrscher vom unschuldigen Volk und bezeichnet dieses mit einer Hirtenmetapher. Die Übersetzung sollte diese Bildsprache nicht auflösen.
- issue: Bedeutung von »Haus meines Vaters«
  choice: wörtlich-offene Wiedergabe
  alternative: meine Familie / meine Dynastie
  rationale: Der Ausdruck kann die Familie, den Hausverband oder die dynastische Linie einschließen. Die offene Formulierung vermeidet eine unbegründete Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt eindringlich und rhetorisch. Hebräische Bildsprache wird erhalten, während elliptische Konstruktionen für gewöhnliche Leser behutsam verdeutlicht werden.
