source:
  edition: WLC
  text: וְ/לֵוִי֙ וּ/בִנְיָמִ֔ן לֹ֥א פָקַ֖ד בְּ/תוֹכָ֑/ם כִּֽי נִתְעַ֥ב דְּבַר הַ/מֶּ֖לֶךְ אֶת יוֹאָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/006.yaml
  text: But he did not count Levi and Benjamin among them[a], because the king’s command was detestable to Joab.
translation:
  language: de
  text: Aber Levi und Benjamin zählte er nicht mit ihnen, denn der Befehl des Königs war Joab zuwider.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn das Wort des Königs war Joab ein Gräuel.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֵוִי וּ/בִנְיָמִן
  choice: Aber Levi und Benjamin
  rationale: Das וְ wird wegen des Gegensatzes zu den zuvor genannten Zählungsergebnissen mit „Aber“ wiedergegeben; die Stammesnamen bleiben in ihrer geläufigen deutschen Form.
- source_word: לֹא פָקַד
  choice: zählte er nicht
  rationale: פקד bezeichnet im unmittelbaren Kontext die Erfassung bei einer Volkszählung; „zählen“ ist klar und idiomatisch.
- source_word: בְּ/תוֹכָ/ם
  choice: mit ihnen
  rationale: Wörtlich „in ihrer Mitte/unter ihnen“; gemeint ist, dass Levi und Benjamin nicht zusammen mit den übrigen Stämmen erfasst wurden.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für Joabs Unterlassung ein; „denn“ bewahrt den erklärenden Anschluss.
- source_word: נִתְעַב
  choice: war … zuwider
  rationale: Der Niphal-Ausdruck bezeichnet starke Abscheu. „Zuwider sein“ klingt in modernem, würdigem Deutsch natürlich und erhält die negative Wertung.
- source_word: דְּבַר הַ/מֶּלֶךְ
  choice: der Befehl des Königs
  rationale: דבר kann „Wort“, „Sache“ oder kontextuell „Befehl“ bedeuten. Hier ist Davids Anordnung zur Volkszählung gemeint.
- source_word: אֶת יוֹאָב
  choice: Joab
  rationale: Nach dem Ausdruck der Abscheu bezeichnet אֶת die betroffene Person; im Deutschen wird dies idiomatisch mit „Joab zuwider“ ausgedrückt.
