  text: וַ/יִּתֵּ֧ן יְהוָ֛ה דֶּ֖בֶר בְּ/יִשְׂרָאֵ֑ל וַ/יִּפֹּל֙ מִ/יִּשְׂרָאֵ֔ל שִׁבְעִ֥ים אֶ֖לֶף אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/014.yaml
  text: So Yahweh sent a plague on Israel[a], and seventy thousand men of Israel fell.
translation:
  language: de
  text: Da ließ Jahwe eine Seuche über Israel kommen,[a] und siebzigtausend Männer aus Israel fielen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Pest«. Das hebräische Wort bezeichnet einen tödlichen Krankheitsausbruch, häufig im Zusammenhang mit göttlichem Gericht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיִּתֵּן
  choice: ließ … kommen
  rationale: Das wörtliche »gab« wird in Verbindung mit דֶּבֶר idiomatisch als das Verhängen beziehungsweise Kommenlassen einer Seuche ausgedrückt; die direkte göttliche Urheberschaft bleibt erhalten.
- source_word: דֶּבֶר
  choice: Seuche
  rationale: Das Wort bezeichnet einen tödlichen Krankheitsausbruch, häufig als göttliches Gericht. »Seuche« ist im modernen Deutschen klar und treffend.
- source_word: בְּיִשְׂרָאֵל
  choice: über Israel
  rationale: In Verbindung mit »Seuche« gibt »über Israel« das Hereinbrechen des Gerichts natürlich wieder.
- source_word: וַיִּפֹּל
  choice: fielen
  rationale: Die hebräische Todesumschreibung wird formal bewahrt und bleibt im Zusammenhang verständlich.
- source_word: מִיִּשְׂרָאֵל
  choice: aus Israel
  rationale: Die Präposition מִן wird sichtbar wiedergegeben und bezeichnet hier die Gruppe, aus der die Toten stammten.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: siebzigtausend Mann
  rationale: אִישׁ steht nach der Zahl kollektiv; »Mann« wahrt die ausdrückliche Personenbezeichnung und entspricht natürlichem deutschem Zahlgebrauch.
theological_decisions:
- issue: Göttliche Urheberschaft im Gericht
  choice: Jahwe ließ eine Seuche über Israel kommen
  alternative: Jahwe ließ eine Seuche über Israel zu
  rationale: Der hebräische Text schreibt Jahwe die Handlung unmittelbar zu. Eine bloße Zulassung würde diese Aussage theologisch abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge und die direkte Aussage göttlichen Handelns werden bewahrt; »ließ … kommen« vermeidet zugleich das unnatürliche wörtliche »gab eine Seuche«.
