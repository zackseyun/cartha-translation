  text: וַ/יַּחְלְק֥וּ/ם בְּ/גוֹרָל֖וֹת אֵ֣לֶּה עִם אֵ֑לֶּה כִּי הָי֤וּ שָֽׂרֵי קֹ֨דֶשׁ֙ וְ/שָׂרֵ֣י הָ/אֱלֹהִ֔ים מִ/בְּנֵ֥י אֶלְעָזָ֖ר וּ/בִ/בְנֵ֥י אִיתָמָֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/005.yaml
  text: So they divided them by lots[a], these with those[b], because there were officers of the sanctuary and officers of God from the sons of Eleazar and from the sons of Ithamar.
translation:
  language: de
  text: So teilten sie sie durch Lose ein, die einen zusammen mit den anderen[a]; denn sowohl unter den Söhnen Eleasars als auch unter den Söhnen Itamars gab es Oberste des Heiligtums und Oberste Gottes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »diese mit diesen«; die knappe Wendung bezieht sich auf die beiden Gruppen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Fürsten/Leiter des Heiligtums und Fürsten/Leiter Gottes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְלְקוּם
  choice: So teilten sie sie ein
  rationale: Das Piel von חלק bezeichnet hier die Einteilung beziehungsweise Zuweisung der priesterlichen Gruppen. »Teilten … ein« ist im Deutschen natürlich und bewahrt den konkreten Vorgang.
- source_word: בְּגוֹרָלוֹת
  choice: durch Lose
  rationale: Die Präposition bezeichnet das Mittel der Zuweisung; der Plural des hebräischen Textes bleibt erhalten.
- source_word: אֵלֶּה עִם אֵלֶּה
  choice: die einen zusammen mit den anderen
  rationale: Diese idiomatische Wiedergabe macht verständlich, dass die beiden Familiengruppen gemeinsam beziehungsweise im Verhältnis zueinander ausgelost wurden, ohne die knappe hebräische Formulierung unnötig auszudeuten.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die Auslosung ein. »Denn« fügt sich natürlich in den deutschen Satzbau.
- source_word: שָׂרֵי קֹדֶשׁ
  choice: Oberste des Heiligtums
  rationale: שָׂרִים bezeichnet leitende Amtsträger. קֹדֶשׁ verweist in diesem kultischen Zusammenhang wahrscheinlich auf den heiligen Bereich beziehungsweise das Heiligtum.
- source_word: וְשָׂרֵי הָאֱלֹהִים
  choice: und Oberste Gottes
  rationale: Die bewusst knappe Wendung des Hebräischen wird beibehalten; ein nicht im Ausgangstext stehendes »Haus« oder »Dienst« wird nicht ergänzt.
- source_word: מִבְּנֵי אֶלְעָזָר וּבִבְנֵי אִיתָמָר
  choice: sowohl unter den Söhnen Eleasars als auch unter den Söhnen Itamars
  rationale: Die genealogische Bezeichnung »Söhne« wird bewahrt. Die deutsche Konstruktion mit »sowohl … als auch« gibt verständlich wieder, dass es in beiden Familienlinien solche Amtsträger gab.
theological_decisions:
- issue: Bedeutung von שָׂרֵי קֹדֶשׁ וְשָׂרֵי הָאֱלֹהִים
  choice: Die beiden parallelen Bezeichnungen werden als »Oberste des Heiligtums und Oberste Gottes« wiedergegeben.
  alternative: »Leiter der heiligen Dinge und Leiter Gottes« oder eine erläuternde Ergänzung wie »Oberste des Hauses Gottes«
  rationale: Die Wiedergabe erhält die auffällige Parallelität und theologische Spannung des hebräischen Textes, ohne die zweite Wendung durch einen nicht ausdrücklich genannten institutionellen Bezug zu harmonisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung wurde für natürliche Lesbarkeit leicht angepasst; die ungewöhnliche Wendung »Oberste Gottes« bleibt erhalten, damit die Mehrdeutigkeit des Ausgangstextes nicht durch eine erklärende Ergänzung beseitigt wird.
