  text: לְ/מַחְלִי֙ אֶלְעָזָ֔ר וְ/לֹא הָ֥יָה ל֖/וֹ בָּנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/028.yaml
  text: 'For Mahli: Eleazar[a], and he had no sons.'
translation:
  language: de
  text: 'Für Machli[a]: Eleasar; er hatte keine Söhne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was Machli betrifft: Eleasar; er hatte keine Söhne.“ Die einleitende Präposition dient wahrscheinlich als Überschrifts- oder Themenmarker in der Liste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלִי
  choice: Für Machli
  rationale: Das vorangestellte לְ dient in dieser genealogischen Liste wahrscheinlich als Überschrifts- oder Themenmarker. „Für Machli“ bewahrt die Listenstruktur knapp und verständlich.
- source_word: אֶלְעָזָר
  choice: Eleasar
  rationale: Gebräuchliche deutsche Umschrift des hebräischen Personennamens.
- source_word: וְלֹא הָיָה לוֹ
  choice: er hatte keine
  rationale: Die hebräische Besitzkonstruktion, wörtlich etwa „es waren ihm keine“, wird im Deutschen natürlich mit „er hatte keine“ wiedergegeben. Das וְ verbindet die Aussage; im Deutschen genügt hier nach dem Semikolon die unverbundene Fortsetzung, ohne einen zusätzlichen Gegensatz einzutragen.
- source_word: בָּנִים
  choice: Söhne
  rationale: בָּנִים bezeichnet hier im genealogischen Zusammenhang ausdrücklich Söhne, nicht allgemein Kinder.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Standarddeutsch; die listenartige Form des hebräischen Textes bleibt erhalten. Der Doppelpunkt markiert die Zuordnung Machlis zu Eleasar, das Semikolon trennt die anschließende Aussage.
