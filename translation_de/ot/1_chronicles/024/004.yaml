  text: וַ/יִּמָּצְא֣וּ בְֽנֵי אֶלְעָזָ֡ר רַבִּ֞ים לְ/רָאשֵׁ֧י הַ/גְּבָרִ֛ים מִן בְּנֵ֥י אִיתָמָ֖ר וַֽ/יַּחְלְק֑וּ/ם לִ/בְנֵ֨י אֶלְעָזָ֜ר רָאשִׁ֤ים לְ/בֵית אָבוֹת֙ שִׁשָּׁ֣ה עָשָׂ֔ר וְ/לִ/בְנֵ֧י אִיתָמָ֛ר לְ/בֵ֥ית אֲבוֹתָ֖/ם שְׁמוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/004.yaml
  text: 'The sons of Eleazar were found to be more numerous[a], as heads of the men, than the sons of Ithamar, and they divided them thus: for the sons of Eleazar, sixteen heads of fathers’ houses, and for the sons of Ithamar, according to their fathers’ houses[b], eight.'
translation:
  language: de
  text: 'Bei den Söhnen Eleasars fanden sich mehr Oberhäupter der Männer[a] als bei den Söhnen Itamars. Dann teilte man sie folgendermaßen ein: Bei den Söhnen Eleasars sechzehn Oberhäupter von Vaterhäusern[b], bei den Söhnen Itamars acht, entsprechend ihren Vaterhäusern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich etwa „als Oberhäupter der Männer“. Das hebräische Wort für „Männer“ kann auch kräftige oder tüchtige Männer bezeichnen; im Zusammenhang geht es wahrscheinlich um die Männer, deren Oberhäupter gezählt werden.
    reason: lexical_alternative
  - marker: b
    text: Ein „Vaterhaus“ war eine durch gemeinsame Abstammung verbundene Großfamilie beziehungsweise Sippe und zugleich eine organisatorische Einheit in Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמָּצְאוּ
  choice: fanden sich
  rationale: Das Nifal von מצא bezeichnet hier den festgestellten Bestand. „Fanden sich“ gibt dies im Deutschen natürlich wieder, ohne einen aktiven Suchvorgang vorauszusetzen.
- source_word: רַבִּים ... מִן
  choice: mehr ... als
  rationale: 'רַבִּים erhält durch מִן im Kontext vergleichende Bedeutung: Bei Eleasar gab es eine größere Zahl als bei Itamar.'
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: führende Männer
  rationale: Die wörtliche Verbindung „Häupter der Männer“ ist im Deutschen schwer verständlich. Im Zusammenhang sind maßgebliche Männer beziehungsweise Oberhäupter der priesterlichen Familien gemeint; die Fußnote bewahrt die mögliche kräftigere Nuance von גְּבָרִים.
- source_word: וַיַּחְלְקוּם
  choice: Daher teilte man sie folgendermaßen ein
  rationale: Das Verb bezeichnet die Einteilung der Priester in Abteilungen. Die unpersönliche Wiedergabe vermeidet ein im Hebräischen nicht ausdrücklich genanntes Handlungssubjekt.
- source_word: רָאשִׁים
  choice: Oberhäupter
  rationale: „Oberhäupter“ bewahrt die Leitungs- und Familienstruktur von רֹאשׁ und passt zum anschließenden Ausdruck „Vaterhäuser“.
- source_word: לְבֵית אָבוֹת
  choice: von Vaterhäusern
  rationale: בֵּית אָבוֹת ist eine feste israelitische Verwandtschafts- und Verwaltungseinheit. Die traditionelle, knappe Bezeichnung wird durch eine Fußnote erläutert.
- source_word: שִׁשָּׁה עָשָׂר ... שְׁמוֹנָה
  choice: sechzehn ... acht
  rationale: Die Zahlen bezeichnen die jeweiligen Oberhäupter beziehungsweise die von ihnen vertretenen Abteilungen.
- source_word: לְבֵית אֲבוֹתָם
  choice: entsprechend ihren Vaterhäusern
  rationale: Die Wiedergabe bringt sowohl den Bezug auf die eigenen Vaterhäuser der Itamariter als auch die ordnende Funktion der Präposition zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit leicht geglättet, während die genealogisch-administrativen Begriffe „Oberhäupter“ und „Vaterhäuser“ erhalten bleiben. Die Wiederholung von „Oberhäupter“ im letzten Satz macht im Deutschen deutlich, worauf sich die Zahlen beziehen.
