lexical_decisions:
- source_word: לְחָרִם
  choice: auf Harim
  rationale: Das präfigierte לְ kennzeichnet in dieser Losliste die Zuweisung; im Deutschen gibt „auf Harim“ idiomatisch an, auf wen das Los fiel. Der Eigenname wird als Harim transliteriert.
- source_word: הַשְּׁלִישִׁי
  choice: das dritte Los
  rationale: Das bestimmte Ordinalzahlwort bezeichnet im Zusammenhang das dritte Los. „Los“ wird zur natürlichen Verständlichkeit aus dem Kontext ergänzt.
- source_word: לִשְׂעֹרִים
  choice: auf Seorim
  rationale: Auch hier bezeichnet לִ die Zuweisung durch das Los; „auf Seorim“ entspricht natürlichem deutschem Sprachgebrauch. Der Eigenname wird als Seorim transliteriert.
- source_word: הָרְבִעִי
  choice: das vierte
  rationale: Das bestimmte Ordinalzahlwort steht parallel zu „das dritte Los“; das bereits genannte Substantiv „Los“ kann im zweiten Glied unausgesprochen bleiben.
