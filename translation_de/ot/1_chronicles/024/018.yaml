  text: für Delaja das dreiundzwanzigste, für Maasja das vierundzwanzigste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִדְלָיָהוּ
  choice: für Delaja
  rationale: Die Präposition ל kennzeichnet in dieser Liste die Zuordnung des Loses beziehungsweise der Priesterabteilung. „Für“ gibt diese Funktion knapp und natürlich wieder; der Name wird nach geläufiger deutscher Bibeltradition als „Delaja“ transkribiert.
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים
  choice: das dreiundzwanzigste
  rationale: Die formal kardinale Wendung „drei und zwanzig“ bezeichnet im Zusammenhang der fortlaufenden Lose deren Ordnungszahl. Das substantivierte Neutrum bezieht sich sinngemäß auf das Los.
- source_word: לְמַעַזְיָהוּ
  choice: für Maasja
  rationale: Wie beim ersten Namen bezeichnet ל die Zuordnung innerhalb der Losliste. „Für Maasja“ ist im Deutschen knapp und verständlich; der Personenname wird transkribiert.
- source_word: אַרְבָּעָה וְעֶשְׂרִים
  choice: das vierundzwanzigste
  rationale: Die kardinale Form fungiert hier als Ordnungszahl in der Abfolge der Lose. „Das vierundzwanzigste“ bewahrt die knappe Listenform und ergänzt nicht ausdrücklich, was im Kontext bereits vorausgesetzt ist.
