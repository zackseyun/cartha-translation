lexical_decisions:
- source_word: וְ/לִ/בְנֵי אַהֲרֹן
  choice: Für die Söhne Aarons galten folgende
  rationale: Die Präposition לְ bezeichnet hier die Zuordnung der nachfolgend genannten Abteilungen zu Aarons Söhnen; die einleitende Konjunktion wird im Deutschen nicht eigens wiedergegeben. Die Formulierung gibt den überschriftartigen Übergang natürlich wieder.
- source_word: מַחְלְקוֹתָם
  choice: Abteilungen
  rationale: Das Substantiv bezeichnet geordnete Gruppen beziehungsweise Dienstabteilungen. „Abteilungen“ ist im Deutschen verständlich und lässt die im weiteren Zusammenhang erkennbare priesterliche Organisation anklingen, ohne sie hier näher auszudeuten.
- source_word: בְּנֵי אַהֲרֹן
  choice: Aarons Söhne
  rationale: Natürliche deutsche Wiedergabe der hebräischen Genitivverbindung; „Söhne“ bewahrt die konkrete Geschlechtsangabe des Ausgangstextes.
- source_word: נָדָב וַאֲבִיהוּא
  choice: Nadab und Abihu
  rationale: Gebräuchliche deutsche Schreibweisen der Personennamen; die Verbindung durch „und“ bleibt erhalten.
- source_word: אֶלְעָזָר וְאִיתָמָר
  choice: Eleasar und Itamar
  rationale: Gebräuchliche deutsche Schreibweisen der Personennamen; die Verbindung durch „und“ bleibt erhalten.
