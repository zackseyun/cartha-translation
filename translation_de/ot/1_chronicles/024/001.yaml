base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/001.yaml
  text: 'These were the divisions of the sons of Aaron: the sons of Aaron were Nadab and Abihu[a], Eleazar and Ithamar.'
translation:
  language: de
  text: 'Dies waren die Abteilungen[a] der Söhne Aarons: Die Söhne Aarons waren Nadab und Abihu, Eleasar und Itamar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dienstgruppen“. Das hebräische Wort bezeichnet geordnete, hier priesterliche Gruppen.'
