base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/027.yaml
  text: 'The sons of Merari: of Jaaziah, his son, Shoham, Zaccur, and Ibri.'
translation:
  language: de
  text: 'Die Söhne Meraris: von Jaasja: sein Sohn[a], Schoham, Sakkur und Ibri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „sein Sohn“. Der Satzbau ist schwierig. Manche verstehen das Wort als den Eigennamen „Beno“, andere nehmen einen pluralischen Sinn wie „seine Söhne“ an.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: Die Söhne Meraris
  rationale: Die Status-constructus-Verbindung bezeichnet in diesem genealogischen Verzeichnis die Söhne beziehungsweise die Familienlinie Meraris. Die direkte Wiedergabe bewahrt die Ausdrucksweise des Hebräischen.
- source_word: לְיַעֲזִיָּהוּ
  choice: von Jaasja
  rationale: Das vorangestellte לְ kennzeichnet hier am ehesten den Jaasja zugeordneten Zweig. „Von Jaasja“ ist knapp und lässt die schwierige Beziehung zu den folgenden Wörtern offen.
- source_word: בְנוֹ
  choice: sein Sohn
  rationale: Der vokalisierte masoretische Text lautet singularisch „sein Sohn“. Diese Lesart bleibt im Haupttext erhalten, obwohl der Satzbau schwierig ist.
- source_word: וְשֹׁהַם וְזַכּוּר וְעִבְרִי
  choice: Schoham, Sakkur und Ibri
  rationale: Die Eigennamen werden in einer für deutsche Leser gut aussprechbaren Form wiedergegeben; die gereihte hebräische Konjunktion wird nach natürlichem deutschem Listenstil gestaltet.
theological_decisions: []
