  text: אֲחִ֤י מִיכָה֙ יִשִּׁיָּ֔ה לִ/בְנֵ֥י יִשִּׁיָּ֖ה זְכַרְיָֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/025.yaml
  text: 'The brother of Micah: Isshiah; of the sons of Isshiah[a], Zechariah.'
translation:
  language: de
  text: 'Der Bruder Michas war Jischija; unter den Söhnen Jischijas: Sacharja.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחִי
  choice: Der Bruder … war
  rationale: Die Konstruktform von אָח bezeichnet die genealogische Beziehung. Das im Hebräischen nominale Listenelement wird im Deutschen durch „war“ natürlich und eindeutig verbunden.
- source_word: מִיכָה
  choice: Micha
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: יִשִּׁיָּה
  choice: Jischija
  rationale: Der hebräische Personenname wird nach gängiger deutscher Transkriptionsweise wiedergegeben und an beiden Stellen einheitlich geschrieben.
- source_word: לִבְנֵי
  choice: von den Söhnen
  rationale: לְ mit בְּנֵי bezeichnet hier innerhalb der genealogischen Liste Zugehörigkeit beziehungsweise Abstammung, nicht Richtung oder Zweck.
- source_word: זְכַרְיָהוּ
  choice: Sacharja
  rationale: Verwendet wird die im Deutschen etablierte biblische Namensform.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Listendeutsch. Die elliptische Struktur des Hebräischen bleibt nach dem Semikolon erhalten; nur im ersten Satzglied wird zur natürlichen deutschen Verknüpfung „war“ ergänzt.
