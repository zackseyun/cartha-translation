  text: for Huppah[a], the thirteenth; for Jeshebeab, the fourteenth.
translation:
  language: de
  text: für Huppa das dreizehnte, für Jeschebeab das vierzehnte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/חֻפָּה
  choice: für Huppa
  rationale: Die Präposition לְ kennzeichnet in dieser Aufzählung die Zuordnung des Loses beziehungsweise der Abteilung zu einem priesterlichen Haus. „Für Huppa“ ist im Deutschen knapp und natürlich.
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: das dreizehnte
  rationale: Die formal kardinale Zahl wird im Zusammenhang der geordneten Lose ordinal gebraucht. Das substantivierte Neutrum bezieht sich sinngemäß auf das Los.
- source_word: לְ/יֶשֶׁבְאָב
  choice: für Jeschebeab
  rationale: Wie beim ersten Namen bezeichnet לְ die Zuordnung. „Jeschebeab“ gibt den hebräischen Eigennamen יֶשֶׁבְאָב in einer im Deutschen gut lesbaren Form wieder.
- source_word: אַרְבָּעָה עָשָׂר
  choice: das vierzehnte
  rationale: Die Kardinalzahl hat hier ordinale Funktion; „das vierzehnte“ setzt die in der Liste vorausgesetzte Bezeichnung „Los“ fort.
theological_decisions: []
translation_notes:
  register: Knapp gehaltener Listenstil in modernem Standarddeutsch. Die elliptische Form des Hebräischen bleibt erhalten; „das dreizehnte/das vierzehnte“ setzt sinngemäß „Los“ voraus. Keine Fußnote nötig, da „für“ die Zuordnungsfunktion von לְ im Deutschen sachgerecht wiedergibt.
