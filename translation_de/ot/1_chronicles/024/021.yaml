  text: For Rehabiah[a], from the sons of Rehabiah, the chief was Isshiah.
translation:
  language: de
  text: Bei Rehabja[a] war unter den Söhnen Rehabjas Jischija das Oberhaupt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rehabja: Von den Söhnen Rehabjas war Jischija das Oberhaupt.“'
    reason: Die mit ל eingeleiteten Wortgruppen können als knappe Gliederung einer Familienliste verstanden werden.
lexical_decisions:
- source_word: לִרְחַבְיָהוּ
  choice: Für Rehabja
  rationale: Das vorangestellte ל leitet in dieser Aufzählung den nächsten Familienzweig ein. „Für Rehabja“ bewahrt den knappen Gliederungscharakter des Hebräischen.
- source_word: לִבְנֵי רְחַבְיָהוּ
  choice: von den Söhnen Rehabjas
  rationale: בני bezeichnet hier die Söhne beziehungsweise männlichen Nachkommen Rehabjas. „Von den Söhnen“ stellt Jischija als Vertreter dieses Familienzweigs dar, ohne die etwas mehrdeutige Funktion des ל völlig einzuebnen.
- source_word: הָרֹאשׁ
  choice: das Oberhaupt
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“, bezeichnet hier aber den führenden Vertreter der Familie. „Oberhaupt“ ist im genealogisch-administrativen Zusammenhang natürlich und würdevoll.
- source_word: יִשִּׁיָּה
  choice: Jischija
  rationale: Der Personenname wird nach geläufigen deutschen Transliterationskonventionen wiedergegeben; „sch“ bildet den hebräischen Sch-Laut ab.
