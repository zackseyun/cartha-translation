base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/020.yaml
  text: 'And for the remaining sons of Levi: for the sons of Amram[a], Shubael; for the sons of Shubael[b], Jehdeiah.'
translation:
  language: de
  text: 'Und für die übrigen Söhne Levis: Für die Söhne Amrams[a] Schubaël; für die Söhne Schubaëls: Jechdeja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Namensliste ist verkürzt formuliert; die genannten Personennamen bezeichnen hier wahrscheinlich das Oberhaupt oder den Vertreter des jeweiligen Familienzweigs.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/בְנֵי לֵוִי הַ/נּוֹתָרִים
  choice: Und für die übrigen Söhne Levis
  rationale: Die Verbindung aus Konjunktion, Präposition und בְּנֵי führt einen weiteren Abschnitt der Liste ein; הַנּוֹתָרִים bezeichnet die übrigen beziehungsweise noch nicht aufgeführten Leviten.
- source_word: לִ/בְנֵי עַמְרָם
  choice: Für die Söhne Amrams
  rationale: Die wiederholte Listenformel wird knapp und in natürlichem Deutsch wiedergegeben; der Genitiv bewahrt die genealogische Zuordnung.
- source_word: שׁוּבָאֵל
  choice: Schubaël
  rationale: Der Eigenname wird nach üblicher deutscher Bibeltransliteration wiedergegeben; das Trema macht die getrennte Aussprache der Vokale deutlich.
- source_word: לִ/בְנֵי שׁוּבָאֵל
  choice: für die Söhne Schubaëls
  rationale: Die wiederholte hebräische Gliederungsformel und die Abstammungsangabe bleiben erhalten.
- source_word: יֶחְדְּיָהוּ
  choice: Jechdeja
  rationale: Der Eigenname wird in einer im Deutschen geläufigen, am Hebräischen orientierten Form wiedergegeben.
