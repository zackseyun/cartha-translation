lexical_decisions:
- source_word: וּבְנָי
  choice: Und die Söhne
  rationale: Das Waw verbindet den Vers mit der vorausgehenden Liste; בְנֵי ist der Konstruktplural »Söhne von«.
- source_word: יְרִיָּהוּ
  choice: Jerijas
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen Form wiedergegeben; der Genitiv fügt sich natürlich in die Wendung »die Söhne Jerijas« ein.
- source_word: אֲמַרְיָהוּ
  choice: Amarja
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: הַשֵּׁנִי
  choice: der Zweite
  rationale: Die bestimmte Ordnungszahl wird ohne ergänztes Verb wiedergegeben und bewahrt so die knappe Listenform des Hebräischen.
- source_word: יַחֲזִיאֵל
  choice: Jahasiël
  rationale: Gebräuchliche deutsche Transliteration; das Trema zeigt, dass die Vokale getrennt gesprochen werden.
- source_word: הַשְּׁלִישִׁי
  choice: der Dritte
  rationale: Die bestimmte Ordnungszahl wird entsprechend der hebräischen Listenstruktur beibehalten.
- source_word: יְקַמְעָם
  choice: Jekamam
  rationale: Gebräuchliche deutsche Wiedergabe des masoretisch vokalisierten Personennamens.
- source_word: הָרְבִיעִי
  choice: der Vierte
  rationale: Die bestimmte Ordnungszahl wird ohne interpretierende Ergänzung wiedergegeben.
