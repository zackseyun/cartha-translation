  edition: WLC
  text: בְּנֵ֤י מְרָרִי֙ מַחְלִ֣י וּ/מוּשִׁ֔י בְּנֵ֖י יַעֲזִיָּ֥הֽוּ בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/026.yaml
  text: 'The sons of Merari: Mahli and Mushi. The sons of Jaaziah: his son.'
translation:
  language: de
  text: 'Die Söhne Meraris: Machli und Muschi. Die Söhne Jaasijas: sein Sohn.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text lautet wörtlich „sein Sohn“; die Verbindung mit dem vorausgehenden Plural „die Söhne Jaasijas“ ist unklar. Manche Übersetzungen verstehen das Wort als den Namen „Beno“.
    reason: Die ungewöhnliche Syntax und die mögliche alternative Auffassung als Eigenname sollten sichtbar bleiben.
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: Die Söhne Meraris
  rationale: Gibt die genealogische Status-constructus-Verbindung knapp und natürlich wieder.
- source_word: מַחְלִי וּמוּשִׁי
  choice: Machli und Muschi
  rationale: Die hebräischen Eigennamen werden in geläufiger deutscher Bibelschreibung wiedergegeben.
- source_word: בְּנֵי יַעֲזִיָּהוּ
  choice: Die Söhne Jaasijas
  rationale: Bewahrt den im masoretischen Text stehenden Plural und gibt den Namen יַעֲזִיָּהוּ als Jaasija wieder.
- source_word: בְנוֹ
  choice: sein Sohn
  rationale: Liest die masoretische Worttrennung בְנוֹ wörtlich als Possessivverbindung und nicht als Eigennamen »Beno«.
theological_decisions:
- issue: Unklare genealogische Syntax am Versende
  choice: sein Sohn
  alternative: Beno
  rationale: Die masoretische Vokalisierung und Worttrennung weisen auf בְּנוֹ, »sein Sohn«. Die dadurch entstehende Spannung zum vorausgehenden Plural wird nicht stillschweigend geglättet.
translation_notes:
  register: Knappes, würdevolles genealogisches Deutsch. Die eigentümliche Numerusspannung des hebräischen Textes wird im Haupttext bewahrt und in einer Fußnote erläutert.
