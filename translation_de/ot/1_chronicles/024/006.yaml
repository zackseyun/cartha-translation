  terminology: „Schreiber“, „Leviten“, „Priester“, „Zadok“, „Abjatar“, „Eleasar“ und „Itamar“ sind passend. „Oberhäupter der Vaterhäuser“ übersetzt רָאשֵׁי הָאָבוֹת präzise. Die Fußnote soll die Auswahl von Vaterhäusern, nicht von deren Oberhäuptern, benennen und keine nicht ausdrücklich bezeichnete Alternation festlegen.
