  to: 'Schemaja, der Sohn Netanels, ein Schreiber aus dem Kreis der Leviten, schrieb sie in Gegenwart des Königs, der Amtsträger, des Priesters Zadok, Ahimelechs, des Sohnes Abjatars, sowie der Oberhäupter der Vaterhäuser der Priester und Leviten auf: Ein Vaterhaus wurde für Eleasar ausgewählt und eines für Itamar.[a]'
