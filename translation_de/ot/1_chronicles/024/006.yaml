  text: וַֽ/יִּכְתְּבֵ֡/ם שְֽׁמַֽעְיָה֩ בֶן נְתַנְאֵ֨ל הַ/סּוֹפֵ֜ר מִן הַ/לֵּוִ֗י לִ/פְנֵ֨י הַ/מֶּ֤לֶךְ וְ/הַ/שָּׂרִים֙ וְ/צָד֣וֹק הַ/כֹּהֵ֗ן וַ/אֲחִימֶ֨לֶךְ֙ בֶּן אֶבְיָתָ֔ר וְ/רָאשֵׁי֙ הָֽ/אָב֔וֹת לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם בֵּֽית אָ֣ב אֶחָ֗ד אָחֻז֙ לְ/אֶלְעָזָ֔ר וְ/אָחֻ֥ז אָחֻ֖ז לְ/אִיתָמָֽר־־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/006.yaml
  text: Shemaiah son of Nethanel[a], the scribe from among the Levites, recorded them in the presence of the king, the officials, Zadok the priest, Ahimelech son of Abiathar, and the heads of the fathers’ houses of the priests and of the Levites—one father’s house being taken for Eleazar, and one being taken for Ithamar.
translation:
  language: de
  text: 'Schemaja, der Sohn Netanels, ein Schreiber aus dem Kreis der Leviten, schrieb sie in Gegenwart des Königs, der Amtsträger, des Priesters Zadok, Ahimelechs, des Sohnes Abjatars, sowie der Oberhäupter der Vaterhäuser der Priester und Leviten auf: Ein Vaterhaus wurde für Eleasar ausgewählt und eines für Itamar.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist stark verkürzt, wörtlich etwa: „Ein Vaterhaus genommen für Eleasar und genommen, genommen für Itamar.“ Die Wiederholung von „genommen“ ist elliptisch; sie bezeichnet die Zuordnung ausgewählter Vaterhäuser zu den Linien Eleasars und Itamars, ohne das genaue Auswahlverfahren näher zu bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתְּבֵם
  choice: schrieb sie ... auf
  rationale: Das Verb כתב mit dem Suffix der 3. Person maskulin Plural bezeichnet die schriftliche Erfassung der zuvor bestimmten Abteilungen beziehungsweise Lose. „Schrieb sie auf“ ist natürlich und bewahrt den dokumentarischen Sinn.
- source_word: הַסֹּפֵר
  choice: der Schreiber
  rationale: סֹפֵר bezeichnet hier einen Schreiber beziehungsweise amtlichen Schriftführer. „Schreiber“ entspricht der historischen Funktion, ohne sie enger als nötig festzulegen.
- source_word: מִן הַלֵּוִי
  choice: aus dem Kreis der Leviten
  rationale: Die Wendung kennzeichnet Schemaja als einen Angehörigen der levitischen Gruppe und gibt die partitive Nuance von מן idiomatisch wieder.
- source_word: לִפְנֵי
  choice: in Gegenwart
  rationale: לִפְנֵי bezeichnet hier die öffentliche Anwesenheit der genannten Zeugen bei der Niederschrift.
- source_word: הַשָּׂרִים
  choice: die führenden Männer
  rationale: שָׂרִים meint in diesem höfisch-administrativen Zusammenhang hochgestellte Amtsträger oder Würdenträger. „Führende Männer“ ist verständlich und vermeidet die irreführende Bedeutung königlicher Söhne, die „Fürsten“ heute nahelegen kann.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: die Oberhäupter der Sippenverbände
  rationale: Die chronistische Fachbezeichnung meint die Leiter größerer, nach Abstammung gegliederter Familienverbände. „Sippenverbände“ vermittelt die soziale Einheit im modernen Deutsch verständlicher als die wörtliche Form „Vaterhäuser“.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: der Priester und Leviten
  rationale: Die Präpositionalformen bestimmen hier, zu welchen Gruppen die zuvor genannten Oberhäupter beziehungsweise Sippenverbände gehören.
- source_word: בֵּית אָב אֶחָד
  choice: je ein Sippenverband
  rationale: בֵּית אָב bezeichnet eine genealogisch organisierte Großfamilie oder Sippeneinheit. „Je ein“ gibt zusammen mit dem Folgesatz die distributive Auswahl wieder.
- source_word: אָחֻז
  choice: wurde ... genommen
  rationale: Das passive Partizip von אחז bedeutet wörtlich „ergriffen/genommen“. Im Zusammenhang der Losverteilung bezeichnet es die Auswahl einer Einheit, ohne das Auswahlverfahren über den Kontext hinaus festzulegen.
- source_word: לְאֶלְעָזָר ... לְאִיתָמָר
  choice: für Eleasar ... für Itamar
  rationale: ל ordnet die ausgewählten Sippenverbände den beiden priesterlichen Abstammungslinien Eleasars und Itamars zu.
- source_word: וְאָחֻז אָחֻז לְאִיתָמָר
  choice: und je einer für Itamar
  rationale: Die Wiederholung von אָחֻז wirkt distributiv. Die deutsche Form bewahrt den Sinn einer fortlaufenden paarweisen beziehungsweise abwechselnden Entnahme, während die sprachliche Verdichtung des Hebräischen in einer Fußnote sichtbar bleibt.
