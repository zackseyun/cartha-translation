  text: Auf Bilga fiel das fünfzehnte Los[a], auf Immer das sechzehnte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich stehen hier die Kardinalzahlen „fünfzehn“ und „sechzehn“; im Zusammenhang der nummerierten Lose sind sie ordinal zu verstehen: „das fünfzehnte“ und „das sechzehnte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: Auf Bilga fiel
  rationale: Das Präfix לְ kennzeichnet in der Liste die Zuweisung des Loses. Die deutsche Wendung „auf Bilga fiel“ gibt diese Funktion im Zusammenhang natürlich wieder.
- source_word: חֲמִשָּׁה עָשָׂר
  choice: das fünfzehnte Los
  rationale: Die hebräische Kardinalzahl „fünfzehn“ wird im fortlaufenden Verzeichnis der Lose ordinal gebraucht. „Los“ wird aus dem unmittelbaren Zusammenhang ergänzt.
- source_word: לְ/אִמֵּר
  choice: auf Immer
  rationale: Wie bei Bilga bezeichnet לְ die Zuweisung innerhalb der ausgelosten Priesterabteilungen. „Auf Immer“ setzt die zuvor formulierte Wendung knapp fort.
- source_word: שִׁשָּׁה עָשָׂר
  choice: das sechzehnte
  rationale: Die Kardinalzahl „sechzehn“ hat hier aufgrund der fortlaufenden Loszählung ordinalen Sinn. Das bereits genannte Wort „Los“ kann im zweiten Satzglied natürlich ausgespart werden.
