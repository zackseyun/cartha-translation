lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: Für den Jizhariter
  rationale: Das vorangestellte ל bezeichnet in dieser Verwaltungsliste am ehesten eine Zuordnung; „für“ gibt diese Funktion natürlich wieder. Die von Jizhar abgeleitete Bezeichnung wird als Sippenbezeichnung „Jizhariter“ wiedergegeben.
- source_word: שְׁלֹמוֹת
  choice: Schelomot
  rationale: Der Personenname wird nach gängiger deutscher Bibelnamen-Transliteration wiedergegeben und bei beiden Vorkommen einheitlich geschrieben.
- source_word: לִבְנֵי
  choice: für die Söhne
  rationale: Das vorangestellte ל bezeichnet wiederum eine Zuordnung. בנים heißt wörtlich „Söhne“, kann in genealogischen Zusammenhängen jedoch auch Nachkommen bezeichnen.
- source_word: יָחַת
  choice: Jahat
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, quellenahen Form transliteriert.
