base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/019.yaml
  text: These were their appointed duties for their service[a], to enter the house of Yahweh according to their ordinance, under the hand of Aaron their father, as Yahweh, the God of Israel[b], had commanded him.
translation:
  language: de
  text: Dies waren ihre Einteilungen für ihren Dienst beim Eintritt in das Haus Jahwes, nach ihrer Vorschrift und unter der Leitung Aarons, ihres Vaters, wie Jahwe, der Gott Israels, ihm geboten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: ihre festgelegten Dienstordnungen
  rationale: Das Substantiv bezeichnet hier die verbindliche Einteilung beziehungsweise Zuweisung der priesterlichen Aufgaben. „Festgelegte Dienstordnungen“ verbindet den Gedanken der Anordnung mit dem konkreten Tempeldienst.
- source_word: לַעֲבֹדָתָם
  choice: zum Dienst
  rationale: עֲבֹדָה bezeichnet im priesterlichen Zusammenhang den kultischen Dienst. „Dienst“ ist verständlich und vermeidet spätere kirchliche Fachsprache.
- source_word: לָבוֹא לְבֵית יְהוָה
  choice: in das Haus Jahwes kamen
  rationale: בוא bezeichnet das Kommen beziehungsweise Hineingehen. Im Zusammenhang beschreibt die Wendung den geregelten Zugang zum Heiligtum; „Haus Jahwes“ bewahrt das hebräische Bild.
- source_word: כְּמִשְׁפָּטָם
  choice: entsprechend der ihnen vorgeschriebenen Ordnung
  rationale: מִשְׁפָּט meint hier nicht ein Gerichtsurteil, sondern die verbindliche Regel oder das vorgeschriebene Verfahren für die Dienstabteilungen.
- source_word: בְּיַד אַהֲרֹן
  choice: unter der Leitung ... Aarons
  rationale: Die Wendung bedeutet wörtlich „durch/unter der Hand Aarons“ und bezeichnet hier seine maßgebliche Leitung oder Autorität. Die idiomatische deutsche Wiedergabe macht diesen Sinn klar.
- source_word: אֲבִיהֶם
  choice: ihres Vaters
  rationale: „Vater“ entspricht dem Wortlaut und bezeichnet Aaron als Stammvater der priesterlichen Nachkommen.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: wie ... es ihm geboten hatte
  rationale: Das singularische Suffix bezieht sich natürlich auf Aaron. Das Plusquamperfekt verdeutlicht im Deutschen, dass der göttliche Befehl der beschriebenen Ordnung vorausging.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Jahwe, der Gott Israels
  rationale: Die Wiedergabe erhält den Gottesnamen und stellt „der Gott Israels“ wie im Hebräischen appositionell dazu.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im Ausgangstext ausdrücklich gebrauchte Bundesname erkennbar bleibt.
- issue: Bedeutung von בְּיַד אַהֲרֹן für die priesterliche Ordnung
  choice: unter der Leitung Aarons
  alternative: durch die Hand Aarons; unter der Hand Aarons; unter Aarons Autorität
  rationale: Die Wendung kann sowohl Vermittlung als auch Autorität ausdrücken. Im Kontext der geregelten Priesterabteilungen steht Aarons maßgebliche Leitung im Vordergrund, ohne dass eine weitergehende Amtslehre eingetragen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird jedoch durch „nach denen“ und die idiomatische Wiedergabe von בְּיַד für heutige Leser verständlich gehalten. Keine Fußnoten erforderlich.
