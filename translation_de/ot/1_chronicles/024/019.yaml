  source_fidelity: 'Die wesentlichen Elemente des Hebräischen sind wiedergegeben: die Einteilungen/Aufgaben, der Dienst, das Eintreten in das Haus Jahwes, die maßgebliche Rolle Aarons sowie der Rückbezug des Singularsuffixes auf Aaron. Die Formulierung „nach denen sie ... kamen“ macht jedoch aus dem Infinitiv לָבוֹא einen relativischen Ablauf und verwischt die eigenständige Bestimmung „zum/beim Eintritt“.'
