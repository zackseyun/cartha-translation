  to: Dies waren ihre Einteilungen für ihren Dienst beim Eintritt in das Haus Jahwes, nach ihrer Vorschrift und unter der Leitung Aarons, ihres Vaters, wie Jahwe, der Gott Israels, ihm geboten hatte.
  rationale: Die Revision gibt die Infinitivbestimmung לָבוֹא mit „beim Eintritt“ wieder, vermeidet die doppelte Wiedergabe von Einteilung und Vorschrift und erhält die genealogische sowie administrative Bezugnahme auf Aaron. Fußnoten sind im deutschen Text nicht erforderlich; daher bestehen auch keine Fußnotenanker zu korrigieren.
