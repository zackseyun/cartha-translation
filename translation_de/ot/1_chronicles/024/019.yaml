  terminology: „Jahwe, der Gott Israels“ ist angemessen. „Unter der Leitung Aarons“ gibt בְּיַד idiomatisch als administrative Zuordnung wieder, ohne eine engere dogmatische Aussage zu erzwingen. „Ihr Vater“ ist im genealogischen Kontext beizubehalten.
