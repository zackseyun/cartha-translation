source:
  edition: WLC
  text: וַ/יָּ֨מָת נָדָ֤ב וַ/אֲבִיהוּא֙ לִ/פְנֵ֣י אֲבִי/הֶ֔ם וּ/בָנִ֖ים לֹא הָי֣וּ לָ/הֶ֑ם וַֽ/יְכַהֲנ֔וּ אֶלְעָזָ֖ר וְ/אִיתָמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/002.yaml
  text: But Nadab and Abihu died before their father[a], and they had no sons; so Eleazar and Ithamar served as priests.
translation:
  language: de
  text: Doch Nadab und Abihu starben vor ihrem Vater[a] und hatten keine Söhne. Daher dienten Eleasar und Itamar als Priester.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Beisein ihres Vaters“. Der hebräische Ausdruck kann räumlich („vor, in Gegenwart von“) oder zeitlich („vor“, das heißt noch zu Lebzeiten ihres Vaters) verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּמָת
  choice: starben
  rationale: Das Wayyiqtol von מוּת berichtet ein vergangenes Ereignis; im Deutschen ist dafür das Präteritum natürlich. Das singularische Verb steht im Hebräischen vor einem zusammengesetzten Subjekt, während das Deutsche den Plural verlangt.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die knappe Wiedergabe bewahrt die mögliche zeitliche Bedeutung („noch zu Lebzeiten ihres Vaters“), ohne die ebenfalls mögliche räumliche Bedeutung auszuschließen; diese Mehrdeutigkeit wird in der Fußnote erläutert.
- source_word: אֲבִיהֶם
  choice: ihrem Vater
  rationale: Die Form bezeichnet eindeutig den Vater Nadabs und Abihus, also Aaron.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: und hatten keine Söhne
  rationale: בָּנִים bezeichnet hier ausdrücklich Söhne, nicht allgemein Kinder. Die deutsche Formulierung gibt die hebräische Existenzkonstruktion natürlich wieder.
- source_word: וַיְכַהֲנוּ
  choice: dienten als Priester
  rationale: Das Piel von כָּהַן bezeichnet die Ausübung des Priesterdienstes. Die verbale Wendung ist genauer als das statische „waren Priester“.
- source_word: אֶלְעָזָר וְאִיתָמָר
  choice: Eleasar und Itamar
  rationale: Die Namen folgen gebräuchlichen deutschen Bibelnamensformen.
theological_decisions:
- issue: Mehrdeutigkeit von לִפְנֵי אֲבִיהֶם
  choice: „vor ihrem Vater“ im Haupttext, mit Erläuterung in einer Fußnote
  alternative: „im Beisein ihres Vaters“ oder „noch zu Lebzeiten ihres Vaters“
  rationale: Der hebräische Ausdruck kann räumlich oder zeitlich verstanden werden. Der Haupttext bewahrt die Kürze und Mehrdeutigkeit des Originals, statt eine Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ stellt den Gegensatz zum vorausgehenden Vers her; „daher“ macht die im hebräischen Erzählzusammenhang liegende Folge natürlich verständlich. Die Satzteilung verbessert die Lesbarkeit, ohne den Inhalt zu verändern.
