source:
  edition: WLC
  text: וַ/יֶּֽחָלְקֵ֣/ם דָּוִ֔יד וְ/צָדוֹק֙ מִן בְּנֵ֣י אֶלְעָזָ֔ר וַ/אֲחִימֶ֖לֶךְ מִן בְּנֵ֣י אִיתָמָ֑ר לִ/פְקֻדָּתָ֖/ם בַּ/עֲבֹדָתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/003.yaml
  text: David[a], with Zadok from the sons of Eleazar and Ahimelech from the sons of Ithamar, divided them according to their appointment in their service.
translation:
  language: de
  text: David teilte sie zusammen mit Zadok, der zu den Söhnen Eleasars gehörte, und Ahimelech, der zu den Söhnen Itamars gehörte, nach ihren zugewiesenen Aufgaben in ihrem Dienst ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »David teilte sie für ihre zugewiesenen Dienstaufgaben ein.« Der hebräische Ausdruck verbindet die Vorstellungen von Beauftragung, Aufsicht und geordneter Zuweisung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: teilte sie … ein
  rationale: Die Wendung gibt das Grundverb »teilen« wieder und macht zugleich den Zusammenhang einer geordneten Einteilung in priesterliche Dienstgruppen verständlich.
- source_word: וְצָדוֹק
  choice: zusammen mit Zadok
  rationale: Das einfache »und« bezeichnet hier Zadoks Mitwirkung an Davids Einteilung; »zusammen mit« drückt dies in natürlichem Deutsch aus.
- source_word: מִן בְּנֵי אֶלְעָזָר
  choice: der zu den Söhnen Eleasars gehörte
  rationale: Die Formulierung kennzeichnet Zadok als Angehörigen der Linie Eleasars. Der Relativsatz vermeidet im Deutschen die mögliche Fehlauffassung, Zadok stamme unmittelbar von mehreren Söhnen ab.
- source_word: וַאֲחִימֶלֶךְ
  choice: und Ahimelech
  rationale: Der Eigenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: מִן בְּנֵי אִיתָמָר
  choice: der zu den Söhnen Itamars gehörte
  rationale: Parallel zur Angabe über Zadok wird Ahimelech als Angehöriger der Linie Itamars bezeichnet.
- source_word: לִפְקֻדָּתָם
  choice: nach ihren zugewiesenen Aufgaben
  rationale: פְּקֻדָּה kann Beauftragung, Amt, Aufsicht oder geordnete Zuweisung bezeichnen. Die Übersetzung hält den administrativen Sinn fest, ohne ihn auf eine einzige institutionelle Bedeutung zu verengen.
- source_word: בַּעֲבֹדָתָם
  choice: in ihrem Dienst
  rationale: עֲבֹדָה bezeichnet Arbeit beziehungsweise Dienst und meint hier den priesterlichen Dienst; »Dienst« ist sachgerecht und konfessionell neutral.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas kompakte Verwaltungsformulierung des Hebräischen wird durch Relativsätze und das trennbare Verb »einteilen« verständlich gemacht; die Bedeutungsbreite von לִפְקֻדָּתָם bleibt in der Fußnote erhalten.
