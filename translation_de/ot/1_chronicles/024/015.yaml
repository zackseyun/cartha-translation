  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְחֵזִיר
  choice: auf Hesir
  rationale: Das Präfix לְ kennzeichnet hier die Zuteilung des Loses. „Auf Hesir“ fügt sich natürlich in die deutsche Formulierung einer Losordnung; der Personenname wird nach geläufiger deutscher Bibeltradition als „Hesir“ wiedergegeben.
- source_word: שִׁבְעָה עָשָׂר
  choice: das siebzehnte
  rationale: In der fortlaufenden Liste bezeichnet die Kardinalzahl funktional die Ordnungszahl des Loses; das sächliche „das“ bezieht sich sinngemäß auf „Los“.
- source_word: לְהַפִּצֵּץ
  choice: auf Happizzez
  rationale: Auch hier kennzeichnet לְ die Zuteilung. Der Eigenname wird transliteriert; die Verdoppelung des anlautenden Konsonanten spiegelt den hebräischen Artikel wider, der mit dem Namen verbunden ist.
- source_word: שְׁמוֹנָה עָשָׂר
  choice: das achtzehnte
  rationale: Der Kontext der geordneten Lose verlangt eine ordinale Wiedergabe; „das“ nimmt das vorausgesetzte „Los“ auf.
theological_decisions: []
translation_notes:
  register: Knapp, würdig und listenartig. Die elliptische Struktur des Hebräischen bleibt erhalten; „Los“ wird nicht ergänzt, ist aber durch die sächlichen Ordinalzahlen sinngemäß präsent.
