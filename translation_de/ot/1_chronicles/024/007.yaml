  text: וַ/יֵּצֵ֞א הַ/גּוֹרָ֤ל הָ/רִאשׁוֹן֙ לִ/יה֣וֹיָרִ֔יב לִֽ/ידַעְיָ֖ה הַ/שֵּׁנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/007.yaml
  text: The first lot came out for Jehoiarib[a], the second for Jedaiah.
translation:
  language: de
  text: Das erste Los fiel auf Jojarib, das zweite auf Jedaja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: fiel
  rationale: Im Zusammenhang mit einer Losentscheidung ist »das Los fiel auf« die natürliche deutsche Wendung; sie gibt die kontextuelle Bedeutung von יצא wieder, dessen Grundbedeutung »hinausgehen/herauskommen« ist.
- source_word: הַגּוֹרָל
  choice: das Los
  rationale: גּוֹרָל bezeichnet hier das Los beziehungsweise die dadurch bestimmte Zuteilung. »Los« ist im Deutschen prägnant und im Zusammenhang der Einteilung der Priestergruppen eindeutig.
- source_word: הָרִאשׁוֹן
  choice: das erste
  rationale: Der bestimmte Ordinalausdruck bezeichnet die erste Stelle in der Reihenfolge und wird im Deutschen natürlich mit »das erste« wiedergegeben.
- source_word: לִיהוֹיָרִיב
  choice: auf Jojarib
  rationale: Die Präposition ל kennzeichnet den Empfänger der durch das Los bestimmten Zuteilung. Die deutsche Fügung »das Los fiel auf« verlangt hier »auf Jojarib«.
- source_word: לִידַעְיָה
  choice: auf Jedaja
  rationale: Auch hier bezeichnet ל den Empfänger der Zuteilung; das beim zweiten Glied ausgelassene Substantiv und Verb werden aus dem ersten ergänzt.
- source_word: הַשֵּׁנִי
  choice: das zweite
  rationale: Der bestimmte Ordinalausdruck setzt die Reihenfolge fort. Die knappe Ellipse »das zweite auf Jedaja« entspricht der kompakten hebräischen Form und ist im Deutschen klar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Losformel »fiel auf« vermeidet eine unnatürliche wörtliche Wiedergabe mit »kam heraus«, ohne den administrativen Charakter des Verses zu verwischen. Die Namensformen »Jojarib« und »Jedaja« folgen geläufiger deutscher Bibeltranskription.
