  language: de
  text: für Jachin das einundzwanzigste, für Gamul das zweiundzwanzigste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָכִין
  choice: für Jachin
  rationale: Die Präposition לְ kennzeichnet in dieser Aufzählung die Zuordnung des Loses beziehungsweise der Dienstabteilung. Der Personenname wird in der im Deutschen etablierten biblischen Form „Jachin“ wiedergegeben.
- source_word: אֶחָד וְ/עֶשְׂרִים
  choice: das einundzwanzigste
  rationale: Die formal kardinale Wendung „eins und zwanzig“ bezeichnet innerhalb der fortlaufenden Losliste idiomatisch die Ordnungszahl. Das substantivierte Neutrum bezieht sich auf das im Kontext vorausgesetzte Los.
- source_word: לְ/גָמוּל
  choice: für Gamul
  rationale: Wie in der ersten Satzhälfte markiert לְ die Zuordnung in der Reihenfolge der priesterlichen Dienstabteilungen. Der Eigenname wird als „Gamul“ transliteriert.
- source_word: שְׁנַיִם וְ/עֶשְׂרִים
  choice: das zweiundzwanzigste
  rationale: Die formal kardinale Wendung „zwei und zwanzig“ hat in dieser nummerierten Liste ordinalen Sinn. Das substantivierte Neutrum gibt die knappe hebräische Listenform natürlich wieder.
theological_decisions: []
translation_notes:
  register: Knappe, würdige Listenform in modernem Standarddeutsch. Der im vorhergehenden Kontext erkennbare Bezug auf das Los wird nicht eigens ergänzt, sondern durch die substantivierten Ordnungszahlen vorausgesetzt.
