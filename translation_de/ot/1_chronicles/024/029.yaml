lexical_decisions:
- source_word: לְקִישׁ
  choice: Zu Kisch
  rationale: Die Präposition לְ dient hier wahrscheinlich als Überschrift beziehungsweise Themenmarker innerhalb der Liste. „Zu Kisch“ bildet diese knappe Listenstruktur natürlich ab, ohne die syntaktische Funktion enger festzulegen.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: בְּנֵי ist der Status constructus im Plural von „Sohn“. Obwohl das Wort in genealogischen Zusammenhängen auch Nachkommen bezeichnen kann, wird hier unmittelbar nur Jerachmeël genannt; daher bleibt die konkrete Wiedergabe „Söhne“ erhalten.
- source_word: קִישׁ
  choice: Kisch
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: יְרַחְמְאֵל
  choice: Jerachmeël
  rationale: Der Personenname wird in einer deutschen Transliteration wiedergegeben; das Trema macht kenntlich, dass die Vokale getrennt gesprochen werden.
