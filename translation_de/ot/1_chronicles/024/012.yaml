translation:
  language: de
  text: Das elfte Los fiel auf Eljaschib, das zwölfte auf Jakim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/אֶלְיָשִׁיב
  choice: auf Eljaschib
  rationale: Das vorangestellte לְ kennzeichnet in dieser Liste die Zuweisung. Zusammen mit dem aus dem Kontext ergänzten »Los fiel« ist »auf Eljaschib« im Deutschen idiomatisch. Der Personenname wird als Eljaschib transkribiert.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: das elfte Los
  rationale: Die Kardinalzahl »elf« hat in der fortlaufenden Losliste ordinale Funktion. »Los« ist im unmittelbaren Kontext vorausgesetzt und wird zur natürlichen deutschen Wiedergabe ergänzt.
- source_word: לְ/יָקִים
  choice: auf Jakim
  rationale: Auch hier bezeichnet לְ die Zuweisung des Loses. »Jakim« gibt die masoretische Vokalisierung יָקִים angemessen wieder.
- source_word: שְׁנֵים עָשָׂר
  choice: das zwölfte
  rationale: Die Kardinalzahl »zwölf« fungiert in der Aufzählung als Ordinalzahl. »Los« ist aus der parallelen ersten Satzhälfte mitzudenken und muss nicht wiederholt werden.
theological_decisions: []
translation_notes:
  register: Knappes, modernes und würdiges Listendeutsch. Die elliptische hebräische Zuweisungsformel wird idiomatisch als »Das ... Los fiel auf ...« wiedergegeben; dabei wird »Los« aus dem Kontext ergänzt, ohne den Sinn der administrativen Aufzählung zu verändern.
