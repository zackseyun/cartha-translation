  language: de
  text: Das siebte Los fiel auf Hakkoz, das achte auf Abija.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַקּוֹץ
  choice: auf Hakkoz
  rationale: Die Präposition לְ kennzeichnet in dieser Los- und Ordnungsfolge die Zuweisung; im Deutschen gibt „das Los fiel auf“ den Zusammenhang natürlich und präzise wieder.
- source_word: הַשְּׁבִעִי
  choice: das siebte Los
  rationale: Die substantivierte Ordnungszahl bezeichnet im Kontext das siebte Los beziehungsweise die siebte Zuweisung; „Los“ wird zur Verständlichkeit aus dem vorangehenden Kontext ergänzt.
- source_word: לַאֲבִיָּה
  choice: auf Abija
  rationale: Wie beim ersten Namen bezeichnet לַ die Zuweisung in der Reihenfolge. „Abija“ ist die im Deutschen übliche Wiedergabe des Namens אֲבִיָּה.
- source_word: הַשְּׁמִינִי
  choice: das achte
  rationale: Die parallele Ordnungszahl bezeichnet das achte Los; das bereits genannte Substantiv kann im Deutschen natürlich ausgelassen werden.
theological_decisions: []
