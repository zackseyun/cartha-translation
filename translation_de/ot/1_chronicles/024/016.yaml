lexical_decisions:
- source_word: לִפְתַחְיָה
  choice: für Petachja
  rationale: Die Präposition ל bezeichnet in der Liste die Zuweisung des Loses beziehungsweise der Abteilung. Der Personenname wird in einer im Deutschen gut lesbaren, am Hebräischen orientierten Form wiedergegeben.
- source_word: תִּשְׁעָה עָשָׂר
  choice: das neunzehnte
  rationale: Die Kardinalzahl wird in dieser fortlaufenden Liste funktional ordinal gebraucht; das aus dem Zusammenhang erschließbare Los bleibt unausgesprochen.
- source_word: לִיחֶזְקֵאל
  choice: für Jecheskel
  rationale: Auch hier bezeichnet ל die Zuweisung. »Jecheskel« gibt die hebräische Namensform יְחֶזְקֵאל quellenah wieder, ohne sie stillschweigend an die im Deutschen vertrautere Form »Hesekiel« anzugleichen.
- source_word: הָעֶשְׂרִים
  choice: das zwanzigste
  rationale: Die Zahl mit Artikel bezeichnet in der Reihenfolge das zwanzigste Los beziehungsweise die zwanzigste Abteilung; die knappe Listenform des Hebräischen bleibt erhalten.
