  text: to Jeshua the ninth, to Shecaniah the tenth.
translation:
  language: de
  text: Für Jeschua das neunte Los, für Schechanja das zehnte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיֵשׁוּעַ
  choice: für Jeschua
  rationale: Die Präposition לְ kennzeichnet hier im Zusammenhang die Zuweisung des Loses beziehungsweise der Abteilung. „Für“ gibt diese Funktion im Deutschen natürlich wieder; der Personenname wird in einer geläufigen deutschen Form wiedergegeben.
- source_word: הַתְּשִׁעִי
  choice: das neunte
  rationale: Die bestimmte Ordnungszahl wird substantivisch gebraucht und bezieht sich auf das im Kontext genannte Los. Das Neutrum entspricht daher dem deutschen Wort „Los“.
- source_word: לִשְׁכַנְיָהוּ
  choice: für Schechanja
  rationale: Wie im ersten Satzglied bezeichnet לְ die Zuweisung. Die Kurzform „Schechanja“ ist eine natürliche deutsche Wiedergabe des hebräischen Personennamens שְׁכַנְיָהוּ.
- source_word: הָעֲשִׂרִי
  choice: das zehnte
  rationale: Die bestimmte Ordnungszahl bezeichnet das zehnte Los in der Reihenfolge; das Neutrum greift das im Kontext vorausgesetzte „Los“ auf.
theological_decisions: []
translation_notes:
  register: Knapp gehaltener Listenstil entsprechend dem Hebräischen. Die elliptische Form wird bewahrt; „Los“ wird nicht ergänzt, ist aber aus dem unmittelbaren Kontext erschließbar.
