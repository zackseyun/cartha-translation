base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/031.yaml
  text: These also cast lots alongside their brothers[a], the sons of Aaron, before King David, Zadok, Ahimelech[b], and the heads of the fathers’ houses of the priests and of the Levites—the chief fathers’ houses as well as those of their younger brothers.
translation:
  language: de
  text: Auch sie warfen Lose, ebenso wie ihre Brüder[a], die Söhne Aarons, in Gegenwart von König David, Zadok, Ahimelech und den Oberhäuptern der Vaterhäuser der Priester und Leviten. Dabei wurden die Vaterhäuser der führenden Familienzweige ebenso behandelt wie die ihrer jüngeren Brüder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »entsprechend ihren Brüdern, den Söhnen Aarons« beziehungsweise »ihren Brüdern … gegenüber«. Der hebräische Ausdruck kann eine Gegenüberstellung, Entsprechung oder parallele Zuordnung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »die Vaterhäuser des Führenden entsprechend seinem jüngeren Bruder«. Die Einzahlformen sind wahrscheinlich verallgemeinernd zu verstehen: Beim Losen wurden die führenden und die jüngeren Familienzweige gleichbehandelt.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיַּפִּילוּ ... גּוֹרָלוֹת
  choice: sie warfen Lose
  rationale: Die feste hebräische Wendung bezeichnet das Losen. »Lose werfen« ist im Deutschen verständlich und bildet das konkrete Idiom genauer ab als eine freie Umschreibung.
- source_word: גַּם הֵם
  choice: Auch sie
  rationale: Die Wendung verweist auf die zuvor genannten levitischen Gruppen und hebt hervor, dass auch sie am Losverfahren teilnahmen.
- source_word: לְעֻמַּת אֲחֵיהֶם בְּנֵי אַהֲרֹן
  choice: ebenso wie ihre Brüder, die Söhne Aarons
  rationale: לְעֻמַּת kann räumliche Gegenüberstellung, Entsprechung oder parallele Zuordnung ausdrücken. Im administrativen Zusammenhang gibt »ebenso wie« die Gleichordnung natürlich wieder, ohne eine bestimmte räumliche Anordnung festzulegen.
- source_word: לִפְנֵי
  choice: in Gegenwart von
  rationale: Hier bezeichnet die Präposition den öffentlichen, amtlich bezeugten Vollzug vor den genannten Personen.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: die Oberhäupter der Vaterhäuser
  rationale: Die Formulierung bezeichnet die Leiter der väterlichen Großfamilien beziehungsweise Sippen. »Vaterhäuser« bewahrt die soziale Gliederung des hebräischen Textes.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: der Priester und Leviten
  rationale: Der Genitiv gibt die Zugehörigkeit der genannten Vaterhäuser zu beiden Gruppen im Deutschen knapp und natürlich wieder.
- source_word: אָבוֹת הָרֹאשׁ לְעֻמַּת אָחִיו הַקָּטָן
  choice: Das Vaterhaus des Oberhaupts wurde dabei ebenso behandelt wie das seines jüngeren Bruders
  rationale: Der hebräische Schlusssatz ist stark verdichtet und verwendet Singularformen. Die Übersetzung versteht sie distributiv und macht die Gleichbehandlung ranghöherer und jüngerer Familienzweige beim Losen deutlich, ohne die syntaktische Schwierigkeit zu verschweigen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Vaterhäuser« bewahrt die historische Sozialstruktur; der zweite Satz löst die stark verdichtete hebräische Schlussformel behutsam auf. Die beiden echten Bedeutungsunsicherheiten werden in Fußnoten offengelegt.
