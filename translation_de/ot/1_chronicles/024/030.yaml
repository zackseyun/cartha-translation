  text: 'And the sons of Mushi: Mahli[a], Eder, and Jeremoth. These were the sons of the Levites according to their fathers'' houses.'
translation:
  language: de
  text: 'Und die Söhne Muschis: Machli, Eder und Jerimot. Das waren die Söhne der Leviten nach ihren Vaterhäusern.'
