lexical_decisions:
- source_word: וּבְנֵי מוּשִׁי
  choice: Und die Söhne Muschis
  rationale: Die Verbindung mit ו wird bewahrt; der deutsche Genitiv des Eigennamens gibt die genealogische Zuordnung natürlich wieder.
- source_word: מַחְלִי וְעֵדֶר וִירִימוֹת
  choice: Machli, Eder und Jerimot
  rationale: Die Eigennamen werden nach gängiger deutscher Bibeltradition und nahe am Hebräischen wiedergegeben; die hebräischen Bindewörter erscheinen in natürlicher deutscher Aufzählungsform.
- source_word: אֵלֶּה
  choice: Das waren
  rationale: Der pluralische Rückverweis wird im Deutschen idiomatisch mit dem zusammenfassenden Singular „Das“ formuliert; das Präteritum passt zum genealogischen Bericht.
- source_word: בְּנֵי הַלְוִיִּם
  choice: die Söhne der Leviten
  rationale: Die formale genealogische Wendung des Hebräischen bleibt erhalten, ohne sie deutend zu „Nachkommen“ umzuschreiben.
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: nach ihren Vaterhäusern
  rationale: „Vaterhäuser“ ist ein verständlicher, sachlich genauer genealogisch-administrativer Ausdruck; לְ bezeichnet hier die Zuordnung beziehungsweise Gliederung.
