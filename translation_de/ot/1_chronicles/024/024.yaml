lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Die Konstruktusform des Plurals von בן leitet hier eine genealogische Listenangabe ein. „Söhne“ gibt die knappe Form des Hebräischen unmittelbar wieder.
- source_word: עֻזִּיאֵל
  choice: Usiël
  rationale: Der Personenname wird in einer im Deutschen üblichen biblischen Form wiedergegeben; das Trema macht kenntlich, dass i und e getrennt gesprochen werden.
- source_word: מִיכָה
  choice: Micha
  rationale: Übliche deutsche Form des hebräischen Personennamens.
- source_word: לִ/בְנֵי
  choice: von den Söhnen
  rationale: Das vorangestellte ל verbindet innerhalb der Liste die nächste genealogische Angabe. „Von den Söhnen“ bewahrt diese Zuordnung in natürlichem Deutsch, ohne sie als vollständigen Satz auszudeuten.
- source_word: שמור
  choice: Schamur
  rationale: Die überlieferte Konsonantenfolge enthält ו und wird daher quellennah als „Schamur“ wiedergegeben. Die verbreitete Namensform „Schamir“ wird als Alternative in der Fußnote genannt.
