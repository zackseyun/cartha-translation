source:
  edition: WLC
  text: עַתָּ֗ה תְּנ֤וּ לְבַבְ/כֶם֙ וְ/נַפְשְׁ/כֶ֔ם לִ/דְר֖וֹשׁ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/ק֗וּמוּ וּ/בְנוּ֙ אֶת מִקְדַּשׁ֙ יְהוָ֣ה הָֽ/אֱלֹהִ֔ים לְ/הָבִ֞יא אֶת אֲר֣וֹן בְּרִית יְהוָ֗ה וּ/כְלֵי֙ קֹ֣דֶשׁ הָֽ/אֱלֹהִ֔ים לַ/בַּ֖יִת הַ/נִּבְנֶ֥ה לְ/שֵׁם יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/019.yaml
  text: Now set your heart and your soul to seek Yahweh your God[a]. Rise up and build the sanctuary of Yahweh God[b], to bring the ark of the covenant of Yahweh and the holy vessels of God into the house that is to be built for the name of Yahweh.
translation:
  language: de
  text: Nun richtet euer Herz und eure Seele darauf, Yahweh, euren Gott, zu suchen.[a] Macht euch auf und baut das Heiligtum Yahwehs, Gottes, um die Lade des Bundes Yahwehs und die heiligen Geräte Gottes in das Haus zu bringen, das für den Namen Yahwehs gebaut werden soll.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Gebt euer Herz und eure Seele hin, Yahweh, euren Gott, zu suchen.“'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Haus“ ist hier das Tempelgebäude gemeint, das für den Namen Yahwehs errichtet werden soll.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Nun
  rationale: Leitet als zeitlicher und zugleich folgernder Diskursmarker die dringliche Aufforderung natürlich ein.
- source_word: תְּנוּ לְבַבְכֶם וְנַפְשְׁכֶם
  choice: richtet euer Herz und eure Seele darauf
  rationale: Gibt die wörtliche Wendung „gebt euer Herz und eure Seele“ idiomatisch wieder und bewahrt beide hebräischen Begriffe sowie den Gedanken bewusster Entschlossenheit.
- source_word: לִדְרוֹשׁ
  choice: zu suchen
  rationale: דרשׁ bezeichnet hier die hingebungsvolle Hinwendung zu Gott; „suchen“ ist im Deutschen klar und textnah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen als Eigennamen wieder.
- source_word: וְקוּמוּ וּבְנוּ
  choice: Macht euch auf und baut
  rationale: „Macht euch auf“ bewahrt den auffordernden Sinn von קום in natürlichem, würdigem Deutsch; die Koordination beider Imperative bleibt erhalten.
- source_word: מִקְדַּשׁ
  choice: Heiligtum
  rationale: Bezeichnet den geheiligten Ort und unterscheidet ihn zugleich vom anschließend genannten „Haus“ als Tempelgebäude.
- source_word: יְהוָה הָאֱלֹהִים
  choice: Yahwehs, Gottes
  rationale: Die formal schwierige Verbindung wird eng am Hebräischen belassen, ohne sie stillschweigend zu einer anderen Aussage umzuformen.
- source_word: לְהָבִיא
  choice: damit … gebracht werden
  rationale: Drückt den Zweck des Tempelbaus idiomatisch aus; das deutsche Passiv fügt keinen ausdrücklich genannten menschlichen Handelnden hinzu.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Yahwehs
  rationale: Bewahrt die Genitivkette und die etablierte Bezeichnung der Bundeslade verständlich.
- source_word: וּכְלֵי קֹדֶשׁ הָאֱלֹהִים
  choice: die heiligen Geräte Gottes
  rationale: כְּלֵי bezeichnet die für den Gottesdienst bestimmten Geräte beziehungsweise Gefäße; „Geräte“ ist umfassend und sachgerecht.
- source_word: לַבַּיִת הַנִּבְנֶה לְשֵׁם יְהוָה
  choice: in das Haus …, das für den Namen Yahwehs gebaut werden soll
  rationale: „Haus“ wahrt das konkrete Tempelbild; die modale Partizipialform wird im Kontext des geplanten Baus mit „gebaut werden soll“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet das Tetragramm als Gottes Eigennamen; „Yahweh“ macht diesen Namen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Anthropologische Paarformel לְבַבְכֶם וְנַפְשְׁכֶם
  choice: Herz und Seele ausdrücklich beibehalten
  alternative: euer ganzes Inneres; euren ganzen Sinn
  rationale: Die beiden Ausdrücke verstärken gemeinsam die Forderung ungeteilter Hingabe. Ihre Beibehaltung vermeidet eine dogmatische Festlegung auf eine technische Zweiteilung des Menschen.
- issue: Konstruktion יְהוָה הָאֱלֹהִים
  choice: Yahwehs, Gottes
  alternative: Yahwehs, des Gottes; Yahwehs, des wahren Gottes; Yahwehs Gottes
  rationale: Die ungewöhnliche hebräische Verbindung lässt mehrere syntaktische Nuancierungen zu. Die gewählte knappe Apposition bewahrt diese Spannung, ohne „wahr“ oder einen bestimmten Artikel einzutragen.
- issue: „für den Namen Yahwehs“
  choice: Die Namensformel wörtlich bewahren
  alternative: zu Ehren Yahwehs; als Wohnstätte Yahwehs
  rationale: Die Formulierung trägt eine eigene Tempeltheologie und sollte weder auf bloße Ehrung verengt noch als unmittelbare räumliche Einwohnung ausgedeutet werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Aufforderungston. „Macht euch auf“ vermeidet sowohl das altertümliche „Erhebt euch“ als auch das umgangssprachliche „Steht auf“. Die Wiederholungen von „Yahweh“ und „Gott“ werden entsprechend dem hebräischen Text nicht geglättet.
