source:
  edition: WLC
  text: וְ/עִמְּ/ךָ֤ לָ/רֹב֙ עֹשֵׂ֣י מְלָאכָ֔ה חֹצְבִ֕ים וְ/חָרָשֵׁ֥י אֶ֖בֶן וָ/עֵ֑ץ וְ/כָל חָכָ֖ם בְּ/כָל מְלָאכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/015.yaml
  text: 'And with you in abundance are workers for the task: stonecutters[a], and craftsmen of stone and wood, and every skilled man for every kind of work.'
translation:
  language: de
  text: 'Und bei dir sind Arbeiter für das Werk in großer Zahl: Steinhauer, Handwerker für Stein und Holz und jeder Fachkundige[a] für jede Art von Arbeit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen die maskuline Einzahl: „jeder Fachkundige“. Sie wird hier repräsentativ für fachkundige Arbeitskräfte gebraucht.'
    reason: Hinweis auf die grammatische Form und ihren repräsentativen Gebrauch.
lexical_decisions:
- source_word: וְעִמְּךָ
  choice: Und bei dir sind
  rationale: Die Wendung bewahrt die direkte Anrede und gibt die im Hebräischen nominal formulierte Aussage im Deutschen natürlich wieder.
- source_word: לָרֹב
  choice: in großer Zahl
  rationale: Die Formulierung bezeichnet eine reichlich vorhandene Menge und klingt im Zusammenhang mit Arbeitern idiomatisch.
- source_word: עֹשֵׂי מְלָאכָה
  choice: Arbeiter für das Werk
  rationale: Die Verbindung bezeichnet diejenigen, die die anstehende Arbeit ausführen; „das Werk“ verweist im Kontext auf den Tempelbau.
- source_word: חֹצְבִים
  choice: Steinhauer
  rationale: Im Baukontext sind damit Arbeiter gemeint, die Steine brechen oder behauen; „Steinhauer“ ist präzise und verständlich.
- source_word: וְחָרָשֵׁי אֶבֶן וָעֵץ
  choice: Handwerker für Stein und Holz
  rationale: חָרָשׁ bezeichnet einen ausgebildeten oder geschickten Handwerker; die beiden Werkstoffe werden ausdrücklich beibehalten.
- source_word: וְכָל חָכָם בְּכָל מְלָאכָה
  choice: und jeder Fachkundige für jede Art von Arbeit
  rationale: חָכָם bezeichnet hier praktische Befähigung und handwerkliches Können, nicht vorrangig Weisheit. „Jede Art von Arbeit“ gibt den umfassenden Sinn der wiederholten כל-Konstruktion natürlich wieder.
theological_decisions:
- issue: Generisches Maskulinum bei וְכָל חָכָם
  choice: jeder Fachkundige
  alternative: jede fachkundige Person / jeder geschickte Mann
  rationale: Das Hebräische steht grammatisch im maskulinen Singular und bezeichnet repräsentativ einen Angehörigen der fachkundigen Arbeiterschaft. Das substantivierte deutsche Maskulinum hält diese Form erkennbar fest, ohne ausdrücklich „Mann“ hinzuzufügen, da אִישׁ nicht im Text steht; die Fußnote macht die grammatische und repräsentative Verwendung transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der hebräischen Aufzählung, wird jedoch durch die idiomatische Verbfügung „bei dir sind“ flüssig gestaltet. Fachbegriffe bleiben allgemein verständlich.
