source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר דָּוִ֖יד לִ/שְׁלֹמֹ֑ה בנ/ו אֲנִי֙ הָיָ֣ה עִם לְבָבִ֔/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֖ם יְהוָ֥ה אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/007.yaml
  text: And David said to Solomon his son[a], “As for me[b], it was in my heart to build a house for the name of Yahweh my God.”
translation:
  language: de
  text: 'Und David sagte zu seinem Sohn Salomo: »Was mich betrifft: Es lag mir am Herzen, ein Haus für den Namen Yahwehs, meines Gottes, zu bauen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und ... sagte
  rationale: Das Waw mit der Erzählform führt die Handlung weiter; »Und« bewahrt den hebräischen Erzählfluss, ohne die Verknüpfung stärker auszudeuten.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: zu seinem Sohn Salomo
  rationale: Diese Wortstellung ist im modernen Deutschen natürlich und gibt sowohl die Verwandtschaftsbezeichnung als auch den Eigennamen eindeutig wieder.
- source_word: אֲנִי
  choice: Was mich betrifft
  rationale: Das ausdrücklich gesetzte Personalpronomen ist hervorgehoben; die Wendung bildet diesen Nachdruck idiomatisch ab.
- source_word: הָיָה עִם לְבָבִי
  choice: Ich hatte im Herzen
  rationale: Die hebräische Wendung bezeichnet eine innere Absicht oder einen Entschluss. Die Übersetzung bewahrt das Bild des Herzens und klingt zugleich verständlich.
- source_word: לִבְנוֹת בַּיִת
  choice: ein Haus ... zu bauen
  rationale: בַּיִת bedeutet wörtlich »Haus«. Im Zusammenhang ist der Tempel gemeint, doch »Haus« bewahrt die charakteristische Ausdrucksweise des Ausgangstextes.
- source_word: לְשֵׁם
  choice: für den Namen
  rationale: Die Formulierung bewahrt den theologischen Bezug auf Yahwehs Namen und reduziert ihn nicht auf eine bloße Widmung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהָי
  choice: meines Gottes
  rationale: Das Suffix der ersten Person Singular wird ausdrücklich bewahrt; der Genitiv schließt sich im Deutschen natürlich an »Yahwehs« an.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. »Yahweh« bewahrt ihn als Eigennamen, statt ihn durch einen traditionellen Ersatztitel wiederzugeben.
- issue: Wiedergabe von בַּיִת
  choice: Haus
  alternative: Tempel
  rationale: Obwohl sachlich der Tempel gemeint ist, lautet das hebräische Wort »Haus«. Diese Wiedergabe bewahrt die theologische Ausdrucksweise »ein Haus für den Namen Yahwehs«.
- issue: Deutung von הָיָה עִם לְבָבִי
  choice: Ich hatte im Herzen
  alternative: Mein Herz war darauf gerichtet
  rationale: Die gewählte Fassung lässt offen, ob der Schwerpunkt stärker auf Absicht, Wunsch oder festem Entschluss liegt, und bewahrt zugleich das hebräische Herzbild.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist natürlich, während die zentralen hebräischen Bilder »im Herzen«, »Haus« und »für den Namen« erhalten bleiben. Keine Fußnoten sind nötig, da die Alternativen im Deutschen den Haupttext nicht zur Klärung zwingend ergänzen.
