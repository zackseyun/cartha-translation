  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen Aussagen des Hebräischen zutreffend wieder: Salomos Jugend und Unreife, das für Jahwe zu errichtende Haus, dessen außergewöhnliche Größe sowie Davids Vorbereitung vor seinem Tod. Bei לְהַגְדִּיל לְמַעְלָה sollte jedoch der Vorgang des Großmachens bzw. Bauens deutlicher erhalten bleiben; „muss ... groß sein“ beschreibt primär einen Zustand. Die Zweckbestimmung לְשֵׁם וּלְתִפְאֶרֶת לְכָל הָאֲרָצוֹת wird mit einer deutschen Zweckkonstruktion genauer und natürlicher wiedergegeben.'
