  text: וַ/יֹּ֣אמֶר דָּוִ֗יד שְׁלֹמֹ֣ה בְנִ/י֮ נַ֣עַר וָ/רָךְ֒ וְ/הַ/בַּ֜יִת לִ/בְנ֣וֹת לַ/יהוָ֗ה לְ/הַגְדִּ֨יל לְ/מַ֜עְלָ/ה לְ/שֵׁ֤ם וּ/לְ/תִפְאֶ֨רֶת֙ לְ/כָל הָ֣/אֲרָצ֔וֹת אָכִ֥ינָה נָּ֖א ל֑/וֹ וַ/יָּ֧כֶן דָּוִ֛יד לָ/רֹ֖ב לִ/פְנֵ֥י מוֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/005.yaml
  text: And David said[a], “My son Solomon is young and inexperienced, and the house to be built for Yahweh must be made exceedingly great in fame and splendor in all lands[c][b]. I will now make preparation for it.” So David made abundant preparations before his death.
translation:
  language: de
  text: 'David sagte: »Mein Sohn Salomo ist jung und unerfahren[a]. Das Haus[b], das für Jahwe gebaut werden soll, muss überaus groß gebaut werden, damit es in allen Ländern zu Ruhm und Pracht gereicht[c]. Ich will nun Vorbereitungen dafür treffen[d].« So traf David vor seinem Tod umfangreiche Vorbereitungen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »jung und zart«. Das mit »unerfahren« wiedergegebene hebräische Wort kann Weichheit oder Zartheit bezeichnen und weist hier wahrscheinlich auf Salomos mangelnde Reife oder Erfahrung hin.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist der Tempel. Hebräisch: »das Haus«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher auch: »zu einem Namen und zu einer Pracht für alle Länder«; gemeint sind der weithin bekannte Ruhm und die sichtbare Herrlichkeit des Hauses.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »Vorbereitungen für ihn treffen«, also für Salomo. Das hebräische Pronomen kann sich auf das Haus beziehungsweise Bauvorhaben oder auf Salomo beziehen.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: נַעַר וָרָךְ
  choice: jung und unerfahren
  rationale: נַעַר bezeichnet hier Salomos relative Jugend; רַךְ bedeutet wörtlich »zart/weich«, weist im Zusammenhang aber auf mangelnde Reife und Erfahrung hin.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Die konkrete Wiedergabe »Haus« bewahrt die Bildsprache des Hebräischen; aus dem Zusammenhang ist klar, dass Jahwes Heiligtum beziehungsweise der Tempel gemeint ist.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Der im Ausgangstext ausdrücklich stehende Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: לְהַגְדִּיל לְמַעְלָה
  choice: muss überaus groß sein
  rationale: Die Verbindung drückt eine außergewöhnliche Größe beziehungsweise Erhabenheit aus. Die deutsche Formulierung gibt diesen verstärkenden Sinn natürlich wieder.
- source_word: לְשֵׁם וּלְתִפְאֶרֶת
  choice: berühmt und prächtig
  rationale: שֵׁם bezeichnet hier den weithin bekannten Namen oder Ruhm, תִּפְאֶרֶת die Pracht beziehungsweise Herrlichkeit. Die adjektivische Wiedergabe ist im Deutschen verständlich und erhält beide Aspekte.
- source_word: לְכָל הָאֲרָצוֹת
  choice: in allen Ländern
  rationale: Der Plural bezeichnet die Länder beziehungsweise Völkergebiete, unter denen das Bauwerk bekannt und bewundert sein soll.
- source_word: אָכִינָה נָּא לוֹ
  choice: Ich will nun Vorbereitungen dafür treffen
  rationale: Der Kohortativ bringt Davids Entschluss zum Ausdruck. Das Suffix kann sich grammatisch auf das Haus beziehungsweise Bauvorhaben oder auf Salomo beziehen; im Haupttext wird der Projektbezug gewählt und die Alternative in einer Fußnote bewahrt.
- source_word: לָרֹב
  choice: Vorbereitungen in großer Menge
  rationale: Die adverbiale Wendung bezeichnet die außerordentliche Menge dessen, was David bereitstellte.
- source_word: לִפְנֵי מוֹתוֹ
  choice: vor seinem Tod
  rationale: Direkte und idiomatische Wiedergabe der zeitlichen Angabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. »Jahwe« gibt ihn als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: הַבַּיִת als »Haus« oder »Tempel«
  choice: Haus
  alternative: Tempel
  rationale: »Haus« entspricht unmittelbar dem hebräischen Wortlaut und bewahrt dessen theologische Bildsprache; »Tempel« wird als erklärende Alternative genannt.
- issue: Bezug des Suffixes in לוֹ
  choice: dafür, das heißt für das Haus beziehungsweise Bauvorhaben
  alternative: für ihn, das heißt für Salomo
  rationale: Beide Bezugswörter sind grammatisch möglich. Der Zusammenhang mit den Bauvorbereitungen legt den Projektbezug nahe, doch die personenbezogene Deutung wird nicht ausgeschlossen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählstruktur. »Haus« hält sich eng an den Ausgangstext, während Fußnoten ungewohnte wörtliche Lesarten und echte Mehrdeutigkeiten transparent machen. Die Formulierung »Vorbereitungen in großer Menge« bewahrt den quantitativen Nachdruck des Schlusses.
