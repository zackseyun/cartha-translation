  - severity: low
    issue: „Berühmt und prächtig in allen Ländern“ bildet die hebräische Zweckbestimmung stilistisch etwas unglücklich ab.
    rationale: לְשֵׁם וּלְתִפְאֶרֶת ist auf Ruhm und Pracht als beabsichtigte Wirkung ausgerichtet. „Damit es in allen Ländern zu Ruhm und Pracht gereicht“ erhält diese Funktion und klingt idiomatisch.
  - severity: low
