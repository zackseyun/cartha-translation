  terminology: „Jahwe“, „Haus“ und „Salomo“ sind angemessen. Die Fußnoten bewahren die lexikalische Nuance von רַךְ, erläutern „Haus“ als Tempel und halten die mögliche Referenz von לוֹ offen, ohne eine konfessionelle Deutung vorzuschreiben.
