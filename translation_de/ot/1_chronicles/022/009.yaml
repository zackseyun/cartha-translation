source:
  edition: WLC
  text: הִנֵּה בֵ֞ן נוֹלָ֣ד לָ֗/ךְ ה֤וּא יִהְיֶה֙ אִ֣ישׁ מְנוּחָ֔ה וַ/הֲנִח֥וֹתִי ל֛/וֹ מִ/כָּל אוֹיְבָ֖י/ו מִ/סָּבִ֑יב כִּ֤י שְׁלֹמֹה֙ יִהְיֶ֣ה שְׁמ֔/וֹ וְ/שָׁל֥וֹם וָ/שֶׁ֛קֶט אֶתֵּ֥ן עַל יִשְׂרָאֵ֖ל בְּ/יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/009.yaml
  text: Behold[a], a son will be born to you. He will be a man of rest, and I will give him rest from all his enemies all around; for Solomon will be his name[b], and I will give peace and quiet to Israel in his days.
translation:
  language: de
  text: Sieh, dir wird ein Sohn geboren. Er wird ein Mann der Ruhe sein, und ich werde ihm Ruhe vor allen seinen Feinden ringsum verschaffen. Denn sein Name wird Salomo sein[a], und ich werde Israel in seinen Tagen Frieden und Ruhe schenken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name »Salomo« klingt im Hebräischen an das Wort für »Frieden« (schalom) an; zugleich wird er hier als ein »Mann der Ruhe« bezeichnet.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt die aufmerksamkeitslenkende Funktion des hebräischen Ausdrucks in einer heutigen, dennoch würdigen Form.
- source_word: בֵן נוֹלָד לָךְ
  choice: dir wird ein Sohn geboren werden
  rationale: Die passive Form wird im Zusammenhang der göttlichen Ankündigung zukunftsbezogen wiedergegeben; der Dativ bezeichnet den Sohn als David geboren.
- source_word: אִישׁ מְנוּחָה
  choice: ein Mann der Ruhe
  rationale: Die bewusst etwas formale Wendung erhält das Leitwort »Ruhe« und seine Verbindung mit dem folgenden Verb, ohne מְנוּחָה vorzeitig als »Frieden« wiederzugeben.
- source_word: וַהֲנִחוֹתִי לוֹ
  choice: ich werde ihm Ruhe … verschaffen
  rationale: Erhält die Wiederholung des Wortstamms נוח und drückt zugleich verständlich aus, dass Gott sichere Ruhe gewährt.
- source_word: מִכָּל אוֹיְבָיו מִסָּבִיב
  choice: vor allen seinen Feinden ringsum
  rationale: Gibt sowohl die Gesamtheit der Feinde als auch die Vorstellung der Bedrohung von allen Seiten wieder.
- source_word: שְׁלֹמֹה יִהְיֶה שְׁמוֹ
  choice: sein Name wird Salomo sein
  rationale: Folgt dem Aussagesinn des Hebräischen natürlich und lässt durch die unmittelbar folgende Erwähnung von Frieden die Namensanknüpfung hervortreten.
- source_word: וְשָׁלוֹם וָשֶׁקֶט
  choice: Frieden und ungestörte Sicherheit
  rationale: »Frieden« bewahrt die Verbindung von שָׁלוֹם mit dem Namen Salomo; »ungestörte Sicherheit« unterscheidet שֶׁקֶט von der zuvor genannten Ruhe und bezeichnet ruhige, unbehelligte Verhältnisse.
- source_word: אֶתֵּן עַל יִשְׂרָאֵל
  choice: werde Israel … schenken
  rationale: Natürliches Deutsch für das Gewähren von Frieden und Sicherheit über beziehungsweise für Israel.
theological_decisions:
- issue: Verbindung von Ruhe, dem Namen Salomo und Frieden
  choice: Die unterschiedlichen hebräischen Begriffe werden als »Ruhe«, »Salomo« und »Frieden« unterscheidbar wiedergegeben und ihre Verbindung wird in einer Fußnote erläutert.
  alternative: אִישׁ מְנוּחָה als »Mann des Friedens« wiedergeben, um die thematische Verbindung zu glätten.
  rationale: Der Vers verbindet Ruhe und Frieden, verwendet dafür aber verschiedene Wörter. Die Übersetzung bewahrt sowohl die Unterscheidung als auch das beabsichtigte Wort- und Themenfeld, ohne es konfessionell auszudeuten.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Ankündigungston. »Sieh« vermeidet das altertümlichere »Siehe«; »Mann der Ruhe« bleibt bewusst nah an der markanten hebräischen Formulierung. Die fehlerhaft zugeordnete englische Fußnote nach »Behold« wurde nicht übernommen; die sachlich einschlägige Namensnotiz steht am Namen Salomo.
