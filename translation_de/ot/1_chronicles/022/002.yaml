  verdict: revise
  source_fidelity: 'Die Wiedergabe folgt dem hebräischen Text insgesamt zuverlässig: Davids Anordnung, die ansässigen Nichtisraeliten, die Einsetzung von Steinbearbeitern, die zugerichteten Steine und „das Haus Gottes“ sind erhalten. „zusammenzurufen“ ist als Veranlassung einer Versammlung vertretbar.'
  naturalness: Der zweite Satz ist in der vorliegenden Form stilistisch missglückt, weil Steinmetze „behauene Steine ... zurechthauen“ sollen; dies wirkt unnötig tautologisch. Eine Infinitivkonstruktion mit „behauene Steine ... zu hauen“ ist klarer und idiomatischer. Die Tempel-Fußnote sollte zudem ein vollständiger deutscher Satz sein.
  terminology: „Fremde“ ist im Haupttext als knappe Wiedergabe von גֵּרִים vertretbar, sofern die Fußnote die Bedeutung als dauerhaft ansässige Nichtisraeliten erklärt. „Haus Gottes“ bewahrt bewusst die hebräische Bezeichnung und sollte nicht im Haupttext durch „Tempel“ ersetzt werden. Die bisherigen Fußnotenalternativen „Schutzbürger“ und „Quadersteine“ sind unnötig spezifisch bzw. potenziell irreführend.
  issues:
  - severity: medium
    issue: Tautologische und unnatürliche Formulierung bei der Steinbearbeitung
    rationale: „Steinmetze ... die behauene Steine zurechthauen sollten“ lässt bereits behauene Steine nochmals zurechthauen. Der hebräische Ausdruck bezeichnet das Behauen bzw. Zurichten von Bau-Steinen; die deutsche Syntax sollte dies ohne Doppelung ausdrücken.
  - severity: low
    issue: Fußnote a enthält ungeeignete soziale bzw. rechtliche Ersatzbegriffe
    rationale: „Schutzbürger“ ist für den antiken hebräischen Sozialbegriff anachronistisch und zu eng; „Beisassen“ ist historisierend. „Ansässige Fremde“ erklärt גֵּרִים präziser und verständlicher.
  - severity: low
    issue: Fußnote c ist elliptisch formuliert
    rationale: '„Das heißt: des Tempels“ ist kein vollständiger, idiomatischer Satz. „Gemeint ist der Tempel“ erläutert den Referenten klar, ohne die hebräische Haupttextformulierung zu ersetzen.'
  revised_text: Und David befahl, die Fremden, die im Land Israel lebten, zusammenzurufen.[a] Er setzte Steinmetze ein, um behauene Steine[b] für den Bau des Hauses Gottes[c] zu hauen.
