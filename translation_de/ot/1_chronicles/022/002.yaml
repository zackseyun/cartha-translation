  text: וַ/יֹּ֣אמֶר דָּוִ֔יד לִ/כְנוֹס֙ אֶת הַ/גֵּרִ֔ים אֲשֶׁ֖ר בְּ/אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יַּעֲמֵ֣ד חֹֽצְבִ֗ים לַ/חְצוֹב֙ אַבְנֵ֣י גָזִ֔ית לִ/בְנ֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/002.yaml
  text: And David ordered the foreigners who were in the land of Israel to be gathered[c][b][a], and he appointed stonecutters to cut dressed stones for building the house of God.
translation:
  language: de
  text: Und David befahl, die Fremden, die im Land Israel lebten, zusammenzurufen.[a] Er setzte Steinmetze ein, um behauene Steine[b] für den Bau des Hauses Gottes[c] zu hauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „ansässige Fremde“. Gemeint sind Nichtisraeliten, die im Land lebten.
    reason: lexical_alternative
  - marker: b
    text: Auch „zugeschnittene Steine“ oder „Werksteine“.
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist der Tempel.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: befahl
  rationale: Das Verb bedeutet wörtlich „sagte“, hat hier aber zusammen mit dem Infinitiv die Funktion einer Anordnung. „Befahl“ gibt diese Kraft im Deutschen natürlich wieder.
- source_word: לִכְנוֹס
  choice: zusammenzurufen
  rationale: Der Infinitiv bezeichnet den Inhalt von Davids Anordnung. Die Formulierung macht deutlich, dass David die Sammlung veranlasste, ohne zu behaupten, er habe sie persönlich durchgeführt.
- source_word: הַגֵּרִים
  choice: die Fremden
  rationale: גֵּרִים bezeichnet nichtisraelitische Menschen, die als ansässige Fremde im Land lebten. „Fremde“ ist gegenwärtig und verständlich; die genauere soziale Bedeutung wird in der Fußnote erläutert.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: im Land Israel
  rationale: „Land“ gibt אֶרֶץ ausdrücklich wieder und bewahrt den territorialen Akzent des hebräischen Textes.
- source_word: וַיַּעֲמֵד
  choice: setzte … ein
  rationale: Das Verb bezeichnet hier die Zuweisung von Arbeitern zu einer bestimmten Aufgabe. „Einsetzen“ klingt im Deutschen natürlich und gibt den administrativen Vorgang wieder.
- source_word: חֹצְבִים
  choice: Steinmetze
  rationale: Das Partizip bezeichnet Arbeiter, die Steine brechen oder behauen. „Steinmetze“ ist eine geläufige und kontextgerechte Berufsbezeichnung.
- source_word: לַחְצוֹב
  choice: zurechthauen
  rationale: Der Infinitiv stammt aus derselben Wurzel wie חֹצְבִים und beschreibt die Bearbeitung der Bausteine. „Zurechthauen“ bringt den Zweck der Bearbeitung idiomatisch zum Ausdruck.
- source_word: אַבְנֵי גָזִית
  choice: behauene Steine
  rationale: Die Wendung bezeichnet für den Bau zugeschnittene beziehungsweise bearbeitete Steine. „Behauene Steine“ ist präzise und bewahrt die konkrete Bildlichkeit.
- source_word: לִבְנוֹת
  choice: für den Bau
  rationale: Die Zweckangabe wird in flüssigem Deutsch substantivisch wiedergegeben, ohne ihren Sinn zu verändern.
- source_word: בֵּית הָאֱלֹהִים
  choice: das Haus Gottes
  rationale: Dies entspricht der hebräischen Formulierung unmittelbar und vermeidet es, den gemeinten Tempel bereits im Haupttext interpretierend zu benennen.
theological_decisions:
- issue: Wiedergabe von בֵּית הָאֱלֹהִים
  choice: das Haus Gottes
  alternative: der Tempel Gottes
  rationale: Gemeint ist das künftige Tempelgebäude, doch der hebräische Text sagt wörtlich „Haus Gottes“. Diese Formulierung bleibt im Haupttext erhalten; der Bezug wird in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gegenüber dem Hebräischen leicht geglättet, während die Anordnung Davids, die soziale Bezeichnung der Fremden und die wörtliche Wendung „Haus Gottes“ erhalten bleiben.
