revisions:
- from: Und David befahl, die Fremden, die im Land Israel lebten, zusammenzurufen.[a] Er setzte Steinmetze ein, die behauene Steine[b] für den Bau des Hauses Gottes[c] zurechthauen sollten.
  to: Und David befahl, die Fremden, die im Land Israel lebten, zusammenzurufen.[a] Er setzte Steinmetze ein, um behauene Steine[b] für den Bau des Hauses Gottes[c] zu hauen.
  rationale: Die Revision glättet allein die unnatürliche Doppelung bei „behauene Steine ... zurechthauen“ und präzisiert die Fußnoten. Die Aussageebene, die Verwaltungsanordnung Davids, die soziale Bezeichnung גֵּרִים sowie die wörtliche Wendung „Haus Gottes“ bleiben unverändert erhalten.
