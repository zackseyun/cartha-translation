revisions:
- from: 'Doch das Wort Jahwes erging an mich: »Du hast viel Blut vergossen und große Kriege geführt. Du sollst meinem Namen kein Haus bauen[a], denn du hast vor mir viel Blut zur Erde hin vergossen[b].«'
  to: 'Da erging das Wort Jahwes an mich: »Du hast viel Blut vergossen und große Kriege geführt. Du sollst kein Haus für meinen Namen bauen[a], denn du hast vor mir viel Blut auf die Erde vergossen[b].«'
  rationale: Die Revision entfernt die unbegründete adversative Nuance von „Doch“, ersetzt die unnatürliche Richtungsumschreibung durch idiomatisches Deutsch und strafft die Fußnote, ohne die hebräische Bildsprache, die Wiederholung oder den Tempelbezug im Haupttext zu verändern.
