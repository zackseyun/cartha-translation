review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die zentralen Elemente zuverlässig wieder: die prophetische Formel, das wiederholte Blutvergießen, die großen Kriege, das „Haus für meinen Namen“ und die Aussage, dass dies vor Jahwe geschah. Das adversative „Doch“ ist im hebräischen וַיְהִי jedoch nicht begründet; eine einleitende, nicht adversative Wiedergabe ist vorzuziehen. „Zur Erde hin vergossen“ bildet zwar die Richtungsnuance von אַרְצָה ab, ist im Deutschen aber unidiomatisch.'
  naturalness: „Da erging das Wort Jahwes an mich“ ist modernes, würdiges Standarddeutsch und wahrt den formelhaften Charakter. „Viel Blut auf die Erde vergossen“ ist deutlich natürlicher als „zur Erde hin vergossen“ und gibt die mit dem Verb „Blut vergießen“ verbundene Richtung angemessen wieder.
  terminology: „Jahwe“, „Haus“ und „meinen Namen“ sind sachgerecht. „Haus“ sollte nicht im Haupttext zu „Tempel“ interpretiert werden; die erklärende Fußnote kann den Tempelbezug nennen. „Du sollst“ ist als göttliche Anordnung beziehungsweise Festlegung vertretbar.
  issues:
  - severity: medium
    issue: „Doch“ am Versanfang
    rationale: Das einleitende וַיְהִי ist eine erzählende/formelhafte Einleitung („und/da/es geschah“) und trägt hier keinen erkennbaren Gegensatz. „Doch“ fügt eine adversative Beziehung hinzu, die der hebräische Wortlaut nicht markiert.
  - severity: low
    issue: „zur Erde hin vergossen“
    rationale: Die Formulierung ist im heutigen Standarddeutsch unnötig sperrig. „auf die Erde vergossen“ bewahrt die Richtung von אַרְצָה und passt zur üblichen Verbindung „Blut vergießen“.
  - severity: low
    issue: Fußnote a bezeichnet die Formulierung als wörtlich, obwohl sie bereits im Haupttext steht
    rationale: Wenn der Haupttext „ein Haus für meinen Namen“ enthält, sollte die Fußnote nur den kulturell-sachlichen Tempelbezug erläutern.
