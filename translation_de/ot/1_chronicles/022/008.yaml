  text: וַ/יְהִ֨י עָלַ֤/י דְּבַר יְהוָה֙ לֵ/אמֹ֔ר דָּ֤ם לָ/רֹב֙ שָׁפַ֔כְתָּ וּ/מִלְחָמ֥וֹת גְּדֹל֖וֹת עָשִׂ֑יתָ לֹֽא תִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י כִּ֚י דָּמִ֣ים רַבִּ֔ים שָׁפַ֥כְתָּ אַ֖רְצָ/ה לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/008.yaml
  text: But the word of Yahweh came to me[a], saying, ‘You have shed much blood and fought great wars. You shall not build a house for my name[d][c][b], because you have shed much blood on the earth before me.’
translation:
  language: de
  text: 'Da erging das Wort Jahwes an mich: »Du hast viel Blut vergossen und große Kriege geführt. Du sollst kein Haus für meinen Namen bauen[a], denn du hast vor mir viel Blut auf die Erde vergossen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: den Tempel.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „zu Boden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עָלַי דְּבַר יְהוָה
  choice: Doch das Wort Jahwes erging an mich
  rationale: Die im Deutschen geläufige Wendung „das Wort ... erging an“ gibt die Formel natürlich und zugleich würdevoll wieder. Das einleitende וַ wird im Zusammenhang adversativ als „Doch“ verstanden.
- source_word: דָּם לָרֹב שָׁפַכְתָּ
  choice: Du hast viel Blut vergossen
  rationale: Die konkrete Bildsprache von „Blut“ und „vergießen“ bleibt erhalten; לָרֹב bezeichnet die große Menge.
- source_word: וּמִלְחָמוֹת גְּדֹלוֹת עָשִׂיתָ
  choice: und große Kriege geführt
  rationale: „Kriege führen“ ist die natürliche deutsche Entsprechung für das wörtlichere „große Kriege machen/tun“.
- source_word: לֹא תִבְנֶה בַיִת לִשְׁמִי
  choice: Du sollst meinem Namen kein Haus bauen
  rationale: „Haus“ bewahrt das hebräische Tempel-Haus-Motiv, und „meinem Namen“ erhält die theologisch bedeutsame Formulierung, ohne sie zu „für mich“ zu vereinfachen.
- source_word: כִּי דָּמִים רַבִּים שָׁפַכְתָּ אַרְצָה לְפָנָי
  choice: denn du hast vor mir viel Blut zur Erde hin vergossen
  rationale: „Denn“ führt die Begründung ein. Die ungewöhnliche Richtungsform אַרְצָה wird mit „zur Erde hin“ sichtbar gehalten; לְפָנַי wird knapp mit „vor mir“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen ausdrücklich stehende Bundesname erkennbar bleibt.
- issue: Bedeutung von בַיִת im Tempelkontext
  choice: Haus
  alternative: Tempel
  rationale: Obwohl sachlich der Tempel gemeint ist, bewahrt „Haus“ die Ausdrucksweise und Motivik des Ausgangstextes.
- issue: Modalität von לֹא תִבְנֶה
  choice: Du sollst ... kein Haus bauen
  alternative: Du wirst ... kein Haus bauen
  rationale: Die Form kann als Verbot beziehungsweise göttliche Festlegung verstanden werden. „Du sollst nicht“ gibt hier die untersagende Kraft wieder, ohne die Aussage auf eine bloße Zukunftsprognose zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „viel Blut vergossen“ wird wie im Hebräischen beibehalten. Die leicht markierte Formulierung „zur Erde hin“ bewahrt die Richtungsnuance von אַרְצָה; eine Fußnote nennt natürlichere Alternativen.
