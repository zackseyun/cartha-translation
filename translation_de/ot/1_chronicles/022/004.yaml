  text: וַ/עֲצֵ֥י אֲרָזִ֖ים לְ/אֵ֣ין מִסְפָּ֑ר כִּֽי הֵ֠בִיאוּ הַ/צִּֽידֹנִ֨ים וְ/הַ/צֹּרִ֜ים עֲצֵ֧י אֲרָזִ֛ים לָ/רֹ֖ב לְ/דָוִֽיד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/004.yaml
  text: and cedar timbers without number[a], for the Sidonians and Tyrians had brought cedar timbers in abundance to David.
translation:
  language: de
  text: und Zedernholz in unzählbarer Menge[a]; denn die Sidonier und die Tyrer hatten David Zedernholz in großer Menge gebracht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zedernbalken“. Das hebräische Wort kann allgemein Zedernholz bezeichnen; im Zusammenhang mit dem Tempelbau sind wahrscheinlich Bauhölzer gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲצֵי אֲרָזִים
  choice: und Zedernholz
  rationale: עֲצֵי ist der Konstruktplural von עֵץ („Baum, Holz“) mit אֲרָזִים („Zedern“). Im Zusammenhang mit Baumaterial bezeichnet „Zedernholz“ natürlich und präzise das bereitgestellte Material, ohne ausdrücklich einen bestimmten Bearbeitungsgrad vorauszusetzen.
- source_word: לְ/אֵין מִסְפָּר
  choice: in unzählbarer Menge
  rationale: Die Wendung bezeichnet eine Menge, die sich nicht zählen lässt. Die deutsche Formulierung wahrt die Aussagekraft des hebräischen Idioms und passt syntaktisch zu „Zedernholz“.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die zuvor genannte große Menge ein. „Denn“ stellt diesen erklärenden Zusammenhang in einem würdigen Erzählstil klar her.
- source_word: הֵבִיאוּ
  choice: hatten … gebracht
  rationale: Das Hifil Perfekt bezeichnet das Herbeibringen. Das deutsche Plusquamperfekt macht deutlich, dass diese Lieferungen den zuvor beschriebenen Vorrat erklären.
- source_word: הַ/צִּידֹנִים
  choice: die Sidonier
  rationale: Das gentilizische Substantiv bezeichnet die Einwohner von Sidon; „Sidonier“ ist die etablierte und knappe deutsche Bezeichnung.
- source_word: וְ/הַ/צֹּרִים
  choice: und die Tyrer
  rationale: Das gentilizische Substantiv bezeichnet die Einwohner von Tyrus; „Tyrer“ ist die übliche deutsche Bezeichnung.
- source_word: לָ/רֹב
  choice: in großer Menge
  rationale: Die Wendung drückt eine große Quantität aus. „In großer Menge“ ist im Deutschen natürlich und erhält den mengenbezogenen Sinn.
- source_word: לְ/דָוִד
  choice: David
  rationale: Die Präposition לְ kennzeichnet hier David als Empfänger. Beim deutschen Verb „bringen“ wird der Empfänger idiomatisch im Dativ ohne Präposition ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als Satzfortsetzung mit „und“ eröffnet. „Zedernholz“ bewahrt die lexikalische Breite des Hebräischen; die wahrscheinlich konkretere Bedeutung als Bauholz wird in der Fußnote genannt.
