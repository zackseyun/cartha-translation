  text: אָ֣ז תַּצְלִ֔יחַ אִם תִּשְׁמ֗וֹר לַ/עֲשׂוֹת֙ אֶת הַֽ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה עַל יִשְׂרָאֵ֑ל חֲזַ֣ק וֶ/אֱמָ֔ץ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/013.yaml
  text: Then you will prosper[a], if you are careful to do the statutes and the judgments that Yahweh commanded Moses for Israel. Be strong and courageous. Do not fear[b], and do not be dismayed.
translation:
  language: de
  text: Dann wirst du Erfolg haben[a], wenn du darauf achtest, die Ordnungen und die Rechtsbestimmungen zu befolgen, die Jahwe Mose für Israel geboten hat. Sei stark und mutig! Fürchte dich nicht und verliere nicht den Mut!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann wird es dir gelingen.“ Das hebräische Verb kann sowohl Erfolg als auch gutes Gelingen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Kennzeichnet die Folge der zuvor ausgesprochenen Aufforderung und ist im Deutschen der natürliche Anschluss.
- source_word: תַּצְלִיחַ
  choice: wirst du Erfolg haben
  rationale: Das Hifil von צלח kann Gelingen oder Erfolg bezeichnen. Diese Wiedergabe vermeidet eine vorschnelle Einengung auf materiellen Wohlstand.
- source_word: אִם תִּשְׁמוֹר לַעֲשׂוֹת
  choice: wenn du darauf achtest, … zu befolgen
  rationale: Die Verbindung von ‚bewahren/achten‘ mit dem Infinitiv ‚tun‘ bezeichnet sorgfältige und tätige Befolgung.
- source_word: הַחֻקִּים
  choice: die Ordnungen
  rationale: Gibt den festgesetzten Charakter der חֻקִּים wieder und hält den Begriff von מִשְׁפָּטִים unterscheidbar.
- source_word: הַמִּשְׁפָּטִים
  choice: die Rechtsbestimmungen
  rationale: Bewahrt die rechtliche beziehungsweise richterliche Nuance und unterscheidet den Ausdruck von ‚Ordnungen‘.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה עַל יִשְׂרָאֵל
  choice: die Jahwe Mose für Israel geboten hat
  rationale: Die Konstruktion stellt Mose als den von Jahwe Beauftragten dar; עַל bezeichnet hier am ehesten den Bezug beziehungsweise die Bestimmung für Israel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: חֲזַק וֶאֱמָץ
  choice: Sei stark und mutig!
  rationale: Natürliche und würdige Wiedergabe der feststehenden hebräischen Ermutigungsformel.
- source_word: אַל תִּירָא
  choice: Fürchte dich nicht
  rationale: Direkte, geläufige Wiedergabe des Verbots.
- source_word: וְאַל תֵּחָת
  choice: und verliere nicht den Mut
  rationale: Das Verb bezeichnet hier ein inneres Zusammenbrechen, Verzagen oder Entmutigtwerden; die Formulierung ist im modernen Deutsch klar und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen ausdrücklich. ‚Jahwe‘ bewahrt diesen Charakter, statt ihn durch einen Titel zu ersetzen.
- issue: Art des verheißenen Gelingens
  choice: Erfolg haben
  alternative: Wohlergehen haben
  rationale: צלח kann Erfolg beziehungsweise Gelingen ausdrücken. ‚Erfolg haben‘ lässt den Zusammenhang mit gehorsamem Handeln erkennen, ohne materiellen Wohlstand als alleinigen Sinn festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die beiden hebräischen Rechtsbegriffe werden durch getrennte deutsche Ausdrücke wiedergegeben. Die abschließenden Aufforderungen stehen als eindringliche Imperative.
