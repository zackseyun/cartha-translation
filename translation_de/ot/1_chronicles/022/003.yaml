base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/003.yaml
  text: And David prepared iron in abundance for the nails for the doors of the gates and for the fastenings[b][a], and bronze in abundance without weight.
translation:
  language: de
  text: 'Und David stellte Eisen in großer Menge bereit: Nägel für die Torflügel und Verbindungsteile[a]; dazu Bronze in so großer Menge, dass sie nicht zu wiegen war[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Scharniere“. Das hebräische Wort bezeichnet allgemein Teile, die etwas verbinden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ohne Gewicht“; gemeint ist offenbar eine so große Menge, dass sie nicht zu wiegen war.'
    reason: idiom_clarification
lexical_decisions:
- source_word: בַרְזֶל
  choice: Eisen
  rationale: Die direkte und im Zusammenhang mit Baumaterial eindeutige Entsprechung.
- source_word: לָרֹב
  choice: in großer Menge
  rationale: Gibt die große Materialmenge natürlich und sachlich wieder.
- source_word: מִּסְמְרִים
  choice: Nägel
  rationale: Bezeichnet im Bauzusammenhang am natürlichsten die metallenen Nägel; „Bolzen“ wäre stärker spezifiziert.
- source_word: דַלְתוֹת הַשְּׁעָרִים
  choice: Torflügel
  rationale: Die Wendung meint die beweglichen Tür- beziehungsweise Flügelteile der Tore; „Torflügel“ ist präzise und idiomatisch.
- source_word: מְחַבְּרוֹת
  choice: Verbindungsteile
  rationale: Bewahrt den breiten Sinn von Teilen, die etwas verbinden, ohne sie vorschnell als Scharniere zu bestimmen.
- source_word: הֵכִין
  choice: stellte … bereit
  rationale: Im Kontext sammelte und beschaffte David Baumaterial; die Formulierung gibt dieses Bereitmachen natürlich wieder.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Im Kontext antiker Bau- und Metallarbeiten ist Bronze die übliche sachgerechte Wiedergabe; grundsätzlich kann das Wort auch Kupfer bezeichnen.
- source_word: אֵין מִשְׁקָל
  choice: in so großer Menge, dass man sie nicht wog
  rationale: Gibt den hebräischen Ausdruck verständlich als Hinweis auf eine nicht mehr gewogene, überaus große Menge wieder, ohne tatsächliche Gewichtslosigkeit nahezulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird jedoch durch „dazu“ und die idiomatische Wiedergabe des Schlusses flüssig und eindeutig. Die mögliche Bedeutung „Scharniere“ wird nicht in den Haupttext eingeengt.
