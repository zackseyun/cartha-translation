  text: אַ֣ךְ יִֽתֶּן לְּ/ךָ֤ יְהוָה֙ שֵׂ֣כֶל וּ/בִינָ֔ה וִֽ/יצַוְּ/ךָ֖ עַל יִשְׂרָאֵ֑ל וְ/לִ/שְׁמ֕וֹר אֶת תּוֹרַ֖ת יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/012.yaml
  text: Only[a], may Yahweh give you insight and understanding, and command you concerning Israel[b], that you may keep the law of Yahweh your God.
translation:
  language: de
  text: Nur möge Jahwe dir Einsicht und Verständnis geben und dich über Israel einsetzen[a], damit du das Gesetz[b] Jahwes, deines Gottes, hältst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dir in Bezug auf Israel gebieten“ beziehungsweise „dir Israel anvertrauen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Weisung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Vor allem
  rationale: Die fokussierende Partikel hebt Davids vorrangigen Wunsch hervor. „Vor allem“ gibt diese Funktion im Deutschen natürlicher wieder als das missverständliche „nur“.
- source_word: יִתֶּן
  choice: möge … geben
  rationale: Der Imperfekt hat hier im Zusammenhang eines Segenswunsches optativischen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben.
- source_word: שֵׂכֶל וּבִינָה
  choice: Einsicht und Verständnis
  rationale: Die beiden verwandten, aber unterscheidbaren Begriffe für praktische Klugheit und Urteilsvermögen bleiben als Wortpaar erhalten.
- source_word: וִיצַוְּךָ עַל יִשְׂרָאֵל
  choice: dich über Israel einsetzen
  rationale: צוה mit עַל und einem Volk kann im königlichen Zusammenhang die Beauftragung beziehungsweise Einsetzung über dieses Volk bezeichnen. Die wörtlichere Befehlsbedeutung bleibt in einer Fußnote sichtbar.
- source_word: וְלִשְׁמוֹר
  choice: damit du … hältst
  rationale: Die Verbindung mit dem Infinitiv bezeichnet hier zweckhaft das Halten der Tora.
- source_word: תּוֹרַת
  choice: das Gesetz
  rationale: „Gesetz“ ist im bundesbezogenen Zusammenhang verständlich und traditionell geläufig; der weitere Sinn „Weisung“ wird in einer Fußnote genannt.
- source_word: אֱלֹהֶיךָ
  choice: deines Gottes
  rationale: Die Form bezeichnet Gott mit dem Possessivsuffix der zweiten Person Singular und bezieht sich auf den angesprochenen Salomo.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst; die Umschrift bewahrt seinen Charakter als Eigenname.
- issue: Sinn von וִיצַוְּךָ עַל יִשְׂרָאֵל
  choice: dich über Israel einsetzen
  alternative: dir in Bezug auf Israel gebieten
  rationale: Im königlichen Kontext ist eine Beauftragung über Israel plausibel. Da die gewöhnliche Bedeutung des Verbs „gebieten“ lautet, wird diese echte Mehrdeutigkeit nicht verschwiegen, sondern in der Fußnote bewahrt.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Gesetz
  alternative: Weisung
  rationale: „Gesetz“ passt zum Halten der göttlichen Tora, während „Weisung“ deren umfassenderen unterweisenden Charakter betont; die Alternative wird in der Fußnote angegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Segenswunsch wird flüssig formuliert; zugleich bleiben die Mehrdeutigkeit der königlichen Beauftragung und der Bedeutungsumfang von Tora durch Fußnoten erhalten.
