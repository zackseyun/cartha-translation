source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔יד זֶ֣ה ה֔וּא בֵּ֖ית יְהוָ֣ה הָ/אֱלֹהִ֑ים וְ/זֶה מִּזְבֵּ֥חַ לְ/עֹלָ֖ה לְ/יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/001.yaml
  text: Then David said[a], “This is the house of Yahweh God[b], and this is the altar for burnt offering for Israel.”
translation:
  language: de
  text: 'Da sagte David: „Dies ist das Haus Jahwes, des Gottes, und dies ist der Brandopferaltar für Israel.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; „Da sagte“ gibt die zeitliche Folge im modernen Deutschen natürlich wieder.
- source_word: דָּוִיד
  choice: David
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: זֶה הוּא
  choice: Dies ist
  rationale: Die Verbindung aus Demonstrativpronomen und selbstständigem Pronomen bezeichnet den Ort nachdrücklich und unmittelbar, ohne den Zusatz „der Ort“ einzutragen.
- source_word: בֵּית
  choice: das Haus
  rationale: Die wörtliche Bedeutung „Haus“ bleibt erhalten; „Tempel“ wäre im Kontext sachlich möglich, aber stärker auslegend.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הָאֱלֹהִים
  choice: Gottes
  rationale: Der Ausdruck steht näher bestimmend beim Gottesnamen. „Jahwes, Gottes“ bewahrt beide hebräischen Elemente, auch wenn die Verbindung im Deutschen ungewohnt klingt.
- source_word: מִּזְבֵּחַ
  choice: Brandopferaltar
  rationale: Das deutsche Kompositum gibt natürlich einen Altar wieder, der für Brandopfer bestimmt ist.
- source_word: לְעֹלָה
  choice: Brandopfer-
  rationale: Der hebräische Singular kann generisch verstanden werden; im Kompositum bleibt die Zahl unbestimmt.
- source_word: לְיִשְׂרָאֵל
  choice: für Israel
  rationale: Die knappe Wiedergabe bewahrt die im Präfix לְ ausgedrückte Zuordnung beziehungsweise Bestimmung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Transliteration wahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בֵּית als Haus oder Tempel
  choice: Haus
  alternative: Tempel
  rationale: Obwohl der zukünftige Tempel gemeint ist, steht im Hebräischen „Haus“. Die gewählte Form bewahrt Wortlaut und theologische Bildsprache.
- issue: Verhältnis von יְהוָה und הָאֱלֹהִים
  choice: Jahwes, Gottes
  alternative: Jahwes, des Gottes / Jahwes Gottes
  rationale: Die knappe Apposition des Hebräischen bleibt sichtbar, ohne durch „des Gottes“ eine im Deutschen leicht missverständliche Abgrenzung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Formulierung „das Haus Jahwes, Gottes“ folgt bewusst der ungewöhnlichen hebräischen Verbindung des Eigennamens mit הָאֱלֹהִים. „Brandopferaltar“ ist idiomatisch und erhält den generischen Sinn des hebräischen Singulars.
