  terminology: „Jahwe“, „Haus“ und „Brandopferaltar“ sind sachgerecht. „des Gottes“ bewahrt den bestimmten Artikel des hebräischen הָאֱלֹהִים, ohne „Tempel“ oder eine zusätzliche Deutung einzutragen.
