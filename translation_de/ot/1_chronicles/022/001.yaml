  source_fidelity: 'Der Entwurf gibt die Satzfolge und die wesentlichen Elemente des Hebräischen zutreffend wieder: die emphatische Identifikation („Dies ist“), „Haus“, den Gottesnamen Jahwe sowie den Altar in seiner Bestimmung für Israel. „Brandopferaltar“ gibt לְעֹלָה sinnvoll mit generischem Singular wieder.'
