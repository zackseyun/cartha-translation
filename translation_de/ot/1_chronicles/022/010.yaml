  text: הֽוּא יִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י וְ/הוּא֙ יִהְיֶה לִּ֣/י לְ/בֵ֔ן וַ/אֲנִי ל֖/וֹ לְ/אָ֑ב וַ/הֲכִ֨ינוֹתִ֜י כִּסֵּ֧א מַלְכוּת֛/וֹ עַל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/010.yaml
  text: He will build a house for my name[a], and he will be a son to me, and I will be a father to him, and I will establish the throne of his kingdom over Israel forever.
translation:
  language: de
  text: Er wird ein Haus für meinen Namen bauen[a]. Er wird mir Sohn sein, und ich werde ihm Vater sein. Ich werde den Thron seiner Königsherrschaft über Israel für immer festigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Tempel für meinen Namen«. Wörtlich steht im Hebräischen: »ein Haus für meinen Namen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַיִת
  choice: Haus
  rationale: Die Grundbedeutung ist »Haus«. Im Zusammenhang ist der Tempel gemeint; »meinem Namen ein Haus« bewahrt jedoch den hebräischen Ausdruck.
- source_word: לִשְׁמִי
  choice: meinem Namen
  rationale: Die knappe Zweck- bzw. Widmungsformulierung bewahrt die biblische Rede vom Namen Gottes, ohne sie als Ehre oder Gegenwart auszudeuten.
- source_word: לְבֵן
  choice: mir Sohn sein
  rationale: Die prädikative Verhältnisformel wird im Deutschen ohne unbestimmten Artikel würdig und prägnant wiedergegeben.
- source_word: לְאָב
  choice: ihm Vater sein
  rationale: Die Formulierung erhält den Parallelismus und die unmittelbare Vater-Sohn-Bundesformel.
- source_word: וַהֲכִינוֹתִי
  choice: ich werde … festigen
  rationale: Der Hifil von כון bezeichnet das Festmachen bzw. dauerhafte Sichern; »festigen« gibt dies im Zusammenhang einer bereits vorausgesetzten Königsherrschaft treffend wieder.
- source_word: כִּסֵּא מַלְכוּתוֹ
  choice: den Thron seiner Königsherrschaft
  rationale: Diese Wiedergabe erhält sowohl das Bild des Thrones als auch den abstrakten Aspekt von מלכות, ohne beides zu »Königsthron« zusammenzuziehen.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: עַל bezeichnet hier den Herrschaftsbereich.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die geläufige deutsche Wendung gibt die unbefristete Dauer der Verheißung wieder, ohne ihre kanonische Tragweite im Haupttext auszulegen.
theological_decisions:
- issue: Vater-Sohn-Bundesformel mit unmittelbarem Bezug auf Salomo und weiterreichender Bedeutung für die davidische Verheißung
  choice: »Er wird mir Sohn sein, und ich werde ihm Vater sein.«
  alternative: »Ich werde ihn wie einen Sohn behandeln« oder eine ausdrücklich messianische Ausdeutung
  rationale: Der hebräische Text benennt die Beziehung unmittelbar. Die formale Wiedergabe bewahrt sowohl den Bezug im Erzählzusammenhang als auch die weiterreichende theologische Spannung, ohne sie abzuschwächen oder aufzulösen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit bewusst bewahrter biblischer Namens- und Bundesformel. Der Satzbau bleibt klar und gut vorlesbar; unnötige Archaismen werden vermieden.
