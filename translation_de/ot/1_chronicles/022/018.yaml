id: 1CH.22.18
reference: 1 Chronicles 22:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲ/לֹ֨א יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ עִמָּ/כֶ֔ם וְ/הֵנִ֥יחַ לָ/כֶ֖ם מִ/סָּבִ֑יב כִּ֣י נָתַ֣ן בְּ/יָדִ֗/י אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נִכְבְּשָׁ֥ה הָ/אָ֛רֶץ לִ/פְנֵ֥י יְהוָ֖ה וְ/לִ/פְנֵ֥י עַמּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/018.yaml
  text: Is not Yahweh your God with you? And has he not given you rest on every side? For he has given the inhabitants of the land into my hand[a], and the land has been subdued before Yahweh and before his people.
translation:
  language: de
  text: Ist nicht Jahwe, euer Gott, mit euch? Und hat er euch nicht ringsum Ruhe verschafft? Denn er hat die Bewohner des Landes in meine Hand gegeben, und das Land ist vor Jahwe und vor seinem Volk[a] unterworfen worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Seinem Volk“ bezieht sich wahrscheinlich auf Jahwe; möglich ist auch der Bezug auf David. „Vor seinem Volk“ kann außerdem im Sinn von „vor den Augen seines Volkes“ verstanden werden.
    reason: Die hebräische Pronominalform lässt den Bezug grammatisch offen, und לִפְנֵי kann sowohl räumlich beziehungsweise relational „vor“ als auch „vor den Augen von“ bedeuten.
lexical_decisions:
- source_word: הֲלֹא
  choice: Ist nicht …? / hat … nicht …?
  rationale: Die Partikel leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet. Im Deutschen wird sie wegen der zwei Prädikate natürlich wiederholt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: In Verbindung mit Jahwe bezeichnet die formal plurale Form den einen Gott Israels.
- source_word: עִמָּכֶם
  choice: mit euch
  rationale: Die Wendung bezeichnet hier Gottes Gegenwart und Beistand.
- source_word: וְהֵנִיחַ לָכֶם מִסָּבִיב
  choice: Und hat er euch nicht ringsum Ruhe verschafft?
  rationale: הניח bezeichnet gewährte Ruhe beziehungsweise Entlastung von den Feinden; „ringsum“ gibt מִסָּבִיב knapp und idiomatisch wieder.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt die Begründung für die vorausgehende rhetorische Frage ein.
- source_word: נָתַן בְּיָדִי
  choice: er hat … in meine Hand gegeben
  rationale: Die hebräische Macht- und Übergabeformel bleibt bildhaft erhalten und ist im Deutschen verständlich.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: die Bewohner des Landes
  rationale: Dies ist eine natürliche Wiedergabe der substantivisch gebrauchten Partizipialform.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: und das Land ist … unterworfen worden
  rationale: Der Nifal bezeichnet das Unterworfenwerden des Landes; das deutsche Perfekt stellt das abgeschlossene Geschehen mit fortbestehendem Ergebnis dar.
- source_word: לִפְנֵי יְהוָה וְלִפְנֵי עַמּוֹ
  choice: vor Jahwe und vor seinem Volk
  rationale: „Vor“ bewahrt die parallele Struktur beider Präpositionalgruppen und lässt deren Bedeutungsweite bestehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen; „Jahwe“ gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug des Suffixes in עַמּוֹ („sein Volk“)
  choice: Das Pronomen wird im Text unverändert als „sein“ wiedergegeben; wahrscheinlich bezieht es sich auf Jahwe.
  alternative: Das Pronomen kann auf David bezogen werden.
  rationale: Die Verbindung „vor Jahwe und vor seinem Volk“ legt Jahwe als Bezug nahe. Da die Form selbst jedoch auch einen Bezug auf David zulässt, wird diese Mehrdeutigkeit in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und die hebräische Bildrede „in meine Hand“ bleiben erhalten; unnötig altertümliche Formulierungen werden vermieden.
