  text: עַתָּ֣ה בְנִ֔/י יְהִ֥י יְהוָ֖ה עִמָּ֑/ךְ וְ/הִצְלַחְתָּ֗ וּ/בָנִ֨יתָ֙ בֵּ֚ית יְהוָ֣ה אֱלֹהֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר עָלֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/011.yaml
  text: Now[a], my son, may Yahweh be with you, and may you prosper and build the house of Yahweh your God[c][b], as he has spoken concerning you.
translation:
  language: de
  text: Nun, mein Sohn, sei Jahwe mit dir, und mögest du Erfolg haben und das Haus Jahwes, deines Gottes, bauen, wie er über dich gesprochen hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie er es über dich gesagt hat“; dem Sinn nach auch: „wie er es im Blick auf dich verheißen hat“.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: Nun
  rationale: Leitet Davids Segenswunsch und Ermahnung als natürlicher deutscher Diskursmarker ein.
- source_word: בְנִי
  choice: mein Sohn
  rationale: Bewahrt die direkte, väterliche Anrede.
- source_word: יְהִי יְהוָה עִמָּךְ
  choice: sei Jahwe mit dir
  rationale: Der Jussiv drückt einen Wunsch oder Segen aus; diese deutsche Wunschform gibt ihn knapp und würdig wieder.
- source_word: וְהִצְלַחְתָּ
  choice: und mögest du Erfolg haben
  rationale: Das Hifil von צלח kann Erfolg haben oder Gelingen bedeuten. Die Wunschform führt den Segenscharakter fort, ohne materiellen Wohlstand zu unterstellen.
- source_word: וּבָנִיתָ בֵּית יְהוָה אֱלֹהֶיךָ
  choice: und das Haus Jahwes, deines Gottes, bauen
  rationale: „Haus“ bewahrt die konkrete hebräische Ausdrucksweise und ihre theologische Resonanz; „Tempel“ wäre eine verständliche, aber stärker deutende Wiedergabe.
- source_word: כַּאֲשֶׁר דִּבֶּר עָלֶיךָ
  choice: wie er über dich gesprochen hat
  rationale: Bewahrt die offene Bedeutung von דבר על, ohne Gottes Wort ausdrücklich als Verheißung festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben statt durch einen Titel ersetzt.
- issue: Aussagekraft der Verbfolge
  choice: 'Segenswunsch: „sei … und mögest du … bauen“'
  alternative: 'Vorhersage: „wird … und du wirst … bauen“'
  rationale: Das einleitende יְהִי ist jussivisch und spricht für einen Segenswunsch. Die folgenden Verben werden diesem Zusammenhang entsprechend modal wiedergegeben, ohne sie als bloße Zukunftsaussage festzulegen.
- issue: Gottes vorheriges Reden über Salomo
  choice: „wie er über dich gesprochen hat“
  alternative: „wie er es dir verheißen hat“
  rationale: Der Kontext kann eine Verheißung nahelegen, doch der hebräische Wortlaut sagt allgemeiner, dass Jahwe über Salomo gesprochen hat.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Segensklang. Die wörtliche Metapher „Haus Jahwes“ bleibt erhalten; die Satzstellung vermeidet unnötig altertümliche Formen.
