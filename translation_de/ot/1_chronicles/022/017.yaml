base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/017.yaml
  text: Then David commanded all the leaders of Israel to help Solomon his son.
translation:
  language: de
  text: Dann befahl David allen führenden Männern Israels, seinem Sohn Salomo zu helfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Dann befahl
  rationale: Das Wayyiqtol von צוה führt die Erzählung weiter und bezeichnet eine verbindliche Anweisung. „Dann“ gibt die Erzählfolge natürlich wieder, „befahl“ bewahrt den autoritativen Sinn.
- source_word: שָׂרֵי
  choice: führenden Männern
  rationale: שָׂרִים bezeichnet maßgebliche Amtsträger oder Führungspersonen. Im historischen Kontext ist die maskuline Personenbezeichnung sachlich passend; die Wendung ist im modernen Deutsch verständlicher als „Fürsten“ und weniger eng als „Beamte“.
- source_word: לְכָל שָׂרֵי יִשְׂרָאֵל
  choice: allen führenden Männern Israels
  rationale: Die Wiedergabe wahrt sowohl die umfassende Aussage von כָל als auch die Zugehörigkeitsbeziehung zu Israel, ohne bestimmte Ämter vorauszusetzen.
- source_word: לַעְזֹר
  choice: zu helfen
  rationale: Der Infinitiv von עזר bedeutet „helfen, beistehen“. „Zu helfen“ ist direkt, natürlich und semantisch genau.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: seinem Sohn Salomo
  rationale: Die deutsche Wortstellung benennt sowohl Salomo als Empfänger der Hilfe als auch seine Beziehung zu David klar und idiomatisch.
