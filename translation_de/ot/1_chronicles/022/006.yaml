  text: וַ/יִּקְרָ֖א לִ/שְׁלֹמֹ֣ה בְנ֑/וֹ וַ/יְצַוֵּ֨/הוּ֙ לִ/בְנ֣וֹת בַּ֔יִת לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/006.yaml
  text: Then he called for Solomon his son and commanded him to build a house for Yahweh[a], the God of Israel.
translation:
  language: de
  text: Dann rief David seinen Sohn Salomo zu sich und befahl ihm, ein Haus für Jahwe[a], den Gott Israels, zu bauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den HERRN“. Statt „ein Haus für Jahwe“ kann sinngemäß auch „einen Tempel für den HERRN“ übersetzt werden. Wörtlich steht im Hebräischen „ein Haus für Jahwe“.'
    reason: Alternative Wiedergabe des Gottesnamens und kontextuelle Bedeutung von בַּיִת.
lexical_decisions:
- source_word: וַיִּקְרָא לִשְׁלֹמֹה
  choice: Dann rief David … Salomo zu sich
  rationale: Das Narrativ-Waw führt die Handlung weiter. קרא mit ל bei einer Person bedeutet hier, jemanden zu rufen bzw. zu sich zu bestellen. Das im Hebräischen nur implizite Subjekt wird zur natürlichen und eindeutigen deutschen Wiedergabe als „David“ aus dem Kontext aufgenommen.
- source_word: בְנוֹ
  choice: seinen Sohn
  rationale: Die Verbindung mit Possessivsuffix bezeichnet Salomo als Davids Sohn; die deutsche Wortstellung „seinen Sohn Salomo“ ist natürlich und präzise.
- source_word: וַיְצַוֵּהוּ
  choice: und befahl ihm
  rationale: צוה bezeichnet einen verbindlichen Auftrag oder Befehl. „befahl ihm“ bewahrt die autoritative Kraft des Ausdrucks.
- source_word: לִבְנוֹת
  choice: zu bauen
  rationale: Der Infinitiv von בנה gibt nach צוה den Inhalt des Befehls an.
- source_word: בַּיִת
  choice: ein Haus
  rationale: בית bedeutet wörtlich „Haus“. Im Kontext ist der Tempel gemeint; die wörtliche Bildsprache bleibt im Haupttext erhalten, während die kontextuelle Alternative in der Fußnote steht.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל bezeichnet hier den Empfänger bzw. denjenigen, dem das Gebäude geweiht ist. „für“ ist im Deutschen idiomatisch.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Die Status-constructus-Verbindung identifiziert Jahwe als den Gott Israels; die Apposition steht im Deutschen im Akkusativ.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt den offenbarten Gottesnamen als Namen wieder; die traditionelle Ersatzlesung „der HERR“ bleibt als Alternative in der Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wörtliche Bezeichnung „Haus“ bleibt erhalten; „Tempel“ wird nicht stillschweigend in den Haupttext eingeführt.
