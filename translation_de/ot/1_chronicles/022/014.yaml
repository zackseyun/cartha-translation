source:
  edition: WLC
  text: וְ/הִנֵּ֨ה בְ/עָנְיִ֜/י הֲכִינ֣וֹתִי לְ/בֵית יְהוָ֗ה זָהָ֞ב כִּכָּרִ֤ים מֵֽאָה אֶ֨לֶף֙ וְ/כֶ֗סֶף אֶ֤לֶף אֲלָפִים֙ כִּכָּרִ֔ים וְ/לַ/נְּחֹ֤שֶׁת וְ/לַ/בַּרְזֶל֙ אֵ֣ין מִשְׁקָ֔ל כִּ֥י לָ/רֹ֖ב הָיָ֑ה וְ/עֵצִ֤ים וַ/אֲבָנִים֙ הֲכִינ֔וֹתִי וַ/עֲלֵי/הֶ֖ם תּוֹסִֽיף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/014.yaml
  text: Behold[a], in my affliction I have prepared for the house of Yahweh one hundred thousand talents of gold, and one million talents of silver; and for the bronze and the iron there is no weighing, for it was in abundance. I have prepared timber and stones[c][b], and you may add to them.
translation:
  language: de
  text: Siehe, in meiner Not[a] habe ich für das Haus Jahwes 100.000 Talente Gold und eine Million[b] Talente Silber bereitgestellt. Für Bronze und Eisen war das Gewicht nicht festzustellen, denn sie waren in großer Menge vorhanden. Auch Holz und Steine habe ich bereitgestellt; du kannst[c] noch mehr hinzufügen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in meiner Armut. Das hebräische Wort kann Not, Bedrängnis, Mühsal oder Armut bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: tausend Tausende.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: du sollst noch mehr hinzufügen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְעָנְיִי
  choice: in meiner Not
  rationale: עֳנִי bezeichnet Bedrängnis, Mühsal oder Not und kann auch Armut einschließen. „In meiner Not“ bewahrt die Bedeutungsbreite und klingt im heutigen Deutsch natürlich; „in meiner Armut“ bleibt als Alternative in der Fußnote erhalten.
- source_word: הֲכִינוֹתִי
  choice: habe ich … bereitgestellt
  rationale: Das Hifil von כון bedeutet hier „vorbereiten, bereitstellen“. Das Perfekt bezeichnet Davids bereits geleistete Vorbereitungen, deren Ergebnis für Salomo verfügbar ist.
- source_word: לְבֵית יְהוָה
  choice: für das Haus Jahwes
  rationale: „Haus“ bewahrt das hebräische Bild für den Tempel; der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: כִּכָּרִים
  choice: Talente
  rationale: כִּכָּר bezeichnet eine große Gewichtseinheit. „Talent“ ist die im biblischen Kontext etablierte deutsche Bezeichnung.
- source_word: אֶלֶף אֲלָפִים
  choice: eine Million
  rationale: Die natürliche moderne Wiedergabe der Zahl ist „eine Million“; die wörtliche Form „tausend Tausende“ wird in einer Fußnote genannt.
- source_word: וְלַנְּחֹשֶׁת וְלַבַּרְזֶל אֵין מִשְׁקָל
  choice: Bronze und Eisen waren nicht zu wiegen
  rationale: Wörtlich heißt es, für Bronze und Eisen gebe es „kein Gewicht/Wiegen“. Gemeint ist im Zusammenhang nicht Gewichtslosigkeit, sondern eine wegen der Fülle nicht angegebene beziehungsweise nicht durchgeführte Wägung.
- source_word: כִּי לָרֹב הָיָה
  choice: denn sie waren in großer Menge vorhanden
  rationale: Die Formulierung erklärt die fehlende Gewichtsangabe durch die große Menge. Der deutsche Plural nimmt die beiden kollektiv genannten Metalle natürlich wieder auf.
- source_word: וְעֵצִים וַאֲבָנִים
  choice: Auch Holz und Steine
  rationale: עֵצִים bezeichnet hier Baumaterial; „Holz“ ist im Deutschen klar und idiomatisch. Das einleitende „Auch“ macht die additive Funktion des וְ sichtbar.
- source_word: וַעֲלֵיהֶם תּוֹסִיף
  choice: du kannst noch mehr hinzufügen
  rationale: Das Imperfekt kann hier permissiv („du kannst/darfst“) oder auffordernd („du sollst“) verstanden werden. Die Hauptfassung wahrt den im Kontext naheliegenden permissiven Sinn; die verpflichtendere Lesart steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Modalität von תּוֹסִיף
  choice: du kannst noch mehr hinzufügen
  alternative: du sollst noch mehr hinzufügen
  rationale: Die Verbform lässt sowohl eine permissive Aussage als auch eine Aufforderung zu. Die Übersetzung entscheidet sich nicht stillschweigend endgültig, sondern dokumentiert die alternative Modalität in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ erhält den markanten hebräischen Aufmerksamkeitsruf. Die Zahlen werden lesefreundlich modern angegeben; die auffällige hebräische Zahlenform bleibt per Fußnote sichtbar. Semantische Mehrdeutigkeiten bei בְעָנְיִי und תּוֹסִיף werden nicht eingeebnet.
