  text: לַ/זָּהָ֥ב לַ/כֶּ֛סֶף וְ/לַ/נְּחֹ֥שֶׁת וְ/לַ/בַּרְזֶ֖ל אֵ֣ין מִסְפָּ֑ר ק֣וּם וַ/עֲשֵׂ֔ה וִ/יהִ֥י יְהוָ֖ה עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/016.yaml
  text: For the gold[a], the silver, the bronze, and the iron, there is no number. Rise up and work[c][b], and may Yahweh be with you.
translation:
  language: de
  text: Gold, Silber, Bronze[a] und Eisen sind nicht zu zählen.[b] Steh auf und geh ans Werk! Möge Jahwe mit dir sein.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Kupfer.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Es gibt keine Zahl«; auch: »Sie sind unzählbar«.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: »Und Jahwe wird mit dir sein« oder: »Jahwe sei mit dir«. Die hebräische Form kann einen Wunsch oder Segen ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַזָּהָב לַכֶּסֶף וְלַנְּחֹשֶׁת וְלַבַּרְזֶל
  choice: Gold, Silber, Bronze und Eisen
  rationale: Die wiederholte Präposition ל kennzeichnet die Materialien hier thematisch. Im Deutschen gibt die unmarkierte Aufzählung diesen Bezug natürlicher wieder als eine schwerfällige Formulierung mit »hinsichtlich«.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: In einer Liste antiker Bau- und Kultmaterialien bezeichnet das Wort gewöhnlich Bronze; je nach Sachzusammenhang ist auch Kupfer möglich.
- source_word: אֵין מִסְפָּר
  choice: sind nicht zu zählen
  rationale: Die hebräische Wendung bedeutet, dass keine Zahl angegeben werden kann. Die deutsche Formulierung bewahrt das Bild des Zählens und klingt zugleich natürlich.
- source_word: קוּם וַעֲשֵׂה
  choice: Steh auf und geh ans Werk!
  rationale: קוּם ist ein aufforderndes »Steh auf«, während עשה im Zusammenhang der Tempelbauvorbereitungen konkretes Tätigwerden meint. »Geh ans Werk« gibt diesen Sinn idiomatisch wieder.
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: Möge Jahwe mit dir sein
  rationale: Die jussivische Form drückt am ehesten einen Wunsch oder Segen aus. Der Gottesname יהוה wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Aussageweise von וִיהִי
  choice: 'Segenswunsch: »Möge … sein«'
  alternative: 'Zusage: »Jahwe wird mit dir sein«'
  rationale: Die Form kann im Zusammenhang als Wunsch, Segen oder Aufforderung verstanden werden. Die Übersetzung wählt den Segenswunsch, vermerkt aber die mögliche Aussageform in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappen Aufforderungen bleiben kraftvoll; »geh ans Werk« ist gegenwärtig verständlich, ohne umgangssprachlich zu wirken. Die sachliche Mehrdeutigkeit des Metallbegriffs und der Schlussform wird in Fußnoten bewahrt.
