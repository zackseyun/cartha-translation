base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/002.yaml
  text: Then King David rose to his feet and said[a], “Hear me, my brothers and my people. It was in my heart to build a house of rest for the ark of the covenant of Yahweh, and for the footstool of our God[c][b], and I made preparations to build it.”
translation:
  language: de
  text: 'Da stand König David auf und sagte: »Hört mich an, meine Brüder[a] und mein Volk! Ich hatte es im Herzen, ein Haus der Ruhe[b] für die Lade des Bundes Jahwes und für den Fußschemel unseres Gottes[c] zu bauen, und ich traf Vorbereitungen, es zu bauen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Verwandten“. Im Hebräischen steht „meine Brüder“, eine maskuline Pluralform in einer öffentlichen Anrede.'
    reason: lexical_alternative
  - marker: b
    text: „Haus der Ruhe“ kann auch mit „Ruheort“ wiedergegeben werden; gemeint ist eine feste, bleibende Stätte für die Lade.
    reason: lexical_alternative
  - marker: c
    text: Die Lade wird bildhaft mit dem Fußschemel verbunden, der Gottes Gegenwart zugeordnet ist; vgl. Psalm 132,7.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּקָם ... עַל רַגְלָיו
  choice: stand ... auf
  rationale: Die Verbindung bezeichnet, dass David sich auf seine Füße erhebt. „stand ... auf“ gibt dies im modernen Deutschen natürlich und vollständig wieder.
- source_word: שְׁמָעוּנִי
  choice: Hört mich an
  rationale: Der Imperativ von שמע mit Suffix der ersten Person fordert die Versammelten feierlich zum Zuhören auf.
- source_word: אַחַי וְעַמִּי
  choice: meine Brüder und mein Volk
  rationale: „Brüder“ bewahrt die maskuline Pluralform und die Verwandtschaftssprache; „mein Volk“ erhält die parallele nationale Anrede.
- source_word: אֲנִי עִם לְבָבִי
  choice: Ich hatte es im Herzen
  rationale: Diese idiomatische Wiedergabe bewahrt das Herz als Sitz von Davids innerer Absicht, ohne die ungewöhnliche hebräische Konstruktion hölzern nachzubilden.
- source_word: בֵּית מְנוּחָה
  choice: ein Haus der Ruhe
  rationale: Die relativ formale Wendung erhält sowohl das Bild eines Hauses als auch den Gedanken eines dauerhaften Ruheortes.
- source_word: לַאֲרוֹן בְּרִית יְהוָה
  choice: für die Lade des Bundes Jahwes
  rationale: Die deutsche Genitivkette gibt die hebräische Status-constructus-Verbindung klar wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְלַהֲדֹם רַגְלֵי אֱלֹהֵינוּ
  choice: und für den Schemel der Füße unseres Gottes
  rationale: Die Übersetzung bewahrt die koordinierte Form und das konkrete Bild des hebräischen Textes, ohne die Beziehung zwischen Lade und Schemel im Haupttext ausdrücklich festzulegen.
- source_word: וַהֲכִינוֹתִי לִבְנוֹת
  choice: und ich traf Vorbereitungen, es zu bauen
  rationale: „traf Vorbereitungen“ bringt den Hifil-Sinn von כון zur Geltung; das im Deutschen ergänzte „es“ nimmt das zuvor genannte Haus auf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Quelltext enthält den Eigennamen JHWH. „Jahwe“ macht den Bundesnamen im Deutschen erkennbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Beziehung zwischen Bundeslade und Fußschemel
  choice: Die koordinierte Form „für ... und für ...“ bleibt im Haupttext erhalten.
  alternative: 'Die Lade ausdrücklich mit dem Fußschemel gleichsetzen: „für die Lade ..., den Schemel ...“'
  rationale: Der Zusammenhang legt eine enge sachliche Beziehung nahe, doch die hebräische Konjunktion kann formal koordinieren. Die Übersetzung löst diese mögliche Apposition daher nicht stillschweigend auf; eine Erläuterung steht in der Fußnote.
- issue: Geschlechtsspezifische Verwandtschaftsanrede אַחַי
  choice: meine Brüder
  alternative: meine Verwandten; meine Brüder und Schwestern
  rationale: Die grammatisch maskuline Form und Davids öffentliche Verwandtschaftsanrede werden bewahrt; der mögliche weitere Bezug wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlicher direkter Rede. Die Syntax bleibt quellennah, wird jedoch idiomatisch geglättet. Bildhafte kultische Ausdrücke wie „Haus der Ruhe“ und „Schemel der Füße“ bleiben erhalten; echte syntaktische Mehrdeutigkeit wird nicht dogmatisch vereindeutigt.
