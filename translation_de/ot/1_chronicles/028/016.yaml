  text: and the weight of the gold for the tables of the arrangement[a], for each table and table, and silver for the silver tables.
translation:
  language: de
  text: dazu das Gewicht des Goldes für die Tische für die Anordnung, für jeden Tisch, und Silber für die silbernen Tische.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁקָל
  choice: das Gewicht
  rationale: Im Zusammenhang der Materialzuweisungen bezeichnet das Substantiv die nach Gewicht festgelegte Menge des Edelmetalls. „Gewicht“ gibt den Ausdruck direkt und natürlich wieder.
- source_word: שֻׁלְחֲנוֹת הַמַּעֲרֶכֶת
  choice: die Tische der Schaubrote
  rationale: מַעֲרֶכֶת bezeichnet hier wahrscheinlich die geordnete Auslage der Brote vor Gott. Die traditionelle deutsche Bezeichnung „Schaubrote“ ist im Tempelkontext verständlich; die wörtlichere Ausdrucksweise wird in der Fußnote bewahrt.
- source_word: לְשֻׁלְחָן וְשֻׁלְחָן
  choice: für jeden einzelnen Tisch
  rationale: Die Wiederholung des Singulars hat distributive Bedeutung. „Für jeden einzelnen Tisch“ gibt diese Einzelzuweisung in natürlichem modernem Deutsch wieder.
- source_word: כֶּסֶף
  choice: Silber
  rationale: Der schlichte Materialbegriff steht im Gegensatz zum Gold im ersten Teil des Verses.
- source_word: שֻׁלְחֲנוֹת הַכָּסֶף
  choice: die silbernen Tische
  rationale: Die Genitivverbindung bezeichnet am natürlichsten Tische aus Silber beziehungsweise die als silbern ausgewiesenen Tische; „silberne Tische“ ist knapp und idiomatisch.
