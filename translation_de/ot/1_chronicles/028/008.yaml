id: 1CH.28.8
reference: 1 Chronicles 28:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ֠/עַתָּה לְ/עֵינֵ֨י כָל יִשְׂרָאֵ֤ל קְהַל יְהוָה֙ וּ/בְ/אָזְנֵ֣י אֱלֹהֵ֔י/נוּ שִׁמְר֣וּ וְ/דִרְשׁ֔וּ כָּל מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם לְמַ֤עַן תִּֽירְשׁוּ֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה וְ/הִנְחַלְתֶּ֛ם לִ/בְנֵי/כֶ֥ם אַחֲרֵי/כֶ֖ם עַד עוֹלָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/008.yaml
  text: And now[a], in the sight of all Israel, the assembly of Yahweh, and in the hearing of our God, keep and seek all the commandments of Yahweh your God[b], so that you may possess the good land and leave it as an inheritance to your sons after you forever.
translation:
  language: de
  text: 'Und nun: Vor den Augen von ganz Israel – der Versammlung Jahwes – und in Gegenwart unseres Gottes haltet alle Gebote Jahwes, eures Gottes, und bemüht euch um sie, damit ihr das gute Land besitzen[a] und es nach euch euren Söhnen[b] für immer als Erbe hinterlassen könnt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das gute Land erben“. Das hebräische Verb kann je nach Zusammenhang „erben“, „in Besitz nehmen“ oder „besitzen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Söhnen“; im Hebräischen steht hier die maskuline Pluralform, nicht das allgemeinere „Kinder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Funktion als auch den Übergang zu Davids abschließender Ermahnung.
- source_word: לְעֵינֵי כָל־יִשְׂרָאֵל
  choice: vor den Augen ganz Israels
  rationale: Gibt die hebräische Körpermetapher wieder und bezeichnet Israel als öffentlichen Zeugen der Aufforderung.
- source_word: קְהַל יְהוָה
  choice: der Versammlung Jahwes
  rationale: קהל bezeichnet die versammelte Gemeinschaft; „Versammlung“ ist verständlich und vermeidet eine unnötig kirchliche Einengung.
- source_word: וּבְאָזְנֵי אֱלֹהֵינוּ
  choice: und vor den Ohren unseres Gottes
  rationale: 'Bewahrt die anthropomorphe hebräische Wendung und ihren Sinn: Gott hört die öffentlich ausgesprochene Verpflichtung.'
- source_word: שִׁמְרוּ
  choice: Haltet
  rationale: „Gebote halten“ ist im Deutschen eine natürliche und sachlich genaue Wiedergabe für das treue Beachten von Geboten.
- source_word: וְדִרְשׁוּ
  choice: und richtet euer Streben auf sie
  rationale: דרשׁ fordert hier nicht nur intellektuelles Erforschen, sondern ein ernsthaftes Suchen und Sich-Ausrichten auf Gottes Gebote. Die Wiedergabe macht diese willentliche Ausrichtung in natürlichem Deutsch deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen als Eigennamen wieder.
- source_word: תִּירְשׁוּ
  choice: besitzen
  rationale: ירשׁ kann sowohl „erben“ als auch „in Besitz nehmen/besitzen“ bedeuten. Im Zusammenhang mit Israels fortdauerndem Besitz des guten Landes ist „besitzen“ passend, ohne die mögliche Erbnuance zu verschweigen.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: das gute Land
  rationale: Wörtliche und im Bundeskontext prägnante Bezeichnung des verheißenen Landes.
- source_word: וְהִנְחַלְתֶּם
  choice: als Erbe hinterlassen
  rationale: Der Hifil von נחל bezeichnet hier das Veranlassen, dass die folgende Generation erbt; die deutsche Formulierung gibt diesen kausativen Sinn idiomatisch wieder.
- source_word: לִבְנֵיכֶם
  choice: euren Söhnen
  rationale: Das hebräische Substantiv ist ausdrücklich maskulin plural; die Übersetzung bewahrt diese Form.
- source_word: עַד־עוֹלָם
  choice: für immer
  rationale: Natürliche deutsche Wiedergabe der zeitlich unbegrenzten Formulierung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält das Tetragramm als Gottes Eigennamen. „Jahwe“ bewahrt diese Namensfunktion, statt sie durch einen Titel zu ersetzen.
- issue: Bedeutung von ירשׁ im Zusammenhang mit dem Land
  choice: besitzen
  alternative: erben
  rationale: Beide Bedeutungen sind lexikalisch möglich. „Besitzen“ passt dazu, dass Israel sich bereits im Land befindet; die Alternative wird in einer Fußnote erhalten.
- issue: Geschlechtsspezifische Bezeichnung בנים
  choice: Söhne
  alternative: Kinder
  rationale: Die maskuline Pluralform wird nicht stillschweigend verallgemeinert. Ob im weiteren Anwendungshorizont alle Nachkommen mitgemeint sind, wird durch die Übersetzung nicht entschieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die öffentlichen Zeugenformeln werden mit den hebräischen Körpermetaphern („vor den Augen“, „vor den Ohren“) bewahrt. Bei דרשׁ wird eine natürliche Formulierung gewählt, die das ernsthafte, tätige Streben nach den Geboten ausdrückt, ohne den Sinn auf bloßes Studium zu verengen.
