revisions:
- from: 'Und sieh: Die Abteilungen der Priester und der Leviten stehen für den gesamten Dienst am Haus Gottes bereit. Bei jeder Arbeit werden dir alle zur Seite stehen, die bereitwillig und für jeden Dienst kundig sind. Auch die führenden Männer und das ganze Volk[a] stehen dir für alles zur Verfügung, was du anordnest.'
  to: 'Und sieh: Die Abteilungen der Priester und der Leviten stehen für den gesamten Dienst am Haus Gottes bereit. Bei jeder Arbeit steht dir jeder bereitwillige Mann zur Seite, der für jeden Dienst fachkundig ist. Auch die führenden Amtsträger und das ganze Volk stehen dir bei allem zur Verfügung, was du anordnest.[a]'
  rationale: Die Revision bewahrt die hebräische distributive Personenbezeichnung bei נָדִיב, gibt die praktische Kompetenz von חָכְמָה natürlich wieder und begrenzt die Erläuterung zu לְכָל־דְּבָרֶיךָ auf die vom Kontext gedeckte Bereitschaft, Weisungen auszuführen. Der Fußnotenanker wurde an die ganze abschließende Aussage gesetzt, auf die er sich bezieht.
  reviewer_model: gpt-5.6-terra
