base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/021.yaml
  text: And behold[a], the divisions of the priests and the Levites are for all the service of the house of God, and with you in all the work will be every willing man skilled in wisdom for every kind of service; the officials also, and all the people[b], will be wholly at your command.
translation:
  language: de
  text: 'Und sieh: Die Abteilungen der Priester und der Leviten stehen für den gesamten Dienst am Haus Gottes bereit. Bei jeder Arbeit steht dir jeder bereitwillige Mann zur Seite, der für jeden Dienst fachkundig ist. Auch die führenden Amtsträger und das ganze Volk stehen dir bei allem zur Verfügung, was du anordnest.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für alle deine Worte“; gemeint ist, dass sie bereit sind, alle deine Weisungen auszuführen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Bewahrt die aufmerksamkeitslenkende, deiktische Funktion, klingt dabei im heutigen Deutschen natürlicher als „Und siehe“.
- source_word: מַחְלְקוֹת
  choice: Abteilungen
  rationale: Bezeichnet die geordneten Dienstgruppen der Priester und Leviten; „Abteilungen“ ist verständlich und vermeidet das weniger transparente „Ordnungen“.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: die Priester und die Leviten
  rationale: Gibt die beiden ausdrücklich genannten Gruppen des Tempeldienstes direkt wieder.
- source_word: לְכָל עֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: für den gesamten Dienst am Haus Gottes
  rationale: Erhält sowohl den umfassenden Dienstbereich als auch die konkrete hebräische Wendung „Haus Gottes“.
- source_word: וְעִמְּךָ בְכָל מְלָאכָה
  choice: Bei jeder Arbeit werden dir ... zur Seite stehen
  rationale: Gibt die Unterstützung für Salomo in sämtlichen Arbeiten idiomatisch wieder, ohne den Bezug auf das konkrete Werk einzuengen.
- source_word: לְכָל נָדִיב בַּחָכְמָה
  choice: alle, die bereitwillig und ... kundig sind
  rationale: נָדִיב bezeichnet hier eine bereitwillige Person; חָכְמָה hat im handwerklich-organisatorischen Zusammenhang den Sinn praktischer Befähigung. Die distributive Konstruktion wird im Deutschen natürlich im Plural wiedergegeben.
- source_word: לְכָל עֲבוֹדָה
  choice: für jeden Dienst
  rationale: Bewahrt den umfassenden Anwendungsbereich und unterscheidet עֲבוֹדָה sprachlich von der zuvor genannten מְלָאכָה („Arbeit“).
- source_word: וְהַשָּׂרִים
  choice: die führenden Männer
  rationale: שָׂרִים bezeichnet hier leitende Amtsträger. Die Wiedergabe vermeidet sowohl das missverständliche „Fürsten“ als auch das modern-bürokratische „Beamte“.
- source_word: וְכָל הָעָם
  choice: das ganze Volk
  rationale: Direkte Wiedergabe, die die umfassende Unterstützung betont.
- source_word: לְכָל דְּבָרֶיךָ
  choice: für alles ... was du anordnest
  rationale: Das wörtliche „für alle deine Worte/Sachen“ bezeichnet im Kontext die Bereitschaft, Salomos Weisungen in allen Angelegenheiten auszuführen.
theological_decisions:
- issue: Geschlecht und Zahl bei נָדִיב
  choice: alle, die bereitwillig ... sind
  alternative: jeder bereitwillige Mann
  rationale: Die maskuline Singularform ist distributiv („jeder Bereitwillige“) und bezeichnet im Zusammenhang die verfügbaren Fachkräfte. Die natürliche deutsche Pluralform behauptet nicht, dass Frauen ausdrücklich einbezogen oder ausgeschlossen seien, und bewahrt damit die Offenheit des Ausdrucks.
- issue: Wiedergabe von בֵּית הָאֱלֹהִים
  choice: Haus Gottes
  alternative: Tempel
  rationale: „Haus Gottes“ erhält die konkrete kultische Ausdrucksweise des Hebräischen; „Tempel“ wäre sachlich zutreffend, aber stärker kontextualisierend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und sieh“ erhält den rhetorischen Hinweischarakter ohne den archaischen Klang von „siehe“. Die Satzglieder wurden moderat neu geordnet, damit die dichte hebräische Reihung verständlich bleibt; die umfassenden Angaben „jede/alle/gesamt“ bleiben erhalten.
