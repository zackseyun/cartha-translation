  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לִ/שְׁלֹמֹ֣ה בְנ֗/וֹ חֲזַ֤ק וֶ/אֱמַץ֙ וַ/עֲשֵׂ֔ה אַל תִּירָ֖א וְ/אַל תֵּחָ֑ת כִּי֩ יְהוָ֨ה אֱלֹהִ֤ים אֱלֹהַ/י֙ עִמָּ֔/ךְ לֹ֤א יַרְפְּ/ךָ֙ וְ/לֹ֣א יַֽעַזְבֶ֔/ךָּ עַד לִ/כְל֕וֹת כָּל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/020.yaml
  text: And David said to Solomon his son[a], “Be strong and courageous, and do it. Do not fear or be dismayed, for Yahweh God, my God, is with you. He will not fail you or forsake you until all the work for the service of the house of Yahweh is finished.”
translation:
  language: de
  text: 'Und David sagte zu seinem Sohn Salomo: »Sei stark und mutig und geh ans Werk! Fürchte dich nicht und verzage nicht, denn Jahwe Gott, mein Gott, ist mit dir. Er wird dich nicht im Stich lassen[a] und dich nicht verlassen, bis das ganze Werk für den Dienst im Haus Jahwes vollendet ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wird dich nicht loslassen“; das hebräische Verb kann ausdrücken, dass jemand seinen Halt oder seine Unterstützung nicht nachlassen lässt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמַץ
  choice: Sei stark und mutig
  rationale: Die geläufige Verbindung der beiden Imperative wird in natürlichem, würdigem Deutsch als einheitlicher Aufruf zu Kraft und Entschlossenheit wiedergegeben.
- source_word: וַעֲשֵׂה
  choice: und geh ans Werk
  rationale: Der knappe Imperativ fordert Salomo im Zusammenhang unmittelbar dazu auf, die Tempelarbeiten auszuführen. „Geh ans Werk“ bewahrt den Handlungsimpuls idiomatischer als ein isoliertes „tu“.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: Fürchte dich nicht und verzage nicht
  rationale: Die beiden Verbote betreffen Angst und den daraus folgenden Verlust des Mutes. „Verzage nicht“ ist verständlich, würdig und wahrt die Unterscheidung beider Verben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהִים אֱלֹהַי
  choice: Gott, mein Gott
  rationale: Die appositionelle Wiederholung des Hebräischen bleibt erhalten und bringt Davids persönliches Bekenntnis zum Ausdruck, ohne es näher auszudeuten.
- source_word: עִמָּךְ
  choice: ist mit dir
  rationale: Die hebräische Nominalklausel bezeichnet Gottes gegenwärtige Begleitung; im Deutschen wird das fehlende Verb mit „ist“ ergänzt.
- source_word: לֹא יַרְפְּךָ
  choice: Er wird dich nicht im Stich lassen
  rationale: Die Hifil-Form von רפה bezeichnet hier, dass Gott seine stützende Hilfe nicht erschlaffen lässt. Die deutsche Wendung gibt die Zusicherung natürlich wieder; die konkretere Möglichkeit „nicht loslassen“ wird in der Fußnote bewahrt.
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: und dich nicht verlassen
  rationale: עזב bezeichnet das Verlassen oder Aufgeben einer Person. Die Wiedergabe erhält die feierliche Zusicherung und unterscheidet sie hinreichend vom vorhergehenden Verb.
- source_word: עַד לִכְלוֹת
  choice: bis … vollendet sind
  rationale: Die Infinitivkonstruktion bezeichnet den Zeitpunkt, an dem die gesamte Aufgabe abgeschlossen ist.
- source_word: כָּל מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: alle Arbeiten für den Dienst am Haus Jahwes
  rationale: Die dichte Konstruktverbindung enthält sowohl die auszuführenden Arbeiten als auch deren Zweck, den Tempeldienst. Der Plural „Arbeiten“ gibt das kollektive כָּל מְלֶאכֶת im Deutschen natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite der Zusage bis zur Vollendung der Arbeiten
  choice: Die zeitliche Formulierung bleibt unverändert erhalten
  alternative: Gottes Beistand ausdrücklich als nur bis zum Abschluss begrenzt oder als unbegrenzt erklären
  rationale: עַד nennt im Satz den Abschluss der Aufgabe als zugesicherten Zielpunkt. Die Übersetzung deutet nicht zusätzlich, ob damit über diesen Zeitpunkt hinaus eine Aussage über Gottes Gegenwart gemacht wird.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, unmittelbar verständlichem Erzähl- und Ermahnungsstil. „Geh ans Werk“ macht den knappen Handlungsimperativ idiomatisch; „verzage nicht“ bewahrt den feierlichen Ton, ohne altertümlich zu wirken. Der Fußnotenmarker steht unmittelbar bei der betroffenen Wendung.
