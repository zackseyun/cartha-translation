- from: 'Und David sagte zu seinem Sohn Salomo: »Sei stark und mutig und geh ans Werk! Fürchte dich nicht und verzage nicht, denn Jahwe Gott, mein Gott, ist mit dir. Er wird dich nicht im Stich lassen[a] und dich nicht verlassen, bis alle Arbeiten für den Dienst am Haus Jahwes vollendet sind.«'
  to: 'Und David sagte zu seinem Sohn Salomo: »Sei stark und mutig und geh ans Werk! Fürchte dich nicht und verzage nicht, denn Jahwe Gott, mein Gott, ist mit dir. Er wird dich nicht im Stich lassen[a] und dich nicht verlassen, bis das ganze Werk für den Dienst im Haus Jahwes vollendet ist.«'
  rationale: Die Revision beschränkt sich auf den Schlussteil. „das ganze Werk“ folgt der kollektiven Singularform, und „für den Dienst im Haus Jahwes“ gibt die Beziehung der Arbeiten zum Tempeldienst präziser und ohne die mögliche bauliche Nebenbedeutung von „am Haus“ wieder. Die übrigen Formulierungen sind quellentreu und idiomatisch.
