id: 1CH.28.10
reference: 1 Chronicles 28:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רְאֵ֣ה עַתָּ֗ה כִּֽי יְהוָ֛ה בָּ֧חַר בְּ/ךָ֛ לִ/בְנֽוֹת בַּ֥יִת לַ/מִּקְדָּ֖שׁ חֲזַ֥ק וַ/עֲשֵֽׂה׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/010.yaml
  text: See now[a], for Yahweh has chosen you to build a house for the sanctuary. Be strong[b], and do it.
translation:
  language: de
  text: Sieh nun[a], denn Yahweh hat dich erwählt, ein Haus für das Heiligtum[b] zu bauen. Sei stark und führe es aus!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bedenke nun« beziehungsweise »Gib nun acht«. Der Imperativ fordert nicht nur zum Sehen, sondern zu aufmerksamer Besinnung auf.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »ein Haus für das Heiligtum«; möglich ist auch der Sinn: »ein Haus als Heiligtum«. Gemeint ist das Tempelgebäude als heiliger Ort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה עַתָּה
  choice: Sieh nun
  rationale: Der Imperativ von ראה fordert hier idiomatisch zu bewusster Aufmerksamkeit und Besinnung auf; „Sieh nun“ bewahrt zugleich die direkte Bildlichkeit und Dringlichkeit des Hebräischen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die Aufforderung ein; „denn“ gibt diesen motivierenden Zusammenhang im Deutschen knapp wieder.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בָּחַר בְּךָ
  choice: hat dich erwählt
  rationale: Das Perfekt bezeichnet die bereits erfolgte göttliche Wahl, die für den gegenwärtigen Auftrag maßgeblich ist. „Erwählt“ entspricht zudem dem feierlichen Beauftragungskontext.
- source_word: לִבְנוֹת בַּיִת לַמִּקְדָּשׁ
  choice: ein Haus für das Heiligtum zu bauen
  rationale: „Haus“ erhält die konkrete biblische Bezeichnung בַּיִת, während „für das Heiligtum“ die Zweck- oder Zuordnungsangabe mit לְ wiedergibt, ohne beide Substantive einfach zu „Tempel“ zusammenzuziehen.
- source_word: חֲזַק
  choice: Sei stark
  rationale: Die knappe Imperativform fordert Kraft, Entschlossenheit und Standhaftigkeit für den übertragenen Auftrag.
- source_word: וַעֲשֵׂה
  choice: und führe es aus
  rationale: Das allgemeine Verb עשה bezieht sich im Zusammenhang auf die Durchführung des Bauauftrags. „Führe es aus“ macht diesen Bezug in natürlichem Deutsch deutlich, ohne eine neue Handlung einzuführen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration „Yahweh“ bewahrt ihn als Eigennamen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Verhältnis von בַּיִת und מִקְדָּשׁ
  choice: ein Haus für das Heiligtum
  alternative: einen Tempel; ein Haus als Heiligtum
  rationale: Der Text nennt sowohl „Haus“ als auch „Heiligtum“. Die gewählte Fassung bewahrt beide Begriffe und lässt die genaue Funktion des לְ offen, statt die Wendung vorschnell auf den Einzelbegriff „Tempel“ zu reduzieren.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knappen, eindringlichen Imperativen. Die ungewöhnliche, aber verständliche Verbindung „Haus für das Heiligtum“ bewahrt bewusst die zwei hebräischen Substantive; die Fußnote erläutert die mögliche funktionale Lesart.
