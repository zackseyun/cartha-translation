id: 1CH.28.3
reference: 1 Chronicles 28:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָ/אֱלֹהִים֙ אָ֣מַר לִ֔/י לֹא תִבְנֶ֥ה בַ֖יִת לִ/שְׁמִ֑/י כִּ֣י אִ֧ישׁ מִלְחָמ֛וֹת אַ֖תָּה וְ/דָמִ֥ים שָׁפָֽכְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/003.yaml
  text: But God said to me[a], ‘You shall not build a house for my name[b], because you are a man of wars and have shed blood.’
translation:
  language: de
  text: 'Doch Gott sagte zu mir: »Du sollst meinem Namen kein Haus bauen[a], denn du bist ein Mann vieler Kriege[b] und hast Blut vergossen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem »Haus für Gottes Namen« ist der Tempel als der Ort gemeint, der mit Gottes Namen und Gegenwart verbunden ist.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: »ein Mann der Kriege«; möglich ist auch: »ein Kriegsmann«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֱלֹהִים
  choice: Doch Gott
  rationale: 'Das וְ hat hier im Zusammenhang einen gegensätzlichen Sinn: David wollte bauen, doch Gott untersagte es ihm. »Doch« gibt diesen Zusammenhang im modernen Deutsch natürlich wieder.'
- source_word: אָמַר לִי
  choice: sagte zu mir
  rationale: Die Wendung gibt das hebräische Redeverb mit seinem indirekten Objekt schlicht und formnah wieder.
- source_word: לֹא תִבְנֶה
  choice: Du sollst … kein Haus bauen
  rationale: Die Formulierung bewahrt den feierlichen Charakter und lässt offen, ob der Schwerpunkt auf einem Verbot oder auf der göttlichen Festlegung dessen liegt, was David nicht tun wird.
- source_word: בַיִת לִשְׁמִי
  choice: meinem Namen kein Haus bauen
  rationale: »Haus« bewahrt das hebräische Bild, statt es bereits mit »Tempel« auszulegen. Die deutsche Wortstellung ist natürlich und gibt לִשְׁמִי als »meinem Namen« wieder.
- source_word: כִּי
  choice: denn
  rationale: »Denn« leitet die von Gott genannte Begründung klar und in einem würdigen Erzählton ein.
- source_word: אִישׁ מִלְחָמוֹת
  choice: ein Mann vieler Kriege
  rationale: Die ungewöhnliche Wendung bewahrt den hebräischen Plural und verweist auf Davids wiederholte Kriegstätigkeit, ohne ihn stärker deutend nur als »Krieger« zu bezeichnen.
- source_word: וְדָמִים שָׁפָכְתָּ
  choice: und hast Blut vergossen
  rationale: »Blut vergießen« ist die entsprechende deutsche Redewendung. Der hebräische Plural דָמִים wird dabei idiomatisch mit dem Singular »Blut« wiedergegeben.
theological_decisions:
- issue: Warum David das Haus für Gottes Namen nicht bauen darf
  choice: Davids viele Kriege und das von ihm vergossene Blut werden als Gottes ausdrückliche Begründung wiedergegeben.
  alternative: Das Blutvergießen ausdrücklich als schuldhaft oder lediglich als kultisch beziehungsweise rollenbezogen unpassend einordnen.
  rationale: Der Vers selbst entscheidet nicht, ob Davids Blutvergießen moralisch schuldhaft war oder ihn aus einem anderen Grund für den Tempelbau ungeeignet machte. Diese theologische Spannung bleibt deshalb bestehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede wird mit deutschen Anführungszeichen gesetzt. Die leicht ungewöhnliche Formulierung »ein Mann vieler Kriege« hält die Mehrzahl des Hebräischen erkennbar, während eine Fußnote die wörtliche Form und eine geläufigere Alternative nennt.
