base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/013.yaml
  text: for the divisions of the priests and the Levites[a], and for all the work of the service of the house of Yahweh[b], and for all the vessels of service of the house of Yahweh.
translation:
  language: de
  text: für die Abteilungen der Priester und der Leviten[a], für alle Arbeiten des Dienstes im Haus Jahwes und für alle Geräte[b] für den Dienst im Haus Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Dienstgruppen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann Gefäße, Werkzeuge und sonstige Gebrauchsgegenstände bezeichnen.
    reason: lexical_scope
lexical_decisions:
- source_word: מַחְלְקוֹת
  choice: Abteilungen
  rationale: Der Begriff bezeichnet in den Chronikbüchern die geordneten Dienstgruppen der Priester und Leviten. „Abteilungen“ bewahrt den organisatorischen Sinn und ist im heutigen Deutsch verständlich.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: der Priester und der Leviten
  rationale: Die beiden bestimmten Gruppenbezeichnungen werden in ihrer üblichen deutschen Form wiedergegeben.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: Arbeiten des Dienstes
  rationale: Die Verbindung umfasst die Gesamtheit der Aufgaben, die zum Tempeldienst gehören. Die Wiedergabe erhält sowohl den Arbeits- als auch den Dienstaspekt.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: „Haus“ bewahrt die konkrete hebräische Ausdrucksweise; „Jahwe“ gibt den im Ausgangstext stehenden Gottesnamen wieder.
- source_word: כְּלֵי עֲבוֹדַת
  choice: Geräte für den Dienst
  rationale: כְּלֵי ist ein weiter Sammelbegriff für die beim Tempeldienst verwendeten Gegenstände und nicht auf Gefäße im engeren Sinn beschränkt. Idiomatisches Deutsch verlangt hier eher „für den Dienst“ als „des Dienstes“.
- source_word: לְכָל
  choice: für sämtliche / für alle
  rationale: Die wiederholte Präposition führt die einzelnen Bereiche auf, auf die sich die übergebene Ordnung beziehungsweise Planung bezieht. Die leichte Variation vermeidet unnötige Schwerfälligkeit, ohne die Struktur aufzulösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als syntaktisch abhängige Fortsetzung des vorangehenden Satzes kleingeschrieben und beginnt entsprechend dem hebräischen לְ mit „für“. Die wiederholte Listenstruktur wird weitgehend bewahrt; unnatürliche deutsche Nominalverkettungen werden vermieden.
