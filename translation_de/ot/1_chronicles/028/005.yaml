source:
  edition: WLC
  text: וּ/מִ/כָּ֨ל בָּנַ֔/י כִּ֚י רַבִּ֣ים בָּנִ֔ים נָ֥תַן לִ֖/י יְהוָ֑ה וַ/יִּבְחַר֙ בִּ/שְׁלֹמֹ֣ה בְנִ֔/י לָ/שֶׁ֗בֶת עַל כִּסֵּ֛א מַלְכ֥וּת יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/005.yaml
  text: And from among all my sons—for Yahweh has given me many sons—he chose Solomon my son to sit on the throne of the kingdom of Yahweh over Israel[a][b].
translation:
  language: de
  text: Und unter all meinen Söhnen – denn Jahwe hat mir viele Söhne gegeben – hat er meinen Sohn Salomo erwählt, auf dem Thron des Königtums Jahwes über Israel zu sitzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Der Thron des Königtums Jahwes“ betont, dass Israels Königtum letztlich Jahwe gehört, auch wenn Salomo als menschlicher König darauf sitzt.
    reason: cross_reference
lexical_decisions:
- source_word: וּמִכָּל בָּנַי
  choice: Und aus allen meinen Söhnen
  rationale: Die Wendung bezeichnet die Auswahl eines Einzelnen aus der Gesamtheit von Davids Söhnen; „aus allen“ ist im Deutschen natürlich und wahrt den Auswahlgedanken.
- source_word: כִּי רַבִּים בָּנִים נָתַן לִי יְהוָה
  choice: denn Jahwe hat mir viele Söhne gegeben
  rationale: כִּי leitet hier eine erklärende Einschaltung ein. Das Perfekt „hat gegeben“ bringt sowohl die vollzogene Gabe als auch ihr gegenwärtiges Ergebnis zum Ausdruck.
- source_word: וַיִּבְחַר בִּשְׁלֹמֹה בְנִי
  choice: hat er meinen Sohn Salomo erwählt
  rationale: Jahwe bleibt das Subjekt. Bei בחר kennzeichnet ב den Erwählten; im Deutschen steht das direkte Objekt. „Erwählt“ passt zum würdevollen biblischen Register.
- source_word: לָשֶׁבֶת עַל כִּסֵּא
  choice: auf dem Thron ... zu sitzen
  rationale: ישב bezeichnet zusammen mit „Thron“ das Sitzen als König und damit die Ausübung der Herrschaft, ohne die Bildsprache durch „herrschen“ zu ersetzen.
- source_word: מַלְכוּת יְהוָה
  choice: der Königsherrschaft Jahwes
  rationale: מַלְכוּת kann Reich, Königtum oder Königsherrschaft bezeichnen. „Königsherrschaft“ bewahrt hier den Bezug auf Jahwes letztgültige Herrschaft und ergibt mit „Thron“ eine verständliche deutsche Fügung.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: עַל bezeichnet in diesem Herrschaftszusammenhang den Bereich, über den die Königsherrschaft ausgeübt wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift „Jahwe“ macht den im hebräischen Text stehenden Eigennamen sichtbar und entspricht der vorgegebenen Projektentscheidung.
- issue: Bedeutung von מַלְכוּת יְהוָה
  choice: die volle Zuordnung der Königsherrschaft zu Jahwe beibehalten
  alternative: Israels Königreich / der königliche Thron
  rationale: Der hebräische Text bezeichnet die Königsherrschaft ausdrücklich als diejenige Jahwes. Dies darf nicht zu einer bloß menschlichen oder nationalen Monarchie abgeschwächt werden.
- issue: Metaphorik des Sitzens auf dem Thron
  choice: „auf dem Thron ... zu sitzen“ beibehalten
  alternative: „über Israel zu herrschen“
  rationale: Die wörtliche Thronformulierung trägt die königliche Bildsprache und lässt zugleich erkennen, dass Salomo als menschlicher König unter Jahwes Königsherrschaft eingesetzt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die erklärende hebräische כִּי-Klausel wird durch Gedankenstriche als Einschub kenntlich gemacht. Die ungewöhnliche, aber theologisch gewichtige Verbindung „Thron der Königsherrschaft Jahwes“ bleibt bewusst erhalten.
