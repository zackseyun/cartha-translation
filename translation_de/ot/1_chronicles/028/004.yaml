  to: Doch Jahwe, der Gott Israels, hat mich aus dem ganzen Haus meines Vaters erwählt, um für immer[b] König über Israel zu sein. Denn Juda hat er zum Anführer[a] erwählt; innerhalb des Hauses Juda hat er das Haus meines Vaters erwählt, und unter den Söhnen meines Vaters hatte er Gefallen an mir, um mich zum König über ganz Israel zu machen.
