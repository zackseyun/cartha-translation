source:
  edition: WLC
  text: וַ/יִּבְחַ֡ר יְהוָ֣ה אֱלֹהֵי֩ יִשְׂרָאֵ֨ל בִּ֜/י מִ/כֹּ֣ל בֵּית אָבִ֗/י לִ/הְי֨וֹת לְ/מֶ֤לֶךְ עַל יִשְׂרָאֵל֙ לְ/עוֹלָ֔ם כִּ֤י בִֽ/יהוּדָה֙ בָּחַ֣ר לְ/נָגִ֔יד וּ/בְ/בֵ֥ית יְהוּדָ֖ה בֵּ֣ית אָבִ֑/י וּ/בִ/בְנֵ֣י אָבִ֔/י בִּ֣/י רָצָ֔ה לְ/הַמְלִ֖יךְ עַל כָּל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/004.yaml
  text: Yet Yahweh[a], the God of Israel, chose me from all my father's house to be king over Israel forever; for he chose Judah as leader, and in the house of Judah, my father's house, and among my father's sons[b], he took pleasure in me to make me king over all Israel.
translation:
  language: de
  text: Doch Jahwe, der Gott Israels, hat mich aus dem ganzen Haus meines Vaters erwählt, um für immer[b] König über Israel zu sein. Denn Juda hat er zum Anführer[a] erwählt; innerhalb des Hauses Juda hat er das Haus meines Vaters erwählt, und unter den Söhnen meines Vaters hatte er Gefallen an mir, um mich zum König über ganz Israel zu machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zum Fürsten« beziehungsweise »zum Herrscher«. Das hebräische Wort nagid bezeichnet eine führende Herrschaftsstellung.'
    reason: lexical_alternative
  - marker: b
    text: »Für immer« gibt ein hebräisches Wort wieder, das eine dauerhafte oder unabsehbare Zeit bezeichnen kann. Im Zusammenhang mit dem davidischen Königtum weist es über Davids persönliche Lebenszeit hinaus.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיִּבְחַר / בָּחַר
  choice: erwählen
  rationale: Das wiederholte Verb bezeichnet Gottes auswählende Entscheidung; die Wiederholung bleibt im Deutschen erhalten.
- source_word: בִּי מִכֹּל בֵּית אָבִי
  choice: mich aus dem ganzen Haus meines Vaters
  rationale: Die Formulierung bezeichnet Davids Auswahl aus seinem väterlichen Großverband und bewahrt die genealogische Ausdrucksweise.
- source_word: לִהְיוֹת לְמֶלֶךְ
  choice: König … zu sein
  rationale: Die Infinitivkonstruktion drückt Ziel beziehungsweise Bestimmung der Erwählung aus.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bewahrt den Horizont einer fortdauernden davidischen Königsherrschaft, ohne ihn im Haupttext auszulegen.
- source_word: לְנָגִיד
  choice: zum Anführer
  rationale: נָגִיד bezeichnet hier eine mit Herrschaft verbundene Führungsstellung; „Anführer“ ist verständlich und legt keine moderne dynastische Bedeutung von „Fürst“ nahe.
- source_word: וּבְבֵית יְהוּדָה בֵּית אָבִי
  choice: und im Haus Juda das Haus meines Vaters
  rationale: Die hebräische Präposition ב wird formal gewahrt; zugleich bleibt die stufenweise Einengung von Juda auf Davids Vaterhaus erkennbar.
- source_word: וּבִבְנֵי אָבִי
  choice: und unter den Söhnen meines Vaters
  rationale: Die ausdrückliche genealogische Formulierung des Hebräischen wird statt der glättenden Wiedergabe „unter meinen Brüdern“ beibehalten.
- source_word: בִּי רָצָה
  choice: hatte er Gefallen an mir
  rationale: רצה bezeichnet wohlwollendes Gefallen beziehungsweise Gunst und wird nicht mit dem bereits verwendeten „erwählen“ gleichgesetzt.
- source_word: לְהַמְלִיךְ
  choice: machte mich zum König
  rationale: Der Hifil von מלך ist kausativ und bezeichnet das Einsetzen zum König.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: über ganz Israel
  rationale: Die Wiedergabe erhält sowohl den Herrschaftsbezug als auch den umfassenden Geltungsbereich.
theological_decisions:
- issue: Bedeutung von לְעוֹלָם für Davids Königtum
  choice: für immer
  alternative: auf unabsehbare Zeit; dauerhaft
  rationale: Die Übersetzung bewahrt die starke Aussage über die fortdauernde davidische Königsherrschaft, ohne sie auf Davids persönliche Lebenszeit zu beschränken oder ihre spätere theologische Erfüllung ausdrücklich festzulegen.
- issue: Amtsbezeichnung נָגִיד
  choice: Anführer
  alternative: Fürst; Herrscher
  rationale: Der Ausdruck kennzeichnet eine von Gott bestimmte Führungs- und Herrschaftsstellung. „Anführer“ vermeidet sowohl eine moderne Rangordnung unterhalb eines Königs als auch eine unnötige Gleichsetzung mit מֶלֶךְ.
- issue: Verhältnis von Gefallen und Erwählung
  choice: hatte er Gefallen an mir
  alternative: erwählte er mich; begünstigte er mich
  rationale: Die eigene Nuance von רצה bleibt neben בחר bestehen; der Text verbindet Gottes souveräne Wahl mit seinem Gefallen, ohne deren Verhältnis weiter zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die genealogische Ausdrucksweise „Haus meines Vaters“ und „Söhne meines Vaters“ bleibt wegen der stufenweisen Auswahlfolge erhalten. Die längere hebräische Satzstruktur wurde behutsam gegliedert, ohne die Abfolge Juda → Vaterhaus → David aufzulösen.
