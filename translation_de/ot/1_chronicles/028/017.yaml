base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/017.yaml
  text: and the forks, the basins, and the pitchers of pure gold; and for the golden bowls, by weight for each bowl and bowl; and for the silver bowls, by weight for each bowl and bowl.
translation:
  language: de
  text: und die Gabeln, die Becken und die Kannen aus reinem Gold; außerdem für die goldenen Schalen jeweils nach dem Gewicht jeder einzelnen Schale[a] und für die silbernen Schalen jeweils nach dem Gewicht jeder einzelnen Schale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »für Schale und Schale«. Die hebräische Wiederholung drückt aus, dass für jede Schale ein eigenes Gewicht festgelegt war; dies gilt entsprechend auch für die silbernen Schalen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּזְלָגוֹת
  choice: Gabeln
  rationale: Das Wort bezeichnet gabelartige Tempelgeräte. »Gabeln« ist im modernen Deutschen verständlich und konkreter als eine umschreibende Wiedergabe.
- source_word: מִּזְרָקוֹת
  choice: Becken
  rationale: Gemeint sind kultische Gefäße, wahrscheinlich für den Opferdienst. »Becken« unterscheidet sie von den später genannten Schalen.
- source_word: קְּשָׂוֹת
  choice: Kannen
  rationale: Der Ausdruck bezeichnet hier wahrscheinlich Gefäße zum Ausgießen. »Kannen« gibt diese Funktion natürlich wieder; »Krüge« ist ebenfalls möglich.
- source_word: זָהָב טָהוֹר
  choice: aus reinem Gold
  rationale: Die Materialangabe bezieht sich auf die zuvor aufgezählten Geräte und wird idiomatisch mit »aus reinem Gold« wiedergegeben.
- source_word: כְפוֹרֵי
  choice: Schalen
  rationale: Das Wort bezeichnet in diesem Inventar schalenförmige Gefäße. Die Wiedergabe hält den Unterschied zu מִּזְרָקוֹת (»Becken«) aufrecht.
- source_word: בְּמִשְׁקָל
  choice: nach dem Gewicht
  rationale: Die Wendung bezeichnet die jeweils festgelegte Gewichtsmenge des Edelmetalls.
- source_word: לִכְפוֹר וּכְפוֹר
  choice: jeder einzelnen Schale
  rationale: Die hebräische Wiederholung hat distributive Funktion. Natürliches Deutsch gibt sie mit »jeder einzelnen Schale« wieder, ohne den Einzelfallcharakter zu verlieren.
- source_word: כֶּסֶף
  choice: Silber
  rationale: Die übliche und im Kontrast zu Gold eindeutige Bezeichnung des Metalls.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Inventarsprache. Die elliptische Satzstruktur des Hebräischen wird durch »das Gold« und »das Silber« verdeutlicht. Die distributive Wiederholung wird im Haupttext idiomatisch wiedergegeben und in der Fußnote dokumentiert.
