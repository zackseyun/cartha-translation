  text: וַ/הֲכִינוֹתִ֥י אֶת מַלְכוּת֖/וֹ עַד לְ/עוֹלָ֑ם אִם יֶחֱזַ֗ק לַ/עֲשׂ֛וֹת מִצְוֺתַ֥/י וּ/מִשְׁפָּטַ֖/י כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/007.yaml
  text: And I will establish his kingdom forever[a], if he is strong to do my commandments and my judgments[c][b], as at this day.
translation:
  language: de
  text: Und ich werde sein Königtum für immer festigen[a], wenn er entschlossen ist, meine Gebote und meine Rechtsbestimmungen zu befolgen, wie er es heute tut[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sein Königtum bestätigen beziehungsweise dauerhaft sichern.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: wenn er stark ist, meine Gebote und meine Rechtsbestimmungen zu tun. Gemeint sein kann auch: wenn er standhaft oder entschlossen ist, sie zu befolgen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „wie an diesem Tag“, das heißt: so, wie er es gegenwärtig tut.'
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲכִינוֹתִי
  choice: Und ich werde … festigen
  rationale: Der Hifil von כון bezeichnet hier das Festmachen bzw. dauerhafte Sichern. „Festigen“ bewahrt das Bild und passt natürlich zum Königtum.
- source_word: מַלְכוּתוֹ
  choice: sein Königtum
  rationale: מַלְכוּת kann Königtum, Herrschaft oder Königreich bedeuten. Im Zusammenhang der davidischen Dynastie hält „Königtum“ die institutionelle und dynastische Bedeutung offen.
- source_word: עַד לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte Dauer; „für immer“ ist klar, modern und würdevoll.
- source_word: אִם
  choice: wenn
  rationale: Die Partikel führt eine echte Bedingung ein. „Wenn“ gibt diese ohne Abschwächung oder zusätzliche Deutung wieder.
- source_word: יֶחֱזַק לַעֲשׂוֹת
  choice: entschlossen daran festhält, … zu befolgen
  rationale: חזק bezeichnet hier Stärke, Festigkeit oder Entschlossenheit im Handeln. Die deutsche Formulierung gibt die beharrliche Ausrichtung auf das Tun der Gebote idiomatisch wieder.
- source_word: מִצְוֺתַי
  choice: meine Gebote
  rationale: „Gebote“ ist die geläufige und sachlich genaue Wiedergabe des bundesrechtlichen Begriffs מִצְוֹת.
- source_word: וּמִשְׁפָּטַי
  choice: und meine Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet hier verbindliche rechtliche Bestimmungen. „Rechtsbestimmungen“ bewahrt den juristischen Klang und ist im modernen Deutsch verständlicher als „Rechtssprüche“.
- source_word: כַּיּוֹם הַזֶּה
  choice: wie er es heute tut
  rationale: Wörtlich lautet die Wendung „wie an diesem Tag“. Im Kontext verweist sie auf Salomos gegenwärtiges Verhalten; die gewählte Formulierung macht den idiomatischen Sinn deutlich.
theological_decisions:
- issue: Bedingtheit der Zusage über Salomos Königtum
  choice: Die Zusage wird ausdrücklich mit „wenn“ an beharrlichen Gehorsam gebunden.
  alternative: Die Bedingung als bloße Charakterbeschreibung Salomos abzuschwächen.
  rationale: אִם kennzeichnet eindeutig eine Bedingung. Die Spannung zu anderen Aussagen über die davidische Verheißung darf nicht harmonisierend beseitigt werden.
- issue: Bedeutungsumfang von מַלְכוּתוֹ
  choice: „sein Königtum“
  alternative: „sein Königreich“ oder „seine Herrschaft“
  rationale: „Königtum“ lässt offen, ob vor allem die Herrschaftsausübung, die Königswürde oder die dynastische Ordnung gemeint ist, und vermeidet eine unnötige Verengung auf ein Staatsgebiet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, während „wie er es heute tut“ das hebräische Zeitidiom verständlich wiedergibt. Die rechtliche und konditionale Sprache bleibt ausdrücklich erhalten.
