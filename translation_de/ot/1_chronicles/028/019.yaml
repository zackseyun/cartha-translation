base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/019.yaml
  text: All this he made clear to me in writing from the hand of Yahweh[b][a], all the works of the pattern.
translation:
  language: de
  text: 'Dies alles hat Jahwe mir schriftlich durch seine Hand, die auf mir war, verständlich gemacht: alle Ausführungen des Plans.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bei anderer Gliederung der knappen hebräischen Wendung: „Dies alles hat er mir schriftlich aus der Hand Jahwes verständlich gemacht: alle Arbeiten des Plans.“ „Plan“ kann auch mit „Muster“ oder „Entwurf“ wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַכֹּל
  choice: Das alles
  rationale: 'Der Zusammenhang liefert den rückweisenden Sinn: David bezieht sich umfassend auf die zuvor beschriebenen Tempelpläne.'
- source_word: בִּכְתָב
  choice: durch eine Schrift
  rationale: Die Wendung bezeichnet hier wohl die schriftliche Form beziehungsweise ein Schriftstück; diese Wiedergabe lässt zugleich den Anschluss an „aus der Hand Jahwes“ erkennen.
- source_word: מִיַּד יְהוָה
  choice: aus der Hand Jahwes
  rationale: Die hebräische Körpermetapher für unmittelbare göttliche Urheberschaft wird bewahrt; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: עָלַי הִשְׂכִּיל
  choice: hat er mir verständlich gemacht
  rationale: Der Hifil von שׂכל drückt das Verleihen von Einsicht beziehungsweise das Verständlichmachen aus. „Mir“ nimmt עָלַי idiomatisch auf, ohne die schwierige Syntax zu überdehnen.
- source_word: כֹּל מַלְאֲכוֹת
  choice: alle Arbeiten
  rationale: מְלָאכוֹת umfasst die auszuführenden Arbeiten beziehungsweise Werkleistungen des Tempelbaus.
- source_word: הַתַּבְנִית
  choice: der Plan
  rationale: תַּבְנִית bezeichnet hier am natürlichsten den architektonischen Entwurf oder Bauplan; „Muster“ bleibt als lexikalische Alternative in der Fußnote erhalten.
theological_decisions:
- issue: Syntaktische Zuordnung der knappen Folge מִיַּד יְהוָה עָלַי הִשְׂכִּיל
  choice: Jahwe ist das unausgesprochene Subjekt von „hat er mir verständlich gemacht“; die Schrift kommt „aus der Hand Jahwes“.
  alternative: „Die Hand Jahwes war auf mir und gab mir Einsicht in alle Arbeiten des Plans.“
  rationale: Der Haupttext ergibt einen verständlichen deutschen Satz und wahrt die unmittelbare göttliche Urheberschaft. Wegen der gedrängten hebräischen Syntax wird die mögliche Konstruktion von עָלַי mit „Hand Jahwes“ in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete hebräische Metapher „aus der Hand Jahwes“ bleibt erhalten; der Doppelpunkt macht die nachgestellte Erläuterung natürlich lesbar.
