  naturalness: Der Haupttext ist verständlich und im würdigen modernen Standarddeutsch weitgehend natürlich. Die Formulierung „alle Arbeiten nach dem Plan“ ist jedoch weniger präzise als eine Genitivverbindung; der Doppelpunkt kann die nachgestellte Erläuterung klarer an den vorangehenden Satz anschließen.
