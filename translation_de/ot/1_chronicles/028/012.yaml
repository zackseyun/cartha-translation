id: 1CH.28.12
reference: 1 Chronicles 28:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/תַבְנִ֗ית כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה בָ/ר֨וּחַ֙ עִמּ֔/וֹ לְ/חַצְר֧וֹת בֵּית יְהוָ֛ה וּ/לְ/כָל הַ/לְּשָׁכ֖וֹת סָבִ֑יב לְ/אֹֽצְרוֹת֙ בֵּ֣ית הָ/אֱלֹהִ֔ים וּ/לְ/אֹצְר֖וֹת הַ/קֳּדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/012.yaml
  text: 'and the plan of all that was in the Spirit with him: for the courts of the house of Yahweh[a], for all the surrounding chambers, for the treasuries of the house of God, and for the treasuries of the holy things.'
translation:
  language: de
  text: 'und den Plan von allem, was ihm im Geist[a] vorlag: für die Vorhöfe des Hauses des HERRN, für alle Räume ringsum, für die Schatzkammern des Hauses Gottes und für die Schatzkammern der heiligen Dinge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was er in seinem Geist hatte“, das heißt, was David in seinem Sinn oder Herzen trug.'
    reason: alternative_reading
lexical_decisions:
- source_word: תַבְנִית
  choice: Plan
  rationale: Im Zusammenhang mit dem Tempelbau bezeichnet das Wort einen Bauplan oder Entwurf; „Plan“ ist präzise und in modernem Deutsch natürlich.
- source_word: כֹּל אֲשֶׁר
  choice: allem, was
  rationale: Die Wendung drückt die Gesamtheit dessen aus, was der Plan umfasste, und lässt sich so idiomatisch wiedergeben.
- source_word: הָיָה בָרוּחַ עִמּוֹ
  choice: was durch den Geist bei ihm war
  rationale: Die ungewöhnliche hebräische Formulierung bleibt erkennbar und deutet im Kontext auf göttliche Vermittlung, ohne die mögliche Bedeutung „in seinem Geist“ zu verdecken.
- source_word: לְחַצְרוֹת
  choice: für die Vorhöfe
  rationale: „Vorhöfe“ ist der übliche architektonische Ausdruck für die Hofbereiche des Tempels.
- source_word: בֵּית יְהוָה
  choice: Haus des HERRN
  rationale: „Haus“ bewahrt die hebräische Ausdrucksweise und bezeichnet hier den Tempel; der Gottesname wird konventionsgemäß mit „HERR“ wiedergegeben.
- source_word: לְשָׁכוֹת סָבִיב
  choice: Räume ringsum
  rationale: לְשָׁכוֹת bezeichnet Neben- oder Vorratsräume; „Räume ringsum“ ist verständlich und bildet die räumliche Anordnung knapp ab.
- source_word: אֹצְרוֹת
  choice: Schatzkammern
  rationale: Das Wort bezeichnet Aufbewahrungsräume für wertvolle, gestiftete oder heilige Bestände; „Schatzkammern“ passt zum Tempelkontext.
- source_word: בֵּית הָאֱלֹהִים
  choice: Haus Gottes
  rationale: Die wörtliche Bezeichnung wahrt die Parallele zu „Haus des HERRN“.
- source_word: הַקֳּדָשִׁים
  choice: die heiligen Dinge
  rationale: Der substantivierte Plural bezeichnet hier wahrscheinlich geheiligte beziehungsweise geweihte Gegenstände; die direkte Wiedergabe vermeidet eine unnötige Einengung.
theological_decisions:
- issue: Bedeutung von בָרוּחַ עִמּוֹ
  choice: 'Bezug auf den göttlichen Geist: „durch den Geist bei ihm war“'
  alternative: 'Bezug auf Davids eigenen Geist, Sinn oder Gedanken: „in seinem Geist war“'
  rationale: Der Zusammenhang mit dem von Gott verständlich gemachten Tempelplan in Vers 19 begünstigt einen Bezug auf Gottes Geist. Da die hebräische Formulierung jedoch auch anthropologisch verstanden werden kann, wird diese Spannung durch eine Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählungsstruktur des Hebräischen bleibt erhalten; architektonische Begriffe werden verständlich und ohne altertümliche Überprägung wiedergegeben.
