base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/006.yaml
  text: And he said to me[a], ‘Solomon your son—he will build my house and my courts, for I have chosen him for myself as a son, and I will be to him as a father.’
translation:
  language: de
  text: 'Und er sagte zu mir: »Salomo, dein Sohn – er wird mein Haus und meine Vorhöfe bauen; denn ihn habe ich mir zum Sohn erwählt, und ich werde ihm Vater sein.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Und er sagte zu mir
  rationale: Die Erzählform von אמר wird als Vergangenheit wiedergegeben; לִי bezeichnet den Adressaten. Die Formulierung bleibt transparent und natürlich.
- source_word: שְׁלֹמֹה בִנְךָ
  choice: dein Sohn Salomo
  rationale: Die im Deutschen natürliche Stellung bewahrt sowohl den Eigennamen als auch die Apposition.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen setzt Nachdruck auf Salomo; der Gedankenstrich und das ausdrücklich gesetzte »er« geben diesen Fokus wieder.
- source_word: יִבְנֶה בֵיתִי
  choice: wird mein Haus bauen
  rationale: »Haus« entspricht בַּיִת und bewahrt die im Kontext verständliche Bezeichnung des Tempels samt ihrer theologischen Resonanz.
- source_word: וַחֲצֵרוֹתָי
  choice: und meine Vorhöfe
  rationale: Im Tempelkontext bezeichnet חָצֵר die umschlossenen Hofbereiche; »Vorhöfe« ist dafür im Deutschen präzise und geläufig.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für Salomos Auftrag ein.
- source_word: בָחַרְתִּי בוֹ
  choice: ihn habe ich erwählt
  rationale: Die Voranstellung von »ihn« spiegelt den Fokus des hebräischen בּוֹ; »erwählt« gibt die göttliche Auswahl in angemessenem biblischem Register wieder.
- source_word: לִי לְבֵן
  choice: habe ich mir zum Sohn erwählt
  rationale: »mir zum Sohn« bildet beide לְ-Beziehungen idiomatisch ab, ohne sie in eine bloß funktionale Rolle abzuschwächen.
- source_word: וַאֲנִי אֶהְיֶה לוֹ לְאָב
  choice: und ich werde ihm Vater sein
  rationale: Diese natürliche deutsche Konstruktion bewahrt die relationale לְ-Formel enger als die ebenfalls mögliche Wiedergabe »ich werde sein Vater sein«.
theological_decisions:
- issue: Vater-Sohn-Sprache für Gottes Beziehung zu Salomo
  choice: »ihn habe ich mir zum Sohn erwählt, und ich werde ihm Vater sein«
  alternative: »ich habe ihn erwählt, mein Sohn zu sein, und ich werde sein Vater sein«
  rationale: Die Übersetzung erhält die königlich-bundestheologische Vater-Sohn-Aussage ohne Abschwächung, trägt aber keine späteren christologischen Schlussfolgerungen in den unmittelbaren Kontext ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich macht den Nachdruck des selbstständigen Pronomens הוּא hörbar. »Haus« und »Vorhöfe« bewahren die kultische Bildwelt des hebräischen Textes; »ihm Vater sein« erhält die markante Bundesformel und bleibt zugleich idiomatisch.
