  terminology: „Jahwe“ gibt den Gottesnamen konsequent wieder. „Erkenne“, „diene“, „Herz“, „Seele“, „suchst“, „verlässt“ und „verwerfen“ sind semantisch tragfähig und halten die unterschiedlichen hebräischen Begriffe hinreichend auseinander. Die Fußnoten stehen im deutschen Text an den jeweils einschlägigen Aussagen.
