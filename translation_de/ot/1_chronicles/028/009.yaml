  source_fidelity: Die Übersetzung gibt die Imperative, die doppelte Beschreibung der inneren Hingabe, das Erforschen aller Herzen, das Verstehen jeder inneren Gedankenregung sowie die beiden Konditionalsätze zuverlässig wieder. „wird er sich von dir finden lassen“ ist eine angemessene idiomatische Wiedergabe von יִמָּצֵא לָךְ und wahrt dessen passive/reflexive Form, ohne die Aussage dogmatisch zu erweitern. „für immer verwerfen“ trifft die Schärfe von יַזְנִיחֲךָ לָעַד.
