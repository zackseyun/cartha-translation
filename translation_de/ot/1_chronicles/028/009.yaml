source:
  edition: WLC
  text: וְ/אַתָּ֣ה שְׁלֹמֹֽה בְנִ֡/י דַּע֩ אֶת אֱלֹהֵ֨י אָבִ֜י/ךָ וְ/עָבְדֵ֗/הוּ בְּ/לֵ֤ב שָׁלֵם֙ וּ/בְ/נֶ֣פֶשׁ חֲפֵצָ֔ה כִּ֤י כָל לְבָבוֹת֙ דּוֹרֵ֣שׁ יְהוָ֔ה וְ/כָל יֵ֥צֶר מַחֲשָׁב֖וֹת מֵבִ֑ין אִֽם תִּדְרְשֶׁ֨/נּוּ֙ יִמָּ֣צֵא לָ֔/ךְ וְ/אִם תַּֽעַזְבֶ֖/נּוּ יַזְנִיחֲ/ךָ֥ לָ/עַֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/009.yaml
  text: And you[a], Solomon my son, know the God of your father and serve him with a whole heart and a willing soul, for Yahweh searches all hearts and understands every intention of the thoughts. If you seek him, he will let himself be found by you; but if you forsake him[b], he will cast you off forever.
translation:
  language: de
  text: Und du, mein Sohn Salomo, erkenne den Gott deines Vaters und diene ihm mit ungeteiltem Herzen und bereitwilliger Seele. Denn Jahwe erforscht alle Herzen und versteht jede Regung der Gedanken. Wenn du ihn suchst, wird er sich von dir finden lassen[a]; wenn du ihn aber verlässt, wird er dich für immer verwerfen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird er von dir gefunden werden“. Das hebräische Verb ist der Form nach passiv beziehungsweise reflexiv.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird er dich für immer von sich stoßen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּע
  choice: erkenne
  rationale: Der Imperativ fordert nicht nur sachliches Wissen, sondern persönliche Anerkennung und Beziehung zu Gott. „Erkenne“ bewahrt diese Tragweite knapp und würdig.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: den Gott deines Vaters
  rationale: Die Konstruktion bezeichnet den Gott des Vaters und betont die familiäre sowie bundesgeschichtliche Kontinuität zwischen David und Salomo.
- source_word: וְעָבְדֵהוּ
  choice: und diene ihm
  rationale: עבד umfasst hier hingebungsvollen Gehorsam und Gottesverehrung. „Diene ihm“ hält diese Bedeutungsbreite offen.
- source_word: בְּלֵב שָׁלֵם
  choice: mit ungeteiltem Herzen
  rationale: שָׁלֵם bezeichnet Ganzheit, Vollständigkeit und Lauterkeit. „Ungeteilt“ gibt die geforderte uneingeschränkte Hingabe natürlich wieder, ohne sündlose Vollkommenheit anzudeuten.
- source_word: וּבְנֶפֶשׁ חֲפֵצָה
  choice: und bereitwilliger Seele
  rationale: נֶפֶשׁ bezeichnet das innere Selbst beziehungsweise die Person; חֲפֵצָה drückt Willigkeit und Verlangen aus. „Bereitwillige Seele“ wahrt beide Aspekte.
- source_word: כִּי כָל לְבָבוֹת דּוֹרֵשׁ יְהוָה
  choice: Denn Jahwe erforscht alle Herzen
  rationale: דרשׁ bedeutet in diesem Zusammenhang untersuchen oder ergründen. „Erforscht“ macht deutlich, dass Gott das Innere prüft und nicht erst nach unbekannten Herzen suchen muss.
- source_word: וְכָל יֵצֶר מַחֲשָׁבוֹת מֵבִין
  choice: und versteht jede Regung der Gedanken
  rationale: יֵצֶר kann das Formen, die Neigung oder innere Regung bezeichnen. „Jede Regung der Gedanken“ bildet die ungewöhnliche hebräische Verbindung verständlich ab, ohne sie auf bewusste Absichten zu verengen.
- source_word: אִם תִּדְרְשֶׁנּוּ
  choice: Wenn du ihn suchst
  rationale: דרשׁ bezeichnet hier die hingebungsvolle und abhängige Hinwendung zu Gott. „Suchen“ ist die klare und etablierte deutsche Entsprechung.
- source_word: יִמָּצֵא לָךְ
  choice: wird er sich von dir finden lassen
  rationale: Die Niphal-Form ist passiv beziehungsweise reflexiv. Die Formulierung wahrt sowohl das menschliche Suchen als auch Gottes gewährten Selbsterweis; die streng passive Wiedergabe steht in der Fußnote.
- source_word: תַּעַזְבֶנּוּ
  choice: wenn du ihn aber verlässt
  rationale: עזב kann verlassen oder im Bundessinn treulos aufgeben bedeuten. „Verlässt“ ist im modernen Deutsch natürlich und behält durch den Kontext seine ernste bundesbezogene Kraft.
- source_word: יַזְנִיחֲךָ לָעַד
  choice: wird er dich für immer verwerfen
  rationale: Der Hiphil von זנח bezeichnet entschiedenes Zurückweisen beziehungsweise Verstoßen. „Verwerfen“ gibt die Schärfe der Warnung idiomatisch wieder; eine alternative Bildform steht in der Fußnote.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen verwendete Eigenname erkennbar bleibt und nicht durch einen Titel ersetzt wird.
theological_decisions:
- issue: Anthropologische Sprache von „Herz“ und „Seele“
  choice: Die beiden hebräischen Begriffe werden als „Herz“ und „Seele“ unterschieden beibehalten.
  alternative: Beide Ausdrücke psychologisch einzuengen, etwa als „Sinn“ oder „Denken“.
  rationale: Das Hebräische spricht mit לֵב und נֶפֶשׁ umfassend vom inneren Menschen. Die Unterscheidung bewahrt den Ruf zu ganzheitlicher Hingabe.
- issue: Gottes Findbarkeit in יִמָּצֵא לָךְ
  choice: „wird er sich von dir finden lassen“
  alternative: „wird er von dir gefunden werden“
  rationale: Die gewählte Fassung wahrt die passive beziehungsweise reflexive Form und die Spannung zwischen menschlichem Suchen und Gottes Sich-finden-Lassen, ohne daraus ein späteres Lehrsystem abzuleiten.
- issue: Schärfe der Warnung
  choice: „wird er dich für immer verwerfen“
  alternative: „wird er dich für immer von sich stoßen“
  rationale: Die Aussage wird in ihrer uneingeschränkten Ernsthaftigkeit belassen. Über weitergehende Fragen von Bundestreue oder Beharren entscheidet der Vers nicht ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt feierlich, aber verständlich. „Ungeteilt“ vermeidet die heute missverständliche Vorstellung moralischer Fehlerlosigkeit; „bereitwillige Seele“ erhält die hebräische anthropologische Bildsprache. Beide Fußnotenmarker stehen unmittelbar an den betreffenden Aussagen.
