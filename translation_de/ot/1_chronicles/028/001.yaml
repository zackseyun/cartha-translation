source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל דָּוִ֣יד אֶת כָּל שָׂרֵ֣י יִשְׂרָאֵ֡ל שָׂרֵ֣י הַ/שְּׁבָטִ֣ים וְ/שָׂרֵ֣י הַ/מַּחְלְק֣וֹת הַ/מְשָׁרְתִ֪ים אֶת הַ/מֶּ֟לֶךְ וְ/שָׂרֵ֣י הָ/אֲלָפִ֣ים וְ/שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/שָׂרֵ֣י כָל רְכוּשׁ וּ/מִקְנֶה֩ לַ/מֶּ֨לֶךְ וּ/לְ/בָנָ֜י/ו עִם הַ/סָּרִיסִ֧ים וְ/הַ/גִּבּוֹרִ֛ים וּֽ/לְ/כָל גִּבּ֥וֹר חָ֖יִל אֶל יְרוּשָׁלִָֽם־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/001.yaml
  text: 'Then David assembled at Jerusalem all the leaders of Israel: the leaders of the tribes[a], the leaders of the divisions that served the king, the commanders of thousands and of hundreds, and the leaders over all the property and livestock belonging to the king and to his sons, together with the officials, the mighty men, and every mighty man of valor.'
translation:
  language: de
  text: 'David versammelte alle führenden Männer Israels in Jerusalem: die Oberhäupter der Stämme, die Befehlshaber der Abteilungen, die dem König dienten, die Befehlshaber über Tausend und über Hundert, die Verantwortlichen für den gesamten Besitz und Viehbestand des Königs und seiner Söhne sowie die Hofbeamten[a], die Helden und jeden tapferen Krieger.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Eunuchen. Das hebräische Wort kann sowohl wörtlich Eunuchen als auch allgemein königliche Hofbeamte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: versammelte
  rationale: Der Hifil von קהל bezeichnet hier das Einberufen einer förmlichen Versammlung.
- source_word: כָּל שָׂרֵי יִשְׂרָאֵל
  choice: alle führenden Männer Israels
  rationale: שַׂר ist ein weiter Oberbegriff für leitende Amtsträger und Befehlshaber; die nachfolgende Aufzählung konkretisiert ihre Funktionen.
- source_word: שָׂרֵי הַשְּׁבָטִים
  choice: die Oberhäupter der Stämme
  rationale: Die Wiedergabe bezeichnet natürliche und verständliche Weise die leitenden Vertreter der einzelnen Stämme.
- source_word: שָׂרֵי הַמַּחְלְקוֹת הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: die Befehlshaber der Abteilungen, die dem König dienten
  rationale: מַחְלְקוֹת sind organisierte Dienstabteilungen; שָׂרֵי bezeichnet in diesem Zusammenhang ihre Befehlshaber.
- source_word: שָׂרֵי הָאֲלָפִים וְשָׂרֵי הַמֵּאוֹת
  choice: die Befehlshaber über Tausend und über Hundert
  rationale: Die hebräischen Bezeichnungen für militärisch-administrative Einheiten bleiben erhalten, ohne zu entscheiden, ob jeweils eine exakte Kopfzahl gemeint ist.
- source_word: רְכוּשׁ וּמִקְנֶה
  choice: Besitz und Viehbestand
  rationale: רְכוּשׁ bezeichnet Besitz beziehungsweise Vermögen, מִקְנֶה den Tierbestand im Allgemeinen.
- source_word: הַסָּרִיסִים
  choice: die Hofbeamten
  rationale: סָרִיס kann einen Eunuchen oder allgemeiner einen hohen Amtsträger am Königshof bezeichnen. In der administrativen Aufzählung steht wahrscheinlich die Funktion im Vordergrund; die engere Bedeutung wird in der Fußnote bewahrt.
- source_word: הַגִּבּוֹרִים
  choice: die Helden
  rationale: Der Ausdruck bezeichnet hier wahrscheinlich Davids bekannte, besonders ausgezeichnete Kämpfer.
- source_word: כָל גִּבּוֹר חָיִל
  choice: alle tapferen Krieger
  rationale: Die idiomatische Wendung beschreibt kampfstarke, bewährte Männer; die natürliche deutsche Wiedergabe wahrt den militärischen Sinn.
- source_word: אֶל יְרוּשָׁלִָם
  choice: in Jerusalem
  rationale: Obwohl אֶל gewöhnlich eine Richtung bezeichnet, drückt das Deutsche den Zielort einer einberufenen Versammlung idiomatisch mit „in Jerusalem“ aus; die Zusammenkunft findet dort statt.
