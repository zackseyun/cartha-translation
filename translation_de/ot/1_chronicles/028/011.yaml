base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/011.yaml
  text: Then David gave to Solomon his son the plan of the portico[a], its houses, its treasuries, its upper rooms, its inner chambers, and the house of the mercy seat.
translation:
  language: de
  text: Dann übergab David seinem Sohn Salomo den Bauplan für die Vorhalle, ihre Gebäude, Schatzkammern, oberen Gemächer und inneren Kammern sowie für den Raum des Sühnedeckels[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gnadenthron“. Das hebräische Wort bezeichnet den Deckel der Bundeslade im Allerheiligsten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  choice: Bauplan
  rationale: Im Zusammenhang mit dem Tempelbau bezeichnet das Wort ein vorgegebenes Muster beziehungsweise einen architektonischen Plan; „Bauplan“ ist hier präzise und natürlich.
- source_word: הָאוּלָם
  choice: die Vorhalle
  rationale: אוּלָם bezeichnet die hallenartige Eingangspartie eines monumentalen Gebäudes; „Vorhalle“ ist im Deutschen klar und im Tempelkontext etabliert.
- source_word: בָּתָּיו
  choice: ihre Gebäude
  rationale: Der Plural von בַּיִת kann hier die baulichen Einheiten des Tempelkomplexes meinen. „Gebäude“ vermeidet die im Deutschen irreführende Vorstellung gewöhnlicher Wohnhäuser.
- source_word: גַנְזַכָּיו
  choice: Schatzkammern
  rationale: Gemeint sind Räume zur Aufbewahrung von Kostbarkeiten oder geheiligten Gegenständen; „Schatzkammern“ gibt dies im Tempelkontext idiomatisch wieder.
- source_word: עֲלִיֹּתָיו
  choice: Obergemächer
  rationale: Das Wort bezeichnet Räume im oberen Stockwerk; „Obergemächer“ bewahrt den architektonischen und würdigen Sprachgebrauch.
- source_word: חֲדָרָיו הַפְּנִימִים
  choice: inneren Räume
  rationale: Die Wendung bezeichnet Räume im Inneren. „Innere Räume“ ist verständlich und macht aus dem Positiv keinen nicht ausdrücklich vorhandenen Superlativ.
- source_word: בֵית הַכַּפֹּרֶת
  choice: Raum des Süh/deckels
  rationale: Wörtlich steht „Haus des כַּפֹּרֶת“. Im architektonischen Kontext ist damit der Raum gemeint, in dem sich der Deckel der Bundeslade befand. „Raum“ ist im Deutschen verständlicher als „Haus“, während „Süh/deckel“ die kultische Funktion des Gegenstands erkennen lässt.
- source_word: וַיִּתֵּן
  choice: Dann übergab David
  rationale: Die Verbform führt die Erzählung weiter. Da ein Bauplan weitergereicht wird, ist „übergab“ natürlicher und präziser als das allgemeinere „gab“.
theological_decisions:
- issue: Wiedergabe von כַּפֹּרֶת in der Heiligtumsterminologie
  choice: Süh/deckel
  alternative: Gnadenthron
  rationale: כַּפֹּרֶת bezeichnet den Deckel der Bundeslade und ist zugleich mit dem Sühneritus verbunden. „Süh/deckel“ hält Gegenstand und Funktion zusammen, ohne die Deutung auf „Gnade“ oder „Thron“ festzulegen; die traditionelle Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung bleibt architektonisch klar; zusammengesetzte Kultbegriffe werden verständlich wiedergegeben, ohne ihre theologische Spannung vorschnell aufzulösen.
