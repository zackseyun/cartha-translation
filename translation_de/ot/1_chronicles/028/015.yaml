  text: וּ/מִשְׁקָ֞ל לִ/מְנֹר֣וֹת הַ/זָּהָ֗ב וְ/נֵרֹֽתֵי/הֶם֙ זָהָ֔ב בְּ/מִשְׁקַל מְנוֹרָ֥ה וּ/מְנוֹרָ֖ה וְ/נֵרֹתֶ֑י/הָ וְ/לִ/מְנֹר֨וֹת הַ/כֶּ֤סֶף בְּ/מִשְׁקָל֙ לִ/מְנוֹרָ֣ה וְ/נֵרֹתֶ֔י/הָ כַּ/עֲבוֹדַ֖ת מְנוֹרָ֥ה וּ/מְנוֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/015.yaml
  text: and the weight for the lampstands of gold and their lamps of gold[a], by the weight of each lampstand and its lamps; and for the lampstands of silver, by weight for each lampstand and its lamps, according to the service of each lampstand.
translation:
  language: de
  text: und das Gewicht für die goldenen Leuchter und ihre goldenen Lampen, entsprechend dem Gewicht jedes einzelnen Leuchters und seiner Lampen; und für die silbernen Leuchter entsprechend dem Gewicht jedes einzelnen Leuchters und seiner Lampen, entsprechend der Verwendung jedes einzelnen Leuchters.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen zweimal »Leuchter und Leuchter«; diese Wiederholung bezeichnet jeweils jeden einzelnen Leuchter.
    reason: Die Fußnote macht die distributive hebräische Ausdrucksweise sichtbar, die im Haupttext idiomatisch wiedergegeben wird.
lexical_decisions:
- source_word: מִשְׁקָל
  choice: Gewicht
  rationale: Das Substantiv bezeichnet hier die für die Herstellung festgelegte Gewichtsmenge; »Gewicht« passt zum Inventar- und Baukontext.
- source_word: מְנֹרוֹת
  choice: Leuchter
  rationale: מְנוֹרָה bezeichnet den Träger der einzelnen Lampen. »Leuchter« ist im deutschen Tempelkontext verständlich und unterscheidet ihn von den Lampen selbst.
- source_word: נֵרֹתֵיהֶם / נֵרֹתֶיהָ
  choice: Lampen
  rationale: נֵר bezeichnet die einzelnen am Leuchter angebrachten Lampen und wird daher vom Leuchter unterschieden.
- source_word: זָהָב / כֶּסֶף
  choice: golden / silbern
  rationale: Die Materialangaben werden natürlich und parallel als deutsche Adjektive wiedergegeben.
- source_word: בְּמִשְׁקַל מְנוֹרָה וּמְנוֹרָה
  choice: für jeden einzelnen Leuchter und seine Lampen das jeweilige Gewicht
  rationale: 'Die Wiederholung »Leuchter und Leuchter« ist distributiv: Für jeden Leuchter samt Lampen war ein eigenes Gewicht festgelegt.'
- source_word: כַּעֲבוֹדַת מְנוֹרָה וּמְנוֹרָה
  choice: je nach dem Verwendungszweck des jeweiligen Leuchters
  rationale: עֲבוֹדָה bezeichnet hier am ehesten die vorgesehene Aufgabe oder Verwendung jedes Leuchters. »Verwendungszweck« ist im Deutschen klarer als das missverständliche »Dienst des Leuchters«.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der Vers setzt den vorangehenden Satz fort; deshalb beginnt er mit »und«. Gedankenstriche gliedern die stark verdichtete Aufzählung. »Verwendungszweck« gibt die sachliche Funktion im Tempeldienst wieder, ohne eine bestimmte liturgische Deutung festzulegen.
