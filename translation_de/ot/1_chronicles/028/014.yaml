translation:
  language: de
  text: das Gold nach Gewicht für die goldenen Geräte, für alle Geräte jedes einzelnen Dienstes[a]; alle silbernen Geräte nach Gewicht, für alle Geräte jedes einzelnen Dienstes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen zweimal „Dienst“ („Dienst und Dienst“). Die Wiederholung ist distributiv gemeint: für jeden einzelnen Dienst beziehungsweise Verwendungszweck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָהָב
  choice: Gold
  rationale: Grundbezeichnung für das Material; der bestimmte Artikel wird im Deutschen in dieser listenartigen, elliptischen Formulierung nicht wiederholt.
- source_word: בַּמִּשְׁקָל
  choice: nach Gewicht
  rationale: Die Präposition ב mit מִשְׁקָל bezeichnet hier die Bemessung nach dem jeweiligen Gewicht.
- source_word: כְּלֵי
  choice: Geräte
  rationale: כְּלִי ist ein weiter Sammelbegriff für Gegenstände des Tempeldienstes; „Geräte“ bleibt im Deutschen breit und sachgerecht.
- source_word: עֲבוֹדָה
  choice: Dienst
  rationale: Im Tempelkontext bezeichnet das Wort die jeweilige kultische Aufgabe oder Verwendung.
- source_word: עֲבוֹדָה וַעֲבוֹדָה
  choice: je nach ihrem Dienst
  rationale: Die Wiederholung hat distributive Kraft. Die Formulierung gibt idiomatisch wieder, dass die Geräte nach den verschiedenen Diensten beziehungsweise Verwendungszwecken unterschieden werden.
- source_word: כֶּסֶף
  choice: Silber
  rationale: Bezeichnet parallel zu Gold das Material, das den Tempelgeräten nach Gewicht zugeteilt wird.
- source_word: לְכָל / לְכֹל
  choice: für alle
  rationale: Die Verbindung bezeichnet die umfassende Zuordnung zu sämtlichen Geräten.
