  text: וּ/לְ/מִזְבַּ֧ח הַ/קְּטֹ֛רֶת זָהָ֥ב מְזֻקָּ֖ק בַּ/מִּשְׁקָ֑ל וּ/לְ/תַבְנִ֣ית הַ/מֶּרְכָּבָ֗ה הַ/כְּרֻבִ֤ים זָהָב֙ לְ/פֹ֣רְשִׂ֔ים וְ/סֹכְכִ֖ים עַל אֲר֥וֹן בְּרִית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/018.yaml
  text: and for the altar of incense[a], refined gold by weight; and for the pattern of the chariot[b], the cherubim of gold spreading out their wings and overshadowing the ark of the covenant of Yahweh.
translation:
  language: de
  text: 'und für den Räucheraltar geläutertes Gold nach Gewicht; und für den Entwurf des Wagens[a]: die goldenen Kerubim, die ihre Flügel ausbreiten und die Lade des Bundes Jahwes überschatten[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Modell des Wagens“. Die hebräische Wendung ist schwierig; gemeint sein könnte die mit der Lade verbundene, von den Kerubim gebildete wagenartige Thronkonstruktion.
    reason: alternative_reading
  - marker: b
    text: Wörtlich auch „bedecken“ oder „überschatten“; dargestellt sind die Kerubim mit ausgebreiteten Flügeln über der Lade.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: Räucheraltar
  rationale: Die knappe, im modernen Deutschen geläufige Bezeichnung gibt die hebräische Genitivverbindung natürlich und eindeutig wieder.
- source_word: זָהָב מְזֻקָּק
  choice: geläutertes Gold
  rationale: מְזֻקָּק bezeichnet durch Läuterung gereinigtes Metall; „geläutert“ bewahrt diesen metallurgischen Sinn.
- source_word: בַּמִּשְׁקָל
  choice: nach Gewicht
  rationale: Die Wendung bezeichnet die mengenmäßige Zuteilung anhand eines festgelegten Gewichts.
- source_word: תַבְנִית הַמֶּרְכָּבָה
  choice: Entwurf des Wagens
  rationale: „Entwurf“ passt zum Zusammenhang der Tempelpläne, während „Wagen“ die ungewöhnliche und auslegungsbedürftige Bezeichnung מֶרְכָּבָה transparent erhält.
- source_word: הַכְּרֻבִים זָהָב
  choice: die goldenen Kerubim
  rationale: „Kerubim“ ist die etablierte deutsche Wiedergabe des hebräischen Plurals; „golden“ bezeichnet hier ihr Material.
- source_word: לְפֹרְשִׂים
  choice: die ihre Flügel ausbreiten
  rationale: Das Verb bedeutet „ausbreiten“; die Flügel sind im Kontext der Kerubim eindeutig mitgedacht und werden für verständliches Deutsch ergänzt.
- source_word: וְסֹכְכִים
  choice: und … beschirmen
  rationale: סכך bezeichnet ein schützendes Bedecken oder Überschatten. „Beschirmen“ bewahrt sowohl die räumliche als auch die schützende Bildkomponente.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Jahwes
  rationale: Die vollständige hebräische Genitivkette bleibt erhalten; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen im Deutschen direkt wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung des „Wagens“ und der Kerubim
  choice: Die schwierige Wagenbezeichnung bleibt im Haupttext erhalten; die Kerubim folgen erläuternd nach dem Doppelpunkt.
  alternative: Wagenthron beziehungsweise Kerubenthron
  rationale: Der Zusammenhang kann auf eine wagenartige Thronkonstruktion über der Lade weisen, doch der hebräische Text sagt ausdrücklich מֶרְכָּבָה („Wagen“). Eine eindeutige Deutung als Thron würde die echte Mehrdeutigkeit auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt macht die erläuternde Beziehung der goldenen Kerubim zum ungewöhnlichen „Entwurf des Wagens“ lesbar, ohne die schwierige hebräische Konstruktion dogmatisch festzulegen. Die Satzanfänge führen den im vorhergehenden Vers begonnenen Aufzählungssatz fort.
