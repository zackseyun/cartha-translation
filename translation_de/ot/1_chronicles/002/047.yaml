base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/047.yaml
  text: 'The sons of Jahdai: Regem, Jotham, Geshan, Pelet, Ephah, and Shaaph.'
translation:
  language: de
  text: 'Und die Söhne Jahdais: Regem, Jotam, Geschan, Pelet, Efa und Schaaf.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Die Konjunktion וּ wird als „Und“ wiedergegeben; בְנֵי ist die Status-constructus-Form des Plurals „Söhne“ und leitet hier eine genealogische Namensliste ein.
- source_word: יָהְדָּי
  choice: Jahdai
  rationale: Der Personenname wird in einer im Deutschen üblichen, hebräisch orientierten Form transliteriert.
- source_word: רֶגֶם
  choice: Regem
  rationale: Der Personenname wird direkt transliteriert.
- source_word: יוֹתָם
  choice: Jotam
  rationale: Diese deutsche Namensform gibt den hebräischen Anfangslaut jod mit „J“ wieder und ist gegenüber der englisch geprägten Form „Jotham“ vorzuziehen.
- source_word: גֵישָׁן
  choice: Geschan
  rationale: Der Personenname wird deutsch lesbar transliteriert; „sch“ gibt den hebräischen שׁ-Laut wieder.
- source_word: פֶלֶט
  choice: Pelet
  rationale: Der Personenname wird direkt und ohne unnötige Anglisierung transliteriert.
- source_word: עֵיפָה
  choice: Efa
  rationale: Der Personenname wird in deutscher Bibeltradition knapp als „Efa“ wiedergegeben; gemeint ist hier ein Eigenname, nicht die gleichlautende Maßeinheit.
- source_word: שָׁעַף
  choice: Schaaf
  rationale: Die Form bildet שׁ mit deutschem „sch“ ab und wahrt durch „aa“ die zweisilbige beziehungsweise durch den Kehllaut getrennte hebräische Lautfolge annähernd.
