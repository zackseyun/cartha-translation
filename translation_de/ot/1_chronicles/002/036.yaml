lexical_decisions:
- source_word: וְ/עַתַּי
  choice: Attai
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform transliteriert; das anknüpfende וְ wird im Deutschen am Versanfang nicht eigens wiedergegeben.
- source_word: הֹלִיד / הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in diesem genealogischen Zusammenhang das Zeugen beziehungsweise Vaterwerden. „Zeugte“ ist knapp, verständlich und für eine Geschlechtsfolge sachlich genau.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker hat keine direkte deutsche Entsprechung; seine Funktion wird durch den deutschen Satzbau ausgedrückt.
- source_word: נָתָן
  choice: Nathan
  rationale: Der Personenname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: וְ/נָתָן
  choice: und Nathan
  rationale: Die Konjunktion וְ wird mit „und“ wiedergegeben; der Personenname folgt in etablierter deutscher Form.
- source_word: זָבָד
  choice: Zabad
  rationale: Der Personenname wird in seiner etablierten deutschen biblischen Form transliteriert.
