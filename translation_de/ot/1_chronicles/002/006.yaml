source:
  edition: WLC
  text: וּ/בְנֵ֣י זֶ֗רַח זִ֠מְרִי וְ/אֵיתָ֧ן וְ/הֵימָ֛ן וְ/כַלְכֹּ֥ל וָ/דָ֖רַע כֻּלָּ֥/ם חֲמִשָּֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/006.yaml
  text: 'And the sons of Zerah: Zimri[a], Ethan, Heman, Kalkol[b], and Dara—five in all.'
translation:
  language: de
  text: 'Und die Söhne Serachs: Simri, Etan, Heman, Kalkol[a] und Dara[b] – insgesamt fünf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name wird auch Kalcol oder Calcol geschrieben.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch Dara; in der Parallelstelle 1. Könige 5,11 (nach anderer Verszählung 4,31) steht Darda.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: בְּנֵי ist der Konstruktplural von »Söhne«; die vorangestellte Konjunktion וּ wird als »Und« wiedergegeben und bewahrt den Listencharakter der Genealogie.
- source_word: זֶרַח
  choice: Serach
  rationale: Der Personenname wird in einer im Deutschen üblichen, dem Hebräischen nahen Form wiedergegeben.
- source_word: זִמְרִי
  choice: Simri
  rationale: Der Personenname wird nach gängiger deutscher Umschrift wiedergegeben.
- source_word: וְאֵיתָן
  choice: Etan
  rationale: Der Personenname wird in moderner deutscher Umschrift wiedergegeben; die vorangestellte Konjunktion wird durch die Aufzählungsstruktur ausgedrückt.
- source_word: וְהֵימָן
  choice: Heman
  rationale: Der Personenname wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: וְכַלְכֹּל
  choice: Kalkol
  rationale: Die Schreibung gibt die hebräischen Konsonanten transparent wieder; abweichende Umschriften werden in einer Fußnote genannt.
- source_word: וָדָרַע
  choice: und Dara
  rationale: Der masoretische Text dieses Verses lautet Dara. Die ähnliche Form Darda in der Parallelstelle wird nicht harmonisierend in den Haupttext übernommen, sondern in einer Fußnote dokumentiert.
- source_word: כֻּלָּם חֲמִשָּׁה
  choice: insgesamt fünf
  rationale: 'Die wörtliche Aussage »sie alle: fünf« wird in natürliches, knappes Deutsch übertragen, ohne den zusammenfassenden Sinn zu verlieren.'
theological_decisions: []
