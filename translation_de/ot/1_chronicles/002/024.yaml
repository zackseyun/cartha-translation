source:
  edition: WLC
  text: וְ/אַחַ֥ר מוֹת חֶצְר֖וֹן בְּ/כָלֵ֣ב אֶפְרָ֑תָה וְ/אֵ֤שֶׁת חֶצְרוֹן֙ אֲבִיָּ֔ה וַ/תֵּ֣לֶד ל֔/וֹ אֶת אַשְׁח֖וּר אֲבִ֥י תְקֽוֹעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/024.yaml
  text: After Hezron died in Caleb-ephrathah[a], Hezron’s wife Abijah bore to him Ashhur[b], the father of Tekoa.
translation:
  language: de
  text: Nach Hezrons Tod in Kaleb-Efrata[a] gebar ihm seine Frau Abija Aschhur, den Vater von Tekoa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung »in Kaleb-Efrata« ist schwer zu deuten. Sie kann eine Orts- oder Sippenbezeichnung meinen und wird traditionell als »Kaleb-Efrata« beziehungsweise »Kaleb Efrata« wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »den Gründer von Tekoa«. In Geschlechtsregistern kann »Vater von« auch den Gründer oder maßgeblichen Stammvater einer Ortschaft oder Sippe bezeichnen, nicht nur den unmittelbaren leiblichen Vater.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר מוֹת חֶצְרוֹן
  choice: Nach Hezrons Tod
  rationale: Die Verbindung aus אַחַר und dem Infinitiv מוֹת bezeichnet einen zeitlichen Anschluss. Die deutsche Nominalfügung ist natürlich und wahrt den Sinn des Hebräischen.
- source_word: בְּכָלֵב אֶפְרָתָה
  choice: in Kaleb-Efrata
  rationale: Die Präposition בְּ wird lokal verstanden. Die schwierige Wortfolge wird als zusammengehörige Orts- oder Sippenbezeichnung wiedergegeben; der Bindestrich macht diese Einheit sichtbar, ohne die Unsicherheit aufzulösen.
- source_word: וְאֵשֶׁת חֶצְרוֹן אֲבִיָּה
  choice: seine Frau Abija
  rationale: Die hebräische Fügung bezeichnet Abija als Hezrons Frau. Das Possessivpronomen bezieht sich im deutschen Satz eindeutig auf Hezron.
- source_word: וַתֵּלֶד לוֹ
  choice: gebar ihm
  rationale: Die Formulierung bewahrt sowohl die Bedeutung von יָלַד als auch den indirekten Bezug des Pronomens לוֹ.
- source_word: אַשְׁחוּר
  choice: Aschhur
  rationale: Die Umschrift gibt den Namen einschließlich der im masoretischen Text angezeigten Konsonantenverdopplung wieder.
- source_word: אֲבִי תְקוֹעַ
  choice: den Vater von Tekoa
  rationale: Dies ist die transparenteste Wiedergabe von אָב. Die in Genealogien mögliche Bedeutung „Gründer“ oder „Stammvater“ wird in einer Fußnote genannt.
theological_decisions: []
translation_notes:
