  text: וּ/בְנֵ֤י יָדָע֙ אֲחִ֣י שַׁמַּ֔י יֶ֖תֶר וְ/יוֹנָתָ֑ן וַ/יָּ֥מָת יֶ֖תֶר לֹ֥א בָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/032.yaml
  text: 'The sons of Jada[a], Shammai’s brother: Jether and Jonathan. Jether died without sons.'
translation:
  language: de
  text: Die Söhne Jadas, des Bruders Schammais, waren Jeter und Jonatan. Jeter starb, ohne Söhne zu haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Jeter starb – keine Söhne.“ Gemeint ist, dass er ohne Söhne starb.'
    reason: Die ungewöhnlich knappe hebräische Formulierung wird im Haupttext idiomatisch wiedergegeben.
lexical_decisions:
- source_word: וּבְנֵי
  choice: Die Söhne
  rationale: Der Status constructus im Plural eröffnet einen neuen genealogischen Abschnitt. Die einleitende Konjunktion wird im Deutschen nicht eigens wiedergegeben, da der Zusammenhang auch ohne „und“ natürlich fortgeführt wird.
- source_word: יָדָע
  choice: Jada
  rationale: Der hebräische Personenname wird in einer im Deutschen geläufigen Form wiedergegeben.
- source_word: אֲחִי שַׁמַּי
  choice: des Bruders Schammais
  rationale: Die Genitivfügung gibt die wörtliche Verwandtschaftsbezeichnung „Bruder Schammais“ klar und natürlich wieder; eine allgemeinere Bedeutung wie „Verwandter“ ist hier nicht erforderlich.
- source_word: יֶתֶר
  choice: Jeter
  rationale: Der Personenname wird an beiden Stellen einheitlich und nach deutscher Transliterationskonvention wiedergegeben.
- source_word: וְיוֹנָתָן
  choice: und Jonatan
  rationale: Die Konjunktion wird bewahrt; „Jonatan“ ist die übliche deutsche Namensform.
- source_word: וַיָּמָת
  choice: starb
  rationale: Die Verbform führt das nächste Ereignis der genealogischen Darstellung ein; das deutsche Präteritum ist dafür idiomatisch.
- source_word: לֹא בָנִים
  choice: ohne Söhne zu haben
  rationale: Die knappe hebräische Wendung lautet wörtlich „nicht Söhne“. Die Übersetzung macht idiomatisch deutlich, dass Jeter bei seinem Tod keine Söhne hatte, ohne daraus allgemein „kinderlos“ zu machen und damit mögliche Töchter auszuschließen.
theological_decisions: []
