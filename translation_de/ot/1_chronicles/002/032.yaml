  register: Moderne, würdige genealogische Prosa. Die Namen folgen gebräuchlichen deutschen Formen. Der ergänzte Satzanschluss „waren“ sorgt für einen natürlichen deutschen Nominalsatz, ohne den Inhalt zu erweitern.
