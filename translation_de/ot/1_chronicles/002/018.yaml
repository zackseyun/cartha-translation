  text: וְ/כָלֵ֣ב בֶּן חֶצְר֗וֹן הוֹלִ֛יד אֶת עֲזוּבָ֥ה אִשָּׁ֖ה וְ/אֶת יְרִיע֑וֹת וְ/אֵ֣לֶּה בָנֶ֔י/הָ יֵ֥שֶׁר וְ/שׁוֹבָ֖ב וְ/אַרְדּֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/018.yaml
  text: 'And Caleb son of Hezron fathered children by Azubah his wife[a], and by Jerioth; and these were her sons: Jesher, Shobab[b], and Ardon.'
translation:
  language: de
  text: Kaleb, der Sohn Hezrons, zeugte mit Asuba, seiner Frau, und mit Jeriot Kinder.[a] Ihre Söhne[b] waren Jescher, Schobab und Ardon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Satzkonstruktion ist schwierig. Jeriot kann entweder als eine zweite mit Kaleb verbundene Frau oder in manchen Deutungen als nähere Bezeichnung zu Asuba verstanden werden.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „ihre Söhne“. Der masoretische Text hat hier ein Suffix der 3. Person feminin Singular; manche Ausleger ordnen die Genealogie anders zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: zeugte … Kinder
  rationale: Der Hifil von ילד bezeichnet hier das Zeugen beziehungsweise Vaterwerden. Die Ergänzung „Kinder“ ergibt zusammen mit den folgenden Frauennamen eine natürliche deutsche Formulierung, ohne die schwierige Syntax unnötig wörtlich nachzubilden.
- source_word: אֶת עֲזוּבָה אִשָּׁה וְאֶת יְרִיעוֹת
  choice: mit Asuba, seiner Frau, und mit Jeriot
  rationale: Die hebräische Wortfolge ist gedrängt und syntaktisch schwierig. אִשָּׁה wird im genealogischen Zusammenhang appositionell als „seine Frau“ verstanden; Jeriot wird in der Hauptübersetzung als eine weitere mit Kaleb verbundene Frau wiedergegeben. Die Fußnote hält die mögliche andere Zuordnung offen.
- source_word: וְאֵלֶּה בָנֶיהָ
  choice: Ihre Söhne waren
  rationale: Das Suffix an בָנֶיהָ ist feminin Singular und wird daher mit „ihre“ wiedergegeben. Das Präteritum entspricht dem deutschen Erzählstil einer Genealogie.
- source_word: יֵשֶׁר וְשׁוֹבָב וְאַרְדּוֹן
  choice: Jescher, Schobab und Ardon
  rationale: Die Personennamen werden in einer im Deutschen gut lesbaren, an etablierten deutschen Bibelformen orientierten Umschrift wiedergegeben.
theological_decisions:
- issue: Genealogische Zuordnung der genannten Frauen und Söhne
  choice: Asuba wird als Kalebs Frau bezeichnet, Jeriot als weitere Frau verstanden; das feminine Suffix wird mit „ihre Söhne“ bewahrt.
  alternative: Jeriot kann appositionell mit Asuba verbunden sein; außerdem sind andere Rekonstruktionen der genealogischen Zuordnung vorgeschlagen worden.
  rationale: Der masoretische Text ist syntaktisch schwer, doch sein feminines Singularsuffix ist eindeutig bezeugt. Die Hauptübersetzung bietet eine verständliche Lesart, während die Fußnoten die echte Zuordnungsunsicherheit offenhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem genealogischem Ton. Die Namensformen folgen gebräuchlichen deutschen Bibeltransliterationen. Die schwer verständliche hebräische Syntax wird behutsam geglättet, ohne die genealogische Mehrdeutigkeit zu verschweigen.
