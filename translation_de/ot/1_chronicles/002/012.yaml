lexical_decisions:
- source_word: וּ/בֹעַז
  choice: Boas
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben; die vorangestellte Konjunktion wird im Deutschen zwischen den beiden Teilsätzen ausgedrückt.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in diesem genealogischen Zusammenhang das männliche Hervorbringen beziehungsweise Vaterwerden. „Zeugte“ ist knapp, präzise und im Deutschen für Stammbäume verständlich.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: Der hebräische Akkusativmarker hat keine natürliche direkte Entsprechung im Deutschen; seine Funktion wird durch Satzbau und Kasus ausgedrückt.
- source_word: עוֹבֵד
  choice: Obed
  rationale: Der Personenname wird in der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: וְ/עוֹבֵד
  choice: und Obed
  rationale: Die Konjunktion ו verbindet die beiden genealogischen Aussagen und wird mit „und“ wiedergegeben.
- source_word: יִשָׁי
  choice: Isai
  rationale: Der Personenname wird in der etablierten deutschen biblischen Form wiedergegeben.
