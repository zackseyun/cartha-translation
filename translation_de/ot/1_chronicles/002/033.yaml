source:
  edition: WLC
  text: וּ/בְנֵ֥י יוֹנָתָ֖ן פֶּ֣לֶת וְ/זָזָ֑א אֵ֥לֶּה הָי֖וּ בְּנֵ֥י יְרַחְמְאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/033.yaml
  text: 'And the sons of Jonathan: Peleth and Zaza. These were the sons of Jerahmeel.'
translation:
  language: de
  text: Und die Söhne Jonatans waren Pelet und Sasa. Diese waren die Söhne Jerachmeels.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יוֹנָתָן
  choice: Und die Söhne Jonatans waren
  rationale: Das ו wird zur Fortführung der genealogischen Reihe mit „Und“ wiedergegeben. Die deutsche Genitivkonstruktion ist natürlich; „waren“ ergänzt die im ersten Nominalsatz vorausgesetzte Kopula.
- source_word: פֶּלֶת
  choice: Pelet
  rationale: Der Personenname wird in einer im Deutschen geläufigen, eng am Hebräischen orientierten Form transkribiert.
- source_word: וְזָזָא
  choice: und Sasa
  rationale: Die Konjunktion verbindet den zweiten Sohn mit dem ersten. Die Wiedergabe „Sasa“ folgt der üblichen deutschen Transkription des hebräischen Namens.
- source_word: אֵלֶּה
  choice: Diese
  rationale: Das Demonstrativpronomen verweist auf die zuvor genannten Personen und lässt sich im Deutschen knapp und eindeutig mit „Diese“ wiedergeben.
- source_word: הָיוּ
  choice: waren
  rationale: היה dient hier als Kopula zur genealogischen Zuordnung, nicht im Sinn von „werden“.
- source_word: בְּנֵי יְרַחְמְאֵל
  choice: die Söhne Jerachmeels
  rationale: בְּנֵי wird formal als „Söhne“ bewahrt; der Name wird nach geläufiger deutscher Form als „Jerachmeel“ wiedergegeben.
theological_decisions:
- issue: Reichweite der abschließenden Aussage „Diese waren die Söhne Jerachmeels“
  choice: Die formale Bezeichnung „Söhne“ bleibt erhalten.
  alternative: „Diese waren die Nachkommen Jerachmeels.“
  rationale: Im genealogischen Zusammenhang kann בְּנֵי auch eine weitere Abstammungsbeziehung bezeichnen. Da der hebräische Text jedoch ausdrücklich „Söhne“ sagt, wird die Spannung nicht durch „Nachkommen“ aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper genealogischer Satzstruktur. Die traditionellen deutschen Namensformen Pelet, Sasa und Jerachmeel werden verwendet.
