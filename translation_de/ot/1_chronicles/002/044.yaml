base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/044.yaml
  text: Shema fathered Raham[a], the father of Jorkeam; and Rekem fathered Shammai.
translation:
  language: de
  text: Schema zeugte Raham[a], den Vater von Jorkeam; und Rekem zeugte Schammai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Raham, den Gründer oder Stammvater von Jorkeam.“ Der hebräische Ausdruck „Vater von“ kann besonders in Geschlechtsregistern auch einen Gründer oder Stammvater einer Sippe oder Ortschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet die Hifil-Form von ילד gewöhnlich das Hervorbringen eines Nachkommen. „Zeugte“ ist im Deutschen knapp, würdevoll und für Geschlechtsregister geläufig.
- source_word: אֲבִי
  choice: den Vater
  rationale: Die Grundbedeutung „Vater“ bewahrt die hebräische Ausdrucksweise. Da אָב bei Sippen- oder Ortsnamen auch einen Gründer oder Stammvater bezeichnen kann, wird diese Möglichkeit in einer Fußnote offengehalten.
- source_word: יָרְקֳעָם
  choice: Jorkeam
  rationale: Der Eigenname wird nach seiner hebräischen Form ins Deutsche übertragen; ob er hier eine Person, Sippe oder Ortschaft bezeichnet, wird nicht im Haupttext festgelegt.
- source_word: שֶׁמַע
  choice: Schema
  rationale: Deutsche Umschrift des hebräischen Eigennamens.
- source_word: רַחַם
  choice: Reham
  rationale: Deutsche Umschrift des hebräischen Eigennamens.
- source_word: רֶקֶם
  choice: Rekem
  rationale: Deutsche Umschrift des hebräischen Eigennamens.
- source_word: שַׁמָּי
  choice: Schammai
  rationale: Deutsche Umschrift des hebräischen Eigennamens.
