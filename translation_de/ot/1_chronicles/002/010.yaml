lexical_decisions:
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet der Hifil von ילד das männliche Zeugen. „Zeugte“ ist im Deutschen knapp, geläufig und der Stammbaumform angemessen.
- source_word: נְשִׂיא
  choice: Anführer
  rationale: נָשִׂיא bezeichnet hier eine herausgehobene leitende Person. „Anführer“ ist verständlich und vermeidet die möglicherweise monarchisch oder erblich klingende Bedeutung von „Fürst“.
- source_word: בְּנֵי יְהוּדָה
  choice: der Söhne Judas
  rationale: Die Formulierung gibt die ausdrücklich männliche und genealogisch-stammesbezogene Wendung des Hebräischen direkt wieder.
- source_word: רָם / עַמִּינָדָב / נַחְשׁוֹן
  choice: Ram / Amminadab / Nachschon
  rationale: Die Personennamen werden nach gebräuchlicher deutscher Bibeltradition transliteriert; שׁ wird in „Nachschon“ durch „sch“ wiedergegeben.
