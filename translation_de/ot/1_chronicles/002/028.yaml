  yaml_path: translation/ot/1_chronicles/002/028.yaml
  text: The sons of Onam were Shammai and Jada[a]. The sons of Shammai were Nadab and Abishur.
translation:
  language: de
  text: Die Söhne Onams waren Schammai und Jada. Und die Söhne Schammais waren Nadab und Abischur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: waren
  rationale: In der genealogischen Formel dient היה als Kopula; „waren“ gibt dies im Deutschen natürlich und genau wieder.
- source_word: בְנֵי
  choice: die Söhne
  rationale: Der Zusammenhang nennt die unmittelbare männliche Nachkommenschaft; „Söhne“ ist daher genauer als „Kinder“ oder „Nachkommen“.
- source_word: אוֹנָם
  choice: Onam
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibelnamensform wiedergegeben.
- source_word: שַׁמַּי
  choice: Schammai
  rationale: Der Personenname wird in beiden Vorkommen einheitlich in der gebräuchlichen deutschen Form wiedergegeben.
- source_word: יָדָע
  choice: Jada
  rationale: Der Personenname wird entsprechend seiner hebräischen Konsonantenform und der gebräuchlichen deutschen Bibelnamensform transliteriert.
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Das hebräische ו wird als „Und“ beibehalten, weil es die nächste genealogische Verzweigung ausdrücklich an die vorherige Aussage anschließt.
- source_word: נָדָב
  choice: Nadab
  rationale: Gebräuchliche deutsche Wiedergabe des Personennamens.
- source_word: אֲבִישׁוּר
  choice: Abischur
  rationale: Gebräuchliche deutsche Wiedergabe des Personennamens mit „sch“ für den hebräischen Sch-Laut.
