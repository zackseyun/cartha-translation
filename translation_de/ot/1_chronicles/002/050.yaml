  register: Modernes, gut verständliches Standarddeutsch mit würdigem genealogischem Stil. Die Genitivfolge ist bewusst beibehalten, um die wahrscheinlichste Zuordnung von „Erstgeborener Efratas“ zu Hur sichtbar zu machen.
