id: 1CH.2.50
reference: 1 Chronicles 2:50
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵ֤לֶּה הָיוּ֙ בְּנֵ֣י כָלֵ֔ב בֶּן ח֖וּר בְּכ֣וֹר אֶפְרָ֑תָה שׁוֹבָ֕ל אֲבִ֖י קִרְיַ֥ת יְעָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/050.yaml
  text: 'These were the sons of Caleb son of Hur[a], the firstborn of Ephrathah: Shobal, father of Kiriath-jearim.'
translation:
  language: de
  text: 'Das waren die Söhne Kalebs, des Sohnes Hurs, des Erstgeborenen Efratas: Schobal, der Vater von Kirjat-Jearim.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „der Gründer von Kirjat-Jearim“ beziehungsweise „der Stammvater von Kirjat-Jearim“; das hebräische „Vater von“ kann in genealogischen Zusammenhängen den Gründer einer Siedlung oder den Stammvater einer dort ansässigen Sippe bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הָיוּ
  choice: Das waren
  rationale: Die Verbindung aus Demonstrativpronomen und Qal Perfekt von היה leitet rückblickend eine genealogische Angabe ein; „Das waren“ ist im modernen Deutschen natürlich.
- source_word: בְּנֵי כָלֵב
  choice: die Söhne Kalebs
  rationale: בְּנֵי bezeichnet wörtlich „Söhne“; der Genitiv gibt die hebräische Konstruktverbindung knapp und würdig wieder.
- source_word: בֶּן חוּר
  choice: des Sohnes Hurs
  rationale: Die Apposition identifiziert Kaleb als Sohn Hurs. Die deutsche Genitivkette erhält die syntaktische Zuordnung.
- source_word: בְּכוֹר אֶפְרָתָה
  choice: des Erstgeborenen Efratas
  rationale: 'Die Wendung bezieht sich grammatisch am ehesten auf Hur: Hur ist der Erstgeborene Efratas. Die Formulierung bewahrt diese Zuordnung, ohne Efrata näher zu deuten.'
- source_word: שׁוֹבָל
  choice: Schobal
  rationale: Gebräuchliche deutsche Umschrift des Personennamens.
- source_word: אֲבִי
  choice: der Vater von
  rationale: Die Grundbedeutung „Vater von“ bleibt im Haupttext erhalten; im genealogischen Siedlungskontext kann das Wort auch einen Gründer oder Stammvater bezeichnen.
- source_word: קִרְיַת יְעָרִים
  choice: Kirjat-Jearim
  rationale: Der Ortsname wird nach geläufiger deutscher biblischer Namensform transliteriert und nicht als „Waldstadt“ übersetzt.
theological_decisions: []
