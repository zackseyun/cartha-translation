base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/003.yaml
  text: 'The sons of Judah: Er[a], Onan, and Shelah; three were born to him by Bath-shua the Canaanite. Er, Judah’s firstborn, was evil in the sight of Yahweh[b], and he put him to death.'
translation:
  language: de
  text: 'Die Söhne Judas: Er, Onan und Schela. Diese drei wurden ihm von der Tochter Schuas, der Kanaaniterin[a], geboren. Er, Judas Erstgeborener, war böse in den Augen Jahwes, und Jahwe tötete ihn.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »von der Tochter Schuas, der Kanaaniterin«; manche verstehen »Bat-Schua« hier als Eigennamen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »und er tötete ihn«. Der Handlungsträger wird im Hebräischen nicht ausdrücklich genannt, ist im Zusammenhang aber Jahwe aus dem vorhergehenden Satzteil.'
    reason: source_language_clarification
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: Die Söhne Judas
  rationale: Die Konstruktverbindung bezeichnet Judas Söhne beziehungsweise Nachkommen; die Formulierung bewahrt den genealogischen Stil.
- source_word: שְׁלוֹשָׁה נוֹלַד לוֹ
  choice: Diese drei wurden ihm geboren
  rationale: Die ausdrückliche Zahl bleibt erhalten; das Passiv gibt den Nifal von ילד quellennah wieder.
- source_word: מִבַּת שׁוּעַ הַכְּנַעֲנִית
  choice: von der Tochter Schuas, der Kanaaniterin
  rationale: Die Wortfolge lässt sich unmittelbar als »von der Tochter Schuas« lesen; das feminine Gentilizium bezeichnet die Frau als Kanaaniterin. Die mögliche Auffassung von בת־שוע als Eigenname wird in der Fußnote bewahrt.
- source_word: בְּכוֹר יְהוּדָה
  choice: Judas Erstgeborener
  rationale: Die deutsche Genitivverbindung gibt die hebräische Konstruktverbindung knapp und natürlich wieder.
- source_word: רַע בְּעֵינֵי יְהוָה
  choice: war böse in den Augen Jahwes
  rationale: Die feste hebräische Bewertungsformel wird samt ihrem Bild bewahrt und ist im Deutschen verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die geläufige deutsche Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: וַיְמִיתֵהוּ
  choice: und er tötete ihn
  rationale: Der Hifil von מות bezeichnet hier das Herbeiführen des Todes. Das Pronomen erhält den im Hebräischen nicht eigens genannten, aus dem vorherigen Satzteil erschlossenen Handlungsträger.
theological_decisions:
- issue: Nicht ausdrücklich genannter Handlungsträger von וַיְמִיתֵהוּ
  choice: und er tötete ihn
  alternative: und Jahwe tötete ihn
  rationale: Die Verbform nennt den Handlungsträger nicht eigens; im Zusammenhang verweist er am natürlichsten auf Jahwe. Die pronominale Fassung bewahrt jedoch die Ausdrucksweise und die geringe formale Offenheit des Hebräischen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext bietet einen Eigennamen. »Jahwe« gibt ihn im modernen Standarddeutsch erkennbar wieder, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappem genealogischem Ton. Die hebräische Bewertungsformel »in den Augen Jahwes« bleibt erhalten. Alle Fußnotenmarker stehen im Haupttext.
