  text: וְ/תָמָר֙ כַּלָּת֔/וֹ יָ֥לְדָה לּ֖/וֹ אֶת פֶּ֣רֶץ וְ/אֶת זָ֑רַח כָּל בְּנֵ֥י יְהוּדָ֖ה חֲמִשָּֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/004.yaml
  text: Tamar[a], his daughter-in-law, bore Perez and Zerah to him[b]. All the sons of Judah were five.
translation:
  language: de
  text: Seine Schwiegertochter Tamar gebar ihm Perez[a] und Serach. Damit hatte Juda insgesamt fünf Söhne.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name wird auch „Peres“ geschrieben.
    reason: lexical_alternative
  - marker: b
    text: Die fünf Söhne sind Er, Onan, Schela, Perez und Serach.
    reason: cross_reference
lexical_decisions:
- source_word: תָמָר
  choice: Tamar
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: כַּלָּתוֹ
  choice: seine Schwiegertochter
  rationale: כַּלָּה mit Suffix bezeichnet hier die Frau eines Sohnes; „Schwiegertochter“ ist die genaue und natürliche deutsche Verwandtschaftsbezeichnung.
- source_word: יָלְדָה לּוֹ
  choice: gebar ihm
  rationale: Das Verb bezeichnet das Gebären; die Präposition mit Suffix stellt die Kinder in genealogischer Hinsicht zu Juda in Beziehung. Die knappe Form passt zum Charakter des Stammbaums.
- source_word: פֶּרֶץ
  choice: Perez
  rationale: „Perez“ ist eine im Deutschen gebräuchliche Wiedergabe des hebräischen Personennamens; „Peres“ ist ebenfalls verbreitet.
- source_word: זָרַח
  choice: Serach
  rationale: „Serach“ entspricht der im Deutschen etablierten biblischen Namensform.
- source_word: כָּל בְּנֵי יְהוּדָה חֲמִשָּׁה
  choice: Damit hatte Juda insgesamt fünf Söhne
  rationale: Die Formulierung gibt die hebräische zusammenfassende Zählung idiomatisch wieder und behält die ausdrücklich männliche Verwandtschaftsbezeichnung „Söhne“ bei.
theological_decisions:
- issue: Genealogische Zusammenfassung nach Perez und Serach
  choice: Damit hatte Juda insgesamt fünf Söhne.
  alternative: Alle Söhne Judas waren fünf.
  rationale: Der hebräische Satz zieht eine schlichte Gesamtsumme. Die gewählte Fassung macht den Rückbezug auf die zuvor genannten Söhne im natürlichen modernen Deutsch deutlich, ohne den Aussagegehalt zu erweitern.
- issue: Geschlechtsspezifische Verwandtschaftsbegriffe
  choice: Schwiegertochter und Söhne
  alternative: angeheiratete Verwandte und Kinder
  rationale: Die konkreten Verwandtschafts- und Geschlechtsangaben des hebräischen Textes werden bewahrt und nicht neutralisiert.
translation_notes:
  register: Knapper, würdiger genealogischer Stil in modernem Standarddeutsch. Die Satzstellung stellt Tamar samt Verwandtschaftsbezeichnung natürlich voran; „Damit … insgesamt“ verdeutlicht die Funktion des abschließenden hebräischen Summensatzes.
