base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/026.yaml
  text: Jerahmeel also had another wife, and her name was Atarah; she was the mother of Onam.
translation:
  language: de
  text: Jerachmeel hatte eine weitere Frau; sie hieß Atara und war die Mutter Onams.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי ... לִירַחְמְאֵל
  choice: Jerahmeël hatte
  rationale: Die hebräische Existenzkonstruktion mit היה und ל bezeichnet hier Besitz beziehungsweise Zugehörigkeit. Im Deutschen gibt „hatte“ dies natürlich und treffend wieder.
- source_word: אִשָּׁה אַחֶרֶת
  choice: noch eine andere Frau
  rationale: אִשָּׁה bezeichnet im genealogischen Zusammenhang eine Ehefrau; אַחֶרֶת kennzeichnet sie als eine weitere beziehungsweise andere Frau. „Noch eine andere Frau“ bringt beide Aspekte idiomatisch zum Ausdruck.
- source_word: וּשְׁמָהּ
  choice: sie hieß
  rationale: Die hebräische Namensformel wird in modernem Deutsch knapp und natürlich mit „sie hieß“ wiedergegeben.
- source_word: עֲטָרָה
  choice: Atara
  rationale: Der Personenname wird nach gängiger deutscher Schreibweise transliteriert.
- source_word: הִיא אֵם אוֹנָם
  choice: war die Mutter Onams
  rationale: Die Aussage wird als genealogische Identifikation natürlich wiedergegeben; das selbstständige Pronomen הִיא wird durch das ausdrücklich auf Atara bezogene „sie“ im vorhergehenden Satzteil hinreichend abgebildet.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige genealogische Prosa. Die Formulierung vermeidet eine unnötig wörtliche hebräische Existenzkonstruktion und bewahrt zugleich die Unterscheidung Ataras als weiterer Frau Jerahmeëls.
