  source_fidelity: 'Die Übersetzung gibt die genealogische Struktur des masoretischen Textes zuverlässig wieder: Kaleb wird als Bruder Jerachmeels bezeichnet; Mescha ist sein Erstgeborener und „Vater von Sif“; das schwierige Schlussglied mit Marescha und Hebron bleibt eng am hebräischen Wortlaut. „Vater von“ wahrt dabei die im Kontext mögliche Bedeutung von Vorfahr, Sippenhaupt oder Ortsgründer. Die Fußnote zu [a] dokumentiert die syntaktische Schwierigkeit, ohne eine Emendation vorzunehmen.'
