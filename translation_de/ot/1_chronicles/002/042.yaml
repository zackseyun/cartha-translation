  terminology: Die Namensformen Kaleb, Jerachmeel, Mescha, Sif, Marescha und Hebron sind im Deutschen vertretbar und untereinander konsistent. „Erstgeborener“ und „Vater von“ entsprechen dem hebräischen Register. Die kulturgeschichtliche Erläuterung zu „Vater von“ ist sachlich und nicht überinterpretierend.
