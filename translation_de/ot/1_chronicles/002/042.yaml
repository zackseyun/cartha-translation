id: 1CH.2.42
reference: 1 Chronicles 2:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְנֵ֤י כָלֵב֙ אֲחִ֣י יְרַחְמְאֵ֔ל מֵישָׁ֥ע בְּכֹר֖/וֹ ה֣וּא אֲבִי זִ֑יף וּ/בְנֵ֥י מָרֵשָׁ֖ה אֲבִ֥י חֶבְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/042.yaml
  text: 'And the sons of Caleb the brother of Jerahmeel: Mesha his firstborn[a], who was the father of Ziph[b], and the sons of Mareshah the father of Hebron.'
translation:
  language: de
  text: 'Und die Söhne Kalebs, des Bruders Jerachmeels: Mescha, sein Erstgeborener – er war der Vater von Sif[b] – und die Söhne Mareschas, des Vaters von Hebron.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Satzfügung im letzten Teil des Verses ist schwierig. Der masoretische Text lautet wörtlich: „und die Söhne Mareschas, des Vaters von Hebron“. Manche verstehen die Aussage so, dass Marescha der Vater von Hebron war; andere lassen die ungewöhnliche Formulierung unverändert stehen.'
    reason: alternative_reading
  - marker: b
    text: „Vater von“ kann in den Chronikbüchern außer einem leiblichen Vater auch einen Vorfahren, ein Sippenoberhaupt oder den Gründer beziehungsweise Repräsentanten eines Ortes bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Die feste genealogische Formel wird wörtlich bewahrt; „Söhne“ kann im Zusammenhang auch weitere Nachkommen bezeichnen.
- source_word: כָלֵב
  choice: Kaleb
  rationale: Eingebürgerte deutsche Schreibweise des Personennamens.
- source_word: אֲחִי יְרַחְמְאֵל
  choice: des Bruders Jerachmeels
  rationale: Die Apposition gibt die Konstruktverbindung knapp und natürlich wieder.
- source_word: מֵישָׁע
  choice: Mescha
  rationale: Deutsche Transliteration des Eigennamens.
- source_word: בְּכֹרוֹ
  choice: sein Erstgeborener
  rationale: Bewahrt sowohl die genealogische Aussage als auch die mit der Erstgeburt verbundene Stellung.
- source_word: הוּא
  choice: er war
  rationale: Das selbstständige Pronomen greift Mescha wieder auf; die deutsche Kopula wird für einen vollständigen Satz ergänzt.
- source_word: אֲבִי זִיף
  choice: der Vater von Sif
  rationale: „Vater“ erhält die Mehrdeutigkeit zwischen leiblichem Vater, Vorfahren, Sippenoberhaupt und Gründer beziehungsweise Bezugsperson eines Ortes.
- source_word: וּבְנֵי מָרֵשָׁה
  choice: und die Söhne Mareschas
  rationale: Die masoretische genealogische Formel wird trotz der schwierigen Satzfügung nicht geglättet oder emendiert.
- source_word: אֲבִי חֶבְרוֹן
  choice: des Vaters von Hebron
  rationale: Die Apposition wird formal an Marescha angeschlossen; die Fußnote weist auf die syntaktische Unsicherheit hin.
theological_decisions: []
