source:
  edition: WLC
  text: וַ/יִּהְי֤וּ בָנִים֙ לְ/שׁוֹבָ֔ל אֲבִ֖י קִרְיַ֣ת יְעָרִ֑ים הָרֹאֶ֖ה חֲצִ֥י הַ/מְּנֻחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/052.yaml
  text: 'And Shobal the father of Kiriath-jearim had sons: Haroeh[c][b][a], half of the Manahathites.'
translation:
  language: de
  text: 'Und Schobal, der Vater von Kirjat-Jearim[a], hatte Söhne: Haroeh[b] und die Hälfte der Menuhotiter[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Gründer von Kirjat-Jearim«. In Stammbäumen kann »Vater von« einen Ahnherrn oder den maßgeblichen Gründer eines Ortes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Haroeh ist möglicherweise ein Personenname, der in manchen Überlieferungen als »Reaja« wiedergegeben wird; die hebräische Form könnte auch »der Sehende« beziehungsweise »der Seher« bedeuten.
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: »die Hälfte der Menuhot«. Gemeint sein kann die Hälfte von Menuhot oder die Hälfte der dortigen Bevölkerung beziehungsweise Sippe; der Name wird auch mit Manahat verbunden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְשׁוֹבָל
  choice: Schobal ... hatte Söhne
  rationale: Die hebräische Besitzkonstruktion »Schobal wurden/gehörten Söhne« wird im Deutschen natürlich als »Schobal hatte Söhne« wiedergegeben.
- source_word: אֲבִי קִרְיַת יְעָרִים
  choice: der Vater von Kirjat-Jearim
  rationale: Die wörtliche Wiedergabe bewahrt die genealogische Ausdrucksweise; »Vater« kann hier auch einen Ahnherrn, Gründer oder führenden Angehörigen des Ortes bezeichnen.
- source_word: קִרְיַת יְעָרִים
  choice: Kirjat-Jearim
  rationale: Der Ortsname wird entsprechend seiner hebräischen Form transliteriert und nicht als »Waldstadt« übersetzt.
- source_word: הָרֹאֶה
  choice: Haroeh
  rationale: Im genealogischen Zusammenhang wird die Form als Eigenname verstanden und transliteriert, ohne sie durch »der Seher« zu deuten.
- source_word: חֲצִי הַמְּנֻחוֹת
  choice: die Hälfte der Menuhotiter
  rationale: Die Wendung lautet wörtlich »die Hälfte der Menuhot«. Im genealogisch-geografischen Zusammenhang kann sie eine Hälfte der zu Menuhot beziehungsweise Manahat gehörenden Sippe oder Bevölkerung bezeichnen.
