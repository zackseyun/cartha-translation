  text: וּ/בְנֵ֥י חֶצְר֖וֹן אֲשֶׁ֣ר נוֹלַד ל֑/וֹ אֶת יְרַחְמְאֵ֥ל וְ/אֶת רָ֖ם וְ/אֶת כְּלוּבָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/009.yaml
  text: 'The sons of Hezron who were born to him: Jerahmeel[a], Ram, and Chelubai.'
translation:
  language: de
  text: 'Die Söhne Hezrons, die ihm geboren wurden: Jerachmeel, Ram und Kelubai.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kelubai ist wahrscheinlich dieselbe Person, die an anderen Stellen dieses Stammbaums Kaleb genannt wird.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Die Söhne
  rationale: Der Status constructus im Plural bezeichnet die »Söhne« Hezrons. Das vorangestellte וּ wird im natürlichen deutschen Genealogiestil nicht eigens mit »und« wiedergegeben.
- source_word: חֶצְרוֹן
  choice: Hezron
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamensform wiedergegeben.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: die ihm geboren wurden
  rationale: Die passive Form des Nifal von ילד mit לוֹ bleibt erhalten; zugleich ist die Formulierung in einem genealogischen Zusammenhang verständlich und würdevoll.
- source_word: אֶת
  choice: —
  rationale: Der hebräische Akkusativmarker hat im Deutschen keine eigenständige Entsprechung.
- source_word: יְרַחְמְאֵל
  choice: Jerachmeël
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, die hebräische Namensgestalt erkennbar bewahrenden Form wiedergegeben.
- source_word: רָם
  choice: Ram
  rationale: Direkte Wiedergabe des Personennamens.
- source_word: כְּלוּבָי
  choice: Kelubai
  rationale: Die im masoretischen Text vorliegende Namensform wird direkt wiedergegeben und nicht stillschweigend mit dem bekannteren Namen Kaleb harmonisiert.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper genealogischer Satzform. Die passive hebräische Wendung und die eigenständige Namensform Kelubai bleiben erhalten.
