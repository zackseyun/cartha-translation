lexical_decisions:
- source_word: וּבְנֵי
  choice: Die Söhne … waren
  rationale: Der Plural im Konstrukt mit vorangestellter Konjunktion leitet eine genealogische Angabe ein. Im Deutschen gibt die Formulierung mit „waren“ die Zugehörigkeit natürlich wieder; das einleitende „und“ muss am Versanfang nicht eigens abgebildet werden.
- source_word: נָדָב
  choice: Nadab
  rationale: Personenname in der im Deutschen üblichen biblischen Schreibweise.
- source_word: סֶלֶד
  choice: Seled
  rationale: Personenname; in beiden Vorkommen einheitlich wiedergegeben.
- source_word: וְאַפָּיִם
  choice: und Appajim
  rationale: Im genealogischen Zusammenhang ist die Form trotz ihrer Ähnlichkeit mit einem hebräischen Gattungswort eindeutig als Personenname zu verstehen. „Appajim“ bildet die hebräische Lautgestalt in deutscher Umschrift ab.
- source_word: וַיָּמָת
  choice: starb
  rationale: Die Wayyiqtol-Form von מוּת berichtet das folgende Ereignis. Das deutsche Präteritum gibt dies knapp und sachgemäß wieder.
- source_word: לֹא בָנִים
  choice: ohne Söhne
  rationale: Wörtlich steht „nicht Söhne“. Nach „Seled starb“ ist „ohne Söhne“ eine natürliche deutsche Wiedergabe. „Ohne Kinder“ wäre zu weit, da בָּנִים hier ausdrücklich Söhne bezeichnet.
