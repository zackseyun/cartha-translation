  text: 'The sons of Nadab: Seled and Appaim[a]. Seled died without sons.'
translation:
  language: de
  text: Die Söhne Nadabs waren Seled und Appajim. Seled starb ohne Söhne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seled starb und hatte keine Söhne.“'
