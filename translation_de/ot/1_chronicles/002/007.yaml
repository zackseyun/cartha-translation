  verdict: revise
  source_fidelity: Die genealogische Einleitung, die Namensform Achar und die Kennzeichnung als derjenige, der Israel ins Unglück brachte, geben den hebräischen Text zutreffend wieder. Die Konstruktion מָעַל בַּחֵרֶם bezeichnet jedoch einen Treuebruch im Zusammenhang mit dem Gebannten. »Sich an dem Gebannten verging« ist hierfür weniger präzise und im Deutschen semantisch missverständlich. Das Singular »das Gebannte« wahrt die Form des Hebräischen und kann den kollektiven Sachverhalt bezeichnen.
  naturalness: »Unheilstifter« ist verständlich, wirkt aber im modernen Standarddeutsch unnötig ungebräuchlich. Die verbale Formulierung »der Israel ins Unglück brachte« ist idiomatischer und gibt die Wirkung von עוֹכֵר klar wieder. »In Bezug auf das Gebannte treulos handelte« ist klar, würdevoll und natürlich.
  terminology: '»Das Gebannte« ist als Wiedergabe von חֵרֶם geeignet. Die Erläuterung sollte nicht pauschal behaupten, jeder betreffende Gegenstand sei zur Vernichtung bestimmt gewesen: Im Kontext von Josua 7 gehören auch Gott vorbehaltene Wertgegenstände dazu. Entscheidend sind Weihung an Gott und menschliches Aneignungsverbot.'
