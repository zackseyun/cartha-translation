  text: וּ/בְנֵ֖י כַּרְמִ֑י עָכָר֙ עוֹכֵ֣ר יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מָעַ֖ל בַּ/חֵֽרֶם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/007.yaml
  text: 'And the sons of Karmi: Achar[a], the troubler of Israel[b], who acted unfaithfully regarding the devoted things.'
translation:
  language: de
  text: 'Und die Söhne Karmis: Achar[a], der Israel ins Unglück brachte und in Bezug auf das Gebannte[b] treulos handelte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Achan«. Das Chronikbuch verwendet hier die Form »Achar«, vermutlich als Anklang an das folgende hebräische Wort für »ins Unglück bringen«. Siehe Josua 7.'
    reason: alternative_reading
  - marker: b
    text: 'Gemeint ist das, was dem Bann unterlag: Es war Gott geweiht und menschlicher Aneignung entzogen; je nach Fall konnte es zur Vernichtung bestimmt sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי כַּרְמִי
  choice: Und die Söhne Karmis
  rationale: Die hebräische genealogische Konstruktverbindung wird formal und im Deutschen natürlich mit dem Genitiv wiedergegeben. Der Plural bleibt trotz der anschließenden Nennung nur einer Person erhalten.
- source_word: עָכָר
  choice: Achar
  rationale: Der in 1. Chronik tatsächlich überlieferte Name עָכָר wird bewahrt und nicht an die aus Josua 7 bekannte Form Achan angeglichen.
- source_word: עוֹכֵר יִשְׂרָאֵל
  choice: der Unheilstifter Israels
  rationale: Das substantivierte Partizip bezeichnet Achar knapp als den, der Israel ins Unglück brachte. Die nominale Form erhält die pointierte Apposition; das hebräische Wortspiel zwischen עָכָר und עוֹכֵר lässt sich im Deutschen jedoch nicht vollständig nachbilden.
- source_word: מָעַל
  choice: sich verging
  rationale: Das Verb bezeichnet hier einen treulosen, sakrilegischen Verstoß. „Sich vergehen an“ ist in diesem Zusammenhang natürlich und bringt die schuldhafte Verletzung des Heiligen zum Ausdruck.
- source_word: בַּחֵרֶם
  choice: an dem Gebannten
  rationale: חֵרֶם meint hier das unter Bann Gestellte, das Gott übereignet und zur Vernichtung bestimmt war. Die substantivierte Wiedergabe bleibt knapp und wahrt den besonderen kultisch-rechtlichen Sinn.
theological_decisions:
- issue: Bedeutung von חֵרֶם im Zusammenhang von Achars Vergehen
  choice: dem Gebannten
  alternative: dem zur Vernichtung Geweihten; dem Bann
  rationale: Die Formulierung hält sowohl die Übereignung an Gott als auch das Verbot menschlicher Aneignung offen, ohne den Begriff im Haupttext einseitig auf bloße Zerstörung zu reduzieren. Eine Fußnote erläutert den historischen Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe genealogische Satzform und die auffällige Mehrzahl „Söhne“ bleiben erhalten. „Unheilstifter“ bewahrt die nominale Zuspitzung des Hebräischen; das Namenswortspiel wird in der Fußnote erklärt.
