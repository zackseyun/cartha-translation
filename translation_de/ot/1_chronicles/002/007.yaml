    rationale: Diese deutsche Wendung legt einen Übergriff gegen ein Objekt nahe und bildet den mit בְּ konstruierten Ausdruck für treuloses Handeln in der Angelegenheit des Gebannten nicht hinreichend genau ab.
  - severity: low
    issue: »Unheilstifter Israels«
    rationale: Die Formulierung ist möglich, aber für modernes Standarddeutsch weniger geläufig als eine knappe verbale Wiedergabe des Partizips.
  - severity: medium
    issue: 'Fußnote b: »zur Vernichtung bestimmt«'
    rationale: Die Erklärung ist zu pauschal, da der חרם im erzählerischen Kontext auch Gott geweihte und der menschlichen Aneignung entzogene Gegenstände umfasst, nicht nur zu vernichtende Dinge.
