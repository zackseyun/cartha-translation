base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/055.yaml
  text: 'and the families of the scribes who lived at Jabez: the Tirathites[a], the Shimeathites, and the Sucathites. These are the Kenites who came from Hammath, the father of the house of Rechab.'
translation:
  language: de
  text: 'Und die Sippen der Schreiber, die in Jabez wohnten: die Tiratiter, die Schimatiter und die Suchatiter. Das sind die Keniter, die von Hammat, dem Vater[a] des Hauses Rechab, kamen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Ahnherrn“ beziehungsweise „dem Gründer des Hauses Rechab“. Das hebräische Wort für „Vater“ kann in genealogischen Zusammenhängen auch einen Stammvater oder Gründer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת סֹפְרִים
  choice: Und die Sippen der Schreiber
  rationale: Das Waw bewahrt mit „Und“ den fortlaufenden Charakter der genealogischen Aufzählung. מִשְׁפָּחוֹת bezeichnet hier Familienverbände oder Sippen; סֹפְרִים wird in seiner üblichen Bedeutung als „Schreiber“ wiedergegeben, ohne ihre genaue gesellschaftliche Funktion näher festzulegen.
- source_word: ישבו יַעְבֵּץ
  choice: die in Jabez wohnten
  rationale: Die konsonantische Verbform wird als Plural „wohnten“ verstanden; Jabez bezeichnet den Wohnort. Der deutsche Relativsatz stellt den syntaktischen Bezug natürlich her.
- source_word: תִּרְעָתִים שִׁמְעָתִים שׂוּכָתִים
  choice: die Tiratiter, die Schimatiter und die Suchatiter
  rationale: Die drei Gruppenbezeichnungen werden als Eigennamen transliteriert und mit der im Deutschen üblichen Volksgruppenendung „-iter“ wiedergegeben.
- source_word: הֵמָּה הַקִּינִים
  choice: Sie sind die Keniter
  rationale: Das selbstständige Pronomen dient der Identifikation der zuvor genannten Gruppen. Das Präsens entspricht dem nominal-identifizierenden Stil des Hebräischen.
- source_word: הַבָּאִים מֵחַמַּת
  choice: die von Hammat kamen
  rationale: Das Partizip mit מִן kann Herkunft oder Bewegung vom Ausgangspunkt her ausdrücken. „Von Hammat kamen“ bewahrt diese Offenheit, ohne ausdrücklich eine Abstammung zu behaupten.
- source_word: אֲבִי בֵית רֵכָב
  choice: dem Vater des Hauses Rechab
  rationale: Die wörtliche Verwandtschafts- und Gründungsmetapher des Hebräischen bleibt im Haupttext erhalten. Eine Fußnote erläutert, dass „Vater“ hier auch Ahnherr oder Gründer bedeuten kann.
theological_decisions:
- issue: Bedeutung von אָב in der genealogischen Wendung אֲבִי בֵית רֵכָב
  choice: Vater des Hauses Rechab
  alternative: Ahnherr oder Gründer des Hauses Rechab
  rationale: Die formnahe Wiedergabe wahrt die genealogische Bildsprache und legt nicht fest, ob eine unmittelbare Vaterschaft, eine weiter zurückliegende Abstammung oder eine Gründerrolle gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sippen“ macht den Charakter größerer Familienverbände deutlicher als das enger wirkende „Familien“. Die Eigennamen werden in einer gut lesbaren deutschen Transliteration wiedergegeben; die knappe Listenstruktur des hebräischen Textes bleibt erhalten.
