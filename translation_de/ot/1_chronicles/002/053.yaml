base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/053.yaml
  text: 'And the clans of Kiriath-jearim: the Ithrites[a], the Puthites, the Shumathites, and the Mishraites[b]. From these came the Zorathites and the Eshtaolites.'
translation:
  language: de
  text: 'Und die Sippen[a] von Kirjat-Jearim waren: die Jitriter, die Putiter, die Schumatiter und die Mischraiter. Von diesen gingen[b] die Zoratiter und die Eschtaoliter aus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Familien«. Das hebräische Wort bezeichnet in Stammbäumen häufig größere Verwandtschaftsgruppen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »gingen hinaus«. Gemeint ist hier, dass diese Gruppen aus den zuvor genannten Sippen hervorgingen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת
  choice: Und die Sippen
  rationale: מִשְׁפָּחוֹת bezeichnet in genealogischen Zusammenhängen größere Verwandtschaftsgruppen; »Sippen« ist hier präziser als das leicht auf Kernfamilien bezogene »Familien«.
- source_word: קִרְיַת יְעָרִים
  choice: Kirjat-Jearim
  rationale: Der Ortsname wird in einer im Deutschen geläufigen, dem Hebräischen nahen Form wiedergegeben.
- source_word: הַיִּתְרִי
  choice: die Jitriter
  rationale: Die hebräische Gruppenbezeichnung wird als deutsches Gentiliz transliteriert.
- source_word: וְהַפּוּתִי
  choice: die Putiter
  rationale: Der Sippenname wird möglichst lautnah mit der deutschen Gruppenendung »-iter« wiedergegeben.
- source_word: וְהַשֻּׁמָתִי
  choice: die Schumatiter
  rationale: Die Transliteration bewahrt die volle hebräische Namensform und kennzeichnet die Gruppe durch »-iter«.
- source_word: וְהַמִּשְׁרָעִי
  choice: die Mischraiter
  rationale: Der hebräische Sippenname wird lautnah transliteriert, ohne seine unbekannte Bedeutung zu deuten.
- source_word: מֵאֵלֶּה
  choice: Von diesen
  rationale: Die Formulierung verweist knapp und unmittelbar auf die zuvor genannten Sippen.
- source_word: יָצְאוּ
  choice: gingen … aus
  rationale: Die deutsche Wendung bewahrt das Bild des hebräischen Verbs »hinausgehen« und drückt zugleich genealogische beziehungsweise gruppengeschichtliche Herkunft aus.
- source_word: הַצָּרְעָתִי
  choice: die Zoratiter
  rationale: Die Bezeichnung wird als von Zora abgeleiteter Gruppenname wiedergegeben.
- source_word: וְהָאֶשְׁתָּאֻלִי
  choice: die Eschtaoliter
  rationale: Die Form macht die Ableitung vom Ortsnamen Eschtaol erkennbar.
