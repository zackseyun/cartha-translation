source:
  edition: WLC
  text: וַ/יִּקַּ֣ח גְּשֽׁוּר וַ֠/אֲרָם אֶת חַוֺּ֨ת יָאִ֧יר מֵ/אִתָּ֛/ם אֶת קְנָ֥ת וְ/אֶת בְּנֹתֶ֖י/הָ שִׁשִּׁ֣ים עִ֑יר כָּל אֵ֕לֶּה בְּנֵ֖י מָכִ֥יר אֲבִי גִלְעָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/023.yaml
  text: But Geshur and Aram took the villages of Jair from them[a], along with Kenath and its daughter towns—sixty cities. All these were the sons of Machir[c][b], the father of Gilead.
translation:
  language: de
  text: Doch Geschur und Aram nahmen ihnen die Dörfer Jairs[a] weg, dazu Kenat und seine Tochterstädte[b] – insgesamt sechzig Städte. Diese alle waren Söhne Machirs[c], des Vaters Gileads.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Ortsname: »Hawwot-Jair«; der Name bedeutet etwa »Zeltdörfer Jairs«.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich »seine Töchter«; gemeint sind die von Kenat abhängigen Siedlungen.
    reason: cultural_note
  - marker: c
    text: »Söhne Machirs« kann hier auch Nachkommen oder Angehörige seiner Sippe bezeichnen, nicht nur unmittelbare Söhne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahmen … weg
  rationale: Die Wendung gibt die Wegnahme aus dem Besitz der zuvor genannten Gruppe natürlich wieder, ohne ausdrücklich festzulegen, ob sie militärisch erobert oder auf andere Weise an sich gebracht wurden. Der Singular des hebräischen Verbs bei dem zusammengesetzten Subjekt wird im Deutschen regulär als Plural wiedergegeben.
- source_word: גְּשׁוּר וַאֲרָם
  choice: Geschur und Aram
  rationale: Beide Namen werden als Eigennamen wiedergegeben; „Aram“ bleibt näher am Hebräischen als „Syrien“. „Geschur“ entspricht der geläufigen deutschen Umschrift.
- source_word: חַוֺּת יָאִיר
  choice: die Dörfer Jairs
  rationale: Die Bezeichnung kann als transparenter Ortsname verstanden werden und bezeichnet die Siedlungen Jairs. Die mögliche Wiedergabe als feststehender Ortsname wird in einer Fußnote bewahrt.
- source_word: מֵאִתָּם
  choice: ihnen … weg
  rationale: Die deutsche Konstruktion bringt knapp und idiomatisch zum Ausdruck, dass die Orte der Verfügungsgewalt der zuvor genannten Personen oder Gruppe entzogen wurden.
- source_word: קְנָת
  choice: Kenat
  rationale: Geläufige deutsche Umschrift des Ortsnamens.
- source_word: בְּנֹתֶיהָ
  choice: seine Tochterstädte
  rationale: Die wörtliche Metapher „Töchter“ wird in der verständlichen deutschen Zusammensetzung „Tochterstädte“ erhalten; gemeint sind von Kenat abhängige Siedlungen.
- source_word: שִׁשִּׁים עִיר
  choice: insgesamt sechzig Städte
  rationale: „Städte“ ist die direkte Entsprechung von עִיר. „Insgesamt“ macht die zusammenfassende Funktion der Zahl im Deutschen deutlich, ohne zusätzliche Sachinformation einzuführen.
- source_word: כָּל אֵלֶּה
  choice: Alle diese
  rationale: Die formal offene Bezugnahme des Hebräischen bleibt erhalten. Sie wird nicht ausdrücklich auf Orte, Personen oder Clans festgelegt.
- source_word: בְּנֵי מָכִיר
  choice: waren Söhne Machirs
  rationale: Die genealogische Formulierung des Hebräischen wird direkt bewahrt. Dass „Söhne“ hier auch Nachkommen oder Angehörige einer Sippe bezeichnen kann, wird in der Fußnote erläutert.
- source_word: אֲבִי גִלְעָד
  choice: des Vaters Gileads
  rationale: Die hebräische Verwandtschaftsbezeichnung wird formal wiedergegeben. Sie kann je nach Bezug sowohl den unmittelbaren Vater als auch den Stammvater bezeichnen; eine engere Festlegung wäre unnötig.
theological_decisions:
- issue: Bezug von כָּל אֵלֶּה und Bedeutung von בְּנֵי מָכִיר
  choice: „Alle diese waren Söhne Machirs“ bewahrt die genealogische Form und den offenen Rückbezug.
  alternative: „Alle diese Orte gehörten den Nachkommen Machirs.“
  rationale: Die Alternative glättet den schwierigen Übergang von den Städten zur genealogischen Aussage, fügt aber ein Besitzverb und einen ausdrücklich örtlichen Bezug hinzu, die im masoretischen Text nicht stehen. Die Übersetzung lässt deshalb die Spannung bestehen und erläutert nur die mögliche weitere Bedeutung von „Söhne“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufigen deutschen Namensformen. Die Formulierung bleibt nah an der knappen genealogischen Syntax des Hebräischen; idiomatische Anpassungen wie „nahmen ihnen … weg“ sichern zugleich die Verständlichkeit. Gedankenstrich und „insgesamt“ kennzeichnen die Zahl als Zusammenfassung.
