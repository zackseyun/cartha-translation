base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/027.yaml
  text: 'The sons of Ram: Jerahmeel the firstborn[a], Maaz, Jamin, and Eker.'
translation:
  language: de
  text: Die Söhne Rams, des Erstgeborenen Jerachmeëls, waren Maaz, Jamin und Eker.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: waren
  rationale: Das Verb leitet die genealogische Aufzählung ein. „Waren“ gibt seine Funktion im Deutschen knapp und natürlich wieder.
- source_word: בְנֵי רָם
  choice: die Söhne Rams
  rationale: בְנֵי bezeichnet hier die männlichen Nachkommen Rams; der deutsche Genitiv ist in einer genealogischen Liste natürlich.
- source_word: בְּכוֹר יְרַחְמְאֵל
  choice: des Erstgeborenen Jerachmeëls
  rationale: Die Konstruktverbindung bedeutet „der Erstgeborene Jerachmeëls“ und beschreibt im Zusammenhang Ram, nicht Jerachmeël. Das wird auch durch 1. Chronik 2,25 bestätigt, wo Ram als Jerachmeëls Erstgeborener genannt wird.
- source_word: מַעַץ
  choice: Maaz
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen Form wiedergegeben.
- source_word: יָמִין
  choice: Jamin
  rationale: Hier liegt eindeutig ein Personenname vor; die traditionelle deutsche Namensform ist verständlich und geläufig.
- source_word: עֵקֶר
  choice: Eker
  rationale: Der Personenname wird entsprechend der hebräischen Lautgestalt und deutscher Bibeltradition wiedergegeben.
