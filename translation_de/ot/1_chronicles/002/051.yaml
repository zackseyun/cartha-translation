lexical_decisions:
- source_word: שַׂלְמָא
  choice: Salma
  rationale: Personenname; die Form wird entsprechend dem hebräischen Namen transliteriert und nicht übersetzt.
- source_word: אֲבִי
  choice: der Vater von
  rationale: Bewahrt die hebräische Ausdrucksweise. In genealogischen und siedlungsgeschichtlichen Listen kann אָב neben dem leiblichen Vater auch einen Vorfahren oder Gründer einer Sippe beziehungsweise eines Ortes bezeichnen.
- source_word: בֵית לָחֶם
  choice: Bethlehem
  rationale: Im Deutschen fest eingebürgerter Ortsname.
- source_word: חָרֵף
  choice: Haref
  rationale: Personenname; die Umschrift gibt die hebräische Konsonanten- und Vokalgestalt in einer für deutsche Leser natürlichen Form wieder.
- source_word: בֵית גָּדֵר
  choice: Bet-Gader
  rationale: Wahrscheinlicher Ortsname; „Bet“ bildet das hebräische בֵית in Ortsnamen erkennbar ab, während der Bindestrich die Namenseinheit verdeutlicht.
