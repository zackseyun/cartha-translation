  text: וְ/לֹֽא הָיָ֧ה לְ/שֵׁשָׁ֛ן בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וּ/לְ/שֵׁשָׁ֛ן עֶ֥בֶד מִצְרִ֖י וּ/שְׁמ֥/וֹ יַרְחָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/034.yaml
  text: Sheshan had no sons[a], only daughters. And Sheshan had an Egyptian servant whose name was Jarha.
translation:
  language: de
  text: Scheschan hatte keine Söhne, sondern nur Töchter. Und Scheschan hatte einen ägyptischen Sklaven[a] namens Jarha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Diener«. Das hebräische Wort עֶבֶד kann sowohl einen Diener als auch einen Sklaven bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיָה לְשֵׁשָׁן
  choice: Scheschan hatte
  rationale: Die hebräische Besitzkonstruktion »für Scheschan war« wird im Deutschen natürlich mit »Scheschan hatte« wiedergegeben.
- source_word: בָּנִים
  choice: Söhne
  rationale: Der ausdrückliche Gegensatz zu den Töchtern verlangt hier die geschlechtsspezifische Bedeutung »Söhne«, nicht das allgemeinere »Kinder«.
- source_word: כִּי אִם
  choice: sondern nur
  rationale: Nach der Verneinung bezeichnet die Wendung eine ausschließende Einschränkung; »sondern nur« gibt den Kontrast im Deutschen klar wieder.
- source_word: בָּנוֹת
  choice: Töchter
  rationale: Die direkte Entsprechung bewahrt den für die Genealogie wichtigen Gegensatz zu den Söhnen.
- source_word: עֶבֶד
  choice: Sklaven
  rationale: Das Wort kann einen Diener oder einen rechtlich beziehungsweise sozial gebundenen Sklaven bezeichnen. »Sklave« vermeidet eine mögliche Verharmlosung des Abhängigkeitsverhältnisses; die weitere Bedeutungsoption wird in der Fußnote genannt.
- source_word: מִצְרִי
  choice: ägyptischen
  rationale: Das Adjektiv bezeichnet Herkunft oder Volkszugehörigkeit und lässt sich direkt mit »ägyptisch« wiedergeben.
- source_word: וּשְׁמוֹ
  choice: namens
  rationale: Das knappe deutsche »namens« gibt die hebräische Namensformel »und sein Name war« natürlich und vollständig wieder.
- source_word: יַרְחָע
  choice: Jarha
  rationale: Der Personenname wird nach gebräuchlicher deutscher Umschrift wiedergegeben.
