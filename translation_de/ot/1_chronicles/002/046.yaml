lexical_decisions:
- source_word: פִּילֶגֶשׁ
  choice: Nebenfrau
  rationale: Der hebräische Ausdruck bezeichnet eine Frau in anerkannter, aber gegenüber einer Hauptfrau nachgeordneter ehelicher Stellung. „Nebenfrau“ ist im Deutschen präzise und weniger missverständlich als „Konkubine“.
- source_word: יָלְדָה
  choice: gebar
  rationale: Wenn in einem Geschlechtsregister eine Frau das Subjekt ist, gibt „gebar“ die genealogische Aussage knapp und natürlich wieder.
- source_word: הֹלִיד
  choice: zeugte
  rationale: Die Hifil-Form von ילד bezeichnet in Geschlechtsregistern die männliche Abstammung; „zeugte“ bewahrt diese Aussage prägnant. Die natürlichere Umschreibung steht in der Fußnote.
- source_word: עֵיפָה
  choice: Efa
  rationale: Der Personenname wird nach üblicher deutscher biblischer Namensform wiedergegeben.
- source_word: כָּלֵב
  choice: Kaleb
  rationale: Übliche deutsche Form des Personennamens.
- source_word: חָרָן
  choice: Haran
  rationale: Der Personenname wird an beiden Stellen einheitlich wiedergegeben.
- source_word: מוֹצָא
  choice: Moza
  rationale: Transliteration des Personennamens in einer im Deutschen gut lesbaren Form.
- source_word: גָּזֵז
  choice: Gases
  rationale: Der Personenname wird nach deutscher Laut- und Schreibkonvention wiedergegeben und an beiden Stellen einheitlich übersetzt.
- source_word: וְ
  choice: und
  rationale: Die Konjunktion verbindet sowohl die Namen als auch die beiden genealogischen Aussagen geradlinig miteinander.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker hat keine eigenständige deutsche Entsprechung; seine Funktion ergibt sich aus dem deutschen Satzbau.
