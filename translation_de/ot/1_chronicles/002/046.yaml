  text: And Ephah[a], Caleb’s concubine, bore Haran, Moza, and Gazez; and Haran fathered Gazez.
translation:
  language: de
  text: Und Efa, Kalebs Nebenfrau, gebar Haran, Moza und Gases; und Haran zeugte[a] Gases.
  philosophy: optimal-equivalence
  footnotes:
