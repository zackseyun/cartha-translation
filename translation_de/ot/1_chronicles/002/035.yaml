  register: Knappes, würdevolles Standarddeutsch im genealogischen Stil. Die Satzstruktur bleibt nah am Hebräischen; „zur Frau“ ist zugleich natürliches heutiges Deutsch. Die historisch-soziale Bezeichnung „Sklave“ wird nicht abgeschwächt, ihre mögliche Übersetzung als „Diener“ jedoch ausdrücklich vermerkt.
