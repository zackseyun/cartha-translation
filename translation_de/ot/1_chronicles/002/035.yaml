  text: וַ/יִּתֵּ֨ן שֵׁשָׁ֧ן אֶת בִּתּ֛/וֹ לְ/יַרְחָ֥ע עַבְדּ֖/וֹ לְ/אִשָּׁ֑ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת עַתָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/035.yaml
  text: Sheshan gave his daughter to Jarha his servant as a wife[a], and she bore Attai to him.
translation:
  language: de
  text: Scheschan gab seine Tochter seinem Sklaven[a] Jarha zur Frau, und sie gebar ihm Attai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener“. Das hebräische Wort עֶבֶד kann sowohl einen Diener als auch einen Sklaven bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: gab
  rationale: נתן bedeutet wörtlich „geben“. Zusammen mit „zur Frau“ ist die Eheschließung im Deutschen klar ausgedrückt, ohne den hebräischen Satz unnötig zu erweitern.
- source_word: שֵׁשָׁן
  choice: Scheschan
  rationale: Der Personenname wird nach gängiger deutscher Umschrift wiedergegeben.
- source_word: בִּתּוֹ
  choice: seine Tochter
  rationale: Direkte Wiedergabe des Verwandtschaftsbegriffs mit Suffix der 3. Person Singular maskulin.
- source_word: לְיַרְחָע
  choice: seinem … Jarha
  rationale: Der Personenname wird nach gängiger deutscher Umschrift wiedergegeben; die Präposition לְ kennzeichnet hier den Empfänger.
- source_word: עַבְדּוֹ
  choice: seinem Sklaven
  rationale: עֶבֶד kann sowohl einen Diener als auch einen Sklaven bezeichnen. „Sklave“ macht Jarhas rechtlich und sozial abhängige Stellung in Scheschans Haus deutlich; die lexikalische Mehrdeutigkeit bleibt in einer Fußnote sichtbar.
- source_word: לְאִשָּׁה
  choice: zur Frau
  rationale: Die feste deutsche Wendung „jemandem eine Frau zur Frau geben“ gibt die hebräische Eheformel knapp und natürlich wieder.
- source_word: וַתֵּלֶד
  choice: sie gebar
  rationale: ילד im Qal mit weiblichem Subjekt bedeutet „gebären“. Die knappe Form passt zum genealogischen Stil.
- source_word: לוֹ
  choice: ihm
  rationale: Die Präposition לְ mit Suffix bezeichnet in der Geburtsformel die Beziehung zum Vater.
- source_word: עַתָּי
  choice: Attai
  rationale: Der Personenname wird in der im Deutschen geläufigen biblischen Form wiedergegeben.
theological_decisions: []
