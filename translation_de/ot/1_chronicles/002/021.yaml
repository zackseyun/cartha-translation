base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/021.yaml
  text: Afterward Hezron went in to the daughter of Machir the father of Gilead[a], and he took her when he was sixty years old[c][b], and she bore Segub to him.
translation:
  language: de
  text: Danach ging Hezron zu Machirs Tochter, dem Vater Gileads[a],[b] und nahm sie zur Frau[c], als er sechzig Jahre alt war. Sie gebar ihm Segub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu Machirs Tochter, dem Vater Gileads«. Die Bezeichnung kann sich auf Machir als Vater, Vorfahr oder Begründer Gileads beziehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung »ging zu« ist eine zurückhaltende Umschreibung für eheliche beziehungsweise sexuelle Gemeinschaft; auch: »kam zu«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »nahm sie«; gemeint ist hier wahrscheinlich, dass er sie heiratete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Danach
  rationale: Gibt die zeitliche Abfolge in der Genealogie knapp und natürlich wieder.
- source_word: בָּא אֶל
  choice: ging zu
  rationale: Bewahrt die zurückhaltende Ausdrucksweise des Hebräischen; im Zusammenhang bezeichnet die Wendung die eheliche beziehungsweise sexuelle Verbindung.
- source_word: בַּת מָכִיר
  choice: der Tochter Machirs
  rationale: Entspricht der hebräischen Genitivverbindung und wahrt den genealogischen Stil.
- source_word: אֲבִי גִלְעָד
  choice: des Vaters Gileads
  rationale: Ist die unmittelbarste Wiedergabe; »Vater« kann in genealogischer Sprache auch Vorfahr oder Begründer bedeuten.
- source_word: לְקָחָהּ
  choice: nahm sie zur Frau
  rationale: לקח in Verbindung mit einer Frau bezeichnet häufig die Eheschließung. Die deutsche Wendung ist natürlicher und eindeutiger als das bloße »nahm sie«, ohne über den Kontext hinauszugehen.
- source_word: וְהוּא בֶּן שִׁשִּׁים שָׁנָה
  choice: als er sechzig Jahre alt war
  rationale: Gibt die hebräische Altersformel in idiomatischem modernem Deutsch wieder.
- source_word: וַתֵּלֶד לוֹ
  choice: Sie gebar ihm
  rationale: Bewahrt das ausdrückliche indirekte Objekt לוֹ und klingt im genealogischen Register natürlich.
- source_word: שְׂגוּב
  choice: Segub
  rationale: Gebräuchliche deutsche Transliteration des Personennamens.
theological_decisions:
- issue: Bedeutung von אֲבִי in der genealogischen Bezeichnung Machirs
  choice: Vater Gileads
  alternative: Vorfahr oder Begründer Gileads
  rationale: Die direkte Verwandtschaftsbezeichnung wird im Haupttext bewahrt; die mögliche weitere genealogische Bedeutung wird in einer Fußnote offengehalten.
