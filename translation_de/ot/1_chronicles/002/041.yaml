  text: וְ/שַׁלּוּם֙ הוֹלִ֣יד אֶת יְקַמְיָ֔ה וִֽ/יקַמְיָ֖ה הֹלִ֥יד אֶת אֱלִישָׁמָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/041.yaml
  text: Shallum fathered Jekamiah, and Jekamiah fathered Elishama.
translation:
  language: de
  text: Schallum zeugte Jekamja, und Jekamja zeugte Elischama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלּוּם
  choice: Schallum
  rationale: Personenname in der im Deutschen gebräuchlichen bibelsprachlichen Umschrift.
- source_word: הוֹלִיד / הֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in genealogischen Zusammenhängen das Zeugen beziehungsweise Vaterwerden. „Zeugte“ ist knapp, präzise und im Deutschen für Geschlechtsregister geläufig.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker hat im Deutschen keine eigene lexikalische Entsprechung; seine Funktion wird durch den Satzbau ausgedrückt.
- source_word: יְקַמְיָה / וִיקַמְיָה
  choice: Jekamja / und Jekamja
  rationale: Der Personenname wird in deutscher Umschrift wiedergegeben; die vorangestellte Konjunktion ו wird mit „und“ übersetzt. Die Wiederholung des Namens bleibt entsprechend dem Hebräischen erhalten.
- source_word: אֱלִישָׁמָע
  choice: Elischama
  rationale: Personenname in deutscher Umschrift; שׁ wird dabei konventionell mit „sch“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges genealogisches Deutsch. Die wiederholte Satzstruktur des Hebräischen wird bewahrt; „zeugte“ ist hier natürlicher und genauer als das veraltete „begattete“ oder die umständlichere Formulierung „wurde der Vater von“.
