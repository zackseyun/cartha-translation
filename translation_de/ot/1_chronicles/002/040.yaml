  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְעָשָׂה
  choice: Eleasa
  rationale: Der Personenname wird nach der im Deutschen gebräuchlichen biblischen Form wiedergegeben; das abschließende hebräische ה wird nicht durch ein zusätzliches h abgebildet.
- source_word: הֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in diesem genealogischen Zusammenhang das Zeugen beziehungsweise Vaterwerden. „Zeugte“ ist knapp, präzise und in biblischen Stammbäumen weiterhin verständlich.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker hat kein eigenständiges deutsches Äquivalent; seine Funktion zeigt sich in der Satzstruktur.
- source_word: סִסְמָי
  choice: Sismai
  rationale: Der Personenname wird lautnah transliteriert.
- source_word: וְ
  choice: und
  rationale: Die einfache koordinierende Konjunktion verbindet die beiden genealogischen Aussagen.
- source_word: שַׁלּוּם
  choice: Schallum
  rationale: Der Personenname wird in der etablierten deutschen Bibelschreibweise mit „Sch“ für ש wiedergegeben.
