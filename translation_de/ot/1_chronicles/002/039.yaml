  text: וַ/עֲזַרְיָה֙ הֹלִ֣יד אֶת חָ֔לֶץ וְ/חֶ֖לֶץ הֹלִ֥יד אֶת אֶלְעָשָֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/039.yaml
  text: Azariah fathered Helez[a], and Helez fathered Eleasah.
translation:
  language: de
  text: Asarja zeugte Helez, und Helez zeugte Elasa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲזַרְיָה
  choice: Asarja
  rationale: Der Personenname עֲזַרְיָה wird in der im Deutschen üblichen, an die hebräische Form angelehnten Schreibweise „Asarja“ wiedergegeben. Das vorangestellte Waw wird durch den fortlaufenden Satz- und Genealogiezusammenhang ausreichend berücksichtigt und muss hier nicht eigens mit „und“ erscheinen.
- source_word: הֹלִיד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet ילד im Hifil das männliche Zeugen bzw. Hervorbringen eines Nachkommen. „zeugte“ ist knapp, präzise und im Deutschen für biblische Geschlechtsregister geläufig.
- source_word: אֶת
  choice: '[nicht gesondert übersetzt]'
  rationale: Der hebräische Akkusativmarker besitzt im Deutschen keine eigenständige Entsprechung; seine Funktion wird durch die deutsche Satzstellung ausgedrückt.
- source_word: חָלֶץ / וְחֶלֶץ
  choice: Helez / und Helez
  rationale: Der Personenname wird in beiden Vorkommen einheitlich als „Helez“ transliteriert; das Waw des zweiten Vorkommens wird mit „und“ wiedergegeben.
- source_word: אֶלְעָשָׂה
  choice: Elasa
  rationale: „Elasa“ ist die im Deutschen natürliche Transliteration des hebräischen Personennamens אֶלְעָשָׂה und bewahrt dessen erkennbare Lautgestalt.
