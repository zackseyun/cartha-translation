base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/016.yaml
  text: 'Their sisters were Zeruiah and Abigail. The sons of Zeruiah: Abishai, Joab, and Asahel—three.'
translation:
  language: de
  text: Ihre Schwestern waren Zeruja und Abigajil. Die Söhne Zerujas waren Abischai, Joab und Asaël – drei insgesamt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֹתֵיהֶם
  choice: Ihre Schwestern waren
  rationale: Die Form verbindet „Schwestern“ mit einem Suffix der 3. Person maskulin Plural. Im Deutschen gibt die possessive Formulierung die genealogische Ergänzung natürlich und genau wieder.
- source_word: צְרוּיָה
  choice: Zeruja
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition und in einer dem Hebräischen angenäherten Form wiedergegeben.
- source_word: וַאֲבִיגָיִל
  choice: und Abigajil
  rationale: Der Personenname wird in geläufiger deutscher Form transliteriert; die Konjunktion wird ausdrücklich wiedergegeben.
- source_word: וּבְנֵי צְרוּיָה
  choice: Die Söhne Zerujas waren
  rationale: Die Constructusverbindung bedeutet „die Söhne Zerujas“. Das ergänzte „waren“ bildet im Deutschen einen natürlichen vollständigen Satz und entspricht der Listenstruktur.
- source_word: אַבְשַׁי
  choice: Abischai
  rationale: Geläufige deutsche Wiedergabe des hebräischen Personennamens.
- source_word: וְיוֹאָב
  choice: Joab
  rationale: Geläufige deutsche Wiedergabe; die Konjunktion erscheint entsprechend deutscher Aufzählungspraxis vor dem letzten Namen.
- source_word: וַעֲשָׂהאֵל
  choice: und Asaël
  rationale: Der Name wird in geläufiger deutscher Form wiedergegeben; der Trema-Hinweis macht die getrennte Aussprache der Vokale deutlich.
- source_word: שְׁלֹשָׁה
  choice: drei insgesamt
  rationale: Die zusammenfassende Zahl des hebräischen Textes bleibt ausdrücklich erhalten; „insgesamt“ verdeutlicht ihre Funktion idiomatisch, ohne zusätzliche Sachinformation einzuführen.
