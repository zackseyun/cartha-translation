base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/019.yaml
  text: Azubah died[a], and Caleb took Ephrath as his wife[b], and she bore Hur to him.
translation:
  language: de
  text: Als Asuba starb, nahm Kaleb Efrat[a] zur Frau, und sie gebar ihm Hur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name erscheint an anderen Stellen auch in der längeren Form »Efrata«; der hebräische Text hier hat die kürzere Form »Efrat«.
