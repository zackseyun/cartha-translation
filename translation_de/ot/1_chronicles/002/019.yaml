lexical_decisions:
- source_word: וַתָּמָת
  choice: starb
  rationale: Das Qal wayyiqtol von מות bezeichnet schlicht das Sterben; die direkte Wiedergabe vermeidet einen im Hebräischen nicht vorhandenen Euphemismus.
- source_word: עֲזוּבָה
  choice: Asuba
  rationale: Der Personenname wird nach gebräuchlichen deutschen Transliterationskonventionen wiedergegeben.
- source_word: וַיִּקַּח לוֹ
  choice: nahm ... zur Frau
  rationale: לקח mit einer Frau als Objekt ist eine übliche Wendung für die Eheschließung. Die Formulierung bewahrt das hebräische Bild und macht den ehelichen Sinn im Deutschen klar.
- source_word: כָלֵב
  choice: Kaleb
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: אֶפְרָת
  choice: Efrat
  rationale: Die kürzere Namensform des hebräischen Textes wird unmittelbar transliteriert; verwandte längere Formen wie Efrata werden hier nicht eingetragen.
- source_word: וַתֵּלֶד לוֹ
  choice: sie gebar ihm
  rationale: Das Qal von ילד bezeichnet hier das Gebären; לוֹ wird mit dem deutschen Dativ „ihm“ knapp und genau abgebildet.
- source_word: חוּר
  choice: Hur
  rationale: Gebräuchliche deutsche Wiedergabe des Personennamens.
