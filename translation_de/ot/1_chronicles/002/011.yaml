source:
  edition: WLC
  text: וְ/נַחְשׁוֹן֙ הוֹלִ֣יד אֶת שַׂלְמָ֔א וְ/שַׂלְמָ֖א הוֹלִ֥יד אֶת בֹּֽעַז־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/011.yaml
  text: Nahshon fathered Salma[a], and Salma fathered Boaz.
translation:
  language: de
  text: Nachschon zeugte Salma[a], und Salma zeugte Boas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Salma; manche Übersetzungen lesen Salmon, um den Namen an verwandte Geschlechtsregister anzugleichen (zum Beispiel Rut 4,20–21; Matthäus 1,4–5).
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/נַחְשׁוֹן
  choice: Nachschon
  rationale: Der Personenname wird nach der hebräischen Form transkribiert; „Nachschon“ ist die im Deutschen geläufige Wiedergabe von נַחְשׁוֹן.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Im genealogischen Zusammenhang bezeichnet die Hifil-Form von ילד das Zeugen beziehungsweise Vaterwerden. „zeugte“ ist knapp, würdevoll und im Deutschen für Stammbäume geläufig.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: Der hebräische Akkusativmarker hat hier keine eigenständige lexikalische Entsprechung und wird durch die deutsche Satzstruktur ausgedrückt.
- source_word: שַׂלְמָא
  choice: Salma
  rationale: Die Namensform des vorliegenden hebräischen Textes lautet שַׂלְמָא und wird daher unmittelbar als „Salma“ wiedergegeben, ohne sie an verwandte Genealogien anzugleichen.
- source_word: וְ/שַׂלְמָא
  choice: und Salma
  rationale: Die Konjunktion וְ wird natürlich mit „und“ wiedergegeben; der Name folgt erneut der hebräischen Form des Verses.
- source_word: בֹּעַז
  choice: Boas
  rationale: „Boas“ ist die etablierte deutsche Namensform für בֹּעַז.
theological_decisions: []
