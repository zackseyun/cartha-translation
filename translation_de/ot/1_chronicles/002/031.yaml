  rationale: Der Personenname wird in einer für deutschsprachige Leser verständlichen Umschrift wiedergegeben.
- source_word: אַחְלָי
  choice: Achlai
  rationale: Der Personenname wird in einer für deutschsprachige Leser verständlichen Umschrift wiedergegeben.
