base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/054.yaml
  text: 'The sons of Salma: Bethlehem[a], the Netophathites, Atroth-beth-joab, half of the Manahathites[b], the Zorites.'
translation:
  language: de
  text: 'Die Söhne Salmas: Bethlehem, die Netofatiter, Atrot-Bet-Joab, die Hälfte der Manahatiter[a] und die Zoraiter[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise: „Menuhotiter“. Die genaue Zuordnung des hebräischen Gentilizes zu einem Ortsnamen ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Leute aus Zora“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Die formale genealogische Wendung bleibt erhalten; in diesem Zusammenhang kann sie auch Nachkommen oder zugehörige Sippengruppen bezeichnen.
- source_word: שַׂלְמָא
  choice: Salmas
  rationale: Der Personenname wird in der im Deutschen geläufigen Form „Salma“ wiedergegeben und als Genitivattribut verwendet.
- source_word: בֵּית לֶחֶם
  choice: Bethlehem
  rationale: Der etablierte deutsche Ortsname wird beibehalten; innerhalb der genealogischen Liste kann er zugleich für die zu Bethlehem gehörende Sippe stehen.
- source_word: וּנְטוֹפָתִי
  choice: die Netofatiter
  rationale: Die mit Artikel ergänzte Pluralbezeichnung gibt das Gentiliz als Bewohner- oder Sippengruppe wieder.
- source_word: עַטְרוֹת בֵּית יוֹאָב
  choice: Atrot-Bet-Joab
  rationale: Die Wortfolge wird dem genealogischen Zusammenhang entsprechend als zusammengesetzter Orts- oder Sippenname transliteriert, nicht wörtlich als „Kronen des Hauses Joabs“ aufgelöst.
- source_word: וַחֲצִי
  choice: die Hälfte der
  rationale: Die Form bezeichnet einen Teil der nachfolgenden Gruppe; die Koordination wird im Deutschen durch das „und“ vor dem letzten Listenglied ausgedrückt.
- source_word: הַמָּנַחְתִּי
  choice: Manahatiter
  rationale: Das Gentiliz wird als Gruppenbezeichnung im Plural wiedergegeben. Die genaue Zuordnung des zugrunde liegenden Ortsnamens bleibt unsicher und wird in einer Fußnote vermerkt.
- source_word: הַצָּרְעִי
  choice: Zoriter
  rationale: Die knappe gentilizische Form wird transliterierend als Bezeichnung einer Gruppe wiedergegeben; der wahrscheinliche Bezug zu Zora wird in der Fußnote kenntlich gemacht.
theological_decisions: []
