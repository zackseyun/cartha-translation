  register: Moderne, würdevolle Listenform mit geläufigen deutschen Namensformen. Die genealogische Wendung „Söhne“ wurde formal bewahrt, ohne auszuschließen, dass Sippen oder Nachkommen gemeint sind. Die Fußnotenmarker wurden unmittelbar an die jeweils erklärten unsicheren Gentilizes gesetzt.
