source:
  edition: WLC
  text: וּ/שְׂג֖וּב הוֹלִ֣יד אֶת יָאִ֑יר וַֽ/יְהִי ל֗/וֹ עֶשְׂרִ֤ים וְ/שָׁלוֹשׁ֙ עָרִ֔ים בְּ/אֶ֖רֶץ הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/022.yaml
  text: Segub fathered Jair, and he had twenty-three cities in the land of Gilead.
translation:
  language: de
  text: Und Segub zeugte Jaïr; er hatte dreiundzwanzig Städte im Land Gilead.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׂגוּב
  choice: Und Segub
  rationale: Der Eigenname wird nach gebräuchlicher deutscher Konvention wiedergegeben; die vorangestellte Konjunktion וּ wird mit „Und“ übersetzt.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in genealogischem Zusammenhang das Zeugen beziehungsweise Vaterwerden. „Zeugte“ ist im Deutschen knapp, verständlich und für ein Geschlechtsregister angemessen.
- source_word: יָאִיר
  choice: Jaïr
  rationale: Die Schreibweise „Jaïr“ macht die zwei Silben des hebräischen Namens erkennbar und entspricht einer etablierten deutschen Bibelkonvention.
- source_word: וַיְהִי לוֹ
  choice: er hatte
  rationale: Die Verbindung היה + ל drückt hier Besitz beziehungsweise Herrschaftszugehörigkeit aus. „Er hatte“ gibt das hebräische Idiom natürlich wieder, ohne genauer festzulegen, welcher Art seine Verfügung über die Städte war.
- source_word: עֶשְׂרִים וְשָׁלוֹשׁ
  choice: dreiundzwanzig
  rationale: Die Zahl wird in der natürlichen deutschen Reihenfolge wiedergegeben.
- source_word: עָרִים
  choice: Städte
  rationale: עִיר kann Städte oder Ortschaften bezeichnen. „Städte“ ist die übliche Wiedergabe und passt zur territorialen Angabe.
- source_word: בְּאֶרֶץ הַגִּלְעָד
  choice: im Land Gilead
  rationale: Die Formulierung bewahrt אֶרֶץ ausdrücklich als „Land“ und gibt Gilead als geografischen Eigennamen wieder.
theological_decisions:
- issue: Art von Jaïrs Beziehung zu den dreiundzwanzig Städten
  choice: „er hatte“
  alternative: „ihm gehörten“ oder „er beherrschte“
  rationale: Der hebräische Besitzidiom וַיְהִי לוֹ lässt offen, ob Eigentum, politische Herrschaft oder territoriale Zuordnung gemeint ist. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. Der genealogische Ausdruck „zeugte“ bleibt knapp und sachlich; das Semikolon verbindet Abstammungs- und Territorialangabe klar.
