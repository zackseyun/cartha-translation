source:
  edition: WLC
  text: וְ/אִישַׁ֛י הוֹלִ֥יד אֶת בְּכֹר֖/וֹ אֶת אֱלִיאָ֑ב וַ/אֲבִינָדָב֙ הַ/שֵּׁנִ֔י וְ/שִׁמְעָ֖א הַ/שְּׁלִישִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/013.yaml
  text: And Jesse fathered his firstborn Eliab[a], Abinadab the second, and Shimea the third.
translation:
  language: de
  text: Und Isai zeugte seinen Erstgeborenen Eliab, Abinadab als Zweiten und Schima[a] als Dritten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Schimea“; die parallele Liste in 1. Samuel 16,9 hat „Schamma“.
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישַׁי
  choice: Und Isai
  rationale: וְ verbindet den Satz schlicht mit der fortlaufenden Genealogie. Der Personenname אִישַׁי wird in seiner im Deutschen etablierten Form „Isai“ wiedergegeben.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in genealogischem Zusammenhang das Zeugen beziehungsweise Vaterwerden. „Zeugte“ ist präzise und im Deutschen für Geschlechtsregister weiterhin verständlich.
- source_word: אֶת בְּכֹרוֹ
  choice: seinen Erstgeborenen
  rationale: בְּכֹרוֹ bedeutet „seinen Erstgeborenen“. Dass es sich um einen Sohn handelt, ergibt sich aus dem Zusammenhang und muss nicht ergänzt werden.
- source_word: אֶת אֱלִיאָב
  choice: Eliab
  rationale: Die Akkusativpartikel אֶת bleibt unübersetzt; der Personenname wird als „Eliab“ wiedergegeben.
- source_word: וַאֲבִינָדָב הַשֵּׁנִי
  choice: Abinadab als Zweiten
  rationale: Der zweite Sohn wird in der knappen genealogischen Aufzählung ohne Wiederholung des Verbs genannt. „Als Zweiten“ gibt die Ordnungszahl natürlich und eindeutig wieder.
- source_word: וְשִׁמְעָא הַשְּׁלִישִׁי
  choice: und Schima als Dritten
  rationale: שִׁמְעָא wird entsprechend der Form im Chroniktext als „Schima“ wiedergegeben; die abweichende Namensform der Parallele in 1 Samuel wird nicht in den Haupttext übernommen. „Als Dritten“ gibt הַשְּׁלִישִׁי idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit der für Geschlechtsregister typischen Knappheit. Die syntaktische Zuordnung von „Erstgeborenen“ zu Eliab bleibt erhalten; bei den weiteren Söhnen werden die Ordnungszahlen idiomatisch mit „als“ angeschlossen.
