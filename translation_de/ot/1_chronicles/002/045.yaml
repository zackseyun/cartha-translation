base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/045.yaml
  text: And the son of Shammai was Maon[a], and Maon was the father of Beth-zur.
translation:
  language: de
  text: Und Schammais Sohn war Maon, und Maon war der Vater von Bet-Zur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Ahnherr beziehungsweise Gründer von Bet-Zur“. In Stammbäumen kann „Vater von“ auch den Ahnherrn oder Gründer einer Sippe oder Siedlung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֶן
  choice: Und … Sohn
  rationale: Das ו setzt die genealogische Reihe mit „Und“ fort; בֶן bezeichnet hier den Sohn.
- source_word: שַׁמַּי
  choice: Schammai
  rationale: Der Personenname wird in einer im Deutschen üblichen, aussprachenahen Form wiedergegeben.
- source_word: מָעוֹן
  choice: Maon
  rationale: Die Syntax weist hier auf einen Personennamen innerhalb der Abstammungsfolge, auch wenn dieselbe Form andernorts ein Ortsname sein kann.
- source_word: וּ/מָעוֹן
  choice: und Maon
  rationale: Die Wiederholung des Eigennamens wird entsprechend der knappen hebräischen Genealogie beibehalten.
- source_word: אֲבִי
  choice: war der Vater von
  rationale: Die geläufige genealogische Wendung bleibt erhalten; der Ausdruck kann hier auch eine weitere Beziehung als Ahnherr oder Gründer bezeichnen, was die Fußnote ausweist.
- source_word: בֵית צֽוּר
  choice: Bet-Zur
  rationale: Der zusammengesetzte Orts- oder Siedlungsname wird transliteriert, nicht wörtlich als „Haus Zurs“ übersetzt.
theological_decisions: []
