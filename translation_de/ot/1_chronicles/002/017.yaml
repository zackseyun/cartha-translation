source:
  edition: WLC
  text: וַ/אֲבִיגַ֕יִל יָלְדָ֖ה אֶת עֲמָשָׂ֑א וַ/אֲבִ֣י עֲמָשָׂ֔א יֶ֖תֶר הַ/יִּשְׁמְעֵאלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/017.yaml
  text: Abigail bore Amasa[a], and the father of Amasa was Jether the Ishmaelite.
translation:
  language: de
  text: Abigajil gebar Amasa, und Amasas Vater war Jeter, der Ismaelit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften und die Parallelstelle in 2. Samuel 17,25 haben »Jitra, der Israelit« statt »Jeter, der Ismaelit«. Der masoretische Text lautet hier »Jeter, der Ismaelit«.
    reason: textual_variant
lexical_decisions:
- source_word: יָלְדָה
  choice: gebar
  rationale: Das Qal von ילד mit weiblichem Subjekt bedeutet hier „gebären“. „Gebar“ ist im genealogischen Zusammenhang knapp, natürlich und gibt die ausdrückliche Mutterschaft wieder.
- source_word: אֶת עֲמָשָׂא
  choice: Amasa
  rationale: אֶת kennzeichnet das bestimmte direkte Objekt und wird im Deutschen nicht eigens wiedergegeben; der Personenname wird als „Amasa“ transkribiert.
- source_word: וַאֲבִי עֲמָשָׂא
  choice: und Amasas Vater
  rationale: Die Constructusverbindung bedeutet wörtlich „und der Vater Amasas“. Die gewählte Form ist idiomatisches Deutsch und bewahrt die ausdrücklich genannte genealogische Beziehung.
- source_word: יֶתֶר
  choice: Jeter
  rationale: Der Personenname wird entsprechend seiner hebräischen Form als „Jeter“ transkribiert.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: der Ismaelit
  rationale: Der hebräische Ausdruck steht mit Artikel. Als nachgestellte Apposition bezeichnet „der Ismaelit“ Jeters Volkszugehörigkeit und gibt die bestimmte Form natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper genealogischer Satzstruktur. Die Namensformen orientieren sich eng am Hebräischen; die textkritische Abweichung wird offengelegt, ohne den masoretischen Haupttext zu ersetzen.
