source:
  edition: WLC
  text: אֵ֖לֶּה בְּנֵ֣י יִשְׂרָאֵ֑ל רְאוּבֵ֤ן שִׁמְעוֹן֙ לֵוִ֣י וִ/יהוּדָ֔ה יִשָׂשכָ֖ר וּ/זְבֻלֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/001.yaml
  text: 'These are the sons of Israel: Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: de
  text: 'Das sind die Söhne Israels: Ruben, Simeon, Levi, Juda, Issachar und Sebulon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Der deiktische Plural leitet eine Namensliste ein; im natürlichen Deutschen wird die Kopula ergänzt. „Das sind“ ist für die Vorstellung einer Personengruppe idiomatischer als „Diese sind“.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Die Konstruktverbindung bezeichnet hier ausdrücklich die namentlich aufgeführten männlichen Kinder Jakobs beziehungsweise Israels, nicht allgemein Kinder oder spätere Nachkommen.
- source_word: יִשְׂרָאֵל
  choice: Israels
  rationale: Der hebräische Text verwendet den Eigennamen Israel. Der deutsche Genitiv gibt die Konstruktverbindung knapp und natürlich wieder; „Jakobs“ wäre eine erklärende Ersetzung.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Etablierte deutsche biblische Namensform.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Etablierte deutsche biblische Namensform.
- source_word: לֵוִי
  choice: Levi
  rationale: Etablierte deutsche biblische Namensform.
- source_word: וִיהוּדָה
  choice: Juda
  rationale: Etablierte deutsche biblische Namensform. Das hebräische Waw wird in der deutschen Aufzählung nicht an dieser Stelle einzeln wiedergegeben, sondern gemäß deutscher Listensyntax durch das abschließende „und“ vor dem letzten Namen.
- source_word: יִשָׂשכָר
  choice: Issachar
  rationale: Etablierte deutsche biblische Namensform, die der überlieferten hebräischen Namensgestalt entspricht.
- source_word: וּזְבֻלוּן
  choice: und Sebulon
  rationale: „Sebulon“ ist die etablierte deutsche biblische Namensform; das ausdrückliche Waw wird als natürliches abschließendes „und“ wiedergegeben.
