  yaml_path: translation/ot/1_chronicles/002/043.yaml
  text: 'The sons of Hebron: Korah[a], Tappuah, Rekem, and Shema.'
translation:
  language: de
  text: Und die Söhne Hebrons waren Korach, Tappuach, Rekem und Schama[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Schama; in deutschen Bibeln wird der Name auch Schema wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: בְּנֵי ist die Konstruktusform des Plurals „Söhne“ und leitet hier die unmittelbare Nachkommenliste ein. Das vorangestellte וּ wird als „Und“ wiedergegeben, weil der Vers den genealogischen Zusammenhang fortführt.
- source_word: חֶבְרוֹן
  choice: Hebrons
  rationale: Der Personenname wird in seiner im Deutschen eingebürgerten Form wiedergegeben; der Genitiv bildet die hebräische Konstruktverbindung natürlich ab.
- source_word: קֹרַח
  choice: Korach
  rationale: Die Schreibweise gibt den hebräischen Namen קֹרַח in einer geläufigen deutschen Transliteration wieder.
- source_word: תַפֻּחַ
  choice: Tappuach
  rationale: Der Personenname wird transliteriert und nicht nach der gleichlautenden Bezeichnung für eine Frucht übersetzt.
- source_word: רֶקֶם
  choice: Rekem
  rationale: Der Personenname wird in einer direkten, im Deutschen gut lesbaren Transliteration wiedergegeben.
- source_word: שָׁמַע
  choice: Schama
  rationale: „Schama“ folgt der masoretischen Vokalisierung שָׁמַע näher als die in deutschen Bibeln verbreitete Form „Schema“; die gebräuchliche Alternative wird in einer Fußnote bewahrt.
