source:
  edition: WLC
  text: וַ/יִּהְי֧וּ בְנֵי יְרַחְמְאֵ֛ל בְּכ֥וֹר חֶצְר֖וֹן הַ/בְּכ֣וֹר רָ֑ם וּ/בוּנָ֥ה וָ/אֹ֛רֶן וָ/אֹ֖צֶם אֲחִיָּֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/025.yaml
  text: The sons of Jerahmeel[a], the firstborn of Hezron, were Ram his firstborn, Bunah, Oren, Ozem, and Ahijah.
translation:
  language: de
  text: 'Die Söhne Jerachmeels, des Erstgeborenen Hezrons, waren: Ram, sein Erstgeborener, Buna, Oren, Ozem und Ahija.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Satzbau lässt sich so verstehen, dass fünf Söhne Jerachmeels aufgezählt werden und Ram als dessen Erstgeborener bezeichnet wird. Manche deuten »Ahija« im Verhältnis zur Liste anders; am naheliegendsten ist jedoch, Ahija als weiteren Personennamen in der Reihe zu verstehen.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: waren
  rationale: In der genealogischen Aufzählung führt היה die Angehörigen einer Familienlinie ein; »waren« ist dafür die natürliche deutsche Wiedergabe.
- source_word: בְנֵי
  choice: Söhne
  rationale: In diesem Stammbaum bezeichnet der Ausdruck männliche Nachkommen und wird daher geschlechtsspezifisch wiedergegeben.
- source_word: יְרַחְמְאֵל
  choice: Jerachmeel
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, dem Hebräischen nahen Form wiedergegeben.
- source_word: בְּכוֹר חֶצְרוֹן
  choice: des Erstgeborenen Hezrons
  rationale: Die Apposition kennzeichnet Jerachmeel als Hezrons Erstgeborenen; der Genitiv fügt sie im Deutschen eindeutig an Jerachmeel an.
- source_word: הַבְּכוֹר
  choice: sein Erstgeborener
  rationale: Die wiederholte Bezeichnung bezieht sich am natürlichsten auf Ram und kennzeichnet ihn als Jerachmeels Erstgeborenen. Das Possessivpronomen macht diesen Bezug im Deutschen klar, ohne die Wiederholung des Ausgangstextes zu beseitigen.
- source_word: רָם
  choice: Ram
  rationale: Transliteration des Personennamens.
- source_word: וּבוּנָה
  choice: Buna
  rationale: Transliteration des Personennamens.
- source_word: וָאֹרֶן
  choice: Oren
  rationale: Transliteration des Personennamens.
- source_word: וָאֹצֶם
  choice: Ozem
  rationale: Transliteration des Personennamens.
- source_word: אֲחִיָּה
  choice: Ahija
  rationale: Der masoretisch vokalisierte Personenname wird in der üblichen deutschen Form wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der Doppelpunkt macht den Beginn der Namensliste sichtbar; die Wiederholung von »Erstgeborener« bleibt entsprechend dem Hebräischen erhalten.
