  text: Caleb’s concubine Maacah bore Sheber and Tirhanah[a].
translation:
  language: de
  text: Kalebs Nebenfrau Maacha gebar Scheber und Tirhana[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise allgemeiner: „Von ihr stammten Scheber und Tirhana ab.“ In Geschlechtsregistern kann das mit „gebären“ wiedergegebene hebräische Verb auch allgemeiner das Hervorbringen von Nachkommen bezeichnen. Da hier ausdrücklich eine Frau das Subjekt ist, steht im Haupttext „gebar“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּלֶגֶשׁ
  choice: Nebenfrau
  rationale: Das Substantiv bezeichnet eine Frau in einer anerkannten, aber gegenüber einer Hauptfrau nachgeordneten ehelichen beziehungsweise sexuellen Verbindung. „Nebenfrau“ ist im Deutschen verständlich und gibt den sozialen Status würdevoll wieder.
- source_word: כָּלֵב
  choice: Kaleb
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: מַעֲכָה
  choice: Maacha
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transkribiert.
- source_word: יָלַד
  choice: gebar
  rationale: Das Verb kann in Geschlechtsregistern allgemein das Hervorbringen beziehungsweise Zeugen von Nachkommen bezeichnen. Da hier ausdrücklich Maacha das weibliche Subjekt ist, ist „gebar“ die natürliche und geschlechtlich passende Wiedergabe.
- source_word: שֶׁבֶר
  choice: Scheber
  rationale: Der Personenname wird in einer dem Hebräischen entsprechenden und im Deutschen geläufigen Form transkribiert.
- source_word: וְאֶת
  choice: und
  rationale: Die Konjunktion verbindet das zweite direkte Objekt mit dem ersten; der hebräische Akkusativmarker wird im Deutschen nicht eigens wiedergegeben.
- source_word: תִּרְחֲנָה
  choice: Tirhana
  rationale: Der Personenname wird entsprechend seiner hebräischen Form deutsch transkribiert.
