base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/009.yaml
  text: All these were David’s sons[a], besides the sons of the concubines; and Tamar was their sister.
translation:
  language: de
  text: Das waren alle Söhne Davids, abgesehen[a] von den Söhnen der Nebenfrauen; und Tamar war ihre Schwester.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zusätzlich zu den Söhnen der Nebenfrauen“. Die hebräische Wendung kann die Söhne der Nebenfrauen entweder von der vorausgehenden Gesamtzahl ausnehmen oder sie als außerhalb der Hauptliste zusätzlich erwähnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל בְּנֵי דָוִיד
  choice: alle Söhne Davids
  rationale: כֹּל fasst die zuvor genannten Söhne vollständig zusammen. Die natürliche deutsche Satzform „Das waren alle Söhne Davids“ macht die summarische Funktion des verblosen hebräischen Satzes deutlich.
- source_word: מִלְּבַד
  choice: abgesehen von
  rationale: Die Wendung bezeichnet eine außerhalb der Hauptliste stehende Gruppe und lässt im Deutschen ebenso wie im Kontext erkennen, dass diese Söhne nicht in der vorangehenden Aufzählung enthalten sind.
- source_word: בְּנֵי פִילַגְשִׁים
  choice: den Söhnen der Nebenfrauen
  rationale: בְּנֵי ist maskuliner Plural und wird daher mit „Söhne“ wiedergegeben. „Nebenfrauen“ bezeichnet die soziale Stellung von פִילַגְשִׁים in einem königlichen Haushalt verständlich und würdig, ohne moderne abwertende Nebenbedeutungen von „Konkubinen“ in den Vordergrund zu rücken.
- source_word: וְתָמָר אֲחוֹתָם
  choice: und Tamar war ihre Schwester
  rationale: Das Hebräische ist verblos; für natürliches Deutsch wird „war“ ergänzt. Das Suffix in אֲחוֹתָם bezieht Tamar als Schwester auf die genannten Söhne.
theological_decisions: []
