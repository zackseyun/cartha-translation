  yaml_path: translation/ot/1_chronicles/003/023.yaml
  text: 'The sons of Neariah: Elioenai[a], Hezekiah, and Azrikam—three.'
translation:
  language: de
  text: 'Die Söhne Nearjas: Eljoenai[a], Hiskia und Asrikam – drei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen: „Und der Sohn Nearjas“. Im Zusammenhang leitet die Einzahl jedoch die folgende Liste von drei Nachkommen ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: Die Söhne
  rationale: Die hebräische Form steht grammatisch im Singular („und der Sohn“), leitet hier jedoch eine Liste von drei Nachkommen ein, die durch die abschließende Zahl „drei“ ausdrücklich zusammengefasst werden. Daher wird die im genealogischen Zusammenhang gemeinte Mehrzahl im Haupttext wiedergegeben; die formale Besonderheit bleibt in der Fußnote sichtbar.
- source_word: נְעַרְיָה
  choice: Nearja
  rationale: Der Personenname wird in einer im Deutschen üblichen, am Hebräischen orientierten Form wiedergegeben.
- source_word: אֶלְיוֹעֵינַי
  choice: Eljoënai
  rationale: Der Personenname wird deutsch transliteriert; das Trema verdeutlicht, dass die aufeinanderfolgenden Vokale getrennt gesprochen werden.
- source_word: וְחִזְקִיָּה
  choice: Hiskia
  rationale: Verwendet wird die im Deutschen geläufige Namensform.
- source_word: וְעַזְרִיקָם
  choice: und Asrikam
  rationale: Der Personenname wird deutsch und am Hebräischen orientiert transliteriert; die hebräische Konjunktion wird mit „und“ wiedergegeben.
- source_word: שְׁלֹשָׁה
  choice: drei
  rationale: Die ausdrücklich genannte Kardinalzahl fasst die Zahl der aufgezählten Nachkommen zusammen und wird beibehalten.
