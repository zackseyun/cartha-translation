  text: וּ/בֶן חֲנַנְיָ֖ה פְּלַטְיָ֣ה וִ/ישַֽׁעְיָ֑ה בְּנֵ֤י רְפָיָה֙ בְּנֵ֣י אַרְנָ֔ן בְּנֵ֥י עֹבַדְיָ֖ה בְּנֵ֥י שְׁכַנְיָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/021.yaml
  text: 'And the sons of Hananiah: Pelatiah and Jeshaiah; the sons of Rephaiah[a], the sons of Arnan, the sons of Obadiah, the sons of Shecaniah.'
translation:
  language: de
  text: 'Und der Sohn Hananjas: Pelatja und Jeschaja; die Söhne Refajas[a], die Söhne Arnans, die Söhne Obadjas, die Söhne Schechanjas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Satzbau ist stark verkürzt und nicht eindeutig. Wörtlich steht: »Und der Sohn Hananjas: Pelatja und Jeschaja; die Söhne Refajas, die Söhne Arnans, die Söhne Obadjas, die Söhne Schechanjas.« Manche verstehen einen Teil dieser Reihe allgemeiner als eine Folge von Nachkommen und nicht ausschließlich als unmittelbare Söhne.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֶן
  choice: Und der Sohn
  rationale: Der masoretische Text hat die Einzahl בֶן. Diese wird trotz der anschließenden zwei Namen bewahrt, damit die syntaktische Schwierigkeit des Hebräischen nicht stillschweigend geglättet wird.
- source_word: חֲנַנְיָה
  choice: Hananja
  rationale: Der Personenname wird in einer im Deutschen geläufigen, am Hebräischen orientierten Form wiedergegeben.
- source_word: פְּלַטְיָה
  choice: Pelatja
  rationale: Transliteration des hebräischen Personennamens in deutscher Schreibweise.
- source_word: וִישַׁעְיָה
  choice: und Jeschaja
  rationale: Der Personenname mit vorangestellter Konjunktion wird in einer Form wiedergegeben, die ihn nicht vorschnell mit der geläufigen Namensform Jesaja gleichsetzt.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Die wiederholte genealogische Formel wird formal als »die Söhne« wiedergegeben; je nach Zusammenhang kann sie auch Nachkommen im weiteren Sinn bezeichnen.
- source_word: רְפָיָה
  choice: Refaja
  rationale: Transliteration des hebräischen Personennamens in deutscher Schreibweise.
- source_word: אַרְנָן
  choice: Arnan
  rationale: Transliteration des hebräischen Personennamens.
- source_word: עֹבַדְיָה
  choice: Obadja
  rationale: Im Deutschen geläufige, am Hebräischen orientierte Namensform.
- source_word: שְׁכַנְיָה
  choice: Schechanja
  rationale: Transliteration des hebräischen Personennamens in deutscher Schreibweise.
