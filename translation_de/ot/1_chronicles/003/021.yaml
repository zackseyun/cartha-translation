  source_fidelity: Der deutsche Text gibt die auffällige hebräische Einzahl וּבֶן („und der Sohn“) korrekt wieder und glättet sie trotz der zwei folgenden Namen nicht zu einer Mehrzahl. Die wiederholten Formen בְּנֵי sind angemessen mit „die Söhne“ übersetzt. Die Fußnote wahrt die syntaktische Unsicherheit und erweitert die Aussage nicht über den Befund hinaus.
  naturalness: Für eine knappe Genealogie ist die Formulierung in modernem Standarddeutsch verständlich und angemessen würdevoll. Die Reihung mit Semikolon und die wiederholte Formel entsprechen dem absichtlich gedrängten Stil der Vorlage.
  terminology: Die Namensformen Hananja, Pelatja, Jeschaja, Refaja, Arnan, Obadja und Schechanja sind konsistent deutschsprachig bzw. hebraisierend wiedergegeben. Insbesondere vermeidet „Jeschaja“ eine unzulässige Gleichsetzung mit der geläufigen Form „Jesaja“. Der Fußnotenanker [a] steht sachgerecht bei Refaja, wo die genealogische Zuordnung der folgenden Reihe besonders unsicher ist.
