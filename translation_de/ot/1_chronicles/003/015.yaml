  text: וּ/בְנֵי֙ יֹאשִׁיָּ֔הוּ הַ/בְּכוֹר֙ יוֹחָנָ֔ן הַ/שֵּׁנִ֖י יְהוֹיָקִ֑ים הַ/שְּׁלִשִׁי֙ צִדְקִיָּ֔הוּ הָ/רְבִיעִ֖י שַׁלּֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/015.yaml
  text: 'And the sons of Josiah: the firstborn[a], Johanan; the second, Jehoiakim; the third, Zedekiah; the fourth, Shallum.'
translation:
  language: de
  text: 'Und die Söhne Josias waren: der Erstgeborene Johanan; der zweite Jojakim; der dritte Zedekia; der vierte Schallum.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Schallum wird häufig mit Joahas in 2. Könige 23,30–34 und Jeremia 22,11 identifiziert; der Chronist führt in Josias Geschlechtsregister hier den Namen Schallum an.
    reason: Querverweis und vorsichtige Erklärung der unterschiedlichen Namensformen
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne … waren
  rationale: Das ו wird als „Und“ wiedergegeben und bewahrt den fortlaufenden genealogischen Zusammenhang. בְנֵי bezeichnet hier die unmittelbar genannten Söhne; das im Deutschen ergänzte „waren“ macht die Aufzählung natürlich verständlich.
- source_word: יֹאשִׁיָּהוּ
  choice: Josias
  rationale: Die im deutschen Bibelgebrauch etablierte Form des Personennamens.
- source_word: הַבְּכוֹר
  choice: der Erstgeborene
  rationale: Die Wiedergabe bewahrt sowohl die Geburtsreihenfolge als auch den mit בכור verbundenen Status.
- source_word: יוֹחָנָן
  choice: Johanan
  rationale: Geläufige deutsche Umschrift der hier vorliegenden Namensform.
- source_word: הַשֵּׁנִי
  choice: der zweite
  rationale: Direkte Wiedergabe der Ordnungszahl innerhalb der genealogischen Reihenfolge.
- source_word: יְהוֹיָקִים
  choice: Jojakim
  rationale: Etablierte deutsche Form des im hebräischen Text stehenden Namens; der Name wird nicht mit Eljakim harmonisiert.
- source_word: הַשְּׁלִשִׁי
  choice: der dritte
  rationale: Direkte und im Zusammenhang einheitliche Wiedergabe der Ordnungszahl.
- source_word: צִדְקִיָּהוּ
  choice: Zedekia
  rationale: Die im deutschen Bibelgebrauch etablierte Form des Königsnamens.
- source_word: הָרְבִיעִי
  choice: der vierte
  rationale: Direkte und im Zusammenhang einheitliche Wiedergabe der Ordnungszahl.
- source_word: שַׁלּוּם
  choice: Schallum
  rationale: Geläufige deutsche Umschrift des im hebräischen Text überlieferten Namens.
theological_decisions:
- issue: Genealogische Reihenfolge und Reihenfolge der Thronbesteigung
  choice: Die Söhne werden mit den im hebräischen Text gegebenen Ordnungszahlen aufgeführt.
  alternative: Die Namen im Haupttext nach der späteren Thronfolge umstellen oder harmonisieren.
  rationale: Der Vers präsentiert ausdrücklich eine genealogische Aufzählung. Eine mögliche Spannung zu den Königs- und Jeremiaberichten darf nicht durch eine Änderung des Haupttextes beseitigt werden.
- issue: Identität Schallums
  choice: Im Haupttext bleibt der Name Schallum stehen.
  alternative: Schallum im Haupttext durch Joahas ersetzen.
  rationale: שַׁלּוּם ist die überlieferte Lesart dieses Verses. Die verbreitete Identifizierung mit Joahas gehört in eine Fußnote und nicht als harmonisierende Ersetzung in den Text.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Listenstruktur und die vier Ordnungsangaben des Hebräischen bleiben erhalten; traditionelle, im Deutschen geläufige biblische Namensformen werden verwendet.
