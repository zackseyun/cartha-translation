id: 1CH.3.5
reference: 1 Chronicles 3:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵ֥לֶּה נוּלְּדוּ ל֖/וֹ בִּ/ירוּשָׁלָ֑יִם שִׁ֠מְעָא וְ/שׁוֹבָ֞ב וְ/נָתָ֤ן וּ/שְׁלֹמֹה֙ אַרְבָּעָ֔ה לְ/בַת שׁ֖וּעַ בַּת עַמִּיאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/005.yaml
  text: 'These were born to him in Jerusalem: Shimea[a], Shobab, Nathan[b], and Solomon—four by Bath-shua daughter of Ammiel.'
translation:
  language: de
  text: 'Und diese wurden ihm in Jerusalem geboren: Schimea[a], Schobab, Nathan und Salomo – vier von Bat-Schua[b], der Tochter Ammiëls.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In 2. Samuel 5,14 und der entsprechenden Parallelüberlieferung lautet der Name Schammua.
    reason: textual_variant
  - marker: b
    text: In 2. Samuel 11,3 wird sie Batseba, Tochter Eliams, genannt.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und diese
  rationale: Bewahrt den anschließenden Charakter der genealogischen Fortsetzung und die demonstrative Hervorhebung.
- source_word: נוּלְּדוּ לוֹ
  choice: wurden ihm … geboren
  rationale: Gibt den passiven Nifal von ילד und den Rückbezug des Pronomens auf David wieder, ohne den Namen im Vers ergänzend einzusetzen.
- source_word: בִּירוּשָׁלָיִם
  choice: in Jerusalem
  rationale: Direkte Wiedergabe der Ortsangabe.
- source_word: שִׁמְעָא
  choice: Schimea
  rationale: Gibt die im masoretischen Text dieses Verses vorliegende Namensform wieder und harmonisiert sie nicht mit der Parallelstelle.
- source_word: שׁוֹבָב
  choice: Schobab
  rationale: Übliche deutsche Umschrift des Eigennamens.
- source_word: נָתָן
  choice: Nathan
  rationale: Im Deutschen etablierte Form des Eigennamens.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Verwendet die im Deutschen etablierte Form des bekannten Königsnamens.
- source_word: אַרְבָּעָה
  choice: vier
  rationale: Die Zahl fasst die vier zuvor genannten Söhne zusammen.
- source_word: לְבַת שׁוּעַ
  choice: von Bat-Schua
  rationale: Bezeichnet in diesem genealogischen Zusammenhang die Mutter der vier Söhne; „von“ ist im Deutschen knapp und natürlich.
- source_word: בַּת עַמִּיאֵל
  choice: der Tochter Ammiëls
  rationale: Gibt die Abstammungsangabe wieder; die Form „Ammiëls“ macht die Genitivbeziehung eindeutig.
theological_decisions:
- issue: Namensform von Davids Frau in der Chronik gegenüber der Samuel-Parallele
  choice: Bat-Schua, Tochter Ammiëls
  alternative: Batseba, Tochter Eliams
  rationale: Der hebräische Text der Chronik hat „Bat-Schua, Tochter Ammiëls“. Diese Lesart wird nicht an die Parallelüberlieferung in 2. Samuel angeglichen; die abweichende Form wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit übersichtlicher genealogischer Satzstruktur. Die Eigennamen folgen der hebräischen Form dieses Verses beziehungsweise etablierten deutschen Namensformen. Die Fußnotenmarker sind den jeweils tatsächlich erläuterten Namen zugeordnet; dadurch wird eine offenkundige Vertauschung der Marker in der englischen Konsultationsfassung nicht übernommen.
