  text: וּ/בְנֵ֣י אֶלְיוֹעֵינַ֗י הדיוהו וְ/אֶלְיָשִׁ֡יב וּ/פְלָיָ֡ה וְ֠/עַקּוּב וְ/יוֹחָנָ֧ן וּ/דְלָיָ֛ה וַ/עֲנָ֖נִי שִׁבְעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/024.yaml
  text: 'And the sons of Elyoenai: Hodaviah[a], Eliashib, Pelaiah, Akkub, Johanan, Delaiah, and Anani—seven.'
translation:
  language: de
  text: 'Und die Söhne Eljoënais: Hodawja[a], Eljaschib, Pelaja, Akkub, Johanan, Delaja und Anani – sieben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Schreibung dieses Namens ist ungewöhnlich. „Hodawja“ folgt der wahrscheinlichsten herkömmlichen Zuordnung; möglich sind auch „Hodija“ oder eine stärker lautgetreue Umschrift wie „Hodewahu“.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Der Konstruktplural בְּנֵי bezeichnet in dieser genealogischen Aufzählung die Söhne; die vorangestellte Konjunktion wahrt den fortlaufenden Listencharakter.
- source_word: אֶלְיוֹעֵינַי
  choice: Eljoënai
  rationale: Der Personenname wird nach der hebräischen Lautung in einer für deutsche Leser verständlichen Form transliteriert; das Trema verhindert, dass oe als ein Laut gelesen wird.
- source_word: הדיוהו
  choice: Hodawja
  rationale: Die Schreibung ist ungewöhnlich. Hodawja folgt der wahrscheinlichen herkömmlichen Identifizierung, ohne die orthografische Schwierigkeit zu verschweigen.
- source_word: וְאֶלְיָשִׁיב
  choice: Eljaschib
  rationale: Deutsche Transliteration des Personennamens, wobei sch den hebräischen Sch-Laut wiedergibt.
- source_word: וּפְלָיָה
  choice: Pelaja
  rationale: Der Personenname wird in einer eingedeutschten Transliteration wiedergegeben; die Endung -ja vertritt das theophore Element יָה.
- source_word: וְעַקּוּב
  choice: Akkub
  rationale: Die Verdopplung von k spiegelt den durch Dagesch verstärkten Konsonanten wider.
- source_word: וְיוֹחָנָן
  choice: Johanan
  rationale: Konventionelle deutsche Wiedergabe dieses Personennamens, unterschieden von längeren theophoren Namensformen.
- source_word: וּדְלָיָה
  choice: Delaja
  rationale: Eingedeutschte Transliteration des Personennamens mit -ja für יָה.
- source_word: וַעֲנָנִי
  choice: und Anani
  rationale: Der Personenname wird transliteriert; die Konjunktion wird vor dem letzten Glied der Aufzählung natürlich wiedergegeben.
- source_word: שִׁבְעָה
  choice: sieben
  rationale: Die ausdrücklich genannte genealogische Gesamtzahl bleibt erhalten.
theological_decisions: []
