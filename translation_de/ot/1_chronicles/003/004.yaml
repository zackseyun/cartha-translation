  text: שִׁשָּׁה֙ נֽוֹלַד ל֣/וֹ בְ/חֶבְר֔וֹן וַ/יִּ֨מְלָךְ שָׁ֔ם שֶׁ֥בַע שָׁנִ֖ים וְ/שִׁשָּׁ֣ה חֳדָשִׁ֑ים וּ/שְׁלֹשִׁ֤ים וְ/שָׁלוֹשׁ֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/004.yaml
  text: Six were born to him in Hebron, and he reigned there seven years and six months; and in Jerusalem he reigned thirty-three years.
translation:
  language: de
  text: Sechs wurden ihm in Hebron geboren. Dort regierte er sieben Jahre und sechs Monate, und in Jerusalem regierte er dreiunddreißig Jahre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁשָּׁה
  choice: Sechs
  rationale: Die Kardinalzahl fasst die zuvor genannten Söhne zusammen. „Diese sechs“ wäre aus dem Zusammenhang verständlich, doch das Demonstrativpronomen steht nicht ausdrücklich im Hebräischen.
- source_word: נוֹלַד לוֹ
  choice: wurden ihm geboren
  rationale: Die passive Form von ילד mit ל und Pronominalsuffix wird formnah und im Deutschen verständlich wiedergegeben; „zeugte er“ würde die Aussage unnötig aktiv umformen.
- source_word: בְחֶבְרוֹן
  choice: in Hebron
  rationale: Direkte lokale Wiedergabe der Präposition mit dem Ortsnamen.
- source_word: וַיִּמְלָךְ שָׁם
  choice: Dort regierte er
  rationale: מלך bezeichnet hier die Ausübung der Königsherrschaft. „Regierte“ ist im modernen Deutschen natürlich; die Voranstellung von „Dort“ bewahrt den Ortsbezug.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: sieben Jahre und sechs Monate
  rationale: Natürliche und genaue Wiedergabe der Zeitangabe.
- source_word: וּשְׁלֹשִׁים וְשָׁלוֹשׁ שָׁנָה
  choice: dreiunddreißig Jahre
  rationale: Die hebräische Zahlenfolge wird nach heutiger deutscher Konvention wiedergegeben; der idiomatische Singular שָׁנָה verlangt im Deutschen keinen Singular.
- source_word: מָלַךְ בִּירוּשָׁלִָם
  choice: in Jerusalem regierte er
  rationale: Die Stellung des Ortsbezugs vor dem Verb erhält den Kontrast zwischen Hebron und Jerusalem und bleibt zugleich natürliches Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei Regierungssitze werden durch „Dort“ und „in Jerusalem“ klar gegenübergestellt; der erste längere hebräische Satz wird zur besseren Lesbarkeit in zwei deutsche Sätze gegliedert.
