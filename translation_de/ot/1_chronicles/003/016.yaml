  yaml_path: translation/ot/1_chronicles/003/016.yaml
  text: 'And the sons of Jehoiakim: Jeconiah his son[a], Zedekiah his son.'
translation:
  language: de
  text: 'Und die Söhne Jojakims: Jojachin, sein Sohn[a], Zedekia, sein Sohn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist knapp: »Jojachin, sein Sohn; Zedekia, sein Sohn.« Dies kann als genealogische Abfolge gelesen werden. Es ist jedoch umstritten, ob beide Namen als Söhne Jojakims genannt werden oder ob Zedekia hier als Sohn Jojachins erscheint.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: בְּנֵי ist der Konstruktplural von »Sohn« und leitet die genealogische Angabe ein; das vorangestellte ו wird als »Und« beibehalten, um den fortlaufenden Listencharakter zu wahren.
- source_word: יְהוֹיָקִים
  choice: Jojakim
  rationale: Verwendet wird die im modernen deutschen Bibelgebrauch etablierte Namensform.
- source_word: יְכָנְיָה
  choice: Jojachin
  rationale: Jojachin ist die geläufige deutsche biblische Namensform für den hier genannten judäischen König; sie gibt den Eigennamen traditionsgemäß wieder, ohne ihn inhaltlich zu übersetzen.
- source_word: בְנוֹ
  choice: sein Sohn
  rationale: Das Substantiv בֵּן mit Suffix der 3. Person Singular maskulin wird direkt als »sein Sohn« wiedergegeben. Die zweimalige Formulierung bleibt erhalten.
- source_word: צִדְקִיָּה
  choice: Zedekia
  rationale: Verwendet wird die etablierte deutsche biblische Namensform.
theological_decisions:
- issue: Genealogische Zuordnung in einer knappen und mehrdeutigen Formulierung
  choice: 'Die hebräische Wortfolge wird formal bewahrt: »sein Sohn Jojachin, sein Sohn Zedekia«.'
  alternative: Man kann beide Namen als Söhne Jojakims verstehen oder das zweite »sein Sohn« auf Jojachin beziehen und damit eine genealogische Abfolge lesen.
  rationale: Der hebräische Text nennt nach »die Söhne Jojakims« zweimal knapp Name plus »sein Sohn« und bezeichnet den jeweiligen Bezug nicht ausdrücklich. Die Übersetzung harmonisiert die Angabe nicht mit anderen Geschichtstexten und entscheidet die Zuordnung nicht stillschweigend.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit den im deutschen Bibelgebrauch vertrauten Namensformen. Die bewusst knappe Wiederholung folgt der Struktur des Hebräischen und bewahrt dessen Mehrdeutigkeit.
