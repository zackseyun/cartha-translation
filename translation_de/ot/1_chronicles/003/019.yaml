base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/019.yaml
  text: 'The sons of Pedaiah: Zerubbabel and Shimei[a]. And the sons of Zerubbabel: Meshullam and Hananiah; and Shelomith was their sister.'
translation:
  language: de
  text: Die Söhne Pedajas waren Serubbabel und Schimi. Und die Söhne Serubbabels waren[a] Meschullam und Hananja; Schelomit war ihre Schwester.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen: „und [der] Sohn Serubbabels“. Da anschließend Meschullam und Hananja genannt werden, wird die Singularform häufig als textliche Unregelmäßigkeit oder als genealogischer Sammelbegriff verstanden.'
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי פְדָיָה
  choice: Die Söhne Pedajas
  rationale: בְּנֵי bezeichnet in diesem genealogischen Zusammenhang am natürlichsten leibliche Söhne. Das einleitende וּ wird nicht eigens mit „und“ wiedergegeben, da die Wendung im Deutschen als neuer genealogischer Satz natürlicher klingt.
- source_word: זְרֻבָּבֶל
  choice: Serubbabel
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibeltradition transliteriert.
- source_word: וְשִׁמְעִי
  choice: und Schimi
  rationale: Die Konjunktion verbindet den zweiten genannten Sohn Pedajas mit Serubbabel.
- source_word: וּבֶן זְרֻבָּבֶל
  choice: Und die Söhne Serubbabels waren
  rationale: Der masoretische Text hat den Singular בֶן („Sohn“), doch anschließend werden zwei männliche Nachkommen genannt und ihre Schwester erwähnt. Der Haupttext gibt daher den im Zusammenhang naheliegenden Plural wieder; der Singular des Hebräischen bleibt in der Fußnote ausdrücklich sichtbar.
- source_word: מְשֻׁלָּם
  choice: Meschullam
  rationale: Der Personenname wird nach geläufiger deutscher Transliteration wiedergegeben.
- source_word: וַחֲנַנְיָה
  choice: und Hananja
  rationale: Die Konjunktion verbindet den zweiten männlichen Namen mit Meschullam.
- source_word: וּשְׁלֹמִית
  choice: Schelomit
  rationale: Der Personenname wird nach geläufiger deutscher Transliteration wiedergegeben; die Satzverknüpfung wird durch das Semikolon ausreichend markiert.
- source_word: אֲחוֹתָם
  choice: war ihre Schwester
  rationale: Das Pluralsuffix „ihre“ bezieht sich am natürlichsten auf Meschullam und Hananja. „war“ wird für einen idiomatischen deutschen Nominalsatz ergänzt.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem genealogischem Stil. Die traditionellen deutschen Namensformen werden beibehalten. Die echte Spannung zwischen dem hebräischen Singular und der anschließenden Namensreihe wird nicht verschwiegen, sondern in einer Fußnote dokumentiert.
