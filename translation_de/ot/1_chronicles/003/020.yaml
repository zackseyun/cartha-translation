  text: וַ/חֲשֻׁבָ֡ה וָ֠/אֹהֶל וּ/בֶרֶכְיָ֧ה וַֽ/חֲסַדְיָ֛ה י֥וּשַׁב חֶ֖סֶד חָמֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/020.yaml
  text: and Hashubah[a], Ohel, Berekiah, Hasadiah[b], and Jushab-hesed—five.
translation:
  language: de
  text: und Haschuba, Ohel, Berechja, Hasadja und Juschab-Hesed[b] – fünf[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht lediglich „fünf“ als Zusammenfassung der fünf zuvor genannten Namen. Sinngemäß könnte man ergänzen: „es waren fünf“.'
    reason: lexical_alternative
  - marker: b
    text: Der letzte Name besteht im Hebräischen aus zwei getrennt geschriebenen Elementen, „Juschab Hesed“, ist hier aber am besten als ein zusammengesetzter Personenname zu verstehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲשֻׁבָה
  choice: und Haschuba
  rationale: Der Personenname wird nach gängiger deutscher Bibelnamen-Schreibung wiedergegeben; das vorangestellte ו wird als „und“ übersetzt.
- source_word: וָ/אֹהֶל
  choice: Ohel
  rationale: Obwohl אֹהֶל auch „Zelt“ bedeutet, bezeichnet es hier einen Personennamen und wird daher transliteriert. Die weiteren hebräischen Bindewörter werden in der natürlichen deutschen Aufzählungsstruktur wiedergegeben.
- source_word: וּ/בֶרֶכְיָה
  choice: Berechja
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen Form wiedergegeben; das Namenselement יה erscheint als „-ja“.
- source_word: וַֽ/חֲסַדְיָה
  choice: Hasadja
  rationale: Direkte, deutsch lesbare Wiedergabe des Personennamens; das abschließende יה wird als „-ja“ dargestellt.
- source_word: י֥וּשַׁב חֶ֖סֶד
  choice: Juschab-Hesed
  rationale: Die zwei getrennt geschriebenen hebräischen Bestandteile werden als ein zusammengesetzter Personenname verstanden. Der Bindestrich macht diese Einheit im Deutschen kenntlich.
- source_word: חָמֵשׁ
  choice: fünf
  rationale: Die Kardinalzahl fasst die unmittelbar zuvor genannten fünf Namen zusammen. Die knappe, elliptische Form des Hebräischen bleibt erhalten.
