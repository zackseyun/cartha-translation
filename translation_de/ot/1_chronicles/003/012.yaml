lexical_decisions:
- source_word: אֲמַצְיָהוּ
  choice: Amazja
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: בְנוֹ
  choice: sein Sohn
  rationale: Die Verbindung aus בֵּן und dem Suffix der 3. Person Singular maskulin bezeichnet hier unmittelbar „sein Sohn“. Die dreimal wiederkehrende genealogische Formel wird einheitlich übersetzt.
- source_word: עֲזַרְיָה
  choice: Asarja
  rationale: Die Übersetzung folgt der hier tatsächlich stehenden hebräischen Namensform und gleicht sie nicht stillschweigend an den andernorts verwendeten Namen Usija an.
- source_word: יוֹתָם
  choice: Jotam
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
theological_decisions:
- issue: Sohnschaftsformel in der königlichen Genealogie
  choice: Die wörtliche Formel „sein Sohn“ wird an allen drei Stellen beibehalten.
  alternative: „sein Nachkomme“
  rationale: Obwohl biblische Genealogien mitunter Generationen überspringen können, steht im Hebräischen ausdrücklich dreimal בְנוֹ. Die Wiedergabe „sein Sohn“ wahrt die Form und Aussage des Ausgangstextes, ohne sie unnötig zu verallgemeinern.
- issue: Namensform Asarja beziehungsweise Usija
  choice: Im Haupttext steht „Asarja“.
  alternative: „Usija“
  rationale: Der masoretische Text bietet hier עֲזַרְיָה. Die andere Bezeichnung dieses Königs wird zur Orientierung in einer Fußnote genannt, ohne den Wortlaut des Ausgangstextes zu harmonisieren.
translation_notes:
  register: Knappe, würdevolle genealogische Reihung in modernem Standarddeutsch. Semikolons verdeutlichen die drei aufeinanderfolgenden Glieder, ohne zusätzliche Verben einzuführen.
