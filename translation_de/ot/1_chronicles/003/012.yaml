  text: Amaziah his son[a], Azariah his son, Jotham his son.
translation:
  language: de
  text: Amazja, sein Sohn; Asarja[a], sein Sohn; Jotam, sein Sohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser König wird an anderen Stellen auch Usija genannt.
