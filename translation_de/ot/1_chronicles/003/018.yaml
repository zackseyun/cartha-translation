base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/018.yaml
  text: Malchiram[a], Pedaiah, Shenazzar, Jekamiah, Hoshama, and Nedabiah.
translation:
  language: de
  text: Malkiram, Pedaja, Schenazzar, Jekamja, Hoschama und Nedabja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכִּירָם
  choice: Malkiram
  rationale: Personenname in einem Geschlechtsregister; nach dem Hebräischen transliteriert. Die Schreibung mit k gibt den Konsonanten כּ im Deutschen klar wieder.
- source_word: פְדָיָה
  choice: Pedaja
  rationale: Personenname; die Endung -ja gibt das theophore Element יָה in geläufiger deutscher Bibelnamenschreibung wieder.
- source_word: שֶׁנְאַצַּר
  choice: Schenazzar
  rationale: Personenname; Sch- bildet den hebräischen Anlaut שׁ ab, während -zz- die Konsonantenverdopplung des punktierten Textes erkennen lässt.
- source_word: יְקַמְיָה
  choice: Jekamja
  rationale: Personenname; J entspricht der üblichen deutschen Wiedergabe des anlautenden י, und -ja bildet die Endung יָה ab.
- source_word: הוֹשָׁמָע
  choice: Hoschama
  rationale: Personenname; die Form folgt der masoretischen Vokalisierung und verwendet deutsches sch für שׁ.
- source_word: נְדַבְיָה
  choice: Nedabja
  rationale: Personenname; transliteriert mit der im Deutschen verständlichen theophoren Endung -ja.
- source_word: וּ / וְ
  choice: und
  rationale: Die vorangestellte Konjunktion verbindet die Namen. Für eine natürliche deutsche Aufzählung stehen Kommas zwischen den Namen und nur vor dem letzten Namen ein ausdrückliches „und“.
