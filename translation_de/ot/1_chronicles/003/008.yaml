lexical_decisions:
- source_word: אֱלִישָׁמָע
  choice: Elischama
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition aus dem Hebräischen umschrieben.
- source_word: אֶלְיָדָע
  choice: Eljada
  rationale: Der Personenname wird in einer im Deutschen geläufigen, an der hebräischen Form orientierten Schreibweise wiedergegeben.
- source_word: אֱלִיפֶלֶט
  choice: Elifelet
  rationale: Die volle hebräische Namensform dieses Verses wird transliteriert; sie wird nicht mit einer anderswo vorkommenden kürzeren Form gleichgesetzt.
- source_word: וְ / וֶ
  choice: und; sonst durch Aufzählungszeichen wiedergegeben
  rationale: Das wiederholte hebräische Waw vor den Namen wird in einer natürlichen deutschen Aufzählung nur vor dem letzten Glied ausdrücklich mit „und“ wiedergegeben.
- source_word: תִּשְׁעָה
  choice: insgesamt neun
  rationale: Die Kardinalzahl bedeutet „neun“ und fasst hier die in den Versen 5–8 aufgeführten Söhne zusammen. „Insgesamt“ verdeutlicht diese syntaktisch knappe Zählfunktion, ohne den Bezug festzulegen, der in der Fußnote erläutert wird.
