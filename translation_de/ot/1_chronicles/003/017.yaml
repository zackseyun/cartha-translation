  text: וּ/בְנֵי֙ יְכָנְיָ֣ה אַסִּ֔ר שְׁאַלְתִּיאֵ֖ל בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/017.yaml
  text: 'And the sons of Jeconiah: Assir[a], Shealtiel his son.'
translation:
  language: de
  text: 'Und die Söhne Jekonjas: Assir[a], Schealtiel, sein Sohn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und die Söhne Jekonjas, des Gefangenen: Schealtiel, sein Sohn.“ Das hebräische Wort אַסִּר kann entweder als Personenname Assir oder als Substantiv „Gefangener“ verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Und die Söhne
  rationale: Das ו wird als „Und“ wiedergegeben, um die fortlaufende Genealogie zu bewahren; בְנֵי hat hier seinen üblichen genealogischen Sinn.
- source_word: יְכָנְיָה
  choice: Jekonja
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamenform wiedergegeben.
- source_word: אַסִּר
  choice: Assir
  rationale: Die Form kann sowohl ein Personenname als auch das Substantiv „Gefangener“ sein. Im Haupttext wird sie entsprechend der masoretischen Punktierung und der listenartigen Syntax als Name verstanden; die andere Lesart bleibt in der Fußnote erhalten.
- source_word: שְׁאַלְתִּיאֵל
  choice: Schealtiël
  rationale: Der hebräische Personenname wird in einer im Deutschen verständlichen, quellenahen Form transliteriert; der Trema kennzeichnet die getrennte Aussprache der Vokale.
- source_word: בְּנוֹ
  choice: sein Sohn
  rationale: Das Suffix bezeichnet Zugehörigkeit; „sein Sohn“ ist die natürliche deutsche Wiedergabe in einer Genealogie und bezieht sich im dargestellten Stammbaum am ehesten auf Jekonja.
theological_decisions:
- issue: Ob אַסִּר als Eigenname oder als Bezeichnung „der Gefangene“ zu verstehen ist
  choice: Im Haupttext als Eigenname „Assir“
  alternative: '„Und die Söhne Jekonjas, des Gefangenen: Schealtiël, sein Sohn.“'
  rationale: Der hebräische Ausdruck lässt beide Deutungen zu. Die masoretische Punktierung und die Form der genealogischen Liste stützen die Lesung als Personenname, ohne die historisch bedeutsame alternative Deutung auszuschließen. Deshalb wird diese nicht stillschweigend beseitigt, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper genealogischer Satzstruktur. Die genuine lexikalische Mehrdeutigkeit von אַסִּר wird im Haupttext markiert und in der Fußnote offengelegt.
