source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הָיוּ֙ בְּנֵ֣י דָויִ֔ד אֲשֶׁ֥ר נֽוֹלַד ל֖/וֹ בְּ/חֶבְר֑וֹן הַ/בְּכ֣וֹר אַמְנֹ֗ן לַ/אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית שֵׁנִי֙ דָּנִיֵּ֔אל לַ/אֲבִיגַ֖יִל הַֽ/כַּרְמְלִֽית־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/001.yaml
  text: 'These were David’s sons who were born to him in Hebron: the firstborn[a], Amnon, by Ahinoam the Jezreelite; the second, Daniel, by Abigail the Carmelite.'
translation:
  language: de
  text: 'Dies waren Davids Söhne, die ihm in Hebron geboren wurden: der Erstgeborene, Amnon, von Ahinoam aus Jesreel; der zweite, Daniel[a], von Abigajil aus Karmel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der parallelen Liste in 2. Samuel 3,3 heißt dieser Sohn Kilab statt Daniel.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה הָיוּ
  choice: Dies waren
  rationale: Die Formulierung leitet den genealogischen Abschnitt ein. Das hebräische וְ verbindet mit dem Kontext; im natürlichen modernen Deutsch wird diese Verbindung hier ohne ein schwerfälliges einleitendes „Und“ ausgedrückt.
- source_word: בְּנֵי דָוִיד
  choice: Davids Söhne
  rationale: Die Genitivverbindung bezeichnet ausdrücklich männliche Nachkommen und wird im Deutschen knapp und idiomatisch wiedergegeben.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: die ihm … geboren wurden
  rationale: Bewahrt sowohl die passive Verbform als auch den Bezug auf David durch den Dativ.
- source_word: בְּחֶבְרוֹן
  choice: in Hebron
  rationale: Direkte und übliche Wiedergabe der Ortsangabe.
- source_word: הַבְּכוֹר
  choice: der Erstgeborene
  rationale: Bewahrt den genealogischen Statusbegriff und reduziert ihn nicht bloß auf eine Altersangabe.
- source_word: לַאֲחִינֹעַם הַיִּזְרְעֵאלִית
  choice: von Ahinoam aus Jesreel
  rationale: Das לְ kennzeichnet hier die Mutter; „von“ ist im Deutschen eine natürliche Herkunfts- beziehungsweise Abstammungsformulierung. Das feminine Herkunftsadjektiv wird verständlich mit „aus Jesreel“ wiedergegeben.
- source_word: שֵׁנִי דָּנִיֵּאל
  choice: der zweite Daniel
  rationale: Gibt die Reihenfolge und den im masoretischen Text dieses Verses bezeugten Namen unmittelbar wieder.
- source_word: לַאֲבִיגַיִל הַכַּרְמְלִית
  choice: von Abigajil aus Karmel
  rationale: Parallele Wiedergabe der Mutterangabe; das feminine Herkunftsadjektiv bezeichnet Abigajils Verbindung mit Karmel.
theological_decisions:
- issue: Abweichender Name in der Parallelüberlieferung
  choice: Im Haupttext steht entsprechend dem WLC „Daniel“; die Abweichung wird in einer Fußnote genannt.
  alternative: Den Namen aus 2. Samuel 3,3 („Kilab“) in den Haupttext übernehmen.
  rationale: Die eigenständige Lesart von 1. Chronik 3,1 darf nicht stillschweigend an die Parallelstelle angeglichen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper genealogischer Satzstruktur. Die Herkunftsbezeichnungen werden transparent als „aus Jesreel“ und „aus Karmel“ formuliert; dadurch werden altertümliche feminine Einwohnerbezeichnungen vermieden. Der Fußnotenmarker steht unmittelbar bei Daniel, da die Textvariante diesen Namen betrifft.
