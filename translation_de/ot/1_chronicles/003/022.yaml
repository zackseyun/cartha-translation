  text: 'And the sons of Shecaniah: Shemaiah. And the sons of Shemaiah: Hattush[a], Igal, Bariah, Neariah, and Shaphat—six.'
translation:
  language: de
  text: 'Und die Söhne Schechanjas: Schemaja. Und die Söhne Schemajas: Hattusch, Jigal, Bariach, Nearja und Schafat – sechs[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im hebräischen Text steht »sechs«, obwohl im masoretischen Text hier nur fünf Namen aufgeführt sind. Möglicherweise liegt ein Textproblem vor oder bei der Überlieferung ist ein Name ausgefallen.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Gibt die genealogische Konstruktverbindung unmittelbar wieder; obwohl בנים in Stammbäumen auch Nachkommen bezeichnen kann, werden hier namentlich aufgeführte Glieder der Linie genannt.
- source_word: שְׁכַנְיָה
  choice: Schechanja
  rationale: Der Personenname wird nach im Deutschen gebräuchlichen bibelhebräischen Umschriftkonventionen wiedergegeben.
- source_word: שְׁמַעְיָה
  choice: Schemaja
  rationale: Der Personenname wird einheitlich und in einer geläufigen deutschen Form transliteriert.
- source_word: חַטּוּשׁ
  choice: Hattusch
  rationale: Lautnahe deutsche Umschrift des Personennamens.
- source_word: יִגְאָל
  choice: Jigal
  rationale: Die deutsche Umschrift gibt den anlautenden hebräischen J-Laut und die Konsonantenfolge des Namens wieder.
- source_word: בָרִיחַ
  choice: Bariach
  rationale: Folgt dem masoretischen בָרִיחַ und bewahrt insbesondere den Schlusskonsonanten ח; die geläufigere Namensform Beria wird nicht in den Text eingetragen.
- source_word: נְעַרְיָה
  choice: Nearja
  rationale: Lautnahe und im Deutschen gut lesbare Wiedergabe des Personennamens.
- source_word: שָׁפָט
  choice: Schafat
  rationale: Lautnahe deutsche Umschrift des Personennamens.
- source_word: שִׁשָּׁה
  choice: sechs
  rationale: Die Zahl wird entsprechend dem masoretischen Text unverändert wiedergegeben, obwohl dieser Vers nur fünf Namen aufführt.
