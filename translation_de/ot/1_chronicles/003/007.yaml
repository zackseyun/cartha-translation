lexical_decisions:
- source_word: נֹגַהּ
  choice: Nogah
  rationale: Der Personenname wird nicht übersetzt, sondern in einer im Deutschen gut lesbaren Form wiedergegeben. Das abschließende h bildet den hebräischen Endkonsonanten הּ ab.
- source_word: נֶפֶג
  choice: Nefeg
  rationale: Der Personenname wird nach dem hebräischen Lautbestand ins Deutsche übertragen; das unpunktierte פ wird hier als f wiedergegeben.
- source_word: יָפִיעַ
  choice: Jafia
  rationale: 'Der Personenname wird in deutscher Umschrift wiedergegeben: anlautendes י als J und der Konsonant ע ohne eigenes Schriftzeichen, da er im modernen deutschen Namensbild gewöhnlich nicht markiert wird.'
- source_word: וְ
  choice: und
  rationale: Die wiederholte hebräische Konjunktion verbindet die Namen. Nach natürlichem deutschem Listenstil stehen Kommas zwischen den ersten Gliedern und „und“ nur vor dem letzten Namen.
