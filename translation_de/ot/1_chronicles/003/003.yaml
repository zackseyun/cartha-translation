base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/003.yaml
  text: the fifth[a], Shephatiah, by Abital; the sixth, Ithream[b], by Eglah his wife.
translation:
  language: de
  text: der fünfte, Schefatja, von Abital; der sechste, Jitream, von Egla, seiner Frau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Manche Ausleger setzen Egla mit Michal gleich; der Text selbst sagt das jedoch nicht.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: der fünfte
  rationale: Der bestimmte hebräische Ordinalausdruck setzt die nummerierte Aufzählung der Söhne Davids fort.
- source_word: שְׁפַטְיָה
  choice: Schefatja
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren, hebräisch orientierten Form wiedergegeben.
- source_word: לַאֲבִיטָל
  choice: von Abital
  rationale: Die Präposition ל bezeichnet in dieser genealogischen Formel die mütterliche Zuordnung; „von Abital“ ist knapp und natürlich, ohne eine Zeugung durch die Mutter auszudrücken.
- source_word: הַשִּׁשִּׁי
  choice: der sechste
  rationale: Die bestimmte Ordnungszahl wird parallel zum vorherigen Glied der Liste wiedergegeben.
- source_word: יִתְרְעָם
  choice: Jitream
  rationale: Der Personenname wird in einer im Deutschen üblichen, hebräisch orientierten Umschrift wiedergegeben.
- source_word: לְעֶגְלָה
  choice: von Egla
  rationale: Wie zuvor kennzeichnet ל in der genealogischen Formel die Mutter des genannten Sohnes.
- source_word: אִשְׁתּוֹ
  choice: seiner Frau
  rationale: אִשָּׁה mit Suffix bezeichnet im ehelichen Zusammenhang „seine Frau“; die Wendung steht als nähere Bestimmung zu Egla und bezieht sich auf David.
theological_decisions:
- issue: Bezug und Bedeutung von „seiner Frau“ bei Egla
  choice: Die ausdrückliche Bezeichnung Eglas als Davids Frau bleibt stehen, ohne ihren möglichen besonderen Zweck zu erklären.
  alternative: Egla mit Michal gleichsetzen oder aus der Formulierung einen besonderen Rang unter Davids Frauen ableiten.
  rationale: Der hebräische Text nennt lediglich „Egla, seine Frau“. Er erklärt weder, weshalb dies eigens erwähnt wird, noch setzt er Egla ausdrücklich mit einer anderen Frau gleich.
translation_notes:
  register: Knappes, würdiges genealogisches Deutsch. Die parallele Listenstruktur des Hebräischen bleibt erhalten. „Von“ gibt die mütterliche Zuordnung idiomatisch wieder; die Fußnote wahrt die überlieferte Auslegungsfrage, ohne sie in den Text einzutragen.
