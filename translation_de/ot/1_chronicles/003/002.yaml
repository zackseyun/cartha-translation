  text: הַ/שְּׁלִשִׁי֙ לְ/אַבְשָׁל֣וֹם בֶּֽן מַעֲכָ֔ה בַּת תַּלְמַ֖י מֶ֣לֶךְ גְּשׁ֑וּר הָ/רְבִיעִ֖י אֲדֹנִיָּ֥ה בֶן חַגִּֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/002.yaml
  text: the third[a], Absalom son of Maacah, daughter of Talmai king of Geshur; the fourth, Adonijah son of Haggith.
translation:
  language: de
  text: 'der dritte: Absalom, der Sohn Maachas, der Tochter Talmais, des Königs von Geschur; der vierte: Adonija, der Sohn Haggits.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְּׁלִישִׁי
  choice: der dritte
  rationale: Der bestimmte Ordnungszahl-Ausdruck setzt die Aufzählung der Söhne Davids aus dem vorherigen Vers fort.
- source_word: לְאַבְשָׁלוֹם בֶּן מַעֲכָה
  choice: Absalom, der Sohn Maachas
  rationale: Die Präposition markiert hier das Glied der Aufzählung; בֶּן bezeichnet die Abstammung. Die deutsche Genitivform ist in einer würdevollen genealogischen Liste natürlich.
- source_word: בַּת תַּלְמַי
  choice: der Tochter Talmais
  rationale: בַּת bedeutet unmittelbar „Tochter“. Der Genitiv macht eindeutig, dass Maacha als Tochter Talmais bezeichnet wird.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: des Königs von Geschur
  rationale: Die hebräische Status- und Herrschaftsangabe bezieht sich auf Talmai; die deutsche Apposition gibt diese Beziehung klar wieder.
- source_word: הָרְבִיעִי
  choice: der vierte
  rationale: Die bestimmte Ordnungszahl führt die nummerierte Liste parallel fort.
- source_word: אֲדֹנִיָּה בֶן חַגִּית
  choice: Adonija, der Sohn Haggits
  rationale: Die Eigennamen folgen den im Deutschen geläufigen biblischen Formen; בֶּן wird als direkte Abstammungsangabe wiedergegeben.
