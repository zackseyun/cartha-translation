base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/010.yaml
  text: And the son of Solomon was Rehoboam; Abijah his son[a], Asa his son, Jehoshaphat his son.
translation:
  language: de
  text: Und Salomos Sohn war Rehabeam; dessen Sohn war Abija[a], dessen Sohn Asa, dessen Sohn Joschafat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Abija“. In 1–2 Könige wird derselbe König auch mit der abweichenden Namensform „Abijam“ bezeichnet.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֶן שְׁלֹמֹה
  choice: Und Salomos Sohn
  rationale: Die Verbindung aus ו und בֶן im Konstruktus führt das nächste Glied der Genealogie ein. Die Formulierung bewahrt sowohl den Anschluss als auch die genealogische Struktur.
- source_word: רְחַבְעָם
  choice: Rehabeam
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: אֲבִיָּה
  choice: Abija
  rationale: Entspricht der hier im Chronikbuch belegten Namensform; die abweichende Form Abijam begegnet in den Königsbüchern.
- source_word: בְנ/וֹ
  choice: dessen Sohn
  rationale: Das Substantiv mit Suffix der 3. Person maskulin Singular bezeichnet jeweils die Sohnes- und Nachfolgebeziehung. „Dessen Sohn“ hält die Bezugskette im Deutschen eindeutig und bewahrt die Wiederholung.
- source_word: אָסָא
  choice: Asa
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: יְהוֹשָׁפָט
  choice: Joschafat
  rationale: Im Deutschen gebräuchliche biblische Namensform.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst beibehaltener genealogischer Wiederholung. „Dessen Sohn“ vermeidet die im Deutschen mögliche Unklarheit von mehrfach aufeinanderfolgendem „sein Sohn“.
