source:
  edition: WLC
  text: וְ/עַתָּ֣ה יְהוָ֔ה אַתָּה ה֖וּא הָ/אֱלֹהִ֑ים וַ/תְּדַבֵּר֙ עַֽל עַבְדְּ/ךָ֔ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/026.yaml
  text: And now[a], Yahweh, you are God, and you have spoken this good thing concerning your servant.
translation:
  language: de
  text: Und nun, Jahwe, du bist Gott, und du hast dieses Gute über deinen Diener gesagt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Du hast dieses Gute über deinen Diener gesprochen.« Im Zusammenhang kann damit eine gute Verheißung gemeint sein.'
    reason: lexikalische Alternative und Bewahrung der im Hebräischen weniger ausdrücklich festgelegten Aussage
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Konjunktion als auch den Übergang zur gegenwärtigen Folgerung im Gebet.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen in der im Deutschen geläufigen Transkription wieder.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: Du bist Gott
  rationale: Die hebräische Pronomenfolge ist nachdrücklich; die natürliche deutsche Aussage bewahrt das Bekenntnis zur Identität Gottes, ohne das unidiomatische »der Gott« zu erzwingen.
- source_word: וַתְּדַבֵּר
  choice: du hast … zugesagt
  rationale: Das Verb bedeutet grundsätzlich »reden/sagen«; im Zusammenhang bezeichnet die Aussage jedoch das zuvor ergangene gute Gotteswort. »Zugesagt« macht diesen Bezug im Deutschen verständlich, ohne so eng wie »versprochen« festzulegen.
- source_word: עַל עַבְדְּךָ
  choice: deinem Diener
  rationale: Die Präposition bezeichnet hier den Bezug der göttlichen Aussage. Der deutsche Dativ ist in Verbindung mit »zusagen« die natürliche Wiedergabe; »Diener« entspricht der demütigen Selbstbezeichnung Davids.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: dieses Gute
  rationale: Bewahrt die substantivierte, allgemein gehaltene Formulierung des Hebräischen und legt sie nicht vollständig auf »Verheißung« fest.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird sichtbar wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Charakter des guten Gotteswortes
  choice: dieses Gute zugesagt
  alternative: diese gute Verheißung gegeben
  rationale: Der Kontext legt eine Zusage nahe, doch das Hebräische nennt sie wörtlich nur »dieses Gute«. Die gewählte Formulierung wahrt mehr von dieser Offenheit; die Fußnote nennt die formale Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach der Anrede gliedert den Gebetssatz klar. »Dieses Gute« ist bewusst etwas gehobener, bleibt aber verständlich und hält sich eng an die offene hebräische Formulierung.
