source:
  edition: WLC
  text: וְ֠/יֵֽאָמֵן וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֱלֹהִ֖ים לְ/יִשְׂרָאֵ֑ל וּ/בֵית דָּוִ֥יד עַבְדְּ/ךָ֖ נָכ֥וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/024.yaml
  text: May it be established[a], and may your name be magnified forever, saying, ‘Yahweh of hosts, the God of Israel[b], is God to Israel,’ and may the house of David your servant be established before you.
translation:
  language: de
  text: 'Und möge es Bestand haben, und dein Name möge für immer groß werden, damit man sagt: »Jahwe der Heerscharen, der Gott Israels, ist Gott für Israel[a].« Und das Haus[b] deines Dieners David möge vor dir fest bestehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ist Israels Gott«. Wörtlich: »ist Gott für Israel«.'
    reason: lexical_alternative
  - marker: b
    text: Mit Davids »Haus« ist hier sein Königshaus, also seine Dynastie, gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵאָמֵן
  choice: Und es möge sich bestätigen
  rationale: Das Nifal von אמן bezeichnet hier im Gebetszusammenhang das feste Eintreffen beziehungsweise die Bestätigung der zuvor gegebenen Verheißung. Das unpersönliche „es“ wahrt, dass im Vers selbst kein ausdrückliches Subjekt genannt wird.
- source_word: וְיִגְדַּל שִׁמְךָ
  choice: und dein Name möge ... groß werden
  rationale: Die jussivische Gebetsbitte und das Bild des groß werdenden Namens werden unmittelbar bewahrt; „Name“ umfasst Ansehen und offenbarte Identität, ohne diese auszudeuten.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Natürliche moderne Wiedergabe der zeitlich unbegrenzten Dauer.
- source_word: לֵאמֹר
  choice: sodass man sagt
  rationale: Gibt idiomatisch wieder, dass die folgende Aussage als öffentliche Bekundung aus der Erfüllung hervorgeht.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „Heerscharen“ lässt die umfassende, nicht nur irdisch-militärische Bedeutung des Titels offen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Entspricht der hebräischen Genitivverbindung und ihrer Bundesbeziehung.
- source_word: אֱלֹהִים לְיִשְׂרָאֵל
  choice: ist Gott für Israel
  rationale: „Für Israel“ bewahrt die relationale beziehungsweise zugunsten Israels deutbare Kraft der Präposition ל, statt sie vollständig in ein Besitzverhältnis aufzulösen.
- source_word: וּבֵית דָּוִיד עַבְדְּךָ
  choice: Und das Haus deines Dieners David
  rationale: „Haus“ erhält das hebräische Bild; im Zusammenhang bezeichnet es Davids Königshaus beziehungsweise Dynastie.
- source_word: נָכוֹן לְפָנֶיךָ
  choice: möge vor dir fest bestehen
  rationale: נכון beschreibt den gefestigten, dauerhaften Bestand. „Vor dir“ wahrt die räumlich-relationale Ausdrucksweise von לְפָנֶיךָ.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der persönliche Gottesname des hebräischen Textes wird wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Modalität der Verbformen im Gebet
  choice: Optativ mit „möge“
  alternative: 'Futur beziehungsweise Feststellung: „Es wird sich bestätigen ...“'
  rationale: Davids Rede ist hier eine Gebetsbitte als Antwort auf Gottes Verheißung; die Wunschform bildet diesen Zusammenhang ab, ohne die Gewissheit der Verheißung in eine bloße Möglichkeit umzudeuten.
- issue: Bedeutung von אֱלֹהִים לְיִשְׂרָאֵל
  choice: Gott für Israel
  alternative: Israels Gott; Gott gegenüber Israel
  rationale: Die Formulierung hält die ungewöhnliche Präpositionalverbindung und ihre mögliche relationale beziehungsweise benefaktive Nuance offen. Die glattere possessive Lesart wird in der Fußnote genannt.
- issue: Bedeutung von „Haus Davids“
  choice: Haus im Haupttext, dynastische Erklärung in der Fußnote
  alternative: Dynastie Davids
  rationale: So bleibt das biblische Bild erhalten, während der politisch-dynastische Sinn für heutige Leser verständlich wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gebetsform wird durch wiederholtes „möge“ hörbar gemacht. Ungewöhnliche, theologisch gewichtige Wendungen werden nicht stillschweigend geglättet; notwendige Erläuterungen stehen knapp in den Fußnoten.
