  source_fidelity: 'Die optative Wiedergabe der drei Verbformen und die Beibehaltung von „Jahwe“, „Heerscharen“, „Name“, „Gott für Israel“ sowie „Haus“ entsprechen dem hebräischen Text gut. „sich bestätigen“ ist jedoch für וְיֵאָמֵן weniger treffend: Das Nifal zielt hier auf festen Bestand bzw. Etabliertsein der Verheißung, nicht primär auf nachträgliche Bestätigung.'
