source:
  edition: WLC
  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗יד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מִֽן אַחֲרֵ֖י הַ/צֹּ֑אן לִ/הְי֣וֹת נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/007.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people Israel.'
translation:
  language: de
  text: 'Und nun sollst du zu meinem Diener David sagen: So spricht Jahwe der Heerscharen: Ich habe dich von der Weide[a] geholt, wo du der Herde folgtest, damit du Herrscher[b] über mein Volk Israel wirst.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Weideplatz“; möglicherweise: „von der Schafhürde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Anführer“ oder „Fürst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt sowohl die anknüpfende Konjunktion als auch den Übergang zum jetzt folgenden Auftrag wieder, ohne einen im Hebräischen nicht zwingend ausgedrückten Folgeschluss zu verstärken.
- source_word: כֹּה תֹאמַר
  choice: sollst du ... sagen
  rationale: Natürliches modernes Deutsch mit dem direktiven Sinn der hebräischen Botenformel.
- source_word: לְעַבְדִּי
  choice: zu meinem Diener
  rationale: „Diener“ entspricht hier Davids ehrenvoller Stellung im Dienst Gottes besser als „Sklave“, ohne das Verhältnis der Unterordnung aufzuheben.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die prägnante prophetische Botenformel und gibt das performativ gebrauchte Perfekt idiomatisch wieder.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Gibt den Gottesnamen ausdrücklich wieder; „Heerscharen“ lässt die mögliche Breite des Titels über rein menschliche Armeen hinaus offen.
- source_word: לְקַחְתִּיךָ
  choice: Ich habe dich ... geholt
  rationale: Drückt Gottes Initiative bei Davids Herausnahme aus seinem bisherigen Lebensbereich in natürlichem Deutsch aus.
- source_word: מִן הַנָּוֶה
  choice: von der Weide
  rationale: Der Hirtenkontext legt einen Weideplatz nahe; die mögliche Bedeutung „Hürde“ wird in der Fußnote offengehalten.
- source_word: מִן אַחֲרֵי הַצֹּאן
  choice: hinter der Herde weg
  rationale: Bewahrt das konkrete Bild Davids, der hinter der Herde hergeht, statt es ausschließlich als allgemeines Hüten zu paraphrasieren.
- source_word: לִהְיוֹת נָגִיד
  choice: damit du Herrscher ... wirst
  rationale: Gibt Ziel beziehungsweise Ergebnis von Gottes Handeln verständlich wieder; „Herrscher“ bezeichnet die übertragene Leitungsgewalt, ohne den Ausdruck vorschnell mit „König“ gleichzusetzen.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: über mein Volk Israel
  rationale: Bewahrt sowohl Gottes Besitzanspruch als auch die Identifikation des Volkes mit Israel in natürlicher deutscher Wortfolge.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsnuance von עַבְדִּי als Bezeichnung Davids
  choice: mein Diener David
  alternative: mein Sklave David
  rationale: Im Kontext bezeichnet der Ausdruck David als den Gott unterstellten und von ihm beauftragten königlichen Diener; „Diener“ wahrt diese Beziehung, ohne unangemessen den rechtlichen Sklavenstatus in den Vordergrund zu rücken.
- issue: Amtsbezeichnung נָגִיד
  choice: Herrscher
  alternative: Anführer; Fürst
  rationale: Der Ausdruck bezeichnet eine von Gott eingesetzte Leitungsperson. „Herrscher“ erhält die Regierungsautorität, ohne die Bezeichnung mit dem präziseren Königstitel gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Botenformel bleibt erkennbar; das Hirtenbild wird konkret bewahrt. „Heerscharen“ ist bewusst bibelsprachlich, aber weiterhin verständlich und semantisch weiter als „Armeen“.
