  text: יְהוָה֙ אֵ֣ין כָּמ֔וֹ/ךָ וְ/אֵ֥ין אֱלֹהִ֖ים זוּלָתֶ֑/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/020.yaml
  text: O Yahweh[a], there is none like you, and there is no God besides you, in all that we have heard with our own ears.
translation:
  language: de
  text: HERR, niemand ist dir gleich, und es gibt keinen Gott außer dir, in allem, was wir mit eigenen Ohren gehört haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'HERR steht für den Gottesnamen JHWH, häufig „Jahwe“ wiedergegeben. Der letzte Satzteil kann auch heißen: „nach allem, was wir mit eigenen Ohren gehört haben“.'
    reason: Kennzeichnung des Gottesnamens und Erhaltung der möglichen syntaktischen Nuance von בְּכֹל אֲשֶׁר.
lexical_decisions:
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen kennzeichnet den Gottesnamen JHWH würdig und verständlich; im Ausgangstext steht der Name ohne vorangestellte Interjektion.
- source_word: אֵין כָּמוֹךָ
  choice: niemand ist dir gleich
  rationale: Gibt die Aussage, dass kein vergleichbares Wesen existiert, in natürlichem modernem Deutsch wieder.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: und es gibt keinen Gott außer dir
  rationale: Bewahrt die uneingeschränkte Exklusivitätsaussage; זוּלָתֶךָ bedeutet hier „außer dir“ beziehungsweise „neben dir“.
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ
  choice: nach allem, was wir ... gehört haben
  rationale: Das בְ bezeichnet plausibel die Grundlage beziehungsweise Übereinstimmung mit dem gesamten Gehörten; „nach allem“ ist im Deutschen idiomatisch.
- source_word: בְּאָזְנֵינוּ
  choice: mit eigenen Ohren
  rationale: Idiommatische und anschauliche Wiedergabe des hebräischen Ausdrucks „mit/in unseren Ohren“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: HERR
  alternative: Jahwe
  rationale: „HERR“ folgt einer weithin verständlichen deutschen Bibelkonvention, ohne eine unsichere Vokalisierung in den Haupttext zu setzen; die Fußnote macht den zugrunde liegenden Eigennamen transparent.
- issue: Tragweite von וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: 'uneingeschränkte Aussage: „es gibt keinen Gott außer dir“'
  alternative: bloße Überlegenheit gegenüber anderen Göttern
  rationale: Die Konstruktion mit אֵין und זוּלָתֶךָ verneint die Existenz eines Gottes außer dem Angeredeten und sollte nicht zu einer bloßen Vergleichsaussage abgeschwächt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede kommt ohne zusätzliches „O“ aus, da im Hebräischen keine Interjektion steht. Der Gedankenstrich verdeutlicht den nachgestellten Bezug auf das Gehörte.
