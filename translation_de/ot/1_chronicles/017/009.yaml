source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י יִשְׂרָאֵ֤ל וּ/נְטַעְתִּ֨י/הוּ֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹא יוֹסִ֤יפוּ בְנֵי עַוְלָה֙ לְ/בַלֹּת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/009.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], and they will dwell in their own place and be disturbed no more. And the sons of wickedness will no longer wear them down, as at the first[b],
translation:
  language: de
  text: Und ich werde meinem Volk Israel einen Ort bestimmen und es einpflanzen. Es wird an seiner Stätte wohnen und nicht mehr beunruhigt werden. Die Söhne des Unrechts[a] werden es nicht länger zermürben wie früher[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Übeltäter“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wie zu Anfang“; auch: „wie einst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: werde … einen Ort bestimmen
  rationale: שׂים bedeutet grundlegend „setzen, stellen“; zusammen mit מָקוֹם bezeichnet es hier Gottes Zuweisung eines Ortes. „Einen Ort bestimmen“ ist nah am Hebräischen und zugleich natürlich.
- source_word: לְעַמִּי יִשְׂרָאֵל
  choice: meinem Volk Israel
  rationale: Bewahrt sowohl die possessive Bundesbezeichnung „mein Volk“ als auch den Namen Israel.
- source_word: וּנְטַעְתִּיהוּ
  choice: und es einpflanzen
  rationale: Das Verb bedeutet wörtlich „pflanzen“. Das maskuline Singularsuffix wird entsprechend der hebräischen Kollektivkonstruktion auf „Volk Israel“ bezogen; „es“ erhält diese Form, ohne die Metapher abzuschwächen.
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: Es wird an seiner Stätte wohnen
  rationale: Der Singular setzt die kollektive Rede von Israel fort. תַּחְתָּיו bedeutet hier idiomatisch das Bleiben am zugewiesenen Ort; „an seiner Stätte“ bewahrt Bild und Sinn, ohne das missverständliche wörtliche „unter ihm“.
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: und nicht mehr aufgeschreckt werden
  rationale: רגז kann Erbeben, Unruhe oder Aufschrecken bezeichnen. Die passive deutsche Form gibt im Zusammenhang die von Feinden verursachte Beunruhigung und Unsicherheit wieder.
- source_word: בְנֵי עַוְלָה
  choice: die Söhne des Unrechts
  rationale: Bewahrt die markante hebräische Wendung und gibt עַוְלָה als moralisches Unrecht beziehungsweise Frevel wieder.
- source_word: לְבַלֹּתוֹ
  choice: es … zermürben
  rationale: בלה bezeichnet hier ein Aufreiben oder Verschleißen durch fortgesetzte Bedrängnis. „Zermürben“ ist im Deutschen verständlich und bewahrt die Intensität.
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: wie früher
  rationale: Die Wendung verweist auf die vorausgehende Zeit der Bedrängnis. „Wie früher“ ist präzise und natürlich, ohne einen bestimmten historischen Anfang festzulegen.
theological_decisions:
- issue: Kollektiver Singular bei Israel
  choice: Die singularischen Formen werden im Deutschen mit „es/sein“ auf „Volk Israel“ bezogen.
  alternative: Pluralische Wiedergabe mit „sie/ihr“ unter Bezug auf die Israeliten.
  rationale: Anders als im Englischen lässt sich der kollektive Singular im Deutschen klar und idiomatisch bewahren. Dadurch bleiben Form und corporate Bedeutung des hebräischen Textes sichtbar.
- issue: Bezug und Bedeutung von תַּחְתָּיו
  choice: „an seiner Stätte“ als Ausdruck sicheren Wohnens am von Gott bestimmten Ort.
  alternative: Wörtlich „unter ihm/ihm untergeordnet“ oder freier „an seinem eigenen Ort“.
  rationale: Im Kontext von Ort, Einpflanzen und Wohnen bezeichnet die Wendung beständigen Aufenthalt. Die Übersetzung wahrt diese Aussage, ohne einen unklaren personalen Bezug einzuführen.
- issue: Metaphorik des Pflanzens
  choice: Die Metapher wird mit „einpflanzen“ erhalten.
  alternative: Deutend „ansiedeln“ oder „fest gründen“.
  rationale: Das Bild verbindet göttliches Handeln mit Verwurzelung und dauerhafter Sicherheit; eine deutende Auflösung würde diese Spannung unnötig beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der hebräische kollektive Singular und die Pflanzmetapher bleiben erhalten. „Söhne des Unrechts“ ist bewusst etwas gehoben und wird durch eine verständlichere Alternative in der Fußnote erläutert.
