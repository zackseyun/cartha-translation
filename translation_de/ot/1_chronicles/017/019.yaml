  text: יְהוָ֕ה בַּ/עֲב֤וּר עַבְדְּ/ךָ֙ וּֽ/כְ/לִבְּ/ךָ֔ עָשִׂ֕יתָ אֵ֥ת כָּל הַ/גְּדוּלָּ֖ה הַ/זֹּ֑את לְ/הֹדִ֖יעַ אֶת כָּל הַ/גְּדֻלּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/019.yaml
  text: O Yahweh[a], for the sake of your servant and according to your heart, you have done all this greatness[b], to make known all these great things.
translation:
  language: de
  text: HERR, um deines Dieners willen und nach deinem Herzen hast du all dieses Große getan, um all die großen Dinge bekannt zu machen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich wechselt das Hebräische vom Singular „all dieses Große“ zum Plural „all die großen Dinge“. „Nach deinem Herzen“ kann sinngemäß auch „nach deinem Willen“ bedeuten. Für HERR steht im Hebräischen der Gottesname JHWH.
    reason: Bewahrung der hebräischen Bildsprache, des Numeruswechsels und Transparenz beim Gottesnamen.
lexical_decisions:
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens mit HERR ist würdig, allgemein verständlich und unterscheidet den Eigennamen im Schriftbild; der hebräische Name wird in der Fußnote genannt.
- source_word: בַּעֲבוּר עַבְדְּךָ
  choice: um deines Dieners willen
  rationale: Die Wendung drückt Beweggrund beziehungsweise Rücksicht aus und bewahrt zugleich den gehobenen Gebetston.
- source_word: וּכְלִבְּךָ
  choice: und nach deinem Herzen
  rationale: Die konkrete hebräische Metapher bleibt erhalten, statt sie eindeutig als Wille oder Wunsch auszulegen.
- source_word: עָשִׂיתָ
  choice: hast du … getan
  rationale: Das deutsche Perfekt gibt die vollzogene Handlung mit ihrer gegenwärtigen Bedeutung natürlich wieder.
- source_word: כָּל הַגְּדוּלָּה הַזֹּאת
  choice: all dieses Große
  rationale: Die substantivierte Form klingt im Deutschen natürlicher als „all diese Größe“ und hält dennoch den Singular des Hebräischen fest.
- source_word: לְהֹדִיעַ
  choice: um … bekannt zu machen
  rationale: Die finale Konstruktion und die kausative Bedeutung des Hifil werden klar wiedergegeben.
- source_word: כָּל הַגְּדֻלּוֹת
  choice: all diese großen Dinge
  rationale: Die pluralische Form wird verständlich wiedergegeben und bleibt sprachlich mit „dieses Große“ verbunden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: HERR
  alternative: Jahwe
  rationale: HERR folgt der etablierten deutschen Bibeltradition; die Fußnote legt offen, dass im Hebräischen der Gottesname JHWH steht.
- issue: Anthropomorphe Rede vom Herzen Gottes
  choice: nach deinem Herzen
  alternative: nach deinem Willen
  rationale: Die Bildsprache des Ausgangstextes bleibt bestehen und wird nicht stillschweigend auf eine einzelne abstrakte Bedeutung festgelegt.
- issue: Wechsel zwischen Singular und Plural bei Gottes Größe und großen Taten
  choice: dieses Große … diese großen Dinge
  alternative: all diese großen Taten … all diese großen Taten
  rationale: Der auffällige Numeruswechsel des Hebräischen wird bewahrt, ohne ihn theologisch oder sachlich vorschnell aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem Gebetston. Der Satzbau bleibt nahe am Hebräischen, ohne unnatürlich zu wirken.
