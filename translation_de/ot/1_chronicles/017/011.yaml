  text: וְ/הָיָ֗ה כִּֽי מָלְא֤וּ יָמֶ֨י/ךָ֙ לָ/לֶ֣כֶת עִם אֲבֹתֶ֔י/ךָ וַ/הֲקִֽימוֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יִהְיֶ֖ה מִ/בָּנֶ֑י/ךָ וַ/הֲכִינוֹתִ֖י אֶת מַלְכוּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/011.yaml
  text: And it shall be[a], when your days are fulfilled to go to be with your fathers, that I will raise up your offspring after you, who shall be one of your sons, and I will establish his kingdom.
translation:
  language: de
  text: 'Und es wird geschehen: Wenn deine Lebenstage erfüllt sind und du zu deinen Vätern gehst,[a] dann werde ich nach dir deinen Nachkommen aufstehen lassen, der einer deiner Söhne sein wird, und ich werde sein Königtum festigen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit deinen Vätern zu gehen“; eine hebräische Umschreibung dafür, zu sterben und zu den Vorfahren versammelt zu werden.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 'Und es wird geschehen: Wenn'
  rationale: Die formelhafte Zukunftsüberleitung wird in würdigem, verständlichem Deutsch wiedergegeben; כִּי leitet hier den zeitlichen Nebensatz ein.
- source_word: מָלְאוּ יָמֶיךָ
  choice: deine Lebenstage erfüllt sind
  rationale: „Lebenstage“ verdeutlicht den Bezug auf die vollendete Lebenszeit, während „erfüllt“ das feierliche hebräische Bild bewahrt.
- source_word: לָלֶכֶת עִם אֲבֹתֶיךָ
  choice: du zu deinen Vätern gehst
  rationale: Die besondere chronistische Wendung „zu/mit den Vätern gehen“ bleibt erkennbar; ihre Bedeutung als Umschreibung des Todes wird in der Fußnote erläutert.
- source_word: וַהֲקִימוֹתִי
  choice: dann werde ich … aufstehen lassen
  rationale: Das Hifil von קום bezeichnet hier, dass Gott einen dynastischen Nachfolger auftreten lässt. „Aufstehen lassen“ wahrt dieses Bild und unterscheidet sich vom folgenden הכין.
- source_word: זַרְעֲךָ
  choice: deinen Nachkommen
  rationale: „Nachkomme“ gibt זרע in diesem auf eine bestimmte Person zugespitzten Zusammenhang natürlich wieder, ohne das im Deutschen missverständliche „Same“ zu verwenden.
- source_word: אֲשֶׁר יִהְיֶה מִבָּנֶיךָ
  choice: der einer deiner Söhne sein wird
  rationale: Die Formulierung gibt den partitiv verstandenen Ausdruck מִבָּנֶיךָ vollständig und idiomatisch wieder.
- source_word: וַהֲכִינוֹתִי
  choice: ich werde … festigen
  rationale: הכין bezeichnet hier das feste Sichern und Beständigmachen der zugesagten Herrschaft.
- source_word: מַלְכוּתוֹ
  choice: sein Königtum
  rationale: „Königtum“ umfasst die königliche Herrschaft und die dynastische Ordnung, ohne den Ausdruck vorschnell auf ein geografisches Reich einzuengen.
theological_decisions:
- issue: Dynastische Verheißung und mögliche messianische Bedeutung
  choice: Der unmittelbare Wortsinn bezeichnet einen Nachkommen Davids aus dem Kreis seiner Söhne und die Festigung seines Königtums.
  alternative: Eine ausdrücklich messianische Bezeichnung des Nachkommen im Vers.
  rationale: Der hebräische Text enthält hier keinen ausdrücklichen messianischen Titel. Die Übersetzung bewahrt deshalb den historischen und dynastischen Wortlaut und lässt eine weiterführende kanonische Deutung aus dem größeren Zusammenhang hervorgehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelhafte Einleitung und die Bilder „erfüllte Lebenstage“, „zu den Vätern gehen“ und „aufstehen lassen“ bleiben erhalten; eine Fußnote erklärt die heute nicht unmittelbar verständliche Todesumschreibung.
