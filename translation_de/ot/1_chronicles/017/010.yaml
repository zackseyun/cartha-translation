language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/לְ/מִ/יָּמִ֗ים אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הִכְנַ֖עְתִּי אֶת כָּל אוֹיְבֶ֑י/ךָ וָ/אַגִּ֣ד לָ֔/ךְ וּ/בַ֖יִת יִֽבְנֶה לְּ/ךָ֥ יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/010.yaml
  text: from the days when I appointed judges over my people Israel. And I will subdue all your enemies. Moreover[a], I tell you that Yahweh will build you a house.
translation:
  language: de
  text: 'und seit den Tagen, als ich Richter über mein Volk Israel eingesetzt habe. Ich werde alle deine Feinde unterwerfen. Und ich verkünde dir: Jahwe wird dir ein Haus[a] bauen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist hier zugleich: Jahwe wird dir ein Königshaus, also eine Dynastie, gründen.'
    reason: Das hebräische Wort für „Haus“ bezeichnet im Zusammenhang nicht nur ein Gebäude, sondern auch Davids fortbestehendes Königshaus; die Anmerkung erklärt das Wortspiel, ohne es im Haupttext aufzulösen.
lexical_decisions:
- source_word: וּלְמִיָּמִים
  choice: und seit den Tagen
  rationale: Die zusammengesetzte Zeitangabe setzt den vorhergehenden Satz fort. „Seit den Tagen“ gibt den zeitlichen Rückbezug im Deutschen natürlich wieder; das einleitende „und“ bewahrt den Anschlusscharakter des hebräischen Satzes.
- source_word: אֲשֶׁר צִוִּיתִי שֹׁפְטִים
  choice: als ich Richter … eingesetzt habe
  rationale: צוה bedeutet häufig „befehlen“, bezeichnet hier aber im Zusammenhang der Geschichte Israels die Einsetzung beziehungsweise Beauftragung der Richter.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: über mein Volk Israel
  rationale: עַל bezeichnet hier den Bereich der richterlichen Leitungsgewalt. Die Bundesbezeichnung „mein Volk Israel“ bleibt vollständig erhalten.
- source_word: וְהִכְנַעְתִּי
  choice: Ich werde … unterwerfen
  rationale: Die Form steht in der göttlichen Verheißungsfolge mit Zukunftsbezug. Bei Feinden bezeichnet das Verb ihre Unterwerfung, nicht lediglich eine innere Demütigung.
- source_word: אֶת כָּל אוֹיְבֶיךָ
  choice: alle deine Feinde
  rationale: Die Formulierung gibt die durch כָּל ausgedrückte Gesamtheit knapp und idiomatisch wieder.
- source_word: וָאַגִּד לָךְ
  choice: Und ich verkünde dir
  rationale: נגד bezeichnet hier eine feierliche göttliche Mitteilung. „Verkünde“ wahrt deren Gewicht, ohne den Aussagegehalt interpretierend zu erweitern.
- source_word: וּבַיִת יִבְנֶה לְּךָ יְהוָה
  choice: Jahwe wird dir ein Haus bauen
  rationale: „Haus“ bewahrt das zentrale Wortspiel zwischen dem von David geplanten Gotteshaus und dem von Gott zugesagten königlichen Haus. Die deutsche Wortstellung ist natürlich und lässt Jahwe eindeutig als Subjekt erkennen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
theological_decisions:
- issue: Bedeutung von „Haus“ in der Schlussaussage
  choice: „Haus“ bleibt im Haupttext stehen; die dynastische Bedeutung wird in einer Fußnote erläutert.
  alternative: „Jahwe wird dir eine Dynastie gründen.“
  rationale: בַּיִת trägt im Zusammenhang bewusst das Wortspiel zwischen Gebäude beziehungsweise Tempel und Königshaus beziehungsweise Dynastie. Eine eindeutige Auflösung im Haupttext würde diese literarische und theologische Spannung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Versanfang bleibt als Fortsetzung des vorausgehenden Satzes kleingeschrieben. Die direkte göttliche Rede ist klar und schlicht formuliert; „Haus“ erhält bewusst seine bildhafte Mehrdeutigkeit.
