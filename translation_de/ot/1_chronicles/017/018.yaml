  text: What more can David add before you for honoring your servant? You know your servant.
translation:
  language: de
  text: Was könnte David dir noch hinzufügen zur Ehre deines Dieners?[a] Du kennst deinen Diener.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung „zur Ehre deines Dieners“ ist syntaktisch schwierig. Sie kann auch im Sinn von „um deinen Diener zu ehren“ oder „wegen der Ehre deines Dieners“ verstanden werden. Ein Verb wie „sagen“, das manche Übersetzungen zur Ergänzung von „hinzufügen“ verwenden, steht nicht ausdrücklich im hebräischen Text.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  choice: Was
  rationale: Leitet eine rhetorische Frage ein; „Was … noch?“ entspricht dem hebräischen Ausdruck natürlich.
- source_word: יוֹסִיף עוֹד
  choice: könnte … noch hinzufügen
  rationale: יסף mit עוד bezeichnet weiteres Hinzufügen. Das im Deutschen mögliche „sagen“ steht nicht ausdrücklich im hebräischen Text und wird daher nicht in den Haupttext aufgenommen.
- source_word: דָּוִיד
  choice: David
  rationale: Übliche deutsche Form des Eigennamens.
- source_word: אֵלֶיךָ
  choice: dir
  rationale: Die Präposition bezeichnet hier die Ausrichtung der Äußerung an Gott; „dir“ ist im Deutschen natürlich und quellentreu.
- source_word: לְכָבוֹד אֶת עַבְדֶּךָ
  choice: angesichts der Ehre, die du deinem Diener erweist
  rationale: Die syntaktisch schwierige und verdichtete Wendung wird im Kontext auf die Ehre bezogen, die Gott David erweist. Die Formulierung bleibt vorsichtig und wird durch eine Fußnote als mehrdeutig ausgewiesen.
- source_word: עַבְדֶּךָ
  choice: deinen Diener
  rationale: David bezeichnet sich im Gebet als Gottes Diener; „Diener“ ist hier die natürliche deutsche Wiedergabe.
- source_word: וְאַתָּה אֶת עַבְדְּךָ יָדָעְתָּ
  choice: Du kennst deinen Diener
  rationale: Das hebräische Perfekt bezeichnet hier Gottes feststehende Kenntnis Davids; das deutsche Präsens gibt dies idiomatisch wieder. Das einleitende ו muss nicht eigens als „und“ wiedergegeben werden.
theological_decisions:
- issue: Sinn der schwierigen Wendung לְכָבוֹד אֶת עַבְדֶּךָ
  choice: Die Aussage bezieht sich auf die Ehre, die Gott seinem Diener David erweist.
  alternative: „wegen der Ehre deines Dieners“, „um deinen Diener zu ehren“ oder „für die Ehre, die deinem Diener zuteilwurde“
  rationale: Der Zusammenhang handelt von Davids Staunen über Gottes Zuwendung. Da die hebräische Syntax mehrere Deutungen zulässt, wird eine kontextuell plausible Lesart im Haupttext verwendet und die echte Mehrdeutigkeit in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Gebetssprache bleibt erhalten; die syntaktische Schwierigkeit des Hebräischen wird lesbar wiedergegeben, ohne ihre Mehrdeutigkeit zu verschweigen.
