  text: וַֽ/יְהִ֖י בַּ/לַּ֣יְלָה הַ/ה֑וּא וַ/יְהִי֙ דְּבַר אֱלֹהִ֔ים אֶל נָתָ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/003.yaml
  text: But that night the word of God came to Nathan[a], saying,
translation:
  language: de
  text: 'Doch in jener Nacht erging das Wort Gottes an Nathan[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »erging ein Wort von Gott an Nathan«.'
    reason: 'Lexikalische Alternative: Die artikellose Constructusverbindung דְּבַר אֱלֹהִים kann als feste Offenbarungsformel bestimmt oder als unbestimmtes »ein Wort von Gott« verstanden werden.'
lexical_decisions:
- source_word: וַיְהִי
  choice: Doch … erging
  rationale: Das erste וַיְהִי führt die Erzählung mit einem leichten Gegensatz zum vorherigen Zusammenhang weiter; das zweite wird idiomatisch in die Wendung »erging das Wort« aufgenommen, statt die hebräische Wiederholung schwerfällig nachzubilden.
- source_word: בַּלַּיְלָה הַהוּא
  choice: in jener Nacht
  rationale: Die natürliche deutsche Zeitangabe bewahrt die rückverweisende Kraft des Demonstrativs הַהוּא.
- source_word: דְּבַר אֱלֹהִים
  choice: das Wort Gottes
  rationale: In der prophetischen Offenbarungsformel bewahrt diese etablierte Wiedergabe sowohl die Bedeutung von דָּבָר als »Wort« als auch das theologische Gewicht der Genitivverbindung. Die mögliche Auffassung als unbestimmtes »ein Wort von Gott« wird in der Fußnote erhalten.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים bezeichnet hier eindeutig den Gott Israels und wird im Deutschen singularisch mit »Gott« wiedergegeben.
- source_word: אֶל נָתָן
  choice: an Nathan
  rationale: Bei der deutschen Offenbarungsformel »das Wort erging an« bezeichnet »an« idiomatisch und genau den Empfänger.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die folgende direkte Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte »indem er sprach« oder »mit den Worten«.
theological_decisions:
- issue: Wiedergabe der Offenbarungsformel דְּבַר אֱלֹהִים
  choice: das Wort Gottes
  alternative: ein Wort von Gott; die Botschaft Gottes
  rationale: »Das Wort Gottes« erhält den formalen Charakter prophetischer Offenbarung, ohne über den hebräischen Text hinauszugehen. Die grammatisch und lexikalisch mögliche unbestimmte Lesart bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Erging an« wahrt den feierlichen Charakter der prophetischen Formel, ist aber weiterhin allgemein verständlich. Der Doppelpunkt gibt לֵאמֹר idiomatisch als Einleitung der folgenden direkten Rede wieder.
