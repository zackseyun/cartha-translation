source:
  edition: WLC
  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔יד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִֽי אֲנִ֞י יְהוָ֤ה אֱלֹהִים֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/016.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, O Yahweh God, and what is my house, that you have brought me this far?”
translation:
  language: de
  text: 'Da ging König David hinein, setzte sich vor Jahwe und sagte: »Wer bin ich, Jahwe, Gott, und was ist mein Haus[a], dass du mich bis hierher gebracht hast?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Haus« können hier Davids Familie, Hausgemeinschaft oder königliche Linie gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: ging hinein
  rationale: בוא kann »kommen«, »gehen« oder »eintreten« bedeuten. Im Zusammenhang mit dem Aufsuchen der Gegenwart Jahwes gibt »ging hinein« die Bewegung natürlich wieder, ohne den Ort näher zu bestimmen.
- source_word: וַיֵּשֶׁב
  choice: setzte sich
  rationale: ישב bezeichnet hier nach dem Hineingehen am wahrscheinlichsten die konkrete Handlung des Sichsetzens.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die knappe räumlich-relationale Wendung bewahrt sowohl den Wortlaut als auch den Gedanken der Gegenwart Gottes; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe, Gott
  rationale: Beide hebräischen Bezeichnungen stehen in direkter Anrede. Das Komma macht im Deutschen die Anrede verständlich, ohne אֱלֹהִים zu einem Bestandteil des Eigennamens umzudeuten.
- source_word: מִי אֲנִי
  choice: Wer bin ich
  rationale: Die geläufige deutsche Wendung bringt Davids Demut und Erstaunen natürlich zum Ausdruck.
- source_word: וּמִי בֵיתִי
  choice: und was ist mein Haus
  rationale: Das Hebräische wiederholt wörtlich »wer«, doch bei einem Haus bzw. Geschlecht ist »was« im Deutschen idiomatisch. »Haus« erhält die Mehrdeutigkeit zwischen Familie, Hausgemeinschaft und dynastischer Linie.
- source_word: הֲבִיאֹתַנִי
  choice: du mich ... gebracht hast
  rationale: Die Kausativform von בוא wird klar und idiomatisch mit »gebracht hast« wiedergegeben.
- source_word: עַד הֲלֹם
  choice: bis hierher
  rationale: Die Wendung bezeichnet den erreichten Stand oder Weg bis zu diesem Punkt; »bis hierher« bewahrt dabei das räumliche Bild.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von בֵיתִי
  choice: mein Haus mit erläuternder Fußnote
  alternative: meine Familie / mein Königshaus
  rationale: Im Kontext der Verheißung an David schließt »Haus« seine Familie und königliche Linie ein. Die wörtlich-metaphorische Form bleibt im Haupttext erhalten, damit die dynastische Spannung nicht vorschnell eingeengt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nahe am hebräischen Erzählstil; direkte Rede und Gottesname sind klar und allgemein verständlich formuliert.
