  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יְהוָ֔ה הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ יֵאָמֵ֖ן עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/023.yaml
  text: And now[a], Yahweh, let the word that you have spoken concerning your servant and concerning his house be established forever, and do as you have spoken.
translation:
  language: de
  text: Und nun, Jahwe, möge das Wort, das du über deinen Diener und über sein Haus[a] gesprochen hast, für immer Bestand haben; und tu, was du gesagt hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Dynastie“ oder „seine Nachkommenschaft“. Das hebräische Wort für „Haus“ kann hier Davids Familie, königliche Linie oder Dynastie bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt den Übergang von Davids vorausgehendem Lob zu seiner nun folgenden Bitte und gibt sowohl die Konjunktion als auch das Zeitadverb natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als im Deutschen gebräuchliche Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הַדָּבָר
  choice: das Wort
  rationale: Entspricht dem hebräischen Ausdruck unmittelbar und erhält den Bezug zu dem, was Gott gesprochen hat; im Kontext ist damit seine Verheißung gemeint.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: das du … gesprochen hast
  rationale: Gibt die bereits erfolgte, weiterhin maßgebliche Rede Gottes angemessen wieder.
- source_word: עַל עַבְדְּךָ וְעַל בֵּיתוֹ
  choice: über deinen Diener und über sein Haus
  rationale: „Über“ ist hier im Sinn von „in Bezug auf“ verständlich, bewahrt die Wiederholung der hebräischen Präposition und erhält mit „Haus“ den bewusst mehrdeutigen Bundesbegriff.
- source_word: יֵאָמֵן
  choice: möge … Bestand haben
  rationale: Der Nifal von אמן bezeichnet hier das Feststehen beziehungsweise Bestätigtwerden des gesprochenen Wortes. Die deutsche Wunschform gibt den Gebetscharakter natürlich wieder.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Natürliche und prägnante Wiedergabe der zeitlich unbegrenzten Geltung.
- source_word: וַעֲשֵׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: und tu, was du gesagt hast
  rationale: Gibt die direkte Bitte an Gott idiomatisch und würdig wieder. „Gesagt“ vermeidet im Deutschen die schwerfällige Formulierung „tu, wie du gesprochen hast“, ohne den Sinn einzuengen.
theological_decisions:
- issue: Bedeutung von „sein Haus“ im Zusammenhang des davidischen Bundes
  choice: „sein Haus“ bleibt im Haupttext stehen.
  alternative: „seine Dynastie“ oder „seine Nachkommenschaft“
  rationale: Das hebräische בַּיִת kann Haushalt, Familie, Nachkommenschaft oder Königshaus bezeichnen. Im Kontext ist die dynastische Bedeutung wesentlich, doch „Haus“ bewahrt die bundesgeschichtliche Wortwahl und deren Bedeutungsbreite.
translation_notes:
  register: Moderne, würdige Gebetssprache mit leicht feierlichem Rhythmus. Die Anrede „Jahwe“ und die Wiederholung „über … und über …“ bewahren die Struktur des Hebräischen; „möge … Bestand haben“ klingt im heutigen Standarddeutsch natürlicher als eine passive Konstruktion wie „werde bestätigt“.
