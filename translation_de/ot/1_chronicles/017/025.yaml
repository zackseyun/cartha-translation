source:
  edition: WLC
  text: כִּ֣י אַתָּ֣ה אֱלֹהַ֗/י גָּלִ֨יתָ֙ אֶת אֹ֣זֶן עַבְדְּ/ךָ֔ לִ/בְנ֥וֹת ל֖/וֹ בָּ֑יִת עַל כֵּן֙ מָצָ֣א עַבְדְּ/ךָ֔ לְ/הִתְפַּלֵּ֖ל לְ/פָנֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/025.yaml
  text: For you[a], my God, have revealed to your servant that you will build him a house[b]; therefore your servant has found courage to pray before you.
translation:
  language: de
  text: Denn du, mein Gott, hast deinem Diener offenbart[a], dass du ihm ein Haus bauen wirst[b]. Darum hat dein Diener den Mut gefunden, vor dir zu beten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Du hast das Ohr deines Dieners entblößt«; eine hebräische Redewendung für »du hast deinem Diener etwas offenbart«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »dass du ihm eine Dynastie errichten wirst«. »Haus« kann hier neben Haus und Familie auch eine fortdauernde königliche Linie bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: גָּלִיתָ אֶת אֹזֶן עַבְדְּךָ
  choice: hast deinem Diener offenbart
  rationale: 'Wörtlich heißt die Wendung: »Du hast das Ohr deines Dieners entblößt.« Da dies im Hebräischen eine Redewendung für das Mitteilen oder Offenbaren ist, wird ihr Sinn in natürlichem Deutsch wiedergegeben; das zugrunde liegende Bild bleibt in der Fußnote erhalten.'
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: dass du ihm ein Haus bauen wirst
  rationale: Der Infinitiv nennt den Inhalt der Offenbarung. Die finite Form mit »dass« und Futur ist im Deutschen klar und entspricht der auf Gottes künftiges Handeln gerichteten Aussage.
- source_word: בָּיִת
  choice: Haus
  rationale: »Haus« bewahrt das hebräische Bild und dessen Mehrdeutigkeit. Im Zusammenhang der Verheißung an David kann es über Haus und Familie hinaus auch die bleibende königliche Linie bezeichnen.
- source_word: מָצָא ... לְהִתְפַּלֵּל
  choice: hat den Mut gefunden, ... zu beten
  rationale: Das bloße »fand, zu beten« wäre im Deutschen unverständlich. Die Formulierung bringt den hier gemeinten inneren Freimut oder Entschluss idiomatisch zum Ausdruck.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: Die knappe Wendung ist im Deutschen natürlich und bewahrt den Gedanken des Gebets in Gottes Gegenwart.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: In diesem königlichen Gebet ist das Wort eine ehrerbietige Selbstbezeichnung vor Gott. »Diener« entspricht diesem Register besser als das in anderen Zusammenhängen mögliche »Sklave«.
theological_decisions:
- issue: Bedeutung von »Haus« in der Verheißung an David
  choice: Das Bild »Haus« bleibt im Haupttext stehen; der dynastische Sinn wird nicht ausdrücklich festgelegt.
  alternative: »Dynastie« oder »Königshaus«
  rationale: Der hebräische Ausdruck trägt im Kontext der Davidverheißung eine bewusst vielschichtige Bedeutung. »Haus« bewahrt sowohl das konkrete Bild als auch den Bezug auf Familie und fortdauernde königliche Linie, ohne die Spannung einseitig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Selbstbezeichnung »dein Diener« bleibt erhalten, ebenso das zentrale Bild des »Hauses«. Die hebräische Offenbarungsredewendung und der idiomatische Gebrauch von »finden« werden verständlich übertragen und in der Fußnote beziehungsweise Wortwahl transparent gemacht.
