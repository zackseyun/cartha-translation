source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל דָּוִ֔יד כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ עֲשֵׂ֑ה כִּ֥י הָ/אֱלֹהִ֖ים עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/002.yaml
  text: And Nathan said to David, “Do all that is in your heart, for God is with you.”
translation:
  language: de
  text: 'Da sagte Nathan zu David: »Tu alles, was du im Sinn hast, denn Gott ist mit dir.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Wayyiqtol führt die Handlung weiter. »Da sagte« ist im modernen deutschen Erzählstil natürlich und bildet die zeitlich-fortschreitende Verknüpfung ab.
- source_word: נָתָן
  choice: Nathan
  rationale: Der Personenname wird in seiner im Deutschen eingebürgerten biblischen Form wiedergegeben.
- source_word: אֶל דָּוִיד
  choice: zu David
  rationale: אֶל bezeichnet hier den Adressaten der Rede; »zu David« ist die natürliche deutsche Entsprechung.
- source_word: כֹּל אֲשֶׁר
  choice: alles, was
  rationale: Die Wendung bezeichnet die Gesamtheit dessen, was folgt. »Alles, was« bewahrt ihre Weite und klingt idiomatisch.
- source_word: בִּלְבָבְךָ
  choice: dir am Herzen liegt
  rationale: לֵבָב bezeichnet hier das innere Wollen, Vorhaben oder Sinnen. Die deutsche Wendung vermittelt eine beabsichtigte Sache natürlich, ohne den Bildbereich des Herzens aufzugeben.
- source_word: עֲשֵׂה
  choice: Tu
  rationale: Der Imperativ von עשה ist unmittelbar und weit gefasst. »Tu« passt prägnant zu »alles, was dir am Herzen liegt«.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für Nathans Aufforderung ein. »Denn« ist klar, knapp und stilistisch angemessen.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Obwohl das hebräische Wort den Artikel trägt, bezeichnet es hier eindeutig Gott und wird im Deutschen idiomatisch ohne Artikel wiedergegeben. Da nicht der Gottesname JHWH steht, ist »der HERR« nicht sachgemäß.
- source_word: עִמָּךְ
  choice: ist mit dir
  rationale: Die Präposition עִם mit Suffix bezeichnet Gottes Gegenwart und kann in diesem Zusammenhang auch seinen Beistand einschließen. »Ist mit dir« bewahrt die knappe Form und ihre Bedeutungsweite.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung הָאֱלֹהִים
  choice: Gott
  alternative: der Gott; der HERR
  rationale: Im Ausgangstext steht אֱלֹהִים und nicht der Gottesname JHWH. »Gott« ist die natürliche deutsche Wiedergabe; »der Gott« wäre hier unnötig markiert, »der HERR« würde eine andere hebräische Bezeichnung voraussetzen.
- issue: Bedeutungsumfang von »Gott ist mit dir«
  choice: Die Formulierung wird wörtlich-offen beibehalten.
  alternative: Gott steht dir bei.
  rationale: עִמָּךְ kann im Kontext göttlichen Beistand nahelegen, sagt aber zunächst »mit dir«. Die Übersetzung bewahrt sowohl den Gedanken der Gegenwart als auch den möglichen Beiklang der Unterstützung, ohne Nathans Aussage nachträglich zu präzisieren.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. »Da sagte« hält den Erzählfluss lebendig; »Tu alles, was dir am Herzen liegt« ist verständlich und bewahrt zugleich das hebräische Herzbild. Keine Fußnoten erforderlich.
