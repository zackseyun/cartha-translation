source:
  edition: WLC
  text: לֵ֤ךְ וְ/אָמַרְתָּ֙ אֶל דָּוִ֣יד עַבְדִּ֔/י כֹּ֖ה אָמַ֣ר יְהוָ֑ה לֹ֥א אַתָּ֛ה תִּבְנֶה לִּ֥/י הַ/בַּ֖יִת לָ/שָֽׁבֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/004.yaml
  text: 'Go and say to David my servant[b][a], ‘Thus says Yahweh: You shall not build for me the house to dwell in.’'
translation:
  language: de
  text: 'Geh und sag zu meinem Diener David: »So spricht Jahwe: Nicht du wirst mir das Haus bauen[a], in dem ich wohnen soll.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Nicht du wirst mir das Haus bauen.“ Möglich ist auch die Wiedergabe: „Du sollst mir das Haus nicht bauen.“'
    reason: Die Stellung von „du“ ist betont; der Satz kann als kontrastierende Feststellung oder als verbindliche Untersagung verstanden werden.
  - marker: b
    text: Mit dem „Haus“ ist das für Jahwe als Wohnstätte bestimmte Heiligtum, also der Tempel, gemeint.
    reason: Die Fußnote erklärt die kontextuelle Bedeutung, ohne „Haus“ im Haupttext durch den engeren Begriff „Tempel“ zu ersetzen.
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: Geh und sag
  rationale: Die Befehlsfolge wird im Deutschen direkt und natürlich wiedergegeben; das Perfekt mit וְ setzt nach dem Imperativ den Auftrag fort.
- source_word: דָּוִיד עַבְדִּי
  choice: meinem Diener David
  rationale: עֶבֶד bezeichnet hier David in seiner beauftragten Beziehung zu Gott; „Diener“ passt besser als „Sklave“. Die deutsche Wortstellung ist idiomatisch.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die feste Botenformel wird würdig und quellennah wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
- source_word: לֹא אַתָּה תִּבְנֶה
  choice: Nicht du wirst … bauen
  rationale: Das ausdrücklich gesetzte אַתָּה trägt Kontrastbetonung. Die Formulierung bewahrt den Fokus darauf, dass David nicht der Erbauer sein wird, ohne den Satz auf ein bloßes Verbot zu reduzieren.
- source_word: לִּי הַבַּיִת
  choice: mir das Haus
  rationale: „Mir“ gibt den Dativ des Interesses natürlich wieder. „Das Haus“ bewahrt die konkrete Bildsprache des Hebräischen, obwohl im Zusammenhang der Tempel gemeint ist.
- source_word: לָשָׁבֶת
  choice: in dem ich wohnen soll
  rationale: Der Infinitiv bezeichnet den Zweck des Hauses. Die deutsche Relativsatzkonstruktion macht den im Zusammenhang vorausgesetzten göttlichen Bewohner verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich; „Jahwe“ gibt ihn als Eigennamen wieder.
- issue: Kontrast oder Verbot in לֹא אַתָּה תִּבְנֶה
  choice: Nicht du wirst … bauen
  alternative: Du sollst … nicht bauen
  rationale: Die gewählte Fassung erhält die auffällige Betonung des Pronomens „du“ und lässt den Satz zugleich als verbindliche göttliche Feststellung erkennen.
- issue: Bedeutung von הַבַּיִת
  choice: das Haus
  alternative: der Tempel
  rationale: Im Zusammenhang ist der Tempel gemeint, doch der hebräische Text sagt „das Haus“. Diese Bezeichnung bewahrt zudem das Motiv von Gottes Wohnung.
- issue: Subjekt des Wohnens in לָשָׁבֶת
  choice: in dem ich wohnen soll
  alternative: als Wohnstätte
  rationale: Der Zusammenhang und „mir“ weisen auf Jahwe als den Bewohner. Die Alternative wäre formaler, ließe das Subjekt aber unausgesprochen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem prophetischem Ton. Die Botenformel bleibt knapp und feierlich; die hebräische Kontrastbetonung wird durch die Voranstellung „Nicht du“ erhalten.
