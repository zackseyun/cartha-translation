base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/013.yaml
  text: I will be a father to him[a], and he will be a son to me. And I will not remove my steadfast love from him[b], as I removed it from the one who was before you.
translation:
  language: de
  text: Ich werde sein Vater sein[a], und er wird mein Sohn sein. Meine beständige Liebe werde ich ihm nicht entziehen, so wie ich sie dem entzogen habe, der vor dir war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde ihm ein Vater sein, und er wird mir ein Sohn sein.“'
    reason: lexical_alternative
  - marker: b
    text: Mit „dem, der vor dir war“ ist Saul gemeint, Davids Vorgänger als König.
    reason: cross_reference
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: Ich werde ihm Vater sein
  rationale: Die Formulierung bewahrt die hebräische Beziehungskonstruktion möglichst eng und klingt zugleich würdevoll und verständlich. Die natürlichere Besitzkonstruktion steht als Alternative in der Fußnote.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: und er wird mir Sohn sein
  rationale: Die parallele Satzstruktur des Hebräischen bleibt erhalten und die unmittelbare Vater-Sohn-Sprache des davidischen Bundes wird nicht abgeschwächt.
- source_word: חַסְדִּי
  choice: meine beständige Liebe
  rationale: חֶסֶד bezeichnet hier Gottes verlässliche, dauerhafte und bundestreue Zuwendung. „Beständige Liebe“ wahrt sowohl den Beziehungsaspekt als auch die Treue, ohne den Ausdruck ausschließlich juristisch zu deuten.
- source_word: לֹא אָסִיר מֵעִמּוֹ
  choice: werde ich ihm nicht entziehen
  rationale: Das Hifil von סור bedeutet hier wegnehmen beziehungsweise entziehen. „Entziehen“ ist im Deutschen bei Liebe oder Zuwendung natürlich und bildet denselben Vorgang auch im Vergleichssatz ab.
- source_word: כַּאֲשֶׁר הֲסִירוֹתִי
  choice: wie ich sie ... entzogen habe
  rationale: Das Pronomen „sie“ nimmt im Deutschen das zuvor genannte Objekt „meine beständige Liebe“ auf; die Wiederholung desselben Verbs erhält die hebräische Parallelität.
- source_word: מֵאֲשֶׁר הָיָה לְפָנֶיךָ
  choice: dem, der vor dir war
  rationale: Die indirekte Bezeichnung wird wie im Hebräischen bewahrt. „Vor dir“ bezeichnet hier den Vorgänger im Königtum; die Identifizierung mit Saul wird nicht in den Haupttext eingetragen, sondern erläutert.
theological_decisions:
- issue: Vater-Sohn-Sprache im davidischen Bund
  choice: Die unmittelbare Formulierung „ihm Vater“ und „mir Sohn“ bleibt erhalten.
  alternative: „Ich werde sein Vater sein, und er wird mein Sohn sein“ oder eine deutende Umschreibung väterlicher Fürsorge.
  rationale: Der Text spricht ausdrücklich von einer Vater-Sohn-Beziehung. Diese königliche Bundessprache soll weder abgeschwächt noch durch eine weitergehende dogmatische Erklärung festgelegt werden.
- issue: Bedeutung von חֶסֶד im Bundeskontext
  choice: „beständige Liebe“
  alternative: „Gnade“, „Barmherzigkeit“ oder „Bundestreue“
  rationale: „Beständige Liebe“ hält Zuneigung, Verlässlichkeit und Treue zusammen. „Gnade“ oder „Barmherzigkeit“ wären enger; „Bundestreue“ würde den rechtlich-bundesbezogenen Aspekt stärker festlegen, als das mehrschichtige Wort selbst verlangt.
- issue: Identität dessen, der vor David war
  choice: Im Haupttext bleibt die Person ungenannt; eine Fußnote nennt Saul als Bezugsperson.
  alternative: Saul unmittelbar in den Haupttext einsetzen.
  rationale: Das Hebräische nennt keinen Namen. Die bewusste Umschreibung bleibt deshalb im Text erhalten, während der historische Bezug für Leser erläutert wird.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die leicht feierliche Konstruktion „ihm Vater sein / mir Sohn sein“ bildet die hebräische Parallelität und Beziehungssprache ab; eine geläufigere deutsche Form steht in Fußnote [a].
