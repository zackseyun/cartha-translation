id: 1CH.17.22
reference: 1 Chronicles 17:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ֠/תִּתֵּן אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/022.yaml
  text: And you made your people Israel your people forever[a], and you, O Yahweh, became their God.
translation:
  language: de
  text: Du hast dein Volk Israel für immer zu deinem Volk gemacht, und du, Jahwe, bist ihr Gott geworden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „warst ihr Gott“. Das Hebräische kann hier auch stativer verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: hast … gemacht
  rationale: נתן bedeutet wörtlich „geben“. In der Verbindung mit den beiden ל-Präpositionen bezeichnet es hier jedoch die Einsetzung in einen bleibenden Status; „zu deinem Volk gemacht“ gibt diese konstitutive Bedeutung im Deutschen natürlich wieder.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: dein Volk Israel
  rationale: Bewahrt sowohl die Zugehörigkeit zu Gott als auch die nähere Bestimmung des Volkes als Israel.
- source_word: לְךָ לְעָם
  choice: zu deinem Volk
  rationale: Die doppelte ל-Konstruktion drückt Zugehörigkeit und Status aus. Zusammen mit „gemacht“ entsteht eine natürliche deutsche Wiedergabe der Bundesbeziehung.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Gibt die unbefristete, fortdauernde Bedeutung von עוֹלָם in klarem modernem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: bist ihr Gott geworden
  rationale: 'Die Konstruktion היה + ל bezeichnet hier die begründete Beziehung: Jahwe wurde für Israel ihr Gott. Das deutsche Perfekt passt zur rückblickenden Gebetssprache und wahrt den dynamischen Sinn, ohne eine Veränderung des göttlichen Wesens auszusagen.'
theological_decisions:
- issue: Wiedergabe der Bundesformel היה + ל + אֱלֹהִים
  choice: bist ihr Gott geworden
  alternative: warst ihr Gott
  rationale: „Geworden“ hebt im Zusammenhang die Begründung der Bundesbeziehung hervor. Die stativere Wiedergabe „warst“ ist grammatisch ebenfalls möglich; deshalb wird sie in einer Fußnote genannt, statt die Spannung stillschweigend aufzulösen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die parallele Formulierung „dein Volk … ihr Gott“ bewahrt den Charakter der Bundesformel.
