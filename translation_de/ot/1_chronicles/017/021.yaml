source:
  edition: WLC
  text: וּ/מִי֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁר֩ הָלַ֨ךְ הָ/אֱלֹהִ֜ים לִ/פְדּ֧וֹת ל֣/וֹ עָ֗ם לָ/שׂ֤וּם לְ/ךָ֙ שֵׁ֚ם גְּדֻלּ֣וֹת וְ/נֹרָא֔וֹת לְ/גָרֵ֗שׁ מִ/פְּנֵ֧י עַמְּ/ךָ֛ אֲשֶׁר פָּדִ֥יתָ מִ/מִּצְרַ֖יִם גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/021.yaml
  text: And who is like your people Israel[a], one nation on the earth, whom God went to redeem for himself as a people, to make for yourself a name by great and fearsome deeds, driving out nations from before your people[b], whom you redeemed from Egypt?
translation:
  language: de
  text: Und wer ist wie dein Volk Israel – eine einzige Nation auf der Erde –, zu dem Gott hinging, um es sich als Volk zu erlösen, um dir durch große und furchtgebietende Taten einen Namen zu machen und Nationen vor deinem Volk her zu vertreiben, das du aus Ägypten erlöst hast?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht „Nationen“ im Hebräischen erst am Satzende. Wegen der ungewöhnlichen Wortstellung und der textlich schwierigen Parallele in 2. Samuel 7,23 wird der Satz auch anders gegliedert.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ יִשְׂרָאֵל
  choice: Und wer ist wie dein Volk Israel
  rationale: Die rhetorische Frage und der ausdrückliche Vergleich mit Gottes Volk bleiben erhalten.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: die eine Nation auf der Erde
  rationale: „Eine Nation“ bewahrt den formalen Wortlaut und lässt offen, ob besonders die Einzigartigkeit oder die Einheit Israels betont wird.
- source_word: אֲשֶׁר הָלַךְ הָאֱלֹהִים
  choice: für die Gott hingegangen ist
  rationale: Die Formulierung erhält das anschauliche Bewegungsverb הלך, ohne es zu einer bloßen Hilfsformel abzuschwächen.
- source_word: לִפְדּוֹת לוֹ עָם
  choice: um sie für sich als Volk zu erlösen
  rationale: „Erlösen“ entspricht dem üblichen Sinn von פדה; „als Volk“ verdeutlicht die resultative Beziehung, ohne zusätzlichen theologischen Gehalt einzutragen.
- source_word: לָשׂוּם לְךָ שֵׁם
  choice: um dir … einen Namen zu machen
  rationale: Die deutsche Wendung gibt die Aussage wieder, dass Gottes Taten seinen Ruhm begründen, und bewahrt zugleich die direkte Anrede.
- source_word: גְּדֻלּוֹת וְנֹרָאוֹת
  choice: durch große und furchtgebietende Taten
  rationale: „Furchtgebietend“ wahrt sowohl Ehrfurcht als auch Schrecken im Bedeutungsfeld von נורא; „Taten“ macht den im Hebräischen substantivierten Ausdruck natürlich verständlich.
- source_word: לְגָרֵשׁ מִפְּנֵי עַמְּךָ … גּוֹיִם
  choice: Nationen vor deinem Volk zu vertreiben
  rationale: Das im Hebräischen nachgestellte Objekt „Nationen“ wird für klares Deutsch vorgezogen; „vor deinem Volk“ bewahrt das räumliche Bild der Vertreibung.
- source_word: אֲשֶׁר פָּדִיתָ מִמִּצְרַיִם
  choice: das du aus Ägypten erlöst hast
  rationale: Der Relativsatz wird auf „dein Volk“ bezogen und erhält den Wechsel von der Rede über Gott zur direkten Anrede Gottes.
theological_decisions:
- issue: Gottes Handeln zur Begründung seines Namens
  choice: um dir … einen Namen zu machen
  alternative: um dich berühmt zu machen
  rationale: Die gewählte Fassung bewahrt die konkrete hebräische Rede vom „Namen“ und schwächt die Aussage über Gottes durch die Erlösung begründeten Ruhm nicht ab.
- issue: Wirkung der göttlichen Taten in וְנֹרָאוֹת
  choice: furchtgebietende Taten
  alternative: ehrfurchtgebietende Taten
  rationale: „Furchtgebietend“ hält die Spannung zwischen Ehrfurcht und Schrecken offen; „ehrfurchtgebietend“ würde die bedrohliche Bedeutungsseite zu stark einengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange, feierliche Satzperiode des hebräischen Gebets bleibt erkennbar, wird aber durch klare Infinitivgruppen lesbar gehalten. Der Wechsel von „Gott“ in der dritten Person zu „dir/du“ in der direkten Anrede wird entsprechend dem Ausgangstext bewahrt.
