  terminology: „erlösen“, „Name machen“ und „furchtgebietende Taten“ sind angemessene, registergerechte Wiedergaben. „Nationen“ ist für גּוֹיִם sachgerecht. „vor deinem Volk her vertreiben“ gibt die räumliche hebräische Wendung im Deutschen idiomatischer wieder, ohne die im Text problematische Schlussstellung des Objekts zu verschleiern.
