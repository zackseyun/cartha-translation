  to: Und wer ist wie dein Volk Israel – eine einzige Nation auf der Erde –, zu dem Gott hinging, um es sich als Volk zu erlösen, um dir durch große und furchtgebietende Taten einen Namen zu machen und Nationen vor deinem Volk her zu vertreiben, das du aus Ägypten erlöst hast?[a]
