source:
  edition: WLC
  text: וְ/עַתָּ֗ה הוֹאַ֨לְתָּ֙ לְ/בָרֵךְ֙ אֶת בֵּ֣ית עַבְדְּ/ךָ֔ לִ/הְי֥וֹת לְ/עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽי אַתָּ֤ה יְהוָה֙ בֵּרַ֔כְתָּ וּ/מְבֹרָ֖ךְ לְ/עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/027.yaml
  text: And now[a], you have been pleased to bless the house of your servant, that it may be before you forever; for you, O Yahweh, have blessed it[c][b], and it is blessed forever.
translation:
  language: de
  text: Und nun hast du dich bereitgefunden[a], das Haus[b] deines Dieners zu segnen, damit es für immer vor dir Bestand hat. Denn du, Jahwe, hast es gesegnet, und es ist für immer gesegnet.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „hast du dich entschlossen“ oder „hast du eingewilligt“.'
    reason: lexical_alternative
  - marker: b
    text: „Haus“ meint hier wahrscheinlich die Familie beziehungsweise Dynastie des Dieners, nicht nur sein Wohngebäude.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: „und möge es für immer gesegnet sein“. Das Hebräische kann von manchen als Wunsch verstanden werden; die Form lässt sich jedoch eher als Aussage eines fortdauernden Zustands lesen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Konjunktion ו als auch die zeitliche beziehungsweise folgernde Wendung עַתָּה.
- source_word: הוֹאַלְתָּ
  choice: hast du dich bereit erklärt
  rationale: Gibt die in יאל liegende willentliche Zustimmung beziehungsweise Bereitschaft natürlich wieder, ohne das Verb auf bloßes Gefallen oder auf den Beginn einer Handlung zu verengen.
- source_word: לְבָרֵךְ
  choice: zu segnen
  rationale: Direkte und idiomatische Wiedergabe des Infinitivs als Ergänzung zu הוֹאַלְתָּ.
- source_word: בֵּית עַבְדְּךָ
  choice: das Haus deines Dieners
  rationale: „Haus“ erhält die im davidischen Zusammenhang wichtige familiäre und dynastische Bedeutungsbreite von בַּיִת.
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: damit es für immer vor dir besteht
  rationale: „Besteht“ macht die gemeinte dauerhafte Existenz in Gottes Gegenwart im Deutschen verständlich; „vor dir“ bewahrt die räumlich-relationale Ausdrucksweise des Hebräischen.
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Aussage ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: בֵּרַכְתָּ
  choice: hast es gesegnet
  rationale: Das Perfekt bezeichnet die vollzogene Segnung mit fortdauernder Bedeutung.
- source_word: וּמְבֹרָךְ לְעוֹלָם
  choice: und es ist für immer gesegnet
  rationale: 'Das passive Partizip wird vorrangig resultativ-stativ verstanden: Was Jahwe gesegnet hat, steht dauerhaft unter seinem Segen.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; die Transliteration bewahrt den persönlichen Bundesnamen.
- issue: Aussageweise von וּמְבֹרָךְ לְעוֹלָם
  choice: 'feststellend-resultativ: „und es ist für immer gesegnet“'
  alternative: 'wünschend: „und möge es für immer gesegnet sein“'
  rationale: Das passive Partizip bezeichnet am natürlichsten einen bestehenden, aus Jahwes Segnung hervorgegangenen Zustand. Da im Gebetszusammenhang auch eine wünschende Nuance vertreten wird, bleibt diese in der Fußnote sichtbar.
- issue: Bedeutung von „Haus“ im davidischen Zusammenhang
  choice: „Haus“ mit familiär-dynastischer Tragweite
  alternative: bloßes Wohngebäude oder enger gefasster Haushalt
  rationale: Im Kontext der Verheißung an David bezeichnet בַּיִת wahrscheinlich seine Familie beziehungsweise Dynastie; die Übersetzung lässt die Bildsprache und Bedeutungsbreite stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der hebräischen Gebetssprache, wird aber durch „besteht“ und eine klare Zeichensetzung idiomatisch lesbar. „Jahwe“ steht als Wiedergabe des Gottesnamens.
