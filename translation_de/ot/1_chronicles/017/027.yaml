  naturalness: Der Text ist insgesamt würdig und gut verständlich. „hast du dich bereitgefunden“ ist für den Kontext eines Gebets idiomatischer und trifft die freiwillig-geneigte Nuance des Verbs besser. „damit es für immer vor dir besteht“ ist verständlich; „Bestand hat“ ist im Deutschen die natürlichere Verbindung und wahrt die Aussage von bleibender Existenz vor Gott.
  terminology: „Jahwe“ gibt יהוה konsistent als Namen wieder. „Haus“ bleibt zu Recht im Text stehen und wird mit einer zurückhaltenden dynastischen Erläuterung versehen. „Segen/gesegnet“ ist terminologisch angemessen.
