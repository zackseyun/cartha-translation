  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שֹׁפְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר צִוִּ֛יתִי לִ/רְע֥וֹת אֶת עַמִּ֖/י לֵ/אמֹ֑ר לָ֛/מָּה לֹא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/006.yaml
  text: In all the places where I have walked among all Israel[a], did I ever speak a word to one of the judges of Israel, whom I commanded to shepherd my people, saying, ‘Why have you not built for me a house of cedar?’
translation:
  language: de
  text: 'Überall, wo ich in ganz Israel umhergezogen bin: Habe ich je zu einem der Richter Israels[a], denen ich geboten hatte, mein Volk zu weiden, auch nur ein Wort gesagt: »Warum habt ihr mir kein Haus aus Zedernholz gebaut?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der Parallelstelle 2. Samuel 7,7 steht „Stämme Israels“; einige Textzeugen spiegeln Lesarten wie „Führer“ oder „Zepter“ wider. Der hebräische Text der Chronik lautet hier „Richter“.
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: ich … umhergezogen bin
  rationale: Der Hitpael von הלך bezeichnet hier Gottes fortgesetztes Umherziehen unter seinem Volk; „umherziehen“ bewahrt die Bewegungsvorstellung und klingt im Deutschen natürlich.
- source_word: בְּכָל יִשְׂרָאֵל
  choice: in ganz Israel
  rationale: Die Präposition bezeichnet im Zusammenhang mit dem Bewegungsverb Gottes Bewegung und Gegenwart im gesamten Volk beziehungsweise seinem Bereich.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: Habe ich je … auch nur ein Wort gesagt
  rationale: Die Fragepartikel und das verwandte Objekt „Wort“ verleihen der rhetorischen Verneinung Nachdruck; „je“ und „auch nur ein Wort“ geben diese Wirkung idiomatisch wieder.
- source_word: אֶת אַחַד שֹׁפְטֵי יִשְׂרָאֵל
  choice: zu einem der Richter Israels
  rationale: אֶת führt bei דבר hier die angesprochene Person ein. Im Deutschen ist „zu jemandem sagen“ angesichts des folgenden wörtlichen Zitats präzise und natürlich.
- source_word: שֹׁפְטֵי יִשְׂרָאֵל
  choice: Richter Israels
  rationale: Der masoretische Text der Chronik bietet ausdrücklich „Richter“; die Übersetzung harmonisiert ihn nicht mit der Parallelstelle in 2 Samuel 7,7.
- source_word: צִוִּיתִי לִרְעוֹת
  choice: denen ich geboten hatte, mein Volk zu weiden
  rationale: „Weiden“ bewahrt die im Hebräischen verwendete Hirtenmetapher für Leitung und Fürsorge. Der Plural des Relativpronomens nimmt die Richter als Gruppe auf, aus der „einer“ genannt wird.
- source_word: לָמָּה לֹא בְנִיתֶם לִי
  choice: Warum habt ihr mir kein … gebaut?
  rationale: Das hebräische Perfekt wird als deutsches Perfekt wiedergegeben; der Plural „ihr“ entspricht בְנִיתֶם und richtet die gedachte Frage an die Richter als Gruppe.
- source_word: בֵּית אֲרָזִים
  choice: Haus aus Zedernholz
  rationale: Die Wendung bezeichnet ein mit Zedernholz errichtetes Haus. „Aus Zedernholz“ ist im heutigen Deutsch klarer und natürlicher als „Haus aus Zedern“.
theological_decisions:
- issue: „Richter“ in 1 Chronik gegenüber „Stämme“ beziehungsweise möglichen leitungsbezogenen Lesarten in 2 Samuel 7,7
  choice: Im Haupttext steht „Richter Israels“.
  alternative: Nach der Parallelstelle könnte man „Stämme Israels“ oder „Führer Israels“ erwarten.
  rationale: Die Übersetzung folgt dem überlieferten hebräischen Text von 1 Chronik 17,6 und lässt die Differenz zur Samuelstelle bestehen, statt sie harmonisierend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt pointiert; die Hirtenmetapher wird mit „weiden“ erhalten. Der Doppelpunkt nach dem einleitenden Ortsausdruck verdeutlicht die Satzführung, ohne die inhaltliche Verknüpfung aufzulösen.
