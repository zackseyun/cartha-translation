source:
  edition: WLC
  text: כְּ/כֹל֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וּ/כְ/כֹ֖ל הֶ/חָז֣וֹן הַ/זֶּ֑ה כֵּ֛ן דִּבֶּ֥ר נָתָ֖ן אֶל דָּוִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/015.yaml
  text: According to all these words and according to all this vision[b][a], so Nathan spoke to David.
translation:
  language: de
  text: Entsprechend all diesen Worten[a] und entsprechend dieser ganzen Vision[b] redete Nathan zu David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „all diesen Dingen“ beziehungsweise „all diesen Angelegenheiten“. Das hebräische Wort kann sowohl Worte als auch Dinge oder Sachverhalte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dieser ganzen Offenbarung“. Das hebräische Wort bezeichnet eine prophetische Vision oder eine offenbarende Mitteilung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל ... וּכְכֹל
  choice: Ganz so, wie ... und ...
  rationale: Die doppelte כ-Konstruktion bezeichnet die vollständige Übereinstimmung von Nathans Mitteilung mit den empfangenen Worten und der Vision. Die deutsche Fassung gibt diese Entsprechung natürlich wieder, ohne das wiederholte כֹל („all/ganze“) auszulassen.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: all diesen Worten
  rationale: דְּבָרִים kann „Worte“, „Dinge“ oder „Angelegenheiten“ bedeuten. Im Zusammenhang einer übermittelten Gottesbotschaft ist „Worte“ am naheliegendsten; die mögliche weitere Bedeutung wird in der Fußnote bewahrt.
- source_word: הֶחָזוֹן הַזֶּה
  choice: dieser ganzen Vision
  rationale: חָזוֹן bezeichnet eine prophetische Vision beziehungsweise Offenbarung. „Vision“ ist die direkte, im Deutschen geläufige Entsprechung; „ganzen“ gibt כֹל wieder.
- source_word: כֵּן
  choice: Ganz so, wie
  rationale: כֵּן nimmt die vorausgehende Vergleichs- und Übereinstimmungskonstruktion auf. Die vorangestellte Wendung macht im Deutschen deutlich, dass Nathan die Botschaft entsprechend dem Empfangenen weitergab.
- source_word: דִּבֶּר נָתָן אֶל דָּוִיד
  choice: redete Nathan zu David
  rationale: דבר bedeutet „reden/sprechen“, und אֶל bezeichnet hier den Adressaten. „Redete ... zu“ wahrt den würdigen Erzählton und die gerichtete Rede.
theological_decisions:
- issue: Verhältnis von göttlicher Offenbarung und Nathans Weitergabe
  choice: Vollständige Übereinstimmung ausdrücken, ohne eine zusätzliche Inspirationslehre auszuformulieren
  alternative: „Nathan wiederholte David jedes Wort wörtlich“
  rationale: Der hebräische Text betont die Entsprechung mit allen Worten und der ganzen Vision, sagt aber nicht ausdrücklich, dass Nathan jedes Wort als mechanisch-wörtliches Zitat wiedergab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt die vollständige Übereinstimmung zwischen Offenbarung und Weitergabe hervor. Beide lexikalischen Mehrdeutigkeiten werden durch unmittelbar gesetzte Fußnotenmarker bewahrt.
