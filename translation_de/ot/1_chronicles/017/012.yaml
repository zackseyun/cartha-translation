source:
  edition: WLC
  text: ה֥וּא יִבְנֶה לִּ֖/י בָּ֑יִת וְ/כֹנַנְתִּ֥י אֶת כִּסְא֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/012.yaml
  text: He will build a house for me[a], and I will establish his throne forever.
translation:
  language: de
  text: Er wird mir ein Haus bauen[a], und ich werde seinen Thron für immer festigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Tempel«. Das hebräische Wort bedeutet wörtlich »Haus« und bezeichnet hier im Zusammenhang das Heiligtum, das Salomo bauen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Er
  rationale: Das selbstständige Personalpronomen der 3. Person Maskulin Singular bezeichnet ausdrücklich und mit leichter Hervorhebung den kommenden Nachkommen.
- source_word: יִבְנֶה
  choice: wird bauen
  rationale: Das Qal-Imperfekt der 3. Person Maskulin Singular von בנה bezeichnet im Zusammenhang der Verheißung eine zukünftige Handlung.
- source_word: לִּי
  choice: mir
  rationale: Die Präposition ל mit Suffix der 1. Person Singular bezeichnet hier den Empfänger beziehungsweise Begünstigten. Im Deutschen gibt der Dativ »mir« dies natürlich wieder.
- source_word: בָּיִת
  choice: ein Haus
  rationale: בַּיִת bedeutet wörtlich »Haus« und bezeichnet hier im Kontext das Heiligtum, das Salomo bauen wird. »Haus« bewahrt die Wortwahl und die literarische Spannung des hebräischen Textes.
- source_word: וְכֹנַנְתִּי
  choice: und ich werde festigen
  rationale: Die Form von כון bezeichnet ein festes Gründen oder dauerhaftes Sichern. »Festigen« ist in Verbindung mit einem Thron natürlich und bewahrt diesen Bedeutungsaspekt.
- source_word: אֶת כִּסְאוֹ
  choice: seinen Thron
  rationale: Die direkte Objektmarkierung mit dem Substantiv und Suffix der 3. Person Maskulin Singular wird idiomatisch als »seinen Thron« wiedergegeben.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die feste Wendung bezeichnet unabsehbare beziehungsweise bleibende Dauer. »Für immer« gibt die Verheißung klar wieder, ohne ihre theologische Erfüllung näher festzulegen.
theological_decisions:
- issue: Wiedergabe von בָּיִת als »Haus« oder deutend als »Tempel«
  choice: Haus
  alternative: Tempel
  rationale: Der hebräische Text verwendet das allgemeinere Wort »Haus«. Diese Wiedergabe erhält die literarische und theologische Verknüpfung im Zusammenhang der Davidverheißung; die kontextuelle Bedeutung »Tempel« wird in der Fußnote genannt.
- issue: Tragweite von עַד עוֹלָם in der Davidverheißung
  choice: für immer
  alternative: auf ewig
  rationale: Die Aussage wird ohne einschränkende oder auslegende Zusätze wiedergegeben. So bleibt die Dauerbehauptung des Textes bestehen, ohne Debatten über ihre letztendliche Erfüllung vorwegzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am knappen hebräischen Verheißungsstil; »festigen« ist zugleich verständlich und dem Bild eines dauerhaft gesicherten Thrones angemessen.
