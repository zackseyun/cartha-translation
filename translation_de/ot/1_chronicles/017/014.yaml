source:
  edition: WLC
  text: וְ/הַֽעֲמַדְתִּ֛י/הוּ בְּ/בֵיתִ֥/י וּ/בְ/מַלְכוּתִ֖/י עַד הָ/עוֹלָ֑ם וְ/כִסְא֕/וֹ יִהְיֶ֥ה נָכ֖וֹן עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/014.yaml
  text: But I will establish him in my house and in my kingdom forever[c][b][a], and his throne will be established forever.
translation:
  language: de
  text: Doch werde ich ihn in meinem Haus und in meinem Königreich für immer fest einsetzen[a][b], und sein Thron wird für immer fest stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde ihn für immer in meinem Haus und über mein Königreich fest einsetzen.“ Die hebräische Präposition bedeutet gewöhnlich „in“, kann im Zusammenhang aber auch eine Stellung der Autorität einschließen.'
    reason: lexical_alternative
  - marker: b
    text: „Ihn“ kann sich zunächst auf Davids königlichen Nachkommen, besonders Salomo, beziehen; zugleich gehört die Aussage zur umfassenderen davidischen Verheißung, die später messianisch verstanden wurde. Auch „mein Haus“ kann Gottes Haus im weiteren Sinn, den Tempel oder Gottes königlichen Haushalt bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַעֲמַדְתִּיהוּ
  choice: Doch ich werde ihn … einsetzen
  rationale: Der Hifil von עמד bezeichnet hier, dass Gott ihn in eine feste Stellung bringt. „Einsetzen“ ist im königlich-bundestheologischen Zusammenhang natürlich; „Doch“ macht den Gegensatz zur Warnung im vorherigen Vers deutlich.
- source_word: בְּבֵיתִי
  choice: in meinem Haus
  rationale: Die Wiedergabe folgt der Präposition ב und bewahrt die Bedeutungsbreite von בית zwischen Gottes Haus, Haushalt und Herrschaftsbereich.
- source_word: וּבְמַלְכוּתִי
  choice: und in meinem Königreich
  rationale: Die Formulierung wahrt die Parallelität zu „in meinem Haus“ und legt die Präposition nicht vorschnell als „über“ aus.
- source_word: עַד הָעוֹלָם
  choice: für immer
  rationale: Die feste Wendung bezeichnet bleibende Dauer; „für immer“ ist in modernem Deutsch klar und würdig.
- source_word: וְכִסְאוֹ
  choice: und sein Thron
  rationale: „Thron“ bewahrt den konkreten königlichen Schlüsselbegriff, statt ihn als Herrschaft oder Dynastie zu paraphrasieren.
- source_word: יִהְיֶה נָכוֹן
  choice: wird … fest stehen
  rationale: נכון bezeichnet Beständigkeit und feste Gründung. „Fest stehen“ gibt die prädikative Form natürlich wieder und vermeidet eine unnötige Wiederholung von „einsetzen“.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die Wendung drückt dauerhafte Beständigkeit aus; dieselbe Wiedergabe wie zuvor sorgt für Klarheit und Konsistenz.
theological_decisions:
- issue: Bezug des männlichen Pronomens im davidischen Bund
  choice: Das Pronomen „ihn“ bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: Salomo im unmittelbaren Sinn, die davidische Königslinie kollektiv oder letztlich der Messias.
  rationale: Der hebräische Vers nennt den Bezug nicht ausdrücklich. So bleiben die unmittelbare dynastische Bedeutung und die spätere messianische Tragweite nebeneinander bestehen.
- issue: Bedeutungsumfang von „mein Haus“
  choice: Die wörtliche und mehrdeutige Formulierung „mein Haus“ bleibt erhalten.
  alternative: Mein Tempel, mein Haushalt oder mein bundesmäßiger Herrschaftsbereich.
  rationale: בית kann in diesem Zusammenhang mehrere miteinander verbundene Vorstellungen aufrufen. Eine engere Festlegung würde die im Hebräischen vorhandene Bedeutungsbreite reduzieren.
- issue: Nuance der Präpositionen bei Haus und Königreich
  choice: „In meinem Haus und in meinem Königreich“
  alternative: „In meinem Haus und über mein Königreich“ beziehungsweise „über mein Haus und mein Königreich“
  rationale: ב bedeutet hier zunächst „in“. Die gewählte Fassung bewahrt die parallele hebräische Konstruktion, ohne die damit verbundene Stellung oder Autorität auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, während „einsetzen“ und „fest stehen“ idiomatisches Deutsch bieten. Die Wiederholung „für immer“ wird als rhetorisch und theologisch bedeutsam beibehalten.
