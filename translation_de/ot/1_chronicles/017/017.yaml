base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/017.yaml
  text: And this was a small thing in your eyes[a], O God; yet you have spoken concerning your servant’s house for a long time to come, and you have regarded me according to the rank of man on high, O Yahweh God.
translation:
  language: de
  text: Und dies war gering in deinen Augen, Gott; dennoch hast du über das Haus deines Dieners für die ferne Zukunft gesprochen. Du hast mich gemäß der Ordnung eines hochgestellten Menschen angesehen, Jahwe, Gott.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du hast mir die künftigen Generationen der Menschen gezeigt«; oder: »Du hast mich wie einen hochgestellten Menschen angesehen.« Der hebräische Wortlaut des letzten Satzteils ist schwierig und lässt mehrere Deutungen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן זֹאת בְּעֵינֶיךָ
  choice: Und dies war gering in deinen Augen
  rationale: Bewahrt das hebräische Bewertungsidiom und klingt im Deutschen würdig und verständlich.
- source_word: וַתְּדַבֵּר עַל בֵּית עַבְדְּךָ
  choice: dennoch hast du über das Haus deines Dieners ... gesprochen
  rationale: Gibt דבר על grundnah wieder, ohne die im Kontext liegende Verheißungsfunktion ausdrücklich in das Verb einzutragen.
- source_word: לְמֵרָחוֹק
  choice: auf ferne Zukunft hin
  rationale: Deutet die räumliche Ferne dem Kontext entsprechend zeitlich und bewahrt den Gedanken einer weit vorausliegenden Zukunft.
- source_word: וּרְאִיתַנִי
  choice: Du hast mich angesehen
  rationale: Bewahrt die Grundbedeutung von ראה und lässt offen, ob Sehen, Beachten oder Behandeln im Vordergrund steht.
- source_word: כְּתוֹר הָאָדָם הַמַּעֲלָה
  choice: nach der Rangordnung eines hochgestellten Menschen
  rationale: Versucht, die schwierige Folge mit תור als Ordnung oder Rang und מעלה als erhöhte Stellung möglichst eng und zugleich verständlich wiederzugeben.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe, Gott
  rationale: Gibt den Gottesnamen als Jahwe wieder und versteht beide Bezeichnungen als direkte Anrede.
theological_decisions:
- issue: Deutung der schwierigen Schlusswendung וּרְאִיתַנִי כְּתוֹר הָאָדָם הַמַּעֲלָה
  choice: Du hast mich angesehen nach der Rangordnung eines hochgestellten Menschen
  alternative: 'Du hast mir die künftigen Generationen der Menschen gezeigt; oder: Du hast mich wie einen hochgestellten Menschen angesehen'
  rationale: Die masoretische Wortfolge ist semantisch dunkel. Der Haupttext bleibt nahe an ihren Bestandteilen und legt sich nicht auf eine stark paraphrasierende Deutung fest; wichtige Alternativen werden in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede wird beibehalten; die ungewöhnliche Formulierung im letzten Satzteil bleibt wegen der echten Mehrdeutigkeit des Hebräischen bewusst etwas sperrig.
