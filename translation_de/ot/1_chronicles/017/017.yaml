revisions:
- from: Und dies war gering in deinen Augen, Gott; dennoch hast du über das Haus deines Dieners auf ferne Zukunft hin gesprochen. Du hast mich angesehen nach der Rangordnung eines hochgestellten Menschen[a], Jahwe, Gott.
  to: Und dies war gering in deinen Augen, Gott; dennoch hast du über das Haus deines Dieners für die ferne Zukunft gesprochen. Du hast mich gemäß der Ordnung eines hochgestellten Menschen angesehen, Jahwe, Gott.[a]
  rationale: Die Revision verbessert ausschließlich die deutsche Idiomatik und verschiebt den Fußnotenanker an die umstrittene Schlusswendung. Sie hält an der vorsichtigen, formnahen Hauptlesart fest, ersetzt aber das stärker festlegende „Rangordnung“ durch „Ordnung“. Die Fußnote bewahrt wesentliche alternative Deutungen der semantisch schwierigen hebräischen Wortfolge.
