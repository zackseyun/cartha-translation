base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/005.yaml
  text: For I have not lived in a house from the day that I brought up Israel to this day[a], but I have gone from tent to tent and from dwelling place to dwelling place.
translation:
  language: de
  text: Denn ich habe in keinem Haus gewohnt von dem Tag an, als ich Israel heraufführte, bis zum heutigen Tag, sondern ich war von Zelt zu Zelt und von Wohnstätte zu Wohnstätte unterwegs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der masoretische hebräische Text endet wörtlich: „sondern ich war von Zelt zu Zelt und von [einer] Wohnstätte“. Die Zielangabe „zu Wohnstätte“ im Haupttext ist nach dem vorhergehenden Parallelismus ergänzt. „Wohnstätte“ kann auch als „Stiftshütte“ übersetzt werden.'
    reason: Textliche Unebenheit und lexikalische Alternative am Versende
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: habe … gewohnt
  rationale: ישׁב bezeichnet mit einer Ortsangabe gewöhnlich das Wohnen oder Sichaufhalten. „Gewohnt“ ist im modernen Deutschen natürlich und kontextgerecht.
- source_word: בְּבַיִת
  choice: in keinem Haus
  rationale: Die hebräische Verneinung mit dem unbestimmten בַּיִת wird idiomatisch als „in keinem Haus“ wiedergegeben. „Tempel“ wäre eine kontextuelle Präzisierung, die über den Wortlaut hinausginge.
- source_word: הֶעֱלֵיתִי אֶת יִשְׂרָאֵל
  choice: ich Israel heraufführte
  rationale: Der Hifil von עלה bedeutet hier „heraufführen“. Die Formulierung bewahrt sowohl die Bewegungsrichtung als auch Gottes handelnde Rolle.
- source_word: וָאֶהְיֶה
  choice: ich war … unterwegs
  rationale: Wörtlich steht „und ich war“. Zusammen mit „von Zelt zu Zelt“ bezeichnet die Wendung wechselnde Aufenthaltsorte; „war … unterwegs“ macht diese Bewegung im Deutschen verständlich, ohne sie als bloßes Reisen zu überzeichnen.
- source_word: מֵאֹהֶל אֶל אֹהֶל
  choice: von Zelt zu Zelt
  rationale: Die knappe deutsche Wendung entspricht der wiederholenden hebräischen Konstruktion und bewahrt das Bild beweglicher Aufenthaltsorte.
- source_word: וּמִמִּשְׁכָּן
  choice: und von Wohnstätte zu Wohnstätte
  rationale: מִשְׁכָּן kann „Wohnstätte“ oder als kultischer Fachausdruck „Stiftshütte“ bedeuten. Der überlieferte Text enthält nur den Ausgangsausdruck; die parallele Ergänzung „zu Wohnstätte“ ist aus der vorangehenden Konstruktion erschlossen und wird deshalb in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Wiedergabe der Heiligtumsbegriffe ohne Vorwegnahme späterer Tempeltheologie
  choice: „Haus“ und „Wohnstätte“ im Haupttext
  alternative: „Tempel“ für בַּיִת und „Stiftshütte“ für מִשְׁכָּן
  rationale: Der Vers stellt ein dauerhaftes Haus den beweglichen Zeltstätten gegenüber. „Tempel“ würde den allgemeinen Ausdruck בַּיִת unnötig spezifizieren; „Wohnstätte“ erhält bei מִשְׁכָּן die lexikalische Breite. Die kultische Alternative wird in der Fußnote genannt.
- issue: Unvollständige Parallelform am Versende
  choice: Die sinngemäß ergänzte Bewegung „von Wohnstätte zu Wohnstätte“ im Haupttext kenntlich machen
  alternative: 'Wörtlich: „und von einer Wohnstätte“ beziehungsweise nach einer antiken Textform: „und von einer Wohnstätte zur anderen“'
  rationale: Der masoretische Wortlaut endet ungewöhnlich mit וּמִמִּשְׁכָּן („und von einer Wohnstätte“). Der Parallelismus legt eine ausgelassene Zielangabe nahe, doch die textliche Unebenheit soll nicht verschwiegen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, während „in keinem Haus“ und „war … unterwegs“ idiomatisches Deutsch gewährleisten. Die auffällige Kürze des masoretischen Versendes wird transparent in der Fußnote dokumentiert.
