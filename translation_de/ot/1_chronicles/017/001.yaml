id: 1CH.17.1
reference: 1 Chronicles 17:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר יָשַׁ֥ב דָּוִ֖יד בְּ/בֵית֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜יד אֶל נָתָ֣ן הַ/נָּבִ֗יא הִנֵּ֨ה אָנֹכִ֤י יוֹשֵׁב֙ בְּ/בֵ֣ית הָֽ/אֲרָזִ֔ים וַ/אֲר֥וֹן בְּרִית יְהוָ֖ה תַּ֥חַת יְרִיעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/001.yaml
  text: It happened[a], when David was living in his house, that David said to Nathan the prophet, “Look, I am living in a house of cedar, but the ark of the covenant of Yahweh is under curtains.”
translation:
  language: de
  text: 'Als David in seinem Haus wohnte, sagte er zu dem Propheten Nathan: »Sieh doch: Ich wohne in einem Haus aus Zedernholz, aber die Lade des Bundes Jahwes steht unter Zeltdecken.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als
  rationale: Die Erzählungsformel leitet zusammen mit כַּאֲשֶׁר den zeitlichen Rahmen ein. Im modernen Deutschen gibt ein schlichter Als-Satz die Funktion natürlich wieder, ohne die schwerfällige Formel »Es geschah, als«.
- source_word: יָשַׁב ... יוֹשֵׁב
  choice: wohnte ... wohne
  rationale: ישׁב bezeichnet hier das Wohnen beziehungsweise dauerhafte Ansässigsein. Die Wiederholung des hebräischen Verbs bleibt erhalten.
- source_word: בְּבֵיתוֹ ... בְּבֵית הָאֲרָזִים
  choice: in seinem Haus ... in einem Haus aus Zedernholz
  rationale: »Haus« bewahrt die bewusste Wortwiederholung; »aus Zedernholz« bezeichnet in natürlichem Deutsch das Baumaterial, ohne den Text zu »Palast« auszudeuten.
- source_word: נָתָן הַנָּבִיא
  choice: der Prophet Nathan
  rationale: Natürliche deutsche Wiedergabe von Name und Amtsbezeichnung.
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Die aufmerksamkeitslenkende Partikel wird gegenwärtig und würdevoll wiedergegeben; »siehe« klänge unnötig altertümlich.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: aber die Lade des Bundes Jahwes
  rationale: Das einfache waw trägt im Zusammenhang kontrastive Bedeutung. Die Genitivfolge bewahrt die Zuordnung der Lade zum Bund Jahwes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen etablierte Transkription gibt den im Ausgangstext stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: תַּחַת יְרִיעוֹת
  choice: steht unter Zeltdecken
  rationale: יְרִיעוֹת sind Stoffbahnen oder Decken, besonders die Decken eines Zeltheiligtums. »Zeltdecken« macht den sachlichen Bezug im Deutschen knapp deutlich; »steht« ergänzt idiomatisch das im Hebräischen ausgesparte Prädikat.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen. »Jahwe« bewahrt ihn in der gängigen deutschen Form, ohne ihn konfessionell durch einen Hoheitstitel oder die weniger wahrscheinliche Form »Jehova« zu ersetzen.
- issue: Bezeichnung der Bundeslade
  choice: die Lade des Bundes Jahwes
  alternative: die Bundeslade Jahwes
  rationale: Die ausführliche Genitivkonstruktion entspricht ארון ברית יהוה und hält »Bund« als eigenständigen Begriff sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Eröffnung wird nicht mit dem formelhaften »Und es geschah« nachgebildet, da der Als-Satz ihre Erzählfunktion natürlicher erfüllt. Die direkte Rede bewahrt durch die Wiederholung von »wohnen« und »Haus« Davids zugespitzten Gegensatz.
