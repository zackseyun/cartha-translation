base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/008.yaml
  text: And I have been with you wherever you have gone[a], and I have cut off all your enemies from before you[b], and I will make for you a name like the name of the great ones who are on the earth.
translation:
  language: de
  text: Und ich war mit dir, wohin du auch gingst, und ich habe alle deine Feinde aus deinem Weg beseitigt; ich werde dir einen Namen machen[a] wie den Namen der Großen auf der Erde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: „Ich werde dir zu Ansehen verhelfen.“ Wörtlich: „Ich werde dir einen Namen machen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Land“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: ich war mit dir
  rationale: Der Qal-Wayyiqtol von היה blickt hier auf Gottes bisherige Gegenwart und Hilfe für David zurück; „mit dir“ gibt die Präpositionalverbindung unmittelbar wieder.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: wohin du auch gingst
  rationale: Die hebräische Wendung bezeichnet umfassend alle Wege und Orte Davids; diese deutsche Formulierung ist idiomatisch und bewahrt den Nachdruck auf „überall“.
- source_word: וָאַכְרִית אֶת כָּל אוֹיְבֶיךָ מִפָּנֶיךָ
  choice: ich habe alle deine Feinde vor dir ausgetilgt
  rationale: Hiphil כרת bezeichnet hier das Beseitigen beziehungsweise Vernichten der Feinde. „Ausgetilgt“ bewahrt die starke Aussage, während „vor dir“ die räumliche Bildsprache von מִפָּנֶיךָ erhält.
- source_word: וְעָשִׂיתִי לְךָ שֵׁם
  choice: Ich werde dir einen Namen machen
  rationale: Die Verbform hat im Verheißungszusammenhang Zukunftsbezug. Die wörtlich geprägte Wendung bewahrt das wichtige Bild des „Namens“, das hier Ansehen oder Ruhm bezeichnet.
- source_word: כְּשֵׁם הַגְּדוֹלִים
  choice: wie den Namen der Großen
  rationale: Die substantivierte Pluralform bezeichnet bedeutende oder angesehene Menschen. „Die Großen“ wahrt die knappe Vergleichsstruktur, ohne ein im Hebräischen nicht ausdrücklich markiertes Geschlecht hinzuzufügen.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: auf der Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Im Zusammenhang eines weitreichenden Namens ist „Erde“ eine plausible Hauptlesart; die engere Möglichkeit „Land“ bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Zeitliche Abfolge der göttlichen Handlungen
  choice: Die bisherige Begleitung und das Auslöschen der Feinde werden rückblickend wiedergegeben; das Schaffen eines großen Namens als zukünftige Verheißung.
  alternative: Alle Aussagen entweder einheitlich vergangen oder einheitlich zukünftig wiederzugeben.
  rationale: Die hebräische Abfolge und der Zusammenhang verbinden den Rückblick auf Gottes bisheriges Handeln mit einer nach vorn gerichteten Zusage an David.
- issue: Reichweite von אֶרֶץ
  choice: Erde
  alternative: Land
  rationale: Beide Bedeutungen sind lexikalisch möglich. „Erde“ passt zum Gedanken umfassenden Ruhmes, doch die örtlich begrenztere Lesart darf nicht ausgeschlossen werden und wird daher vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Bildsprache des „Namens“ und „vor dir“ bleibt erhalten; weniger geläufige Bedeutungen werden knapp in Fußnoten erläutert.
