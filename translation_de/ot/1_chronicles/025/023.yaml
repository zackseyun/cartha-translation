  language: en
  yaml_path: translation/ot/1_chronicles/025/023.yaml
  text: The sixteenth was for Hananyahu[a], his sons and his brothers[b], twelve.
translation:
  language: de
  text: 'Der sechzehnte war für Hananja, seine Söhne und seine Brüder: zwölf.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְשִׁשָּׁה עָשָׂר
  choice: Das sechzehnte Los fiel auf
  rationale: Die Präposition לְ mit der Ordnungszahl bezeichnet im Zusammenhang die Zuteilung durch das Los. »Los« steht in diesem Vers nicht ausdrücklich, ist aber aus dem unmittelbaren Kontext klar und ergibt im Deutschen einen natürlichen, verständlichen Satz.
- source_word: לַחֲנַנְיָהוּ
  choice: Hananja
  rationale: Die im Deutschen eingebürgerte biblische Namensform gibt חֲנַנְיָהוּ angemessen wieder.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: בָּנִים bezeichnet hier im genealogischen und dienstbezogenen Listenkontext männliche Nachkommen.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: אָח wird direkt als »Bruder« wiedergegeben; eine weitere Bedeutung wie »Verwandte« oder »Amtsbrüder« ist möglich, wird aber nicht ohne Not in den Haupttext eingetragen.
- source_word: שְׁנֵים עָשָׂר
  choice: insgesamt zwölf
  rationale: Die Zahl nennt die Gesamtstärke der zuvor genannten Gruppe. »insgesamt« macht diesen Bezug im Deutschen klar, ohne die Zahl inhaltlich zu verändern.
