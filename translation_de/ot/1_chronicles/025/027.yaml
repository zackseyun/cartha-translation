  text: Das zwanzigste Los[a] fiel auf Elijata, seine Söhne und seine Brüder; zusammen waren es zwölf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Für den zwanzigsten [Anteil]: für Elijata“. Das Wort „Los“ steht in diesem Vers nicht ausdrücklich, ist aber durch die wiederkehrende Struktur des Kapitels vorausgesetzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/עֶשְׂרִים
  choice: das zwanzigste Los
  rationale: Die Präposition לְ kennzeichnet in der fortlaufenden Zuteilungsliste die Zuordnung zum zwanzigsten Platz. „Los“ ist im Hebräischen dieses Verses nur aus dem wiederkehrenden Zusammenhang des Kapitels erschlossen und wird für klares, natürliches Deutsch ergänzt.
- source_word: לֶֽ/אֱלִיָּתָה
  choice: fiel auf Eliata
  rationale: Der Eigenname wird transliteriert. Das präfigierte לֶ wird zusammen mit der ergänzten Wendung „das Los fiel auf“ idiomatisch als „auf“ wiedergegeben.
- source_word: בָּנָ֥י/ו
  choice: seine Söhne
  rationale: Der maskuline Plural von בֵּן mit Suffix bezeichnet hier die Söhne Eliatas und passt zum männlichen Musikerverzeichnis.
- source_word: וְ/אֶחָ֖י/ו
  choice: und seine Brüder
  rationale: „Brüder“ bewahrt die konkrete Verwandtschaftsbezeichnung des Hebräischen, ohne sie unnötig zu „Verwandte“ oder „Sippenangehörige“ auszuweiten.
- source_word: שְׁנֵ֥ים עָשָֽׂר
  choice: zusammen waren es zwölf
  rationale: Die Zahl nennt die Gesamtstärke der genannten Gruppe. Die ergänzte deutsche Satzform macht den verblosen hebräischen Listenstil verständlich.
