lexical_decisions:
- source_word: לְאַרְבָּעָה עָשָׂר
  choice: Der vierzehnte
  rationale: Die wiederkehrende Formel mit לְ und einer Zahl bezeichnet in diesem Abschnitt das nummerierte Los beziehungsweise die Abteilung. Die knappe Wiedergabe bewahrt die Listenform; »Los« wird im Haupttext nicht ergänzt, weil es in diesem Vers nicht ausdrücklich steht.
- source_word: מַתִּתְיָהוּ
  choice: Mattitja
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen bibelnahen Form wiedergegeben.
- source_word: בָּנָיו
  choice: seinen Söhnen
  rationale: Das hebräische Wort bezeichnet hier ausdrücklich seine Söhne.
- source_word: וְאֶחָיו
  choice: und seinen Brüdern
  rationale: Die direkte moderne Wiedergabe entspricht dem hebräischen Ausdruck; das weiter gefasste »Verwandte« wäre weniger genau.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Die Zahl gibt die Gesamtstärke der Mattitja zugeordneten Gruppe an. Die knappe Form entspricht dem Listenstil des Hebräischen.
