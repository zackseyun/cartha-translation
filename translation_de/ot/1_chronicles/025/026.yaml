lexical_decisions:
- source_word: לְתִשְׁעָה עָשָׂר
  choice: Das neunzehnte Los fiel auf
  rationale: Die elliptische Listenformel bezeichnet im Zusammenhang die Reihenfolge der ausgelosten Dienstgruppen. Im Deutschen macht die Ergänzung „Los fiel auf“ den vorausgesetzten Sinn natürlich und klar.
- source_word: לְמַלּוֹתִי
  choice: Malloti
  rationale: Der Personenname wird nach den hebräischen Konsonanten und Vokalen ins Deutsche transkribiert.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Das Hebräische bezeichnet ausdrücklich die Söhne; die genealogische und administrative Listenform bleibt erhalten.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: Die gewöhnliche Bedeutung ist „Brüder“. Eine mögliche weitere Bedeutung wie männliche Verwandte oder Gruppengenossen wird ohne zwingenden Kontext nicht in den Haupttext übernommen.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Die Zahl gibt die Gesamtstärke der zugehörigen Gruppe an.
