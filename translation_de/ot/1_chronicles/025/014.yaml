  text: The seventh fell to Jesharelah[a]; his sons and his brothers were twelve.
translation:
  language: de
  text: 'Das siebte Los fiel Jesareela[a] zu; seine Söhne und Brüder: zwölf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Der siebte: Jesareela, seine Söhne und seine Brüder, zwölf.“ „Los fiel … zu“ ist nach der wiederkehrenden Losformel in den umliegenden Versen ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁבִעִי
  choice: das siebte Los
  rationale: Die Ordnungszahl steht substantivisch in einer Liste von Losentscheidungen. „Los“ macht den aus dem Zusammenhang erschlossenen Bezug im Deutschen knapp und eindeutig.
- source_word: יְשַׂרְאֵלָה
  choice: Jesarela
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamensform wiedergegeben und nicht übersetzt.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Das hebräische Wort bezeichnet hier ausdrücklich die Söhne und sollte nicht geschlechtsneutral verallgemeinert werden.
- source_word: וְאֶחָיו
  choice: und Brüder
  rationale: Die Grundbedeutung ist „Brüder“; auch wenn im Listenverband weitere männliche Verwandte oder Gruppenangehörige mitgemeint sein könnten, bleibt die konkrete Quellenaussage erhalten.
- source_word: שְׁנֵים עָשָׂר
  choice: insgesamt zwölf
  rationale: Die Zahl nennt die Gesamtstärke der genannten Abteilung. „Insgesamt“ verdeutlicht im Deutschen die zusammenfassende Funktion der vorangestellten Zahlwörter.
- source_word: '[im Kontext vorausgesetzte Losformel]'
  choice: fiel auf
  rationale: Der hebräische Kurzsatz enthält kein Verb; die wiederkehrende Losformel der umliegenden Verse liefert jedoch eindeutig den vorausgesetzten Vorgang.
theological_decisions:
- issue: Umfang der Zahl zwölf
  choice: Jesarela, seine Söhne und Brüder bilden zusammen die Zwölfergruppe.
  alternative: Nur seine Söhne und Brüder, ohne Jesarela selbst, seien zwölf.
  rationale: Die appositionelle hebräische Listenform ist knapp, doch der größere Zusammenhang nennt 24 Abteilungen mit zusammen 288 Personen, also jeweils zwölf einschließlich des Leiters. Die Formulierung „insgesamt zwölf“ bewahrt diese listenbezogene Gesamtzählung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Listenform des Hebräischen bleibt erkennbar, wird aber durch die kontextuell vorausgesetzte Losformel und „insgesamt“ verständlich gegliedert.
