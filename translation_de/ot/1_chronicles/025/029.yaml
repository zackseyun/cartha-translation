base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/029.yaml
  text: 'For the twenty-second[a], to Giddalti: his sons and his brothers, twelve.'
translation:
  language: de
  text: 'Das zweiundzwanzigste Los[a] fiel auf Giddalti, seine Söhne und seine Brüder: zwölf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich in der knappen hebräischen Listenform: »Für das Zweiundzwanzigste, für Giddalti, seine Söhne und seine Brüder: zwölf.« Das Wort »Los« ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁנַיִם וְעֶשְׂרִים
  choice: Das zweiundzwanzigste Los
  rationale: Die knappe hebräische Listenform nennt wörtlich nur die Ordnungszahl mit לְ; aus dem Zusammenhang der ausgelosten Dienstgruppen ist »Los« zu ergänzen. Die deutsche Ordnungszahl gibt die fortlaufende Reihenfolge natürlich wieder.
- source_word: לְגִדַּלְתִּי
  choice: fiel auf Giddalti
  rationale: Das Präfix לְ kennzeichnet hier die Zuweisung an Giddalti. Zusammen mit dem aus dem Kontext ergänzten »Los« ist »fiel auf« im Deutschen idiomatisch und erhält den Zuteilungssinn.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: בָּנִים bezeichnet hier ausdrücklich männliche Nachkommen; eine allgemeinere Wiedergabe mit »Kinder« wäre unnötig.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: Die gewöhnliche Bedeutung von אָח im Plural ist »Brüder«. Der Zusammenhang verlangt keine Erweiterung zu »Verwandte« oder »Stammesgenossen«.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Die Schlusszahl gibt wie in der umgebenden Liste die Gesamtstärke der Gruppe an. Der knappe Nachtrag nach einem Doppelpunkt bewahrt den Listenstil des Hebräischen.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. Die elliptische hebräische Listenform wird durch »Los fiel auf« verständlich gemacht; der Doppelpunkt vor der Gesamtzahl bewahrt ihre Prägnanz.
