lexical_decisions:
- source_word: לְשִׁבְעָה עָשָׂר
  choice: Für das siebzehnte Los
  rationale: Die Präposition לְ mit der Ordnungszahl bezeichnet innerhalb der Liste die Zuweisung in der Reihenfolge. Das im Hebräischen ausgelassene Bezugswort wird aus dem Zusammenhang als „Los“ ergänzt, um im Deutschen einen verständlichen Satz zu bilden.
- source_word: לְיָשְׁבְּקָשָׁה
  choice: Joschbekascha
  rationale: Der Personenname wird nach der hebräischen Form wiedergegeben. Die Zuordnung, die das vorangestellte לְ ausdrückt, ist im Deutschen bereits durch „Für das siebzehnte Los“ und den Doppelpunkt erkennbar.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: בנים bezeichnet hier ausdrücklich die Söhne und nicht allgemein die Kinder.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: אחים bedeutet unmittelbar „Brüder“; die mögliche weitere Bedeutung „männliche Verwandte“ wird nicht ohne zwingenden Kontext in den Haupttext eingetragen.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Die Kardinalzahl gibt entsprechend dem wiederkehrenden Listenmuster die Gesamtzahl der Gruppe an.
