  text: For the seventeenth[a], Joshbekashah, his sons and his brothers, twelve.
translation:
  language: de
  text: 'Für das siebzehnte Los[a]: Jaschbekascha, seine Söhne und seine Brüder, zwölf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für den siebzehnten“; „Los“ ist aus dem Zusammenhang ergänzt.'
