base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/022.yaml
  text: 'For the fifteenth[a], to Jeremoth: his sons and his brothers[b], twelve.'
translation:
  language: de
  text: 'Für das fünfzehnte Los[a]: Jeremot, seine Söhne und seine Brüder, zwölf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Für das Fünfzehnte: für Jeremot.« Das Wort »Los« ist durch das wiederkehrende Muster dieses Kapitels vorausgesetzt, steht hier im Hebräischen jedoch nicht ausdrücklich.'
    reason: cross_reference
lexical_decisions:
- source_word: לַחֲמִשָּׁה עָשָׂר
  choice: Für das fünfzehnte Los
  rationale: Die Formulierung bezeichnet innerhalb der wiederkehrenden Zuteilungsformel die fünfzehnte Auslosung. »Los« ist im Hebräischen dieses Verses nicht ausdrücklich genannt, wird aber für natürliches und verständliches Deutsch aus dem unmittelbaren Zusammenhang ergänzt und durch eine Fußnote kenntlich gemacht.
- source_word: לִירֵמוֹת
  choice: Jeremot
  rationale: Das präfigierte ל markiert hier die Zuweisung des Loses. Nach dem deutschen Doppelpunkt genügt der Name ohne eine zusätzliche Präposition; »Jeremot« gibt den hebräischen Personennamen wieder.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Das hebräische Wort bezeichnet hier ausdrücklich seine Söhne.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: Die direkte Wiedergabe ist »seine Brüder«; eine weiter gefasste Bedeutung wie männliche Verwandte oder Stammesgenossen ist im Kontext möglich, aber nicht erforderlich.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Die Zahl gibt die Gesamtstärke der Jeremot zugeordneten Gruppe an.
theological_decisions: []
translation_notes:
  register: Knappes, listenartiges Deutsch, das die elliptische Struktur des hebräischen Verzeichnisses bewahrt. Der Doppelpunkt macht die Zuweisung verständlich, ohne die Präposition ל unnötig doppelt wiederzugeben.
