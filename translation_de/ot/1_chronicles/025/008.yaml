  text: וַ/יַּפִּ֜ילוּ גּוֹרָל֣וֹת מִשְׁמֶ֗רֶת לְ/עֻמַּת֙ כַּ/קָּטֹ֣ן כַּ/גָּד֔וֹל מֵבִ֖ין עִם תַּלְמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/008.yaml
  text: And they cast lots for duties[a], the small as well as the great[b], the teacher with the student.
translation:
  language: de
  text: 'Sie warfen Lose für die Diensteinteilung[a] aus: für den Geringen ebenso wie für den Großen[b], für den Kundigen ebenso wie für den Lernenden[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die Dienstabteilungen“. Das hebräische Wort kann eine Dienstordnung, einen zugewiesenen Dienst oder eine Dienstabteilung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wie der Geringe, wie der Große“. Gemeint ist die gleiche Behandlung ohne Rücksicht auf Rang oder Stellung.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „für den Lehrer“. Das hebräische Wort bedeutet wörtlich „der Verständige“ oder „der Kundige“ und kann hier einen erfahrenen Lehrer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ גּוֹרָלוֹת
  choice: Sie warfen Lose
  rationale: Die Verbindung aus dem Hifil von נפל und גּוֹרָלוֹת ist die übliche Wendung für das Werfen von Losen. Die deutsche Formulierung bewahrt sowohl die konkrete Handlung als auch ihre Funktion bei der Zuteilung.
- source_word: מִשְׁמֶרֶת
  choice: für die Diensteinteilung
  rationale: Das Substantiv bezeichnet hier im Zusammenhang des Tempelmusikdienstes die geordnete Dienstabteilung beziehungsweise Dienstzuweisung. „Diensteinteilung“ ist im modernen Deutsch verständlich, ohne einen im Hebräischen nicht ausdrücklich vorhandenen Possessivbezug einzufügen.
- source_word: לְעֻמַּת
  choice: ebenso wie
  rationale: Die Präposition drückt hier eine Entsprechung beziehungsweise Gleichstellung der genannten Gruppen aus, nicht eine räumliche Gegenüberstellung.
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: für den Geringen ebenso wie für den Großen
  rationale: Die Wiedergabe bewahrt das hebräische Gegensatzpaar und macht zugleich deutlich, dass beide bei der Losverteilung gleich behandelt wurden.
- source_word: מֵבִין
  choice: für den Kundigen
  rationale: Das Partizip bezeichnet wörtlich jemanden, der versteht beziehungsweise sachkundig ist. „Kundiger“ bewahrt diese Bedeutung und legt die möglicherweise gemeinte Rolle als Lehrer nicht vorschnell fest.
- source_word: עִם תַּלְמִיד
  choice: zusammen mit dem Lernenden
  rationale: תַּלְמִיד bezeichnet hier einen Lernenden oder Schüler. „Lernender“ bildet einen natürlichen Gegensatz zum Kundigen, ohne spätere religiöse Nebenbedeutungen von „Jünger“ einzutragen; עִם wird unmittelbar mit „zusammen mit“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird aber durch den Doppelpunkt transparent gegliedert. „Kundiger“ erhält die lexikalische Offenheit von מֵבִין; die stärker relationale Deutung „Lehrer“ steht in der Fußnote.
