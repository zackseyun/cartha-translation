  yaml_path: translation/ot/1_chronicles/025/012.yaml
  text: The fifth was Nethaniah[a]; his sons and his brothers were twelve.
translation:
  language: de
  text: Der fünfte war Nethanja[a]; seine Söhne und seine Brüder waren zwölf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im Zusammenhang: „Das fünfte Los fiel auf Nethanja; seine Söhne und seine Brüder waren zwölf.“ Im Hebräischen fehlen Wörter wie „Los“ und „fiel auf“; sie ergeben sich aus der umgebenden Liste.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: Der fünfte
  rationale: Der bestimmte Ordinalausdruck steht in dieser Los- bzw. Abteilungsliste elliptisch. Der Kontext ergänzt gedanklich etwa „Los“ und „fiel auf“, doch diese Wörter stehen im Vers nicht ausdrücklich.
- source_word: נְתַנְיָהוּ
  choice: Netanja
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, am Hebräischen orientierten Form wiedergegeben.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Der maskuline Plural von בֵּן mit Suffix bezeichnet hier ausdrücklich die Söhne.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: אָח im Plural mit Suffix bedeutet in diesem Listenformular am naheliegendsten „seine Brüder“; eine weitere Bedeutung wie „Verwandte“ ist nicht erforderlich.
- source_word: שְׁנֵים עָשָׂר
  choice: waren zwölf
  rationale: Die Kardinalzahl gibt die Gesamtzahl der genannten Gruppe an. Das im Deutschen nötige Verb „waren“ wird sinngemäß ergänzt.
