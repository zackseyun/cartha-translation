source:
  edition: WLC
  text: וַ/יְהִ֤י מִסְפָּרָ/ם֙ עִם אֲחֵי/הֶ֔ם מְלֻמְּדֵי שִׁ֖יר לַ/יהוָ֑ה כָּל הַ֨/מֵּבִ֔ין מָאתַ֖יִם שְׁמוֹנִ֥ים וּ/שְׁמוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/007.yaml
  text: Their number[a], together with their brothers who were trained in singing to Yahweh, all who were skillful[b], was two hundred eighty-eight.
translation:
  language: de
  text: Ihre Zahl, zusammen mit ihren Brüdern, die im Gesang für Jahwe[a] ausgebildet und allesamt kundig[b] waren, betrug zweihundertachtundachtzig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu Jahwe“. Die hebräische Präposition kann hier die Ausrichtung oder den Zweck des musikalischen Dienstes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „verständig“ oder „einsichtig“; gemeint sind hier Kundige beziehungsweise Befähigte im musikalischen Dienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפָּרָם
  choice: ihre Zahl
  rationale: Die Wendung gibt den gezählten Gesamtumfang wieder und entspricht natürlich dem hebräischen Substantiv mit Suffix.
- source_word: עִם אֲחֵיהֶם
  choice: zusammen mit ihren Brüdern
  rationale: עִם bezeichnet die Einbeziehung beziehungsweise Begleitung; אֲחֵיהֶם wird im Kontext des männlichen levitischen Dienstes konkret als „Brüder“ wiedergegeben.
- source_word: מְלֻמְּדֵי שִׁיר
  choice: die im Gesang … ausgebildet waren
  rationale: Das passive Partizip von למד bezeichnet Unterwiesene oder Ausgebildete; שִׁיר meint hier den Gesang im musikalischen Tempeldienst.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל kann hier Zielrichtung oder Zweck des Gesangs bezeichnen. „Für Jahwe“ ist im Deutschen idiomatisch und wahrt den Bezug des Dienstes auf Gott.
- source_word: כָּל הַמֵּבִין
  choice: allesamt kundig
  rationale: Das Partizip von בין bezeichnet in diesem Zusammenhang verständige, sachkundige beziehungsweise befähigte Personen. „Kundig“ bewahrt sowohl den Bezug auf Einsicht als auch den kontextuellen Sinn musikalischer Kompetenz.
- source_word: מָאתַיִם שְׁמוֹנִים וּשְׁמוֹנָה
  choice: zweihundertachtundachtzig
  rationale: Die hebräische Zahlenfolge ergibt eindeutig 288; die ausgeschriebene Form entspricht einem würdigen deutschen Bibelstil.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm direkt. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug der Präposition ל in לַיהוָה
  choice: für Jahwe
  alternative: Jahwe zu / zu Jahwe
  rationale: Im Kontext des musikalischen Dienstes kann ל sowohl die Ausrichtung des Gesangs als auch seinen Zweck ausdrücken. Der Haupttext wählt die im Deutschen natürliche Zweckangabe; die Fußnote hält die alternative Zielrichtung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird aber durch einen Relativsatz und „betrug“ idiomatisch gestaltet. Die Fußnotenmarker stehen bei den tatsächlich erläuterten Ausdrücken; die fehlerhafte Markerzuordnung der englischen Konsultationsschicht wurde nicht übernommen.
