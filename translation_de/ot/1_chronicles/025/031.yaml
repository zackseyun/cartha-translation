lexical_decisions:
- source_word: לְאַרְבָּעָה וְעֶשְׂרִים
  choice: für das vierundzwanzigste Los
  rationale: Die Präposition לְ bezeichnet hier die Zuteilung; die Zahl hat im Zusammenhang ordinalen Sinn. „Los“ ist im unmittelbaren Abschnitt als Bezugswort vorausgesetzt und wird für natürliches, klares Deutsch ergänzt, während die Fußnote die Ellipse des Hebräischen kenntlich macht.
- source_word: לְרוֹמַמְתִּי עָזֶר
  choice: Romamti-Eser
  rationale: Der Personenname wird nach deutscher Bibeltradition und hebräischer Aussprache transliteriert; צ wird als „z“, ז als „s“ wiedergegeben.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Das hebräische Wort bezeichnet hier ausdrücklich die Söhne des Genannten.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: Die lexikalische Grundbedeutung „seine Brüder“ bleibt erhalten, auch wenn der Ausdruck im Listenverband möglicherweise weitere männliche Verwandte oder Mitglieder der Gruppe einschließt.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Die Kardinalzahl gibt wie in den vorangehenden Losgruppen die Gesamtzahl der genannten Männer an.
