  language: de
  text: Das vierte Los fiel auf Jizri, seine Söhne und seine Brüder, zwölf an der Zahl.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: Der vierte
  rationale: Die Ordnungszahl steht in dieser Liste elliptisch für das vierte Los beziehungsweise die vierte Zuteilung. Die knappe Form des Hebräischen bleibt im Haupttext erhalten.
- source_word: לַיִּצְרִי
  choice: für Jizri
  rationale: Die Präposition ל bezeichnet hier die Zuweisung; im Deutschen ist „für“ in diesem Listenstil natürlich.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Das hebräische Wort bezeichnet ausdrücklich seine Söhne.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: Die direkte Bedeutung ist „Brüder“; eine weitere Bedeutung wie männliche Verwandte oder Gefährten wird nicht ohne Not in den Haupttext aufgenommen.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Die Zahl nennt knapp die Gesamtstärke der Gruppe; der Doppelpunkt macht diesen Bezug im Deutschen verständlich, ohne ein Verb hinzuzufügen.
