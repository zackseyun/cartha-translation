lexical_decisions:
- source_word: לִשְׁלֹשָׁה עָשָׂר
  choice: Das dreizehnte Los fiel auf
  rationale: Das präfigierte ל bezeichnet hier im Zusammenhang der ausgelosten Dienstgruppen die Zuweisung. Obwohl »Los« und »fiel« nicht ausdrücklich dastehen, gibt diese im Deutschen natürliche Formulierung den im Kontext vorausgesetzten Vorgang klar wieder.
- source_word: שׁוּבָאֵל
  choice: Schubaël
  rationale: Der Personenname wird nach gängigen deutschen Transliterationskonventionen wiedergegeben; das Trema macht die getrennte Aussprache der Vokale sichtbar.
- source_word: בָּנָיו
  choice: seinen Söhnen
  rationale: Das hebräische Wort bezeichnet hier ausdrücklich männliche Nachkommen und wird daher nicht verallgemeinernd mit »Kindern« übersetzt.
- source_word: וְאֶחָיו
  choice: und seinen Brüdern
  rationale: Die naheliegende lexikalische Bedeutung ist »Brüder«; die mögliche weitere Bedeutung männlicher Verwandter oder Gruppenangehöriger wird nicht ohne Not in den Haupttext eingetragen.
- source_word: שְׁנֵים עָשָׂר
  choice: waren es zwölf
  rationale: Die Zahl bezeichnet die Gesamtstärke der Schubaël zugeordneten Gruppe. Die verbale Ergänzung ergibt im modernen Deutschen einen vollständigen und verständlichen Satz.
