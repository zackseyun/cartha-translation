lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: der zehnte
  rationale: Der bestimmte Ordinal setzt die fortlaufende Reihe der Lose beziehungsweise Abteilungen im Kontext fort. Die knappe Form bewahrt die elliptische Ausdrucksweise des Hebräischen.
- source_word: שִׁמְעִי
  choice: Schimi
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: בנים bezeichnet hier in der genealogischen und dienstbezogenen Liste ausdrücklich die Söhne.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: אחים mit Suffix bedeutet unmittelbar »seine Brüder«; mögliche weitere Bezüge auf männliche Verwandte oder Angehörige der Gruppe werden nicht in den Haupttext eingetragen.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Die Zahl nennt entsprechend der wiederkehrenden Formel des Abschnitts die Gesamtzahl der zu Schimi gehörenden Söhne und Brüder.
