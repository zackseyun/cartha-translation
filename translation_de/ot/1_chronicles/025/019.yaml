translation:
  language: de
  text: Das zwölfte Los fiel auf Haschabja[a], seine Söhne und seine Brüder, insgesamt zwölf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »die zwölf«; der Zusammenhang spricht für die Ordnungszahl »das zwölfte«, da hier die Lose der Reihe nach aufgezählt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: das zwölfte Los
  rationale: Die im Kapitel fortlaufend nummerierten Zuteilungen zeigen, dass die Kardinalzahl hier idiomatisch ordinal gebraucht wird. »Los« wird zur natürlichen Verständlichkeit aus dem unmittelbaren Listenrahmen ergänzt.
- source_word: לַחֲשַׁבְיָה
  choice: fiel auf Haschabja
  rationale: Das Präfix ל bezeichnet hier den Empfänger der Loszuteilung; die deutsche Wendung fügt sich natürlich in die wiederkehrende Listenformel ein.
- source_word: חֲשַׁבְיָה
  choice: Haschabja
  rationale: Der Personenname wird in einer im Deutschen üblichen, an der hebräischen Form orientierten Schreibweise wiedergegeben.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: בנים bezeichnet hier die männlichen Nachkommen und wird im genealogisch-personellen Zusammenhang entsprechend konkret übersetzt.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: Die Grundbedeutung von אחים bleibt erhalten; der Kontext verlangt keine Erweiterung zu »Verwandte« oder »Stammesgenossen«.
- source_word: שְׁנֵים עָשָׂר
  choice: insgesamt zwölf
  rationale: Die Schlusszahl nennt die Gesamtstärke der zugeteilten Gruppe; »insgesamt« macht diese Funktion im Deutschen klar, ohne den Sinn zu verändern.
