source:
  edition: WLC
  text: וַ/יֵּצֵ֞א הַ/גּוֹרָ֧ל הָ/רִאשׁ֛וֹן לְ/אָסָ֖ף לְ/יוֹסֵ֑ף גְּדַלְיָ֨הוּ֙ הַ/שֵּׁנִ֔י הֽוּא וְ/אֶחָ֥י/ו וּ/בָנָ֖י/ו שְׁנֵ֥ים עָשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/009.yaml
  text: The first lot came out for Asaph[a], for Joseph; Gedaliah the second, he and his brothers and his sons[b], twelve.
translation:
  language: de
  text: 'Das erste Los fiel für Asaf, für Josef; das zweite für Gedaljahu: er, seine Brüder und seine Söhne, insgesamt zwölf.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: das Los fiel
  rationale: Beim Losverfahren ist »das Los fiel« die natürliche deutsche Entsprechung; sie gibt den Vorgang wieder, ohne die Zuteilung näher auszudeuten.
- source_word: לְאָסָף לְיוֹסֵף
  choice: für Asaf, für Josef
  rationale: Die Präposition לְ kennzeichnet hier die Zuordnung. Ihre Wiederholung bewahrt die knappe, leicht mehrdeutige Beziehung zwischen Asaf und Josef.
- source_word: גְּדַלְיָהוּ הַשֵּׁנִי
  choice: das zweite für Gedaljahu
  rationale: Das im Hebräischen elliptische zweite Glied wird im Deutschen durch die Ergänzung »Los fiel« sinngemäß aufgenommen; die Form Gedaljahu bildet den hebräischen Namen transparent ab.
- source_word: הוּא וְאֶחָיו וּבָנָיו
  choice: er, seine Brüder und seine Söhne
  rationale: Das ausdrückliche Pronomen הוּא bleibt erhalten und bezeichnet zusammen mit Brüdern und Söhnen die gezählte Gruppe.
- source_word: שְׁנֵים עָשָׂר
  choice: insgesamt zwölf
  rationale: Die Zahl bezeichnet die Gesamtstärke der genannten Gruppe; »insgesamt« macht diese Funktion in natürlichem Deutsch deutlich.
theological_decisions:
- issue: Beziehung der Angaben »für Asaf« und »für Josef«
  choice: Beide Zuordnungen werden ohne erklärenden Zusatz nebeneinandergestellt.
  alternative: »für Josef aus der Familie Asafs«
  rationale: Der hebräische Wortlaut ist knapp und lässt die syntaktische Beziehung unausgesprochen; die Übersetzung soll diese Spannung nicht durch eine genealogische Erklärung auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die listenartige Kürze des hebräischen Verses bleibt erkennbar, wird aber durch eine maßvolle elliptische Ergänzung und »insgesamt« verständlich gemacht.
