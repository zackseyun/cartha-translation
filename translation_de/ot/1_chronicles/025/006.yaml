revisions:
- from: Alle diese standen unter der Leitung ihres Vaters[a] beim Gesang[b] im Haus Jahwes. Mit Zimbeln, Harfen und Leiern[c] versahen sie den Dienst im Haus Gottes. Asaf, Jedutun und Heman standen unter der Leitung des Königs.
  to: Alle diese standen beim Gesang im Haus Jahwes unter der Leitung ihres Vaters[a], mit Zimbeln, Harfen und Leiern[c], für den Dienst im Haus Gottes. Ihre Väter, Asaf, Jedutun und Heman, standen unter der Leitung des Königs.
  rationale: 'Die Revision bewahrt sämtliche Inhalte und die begründete Wiedergabe der Schlüsselbegriffe, verbindet Instrumente und Tempeldienst aber wieder mit der Hauptaussage. Der zweite Satz macht die im Kontext naheliegende, im Hebräischen knapp ausgedrückte Beziehung deutlich: Asaf, Jedutun und Heman sind die Väter beziehungsweise Leiter der Gruppen und stehen unter königlicher Aufsicht. Die Fußnotenanker bleiben vollständig erhalten; Fußnote a wird lexikalisch präzisiert.'
