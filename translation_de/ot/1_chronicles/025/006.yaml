  text: כָּל אֵ֣לֶּה עַל יְדֵי֩ אֲבִי/הֶ֨ם בַּ/שִּׁ֜יר בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ נְבָלִ֣ים וְ/כִנֹּר֔וֹת לַ/עֲבֹדַ֖ת בֵּ֣ית הָ/אֱלֹהִ֑ים עַ֚ל יְדֵ֣י הַ/מֶּ֔לֶךְ אָסָ֥ף וִ/ידוּת֖וּן וְ/הֵימָֽן־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/006.yaml
  text: 'All these were under the direction of their father in the music of the house of Yahweh[a], with cymbals, harps, and lyres, for the service of the house of God, under the direction of the king: Asaph, Jeduthun[c][b], and Heman.'
translation:
  language: de
  text: Alle diese standen beim Gesang im Haus Jahwes unter der Leitung ihres Vaters[a], mit Zimbeln, Harfen und Leiern[c], für den Dienst im Haus Gottes. Ihre Väter, Asaf, Jedutun und Heman, standen unter der Leitung des Königs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unter der Hand ihres Vaters“; die hebräische Wendung bezeichnet hier Leitung oder Aufsicht.'
    reason: lexical_alternative
  - marker: c
    text: Die genaue Bauart und Abgrenzung der beiden mit „Harfen“ und „Leiern“ bezeichneten antiken Saiteninstrumente ist unsicher.
    reason: cultural_note
lexical_decisions:
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: unter der Leitung ihres Vaters
  rationale: Die Wendung bedeutet wörtlich „durch die Hand ihres Vaters“, bezeichnet hier aber Aufsicht und musikalische Leitung. Der Singular „Vater“ mit pluralischem Possessivbezug wird bewahrt.
- source_word: בַּשִּׁיר
  choice: beim Gesang
  rationale: שִׁיר kann Lied, Gesang oder Singen bezeichnen. „Beim Gesang“ ist im Zusammenhang des Tempeldienstes natürlich und hält die Bedeutung enger als das umfassendere „bei der Musik“.
- source_word: בֵּית יְהוָה
  choice: im Haus Jahwes
  rationale: „Haus“ gibt בֵּית formal wieder; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: בִּמְצִלְתַּיִם
  choice: mit Zimbeln
  rationale: Die Präposition ist instrumental; das Substantiv bezeichnet im kultischen Musizieren verwendete Zimbeln.
- source_word: נְבָלִים וְכִנֹּרוֹת
  choice: Harfen und Leiern
  rationale: Die beiden verschiedenen Saiteninstrumente werden mit geläufigen deutschen Bezeichnungen unterschieden, obwohl ihre genaue Bauart nicht sicher bestimmbar ist.
- source_word: לַעֲבֹדַת בֵּית הָאֱלֹהִים
  choice: versahen sie den Dienst im Haus Gottes
  rationale: עֲבֹדָה bezeichnet hier den kultischen Dienst. Die verbale Formulierung ergibt im Deutschen einen klaren Satz, ohne den Inhalt auszuweiten.
- source_word: עַל יְדֵי הַמֶּלֶךְ
  choice: unter der Leitung des Königs
  rationale: Die wiederholte Hand-Wendung bezeichnet Leitung oder Aufsicht; die gleiche deutsche Wiedergabe wahrt die sprachliche Entsprechung.
- source_word: אָסָף וִידוּתוּן וְהֵימָן
  choice: Asaf, Jedutun und Heman
  rationale: Die Personennamen werden in gebräuchlicher deutscher Umschrift wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm; „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Syntaktische Zuordnung von Asaf, Jedutun und Heman
  choice: Asaf, Jedutun und Heman werden als die unter der Leitung des Königs stehenden Väter verstanden
  alternative: Die Namen könnten appositionell an die vorherige Gesamtaussage angeschlossen werden
  rationale: Die hebräische Schlussfolge ist knapp. Der Kontext von 1. Chronik 25 unterscheidet die Söhne unter ihren jeweiligen Vätern und die drei Väter unter königlicher Aufsicht. Die deutsche Satzgliederung macht diese wahrscheinlichste Beziehung lesbar, ohne eine zusätzliche inhaltliche Aussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drei kurzen Sätze lösen die gedrängte hebräische Syntax transparent auf. „Haus“ wahrt die Bildsprache des Ausgangstextes; „Dienst versehen“ ist im kultischen Zusammenhang verständlich, ohne spätere konfessionelle Fachsprache einzutragen.
