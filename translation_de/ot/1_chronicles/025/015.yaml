  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: בנים bezeichnet hier konkret die Söhne und nicht allgemein Kinder.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: אחים wird in seiner naheliegenden familiären Bedeutung wiedergegeben; der Kontext erzwingt keine weitere Bedeutung wie Verwandte oder Gefährten.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Die Zahl nennt die Gesamtstärke der Gruppe. Wie im Hebräischen bleibt die knappe Listenform ohne ergänztes Verb erhalten.
