- source_word: הַתְּשִׁיעִי
  choice: Der neunte war
  rationale: Der bestimmte Ordinal steht in der knappen Liste elliptisch; das ergänzte „war“ ergibt natürliches Deutsch, ohne ein im Hebräischen unausgesprochenes Substantiv wie „Los“ einzufügen.
- source_word: מַתַּנְיָהוּ
  choice: Mattanjahu
  rationale: Die Umschrift gibt die hebräische Namensform in einer im Deutschen gut lesbaren Form wieder.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Das hebräische Wort bezeichnet hier ausdrücklich männliche Nachkommen und wird im genealogischen Listenzusammenhang entsprechend wiedergegeben.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: „Brüder“ bewahrt den naheliegenden Wortsinn; die mögliche weitere Bedeutung von männlichen Verwandten oder Gruppengenossen wird nicht ohne zwingenden Kontext eingesetzt.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Die knappe Zahlenangabe folgt der wiederkehrenden Listenformel des Kapitels und bezeichnet die Gesamtzahl der genannten Gruppe.
