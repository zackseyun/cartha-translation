source:
  edition: WLC
  text: וַ/יַּבְדֵּ֣ל דָּוִיד֩ וְ/שָׂרֵ֨י הַ/צָּבָ֜א לַ/עֲבֹדָ֗ה לִ/בְנֵ֤י אָסָף֙ וְ/הֵימָ֣ן וִֽ/ידוּת֔וּן ה/נביאים בְּ/כִנֹּר֥וֹת בִּ/נְבָלִ֖ים וּ/בִ/מְצִלְתָּ֑יִם וַֽ/יְהִי֙ מִסְפָּרָ֔/ם אַנְשֵׁ֥י מְלָאכָ֖ה לַ/עֲבֹדָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/001.yaml
  text: 'And David and the commanders of the army set apart for the service the sons of Asaph[a], Heman, and Jeduthun, who prophesied with lyres, harps, and cymbals; and their number, the men for the work of their service[b], was:'
translation:
  language: de
  text: 'David und die Heerführer sonderten für den Dienst die Söhne[b] Asafs[a], Hemans und Jedutuns aus, die mit Leiern, Harfen und Zimbeln weissagten. Und die Zahl der für ihren Dienst tätigen Männer war:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formaler: „die Propheten mit Leiern, Harfen und Zimbeln“. Das Hebräische kann „die Propheten“ als Beifügung zu Asaf, Heman und Jedutun verstehen.'
    reason: alternative_reading
  - marker: b
    text: Hebräisch „Söhne Asafs, Hemans und Jedutuns“; dies kann Nachkommen oder Angehörige ihrer Musikergruppen bezeichnen, nicht nur unmittelbare Söhne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְדֵּל
  choice: sonderten ... aus
  rationale: Das Hifil von בדל bezeichnet ein Absondern beziehungsweise Aussondern für einen bestimmten Zweck; die deutsche Formulierung wahrt hier sowohl den organisatorischen als auch den kultischen Zusammenhang.
- source_word: שָׂרֵי הַצָּבָא
  choice: die Heerführer
  rationale: שָׂרֵי bezeichnet führende Amtsträger und צָבָא gewöhnlich das Heer. „Heerführer“ ist knapp, gegenwärtig verständlich und lässt die ungewöhnliche Beteiligung militärischer Führer an der Ordnung des Tempeldienstes stehen.
- source_word: לַעֲבֹדָה
  choice: für den Dienst
  rationale: עֲבֹדָה bezeichnet in diesem kultischen Zusammenhang den geordneten Dienst; der bestimmte Artikel entspricht der konkreten, bereits vorausgesetzten Aufgabe.
- source_word: לִבְנֵי אָסָף וְהֵימָן וִידוּתוּן
  choice: die Söhne Asafs, Hemans und Jedutuns
  rationale: בְּנֵי kann unmittelbare Söhne, Nachkommen oder Angehörige einer Sippe beziehungsweise Gruppe bezeichnen. Die wörtlich nahe Wiedergabe bewahrt diese Spannweite; eine Fußnote erklärt sie.
- source_word: הנביאים
  choice: die ... weissagten
  rationale: Die morphologisch substantivische Form „die Propheten/Weissagenden“ steht beschreibend beziehungsweise appositionell. Eine Relativkonstruktion ist im Deutschen natürlich und hält fest, dass ihre musikalische Tätigkeit als prophetisches Wirken bezeichnet wird.
- source_word: בְּכִנֹּרוֹת
  choice: mit Leiern
  rationale: כִּנּוֹר bezeichnet am ehesten eine Leier. So bleibt das Instrument von נֵבֶל unterschieden.
- source_word: בִּנְבָלִים
  choice: Harfen
  rationale: נֵבֶל ist ein Saiteninstrument, das von כִּנּוֹר unterschieden wird. „Harfen“ ist eine verständliche konventionelle Wiedergabe, ohne eine übermäßig technische Bestimmung vorzutäuschen.
- source_word: וּבִמְצִלְתָּיִם
  choice: und Zimbeln
  rationale: מְצִלְתַּיִם bezeichnet paarweise geschlagene Becken beziehungsweise Zimbeln; „Zimbeln“ passt zum biblisch-kultischen Register und ist verständlich.
- source_word: וַיְהִי מִסְפָּרָם
  choice: 'Und dies war die Zahl ...:'
  rationale: Die Wendung leitet die folgende Aufzählung ein. Der Doppelpunkt bildet diese vorwärtsweisende Funktion ab.
- source_word: אַנְשֵׁי מְלָאכָה לַעֲבֹדָתָם
  choice: der Männer, die das Werk ihres Dienstes verrichteten
  rationale: Die Formulierung gibt die für die Aufgabe tätigen Männer wieder, ohne מְלָאכָה unnötig als besondere handwerkliche Fachkunde zu deuten, und vermeidet zugleich das im Deutschen schwerfällige „Männer des Werkes“.
theological_decisions:
- issue: Substantivische oder verbale Wiedergabe von הַנְּבִיאִים
  choice: „die ... weissagten“ als Relativsatz
  alternative: „die Propheten mit Leiern, Harfen und Zimbeln“
  rationale: Der Relativsatz ist natürliches Deutsch und bringt die Verbindung von Weissagung und Musik zum Ausdruck. Da der hebräische Ausdruck auch als Apposition zu Asaf, Heman und Jedutun gelesen werden kann, wird diese Möglichkeit in einer Fußnote ausdrücklich bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Begriffe „Dienst“ und „weissagten“ bleiben erhalten. Der Satz endet mit einem Doppelpunkt, da die Zahlenangaben in den folgenden Versen anschließen. Beide Fußnotenmarker sind im Haupttext platziert; [b] steht unmittelbar bei „Söhne“, [a] bei der syntaktisch mehrdeutigen Verbindung zu Asaf.
