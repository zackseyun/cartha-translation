base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/005.yaml
  text: All these were sons of Heman[a], the king’s seer in the words of God, to exalt the horn[b]. And God gave Heman fourteen sons and three daughters.
translation:
  language: de
  text: Alle diese waren Söhne Hemans, des Sehers des Königs in den Angelegenheiten Gottes[a], um das Horn zu erhöhen[b]. Und Gott gab Heman vierzehn Söhne und drei Töchter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Sehers des Königs in den Worten Gottes“ beziehungsweise „durch die Worte Gottes“. Die knappe hebräische Formulierung lässt die genaue Beziehung offen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „um das Horn emporzuheben“. Das Horn ist hier ein Bild für Kraft, Ehre oder eine erhöhte Stellung; wessen Horn gemeint ist, wird nicht ausdrücklich gesagt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹזֵה
  choice: Seher
  rationale: „Seher“ gibt Hemans offenbarungsbezogene Funktion am Königshof präzise und in der Chronik sachgerecht wieder, ohne sie zum allgemeineren „Propheten“ auszuweiten.
- source_word: בְּדִבְרֵי הָאֱלֹהִים
  choice: in den Worten Gottes
  rationale: Die bewusst nahe Wiedergabe bewahrt die gedrängte und mehrdeutige hebräische Konstruktion; möglich sind ein Bezug auf göttliche Offenbarungsworte, Angelegenheiten Gottes oder das Mittel göttlicher Worte.
- source_word: לְהָרִים קָרֶן
  choice: um das Horn zu erhöhen
  rationale: Die Formulierung erhält sowohl die Zweckkonstruktion als auch das biblische Bild vom Horn als Zeichen von Kraft, Ehre oder erhöhter Stellung.
- source_word: קָרֶן
  choice: Horn
  rationale: Das konkrete Bild wird nicht vorschnell durch eine einzelne Deutung wie „Macht“ oder „Ansehen“ ersetzt.
- source_word: וַיִּתֵּן הָאֱלֹהִים לְהֵימָן
  choice: Und Gott gab Heman
  rationale: Die natürliche deutsche Dativkonstruktion gibt die göttliche Zuwendung von Nachkommen vollständig wieder.
- source_word: בָנִים ... וּבָנוֹת
  choice: Söhne ... Töchter
  rationale: Die ausdrückliche Unterscheidung der männlichen und weiblichen Nachkommen bleibt erhalten.
- source_word: כָּל אֵלֶּה
  choice: Alle diese
  rationale: Direkte und im Zusammenhang einer vorausgehenden Aufzählung verständliche Wiedergabe.
theological_decisions:
- issue: Bedeutung von „des Sehers des Königs in den Worten Gottes“
  choice: Heman wird als Seher des Königs mit einem nicht näher bestimmten Bezug zu Gottes Worten beschrieben.
  alternative: „des Sehers des Königs in den Angelegenheiten Gottes“ oder „des Sehers des Königs durch die Worte Gottes“
  rationale: Die hebräische Präposition und die gedrängte Syntax lassen die genaue Beziehung offen. Der Haupttext bewahrt diese Offenheit, während die Fußnote natürliche Deutungsmöglichkeiten nennt.
- issue: Sinn von „das Horn erhöhen“
  choice: Das biblische Hornbild bleibt als Ausdruck von Kraft, Ehre oder erhöhter Stellung stehen.
  alternative: „die Macht erhöhen“ oder „Ehre verleihen“
  rationale: Der Text benennt weder eindeutig den Träger des Horns noch legt er die Metapher auf nur einen abstrakten Sinn fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Seher“ und das Bild vom „Horn“ bewahren die biblische Ausdrucksweise. Die ungewöhnliche Wendung „in den Worten Gottes“ ist absichtlich quellennah gehalten und durch eine Fußnote erläutert.
