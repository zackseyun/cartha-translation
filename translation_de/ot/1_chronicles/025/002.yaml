  variant: modern standard German
source:
  edition: WLC
  text: לִ/בְנֵ֣י אָסָ֗ף זַכּ֧וּר וְ/יוֹסֵ֛ף וּ/נְתַנְיָ֥ה וַ/אֲשַׂרְאֵ֖לָה בְּנֵ֣י אָסָ֑ף עַ֚ל יַד אָסָ֔ף הַ/נִּבָּ֖א עַל יְדֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/002.yaml
  text: 'Of the sons of Asaph: Zaccur[a], Joseph, Nethaniah, and Asharelah, sons of Asaph, under the direction of Asaph, who prophesied under the direction of the king.'
translation:
  language: de
  text: 'Von den Söhnen Asafs: Sakkur, Josef, Netanja und Asarela, die Söhne Asafs, unter der Leitung[a] Asafs, der unter der Leitung des Königs weissagte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand Asafs … durch die Hand des Königs“. Die hebräische Wendung kann Beauftragung, Aufsicht oder Leitung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָסָף
  choice: Von den Söhnen Asafs
  rationale: Das vorangestellte ל leitet im Zusammenhang dieser Aufzählung eine Untergruppe ein. Die Formulierung ist im Deutschen als Überschrift einer Liste natürlich.
- source_word: זַכּוּר וְיוֹסֵף וּנְתַנְיָה וַאֲשַׂרְאֵלָה
  choice: Sakkur, Josef, Netanja und Asarela
  rationale: Die Personennamen werden in für heutige deutsche Leser gut erkennbaren, am Hebräischen orientierten Formen wiedergegeben.
- source_word: בְּנֵי אָסָף
  choice: die Söhne Asafs
  rationale: Die Wiederholung des Hebräischen bleibt erhalten, da sie die Zugehörigkeit der Genannten zu Asafs Gruppe ausdrücklich bestätigt.
- source_word: עַל יַד / עַל יְדֵי
  choice: unter der Leitung
  rationale: Die Wendung bedeutet wörtlich „durch/bei der Hand“, bezeichnet hier aber Aufsicht, Beauftragung oder Weisungsgewalt. „Unter der Leitung“ gibt den administrativen Sinn natürlich wieder und wahrt die Parallelität beider Vorkommen.
- source_word: הַנִּבָּא
  choice: der ... weissagte
  rationale: Das Partizip von נבא bezeichnet Asafs prophetische Tätigkeit. Ein deutscher Relativsatz ist klar und lässt den Zusammenhang mit dem Tempeldienst bestehen, ohne die Tätigkeit auf bloßes Musizieren zu reduzieren.
theological_decisions:
- issue: Bedeutung von נבא im Zusammenhang mit der Tempelmusik
  choice: weissagte
  alternative: machte prophetische Musik; sang prophetisch
  rationale: Der Chronist verwendet ausdrücklich das Verb für prophetisches Reden beziehungsweise Wirken. „Weissagte“ bewahrt diese theologische Aussage und lässt offen, in welcher konkreten musikalisch-liturgischen Form sie geschah.
- issue: Bezug des singularischen Partizips הַנִּבָּא
  choice: 'Bezug auf Asaf: „Asafs, der ... weissagte“'
  alternative: Bezug auf die gesamte Gruppe in sinngemäßer pluralischer Wiedergabe
  rationale: Das maskuline Singularpartizip folgt unmittelbar auf Asaf und bezeichnet ihn am natürlichsten als den Weissagenden.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die listenartige Struktur und die auffällige Wiederholung „Söhne Asafs“ wurden bewahrt; der hebräische Verwaltungsidiom wurde verständlich, aber mit Fußnote transparent wiedergegeben.
