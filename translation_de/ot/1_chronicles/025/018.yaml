lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר
  choice: das zwölfte Los
  rationale: Der Zusammenhang der fortlaufend gezählten Lose verlangt hier eine ordinale Wiedergabe. „Los“ wird aus dem unmittelbar vorausgehenden Listenrahmen ergänzt, damit die hebräische Ellipse im Deutschen verständlich bleibt.
- source_word: עֲזַרְאֵל
  choice: Asarel
  rationale: Der Personenname wird nach im Deutschen üblicher Lautentsprechung umschrieben; hebräisches ז wird dabei mit „s“ wiedergegeben.
- source_word: בָּנָיו
  choice: seinen Söhnen
  rationale: Das hebräische Wort bezeichnet ausdrücklich seine Söhne.
- source_word: וְאֶחָיו
  choice: und seinen Brüdern
  rationale: Die direkte Bedeutung ist „seine Brüder“; eine weitere mögliche Bedeutung wie männliche Verwandte oder Gefährten wird nicht ohne textlichen Zwang eingesetzt.
- source_word: שְׁנֵים עָשָׂר
  choice: insgesamt zwölf
  rationale: Die Schlusszahl nennt die Gesamtstärke der Asarel zugeordneten Gruppe; „insgesamt“ macht diese knappe Listenangabe im Deutschen eindeutig lesbar.
