lexical_decisions:
- source_word: לִשְׁמוֹנָה עָשָׂר
  choice: Das achtzehnte Los fiel auf
  rationale: Die Präposition לְ kennzeichnet in der fortlaufenden Losliste die Zuweisung. »Los« und »fiel auf« sind im Vers nicht ausdrücklich genannt, ergeben sich aber aus dem wiederkehrenden Satzmuster und ermöglichen ein natürliches, verständliches Deutsch.
- source_word: לַחֲנָנִי
  choice: Hanani
  rationale: Der Personenname wird in üblicher deutscher Transliteration wiedergegeben; die Präposition ist syntaktisch in »fiel auf Hanani« aufgenommen.
- source_word: בָּנָיו
  choice: seinen Söhnen
  rationale: Das hebräische בֵּן bezeichnet hier ausdrücklich die Söhne und nicht allgemein Kinder.
- source_word: וְאֶחָיו
  choice: und seinen Brüdern
  rationale: אָח bedeutet im unmittelbaren Sinn »Bruder«. Der familiäre Ausdruck der Listenformel bleibt erhalten.
- source_word: שְׁנֵים עָשָׂר
  choice: waren es zwölf
  rationale: Die Zahl gibt die Gesamtstärke der zu Hanani gehörenden Gruppe aus Söhnen und Brüdern an; die deutsche Formulierung macht diese Zählfunktion deutlich.
