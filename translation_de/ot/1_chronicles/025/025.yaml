  text: Das achtzehnte Los fiel auf Hanani; mit seinen Söhnen und seinen Brüdern waren es zwölf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Für den achtzehnten: Hanani; seine Söhne und seine Brüder, zwölf.« Das Wort »Los« steht hier nicht ausdrücklich, ist aber durch das wiederkehrende Muster des Kapitels vorausgesetzt.'
