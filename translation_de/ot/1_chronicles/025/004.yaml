source:
  edition: WLC
  text: לְ/הֵימָ֑ן בְּנֵ֣י הֵימָ֡ן בֻּקִּיָּ֡הוּ מַתַּנְיָ֡הוּ עֻ֠זִּיאֵל שְׁבוּאֵ֨ל וִֽ/ירִימ֜וֹת חֲנַנְיָ֣ה חֲנָ֗נִי אֱלִיאָ֤תָה גִדַּ֨לְתִּי֙ וְ/רֹמַ֣מְתִּי עֶ֔זֶר יָשְׁבְּקָ֣שָׁה מַלּ֔וֹתִי הוֹתִ֖יר מַחֲזִיאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/004.yaml
  text: 'To Heman: the sons of Heman: Bukkiah[a], Mattaniah, Uzziel, Shebuel, and Jerimoth, Hananiah, Hanani, Eliathah, Giddalti, and Romamti-ezer, Joshbekashah, Mallothi, Hothir[c][b], Mahazioth.'
translation:
  language: de
  text: 'Für Heman: die Söhne Hemans: Bukkija, Mattanja, Usiël, Schebuël und Jerimot, Hananja, Hanani, Eliata, Giddalti und Romamti-Eser[a], Joschbekascha, Malloti, Hotir und Mahasiot.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige verstehen einen Teil dieser Namensfolge, besonders Giddalti und Romamti-Eser, nicht nur als Personennamen, sondern zugleich als eine satzartige Aussage. Im Zusammenhang werden die Formen hier als Namen in einer Liste wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: לְהֵימָן
  choice: Für Heman
  rationale: Das vorangestellte ל kennzeichnet im Zusammenhang die Zuordnung dieser Abteilung zu Heman; „für“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: בְּנֵי הֵימָן
  choice: die Söhne Hemans
  rationale: בְּנֵי bezeichnet hier in einer Namensliste Hemans Söhne beziehungsweise Nachkommen; die knappe Wiedergabe entspricht dem unmittelbaren Kontext.
- source_word: שְׁבוּאֵל
  choice: Schebuël
  rationale: Der Name wird quellennah und nach üblichen deutschen Lautwerten wiedergegeben; das Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: וִירִימוֹת
  choice: und Jerimot
  rationale: Die Form folgt der masoretischen Vokalisierung; das vorangestellte ו wird innerhalb der Aufzählung mit „und“ wiedergegeben.
- source_word: גִדַּלְתִּי
  choice: Giddalti
  rationale: Obwohl die Form auch verbal verstanden werden könnte, weist der unmittelbare Kontext einer Söhneliste auf einen Personennamen.
- source_word: וְרֹמַמְתִּי עֶזֶר
  choice: und Romamti-Eser
  rationale: Im Kontext wird die Folge als zusammengesetzter Personenname verstanden; der Bindestrich macht diese Einheit im Deutschen sichtbar, ohne die mögliche Wortbedeutung zur Hauptübersetzung zu erheben.
theological_decisions:
- issue: Ob ein Teil der Namensfolge zugleich als bedeutungsvoller Satz gelesen werden soll
  choice: Die gesamte Folge wird als Liste von Personennamen wiedergegeben.
  alternative: Einzelne Formen, besonders Giddalti und Romamti-Eser, können verbal beziehungsweise als satzartige Aussage verstanden werden, etwa im Sinn von „Ich habe groß gemacht und Hilfe erhöht“.
  rationale: Der unmittelbare literarische Zusammenhang zählt Hemans Söhne und Sängergruppen auf. Die Namenslesung ist daher syntaktisch und kontextuell am naheliegendsten; die sprachliche Mehrdeutigkeit wird in einer Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die hebräischen Personennamen sind nach im Deutschen geläufigen Laut- und Schreibkonventionen transliteriert; Doppelpunkte und Kommas bewahren den Charakter einer knappen amtlichen Liste.
