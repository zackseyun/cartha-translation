  text: Das dreiundzwanzigste Los fiel auf Machasiot, seine Söhne und seine Brüder, insgesamt zwölf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִשְׁלֹשָׁה וְעֶשְׂרִים
  choice: für den Dreiundzwanzigsten
  rationale: Das vorangestellte ל kennzeichnet in der fortlaufenden Losliste die Zuweisung; die hebräische Zahlform bezeichnet idiomatisch den dreiundzwanzigsten Platz beziehungsweise das dreiundzwanzigste Los.
- source_word: לְמַחֲזִיאוֹת
  choice: Machasiot
  rationale: Der Personenname wird nach deutscher biblischer Transliterationskonvention wiedergegeben; das anlautende ח erscheint als „ch“, die Endung als „-ot“.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Das hebräische Wort bezeichnet hier ausdrücklich seine männlichen Nachkommen und wird daher geschlechtsgenau übersetzt.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: Im Kontext der eingeteilten Musikergruppen ist „Brüder“ die direkte und natürliche Wiedergabe; eine weitere Bedeutung wie „Verwandte“ ist nicht erforderlich.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Die Kardinalzahl nennt die Gesamtstärke der zugewiesenen Gruppe.
