translation:
  language: de
  text: 'Für den Einundzwanzigsten: Hothir; seine Söhne und seine Brüder: zwölf.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Für einen und zwanzig, für Hothir; seine Söhne und seine Brüder, zwölf.“ Die knappe hebräische Form setzt die in diesem Kapitel beschriebene Reihenfolge der Lose voraus.'
    reason: Die Fußnote erläutert die elliptische Zuteilungsform und die kontextuell verstandene Losreihenfolge, ohne „Los“ oder ein Verb im Haupttext hinzuzufügen.
lexical_decisions:
- source_word: לְאֶחָד וְעֶשְׂרִים
  choice: Das einundzwanzigste Los
  rationale: Die Wendung bezeichnet innerhalb der fortlaufenden Liste die Zuteilung des einundzwanzigsten Loses. „Los“ steht nicht ausdrücklich in diesem Vers, ist aber durch 1. Chronik 25,8–9 und die parallele Form der Liste eindeutig mitgedacht; im Deutschen ergibt die Ergänzung einen natürlichen und klaren Satz.
- source_word: לְהוֹתִיר
  choice: fiel auf Hotir
  rationale: Die Präposition לְ kennzeichnet den Empfänger der Zuteilung. „fiel auf“ gibt den Losvorgang idiomatisch wieder; הוֹתִיר wird als Personenname „Hotir“ transkribiert.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: בנים bezeichnet hier in der Personal- und Dienstgruppenliste ausdrücklich die Söhne.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: אחים wird mit dem unmittelbaren Verwandtschaftsausdruck „Brüder“ wiedergegeben; eine mögliche weitere Bedeutung wie Verwandte oder Gefährten wird nicht ohne zwingenden Kontext eingesetzt.
- source_word: שְׁנֵים עָשָׂר
  choice: waren zusammen zwölf
  rationale: Die Zahl nennt die Gesamtstärke der aus Hotirs Söhnen und Brüdern bestehenden Gruppe. „zusammen“ macht diese Funktion im Deutschen deutlich, ohne zusätzliche Personen in die Zählung einzubeziehen.
