  variant: modern standard German
source:
  edition: WLC
  text: לִ/ידוּת֑וּן בְּנֵ֣י יְדוּת֡וּן גְּדַלְיָ֡הוּ וּ/צְרִ֡י וִֽ֠/ישַׁעְיָהוּ חֲשַׁבְיָ֨הוּ וּ/מַתִּתְיָ֜הוּ שִׁשָּׁ֗ה עַל֩ יְדֵ֨י אֲבִי/הֶ֤ם יְדוּתוּן֙ בַּ/כִּנּ֔וֹר הַ/נִּבָּ֕א עַל הֹד֥וֹת וְ/הַלֵּ֖ל לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/003.yaml
  text: 'Of Jeduthun: the sons of Jeduthun—Gedaliah, Zeri, Jeshaiah, Hashabiah, and Mattithiah, six—under the direction of their father Jeduthun, who prophesied with the lyre in giving thanks and praise to Yahweh.'
translation:
  language: de
  text: 'Von Jedutun: die Söhne Jedutuns: Gedalja, Zeri, Jeschaja, Haschabja und Mattitja – sechs[a] – unter der Leitung ihres Vaters Jedutun, der mit der Leier weissagte, indem er Jahwe dankte und ihn lobte.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text nennt hier fünf Namen, sagt anschließend aber „sechs“. Möglicherweise ist ein weiterer Sohn in der Liste ausgefallen, oder Jedutun selbst wird mitgezählt.
    reason: textual_variant
  - marker: b
    text: 'Oder: „der mit der Leier weissagte, um Jahwe zu danken und ihn zu loben.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִידוּתוּן
  choice: Von Jedutun
  rationale: Das vorangestellte ל leitet in der Aufzählung die Jedutun zugeordnete Gruppe ein; „Von Jedutun“ bewahrt den knappen Katalogstil.
- source_word: בְּנֵי יְדוּתוּן
  choice: die Söhne Jedutuns
  rationale: Die formale Verwandtschaftsbezeichnung bleibt erhalten; im Zusammenhang kann sie auch Angehörige seiner Familie beziehungsweise seines Hauses umfassen.
- source_word: גְּדַלְיָהוּ וּצְרִי וִישַׁעְיָהוּ חֲשַׁבְיָהוּ וּמַתִּתְיָהוּ
  choice: Gedalja, Zeri, Jeschaja, Haschabja und Mattitja
  rationale: Die Personennamen werden nach geläufigen deutschen Transliterationskonventionen wiedergegeben.
- source_word: שִׁשָּׁה
  choice: sechs
  rationale: Der masoretische Text nennt ausdrücklich die Zahl sechs, obwohl in der erhaltenen Namensliste nur fünf Namen stehen; diese Spannung wird nicht harmonisiert.
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: unter der Leitung ihres Vaters
  rationale: Die Wendung bedeutet wörtlich „durch/unter den Händen ihres Vaters“, bezeichnet hier aber seine Aufsicht und musikalische Leitung.
- source_word: בַּכִּנּוֹר
  choice: mit der Leier
  rationale: כִּנּוֹר bezeichnet am ehesten eine Leier; „mit“ gibt den instrumentalen Gebrauch natürlich wieder.
- source_word: הַנִּבָּא
  choice: der ... weissagte
  rationale: Die prophetische Terminologie des Chronisten wird auch im musikalischen Zusammenhang ausdrücklich bewahrt und nicht auf bloßes Musizieren reduziert.
- source_word: עַל הֹדוֹת וְהַלֵּל
  choice: indem er ... dankte und ... lobte
  rationale: Die Formulierung gibt die musikalisch-prophetische Tätigkeit als Danken und Loben wieder; die Präposition עַל lässt zugleich eine Zweck- oder Inhaltsdeutung zu, die in der Fußnote genannt wird.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Eigenname יהוה wird als „Jahwe“ wiedergegeben, eine im modernen Deutschen verständliche Form des Gottesnamens.
theological_decisions:
- issue: Bedeutung des musikalischen Weissagens im Tempeldienst
  choice: „weissagte“ im Haupttext beibehalten
  alternative: „trug geistgewirkte Musik vor“ oder „sang prophetisch“
  rationale: Der Chronist verwendet ausdrücklich das Verb נבא. Die Wiedergabe „weissagte“ erhält die theologische Spannung zwischen Prophetie, Musik, Dank und Lob, ohne die Tätigkeit enger zu bestimmen.
- issue: Bezug von הַנִּבָּא
  choice: Bezug auf den unmittelbar vorausgehenden Vater Jedutun
  alternative: Bezug auf die gesamte Gruppe im Sinne gemeinsamen prophetischen Musizierens
  rationale: Das Partizip steht im maskulinen Singular und schließt grammatisch unmittelbar an Jedutun an; daher wird Jedutun als Subjekt wiedergegeben.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Stil mit knapper Listenstruktur. Die Gedankenstriche machen die im Hebräischen auffällige Zahlenangabe sichtbar; „weissagte“ erhält bewusst die prophetische Begrifflichkeit des Ausgangstextes.
