  language: de
  text: Das dritte Los fiel auf Sakkur und seine Söhne und Brüder, insgesamt zwölf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Der dritte: Sakkur, seine Söhne und seine Brüder, zwölf.« Das Wort »Los« wird im Hebräischen in diesem Vers nicht wiederholt, ist aber aus dem Zusammenhang zu ergänzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁלִשִׁי
  choice: Der dritte
  rationale: Der bestimmte Ordinal fungiert im Zusammenhang als Glied der fortlaufenden Los- beziehungsweise Abteilungsliste. Die knappe Wiedergabe bewahrt, dass das Substantiv »Los« im Hebräischen nicht wiederholt wird.
- source_word: זַכּוּר
  choice: Sakkur
  rationale: Der Personenname wird nach üblicher deutscher Bibelnamen-Transliteration wiedergegeben.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Der maskuline Plural von בֵּן mit Suffix der 3. Person Singular bezeichnet ausdrücklich seine Söhne.
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: אֶחָיו bedeutet hier im wiederkehrenden Kontext der Musikerabteilungen am unmittelbarsten »seine Brüder«; die allgemeinere Wiedergabe »Verwandten« ist nicht erforderlich.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Die Kardinalzahl nennt die Gesamtzahl der Gruppe. Wie im verblosen hebräischen Listenstil kann sie knapp nachgestellt werden.
