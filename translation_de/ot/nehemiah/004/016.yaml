  timestamp: '2026-07-15T16:20:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird getroffen: Nehemia ordnet an, dass jeweils ein Mann und sein נער in Jerusalem übernachten und nachts Wachdienst, tagsüber Arbeit leisten sollen. Die Formulierung „Sie sollen uns ... dienen“ macht jedoch die zweite Hälfte unnötig allgemein und lässt „für die Arbeit dienen“ im Deutschen unidiomatisch erscheinen. Die vorgeschlagene Fassung gibt die beiden Aufgaben unmittelbar und ohne Sinnverlust wieder.'
  naturalness: „Jeder soll mit seinem Diener“ ist verständlich, bildet aber die hebräische Paarung „ein Mann und sein Diener“ weniger deutlich ab. „Jeder Mann und sein Diener sollen“ ist idiomatisch und verdeutlicht, dass beide Personen der Anordnung unterstehen. „Nachts für uns Wache halten und tagsüber arbeiten“ ist modernes, natürliches Standarddeutsch.
  terminology: „Diener“ ist für נַעַר im vorliegenden Arbeits- und Wachkontext eine vertretbare, nicht überpräzisierende Wiedergabe. „Wache halten“ trifft מִשְׁמָר als Wach-/Schutzdienst; „arbeiten“ gibt מְלָאכָה angemessen wieder.
  issues:
  - severity: medium
    issue: „Sie sollen uns nachts als Wache und tagsüber für die Arbeit dienen“ ist im Deutschen semantisch und stilistisch uneinheitlich.
    rationale: Die Konstruktion „für die Arbeit dienen“ ist keine natürliche Entsprechung von מְלָאכָה und verwischt die Aussage, dass dieselben Personen am Tag arbeiten sollen. Die hebräische knappe Prädikatskonstruktion kann im Deutschen klar als zwei Tätigkeiten ausgedrückt werden.
  - severity: low
    issue: Die Fußnote erläutert eine mögliche Lesart, die die revidierte deutsche Formulierung bereits angemessen und ohne wesentlichen Verlust ausdrückt.
    rationale: Die Mehrdeutigkeit betrifft vor allem die knappe hebräische Nominalsyntax, nicht eine textkritisch strittige oder theologisch relevante Frage. Eine Fußnote ist für die klare deutsche Wiedergabe nicht erforderlich.
  revised_text: 'Auch zu jener Zeit sagte ich zum Volk: »Jeder Mann und sein Diener sollen innerhalb Jerusalems übernachten; nachts sollen sie für uns Wache halten und tagsüber arbeiten.«'
