base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/016.yaml
  text: Also at that time I said to the people[a], “Let each man and his servant spend the night within Jerusalem[b], and let them be a guard for us by night and workers by day.”
translation:
  language: de
  text: 'Auch zu jener Zeit sagte ich zum Volk: »Jeder Mann und sein Diener sollen innerhalb Jerusalems übernachten; nachts sollen sie für uns Wache halten und tagsüber arbeiten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם בָּעֵת הַהִיא
  choice: Auch zu jener Zeit
  rationale: Bewahrt die additive Verknüpfung durch גַּם und gibt die geläufige Zeitangabe natürlich und würdig wieder.
- source_word: אִישׁ וְנַעֲרוֹ
  choice: Jeder soll mit seinem Diener
  rationale: אִישׁ ist hier distributiv zu verstehen. נַעַר kann einen jungen Mann, Diener oder Gehilfen bezeichnen; im Arbeits- und Wachkontext ist „Diener“ passend, ohne ein im Kontext nicht sicheres jugendliches Alter festzulegen.
- source_word: יָלִינוּ בְּתוֹךְ יְרוּשָׁלִָם
  choice: innerhalb Jerusalems übernachten
  rationale: „Übernachten“ gibt לין klar wieder; „innerhalb Jerusalems“ bewahrt den räumlichen Nachdruck von בְּתוֹךְ.
- source_word: הַלַּיְלָה מִשְׁמָר
  choice: nachts als Wache
  rationale: מִשְׁמָר bezeichnet hier die Wach- beziehungsweise Schutzfunktion während der Nacht.
- source_word: וְהַיּוֹם מְלָאכָה
  choice: tagsüber für die Arbeit
  rationale: Die nominale Parallelkonstruktion wird im Deutschen idiomatisch wiedergegeben, ohne מְלָאכָה zu personalisieren; gemeint ist ihre Verwendung zur Arbeit am Tag.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die direkte Rede bleibt knapp und anweisend. Die lexikalische Mehrdeutigkeit von נַעַר und die ungewöhnliche Nacht-Tag-Parallelkonstruktion werden nicht überdehnt; Letztere wird durch eine Fußnote transparent gemacht.
