revisions:
- from: 'Auch zu jener Zeit sagte ich zum Volk: »Jeder soll mit seinem Diener innerhalb Jerusalems übernachten. Sie sollen uns nachts als Wache und tagsüber für die Arbeit dienen.«[a]'
  to: 'Auch zu jener Zeit sagte ich zum Volk: »Jeder Mann und sein Diener sollen innerhalb Jerusalems übernachten; nachts sollen sie für uns Wache halten und tagsüber arbeiten.«'
  rationale: Die Revision stellt die Paarung „Mann und sein Diener“ deutlicher heraus und gibt die Nacht-Tag-Parallelität als im Deutschen natürliche Tätigkeitsangaben wieder. Sie vermeidet die unidiomatische Wendung „für die Arbeit dienen“, ohne die Funktion der Personen oder die Aussage des hebräischen Textes zu verändern.
