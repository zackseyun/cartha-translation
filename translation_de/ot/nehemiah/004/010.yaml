  text: וַ/יְהִ֣י מִן הַ/יּ֣וֹם הַ/ה֗וּא חֲצִ֣י נְעָרַ/י֮ עֹשִׂ֣ים בַּ/מְּלָאכָה֒ וְ/חֶצְיָ֗/ם מַחֲזִיקִים֙ וְ/הָ/רְמָחִ֣ים הַ/מָּגִנִּ֔ים וְ/הַ/קְּשָׁת֖וֹת וְ/הַ/שִּׁרְיֹנִ֑ים וְ/הַ֨/שָּׂרִ֔ים אַחֲרֵ֖י כָּל בֵּ֥ית יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/010.yaml
  text: And from that day on[a], half of my young men were doing the work, and half of them were holding the spears, the shields, the bows, and the armor[c][b]; and the officers were behind all the house of Judah.
translation:
  language: de
  text: Von diesem Tag an arbeitete die Hälfte meiner jungen Männer[a] am Bau, während die andere Hälfte Speere, Schilde, Bogen und Rüstungen[b] bereithielt. Die Oberen befanden sich hinter dem ganzen Haus Juda.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meiner Diener“ beziehungsweise „meiner Gefolgsleute“. Das hebräische Wort kann je nach Zusammenhang junge Männer, Diener oder persönliche Gefolgsleute bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet Körperschutz, möglicherweise Panzerhemden oder Brustpanzer.
    reason: lexical_alternative
  - marker: c
    text: Dass sich die Oberen „hinter“ dem Haus Juda befanden, kann auf eine Position zur Unterstützung, Sicherung oder Aufsicht hinweisen.
    reason: cultural_note
lexical_decisions:
- source_word: נְעָרַי
  choice: meine jungen Männer
  rationale: Der Ausdruck kann junge Männer, Diener oder Gefolgsleute bezeichnen. „Meine jungen Männer“ wahrt den Grundsinn und passt zu Nehemias bewaffneter Mannschaft, ohne ein häusliches Dienstverhältnis nahezulegen.
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: arbeitete … am Bau
  rationale: Die Wendung bezeichnet die aktive Beteiligung an der hier konkret gemeinten Bauarbeit; die deutsche Formulierung ist knapp und kontextgerecht.
- source_word: מַחֲזִיקִים
  choice: bereithielt
  rationale: Das Partizip bezeichnet hier das Halten beziehungsweise Bereithalten der aufgezählten Waffen und Rüstungen. „Bereithielt“ gibt ihre Einsatzbereitschaft natürlich wieder.
- source_word: הָרְמָחִים הַמָּגִנִּים וְהַקְּשָׁתוֹת וְהַשִּׁרְיֹנִים
  choice: Speere, Schilde, Bogen und Rüstungen
  rationale: Die militärische Aufzählung wird unmittelbar und in geläufigem modernem Deutsch wiedergegeben. „Rüstungen“ bleibt hinsichtlich der genauen Art des Körperschutzes angemessen offen.
- source_word: הַשָּׂרִים
  choice: die führenden Männer
  rationale: שַׂר kann je nach Kontext einen Oberen, Amtsträger oder Befehlshaber bezeichnen. „Führende Männer“ wahrt diese funktionale Breite, ohne einen spezifischen militärischen Rang einzutragen.
- source_word: אַחֲרֵי כָּל בֵּית יְהוּדָה
  choice: hinter dem ganzen Haus Juda
  rationale: „Hinter“ bewahrt die räumliche Aussage von אַחֲרֵי; „Haus Juda“ erhält die korporative hebräische Bezeichnung, statt sie vorschnell als bloße Volksbezeichnung aufzulösen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzfluss bildet die Arbeitsteilung klar ab. Die ungewöhnliche korporative Wendung „Haus Juda“ und die räumliche Mehrdeutigkeit von „hinter“ bleiben erhalten; nicht ausdrücklich vorhandenes „standen“ wird nicht ergänzt.
