  text: וַ/יֹּאמְר֣וּ צָרֵ֗י/נוּ לֹ֤א יֵדְעוּ֙ וְ/לֹ֣א יִרְא֔וּ עַ֛ד אֲשֶׁר נָב֥וֹא אֶל תּוֹכָ֖/ם וַ/הֲרַגְנ֑וּ/ם וְ/הִשְׁבַּ֖תְנוּ אֶת הַ/מְּלָאכָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/005.yaml
  text: And our adversaries said[a], “They will not know, and they will not see, until we come into their midst and kill them and stop the work.”
translation:
  language: de
  text: 'Und unsere Gegner sagten: „Sie werden nichts wissen und nichts sehen, bis wir mitten unter sie[a] kommen, sie töten und die Arbeit zum Stillstand bringen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ihre Mitte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרֵינוּ
  choice: unsere Gegner
  rationale: צַר bezeichnet hier feindlich gesinnte Widersacher. „Gegner“ ist im modernen Deutschen natürlich und gibt den feindlichen Zusammenhang wieder, ohne ihn unnötig zu verstärken.
- source_word: יֵדְעוּ
  choice: sie werden nichts wissen
  rationale: יָדַע bezeichnet hier Wissen beziehungsweise Kenntnis von dem bevorstehenden Angriff. Die wörtliche Wiedergabe bewahrt die Parallelität mit „sehen“.
- source_word: יִרְאוּ
  choice: sie werden nichts sehen
  rationale: רָאָה bedeutet wörtlich „sehen“. Diese Wiedergabe erhält die anschauliche Parallelformulierung des Hebräischen; im Zusammenhang ist das Bemerken der Angreifer gemeint.
- source_word: עַד אֲשֶׁר
  choice: bis
  rationale: 'Die Verbindung bezeichnet die zeitliche Grenze ihrer Unkenntnis: Sie sollen den Angriff erst beim Eindringen der Gegner bemerken.'
- source_word: נָבוֹא
  choice: wir kommen
  rationale: בּוֹא kann „kommen“, „gelangen“ oder „eintreten“ bedeuten. „Kommen“ ist direkt, natürlich und passt zur folgenden Richtungsangabe.
- source_word: אֶל תּוֹכָם
  choice: mitten unter sie
  rationale: תּוֹךְ bezeichnet die Mitte beziehungsweise das Innere. „Mitten unter sie“ gibt sowohl die räumliche Bewegung als auch das überraschende Eindringen wieder.
- source_word: וַהֲרַגְנוּם
  choice: sie töten
  rationale: הָרַג ist das gewöhnliche Verb für „töten“. Die knappe Formulierung entspricht der unverhüllten Drohung des Ausgangstextes.
- source_word: וְהִשְׁבַּתְנוּ
  choice: zum Stillstand bringen
  rationale: Der Hifil von שׁבת bedeutet, etwas aufhören zu lassen. „Zum Stillstand bringen“ macht den verursachenden Sinn deutlich und ist in Verbindung mit der Arbeit idiomatisch.
- source_word: הַמְּלָאכָה
  choice: die Arbeit
  rationale: מְלָאכָה bezeichnet in diesem Zusammenhang die Arbeiten am Wiederaufbau. „Die Arbeit“ ist klar und bewahrt die allgemeine Ausdrucksweise des Hebräischen.
