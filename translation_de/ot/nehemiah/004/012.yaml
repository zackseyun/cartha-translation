  - severity: low
    issue: „Signalhorn“
    rationale: Die Wiedergabe erklärt zwar die Funktion, ersetzt aber die im Grundtext genannte spezifische Bezeichnung שופר. Die Übernahme „Schofar“ mit Erläuterung in der Fußnote ist genauer.
