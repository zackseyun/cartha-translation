base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/012.yaml
  text: And the builders each had his sword strapped at his side while they built[a], and the one blowing the trumpet was beside me.
translation:
  language: de
  text: Die Bauleute bauten, jeder mit seinem Schwert an die Hüfte gegürtet. Derjenige, der das Schofar[a] blies, stand neben mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Schofar ist ein als Signalinstrument verwendetes Tierhorn.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים / וּבוֹנִים
  choice: Die Bauleute bauten weiter
  rationale: Das Partizip von בנה bezeichnet zunächst substantivisch die Bauleute und dann ihre fortgesetzte Tätigkeit. Die deutsche Formulierung gibt die Wiederholung der Wurzel natürlich wieder.
- source_word: אִישׁ
  choice: jeder
  rationale: אִישׁ wird hier distributiv gebraucht und bezieht sich auf jeden Einzelnen unter den Bauleuten.
- source_word: חַרְבּוֹ אֲסוּרִים
  choice: mit seinem Schwert … geschnallt
  rationale: חרב bezeichnet das Schwert; das passive Partizip von אסר beschreibt, dass es befestigt beziehungsweise umgeschnallt war.
- source_word: עַל מָתְנָיו
  choice: um die Hüften
  rationale: Die Wendung bezeichnet wörtlich den Bereich der Hüften beziehungsweise der Taille und beschreibt, wo das Schwert getragen wurde.
- source_word: וְהַתּוֹקֵעַ בַּשּׁוֹפָר
  choice: der Mann, der das Signalhorn blies
  rationale: Das Partizip von תקע bezeichnet denjenigen, der das שופר ertönen lässt. „Signalhorn“ macht in diesem militärischen Zusammenhang die Funktion des Instruments verständlich; die genaue hebräische Bezeichnung wird in der Fußnote genannt.
- source_word: אֶצְלִי
  choice: stand neben mir
  rationale: אצל mit Suffix bezeichnet unmittelbare Nähe. Das ergänzte „stand“ ergibt im Deutschen einen natürlichen vollständigen Satz, ohne den Sinn festzulegen.
