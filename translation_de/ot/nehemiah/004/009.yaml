  text: וַ/יְהִ֞י כַּֽ/אֲשֶׁר שָׁמְע֤וּ אוֹיְבֵ֨י/נוּ֙ כִּי נ֣וֹדַֽע לָ֔/נוּ וַ/יָּ֥פֶר הָ/אֱלֹהִ֖ים אֶת עֲצָתָ֑/ם ו/נשוב כֻּלָּ֨/נוּ֙ אֶל הַ֣/חוֹמָ֔ה אִ֖ישׁ אֶל מְלַאכְתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/009.yaml
  text: And it happened that when our enemies heard that it had become known to us[a], and that God had frustrated their plan, we all returned to the wall[c][b], each man to his work.
translation:
  language: de
  text: Als unsere Feinde hörten, dass es uns bekannt geworden war[a] und Gott ihren Plan vereitelt hatte[b], kehrten wir alle zur Mauer zurück, jeder an seine Arbeit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische lässt den Gegenstand des Bekanntwerdens unausgedrückt; im Zusammenhang ist wohl der Plan der Feinde gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihren Ratschluss durchkreuzt hatte“.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: „jeder zu seiner Arbeit“, eine verteilende Ausdrucksweise für die einzelnen Arbeiter.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als
  rationale: Die Verbindung leitet den Zeitpunkt der folgenden Handlung ein. Im Deutschen gibt ein schlichter temporaler Nebensatz den hebräischen Erzählfluss natürlicher wieder als „Und es geschah, als“.
- source_word: אוֹיְבֵינוּ
  choice: unsere Feinde
  rationale: Direkte und kontextgemäße Wiedergabe des Substantivs mit Suffix der 1. Person Plural.
- source_word: כִּי נוֹדַע לָנוּ
  choice: dass ihr Vorhaben uns bekannt geworden war
  rationale: Das Nifal von ידע bezeichnet hier das Bekanntwerden. Das im Hebräischen unausgedrückte Bezugsobjekt wird aus dem Zusammenhang als Vorhaben der Feinde ergänzt, damit der deutsche Satz verständlich bleibt; die Fußnote weist darauf hin.
- source_word: וַיָּפֶר
  choice: vereitelt hatte
  rationale: הפר bedeutet in Verbindung mit עצה, einen Plan unwirksam zu machen oder zu durchkreuzen. Das Plusquamperfekt verdeutlicht die vor dem Hören liegende Handlung.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Der bestimmte Ausdruck bezeichnet im Kontext den Gott Israels; im Deutschen steht „Gott“ hier ohne Artikel.
- source_word: עֲצָתָם
  choice: ihren Plan
  rationale: עצה kann Rat, Plan oder Vorhaben bedeuten. „Plan“ ist im militärischen Zusammenhang klar und fügt keine zusätzliche abwertende Färbung hinzu.
- source_word: וְנָשׁוּב כֻּלָּנוּ
  choice: kehrten wir alle ... zurück
  rationale: שוב bezeichnet die Rückkehr; כֻּלָּנוּ betont, dass die gesamte Gruppe wieder an die Arbeit ging.
- source_word: הַחוֹמָה
  choice: zur Mauer
  rationale: Gemeint ist die im Kontext wiederaufgebaute Stadtmauer Jerusalems.
- source_word: אִישׁ אֶל מְלַאכְתּוֹ
  choice: jeder an seine Arbeit
  rationale: Die hebräische Wendung ist distributiv. „Jeder an seine Arbeit“ ist im Deutschen natürlich und bewahrt die individuelle Zuordnung, ohne das grammatisch maskuline אִישׁ unnötig mit „Mann“ hervorzuheben.
theological_decisions:
- issue: Gottes Wirken beim Scheitern des feindlichen Plans
  choice: Gott ihren Plan vereitelt hatte
  alternative: Der Plan war durch die Umstände gescheitert
  rationale: Der hebräische Text schreibt die Vereitelung ausdrücklich Gott als handelndem Subjekt zu. Diese direkte theologische Aussage wird nicht abgeschwächt.
- issue: Bezugsgröße von כִּי נוֹדַע לָנוּ
  choice: dass ihr Vorhaben uns bekannt geworden war
  alternative: dass es uns bekannt geworden war
  rationale: Das Hebräische lässt das Subjekt beziehungsweise den Gegenstand des Bekanntwerdens unausgedrückt. Der Zusammenhang legt das Vorhaben der Feinde nahe; die Ergänzung dient der natürlichen deutschen Verständlichkeit, während die Fußnote die formale Offenheit des Ausgangstextes bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der formelhafte hebräische Erzähleingang וַיְהִי כַּאֲשֶׁר wird zugunsten eines natürlichen deutschen Temporalsatzes knapp wiedergegeben. Die Syntax bleibt klar, die ausdrückliche Zuschreibung des Geschehens an Gott erhalten.
