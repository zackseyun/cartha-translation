translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung der Gegner bleibt vollständig erhalten. „Wiederherstellung ... vorankam“ vermittelt das hebräische Heilungsbild und die Fortschrittsangabe verständlich; die Fußnoten dokumentieren die wörtlichere Metapher und die mögliche Bandbreite von הַפְּרֻצִים.
