  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר שָׁמַ֣ע סַנְבַלַּ֡ט וְ֠/טוֹבִיָּה וְ/הָ/עַרְבִ֨ים וְ/הָ/עַמֹּנִ֜ים וְ/הָ/אַשְׁדּוֹדִ֗ים כִּֽי עָלְתָ֤ה אֲרוּכָה֙ לְ/חֹמ֣וֹת יְרוּשָׁלִַ֔ם כִּי הֵחֵ֥לּוּ הַ/פְּרֻצִ֖ים לְ/הִסָּתֵ֑ם וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/001.yaml
  text: When Sanballat and Tobiah and the Arabs and the Ammonites and the Ashdodites heard that the repair of Jerusalem’s walls had gone up[a], that the breaches had begun to be closed[b], they became very angry.
translation:
  language: de
  text: Als Sanballat, Tobija, die Araber, die Ammoniter und die Aschdoditer hörten, dass die Wiederherstellung der Mauern Jerusalems vorankam[a] und die Breschen geschlossen zu werden begannen[b], wurden sie sehr zornig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass die Ausbesserung der Mauern Jerusalems Fortschritte machte“. Das hebräische Wort kann „Heilung“ oder „Wiederherstellung“ bedeuten und wird hier bildlich für die Instandsetzung der Mauern verwendet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Lücken“ beziehungsweise „die Einbruchstellen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: Als
  rationale: Die erzählerische Wendung leitet einen zeitlichen Nebensatz und eine neue Szene ein. „Als“ gibt dies im modernen Deutschen natürlich wieder, ohne ein im Hebräischen nicht eigens ausgedrücktes „nun“ hinzuzufügen.
- source_word: שָׁמַע
  choice: hörten
  rationale: Die Grundbedeutung ist hören beziehungsweise eine Nachricht vernehmen; „hörten“ ist hier direkt und idiomatisch.
- source_word: סַנְבַלַּט וְטוֹבִיָּה
  choice: Sanballat, Tobija
  rationale: Die Personennamen werden nach gängigen deutschen Bibelkonventionen wiedergegeben.
- source_word: הָעַרְבִים
  choice: die Araber
  rationale: Die zeitgemäße und verständliche deutsche Volksbezeichnung entspricht dem hebräischen Gentiliz.
- source_word: הָעַמֹּנִים
  choice: die Ammoniter
  rationale: Dies ist die geläufige deutsche Bezeichnung für die Angehörigen Ammons.
- source_word: הָאַשְׁדּוֹדִים
  choice: die Aschdoditer
  rationale: Das Gentiliz wird knapp und entsprechend dem Ortsnamen Aschdod wiedergegeben.
- source_word: עָלְתָה אֲרוּכָה
  choice: die Wiederherstellung ... vorankam
  rationale: אֲרוּכָה bezeichnet sonst Heilung oder Wiederherstellung und wird hier bildlich auf die Mauern bezogen; עָלְתָה drückt das Fortschreiten aus. Die Formulierung bewahrt beides in natürlichem Deutsch.
- source_word: לְחֹמוֹת יְרוּשָׁלִַם
  choice: der Mauern Jerusalems
  rationale: Der hebräische Relationsausdruck wird als idiomatisches deutsches Genitivattribut formuliert.
- source_word: כִּי ... כִּי
  choice: dass ... und
  rationale: Das erste כִּי leitet den Inhalt des Gehörten ein. Das zweite erläutert eng damit verbunden den sichtbaren Fortschritt; „und“ verbindet die beiden Sachverhalte im Deutschen klar, ohne einen zusätzlichen Grundsinn festzulegen.
- source_word: הֵחֵלּוּ
  choice: man begonnen hatte
  rationale: Das ungenannte, aus dem Zusammenhang erschließbare Subjekt wird mit unpersönlichem „man“ wiedergegeben; das Plusquamperfekt ordnet den Beginn vor dem Hören ein.
- source_word: הַפְּרֻצִים
  choice: die Breschen
  rationale: Gemeint sind Einbrüche oder offene Schadstellen in einer Befestigungsmauer; „Breschen“ ist dafür präzise.
- source_word: לְהִסָּתֵם
  choice: zu schließen
  rationale: Der Nifal-Infinitiv bezeichnet das Verschlossenwerden der Maueröffnungen. Mit dem unpersönlichen „man“ ist die aktive deutsche Form idiomatisch und sachlich gleichwertig.
- source_word: וַיִּחַר לָהֶם מְאֹד
  choice: wurden sie sehr zornig
  rationale: Die hebräische Wendung bezeichnet heftigen Zorn. „Wurden sie sehr zornig“ wahrt den Eintritt des Gemütszustands und den Intensivierer.
