  text: וָ/אֹמַ֞ר אֶל הַ/חֹרִ֤ים וְ/אֶל הַ/סְּגָנִים֙ וְ/אֶל יֶ֣תֶר הָ/עָ֔ם הַ/מְּלָאכָ֥ה הַרְבֵּ֖ה וּ/רְחָבָ֑ה וַ/אֲנַ֗חְנוּ נִפְרָדִים֙ עַל הַ֣/חוֹמָ֔ה רְחוֹקִ֖ים אִ֥ישׁ מֵ/אָחִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/013.yaml
  text: And I said to the nobles[a], to the officials, and to the rest of the people, “The work is great and spread out, and we are separated along the wall, far from one another.”
translation:
  language: de
  text: 'Und ich sagte zu den Vornehmen, den Amtsträgern und dem übrigen Volk: »Die Arbeit ist groß und weitläufig, und wir sind auf der Mauer weit voneinander[a] entfernt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »jeder von seinem Bruder«; eine hebräische Ausdrucksweise für »voneinander«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: die Vornehmen
  rationale: Der Ausdruck bezeichnet in Nehemia die gesellschaftlich führenden Männer beziehungsweise die Oberschicht; »die Vornehmen« ist im Deutschen natürlich und kontextgerecht.
- source_word: הַסְּגָנִים
  choice: die Amtsträger
  rationale: Das Wort bezeichnet nachgeordnete politische oder administrative Führungspersonen; »Amtsträger« wahrt diese Breite, ohne einen bestimmten Rang festzulegen.
- source_word: יֶתֶר הָעָם
  choice: das übrige Volk
  rationale: Dies gibt die Gruppe außerhalb der zuvor genannten Führungspersonen knapp und idiomatisch wieder.
- source_word: הַמְּלָאכָה
  choice: die Arbeit
  rationale: Gemeint ist die Arbeit am Wiederaufbau der Mauer; die allgemeine Bezeichnung entspricht dem Kontext.
- source_word: הַרְבֵּה
  choice: umfangreich
  rationale: Das prädikativ gebrauchte Wort beschreibt hier den großen Umfang der Aufgabe, nicht ihre Qualität.
- source_word: וּרְחָבָה
  choice: weit ausgedehnt
  rationale: Die Grundbedeutung »breit/weit« beschreibt im Zusammenhang die räumliche Ausdehnung der Bauarbeit über einen großen Bereich.
- source_word: נִפְרָדִים
  choice: voneinander entfernt
  rationale: Das Partizip beschreibt die räumliche Trennung der Arbeiter; zusammen mit רְחוֹקִים lässt sich dies im Deutschen natürlich als »weit voneinander entfernt« ausdrücken.
- source_word: עַל הַחוֹמָה
  choice: auf der Mauer
  rationale: Die direkte örtliche Bedeutung von עַל wird bewahrt; der Kontext macht zugleich deutlich, dass die Personen über die Mauer verteilt sind.
- source_word: רְחוֹקִים
  choice: weit
  rationale: Das Adjektiv bezeichnet den großen räumlichen Abstand zwischen den Arbeitsgruppen.
- source_word: אִישׁ מֵאָחִיו
  choice: voneinander
  rationale: Wörtlich »jeder von seinem Bruder«; die hebräische Wendung drückt hier ein wechselseitiges Verhältnis aus und wird im Deutschen idiomatisch mit »voneinander« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die räumliche Breite der Arbeit und der Abstand zwischen den Arbeitsgruppen werden klar wiedergegeben; das einleitende וַ wird als fortlaufendes »Und« erhalten.
