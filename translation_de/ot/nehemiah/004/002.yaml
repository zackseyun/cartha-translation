base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/002.yaml
  text: And all of them conspired together to come and fight against Jerusalem and to cause confusion in it[a].
translation:
  language: de
  text: Da verschworen sie sich alle miteinander, gegen Jerusalem zu ziehen und zu kämpfen und dort Verwirrung zu stiften.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dort Unruhe zu verursachen“ beziehungsweise „dort ein Durcheinander anzurichten“. Das hebräische Wort kann Verwirrung, Störung oder Unordnung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: verschworen sie sich
  rationale: Das Qal von קשר bezeichnet hier einen feindlich ausgerichteten Zusammenschluss beziehungsweise eine Verschwörung; die reflexive deutsche Wendung gibt dies prägnant wieder.
- source_word: כֻלָּם יַחְדָּו
  choice: sie sich alle miteinander
  rationale: „Alle“ bewahrt die ausdrücklich bezeichnete Gesamtheit, während „miteinander“ das koordinierte gemeinsame Vorgehen wiedergibt.
- source_word: לָבוֹא
  choice: zu ziehen
  rationale: Das Bewegungsverb wird beibehalten; „gegen Jerusalem ziehen“ ist im Deutschen in einem militärisch-feindlichen Zusammenhang natürlicher als das wörtlichere „kommen“.
- source_word: לְהִלָּחֵם בִּירוּשָׁלָם
  choice: gegen Jerusalem zu kämpfen
  rationale: Die Form von לחם bezeichnet das Kämpfen; die Präposition markiert Jerusalem im Kontext als Ziel der feindlichen Handlung.
- source_word: וְלַעֲשׂוֹת לוֹ
  choice: und dort … zu stiften
  rationale: עשה mit dem folgenden Zustandsnomen bedeutet, einen Zustand herbeizuführen. „Dort“ nimmt Jerusalem idiomatisch als Ort der beabsichtigten Wirkung auf.
- source_word: תּוֹעָה
  choice: Verwirrung
  rationale: Das seltene Nomen kann Verwirrung, Unordnung oder Störung bezeichnen. „Verwirrung“ wahrt die Bedeutungsbreite, ohne eine bestimmte Art der Sabotage vorauszusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Doppelung „alle miteinander“ ist bewusst gewählt, um sowohl כֻלָּם als auch יַחְדָּו abzubilden; die Bewegungs- und Kampfverben bleiben getrennt erhalten.
