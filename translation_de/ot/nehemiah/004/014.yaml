  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר תִּשְׁמְעוּ֙ אֶת ק֣וֹל הַ/שּׁוֹפָ֔ר שָׁ֖מָּ/ה תִּקָּבְצ֣וּ אֵלֵ֑י/נוּ אֱלֹהֵ֖י/נוּ יִלָּ֥חֶם לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/014.yaml
  text: At the place where you hear the sound of the trumpet[a], gather there to us. Our God will fight for us.
translation:
  language: de
  text: An dem Ort, wo ihr den Schall des Schofars[a] hört, versammelt euch dort zu uns. Unser Gott wird für uns kämpfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Widderhorns“. Ein Schofar ist ein als Blasinstrument verwendetes Tierhorn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: An dem Ort, wo
  rationale: Die konkrete Ortsangabe bleibt erhalten; der Relativanschluss mit „wo“ ist im modernen Deutsch natürlich und präzise.
- source_word: תִּשְׁמְעוּ
  choice: ihr … hört
  rationale: Das Qal von שׁמע bezeichnet hier schlicht das akustische Wahrnehmen.
- source_word: קוֹל הַשּׁוֹפָר
  choice: den Schall des Schofars
  rationale: „Schall“ gibt das ausdrücklich vorhandene קוֹל wieder. „Schofar“ bezeichnet das konkrete Horninstrument genauer als das allgemeinere „Trompete“.
- source_word: שָׁמָּה תִּקָּבְצוּ אֵלֵינוּ
  choice: sollt ihr euch bei uns versammeln
  rationale: Das Niphal wird idiomatisch reflexiv-intransitiv wiedergegeben. „Bei uns“ drückt das Zusammenkommen am Standort der Sprechergruppe natürlich aus; der Zielort ist bereits durch „an dem Ort“ bezeichnet.
- source_word: אֱלֹהֵינוּ
  choice: Unser Gott
  rationale: Das Possessivsuffix wird bewahrt und trägt die gemeinschaftliche, rhetorische Betonung.
- source_word: יִלָּחֶם לָנוּ
  choice: wird für uns kämpfen
  rationale: Die Form schreibt Gott selbst das Kämpfen zu; לָנוּ bezeichnet die Begünstigten beziehungsweise diejenigen, für die er kämpft.
theological_decisions:
- issue: Göttliches Kriegshandeln
  choice: Unser Gott wird für uns kämpfen
  alternative: Unser Gott wird uns im Kampf helfen
  rationale: Der hebräische Text stellt Gott selbst als den Kämpfenden dar und nicht lediglich als Helfer menschlichen Kampfes. Diese Spannung und Betonung wird nicht abgeschwächt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schofar“ ist sachlich präzise und im biblischen Sprachgebrauch etabliert; die Fußnote erklärt den weniger geläufigen Ausdruck.
