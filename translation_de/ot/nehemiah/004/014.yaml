    rationale: אֵלֵינוּ bedeutet „zu uns“ und bezeichnet die Bewegung zur Sprechergruppe. „Bei uns“ beschreibt primär einen Aufenthalt und verwischt die im hebräischen Aufruf enthaltene Zielrichtung.
  - severity: low
    issue: שָׁמָּה nicht ausdrücklich wiedergegeben
    rationale: Das Adverb verweist auf den zuvor genannten Ort. „dort“ bewahrt diesen Bezug knapp und natürlich.
