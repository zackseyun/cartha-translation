  source_fidelity: 'Der Entwurf gibt die hebräische Satzfolge und die Anredegruppen zutreffend wieder: Nehemias Wahrnehmung, sein Aufstehen und seine Ansprache an Vornehme, Amtsträger und das übrige Volk. Die Verbote und Imperative sowie die Aufzählung von Brüdern, Söhnen, Töchtern, Frauen und Häusern sind vollständig erhalten. „Da sah ich hin“ ist als kontextuell unergänzte Wiedergabe von וָאֵרֶא vertretbar; der hebräische Text nennt ebenfalls kein ausdrücklich ausgedrücktes Objekt.'
