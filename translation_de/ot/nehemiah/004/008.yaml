  terminology: „Vornehmen“ und „Amtsträgern“ unterscheiden die beiden Führungsgruppen angemessen, ohne ungesicherte moderne Amtstitel einzutragen. „Den Herrn“ gibt אֲדֹנָי korrekt als göttlichen Titel wieder. „Furchtgebietend“ trifft נוֹרָא mit seiner Dimension von Ehrfurcht und Schrecken präzise. „Brüder“ wahrt die maskuline Pluralform; die Fußnote erläutert die mögliche kinship-/gruppenbezogene Reichweite sachlich.
