  text: וָ/אֵ֣רֶא וָ/אָק֗וּם וָ/אֹמַ֞ר אֶל הַ/חֹרִ֤ים וְ/אֶל הַ/סְּגָנִים֙ וְ/אֶל יֶ֣תֶר הָ/עָ֔ם אַל תִּֽירְא֖וּ מִ/פְּנֵי/הֶ֑ם אֶת אֲדֹנָ֞/י הַ/גָּד֤וֹל וְ/הַ/נּוֹרָא֙ זְכֹ֔רוּ וְ/הִֽלָּחֲמ֗וּ עַל אֲחֵי/כֶם֙ בְּנֵי/כֶ֣ם וּ/בְנֹתֵי/כֶ֔ם נְשֵׁי/כֶ֖ם וּ/בָתֵּי/כֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/008.yaml
  text: Then I looked[a], rose up, and said to the nobles, to the officials, and to the rest of the people, “Do not be afraid of them. Remember the Lord, who is great and fearsome, and fight for your brothers, your sons, your daughters, your wives[b], and your houses.”
translation:
  language: de
  text: 'Da sah ich hin, stand auf und sagte zu den Vornehmen, den Amtsträgern und dem übrigen Volk: »Fürchtet euch nicht vor ihnen! Denkt an den Herrn, der groß und furchtgebietend[a] ist, und kämpft für eure Brüder[b], eure Söhne und Töchter, eure Frauen und eure Häuser!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Ehrfurcht gebietend«. Das hebräische Adjektiv bezeichnet jemanden, der Ehrfurcht oder Schrecken hervorruft.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort ist die männliche Pluralform »Brüder« und kann je nach Zusammenhang auch männliche Verwandte oder Volksgenossen bezeichnen. Danach werden Söhne, Töchter und Frauen eigens genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Da sah ich hin
  rationale: ראה eröffnet hier in der fortlaufenden Erzählung Nehemias entschlossenes Handeln. „Sah hin“ bewahrt den aktiven Wahrnehmungsaspekt; auch „da sah ich“ wäre möglich.
- source_word: וָאָקוּם
  choice: stand auf
  rationale: קום bezeichnet hier das entschlossene Aufstehen zum Reden und Handeln. „Stand auf“ ist gegenwärtiges, natürliches Deutsch.
- source_word: הַחֹרִים
  choice: die Vornehmen
  rationale: חֹרִים bezeichnet gesellschaftlich hochgestellte Führungspersonen. „Vornehme“ ist verständlich und vermeidet die engere Vorstellung eines förmlichen europäischen Adelsstands.
- source_word: הַסְּגָנִים
  choice: die Amtsträger
  rationale: סְגָנִים sind leitende beziehungsweise nachgeordnete Verwaltungs- und Regierungspersonen. „Amtsträger“ gibt ihre öffentliche Funktion präzise wieder.
- source_word: יֶתֶר הָעָם
  choice: das übrige Volk
  rationale: Die Wendung unterscheidet die breite Bevölkerung von den zuvor genannten Führungspersonen.
- source_word: אַל תִּירְאוּ מִפְּנֵיהֶם
  choice: Fürchtet euch nicht vor ihnen
  rationale: Die Verbindung von ירא mit מִפְּנֵי bezeichnet die Furcht angesichts der Gegner. Die deutsche Formulierung erhält sowohl das Verb „fürchten“ als auch den direkten Imperativ.
- source_word: אֶת אֲדֹנָי
  choice: den Herrn
  rationale: אֲדֹנָי ist hier der göttliche Titel „Herr“, nicht das Tetragramm יהוה.
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: der groß und furchtgebietend ist
  rationale: נוֹרָא bezeichnet jemanden, der Ehrfurcht oder Schrecken hervorruft. „Furchtgebietend“ bewahrt diese starke Bedeutung, während der Relativsatz im Deutschen natürlich klingt.
- source_word: זְכֹרוּ
  choice: Denkt an
  rationale: זכר fordert hier dazu auf, sich den Herrn bewusst vor Augen zu halten. „Denkt an“ ist idiomatisch und bewahrt den handlungsleitenden Sinn des Erinnerns.
- source_word: וְהִלָּחֲמוּ עַל
  choice: und kämpft für
  rationale: Die Konstruktion bezeichnet hier den Kampf zugunsten beziehungsweise zur Verteidigung der anschließend genannten Menschen und Häuser.
- source_word: אֲחֵיכֶם
  choice: eure Brüder
  rationale: Das hebräische Substantiv ist ein maskuliner Plural für männliche Verwandte beziehungsweise Volksgenossen. Die konkrete Form wird nicht stillschweigend erweitert.
- source_word: בְּנֵיכֶם וּבְנֹתֵיכֶם נְשֵׁיכֶם וּבָתֵּיכֶם
  choice: eure Söhne und Töchter, eure Frauen und eure Häuser
  rationale: Die konkrete, steigernde Aufzählung des Hebräischen bleibt erhalten. „Häuser“ kann dabei sowohl die Wohnstätten als auch die dazugehörigen Hausgemeinschaften anklingen lassen.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels אֲדֹנָי
  choice: der Herr
  alternative: der Gebieter
  rationale: Der Ausgangstext hat אֲדֹנָי und nicht יהוה. „Der Herr“ ist die etablierte, sachgerechte Wiedergabe des göttlichen Titels, ohne ihn mit dem Gottesnamen gleichzusetzen.
- issue: Wiedergabe von הַנּוֹרָא
  choice: furchtgebietend
  alternative: Ehrfurcht gebietend / schrecklich
  rationale: 'Das Wort verbindet Ehrfurcht und Furcht. „Furchtgebietend“ erhält die Spannung des Verses: Das Volk soll die Gegner nicht fürchten, sondern sich an Gottes furchteinflößende Größe erinnern.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, eindringlicher Rede. Die parallelen Imperative und die konkrete Familienaufzählung bleiben erhalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
