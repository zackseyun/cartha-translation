  yaml_path: translation/ot/nehemiah/004/015.yaml
  text: So we kept doing the work[a], while half of them held the spears from the rising of the dawn until the coming out of the stars.
translation:
  language: de
  text: So arbeiteten wir weiter, während die Hälfte von ihnen die Speere hielt, vom Anbruch der Morgenröte bis zum Erscheinen der Sterne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäßer: »vom Tagesanbruch bis zum Sichtbarwerden der Sterne«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: arbeiteten wir weiter
  rationale: Das Partizip bezeichnet im Erzählzusammenhang eine andauernde Tätigkeit. »Arbeiteten … weiter« gibt diesen durativen Sinn natürlich wieder, ohne die Art der Arbeit über den Kontext hinaus einzuengen.
- source_word: וְחֶצְיָם
  choice: während die Hälfte von ihnen
  rationale: Das Waw verbindet gleichzeitig stattfindende Handlungen. »Während« macht diese Beziehung im Deutschen deutlich; das Suffix wird mit »von ihnen« wiedergegeben.
- source_word: מַחֲזִיקִים בָּרְמָחִים
  choice: die Speere hielt
  rationale: חזק bezeichnet hier das fortdauernde Halten beziehungsweise Tragen der Waffen. Die schlichte Wiedergabe wahrt die konkrete Aussage, ohne eine bestimmte Kampfhaltung hinzuzufügen.
- source_word: מֵעֲלוֹת הַשַּׁחַר
  choice: vom Aufsteigen der Morgenröte
  rationale: Die Formulierung bewahrt das Bild des hebräischen Ausdrucks, der wörtlich vom Aufsteigen der Morgenröte spricht.
- source_word: עַד צֵאת הַכּוֹכָבִים
  choice: bis zum Hervortreten der Sterne
  rationale: Die Übersetzung erhält das konkrete Bild vom Sichtbarwerden beziehungsweise Herauskommen der Sterne und vermeidet die verallgemeinernde Wiedergabe »bis zum Einbruch der Nacht«.
