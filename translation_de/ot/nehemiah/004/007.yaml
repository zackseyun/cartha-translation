  text: וָֽ/אַעֲמִ֞יד מִֽ/תַּחְתִּיּ֧וֹת לַ/מָּק֛וֹם מֵ/אַחֲרֵ֥י לַ/חוֹמָ֖ה ב/צחחיים וָֽ/אַעֲמִ֤יד אֶת הָ/עָם֙ לְ/מִשְׁפָּח֔וֹת עִם חַרְבֹתֵי/הֶ֛ם רָמְחֵי/הֶ֖ם וְ/קַשְּׁתֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/007.yaml
  text: Then I stationed men in the lowest parts of the place[a], behind the wall, in the exposed areas; and I stationed the people by families, with their swords, their spears, and their bows.
translation:
  language: de
  text: Da stellte ich an den tiefsten Stellen des Geländes hinter der Mauer, an den offenen Stellen[a], Leute auf. Ich stellte das Volk nach Familien geordnet auf, mit ihren Schwertern, Speeren und Bogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an den kahlen Stellen« beziehungsweise »an den ungeschützten Stellen«. Das seltene hebräische Wort bezeichnet vermutlich freie, unbedeckte Bereiche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעֲמִיד
  choice: stellte ich … Leute auf
  rationale: Der Hifil von עמד bezeichnet hier das Aufstellen beziehungsweise Stationieren zur Verteidigung. Das im ersten Satzteil nicht ausdrücklich genannte Objekt wird aus dem folgenden »das Volk« erschlossen und für verständliches Deutsch als »Leute« ergänzt.
- source_word: מִתַּחְתִּיּוֹת לַמָּקוֹם
  choice: an den tiefsten Stellen des Geländes
  rationale: Die Form von תחת bezeichnet die unteren beziehungsweise tiefsten Bereiche; מקום wird im Zusammenhang des Mauerbaus natürlich als »Gelände« wiedergegeben.
- source_word: מֵאַחֲרֵי לַחוֹמָה
  choice: hinter der Mauer
  rationale: Die Wendung bezeichnet eine Lage auf der Rückseite der Mauer; »hinter der Mauer« ist präzise und idiomatisch.
- source_word: בצחחיים
  choice: an den offenen Stellen
  rationale: Das seltene Wort bezeichnet wahrscheinlich kahle, freie oder ungeschützte Bereiche. »Offene Stellen« bewahrt die räumliche Bedeutung, ohne die taktische Deutung als allein mögliche festzuschreiben.
- source_word: וָאַעֲמִיד אֶת הָעָם
  choice: Ich stellte das Volk … auf
  rationale: Die Wiederholung des Verbs wird wie im Hebräischen beibehalten und unterstreicht die planvolle Verteidigungsaufstellung.
- source_word: לְמִשְׁפָּחוֹת
  choice: nach Familien geordnet
  rationale: משפחה kann Familie, Großfamilie oder Sippe bezeichnen. Die Formulierung ist allgemein verständlich und lässt den genauen Umfang der sozialen Gruppen offen.
- source_word: עִם חַרְבֹתֵיהֶם רָמְחֵיהֶם וְקַשְּׁתֹתֵיהֶם
  choice: mit ihren Schwertern, Speeren und Bogen
  rationale: Die drei Waffenbezeichnungen werden direkt und in derselben Reihenfolge wiedergegeben; »Bogen« ist hier der reguläre deutsche Plural.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »stellte … auf« folgt der hebräischen Struktur. Die ungewöhnliche Ortsbeschreibung wird lesbar gegliedert, ihre lexikalische Unsicherheit jedoch in der Fußnote offengehalten.
