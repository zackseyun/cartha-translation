  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה כָּשַׁל֙ כֹּ֣חַ הַ/סַּבָּ֔ל וְ/הֶ/עָפָ֖ר הַרְבֵּ֑ה וַ/אֲנַ֨חְנוּ֙ לֹ֣א נוּכַ֔ל לִ/בְנ֖וֹת בַּ/חוֹמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/004.yaml
  text: And Judah said[a], “The strength of the burden-bearers has failed, and there is much rubble[b], and we are not able to build the wall.”
translation:
  language: de
  text: 'Und Juda sagte[a]: »Die Kraft der Lastträger hat nachgelassen, und es liegt viel Schutt[b], und wir können nicht an der Mauer bauen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Leute von Juda sagten.« Der Eigenname »Juda« im Singular steht hier wahrscheinlich kollektiv für die Gemeinschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »und der Staub ist viel«; im Zusammenhang ist wohl der Schutt der zerstörten Stadt gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Juda
  rationale: Der Eigenname bleibt entsprechend dem Hebräischen stehen; im Zusammenhang bezeichnet er wahrscheinlich kollektiv die Gemeinschaft Judas.
- source_word: כָּשַׁל
  choice: lässt nach
  rationale: Das Verb bezeichnet ein Straucheln oder Versagen. Bei körperlicher Kraft gibt »lässt nach« den fortschreitenden Kräfteverlust natürlich wieder.
- source_word: כֹּחַ הַסַּבָּל
  choice: die Kraft der Lastträger
  rationale: כֹּחַ bezeichnet hier die körperliche Kraft; הַסַּבָּל steht formal im Singular, hat jedoch kollektive Bedeutung und wird im Deutschen idiomatisch im Plural wiedergegeben.
- source_word: הֶעָפָר
  choice: Schutt
  rationale: Wörtlich bezeichnet das Wort Staub oder Erde; im Zusammenhang der zerstörten Stadt ist der Trümmerschutt gemeint.
- source_word: הַרְבֵּה
  choice: ist so groß
  rationale: Die Form bezeichnet eine große Menge. Zusammen mit dem folgenden Unvermögen wird die Folgebeziehung im Deutschen natürlich mit »so groß, dass« ausgedrückt, ohne den Sinn zu verändern.
- source_word: לֹא נוּכַל
  choice: wir … nicht … können
  rationale: Die Wendung bezeichnet Unfähigkeit, nicht mangelnde Bereitschaft.
- source_word: לִבְנוֹת בַּחוֹמָה
  choice: die Mauer … bauen
  rationale: Wörtlich steht »an/bei der Mauer bauen«. Im Deutschen bezeichnet »die Mauer bauen« in diesem Zusammenhang denselben Bauvorgang klarer und natürlicher; das einfache Verb »bauen« wird gegenüber dem interpretierenden »wiederaufbauen« bewahrt.
