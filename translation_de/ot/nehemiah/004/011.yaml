translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung macht den distributiven Sinn („jeder“) deutlich, ohne die knappe Bildhaftigkeit des Hebräischen aufzugeben. Die beiden lexikalischen Unsicherheiten werden nicht im Haupttext überbestimmt, sondern in Fußnoten offengelegt.
