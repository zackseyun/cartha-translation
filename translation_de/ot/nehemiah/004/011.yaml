base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/011.yaml
  text: The builders on the wall[a], and those who carried burdens, loaded themselves so that with one hand each did the work[b], and with the other held his weapon.
translation:
  language: de
  text: Die Bauleute an der Mauer und die Lastträger, die Lasten aufluden[a], verrichteten mit der einen Hand die Arbeit, während jeder mit der anderen seine Waffe[b] festhielt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hier verwendete hebräische Wort ist selten und seine genaue Nuance unsicher. Möglich ist auch: „die beladen waren“. Im Zusammenhang bezeichnet es wahrscheinlich Arbeiter, die mit Baumaterial oder Lasten beschäftigt waren.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann genauer einen Speer, einen Wurfspieß oder eine andere Stoß- beziehungsweise Wurfwaffe bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים בַּחוֹמָה
  choice: die Bauleute an der Mauer
  rationale: Das substantivierte Qal-Partizip bezeichnet die Bauenden; „Bauleute“ ist natürlich und würdig. בַּחוֹמָה wird räumlich als „an der Mauer“ wiedergegeben, ohne auszuschließen, dass sie auf ihr arbeiteten.
- source_word: וְהַנֹּשְׂאִים בַּסֶּבֶל
  choice: und die Lastträger
  rationale: Die Wendung bezeichnet diejenigen, die Baumaterial beziehungsweise Lasten trugen. „Lastträger“ ist knapp und im Baukontext verständlich.
- source_word: עֹמְשִׂים
  choice: die sich beluden
  rationale: Das seltene Partizip ist in seiner genauen Nuance unsicher. Die Wiedergabe nimmt den wahrscheinlichen Sinn des Beladens auf, ohne die Art der Last näher festzulegen.
- source_word: בְּאַחַת יָדוֹ עֹשֶׂה בַמְּלָאכָה
  choice: verrichteten mit der einen Hand die Arbeit
  rationale: 'Der Singular ist distributiv zu verstehen: Jeder Einzelne arbeitete mit einer Hand. Die deutsche Formulierung bewahrt sowohl das konkrete Bild als auch den kollektiven Zusammenhang.'
- source_word: וְאַחַת מַחֲזֶקֶת
  choice: während jeder mit der anderen … festhielt
  rationale: Die feminine Singularform bezieht sich auf die unausgesprochene andere Hand. „Festhielt“ bildet die Bedeutung von חזק konkreter ab als ein bloßes „hielt“.
- source_word: הַשָּׁלַח
  choice: seine Waffe
  rationale: Das Wort kann eine bestimmte Stoß- oder Wurfwaffe bezeichnen. Der allgemeinere Ausdruck „Waffe“ vermeidet eine nicht sicher belegbare Festlegung auf Speer oder Geschoss; das Possessivpronomen gibt den distributiven Sinn idiomatisch wieder.
