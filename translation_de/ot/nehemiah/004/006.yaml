base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/006.yaml
  text: And when the Jews who lived near them came and told us ten times[a], “From all the places where you turn[b], they will come up against us,”
translation:
  language: de
  text: 'Als die Juden, die in ihrer Nähe wohnten, kamen, sagten sie uns zehnmal: „Von allen Orten her, wohin ihr euch auch wendet, werden sie gegen uns kommen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Schlusssatz ist elliptisch und schwer verständlich. Wörtlich stehen etwa: „Von allen Orten, wohin ihr zurückkehrt, gegen uns.“ Das Verb kann „zurückkehren“ bedeuten; im Zusammenhang wird es oft im Sinn von „sich wenden“ verstanden. „Werden sie kommen“ ist aus dem Warnzusammenhang ergänzt.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als
  rationale: Die hebräische Erzählungsform leitet eine zeitliche Weiterentwicklung ein; „Als“ gibt dies im Deutschen natürlich und knapp wieder.
- source_word: הַיְּהוּדִים
  choice: die Juden
  rationale: Im Kontext bezeichnet der Ausdruck die jüdische Bevölkerung beziehungsweise Gemeinschaft, nicht nur geografisch bestimmte Bewohner Judas.
- source_word: הַיֹּשְׁבִים אֶצְלָם
  choice: die in ihrer Nähe wohnten
  rationale: אֵצֶל bezeichnet hier räumliche Nähe zu den feindlichen Nachbarvölkern; „in ihrer Nähe“ ist im Deutschen eindeutig und natürlich.
- source_word: עֶשֶׂר פְּעָמִים
  choice: zehnmal
  rationale: Die ausdrücklich genannte Zahl bleibt erhalten, auch wenn die Wendung zugleich nachdrückliches, wiederholtes Warnen ausdrücken kann.
- source_word: מִכָּל הַמְּקֹמוֹת
  choice: von überall her
  rationale: Die idiomatische deutsche Wendung bewahrt den umfassenden, distributiven Sinn von „von allen Orten“.
- source_word: אֲשֶׁר תָּשׁוּבוּ
  choice: wohin ihr euch auch wendet
  rationale: שׁוב bedeutet gewöhnlich „zurückkehren“, kann im schwierigen Satzgefüge aber als Wenden beziehungsweise Sich-in-eine-Richtung-Bewegen verstanden werden. Die gewählte Fassung ergibt im Warnzusammenhang einen verständlichen Sinn, ohne die Unsicherheit zu verschweigen.
- source_word: עָלֵינוּ
  choice: gegen uns
  rationale: עַל kann im feindlichen Zusammenhang eine gegen jemanden gerichtete Bewegung bezeichnen. Das im Deutschen ergänzte „kommen sie“ erschließt die implizierte Bedrohung aus dem Kontext.
