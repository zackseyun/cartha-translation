  source_fidelity: 'Die Hauptfassung trifft den naheliegenden Warnsinn: Die bei den Gegnern wohnenden Juden berichten wiederholt von einem drohenden Angriff. Der hebräische Schlusssatz ist jedoch elliptisch und syntaktisch schwierig; ein Prädikat wie „werden ... kommen“ ist nicht ausdrücklich vorhanden und muss als kontextuelle Ergänzung kenntlich bleiben. „Von allen Orten her“ bildet מִכָּל־הַמְּקֹמוֹת genauer ab als das stärker richtungsbezogene „von überall her“.'
