base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/003.yaml
  text: So we prayed to our God and stationed a guard against them day and night because of them[a][b].
translation:
  language: de
  text: Da beteten wir zu unserem Gott und stellten ihretwegen Tag und Nacht eine Wache gegen sie auf.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und postierten gegen sie Tag und Nacht Wachleute«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »von vor ihnen«; hier im Sinn von »ihretwegen« oder »wegen ihnen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּתְפַּלֵּל
  choice: Da beteten wir
  rationale: Das Hitpael von פלל bedeutet hier schlicht »beten«. »Da« gibt den erzählerischen Anschluss des Wayyiqtol natürlich wieder, ohne eine nicht ausdrücklich bezeichnete Intensität hinzuzufügen.
- source_word: אֶל אֱלֹהֵינוּ
  choice: zu unserem Gott
  rationale: אֶל wird idiomatisch mit »zu« wiedergegeben; das Suffix der 1. Person Plural bleibt durch »unserem« erhalten.
- source_word: וַנַּעֲמִיד
  choice: stellten … auf
  rationale: Das Hifil von עמד bezeichnet das Aufstellen beziehungsweise Positionieren. Zusammen mit »Wache« ist »eine Wache aufstellen« im Deutschen natürlich.
- source_word: מִשְׁמָר
  choice: eine Wache
  rationale: מִשְׁמָר kann eine Wache, einen Wachdienst oder Wachposten bezeichnen. »Eine Wache« wahrt die kollektive und funktionale Offenheit.
- source_word: עֲלֵיהֶם
  choice: ihnen gegenüber
  rationale: עַל kann räumlich oder feindlich ausgerichtet verstanden werden. »Ihnen gegenüber« passt zum Bedrohungskontext, ohne die Wendung stärker als nötig auf »gegen sie« festzulegen.
- source_word: יוֹמָם וָלַיְלָה
  choice: Tag und Nacht
  rationale: Die feste Wortverbindung bezeichnet durchgehende Wachsamkeit und wird im Deutschen idiomatisch mit »Tag und Nacht« wiedergegeben.
- source_word: מִפְּנֵיהֶם
  choice: ihretwegen
  rationale: Wörtlich steht »vor ihnen weg/von ihrem Angesicht«. Im Zusammenhang bezeichnet die Wendung den Anlass für die Wache; »ihretwegen« bewahrt den kausalen Sinn, ohne ausdrücklich Furcht zu unterstellen.
theological_decisions:
- issue: Reaktion auf die feindliche Bedrohung
  choice: Gebet und praktische Schutzmaßnahme werden als koordinierte Handlungen gleichrangig wiedergegeben.
  alternative: Entweder das Gebet oder die bewaffnete Wachsamkeit besonders hervorheben.
  rationale: Der hebräische Text verbindet beide Handlungen mit וַ־. Die Übersetzung erhält die Spannung zwischen Gottvertrauen und verantwortlichem Handeln, ohne sie zugunsten einer Seite aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich vor »ihretwegen« macht die nachgestellte Begründung verständlich und lässt zugleich die Wiederholung des Bezugs auf die Gegner erkennen. Die Fußnotenmarker stehen vollständig im Haupttext.
