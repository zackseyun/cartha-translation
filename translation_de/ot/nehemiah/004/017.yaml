base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/017.yaml
  text: And neither I[a], nor my brothers, nor my young men, nor the men of the guard who were behind me, took off our clothes; each kept his weapon in his right hand, even for water.
translation:
  language: de
  text: Weder ich noch meine Brüder noch meine jungen Männer noch die Männer der Wache, die hinter mir waren, zogen unsere Kleider aus; jeder hatte seine Waffe bei sich, selbst beim Wasserholen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut des letzten Satzteils ist schwierig, wörtlich etwa: »jeder seine Waffe, das Wasser«. Gemeint sein kann: »Jeder hatte seine Waffe bei sich, selbst beim Wasserholen«, oder: »Jeder ging mit seiner Waffe zum Wasser.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... אֵין
  choice: Weder ... noch ... zogen ... aus
  rationale: Die Negationspartikel אֵין mit dem Partizip פֹשְׁטִים bezeichnet eine fortdauernd unterlassene Handlung. Die deutsche weder-noch-Konstruktion verbindet die aufgezählten Subjekte natürlich; das zweite אֵין wird in der finiten Verbform mit Negation wiedergegeben.
- source_word: אַחַי
  choice: meine Brüder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten, ohne sie kontextuell auf Verwandte oder enge Gefährten einzuengen.
- source_word: נְעָרַי
  choice: meine jungen Männer
  rationale: נַעַר kann einen jungen Mann, Diener oder Begleiter bezeichnen. Die Wiedergabe wahrt die lexikalische Offenheit und passt zum administrativ-militärischen Zusammenhang.
- source_word: אַנְשֵׁי הַמִּשְׁמָר
  choice: die Männer der Wache
  rationale: מִשְׁמָר bezeichnet eine Wache, Wachmannschaft oder einen Wachdienst. Die Formulierung ist klar und bewahrt den Sicherheits- beziehungsweise Militärbezug.
- source_word: אֲשֶׁר אַחֲרַי
  choice: die hinter mir standen
  rationale: Die räumlich naheliegende Bedeutung von אַחֲרַי wird beibehalten; „standen“ macht im Wachkontext verständlich, dass sie hinter Nehemia postiert waren, ohne eine bloße Nachfolge auszudrücken.
- source_word: פֹשְׁטִים בְּגָדֵינוּ
  choice: zogen unsere Kleider aus
  rationale: פשט mit בגדים bedeutet Kleidung ablegen oder ausziehen. Die deutsche Formulierung ist natürlich und sachlich.
- source_word: אִישׁ
  choice: jeder
  rationale: Das wörtliche „Mann“ wird hier distributiv gebraucht und im Deutschen idiomatisch mit „jeder“ wiedergegeben.
- source_word: שִׁלְחוֹ
  choice: seine Waffe bei sich
  rationale: שֶׁלַח bezeichnet eine Waffe, möglicherweise eine Wurfwaffe oder einen Speer. „Waffe“ vermeidet eine unbelegte Festlegung auf einen bestimmten Waffentyp; „bei sich“ gibt die Bereitschaft wieder, ohne eine im masoretischen Text nicht ausdrücklich genannte rechte Hand einzutragen.
- source_word: הַמָּיִם
  choice: selbst beim Wasserholen
  rationale: Die Schlusswendung ist textlich beziehungsweise syntaktisch schwierig. Diese Wiedergabe versteht הַמָּיִם als Hinweis darauf, dass die Männer auch beim Gang zum Wasser bewaffnet blieben, kennzeichnet die Unsicherheit jedoch in einer Fußnote.
