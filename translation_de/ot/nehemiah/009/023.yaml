base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/023.yaml
  text: You multiplied their children like the stars of the heavens[c][b][a], and you brought them into the land that you had told their fathers to enter and possess.
translation:
  language: de
  text: Ihre Nachkommen[a] machtest du so zahlreich wie die Sterne am Himmel[b], und du brachtest sie in das Land. Du hattest ihren Vätern gesagt, sie sollten hineingehen und es in Besitz nehmen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: ihre Söhne; gemeint sein können auch ihre Kinder beziehungsweise Nachkommen.'
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung erinnert an Gottes Verheißung an die Erzväter.
    reason: cross_reference
  - marker: c
    text: 'Oder: es erben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: Ihre Nachkommen
  rationale: בנים kann enger »Söhne« bedeuten, bezeichnet hier angesichts der Vermehrung des Volkes aber natürlich die Nachkommenschaft. »Nachkommen« ist inklusiv, idiomatisch und wahrt den Generationenbezug.
- source_word: הִרְבִּיתָ
  choice: machtest du so zahlreich
  rationale: Der Hifil von רבה bezeichnet das Vermehren beziehungsweise Zahlreichmachen. Diese Formulierung gibt Gottes unmittelbares Handeln natürlich wieder.
- source_word: כְּכֹכְבֵי הַשָּׁמָיִם
  choice: wie die Sterne am Himmel
  rationale: Die geläufige deutsche Wendung bleibt eng am Hebräischen und bewahrt den Anklang an die Verheißung an die Erzväter.
- source_word: וַתְּבִיאֵם
  choice: du brachtest sie
  rationale: Der Hifil von בוא bedeutet hier »hineinbringen«. Im Deutschen ergibt sich die Zielrichtung bereits aus »in das Land«.
- source_word: אֶל הָאָרֶץ
  choice: in das Land
  rationale: Nach einem Bewegungsverb bezeichnet אֶל das Ziel; »in das Land« bringt den Eintritt ins Land klar zum Ausdruck.
- source_word: אֲשֶׁר אָמַרְתָּ לַאֲבֹתֵיהֶם
  choice: von dem du ihren Vätern gesagt hattest
  rationale: Die relative Konstruktion bezieht das Land auf Gottes früheres Wort an die Väter. Das Plusquamperfekt verdeutlicht die zeitliche Folge, ohne den Inhalt auszudeuten.
- source_word: לָבוֹא לָרָשֶׁת
  choice: sie sollten hineingehen und es in Besitz nehmen
  rationale: Die beiden Infinitive geben den Inhalt beziehungsweise Zweck des göttlichen Wortes wieder. »In Besitz nehmen« trifft ירשׁ im Zusammenhang der Landnahme, während eine Fußnote die mögliche Wiedergabe »erben« festhält.
theological_decisions:
- issue: Anklang an die Verheißung an die Erzväter
  choice: Die Bildsprache »wie die Sterne am Himmel« und die Bezeichnung »ihre Väter« bleiben erhalten.
  alternative: Modernisierende Formulierungen wie »unzählbar viele« und »ihre Vorfahren«.
  rationale: Die hebräische Wortwahl erinnert bewusst an Gottes Verheißung an die Erzväter. Die Übersetzung wahrt diesen Zusammenhang, ohne ihn im Haupttext ausdrücklich auszulegen.
- issue: Bedeutung von ירשׁ bei der Landgabe
  choice: »in Besitz nehmen«
  alternative: »erben«
  rationale: Im unmittelbaren Zusammenhang steht das Hineingehen in das verheißene Land und dessen Besitznahme im Vordergrund. Da ירשׁ auch »erben« bedeuten kann und diese Nuance theologisch mitschwingen mag, wird sie in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede Gottes bleibt im vertrauten Singular. Der Satz folgt der hebräischen Abfolge, ist aber syntaktisch natürlich; die Verheißungssprache und die Bedeutungsbreite zentraler Wörter werden gewahrt.
