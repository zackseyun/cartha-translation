  naturalness: Die Zweiteilung ist verständlich, doch „hatten Erde auf sich“ wirkt im modernen Standarddeutsch etwas schwerfällig. Eine einheitliche Konstruktion mit „fastend“, „in Sacktuch gekleidet“ und „mit Erde auf sich“ ist flüssig und bewahrt die Aufzählung des Ausgangstextes.
  terminology: „Israeliten“ ist als natürliche kollektive Wiedergabe von בני ישראל angemessen; die Fußnote wahrt die wörtliche Form. „Sacktuch“ sollte im Haupttext stehen, weil es den konkreten Ausdruck שקים direkt wiedergibt und nicht nur seine Trauerfunktion.
