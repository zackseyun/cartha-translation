base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/001.yaml
  text: On the twenty-fourth day of this month[a], the sons of Israel assembled with fasting, in sackcloth[b], and with dirt on them.
translation:
  language: de
  text: Am vierundzwanzigsten Tag dieses Monats versammelten sich die Israeliten[a], fastend, in Sacktuch gekleidet[b] und mit Erde auf sich[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: die Söhne Israels; traditionell: die Kinder Israel.'
    reason: lexical_alternative
  - marker: b
    text: Sacktuch war ein grobes Gewebe, das als Zeichen von Trauer und Umkehr getragen wurde.
    reason: cultural_note
  - marker: c
    text: Das Aufstreuen von Erde auf den eigenen Körper war ein Zeichen von Trauer und Umkehr. Der hebräische Text sagt nicht ausdrücklich, dass die Erde auf ihren Köpfen lag.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה לַחֹדֶשׁ הַזֶּה
  choice: Am vierundzwanzigsten Tag dieses Monats
  rationale: Die hebräische Datierungsformel wird im Deutschen idiomatisch mit einer Ordinalzahl wiedergegeben. Das einleitende ו wird nicht eigens mit „und“ übersetzt, da der narrative Anschluss im Deutschen ohne Konjunktion natürlich ist.
- source_word: נֶאֶסְפוּ
  choice: versammelten sich
  rationale: Der Niphal bezeichnet hier das Zusammenkommen zu einer Versammlung; die reflexive deutsche Form ist natürlich und lässt offen, ob ein äußerer Aufruf vorausging.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die geläufige deutsche Völkerbezeichnung gibt die kollektiv-genealogische Wendung natürlich und inklusiv wieder; die wörtliche Form „Söhne Israels“ könnte im heutigen Deutsch fälschlich nur Männer bezeichnen.
- source_word: בְּצוֹם
  choice: zum Fasten
  rationale: Die Formulierung gibt das Fasten als begleitenden Zweck beziehungsweise Vollzug der Versammlung in natürlichem Deutsch wieder.
- source_word: וּבְשַׂקִּים
  choice: Sie trugen Trauergewänder
  rationale: שַׂק bezeichnet grobes Sackleinen beziehungsweise daraus gefertigte Kleidung als Zeichen von Trauer und Buße. „Trauergewänder“ vermittelt die Funktion verständlich; die Sachnote bewahrt das konkrete Bild.
- source_word: וַאֲדָמָה עֲלֵיהֶם
  choice: und hatten Erde auf sich
  rationale: אֲדָמָה bedeutet hier wörtlich „Erde“ oder „Erdboden“. Die Übersetzung bewahrt das konkrete Zeichen der Trauer und legt nicht fest, dass sich die Erde speziell auf ihren Köpfen befand.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers ist zur besseren Verständlichkeit in zwei Sätze gegliedert. „Israeliten“ vermeidet die heute missverständliche geschlechtliche Verengung von „Söhne Israels“. „Trauergewänder“ erschließt die kulturelle Funktion, während die Fußnote das konkrete Sacktuch nennt.
