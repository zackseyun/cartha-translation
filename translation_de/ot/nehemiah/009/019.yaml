revisions:
- from: Du aber hast sie in deinem großen Erbarmen[a] in der Wüste nicht verlassen. Die Wolkensäule wich am Tag nicht von ihnen, sondern führte sie auf dem Weg; ebenso wenig wich in der Nacht die Feuersäule von ihnen, sondern leuchtete ihnen auf dem Weg, den sie gehen sollten.
  to: Du aber hast sie in deinem großen Erbarmen[a] in der Wüste nicht verlassen. Die Wolkensäule über ihnen wich bei Tag nicht, um sie auf dem Weg zu führen, und die Feuersäule bei Nacht nicht, um ihnen Licht zu geben und den Weg, den sie gehen sollten, zu erhellen.
  rationale: Die Revision stellt die räumliche Angabe „über ihnen“ wieder her, bewahrt die finalen Führungs- und Lichtbestimmungen ohne hinzugefügten Gegensatz und gibt die auffällige Koordination von Personen und Weg in der zweiten Vershälfte vollständig und idiomatisch wieder. Die Fußnote zum hebräischen Plural bleibt angemessen.
