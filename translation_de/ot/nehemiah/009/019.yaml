source:
  edition: WLC
  text: וְ/אַתָּה֙ בְּ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֔ים לֹ֥א עֲזַבְתָּ֖/ם בַּ/מִּדְבָּ֑ר אֶת עַמּ֣וּד הֶ֠/עָנָן לֹא סָ֨ר מֵ/עֲלֵי/הֶ֤ם בְּ/יוֹמָם֙ לְ/הַנְחֹתָ֣/ם בְּ/הַ/דֶּ֔רֶךְ וְ/אֶת עַמּ֨וּד הָ/אֵ֤שׁ בְּ/לַ֨יְלָה֙ לְ/הָאִ֣יר לָ/הֶ֔ם וְ/אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/019.yaml
  text: But you[a], in your abundant mercies, did not abandon them in the wilderness. The pillar of cloud did not depart from above them by day, to lead them on the way, nor the pillar of fire by night, to give them light and the way in which they should go.
translation:
  language: de
  text: Du aber hast sie in deinem großen Erbarmen[a] in der Wüste nicht verlassen. Die Wolkensäule über ihnen wich bei Tag nicht, um sie auf dem Weg zu führen, und die Feuersäule bei Nacht nicht, um ihnen Licht zu geben und den Weg, den sie gehen sollten, zu erhellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in deinen vielen Erbarmungen«. Das Hebräische verwendet hier die Mehrzahl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַחֲמֶיךָ הָרַבִּים
  choice: in deinem großen Erbarmen
  rationale: רַחֲמִים ist formal Plural, wird im Deutschen jedoch idiomatisch meist mit dem Kollektivsingular „Erbarmen“ wiedergegeben; הָרַבִּים wird durch „großen“ abgebildet. Eine Fußnote bewahrt die formale Mehrzahl.
- source_word: עֲזַבְתָּם
  choice: hast sie … nicht verlassen
  rationale: „Verlassen“ gibt עזב in natürlichem, gegenwärtigem Deutsch wieder und bewahrt den Gedanken, dass Gott sein Volk nicht preisgab.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: „Wüste“ ist die übliche deutsche Bezeichnung für den Schauplatz der Wüstenwanderung und deckt den Kontext von מִדְבָּר angemessen ab.
- source_word: עַמּוּד הֶעָנָן
  choice: die Wolkensäule
  rationale: Die etablierte deutsche Zusammensetzung ist klar und wahrt den Bezug zur Exodusüberlieferung.
- source_word: לֹא סָר מֵעֲלֵיהֶם
  choice: wich … nicht von ihnen
  rationale: סור bezeichnet das Weichen oder Sichentfernen. „Von ihnen“ ist natürliches Deutsch; die ungewöhnliche räumliche Formulierung מֵעֲלֵיהֶם („von über ihnen“) wird in der Fußnote kenntlich gemacht.
- source_word: לְהַנְחֹתָם בְּהַדֶּרֶךְ
  choice: sondern führte sie auf dem Weg
  rationale: נחה im Hifil bedeutet „führen/leiten“; „auf dem Weg“ ist für בְּהַדֶּרֶךְ im Reisekontext idiomatisch. Die finite Wiedergabe macht die elliptische Parallelkonstruktion im Deutschen verständlich.
- source_word: עַמּוּד הָאֵשׁ
  choice: die Feuersäule
  rationale: Die geläufige deutsche Zusammensetzung erhält die Parallele zu „Wolkensäule“.
- source_word: לְהָאִיר לָהֶם
  choice: leuchtete ihnen
  rationale: Das Hifil von אור kann „Licht geben“ bedeuten; „ihnen leuchten“ ist knapp, würdig und natürlich.
- source_word: וְאֶת הַדֶּרֶךְ אֲשֶׁר יֵלְכוּ בָהּ
  choice: auf dem Weg, den sie gehen sollten
  rationale: Der masoretische Text setzt וְאֶת הַדֶּרֶךְ formal als weitere Akkusativfügung fort, doch der Sinnzusammenhang verbindet das Licht mit dem Weg. Die deutsche Formulierung bewahrt die Wegangabe und den modalen Gehalt von יֵלְכוּ, ohne das sachlich schwierige „ihnen und den Weg leuchten“ zu erzwingen.
theological_decisions:
- issue: Göttliches Erbarmen im formalen Plural
  choice: großes Erbarmen, mit Fußnote zum hebräischen Plural
  alternative: viele Erbarmungen / reiche Erbarmungen
  rationale: Der deutsche Singular ist idiomatisch und bezeichnet umfassendes Erbarmen, während die Fußnote die formale und möglicherweise intensivierende Mehrzahl des Hebräischen offenlegt, ohne daraus eine besondere Lehrnuance abzuleiten.
- issue: Verhältnis von Licht und Weg in der letzten Vershälfte
  choice: „leuchtete ihnen auf dem Weg, den sie gehen sollten“
  alternative: „um ihnen und dem Weg, den sie gehen sollten, Licht zu geben“
  rationale: Die Syntax mit אֶת erlaubt eine formale Koordination, klingt jedoch auch im Hebräischen auffällig. Die gewählte Fassung folgt dem naheliegenden Sinn, wahrt aber in einer Fußnote die syntaktische Spannung und löst sie nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertrauten Begriffe „Wolkensäule“ und „Feuersäule“ bleiben erhalten. Explizite Kontrastglieder („sondern“, „ebenso wenig“) lösen die hebräische Ellipse lesbar auf. Beide Fußnotenmarker erscheinen im Haupttext; [b] steht bei der betroffenen Führungs- und Lichtkonstruktion.
