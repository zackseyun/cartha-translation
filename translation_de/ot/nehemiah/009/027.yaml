  text: וַֽ/תִּתְּנֵ/ם֙ בְּ/יַ֣ד צָֽרֵי/הֶ֔ם וַ/יָּצֵ֖רוּ לָ/הֶ֑ם וּ/בְ/עֵ֤ת צָֽרָתָ/ם֙ יִצְעֲק֣וּ אֵלֶ֔י/ךָ וְ/אַתָּה֙ מִ/שָּׁמַ֣יִם תִּשְׁמָ֔ע וּֽ/כְ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֗ים תִּתֵּ֤ן לָ/הֶם֙ מֽוֹשִׁיעִ֔ים וְ/יוֹשִׁיע֖וּ/ם מִ/יַּ֥ד צָרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/027.yaml
  text: So you gave them into the hand of their adversaries[a], who oppressed them. But in the time of their distress they cried out to you, and you heard from heaven; and according to your abundant mercies you gave them deliverers, who saved them from the hand of their adversaries.
translation:
  language: de
  text: Da gabst du sie in die Hand ihrer Bedränger, und diese bedrängten sie. Doch in der Zeit ihrer Not schrien sie zu dir. Du hörtest vom Himmel her und gabst ihnen nach deinem großen Erbarmen Retter[a], die sie aus der Hand ihrer Bedränger retteten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Befreier. Gemeint sind menschliche Retter, die Gott ihnen gab, um sie zu befreien.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְּנֵם בְּיַד
  choice: gabst du sie in die Hand
  rationale: Die konkrete hebräische Machtmetapher »in die Hand geben« bleibt erhalten und ist im Deutschen verständlich.
- source_word: צָרֵיהֶם
  choice: ihre Bedränger
  rationale: Das Wort bezeichnet feindliche Gegner; »Bedränger« wahrt zugleich die erkennbare Verbindung zum folgenden Verb, ohne dieses mit einem anderen deutschen Wortstamm wiederzugeben.
- source_word: וַיָּצֵרוּ לָהֶם
  choice: und diese bedrängten sie
  rationale: Das Verb beschreibt das Bedrängen, Einengen oder In-Not-Bringen. Das Demonstrativpronomen macht den deutschen Bezug eindeutig.
- source_word: וּבְעֵת צָרָתָם
  choice: Doch in der Zeit ihrer Not
  rationale: Die Zeitangabe wird direkt wiedergegeben; »Doch« verdeutlicht den im Erzählgang liegenden Gegensatz.
- source_word: יִצְעֲקוּ אֵלֶיךָ
  choice: schrien sie zu dir
  rationale: »Schreien« bewahrt die Dringlichkeit des Hilferufs in der Not.
- source_word: מִשָּׁמַיִם תִּשְׁמָע
  choice: Du hörtest sie vom Himmel her
  rationale: Die Herkunftsangabe »vom Himmel« bleibt erhalten. Das Präteritum gibt die geschichtliche Rückschau natürlich wieder.
- source_word: וּכְרַחֲמֶיךָ הָרַבִּים
  choice: nach deinem großen Erbarmen
  rationale: Der idiomatische deutsche Singular »Erbarmen« gibt die Fülle des pluralischen hebräischen Ausdrucks natürlich und würdig wieder.
- source_word: מֹשִׁיעִים
  choice: Retter
  rationale: Das substantivierte Partizip bezeichnet hier menschliche Personen, durch die Gott Rettung bewirkt. »Retter« erhält den Zusammenhang mit dem folgenden Verb »retteten«.
- source_word: וְיוֹשִׁיעוּם
  choice: die sie ... retteten
  rationale: Der Relativsatz verbindet die Handlung flüssig mit den zuvor genannten Rettern und wahrt denselben Wortstamm wie im Hebräischen.
- source_word: מִיַּד צָרֵיהֶם
  choice: aus der Hand ihrer Bedränger
  rationale: Die Wiederholung der Machtmetapher und der Gegnerbezeichnung aus dem ersten Satzteil wird konsequent bewahrt.
theological_decisions:
- issue: Bezeichnung menschlicher Rettungsgestalten als מֹשִׁיעִים
  choice: Retter
  alternative: Befreier
  rationale: Der Kontext bezeichnet menschliche Werkzeuge, die Gott seinem Volk gab. »Retter« gibt den hebräischen Wortstamm transparent wieder, ohne diese Menschen mit dem göttlichen Retter gleichzusetzen; ihre abhängige Rolle wird durch »du gabst ihnen« deutlich.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die wiederkehrenden hebräischen Wort- und Bildverbindungen werden soweit natürlich möglich durch »Bedränger/bedrängten«, »Retter/retteten« und »in die Hand/aus der Hand« sichtbar gemacht.
