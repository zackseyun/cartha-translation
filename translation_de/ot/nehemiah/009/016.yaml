id: NEH.9.16
reference: Nehemiah 9:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֵ֥ם וַ/אֲבֹתֵ֖י/נוּ הֵזִ֑ידוּ וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וְ/לֹ֥א שָׁמְע֖וּ אֶל מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/016.yaml
  text: But they[a], our fathers, acted presumptuously and stiffened their neck[c][b], and did not listen to your commandments.
translation:
  language: de
  text: Doch sie, unsere Väter, handelten vermessen[a], wurden halsstarrig[b] und hörten nicht auf deine Gebote[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „handelten überheblich“ bzw. „anmaßend“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „machten ihren Nacken steif“; ein hebräisches Bild für hartnäckige Widersetzlichkeit.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „beachteten deine Gebote nicht“ bzw. „gehorchten deinen Geboten nicht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Doch sie
  rationale: Die Konjunktion mit dem selbstständigen Pronomen bildet im Zusammenhang einen Gegensatz zu Gottes zuvor geschildertem gnädigem Handeln; „Doch sie“ gibt diesen Kontrast im Deutschen natürlich wieder.
- source_word: וַאֲבֹתֵינוּ
  choice: unsere Väter
  rationale: Dies entspricht der konkreten Verwandtschaftsbezeichnung im Hebräischen und bewahrt die gemeinschaftliche Identifikation der Betenden mit den früheren Generationen.
- source_word: הֵזִידוּ
  choice: handelten vermessen
  rationale: Das Verb bezeichnet stolzes, anmaßendes oder vermessenes Handeln. Die Formulierung bewahrt sowohl den Handlungsaspekt als auch die moralische Wertung.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: wurden halsstarrig
  rationale: Die deutsche Wendung gibt das hebräische Bild vom steif gemachten Nacken idiomatisch und verständlich wieder, ohne dessen Bedeutung als hartnäckige Auflehnung abzuschwächen.
- source_word: וְלֹא שָׁמְעוּ אֶל
  choice: hörten nicht auf
  rationale: שׁמע mit אֶל kann „hören auf“, „beachten“ oder sinngemäß „gehorchen“ bedeuten. „Hörten nicht auf“ bewahrt den Hörbezug und lässt den Gehorsamsaspekt im Zusammenhang erkennen.
- source_word: מִצְוֺתֶיךָ
  choice: deine Gebote
  rationale: „Gebote“ entspricht dem rechtlich-bundestheologischen Sprachgebrauch des Substantivs im geschichtlichen Gebet.
theological_decisions:
- issue: Gemeinschaftliche Identifikation mit früheren sündigen Generationen
  choice: „unsere Väter“ im Haupttext
  alternative: „unsere Vorfahren“
  rationale: Das Gebet verbindet die gegenwärtige Gemeinschaft ausdrücklich mit den früheren Generationen. Die konkrete Wiedergabe wahrt diese geschichtlich-bundesbezogene Solidarität, ohne darüber hinausgehende Lehrannahmen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Halsstarrig“ bewahrt das Körperbild in einer geläufigen deutschen Entsprechung; die Fußnote nennt die wörtliche hebräische Form. Die Satzstellung hebt wie der Ausgangstext den Gegensatz zwischen Gottes Handeln und der Reaktion der Väter hervor.
