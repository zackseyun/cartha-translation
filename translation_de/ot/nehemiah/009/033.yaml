source:
  edition: WLC
  text: וְ/אַתָּ֣ה צַדִּ֔יק עַ֖ל כָּל הַ/בָּ֣א עָלֵ֑י/נוּ כִּֽי אֱמֶ֥ת עָשִׂ֖יתָ וַ/אֲנַ֥חְנוּ הִרְשָֽׁעְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/033.yaml
  text: Yet you are righteous in all that has come upon us[a], for you have acted faithfully, but we have acted wickedly.
translation:
  language: de
  text: Doch du bist gerecht in allem, was über uns gekommen ist; denn du hast treu gehandelt[a], wir aber haben böse gehandelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „du hast Wahrheit getan“; im Sinn von: Du hast treu gehandelt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Doch du
  rationale: Die Konjunktion leitet im Zusammenhang einen Gegensatz zwischen Gottes Gerechtigkeit und Israels Schuld ein; „Doch du“ gibt diesen Kontrast natürlich wieder.
- source_word: צַדִּיק
  choice: gerecht
  rationale: Das Wort bezeichnet Gottes moralische Richtigkeit angesichts dessen, was Israel widerfahren ist, und bewahrt das theologische Gewicht des hebräischen Ausdrucks.
- source_word: עַל כָּל הַ/בָּא עָלֵי/נוּ
  choice: in allem, was über uns gekommen ist
  rationale: Die Wendung bezeichnet den Bereich, in dem Gottes Gerechtigkeit bekannt wird; „über uns gekommen“ entspricht zugleich dem hebräischen Bild und natürlichem biblischem Deutsch.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für die vorausgehende Aussage ein.
- source_word: אֱמֶת עָשִׂיתָ
  choice: du hast treu gehandelt
  rationale: Wörtlich steht „du hast Wahrheit getan“; in dieser Verbindung bezeichnet אֱמֶת zuverlässiges, treues Handeln. Die idiomatische Wiedergabe bewahrt diesen Sinn.
- source_word: וַ/אֲנַחְנוּ
  choice: wir aber
  rationale: Die Wortstellung mit „aber“ verdeutlicht den im Kontext gegebenen Gegensatz zu Gottes treuem Handeln.
- source_word: הִרְשָׁעְנוּ
  choice: haben gottlos gehandelt
  rationale: Die Hifil-Form bezeichnet schuldhaftes, böses Handeln. „Gottlos gehandelt“ gibt den religiös-moralischen Ernst wieder und bildet eine klare Parallele zu „treu gehandelt“.
theological_decisions:
- issue: Gottes Gerechtigkeit angesichts des über Israel gekommenen Unheils
  choice: Gott wird in allem, was über Israel gekommen ist, als gerecht bekannt.
  alternative: Gott hat Israel zu Recht bestraft.
  rationale: Der hebräische Text bekennt Gottes Gerechtigkeit in Bezug auf das Geschehene, legt aber die genaue Art oder Mechanik der Strafe nicht weiter aus. Die Übersetzung wahrt diese Spannung und vermeidet eine erklärende Erweiterung.
- issue: Bedeutung von אֱמֶת im Handeln Gottes
  choice: treu gehandelt
  alternative: Wahrheit getan
  rationale: Die hebräische Formulierung verbindet Wahrheit und Treue. Im Deutschen ist „treu gehandelt“ verständlich und idiomatisch; die Fußnote bewahrt die wörtliche Ausdrucksweise und damit die semantische Breite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wahrt den feierlichen Bekenntnischarakter und stellt Gottes treues Handeln dem schuldhaften Handeln des Volkes deutlich gegenüber.
