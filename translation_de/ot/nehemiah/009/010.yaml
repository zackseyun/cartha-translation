base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/010.yaml
  text: You performed signs and wonders against Pharaoh[a], against all his servants, and against all the people of his land, for you knew that they acted presumptuously against them. So you made a name for yourself, as it is to this day.
translation:
  language: de
  text: Du hast Zeichen und Wunder an Pharao[a], an allen seinen Dienern und am ganzen Volk seines Landes vollbracht; denn du wusstest, dass sie sich ihnen gegenüber vermessen verhielten. So hast du dir einen Namen gemacht, wie es bis heute der Fall ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: gegen Pharao. Die hebräische Präposition kann hier die Personen bezeichnen, an denen die Zeichen als Gericht vollzogen wurden, und zugleich eine gegen sie gerichtete Handlung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: du hast … vollbracht
  rationale: Das Verb bedeutet wörtlich „geben“ oder „setzen“; zusammen mit „Zeichen und Wunder“ gibt „vollbringen“ den idiomatischen Sinn im Deutschen natürlich wieder.
- source_word: אֹתֹת וּמֹפְתִים
  choice: Zeichen und Wunder
  rationale: Die geläufige Paarformel bewahrt sowohl den Hinweischarakter als auch den außergewöhnlichen Charakter der göttlichen Taten.
- source_word: בְּפַרְעֹה … וּבְכָל עֲבָדָיו … וּבְכָל עַם אַרְצוֹ
  choice: an Pharao … an allen seinen Dienern … am ganzen Volk seines Landes
  rationale: Die Präposition ב bezeichnet hier diejenigen, an denen die Zeichen als Gerichtstaten vollzogen wurden. „An“ ist im Deutschen natürlich und vermeidet eine einseitige Festlegung auf bloße Gegnerschaft.
- source_word: עֲבָדָיו
  choice: seinen Dienern
  rationale: Der Ausdruck kann Diener, Beamte oder Sklaven bezeichnen. „Diener“ bewahrt die Bedeutungsbreite im königlichen Kontext.
- source_word: כִּי יָדַעְתָּ
  choice: denn du wusstest
  rationale: Das erste כִּי führt die Begründung für Gottes Handeln ein.
- source_word: כִּי הֵזִידוּ עֲלֵיהֶם
  choice: dass sie vermessen gegen sie handelten
  rationale: Der Hifil von זוד bezeichnet stolzes, anmaßendes oder vermessenes Handeln. „Vermessen“ ist präzise und in würdigem modernem Deutsch verständlich; das Pronomen bleibt entsprechend dem Hebräischen erhalten.
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  choice: So hast du dir einen Namen gemacht
  rationale: Die deutsche Wendung bewahrt das hebräische Bild für das Erlangen bleibenden Ruhmes oder Ansehens.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: wie es bis heute der Fall ist
  rationale: Die Formulierung gibt den fortdauernden Bestand dieses Namens idiomatisch wieder.
theological_decisions:
- issue: Bezugswort von עֲלֵיהֶם („gegen sie“)
  choice: Das Pronomen bleibt unaufgelöst; im Zusammenhang bezieht es sich am ehesten auf Israel.
  alternative: Explizit „gegen dein Volk“ oder eine gegen Gott gerichtete Vermessenheit.
  rationale: Der Exoduszusammenhang legt Israel als Bezugswort nahe. Da der hebräische Text hier jedoch nur das Pronomen verwendet, vermeidet die Übersetzung eine ausdrückliche Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede Gottes bleibt im Singular. Der Satz folgt der hebräischen Gedankenfolge, ohne die Pronomenreferenz ausdrücklich aufzulösen.
