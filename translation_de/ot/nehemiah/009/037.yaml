  text: וּ/תְבוּאָתָ֣/הּ מַרְבָּ֗ה לַ/מְּלָכִ֛ים אֲשֶׁר נָתַ֥תָּה עָלֵ֖י/נוּ בְּ/חַטֹּאותֵ֑י/נוּ וְ/עַ֣ל גְּ֠וִיֹּתֵי/נוּ מֹשְׁלִ֤ים וּ/בִ/בְהֶמְתֵּ֨/נוּ֙ כִּ/רְצוֹנָ֔/ם וּ/בְ/צָרָ֥ה גְדוֹלָ֖ה אֲנָֽחְנוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/037.yaml
  text: Its abundant produce goes to the kings whom you have set over us because of our sins[a]. They rule over our bodies and over our livestock as they please[b], and we are in great distress.
translation:
  language: de
  text: Sein reicher Ertrag[a] fällt den Königen zu, die du wegen unserer Sünden über uns gesetzt hast. Sie herrschen über unsere Körper[b] und über unser Vieh, wie es ihnen gefällt, und wir sind in großer Bedrängnis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „seine Ernte“ oder „sein Erzeugnis“. Das Suffix bezieht sich auf das im vorherigen Vers genannte Land.
    reason: lexical_alternative
  - marker: b
    text: Oder „unsere Personen“; wörtlich steht im Hebräischen eine Bezeichnung für den Körper.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְבוּאָתָהּ מַרְבָּה
  choice: Sein reicher Ertrag
  rationale: תְּבוּאָה bezeichnet den Ertrag beziehungsweise die Feldfrucht des Landes; מַרְבָּה drückt hier Fülle oder Zunahme aus. Das deutsche Possessivpronomen verweist auf das im vorherigen Vers genannte Land.
- source_word: לַמְּלָכִים
  choice: fällt den Königen zu
  rationale: ל bezeichnet hier Richtung oder Begünstigung. Die Formulierung macht idiomatisch deutlich, dass der Ertrag den fremden Königen zugutekommt.
- source_word: אֲשֶׁר נָתַתָּה עָלֵינוּ
  choice: die du ... über uns gesetzt hast
  rationale: נתן mit עַל bezeichnet hier das Einsetzen beziehungsweise Stellen von Herrschern über andere und bewahrt die ausdrücklich genannte göttliche Handlung.
- source_word: בְּחַטֹּאותֵינוּ
  choice: wegen unserer Sünden
  rationale: Die Präposition ב ist im Zusammenhang kausal zu verstehen und nennt die Sünden als Grund der Unterwerfung.
- source_word: גְּוִיֹּתֵינוּ
  choice: unsere Körper
  rationale: גְּוִיָּה bezeichnet hier die leibliche Person unter fremder Verfügungsgewalt, nicht einen Leichnam. Die konkrete Körperbezeichnung des Hebräischen bleibt erhalten.
- source_word: מֹשְׁלִים
  choice: Sie herrschen
  rationale: Das Partizip beschreibt eine andauernde Herrschaft; „herrschen“ gibt dies direkt und im Klagezusammenhang angemessen wieder.
- source_word: וּבִבְהֶמְתֵּנוּ
  choice: über unser Vieh
  rationale: בְּהֵמָה bezeichnet kollektiv die domestizierten Nutztiere; „Vieh“ ist im Deutschen knapp und sachgerecht.
- source_word: כִּרְצוֹנָם
  choice: wie es ihnen gefällt
  rationale: Die Wendung bezeichnet die Ausübung von Macht nach dem eigenen Willen der Herrscher und wird natürlich wiedergegeben, ohne einen zusätzlichen Grad an Willkür ausdrücklich einzutragen.
- source_word: וּבְצָרָה גְדוֹלָה אֲנָחְנוּ
  choice: und wir sind in großer Bedrängnis
  rationale: צָרָה bezeichnet schwere Not oder Bedrängnis; die gewählte Formulierung wahrt Gewicht und gemeinschaftlichen Klagecharakter.
theological_decisions:
- issue: Göttliches Handeln bei der Fremdherrschaft
  choice: Gott hat die Könige wegen der Sünden des Volkes über es gesetzt.
  alternative: Gott habe ihre Herrschaft lediglich zugelassen oder billige damit alles Handeln dieser Könige.
  rationale: Das hebräische נָתַתָּה עָלֵינוּ schreibt Gott die Unterwerfung des Volkes unmittelbar als gerichtliches Handeln zu. Daraus folgt im Vers jedoch keine moralische Billigung dessen, was die Könige nach ihrem eigenen Willen tun.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Gedankengang, während „fällt ... zu“ und „wie es ihnen gefällt“ natürliche deutsche Wendungen bieten. Die konkrete Rede von den Körpern sowie die göttliche Urheberschaft der Unterordnung werden nicht abgeschwächt.
