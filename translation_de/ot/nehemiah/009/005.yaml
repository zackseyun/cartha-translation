source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ הַ/לְוִיִּ֡ם יֵשׁ֣וּעַ וְ֠/קַדְמִיאֵל בָּנִ֨י חֲשַׁבְנְיָ֜ה שֵׁרֵֽבְיָ֤ה הֽוֹדִיָּה֙ שְׁבַנְיָ֣ה פְתַֽחְיָ֔ה ק֗וּמוּ בָּרֲכוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם מִן הָ/עוֹלָ֖ם עַד הָ/עוֹלָ֑ם וִ/יבָֽרְכוּ֙ שֵׁ֣ם כְּבוֹדֶ֔/ךָ וּ/מְרוֹמַ֥ם עַל כָּל בְּרָכָ֖ה וּ/תְהִלָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/005.yaml
  text: Then the Levites—Jeshua[a], Kadmiel, Bani, Hashabneiah, Sherebiah, Hodiah, Shebaniah, and Pethahiah—said, “Stand up; bless Yahweh your God from everlasting to everlasting. Blessed be your glorious name[b], which is exalted above all blessing and praise.”
translation:
  language: de
  text: 'Dann sagten die Leviten – Jeschua, Kadmiël, Bani, Haschabneja, Scherebja, Hodija, Schebanja und Petachja –: »Steht auf und preist Jahwe, euren Gott, von Ewigkeit zu Ewigkeit! Und sie sollen deinen herrlichen Namen preisen[a], der über allen Segen und allen Lobpreis erhaben ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine Verbform der dritten Person Plural mit aufforderndem oder wünschendem Sinn: »Und sie sollen … preisen.« Der Wechsel von »ihr« zu »sie« bleibt im Hebräischen ohne ausdrücklich genanntes Bezugswort. Sinngemäß kann der Satz auch wiedergegeben werden: »Gepriesen sei dein herrlicher Name.«'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Dann sagten
  rationale: Das Waw mit der Erzählform führt die Handlung weiter; »Dann sagten« gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die bestimmte kultische Gruppenbezeichnung wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: יֵשׁוּעַ וְקַדְמִיאֵל בָּנִי חֲשַׁבְנְיָה שֵׁרֵבְיָה הוֹדִיָּה שְׁבַנְיָה פְתַחְיָה
  choice: Jeschua, Kadmiël, Bani, Haschabneja, Scherebja, Hodija, Schebanja und Petachja
  rationale: Die Personennamen werden nach geläufigen deutschen Transliterationsmustern wiedergegeben; das Trema in »Kadmiël« verhindert eine missverständliche Aussprache.
- source_word: קוּמוּ
  choice: Steht auf
  rationale: Der Imperativ Plural ruft die versammelte Gemeinde zu einer konkreten Handlung auf.
- source_word: בָּרֲכוּ
  choice: preist
  rationale: Das Piel von ברך bezeichnet bei Gott als Objekt das lobende Segnen beziehungsweise Preisen. »Preist« ist im heutigen Deutsch natürlich und vermeidet die mögliche Fehlvorstellung, Menschen verliehen Gott Segen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als Eigenname wiedergegeben.
- source_word: אֱלֹהֵיכֶם
  choice: euren Gott
  rationale: Die zweite Person Plural und die Zugehörigkeitsbeziehung werden direkt bewahrt.
- source_word: מִן הָעוֹלָם עַד הָעוֹלָם
  choice: von Ewigkeit zu Ewigkeit
  rationale: Die feste deutsche Wendung gibt die unbegrenzte Dauer des hebräischen Ausdrucks würdig und prägnant wieder.
- source_word: וִיבָרְכוּ
  choice: Und sie sollen … preisen
  rationale: Die Form ist dritte Person Plural und hat hier auffordernden beziehungsweise wünschenden Sinn. Die Übersetzung bewahrt den auffälligen Wechsel von der zweiten zur dritten Person, ohne einen im Hebräischen nicht genannten Bezug der dritten Person festzulegen.
- source_word: שֵׁם כְּבוֹדֶךָ
  choice: deinen herrlichen Namen
  rationale: Die attributive Wiedergabe ist natürliches Deutsch; wörtlicher lautet die Verbindung »den Namen deiner Herrlichkeit«.
- source_word: וּמְרוֹמַם
  choice: der … erhaben ist
  rationale: Die passive, prädikative Form beschreibt den Namen als über alles menschliche Preisen erhöht.
- source_word: עַל כָּל בְּרָכָה וּתְהִלָּה
  choice: über jeden Segensspruch und Lobpreis
  rationale: »Segensspruch« gibt בְּרָכָה im Kontext des an Gott gerichteten Segnens verständlich wieder; »Lobpreis« wahrt die eigenständige Bedeutung von תְּהִלָּה.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. Die Wiedergabe als »Jahwe« bewahrt den Charakter als persönlicher Bundesname, ohne ihn durch einen Titel zu ersetzen.
- issue: Subjekt und Aussageweise von וִיבָרְכוּ
  choice: Und sie sollen deinen herrlichen Namen preisen
  alternative: Gepriesen sei dein herrlicher Name
  rationale: Der masoretische Konsonanten- und Vokaltext hat eine Verbform der dritten Person Plural mit volitivem Sinn. Die Alternative ist im liturgischen Zusammenhang flüssiger, verwischt aber Numerus und Personenwechsel; deshalb bleibt dieser im Haupttext erhalten und wird in der Fußnote erläutert.
- issue: ברך mit Gott als Objekt
  choice: preisen
  alternative: segnen
  rationale: »Segnen« bildet die hebräische Wortwurzel formaler ab, kann im modernen Deutsch bei Gott als Objekt jedoch missverständlich wirken. »Preisen« gibt die kultische Handlung sachgemäß wieder; »Segensspruch« im Schlussglied erhält den Zusammenhang mit בְּרָכָה.
translation_notes:
  register: Moderne, würdige Gottesdienstsprache mit kurzen, verständlichen Sätzen. Die Namensreihe folgt deutschen Transliterationsgewohnheiten. Der ungewöhnliche Personenwechsel im zweiten Aufruf wird nicht geglättet; die Fußnote macht die grammatische Spannung transparent.
