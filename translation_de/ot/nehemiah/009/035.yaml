revisions:
- from: In ihrem Königreich, bei all deiner großen Güte[a], die du ihnen erwiesen hattest, und in dem weiten und fruchtbaren Land[b], das du ihnen überlassen hattest, dienten[c] sie dir dennoch nicht und wandten sich nicht von ihren bösen Taten ab[d].
  to: In ihrem Königreich, bei deiner großen Güte[a], die du ihnen erwiesen hast, und in dem weiten und fruchtbaren Land[b], das du vor sie gelegt hast, haben sie dir dennoch nicht gedient[c] und sich nicht von ihren bösen Taten abgewandt[d].
  rationale: Die Revision vermeidet die nicht erforderliche Vorzeitigkeit des Plusquamperfekts und ersetzt das besitzrechtlich gefärbte „überlassen“ durch „vor sie gelegt“, das die räumliche Bildlichkeit von לִפְנֵיהֶם bewahrt. Die Hauptaussage bleibt vollständig erhalten. „Dennoch“ ist als knappe Wiedergabe des im Satz und unmittelbaren Kontext angelegten Kontrasts vertretbar.
