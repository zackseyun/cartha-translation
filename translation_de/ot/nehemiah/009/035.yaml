  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird zutreffend erfasst: Israels Nicht-Dienen und Nicht-Abwenden steht den von Gott gegebenen Wohltaten und dem fruchtbaren Land gegenüber. Die deutschen Plusquamperfekta („erwiesen hattest“, „überlassen hattest“) gehen jedoch über die hebräischen Perfektformen hinaus, und „überlassen“ ist für נתת לפניהם stärker besitzrechtlich als der Text.'
  naturalness: Der Satz ist grundsätzlich verständlich und im würdigen Register gehalten. Eine durchgängig perfekte Vergangenheitsform wirkt im modernen Standarddeutsch flüssiger als die Mischung aus vorzeitigem Plusquamperfekt und Präteritum. Die Auslassung von „all“ vor „deiner großen Güte“ vermeidet zudem eine nicht ausdrücklich vorhandene Quantifizierung.
  terminology: „Königreich“, „große Güte“, „weites und fruchtbares Land“, „dienen“ und „böse Taten“ sind angemessen. „Dienen“ bewahrt die umfassende Bedeutung von עבד. Die Fußnote zu שׁוב sollte die deutsche Konstruktion korrekt als „sich von ... abwenden“ bzw. „von ... umkehren“ ausdrücken.
  issues:
  - severity: medium
    issue: Unbegründete Vorzeitigkeit in den beiden Relativsätzen
    rationale: Die hebräischen Formen נָתַתָּ sind hier einfache rückblickende Perfektformen. Das deutsche Plusquamperfekt kann zwar kontextuell möglich sein, legt aber eine zusätzliche zeitliche Staffelung nahe. Das Perfekt wahrt die retrospektive Aussage ohne diese Festlegung.
  - severity: medium
    issue: „überlassen“ für נתת לפניהם
    rationale: „Überlassen“ kann einen rechtlichen Verzicht oder eine bloße Nutzungsüberlassung nahelegen. „Vor sie gelegt hast“ gibt die Bildlichkeit von לפני und den Charakter göttlicher Bereitstellung unmittelbarer wieder.
  - severity: low
    issue: Fußnote d enthält eine unidiomatische Alternativformulierung
    rationale: „kehrten nicht um von ihren bösen Taten“ ist im Deutschen nicht die natürliche Verbindung. „kehrten nicht von ihren bösen Taten um“ oder „wandten sich nicht ... ab“ ist idiomatisch.
  revised_text: In ihrem Königreich, bei deiner großen Güte[a], die du ihnen erwiesen hast, und in dem weiten und fruchtbaren Land[b], das du vor sie gelegt hast, haben sie dir dennoch nicht gedient[c] und sich nicht von ihren bösen Taten abgewandt[d].
