  text: וְ/הֵ֣ם בְּ/מַלְכוּתָ/ם֩ וּ/בְ/טוּבְ/ךָ֨ הָ/רָ֜ב אֲשֶׁר נָתַ֣תָּ לָ/הֶ֗ם וּ/בְ/אֶ֨רֶץ הָ/רְחָבָ֧ה וְ/הַ/שְּׁמֵנָ֛ה אֲשֶׁר נָתַ֥תָּ לִ/פְנֵי/הֶ֖ם לֹ֣א עֲבָד֑וּ/ךָ וְֽ/לֹא שָׁ֔בוּ מִ/מַּֽעַלְלֵי/הֶ֖ם הָ/רָעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/035.yaml
  text: Even in their kingdom[a], and amid your great goodness that you gave them, and in the broad and fertile land that you set before them[d][c][b], they did not serve you and did not turn from their evil deeds.
translation:
  language: de
  text: In ihrem Königreich, bei deiner großen Güte[a], die du ihnen erwiesen hast, und in dem weiten und fruchtbaren Land[b], das du vor sie gelegt hast, haben sie dir dennoch nicht gedient[c] und sich nicht von ihren bösen Taten abgewandt[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei deinen reichen Gaben“ beziehungsweise „inmitten deiner überreichen Güte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das weite und fette Land“; „fett“ ist hier ein Bild für ein fruchtbares, ertragreiches Land.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „verehrten dich nicht“; das hebräische Verb kann sowohl Gottesverehrung als auch Dienst und Gehorsam bezeichnen.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „kehrten nicht von ihren bösen Taten um“; sinngemäß auch: „bereuten ihre bösen Taten nicht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַלְכוּתָם
  choice: in ihrem Königreich
  rationale: מַלְכוּת bezeichnet Königreich, Herrschaft oder Königtum. Im Zusammenhang ist das eigene Gemeinwesen unter ihrer Herrschaft gemeint; „in ihrem Königreich“ wahrt die knappe Formulierung.
- source_word: וּבְטוּבְךָ הָרָב
  choice: bei all deiner großen Güte
  rationale: טוּב umfasst Güte ebenso wie Wohlergehen und reiche Gaben. Die Wendung bewahrt den Bezug auf Gottes Güte und macht zugleich deutlich, dass Israel sie reichlich erfuhr.
- source_word: אֲשֶׁר נָתַתָּ לָהֶם
  choice: die du ihnen erwiesen hattest
  rationale: Wörtlich steht „die du ihnen gegeben hattest“. Bei „Güte“ ist „Güte erweisen“ im Deutschen natürlicher, ohne den Gedanken der göttlichen Zuwendung aufzugeben.
- source_word: אֶרֶץ הָרְחָבָה וְהַשְּׁמֵנָה
  choice: das weite und fruchtbare Land
  rationale: רְחָבָה bedeutet weit oder geräumig; שְׁמֵנָה heißt wörtlich „fett“ und bezeichnet bei einem Land idiomatisch Fruchtbarkeit und reichen Ertrag.
- source_word: אֲשֶׁר נָתַתָּ לִפְנֵיהֶם
  choice: das du ihnen überlassen hattest
  rationale: Die hebräische Wendung lautet wörtlich „das du vor sie gegeben hattest“. Im Zusammenhang bezeichnet sie das von Gott bereitgestellte und anvertraute Land; „überlassen“ gibt dies in natürlichem Deutsch wieder.
- source_word: לֹא עֲבָדוּךָ
  choice: dienten sie dir nicht
  rationale: עבד kann gegenüber Gott sowohl Dienst und Gehorsam als auch Gottesverehrung einschließen. „Dienen“ bewahrt diese Bedeutungsbreite.
- source_word: וְלֹא שָׁבוּ
  choice: und wandten sich nicht … ab
  rationale: שׁוב mit מִן bezeichnet hier das Abwenden von einem Verhalten. Die konkrete Bewegungsmetapher bleibt erhalten, statt sie unmittelbar mit „Buße tun“ auszulegen.
- source_word: מִמַּעַלְלֵיהֶם הָרָעִים
  choice: von ihren bösen Taten
  rationale: מַעֲלָלִים meint Taten, Handlungen oder Verhaltensweisen; „böse Taten“ ist klar, natürlich und gibt die moralische Wertung wieder.
theological_decisions:
- issue: Bedeutungsumfang von עבד im Verhältnis zu Gott
  choice: dienten sie dir nicht
  alternative: verehrten sie dich nicht
  rationale: Der hebräische Ausdruck kann Gottesverehrung und gehorsamen Bundesdienst zugleich umfassen. „Dienen“ hält diese theologische Breite offen.
- issue: Moralische Bedeutung von שׁוב מִן
  choice: wandten sich nicht von ihren bösen Taten ab
  alternative: taten nicht Buße für ihre bösen Taten
  rationale: Der Ausgangstext verwendet das konkrete Bild des Sich-Abwendens. Diese Wiedergabe bewahrt die Bildsprache und vermeidet eine unnötige begriffliche Verengung auf eine bestimmte Bußformel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange Satzbau des Hebräischen bleibt erkennbar, wird aber durch idiomatische Fügungen geglättet. „Dennoch“ verdeutlicht den im Kontext angelegten Gegensatz zwischen Gottes reichen Gaben und Israels ausbleibendem Dienst, ohne eine konfessionelle Deutung einzutragen.
