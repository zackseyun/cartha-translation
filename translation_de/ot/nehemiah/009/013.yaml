source:
  edition: WLC
  text: וְ/עַ֤ל הַר סִינַי֙ יָרַ֔דְתָּ וְ/דַבֵּ֥ר עִמָּ/הֶ֖ם מִ/שָּׁמָ֑יִם וַ/תִּתֵּ֨ן לָ/הֶ֜ם מִשְׁפָּטִ֤ים יְשָׁרִים֙ וְ/תוֹר֣וֹת אֱמֶ֔ת חֻקִּ֥ים וּ/מִצְוֺ֖ת טוֹבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/013.yaml
  text: You came down on Mount Sinai and spoke with them from heaven[a], and you gave them upright judgments, true laws[c][b], good statutes and commandments.
translation:
  language: de
  text: Du bist auf den Berg Sinai herabgekommen und hast vom Himmel aus mit ihnen geredet[a]. Du hast ihnen gerechte Rechtsbestimmungen, zuverlässige Weisungen[b], gute Satzungen und Gebote gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu ihnen geredet“. Wörtlich steht im Hebräischen „mit ihnen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Weisungen der Wahrheit“; auch möglich: „wahre Gesetze“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַר סִינַי יָרַדְתָּ
  choice: Du bist auf den Berg Sinai herabgekommen
  rationale: „Auf den Berg Sinai“ gibt עַל הַר סִינַי natürlich wieder; „herabgekommen“ bewahrt die anschauliche Bewegung von ירד in der direkten Anrede Gottes.
- source_word: וְדַבֵּר עִמָּהֶם מִשָּׁמָיִם
  choice: und hast vom Himmel aus mit ihnen geredet
  rationale: „Mit ihnen geredet“ bildet die Konstruktion דבר mit עִם eng ab. „Vom Himmel aus“ macht im Deutschen den Ausgangspunkt der Rede idiomatisch deutlich, ohne das Verhältnis zwischen Gottes Herabkommen und seiner himmlischen Rede aufzulösen.
- source_word: וַתִּתֵּן לָהֶם
  choice: Du hast ihnen … gegeben
  rationale: Dies ist eine natürliche deutsche Wiedergabe von נתן mit ל; ein neuer Hauptsatz erleichtert den langen deutschen Satz, ohne den Zusammenhang zu verändern.
- source_word: מִשְׁפָּטִים יְשָׁרִים
  choice: gerechte Rechtsordnungen
  rationale: מִשְׁפָּטִים bezeichnet hier rechtliche Bestimmungen bzw. Ordnungen; יְשָׁרִים bewertet sie als recht, aufrichtig oder gerecht. „Gerechte Rechtsordnungen“ ist im modernen Deutsch verständlich und hält den juristischen Sinn fest.
- source_word: וְתוֹרוֹת אֱמֶת
  choice: zuverlässige Weisungen
  rationale: Der Plural תוֹרוֹת kann einzelne Weisungen oder Unterweisungen bezeichnen. אֱמֶת hebt ihre Wahrheit, Beständigkeit und Verlässlichkeit hervor; „zuverlässig“ vermeidet im Deutschen den möglichen Eindruck, bloß faktisch richtige Gesetzesaussagen seien gemeint.
- source_word: חֻקִּים
  choice: Satzungen
  rationale: „Satzungen“ ist eine etablierte, würdige Wiedergabe für festgesetzte Bestimmungen und unterscheidet den Ausdruck von den übrigen Rechtsbegriffen.
- source_word: וּמִצְוֺת טוֹבִים
  choice: gute … Gebote
  rationale: „Gebote“ entspricht dem üblichen Sinn von מִצְוֺת; „gut“ bewahrt die schlichte positive Wertung von טוֹבִים. Im Hebräischen bezieht sich das maskuline Pluraladjektiv grammatisch auf beide vorausgehenden maskulinen Substantive, also Satzungen und Gebote.
theological_decisions:
- issue: Unterschiedliche Bezeichnungen für Gottes Recht am Sinai
  choice: Die vier Ausdrücke werden als „Rechtsordnungen“, „Weisungen“, „Satzungen“ und „Gebote“ unterschieden.
  alternative: Die Reihe könnte vereinheitlichend als „Gesetze und Gebote“ wiedergegeben werden.
  rationale: Die Häufung verschiedener Rechtsbegriffe ist ein Merkmal des hebräischen Textes und betont die umfassende Güte und Verlässlichkeit der am Sinai gegebenen Offenbarung. Eine differenzierte Wiedergabe vermeidet eine theologische Verengung.
- issue: Gottes Rede nach seinem Herabkommen
  choice: „vom Himmel aus mit ihnen geredet“ bleibt neben „auf den Berg Sinai herabgekommen“ stehen.
  alternative: Man könnte „vom Himmel her zu ihnen geredet“ formulieren und damit die Rede stärker als einseitige Verkündigung darstellen.
  rationale: Der Text verbindet beide Aussagen ohne Erklärung. Die Übersetzung bewahrt diese räumlich-theologische Spannung und löst sie nicht durch eine harmonisierende Zusatzdeutung auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtlichen Fachbegriffe bleiben unterschieden, sind aber für heutige Leser verständlich. Der Vers wird zur besseren Lesbarkeit in zwei Sätze gegliedert; die direkte Anrede und die parallele Struktur bleiben erhalten.
