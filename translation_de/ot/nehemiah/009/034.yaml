id: NEH.9.34
reference: Nehemiah 9:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶת מְלָכֵ֤י/נוּ שָׂרֵ֨י/נוּ֙ כֹּהֲנֵ֣י/נוּ וַ/אֲבֹתֵ֔י/נוּ לֹ֥א עָשׂ֖וּ תּוֹרָתֶ֑/ךָ וְ/לֹ֤א הִקְשִׁ֨יבוּ֙ אֶל מִצְוֺתֶ֔י/ךָ וּ/לְ/עֵ֣דְוֺתֶ֔י/ךָ אֲשֶׁ֥ר הַעִידֹ֖תָ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/034.yaml
  text: Even our kings[a], our officials, our priests, and our fathers did not keep your law[c][b], and they did not listen to your commandments and your testimonies with which you warned them.
translation:
  language: de
  text: Auch unsere Könige, unsere führenden Männer, unsere Priester und unsere Väter hielten sich nicht an dein Gesetz und achteten nicht auf deine Gebote und deine Zeugnisse[a], mit denen du sie gewarnt hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Zeugnisse“ bezeichnen Gottes feierliche Bundesbezeugungen und Mahnungen. Der letzte Satzteil kann auch wiedergegeben werden: „mit denen du gegen sie Zeugnis abgelegt hast“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Auch
  rationale: Die Konjunktion mit dem Objektzeichen führt in der Aufzählung eine weitere, hervorgehobene Gruppe ein; „Auch“ gibt diese additive Kraft im Deutschen natürlich wieder.
- source_word: מְלָכֵינוּ
  choice: unsere Könige
  rationale: Direkte Wiedergabe des Plurals mit Suffix der 1. Person Plural.
- source_word: שָׂרֵינוּ
  choice: unsere führenden Männer
  rationale: שָׂרִים bezeichnet politische oder administrative Führungsträger. Die Formulierung bleibt konkret und bewahrt hier den maskulinen Bezug, ohne das historisch weniger passende „Fürsten“ zu verwenden.
- source_word: כֹּהֲנֵינוּ
  choice: unsere Priester
  rationale: Übliche und genaue Wiedergabe von כֹּהֵן.
- source_word: וַאֲבֹתֵינוּ
  choice: und unsere Väter
  rationale: Die wörtliche Wiedergabe bewahrt die maskuline Form und den biblischen Ausdruck für die früheren Generationen Israels.
- source_word: לֹא עָשׂוּ תּוֹרָתֶךָ
  choice: hielten sich nicht an dein Gesetz
  rationale: עשה mit תּוֹרָה meint hier die praktische Befolgung. „Sich an das Gesetz halten“ ist modernes, idiomatisches Deutsch.
- source_word: הִקְשִׁיבוּ
  choice: achteten nicht auf
  rationale: Der Hifil von קשׁב bezeichnet aufmerksames Hören beziehungsweise Beachten; „auf etwas achten“ erfasst beides natürlich.
- source_word: מִצְוֺתֶיךָ
  choice: deine Gebote
  rationale: Die geläufige Bundesbezeichnung bleibt von „Gesetz“ und „Zeugnissen“ unterschieden.
- source_word: וּלְעֵדְוֺתֶיךָ
  choice: und deine Zeugnisse
  rationale: Die direkte Wiedergabe bewahrt die Bundes- und Zeugnissprache sowie die Wortstammverbindung zum folgenden Verb.
- source_word: אֲשֶׁר הַעִידֹתָ בָהֶם
  choice: mit denen du sie gewarnt hast
  rationale: Der Hifil von עוד hat hier den Sinn eines feierlichen Bezeugens beziehungsweise Warnens; „mit denen“ erhält die instrumentale Beziehung zu den Zeugnissen.
theological_decisions:
- issue: Wiedergabe von תּוֹרָה
  choice: dein Gesetz
  alternative: deine Weisung
  rationale: Im nationalen Bundesbekenntnis bezeichnet תּוֹרָה Gottes verbindliches Bundesgesetz; „Gesetz“ entspricht diesem Kontext, während „Weisung“ lexikalisch möglich bleibt.
- issue: Wiedergabe von אָבוֹת
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: „Väter“ bewahrt die ausdrückliche maskuline Form und den historischen biblischen Sprachgebrauch; „Vorfahren“ würde den generationsbezogenen Sinn natürlicher, aber weniger formal wiedergeben.
- issue: Verhältnis von עֵדוֹת und הֵעִיד
  choice: Zeugnisse, mit denen du sie gewarnt hast
  alternative: Zeugnisse, die du gegen sie abgelegt hast
  rationale: Die gewählte Fassung verbindet die Bundeszeugnisse mit ihrer warnenden Funktion, ohne den möglichen gerichtlichen Klang des hebräischen Wortspiels dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vier Führungskreise bleiben als parallele Aufzählung erhalten. „Führende Männer“ vermeidet das heute missverständliche „Fürsten“; „hielten sich an“ und „achteten auf“ geben die hebräischen Handlungs- und Aufmerksamkeitsverben idiomatisch wieder.
