id: NEH.9.31
reference: Nehemiah 9:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּֽ/בְ/רַחֲמֶ֧י/ךָ הָ/רַבִּ֛ים לֹֽא עֲשִׂיתָ֥/ם כָּלָ֖ה וְ/לֹ֣א עֲזַבְתָּ֑/ם כִּ֛י אֵֽל חַנּ֥וּן וְ/רַח֖וּם אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/031.yaml
  text: But in your abundant mercies you did not make an end of them or abandon them[a], for you are a gracious and compassionate God.
translation:
  language: de
  text: Doch in deinem großen Erbarmen hast du sie nicht völlig vernichtet und sie nicht verlassen,[a] denn du bist ein gnädiger und barmherziger Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hast du ihnen kein Ende gemacht und sie nicht im Stich gelassen“.'
    reason: Lexikalische Alternative für עשה כלה und עזב; sie bewahrt die hebräische Redeweise formaler.
lexical_decisions:
- source_word: וּבְרַחֲמֶיךָ הָרַבִּים
  choice: Doch in deinem großen Erbarmen
  rationale: רַחֲמִים bezeichnet Erbarmen bzw. Mitgefühl; הָרַבִּים verstärkt es. Das im Deutschen idiomatische Singular-Kollektiv „großes Erbarmen“ gibt die Fülle angemessen wieder. „Doch“ erfasst den adversativen Sinn des einleitenden Waw im Kontext.
- source_word: לֹא עֲשִׂיתָם כָּלָה
  choice: hast du sie nicht völlig vernichtet
  rationale: Die Wendung עשה כלה bedeutet, jemanden vollständig zugrunde zu richten oder ihm ein Ende zu machen. „Nicht völlig vernichtet“ ist im heutigen Deutsch klar und bewahrt sowohl den Vernichtungsaspekt als auch die durch כָּלָה ausgedrückte Vollständigkeit.
- source_word: וְלֹא עֲזַבְתָּם
  choice: und sie nicht verlassen
  rationale: עזב kann „verlassen“, „aufgeben“ oder „im Stich lassen“ bedeuten. „Verlassen“ ist natürlich, würdig und lässt die genaue Art des Nicht-Aufgebens offen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für Gottes Zurückhaltung ein; „denn“ bildet diese erklärende Beziehung flüssig ab.
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier die gewöhnliche Gottesbezeichnung. Eine Wiedergabe wie „mächtiger Gott“ würde einen im Kontext nicht eigens hervorgehobenen Bedeutungsaspekt verstärken.
- source_word: חַנּוּן
  choice: gnädig
  rationale: חַנּוּן bezeichnet Gottes gnädige Zuwendung und wird mit „gnädig“ von רַחוּם unterschieden.
- source_word: וְרַחוּם
  choice: und barmherzig
  rationale: רַחוּם bezeichnet mitfühlendes Erbarmen. „Barmherzig“ ist in modernem Standarddeutsch verständlich und bewahrt die vertraute, aber weiterhin natürliche Gottescharakterformel.
- source_word: אָתָּה
  choice: du bist
  rationale: Das selbstständige Pronomen betont das Subjekt des nominalen Satzes. Das Deutsche benötigt die Kopula; die direkte Form „du bist“ trägt die Aussage natürlich.
theological_decisions:
- issue: Wiedergabe der Gottescharakterformel חַנּוּן וְרַחוּם
  choice: gnädig und barmherzig
  alternative: gnädig und voller Erbarmen
  rationale: Die gewählte Form unterscheidet die beiden hebräischen Adjektive, bleibt zugleich nah an der etablierten biblischen Ausdrucksweise und fügt keine konfessionelle Deutung hinzu.
- issue: Funktion des einleitenden Waw
  choice: 'adversativ: „Doch“'
  alternative: 'additiv: „Und“'
  rationale: Im Zusammenhang steht Gottes großes Erbarmen im Gegensatz zu Israels zuvor geschilderter Auflehnung. „Doch“ macht diese im Hebräischen kontextuell angelegte Kontrastfunktion deutlich.
- issue: Reichweite von עשה כלה
  choice: „nicht völlig vernichtet“
  alternative: „ihnen kein Ende gemacht“
  rationale: Die Wendung beschreibt das Ausbleiben vollständiger Vernichtung. Die Übersetzung benennt dies klar, ohne eine bestimmte Art des Gerichts festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ markiert den Kontextkontrast; „großes Erbarmen“ ist idiomatischer als ein erzwungener deutscher Plural. Die bekannte Paarung „gnädig und barmherzig“ bleibt verständlich und wahrt die semantische Unterscheidung der hebräischen Adjektive.
