source:
  edition: WLC
  text: אַתָּה ה֣וּא יְהוָה֮ לְ/בַדֶּ/ךָ֒ את עָשִׂ֡יתָ אֶֽת הַ/שָּׁמַיִם֩ שְׁמֵ֨י הַ/שָּׁמַ֜יִם וְ/כָל צְבָאָ֗/ם הָ/אָ֜רֶץ וְ/כָל אֲשֶׁ֤ר עָלֶ֨י/הָ֙ הַ/יַּמִּים֙ וְ/כָל אֲשֶׁ֣ר בָּ/הֶ֔ם וְ/אַתָּ֖ה מְחַיֶּ֣ה אֶת כֻּלָּ֑/ם וּ/צְבָ֥א הַ/שָּׁמַ֖יִם לְ/ךָ֥ מִשְׁתַּחֲוִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/006.yaml
  text: You alone are Yahweh[a]. You made the heavens, the highest heavens and all their host, the earth and all that is on it, the seas and all that is in them; and you preserve all of them alive[c][b], and the host of heaven bows down to you.
translation:
  language: de
  text: Du allein bist Jahwe. Du hast die Himmel gemacht, die höchsten Himmel[a] und ihr ganzes Heer, die Erde und alles, was auf ihr ist, die Meere und alles, was in ihnen ist. Du erhältst sie alle am Leben[b], und das Heer des Himmels[c] wirft sich vor dir nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Himmel der Himmel“; eine hebräische Steigerungsform für die höchsten Himmel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Du gibst ihnen allen Leben“; auch möglich: „Du hältst sie alle am Leben“.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „das himmlische Heer“. Der Ausdruck kann himmlische Wesen, die Gestirne oder beides bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אַתָּה הוּא ... לְבַדֶּךָ
  choice: Du allein bist
  rationale: Die Formulierung gibt die emphatische und exklusive Aussage in natürlichem modernem Deutsch wieder.
- source_word: עָשִׂיתָ
  choice: hast ... gemacht
  rationale: Das allgemeinere Verb עשה wird direkt mit „machen“ wiedergegeben, ohne es auf das spezifischere „erschaffen“ zu verengen.
- source_word: הַשָּׁמַיִם
  choice: den Himmel
  rationale: Im Deutschen bezeichnet der Kollektivsingular „Himmel“ den kosmischen Bereich natürlich und idiomatisch.
- source_word: שְׁמֵי הַשָּׁמַיִם
  choice: den höchsten Himmel
  rationale: Die wörtliche Wendung „Himmel der Himmel“ dient hier als Steigerung; die idiomatische Bedeutung wird im Text wiedergegeben und die Form in der Fußnote genannt.
- source_word: צְבָאָם
  choice: sein ganzes Heer
  rationale: „Heer“ bewahrt die mögliche Weite des Begriffs zwischen Gestirnen und himmlischen Wesen; das Pronomen bezieht sich im Deutschen auf „Himmel“.
- source_word: הָאָרֶץ וְכָל אֲשֶׁר עָלֶיהָ
  choice: die Erde und alles, was auf ihr ist
  rationale: Im kosmischen Schöpfungskatalog meint אֶרֶץ die Erde insgesamt.
- source_word: הַיַּמִּים וְכָל אֲשֶׁר בָּהֶם
  choice: die Meere und alles, was in ihnen ist
  rationale: Die Wiedergabe folgt der hebräischen Mehrzahl und der dreigliedrigen Aufzählung.
- source_word: מְחַיֶּה אֶת כֻּלָּם
  choice: Du erhältst sie alle am Leben
  rationale: Das Partizip bezeichnet hier fortdauerndes lebenspendendes beziehungsweise lebenserhaltendes Handeln; die gewählte Formulierung ist natürlich und bewahrt den durativen Sinn.
- source_word: וּצְבָא הַשָּׁמַיִם
  choice: das Heer des Himmels
  rationale: Die formnahe Wendung lässt offen, ob vor allem himmlische Wesen, Gestirne oder die himmlische Gesamtheit gemeint sind.
- source_word: מִשְׁתַּחֲוִים
  choice: wirft sich vor dir nieder
  rationale: Die körperliche Geste der Huldigung und Anbetung wird konkret wiedergegeben.
theological_decisions:
- issue: Einzigkeit Jahwes
  choice: Du allein bist Jahwe
  alternative: Du bist Jahwe, du allein
  rationale: Die Stellung von „allein“ bei der Aussage über Jahwe bringt die Exklusivität klar und ohne zusätzliche dogmatische Erklärung zum Ausdruck.
- issue: Gottes fortdauerndes Handeln an der Schöpfung
  choice: Du erhältst sie alle am Leben
  alternative: Du gibst ihnen allen Leben
  rationale: Der Kontext geht vom Machen der Welt zu Gottes gegenwärtigem Handeln über. „Am Leben erhalten“ betont die Bewahrung, während die Fußnote die ebenfalls mögliche lebenspendende Nuance offenhält.
- issue: Identität des Heeres des Himmels
  choice: das Heer des Himmels
  alternative: das himmlische Heer
  rationale: Die formnahe Wiedergabe bewahrt die mögliche Bezugnahme auf himmlische Wesen und/oder Gestirne, statt die Aussage einseitig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der hebräischen Aufzählung, wird aber zur besseren Lesbarkeit in zwei Sätze gegliedert. „Heer“ bewahrt bewusst die Mehrdeutigkeit des hebräischen צבא.
