base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/020.yaml
  text: You gave your good Spirit to instruct them[a], and you did not withhold your manna from their mouth, and you gave them water for their thirst.
translation:
  language: de
  text: Du gabst ihnen deinen guten Geist, um sie zu unterweisen. Dein Manna hast du ihrem Mund nicht vorenthalten, und Wasser gabst du ihnen für ihren Durst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רוּחֲךָ הַטּוֹבָה
  choice: deinen guten Geist
  rationale: רוּחַ kann »Geist«, »Wind« oder »Atem« bedeuten. Im Zusammenhang mit göttlicher Unterweisung liegt »Geist« nahe; das Adjektiv »gut« wird unmittelbar bewahrt.
- source_word: לְהַשְׂכִּילָם
  choice: um sie zu unterweisen
  rationale: Der Hifil von שׂכל bezeichnet hier das Vermitteln von Einsicht oder Verständnis. »Unterweisen« gibt den kausativen Sinn natürlich und würdig wieder.
- source_word: מַנְךָ
  choice: dein Manna
  rationale: Das Wort bezeichnet die besondere Speise während der Wüstenwanderung; der geläufige Ausdruck »Manna« ist präzise und verständlich.
- source_word: מָנַעְתָּ מִפִּיהֶם
  choice: hast du ihrem Mund nicht vorenthalten
  rationale: Die konkrete hebräische Wendung »von ihrem Mund« wird als »ihrem Mund« bewahrt, statt sie zum bloßen »ihnen« zu glätten.
- source_word: מַיִם
  choice: Wasser
  rationale: Direkte und eindeutige deutsche Entsprechung.
- source_word: לִצְמָאָם
  choice: für ihren Durst
  rationale: Die Formulierung drückt aus, dass das Wasser ihren Durst als konkretes Bedürfnis stillen sollte, und bleibt nahe am Hebräischen.
theological_decisions:
- issue: Ob רוּחֲךָ הַטּוֹבָה als Gottes »Geist« oder als »Geist« im allgemeineren Sinn zu verstehen ist
  choice: deinen guten Geist
  alternative: deinen guten geist / deinen guten Geist im allgemeineren Sinn
  rationale: Der Zusammenhang göttlicher Führung und Unterweisung spricht wahrscheinlich für Gottes Geist. Da das Hebräische keine Großschreibung zur Kennzeichnung dieser Deutung kennt und רוּחַ mehrdeutig ist, wird die Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung wahrt den parallelen Aufbau des Hebräischen. »Ihrem Mund« erhält dessen konkrete Bildsprache; die Großschreibung von »Geist« wird als wahrscheinliche, aber nicht zwingende Deutung kenntlich gemacht.
