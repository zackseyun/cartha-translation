id: NEH.9.25
reference: Nehemiah 9:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יִּלְכְּד֞וּ עָרִ֣ים בְּצֻרוֹת֮ וַ/אֲדָמָ֣ה שְׁמֵנָה֒ וַ/יִּֽירְשׁ֡וּ בָּתִּ֣ים מְלֵֽאִים כָּל ט֠וּב בֹּר֨וֹת חֲצוּבִ֜ים כְּרָמִ֧ים וְ/זֵיתִ֛ים וְ/עֵ֥ץ מַאֲכָ֖ל לָ/רֹ֑ב וַ/יֹּאכְל֤וּ וַֽ/יִּשְׂבְּעוּ֙ וַ/יַּשְׁמִ֔ינוּ וַ/יִּֽתְעַדְּנ֖וּ בְּ/טוּבְ/ךָ֥ הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/025.yaml
  text: They captured fortified cities and fertile land[a], and took possession of houses full of every good thing, hewn cisterns, vineyards, olive trees, and fruit trees in abundance. So they ate and were filled and grew fat[c][b], and they delighted themselves in your great goodness.
translation:
  language: de
  text: Sie nahmen befestigte Städte und fruchtbares Land[a] ein und brachten Häuser in ihren Besitz, die mit allem Guten gefüllt waren, dazu ausgehauene Zisternen, Weinberge, Ölbäume und Obstbäume in großer Zahl. Sie aßen, wurden satt und wohlgenährt[b] und genossen deine große Güte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fettes Land“; gemeint ist reiches, ertragreiches Land.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wurden fett“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּ
  choice: nahmen … ein
  rationale: לכד bezeichnet im militärischen Zusammenhang das Einnehmen oder Erobern; „nahmen … ein“ ist im Deutschen natürlich und präzise.
- source_word: עָרִים בְּצֻרוֹת
  choice: befestigte Städte
  rationale: בצר bezeichnet hier die Befestigung der Städte.
- source_word: אֲדָמָה שְׁמֵנָה
  choice: fruchtbares Land
  rationale: Wörtlich „fettes Land“; die hebräische Wendung meint ertragreiches, fruchtbares Land. Die wörtliche Bildform wird in der Fußnote bewahrt.
- source_word: וַיִּירְשׁוּ
  choice: brachten … in ihren Besitz
  rationale: ירשׁ kann erben, in Besitz nehmen oder Besitz ergreifen bedeuten. Hier steht die Aneignung nach der Einnahme im Vordergrund.
- source_word: בָּתִּים מְלֵאִים כָּל טוּב
  choice: Häuser …, die mit allem Guten gefüllt waren
  rationale: Die Formulierung bewahrt den umfassenden Sinn von כָּל טוּב und ist in modernem Deutsch klar.
- source_word: בֹּרוֹת חֲצוּבִים
  choice: ausgehauene Zisternen
  rationale: בּוֹר bezeichnet hier Wasserspeicher; חצוב bedeutet aus Fels oder Boden gehauen. Ein nicht ausdrücklich vorhandenes „bereits“ wird vermieden.
- source_word: כְּרָמִים וְזֵיתִים וְעֵץ מַאֲכָל
  choice: Weinberge, Ölbäume und Obstbäume
  rationale: Die landwirtschaftlichen Güter werden konkret und idiomatisch wiedergegeben; זֵיתִים bezeichnet in diesem Kontext Ölbäume.
- source_word: לָרֹב
  choice: in großer Zahl
  rationale: Die Wendung bezeichnet die große Menge der unmittelbar zuvor genannten Anlagen und Bäume.
- source_word: וַיֹּאכְלוּ וַיִּשְׂבְּעוּ
  choice: Sie aßen, wurden satt
  rationale: שׂבע bedeutet, sich satt zu essen beziehungsweise gesättigt zu sein.
- source_word: וַיַּשְׁמִינוּ
  choice: wurden … wohlgenährt
  rationale: Das Verb bedeutet wörtlich „fett werden“. „Wohlgenährt“ erhält das körperliche Bild der Fülle, ohne im heutigen Deutsch unnötig abwertend zu klingen; die wörtlichere Möglichkeit steht in der Fußnote.
- source_word: וַיִּתְעַדְּנוּ
  choice: genossen
  rationale: Das Hitpael von עדן bezeichnet hier ein Leben in Genuss und Behagen; „genossen“ ist natürlich und lässt den positiven Zusammenhang der göttlichen Gabe bestehen.
theological_decisions:
- issue: Bedeutung von בְּטוּבְךָ הַגָּדוֹל
  choice: deine große Güte
  alternative: deine große Fülle / deinen großen Reichtum
  rationale: טוּב kann sowohl Güte als auch die daraus hervorgehende Fülle von Gutem bezeichnen. „Güte“ hält die materielle Versorgung und Gottes wohltätiges Handeln zusammen, ohne den Ausdruck auf Wohlstand zu verengen.
- issue: Mögliche Wertung von וַיַּשְׁמִינוּ
  choice: wurden wohlgenährt
  alternative: wurden fett
  rationale: Im unmittelbaren Kontext beschreibt das Wort zunächst die Folge reichlicher Versorgung. Eine moralische Verurteilung wird nicht in den Vers hineingetragen, während das konkrete Körperbild erkennbar bleibt.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die Reihung des Hebräischen bleibt erkennbar, wird aber syntaktisch natürlich gestaltet. Das anschauliche „fettes Land“ und die wörtliche Körpermetapher „wurden fett“ werden wegen ihrer möglichen modernen Nebenbedeutungen in Fußnoten dokumentiert.
