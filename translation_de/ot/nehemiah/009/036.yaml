  text: הִנֵּ֛ה אֲנַ֥חְנוּ הַ/יּ֖וֹם עֲבָדִ֑ים וְ/הָ/אָ֜רֶץ אֲשֶׁר נָתַ֣תָּה לַ/אֲבֹתֵ֗י/נוּ לֶ/אֱכֹ֤ל אֶת פִּרְיָ/הּ֙ וְ/אֶת טוּבָ֔/הּ הִנֵּ֛ה אֲנַ֥חְנוּ עֲבָדִ֖ים עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/036.yaml
  text: Look[a], today we are servants; and in the land that you gave to our fathers to eat its fruit and its good things, look[c][b], we are servants on it.
translation:
  language: de
  text: 'Sieh doch: Heute sind wir Sklaven.[a] Und das Land, das du unseren Vätern gegeben hast, damit sie seine Früchte und seine guten Gaben essen konnten – sieh doch: Auf diesem Land sind wir Sklaven.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Knechte. Das hebräische Wort bezeichnet Menschen, die anderen unterworfen sind; hier steht wahrscheinlich die Unfreiheit unter fremder Herrschaft im Vordergrund.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: Auf ihm sind wir Sklaven. Gemeint ist das Land, das Gott unseren Vätern gegeben hatte.'
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Die Aufmerksamkeitspartikel hebt die Klage nachdrücklich hervor. „Sieh doch“ klingt im heutigen Deutsch natürlich und bewahrt ihre hinweisende Kraft; die Wiederholung des Hebräischen bleibt erhalten.
- source_word: הַיּוֹם
  choice: heute
  rationale: Die Zeitangabe stellt die gegenwärtige Knechtschaft dem früheren Geschenk des Landes gegenüber.
- source_word: עֲבָדִים
  choice: Sklaven
  rationale: Im Zusammenhang bezeichnet das Wort nicht bloß Diener, sondern Menschen unter fremder Herrschaft und ohne politische Freiheit. „Sklaven“ bringt die beklagte Unterworfenheit deutlich zum Ausdruck.
- source_word: וְהָאָרֶץ אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: Und das Land, das du unseren Vätern gegeben hast
  rationale: Die Formulierung bewahrt die direkte Anrede Gottes und die ausdrücklich männliche Bezeichnung der Vorväter. Das Land wird entsprechend der hebräischen Satzstruktur als vorangestelltes Thema aufgenommen.
- source_word: לֶאֱכֹל
  choice: damit sie … genießen können
  rationale: Der Infinitiv bezeichnet den Zweck der Landgabe. „Genießen können“ gibt hier das Essen der reichen Erträge idiomatisch wieder, ohne den Sinn auf bloße Nahrungsaufnahme zu verengen.
- source_word: פִּרְיָהּ
  choice: seine Früchte
  rationale: Die landwirtschaftliche Bildsprache bleibt erhalten; der Singular hat im Hebräischen kollektiven Sinn.
- source_word: טוּבָהּ
  choice: seine guten Gaben
  rationale: Das Wort kann die Güte, das Gute oder den reichen Ertrag des Landes bezeichnen. „Gute Gaben“ wahrt die Breite und passt zum Zusammenhang der Landgabe.
- source_word: עָלֶיהָ
  choice: auf diesem Land
  rationale: 'Die wörtliche Ortsangabe „auf ihm“ wird mit wiederholtem Substantiv verständlich wiedergegeben. Dadurch bleibt die bittere Ironie erhalten: Gerade auf dem von Gott geschenkten Land leben sie als Sklaven.'
theological_decisions:
- issue: Bedeutung von עֲבָדִים in der Bundesklage
  choice: Sklaven
  alternative: Knechte
  rationale: Die Klage gilt der Unterwerfung unter eine fremde Reichsmacht im eigenen Land. „Sklaven“ macht den Verlust der Freiheit deutlicher; die mögliche allgemeinere Wiedergabe „Knechte“ wird in einer Fußnote genannt.
- issue: Bezeichnung לַאֲבֹתֵינוּ
  choice: unseren Vätern
  alternative: unseren Vorfahren
  rationale: Das Hebräische verwendet ausdrücklich die männliche Verwandtschaftsbezeichnung. Die Übersetzung bewahrt diese Form, ohne darüber hinaus eine bestimmte Gruppe von Vätern festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Aufmerksamkeitspartikel und die Wiederholung von „Sklaven“ bleiben als tragende Elemente der Klage erhalten. Der Gedankenstrich bildet die hebräische Themenkonstruktion lesbar ab, ohne die Spannung zwischen geschenktem Land und gegenwärtiger Unterwerfung aufzulösen.
