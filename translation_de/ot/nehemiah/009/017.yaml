source:
  edition: WLC
  text: וַ/יְמָאֲנ֣וּ לִ/שְׁמֹ֗עַ וְ/לֹא זָכְר֤וּ נִפְלְאֹתֶ֨י/ךָ֙ אֲשֶׁ֣ר עָשִׂ֣יתָ עִמָּ/הֶ֔ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וַ/יִּתְּנוּ רֹ֛אשׁ לָ/שׁ֥וּב לְ/עַבְדֻתָ֖/ם בְּ/מִרְיָ֑/ם וְ/אַתָּה֩ אֱל֨וֹהַּ סְלִיח֜וֹת חַנּ֧וּן וְ/רַח֛וּם אֶֽרֶךְ אַפַּ֥יִם וְ/רַב ו/חסד וְ/לֹ֥א עֲזַבְתָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/017.yaml
  text: But they refused to listen and did not remember your wonders that you had done among them. They stiffened their necks and, in their rebellion, appointed a leader to return to their slavery. But you are a forgiving God[a], gracious and compassionate, slow to anger and abundant in steadfast love, and you did not forsake them.
translation:
  language: de
  text: Doch sie weigerten sich zu hören und dachten nicht an deine Wunder, die du unter ihnen getan hattest. Sie wurden halsstarrig[a] und bestimmten in ihrer Auflehnung einen Anführer, um in ihre Sklaverei zurückzukehren. Du aber bist ein Gott, der reichlich vergibt[b], gnädig und barmherzig, langsam zum Zorn und reich an beständiger Liebe, und du hast sie nicht verlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie machten ihren Nacken steif.“ Das Bild bezeichnet hartnäckigen Widerstand.'
    reason: Hebräisches Körperbild, das in natürlichem Deutsch sonst verloren ginge.
  - marker: b
    text: 'Wörtlich: „ein Gott der Vergebungen“. Der hebräische Plural hebt die Fülle der Vergebung hervor.'
    reason: Die ungewöhnliche Quellform und ihre intensivierende Wirkung werden transparent gemacht.
lexical_decisions:
- source_word: וַיְמָאֲנוּ לִשְׁמֹעַ
  choice: sie weigerten sich zu hören
  rationale: Bewahrt die Grundbedeutung von מָאֵן und lässt die in שׁמע mögliche Nuance des Gehorsams unausgesprochen mitschwingen.
- source_word: נִפְלְאֹתֶיךָ
  choice: deine Wunder
  rationale: Gibt die außergewöhnlichen, Staunen hervorrufenden Taten Gottes knapp und geläufig wieder.
- source_word: עָשִׂיתָ עִמָּהֶם
  choice: die du unter ihnen getan hattest
  rationale: „Unter ihnen“ entspricht dem möglichen gemeinschaftlichen Sinn von עִם; das Plusquamperfekt verdeutlicht den zeitlichen Rückblick.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: sie verhärteten sich
  rationale: Natürliches modernes Deutsch für das hebräische Bild vom steif gemachten Nacken; das Bild wird in einer Fußnote offengelegt.
- source_word: וַיִּתְּנוּ רֹאשׁ
  choice: sie bestimmten einen Anführer
  rationale: Gibt die Wendung „einen Kopf einsetzen“ idiomatisch als Einsetzung einer Führungsperson wieder.
- source_word: לָשׁוּב לְעַבְדֻתָם
  choice: um in ihre Sklaverei zurückzukehren
  rationale: עַבְדוּת bezeichnet hier im Exoduszusammenhang eindeutig Knechtschaft beziehungsweise Sklaverei.
- source_word: בְּמִרְיָם
  choice: in ihrer Auflehnung
  rationale: Die Umstandsangabe wird bei der Bestimmung des Anführers platziert, ohne sie kausal enger festzulegen.
- source_word: אֱלוֹהַּ סְלִיחוֹת
  choice: ein Gott, der reichlich vergibt
  rationale: Natürliches Deutsch, das den intensivierenden Plural סְלִיחוֹת als Fülle göttlicher Vergebung ausdrückt.
- source_word: חַנּוּן וְרַחוּם
  choice: gnädig und barmherzig
  rationale: Die geläufige deutsche Wortpaarung hält Gnade und mitfühlendes Erbarmen auseinander.
- source_word: אֶרֶךְ אַפַּיִם
  choice: langsam zum Zorn
  rationale: Etablierte idiomatische Wiedergabe der wörtlichen Wendung „lang der Nase“.
- source_word: רַב־חֶסֶד
  choice: reich an beständiger Liebe
  rationale: חֶסֶד verbindet liebevolle Zuwendung mit Treue und Verlässlichkeit; „beständige Liebe“ wahrt beide Aspekte, ohne den Begriff auf eine dogmatische Fachbedeutung zu verengen.
- source_word: וְלֹא עֲזַבְתָּם
  choice: und du hast sie nicht verlassen
  rationale: Direkte, natürliche Wiedergabe von עזב mit seinem relationalen Gewicht.
theological_decisions:
- issue: Intensivierender Plural in אֱלוֹהַּ סְלִיחוֹת
  choice: ein Gott, der reichlich vergibt
  alternative: ein Gott der Vergebungen
  rationale: Die gewählte Form wahrt die betonte Fülle der Vergebung, vermeidet aber eine im Deutschen missverständliche oder unnatürliche Pluralbildung; die Form des Hebräischen wird in der Fußnote genannt.
- issue: Bedeutungsumfang von חֶסֶד
  choice: beständige Liebe
  alternative: Güte; Bundestreue; Huld
  rationale: „Beständige Liebe“ erhält sowohl die Zuwendung als auch die verlässliche Treue, ohne eine einzige theologische Deutung des vielschichtigen Begriffs festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax bleibt nah am hebräischen Gedankengang, während undurchsichtige Wendungen idiomatisch wiedergegeben und nötigenfalls durch Fußnoten erschlossen werden.
