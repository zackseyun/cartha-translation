  text: וַ/יָּ֜קָם עַֽל מַֽעֲלֵ֣ה הַ/לְוִיִּ֗ם יֵשׁ֨וּעַ וּ/בָנִ֜י קַדְמִיאֵ֧ל שְׁבַנְיָ֛ה בֻּנִּ֥י שֵׁרֵבְיָ֖ה בָּנִ֣י כְנָ֑נִי וַֽ/יִּזְעֲקוּ֙ בְּ/ק֣וֹל גָּד֔וֹל אֶל יְהוָ֖ה אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/004.yaml
  text: Then Jeshua[a], Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani, and Kenani stood on the platform of the Levites, and they cried out with a loud voice to Yahweh their God.
translation:
  language: de
  text: Da standen Jeschua, Bani, Kadmiel, Schebanja, Bunni, Scherebja, Bani und Kenani auf dem Aufgang der Leviten[a] und schrien mit lauter Stimme zu Jahwe, ihrem Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »auf dem Aufgang der Leviten«. Das Wort kann einen Aufgang, eine Treppe, eine Stufe oder einen erhöhten Ort bezeichnen.'
    reason: Die bauliche Bedeutung von מַעֲלֵה ist im Kontext nicht sicher bestimmbar.
lexical_decisions:
- source_word: וַיָּקָם
  choice: stellten sich
  rationale: Das Verb קום bezeichnet hier das Einnehmen einer stehenden Position; der deutsche Plural richtet sich natürlich nach der folgenden Namensreihe.
- source_word: מַעֲלֵה הַלְוִיִּם
  choice: auf die Erhöhung der Leviten
  rationale: מַעֲלֵה kann einen Aufgang, eine Treppe oder einen erhöhten Ort bezeichnen. »Erhöhung« bewahrt die räumliche Grundbedeutung, ohne die konkrete Bauform festzulegen.
- source_word: יֵשׁוּעַ וּבָנִי קַדְמִיאֵל שְׁבַנְיָה בֻּנִּי שֵׁרֵבְיָה בָּנִי כְנָנִי
  choice: Jeschua, Bani, Kadmiël, Schebanja, Bunni, Scherebja, Bani und Kenani
  rationale: Die Personennamen werden nach üblichen deutschen Transliterationstraditionen wiedergegeben; das zweimalige Bani bleibt entsprechend dem hebräischen Text erhalten.
- source_word: וַיִּזְעֲקוּ
  choice: schrien
  rationale: זעק bezeichnet einen eindringlichen, lauten Ruf, hier ausdrücklich an Gott gerichtet.
- source_word: בְּקוֹל גָּדוֹל
  choice: mit lauter Stimme
  rationale: Die konkrete hebräische Wendung wird in natürlichem, würdigem Deutsch wiedergegeben.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: Der im hebräischen Text stehende Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: אֱלֹהֵיהֶם
  choice: ihrem Gott
  rationale: Das Possessivsuffix wird direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift »Jahwe« macht den im Ausgangstext ausdrücklich verwendeten Eigennamen sichtbar, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die unklare räumliche Bezeichnung wird im Text nicht vorschnell als »Podest« festgelegt; die Fußnote nennt die konkreteren Möglichkeiten.
