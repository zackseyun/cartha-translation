review_pass:
  verdict: revise
  source_fidelity: Die Namensfolge einschließlich des zweimaligen Bani, der intensive Ruf und die Anrede an Jahwe, ihren Gott, entsprechen dem hebräischen Text. Die Ortsangabe מַעֲלֵה הַלְוִיִּם ist jedoch baulich nicht eindeutig und sollte im deutschen Haupttext nicht durch »Erhöhung« unnötig konkretisiert werden. Zudem gibt »stellten sich ... auf die Erhöhung« eher eine Bewegung auf einen Ort als das im Kontext gemeinte Stehen an diesem Ort wieder.
  naturalness: »Da standen ... auf dem Aufgang der Leviten« ist syntaktisch klar und wahrt die offenbleibende Bedeutung. Die Fußnote erläutert das in modernem Standarddeutsch verständlich. »Kadmiel« ohne Trema folgt der im Deutschen üblichen biblischen Namenschreibung.
  terminology: »Jahwe« gibt den Gottesnamen יהוה direkt wieder. »Jeschua«, »Schebanja« und »Scherebja« sind etablierte deutsche Namensformen; die Wiederholung von »Bani« bleibt erhalten.
  issues:
  - severity: medium
    issue: Die Formulierung »stellten sich ... auf die Erhöhung«
    rationale: Sie legt eine Bewegung auf einen Ort nahe und verbindet sich wegen des Akkusativs weniger genau mit dem statischen Ortsbezug von עַל nach וַיָּקָם. »standen ... auf dem« ist hier genauer und idiomatischer.
  - severity: low
    issue: »Erhöhung« als Wiedergabe von מַעֲלֵה
    rationale: Der Ausdruck kann Aufgang, Stufe oder Treppe meinen. »Erhöhung« ist möglich, wirkt aber als konkrete bauliche Deutung. »Aufgang« hält die lexikalische Offenheit besser fest; die Fußnote erläutert die Optionen.
  - severity: low
    issue: Schreibung »Kadmiël«
    rationale: »Kadmiel« ist die geläufige deutsche biblische Namensform; das Trema ist weder für die Quellenbindung noch für die deutsche Lesbarkeit erforderlich.
