source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ הַ/בָּנִים֙ וַ/יִּֽירְשׁ֣וּ אֶת הָ/אָ֔רֶץ וַ/תַּכְנַ֨ע לִ/פְנֵי/הֶ֜ם אֶת יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ הַ/כְּנַ֣עֲנִ֔ים וַֽ/תִּתְּנֵ֖/ם בְּ/יָדָ֑/ם וְ/אֶת מַלְכֵי/הֶם֙ וְ/אֶת עַֽמְמֵ֣י הָ/אָ֔רֶץ לַ/עֲשׂ֥וֹת בָּ/הֶ֖ם כִּ/רְצוֹנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/024.yaml
  text: So the sons came in and took possession of the land[a], and you subdued before them the inhabitants of the land, the Canaanites, and gave them into their hand, both their kings and the peoples of the land[c][b], to do with them according to their will.
translation:
  language: de
  text: Da kamen die Söhne[a] und nahmen das Land in Besitz. Du unterwarfst ihnen die Bewohner des Landes, die Kanaaniter, und gabst sie in ihre Hand[b], ebenso ihre Könige und die Völker des Landes, sodass sie mit ihnen tun konnten, was sie wollten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „die Söhne“; gemeint sind die Nachkommen Israels, die in das Land kamen. Möglich ist auch „die Kinder“ oder deutender „die Israeliten“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gabst sie in ihre Gewalt“. Das Hebräische lautet wörtlich „gabst sie in ihre Hand“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „um mit ihnen nach ihrem Willen zu handeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּנִים
  choice: die Söhne
  rationale: Die wörtliche Wiedergabe bewahrt die familiäre und genealogische Ausdrucksweise des Hebräischen. Gemeint sind im Zusammenhang die Nachkommen Israels, die in das Land kamen.
- source_word: וַיִּירְשׁוּ אֶת הָאָרֶץ
  choice: nahmen das Land in Besitz
  rationale: ירשׁ bezeichnet hier im Zusammenhang mit dem Land dessen Besitzergreifung. Die Formulierung ist im modernen Deutschen natürlich und vermeidet den möglichen Eindruck eines lediglich passiv empfangenen Erbes.
- source_word: וַתַּכְנַע לִפְנֵיהֶם
  choice: du unterwarfst ihnen
  rationale: כנע beschreibt hier Gottes Handeln, durch das die Bewohner Kanaans unter Israels Gewalt kamen. „Unterwerfen“ erhält die militärisch-politische Stärke des Ausdrucks; „ihnen“ gibt לִפְנֵיהֶם knapp und idiomatisch wieder.
- source_word: יֹשְׁבֵי הָאָרֶץ הַכְּנַעֲנִים
  choice: die Bewohner des Landes, die Kanaaniter
  rationale: Die Wiedergabe erhält sowohl die allgemeine Bezeichnung der Bewohner als auch ihre ausdrückliche Identifizierung als Kanaaniter.
- source_word: וַתִּתְּנֵם בְּיָדָם
  choice: gabst sie in ihre Hand
  rationale: Die hebräische Hand-Metapher für Macht und Verfügungsgewalt bleibt erhalten und ist auch im Deutschen verständlich.
- source_word: מַלְכֵיהֶם
  choice: ihre Könige
  rationale: Das Suffix bezieht sich am natürlichsten auf die zuvor genannten Bewohner beziehungsweise Kanaaniter.
- source_word: עַמְמֵי הָאָרֶץ
  choice: die Völker des Landes
  rationale: Der Plural „Völker“ bildet עַמְמֵי ab und lässt die Mehrzahl der im Land ansässigen Volksgruppen erkennen.
- source_word: לַעֲשׂוֹת בָּהֶם כִּרְצוֹנָם
  choice: sodass sie mit ihnen tun konnten, was sie wollten
  rationale: Die Formulierung gibt die eingeräumte Verfügungsgewalt natürlich wieder. Das hebräische כִּרְצוֹנָם bezeichnet das Handeln nach ihrem Willen beziehungsweise Belieben.
theological_decisions:
- issue: Bezug von „die Söhne“
  choice: Die familiäre Bezeichnung wird beibehalten und auf die Nachkommen Israels bezogen, die in Kanaan einzogen.
  alternative: „die Nachkommen“, „die Kinder“ oder deutender „die Israeliten“
  rationale: Der hebräische Text verwendet hier genealogische Sprache und keinen ausdrücklichen Volksnamen. „Die Söhne“ wahrt die Verbindung zu den zuvor erwähnten Vätern, während die Fußnote den gemeinten Bezug erklärt.
- issue: Stärke der Eroberungssprache
  choice: Gottes Handeln wird ausdrücklich als Unterwerfung und Übergabe in Israels Gewalt wiedergegeben.
  alternative: Abschwächende Formulierungen wie „du halfst ihnen, sie zu besiegen“
  rationale: Der Vers schreibt den Erfolg der Landnahme unmittelbar Gottes Handeln zu. Die kräftige militärisch-politische Aussage des hebräischen Textes wird weder gemildert noch über ihre Formulierung hinaus ausgeweitet.
- issue: Umfang der israelitischen Verfügungsgewalt
  choice: „sodass sie mit ihnen tun konnten, was sie wollten“
  alternative: „um an ihnen nach ihrem Willen zu handeln“
  rationale: Die gewählte Formulierung bewahrt die unbequeme Weite der Aussage, ohne sie moralisch zu erläutern oder einzuschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Die bewusst starke Sprache von Unterwerfung, Machtübergabe und freier Verfügung bleibt erhalten; die hebräische Hand-Metapher wird im Haupttext bewahrt.
