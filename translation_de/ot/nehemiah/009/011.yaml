  text: וְ/הַ/יָּם֙ בָּקַ֣עְתָּ לִ/פְנֵי/הֶ֔ם וַ/יַּֽעַבְר֥וּ בְ/תוֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָׁ֑ה וְֽ/אֶת רֹ֨דְפֵי/הֶ֜ם הִשְׁלַ֧כְתָּ בִ/מְצוֹלֹ֛ת כְּמוֹ אֶ֖בֶן בְּ/מַ֥יִם עַזִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/011.yaml
  text: You split the sea before them[a], and they passed through the midst of the sea on dry ground[b]; and you threw their pursuers into the depths like a stone in mighty waters.
translation:
  language: de
  text: Du hast das Meer vor ihnen gespalten[a], und sie zogen mitten durch das Meer über trockenen Boden. Ihre Verfolger aber hast du in die Tiefen geschleudert wie einen Stein in mächtigen Wassern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: geteilt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַעְתָּ
  choice: gespalten
  rationale: Das Verb בקע bezeichnet ein Spalten oder Aufbrechen. „Gespalten“ gibt die konkrete, kraftvolle Handlung natürlich und präzise wieder.
- source_word: לִפְנֵיהֶם
  choice: vor ihnen
  rationale: Die Verbindung mit פָּנִים bedeutet hier idiomatisch „vor ihnen“ und bewahrt die räumliche Perspektive.
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: und sie zogen mitten durch das Meer
  rationale: עבר beschreibt das Hindurchziehen; בְתוֹךְ bezeichnet das Innere beziehungsweise die Mitte. Die Formulierung bewahrt beides in natürlichem Deutsch.
- source_word: בַּיַּבָּשָׁה
  choice: über trockenen Boden
  rationale: Das substantivierte Adjektiv bezeichnet das Trockene beziehungsweise trockenes Land. Im Zusammenhang mit dem Meeresgrund ist „über trockenen Boden“ klar und anschaulich.
- source_word: רֹדְפֵיהֶם
  choice: ihre Verfolger
  rationale: Das Partizip von רדף bezeichnet diejenigen, die ihnen nachjagten; „Verfolger“ ist die direkte und kontextgerechte Wiedergabe.
- source_word: הִשְׁלַכְתָּ
  choice: hast du ... geschleudert
  rationale: Der Hifil von שלך bedeutet „werfen“ oder „schleudern“. „Geschleudert“ vermittelt die kraftvolle göttliche Handlung, ohne ein zusätzliches Bild einzuführen.
- source_word: בִמְצוֹלֹת
  choice: in die Tiefen
  rationale: מְצוֹלוֹת bezeichnet besonders die Tiefen des Meeres. Wegen der gerichteten Bewegung ist „in die Tiefen“ im Deutschen idiomatisch.
- source_word: כְּמוֹ אֶבֶן
  choice: wie einen Stein
  rationale: Die schlichte, eindringliche Vergleichsform des Hebräischen wird unmittelbar beibehalten.
- source_word: בְּמַיִם עַזִּים
  choice: in mächtige Wasser
  rationale: עַזִּים bedeutet „stark“ oder „mächtig“. „Mächtige Wasser“ bewahrt den erhöhten Ton, ohne die Wasser deutend als „tosend“ oder „reißend“ zu charakterisieren; der Akkusativ folgt im Deutschen der durch das Schleudern bezeichneten Richtung.
theological_decisions:
- issue: Gottes unmittelbares Handeln beim Auszug
  choice: 'Die direkte Anrede in der zweiten Person bleibt erhalten: „Du hast ... gespalten“ und „hast du ... geschleudert“.'
  alternative: Eine unpersönliche oder stärker erklärende Wiedergabe.
  rationale: Der Vers gehört zu einem gemeinschaftlichen Gebet, das Gottes geschichtliches Rettungs- und Gerichtshandeln bekennt. Die direkte Anrede wahrt diese theologische Aussage, ohne sie auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Gebetssprache. Die Satzteilung erhöht die Verständlichkeit; „aber“ macht den im hebräischen Satzbau angelegten Kontrast zwischen den hindurchziehenden Israeliten und ihren Verfolgern deutlich.
