  terminology: „deinen Geist“ ist im prophetischen Kontext angemessen und ohne weitergehende dogmatische Festlegung. „in die Hand der Völker der Länder“ erhält das hebräische Bild und den Plural von עמים und ארצות. „Zeugnis gegen sie ablegen“ ist eine sachgerechte Alternative zu „warnen“.
