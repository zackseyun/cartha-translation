  source_fidelity: 'Der Haupttext gibt die Abfolge und den Sinn des Hebräischen zuverlässig wieder: langjährige göttliche Geduld, prophetische Warnung bzw. Bezeugung durch Gottes Geist, Nicht-Hören und anschließende Auslieferung an andere Völker. „Da“ ist als Folgemarkierung vertretbar. Die Fußnotenalternative bewahrt angemessen die forensische Nuance von עוד im Hifil.'
