source:
  edition: WLC
  text: וַ/תִּמְשֹׁ֤ךְ עֲלֵי/הֶם֙ שָׁנִ֣ים רַבּ֔וֹת וַ/תָּ֨עַד בָּ֧/ם בְּ/רוּחֲ/ךָ֛ בְּ/יַד נְבִיאֶ֖י/ךָ וְ/לֹ֣א הֶאֱזִ֑ינוּ וַֽ/תִּתְּנֵ֔/ם בְּ/יַ֖ד עַמֵּ֥י הָ/אֲרָצֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/030.yaml
  text: For many years you were patient with them and testified against them by your Spirit through your prophets[a], but they would not listen. So you gave them into the hand of the peoples of the lands.
translation:
  language: de
  text: Viele Jahre lang hattest du Geduld mit ihnen und warntest sie[a] durch deinen Geist mittels deiner Propheten. Doch sie hörten nicht. Da gabst du sie in die Hand der Völker der Länder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und legtest durch deinen Geist mittels deiner Propheten Zeugnis gegen sie ab“'
    reason: Das Verb עוד im Hifil kann neben „warnen“ auch „gegen jemanden Zeugnis ablegen“ bedeuten.
lexical_decisions:
- source_word: וַתִּמְשֹׁךְ עֲלֵיהֶם שָׁנִים רַבּוֹת
  choice: Viele Jahre lang hattest du Geduld mit ihnen
  rationale: Die Verbindung von משׁך mit עַל bezeichnet hier ein langes Hinauszögern des Gerichts beziehungsweise anhaltende Nachsicht. Die deutsche Wendung gibt den Sinn natürlich wieder und bewahrt den Zeitaspekt.
- source_word: וַתָּעַד בָּם
  choice: und warntest sie
  rationale: Das Hifil von עוד kann warnen, ermahnen oder gegen jemanden Zeugnis ablegen bedeuten. Im Zusammenhang wiederholter prophetischer Aufrufe ist „warntest sie“ klares modernes Deutsch; die forensisch stärkere Alternative steht in der Fußnote.
- source_word: בְּרוּחֲךָ
  choice: durch deinen Geist
  rationale: Der Geist Gottes erscheint als das Mittel beziehungsweise die göttliche Wirkkraft der prophetischen Warnung. Die Formulierung wahrt diese Aussage ohne spätere dogmatische Einzelheiten einzutragen.
- source_word: בְּיַד נְבִיאֶיךָ
  choice: durch deine Propheten
  rationale: Die hebräische Wendung „durch die Hand von“ bezeichnet Vermittlung oder handelnde Werkzeuge und wird im Deutschen idiomatisch mit „durch“ wiedergegeben.
- source_word: וְלֹא הֶאֱזִינוּ
  choice: Doch sie hörten nicht
  rationale: האזין bezeichnet aufmerksames Hinhören. Der knappe deutsche Satz erhält die Feststellung des Textes, ohne eine ausdrückliche modale Weigerung hinzuzufügen.
- source_word: וַתִּתְּנֵם בְּיַד
  choice: Da gabst du sie in die Hand
  rationale: „Da“ macht die erzählerische Folge kenntlich. „In die Hand geben“ bewahrt das verständliche biblische Bild für die Auslieferung in fremde Gewalt.
- source_word: עַמֵּי הָאֲרָצוֹת
  choice: der Völker der Länder
  rationale: Die Übersetzung bewahrt sowohl den Plural „Völker“ als auch den Plural „Länder“ und lässt den regional-politischen Bezug offen.
theological_decisions:
- issue: Bezug von „deinen Geist“
  choice: Gottes Geist als Wirkkraft der prophetischen Warnung
  alternative: Gottes Geist im allgemeineren Sinn von innerer Haltung oder belebendem Atem
  rationale: Die Verbindung „durch deinen Geist, durch deine Propheten“ spricht am ehesten von Gottes Geist als Ursprung und Wirkkraft der prophetischen Botschaft. Weitergehende trinitarische Bestimmungen werden nicht in den Vers hineingetragen.
- issue: Bedeutung des prophetischen Handelns
  choice: sie warnen
  alternative: gegen sie Zeugnis ablegen
  rationale: Das hebräische Verb umfasst sowohl Warnung als auch bezeugende Anklage. Der Haupttext priorisiert die im Kontext natürliche Warnfunktion, während die Fußnote die forensische Nuance sichtbar hält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischer Färbung. Die Satzglieder bleiben nahe am hebräischen Aufbau, ohne unnatürliche Lehnsyntax. Der Fußnotenmarker [a] steht unmittelbar bei der übersetzten Wendung, auf die sich die Alternative bezieht.
