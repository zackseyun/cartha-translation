  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des hebräischen Textes präzise wieder: Gottes Wahrnehmen des Elends, die Väter als ausdrücklich männlich bezeichnete Vorfahren, Ägypten, ihren aus Not kommenden Ruf sowie dessen Verortung am Schilfmeer. „Schilfmeer“ entspricht יַם־סוּף unmittelbar und vermeidet die nicht im Hebräischen stehende traditionelle Bezeichnung „Rotes Meer“.'
