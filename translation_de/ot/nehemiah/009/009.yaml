  register: Modernes, würdiges Standarddeutsch mit direkter Gottesanrede. Die knappe Parallelstruktur des Hebräischen bleibt erhalten; „Schilfmeer“ macht die lexikalische Form des hebräischen Ortsnamens im Haupttext sichtbar.
