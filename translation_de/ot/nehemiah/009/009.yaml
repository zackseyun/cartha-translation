source:
  edition: WLC
  text: וַ/תֵּ֛רֶא אֶת עֳנִ֥י אֲבֹתֵ֖י/נוּ בְּ/מִצְרָ֑יִם וְ/אֶת זַעֲקָתָ֥/ם שָׁמַ֖עְתָּ עַל יַם סֽוּף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/009.yaml
  text: You saw the affliction of our fathers in Egypt[a], and you heard their cry at the Red Sea.
translation:
  language: de
  text: Du sahst das Elend unserer Väter in Ägypten und hörtest ihren Hilferuf am Schilfmeer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Du sahst
  rationale: Gibt ראה direkt wieder und lässt im Zusammenhang zugleich anklingen, dass Gott die Not wahrnahm.
- source_word: עֳנִי
  choice: das Elend
  rationale: „Elend“ bezeichnet natürliche und verständliche Weise die schwere Not Israels, ohne deren Ursache enger festzulegen.
- source_word: אֲבֹתֵינוּ
  choice: unserer Väter
  rationale: Bewahrt die ausdrücklich maskuline Form des Hebräischen und den würdevollen Gebetsstil.
- source_word: בְּמִצְרָיִם
  choice: in Ägypten
  rationale: Direkte Wiedergabe der Ortsangabe.
- source_word: זַעֲקָתָם
  choice: ihren Hilferuf
  rationale: זְעָקָה ist ein aus Bedrängnis ausgestoßener Ruf um Hilfe; „Hilferuf“ gibt diesen Sinn im modernen Deutsch klar wieder.
- source_word: שָׁמַעְתָּ
  choice: hörtest
  rationale: Direkte und im Gebetskontext natürliche Wiedergabe von שמע.
- source_word: עַל
  choice: am
  rationale: Bezeichnet hier die Lage am beziehungsweise bei dem Meer.
- source_word: יַם סוּף
  choice: Schilfmeer
  rationale: Gibt die hebräische Bezeichnung יַם־סוּף transparent wieder und ist im Deutschen als biblischer Ortsname geläufig; „Rotes Meer“ wäre die traditionelle geografische Wiedergabe.
theological_decisions: []
