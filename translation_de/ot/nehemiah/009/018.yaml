  naturalness: Der offene, an den Folgesatz anschließende Teilsatz ist im Kontext natürlich. „Selbst als“ ist als konzессive Einleitung verständlich und angemessen. „Große Lästerungen“ ist im würdigen Bibelregister idiomatisch genug.
  terminology: „Gegossenes Kalb“ gibt עֵגֶל מַסֵּכָה sachgerecht wieder. „Lästerungen“ ist im Kontext vertretbar, sofern die weiter gefasste Bedeutung von נֶאָצוֹת durch die Fußnote dokumentiert bleibt. Die Kleinschreibung von „Gott“ ist im Deutschen nicht möglich, da Substantive großgeschrieben werden; der Kontext der direkten Rede macht den Götzenbezug ausreichend deutlich.
