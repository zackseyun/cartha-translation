source:
  edition: WLC
  text: אַ֗ף כִּֽי עָשׂ֤וּ לָ/הֶם֙ עֵ֣גֶל מַסֵּכָ֔ה וַ/יֹּ֣אמְר֔וּ זֶ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר הֶעֶלְ/ךָ֖ מִ/מִּצְרָ֑יִם וַֽ/יַּעֲשׂ֔וּ נֶאָצ֖וֹת גְּדֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/018.yaml
  text: Even when they made for themselves a cast metal calf and said[a], ‘This is your god who brought you up out of Egypt,’ and committed great blasphemies[b],
translation:
  language: de
  text: 'Selbst als sie sich ein gegossenes Kalb[a] machten und sagten: »Das ist dein Gott, der dich aus Ägypten heraufgeführt hat«, und große Lästerungen[b] begingen,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ein Kalb aus Gussmetall.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: große Schmähungen oder große verächtliche Taten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: Selbst als
  rationale: 'Die Formulierung gibt den steigernd-konzessiven Sinn im Zusammenhang natürlich wieder: Gottes Erbarmen blieb selbst während dieser Rebellion bestehen.'
- source_word: עָשׂוּ לָהֶם
  choice: sie sich … machten
  rationale: Das reflexive Dativpronomen לָהֶם wird bewahrt und zeigt, dass sie das Bild für sich selbst anfertigten.
- source_word: עֵגֶל מַסֵּכָה
  choice: ein gegossenes Kalb
  rationale: מַסֵּכָה bezeichnet ein aus Metall gegossenes Bild. Die gewählte Formulierung ist im heutigen Deutsch verständlich und bewahrt sowohl die Gestalt als auch die Herstellungsweise.
- source_word: זֶה אֱלֹהֶיךָ
  choice: Das ist dein Gott
  rationale: Das Demonstrativpronomen und das Suffix stehen im Hebräischen im Singular. Die Aussage wird als Behauptung der Israeliten wiedergegeben, ohne sie durch einen erklärenden Zusatz zu deuten.
- source_word: אֲשֶׁר הֶעֶלְךָ מִמִּצְרָיִם
  choice: der dich aus Ägypten heraufgeführt hat
  rationale: Die Wendung bewahrt das traditionelle räumliche Bild des hebräischen Exodus-Ausdrucks עלה מן.
- source_word: וַיַּעֲשׂוּ
  choice: begingen
  rationale: In Verbindung mit einem Ausdruck für schwere Vergehen ist „begingen“ natürliches Deutsch und entspricht hier dem Sinn von עשה.
- source_word: נֶאָצוֹת גְּדֹלוֹת
  choice: schwere Lästerungen
  rationale: נֶאָצוֹת bezeichnet verächtliche, schmähende Handlungen gegen Gott. „Lästerungen“ bringt den Gottesbezug im Kontext zum Ausdruck; „schwere“ ist im Deutschen idiomatischer als das wörtlichere „große“.
theological_decisions:
- issue: Wiedergabe des auf das Kalb bezogenen אֱלֹהֶיךָ
  choice: dein Gott
  alternative: dein Gott (typografisch oder durch Zusatz als bloßer Götze gekennzeichnet)
  rationale: Die Übersetzung folgt der singularischen hebräischen Form und gibt die Behauptung der Sprecher direkt wieder. Ein deutender Zusatz wie „Götze“ würde die polemische Aussage zwar erklären, stünde aber nicht ausdrücklich im Ausgangstext.
- issue: Bedeutungsumfang von נֶאָצוֹת
  choice: Lästerungen
  alternative: Schmähungen; verächtliche Taten; Provokationen
  rationale: Im Gebetskontext richten sich die Taten gegen Gott, weshalb „Lästerungen“ den vertikalen Bezug angemessen ausdrückt. Die Fußnote hält den breiteren Bedeutungsumfang offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt wie im hebräischen Zusammenhang als untergeordneter, zum folgenden Vers führender Teilsatz offen. Die direkte Rede wird mit deutschen Anführungszeichen gesetzt.
