source:
  edition: WLC
  text: וַ/תִּתֵּ֨ן לָ/הֶ֤ם מַמְלָכוֹת֙ וַ/עֲמָמִ֔ים וַֽ/תַּחְלְקֵ֖/ם לְ/פֵאָ֑ה וַ/יִּֽירְשׁ֞וּ אֶת אֶ֣רֶץ סִיח֗וֹן וְ/אֶת אֶ֨רֶץ֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן וְ/אֶת אֶ֖רֶץ ע֥וֹג מֶֽלֶךְ הַ/בָּשָֽׁן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/022.yaml
  text: You gave them kingdoms and peoples, and allotted them to every corner. So they took possession of the land of Sihon, that is, the land of the king of Heshbon, and the land of Og king of Bashan.
translation:
  language: de
  text: Du gabst ihnen Königreiche und Völker und teiltest sie ihnen nach Gebieten zu.[a] So nahmen sie das Land Sihons in Besitz – das Land des Königs von Heschbon – sowie das Land Ogs, des Königs von Baschan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und teiltest sie ihnen nach einer Ecke/Seite zu“; die hebräische Wendung ist in ihrer genauen Bedeutung unsicher.'
    reason: Die seltene Formulierung לְפֵאָה lässt mehrere räumliche Deutungen zu, etwa „nach Gebieten“, „ringsum“ oder „bis in jeden Winkel“.
lexical_decisions:
- source_word: מַמְלָכוֹת וַעֲמָמִים
  choice: Königreiche und Völker
  rationale: Gibt beide koordinierten Substantive direkt und in natürlichem Deutsch wieder.
- source_word: וַתַּחְלְקֵם לְפֵאָה
  choice: und teiltest sie ihnen nach Gebieten zu
  rationale: פֵאָה bedeutet wörtlich „Ecke/Rand/Seite“, bezeichnet hier aber wahrscheinlich abgegrenzte Landesteile oder Regionen. Die Formulierung erhält den Verteilungsgedanken, ohne die im Deutschen missverständliche Wendung „an jede Ecke“ zu verwenden.
- source_word: וַיִּירְשׁוּ
  choice: So nahmen sie … in Besitz
  rationale: Das Verb ירשׁ bezeichnet hier die Besitzergreifung des Landes; „in Besitz nehmen“ ist idiomatisch und kontextgerecht.
- source_word: אֶרֶץ סִיחוֹן וְאֶת אֶרֶץ מֶלֶךְ חֶשְׁבּוֹן
  choice: das Land Sihons in Besitz – das Land des Königs von Heschbon –
  rationale: Der masoretische Text nennt „das Land Sihons“ und anschließend „das Land des Königs von Heschbon“. Die Gedankenstriche geben die wahrscheinlich erläuternde Beziehung wieder, ohne den zweiten Ausdruck durch ein nicht ausdrücklich vorhandenes „das heißt“ festzulegen.
theological_decisions:
- issue: Beziehung zwischen „Land Sihons“ und „Land des Königs von Heschbon“
  choice: Apposition mit Gedankenstrichen
  alternative: „das Land Sihons, das heißt das Land des Königs von Heschbon“ oder zwei getrennte Länder
  rationale: Historisch ist Sihon der König von Heschbon; syntaktisch fehlt jedoch eine ausdrückliche Gleichsetzungsformel. Die Apposition bewahrt diese leichte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede Gottes und die erzählende Abfolge bleiben erhalten; Eigennamen folgen geläufigen deutschen Bibelformen.
