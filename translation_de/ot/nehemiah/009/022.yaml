  source_fidelity: 'Die Übersetzung gibt die Abfolge und die zentralen Begriffe des hebräischen Textes zuverlässig wieder: Gottes Gabe von „Königreichen und Völkern“, die anschließende Zuteilung und die Besitznahme der genannten Länder. „nahmen ... in Besitz“ trifft וַיִּירְשׁוּ im landbezogenen Kontext angemessen. Die wiederholte Landbezeichnung bei Sihon/Heschbon bleibt durch die Gedankenstriche erkennbar erhalten, ohne eine ausdrückliche Gleichsetzungsformel in den hebräischen Text einzutragen.'
  naturalness: Der Text ist flüssiges, modernes Standarddeutsch und wahrt den würdigen Gebets- bzw. Rückblickregister des Kontextes. „teiltest sie ihnen nach Gebieten zu“ ist verständlich, wenn auch die zugrunde liegende hebräische Wendung knapp und unsicher bleibt; die Fußnote macht dies sachgerecht transparent.
  terminology: „Königreiche“, „Völker“, „in Besitz nehmen“ sowie die Namen Sihon, Heschbon, Og und Baschan sind im Deutschen etabliert und passend. Die Formulierung zu Sihon und dem König von Heschbon vermeidet eine konfessionell oder interpretativ überzogene Festlegung.
