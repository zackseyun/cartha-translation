source:
  edition: WLC
  text: וַ/תָּ֨עַד בָּ/הֶ֜ם לַ/הֲשִׁיבָ֣/ם אֶל תּוֹרָתֶ֗/ךָ וְ/הֵ֨מָּה הֵזִ֜ידוּ וְ/לֹא שָׁמְע֤וּ לְ/מִצְוֺתֶ֨י/ךָ֙ וּ/בְ/מִשְׁפָּטֶ֣י/ךָ חָֽטְאוּ בָ֔/ם אֲשֶׁר יַעֲשֶׂ֥ה אָדָ֖ם וְ/חָיָ֣ה בָ/הֶ֑ם וַ/יִּתְּנ֤וּ כָתֵף֙ סוֹרֶ֔רֶת וְ/עָרְפָּ֥/ם הִקְשׁ֖וּ וְ/לֹ֥א שָׁמֵֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/029.yaml
  text: You warned them in order to bring them back to your law[a], but they acted presumptuously and did not listen to your commandments; they sinned against your judgments, by which a man shall live if he does them. They gave a stubborn shoulder, stiffened their neck[b], and would not listen.
translation:
  language: de
  text: Du hast sie gewarnt, um sie zu deinem Gesetz zurückzubringen. Doch sie handelten vermessen und hörten nicht auf deine Gebote. Gegen deine Rechtsbestimmungen sündigten sie, durch die ein Mensch lebt, wenn er sie befolgt.[a] Sie zeigten eine widerspenstige Schulter[b], machten ihren Nacken steif und wollten nicht hören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die ein Mensch tut und durch die er lebt“. Eine Anspielung auf 3. Mose 18,5.'
    reason: lexical_alternative_and_cross_reference
  - marker: b
    text: Die widerspenstige Schulter und der steife Nacken sind Bilder für hartnäckigen Widerstand und die Weigerung zu gehorchen.
    reason: idiom
lexical_decisions:
- source_word: וַתָּעַד בָּהֶם
  choice: Du hast sie gewarnt
  rationale: Das Hifil von עוד bezeichnet hier ein nachdrückliches, feierliches Warnen beziehungsweise Ermahnen. „Gewarnt“ ist natürlich und bewahrt die Schärfe des Bundeszusammenhangs.
- source_word: לַהֲשִׁיבָם אֶל תּוֹרָתֶךָ
  choice: um sie zu deinem Gesetz zurückzubringen
  rationale: Das Hifil von שׁוב bedeutet „zurückbringen“. תורה meint in diesem Bundeszusammenhang Gottes Gesetz beziehungsweise Weisung; „Gesetz“ passt auch zum folgenden rechtlichen Wortfeld.
- source_word: הֵזִידוּ
  choice: sie handelten vermessen
  rationale: זיד bezeichnet überhebliches, bewusst anmaßendes Handeln und nicht lediglich ein inneres Gefühl des Stolzes.
- source_word: לֹא שָׁמְעוּ לְמִצְוֺתֶיךָ
  choice: hörten nicht auf deine Gebote
  rationale: שׁמע schließt hier gehorchendes Hören ein. Die deutsche Wendung bewahrt sowohl das Bild des Hörens als auch den Gehorsamsaspekt.
- source_word: וּבְמִשְׁפָּטֶיךָ חָטְאוּ בָם
  choice: Gegen deine Rechtsbestimmungen sündigten sie
  rationale: משׁפטים bezeichnet hier Gottes verbindliche Rechtsordnungen. „Rechtsbestimmungen“ erhält den juridischen Ton und gibt das Verhältnis mit ב als „gegen“ wieder.
- source_word: אֲשֶׁר יַעֲשֶׂה אָדָם וְחָיָה בָהֶם
  choice: dabei wird der Mensch durch sie leben, wenn er sie befolgt
  rationale: Die Formulierung greift Levitikus 18,5 auf. אדם ist generisch und wird im Deutschen natürlich mit „der Mensch“ wiedergegeben. „Durch sie leben“ bewahrt den Bezug von בהם auf die Bestimmungen; „befolgt“ gibt das Tun im rechtlichen Kontext idiomatisch wieder.
- source_word: וַיִּתְּנוּ כָתֵף סוֹרֶרֶת
  choice: Sie zeigten eine widerspenstige Schulter
  rationale: Die ungewöhnliche Körpermetapher für hartnäckigen Widerstand wird bewahrt. „Zeigten“ klingt im Deutschen natürlicher als das wörtliche „gaben“.
- source_word: וְעָרְפָּם הִקְשׁוּ
  choice: machten ihren Nacken steif
  rationale: Die hebräische Metapher für Halsstarrigkeit bleibt sichtbar und ist in dieser Form verständlich.
- source_word: וְלֹא שָׁמֵעוּ
  choice: wollten nicht hören
  rationale: Die Wiedergabe bringt die beharrliche, willentliche Weigerung des abschließenden Satzes zum Ausdruck.
theological_decisions:
- issue: Bedeutung der Lebenszusage in אֲשֶׁר יַעֲשֶׂה אָדָם וְחָיָה בָהֶם
  choice: dabei wird der Mensch durch sie leben, wenn er sie befolgt
  alternative: die der Mensch tun soll, damit er durch sie lebt
  rationale: Die Übersetzung erhält die Aussage von Levitikus 18,5 als Lebenszusage im Zusammenhang des Gehorsams, ohne hier die genaue Art oder Reichweite dieses Lebens dogmatisch festzulegen.
- issue: Generisches אָדָם
  choice: der Mensch
  alternative: ein Mensch
  rationale: „Der Mensch“ gibt den generischen Singular im modernen Standarddeutsch geschlechtsübergreifend und zugleich formal nah am Hebräischen wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden hebräischen Körpermetaphern werden trotz ihrer Fremdheit erhalten und durch eine Fußnote erklärt. Die Satzglieder sind zur besseren Verständlichkeit in mehrere Sätze gegliedert.
