  to: Du hast sie gewarnt, um sie zu deinem Gesetz zurückzubringen. Doch sie handelten vermessen und hörten nicht auf deine Gebote. Gegen deine Rechtsbestimmungen sündigten sie, durch die ein Mensch lebt, wenn er sie befolgt.[a] Sie zeigten eine widerspenstige Schulter[b], machten ihren Nacken steif und wollten nicht hören.
