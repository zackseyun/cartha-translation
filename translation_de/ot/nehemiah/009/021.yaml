source:
  edition: WLC
  text: וְ/אַרְבָּעִ֥ים שָׁנָ֛ה כִּלְכַּלְתָּ֥/ם בַּ/מִּדְבָּ֖ר לֹ֣א חָסֵ֑רוּ שַׂלְמֹֽתֵי/הֶם֙ לֹ֣א בָל֔וּ וְ/רַגְלֵי/הֶ֖ם לֹ֥א בָצֵֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/021.yaml
  text: For forty years you sustained them in the wilderness[a]; they lacked nothing. Their clothes did not wear out[b], and their feet did not swell.
translation:
  language: de
  text: Vierzig Jahre lang hast du sie in der Wüste versorgt; ihnen fehlte nichts. Ihre Kleider nutzten sich nicht ab, und ihre Füße schwollen nicht an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vergleiche 5. Mose 8,4.
    reason: cross_reference
lexical_decisions:
- source_word: כִּלְכַּלְתָּם
  choice: hast du sie … versorgt
  rationale: Das Verb כלכל bezeichnet hier Gottes fortdauernde Versorgung und Erhaltung. „Versorgt“ ist natürliches modernes Deutsch und beschränkt die Aussage nicht auf Nahrung.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet Wüsten- oder unbewohntes Wildnisgebiet; „Wüste“ ist im deutschen biblischen Kontext die geläufige und klare Wiedergabe.
- source_word: לֹא חָסֵרוּ
  choice: ihnen fehlte nichts
  rationale: Diese idiomatische Formulierung gibt die uneingeschränkte Verneinung des Mangels prägnant wieder.
- source_word: שַׂלְמֹתֵיהֶם
  choice: ihre Kleider
  rationale: שַׂלְמָה bezeichnet Kleidung beziehungsweise ein Gewand. „Kleider“ ist verständlich, würdig und wahrt den kollektiven Plural.
- source_word: לֹא בָלוּ
  choice: nutzten sich nicht ab
  rationale: בלה bezeichnet das Verschleißen oder Altwerden; bei Kleidung ist „sich abnutzen“ eine natürliche und genaue Wiedergabe.
- source_word: וְרַגְלֵיהֶם לֹא בָצֵקוּ
  choice: und ihre Füße schwollen nicht an
  rationale: בצק bezeichnet hier ein Anschwellen. Die Formulierung ist knapp und entspricht der körperlichen Bewahrung im Kontext.
- source_word: וְאַרְבָּעִים שָׁנָה
  choice: Vierzig Jahre lang
  rationale: Die Zeitangabe wird im Deutschen natürlich vorangestellt. Das einleitende וְ setzt den Zusammenhang fort, muss aber nicht eigens mit „und“ wiedergegeben werden.
theological_decisions: []
