source:
  edition: WLC
  text: וּ/מָצָ֣אתָ אֶת לְבָב/וֹ֮ נֶאֱמָ֣ן לְ/פָנֶי/ךָ֒ וְ/כָר֨וֹת עִמּ֜/וֹ הַ/בְּרִ֗ית לָ/תֵ֡ת אֶת אֶרֶץ֩ הַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הָ/אֱמֹרִ֧י וְ/הַ/פְּרִזִּ֛י וְ/הַ/יְבוּסִ֥י וְ/הַ/גִּרְגָּשִׁ֖י לָ/תֵ֣ת לְ/זַרְע֑/וֹ וַ/תָּ֨קֶם֙ אֶת דְּבָרֶ֔י/ךָ כִּ֥י צַדִּ֖יק אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/008.yaml
  text: You found his heart faithful before you[a], and made a covenant with him to give the land of the Canaanite, the Hittite, the Amorite, the Perizzite, the Jebusite, and the Girgashite—to give it to his offspring. And you have fulfilled your words[c][b], for you are righteous.
translation:
  language: de
  text: Du fandest sein Herz dir gegenüber treu und schlossest mit ihm den Bund, das Land der Kanaaniter, Hetiter, Amoriter, Perisiter, Jebusiter und Girgaschiter seinen Nachkommen[a] zu geben. Und du hast deine Worte erfüllt[b], denn du bist gerecht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seinem Samen“; das hebräische Wort ist ein kollektiver Singular und kann die gesamte Nachkommenschaft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „du hast deine Worte aufgerichtet“ beziehungsweise „bestätigt“. Gemeint ist, dass Gott sie in Kraft setzte und verwirklichte.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „denn du bist im Recht“. Das hebräische Wort kann sowohl Gottes Gerechtigkeit als auch die Richtigkeit seines Handelns hervorheben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָצָאתָ
  choice: Du fandest
  rationale: מצא bedeutet im Qal gewöhnlich „finden“. Die direkte Formulierung bewahrt das hebräische Bild, ohne es deutend zu „erkennen“ oder „sehen“ abzuschwächen.
- source_word: אֶת־לְבָבוֹ נֶאֱמָן לְפָנֶיךָ
  choice: sein Herz dir gegenüber treu
  rationale: לֵבָב bezeichnet den inneren Menschen, besonders Haltung und Willen. „Herz“ bleibt transparent; „dir gegenüber“ gibt לְפָנֶיךָ in diesem prüfenden und relationalen Zusammenhang natürlich wieder.
- source_word: וְכָרוֹת עִמּוֹ הַבְּרִית
  choice: und schlossest mit ihm den Bund
  rationale: כרת ברית ist die feste hebräische Wendung für das Schließen eines Bundes. „Den Bund“ wahrt den bestimmten Artikel; „einen Bund“ wäre im Deutschen ebenfalls möglich, aber weniger formnah.
- source_word: לָתֵת אֶת־אֶרֶץ הַכְּנַעֲנִי ... לָתֵת לְזַרְעוֹ
  choice: das Land der Kanaaniter … seinen Nachkommen zu geben
  rationale: Die zweimalige Verwendung von לָתֵת gehört syntaktisch zu Inhalt und Ziel des Bundes. Im natürlichen Deutschen kann die zweite Infinitivform die ganze Landangabe aufnehmen, ohne dass die Aussage verändert wird.
- source_word: הַכְּנַעֲנִי ... הַגִּרְגָּשִׁי
  choice: der Kanaaniter, Hetiter, Amoriter, Perisiter, Jebusiter und Girgaschiter
  rationale: Die hebräischen singularischen Volksbezeichnungen haben kollektive Bedeutung. Deutsche Volksnamen im Plural sind in der Verbindung „Land der …“ idiomatisch und verständlich.
- source_word: לְזַרְעוֹ
  choice: seinen Nachkommen
  rationale: זֶרַע ist formal ein kollektiver Singular („Same/Nachkommenschaft“). „Nachkommen“ gibt den kollektiven Bezug in modernem Deutsch klar wieder; die formale Besonderheit wird in der Fußnote bewahrt.
- source_word: וַתָּקֶם אֶת־דְּבָרֶיךָ
  choice: du hast deine Worte erfüllt
  rationale: קום im Hifil mit „Worte“ kann „aufrichten, bestätigen, in Kraft setzen“ bedeuten; hier bezeichnet es die Verwirklichung der Bundeszusage. Das Perfekt entspricht dem Rückblick des Gebets, und „Worte“ wahrt den hebräischen Plural.
- source_word: כִּי צַדִּיק אָתָּה
  choice: denn du bist gerecht
  rationale: כִּי begründet die Erfüllung der Zusage. צַדִּיק umfasst Gottes rechtes, verlässliches Handeln; „gerecht“ bewahrt diese moralische und bundestreue Weite besser als eine rein juristische Formulierung.
theological_decisions:
- issue: Bedeutung von צַדִּיק als Aussage über Gott
  choice: gerecht
  alternative: recht / im Recht
  rationale: „Gerecht“ bewahrt sowohl die moralische als auch die auf Gottes Bundestreue bezogene Bedeutung. „Recht“ kann die Aussage stärker auf die Richtigkeit dieses konkreten Handelns beziehen, ist aber im Deutschen weniger umfassend.
- issue: Verhältnis von Treue des Herzens und göttlicher Prüfung
  choice: sein Herz dir gegenüber treu
  alternative: sein Herz vor dir treu
  rationale: Die Übersetzung hält die Aussage über Abrahams innere Haltung fest, ohne zu erklären, wodurch diese Treue entstand oder wie sie dogmatisch einzuordnen ist. Damit bleibt die theologische Spannung des Gebets bestehen.
- issue: Erfüllung beziehungsweise Bestätigung der göttlichen Worte
  choice: deine Worte erfüllt
  alternative: deine Worte aufgerichtet / bestätigt
  rationale: Der Kontext preist die geschichtliche Verwirklichung der Zusage. Zugleich kann die Verbform stärker das Inkraftsetzen oder Bestätigen bezeichnen; diese echte lexikalische Möglichkeit wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Gebetsanrede. Die Präteritalform „schlossest“ ist gehoben, aber in dieser biblischen Gebetssprache noch verständlich; sie vermeidet das regional unterschiedlich bewertete Perfekt und hält die Satzführung knapp. Die Völkernamen folgen den im Deutschen etablierten Formen. Die hebräische Wiederholung von לָתֵת wird zugunsten eines natürlichen deutschen Satzes syntaktisch zusammengezogen, ohne ihren Inhalt auszulassen.
