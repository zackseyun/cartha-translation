base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/015.yaml
  text: You gave them bread from heaven for their hunger[a], and you brought out water from the rock for their thirst, and you told them to go in to possess the land that you had sworn to give them.
translation:
  language: de
  text: Du gabst ihnen Brot vom Himmel, als sie Hunger hatten, und brachtest ihnen Wasser aus einem Felsen hervor, als sie Durst hatten. Du sagtest ihnen, sie sollten hineingehen und das Land in Besitz nehmen, das du ihnen zu geben geschworen hattest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das du ihnen zu geben deine Hand erhoben hattest“. Das Erheben der Hand ist hier eine Schwurgeste.'
    reason: Die Fußnote dokumentiert das konkrete hebräische Bild hinter der idiomatischen Wiedergabe „geschworen“.
lexical_decisions:
- source_word: לֶחֶם מִשָּׁמַיִם
  choice: Brot vom Himmel
  rationale: Bewahrt das konkrete hebräische Bild und dessen Anspielungskraft; der Bezug auf das Manna wird nicht erläuternd in den Text eingetragen.
- source_word: לִרְעָבָם / לִצְמָאָם
  choice: gegen ihren Hunger / gegen ihren Durst
  rationale: Gibt die relationale beziehungsweise zweckbezogene Funktion der Präposition לְ in natürlichem Deutsch wieder und erhält den Parallelismus.
- source_word: מַיִם מִסֶּלַע
  choice: Wasser aus einem Felsen
  rationale: סֶלַע ist im Hebräischen nicht determiniert; der unbestimmte Artikel bildet dies im Deutschen natürlich ab, ohne den bekannten Wüstenbezug zu leugnen.
- source_word: הוֹצֵאתָ
  choice: ließest … hervorkommen
  rationale: Gibt den kausativen Hifil von יצא präzise und zugleich würdig wieder.
- source_word: וַתֹּאמֶר לָהֶם לָבוֹא
  choice: Du sagtest ihnen, sie sollten hineingehen
  rationale: Vermeidet die lexikalische Überdeutung als ausdrückliches Gebot und formuliert die hebräische Infinitivkonstruktion idiomatisch.
- source_word: לָרֶשֶׁת
  choice: in Besitz nehmen
  rationale: Im Zusammenhang mit dem Land bezeichnet ירשׁ das Antreten beziehungsweise Ergreifen des Besitzes; „erben“ könnte hier zu passiv wirken.
- source_word: נָשָׂאתָ אֶת־יָדְךָ
  choice: geschworen hattest
  rationale: Die Wendung „die Hand erheben“ ist eine hebräische Schwurformel. Die idiomatische Wiedergabe ist im modernen deutschen Haupttext klar; das konkrete Bild wird in der Fußnote offengelegt.
theological_decisions:
- issue: Schwurformel bei Gottes Zusage des Landes
  choice: Im Haupttext idiomatisch mit „geschworen hattest“ wiedergeben
  alternative: Das konkrete Bild „deine Hand erhoben hattest“ im Haupttext beibehalten
  rationale: Die hebräische Wendung bezeichnet hier einen Schwur. „Geschworen“ vermittelt ihren Sinn klar und lässt den verbindlichen Charakter der Landzusage bestehen; die Fußnote bewahrt die anthropomorphe Bildsprache des Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Wendungen zu Hunger und Durst bleiben erkennbar; Satzbau und Zeichensetzung wurden für gute Verständlichkeit behutsam geglättet.
