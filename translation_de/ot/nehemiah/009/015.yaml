  source_fidelity: 'Der Entwurf gibt die zentralen Aussagen zuverlässig wieder: Brot vom Himmel, Wasser aus dem Felsen, die Aufforderung zum Hineingehen und zur Besitznahme des Landes sowie die Schwurformel. „Geschworen hattest“ ist eine treffende idiomatische Wiedergabe von נָשָׂאתָ אֶת־יָדְךָ; die Fußnote bewahrt das konkrete Bild. Die Wendung „gegen ihren Hunger / gegen ihren Durst“ trifft die Funktion von לְ jedoch nicht angemessen, da sie im Deutschen eine Gegnerschaft nahelegt.'
