source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֱ֠לֹהֵי/נוּ הָ/אֵ֨ל הַ/גָּד֜וֹל הַ/גִּבּ֣וֹר וְ/הַ/נּוֹרָא֮ שׁוֹמֵ֣ר הַ/בְּרִ֣ית וְ/הַ/חֶסֶד֒ אַל יִמְעַ֣ט לְ/פָנֶ֡י/ךָ אֵ֣ת כָּל הַ/תְּלָאָ֣ה אֲֽשֶׁר מְ֠צָאַתְ/נוּ לִ/מְלָכֵ֨י/נוּ לְ/שָׂרֵ֧י/נוּ וּ/לְ/כֹהֲנֵ֛י/נוּ וְ/לִ/נְבִיאֵ֥/נוּ וְ/לַ/אֲבֹתֵ֖י/נוּ וּ/לְ/כָל עַמֶּ֑/ךָ מִ/ימֵי֙ מַלְכֵ֣י אַשּׁ֔וּר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/032.yaml
  text: 'And now[a], our God—the great, mighty, and fearsome God, who keeps the covenant and steadfast love—do not let all the hardship that has come upon us seem small before you: upon our kings, our officials, our priests, our prophets, our fathers[b], and all your people, from the days of the kings of Assyria until this day.'
translation:
  language: de
  text: 'Und nun, unser Gott, du großer, mächtiger und ehrfurchtgebietender Gott, der den Bund und die treue Liebe bewahrt: Lass all die Not, die über uns gekommen ist – über unsere Könige, unsere Obersten, unsere Priester, unsere Propheten, unsere Väter[a] und dein ganzes Volk –, vor dir nicht gering erscheinen, von den Tagen der Könige Assyriens an bis zum heutigen Tag.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind die Vorväter beziehungsweise die früheren Generationen des Volkes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגָּדוֹל הַגִּבּוֹר וְהַנּוֹרָא
  choice: großer, mächtiger und ehrfurchtgebietender
  rationale: Die drei bestimmten hebräischen Gottesprädikate werden im Deutschen als natürliche Anrede wiedergegeben. „Ehrfurchtgebietend“ bewahrt bei נוֹרָא sowohl den Aspekt des Schreckens als auch den der religiösen Ehrfurcht, ohne umgangssprachlich zu wirken.
- source_word: שׁוֹמֵר הַבְּרִית וְהַחֶסֶד
  choice: der den Bund und die treue Liebe bewahrt
  rationale: Das Partizip שׁוֹמֵר bezeichnet Gottes fortdauernde Bundestreue. „Treue Liebe“ gibt den covenantalen Sinn von חֶסֶד verständlich wieder, während die Koordination von Bund und Liebe erhalten bleibt.
- source_word: אַל יִמְעַט לְפָנֶיךָ
  choice: Lass … vor dir nicht gering erscheinen
  rationale: Die Formulierung wahrt das hebräische Bild und die Bitte, Gott möge die erfahrene Not nicht als unbedeutend ansehen.
- source_word: כָּל הַתְּלָאָה
  choice: all die Not
  rationale: תְּלָאָה bezeichnet hier die über lange Zeit erfahrene Mühsal und Bedrängnis. „Not“ ist knapp, würdig und umfasst das kollektive Leiden.
- source_word: אֲשֶׁר מְצָאַתְנוּ
  choice: die über uns gekommen ist
  rationale: Das wörtliche „die uns gefunden hat“ ist eine hebräische Wendung für widerfahrenes Unglück; die deutsche Form gibt den idiomatischen Sinn wieder.
- source_word: לִמְלָכֵינוּ לְשָׂרֵינוּ וּלְכֹהֲנֵינוּ וְלִנְבִיאֵינוּ וְלַאֲבֹתֵינוּ
  choice: über unsere Könige, unsere Obersten, unsere Priester, unsere Propheten, unsere Vorfahren
  rationale: Das לְ kennzeichnet die von der Not Betroffenen und wird mit „über“ aufgenommen. „Oberste“ bezeichnet ranghohe Amtsträger, ohne sie notwendig als königliche Prinzen festzulegen. „Vorfahren“ entspricht dem kontextuellen Bezug von אֲבוֹת auf frühere Generationen.
- source_word: מִימֵי מַלְכֵי אַשּׁוּר עַד הַיּוֹם הַזֶּה
  choice: seit den Tagen der Könige von Assyrien bis zum heutigen Tag
  rationale: Die Formulierung erhält den ausdrücklich genannten Zeitraum vom assyrischen Königtum bis zur Gegenwart der Betenden.
theological_decisions:
- issue: Bedeutung von נוֹרָא als Gottesprädikat
  choice: ehrfurchtgebietender
  alternative: furchtbarer; schreckenerregender
  rationale: Das Wort beschreibt Gott als den, der Furcht und ehrfürchtiges Staunen hervorruft. „Ehrfurchtgebietend“ wahrt diese Spannung, ohne „furchtbar“ im heute üblichen Sinn von „sehr schlecht“ missverständlich werden zu lassen.
- issue: Wiedergabe von הַחֶסֶד
  choice: die treue Liebe
  alternative: die Gnade; die Güte; die Bundestreue
  rationale: חֶסֶד steht neben „Bund“ und bezeichnet Gottes verlässliche, loyal zugewandte Liebe. „Treue Liebe“ lässt sowohl den Beziehungs- als auch den Beständigkeitsaspekt erkennen, ohne beide Begriffe zu einem einzigen theologischen Fachwort zu verschmelzen.
- issue: Wiedergabe von אֲבֹתֵינוּ
  choice: unsere Vorfahren
  alternative: unsere Väter
  rationale: Im historischen Zusammenhang bezeichnet der maskuline Plural die früheren Generationen des Volkes. „Vorfahren“ gibt diesen Referenzumfang natürlich wieder; die formnähere Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Moderne, würdige Gebetssprache. Die lange Aufzählung und der zeitliche Spannungsbogen des Hebräischen bleiben erhalten; ein Gedankenstrich gliedert den komplexen Satz. Das doppelte „Gott“ gibt die Apposition אֱלֹהֵינוּ הָאֵל natürlich und nachdrücklich wieder.
