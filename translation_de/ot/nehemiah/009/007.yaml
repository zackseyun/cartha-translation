  text: אַתָּה הוּא֙ יְהוָ֣ה הָ/אֱלֹהִ֔ים אֲשֶׁ֤ר בָּחַ֨רְתָּ֙ בְּ/אַבְרָ֔ם וְ/הוֹצֵאת֖/וֹ מֵ/א֣וּר כַּשְׂדִּ֑ים וְ/שַׂ֥מְתָּ שְּׁמ֖/וֹ אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/007.yaml
  text: You are Yahweh God[a], who chose Abram, brought him out from Ur of the Chaldeans, and gave him the name Abraham.
translation:
  language: de
  text: Du bist es, Jahwe, der Gott, der Abram erwählt, ihn aus Ur der Chaldäer herausgeführt und ihm den Namen Abraham gegeben hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: Du bist es
  rationale: Die betonte Identifikationsformel wird im Deutschen natürlich und zugleich nachdrücklich wiedergegeben.
- source_word: יְהוָה הָאֱלֹהִים
  choice: Jahwe, Gott
  rationale: Der Gottesname und die Bezeichnung »Gott« bleiben beide erhalten; die Apposition wird durch ein Komma kenntlich gemacht.
- source_word: בָּחַרְתָּ בְּאַבְרָם
  choice: der Abram erwählt
  rationale: בחר wird mit »erwählen« wiedergegeben, das im würdigen biblischen Register natürlich ist, ohne eine spätere Lehrsystematik einzutragen; die Präposition kennzeichnet hier das gewählte Objekt.
- source_word: וְהוֹצֵאתוֹ
  choice: ihn … herausgeführt
  rationale: Der Hifil von יצא bezeichnet das Herausführen; die Formulierung bewahrt den möglichen Anklang an göttliche Befreiung.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: aus Ur in Chaldäa
  rationale: Die Ortsbezeichnung wird in idiomatischem modernem Deutsch wiedergegeben; כשדים bezeichnet hier das Land beziehungsweise Gebiet der Chaldäer.
- source_word: וְשַׂמְתָּ שְׁמוֹ אַבְרָהָם
  choice: ihm den Namen Abraham gegeben
  rationale: Das wörtliche »seinen Namen gesetzt« wird entsprechend deutschem Sprachgebrauch als Namensgebung ausgedrückt; der Gegensatz zwischen Abram und Abraham bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« bewahrt den persönlichen Gottesnamen, während die traditionelle Ersatzlesung in der Fußnote genannt wird.
- issue: Verhältnis von יְהוָה und הָאֱלֹהִים
  choice: Jahwe, Gott
  alternative: Jahwe, der Gott
  rationale: Beide hebräischen Elemente werden bewahrt. Die genaue syntaktische Beziehung kann als Apposition beziehungsweise Identifikation verstanden werden; die deutsche Zeichensetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede bleibt im Singular erhalten. Die Satzstruktur folgt dem hebräischen Lobgebet, ohne unnötig hölzern zu wirken.
