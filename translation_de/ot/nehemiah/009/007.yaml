revisions:
- from: Du bist es, Jahwe, Gott,[a] der Abram erwählt und ihn aus Ur in Chaldäa herausgeführt und ihm den Namen Abraham gegeben hat.
  to: Du bist es, Jahwe, der Gott, der Abram erwählt, ihn aus Ur der Chaldäer herausgeführt und ihm den Namen Abraham gegeben hat.
  rationale: Die Revision bewahrt die direkte Anrede und die emphatische Identifikationsformel, gibt den bestimmten Ausdruck הָאֱלֹהִים mit »der Gott« wieder und ersetzt die interpretierende Ortsangabe durch die dem hebräischen Text entsprechende Bezeichnung »Ur der Chaldäer«.
