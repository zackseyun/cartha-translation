source:
  edition: WLC
  text: וַ/יִּבָּֽדְלוּ֙ זֶ֣רַע יִשְׂרָאֵ֔ל מִ/כֹּ֖ל בְּנֵ֣י נֵכָ֑ר וַ/יַּעַמְד֗וּ וַ/יִּתְוַדּוּ֙ עַל חַטֹּ֣אתֵי/הֶ֔ם וַ/עֲוֺנ֖וֹת אֲבֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/002.yaml
  text: Then the offspring of Israel separated themselves from all foreigners[b][a], and they stood and confessed their sins and the iniquities of their fathers.
translation:
  language: de
  text: Da sonderten sich die Nachkommen Israels von allen Fremden ab. Sie standen da und bekannten ihre Sünden und die Verfehlungen ihrer Vorfahren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Verfehlungen“ wiedergegebene hebräische Wort kann auch „Schuld“ oder die Folgen einer Schuld bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבָּדְלוּ
  choice: sonderten sich … ab
  rationale: Das Nifal von בדל kann passiv oder reflexiv verstanden werden; bei dem handelnden menschlichen Subjekt gibt die reflexive Formulierung die bewusste Absonderung natürlich wieder.
- source_word: זֶרַע יִשְׂרָאֵל
  choice: die Nachkommen Israels
  rationale: זֶרַע bedeutet wörtlich „Same“, bezeichnet hier aber kollektiv die genealogischen Nachkommen Israels. „Nachkommen“ ist im modernen Deutschen klar und natürlich.
- source_word: מִכֹּל בְּנֵי נֵכָר
  choice: von allen Fremden
  rationale: בְּנֵי נֵכָר ist eine idiomatische Bezeichnung für Menschen fremder Herkunft, nicht nur für männliche „Söhne“. „Fremde“ bewahrt die knappe kollektive Aussage.
- source_word: וַיַּעַמְדוּ
  choice: Sie traten hin
  rationale: עמד bedeutet grundsätzlich „stehen“. Im erzählenden Zusammenhang bezeichnet es hier wahrscheinlich das Einnehmen einer Stellung zur anschließenden Bekenntnishandlung; „traten hin“ klingt im Deutschen natürlicher als ein isoliertes „standen“.
- source_word: וַיִּתְוַדּוּ
  choice: bekannten
  rationale: Das Hitpael von ידה bezeichnet in diesem Zusammenhang das Bekennen von Schuld oder Sünde. „Bekannten“ ist würdig, geläufig und ohne zusätzliche Festlegung.
- source_word: חַטֹּאתֵיהֶם
  choice: ihre Sünden
  rationale: חַטָּאת bezeichnet hier im Plural eindeutig die eigenen Sünden des Volkes.
- source_word: עֲוֺנוֹת אֲבֹתֵיהֶם
  choice: die Verfehlungen ihrer Vorfahren
  rationale: עָוֹן kann Verfehlung, Schuld oder deren Folge bezeichnen. „Verfehlungen“ wahrt den moralischen Sinn und unterscheidet den Ausdruck von חַטָּאת; „Vorfahren“ gibt אָבוֹת im genealogisch-korporativen Zusammenhang geschlechtsübergreifend und natürlich wieder.
theological_decisions:
- issue: Korporatives Bekenntnis der Verfehlungen früherer Generationen
  choice: Das Volk bekannte sowohl seine eigenen Sünden als auch die Verfehlungen seiner Vorfahren.
  alternative: Der Ausdruck könnte auf die Schuld oder die Folgen der Schuld der Vorfahren bezogen werden.
  rationale: Die hebräische Syntax ordnet beide Ausdrücke dem Verb „bekennen“ zu. Die Übersetzung erhält diese korporative Dimension, ohne daraus eine Lehre persönlicher Erbschuld abzuleiten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzfolge bleibt eng am Hebräischen; idiomatische Wendungen werden natürlich wiedergegeben. Der Fußnotenmarker steht unmittelbar nach der betreffenden Aussage.
