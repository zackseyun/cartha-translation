base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/003.yaml
  text: And they stood in their place[a], and they read from the Book of the Law of Yahweh their God for a fourth of the day[b]; and for another fourth they were confessing and bowing down to Yahweh their God.
translation:
  language: de
  text: Und sie standen an ihrem Platz[a] und lasen ein Viertel des Tages lang[b] aus dem Buch der Weisung Jahwes, ihres Gottes; ein weiteres Viertel lang bekannten sie sich und warfen sich vor Jahwe, ihrem Gott, nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „auf ihrem Standplatz“. Die hebräische Wendung ist knapp; möglich sind auch „an ihrem Standort“ oder, je nach Verständnis des Ortsbezugs, „auf ihrer Plattform“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ein Viertel des Tages … und ein Viertel“. Ein Viertel des Tages wurde mit Lesen verbracht, ein weiteres mit Bekennen und Niederwerfen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֨וּמוּ עַל עָמְדָם
  choice: sie standen an ihrem Platz
  rationale: Die Wendung bezeichnet, ohne die Örtlichkeit näher festzulegen, das Stehen an ihrem jeweiligen Platz. Das mögliche Moment des Aufstehens wird im Deutschen nicht eigens ausgedrückt, da die komprimierte Ortsangabe im Zusammenhang im Vordergrund steht.
- source_word: וַיִּקְרְאוּ בְּסֵפֶר תּוֹרַת
  choice: sie lasen ... aus dem Buch der Weisung
  rationale: קרא mit בְּסֵפֶר bezeichnet hier das Lesen aus einem Schriftstück. תּוֹרָה bedeutet grundlegend Weisung; diese Wiedergabe bewahrt die Bedeutungsbreite besser als das enger verstandene „Gesetz“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: רְבִעִית הַיּוֹם וּרְבִעִית
  choice: ein Viertel des Tages; ein weiteres Viertel
  rationale: Die parallele Zeitangabe wird präzise und zugleich idiomatisch wiedergegeben; „weiteres“ macht die Ellipse der zweiten Wendung deutlich.
- source_word: מִתְוַדִּים
  choice: bekannten sie ihre Schuld
  rationale: Das Hitpael-Partizip bezeichnet hier fortdauerndes Bekennen. Im Zusammenhang von Buße und Anbetung ist das Eingestandene die eigene Schuld; die Ergänzung macht den deutschen Satz verständlich, ohne einen bestimmten Einzelinhalt festzulegen.
- source_word: וּמִשְׁתַּחֲוִים
  choice: warfen sich ... nieder
  rationale: Die Wiedergabe bewahrt die konkrete körperliche Handlung des Verbs und lässt ihren gottesdienstlichen Sinn aus dem genannten Gegenüber hervorgehen.
- source_word: לַיהוָה אֱלֹהֵיהֶם
  choice: vor Jahwe, ihrem Gott
  rationale: Bei der Niederwerfung ist „vor“ im Deutschen idiomatisch und bringt die Ausrichtung der Handlung auf Gott zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: „Weisung“ wahrt den breiteren hebräischen Bedeutungsumfang und vermeidet eine ausschließlich juristische Verengung; die feste Verbindung „Buch der Weisung“ bleibt dabei verständlich.
- issue: Konkrete oder abstrakte Wiedergabe von משתחוים
  choice: warfen sich nieder
  alternative: beteten an
  rationale: Der hebräische Ausdruck benennt die körperliche Niederwerfung. Die konkrete Übersetzung bewahrt das Bild, während der Anbetungscharakter durch „vor Jahwe“ klar bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem hebräischen Ablauf, wird aber für natürliche deutsche Lesbarkeit leicht geglättet. „Jahwe“ gibt den Gottesnamen wieder; „Weisung“ hält den Bedeutungsumfang von Tora offen.
