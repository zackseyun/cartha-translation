  text: וַ/יַּמְר֨וּ וַֽ/יִּמְרְד֜וּ בָּ֗/ךְ וַ/יַּשְׁלִ֤כוּ אֶת תּוֹרָֽתְ/ךָ֙ אַחֲרֵ֣י גַוָּ֔/ם וְ/אֶת נְבִיאֶ֣י/ךָ הָרָ֔גוּ אֲשֶׁר הֵעִ֥ידוּ בָ֖/ם לַ/הֲשִׁיבָ֣/ם אֵלֶ֑י/ךָ וַֽ/יַּעֲשׂ֔וּ נֶאָצ֖וֹת גְּדוֹלֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/026.yaml
  text: But they acted presumptuously and rebelled against you[a], and they cast your law behind their backs. They killed your prophets, who had warned them in order to bring them back to you[d][c][b], and they committed great blasphemies.
translation:
  language: de
  text: Doch sie widersetzten sich dir und lehnten sich gegen dich auf.[a] Sie warfen dein Gesetz[b] hinter ihren Rücken. Deine Propheten, die sie eindringlich warnten,[c] um sie zu dir zurückzubringen, töteten sie. Und sie begingen schwere Lästerungen.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie waren dir ungehorsam und rebellierten gegen dich«; das erste hebräische Verb bezeichnet trotzigen Widerstand.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »deine Weisung«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »die gegen sie Zeugnis ablegten«; gemeint ist ein feierliches Bezeugen oder Warnen.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »schwere Schmähungen« beziehungsweise »schwere Akte der Verachtung«; der hebräische Ausdruck ist weiter als ausschließlich gesprochene Gotteslästerung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ
  choice: sie widersetzten sich dir
  rationale: מרה bezeichnet hier trotzigen, ungehorsamen Widerstand. „Sich widersetzen“ unterscheidet das Verb vom folgenden ausdrücklichen „sich auflehnen“, ohne eine im Hebräischen nicht eindeutig vorhandene Nuance wie Vermessenheit festzuschreiben.
- source_word: וַיִּמְרְדוּ בָּךְ
  choice: lehnten sich gegen dich auf
  rationale: מרד bezeichnet offene Rebellion; die persönliche Ausrichtung gegen Gott bleibt durch „gegen dich“ erhalten.
- source_word: וַיַּשְׁלִכוּ ... אַחֲרֵי גַוָּם
  choice: Sie warfen ... hinter ihren Rücken
  rationale: Die konkrete hebräische Metapher für verächtliche Zurückweisung wird bewahrt und nicht zu „missachteten“ verflacht.
- source_word: תּוֹרָתְךָ
  choice: dein Gesetz
  rationale: תּוֹרָה kann allgemein „Weisung“ bedeuten; im bundesgeschichtlichen Zusammenhang ist „Gesetz“ eine natürliche und weithin verständliche Wiedergabe.
- source_word: נְבִיאֶיךָ
  choice: deine Propheten
  rationale: Direkte und kontextgemäße Standardwiedergabe.
- source_word: הֵעִידוּ בָם
  choice: die sie eindringlich warnten
  rationale: Das Hifil von עוד bezeichnet feierliches Bezeugen beziehungsweise Warnen. „Eindringlich warnten“ gibt in Verbindung mit dem Ziel ihrer Umkehr die Funktion natürlich wieder.
- source_word: לַהֲשִׁיבָם אֵלֶיךָ
  choice: um sie zu dir zurückzubringen
  rationale: Die kausative Bedeutung des Hifil von שוב und die persönliche Ausrichtung auf Gott werden ausdrücklich bewahrt.
- source_word: נֶאָצוֹת גְּדוֹלֹת
  choice: schwere Lästerungen
  rationale: Das Substantiv bezeichnet gravierende Akte der Verachtung oder Schmähung Gottes. „Lästerungen“ vermittelt diese theologische Schwere, während die Fußnote die breitere Bedeutung offenhält.
theological_decisions:
- issue: Wiedergabe der beiden Verben וַיַּמְרוּ und וַיִּמְרְדוּ
  choice: „widersetzten sich dir und lehnten sich gegen dich auf“
  alternative: „waren ungehorsam und rebellierten gegen dich“ beziehungsweise „handelten vermessen und rebellierten gegen dich“
  rationale: Die beiden verwandten, aber unterschiedlichen Verben werden differenziert, sodass die rhetorische Steigerung erhalten bleibt, ohne eine bestimmte dogmatische Deutung einzutragen.
- issue: Wiedergabe von נֶאָצוֹת
  choice: „Lästerungen“
  alternative: „Akte der Verachtung“, „Schmähungen“ oder „Provokationen“
  rationale: Der Kontext beschreibt schwere, gegen Gott gerichtete Verachtung. „Lästerungen“ macht diese vertikale Dimension verständlich, wird aber durch eine Fußnote gegen eine rein sprachliche Verengung abgesichert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Sätze erhalten die anklagende Abfolge des Hebräischen; die konkrete Metapher „hinter ihren Rücken“ bleibt bewusst stehen. Die Stellung von „töteten sie“ hebt wie im Hebräischen die Propheten als Opfer hervor.
