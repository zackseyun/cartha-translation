  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Voranstellung von »Deine Propheten« und das nachgestellte »töteten sie« ist als nachdrückliche, dem Hebräischen entsprechende Satzstellung gut möglich. »Und« stellt die abschließende Handlung natürlicher als bloße Fortsetzung der Aufzählung dar.
  terminology: »Gesetz« für תורה und »Weisung« in der Fußnote sind angemessen. »Lästerungen« trifft die gegen Gott gerichtete Verachtung im Kontext; die Fußnote bewahrt sinnvoll die weitere Bedeutung von נֶאָצוֹת. Die Fußnoten sind korrekt verankert und inhaltlich passend.
