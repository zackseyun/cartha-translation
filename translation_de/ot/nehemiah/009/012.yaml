  text: וּ/בְ/עַמּ֣וּד עָנָ֔ן הִנְחִיתָ֖/ם יוֹמָ֑ם וּ/בְ/עַמּ֥וּד אֵשׁ֙ לַ֔יְלָה לְ/הָאִ֣יר לָ/הֶ֔ם אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/012.yaml
  text: By a pillar of cloud you led them by day[a], and by a pillar of fire by night to give them light on the way in which they should go.
translation:
  language: de
  text: Durch eine Wolkensäule führtest du sie bei Tag und durch eine Feuersäule bei Nacht, um ihnen den Weg zu erhellen, den sie gehen sollten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְעַמּוּד עָנָן
  choice: Durch eine Wolkensäule
  rationale: בְּ kann hier instrumental oder räumlich verstanden werden. „Durch“ gibt im Zusammenhang mit dem Verb des Führens die Mittelbedeutung natürlich wieder, ohne die Wolkensäule selbst mit Gott gleichzusetzen.
- source_word: הִנְחִיתָם
  choice: führtest du sie
  rationale: Die Hifil-Form von נחה bezeichnet hier das Führen oder Leiten auf dem Weg. „Führtest“ ist präzise und entspricht dem historischen Rückblick.
- source_word: יוֹמָם
  choice: am Tag
  rationale: Die adverbiale Zeitangabe steht im ausgewogenen Gegensatz zu „in der Nacht“.
- source_word: וּבְעַמּוּד אֵשׁ לַיְלָה
  choice: und durch eine Feuersäule in der Nacht
  rationale: Die Formulierung bewahrt die Parallelität zur Wolkensäule und gibt לַיְלָה als nächtliche Zeitangabe wieder.
- source_word: לְהָאִיר לָהֶם אֶת הַדֶּרֶךְ
  choice: erhelltest du ihnen den Weg
  rationale: Der hebräische Infinitiv drückt Zweck oder Ergebnis aus. Im Deutschen lässt sich die direkte Verbindung mit „den Weg“ natürlich als koordiniertes Prädikat wiedergeben; „ihnen“ bewahrt den benefaktiven Dativ.
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: auf dem sie gehen sollten
  rationale: Die Relativkonstruktion bezeichnet den für Israel bestimmten Weg. „Sollten“ gibt die vorgesehene Richtung wieder, ohne einen ausdrücklichen göttlichen Befehl hinzuzufügen.
theological_decisions:
- issue: Gottes Führung durch Wolken- und Feuersäule
  choice: Die konkrete geschichtliche Führung und Wegerhellung wird unmittelbar wiedergegeben.
  alternative: Die Säulen ausdrücklich als Erscheinungsformen der göttlichen Gegenwart zu bezeichnen.
  rationale: Der Vers spricht von Gottes Handeln durch die Wolken- und Feuersäule, entfaltet hier aber keine typologische oder metaphysische Deutung.
- issue: Bezug des Zwecksatzes לְהָאִיר
  choice: Die Wegerhellung wird eng mit der Feuersäule in der Nacht verbunden.
  alternative: Den Zweck ausdrücklich auf Wolken- und Feuersäule gemeinsam beziehen.
  rationale: Die unmittelbare Stellung nach der nächtlichen Feuersäule legt den engeren Bezug nahe; die hebräische Infinitivkonstruktion erlaubt jedoch einen weiteren Bezug, weshalb die Fußnote die Alternative offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Zeitangaben „am Tag“ und „in der Nacht“ sowie die Bildsprache von Wolken- und Feuersäule bleiben erhalten.
