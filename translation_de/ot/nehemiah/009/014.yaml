source:
  edition: WLC
  text: וְ/אֶת שַׁבַּ֥ת קָדְשְׁ/ךָ֖ הוֹדַ֣עַתָ לָ/הֶ֑ם וּ/מִצְו֤וֹת וְ/חֻקִּים֙ וְ/תוֹרָ֔ה צִוִּ֣יתָ לָ/הֶ֔ם בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/014.yaml
  text: You made your holy Sabbath known to them[b][a], and you commanded them commandments and statutes and a law by the hand of Moses your servant.
translation:
  language: de
  text: Du hast ihnen deinen heiligen Sabbat bekannt gemacht und ihnen Gebote, Ordnungen und Weisung[a] durch deinen Diener Mose[b] vorgeschrieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gesetz“. Das hebräische Wort kann sowohl verbindliche Weisung als auch Gesetz bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durch die Hand deines Dieners Mose“; gemeint ist die Vermittlung durch Mose.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת קָדְשְׁךָ
  choice: deinen heiligen Sabbat
  rationale: Die substantivische Verbindung bezeichnet Gottes heiligen Sabbat. „Sabbat“ bewahrt die konkrete bundes- und kultbezogene Bedeutung.
- source_word: הוֹדַעַתָ
  choice: bekannt gemacht
  rationale: 'Der Hifil von ידע hat kausative Bedeutung: jemanden etwas wissen lassen beziehungsweise etwas bekannt machen.'
- source_word: מִצְוֹת
  choice: Gebote
  rationale: Der Ausdruck bezeichnet verbindliche Anordnungen und wird im Deutschen treffend mit „Gebote“ wiedergegeben.
- source_word: חֻקִּים
  choice: Ordnungen
  rationale: Das Wort bezeichnet festgesetzte Bestimmungen. „Ordnungen“ ist würdig und verständlich, ohne die Kategorie mit „Gebote“ gleichzusetzen.
- source_word: תוֹרָה
  choice: Weisung
  rationale: תּוֹרָה umfasst Unterweisung und verbindliche Weisung. Im vorliegenden Dreiklang vermeidet „Weisung“ die Verengung auf ein modernes Gesetzbuch, ohne den verpflichtenden Charakter abzuschwächen.
- source_word: צִוִּיתָ לָהֶם
  choice: ihnen … gegeben
  rationale: Wörtlich steht „ihnen geboten“. Im Deutschen wäre „ihnen Gebote … geboten“ schwerfällig; „gegeben“ bewahrt im Kontext den Gedanken der göttlichen Anordnung in natürlicher Sprache.
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: durch deinen Diener Mose
  rationale: Die Wendung „durch die Hand“ ist ein hebräisches Idiom für Vermittlung beziehungsweise Beauftragung. Natürliches Deutsch gibt sie mit „durch“ wieder.
theological_decisions:
- issue: Wiedergabe der rechtlich-theologischen Dreierformel מִצְוֹת וְחֻקִּים וְתוֹרָה
  choice: Gebote, Ordnungen und Weisung
  alternative: Gebote, Satzungen und Gesetz
  rationale: Die drei Ausdrücke bleiben unterschieden. „Weisung“ erhält die Bedeutungsbreite von תּוֹרָה zwischen Lehre und verpflichtender Norm, während „Ordnungen“ die festgesetzten Bestimmungen bezeichnet.
- issue: Art und Mittlerschaft der Offenbarung durch Mose
  choice: durch deinen Diener Mose
  alternative: durch die Hand deines Dieners Mose
  rationale: Die idiomatische Vermittlungsfunktion wird klar ausgedrückt, ohne Mose zur Quelle der Gebote zu machen; Gott bleibt Subjekt des Gebens.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, wird aber durch „gegeben“ statt der im Deutschen tautologischen Form „Gebote geboten“ natürlich gestaltet. Beide Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
