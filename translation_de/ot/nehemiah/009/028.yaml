    issue: „sobald“ überträgt die temporale Wendung zu eng.
    rationale: וּכְנוֹחַ לָהֶם bedeutet „als/wenn sie Ruhe hatten“ und markiert den Umstand bzw. Zeitpunkt, nicht zwingend ein unmittelbares „sobald“.
  - severity: low
    issue: „kehrten sie um“ legt die Art ihrer Rückkehr stärker fest als der hebräische Wortlaut.
    rationale: Das zweite וַיָּשׁוּבוּ kann im Zusammenhang eine Hinwendung zu Gott meinen, bezeichnet wörtlich jedoch schlicht ein Zurückkehren. „kehrten sie zurück“ bewahrt diese Offenheit.
  - severity: low
    issue: Die Stellung von „vom Himmel her“ ist potenziell mehrdeutig.
    rationale: Mit vorangestellter Ortsangabe wird klarer, dass Gott vom Himmel her hört, nicht dass der Ruf vom Himmel kommt.
