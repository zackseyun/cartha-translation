revisions:
- from: Doch sobald sie Ruhe hatten, taten sie wieder, was böse war vor dir. Da gabst du sie der Gewalt ihrer Feinde preis[a], die über sie herrschten. Dann kehrten sie um und schrien zu dir, und du hörtest sie vom Himmel her und rettetest sie nach deinem Erbarmen viele Male.
  to: Als sie aber Ruhe hatten, taten sie wieder, was böse war vor dir. Da gabst du sie der Gewalt ihrer Feinde preis[a], die über sie herrschten. Dann kehrten sie zurück und schrien zu dir, und vom Himmel her hörtest du sie und rettetest sie nach deinem Erbarmen viele Male.
  rationale: Die Revision entfernt die nicht gedeckte Implikation unmittelbarer Wiederholung in „sobald“, bewahrt beim zweiten „zurückkehren“ die semantische Offenheit des Hebräischen und verdeutlicht den Bezug von „vom Himmel her“. Die idiomatische Wiedergabe der Hand-Metapher mit Note sowie die korrekte Zuordnung von „viele Male“ bleiben erhalten.
