id: NEH.9.28
reference: Nehemiah 9:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/כְ/נ֣וֹחַ לָ/הֶ֔ם יָשׁ֕וּבוּ לַ/עֲשׂ֥וֹת רַ֖ע לְ/פָנֶ֑י/ךָ וַ/תַּֽעַזְבֵ֞/ם בְּ/יַ֤ד אֹֽיְבֵי/הֶם֙ וַ/יִּרְדּ֣וּ בָ/הֶ֔ם וַ/יָּשׁ֨וּבוּ֙ וַ/יִּזְעָק֔וּ/ךָ וְ/אַתָּ֞ה מִ/שָּׁמַ֧יִם תִּשְׁמַ֛ע וְ/תַצִּילֵ֥/ם כְּֽ/רַחֲמֶ֖י/ךָ רַבּ֥וֹת עִתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/028.yaml
  text: But when they had rest, they again did evil before you; so you left them in the power of their enemies[a], who ruled over them. Then they returned and cried out to you, and from heaven you heard and delivered them many times according to your mercies.
translation:
  language: de
  text: Als sie aber Ruhe hatten, taten sie wieder, was böse war vor dir. Da gabst du sie der Gewalt ihrer Feinde preis[a], die über sie herrschten. Dann kehrten sie zurück und schrien zu dir, und vom Himmel her hörtest du sie und rettetest sie nach deinem Erbarmen viele Male.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in die Hand ihrer Feinde“; die „Hand“ steht im Hebräischen für Macht oder Verfügungsgewalt.'
    reason: cultural_note
lexical_decisions:
- source_word: וּכְנוֹחַ לָהֶם
  choice: Doch sobald sie Ruhe hatten
  rationale: Die temporale Konstruktion bezeichnet den Zeitpunkt bzw. Umstand ihres erneuten Abfalls. „Sobald“ gibt den engen erzählerischen Anschluss natürlich wieder, ohne eine längere Verzögerung anzunehmen.
- source_word: יָשׁוּבוּ לַעֲשׂוֹת רַע
  choice: taten sie wieder, was böse war
  rationale: שׁוב mit Infinitiv bezeichnet hier die Wiederholung der Handlung; eine wörtliche Wiedergabe als „kehrten sie zurück, Böses zu tun“ wäre im Deutschen missverständlich.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: Bewahrt die relationale Vorstellung des Handelns in Gottes Gegenwart, ohne sie auf bloßes Sehen oder ausdrücklich auf Feindschaft zu verengen.
- source_word: וַתַּעַזְבֵם בְּיַד אֹיְבֵיהֶם
  choice: Da gabst du sie der Gewalt ihrer Feinde preis
  rationale: עזב beschreibt hier den Entzug des Schutzes; die Hand ist ein hebräisches Bild für Macht und Verfügungsgewalt. Die natürliche deutsche Wendung bewahrt die Härte des Gerichts, ohne endgültige Verlassenheit auszusagen.
- source_word: וַיִּרְדּוּ בָהֶם
  choice: die über sie herrschten
  rationale: Das Verb bezeichnet die Ausübung von Herrschaft. „Herrschten über sie“ bleibt nahe am lexikalischen Kern, ohne Unterdrückung zusätzlich auszudeuten.
- source_word: וַיָּשׁוּבוּ
  choice: Dann kehrten sie um
  rationale: Anders als beim ersten Vorkommen von שׁוב ist hier eine wirkliche Umkehr im Zusammenhang mit dem Hilferuf gemeint.
- source_word: וַיִּזְעָקוּךָ
  choice: und schrien zu dir
  rationale: Gibt den dringlichen Hilferuf knapp und unmittelbar wieder.
- source_word: מִשָּׁמַיִם תִּשְׁמַע
  choice: du hörtest sie vom Himmel her
  rationale: Die vorangestellte Herkunftsangabe wird bewahrt; das ergänzte Objekt „sie“ ist im Deutschen natürlich und bezieht sich auf ihren Ruf.
- source_word: וְתַצִּילֵם
  choice: und rettetest sie
  rationale: נצל bezeichnet hier die konkrete Rettung aus der Gewalt der Feinde. „Retten“ ist im modernen Deutsch natürlicher als „erretten“ und bleibt im historischen Kontext eindeutig.
- source_word: כְּרַחֲמֶיךָ רַבּוֹת עִתִּים
  choice: nach deinem Erbarmen viele Male
  rationale: רַבּוֹת stimmt mit עִתִּים überein und bedeutet daher „viele Male“; es beschreibt nicht das Erbarmen als „reichlich“ oder „vielfach“.
theological_decisions:
- issue: Göttliches Verlassen im Gericht
  choice: gabst du sie der Gewalt ihrer Feinde preis
  alternative: verließest du sie in der Hand ihrer Feinde
  rationale: Die Formulierung beschreibt den gerichtlichen Entzug göttlichen Schutzes, nicht eine absolute oder endgültige Verlassenheit. Zugleich wird die Schwere des Handelns nicht abgeschwächt.
- issue: Wiederholte Handlungen in der Schlussklausel
  choice: du hörtest sie … und rettetest sie … viele Male
  alternative: du pflegtest sie … zu hören und zu retten
  rationale: Die hebräischen Imperfektformen fassen wiederholte vergangene Vorgänge zusammen. Das Präteritum zusammen mit „viele Male“ gibt diesen iterativen Sinn im Deutschen klar wieder.
- issue: Bezug von רַבּוֹת
  choice: viele Male
  alternative: nach deinem reichen Erbarmen
  rationale: Das feminine Pluralwort רַבּוֹת bezieht sich grammatisch auf עִתִּים („Male/Zeiten“), nicht auf רַחֲמֶיךָ („dein Erbarmen“).
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die beiden Verwendungen von שׁוב werden bewusst unterschieden: zuerst idiomatisch als Wiederholung („wieder“), danach als tatsächliche Umkehr („kehrten … um“).'
