source:
  edition: WLC
  text: וַ/יִּזְבְּח֣וּ בַ/יּוֹם הַ֠/הוּא זְבָחִ֨ים גְּדוֹלִ֜ים וַ/יִּשְׂמָ֗חוּ כִּ֤י הָ/אֱלֹהִים֙ שִׂמְּחָ/ם֙ שִׂמְחָ֣ה גְדוֹלָ֔ה וְ/גַ֧ם הַ/נָּשִׁ֛ים וְ/הַ/יְלָדִ֖ים שָׂמֵ֑חוּ וַ/תִּשָּׁמַ֛ע שִׂמְחַ֥ת יְרוּשָׁלִַ֖ם מֵ/רָחֽוֹק־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/043.yaml
  text: On that day they offered great sacrifices and rejoiced[a], because God had made them rejoice with great joy. Also the women and the children rejoiced[d][c][b], and the joy of Jerusalem was heard from far away.
translation:
  language: de
  text: An jenem Tag brachten sie große Schlachtopfer dar[a] und freuten sich, denn Gott hatte ihnen große Freude bereitet[b]. Auch die Frauen[c] und die Kinder freuten sich, und die Freude Jerusalems war aus großer Entfernung zu hören[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „opferten große Schlachtopfer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „denn Gott hatte bewirkt, dass sie sich mit großer Freude freuten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die Ehefrauen“. Das hebräische Wort kann je nach Zusammenhang „Frauen“ oder „Ehefrauen“ bedeuten.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „war weithin zu hören“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: brachten … Schlachtopfer dar
  rationale: Das Verb זבח bezeichnet im kultischen Zusammenhang das Schlachten beziehungsweise Darbringen von Opfern. Die deutsche Wendung ist natürlich und bewahrt den Opfercharakter.
- source_word: זְבָחִים גְּדוֹלִים
  choice: große Schlachtopfer
  rationale: זְבָחִים bezeichnet Schlachtopfer; גְּדוֹלִים beschreibt ihre Größe oder Bedeutung. „Große“ lässt diese Bedeutungsbreite bestehen.
- source_word: וַיִּשְׂמָחוּ / שָׂמֵחוּ
  choice: freuten sich
  rationale: Die wiederholte Übersetzung bewahrt den lexikalischen Zusammenhang des mehrfach verwendeten Stammes שׂמח und klingt in modernem Deutsch natürlich.
- source_word: כִּי
  choice: denn
  rationale: כִּי nennt hier den Grund ihrer Freude. „Denn“ verbindet die beiden Hauptsätze in würdigem, flüssigem Deutsch.
- source_word: שִׂמְּחָם שִׂמְחָה גְדוֹלָה
  choice: hatte ihnen große Freude bereitet
  rationale: Die Form שִׂמְּחָם stellt Gott als Ursache ihrer Freude dar. Die deutsche Fassung erhält diese göttliche Verursachung, ohne die im Deutschen schwerfällige Wiederholung „mit großer Freude freuen“ nachzubilden.
- source_word: הַנָּשִׁים וְהַיְלָדִים
  choice: die Frauen und die Kinder
  rationale: נָשִׁים kann Frauen oder Ehefrauen bedeuten. Ohne ausdrückliche Besitzangabe ist „Frauen“ die offenere Wiedergabe; יְלָדִים bedeutet hier „Kinder“.
- source_word: וַתִּשָּׁמַע
  choice: war … zu hören
  rationale: Das Nifal hat passiven Sinn. „War zu hören“ gibt ihn in natürlichem gegenwärtigem Deutsch wieder.
- source_word: שִׂמְחַת יְרוּשָׁלִַם מֵרָחוֹק
  choice: die Freude Jerusalems war weithin zu hören
  rationale: Die Genitivverbindung bleibt erhalten; „weithin“ drückt aus, dass die Freude aus großer Entfernung vernommen wurde.
theological_decisions:
- issue: Gott als Urheber der Freude
  choice: Gott hatte ihnen große Freude bereitet.
  alternative: Gott hatte sie mit großer Freude erfüllt / Gott hatte bewirkt, dass sie sich sehr freuten.
  rationale: Der Piel-Stamm שִׂמְּחָם bezeichnet Gott ausdrücklich als den, der ihre Freude bewirkte. Die gewählte Formulierung wahrt diese Aussage, ohne sie dogmatisch auszubauen.
- issue: Umfang der feiernden Gemeinschaft
  choice: Frauen und Kinder werden ausdrücklich genannt.
  alternative: Ehefrauen und Kinder
  rationale: Der Text hebt die breite Beteiligung an der Freude hervor. Da נָשִׁים sowohl „Frauen“ als auch „Ehefrauen“ heißen kann, wird die Mehrdeutigkeit in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. „Schlachtopfer“ bewahrt die kultische Präzision; „große Freude bereitet“ vermeidet eine unnatürliche deutsche Wortwiederholung und erhält zugleich Gottes ausdrückliche Verursachung der Freude. Alle echten lexikalischen Alternativen werden in Fußnoten offengelegt.
