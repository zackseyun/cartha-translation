source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֗ם יֵשׁ֧וּעַ בִּנּ֛וּי קַדְמִיאֵ֥ל שֵׁרֵבְיָ֖ה יְהוּדָ֣ה מַתַּנְיָ֑ה עַֽל הֻיְּד֖וֹת ה֥וּא וְ/אֶחָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/008.yaml
  text: And the Levites were Jeshua[a], Binnui, Kadmiel, Sherebiah, Judah, and Mattaniah, who, with his brothers[b], was over the thanksgiving songs.
translation:
  language: de
  text: Und die Leviten waren Jeschua, Binnui, Kadmiël, Scherebja, Juda und Mattanja. Er und seine Brüder waren für die Danksagungen verantwortlich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bei kollektivem Verständnis des hebräischen Wortlauts: „Sie waren zusammen mit ihren Brüdern für die Danksagungen verantwortlich.“ Das singularische „er“ bezieht sich am ehesten auf Mattanja. „Danksagungen“ kann in diesem liturgischen Zusammenhang auch dankbares Lob, möglicherweise in musikalischer Form, bezeichnen.'
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Und die Leviten waren
  rationale: Die hebräische Nominalkonstruktion leitet eine weitere Personengruppe in der Liste ein; das im Deutschen ergänzte „waren“ sorgt für einen natürlichen, klaren Satz.
- source_word: יֵשׁוּעַ בִּנּוּי קַדְמִיאֵל שֵׁרֵבְיָה יְהוּדָה מַתַּנְיָה
  choice: Jeschua, Binnui, Kadmiël, Scherebja, Juda und Mattanja
  rationale: Die Personennamen werden in einer im Deutschen üblichen, quellennahen Form wiedergegeben.
- source_word: עַל
  choice: für … verantwortlich
  rationale: Die Präposition bezeichnet hier wahrscheinlich die Zuständigkeit für eine levitische Aufgabe; diese Wiedergabe ist im modernen Deutschen natürlicher als das wörtliche „über“.
- source_word: הֻיְּדוֹת
  choice: die Danklieder
  rationale: Der pluralische Ausdruck bezeichnet in diesem liturgischen Zusammenhang Danksagungen beziehungsweise Lobpreis; „Danklieder“ gibt die wahrscheinlich gemeinte musikalisch-liturgische Funktion knapp und verständlich wieder.
- source_word: הוּא וְאֶחָיו
  choice: Er und seine Brüder
  rationale: Das singularische Pronomen weist am natürlichsten auf den zuletzt genannten Mattanja zurück, während „seine Brüder“ die mit ihm verbundenen Leviten bezeichnet.
theological_decisions:
- issue: Bezug des singularischen Pronomens הוּא nach der Liste der Leviten
  choice: „Er“ bezieht sich auf Mattanja, den zuletzt Genannten; gemeinsam mit seinen Brüdern trug er die Verantwortung.
  alternative: Das Pronomen kann lockerer beziehungsweise kollektiv auf die zuvor genannten Leviten bezogen werden.
  rationale: Der Singular spricht syntaktisch am ehesten für Mattanja als Bezugsperson. Da die knappe hebräische Form eine kollektivere Auffassung nicht völlig ausschließt, wird diese Möglichkeit in einer Fußnote bewahrt.
- issue: Bedeutung von הֻיְּדוֹת im levitischen Dienst
  choice: Danklieder
  alternative: Danksagungen; Lobpreisungen
  rationale: Im Kontext levitischer Aufgaben liegt eine liturgische, wahrscheinlich musikalische Bedeutung nahe. Die Übersetzung vermeidet jedoch weitergehende konfessionelle Festlegungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Namensliste bleibt knapp; der fragmentarisch wirkende hebräische Nachsatz wird in zwei natürliche deutsche Sätze gegliedert. Die sachliche Wendung „für … verantwortlich“ macht die Aufsichtsfunktion verständlich.
