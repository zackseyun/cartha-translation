  text: וְ/אֵ֨לֶּה֙ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם אֲשֶׁ֥ר עָל֛וּ עִם זְרֻבָּבֶ֥ל בֶּן שְׁאַלְתִּיאֵ֖ל וְ/יֵשׁ֑וּעַ שְׂרָיָ֥ה יִרְמְיָ֖ה עֶזְרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/001.yaml
  text: 'These were the priests and the Levites who came up with Zerubbabel son of Shealtiel[a], and Jeshua: Seraiah, Jeremiah, Ezra.'
translation:
  language: de
  text: 'Und dies sind die Priester und die Leviten, die mit Serubbabel, dem Sohn Schealtiëls, und Jeschua[a] hinaufzogen: Seraja, Jeremia und Esra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch יֵשׁוּעַ (Jeschua); bei Angleichung der Namensform auch Josua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Das einleitende Waw verbindet den neuen Listenabschnitt mit dem vorherigen Zusammenhang; „Und dies sind“ gibt diese Verknüpfung ohne einen unbelegten zeitlichen Marker wieder.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: die Priester und die Leviten
  rationale: Die beiden koordinierten Gruppen werden in der üblichen und sachlich direkten Form wiedergegeben.
- source_word: אֲשֶׁר עָלוּ
  choice: die … hinaufzogen
  rationale: עלה bezeichnet im Zusammenhang der Rückkehr aus dem Exil den Zug hinauf nach Juda beziehungsweise Jerusalem; „hinaufzogen“ bewahrt diese räumlich und heilsgeschichtlich geprägte Ausdrucksweise.
- source_word: עִם
  choice: mit
  rationale: Direkte Wiedergabe der Begleitung.
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: Serubbabel, dem Sohn Schealtiëls
  rationale: Die Namen werden in geläufiger deutscher Transkription wiedergegeben; die Abstammungsangabe wird idiomatisch als Apposition formuliert.
- source_word: וְיֵשׁוּעַ
  choice: und Jeschua
  rationale: „Jeschua“ bildet die hier vorliegende hebräische Namensform יֵשׁוּעַ ab, statt sie zur verwandten Form „Josua“ zu normalisieren.
- source_word: שְׂרָיָה יִרְמְיָה עֶזְרָא
  choice: Seraja, Jeremia und Esra
  rationale: Die Eigennamen, mit denen die Liste beginnt, werden in geläufigen deutschen Formen als einfache Aufzählung wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der Doppelpunkt macht deutlich, dass mit Seraja, Jeremia und Esra die angekündigte Liste beginnt. Die Namensformen folgen geläufiger deutscher Bibeltradition, während „Jeschua“ die konkrete hebräische Form bewahrt.
