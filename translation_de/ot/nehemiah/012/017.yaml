lexical_decisions:
- source_word: לַ/אֲבִיָּה
  choice: für Abija
  rationale: Das präfigierte ל bezeichnet in dieser Liste die Zuordnung zu einem priesterlichen Haus beziehungsweise einer Abteilung. „Für Abija“ bewahrt die knappe, elliptische Listenform.
- source_word: זִכְרִי
  choice: Sichri
  rationale: Der Personenname wird in einer im Deutschen geläufigen bibelnahen Form wiedergegeben.
- source_word: לְ/מִנְיָמִין
  choice: für Minjamin
  rationale: Das ל kennzeichnet erneut die Zuordnung innerhalb der Liste. Da der hebräische Text hier keinen zugehörigen Vertreter nennt, wird diese auffällige Ellipse nicht ergänzt.
- source_word: לְ/מוֹעַדְיָה
  choice: für Moadja
  rationale: Der masoretische Konsonanten- und Vokaltext weist auf den Eigennamen Moadja. Das präfigierte ל drückt die Zuordnung aus.
- source_word: פִּלְטָי
  choice: Piltai
  rationale: Der Personenname wird transliteriert; in der Listenstruktur ist Piltai Moadja zugeordnet.
