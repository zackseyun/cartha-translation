lexical_decisions:
- source_word: יְהוּדָה
  choice: Juda
  rationale: In dieser Namensliste ist die Form als Personen- beziehungsweise Stammesname zu verstehen, nicht als Bezeichnung der geografischen Region. Die im Deutschen geläufige biblische Namensform lautet „Juda“.
- source_word: בִנְיָמִן
  choice: Benjamin
  rationale: Eigenname innerhalb einer koordinierten Liste; die geläufige deutsche biblische Namensform wird verwendet.
- source_word: שְׁמַעְיָה
  choice: Schemaja
  rationale: Personenname; „Schemaja“ ist eine geläufige deutsche Wiedergabe, die den hebräischen Namen erkennbar bewahrt.
- source_word: יִרְמְיָה
  choice: Jeremia
  rationale: Personenname; die traditionelle und allgemein verständliche deutsche Namensform „Jeremia“ wird verwendet.
- source_word: וְ / וּ
  choice: und
  rationale: Die wiederholte hebräische Konjunktion verbindet die Namen. Natürliches Deutsch gibt die Aufzählung mit Kommas und einem abschließenden „und“ wieder.
