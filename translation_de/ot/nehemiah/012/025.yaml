  yaml_path: translation/ot/nehemiah/012/025.yaml
  text: Mattaniah, Bakbukiah, Obadiah, Meshullam, Talmon, and Akkub were guards, gatekeepers, keeping watch at the storehouses of the gates.
translation:
  language: de
  text: Mattanja, Bakbukja, Obadja, Meschullam, Talmon und Akkub hielten als Torwächter Wache bei den Vorratsräumen an den Toren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: bei den Sammelräumen der Tore.'
    reason: Die seltene Form אֲסֻפֵּי kann Sammel-, Lager- oder Vorratsräume bezeichnen; auch die genaue Beziehung zu „den Toren“ bleibt knapp ausgedrückt.
lexical_decisions:
- source_word: שֹׁמְרִים שׁוֹעֲרִים מִשְׁמָר
  choice: hielten als Torwächter Wache
  rationale: Die hebräische Häufung von Wörtern aus den Bereichen Bewachen, Torwächter und Wachdienst wird in natürlichem Deutsch bewahrt, ohne das unidiomatische „waren Wächter, Torwächter“.
- source_word: בַּאֲסֻפֵּי הַשְּׁעָרִים
  choice: bei den Vorratsräumen an den Toren
  rationale: אֲסֻפִּים bezeichnet hier wahrscheinlich Sammel- oder Lagerräume; „Vorratsräume“ ist im Kontext verständlich, während die räumliche Zuordnung zu den Toren mit „an“ vorsichtig wiedergegeben wird.
