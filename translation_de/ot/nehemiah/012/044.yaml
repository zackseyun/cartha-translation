  text: וַ/יִּפָּקְד֣וּ בַ/יּוֹם֩ הַ/ה֨וּא אֲנָשִׁ֜ים עַל הַ/נְּשָׁכ֗וֹת לָ/א֨וֹצָר֥וֹת לַ/תְּרוּמוֹת֮ לָ/רֵאשִׁ֣ית וְ/לַ/מַּֽעַשְׂרוֹת֒ לִ/כְנ֨וֹס בָּ/הֶ֜ם לִ/שְׂדֵ֤י הֶ/עָרִים֙ מְנָא֣וֹת הַ/תּוֹרָ֔ה לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם כִּ֚י שִׂמְחַ֣ת יְהוּדָ֔ה עַל הַ/כֹּהֲנִ֥ים וְ/עַל הַ/לְוִיִּ֖ם הָ/עֹמְדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/044.yaml
  text: On that day men were appointed over the storerooms for the contributions[a], for the firstfruits, and for the tithes, to gather into them from the fields of the cities the portions required by the law for the priests and for the Levites[c][b], for Judah rejoiced over the priests and over the Levites who were serving.
translation:
  language: de
  text: An jenem Tag wurden Männer über die Kammern eingesetzt, die als Vorratsräume[a] für die Abgaben, die Erstlingsgaben und die Zehnten dienten. Dort sollten sie aus den Feldern der Städte die im Gesetz festgelegten Anteile[b] für die Priester und die Leviten sammeln. Denn Juda freute sich über die Priester und die Leviten, die ihren Dienst versahen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Kammern für die Vorräte“. Das hebräische Wort für „Kammern“ kann allgemein Räume bezeichnen; hier dienten sie zur Aufbewahrung der genannten Gaben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Anteile der Tora“, also die Anteile, die in der Tora vorgeschrieben waren.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „die dastanden“. Im Zusammenhang des Tempels ist damit gemeint, dass sie zum Dienst bereitstanden und ihn versahen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפָּקְדוּ
  choice: wurden … eingesetzt
  rationale: Das passive Verb bezeichnet die förmliche Einsetzung von Männern in eine Verwaltungsaufgabe.
- source_word: הַנְּשָׁכוֹת לָאוֹצָרוֹת
  choice: die Kammern …, die als Vorratsräume … dienten
  rationale: נשכות bezeichnet Kammern oder Räume; אוצרות hebt hier ihre Funktion zur Aufbewahrung der nachfolgend genannten Gaben hervor. Die Wiedergabe vermeidet die missverständliche Vorstellung zusätzlich aufgezählter, getrennter Schatzkammern.
- source_word: לַתְּרוּמוֹת
  choice: für die Abgaben
  rationale: תרומות sind für den heiligen Gebrauch ausgesonderte Gaben beziehungsweise Abgaben. „Abgaben“ passt zum administrativen Sammlungskontext, ohne eine bestimmte Ritualform zu erzwingen.
- source_word: לָרֵאשִׁית
  choice: die Erstlingsgaben
  rationale: Der Ausdruck bezeichnet die ersten Erträge, die Gott beziehungsweise dem Heiligtum zukamen; „Erstlingsgaben“ ist im Deutschen verständlich und sachgerecht.
- source_word: וְלַמַּעַשְׂרוֹת
  choice: und die Zehnten
  rationale: מעשרות ist der übliche Ausdruck für die als Zehntel entrichteten Abgaben.
- source_word: לִכְנוֹס בָּהֶם
  choice: Dort sollten sie … sammeln
  rationale: Die Konstruktion bezeichnet das Einsammeln in die genannten Räume. Die Aufteilung in zwei Sätze macht den langen hebräischen Satz im Deutschen übersichtlich.
- source_word: לִשְׂדֵי הֶעָרִים
  choice: aus den Feldern der Städte
  rationale: Gemeint sind die landwirtschaftlichen Flächen, die den jeweiligen Städten beziehungsweise Ortschaften zugeordnet waren.
- source_word: מְנָאוֹת הַתּוֹרָה
  choice: die im Gesetz festgelegten Anteile
  rationale: Wörtlich sind es „Anteile der Tora“; der Genitiv bezeichnet hier die von der Tora vorgeschriebenen Anteile.
- source_word: כִּי שִׂמְחַת יְהוּדָה
  choice: Denn Juda freute sich
  rationale: Die nominale hebräische Wendung „denn die Freude Judas [galt …]“ wird als natürliche deutsche Verbalkonstruktion wiedergegeben. „Juda“ bezeichnet hier die judäische Gemeinschaft.
- source_word: הָעֹמְדִים
  choice: die ihren Dienst versahen
  rationale: Wörtlich heißt das Partizip „die dastehen/stehen“. Im Tempelzusammenhang bezeichnet das Stehen die dienstbereite Anwesenheit und damit den ausgeübten Dienst.
theological_decisions:
- issue: Bezug von הָעֹמְדִים
  choice: als tempelbezogenen Dienst der Priester und Leviten wiedergegeben
  alternative: 'wörtlich: „die dastanden“'
  rationale: Der kultische Kontext legt Dienstbereitschaft beziehungsweise Amtsausübung nahe; die Fußnote bewahrt den konkreten Wortlaut, ohne darüber hinaus eine konfessionelle Amtslehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der sehr lange hebräische Satz wurde zur besseren Verständlichkeit in drei Sätze gegliedert. Kultische Fachsprache wurde nur dort verwendet, wo sie im Deutschen geläufig ist; die konkretere hebräische Ausdrucksweise wird in den Fußnoten dokumentiert.
