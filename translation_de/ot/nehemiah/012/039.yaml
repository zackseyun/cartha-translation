base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/039.yaml
  text: and above the Gate of Ephraim[a], and above the Old Gate, and above the Fish Gate, and the Tower of Hananel, and the Tower of the Hundred, and as far as the Sheep Gate[b]; and they stood at the Gate of the Guard.
translation:
  language: de
  text: und oberhalb des Ephraimtors, des Alten Tors und des Fischtores, am Hananelturm und am Hundertturm vorbei bis zum Schaftor; und sie blieben am Wachtor[a] stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »am Gefängnistor«; die genaue Bedeutung der Torbezeichnung ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעַל ... וְעַל ... וְעַל
  choice: oberhalb des ...
  rationale: מֵעַל und das wiederholte עַל beschreiben hier den Weg der Prozession auf der Stadtmauer oberhalb der genannten Tore. Die zusammengezogene deutsche Form vermeidet schwerfällige Wiederholungen, ohne den räumlichen Sinn aufzugeben.
- source_word: לְשַׁעַר אֶפְרַיִם
  choice: des Ephraimtors
  rationale: Die deutsche Zusammensetzung ist die natürliche Wiedergabe der hebräischen Verbindung aus »Tor« und dem Eigennamen Ephraim.
- source_word: שַׁעַר הַיְשָׁנָה
  choice: das Alte Tor
  rationale: הַיְשָׁנָה wird naheliegend als Bezeichnung »das alte« verstanden. Eine Erweiterung zu »Tor der Altstadt« oder eine Transliteration wäre weniger sicher.
- source_word: שַׁעַר הַדָּגִים
  choice: das Fischtor
  rationale: Die wörtliche Bedeutung »Tor der Fische« wird im Deutschen idiomatisch als »Fischtor« wiedergegeben.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: Hananelturm
  rationale: Die deutsche Zusammensetzung gibt die Verbindung aus »Turm« und dem Eigennamen Hananel knapp und natürlich wieder.
- source_word: מִגְדַּל הַמֵּאָה
  choice: Hundertturm
  rationale: Die formal nahe Wiedergabe bewahrt die unklare Bedeutung von »hundert«, statt den Bezug spekulativ zu erklären.
- source_word: וְעַד שַׁעַר הַצֹּאן
  choice: bis zum Schaftor
  rationale: עַד bezeichnet den Endpunkt des beschriebenen Weges; »bis zum« gibt dies präzise wieder.
- source_word: וְעָמְדוּ
  choice: Dann blieben sie ... stehen
  rationale: עמד bedeutet grundsätzlich »stehen«; im Zusammenhang einer Prozession bezeichnet es hier natürlich das Anhalten und anschließende Stehen am Zielpunkt.
- source_word: בְּשַׁעַר הַמַּטָּרָה
  choice: am Wachtor
  rationale: מַטָּרָה kann mit Wache, Wachposten oder Gewahrsam verbunden sein. »Wachtor« hält den sicherheitsbezogenen Sinn fest, ohne eindeutig auf ein Gefängnis festzulegen.
