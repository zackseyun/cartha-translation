lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: und Asarja
  rationale: Die vorangestellte Konjunktion וַ wird als „und“ wiedergegeben und führt die Namensliste fort. Der Personenname עֲזַרְיָה erscheint in der im Deutschen üblichen biblischen Form „Asarja“.
- source_word: עֶזְרָא
  choice: Esra
  rationale: Der Personenname wird in seiner etablierten deutschen biblischen Form wiedergegeben. Im Hebräischen steht vor ihm keine Konjunktion; entsprechend wird auch im Deutschen kein zusätzliches „und“ ergänzt.
- source_word: וּ/מְשֻׁלָּם
  choice: und Meschullam
  rationale: Die vorangestellte Konjunktion וּ wird als „und“ wiedergegeben und kennzeichnet das letzte Glied der Aufzählung. Der Personenname מְשֻׁלָּם wird gemäß der gebräuchlichen deutschen Schreibung als „Meschullam“ transliteriert.
