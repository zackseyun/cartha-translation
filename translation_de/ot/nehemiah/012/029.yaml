  text: וּ/מִ/בֵּית֙ הַגִּלְגָּ֔ל וּ/מִ/שְּׂד֥וֹת גֶּ֖בַע וְ/עַזְמָ֑וֶת כִּ֣י חֲצֵרִ֗ים בָּנ֤וּ לָ/הֶם֙ הַ/מְשֹׁ֣רֲרִ֔ים סְבִיב֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/029.yaml
  text: and from Beth-gilgal[a], and from the fields of Geba and Azmaveth, for the singers had built villages for themselves around Jerusalem.
translation:
  language: de
  text: und aus Bet-Gilgal und aus den Feldern von Geba und Asmawet; denn die Sänger hatten sich rings um Jerusalem Dörfer[a] gebaut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Siedlungen«. Das hebräische Wort kann umfriedete Wohnplätze bezeichnen und meint hier die Orte, an denen die Sänger rings um Jerusalem wohnten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֵּית הַגִּלְגָּל
  choice: und aus Bet-Gilgal
  rationale: Die Präfixe bedeuten »und aus«. בֵּית ist hier Teil eines Ortsnamens und bezeichnet nicht wörtlich ein Haus.
- source_word: וּמִשְּׂדוֹת גֶּבַע וְעַזְמָוֶת
  choice: sowie von den Feldern bei Geba und Asmawet
  rationale: שְׂדוֹת bezeichnet die Felder beziehungsweise das landwirtschaftlich genutzte Umland der genannten Orte. »bei« macht im Deutschen deutlich, dass die Felder beiden Ortsnamen zugeordnet sind.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier eine Begründung für die Herkunft der Sänger aus diesen Orten ein.
- source_word: חֲצֵרִים
  choice: Dörfer
  rationale: Das Wort kann umfriedete Wohnplätze oder kleinere Siedlungen bezeichnen; im geografischen Zusammenhang sind »Dörfer« eine klare und natürliche Wiedergabe.
- source_word: בָּנוּ לָהֶם
  choice: hatten sich … gebaut
  rationale: Die Konstruktion bedeutet wörtlich, dass sie für sich selbst bauten. Das Plusquamperfekt gibt den erklärenden Rückblick natürlich wieder.
- source_word: הַמְשֹׁרֲרִים
  choice: die Sänger
  rationale: Die Form bezeichnet singende Personen und ist im Zusammenhang des Tempeldienstes präziser als das allgemeinere »Musiker«.
- source_word: סְבִיבוֹת יְרוּשָׁלִָם
  choice: rings um Jerusalem
  rationale: Die Wendung bezeichnet das umliegende Gebiet und wird mit einer natürlichen räumlichen Formulierung wiedergegeben.
