source:
  edition: WLC
  text: וְ/רָאשֵׁ֣י הַ֠/לְוִיִּם חֲשַׁבְיָ֨ה שֵֽׁרֵבְיָ֜ה וְ/יֵשׁ֤וּעַ בֶּן קַדְמִיאֵל֙ וַ/אֲחֵי/הֶ֣ם לְ/נֶגְדָּ֔/ם לְ/הַלֵּ֣ל לְ/הוֹד֔וֹת בְּ/מִצְוַ֖ת דָּוִ֣יד אִישׁ הָ/אֱלֹהִ֑ים מִשְׁמָ֖ר לְ/עֻמַּ֥ת מִשְׁמָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/024.yaml
  text: And the heads of the Levites were Hashabiah[a], Sherebiah, and Jeshua son of Kadmiel, with their brothers opposite them, to praise and to give thanks according to the command of David the man of God[b], watch corresponding to watch.
translation:
  language: de
  text: 'Die Oberhäupter der Leviten waren Haschabja, Scherebja und Jeschua, der Sohn Kadmiëls. Ihre Brüder standen ihnen gegenüber, um zu loben und zu danken, nach dem Gebot Davids, des Mannes Gottes: Dienstgruppe gegenüber Dienstgruppe.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Wache gegenüber Wache“. Gemeint sind wahrscheinlich einander zugeordnete oder gegenüberstehende Gruppen im levitischen Gottesdienst.'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: רָאשֵׁי הַלְוִיִּם
  choice: die Oberhäupter der Leviten
  rationale: רָאשֵׁי bezeichnet leitende Personen. „Oberhäupter“ bewahrt das hebräische Bild und klingt im biblisch-historischen Zusammenhang würdig und verständlich.
- source_word: חֲשַׁבְיָה שֵׁרֵבְיָה וְיֵשׁוּעַ בֶּן קַדְמִיאֵל
  choice: Haschabja, Scherebja und Jeschua, der Sohn Kadmiëls
  rationale: Die Eigennamen werden in geläufiger deutscher Bibeltransliteration wiedergegeben; בֶּן wird ausdrücklich als Abstammungsangabe übersetzt.
- source_word: וַאֲחֵיהֶם לְנֶגְדָּם
  choice: Ihre Brüder standen ihnen gegenüber
  rationale: Das finite Verb „standen“ ist im Hebräischen nicht ausdrücklich vorhanden, wird jedoch aus der räumlichen Wendung idiomatisch ergänzt. „Gegenüber“ erhält sowohl die räumliche als auch die korrespondierende Beziehung der Gruppen.
- source_word: לְהַלֵּל לְהוֹדוֹת
  choice: um zu loben und zu danken
  rationale: Die beiden Infinitive werden als zwei unterschiedliche liturgische Handlungen beibehalten.
- source_word: בְּמִצְוַת דָּוִיד אִישׁ הָאֱלֹהִים
  choice: nach dem Gebot Davids, des Mannes Gottes
  rationale: בְּ bezeichnet hier die Übereinstimmung mit einer autoritativen Anordnung. Der traditionelle Titel „Mann Gottes“ bleibt unverändert erhalten.
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: Dienstgruppe gegenüber Dienstgruppe
  rationale: מִשְׁמָר kann eine Wache, einen Dienst oder eine eingeteilte Dienstgruppe bezeichnen. Im levitisch-liturgischen Zusammenhang ist „Dienstgruppe“ verständlicher als „Wache“, während Wiederholung und Gegenüberstellung des Hebräischen bewahrt bleiben.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnung אֲחֵיהֶם
  choice: ihre Brüder
  alternative: ihre Mit-Leviten
  rationale: Das maskuline hebräische Verwandtschaftswort wird direkt wiedergegeben und nicht durch eine geschlechtsneutrale Funktionsbezeichnung ersetzt.
- issue: Elliptische kultische Wendung מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: Dienstgruppe gegenüber Dienstgruppe
  alternative: Wache gegenüber Wache
  rationale: Die Formulierung lässt die genaue Organisation des Dienstes offen. Sie wird deshalb nicht ausdrücklich als Wechselgesang oder als abwechselnder Dienst erklärt; die korrespondierende Anordnung bleibt erhalten.
- issue: Titel אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  alternative: Gottesmann
  rationale: „Mann Gottes“ gibt den traditionellen Titel transparent wieder, ohne seine Bedeutung konfessionell oder interpretierend auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit. Die ungewöhnliche Schlussformel bleibt im Haupttext knapp und strukturell parallel; die Fußnote erläutert ihre lexikalische und kultische Offenheit.
