  text: וּ/בַקְבֻּֽקְיָ֨ה ו/ענו אֲחֵי/הֶ֛ם לְ/נֶגְדָּ֖/ם לְ/מִשְׁמָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/009.yaml
  text: And Bakbukiah and Unno[a], their brothers, stood opposite them in the divisions of service.
translation:
  language: de
  text: Und Bakbukja und Unno[a], ihre Brüder, standen ihnen gegenüber in den Dienstabteilungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise auch: „und ihre Brüder antworteten ihnen abteilungsweise“, wenn וענו als Verb statt als Personenname gelesen wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַקְבֻּקְיָה
  choice: Und Bakbukja
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren Form wiedergegeben; die vorangestellte Konjunktion wird mit „Und“ übersetzt.
- source_word: ו/ענו
  choice: und Unno
  rationale: Die mehrdeutige Konsonantenfolge wird entsprechend der Namensliste im unmittelbaren Zusammenhang als Personenname verstanden. Eine verbale Deutung bleibt in der Fußnote erhalten.
- source_word: אֲחֵיהֶם
  choice: ihre Brüder
  rationale: Die direkte Wiedergabe bewahrt den hebräischen Verwandtschafts- beziehungsweise Gruppenausdruck und lässt offen, ob leibliche Verwandte oder Angehörige derselben levitischen Gemeinschaft gemeint sind.
- source_word: לְנֶגְדָּם
  choice: standen ihnen gegenüber
  rationale: „Gegenüber“ gibt die räumliche oder organisatorische Zuordnung wieder; „standen“ wird für einen natürlichen deutschen Satz aus dem Kontext ergänzt.
- source_word: לְמִשְׁמָרוֹת
  choice: in den Dienstabteilungen
  rationale: Der Ausdruck bezeichnet hier wahrscheinlich geordnete Gruppen oder Einteilungen des Tempeldienstes. „Dienstabteilungen“ ist verständlich und wahrt den kultischen Organisationsbezug.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Listenform des Hebräischen bleibt erhalten; die syntaktisch nötige Verbform „standen“ ist zurückhaltend ergänzt. Die echte textliche beziehungsweise morphologische Mehrdeutigkeit bei וענו wird nicht im Haupttext aufgelöst, sondern durch eine Fußnote sichtbar gemacht.
