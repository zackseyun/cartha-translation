source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֥י הַ/כֹּהֲנִ֖ים בַּ/חֲצֹצְר֑וֹת זְכַרְיָ֨ה בֶן יֽוֹנָתָ֜ן בֶּן שְׁמַֽעְיָ֗ה בֶּן מַתַּנְיָה֙ בֶּן מִ֣יכָיָ֔ה בֶּן זַכּ֖וּר בֶּן אָסָֽף־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/035.yaml
  text: 'and from the sons of the priests[a], with trumpets: Zechariah son of Jonathan, son of Shemaiah, son of Mattaniah, son of Micaiah, son of Zaccur, son of Asaph.'
translation:
  language: de
  text: 'und von den Söhnen der Priester[a], mit Trompeten: Sacharja, der Sohn Jonatans, des Sohnes Schemajas, des Sohnes Mattanjas, des Sohnes Michajas, des Sohnes Sakkurs, des Sohnes Asafs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische ist partitiv; sinngemäß auch: „und einige von den Söhnen der Priester“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: und von den Söhnen
  rationale: Die Verbindung aus ו, מן und dem Konstrukt von בנים ist partitiv. Die formnahe Wiedergabe bewahrt den Anschluss an den vorausgehenden Satz und lässt offen, wie viele Priestersöhne gemeint sind.
- source_word: הַכֹּהֲנִים
  choice: der Priester
  rationale: Übliche und kontextgerechte Wiedergabe der kultischen Amtsbezeichnung.
- source_word: בַּחֲצֹצְרוֹת
  choice: mit Trompeten
  rationale: Die Präposition ב ist hier instrumental zu verstehen; die Priester wirken mit Trompeten an der Prozession mit.
- source_word: זְכַרְיָה
  choice: Sacharja
  rationale: Im Deutschen geläufige biblische Namensform.
- source_word: בֶן
  choice: Sohn / des Sohnes
  rationale: Die wiederholte genealogische Verknüpfung wird durchgehend sichtbar gehalten; die Genitivkette entspricht natürlichem gehobenem Deutsch.
- source_word: יֽוֹנָתָן
  choice: Jonatan
  rationale: Im modernen Standarddeutsch gebräuchliche biblische Namensform.
- source_word: שְׁמַעְיָה
  choice: Schemaja
  rationale: Etablierte deutsche Umschrift des hebräischen Personennamens.
- source_word: מַתַּנְיָה
  choice: Mattanja
  rationale: Etablierte deutsche Umschrift des hebräischen Personennamens.
- source_word: מִיכָיָה
  choice: Michaja
  rationale: Etablierte deutsche Umschrift; die längere Namensform bleibt gegenüber Micha unterscheidbar.
- source_word: זַכּוּר
  choice: Sakkur
  rationale: Gängige deutsche Umschrift des Personennamens.
- source_word: אָסָף
  choice: Asaf
  rationale: Im Deutschen geläufige biblische Namensform; der Text wird nicht um Aussagen über eine Sängergilde oder Autorschaft ergänzt.
theological_decisions:
- issue: Genealogische Beziehung zu Asaf
  choice: Die Abstammungsfolge wird mit der wiederholten Bezeichnung „Sohn“ unmittelbar wiedergegeben.
  alternative: „Sohn Asafs“ im weiteren Sinn als Angehöriger beziehungsweise Nachkomme der asafitischen Linie deuten.
  rationale: Der hebräische Text bietet eine fortlaufende Genealogie. Ob „Sohn“ bei Asaf eine weiter gefasste Abstammung bezeichnet, wird nicht ausdrücklich entschieden und daher nicht interpretierend aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als syntaktischer Anschluss an den vorausgehenden Kontext mit „und“ erhalten. Die Namensformen folgen verbreiteten deutschen Bibelkonventionen; die formnahe Genealogie bewahrt die Struktur des Hebräischen.
