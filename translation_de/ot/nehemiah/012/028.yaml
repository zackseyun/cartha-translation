source:
  edition: WLC
  text: וַ/יֵּאָ֣סְפ֔וּ בְּנֵ֖י הַ/מְשֹׁרְרִ֑ים וּ/מִן הַ/כִּכָּר֙ סְבִיב֣וֹת יְרוּשָׁלִַ֔ם וּ/מִן חַצְרֵ֖י נְטֹפָתִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/028.yaml
  text: And the sons of the singers were gathered from the district around Jerusalem and from the settlements of the Netophathites[a][b].
translation:
  language: de
  text: Und die Söhne der Sänger versammelten sich aus dem Umland Jerusalems[a] und aus den Dörfern der Netofatiter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Ebene rings um Jerusalem«. Das hebräische Wort kann je nach Zusammenhang eine Ebene, einen Umkreis oder ein Gebiet bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »den Siedlungen der Netofatiter«. Das hebräische Wort bezeichnet häufig kleinere oder unbefestigte Ortschaften.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: versammelten sich
  rationale: Der Niphal kann passiv oder reflexiv verstanden werden. Das natürliche deutsche „versammelten sich“ bewahrt die mögliche Eigenbeteiligung, ohne eine Einberufung vorauszusetzen.
- source_word: בְּנֵי הַמְשֹׁרְרִים
  choice: die Söhne der Sänger
  rationale: Die formale Wiedergabe erhält die hebräische Zugehörigkeitsbezeichnung. Im Zusammenhang kann sie die Angehörigen der Sängergruppe oder -familien meinen.
- source_word: הַכִּכָּר סְבִיבוֹת יְרוּשָׁלִַם
  choice: das Umland Jerusalems
  rationale: כִּכָּר kann eine Ebene, einen Umkreis oder ein Gebiet bezeichnen. Mit סְבִיבוֹת gibt „Umland“ die umliegende Region knapp und natürlich wieder.
- source_word: חַצְרֵי
  choice: die Dörfer
  rationale: In geografischen Aufzählungen bezeichnet חָצֵר häufig kleinere, teils unbefestigte Ortschaften; „Dörfer“ ist im Deutschen klar und idiomatisch.
- source_word: נְטֹפָתִי
  choice: der Netofatiter
  rationale: Die gentilizische Form bezeichnet die mit Netofa verbundenen Bewohner; der deutsche Völker- beziehungsweise Herkunftsname bewahrt diese Nuance.
theological_decisions: []
