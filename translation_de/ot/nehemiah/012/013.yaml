  choice: Meschullam
  rationale: Der hebräische Personenname wird in geläufiger deutscher Umschrift wiedergegeben.
- source_word: לַ/אֲמַרְיָה
  choice: für Amarja
  rationale: Wie im ersten Satzglied kennzeichnet לַ die Zuordnung zum priesterlichen Haus Amarjas und nennt anschließend dessen Vertreter.
- source_word: יְהוֹחָנָן
  choice: Jehohanan
  rationale: Die Umschrift bewahrt die volle hebräische Namensform יְהוֹחָנָן; die kürzere Form „Johanan“ ist ebenfalls gebräuchlich.
