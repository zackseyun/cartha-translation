translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Führende Männer« vermeidet den heute missverständlichen Ausdruck »Fürsten«; »Misttor« entspricht dem traditionellen und transparenten deutschen Tornamen. Die Satzteilung erhöht die Verständlichkeit des langen hebräischen Satzes.
