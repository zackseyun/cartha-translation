    rationale: Das hebräische לַיָּמִין bezeichnet nur die Richtung »nach rechts«. »Oben« ist weder lexikalisch noch syntaktisch im Ausgangstext ausgedrückt und sollte entfernt werden.
  - severity: low
    issue: Fußnote a ergänzt das Singen von Dankliedern
    rationale: Die Deutung von תּוֹדוֹת als handelnde Dankgruppen ist kontextuell plausibel, aber der Vers erwähnt kein Singen. Die Anmerkung soll daher allgemeiner von Gruppen sprechen, die in einer Prozession Dank darbrachten.
