  text: וָ/אַעֲלֶה֙ אֶת שָׂרֵ֣י יְהוּדָ֔ה מֵ/עַ֖ל לַ/חוֹמָ֑ה וָ/אַעֲמִ֡ידָ/ה שְׁתֵּ֣י תוֹדֹת֩ גְּדוֹלֹ֨ת וְ/תַהֲלֻכֹ֤ת לַ/יָּמִין֙ מֵ/עַ֣ל לַ/חוֹמָ֔ה לְ/שַׁ֖עַר הָ/אַשְׁפֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/031.yaml
  text: Then I brought the leaders of Judah up onto the wall[a], and I appointed two great thanksgiving choirs and processions[b], one going to the right on the wall toward the Dung Gate.
translation:
  language: de
  text: Dann ließ ich die führenden Männer von Juda auf die Mauer hinaufsteigen und stellte zwei große Dankchöre mit ihren Prozessionen[a] auf. Eine davon zog auf der Mauer nach rechts zum Misttor hin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zwei große Danksagungen und Umzüge«. Gemeint sind wahrscheinlich zwei große Gruppen, die in einer Prozession Dank darbrachten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »bis zum Misttor«. Die Präposition kann hier sowohl die Richtung als auch das Ziel bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאַעֲלֶה
  choice: ließ ich … hinaufsteigen
  rationale: 'Der Hifil von עלה hat kausative Bedeutung: Nehemia veranlasst, dass die führenden Männer hinaufsteigen. Die deutsche Formulierung bewahrt diese Aussage natürlicher als eine wörtliche Wiedergabe.'
- source_word: שָׂרֵי יְהוּדָה
  choice: die führenden Männer Judas
  rationale: שָׂרִים bezeichnet hier die maßgeblichen Leiter beziehungsweise Amtsträger Judas, nicht notwendig königliche Prinzen. Die gewählte Formulierung ist modern und kontextgerecht.
- source_word: מֵעַל לַחוֹמָה
  choice: auf die Mauer
  rationale: Die Verbindung bezeichnet die Bewegung hinauf auf die begehbare Oberseite der Mauer.
- source_word: וָאַעֲמִידָה
  choice: stellte … auf
  rationale: Der Hifil von עמד bedeutet »hinstellen, aufstellen«. Im zeremoniellen Zusammenhang geht es um die geordnete Aufstellung der Gruppen.
- source_word: שְׁתֵּי תוֹדֹת גְּדוֹלֹת
  choice: zwei große Dankchöre
  rationale: Wörtlich steht »zwei große Danksagungen«. Im Kontext sind damit metonymisch organisierte Gruppen gemeint, die beim Umzug Danklieder vortragen; »Dankchöre« macht dies verständlich, ohne den Dankcharakter zu verlieren.
- source_word: וְתַהֲלֻכֹת
  choice: mit ihren Prozessionen
  rationale: Das von הלך abgeleitete Substantiv bezeichnet das Gehen beziehungsweise einen Umzug. Syntaktisch ist die genaue Beziehung zu den »Danksagungen« knapp und mehrdeutig; die Formulierung versteht die Chöre als Prozessionsgruppen und vermeidet die missverständliche Vorstellung von vier getrennten Gruppen.
- source_word: לַיָּמִין
  choice: nach rechts
  rationale: Die Übersetzung bewahrt die konkrete Richtungsangabe des hebräischen Textes, statt sie interpretierend durch »nach Süden« zu ersetzen.
- source_word: לְשַׁעַר הָאַשְׁפֹּת
  choice: zum Misttor hin
  rationale: אַשְׁפֹּת bezeichnet Mist beziehungsweise Abfall und ist Bestandteil des Tornamens. »Zum … hin« gibt die im Zusammenhang mögliche Ziel- oder Richtungsbedeutung der Präposition wieder.
