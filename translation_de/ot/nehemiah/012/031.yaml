revisions:
- from: Dann ließ ich die führenden Männer Judas auf die Mauer hinaufsteigen und stellte zwei große Dankchöre mit ihren Prozessionen[a] auf. Der eine zog nach rechts oben auf der Mauer zum Misttor hin.[b]
  to: Dann ließ ich die führenden Männer von Juda auf die Mauer hinaufsteigen und stellte zwei große Dankchöre mit ihren Prozessionen[a] auf. Eine davon zog auf der Mauer nach rechts zum Misttor hin.[b]
  rationale: Die Revision entfernt die nicht belegte Ergänzung »oben«, glättet die geographische Bezeichnung zu »von Juda« und formuliert die Erläuterung zu den Dankgruppen ohne die im Vers nicht ausdrücklich genannte musikalische Handlung. Die syntaktisch knappe und kontextuell nicht völlig eindeutige Verbindung von »Danksagungen« und »Umzügen« bleibt in Text und Fußnote als Deutung erkennbar.
