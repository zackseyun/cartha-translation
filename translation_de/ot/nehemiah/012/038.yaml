base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/038.yaml
  text: And the second thanksgiving choir was going to the left[a], and I followed behind it, with half of the people on the wall, from above the Tower of the Ovens as far as the Broad Wall.
translation:
  language: de
  text: Der zweite Dankchor zog nach links[a], und ich folgte ihm; die Hälfte des Volkes war hinter ihm auf der Mauer, vom Ofenturm bis zur Breiten Mauer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die zweite Dankgemeinschaft“ beziehungsweise „die zweite Dankprozession“. Das hebräische Wort kann eine Dankgemeinschaft in einer feierlichen Prozession bezeichnen, nicht nur einen Chor im engeren Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתּוֹדָה
  choice: Dankchor
  rationale: Im Zusammenhang der beiden geordneten Gruppen bei der Mauerweihe bezeichnet das Wort eine Dankgemeinschaft beziehungsweise einen Chor in einer Prozession, nicht nur den abstrakten Dank.
- source_word: הַשֵּׁנִית
  choice: der zweite
  rationale: Das Ordinalzahlwort bestimmt den Dankchor.
- source_word: הַהוֹלֶכֶת
  choice: zog
  rationale: Das Partizip schildert die fortschreitende Bewegung; „zog“ ist im Deutschen für eine Prozession natürlich.
- source_word: לְמוֹאל
  choice: nach links
  rationale: Die Wendung bezeichnet die linke Richtung; dies passt zu den beiden in entgegengesetzte Richtungen ziehenden Gruppen.
- source_word: אַחֲרֶיהָ
  choice: hinter ihm
  rationale: Gemeint ist die räumliche Folge innerhalb der Prozession; das Pronomen bezieht sich im Deutschen auf den maskulinen „Dankchor“.
- source_word: חֲצִי הָעָם
  choice: die Hälfte des Volkes
  rationale: Die Konstruktverbindung bezeichnet eine Hälfte des versammelten Volkes.
- source_word: מֵעַל לְהַחוֹמָה
  choice: oben auf der Mauer
  rationale: Die Prozession bewegt sich auf der Mauerkrone; die Formulierung gibt sowohl die erhöhte Lage als auch die Bewegung auf der Mauer natürlich wieder.
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: Ofenturm
  rationale: Der Name besteht aus „Turm“ und „Öfen“; die deutsche Zusammensetzung bewahrt den Charakter eines Ortsnamens knapp und verständlich.
- source_word: הַחוֹמָה הָרְחָבָה
  choice: Breite Mauer
  rationale: Wahrscheinlich handelt es sich um einen bekannten Abschnitt der Jerusalemer Stadtmauer; die Großschreibung kennzeichnet die Ortsbezeichnung.
theological_decisions: []
