  source_fidelity: 'Die Satzglieder werden überwiegend zutreffend wiedergegeben: der zweite Dankchor, die linke Richtung, Nehemias Folgen, die Hälfte des Volkes auf der Mauer sowie die Strecke vom Ofenturm bis zur Breiten Mauer. Die hebräische Präpositionalkette vor „der Mauer“ ist jedoch besser als nähere Bestimmung zu „der Hälfte des Volkes“ zu fassen, nicht als lose, mit „ich folgte“ koordinierte Begleitung.'
