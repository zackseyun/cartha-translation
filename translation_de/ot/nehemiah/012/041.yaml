  text: וְ/הַ/כֹּהֲנִ֡ים אֶלְיָקִ֡ים מַעֲשֵׂיָ֡ה מִ֠נְיָמִין מִיכָיָ֧ה אֶלְיוֹעֵינַ֛י זְכַרְיָ֥ה חֲנַנְיָ֖ה בַּ/חֲצֹצְרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/041.yaml
  text: 'and the priests: Eliakim[a], Maaseiah, Miniamin, Micaiah, Elioenai, Zechariah, and Hananiah, with trumpets.'
translation:
  language: de
  text: und die Priester Eljakim, Maaseja, Minjamin, Michaja, Eljoënai, Secharja und Hananja mit den Trompeten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei den Trompeten«. Das Hebräische kann einfach anzeigen, dass diese Priester mit den Trompeten verbunden oder ihnen zugeteilt waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/כֹּהֲנִים
  choice: und die Priester
  rationale: Das וְ verbindet die Aufzählung mit dem vorhergehenden Satz; הַכֹּהֲנִים bezeichnet gewöhnlich »die Priester«.
- source_word: אֶלְיָקִים מַעֲשֵׂיָה מִנְיָמִין מִיכָיָה אֶלְיוֹעֵינַי זְכַרְיָה חֲנַנְיָה
  choice: Eljakim, Maaseja, Minjamin, Michaja, Eljoënai, Secharja und Hananja
  rationale: Die Personennamen werden in gut etablierten deutschen Bibelformen wiedergegeben, wobei die hebräischen Formen erkennbar bleiben.
- source_word: בַּ/חֲצֹצְרֽוֹת
  choice: mit den Trompeten
  rationale: Die Präposition ב kann hier Begleitung, Zuordnung oder Instrumentalität ausdrücken. »Mit den Trompeten« ist im Prozessionszusammenhang natürlich, ohne genauer festzulegen, ob die Priester sie trugen oder spielten.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache; die knappe Fortsetzung der Namensliste bleibt erhalten. Der bestimmte Artikel bei »den Trompeten« entspricht der hebräischen Form, während die Fußnote die funktionale Mehrdeutigkeit der Präposition wahrt.
