lexical_decisions:
- source_word: יֵשׁוּעַ
  choice: Jeschua
  rationale: Der Personenname wird in der im Deutschen für diese nachexilische Gestalt üblichen Form wiedergegeben; so bleibt er von Josua, dem Sohn Nuns, unterscheidbar.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in genealogischen Formeln wörtlich das Veranlassen einer Geburt und idiomatisch das Zeugen beziehungsweise Vaterwerden. „Zeugte“ ist knapp, gegenwärtig verständlich und bewahrt den männlichen genealogischen Sinn.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: Der hebräische Akkusativmarker besitzt hier keine selbstständige lexikalische Bedeutung und wird durch den deutschen Satzbau ausgedrückt.
- source_word: יוֹיָקִים
  choice: Jojakim
  rationale: Der Name wird entsprechend seiner hebräischen Form יוֹיָקִים transliteriert; „Jojakim“ ist im Deutschen eine etablierte Wiedergabe.
- source_word: אֶלְיָשִׁיב
  choice: Eljaschib
  rationale: Standardnahe deutsche Transliteration des hebräischen Personennamens.
- source_word: יוֹיָדָע
  choice: Jojada
  rationale: Der Name wird entsprechend der im hebräischen Text vorliegenden Form transliteriert; die Wiedergabe stimmt zugleich mit gängiger deutscher Bibelnamentradition überein.
