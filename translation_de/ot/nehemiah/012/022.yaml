revisions:
- from: Zur Zeit Eljaschibs, Jojadas, Johanans und Jadduas wurden die Leviten als Oberhäupter der Vaterhäuser[a] verzeichnet[b], ebenso die Priester, bis zur Regierungszeit des Persers Darius.[c]
  to: Zur Zeit Eljaschibs, Jojadas, Johanans und Jadduas wurden die Leviten als Oberhäupter der Vaterhäuser[a] verzeichnet[b], ebenso die Priester, während der Regierungszeit des Persers Darius.
  rationale: Die Zeitangabe wurde von „bis zur Regierungszeit“ zu „während der Regierungszeit“ berichtigt, damit kein im Hebräischen nicht ausgedrückter Endpunkt eingeführt wird. Die darauf beruhende Fußnote c wurde entfernt. Alle übrigen Formulierungen bewahren die Satzstruktur, die administrative Terminologie und die natürliche deutsche Ausdrucksweise.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:22:49Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe trifft die Personen, die administrative Eintragung und die elliptische Einbeziehung der Priester im Wesentlichen. „Bis zur Regierungszeit“ ist jedoch durch עַל מַלְכוּת nicht gedeckt; die Zeitangabe bezeichnet die Regierungszeit des persischen Darius, nicht ausdrücklich einen Endpunkt.
  naturalness: Der Satz ist in modernem Standarddeutsch klar und würdig. „Ebenso die Priester“ gibt die hebräische Ellipse knapp wieder; „Vaterhäuser“ ist als fachsprachlicher genealogischer Ausdruck mit Erklärung vertretbar.
  terminology: „Leviten“, die Namensformen Eljaschib, Jojada, Johanan und Jaddua sowie „der Perser Darius“ sind angemessen. „Oberhäupter der Vaterhäuser“ bewahrt den technischen Ausdruck רָאשֵׁי אָבוֹת. Die Fußnote zur Variante Johanan/Jonathan ist im deutschen Text nicht erforderlich, da keine abweichende Lesart behauptet wird.
  issues:
