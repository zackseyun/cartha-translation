base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/022.yaml
  text: In the days of Eliashib[a], Joiada, Johanan, and Jaddua, the Levites were recorded as heads of fathers’ houses, and the priests also[c][b], during the reign of Darius the Persian.
translation:
  language: de
  text: Zur Zeit Eljaschibs, Jojadas, Johanans und Jadduas wurden die Leviten als Oberhäupter der Vaterhäuser[a] verzeichnet[b], ebenso die Priester, während der Regierungszeit des Persers Darius.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vaterhäuser“ bezeichnet hier Sippen beziehungsweise Abstammungsverbände.
    reason: cultural_note
  - marker: b
    text: 'Oder: „wurden schriftlich festgehalten“ beziehungsweise „wurden registriert“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die etablierte und natürliche deutsche Bezeichnung für die Angehörigen des levitischen Stammes beziehungsweise Dienststandes.
- source_word: בִּימֵי
  choice: Zur Zeit
  rationale: Gibt die hebräische Zeitformel idiomatisch und würdig wieder, ohne unnötig altertümlich zu klingen.
- source_word: אֶלְיָשִׁיב יוֹיָדָע וְיוֹחָנָן וְיַדּוּעַ
  choice: Eljaschib, Jojada, Johanan und Jaddua
  rationale: Die Namen werden in geläufiger deutscher Bibelnamensform wiedergegeben; der masoretische Text hat Johanan, nicht Jonathan.
- source_word: כְּתוּבִים
  choice: wurden … verzeichnet
  rationale: Das passive Partizip von כתב bezeichnet hier die schriftliche Aufnahme in ein genealogisches oder amtliches Verzeichnis.
- source_word: רָאשֵׁי אָבוֹת
  choice: Oberhäupter der Vaterhäuser
  rationale: Bewahrt den genealogisch-administrativen Fachausdruck; eine Fußnote erklärt das heute weniger geläufige 'Vaterhäuser'.
- source_word: וְהַכֹּהֲנִים
  choice: ebenso die Priester
  rationale: Ergänzt das im Hebräischen elliptisch ausgesparte Prädikat knapp und natürlich.
- source_word: עַל מַלְכוּת
  choice: bis zur Regierungszeit
  rationale: Die Präposition עַל kann in diesem chronologischen Zusammenhang eine zeitliche Erstreckung bis in die Regierungszeit bezeichnen; diese Deutung berücksichtigt, dass die zuvor genannten Amtsträger mehrere Generationen umfassen.
- source_word: דָּרְיָוֶשׁ הַפָּרְסִי
  choice: des Persers Darius
  rationale: Gibt die appositionelle ethnische Bezeichnung natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der genealogisch-administrative Ausdruck „Vaterhäuser“ bleibt erhalten und wird erläutert. Die zeitliche Mehrdeutigkeit von עַל מַלְכוּת wird nicht verschwiegen; im Haupttext steht die kontextuell plausible Bedeutung „bis zur Regierungszeit“, die Alternative folgt in der Fußnote.
