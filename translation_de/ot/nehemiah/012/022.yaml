    issue: „bis zur Regierungszeit“
    rationale: Das Hebräische עַל מַלְכוּת דָּרְיָוֶשׁ הַפָּרְסִי bedeutet hier „während/in der Regierungszeit des persischen Darius“ (bzw. wörtlicher „unter der Königsherrschaft“). „Bis“ fügt eine nicht ausgedrückte zeitliche Begrenzung hinzu.
  - severity: low
    issue: Fußnote c stützt eine unnötige und irreführende Mehrdeutigkeit
    rationale: Die Fußnote erklärt die gewählte, nicht quellengestützte Bedeutung „bis“ als mögliche Deutung. Nach der Korrektur kann sie entfallen; die reguläre Wiedergabe „während der Regierungszeit“ ist ausreichend.
