base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/036.yaml
  text: and his brothers—Shemaiah[a], Azarel, Milalai, Gilalai, Maai, Nethanel, Judah, and Hanani—with the musical instruments of David the man of God, and Ezra the scribe before them.
translation:
  language: de
  text: 'und seine Brüder: Schemaja, Asarel, Milalai, Gilalai, Maai, Netanel, Juda und Hanani, mit den Musikinstrumenten[a] Davids, des Mannes Gottes; und Esra, der Schriftgelehrte, ging ihnen voran.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mit den Geräten des Gesangs«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: Die Grundbedeutung von אֶחָיו ist »seine Brüder«. Im Zusammenhang kann die Bezeichnung auch nahe Angehörige oder Gefährten aus derselben levitischen Gruppe einschließen; diese mögliche Erweiterung wird jedoch nicht in den Haupttext eingetragen.
- source_word: שְׁמַעְיָה ... חֲנָנִי
  choice: Schemaja, Asarel, Milalai, Gilalai, Maai, Netanel, Juda und Hanani
  rationale: Die Personennamen werden in gebräuchlicher deutscher Bibelschreibung wiedergegeben.
- source_word: בִּכְלֵי שִׁיר
  choice: mit den Musikinstrumenten
  rationale: כְּלֵי bezeichnet Geräte beziehungsweise Instrumente, שִׁיר Gesang oder Musik. »Musikinstrumente« ist eine natürliche und sachlich genaue deutsche Wiedergabe; die formnähere Lesart steht in der Fußnote.
- source_word: דָּוִיד אִישׁ הָאֱלֹהִים
  choice: Davids, des Mannes Gottes
  rationale: Die Instrumente werden David zugeordnet; »des Mannes Gottes« gibt die nachgestellte Ehrenbezeichnung appositionell wieder.
- source_word: וְעֶזְרָא הַסּוֹפֵר לִפְנֵיהֶם
  choice: Esra, der Schriftgelehrte, ging vor ihnen
  rationale: Der hebräische Nominalsatz nennt Esra den Schriftgelehrten als vor der Gruppe befindlich. Das im Deutschen ergänzte »ging« macht die räumliche Angabe im Prozessionszusammenhang natürlich verständlich, ohne eine zusätzliche inhaltliche Aussage einzuführen.
theological_decisions:
- issue: Wiedergabe der Ehrenbezeichnung אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  alternative: der Gottesmann
  rationale: »Mann Gottes« bewahrt die Form und die biblischen Querverbindungen der traditionellen Ehrenbezeichnung, ohne sie dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Konjunktion bleibt erhalten, weil der Vers syntaktisch an den vorausgehenden Zusammenhang anschließt. Im letzten Satz wird das im Hebräischen nicht ausdrücklich gesetzte Verb »ging« aus dem Prozessionskontext ergänzt.
