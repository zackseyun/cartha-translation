base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/026.yaml
  text: These were in the days of Joiakim son of Jeshua[a], son of Jozadak, and in the days of Nehemiah the governor and Ezra the priest, the scribe.
translation:
  language: de
  text: Diese waren zur Zeit Jojakims, des Sohnes Jeschuas, des Sohnes Jozadaks, und zur Zeit Nehemias, des Statthalters, und Esras, des Priesters, des Schriftgelehrten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Esras, des Priesters und Schriftgelehrten.« Das Hebräische nennt für Esra die beiden Titel »der Priester« und »der Schreiber« nebeneinander.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Diese lebten
  rationale: Das pluralische Demonstrativpronomen verweist auf die zuvor genannten Personen. Das im Hebräischen fehlende Verb wird für einen natürlichen deutschen Satz sinngemäß ergänzt.
- source_word: בִּימֵי
  choice: zur Zeit
  rationale: Gibt die hebräische Zeitangabe idiomatisch und präzise wieder.
- source_word: יוֹיָקִים
  choice: Jojakim
  rationale: Übliche deutsche Wiedergabe des Namens dieser nachexilischen priesterlichen Person.
- source_word: בֶּן יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: des Sohnes Jeschuas, des Sohnes Jozadaks
  rationale: Bewahrt die ausdrückliche genealogische Folge mit בֶּן als »Sohn«.
- source_word: וּבִימֵי
  choice: und zur Zeit
  rationale: Die wiederholte Zeitangabe des Hebräischen bleibt erhalten.
- source_word: נְחֶמְיָה הַפֶּחָה
  choice: Nehemias, des Statthalters
  rationale: פֶּחָה bezeichnet hier den Provinzstatthalter innerhalb der persischen Verwaltung.
- source_word: וְעֶזְרָא הַכֹּהֵן הַסּוֹפֵר
  choice: und Esras, des Priesters und Schriftgelehrten
  rationale: Die beiden mit Artikel versehenen Bezeichnungen werden als zwei auf Esra bezogene Titel wiedergegeben; »Schriftgelehrter« ist im biblisch-administrativen Kontext die natürliche deutsche Entsprechung für סֹפֵר.
