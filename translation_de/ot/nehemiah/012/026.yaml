  - severity: low
    issue: Die deutsche Hauptfassung verbindet Esras Titel lediglich koordinierend.
    rationale: Die beiden bestimmten hebräischen Titel stehen appositional nebeneinander. Kommas machen ihre gemeinsame Zuordnung zu Esra transparenter, ohne über ihr genaueres Verhältnis zu entscheiden.
