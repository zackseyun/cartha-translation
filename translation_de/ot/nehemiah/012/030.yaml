id: NEH.12.30
reference: Nehemiah 12:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּֽטַּהֲר֔וּ הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם וַֽ/יְטַהֲרוּ֙ אֶת הָ/עָ֔ם וְ/אֶת הַ/שְּׁעָרִ֖ים וְ/אֶֽת הַ/חוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/030.yaml
  text: And the priests and the Levites purified themselves[a], and they purified the people, the gates, and the wall.
translation:
  language: de
  text: Und die Priester und die Leviten reinigten sich[a]; dann reinigten sie das Volk, die Tore und die Mauer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bezeichnet hier eine rituelle Reinigung. Dieselbe Wortwurzel steht anschließend transitiv für die Reinigung des Volkes, der Tore und der Mauer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּהֲרוּ
  choice: reinigten sich
  rationale: Das Hitpael ist reflexiv. „Sich reinigen“ ist im Deutschen natürlich und kann in diesem kultischen Zusammenhang rituelle Reinigung bezeichnen.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die übliche und sachlich genaue Wiedergabe im kultischen Zusammenhang.
- source_word: וְהַלְוִיִּם
  choice: und die Leviten
  rationale: Die herkömmliche Bezeichnung für die Angehörigen beziehungsweise Amtsträger des Stammes Levi.
- source_word: וַיְטַהֲרוּ
  choice: reinigten sie
  rationale: Das Piel ist transitiv. Die Wiederholung von „reinigen“ bewahrt die im Hebräischen verwendete gleiche Wortwurzel und den Wechsel von reflexiver zu transitiver Handlung.
- source_word: הָעָם
  choice: das Volk
  rationale: Dies ist hier die naheliegende allgemeine Bedeutung; „Versammlung“ wäre enger und kontextuell weniger wahrscheinlich.
- source_word: הַשְּׁעָרִים
  choice: die Tore
  rationale: Direkte und idiomatische Wiedergabe im Zusammenhang der Stadtmauer.
- source_word: הַחוֹמָה
  choice: die Mauer
  rationale: Der Kontext macht deutlich, dass die Stadtmauer Jerusalems gemeint ist; die knappe Wiedergabe folgt dem Hebräischen.
theological_decisions:
- issue: Art der Reinigung
  choice: rituelle Reinigung
  alternative: allgemeine zeremonielle oder physische Säuberung
  rationale: טהר bezeichnet im Zusammenhang der Tempel- und Mauereinweihung eine kultisch-rituelle Reinigung. „Reinigen“ bewahrt diesen Sinn, ohne die nicht näher beschriebene Durchführung zu konkretisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Semikolon mit „dann“ macht die Abfolge verständlich, ohne die knappe Satzstruktur stark zu erweitern. Die Wiederholung von „reinigen“ bildet die hebräische Wurzelwiederholung nach.
