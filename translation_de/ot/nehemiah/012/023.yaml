id: NEH.12.23
reference: Nehemiah 12:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּנֵ֤י לֵוִי֙ רָאשֵׁ֣י הָֽ/אָב֔וֹת כְּתוּבִ֕ים עַל סֵ֖פֶר דִּבְרֵ֣י הַ/יָּמִ֑ים וְ/עַד יְמֵ֖י יֽוֹחָנָ֥ן בֶּן אֶלְיָשִֽׁיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/023.yaml
  text: The sons of Levi[a], heads of fathers’ houses, were recorded in the book of the chronicles[b], up to the days of Yohanan son of Eliashib.
translation:
  language: de
  text: Die Nachkommen Levis, die Oberhäupter der Großfamilien, waren im Buch der Chroniken[a] verzeichnet, bis in die Zeit Jochanans, des Sohnes Eljaschibs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem »Buch der Chroniken« ist hier eine amtliche historische Aufzeichnung beziehungsweise ein Annalenwerk gemeint, nicht notwendigerweise die biblischen Bücher der Chronik.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי לֵוִי
  choice: die Nachkommen Levis
  rationale: Die Wendung bedeutet wörtlich »Söhne Levis«, bezeichnet hier aber die Angehörigen des Stammes Levi. »Nachkommen Levis« bewahrt das Abstammungsmotiv und klingt im heutigen Deutsch natürlicher.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: die Oberhäupter der Großfamilien
  rationale: Die idiomatische Wendung bezeichnet die führenden Männer der väterlichen Abstammungs- und Familienverbände. »Großfamilien« vermittelt diesen sozialen Zusammenhang verständlicher als das wörtliche, im Deutschen missverständliche »Vaterhäuser«.
- source_word: כְּתוּבִים
  choice: waren … verzeichnet
  rationale: Das passive Partizip bezeichnet einen bestehenden schriftlichen Eintrag. »Verzeichnet« gibt den Register- oder Verwaltungscharakter präzise wieder.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: im Buch der Chroniken
  rationale: Obwohl עַל wörtlich »auf« bedeutet, verlangt der deutsche Sprachgebrauch bei Einträgen in einem Schriftstück »im«. דִּבְרֵי הַיָּמִים bezeichnet chronikalische Aufzeichnungen beziehungsweise Annalen.
- source_word: וְעַד יְמֵי
  choice: bis in die Zeit
  rationale: Die Wendung setzt die zeitliche Grenze der Aufzeichnung. »Bis in die Zeit« ist natürliches Deutsch und bewahrt die Aussage, ohne eine genauer bestimmte Schlussfrist hinzuzufügen.
- source_word: יוֹחָנָן
  choice: Jochanan
  rationale: »Jochanan« ist eine geläufige deutsche Wiedergabe des hebräischen Personennamens und bildet dessen Lautgestalt angemessen ab.
- source_word: בֶּן אֶלְיָשִׁיב
  choice: des Sohnes Eljaschibs
  rationale: Die Genitiv-Apposition gibt die hebräische Vatersangabe natürlich und eindeutig wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, während »Nachkommen Levis« und »Großfamilien« die institutionellen Abstammungsbegriffe für heutige Leser verständlich wiedergeben.
