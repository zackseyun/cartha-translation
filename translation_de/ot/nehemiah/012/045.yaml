  text: וַֽ/יִּשְׁמְר֞וּ מִשְׁמֶ֤רֶת אֱלֹֽהֵי/הֶם֙ וּ/מִשְׁמֶ֣רֶת הַֽ/טָּהֳרָ֔ה וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים כְּ/מִצְוַ֥ת דָּוִ֖יד שְׁלֹמֹ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/045.yaml
  text: And they kept the charge of their God and the charge of purification[a], and so did the singers and the gatekeepers[b], according to the command of David and Solomon his son.
translation:
  language: de
  text: Und sie versahen den Dienst ihres Gottes und den Dienst der Reinigung[a]; ebenso taten es die Sänger und Torwächter[b], nach dem Gebot Davids und seines Sohnes Salomo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Dienst der Reinheit“ beziehungsweise „die Aufgabe der Reinigung“.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen ist die Formulierung bei den Sängern und Torwächtern verkürzt; wahrscheinlich ist gemeint, dass auch sie die ihnen zugewiesenen Dienste versahen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְרוּ מִשְׁמֶרֶת
  choice: sie versahen den Dienst
  rationale: Die Verbindung aus שׁמר und מִשְׁמֶרֶת bezeichnet hier die gewissenhafte Wahrnehmung einer übertragenen Aufgabe. „Den Dienst versehen“ gibt diese idiomatische Bedeutung in natürlichem, würdigem Deutsch wieder.
- source_word: אֱלֹהֵיהֶם
  choice: ihren Gott
  rationale: Das hebräische Possessivsuffix ist ausdrücklich vorhanden und wird beibehalten.
- source_word: וּמִשְׁמֶרֶת הַטָּהֳרָה
  choice: und den Dienst der Reinigung
  rationale: טָהֳרָה bezeichnet im Tempelzusammenhang rituelle Reinheit beziehungsweise Reinigung. „Dienst der Reinigung“ bewahrt sowohl den kultischen Bezug als auch die Wiederholung von מִשְׁמֶרֶת.
- source_word: וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: ebenso die Sänger und die Torwächter
  rationale: Die hebräische Wendung ist elliptisch. „Ebenso“ macht knapp verständlich, dass auch diese Gruppen ihre zugewiesenen Aufgaben versahen, ohne die Ellipse unnötig auszuweiten.
- source_word: שֹׁעֲרִים
  choice: Torwächter
  rationale: „Torwächter“ ist im Tempelkontext die präzise und etablierte Bezeichnung für die an den Toren eingesetzten Amtsträger.
- source_word: כְּמִצְוַת
  choice: nach dem Gebot
  rationale: מִצְוָה bezeichnet hier eine verbindliche Anordnung. „Gebot“ ist prägnant, würdig und wahrt die Autorität der Weisung.
- source_word: דָּוִיד שְׁלֹמֹה בְנוֹ
  choice: Davids und seines Sohnes Salomo
  rationale: Die Formulierung gibt klar wieder, dass Salomo Davids Sohn ist, und behandelt die Anordnung entsprechend der hebräischen Namensfolge als mit beiden verbunden.
theological_decisions:
- issue: Bedeutung von הַטָּהֳרָה im Zusammenhang des Tempeldienstes
  choice: Reinigung
  alternative: Reinheit
  rationale: Der kultische Zusammenhang spricht für rituelle Reinigung beziehungsweise die dafür vorgeschriebenen Aufgaben. „Reinigung“ wahrt diesen Bezug, ohne daraus eine allgemein-moralische oder spätere dogmatische Kategorie zu machen.
- issue: Bezug der Sänger und Torwächter in der elliptischen Satzkonstruktion
  choice: Auch sie versahen ihre zugewiesenen Dienste
  alternative: Sie waren lediglich zusammen mit den zuvor genannten Personen anwesend
  rationale: Im Kontext der geordneten Tempeldienste liegt am nächsten, dass die Sänger und Torwächter ebenfalls die ihnen übertragenen Aufgaben wahrnahmen. Wegen der knappen hebräischen Syntax wird diese Ergänzung in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Den Dienst versehen“ bildet die hebräische Amts- und Pflichtsprache idiomatisch ab. Die Wiederholung von „Dienst“ und das Possessivpronomen in „ihren Gott“ bleiben erhalten; die Ellipse bei Sängern und Torwächtern wird im Text knapp und in der Fußnote ausdrücklich wiedergegeben.
