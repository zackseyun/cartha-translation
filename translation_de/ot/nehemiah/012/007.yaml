id: NEH.12.7
reference: Nehemiah 12:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: סַלּ֣וּ עָמ֔וֹק חִלְקִיָּ֖ה יְדַֽעְיָ֑ה אֵ֣לֶּה רָאשֵׁ֧י הַ/כֹּהֲנִ֛ים וַ/אֲחֵי/הֶ֖ם בִּ/ימֵ֥י יֵשֽׁוּעַ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/007.yaml
  text: Sallu[a], Amok, Hilkiah[c][b], Jedaiah—these were the heads of the priests and their brothers in the days of Jeshua.
translation:
  language: de
  text: Sallu, Amok, Hilkija und Jedaja – sie waren die Oberhäupter[a] der Priester und ihrer Brüder[b] zur Zeit Jeschuas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Häupter«; gemeint sind leitende Männer.'
    reason: lexical_alternative
  - marker: b
    text: Mit »Brüder« können hier auch Verwandte, Angehörige derselben Priesterfamilien oder Amtsbrüder gemeint sein.
    reason: lexical_alternative
  - marker: c
    text: Jeschua ist eine nachexilische Kurzform des Namens, der auch mit »Josua« verwandt ist.
    reason: cultural_note
lexical_decisions:
- source_word: סַלּוּ
  choice: Sallu
  rationale: Personenname; in einer im Deutschen üblichen, quellennahen Umschrift wiedergegeben.
- source_word: עָמוֹק
  choice: Amok
  rationale: Personenname; direkt und nach deutscher Konvention transkribiert.
- source_word: חִלְקִיָּה
  choice: Hilkija
  rationale: Personenname; die im Deutschen übliche biblische Namensform bewahrt die hebräische Endung angemessen.
- source_word: יְדַעְיָה
  choice: Jedaja
  rationale: Personenname; nach geläufiger deutscher Bibelkonvention wiedergegeben.
- source_word: אֵלֶּה
  choice: sie
  rationale: Das hebräische Demonstrativpronomen verweist zusammenfassend auf die zuvor genannten Personen; nach dem Gedankenstrich ist „sie“ im Deutschen natürlicher als „diese“.
- source_word: רָאשֵׁי
  choice: Oberhäupter
  rationale: Die Konstruktform von רֹאשׁ bezeichnet hier Personen in leitender Stellung. „Oberhäupter“ erhält das hebräische Bild, ohne den späteren Fachbegriff „Hohepriester“ einzuführen.
- source_word: הַכֹּהֲנִים
  choice: der Priester
  rationale: Bestimmter Plural im Genitiv nach „Oberhäupter“.
- source_word: וַאֲחֵיהֶם
  choice: und ihrer Brüder
  rationale: Bewahrt die wörtliche Verwandtschaftsbezeichnung und lässt offen, ob leibliche Verwandte, Angehörige derselben Priesterfamilien oder Amtsbrüder gemeint sind.
- source_word: בִּימֵי
  choice: zur Zeit
  rationale: Natürliche moderne Wiedergabe der hebräischen Zeitformel „in den Tagen von“.
- source_word: יֵשׁוּעַ
  choice: Jeschua
  rationale: Die nachexilische Kurzform des Namens wird in deutscher Umschrift als „Jeschua“ wiedergegeben und so von „Josua“ unterscheidbar gehalten.
theological_decisions:
- issue: Bedeutungsumfang von וַאֲחֵיהֶם
  choice: ihrer Brüder
  alternative: ihrer Verwandten / ihrer Amtsbrüder
  rationale: Der hebräische Text sagt ausdrücklich „Brüder“. Der Zusammenhang kann einen weiteren verwandtschaftlichen oder priesterlichen Gruppenbezug nahelegen, legt ihn aber nicht eindeutig fest; deshalb bleibt die Spannung im Haupttext erhalten und wird in der Fußnote erläutert.
- issue: Leitungsbezeichnung רָאשֵׁי הַכֹּהֲנִים
  choice: Oberhäupter der Priester
  alternative: führende Priester / Anführer der Priester
  rationale: Die gewählte Form bewahrt das hebräische Bild. „Hohepriester“ oder „oberste Priester“ könnte dagegen einen technischen Amtstitel nahelegen, den der Text hier nicht ausdrücklich verwendet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Namensformen folgen geläufigen deutschen Bibelkonventionen. Der Gedankenstrich markiert die zusammenfassende Aussage nach der Namensliste; die Konjunktion „und“ vor dem letzten Namen sorgt für natürliches Deutsch, ohne den Sinn zu verändern.
