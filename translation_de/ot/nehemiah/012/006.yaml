  rationale: Der hebräische Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: וְ
  choice: und
  rationale: Die hebräische Konjunktion verbindet Jojarib mit dem vorausgehenden Namen. Im Deutschen steht „und“ in einer natürlichen Namensreihe vor dem letzten Glied; daher wird Jedaja nach Jojarib genannt.
- source_word: יוֹיָרִיב
  choice: Jojarib
  rationale: Diese deutsche Umschrift gibt die hier belegte kürzere Namensform wieder, ohne sie zur verwandten längeren Form „Jojarib/Jehojarib“ auszubauen.
- source_word: יְדַעְיָה
  choice: Jedaja
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibelnamenskonvention wiedergegeben.
