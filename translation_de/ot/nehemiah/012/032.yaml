  naturalness: „Hinter ihnen gingen Hoschaja und die Hälfte der führenden Männer Judas“ ist natürliches, würdevolles modernes Standarddeutsch. Der Plural bei „gingen“ ist im Deutschen bei dem koordinierten Subjekt erforderlich, auch wenn das hebräische Verb im Singular bei dem zuerst genannten Subjekt steht.
  terminology: „Führende Männer“ gibt שָׂרֵי in diesem zeremoniell-administrativen Zusammenhang ausreichend offen wieder. „Judas“ ist als Genitiv von Juda idiomatisch. Die Fußnote bewahrt die mögliche sequenzielle Nuance von אַחֲרֵיהֶם.
