base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/032.yaml
  text: Hoshaiah and half of the officials of Judah went behind them[a].
translation:
  language: de
  text: Hinter ihnen gingen Hoschaja und die Hälfte der führenden Männer Judas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nach ihnen gingen Hoschaja und die Hälfte der führenden Männer Judas.“'
    reason: Das Hebräische kann sowohl die räumliche Position hinter der vorausgehenden Gruppe als auch die Reihenfolge innerhalb der Prozession ausdrücken.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: Das Narrativpräteritum von הלך bezeichnet hier die Bewegung innerhalb der Prozession; „ging“ ist im Deutschen natürlich und bewahrt zugleich die konkrete Vorstellung des Gehens.
- source_word: אַחֲרֵיהֶם
  choice: hinter ihnen
  rationale: אַחֲרֵי mit Suffix bezeichnet hier die räumliche beziehungsweise sequenzielle Stellung in der Prozession. „Hinter ihnen“ macht die Prozessionsordnung deutlich; „nach ihnen“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- source_word: הוֹשַׁעְיָה
  choice: Hoschaja
  rationale: Der Personenname wird nach gängiger deutscher Bibelnamen-Transliteration wiedergegeben.
- source_word: וַחֲצִי
  choice: mit der Hälfte
  rationale: חֲצִי bedeutet „Hälfte“. Obwohl das vorangestellte וְ formal koordinierend ist, gibt „mit“ im Deutschen die gemeinsame Bewegung Hoschajas und der Gruppe natürlich wieder.
- source_word: שָׂרֵי
  choice: führenden Männer
  rationale: שַׂר kann Fürsten, Oberste, Amtsträger oder andere Führungspersonen bezeichnen. „Führende Männer“ hält die Funktion offen und vermeidet sowohl eine dynastische Deutung als „Prinzen“ als auch eine zu eng bürokratische Festlegung.
- source_word: יְהוּדָה
  choice: Judas
  rationale: Im Genitiv nach „führenden Männer“ steht die im Deutschen eingebürgerte Form „Judas“ für Juda.
