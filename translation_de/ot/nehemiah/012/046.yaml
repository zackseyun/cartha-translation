  text: כִּֽי בִ/ימֵ֥י דָוִ֛יד וְ/אָסָ֖ף מִ/קֶּ֑דֶם ראש הַ/מְשֹׁ֣רְרִ֔ים וְ/שִׁיר תְּהִלָּ֥ה וְ/הֹד֖וֹת לֵֽ/אלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/046.yaml
  text: For in the days of David and Asaph[a], of old, there were heads of the singers[b], and songs of praise and thanksgiving to God.
translation:
  language: de
  text: Denn in den Tagen Davids und Asafs, vor langer Zeit[a], gab es Leiter[b] der Sänger sowie Lob- und Danklieder für Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von alters her“ beziehungsweise „früher“. Die Zuordnung der Zeitangabe im hebräischen Satz ist nicht völlig eindeutig.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische hat im Singular: „Haupt der Sänger“. Der Ausdruck kann kollektiv „Leiter“, „Vorsteher“ oder „Oberhäupter der Sänger“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und entspricht der erklärenden Funktion im Zusammenhang.
- source_word: בִימֵי דָוִיד וְאָסָף
  choice: in den Tagen Davids und Asafs
  rationale: Bewahrt die geläufige hebräische Zeitangabe in natürlichem, würdigem Deutsch.
- source_word: מִקֶּדֶם
  choice: schon in früherer Zeit
  rationale: Gibt den Rückblick auf eine frühere, alte Zeit verständlich wieder, ohne den Ausdruck stärker als nötig auf fernste Urzeit festzulegen.
- source_word: רֹאשׁ הַמְשֹׁרְרִים
  choice: Leiter der Sänger
  rationale: Das singularische רֹאשׁ ist hier kollektiv zu verstehen; „Leiter“ bezeichnet die führenden Personen idiomatischer als das wörtliche „Haupt“.
- source_word: וְשִׁיר תְּהִלָּה וְהֹדוֹת
  choice: sowie Lob- und Danklieder
  rationale: שִׁיר steht im Singular, kann aber kollektiv verstanden werden; die koordinierte deutsche Form gibt die gottesdienstlichen Lieder natürlich wieder.
- source_word: לֵאלֹהִים
  choice: für Gott
  rationale: Die Präposition ל bezeichnet hier die Ausrichtung beziehungsweise den Adressaten der Lob- und Danklieder; „für Gott“ ist im Deutschen natürlich.
theological_decisions:
- issue: Elliptischer Nominalsatz ohne ausdrücklich gesetztes Verb
  choice: gab es
  alternative: waren
  rationale: „Gab es“ ergänzt die im Hebräischen nur vorausgesetzte Existenzbehauptung idiomatisch, ohne eine zusätzliche theologische Aussage einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die hebräische Ellipse wird behutsam durch „gab es“ aufgelöst; die zeitliche Spannung zwischen „in den Tagen Davids und Asafs“ und מִקֶּדֶם bleibt durch die Fußnote sichtbar.
