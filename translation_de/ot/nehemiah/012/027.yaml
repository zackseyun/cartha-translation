base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/027.yaml
  text: At the dedication of the wall of Jerusalem[a], they sought the Levites from all their places, to bring them to Jerusalem to celebrate the dedication with gladness, with thanksgivings, and with song, with cymbals, harps[c][b], and lyres.
translation:
  language: de
  text: Bei der Einweihung der Mauer Jerusalems suchte man die Leviten an all ihren Wohnorten[a], um sie nach Jerusalem zu bringen und die Einweihung[b] mit Freude, Dank und Gesang, mit Zimbeln, Harfen und Leiern[c] zu feiern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „suchte nach den Leviten“; dem Zusammenhang nach auch: „ließ die Leviten zusammenrufen“. Das hebräische Verb bedeutet grundsätzlich „suchen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „eine Einweihung zu machen“.'
    reason: lexical_alternative
  - marker: c
    text: Welche beiden antiken Saiteninstrumente genau gemeint sind, ist unsicher; der hebräische Text nennt zwei verschiedene Instrumente.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֲנֻכַּת חוֹמַת יְרוּשָׁלִַם
  choice: Bei der Einweihung der Mauer Jerusalems
  rationale: Die Präposition ב mit חֲנֻכָּה setzt den zeitlichen Rahmen. „Einweihung“ gibt das Nomen sachgerecht wieder; die deutsche Formulierung ist würdig und natürlich.
- source_word: בִּקְשׁוּ אֶת הַלְוִיִּם
  choice: suchte man die Leviten ... auf
  rationale: בקשׁ bedeutet grundsätzlich „suchen“. Das unbestimmte „man“ entspricht dem im Hebräischen nicht näher bezeichneten Subjekt; „aufsuchen“ passt zum Zusammenhang des Zusammenholens, ohne eine förmliche Vorladung vorauszusetzen.
- source_word: מִכָּל מְקוֹמֹתָם
  choice: an all ihren Wohnorten
  rationale: Wörtlich steht „aus all ihren Orten“. Im Kontext sind die verschiedenen Orte gemeint, an denen die Leviten wohnten; „Wohnorte“ macht dies in knappem, natürlichem Deutsch deutlich.
- source_word: לַהֲבִיאָם לִירוּשָׁלִָם
  choice: um sie nach Jerusalem zu bringen
  rationale: Der Hifil von בוא hat kausative Bedeutung. „Bringen“ wahrt diese und ist im Deutschen idiomatisch.
- source_word: לַעֲשֹׂת חֲנֻכָּה
  choice: die Einweihung ... zu feiern
  rationale: Die hebräische Wendung lautet wörtlich „eine Einweihung machen/durchführen“. „Die Einweihung feiern“ gibt den gemeinten festlichen Vollzug natürlich wieder.
- source_word: וְשִׂמְחָה וּבְתוֹדוֹת וּבְשִׁיר
  choice: mit Freude, Dank und Gesang
  rationale: Die drei Elemente bleiben unterschieden. „Dank“ gibt תוֹדוֹת wieder, ohne es voreilig als Danklieder oder Chöre zu bestimmen; „Gesang“ entspricht dem folgenden שִׁיר.
- source_word: מְצִלְתַּיִם נְבָלִים וּבְכִנֹּרוֹת
  choice: mit Zimbeln, Harfen und Leiern
  rationale: „Zimbeln“ ist die übliche Bezeichnung für מְצִלְתַּיִם. Die beiden unterschiedlichen hebräischen Saiteninstrumente werden traditionell als „Harfen“ und „Leiern“ unterschieden, obwohl ihre genaue Bauart unsicher ist.
