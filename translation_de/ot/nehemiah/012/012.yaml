  language: en
  yaml_path: translation/ot/nehemiah/012/012.yaml
  text: 'And in the days of Joiakim, there were priests, heads of the fathers’ houses: for Seraiah, Meraiah; for Jeremiah, Hananiah.'
translation:
  language: de
  text: 'In den Tagen Jojakims waren Priester Oberhäupter der Sippen: Von Seraja: Meraja; von Jeremia: Hananja.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִימֵי יוֹיָקִים
  choice: In den Tagen Jojakims
  rationale: Gibt die hebräische Zeitangabe idiomatisch und nah am Wortlaut wieder; das einleitende ו wird im Deutschen nicht eigens mit „und“ wiedergegeben.
- source_word: כֹהֲנִים רָאשֵׁי הָאָבוֹת
  choice: Priester, die Oberhäupter der Sippen
  rationale: רָאשֵׁי bezeichnet leitende Vertreter; הָאָבוֹת meint hier im genealogischen Zusammenhang Familien- beziehungsweise Sippenverbände, nicht bloß einzelne Väter.
- source_word: לִשְׂרָיָה מְרָיָה
  choice: 'für Seraja: Meraja'
  rationale: Das ל markiert die Zuordnung zu dem zuvor genannten Priester beziehungsweise dessen Sippe; „für“ bewahrt diese knappe, listenartige Beziehung, ohne sie stärker auszudeuten.
- source_word: לְיִרְמְיָה חֲנַנְיָה
  choice: 'für Jeremia: Hananja'
  rationale: Parallel zur vorigen Zuordnung und unter Wahrung der knappen Listenform.
