lexical_decisions:
- source_word: ל/עדיא
  choice: für Iddo
  rationale: Die vorangestellte Präposition ל kennzeichnet in dieser Liste die Zugehörigkeit beziehungsweise Vertretung. Im Deutschen gibt „für“ die knappe Listenform passend wieder. Der Name wird im Zusammenhang dieser Priesterliste als Iddo wiedergegeben.
- source_word: זְכַרְיָה
  choice: Secharja
  rationale: Deutsche Standardform des hebräischen Personennamens; Secharja ist hier der dem Haus Iddos zugeordnete Vertreter.
- source_word: לְ/גִנְּתוֹן
  choice: für Ginneton
  rationale: Wie beim ersten Namen bezeichnet ל die Zuordnung oder Vertretung innerhalb der Liste. „Ginneton“ ist eine im Deutschen verständliche Transliteration des Eigennamens.
- source_word: מְשֻׁלָּם
  choice: Meschullam
  rationale: Gebräuchliche deutsche Transliteration des Personennamens; Meschullam ist Ginneton zugeordnet.
