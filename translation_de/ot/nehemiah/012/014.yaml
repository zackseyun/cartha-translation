  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens יוֹנָתָן.
- source_word: לִ/שְׁבַנְיָ֖ה
  choice: für Schebanja
  rationale: Wie in der ersten Wortgruppe kennzeichnet ל wahrscheinlich die Zuordnung beziehungsweise Vertretung innerhalb der Liste. »Schebanja« ist eine verständliche deutsche Umschrift des Namens.
- source_word: יוֹסֵֽף
  choice: Josef
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens יוֹסֵף.
