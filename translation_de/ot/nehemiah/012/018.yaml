lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: für Bilga
  rationale: Das vorangestellte לְ kennzeichnet in dieser Liste die Zuordnung des nachfolgenden Vertreters zu einem priesterlichen Haus; »für« gibt diese Beziehung im Deutschen knapp wieder. Der Eigenname wird in der im Deutschen üblichen Form »Bilga« wiedergegeben.
- source_word: שַׁמּוּעַ
  choice: Schammua
  rationale: Der Eigenname des zu Bilga gehörenden Vertreters wird quellennah und nach deutscher Umschrift wiedergegeben.
- source_word: לִֽ/שְׁמַעְיָה
  choice: für Schemaja
  rationale: Wie beim ersten לְ bezeichnet die Präposition die Zuordnung des folgenden Vertreters; »für« bewahrt die Listenstruktur, ohne die Beziehung genauer festzulegen, als es der hebräische Text tut.
- source_word: יְהוֹנָתָן
  choice: Jehonatan
  rationale: Die volle hebräische Namensform יְהוֹנָתָן wird als »Jehonatan« wiedergegeben und nicht zur kürzeren Form »Jonatan« verkürzt.
