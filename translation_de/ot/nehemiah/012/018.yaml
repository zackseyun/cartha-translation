base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/018.yaml
  text: for Bilgah[a], Shammua; for Shemaiah[b], Jehonathan.
translation:
  language: de
  text: 'von Bilga[a]: Schammua; von Schemaja: Jehonatan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für Bilga … für Schemaja«. Die hebräische Präposition kann in solchen Listen die Zuordnung zu einem priesterlichen Haus oder dessen Vertreter bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch »Jehonatan«; manche Übersetzungen verwenden die kürzere Namensform »Jonatan«.
