source:
  edition: WLC
  text: וַֽ/תַּעֲמֹ֛דְנָה שְׁתֵּ֥י הַ/תּוֹדֹ֖ת בְּ/בֵ֣ית הָ/אֱלֹהִ֑ים וַ/אֲנִ֕י וַ/חֲצִ֥י הַ/סְּגָנִ֖ים עִמִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/040.yaml
  text: So the two thanksgiving choirs took their stand in the house of God[a], and I, and half of the officials with me,
translation:
  language: de
  text: So nahmen die beiden Dankchöre[a] im Haus Gottes Aufstellung, und auch ich nahm mit der Hälfte der Vorsteher, die bei mir waren, Aufstellung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die beiden Danksagungen“. Gemeint sind hier die beiden Dankgruppen oder Dankchöre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: nahmen … Aufstellung
  rationale: Die feminine Pluralform von עמד bezieht sich auf die beiden Gruppen. „Aufstellung nehmen“ gibt sowohl das Stehen als auch das Einnehmen des vorgesehenen Platzes in der Feier wieder.
- source_word: שְׁתֵּי הַתּוֹדֹת
  choice: die beiden Dankchöre
  rationale: Wörtlich steht „die beiden Danksagungen“. Im Zusammenhang sind damit die zwei für die Dankfeier gebildeten Gruppen beziehungsweise Chöre gemeint.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: im Haus Gottes
  rationale: Die direkte Wiedergabe bewahrt die hebräische Bezeichnung für den Tempel; בְּ wird hier natürlich lokal mit „in“ wiedergegeben.
- source_word: וַאֲנִי
  choice: ebenso ich
  rationale: Das verbindende וְ ordnet Nehemia und die bei ihm befindlichen Vorsteher der geschilderten Aufstellung zu. „Ebenso“ stellt diesen Anschluss im Deutschen klar her.
- source_word: וַחֲצִי הַסְּגָנִים
  choice: und die Hälfte der Vorsteher
  rationale: סְגָנִים bezeichnet leitende Amtsträger. „Vorsteher“ ist im historischen Zusammenhang verständlich und wahrt ihren leitenden Rang.
- source_word: עִמִּי
  choice: bei mir
  rationale: Die Präposition bezeichnet hier die Begleitung beziehungsweise Zugehörigkeit zu Nehemias Gruppe; „bei mir“ ist im Deutschen idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, wird aber durch „ebenso“ natürlich verbunden. Der Ausdruck „Haus Gottes“ bewahrt das biblische Bild statt es ausdrücklich als „Tempel“ aufzulösen.
