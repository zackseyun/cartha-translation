  text: And Joiada fathered Jonathan[a], and Jonathan fathered Jaddua.
translation:
  language: de
  text: Und Jojada zeugte Jonatan[a], und Jonatan zeugte Jaddua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften und Übersetzungen lesen hier „Johanan“ statt „Jonatan“. Der hier zugrunde gelegte hebräische Text hat „Jonatan“.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ
  choice: Und
  rationale: Die Präfixkonjunktion verbindet die genealogische Notiz schlicht mit der vorhergehenden Zeile.
- source_word: יוֹיָדָע
  choice: Jojada
  rationale: Der Personenname wird nach gängiger deutscher Bibelnamenform wiedergegeben und entspricht der hebräischen Form.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in Genealogien das Zeugen beziehungsweise Vaterwerden; „zeugte“ ist knapp, präzise und im Deutschen weiterhin verständlich.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: Der hebräische Akkusativmarker besitzt im Deutschen keine direkte Entsprechung; seine Funktion wird durch die Satzstellung ausgedrückt.
- source_word: יוֹנָתָן
  choice: Jonatan
  rationale: Der vorliegende hebräische Text liest יוֹנָתָן, daher steht im Haupttext „Jonatan“; die abweichende Lesart „Johanan“ wird in einer Fußnote genannt.
- source_word: וְ
  choice: und
  rationale: Die zweite Konjunktion führt die Abstammungsfolge schlicht weiter.
- source_word: יַדּוּעַ
  choice: Jaddua
  rationale: Der Personenname wird in seiner etablierten deutschen Bibelnamenform wiedergegeben.
