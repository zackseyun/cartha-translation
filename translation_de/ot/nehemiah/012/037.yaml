source:
  edition: WLC
  text: וְ/עַל֩ שַׁ֨עַר הָ/עַ֜יִן וְ/נֶגְדָּ֗/ם עָלוּ֙ עַֽל מַעֲלוֹת֙ עִ֣יר דָּוִ֔יד בַּֽ/מַּעֲלֶ֖ה לַ/חוֹמָ֑ה מֵ/עַל֙ לְ/בֵ֣ית דָּוִ֔יד וְ/עַ֛ד שַׁ֥עַר הַ/מַּ֖יִם מִזְרָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/037.yaml
  text: And by the Fountain Gate[a], in front of them, they went up by the stairs of the city of David, at the ascent of the wall, above the house of David[b], and as far as the Water Gate on the east.
translation:
  language: de
  text: Und beim Quelltor[a], ihnen gegenüber, stiegen sie die Stufen[b] der Stadt Davids hinauf, am Aufgang zur Mauer, oberhalb des Hauses Davids und bis zum Wassertor im Osten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Brunnentor«. Das hebräische Wort kann eine Quelle oder einen natürlichen Wasseraustritt bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Aufgängen«. Das hebräische Wort kann konkrete Stufen oder allgemeiner ansteigende Wege bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל שַׁעַר הָעַיִן
  choice: Und oberhalb des Quelltors
  rationale: עַל bezeichnet in dieser topografischen Wegbeschreibung am ehesten eine höhere Lage relativ zum Tor. עַיִן kann eine Quelle oder einen Wasseraustritt bezeichnen; „Quelltor“ ist als deutscher Ortsname knapp und sachgerecht.
- source_word: וְנֶגְדָּם
  choice: ihnen gegenüber
  rationale: נֶגֶד kann „vor“ oder „gegenüber“ bedeuten. Die Wiedergabe bewahrt die räumliche Aussage, ohne die genaue Anordnung der Prozession näher festzulegen.
- source_word: עָלוּ
  choice: stiegen ... hinauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung. Die getrennte deutsche Verbform klingt natürlich und hält das Bewegungsbild fest.
- source_word: מַעֲלוֹת עִיר דָּוִיד
  choice: auf den Stufen der Stadt Davids
  rationale: Der Plural מַעֲלוֹת kann konkrete Stufen beziehungsweise Treppen oder allgemeiner Aufgänge bezeichnen. Im städtischen und topografischen Zusammenhang sind konkrete Stufen wahrscheinlich.
- source_word: בַּמַּעֲלֶה לַחוֹמָה
  choice: am Aufgang zur Mauer
  rationale: Der Singular מַעֲלֶה bezeichnet einen Aufgang oder Anstieg; לַחוֹמָה gibt dessen Richtung beziehungsweise Ziel an.
- source_word: מֵעַל לְבֵית דָּוִיד
  choice: oberhalb des Hauses Davids
  rationale: מֵעַל beschreibt hier die höhere Lage der Route relativ zum Haus Davids.
- source_word: שַׁעַר הַמַּיִם מִזְרָח
  choice: Wassertor im Osten
  rationale: מִזְרָח lokalisiert das Wassertor östlich beziehungsweise bezeichnet die ostwärts gerichtete Strecke. „im Osten“ ist im Deutschen klar und idiomatisch.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die topografischen Bezeichnungen bleiben eng am Hebräischen; die Unsicherheit bei עַיִן und מַעֲלוֹת wird in Fußnoten offengehalten. Der Marker zur Bedeutung von מַעֲלוֹת steht sachgerecht bei „Stufen“.
