  - severity: medium
    issue: „Sie sonderten für die Leviten aus“ und die parallele zweite Aussage lassen im Deutschen ein erforderliches Objekt vermissen.
    rationale: Das Hebräische kann das Objekt bei מקדישים unausgedrückt lassen. Deutsch benötigt hier jedoch wenigstens ein unbestimmtes Objekt. „Etwas“ vermeidet eine nicht ausdrücklich belegte Spezifizierung und erhält die syntaktische Parallelität.
