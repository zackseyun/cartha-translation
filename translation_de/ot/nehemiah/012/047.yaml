- from: Und ganz Israel gab in den Tagen Serubbabels und in den Tagen Nehemias die Anteile für die Sänger und die Torwächter, wie es jeder einzelne Tag erforderte.[a] Sie sonderten für die Leviten aus,[b] und die Leviten sonderten für die Söhne Aarons aus.[c]
  to: Und ganz Israel gab in den Tagen Serubbabels und in den Tagen Nehemias die Anteile für die Sänger und die Torwächter, was an jedem Tag erforderlich war.[a] Und sie sonderten etwas für die Leviten aus,[b] und die Leviten sonderten etwas für die Söhne Aarons aus.[c]
  rationale: Die Revision glättet zwei deutsche Ausdrucksprobleme, ohne den Sinn zu verändern. Sie ersetzt die unnatürliche Personifizierung des Tages durch eine idiomatische Umschreibung des hebräischen Tagesbedarfs. Zugleich ergänzt sie bei „aussondern“ nur das minimale unbestimmte Objekt „etwas“, weil der hebräische Gegenstand nicht genannt ist; damit wird weder „Anteile“ noch „geweihte Gaben“ als expliziter Gegenstand behauptet. Die Fußnoten bleiben korrekt verankert und erläutern diese bewusste Offenheit.
