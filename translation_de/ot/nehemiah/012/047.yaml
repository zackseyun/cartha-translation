  naturalness: „Wie es jeder einzelne Tag erforderte“ personifiziert den Tag unnötig und klingt im modernen Deutsch schwerfällig. „Was an jedem Tag erforderlich war“ gibt die idiomatische Bedeutung klar und natürlich wieder. „Für die Leviten aussondern“ benötigt im Deutschen ein Objekt; „etwas“ stellt die nötige grammatische Ergänzung bereit und wahrt zugleich die Offenheit des hebräischen Textes.
  terminology: „Ganz Israel“, „Serubbabel“, „Nehemia“, „Anteile“, „Sänger“, „Torwächter“, „Leviten“ und „Söhne Aarons“ sind sachgerecht. „Aussondern“ bewahrt bei מקדישים den sakralen Setzungs- bzw. Weiheaspekt besser als ein bloßes „geben“. Die Erläuterung zu den Söhnen Aarons ist angemessen und macht sie nicht zur Haupttextparaphrase.
