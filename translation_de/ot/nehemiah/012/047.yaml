  text: וְ/כָל יִשְׂרָאֵל֩ בִּ/ימֵ֨י זְרֻבָּבֶ֜ל וּ/בִ/ימֵ֣י נְחֶמְיָ֗ה נֹֽתְנִ֛ים מְנָי֛וֹת הַ/מְשֹׁרְרִ֥ים וְ/הַ/שֹּׁעֲרִ֖ים דְּבַר י֣וֹם בְּ/יוֹמ֑/וֹ וּ/מַקְדִּשִׁים֙ לַ/לְוִיִּ֔ם וְ/הַ/לְוִיִּ֔ם מַקְדִּשִׁ֖ים לִ/בְנֵ֥י אַהֲרֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/047.yaml
  text: And all Israel[a], in the days of Zerubbabel and in the days of Nehemiah, gave the portions for the singers and the gatekeepers, as each day required; and they set apart the consecrated portions for the Levites[c][b], and the Levites set apart the consecrated portions for the sons of Aaron.
translation:
  language: de
  text: Und ganz Israel gab in den Tagen Serubbabels und in den Tagen Nehemias die Anteile für die Sänger und die Torwächter, was an jedem Tag erforderlich war.[a] Und sie sonderten etwas für die Leviten aus,[b] und die Leviten sonderten etwas für die Söhne Aarons aus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Sache eines Tages an seinem Tag“, das heißt: was an jedem Tag erforderlich war.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb bedeutet, etwas zu heiligen oder für einen heiligen Zweck auszusondern. Was ausgesondert wurde, wird hier nicht ausdrücklich genannt.
    reason: lexical_alternative
  - marker: c
    text: Gemeint sind die Priester aus der Linie Aarons.
    reason: clarification
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Und ganz Israel
  rationale: Bewahrt die kollektive Bezeichnung Israels, ohne sie unnötig zu „alle Israeliten“ aufzulösen.
- source_word: בִּימֵי זְרֻבָּבֶל וּבִימֵי נְחֶמְיָה
  choice: in den Tagen Serubbabels und in den Tagen Nehemias
  rationale: Die Wiederholung von בִּימֵי bleibt als bewusst feierlich-historische Rahmung erhalten.
- source_word: נֹתְנִים
  choice: gab
  rationale: Das Partizip beschreibt hier eine während der genannten Zeiten übliche, fortdauernde Praxis; im deutschen historischen Bericht gibt das Präteritum dies natürlich wieder.
- source_word: מְנָיוֹת
  choice: die Anteile
  rationale: Bezeichnet die zugewiesenen Versorgungsanteile für das Tempelpersonal; „Anteile“ ist knapp und im Zusammenhang verständlich.
- source_word: הַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: die Sänger und die Torwächter
  rationale: Gibt die feststehenden Dienstgruppen am Tempel präzise und geläufig wieder.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: wie es jeder einzelne Tag erforderte
  rationale: Überträgt die wörtliche Wendung „die Sache eines Tages an ihrem Tag“ als regelmäßigen, am jeweiligen Tagesbedarf ausgerichteten Dienst.
- source_word: מַקְדִּשִׁים
  choice: sonderten … aus
  rationale: Bewahrt den Grundgedanken des Heiligens beziehungsweise Aussonderns, ohne das Verb zu gewöhnlichem „geben“ abzuschwächen. Das im Hebräischen unausgesprochene Objekt bleibt auch im Deutschen aus dem Zusammenhang erschließbar.
- source_word: לַלְוִיִּם
  choice: für die Leviten
  rationale: Kennzeichnet die Leviten als Empfänger beziehungsweise Begünstigte des Ausgesonderten.
- source_word: בְּנֵי אַהֲרֹן
  choice: die Söhne Aarons
  rationale: Bewahrt die formale und heilsgeschichtlich geprägte Bezeichnung; ihre Bedeutung als aaronitische Priester wird in einer Fußnote erläutert.
theological_decisions:
- issue: Bedeutung von מַקְדִּשִׁים im Zusammenhang der Tempelversorgung
  choice: „sonderten … aus“ mit sakraler Bedeutung
  alternative: „gaben“ oder „stellten bereit“
  rationale: Die Wurzel קדש trägt auch hier den Gedanken des Heiligens beziehungsweise der Bestimmung für einen heiligen Zweck. Die Wiedergabe vermeidet sowohl eine rein verwaltungssprachliche Einebnung als auch die Ergänzung eines im Hebräischen nicht ausdrücklich genannten Gegenstands.
- issue: Identität der „Söhne Aarons“
  choice: Die genealogisch-kultische Ausdrucksweise bleibt im Haupttext stehen.
  alternative: „die aaronitischen Priester“
  rationale: „Söhne Aarons“ ist die unmittelbare Form des hebräischen Ausdrucks und bezeichnet in diesem Zusammenhang die Priesterschaft aus Aarons Linie, ohne dass die Übersetzung diese Deutung in den Haupttext eintragen muss.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht feierlicher historischer Rahmung. Die wiederholte Formulierung „in den Tagen“ und die Bezeichnung „Söhne Aarons“ bewahren den Ton und die Struktur des Hebräischen. Die sachlich knappe Wiederholung „sonderten … aus“ erhält die Parallelität des Ausgangstextes.
