lexical_decisions:
- source_word: לְ/חִלְקִיָּה
  choice: für Hilkija
  rationale: Die Präposition ל bezeichnet in dieser priesterlichen Namensliste wahrscheinlich Zuordnung oder Vertretung. „Für“ bewahrt die knappe Listenform und gibt wieder, dass Haschabja Hilkija beziehungsweise dessen Haus vertritt.
- source_word: חֲשַׁבְיָה
  choice: Haschabja
  rationale: Der Personenname wird nach üblicher deutscher Bibeltradition in einer dem Hebräischen angenäherten Form wiedergegeben.
- source_word: לִ/ידַעְיָה
  choice: für Jedaja
  rationale: Wie in der ersten Vershälfte kennzeichnet ל wahrscheinlich die Person beziehungsweise das Haus, dem der anschließend Genannte zugeordnet ist oder das er vertritt.
- source_word: נְתַנְאֵל
  choice: Netanel
  rationale: Der hebräische Personenname wird in einer natürlichen, im Deutschen gebräuchlichen Transliteration wiedergegeben.
