  text: וּ/מַעֲשֵׂיָ֨ה וּֽ/שְׁמַֽעְיָ֜ה וְ/אֶלְעָזָ֧ר וְ/עֻזִּ֛י וִֽ/יהוֹחָנָ֥ן וּ/מַלְכִּיָּ֖ה וְ/עֵילָ֣ם וָ/עָ֑זֶר וַ/יַּשְׁמִ֨יעוּ֙ הַ/מְשֹׁ֣רְרִ֔ים וְ/יִֽזְרַחְיָ֖ה הַ/פָּקִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/042.yaml
  text: and Maaseiah[a], Shemaiah, Eleazar, Uzzi, Jehohanan, Malkijah, Elam, and Ezer. And the singers made their voices heard[b], with Izrahiah the overseer.
translation:
  language: de
  text: und Maaseja, Schemaja, Eleasar, Usi, Johanan, Malkija, Elam und Eser. Die Sänger ließen sich hören[a], und Jisrachja war der Aufseher[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „ließen hören“; sinngemäß auch: „sangen laut“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Beauftragte“ beziehungsweise „der Leiter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂיָה
  choice: Maaseja
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren, bibelsprachlich vertrauten Form wiedergegeben.
- source_word: שְׁמַעְיָה
  choice: Schemaja
  rationale: Deutsche Transliteration des Personennamens, die den hebräischen Lautbestand erkennbar bewahrt.
- source_word: אֶלְעָזָר
  choice: Eleasar
  rationale: Im Deutschen geläufige Form des hebräischen Personennamens.
- source_word: עֻזִּי
  choice: Usi
  rationale: Gut lesbare deutsche Transliteration des Personennamens.
- source_word: יְהוֹחָנָן
  choice: Johanan
  rationale: Im Deutschen etablierte Form des Personennamens; sie gibt die Langform des hebräischen Namens angemessen wieder.
- source_word: מַלְכִּיָּה
  choice: Malkija
  rationale: Deutsche Transliteration des Personennamens ohne Übersetzung seiner Namensbedeutung.
- source_word: עֵילָם
  choice: Elam
  rationale: Hier ist Elam ein Personenname und wird daher transliteriert, nicht als Gebietsbezeichnung erläutert.
- source_word: עָזֶר
  choice: Eser
  rationale: Deutsche Transliteration des Personennamens.
- source_word: וַיַּשְׁמִיעוּ
  choice: ließen sich hören
  rationale: Die Hifil-Form von שמע hat kausative Bedeutung, wörtlich etwa „ließen hören“. Im Zusammenhang mit den Sängern gibt „ließen sich hören“ die Wendung natürlich wieder, ohne das im Hebräischen nicht ausdrücklich vorhandene Wort „Stimme“ einzufügen.
- source_word: הַמְשֹׁרְרִים
  choice: die Sänger
  rationale: Die substantivisch gebrauchte Form bezeichnet unmittelbar die singenden Personen im Tempel- und Prozessionszusammenhang.
- source_word: יִזְרַחְיָה
  choice: Jisrachja
  rationale: Deutsche Transliteration des Personennamens.
- source_word: הַפָּקִיד
  choice: der Aufseher
  rationale: Das Wort bezeichnet einen eingesetzten Verantwortlichen mit Aufsichts- oder Leitungsfunktion. „Aufseher“ wahrt diese administrative Bedeutung, ohne einen genauer bestimmten Rang zu behaupten.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Namensformen folgen gut lesbaren deutschen Transliterationskonventionen. Das einleitende „und“ bleibt erhalten, weil der Vers die Namensliste des vorhergehenden Satzes fortsetzt. Die Aussage über Jisrachja wird als eigener Nominalsatz wiedergegeben; eine engere Beziehung wie „unter der Leitung Jisrachjas“ wird nicht ergänzt, da sie im Hebräischen nur aus dem Zusammenhang erschlossen werden könnte.
