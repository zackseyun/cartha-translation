base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/018.yaml
  text: For many in Judah were bound by oath to him[a], because he was the son-in-law of Shecaniah son of Arah[b], and Jehohanan his son had taken the daughter of Meshullam son of Berechiah as his wife.
translation:
  language: de
  text: Denn viele in Juda waren ihm durch einen Eid verpflichtet[a], weil er der Schwiegersohn Schechanjas, des Sohnes Arachs, war und dessen Sohn Johanan die Tochter Meschullams, des Sohnes Berechjas, zur Frau genommen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »waren ihm gegenüber Inhaber eines Eides«; gemeint ist, dass sie ihm durch einen Eid verpflichtet waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים בִּיהוּדָה
  choice: viele in Juda
  rationale: Die Wendung bezeichnet viele Menschen innerhalb Judas beziehungsweise der dortigen Gemeinschaft; die lokale Wiedergabe ist im Deutschen natürlich und quellennah.
- source_word: בַּעֲלֵי שְׁבוּעָה לוֹ
  choice: waren ihm durch einen Eid verpflichtet
  rationale: Wörtlich handelt es sich um »Inhaber eines Eides ihm gegenüber«. Die gewählte Formulierung gibt die durch einen Eid begründete Bindung verständlich wieder, ohne ihre genaue politische oder persönliche Art näher festzulegen.
- source_word: כִּי ... כִּי
  choice: Denn ... weil
  rationale: Das erste כִּי begründet die Aussage des vorangehenden Zusammenhangs, das zweite nennt den Grund für die eidliche Bindung.
- source_word: חָתָן הוּא לִשְׁכַנְיָה
  choice: er der Schwiegersohn Schechanjas ... war
  rationale: חָתָן bezeichnet hier eine durch Heirat entstandene Verwandtschaft und lässt sich im gegebenen Zusammenhang am natürlichsten mit »Schwiegersohn« wiedergeben.
- source_word: וִיהוֹחָנָן בְּנוֹ
  choice: und sein Sohn Johanan
  rationale: Das Suffix bezieht sich grammatisch am nächsten auf Schechanja; die deutsche Wortstellung macht diese Zuordnung deutlich.
- source_word: לָקַח אֶת בַּת
  choice: die Tochter ... zur Frau genommen hatte
  rationale: לקח mit »Tochter« ist hier eine übliche Heiratsformel. Die Wiedergabe macht den ehelichen Sinn klar und bewahrt zugleich das Bild des hebräischen Ausdrucks.
- source_word: בַּת מְשֻׁלָּם בֶּן בֶּרֶכְיָה
  choice: die Tochter Meschullams, des Sohnes Berechjas
  rationale: Die Formulierung bildet die patronymische Kette eindeutig und idiomatisch ab.
