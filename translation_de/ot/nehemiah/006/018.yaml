  terminology: „Juda“, „Schwiegersohn“, „zur Frau genommen“ und die Namensformen sind im gegebenen deutschsprachigen Übersetzungsrahmen brauchbar. Die Fußnote erklärt die ungewöhnliche hebräische Konstruktion ausreichend; eine vorsichtigere Kennzeichnung als ungefähre wörtliche Wiedergabe ist stilistisch klarer.
