  source_fidelity: Die Übersetzung gibt den argumentativen Anschluss beider כִּי, die Eidbindung an Tobija, die Schwiegersohn-Beziehung sowie die zweite Heiratsverbindung sachgerecht wieder. Die Wiedergabe von בַּעֲלֵי שְׁבוּעָה לוֹ als „ihm durch einen Eid verpflichtet“ ist eine angemessene idiomatische Auslegung, ohne die Art der Bindung zu überbestimmen.
