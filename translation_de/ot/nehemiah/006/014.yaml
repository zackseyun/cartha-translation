  text: זָכְרָ֧/ה אֱלֹהַ֛/י לְ/טוֹבִיָּ֥ה וּ/לְ/סַנְבַלַּ֖ט כְּ/מַעֲשָׂ֣י/ו אֵ֑לֶּה וְ/גַ֨ם לְ/נוֹעַדְיָ֤ה הַ/נְּבִיאָה֙ וּ/לְ/יֶ֣תֶר הַ/נְּבִיאִ֔ים אֲשֶׁ֥ר הָי֖וּ מְיָֽרְאִ֥ים אוֹתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/014.yaml
  text: Remember Tobiah and Sanballat[a], my God, according to these deeds of theirs, and also Noadiah the prophetess and the rest of the prophets who were trying to make me afraid.
translation:
  language: de
  text: Mein Gott, gedenke Tobijas und Sanballats dieser ihrer Taten gemäß, ebenso der Prophetin Noadja und der übrigen Propheten, die mich in Angst versetzen wollten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָכְרָה אֱלֹהַי
  choice: Mein Gott, denke an
  rationale: Die direkte Gebetsanrede und die Bitte um göttliches Erinnern werden natürlich und würdig wiedergegeben; die Voranstellung von »Mein Gott« entspricht idiomatischem Deutsch.
- source_word: לְטוֹבִיָּה וּלְסַנְבַלַּט
  choice: Tobija und Sanballat
  rationale: Die Personennamen werden in ihren geläufigen deutschen biblischen Formen wiedergegeben; לְ kennzeichnet hier die Personen, an die Gott denken soll.
- source_word: כְּמַעֲשָׂיו אֵלֶּה
  choice: wegen dieser ihrer Taten
  rationale: כְּ kann hier die Entsprechung zu ihren Taten ausdrücken. »Wegen dieser ihrer Taten« bewahrt den Bezug auf das Handeln, ohne ausdrücklich ein im Hebräischen nicht genanntes Strafgericht einzufügen. Der formal singularische Suffixbezug wird im Deutschen sinngemäß auf beide genannten Gegner bezogen.
- source_word: וְגַם
  choice: ebenso
  rationale: Das Wort fügt weitere Personen in die Bitte ein; »ebenso« ist im Deutschen knapp und natürlich.
- source_word: לְנוֹעַדְיָה הַנְּבִיאָה
  choice: an die Prophetin Noadja
  rationale: Die feminine Form נְּבִיאָה wird ausdrücklich mit »Prophetin« wiedergegeben; der Name folgt einer geläufigen deutschen Transkription.
- source_word: וּלְיֶתֶר הַנְּבִיאִים
  choice: und an die übrigen Propheten
  rationale: יֶתֶר bezeichnet den verbleibenden Teil der Gruppe; »die übrigen Propheten« ist präzises, gegenwärtiges Standarddeutsch.
- source_word: אֲשֶׁר הָיוּ מְיָרְאִים אוֹתִי
  choice: die mir Angst machen wollten
  rationale: Die Konstruktion aus הָיוּ und Partizip bezeichnet ein andauerndes oder wiederholtes Handeln in der Vergangenheit; die kausative Bedeutung wird als Versuch wiedergegeben, Nehemia in Furcht zu versetzen.
theological_decisions:
- issue: Ton der Bitte um göttliches Erinnern an die Gegner
  choice: Gott wird gebeten, wegen ihrer Taten an die Gegner zu denken, ohne das Ergebnis dieses Erinnerns ausdrücklich als Strafe oder Gericht zu benennen.
  alternative: »Vergilt Tobija und Sanballat diese ihre Taten« oder »Denke zum Gericht an …«
  rationale: Der hebräische Text ist moralisch ernst und hat einen imprekatorischen Unterton, formuliert aber nur die Bitte um Erinnern im Verhältnis zu den Taten. Eine ausdrückliche Vergeltungs- oder Gerichtsformel würde den Text interpretierend erweitern.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die Satzstellung wahrt den Charakter eines kurzen persönlichen Gebets. Keine Fußnote ist nötig, da »Angst machen wollten« die kausative und versuchte Einschüchterung natürlich ausdrückt.
