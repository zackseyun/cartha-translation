base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/007.yaml
  text: And you have even appointed prophets to proclaim concerning you in Jerusalem[a], saying, ‘There is a king in Judah!’ And now these reports will be heard by the king. So now, come[b], and let us consult together.
translation:
  language: de
  text: 'Du hast sogar Propheten eingesetzt, die in Jerusalem über dich ausrufen sollen: »Ein König ist in Juda!«[a] Nun wird der König von diesen Berichten[b] hören. Komm jetzt, und lass uns gemeinsam beraten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapp: »König in Juda«. Der Zusammenhang bezieht den Vorwurf auf Nehemia, doch im zitierten Ausruf selbst wird er nicht ausdrücklich genannt.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »diesen Dingen« beziehungsweise »diesen Worten«. Das hebräische Wort kann Worte, Angelegenheiten oder Berichte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Du hast sogar
  rationale: Das additive וְגַם erhält im anklagenden Zusammenhang durch »sogar« seine emphatische Kraft.
- source_word: נְבִיאִים הֶעֱמַדְתָּ
  choice: Propheten eingesetzt
  rationale: Der Hifil von עמד bezeichnet hier die Zuweisung einer öffentlichen Aufgabe; »eingesetzt« ist dafür eine natürliche und präzise deutsche Wiedergabe.
- source_word: לִקְרֹא עָלֶיךָ
  choice: über dich ausrufen
  rationale: קרא mit על bezeichnet eine öffentliche Verkündigung über jemanden; die Formulierung bewahrt den Bezug auf Nehemia, ohne den Inhalt näher auszudeuten.
- source_word: מֶלֶךְ בִּיהוּדָה
  choice: Ein König ist in Juda!
  rationale: Der hebräische Nominalsatz ist knapp und nennt Nehemia innerhalb des Zitats nicht ausdrücklich. Die Wiedergabe erhält diese Unbestimmtheit und zugleich die politische Brisanz.
- source_word: יִשָּׁמַע לַמֶּלֶךְ כַּדְּבָרִים הָאֵלֶּה
  choice: Nun wird der König von solchen Berichten hören
  rationale: Die idiomatische deutsche Formulierung vermittelt, dass entsprechende Meldungen den persischen König erreichen werden. »Berichte« passt zum politischen Zusammenhang, während eine Fußnote die semantische Breite von דברים festhält.
- source_word: לְכָה וְנִוָּעֲצָה יַחְדָּו
  choice: komm jetzt, und lass uns gemeinsam beraten
  rationale: Der Imperativ und die Kohortativform werden als dringliche Einladung zu gemeinsamer Beratung wiedergegeben.
theological_decisions:
- issue: Art der Beschuldigung eines königlichen Anspruchs
  choice: 'Das angebliche prophetische Wort lautet: »Ein König ist in Juda!«'
  alternative: »Du bist König in Juda!« oder »Nehemia ist König in Juda!«
  rationale: Der hebräische Wortlaut ist ein knapper Nominalsatz und nennt Nehemia im Zitat nicht ausdrücklich. Der Zusammenhang richtet den Vorwurf zwar gegen ihn, doch die Übersetzung fügt seinen Namen oder ein direktes »du« nicht in die zitierten Worte ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt bewusst knapp und politisch zugespitzt. »Gemeinsam beraten« ist gegenwärtig und gut verständlich, ohne den förmlichen Charakter des Schreibens aufzugeben.
