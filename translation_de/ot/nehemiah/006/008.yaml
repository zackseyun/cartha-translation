base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/008.yaml
  text: So I sent to him[a], saying, “These things that you are saying have not happened, for you are inventing them out of your own heart.”
translation:
  language: de
  text: 'Da sandte ich ihm die Antwort: „Diese Dinge, die du behauptest, sind nicht geschehen; denn du erfindest sie aus deinem eigenen Herzen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶשְׁלְחָה אֵלָיו
  choice: Da ließ ich ihm ausrichten
  rationale: Die Wendung bezeichnet die nächste Handlung in der Erzählung. Im Kontext einer durch Boten übermittelten Antwort gibt „ließ ich ihm ausrichten“ den Sinn im natürlichen modernen Deutsch wieder.
- source_word: לֵאמֹר
  choice: '[in „ausrichten“ aufgenommen]'
  rationale: Der hebräische Rede-Einleiter ist in der deutschen Konstruktion „jemandem ausrichten“ bereits enthalten und braucht nicht zusätzlich mit „und sagte“ wiedergegeben zu werden.
- source_word: לֹא נִהְיָה כַּדְּבָרִים הָאֵלֶּה
  choice: Diese Dinge … sind nicht geschehen
  rationale: היה bestreitet hier die Wirklichkeit beziehungsweise das Eintreten der berichteten Vorgänge; „sind nicht geschehen“ bewahrt diese Aussage. דבר wird kontextgemäß allgemein mit „Dinge“ wiedergegeben.
- source_word: אֲשֶׁר אַתָּה אוֹמֵר
  choice: von denen du sprichst
  rationale: Das Partizip אוֹמֵר bezeichnet Sanballats gegenwärtige Behauptungen. Die Formulierung ist natürlich und vermeidet die schwerfällige Wiederholung „die du sagst“.
- source_word: כִּי
  choice: vielmehr
  rationale: Im Zusammenhang führt כִּי nicht nur eine Begründung ein, sondern stellt der behaupteten Wirklichkeit die tatsächliche Herkunft der Vorwürfe entgegen. „Vielmehr“ bildet diesen korrigierenden Zug idiomatisch ab.
- source_word: מִלִּבְּךָ אַתָּה בוֹדָאם
  choice: hast du sie dir selbst ausgedacht
  rationale: בדא bedeutet „erfinden, fabrizieren“. מִלִּבְּךָ bezeichnet die Herkunft aus dem eigenen Inneren beziehungsweise Denken; die reflexive deutsche Wendung gibt dies natürlich wieder, ohne eine zusätzliche Deutung einzuführen.
