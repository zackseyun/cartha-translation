lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Gibt die additive Verknüpfung mit dem vorausgehenden Bericht natürlich und knapp wieder.
- source_word: בַּיָּמִים הָהֵם
  choice: in jenen Tagen
  rationale: Entspricht der üblichen hebräischen Zeitangabe und wahrt den würdigen Erzählstil.
- source_word: מַרְבִּים
  choice: sandten ... viele
  rationale: Im Zusammenhang mit den Briefen bezeichnet das Partizip wiederholtes beziehungsweise umfangreiches Versenden; das deutsche Präteritum fügt sich natürlich in die Erzählung ein.
- source_word: חֹרֵי יְהוּדָה
  choice: die Vornehmen Judas
  rationale: Bezeichnet die gesellschaftlich und politisch einflussreichen Männer Judas; „Vornehme“ gibt diese Stellung wieder, ohne ein bestimmtes Amt vorauszusetzen.
- source_word: אִגְּרֹתֵיהֶם
  choice: viele Briefe
  rationale: Das Nomen bezeichnet schriftliche Korrespondenz. Das hebräische Possessivsuffix wird im Deutschen nicht eigens ausgedrückt, da die Absender bereits genannt sind.
- source_word: הוֹלְכוֹת עַל טוֹבִיָּה
  choice: an Tobija
  rationale: Das wörtliche „gingen zu/auf Tobija“ beschreibt idiomatisch die Zielrichtung der Korrespondenz; „Briefe an Tobija senden“ ist natürliches Deutsch.
- source_word: וַאֲשֶׁר לְטוֹבִיָּה
  choice: Briefe von Tobija
  rationale: Die elliptische Relativkonstruktion meint aufgrund des Parallelismus offenbar die Tobija zugehörigen beziehungsweise von ihm kommenden Briefe; das ergänzte „Briefe“ macht den Bezug verständlich.
- source_word: בָּאוֹת אֲלֵיהֶם
  choice: kamen zu ihnen
  rationale: Bewahrt das Bild der ankommenden Korrespondenz und die wechselseitige Bewegung der beiden Satzhälften.
