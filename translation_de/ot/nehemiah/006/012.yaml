base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/012.yaml
  text: Then I recognized, and behold, God had not sent him; rather, he had spoken the prophecy against me because Tobiah and Sanballat had hired him.
translation:
  language: de
  text: 'Da erkannte ich: Siehe, Gott hatte ihn nicht gesandt; vielmehr hatte er die Prophezeiung gegen mich ausgesprochen, weil Tobija und Sanballat ihn angeheuert hatten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַכִּירָה
  choice: Da erkannte ich
  rationale: Das Verb נכר im Hifil bezeichnet hier das Erkennen bzw. Durchschauen der Lage; „da“ gibt die erzählerische Folge natürlich wieder.
- source_word: וְהִנֵּה
  choice: nicht eigens wiedergegeben
  rationale: Die hebräische Aufmerksamkeitsformel markiert die nun gewonnene Einsicht. Im Deutschen wird diese Funktion bereits durch den Doppelpunkt und den folgenden Feststellungssatz natürlich ausgedrückt; ein wörtliches „siehe“ wäre hier unzeitgemäß.
- source_word: הַנְּבוּאָה
  choice: diese Prophezeiung
  rationale: Der bestimmte Artikel verweist auf die unmittelbar zuvor geäußerte prophetische Warnung; „diese“ stellt den Kontextbezug im Deutschen klar.
- source_word: דִּבֶּר עָלַי
  choice: gegen mich ausgesprochen
  rationale: דבר על kann kontextabhängig „über“ oder „gegen“ jemanden reden bedeuten. Da die angebliche Prophezeiung Nehemia einschüchtern und kompromittieren sollte, ist die adversative Bedeutung hier sachgerecht.
- source_word: שְׂכָרוֹ
  choice: ihn angeheuert hatten
  rationale: שׂכר bedeutet hier, jemanden gegen Bezahlung in Dienst zu nehmen; „angeheuert“ ist präzise und idiomatisch.
theological_decisions:
- issue: Ursprung der prophetischen Botschaft
  choice: Gott hatte ihn nicht gesandt
  alternative: Er war nicht von Gott gesandt
  rationale: Die aktive Form folgt dem hebräischen Text und bewahrt Nehemias Aussage, dass Schemajas Sendung nicht von Gott ausging.
- issue: Verhältnis der beiden Begründungssätze
  choice: „Vielmehr“ kennzeichnet den Gegensatz zwischen göttlicher Sendung und gekaufter Prophezeiung
  alternative: bloßes „sondern/denn“
  rationale: 'Das erste כִּי ist adversativ-erklärend: Nicht Gott hatte ihn gesandt; stattdessen sprach er die Botschaft, weil Tobija und Sanballat ihn bezahlt hatten. Diese Logik wird deutlich, ohne zusätzliche Deutung einzutragen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau ist klar und erzählerisch; „Prophezeiung“ wahrt den Bezug auf den beanspruchten prophetischen Ausspruch, ohne dessen Echtheit zu bestätigen.
