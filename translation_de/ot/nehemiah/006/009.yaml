source:
  edition: WLC
  text: כִּ֣י כֻלָּ֗/ם מְיָֽרְאִ֤ים אוֹתָ֨/נוּ֙ לֵ/אמֹ֔ר יִרְפּ֧וּ יְדֵי/הֶ֛ם מִן הַ/מְּלָאכָ֖ה וְ/לֹ֣א תֵעָשֶׂ֑ה וְ/עַתָּ֖ה חַזֵּ֥ק אֶת יָדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/009.yaml
  text: For all of them were trying to frighten us[a], saying, “Their hands will grow weak from the work, and it will not be done.” But now[b], strengthen my hands.
translation:
  language: de
  text: 'Denn sie alle versuchten, uns einzuschüchtern, indem sie sagten: »Ihre Hände werden bei der Arbeit erschlaffen[a], und sie wird nicht vollendet werden.« Doch nun[b], stärke meine Hände!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich ist vom Erschlaffen der Hände die Rede. Gemeint ist, dass die Arbeiter ihre Kraft oder Entschlossenheit verlieren und die Arbeit aufgeben.
    reason: lexical_alternative
  - marker: b
    text: Der Schlusssatz ist nach der hebräischen Vokalisierung eine kurze, unmittelbar an Gott gerichtete Bitte. Bei anderer Vokalisierung wurde er vereinzelt anders verstanden.
    reason: alternative_reading
lexical_decisions:
- source_word: מְיָרְאִים אוֹתָנוּ
  choice: versuchten, uns einzuschüchtern
  rationale: Die Hifil-Form bezeichnet das Verängstigen oder Einschüchtern; das Partizip beschreibt hier ein fortgesetztes, zielgerichtetes Vorgehen. Das plurale אוֹתָנוּ wird entsprechend mit »uns« wiedergegeben.
- source_word: לֵאמֹר
  choice: indem sie sagten
  rationale: Die übliche Einleitungsformel für den folgenden Inhalt wird beibehalten, ohne festzulegen, ob die Worte offen ausgesprochen wurden oder ihre erklärte Absicht wiedergeben.
- source_word: יִרְפּוּ יְדֵיהֶם
  choice: ihre Hände werden bei der Arbeit erschlaffen
  rationale: Die hebräische Wendung bewahrt das Bild erschlaffender Hände und bezeichnet den Verlust von Kraft, Mut oder Entschlossenheit zur Weiterarbeit.
- source_word: מִן הַמְּלָאכָה
  choice: bei der Arbeit
  rationale: מְלָאכָה bezeichnet hier das Bauvorhaben. Im Deutschen verbindet »bei der Arbeit erschlaffen« das Idiom natürlich mit seinem konkreten Bezug.
- source_word: וְלֹא תֵעָשֶׂה
  choice: und sie wird nicht vollendet werden
  rationale: Das feminine Pronomen bezieht sich sinngemäß auf die Arbeit beziehungsweise das Bauvorhaben. »Vollendet werden« gibt im Kontext das Nichtzustandekommen des Werkes natürlicher wieder als ein wörtliches »getan werden«.
- source_word: וְעַתָּה
  choice: Doch nun
  rationale: Die Wendung markiert den Übergang von der Absicht der Gegner zu Nehemias knapper Bitte; »doch« macht diesen Gegensatz im Deutschen deutlich.
- source_word: חַזֵּק אֶת יָדָי
  choice: stärke meine Hände
  rationale: Der Imperativ wird als unmittelbare Bitte wiedergegeben. Das Bild der Hände bleibt erhalten und greift bewusst die zuvor erwähnten erschlaffenden Hände auf.
theological_decisions:
- issue: Übergang vom Bericht zum unmittelbaren Gebet
  choice: 'Der Schlusssatz wird als direkte Bitte Nehemias an Gott übersetzt: »Doch nun, stärke meine Hände!«'
  alternative: 'Selbstaufforderung oder Aussage: »Nun aber stärkte ich meine Hände.«'
  rationale: Die masoretische Vokalisierung weist חַזֵּק als Imperativ der 2. Person Singular aus. Daher liegt ein kurzes, in den Bericht eingeschobenes Gebet nahe, wie es auch sonst im Nehemia-Buch begegnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Bildsprache der erschlaffenden beziehungsweise gestärkten Hände bleibt erhalten; zugleich wird der Satzbau für heutige Leser klar und natürlich gestaltet.
