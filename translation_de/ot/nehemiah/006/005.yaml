- from: Da schickte Sanballat zum fünften Mal auf dieselbe Weise seinen Diener zu mir; dieser hatte einen offenen Brief[a] in der Hand.
  to: Da schickte Sanballat zum fünften Mal auf dieselbe Weise seinen Diener zu mir; dieser hatte einen unversiegelten Brief[a] in der Hand.
  rationale: Die Übersetzung wird nur bei der Bezeichnung des Briefes angepasst. Dadurch wird ein anachronistisches Missverständnis von „offener Brief“ als öffentlicher Briefgattung vermieden, während die wörtliche Formulierung des Hebräischen in der Fußnote erhalten bleibt. Satzstruktur, Rückbezug und Zuordnung des Briefes zum Diener bleiben bestehen.
