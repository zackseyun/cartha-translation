  text: Then Sanballat sent his servant to me a fifth time in this manner[a], with an open letter in his hand.
translation:
  language: de
  text: Da schickte Sanballat zum fünften Mal auf dieselbe Weise seinen Diener zu mir; dieser hatte einen unversiegelten Brief[a] in der Hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: einen offenen Brief.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da schickte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da“ gibt die zeitliche und erzählerische Folge im Deutschen natürlich wieder.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit Suffix bezeichnet hier die Richtung beziehungsweise den Empfänger des Boten.
- source_word: סַנְבַלַּט
  choice: Sanballat
  rationale: Der Personenname wird in der im Deutschen etablierten Form wiedergegeben.
- source_word: כַּדָּבָר הַזֶּה
  choice: auf dieselbe Weise
  rationale: Die Wendung verweist auf das zuvor geschilderte, wiederholte Vorgehen; „auf dieselbe Weise“ macht diesen Rückbezug natürlich verständlich.
- source_word: פַּעַם חֲמִישִׁית
  choice: zum fünften Mal
  rationale: Die hebräische Wendung zählt die Wiederholung; im Deutschen ist „zum fünften Mal“ idiomatisch.
- source_word: אֶת נַעֲרוֹ
  choice: seinen Diener
  rationale: נַעַר kann einen jungen Mann bezeichnen, meint in diesem Botenkontext aber am ehesten einen Diener oder Bediensteten.
- source_word: וְאִגֶּרֶת פְּתוּחָה
  choice: einen offenen Brief
  rationale: Die Konstruktion beschreibt, was der Diener bei sich trug. „Offener Brief“ bewahrt die Grundbedeutung, kann im heutigen Deutschen jedoch missverstanden werden; deshalb erläutert die Fußnote die kontextuelle Bedeutung.
- source_word: בְּיָדוֹ
  choice: in der Hand
  rationale: Die konkrete Bildsprache des Hebräischen wird direkt bewahrt.
