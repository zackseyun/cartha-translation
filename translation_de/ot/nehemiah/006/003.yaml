source:
  edition: WLC
  text: וָ/אֶשְׁלְחָ֨/ה עֲלֵי/הֶ֤ם מַלְאָכִים֙ לֵ/אמֹ֔ר מְלָאכָ֤ה גְדוֹלָה֙ אֲנִ֣י עֹשֶׂ֔ה וְ/לֹ֥א אוּכַ֖ל לָ/רֶ֑דֶת לָ֣/מָּה תִשְׁבַּ֤ת הַ/מְּלָאכָה֙ כַּ/אֲשֶׁ֣ר אַרְפֶּ֔/הָ וְ/יָרַדְתִּ֖י אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/003.yaml
  text: So I sent messengers to them[a], saying, “I am doing a great work, and I cannot come down. Why should the work stop while I leave it and come down to you?”
translation:
  language: de
  text: 'Da schickte ich Boten zu ihnen und ließ ihnen sagen: „Ich führe ein großes Werk aus und kann nicht hinabkommen. Warum sollte die Arbeit zum Stillstand kommen, wenn ich sie liegen lasse und zu euch hinabkomme?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶשְׁלְחָה עֲלֵיהֶם
  choice: Da schickte ich … zu ihnen
  rationale: Das Wayyiqtol führt die Erzählung fort; „da“ gibt diese Folge im Deutschen natürlich wieder. עַל bezeichnet mit שׁלח hier die Richtung zu den Empfängern, nicht eine feindliche Handlung gegen sie.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im politischen Erzählzusammenhang sind menschliche Überbringer einer Nachricht gemeint, nicht himmlische Wesen.
- source_word: לֵאמֹר
  choice: und ließ ihnen sagen
  rationale: Der hebräische Redeintroduktor wird idiomatisch wiedergegeben und macht deutlich, dass die Boten Nehemias Worte übermitteln.
- source_word: מְלָאכָה גְדוֹלָה אֲנִי עֹשֶׂה
  choice: Ich führe ein großes Werk aus
  rationale: „Großes Werk“ bewahrt die Bedeutung und das Gewicht von מְלָאכָה גְדוֹלָה; die deutsche Verlaufsbedeutung des Partizips wird durch den Zusammenhang und „ausführen“ hinreichend ausgedrückt.
- source_word: וְלֹא אוּכַל לָרֶדֶת
  choice: und kann nicht hinabkommen
  rationale: ירד bezeichnet die räumliche Bewegung von Jerusalem hinab. „Hinabkommen“ ist in der an die Empfänger gerichteten Rede natürlich und erhält das Bewegungsbild.
- source_word: לָמָּה תִשְׁבַּת הַמְּלָאכָה
  choice: Warum sollte die Arbeit zum Stillstand kommen
  rationale: שׁבת bedeutet hier „aufhören, ruhen“. Die Formulierung gibt die rhetorische Frage in natürlichem Deutsch wieder, ohne einen Bezug zum Sabbat einzutragen.
- source_word: כַּאֲשֶׁר אַרְפֶּהָ
  choice: wenn ich sie liegen lasse
  rationale: Das Suffix von אַרְפֶּהָ bezieht sich auf die Arbeit. Das Hifil von רפה bezeichnet hier das Loslassen beziehungsweise Ruhenlassen der Aufgabe; „liegen lassen“ ist idiomatisch und bewahrt diesen Sinn.
- source_word: וְיָרַדְתִּי אֲלֵיכֶם
  choice: und zu euch hinabkomme
  rationale: Die Wiederholung von ירד und die Abwärtsbewegung von Jerusalem werden beibehalten; „zu euch“ entspricht אֲלֵיכֶם.
theological_decisions: []
