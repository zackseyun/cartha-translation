id: NEH.6.1
reference: Nehemiah 6:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר נִשְׁמַ֣ע לְ/סַנְבַלַּ֣ט וְ֠/טוֹבִיָּה וּ/לְ/גֶ֨שֶׁם הָֽ/עַרְבִ֜י וּ/לְ/יֶ֣תֶר אֹֽיְבֵ֗י/נוּ כִּ֤י בָנִ֨יתִי֙ אֶת הַ֣/חוֹמָ֔ה וְ/לֹא נ֥וֹתַר בָּ֖/הּ פָּ֑רֶץ גַּ֚ם עַד הָ/עֵ֣ת הַ/הִ֔יא דְּלָת֖וֹת לֹא הֶעֱמַ֥דְתִּי בַ/שְּׁעָרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/001.yaml
  text: When Sanballat[a], Tobiah, Geshem the Arab[b], and the rest of our enemies heard that I had rebuilt the wall and that no breach was left in it—though up to that time I had not set up the doors in the gates—
translation:
  language: de
  text: Als Sanballat, Tobija, Geschem, der Araber, und unsere übrigen Feinde hörten, dass ich die Mauer wieder aufgebaut[a] hatte und keine Bresche darin geblieben war – obwohl ich bis zu diesem Zeitpunkt die Türen noch nicht in die Tore eingesetzt hatte –,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: gebaut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: Als
  rationale: Leitet eine neue erzählerische Entwicklung mit einem Temporalsatz ein; ein zusätzliches »Und es geschah« wäre im modernen Deutschen unnötig schwerfällig.
- source_word: נִשְׁמַע לְסַנְבַלַּט ...
  choice: Sanballat ... hörten
  rationale: Die hebräische Passivkonstruktion wird idiomatisch mit den genannten Empfängern als Subjekt wiedergegeben.
- source_word: גֶשֶׁם הָעַרְבִי
  choice: Geschem, der Araber
  rationale: הָעַרְבִי ist eine ethnische Bezeichnung; die Apposition wird im Deutschen natürlich mit Artikel wiedergegeben.
- source_word: יֶתֶר אֹיְבֵינוּ
  choice: unsere übrigen Feinde
  rationale: Gibt sowohl den Restbegriff von יֶתֶר als auch die Zugehörigkeit von אֹיְבֵינוּ knapp und natürlich wieder.
- source_word: בָנִיתִי אֶת־הַחוֹמָה
  choice: ich die Mauer wieder aufgebaut hatte
  rationale: Das Verb bedeutet wörtlich »bauen«; im Zusammenhang wird jedoch die vorhandene Jerusalemer Mauer wiederhergestellt. Die Fußnote bewahrt die lexikalische Alternative.
- source_word: לֹא נוֹתַר בָּהּ פָּרֶץ
  choice: keine Bresche darin geblieben war
  rationale: פָּרֶץ bezeichnet im Kontext einer Mauer eine Bresche oder Lücke; »Bresche« ist präzise und würdevoll.
- source_word: גַּם עַד הָעֵת הַהִיא
  choice: obwohl ... bis zu diesem Zeitpunkt ... noch nicht
  rationale: Der Zusammenhang verlangt eine einschränkende bzw. konzessive Nebenbemerkung. »Noch nicht« bildet den zeitlichen Fortbestand idiomatisch ab.
- source_word: דְּלָתוֹת לֹא הֶעֱמַדְתִּי בַשְּׁעָרִים
  choice: die Türen noch nicht in die Tore eingesetzt hatte
  rationale: Unterscheidet die Türflügel von den Toranlagen und gibt das Aufstellen bzw. Einsetzen ohne unnötige technische Festlegung wieder.
theological_decisions: []
