  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Vers bleibt wie im Hebräischen syntaktisch offen und führt in Vers 2 weiter. Gedankenstriche markieren die eingeschobene Einschränkung, ohne sie zu einem selbstständigen Satz zu machen.
