  source_fidelity: 'Der Entwurf gibt die hebräische Satzstruktur und den Inhalt zuverlässig wieder: Die genannten Gegner hören vom Wiederaufbau der Mauer, davon, dass keine Bresche verblieben ist, und von der noch ausstehenden Anbringung der Türen. Die konzessive Einschaltung zu den Türen ist kontextgerecht. „Wieder aufgebaut“ ist im Kontext vertretbar und durch die Fußnote transparent als interpretierende Kontextualisierung des einfachen „gebaut“ ausgewiesen.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen erzählerischem Ton. Die Apposition „Geschem, der Araber,“ ist grammatisch korrekt. Der abschließende Gedankenstrich mit Komma bewahrt sinnvoll, dass der mit „Als“ eröffnete Satz im folgenden Vers fortgesetzt wird.
  terminology: Die Namensformen Sanballat, Tobija und Geschem sind im Deutschen geläufig. „Araber“, „Mauer“, „Bresche“, „Türen“ und „Tore“ treffen die jeweiligen hebräischen Ausdrücke präzise; besonders die Unterscheidung zwischen Türen und Toren bleibt erhalten.
