  text: וָ/אֹמְרָ֗/ה הַ/אִ֤ישׁ כָּמ֨וֹ/נִי֙ יִבְרָ֔ח וּ/מִ֥י כָמ֛וֹ/נִי אֲשֶׁר יָב֥וֹא אֶל הַ/הֵיכָ֖ל וָ/חָ֑י לֹ֖א אָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/011.yaml
  text: But I said[a], “Should a man like me flee? And who is like me, who could go into the temple and live? I will not go in.”
translation:
  language: de
  text: 'Doch ich sagte: »Sollte ein Mann wie ich fliehen? Und wer wie ich könnte in den Tempel[a] hineingehen und am Leben bleiben? Ich gehe nicht hinein!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in das Heiligtum«. Gemeint ist wahrscheinlich nicht nur ein Versteck im Tempelgebäude, sondern das Betreten eines Nehemia nicht erlaubten Tempelbereichs. Das erklärt die Worte »am Leben bleiben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Doch ich sagte
  rationale: Das Waw führt die Erzählung fort; im Zusammenhang weist Nehemia den zuvor gemachten Vorschlag entschieden zurück, weshalb »Doch« den adversativen Sinn natürlich wiedergibt.
- source_word: הָאִישׁ כָּמוֹנִי
  choice: ein Mann wie ich
  rationale: Die Wendung ist generisch und rhetorisch. Sie bewahrt Nehemias Bezug auf seine Stellung und Verantwortung, ohne daraus bloße Selbstüberhebung zu machen.
- source_word: יִבְרָח
  choice: fliehen
  rationale: Das Verb bezeichnet die Flucht aus Furcht oder vor Gefahr. »Fliehen« erhält die moralische Schärfe der rhetorischen Frage.
- source_word: וּמִי כָמוֹנִי אֲשֶׁר יָבוֹא
  choice: Und wer wie ich könnte … hineingehen
  rationale: Der hebräische Relativsatz ist knapp und mehrdeutig. Die modale Formulierung gibt die ungläubig-abweisende rhetorische Frage in natürlichem Deutsch wieder.
- source_word: הַהֵיכָל
  choice: der Tempel
  rationale: הֵיכָל bezeichnet hier das Tempelgebäude beziehungsweise den inneren Heiligtumsbereich. »Tempel« ist im Haupttext verständlich; die mögliche engere Bedeutung wird in der Fußnote erläutert.
- source_word: וָחָי
  choice: und am Leben bleiben
  rationale: Die Form kann das Weiterleben beziehungsweise Überleben ausdrücken. Die Wiedergabe erhält den Zusammenhang zwischen unerlaubtem Betreten und drohender Todesfolge, ohne ihn näher festzulegen.
- source_word: לֹא אָבוֹא
  choice: Ich gehe nicht hinein
  rationale: Die entschiedene präsentische Formulierung klingt im Deutschen natürlich und nimmt den Gedanken des Betretens aus dem vorherigen Satz wieder auf.
theological_decisions:
- issue: Bedeutung des Betretens des Tempels
  choice: Nehemias Weigerung wird als Ablehnung eines möglicherweise unrechtmäßigen Betretens des Tempel- beziehungsweise Heiligtumsbereichs wiedergegeben.
  alternative: Nehemia lehnt lediglich ein taktisches Versteck im Tempel ab, ohne dass kultische Beschränkungen gemeint sind.
  rationale: Nach Nehemia 6,10–13 sollte der Vorschlag Nehemia offenbar zur Sünde verleiten und ihn in Verruf bringen. Der Haupttext lässt den genauen Bereich offen; die Fußnote nennt die wahrscheinliche kultische Tragweite, ohne sie als einzig mögliche Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen rhetorischen Fragen und Nehemias entschlossene Schlussaussage bleiben erhalten; die syntaktische Ellipse des Hebräischen wird lesbar, aber ohne dogmatische Vereindeutigung wiedergegeben.
