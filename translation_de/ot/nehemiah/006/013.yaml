base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/013.yaml
  text: 'He was hired for this purpose: that I should become afraid and act that way and sin[a], so that they would have grounds for an evil report[b], in order that they might reproach me.'
translation:
  language: de
  text: 'Dafür war er angeheuert worden: damit ich Angst bekäme, so handelte und sündigte[a], sodass sie Anlass hätten, mich in Verruf zu bringen[b] und mich zu verhöhnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dafür war er bezahlt worden“ beziehungsweise „Dafür war er bestochen worden“. Das hebräische Wort bedeutet unmittelbar „angeheuert“ oder „bezahlt“; „bestochen“ hebt die unlautere Absicht stärker hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und es wäre ihnen zu einem bösen Namen“. Gemeint ist wahrscheinlich, dass Nehemias Sünde seinen Gegnern Anlass gegeben hätte, seinen Ruf zu schädigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שָׂכוּר הוּא
  choice: Dazu war er angeheuert worden
  rationale: Die Konstruktion bezeichnet den Zweck seiner Beauftragung. „Angeheuert“ gibt den gewöhnlichen Sinn des passiven Partizips wieder und lässt die unlautere Absicht aus dem Zusammenhang hervorgehen.
- source_word: אִירָא
  choice: Ich sollte mich fürchten
  rationale: Das Imperfekt nach לְמַעַן bezeichnet die beabsichtigte Wirkung auf Nehemia.
- source_word: וְאֶעֱשֶׂה כֵן וְחָטָאתִי
  choice: so handeln und sündigen
  rationale: „So handeln“ nimmt den im Kontext vorgeschlagenen Schritt auf; „und sündigen“ bewahrt die ausdrückliche moralisch-theologische Wertung des hebräischen Textes.
- source_word: וְהָיָה לָהֶם לְשֵׁם רָע
  choice: Dann hätten sie etwas gehabt, um mich in Verruf zu bringen
  rationale: Die wörtlich schwierige Wendung „es wäre ihnen zu einem bösen Namen“ meint im Zusammenhang offenbar, dass Nehemias Verfehlung seinen Gegnern Material für eine Rufschädigung geliefert hätte.
- source_word: יְחָרְפוּנִי
  choice: mich zu verhöhnen
  rationale: חרף bezeichnet feindseliges Schmähen, Höhnen oder Beschimpfen. „Verhöhnen“ ist gegenwärtiges, verständliches Deutsch und wahrt die öffentliche Beschämung.
theological_decisions:
- issue: Art der beabsichtigten Sünde
  choice: Die Sünde wird nicht näher bestimmt.
  alternative: Die Handlung ausdrücklich als Entweihung des Tempels oder Übertretung des Gesetzes benennen.
  rationale: Der Vers selbst nennt nur das Sündigen; die genauere Einordnung ergibt sich aus dem unmittelbaren Kontext und sollte nicht in diesen Vers hineingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Zweckfolge des hebräischen לְמַעַן wird durch „Dazu“, „sollte“ und „um … zu“ natürlich wiedergegeben. Die idiomatische Wendung mit שֵׁם רָע wird im Haupttext verständlich erschlossen, während die Fußnote den wörtlichen Ausdruck und seine verbleibende Deutungsbreite dokumentiert.
