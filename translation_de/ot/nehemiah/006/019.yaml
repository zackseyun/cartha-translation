id: NEH.6.19
reference: Nehemiah 6:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: גַּ֣ם טוֹבֹתָ֗י/ו הָי֤וּ אֹמְרִים֙ לְ/פָנַ֔/י וּ/דְבָרַ֕/י הָי֥וּ מוֹצִיאִ֖ים ל֑/וֹ אִגְּר֛וֹת שָׁלַ֥ח טוֹבִיָּ֖ה לְ/יָֽרְאֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/019.yaml
  text: Also they kept speaking of his good deeds in my presence[a], and they kept reporting my words to him[b]. Tobiah sent letters to frighten me.
translation:
  language: de
  text: Auch redeten sie vor mir immer wieder von seinen guten Seiten[a] und berichteten ihm, was ich sagte[b]. Tobija sandte Briefe, um mir Angst zu machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »von seinen guten Taten« oder »von dem Guten an ihm«. Der hebräische Ausdruck ist weiter gefasst als Taten allein; hier bezeichnet er die lobende Darstellung Tobijas vor Nehemia.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Sie brachten meine Worte zu ihm hinaus«; gemeint ist, dass sie Nehemias Äußerungen an Tobija weitergaben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Bewahrt die additive Funktion im abschließenden Teil der Erzählung.
- source_word: טוֹבֹתָיו
  choice: seine guten Seiten
  rationale: Das substantivierte Pluraladjektiv bezeichnet allgemein das Gute an Tobija und kann sowohl Eigenschaften als auch Taten umfassen; die Formulierung passt zur lobenden Darstellung vor Nehemia.
- source_word: הָיוּ אֹמְרִים
  choice: redeten ... immer wieder
  rationale: Die Verbindung von היה mit Partizip bezeichnet eine fortdauernde oder wiederholte Handlung in der Vergangenheit.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Nahe und zugleich natürliche Wiedergabe der räumlich beziehungsweise persönlich verstandenen Wendung.
- source_word: וּדְבָרַי
  choice: was ich sagte
  rationale: Gibt דברי im Kontext weitergeleiteter Äußerungen idiomatisch wieder, ohne den Bezug auf Nehemias Worte zu verlieren.
- source_word: הָיוּ מוֹצִיאִים לוֹ
  choice: berichteten ihm
  rationale: Das wörtliche »zu ihm hinausbringen« bezeichnet hier das Weitertragen beziehungsweise Übermitteln von Informationen.
- source_word: אִגְּרוֹת
  choice: Briefe
  rationale: Natürliche moderne Entsprechung für schriftliche Mitteilungen.
- source_word: שָׁלַח
  choice: sandte
  rationale: Schlichte und dem würdigen Erzählregister entsprechende Wiedergabe des Verbs.
- source_word: לְיָרְאֵנִי
  choice: um mir Angst zu machen
  rationale: 'Drückt den mit ל markierten Zweck aus: Die Briefe sollten Nehemia in Furcht versetzen.'
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholte beziehungsweise fortdauernde Handlung wird durch »immer wieder« ausgedrückt; die breite Bedeutung von טוֹבֹתָיו bleibt durch »gute Seiten« samt Fußnote erhalten.
