base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/016.yaml
  text: And it happened that when all our enemies heard[a], and all the nations around us saw, they fell greatly in their own eyes, and they knew that this work had been done by our God.
translation:
  language: de
  text: 'Und es geschah: Als alle unsere Feinde davon hörten und alle Völker rings um uns es sahen, sanken sie in ihren eigenen Augen sehr tief[a]. Und sie erkannten, dass dieses Werk von unserem Gott vollbracht worden war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Sie verloren sehr an Selbstvertrauen“ oder „sie waren in ihren eigenen Augen sehr niedergeschlagen“. Das Hebräische bewahrt das Bild, dass sie in ihrer eigenen Einschätzung tief sanken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Bewahrt die hebräische Erzählformel in würdiger, verständlicher Sprache, ohne das altertümlichere „es begab sich“ zu verwenden.
- source_word: שָׁמְעוּ
  choice: davon hörten
  rationale: 'Das im Hebräischen unausgesprochene Objekt ergibt sich aus dem Zusammenhang: Die Feinde hörten von der Vollendung der Mauer. Das deutsche „davon“ macht den Satz natürlich, ohne den Bezug weiter auszudeuten.'
- source_word: כָּל הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: alle Völker rings um uns
  rationale: גּוֹיִם bezeichnet hier die umliegenden Völker; „Völker“ vermeidet eine spätere religiöse Engführung durch „Heiden“.
- source_word: וַיִּפְּלוּ מְאֹד בְּעֵינֵיהֶם
  choice: sanken sie in ihren eigenen Augen tief
  rationale: Die Wiedergabe erhält das auffällige hebräische Bild des Fallens in der eigenen Einschätzung. Eine Fußnote erläutert den wahrscheinlichen idiomatischen Sinn.
- source_word: וַיֵּדְעוּ
  choice: Sie erkannten
  rationale: „Erkannten“ gibt hier natürlich wieder, dass die Gegner aufgrund des Geschehenen zu einer Einsicht gelangten.
- source_word: מֵאֵת אֱלֹהֵינוּ נֶעֶשְׂתָה
  choice: durch unseren Gott zustande gekommen war
  rationale: Diese Formulierung gibt die göttliche Herkunft beziehungsweise entscheidende Urheberschaft wieder und bleibt im Deutschen natürlicher als eine wörtliche Konstruktion mit „von ... her“.
- source_word: הַמְּלָאכָה הַזֹּאת
  choice: dieses Werk
  rationale: „Werk“ bezeichnet das vollendete Bauvorhaben umfassend und entspricht der Breite des hebräischen Ausdrucks.
theological_decisions:
- issue: Göttliche Urheberschaft bei der Vollendung des Werkes
  choice: durch unseren Gott zustande gekommen war
  alternative: von unserem Gott her vollbracht worden war
  rationale: מֵאֵת kann Herkunft oder Urheberschaft ausdrücken. Die gewählte Formulierung schreibt den Erfolg entscheidend Gott zu, ohne einen bestimmten wunderhaften Ablauf zu behaupten oder die menschliche Arbeit auszublenden.
translation_notes:
  register: Moderne, würdige Standardsprache. Die einleitende Erzählformel und das ungewöhnliche Bild des Sinkens bleiben erhalten; kleinere Ergänzungen wie „davon“ und „es“ sorgen für einen natürlichen deutschen Satzfluss.
