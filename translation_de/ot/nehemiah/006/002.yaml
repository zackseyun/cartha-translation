  text: וַ/יִּשְׁלַ֨ח סַנְבַלַּ֤ט וְ/גֶ֨שֶׁם֙ אֵלַ֣/י לֵ/אמֹ֔ר לְכָ֞/ה וְ/נִֽוָּעֲדָ֥ה יַחְדָּ֛ו בַּ/כְּפִירִ֖ים בְּ/בִקְעַ֣ת אוֹנ֑וֹ וְ/הֵ֨מָּה֙ חֹֽשְׁבִ֔ים לַ/עֲשׂ֥וֹת לִ֖/י רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/002.yaml
  text: So Sanballat and Geshem sent to me[a], saying, “Come[b], and let us meet together in the villages in the plain of Ono.” But they were planning to do me harm.
translation:
  language: de
  text: 'Da ließen Sanballat und Geschem mir ausrichten: „Komm, wir wollen uns gemeinsam in den Dörfern[a] in der Ebene von Ono[b] treffen.“ Sie aber planten, mir etwas Böses anzutun.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „in Kefirim“, wenn das hebräische Wort als Ortsname und nicht als „Dörfer“ verstanden wird.'
    reason: alternative_reading
  - marker: b
    text: „Ebene“ kann auch mit „Tal“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח סַנְבַלַּט וְגֶשֶׁם אֵלַי לֵאמֹר
  choice: Da ließen Sanballat und Geschem mir ausrichten
  rationale: Die singularische Verbform bei zusammengesetztem Subjekt ist im Hebräischen idiomatisch. „Ausrichten lassen“ gibt das Senden einer mündlichen oder schriftlichen Botschaft samt לֵאמֹר natürlich wieder, ohne einen Boten oder Brief ausdrücklich hinzuzufügen.
- source_word: לְכָה
  choice: Komm
  rationale: Der Imperativ des Verbs „gehen“ dient hier als Einladungsformel und wird im Deutschen idiomatisch mit „Komm“ wiedergegeben.
- source_word: וְנִוָּעֲדָה יַחְדָּו
  choice: wir wollen uns gemeinsam … treffen
  rationale: Der Niphal von יעד bezeichnet hier ein verabredetes Zusammentreffen; „gemeinsam“ bildet יַחְדָּו ausdrücklich ab.
- source_word: בַּכְּפִירִים
  choice: in den Dörfern
  rationale: Die Form wird im Haupttext als Gattungsbezeichnung für kleinere Ortschaften verstanden. Da auch die Deutung als Ortsname möglich ist, wird diese in einer Fußnote bewahrt.
- source_word: בְּבִקְעַת אוֹנוֹ
  choice: in der Ebene von Ono
  rationale: בִּקְעָה bezeichnet eine breite Talebene. „Ebene“ ist hier topografisch passend und allgemein verständlich; „Tal“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- source_word: וְהֵמָּה חֹשְׁבִים
  choice: Sie aber planten
  rationale: Der deutsche adversative Anschluss legt den Gegensatz zwischen der Einladung und der verborgenen Absicht offen. חֹשְׁבִים bezeichnet in diesem Zusammenhang ein Planen oder Beabsichtigen.
- source_word: לַעֲשׂוֹת לִי רָעָה
  choice: mir etwas Böses anzutun
  rationale: Die Formulierung bewahrt die ethische Färbung von רָעָה und lässt zugleich offen, welche konkrete Schädigung beabsichtigt war.
