  text: וַ/אֲנִי בָ֗אתִי בֵּ֣ית שְֽׁמַֽעְיָ֧ה בֶן דְּלָיָ֛ה בֶּן מְהֵֽיטַבְאֵ֖ל וְ/ה֣וּא עָצ֑וּר וַ/יֹּ֡אמֶר נִוָּעֵד֩ אֶל בֵּ֨ית הָ/אֱלֹהִ֜ים אֶל תּ֣וֹךְ הַֽ/הֵיכָ֗ל וְ/נִסְגְּרָה֙ דַּלְת֣וֹת הַ/הֵיכָ֔ל כִּ֚י בָּאִ֣ים לְ/הָרְגֶ֔/ךָ וְ/לַ֖יְלָה בָּאִ֥ים לְ/הָרְגֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/010.yaml
  text: Then I went to the house of Shemaiah son of Delaiah[a], son of Mehetabel, who was confined, and he said, “Let us meet at the house of God, inside the temple, and let us shut the doors of the temple, for they are coming to kill you—yes, at night they are coming to kill you.”
translation:
  language: de
  text: 'Dann ging ich in das Haus Schemajas, des Sohnes Delajas, des Sohnes Mehetabels. Er war eingeschlossen. Er sagte: »Lass uns im Haus Gottes zusammenkommen, im Inneren des Tempels[a], und die Türen des Tempels schließen! Denn sie kommen, um dich zu töten; in der Nacht kommen sie, um dich zu töten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Heiligtum«. Das hebräische Wort kann hier speziell das eigentliche Tempelgebäude beziehungsweise den heiligen Innenbereich bezeichnen, nicht nur den gesamten Tempelbezirk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי בָאתִי
  choice: Dann ging ich
  rationale: Die Verbindung aus Konjunktion, betontem Pronomen und Verb führt die Erzählung fort und hebt Nehemia leicht hervor. בוא wird aus seiner Erzählperspektive idiomatisch mit »ging« wiedergegeben.
- source_word: בֵּית שְׁמַעְיָה
  choice: in das Haus Schemajas
  rationale: בֵּית mit Personenname bezeichnet hier die Wohnung beziehungsweise das Haus der Person. Die traditionelle deutsche Namensform »Schemaja« bleibt erkennbar.
- source_word: וְהוּא עָצוּר
  choice: Er hielt sich dort eingeschlossen
  rationale: עָצוּר bezeichnet einen Zustand des Eingeschlossenseins oder der Absonderung, ohne dessen Ursache eindeutig zu benennen. Die Formulierung vermeidet eine Festlegung auf Haft, Krankheit oder kultische Absonderung.
- source_word: נִוָּעֵד
  choice: Lass uns ... zusammenkommen
  rationale: Die Form drückt einen Vorschlag zum gemeinsamen Treffen aus. »Zusammenkommen« ist natürlich und bewahrt den auffordernden Sinn.
- source_word: בֵּית הָאֱלֹהִים
  choice: Haus Gottes
  rationale: Die formnahe Wiedergabe erhält die übliche hebräische Bezeichnung für den Tempelkomplex und unterscheidet sie vom anschließenden spezifischeren הֵיכָל.
- source_word: אֶל תּוֹךְ הַהֵיכָל
  choice: im Inneren des Tempels
  rationale: Die Wendung bezeichnet den Innenraum des eigentlichen Tempelgebäudes. »Im Inneren des Tempels« vermittelt das Betreten des heiligen Gebäudes, ohne einen bestimmten kultischen Teilbereich festzulegen.
- source_word: וְנִסְגְּרָה דַּלְתוֹת הַהֵיכָל
  choice: und die Türen des Tempels schließen
  rationale: Der fortgesetzte Aufforderungssinn wird im Deutschen durch die gemeinsame Konstruktion mit »Lass uns« ausgedrückt; das konkrete Bild der Türen bleibt erhalten.
- source_word: כִּי בָּאִים לְהָרְגֶךָ
  choice: Denn sie kommen, um dich zu töten
  rationale: Das pluralische Partizip hat ein unbestimmtes Subjekt, das im Deutschen natürlich mit »sie« wiedergegeben wird. Der Zwecksinn des Infinitivs bleibt direkt erhalten.
- source_word: וְלַיְלָה בָּאִים לְהָרְגֶךָ
  choice: in der Nacht kommen sie, um dich zu töten
  rationale: Die Wiederholung wird wegen ihrer Dringlichkeit beibehalten. »In der Nacht« bleibt zeitlich offener als das im Hebräischen nicht ausdrücklich stehende »heute Nacht«.
theological_decisions:
- issue: Bedeutung von הֵיכָל im Zusammenhang mit einem für Nehemia unzulässigen heiligen Bereich
  choice: Tempel, präzisiert durch »im Inneren«
  alternative: Heiligtum
  rationale: Der Folgevers legt einen beschränkten heiligen Innenbereich nahe, doch הֵיכָל kann das Tempelgebäude beziehungsweise das Heiligtum bezeichnen. Der Haupttext bleibt gut verständlich und lässt die kontextuell gewichtige Alternative in der Fußnote sichtbar.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die direkte Rede ist eindringlich, ohne die Wiederholung zu glätten. Die unklare Ursache von Schemajas Eingeschlossensein und die räumliche Reichweite von הֵיכָל werden nicht dogmatisch festgelegt.
