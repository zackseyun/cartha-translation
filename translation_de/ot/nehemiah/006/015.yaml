  text: So the wall was finished on the twenty-fifth day of Elul[b][a], in fifty-two days.
translation:
  language: de
  text: So wurde die Mauer am fünfundzwanzigsten Tag des Monats Elul[a] in zweiundfünfzig Tagen fertiggestellt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Elul ist der sechste Monat im religiösen Jahr des hebräischen Kalenders.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: wurde … fertiggestellt
  rationale: Das Qal-Wayyiqtol von שלם bezeichnet hier mit der Mauer als Subjekt das Erreichen der Vollendung. Die deutsche Passivform ist natürlich und gibt den ereignishaften Sinn klar wieder.
- source_word: הַחוֹמָה
  choice: die Mauer
  rationale: Der bestimmte Ausdruck bezeichnet im unmittelbaren Zusammenhang die Stadtmauer Jerusalems; „die Mauer“ ist die direkte und kontextgemäße Entsprechung.
- source_word: בְּעֶשְׂרִים וַחֲמִשָּׁה
  choice: am fünfundzwanzigsten Tag
  rationale: Die Präposition mit der Zahl bildet eine Datumsangabe. Im Deutschen wird „Tag“ zur Klarheit und Natürlichkeit ergänzt.
- source_word: לֶאֱלוּל
  choice: des Monats Elul
  rationale: Elul ist ein Monatsname und wird transliteriert. Die Ergänzung „Monat“ macht die Datumsangabe für heutige Leser unmittelbar verständlich.
- source_word: לַחֲמִשִּׁים וּשְׁנַיִם יוֹם
  choice: in zweiundfünfzig Tagen
  rationale: Das ל mit der Zahlenangabe bezeichnet die Gesamtdauer bis zur Fertigstellung. „In zweiundfünfzig Tagen“ bewahrt diesen Sinn idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Und zwar“ verdeutlicht, dass die Schlussangabe die Bauzeit nennt, ohne den hebräischen Sinn auszuweiten.
