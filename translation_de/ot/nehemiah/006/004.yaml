  text: וַ/יִּשְׁלְח֥וּ אֵלַ֛/י כַּ/דָּבָ֥ר הַ/זֶּ֖ה אַרְבַּ֣ע פְּעָמִ֑ים וָ/אָשִׁ֥יב אוֹתָ֖/ם כַּ/דָּבָ֥ר הַ/זֶּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/004.yaml
  text: They sent to me four times in this way[a], and I answered them in the same way.
translation:
  language: de
  text: Sie schickten mir viermal dieselbe Botschaft, und ich gab ihnen jedes Mal dieselbe Antwort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אֵלַי
  choice: Sie schickten mir
  rationale: Das Verb bedeutet schlicht „senden/schicken“; wie im Hebräischen bleibt der Gegenstand des Sendens zunächst unausgesprochen, wird aber durch den folgenden Zusammenhang als Botschaft erkennbar.
- source_word: כַּדָּבָר הַזֶּה
  choice: dieselbe Botschaft
  rationale: Wörtlich „gemäß diesem Wort/dieser Sache“. Im Zusammenhang verweist die Wendung auf die wiederholte Mitteilung; „dieselbe Botschaft“ gibt diesen Rückbezug natürlich wieder.
- source_word: אַרְבַּע פְּעָמִים
  choice: viermal
  rationale: Direkte und idiomatische Wiedergabe der vier Wiederholungen.
- source_word: וָאָשִׁיב אוֹתָם
  choice: ich gab ihnen … dieselbe Antwort
  rationale: Der Hifil von שׁוב kann beim Austausch von Mitteilungen „eine Antwort zurückgeben“ bedeuten. Die deutsche Formulierung ist idiomatisch und macht den Bezug auf die Absender deutlich.
- source_word: כַּדָּבָר הַזֶּה
  choice: jedes Mal dieselbe Antwort
  rationale: Die identisch wiederholte hebräische Wendung bezeichnet hier Nehemias gleichbleibende Erwiderung. „Jedes Mal“ verdeutlicht den Bezug auf alle vier Anläufe, ohne den Sinn zu verändern.
