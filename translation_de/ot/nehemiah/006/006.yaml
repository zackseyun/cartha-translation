  terminology: „Völker“, „Juden“, „Mauer“ und „König“ sind angemessen und konsistent. Die Wiedergabe von גַשְׁמוּ als „Gaschmu“ mit einer erläuternden Fußnote zu „Geschem“ ist quellentreu; der Anker steht unmittelbar am Namen.
