source:
  edition: WLC
  text: כָּת֣וּב בָּ֗/הּ בַּ/גּוֹיִ֤ם נִשְׁמָע֙ וְ/גַשְׁמ֣וּ אֹמֵ֔ר אַתָּ֤ה וְ/הַ/יְּהוּדִים֙ חֹשְׁבִ֣ים לִ/מְר֔וֹד עַל כֵּ֛ן אַתָּ֥ה בוֹנֶ֖ה הַ/חוֹמָ֑ה וְ/אַתָּ֗ה הֹוֶ֤ה לָ/הֶם֙ לְ/מֶ֔לֶךְ כַּ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/006.yaml
  text: It was written in it[a], “It is being reported among the nations—and Geshem also says it—that you and the Jews are planning to rebel. Therefore you are rebuilding the wall, and according to these reports you are to become their king.”
translation:
  language: de
  text: 'Darin stand: „Unter den Völkern wird berichtet – und Gaschmu[a] sagt es ebenfalls –, dass du und die Juden einen Aufstand planen. Deshalb baust du die Mauer wieder auf, und diesen Berichten zufolge sollst du ihr König werden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Gaschmu“; gemeint ist offenbar Geschem.
    reason: Die Namensform גַשְׁמוּ weicht von der sonst in diesem Zusammenhang verwendeten Form גֶשֶׁם („Geschem“) ab.
lexical_decisions:
- source_word: כָּתוּב בָּהּ
  choice: Darin stand
  rationale: Die passive Partizipialkonstruktion führt den Inhalt des Schreibens ein. Das deutsche Präteritum fügt sich natürlich in den erzählenden Zusammenhang ein.
- source_word: בַּגּוֹיִם נִשְׁמָע
  choice: Unter den Völkern wird berichtet
  rationale: Der Nifal von שׁמע bezeichnet hier ein umlaufendes Gerücht beziehungsweise etwas, das berichtet wird. Die passive Form und der breite politisch-ethnische Sinn von גּוֹיִם bleiben erhalten.
- source_word: וְגַשְׁמוּ אֹמֵר
  choice: und Gaschmu sagt es ebenfalls
  rationale: „Ebenfalls“ gibt die hinzutretende Aussage Gaschmus wieder; „es“ bezieht seine Aussage auf das zuvor genannte Gerücht. Der Name folgt hier der hebräischen Form גַשְׁמוּ.
- source_word: חֹשְׁבִים לִמְרוֹד
  choice: einen Aufstand planen
  rationale: חשב mit Infinitiv bezeichnet hier eine Absicht oder Planung. Die Formulierung gibt den Vorwurf bewusster Rebellion idiomatisch wieder, ohne ihn unnötig zu verschärfen.
- source_word: עַל כֵּן
  choice: Deshalb
  rationale: Die Wendung kennzeichnet die behauptete Folgerung beziehungsweise Begründung für den Mauerbau.
- source_word: בּוֹנֶה הַחוֹמָה
  choice: baust du die Mauer wieder auf
  rationale: בנה bedeutet bauen; im Zusammenhang wird die zerstörte Stadtmauer wiederhergestellt. „Wieder aufbauen“ gibt diesen Kontext natürlich wieder.
- source_word: וְאַתָּה הֹוֶה לָהֶם לְמֶלֶךְ
  choice: sollst du ihr König werden
  rationale: הוה mit ל kann ein Werden ausdrücken. „Sollst … werden“ wahrt den Charakter einer behaupteten Absicht, statt sie als sichere Zukunft darzustellen.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: diesen Berichten zufolge
  rationale: דברים kann Worte, Aussagen oder Angelegenheiten bezeichnen. Im Zusammenhang sind die umlaufenden Behauptungen gemeint; „Berichten“ ist daher verständlich, ohne ihre Wahrheit zu bestätigen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche markieren den eingeschobenen Hinweis auf Gaschmu; „wird berichtet“ und „zufolge“ lassen den Gerüchtecharakter der Anschuldigungen deutlich bestehen.
