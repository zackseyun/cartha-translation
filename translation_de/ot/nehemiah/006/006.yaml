  source_fidelity: 'Die Übersetzung gibt den Inhalt des Briefes und die Abfolge der Anschuldigung zutreffend wieder: das unter den Völkern umlaufende Gerücht, Gaschmus bestätigende Aussage, den angeblich geplanten Aufstand, den Mauerbau und das behauptete Königtum. „Wieder aufbauen“ ist im Kontext der Wiederherstellung Jerusalems sachgerecht. „Diesen Berichten zufolge“ gibt כַּדְּבָרִים הָאֵלֶּה kontextgemäß wieder, ohne die Behauptungen als wahr auszugeben.'
