  text: וְ/יֵשׁ֙ אֲשֶׁ֣ר אֹמְרִ֔ים לָוִ֥ינוּ כֶ֖סֶף לְ/מִדַּ֣ת הַ/מֶּ֑לֶךְ שְׂדֹתֵ֖י/נוּ וּ/כְרָמֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/004.yaml
  text: And there were those who said[b][a], “We have borrowed money for the king’s tax on our fields and our vineyards.”
translation:
  language: de
  text: 'Und andere sagten: »Wir haben uns Geld[a] geliehen, um die Steuer des Königs[b] für unsere Felder und Weinberge zu bezahlen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Silber«; gemeint ist Geld.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »den Tribut des Königs«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: Und andere sagten
  rationale: Die Wendung führt im Zusammenhang eine weitere Gruppe von Klagenden ein. Das Partizip wird im deutschen Erzählzusammenhang natürlich mit dem Präteritum wiedergegeben.
- source_word: לָוִינוּ
  choice: wir haben uns … geliehen
  rationale: Das Verb bezeichnet das Aufnehmen eines Darlehens. Die reflexive Form macht im Deutschen eindeutig, dass die Betroffenen Geld geborgt und nicht verliehen haben.
- source_word: כֶסֶף
  choice: Geld
  rationale: Wörtlich bedeutet das Wort „Silber“, bezeichnet im wirtschaftlichen Zusammenhang aber gewöhnlich Geld.
- source_word: לְמִדַּת הַמֶּלֶךְ
  choice: um die Steuer des Königs … zu bezahlen
  rationale: Die Wendung bezeichnet eine dem König geschuldete Abgabe. „Steuer“ ist dafür die klare, heutige Entsprechung; der Zweckzusammenhang wird im Deutschen mit einem Finalsatz natürlich ausgedrückt.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ
  choice: auf unsere Felder und Weinberge
  rationale: Die Güter werden als die Grundstücke verstanden, auf die die königliche Abgabe erhoben wurde. „Auf“ gibt diesen steuerlichen Bezug im Deutschen knapp und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; „uns Geld geliehen“ vermeidet die im Deutschen mögliche Verwechslung von Leihen und Verleihen.
