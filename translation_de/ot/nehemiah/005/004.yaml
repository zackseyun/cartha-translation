  source_fidelity: 'Die Aussage wird zutreffend wiedergegeben: Eine weitere Gruppe berichtet, Geld aufgenommen zu haben, um eine dem König geschuldete Abgabe im Zusammenhang mit ihren Feldern und Weinbergen entrichten zu können. „Geld“ für כֶּסֶף ist im wirtschaftlichen Kontext angemessen; die Fußnote bewahrt die wörtliche Lesart „Silber“.'
  naturalness: 'Der Entwurf ist insgesamt klar und modernes Standarddeutsch. Die Verbindung „die Steuer des Königs auf unsere Felder und Weinberge bezahlen“ ist jedoch weniger idiomatisch: Im Deutschen wird eine Steuer eher „für“ Grundstücke bzw. „auf den Besitz“ erhoben. „für unsere Felder und Weinberge“ ist hier natürlich und bewahrt den sachlichen Bezug.'
  terminology: „Steuer des Königs“ ist eine vertretbare Wiedergabe von לְמִדַּת הַמֶּלֶךְ; die Alternative „Tribut des Königs“ bleibt sinnvoll in der Fußnote dokumentiert. Die Wiedergabe von שָׂדוֹת als „Felder“ und von כְּרָמִים als „Weinberge“ ist passend.
