base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/011.yaml
  text: Please restore to them this very day their fields[a], their vineyards, their olive orchards, and their houses, and the hundredth part of the money, the grain, the new wine[b], and the oil that you have been exacting from them.
translation:
  language: de
  text: Gebt ihnen bitte noch heute ihre Felder, Weinberge, Olivenhaine und Häuser zurück, außerdem den hundertsten Teil[a] von dem Geld, dem Getreide, dem neuen Wein und dem Öl, den ihr von ihnen fordert[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: ein Prozent; wahrscheinlich ist der von ihnen erhobene Anteil gemeint. Eine Abrechnungsperiode wird im Hebräischen nicht genannt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den ihr von ihnen erhebt“; möglicherweise ist gemeint: „den ihr als Zins von ihnen erhebt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָשִׁיבוּ
  choice: Gebt … zurück
  rationale: Der Hifil-Imperativ von שוב bedeutet hier, etwas in den Besitz der früheren Eigentümer zurückgelangen zu lassen. „Zurückgeben“ ist im Deutschen natürlich und umfasst Grundstücke, Häuser und Abgaben.
- source_word: נָא
  choice: bitte
  rationale: Die Partikel mildert die Aufforderung ab, ohne ihre Verbindlichkeit aufzuheben. „Bitte“ gibt diese Funktion in modernem Deutsch knapp wieder.
- source_word: כְּהַיּוֹם
  choice: noch heute
  rationale: Die Wendung betont die sofortige Erfüllung. „Noch heute“ vermittelt die Dringlichkeit idiomatisch.
- source_word: שְׂדֹתֵיהֶם … כַּרְמֵיהֶם … זֵיתֵיהֶם … וּבָתֵּיהֶם
  choice: ihre Felder, Weinberge, Olivenhaine und Häuser
  rationale: Die Reihe bezeichnet den entzogenen Grund- und Hausbesitz. „Olivenhaine“ macht den landwirtschaftlichen Besitz deutlicher als die wörtliche Wiedergabe „Olivenbäume“.
- source_word: וּמְאַת
  choice: ebenso das Hundertstel
  rationale: מְאַת bezeichnet wörtlich einen hundertsten Teil. „Das Hundertstel“ bewahrt die konkrete Bruchangabe, ohne die im Vers nicht ausdrücklich genannte Abrechnungsperiode festzulegen.
- source_word: הַכֶּסֶף
  choice: des Geldes
  rationale: כֶּסֶף kann „Silber“ oder „Geld“ bedeuten; im Zusammenhang von Darlehen und Forderungen ist „Geld“ die natürliche Funktionsentsprechung.
- source_word: הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: des Getreides, des neuen Weins und des Öls
  rationale: Die Wiedergabe unterscheidet תִּירוֹשׁ als neuen beziehungsweise frischen Wein von allgemeinem Wein und lässt יִצְהָר wie im Hebräischen schlicht als „Öl“ stehen.
- source_word: נֹשִׁים בָּהֶם
  choice: das ihr ihnen abverlangt
  rationale: Das Verb beschreibt hier die Handlung von Gläubigern. „Abverlangen“ wahrt die belastende Wirkung, ohne die Form der Forderung enger als der hebräische Ausdruck auf Zinsnahme festzulegen.
theological_decisions:
- issue: Art und Umfang der finanziellen Forderung
  choice: „das Hundertstel …, das ihr ihnen abverlangt“
  alternative: „das eine Prozent …, das ihr ihnen als Zins berechnet“
  rationale: Der soziale Zusammenhang spricht für eine belastende Gläubigerforderung, doch der Vers nennt weder ausdrücklich „Zins“ noch eine Abrechnungsperiode. Die Übersetzung bewahrt deshalb die finanzielle Aussage und lässt die genaue Konstruktion offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dringliche Aufforderung bleibt klar, während die nicht völlig eindeutige finanzielle Fachsprache des Hebräischen nicht vorschnell auf einen bestimmten Zinssatz oder Abrechnungszeitraum festgelegt wird.
