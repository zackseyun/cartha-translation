  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. „Den hundertsten Teil von dem Geld, dem Getreide, dem neuen Wein und dem Öl“ ist syntaktisch klarer als „das Hundertstel …, das“, dessen Relativpronomen wegen des unmittelbar vorausgehenden „Öls“ missverständlich sein kann.
