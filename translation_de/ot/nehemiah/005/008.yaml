base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/008.yaml
  text: And I said to them[a], “We have bought back our Jewish brothers who were sold to the nations, as much as we were able. But now you yourselves are even selling your brothers[b], and they must be sold to us!” Then they were silent and found nothing to say.
translation:
  language: de
  text: 'Und ich sagte zu ihnen: „Wir haben unsere jüdischen Brüder[a], die an die Völker verkauft worden waren, soweit es uns möglich war, zurückgekauft. Und nun verkauft sogar ihr eure Brüder – und sie sollen an uns verkauft werden?[b]“ Da schwiegen sie und wussten nichts zu erwidern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unsere jüdischen Volksgenossen“. Der hebräische Text lautet wörtlich „unsere Brüder, die Juden“; „Brüder“ ist ein maskuliner Verwandtschaftsbegriff für Mitglieder der Gemeinschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Klausel ist knapp und kann als rhetorische Frage oder als ausrufende Folgerung verstanden werden: „und sie werden an uns verkauft!“ Gemeint ist die widersinnige Folge, dass Angehörige der eigenen Gemeinschaft wieder an diese verkauft würden.'
    reason: alternative_reading
lexical_decisions:
- source_word: קָנִינוּ
  choice: zurückgekauft
  rationale: Im Zusammenhang bezeichnet das Verb den Rückkauf jüdischer Volksgenossen aus fremder Knechtschaft. „Zurückgekauft“ gibt dies natürlich wieder, ohne die zusätzliche theologische Prägung von „erlöst“ einzutragen.
- source_word: אַחֵינוּ הַיְּהוּדִים
  choice: unsere jüdischen Brüder
  rationale: Bewahrt sowohl die ausdrückliche Bezeichnung „die Juden/jüdischen“ als auch den maskulinen Verwandtschafts- und Gemeinschaftsbegriff „Brüder“.
- source_word: הַנִּמְכָּרִים לַגּוֹיִם
  choice: die an die Völker verkauft worden waren
  rationale: „Völker“ gibt גּוֹיִם direkt wieder. Das Plusquamperfekt macht im Deutschen deutlich, dass der Verkauf dem Rückkauf vorausging.
- source_word: כְּדֵי בָנוּ
  choice: soweit es uns möglich war
  rationale: Die knappe Wendung bezeichnet das Maß der verfügbaren Möglichkeiten oder Mittel; diese Formulierung ist idiomatisch und bedeutungsnah.
- source_word: וְגַם אַתֶּם
  choice: Und nun verkauft sogar ihr
  rationale: „sogar ihr“ bewahrt den emphatischen Gegensatz. „nun“ verdeutlicht den scharfen Kontrast zur zuvor beschriebenen Rückkaufpraxis, ohne eine neue Sachinformation einzuführen.
- source_word: תִּמְכְּרוּ
  choice: verkauft
  rationale: Das deutsche Präsens eignet sich für die unmittelbare Anklage und bleibt nah an der hebräischen Verbform.
- source_word: וְנִמְכְּרוּ לָנוּ
  choice: und sie sollen an uns verkauft werden?
  rationale: Die hebräische Klausel ist knapp und mehrdeutig. Die rhetorische Frage bringt die widersinnige Folge zum Ausdruck, dass die verkauften Brüder anschließend von der eigenen Gemeinschaft zurückgekauft werden müssten.
- source_word: וַיַּחֲרִישׁוּ
  choice: Da schwiegen sie
  rationale: Eine knappe, natürliche Wiedergabe der erzählenden Verbform.
- source_word: וְלֹא מָצְאוּ דָּבָר
  choice: wussten nichts zu erwidern
  rationale: Gibt die hebräische Wendung „kein Wort finden“ idiomatisch als Unfähigkeit zu einer Antwort wieder.
theological_decisions:
- issue: Maskuline Gemeinschaftsbezeichnung אַחֵינוּ / אֲחֵיכֶם
  choice: Brüder
  alternative: Geschwister; jüdische Volksgenossen
  rationale: „Brüder“ erhält die grammatische Form und die Sprache gemeinschaftlicher Solidarität. Eine inklusive Erweiterung würde den Ausgangstext expliziter machen, als er ist.
- issue: Deutung von וְנִמְכְּרוּ לָנוּ
  choice: 'rhetorische Frage: „und sie sollen an uns verkauft werden?“'
  alternative: 'Ausruf bzw. Folgerung: „und sie werden an uns verkauft!“'
  rationale: Wortlaut und Kontext erlauben eine rhetorische Deutung, bei der Nehemia die absurde Folge des Handelns seiner Gegner vor Augen stellt. Die Modalität ist im Hebräischen nicht vollständig festgelegt; deshalb wird die Alternative ausdrücklich dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung „sogar ihr“ trägt die hebräische Hervorhebung. Keine Fußnote ist erforderlich, da die zentrale syntaktische Mehrdeutigkeit in den dokumentierten Entscheidungen offengelegt wird und der Haupttext als rhetorische Frage gut verständlich bleibt.
