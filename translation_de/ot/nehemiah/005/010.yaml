  text: וְ/גַם אֲנִי֙ אַחַ֣/י וּ/נְעָרַ֔/י נֹשִׁ֥ים בָּ/הֶ֖ם כֶּ֣סֶף וְ/דָגָ֑ן נַֽעַזְבָה נָּ֖א אֶת הַ/מַּשָּׁ֥א הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/010.yaml
  text: And I also[a], my brothers and my young men, are lending them money and grain. Please[c][b], let us stop this burden.
translation:
  language: de
  text: Auch ich, meine Brüder und meine jungen Männer[a] leihen ihnen Geld und Getreide[b]. Lasst uns doch von dieser Last[c] ablassen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Diener« beziehungsweise »meine Gefolgsleute«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann auch bedeuten, als Gläubiger aufzutreten oder Forderungen gegen jemanden geltend zu machen, nicht nur neutral etwas zu verleihen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »von dieser Forderung«, »von dieser Schuld« beziehungsweise »von dieser Einforderung«. Das Hebräische bedeutet wörtlich »Last« beziehungsweise »Bürde«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Auch ich
  rationale: Gibt die anknüpfende und hervorhebende Kraft von וְגַם knapp und natürlich wieder.
- source_word: אַחַי
  choice: meine Brüder
  rationale: Bewahrt die wörtliche Verwandtschafts- und Solidaritätsbezeichnung; im Zusammenhang können auch nähere Volksgenossen oder Mitarbeiter gemeint sein.
- source_word: וּנְעָרַי
  choice: meine jungen Männer
  rationale: Gibt die Grundbedeutung von נְעָרִים wieder, ohne die im Kontext mögliche Bedeutung »Diener« oder »Gefolgsleute« im Haupttext festzulegen.
- source_word: נֹשִׁים בָּהֶם
  choice: leihen ihnen
  rationale: Formuliert das Kreditverhältnis in natürlichem Deutsch. Das Partizip kann zugleich das Auftreten als Gläubiger und damit ein Einfordern bezeichnen; diese Nuance wird in der Fußnote erhalten.
- source_word: כֶּסֶף וְדָגָן
  choice: Geld und Getreide
  rationale: כֶּסֶף bezeichnet zwar wörtlich Silber, meint im Darlehenszusammenhang aber Zahlungsmittel beziehungsweise Geld.
- source_word: נַעַזְבָה נָּא
  choice: Lasst uns doch … verzichten
  rationale: Der Kohortativ mit נָא ist eine eindringliche Aufforderung. »Verzichten« bewahrt hier den Gedanken, eine bestehende Praxis oder Forderung aufzugeben, statt nur künftig damit aufzuhören.
- source_word: הַמַּשָּׁא הַזֶּה
  choice: diese Forderung
  rationale: Im wirtschaftlichen Kontext bezeichnet מַשָּׁא die belastende Forderung beziehungsweise Abgabe. »Forderung« ist im Deutschen verständlich und lässt offen, ob besonders die Schuld, ihre Einziehung oder die daraus entstehende Last im Blick ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die inklusive Aufforderung »Lasst uns« schließt Nehemia ausdrücklich mit ein. Die Ausrufeform gibt die Dringlichkeit wieder, ohne den Satz konfessionell oder interpretierend zuzuspitzen.
