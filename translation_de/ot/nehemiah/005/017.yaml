  text: וְ/הַ/יְּהוּדִ֨ים וְ/הַ/סְּגָנִ֜ים מֵאָ֧ה וַ/חֲמִשִּׁ֣ים אִ֗ישׁ וְ/הַ/בָּאִ֥ים אֵלֵ֛י/נוּ מִן הַ/גּוֹיִ֥ם אֲשֶׁר סְבִיבֹתֵ֖י/נוּ עַל שֻׁלְחָנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/017.yaml
  text: The Jews and the officials[a], a hundred and fifty men, and those who came to us from the nations that were around us[b], were at my table.
translation:
  language: de
  text: Die Juden und die Beamten, hundertfünfzig Mann, sowie die Menschen, die aus den Völkern rings um uns zu uns kamen, saßen an meinem Tisch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung weist darauf hin, dass Nehemia sie als Gäste beziehungsweise im Rahmen seiner Amtsführung mit Essen versorgte.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַיְּהוּדִים
  choice: die Juden
  rationale: Der Ausdruck kann die jüdische Bevölkerung allgemein oder geografisch die Judäer bezeichnen. Im Zusammenhang von Nehemia ist „die Juden“ die natürliche, nicht unnötig verengende Wiedergabe.
- source_word: וְהַסְּגָנִים
  choice: die führenden Beamten
  rationale: Das Wort bezeichnet nachgeordnete zivile Machthaber beziehungsweise Verwaltungsbeamte. „Führende Beamte“ macht sowohl ihre amtliche Funktion als auch ihren Rang verständlich, ohne einen bestimmten persischen Titel vorauszusetzen.
- source_word: מֵאָה וַחֲמִשִּׁים אִישׁ
  choice: hundertfünfzig Mann
  rationale: Die Zahlenangabe ist direkt wiedergegeben; „Mann“ entspricht dem singularischen אִישׁ nach einer Zahl und passt zu einer gezählten Personengruppe.
- source_word: וְהַבָּאִים אֵלֵינוּ
  choice: sowie die Menschen, die ... zu uns kamen
  rationale: Das substantivierte Partizip bezeichnet die zu Nehemia und seinen Leuten kommenden Personen. Die Vergangenheitsform klingt in der rückblickenden Erzählung natürlich.
- source_word: מִן הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: aus den Völkern rings um uns
  rationale: גּוֹיִם wird quellennah als „Völker“ wiedergegeben; „rings um uns“ bewahrt die geografische Aussage über die benachbarten Völker, ohne ausdrücklich „Heiden“ einzutragen.
- source_word: עַל שֻׁלְחָנִי
  choice: aßen an meinem Tisch
  rationale: Wörtlich steht „an/auf meinem Tisch“. Im Kontext bezeichnet das Bild Personen, die Nehemia an seinem Tisch versorgte. Das deutsche „aßen an meinem Tisch“ bewahrt das Bild und macht die gemeinte Handlung idiomatisch deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange Aufzählung des Hebräischen bleibt erkennbar, wird aber durch „sowie“ lesbarer gegliedert. Kein einleitendes „Nun“, da im Ausgangstext kein ausdrückliches Zeitadverb steht.
