    rationale: „Unterhalt“ kann im Deutschen insbesondere finanzielle Versorgung oder Zahlungen an eine Person bezeichnen. Der Kontext meint die dem Statthalter zustehenden amtlichen Verpflegungsleistungen; dies sollte im Haupttext klarer werden.
