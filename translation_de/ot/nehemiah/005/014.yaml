  naturalness: 'Der Entwurf enthält einen grammatischen Fehler: Bei „ich und meine Brüder“ ist „nahmen“ erforderlich; „nahmen ich und meine Brüder“ ist im Deutschen nicht möglich. Die Umstellung mit „Ich selbst … ebenso wie meine Brüder“ ist modernes, flüssiges Standarddeutsch und bewahrt die hervorgehobene erste Person.'
  terminology: „Statthalter“ ist ein passender historischer Amtstitel. „Verpflegung“ gibt לֶחֶם idiomatisch als metonymische Bezeichnung für die amtlich zustehenden Lebensmittel bzw. Leistungen wieder; die Fußnote erhält die wörtliche Lesart „Brot“.
