source:
  edition: WLC
  text: גַּ֞ם מִ/יּ֣וֹם אֲשֶׁר צִוָּ֣ה אֹתִ֗/י לִ/הְי֣וֹת פֶּחָ/ם֮ בְּ/אֶ֣רֶץ יְהוּדָה֒ מִ/שְּׁנַ֣ת עֶשְׂרִ֗ים וְ֠/עַד שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁתַּ֨יִם֙ לְ/אַרְתַּחְשַׁ֣סְתְּא הַ/מֶּ֔לֶךְ שָׁנִ֖ים שְׁתֵּ֣ים עֶשְׂרֵ֑ה אֲנִ֣י וְ/אַחַ֔/י לֶ֥חֶם הַ/פֶּ֖חָה לֹ֥א אָכַֽלְתִּי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/014.yaml
  text: Also[a], from the day that he appointed me to be governor in the land of Judah, from the twentieth year until the thirty-second year of King Artaxerxes—twelve years—I and my brothers did not eat the governor’s food allowance.
translation:
  language: de
  text: Auch nahm ich von dem Tag an, an dem er mich dazu einsetzte, ihr Statthalter im Land Juda zu sein, bis zum zweiunddreißigsten Regierungsjahr des Königs Artaxerxes – zwölf Jahre lang – ebenso wie meine Brüder die dem Statthalter zustehende Verpflegung[a] nicht in Anspruch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Brot des Statthalters“, das heißt die Verpflegung oder Versorgung, die dem Statthalter üblicherweise zustand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Leitet einen weiteren Punkt in Nehemias Rechtfertigung ein und bewahrt die additive Bedeutung.
- source_word: מִיּוֹם אֲשֶׁר
  choice: von dem Tag an, an dem
  rationale: Gibt den Beginn eines fortdauernden Zeitraums in natürlichem Deutsch wieder.
- source_word: צִוָּה אֹתִי
  choice: er mich dazu einsetzte
  rationale: צוה bedeutet häufig „befehlen“, bezeichnet hier aber im Zusammenhang mit einem Amt die offizielle Einsetzung.
- source_word: לִהְיוֹת פֶּחָם
  choice: ihr Statthalter … zu sein
  rationale: פֶּחָה ist der Titel eines persischen Provinzstatthalters; das maskuline Pluralsuffix wird mit „ihr“ wiedergegeben.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: im Land Juda
  rationale: Bewahrt die geografische Formulierung des Hebräischen, ohne „Provinz“ interpretierend einzutragen.
- source_word: מִשְּׁנַת עֶשְׂרִים וְעַד שְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: vom zwanzigsten bis zum zweiunddreißigsten Regierungsjahr des Königs Artaxerxes
  rationale: Macht die persische Regierungsjahr-Datierung im Deutschen ausdrücklich und verständlich.
- source_word: שָׁנִים שְׁתֵּים עֶשְׂרֵה
  choice: zwölf Jahre lang
  rationale: Gibt die zusammenfassende Zeitangabe als eingeschobene Erläuterung wieder.
- source_word: אֲנִי וְאַחַי
  choice: ich und meine Brüder
  rationale: Bewahrt die ausdrücklich maskuline und wörtliche Bezeichnung, ohne ihren möglichen sozialen Umfang vorschnell festzulegen.
- source_word: לֶחֶם הַפֶּחָה
  choice: den Unterhalt des Statthalters
  rationale: לֶחֶם bedeutet wörtlich „Brot“, bezeichnet hier aber metonymisch die dem Statthalter zustehende Verpflegung beziehungsweise amtliche Versorgung.
- source_word: לֹא אָכַלְתִּי
  choice: nicht in Anspruch nahmen
  rationale: Gibt zusammen mit „Unterhalt“ den administrativen Sinn natürlich wieder; ein wörtliches „nicht aßen“ wäre bei dieser deutschen Formulierung missverständlich.
theological_decisions:
- issue: Bezug des Suffixes an פֶּחָם
  choice: ihr Statthalter
  alternative: Statthalter
  rationale: Der masoretische Text weist ein maskulines Pluralsuffix auf. Es wird im Haupttext erhalten, auch wenn manche Übersetzungen es aus stilistischen oder textkritischen Gründen nicht ausdrücken.
- issue: Bedeutung von אַחַי
  choice: meine Brüder
  alternative: meine Gefährten / meine Landsleute
  rationale: Die konkrete hebräische Bezeichnung bleibt stehen; ob sie leibliche Brüder, Verwandte oder eng verbundene Mitarbeiter umfasst, wird nicht dogmatisch festgelegt.
- issue: Wiedergabe von לֶחֶם הַפֶּחָה
  choice: Unterhalt des Statthalters
  alternative: Brot des Statthalters
  rationale: Der Kontext betrifft die wirtschaftlichen Ansprüche des Statthalters. Die idiomatische Wiedergabe vermittelt diesen Sinn, während die Fußnote die konkrete Bildsprache offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur hält die genaue Zeitangabe zusammen; Gedankenstriche kennzeichnen die erläuternde Dauer. „Statthalter“ bewahrt den historischen Amtstitel, „Unterhalt“ macht dessen wirtschaftlichen Anspruch verständlich.
