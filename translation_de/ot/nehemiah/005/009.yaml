    issue: Der Haupttext ergänzt „uns sonst verhöhnen“.
    rationale: Das Hebräische enthält weder ein Objekt „uns“ noch ein Verb „verhöhnen“ noch „sonst“. Diese Auslegung kann kontextuell naheliegen, sollte aber wegen der syntaktischen und semantischen Offenheit von מִן nicht als Haupttext erscheinen.
  - severity: low
    issue: Die Fußnote bezeichnet die Grundformulierung als „wörtlicher“, während der Haupttext die Aussage stark ausdeutet.
    rationale: Nach der Korrektur kann die Fußnote klar eine mögliche, zielgerichtete Deutung („um ... zu vermeiden“) benennen, ohne den Haupttext zu überladen.
