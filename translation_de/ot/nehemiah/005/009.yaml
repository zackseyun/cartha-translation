base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/009.yaml
  text: So I said[a], “What you are doing is not good. Should you not walk in the fear of our God because of the reproach of the nations, our enemies?”
translation:
  language: de
  text: 'Da sagte ich: „Was ihr da tut, ist nicht gut. Solltet ihr nicht in der Furcht vor unserem Gott leben wegen der Schmach der Völker, unserer Feinde?[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um die Schmach der Völker, unserer Feinde, zu vermeiden“. Die hebräische Präposition kann den Beweggrund oder eine beabsichtigte Vermeidung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte ich
  rationale: Das konsekutive ו führt die Erzählung weiter; „Da sagte ich“ gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: לֹא טוֹב
  choice: ist nicht gut
  rationale: Die schlichte Wertung des Hebräischen bleibt erhalten, ohne sie durch „unrecht“ oder „verwerflich“ stärker auszudeuten.
- source_word: הַדָּבָר אֲשֶׁר אַתֶּם עֹשִׂים
  choice: Was ihr da tut
  rationale: Eine natürliche deutsche Wiedergabe der nominalen hebräischen Wendung; „da“ hebt das konkret beanstandete Verhalten hervor.
- source_word: הֲלוֹא
  choice: Solltet ihr nicht
  rationale: Gibt die rhetorische Frage und ihren mahnenden Charakter angemessen wieder.
- source_word: בְּיִרְאַת אֱלֹהֵינוּ
  choice: in der Furcht vor unserem Gott
  rationale: Bewahrt den gewichtigen biblischen Begriff der Gottesfurcht und klingt zugleich im Deutschen idiomatisch.
- source_word: תֵּלֵכוּ
  choice: leben
  rationale: Das hebräische „gehen“ bezeichnet hier die Lebensführung. „Leben“ macht die ethische Bedeutung für heutige Leser unmittelbar verständlich.
- source_word: מֵחֶרְפַּת הַגּוֹיִם אֹיְבֵינוּ
  choice: weil die Völker, unsere Feinde, uns sonst verhöhnen
  rationale: חרפה kann Schmach, Hohn oder Verhöhnung bezeichnen. Die Wiedergabe versteht מִן als Angabe des Beweggrundes beziehungsweise der beabsichtigten Vermeidung; die verbleibende syntaktische Mehrdeutigkeit wird in der Fußnote genannt.
theological_decisions:
- issue: Ethische Metapher von הלך im Zusammenhang der Gottesfurcht
  choice: Im Haupttext mit „leben“ wiedergeben
  alternative: „in der Furcht vor unserem Gott wandeln“
  rationale: „Leben“ vermittelt die gemeinte Lebensführung in modernem Standarddeutsch klarer. Die Aussage über ein von Gottesfurcht geprägtes Verhalten bleibt vollständig erhalten, ohne altertümlich zu klingen.
- issue: Bezug von מֵחֶרְפַּת
  choice: Als Beweggrund beziehungsweise zu vermeidende Folge verstehen
  alternative: 'Wörtlicher: „wegen der Schmach der Völker, unserer Feinde“'
  rationale: Der Kontext legt nahe, dass ihr Verhalten den feindlichen Völkern Anlass zur Verhöhnung gibt. Da die Präposition sowohl kausal als auch separativ beziehungsweise vermeidend verstanden werden kann, wird die Alternative ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Wendung „in der Furcht vor unserem Gott leben“ vermeidet das im heutigen Deutsch missverständliche oder altertümliche ethische „wandeln“. Die rhetorische Mahnung und die Apposition „unsere Feinde“ bleiben erhalten.
