source:
  edition: WLC
  text: וַ/אֲשֶׁר֩ הָיָ֨ה נַעֲשֶׂ֜ה לְ/י֣וֹם אֶחָ֗ד שׁ֣וֹר אֶחָ֞ד צֹ֠אן שֵׁשׁ בְּרֻר֤וֹת וְ/צִפֳּרִים֙ נַֽעֲשׂוּ לִ֔/י וּ/בֵ֨ין עֲשֶׂ֧רֶת יָמִ֛ים בְּ/כָל יַ֖יִן לְ/הַרְבֵּ֑ה וְ/עִם זֶ֗ה לֶ֤חֶם הַ/פֶּחָה֙ לֹ֣א בִקַּ֔שְׁתִּי כִּֽי כָֽבְדָ֥ה הָ/עֲבֹדָ֖ה עַל הָ/עָ֥ם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/018.yaml
  text: What was prepared for each day was one ox and six choice sheep[a]; also birds were prepared for me, and every ten days an abundance of all kinds of wine. Yet even with this, I did not demand the governor’s food allowance[b], because the service was heavy on this people.
translation:
  language: de
  text: Was für jeden Tag zubereitet wurde, waren ein Rind und sechs ausgesuchte Schafe[a]; auch Geflügel wurde für mich zubereitet. Und alle zehn Tage gab es Wein aller Art in großer Menge. Doch auch bei all dem beanspruchte ich die mir als Statthalter zustehende Verpflegung[b] nicht, denn die Arbeit lastete schwer auf diesem Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sechs ausgewählte Stücke Kleinvieh“; das hebräische Wort kann allgemein Kleinvieh aus einer Herde bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das Brot des Statthalters“; gemeint sein kann die mit dem Amt verbundene Lebensmittelzuteilung oder Versorgung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר הָיָה נַעֲשֶׂה לְיוֹם אֶחָד
  choice: Was für jeden Tag zubereitet wurde
  rationale: Das passive נַעֲשֶׂה bezeichnet im Zusammenhang mit Lebensmitteln deren Zubereitung; לְיוֹם אֶחָד gibt die wiederkehrende Tagesmenge an.
- source_word: שׁוֹר אֶחָד
  choice: ein Rind
  rationale: שׁוֹר bezeichnet ein Stück Rindvieh; „Rind“ ist hier natürlich und legt das Geschlecht nicht unnötig fest.
- source_word: צֹאן שֵׁשׁ בְּרֻרוֹת
  choice: sechs ausgesuchte Schafe
  rationale: צֹאן kann Kleinvieh bezeichnen, wird im Speisekontext aber passend als „Schafe“ wiedergegeben; בְּרֻרוֹת beschreibt sie als ausgewählt beziehungsweise von besonderer Qualität.
- source_word: וְצִפֳּרִים נַעֲשׂוּ לִי
  choice: auch Geflügel wurde für mich zubereitet
  rationale: צִפֳּרִים bedeutet wörtlich „Vögel“; im Zusammenhang einer Mahlzeit vermittelt „Geflügel“ den gemeinten Speisecharakter natürlicher.
- source_word: וּבֵין עֲשֶׂרֶת יָמִים
  choice: und alle zehn Tage
  rationale: Die Wendung bezeichnet ein regelmäßig wiederkehrendes Intervall.
- source_word: בְּכָל יַיִן לְהַרְבֵּה
  choice: Wein aller Art in großer Menge
  rationale: Die Wiedergabe erhält sowohl die umfassende Vielfalt von בְּכָל als auch die große Menge von לְהַרְבֵּה.
- source_word: וְעִם זֶה
  choice: Trotzdem
  rationale: 'Die Wendung leitet den Gegensatz ein: Trotz der umfangreichen täglichen Versorgung nahm Nehemia die amtliche Verpflegung nicht in Anspruch.'
- source_word: לֶחֶם הַפֶּחָה
  choice: die Verpflegung des Statthalters
  rationale: Wörtlich steht „das Brot des Statthalters“. לֶחֶם kann metonymisch die gesamte Verpflegung bezeichnen; der Kontext deutet auf den mit dem Amt verbundenen Versorgungsanspruch.
- source_word: לֹא בִקַּשְׁתִּי
  choice: beanspruchte ich ... nicht
  rationale: בקשׁ kann „bitten“, „fordern“ oder „verlangen“ bedeuten. „Nicht beanspruchen“ passt zu einem bestehenden amtlichen Anspruch, auf den Nehemia verzichtete.
- source_word: כִּי כָבְדָה הָעֲבֹדָה עַל הָעָם הַזֶּה
  choice: denn die Last lag schwer auf diesem Volk
  rationale: Die Formulierung bewahrt das Bild der Schwere in כָבְדָה und lässt עֲבֹדָה als Arbeit, Dienst oder auferlegte Last anklingen.
theological_decisions:
- issue: Sozialethische Bedeutung des Verzichts auf amtliche Versorgung
  choice: Nehemia nahm die dem Statthalter zustehende Verpflegung aus Rücksicht auf die schwere Belastung des Volkes nicht in Anspruch.
  alternative: Nehemia bat lediglich nicht um Brot, ohne dass ein amtlicher Anspruch vorausgesetzt wäre.
  rationale: Der Ausdruck „Brot des Statthalters“ steht im Kontext amtlicher Abgaben und Versorgung. „Beanspruchte ... nicht“ wahrt, ohne weitergehende Lehren einzutragen, den Sinn eines freiwilligen Verzichts zugunsten des belasteten Volkes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax bleibt nah am Hebräischen, wird aber durch Satzteilung lesbar gehalten. „Geflügel“, „Verpflegung“ und „beanspruchen“ geben den Speise- und Verwaltungskontext idiomatisch wieder; die Fußnoten bewahren die wörtlicheren Alternativen und die Mehrdeutigkeit von עֲבֹדָה.
