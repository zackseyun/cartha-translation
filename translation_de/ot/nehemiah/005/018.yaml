  to: Was für jeden Tag zubereitet wurde, waren ein Rind und sechs ausgesuchte Schafe[a]; auch Geflügel wurde für mich zubereitet. Und alle zehn Tage gab es Wein aller Art in großer Menge. Doch auch bei all dem beanspruchte ich die mir als Statthalter zustehende Verpflegung[b] nicht, denn die Arbeit lastete schwer auf diesem Volk.
