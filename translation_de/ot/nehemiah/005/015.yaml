  text: וְ/הַ/פַּחוֹת֩ הָ/רִאשֹׁנִ֨ים אֲשֶׁר לְ/פָנַ֜/י הִכְבִּ֣ידוּ עַל הָ/עָ֗ם וַ/יִּקְח֨וּ מֵ/הֶ֜ם בְּ/לֶ֤חֶם וָ/יַ֨יִן֙ אַחַר֙ כֶּֽסֶף שְׁקָלִ֣ים אַרְבָּעִ֔ים גַּ֥ם נַעֲרֵי/הֶ֖ם שָׁלְט֣וּ עַל הָ/עָ֑ם וַ/אֲנִי֙ לֹא עָשִׂ֣יתִי כֵ֔ן מִ/פְּנֵ֖י יִרְאַ֥ת אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/015.yaml
  text: But the former governors who were before me laid heavy burdens on the people[a], and took from them bread and wine, besides forty shekels of silver. Even their servants ruled over the people. But I did not do so[c][b], because of the fear of God.
translation:
  language: de
  text: Doch die früheren Statthalter, die vor mir im Amt waren, legten dem Volk schwere Lasten auf und nahmen ihm Brot und Wein ab, dazu vierzig Schekel Silber.[a] Auch ihre Diener herrschten über das Volk.[b] Ich aber handelte nicht so – aus Furcht vor Gott.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ungewöhnliche hebräische Formulierung kann auch mit »zusätzlich zu vierzig Schekel Silber« wiedergegeben werden; wahrscheinlich bezeichnet sie eine Geldabgabe neben Brot und Wein.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »junge Männer« beziehungsweise »Bedienstete«. Gemeint sind wahrscheinlich Untergebene der Statthalter.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »aus Ehrfurcht vor Gott«. Wörtlich steht hier »aus Furcht vor Gott«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפַּחוֹת
  choice: Statthalter
  rationale: פֶּחָה bezeichnet in der persischen Epoche einen Provinzverwalter; »Statthalter« ist historisch passend und im Deutschen verständlich.
- source_word: הָרִאשֹׁנִים אֲשֶׁר לְפָנַי
  choice: die früheren Statthalter, die vor mir im Amt waren
  rationale: Die Formulierung kennzeichnet Nehemias Amtsvorgänger. Der Zusatz »im Amt« macht den administrativen Bezug natürlich und eindeutig.
- source_word: הִכְבִּידוּ עַל הָעָם
  choice: legten dem Volk schwere Lasten auf
  rationale: Die Wiedergabe bewahrt das hebräische Bild des Schwer-Machens und bezeichnet zugleich die belastenden Abgaben.
- source_word: וַיִּקְחוּ מֵהֶם
  choice: nahmen ihm ... ab
  rationale: Dies bleibt nahe beim gewöhnlichen Sinn von לקח, während »abnehmen« im Zusammenhang eine belastende Erhebung erkennen lässt.
- source_word: בְּלֶחֶם וָיַיִן
  choice: Brot und Wein
  rationale: Die konkreten Güter des hebräischen Textes werden beibehalten und nicht zu »Lebensmitteln« verallgemeinert.
- source_word: אַחַר כֶּסֶף שְׁקָלִים אַרְבָּעִים
  choice: dazu vierzig Schekel Silber
  rationale: 'אַחַר wird hier wahrscheinlich additiv verstanden: Die Geldabgabe kam zu Brot und Wein hinzu. Wegen der ungewöhnlichen Konstruktion wird die Alternative in einer Fußnote offengehalten.'
- source_word: נַעֲרֵיהֶם
  choice: Diener
  rationale: נַעַר kann »junger Mann«, »Diener« oder »Bediensteter« bedeuten. Im Verwaltungskontext bezeichnet es wahrscheinlich untergeordnete Leute der Statthalter.
- source_word: שָׁלְטוּ עַל הָעָם
  choice: herrschten über das Volk
  rationale: Die Formulierung gibt die Ausübung von Macht wieder, ohne das wertende »tyrannisierten« in den Text einzutragen.
- source_word: וַאֲנִי לֹא עָשִׂיתִי כֵן
  choice: Ich aber handelte nicht so
  rationale: Die Kontraststellung wird im Deutschen klar wiedergegeben; »handelte« verweist natürlich auf das zuvor beschriebene Verhalten.
- source_word: מִפְּנֵי יִרְאַת אֱלֹהִים
  choice: aus Furcht vor Gott
  rationale: Die traditionelle und gewichtige biblische Wendung bewahrt sowohl Ehrfurcht als auch das Bewusstsein der Verantwortung vor Gott.
theological_decisions:
- issue: Bedeutung von יִרְאַת אֱלֹהִים
  choice: aus Furcht vor Gott
  alternative: aus Ehrfurcht vor Gott
  rationale: »Furcht vor Gott« bewahrt die theologische Spannung des hebräischen Ausdrucks und verengt ihn weder auf bloßen Schrecken noch auf unverbindlichen Respekt. Die mögliche Verdeutlichung als »Ehrfurcht« wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Abgabensprache und das Bild der schweren Last bleiben erhalten. »Statthalter« trägt dem perserzeitlichen Verwaltungskontext Rechnung; »Schekel« bewahrt die historische Maßeinheit. Alle erklärungsbedürftigen Mehrdeutigkeiten werden knapp in Fußnoten offengehalten.
