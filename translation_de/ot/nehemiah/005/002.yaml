base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/002.yaml
  text: And there were those who said[a], “We have many sons and daughters. Let us get grain, so that we may eat and live.”
translation:
  language: de
  text: 'Und einige sagten: »Wir haben viele Söhne und Töchter.[a] Lasst uns Getreide beschaffen, damit wir essen und am Leben bleiben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „Unsere Söhne und unsere Töchter – wir sind viele.“ Der hebräische Satz verbindet die Familienmitglieder ausdrücklich mit „wir“ und „viele“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: Und einige sagten
  rationale: Die Wendung führt innerhalb der klagenden Bevölkerung eine bestimmte Gruppe ein. „Einige sagten“ gibt dies im modernen Deutschen knapp und natürlich wieder.
- source_word: בָּנֵינוּ וּבְנֹתֵינוּ אֲנַחְנוּ רַבִּים
  choice: Wir haben viele Söhne und Töchter
  rationale: Der hebräische Satz ist gedrängt und stellt die Familienmitglieder mit dem ausdrücklichen „wir“ zusammen. Die gewählte Formulierung vermittelt den gemeinten Kinderreichtum verständlich; die ungewöhnlichere Struktur des Hebräischen bleibt in der Fußnote sichtbar.
- source_word: וְנִקְחָה
  choice: Lasst uns … beschaffen
  rationale: Der Kohortativ der ersten Person Plural drückt gemeinsames Wollen beziehungsweise dringende Aufforderung aus. „Beschaffen“ passt zum Erwerb von Getreide in einer Notlage, ohne eine bestimmte Erwerbsweise festzulegen.
- source_word: דָגָן
  choice: Getreide
  rationale: Das Wort bezeichnet Getreide beziehungsweise Getreideerzeugnisse, nicht allgemein Nahrung.
- source_word: וְנֹאכְלָה וְנִחְיֶה
  choice: damit wir essen und am Leben bleiben
  rationale: Die verbundenen Verbformen geben hier den Zweck des Beschaffens an. „Am Leben bleiben“ macht die existenzielle Dringlichkeit des hebräischen „leben“ im Deutschen natürlich deutlich.
