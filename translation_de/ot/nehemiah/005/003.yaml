  text: וְ/יֵשׁ֙ אֲשֶׁ֣ר אֹמְרִ֔ים שְׂדֹתֵ֛י/נוּ וּ/כְרָמֵ֥י/נוּ וּ/בָתֵּ֖י/נוּ אֲנַ֣חְנוּ עֹרְבִ֑ים וְ/נִקְחָ֥ה דָגָ֖ן בָּ/רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/003.yaml
  text: And there were others who said[a], “We are mortgaging our fields, our vineyards, and our houses to get grain during the famine.”
translation:
  language: de
  text: 'Andere sagten: „Wir verpfänden unsere Felder, Weinberge und Häuser[a], um während der Hungersnot Getreide zu bekommen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Sicherheit geben“. Das hebräische Verb bezeichnet hier, dass Eigentum als Sicherheit für eine Schuld eingesetzt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: Andere sagten
  rationale: Die Wendung führt in der Abfolge der Klagen eine weitere Gruppe ein. „Andere sagten“ gibt diese Funktion knapp und natürlich wieder.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ וּבָתֵּינוּ
  choice: unsere Felder, Weinberge und Häuser
  rationale: Die konkreten Begriffe für den Grund- und Hausbesitz werden unmittelbar und in derselben Reihenfolge wiedergegeben.
- source_word: אֲנַחְנוּ עֹרְבִים
  choice: Wir müssen … verpfänden
  rationale: Das Verb bezeichnet hier, Eigentum als Sicherheit für eine Schuld einzusetzen. „Verpfänden“ bildet dies im Deutschen präzise ab; „müssen“ macht die durch die Hungersnot erkennbare Zwangslage idiomatisch deutlich.
- source_word: וְנִקְחָה
  choice: damit wir … bekommen
  rationale: Die Form bezeichnet hier sinnvoll den Zweck des Verpfändens. „Bekommen“ wahrt die allgemeine Bedeutung von לקח, ohne einen im Hebräischen nicht ausdrücklich genannten Kaufvorgang einzutragen.
- source_word: דָגָן
  choice: Getreide
  rationale: דָגָן bezeichnet Getreide beziehungsweise Getreideerzeugnisse; „Getreide“ ist die präzise moderne Standardwiedergabe.
- source_word: בָּרָעָב
  choice: während der Hungersnot
  rationale: Die Präposition beschreibt die zeitlich-situativen Umstände. Diese Wiedergabe vermeidet es, die mögliche kausale Nuance ausdrücklich festzulegen.
