  yaml_path: translation/ot/nehemiah/005/016.yaml
  text: And I also applied myself to the work on this wall[a], and we did not buy any field[b], and all my young men were gathered there for the work.
translation:
  language: de
  text: Auch widmete ich mich der Arbeit an dieser Mauer[a], und wir kauften kein Feld. Alle meine Leute[b] waren dort für die Arbeit versammelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Auch beteiligte ich mich persönlich an der Arbeit an dieser Mauer.« Das zugrunde liegende Verb kann wörtlich ein Ergreifen oder Festhalten ausdrücken und bezeichnet hier wohl tatkräftigen persönlichen Einsatz.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »meine jungen Männer«, »meine Diener« oder »meine Gefolgsleute«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Gibt die additive Verknüpfung mit dem vorausgehenden Zusammenhang knapp und natürlich wieder.
- source_word: בִּמְלֶאכֶת הַחוֹמָה הַזֹּאת הֶחֱזַקְתִּי
  choice: packte ich bei den Arbeiten an dieser Mauer mit an
  rationale: Die Hifil-Form von חזק bezeichnet hier wahrscheinlich Nehemias tatkräftige persönliche Beteiligung. Die deutsche Wendung bewahrt diesen Sinn, ohne zu unterstellen, er habe die Mauer allein verstärkt.
- source_word: וְשָׂדֶה לֹא קָנִינוּ
  choice: und wir kauften kein Feld
  rationale: Bewahrt sowohl den Singular שָׂדֶה als auch die erste Person Plural von קנה und gibt den gewöhnlichen Sinn ‚kaufen‘ direkt wieder.
- source_word: נְעָרַי
  choice: meine jungen Männer
  rationale: Bewahrt den Grundsinn von נַעַר, ohne die im Kontext möglichen Rollen als Diener oder Gefolgsleute im Haupttext festzulegen.
- source_word: קְבוּצִים שָׁם עַל הַמְּלָאכָה
  choice: waren dort zur Arbeit versammelt
  rationale: Gibt das passive Partizip von קבץ sowie Ort und Zweck ihrer Versammlung in natürlichem Deutsch wieder.
