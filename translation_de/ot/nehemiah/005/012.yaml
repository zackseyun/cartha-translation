base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/012.yaml
  text: And they said[a], “We will restore it, and from them we will require nothing; we will do as you say.” Then I called the priests and made them swear to do according to this word.
translation:
  language: de
  text: 'Sie sagten: „Wir werden es zurückgeben und nichts von ihnen fordern. Wir werden tun, was du sagst.“ Darauf rief ich die Priester herbei und ließ sie[a] schwören, entsprechend dieser Zusage[b] zu handeln.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „ließ sie schwören“. Das hebräische Suffix kann sich auf die unmittelbar zuvor genannten Priester oder auf die Personen beziehen, die die Rückgabe zugesagt hatten.
    reason: referent_ambiguity
  - marker: b
    text: Das hebräische Wort דָּבָר kann „Wort“, „Sache“ oder im Zusammenhang eine verbindliche Zusage bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁיב
  choice: wir werden es zurückgeben
  rationale: Der Hifil von שׁוב bezeichnet hier die Rückgabe dessen, was den Bedürftigen abgenommen oder abgefordert worden war. Das im Hebräischen unausgesprochene Objekt wird im Deutschen durch „es“ aufgenommen.
- source_word: וּמֵהֶם לֹא נְבַקֵּשׁ
  choice: und nichts von ihnen fordern
  rationale: בקשׁ kann „suchen“, „verlangen“ oder „fordern“ bedeuten. Im wirtschaftlich-rechtlichen Zusammenhang bezeichnet „fordern“ den Verzicht auf weitere Ansprüche, ohne die Art dieser Ansprüche enger festzulegen.
- source_word: כֵּן נַעֲשֶׂה כַּאֲשֶׁר אַתָּה אוֹמֵר
  choice: Wir werden tun, was du sagst
  rationale: Die Formulierung gibt die ausdrückliche Zustimmung idiomatisch wieder. Das bekräftigende כֵּן wird durch den eigenständigen deutschen Satz und die eindeutige Zusage vermittelt.
- source_word: וָאֶקְרָא אֶת־הַכֹּהֲנִים
  choice: Darauf rief ich die Priester
  rationale: קרא mit direktem Objekt bedeutet „rufen“ oder „herbeirufen“. „Darauf“ bildet die erzählerische Abfolge des Waw-Konsekutivs natürlich ab.
- source_word: וָאַשְׁבִּיעֵם
  choice: ließ die Männer schwören
  rationale: Der Hifil von שׁבע bedeutet, jemanden schwören zu lassen beziehungsweise ihm einen Eid abzunehmen. „Die Männer“ nimmt im Kontext die gerade sprechenden Vornehmen und Amtsträger wieder auf, ohne sie erneut mit Titeln zu benennen.
- source_word: לַעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: gemäß diesem Wort zu handeln
  rationale: Die Wiedergabe bewahrt sowohl das Verb עשׂה als „handeln/tun“ als auch die Präposition כ „gemäß“. „Wort“ hält die Bedeutungsbreite von דָּבָר offen, statt sie ausschließlich als „Versprechen“ festzulegen.
theological_decisions:
- issue: Bezug des pronominalen Suffixes in וָאַשְׁבִּיעֵם
  choice: „die Männer“ bezieht sich im Haupttext auf die zuvor sprechenden Vornehmen und Amtsträger
  alternative: 'Das Suffix unmittelbar auf „die Priester“ beziehen: „ließ sie schwören“'
  rationale: Im Zusammenhang sollen diejenigen, die die Rückgabe zugesagt haben, diese Zusage eidlich bekräftigen; die herbeigerufenen Priester wirken dabei als kultisch-rechtliche Zeugen. Da der hebräische Satz grammatisch auch einen Bezug auf die Priester zulässt, wird die Alternative in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und verbindlich; die rechtlich-kultische Eideshandlung wird ohne konfessionelle Zusatzdeutung wiedergegeben.
