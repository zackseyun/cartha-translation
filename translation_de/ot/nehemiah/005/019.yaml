  language: en
  yaml_path: translation/ot/nehemiah/005/019.yaml
  text: Remember me[a], my God, for good, for all that I have done for this people.
translation:
  language: de
  text: Gedenke meiner, mein Gott, zum Guten[a], wegen allem, was ich für dieses Volk getan habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gedenke meiner, mein Gott, wohlwollend, wegen allem, was ich für dieses Volk getan habe.“'
    reason: Die Verbindung זָכְרָה לִּי … לְטוֹבָה kann idiomatisch als Bitte um wohlwollendes Gedenken verstanden werden. Die Wendung lässt dabei offen, ob vor allem Gottes günstige Zuwendung oder deren gutes Ergebnis betont wird.
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: Gedenke meiner
  rationale: Die Gebetsformel aus זכר mit לִי bittet Gott, den Betenden in den Blick zu nehmen. „Gedenke meiner“ ist im Deutschen würdig, verständlich und bewahrt den Charakter einer direkten Bitte.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Die Form mit Suffix bezeichnet Gott persönlich und steht hier als Anrede; „mein Gott“ gibt dies ohne altertümliches „o“ wieder.
- source_word: לְטוֹבָה
  choice: zum Guten
  rationale: Die Wendung bezeichnet ein wohlwollendes beziehungsweise heilsames Gedenken. „Zum Guten“ erhält die knappe hebräische Ausdrucksweise und lässt offen, ob Ergebnis oder günstige Zuwendung im Vordergrund steht.
- source_word: כֹּל אֲשֶׁר עָשִׂיתִי
  choice: für alles, was ich … getan habe
  rationale: Die Relativkonstruktion bedeutet „alles, was“; das Perfekt wird im rückblickenden Gebet natürlich mit dem deutschen Perfekt wiedergegeben.
- source_word: עַל הָעָם הַזֶּה
  choice: für dieses Volk
  rationale: עַל bezeichnet hier Handeln zugunsten des Volkes. „Für dieses Volk“ ist knapp, idiomatisch und bewahrt den kollektiven Singular.
theological_decisions:
- issue: Charakter von Nehemias Bitte um göttliches Gedenken
  choice: Bitte, dass Gott Nehemia angesichts seines Handelns für das Volk zum Guten gedenkt
  alternative: Anspruch auf Verdienst oder Bitte um öffentliche Rechtfertigung
  rationale: Der Wortlaut verbindet die Bitte ausdrücklich mit Nehemias Taten, legt jedoch nicht fest, ob damit Verdienst, Lohn, Bewahrung oder Rechtfertigung gemeint ist. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gedenke meiner“ ist gegenüber „Erinnere dich an mich“ leicht gehoben, aber als Gebetssprache weiterhin allgemein verständlich. Die Stellung der Anrede folgt eng dem Hebräischen; die Formulierung vermeidet eine konfessionelle Deutung der Bitte.
