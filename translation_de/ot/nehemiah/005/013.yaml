  text: גַּם חָצְנִ֣/י נָעַ֗רְתִּי וָֽ/אֹמְרָ֡/ה כָּ֣כָה יְנַעֵ֪ר הָֽ/אֱלֹהִ֟ים אֶת כָּל הָ/אִישׁ֩ אֲשֶׁ֨ר לֹֽא יָקִ֜ים אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה מִ/בֵּית/וֹ֙ וּ/מִ֣/יגִיע֔/וֹ וְ/כָ֛כָה יִהְיֶ֥ה נָע֖וּר וָ/רֵ֑ק וַ/יֹּאמְר֨וּ כָֽל הַ/קָּהָ֜ל אָמֵ֗ן וַֽ/יְהַלְלוּ֙ אֶת יְהוָ֔ה וַ/יַּ֥עַשׂ הָ/עָ֖ם כַּ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/013.yaml
  text: I also shook out the fold of my garment and said[a], “So may God shake out every man who does not fulfill this promise, from his house and from his labor; so may he be shaken out and emptied.” And all the assembly said, “Amen,” and praised Yahweh[c][b]. And the people did according to this promise.
translation:
  language: de
  text: 'Auch schüttelte ich den Bausch meines Gewandes aus[a] und sagte: »So soll Gott jeden Mann, der dieses Wort nicht erfüllt[b], aus seinem Haus und aus dem Ertrag seiner Arbeit[c] ausschütteln. So soll er ausgeschüttelt und leer sein!« Da sagte die ganze Versammlung: »Amen!«, und sie priesen Jahwe. Und das Volk handelte diesem Wort entsprechend.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der vordere Bausch des Gewandes, in dem man Dinge tragen konnte. Nehemias Geste stellt sinnbildlich dar, wie jemand ausgeschüttelt und all dessen beraubt wird, was er besitzt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »diese Verpflichtung nicht einhält« beziehungsweise »diese Sache nicht ausführt«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »aus seinem Haus und aus seiner Arbeit«. Das hebräische Wort kann die mühevolle Arbeit selbst oder ihren Ertrag bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָצְנִי
  choice: den Bausch meines Gewandes
  rationale: חָצֶן bezeichnet den als Behältnis dienenden vorderen Gewandbausch. „Gewandbausch“ gibt den konkreten Gegenstand der symbolischen Handlung prägnant wieder.
- source_word: נָעַרְתִּי / יְנַעֵר / נָעוּר
  choice: schüttelte ... aus / ausschütteln / ausgeschüttelt
  rationale: Die wiederholte Wurzel נער verbindet Nehemias Zeichenhandlung mit dem Fluchwort. Die konsequente Wiedergabe mit „ausschütteln“ bewahrt Wortspiel und Bild.
- source_word: כָּכָה
  choice: So soll
  rationale: Im Zusammenhang der symbolisch vollzogenen Selbstverfluchung leitet כָּכָה die entsprechende Fluchformel ein.
- source_word: כָּל הָאִישׁ
  choice: jeden Mann
  rationale: Die grammatisch maskuline singularische Form wird repräsentativ gebraucht; die Übersetzung wahrt ihre Form, ohne den Bezug auf jeden einzelnen Verpflichteten zu verlieren.
- source_word: יָקִים אֶת הַדָּבָר הַזֶּה
  choice: dieses Wort nicht erfüllt
  rationale: הקים דבר bezeichnet hier das Einhalten beziehungsweise Ausführen des zuvor feierlich Zugesagten. „Erfüllt“ gibt den Vollzug wieder, während „Wort“ die Wiederholung von דָּבָר im Vers bewahrt.
- source_word: מִבֵּיתוֹ וּמִיגִיעוֹ
  choice: aus seinem Haus und aus dem Ertrag seiner Arbeit
  rationale: יְגִיעַ kann sowohl Mühe/Arbeit als auch deren Ertrag bezeichnen. Im Kontext des Ausschüttelns und Leerwerdens passt der Ertrag der Arbeit besonders gut; die alternative Deutung wird in einer Fußnote erhalten.
- source_word: וָרֵק
  choice: und leer sein
  rationale: רֵק ist formal ein Adjektiv. „Leer sein“ bewahrt die knappe Zustandsbeschreibung und das Bild völliger Entleerung.
- source_word: הַקָּהָל
  choice: die ganze Versammlung
  rationale: קָהָל bezeichnet die versammelte Gemeinschaft; „Versammlung“ ist natürlich und konfessionell unbelastet.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כַדָּבָר הַזֶּה
  choice: diesem Wort entsprechend
  rationale: Die Wiedergabe bewahrt דָּבָר und bezeichnet zugleich verständlich die zuvor eingegangene Verpflichtung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration wahrt seinen Charakter als Eigenname.
- issue: Generisches Maskulinum הָאִישׁ
  choice: jeden Mann
  alternative: jeden Menschen / alle
  rationale: Die Übersetzung hält die maskuline Singularform fest, die im Kontext jeden einzelnen Mann unter den angesprochenen Verpflichteten bezeichnet.
- issue: Bedeutung von דָּבָר im Schwurkontext
  choice: Wort
  alternative: Versprechen / Verpflichtung
  rationale: „Wort“ erhält die lexikalische Wiederholung innerhalb des Verses und lässt offen, ob stärker die Zusage, die Abmachung oder die ganze Angelegenheit gemeint ist; der Kontext macht die Verpflichtung deutlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederaufnahme von נער wird mit Formen von „ausschütteln“ bewahrt. „Gewandbausch“ ist konkret, benötigt für heutige Leser jedoch eine kurze Erläuterung. Die Satzfolge und die feierliche Fluchformel bleiben nah am Hebräischen, ohne unnatürlich zu klingen.
