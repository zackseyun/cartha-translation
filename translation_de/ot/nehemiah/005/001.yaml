  text: וַ/תְּהִ֨י צַעֲקַ֥ת הָ/עָ֛ם וּ/נְשֵׁי/הֶ֖ם גְּדוֹלָ֑ה אֶל אֲחֵי/הֶ֖ם הַ/יְּהוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/001.yaml
  text: There arose a great outcry from the people and their wives against their Jewish brothers[a].
translation:
  language: de
  text: Da erhob sich ein großer Aufschrei der Leute und ihrer Frauen gegen ihre jüdischen Brüder[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre judäischen Brüder“. Der hebräische Ausdruck kann je nach ethnischem oder regionalem Schwerpunkt „jüdisch“ oder „judäisch“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: Da erhob sich
  rationale: Die Wayyiqtol-Form von היה führt eine neue Entwicklung in der Erzählung ein. „Da erhob sich“ gibt dies im Deutschen idiomatisch wieder, ohne ein ausdrückliches Zeitwort wie „nun“ in den Ausgangstext hineinzulesen.
- source_word: צַעֲקַת
  choice: Aufschrei
  rationale: Das Substantiv bezeichnet einen Not- oder Protestschrei. „Aufschrei“ bewahrt sowohl die emotionale Intensität als auch den öffentlichen Charakter der Klage.
- source_word: הָעָם
  choice: des Volkes
  rationale: Der Ausdruck bezeichnet allgemein das Volk beziehungsweise die Bevölkerung. Die Übersetzung vermeidet eine unnötige Verengung auf eine bestimmte soziale Schicht.
- source_word: וּנְשֵׁיהֶם
  choice: und seiner Frauen
  rationale: אשה bezeichnet in dieser Pluralkonstruktion mit Suffix am ehesten die Ehefrauen. „Seiner Frauen“ bewahrt ihre ausdrückliche Nennung und stimmt grammatisch mit dem kollektiven Singular „Volk“ überein.
- source_word: גְּדוֹלָה
  choice: großer
  rationale: Das Adjektiv beschreibt das Ausmaß beziehungsweise die Stärke des Aufschreis. „Groß“ ist die direkte und nicht weiter ausdeutende Entsprechung.
- source_word: אֶל
  choice: gegen
  rationale: Die Präposition bedeutet grundsätzlich „zu/auf … hin“, bezeichnet hier aber im Zusammenhang einer Beschwerde deren Ziel. „Gegen“ gibt diese adversative Bedeutung natürlich wieder.
- source_word: אֲחֵיהֶם
  choice: ihre Brüder
  rationale: Das Hebräische spricht wörtlich von „ihren Brüdern“ und betont damit die Zusammengehörigkeit innerhalb des Volkes. Diese Verwandtschafts- und Solidaritätssprache bleibt erhalten.
- source_word: הַיְּהוּדִים
  choice: jüdischen
  rationale: Das Wort kann eine ethnisch-religiöse oder eine regionale Zugehörigkeit bezeichnen. „Jüdisch“ ist im modernen Deutsch die natürliche Hauptwiedergabe; die historisch-regionale Alternative wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutungsumfang von הַיְּהוּדִים
  choice: jüdischen
  alternative: judäischen
  rationale: Im Zusammenhang geht es um Unrecht innerhalb der eigenen Gemeinschaft. „Jüdischen Brüder“ vermittelt diese innere Zusammengehörigkeit verständlich, ohne die mögliche regionale Bedeutung des Ausdrucks auszuschließen; diese bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, ist aber idiomatisch; die Spannung zwischen ethnischer und regionaler Bedeutung wird nicht im Haupttext aufgelöst, sondern durch die Fußnote offengehalten.
