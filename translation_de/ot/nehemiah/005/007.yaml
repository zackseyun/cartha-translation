base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/007.yaml
  text: Then I took counsel with myself[a], and I brought charges against the nobles and the officials, and I said to them, “You are exacting interest[c][b], each from his brother.” And I assembled a great assembly against them.
translation:
  language: de
  text: 'Da beriet ich mich mit mir selbst[a], erhob Anklage gegen die Vornehmen und die Amtsträger und sagte zu ihnen: »Ihr verlangt Zinsen, jeder von seinem Bruder[b].« Dann berief ich eine große Versammlung gegen sie ein[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Da beriet sich mein Herz über mich.« Gemeint ist eine innere Beratung oder gründliche Überlegung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »jeder von seinem Volksgenossen«. Wörtlich steht »seinem Bruder«; damit wird hervorgehoben, dass Israeliten ihre eigenen Landsleute belasteten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Dann setzte/gab ich gegen sie eine große Versammlung«; gemeint ist offenbar, dass Nehemia eine große öffentliche Versammlung einberief, um sie zur Rechenschaft zu ziehen.'
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיִּמָּלֵךְ לִבִּי עָלַי
  choice: Da beriet ich mich mit mir selbst
  rationale: Die hebräische Wendung bezeichnet hier innere Beratung beziehungsweise Überlegung. Die Übersetzung gibt ihren reflexiven Sinn natürlich wieder, ohne die Aussage auf bloßen Zorn zu reduzieren.
- source_word: וָאָרִיבָה
  choice: erhob Anklage gegen
  rationale: ריב kann sowohl Streit und Auseinandersetzung als auch das Vorbringen einer Anklage bezeichnen. Der quasi-rechtliche Zusammenhang stützt „Anklage erheben“, während eine Fußnote die allgemeinere Bedeutung bewahrt.
- source_word: הַחֹרִים
  choice: die Vornehmen
  rationale: Das Wort bezeichnet die gesellschaftlich führende Oberschicht. „Vornehme“ ist in diesem historischen Zusammenhang verständlich und weniger missverständlich als das moderne Adelsprädikat „Adlige“.
- source_word: הַסְּגָנִים
  choice: die Amtsträger
  rationale: Der Ausdruck bezeichnet leitende oder nachgeordnete Verwaltungsbeamte. „Amtsträger“ bleibt verständlich, ohne einen nicht gesicherten konkreten Rang festzulegen.
- source_word: מַשָּׁא
  choice: Zinsen
  rationale: Im Zusammenhang mit Darlehen bezeichnet das Substantiv die auferlegte finanzielle Last, hier naheliegend Zinsen. „Wucher“ würde im heutigen Deutsch übermäßige oder rechtswidrige Zinssätze voraussetzen.
- source_word: אִישׁ בְּאָחִיו
  choice: jeder von seinem Bruder
  rationale: Die Formulierung bewahrt sowohl die distributive Bedeutung von אִישׁ als auch die Verwandtschafts- und Bundesgemeinschaftssprache von אָח.
- source_word: נשאים
  choice: verlangt
  rationale: Das Partizip von נשׂא hat hier den Sinn, eine Last beziehungsweise Zinsen aufzuerlegen oder einzufordern. „Verlangt“ ist im Deutschen natürlich und erhält den anklagenden Ton.
- source_word: וָאֶתֵּן עֲלֵיהֶם קְהִלָּה גְדוֹלָה
  choice: Dann berief ich eine große Versammlung gegen sie ein
  rationale: נתן bedeutet wörtlich „geben/setzen“, bildet hier aber mit קְהִלָּה eine Wendung für das Einberufen einer Versammlung. „Gegen sie“ erhält die gegnerische Ausrichtung von עֲלֵיהֶם.
