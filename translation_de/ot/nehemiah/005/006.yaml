  text: וַ/יִּ֥חַר לִ֖/י מְאֹ֑ד כַּ/אֲשֶׁ֤ר שָׁמַ֨עְתִּי֙ אֶת זַֽעֲקָתָ֔/ם וְ/אֵ֖ת הַ/דְּבָרִ֥ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/006.yaml
  text: I became very angry when I heard their outcry and these words[a].
translation:
  language: de
  text: Als ich ihren Aufschrei und diese Worte[a] hörte, wurde ich sehr zornig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und diese Vorgänge“. Das hebräische Wort kann sowohl gesprochene Worte als auch die berichteten Angelegenheiten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לִי מְאֹד
  choice: wurde ich sehr zornig
  rationale: Die hebräische Wendung חרה + ל beschreibt aufkommenden, heftigen Zorn. Die gewählte Formulierung gibt das Idiom natürlich und mit passender Stärke wieder, ohne das im Deutschen unübliche Bild des Brennens wörtlich zu übernehmen.
- source_word: כַּאֲשֶׁר
  choice: als
  rationale: Die Konjunktion bezeichnet hier den Zeitpunkt beziehungsweise Anlass von Nehemias Zorn. „Als“ ist in diesem erzählenden Vergangenheitskontext idiomatisches Standarddeutsch.
- source_word: שָׁמַעְתִּי
  choice: ich … hörte
  rationale: שמע bezeichnet hier das Wahrnehmen der Klage und der vorgebrachten Aussagen. „hören“ ist die direkte, kontextgerechte Wiedergabe.
- source_word: זַעֲקָתָם
  choice: ihr Klagegeschrei
  rationale: זעקה meint einen lauten Ruf aus Not oder Protest. „Klagegeschrei“ bewahrt sowohl die emotionale Dringlichkeit als auch den Charakter einer sozialen Beschwerde.
- source_word: וְאֵת הַדְּבָרִים הָאֵלֶּה
  choice: und diese Worte
  rationale: דברים kann sowohl gesprochene Worte als auch Angelegenheiten oder Sachverhalte bezeichnen. „diese Worte“ passt unmittelbar zum Verb „hören“; die sachbezogene Bedeutung bleibt in der Fußnote sichtbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung stellt den auslösenden Anlass voran und klingt in deutscher Erzählprosa natürlich. „Klagegeschrei“ ist stärker als „Klage“, aber weniger missverständlich als das mögliche „Aufschrei“.
