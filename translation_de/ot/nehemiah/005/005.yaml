  text: וְ/עַתָּ֗ה כִּ/בְשַׂ֤ר אַחֵ֨י/נוּ֙ בְּשָׂרֵ֔/נוּ כִּ/בְנֵי/הֶ֖ם בָּנֵ֑י/נוּ וְ/הִנֵּ֣ה אֲנַ֣חְנוּ כֹ֠בְשִׁים אֶת בָּנֵ֨י/נוּ וְ/אֶת בְּנֹתֵ֜י/נוּ לַ/עֲבָדִ֗ים וְ/יֵ֨שׁ מִ/בְּנֹתֵ֤י/נוּ נִכְבָּשׁוֹת֙ וְ/אֵ֣ין לְ/אֵ֣ל יָדֵ֔/נוּ וּ/שְׂדֹתֵ֥י/נוּ וּ/כְרָמֵ֖י/נוּ לַ/אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/005.yaml
  text: And now[a], our flesh is like the flesh of our brothers, our children like their children; yet here we are, forcing our sons and our daughters into slavery, and some of our daughters have already been enslaved. But it is not in our power to help[b], and our fields and our vineyards belong to others.
translation:
  language: de
  text: 'Und nun: Unser Fleisch ist wie das Fleisch unserer Brüder[a], und unsere Kinder sind wie ihre Kinder. Doch wir zwingen unsere Söhne und Töchter in die Sklaverei, und einige unserer Töchter sind bereits versklavt. Wir haben keine Macht, etwas dagegen zu tun[b], denn unsere Felder und Weinberge gehören anderen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Unser Fleisch ist wie das Fleisch unserer Brüder.“ Das konkrete Bild betont die gemeinsame Menschlichkeit und Verwandtschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Unsere Hand hat keine Macht.“ Gemeint ist, dass ihnen die Macht und die Mittel fehlen, zumal ihre Felder und Weinberge anderen gehören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּבְשַׂר אַחֵינוּ בְּשָׂרֵנוּ
  choice: Wir sind von demselben Fleisch wie unsere Brüder
  rationale: Bewahrt das konkrete hebräische Bild des gemeinsamen Fleisches und gibt zugleich die Aussage über gemeinsame Menschlichkeit und Verwandtschaft in natürlichem Deutsch wieder.
- source_word: אַחֵינוּ
  choice: unsere Brüder
  rationale: Entspricht dem maskulinen Verwandtschaftsausdruck des Hebräischen; im Zusammenhang sind die Angehörigen der eigenen Gemeinschaft gemeint.
- source_word: כִּבְנֵיהֶם בָּנֵינוּ
  choice: unsere Kinder sind wie ihre Kinder
  rationale: בנים kann Söhne oder kollektiv Kinder bezeichnen. Da anschließend Söhne und Töchter eigens genannt werden, passt hier der umfassende Sinn „Kinder“.
- source_word: כֹבְשִׁים ... לַעֲבָדִים
  choice: müssen ... in die Sklaverei geben
  rationale: Der Zusammenhang beschreibt eine durch wirtschaftliche Not erzwungene Überführung der Kinder in Schuldsklaverei. „Müssen“ bringt den Zwang der klagenden Eltern zum Ausdruck, ohne die harte Realität der Sklaverei abzuschwächen.
- source_word: מִבְּנֹתֵינוּ נִכְבָּשׁוֹת
  choice: einige unserer Töchter sind bereits versklavt
  rationale: Das passive Partizip bezeichnet den bestehenden Zustand der Töchter, die schon unter fremde Gewalt und in Sklaverei geraten sind.
- source_word: וְאֵין לְאֵל יָדֵנוּ
  choice: Wir haben keine Macht, etwas dagegen zu tun
  rationale: Gibt die idiomatische Aussage über fehlende Macht oder Mittel klar wieder; אֵל wird hier als „Macht“ verstanden, nicht als Gottesbezeichnung.
- source_word: וּשְׂדֹתֵינוּ וּכְרָמֵינוּ לַאֲחֵרִים
  choice: denn unsere Felder und Weinberge gehören anderen
  rationale: Die verblosen Nominalsätze bezeichnen den Besitz beziehungsweise die Verfügung anderer über die wirtschaftliche Lebensgrundlage. Das kausale „denn“ macht den im Zusammenhang naheliegenden Erklärungsbezug deutlich.
theological_decisions:
- issue: Verwandtschaftssprache in der sozialen Klage
  choice: „Brüder“ beibehalten, im parallelen Satz jedoch „Kinder“ verwenden
  alternative: Durchgehend „Verwandte“ oder durchgehend „Brüder“ und „Söhne“
  rationale: So bleibt die konkrete maskuline Verwandtschaftsbezeichnung erhalten, während der kollektiv mögliche Sinn von בנים und die anschließende ausdrückliche Nennung von Söhnen und Töchtern berücksichtigt werden.
- issue: Stärke der Sprache für Schuldsklaverei
  choice: „Sklaverei“ und „versklavt“
  alternative: „Knechtschaft“, „Dienstbarkeit“ oder „dienstbar gemacht“
  rationale: Die wirtschaftlich erzwungene Preisgabe der Kinder in einen unfreien Status darf sprachlich nicht verharmlost werden.
- issue: Bezug von אֵל
  choice: als gewöhnliches Substantiv „Macht“
  alternative: als Gottesbezeichnung
  rationale: Die feste Wendung mit „Hand“ bezeichnet hier das Fehlen von Macht oder Mitteln; der Kontext gibt keinen Anlass, אֵל als Gottesnamen zu verstehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das konkrete Fleisch-Bild wird in idiomatischer Form bewahrt; die Sklavereisprache bleibt bewusst deutlich. Die soziale Klage klingt dringlich, ohne zusätzliche moralische oder konfessionelle Deutung einzutragen.
