source:
  edition: WLC
  text: תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַשֶּׁ֣בֶת וְֽ/עֵינֶ֪י/ךָ פְתֻוּח֟וֹת לִ/שְׁמֹ֣עַ אֶל תְּפִלַּ֣ת עַבְדְּ/ךָ֡ אֲשֶׁ֣ר אָנֹכִי֩ מִתְפַּלֵּ֨ל לְ/פָנֶ֤י/ךָ הַ/יּוֹם֙ יוֹמָ֣ם וָ/לַ֔יְלָה עַל בְּנֵ֥י יִשְׂרָאֵ֖ל עֲבָדֶ֑י/ךָ וּ/מִתְוַדֶּ֗ה עַל חַטֹּ֤אות בְּנֵֽי יִשְׂרָאֵל֙ אֲשֶׁ֣ר חָטָ֣אנוּ לָ֔/ךְ וַ/אֲנִ֥י וּ/בֵית אָבִ֖/י חָטָֽאנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/006.yaml
  text: Please let your ear be attentive and your eyes open to hear the prayer of your servant that I am now praying before you day and night, for the sons of Israel, your servants, while confessing the sins of the sons of Israel that we have sinned against you. I and my father's house have sinned.
translation:
  language: de
  text: Lass doch dein Ohr aufmerksam und deine Augen offen sein, damit du das Gebet deines Dieners hörst, das ich heute, Tag und Nacht, vor dir bete für die Söhne Israels, deine Diener, während ich die Sünden der Söhne Israels bekenne, die wir gegen dich begangen haben. Auch ich und das Haus meines Vaters haben gesündigt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהִי נָא
  choice: Lass doch ... sein
  rationale: Der Jussiv mit נָא formuliert eine ehrerbietige Bitte; „doch“ gibt den flehentlichen Ton natürlich wieder.
- source_word: אָזְנְךָ קַשֶּׁבֶת וְעֵינֶיךָ פְתֻוּחוֹת
  choice: dein Ohr aufmerksam und deine Augen offen sein
  rationale: Die anthropomorphe Parallelität und der Numerus des Hebräischen bleiben erhalten.
- source_word: לִשְׁמֹעַ אֶל תְּפִלַּת עַבְדְּךָ
  choice: damit du das Gebet deines Dieners hörst
  rationale: Der Infinitiv bezeichnet hier den Zweck der erbetenen Aufmerksamkeit; „Diener“ passt zur ehrerbietigen Gebetssprache.
- source_word: אֲשֶׁר אָנֹכִי מִתְפַּלֵּל לְפָנֶיךָ הַיּוֹם יוֹמָם וָלַיְלָה
  choice: das ich heute Tag und Nacht vor dir bete
  rationale: „Heute“ gibt הַיּוֹם ausdrücklich wieder, während „Tag und Nacht“ die fortdauernde Gebetspraxis bezeichnet; die präsentische Form vermittelt den andauernden Vorgang.
- source_word: עַל בְּנֵי יִשְׂרָאֵל עֲבָדֶיךָ
  choice: für die Söhne Israels, deine Diener
  rationale: עַל ist im Gebetszusammenhang „für“; „Söhne Israels“ bewahrt die familiale Bundesbezeichnung des Ausgangstextes.
- source_word: וּמִתְוַדֶּה
  choice: während ich ... bekenne
  rationale: Das Partizip bezeichnet eine zur Gebetshandlung gleichzeitige Tätigkeit.
- source_word: אֲשֶׁר חָטָאנוּ לָךְ
  choice: die wir gegen dich begangen haben
  rationale: Im Deutschen verbindet sich „Sünden begehen“ natürlich mit dem Relativsatz; „gegen dich“ wahrt die ethische Ausrichtung des ל.
- source_word: וַאֲנִי וּבֵית אָבִי חָטָאנוּ
  choice: Auch ich und das Haus meines Vaters haben gesündigt
  rationale: „Auch“ hebt Nehemias persönliche und familiäre Einbeziehung hervor, ohne eine stärkere Kontrastbedeutung zu erzwingen; „Haus meines Vaters“ bewahrt den biblischen Familienverbandsbegriff.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Ohr und Augen
  choice: Die Körpermetaphorik wird unmittelbar beibehalten.
  alternative: Paraphrase wie „Achte darauf und sieh hin“.
  rationale: Das Gebet verwendet bewusst anschauliche Sprache für Gottes Aufmerksamkeit; eine Auflösung würde die Rhetorik abschwächen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten / Volk Israel / Kinder Israels
  rationale: Die gewählte Form bewahrt den ausdrücklich familialen Ausdruck und seine bundestheologische Färbung, auch wenn idiomatischere deutsche Kollektivbezeichnungen möglich sind.
- issue: Einbeziehung Nehemias und seines Vaterhauses in die Schuld
  choice: Auch ich und das Haus meines Vaters haben gesündigt.
  alternative: Ich und das Haus meines Vaters haben gesündigt.
  rationale: Das vorangestellte וַאֲנִי greift die gemeinschaftliche Beichte auf und schließt den Beter samt Familienverband ausdrücklich ein; „auch“ bildet diese Anschlussfunktion ab, ohne „sogar“ als stärkere Hervorhebung einzutragen.
translation_notes:
  register: Moderne, würdige Gebetssprache mit enger Bindung an die hebräische Bildwelt. Die etwas markierte Formulierung „Söhne Israels“ ist bewusst quellennah; Satzbau und Verbverbindungen sind zugleich für heutige deutschsprachige Leser geglättet.
