revisions:
- from: 'Und sie sagten zu mir: »Die Übriggebliebenen, die von der Gefangenschaft[a] übrig geblieben sind, befinden sich dort in der Provinz in großer Not und Schande. Die Mauer Jerusalems ist durchbrochen, und ihre Tore sind mit Feuer verbrannt worden.«'
  to: 'Und sie sagten zu mir: »Die Übriggebliebenen, die die Gefangenschaft[a] überlebt haben, befinden sich dort in der Provinz in großer Not und Schande. Die Mauer Jerusalems ist durchbrochen, und ihre Tore sind im Feuer verbrannt worden.«'
  rationale: Die Revision ersetzt allein die unnatürliche, missverständliche doppelte Formulierung „übrig geblieben“ durch eine idiomatische Wiedergabe des Sinns von „die Gefangenschaft überlebt haben“. Die Alternative „Exil“ bleibt als Fußnote erhalten. Die Aussage über die Tore wird in natürliches Standarddeutsch geglättet, ohne den hebräischen Hinweis auf Feuer abzuschwächen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:20:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des Hebräischen zutreffend wieder: die verbliebene Gruppe, die Gefangenschaft bzw. das Exil, die Provinz, Not und Schande sowie die beschädigte Mauer und die verbrannten Tore. Die Formulierung „von der Gefangenschaft übrig geblieben“ ist jedoch im Deutschen semantisch und syntaktisch unerquicklich; sie kann nahelegen, die Gefangenschaft selbst habe etwas ‚übrig gelassen‘. „die die Gefangenschaft überlebt haben“ gibt נִשְׁאֲרוּ מִן־הַשְּׁבִי idiomatisch und quellentreu wieder.'
  naturalness: Die doppelte Verwendung von „übrig geblieben“ wirkt im Deutschen deutlich unnatürlich und schwer verständlich. Die Wiederholung der hebräischen Wurzel muss nicht mechanisch reproduziert werden, wenn dadurch die moderne Standardsprache beeinträchtigt wird. Auch „im Feuer verbrannt worden“ ist für die passive Aussage über die Tore idiomatischer als „mit Feuer verbrannt worden“.
  terminology: „Provinz“, „große Not“, „Schande“ und „Mauer Jerusalems“ sind angemessen. Die Fußnote „vom Exil“ bewahrt die legitime lexikalische Alternative zu „der Gefangenschaft“.
  issues:
  - severity: medium
    issue: Unidiomatische Wiedergabe der Wiederholung von שׁאר
    rationale: „Die Übriggebliebenen, die von der Gefangenschaft übrig geblieben sind“ ist modernes Deutsch weder flüssig noch klar. Die Bedeutung wird zuverlässig mit „Die Übriggebliebenen, die die Gefangenschaft überlebt haben“ ausgedrückt.
  - severity: low
    issue: Formulierung zur Verbrennung der Tore
    rationale: „mit Feuer verbrannt worden“ ist zwar verständlich, aber „im Feuer verbrannt worden“ ist im Deutschen bei diesem passiven Vorgang natürlicher und erhält die ausdrückliche Nennung des Feuers.
