base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/003.yaml
  text: And they said to me[a], “The remnant there in the province who survived the captivity are in great trouble and disgrace, and the wall of Jerusalem is broken down[b], and its gates have been burned with fire.”
translation:
  language: de
  text: 'Und sie sagten zu mir: »Die Übriggebliebenen, die die Gefangenschaft[a] überlebt haben, befinden sich dort in der Provinz in großer Not und Schande. Die Mauer Jerusalems ist durchbrochen, und ihre Tore sind im Feuer verbrannt worden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Exil«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים / נִשְׁאֲרוּ
  choice: die Übriggebliebenen, die … übrig geblieben sind
  rationale: Die Wiederholung von Formen der Wurzel שׁאר wird bewusst bewahrt; sie hebt die nach der Katastrophe verbliebene Gruppe hervor.
- source_word: מִן הַשְּׁבִי
  choice: von der Gefangenschaft
  rationale: Die Wendung kann den Zustand beziehungsweise das Geschehen der Gefangenschaft oder des Exils bezeichnen. „Gefangenschaft“ gibt die Substantivform direkt wieder, ohne die mögliche Bedeutung „Exil“ auszuschließen.
- source_word: בַּמְּדִינָה
  choice: dort in der Provinz
  rationale: מְדִינָה bezeichnet im perserzeitlichen Verwaltungszusammenhang eine Provinz; „dort“ gibt das hebräische שָׁם natürlich wieder.
- source_word: בְּרָעָה גְדֹלָה
  choice: in großer Not
  rationale: רָעָה bezeichnet hier keine moralische Bosheit, sondern schwere Bedrängnis oder widrige Lebensumstände.
- source_word: וּבְחֶרְפָּה
  choice: und Schande
  rationale: חֶרְפָּה meint öffentliche Beschämung, Entehrung oder Schmach; „Schande“ ist im heutigen Deutsch klar und verständlich.
- source_word: חוֹמַת יְרוּשָׁלִַם מְפֹרָצֶת
  choice: Die Mauer Jerusalems ist durchbrochen
  rationale: Das passive Partizip von פרץ beschreibt eine Mauer, die Breschen aufweist beziehungsweise durchbrochen wurde. „Ist durchbrochen“ bewahrt sowohl den Zustand als auch das Bild beschädigter Befestigungen.
- source_word: וּשְׁעָרֶיהָ נִצְּתוּ בָאֵשׁ
  choice: und ihre Tore sind mit Feuer verbrannt worden
  rationale: Die Form bezeichnet die durch Feuer bewirkte Zerstörung. Das deutsche Perfekt stellt das gegenwärtige Ergebnis des vergangenen Geschehens heraus und wahrt die ausdrückliche Nennung des Feuers.
- source_word: וַיֹּאמְרוּ לִי
  choice: Und sie sagten zu mir
  rationale: Die einfache narrative Fortführung wird ohne zusätzliche zeitliche oder deutende Nuance wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wiederholung von „übrig geblieben“ folgt bewusst dem hebräischen Wortlaut; „Provinz“ bewahrt den perserzeitlichen Verwaltungsbezug. Die Übersetzung vermeidet eine Festlegung darauf, ob שְׁבִי vorrangig Gefangenschaft oder Exil bezeichnet.
