source:
  edition: WLC
  text: וָ/אֹמַ֗ר אָֽנָּ֤א יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם הָ/אֵ֥ל הַ/גָּד֖וֹל וְ/הַ/נּוֹרָ֑א שֹׁמֵ֤ר הַ/בְּרִית֙ וָ/חֶ֔סֶד לְ/אֹהֲבָ֖י/ו וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/005.yaml
  text: And I said[a], “Please, O Yahweh, God of heaven, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
translation:
  language: de
  text: 'Und ich sagte: „Ach, Jahwe, Gott des Himmels, du großer und Ehrfurcht gebietender Gott[a], der denen, die ihn lieben und seine Gebote halten, den Bund und die beständige Liebe[b] bewahrt,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Furcht einflößender Gott“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Bundestreue“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Und ich sagte
  rationale: Das Wayyiqtol führt Nehemias Gebet als nächsten Schritt der Erzählung ein; „Und ich sagte“ wahrt diese Abfolge, ohne den Zusammenhang stärker auszudeuten.
- source_word: אָֽנָּא
  choice: Ach
  rationale: Die Partikel drückt eine eindringliche, ehrerbietige Bitte aus. „Ach“ ist in einem Gebet natürlich und würdevoll; ein isoliertes „Bitte“ vor der Anrede klänge im Deutschen weniger idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Gott des Himmels
  rationale: Die deutsche Singularform ist die übliche idiomatische Wiedergabe der hebräischen Konstruktverbindung.
- source_word: הָאֵל הַגָּדוֹל וְהַנּוֹרָא
  choice: du großer und Ehrfurcht gebietender Gott
  rationale: Die direkte Anrede mit „du“ ist im Deutschen natürlich. „Ehrfurcht gebietend“ bewahrt den Gedanken, dass Gott Furcht und ehrfürchtiges Staunen hervorruft, ohne die abgeschwächte Alltagssprache von „großartig“ oder eine ausschließlich bedrohliche Bedeutung einzutragen.
- source_word: שֹׁמֵר
  choice: der … bewahrt
  rationale: Das Partizip beschreibt Gott als den, der fortdauernd an Bund und loyaler Liebe festhält. „Bewahrt“ lässt sich im Deutschen auf beide folgenden Begriffe beziehen.
- source_word: הַבְּרִית
  choice: den Bund
  rationale: Der bestimmte Begriff bezeichnet den Bund als verbindliche Beziehung; die etablierte Wiedergabe „Bund“ bleibt erhalten.
- source_word: וָחֶסֶד
  choice: und die beständige Liebe
  rationale: חֶסֶד bezeichnet hier im Zusammenhang mit dem Bund loyale, verlässliche Liebe. „Beständige Liebe“ ist verständlich und erhält sowohl den Beziehungs- als auch den Treueaspekt; die bündische Nuance wird in einer Fußnote kenntlich gemacht.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו
  choice: denen, die ihn lieben und seine Gebote halten
  rationale: Die beiden parallelen Partizipialgruppen werden als ein gemeinsamer Empfängerkreis wiedergegeben. „Gebote halten“ entspricht der etablierten Bundessprache und ist zugleich allgemein verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von חֶסֶד im Bundeskontext
  choice: beständige Liebe
  alternative: Bundestreue
  rationale: Die gewählte Formulierung hält Liebe und verlässliche Loyalität zusammen, ohne חֶסֶד auf einen rein rechtlichen Begriff zu verengen. „Bundestreue“ bleibt als sachlich wichtige Alternative in der Fußnote erhalten.
- issue: Bedeutungsumfang von נוֹרָא
  choice: Ehrfurcht gebietend
  alternative: Furcht einflößend
  rationale: Die Form bezeichnet Gott als jemanden, der Furcht beziehungsweise Ehrfurcht hervorruft. Die Hauptfassung wahrt die religiöse Ehrfurcht, während die Fußnote die stärkere Furchtnuance offenhält.
translation_notes:
  register: Moderne, würdige Gebetssprache. Die einleitende Partikel wird mit „Ach“ statt mit dem im Deutschen unnatürlicheren „Bitte, o …“ wiedergegeben. Der Vers bleibt mit einem Komma offen, weil das Gebet im folgenden Vers syntaktisch weitergeführt wird.
