revisions:
- from: Da kam Hanani, einer meiner Brüder, mit einigen Männern aus Juda. Ich fragte sie nach den Juden[a], den Entkommenen[b], die von der Gefangenschaft[c] übrig geblieben waren, und nach Jerusalem.
  to: Da kam Hanani, einer meiner Brüder, zusammen mit einigen Männern aus Juda. Ich fragte sie nach den Juden[a], den Entkommenen[b], die nach der Gefangenschaft[c] übrig geblieben waren, und nach Jerusalem.
  rationale: Die Revision beseitigt eine im Deutschen unnatürliche und potenziell missverständliche Präpositionalverbindung. Sie bewahrt die Unterscheidung zwischen den „Entkommenen“ und denjenigen, die nach der Gefangenschaft übrig geblieben waren. Die Exil-Alternative wird entsprechend der revidierten deutschen Konstruktion als „nach dem Exil“ formuliert.
