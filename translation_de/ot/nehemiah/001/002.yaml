base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/002.yaml
  text: Hanani[a], one of my brothers, came—he and some men from Judah—and I asked them about the Jews who had escaped, who were left from the captivity[c][b], and about Jerusalem.
translation:
  language: de
  text: Da kam Hanani, einer meiner Brüder, zusammen mit einigen Männern aus Juda. Ich fragte sie nach den Juden[a], den Entkommenen[b], die nach der Gefangenschaft[c] übrig geblieben waren, und nach Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Judäern“. Das hebräische Wort kann die Menschen aus Juda oder das jüdische Volk im weiteren Sinn bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Überlebenden“ beziehungsweise „dem Rest“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „nach dem Exil“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kam
  rationale: Das Wayyiqtol führt das nächste Ereignis der Erzählung fort; „Da kam“ ist im Deutschen natürlich und wahrt die narrative Folge.
- source_word: חֲנָנִי
  choice: Hanani
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: אֶחָד מֵאַחַי הוּא
  choice: einer meiner Brüder
  rationale: Die Formulierung bewahrt die konkrete familiäre Bezeichnung; das Hebräische legt hier nicht ausdrücklich die weitere Bedeutung „Verwandter“ fest.
- source_word: וַאֲנָשִׁים מִיהוּדָה
  choice: mit einigen Männern aus Juda
  rationale: Obwohl die hebräische Fügung wörtlich mit „und Männer aus Juda“ anschließt, gibt „mit“ idiomatisch wieder, dass sie Hanani begleiteten; „einige“ macht die unbestimmte Mehrzahl natürlich, ohne eine genaue Zahl zu behaupten.
- source_word: וָאֶשְׁאָלֵם
  choice: Ich fragte sie
  rationale: שׁאל bezeichnet hier eine Erkundigung; die schlichte deutsche Form ist klar und gegenwärtig.
- source_word: הַיְּהוּדִים
  choice: die Juden
  rationale: Im perserzeitlichen Zusammenhang kann der Ausdruck Bewohner Judas oder das jüdische Volk bezeichnen. „Juden“ ist hier die natürliche breitere Wiedergabe; die Alternative wird in einer Fußnote erhalten.
- source_word: הַפְּלֵיטָה
  choice: den Entkommenen
  rationale: Das kollektive Substantiv bezeichnet die entkommene beziehungsweise gerettete Gruppe. Die substantivische Wiedergabe bewahrt die hebräische Satzstruktur und vermeidet eine vorschnelle Gleichsetzung mit dem theologischen Begriff „Rest“.
- source_word: אֲשֶׁר נִשְׁאֲרוּ
  choice: die … übrig geblieben waren
  rationale: Die Formulierung erhält den resultativen Sinn von שׁאר und bezieht den Relativsatz verständlich auf die Entkommenen.
- source_word: מִן הַשֶּׁבִי
  choice: von der Gefangenschaft
  rationale: שׁבי kann Gefangenschaft, Verschleppung oder Exil bezeichnen. „Gefangenschaft“ bleibt nahe an der lexikalischen Form; „Exil“ wird als kontextuelle Alternative vermerkt.
- source_word: וְעַל יְרוּשָׁלִָם
  choice: und nach Jerusalem
  rationale: Nach „fragen“ ist „nach“ die natürliche deutsche Wiedergabe von עַל zur Bezeichnung des Gegenstands der Erkundigung.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die zwei hebräischen Beschreibungen der betroffenen Gruppe („die Entkommenen“ und „die … übrig geblieben waren“) bleiben unterscheidbar. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
