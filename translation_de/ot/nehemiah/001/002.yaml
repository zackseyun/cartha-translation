    issue: Missverständliche deutsche Fügung bei „von der Gefangenschaft übrig geblieben waren“
    rationale: מן השבי qualifiziert die Verbliebenen als die nach bzw. aus der Gefangenschaft/Verbannung verbliebene Gruppe. Die vorhandene deutsche Präposition „von“ ist hier nicht natürlich und verschleiert die zeitlich-historische Beziehung. „nach der Gefangenschaft“ wahrt den Sinn ohne die Deutung über das hinaus zu präzisieren.
