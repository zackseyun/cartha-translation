  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָנָּ֣א אֲדֹנָ֗/י תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַ֠שֶּׁבֶת אֶל תְּפִלַּ֨ת עַבְדְּ/ךָ֜ וְ/אֶל תְּפִלַּ֣ת עֲבָדֶ֗י/ךָ הַֽ/חֲפֵצִים֙ לְ/יִרְאָ֣ה אֶת שְׁמֶ֔/ךָ וְ/הַצְלִֽיחָ/ה נָּ֤א לְ/עַבְדְּ/ךָ֙ הַ/יּ֔וֹם וּ/תְנֵ֣/הוּ לְ/רַחֲמִ֔ים לִ/פְנֵ֖י הָ/אִ֣ישׁ הַ/זֶּ֑ה וַ/אֲנִ֛י הָיִ֥יתִי מַשְׁקֶ֖ה לַ/מֶּֽלֶךְ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/011.yaml
  text: Please[a], Lord, let your ear be attentive to the prayer of your servant and to the prayer of your servants who delight to fear your name, and please give success to your servant today and grant him compassion before this man[c][b]. Now I was cupbearer to the king.
translation:
  language: de
  text: Ach, Herr, hab doch ein offenes Ohr für das Gebet deines Dieners und für das Gebet deiner Diener, die Freude daran haben, deinen Namen zu fürchten[a]. Lass es deinem Diener heute doch gelingen und lass ihn bei diesem Mann Erbarmen finden[b][c]. Ich aber war Mundschenk des Königs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die deinen Namen gern verehren“ beziehungsweise „die mit Ehrfurcht vor deinem Namen leben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und verschaffe ihm Gunst bei diesem Mann“. Wörtlich spricht das Hebräische davon, ihn „zum Erbarmen“ zu geben.'
    reason: lexical_alternative
  - marker: c
    text: Mit „diesem Mann“ ist der König gemeint, als dessen Mundschenk Nehemia sich im folgenden Satz bezeichnet.
    reason: cross_reference
lexical_decisions:
- source_word: אָנָּא אֲדֹנָי
  choice: Ach, Herr
  rationale: אָנָּא ist eine eindringliche Bittepartikel. „Ach“ bewahrt den flehentlichen Gebetston; אֲדֹנָי ist hier die direkte Anrede „Herr“, nicht der Gottesname JHWH.
- source_word: תְּהִי נָא אָזְנְךָ קַשֶּׁבֶת
  choice: hab doch ein offenes Ohr
  rationale: Die natürliche deutsche Wendung bewahrt das hebräische Bild vom aufmerksamen Ohr und bringt durch „doch“ die Bittepartikel נָא zum Ausdruck.
- source_word: תְּפִלַּת עַבְדְּךָ … תְּפִלַּת עֲבָדֶיךָ
  choice: das Gebet deines Dieners … das Gebet deiner Diener
  rationale: „Diener“ gibt עֶבֶד in der demütigen Gebetssprache angemessen wieder und wahrt die Wiederholung von Singular und Plural.
- source_word: הַחֲפֵצִים לְיִרְאָה אֶת שְׁמֶךָ
  choice: die Freude daran haben, deinen Namen zu fürchten
  rationale: חפץ bezeichnet Gefallen oder Freude, während ירא sowohl Furcht als auch ehrfürchtige Verehrung umfasst. Die Formulierung erhält die spannungsreiche biblische Rede vom Fürchten des Namens Gottes.
- source_word: וְהַצְלִיחָה נָּא לְעַבְדְּךָ הַיּוֹם
  choice: Lass es deinem Diener heute doch gelingen
  rationale: Der Hifil-Imperativ von צלח bittet Gott, Erfolg beziehungsweise Gelingen zu bewirken. Die deutsche unpersönliche Konstruktion ist natürlich und hält Gott als Gewährenden im Blick.
- source_word: וּתְנֵהוּ לְרַחֲמִים לִפְנֵי הָאִישׁ הַזֶּה
  choice: und lass ihn bei diesem Mann Erbarmen finden
  rationale: Die wörtlich ungewöhnliche Verbindung „gib ihn zu Erbarmen“ ist idiomatisch als Bitte um erbarmungsvolle Behandlung wiedergegeben. „Dieser Mann“ erhält Nehemias auffällig distanzierende Bezeichnung des Königs.
- source_word: וַאֲנִי הָיִיתִי מַשְׁקֶה לַמֶּלֶךְ
  choice: Ich aber war Mundschenk des Königs
  rationale: וַאֲנִי leitet eine erläuternde Erzählernotiz ein; „Mundschenk“ ist die etablierte und präzise deutsche Amtsbezeichnung für מַשְׁקֶה.
theological_decisions:
- issue: עבד als Selbstbezeichnung im Gebet
  choice: Diener
  alternative: Sklave
  rationale: Obwohl עבד auch einen Sklaven bezeichnen kann, steht hier die demütige Selbstbezeichnung vor Gott im Vordergrund, nicht der rechtliche Status der Gebundenheit.
- issue: ירא in Verbindung mit Gottes Namen
  choice: deinen Namen zu fürchten
  alternative: deinen Namen zu verehren / Ehrfurcht vor deinem Namen zu haben
  rationale: „Fürchten“ bewahrt die theologische Spannung des hebräischen Ausdrucks zwischen Furcht, Ehrfurcht und Verehrung, ohne sie auf nur einen Aspekt zu verengen.
- issue: רַחֲמִים als erbetene Haltung des Königs
  choice: Erbarmen finden
  alternative: Gunst finden
  rationale: „Erbarmen“ erhält den konkreten Barmherzigkeitsgehalt von רַחֲמִים; das allgemeinere „Gunst“ wäre möglich, würde diesen jedoch abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Gebetsrhythmus. „Ach“ und das zweimalige „doch“ geben die eindringlichen Bittepartikeln wieder, ohne archaisch zu wirken. Die Schlussnotiz wird knapp und sachlich als Übergang zur Erzählung formuliert.
