source:
  edition: WLC
  text: חֲבֹ֖ל חָבַ֣לְנוּ לָ֑/ךְ וְ/לֹא שָׁמַ֣רְנוּ אֶת הַ/מִּצְוֺ֗ת וְ/אֶת הַֽ/חֻקִּים֙ וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוִּ֖יתָ אֶת מֹשֶׁ֥ה עַבְדֶּֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/007.yaml
  text: We have acted very corruptly against you and have not kept the commandments[a], the statutes[b], and the judgments that you commanded your servant Moses.
translation:
  language: de
  text: Wir haben uns schwer gegen dich vergangen und die Gebote, die Satzungen und die Rechtsbestimmungen[a] nicht befolgt, die du deinem Diener Mose geboten hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „Rechtssprüche“, „Rechtsordnungen“ oder „Ordnungen“ bedeuten; es bezeichnet unter anderem richterliche Entscheidungen und fallbezogene Rechtsvorschriften.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל חָבַלְנוּ
  choice: wir haben uns schwer vergangen
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aussage. „Uns schwer vergangen“ gibt das verderbliche, schuldhafte Handeln idiomatisch wieder, ohne eine im Deutschen unnatürliche Wortwiederholung.
- source_word: לָךְ
  choice: gegen dich
  rationale: Die Präposition bezeichnet hier die gegen Gott gerichtete Verfehlung; „gegen dich“ drückt diese relationale Schuld natürlich aus.
- source_word: שָׁמַרְנוּ
  choice: nicht befolgt
  rationale: שׁמר bedeutet bei Geboten und Rechtsordnungen, sie einzuhalten beziehungsweise zu befolgen. „Befolgt“ ist in modernem Deutsch klar und idiomatisch.
- source_word: הַמִּצְוֺת
  choice: die Gebote
  rationale: Der Ausdruck bezeichnet verbindliche Anordnungen und bewahrt mit „Gebote“ den bundesrechtlichen Klang.
- source_word: הַחֻקִּים
  choice: die Satzungen
  rationale: חֻקִּים bezeichnet festgesetzte Vorschriften; „Satzungen“ hält diesen Begriff von den übrigen Rechtswörtern unterscheidbar.
- source_word: הַמִּשְׁפָּטִים
  choice: die Rechtsbestimmungen
  rationale: מִשְׁפָּטִים kann richterliche Entscheidungen, Fallrecht oder rechtliche Ordnungen bezeichnen. „Rechtsbestimmungen“ bewahrt die juristische Nuance und klingt im Deutschen natürlicher als „Rechtssprüche“.
- source_word: צִוִּיתָ
  choice: die du … gegeben hast
  rationale: Wörtlich steht „die du … geboten hast“. Weil „Gebote geboten“ im Deutschen schwerfällig klingt, gibt „gegeben“ den Akt göttlicher Anordnung natürlich wieder, ohne dessen Autorität abzuschwächen.
- source_word: עַבְדֶּךָ
  choice: deinem Diener
  rationale: Für Mose als Beauftragten Gottes ist „Diener“ die kontextgerechte und etablierte Wiedergabe von עֶבֶד.
theological_decisions:
- issue: Unterscheidung der drei Tora-Begriffe
  choice: Gebote, Satzungen und Rechtsbestimmungen
  alternative: Gebote, Ordnungen und Rechtssprüche
  rationale: Der hebräische Text verwendet drei verschiedene Rechtsbegriffe. Die Übersetzung lässt ihre Unterscheidung bestehen, ohne ihnen ein späteres konfessionelles Ordnungssystem aufzuerlegen.
- issue: Richtung der Verfehlung
  choice: gegen dich
  alternative: an dir / dir gegenüber
  rationale: Die Formulierung kennzeichnet das Verhalten als gegen Gott gerichtete Schuld, ohne die Aussage auf eine bestimmte Sündenlehre einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische hebräische Konstruktion wird durch „schwer“ wiedergegeben. Die drei Rechtstermini bleiben unterscheidbar; eine Fußnote dokumentiert die Bedeutungsbreite des letzten Begriffs.
