source:
  edition: WLC
  text: וַ/יְהִ֞י כְּ/שָׁמְעִ֣/י אֶת הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה יָשַׁ֨בְתִּי֙ וָֽ/אֶבְכֶּ֔ה וָ/אֶתְאַבְּלָ֖/ה יָמִ֑ים וָֽ/אֱהִ֥י צָם֙ וּ/מִתְפַּלֵּ֔ל לִ/פְנֵ֖י אֱלֹהֵ֥י הַ/שָּׁמָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/004.yaml
  text: And when I heard these words[a], I sat down and wept and mourned for days[b], and I was fasting and praying before the God of heaven.
translation:
  language: de
  text: Als ich diese Worte[a] hörte, setzte ich mich hin, weinte und trauerte tagelang; ich fastete und betete vor dem Gott des Himmels.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »diese Dinge« beziehungsweise »diese Angelegenheiten«. Das hebräische דְּבָרִים kann Worte, Dinge oder Angelegenheiten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische stellt das Fasten und Beten als fortdauernde Handlungen dar. Die einfache deutsche Vergangenheitsform kann diesen Sinn im Zusammenhang wiedergeben.
    reason: aspectual_nuance
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעִי
  choice: Als ich … hörte
  rationale: Die hebräische Erzählungs- und Zeitkonstruktion wird im modernen Deutschen natürlich durch einen temporalen Nebensatz wiedergegeben; ein wörtliches »Und es geschah« wäre unnötig schwerfällig.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: דְּבָרִים kann »Worte«, »Dinge« oder »Angelegenheiten« bedeuten. Hier bezeichnet es den zuvor mitgeteilten Bericht; »Worte« bleibt quellennah, während die Alternative in der Fußnote erhalten wird.
- source_word: יָשַׁבְתִּי
  choice: setzte ich mich hin
  rationale: יָשַׁב kann »sitzen«, »sich setzen«, »bleiben« oder »wohnen« bedeuten. Im Zusammenhang der unmittelbaren Reaktion ist »sich hinsetzen« natürlich und treffend.
- source_word: וָאֶבְכֶּה
  choice: weinte
  rationale: בכה bezeichnet das Weinen; »weinte« ist präzise und dem ernsten Klagekontext angemessen.
- source_word: וָאֶתְאַבְּלָה יָמִים
  choice: trauerte tagelang
  rationale: אבל bezeichnet anhaltende Trauer. Das adverbiale יָמִים gibt eine unbestimmte Dauer von mehreren Tagen an, die »tagelang« idiomatisch ausdrückt.
- source_word: וָאֱהִי צָם וּמִתְפַּלֵּל
  choice: Ich fastete und betete
  rationale: היה mit Partizipien stellt die Handlungen als andauernd dar. Das deutsche Präteritum kann diesen durativen Sinn im Erzählzusammenhang natürlich tragen; die aspektuelle Nuance wird in der Fußnote erläutert.
- source_word: לִפְנֵי
  choice: vor
  rationale: לִפְנֵי bedeutet »vor« beziehungsweise »in der Gegenwart von«. »Vor« ist knapp, idiomatisch und bewahrt die relationale Bedeutung.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: dem Gott des Himmels
  rationale: Die Constructusverbindung ist ein in Esra-Nehemia gebräuchlicher Gottestitel. Der bestimmte deutsche Ausdruck gibt ihn natürlich und ohne Zusatz wieder.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֱלֹהֵי הַשָּׁמָיִם
  choice: der Gott des Himmels
  alternative: Gott des Himmels
  rationale: Der Ausdruck ist ein Titel für Israels Gott und nicht der Gottesname JHWH. Daher wird kein Gottesname ergänzt; der Titel bleibt in seiner vorliegenden Form erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne den Ablauf zu verändern. »Tagelang« gibt die adverbiale Dauer idiomatisch wieder; die hebräischen Bedeutungs- und Aspektnuancen werden in den Fußnoten offengehalten.
