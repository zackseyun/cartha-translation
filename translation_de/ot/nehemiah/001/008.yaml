id: NEH.1.8
reference: Nehemiah 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זְכָר נָא֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר צִוִּ֛יתָ אֶת מֹשֶׁ֥ה עַבְדְּ/ךָ֖ לֵ/אמֹ֑ר אַתֶּ֣ם תִּמְעָ֔לוּ אֲנִ֕י אָפִ֥יץ אֶתְ/כֶ֖ם בָּ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/008.yaml
  text: Please remember the word that you commanded your servant Moses[a], saying, ‘If you act unfaithfully[b], I will scatter you among the peoples.’
translation:
  language: de
  text: 'Denk doch an das Wort, das du deinem Diener Mose geboten hast: »Wenn ihr treulos handelt[a], werde ich euch unter die Völker zerstreuen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »untreu werdet« oder »die Treue brecht«.'
    reason: Lexikalische Alternativen für תִּמְעָלוּ, das einen Treuebruch beziehungsweise treuwidriges Handeln bezeichnet.
lexical_decisions:
- source_word: זְכָר נָא
  choice: Denk doch an
  rationale: Der Imperativ זְכָר fordert zum Erinnern auf; נָא kennzeichnet hier eine ehrerbietige Bitte. „Denk doch an“ verbindet beides in natürlichem modernem Deutsch.
- source_word: הַדָּבָר
  choice: das Wort
  rationale: דָּבָר bezeichnet hier die konkrete, Mose mitgeteilte göttliche Aussage. „Das Wort“ wahrt die hebräische Ausdrucksweise, ohne den Inhalt vorschnell als Verheißung oder bloße Angelegenheit festzulegen.
- source_word: צִוִּיתָ
  choice: du … geboten hast
  rationale: צוה bedeutet gewöhnlich „gebieten, befehlen“. Obwohl das folgende Zitat eine Warnung enthält, bezeichnet der hebräische Text es ausdrücklich als das Mose Gebotene.
- source_word: עַבְדְּךָ
  choice: deinem Diener
  rationale: עבד kann „Sklave“ oder „Diener“ bedeuten. Bei Mose als Gottes Beauftragtem gibt „Diener“ die relationale und amtliche Bedeutung angemessen wieder.
- source_word: לֵאמֹר
  choice: Doppelpunkt zur Einleitung des Zitats
  rationale: Der quotative Infinitiv לֵאמֹר leitet den Inhalt des Gebots ein. Im Deutschen erfüllt der Doppelpunkt diese Funktion natürlicher als ein zusätzliches „indem du sagtest“.
- source_word: תִּמְעָלוּ
  choice: ihr treulos handelt
  rationale: מעל bezeichnet ein treuwidriges Handeln beziehungsweise einen Treuebruch, besonders im Bundeszusammenhang. Die Formulierung bewahrt sowohl den Handlungsaspekt als auch die Beziehungsebene.
- source_word: אָפִיץ
  choice: ich werde … zerstreuen
  rationale: Der Hifil von פוץ bedeutet „zerstreuen“ oder „auseinandertreiben“. „Zerstreuen“ ist im Deutschen direkt und für die angekündigte Gerichtshandlung passend.
- source_word: בָּעַמִּים
  choice: unter die Völker
  rationale: Der Plural עַמִּים bezeichnet verschiedene Völker. „Unter die Völker“ gibt zugleich die räumliche Zerstreuung in deren Mitte idiomatisch wieder.
theological_decisions:
- issue: Bundesbezogene Bedeutung von מעל
  choice: Wenn ihr treulos handelt
  alternative: Wenn ihr untreu werdet; wenn ihr die Treue brecht
  rationale: Die Aussage erinnert an die durch Mose übermittelten Bundesfolgen. „Treulos handelt“ erhält den Gedanken des Treuebruchs, ohne eine engere rechtliche oder konfessionelle Deutung festzuschreiben.
- issue: Verhältnis der beiden unverbundenen Verbalsätze
  choice: konditionale Wiedergabe mit „Wenn …, werde ich …“
  alternative: „Ihr handelt treulos – ich werde euch … zerstreuen“
  rationale: Obwohl im Hebräischen keine ausdrückliche Konditionalpartikel steht, legt der Zusammenhang von vorausgesetztem Treuebruch und angekündigter Folge eine konditionale Wiedergabe nahe. Die Alternative bleibt grammatisch möglich, würde im Deutschen jedoch leicht wie eine uneingeschränkte Feststellung klingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Denk doch an“ wahrt den bittenden Ton des Gebets, ohne förmlich oder altertümlich zu klingen. Der direkte Redefluss wird durch einen Doppelpunkt klar und knapp gestaltet.
