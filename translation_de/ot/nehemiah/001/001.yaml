base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/001.yaml
  text: The words of Nehemiah son of Hacaliah[a]. Now it happened in the month of Kislev, in the twentieth year, while I was in Susa the citadel[c][b],
translation:
  language: de
  text: 'Die Worte[a] Nehemias, des Sohnes Hachaljas. Es geschah im Monat Kislew, im zwanzigsten Jahr[b], während ich mich in Susa, der Zitadelle[c], aufhielt:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Bericht Nehemias, des Sohnes Hachaljas.“ Die hebräische Überschrift „Die Worte“ kann einen Bericht oder eine erzählende Aufzeichnung einleiten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „im Jahr zwanzig“. Der Vers sagt nicht ausdrücklich, wessen Regierungsjahr gemeint ist; aus dem späteren Zusammenhang ergibt sich Artaxerxes.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „Susa, die Festung“. Das hebräische Wort bezeichnet einen befestigten königlichen Komplex.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Die Worte
  rationale: Die konstruktusverbundene Pluralform von דָּבָר kann eine Sammlung von Worten, einen Bericht oder eine schriftliche Aufzeichnung einleiten. „Die Worte“ bewahrt die hebräische Überschriftsform, ohne sie vorschnell auf „Bericht“ oder „Erinnerungen“ festzulegen.
- source_word: נְחֶמְיָה בֶּן חֲכַלְיָה
  choice: Nehemias, des Sohnes Hachaljas
  rationale: Die Personennamen werden in ihren im Deutschen etablierten biblischen Formen wiedergegeben; die Genitivkonstruktion bildet die hebräische Abstammungsangabe natürlich ab.
- source_word: וַיְהִי
  choice: Es geschah
  rationale: Die Wendung eröffnet den Erzählgang. „Es geschah“ ist würdevoll und verständlich, ohne das altertümlichere „Und es begab sich“ zu verwenden.
- source_word: בְחֹדֶשׁ כִּסְלֵו
  choice: im Monat Kislew
  rationale: Die hebräische Datumsformel wird idiomatisch wiedergegeben; der Monatsname wird in der gebräuchlichen deutschen Form transliteriert.
- source_word: שְׁנַת עֶשְׂרִים
  choice: im zwanzigsten Jahr
  rationale: Die knappe Datumsangabe bedeutet wörtlich „Jahr zwanzig“. Der Herrscher wird in diesem Vers nicht genannt und deshalb im Haupttext nicht ergänzt.
- source_word: וַאֲנִי הָיִיתִי
  choice: als ich mich … aufhielt
  rationale: Die Formulierung gibt den zeitlichen und örtlichen Umstand des Ich-Erzählers in natürlichem Deutsch wieder, ohne zusätzliche inhaltliche Festlegung.
- source_word: בְשׁוּשַׁן הַבִּירָה
  choice: in der Zitadelle von Susa
  rationale: בִּירָה bezeichnet hier den befestigten königlichen Komplex. „Zitadelle von Susa“ vermittelt diesen Sinn klarer als das im Deutschen missverständliche „Susa, die Hauptstadt“.
theological_decisions:
- issue: Bezug des zwanzigsten Jahres
  choice: Der Herrscher wird im Haupttext nicht ergänzt.
  alternative: „im zwanzigsten Regierungsjahr des Artaxerxes“
  rationale: Obwohl der spätere Kontext Artaxerxes erkennen lässt, bleibt der Bezug in diesem Vers selbst unausgesprochen. Die Übersetzung bewahrt diese textliche Zurückhaltung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Überschriftsform und die nicht ausdrücklich bestimmte Jahreszählung bleiben erhalten. Der Doppelpunkt zeigt an, dass der Satz in den folgenden Versen inhaltlich weitergeführt wird.
