base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/009.yaml
  text: but if you return to me and keep my commandments and do them[a], though your outcasts are at the end of the heavens, from there I will gather them and bring them to the place that I have chosen[c][b], to make my name dwell there.
translation:
  language: de
  text: Wenn ihr aber zu mir umkehrt, meine Gebote haltet und danach handelt, dann werde ich eure Verstoßenen[a], selbst wenn sie am äußersten Rand des Himmels wären[b], von dort sammeln und an den Ort bringen, den ich erwählt habe, um meinen Namen dort wohnen zu lassen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „eure Verbannten“ oder „eure Zerstreuten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „am Ende des Himmels“; eine bildhafte Wendung für die größtmögliche Entfernung.'
    reason: cultural_note
  - marker: c
    text: 'Auch: „um meinen Namen dort einzusetzen“. Der hebräische Text bewahrt das Bild, dass Gottes Name am erwählten Ort wohnt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתֶּם אֵלַי
  choice: Wenn ihr aber zu mir umkehrt
  rationale: שׁוב mit אֶל bezeichnet die Umkehr beziehungsweise Rückkehr zu jemandem. Das im Deutschen ergänzte „wenn“ nimmt den Bedingungszusammenhang auf; „aber“ kennzeichnet den Kontrast zur zuvor genannten Untreue.
- source_word: וּשְׁמַרְתֶּם מִצְוֺתַי וַעֲשִׂיתֶם אֹתָם
  choice: meine Gebote haltet und danach handelt
  rationale: Die Wiedergabe bewahrt die hebräische Unterscheidung zwischen dem Halten der Gebote und dem tatsächlichen Tun, ohne im Deutschen unnatürlich „sie tun“ zu formulieren.
- source_word: נִדַּחֲכֶם
  choice: die unter euch Verstoßenen
  rationale: Die Form bezeichnet kollektiv die aus dem Volk Weggetriebenen beziehungsweise Zerstreuten. „Die unter euch Verstoßenen“ gibt den Bezug des Suffixes natürlich wieder und lässt offen, ob Verbannung oder Zerstreuung im Vordergrund steht.
- source_word: בִּקְצֵה הַשָּׁמַיִם
  choice: am äußersten Rand des Himmels
  rationale: Die bildhafte räumliche Wendung wird weitgehend formal bewahrt und bezeichnet die denkbar größte Entfernung.
- source_word: מִשָּׁם אֲקַבְּצֵם
  choice: von dort sammeln
  rationale: קבץ ist das übliche Verb für das erneute Sammeln eines zerstreuten Volkes; „sammeln“ bewahrt den Bundes- und Wiederherstellungsbezug.
- source_word: וַהֲבֹאתִים
  choice: und … bringen
  rationale: Der Hifil von בוא wird im Deutschen idiomatisch mit „bringen“ wiedergegeben.
- source_word: הַמָּקוֹם אֲשֶׁר בָּחַרְתִּי
  choice: den Ort, den ich erwählt habe
  rationale: בחר bezeichnet hier Gottes Wahl des Heiligtumsortes. „Erwählt“ trägt den feierlichen, theologischen Klang, ohne die Aussage weiter auszudeuten.
- source_word: לְשַׁכֵּן אֶת שְׁמִי שָׁם
  choice: um meinen Namen dort wohnen zu lassen
  rationale: Die Formulierung bewahrt das kausative Wohnbild der deuteronomischen Heiligtumsformel, statt es auf ein bloßes Benennen oder Erinnern zu reduzieren.
theological_decisions:
- issue: Formel von Gottes Gegenwart am Heiligtum
  choice: um meinen Namen dort wohnen zu lassen
  alternative: um meinen Namen dort einzusetzen
  rationale: Die hebräische Aussage verbindet den erwählten Ort mit dem Wohnen des göttlichen Namens. Die Übersetzung erhält diese Spannung, ohne zu behaupten, Gottes Wesen sei räumlich auf diesen Ort beschränkt.
- issue: Bedingung und verheißene Sammlung
  choice: Wenn … dann werde ich …
  alternative: Und ihr werdet …; wenn …, werde ich …
  rationale: Der Vers setzt die bedingte Aussage aus dem vorherigen Zusammenhang fort. Die deutsche Wenn-dann-Struktur macht diesen syntaktischen Zusammenhang verständlich, ohne die Umkehr als menschlichen Verdienst oder die Sammlung als bedingungslos darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist gegenüber dem Hebräischen behutsam geordnet, damit Bedingung, äußerster Fall und Verheißung klar erkennbar bleiben. Das Wohnbild des göttlichen Namens sowie die doppelte Aussage von Gebotehalten und entsprechendem Handeln bleiben erhalten.
