source:
  edition: WLC
  text: וְ/הֵ֥ם עֲבָדֶ֖י/ךָ וְ/עַמֶּ֑/ךָ אֲשֶׁ֤ר פָּדִ֨יתָ֙ בְּ/כֹחֲ/ךָ֣ הַ/גָּד֔וֹל וּ/בְ/יָדְ/ךָ֖ הַ/חֲזָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/010.yaml
  text: But they are your servants and your people[b][a], whom you redeemed by your great power and by your strong hand.
translation:
  language: de
  text: Doch sie sind deine Diener und dein Volk, das du durch deine große Kraft und deine starke Hand erlöst[a] hast.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „befreit“ oder „losgekauft“; das hebräische Verb bezeichnet Befreiung durch rettendes Eingreifen.
    reason: lexical_alternative
  - marker: b
    text: Oder „mächtige Hand“; wörtlich steht im Hebräischen „starke Hand“, eine geläufige Wendung für Gottes machtvolles Handeln.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Doch sie
  rationale: Das וְ knüpft an die vorausgehende Bitte an und hat hier angesichts von Israels Schuld und Zerstreuung eine leicht kontrastierende, wiederaufnehmende Funktion. „Doch sie“ gibt dies im Deutschen natürlich wieder.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: עבד kann „Sklave“ oder „Diener“ bedeuten; hier steht die Zugehörigkeit zu Gott im Vordergrund. „Diener“ ist im Gebetskontext angemessen und verständlich.
- source_word: וְעַמֶּךָ
  choice: und dein Volk
  rationale: עם bezeichnet hier kollektiv Gottes Volk; das Possessivverhältnis wird ausdrücklich beibehalten.
- source_word: אֲשֶׁר
  choice: das
  rationale: Das Relativpronomen bezieht sich in der deutschen Satzstruktur am natürlichsten auf das unmittelbar vorausgehende Kollektivnomen „Volk“.
- source_word: פָּדִיתָ
  choice: erlöst hast
  rationale: פדה bezeichnet das Freikaufen beziehungsweise die Befreiung aus einer Notlage. „Erlöst“ bewahrt den Anklang an Gottes geschichtliches Befreiungshandeln, ohne die Aussage enger festzulegen.
- source_word: בְּכֹחֲךָ הַגָּדוֹל
  choice: durch deine große Kraft
  rationale: כח bedeutet „Kraft“ oder „Macht“; „durch“ bezeichnet hier das Mittel des Handelns und entspricht natürlichem modernem Deutsch.
- source_word: וּבְיָדְךָ הַחֲזָקָה
  choice: und deine starke Hand
  rationale: Die „starke Hand“ ist eine bildhafte Wendung für Gottes wirksames, machtvolles Handeln und gibt חֲזָקָה unmittelbar wieder.
theological_decisions:
- issue: Erlösungssprache in Nehemias Gebet
  choice: erlöst
  alternative: befreit; losgekauft
  rationale: Der Vers erinnert wahrscheinlich an Gottes geschichtliche Befreiung Israels, besonders an den Exodus. „Erlöst“ erhält dieses theologische Gewicht, ohne spätere dogmatische Einzelheiten in den Text einzutragen.
- issue: Gottes „starke Hand“
  choice: starke Hand
  alternative: mächtige Hand
  rationale: Die konkrete Metapher des Hebräischen bleibt erhalten. Sie bezeichnet Gottes machtvolles Eingreifen, ohne dass die anthropomorphe Bildsprache aufgelöst wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, klingt jedoch natürlich; die Metapher „starke Hand“ und die theologische Spannung des Verbs פדה werden bewahrt.
