base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/022.yaml
  text: And the overseer of the Levites in Jerusalem was Uzzi son of Bani[a], son of Hashabiah, son of Mattaniah, son of Mica, from the sons of Asaph, the singers, over the work of the house of God.
translation:
  language: de
  text: Und der Aufseher der Leviten in Jerusalem war Usi, Sohn Banis, Sohn Haschabjas, Sohn Mattanjas, Sohn Michas, aus den Nachkommen Asafs, den Sängern; er war für die Arbeit im Haus Gottes zuständig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit der Aufsicht über die Arbeit im Haus Gottes“. Die hebräische Wendung mit לְנֶגֶד kann hier Zuständigkeit oder Aufsicht in Bezug auf die Arbeit des Gotteshauses ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקִיד הַלְוִיִּם
  choice: Und der Aufseher der Leviten
  rationale: פְקִיד bezeichnet einen für Aufsicht oder Verwaltung eingesetzten Amtsträger; die Genitivverbindung wird im Deutschen natürlich als „Aufseher der Leviten“ wiedergegeben.
- source_word: בִּירוּשָׁלַם
  choice: in Jerusalem
  rationale: Direkte Ortsangabe mit בְּ.
- source_word: עֻזִּי בֶן בָּנִי בֶּן חֲשַׁבְיָה בֶּן מַתַּנְיָה בֶּן מִיכָא
  choice: Usi, der Sohn Banis, des Sohnes Haschabjas, des Sohnes Mattanjas, des Sohnes Michas
  rationale: Die Personennamen werden in geläufiger deutscher Bibelschreibweise wiedergegeben; die wiederholte Abstammungsformel בן bleibt als genealogische Kette sichtbar.
- source_word: מִבְּנֵי אָסָף
  choice: aus den Nachkommen Asafs
  rationale: Wörtlich „aus den Söhnen Asafs“; in einer späteren genealogischen bzw. kultischen Gruppenzugehörigkeit bezeichnet בְּנֵי idiomatisch die Nachkommen.
- source_word: הַמְשֹׁרְרִים
  choice: den Sängern
  rationale: Das substantivierte Partizip bezeichnet die Asafiten nach ihrer Aufgabe als Tempelsänger; „Musiker“ wäre weiter als der hebräische Ausdruck.
- source_word: לְנֶגֶד מְלֶאכֶת
  choice: verantwortlich für die Arbeit
  rationale: לְנֶגֶד bezeichnet hier die amtliche Zuordnung bzw. Verantwortung hinsichtlich der Arbeit. Die Formulierung gibt den Verwaltungssinn wieder, ohne eine räumliche Bedeutung („vor“) nahezulegen.
- source_word: בֵּית הָאֱלֹהִים
  choice: am Haus Gottes
  rationale: „Haus Gottes“ bewahrt die konkrete hebräische Bezeichnung; mit „Arbeit am Haus“ ist im Deutschen die Tätigkeit im Zusammenhang mit dem Tempel natürlich ausgedrückt.
