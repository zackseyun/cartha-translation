lexical_decisions:
- source_word: כָּל
  choice: alle … insgesamt
  rationale: כָּל bezeichnet hier im Zusammenhang mit der folgenden Zahl die Gesamtzahl der Gruppe. Die Kombination aus „alle“ und „insgesamt“ macht diese Funktion im Deutschen natürlich deutlich.
- source_word: הַלְוִיִּם
  choice: Leviten
  rationale: „Leviten“ ist die etablierte und genaue deutsche Bezeichnung für לְוִיִּם.
- source_word: בְּעִיר הַקֹּדֶשׁ
  choice: in der heiligen Stadt
  rationale: Die Präposition בְּ bezeichnet den Ort; die Genitivverbindung עִיר הַקֹּדֶשׁ wird im Deutschen idiomatisch als „die heilige Stadt“ wiedergegeben.
- source_word: מָאתַיִם שְׁמֹנִים וְאַרְבָּעָה
  choice: '284'
  rationale: Die hebräische Zahlenfolge bezeichnet eindeutig die Gesamtzahl 284. Ziffern sind in einer modernen deutschen Aufzählung übersichtlich; „waren insgesamt“ ergänzt idiomatisch das im Hebräischen fehlende Verb.
