lexical_decisions:
- source_word: וּ/בְ/עֵין רִמּוֹן
  choice: und in En-Rimmon
  rationale: Die Konjunktion וּ und die Präposition בְ werden mit „und in“ wiedergegeben. Der Ortsname wird in der im Deutschen geläufigen biblischen Form „En-Rimmon“ transkribiert.
- source_word: וּ/בְ/צָרְעָה
  choice: in Zora
  rationale: Der Ortsname צָרְעָה wird in der etablierten deutschen Form „Zora“ wiedergegeben. Das im Hebräischen wiederholte וּ/בְ wird zugunsten einer natürlichen deutschen Aufzählung nicht nochmals ausdrücklich mit „und in“ übersetzt.
- source_word: וּ/בְ/יַרְמוּת
  choice: und in Jarmut
  rationale: Die Konjunktion und Präposition werden mit „und in“ wiedergegeben; יַרְמוּת erscheint in der gebräuchlichen deutschen Transkription „Jarmut“.
