  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den administrativen Sinn des Hebräischen zuverlässig wieder: Die königliche Anordnung galt „ihnen“, und für die Sänger bestand eine festgelegte Regelung mit einer Tag-für-Tag-Bestimmung. „Denn“ gibt כִּי im begründenden Zusammenhang angemessen wieder. Die offene Referenz von עֲלֵיהֶם wird nicht unnötig spezifiziert.'
  naturalness: '„Denn für sie galt die Anordnung des Königs; für die Sänger bestand eine verbindliche Regelung: für jeden Tag das, was an diesem Tag erforderlich war“ ist modernes, verständliches und zugleich dem sachlich-administrativen Register angemessenes Standarddeutsch. Die Wiederholung von „Tag“ bildet den hebräischen Tagesbezug nachvollziehbar ab.'
  terminology: „Anordnung des Königs“ trifft מִצְוַת הַמֶּלֶךְ gut. „Verbindliche Regelung“ ist für אֲמָנָה eine tragfähige, nicht zu eng materielle Wiedergabe. Die Fußnote weist zutreffend auf die mögliche Bedeutung einer festgesetzten Versorgung, Vereinbarung oder Verpflichtung hin. Die zweite Fußnote erklärt die idiomatische Tagesformel und bewahrt deren semantische Offenheit.
