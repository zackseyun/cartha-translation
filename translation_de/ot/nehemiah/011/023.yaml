id: NEH.11.23
reference: Nehemiah 11:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי מִצְוַ֥ת הַ/מֶּ֖לֶךְ עֲלֵי/הֶ֑ם וַ/אֲמָנָ֥ה עַל הַ/מְשֹׁרְרִ֖ים דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/023.yaml
  text: For the king’s command was upon them[a], and a fixed provision for the singers[b], each day’s matter on its day.
translation:
  language: de
  text: 'Denn für sie galt die Anordnung des Königs; für die Sänger bestand eine verbindliche Regelung[a]: für jeden Tag das, was an diesem Tag erforderlich war.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch eine festgesetzte Versorgung, eine feste Vereinbarung oder eine bestehende Verpflichtung bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Sache eines Tages an seinem Tag“; gemeint sein kann der jeweilige tägliche Bedarf, Anteil oder Dienst.'
    reason: idiom_explanation
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage und fügt sich so natürlich in den deutschen Zusammenhang ein.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: die Anordnung des Königs
  rationale: מִצְוָה bezeichnet hier eine verbindliche königliche Weisung; „Anordnung“ klingt im administrativen Zusammenhang natürlich und wahrt deren Autorität.
- source_word: עֲלֵיהֶם
  choice: für sie galt
  rationale: Die Präposition עַל drückt hier aus, dass die königliche Anordnung sie betraf beziehungsweise für sie verbindlich war. Die deutsche Formulierung gibt dies idiomatisch wieder.
- source_word: וַאֲמָנָה
  choice: eine verbindliche Regelung
  rationale: אֲמָנָה kann eine feststehende, verlässliche Regelung oder Verpflichtung und im Kontext möglicherweise eine festgesetzte Versorgung bezeichnen. „Verbindliche Regelung“ hält den administrativen Sinn fest, ohne eine materielle Zuteilung zwingend vorauszusetzen.
- source_word: עַל הַמְשֹׁרְרִים
  choice: für die Sänger
  rationale: עַל kennzeichnet hier den Personenkreis, auf den sich die Regelung bezieht. „Für die Sänger“ ist im Deutschen klar und idiomatisch.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: für jeden Tag das, was an diesem Tag erforderlich war
  rationale: Die wörtlich geprägte Wendung „die Sache eines Tages an seinem Tag“ bezeichnet den jeweils täglichen Bedarf, Anteil oder Dienst. Die Übersetzung bewahrt den Tag-für-Tag-Sinn, ohne die Art des Erforderlichen festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der administrative Charakter des Verses bleibt erkennbar; zugleich werden die Mehrdeutigkeit von אֲמָנָה und die Offenheit der Tagesformel nicht vorschnell auf Geld, Naturalien oder Dienstpflichten verengt.
