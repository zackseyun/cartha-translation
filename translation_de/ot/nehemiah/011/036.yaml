  source_fidelity: Der Haupttext deutet die elliptische hebräische Notiz vertretbar als Zuordnung von levitischen Abteilungen zu Benjamin. »aus Juda« legt jedoch stärker eine Herkunft aus Juda nahe; im Zusammenhang und entsprechend der naheliegenden lokativen Auffassung von יְהוּדָה ist »in Juda« quellentreuer und wahrt die knappe Syntax besser.
  naturalness: 'Mit »in Juda« ist der Satz idiomatisch und klar: »Und von den Leviten waren Abteilungen in Juda Benjamin zugeteilt.« Die zurückhaltende Explikation durch »waren … zugeteilt« ist im Deutschen angesichts des hebräischen Nominalsatzes sinnvoll.'
