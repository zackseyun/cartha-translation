  yaml_path: translation/ot/nehemiah/011/036.yaml
  text: And from the Levites[a], divisions in Judah belonged to Benjamin.
translation:
  language: de
  text: Und von den Leviten waren Abteilungen in Juda Benjamin zugeteilt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und von den Leviten waren Abteilungen Judas für Benjamin.« Das Hebräische ist sehr knapp; wie »Juda« und »Benjamin« genau zueinander in Beziehung stehen, bleibt unausgesprochen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן
  choice: Und von
  rationale: Die Verbindung aus Konjunktion und Präposition knüpft den abschließenden Hinweis an den vorherigen Abschnitt an und bewahrt die Herkunfts- bzw. Zuordnungsbeziehung, ohne die knappe Syntax stärker als nötig auszudeuten.
- source_word: הַלְוִיִּם
  choice: den Leviten
  rationale: Die direkte Wiedergabe bezeichnet die Leviten als Personengruppe; der bestimmte Artikel bleibt erhalten.
- source_word: מַחְלְקוֹת
  choice: Abteilungen
  rationale: Das Wort bezeichnet gegliederte bzw. zugewiesene Gruppen. »Abteilungen« passt zum administrativen Zusammenhang und klingt im modernen Deutschen natürlicher als »Einteilungen«.
- source_word: יְהוּדָה
  choice: aus Juda
  rationale: Die hebräische Fügung ist stark verkürzt. »Aus Juda« versteht Juda als Herkunfts- oder Gebietsangabe, wahrt aber in Verbindung mit der Fußnote die Unsicherheit gegenüber der ebenfalls möglichen Wiedergabe »Abteilungen Judas«.
- source_word: לְבִנְיָמִין
  choice: Benjamin zugeteilt
  rationale: Die Präposition לְ bezeichnet hier wahrscheinlich eine Zuordnung. »Benjamin zugeteilt« gibt den naheliegenden Sinn verständlich wieder, ohne ein Besitzverhältnis zu behaupten.
