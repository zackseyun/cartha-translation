  text: and in Ziklag[a], and in Mekonah and its daughter villages.
translation:
  language: de
  text: und in Ziklag, in Mekona und in den dazugehörigen Ortschaften[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in ihren Töchtern“; damit sind kleinere, von Mekona abhängige Ortschaften oder Siedlungen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/צִֽקְלַג
  choice: und in Ziklag
  rationale: Die Konjunktion וּ und die Präposition בְ werden zusammen mit „und in“ wiedergegeben. Der Ortsname צִקְלַג wird in der im Deutschen üblichen Form „Ziklag“ übernommen.
- source_word: וּ/בִ/מְכֹנָה
  choice: in Mechona
  rationale: מְכֹנָה ist ein Ortsname. „Mechona“ gibt den hebräischen Namen in einer für deutsche Leser geläufigen Umschrift wieder. Das erneute וּ wird zugunsten eines natürlichen deutschen Satzflusses nicht eigens wiederholt.
- source_word: וּ/בִ/בְנֹתֶֽי/הָ
  choice: und in den dazugehörigen Ortschaften
  rationale: בְנֹתֶיהָ bedeutet wörtlich „ihren Töchtern“, bezeichnet hier aber nach hebräischem Sprachgebrauch die von Mechona abhängigen kleineren Siedlungen. „Dazugehörige Ortschaften“ vermittelt den gemeinten Sachverhalt in natürlichem modernem Deutsch; die Metapher bleibt in der Fußnote sichtbar.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger und gut verständlicher Erzählstil. Da der Vers mitten in einer Ortsliste steht, bleibt der einleitende Anschluss „und“ erhalten. Die hebräische Siedlungsmetapher wird im Haupttext verständlich ausgedrückt und in der Fußnote dokumentiert.
