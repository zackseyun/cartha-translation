  text: וּ/בְנֵ֥י בִנְיָמִ֖ן מִ/גָּ֑בַע מִכְמָ֣שׂ וְ/עַיָּ֔ה וּ/בֵֽית אֵ֖ל וּ/בְנֹתֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/031.yaml
  text: And the sons of Benjamin were from Geba[a], Michmash, Aijah, and Bethel and its villages.
translation:
  language: de
  text: Und die Nachkommen Benjamins wohnten von Geba an in Michmas, Aija[a], Bethel und den dazugehörigen Dörfern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ai«. Die hebräische Form lautet hier עַיָּה (Aija); sie kann denselben Ort oder einen eng verwandten Ortsnamen bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: Und die Nachkommen Benjamins
  rationale: בְנֵי bedeutet wörtlich »Söhne«, bezeichnet hier im Zusammenhang der Siedlungsliste jedoch die Angehörigen beziehungsweise Nachkommen des Stammes Benjamin. »Nachkommen Benjamins« ist im modernen Deutschen natürlich und wahrt die Stammeszugehörigkeit.
- source_word: מִגָּבַע
  choice: wohnten von Geba an
  rationale: Die Präposition מִן bezeichnet hier den Ausgangspunkt der anschließenden Ortsliste. Das im Hebräischen elliptische Verb wird aus dem Siedlungskontext ergänzt; »wohnten von Geba an« gibt den Sinn der Liste verständlich wieder.
- source_word: מִכְמָשׂ
  choice: Michmas
  rationale: Der Ortsname wird in der im Deutschen etablierten biblischen Form »Michmas« wiedergegeben.
- source_word: וְעַיָּה
  choice: Aija
  rationale: Die masoretische Form עַיָּה wird als »Aija« wiedergegeben. Eine mögliche Gleichsetzung oder Wiedergabe als »Ai« bleibt in der Fußnote erhalten.
- source_word: וּבֵית אֵל
  choice: Bethel
  rationale: Der Ortsname בֵּית־אֵל wird nach gebräuchlicher deutscher Bibeltradition als »Bethel« geschrieben.
- source_word: וּבְנֹתֶיהָ
  choice: und den dazugehörigen Dörfern
  rationale: Wörtlich steht »und seinen Töchtern«. Dies ist eine Ortsmetapher für abhängige Siedlungen oder Tochterorte. »Die dazugehörigen Dörfer« vermittelt die Bedeutung in klarem modernem Deutsch; das feminine Suffix bezieht sich auf Bethel als Stadt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe hebräische Siedlungsliste wird durch das aus dem Kontext ergänzte Verb »wohnten« zu einem natürlichen deutschen Satz. Die geographische Reichweite von מִגָּבַע bleibt mit »von Geba an« erhalten.
