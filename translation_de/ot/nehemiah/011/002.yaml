base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/002.yaml
  text: And the people blessed all the men who willingly offered themselves to live in Jerusalem[a].
translation:
  language: de
  text: Und das Volk segnete alle Männer, die sich freiwillig bereit erklärten[a], in Jerusalem zu wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sich freiwillig meldeten, in Jerusalem zu wohnen.“'
    reason: Lexikalische Alternative für הַמִּתְנַדְּבִים; „sich freiwillig melden“ gibt den Sinn idiomatischer und knapper wieder.
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: segnete
  rationale: Das Piel von ברך bedeutet gewöhnlich „segnen“. Auch bei menschlichem Objekt bleibt damit der Gedanke eines Segens- und Anerkennungszuspruchs erhalten, ohne ihn auf bloßes Lob zu verengen.
- source_word: הָעָם
  choice: das Volk
  rationale: עם ist die übliche Kollektivbezeichnung für „Volk“; die Wiedergabe ist natürlich und quellennah.
- source_word: לְכֹל הָאֲנָשִׁים
  choice: alle Männer
  rationale: אֲנָשִׁים bezeichnet hier ausdrücklich Männer. Die grammatische und lexikalische Geschlechtsangabe wird daher nicht verallgemeinert.
- source_word: הַמִּתְנַדְּבִים
  choice: die sich freiwillig bereit erklärten
  rationale: Der Hitpael von נדב bezeichnet freiwillige Bereitschaft beziehungsweise Selbstverpflichtung. Die Formulierung gibt sowohl die Freiwilligkeit als auch die reflexive Nuance in natürlichem Deutsch wieder.
- source_word: לָשֶׁבֶת
  choice: zu wohnen
  rationale: ישב bezeichnet hier das dauerhafte Wohnen beziehungsweise Ansässigwerden; „wohnen“ ist im modernen Deutschen idiomatisch und dem Zusammenhang angemessen.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Standardmäßige lokale Wiedergabe des Ortsnamens.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von הָאֲנָשִׁים
  choice: alle Männer
  alternative: alle Menschen / alle
  rationale: Der hebräische Text verwendet das maskuline אֲנָשִׁים und nicht eine allgemeine Kollektivbezeichnung. Deshalb wird der männliche Bezug bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Segnete“ bewahrt die theologisch und lexikalisch bedeutsame Verbindung zu ברך; „sich freiwillig bereit erklärten“ vermeidet den etwas administrativen Klang von „sich melden“, während die Fußnote diese natürliche Alternative dokumentiert.
