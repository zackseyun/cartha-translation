id: NEH.11.7
reference: Nehemiah 11:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י בִנְיָמִ֑ן סַלֻּ֡א בֶּן מְשֻׁלָּ֡ם בֶּן יוֹעֵ֡ד בֶּן פְּדָיָה֩ בֶן ק֨וֹלָיָ֧ה בֶן מַעֲשֵׂיָ֛ה בֶּן אִֽיתִיאֵ֖ל בֶּן יְשַֽׁעְיָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/007.yaml
  text: 'And these were the sons of Benjamin: Sallu son of Meshullam[a], son of Joed, son of Pedaiah, son of Kolaiah, son of Maaseiah, son of Ithiel[b], son of Jeshaiah.'
translation:
  language: de
  text: 'Und dies sind die Nachkommen Benjamins[a]: Sallu, der Sohn Meschullams, des Sohnes Joëds[b], des Sohnes Pedajas, des Sohnes Kolajas, des Sohnes Maasejas, des Sohnes Itiëls, des Sohnes Jeschajas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: die Söhne Benjamins; gemeint sein können auch die Benjaminiten beziehungsweise die Nachkommen Benjamins.'
    reason: lexical_alternative
  - marker: b
    text: Hier steht im masoretischen Text »Joëd«; die Parallelgenealogie in 1. Chronik 9,7 hat »Hodawja«.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Die Verbindung aus Konjunktion und Demonstrativpronomen leitet einen weiteren Abschnitt der Aufzählung ein; das Präsens entspricht der hebräischen Nominalkonstruktion und klingt im Deutschen natürlich.
- source_word: בְּנֵי בִנְיָמִן
  choice: die Nachkommen Benjamins
  rationale: Wörtlich »Söhne Benjamins«; in dieser Stammes- und Sippenliste bezeichnet die Wendung jedoch Benjaminiten beziehungsweise Nachkommen Benjamins. »Nachkommen« gibt den gemeinten Umfang klar wieder, ohne ihn auf unmittelbare Söhne zu beschränken.
- source_word: סַלֻּא
  choice: Sallu
  rationale: Nahe Wiedergabe des hebräischen Personennamens in deutscher Umschrift.
- source_word: בֶּן
  choice: Sohn
  rationale: In der folgenden genealogischen Kette ist »Sohn« die unmittelbare und übliche Wiedergabe; die Genitivfolge bildet die wiederholte hebräische Formel lesbar ab.
- source_word: מְשֻׁלָּם
  choice: Meschullam
  rationale: Im Deutschen verständliche, am Hebräischen orientierte Umschrift des Personennamens.
- source_word: יוֹעֵד
  choice: Joëd
  rationale: Die Umschrift folgt der masoretischen Form; das Trema macht kenntlich, dass o und e getrennt gesprochen werden.
- source_word: פְּדָיָה
  choice: Pedaja
  rationale: Gebräuchliche deutsche Umschrift des hebräischen Personennamens.
- source_word: קוֹלָיָה
  choice: Kolaja
  rationale: Deutsche Umschrift, die die hebräische Lautgestalt angemessen wiedergibt.
- source_word: מַעֲשֵׂיָה
  choice: Maaseja
  rationale: Am hebräischen Namen orientierte deutsche Umschrift.
- source_word: אִיתִיאֵל
  choice: Itiël
  rationale: Nahe deutsche Umschrift; das Trema kennzeichnet die getrennte Aussprache der Vokale.
- source_word: יְשַׁעְיָה
  choice: Jeschaja
  rationale: Die Umschrift bewahrt die Namensform dieser Genealogie, ohne sie stillschweigend an die im Deutschen vertrautere Form »Jesaja« anzugleichen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die einleitende Stammesbezeichnung wird sinngemäß als »Nachkommen« wiedergegeben, während die einzelnen Glieder der Genealogie mit der formnahen Sohn-Formel erscheinen. Die Personennamen folgen einer hebräisch orientierten deutschen Umschrift.
