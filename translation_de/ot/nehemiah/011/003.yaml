source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ רָאשֵׁ֣י הַ/מְּדִינָ֔ה אֲשֶׁ֥ר יָשְׁב֖וּ בִּ/ירוּשָׁלִָ֑ם וּ/בְ/עָרֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ אִ֤ישׁ בַּ/אֲחֻזָּת/וֹ֙ בְּ/עָ֣רֵי/הֶ֔ם יִשְׂרָאֵ֤ל הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֣ם וְ/הַ/נְּתִינִ֔ים וּ/בְנֵ֖י עַבְדֵ֥י שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/003.yaml
  text: 'These are the heads of the province who lived in Jerusalem[a]. But in the cities of Judah, each man lived in his own possession in their cities: Israel, the priests, the Levites, the temple servants[b], and the descendants of Solomon’s servants.'
translation:
  language: de
  text: 'Und dies sind die Oberhäupter der Provinz, die in Jerusalem wohnten. In den Städten Judas aber wohnte jeder auf seinem eigenen Besitz, in ihren Städten: Israel[a], die Priester, die Leviten, die Tempeldiener[b] und die Nachkommen der Diener Salomos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“. Im Hebräischen steht lediglich „Israel“, vermutlich als Sammelbezeichnung innerhalb der Aufzählung.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „die Netinim“; eine dem Tempeldienst zugeordnete Gruppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַמְּדִינָה
  choice: die Oberhäupter der Provinz
  rationale: „Oberhäupter“ gibt das bildhafte רָאשֵׁי als Bezeichnung führender Personen würdig und verständlich wieder; „Provinz“ entspricht dem perserzeitlichen Verwaltungsgebiet.
- source_word: אֲשֶׁר יָשְׁבוּ בִּירוּשָׁלִָם
  choice: die in Jerusalem wohnten
  rationale: יָשַׁב bezeichnet hier den dauerhaften Wohnsitz; „wohnten“ ist natürliches modernes Deutsch.
- source_word: וּבְעָרֵי יְהוּדָה יָשְׁבוּ
  choice: In den Städten Judas aber wohnte
  rationale: Das nachgestellte „aber“ markiert den Wechsel beziehungsweise Kontrast zwischen Jerusalem und den übrigen Städten Judas, ohne den Satz unnatürlich eng an die hebräische Wortfolge zu binden.
- source_word: אִישׁ
  choice: jeder
  rationale: Das distributive אִישׁ bedeutet hier „jeder Einzelne“; „jeder“ bewahrt die maskuline Form und klingt im Deutschen idiomatischer als „jeder Mann“.
- source_word: בַּאֲחֻזָּתוֹ
  choice: auf seinem eigenen Besitz
  rationale: אֲחֻזָּה bezeichnet einen Landbesitz beziehungsweise ein erbliches Besitztum. „Auf seinem eigenen Besitz“ hält den konkreten Orts- und Eigentumsbezug fest.
- source_word: בְּעָרֵיהֶם
  choice: in ihren Städten
  rationale: Die Wendung wird trotz der für modernes Deutsch etwas redundanten Wiederaufnahme bewahrt, weil sie die jeweiligen Heimatorte der aufgezählten Gruppen ausdrücklich nennt.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der bloße Name wird formal beibehalten und wahrscheinlich kollektiv als Bezeichnung einer Bevölkerungsgruppe verstanden; die mögliche Deutung „die Israeliten“ wird in einer Fußnote genannt.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die übliche und eindeutige deutsche Entsprechung.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die übliche Bezeichnung dieser Gruppe.
- source_word: הַנְּתִינִים
  choice: die Tempeldiener
  rationale: Die Funktionsbezeichnung ist modernen Lesern verständlicher als die Transliteration „Netinim“ und gibt die institutionell dem Tempeldienst zugeordnete Gruppe wieder.
- source_word: בְּנֵי עַבְדֵי שְׁלֹמֹה
  choice: die Nachkommen der Diener Salomos
  rationale: בְּנֵי bezeichnet in einer Gemeinschafts- und Abstammungsliste die Nachkommen einer benannten Gruppe, nicht nur unmittelbare Söhne.
