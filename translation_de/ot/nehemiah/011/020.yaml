  text: וּ/שְׁאָ֨ר יִשְׂרָאֵ֜ל הַ/כֹּהֲנִ֤ים הַ/לְוִיִּם֙ בְּ/כָל עָרֵ֣י יְהוּדָ֔ה אִ֖ישׁ בְּ/נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/020.yaml
  text: And the rest of Israel[a], the priests, and the Levites were in all the cities of Judah, each in his inheritance.
translation:
  language: de
  text: Das übrige Israel, die Priester und die Leviten lebten in allen Städten Judas, jeder auf seinem Erbbesitz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Mann in seinem Erbbesitz“; die hebräische Einzahl ist distributiv zu verstehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר יִשְׂרָאֵל
  choice: Das übrige Israel
  rationale: שְׁאָר bezeichnet den verbleibenden Teil. „Das übrige Israel“ gibt den kollektiven Ausdruck direkt wieder und wahrt den Gegensatz zu den zuvor genannten Bewohnern Jerusalems.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die übliche und sachlich genaue deutsche Bezeichnung für die priesterliche Gruppe.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die herkömmliche deutsche Wiedergabe für die Angehörigen der levitischen Gruppe.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: in allen Städten Judas
  rationale: Die Präposition ist hier lokal zu verstehen. „Juda“ wird im deutschen Genitiv idiomatisch als „Judas“ wiedergegeben.
- source_word: אִישׁ
  choice: jeder
  rationale: Das singularische אִישׁ hat hier distributive Funktion. „Jeder“ ist im modernen Deutsch natürlich und bewahrt den maskulinen Singular der Vorlage.
- source_word: בְּנַחֲלָתוֹ
  choice: in seinem Erbbesitz
  rationale: נַחֲלָה bezeichnet den ererbten beziehungsweise zugeteilten Landbesitz. „Erbbesitz“ bewahrt diesen land- und bundestheologischen Bedeutungsgehalt besser als das allgemeinere „Eigentum“.
theological_decisions:
- issue: Distributive maskuline Einzahl
  choice: jeder in seinem Erbbesitz
  alternative: alle in ihrem Erbbesitz; Mann für Mann in seinem Erbbesitz
  rationale: Die hebräische Form verbindet das distributive maskuline Singularwort אִישׁ mit einem maskulinen Singularsuffix. Die gewählte Fassung erhält diese Form, bleibt aber natürlicher als die streng wörtliche Alternative.
- issue: Bedeutungsgehalt von נַחֲלָה
  choice: Erbbesitz
  alternative: Erbteil; Eigentum
  rationale: „Erbbesitz“ lässt sowohl die konkrete Landzuteilung als auch deren überlieferungs- und bundestheologischen Hintergrund erkennen, ohne eine weitergehende Deutung festzuschreiben.
translation_notes:
  register: Moderne, würdige Standardsprache. „Lebten“ ergänzt das im hebräischen Nominalsatz nicht ausgedrückte Verb idiomatisch. Die kollektive Wendung „das übrige Israel“ und der landbezogene Ausdruck „Erbbesitz“ bewahren die Prägung der Vorlage.
