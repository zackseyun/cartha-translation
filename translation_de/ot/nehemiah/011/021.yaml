  yaml_path: translation/ot/nehemiah/011/021.yaml
  text: And the temple servants were living on the Ophel[a], and Ziha and Gishpa were over the temple servants.
translation:
  language: de
  text: Die Tempeldiener[a] wohnten auf dem Ofel, und Ziha und Gischpa waren die Aufseher der Tempeldiener.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch נְתִינִים (Netinim), eine Fachbezeichnung für eine dem Tempeldienst zugeordnete Gruppe.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: die Tempeldiener
  rationale: נְתִינִים ist eine nachexilische Fachbezeichnung für eine dem Tempeldienst zugeordnete Gruppe. „Tempeldiener“ vermittelt ihre Funktion verständlich und bewahrt den institutionellen Sinn.
- source_word: יֹשְׁבִים
  choice: wohnten
  rationale: Das Partizip von ישׁב bezeichnet hier einen andauernden Wohnsitz; im deutschen Erzählzusammenhang gibt „wohnten“ dies natürlich wieder.
- source_word: בָּעֹפֶל
  choice: auf dem Ofel
  rationale: עֹפֶל bezeichnet hier den Ofel, den erhöhten Geländerücken Jerusalems. Die Präposition ב mit Artikel wird topografisch angemessen mit „auf dem“ wiedergegeben.
- source_word: צִיחָא
  choice: Ziha
  rationale: Der Eigenname wird nach gebräuchlicher deutscher Umschrift wiedergegeben.
- source_word: גִשְׁפָּא
  choice: Gischpa
  rationale: Der Eigenname wird nach gebräuchlicher deutscher Umschrift wiedergegeben.
- source_word: עַל הַנְּתִינִים
  choice: waren die Aufseher der Tempeldiener
  rationale: עַל bezeichnet in diesem Verwaltungskontext eine Stellung der Aufsicht oder Leitung. Die substantivische deutsche Formulierung ergänzt kein separates Verbamt, sondern macht die knappe hebräische Konstruktion verständlich.
theological_decisions: []
translation_notes:
