  register: Moderner, würdiger Erzählstil. Die Ortsnamen werden in geläufiger deutscher Schreibweise wiedergegeben; die idiomatische geografische Beziehung wird verständlich ausgedrückt und in der Fußnote wörtlich erläutert.
