  text: and in Hazar-shual[a], and in Beer-sheba and its villages.
translation:
  language: de
  text: und in Hazar-Schual und in Beerscheba und in den dazugehörigen Dörfern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und in ihren Töchtern«; eine hebräische Bezeichnung für die zu einer Stadt gehörenden Dörfer oder Siedlungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֲצַר שׁוּעָל
  choice: und in Hazar-Schual
  rationale: Konjunktion und Präposition werden direkt mit »und in« wiedergegeben. Der Ortsname wird entsprechend der üblichen Behandlung geografischer Eigennamen transliteriert, nicht etymologisch als »Fuchsdorf« übersetzt.
- source_word: וּ/בִ/בְאֵר שֶׁבַע
  choice: und in Beerscheba
  rationale: Der bekannte Ortsname wird in seiner im Deutschen geläufigen Form »Beerscheba« wiedergegeben; Konjunktion und Präposition erscheinen als »und in«.
- source_word: וּ/בְנֹתֶיהָ
  choice: und den dazugehörigen Dörfern
  rationale: Das wörtliche »ihre Töchter« ist eine geografische Wendung für die von einer Stadt abhängigen Ortschaften. »Dazugehörige Dörfer« gibt diese Beziehung in natürlichem modernem Deutsch wieder; das feminine Suffix bezieht sich auf Beerscheba.
theological_decisions: []
