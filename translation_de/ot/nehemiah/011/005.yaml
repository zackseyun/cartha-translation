- source_word: וּ/מַעֲשֵׂיָה
  choice: und Maaseja
  rationale: Das vorangestellte ו wird beibehalten, weil der Vers die Liste fortsetzt. Der Personenname wird nach gebräuchlicher deutscher Bibeltradition transkribiert.
- source_word: בֶן
  choice: Sohn / Sohnes
  rationale: Das wiederholte genealogische בֶן wird durchgehend als „Sohn“ wiedergegeben; die Kasusformen folgen der natürlichen deutschen Reihung.
- source_word: בָּרוּךְ
