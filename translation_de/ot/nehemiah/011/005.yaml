- source_word: חֲזָיָה
  choice: Hasaja
  rationale: Transkription des Personennamens nach gebräuchlichen deutschen Namensformen.
- source_word: עֲדָיָה
  choice: Adaja
  rationale: Transkription des Personennamens nach gebräuchlicher deutscher Bibeltradition.
- source_word: יוֹיָרִיב
