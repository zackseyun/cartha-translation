  rationale: Die kürzere Form entspricht der hier vorliegenden hebräischen Schreibung, ohne eine vollere theophore Namensform einzutragen.
- source_word: זְכַרְיָה
  choice: Secharja
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: הַ/שִּׁלֹנִי
  choice: des Schiloniters
  rationale: Die Nisbe-Form mit Artikel bezeichnet wahrscheinlich eine Orts- oder Sippenzugehörigkeit. Die adjektivische Herkunftsbezeichnung bleibt im Haupttext erhalten.
theological_decisions:
