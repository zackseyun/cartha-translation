  variant: modern standard German
source:
  edition: WLC
  text: זָנֹ֤חַ עֲדֻלָּם֙ וְ/חַצְרֵי/הֶ֔ם לָכִישׁ֙ וּ/שְׂדֹתֶ֔י/הָ עֲזֵקָ֖ה וּ/בְנֹתֶ֑י/הָ וַ/יַּחֲנ֥וּ מִ/בְּאֵֽר שֶׁ֖בַע עַד גֵּֽיא הִנֹּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/030.yaml
  text: Zanoah[a], Adullam and their villages, Lachish and its fields, Azekah and its daughter towns[b]. So they camped from Beer-sheba as far as the Valley of Hinnom.
translation:
  language: de
  text: Zanoach, Adullam und ihre Dörfer, Lachisch und seine Felder, Aseka und seine Tochterstädte[a]. So ließen sie sich von Beerscheba bis zum Hinnomtal nieder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Dörfer« beziehungsweise »seine abhängigen Ortschaften«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »So lagerten sie«; im Zusammenhang kann das Verb auch »sie siedelten sich an« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנֹחַ
  choice: Zanoach
  rationale: Ortsname; in einer im Deutschen geläufigen, dem Hebräischen angenäherten Form wiedergegeben.
- source_word: עֲדֻלָּם
  choice: Adullam
  rationale: Ortsname; transliteriert.
- source_word: חַצְרֵיהֶם
  choice: ihre Dörfer
  rationale: חָצֵר bezeichnet in Ortslisten häufig abhängige ländliche Siedlungen; »Dörfer« ist im Deutschen natürlich und sachlich passend.
- source_word: לָכִישׁ
  choice: Lachisch
  rationale: Im Deutschen etablierte Form des Ortsnamens.
- source_word: שְׂדֹתֶיהָ
  choice: seine Felder
  rationale: Bewahrt die konkrete Bedeutung der zu Lachisch gehörenden landwirtschaftlichen Flächen.
- source_word: עֲזֵקָה
  choice: Aseka
  rationale: Im Deutschen gebräuchliche Form des Ortsnamens.
- source_word: בְנֹתֶיהָ
  choice: seine Tochterstädte
  rationale: Bewahrt das hebräische Bild für untergeordnete, von einer Stadt abhängige Ortschaften; eine Fußnote nennt die verständlichere Alternative.
- source_word: וַיַּחֲנוּ
  choice: So ließen sie sich nieder
  rationale: Das Verb bedeutet wörtlich »lagern«; im Zusammenhang der Wiederbesiedlung bezeichnet es wahrscheinlich das Niederlassen beziehungsweise Ansiedeln. Die Fußnote erhält die wörtliche Möglichkeit.
- source_word: מִבְּאֵר שֶׁבַע
  choice: von Beerscheba
  rationale: Verwendet die im Deutschen etablierte Schreibung des Ortsnamens.
- source_word: עַד
  choice: bis zum
  rationale: Drückt die räumliche Ausdehnung knapp und idiomatisch aus.
- source_word: גֵּיא הִנֹּם
  choice: Hinnomtal
  rationale: Geläufige deutsche Wiedergabe der Konstruktverbindung für das Tal bei Jerusalem.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Ortsliste bleibt knapp; das hebräische Siedlungsbild »Tochterstädte« wird im Text bewahrt und erklärt. Die mögliche Spannung zwischen dem wörtlichen »lagern« und dem kontextuellen »sich niederlassen« wird durch die Fußnote offengehalten.
