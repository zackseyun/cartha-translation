review_pass:
  verdict: approve
  source_fidelity: Der deutsche Text gibt die hebräische Ortsliste vollständig und in derselben Gliederung wieder. »ihre Dörfer«, »seine Felder« und »seine Tochterstädte« entsprechen den jeweiligen possessiven Formen und Siedlungsbezeichnungen. »ließen sie sich ... nieder« ist im Wiederbesiedlungskontext eine vertretbare kontextuelle Wiedergabe von וַיַּחֲנוּ; die Fußnote bewahrt zutreffend die wörtlichere Bedeutung »lagerten«.
  naturalness: Die Formulierung ist knapp, gut verständlich und entspricht modernem Standarddeutsch bei einer antiken Ortsliste. Die Schreibungen Zanoach, Adullam, Lachisch, Aseka, Beerscheba und Hinnomtal sind im Deutschen nachvollziehbar und konsistent.
  terminology: »Tochterstädte« bewahrt das hebräische Bild für abhängige Siedlungen, während die Fußnote verständliche sachliche Alternativen bietet. Die Fußnote zu »ließen sie sich nieder« stellt die lexikalische Grundbedeutung des Verbs angemessen heraus. Die Fußnotenanker im deutschen Text stehen jeweils bei dem Wort, das sie erläutern.
  issues:
  - severity: low
    issue: Die englische Audit-Fassung setzt ihre Fußnotenanker offenbar vertauscht.
    rationale: 'Dort steht [a] bei Zanoah, obwohl der Text der Fußnote die »daughter towns« erläutert, und [b] bei »daughter towns«, obwohl die Fußnote das Verb »camped« betrifft. Der deutsche Entwurf übernimmt diesen Fehler nicht: [a] steht bei »Tochterstädte« und [b] beim Niederlassen.'
