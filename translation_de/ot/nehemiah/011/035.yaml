  rationale: Der Ortsname wird in seiner etablierten Form wiedergegeben.
- source_word: וְ/אוֹנוֹ
  choice: und Ono
  rationale: Die Konjunktion wird direkt mit „und“ wiedergegeben; der Ortsname wird transliteriert.
- source_word: גֵּי
  choice: das Tal der
  rationale: Die Konstruktform bezeichnet ein Tal, das durch das folgende Substantiv näher bestimmt wird; „das Tal der“ ist dafür im Deutschen natürlich.
- source_word: הַחֲרָשִׁים
  choice: Handwerker
  rationale: Das hebräische Substantiv bezeichnet allgemein Handwerker, kann aber je nach Zusammenhang auch enger Schmiede meinen. Die breitere Wiedergabe wahrt die lexikalische Offenheit und eignet sich für die Ortsbezeichnung.
