  source_fidelity: 'Die Übersetzung gibt sämtliche Elemente des Hebräischen zutreffend wieder: die Gesamtgruppe (כָּל), den genealogischen Ausdruck בני־פרץ sinnvoll als „Nachkommen des Perez“, die Ansässigkeit in Jerusalem, die Zahl 468 und אנשי חיל als anerkennende Personenbezeichnung. Die genealogische Auslegung von „Söhne“ als „Nachkommen“ ist in diesem Registerkontext sachgerecht.'
