  text: כָּל בְּנֵי פֶ֕רֶץ הַ/יֹּשְׁבִ֖ים בִּ/ירוּשָׁלִָ֑ם אַרְבַּ֥ע מֵא֛וֹת שִׁשִּׁ֥ים וּ/שְׁמֹנָ֖ה אַנְשֵׁי חָֽיִל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/006.yaml
  text: All the sons of Perez who lived in Jerusalem were four hundred sixty-eight valiant men[a].
translation:
  language: de
  text: Alle Nachkommen des Perez, die in Jerusalem wohnten, waren vierhundertachtundsechzig tapfere Männer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »tüchtige Männer«. Die hebräische Wendung kann Männer bezeichnen, die sich durch Stärke, Tüchtigkeit oder Tapferkeit auszeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Alle
  rationale: Gibt den umfassenden Sinn der hebräischen Mengenangabe in diesem Verzeichnis direkt wieder.
- source_word: בְּנֵי פֶרֶץ
  choice: Nachkommen des Perez
  rationale: Wörtlich »Söhne des Perez«; in diesem genealogischen Zusammenhang bezeichnet die Wendung die Nachkommenschaft und nicht nur unmittelbare Söhne.
- source_word: הַיֹּשְׁבִים
  choice: die … wohnten
  rationale: Das Partizip von ישׁב bezeichnet hier das ansässige Wohnen; »wohnten« ist im Deutschen natürlich und dem Verzeichnisstil angemessen.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Entspricht der gewöhnlichen lokalen Bedeutung der Präposition mit dem Ortsnamen.
- source_word: אַרְבַּע מֵאוֹת שִׁשִּׁים וּשְׁמֹנָה
  choice: vierhundertachtundsechzig
  rationale: Die ausgeschriebene Zahl entspricht der hebräischen Kardinalzahl und passt zum würdevollen Fließtext.
- source_word: אַנְשֵׁי חָיִל
  choice: tapfere Männer
  rationale: Bewahrt die anerkennende Bedeutung der Wendung und ihre mögliche Verbindung zu Stärke und Wehrhaftigkeit; die weitere Bedeutungsbreite wird in der Fußnote offengehalten.
theological_decisions: []
