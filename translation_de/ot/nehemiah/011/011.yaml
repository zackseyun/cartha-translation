source:
  edition: WLC
  text: שְׂרָיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖ד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/011.yaml
  text: Seraiah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub[b], leader of the house of God.
translation:
  language: de
  text: Seraja, der Sohn Hilkijas, des Sohnes Meschullams, des Sohnes Zadoks, des Sohnes Merajots, des Sohnes Ahitubs, war der Vorsteher[a] des Hauses Gottes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Leiter“ oder „Oberster“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: des Tempels.'
    reason: cultural_note
lexical_decisions:
- source_word: שְׂרָיָה
  choice: Seraja
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert.
- source_word: בֶן
  choice: Sohn
  rationale: Die wiederholte genealogische Formel bedeutet hier am natürlichsten „Sohn“. Dass biblische Geschlechtsregister bisweilen Generationen überspringen können, rechtfertigt ohne weiteren Kontext nicht die allgemeinere Wiedergabe „Nachkomme“.
- source_word: נְגִיד
  choice: Vorsteher
  rationale: Das Wort bezeichnet einen Beauftragten in leitender Stellung. „Vorsteher“ passt zum priesterlich-administrativen Zusammenhang, ohne die königlichen Anklänge von „Herrscher“ einzutragen.
- source_word: בֵּית הָאֱלֹהִים
  choice: Haus Gottes
  rationale: Die wörtliche Wendung ist im Deutschen verständlich und bewahrt die Bildsprache des Hebräischen; sachlich ist damit der Tempel gemeint.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: In dieser Verbindung bezeichnet אֱלֹהִים den Gott Israels und wird daher im Singular wiedergegeben.
