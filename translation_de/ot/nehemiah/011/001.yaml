base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/001.yaml
  text: The officials of the people lived in Jerusalem[a], and the rest of the people cast lots to bring one out of ten to live in Jerusalem, the holy city, while nine parts remained in the towns.
translation:
  language: de
  text: Die führenden Amtsträger des Volkes wohnten in Jerusalem, und das übrige Volk warf Lose, um einen von zehn dazu zu bringen, in Jerusalem, der heiligen Stadt, zu wohnen; neun Teile[a] blieben in den Städten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen: „und neun Hände in den Städten“. Gemeint sind die übrigen neun Teile von zehn.'
    reason: Das hebräische Idiom lässt sich im Deutschen nicht wörtlich verständlich wiedergeben; die Fußnote dokumentiert die Bildsprache des Ausgangstextes.
lexical_decisions:
- source_word: שָׂרֵי הָעָם
  choice: die führenden Männer des Volkes
  rationale: שָׂרִים bezeichnet führende Amtsträger oder Oberste. Die Wiedergabe ist im heutigen Deutsch verständlich und vermeidet das missverständliche oder altertümliche „Fürsten“.
- source_word: וַיֵּשְׁבוּ
  choice: wohnten
  rationale: ישׁב bezeichnet hier dauerhaftes Wohnen beziehungsweise Ansässigsein, nicht das bloße Sitzen.
- source_word: וּשְׁאָר הָעָם
  choice: das übrige Volk
  rationale: שְׁאָר bezeichnet den Rest beziehungsweise den verbleibenden Teil des Volkes.
- source_word: הִפִּילוּ גוֹרָלוֹת
  choice: warf Lose
  rationale: Dies ist die geläufige deutsche Entsprechung für das hebräische Losverfahren.
- source_word: לְהָבִיא אֶחָד מִן הָעֲשָׂרָה
  choice: um einen von zehn … zu holen
  rationale: Der Hifil-Infinitiv von בוא drückt ein Veranlassen des Kommens aus; „holen“ gibt dies natürlich wieder, während „einen von zehn“ das Auswahlverhältnis bewahrt.
- source_word: עִיר הַקֹּדֶשׁ
  choice: die heilige Stadt
  rationale: Die feste und direkte deutsche Entsprechung der Constructusverbindung.
- source_word: וְתֵשַׁע הַיָּדוֹת
  choice: die übrigen neun Teile blieben
  rationale: Wörtlich steht „neun Hände“, hier idiomatisch neun Anteile der zuvor genannten Zehnergruppe. „Blieben“ ist für einen vollständigen deutschen Satz sinngemäß ergänzt.
- source_word: בֶּעָרִים
  choice: in den anderen Ortschaften
  rationale: עָרִים kann Städte oder kleinere Orte bezeichnen. „Ortschaften“ wahrt die Größenoffenheit und macht den Gegensatz zu Jerusalem deutlich.
