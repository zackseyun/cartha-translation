  naturalness: Die Überarbeitung ist modernes, würdiges Standarddeutsch. »in allen Angelegenheiten des Volkes« ist knapper und idiomatischer als ein Relativsatz und lässt den im Hebräischen möglichen Bezug sowohl auf das Volk betreffende als auch ihm dienende Angelegenheiten offen.
  terminology: Petachja, Meschesabel, Serach und Juda sind als deutsche Namensformen vertretbar. »Nachkommen« gibt בְּנֵי in diesem genealogischen Zusammenhang angemessen wieder. Die Fußnoten halten die funktionale Mehrdeutigkeit der königlichen Formel und diejenige von לָעָם offen.
