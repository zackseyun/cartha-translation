  register: Modernes, würdiges Standarddeutsch. Die schwer eindeutig zu bestimmende Amtsfunktion Petachjas und die Mehrdeutigkeit von לָעָם werden nicht stillschweigend festgelegt, sondern durch Fußnoten offengehalten.
