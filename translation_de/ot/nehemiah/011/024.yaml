base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/024.yaml
  text: And Pethahiah son of Meshezabel[a], from the sons of Zerah son of Judah[b], was at the king’s side for every matter concerning the people.
translation:
  language: de
  text: Und Petachja, der Sohn Meschesabels, von den Nachkommen Serachs, des Sohnes Judas, stand dem König zur Seite[a] in allen Angelegenheiten des Volkes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »an der Hand des Königs«. Die Wendung kann eine Stellung im Dienst des Königs oder die Funktion als sein Beauftragter bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in allen Angelegenheiten für das Volk«. Das Hebräische kann Angelegenheiten des Volkes oder Angelegenheiten meinen, die für das Volk wahrgenommen wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְתַֽחְיָה
  choice: Und Petachja
  rationale: Die Konjunktion verbindet den Vers mit der fortlaufenden Aufzählung. Der Name wird in einer im Deutschen üblichen, quellennahen Form wiedergegeben.
- source_word: בֶּן מְשֵֽׁיזַבְאֵל
  choice: der Sohn Meschesabels
  rationale: Die genealogische Verbindung wird ausdrücklich und in natürlichem Deutsch wiedergegeben.
- source_word: מִ/בְּנֵי זֶרַח בֶּן יְהוּדָה
  choice: von den Nachkommen Serachs, des Sohnes Judas
  rationale: בְּנֵי bezeichnet hier die Abstammungslinie; »Nachkommen« ist im Deutschen klarer als das wörtliche »Söhne«. Die genealogische Kette bleibt vollständig erhalten.
- source_word: לְ/יַד הַ/מֶּלֶךְ
  choice: stand dem König bei
  rationale: Wörtlich »zur Hand des Königs«. Die Formulierung bewahrt das Bild der Nähe zum König, klingt aber natürlich und lässt eine amtliche Beauftragung offen.
- source_word: לְ/כָל דָּבָר
  choice: in allen Angelegenheiten
  rationale: דָּבָר bezeichnet im Verwaltungskontext Angelegenheiten oder Geschäfte, nicht bloß ein gesprochenes Wort.
- source_word: לָ/עָם
  choice: die das Volk betrafen
  rationale: Die Präposition ל kann hier Angelegenheiten bezeichnen, die das Volk betreffen, oder solche, die für das Volk erledigt werden. Der Haupttext gibt die wahrscheinlichere relationale Bedeutung wieder; die Alternative steht in der Fußnote.
