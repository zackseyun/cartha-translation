lexical_decisions:
- source_word: וּ/בְ
  choice: und in / in
  rationale: Die wiederholte Verbindung aus ו und ב bezeichnet die weiteren Wohnorte der Liste. Im Deutschen wird das erste וּבְ mit „und in“ wiedergegeben; beim zweiten Glied genügt idiomatisch „in“, während das letzte וּבְ erneut als „und in“ erscheint.
- source_word: יֵשׁוּעַ
  choice: Jeschua
  rationale: Der Ortsname wird entsprechend der im Deutschen üblichen biblischen Namensform transkribiert und nicht übersetzt.
- source_word: מוֹלָדָה
  choice: Molada
  rationale: Der Ortsname wird in einer etablierten deutschen Form transkribiert.
- source_word: בֵית פָּלֶט
  choice: Bet-Pelet
  rationale: Der zusammengesetzte Ortsname wird transkribiert. Der Bindestrich macht seine Einheit als Ortsname deutlich; eine wörtliche Übersetzung wäre für den Haupttext weniger geeignet.
