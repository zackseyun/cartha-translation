base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/009.yaml
  text: And Joel son of Zichri was overseer over them[a], and Judah son of Hassenuah was second over the city.
translation:
  language: de
  text: Joel, der Sohn Sichris, war ihr Aufseher, und Juda, der Sohn Hassenuas, war der Zweite über die Stadt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „war Stellvertreter über die Stadt“ oder „war der Zweite im Rang über die Stadt“.'
    reason: Das hebräische מִשְׁנֶה bezeichnet einen Zweiten im Rang oder einen Stellvertreter; die genaue Verwaltungsfunktion bleibt offen. Die Wendung עַל הָעִיר bezeichnet dabei seinen Zuständigkeitsbereich.
lexical_decisions:
- source_word: פָּקִיד
  choice: als Aufseher eingesetzt
  rationale: Das Substantiv bezeichnet einen bestellten Amts- oder Aufsichtsträger. Die Formulierung gibt sowohl die Einsetzung als auch die Aufsichtsfunktion natürlich wieder, ohne das Amt militärisch oder königlich zu verengen.
- source_word: עֲלֵיהֶם
  choice: über sie
  rationale: Die Präposition mit Suffix bezeichnet hier Zuständigkeit beziehungsweise Autorität und wird in enger Verbindung mit „Aufseher“ wiedergegeben.
- source_word: מִשְׁנֶה
  choice: der Zweite
  rationale: Der Ausdruck bezeichnet einen zweitrangigen Amtsträger oder Stellvertreter. Die knappe Wiedergabe bewahrt die Offenheit des Hebräischen hinsichtlich der genauen Amtsbezeichnung.
- source_word: עַל הָעִיר
  choice: über die Stadt
  rationale: Die Wendung bezeichnet den Zuständigkeitsbereich. Die formal nahe Wiedergabe lässt offen, ob vor allem Rang, Stellvertretung oder Verwaltungsverantwortung gemeint ist.
- source_word: הַסְּנוּאָה
  choice: Ha-Senua
  rationale: Der Personen- oder Familienname wird transliteriert; „Ha-“ bildet den im masoretischen Text vorhandenen Artikel ab, ohne ihn mit dem Namen vollständig zu verschmelzen.
- source_word: וְ
  choice: und
  rationale: Die Konjunktion verbindet die beiden Amtsangaben und wahrt den fortlaufenden Listencharakter des Abschnitts.
