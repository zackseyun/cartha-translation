translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Amtsbezeichnungen bleiben bewusst knapp und leicht fremdartig, um die Mehrdeutigkeit der hebräischen Verwaltungssprache nicht durch eine moderne, zu genaue Amtsbezeichnung aufzulösen.
