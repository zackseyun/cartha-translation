  text: וּ/בִֽ/ירוּשָׁלִַ֨ם֙ יָֽשְׁב֔וּ מִ/בְּנֵ֥י יְהוּדָ֖ה וּ/מִ/בְּנֵ֣י בִנְיָמִ֑ן מִ/בְּנֵ֣י יְ֠הוּדָה עֲתָיָ֨ה בֶן עֻזִּיָּ֜ה בֶּן זְכַרְיָ֧ה בֶן אֲמַרְיָ֛ה בֶּן שְׁפַטְיָ֥ה בֶן מַהֲלַלְאֵ֖ל מִ/בְּנֵי פָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/004.yaml
  text: 'And in Jerusalem there lived some of the sons of Judah and some of the sons of Benjamin[a]. Of the sons of Judah: Athaiah son of Uzziah, son of Zechariah, son of Amariah, son of Shephatiah, son of Mahalalel[b], of the sons of Perez.'
translation:
  language: de
  text: 'Und in Jerusalem wohnten einige der Nachkommen Judas und einige der Nachkommen Benjamins.[a] Von den Nachkommen Judas: Ataja, der Sohn Usijas, des Sohnes Secharjas, des Sohnes Amarjas, des Sohnes Schefatjas, des Sohnes Mahalalels, von den Nachkommen des Perez.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Nachkommen Judas“ und „Nachkommen Benjamins“ bezeichnet hier Angehörige beziehungsweise Nachfahren dieser Stammeslinien.
    reason: cultural_note
  - marker: b
    text: Wörtlich steht in der Abstammungsreihe jeweils „Sohn“. Biblische Geschlechtsregister können dabei auch Generationen überspringen.
    reason: translation_clarification
lexical_decisions:
- source_word: וּבִירוּשָׁלַם
  choice: Und in Jerusalem
  rationale: Die Verbindung aus Konjunktion und Präposition führt die Aufzählung des vorausgehenden Zusammenhangs fort; „Und“ bildet diesen Anschluss im Deutschen angemessen ab.
- source_word: יָשְׁבוּ
  choice: wohnten
  rationale: ישב bezeichnet hier das Wohnen beziehungsweise Ansässigsein. „Wohnten“ ist natürliches modernes Deutsch und passt zum Siedlungs- und Einwohnerverzeichnis.
- source_word: מִבְּנֵי יְהוּדָה / וּמִבְּנֵי בִנְיָמִן
  choice: einige von den Nachkommen Judas / einige von den Nachkommen Benjamins
  rationale: בני bezeichnet in diesem Stammeszusammenhang Angehörige beziehungsweise Nachkommen, während das partitive מִן jeweils eine Teilmenge kennzeichnet. „Nachkommen“ bewahrt den genealogischen Bezug, ohne ausschließlich unmittelbare Söhne nahezulegen.
- source_word: מִבְּנֵי יְהוּדָה
  choice: 'Von den Nachkommen Judas:'
  rationale: Die zweite Wendung leitet die namentliche Aufzählung der judäischen Linie ein und wird daher als knappe Überschrift wiedergegeben.
- source_word: עֲתָיָה
  choice: Ataja
  rationale: Deutsche, am Hebräischen orientierte Wiedergabe des Personennamens.
- source_word: בֶּן
  choice: Sohn / des Sohnes
  rationale: In der genealogischen Kette wird בן formal als „Sohn“ wiedergegeben. Die deutsche Kasusfolge macht die Beziehungen der Namen untereinander deutlich, auch wenn biblische Genealogien Generationen auslassen können.
- source_word: עֻזִּיָּה / זְכַרְיָה / אֲמַרְיָה / שְׁפַטְיָה / מַהֲלַלְאֵל
  choice: Usija / Secharja / Amarja / Schefatja / Mahalalel
  rationale: Gebräuchliche deutsche, hebraisch orientierte Namensformen.
- source_word: פָרֶץ
  choice: Perez
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Stammesbezeichnung בני wird im Haupttext verständlich als „Nachkommen“ wiedergegeben; die genealogische Einzelkette bewahrt dagegen die formale Wendung „Sohn“. Die Namen folgen geläufigen deutschen Bibelformen.
