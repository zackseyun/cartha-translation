base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/017.yaml
  text: And Mattaniah son of Micah[a], son of Zabdi, son of Asaph, was the head, who began the thanksgiving in prayer; and Bakbukiah was second among his brothers; and Abda son of Shammua, son of Galal, son of Jeduthun.
translation:
  language: de
  text: Und Mattanja, Sohn Michas, Sohn Sabdis, Sohn Asafs, war der Vorsteher, der beim Gebet den Dank anstimmte[a]; Bakbukja war der Zweite unter seinen Brüdern; und Abda, Sohn Schammuas, Sohn Galals, Sohn Jedutuns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „Vorsteher des Anfangs, der beim Gebet Dank sagt“. Die hebräische Formulierung ist ungewöhnlich; sie kann bedeuten, dass Mattanja den Dank leitete oder eröffnete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: Leiter
  rationale: Das Wort bezeichnet hier eine führende Stellung. „Leiter“ gibt die Funktion im Deutschen natürlicher wieder als das wörtliche „Haupt“.
- source_word: הַתְּחִלָּה
  choice: anstimmte
  rationale: Das Substantiv „Anfang“ steht in einer schwierigen Verbindung mit „Leiter“ und dem folgenden Verb. Die verbale Wiedergabe drückt aus, dass Mattanja den liturgischen Lobpreis eröffnete, ohne eine eigene Amtsbezeichnung einzuführen.
- source_word: יְהוֹדֶה
  choice: den Lobpreis
  rationale: Im gottesdienstlichen Zusammenhang bezeichnet die Hifil-Form von ידה das Danken oder Preisen. „Lobpreis“ passt hier zum levitischen Gebetsdienst; die mögliche wörtlichere Wiedergabe mit „Dank sagen“ wird in der Fußnote bewahrt.
- source_word: לַתְּפִלָּה
  choice: beim Gebet
  rationale: Die Präposition ל bezeichnet hier am ehesten den liturgischen Zusammenhang oder Anlass. „Beim Gebet“ ist idiomatisch und hält die Beziehung zwischen Lobpreis und Gebet offen.
- source_word: מִשְׁנֶה
  choice: der Zweite
  rationale: Der Ausdruck bezeichnet eine zweite Stellung oder Rangstufe. Die knappe Formulierung erhält diese Bedeutung, ohne ausdrücklich „Stellvertreter“ zu sagen.
- source_word: מֵאֶחָיו
  choice: unter seinen Brüdern
  rationale: Dies entspricht der Gruppen- und Verwandtschaftssprache des Hebräischen. „Unter seinen levitischen Brüdern“ wäre erklärender, ginge aber über den unmittelbaren Wortlaut hinaus.
- source_word: יְדִיתוּן
  choice: Jedutun
  rationale: „Jedutun“ ist die etablierte deutsche Form des Personennamens.
theological_decisions:
- issue: Bedeutung von ידה im gottesdienstlichen Zusammenhang
  choice: lobpreisen beziehungsweise danken
  alternative: bekennen
  rationale: ידה kann in anderen Zusammenhängen „bekennen“ bedeuten. Die levitisch-liturgische Umgebung und die Verbindung mit dem Gebet sprechen hier jedoch für Danken oder Lobpreisen; dies ist eine kontextuelle, keine konfessionelle Festlegung.
- issue: Funktion Mattanjas beim Gebet
  choice: Er stimmte den Lobpreis an
  alternative: Er war der Leiter des Anfangs und dankte beim Gebet
  rationale: Die hebräische Wortfolge רֹאשׁ הַתְּחִלָּה יְהוֹדֶה ist syntaktisch gedrängt und mehrdeutig. Der Haupttext gibt den wahrscheinlich gemeinten liturgischen Leitungsdienst natürlich wieder; die Fußnote bewahrt die ungewöhnliche Struktur und alternative Nuance.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die genealogische Reihung bleibt erhalten; „Dazu kam“ stellt den Anschluss des letzten Namens natürlich her. Für die Personennamen werden geläufige deutsche Bibelformen verwendet.
