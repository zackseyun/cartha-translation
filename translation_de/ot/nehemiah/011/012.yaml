base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/012.yaml
  text: And their brothers[a], doers of the work for the house, were eight hundred twenty-two; and Adaiah son of Jeroham, son of Pelaliah, son of Amzi, son of Zechariah, son of Pashhur, son of Malchijah.
translation:
  language: de
  text: Und ihre Brüder, die die Arbeit für das Haus[a] verrichteten, waren 822. Und Adaja, Sohn Jerohams, Sohn Pelaljas, Sohn Amzis, Sohn Secharjas, Sohn Paschhurs, Sohn Malkijas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für den Tempel“. Wörtlich steht im Hebräischen „für das Haus“; im Zusammenhang ist damit der Tempel gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Und ihre Brüder
  rationale: „Brüder“ gibt den hebräischen Verwandtschaftsbegriff unmittelbar wieder. Im Zusammenhang sind Angehörige derselben priesterlichen Gruppe gemeint; „Mitpriester“ wäre jedoch stärker auslegend.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: die die Arbeit verrichteten
  rationale: Die partizipiale Wendung wird in natürlichem Deutsch als Relativsatz wiedergegeben, ohne den allgemeinen Begriff für „Arbeit/Aufgabe“ zu spezifizieren.
- source_word: לַבַּיִת
  choice: für das Haus
  rationale: „Haus“ entspricht dem hebräischen בַּיִת; aus dem Zusammenhang ist der Tempel gemeint. „Für“ bewahrt die Zweck- bzw. Zuordnungsrichtung der Präposition besser als ein rein örtliches „im“.
- source_word: שְׁמֹנֶה מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: '822'
  rationale: Die Zahl wird nach üblicher moderner deutscher Schreibweise in Ziffern wiedergegeben.
- source_word: וַעֲדָיָה
  choice: Dazu kam Adaja
  rationale: Das vorangestellte ו setzt die Aufzählung fort. „Dazu kam“ macht diesen Anschluss im Deutschen verständlich, ohne eine zusätzliche Beziehung zwischen den Personen festzulegen.
- source_word: בֶּן
  choice: der Sohn …, des Sohnes …
  rationale: Die genealogische Formel wird konsequent als „Sohn“ wiedergegeben. Mögliche ausgelassene Generationen werden nicht interpretierend durch „Nachkomme“ ersetzt.
- source_word: יְרֹחָם / פְּלַלְיָה / אַמְצִי / זְכַרְיָה / פַּשְׁחוּר / מַלְכִּיָּה
  choice: Jeroham / Pelalja / Amzi / Secharja / Paschhur / Malkija
  rationale: Die Personennamen werden in im Deutschen geläufigen, quellennahen Formen wiedergegeben.
