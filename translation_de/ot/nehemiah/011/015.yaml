id: NEH.11.15
reference: Nehemiah 11:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מִֽן הַ/לְוִיִּ֑ם שְׁמַעְיָ֧ה בֶן חַשּׁ֛וּב בֶּן עַזְרִיקָ֥ם בֶּן חֲשַׁבְיָ֖ה בֶּן בּוּנִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/015.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, son of Bunni.'
translation:
  language: de
  text: 'Und von den Leviten: Schemaja, der Sohn Haschubs[a], des Sohnes Asrikams, des Sohnes Haschabjas, des Sohnes Bunnis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Sohn“ kann in Geschlechtsregistern mitunter auch einen entfernteren Nachkommen bezeichnen, nicht unbedingt den unmittelbaren Sohn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Und von
  rationale: Die Verbindung aus וּ und מִן knüpft diesen Eintrag an die vorausgehende Aufzählung an; „Und von“ bewahrt diese Anschlussfunktion.
- source_word: הַלְוִיִּם
  choice: den Leviten
  rationale: Der Ausdruck bezeichnet Angehörige des Stammes Levi als anerkannte Gruppe; „die Leviten“ ist die übliche und natürliche deutsche Wiedergabe.
- source_word: שְׁמַעְיָה
  choice: Schemaja
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition transkribiert.
- source_word: בֶן
  choice: Sohn
  rationale: In genealogischen Reihen ist „Sohn“ die formnahe Standardwiedergabe; die mögliche weitere Bedeutung „Nachkomme“ wird in der Fußnote offengehalten.
- source_word: חַשּׁוּב
  choice: Haschub
  rationale: Transkription des Personennamens in einer für deutsche Leser geläufigen Form.
- source_word: עַזְרִיקָם
  choice: Asrikam
  rationale: Transkription des Personennamens nach deutscher Laut- und Schreibkonvention.
- source_word: חֲשַׁבְיָה
  choice: Haschabja
  rationale: Transkription des Personennamens in der gängigen deutschen biblischen Form.
- source_word: בּוּנִּי
  choice: Bunni
  rationale: Formnahe Transkription des Personennamens; die Konsonantenverdopplung wird beibehalten.
theological_decisions:
- issue: Reichweite der genealogischen Bezeichnung בֶן
  choice: Im Haupttext „Sohn“, mit Fußnote zur möglichen Bedeutung „Nachkomme“
  alternative: Durchgehend „Nachkomme“
  rationale: Der hebräische Ausdruck bezeichnet gewöhnlich einen Sohn, kann in Geschlechtsregistern aber auch eine entferntere Abstammungsbeziehung ausdrücken. Die Übersetzung wahrt die Form des Textes, ohne die genealogische Reichweite vorschnell festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Listenform des Hebräischen bleibt erhalten; die wiederholte Genitivkonstruktion macht die Abstammungsfolge im Deutschen eindeutig.
