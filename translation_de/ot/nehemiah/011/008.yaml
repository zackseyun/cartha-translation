lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Und nach ihm kamen
  rationale: Die Wendung bedeutet wörtlich »und nach ihm«. Im Zusammenhang der Liste bezeichnet sie am ehesten die Reihenfolge der aufgeführten Bewohner oder Sippen. »kamen« ergänzt im Deutschen idiomatisch das im Hebräischen ausgelassene Verb, ohne die Aussage wesentlich zu erweitern.
- source_word: גַּבַּי
  choice: Gabbai
  rationale: Der Personenname wird nach der hebräischen Form transliteriert.
- source_word: סַלָּי
  choice: Sallai
  rationale: Der Personenname wird nach der hebräischen Form transliteriert.
- source_word: תְּשַׁע מֵאוֹת עֶשְׂרִים וּשְׁמֹנָה
  choice: neunhundertachtundzwanzig
  rationale: Die hebräische Zahlenfolge ergibt 9 × 100 + 20 + 8 = 928. Die ausgeschriebene Form entspricht dem würdigen, gut lesbaren Register.
theological_decisions: []
