  text: וְ/אֶל הַ/חֲצֵרִ֖ים בִּ/שְׂדֹתָ֑/ם מִ/בְּנֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ בְּ/קִרְיַ֤ת הָֽאַרְבַּע֙ וּ/בְנֹתֶ֔י/הָ וּ/בְ/דִיבֹן֙ וּ/בְנֹתֶ֔י/הָ וּ/בִֽ/יקַּבְצְאֵ֖ל וַ/חֲצֵרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/025.yaml
  text: As for the villages in their fields[a], some of the sons of Judah lived in Kiriath-arba and its villages, and in Dibon and its villages[c][b], and in Jekabzeel and its settlements.
translation:
  language: de
  text: 'Was die Dörfer in ihren Feldern betrifft: Einige der Söhne Judas wohnten in Kirjat-Arba[a] und den zugehörigen Dörfern[b], in Dibon und den zugehörigen Dörfern sowie in Jekabzeel[c] und den dazugehörigen Siedlungen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirjat-Arba ist der ältere Name Hebrons; siehe Josua 14,15.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich: „Töchter“; damit sind die von einer Stadt abhängigen oder sie umgebenden Dörfer gemeint.'
    reason: lexical_alternative
  - marker: c
    text: Jekabzeel wird in verwandten Überlieferungen und Bibelstellen auch „Kabzeel“ genannt.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶל הַחֲצֵרִים בִּשְׂדֹתָם
  choice: Was die Dörfer auf ihrem Ackerland betrifft
  rationale: וְאֶל markiert hier wahrscheinlich den Übergang zu einer neuen Gruppe innerhalb der Liste; חֲצֵרִים bezeichnet in diesem geografischen Zusammenhang ländliche Ortschaften, und שָׂדוֹת landwirtschaftlich genutztes Gebiet.
- source_word: מִבְּנֵי יְהוּדָה
  choice: Einige von den Söhnen Judas
  rationale: Die partitive Präposition מִן wird mit „einige von“ ausdrücklich wiedergegeben; „Söhne Judas“ bewahrt die genealogisch-stammesbezogene Ausdrucksweise des Hebräischen.
- source_word: יָשְׁבוּ
  choice: wohnten
  rationale: Das Verb bezeichnet hier den Wohnsitz; „wohnten“ ist natürlich und unterstellt nicht eigens einen erstmaligen Ansiedlungsvorgang.
- source_word: בְּקִרְיַת הָאַרְבַּע
  choice: in Kirjat-Arba
  rationale: Der Ortsname wird transliteriert; seine Identifikation mit Hebron gehört nicht in den Vers selbst und wird in einer Fußnote angegeben.
- source_word: וּבְנֹתֶיהָ
  choice: und den zugehörigen Dörfern
  rationale: Wörtlich steht „ihren Töchtern“. Gemeint sind abhängige oder umliegende Ortschaften einer Stadt; die natürliche deutsche Wiedergabe wird durch eine Fußnote transparent gemacht.
- source_word: וּבְדִיבוֹן
  choice: in Dibon
  rationale: Der Ortsname wird transliteriert.
- source_word: וּבִיקַּבְצְאֵל
  choice: in Jekabzeel
  rationale: Die masoretische Form wird als Jekabzeel wiedergegeben; die verwandte Namensform Kabzeel wird als text- und traditionsrelevante Alternative vermerkt.
- source_word: וַחֲצֵרֶיהָ
  choice: und den dazugehörigen Siedlungen
  rationale: חֲצֵרִים bezeichnet auch hier abhängige ländliche Wohnplätze. „Siedlungen“ unterscheidet den Ausdruck stilistisch von dem unmittelbar zuvor verwendeten Idiom „Töchter“.
theological_decisions:
- issue: Geschlechtlich markierte Stammesbezeichnung מִבְּנֵי יְהוּדָה
  choice: Söhne Judas
  alternative: Leute aus Juda
  rationale: Die genealogisch-stammesbezogene Form des Hebräischen bleibt erhalten. Der Ausdruck bezeichnet hier die Zugehörigkeit zu Juda und ist nicht als eigenständige theologische Aussage über ausschließlich männliche Bewohner zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die aufzählende Struktur und die stammesbezogene Sprache des hebräischen Verwaltungstextes bleiben erkennbar, während das Ortsidiom בנותיה natürlich wiedergegeben und in einer Fußnote erläutert wird.
