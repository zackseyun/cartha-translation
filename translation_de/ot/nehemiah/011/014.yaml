  yaml_path: translation/ot/nehemiah/011/014.yaml
  text: And their brothers[a], mighty men of valor, were one hundred twenty-eight; and the overseer over them was Zabdiel son of Haggedolim.
translation:
  language: de
  text: Und ihre Brüder, tapfere Männer, waren 128; ihr Aufseher war Sabdiel, der Sohn Hagedolims.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Sohn der Großen“ beziehungsweise „der Sohn der Vornehmen“. Der hebräische Ausdruck kann statt eines Eigennamens auch eine Beschreibung sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Und ihre Brüder
  rationale: Die wörtliche Wiedergabe bewahrt die männliche Gruppenbezeichnung; im Zusammenhang sind weitere Angehörige derselben Gruppe gemeint.
- source_word: גִּבּוֹרֵי חַיִל
  choice: tüchtige Männer
  rationale: Die Wendung bezeichnet fähige, kraftvolle oder tapfere Männer. Da der unmittelbare Zusammenhang eine Verwaltungs- und Bewohnerliste ist, lässt „tüchtige Männer“ die militärische Nuance offen, ohne sie auszuschließen.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: '128'
  rationale: Direkte Wiedergabe der Kardinalzahl in moderner deutscher Schreibweise.
- source_word: וּפָקִיד עֲלֵיהֶם
  choice: ihr Vorgesetzter war
  rationale: פָקִיד bezeichnet einen eingesetzten Verantwortlichen oder Aufseher; „Vorgesetzter“ passt zum organisatorischen Kontext, ohne ein bestimmtes militärisches oder religiöses Amt festzulegen.
- source_word: זַבְדִּיאֵל
  choice: Sabdiël
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibelnamentradition wiedergegeben; das Trema verdeutlicht die getrennte Aussprache.
- source_word: בֶּן הַגְּדוֹלִים
  choice: der Sohn Hagedolims
  rationale: Im Haupttext wird הַגְּדוֹלִים als Eigen- oder Sippenname verstanden und samt Artikelbestandteil transliteriert; die mögliche beschreibende Lesart bleibt in der Fußnote erhalten.
