id: NEH.11.13
reference: Nehemiah 11:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶחָי/ו֙ רָאשִׁ֣ים לְ/אָב֔וֹת מָאתַ֖יִם אַרְבָּעִ֣ים וּ/שְׁנָ֑יִם וַ/עֲמַשְׁסַ֧י בֶּן עֲזַרְאֵ֛ל בֶּן אַחְזַ֥י בֶּן מְשִׁלֵּמ֖וֹת בֶּן אִמֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/013.yaml
  text: and his brothers[a], heads of fathers’ houses, 242; and Amashsai son of Azarel, son of Ahzai, son of Meshillemoth[c][b], son of Immer.
translation:
  language: de
  text: und seine Brüder, die Oberhäupter der Großfamilien[a], 242[b]; und Amaschsai[c], der Sohn Asarels, des Sohnes Achsais, des Sohnes Meschillemots, des Sohnes Immers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Oberhäupter der Vaterhäuser“; gemeint sind die Leiter väterlicher Sippen oder Großfamilien.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „zweihundertzweiundvierzig“.'
    reason: lexical_alternative
  - marker: c
    text: Der Name wird nach der masoretischen Form wiedergegeben; er kann auch „Amasai“ geschrieben werden.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶחָיו
  choice: und seine Brüder
  rationale: Die direkte Wiedergabe bewahrt die Verwandtschaftsbezeichnung; im Zusammenhang kann der Plural auch männliche Angehörige der priesterlichen Sippe einschließen.
- source_word: רָאשִׁים לְאָבוֹת
  choice: die Oberhäupter der Großfamilien
  rationale: Die Wendung bezeichnet leitende Männer väterlicher Sippenverbände. „Großfamilien“ vermittelt diese soziale Einheit im heutigen Deutsch natürlicher als die wörtliche Form „Vaterhäuser“.
- source_word: מָאתַיִם אַרְבָּעִים וּשְׁנָיִם
  choice: '242'
  rationale: Die hebräische Zahl lautet zweihundertzweiundvierzig; Ziffern sind in dieser Namens- und Zählliste gut erfassbar.
- source_word: וַעֲמַשְׁסַי
  choice: und Amaschsai
  rationale: Die Umschrift folgt möglichst eng der masoretischen Namensform עֲמַשְׁסַי und gibt שׁ mit „sch“ wieder.
- source_word: בֶּן
  choice: der Sohn … des Sohnes
  rationale: Die wiederholte genealogische Formel wird direkt wiedergegeben; obwohl בן auch einen entfernteren Nachkommen bezeichnen kann, verlangt der Zusammenhang keine Festlegung darauf.
- source_word: עֲזַרְאֵל
  choice: Asarel
  rationale: Deutsche Umschrift des hebräischen Personennamens.
- source_word: אַחְזַי
  choice: Achsai
  rationale: Deutsche Umschrift der in diesem Vers bezeugten hebräischen Namensform.
- source_word: מְשִׁלֵּמוֹת
  choice: Meschillemot
  rationale: Deutsche Umschrift der masoretischen Namensform; die Endung wird ohne ein aus englischer Umschrift übernommenes „th“ wiedergegeben.
- source_word: אִמֵּר
  choice: Immer
  rationale: Direkte Umschrift des Personen- beziehungsweise priesterlichen Familiennamens.
theological_decisions: []
