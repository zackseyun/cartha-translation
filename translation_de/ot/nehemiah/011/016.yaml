base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/016.yaml
  text: And Shabbethai and Jozabad[a], from the heads of the Levites, were over the outside work of the house of God.
translation:
  language: de
  text: Und Schabbetai und Josabad, die zu den Oberhäuptern der Leviten gehörten, hatten die Aufsicht über die äußeren Arbeiten[a] für das Haus Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die außerhalb zu verrichtenden Arbeiten für das Haus Gottes. Der hebräische Ausdruck kann Tätigkeiten außerhalb des eigentlichen Tempelbereichs bezeichnen, im Unterschied zu Aufgaben im Inneren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְּתַי וְיוֹזָבָד
  choice: Und Schabbetai und Josabad
  rationale: Die Personennamen werden nach geläufiger deutscher Bibeltradition transkribiert; das einleitende וְ bewahrt mit „Und“ den Zusammenhang der Aufzählung.
- source_word: עַל
  choice: waren für … zuständig
  rationale: עַל bezeichnet hier administrative Aufsicht beziehungsweise Verantwortung. Die gewählte Formulierung ist im heutigen Deutsch natürlich und vermeidet das unidiomatische „waren über“.
- source_word: הַמְּלָאכָה הַחִיצֹנָה
  choice: die äußeren Arbeiten
  rationale: מְלָאכָה bezeichnet Arbeit oder eine übertragene Aufgabe; חִיצֹנָה kennzeichnet sie als außen beziehungsweise außerhalb liegend. „Äußere Arbeiten“ hält diese räumlich-funktionale Aussage bewusst offen.
- source_word: לְבֵית הָאֱלֹהִים
  choice: am Haus Gottes
  rationale: Die Präposition לְ ordnet die Arbeiten dem Haus Gottes zu. „Am“ gibt den Bezug natürlich wieder, ohne vorschnell festzulegen, ob die Tätigkeiten für den Tempel oder außerhalb des eigentlichen Tempelbereichs ausgeführt wurden.
- source_word: מֵרָאשֵׁי הַלְוִיִּם
  choice: die zu den Oberhäuptern der Leviten gehörten
  rationale: מִן bezeichnet ihre Zugehörigkeit zur Gruppe der führenden Leviten. Die Relativkonstruktion gibt dies in natürlichem Deutsch genauer wieder als das schwerfällige „von den Oberhäuptern“.
