  naturalness: Der Satz ist in modernem Standarddeutsch klar und würdig. „Äußere Arbeiten für das Haus Gottes“ ist zwar leicht wiederholend mit „für … zuständig“, aber idiomatisch und genauer als „am Haus Gottes“; die Umstellung zu „hatten die Aufsicht über“ vermeidet diese Wiederholung.
  terminology: „Haus Gottes“, „Leviten“ und „Oberhäupter“ sind etablierte und passende Bezeichnungen. „Äußere Arbeiten“ wahrt die offene räumlich-funktionale Bedeutung von הַמְּלָאכָה הַחִיצֹנָה. Die Fußnote sollte diese mögliche Bedeutung erläutern, ohne die genaue Lokalisierung als sicher auszugeben.
