  rationale: Die Präpositionalbeziehung zu „Haus Gottes“ wird mit „für das Haus Gottes“ genauer wiedergegeben, ohne die Art oder den genauen Ort der Tätigkeiten einzuengen. „Hatten die Aufsicht über“ ist eine natürliche deutsche Entsprechung der administrativen Funktion. Die Fußnote bleibt vorsichtig und bewahrt die nicht abschließend entscheidbare Bedeutung von „äußerer Arbeit“.
