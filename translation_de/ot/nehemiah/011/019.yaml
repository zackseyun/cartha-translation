  text: וְ/הַ/שּֽׁוֹעֲרִים֙ עַקּ֣וּב טַלְמ֔וֹן וַ/אֲחֵי/הֶ֖ם הַ/שֹּׁמְרִ֣ים בַּ/שְּׁעָרִ֑ים מֵאָ֖ה שִׁבְעִ֥ים וּ/שְׁנָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/019.yaml
  text: 'And the gatekeepers: Akkub[a], Talmon, and their brothers who kept watch at the gates, were one hundred seventy-two.'
translation:
  language: de
  text: 'Und die Torhüter: Akkub, Talmon und ihre Brüder[a], die an den Toren Wache hielten, waren insgesamt 172.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre männlichen Verwandten«; das hebräische Wort für »Brüder« kann auch nahe männliche Verwandte oder andere Männer derselben Gruppe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשּׁוֹעֲרִים
  choice: die Torhüter
  rationale: Bezeichnet die Männer, die für die Bewachung und Betreuung der Tore zuständig waren; »Torhüter« ist im Deutschen die klare und etablierte Bezeichnung für dieses Amt.
- source_word: עַקּוּב
  choice: Akkub
  rationale: Der Personenname wird nach gängiger deutscher Konvention transliteriert.
- source_word: טַלְמוֹן
  choice: Talmon
  rationale: Der Personenname wird nach gängiger deutscher Konvention transliteriert.
- source_word: וַאֲחֵיהֶם
  choice: und ihre Brüder
  rationale: Die Grundbedeutung von אָח ist »Bruder«; in Listen kann das Wort auch männliche Verwandte oder Angehörige derselben Gruppe bezeichnen. Die Hauptübersetzung bewahrt die konkrete hebräische Ausdrucksweise, während die weitere Bedeutung in der Fußnote genannt wird.
- source_word: הַשֹּׁמְרִים
  choice: die … Wache hielten
  rationale: Das Partizip beschreibt ihren fortdauernden Wachdienst; »Wache hielten« ist dafür eine natürliche und präzise deutsche Formulierung.
- source_word: בַּשְּׁעָרִים
  choice: an den Toren
  rationale: Die Präpositionalverbindung bezeichnet den Ort ihres Dienstes; im Deutschen ist »an den Toren« idiomatisch.
- source_word: מֵאָה שִׁבְעִים וּשְׁנָיִם
  choice: insgesamt 172
  rationale: Die Kardinalzahl gibt die Gesamtzahl der genannten Torhüter an; »insgesamt« macht die Funktion der Zahl im deutschen Satz deutlich, ohne zusätzliche Sachinformation einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Listenform des hebräischen Textes bleibt erkennbar; die ergänzte Verbform »waren« und »insgesamt« ergeben einen natürlichen deutschen Satz.
