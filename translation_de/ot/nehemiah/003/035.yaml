base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/035.yaml
  text: And Tobiah the Ammonite was beside him[a], and he said, “Even what they are building—if a fox climbs up on it[b], he will break through their stone wall!”
translation:
  language: de
  text: 'Und Tobija, der Ammoniter, stand neben ihm und sagte: »Was sie da bauen – wenn ein Fuchs[a] darauf hinaufsteigt, reißt er ihre Steinmauer ein[b]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann je nach Zusammenhang auch mit »Schakal« wiedergegeben werden; hier ist »Fuchs« die übliche Wiedergabe.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »durchbricht er ihre Mauer aus Steinen«. Das hebräische Verb kann ein Durchbrechen, Aufbrechen oder Niederreißen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְלוֹ
  choice: stand neben ihm
  rationale: Die Präposition אֵצֶל mit Suffix bezeichnet räumliche Nähe. »Stand neben ihm« ist im Deutschen natürlich und lässt den Bezug auf Sanballat aus dem Zusammenhang bestehen.
- source_word: גַּם אֲשֶׁר הֵם בּוֹנִים
  choice: Was sie da bauen
  rationale: גַּם verstärkt hier den spöttischen Ton. Das deutsche »da« gibt diese Geringschätzung idiomatisch wieder, ohne den Satz mit einem unnatürlichen »sogar« zu belasten.
- source_word: אִם
  choice: wenn
  rationale: Die Partikel leitet eine Bedingung ein. In dieser spöttisch als leicht erfüllbar dargestellten Vorstellung klingt »wenn« im Deutschen natürlicher als »falls«.
- source_word: יַעֲלֶה שׁוּעָל
  choice: ein Fuchs darauf hinaufsteigt
  rationale: שׁוּעָל wird gewöhnlich mit »Fuchs« wiedergegeben, kann jedoch auch einen fuchsartigen Wildhund beziehungsweise Schakal bezeichnen. Das im Hebräischen nur implizite Ziel des Hinaufsteigens wird durch »darauf« verständlich gemacht.
- source_word: וּפָרַץ
  choice: reißt er … ein
  rationale: פרץ bezeichnet das Durchbrechen, Aufbrechen oder Niederreißen. Das maskuline Singularverb wird natürlich auf den unmittelbar zuvor genannten Fuchs bezogen; »einreißen« vermittelt den Spott über die angebliche Schwäche der Mauer.
- source_word: חוֹמַת אַבְנֵיהֶם
  choice: ihre Steinmauer
  rationale: Die Konstruktion bedeutet wörtlich »Mauer ihrer Steine«. »Ihre Steinmauer« ist prägnantes, natürliches Deutsch und bewahrt sowohl den Besitzbezug als auch den Hinweis auf das Baumaterial.
