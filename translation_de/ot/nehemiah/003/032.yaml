  language: en
  yaml_path: translation/ot/nehemiah/003/032.yaml
  text: And between the upper room of the corner and the Sheep Gate[a], the goldsmiths and the merchants made repairs.
translation:
  language: de
  text: Und zwischen dem oberen Raum an der Ecke[a] und dem Schaftor besserten die Goldschmiede und die Händler die Mauer aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Aufgang an der Ecke“ oder „dem Obergeschoss an der Ecke“. Das hebräische Wort עֲלִיָּה kann einen oberen Raum, aber auch einen Aufgang bezeichnen; welches Bauelement hier gemeint ist, bleibt ungewiss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵין
  choice: Und zwischen
  rationale: Gibt sowohl die verbindende Funktion des ו als auch die räumliche Bedeutung von בֵּין natürlich wieder.
- source_word: עֲלִיַּת הַפִּנָּה
  choice: dem Obergemach an der Ecke
  rationale: עֲלִיָּה bezeichnet häufig ein Oberzimmer oder Obergemach; die genaue bauliche Anlage bleibt jedoch unsicher und wird in der Fußnote kenntlich gemacht.
- source_word: לְשַׁעַר הַצֹּאן
  choice: und dem Schaftor
  rationale: Die Präposition לְ markiert hier den zweiten Grenzpunkt der Strecke; »Schaftor« ist die eingebürgerte und klare deutsche Bezeichnung des Tores.
- source_word: הֶחֱזִיקוּ
  choice: besserten ... die Mauer aus
  rationale: Im wiederkehrenden Sprachgebrauch von Nehemia 3 bezeichnet das Verb die Ausbesserung der Mauer. Das ergänzte Objekt macht den deutschen Satz verständlich, ohne den Sinn zu verändern.
- source_word: הַצֹּרְפִים
  choice: die Goldschmiede
  rationale: Das Wort bezeichnet Veredler beziehungsweise Bearbeiter von Edelmetall; im Kontext ist »Goldschmiede« die natürliche Berufsbezeichnung.
- source_word: וְהָרֹכְלִים
  choice: und die Händler
  rationale: רֹכְלִים bezeichnet umherziehende Händler oder Kaufleute; »Händler« ist modern, verständlich und hinreichend breit.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die unsichere Architekturbezeichnung wird im Haupttext lesbar wiedergegeben und in der Fußnote offengehalten. Die Ergänzung »die Mauer« verdeutlicht das im Kapitelzusammenhang vorausgesetzte Objekt des Reparaturverbs.
