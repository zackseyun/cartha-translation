  to: Palal, der Sohn Usais, besserte beim Hof der Wache[c] den Abschnitt gegenüber dem Winkel[a] und dem Turm aus, der vom oberen Haus des Königs[b] vorspringt. Nach ihm besserte Pedaja, der Sohn des Parosch, aus.
