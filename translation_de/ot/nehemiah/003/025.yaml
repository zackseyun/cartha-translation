base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/025.yaml
  text: Palal son of Uzai repaired opposite the angle and the tower projecting from the upper house of the king[a], which is by the court of the guard[c][b]. After him Pedaiah son of Parosh repaired.
translation:
  language: de
  text: Palal, der Sohn Usais, besserte beim Hof der Wache[c] den Abschnitt gegenüber dem Winkel[a] und dem Turm aus, der vom oberen Haus des Königs[b] vorspringt. Nach ihm besserte Pedaja, der Sohn des Parosch, aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Ecke“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vom oberen Haus des Königs“; auch: „vom oberen Palast“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Gefängnishof“. Gemeint ist vermutlich ein bewachter Hof, der auch zur Verwahrung von Gefangenen diente. Der hebräische Relativsatz kann sich entweder auf den Turm oder auf den königlichen Gebäudebereich beziehen.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: gegenüber
  rationale: Die Präposition bezeichnet hier den Mauerabschnitt, der einem markanten Baupunkt gegenüberliegt oder zugewandt ist. „Gegenüber“ gibt den räumlichen Bezug natürlich wieder, ohne die genaue Entfernung festzulegen.
- source_word: הַמִּקְצוֹעַ
  choice: der Winkel
  rationale: Das Substantiv bezeichnet einen Winkel oder eine Ecke eines Bauwerks. „Winkel“ bewahrt den architektonischen Sinn; „Ecke“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: der Turm, der … vorspringt
  rationale: Das Partizip von יצא beschreibt hier einen Turm, der aus dem Gebäudekomplex herausragt. Die verbale Formulierung klingt im Deutschen natürlich und wahrt das räumliche Bild.
- source_word: מִבֵּית הַמֶּלֶךְ הָעֶלְיוֹן
  choice: vom oberen Königshaus
  rationale: „Königshaus“ gibt בית המלך in diesem baulichen Zusammenhang knapp und verständlich wieder, ohne zwingend den gesamten Palast anzunehmen. Die wörtlichere und die stärker deutende Alternative werden in der Fußnote genannt.
- source_word: אֲשֶׁר לַחֲצַר הַמַּטָּרָה
  choice: und beim Wachhof liegt
  rationale: מטרה bezeichnet in diesem Zusammenhang einen bewachten Hof, der auch der Verwahrung von Gefangenen dienen konnte. Die Formulierung ordnet den Turm räumlich dem Wachhof zu; der hebräische Relativanschluss kann sich jedoch auch auf den königlichen Gebäudebereich beziehen.
- source_word: אַחֲרָיו
  choice: Nach ihm
  rationale: Die feste Wendung führt in der Reparaturliste den nächsten Arbeiter beziehungsweise den nächsten Bauabschnitt ein.
- source_word: פָּלָל
  choice: Palal
  rationale: Der Personenname wird nach geläufigen deutschen Transliterationsmustern wiedergegeben.
- source_word: אוּזַי
  choice: Usai
  rationale: Der Personenname wird in einer für deutsche Leser natürlichen Form transliteriert.
- source_word: פְּדָיָה
  choice: Pedaja
  rationale: Der Personenname wird nach geläufigen deutschen Transliterationsmustern wiedergegeben.
- source_word: פַּרְעֹשׁ
  choice: Parosch
  rationale: Der Personenname wird nach geläufigen deutschen Transliterationsmustern wiedergegeben.
- source_word: '[Ellipse des Verbs bei פְּדָיָה בֶן־פַּרְעֹשׁ]'
  choice: besserte … aus
  rationale: Im zweiten Satz fehlt im Hebräischen ein ausdrückliches Verb; aus dem wiederkehrenden Satzmuster des Kapitels ist die Ausbesserungsarbeit zu ergänzen. Das Verb wird für einen vollständigen deutschen Satz eingesetzt.
