  terminology: Die Namen Palal, Usai, Pedaja und Parosch sind im Deutschen angemessen wiedergegeben. „Winkel“ ist als architektonische Wiedergabe von הַמִּקְצוֹעַ möglich; „Ecke“ gehört sinnvoll in die Fußnote. „Haus des Königs“ vermeidet die semantische Überladung von „Königshaus“.
