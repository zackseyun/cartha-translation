  text: אַחֲרָ֣י/ו הֶחֱזִ֗יק בִּנּ֛וּי בֶּן חֵנָדָ֖ד מִדָּ֣ה שֵׁנִ֑ית מִ/בֵּ֣ית עֲזַרְיָ֔ה עַד הַ/מִּקְצ֖וֹעַ וְ/עַד הַ/פִּנָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/024.yaml
  text: After him[a], Binnui son of Henadad repaired another section[b], from the house of Azariah as far as the angle and as far as the corner.
translation:
  language: de
  text: 'Nach ihm setzte Binnui, der Sohn Henadads, ein weiteres Teilstück[a] instand: vom Haus Asarjas bis zum Winkel und bis zur Ecke.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein zweites Teilstück“. Die hebräische Wendung kann einen zusätzlichen, von Binnui instand gesetzten Abschnitt oder einen zweiten abgemessenen Abschnitt bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die hier mit „Winkel“ und „Ecke“ wiedergegebenen hebräischen Wörter sind bedeutungsnah, aber nicht identisch; vermutlich bezeichnen sie zwei benachbarte bauliche Punkte.
    reason: cultural_note
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Nach ihm
  rationale: Die Wendung kennzeichnet in der Bauliste die Abfolge der Arbeiter beziehungsweise Arbeitsabschnitte, ohne zwingend unmittelbare räumliche Nachbarschaft auszudrücken.
- source_word: הֶחֱזִיק
  choice: setzte … instand
  rationale: Das Verb bedeutet grundsätzlich „stärken, fest machen“, bezeichnet in Nehemia 3 jedoch idiomatisch die Ausbesserung beziehungsweise Wiederherstellung der Mauer.
- source_word: בִּנּוּי בֶּן־חֵנָדָד
  choice: Binnui, der Sohn Henadads
  rationale: Die Namen werden in üblicher deutscher Form wiedergegeben; die Abstammungsangabe wird natürlich und eindeutig formuliert.
- source_word: מִדָּה שֵׁנִית
  choice: ein weiteres Teilstück
  rationale: Im Kontext bezeichnet die Wendung einen abgegrenzten Arbeitsabschnitt. „Weiteres“ gibt wahrscheinlich einen zusätzlichen Abschnitt wieder, während die mögliche Bedeutung „zweites“ in der Fußnote erhalten bleibt.
- source_word: מִבֵּית עֲזַרְיָה
  choice: vom Haus Asarjas
  rationale: Die knappe deutsche Form entspricht der hebräischen Ausgangsangabe und ist natürlich verständlich.
- source_word: עַד הַמִּקְצוֹעַ
  choice: bis zum Mauerwinkel
  rationale: Das Substantiv bezeichnet einen Winkel oder eine Biegung an einem Bauwerk. „Mauerwinkel“ macht den architektonischen Zusammenhang deutlich und unterscheidet den Ausdruck vom folgenden Wort.
- source_word: וְעַד הַפִּנָּה
  choice: und bis zur Ecke
  rationale: פִּנָּה bezeichnet eine Ecke beziehungsweise einen Eckpunkt. Die Wiederholung von „bis“ bildet die wiederholte hebräische Präposition ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt knapp wie die hebräische Bauliste; die beiden architektonischen Begriffe werden bewusst unterschieden.
