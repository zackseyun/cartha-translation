base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/012.yaml
  text: Next to him Shallum son of Hallohesh[a], ruler of half the district of Jerusalem, made repairs—he and his daughters.
translation:
  language: de
  text: Neben ihm führte Schallum, der Sohn Halloheschs, Vorsteher der einen Hälfte des Bezirks Jerusalem, Ausbesserungsarbeiten durch – er und seine Töchter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht am Ende: „er und seine Töchter“. Gemeint ist, dass auch seine Töchter an den Ausbesserungsarbeiten beteiligt waren; die genaue Art ihrer Mitwirkung wird nicht angegeben.'
    reason: ambiguity
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Neben ihm
  rationale: Die hebräische Wendung bezeichnet in Nehemia 3 den unmittelbar anschließenden Arbeitsabschnitt und wird im Deutschen natürlich mit „Neben ihm“ wiedergegeben.
- source_word: הֶחֱזִיק
  choice: besserte die Mauer aus
  rationale: Das Hifil von חזק bezeichnet hier im Zusammenhang die Beteiligung an der Wiederherstellung der Stadtmauer; die ausdrückliche Ergänzung „die Mauer“ macht den Bezug im Deutschen klar.
- source_word: שַׁלּוּם
  choice: Schallum
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibeltransliteration wiedergegeben.
- source_word: בֶּן הַלּוֹחֵשׁ
  choice: der Sohn Hallocheschs
  rationale: Das Patronym wird mit Genitiv konstruiert; der Eigenname wird transliteriert.
- source_word: שַׂר חֲצִי פֶּלֶךְ יְרוּשָׁלִָם
  choice: der Vorsteher der einen Hälfte des Bezirks Jerusalem
  rationale: שַׂר bezeichnet hier einen leitenden Amtsträger, פֶּלֶךְ einen Verwaltungsbezirk. „Der einen Hälfte“ macht deutlich, dass Jerusalem administrativ geteilt war.
- source_word: הוּא וּבְנוֹתָיו
  choice: er und seine Töchter
  rationale: Die betonte appositionelle Formulierung wird direkt bewahrt und hält die ausdrückliche Beteiligung seiner Töchter fest.
