  text: אַחֲרָי/ו֙ הֶחֱזִ֣יקוּ אֲחֵי/הֶ֔ם בַּוַּ֖י בֶּן חֵנָדָ֑ד שַׂ֕ר חֲצִ֖י פֶּ֥לֶךְ קְעִילָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/018.yaml
  text: 'After him their brothers repaired: Bavvai son of Henadad[a], ruler of half the district of Keilah.'
translation:
  language: de
  text: 'Nach ihm führten ihre Brüder Ausbesserungsarbeiten durch: Bawai, Sohn Henadads,[a] Vorsteher der Hälfte des Bezirks von Keïla.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Textüberlieferungen lesen den Namen »Binnui« statt »Bawai«.
    reason: textual_variant
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Nach ihm
  rationale: Gibt die räumlich-sequenzielle Fortführung der Bauliste unmittelbar und natürlich wieder.
- source_word: הֶחֱזִיקוּ
  choice: besserten die Mauer aus
  rationale: Das Verb bedeutet grundsätzlich »stärken«; in Nehemia 3 bezeichnet es idiomatisch die Ausbesserung der Mauer. Das ergänzte Objekt macht den deutschen Satz verständlich.
- source_word: אֲחֵיהֶם
  choice: ihre Brüder
  rationale: Bewahrt die wörtliche Bezeichnung des Hebräischen, auch wenn hier vermutlich Angehörige oder Arbeitskollegen gemeint sind.
- source_word: בַּוַּי
  choice: Bawai
  rationale: Folgt der vokalisierten Form des WLC; die abweichende Namensform Binnui wird in einer Fußnote dokumentiert.
- source_word: בֶּן חֵנָדָד
  choice: der Sohn Henadads
  rationale: Natürliche deutsche Wiedergabe der hebräischen Vaterangabe.
- source_word: שַׂר
  choice: Vorsteher
  rationale: Passt zum zivilen Verwaltungsamt und vermeidet einen unnötig militärischen Klang.
- source_word: חֲצִי פֶּלֶךְ
  choice: der Hälfte des Bezirks
  rationale: Bezeichnet eine Hälfte eines Verwaltungsbezirks; »Bezirk« ist im heutigen Deutsch klar und größenmäßig angemessen.
- source_word: קְעִילָה
  choice: Keïla
  rationale: Transliteriert den Ortsnamen und kennzeichnet durch das Trema, dass e und i getrennt gesprochen werden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht deutlich, dass Bawai zu den zuvor genannten »Brüdern« gehört. »Die Mauer« wurde zur natürlichen Verständlichkeit aus dem Baukontext ergänzt.
