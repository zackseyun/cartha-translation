  text: וְ/עַל יָדָ֨/ם הֶחֱזִ֜יק מְלַטְיָ֣ה הַ/גִּבְעֹנִ֗י וְ/יָדוֹן֙ הַ/מֵּרֹ֣נֹתִ֔י אַנְשֵׁ֥י גִבְע֖וֹן וְ/הַ/מִּצְפָּ֑ה לְ/כִסֵּ֕א פַּחַ֖ת עֵ֥בֶר הַ/נָּהָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/007.yaml
  text: And next to them Melatiah the Gibeonite and Jadon the Meronothite made repairs[a], along with the men of Gibeon and Mizpah, for the seat of the governor of the province Beyond the River.
translation:
  language: de
  text: Neben ihnen führten Melatja aus Gibeon und Jadon aus Meronot zusammen mit den Männern aus Gibeon und Mizpa Ausbesserungsarbeiten durch, bis zum Amtssitz des Statthalters der Provinz Jenseits des Stromes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bis zum Sitz des Statthalters von Jenseits des Stromes“. Das hebräische Wort kann „Sitz“ oder „Thron“ bedeuten; gemeint ist wahrscheinlich der Amtssitz oder die Residenz des Statthalters.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Neben ihnen
  rationale: Die Wendung bezeichnet in der Bauliste von Nehemia 3 räumliche Nachbarschaft; „neben ihnen“ gibt den idiomatischen Sinn knapp und natürlich wieder.
- source_word: הֶחֱזִיק
  choice: arbeiteten … an der Ausbesserung
  rationale: Das Verb bezeichnet hier die Beteiligung an den Wiederherstellungsarbeiten. Die Formulierung passt zum Baukontext, ohne die Tätigkeit unnötig einzuengen.
- source_word: מְלַטְיָה הַגִּבְעֹנִי
  choice: Melatja aus Gibeon
  rationale: Der Personenname wird transliteriert; das Gentilizium wird im modernen Deutschen als Herkunftsangabe natürlich wiedergegeben.
- source_word: וְיָדוֹן הַמֵּרֹנֹתִי
  choice: und Jadon aus Meronot
  rationale: Der Personenname wird transliteriert; die Herkunftsbezeichnung wird parallel zu „aus Gibeon“ formuliert.
- source_word: אַנְשֵׁי גִבְעוֹן וְהַמִּצְפָּה
  choice: zusammen mit den Männern aus Gibeon und Mizpa
  rationale: אַנְשֵׁי mit Ortsnamen bezeichnet die Männer beziehungsweise Bewohner dieser Orte. „Zusammen mit“ verdeutlicht ihre Beteiligung an den genannten Arbeiten.
- source_word: לְכִסֵּא
  choice: für den Amtssitz
  rationale: כִּסֵּא bedeutet wörtlich „Sitz“ oder „Thron“. Im persischen Verwaltungskontext liegt ein offizieller Sitz beziehungsweise eine Residenz nahe; לְ wird zurückhaltend mit „für“ wiedergegeben, da eine räumliche Bedeutung „bis zum“ nicht eindeutig ist.
- source_word: פַּחַת
  choice: des Statthalters
  rationale: Der Ausdruck bezeichnet einen persischen Verwaltungsbeamten; „Statthalter“ ist eine verständliche und historisch passende deutsche Entsprechung.
- source_word: עֵבֶר הַנָּהָר
  choice: der Provinz jenseits des Stromes
  rationale: Die Wendung ist eine persische Gebietsbezeichnung für das Land westlich des Euphrat. „Provinz“ macht den Verwaltungskontext deutlich; „Strom“ bewahrt die traditionelle Benennung, ohne den im Hebräischen ungenannten Euphrat in den Haupttext einzusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Herkunftsbezeichnungen werden zugunsten unmittelbarer Verständlichkeit mit „aus“ statt durch seltene Gentilformen wiedergegeben. Die Verwaltungsformulierung bleibt bewusst offen; die Fußnote dokumentiert die Mehrdeutigkeit von כִּסֵּא und der Präposition לְ.
