base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/028.yaml
  text: Above the Horse Gate[a], the priests made repairs, each one opposite his own house.
translation:
  language: de
  text: Oberhalb des Pferdetors[a] besserten die Priester die Mauer aus, jeder gegenüber seinem eigenen Haus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Tor der Pferde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַל
  choice: Oberhalb
  rationale: Die Präposition bezeichnet hier die Lage des nächsten Mauerabschnitts relativ zum zuvor genannten Abschnitt; „oberhalb“ ist in der Bauliste natürlich und präzise.
- source_word: שַׁעַר הַסּוּסִים
  choice: des Pferdetors
  rationale: Die hebräische Status-constructus-Verbindung wird idiomatisch als Bezeichnung eines Tores wiedergegeben. Die alternative Auflösung „Tor der Pferde“ bleibt in der Fußnote erhalten.
- source_word: הֶחֱזִיקוּ
  choice: besserten … aus
  rationale: Das Verb bezeichnet in Nehemia 3 regelmäßig die Ausführung von Reparaturarbeiten. Das ergänzte Objekt „die Mauer“ ergibt sich aus dem unmittelbaren Baukontext und sorgt im Deutschen für einen natürlichen Satz.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Direkte Wiedergabe des bestimmten Substantivs.
- source_word: אִישׁ
  choice: jeder
  rationale: Das maskuline Singularwort hat hier distributive Bedeutung und bezieht sich auf die einzelnen Priester.
- source_word: לְנֶגֶד
  choice: gegenüber
  rationale: Die Präposition bezeichnet einen Abschnitt, der vor beziehungsweise gegenüber dem jeweiligen Haus liegt.
- source_word: בֵּיתוֹ
  choice: seinem eigenen Haus
  rationale: Das Suffix der 3. Person Singular folgt der distributiven Konstruktion mit אִישׁ; „eigenen“ verdeutlicht im Deutschen den Bezug auf das Haus des jeweiligen Priesters.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Die Mauer“ ist als kontextuell erschlossenes Objekt ergänzt, weil das hebräische Verb hier ohne ausdrückliches Objekt steht und sich auf die fortlaufenden Mauerreparaturen bezieht.
