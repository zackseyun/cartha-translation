  text: אַחֲרָ֛י/ו הֶחֱזִ֥יקוּ הַ/לְוִיִּ֖ם רְח֣וּם בֶּן בָּנִ֑י עַל יָד֣/וֹ הֶחֱזִ֗יק חֲשַׁבְיָ֛ה שַׂר חֲצִי פֶ֥לֶךְ קְעִילָ֖ה לְ/פִלְכּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/017.yaml
  text: 'After him the Levites carried out repairs: Rehum son of Bani[a]. Next to him Hashabiah, ruler of half the district of Keilah[c][b], carried out repairs for his district.'
translation:
  language: de
  text: 'Nach ihm führten die Leviten Ausbesserungsarbeiten durch: Rehum, der Sohn Banis. Neben ihm führte Haschabja, der Vorsteher der einen Hälfte des Bezirks von Keïla, für seinen Bezirk Ausbesserungsarbeiten durch.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für seinen Abschnitt“. Das Hebräische kann sich auf Haschabjas Verwaltungsbezirk oder auf den ihm zugeteilten Mauerabschnitt beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Nach ihm
  rationale: Die Wendung kennzeichnet in der Bauliste die räumliche beziehungsweise fortlaufende Reihenfolge der Arbeiter und bleibt im Deutschen natürlich.
- source_word: הֶחֱזִיקוּ / הֶחֱזִיק
  choice: nahmen die Ausbesserungsarbeiten vor / besserte … aus
  rationale: Der Hifil von חזק bezeichnet in Nehemia 3 idiomatisch das Ausbessern beziehungsweise Instandsetzen der Mauer; die deutsche Formulierung macht die Bautätigkeit klar und vermeidet das missverständliche wörtliche „stärken“.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die übliche und präzise Bezeichnung dieser religiös-gesellschaftlichen Gruppe wird beibehalten.
- source_word: רְחוּם בֶּן־בָּנִי
  choice: Rehum, der Sohn Banis
  rationale: Die Eigennamen werden nach gängiger deutscher Bibeltradition wiedergegeben; die Abstammungsangabe bleibt ausdrücklich erhalten.
- source_word: עַל יָדוֹ
  choice: Neben ihm
  rationale: Wörtlich „an seiner Hand“; im Zusammenhang der Mauerabschnitte bezeichnet die Wendung den angrenzenden Arbeitsort.
- source_word: חֲשַׁבְיָה
  choice: Haschabja
  rationale: Deutsche Transliteration des hebräischen Personennamens.
- source_word: שַׂר חֲצִי פֶלֶךְ קְעִילָה
  choice: der Vorsteher der einen Hälfte des Bezirks von Keïla
  rationale: שַׂר bezeichnet hier einen leitenden Amtsträger, פֶלֶךְ einen Verwaltungsbezirk. „Der einen Hälfte“ verdeutlicht idiomatisch, dass Keïla administrativ geteilt war.
- source_word: לְפִלְכּוֹ
  choice: für seinen Bezirk
  rationale: Das Präfix ל kann Zuständigkeit oder Zuordnung ausdrücken. Die Wiedergabe bewahrt den Verwaltungsbezug, ohne festzulegen, ob der Bezirk oder der ihm zugewiesene Bauabschnitt gemeint ist.
