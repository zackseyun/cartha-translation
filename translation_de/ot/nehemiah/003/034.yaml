base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/034.yaml
  text: And he said before his brothers and the army of Samaria[a], and said, “What are these feeble Jews doing? Will they restore it for themselves? Will they sacrifice? Will they finish in a day? Will they revive the stones from the heaps of dust, though they are burned?”
translation:
  language: de
  text: 'Und er sagte vor seinen Brüdern und dem Heer von Samaria: „Was machen diese elenden Juden da? Werden sie es für sich wiederherstellen?[a] Werden sie Opfer darbringen? Werden sie an einem Tag fertig? Werden sie die Steine aus den Haufen von Staub wieder zum Leben erwecken, obwohl sie verbrannt sind?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist schwer zu deuten. Möglich sind auch: „Werden sie es allein wieder aufbauen?“ oder, wörtlicher, „Werden sie es sich selbst überlassen?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי אֶחָיו
  choice: vor seinen Brüdern
  rationale: לִפְנֵי bezeichnet das Reden in ihrer Gegenwart; אֶחָיו heißt wörtlich „seine Brüder“ und kann hier zugleich politische oder militärische Gefährten meinen.
- source_word: וְחֵיל שֹׁמְרוֹן
  choice: und dem Heer von Samaria
  rationale: חֵיל bezeichnet hier im öffentlichen, militärischen Zusammenhang eine Streitmacht; „Heer“ ist würdig und im Deutschen geläufig.
- source_word: הָאֲמֵלָלִים
  choice: elenden
  rationale: Das Adjektiv ist eine abwertende Bezeichnung für Schwache oder Erbärmliche. „Elend“ erhält den höhnischen Ton, ohne eine bloß körperliche Schwäche festzulegen.
- source_word: הֲיַעַזְבוּ לָהֶם
  choice: Werden sie es für sich wiederherstellen?
  rationale: Die Wendung ist schwierig, da עזב gewöhnlich „verlassen/überlassen“ bedeutet. Im Kontext des Mauerbaus ist „wiederherstellen“ plausibel; „für sich“ bewahrt לָהֶם und lässt die Frage nach eigener Leistung bzw. eigenem Nutzen anklingen.
- source_word: הֲיִזְבָּחוּ
  choice: Werden sie Opfer darbringen?
  rationale: זבח bezeichnet das Schlachten bzw. Darbringen von Opfern. Die deutsche Wendung macht den kultischen Sinn klar.
- source_word: הַיְכַלּוּ בַיּוֹם
  choice: Werden sie an einem Tag fertig?
  rationale: כלה im Piel bedeutet „vollenden, fertigstellen“; die knappe Frage erhält die rasche Folge des Spotts.
- source_word: הַיְחַיּוּ אֶת הָאֲבָנִים
  choice: Werden sie die Steine … wieder zum Leben erwecken
  rationale: חיה bedeutet im Kausativ „lebendig machen, wiederbeleben“. Die bildhafte Personifikation der beschädigten Steine bleibt erhalten.
- source_word: מֵעֲרֵמוֹת הֶעָפָר
  choice: aus den Schutthaufen
  rationale: עֲרֵמוֹת sind Haufen, עָפָר ist Staub bzw. lockere Erde. Im Zusammenhang zerstörten Mauerwerks gibt „Schutthaufen“ das konkrete Bild natürlich wieder.
- source_word: וְהֵמָּה שְׂרוּפוֹת
  choice: obwohl sie verbrannt sind
  rationale: Der Nachsatz betont höhnisch den Feuerschaden der Steine; „obwohl“ macht den im Kontext liegenden Gegensatz verständlich.
theological_decisions: []
