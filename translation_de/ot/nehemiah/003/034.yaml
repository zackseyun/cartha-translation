  register: Modernes, würdevolles Standarddeutsch. Die rasche Folge rhetorischer Fragen und der spöttische Ton werden bewahrt; die schwierige Wendung הֲיַעַזְבוּ לָהֶם wird im Text kontextbezogen wiedergegeben und in der Fußnote offengelegt.
