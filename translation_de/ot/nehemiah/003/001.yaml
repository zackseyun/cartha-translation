  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֡קָם אֶלְיָשִׁיב֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וַ/יִּבְנוּ֙ אֶת שַׁ֣עַר הַ/צֹּ֔אן הֵ֣מָּה קִדְּשׁ֔וּ/הוּ וַֽ/יַּעֲמִ֖ידוּ דַּלְתֹתָ֑י/ו וְ/עַד מִגְדַּ֤ל הַ/מֵּאָה֙ קִדְּשׁ֔וּ/הוּ עַ֖ד מִגְדַּ֥ל חֲנַנְאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/001.yaml
  text: Then Eliashib the high priest rose up with his brothers the priests[a], and they built the Sheep Gate. They consecrated it and set up its doors; they consecrated it as far as the Tower of the Hundred, as far as the Tower of Hananel.
translation:
  language: de
  text: Da machte sich der Hohepriester Eljaschib zusammen mit seinen Brüdern, den Priestern, ans Werk. Sie bauten das Schaftor. Sie selbst weihten es[a] und setzten seine Torflügel ein; sie weihten es bis zum Turm der Hundert, bis zum Turm Hananel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: widmeten es. Das hebräische Verb kann bedeuten, etwas als heilig auszusondern oder es einem besonderen Zweck zu widmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: machte sich … ans Werk
  rationale: קום leitet hier den Beginn des Handelns ein. Die deutsche Wendung gibt die erzählerische Funktion natürlich wieder, ohne das bloße körperliche Aufstehen in den Vordergrund zu rücken.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: der Hohe Priester
  rationale: Dies ist die übliche und sachlich genaue deutsche Wiedergabe des hebräischen Amtstitels.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: zusammen mit seinen Brüdern, den Priestern
  rationale: Die Übersetzung bewahrt sowohl die familiäre Bezeichnung »Brüder« als auch die nähere Bestimmung, dass sie Priester waren.
- source_word: שַׁעַר הַצֹּאן
  choice: das Schaftor
  rationale: Als Name eines Jerusalemer Stadttores ist »Schaftor« die klare und im Deutschen etablierte Form.
- source_word: הֵמָּה
  choice: Sie selbst
  rationale: Das selbstständige Personalpronomen trägt Nachdruck und hebt hervor, dass die genannten Priester die Weihe eigenhändig beziehungsweise persönlich vollzogen.
- source_word: קִדְּשׁוּהוּ
  choice: weihten es
  rationale: קדשׁ bezeichnet hier das Aussondern für einen heiligen oder besonderen Zweck. »Weihen« bewahrt diesen religiösen Sinn und bleibt im heutigen Deutsch verständlich.
- source_word: וַיַּעֲמִידוּ דַלְתֹתָיו
  choice: setzten seine Torflügel ein
  rationale: Die Wendung bezeichnet das Anbringen der Türen am Tor. »Torflügel« macht den baulichen Bezug deutlich, ohne die konkrete Montagetechnik unnötig festzulegen.
- source_word: מִגְדַּל הַמֵּאָה
  choice: der Turm der Hundert
  rationale: Die transparente Wiedergabe folgt der hebräischen Genitivverbindung und bewahrt den überlieferten Ortsnamen.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: der Turm Hananel
  rationale: Der Gattungsbegriff wird übersetzt und der Eigenname Hananel transliteriert.
- source_word: וְעַד … עַד
  choice: bis … bis
  rationale: Die Wiederholung gibt die im Hebräischen zweimal gesetzte Grenze beziehungsweise Ausdehnung knapp und natürlich wieder.
theological_decisions:
- issue: Kultisch-religiöser Sinn von קדשׁ beim Tor
  choice: weihten es
  alternative: widmeten es
  rationale: Die handelnden Priester setzen das Tor nicht nur für einen allgemeinen Zweck ein; das Verb kann eine Heiligung beziehungsweise Aussonderung bezeichnen. »Weihen« erhält diesen möglichen sakralen Gehalt, während die Fußnote die weniger ausgeprägt kultische Lesart offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Sätze gliedern die lange hebräische Erzählkette. Orts- und Amtsbezeichnungen sind in geläufiger deutscher Form wiedergegeben; die Wiederholung von »weihten es« und »bis« bleibt als Merkmal des Ausgangstextes erhalten.
