  yaml_path: translation/ot/nehemiah/003/002.yaml
  text: And next to him the men of Jericho built[a], and next to them Zaccur the son of Imri built.
translation:
  language: de
  text: Neben ihm bauten die Männer von Jericho[a], und neben ihm baute Sakkur, der Sohn Imris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht sowohl hier als auch im zweiten Satzteil »neben ihm«. Gemeint ist jeweils die räumliche Abfolge der Bauenden.
    reason: Der zweimalige maskuline Singular kann im Deutschen hinsichtlich seines jeweiligen Bezugs mehrdeutig wirken; die Anmerkung bewahrt die hebräische Form und erläutert die Funktion der Wendung.
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: neben ihm
  rationale: Die Wendung עַל יַד mit Pronominalsuffix bezeichnet in diesem Kapitel die räumliche Nachbarschaft innerhalb der Abfolge der Bauabschnitte. »Neben ihm« ist natürliches Deutsch und bewahrt den Singular des hebräischen Textes.
- source_word: בָנוּ / בָנָה
  choice: bauten / baute
  rationale: בנה bedeutet schlicht »bauen«. Obwohl der Zusammenhang den Wiederaufbau der Jerusalemer Mauer betrifft, nennt dieser Vers weder ausdrücklich ein Objekt noch verwendet er ein Verb mit eigener Wiederherstellungsbedeutung.
- source_word: אַנְשֵׁי יְרֵחוֹ
  choice: die Männer aus Jericho
  rationale: אַנְשֵׁי bezeichnet wörtlich Männer; die Verbindung mit Jericho kennzeichnet ihre Herkunft beziehungsweise Zugehörigkeit. »Aus Jericho« klingt im Deutschen bei einer Arbeitsgruppe natürlicher als »von Jericho«.
- source_word: זַכּוּר בֶּן אִמְרִי
  choice: Sakkur, der Sohn Imris
  rationale: Die Namen werden in geläufiger deutscher Bibelschreibweise wiedergegeben. Die Formulierung bewahrt die hebräische Abstammungsangabe und bleibt zugleich gut lesbar.
