base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/008.yaml
  text: Next to him Uzziel son of Harhaiah[a], one of the goldsmiths, made repairs; and next to him Hananiah, one of the perfumers, made repairs. And they restored Jerusalem as far as the Broad Wall.
translation:
  language: de
  text: Neben ihm führte Usiël, der Sohn Harhajas, einer der Goldschmiede, Ausbesserungsarbeiten durch; neben ihm führte Hananja, der Sohn der Salbenmischer, Ausbesserungsarbeiten durch. Sie stellten Jerusalem bis zur Breiten Mauer wieder her.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie ließen Jerusalem bis zur Breiten Mauer zurück.“ Das hebräische Verb bedeutet gewöhnlich „verlassen“ oder „zurücklassen“, wird in diesem Wiederaufbaukontext jedoch oft als „wiederherstellen“ oder „ausbessern“ verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָדוֹ
  choice: Neben ihm
  rationale: Die Wendung bezeichnet in Nehemia 3 jeweils den unmittelbar anschließenden Arbeitsabschnitt. „Neben ihm“ gibt diesen räumlichen Zusammenhang im Deutschen natürlich wieder.
- source_word: הֶחֱזִיק
  choice: führte … die Ausbesserungsarbeiten aus / arbeitete
  rationale: Das Verb bedeutet grundsätzlich „stärken, festigen“, bezeichnet hier aber idiomatisch die Beteiligung an den Reparaturarbeiten. Die wechselnde deutsche Formulierung vermeidet Schwerfälligkeit, ohne den Sinn zu verändern.
- source_word: צֹרְפִים
  choice: einer der Goldschmiede
  rationale: Der Plural bezeichnet wahrscheinlich eine Berufsgruppe oder Zunft. „Goldschmiede“ ist im Kontext eine klare, traditionelle und sachlich passende Wiedergabe, auch wenn das Wort allgemeiner Metallverarbeiter oder Läuterer bezeichnen kann.
- source_word: הָרַקָּחִים
  choice: einer der Salbenmischer
  rationale: Das Wort bezeichnet Hersteller von Duftstoffen, Salben oder Gewürzmischungen. „Salbenmischer“ ist verständlich und bewahrt den handwerklichen Charakter besser als das heute missverständliche „Apotheker“.
- source_word: וַיַּעַזְבוּ
  choice: sie stellten … wieder her
  rationale: Die gewöhnliche Bedeutung des Verbs ist „verlassen, zurücklassen“. Im Zusammenhang der Wiederaufbauarbeiten wird die Form jedoch vielfach im Sinn von „wiederherstellen“ verstanden. Diese kontextuelle Deutung steht im Haupttext; die wörtlich naheliegende Alternative bleibt in der Fußnote sichtbar.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Der hebräische Text nennt die Stadt selbst, wahrscheinlich als metonymische Bezeichnung ihrer Befestigungen. Die Übersetzung ergänzt daher nicht ausdrücklich „die Mauer Jerusalems“.
- source_word: עַד הַחוֹמָה הָרְחָבָה
  choice: bis zur Breiten Mauer
  rationale: Die Wortgruppe bezeichnet offenbar einen bekannten Abschnitt der Jerusalemer Befestigung. Die Großschreibung kennzeichnet „Breite Mauer“ als Eigennamen beziehungsweise feste Ortsbezeichnung.
