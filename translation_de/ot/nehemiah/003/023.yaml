  text: אַחֲרָ֨י/ו הֶחֱזִ֧יק בִּנְיָמִ֛ן וְ/חַשּׁ֖וּב נֶ֣גֶד בֵּיתָ֑/ם אַחֲרָ֣י/ו הֶחֱזִ֗יק עֲזַרְיָ֧ה בֶן מַעֲשֵׂיָ֛ה בֶּן עֲנָֽנְיָ֖ה אֵ֥צֶל בֵּיתֽ/וֹס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/023.yaml
  text: After him Benjamin and Hasshub made repairs opposite their house. After him Azariah son of Maaseiah[a], son of Ananiah, made repairs beside his house.
translation:
  language: de
  text: Nach ihm besserten Benjamin und Haschub gegenüber ihrem Haus die Mauer aus. Nach ihm besserte Asarja, der Sohn Maasejas, des Sohnes Hananjas, neben seinem Haus die Mauer aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Nach ihm
  rationale: Die wiederkehrende Wendung kennzeichnet in Nehemia 3 die räumliche Abfolge der Bauabschnitte entlang der Mauer; die knappe deutsche Form bewahrt diese Listenstruktur.
- source_word: הֶחֱזִיק
  choice: besserte … die Mauer aus
  rationale: Der Hifil von חזק bezeichnet in diesem Kapitel idiomatisch die Beteiligung an den Ausbesserungsarbeiten. Die Ergänzung »die Mauer« ist aus dem Kontext eindeutig und ergibt im Deutschen eine natürliche, präzise Formulierung.
- source_word: בִּנְיָמִן וְחַשּׁוּב
  choice: Benjamin und Haschub
  rationale: Die Personennamen werden nach geläufiger deutscher Bibeltradition transliteriert.
- source_word: נֶגֶד בֵּיתָם
  choice: gegenüber ihrem Haus
  rationale: נֶגֶד bezeichnet die Lage vor beziehungsweise gegenüber dem Haus. Der Singular »Haus« und der Pluralsuffix »ihrem« werden bewahrt.
- source_word: עֲזַרְיָה בֶן מַעֲשֵׂיָה בֶן עֲנָנְיָה
  choice: Asarja, der Sohn Maasejas, des Sohnes Hananjas
  rationale: Die patronymische Folge bleibt vollständig erhalten; die deutschen Namensformen folgen der geläufigen Bibeltradition.
- source_word: אֵצֶל בֵּיתוֹ
  choice: neben seinem Haus
  rationale: אֵצֶל drückt räumliche Nähe aus; »neben« unterscheidet diese Angabe klar von der Abfolgeformel »nach ihm«.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »Nach ihm« und »die Mauer ausbessern« bewahrt den listenartigen Rhythmus des hebräischen Textes. Keine Fußnote ist nötig; die englische Fußnote zu »Hashub« beruht lediglich auf Varianten englischer Transliteration und ist für die gewählte deutsche Namensform »Haschub« nicht relevant.
