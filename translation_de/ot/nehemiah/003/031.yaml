source:
  edition: WLC
  text: אחרי הֶחֱזִ֗יק מַלְכִּיָּה֙ בֶּן הַ/צֹּ֣רְפִ֔י עַד בֵּ֥ית הַ/נְּתִינִ֖ים וְ/הָ/רֹכְלִ֑ים נֶ֚גֶד שַׁ֣עַר הַ/מִּפְקָ֔ד וְ/עַ֖ד עֲלִיַּ֥ת הַ/פִּנָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/031.yaml
  text: After him Malkijah son of the goldsmith repaired as far as the house of the temple servants and the merchants, opposite the Inspection Gate, and as far as the upper room of the corner.
translation:
  language: de
  text: Nach ihm besserte Malkija, der Sohn des Goldschmieds, die Mauer aus bis zum Haus der Tempeldiener und der Händler, gegenüber dem Mustertor, und bis zum Obergemach an der Ecke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצֹּרְפִי
  choice: des Goldschmieds
  rationale: Das Wort bezeichnet einen Metallhandwerker, besonders einen Gold- oder Silberschmied. Im Zusammenhang mit der Berufsgruppe in Vers 32 ist „Goldschmied“ eine natürliche und präzise Wiedergabe.
- source_word: הַנְּתִינִים
  choice: der Tempeldiener
  rationale: Die Netinim waren eine dem Tempeldienst zugeordnete Gruppe. „Tempeldiener“ gibt ihre Funktion verständlich wieder, ohne die hebräische Bezeichnung unübersetzt zu lassen.
- source_word: הָרֹכְלִים
  choice: der Händler
  rationale: Das Partizip bezeichnet umherziehende Händler beziehungsweise Kaufleute; „Händler“ ist im Deutschen knapp und kontextgerecht.
- source_word: שַׁעַר הַמִּפְקָד
  choice: Mustertor
  rationale: מִפְקָד kann Musterung, Zählung oder Aufsicht bezeichnen. „Mustertor“ bewahrt den wahrscheinlichen Bezug zu einer Musterung, ohne die genaue Funktion des Tores stärker festzulegen, als der hebräische Ausdruck erlaubt.
- source_word: עֲלִיַּת הַפִּנָּה
  choice: Obergemach an der Ecke
  rationale: 'עֲלִיָּה bezeichnet einen erhöhten Raum oder ein Obergemach. Die Verbindung mit הַפִּנָּה wird im Deutschen natürlich lokal wiedergegeben: „an der Ecke“.'
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Besserte … die Mauer aus“ ergänzt das im Hebräischen kontextuell vorausgesetzte Objekt und macht den Bauzusammenhang klar. Eigennamen folgen einer geläufigen deutschen Transkription.
