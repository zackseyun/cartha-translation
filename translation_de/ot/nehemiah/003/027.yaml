  text: אַחֲרָ֛י/ו הֶחֱזִ֥יקוּ הַ/תְּקֹעִ֖ים מִדָּ֣ה שֵׁנִ֑ית מִ/נֶּ֜גֶד הַ/מִּגְדָּ֤ל הַ/גָּדוֹל֙ הַ/יּוֹצֵ֔א וְ/עַ֖ד חוֹמַ֥ת הָ/עֹֽפֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/027.yaml
  text: After him the Tekoites repaired another section[a], opposite the great projecting tower, as far as the wall of Ophel.
translation:
  language: de
  text: Nach ihm besserten die Leute aus Tekoa einen weiteren Abschnitt[a] aus, gegenüber dem großen vorspringenden Turm und bis zur Mauer des Ofel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen zweiten Abschnitt“. Die hebräische Wendung kann hervorheben, dass die Leute aus Tekoa zusätzlich zu ihrem früheren Arbeitsabschnitt noch einen weiteren übernahmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Nach ihm
  rationale: Die Wendung kennzeichnet in der Bauliste von Nehemia 3 die Abfolge der Arbeitsabschnitte; das maskuline Suffix verweist auf den zuvor genannten Arbeiter.
- source_word: הֶחֱזִיקוּ
  choice: besserten … aus
  rationale: Das Verb bedeutet wörtlich „stärken“, wird hier aber als Fachausdruck für die Ausbesserung beziehungsweise Wiederherstellung der Mauer gebraucht.
- source_word: הַתְּקֹעִים
  choice: die Leute aus Tekoa
  rationale: Das Gentiliz bezeichnet die Einwohner von Tekoa; diese Form ist im modernen Deutsch klarer und natürlicher als „die Tekoiter“.
- source_word: מִדָּה שֵׁנִית
  choice: einen weiteren Abschnitt
  rationale: Die Wendung bezeichnet einen zusätzlichen, zweiten Arbeitsabschnitt derselben Gruppe. Die Alternative wird in der Fußnote bewahrt.
- source_word: מִנֶּגֶד
  choice: gegenüber
  rationale: Die Präposition beschreibt die Lage vor beziehungsweise gegenüber einem markanten Bauwerk.
- source_word: הַמִּגְדָּל הַגָּדוֹל הַיּוֹצֵא
  choice: dem großen vorspringenden Turm
  rationale: Das Partizip von יצא bedeutet wörtlich „hinausgehend“ und beschreibt hier architektonisch einen aus der Mauerlinie vorspringenden Turm.
- source_word: וְעַד
  choice: bis zu
  rationale: Die Wendung bezeichnet den Endpunkt des ausgebesserten Abschnitts. Im Deutschen ist die Koordination nach der vorausgehenden Ortsangabe ohne wiedergegebenes „und“ natürlich.
- source_word: חוֹמַת הָעֹפֶל
  choice: zur Mauer des Ofel
  rationale: Die hebräische Genitivverbindung wird direkt wiedergegeben; Ofel bleibt als Jerusalemer Ortsname unübersetzt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Die Leute aus Tekoa“ vermeidet ein heute wenig geläufiges Gentiliz; „vorspringend“ gibt die architektonische Bedeutung präzise wieder.
