base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/003.yaml
  text: The sons of Hassenaah built the Fish Gate[a]; they roofed it and set up its doors, its bolts[b], and its bars.
translation:
  language: de
  text: Das Fischtor bauten die Söhne Senaas[a]. Sie deckten es mit Balken und setzten seine Torflügel, seine Verschlüsse und seine Riegel ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den »Söhnen Senaas« können auch die Nachkommen oder Angehörigen dieser Familie beziehungsweise Sippe gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הַדָּגִים
  choice: das Fischtor
  rationale: Die Status-constructus-Verbindung bezeichnet ein bestimmtes, nach dem Fisch benanntes Stadttor; »Fischtor« ist die natürliche deutsche Namensform.
- source_word: בָּנוּ
  choice: bauten
  rationale: בנה bedeutet grundsätzlich »bauen«. Obwohl der Zusammenhang Wiederherstellungsarbeiten beschreibt, steht hier nicht das spezifischere Verb für Ausbessern.
- source_word: בְּנֵי הַסְּנָאָה
  choice: die Söhne Senaas[a]
  rationale: בני kann leibliche Söhne oder die Angehörigen einer Familie beziehungsweise Sippe bezeichnen. Die formnahe Wiedergabe bewahrt diese Offenheit; der hebräische Artikel gehört grammatisch zur Namensfügung und wird nicht als Namensbestandteil transliteriert.
- source_word: הֵמָּה
  choice: Sie
  rationale: Das selbstständige Pronomen nimmt die zuvor genannte Gruppe ausdrücklich wieder auf. Ein zusätzliches »selbst« würde im Deutschen einen stärkeren Kontrast nahelegen, als der Zusammenhang verlangt.
- source_word: קֵרוּהוּ
  choice: deckten es mit Balken
  rationale: קרה bezeichnet im Bauzusammenhang das Überdecken beziehungsweise Einziehen einer Balkendecke. Diese Wiedergabe ist konkreter als »bedeckten« und lässt offen, ob damit ein vollständiges Dach gemeint ist.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: setzten seine Torflügel ein
  rationale: Wörtlich ließen sie die Türen stehen; im Zusammenhang ist die Montage gemeint. »Torflügel« ist bei einem Stadttor präziser als »Türen«.
- source_word: מַנְעוּלָיו
  choice: seine Verschlüsse
  rationale: Das seltene Wort bezeichnet die Vorrichtungen zum Verschließen. »Verschlüsse« bewahrt die Abgrenzung zu den anschließend genannten Riegeln, ohne die konkrete Bauart zu stark festzulegen.
- source_word: וּבְרִיחָיו
  choice: und seine Riegel
  rationale: בריח bezeichnet einen Quer- oder Sperrriegel, mit dem Torflügel gesichert werden; »Riegel« ist die direkte und idiomatische deutsche Entsprechung.
