base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/038.yaml
  text: So we rebuilt the wall[a], and the whole wall was joined together up to half its height, for the people had a heart to work.
translation:
  language: de
  text: So bauten wir die Mauer wieder auf, und die ganze Mauer wurde bis zur Hälfte ihrer Höhe zusammengefügt; denn das Volk hatte den festen Willen[a], zu arbeiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Das Volk hatte ein Herz zum Tun.“ Gemeint ist, dass die Menschen innerlich bereit und entschlossen waren, die Arbeit zu tun.'
    reason: Die Fußnote bewahrt das hebräische Bild hinter der idiomatischen Wiedergabe „den festen Willen“ und unterscheidet die wörtliche Glosse „zum Tun“ von der kontextuellen Übersetzung „zu arbeiten“.
lexical_decisions:
- source_word: וַנִּבְנֶה
  choice: So bauten wir … wieder auf
  rationale: Das Qal-Wayyiqtol der 1. Person Plural führt die Erzählung fort. „Wieder aufbauen“ entspricht dem Zusammenhang, in dem die bestehende Stadtmauer Jerusalems wiederhergestellt wird; „So“ gibt den erzählerischen Anschluss natürlich wieder.
- source_word: הַחוֹמָה
  choice: die Mauer
  rationale: חוֹמָה bezeichnet hier eindeutig die Stadtmauer; der bestimmte Singular wird entsprechend wiedergegeben.
- source_word: וַתִּקָּשֵׁר
  choice: wurde … zusammengefügt
  rationale: Die Niphal-Form von קשר beschreibt, dass die einzelnen Mauerabschnitte zu einem zusammenhängenden Ganzen verbunden wurden. Die passive, resultative Aussage bleibt erhalten.
- source_word: כָּל הַחוֹמָה
  choice: die ganze Mauer
  rationale: כָּל mit dem bestimmten Substantiv bezeichnet die Mauer in ihrer Gesamtheit.
- source_word: עַד חֶצְיָהּ
  choice: bis zur Hälfte ihrer Höhe
  rationale: Wörtlich steht „bis zu ihrer Hälfte“. Im Bauzusammenhang ist die erreichte Höhe gemeint; die Ergänzung macht den Bezug im Deutschen verständlich.
- source_word: וַיְהִי לֵב לָעָם
  choice: denn das Volk hatte den festen Willen
  rationale: Die hebräische Wendung lautet wörtlich, dem Volk sei „ein Herz“ gewesen, und bezeichnet innere Bereitschaft und Entschlossenheit. „Denn“ bringt die im Zusammenhang naheliegende Begründung zum Ausdruck.
- source_word: לַעֲשׂוֹת
  choice: zu arbeiten
  rationale: Das allgemeine Verb עשה („tun, machen“) bezieht sich hier auf die ausgeführte Bauarbeit; „arbeiten“ ist im Deutschen die natürliche kontextuelle Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die Übersetzung wahrt die Abfolge und den begründenden Zusammenhang des Hebräischen, ohne die ungewöhnliche hebräische Herz-Wendung im Haupttext unnatürlich nachzubilden.
