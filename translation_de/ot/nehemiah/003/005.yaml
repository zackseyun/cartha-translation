  text: וְ/עַל יָדָ֖/ם הֶחֱזִ֣יקוּ הַ/תְּקוֹעִ֑ים וְ/אַדִּֽירֵי/הֶם֙ לֹא הֵבִ֣יאוּ צַוָּרָ֔/ם בַּ/עֲבֹדַ֖ת אֲדֹנֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/005.yaml
  text: And next to them the Tekoites made repairs[b][a], but their nobles would not put their necks to the work of their lords.
translation:
  language: de
  text: Neben ihnen besserten die Männer aus Tekoa die Mauer aus. Doch ihre Vornehmen[a] wollten ihren Nacken nicht zum Dienst ihrer Herren beugen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre führenden Männer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „brachten ihren Nacken nicht in den Dienst ihrer Herren“; das Bild vom Nacken unter dem Joch drückt aus, dass sie die Arbeit und die damit verbundene Unterordnung verweigerten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדָם
  choice: Neben ihnen
  rationale: Die Wendung bezeichnet in der Bauliste die räumliche Nachbarschaft des nächsten Arbeitsabschnitts.
- source_word: הֶחֱזִיקוּ
  choice: besserten ... die Mauer aus
  rationale: Das Verb bezeichnet in Nehemia 3 regelmäßig das Ausbessern beziehungsweise Wiederherstellen der Mauer; das ergänzte Objekt macht den Zusammenhang im Deutschen klar.
- source_word: הַתְּקוֹעִים
  choice: die Männer aus Tekoa
  rationale: Das Gentiliz bezeichnet die Einwohner von Tekoa; diese Form ist im modernen Deutsch natürlicher als eine eingedeutschte Einwohnerbezeichnung.
- source_word: וְאַדִּירֵיהֶם
  choice: ihre Vornehmen
  rationale: Das Wort bezeichnet mächtige, angesehene oder führende Personen; „Vornehmen“ bewahrt den sozialen Rang, ohne ein bestimmtes Amt vorauszusetzen.
- source_word: לֹא הֵבִיאוּ צַוָּרָם
  choice: wollten ihren Nacken nicht ... beugen
  rationale: Die Wiedergabe bewahrt das hebräische Nackenbild und bringt zugleich den im Kontext ausgedrückten Widerwillen beziehungsweise die verweigerte Unterordnung verständlich zum Ausdruck.
- source_word: בַּעֲבֹדַת
  choice: unter die Arbeit
  rationale: עֲבֹדָה meint hier die gemeinschaftliche Bauarbeit; „unter“ verbindet sie im Deutschen idiomatisch mit dem Bild des unter ein Joch gebeugten Nackens.
- source_word: אֲדֹנֵיהֶם
  choice: ihrer Herren
  rationale: Der hebräische Ausdruck steht im Plural und bezeichnet Herren, Vorgesetzte oder andere Autoritätspersonen; die direkte Wiedergabe erhält diese Mehrdeutigkeit.
theological_decisions:
- issue: Bezug von אֲדֹנֵיהֶם („ihre Herren“)
  choice: Pluralisch als „ihrer Herren“ wiedergegeben, mit naheliegendem Bezug auf menschliche Autoritätspersonen
  alternative: Deutende Glättung zu „am Werk des Herrn“ oder Präzisierung als „ihrer Vorgesetzten“
  rationale: Der masoretische Text bietet einen Plural mit Possessivsuffix. Eine Umdeutung zum singulären Gottesnamen wäre textlich nicht gerechtfertigt; zugleich legt die Übersetzung die genaue Funktion der genannten Herren nicht enger fest als das Hebräische.
- issue: Metapher des Nackens
  choice: Das Körperbild bleibt in der Übersetzung erhalten
  alternative: 'Rein sinngemäß: „weigerten sich, bei der Arbeit mitzumachen“'
  rationale: Das Bild kann sowohl die Aufnahme mühevoller Arbeit als auch Unterordnung unter Autorität anklingen lassen. Eine rein funktionale Paraphrase würde diese Spannung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Einwohnerbezeichnung wird natürlich als „Männer aus Tekoa“ formuliert. Das ungewohnte, aber anschauliche Nackenbild bleibt erhalten und wird durch eine Fußnote erläutert; der pluralische Ausdruck „ihre Herren“ wird nicht theologisch geglättet.
