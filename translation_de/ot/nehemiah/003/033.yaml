id: NEH.3.33
reference: Nehemiah 3:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֞י כַּ/אֲשֶׁ֧ר שָׁמַ֣ע סַנְבַלַּ֗ט כִּֽי אֲנַ֤חְנוּ בוֹנִים֙ אֶת הַ֣/חוֹמָ֔ה וַ/יִּ֣חַר ל֔/וֹ וַ/יִּכְעַ֖ס הַרְבֵּ֑ה וַ/יַּלְעֵ֖ג עַל הַ/יְּהוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/033.yaml
  text: When Sanballat heard that we were rebuilding the wall[a], he became angry and very enraged, and he mocked the Jews.
translation:
  language: de
  text: Als Sanballat hörte, dass wir die Mauer wieder aufbauten, wurde er zornig und geriet in große Wut. Er verspottete die Juden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Judäer“. Das hebräische Wort kann sowohl die Bewohner Judas im regionalen Sinn als auch die Juden im weiteren Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als
  rationale: Die hebräische Erzählungsformel leitet die folgende Entwicklung ein; „Als“ gibt den zeitlichen Zusammenhang im modernen Deutschen natürlich wieder.
- source_word: שָׁמַע
  choice: hörte
  rationale: Das Verb bedeutet gewöhnlich „hören“ und bezeichnet hier das Erhalten einer Nachricht.
- source_word: סַנְבַלַּט
  choice: Sanballat
  rationale: Der Personenname wird nach der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: כִּי אֲנַחְנוּ בוֹנִים
  choice: dass wir … wieder aufbauten
  rationale: Das Partizip bezeichnet eine fortdauernde Tätigkeit. „Wieder aufbauten“ berücksichtigt, dass die beschädigte Jerusalemer Mauer wiederhergestellt wurde.
- source_word: הַחוֹמָה
  choice: die Mauer
  rationale: חוֹמָה bezeichnet eine Befestigungsmauer; im Zusammenhang ist die Stadtmauer Jerusalems eindeutig gemeint.
- source_word: וַיִּחַר לוֹ
  choice: wurde er zornig
  rationale: Die Wendung beschreibt wörtlich ein Entbrennen des Zorns; die gewählte Form ist natürlich und bewahrt das erste Glied der Steigerung.
- source_word: וַיִּכְעַס הַרְבֵּה
  choice: geriet in große Wut
  rationale: Das zweite Zornesverb mit הַרְבֵּה verstärkt das erste. Die eigenständige Formulierung erhält diese Steigerung, ohne beide Verben gleich wiederzugeben.
- source_word: וַיַּלְעֵג
  choice: verspottete
  rationale: Das Verb bezeichnet höhnisches, verächtliches Reden; „verspotten“ ist präzise und stilistisch angemessen.
- source_word: עַל הַיְּהוּדִים
  choice: die Juden
  rationale: יְהוּדִים kann sowohl die Juden allgemein als auch regional die Judäer bezeichnen. „Juden“ ist im Kontext verständlich und gebräuchlich; die regionale Lesart bleibt in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden aufeinanderfolgenden Zornesausdrücke werden als Steigerung wiedergegeben; die kurzen Hauptsätze vermeiden eine schwerfällige Häufung von „und“.
