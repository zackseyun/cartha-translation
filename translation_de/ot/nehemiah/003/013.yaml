  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵת֩ שַׁ֨עַר הַ/גַּ֜יְא הֶחֱזִ֣יק חָנוּן֮ וְ/יֹשְׁבֵ֣י זָנוֹחַ֒ הֵ֣מָּה בָנ֔וּ/הוּ וַֽ/יַּעֲמִ֨ידוּ֙ דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָ֑י/ו וְ/אֶ֤לֶף אַמָּה֙ בַּ/חוֹמָ֔ה עַ֖ד שַׁ֥עַר הָ/שֲׁפֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/013.yaml
  text: Hanun and the inhabitants of Zanoah repaired the Valley Gate[a]. They built it and set up its doors, its bolts, and its bars, and repaired a thousand cubits of the wall[c][b], as far as the Dung Gate.
translation:
  language: de
  text: Das Taltor[a] besserte Hanun zusammen mit den Einwohnern von Sanoach aus. Sie bauten es und setzten seine Torflügel, Riegel und Querbalken ein. Außerdem besserten sie tausend Ellen[b] der Mauer aus, bis zum Misttor[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „befestigte das Taltor“; das hebräische Verb kann „fest machen“ oder im Wiederaufbauzusammenhang „ausbessern“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Tausend Ellen entsprechen ungefähr 450 Metern.
    reason: cultural_note
  - marker: c
    text: 'Oder: „Abfalltor“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: besserte … aus
  rationale: Das Verb bezeichnet im Zusammenhang von Nehemia 3 die Instandsetzung beziehungsweise Befestigung eines Bauabschnitts. „Ausbessern“ gibt den Wiederherstellungskontext in natürlichem Deutsch wieder, ohne den Grundsinn des Festmachens auszuschließen.
- source_word: שַׁעַר הַגַּיְא
  choice: Taltor
  rationale: Die hebräische Status-constructus-Verbindung benennt ein Stadttor. „Taltor“ ist im Deutschen knapp und als Torname verständlich.
- source_word: יֹשְׁבֵי זָנוֹחַ
  choice: Einwohner von Sanoach
  rationale: Das substantivierte Partizip bezeichnet die in Sanoach wohnenden Menschen; „Einwohner“ ist idiomatisch und präzise.
- source_word: הֵמָּה בָנוּהוּ
  choice: Sie bauten es
  rationale: Die Übersetzung folgt dem ausdrücklichen Verb „bauen“. Der Wiederaufbau ergibt sich bereits aus dem Zusammenhang, sodass er nicht zusätzlich in das Verb eingetragen werden muss.
- source_word: וַיַּעֲמִידוּ
  choice: setzten … ein
  rationale: Wörtlich bedeutet das Verb „hinstellen/aufrichten“. Bei Torflügeln und Beschlägen bezeichnet „einsetzen“ im modernen Deutsch natürlich die Anbringung an ihrem vorgesehenen Platz.
- source_word: דַּלְתֹתָיו
  choice: seine Torflügel
  rationale: Der Plural bezeichnet die beweglichen Flügel des Tores. „Torflügel“ ist hier genauer als das allgemeinere „Türen“.
- source_word: מַנְעֻלָיו
  choice: Riegel
  rationale: Im Torbau bezeichnet das Wort Verschlussvorrichtungen. „Riegel“ passt zum antiken baulichen Zusammenhang besser als das modern wirkende „Schlösser“.
- source_word: בְרִיחָיו
  choice: Querbalken
  rationale: Gemeint sind Balken oder Stangen zur Sicherung des Tores. „Querbalken“ unterscheidet sie verständlich von den zuvor genannten Riegeln.
- source_word: אֶלֶף אַמָּה
  choice: tausend Ellen
  rationale: Die antike Maßeinheit bleibt im Haupttext erhalten; eine ungefähre moderne Umrechnung steht in der Fußnote.
- source_word: בַּחוֹמָה
  choice: der Mauer
  rationale: In Verbindung mit der Streckenangabe bezeichnet die Wendung den ausgebesserten Abschnitt der Mauer.
- source_word: שַׁעַר הָשֲׁפוֹת
  choice: Misttor
  rationale: Der Torname wird traditionell und wahrscheinlich zutreffend mit der Entsorgung von Mist oder Abfall verbunden. „Misttor“ ist direkt, würdig und im deutschen Bibelstil etabliert.
