base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/036.yaml
  text: Hear[a], our God, for we are despised. Turn their reproach back on their own heads[c][b], and give them over as plunder in a land of captivity.
translation:
  language: de
  text: Höre, unser Gott, denn wir sind zum Gespött geworden.[a] Lass ihre Schmähung auf ihre eigenen Köpfe zurückfallen und gib sie als Beute preis[b] in einem Land der Gefangenschaft.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „denn wir sind zur Verachtung geworden“; auch: „denn man verachtet uns“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „gib sie der Plünderung preis“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „im Land der Gefangenschaft“. Das Hebräische kann hier je nach Zusammenhang unbestimmt oder bestimmt verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Höre
  rationale: Der Imperativ richtet sich unmittelbar an Gott. „Höre“ entspricht der üblichen Gebetssprache, ohne das im Hebräischen nicht ausdrücklich genannte Objekt „uns“ hinzuzufügen.
- source_word: הָיִינוּ בוּזָה
  choice: wir sind zum Gespött geworden
  rationale: Die Perfektform mit dem Substantiv בוּזָה bezeichnet einen eingetretenen Zustand der Verachtung. Die deutsche Wendung gibt diesen resultativen Sinn natürlich wieder; die wörtlichere Ausdrucksweise wird in Fußnote [a] bewahrt.
- source_word: וְהָשֵׁב חֶרְפָּתָם אֶל רֹאשָׁם
  choice: Lass ihre Schmähung auf ihren eigenen Kopf zurückfallen
  rationale: Der Hifil-Imperativ von שׁוב verlangt hier ein Zurückkehrenlassen. „Auf ihren eigenen Kopf“ erhält das hebräische Bild der vergeltenden Umkehr, während „Schmähung“ sowohl die beleidigende Rede als auch deren entehrende Wirkung anklingen lässt.
- source_word: וּתְנֵם לְבִזָּה
  choice: gib sie … der Plünderung preis
  rationale: נתן mit Personenobjekt und לְבִזָּה bittet darum, sie der Plünderung auszuliefern. Die deutsche Fügung „preisgeben“ ist natürlich und behält die Härte der Bitte bei.
- source_word: בְּאֶרֶץ שִׁבְיָה
  choice: in einem Land der Gefangenschaft
  rationale: Die artikellose hebräische Wortgruppe wird zunächst unbestimmt wiedergegeben. „Gefangenschaft“ wahrt den konkreten Gehalt von שִׁבְיָה, ohne ihn vorschnell ausschließlich als „Exil“ zu deuten.
theological_decisions:
- issue: Bitte um Vergeltung an den Feinden
  choice: Die direkte Bitte um vergeltende Gerechtigkeit bleibt ungemildert erhalten.
  alternative: Die Aussage zu einer allgemeinen Bitte um Gerechtigkeit abschwächen oder nur bildlich verstehen.
  rationale: Der hebräische Text bittet ausdrücklich darum, die Schmähung auf die Gegner zurückfallen zu lassen und sie der Plünderung preiszugeben. Eine Übersetzung soll diese theologische Spannung weder beseitigen noch konfessionell umdeuten.
translation_notes:
  register: Moderne, würdige Gebetssprache. Das Bild vom Zurückfallen auf den eigenen Kopf und die scharfe Form der Vergeltungsbitte bleiben erhalten. Die ungewöhnlichere Wendung „Land der Gefangenschaft“ ist quellennah; ihre Bestimmtheit wird in der Fußnote offengehalten.
