id: NEH.3.11
reference: Nehemiah 3:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִדָּ֣ה שֵׁנִ֗ית הֶחֱזִיק֙ מַלְכִּיָּ֣ה בֶן חָרִ֔ם וְ/חַשּׁ֖וּב בֶּן פַּחַ֣ת מוֹאָ֑ב וְ/אֵ֖ת מִגְדַּ֥ל הַ/תַּנּוּרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/011.yaml
  text: Malchijah son of Harim and Hasshub son of Pahath-moab repaired another section[b][a], and also the Tower of the Ovens.
translation:
  language: de
  text: Einen weiteren Abschnitt[a] besserten Malkija, der Sohn Harims, und Haschub, der Sohn Pahat-Moabs, aus, ebenso den Ofenturm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »einen zweiten Abschnitt«. Gemeint ist hier ein zusätzlicher, zur Ausbesserung übernommener Mauerabschnitt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Turm der Öfen« beziehungsweise »Feuerungsturm«. Das hebräische Wort kann Öfen oder Feuerungsanlagen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדָּה שֵׁנִית
  choice: einen weiteren Abschnitt
  rationale: Die Wendung bezeichnet im Zusammenhang von Nehemia 3 einen zusätzlichen, zur Ausbesserung zugewiesenen Mauerabschnitt. „Einen weiteren Abschnitt“ ist natürliches Deutsch; die formalere Alternative bleibt in der Fußnote erhalten.
- source_word: הֶחֱזִיק
  choice: besserten … aus
  rationale: Im Kontext des Mauerbaus bezeichnet das Verb das Ausbessern beziehungsweise Wiederherstellen eines Bauabschnitts. Die Verbklammer gibt den hebräischen Satz im Deutschen flüssig wieder.
- source_word: מַלְכִּיָּה
  choice: Malkija
  rationale: Der Personenname wird in einer im Deutschen geläufigen, quellennahen Form wiedergegeben.
- source_word: בֶן חָרִם
  choice: der Sohn Harims
  rationale: Die hebräische Abstammungsangabe wird klar und idiomatisch wiedergegeben.
- source_word: וְחַשּׁוּב
  choice: und Haschub
  rationale: Die Konjunktion und der Personenname werden unmittelbar wiedergegeben; „Haschub“ bildet die hebräischen Konsonanten deutsch lesbar ab.
- source_word: בֶּן פַּחַת מוֹאָב
  choice: der Sohn Pahat-Moabs
  rationale: Der zusammengesetzte Familien- oder Sippenname bleibt transliteriert; der Genitiv fügt sich natürlich in den deutschen Satz ein.
- source_word: וְאֵת
  choice: ebenso
  rationale: Die Verbindung führt ein weiteres Objekt der Ausbesserungsarbeit ein. „Ebenso“ macht diese additive Funktion knapp und idiomatisch deutlich.
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: den Ofenturm
  rationale: מִגְדָּל bedeutet „Turm“, während תַּנּוּרִים Öfen oder Feuerungsanlagen bezeichnen kann. „Ofenturm“ eignet sich als verständlicher Ortsname, ohne die genaue Nutzung festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hebt wie im Hebräischen zunächst den zusätzlichen Abschnitt hervor. Eigennamen sind deutsch lesbar transliteriert; die im Hebräischen mögliche Bedeutungsspanne bei Abschnitt und Öfen/Feuerungsanlagen wird in Fußnoten bewahrt.
