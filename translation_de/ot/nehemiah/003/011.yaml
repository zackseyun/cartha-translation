  source_fidelity: Der Text gibt מִדָּה שֵׁנִית idiomatisch als „einen weiteren Abschnitt“ wieder und bewahrt die formal mögliche Lesart „einen zweiten Abschnitt“ in der Fußnote. הֶחֱזִיק ist im Kontext zutreffend mit „besserten … aus“ übersetzt. Beide beteiligten Personen, ihre Abstammungsangaben sowie das zusätzliche Objekt, den Turm, sind vollständig erfasst.
