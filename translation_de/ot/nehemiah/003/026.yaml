  text: The temple servants were living on the Ophel[a], as far as opposite the Water Gate toward the east and the projecting tower.
translation:
  language: de
  text: Die Tempeldiener[a] wohnten auf dem Ofel bis gegenüber dem Wassertor im Osten und dem vorspringenden Turm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch Netinim: eine Gruppe von Tempeldienern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: die Tempeldiener
  rationale: Der Ausdruck bezeichnet eine anerkannte Gruppe von Bediensteten, die für Aufgaben am Tempel bestimmt war. Die Funktionsbezeichnung ist für heutige Leser verständlicher als eine bloße Umschrift.
- source_word: הָיוּ יֹשְׁבִים
  choice: wohnten
  rationale: Die Verbindung von היה mit Partizip beschreibt hier einen andauernden Wohnzustand; das schlichte deutsche Präteritum gibt ihn natürlich wieder.
- source_word: בָּעֹפֶל
  choice: auf dem Ofel
  rationale: עֹפֶל ist hier die Bezeichnung eines erhöhten Geländes in Jerusalem. „Auf“ entspricht der topografischen Vorstellung; der Ortsname wird als „Ofel“ wiedergegeben.
- source_word: עַד נֶגֶד
  choice: bis zu der Stelle gegenüber
  rationale: Die Formulierung bewahrt sowohl die durch עַד bezeichnete räumliche Ausdehnung als auch die Gegenüberlage von נֶגֶד und vermeidet die unnatürliche Wendung „bis gegenüber“.
- source_word: שַׁעַר הַמַּיִם לַמִּזְרָח
  choice: dem Wassertor im Osten
  rationale: „Wassertor“ ist die natürliche deutsche Wiedergabe der Torbezeichnung. Die Richtungsangabe wird als Lageangabe „im Osten“ verstanden; „nach Osten“ bleibt als mögliche Nuance denkbar.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: dem vorspringenden Turm
  rationale: Das Partizip יֹצֵא beschreibt im baulichen Zusammenhang einen Turm, der aus der Mauerlinie hervortritt. „Vorspringend“ bewahrt dieses räumliche Bild knapp und idiomatisch.
