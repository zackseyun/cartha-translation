  text: אַחֲרָ֣י/ו הֶחֱזִ֗יק מְרֵמ֧וֹת בֶּן אוּרִיָּ֛ה בֶּן הַקּ֖וֹץ מִדָּ֣ה שֵׁנִ֑ית מִ/פֶּ֨תַח֙ בֵּ֣ית אֶלְיָשִׁ֔יב וְ/עַד תַּכְלִ֖ית בֵּ֥ית אֶלְיָשִֽׁיב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/021.yaml
  text: After him[a], Meremoth son of Uriah, son of Hakkoz, repaired another section, from the entrance of the house of Eliashib to the end of the house of Eliashib.
translation:
  language: de
  text: Nach ihm besserte Meremot, der Sohn Urijas, des Sohnes von Hakkoz, einen weiteren Abschnitt aus[a], vom Eingang des Hauses Eljaschibs bis zum Ende des Hauses Eljaschibs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen zweiten Abschnitt“. Die hebräische Wendung kann einen zusätzlichen, Meremot zugeteilten Abschnitt oder, formeller, „ein zweites Maß/eine zweite Strecke“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Nach ihm
  rationale: Die Wendung kennzeichnet in der Bauliste die Abfolge der Arbeitsabschnitte; die direkte Wiedergabe bewahrt diesen erzählerischen Zusammenhang.
- source_word: הֶחֱזִיק
  choice: setzte … instand
  rationale: Das Verb bedeutet grundsätzlich „stärken“, bezeichnet in Nehemia 3 aber idiomatisch die Ausbesserungs- oder Wiederherstellungsarbeiten an der Mauer und den zugehörigen Bauten.
- source_word: מְרֵמוֹת בֶּן אוּרִיָּה בֶּן הַקּוֹץ
  choice: Meremot, der Sohn Urias, des Sohnes von Hakkoz
  rationale: Die Namens- und Abstammungsfolge wird vollständig bewahrt und in eine natürliche deutsche Genitivkonstruktion gefasst.
- source_word: מִדָּה שֵׁנִית
  choice: einen weiteren Abschnitt
  rationale: Die Formulierung bezeichnet wahrscheinlich einen zusätzlichen, Meremot zugeteilten Bauabschnitt; nach Vers 4 war er bereits an einem anderen Abschnitt beteiligt. Die mögliche formellere Bedeutung wird in der Fußnote erhalten.
- source_word: מִפֶּתַח בֵּית אֶלְיָשִׁיב
  choice: vom Eingang des Hauses Eljaschibs
  rationale: פֶּתַח bezeichnet hier die Öffnung beziehungsweise den Eingang eines Hauses; „Eingang“ ist im Deutschen klar und natürlich.
- source_word: וְעַד תַּכְלִית בֵּית אֶלְיָשִׁיב
  choice: bis zum Ende des Hauses Eljaschibs
  rationale: תַּכְלִית bezeichnet in dieser räumlichen Beschreibung den Endpunkt oder äußersten Bereich, nicht die abstrakte Vollendung.
