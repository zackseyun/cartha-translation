source:
  edition: WLC
  text: וְ/אֵת֩ שַׁ֨עַר הָ/עַ֜יִן הֶ֠חֱזִיק שַׁלּ֣וּן בֶּן כָּל חֹזֶה֮ שַׂ֣ר פֶּ֣לֶךְ הַ/מִּצְפָּה֒ ה֤וּא יִבְנֶ֨/נּוּ֙ וִ/יטַֽלְלֶ֔/נּוּ ו/יעמידו דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָ֑י/ו וְ֠/אֵת חוֹמַ֞ת בְּרֵכַ֤ת הַ/שֶּׁ֨לַח֙ לְ/גַן הַ/מֶּ֔לֶךְ וְ/עַד הַֽ/מַּעֲל֔וֹת הַ/יּוֹרְד֖וֹת מֵ/עִ֥יר דָּוִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/015.yaml
  text: And Shallun son of Col-hozeh[a], official of the district of Mizpah, repaired the Fountain Gate. He rebuilt it and roofed it, and set up its doors, its bolts, and its bars, and repaired the wall of the Pool of Shelah by the king’s garden, as far as the stairs that go down from the City of David.
translation:
  language: de
  text: Und Schallun, der Sohn Kol-Hoses, der Vorsteher des Bezirks Mizpa, besserte das Quelltor aus. Er baute es wieder auf und überdachte es; und sie setzten seine Torflügel, seine Riegel und seine Querbalken ein. Außerdem besserte er die Mauer des Teiches Schelach[a] beim Garten des Königs aus, bis zu den Stufen, die von der Davidstadt hinabführen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Teich Siloah“; traditionell ist er unter dem Namen Siloah beziehungsweise Siloam bekannt. Der hebräische Ortsname lautet hier Schelach.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: Quelltor
  rationale: עַיִן bezeichnet hier eine Quelle als Wasserstelle. „Quelltor“ ist im Deutschen natürlich und bewahrt den topografischen Bezug.
- source_word: הֶחֱזִיק
  choice: besserte … aus
  rationale: Das Verb bezeichnet in Nehemia 3 idiomatisch die Beteiligung an Ausbesserungs- und Wiederherstellungsarbeiten.
- source_word: שַׂר פֶּלֶךְ הַמִּצְפָּה
  choice: Vorsteher des Bezirks Mizpa
  rationale: שַׂר bezeichnet einen leitenden Amtsträger, פֶּלֶךְ einen Verwaltungsbezirk. „Vorsteher“ gibt die Leitungsfunktion wieder, ohne einen genaueren Amtstitel vorauszusetzen.
- source_word: הוּא יִבְנֶנּוּ
  choice: Er baute es wieder auf
  rationale: Das ausdrücklich gesetzte Pronomen hebt Schallun als Handelnden hervor; im Wiederherstellungskontext ist „wieder aufbauen“ treffender als schlicht „bauen“.
- source_word: וִיטַלְלֶנּוּ
  choice: überdachte es
  rationale: Das Verb bezeichnet das Abdecken beziehungsweise Versehen des Torgebäudes mit einem Dach.
- source_word: ויעמידו דַּלְתֹתָיו מַנְעֻלָיו וּבְרִיחָיו
  choice: brachte seine Torflügel, Riegel und Querbalken an
  rationale: Die Wendung beschreibt das Einsetzen der funktionalen Torteile. „Torflügel“ verdeutlicht דְּלָתוֹת; מַנְעֻלִים und בְּרִיחִים werden als Riegel und sichernde Querbalken unterschieden.
- source_word: חוֹמַת בְּרֵכַת הַשֶּׁלַח
  choice: die Mauer am Teich Schelach
  rationale: בְּרֵכָה ist ein Wasserbecken oder Teich. „Schelach“ gibt die hebräische Namensform wieder; die traditionelle Bezeichnung wird in der Fußnote genannt.
- source_word: לְגַן הַמֶּלֶךְ
  choice: beim Garten des Königs
  rationale: לְ bezeichnet in dieser topografischen Beschreibung die räumliche Beziehung zum königlichen Garten.
- source_word: וְעַד הַמַּעֲלוֹת הַיּוֹרְדֹות מֵעִיר דָּוִיד
  choice: bis zu den Stufen, die von der Davidstadt hinabführen
  rationale: מַעֲלוֹת kann Stufen bezeichnen; das Partizip „hinabführend“ bestimmt hier ihre Richtung. מִן kennzeichnet den Ausgangspunkt.
