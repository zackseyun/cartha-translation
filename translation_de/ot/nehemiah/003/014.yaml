source:
  edition: WLC
  text: וְ/אֵ֣ת שַׁ֣עַר הָ/אַשְׁפּ֗וֹת הֶחֱזִיק֙ מַלְכִּיָּ֣ה בֶן רֵכָ֔ב שַׂ֖ר פֶּ֣לֶךְ בֵּית הַכָּ֑רֶם ה֣וּא יִבְנֶ֔/נּוּ וְ/יַעֲמִיד֙ דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָֽי/ו׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/014.yaml
  text: And Malchijah son of Rechab[a], ruler of the district of Beth-haccherem, repaired the Dung Gate. He built it and set up its doors, its bolts, and its bars.
translation:
  language: de
  text: Malkija, der Sohn Rechabs und Vorsteher des Bezirks Bet-Kerem, besserte das Misttor[a] aus. Er baute es und brachte seine Torflügel, Schlösser und Riegel an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Abfalltor“. Der hebräische Name bezieht sich auf Mist oder Abfall.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: besserte … aus
  rationale: Das Verb bezeichnet in Nehemia 3 regelmäßig die verantwortliche Ausführung von Reparaturarbeiten. „Ausbessern“ gibt diese Bedeutung im heutigen Deutsch natürlich wieder.
- source_word: שַׁעַר הָאַשְׁפּוֹת
  choice: Misttor
  rationale: אַשְׁפּוֹת bezeichnet Mist beziehungsweise Abfall. „Misttor“ bewahrt die konkrete Bedeutung und ist als deutscher Torname verständlich; die mögliche Wiedergabe „Abfalltor“ wird in der Fußnote genannt.
- source_word: שַׂר פֶּלֶךְ
  choice: Vorsteher des Bezirks
  rationale: שַׂר bezeichnet einen leitenden Amtsträger, פֶּלֶךְ einen Verwaltungsbezirk. „Vorsteher des Bezirks“ gibt die administrative Funktion wieder, ohne einen genaueren Rang zu behaupten.
- source_word: בֵּית הַכָּרֶם
  choice: Bet-Kerem
  rationale: Der Ortsname wird nach seiner hebräischen Form ins Deutsche übertragen und nicht als „Haus des Weinbergs“ übersetzt.
- source_word: הוּא יִבְנֶנּוּ
  choice: Er baute es
  rationale: בנה bedeutet „bauen“. Der Reparaturkontext ist bereits durch den vorangehenden Satz deutlich; „baute“ vermeidet es, die im Verb selbst nicht ausdrücklich enthaltene Bedeutung „wieder“ hinzuzufügen. Das betonte הוּא wird durch den ausdrücklichen Satzanfang „Er“ wiedergegeben.
- source_word: וְיַעֲמִיד
  choice: setzte … ein
  rationale: Der Hifil von עמד bezeichnet hier das Aufstellen beziehungsweise Anbringen der Bauteile des Tores. „Einsetzen“ ist im Deutschen für Torflügel und Sicherungsteile idiomatisch.
- source_word: דַּלְתֹתָיו
  choice: seine Torflügel
  rationale: Der Plural bezeichnet die beweglichen Tür- oder Torflügel des Tores. „Torflügel“ ist präziser als das allgemeinere „Türen“.
- source_word: מַנְעֻלָיו
  choice: seine Riegel
  rationale: Das Wort bezeichnet Vorrichtungen zum Verschließen oder Sichern. „Riegel“ ist im Zusammenhang eines Stadttores eine natürliche deutsche Bezeichnung.
- source_word: וּבְרִיחָיו
  choice: seine Querbalken
  rationale: בְּרִיחַ bezeichnet einen Balken oder eine Stange, mit der ein Tor gesichert wird. „Querbalken“ unterscheidet dieses Bauteil verständlich von den zuvor genannten Riegeln.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Personennamen und der Ortsname folgen einer für deutsche Leser gut lesbaren hebräischen Umschrift. Die Satzfolge bewahrt die hervorgehobene zweite Aussage „Er baute es“, ohne das hebräische Objekt zwingend an den Satzanfang zu stellen.
