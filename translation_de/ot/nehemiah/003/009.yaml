  text: וְ/עַל יָדָ֤/ם הֶחֱזִיק֙ רְפָיָ֣ה בֶן ח֔וּר שַׂ֕ר חֲצִ֖י פֶּ֥לֶךְ יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/009.yaml
  text: Next to them[a], Rephaiah son of Hur, ruler of half the district of Jerusalem, made repairs.
translation:
  language: de
  text: Neben ihnen führte Refaja, der Sohn Hurs, Ausbesserungsarbeiten durch, der Vorsteher der Hälfte des Bezirks Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Neben ihnen
  rationale: Die Wendung bezeichnet in Nehemia 3 die jeweils angrenzende Arbeitsgruppe und führt die fortlaufende Liste der Mauerabschnitte natürlich weiter.
- source_word: הֶחֱזִיק
  choice: besserte … aus
  rationale: Der Hifil von חזק bedeutet wörtlich „stark machen“, wird hier jedoch idiomatisch für das Ausbessern beziehungsweise Befestigen der Mauer gebraucht. „Ausbessern“ entspricht dem Baukontext in natürlichem Deutsch.
- source_word: רְפָיָה
  choice: Refaja
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, quellennahen Form wiedergegeben.
- source_word: בֶן חוּר
  choice: der Sohn Hurs
  rationale: Die übliche deutsche Wiedergabe des hebräischen Patronymikons identifiziert Refaja über seinen Vater.
- source_word: שַׂר
  choice: Vorsteher
  rationale: שַׂר bezeichnet hier einen leitenden Amtsträger. „Vorsteher“ passt zum lokalen Verwaltungszusammenhang, ohne einen höheren politischen Rang zu unterstellen.
- source_word: חֲצִי פֶּלֶךְ
  choice: des halben Bezirks
  rationale: פֶּלֶךְ bezeichnet hier einen Verwaltungsbezirk; חֲצִי weist darauf hin, dass Refaja für eine Hälfte dieses Bezirks zuständig war.
- source_word: יְרוּשָׁלִָם
  choice: von Jerusalem
  rationale: Die geläufige deutsche Namensform wird verwendet; der Ortsname bestimmt den Verwaltungsbezirk näher.
