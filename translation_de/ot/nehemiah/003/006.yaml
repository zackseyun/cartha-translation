base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/006.yaml
  text: And Joiada son of Paseah and Meshullam son of Besodeiah repaired the Old Gate. They laid its beams and set up its doors[a], its bolts, and its bars.
translation:
  language: de
  text: Das Alte Tor[a] besserten Jojada, der Sohn Paseachs, und Meschullam, der Sohn Besodjas, aus. Sie deckten es mit Balken und setzten seine Torflügel, Riegel und Sperrbalken ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „das Jeschana-Tor“, wenn der zweite Ausdruck als Ortsname und nicht als „alt“ verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחֱזִיקוּ
  choice: besserten … aus
  rationale: Im Arbeitsbericht von Nehemia 3 bezeichnet das Verb die Wiederherstellung eines Bauabschnitts. „Ausbessern“ ist im Deutschen natürlich und lässt offen, wie umfangreich die Arbeiten waren.
- source_word: שַׁעַר הַיְשָׁנָה
  choice: das Alte Tor
  rationale: Die Verbindung lässt sich am natürlichsten als Torname mit der Bedeutung „Altes Tor“ verstehen. Die mögliche Deutung von הַיְשָׁנָה als Ortsname wird in der Fußnote bewahrt.
- source_word: קֵרֻהוּ
  choice: legten seine Balken ein
  rationale: Das Verb bezeichnet ein Decken oder Überdachen mit Balken. Bei einem Torbau gibt „Balken einlegen“ die konkrete Bautätigkeit wieder, ohne eine vollständige Dachkonstruktion vorauszusetzen.
- source_word: וַיַּעֲמִידוּ
  choice: setzten … ein
  rationale: Das Kausativ bedeutet, etwas aufzustellen oder an seinen Platz zu bringen. Im Zusammenhang mit Bauteilen ist „einsetzen“ idiomatisch.
- source_word: דַּלְתֹתָיו
  choice: seine Torflügel
  rationale: Der Plural bezeichnet wahrscheinlich die beiden beweglichen Flügel des Tores. „Torflügel“ unterscheidet sie klar vom gesamten Torbau.
- source_word: מַנְעֻלָיו
  choice: Riegel
  rationale: Das Wort bezeichnet hier Teile des Verschlussmechanismus. „Riegel“ ist konkret, ohne moderne Schlösser vorauszusetzen.
- source_word: בְרִיחָיו
  choice: Querbalken
  rationale: Das Wort bezeichnet Balken oder Stangen zum Sichern eines Tores. „Querbalken“ unterscheidet diese von den zuvor genannten Riegeln und den Konstruktionsbalken.
- source_word: הֵמָּה
  choice: Sie
  rationale: Das betonte Pronomen nimmt die beiden genannten Bauleute wieder auf. Im natürlichen Deutschen genügt „Sie“.
- source_word: יוֹיָדָע ... וּמְשֻׁלָּם
  choice: Jojada … und Meschullam
  rationale: Die Personennamen werden in einer im Deutschen geläufigen, quellenahen Form wiedergegeben.
- source_word: פָּסֵחַ / בְּסוֹדְיָה
  choice: Paseach / Besodja
  rationale: Die patronymischen Personennamen werden transliteriert und nicht übersetzt.
