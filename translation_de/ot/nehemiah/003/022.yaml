base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/022.yaml
  text: After him the priests[a], the men of the plain, made repairs.
translation:
  language: de
  text: Nach ihm besserten die Priester, die Männer aus der Ebene[a], aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bezirk“. Das hebräische Wort kann eine Ebene oder einen kreisförmigen Bezirk bezeichnen; welcher Ort hier genau gemeint ist, ist unklar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Nach ihm
  rationale: Gibt die Abfolge in der Bauliste natürlich wieder; das vorangestellte וְ muss im Deutschen nicht eigens mit „und“ wiedergegeben werden.
- source_word: הֶחֱזִיקוּ
  choice: führten … die Ausbesserungsarbeiten fort
  rationale: Das Verb bezeichnet in Nehemia 3 idiomatisch die Beteiligung an den Reparaturarbeiten. „führten … fort“ wahrt zugleich den fortlaufenden Charakter der Bauliste und vermeidet ein unnatürliches „stärkten“.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Direkte Wiedergabe des bestimmten maskulinen Plurals.
- source_word: אַנְשֵׁי
  choice: die Männer aus
  rationale: Bewahrt die ausdrücklich maskuline Personenbezeichnung und gibt die Herkunft aus dem anschließend genannten Gebiet idiomatisch wieder.
- source_word: הַכִּכָּר
  choice: der Ebene
  rationale: כִּכָּר kann eine Ebene beziehungsweise einen kreisförmigen Bezirk bezeichnen. „Ebene“ ist lexikalisch eng, doch der genaue örtliche Bezug bleibt unsicher und wird deshalb in einer Fußnote erläutert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an der hebräischen Bauliste, klingt aber als deutscher Satz natürlich. Die geografische Mehrdeutigkeit von הַכִּכָּר wird nicht aufgelöst.
