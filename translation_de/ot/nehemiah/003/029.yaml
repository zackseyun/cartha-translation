  text: אַחֲרָ֧י/ו הֶחֱזִ֛יק צָד֥וֹק בֶּן אִמֵּ֖ר נֶ֣גֶד בֵּית֑/וֹ וְ/אַחֲרָ֤י/ו הֶחֱזִיק֙ שְׁמַֽעְיָ֣ה בֶן שְׁכַנְיָ֔ה שֹׁמֵ֖ר שַׁ֥עַר הַ/מִּזְרָֽח־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/029.yaml
  text: After him Zadok son of Immer made repairs opposite his house[a], and after him Shemaiah son of Shecaniah, keeper of the East Gate[c][b], made repairs.
translation:
  language: de
  text: Nach ihm führte Zadok, der Sohn Immers, gegenüber seinem Haus[a] Ausbesserungsarbeiten durch. Nach ihm führte Schemaja, der Sohn Schechanjas, der Hüter des Osttors[b], Ausbesserungsarbeiten durch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor seinem Haus“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Wächter des Osttors“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Nach ihm
  rationale: Die wiederkehrende Formel bezeichnet in Nehemia 3 die Abfolge der Arbeitsabschnitte und möglicherweise zugleich ihre räumliche Nachbarschaft. „Nach ihm“ bewahrt diese Offenheit.
- source_word: הֶחֱזִיק
  choice: besserte … die Mauer aus
  rationale: Das Hifil von חזק bedeutet wörtlich „stärken“, bezeichnet hier im Kontext jedoch die Ausbesserungsarbeiten an der Stadtmauer. Das im Deutschen ergänzte Objekt „die Mauer“ ergibt sich aus dem Kapitelzusammenhang.
- source_word: צָדוֹק בֶּן אִמֵּר
  choice: Zadok, der Sohn Immers
  rationale: Die Personennamen werden in geläufiger deutscher Form wiedergegeben; die Abstammungsangabe bleibt ausdrücklich erhalten.
- source_word: נֶגֶד בֵּיתוֹ
  choice: gegenüber seinem Haus
  rationale: נֶגֶד kann „gegenüber“ oder „vor“ bedeuten. Die gewählte Formulierung ist topografisch natürlich, ohne die Lage genauer festzulegen, als es der hebräische Text tut.
- source_word: שְׁמַעְיָה בֶן שְׁכַנְיָה
  choice: Schemaja, der Sohn Schechanjas
  rationale: Geläufige deutsche Transliteration der Personennamen bei formaler Beibehaltung der Abstammungsangabe.
- source_word: שֹׁמֵר
  choice: Hüter
  rationale: Das Partizip bezeichnet Schemajas Aufgabe oder Amt am Tor. „Hüter“ lässt sowohl Aufsicht als auch Bewachung zu.
- source_word: שַׁעַר הַמִּזְרָח
  choice: Osttor
  rationale: Die bestimmte hebräische Bezeichnung wird als Eigenbezeichnung eines bestimmten Tores idiomatisch wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „nach ihm“ und die parallele Satzstruktur des hebräischen Bauberichts bleiben erhalten. „Die Mauer“ wird zur natürlichen deutschen Verständlichkeit aus dem unmittelbaren Kapitelkontext ergänzt.
