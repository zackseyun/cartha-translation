source:
  edition: WLC
  text: וְ/אַל תְּכַס֙ עַל עֲוֺנָ֔/ם וְ/חַטָּאתָ֖/ם מִ/לְּ/פָנֶ֣י/ךָ אַל תִּמָּחֶ֑ה כִּ֥י הִכְעִ֖יסוּ לְ/נֶ֥גֶד הַ/בּוֹנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/037.yaml
  text: And do not cover over their guilt[a], and do not let their sin be blotted out from before you[b], for they have provoked anger in the presence of the builders.
translation:
  language: de
  text: Und decke ihre Schuld nicht zu[a], und tilge ihre Sünde nicht vor deinem Angesicht[b]; denn sie haben vor den Bauleuten Zorn erregt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vergib ihnen ihre Schuld nicht.“ Wörtlich steht im Hebräischen das Bild: „Decke ihre Schuld nicht zu.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Denn sie haben dich vor den Bauleuten zum Zorn gereizt.“ Das Hebräische nennt das Objekt des Zorn-Erregens nicht ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכַס ... עַל עֲוֺנָם
  choice: decke ihre Schuld nicht zu
  rationale: „Zudecken“ bewahrt das hebräische Bild von כסה עַל; im Zusammenhang kann es zugleich das Nichtvergeben beziehungsweise Nichtübergehen der Schuld bezeichnen.
- source_word: עֲוֺנָם
  choice: ihre Schuld
  rationale: עָוֹן kann Vergehen, Schuld oder Schuldfolge bezeichnen. „Schuld“ wahrt hier das moralische Gewicht und unterscheidet den Ausdruck von der parallelen „Sünde“.
- source_word: חַטָּאתָם
  choice: ihre Sünde
  rationale: Die übliche und im Parallelismus passende Wiedergabe von חַטָּאת.
- source_word: מִלְּפָנֶיךָ
  choice: vor deinem Angesicht
  rationale: Die Wendung erhält das räumlich-relationale Bild des Hebräischen, nach dem die Sünde nicht aus Gottes Gegenwart beziehungsweise Blickfeld getilgt werden soll.
- source_word: תִּמָּחֶה
  choice: tilge ... nicht
  rationale: מחה bezeichnet das Auslöschen oder Tilgen, besonders aus Erinnerung oder Verzeichnis. „Tilgen“ ist im Deutschen prägnant und für diesen Zusammenhang idiomatisch.
- source_word: הִכְעִיסוּ
  choice: sie haben ... Zorn erregt
  rationale: Der Hifil von כעס bedeutet, Zorn hervorzurufen. Da das hebräische Objekt unausgesprochen bleibt, vermeidet diese Wiedergabe die ausdrückliche Ergänzung „dich“.
- source_word: לְנֶגֶד הַבּוֹנִים
  choice: vor den Bauleuten
  rationale: לְנֶגֶד bedeutet hier am unmittelbarsten „vor, im Beisein von“. „Vor den Bauleuten“ ist knapp, natürlich und wahrt den öffentlichen Charakter der Provokation.
theological_decisions:
- issue: Fluchgebet hinsichtlich der Sünde der Gegner
  choice: Die direkte Bitte, ihre Schuld nicht zuzudecken und ihre Sünde nicht zu tilgen, bleibt ungemildert erhalten.
  alternative: Eine abgeschwächte Formulierung wie „Sieh nicht über ihr Unrecht hinweg“.
  rationale: Der hebräische Text enthält eine scharfe Bitte um Nichtvergebung beziehungsweise Nichttilgung. Die Übersetzung bewahrt diese theologische Spannung, ohne sie erklärend zu entschärfen.
- issue: Unausgesprochenes Objekt bei הִכְעִיסוּ
  choice: „Zorn erregt“ ohne ausdrücklich genanntes Objekt
  alternative: „dich zum Zorn gereizt“
  rationale: Gott ist im Gebetszusammenhang als Betroffener naheliegend, doch der hebräische Satz nennt das Objekt nicht ausdrücklich. Die knappe Form bewahrt diese grammatische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vor deinem Angesicht“ bewahrt bewusst das anschauliche hebräische Bild; „Bauleute“ ist im Mauerbaukontext natürlicher und genauer als das allgemeinere „Erbauer“.
