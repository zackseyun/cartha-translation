base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/004.yaml
  text: And next to them Meremoth son of Uriah[a], son of Hakkoz, made repairs; and next to them Meshullam son of Berechiah, son of Meshezabel, made repairs[c][b]; and next to them Zadok son of Baana made repairs.
translation:
  language: de
  text: Neben ihnen[a] führte Meremot, Sohn von Uria, Sohn von Hakkoz, Ausbesserungsarbeiten[b] durch. Neben ihnen führte Meschullam, Sohn von Berechja, Sohn von Meschesabel, Ausbesserungsarbeiten durch. Und neben ihnen führte Zadok, Sohn von Baana, Ausbesserungsarbeiten durch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »an ihrer Hand«; im Zusammenhang bezeichnet dies den unmittelbar angrenzenden Arbeitsabschnitt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »besserte … aus«. Das hebräische Verb kann wörtlicher auch »stärken« bedeuten; in diesem Kapitel ist es die feste Bezeichnung für Arbeiten zur Ausbesserung der Mauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Neben ihnen
  rationale: Die wörtliche Wendung »an ihrer Hand« ist hier ein räumliches Idiom und bezeichnet den jeweils angrenzenden Bauabschnitt. »Neben ihnen« gibt die Funktion im fortlaufenden Arbeitsverzeichnis natürlich wieder.
- source_word: הֶחֱזִיק
  choice: reparierte
  rationale: Das Verb bezeichnet in diesem Zusammenhang das Festmachen beziehungsweise Instandsetzen eines Mauer- oder Torabschnitts. »Reparierte« ist im modernen Deutsch klar und bewahrt den formelhaften Charakter der Aufzählung.
- source_word: מְרֵמוֹת
  choice: Meremot
  rationale: Der Personenname wird in einer dem Hebräischen nahen, im Deutschen gut lesbaren Form wiedergegeben.
- source_word: בֶּן
  choice: Sohn
  rationale: In den unmittelbar genealogischen Angaben dieser Liste ist »Sohn« die naheliegende Bedeutung; der weitere Sinn »Nachkomme« ist hier nicht erforderlich.
- source_word: אוּרִיָּה
  choice: Uria
  rationale: Übliche deutsche Form des hebräischen Personennamens.
- source_word: הַקּוֹץ
  choice: Hakkoz
  rationale: Der Artikel ist Bestandteil der überlieferten Namensform und wird in der Transliteration berücksichtigt.
- source_word: מְשֻׁלָּם
  choice: Meschullam
  rationale: Deutsche Transliteration des hebräischen Personennamens.
- source_word: בֶּרֶכְיָה
  choice: Berechja
  rationale: Deutsche Transliteration, die den hebräischen Gottesnamenbestandteil -ja erkennbar wiedergibt.
- source_word: מְשֵׁיזַבְאֵל
  choice: Meschesabel
  rationale: Dem hebräischen Lautbestand angenäherte und im Deutschen lesbare Transliteration.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Übliche deutsche Form des hebräischen Personennamens.
- source_word: בַּעֲנָא
  choice: Baana
  rationale: Dem masoretischen Text entsprechende deutsche Transliteration des Personennamens.
