base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/020.yaml
  text: After him[a], Baruch son of Zabbai zealously repaired a second section[b], from the angle to the entrance of the house of Eliashib the high priest.
translation:
  language: de
  text: Nach ihm besserte Baruch, der Sohn Sabbais[a], mit besonderem Eifer[b] einen zweiten Mauerabschnitt aus, von der Ecke bis zum Eingang des Hauses Eljaschibs, des Hohen Priesters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer abweichenden Namenstradition, die sich in einigen alten Übersetzungen widerspiegelt: „Baruch, der Sohn Sakkais“.'
    reason: alternative_reading
  - marker: b
    text: Die hier gebrauchte hebräische Wendung ist ungewöhnlich und hebt wahrscheinlich Baruchs leidenschaftlichen Eifer oder seine außergewöhnliche Tatkraft bei der Arbeit hervor.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Nach ihm
  rationale: Die Wendung bezeichnet in der Bauliste sowohl die Abfolge als auch die räumliche Fortsetzung der Arbeiten.
- source_word: הֶחֱרָה הֶחֱזִיק
  choice: besserte … mit besonderem Eifer … aus
  rationale: הֶחֱזִיק bezeichnet in Nehemia 3 das Ausbessern beziehungsweise Befestigen der Mauer; das ungewöhnlich vorangestellte הֶחֱרָה hebt offenbar den leidenschaftlichen Einsatz Baruchs hervor.
- source_word: בָּרוּךְ בֶּן זבי
  choice: Baruch, der Sohn Sabbais
  rationale: Die Eigennamen werden in einer im Deutschen gebräuchlichen biblischen Form wiedergegeben; die abweichende Namenstradition wird in einer Fußnote bewahrt.
- source_word: מִדָּה שֵׁנִית
  choice: einen zweiten Abschnitt der Mauer
  rationale: Im Zusammenhang bezeichnet die Wendung ein weiteres zugeteiltes Mauerstück, nicht ein abstraktes Maß. „der Mauer“ wird zur natürlichen und eindeutigen Bezugnahme ergänzt.
- source_word: מִן הַמִּקְצוֹעַ
  choice: vom Mauervorsprung
  rationale: מִקְצוֹעַ kann eine Ecke, einen Winkel oder eine Biegung bezeichnen. Im Zusammenhang der Anlage bei Eljaschibs Haus ist „Mauervorsprung“ eine anschauliche architektonische Wiedergabe, ohne die genaue Form festzulegen.
- source_word: עַד פֶּתַח בֵּית
  choice: bis zum Eingang des Hauses
  rationale: פֶּתַח bezeichnet den Eingang oder die Türöffnung; בֵּית meint hier wahrscheinlich das Wohnhaus oder den zugehörigen Gebäudekomplex.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן הַגָּדוֹל
  choice: des Hohen Priesters Eljaschib
  rationale: „Hoher Priester“ ist die etablierte deutsche Amtsbezeichnung; die deutsche Wortstellung ist natürlicher als eine streng formale Nachbildung.
