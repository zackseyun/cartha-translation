  text: Next to them Jedaiah son of Harumaph made repairs opposite his house[a], and next to him Hattush son of Hashabneiah made repairs.
translation:
  language: de
  text: Neben ihnen nahm Jedaja, der Sohn Harumafs, gegenüber seinem Haus Ausbesserungen vor; und neben ihm nahm Hattusch, der Sohn Haschabnejas, Ausbesserungen vor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: vor seinem Haus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Neben ihnen
  rationale: Die Wendung עַל יָד bezeichnet in der Bauliste von Nehemia 3 die räumliche Nachbarschaft der Arbeitsabschnitte. „Neben ihnen“ gibt den topografischen und fortlaufenden Sinn natürlich wieder.
- source_word: הֶחֱזִיק
  choice: besserte … die Mauer aus
  rationale: Der Hifil von חזק ist hier eine feste Wendung für die Beteiligung an den Ausbesserungsarbeiten. Das im Hebräischen implizite Objekt „die Mauer“ wird zur natürlichen Verständlichkeit ergänzt.
- source_word: יְדָיָה בֶן חֲרוּמַף
  choice: Jedaja, der Sohn Harumafs
  rationale: Die Personennamen werden nach geläufiger deutscher Bibeltradition transliteriert; die Abstammungsangabe wird unmittelbar wiedergegeben.
- source_word: וְנֶגֶד בֵּיתוֹ
  choice: gegenüber seinem Haus
  rationale: נֶגֶד bezeichnet einen Bereich vor beziehungsweise gegenüber einem Bezugspunkt. „Gegenüber“ bewahrt die räumliche Aussage, ohne sie genauer festzulegen als der Ausgangstext.
- source_word: וְעַל יָדוֹ
  choice: und neben ihm
  rationale: Dieselbe Nachbarschaftsformel steht nun mit singularischem Suffix und bezieht sich auf Jedaja. Die Wiederholung bildet die Struktur des hebräischen Textes ab.
- source_word: חַטּוּשׁ בֶּן חֲשַׁבְנְיָה
  choice: Hattusch, der Sohn Haschabnejas
  rationale: Die Personennamen werden nach geläufiger deutscher Bibeltradition transliteriert; die Abstammungsangabe wird unmittelbar wiedergegeben.
