  text: וַ/יְחַזֵּ֨ק עַל יָד֜/וֹ עֵ֧זֶר בֶּן יֵשׁ֛וּעַ שַׂ֥ר הַ/מִּצְפָּ֖ה מִדָּ֣ה שֵׁנִ֑ית מִ/נֶּ֕גֶד עֲלֹ֥ת הַ/נֶּ֖שֶׁק הַ/מִּקְצֹֽעַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/019.yaml
  text: Next to him Ezer son of Jeshua[a], official of Mizpah[c][b], repaired another section opposite the ascent to the armory at the angle.
translation:
  language: de
  text: Neben ihm besserte Eser, der Sohn Jeschuas, der Vorsteher von Mizpa, einen weiteren Abschnitt[a] aus, gegenüber dem Aufgang zum Waffenlager[b] am Winkel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen zweiten Abschnitt“. Die hebräische Wendung kann hervorheben, dass Eser einen zusätzlichen Teil der Mauer ausbesserte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zum Waffenarsenal“ beziehungsweise „zu den Waffen“. Das hebräische Wort bezeichnet Waffen und bezieht sich hier wahrscheinlich auf einen Ort, an dem sie aufbewahrt wurden.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „an der Ecke“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: besserte … aus
  rationale: Das Verb bedeutet grundsätzlich „stärken“, bezeichnet in Nehemia 3 jedoch idiomatisch die Ausbesserung beziehungsweise Wiederherstellung der Mauer.
- source_word: עַל יָדוֹ
  choice: Neben ihm
  rationale: Die wiederkehrende Wendung kennzeichnet in diesem Kapitel den unmittelbar anschließenden Arbeitsbereich.
- source_word: שַׂר הַמִּצְפָּה
  choice: der Vorsteher von Mizpa
  rationale: שַׂר bezeichnet hier einen leitenden Amtsträger; „Vorsteher“ gibt die zivile Führungsfunktion wieder, ohne ein Königtum anzudeuten.
- source_word: מִדָּה שֵׁנִית
  choice: einen weiteren Abschnitt
  rationale: Die Wendung bezeichnet im Bauzusammenhang wahrscheinlich einen zusätzlichen Mauerabschnitt. Die mögliche wörtlichere Bedeutung „einen zweiten Abschnitt“ bleibt in der Fußnote erhalten.
- source_word: מִנֶּגֶד
  choice: gegenüber
  rationale: Die Präposition beschreibt eine Lage vor beziehungsweise gegenüber einem topografischen Bezugspunkt.
- source_word: עֲלֹת
  choice: dem Aufgang zum
  rationale: Der substantivisch gebrauchte Infinitiv von עלה bezeichnet hier einen ansteigenden Zugang.
- source_word: הַנֶּשֶׁק
  choice: Waffenlager
  rationale: Das Wort bezeichnet Waffen oder Bewaffnung; in dieser topografischen Verbindung liegt ein Ort zur Aufbewahrung von Waffen nahe.
- source_word: הַמִּקְצֹעַ
  choice: am Winkel
  rationale: Der Ausdruck bezeichnet eine Ecke oder winkelförmige Biegung und wird hier als architektonisch-topografische Angabe verstanden.
