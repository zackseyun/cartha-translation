source:
  edition: WLC
  text: אַחֲרָ֤י/ו הֶחֱזִיק֙ נְחֶמְיָ֣ה בֶן עַזְבּ֔וּק שַׂ֕ר חֲצִ֖י פֶּ֣לֶךְ בֵּֽית צ֑וּר עַד נֶ֨גֶד֙ קִבְרֵ֣י דָוִ֔יד וְ/עַד הַ/בְּרֵכָה֙ הָ/עֲשׂוּיָ֔ה וְ/עַ֖ד בֵּ֥ית הַ/גִּבֹּרִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/016.yaml
  text: After him Nehemiah son of Azbuk[a], ruler of half the district of Beth-zur, made repairs as far as opposite the tombs of David, and as far as the pool that was made[b], and as far as the house of the mighty men.
translation:
  language: de
  text: Nach ihm[a] nahm Nehemia, der Sohn Asbuks, der Vorsteher des halben Bezirks von Bet-Zur, Ausbesserungsarbeiten vor bis gegenüber den Gräbern Davids, bis zum angelegten Teich und bis zum Haus der Helden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Neben ihm“, wenn die Wendung räumlich und nicht als Abfolge innerhalb der Liste verstanden wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Haus der Krieger“. Der hebräische Ausdruck kann ein militärisch genutztes Gebäude bezeichnen; die genaue Identifizierung ist jedoch unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Nach ihm
  rationale: Die Wendung kennzeichnet in der Liste gewöhnlich die Abfolge der Arbeiter beziehungsweise Bauabschnitte; zugleich bleibt eine räumliche Deutung möglich und wird in der Fußnote genannt.
- source_word: הֶחֱזִיק
  choice: führte … die Ausbesserungsarbeiten weiter
  rationale: Der Hifil von חזק ist in Nehemia 3 eine feste Wendung für das Ausbessern beziehungsweise Wiederherstellen der Mauer. Die gewählte Formulierung klingt im Deutschen natürlich und passt zur fortlaufenden Bauliste.
- source_word: שַׂר חֲצִי פֶּלֶךְ
  choice: Vorsteher des halben Bezirks
  rationale: שַׂר bezeichnet hier einen leitenden Amtsträger, פֶּלֶךְ einen Verwaltungsbezirk der persischen Zeit. „Bezirk“ vermeidet die zu großräumige Bezeichnung „Provinz“.
- source_word: בֵּית צוּר
  choice: Bet-Zur
  rationale: Der Ortsname wird nach gebräuchlicher deutscher Umschrift wiedergegeben und nicht übersetzt.
- source_word: עַד נֶגֶד קִבְרֵי דָוִיד
  choice: bis zu der Stelle gegenüber den Gräbern Davids
  rationale: נֶגֶד bezeichnet eine gegenüberliegende oder davor befindliche Lage. „Zu der Stelle gegenüber“ gibt die räumliche Beziehung klar wieder, ohne anzudeuten, die Arbeiten hätten die Gräber selbst erreicht.
- source_word: הַבְּרֵכָה הָעֲשׂוּיָה
  choice: der angelegte Teich
  rationale: Die wörtliche Bedeutung ist „der gemachte Teich“. „Angelegt“ bewahrt den Hinweis auf eine künstlich geschaffene Wasseranlage, ohne deren Bauweise näher festzulegen.
- source_word: בֵּית הַגִּבֹּרִים
  choice: Haus der Helden
  rationale: גִּבֹּרִים kann „Helden“, „starke Männer“ oder „Krieger“ bezeichnen. Die relativ formnahe Wiedergabe vermeidet die nicht gesicherte Festlegung auf eine Kaserne.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der wiederholenden Aufzählung des Hebräischen, wird aber durch „führte … weiter“ und „zu der Stelle“ idiomatisch geglättet. Die Fußnotenmarker stehen bei den tatsächlich erläuterten Wendungen.
