  text: אחר/י הֶחֱזִ֜יק חֲנַנְיָ֣ה בֶן שֶׁלֶמְיָ֗ה וְ/חָנ֧וּן בֶּן צָלָ֛ף הַ/שִּׁשִּׁ֖י מִדָּ֣ה שֵׁנִ֑י אַחֲרָ֣י/ו הֶחֱזִ֗יק מְשֻׁלָּם֙ בֶּן בֶּ֣רֶכְיָ֔ה נֶ֖גֶד נִשְׁכָּתֽ/וֹ־־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/030.yaml
  text: After him Hananiah son of Shelemiah and Hanun the sixth son of Zalaph repaired another section[b][a]. After him Meshullam son of Berechiah repaired opposite his chamber.
translation:
  language: de
  text: Nach ihm besserten Hananja, der Sohn Schelemjas, und Hanun, der sechste Sohn Zalafs, einen weiteren Abschnitt aus.[a][b] Nach ihm besserte Meschullam, der Sohn Berechjas, gegenüber seiner Kammer aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einen zweiten Abschnitt« oder »eine zweite Strecke«; in Nehemia 3 bezeichnet die Wendung einen zusätzlichen Abschnitt, der ausgebessert wurde.'
    reason: lexical_alternative
  - marker: b
    text: Der überlieferte Konsonantentext lautet beim ersten Satzanfang »Nach mir«; die traditionelle Lesung und die wiederkehrende Formel dieses Kapitels ergeben »Nach ihm«.
    reason: textual_variant
lexical_decisions:
- source_word: אַחֲרַי / אַחֲרָיו
  choice: Nach ihm
  rationale: Die wiederkehrende Formel in Nehemia 3 bezeichnet die räumliche beziehungsweise fortlaufende Abfolge der Arbeitsabschnitte. Beim ersten Vorkommen weist der überlieferte Konsonantentext zwar auf »nach mir«, doch der Kontext und die traditionelle Lesung stützen »nach ihm«; die Abweichung wird in einer Fußnote offengelegt.
- source_word: הֶחֱזִיק
  choice: besserte ... aus
  rationale: Im Kontext des Mauerbaus bezeichnet das Verb die Ausbesserungs- und Wiederherstellungsarbeit. »Ausbessern« ist im Deutschen natürlich und lässt sich beim zweiten Vorkommen ohne ein im Hebräischen nicht wiederholtes Objekt verwenden.
- source_word: הַשִּׁשִּׁי
  choice: der sechste Sohn
  rationale: Der Ordinalausdruck steht elliptisch nach »Hanun, Sohn Zalafs« und wird am natürlichsten als dessen Stellung unter Zalafs Söhnen verstanden. »Sohn« wird zur deutschen Verständlichkeit ergänzt.
- source_word: מִדָּה שֵׁנִי
  choice: einen weiteren Abschnitt
  rationale: Wörtlich steht »ein zweites Maß/eine zweite Strecke«. Innerhalb der Bauliste bezeichnet die Wendung einen zusätzlichen zugewiesenen Mauerabschnitt; »weiterer Abschnitt« gibt diese Funktion idiomatisch wieder.
- source_word: נֶגֶד
  choice: gegenüber
  rationale: Die Präposition kennzeichnet die Lage vor oder gegenüber einem Bezugspunkt; »gegenüber« bewahrt die topografische Aussage knapp.
- source_word: נִשְׁכָּתוֹ
  choice: seiner Kammer
  rationale: Das Substantiv bezeichnet einen Raum oder eine Kammer, ohne deren konkrete Wohn-, Amts- oder Kultfunktion festzulegen. »Kammer« wahrt diese Offenheit und den architektonischen Ton.
- source_word: חֲנַנְיָה / שֶׁלֶמְיָה / חָנוּן / צָלָף / מְשֻׁלָּם / בֶּרֶכְיָה
  choice: Hananja / Schelemja / Hanun / Zalaf / Meschullam / Berechja
  rationale: Die Personennamen werden in einer geläufigen deutsch-biblischen Transliteration wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der listenartigen Wiederholungsform des Hebräischen. »Kammer« bleibt bewusst funktional unbestimmt; die textliche Spannung bei אַחֲרַי wird nicht stillschweigend beseitigt, sondern durch Fußnote [b] dokumentiert.
