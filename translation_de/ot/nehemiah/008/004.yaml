source:
  edition: WLC
  text: וַֽ/יַּעֲמֹ֞ד עֶזְרָ֣א הַ/סֹּפֵ֗ר עַֽל מִגְדַּל עֵץ֮ אֲשֶׁ֣ר עָשׂ֣וּ לַ/דָּבָר֒ וַ/יַּֽעֲמֹ֣ד אֶצְל֡/וֹ מַתִּתְיָ֡ה וְ/שֶׁ֡מַע וַ֠/עֲנָיָה וְ/אוּרִיָּ֧ה וְ/חִלְקִיָּ֛ה וּ/מַעֲשֵׂיָ֖ה עַל יְמִינ֑/וֹ וּ/מִ/שְּׂמֹאל֗/וֹ פְּ֠דָיָה וּ/מִֽישָׁאֵ֧ל וּ/מַלְכִּיָּ֛ה וְ/חָשֻׁ֥ם וְ/חַשְׁבַּדָּ֖נָה זְכַרְיָ֥ה מְשֻׁלָּֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/004.yaml
  text: Ezra the scribe stood on a wooden platform that they had made for the purpose[a], and beside him stood Mattithiah, Shema, Anaiah, Uriah, Hilkiah, and Maaseiah on his right hand, and Pedaiah, Mishael, Malchijah, Hashum, Hashbaddanah, Zechariah[b], and Meshullam on his left hand.
translation:
  language: de
  text: Esra, der Schriftgelehrte, stand auf einem hölzernen Podest[a], das man zu diesem Zweck[b] errichtet hatte. Neben ihm standen zu seiner Rechten Mattitja, Schema, Anaja, Uria, Hilkija und Maaseja und zu seiner Linken Pedaja, Mischaël, Malkija, Haschum, Haschbaddana, Sacharja und Meschullam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf einem Turm aus Holz“; gemeint ist eine erhöhte Holzkonstruktion oder ein Podest.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „für diese Angelegenheit“ oder „für diesen Anlass“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֵץ
  choice: hölzernes Podest
  rationale: Wörtlich bezeichnet der Ausdruck einen „Turm aus Holz“. Im Zusammenhang der öffentlichen Lesung ist eine erhöhte Holzkonstruktion gemeint; „Podest“ gibt deren Funktion in natürlichem Deutsch wieder, ohne die wörtliche Bildsprache ganz unkenntlich zu machen.
- source_word: לַדָּבָר
  choice: zu diesem Zweck
  rationale: דָּבָר kann „Wort“, „Sache“, „Angelegenheit“ oder „Ereignis“ bedeuten. Hier verweist der Ausdruck auf den Zweck, zu dem die Konstruktion errichtet worden war.
- source_word: הַסֹּפֵר
  choice: der Schriftgelehrte
  rationale: סֹפֵר bezeichnet hier Esras schriftkundige, mit dem Gesetz verbundene Aufgabe. „Schriftgelehrte“ ist im Deutschen verständlich und entspricht dem Kontext besser als das heute leicht missverständliche „Schreiber“.
- source_word: אֶצְלוֹ
  choice: neben ihm
  rationale: Die Präposition bezeichnet räumliche Nähe und leitet die Aufzählung der Männer an Esras beiden Seiten ein.
- source_word: עַל יְמִינוֹ / וּמִשְּׂמֹאלוֹ
  choice: zu seiner Rechten / zu seiner Linken
  rationale: Die geläufige deutsche Richtungsformel bewahrt die parallele Anordnung der beiden Gruppen.
- source_word: וַיַּעֲמֹד
  choice: stand / standen
  rationale: Die Erzählform von עמד bezeichnet das Stehen beziehungsweise Sich-Aufstellen. Die Wiederholung des Verbs wird im Deutschen durch „stand“ und „standen“ wiedergegeben.
theological_decisions: []
