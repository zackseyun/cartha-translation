base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/010.yaml
  text: Then he said to them[a], “Go, eat rich food and drink sweet drinks, and send portions to anyone for whom nothing is prepared, for this day is holy to our Lord. And do not be grieved[c][b], for the joy of Yahweh is your stronghold.”
translation:
  language: de
  text: 'Dann sagte er zu ihnen: „Geht, esst üppige Speisen und trinkt süße Getränke und schickt denen, für die nichts vorbereitet ist[a], Portionen. Denn dieser Tag ist unserem Herrn heilig. Seid nicht traurig, denn die Freude Jahwes ist eure Festung[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dem, für den nichts vorbereitet ist“.'
    reason: Die hebräische Wendung steht im Singular und lässt offen, ob vor allem fehlende eigene Festvorbereitungen oder allgemein fehlende bereitgestellte Speisen gemeint sind.
  - marker: b
    text: „Die Freude Jahwes“ kann auch als „die Freude an Jahwe“ verstanden werden.
    reason: Die hebräische Genitivverbindung lässt das genaue Verhältnis zwischen Freude und Jahwe offen.
lexical_decisions:
- source_word: מַשְׁמַנִּים
  choice: üppige Speisen
  rationale: Das Wort bezeichnet wörtlich fette beziehungsweise gehaltvolle Dinge und meint hier festliche, reichhaltige Speisen.
- source_word: מַמְתַקִּים
  choice: süße Getränke
  rationale: In Verbindung mit dem Verb „trinken“ sind süße Getränke gemeint; die Wiedergabe vermeidet die unnötige Verengung auf Wein.
- source_word: מָנוֹת
  choice: Anteile
  rationale: Im Zusammenhang des Festmahls bezeichnet das Wort zugeteilte Portionen; „Anteile“ bringt zugleich den Gedanken des Teilens natürlich zum Ausdruck.
- source_word: לְאֵין נָכוֹן לוֹ
  choice: denen, für die nichts vorbereitet ist
  rationale: Die unpersönliche Formulierung folgt dem Hebräischen eng und bezeichnet Menschen, die keine Festgabe bereitliegen haben.
- source_word: קָדוֹשׁ
  choice: heilig
  rationale: „Heilig“ ist die sachgemäße und theologisch gewichtige Wiedergabe eines für Gott ausgesonderten Tages.
- source_word: לַאֲדֹנֵינוּ
  choice: unserem Herrn
  rationale: אדון ist hier eine ehrfürchtige Gottesbezeichnung; „Herr“ bewahrt den Titel und passt zum kultischen Zusammenhang.
- source_word: תֵּעָצֵבוּ
  choice: seid nicht bekümmert
  rationale: Das Verb beschreibt Schmerz, Trauer oder Niedergeschlagenheit. „Bekümmert“ ist würdig, verständlich und kontextgerecht.
- source_word: חֶדְוַת יְהוָה
  choice: die Freude Jahwes
  rationale: Die formale Genitivverbindung bleibt erhalten, ohne festzulegen, ob Jahwes eigene Freude oder Freude an beziehungsweise in Jahwe gemeint ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „HERR“ ersetzt.
- source_word: מָעֻזְּכֶם
  choice: eure Zuflucht
  rationale: Das Substantiv bezeichnet einen Schutz- oder Stärkeort. „Zuflucht“ erhält die konkrete Schutzmetapher und klingt im Deutschen natürlich.
theological_decisions:
- issue: Bedeutung von חֶדְוַת יְהוָה
  choice: die Freude Jahwes
  alternative: die Freude an Jahwe; Jahwes eigene Freude
  rationale: Der hebräische Genitiv ist mehrdeutig. Der Haupttext bewahrt diese Spannung, statt das Verhältnis ausdrücklich als menschliche Freude an Gott oder als Gottes eigene Freude auszulegen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Seine Wiedergabe als „Jahwe“ unterscheidet ihn vom unmittelbar zuvor stehenden Gottestitel „unser Herr“.
- issue: Metapher מָעוֹז
  choice: Zuflucht
  alternative: Stärke; Festung
  rationale: „Zuflucht“ bewahrt den Gedanken eines schützenden Stärkeortes, ohne die Aussage auf bloße innere Kraft zu reduzieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Aufforderungen und vertrauter biblischer Wortschatz sorgen für gute Verständlichkeit; die Mehrdeutigkeit der abschließenden Begründung bleibt erhalten.
