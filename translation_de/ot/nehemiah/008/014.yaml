  text: וַֽ/יִּמְצְא֖וּ כָּת֣וּב בַּ/תּוֹרָ֑ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה אֲשֶׁר֩ יֵשְׁב֨וּ בְנֵֽי יִשְׂרָאֵ֧ל בַּ/סֻּכּ֛וֹת בֶּ/חָ֖ג בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/014.yaml
  text: And they found it written in the Law that Yahweh had commanded through Moses that the sons of Israel should dwell in booths during the feast[a], in the seventh month.
translation:
  language: de
  text: Und sie fanden im Gesetz geschrieben, dass Jahwe durch Mose geboten hatte, dass die Söhne Israels[a] während des Festes im siebten Monat in Laubhütten wohnen sollten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“ oder „die Kinder Israels“; wörtlich: „die Söhne Israels“.'
    reason: Lexikalische Alternative und Erläuterung der kollektiven hebräischen Wendung.
lexical_decisions:
- source_word: וַיִּמְצְאוּ כָּתוּב
  choice: sie fanden … geschrieben
  rationale: Die Verbindung aus מצא und dem passiven Partizip כָּתוּב wird nah an der hebräischen Konstruktion und zugleich verständlich wiedergegeben.
- source_word: בַּתּוֹרָה
  choice: im Gesetz
  rationale: תּוֹרָה bezeichnet hier die schriftlich vorliegende Weisung des Mose; „Gesetz“ ist im Deutschen die geläufige kontextuelle Wiedergabe.
- source_word: צִוָּה יְהוָה
  choice: Jahwe … geboten hatte
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. Das Plusquamperfekt verdeutlicht, dass das zuvor erteilte Gebot nun im Gesetz gefunden wurde.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Die Wendung „durch die Hand Moses“ bezeichnet Vermittlung; „durch Mose“ gibt die Funktion natürlich und präzise wieder.
- source_word: יֵשְׁבוּ
  choice: sollten … wohnen
  rationale: ישב bezeichnet hier den zeitweiligen Aufenthalt in den für das Fest errichteten Hütten; „wohnen“ bewahrt den konkreten Sinn.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formale Wiedergabe erhält die ausdrückliche hebräische Bezeichnung, die hier kollektiv für das Volk Israel steht.
- source_word: בַּסֻּכּוֹת
  choice: in Laubhütten
  rationale: סֻכּוֹת sind die provisorischen Hütten des Festes. „Laubhütten“ ist die etablierte, anschauliche deutsche Bezeichnung.
- source_word: בֶּחָג
  choice: während des Festes
  rationale: Der bestimmte Ausdruck verweist auf das im Zusammenhang bekannte Fest; „während“ gibt den zeitlichen Gebrauch der Präposition wieder.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: im siebten Monat
  rationale: Dies ist die direkte und natürliche Wiedergabe der Zeitangabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Kollektive Bedeutung von בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten; die Kinder Israels
  rationale: Die wörtliche Form bleibt im Haupttext erhalten, ohne auszuschließen, dass der Ausdruck das Volk Israel als Ganzes bezeichnet; diese kollektive Bedeutung wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt die Abfolge von Fund, schriftlichem Gebot und dessen Inhalt, ohne die Bezeichnung des Festes über den hebräischen Wortlaut hinaus ausdrücklich als Laubhüttenfest zu ergänzen.
