  text: וְ/הַ/לְוִיִּ֞ם מַחְשִׁ֤ים לְ/כָל הָ/עָם֙ לֵ/אמֹ֣ר הַ֔סּוּ כִּ֥י הַ/יּ֖וֹם קָדֹ֑שׁ וְ/אַל תֵּעָצֵֽבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/011.yaml
  text: And the Levites were quieting all the people[a], saying, “Be still, for the day is holy[b]; do not be grieved.”
translation:
  language: de
  text: 'Und die Leviten brachten das ganze Volk zur Ruhe[a] und sagten: »Seid still, denn dieser Tag ist heilig; seid nicht betrübt[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »brachten das ganze Volk zum Schweigen«; auch möglich: »beruhigten das ganze Volk«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »trauert nicht« oder »seid nicht traurig«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Und die Leviten
  rationale: Die etablierte deutsche Gruppenbezeichnung gibt die kultisch dienende Gruppe präzise und natürlich wieder.
- source_word: מַחְשִׁים
  choice: brachten … zur Ruhe
  rationale: Das Partizip beschreibt ein andauerndes Bemühen, das versammelte Volk still werden zu lassen. Die Formulierung verbindet den Gedanken des Beruhigens mit dem unmittelbar folgenden Ruf zur Stille.
- source_word: לְכָל הָעָם
  choice: das ganze Volk
  rationale: עָם bezeichnet hier die versammelte Bevölkerung; כָל wird im Deutschen idiomatisch durch „das ganze“ wiedergegeben.
- source_word: לֵאמֹר
  choice: und sagten
  rationale: Der hebräische Infinitiv leitet die direkte Rede ein; im Deutschen ist eine finite Form hier flüssig und eindeutig.
- source_word: הַסּוּ
  choice: Seid still
  rationale: Der Imperativ fordert die Menge unmittelbar zu Ruhe und Schweigen auf, ohne unnötig schroff zu klingen.
- source_word: כִּי הַיּוֹם קָדֹשׁ
  choice: denn dieser Tag ist heilig
  rationale: כִּי begründet die Aufforderung. „Dieser Tag“ bezeichnet im Deutschen natürlich den gegenwärtigen Festtag, während „heilig“ das theologische Gewicht von קָדֹשׁ bewahrt.
- source_word: וְאַל תֵּעָצֵבוּ
  choice: seid nicht betrübt
  rationale: Die Form bezeichnet Trauer, Schmerz oder Betrübnis. „Betrübt“ lässt offen, ob allgemeine Traurigkeit oder stärkeres Trauern gemeint ist.
theological_decisions:
- issue: Wiedergabe von קָדֹשׁ für den besonderen Charakter des Tages
  choice: heilig
  alternative: geheiligt; heilig bestimmt
  rationale: „Heilig“ bewahrt die Aussage, dass der Tag Gott zugeordnet und ausgesondert ist, ohne diese knappe Aussage interpretierend auszuweiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und feierlich, ohne altertümliche Formen. Die Wiederholung des Ruhegedankens im Erzählteil und im Imperativ entspricht der hebräischen Gestaltung.
