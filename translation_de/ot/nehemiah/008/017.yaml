source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֣וּ כָֽל הַ֠/קָּהָל הַ/שָּׁבִ֨ים מִן הַ/שְּׁבִ֥י סֻכּוֹת֮ וַ/יֵּשְׁב֣וּ בַ/סֻּכּוֹת֒ כִּ֣י לֹֽא עָשׂ֡וּ מִ/ימֵי֩ יֵשׁ֨וּעַ בִּן נ֥וּן כֵּן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/ה֑וּא וַ/תְּהִ֥י שִׂמְחָ֖ה גְּדוֹלָ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/017.yaml
  text: And all the assembly of those who had returned from the captivity made booths and lived in the booths[a], for the sons of Israel had not done so from the days of Jeshua son of Nun until that day. And there was very great rejoicing.
translation:
  language: de
  text: Die ganze Versammlung derer, die aus der Gefangenschaft zurückgekehrt waren, baute Laubhütten und wohnte in ihnen. Denn seit den Tagen Jeschuas[a], des Sohnes Nuns, hatten die Söhne Israels es bis zu jenem Tag nicht so gemacht. Und es herrschte sehr große Freude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jeschua, der Sohn Nuns, ist Josua, der Sohn Nuns.
    reason: Die Fußnote identifiziert die hier verwendete hebräische Namensform יֵשׁוּעַ mit der im Deutschen geläufigen Form Josua.
lexical_decisions:
- source_word: הַקָּהָל
  choice: die ganze Versammlung
  rationale: קָהָל bezeichnet die versammelte Gemeinschaft. „Versammlung“ bewahrt diesen gemeinschaftlichen Sinn, ohne unnötig kirchlich zu klingen.
- source_word: הַשָּׁבִים מִן הַשְּׁבִי
  choice: derer, die aus der Gefangenschaft zurückgekehrt waren
  rationale: Die partizipiale Wendung bezeichnet die zurückgekehrte Gemeinschaft. „Aus der Gefangenschaft“ gibt die hebräische Formulierung eng wieder; „aus dem Exil“ wäre möglich, aber stärker deutend.
- source_word: סֻכּוֹת
  choice: Laubhütten
  rationale: Das Wort bezeichnet die provisorischen Hütten des Laubhüttenfestes. „Laubhütten“ ist im Deutschen die geläufige und kontextuell klare Bezeichnung.
- source_word: וַיֵּשְׁבוּ בַסֻּכּוֹת
  choice: und wohnte darin
  rationale: יָשַׁב kann „sitzen“, „wohnen“ oder „bleiben“ bedeuten. Hier verlangt die Festpraxis den Sinn „wohnen“; „darin“ vermeidet eine schwerfällige Wiederholung von „Laubhütten“.
- source_word: כִּי לֹא עָשׂוּ ... כֵּן
  choice: Denn ... hatten ... es ... nicht so gemacht
  rationale: Die knappe Wendung verweist auf die unmittelbar beschriebene Art der Durchführung. Sie behauptet nicht ausdrücklich, das Fest sei während des gesamten Zeitraums überhaupt nie begangen worden.
- source_word: מִימֵי יֵשׁוּעַ בִּן נוּן
  choice: seit den Tagen Jeschuas, des Sohnes Nuns
  rationale: „Seit den Tagen“ gibt den zeitlichen Ausgangspunkt natürlich wieder. Die Namensform יֵשׁוּעַ wird als „Jeschua“ abgebildet; die geläufige Identifizierung mit Josua steht in der Fußnote.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die wörtliche, im biblischen Sprachgebrauch verständliche Bundes- und Volksbezeichnung bewahrt die grammatisch maskuline Form des Hebräischen.
- source_word: וַתְּהִי שִׂמְחָה גְּדוֹלָה מְאֹד
  choice: Und es herrschte sehr große Freude
  rationale: „Freude“ gibt שִׂמְחָה natürlich wieder; „sehr große“ entspricht גְּדוֹלָה מְאֹד. „Es herrschte“ vermittelt idiomatisch die gemeinschaftliche Festfreude.
theological_decisions:
- issue: Aussage über die frühere Begehung des Festes
  choice: es ... nicht so gemacht
  alternative: das Fest nicht gefeiert
  rationale: כֵּן („so“) bezieht sich auf die beschriebene Durchführung. Die Übersetzung bewahrt die mögliche Spannung zu anderen Berichten über frühere Festfeiern und löst sie nicht durch eine pauschale Aussage über völlige Nichtbeachtung auf.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten / das Volk Israel
  rationale: Die hebräische Wendung ist grammatisch maskulin und dient als traditionelle Bezeichnung des Bundesvolkes. Die Hauptübersetzung bewahrt diese Form, statt sie stillschweigend zu neutralisieren.
- issue: Identität von יֵשׁוּעַ בִּן נוּן
  choice: Jeschua, der Sohn Nuns
  alternative: Josua, der Sohn Nuns
  rationale: Der masoretische Text bietet hier die Form יֵשׁוּעַ. Die Hauptübersetzung bildet diese Form ab; die im Deutschen vertraute Namensform „Josua“ wird zur eindeutigen Identifizierung in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Laubhütten“ ist die allgemein verständliche deutsche Festbezeichnung. Der Satzbau bleibt nahe an der hebräischen Abfolge, wird aber durch „darin“ und die deutsche Tempusführung natürlich gestaltet.
