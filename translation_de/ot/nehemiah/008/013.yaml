base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/013.yaml
  text: And on the second day[a], the heads of the fathers’ houses of all the people, the priests, and the Levites gathered to Ezra the scribe to gain insight into the words of the law.
translation:
  language: de
  text: Und am zweiten Tag versammelten sich die Oberhäupter der Sippen[a] des ganzen Volkes, die Priester und die Leviten zu Esra, dem Schriftgelehrten, um Einsicht in die Worte des Gesetzes zu gewinnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Oberhäupter der Vaterhäuser“; gemeint sind die Leiter von Sippen oder Großfamilien.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: Und am zweiten Tag
  rationale: Bewahrt sowohl die zeitliche Angabe als auch die durch וּ ausgedrückte Verknüpfung mit dem vorhergehenden Geschehen.
- source_word: נֶאֶסְפוּ
  choice: versammelten sich
  rationale: Das Nifal wird hier natürlich intransitiv verstanden und bezeichnet das Zusammenkommen der genannten Gruppen.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: die Oberhäupter der Sippen
  rationale: Die Wendung bezeichnet die führenden Vertreter väterlicher Abstammungs- beziehungsweise Großfamilienverbände. „Sippenoberhäupter“ wäre ebenfalls möglich; die gewählte Form ist klar und würdevoll.
- source_word: לְכָל הָעָם
  choice: des ganzen Volkes
  rationale: Die Präpositionalphrase gehört zu den Sippenoberhäuptern und zeigt, dass diese das gesamte Volk repräsentierten.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: die Priester und die Leviten
  rationale: Gibt die beiden zusätzlich genannten Gruppen direkt und in der im Hebräischen vorliegenden Reihenfolge wieder.
- source_word: אֶל עֶזְרָא הַסֹּפֵר
  choice: bei dem Schriftgelehrten Esra
  rationale: אֶל bezeichnet hier das Zusammenkommen zu Esra hin. „Schriftgelehrter“ gibt Esras anerkannte Funktion als kundiger Ausleger und Schreiber des Gesetzes im Deutschen treffend wieder.
- source_word: וּלְהַשְׂכִּיל
  choice: um Einsicht … zu gewinnen
  rationale: Der Hifil-Infinitiv von שׂכל drückt hier den Zweck aus, verständige Einsicht zu erlangen, nicht nur Informationen aufzunehmen.
- source_word: אֶל דִּבְרֵי הַתּוֹרָה
  choice: in die Worte des Gesetzes
  rationale: אֶל richtet die angestrebte Einsicht auf den Wortlaut beziehungsweise Inhalt der Tora. „Gesetz“ passt zum erzählerischen Zusammenhang, in dem die Bundesweisung öffentlich gelesen und ausgelegt wird.
