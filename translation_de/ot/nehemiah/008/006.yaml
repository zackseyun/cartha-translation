source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ עֶזְרָ֔א אֶת יְהוָ֥ה הָ/אֱלֹהִ֖ים הַ/גָּד֑וֹל וַ/יַּֽעֲנ֨וּ כָל הָ/עָ֜ם אָמֵ֤ן אָמֵן֙ בְּ/מֹ֣עַל יְדֵי/הֶ֔ם וַ/יִּקְּד֧וּ וַ/יִּשְׁתַּחֲוֻּ֛ לַ/יהוָ֖ה אַפַּ֥יִם אָֽרְצָ/ה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/006.yaml
  text: And Ezra blessed Yahweh[a], the great God, and all the people answered, “Amen, Amen,” while lifting up their hands. Then they bowed down and worshiped Yahweh with their faces to the ground.
translation:
  language: de
  text: 'Und Esra pries Jahwe, den großen Gott. Das ganze Volk antwortete: »Amen, Amen!«[a] Dabei hoben sie die Hände empor. Dann verneigten sie sich und beteten Jahwe an, mit dem Gesicht zur Erde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Amen, Amen« – eine wiederholte liturgische Antwort der Zustimmung und Bekräftigung.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: pries
  rationale: ברך im Piel mit Gott als Objekt bezeichnet hier ein ehrendes Segnen beziehungsweise Preisen Gottes. »Pries« gibt den Sinn im heutigen Deutsch natürlicher und eindeutiger wieder als »segnete«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הָאֱלֹהִים הַגָּדוֹל
  choice: den großen Gott
  rationale: Die Apposition bezeichnet Jahwe als den großen Gott; die deutsche Form bewahrt Nachdruck und natürlichen Satzbau.
- source_word: וַיַּעֲנוּ
  choice: antwortete
  rationale: ענה leitet die gesprochene Antwort des Volkes ein. Beim kollektiven Subjekt »das ganze Volk« steht im Deutschen der Singular.
- source_word: אָמֵן אָמֵן
  choice: Amen, Amen!
  rationale: Die liturgische Bekräftigung wird transliteriert und ihre emphatische Wiederholung beibehalten.
- source_word: בְּמֹעַל יְדֵיהֶם
  choice: Dabei hoben sie die Hände empor
  rationale: Die Präpositionalfügung beschreibt eine begleitende Handlung. Die eigenständige deutsche Satzform stellt die Geste klar und flüssig dar.
- source_word: וַיִּקְּדוּ
  choice: verneigten sie sich
  rationale: קדד bezeichnet das tiefe Beugen des Körpers; »sich verneigen« hält diese Handlung von der folgenden Anbetung sprachlich unterscheidbar.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: beteten Jahwe an
  rationale: Das Verb bezeichnet hier die körperlich vollzogene Verehrung. »anbeten« bewahrt den kultischen Sinn, während die Körperhaltung durch die umgebenden Wendungen ausgedrückt wird.
- source_word: אַפַּיִם אָרְצָה
  choice: mit dem Gesicht zur Erde
  rationale: Die wörtlich auf Gesicht beziehungsweise Nasen und Erde bezogene Wendung beschreibt vollständige Niederwerfung; die gewählte Form ist im Deutschen klar und würdig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. »Jahwe« bewahrt ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von ברך gegenüber Gott
  choice: pries
  alternative: segnete
  rationale: Die Form kann formal mit »segnete« wiedergegeben werden, meint bei Gott als Objekt jedoch das ehrende Preisen. »Pries« verhindert im modernen Deutsch das Missverständnis, Esra habe Gott eine Segensgabe vermittelt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze folgen dem erzählerischen Ablauf; die traditionelle liturgische Formel »Amen« und der Gottesname »Jahwe« bleiben erhalten. Der Fußnotenmarker steht unmittelbar bei der erläuterten Formel.
