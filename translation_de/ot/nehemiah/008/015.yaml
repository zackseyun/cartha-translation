base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/015.yaml
  text: and that they should proclaim and spread the message through all their cities and in Jerusalem[a], saying, “Go out to the hill country and bring branches of olive, oil tree, myrtle, palm, and other leafy trees, to make booths[b], as it is written.”
translation:
  language: de
  text: 'und dass man in allen ihren Städten und in Jerusalem ausrufen und bekannt machen sollte: »Zieht hinaus ins Bergland und holt Zweige vom Olivenbaum, vom Ölbaum[a], von der Myrte, von der Palme und von dicht belaubten Bäumen, um Laubhütten zu bauen, wie es geschrieben steht.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Baumart des hebräischen Ausdrucks ist unsicher; möglich sind auch »wilder Ölbaum« oder »Ölweide«.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich heißt es bei den genannten Pflanzen jeweils »Blätter von«. Gemeint sind belaubte Zweige als Baumaterial für die Hütten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: und dass
  rationale: Setzt den in Vers 14 begonnenen Inhalt dessen fort, was im Gesetz geschrieben gefunden wurde, und bewahrt sowohl die Verknüpfung als auch den Inhaltssatz.
- source_word: יַשְׁמִיעוּ וְיַעֲבִירוּ קוֹל
  choice: ausrufen und bekannt machen
  rationale: Gibt sowohl das öffentliche Verkünden als auch das weite Verbreiten der Bekanntmachung in natürlichem Deutsch wieder.
- source_word: בְּכָל עָרֵיהֶם וּבִירוּשָׁלַם
  choice: in allen ihren Städten und in Jerusalem
  rationale: Entspricht der Ortsangabe und unterscheidet die übrigen Städte ausdrücklich von Jerusalem.
- source_word: צְאוּ הָהָר
  choice: Zieht hinaus ins Bergland
  rationale: הָהָר kann den Berg oder die gebirgige Landschaft bezeichnen; hier passt wegen des Sammelns verschiedener Zweige die geografische Kollektivbedeutung „Bergland“.
- source_word: עֲלֵי
  choice: Zweige
  rationale: Wörtlich steht „Blätter von“; als Material zum Bau der Hütten sind belaubte Zweige gemeint. „Zweige“ ist im Deutschen sachgerecht und natürlich.
- source_word: עֵץ שֶׁמֶן
  choice: Ölbaum
  rationale: Die wörtlich naheliegende Wiedergabe bewahrt die unsichere Pflanzenbezeichnung, ohne sie vorschnell mit einer bestimmten Art gleichzusetzen.
- source_word: עֵץ עָבֹת
  choice: dicht belaubte Bäume
  rationale: עָבֹת bezeichnet hier dichtes beziehungsweise üppiges Laub; die Formulierung vermeidet das im Hebräischen nicht ausdrücklich vorhandene „andere“.
- source_word: לַעֲשֹׂת סֻכֹּת
  choice: um Laubhütten zu bauen
  rationale: „Laubhütten“ ist die geläufige deutsche Bezeichnung der vorübergehenden Hütten dieses Festes; „bauen“ entspricht dem praktischen Vorgang idiomatischer als „machen“.
