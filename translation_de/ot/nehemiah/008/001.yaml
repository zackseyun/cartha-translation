source:
  edition: WLC
  text: וַ/יֵּאָסְפ֤וּ כָל הָ/עָם֙ כְּ/אִ֣ישׁ אֶחָ֔ד אֶל הָ֣/רְח֔וֹב אֲשֶׁ֖ר לִ/פְנֵ֣י שַֽׁעַר הַ/מָּ֑יִם וַ/יֹּֽאמְרוּ֙ לְ/עֶזְרָ֣א הַ/סֹּפֵ֔ר לְ/הָבִ֗יא אֶת סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/001.yaml
  text: And all the people gathered as one man at the square that was before the Water Gate[a], and they told Ezra the scribe to bring the Book of the Law of Moses, which Yahweh had commanded Israel.
translation:
  language: de
  text: Und das ganze Volk versammelte sich wie ein einziger Mann[a] auf dem Platz vor dem Wassertor. Sie sagten zu Esra, dem Schriftgelehrten, er solle das Buch der Weisung des Mose bringen, die Jahwe Israel geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie ein Mann“; eine hebräische Redewendung für einmütiges, geschlossenes Handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ כָל־הָעָם
  choice: das ganze Volk versammelte sich
  rationale: Das Nifal von אסף bezeichnet hier das Zusammenkommen der gesamten Volksgemeinschaft. Die deutsche Singularform folgt dem Kollektivsubjekt הָעָם und klingt natürlich.
- source_word: כְּאִישׁ אֶחָד
  choice: wie ein Mann
  rationale: Die wörtlich nachvollziehbare deutsche Wendung bewahrt das hebräische Bild und drückt geschlossenes, einmütiges Handeln aus.
- source_word: הָרְחוֹב
  choice: der Platz
  rationale: Das Wort bezeichnet hier eine offene öffentliche Fläche in der Stadt, nicht eine Straße im heutigen Sinn.
- source_word: לִפְנֵי שַׁעַר הַמָּיִם
  choice: vor dem Wassertor
  rationale: Dies gibt die Ortsangabe knapp und idiomatisch wieder.
- source_word: וַיֹּאמְרוּ לְעֶזְרָא ... לְהָבִיא
  choice: Sie sagten zu Esra ... er solle ... bringen
  rationale: Die Konstruktion wahrt das allgemeine 'sagen' von אמר und gibt den folgenden Infinitiv im Deutschen natürlich als Aufforderung wieder, ohne ausdrücklich Höflichkeit oder einen Befehl hinzuzufügen.
- source_word: הַסֹּפֵר
  choice: der Schriftgelehrte
  rationale: In diesem Zusammenhang bezeichnet der Titel Esra als kundigen Fachmann für die schriftlich überlieferte Weisung; 'Schriftgelehrter' ist die etablierte und verständliche deutsche Wiedergabe.
- source_word: סֵפֶר תּוֹרַת מֹשֶׁה
  choice: das Buch mit der Weisung des Mose
  rationale: סֵפֶר kann Buch beziehungsweise Schriftrolle bedeuten. תּוֹרָה umfasst hier Weisung und Gesetz; 'Weisung' vermeidet eine unnötige Verengung, während 'des Mose' die hebräische Genitivverbindung erhält.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־יִשְׂרָאֵל
  choice: die Jahwe Israel geboten hatte
  rationale: Das Relativpronomen bezieht sich grammatisch am natürlichsten auf תּוֹרַת מֹשֶׁה. צוה mit אֵת markiert Israel als Adressaten des Gebots; die deutsche Formulierung bewahrt die knappe Ausdrucksweise.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
theological_decisions:
- issue: Bezug des Relativsatzes אֲשֶׁר צִוָּה יְהוָה אֶת־יִשְׂרָאֵל
  choice: die Jahwe Israel geboten hatte
  alternative: das Jahwe Israel geboten hatte
  rationale: Das feminine אֲשֶׁר ist zwar formal unverändert, doch semantisch ist die von Jahwe gebotene Tora beziehungsweise Weisung der nächstliegende Bezug. Die Alternative könnte den Relativsatz auf das Buch als Gegenstand beziehen und dadurch nahelegen, das Buch selbst sei geboten worden.
- issue: Wiedergabe von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: '''Weisung'' bewahrt die größere Bedeutungsbreite von תּוֹרָה und schließt den gesetzlichen Inhalt ein, ohne ihn auf moderne Gesetzgebung zu verengen.'
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext bietet den persönlichen Gottesnamen; die Transliteration bewahrt diese Form und ersetzt sie nicht durch einen Titel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Das traditionelle Bild „wie ein Mann“ bleibt erhalten; eine Fußnote ist nicht nötig, da die Wendung im Deutschen verständlich ist. „Buch“ ist lesefreundlich und lässt offen, dass der konkrete Schriftträger eine Rolle gewesen sein kann.
