base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/008.yaml
  text: They read from the book[a], from the law of God, clearly, and they gave the sense, so that they understood the reading.
translation:
  language: de
  text: Sie lasen aus dem Buch, aus dem Gesetz Gottes, deutlich[a] vor; sie erklärten den Sinn und machten das Gelesene verständlich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „klar“ oder „mit Erklärung“; das hebräische Wort kann deutliches Vorlesen, das Verdeutlichen des Textes oder möglicherweise eine Übersetzung für die Zuhörer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: Sie lasen
  rationale: קרא bezeichnet bei einem schriftlichen Text gewöhnlich das Lesen, hier im Zusammenhang das öffentliche Vorlesen.
- source_word: בַסֵּפֶר
  choice: aus dem Buch
  rationale: Die Präposition ב bezeichnet hier bei קרא die Quelle, aus der vorgelesen wird; „aus dem Buch“ ist im Deutschen idiomatisch.
- source_word: בְּתוֹרַת הָאֱלֹהִים
  choice: aus dem Gesetz Gottes
  rationale: תורה kann „Weisung“ bedeuten, bezeichnet in Esra-Nehemia jedoch häufig konkret das öffentlich gelesene mosaische Gesetz. Die wiederholte Präposition wird mit „aus“ wiedergegeben und kennzeichnet die Wendung als nähere Bestimmung zu „dem Buch“.
- source_word: מְפֹרָשׁ
  choice: klar und verständlich
  rationale: Das Wort bezeichnet ein deutliches beziehungsweise verständlich machendes Darbieten. Die Formulierung lässt offen, ob dies durch deutliche Aussprache, Erklärung oder Übersetzung geschah.
- source_word: וְשׂוֹם שֶׂכֶל
  choice: sie erklärten den Sinn
  rationale: Die Wendung bedeutet wörtlich etwa „Einsicht geben/setzen“ und beschreibt hier die Vermittlung des Sinnes; „den Sinn erklären“ ist natürliches modernes Deutsch.
- source_word: וַיָּבִינוּ
  choice: sodass man … verstand
  rationale: בין beschreibt hier am natürlichsten das Ergebnis des Vorlesens und Erklärens. Das unpersönliche „man“ kann die versammelten Hörer bezeichnen, ohne einen im Vers nicht ausdrücklich genannten Gegenstand einzuführen.
- source_word: בַּמִּקְרָא
  choice: das Gelesene
  rationale: מִקְרָא kann den öffentlichen Lesevorgang oder dessen Inhalt bezeichnen. „Das Gelesene“ ist in diesem Satz idiomatisch und bewahrt den Bezug auf die Schriftlesung.
theological_decisions:
- issue: Art der Verständlichmachung beim öffentlichen Lesen
  choice: Die Übersetzung legt nicht fest, ob deutlich vorgelesen, ausgelegt oder übersetzt wurde.
  alternative: „Sie übersetzten“ beziehungsweise „sie lasen abschnittsweise“.
  rationale: מְפֹרָשׁ und der Zusammenhang erlauben mehrere Deutungen; eine konfessionell oder historisch spezifische Festlegung wäre nicht durch den Wortlaut erzwungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Ablauf, wird aber für heutige Leser idiomatisch gegliedert. Der Fußnotenmarker steht unmittelbar bei der bewusst offen gehaltenen Wiedergabe von מְפֹרָשׁ.
