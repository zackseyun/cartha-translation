  terminology: „Jahwe“ stimmt mit der vorgegebenen Wiedergabe des Gottesnamens überein. „Priester und Schriftgelehrte“, „Leviten“ und „Weisung“ sind sachgerecht. „Weisung“ bewahrt den breiteren Bedeutungsumfang von תורה; die Fußnote nennt mit „Tora“ und „Gesetz“ die naheliegenden Alternativen. Die Fußnote zu „Tirschata“ erklärt den historischen Amtstitel ausreichend.
