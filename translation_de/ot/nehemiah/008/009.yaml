  source_fidelity: Die Übersetzung gibt die Beteiligten, ihre Funktionen und die Aussage des hebräischen Textes vollständig wieder. „Statthalter“ trifft הַתִּרְשָׁתָא funktional; „unterwiesen“ gibt den Hifil von בין angemessen wieder. Die Unterscheidung von Trauern und Weinen sowie der kausale Schlusssatz sind erhalten. „Jahwe, eurem Gott, heilig“ bildet die Zuordnung durch לְ idiomatisch und sinngetreu ab.
