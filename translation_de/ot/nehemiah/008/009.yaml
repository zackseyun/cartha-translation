source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר נְחֶמְיָ֣ה ה֣וּא הַ/תִּרְשָׁ֡תָא וְ/עֶזְרָ֣א הַ/כֹּהֵ֣ן הַ/סֹּפֵ֡ר וְ/הַ/לְוִיִּם֩ הַ/מְּבִינִ֨ים אֶת הָ/עָ֜ם לְ/כָל הָ/עָ֗ם הַ/יּ֤וֹם קָדֹֽשׁ הוּא֙ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֔ם אַל תִּֽתְאַבְּל֖וּ וְ/אַל תִּבְכּ֑וּ כִּ֤י בוֹכִים֙ כָּל הָ/עָ֔ם כְּ/שָׁמְעָ֖/ם אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/009.yaml
  text: Then Nehemiah the governor[a], Ezra the priest and scribe, and the Levites who were instructing the people said to all the people, “This day is holy to Yahweh your God[b]. Do not mourn or weep.” For all the people were weeping as they heard the words of the law.
translation:
  language: de
  text: 'Da sagten Nehemia, der Statthalter[a], Esra, der Priester und Schriftgelehrte, und die Leviten, die das Volk unterwiesen, zum ganzen Volk: »Dieser Tag ist Jahwe, eurem Gott, heilig. Trauert nicht und weint nicht!« Denn das ganze Volk weinte, als es die Worte der Weisung[b] hörte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Tirschata«; ein persischer Verwaltungstitel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Worte der Tora«; traditionell auch »die Worte des Gesetzes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: der Statthalter
  rationale: Der persische Amtstitel wird funktional und allgemein verständlich wiedergegeben; die mögliche Transliteration steht in der Fußnote.
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: der Priester und Schriftgelehrte
  rationale: Beide appositionellen Amts- beziehungsweise Rollenbezeichnungen Esras bleiben erhalten; „Schriftgelehrter“ ist im Deutschen idiomatischer als „Schreiber“.
- source_word: הַלְוִיִּם הַמְּבִינִים אֶת־הָעָם
  choice: die Leviten, die das Volk unterwiesen
  rationale: Der Hifil-Ausdruck bezeichnet hier das Vermitteln von Verständnis beziehungsweise Unterweisung.
- source_word: הַיּוֹם קָדֹשׁ הוּא לַיהוָה
  choice: Dieser Tag ist Jahwe, eurem Gott, heilig
  rationale: Die prädikative Aussage und die Zuordnung durch ל werden in natürlichem, würdigem Deutsch bewahrt.
- source_word: תִּתְאַבְּלוּ / תִּבְכּוּ
  choice: Trauert nicht und weint nicht
  rationale: Die zwei unterschiedlichen Formen des Kummers bleiben als Trauern und Weinen unterschieden.
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: die Worte der Weisung
  rationale: „Weisung“ gibt die Grundbedeutung von תורה wieder und vermeidet eine vorschnelle Verengung auf Gesetz; „Tora“ bleibt als sachlich naheliegende Alternative vermerkt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname des Gottes Israels wird als Name sichtbar wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Weisung
  alternative: Tora / Gesetz
  rationale: Der Ausdruck bezeichnet hier den verlesenen autoritativen Text; „Weisung“ erhält den weiteren hebräischen Bedeutungsumfang, während die Fußnote die geläufige Bezeichnung „Tora“ nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar gegliedert; „unterwiesen“ und „Weisung“ wahren den feierlichen Kontext, ohne unnötig altertümlich zu wirken.
