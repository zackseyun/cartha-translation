source:
  edition: WLC
  text: וַ/יִּפְתַּ֨ח עֶזְרָ֤א הַ/סֵּ֨פֶר֙ לְ/עֵינֵ֣י כָל הָ/עָ֔ם כִּֽי מֵ/עַ֥ל כָּל הָ/עָ֖ם הָיָ֑ה וּ/כְ/פִתְח֖/וֹ עָֽמְד֥וּ כָל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/005.yaml
  text: Ezra opened the book in the sight of all the people[a], for he was above all the people; and when he opened it, all the people stood.
translation:
  language: de
  text: Esra öffnete das Buch vor den Augen des ganzen Volkes[a], denn er stand höher als das ganze Volk. Als er es öffnete, stand das ganze Volk auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Schriftrolle“. Das hebräische Wort סֵפֶר kann ein schriftliches Dokument in Rollenform bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: öffnete
  rationale: פתח bedeutet hier schlicht „öffnen“. Auch eine Schriftrolle kann im Deutschen geöffnet werden; „entrollte“ würde die konkrete Handhabung stärker auslegen als der hebräische Wortlaut.
- source_word: הַסֵּפֶר
  choice: das Buch
  rationale: סֵפֶר bezeichnet ein Buch, eine Schrift oder ein schriftliches Dokument, in der Antike häufig in Rollenform. „Buch“ ist die traditionelle, im Kontext natürliche Wiedergabe; „Schriftrolle“ wird als Alternative in der Fußnote genannt.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die wörtliche Wendung bewahrt den öffentlichen und sichtbaren Charakter des Geschehens und ist im Deutschen verständlich.
- source_word: כָל הָעָם
  choice: das ganze Volk
  rationale: עָם meint hier die versammelte Bevölkerung. Die wiederholte Formulierung gibt den Nachdruck des hebräischen Textes wieder.
- source_word: כִּי מֵעַל כָּל הָעָם הָיָה
  choice: denn er stand höher als das ganze Volk
  rationale: מֵעַל bezeichnet hier die räumlich erhöhte Position Esras. Das ergänzte „stand“ macht diesen Sinn im Deutschen klar und vermeidet den Eindruck gesellschaftlicher Überordnung.
- source_word: וּכְפִתְחוֹ
  choice: Als er es öffnete
  rationale: כְּ hat hier temporalen Sinn („als/während“). Das Pronomen „es“ nimmt natürlich auf das Buch zurück.
- source_word: עָמְדוּ
  choice: stand ... auf
  rationale: עמד kann „stehen“ oder kontextuell „sich hinstellen/aufstehen“ bedeuten. Da die Menschen auf das Öffnen reagieren, drückt „stand ... auf“ den inchoativen Sinn im natürlichen Deutschen aus.
theological_decisions: []
