  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederholung von „das ganze Volk“ bleibt zur Wahrung des hebräischen Nachdrucks erhalten; die räumliche Bedeutung von Esras erhöhter Position wird ausdrücklich klargestellt.
