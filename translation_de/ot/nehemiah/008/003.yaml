id: NEH.8.3
reference: Nehemiah 8:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקְרָא ב/וֹ֩ לִ/פְנֵ֨י הָ/רְח֜וֹב אֲשֶׁ֣ר לִ/פְנֵ֣י שַֽׁעַר הַ/מַּ֗יִם מִן הָ/אוֹר֙ עַד מַחֲצִ֣ית הַ/יּ֔וֹם נֶ֛גֶד הָ/אֲנָשִׁ֥ים וְ/הַ/נָּשִׁ֖ים וְ/הַ/מְּבִינִ֑ים וְ/אָזְנֵ֥י כָל הָ/עָ֖ם אֶל סֵ֥פֶר הַ/תּוֹרָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/003.yaml
  text: And he read from it before the square that was in front of the Water Gate[a], from daybreak until midday, in the presence of the men and the women and those who could understand[c][b]; and the ears of all the people were attentive to the Book of the Law.
translation:
  language: de
  text: Und er las daraus auf dem Platz vor dem Wassertor vom Anbruch des Tages[a] bis zum Mittag, vor den Männern und Frauen und allen, die es verstehen konnten[b]. Das ganze Volk hörte aufmerksam auf das Buch[c] des Gesetzes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Licht“; gemeint ist das erste Tageslicht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alle Verständigen“. Vermutlich sind alle gemeint, die alt genug waren, der Lesung zu folgen.'
    reason: lexical_alternative
  - marker: c
    text: „Buch“ kann hier auch mit „Schriftrolle“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא בּוֹ
  choice: Und er las daraus
  rationale: Im Zusammenhang mit dem zuvor genannten Schriftstück bedeutet קרא hier „lesen“; בּוֹ wird im Deutschen bei einem Text idiomatisch mit „daraus“ wiedergegeben.
- source_word: לִפְנֵי הָרְחוֹב אֲשֶׁר לִפְנֵי שַׁעַר הַמַּיִם
  choice: auf dem Platz vor dem Wassertor
  rationale: רְחוֹב bezeichnet einen offenen öffentlichen Platz. Die zweimalige Präposition לִפְנֵי wird im natürlichen Deutschen räumlich zusammengezogen, ohne die Ortsangabe zu verändern.
- source_word: מִן הָאוֹר
  choice: vom Anbruch des Tages
  rationale: Wörtlich steht „vom Licht“; gemeint ist der Zeitpunkt des ersten Tageslichts. „Anbruch des Tages“ ist verständlich und bewahrt das Bild stärker als eine bloße Uhrzeitangabe.
- source_word: עַד מַחֲצִית הַיּוֹם
  choice: bis zum Mittag
  rationale: Die Wendung bezeichnet die Mitte des Tages; „bis zum Mittag“ ist die natürliche deutsche Entsprechung.
- source_word: נֶגֶד הָאֲנָשִׁים וְהַנָּשִׁים וְהַמְּבִינִים
  choice: vor den Männern und Frauen und allen, die es verstehen konnten
  rationale: נֶגֶד bezeichnet hier die versammelte Zuhörerschaft. הַמְּבִינִים ist ein substantiviertes Partizip und meint diejenigen, die verständig beziehungsweise zum Verstehen fähig waren; „allen“ verdeutlicht die zusätzliche Gruppe, ohne ihr Alter festzulegen.
- source_word: וְאָזְנֵי כָל הָעָם אֶל
  choice: Das ganze Volk hörte aufmerksam auf
  rationale: Der hebräische Ausdruck lautet bildhaft „die Ohren des ganzen Volkes waren auf … gerichtet“. Die deutsche Formulierung gibt das aufmerksame Zuhören natürlich und präzise wieder.
- source_word: סֵפֶר הַתּוֹרָה
  choice: das Buch des Gesetzes
  rationale: סֵפֶר kann ein Buch, eine Schrift oder eine Schriftrolle bezeichnen. תּוֹרָה meint hier die maßgebliche schriftliche Weisung; die etablierte und allgemein verständliche Wendung ist „Buch des Gesetzes“.
theological_decisions:
- issue: Wiedergabe von תּוֹרָה im Zusammenhang der öffentlichen Lesung
  choice: Gesetz
  alternative: Weisung; Tora
  rationale: Im Kontext von Nehemia 8 bezeichnet תּוֹרָה die schriftlich überlieferte, verbindliche Bundesweisung. „Gesetz“ ist in der Wendung „Buch des Gesetzes“ transparent und traditionell verständlich; die weitere Bedeutung „Weisung“ bleibt als sprachliche Alternative anerkannt.
- issue: Bestimmung der mit הַמְּבִינִים bezeichneten Gruppe
  choice: alle, die es verstehen konnten
  alternative: alle Verständigen; alle Einsichtigen
  rationale: Der Text nennt neben Männern und Frauen eine Gruppe nach ihrer Fähigkeit zu verstehen, legt aber nicht ausdrücklich fest, dass damit Kinder eines bestimmten Alters gemeint sind. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wahrt den erzählerischen Charakter, während die hebräische Ohren-Metapher zugunsten einer natürlichen deutschen Hörformulierung funktional wiedergegeben wird. Die explizite Nennung von Männern und Frauen sowie die eigenständige Gruppe der Verstehenden bleiben erhalten.
