  text: וַ/יָּבִ֣יא עֶזְרָ֣א הַ֠/כֹּהֵן אֶֽת הַ/תּוֹרָ֞ה לִ/פְנֵ֤י הַ/קָּהָל֙ מֵ/אִ֣ישׁ וְ/עַד אִשָּׁ֔ה וְ/כֹ֖ל מֵבִ֣ין לִ/שְׁמֹ֑עַ בְּ/י֥וֹם אֶחָ֖ד לַ/חֹ֥דֶשׁ הַ/שְּׁבִיעִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/002.yaml
  text: Then Ezra the priest brought the law before the assembly[a], both men and women, and all who could understand what they heard[b], on the first day of the seventh month.
translation:
  language: de
  text: 'Am ersten Tag des siebten Monats brachte der Priester Esra das Gesetz vor die Versammlung: Männer und Frauen sowie alle, die das Gehörte verstehen konnten[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle, die beim Hören Verständnis hatten“; wörtlich etwa: „jeder, der verstand zu hören“. Gemeint sind alle, die die Lesung verstehen konnten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיא
  choice: Da brachte
  rationale: Das narrative Waw mit Imperfekt führt die Handlung weiter; „Da brachte“ gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Der ausdrücklich genannte Titel steht als Apposition zu Esra und wird beibehalten.
- source_word: הַתּוֹרָה
  choice: das Gesetz
  rationale: Im Zusammenhang bezeichnet der Ausdruck die öffentlich verlesene mosaische Weisung. „Das Gesetz“ ist im Deutschen verständlich und wahrt das Gewicht des Begriffs; „die Tora“ und „die Weisung“ bleiben mögliche Alternativen.
- source_word: לִפְנֵי הַקָּהָל
  choice: vor die Versammlung
  rationale: Die Formulierung bewahrt den öffentlichen Rahmen und vermeidet die stärker religiös-institutionellen Nebenbedeutungen von „Gemeinde“.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: Männer und Frauen
  rationale: Die hebräische Wendung lautet wörtlich „vom Mann bis zur Frau“ und bezeichnet hier den umfassenden Personenkreis. „Männer und Frauen“ ist im modernen Deutsch natürlich und gibt den ausdrücklich geschlechtlich bestimmten Umfang wieder.
- source_word: וְכֹל מֵבִין לִשְׁמֹעַ
  choice: sowie alle, die beim Zuhören verstehen konnten
  rationale: Die Wendung meint nicht bloß akustisches Hören, sondern die Fähigkeit, das Gehörte zu erfassen. Die deutsche Fassung erhält den Bezug zum Hören, ohne die Aussage unnötig festzulegen.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: am ersten Tag des siebten Monats
  rationale: Dies ist die geläufige deutsche Wiedergabe der hebräischen Datumsformel.
theological_decisions:
- issue: Beschreibung des geschlechtlich bestimmten Publikums
  choice: Männer und Frauen
  alternative: vom Mann bis zur Frau
  rationale: Die Übersetzung bewahrt die ausdrückliche Einbeziehung beider Gruppen, gibt die hebräische Bereichsformel jedoch in natürlichem modernem Deutsch wieder.
- issue: Wiedergabe von תּוֹרָה
  choice: das Gesetz
  alternative: die Tora; die Weisung
  rationale: „Das Gesetz“ passt zum öffentlichen Vorlesen des mosaischen Textbestands und ist allgemein verständlich. Die lexikalische Breite des Begriffs wird nicht zur Auflösung einer theologischen Spannung genutzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Gedankenstriche gliedern die lange Aufzählung und machen deutlich, dass die Datumsangabe auf das Bringen des Gesetzes bezogen ist. Keine konfessionell geprägte Terminologie wurde hinzugefügt.
