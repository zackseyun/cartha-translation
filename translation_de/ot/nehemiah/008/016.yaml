base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/016.yaml
  text: So the people went out and brought them[a], and made booths for themselves, each on his roof, and in their courtyards, and in the courtyards of the house of God, and in the square of the Water Gate[b], and in the square of the Gate of Ephraim.
translation:
  language: de
  text: 'Da ging das Volk hinaus und brachte Zweige und Laub herbei[a]. Sie errichteten sich Laubhütten: jeder auf seinem Dach und in ihren Höfen, in den Höfen des Hauses Gottes, auf dem Platz am Wassertor[b] und auf dem Platz am Efraimtor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht nur: „und brachten“. Das Objekt – Zweige und Laub – ergibt sich aus dem Auftrag im vorhergehenden Vers.'
    reason: implicit_object
  - marker: b
    text: Das hebräische Wort bezeichnet eine offene öffentliche Fläche bei einem Tor, also einen Platz; traditionell auch „breiter Platz“.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ הָעָם
  choice: Da ging das Volk hinaus
  rationale: Das Kollektiv הָעָם wird im Deutschen idiomatisch mit „das Volk“ und einem Verb im Singular wiedergegeben. „Hinausgehen“ bildet יצא klar und natürlich ab.
- source_word: וַיָּבִיאוּ
  choice: holte Zweige und Laub her
  rationale: Der Hifil von בוא bedeutet „bringen/herbeibringen“. Das im Hebräischen unausgesprochene Objekt wird aus Vers 15 aufgenommen, damit der deutsche Satz verständlich ist; die Ergänzung wird in einer Fußnote kenntlich gemacht.
- source_word: וַיַּעֲשׂוּ לָהֶם סֻכּוֹת
  choice: Sie bauten sich Laubhütten
  rationale: „Laubhütten“ bezeichnet die provisorischen Festhütten und bewahrt den sprachlichen Bezug zum Laubhüttenfest. Das reflexive „sich“ gibt לָהֶם wieder.
- source_word: אִישׁ עַל גַּגּוֹ
  choice: jeder auf seinem Dach
  rationale: אִישׁ ist hier distributiv gebraucht. Die singularische Formulierung bewahrt die individualisierende Aussage des Hebräischen; גַּג bezeichnet das gewöhnlich flache Hausdach.
- source_word: וּבְחַצְרֹתֵיהֶם
  choice: und in ihren Höfen
  rationale: חָצֵר bezeichnet einen umschlossenen Hof. Der Plural und das Possessivsuffix werden unmittelbar wiedergegeben.
- source_word: וּבְחַצְרוֹת בֵּית הָאֱלֹהִים
  choice: in den Höfen des Hauses Gottes
  rationale: Die Wiedergabe bewahrt sowohl die Wiederholung von חָצֵר als auch die transparente Bezeichnung בֵּית הָאֱלֹהִים; gemeint ist das Tempelgelände.
- source_word: וּבִרְחוֹב
  choice: auf dem Platz
  rationale: רְחוֹב bezeichnet hier eine offene öffentliche Fläche bei einem Stadttor. „Platz“ ist im modernen Deutschen natürlich und sachlich genau.
- source_word: שַׁעַר הַמַּיִם
  choice: Wassertor
  rationale: Der etablierte deutsche Ortsname gibt die hebräische Genitivverbindung knapp und verständlich wieder.
- source_word: שַׁעַר אֶפְרָיִם
  choice: Efraimtor
  rationale: Die Zusammensetzung ist eine natürliche deutsche Wiedergabe des Namens und verwendet die im modernen Deutschen übliche Schreibweise „Efraim“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Erzählfolge bleibt knapp; Ortsnamen und die kultische Bezeichnung „Laubhütten“ werden transparent beibehalten. Der Wechsel vom distributiven Singular („jeder … seinem“) zum Plural („ihren Höfen“) folgt bewusst der hebräischen Form.
