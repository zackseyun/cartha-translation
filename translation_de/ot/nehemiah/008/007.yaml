base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/007.yaml
  text: And Jeshua[a], Bani, Sherebiah, Jamin, Akkub, Shabbethai, Hodiah, Maaseiah, Kelita, Azariah, Jozabad, Hanan[b], Pelaiah, and the Levites explained the law to the people, while the people remained in their places.
translation:
  language: de
  text: Jeschua, Bani, Scherebja, Jamin, Akkub, Schabbetai, Hodija, Maaseja, Kelita, Asarja, Josabad, Hanan, Pelaja und die Leviten halfen dem Volk, das Gesetz zu verstehen[a], während das Volk an ihren Plätzen blieb[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erklärten dem Volk das Gesetz“. Das hebräische Verb bezeichnet hier das Vermitteln von Verständnis.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „während das Volk an ihren Plätzen stand“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יֵשׁוּעַ ... פְּלָאיָה
  choice: Jeschua, Bani, Scherebja, Jamin, Akkub, Schabbetai, Hodija, Maaseja, Kelita, Asarja, Josabad, Hanan, Pelaja
  rationale: Die Personennamen werden nach geläufigen deutschen Bibelschreibungen transliteriert und nicht übersetzt.
- source_word: וְהַלְוִיִּם
  choice: und die Leviten
  rationale: Die koordinierende Formulierung des Hebräischen bleibt erhalten; ob die Genannten selbst Leviten sind oder danach eine weitere Gruppe bezeichnet wird, wird nicht vorschnell entschieden.
- source_word: מְבִינִים אֶת־הָעָם לַתּוֹרָה
  choice: halfen dem Volk, das Gesetz zu verstehen
  rationale: Das Hifil-Partizip von בין bezeichnet hier das Bewirken von Verständnis. Die deutsche Formulierung gibt diesen kausativen Sinn natürlich wieder, ohne genauer festzulegen, ob dies durch Erklärung, Unterweisung oder Auslegung geschah.
- source_word: לַתּוֹרָה
  choice: das Gesetz
  rationale: תּוֹרָה kann Weisung oder Tora/Gesetz bedeuten. Im Kontext der öffentlichen Verlesung ist „das Gesetz“ verständlich und sachgerecht.
- source_word: וְהָעָם עַל עָמְדָם
  choice: während das Volk an seinem Platz blieb
  rationale: Die idiomatische Wendung bezeichnet den Standort beziehungsweise das Verbleiben des Volkes dort; der Singular des hebräischen Kollektivums wird im Deutschen bewahrt.
theological_decisions:
- issue: Art der Tätigkeit der Leviten
  choice: halfen dem Volk, das Gesetz zu verstehen
  alternative: erklärten dem Volk das Gesetz
  rationale: Die gewählte Wiedergabe bewahrt den kausativen Sinn des Verbs und lässt offen, auf welche konkrete Weise das Verständnis vermittelt wurde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Namensformen orientieren sich an etablierten deutschen Bibeltraditionen; Satzbau und Wortwahl bleiben für heutige Leser klar.
