base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/012.yaml
  text: And all the people went away to eat and drink[a], to send portions, and to celebrate with great joy[b], because they had understood the words that had been made known to them.
translation:
  language: de
  text: Daraufhin ging das ganze Volk fort, um zu essen und zu trinken, Speiseportionen zu verschicken[a] und ein großes Freudenfest zu feiern. Denn sie hatten die Worte verstanden, die man ihnen bekannt gemacht hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Portionen zu verschicken“; gemeint sind wahrscheinlich Speiseportionen als Teil der Festfeier.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die man ihnen erklärt hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ כָל הָעָם
  choice: Da gingen alle Leute weg
  rationale: Die Erzählform führt die Handlung fort; „gingen ... weg“ macht deutlich, dass die Versammelten den Ort verließen. „Alle Leute“ ist im modernen Deutsch natürlicher als „das ganze Volk“ und bewahrt den umfassenden Sinn.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: um zu essen und zu trinken
  rationale: Die Infinitive geben den Zweck ihres Weggehens an und lassen sich unmittelbar wiedergeben.
- source_word: וּלְשַׁלַּח מָנוֹת
  choice: anderen etwas davon abzugeben
  rationale: מָנוֹת bezeichnet hier im Festzusammenhang Anteile, besonders Speiseportionen; שׁלח kann das Zusenden bzw. Weitergeben ausdrücken. Die Empfänger sind aus dem vorherigen Vers erschließbar, stehen hier aber nicht ausdrücklich, weshalb eine Fußnote die wörtlichere Fassung bewahrt.
- source_word: וְלַעֲשׂוֹת שִׂמְחָה גְדוֹלָה
  choice: ein großes Freudenfest zu feiern
  rationale: Die wörtliche Wendung „große Freude machen“ wird idiomatisch als festliches Feiern wiedergegeben, ohne die starke Intensität von גְדוֹלָה abzuschwächen.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion nennt den Grund für die vorausgehende Reaktion. „Denn“ stellt den Zusammenhang in würdigem, natürlichem Deutsch klar heraus.
- source_word: הֵבִינוּ בַּדְּבָרִים
  choice: sie hatten die Worte verstanden
  rationale: דְּבָרִים kann „Worte“ oder „Angelegenheiten“ bedeuten. Im Kontext der vorgelesenen Weisung liegt „Worte“ nahe; das Plusquamperfekt verdeutlicht, dass ihr Verstehen dem Fest vorausging und es begründete.
- source_word: אֲשֶׁר הוֹדִיעוּ לָהֶם
  choice: die man ihnen erklärt hatte
  rationale: Der Hifil von ידע bedeutet grundsätzlich „wissen lassen/bekannt machen“. Im Kontext der Unterweisung ist „erklären“ natürlich, ohne die unbestimmten menschlichen Vermittler eigens zu benennen; die weitere Bedeutung wird in der Fußnote angegeben.
theological_decisions:
- issue: Grund der freudigen Reaktion auf die Weisung
  choice: Die große Freude wird ausdrücklich damit begründet, dass die Menschen die vermittelten Worte verstanden hatten.
  alternative: Die Freude könnte deutend vor allem als vollzogene Bundeserneuerung oder als auf Reue folgende Feier beschrieben werden.
  rationale: Der hebräische Text nennt das Verstehen der bekannt gemachten Worte als unmittelbaren Grund. Weitergehende theologische Deutungen werden nicht in die Übersetzung eingetragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung hebt den ausdrücklich genannten Grund der Freude hervor. Beide Fußnotenmarker stehen im Haupttext.
