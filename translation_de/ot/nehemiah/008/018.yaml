id: NEH.8.18
reference: Nehemiah 8:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ֠/יִּקְרָא בְּ/סֵ֨פֶר תּוֹרַ֤ת הָ/אֱלֹהִים֙ י֣וֹם בְּ/י֔וֹם מִן הַ/יּוֹם֙ הָֽ/רִאשׁ֔וֹן עַ֖ד הַ/יּ֣וֹם הָ/אַחֲר֑וֹן וַ/יַּֽעֲשׂוּ חָג֙ שִׁבְעַ֣ת יָמִ֔ים וּ/בַ/יּ֧וֹם הַ/שְּׁמִינִ֛י עֲצֶ֖רֶת כַּ/מִּשְׁפָּֽט׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/018.yaml
  text: And he read from the Book of the Law of God day by day[a], from the first day to the last day. And they kept the feast seven days, and on the eighth day there was a solemn assembly[c][b], according to the ordinance.
translation:
  language: de
  text: Und er las Tag für Tag aus dem Buch des Gesetzes Gottes[a], vom ersten bis zum letzten Tag. Sie feierten das Fest sieben Tage lang, und am achten Tag fand nach der Vorschrift eine Festversammlung statt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann allgemein ein Schriftstück und damit auch eine Schriftrolle bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet eine besondere, vorgeschriebene Versammlung und kann hier auch eine Abschlussversammlung meinen.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Und er las
  rationale: קרא mit בְּסֵפֶר bezeichnet hier das Lesen aus einem Schriftstück, wahrscheinlich öffentlich und laut. Die singularische Verbform bleibt erhalten; aus dem Zusammenhang ist Esra als Leser zu verstehen.
- source_word: בְּסֵפֶר תּוֹרַת הָאֱלֹהִים
  choice: aus dem Buch des Gesetzes Gottes
  rationale: Bei קרא wird בְּ im Deutschen idiomatisch mit „aus“ wiedergegeben. סֵפֶר kann ein Buch beziehungsweise eine Schriftrolle bezeichnen; „Buch“ vermeidet eine unnötige Festlegung auf die materielle Form.
- source_word: יוֹם בְּיוֹם
  choice: Tag für Tag
  rationale: Die deutsche Wendung gibt die wiederholte tägliche Handlung und zugleich den Rhythmus des hebräischen Ausdrucks natürlich wieder.
- source_word: מִן הַיּוֹם הָרִאשׁוֹן עַד הַיּוֹם הָאַחֲרוֹן
  choice: vom ersten bis zum letzten Tag
  rationale: Die Formulierung bildet die gesamte angegebene Zeitspanne knapp und idiomatisch ab.
- source_word: וַיַּעֲשׂוּ חָג
  choice: Sie feierten das Fest
  rationale: עשה + חג bedeutet in diesem Zusammenhang, ein Fest zu begehen beziehungsweise zu feiern. „feierten“ ist gegenwärtiges, verständliches Deutsch und bewahrt den kultischen Bezug.
- source_word: עֲצֶרֶת
  choice: Festversammlung
  rationale: Der Ausdruck bezeichnet eine besondere, vorgeschriebene Versammlung am Abschluss des Festes. „Festversammlung“ wahrt sowohl den Versammlungscharakter als auch den kultischen Zusammenhang, ohne die mögliche Schlussfunktion zu stark festzulegen.
- source_word: כַּמִּשְׁפָּט
  choice: nach der Vorschrift
  rationale: מִשְׁפָּט bezeichnet hier die maßgebliche Regelung für die Feier. „nach der Vorschrift“ gibt den normativen Sinn natürlich und präzise wieder.
theological_decisions:
- issue: Singularischer Leser und pluralische Festgemeinschaft
  choice: „er las“ und „sie feierten“
  alternative: Den Leser unpersönlich oder pluralisch wiedergeben
  rationale: Die hebräischen Verbformen unterscheiden bewusst zwischen dem einzelnen Leser und der feiernden Gemeinschaft. Diese Rollenverteilung wird nicht eingeebnet.
- issue: Bedeutungsumfang von עֲצֶרֶת
  choice: „Festversammlung“ mit erläuternder Fußnote
  alternative: „feierliche Versammlung“ oder „Abschlussversammlung“
  rationale: Der Begriff bezeichnet eine kultisch vorgeschriebene Versammlung und kann zugleich auf den Abschluss des Festes weisen. Der Haupttext bleibt knapp; die Fußnote bewahrt diese Bedeutungsnuance, ohne sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Erzählgang, bleibt aber natürlich lesbar. „Festversammlung“ bewahrt den kultischen Charakter, während die Fußnote die mögliche Schlussfunktion des achten Tages offenhält.
