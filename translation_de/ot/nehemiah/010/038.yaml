  text: וְ/אֶת רֵאשִׁ֣ית עֲרִיסֹתֵ֣י/נוּ וּ֠/תְרוּמֹתֵי/נוּ וּ/פְרִ֨י כָל עֵ֜ץ תִּיר֣וֹשׁ וְ/יִצְהָ֗ר נָבִ֤יא לַ/כֹּהֲנִים֙ אֶל לִשְׁכ֣וֹת בֵּית אֱלֹהֵ֔י/נוּ וּ/מַעְשַׂ֥ר אַדְמָתֵ֖/נוּ לַ/לְוִיִּ֑ם וְ/הֵם֙ הַ/לְוִיִּ֔ם הַֽ/מְעַשְּׂרִ֔ים בְּ/כֹ֖ל עָרֵ֥י עֲבֹדָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/038.yaml
  text: And we will bring the first of our dough[a], our contributions, the fruit of every tree, the new wine, and the oil to the priests, to the chambers of the house of our God, and the tithe of our land to the Levites; for they, the Levites[c][b], are the ones who collect the tithes in all the cities where we labor.
translation:
  language: de
  text: Und den ersten Anteil unseres Teiges[a], unsere heiligen Gaben, die Früchte jedes Baumes, den jungen Wein und das Öl bringen wir zu den Priestern in die Kammern[b] des Hauses unseres Gottes. Den Zehnten vom Ertrag unseres Landes bringen wir zu den Leviten; denn die Leviten sind es, die in allen Städten, in denen wir arbeiten[c], den Zehnten einziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Erstling unseres Teiges“. Gemeint ist der erste, als heilige Gabe ausgesonderte Anteil der Teigmasse.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Vorratsräume“. Das hebräische Wort bezeichnet Räume im Tempelkomplex, die häufig auch zur Aufbewahrung dienten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „in allen Städten unserer Arbeit“ beziehungsweise „unseres Dienstes“. Die knappe hebräische Wendung kann die Orte meinen, die mit der Arbeit oder Bewirtschaftung des Volkes verbunden waren.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית עֲרִיסֹתֵינוּ
  choice: den ersten Anteil von unserem Teig
  rationale: רֵאשִׁית bezeichnet den ersten, ausgesonderten Anteil; עֲרִיסָה meint hier den gekneteten Teig beziehungsweise die Teigmasse. Die Formulierung bleibt konkret und ist im heutigen Deutsch verständlich.
- source_word: תְּרוּמֹתֵינוּ
  choice: unsere Abgaben
  rationale: תְּרוּמָה bezeichnet eine für einen heiligen Zweck ausgesonderte Gabe. „Abgaben“ passt zum verpflichtenden Charakter des Gelöbnisses, ohne den schwer verständlichen Fachausdruck „Hebopfer“ zu verwenden.
- source_word: פְּרִי כָל עֵץ
  choice: die Früchte von jedem Baum
  rationale: Die Wiedergabe bewahrt die distributive Kraft von כָל und klingt zugleich natürlich.
- source_word: תִּירוֹשׁ
  choice: den jungen Wein
  rationale: תִּירוֹשׁ bezeichnet im Zusammenhang landwirtschaftlicher Erzeugnisse gewöhnlich jungen beziehungsweise frisch erzeugten Wein.
- source_word: יִצְהָר
  choice: das Öl
  rationale: Gemeint ist typischerweise Olivenöl; „Öl“ wahrt jedoch die allgemeinere Ausdrucksweise des Hebräischen.
- source_word: נָבִיא
  choice: bringen wir
  rationale: Der Hifil von בוא in der ersten Person Plural drückt hier die gemeinschaftliche Selbstverpflichtung aus. Das deutsche Präsens kann in einem Gelöbnis verbindliche Zukunft ausdrücken.
- source_word: לִשְׁכוֹת
  choice: die Kammern
  rationale: לִשְׁכּוֹת sind Räume im Tempelkomplex. „Kammern“ bewahrt den architektonischen Sinn, ohne ihre Funktion ausschließlich auf Lagerung festzulegen.
- source_word: מַעְשַׂר אַדְמָתֵנוּ
  choice: den Zehnten von unserem Land
  rationale: Die knappe Genitivverbindung wird nah am Hebräischen wiedergegeben; sachlich ist der Zehnte vom Ertrag des Landes gemeint.
- source_word: הַמְעַשְּׂרִים
  choice: den Zehnten einziehen
  rationale: Das Partizip bezeichnet hier die Leviten als diejenigen, die den Zehnten erheben beziehungsweise entgegennehmen. „Einziehen“ bringt ihre administrative Aufgabe klar zum Ausdruck.
- source_word: בְּכֹל עָרֵי עֲבֹדָתֵנוּ
  choice: in allen Städten, in denen wir arbeiten
  rationale: עֲבֹדָה kann Arbeit, Dienst oder Bewirtschaftung bedeuten. Die Wiedergabe erhält den Arbeitsbezug, ohne die im Hebräischen nicht ausdrücklich genannte Landwirtschaft festzuschreiben.
