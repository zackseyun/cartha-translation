  text: וְ/הֶעֱמַ֤דְנוּ עָלֵ֨י/נוּ֙ מִצְוֺ֔ת לָ/תֵ֥ת עָלֵ֛י/נוּ שְׁלִשִׁ֥ית הַ/שֶּׁ֖קֶל בַּ/שָּׁנָ֑ה לַ/עֲבֹדַ֖ת בֵּ֥ית אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/033.yaml
  text: We also laid on ourselves the obligation to give yearly a third of a shekel for the service of the house of our God[a].
translation:
  language: de
  text: Außerdem verpflichteten wir uns, jedes Jahr ein Drittel eines Schekels für den Dienst am Haus unseres Gottes zu geben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Außerdem legten wir uns Verpflichtungen auf, jedes Jahr ein Drittel eines Schekels zu geben.“ Die hebräische Form ist Plural und kann hier kollektiv eine verbindliche Selbstverpflichtung bezeichnen.'
    reason: Die Fußnote wahrt die formale Pluralform von מִצְוֺת und erläutert zugleich die im Haupttext verwendete kollektive Wiedergabe.
lexical_decisions:
- source_word: וְהֶעֱמַדְנוּ עָלֵינוּ מִצְוֺת
  choice: Außerdem verpflichteten wir uns
  rationale: Der Hifil von עמד mit עַל bezeichnet hier das verbindliche Auferlegen einer Verpflichtung. Die natürliche deutsche Wendung „sich verpflichten“ gibt den selbst auferlegten, bindenden Charakter wieder; מִצְוֺת wird dabei kollektiv beziehungsweise abstrakt verstanden.
- source_word: לָתֵת
  choice: zu geben
  rationale: Die Grundbedeutung von נתן wird bewahrt; „zu zahlen“ wäre im Zusammenhang möglich, aber stärker deutend.
- source_word: שְׁלִשִׁית הַשֶּׁקֶל
  choice: ein Drittel Schekel
  rationale: Die gebräuchliche deutsche Bruchkonstruktion gibt den hebräischen Ausdruck genau und verständlich wieder.
- source_word: בַּשָּׁנָה
  choice: jedes Jahr
  rationale: Die Wendung bezeichnet eine jährlich wiederkehrende Abgabe.
- source_word: לַעֲבֹדַת
  choice: für den Dienst
  rationale: עֲבֹדָה bezeichnet hier die mit dem Gotteshaus verbundene kultische und praktische Arbeit; „Dienst“ bewahrt beide Aspekte besser als das engere „Gottesdienst“.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: am Haus unseres Gottes
  rationale: „Haus unseres Gottes“ bewahrt die hebräische Ausdrucksweise und den gemeinschaftlichen Bezug; „Tempel“ wäre sachlich zutreffend, aber weniger quellennah.
theological_decisions:
- issue: Art und Zahl der in מִצְוֺת bezeichneten Verpflichtung
  choice: eine verbindliche Selbstverpflichtung
  alternative: mehrere selbst auferlegte Verpflichtungen beziehungsweise Gebote
  rationale: Die Form מִצְוֺת kann formal als Plural verstanden werden, funktioniert hier jedoch wahrscheinlich kollektiv oder abstrakt und wird durch die folgende Infinitivkonstruktion inhaltlich als konkrete jährliche Abgabepflicht entfaltet. Die Fußnote hält die formale Pluralmöglichkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sich verpflichten“ ist natürlicher als eine wörtliche Wiedergabe mit „auferlegen“, bewahrt aber den bindenden Charakter. „Schekel“ bleibt als historische Gewichtseinheit beziehungsweise Geldgröße stehen.
