source:
  edition: WLC
  text: כִּ֣י אֶל הַ֠/לְּשָׁכוֹת יָבִ֨יאוּ בְנֵי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י הַ/לֵּוִ֗י אֶת תְּרוּמַ֣ת הַ/דָּגָן֮ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָר֒ וְ/שָׁם֙ כְּלֵ֣י הַ/מִּקְדָּ֔שׁ וְ/הַ/כֹּהֲנִים֙ הַ/מְשָׁ֣רְתִ֔ים וְ/הַ/שּׁוֹעֲרִ֖ים וְ/הַ/מְשֹׁרְרִ֑ים וְ/לֹ֥א נַעֲזֹ֖ב אֶת בֵּ֥ית אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/040.yaml
  text: For the sons of Israel and the sons of Levi will bring the contribution of the grain[a], the new wine, and the oil to the chambers, where the vessels of the sanctuary are, and the priests who minister, and the gatekeepers, and the singers[b]. And we will not neglect the house of our God.
translation:
  language: de
  text: Denn die Israeliten und die Leviten werden die Abgabe von Getreide, jungem Wein und Öl in die Vorratsräume bringen. Dort befinden sich die Geräte des Heiligtums sowie die Priester, die ihren Dienst tun, die Torwächter und die Sänger. Wir wollen das Haus unseres Gottes nicht vernachlässigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir wollen das Haus unseres Gottes nicht im Stich lassen.“'
    reason: Das hebräische Verb kann neben praktischer Vernachlässigung auch das Verlassen oder Im-Stich-Lassen bezeichnen.
lexical_decisions:
- source_word: לְּשָׁכוֹת
  choice: Vorratsräume
  rationale: Die Räume am Tempel dienten in diesem Zusammenhang der Aufbewahrung der Abgaben. „Vorratsräume“ gibt die kontextuelle Funktion in natürlichem Deutsch wieder.
- source_word: בְנֵי יִשְׂרָאֵל וּבְנֵי הַלֵּוִי
  choice: die Israeliten und die Leviten
  rationale: Die wörtliche Form „Söhne Israels und Söhne Levis“ bezeichnet hier die beiden Gruppen. Die idiomatischen Volks- und Amtsbezeichnungen sind im modernen Deutsch klarer, ohne den sachlichen Gegensatz aufzugeben.
- source_word: תְּרוּמַת
  choice: Abgabe
  rationale: Das Wort bezeichnet eine für den heiligen Gebrauch ausgesonderte Zuwendung. „Abgabe“ passt zu den regelmäßig eingebrachten landwirtschaftlichen Erzeugnissen, ohne eine bestimmte Opferhandlung vorauszusetzen.
- source_word: דָּגָן
  choice: Getreide
  rationale: Bezeichnet allgemein Getreideerzeugnisse.
- source_word: תִּירוֹשׁ
  choice: junger Wein
  rationale: Bewahrt die landwirtschaftliche Nuance von תירוש und vermeidet die mögliche Fehlvorstellung, es handle sich notwendig um bloßen Traubensaft.
- source_word: יִצְהָר
  choice: Öl
  rationale: Im traditionellen Dreiklang der Feldfrüchte ist Olivenöl gemeint; „Öl“ ist die knappe, übliche Wiedergabe.
- source_word: כְּלֵי הַמִּקְדָּשׁ
  choice: Geräte des Heiligtums
  rationale: כלים meint die für den Tempeldienst verwendeten Gegenstände; „Geräte“ ist heute verständlicher als „Gefäße“ und umfasst den weiteren Bedeutungsbereich.
- source_word: הַכֹּהֲנִים הַמְשָׁרְתִים
  choice: die Priester, die ihren Dienst tun
  rationale: Gibt das aktive Partizip verständlich wieder und bewahrt den Bezug auf den kultischen Dienst.
- source_word: הַשּׁוֹעֲרִים
  choice: Torwächter
  rationale: Übliche und genaue Bezeichnung der für die Tempeltore zuständigen Bediensteten.
- source_word: לֹא נַעֲזֹב
  choice: wir wollen ... nicht vernachlässigen
  rationale: Im Kontext geht es um die fortdauernde materielle und kultische Fürsorge für den Tempel. Die voluntative deutsche Form entspricht dem Charakter der Selbstverpflichtung.
theological_decisions:
- issue: Bezeichnung der Bundesgruppen
  choice: die Israeliten und die Leviten
  alternative: die Söhne Israels und die Söhne Levis
  rationale: Die hebräischen Sohnesformeln sind hier idiomatische Gruppenbezeichnungen. Natürliches Deutsch darf sie als „Israeliten“ und „Leviten“ wiedergeben; die Parallelität bleibt erhalten.
- issue: Bedeutung von עזב hinsichtlich des Hauses Gottes
  choice: nicht vernachlässigen
  alternative: nicht verlassen / nicht im Stich lassen
  rationale: Die abschließende Verpflichtung betrifft im unmittelbaren Zusammenhang die Versorgung und Aufrechterhaltung des Tempeldienstes. „Vernachlässigen“ gibt diese praktische Tragweite wieder, während die Alternative die grundsätzlich mögliche stärkere Bedeutung des Verbs dokumentiert.
- issue: Satzbezug von וְשָׁם
  choice: 'neuer Satz: „Dort befinden sich ...“'
  alternative: 'Relativanschluss: „wo sich ... befinden“'
  rationale: Das Hebräische setzt mit „und dort“ eine Ortsangabe fort. Ein neuer deutscher Satz bewahrt diesen Bezug, ohne Priester, Torwächter und Sänger sprachlich zu den Gegenständen in den Lagerräumen zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gruppenbezeichnungen sind idiomatisch, die kultischen Begriffe allgemein verständlich. Der abschließende Satz wird als gemeinschaftliche Selbstverpflichtung formuliert.
