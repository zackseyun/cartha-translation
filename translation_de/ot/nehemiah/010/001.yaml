source:
  edition: WLC
  text: וּ/בְ/כָל זֹ֕את אֲנַ֛חְנוּ כֹּרְתִ֥ים אֲמָנָ֖ה וְ/כֹתְבִ֑ים וְ/עַל֙ הֶֽ/חָת֔וּם שָׂרֵ֥י/נוּ לְוִיֵּ֖/נוּ כֹּהֲנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/001.yaml
  text: And because of all this[a], we are making a binding agreement in writing, and on the sealed document are our officials, our Levites[b], and our priests.
translation:
  language: de
  text: Und wegen all dessen treffen wir eine verbindliche Vereinbarung und halten sie schriftlich fest. Auf der versiegelten Urkunde stehen die Namen unserer führenden Männer, unserer Leviten und unserer Priester.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und knapper: »Und bei all diesem schließen wir eine feste Verpflichtung und schreiben sie nieder; und auf dem Versiegelten sind unsere führenden Männer, unsere Leviten und unsere Priester.« Das Hebräische verwendet für das Schließen der Vereinbarung wörtlich die Wendung »eine Verpflichtung schneiden«. Ob mit »auf dem Versiegelten« die Namen beziehungsweise Siegel selbst oder die versiegelte Urkunde gemeint sind, bleibt sprachlich knapp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֹאת
  choice: Und wegen all dessen
  rationale: Die Präposition בְּ blickt hier auf das vorausgehende Bekenntnis und die geschilderten Umstände zurück; die kausale Wiedergabe ist im Deutschen natürlich, während »all dessen« den Rückbezug wahrt.
- source_word: כֹּרְתִים אֲמָנָה
  choice: treffen wir eine verbindliche Vereinbarung
  rationale: כרת ist mit einer Vereinbarung eine feste Wendung für deren Abschluss; אֲמָנָה bezeichnet eine feste, verlässliche Verpflichtung. Die Wiedergabe vermittelt den formellen und bindenden Charakter, ohne das im Deutschen missverständliche Bild des »Schneidens« in den Haupttext zu übernehmen.
- source_word: וְכֹתְבִים
  choice: und halten sie schriftlich fest
  rationale: Das Partizip bezeichnet die schriftliche Fixierung der Vereinbarung. Das Pronomen macht den im Hebräischen knappen Objektbezug im Deutschen deutlich.
- source_word: וְעַל הֶחָתוּם
  choice: Auf der versiegelten Urkunde
  rationale: Das substantivierte Partizip bezeichnet wahrscheinlich das versiegelte Schriftstück. »Urkunde« gibt dessen formellen Charakter natürlich wieder.
- source_word: שָׂרֵינוּ
  choice: unsere führenden Männer
  rationale: שׂרים bezeichnet anerkannte zivile Führungspersonen. »Führende Männer« wahrt den damaligen männlichen Referenzbereich, ohne einen königlichen Rang anzudeuten.
- source_word: לְוִיֵּינוּ
  choice: unsere Leviten
  rationale: Die etablierte deutsche Bezeichnung für diese kultische Gruppe.
- source_word: כֹּהֲנֵינוּ
  choice: unsere Priester
  rationale: Direkte und geläufige Wiedergabe der priesterlichen Gruppe.
