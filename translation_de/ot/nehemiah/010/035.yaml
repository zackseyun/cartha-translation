revisions:
- from: Wir warfen das Los über die Holzgabe – die Priester, die Leviten und das Volk –, um sie nach unseren Großfamilien zu festgesetzten Zeiten Jahr für Jahr zum Haus unseres Gottes zu bringen und auf dem Altar Jahwes, unseres Gottes, zu verbrennen, wie es im Gesetz geschrieben steht.
  to: Wir, die Priester, die Leviten und das Volk, warfen Lose über die Holzgabe, um sie zum Haus unseres Gottes zu bringen, nach unseren Familienverbänden, zu festgesetzten Zeiten, Jahr für Jahr, und sie auf dem Altar Jahwes, unseres Gottes, zu verbrennen, wie es im Gesetz geschrieben steht.
  rationale: Die Überarbeitung stellt die drei Gruppen eindeutig als handelndes Subjekt heraus, gibt den hebräischen Plural bei „Lose“ wieder und ersetzt „Großfamilien“ durch das präzisere, moderne „Familienverbände“. Die Reihenfolge von Zielort, Zuteilung nach Familienverbänden und festgelegten jährlichen Zeiten folgt nun enger dem hebräischen Satzbau. Inhaltliche Deutungen über die ausdrücklich genannte Verbrennung des Holzes hinaus werden nicht ergänzt.
