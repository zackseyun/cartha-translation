  verdict: revise
  source_fidelity: 'Die wesentlichen Elemente des Hebräischen sind zutreffend wiedergegeben: das Loswerfen, die Holzgabe, die drei beteiligten Gruppen, die jährlichen festgelegten Termine, das Verbrennen auf dem Altar, der Gottesname und der Verweis auf die Tora. Die Pluralform גּוֹרָלוֹת wird jedoch besser durch „Lose“ wiedergegeben. Außerdem sollte die Zugehörigkeit von „die Priester, die Leviten und das Volk“ zum Subjekt syntaktisch klarer ausgedrückt werden.'
  naturalness: Der vorliegende Satz ist verständlich, doch die Gedankenstrich-Apposition nach „Wir warfen das Los“ wirkt im Deutschen etwas nachgetragen und lässt die genannten Gruppen kurzfristig wie ein eingeschobenes Objekt erscheinen. Eine Subjekt-Apposition („Wir, die …“) ist klarer. „Familienverbände“ ist für בֵּית אָבוֹת idiomatischer als das etwas unscharfe „Großfamilien“.
  terminology: „Jahwe“ ist eine etablierte deutsche Wiedergabe des Tetragramms. „Haus unseres Gottes“ bewahrt die Ausdrucksweise des Ausgangstextes. „Holzgabe“ ist möglich; sie lässt die kultische Funktion offen genug und vermeidet eine unnötig engere Deutung. „Gesetz“ als Bezeichnung der Tora ist hier angemessen.
  issues:
  - severity: low
    issue: Singular „das Los“ trotz hebräischem Plural
    rationale: גּוֹרָלוֹת steht im Plural. Zwar kann der Singular die deutsche Redewendung bilden, „Lose“ bewahrt Zahl und administrativen Vorgang ohne Unnatürlichkeit.
  - severity: medium
    issue: Unklare syntaktische Einbindung der drei Gruppen
    rationale: Die Gedankenstriche lassen „die Priester, die Leviten und das Volk“ erst nach dem vollständigen Subjekt-Prädikat-Komplex folgen. Als Apposition zu „Wir“ sind die Gruppen klarer und natürlicher zu markieren.
  - severity: low
    issue: „nach unseren Großfamilien“ ist semantisch und idiomatisch etwas unpräzise
    rationale: בֵּית אָבוֹת bezeichnet hier Familien- bzw. Abstammungsverbände als Einheiten der Zuteilung. „Nach unseren Familienverbänden“ vermittelt diese Funktion klarer.
  revised_text: Wir, die Priester, die Leviten und das Volk, warfen Lose über die Holzgabe, um sie zum Haus unseres Gottes zu bringen, nach unseren Familienverbänden, zu festgesetzten Zeiten, Jahr für Jahr, und sie auf dem Altar Jahwes, unseres Gottes, zu verbrennen, wie es im Gesetz geschrieben steht.
