  text: וְ/הַ/גּוֹרָל֨וֹת הִפַּ֜לְנוּ עַל קֻרְבַּ֣ן הָ/עֵצִ֗ים הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ וְ/הָ/עָם֒ לְ֠/הָבִיא לְ/בֵ֨ית אֱלֹהֵ֧י/נוּ לְ/בֵית אֲבֹתֵ֛י/נוּ לְ/עִתִּ֥ים מְזֻמָּנִ֖ים שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בַעֵ֗ר עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/035.yaml
  text: We cast lots concerning the wood offering—the priests[a], the Levites, and the people—to bring it to the house of our God, according to our fathers’ houses, at appointed times year by year, to burn on the altar of Yahweh our God, as it is written in the Law.
translation:
  language: de
  text: Wir, die Priester, die Leviten und das Volk, warfen Lose über die Holzgabe, um sie zum Haus unseres Gottes zu bringen, nach unseren Familienverbänden, zu festgesetzten Zeiten, Jahr für Jahr, und sie auf dem Altar Jahwes, unseres Gottes, zu verbrennen, wie es im Gesetz geschrieben steht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַגּוֹרָלוֹת הִפַּלְנוּ
  choice: Wir warfen das Los
  rationale: Die Hifil-Verbindung von נפל mit גּוֹרָלוֹת ist die übliche Wendung für das Loswerfen. Der deutsche Singular „das Los“ ist in dieser Redewendung natürlich und gibt den Vorgang treffend wieder.
- source_word: עַל קֻרְבַּן הָעֵצִים
  choice: über die Holzgabe
  rationale: עַל bezeichnet hier die Angelegenheit, über die das Los entscheidet. „Holzgabe“ bringt knapp zum Ausdruck, dass Holz für den Altardienst bereitgestellt wurde.
- source_word: הַכֹּהֲנִים הַלְוִיִּם וְהָעָם
  choice: die Priester, die Leviten und das Volk
  rationale: Die drei ausdrücklich genannten beteiligten Gruppen bleiben vollständig erhalten. Die Einschübe-Striche bilden ihre lockere syntaktische Zuordnung zum Loswerfen ab.
- source_word: לְהָבִיא
  choice: um sie … zu bringen
  rationale: Der Infinitiv bezeichnet den Zweck der Losentscheidung. Das Pronomen „sie“ bezieht sich grammatisch auf die feminine „Holzgabe“.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: zum Haus unseres Gottes
  rationale: „Haus“ bewahrt die hebräische Ausdrucksweise für den Tempel und ist im Zusammenhang verständlich.
- source_word: לְבֵית אֲבֹתֵינוּ
  choice: nach unseren Großfamilien
  rationale: בֵּית אָבוֹת bezeichnet die Abstammungs- beziehungsweise Familienverbände, denen die Zuständigkeit zugeteilt wurde. „Großfamilien“ ist im heutigen Deutsch verständlicher als die wörtliche, aber missverständliche Form „Vaterhäuser“.
- source_word: לְעִתִּים מְזֻמָּנִים
  choice: zu festgesetzten Zeiten
  rationale: Die Wendung bezeichnet vorher bestimmte, planmäßig angesetzte Termine.
- source_word: שָׁנָה בְשָׁנָה
  choice: Jahr für Jahr
  rationale: Die distributive Formulierung drückt die regelmäßige jährliche Wiederholung aus und wird idiomatisch bewahrt.
- source_word: לְבַעֵר עַל מִזְבַּח
  choice: auf dem Altar … zu verbrennen
  rationale: בער bezeichnet hier das Verbrennen des gelieferten Holzes auf dem Altar. Die Übersetzung bleibt nahe an der unmittelbaren Syntax und ergänzt nicht ausdrücklich „das Feuer zu unterhalten“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: wie es im Gesetz geschrieben steht
  rationale: Die feste Formel verweist auf die schriftliche Weisung der Tora. „Gesetz“ ist hier als Bezeichnung dieses anerkannten Weisungskorpus großgeschrieben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen ausdrücklich. „Jahwe“ bewahrt ihn, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Funktion des Holzes auf dem Altar
  choice: zu verbrennen
  alternative: das Feuer auf dem Altar zu unterhalten
  rationale: Die weiter gefasste Alternative ist sachlich plausibel, erläutert aber den kultischen Zweck stärker, als es das Verb בער an dieser Stelle ausdrücklich tut. Die gewählte Fassung erhält die knappe Formulierung und ihre mögliche Bedeutungsbreite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Gedankengang, wird aber durch Gedankenstriche und eine natürliche Zweckkonstruktion lesbar gehalten. „Großfamilien“ vermittelt die historische Sozialstruktur ohne den heute unklaren Fachausdruck „Vaterhäuser“.
