  yaml_path: translation/ot/nehemiah/010/015.yaml
  text: 'the heads of the people: Parosh[a], Pahath-moab, Elam, Zattu, Bani.'
translation:
  language: de
  text: 'die Oberhäupter des Volkes: Parosch[a], Pahat-Moab, Elam, Sattu, Bani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die Anführer des Volkes“. Wörtlich steht im Hebräischen: „die Häupter des Volkes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי
  choice: die Oberhäupter
  rationale: Der Status constructus im Plural bezeichnet idiomatisch Personen in leitender Stellung. „Oberhäupter“ bewahrt die hebräische Haupt-Metapher und klingt im Deutschen bei Sippen- und Volksvertretern natürlich.
- source_word: הָעָם
  choice: des Volkes
  rationale: עַם bezeichnet hier die Gemeinschaft Judas beziehungsweise Jerusalems, die in der Bundesliste vertreten ist; „Volk“ ist in diesem Zusammenhang die übliche Wiedergabe.
- source_word: פַּרְעֹשׁ
  choice: Parosch
  rationale: Personen- beziehungsweise Sippenname, nach gängiger deutscher Bibeltransliteration wiedergegeben.
- source_word: פַּחַת מוֹאָב
  choice: Pahat-Moab
  rationale: Zusammengesetzter Personen- beziehungsweise Sippenname; der Bindestrich macht die Zweigliedrigkeit kenntlich, ohne den Namen zu übersetzen.
- source_word: עֵילָם
  choice: Elam
  rationale: In dieser Liste ist das Wort als Personen- beziehungsweise Sippenname zu verstehen und wird transliteriert.
- source_word: זַתּוּא
  choice: Sattu
  rationale: Personen- beziehungsweise Sippenname; „Sattu“ entspricht der im Deutschen üblichen Wiedergabe.
- source_word: בָּנִי
  choice: Bani
  rationale: Die vorliegende hebräische Form wird ohne Angleichung an ähnlich lautende Namen als „Bani“ wiedergegeben.
