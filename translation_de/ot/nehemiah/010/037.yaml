  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Abfolge und die kultisch-rechtliche Aussage des Hebräischen zuverlässig wieder: Erstgeborene von Söhnen und Vieh, der Verweis auf das Gesetz, die Spezifizierung von Rindern und Kleinvieh sowie die Übergabe an die diensttuenden Priester im Haus Gottes. Die Formulierung „Erstgeborenen unserer Söhne“ ist im Deutschen jedoch genitivisch mehrdeutig und kann die Erstgeborenen der Söhne (also Enkel) nahelegen. „Unsere erstgeborenen Söhne“ gibt die gemeinte Relation eindeutig wieder.'
  naturalness: Die Satzgestaltung als Fortsetzung mit einleitendem „und“ und abschließendem Infinitiv ist angesichts des Kontextes angemessen. Die geringfügige Umstellung bei den menschlichen Erstgeborenen macht den Satz klarer und bleibt in modernem, würdigem Standarddeutsch.
  terminology: „Vieh“, „Rinder“, „Kleinvieh“, „Gesetz“, „Haus unseres Gottes“ und „Dienst tun“ sind sachgerecht. „Kleinvieh“ wahrt die offene Sammelbezeichnung für Schafe und Ziegen. Die Fußnoten sind inhaltlich passend und an den einschlägigen Ausdrücken verankert.
