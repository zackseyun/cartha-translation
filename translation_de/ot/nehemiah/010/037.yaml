base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/037.yaml
  text: and the firstborn of our sons and of our livestock[a], as it is written in the Law, and the firstborn of our herds and of our flocks, to bring to the house of our God[b], to the priests who minister in the house of our God.
translation:
  language: de
  text: und unsere erstgeborenen Söhne und die Erstgeborenen unseres Viehs[a], wie es im Gesetz geschrieben steht, sowie die Erstgeburten unserer Rinder und unseres Kleinviehs[b] zum Haus unseres Gottes zu den Priestern zu bringen, die im Haus unseres Gottes Dienst tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die Befolgung der Weisungen der Tora über die Erstgeborenen von Menschen und Tieren.
    reason: cross_reference
  - marker: b
    text: Das mit „Kleinvieh“ wiedergegebene hebräische Wort umfasst Schafe und Ziegen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרוֹת בָּנֵינוּ
  choice: die Erstgeborenen unserer Söhne
  rationale: Gibt die Erstgeborenen unter den Söhnen wieder, ohne über den hebräischen Ausdruck hinaus Einzelheiten zur Auslösung hinzuzufügen.
- source_word: וּבְהֶמְתֵּינוּ
  choice: und unseres Viehs
  rationale: בְּהֵמָה bezeichnet hier allgemein die gehaltenen Nutztiere; „Vieh“ ist im Deutschen knapp und natürlich.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: wie es im Gesetz geschrieben steht
  rationale: Die feste Wendung verweist auf die schriftlich niedergelegte Tora; „Gesetz“ bezeichnet hier diese konkrete Weisung.
- source_word: בְּכוֹרֵי בְקָרֵינוּ וְצֹאנֵינוּ
  choice: die Erstgeburten unserer Rinder und unseres Kleinviehs
  rationale: בָּקָר bezeichnet vor allem Rinder, צֹאן das aus Schafen und Ziegen bestehende Kleinvieh. „Erstgeburten“ ist bei Tieren natürliches Deutsch.
- source_word: לְהָבִיא
  choice: zu bringen
  rationale: Der Infinitiv führt die Verpflichtung aus dem Zusammenhang als Zweck beziehungsweise Inhalt weiter.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: zum Haus unseres Gottes
  rationale: Bewahrt das hebräische Bild vom „Haus“ Gottes, obwohl sachlich der Tempel gemeint ist.
- source_word: לַכֹּהֲנִים הַמְשָׁרְתִים
  choice: zu den Priestern, die … Dienst tun
  rationale: Das Partizip beschreibt den fortdauernden kultischen Dienst der Priester in verständlicher heutiger Sprache.
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: im Haus unseres Gottes
  rationale: Die Wiederholung des Ausdrucks wird wie im Hebräischen beibehalten.
theological_decisions:
- issue: Soll בֵּית אֱלֹהֵינוּ als „Haus unseres Gottes“ oder deutend als „Tempel unseres Gottes“ übersetzt werden?
  choice: Haus unseres Gottes
  alternative: Tempel unseres Gottes
  rationale: „Haus unseres Gottes“ entspricht unmittelbar dem hebräischen Wortlaut und lässt den Tempelbezug ohne unnötige interpretierende Ersetzung erkennen.
- issue: Soll bei den Erstgeborenen ausdrücklich zwischen Auslösung und Opfer unterschieden werden?
  choice: Keine entsprechende Erläuterung in den Haupttext aufnehmen
  alternative: die auszulösenden Erstgeborenen beziehungsweise Erstlingsopfer
  rationale: Der Vers verweist auf die Weisung des Gesetzes, erläutert an dieser Stelle aber nicht, wie sie bei Menschen und verschiedenen Tieren jeweils vollzogen wird. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als syntaktische Fortsetzung des vorausgehenden Zusammenhangs formuliert. Die Wiederholung „Haus unseres Gottes“ und die rechtlich-kultische Zurückhaltung des Ausgangstextes werden bewahrt.
