- source_word: מַלְכִּיָּה
  choice: Malkija
  rationale: Hebräischer Personenname. „Malkija“ bewahrt die Konsonantenstruktur und gibt das abschließende theophore Element יָה nach deutscher Konvention mit „-ja“ wieder.
