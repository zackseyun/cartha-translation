base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/010.yaml
  text: 'and the Levites: Jeshua son of Azaniah[a], Binnui from the sons of Henadad[b], Kadmiel.'
translation:
  language: de
  text: 'Und die Leviten: Jeschua, Sohn Asanjas, Binnui aus dem Geschlecht Henadads, Kadmiël.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Und die Leviten
  rationale: Das einleitende וְ verbindet den Vers mit der vorausgehenden Liste; der bestimmte Plural wird direkt wiedergegeben. Der folgende Doppelpunkt entspricht dem nominalen Listenstil ohne finites Verb.
- source_word: וְיֵשׁוּעַ
  choice: Jeschua
  rationale: Der Personenname wird in geläufiger deutscher Transliteration wiedergegeben. Das zusätzliche וְ muss nach der Einleitung mit Doppelpunkt im Deutschen nicht eigens als „und“ erscheinen.
- source_word: בֶּן אֲזַנְיָה
  choice: der Sohn Asanjas
  rationale: Die genealogische Verbindung wird natürlich und zugleich formnah wiedergegeben; der Genitiv kennzeichnet Asanja als Vater.
- source_word: בִּנּוּי
  choice: Binnui
  rationale: Der Personenname wird nach üblicher deutscher Form transliteriert.
- source_word: מִבְּנֵי חֵנָדָד
  choice: aus der Nachkommenschaft Henadads
  rationale: מִן bezeichnet hier die Zugehörigkeit bzw. Herkunft; בְּנֵי meint im genealogischen Zusammenhang nicht notwendig unmittelbare Söhne, sondern Angehörige der Nachkommenschaft oder Sippe.
- source_word: קַדְמִיאֵל
  choice: Kadmiël
  rationale: Die deutsche Transliteration bewahrt die Vokalfolge; das Trema zeigt, dass i und e getrennt gesprochen werden.
