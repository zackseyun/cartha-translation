id: NEH.10.36
reference: Nehemiah 10:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/לְ/הָבִ֞יא אֶת בִּכּוּרֵ֣י אַדְמָתֵ֗/נוּ וּ/בִכּוּרֵ֛י כָּל פְּרִ֥י כָל עֵ֖ץ שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בֵ֖ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/036.yaml
  text: and to bring the firstfruits of our land and the firstfruits of all the fruit of every tree[a], year by year, to the house of Yahweh[b],
translation:
  language: de
  text: und Jahr für Jahr die Erstlingsgaben unseres Ackerbodens[a] und die Erstlingsgaben von allen Früchten jedes Baumes zum Haus Jahwes[b] zu bringen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: unseres Landes; das hebräische Wort kann den Erdboden, das Ackerland oder das Land bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Haus Jahwes“ ist hier der Tempel gemeint.
    reason: clarification
lexical_decisions:
- source_word: וּ/לְ/הָבִיא
  choice: und … zu bringen
  rationale: Der Infinitiv mit vorangestelltem וּ setzt die Reihe der im Zusammenhang genannten Bundesverpflichtungen fort. „Bringen“ gibt den kultischen Zusammenhang natürlich und genau wieder.
- source_word: בִּכּוּרֵי
  choice: die Erstlingsgaben
  rationale: Der Ausdruck bezeichnet die ersten Erträge, die Gott dargebracht werden. „Erstlingsgaben“ bewahrt sowohl den landwirtschaftlichen als auch den kultischen Sinn.
- source_word: אַדְמָתֵנוּ
  choice: unseres Ackerbodens
  rationale: אֲדָמָה bezeichnet hier den landwirtschaftlich genutzten Boden. „Ackerboden“ passt zum Erntezusammenhang, während „Land“ auch territorial verstanden werden könnte.
- source_word: וּ/בִכּוּרֵי כָּל פְּרִי כָל עֵץ
  choice: und die Erstlingsgaben von allen Früchten jedes Baumes
  rationale: Die Wiedergabe erhält die Wiederholung von „Erstlingsgaben“ und die umfassende Aussage der hebräischen Genitivfolge, bleibt dabei aber im Deutschen verständlich.
- source_word: שָׁנָה בְ/שָׁנָה
  choice: Jahr für Jahr
  rationale: Die Wendung bezeichnet eine regelmäßig wiederkehrende jährliche Verpflichtung.
- source_word: לְ/בֵית יְהוָה
  choice: zum Haus Jahwes
  rationale: „Haus“ entspricht dem hebräischen בֵּית und bezeichnet hier den Tempel; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Text enthält den Eigennamen יהוה. „Jahwe“ gibt den offenbarten Bundesnamen direkt wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בֵּית יְהוָה
  choice: Haus Jahwes
  alternative: Tempel Jahwes
  rationale: „Haus Jahwes“ bewahrt die Bildsprache und Form des Ausgangstextes; dass damit der Tempel gemeint ist, wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt als Fortsetzung der Verpflichtungsliste offen; „Erstlingsgaben“ erhält den kultischen Gehalt, ohne die landwirtschaftliche Bedeutung zu verdecken.
