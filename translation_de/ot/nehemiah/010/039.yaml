source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/כֹּהֵ֧ן בֶּֽן אַהֲרֹ֛ן עִם הַ/לְוִיִּ֖ם בַּ/עְשֵׂ֣ר הַ/לְוִיִּ֑ם וְ/הַ/לְוִיִּ֞ם יַעֲל֨וּ אֶת מַעֲשַׂ֤ר הַֽ/מַּעֲשֵׂר֙ לְ/בֵ֣ית אֱלֹהֵ֔י/נוּ אֶל הַ/לְּשָׁכ֖וֹת לְ/בֵ֥ית הָ/אוֹצָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/039.yaml
  text: And the priest[a], a son of Aaron, shall be with the Levites when the Levites collect the tithe, and the Levites shall bring up the tithe of the tithe to the house of our God[b], to the chambers of the storehouse.
translation:
  language: de
  text: Und der Priester, ein Sohn Aarons, soll bei den Leviten sein, wenn die Leviten den Zehnten einziehen. Die Leviten sollen den Zehnten vom Zehnten[a] zum Haus unseres Gottes hinaufbringen, in die Kammern des Vorratshauses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Zehnten des Zehnten“. Gemeint ist der Anteil, den die Leviten selbst von dem Zehnten abgeben, den sie erhalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Schatzhauses“. Gemeint ist hier wahrscheinlich ein Lagerbereich für Zehnten und Opfergaben, nicht speziell eine Geldschatzkammer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: soll ... sein
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat in diesem verpflichtenden Kontext prospektive Bedeutung; „soll ... sein“ bewahrt den rechtlich-bündischen Ton.
- source_word: הַכֹּהֵן בֶּן־אַהֲרֹן
  choice: der Priester, ein Sohn Aarons
  rationale: Die Formulierung folgt dem Hebräischen eng und macht die Zugehörigkeit zur aaronitischen Priesterlinie transparent.
- source_word: בַּעְשֵׂר הַלְוִיִּם
  choice: wenn die Leviten den Zehnten einziehen
  rationale: Der Infinitiv bezeichnet hier den Vorgang des Erhebens beziehungsweise Einsammelns des Zehnten; der temporale Nebensatz ist im Deutschen natürlich und präzise.
- source_word: יַעֲלוּ
  choice: sollen ... hinaufbringen
  rationale: Die Hifil-Form von עלה bedeutet „hinaufbringen“; die Richtungsnuance zum Heiligtum bleibt erhalten.
- source_word: מַעֲשַׂר הַמַּעֲשֵׂר
  choice: den Zehnten vom Zehnten
  rationale: Diese verständliche, zugleich formnahe Wiedergabe bezeichnet den Anteil, den die Leviten aus dem von ihnen empfangenen Zehnten abgeben.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: zum Haus unseres Gottes
  rationale: Die traditionelle sachlich genaue Bezeichnung des Tempels bewahrt die Bundes- und Gemeinschaftssprache des hebräischen Ausdrucks.
- source_word: הַלְּשָׁכוֹת
  choice: die Kammern
  rationale: Gemeint sind Räume im Tempelkomplex, die hier der Lagerung von Abgaben dienen.
- source_word: לְבֵית הָאוֹצָר
  choice: des Vorratshauses
  rationale: „Vorratshaus“ passt zu den eingelagerten Zehnten und Opfergaben und vermeidet die Verengung auf Geldbestände.
theological_decisions:
- issue: Bezeichnung der Lagerräume des Tempels
  choice: Vorratshaus
  alternative: Schatzhaus
  rationale: Der Zusammenhang betrifft vor allem Naturalabgaben. „Vorratshaus“ bildet diese Funktion besser ab, ohne eine primär finanzielle Schatzkammer nahezulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit maßvoll formaler Syntax. Die kultischen Begriffe bleiben erkennbar, werden aber ohne unnötig altertümliche Sprache wiedergegeben.
