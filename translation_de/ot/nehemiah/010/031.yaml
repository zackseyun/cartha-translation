  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲשֶׁ֛ר לֹא נִתֵּ֥ן בְּנֹתֵ֖י/נוּ לְ/עַמֵּ֣י הָ/אָ֑רֶץ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם לֹ֥א נִקַּ֖ח לְ/בָנֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/031.yaml
  text: and that we will not give our daughters to the peoples of the land[b][a], nor take their daughters for our sons.
translation:
  language: de
  text: und dass wir unsere Töchter nicht den Völkern des Landes geben und ihre Töchter nicht für unsere Söhne nehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Nehmen“ bedeutet hier: zur Frau nehmen, also heiraten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: und dass
  rationale: Die Wendung führt im Zusammenhang der Bundesverpflichtung eine weitere, vom vorangehenden Schwur abhängige Bestimmung ein; „und dass“ gibt sowohl die Verknüpfung als auch die Unterordnung natürlich wieder.
- source_word: לֹא נִתֵּן בְּנֹתֵינוּ
  choice: wir unsere Töchter nicht … geben
  rationale: Das Yiqtol bezeichnet hier die unter Eid eingegangene Verpflichtung. Im Deutschen kann das Präsens in dieser koordinierten Verpflichtungsform den bindenden Zukunftsbezug idiomatisch ausdrücken.
- source_word: לְעַמֵּי הָאָרֶץ
  choice: den Völkern des Landes
  rationale: Der Plural עַמֵּי wird als „Völkern“ bewahrt; „des Landes“ gibt die hebräische Genitivverbindung wieder, ohne sie als „heidnisch“, „fremd“ oder bloß „Einwohner“ auszudeuten.
- source_word: וְאֶת בְּנֹתֵיהֶם לֹא נִקַּח
  choice: und ihre Töchter nicht … nehmen
  rationale: „Nehmen“ bewahrt die Lexik und die Gegenüberstellung zu „geben“. Im Kontext der Töchter und Söhne ist die Eheschließung gemeint; dies wird in der Fußnote verdeutlicht.
- source_word: לְבָנֵינוּ
  choice: für unsere Söhne
  rationale: Die geschlechtsspezifische Pluralform wird genau wiedergegeben.
theological_decisions:
- issue: Das Heiratsverbot wiedergeben, ohne ethnische oder religiöse Zusätze einzutragen
  choice: „den Völkern des Landes“ und die wechselseitige Formulierung mit „geben“ und „nehmen“ beibehalten
  alternative: „den heidnischen/fremden Völkern des Landes“ oder „den Bewohnern des Landes“
  rationale: Der Vers formuliert die Verpflichtung mit dem pluralischen Ausdruck „Völker des Landes“. Zusätze wie „heidnisch“ oder „fremd“ würden die unmittelbare Aussage interpretierend verengen; „Bewohner“ würde den Plural und die soziale Bezeichnung glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt wegen des einleitenden וַאֲשֶׁר bewusst als Fortsetzung des vorausgehenden Zusammenhangs gestaltet. Der hebräische Plural „Völker“ wird erhalten; die eheliche Bedeutung von „nehmen“ wird knapp erläutert.
