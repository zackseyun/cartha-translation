  yaml_path: translation/ot/nehemiah/010/011.yaml
  text: 'and their brothers: Shebaniah, Hodiah, Kelita, Pelaiah, Hanan.'
translation:
  language: de
  text: 'und ihre Brüder: Schebanja, Hodija, Kelita, Pelaja, Hanan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: und ihre Brüder
  rationale: Die Konjunktion ו und אֲחֵי mit dem Suffix der 3. Person maskulin Plural bedeuten wörtlich und im Kontext der männlichen Unterzeichnerliste am natürlichsten „und ihre Brüder“. „Verwandten“ wäre weiter und stärker deutend.
- source_word: שְׁבַנְיָה
  choice: Schebanja
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition und deutscher Laut-Buchstaben-Zuordnung wiedergegeben.
- source_word: הוֹדִיָּה
  choice: Hodija
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren Transliteration wiedergegeben; j entspricht dabei dem konsonantischen Jod.
- source_word: קְלִיטָא
  choice: Kelita
  rationale: Direkte, gut lesbare Wiedergabe des hebräischen Personennamens.
- source_word: פְּלָאיָה
  choice: Pelaja
  rationale: Der Personenname wird in deutscher Transliteration wiedergegeben; die Endung -ja bildet den Namensbestandteil יָה angemessen ab.
- source_word: חָנָן
  choice: Hanan
  rationale: Direkte und im Deutschen geläufige Wiedergabe des hebräischen Personennamens.
theological_decisions: []
