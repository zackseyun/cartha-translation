source:
  edition: WLC
  text: וְ/עַמֵּ֣י הָ/אָ֡רֶץ הַֽ/מְבִיאִים֩ אֶת הַ/מַּקָּח֨וֹת וְ/כָל שֶׁ֜בֶר בְּ/י֤וֹם הַ/שַּׁבָּת֙ לִ/מְכּ֔וֹר לֹא נִקַּ֥ח מֵ/הֶ֛ם בַּ/שַּׁבָּ֖ת וּ/בְ/י֣וֹם קֹ֑דֶשׁ וְ/נִטֹּ֛שׁ אֶת הַ/שָּׁנָ֥ה הַ/שְּׁבִיעִ֖ית וּ/מַשָּׁ֥א כָל יָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/032.yaml
  text: As for the peoples of the land who bring goods and any grain on the Sabbath day to sell[a], we will not buy from them on the Sabbath or on a holy day; and we will forego the seventh year and every debt.
translation:
  language: de
  text: Wenn die Völker des Landes am Sabbattag Waren und allerlei Getreide zum Verkauf bringen, werden wir ihnen am Sabbat oder an einem heiligen Tag nichts abkaufen. Auch werden wir im siebten Jahr die Felder brachliegen lassen und auf jede Schuldforderung verzichten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf jeden Anspruch“ beziehungsweise „auf jede Abgabe“. Die hebräische Wendung lautet wörtlich etwa: „die Last/Forderung jeder Hand“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֵּי הָאָרֶץ
  choice: die Völker des Landes
  rationale: Bewahrt den hebräischen Plural und bezeichnet im Zusammenhang die nichtjüdischen Bevölkerungsgruppen der Umgebung, ohne sie zu einer einzigen Gruppe zusammenzufassen.
- source_word: הַמְבִיאִים
  choice: wenn ... bringen
  rationale: Das attributive Partizip beschreibt ein wiederkehrendes Verhalten; als Bedingungssatz klingt die Bestimmung im modernen Deutschen natürlich.
- source_word: הַמַּקָּחוֹת
  choice: Waren
  rationale: Bezeichnet Handelsgüter oder Verkaufsware und ist im heutigen Deutsch klar und umfassend.
- source_word: וְכָל שֶׁבֶר
  choice: und allerlei Getreide
  rationale: שֶׁבֶר bezeichnet im Handelszusammenhang gewöhnlich Getreide; „allerlei“ gibt die umfassende Bedeutung von כָל idiomatisch wieder.
- source_word: לֹא נִקַּח מֵהֶם
  choice: werden wir ihnen ... nichts abkaufen
  rationale: לקח bedeutet grundsätzlich „nehmen“, meint hier wegen des ausdrücklichen Verkaufszusammenhangs jedoch „kaufen“.
- source_word: וּבְיוֹם קֹדֶשׁ
  choice: oder an einem heiligen Tag
  rationale: Nach der Verneinung gibt „oder“ die Ausweitung des Verbots im Deutschen idiomatisch wieder; „heiliger Tag“ bleibt nah am Hebräischen.
- source_word: וְנִטֹּשׁ אֶת הַשָּׁנָה הַשְּׁבִיעִית
  choice: im siebten Jahr alles ruhen lassen
  rationale: נטשׁ kann „liegen lassen, aufgeben“ bedeuten. Die Formulierung bringt die mit dem siebten Jahr verbundene Unterlassung zum Ausdruck, ohne „das Jahr aufgeben“ unnatürlich wörtlich wiederzugeben.
- source_word: מַשָּׁא כָל יָד
  choice: jede Schuldforderung
  rationale: Die knappe Wendung bezeichnet wahrscheinlich die im siebten Jahr zu erlassende finanzielle Forderung. „Schuldforderung“ wahrt etwas mehr rechtliche Offenheit als das bloße „Schuld“; die unsichere Idiomatik wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Verpflichtungen des siebten Jahres im Schlusssatz
  choice: Das siebte Jahr wird als Zeit des Ruhenlassens und des Verzichts auf Schuldforderungen verstanden.
  alternative: 'Wörtlicher und weniger gedeutet: „wir werden das siebte Jahr und die Last/Forderung jeder Hand aufgeben“.'
  rationale: Der Wortlaut erinnert an die Sabbatjahrbestimmungen zu Ackerbrache und Schuldenerlass. Die Übersetzung macht diesen wahrscheinlichen rechtlich-wirtschaftlichen Sinn verständlich, während die Fußnote die echte Unsicherheit der gedrängten Schlusswendung bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz wird zur natürlichen Wiedergabe des hebräischen Partizipialsatzes konditional formuliert. „Sabbattag“ bewahrt die markierte Formulierung בְּיוֹם הַשַּׁבָּת, während die Wiederaufnahme knapp „am Sabbat“ lautet.
