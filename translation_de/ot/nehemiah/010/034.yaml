source:
  edition: WLC
  text: לְ/לֶ֣חֶם הַֽ/מַּעֲרֶ֡כֶת וּ/מִנְחַ֣ת הַ/תָּמִ֣יד וּ/לְ/עוֹלַ֣ת הַ֠/תָּמִיד הַ/שַּׁבָּת֨וֹת הֶ/חֳדָשִׁ֜ים לַ/מּוֹעֲדִ֗ים וְ/לַ/קֳּדָשִׁים֙ וְ/לַ֣/חַטָּא֔וֹת לְ/כַפֵּ֖ר עַל יִשְׂרָאֵ֑ל וְ/כֹ֖ל מְלֶ֥אכֶת בֵּית אֱלֹהֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/034.yaml
  text: for the bread of the arrangement[a], and for the regular grain offering, and for the regular burnt offering, for the Sabbaths, the new moons, the appointed times, and the holy things, and for the sin offerings to make atonement for Israel[e][d][c][b], and for all the work of the house of our God.
translation:
  language: de
  text: für die Schaubrote[a], für das regelmäßige Speiseopfer und das regelmäßige Brandopfer[b], für die Sabbate, die Neumonde und die festgesetzten Zeiten[c], für die heiligen Dinge[d] und für die Sündopfer[e], um für Israel Sühne zu erwirken, sowie für alle Arbeiten im Haus unseres Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »das Brot der Anordnung«; auch »das aufgelegte Brot«.
    reason: lexical_alternative
  - marker: b
    text: Auch »das beständige Speiseopfer« und »das beständige Brandopfer«.
    reason: lexical_alternative
  - marker: c
    text: Die »festgesetzten Zeiten« schließen die festgelegten Festtage ein.
    reason: lexical_clarification
  - marker: d
    text: Auch »die heiligen Gaben« oder »die geweihten Dinge«.
    reason: lexical_alternative
  - marker: e
    text: »Sündopfer« kann in diesem kultischen Zusammenhang auch als »Reinigungsopfer« verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: die Schaubrote
  rationale: Der Ausdruck bezeichnet wörtlich das »Brot der Anordnung«, also die im Heiligtum aufgelegten Brote. »Schaubrote« ist der geläufige deutsche Kultbegriff; die wörtlicheren Möglichkeiten werden in der Fußnote bewahrt.
- source_word: מִנְחַת הַתָּמִיד
  choice: das regelmäßige Speiseopfer
  rationale: מִנְחָה bezeichnet hier das unblutige, gewöhnlich aus Getreide bestehende Opfer; תָּמִיד hebt seine beständige, vorgeschriebene Wiederkehr hervor. »Regelmäßig« vermeidet die mögliche Verengung auf »täglich«.
- source_word: עֹלַת הַתָּמִיד
  choice: das regelmäßige Brandopfer
  rationale: עֹלָה ist der übliche Ausdruck für das vollständig verbrannte Opfer. »Regelmäßig« gibt die wiederkehrende beziehungsweise beständige Funktion von תָּמִיד wieder.
- source_word: הַשַּׁבָּתוֹת הֶחֳדָשִׁים לַמּוֹעֲדִים
  choice: für die Sabbate, die Neumonde und die festgesetzten Zeiten
  rationale: Die drei Ausdrücke nennen kultische Anlässe. »Festgesetzte Zeiten« bewahrt den weiteren Sinn von מוֹעֲדִים, der Festtage einschließt, ohne darauf beschränkt werden zu müssen.
- source_word: וְלַקֳּדָשִׁים
  choice: für die heiligen Dinge
  rationale: Der Plural קֳדָשִׁים kann geweihte Dinge oder Gaben allgemein bezeichnen. Die breite Wiedergabe vermeidet eine unbegründete Beschränkung allein auf Opfergaben.
- source_word: וְלַחַטָּאוֹת
  choice: für die Sündopfer
  rationale: חַטָּאת bezeichnet im Opferkontext gewöhnlich das Sündopfer. Die mögliche funktionale Wiedergabe als »Reinigungsopfer« bleibt in der Fußnote sichtbar.
- source_word: לְכַפֵּר עַל יִשְׂרָאֵל
  choice: um für Israel Sühne zu erwirken
  rationale: Die Formulierung gibt die kultische Bedeutung von כפר wieder, ohne den genauen Mechanismus der Sühne dogmatisch näher zu bestimmen.
- source_word: וְכֹל מְלֶאכֶת בֵּית אֱלֹהֵינוּ
  choice: sowie für alle Arbeiten am Haus unseres Gottes
  rationale: מְלָאכָה ist ein weiter Ausdruck für Arbeit beziehungsweise Tätigkeit. »Arbeiten am Haus« erhält diese Breite besser als das enger liturgisch klingende »Dienst«.
theological_decisions:
- issue: Wiedergabe der Opferbegriffe
  choice: Die etablierten Begriffe »Speiseopfer«, »Brandopfer«, »Sündopfer« und »Sühne erwirken« werden beibehalten.
  alternative: Deutendere Wiedergaben wie »Gabenopfer«, »Ganzopfer«, »Reinigungsopfer« oder eine dogmatisch näher bestimmte Erklärung der Sühne.
  rationale: Der Vers zählt Verpflichtungen für den Tempelkult auf. Die gewählten Begriffe bilden die hebräischen Kategorien verständlich ab, ohne eine bestimmte spätere Sühnetheorie in den Text einzutragen.
- issue: Bedeutungsumfang von קֳדָשִׁים
  choice: Breit als »die heiligen Dinge« wiedergeben.
  alternative: Auf »heilige Opfergaben« oder »geweihte Gaben« beschränken.
  rationale: Der hebräische Plural legt an dieser Stelle nicht eindeutig fest, welche geweihten Dinge gemeint sind; diese Offenheit bleibt erhalten.
- issue: Zuordnung der Sabbate, Neumonde und festgesetzten Zeiten
  choice: Die Anlässe als eigene, jeweils mit »für« eingeleitete Gruppe wiedergeben.
  alternative: Sie unmittelbar als nähere Bestimmung des regelmäßigen Brandopfers lesen.
  rationale: Die Folge der Präpositionen erlaubt eine aufzählende Lesart. Die deutsche Fassung vermeidet eine syntaktische Festlegung, die diese Anlässe ausschließlich dem regelmäßigen Brandopfer unterordnen würde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählungsstruktur des hebräischen Textes bleibt erkennbar; geläufige deutsche Kultbegriffe werden verwendet, während echte lexikalische Alternativen in den Fußnoten offengehalten werden.
