source:
  edition: WLC
  text: מַחֲזִיקִ֣ים עַל אֲחֵי/הֶם֮ אַדִּירֵי/הֶם֒ וּ/בָאִ֞ים בְּ/אָלָ֣ה וּ/בִ/שְׁבוּעָ֗ה לָ/לֶ֨כֶת֙ בְּ/תוֹרַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר נִתְּנָ֔ה בְּ/יַ֖ד מֹשֶׁ֣ה עֶֽבֶד הָֽ/אֱלֹהִ֑ים וְ/לִ/שְׁמ֣וֹר וְ/לַ/עֲשׂ֗וֹת אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֲדֹנֵ֔י/נוּ וּ/מִשְׁפָּטָ֖י/ו וְ/חֻקָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/030.yaml
  text: They join with their brothers[a], their nobles, and enter into a curse and an oath, to walk in the law of God, which was given by the hand of Moses the servant of God, and to keep and to do all the commandments of Yahweh our Lord[d][c][b], and his judgments and his statutes.
translation:
  language: de
  text: Sie schließen sich ihren Brüdern, den Vornehmen, an[a] und verpflichten sich unter Fluch und Eid[b], nach dem Gesetz Gottes zu leben, das durch Mose, den Diener Gottes, gegeben wurde[c], und alle Gebote Jahwes, unseres Herrn, sowie seine Rechtsbestimmungen und Satzungen zu halten und zu tun[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie binden sich an ihre Brüder, die Vornehmen.“ Die hebräische Wendung bezeichnet einen festen Anschluss in gemeinsamer Bundesverpflichtung.'
    reason: lexical_alternative
  - marker: b
    text: '„Fluch und Eid“ bezeichnen ein feierliches Bundesversprechen: Sie schwören Gehorsam und nehmen für den Fall des Bundesbruchs den Fluch, also die angedrohten Folgen, auf sich.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „das durch die Hand Moses gegeben wurde“. Die hebräische Wendung bedeutet hier, dass das Gesetz durch Mose vermittelt wurde.'
    reason: lexical_alternative
  - marker: d
    text: „Rechtsbestimmungen“ kann auch mit „Ordnungen“ oder „Rechtssätzen“, „Satzungen“ auch mit „Festsetzungen“ wiedergegeben werden. „Halten und tun“ bewahrt die zweigliedrige hebräische Formel für Beachten und Ausführen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲזִיקִים עַל
  choice: schließen sich … an
  rationale: Die Wendung bezeichnet hier den festen Anschluss an andere in gemeinsamer Bundesverpflichtung, nicht bloß ein körperliches Festhalten oder Unterstützen.
- source_word: אֲחֵיהֶם אַדִּירֵיהֶם
  choice: ihren Brüdern, den Vornehmen unter ihnen
  rationale: „Brüder“ bewahrt den maskulinen Verwandtschafts- und Gemeinschaftsbegriff; „die Vornehmen unter ihnen“ gibt den gesellschaftlichen Rang von אַדִּירִים wieder und macht die appositionelle Beziehung im Deutschen verständlich.
- source_word: וּבָאִים בְּאָלָה וּבִשְׁבוּעָה
  choice: treten unter Fluch und Eid
  rationale: Die Formulierung gibt den Eintritt in eine bindende, eidlich bekräftigte Verpflichtung samt angedrohter Sanktion natürlich und würdig wieder.
- source_word: לָלֶכֶת בְּתוֹרַת הָאֱלֹהִים
  choice: nach dem Gesetz Gottes zu leben
  rationale: „Leben nach“ überträgt die hebräische Metapher des Wandelns als Lebensführung in natürliches modernes Deutsch; „Gesetz“ passt zum rechtlich-bundeshaften Zusammenhang von תּוֹרָה.
- source_word: אֲשֶׁר נִתְּנָה בְּיַד מֹשֶׁה
  choice: das durch Mose … gegeben wurde
  rationale: „Durch Mose“ gibt die instrumentale Bedeutung der hebräischen Wendung בְּיַד idiomatisch wieder, ohne den göttlichen Urheber des Gesetzes eigens zu ergänzen.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: den Diener Gottes
  rationale: Bei Mose ist עֶבֶד ein ehrender Titel; „Diener“ ist deshalb sachlich und idiomatisch angemessener als „Sklave“.
- source_word: וְלִשְׁמוֹר וְלַעֲשׂוֹת
  choice: zu halten und zu tun
  rationale: Die beiden Verben bewahren die zweigliedrige Bundesformel, die sowohl treues Beachten als auch tatsächliches Ausführen betont.
- source_word: מִשְׁפָּטָיו וְחֻקָּיו
  choice: seine Rechtsbestimmungen und Satzungen
  rationale: Die beiden deutschen Rechtsbegriffe halten die Unterscheidung der hebräischen Gesetzesbezeichnungen aufrecht, ohne eine sachlich nicht gesicherte Feindifferenzierung einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ gibt ihn im Deutschen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Maskuliner Gemeinschaftsbegriff אֲחֵיהֶם
  choice: ihren Brüdern
  alternative: ihren Angehörigen; ihren Volksgenossen
  rationale: Der hebräische Text verwendet ausdrücklich den maskulinen Plural „Brüder“. Die Übersetzung bewahrt diese Form, ohne den möglichen weiteren Bezug auf die Bundesgemeinschaft auszuschließen.
- issue: Titel עֶבֶד הָאֱלֹהִים für Mose
  choice: Diener Gottes
  alternative: Sklave Gottes
  rationale: In dieser festen Ehrenbezeichnung steht Moses Dienst und Beauftragung im Vordergrund, nicht seine soziale Rechtsstellung.
- issue: Bundesformel „Fluch und Eid“
  choice: unter Fluch und Eid treten
  alternative: sich mit einem Eid unter Fluch verpflichten
  rationale: Die knappe Paarformel bleibt erhalten; eine Fußnote erläutert, dass der Fluch die bei Bundesbruch angenommene Sanktion bezeichnet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem bundesrechtlichem Ton. Die Satzstruktur folgt dem langen Verpflichtungssatz des Hebräischen, wird aber durch „um … und um …“ klar gegliedert. Traditionell-biblische Formeln bleiben dort erhalten, wo sie inhaltliches Gewicht tragen.
