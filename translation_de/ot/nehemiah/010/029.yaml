base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/029.yaml
  text: and the rest of the people—the priests[a], the Levites, the gatekeepers, the singers, the temple servants, and all who had separated themselves from the peoples of the lands to the law of God—their wives, their sons, and their daughters[b], everyone who knew and understood—
translation:
  language: de
  text: Und das übrige Volk – die Priester, die Leviten, die Torwächter, die Sänger, die Tempeldiener[a] und alle, die sich von den Völkern der Länder abgesondert und dem Gesetz Gottes zugewandt hatten –, ihre Frauen, ihre Söhne und ihre Töchter, alle, die Kenntnis und Einsicht hatten[b], –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell auch als „Nethinim“ wiedergegeben; gemeint ist eine besondere Gruppe von Tempeldienern.
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen stehen hier maskuline Singularformen mit kollektiver Bedeutung: wörtlich etwa „jeder, der sich abgesondert hatte … jeder, der Kenntnis und Einsicht hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הָעָם
  choice: Und das übrige Volk
  rationale: שְׁאָר bezeichnet den verbleibenden Teil; „das übrige Volk“ ist im Deutschen natürlich und wahrt den Bezug auf die Bundesgemeinschaft.
- source_word: הַכֹּהֲנִים הַלְוִיִּם הַשּׁוֹעֲרִים הַמְשֹׁרְרִים
  choice: die Priester, die Leviten, die Torwächter, die Sänger
  rationale: Die üblichen deutschen Bezeichnungen geben die genannten Gruppen präzise wieder; מְשֹׁרְרִים meint spezifisch Sänger, nicht allgemein Musiker.
- source_word: הַנְּתִינִים
  choice: die Tempeldiener
  rationale: Die funktionsbezogene Übersetzung ist für heutige Leser verständlicher als die traditionelle Umschrift „Nethinim“.
- source_word: וְכָל הַנִּבְדָּל מֵעַמֵּי הָאֲרָצוֹת אֶל תּוֹרַת הָאֱלֹהִים
  choice: und alle, die sich von den Völkern der Länder abgesondert und dem Gesetz Gottes zugewandt hatten
  rationale: Die Formulierung bildet sowohl die Trennung von den Völkern mit מִן als auch die Ausrichtung auf Gottes Gesetz mit אֶל ab, ohne die schwer verständliche hebräische Konstruktion wörtlich nachzubilden.
- source_word: נְשֵׁיהֶם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: ihre Frauen, ihre Söhne und ihre Töchter
  rationale: Die drei ausdrücklich genannten Gruppen bleiben erhalten; „ihre Frauen“ bezeichnet in diesem Zusammenhang ihre Ehefrauen.
- source_word: כֹּל יוֹדֵעַ מֵבִין
  choice: alle, die erkennen und verstehen konnten
  rationale: Die Partizipien bezeichnen kollektiv diejenigen, die zu bewusster Einsicht und Verständnis fähig waren; die deutsche Fassung macht diesen Sinn idiomatisch deutlich.
theological_decisions:
- issue: Bedeutung der Absonderung zu Gottes Gesetz hin
  choice: „sich von den Völkern der Länder abgesondert und dem Gesetz Gottes zugewandt hatten“
  alternative: „sich von den Völkern der Länder zum Gesetz Gottes hin abgesondert hatten“
  rationale: Die gewählte Fassung bewahrt die doppelte Richtung der hebräischen Aussage – weg von den Völkern, hin zur Tora – ohne daraus eine weitergehende Aussage über Bekehrung oder ethnische Reinheit abzuleiten.
- issue: Maskuliner Singular mit kollektiver Bedeutung
  choice: Im Haupttext mit dem natürlichen deutschen Plural „alle, die …“ wiedergeben und die Form in einer Fußnote erläutern.
  alternative: „jeder, der sich abgesondert hatte … jeder, der erkannte und verstand“
  rationale: Der hebräische maskuline Singular hat hier kollektive Kraft und schließt im unmittelbaren Kontext Frauen, Söhne und Töchter ein. Der deutsche Plural gibt den Gruppenbezug klar wieder, ohne den grammatischen Befund zu verschweigen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Gedankenstriche bilden den langen, in den folgenden Vers hineinführenden Satz nach. „Gesetz Gottes“ wahrt den vertrauten theologischen Ausdruck für תּוֹרָה; „zugewandt“ macht die mit אֶל bezeichnete Ausrichtung verständlich.
