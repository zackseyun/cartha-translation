lexical_decisions:
- source_word: וְעַל
  choice: Und auf
  rationale: Die Verbindung aus Konjunktion und Präposition schließt an den vorherigen Kontext an und führt die auf dem versiegelten Dokument verzeichneten Namen ein.
- source_word: הַחֲתוּמִים
  choice: dem versiegelten Dokument
  rationale: Formal steht ein substantiviertes passives Partizip im Plural („die Versiegelten“). Im administrativen Kontext bezeichnet die Wendung wahrscheinlich metonymisch das versiegelte Schriftstück beziehungsweise die darauf verzeichneten Unterzeichner. Die Wiedergabe wahrt den Sachbezug und ist im Deutschen verständlich.
- source_word: נְחֶמְיָה
  choice: Nehemia
  rationale: Der Personenname wird gemäß der gebräuchlichen deutschen Bibeltradition wiedergegeben.
- source_word: הַתִּרְשָׁתָא
  choice: der Statthalter
  rationale: Der perserzeitliche Amtstitel wird funktional übersetzt. „Statthalter“ bezeichnet das Verwaltungsamt im Deutschen klar; die traditionelle Transliteration wird in der Fußnote genannt.
- source_word: בֶּן חֲכַלְיָה
  choice: der Sohn Hachaljas
  rationale: בֶּן ist die übliche genealogische Angabe. Der Eigenname wird in einer im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: וְצִדְקִיָּה
  choice: und Zedekia
  rationale: Die Konjunktion verbindet den zweiten Namen mit Nehemia; der Personenname folgt der gebräuchlichen deutschen Form.
