source:
  edition: WLC
  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר נִבְנְתָה֙ הַ/חוֹמָ֔ה וָ/אַעֲמִ֖יד הַ/דְּלָת֑וֹת וַ/יִּפָּֽקְד֛וּ הַ/שּׁוֹעֲרִ֥ים וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/001.yaml
  text: When the wall had been built and I had set up the doors[a], the gatekeepers, the singers[b], and the Levites were appointed.
translation:
  language: de
  text: Als die Mauer gebaut war[a] und ich die Türen eingesetzt hatte, wurden die Torhüter, die Sänger und die Leviten bestellt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „gebaut worden war“. Die Form bezeichnet einen abgeschlossenen passiven Vorgang; „wiederaufgebaut“ ist durch den Zusammenhang nahegelegt, steht aber nicht ausdrücklich im hebräischen Verb.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „eingesetzt“, „zugeteilt“ oder „registriert“. Das hebräische Verb kann einen weiteren verwaltungsmäßigen Sinn haben als eine förmliche Bestellung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als
  rationale: Die erzählende Zeitangabe wird im modernen Deutschen natürlich mit „Als“ wiedergegeben; ein formelhaftes „Und es geschah, als“ wäre unnötig schwerfällig.
- source_word: נִבְנְתָה הַחוֹמָה
  choice: die Mauer gebaut war
  rationale: Das passive Nifal von בנה bezeichnet den vollendeten Bau der Mauer. „Gebaut war“ gibt den erreichten Zustand und die zeitliche Vorordnung natürlich wieder, ohne das kontextuell mögliche, aber nicht ausdrücklich bezeichnete „wiederaufgebaut“ einzutragen.
- source_word: וָאַעֲמִיד הַדְּלָתוֹת
  choice: ich die Türen eingesetzt hatte
  rationale: Das Hifil von עמד bedeutet hier, die Türflügel an ihren Platz zu bringen. „Eingesetzt“ ist für Türen idiomatisch und bewahrt ausdrücklich die erste Person.
- source_word: וַיִּפָּקְדוּ
  choice: wurden … bestellt
  rationale: 'Das Nifal von פקד hat hier einen administrativen Sinn: Personen werden für Aufgaben bestimmt bzw. eingesetzt. „Bestellt“ ist prägnant und vermeidet die Wiederholung von „eingesetzt“.'
- source_word: הַשּׁוֹעֲרִים
  choice: die Torhüter
  rationale: „Torhüter“ ist die übliche und sachlich passende Bezeichnung für die mit den Toren betrauten Personen.
- source_word: הַמְשֹׁרְרִים
  choice: die Sänger
  rationale: Die von שׁיר abgeleitete Bezeichnung meint Sänger, häufig im liturgischen Dienst; „Sänger“ ist die direkte Wiedergabe.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: „Leviten“ ist die etablierte deutsche Bezeichnung dieser ethnisch-religiösen Gruppe.
theological_decisions: []
