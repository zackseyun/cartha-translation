  language: en
  yaml_path: translation/ot/nehemiah/007/067.yaml
  text: besides their male and female servants[a], of whom there were 7,337; and they had 245 male and female singers.
translation:
  language: de
  text: Dazu kamen ihre Sklaven und Sklavinnen[a], insgesamt 7.337; und sie hatten 245 Sänger und Sängerinnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener und Dienerinnen“. Die hebräischen Begriffe können allgemeiner wiedergegeben werden; in diesem Zusammenhang bezeichnen sie wahrscheinlich Sklaven und Sklavinnen, die zu den Haushalten gehörten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: Dazu kamen
  rationale: Die Wendung fügt diese Gruppe zu der zuvor genannten Gesamtzahl hinzu und klingt in einer modernen Aufzählung natürlich.
- source_word: עַבְדֵיהֶם וְאַמְהֹתֵיהֶם
  choice: ihre Sklaven und Sklavinnen
  rationale: Die beiden Begriffe bezeichnen männliche und weibliche abhängige Personen. Im Kontext einer Haushaltszählung gibt „Sklaven und Sklavinnen“ den sozialen Status deutlicher wieder als das allgemeinere „Diener und Dienerinnen“.
- source_word: אֵלֶּה
  choice: insgesamt
  rationale: Das wörtliche „diese“ verweist auf die folgende Zahl; „insgesamt“ gibt diese Funktion in idiomatischem Deutsch knapp wieder.
- source_word: שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: '7.337'
  rationale: Die moderne deutsche Zahlenschreibweise bewahrt den genauen Zählwert und passt zum Listencharakter.
- source_word: וְלָהֶם
  choice: und sie hatten
  rationale: Die hebräische Besitzkonstruktion wird im Deutschen natürlich mit „sie hatten“ wiedergegeben.
- source_word: מְשֹׁרֲרִים וּמְשֹׁרֲרוֹת
  choice: Sänger und Sängerinnen
  rationale: Die ausdrücklich männliche und weibliche Form des Hebräischen bleibt erhalten.
- source_word: מָאתַיִם וְאַרְבָּעִים וַחֲמִשָּׁה
  choice: '245'
  rationale: Die Ziffernschreibung ist in einer zahlenreichen Liste übersichtlich und gibt den Wert genau wieder.
