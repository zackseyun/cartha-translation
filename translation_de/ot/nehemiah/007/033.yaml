- source_word: חֲמִשִּׁים וּשְׁנָיִם
  choice: '52'
  rationale: Die hebräische Kardinalzahl bedeutet „zweiundfünfzig“. In einer zahlenreichen Namensliste dient die Ziffernschreibung der Übersichtlichkeit.
