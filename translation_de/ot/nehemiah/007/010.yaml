- source_word: אָרַח
  choice: Arahs
  rationale: Der Personen- beziehungsweise Sippenname wird nach deutscher Bibelnamentradition als „Arah“ transliteriert und wegen der Konstruktion mit „Nachkommen“ in den Genitiv gesetzt.
- source_word: שֵׁשׁ מֵאוֹת חֲמִשִּׁים וּשְׁנָיִם
  choice: '652'
  rationale: Die hebräische Zahl bedeutet sechshundertzweiundfünfzig. In einer listenartigen Zählung ist die Ziffernschreibung knapp, klar und im modernen Deutschen gut lesbar.
