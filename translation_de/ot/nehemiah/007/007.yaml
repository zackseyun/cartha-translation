source:
  edition: WLC
  text: הַ/בָּאִ֣ים עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְחֶמְיָ֡ה עֲ֠זַרְיָה רַֽעַמְיָ֨ה נַחֲמָ֜נִי מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפֶּ֥רֶת בִּגְוַ֖י נְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/007.yaml
  text: 'those who came with Zerubbabel were Jeshua[a], Nehemiah, Azariah, Raamiah, Nahamani, Mordecai, Bilshan, Mispereth, Bigvai, Nehum, and Baanah[c][b]. The number of the men of the people of Israel:'
translation:
  language: de
  text: Die mit Serubbabel kamen, waren Jeschua, Nehemia, Asarja, Raamja[a], Nachamani, Mordechai, Bilschan, Misperet, Bigwai, Nehum[b] und Baana. Die Zahl der Männer des Volkes Israel:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der Parallelliste in Esra 2,2 lautet der Name Reelaja.
    reason: alternative_reading
  - marker: b
    text: In der Parallelliste in Esra 2,2 lautet der Name Rehum.
    reason: alternative_reading
  - marker: c
    text: Diese Formulierung leitet die zahlenmäßige Aufstellung ein, die im nächsten Vers fortgesetzt wird.
    reason: cross_reference
lexical_decisions:
- source_word: הַבָּאִים
  choice: die … kamen
  rationale: Das substantivierte Partizip bezeichnet eine bestimmte Gruppe. Im Zusammenhang der Rückkehrerliste gibt ein deutscher Relativsatz die Form natürlich und präzise wieder.
- source_word: עִם
  choice: mit
  rationale: Die Präposition bezeichnet hier schlicht die Begleitung.
- source_word: זְרֻבָּבֶל
  choice: Serubbabel
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: יֵשׁוּעַ
  choice: Jeschua
  rationale: Die Namensform folgt der hebräischen Gestalt und der im Deutschen für die nachexilische Person üblichen Wiedergabe.
- source_word: רַעַמְיָה
  choice: Raamja
  rationale: Der Haupttext folgt der masoretischen Lesart in Nehemia; die abweichende Form der Parallelliste wird in einer Fußnote genannt.
- source_word: נַחֲמָנִי
  choice: Nachamani
  rationale: Lautnahe deutsche Umschrift des im masoretischen Text vokalisierten Personennamens.
- source_word: מָרְדֳּכַי
  choice: Mordechai
  rationale: Gebräuchliche deutsche Wiedergabe des Personennamens; der Text setzt ihn nicht ausdrücklich mit dem Mordechai des Esterbuches gleich.
- source_word: מִסְפֶּרֶת
  choice: Misperet
  rationale: Lautnahe deutsche Umschrift des Eigennamens ohne die englische Endung -th.
- source_word: נְחוּם
  choice: Nehum
  rationale: Der Haupttext bewahrt die Namensform des masoretischen Textes von Nehemia; die Parallele in Esra wird als Variante vermerkt.
- source_word: מִסְפַּר אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: Die Zahl der Männer des Volkes Israel
  rationale: Die Formulierung erhält sowohl das ausdrücklich männliche אַנְשֵׁי als auch die anschließende Bezeichnung עַם יִשְׂרָאֵל. Der Doppelpunkt macht kenntlich, dass die folgenden Verse die Zahlen entfalten.
theological_decisions:
- issue: Geschlechtsspezifische Sprache in אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: der Männer des Volkes Israel
  alternative: des Volkes Israel; der Männer Israels
  rationale: Das Hebräische nennt ausdrücklich „Männer“ und verbindet dies mit „Volk Israel“. Die Übersetzung bewahrt beide Bestandteile, ohne daraus eine weitergehende Aussage über den Umfang der Rückkehrergemeinschaft abzuleiten.
- issue: Abweichende Namensformen gegenüber Esra 2,2
  choice: Raamja und Nehum im Haupttext
  alternative: Reelaja und Rehum
  rationale: Der Haupttext folgt den Formen der hebräischen Vorlage von Nehemia 7,7 und harmonisiert sie nicht mit der Parallelliste; die Unterschiede bleiben in Fußnoten sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Namensliste bleibt knapp; die ergänzte Satzform „waren“ sorgt für natürlichen deutschen Ausdruck. Die Schlussformel bleibt als Überschrift zur anschließenden Zählung offen.
