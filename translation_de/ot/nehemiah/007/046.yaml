base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/046.yaml
  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[b], the sons of Tabbaoth.'
translation:
  language: de
  text: 'Die Tempeldiener: die Söhne Zihas, die Söhne Hasufas, die Söhne Tabbaots.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: die Tempeldiener
  rationale: Der Ausdruck ist in nachexilischen Texten eine technische Bezeichnung für eine dem Tempeldienst zugeordnete Gruppe. Die funktionsbezogene Wiedergabe ist im Deutschen verständlich und vermeidet eine bloße Transliteration wie »Netinim«.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Die wörtliche Wiedergabe bewahrt die gleichförmige Struktur und den genealogischen Charakter der Liste; gemeint sein können auch Nachkommen beziehungsweise Angehörige einer Sippe.
- source_word: צִחָא
  choice: Ziha
  rationale: Der Eigenname wird nach gängiger deutscher Umschrift wiedergegeben.
- source_word: חֲשֻׂפָא
  choice: Hasufa
  rationale: Der Eigenname wird quellennah und in einer für deutsche Leser gut aussprechbaren Form transliteriert; »Haschufa« ist als alternative Umschrift möglich.
- source_word: טַבָּעוֹת
  choice: Tabbaot
  rationale: Die Umschrift bildet die Konsonantenverdopplung ab; die Endung wird ohne ein im Deutschen unnötiges h wiedergegeben.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Listenregister mit bewahrter dreifacher Formel »die Söhne …«. »Tempeldiener« gibt den technischen Gruppenbegriff verständlich wieder. Der Fußnotenmarker steht unmittelbar am betreffenden Namen.
