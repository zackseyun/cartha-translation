lexical_decisions:
- source_word: בְּנֵי
  choice: Die Nachkommen
  rationale: Der Konstruktplural von בֵּן bedeutet wörtlich „Söhne“, bezeichnet in genealogischen Listen jedoch häufig die Angehörigen einer Familie oder Sippe. „Nachkommen“ gibt diese Funktion im modernen Deutschen natürlich und eindeutig wieder.
- source_word: עַזְגָּד
  choice: Asgad
  rationale: Der Personen- beziehungsweise Familienname wird nach gängiger deutscher Bibeltradition und hebräischer Aussprache als „Asgad“ transkribiert.
- source_word: אַלְפַּיִם שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: '2.322'
  rationale: Die hebräische Zahlenfolge bezeichnet die Gesamtzahl 2.322. Die Ziffernschreibung mit Punkt als Tausendertrennzeichen entspricht üblichen deutschen Konventionen und ist in einer Zählliste besonders übersichtlich.
