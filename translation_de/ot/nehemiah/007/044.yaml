lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: die Sänger
  rationale: Das substantivierte Partizip von שׁיר bezeichnet Menschen, die singen. In dieser Verzeichnisform ist „die Sänger“ natürlich und genauer als das weiter gefasste „die Musiker“.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: בְּנֵי bedeutet wörtlich „Söhne von“, kann in Geschlechts- und Gruppennamen aber auch Nachkommen oder Angehörige einer traditionsgebundenen Gruppe bezeichnen. Die formale Wiedergabe bewahrt diese Ausdrucksweise; die mögliche weitere Bedeutung wird in der Fußnote erläutert.
- source_word: אָסָף
  choice: Asaf
  rationale: Der Personenname wird nach geläufiger deutscher Bibelorthografie transliteriert.
- source_word: מֵאָה אַרְבָּעִים וּשְׁמֹנָה
  choice: '148'
  rationale: Die hebräische Kardinalzahl ist eindeutig. Die Ziffernschreibung entspricht der knappen Form eines Personenverzeichnisses und ist im modernen Deutschen gut verständlich.
