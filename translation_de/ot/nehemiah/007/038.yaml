  rationale: Der Eigenname wird gemäß der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: שְׁלֹשֶׁת אֲלָפִים תְּשַׁע מֵאוֹת וּשְׁלֹשִׁים
