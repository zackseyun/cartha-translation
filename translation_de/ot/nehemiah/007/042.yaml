lexical_decisions:
- source_word: בְּנֵי
  choice: Die Nachkommen
  rationale: Der Konstruktplural von בֵּן bezeichnet in genealogischen und statistischen Listen häufig die Angehörigen einer Familie oder Sippe. „Nachkommen“ gibt diese Funktion im modernen Deutschen natürlicher und eindeutiger wieder als das wörtliche „Söhne“.
- source_word: חָרִם
  choice: Harims
  rationale: Der Personen- beziehungsweise Familienname wird in der im Deutschen etablierten biblischen Form „Harim“ transliteriert und wegen der Konstruktion mit „Nachkommen“ als Genitivattribut verwendet.
- source_word: אֶלֶף שִׁבְעָה עָשָׂר
  choice: '1.017'
  rationale: Die hebräische Zahlfolge bedeutet idiomatisch „eintausendsiebzehn“. In der Zählliste sorgt die übliche deutsche Ziffernschreibung mit Tausenderpunkt für Übersichtlichkeit.
