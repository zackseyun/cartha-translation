lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der Status-constructus-Plural von בֵּן bezeichnet in dieser Rückkehrerliste die Angehörigen einer Familie beziehungsweise Abstammungslinie. „Die Söhne“ bewahrt die formale Struktur und den würdevollen Listenstil; „die Nachkommen“ wäre eine mögliche, aber stärker deutende Wiedergabe.
- source_word: בֵבָי
  choice: Bebais
  rationale: Der Personenname wird nach üblicher deutscher Form als „Bebai“ transliteriert und aufgrund der Konstruktion mit „Söhne“ idiomatisch in den Genitiv gesetzt.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וּשְׁמֹנָה
  choice: sechshundertachtundzwanzig
  rationale: Die hebräische Kardinalzahl ergibt exakt 628 und wird nach heutiger deutscher Rechtschreibung als ein Wort wiedergegeben.
theological_decisions: []
translation_notes:
  register: Knapp gehaltener, würdevoller Listenstil in modernem Standarddeutsch. Der Doppelpunkt macht die elliptische Zuordnung der genannten Personenzahl natürlich verständlich, ohne ein im Hebräischen nicht ausdrücklich vorhandenes Substantiv wie „Personen“ einzufügen.
