  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition aus dem Hebräischen transliteriert und nicht übersetzt.
- source_word: שְׁלֹשׁ מֵאוֹת שִׁבְעִים וּשְׁנָיִם
  choice: '372'
  rationale: Die hebräische Kardinalzahl wird im knappen Stil einer Zählung als Ziffer wiedergegeben; ihr Wert bleibt genau erhalten.
