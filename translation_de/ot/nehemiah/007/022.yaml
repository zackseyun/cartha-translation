lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der Status constructus Plural von בֵּן bezeichnet in diesem Namens- und Rückkehrerverzeichnis die Angehörigen einer Familie beziehungsweise Sippe. „Die Söhne“ bewahrt die knappe Form und die wiederkehrende Struktur des hebräischen Registers.
- source_word: חָשֻׁם
  choice: Haschum
  rationale: Der Personen- beziehungsweise Familienname wird nach gängiger deutscher Bibelnamen-Schreibung transliteriert.
- source_word: שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וּשְׁמֹנָה
  choice: '328'
  rationale: Die hebräische Zahlenfolge bedeutet eindeutig „dreihundertachtundzwanzig“. In der listenartigen Darstellung gibt die Ziffernschreibung den exakten Gesamtwert knapp und natürlich wieder.
