  text: the men of Bethel and Ai[a], one hundred twenty-three.
translation:
  language: de
  text: 'die Männer von Bethel und Ai[a]: 123.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Leute aus Bethel und Ai“. Wörtlich steht im Hebräischen: „die Männer von Bethel und Ai“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: die Männer von
  rationale: Der Status-constructus-Plural von אִישׁ bezeichnet hier eine nach Herkunftsort bestimmte Gruppe. „Die Männer von“ gibt die maskuline Form direkt wieder; „die Leute aus“ oder „die Einwohner von“ wären sinngemäß möglich, aber weniger formnah.
- source_word: בֵית אֵל
  choice: Bethel
  rationale: Der Ortsname wird nach der im Deutschen üblichen biblischen Schreibweise wiedergegeben und nicht als „Haus Gottes“ übersetzt.
- source_word: וְהָעָי
  choice: und Ai
  rationale: Die Konjunktion wird mit „und“ wiedergegeben. Der hebräische Artikel vor עַי wird bei dem im Deutschen etablierten Ortsnamen „Ai“ nicht eigens ausgedrückt.
- source_word: מֵאָה עֶשְׂרִים וּשְׁלֹשָׁה
  choice: '123'
  rationale: Die Zahl wird exakt wiedergegeben. In der listenartigen Zählung ist die Ziffernschreibung im modernen Deutschen knapp und gut lesbar.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Listenregister. Die formnahe Wendung „die Männer von“ bleibt im Haupttext erhalten; eine natürlichere, geschlechtsübergreifend verstandene Alternative wird in der Fußnote genannt.
