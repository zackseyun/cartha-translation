base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/057.yaml
  text: 'The sons of Solomon’s servants: the sons of Sotai[a], the sons of Sophereth[b], the sons of Perida.'
translation:
  language: de
  text: 'Die Nachkommen der Diener Salomos: die Nachkommen Sotais, die Nachkommen Soferets und die Nachkommen Peridas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Nachkommen
  rationale: In dieser nachexilischen Rückkehrerliste bezeichnet der Ausdruck eine Familienlinie oder Sippe und nicht notwendig unmittelbare Söhne. „Nachkommen“ gibt die gemeinte Zugehörigkeit im heutigen Deutsch natürlich wieder.
- source_word: עַבְדֵי
  choice: Diener
  rationale: Die Verbindung עַבְדֵי שְׁלֹמֹה ist hier eine überlieferte Gruppenbezeichnung. „Diener“ bewahrt die mögliche Spannweite des hebräischen Wortes, ohne den rechtlichen Status genauer als der Kontext als Sklaverei festzulegen.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Der Personenname wird in seiner etablierten deutschen Bibelform wiedergegeben.
- source_word: סוֹטַי
  choice: Sotai
  rationale: Der Eigenname wird nach der masoretischen Vokalisierung in einer für das Deutsche geeigneten Form transkribiert.
- source_word: סוֹפֶרֶת
  choice: Soferet
  rationale: Im Kontext handelt es sich um einen Familiennamen; daher wird er transkribiert und nicht entsprechend einer möglichen Wortwurzel übersetzt.
- source_word: פְרִידָא
  choice: Perida
  rationale: Der Eigenname wird entsprechend der masoretischen Vokalisierung transkribiert.
