lexical_decisions:
- source_word: אַנְשֵׁי
  choice: die Männer von
  rationale: Der Status-constructus-Plural von אִישׁ leitet hier einen Eintrag in der Heimkehrerliste ein. „Die Männer von“ bewahrt die maskuline Form und klingt im Deutschen bei einer Herkunftsangabe natürlich.
- source_word: בֵית עַזְמָוֶת
  choice: Bet-Asmawet
  rationale: Die Verbindung bezeichnet in diesem Listen- und Zensuskontext einen Ortsnamen. „Bet“ gibt das hebräische בֵית als Bestandteil des zusammengesetzten Namens wieder; der Bindestrich macht die Einheit des Toponyms sichtbar.
- source_word: אַרְבָּעִים וּשְׁנָיִם
  choice: '42'
  rationale: Die Ziffer entspricht der knappen Form einer Zensusliste und gibt die hebräische Zahl „vierzig und zwei“ in gegenwärtiger deutscher Schreibweise eindeutig wieder.
