lexical_decisions:
- source_word: בְּנֵי
  choice: Die Nachkommen
  rationale: In der Zählung bezeichnet בְּנֵי die zu einem Stammvater oder Familienverband gehörenden Personen. „Nachkommen“ gibt diesen über die unmittelbar leiblichen Söhne hinausreichenden Sinn im heutigen Deutsch natürlich und präzise wieder.
- source_word: בִנּוּי
  choice: Binnuis
  rationale: Der Personen- beziehungsweise Familienname wird nach üblicher deutscher Bibeltradition als „Binnui“ wiedergegeben; der deutsche Genitiv „Binnuis“ drückt die Zugehörigkeit aus.
- source_word: שֵׁשׁ מֵאוֹת אַרְבָּעִים וּשְׁמֹנָה
  choice: sechshundertachtundvierzig
  rationale: Die hebräische Zahlenfolge ergibt eindeutig 648. Die ausgeschriebene Form passt zum würdigen, fortlaufenden Stil einer biblischen Namens- und Zählliste.
