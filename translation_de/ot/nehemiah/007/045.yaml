  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen Form transliteriert.
- source_word: חֲטִיטָא
  choice: Hatita
  rationale: Der Personenname wird in der gebräuchlichen deutschen Form transliteriert.
- source_word: שֹׁבָי
  choice: Schobai
  rationale: Die Transliteration gibt den Namen und seinen Schlussvokal in geläufiger deutscher Schreibweise wieder.
- source_word: מֵאָה שְׁלֹשִׁים וּשְׁמֹנָה
  choice: '138'
  rationale: Die hebräische Zahlenfolge ergibt 138; Ziffern sind in einer Zählliste übersichtlich und natürlich.
