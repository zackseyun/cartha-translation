lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: Die Torwächter
  rationale: Bezeichnet die für die Bewachung und Aufsicht der Tore Verantwortlichen; „Torwächter“ ist im Deutschen klar und im kultisch-gemeinschaftlichen Kontext passend.
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: In nachexilischen Namens- und Zähllisten kann der Ausdruck außer unmittelbaren Söhnen auch Angehörige einer Sippe oder Familienlinie bezeichnen. „Nachkommen“ gibt diese weitere Bedeutung natürlich wieder.
- source_word: שַׁלּוּם
