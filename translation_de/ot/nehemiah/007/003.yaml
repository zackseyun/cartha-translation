source:
  edition: WLC
  text: ו/יאמר לָ/הֶ֗ם לֹ֣א יִפָּֽתְח֞וּ שַׁעֲרֵ֤י יְרוּשָׁלִַ֨ם֙ עַד חֹ֣ם הַ/שֶּׁ֔מֶשׁ וְ/עַ֨ד הֵ֥ם עֹמְדִ֛ים יָגִ֥יפוּ הַ/דְּלָת֖וֹת וֶ/אֱחֹ֑זוּ וְ/הַעֲמֵ֗יד מִשְׁמְרוֹת֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם אִ֚ישׁ בְּ/מִשְׁמָר֔/וֹ וְ/אִ֖ישׁ נֶ֥גֶד בֵּיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/003.yaml
  text: And I said to them[a], “The gates of Jerusalem must not be opened until the sun is hot. While they are still standing guard, let them shut the doors and fasten them. And appoint guards from the inhabitants of Jerusalem[c][b], each at his watch and each opposite his own house.”
translation:
  language: de
  text: 'Und ich sagte zu ihnen: »Die Tore Jerusalems dürfen nicht geöffnet werden, bis die Sonne heiß ist.[a] Solange die Wachen noch auf ihren Posten stehen, sollen sie die Torflügel schließen und sichern.[b] Setzt Wachen aus den Einwohnern Jerusalems ein,[c] jeden an seinem Wachposten und jeden seinem eigenen Haus gegenüber.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »bis die Sonne heiß ist«; gemeint ist nicht schon der Sonnenaufgang, sondern eine spätere Morgenstunde.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »festhalten«. Im Zusammenhang bedeutet dies, die geschlossenen Torflügel zu befestigen oder zu sichern.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Teilt den Einwohnern Jerusalems Wachdienste zu.« Das hebräische Wort kann sowohl Wachen als auch Wachdienste bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפָּתְחוּ
  choice: dürfen nicht geöffnet werden
  rationale: Das Niphal wird passiv wiedergegeben; לֹא mit Imperfekt hat hier die Kraft einer verbindlichen Anweisung.
- source_word: עַד חֹם הַשֶּׁמֶשׁ
  choice: bevor die Sonne heiß geworden ist
  rationale: Bewahrt das konkrete hebräische Bild und macht deutlich, dass die Tore nicht schon bei Sonnenaufgang geöffnet werden sollen.
- source_word: וְעַד הֵם עֹמְדִים
  choice: Solange die Wachen noch auf ihren Posten stehen
  rationale: עמד bedeutet wörtlich „stehen“, bezeichnet im Wachkontext jedoch das Verbleiben auf dem Posten. Das Subjekt wird aus dem Zusammenhang verständlich gemacht.
- source_word: יָגִיפוּ הַדְּלָתוֹת
  choice: sollen sie die Torflügel schließen
  rationale: הגיף bezeichnet das Schließen; „Torflügel“ verdeutlicht, dass דלתות die beweglichen Türen der zuvor genannten Stadttore meint.
- source_word: וֶאֱחֹזוּ
  choice: und sichern
  rationale: אחז heißt wörtlich „festhalten“. Nach dem Schließen der Torflügel bezeichnet es hier deren Befestigung oder Sicherung, ohne einen bestimmten Mechanismus vorauszusetzen.
- source_word: וְהַעֲמֵיד מִשְׁמְרוֹת
  choice: Stellt außerdem Wachen ... auf
  rationale: Der Hiphil von עמד bedeutet „hinstellen/aufstellen“; משמרות kann sowohl Wachmannschaften als auch Wachdienste bezeichnen.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: aus den Einwohnern Jerusalems
  rationale: 'Gibt den naheliegenden partitiven Sinn wieder: Die Wachen werden aus der Stadtbevölkerung genommen.'
- source_word: אִישׁ בְּמִשְׁמָרוֹ
  choice: jeden an seinem Wachposten
  rationale: איש ist distributiv gebraucht; משמר bezeichnet hier den jeweils zugewiesenen Posten oder Wachdienst.
- source_word: וְאִישׁ נֶגֶד בֵּיתוֹ
  choice: und jeden seinem eigenen Haus gegenüber
  rationale: Die räumliche Bedeutung von נגד („gegenüber/vor“) bleibt erhalten, ohne sie zu „nahe bei“ abzuschwächen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der militärisch-administrative Ton der Anweisungen bleibt erhalten. „Torflügel“ verhindert die im Deutschen mögliche Verwechslung zwischen Stadttoren und den darin befindlichen Türen; die Mehrdeutigkeit von משמרות wird in einer Fußnote bewahrt.
