lexical_decisions:
- source_word: אַנְשֵׁי
  choice: die Männer von
  rationale: Der Konstruktplural von אִישׁ bezeichnet in dieser Listenformel die männlichen Angehörigen der genannten Orte. „die Männer von“ gibt die geschlechtsspezifische Form des Hebräischen unmittelbar und natürlich wieder.
- source_word: הָרָמָה
  choice: Rama
  rationale: Der Ortsname wird in seiner im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: וָגָבַע
  choice: und Geba
  rationale: Der bezeugte hebräische Konsonantenbestand גבע entspricht Geba, nicht גבעה („Gibea“). Daher wird die vorliegende Lesart bewahrt.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וְאֶחָד
  choice: '621'
  rationale: Die Zahl wird gemäß heutiger deutscher Schreibkonvention in einer genealogischen Aufzählung als Ziffer wiedergegeben; ihr Wert bleibt exakt erhalten.
