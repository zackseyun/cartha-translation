  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָ/עִ֞יר רַחֲבַ֤ת יָדַ֨יִם֙ וּ/גְדוֹלָ֔ה וְ/הָ/עָ֥ם מְעַ֖ט בְּ/תוֹכָ֑/הּ וְ/אֵ֥ין בָּתִּ֖ים בְּנוּיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/004.yaml
  text: The city was wide and large[a], but the people within it were few, and no houses had been built.
translation:
  language: de
  text: Die Stadt war weitläufig und groß[a], aber in ihr lebten nur wenige Menschen, und es waren keine Häuser gebaut worden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „breit an beiden Seiten und groß“. Das Hebräische reiht die Satzteile jeweils mit „und“ aneinander.'
    reason: Die Fußnote bewahrt das konkrete hebräische Bild und weist auf die stärker koordinierende Satzstruktur hin.
  - marker: b
    text: 'Im Zusammenhang des Wiederaufbaus kann auch gemeint sein: „keine Häuser waren wieder aufgebaut worden“. Im Hebräischen steht jedoch lediglich „gebaut“.'
    reason: Die kontextuell mögliche Bedeutung „wieder aufgebaut“ soll sichtbar bleiben, ohne sie gegenüber dem Wortlaut zur eindeutigen Hauptlesart zu machen.
lexical_decisions:
- source_word: וְהָעִיר
  choice: Die Stadt
  rationale: הָעִיר bedeutet „die Stadt“. Das vorangestellte וְ verbindet den Satz mit dem Zusammenhang; im Deutschen muss es hier nicht eigens mit „und“ wiedergegeben werden.
- source_word: רַחֲבַת יָדַיִם
  choice: weitläufig
  rationale: Die Wendung bedeutet wörtlich etwa „weit an beiden Seiten“ und beschreibt die räumliche Ausdehnung. „Weitläufig“ gibt den idiomatischen Sinn in natürlichem Deutsch wieder.
- source_word: וּגְדוֹלָה
  choice: und groß
  rationale: גְדוֹלָה bezeichnet hier die Größe beziehungsweise Ausdehnung der Stadt, nicht ihren Rang oder ihre Bedeutung.
- source_word: וְהָעָם מְעַט בְּתוֹכָהּ
  choice: aber in ihr lebten nur wenige Menschen
  rationale: Wörtlich steht koordinierend „und das Volk war wenig in ihr“. „Aber“ macht den sachlichen Gegensatz zur großen Stadt deutlich; die deutsche Formulierung bewahrt den Bezug auf die wenigen Menschen im Stadtgebiet.
- source_word: וְאֵין בָּתִּים בְּנוּיִם
  choice: und es waren keine Häuser gebaut worden
  rationale: אֵין bezeichnet das Nichtvorhandensein, und בְּנוּיִם ist das passive Partizip zu „bauen“. Die Übersetzung bleibt bei „gebaut“ und fügt nicht eindeutig „wieder aufgebaut“ ein.
theological_decisions:
- issue: Ob בְּנוּיִם im nachexilischen Zusammenhang „gebaut“ oder „wieder aufgebaut“ meint
  choice: gebaut
  alternative: wieder aufgebaut
  rationale: Der hebräische Ausdruck enthält kein ausdrückliches Element für „wieder-“. Der Zusammenhang kann eine Wiederherstellung nahelegen, doch diese Deutung wird nicht in den Haupttext eingetragen, sondern als mögliche kontextuelle Lesart in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Weitläufig“ vermeidet eine unnatürliche wörtliche Wiedergabe des Idioms; die Kontrastverbindung „aber“ macht den Sinnzusammenhang deutlich, obwohl das Hebräische formal koordinierend gebaut ist.
