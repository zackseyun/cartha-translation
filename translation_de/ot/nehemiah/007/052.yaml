lexical_decisions:
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: In der Rückkehrerliste bezeichnet die Konstruktverbindung eine Familien-, Sippen- oder Gruppenzugehörigkeit. „Nachkommen“ gibt diese Funktion im heutigen Deutsch natürlicher wieder als das wörtliche „Söhne“, ohne die genaue Art der Zugehörigkeit unnötig festzulegen.
- source_word: בֵסַי
  choice: Besai
  rationale: Der Eigenname wird in einer dem Hebräischen nahen und im Deutschen verständlichen Form wiedergegeben.
- source_word: מְעוּנִים
  choice: Meuniter
  rationale: Die hebräische Pluralform kann eine Volks- oder Gruppenzugehörigkeit bezeichnen. In der Listenform ist die deutsche Gruppenbezeichnung „Meuniter“ natürlicher als eine bloße Transliteration.
- source_word: נפושסים
  choice: Nefuschsiter
  rationale: Die Form wird als Gruppenname verstanden und entsprechend der deutschen Namensbildung wiedergegeben. „Nefuschsiter“ bildet die Konsonanten des vorliegenden hebräischen Textes vergleichsweise direkt ab.
