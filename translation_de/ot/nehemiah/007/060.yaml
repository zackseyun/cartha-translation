  text: כָּל הַ֨/נְּתִינִ֔ים וּ/בְנֵ֖י עַבְדֵ֣י שְׁלֹמֹ֑ה שְׁלֹ֥שׁ מֵא֖וֹת תִּשְׁעִ֥ים וּ/שְׁנָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/060.yaml
  text: All the temple servants and the sons of Solomon’s servants were three hundred ninety-two[a].
translation:
  language: de
  text: Alle Tempeldiener und die Nachkommen der Diener Salomos waren insgesamt 392[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Netinim«; dies ist die traditionelle Umschrift der Bezeichnung für eine Gruppe von Tempeldienern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: insgesamt
  rationale: כָּל leitet hier die Gesamtzahl der beiden genannten Gruppen ein; im Deutschen gibt »insgesamt« den Sinn in einer Zählliste natürlich wieder.
- source_word: הַנְּתִינִים
  choice: Tempeldiener
  rationale: Der Ausdruck bezeichnet eine an den Tempeldienst gebundene Gruppe. »Tempeldiener« macht ihre Funktion für heutige Leser verständlich; die traditionelle Umschrift wird in der Fußnote bewahrt.
- source_word: וּבְנֵי
  choice: und die Nachkommen der
  rationale: בְּנֵי bedeutet wörtlich »Söhne von«, kann in genealogischen und administrativen Listen aber eine fortbestehende Nachkommengruppe bezeichnen. »Nachkommen« ist hier im modernen Deutsch klarer.
- source_word: עַבְדֵי
  choice: Diener
  rationale: עֶבֶד kann »Diener« oder »Sklave« bedeuten. In dieser festen Gruppenbezeichnung ist »Diener« angemessen, ohne die soziale Stellung genauer festzulegen, als es der Kontext erlaubt.
- source_word: שְׁלֹמֹה
  choice: Salomos
  rationale: Der Eigenname wird nach üblicher deutscher Form wiedergegeben; der Genitiv entspricht der hebräischen Status-constructus-Verbindung.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: '392'
  rationale: Die hebräische Kardinalzahl wird in der Zählliste knapp und gut erfassbar als Zahl wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die administrative Listenform bleibt knapp; »Nachkommen« vermeidet das im heutigen Deutsch zu enge Verständnis von »Söhne«, während die funktionale Wiedergabe »Tempeldiener« durch die traditionelle Bezeichnung in der Fußnote ergänzt wird.
