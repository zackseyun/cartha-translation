lexical_decisions:
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: Der Konstruktplural von בֵּן bezeichnet in genealogischen Listen häufig die Angehörigen einer Familie oder Sippe. »Nachkommen« gibt diese Funktion im heutigen Deutsch natürlicher und eindeutiger wieder als das wörtliche »Söhne«.
- source_word: עֵילָם
  choice: Elams
  rationale: Der Eigenname wird transliteriert und wegen der deutschen Konstruktion mit »Nachkommen« in den Genitiv gesetzt. Gemeint ist hier die Familie beziehungsweise Sippe Elams, nicht unmittelbar das gleichnamige Gebiet.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: '1.254'
  rationale: Die hebräische Zahlenfolge ergibt 1.254. Die Ziffernschreibung mit deutschem Tausenderpunkt ist in einer Listen- und Zählungsangabe gut lesbar; eine Ergänzung wie »Personen« steht nicht ausdrücklich im Ausgangstext.
