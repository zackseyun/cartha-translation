lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Die konstruktusförmige Mehrzahl von בֵּן bezeichnet in dieser Namensliste Angehörige beziehungsweise Nachkommen einer Familie. „Die Söhne“ bewahrt die formale, wiederholte Struktur des Hebräischen; „die Nachkommen“ wäre als sinngemäße Wiedergabe ebenfalls möglich.
- source_word: בַרְקוֹס
  choice: Barkos
  rationale: Der Eigenname wird nach seiner masoretischen Vokalisierung ins Deutsche übertragen.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Der Eigenname wird in der im Deutschen etablierten biblischen Form wiedergegeben; hier bezeichnet er eine Familie innerhalb der Liste.
- source_word: תָמַח
  choice: Temach
  rationale: Die Schreibung mit „ch“ gibt den abschließenden hebräischen Konsonanten ח im Deutschen wieder; die masoretische Vokalisierung spricht für „Temach“.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Listendeutsch. Die dreifache Wiederholung von בְּנֵי wird beibehalten. Bei „Barkos“ steht wegen des Artikels im hebräischen Namen „des Barkos“, während „Siseras“ und „Temachs“ als unbegleitete Eigennamen im deutschen Genitiv erscheinen.
