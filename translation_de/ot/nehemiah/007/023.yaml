- source_word: בֵצָי
  choice: Bezais
  rationale: Der Eigenname wird in der im Deutschen üblichen biblischen Form „Bezai“ wiedergegeben; der Genitiv markiert die Zugehörigkeit der Nachkommen.
- source_word: שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וְאַרְבָּעָה
  choice: '324'
  rationale: Die hebräische Kardinalzahl bedeutet „dreihundertvierundzwanzig“. In einer fortlaufenden Namens- und Zahlenliste ist die Ziffernschreibung knapp, klar und modern.
