  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Die Nachkommen
  rationale: Der Konstruktplural von בֵּן bezeichnet in genealogischen Listen häufig nicht nur unmittelbare Söhne, sondern die Angehörigen einer Familienlinie. „Nachkommen“ gibt diesen Sinn im modernen Deutschen klar und natürlich wieder.
- source_word: אִמֵּר
  choice: Immers
  rationale: Der Personen- beziehungsweise Familienname wird als „Immer“ transliteriert; der deutsche Genitiv macht die Zugehörigkeit der Nachkommen deutlich.
- source_word: אֶלֶף חֲמִשִּׁים וּשְׁנָיִם
  choice: '1.052'
  rationale: Die hebräische Zahlfolge bedeutet wörtlich „tausend, fünfzig und zwei“. Die Ziffernschreibweise mit deutschem Tausenderpunkt ist in einer Zählliste knapp und eindeutig.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Listendeutsch. „Nachkommen“ vermeidet das mögliche Missverständnis, es handle sich ausschließlich um unmittelbare Söhne, und entspricht dem genealogisch-korporativen Gebrauch.
