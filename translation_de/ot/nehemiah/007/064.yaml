  text: אֵ֗לֶּה בִּקְשׁ֧וּ כְתָבָ֛/ם הַ/מִּתְיַחְשִׂ֖ים וְ/לֹ֣א נִמְצָ֑א וַ/יְגֹֽאֲל֖וּ מִן הַ/כְּהֻנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/064.yaml
  text: These sought their record among those enrolled by genealogy[a], but it was not found[b], so they were excluded from the priesthood.
translation:
  language: de
  text: Diese suchten ihren Eintrag in den Abstammungslisten[a], doch er wurde nicht gefunden. Darum wurden sie vom Priestertum ausgeschlossen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihren schriftlichen Abstammungsnachweis«. Das Hebräische bezeichnet einen schriftlichen Nachweis beziehungsweise Eintrag zur Feststellung der Abstammung.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann auch die Bedeutung haben, als unrein oder für den Dienst untauglich behandelt zu werden. Gemeint ist hier der Ausschluss vom Priestertum wegen des fehlenden Abstammungsnachweises.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Diese
  rationale: Das substantivisch gebrauchte Demonstrativpronomen verweist auf die zuvor genannte Gruppe, ohne ein im Hebräischen nicht vorhandenes Substantiv hinzuzufügen.
- source_word: בִּקְשׁוּ
  choice: suchten
  rationale: בקשׁ bezeichnet hier die gezielte Suche nach einem schriftlichen Nachweis.
- source_word: כְתָבָם הַמִּתְיַחְשִׂים
  choice: ihre Urkunde im Geschlechtsregister
  rationale: כְּתָב bezeichnet ein Schriftstück beziehungsweise einen schriftlichen Nachweis; der Partizipialausdruck von יחס stellt den genealogischen Zusammenhang her. Die Wiedergabe formuliert den administrativen Sinn in natürlichem Deutsch, ohne die genaue Art des Dokuments zu eng festzulegen.
- source_word: וְלֹא נִמְצָא
  choice: doch sie wurde nicht gefunden
  rationale: Das singularische Verb bezieht sich am natürlichsten auf die zuvor genannte Urkunde. Das feminine Pronomen im Deutschen folgt dem grammatischen Geschlecht von »Urkunde«.
- source_word: וַיְגֹאֲלוּ
  choice: wurden ... ausgeschlossen
  rationale: Die Form von גאל hat hier im Kontext den Sinn, als untauglich beziehungsweise unzulässig behandelt zu werden. »Ausgeschlossen« gibt die praktische Folge wieder, ohne irreführend eine persönliche moralische Verunreinigung zu behaupten.
- source_word: מִן הַכְּהֻנָּה
  choice: vom Priestertum
  rationale: כְּהֻנָּה bezeichnet das Priestertum beziehungsweise das priesterliche Amt; »vom Priestertum« bewahrt den institutionellen Ausdruck.
theological_decisions:
- issue: Bedeutung von וַיְגֹאֲלוּ im Zusammenhang mit dem Priestertum
  choice: vom Priestertum ausgeschlossen
  alternative: für das Priestertum als unrein erklärt / vom Priesteramt disqualifiziert
  rationale: Der fehlende Abstammungsnachweis führt zur Aberkennung beziehungsweise Verweigerung des priesterlichen Status. Die Hauptübersetzung nennt diese Folge klar; die Fußnote bewahrt die stärkere, wörtlichere Färbung des hebräischen Verbs.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Verwaltungssprache. »Urkunde« und »Geschlechtsregister« vermitteln den amtlich-genealogischen Zusammenhang; die Fußnoten erhalten die syntaktische und lexikalische Spannweite des Hebräischen.
