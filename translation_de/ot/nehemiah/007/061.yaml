  to: Und dies waren diejenigen, die aus Tel-Melach, Tel-Harscha, Kerub, Addon[a] und Immer heraufgezogen waren. Sie konnten jedoch weder ihr Vaterhaus[b] noch ihre Nachkommenschaft angeben und auch nicht, ob sie aus Israel stammten.[c]
