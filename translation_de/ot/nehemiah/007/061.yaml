source:
  edition: WLC
  text: וְ/אֵ֗לֶּה הָֽ/עוֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדּ֖וֹן וְ/אִמֵּ֑ר וְ/לֹ֣א יָכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/061.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addon, and Immer, but they were not able to declare their fathers’ houses or their offspring[c][b], whether they were from Israel.
translation:
  language: de
  text: Und dies waren diejenigen, die aus Tel-Melach, Tel-Harscha, Kerub, Addon[a] und Immer heraufgezogen waren. Sie konnten jedoch weder ihr Vaterhaus[b] noch ihre Nachkommenschaft angeben und auch nicht, ob sie aus Israel stammten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Esra 2,59 steht an dieser Stelle „Addan“ statt „Addon“.
    reason: textual_variant
  - marker: b
    text: Das „Vaterhaus“ ist die väterliche Großfamilie beziehungsweise Sippe.
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „ob sie Israeliten waren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה הָעוֹלִים
  choice: Und dies waren die, die … heraufgezogen waren
  rationale: Die Formulierung führt innerhalb der Liste eine weitere Gruppe ein. „Heraufgezogen“ bewahrt das nachexilische Bild des Hinaufziehens, während das Plusquamperfekt im deutschen Erzählzusammenhang natürlich klingt.
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדּוֹן וְאִמֵּר
  choice: aus Tel-Melach, Tel-Harscha, Kerub, Addon und Immer
  rationale: Die Orts- beziehungsweise Sippennamen werden nach dem masoretischen Konsonantentext transkribiert. „Addon“ gibt die Lesart in Nehemia wieder; Esra 2,59 bietet eine Variante.
- source_word: וְלֹא יָכְלוּ לְהַגִּיד
  choice: Sie konnten jedoch … nicht angeben
  rationale: Das Hifil von נגד bedeutet „mitteilen, angeben, kundtun“. „Angeben“ passt zum genealogisch-administrativen Zusammenhang, ohne ausdrücklich einen förmlichen Beweisvorgang vorauszusetzen.
- source_word: בֵּית אֲבוֹתָם
  choice: ihr Vaterhaus
  rationale: „Vaterhaus“ bewahrt den genealogischen hebräischen Fachausdruck für die väterliche Großfamilie beziehungsweise Sippe; eine Fußnote erläutert ihn.
- source_word: וְזַרְעָם
  choice: noch ihre Abstammung
  rationale: זֶרַע bedeutet wörtlich „Same“ und kann Nachkommenschaft beziehungsweise genealogische Herkunft bezeichnen. Im Zusammenhang der Feststellung israelitischer Zugehörigkeit ist „Abstammung“ im Deutschen verständlich und sachgerecht.
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: ob sie aus Israel stammten
  rationale: Die Wiedergabe hält die Unsicherheit über ihre israelitische Herkunft fest und bleibt näher an „aus Israel“ als die stärker verdichtete Formulierung „ob sie Israeliten waren“.
theological_decisions:
- issue: Art der israelitischen Zugehörigkeit
  choice: ob sie aus Israel stammten
  alternative: ob sie Israeliten waren
  rationale: Der Vers behandelt im unmittelbaren Zusammenhang die nicht nachweisbare genealogische Herkunft. Die Übersetzung formuliert deshalb keine weitergehende religiöse oder rechtliche Definition israelitischer Identität.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ortsnamen werden transparent transkribiert; der genealogische Fachausdruck „Vaterhaus“ bleibt erhalten und wird erläutert. Die Satzteilung verbessert die Lesbarkeit, ohne die sachliche Listenform aufzugeben.
