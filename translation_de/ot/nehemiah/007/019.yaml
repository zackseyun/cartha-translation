- source_word: בִגְוָי
  choice: Bigwai
  rationale: Der Personen- beziehungsweise Familienname wird nach geläufiger deutscher biblischer Schreibweise transliteriert.
- source_word: אַלְפַּיִם שִׁשִּׁים וְשִׁבְעָה
  choice: '2.067'
  rationale: Die Zahl bedeutet wörtlich „zweitausend, sechzig und sieben“. Die Ziffernschreibung ist in einer umfangreichen Namens- und Zahlenliste klar und gut erfassbar und bewahrt den exakten Wert.
