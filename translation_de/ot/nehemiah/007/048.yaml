  text: the sons of Lebanah[a], the sons of Hagabah[b], the sons of Shalmai.
translation:
  language: de
  text: die Söhne Lebanas[a], die Söhne Hagabas, die Söhne Schalmais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder jeweils: »die Nachkommen« beziehungsweise »die Angehörigen der Sippe«. Die hebräische genealogische Formel bezeichnet nicht nur unmittelbare männliche Kinder.'
    reason: lexical_alternative
  - marker: b
    text: In einer parallelen Listenüberlieferung erscheint der Name in der Form »Salmai«. Der hebräische Text von Nehemia hat hier »Schalmai«.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Die konstruktusförmige Mehrzahl von בֵּן wird in der dreifach wiederholten genealogischen Listenformel unmittelbar und strukturgleich wiedergegeben. Im Kontext kann die Wendung jedoch auch Nachkommen oder Angehörige einer Sippe bezeichnen; darauf weist die Fußnote hin.
- source_word: לְבָנָה
  choice: Lebana
  rationale: Der Eigenname wird nach der masoretischen Form ins Deutsche übertragen; das abschließende ה bezeichnet hier den auslautenden a-Vokal und wird nicht zusätzlich als h wiedergegeben.
- source_word: חֲגָבָה
  choice: Hagaba
  rationale: Der Eigenname wird gemäß der masoretischen Lautung deutsch transliteriert; ח wird in einer lesefreundlichen deutschen Bibelumschrift mit H wiedergegeben.
- source_word: שַׁלְמָי
  choice: Schalmai
  rationale: Die deutsche Umschrift gibt שׁ mit „Sch“ wieder und bewahrt die masoretische Form Schalmai; abweichende Formen in parallelen Listen werden nicht in den Haupttext übernommen.
