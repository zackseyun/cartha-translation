  - severity: medium
    issue: „damit sie sich nach ihren Geschlechtern registrieren ließen“
    rationale: Die Konstruktion mit „sich ... registrieren ließen“ ist im modernen Standarddeutsch sperrig und kann ein bloßes Dulden statt einer angeordneten amtlichen Erfassung nahelegen. „um sie nach ihrer Abstammung zu erfassen“ gibt Zweck und administrativ-genealogischen Sinn klar wieder.
  - severity: low
    issue: „Verzeichnis der Geschlechter“
    rationale: Die Formulierung ist verständlich, doch „Geschlechter“ ist im heutigen Deutsch weniger eindeutig. „Geschlechterverzeichnis“ bezeichnet ein genealogisches Register direkter und natürlicher.
  - severity: low
    issue: „Vorsteher“ für הַסְּגָנִים
    rationale: „Vorsteher“ kann im Deutschen eine einzelne Leitungsposition bezeichnen und ist hier weniger präzise. „Amtsträger“ wahrt die allgemeine administrative Bedeutung des hebräischen Begriffs.
