revisions:
- from: 'Da gab mir mein Gott ins Herz, die Vornehmen, die Vorsteher und das Volk zu versammeln, damit sie sich nach ihren Geschlechtern registrieren ließen.[a] Ich fand das Verzeichnis der Geschlechter derer, die zuerst heraufgezogen waren,[b] und fand darin geschrieben:'
  to: 'Da gab mir mein Gott ins Herz, die Vornehmen, die Amtsträger und das Volk zu versammeln, um sie nach ihrer Abstammung zu erfassen.[a] Ich fand das Geschlechterverzeichnis derer, die zuerst heraufgezogen waren,[b] und fand darin geschrieben:'
  rationale: Die Überarbeitung beseitigt die unidiomatische reflexive Passivkonstruktion und verdeutlicht die genealogische Erfassung. Sie ersetzt außerdem zwei im modernen Deutsch weniger klare Verwaltungs- und Registerbezeichnungen. Die quellennahe, theologisch zurückhaltende Wendung über Gottes inneres Anstoßen sowie die offene biblische Ausdrucksweise „heraufgezogen“ bleiben erhalten. Die Fußnotenanker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
