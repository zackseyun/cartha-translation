base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/005.yaml
  text: 'Then my God put it into my heart to assemble the nobles[a], the officials, and the people to be enrolled by genealogy. And I found the book of the genealogy of those who came up first[b], and I found written in it:'
translation:
  language: de
  text: 'Da gab mir mein Gott ins Herz, die Vornehmen, die Amtsträger und das Volk zu versammeln, um sie nach ihrer Abstammung zu erfassen.[a] Ich fand das Geschlechterverzeichnis derer, die zuerst heraufgezogen waren,[b] und fand darin geschrieben:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet eine amtliche Erfassung oder Eintragung nach der familiären Abstammung.
    reason: lexical_clarification
  - marker: b
    text: 'Oder: „das Geschlechterverzeichnis der zuerst Heraufgezogenen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֱלֹהַי אֶל לִבִּי
  choice: Da gab mir mein Gott ins Herz
  rationale: Die im Hebräischen ungewöhnliche Wendung wird bewusst relativ formnah wiedergegeben. Sie wahrt Gottes Initiative und die innere Eingebung, ohne eine bestimmte Offenbarungsweise festzulegen.
- source_word: וָאֶקְבְּצָה
  choice: zu versammeln
  rationale: Die Form bezeichnet hier am natürlichsten die von Gott angeregte Absicht beziehungsweise Handlung Nehemias.
- source_word: הַחֹרִים
  choice: die Vornehmen
  rationale: Im gesellschaftlich-administrativen Zusammenhang sind führende Angehörige der Oberschicht gemeint; „Vornehmen“ ist würdig und verständlich.
- source_word: הַסְּגָנִים
  choice: die Vorsteher
  rationale: Das Wort bezeichnet Amtsträger oder untergeordnete Machthaber. „Vorsteher“ hält die Leitungsfunktion fest, ohne einen modernen Verwaltungsrang vorzutäuschen.
- source_word: לְהִתְיַחֵשׂ
  choice: damit sie sich nach ihren Geschlechtern registrieren ließen
  rationale: Der Hitpael bezeichnet die amtliche Erfassung oder Zuordnung anhand der Abstammung. Die Formulierung gibt sowohl den genealogischen als auch den administrativen Aspekt wieder.
- source_word: סֵפֶר הַיַּחַשׂ
  choice: das Verzeichnis der Geschlechter
  rationale: Gemeint ist ein schriftliches genealogisches Register. „Verzeichnis“ klingt im Deutschen natürlicher als das wörtliche „Buch“, während „der Geschlechter“ die Abstammungslinien bezeichnet.
- source_word: הָעוֹלִים בָּרִאשׁוֹנָה
  choice: derer, die zuerst heraufgezogen waren
  rationale: „Heraufziehen“ bewahrt die biblische räumlich-theologische Rede vom Zug nach Juda beziehungsweise Jerusalem; „zuerst“ kennzeichnet die frühere Rückkehrergruppe.
- source_word: וָאֶמְצָא כָּתוּב בּוֹ
  choice: 'und fand darin geschrieben:'
  rationale: Die Wendung leitet den nachfolgenden Inhalt des aufgefundenen Registers ein und bleibt knapp sowie quellennah.
theological_decisions:
- issue: Art der göttlichen Leitung Nehemias
  choice: Da gab mir mein Gott ins Herz
  alternative: Da legte mir mein Gott ins Herz / Da inspirierte mich mein Gott
  rationale: Die gewählte Formulierung bewahrt die göttliche Initiative und das innere Geschehen, ohne es ausdrücklich als formale Inspiration, Vision oder bloßen persönlichen Gedanken zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderater Nähe zur hebräischen Syntax. „Geschlechter“ wird im älteren genealogischen Sinn von Familien- beziehungsweise Abstammungslinien gebraucht; die Fußnote erklärt den amtlichen Vorgang.
