source:
  edition: WLC
  text: וָ/אֲצַוֶּ֞ה אֶת חֲנָ֣נִי אָחִ֗/י וְ/אֶת חֲנַנְיָ֛ה שַׂ֥ר הַ/בִּירָ֖ה עַל יְרוּשָׁלִָ֑ם כִּי הוּא֙ כְּ/אִ֣ישׁ אֱמֶ֔ת וְ/יָרֵ֥א אֶת הָ/אֱלֹהִ֖ים מֵ/רַבִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/002.yaml
  text: Then I appointed my brother Hanani and Hananiah[a], the commander of the fortress, over Jerusalem[b], because he was a faithful man and feared God more than many.
translation:
  language: de
  text: Dann setzte ich meinen Bruder Hanani und Hananja, den Befehlshaber der Festung, über Jerusalem ein, denn er[a] war ein zuverlässiger Mann[b] und fürchtete Gott mehr als viele andere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das singularische „er“ bezieht sich am ehesten auf Hananja; manche verstehen die Würdigung jedoch allgemeiner als Begründung für die Einsetzung beider Männer.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „ein Mann der Wahrheit“; auch möglich: „ein treuer Mann“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: setzte ... ein
  rationale: צוה bedeutet häufig „befehlen“, bezeichnet hier aber mit den direkten Objekten und עַל eine Beauftragung mit Verantwortung. „setzte ... ein“ gibt diesen administrativen Sinn natürlich und textnah wieder.
- source_word: חֲנָנִי אָחִי
  choice: meinen Bruder Hanani
  rationale: Die Suffixform bezeichnet Hanani als Nehemias Bruder; diese Wortstellung entspricht natürlichem modernem Deutsch.
- source_word: חֲנַנְיָה
  choice: Hananja
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, dem Hebräischen nahen Form wiedergegeben.
- source_word: שַׂר הַבִּירָה
  choice: den Befehlshaber der Festung
  rationale: שַׂר bezeichnet einen leitenden Amtsträger, בִּירָה eine befestigte Anlage. „Befehlshaber der Festung“ passt zum administrativ-militärischen Zusammenhang.
- source_word: עַל יְרוּשָׁלַ͏ִם
  choice: über Jerusalem
  rationale: עַל bezeichnet nach dem Einsetzungsverb den Bereich der übertragenen Verantwortung oder Amtsgewalt.
- source_word: כִּי הוּא
  choice: denn er war
  rationale: כִּי begründet die Einsetzung. Das singularische Pronomen bleibt erhalten und weist am natürlichsten auf den unmittelbar zuvor genannten Hananja.
- source_word: כְּאִישׁ אֱמֶת
  choice: ein zuverlässiger Mann
  rationale: אֱמֶת kann Wahrheit, Verlässlichkeit oder Treue bezeichnen. Im Zusammenhang der Eignung für ein Amt gibt „zuverlässig“ den Sinn klar wieder, ohne die wörtlichere Alternative auszuschließen.
- source_word: וְיָרֵא אֶת־הָאֱלֹהִים
  choice: und fürchtete Gott
  rationale: Die direkte Wendung bewahrt den biblischen Ausdruck für ehrfürchtige Gottesfurcht.
- source_word: מֵרַבִּים
  choice: mehr als viele andere
  rationale: Der Vergleich mit מן und רַבִּים wird direkt wiedergegeben. „viele andere“ macht im Deutschen die verglichene Personengruppe verständlich, ohne zu „die meisten“ zu verschärfen.
theological_decisions:
- issue: Bezug des singularischen Pronomens in der Begründung
  choice: „er“ bezieht sich primär auf Hananja, den näheren Bezugsnamen
  alternative: Die Würdigung könnte im weiteren Zusammenhang die gemeinsame Einsetzung beider Männer begründen.
  rationale: Das hebräische Singularpronomen und die singularischen Prädikate sprechen am natürlichsten für Hananja. Die Übersetzung glättet den Singular nicht zu einem Plural und erhält damit die Spannung des Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Verwaltungssprache. Die direkte Redeweise „fürchtete Gott“ und der offene Vergleich „mehr als viele andere“ bewahren die Eigenart des Hebräischen.
