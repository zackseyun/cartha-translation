- source_word: אַנְשֵׁי
  choice: die Männer von
  rationale: Der Status constructus Plural von אִישׁ bezeichnet hier in einer Rückkehrerliste die zu den genannten Orten gehörenden Männer. Die formnahe Wiedergabe bewahrt den maskulinen Ausdruck des Hebräischen; eine idiomatisch breitere Alternative wird in der Fußnote genannt.
- source_word: בֵית לֶחֶם
  choice: Bethlehem
  rationale: Der Ortsname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: וּנְטֹפָה
  choice: und Netofa
  rationale: Die Konjunktion verbindet den Ortsnamen Netofa mit Bethlehem; beide Orte stehen unter einer gemeinsamen Gesamtzahl. „Netofa“ entspricht der üblichen deutschen Umschrift.
- source_word: מֵאָה שְׁמֹנִים וּשְׁמֹנָה
  choice: '188'
  rationale: Die hebräische Zahlenfolge ergibt einhundertachtundachtzig. Die Ziffernschreibung ist in einer langen Namens- und Zahlenliste übersichtlich und präzise.
