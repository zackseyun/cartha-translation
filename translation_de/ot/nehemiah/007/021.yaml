lexical_decisions:
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: In einer Heimkehrer- und Volkszählungsliste bezeichnet der Konstruktplural von בֵּן gewöhnlich nicht nur unmittelbare Söhne, sondern Angehörige einer Familienlinie. „Nachkommen“ gibt diesen Sinn im modernen Deutschen natürlich wieder.
- source_word: אָטֵר
  choice: Aters
  rationale: Der Personen- beziehungsweise Familienname wird als „Ater“ transliteriert und wegen der deutschen Satzfügung in den Genitiv gesetzt.
- source_word: לְחִזְקִיָּה
  choice: und zwar aus der Linie Hiskias
  rationale: Das vorangestellte לְ kennzeichnet hier am ehesten Zugehörigkeit oder eine Untergruppe innerhalb der Familie Aters. Die Formulierung macht diese Beziehung verständlich, ohne sie als unmittelbare Vaterschaft festzulegen.
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: '98'
  rationale: Die Kardinalzahl wird entsprechend dem knappen Charakter der Namens- und Zahlenliste in Ziffern wiedergegeben.
