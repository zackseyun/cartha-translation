  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „die Nachkommen Aters, nämlich von Hiskia“; die Formulierung kann eine besondere Gruppe innerhalb des Ater-Geschlechts bezeichnen.'
