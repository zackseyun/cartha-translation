source:
  edition: WLC
  text: וּ/מִן הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/063.yaml
  text: 'And from the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: de
  text: 'Und von den Priestern: die Söhne Hobajas, die Söhne Hakkoz'' und die Söhne Barsillais, der eine von den Töchtern Barsillais, des Gileaditers, zur Frau genommen hatte und nach ihrem Namen genannt wurde.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַכֹּהֲנִים
  choice: Und von den Priestern
  rationale: Bewahrt den partitiven Sinn von מִן und leitet natürlich eine Gruppe innerhalb der Priesterschaft ein.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Erhält die wiederholte genealogische Listenform; gemeint sein können dabei auch Nachkommen beziehungsweise Familienverbände.
- source_word: חֳבַיָּה
  choice: Hobaja
  rationale: Im Deutschen gebräuchliche, quellennahe Wiedergabe des Eigennamens.
- source_word: הַקּוֹץ
  choice: Hakkoz
  rationale: Übliche deutsche Namensform, in der der hebräische Artikel mit dem Namen verbunden ist.
- source_word: בַרְזִלַּי
  choice: Barsillai
  rationale: Etablierte deutsche Transkription, einheitlich für die Priesterfamilie und den Gileaditer verwendet.
- source_word: אֲשֶׁר לָקַח
  choice: Dieser hatte ... genommen
  rationale: Das Plusquamperfekt kennzeichnet die Eheschließung als vorausliegend; „Dieser“ macht den singularischen Rückbezug auf den Träger des Namens Barsillai verständlich.
- source_word: מִבְּנוֹת ... אִשָּׁה
  choice: eine von den Töchtern ... zur Frau genommen
  rationale: Gibt die hebräische Heiratsformel idiomatisch und präzise wieder.
- source_word: הַגִּלְעָדִי
  choice: des Gileaditers
  rationale: Bewahrt die Herkunftsbezeichnung als substantiviertes Gentiliz.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: und wurde nach ihrem Namen genannt
  rationale: Gibt die passive Form und die Benennung nach der Familie möglichst eng wieder; der pluralische Bezug bleibt wie im Hebräischen erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit der wiederholten genealogischen Formel des hebräischen Registers. Der im Ausgangstext etwas spannungsreiche Wechsel zwischen der pluralischen Familienbezeichnung und dem singularischen Relativsatz wird nicht in eine ausdrücklich genannte Einzelperson aufgelöst.
