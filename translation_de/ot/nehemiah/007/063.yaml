  naturalness: „Dieser“ nach einem abgeschlossenen Satz wirkt im Deutschen unnötig demonstrativ und löst den Anschluss an die hebräische Relativkonstruktion stärker, als nötig. Eine durchgehende Relativkonstruktion ist zugleich natürlicher und näher am Ausgangstext. Die artikulierte Form „des Hakkoz“ ist als Eigenname weniger idiomatisch als der einfache Genitiv.
  terminology: Hobaja, Hakkoz und Barsillai sind angemessene deutsche Namensformen. „Söhne“ bewahrt den formelhaften genealogischen Registerstil; „zur Frau genommen“ trifft die hebräische Heiratsformel.
