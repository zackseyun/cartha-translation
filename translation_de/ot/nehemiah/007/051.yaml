lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Die Konstruktpluralform von בֵּן bezeichnet in genealogischen Listen häufig Nachkommen oder Angehörige einer Familienlinie. „Die Söhne“ wahrt die hebräische Formulierung und ist in einer solchen Namensliste verständlich; die weitere Bedeutung wird in der Fußnote erläutert.
- source_word: גַזָּם
  choice: Gassam
  rationale: Der Eigenname wird nach üblicher deutscher Bibelnamenkonvention transliteriert; זּ wird mit „ss“ wiedergegeben.
- source_word: עֻזָּא
  choice: Ussa
  rationale: Der Eigenname wird nach üblicher deutscher Bibelnamenkonvention transliteriert; der anlautende Vokal wird mit „U“ und זּ mit „ss“ wiedergegeben.
- source_word: פָסֵחַ
  choice: Paseach
  rationale: Der Eigenname wird lautnah transliteriert; die Endung „-each“ bildet die hebräische Vokalfolge und den Schlusskonsonanten ח erkennbar ab.
