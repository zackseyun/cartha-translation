base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/043.yaml
  text: 'The Levites: the sons of Jeshua[a], of Kadmiel, of the sons of Hodvah, seventy-four.'
translation:
  language: de
  text: 'Die Leviten: die Nachkommen Jeschuas, von Kadmiël, von den Nachkommen Hodwas: vierundsiebzig.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Zuordnung der Namen ist im Hebräischen syntaktisch schwierig und nicht völlig eindeutig. Wörtlich stehen hier nacheinander Zuordnungen zu Jeschua, Kadmiël und den Nachkommen Hodwas; die genaue genealogische Beziehung zwischen ihnen wird nicht ausdrücklich erklärt.
    reason: textual_syntax
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: Die Leviten
  rationale: Der bestimmte Plural eröffnet in der Zählliste eine neue Gruppe; die knappe Überschriftform bewahrt den Listenstil.
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: In genealogischen Listen bezeichnet בְּנֵי häufig eine Familien- oder Abstammungslinie und nicht nur unmittelbare Söhne; „Nachkommen“ ist hier im modernen Deutschen natürlich.
- source_word: יֵשׁוּעַ
  choice: Jeschua
  rationale: Die Namensform wird entsprechend der im Deutschen üblichen Wiedergabe der nachexilischen Kurzform von Josua transliteriert.
- source_word: לְקַדְמִיאֵל
  choice: Kadmiëls
  rationale: Das präfigierte לְ kennzeichnet hier die Zuordnung innerhalb der Abstammungsangabe; der deutsche Genitiv gibt diese Beziehung knapp wieder.
- source_word: לִבְנֵי לְהוֹדְוָה
  choice: von den Nachkommen Hodwas
  rationale: Die wiederholten ל-Präfixe und die Konstruktverbindung bilden eine schwerfällige, möglicherweise geschichtete Zuordnungsformel. Die Wiedergabe wahrt diese Struktur, ohne sie zu glätten.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: vierundsiebzig
  rationale: Die Zahl wird in der üblichen modernen deutschen Form wiedergegeben.
theological_decisions: []
translation_notes:
  register: Knapper, würdevoller Listenstil in modernem Standarddeutsch. „Nachkommen“ vermeidet die im genealogischen Zusammenhang mögliche Fehlinterpretation als ausschließlich unmittelbare Söhne; die ungewöhnliche Verschachtelung der hebräischen Zuordnungen bleibt erkennbar.
