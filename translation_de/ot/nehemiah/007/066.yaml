  yaml_path: translation/ot/nehemiah/007/066.yaml
  text: The whole assembly together was forty-two thousand three hundred sixty,[a]
translation:
  language: de
  text: 'Die ganze Versammlung zusammen: 42.360.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wie einer«. Gemeint ist, dass die Versammlung als eine einzige Gesamtheit gezählt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַקָּהָל
  choice: die ganze Versammlung
  rationale: כָּל mit dem bestimmten הַקָּהָל bezeichnet die Gesamtheit der versammelten Gemeinschaft; „die ganze Versammlung“ ist im Deutschen natürlich und entspricht dem Listen- und Zählungskontext.
- source_word: כְּאֶחָד
  choice: zusammen
  rationale: Wörtlich bedeutet die Wendung „wie einer“ beziehungsweise „als einer“. Hier fasst sie die Versammlung für die Gesamtzahl als eine Einheit zusammen; „zusammen“ gibt diesen Sinn idiomatisch wieder, während die Fußnote die Bildlichkeit bewahrt.
- source_word: אַרְבַּע רִבּוֹא אַלְפַּיִם שְׁלֹשׁ מֵאוֹת וְשִׁשִּׁים
  choice: 42.360 Menschen
  rationale: Die einzelnen hebräischen Zahlenglieder ergeben 42.360. „Menschen“ verdeutlicht im Deutschen knapp, dass es sich um die Zahl der Angehörigen der Versammlung handelt, ohne eine Geschlechtsangabe einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zahl wird nach deutscher Schreibkonvention mit Tausenderpunkt geschrieben; die knappe Form entspricht dem Charakter einer statistischen Zusammenfassung.
