  text: אֵ֣לֶּה בְּנֵ֣י הַ/מְּדִינָ֗ה הָ/עֹלִים֙ מִ/שְּׁבִ֣י הַ/גּוֹלָ֔ה אֲשֶׁ֣ר הֶגְלָ֔ה נְבוּכַדְנֶצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יָּשׁ֧וּבוּ לִֽ/ירוּשָׁלִַ֛ם וְ/לִ/יהוּדָ֖ה אִ֥ישׁ לְ/עִירֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/006.yaml
  text: 'These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away, and who returned to Jerusalem and to Judah[c][b], each man to his city:'
translation:
  language: de
  text: 'Dies sind die Angehörigen der Provinz, die aus der Gefangenschaft der Verbannten[a] heraufzogen, diejenigen, die Nebukadnezar, der König von Babel, verschleppt hatte und die nach Jerusalem und Juda zurückkehrten, jeder in seine Stadt[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder flüssiger: „aus dem Exil“. Wörtlich steht im Hebräischen „aus der Gefangenschaft der Verbannten“; dabei werden zwei verwandte Begriffe miteinander verbunden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ein Mann in seine Stadt“. Die Wendung ist distributiv gemeint und bezieht sich auf die Rückkehrenden in ihren Familien- oder Hausverbänden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: die Söhne der Provinz
  rationale: Die wörtliche Wendung bewahrt die listen- und abstammungsbezogene Ausdrucksweise des Hebräischen; „Provinz“ bezeichnet den perserzeitlichen Verwaltungsbezirk.
- source_word: הָעֹלִים
  choice: die … heraufzogen
  rationale: „Heraufziehen“ bewahrt die übliche räumlich-theologische Aufstiegsformel für die Reise in das Land beziehungsweise nach Jerusalem.
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: aus der Gefangenschaft der Verbannten
  rationale: Die Wiedergabe bildet beide verwandten hebräischen Substantive ab, auch wenn „aus dem Exil“ im Deutschen flüssiger wäre.
- source_word: אֲשֶׁר הֶגְלָה
  choice: die … verschleppt hatte
  rationale: „Verschleppen“ bezeichnet die erzwungene Wegführung natürlich und deutlich; das Plusquamperfekt markiert ihre Vorzeitigkeit.
- source_word: נְבוּכַדְנֶצַּר מֶלֶךְ בָּבֶל
  choice: Nebukadnezar, der König von Babel
  rationale: Verwendet die im Deutschen vertrauten biblischen Namensformen und gibt die Apposition klar wieder.
- source_word: וַיָּשׁוּבוּ לִירוּשָׁלַם וְלִיהוּדָה
  choice: und die nach Jerusalem und Juda zurückkehrten
  rationale: Der zweite Relativsatz knüpft natürlich an die bezeichnete Personengruppe an; „zurückkehren“ entspricht dem Grundsinn von שׁוב.
- source_word: אִישׁ לְעִירוֹ
  choice: jeder in seine Stadt
  rationale: Die distributive Bedeutung wird idiomatisch wiedergegeben. „Jeder“ bewahrt den maskulinen Singular, ohne das im Deutschen unnötig schwerfällige „jeder Mann“ zu verwenden.
theological_decisions:
- issue: Repräsentativ maskuline Einzelform אִישׁ
  choice: jeder in seine Stadt
  alternative: jeder Mann in seine Stadt
  rationale: Die maskuline distributive Form bleibt erkennbar, während die deutsche Formulierung natürlich klingt. Im Kontext umfasst sie die Rückkehrenden samt ihren Familienverbänden, ohne diese Deutung in den Haupttext einzutragen.
- issue: Beziehung von וַיָּשׁוּבוּ zum vorangehenden Satz
  choice: und die … zurückkehrten
  alternative: und sie kehrten … zurück
  rationale: Die relative Anbindung ist im Deutschen syntaktisch klar und beschreibt weiterhin dieselbe Gruppe. Die mögliche stärker selbstständige Satzfortführung wird nicht theologisch zugespitzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst listenartigem Klang. Die etwas ungewohnte Wendung „Söhne der Provinz“ und die Doppelung „Gefangenschaft der Verbannten“ erhalten markante Formen des Ausgangstextes; Fußnoten bieten die nötige sprachliche Einordnung.
