lexical_decisions:
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: In dieser Namens- und Familienliste bezeichnet בְּנֵי die Angehörigen einer von der genannten Person hergeleiteten Familie oder Sippe. „Nachkommen“ gibt diese Funktion im heutigen Deutsch natürlicher und eindeutiger wieder als das wörtlichere „Söhne“.
- source_word: בַצְלִית
  choice: Bazlit
  rationale: Der Eigenname wird nach seiner hebräischen Form ins Deutsche übertragen; das abschließende ת wird als „t“ wiedergegeben.
- source_word: מְחִידָא
  choice: Mehida
  rationale: Der Eigenname wird transliteriert. Die Wiedergabe mit „h“ folgt der im Deutschen gut lesbaren Namensform, ohne dem Namen eine lexikalische Bedeutung zuzuschreiben.
- source_word: חַרְשָׁא
  choice: Harscha
  rationale: Der Eigenname wird in einer deutschen Transliteration wiedergegeben; שׁ erscheint als „sch“.
