source:
  edition: WLC
  text: וּ/מִ/קְצָת֙ רָאשֵׁ֣י הָֽ/אָב֔וֹת נָתְנ֖וּ לַ/מְּלָאכָ֑ה הַ/תִּרְשָׁ֜תָא נָתַ֣ן לָ/אוֹצָ֗ר זָהָ֞ב דַּרְכְּמֹנִ֥ים אֶ֨לֶף֙ מִזְרָק֣וֹת חֲמִשִּׁ֔ים כָּתְנוֹת֙ כֹּֽהֲנִ֔ים שְׁלֹשִׁ֖ים וַ/חֲמֵ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/069.yaml
  text: And some of the heads of the fathers’ houses gave to the work[a]. The governor gave to the treasury one thousand gold darics, fifty basins[c][b], and five hundred thirty-five priests’ tunics.
translation:
  language: de
  text: Und einige von den Oberhäuptern der Großfamilien gaben für die Arbeit. Der Statthalter[a] gab für die Schatzkammer 1.000 Golddariken[b], 50 Becken und 530 Priestergewänder.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Tirschata“, ein persischer Verwaltungstitel.'
    reason: lexical_alternative
  - marker: b
    text: Dariken waren persische Goldmünzen.
    reason: cultural_note
  - marker: c
    text: Der hebräische Text lautet hier „530 Priestergewänder“. In der Parallelstelle Esra 2,69 steht „100 Priestergewänder“.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִקְצָת רָאשֵׁי הָאָבוֹת
  choice: Und einige von den Oberhäuptern der Großfamilien
  rationale: מִקְצָת bezeichnet einen Teil der genannten Gruppe. רָאשֵׁי הָאָבוֹת ist eine nachexilische Bezeichnung für die Leiter größerer, durch Abstammung verbundener Familienverbände; „Oberhäupter der Großfamilien“ ist verständlich und wahrt den sozialen Sinn besser als die missverständliche wörtliche Form „Häupter der Väter“.
- source_word: לַמְּלָאכָה
  choice: für die Arbeit
  rationale: מְלָאכָה meint hier das gemeinsame Aufbauwerk beziehungsweise das damit verbundene Vorhaben. „Für die Arbeit“ gibt Zweck und Kontext natürlich wieder.
- source_word: הַתִּרְשָׁתָא
  choice: der Statthalter
  rationale: Der persische Verwaltungstitel wird seiner Funktion entsprechend übersetzt; die lautnahe Wiedergabe „Tirschata“ bleibt in einer Fußnote als Alternative erhalten.
- source_word: לָאוֹצָר
  choice: für die Schatzkammer
  rationale: אוֹצָר kann Vorratsraum oder Schatzkammer bedeuten. Bei der Übergabe von Münzen und kostbaren Geräten ist „Schatzkammer“ kontextuell angemessen; ל bezeichnet hier den vorgesehenen Empfänger beziehungsweise Bestimmungszweck.
- source_word: זָהָב דַּרְכְּמֹנִים אֶלֶף
  choice: 1.000 Golddariken
  rationale: דַּרְכְּמֹנִים bezeichnet im persischen Kontext Goldmünzen, die gewöhnlich als Dariken identifiziert werden. „Golddariken“ ist historisch präzise und erhält die ausdrückliche Materialangabe זָהָב.
- source_word: מִזְרָקוֹת
  choice: Becken
  rationale: Das Wort bezeichnet schalen- oder beckenartige Gefäße, häufig für den kultischen Gebrauch. „Becken“ ist klar, ohne eine im Vers nicht ausdrücklich genannte Einzelfunktion festzulegen.
- source_word: כָּתְנוֹת כֹּהֲנִים
  choice: Priestergewänder
  rationale: כָּתְנוֹת sind tunikaartige Kleidungsstücke. „Priestergewänder“ klingt im Deutschen natürlich und bezeichnet hier die für Priester bestimmten Amtskleider, ohne die Form übermäßig eng festzulegen.
- source_word: שְׁלֹשִׁים וַחֲמֵשׁ מֵאוֹת
  choice: '530'
  rationale: Der masoretische Text lautet wörtlich „dreißig und fünf Hundert“, also 30 + 500 = 530. Die konsultierte englische Fassung gibt irrtümlich 535 wieder; maßgeblich ist hier der hebräische Quelltext.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zahlen stehen zur schnellen Erfassbarkeit als Ziffern. Der Satzbau folgt dem hebräischen Ablauf, bleibt aber idiomatisch. Die textliche Spannung zur Parallelstelle wird nicht harmonisiert; insbesondere wird die hebräische Zahl korrekt als 530 wiedergegeben.
