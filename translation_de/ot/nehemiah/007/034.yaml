  text: 'die Söhne eines anderen Elam[a]: 1.254.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »des anderen Elam«. Das hebräische Adjektiv kann hier sowohl unbestimmt als auch zur Kennzeichnung des anderen, bereits von einem früher genannten Elam unterschiedenen Familienverbands verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der Status constructus im Plural bezeichnet in dieser Heimkehrerliste die Angehörigen einer Familie oder Sippe. »Die Söhne« bewahrt die formale Verbindung zum hebräischen Ausdruck, ohne die gemeinte Abstammungsgruppe auszuschließen.
- source_word: עֵילָם
  choice: Elam
  rationale: Der Eigenname wird transliteriert und bezeichnet hier eine Familie beziehungsweise Sippe in der Liste.
- source_word: אַחֵר
  choice: eines anderen
  rationale: Das Adjektiv kann »ein anderer« oder kontextuell »der andere« bedeuten. »Eines anderen Elam« ist im Deutschen natürlich und unterscheidet diesen Eintrag von dem zuvor genannten Elam, ohne die im Hebräischen nicht ausdrücklich markierte Bestimmtheit festzulegen.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: '1.254'
  rationale: Die hebräische Zahlenfolge ergibt genau eintausendzweihundertvierundfünfzig. Die Ziffernschreibung mit deutschem Tausenderpunkt erhöht in einer Zählliste die Übersichtlichkeit.
