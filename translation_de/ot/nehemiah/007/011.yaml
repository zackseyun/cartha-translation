  text: the sons of Pahath-moab[a], of the sons of Jeshua and Joab, 2,818.
translation:
  language: de
  text: 'die Söhne Pahat-Moabs[a], von den Söhnen Jeschuas und Joabs: 2.818.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Nachkommen Pahat-Moabs … die Nachkommen Jeschuas und Joabs“. Das hebräische „Söhne“ bezeichnet häufig eine weiter gefasste Familienlinie, nicht nur unmittelbare Söhne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Die formnahe Wiedergabe bewahrt die hebräische Ausdrucksweise der Rückkehrerliste; in diesem Zusammenhang bezeichnet sie eine Familien- oder Sippengruppe und nicht zwingend unmittelbare Söhne.
- source_word: פַחַת מוֹאָב
  choice: Pahat-Moab
  rationale: Der Eigenname wird nach einer im Deutschen geläufigen, der hebräischen Form nahen Umschrift wiedergegeben und nicht übersetzt.
- source_word: לִבְנֵי
  choice: von den Söhnen
  rationale: Das Präfix ל markiert hier wahrscheinlich eine Untergliederung beziehungsweise Zugehörigkeit innerhalb der Sippe Pahat-Moab. „Von den Söhnen“ wahrt diese Beziehung, ohne sie genauer festzulegen.
- source_word: יֵשׁוּעַ
  choice: Jeschua
  rationale: Die nachexilische Namensform wird entsprechend dem tatsächlich vorliegenden Hebräisch als „Jeschua“ und nicht als „Josua“ wiedergegeben.
- source_word: וְיוֹאָב
  choice: und Joabs
  rationale: Die Konjunktion wird schlicht mit „und“ wiedergegeben; der Eigenname steht wegen der deutschen Konstruktion im Genitiv.
- source_word: אַלְפַּיִם וּשְׁמֹנֶה מֵאוֹת שְׁמֹנָה עָשָׂר
  choice: '2.818'
  rationale: Die Zahl lautet genau 2.818. Ziffern verbessern in einer Zählliste die Übersichtlichkeit.
theological_decisions: []
