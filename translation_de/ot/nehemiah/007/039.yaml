  text: הַֽ/כֹּהֲנִ֑ים בְּנֵ֤י יְדַֽעְיָה֙ לְ/בֵ֣ית יֵשׁ֔וּעַ תְּשַׁ֥ע מֵא֖וֹת שִׁבְעִ֥ים וּ/שְׁלֹשָֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/039.yaml
  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], nine hundred seventy-three.'
translation:
  language: de
  text: 'Die Priester: die Nachkommen Jedajas[a] aus dem Haus Jeschuas[b]: 973.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Söhne Jedajas«; damit können auch Nachkommen oder Angehörige seiner Familienlinie gemeint sein.
    reason: lexical_alternative
  - marker: b
    text: Der Name »Jeschua« kann auch als »Josua« wiedergegeben werden; »Jeschua« entspricht genauer der hier gebrauchten nachexilischen hebräischen Namensform.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: Die Priester
  rationale: Der bestimmte Plural leitet in der Volksliste die Gruppe der Priester ein; die knappe nominale Form entspricht dem Listenstil.
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: Im genealogischen und statistischen Zusammenhang bezeichnet בְּנֵי nicht notwendig unmittelbare Söhne, sondern Angehörige einer Abstammungs- oder Familienlinie. »Nachkommen« gibt diesen Sinn im modernen Deutsch klar wieder.
- source_word: יְדַעְיָה
  choice: Jedaja
  rationale: Der Personenname wird nach einer im Deutschen gebräuchlichen Wiedergabe der hebräischen Form transliteriert.
- source_word: לְבֵית יֵשׁוּעַ
  choice: aus dem Haus Jeschuas
  rationale: בַּיִת mit einem Personennamen bezeichnet hier ein Haus beziehungsweise eine Familienlinie; das präfigierte ל kennzeichnet die Zugehörigkeit. »Aus dem Haus« ist im Deutschen natürlich und bewahrt den genealogischen Sinn.
- source_word: יֵשׁוּעַ
  choice: Jeschua
  rationale: Die Wiedergabe »Jeschua« bildet die hier verwendete nachexilische Namensform יֵשׁוּעַ ab; die alternative Form »Josua« ist als Fußnote vermerkt.
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: '973'
  rationale: Die Zahlwörter ergeben 973; Ziffern sind in einer langen Volks- und Familienliste klar und gut erfassbar.
theological_decisions: []
translation_notes:
  register: Knapper, würdevoller Listenstil in modernem Standarddeutsch. »Nachkommen« vermeidet das mögliche Missverständnis, es handle sich ausschließlich um unmittelbare Söhne; die wörtliche Form bleibt in der Fußnote sichtbar. Die Doppelpunkte gliedern Gruppenbezeichnung, Familienzuordnung und Anzahl.
