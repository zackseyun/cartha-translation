base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/070.yaml
  text: 'And some of the heads of the fathers’ houses gave to the treasury for the work: twenty thousand gold darics and two thousand two hundred minas of silver[a][b][c].'
translation:
  language: de
  text: 'Und einige der Oberhäupter der Familienverbände[b] gaben für die Schatzkammer des Werkes: 20.000 Golddariken[a] und 2.200 Minen Silber[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Darike war eine persische Goldmünze.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „von den Oberhäuptern der Vaterhäuser“.'
    reason: lexical_alternative
  - marker: c
    text: Eine Mine war eine antike Gewichts- und damit auch Werteinheit.
    reason: cultural_note
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: Und einige der Oberhäupter der Großfamilien
  rationale: 'Die Präposition מִן bezeichnet hier eine Teilmenge: Einige aus dem Kreis der Oberhäupter gaben. „Großfamilien“ gibt die genealogisch-soziale Bedeutung von אָבוֹת verständlich wieder, ohne sie auf moderne Kleinfamilien zu verengen.'
- source_word: נָתְנוּ
  choice: gaben
  rationale: Die schlichte Wiedergabe entspricht dem Qal Perfekt und fügt keine über den Text hinausgehende Wertung wie „spendeten“ hinzu.
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: für die Schatzkammer der Arbeiten
  rationale: אוֹצָר bezeichnet eine Schatzkammer beziehungsweise einen Vorrat an Wertgegenständen; die Formulierung bewahrt die enge Zuordnung zu den auszuführenden Arbeiten, ohne deren genaue Art zusätzlich festzulegen.
- source_word: זָהָב דַּרְכְּמוֹנִים
  choice: Golddariken
  rationale: Die Zusammensetzung nennt Material und historische Münze prägnant und bewahrt die persische Währungsbezeichnung.
- source_word: שְׁתֵּי רִבּוֹת
  choice: '20.000'
  rationale: Die wörtlichen „zwei Zehntausende“ werden in der üblichen deutschen Zahlform wiedergegeben.
- source_word: וְכֶסֶף מָנִים
  choice: und … Minen Silber
  rationale: „Mine“ bewahrt die antike Gewichts- und Werteinheit; „Silber“ bezeichnet das gemessene Material.
- source_word: אַלְפַּיִם וּמָאתָיִם
  choice: '2.200'
  rationale: Die hebräische Zahlenfolge wird in natürlicher deutscher Schreibweise wiedergegeben.
