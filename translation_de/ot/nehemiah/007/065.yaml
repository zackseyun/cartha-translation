source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/תִּרְשָׁ֨תָא֙ לָ/הֶ֔ם אֲשֶׁ֥ר לֹא יֹאכְל֖וּ מִ/קֹּ֣דֶשׁ הַ/קֳּדָשִׁ֑ים עַ֛ד עֲמֹ֥ד הַ/כֹּהֵ֖ן לְ/אוּרִ֥ים וְ/תוּמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/065.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b].
translation:
  language: de
  text: Und der Statthalter[a] sagte ihnen, dass sie nichts von den hochheiligen Gaben[b] essen dürften, bis ein Priester mit Urim und Tummim auftrete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Tirschata“, ein persischer Verwaltungstitel.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind die als „hochheilig“ geltenden priesterlichen Speiseanteile, nicht das Allerheiligste im Heiligtum.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: der Statthalter
  rationale: Der persische Verwaltungstitel wird seiner Funktion entsprechend übersetzt. „Statthalter“ ist im Deutschen klar und für den historischen Kontext angemessen; die lautliche Wiedergabe steht in der Fußnote.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: dass sie … nicht essen dürften
  rationale: Der Satz gibt die Anordnung des Statthalters in indirekter Rede wieder. „Dürften“ drückt das Verbot natürlich aus, ohne den hebräischen Wortlaut unnötig zu verschärfen.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: von den hochheiligen Gaben
  rationale: Die superlativische Wendung bezeichnet hier aufgrund des Zusammenhangs die den Priestern zustehenden hochheiligen Speiseanteile, nicht das Allerheiligste als Raum. „Gaben“ macht den sachlichen Bezug im Haupttext verständlich.
- source_word: עַד עֲמֹד הַכֹּהֵן
  choice: bis ein Priester … auftrete
  rationale: עַד mit dem Infinitiv bezeichnet den zukünftigen Zeitpunkt, bis zu dem das Verbot gilt. Der bestimmte Artikel kann hier generisch sein; deshalb ist „ein Priester“ sachgerecht. Der Konjunktiv „auftrete“ führt die indirekte Rede fort.
- source_word: לְאוּרִים וְתוּמִּים
  choice: mit Urim und Tummim
  rationale: Die traditionellen Bezeichnungen der priesterlichen Lose beziehungsweise Erkenntnismittel werden transliteriert. „Mit“ wahrt die offene instrumentale beziehungsweise zuordnende Bedeutung der Präposition.
theological_decisions:
- issue: Bezug von קֹדֶשׁ הַקֳּדָשִׁים
  choice: hochheilige priesterliche Gaben beziehungsweise Speiseanteile
  alternative: das Allerheiligste als innerster Heiligtumsraum
  rationale: Im Zusammenhang geht es um Personen mit ungeklärter priesterlicher Abstammung und darum, ob sie von den priesterlichen Anteilen essen dürfen. Der räumliche Sinn passt daher nicht zum unmittelbaren Kontext.
- issue: Wiedergabe des persischen Amtstitels
  choice: Statthalter
  alternative: Tirschata
  rationale: Da es sich um einen Verwaltungstitel und nicht um einen Eigennamen handelt, vermittelt die Übersetzung die Funktion unmittelbar; die alternative traditionelle Form bleibt in der Fußnote erhalten.
- issue: Bestimmtheit von הַכֹּהֵן
  choice: ein Priester
  alternative: der Priester
  rationale: Der Artikel kann die Amtsgattung bezeichnen, ohne auf eine zuvor genannte Einzelperson zu verweisen. Die Unbestimmtheit wird deshalb im Deutschen bewahrt, ohne die Identität des erwarteten Priesters festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die indirekte Rede wird durch „dürften“ und „auftrete“ konsequent markiert. „Hochheilige Gaben“ verbindet die superlativische Heiligkeitsaussage des Hebräischen mit der im Kontext erforderlichen Klarheit über die priesterlichen Speiseanteile.
