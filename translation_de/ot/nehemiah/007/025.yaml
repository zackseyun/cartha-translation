lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der Status constructus Plural von בֵּן bezeichnet in genealogischen und statistischen Listen häufig die Angehörigen einer Sippe oder Ortsgemeinschaft. „Die Söhne“ bewahrt die wiederkehrende hebräische Listenformel; eine Fußnote erläutert ihren weiteren Bedeutungsumfang.
- source_word: גִבְעוֹן
  choice: Gibeons
  rationale: Der Eigenname wird in der im Deutschen eingebürgerten Form „Gibeon“ wiedergegeben. Der Genitiv entspricht der hebräischen Constructusverbindung.
- source_word: תִּשְׁעִים וַחֲמִשָּׁה
  choice: '95'
  rationale: Die Zahl bedeutet 95. In einer modernen deutschen Namens- und Zahlenliste ist die Ziffernschreibung natürlich und übersichtlich.
