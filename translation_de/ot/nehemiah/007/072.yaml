source:
  edition: WLC
  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֡ם וְ/הַ/שּׁוֹעֲרִים֩ וְ/הַ/מְשֹׁרְרִ֨ים וּ/מִן הָ/עָ֧ם וְ/הַ/נְּתִינִ֛ים וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶ֑ם וַ/יִּגַּע֙ הַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י וּ/בְנֵ֥י יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/072.yaml
  text: So the priests[a], the Levites, the gatekeepers, the singers, some of the people, the temple servants, and all Israel lived in their cities. And when the seventh month arrived[b], the sons of Israel were in their cities.
translation:
  language: de
  text: So ließen sich die Priester, die Leviten, die Torwächter, die Sänger, einige aus dem Volk, die Tempeldiener[a] und ganz Israel in ihren Städten nieder. Und als der siebte Monat gekommen war, waren die Söhne Israels[b] in ihren Städten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Netinim«; dies ist die traditionelle Umschrift der Bezeichnung für diese Gruppe von Tempeldienern.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Israeliten« beziehungsweise »das Volk Israel«. Wörtlich steht im Hebräischen: »die Söhne Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: ließen sich ... nieder
  rationale: ישׁב kann »wohnen« oder »sich niederlassen« bedeuten. Im Zusammenhang der Rückkehr und Wiederbesiedlung gibt »sich niederlassen« den Vorgang natürlich wieder.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die übliche und genaue deutsche Wiedergabe von כֹּהֲנִים.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die etablierte deutsche Bezeichnung für diese kultische Gruppe.
- source_word: הַשּׁוֹעֲרִים
  choice: die Torwächter
  rationale: Bezeichnet die für Bewachung und Dienst an den Toren Zuständigen; »Torwächter« ist klar und gegenwärtig.
- source_word: הַמְשֹׁרְרִים
  choice: die Sänger
  rationale: Die Form bezeichnet diejenigen, die insbesondere im Tempeldienst sangen.
- source_word: וּמִן הָעָם
  choice: einige aus dem Volk
  rationale: 'Die Präposition מִן hat hier partitive Bedeutung: Gemeint ist ein Teil des Volkes neben den zuvor genannten Dienstgruppen.'
- source_word: הַנְּתִינִים
  choice: die Tempeldiener
  rationale: Der Ausdruck bezeichnet eine fest umrissene, dem Tempeldienst zugeordnete Gruppe. Die Funktionsbezeichnung ist für heutige Leser verständlich; die traditionelle Umschrift steht in der Fußnote.
- source_word: וְכָל יִשְׂרָאֵל
  choice: und ganz Israel
  rationale: Bewahrt die kollektive Bezeichnung des hebräischen Textes.
- source_word: בְּעָרֵיהֶם
  choice: in ihren Städten
  rationale: עִיר kann Stadt oder Ortschaft bezeichnen; »Städte« ist im Kontext der Siedlungsliste eine natürliche Wiedergabe.
- source_word: וַיִּגַּע
  choice: als ... gekommen war
  rationale: נגע bedeutet wörtlich »erreichen/berühren«, bezeichnet bei einer Zeitangabe aber idiomatisch das Eintreffen des Monats.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: der siebte Monat
  rationale: Direkte Wiedergabe der kalendarischen Angabe.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Gibt die ausdrücklich maskuline Form בְּנֵי יִשְׂרָאֵל formal wieder. Da sie hier zugleich als kollektive Volksbezeichnung dient, nennt die Fußnote idiomatische Alternativen.
theological_decisions:
- issue: Geschlechtlich markierte kollektive Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten / das Volk Israel
  rationale: Die Hauptübersetzung bewahrt die Formulierung des Ausgangstextes, ohne zu verschleiern, dass sie im Kontext das Volk insgesamt bezeichnet. Die idiomatischeren kollektiven Wiedergaben werden in einer Fußnote angeboten.
- issue: Wiedergabe von הַנְּתִינִים
  choice: die Tempeldiener
  alternative: die Netinim
  rationale: Die funktionale Übersetzung ist allgemein verständlich und legt keine zusätzliche theologische Deutung fest; die traditionelle Umschrift bleibt zur Nachprüfbarkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung bleibt eng am hebräischen Satzbau, während »ließen sich ... nieder« den Wiederbesiedlungskontext natürlich ausdrückt. Der einleitende Anschluss der zweiten Aussage wird mit »Und« bewahrt.
