source:
  edition: WLC
  text: וַ/אֲשֶׁ֣ר נָתְנוּ֮ שְׁאֵרִ֣ית הָ/עָם֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שְׁתֵּ֣י רִבּ֔וֹא וְ/כֶ֖סֶף מָנִ֣ים אַלְפָּ֑יִם וְ/כָתְנֹ֥ת כֹּֽהֲנִ֖ים שִׁשִּׁ֥ים וְ/שִׁבְעָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/071.yaml
  text: And what the rest of the people gave was twenty thousand gold darics[a], two thousand minas of silver[c][b], and sixty-seven priests’ tunics.
translation:
  language: de
  text: Und was das übrige Volk gab, waren 20.000 Golddariken[a], 2.000 Minen Silber[b] und 67 Priestergewänder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Darike war eine persische Goldmünze.
    reason: cultural_note
  - marker: b
    text: Eine Mine war eine antike Gewichts- und damit auch Werteinheit.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲשֶׁר נָתְנוּ
  choice: Was … gab, waren
  rationale: Die resumptive Relativkonstruktion leitet einen weiteren Posten der Aufstellung ein. Die deutsche Satzform ist natürlich und bewahrt den Sinn von »und was … gab«.
- source_word: שְׁאֵרִית הָעָם
  choice: das übrige Volk
  rationale: שְׁאֵרִית bezeichnet hier im administrativen Zusammenhang den nach den zuvor genannten Gebern verbleibenden Teil des Volkes, ohne notwendig einen theologischen »Rest« zu meinen.
- source_word: זָהָב דַּרְכְּמוֹנִים
  choice: Golddariken
  rationale: דַּרְכְּמוֹנִים bezeichnet persische Goldmünzen. Der historische Fachbegriff bewahrt mehr Genauigkeit als das allgemeine »Goldmünzen«.
- source_word: שְׁתֵּי רִבּוֹא
  choice: '20.000'
  rationale: Die hebräische Wendung bedeutet wörtlich »zwei Zehntausende«; 20.000 ist die übliche moderne Zahlenangabe.
- source_word: וְכֶסֶף מָנִים אַלְפָּיִם
  choice: 2.000 Minen Silber
  rationale: מָנִים ist der Plural einer antiken Gewichts- und Werteinheit. Die deutsche Wortfolge gibt den hebräischen Sinn klar wieder, ohne einen unsicheren modernen Gegenwert einzusetzen.
- source_word: וְכָתְנֹת כֹּהֲנִים
  choice: Priestergewänder
  rationale: כָּתְנֹת bezeichnet Gewänder beziehungsweise lange Leibkleider. »Priestergewänder« ist im Deutschen natürlich und lässt offen, ob Besitz oder Bestimmung im Vordergrund steht.
- source_word: שִׁשִּׁים וְשִׁבְעָה
  choice: '67'
  rationale: Moderne deutsche Wiedergabe der Zahl »sechzig und sieben«.
theological_decisions:
- issue: Bedeutung von שְׁאֵרִית in dieser Geberliste
  choice: das übrige Volk
  alternative: der Rest des Volkes
  rationale: Die Formulierung unterscheidet hier wahrscheinlich die übrige Bevölkerung von den zuvor aufgeführten Gebern. Eine theologisch aufgeladene Deutung als heiliger »Rest« wird daher nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die antiken Einheiten bleiben aus historischer Genauigkeit erhalten und werden knapp erläutert; Ziffern unterstützen die Lesbarkeit der Inventarangabe.
