  text: בְּנֵ֧י שְׁפַטְיָ֣ה בְנֵֽי חַטִּ֗יל בְּנֵ֛י פֹּכֶ֥רֶת הַצְּבָיִ֖ים בְּנֵ֥י אָמֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/059.yaml
  text: the sons of Shephatiah[a], the sons of Hattil, the sons of Pochereth-hazzebaim[b], the sons of Amon.
translation:
  language: de
  text: die Nachkommen Schefatjas[a], die Nachkommen Hattils, die Nachkommen Pocheret-Hazzebajims[b], die Nachkommen Amons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier und im weiteren Verlauf des Verses jeweils „die Söhne“; in genealogischen Listen kann der hebräische Ausdruck eine ganze Nachkommenschaft oder Familienlinie bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Bezeichnung lässt sich auch als „Pocheret von Zebajim“ auffassen; hier wird sie als zusammengesetzter Eigenname wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: In dieser Rückkehrerliste bezeichnet der Konstruktplural von בֵּן jeweils eine Familienlinie und nicht zwingend unmittelbare Söhne. „Nachkommen“ gibt die gemeinte genealogische Zugehörigkeit im heutigen Deutsch natürlich wieder.
- source_word: שְׁפַטְיָה
  choice: Schefatja
  rationale: Der Personen- beziehungsweise Familienname wird nach gängiger deutscher Bibelnamenkonvention wiedergegeben.
- source_word: חַטִּיל
  choice: Hattil
  rationale: Der Eigenname wird direkt transliteriert und nicht inhaltlich übersetzt.
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: Pocheret-Hazzebajim
  rationale: Die hebräische Wortgruppe wird als zusammengehörige Familienbezeichnung bewahrt; der Bindestrich macht diese Einheit sichtbar.
- source_word: אָמֽוֹן
  choice: Amon
  rationale: Der Ausdruck wird hier als Eigenname beziehungsweise Familienbezeichnung verstanden und entsprechend transliteriert.
