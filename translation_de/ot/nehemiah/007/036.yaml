- source_word: יְרֵחוֹ
  choice: Jerichos
  rationale: Der Ortsname wird in seiner üblichen deutschen Form wiedergegeben; der Genitiv macht die Zugehörigkeitsbeziehung der hebräischen Konstruktusverbindung deutlich.
- source_word: שְׁלֹשׁ מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: dreihundertfünfundvierzig
  rationale: Die hebräische Zahlenfolge bezeichnet eindeutig 345 und wird nach heutiger deutscher Rechtschreibung als ein Wort geschrieben.
