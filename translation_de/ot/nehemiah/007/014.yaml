lexical_decisions:
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: Der Status-constructus-Plural von בֵּן bezeichnet in dieser Heimkehrer- und Familienliste die Angehörigen beziehungsweise Nachkommen einer Sippe. „Nachkommen“ gibt die gemeinte genealogische Gruppe im modernen Deutschen natürlicher und eindeutiger wieder als das wörtliche „Söhne“.
- source_word: זַכָּי
  choice: Sakkai
  rationale: Der Personenname wird nach den hebräischen Konsonanten und der masoretischen Vokalisierung ins Deutsche übertragen; „Sakkai“ entspricht einer geläufigen deutschen Form.
- source_word: שְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: '760'
  rationale: Die Zahl bedeutet wörtlich „siebenhundert und sechzig“. In der fortlaufenden Zählliste ist die Ziffernschreibung knapp, klar und im modernen Deutschen gut lesbar.
