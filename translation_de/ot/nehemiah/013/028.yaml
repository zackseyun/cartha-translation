  text: And one of the sons of Joiada son of Eliashib the high priest was a son-in-law of Sanballat the Horonite[b][a], so I drove him away from me.
translation:
  language: de
  text: Und einer von den Söhnen Jojadas, des Sohnes Eljaschibs, des Hohenpriesters, war ein Schwiegersohn Sanballats, des Horoniters[a]. Da jagte ich ihn von mir fort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder allgemeiner: „war durch Heirat mit Sanballat verwandt“. Das hebräische Wort bezeichnet eine Heiratsverwandtschaft; in diesem Zusammenhang liegt „Schwiegersohn“ am nächsten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vertrieb ich ihn“ beziehungsweise „verbannte ich ihn“. Das hebräische Verb betont die nachdrückliche Entfernung, lässt aber offen, ob es sich um eine förmliche Verbannung handelte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Und einer von den Söhnen
  rationale: 'Die Verbindung aus Konjunktion, Präposition und בנים wird partitativ gebraucht: Gemeint ist einer aus der Gruppe der Söhne.'
- source_word: יוֹיָדָע
  choice: Jojada
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibelnamenform wiedergegeben.
- source_word: בֶּן אֶלְיָשִׁיב
  choice: des Sohnes Eljaschibs
  rationale: Die Abstammungsangabe bleibt zur genealogischen Klarheit ausdrücklich erhalten.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: des Hohen Priesters
  rationale: „Hoher Priester“ ist die etablierte und sachlich passende deutsche Wiedergabe des israelitischen Amtstitels.
- source_word: חָתָן לְסַנְבַלַּט
  choice: war ein Schwiegersohn Sanballats
  rationale: חָתָן bezeichnet eine durch Heirat begründete Beziehung und ist hier am natürlichsten als „Schwiegersohn“ zu verstehen; die weitere Bedeutung wird in einer Fußnote bewahrt.
- source_word: הַחֹרֹנִי
  choice: des Horoniters
  rationale: Die Herkunftsbezeichnung wird als substantiviertes deutsches Gentiliz wiedergegeben.
- source_word: וָאַבְרִיחֵהוּ
  choice: Da jagte ich ihn … fort
  rationale: Der Hifil von ברח bezeichnet hier ein gewaltsames oder nachdrückliches Vertreiben. „Fortjagen“ bewahrt diese Stärke, ohne eine förmliche rechtliche Verbannung vorauszusetzen.
- source_word: מֵעָלָי
  choice: von mir
  rationale: Die wörtlich räumliche Wendung bedeutet idiomatisch die Entfernung aus Nehemias Nähe oder Einflussbereich; „von mir“ lässt den Umfang bewusst offen.
