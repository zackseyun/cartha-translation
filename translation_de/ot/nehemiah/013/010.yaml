  text: וָ/אֵ֣דְעָ֔/ה כִּֽי מְנָי֥וֹת הַ/לְוִיִּ֖ם לֹ֣א נִתָּ֑נָה וַ/יִּבְרְח֧וּ אִישׁ לְ/שָׂדֵ֛/הוּ הַ/לְוִיִּ֥ם וְ/הַ/מְשֹׁרְרִ֖ים עֹשֵׂ֥י הַ/מְּלָאכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/010.yaml
  text: And I learned that the portions of the Levites had not been given[b][a], so the Levites and the singers who did the work had each fled to his field.
translation:
  language: de
  text: Da erfuhr ich, dass den Leviten ihre Anteile[a] nicht gegeben worden waren. Deshalb flohen die Leviten und die Sänger, die die Arbeit verrichteten, jeder auf sein eigenes Feld[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre vorgeschriebenen Anteile“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „jeder auf sein Feld“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵדְעָה
  choice: Da erfuhr ich
  rationale: ידע bezeichnet hier Nehemias Entdeckung eines bereits bestehenden Missstands. „Erfuhr“ gibt dieses Zum-Wissen-Kommen natürlich wieder; „Da“ bindet den Satz an den Erzählfortgang an.
- source_word: מְנָיוֹת הַלְוִיִּם
  choice: den Leviten ihre Anteile
  rationale: מְנָיוֹת bezeichnet die ihnen zustehenden beziehungsweise zugewiesenen Versorgungsanteile. Die deutsche Formulierung gibt die Zugehörigkeit und den Empfänger natürlich wieder, ohne die Art der Anteile unnötig festzulegen.
- source_word: לֹא נִתָּנָה
  choice: nicht gegeben worden waren
  rationale: Die passive Form von נתן bleibt erhalten. Das Plusquamperfekt verdeutlicht, dass die unterlassene Versorgung der anschließend geschilderten Flucht vorausging.
- source_word: וַיִּבְרְחוּ
  choice: waren … geflohen
  rationale: ברח bedeutet „fliehen“. Das Plusquamperfekt passt zum rückblickend festgestellten Zustand; die verteilende Bedeutung wird durch „jeder“ ausgedrückt.
- source_word: אִישׁ לְשָׂדֵהוּ
  choice: jeder auf sein eigenes Feld
  rationale: 'Die hebräische Wendung ist distributiv: Jeder kehrte zu seinem jeweiligen Feld zurück. „Eigenes“ macht diese Bedeutung im Deutschen deutlich.'
- source_word: וְהַמְשֹׁרְרִים
  choice: und die Sänger
  rationale: „Sänger“ ist die übliche, kontextuell ausreichende Bezeichnung für die am Tempeldienst beteiligten Sänger.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: die die Arbeit verrichteten
  rationale: Die partizipiale Wendung wird als Relativsatz wiedergegeben und bleibt hinsichtlich der genauen Art der Arbeit so offen wie der hebräische Text.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne den Ursache-Folge-Zusammenhang oder die zeitliche Abfolge zu verändern. Die Tempelarbeit wird nicht näher bestimmt, als es der hebräische Text erlaubt.
