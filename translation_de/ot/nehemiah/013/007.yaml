base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/007.yaml
  text: When I came to Jerusalem[b][a], I understood the evil that Eliashib had done for Tobiah by making a chamber for him in the courts of the house of God.
translation:
  language: de
  text: Als ich nach Jerusalem kam, erkannte ich das Böse, das Eljaschib für Tobija getan hatte, indem er ihm einen Raum[a] in den Höfen des Hauses Gottes[b] einrichtete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Kammer“. Das hebräische Wort bezeichnet einen Raum innerhalb des Tempelkomplexes.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Haus Gottes“ ist der Tempel gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וָאָבוֹא לִירוּשָׁלִָם
  choice: Als ich nach Jerusalem kam
  rationale: Die beiden Formen erzählen die Ankunft und die anschließende Erkenntnis. Der temporale Nebensatz gibt diesen Zusammenhang im Deutschen natürlich wieder; לִירוּשָׁלִַם bezeichnet die Richtung nach Jerusalem.
- source_word: וָאָבִינָה
  choice: erkannte ich
  rationale: בין bezeichnet hier das Wahrnehmen oder Begreifen eines Sachverhalts. „Erkannte“ bewahrt den kognitiven Sinn, ohne näher festzulegen, auf welchem Weg Nehemia davon erfuhr.
- source_word: בָרָעָה
  choice: das Böse
  rationale: רָעָה enthält hier ein ausdrückliches moralisches Urteil. „Das Böse“ bewahrt dieses Gewicht stärker als das mildere „der Fehler“ oder „das Unrecht“.
- source_word: אֲשֶׁר עָשָׂה אֶלְיָשִׁיב לְטוֹבִיָּה
  choice: das Eljaschib für Tobija getan hatte
  rationale: Das Plusquamperfekt macht deutlich, dass Eljaschibs Handlung Nehemias Erkenntnis vorausging; לְטוֹבִיָּה kennzeichnet Tobija als Begünstigten.
- source_word: לַעֲשׂוֹת לוֹ נִשְׁכָּה
  choice: indem er ihm einen Raum einrichtete
  rationale: Der Infinitiv erläutert, worin die böse Tat bestand. נִשְׁכָּה bezeichnet einen Raum oder eine Kammer im Tempelbereich; „Raum“ ist gegenwärtiges, verständliches Deutsch, während „einrichtete“ die Herrichtung für Tobijas Nutzung ausdrückt.
- source_word: בְּחַצְרֵי
  choice: in den Vorhöfen
  rationale: חָצֵר bezeichnet hier die Hofbereiche des Tempelkomplexes. „Vorhöfe“ ist die im deutschen Bibelregister geläufige und dennoch verständliche Bezeichnung.
- source_word: בֵּית הָאֱלֹהִים
  choice: Haus Gottes
  rationale: Die wörtliche Wendung wird bewahrt; im Zusammenhang bezeichnet sie den Tempel.
theological_decisions:
- issue: Moralische Bewertung von Eljaschibs Handlung
  choice: „das Böse“
  alternative: „das Unrecht“
  rationale: Der Text selbst bewertet die Handlung mit רָעָה moralisch. Die Übersetzung erhält diese Schärfe, ohne zusätzliche Motive oder Schuldgrade einzutragen.
- issue: Bezeichnung des Heiligtums
  choice: „Haus Gottes“
  alternative: „Tempel Gottes“
  rationale: „Haus Gottes“ wahrt die Bildsprache des Hebräischen; eine Fußnote erklärt die konkrete Bezugnahme auf den Tempel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräischen Personennamen werden in den geläufigen deutschen Formen „Eljaschib“ und „Tobija“ wiedergegeben. Die Satzstruktur bleibt nah am Ausgangstext, wird aber durch einen temporalen Nebensatz und „indem“ idiomatisch gegliedert.
