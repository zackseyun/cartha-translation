  naturalness: „Sie konnten nicht Judäisch sprechen“ ist natürliches modernes Standarddeutsch. „Die Sprache von Aschdod“ ist verständlicher und weniger künstlich als die nicht geläufige Sprachbezeichnung „Aschdodisch“.
