  text: וּ/בְנֵי/הֶ֗ם חֲצִי֙ מְדַבֵּ֣ר אַשְׁדּוֹדִ֔ית וְ/אֵינָ֥/ם מַכִּירִ֖ים לְ/דַבֵּ֣ר יְהוּדִ֑ית וְ/כִ/לְשׁ֖וֹן עַ֥ם וָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/024.yaml
  text: And half of their children spoke Ashdodite[a], and they were not able to speak Judean, but only the language of one people or another.
translation:
  language: de
  text: Und die Hälfte ihrer Kinder sprach die Sprache von Aschdod und konnte nicht Judäisch sprechen, sondern jeweils die Sprache des betreffenden Volkes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und nach der Sprache eines Volkes und eines Volkes“. Die elliptische Wendung kann bedeuten: jeweils entsprechend der Sprache des betreffenden Volkes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: ihre Kinder
  rationale: בנים kann enger „Söhne“ bedeuten, bezeichnet hier im Zusammenhang der gemischten Familien jedoch allgemein die Nachkommen.
- source_word: חֲצִי מְדַבֵּר
  choice: die Hälfte … sprach
  rationale: Das singularische חֲצִי mit dem singularischen Partizip bezeichnet die Hälfte der zuvor genannten Kinder; der Singular ist auch im Deutschen grammatisch angemessen.
- source_word: אַשְׁדּוֹדִית
  choice: Aschdodisch
  rationale: Die feminine Herkunftsbezeichnung benennt hier die mit Aschdod verbundene Sprache; „Aschdodisch“ bewahrt diese ethnisch-geografische Benennung knapp und verständlich.
- source_word: וְאֵינָם מַכִּירִים לְדַבֵּר
  choice: Sie konnten nicht … sprechen
  rationale: מכיר mit Infinitiv bezeichnet hier praktische Sprachkenntnis beziehungsweise Sprachfähigkeit, nicht bloß das Erkennen von etwas.
- source_word: יְהוּדִית
  choice: Judäisch
  rationale: Das Wort bezeichnet die Sprache Judas beziehungsweise der Judäer. „Judäisch“ ist präziser als „Jüdisch“ und legt die Sprache nicht ausdrücklich als Hebräisch fest.
- source_word: וְכִלְשׁוֹן עַם וָעָם
  choice: sondern nur die Sprache des einen oder anderen Volkes
  rationale: Die distributive Wendung עַם וָעָם verweist auf die verschiedenen Sprachen der umliegenden Völker. „Nur“ verdeutlicht im Deutschen den aus dem Gegensatz erschlossenen Ausschluss des Judäischen, ohne eine bestimmte einzelne Sprache festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die historischen Sprachbezeichnungen „Aschdodisch“ und „Judäisch“ bleiben erhalten; dadurch wird weder „Hebräisch“ in den Text eingetragen noch die ethnisch-sprachliche Spannung eingeebnet.
