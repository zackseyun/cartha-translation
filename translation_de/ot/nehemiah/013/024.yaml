- from: Und die Hälfte ihrer Kinder sprach Aschdodisch[a]. Sie konnten nicht Judäisch sprechen, sondern nur die Sprache des einen oder anderen Volkes.
  to: Und die Hälfte ihrer Kinder sprach die Sprache von Aschdod und konnte nicht Judäisch sprechen, sondern jeweils die Sprache des betreffenden Volkes.[a]
  rationale: Die Revision entfernt das nicht explizite „nur“, verbindet die Aussagen wieder zu einem Satz und ersetzt die problematische Fußnote. „Die Sprache von Aschdod“ ist im modernen Deutsch natürlich und gibt die sprachliche Bedeutung der Herkunftsbezeichnung präzise wieder. Die Schlusswendung bleibt als elliptische, distributive Aussage erhalten.
