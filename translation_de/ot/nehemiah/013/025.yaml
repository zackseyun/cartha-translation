base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/025.yaml
  text: 'So I contended with them and cursed them[a], and I struck some of the men and pulled out their hair, and I made them swear by God: “You shall not give your daughters to their sons[b], nor take any of their daughters for your sons or for yourselves.”'
translation:
  language: de
  text: 'Da ging ich mit ihnen ins Gericht, verfluchte sie[a], schlug einige Männer unter ihnen und riss ihnen die Haare aus. Dann ließ ich sie bei Gott schwören: »Ihr dürft eure Töchter nicht ihren Söhnen geben[b] und keine ihrer Töchter für eure Söhne oder für euch selbst nehmen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beschimpfte sie“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich lautet die hebräische Eidesformel: „Wenn ihr eure Töchter ihren Söhnen gebt und wenn ihr von ihren Töchtern für eure Söhne und für euch selbst nehmt …“; im Zusammenhang des Schwurs hat sie verbietenden Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיב עִמָּם
  choice: Da stellte ich sie zur Rede
  rationale: ריב bezeichnet hier eine scharfe Auseinandersetzung beziehungsweise ein Vorgehen gegen jemanden. „Zur Rede stellen“ bewahrt den konfrontativen Zug und klingt im modernen Deutsch natürlicher als das mehrdeutige „mit ihnen streiten“.
- source_word: וָאֲקַלְלֵם
  choice: und verfluchte sie
  rationale: קלל kann das Aussprechen eines Fluches oder eine heftige Beschimpfung bezeichnen. „Verfluchte sie“ gibt die naheliegende starke Bedeutung wieder; die mögliche schwächere Bedeutung wird in einer Fußnote genannt.
- source_word: וָאַכֶּה מֵהֶם אֲנָשִׁים
  choice: Einige der Männer schlug ich
  rationale: 'Die Konstruktion mit מִן bezeichnet eine Teilmenge: Nehemia schlug einige Männer aus ihrer Gruppe. „Schlug“ berichtet die körperliche Gewalt direkt, ohne sie abzuschwächen oder über den Wortlaut hinaus zu steigern.'
- source_word: וָאֶמְרְטֵם
  choice: ich riss ihnen die Haare aus
  rationale: מרט bezeichnet das Ausreißen oder Ausrupfen von Haaren. Das im Hebräischen vorausgesetzte Körperteil muss im Deutschen ausdrücklich genannt werden.
- source_word: וָאַשְׁבִּיעֵם בֵּאלֹהִים
  choice: Dann ließ ich sie bei Gott schwören
  rationale: Der Hifil von שבע bedeutet, jemanden schwören zu lassen beziehungsweise unter Eid zu stellen. „Bei Gott schwören“ entspricht natürlichem deutschem Eidsprachgebrauch.
- source_word: אִם תִּתְּנוּ ... וְאִם תִּשְׂאוּ
  choice: Ihr dürft ... nicht geben und keine ... nehmen
  rationale: אִם leitet innerhalb der Eidesformel keine gewöhnliche Bedingung ein, sondern formuliert eine feierliche Selbstverpflichtung. Die deutsche Verbotsform vermittelt diese Funktion verständlich; die wörtliche Form wird in der Fußnote dokumentiert.
- source_word: לִבְנֵיכֶם וְלָכֶם
  choice: für eure Söhne oder für euch selbst
  rationale: Die Wendung bezieht das Verbot sowohl auf Eheschließungen der Söhne als auch auf die angesprochenen Männer selbst. Das deutsche „oder“ gibt in einem Verbot die verteilende Bedeutung natürlicher wieder als ein wörtliches „und“.
theological_decisions:
- issue: Nehemias gewaltsames Vorgehen
  choice: Fluchen, Schlagen und Haareausreißen werden ungeschönt als berichtete Handlungen wiedergegeben.
  alternative: Die Handlungen zu einer bloßen verbalen Zurechtweisung abschwächen oder zu einer schwereren Misshandlung ausweiten.
  rationale: Der hebräische Text berichtet harte körperliche und verbale Zwangsmaßnahmen. Die Übersetzung soll sie weder moralisch kommentieren noch abschwächen oder verschärfen.
- issue: Bedeutung der mit אִם formulierten Eidesworte
  choice: Die Eidesworte werden als feierliches Verbot wiedergegeben.
  alternative: Die Sätze formal als offene Bedingungen mit „wenn“ übersetzen.
  rationale: Im Kontext von וָאַשְׁבִּיעֵם ist אִם Bestandteil einer elliptischen Eidesformel. Eine reine Wenn-Konstruktion wäre im heutigen Deutsch missverständlich; eine Fußnote bewahrt die hebräische Form.
- issue: Gegenstand des Eheverbots
  choice: Der Vers wird ohne zusätzliche ethnische oder theologische Begründung übersetzt.
  alternative: Eine im Vers nicht ausgesprochene Begründung oder Wertung in den Haupttext aufnehmen.
  rationale: Dieser Satz enthält das Verbot, nennt aber an dieser Stelle nicht nochmals dessen Begründung. Diese darf nicht interpretierend in den Wortlaut eingefügt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Erzählweise. Die drastischen Handlungen bleiben klar benannt. Die Eidformel wird funktional verständlich wiedergegeben, während die ungewöhnliche hebräische Konstruktion in der Fußnote erhalten bleibt.
