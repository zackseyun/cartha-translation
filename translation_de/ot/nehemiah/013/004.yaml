base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/004.yaml
  text: Before this[a], Eliashib the priest, who had been appointed over the chamber of the house of our God, was related to Tobiah—
translation:
  language: de
  text: Zuvor war der Priester Eljaschib, der mit der Aufsicht über eine Kammer im Haus unseres Gottes betraut war, Tobija nahe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck kann bedeuten, dass Eljaschib mit Tobija verwandt oder eng mit ihm verbunden war.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְנֵי מִזֶּה
  choice: Schon vorher
  rationale: Die Wendung bezeichnet einen zeitlich vorausliegenden Umstand. „Schon vorher“ gibt sowohl den zeitlichen Rückbezug als auch die verbindende Funktion des וְ in natürlichem Deutsch wieder, ohne ein nicht ausdrücklich vorhandenes „nun“ einzuführen.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן
  choice: der Priester Eljaschib
  rationale: Der Personenname wird in der im Deutschen geläufigen biblischen Form wiedergegeben; der bestimmte Amtstitel identifiziert Eljaschib als Priester.
- source_word: נָתוּן בְּלִשְׁכַּת בֵּית אֱלֹהֵינוּ
  choice: war mit der Aufsicht über die Kammer im Haus unseres Gottes betraut
  rationale: נָתוּן bezeichnet hier eine übertragene Zuständigkeit. לשכה ist ein Nebenraum beziehungsweise eine Kammer des Tempelkomplexes; „Kammer“ bewahrt die architektonische Bedeutung, ohne sie vorschnell auf „Vorratsraum“ einzuengen.
- source_word: קָרוֹב לְטוֹבִיָּה
  choice: stand Tobija nahe
  rationale: Die deutsche Wendung wahrt die Bedeutungsbreite von קָרוֹב לְ zwischen verwandtschaftlicher Beziehung und enger sozialer Verbindung, ohne eine davon im Haupttext festzulegen.
theological_decisions:
- issue: Art der Beziehung zwischen Eljaschib und Tobija
  choice: stand Tobija nahe
  alternative: war mit Tobija verwandt
  rationale: Der hebräische Ausdruck kann Verwandtschaft bezeichnen, legt aber nicht eindeutig fest, ob die Nähe familiärer oder sozialer Art war. Die Übersetzung bewahrt diese sachlich bedeutsame Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Hauptsatz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; der Gedankenstrich zeigt an, dass der Gedanke im folgenden Vers weitergeführt wird.
