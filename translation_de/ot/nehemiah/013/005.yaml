  terminology: „Speiseopfer“, „Weihrauch“, „Geräte“, „Zehnter“, „Leviten“, „Sänger“, „Torhüter“ und „Hebopfer“ in der Alternative sind terminologisch angemessen. „Abgabe für die Priester“ ist eine natürliche, nicht unnötig konfessionell geprägte Wiedergabe von תְּרוּמַת הַכֹּהֲנִים. Die Fußnoten bieten die wesentlichen lexikalischen und grammatischen Alternativen, ohne den Text zu überladen.
