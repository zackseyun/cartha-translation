source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ ל֜/וֹ לִשְׁכָּ֣ה גְדוֹלָ֗ה וְ/שָׁ֣ם הָי֪וּ לְ/פָנִ֟ים נֹ֠תְנִים אֶת הַ/מִּנְחָ֨ה הַ/לְּבוֹנָ֜ה וְ/הַ/כֵּלִ֗ים וּ/מַעְשַׂ֤ר הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר מִצְוַת֙ הַ/לְוִיִּ֔ם וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים וּ/תְרוּמַ֖ת הַ/כֹּהֲנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/005.yaml
  text: He made for him a large chamber[a], where formerly they had put the grain offering, the frankincense, the vessels, and the tithe of grain, new wine, and oil—the portion commanded for the Levites, the singers[d][c][b], and the gatekeepers—and the contribution for the priests.
translation:
  language: de
  text: Er richtete ihm einen großen Raum[a] her. Dort pflegte man früher[b] das Speiseopfer, den Weihrauch, die Geräte und den Zehnten von Getreide, jungem Wein und Öl aufzubewahren – den vorgeschriebenen Anteil für die Leviten, die Sänger und die Torhüter[c] – sowie die Abgabe für die Priester[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine große Kammer“ beziehungsweise „einen großen Vorratsraum“. Das hebräische Wort bezeichnet einen Raum im Tempelbereich, der auch als Lagerraum dienen konnte.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Verbform beschreibt hier eine frühere, gewohnheitsmäßige Praxis.
    reason: grammar
  - marker: c
    text: 'Wörtlich: „das Gebot der Leviten, der Sänger und der Torhüter“. Gemeint ist wahrscheinlich der ihnen vorschriftsmäßig zustehende Anteil.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „das Hebopfer für die Priester“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: Er richtete ihm ... her
  rationale: Die Wendung gibt das konkrete Herrichten oder Bereitstellen des Raumes für eine bestimmte Person natürlich wieder, ohne über den hebräischen Text hinauszugehen.
- source_word: לִשְׁכָּה גְדוֹלָה
  choice: einen großen Raum
  rationale: לִשְׁכָּה bezeichnet einen Raum oder eine Kammer innerhalb des Tempelkomplexes. „Raum“ ist im modernen Deutsch natürlich; die mögliche Funktion als Vorratsraum wird in der Fußnote genannt.
- source_word: וְשָׁם הָיוּ לְפָנִים נֹתְנִים
  choice: Dort pflegte man früher ... aufzubewahren
  rationale: היה mit Partizip bezeichnet hier eine wiederholte, übliche Handlung in der Vergangenheit; לְפָנִים bedeutet „früher“. „Aufbewahren“ entspricht dem Zusammenhang eines Tempelraums für Vorräte und Geräte.
- source_word: הַמִּנְחָה
  choice: das Speiseopfer
  rationale: Im kultischen Zusammenhang bezeichnet מִנְחָה das aus pflanzlichen Erzeugnissen bestehende Opfer; „Speiseopfer“ ist die geläufige deutsche Wiedergabe.
- source_word: הַלְּבוֹנָה
  choice: den Weihrauch
  rationale: לְבוֹנָה bezeichnet im Tempel- und Opferkontext Weihrauch.
- source_word: הַכֵּלִים
  choice: die Geräte
  rationale: כֵּלִים meint hier die für den Tempeldienst bestimmten Geräte oder Gegenstände. „Geräte“ ist verständlich und vermeidet das im heutigen Deutsch missverständliche „Gefäße“.
- source_word: מַעְשַׂר הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: den Zehnten von Getreide, jungem Wein und Öl
  rationale: מַעְשַׂר ist der Zehnte; die traditionelle Dreiergruppe bezeichnet Getreide, jungen Wein und Öl. „Junger Wein“ hält die besondere Bedeutung von תִּירוֹשׁ gegenüber allgemeinem Wein fest.
- source_word: מִצְוַת הַלְוִיִּם וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: den vorgeschriebenen Anteil für die Leviten, die Sänger und die Torhüter
  rationale: Der hebräische Ausdruck lautet knapp „das Gebot/die Vorschrift der Leviten, Sänger und Torhüter“. Im Zusammenhang der gelagerten Zehnten ist ein ihnen vorschriftsmäßig zustehender Anteil gemeint; die formale Mehrdeutigkeit wird in der Fußnote offengelegt.
- source_word: תְרוּמַת הַכֹּהֲנִים
  choice: die Abgabe für die Priester
  rationale: תְרוּמָה bezeichnet eine ausgesonderte Abgabe oder Opfergabe. „Abgabe“ ist in diesem Versorgungskontext verständlich; die traditionelle Alternative „Hebopfer“ steht in der Fußnote.
theological_decisions:
- issue: Bezug von מִצְוַת auf Leviten, Sänger und Torhüter
  choice: als vorgeschriebener Anteil für diese Dienstgruppen wiedergegeben
  alternative: 'wörtlicher: „das Gebot der Leviten, der Sänger und der Torhüter“'
  rationale: Die Aufzählung von Zehntvorräten legt einen vorgeschriebenen Versorgungsanteil nahe. Da der hebräische Ausdruck elliptisch bleibt, wird die wörtlichere Form in einer Fußnote bewahrt, statt die Spannung stillschweigend zu beseitigen.
- issue: Bedeutung von תְרוּמַת הַכֹּהֲנִים
  choice: die Abgabe für die Priester
  alternative: das Hebopfer für die Priester
  rationale: „Abgabe“ bildet die ausgesonderte Gabe verständlich ab, ohne eine spezielle konfessionelle Deutung einzutragen; „Hebopfer“ wird als traditionelle, kultisch präzisere Möglichkeit dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufigen kultischen Begriffen. Der Satz wurde zur besseren Verständlichkeit geteilt; Gedankenstriche kennzeichnen die erläuternde Apposition zum Zehnten. „Pflegte man“ bewahrt den gewohnheitsmäßigen Vergangenheitsaspekt des Hebräischen.
