base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/014.yaml
  text: Remember me for this[a], my God[b], and do not wipe out my deeds of covenant faithfulness that I have done for the house of my God and for its services.
translation:
  language: de
  text: Gedenke meiner wegen dessen, mein Gott, und lösche meine Erweise der Treue[a] nicht aus, die ich für das Haus meines Gottes und für seine Dienstaufgaben[b] getan habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine treuen Taten«, »meine Taten treuer Verbundenheit« oder »meine Gütigkeiten«. Das hebräische Wort kann Güte, Loyalität und verlässliche, auch bundgemäße Treue bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »seine Aufgaben«, »seine Ordnungen« oder »die dortigen Dienste«. Gemeint sind die Verantwortlichkeiten und geregelten Dienste, die mit dem Haus Gottes verbunden waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לִּי עַל־זֹאת
  choice: Denk deshalb an mich
  rationale: Die Gebetsbitte wird im Deutschen idiomatisch mit »an mich denken« wiedergegeben; »deshalb« bezieht עַל־זֹאת auf die zuvor geschilderten Maßnahmen, ohne den möglichen kausalen Sinn zu verlieren.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Der Suffix der ersten Person Singular und die persönliche Anrede werden unmittelbar bewahrt.
- source_word: וְאַל־תֶּמַח
  choice: und lösche … nicht aus
  rationale: Die Bildsprache von מחה – etwas aus einer Aufzeichnung oder dem Gedächtnis auslöschen – bleibt erhalten und klingt zugleich natürlich.
- source_word: חֲסָדַי
  choice: meine Taten der Treue
  rationale: Der Plural bezeichnet hier aufgrund des folgenden Relativsatzes konkrete Handlungen. »Treue« bewahrt den Bedeutungsbereich von חֶסֶד zwischen Güte, Loyalität und verlässlicher Verbundenheit, ohne ihn ausschließlich auf eine einzige Nuance festzulegen.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: die ich … getan habe
  rationale: Der Relativsatz bezieht sich auf die Taten und wird formal wie idiomatisch direkt wiedergegeben.
- source_word: בְּבֵית אֱלֹהַי
  choice: für das Haus meines Gottes
  rationale: בְ bezeichnet hier den Wirkungs- beziehungsweise Bezugsbereich der Handlungen. »Für« gibt im Deutschen verständlich wieder, dass Nehemias Einsatz dem Tempel galt.
- source_word: וּבְמִשְׁמָרָיו
  choice: und für seine Dienstpflichten
  rationale: מִשְׁמָר kann eine anvertraute Aufgabe, Pflicht, Ordnung oder Dienstverantwortung bezeichnen. Im Tempelkontext bringt »Dienstpflichten« den geordneten Verantwortungsbereich sachlich zum Ausdruck.
theological_decisions:
- issue: Wiedergabe von חֲסָדַי in Nehemias Gebet
  choice: meine Taten der Treue
  alternative: meine guten Taten; meine Gütigkeiten; meine Taten treuer Verbundenheit
  rationale: Die Übersetzung wahrt sowohl den konkreten Tatenbezug als auch die in חֶסֶד liegende Treue- und Loyalitätsnuance. Sie macht aus dem Ausdruck weder bloß allgemeine gute Werke noch eine ausdrücklich formulierte Verdienstlehre.
- issue: Nehemias Bitte, Gott möge seiner Taten gedenken
  choice: Die direkte, auf Nehemias eigenes Handeln bezogene Bitte bleibt ungemildert stehen.
  alternative: Eine deutende Umschreibung, die den Eindruck eines Anspruchs auf Lohn abschwächt
  rationale: Der hebräische Text bittet Gott ausdrücklich, Nehemia und seine treuen Taten nicht zu vergessen. Die damit verbundene theologische Spannung soll nicht durch eine beschwichtigende Paraphrase aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gebetssprache ist unmittelbar und verständlich; die Metapher des Auslöschens sowie die Mehrdeutigkeit von חֶסֶד und מִשְׁמָר werden bewahrt und in Fußnoten erschlossen.
