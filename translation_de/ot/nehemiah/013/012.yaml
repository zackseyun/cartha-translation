  text: וְ/כָל יְהוּדָ֗ה הֵבִ֜יאוּ מַעְשַׂ֧ר הַ/דָּגָ֛ן וְ/הַ/תִּיר֥וֹשׁ וְ/הַ/יִּצְהָ֖ר לָ/אוֹצָרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/012.yaml
  text: And all Judah brought the tithe of the grain[a], the new wine, and the oil into the storehouses.
translation:
  language: de
  text: Und ganz Juda brachte den Zehnten vom Getreide, vom neuen Wein und vom Öl in die Vorratskammern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל יְהוּדָה
  choice: Und ganz Juda
  rationale: כָּל mit dem Eigennamen bezeichnet die gesamte Gemeinschaft Judas. „Ganz Juda“ bewahrt den kollektiven Sinn, ohne unnötig zwischen Land und Bevölkerung zu entscheiden.
- source_word: הֵבִיאוּ
  choice: brachte
  rationale: Der Hifil von בוא bedeutet hier „bringen“. Das kollektive „ganz Juda“ wird im Deutschen idiomatisch mit dem Singular verbunden.
- source_word: מַעְשַׂר
  choice: den Zehnten
  rationale: מַעְשַׂר ist der übliche Ausdruck für den als Abgabe bestimmten zehnten Teil; der Singular des Hebräischen bleibt erhalten.
- source_word: הַ/דָּגָן
  choice: vom Getreide
  rationale: דָּגָן bezeichnet allgemein Getreideerzeugnisse. Nach „den Zehnten“ gibt „vom“ im Deutschen natürlich an, wovon der Zehnte genommen wird.
- source_word: וְ/הַ/תִּירוֹשׁ
  choice: vom neuen Wein
  rationale: תִּירוֹשׁ bezeichnet häufig jungen beziehungsweise neuen Wein und wird so von dem allgemeineren Wort für Wein unterschieden.
- source_word: וְ/הַ/יִּצְהָר
  choice: vom Öl
  rationale: יִצְהָר meint in solchen Erntelisten gewöhnlich Öl, typischerweise Olivenöl. „Öl“ wahrt die knappe Ausdrucksweise des Ausgangstextes.
- source_word: לָ/אוֹצָרוֹת
  choice: in die Vorratskammern
  rationale: אוֹצָרוֹת bezeichnet hier Räume zur Aufbewahrung der landwirtschaftlichen Abgaben. „Vorratskammern“ passt zum Sachkontext besser als das leicht geldbezogene „Schatzkammern“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Aufzählung und der kollektive Ausdruck „ganz Juda“ bleiben erhalten; unnötige Präzisierungen werden vermieden.
