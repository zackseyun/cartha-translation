  text: וָ/אָעִ֣ידָ/ה בָ/הֶ֗ם וָ/אֹמְרָ֤/ה אֲלֵי/הֶם֙ מַדּ֜וּעַ אַתֶּ֤ם לֵנִים֙ נֶ֣גֶד הַ/חוֹמָ֔ה אִם תִּשְׁנ֕וּ יָ֖ד אֶשְׁלַ֣ח בָּ/כֶ֑ם מִן הָ/עֵ֣ת הַ/הִ֔יא לֹא בָ֖אוּ בַּ/שַּׁבָּֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/021.yaml
  text: So I warned them and said to them[a], “Why are you spending the night in front of the wall? If you do it again, I will lay hands on you.” From that time on they did not come on the Sabbath.
translation:
  language: de
  text: 'Da warnte ich sie eindringlich und sagte zu ihnen: „Warum übernachtet ihr vor der Mauer? Wenn ihr das noch einmal tut, werde ich Hand an euch legen.“[a] Von da an kamen sie am Sabbat nicht mehr.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „werde ich eine Hand gegen euch senden“. Die hebräische Wendung droht ein gewaltsames Vorgehen an, ohne die konkrete Maßnahme zu bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָעִידָה
  choice: Da warnte ich sie eindringlich
  rationale: Das Hifil von עוד bezeichnet hier eine nachdrückliche, förmliche Warnung. „Eindringlich warnen“ gibt diese Stärke in natürlichem modernem Deutsch wieder.
- source_word: וָאֹמְרָה אֲלֵיהֶם
  choice: und sagte zu ihnen
  rationale: Entspricht der hebräischen Erzählfolge in idiomatischem Deutsch.
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Direkte und natürliche Wiedergabe der Fragepartikel.
- source_word: לֵנִים
  choice: übernachtet ihr
  rationale: Das Verb bedeutet „die Nacht verbringen, übernachten“. Die knappe deutsche Form passt zur direkten Frage.
- source_word: נֶגֶד הַחוֹמָה
  choice: vor der Mauer
  rationale: נֶגֶד lokalisiert die Händler vor beziehungsweise gegenüber der Mauer. „Vor der Mauer“ ist präzise, natürlich und vermeidet die nicht ausdrücklich bezeichnete Deutung „außerhalb“.
- source_word: אִם תִּשְׁנוּ
  choice: Wenn ihr das noch einmal tut
  rationale: שנה bedeutet hier „wiederholen, erneut tun“; „das“ nimmt das zuvor beschriebene Verhalten auf.
- source_word: יָד אֶשְׁלַח בָּכֶם
  choice: werde ich Hand an euch legen
  rationale: Die deutsche Wendung bewahrt das Bild des hebräischen Idioms und vermittelt die Androhung unmittelbaren gewaltsamen Einschreitens, ohne die genaue Maßnahme festzulegen.
- source_word: מִן הָעֵת הַהִיא
  choice: Von da an
  rationale: Natürliche deutsche Zeitangabe für die ab diesem Zeitpunkt eintretende Folge.
- source_word: לֹא בָאוּ
  choice: kamen sie … nicht mehr
  rationale: „Nicht mehr“ macht im Deutschen die durch „von da an“ bezeichnete fortdauernde Beendigung des Verhaltens natürlich deutlich.
- source_word: בַּשַּׁבָּת
  choice: am Sabbat
  rationale: Übliche, knappe deutsche Wiedergabe von שַׁבָּת mit temporaler Präposition.
theological_decisions:
- issue: Art der angedrohten Maßnahme
  choice: werde ich Hand an euch legen
  alternative: werde ich Gewalt gegen euch anwenden
  rationale: Der bildhafte hebräische Ausdruck droht ein unmittelbares Einschreiten an, bestimmt dessen Form aber nicht näher. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, nachdrücklicher Rede. Die hebräische Bildsprache der Drohung bleibt erhalten; unnötige Auslegung des Standorts als ausdrücklich „außerhalb“ der Stadt wird vermieden.
