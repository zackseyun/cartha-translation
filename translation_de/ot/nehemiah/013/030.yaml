  text: וְ/טִֽהַרְתִּ֖י/ם מִ/כָּל נֵכָ֑ר וָ/אַעֲמִ֧ידָ/ה מִשְׁמָר֛וֹת לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם אִ֥ישׁ בִּ/מְלַאכְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/030.yaml
  text: So I cleansed them from everything foreign[a], and I assigned duties for the priests and for the Levites, each in his work,
translation:
  language: de
  text: Und ich reinigte sie von allem Fremden und wies den Priestern und Leviten Dienstordnungen zu, jedem seine Aufgabe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְטִהַרְתִּים
  choice: So reinigte ich sie
  rationale: Das Piel von טהר bedeutet »reinigen« beziehungsweise »läutern«. »So« gibt hier den folgernden Erzählfluss nach den zuvor geschilderten Reformmaßnahmen natürlich wieder; auch »und« wäre möglich. Das Suffix der 3. Person Plural wird als »sie« beibehalten, ohne seinen Bezug enger festzulegen.
- source_word: מִכָּל נֵכָר
  choice: von allem Fremden
  rationale: נֵכָר bezeichnet Fremdes oder etwas Fremdartiges. Die Formulierung bewahrt die Weite des Hebräischen und legt nicht fest, dass ausschließlich fremde Personen oder fremde Frauen gemeint sind.
- source_word: וָאַעֲמִידָה
  choice: und legte … fest
  rationale: Das Hifil von עמד hat hier den administrativen Sinn, etwas einzurichten, einzusetzen oder festzulegen. In Verbindung mit Dienstordnungen ist »festlegen« im Deutschen klar und idiomatisch.
- source_word: מִשְׁמָרוֹת
  choice: Dienstordnungen
  rationale: Das Wort kann Wachen, Dienstabteilungen, Dienstaufträge oder geordnete Zuständigkeiten bezeichnen. »Dienstordnungen« vermittelt im priesterlich-levitischen Zusammenhang sowohl die geregelte Einteilung als auch die damit verbundenen Pflichten; weitere Möglichkeiten werden in der Fußnote genannt.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: für die Priester und die Leviten
  rationale: Beide ausdrücklich genannten Gruppen werden beibehalten. Im Deutschen genügt die einmalige Präposition »für«, ohne den Sinn der wiederholten hebräischen Präposition zu verändern.
- source_word: אִישׁ
  choice: jeden
  rationale: 'אִישׁ wird hier distributiv gebraucht: Jeder Angehörige der genannten, grammatisch und sachlich männlich bezeichneten Gruppen erhält seinen Bereich. »Jeden« bewahrt diese Verteilung und den maskulinen Bezug knapp.'
- source_word: בִּמְלַאכְתּוֹ
  choice: für seine Aufgabe
  rationale: מְלָאכָה kann Arbeit, Aufgabe oder Dienst bezeichnen. »Für seine Aufgabe« drückt den jeweiligen zugewiesenen Tätigkeitsbereich im heutigen Deutsch natürlich aus.
theological_decisions:
- issue: Bezugsbereich von »sie« und »allem Fremden«
  choice: Die betreffende Gemeinschaft wird von allem Fremden gereinigt, ohne dieses näher einzugrenzen.
  alternative: »Ich reinigte sie von allen Fremden« oder »von jeder fremden Frau«.
  rationale: Der unmittelbare Zusammenhang betrifft Mischehen und Verfehlungen im priesterlichen Umfeld, doch die hebräische Formulierung ist weiter. Die Übersetzung vermeidet daher eine ethnische oder geschlechtsspezifische Verengung.
- issue: Distributives אִישׁ
  choice: »jeden für seine Aufgabe«
  alternative: »jeden Mann bei seiner Arbeit« oder geschlechtsneutral »alle in ihrem Aufgabenbereich«.
  rationale: Der Vers nennt Priester und Leviten mit maskulinen Personenbezeichnungen. »Jeden« gibt sowohl den distributiven Sinn als auch den grammatischen Bezug wieder, ohne das Substantiv »Mann« unnötig hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an der hebräischen Satzstruktur, vermeidet aber unnatürliche Wendungen. Das Komma am Versende der englischen Beratungsschicht wurde nicht übernommen, da der deutsche Vers als vollständiger Satz steht.
