    rationale: Nach „legte die Dienstordnungen … fest“ hat „jeden“ keine klare grammatische Anbindung. Dadurch wird die distributive Aussage „jeder in seiner Arbeit/Aufgabe“ im Deutschen holprig und nicht eindeutig vermittelt.
  revised_text: Und ich reinigte sie von allem Fremden und wies den Priestern und Leviten Dienstordnungen zu, jedem seine Aufgabe.
