revisions:
- from: So reinigte ich sie von allem Fremden und legte die Dienstordnungen[a] für die Priester und die Leviten fest, jeden für seine Aufgabe.
  to: Und ich reinigte sie von allem Fremden und wies den Priestern und Leviten Dienstordnungen zu, jedem seine Aufgabe.
  rationale: Die Revision löst die syntaktische Unklarheit durch „wies … zu, jedem seine Aufgabe“. Dies gibt den administrativen Sinn von וָאַעֲמִידָה sowie die distributive Zuordnung von אִישׁ בִּמְלַאכְתּוֹ klar und idiomatisch wieder. „Von allem Fremden“ bewahrt weiterhin die absichtlich offene Reichweite von מִכָּל נֵכָר. Der Fußnotenanker bleibt bei „Dienstordnungen“ bestehen.
  reviewer_model: gpt-5.6-terra
