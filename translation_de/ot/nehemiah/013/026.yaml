  text: הֲ/ל֣וֹא עַל אֵ֣לֶּה חָטָֽא שְׁלֹמֹ֣ה מֶ֣לֶךְ יִשְׂרָאֵ֡ל וּ/בַ/גּוֹיִ֣ם הָ/רַבִּים֩ לֹֽא הָיָ֨ה מֶ֜לֶךְ כָּמֹ֗/הוּ וְ/אָה֤וּב לֵֽ/אלֹהָי/ו֙ הָיָ֔ה וַ/יִּתְּנֵ֣/הוּ אֱלֹהִ֔ים מֶ֖לֶךְ עַל כָּל יִשְׂרָאֵ֑ל גַּם אוֹת֣/וֹ הֶחֱטִ֔יאוּ הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/026.yaml
  text: Was it not because of these things that Solomon king of Israel sinned? Yet among the many nations there was no king like him[a], and he was loved by his God, and God made him king over all Israel. Even him foreign women caused to sin.
translation:
  language: de
  text: Hat nicht Salomo, der König von Israel, wegen dieser Dinge gesündigt? Unter den vielen Völkern gab es keinen König wie ihn. Er wurde von seinem Gott geliebt, und Gott setzte ihn zum König über ganz Israel ein. Doch selbst ihn brachten die ausländischen Frauen[a] dazu zu sündigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ausländischen Ehefrauen“. Im Hebräischen steht „die ausländischen Frauen“; „Ehefrauen“ ergibt sich aus dem Zusammenhang der Salomoerzählung, ist in diesem Vers aber nicht ausdrücklich gesagt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא עַל אֵלֶּה
  choice: Hat nicht … wegen dieser Dinge
  rationale: Die rhetorische Frage erwartet Zustimmung; „wegen dieser Dinge“ gibt die kausale Bedeutung von עַל mit חטא wieder und bewahrt den Rückbezug von אֵלֶּה.
- source_word: חָטָא
  choice: gesündigt
  rationale: Im moralisch-religiösen Zusammenhang ist „sündigen“ die klare und übliche Wiedergabe.
- source_word: וּבַגּוֹיִם הָרַבִּים לֹא הָיָה מֶלֶךְ כָּמֹהוּ
  choice: Unter den vielen Völkern gab es keinen König wie ihn
  rationale: Bewahrt den Vergleich mit den vielen Völkern und gibt die hebräische Existenzkonstruktion in natürlichem Deutsch wieder.
- source_word: וְאָהוּב לֵאלֹהָיו הָיָה
  choice: Er wurde von seinem Gott geliebt
  rationale: Gibt den passiv-adjektivischen Sinn von אָהוּב und das Suffix „sein Gott“ wieder, ohne einen im Hebräischen nicht vorhandenen Gottesnamen einzuführen.
- source_word: וַיִּתְּנֵהוּ אֱלֹהִים מֶלֶךְ
  choice: Gott setzte ihn zum König … ein
  rationale: נתן mit Objekt und Amtsbezeichnung bezeichnet hier die Einsetzung zum König; „einsetzen“ ist präzise und idiomatisch.
- source_word: גַּם אוֹתוֹ
  choice: Doch selbst ihn
  rationale: Das vorangestellte Objekt ist hervorgehoben. „Selbst ihn“ bewahrt den Nachdruck; „doch“ macht den Kontrast zu seiner einzigartigen Stellung verständlich.
- source_word: הֶחֱטִיאוּ
  choice: brachten … dazu zu sündigen
  rationale: Die Hifil-Form ist kausativ. Diese Formulierung ist im Deutschen natürlicher als „verursachten, dass er sündigte“ und lässt die genaue Art der Einflussnahme offen.
- source_word: הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: die ausländischen Frauen
  rationale: „Frauen“ entspricht dem ausdrücklich verwendeten נָשִׁים; „Ehefrauen“ ist aus der Salomoüberlieferung kontextuell möglich, steht aber hier nicht ausdrücklich.
theological_decisions:
- issue: Ursache von Salomos Sünde
  choice: Die ausländischen Frauen brachten selbst Salomo dazu zu sündigen.
  alternative: Die Frauen verführten ihn; seine ausländischen Ehen beeinträchtigten seine Bundestreue.
  rationale: Die kausative Verbform schreibt den Frauen eine ursächliche Rolle zu, erklärt aber weder den Mechanismus noch entfaltet sie die Erzählung aus 1. Könige 11. Die Übersetzung belässt diese Spannung.
- issue: Wiedergabe von אֱלֹהִים
  choice: zunächst „seinem Gott“, danach „Gott“
  alternative: „der HERR“
  rationale: Das erste Vorkommen trägt ein Possessivsuffix, das zweite nicht. Da hier nicht der Gottesname JHWH steht, wäre „der HERR“ unbegründet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Apposition „der König von Israel“ klärt die Titelfügung; kurze Hauptsätze erhalten die argumentative Schärfe. Der Kontrast und die Hervorhebung des selbst von Gott geliebten und eingesetzten Salomo bleiben erhalten.
