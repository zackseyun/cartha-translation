  text: וָ/אוֹצְרָ֣/ה עַל א֠וֹצָרוֹת שֶׁלֶמְיָ֨ה הַ/כֹּהֵ֜ן וְ/צָד֣וֹק הַ/סּוֹפֵ֗ר וּ/פְדָיָה֙ מִן הַ/לְוִיִּ֔ם וְ/עַל יָדָ֔/ם חָנָ֥ן בֶּן זַכּ֖וּר בֶּן מַתַּנְיָ֑ה כִּ֤י נֶאֱמָנִים֙ נֶחְשָׁ֔בוּ וַ/עֲלֵי/הֶ֖ם לַ/חֲלֹ֥ק לַ/אֲחֵי/הֶֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/013.yaml
  text: And I appointed over the storerooms Shelemiah the priest[a], Zadok the scribe, and Pedaiah from the Levites, and Hanan son of Zaccur, son of Mattaniah, at their side, because they were considered faithful[c][b]; and it was upon them to distribute to their brothers.
translation:
  language: de
  text: Ich setzte den Priester Schelemja, den Schreiber Zadok und Pedaja von den Leviten über die Vorratskammern ein. Ihnen zur Seite stand Hanan, der Sohn Sakkurs, des Sohnes Mattanjas.[a] Denn sie galten als zuverlässig,[b] und ihnen oblag es, an ihre Brüder auszuteilen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unter ihrer Leitung stand Hanan“; die hebräische Wendung kann sowohl enge Mitarbeit als auch eine untergeordnete Stellung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie wurden für treu befunden“.'
    reason: lexical_alternative
  - marker: c
    text: „Brüder“ gibt die männliche hebräische Bezeichnung wieder; gemeint sind die anderen Angehörigen ihrer Gemeinschaft, möglicherweise ihre levitischen Amtsbrüder.
    reason: referent_clarification
lexical_decisions:
- source_word: וָאוֹצְרָה עַל אוֹצָרוֹת
  choice: Ich setzte … über die Vorratskammern ein
  rationale: Das Verb bezeichnet hier die Einsetzung verantwortlicher Verwalter; אוֹצָרוֹת meint im Zusammenhang mit Abgaben und Vorräten die Lagerräume des Tempels.
- source_word: צָדוֹק הַסּוֹפֵר
  choice: den Schreiber Zadok
  rationale: סֹפֵר kann einen Schreiber oder Verwaltungsbeamten bezeichnen. „Schreiber“ bewahrt den traditionellen, hinreichend weiten Amtstitel.
- source_word: וּפְדָיָה מִן הַלְוִיִּם
  choice: Pedaja von den Leviten
  rationale: Die Formulierung folgt der hebräischen Gruppenbezeichnung, ohne Pedajas genaue Funktion näher festzulegen.
- source_word: וְעַל יָדָם
  choice: Ihnen zur Seite stand
  rationale: Die Wendung bezeichnet enge Zuordnung und kann auch ein Unterstellungsverhältnis ausdrücken. Die Übersetzung bewahrt diese Offenheit und bezieht die Wendung entsprechend der Wortstellung auf Hanan.
- source_word: כִּי נֶאֱמָנִים נֶחְשָׁבוּ
  choice: Denn sie galten als zuverlässig
  rationale: נֶאֱמָנִים bezeichnet hier Vertrauenswürdigkeit beziehungsweise Verlässlichkeit; נֶחְשָׁבוּ drückt aus, dass sie als solche angesehen wurden.
- source_word: וַעֲלֵיהֶם לַחֲלֹק
  choice: ihnen oblag es, … auszuteilen
  rationale: Die Wendung weist ihnen eine Verantwortung zu; חָלַק meint im Versorgungskontext das Austeilen oder Zuweisen von Anteilen.
- source_word: לַאֲחֵיהֶם
  choice: an ihre Brüder
  rationale: Die Übersetzung erhält die männliche Verwandtschafts- und Gemeinschaftsbezeichnung des Hebräischen, ohne den im Vers nicht ausdrücklich bestimmten Personenkreis einzuengen.
theological_decisions:
- issue: Bezugsgruppe von אֲחֵיהֶם
  choice: ihre Brüder
  alternative: ihre Stammesgenossen / die anderen Leviten
  rationale: Der hebräische Text verwendet die männliche Pluralform „Brüder“, bestimmt hier aber nicht ausdrücklich, ob ausschließlich andere Leviten gemeint sind. Die Übersetzung bewahrt diese Offenheit.
- issue: Stellung Hanans gegenüber den übrigen Verwaltern
  choice: Ihnen zur Seite stand Hanan
  alternative: Unter ihrer Leitung stand Hanan
  rationale: Die hebräische Wendung עַל יָדָם kann sowohl begleitende Mitarbeit als auch eine untergeordnete Stellung bezeichnen. Eine eindeutige Hierarchie wird daher nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Verwaltungsbegriffe bleiben verständlich, ohne das Verhältnis der Beauftragten oder den Empfängerkreis stärker festzulegen als der hebräische Text.
