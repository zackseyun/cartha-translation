base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/031.yaml
  text: And for the offering of wood at appointed times[a], and for the firstfruits—remember me, my God, for good.
translation:
  language: de
  text: Auch für die Holzgabe zu den festgesetzten Zeiten[a] und für die Erstlingsgaben. Denk zu meinem Guten an mich, mein Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für die Gabe des Holzes«. Gemeint ist die zu festgesetzten Zeiten erfolgende Bereitstellung von Holz für den Tempeldienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֻרְבַּן הָעֵצִים
  choice: Holzgabe
  rationale: Die kompakte kultische Bezeichnung meint die planmäßige Bereitstellung von Holz für den Tempeldienst; »Holzgabe« ist im Deutschen natürlich und bewahrt den Opfer- beziehungsweise Gabenkontext.
- source_word: בְּעִתִּים מְזֻמָּנוֹת
  choice: zu den festgesetzten Zeiten
  rationale: Die Wendung bezeichnet im Voraus bestimmte, planmäßig angesetzte Zeitpunkte.
- source_word: בִּכּוּרִים
  choice: Erstlingsgaben
  rationale: Der etablierte deutsche Ausdruck bezeichnet die ersten Erträge, die Gott dargebracht wurden, und gibt zugleich die Pluralform wieder.
- source_word: זָכְרָה לִּי
  choice: Denk an mich
  rationale: Die direkte Bitte gibt Nehemias wiederkehrende Gebetsformel in natürlichem, gegenwärtigem Deutsch wieder.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Die persönliche Anrede und das Possessivverhältnis werden unmittelbar bewahrt.
- source_word: לְטוֹבָה
  choice: lass es mir zum Guten dienen
  rationale: Die Formulierung bringt die erbetene günstige Wirkung verständlich zum Ausdruck, ohne sie näher als Lohn, Segen oder Rechtfertigung festzulegen.
theological_decisions:
- issue: Kultische Wendung קֻרְבַּן הָעֵצִים
  choice: Holzgabe
  alternative: Gabe des Holzes
  rationale: Gemeint ist die geregelte Bereitstellung von Holz für den Tempel beziehungsweise den Altar. Die gewählte Form wahrt den kultischen Rahmen, ohne fälschlich nahezulegen, das Holz selbst werde als Opfer verbrannt.
- issue: Schlussbitte לְטוֹבָה
  choice: lass es mir zum Guten dienen
  alternative: gedenke meiner zum Guten
  rationale: Die gewählte Fassung ist modernes, verständliches Deutsch und lässt offen, worin das erbetene Gute besteht. Damit wird die theologische Zurückhaltung des hebräischen Textes bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz setzt den elliptischen Anschluss an die vorhergehenden Maßnahmen fort; die abschließende Gebetsbitte wird idiomatisch wiedergegeben, ohne ihren Sinn theologisch einzuengen.
