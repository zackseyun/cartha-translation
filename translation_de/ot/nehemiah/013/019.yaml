source:
  edition: WLC
  text: וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר צָֽלֲלוּ֩ שַׁעֲרֵ֨י יְרוּשָׁלִַ֜ם לִ/פְנֵ֣י הַ/שַּׁבָּ֗ת וָ/אֹֽמְרָ/ה֙ וַ/יִּסָּגְר֣וּ הַ/דְּלָת֔וֹת וָ/אֹ֣מְרָ֔/ה אֲשֶׁר֙ לֹ֣א יִפְתָּח֔וּ/ם עַ֖ד אַחַ֣ר הַ/שַּׁבָּ֑ת וּ/מִ/נְּעָרַ֗/י הֶֽעֱמַ֨דְתִּי֙ עַל הַ/שְּׁעָרִ֔ים לֹא יָב֥וֹא מַשָּׂ֖א בְּ/י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/019.yaml
  text: When the gates of Jerusalem began to grow dark[a] before the Sabbath, I ordered the doors shut and commanded that they not be opened until after the Sabbath. I stationed some of my servants[b] at the gates so that no load[c] would be brought in on the Sabbath day.
translation:
  language: de
  text: Als die Tore Jerusalems vor dem Sabbat dunkel zu werden begannen[a], ordnete ich an, die Torflügel zu schließen, und befahl, sie erst nach dem Sabbat wieder zu öffnen. Einige meiner Bediensteten[b] stellte ich an den Toren auf, damit am Sabbattag keine Last[c] hereingebracht würde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Als die Tore Jerusalems vor dem Sabbat im Abendschatten lagen.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »einige aus meinem Gefolge«. Das Wort kann Diener, Begleiter oder junge Männer bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Im Zusammenhang sind wohl Lasten mit Waren gemeint, die zum Handel in die Stadt gebracht wurden.
    reason: cultural_note
lexical_decisions:
- source_word: צָלֲלוּ
  choice: sich verdunkelten
  rationale: Das Verb bezeichnet hier das Dunkelwerden beziehungsweise Beschattetwerden beim Einbruch des Abends. Die Formulierung bleibt nahe an der hebräischen Zuordnung zu den Toren und markiert zugleich den nahenden Sabbatbeginn.
- source_word: שַׁעֲרֵי יְרוּשָׁלִַם
  choice: die Tore Jerusalems
  rationale: Natürliche und genaue Wiedergabe der hebräischen Genitivverbindung.
- source_word: לִפְנֵי הַשַּׁבָּת
  choice: vor dem Sabbat
  rationale: Die Wendung bezeichnet die Zeit unmittelbar vor Beginn des Sabbats.
- source_word: וָאֹמְרָה ... וָאֹמְרָה
  choice: ordnete ich an ... und befahl
  rationale: Das wörtliche „ich sagte“ hat im administrativen Zusammenhang den pragmatischen Sinn verbindlicher Anweisungen; die Wiederholung wird im Deutschen bewahrt, ohne hölzern zu wirken.
- source_word: וַיִּסָּגְרוּ הַדְּלָתוֹת
  choice: die Torflügel zu schließen
  rationale: „Torflügel“ unterscheidet die verschließbaren Flügel innerhalb der Stadttore klar von den zuvor genannten Toranlagen.
- source_word: אֲשֶׁר לֹא יִפְתָּחוּם עַד אַחַר הַשַּׁבָּת
  choice: sie erst nach dem Sabbat wieder zu öffnen
  rationale: Die positive „erst“-Konstruktion gibt das hebräische Verbot bis zu einem bestimmten Zeitpunkt idiomatisch und vollständig wieder.
- source_word: וּמִנְּעָרַי
  choice: einige meiner Bediensteten
  rationale: נַעַר kann junge Männer, Diener oder Angehörige eines persönlichen Gefolges bezeichnen. Im Umfeld Nehemias passt „Bedienstete“, ohne zwingend ein bestimmtes Alter anzunehmen.
- source_word: הֶעֱמַדְתִּי עַל הַשְּׁעָרִים
  choice: stellte ich an den Toren auf
  rationale: Die Formulierung bezeichnet das gezielte Stationieren von Personal an den Zugängen.
- source_word: לֹא יָבוֹא מַשָּׂא
  choice: damit ... keine Last hereingebracht würde
  rationale: מַשָּׂא bezeichnet konkret eine getragene oder transportierte Last. „Hereingebracht“ verdeutlicht aus dem Torkontext die Bewegung in die Stadt, ohne die Last ausdrücklich mit Handelsware gleichzusetzen.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: am Sabbattag
  rationale: Bewahrt die ausdrückliche Nennung des Tages und klingt im modernen Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe von שַׁבָּת
  choice: Sabbat
  alternative: Ruhetag
  rationale: Gemeint ist der bestimmte wöchentliche Sabbat Israels, nicht allgemein ein Ruhetag. Der etablierte Begriff wahrt die geschichtliche und bundestheologische Besonderheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Torflügel“ schafft konkrete Klarheit, „Bedienstete“ vermeidet eine unbegründete Altersfestlegung, und „Last“ erhält die Bildhaftigkeit sowie die mögliche sachliche Breite des hebräischen Ausdrucks.
