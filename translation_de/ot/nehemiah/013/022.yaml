  text: וָ/אֹמְרָ֣/ה לַ/לְוִיִּ֗ם אֲשֶׁ֨ר יִֽהְי֤וּ מִֽטַּהֲרִים֙ וּ/בָאִים֙ שֹׁמְרִ֣ים הַ/שְּׁעָרִ֔ים לְ/קַדֵּ֖שׁ אֶת י֣וֹם הַ/שַּׁבָּ֑ת גַּם זֹאת֙ זָכְרָ/ה לִּ֣/י אֱלֹהַ֔/י וְ/ח֥וּסָ/ה עָלַ֖/י כְּ/רֹ֥ב חַסְדֶּֽ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/022.yaml
  text: And I told the Levites that they should purify themselves and come to guard the gates[a], to keep the Sabbath day holy. Remember this also in my favor, my God[b], and spare me according to the greatness of your steadfast love.
translation:
  language: de
  text: Und ich wies die Leviten an, sich zu reinigen und zu kommen, um die Tore zu bewachen und den Sabbattag zu heiligen. Auch dies bedenke zu meinen Gunsten, mein Gott,[a] und schone mich nach der Fülle deiner treuen Liebe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gedenke meiner auch dafür, mein Gott.“ Die hebräische Wendung kann sich entweder auf Nehemia selbst oder auf die soeben genannte Tat beziehen.'
    reason: lexical_alternative
  - marker: b
    text: „Treue Liebe“ gibt das hebräische Wort ḥesed wieder, das häufig Gottes verlässliche Güte, Bundestreue und Barmherzigkeit bezeichnet.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לַלְוִיִּם
  choice: Und ich wies die Leviten an
  rationale: אמר bezeichnet hier Nehemias administrative Anweisung. „Wies … an“ ist im Deutschen natürlich und gibt den verbindlichen Kontext wieder, ohne die Aussage durch „befahl“ unnötig zu verschärfen.
- source_word: אֲשֶׁר יִהְיוּ מִטַּהֲרִים
  choice: sich zu reinigen
  rationale: Die Konstruktion aus היה und Partizip beschreibt die vorgesehene Handlung; der Hitpael von טהר ist reflexiv und wird daher mit „sich reinigen“ wiedergegeben.
- source_word: וּבָאִים שֹׁמְרִים הַשְּׁעָרִים
  choice: zu kommen und die Tore zu bewachen
  rationale: Die aufeinanderfolgenden Partizipien bezeichnen die den Leviten aufgetragenen Handlungen. „Bewachen“ erfasst ihre aktive Verantwortung an den Toren.
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: damit der Sabbattag heilig gehalten würde
  rationale: קדשׁ bezeichnet das Heiligen beziehungsweise das Absondern als heilig. Die finale Wiedergabe zeigt, dass die Torwache dem Schutz der Sabbatheiligung diente.
- source_word: גַּם זֹאת זָכְרָה לִּי
  choice: Auch dies bedenke zu meinen Gunsten
  rationale: זכר mit benefaktivem ל bittet Gott, die genannte Tat wohlwollend zu berücksichtigen. „Bedenke zu meinen Gunsten“ wahrt das Erinnerungsmotiv und macht zugleich den idiomatischen Sinn verständlich.
- source_word: וְחוּסָה עָלַי
  choice: und schone mich
  rationale: חוס kann „schonen“, „Mitleid haben“ oder „sich erbarmen“ bedeuten. „Schone mich“ bewahrt den Charakter einer Bitte um gnädige Verschonung.
- source_word: כְּרֹב חַסְדֶּךָ
  choice: nach der Fülle deiner treuen Liebe
  rationale: רֹב bezeichnet Fülle oder Größe; חסד umfasst Gottes verlässliche, loyale Güte und Liebe. „Treue Liebe“ hält beide Bedeutungsaspekte zusammen.
theological_decisions:
- issue: Bedeutungsumfang von חסד in der Bitte um Gnade
  choice: treue Liebe
  alternative: Güte; Erbarmen; Bundestreue
  rationale: 'Der Ausdruck bezeichnet mehr als ein vorübergehendes Gefühl: Er umfasst Gottes verlässliche, loyale Zuwendung. „Treue Liebe“ wahrt diese theologische Weite, ohne den Begriff ausschließlich auf eine bestimmte Bundestheologie festzulegen.'
- issue: Bitte um göttliches Erinnern
  choice: Auch dies bedenke zu meinen Gunsten
  alternative: Gedenke meiner auch dafür
  rationale: Die hebräische Wendung kann den begünstigenden Bezug entweder stärker auf die Tat oder auf Nehemia selbst beziehen. Der Haupttext folgt der naheliegenden Verbindung mit „dies“, während die Fußnote die personenbezogene Alternative offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Handlungsablauf, wird aber durch deutsche Infinitiv- und Finalkonstruktionen flüssig gestaltet. Die Gebetssprache ist gehoben, ohne veraltet zu wirken.
