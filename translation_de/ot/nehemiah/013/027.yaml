base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/027.yaml
  text: Should we then listen to you and do all this great evil[b][a], acting unfaithfully against our God by marrying foreign women?
translation:
  language: de
  text: Soll man denn von euch hören, dass ihr all dieses große Unrecht tut, unserem Gott die Treue brecht und fremde Frauen heiratet?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fremde Frauen wohnen lassen“; gemeint ist hier, sie als Ehefrauen in den eigenen Haushalt aufzunehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִשְׁמַע ... וְלָכֶם
  choice: Und sollten wir auf euch hören
  rationale: Die rhetorische Frage wird als direkte Anrede verstanden. „Auf euch hören“ bewahrt den Grundsinn von שׁמע und kann hier zugleich das Befolgen beziehungsweise Nachahmen ihres Handelns ausdrücken.
- source_word: לַעֲשֹׂת אֵת כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: all dieses große Unrecht tun
  rationale: „Tun“ entspricht dem gewöhnlichen Sinn von עשה; „all dieses große Unrecht“ bewahrt die verstärkende Wirkung von כָּל und bezeichnet verständlich eine schwere moralische Verfehlung.
- source_word: לִמְעֹל בֵּאלֹהֵינוּ
  choice: unserem Gott die Treue brechen
  rationale: מעל bezeichnet einen schwerwiegenden Treuebruch. Die deutsche Wendung erhält das relationale und bundestheologische Gewicht, ohne einen technischen Kultbegriff einzuführen.
- source_word: לְהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: fremde Frauen heiraten
  rationale: Das Hifil von ישׁב bedeutet wörtlich „wohnen lassen“; mit „fremden Frauen“ bezeichnet es im Kontext ihre Aufnahme in den eigenen Haushalt als Ehefrauen. Die natürliche deutsche Wiedergabe nennt den gemeinten Vorgang.
theological_decisions:
- issue: Art des Vergehens in לִמְעֹל בֵּאלֹהֵינוּ
  choice: Treuebruch gegenüber Gott
  alternative: allgemeines Unrecht oder kultisches Vergehen gegen Gott
  rationale: מעל trägt häufig den Sinn eines Treuebruchs, besonders in der Beziehung zu Gott. „Unserem Gott die Treue brechen“ erhält diese theologische Spannung, ohne die Aussage ausschließlich kultisch zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die direkte Anrede im Plural bleiben erhalten. „Fremde Frauen“ gibt נָשִׁים נָכְרִיּוֹת wieder und bezeichnet im Kontext Frauen aus anderen Völkern, nicht bloß persönlich unbekannte Frauen.
