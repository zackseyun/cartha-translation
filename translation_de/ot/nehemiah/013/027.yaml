  verdict: revise
  source_fidelity: 'Die Wendung וְלָכֶם הֲנִשְׁמַע ist im WLC am naheliegendsten unpersönlich zu verstehen: „Soll man denn von euch hören, dass …?“ Das Niphal von שמע bezeichnet hier das Hörbarwerden bzw. Bekanntwerden eines Sachverhalts; „auf euch hören“ macht daraus ein Auffordern zum Gehorsam und verschiebt damit Subjekt und Aussage. Die übrigen Satzglieder werden mit „all dieses große Unrecht“, „unserem Gott die Treue brechen“ und „fremde Frauen heiraten“ sachgerecht wiedergegeben.'
  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch und bildet die rhetorische Empörung des hebräischen Fragesatzes natürlich ab. Die finite dass-Konstruktion ist im Deutschen klarer als eine Häufung von Infinitiven.
  terminology: „Großes Unrecht“ gibt רָעָה angemessen wieder. „Unserem Gott die Treue brechen“ bewahrt die für מעל charakteristische Dimension des Treue- bzw. Bundesbruchs. „Fremde Frauen“ bleibt kontextuell als Frauen aus fremden Völkern verständlich; „heiraten“ erläutert idiomatisch das wörtliche „wohnen lassen/ansiedeln“.
  issues:
