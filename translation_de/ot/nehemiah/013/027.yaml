    issue: „Und sollten wir auf euch hören“
    rationale: Diese Formulierung folgt der im englischen Audit bevorzugten, aber gegenüber der hebräischen Syntax weniger wahrscheinlichen direkten Lesart. הֲנִשְׁמַע ist Niphal („wird/ist gehört werden“), und לָכֶם ist hier am natürlichsten „von/euch betreffend“. Der Vers fragt, ob ein solches Verhalten von ihnen berichtet werden soll, nicht ob die Sprecher ihnen gehorchen sollen.
