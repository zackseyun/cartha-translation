source:
  edition: WLC
  text: וַ/יָּלִ֨ינוּ הָ/רֹכְלִ֜ים וּ/מֹכְרֵ֧י כָל מִמְכָּ֛ר מִ/ח֥וּץ לִ/ירוּשָׁלִָ֖ם פַּ֥עַם וּ/שְׁתָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/020.yaml
  text: Then the merchants and sellers of every kind of goods spent the night outside Jerusalem once or twice[a][b].
translation:
  language: de
  text: Da übernachteten die Händler und die Verkäufer von Waren aller Art ein- oder zweimal außerhalb Jerusalems.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einmal und zweimal«; gemeint ist: »ein- oder zweimal«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלִינוּ
  choice: Da übernachteten
  rationale: Das Verb לון bezeichnet das Verbringen der Nacht bzw. Übernachten. „Übernachteten“ gibt den zeitlichen Sinn knapp und natürlich wieder.
- source_word: הָרֹכְלִים
  choice: die Händler
  rationale: רֹכֵל bezeichnet einen Händler oder Kaufmann. „Händler“ passt zum geschäftlichen Zusammenhang und ist im heutigen Deutsch geläufig.
- source_word: וּמֹכְרֵי כָל מִמְכָּר
  choice: und die Verkäufer von Waren aller Art
  rationale: Die Wendung umfasst Verkäufer jeglicher Handelsware. „Waren aller Art“ bewahrt diese Breite in natürlichem Deutsch.
- source_word: מִחוּץ לִירוּשָׁלָם
  choice: außerhalb Jerusalems
  rationale: מִחוּץ bezeichnet einen Ort außerhalb der Stadt; die Formulierung ist präzise und idiomatisch.
- source_word: פַּעַם וּשְׁתָּיִם
  choice: ein- oder zweimal
  rationale: Wörtlich steht „einmal und zweimal“; die idiomatische Bedeutung ist „ein- oder zweimal“, ohne eine häufige Wiederholung nahezulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die Ortsangabe nahe beim Verb, während „Da“ den erzählerischen Anschluss von וַ־ wiedergibt.
