source:
  edition: WLC
  text: כִּ֣י לֹ֧א קִדְּמ֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/לֶּ֣חֶם וּ/בַ/מָּ֑יִם וַ/יִּשְׂכֹּ֨ר עָלָ֤י/ו אֶת בִּלְעָם֙ לְ/קַֽלְל֔/וֹ וַ/יַּהֲפֹ֧ךְ אֱלֹהֵ֛י/נוּ הַ/קְּלָלָ֖ה לִ/בְרָכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/002.yaml
  text: because they did not meet the sons of Israel with bread and water[a], and hired Balaam against them to curse them, but our God turned the curse into a blessing.
translation:
  language: de
  text: denn sie kamen den Israeliten nicht mit Brot und Wasser entgegen und warben Bileam gegen sie an, damit er sie verfluchte[a]. Doch unser Gott verwandelte den Fluch in einen Segen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und er warb Bileam gegen ihn an, um ihn zu verfluchen“. Das Hebräische wechselt hier zum Singular und behandelt Israel als kollektive Einheit; wer mit „er“ gemeint ist, wird in diesem Vers nicht ausdrücklich genannt.'
    reason: Der auffällige Numeruswechsel und die nicht ausdrücklich bezeichnete singularische Person sollen transparent bleiben, ohne die schwer verständliche Konstruktion in den Haupttext zu übernehmen.
lexical_decisions:
- source_word: קִדְּמוּ
  choice: kamen … entgegen
  rationale: Das Verb bezeichnet hier das Entgegengehen beziehungsweise Empfangen; die konkrete Handlung bleibt erhalten, ohne sie bereits als „Willkommenheißen“ oder „Versorgen“ auszudeuten.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: „Israeliten“ ist im modernen Standarddeutsch die natürliche Bezeichnung für die Angehörigen des Volkes Israel und gibt die hebräische feste Wendung verständlich wieder.
- source_word: בַּלֶּחֶם וּבַמָּיִם
  choice: mit Brot und Wasser
  rationale: Die ausdrücklich genannten Grundnahrungsmittel und der Anklang an Deuteronomium 23 bleiben gewahrt.
- source_word: וַיִּשְׂכֹּר עָלָיו אֶת־בִּלְעָם
  choice: warben Bileam gegen sie an
  rationale: „Anwerben“ gibt das entgeltliche Verpflichten Bileams idiomatisch wieder. Der Haupttext bezieht die Handlung verständlich auf die zuvor genannten Gegner Israels; die auffälligen Singularformen des Hebräischen werden in der Fußnote offengelegt.
- source_word: לְקַלְלוֹ
  choice: damit er sie verfluchte
  rationale: Die Zweckangabe wird in natürlichem Deutsch wiedergegeben. Das pluralische Pronomen bezeichnet die Israeliten; der formale kollektive Singular des Hebräischen wird in der Fußnote dokumentiert.
- source_word: וַיַּהֲפֹךְ
  choice: verwandelte
  rationale: Das Verb bezeichnet die Umkehrung beziehungsweise Verwandlung des Fluchs in sein Gegenteil.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Das ausdrücklich vorhandene Possessivsuffix wird beibehalten.
- source_word: הַקְּלָלָה לִבְרָכָה
  choice: den Fluch in Segen
  rationale: Diese Formulierung gibt die hebräische Veränderungskonstruktion knapp und idiomatisch wieder; der artikellose Ausdruck „in Segen“ entspricht dem Hebräischen.
theological_decisions:
- issue: Volksbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die hebräische Wendung ist eine feste Volksbezeichnung. „Die Israeliten“ ist im Deutschen präzise, würdig und ohne unnötige geschlechtliche Verengung verständlich.
- issue: Wechsel zwischen Plural und kollektivem Singular
  choice: Plural im Haupttext, formale Singularformen in der Fußnote
  alternative: „und er warb Bileam gegen ihn an, um ihn zu verfluchen“
  rationale: Der hebräische Text wechselt nach dem pluralischen „sie kamen nicht entgegen“ zu einem singularischen Verb und singularischen Pronomen, ohne den singularischen Handelnden ausdrücklich zu benennen. Der Haupttext wahrt einen verständlichen deutschen Bezug auf Israels Gegner und auf das Volk Israel; die Fußnote bewahrt die grammatische Spannung, ohne den Singular eigenmächtig mit Balak gleichzusetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Entgegenkommen“, „anwerben“ und „verwandeln“ bleiben konkret und vermeiden konfessionell geprägte Zusatzdeutungen. Der Vers beginnt als begründender Anschluss mit „denn“.
