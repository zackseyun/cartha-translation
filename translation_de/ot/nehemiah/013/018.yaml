  text: הֲ/ל֨וֹא כֹ֤ה עָשׂוּ֙ אֲבֹ֣תֵי/כֶ֔ם וַ/יָּבֵ֨א אֱלֹהֵ֜י/נוּ עָלֵ֗י/נוּ אֵ֚ת כָּל הָ/רָעָ֣ה הַ/זֹּ֔את וְ/עַ֖ל הָ/עִ֣יר הַ/זֹּ֑את וְ/אַתֶּ֞ם מוֹסִיפִ֤ים חָרוֹן֙ עַל יִשְׂרָאֵ֔ל לְ/חַלֵּ֖ל אֶת הַ/שַּׁבָּֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/018.yaml
  text: Did not your fathers do this[a], and our God brought all this evil on us and on this city? Yet you are adding wrath against Israel by profaning the Sabbath.
translation:
  language: de
  text: Haben nicht eure Vorfahren genauso gehandelt? Hat unser Gott nicht all dieses Unheil[a] über uns und über diese Stadt gebracht? Doch ihr vermehrt den Zorn über Israel, indem ihr den Sabbat entweiht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: all dieses Böse. Das hebräische Wort רָעָה kann sowohl Böses als auch Unheil oder eine Katastrophe bezeichnen; hier steht es im Zusammenhang göttlichen Gerichts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא כֹה עָשׂוּ
  choice: Haben nicht … genauso gehandelt
  rationale: Die rhetorische Frage erwartet Zustimmung. „Genauso gehandelt“ gibt die Verbindung von כֹה und עָשׂוּ natürlich und präzise wieder.
- source_word: אֲבֹתֵיכֶם
  choice: eure Vorfahren
  rationale: Im heutigen Deutsch bezeichnet „Vorfahren“ die früheren Generationen klar und natürlich; das hebräische אָבוֹת kann in diesem Zusammenhang die Ahnen beziehungsweise Vorfahren meinen.
- source_word: וַיָּבֵא אֱלֹהֵינוּ
  choice: sodass unser Gott … brachte
  rationale: Die Form von בוא im Hifil bedeutet „bringen“. „Sodass“ macht den im Zusammenhang erkennbaren Folge- beziehungsweise Ursachenzusammenhang deutlich, ohne Gott als handelndes Subjekt abzuschwächen.
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  choice: all dieses Unheil
  rationale: רָעָה bezeichnet hier im Zusammenhang göttlichen Gerichts das über Volk und Stadt gekommene Unheil. Die Fußnote bewahrt zugleich die weiter reichende lexikalische Bedeutung „Böses“.
- source_word: וְאַתֶּם מוֹסִיפִים חָרוֹן עַל יִשְׂרָאֵל
  choice: Doch ihr vermehrt den Zorn über Israel
  rationale: „Doch“ gibt den Gegensatz zur warnenden Geschichte wieder. Das Partizip מוֹסִיפִים bezeichnet das fortdauernde Hinzufügen beziehungsweise Vermehren; „Zorn über Israel“ bewahrt sowohl die Gerichtssprache als auch die Zielrichtung von עַל.
- source_word: לְחַלֵּל אֶת הַשַּׁבָּת
  choice: indem ihr den Sabbat entweiht
  rationale: Der Infinitiv bezeichnet hier das Mittel beziehungsweise die Weise, durch die der Zorn vermehrt wird. „Entweihen“ ist die direkte und im Deutschen geläufige Wiedergabe von חלל im Piel.
theological_decisions:
- issue: Bedeutung von רָעָה für das von Gott über Volk und Stadt Gebrachte
  choice: Unheil
  alternative: Böses
  rationale: Im Gerichtskontext bezeichnet רָעָה eine verhängnisvolle Not oder Katastrophe. „Unheil“ vermeidet im Haupttext das Missverständnis, Gott habe moralisch Böses getan; die Fußnote erhält die echte Bedeutungsbreite des hebräischen Ausdrucks.
- issue: Stärke der Gerichtssprache in חָרוֹן
  choice: Zorn
  alternative: Zornesglut
  rationale: „Zorn“ bewahrt die theologische Schwere des göttlichen Gerichts, ohne durch eine ausdrückliche Ergänzung wie „Gottes“ etwas in den Text einzutragen. „Zornesglut“ wäre bildhafter und lexikalisch ebenfalls möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und der scharfe Gegensatz bleiben erhalten; „Vorfahren“ ist gegenwärtig verständlicher als „Väter“, und die Gerichtssprache wird weder abgeschwächt noch konfessionell ausgedeutet.
