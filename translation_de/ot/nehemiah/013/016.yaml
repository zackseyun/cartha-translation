base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/016.yaml
  text: Also Tyrians lived in it[a], bringing in fish and every kind of merchandise[b], and selling them on the Sabbath to the sons of Judah, and in Jerusalem.
translation:
  language: de
  text: Auch Tyrer lebten in ihr. Sie brachten Fisch und Waren aller Art herein und verkauften sie am Sabbat an die Leute von Juda[a] und in Jerusalem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an die Söhne Judas“; gemeint sein können auch „die Bewohner Judas“ oder „die Judäer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut kann auch schlicht mit „und in Jerusalem“ wiedergegeben werden; möglicherweise ist er nachdrücklich gemeint: „sogar in Jerusalem“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצֹּרִים
  choice: Auch Tyrer
  rationale: Das Ethnonym bezeichnet Menschen aus Tyrus; „auch“ bindet den Satz an die vorher genannten Sabbatverstöße an.
- source_word: יָשְׁבוּ בָהּ
  choice: lebten in ihr
  rationale: ישׁב bezeichnet hier das Wohnen in der zuvor genannten Stadt; das feminine Pronomen wird mit „in ihr“ bewahrt.
- source_word: מְבִיאִים דָּאג
  choice: brachten Fisch … herein
  rationale: Das Hifil-Partizip von בוא beschreibt das Hereinbringen in die Stadt; דָּאג bedeutet „Fisch“.
- source_word: וְכָל מֶכֶר
  choice: und Waren aller Art
  rationale: מֶכֶר bezeichnet zum Verkauf bestimmte Ware; die Formulierung ist im modernen Deutschen natürlich und gibt כָל umfassend wieder.
- source_word: וּמֹכְרִים
  choice: und verkauften sie
  rationale: Das Partizip setzt die fortdauernde Handelstätigkeit fort; „sie“ nimmt Fisch und Waren als Objekt auf.
- source_word: בַּשַּׁבָּת
  choice: am Sabbat
  rationale: Die bestimmte Zeitangabe wird idiomatisch und genau wiedergegeben.
- source_word: לִבְנֵי יְהוּדָה
  choice: an die Leute von Juda
  rationale: Wörtlich steht „an die Söhne Judas“; im Kontext bezeichnet die Wendung kollektiv die Bevölkerung Judas. „Leute von Juda“ vermittelt diesen Sinn natürlich, während die Fußnote die Form des Hebräischen sichtbar hält.
- source_word: וּבִירוּשָׁלִָם
  choice: – und das in Jerusalem
  rationale: Die Formulierung gibt den abschließenden Ortszusatz mit seinem wahrscheinlichen Nachdruck wieder; die Fußnote weist auf die formal schlichtere koordinierende Lesart hin.
