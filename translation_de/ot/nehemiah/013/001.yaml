  text: בַּ/יּ֣וֹם הַ/ה֗וּא נִקְרָ֛א בְּ/סֵ֥פֶר מֹשֶׁ֖ה בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/נִמְצָא֙ כָּת֣וּב בּ֔/וֹ אֲ֠שֶׁר לֹא יָב֨וֹא עַמֹּנִ֧י וּ/מֹאָבִ֛י בִּ/קְהַ֥ל הָ/אֱלֹהִ֖ים עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/001.yaml
  text: On that day the Book of Moses was read in the hearing of the people[c][b][a], and it was found written in it that no Ammonite or Moabite should ever enter the assembly of God.
translation:
  language: de
  text: An jenem Tag wurde aus dem Buch des Mose vor dem Volk vorgelesen. Darin fand man geschrieben, dass kein Ammoniter oder Moabiter jemals[b] in die Versammlung Gottes[a] kommen dürfe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Gemeinde Gottes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „bis in Ewigkeit“; gemeint ist hier eine dauerhaft geltende Ausschließung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Gibt die bestimmte Zeitangabe natürlich und nah am Hebräischen wieder.
- source_word: נִקְרָא בְּסֵפֶר מֹשֶׁה
  choice: wurde aus dem Buch des Mose vorgelesen
  rationale: Das passive נִקְרָא bleibt erhalten; die Konstruktion mit ב bezeichnet hier das Lesen aus dem Buch. „Vorgelesen“ ergibt sich aus der öffentlichen Lesung vor dem Volk, ohne ein zusätzliches Adverb einzufügen.
- source_word: בְּאָזְנֵי הָעָם
  choice: vor den Ohren des Volkes
  rationale: Bewahrt das konkrete hebräische Bild und ist im Deutschen verständlich, wenn auch feierlich.
- source_word: וְנִמְצָא כָּתוּב בּוֹ
  choice: Darin fand man geschrieben
  rationale: Eine natürliche deutsche Wiedergabe der unpersönlich-passiven Aussage; „darin“ verweist eindeutig auf das Buch des Mose.
- source_word: עַמֹּנִי וּמֹאָבִי
  choice: kein Ammoniter und kein Moabiter
  rationale: Die doppelte Verneinung im Deutschen macht deutlich, dass beide genannten Gruppen jeweils betroffen sind; die hebräische Verbindung mit ו bleibt semantisch gewahrt.
- source_word: בִּקְהַל הָאֱלֹהִים
  choice: in die Versammlung Gottes
  rationale: „Versammlung“ gibt קָהָל direkt wieder und vermeidet eine vorschnelle Gleichsetzung mit einer späteren kirchlichen Institution.
- source_word: עַד עוֹלָם
  choice: jemals
  rationale: Im Zusammenhang mit der Verneinung drückt „niemals/jemals ... nicht“ die dauerhafte Ausschließung idiomatisch aus; die Alternative „für immer“ wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von קְהַל הָאֱלֹהִים
  choice: Versammlung Gottes
  alternative: Gemeinde Gottes
  rationale: Die gewählte Formulierung bewahrt die Breite des hebräischen קָהָל und importiert keinen spezifisch neutestamentlichen oder konfessionellen Gemeindebegriff.
- issue: Reichweite von עַד עוֹלָם
  choice: jemals ... kommen dürfe
  alternative: für immer nicht ... kommen dürfe
  rationale: Im verneinten Rechtssatz gibt „jemals“ die unbefristete Geltung natürlich wieder, ohne die zeitliche Spannung des Ausdrucks weiter auszulegen.
- issue: Art des Zutritts zur Versammlung
  choice: in die Versammlung Gottes kommen
  alternative: der Versammlung Gottes angehören
  rationale: „Kommen“ hält sich an יָבוֹא und entscheidet nicht näher, ob kultische Teilnahme, rechtliche Aufnahme oder volle Zugehörigkeit gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vor den Ohren des Volkes“ bewahrt bewusst das anschauliche hebräische Idiom; der übrige Satzbau ist für heutige Leser geglättet. Alle Fußnotenmarker stehen im Haupttext.
