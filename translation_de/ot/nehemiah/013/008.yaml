  text: וַ/יֵּ֥רַֽע לִ֖/י מְאֹ֑ד וָֽ/אַשְׁלִ֜יכָ/ה אֶֽת כָּל כְּלֵ֧י בֵית טוֹבִיָּ֛ה הַ/ח֖וּץ מִן הַ/לִּשְׁכָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/008.yaml
  text: And it displeased me greatly[b][a], and I threw all the household goods of Tobiah out of the chamber.
translation:
  language: de
  text: Das missfiel mir sehr, und ich warf den gesamten Hausrat Tobijas aus der Kammer[a] hinaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die „Kammer“ war ein Raum im Tempelkomplex.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרַע לִי מְאֹד
  choice: Das missfiel mir sehr
  rationale: Die hebräische Wendung mit רעע und ל bezeichnet etwas als für jemanden sehr misslich oder unerfreulich. Die Übersetzung bewahrt die unpersönliche Konstruktion und legt keine spezifischere Gefühlsregung fest.
- source_word: וָאַשְׁלִיכָה
  choice: ich warf
  rationale: Das Hifil von שלך bezeichnet ein kräftiges Werfen oder Hinauswerfen; „warf … hinaus“ ist im modernen Deutschen klar und natürlich.
- source_word: כָּל כְּלֵי בֵית טוֹבִיָּה
  choice: den gesamten Hausrat Tobijas
  rationale: כְּלִי kann Geräte, Gefäße, Einrichtungsgegenstände oder Besitzstücke bezeichnen. „Hausrat“ gibt den umfassenden Sinn im Kontext knapp wieder, ohne ihn auf Gefäße zu verengen.
- source_word: הַחוּץ מִן הַלִּשְׁכָּה
  choice: aus der Kammer hinaus
  rationale: Die Formulierung bildet sowohl die Herkunft aus dem Raum als auch die gerichtete Bewegung nach draußen ab. „Kammer“ wahrt den Bezug auf einen Nebenraum des Tempelkomplexes.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, während „Hausrat“ die Bedeutungsbreite von כְּלִי in diesem Zusammenhang idiomatisch bündelt.
