  source_fidelity: Die Übersetzung gibt die hebräische Wendung וַיֵּרַע לִי מְאֹד treffend und ohne zusätzliche emotionale Zuspitzung als „Das missfiel mir sehr“ wieder. „warf … hinaus“ vermittelt die aktive, entschiedene Handlung von וָאַשְׁלִיכָה. „den gesamten Hausrat Tobijas“ bildet כָּל כְּלֵי בֵית טוֹבִיָּה als umfassende Bezeichnung für seine Gegenstände beziehungsweise Habe angemessen ab. „aus der Kammer hinaus“ gibt sowohl den Ausgangsort als auch die Bewegung nach draußen wieder.
