source:
  edition: WLC
  text: וָ/אָרִ֨יבָ/ה֙ אֶת הַ/סְּגָנִ֔ים וָ/אֹ֣מְרָ֔/ה מַדּ֖וּעַ נֶעֱזַ֣ב בֵּית הָ/אֱלֹהִ֑ים וָֽ/אֶ֨קְבְּצֵ֔/ם וָֽ/אַעֲמִדֵ֖/ם עַל עָמְדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/011.yaml
  text: So I contended with the officials and said[b][a], “Why has the house of God been neglected?” Then I gathered them and stationed them at their posts.
translation:
  language: de
  text: 'Darauf stellte ich die Beamten zur Rede und sagte: »Warum ist das Haus Gottes vernachlässigt worden?«[a] Dann versammelte ich sie und stellte sie wieder auf ihre Posten.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Warum ist das Haus Gottes verlassen worden?« Das hebräische Passivverb kann ausdrücken, dass etwas verlassen oder sich selbst überlassen wurde. Hier legt der Zusammenhang »vernachlässigt« nahe, weil Tempeldienst und Versorgung nicht ordnungsgemäß aufrechterhalten wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »stellte sie an ihren Platz«. Die Formulierung kann bedeuten, dass die für den Tempeldienst zuständigen Personen wieder ihre zugewiesenen Aufgaben übernahmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: stellte ich … zur Rede
  rationale: Das Verb ריב bezeichnet eine Auseinandersetzung oder einen Streit. Die deutsche Wendung gibt die konfrontative Handlung in diesem Verwaltungskontext natürlich wieder, ohne sie auf eine bloße Zurechtweisung zu verengen.
- source_word: הַסְּגָנִים
  choice: die führenden Beamten
  rationale: סְגָנִים bezeichnet nachgeordnete staatliche Würdenträger oder Amtsträger. »Führende Beamte« ist im modernen Deutsch verständlich und kennzeichnet ihre administrative Verantwortung.
- source_word: וָאֹמְרָה
  choice: und sagte
  rationale: Die narrative Verbform von אמר wird als fortlaufende Handlung schlicht und idiomatisch wiedergegeben.
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Die direkte Frage wird im Deutschen am natürlichsten mit »Warum« formuliert.
- source_word: נֶעֱזַב
  choice: ist … vernachlässigt worden
  rationale: Die Passivform von עזב kann ein Verlassen oder Sich-selbst-Überlassen bezeichnen. Im Zusammenhang geht es besonders um die unterlassene Versorgung und den dadurch beeinträchtigten Tempeldienst; »vernachlässigt« wahrt diesen praktischen Sinn.
- source_word: בֵּית הָאֱלֹהִים
  choice: das Haus Gottes
  rationale: Die formnahe Wiedergabe bewahrt die prägnante hebräische Bezeichnung; »Tempel Gottes« wäre verständlich, aber bereits stärker deutend.
- source_word: וָאֶקְבְּצֵם
  choice: Dann versammelte ich sie
  rationale: קבץ bedeutet sammeln oder versammeln. Das Pronomen bleibt wie im Hebräischen erhalten, statt seine Bezugsgruppe im Vers ausdrücklich zu ergänzen.
- source_word: וָאַעֲמִדֵם עַל עָמְדָם
  choice: setzte sie wieder an ihren Dienstposten ein
  rationale: Die Verbindung aus dem Hifil von עמד und עַל עָמְדָם beschreibt, dass die Betroffenen erneut ihre zugewiesenen Stellungen beziehungsweise Aufgaben einnahmen. »Dienstposten« macht den funktionalen Sinn im Deutschen deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und nachdrücklich. Verwaltungsbegriffe sind allgemein verständlich formuliert; die traditionelle Wendung »Haus Gottes« bleibt erhalten. Die Pronomenreferenz des hebräischen Textes wird im Haupttext nicht durch eine ausdrückliche Benennung aufgelöst.
