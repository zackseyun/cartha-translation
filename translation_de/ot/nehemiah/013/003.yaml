id: NEH.13.3
reference: Nehemiah 13:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֖י כְּ/שָׁמְעָ֣/ם אֶת הַ/תּוֹרָ֑ה וַ/יַּבְדִּ֥ילוּ כָל עֵ֖רֶב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/003.yaml
  text: And when they heard the law[a], they separated from Israel all the mixed multitude.
translation:
  language: de
  text: Als sie das Gesetz hörten, sonderten sie das ganze Mischvolk[a] von Israel ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „alle Menschen gemischter Herkunft“ oder „die ganze gemischte Gruppe“. Das hebräische Wort עֵרֶב ist eine Sammelbezeichnung für eine gemischte Gruppe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Als …
  rationale: Die hebräische Erzählungsfolge leitet das nächste Geschehen ein. Im Deutschen gibt die unmittelbar folgende temporale Konstruktion den Zusammenhang natürlich wieder; ein zusätzliches „Und es geschah“ wäre unnötig schwerfällig.
- source_word: כְּשָׁמְעָם
  choice: als sie … hörten
  rationale: כְּ mit Infinitivus constructus und Suffix bildet hier einen Temporalsatz. „Als sie … hörten“ ist klar und idiomatisch, ohne die mögliche Bedeutung durch „sobald“ zeitlich zu verschärfen.
- source_word: הַתּוֹרָה
  choice: das Gesetz
  rationale: תּוֹרָה bezeichnet hier im nachexilischen Bundeszusammenhang die öffentlich vorgelesene, maßgebliche Weisung. „Das Gesetz“ ist im Deutschen geläufig und kontextuell passend; „die Tora“ oder „die Weisung“ wären ebenfalls möglich.
- source_word: וַיַּבְדִּילוּ
  choice: sonderten … ab
  rationale: בדל bezeichnet ein Trennen oder Absondern. Die deutsche Wendung bewahrt die konkrete Handlung, ohne sie mit „schlossen aus“ stärker auszudeuten.
- source_word: כָל
  choice: das ganze
  rationale: כָל bezieht sich auf ein Kollektiv und bezeichnet daher die Gruppe in ihrer Gesamtheit.
- source_word: עֵרֶב
  choice: Mischvolk
  rationale: עֵרֶב ist ein Kollektivbegriff für eine gemischte Gruppe. „Mischvolk“ erhält diese kollektive und intertextuelle Färbung; eine Fußnote weist auf mögliche Bedeutungsnuancen hin.
- source_word: מִיִּשְׂרָאֵל
  choice: von Israel
  rationale: Die Präposition מִן bezeichnet die Trennung von der Gemeinschaft. „Von Israel“ gibt den Eigennamen und seine gemeinschaftliche Bedeutung direkt wieder.
theological_decisions:
- issue: Bezug von „Israel“ im nachexilischen Zusammenhang gemeinschaftlicher Abgrenzung
  choice: „Israel“ bleibt als Bezeichnung der Bundesgemeinschaft unverändert stehen.
  alternative: „von den Israeliten“ oder „von der Gemeinde Israels“
  rationale: Der hebräische Text verwendet den Eigennamen יִשְׂרָאֵל. Seine Beibehaltung wahrt die gemeinschaftliche und bundestheologische Spannung, ohne die Gruppe näher zu definieren oder spätere theologische Folgerungen einzutragen.
- issue: Bestimmung der mit עֵרֶב bezeichneten Gruppe
  choice: Die kollektive und mehrdeutige Bezeichnung wird mit „Mischvolk“ wiedergegeben.
  alternative: „Menschen gemischter Herkunft“ oder „gemischte Gruppe“
  rationale: Der Vers selbst legt nicht eindeutig fest, ob ethnische Abstammung, ausländische Zugehörigkeit oder eine anderweitig gemischte Gruppenzusammensetzung im Vordergrund steht. Die Übersetzung lässt diese Unbestimmtheit bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mischvolk“ ist bewusst leicht bibelsprachlich, bewahrt aber die kollektive Bedeutung und die Mehrdeutigkeit des hebräischen Ausdrucks; die Fußnote erläutert verständlichere Alternativen.
