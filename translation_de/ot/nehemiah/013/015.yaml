  text: בַּ/יָּמִ֣ים הָ/הֵ֡מָּה רָאִ֣יתִי בִֽ/יהוּדָ֣ה דֹּֽרְכִֽים גִּתּ֣וֹת בַּ/שַּׁבָּ֡ת וּ/מְבִיאִ֣ים הָ/עֲרֵמ֣וֹת וְֽ/עֹמְסִ֪ים עַל הַ/חֲמֹרִ֟ים וְ/אַף יַ֜יִן עֲנָבִ֤ים וּ/תְאֵנִים֙ וְ/כָל מַשָּׂ֔א וּ/מְבִיאִ֥ים יְרוּשָׁלִַ֖ם בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וָ/אָעִ֕יד בְּ/י֖וֹם מִכְרָ֥/ם צָֽיִד׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/015.yaml
  text: In those days I saw in Judah people treading winepresses on the Sabbath, and bringing in heaps of grain and loading them on donkeys—and also wine, grapes, figs, and every kind of load—and bringing them into Jerusalem on the Sabbath day. So I testified against them on the day they sold food.
translation:
  language: de
  text: In jenen Tagen sah ich in Juda Leute, die am Sabbat in den Keltern Trauben stampften, Getreidehaufen herbeibrachten und sie auf Esel luden, ebenso Wein, Trauben, Feigen und Lasten aller Art. All dies brachten sie am Sabbattag nach Jerusalem. Ich warnte sie an dem Tag, an dem sie Lebensmittel verkauften.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֹּרְכִים גִּתּוֹת
  choice: in den Keltern Trauben stampften
  rationale: Die Wendung bezeichnet das Treten bzw. Stampfen in Weinpressen; die natürliche deutsche Formulierung macht die im Vorgang vorausgesetzten Trauben ausdrücklich, ohne den Sinn zu verändern.
- source_word: הָעֲרֵמוֹת
  choice: Getreidehaufen
  rationale: Das Wort bezeichnet aufgehäuftes Erntegut; „Getreidehaufen“ bewahrt das Bild eines Haufens und passt zum Verladen auf Esel.
- source_word: וָאָעִיד
  choice: Da verwarnte ich sie
  rationale: Das Hifil von עוּד kann ein nachdrückliches Warnen oder Ermahnen bezeichnen. „Verwarnte“ gibt die förmliche, konfrontierende Handlung im Kontext verständlich wieder.
- source_word: צָיִד
  choice: Lebensmittel
  rationale: Hier bezeichnet das Wort Nahrung bzw. Vorräte als Handelsware. „Lebensmittel“ ist im modernen Deutsch klarer und umfassender als „Proviant“.
theological_decisions:
- issue: Bezeichnung des siebten Tages
  choice: Sabbat
  alternative: Ruhetag
  rationale: Der bestimmte Ausdruck הַשַּׁבָּת bezeichnet hier den israelitischen Sabbat; die etablierte deutsche Bezeichnung wahrt den konkreten geschichtlichen und religiösen Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die fortlaufenden hebräischen Partizipien wurden zur besseren Lesbarkeit auf zwei Sätze verteilt; „Andere“ unterscheidet die parallel beobachteten Tätigkeiten, ohne eine eigenständige Personengruppe dogmatisch festzulegen.
