  text: וָ/אָרִ֕יבָ/ה אֵ֖ת חֹרֵ֣י יְהוּדָ֑ה וָ/אֹמְרָ֣/ה לָ/הֶ֗ם מָֽה הַ/דָּבָ֨ר הָ/רָ֤ע הַ/זֶּה֙ אֲשֶׁ֣ר אַתֶּ֣ם עֹשִׂ֔ים וּֽ/מְחַלְּלִ֖ים אֶת י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/017.yaml
  text: So I contended with the nobles of Judah and said to them[a], “What is this evil thing that you are doing, profaning the Sabbath day?”
translation:
  language: de
  text: 'Da stellte ich die führenden Männer Judas zur Rede und sagte zu ihnen: „Was ist das für eine böse Sache, die ihr da tut, indem ihr den Sabbat entheiligt?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Sabbat entweiht“. Das hebräische Verb bezeichnet, dass etwas Heiliges wie etwas Gewöhnliches behandelt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: Da stellte ich … zur Rede
  rationale: ריב bezeichnet hier ein entschiedenes Streiten, Tadeln oder Erheben eines Vorwurfs. „Zur Rede stellen“ gibt die konfrontative Kraft natürlich wieder, ohne ein förmliches Gerichtsverfahren vorauszusetzen; „Da“ nimmt die erzählerische Folge des Waw-Konsekutivs auf.
- source_word: חֹרֵי יְהוּדָה
  choice: die Vornehmen Judas
  rationale: חֹרִים bezeichnet gesellschaftlich führende oder vornehme Männer. „Vornehme“ ist im Deutschen verständlich und lässt offen, ob ihre Stellung primär sozial oder amtlich war.
- source_word: וָאֹמְרָה לָהֶם
  choice: und sagte zu ihnen
  rationale: Schlichte Wiedergabe der fortlaufenden Erzählung; das Subjekt bleibt aus dem vorausgehenden Satzteil eindeutig.
- source_word: מָה הַדָּבָר הָרָע הַזֶּה
  choice: Was ist das für eine böse Sache
  rationale: דָּבָר meint hier eine Sache oder Handlung, und רָע enthält eine klare moralische Verurteilung. Die deutsche Wendung ist natürlich und bewahrt den vorwurfsvollen Fragesinn.
- source_word: אֲשֶׁר אַתֶּם עֹשִׂים
  choice: die ihr da tut
  rationale: Das Partizip beschreibt die gegenwärtig ausgeübte Handlung. Das idiomatische „da“ verstärkt im Deutschen den unmittelbaren Vorwurf, ohne zusätzlichen Sachinhalt einzuführen.
- source_word: וּמְחַלְּלִים
  choice: Ihr entheiligt
  rationale: חלל im Piel bedeutet, Heiliges zu entweihen beziehungsweise als gewöhnlich zu behandeln. „Entheiligen“ bewahrt den Gegensatz zwischen heilig und gewöhnlich besser als eine bloße Wiedergabe mit „übertreten“.
- source_word: אֶת יוֹם הַשַּׁבָּת
  choice: den Sabbat
  rationale: „Den Sabbat“ ist im modernen Deutschen die natürliche Wiedergabe. Der Tagesbezug ist bereits im Begriff Sabbat enthalten, sodass „Sabbattag“ unnötig schwerfällig wäre.
theological_decisions:
- issue: Sprache für die Verletzung der Sabbatheiligkeit
  choice: Ihr entheiligt den Sabbat
  alternative: Ihr verletzt den Sabbat / Ihr entweiht den Sabbat
  rationale: Das hebräische Verb betont nicht nur einen Regelverstoß, sondern die Behandlung des Heiligen als gewöhnlich. „Entheiligen“ erhält dieses theologische Gewicht und formuliert die koordinierte Verbform zugleich als natürliche, zugespitzte deutsche Frage-Antwort-Folge.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zur Rede stellen“ vermittelt die scharfe Konfrontation idiomatisch; „die Vornehmen Judas“ wahrt die soziale Führungsbezeichnung, ohne sie vorschnell als konkretes Amt festzulegen. Der zweite Teil der direkten Rede wird zur natürlichen deutschen Zuspitzung in einen eigenen Satz gefasst.
