  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זָכְרָ֥/ה לָ/הֶ֖ם אֱלֹהָ֑/י עַ֚ל גָּאֳלֵ֣י הַ/כְּהֻנָּ֔ה וּ/בְרִ֥ית הַ/כְּהֻנָּ֖ה וְ/הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/029.yaml
  text: Remember them[a], my God, because they have defiled the priesthood and the covenant of the priesthood and the Levites.
translation:
  language: de
  text: Denk an sie[a], mein Gott, denn sie haben das Priestertum und den Bund des Priestertums und der Leviten entweiht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Denk an sie, mein Gott, wegen derer, die das Priestertum und den Bund des Priestertums und der Leviten entweiht haben.“'
    reason: Die hebräische Formulierung verwendet ein substantivisches Partizip („die Entweiher“) und lässt dessen genaue syntaktische Beziehung zu „sie“ unausgesprochen.
lexical_decisions:
- source_word: זָכְרָה
  choice: Denk an
  rationale: Die Gebetsbitte richtet sich unmittelbar an Gott. „Denk an“ gibt den Imperativ natürlich wieder, ohne bereits im Verb festzulegen, ob das Gedenken zum Guten oder zum Gericht geschieht.
- source_word: לָהֶם
  choice: sie
  rationale: Das Pronomen bezeichnet die zuvor genannten Schuldigen. Der ungünstige Sinn ergibt sich aus dem Vorwurf der Entweihung und muss nicht durch „gegen sie“ in die Präposition hineingelesen werden.
- source_word: אֱלֹהָי
  choice: mein Gott
  rationale: Die Form trägt das Suffix der ersten Person Singular und entspricht Nehemias charakteristischer Gebetsanrede.
- source_word: עַל
  choice: denn
  rationale: Die Präposition führt hier den Grund für die Bitte an. „Denn“ verbindet die gerichtliche Bitte in natürlichem Deutsch mit dem folgenden Vorwurf.
- source_word: גָּאֳלֵי
  choice: sie haben … entweiht
  rationale: Das substantivisch gebrauchte Partizip des Verbs גאל im Sinn von „verunreinigen, entweihen“ wird für klares Deutsch als Verbalsatz wiedergegeben. Gemeint ist hier nicht die andersstämmige Bedeutung „erlösen“.
- source_word: הַכְּהֻנָּה
  choice: das Priestertum
  rationale: Das abstrakte Substantiv bezeichnet den priesterlichen Stand beziehungsweise dessen Amt und nicht lediglich einzelne Priester.
- source_word: וּבְרִית הַכְּהֻנָּה
  choice: und den Bund des Priestertums
  rationale: Die Genitivverbindung bleibt bewusst eng am Hebräischen, ohne vorschnell zu entscheiden, ob es sich um einen Bund mit den Priestern oder um einen das Priestertum betreffenden Bund handelt.
- source_word: וְהַלְוִיִּם
  choice: und der Leviten
  rationale: Die Leviten werden syntaktisch dem Bund zugeordnet. Die Formulierung bewahrt die gedrängte hebräische Beziehung zwischen Bund, Priestertum und Leviten.
theological_decisions:
- issue: Ob Gott der Schuldigen zum Guten oder zum Gericht gedenken soll
  choice: Ein Gedenken zum Gericht, das durch den Entweihungsvorwurf erkennbar wird
  alternative: Ein neutrales oder günstiges Gedenken
  rationale: Das Verb „gedenken“ kann in Nehemias Gebeten je nach Zusammenhang günstig oder ungünstig gemeint sein. Hier bestimmt der folgende Vorwurf den gerichtlichen Sinn; die Übersetzung lässt diese Wirkung aus dem Kontext hervorgehen, statt das Verb selbst zu verstärken.
- issue: Bezug von „der Bund des Priestertums und der Leviten“
  choice: Ein Bund, der das Priestertum und die Leviten gemeinsam betrifft
  alternative: Der Bund des Priestertums und, davon getrennt, die Leviten; oder ausdrücklich ein Bund mit Priestern und Leviten
  rationale: Die knappe hebräische Koordination legt eine gemeinsame Zuordnung nahe, lässt aber die genaue Art der Genitivbeziehung offen. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Denk an sie“ ist als direkte Gebetsbitte klar und natürlich; die institutionellen Begriffe „Priestertum“ und „Bund“ bewahren die sachliche und theologische Dichte des Ausgangstextes.
