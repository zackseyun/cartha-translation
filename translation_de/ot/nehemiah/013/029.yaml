  source_fidelity: Der Text gibt die Gebetsbitte זָכְרָה לָהֶם אֱלֹהָי treffend als „Denk an sie, mein Gott“ wieder. Die negative Ausrichtung ergibt sich, ohne sie im Verb zu überdeuten, aus dem folgenden Vorwurf. Die substantivische Partizipform גָּאֳלֵי wird mit einem idiomatischen Verbalsatz angemessen wiedergegeben. „Das Priestertum“ sowie „den Bund des Priestertums und der Leviten“ bewahren die institutionelle und syntaktisch verdichtete Aussage des Hebräischen.
  naturalness: „Denk an sie, mein Gott“ ist modernes, verständliches Standarddeutsch und behält den Charakter einer unmittelbaren Gebetsanrede. Der Satz ist flüssig; die Wiederholung von „Priestertums“ entspricht der Dichte des Ausgangstextes und ist sachlich angemessen.
  terminology: „Priestertum“, „Bund“, „Leviten“ und „entweiht“ sind in diesem Kontext treffende, registergerechte Begriffe. „Entweiht“ gibt גאל im Sinn von kultischer Verunreinigung bzw. Entweihung klar wieder, ohne es mit dem anderen Stamm „erlösen“ zu verwechseln.
