language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְ/כָל זֶ֕ה לֹ֥א הָיִ֖יתִי בִּֽ/ירוּשָׁלִָ֑ם כִּ֡י בִּ/שְׁנַת֩ שְׁלֹשִׁ֨ים וּ/שְׁתַּ֜יִם לְ/אַרְתַּחְשַׁ֤סְתְּא מֶֽלֶךְ בָּבֶל֙ בָּ֣אתִי אֶל הַ/מֶּ֔לֶךְ וּ/לְ/קֵ֥ץ יָמִ֖ים נִשְׁאַ֥לְתִּי מִן הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/006.yaml
  text: But during all this I was not in Jerusalem[a], for in the thirty-second year of Artaxerxes king of Babylon I went to the king[b], and after some time I asked leave from the king.
translation:
  language: de
  text: Doch während all dessen war ich nicht in Jerusalem; denn im zweiunddreißigsten Jahr des Artaxerxes, des Königs von Babylon,[a] ging ich zum König. Nach einiger Zeit[b] bat ich den König um Urlaub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »König von Babylon«. Die Übersetzung folgt dem überlieferten Wortlaut, statt ihn an den größeren Zusammenhang des Perserreichs anzugleichen.'
    reason: textual_variant
  - marker: b
    text: 'Oder: »am Ende einer gewissen Zeit«; wörtlich: »am Ende von Tagen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֶה
  choice: Doch während all dessen
  rationale: Die Wendung stellt den zeitlichen Rahmen her und hebt zugleich Nehemias Abwesenheit während der zuvor berichteten Vorgänge hervor.
- source_word: לֹא הָיִיתִי בִּירוּשָׁלִָם
  choice: war ich nicht in Jerusalem
  rationale: Die schlichte Vergangenheitsform gibt die Aussage über Nehemias Abwesenheit natürlich und unmittelbar wieder.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Erklärung für seine Abwesenheit ein.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם
  choice: im zweiunddreißigsten Jahr
  rationale: Dies ist die übliche deutsche Wiedergabe einer Regierungsjahrangabe.
- source_word: לְאַרְתַּחְשַׁסְתְּא
  choice: des Artaxerxes
  rationale: Der Personenname wird nach der etablierten deutschen Form wiedergegeben.
- source_word: מֶלֶךְ בָּבֶל
  choice: des Königs von Babylon
  rationale: Die Übersetzung folgt ausdrücklich dem hebräischen Wortlaut und harmonisiert die Bezeichnung nicht mit dem persischen Reichskontext.
- source_word: בָּאתִי אֶל הַמֶּלֶךְ
  choice: ging ich zum König
  rationale: בוא kann je nach Erzählperspektive ‚kommen‘ oder ‚gehen‘ bedeuten; aus Nehemias Perspektive ist ‚ging‘ im Deutschen natürlich.
- source_word: וּלְקֵץ יָמִים
  choice: Nach einiger Zeit
  rationale: Die wörtliche Wendung ‚am Ende von Tagen‘ bezeichnet hier idiomatisch einen unbestimmten Zeitraum.
- source_word: נִשְׁאַלְתִּי מִן הַמֶּלֶךְ
  choice: bat ich den König um Urlaub
  rationale: Die Form bezeichnet im Kontext das Erbitten einer zeitweiligen Entlassung beziehungsweise Beurlaubung, ohne ausdrücklich vorwegzunehmen, ob sie gewährt wurde.
