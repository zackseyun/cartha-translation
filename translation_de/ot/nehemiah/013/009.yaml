base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/009.yaml
  text: Then I gave the order[a], and they cleansed the chambers; and I brought back there the vessels of the house of God[b], with the grain offering and the frankincense.
translation:
  language: de
  text: Da befahl ich[a], und sie reinigten[b] die Kammern. Dann brachte ich die Geräte des Hauses Gottes wieder dorthin, samt dem Speiseopfer und dem Weihrauch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Da sagte ich“. Im Zusammenhang handelt es sich um eine Anordnung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „läuterten“. Das hebräische Verb kann sowohl kultische Reinigung als auch tatsächliches Säubern bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Da befahl ich
  rationale: Das Verb bedeutet wörtlich „ich sagte“. Im Zusammenhang leitet es jedoch eine Anordnung ein, die ausgeführt wird; „befahl“ gibt diese pragmatische Funktion in natürlichem Deutsch wieder.
- source_word: וַיְטַהֲרוּ
  choice: die Kammern zu reinigen
  rationale: טהר kann sowohl kultische Reinigung als auch tatsächliches Säubern bezeichnen. „reinigen“ lässt beide Aspekte offen; die Infinitivkonstruktion gibt idiomatisch wieder, dass Nehemias Anordnung ausgeführt wurde.
- source_word: הַלְּשָׁכוֹת
  choice: die Kammern
  rationale: לשכה bezeichnet Räume oder Kammern im Tempelbereich. „Kammern“ wahrt den kultischen Zusammenhang, ohne die Nutzung als Lagerräume in den Begriff hineinzulesen.
- source_word: וָאָשִׁיבָה שָּׁם
  choice: Dann brachte ich ... wieder dorthin
  rationale: Die Hifil-Bedeutung von שוב ist hier „zurückbringen“. „wieder dorthin“ gibt sowohl die Rückführung als auch שׁם wieder.
- source_word: כְּלֵי בֵּית הָאֱלֹהִים
  choice: die Geräte des Hauses Gottes
  rationale: כְּלִי ist ein weiter Begriff für Geräte, Gegenstände oder Gefäße. „Geräte“ passt zum Tempelkontext; „Haus Gottes“ bildet die hebräische Wendung bewusst ab.
- source_word: אֶת הַמִּנְחָה
  choice: samt dem Speiseopfer
  rationale: מִנְחָה bezeichnet im kultischen Kontext das Speiseopfer. „samt“ kennzeichnet, dass es zusammen mit den Tempelgeräten zurückgebracht wurde.
- source_word: וְהַלְּבוֹנָה
  choice: und dem Weihrauch
  rationale: לְבוֹנָה bezeichnet das aromatische Räucherharz, genauer Weihrauch. Der bestimmte Artikel wird durch „dem“ wiedergegeben.
