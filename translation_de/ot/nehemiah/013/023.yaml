base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/023.yaml
  text: Also in those days I saw the Jews who had married women of Ashdod[a], Ammonite women[b], and Moabite women.
translation:
  language: de
  text: Auch in jenen Tagen sah ich Juden[a], die Frauen aus Aschdod, Ammoniterinnen und Moabiterinnen geheiratet hatten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Judäer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „hatten Frauen wohnen lassen“ oder „hatten Frauen angesiedelt“; die hebräische Wendung bezeichnet hier im Kontext, dass sie diese Frauen geheiratet oder zu Frauen genommen hatten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בַּיָּמִים הָהֵם
  choice: Auch in jener Zeit
  rationale: Gibt die additive Funktion von גַּם und den zeitlichen Rückverweis natürlich und würdig wieder.
- source_word: רָאִיתִי
  choice: sah ich
  rationale: Bewahrt den schlichten Augenzeugencharakter des gewöhnlichen Verbs für „sehen“.
- source_word: הַיְּהוּדִים
  choice: Juden
  rationale: Bezeichnet hier am natürlichsten die jüdische Gemeinschaft der nachexilischen Zeit; „Judäer“ bleibt als stärker geografische Wiedergabe möglich.
- source_word: הֹשִׁיבוּ נָשִׁים
  choice: Frauen geheiratet hatten
  rationale: Die wörtliche Bedeutung des Hifil von ישׁב ist etwa „wohnen lassen/ansiedeln“; zusammen mit „Frauen“ bezeichnet die Wendung im Kontext das Nehmen von Frauen zur Ehe. Das Plusquamperfekt verdeutlicht, dass die Ehen bereits bestanden, als Nehemia sie bemerkte.
- source_word: אשדודיות עמוניות מוֹאֲבִיּוֹת
  choice: aschdoditische, ammonitische und moabitische Frauen
  rationale: Die drei femininen Herkunftsbezeichnungen werden parallel und in idiomatischem modernem Deutsch wiedergegeben.
theological_decisions:
- issue: Ethnografische Wiedergabe von הַיְּהוּדִים
  choice: Juden
  alternative: Judäer
  rationale: „Juden“ vermittelt im Deutschen die gemeinschaftliche ethnisch-religiöse Referenz des nachexilischen Zusammenhangs; „Judäer“ könnte den geografischen Aspekt stärker hervorheben und wird deshalb in einer Fußnote bewahrt.
- issue: Idiomatische Bedeutung von הֹשִׁיבוּ נָשִׁים
  choice: Frauen geheiratet hatten
  alternative: Frauen bei sich hatten wohnen lassen / Frauen genommen hatten
  rationale: Der unmittelbare und weitere Kontext handelt von ehelichen Verbindungen. Die idiomatische Übersetzung macht dies verständlich, ohne eine weitergehende konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Herkunftsadjektive stehen parallel; die hebräische Ehe-Wendung wird im Haupttext idiomatisch, ihre wörtlichere Form in der Fußnote wiedergegeben.
