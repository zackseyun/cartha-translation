  text: וָ/אֹמַ֣ר לַ/מֶּ֔לֶךְ אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב וְ/אִם יִיטַ֥ב עַבְדְּ/ךָ֖ לְ/פָנֶ֑י/ךָ אֲשֶׁ֧ר תִּשְׁלָחֵ֣/נִי אֶל יְהוּדָ֗ה אֶל עִ֛יר קִבְר֥וֹת אֲבֹתַ֖/י וְ/אֶבְנֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/005.yaml
  text: Then I said to the king[a], "If it pleases the king, and if your servant has found favor before you, that you would send me to Judah, to the city of my fathers' graves[c][b], so that I may rebuild it."
translation:
  language: de
  text: 'Da sagte ich zum König: »Wenn es dem König gefällt und wenn dein Diener bei dir Wohlwollen gefunden hat, dann sende mich nach Juda, in die Stadt, in der meine Vorfahren begraben sind,[a] damit ich sie wieder aufbaue.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in die Stadt der Gräber meiner Väter«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb bedeutet wörtlich »bauen«; »wieder aufbauen« verdeutlicht, dass die Stadt in Trümmern lag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Da sagte ich
  rationale: Das narrative Waw führt die Handlung weiter; »Da sagte ich« gibt die zeitliche Folge im modernen Deutschen natürlich wieder.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Wenn es dem König gefällt
  rationale: Die höfische Wendung bezeichnet die Zustimmung beziehungsweise das Gefallen des Königs und wahrt den ehrerbietigen Ton.
- source_word: וְאִם יִיטַב עַבְדְּךָ לְפָנֶיךָ
  choice: und wenn dein Diener dein Wohlwollen gefunden hat
  rationale: Die idiomatische Formulierung drückt aus, dass Nehemia beim König in günstigem Ansehen steht.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: In der Anrede an den König ist dies eine konventionelle demütige Selbstbezeichnung; »Sklave« wäre hier im Deutschen sozial und stilistisch irreführend.
- source_word: תִּשְׁלָחֵנִי
  choice: dann sende mich
  rationale: Der hebräische Satz formuliert höflich den Inhalt der Bitte. »Sende mich« bewahrt die direkte Bitte und den gehobenen höfischen Ton.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: אֶל־עִיר קִבְרוֹת אֲבֹתַי
  choice: in die Stadt, in der meine Vorfahren begraben sind
  rationale: Die wörtliche Konstruktionsverbindung lautet »in die Stadt der Gräber meiner Väter«. Die gewählte Fassung ist natürliches Deutsch und macht deutlich, dass אבות die Vorfahren bezeichnet.
- source_word: וְאֶבְנֶנָּה
  choice: damit ich sie wieder aufbaue
  rationale: Der Kohortativ bezeichnet hier das Ziel der erbetenen Sendung. Das feminine Suffix bezieht sich auf die Stadt. Der Kontext ihrer Zerstörung rechtfertigt »wieder aufbaue«, während der Grundstamm nur »bauen« bedeutet.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit höfischem Ton. Die wiederholte Königsanrede und Nehemias Selbstbezeichnung als »dein Diener« bleiben erhalten. Die verschachtelte hebräische Bitte wird für natürliches Deutsch leicht gegliedert, ohne ihren Inhalt zu verändern.
