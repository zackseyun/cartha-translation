  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Szenerie, die Fragen nach Dauer und Rückkehr sowie die Zeitangabe grundsätzlich treffend wieder. In der Schlusssequenz wird וַיִּשְׁלָחֵנִי jedoch abgeschwächt: Der Text sagt, dass der König Nehemia sandte, nicht nur, dass er bereit war, ihn gehen zu lassen.'
  naturalness: Die Formulierung ist modernes, gut verständliches Standarddeutsch. »Der König war also bereit, mich gehen zu lassen« klingt natürlich, ist aber wegen der semantischen Abschwächung nicht vorzuziehen. »Der König gefiel es, mich zu senden« wäre unidiomatisch; die Verbindung von Zustimmung und Sendung lässt sich natürlich mit »Es gefiel dem König, mich zu senden« wiedergeben.
  terminology: »Königin« ist als Haupttextwiedergabe von הַשֵּׁגַל vertretbar, wenn die spezifischere Bedeutung in der Fußnote kenntlich bleibt. »Gefährtin des Königs« ist dafür zu unspezifisch und kann einen nicht-königlichen bzw. nicht-ehelichen Eindruck erwecken. »Königliche Gemahlin« bzw. »Königsgemahlin« trifft die lexikalische Nuance genauer.
  issues:
