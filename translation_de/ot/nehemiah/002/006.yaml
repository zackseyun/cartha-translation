base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/006.yaml
  text: Then the king said to me[a], while the queen was sitting beside him, “How long will your journey be, and when will you return?” So it pleased the king to send me, and I gave him a time.
translation:
  language: de
  text: 'Da sagte der König zu mir, während die Königin[a] neben ihm saß: »Wie lange wird deine Reise dauern, und wann wirst du zurückkehren?« Es gefiel dem König, mich zu senden, und ich nannte ihm eine Frist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die königliche Gemahlin« oder »die Königsgemahlin«. Das hebräische Wort bezeichnet die königliche Gemahlin des Königs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Die übliche und kontextgemäße Wiedergabe von מֶלֶךְ als königlicher Herrscher.
- source_word: הַשֵּׁגַל
  choice: die Königin
  rationale: שֵׁגַל bezeichnet hier die königliche Gemahlin beziehungsweise Gefährtin. »Königin« ist im Deutschen die natürlichste Bezeichnung; die engere Bedeutungsnuance wird in einer Fußnote bewahrt.
- source_word: יוֹשֶׁבֶת אֶצְלוֹ
  choice: während … neben ihm saß
  rationale: Das Partizip mit der Präpositionalverbindung liefert eine begleitende Situationsangabe und bezeichnet sowohl Haltung als auch räumliche Nähe.
- source_word: עַד מָתַי יִהְיֶה מַהֲלָכֲךָ
  choice: Wie lange wird deine Reise dauern
  rationale: Die idiomatische deutsche Frage gibt die erfragte Dauer der Reise klar wieder; »dauern« macht den im Hebräischen durch עַד מָתַי ausgedrückten zeitlichen Sinn natürlich.
- source_word: וּמָתַי תָּשׁוּב
  choice: und wann wirst du zurückkehren
  rationale: שׁוּב bedeutet hier »zurückkehren« und passt zum würdevollen Erzählregister.
- source_word: וַיִּיטַב לִפְנֵי הַמֶּלֶךְ וַיִּשְׁלָחֵנִי
  choice: Der König war also bereit, mich gehen zu lassen
  rationale: Die hebräische Wendung besagt, dass der König Nehemias Entsendung billigte. Die Formulierung verbindet Zustimmung und Erlaubnis natürlich, ohne eine bereits vollständig vollzogene Abreise vorwegzunehmen.
- source_word: וָאֶתְּנָה לוֹ זְמָן
  choice: und ich nannte ihm einen Zeitraum
  rationale: זְמָן bezeichnet eine festgelegte Zeit oder Frist. »Einen Zeitraum nennen« ist im Deutschen idiomatischer als die wörtliche Wendung »eine Zeit geben« und wahrt, dass der Text keine genaue Dauer nennt.
