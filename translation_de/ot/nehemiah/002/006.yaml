    rationale: 'וַיִּיטַב לִפְנֵי הַמֶּלֶךְ bezeichnet die Zustimmung des Königs; וַיִּשְׁלָחֵנִי fügt die Handlung hinzu: Er sandte Nehemia. Die Übersetzung soll beides ausdrücken.'
  - severity: low
    issue: Die Fußnote nennt »Gefährtin des Königs« als Alternative.
    rationale: Diese Bezeichnung ist weiter und weniger präzise als die Bedeutung einer königlichen Gemahlin/Königsgemahlin und sollte nicht als gleichwertige lexikalische Alternative angeboten werden.
