base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/013.yaml
  text: So I went out by night through the Valley Gate[a], toward the Dragon Spring and toward the Dung Gate[b], and I inspected the walls of Jerusalem that had been broken down and its gates that had been consumed by fire.
translation:
  language: de
  text: So zog ich nachts durch das Taltor hinaus, in Richtung der Drachenquelle[a] und des Misttors. Dabei untersuchte ich[b] die Mauern Jerusalems, die durchbrochen waren, und seine Tore, die vom Feuer verzehrt worden waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Schlangenquelle“; das hebräische Wort tannin kann einen Drachen, eine Schlange oder ein ähnliches Wesen bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung ist schwierig; sie enthält ein Verb mit der Grundbedeutung „zerbrechen“. Im Zusammenhang wird sie gewöhnlich als genaue Besichtigung der beschädigten Mauern verstanden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵצְאָה
  choice: So zog ich … hinaus
  rationale: Das Wayyiqtol der ersten Person Singular führt die Erzählfolge fort; „so“ und das trennbare Verb „hinausziehen“ ergeben einen natürlichen deutschen Erzählstil.
- source_word: בְשַׁעַר הַגַּיא
  choice: durch das Taltor
  rationale: Bei einer Bewegung bezeichnet ב hier den Durchgang durch das Tor; גיא bedeutet Tal oder Schlucht und bildet einen topografischen Torknamen.
- source_word: לַיְלָה
  choice: nachts
  rationale: Der Ausdruck wird adverbial gebraucht; „nachts“ ist knapp, modern und sinngenau.
- source_word: וְאֶל פְּנֵי עֵין הַתַּנִּין
  choice: in Richtung der Drachenquelle
  rationale: עין bezeichnet hier eine Quelle. אל־פני beschreibt im Zusammenhang die Wegstrecke beziehungsweise Richtung. „Drachenquelle“ bewahrt den naheliegenden Wortsinn von תנין, ohne die mögliche Referenz abschließend festzulegen.
- source_word: שַׁעַר הָאַשְׁפֹּת
  choice: Misttor
  rationale: אשפת bezeichnet Mist oder Abfall; „Misttor“ ist als Eigenname verständlich und in deutschen Bibelübersetzungen etabliert.
- source_word: וָאֱהִי שֹׂבֵר
  choice: Dabei untersuchte ich
  rationale: Die schwierige Verbindung aus היה und dem Partizip von שבר kann in diesem Kontext kaum das Zerbrechen der Mauern durch Nehemia meinen. Die nächtliche Erkundung legt „untersuchen“ nahe; „dabei“ gibt den begleitenden Verlauf natürlich wieder.
- source_word: בְחוֹמֹת יְרוּשָׁלַםִ
  choice: die Mauern Jerusalems
  rationale: Im Kontext fungiert die Präpositionalverbindung als Gegenstand der Untersuchung; die deutsche Genitivverbindung ist natürlich.
- source_word: אֲשֶׁר הַמְפֹרָצִים
  choice: die niedergerissen waren
  rationale: Das passive Partizip von פרץ bezeichnet aufgebrochene beziehungsweise eingerissene Mauern; „niedergerissen“ ist anschaulich und verständlich.
- source_word: וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ
  choice: und seine Tore, die vom Feuer verzehrt worden waren
  rationale: Das passive אכל mit Feuer bedeutet wörtlich und bildkräftig „vom Feuer verzehrt“; das Plusquamperfekt markiert den bereits eingetretenen Zustand.
