  text: וַ/יֹּאמֶר֩ לִ֨/י הַ/מֶּ֜לֶךְ מַדּ֣וּעַ פָּנֶ֣י/ךָ רָעִ֗ים וְ/אַתָּה֙ אֵֽינְ/ךָ֣ חוֹלֶ֔ה אֵ֣ין זֶ֔ה כִּי אִ֖ם רֹ֣עַֽ לֵ֑ב וָ/אִירָ֖א הַרְבֵּ֥ה מְאֹֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/002.yaml
  text: And the king said to me[a], “Why is your face sad[b], though you are not sick? This is nothing but sadness of heart.” Then I was very much afraid.
translation:
  language: de
  text: 'Da sagte der König zu mir: »Warum siehst du so traurig aus[a], obwohl du nicht krank bist? Das kann nur Kummer im Herzen sein[b].« Da fürchtete ich mich überaus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Warum ist dein Gesicht schlecht?« Gemeint ist ein trauriger oder bekümmerter Gesichtsausdruck.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Betrübnis des Herzens« oder »Bedrückung des Herzens«; wörtlich steht hier »Schlechtigkeit/Böses des Herzens«, womit in diesem Zusammenhang innere Not und nicht moralische Bosheit gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Die übliche und natürliche deutsche Frage nach dem Grund.
- source_word: פָּנֶיךָ רָעִים
  choice: siehst du so traurig aus
  rationale: Wörtlich ist das Gesicht »schlecht«; gemeint ist idiomatisch ein trauriger oder bekümmerter Gesichtsausdruck.
- source_word: חוֹלֶה
  choice: krank
  rationale: Direkte und allgemein verständliche Wiedergabe des körperlichen Krankseins.
- source_word: אֵין זֶה כִּי אִם
  choice: Das kann nur … sein
  rationale: Bewahrt den ausschließenden Charakter der hebräischen Wendung und klingt im Deutschen natürlich.
- source_word: רֹעַ לֵב
  choice: Kummer im Herzen
  rationale: Der Zusammenhang stellt körperlicher Krankheit eine innere Bedrückung gegenüber; »Kummer« vermeidet hier die irreführende moralische Bedeutung von »Böses«.
- source_word: וָאִירָא
  choice: Da fürchtete ich mich
  rationale: Führt die Erzählung als unmittelbare Reaktion Nehemias weiter.
- source_word: הַרְבֵּה מְאֹד
  choice: überaus
  rationale: Gibt die gehäufte Verstärkung prägnant und in würdigem modernem Deutsch wieder.
