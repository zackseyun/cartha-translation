id: NEH.2.1
reference: Nehemiah 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֣י בְּ/חֹ֣דֶשׁ נִיסָ֗ן שְׁנַ֥ת עֶשְׂרִ֛ים לְ/אַרְתַּחְשַׁ֥סְתְּא הַ/מֶּ֖לֶךְ יַ֣יִן לְ/פָנָ֑י/ו וָ/אֶשָּׂ֤א אֶת הַ/יַּ֨יִן֙ וָ/אֶתְּנָ֣/ה לַ/מֶּ֔לֶךְ וְ/לֹא הָיִ֥יתִי רַ֖ע לְ/פָנָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/001.yaml
  text: And it happened in the month of Nisan[a], in the twentieth year of King Artaxerxes, when wine was before him, that I took up the wine and gave it to the king. Now I had not been sad in his presence.
translation:
  language: de
  text: 'Im Monat Nisan, im zwanzigsten Jahr des Königs Artaxerxes, geschah es, als Wein vor ihm stand: Ich nahm den Wein und reichte ihn dem König. Zuvor war ich in seiner Gegenwart nicht niedergeschlagen gewesen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ich war vor ihm nicht schlecht gewesen.“ Das hebräische Wort für „schlecht“ bezeichnet hier offenbar ein niedergeschlagenes oder missmutiges Auftreten in der Gegenwart des Königs.'
    reason: Die wörtliche Bedeutung von רַע und seine kontextbedingte idiomatische Wiedergabe sollen transparent bleiben.
lexical_decisions:
- source_word: וַיְהִי
  choice: geschah es
  rationale: Gibt die hebräische narrative Einleitungsformel natürlich und ohne altertümliche Wendung wieder.
- source_word: בְּחֹדֶשׁ נִיסָן
  choice: im Monat Nisan
  rationale: Bewahrt die förmliche Datumsangabe und gibt den Monatsnamen als Eigennamen wieder.
- source_word: שְׁנַת עֶשְׂרִים לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: im zwanzigsten Jahr des Königs Artaxerxes
  rationale: Gibt die Regierungsjahresangabe quellennah und in natürlichem Deutsch wieder, ohne das im Hebräischen nicht ausdrücklich stehende Wort „Regierungsjahr“ einzufügen.
- source_word: יַיִן לְפָנָיו
  choice: als Wein vor ihm stand
  rationale: Die verblosen hebräischen Worte setzen die Szene am königlichen Hof; „vor ihm stand“ wahrt das konkrete Bild, ohne einen nicht genannten Becher einzuführen.
- source_word: וָאֶשָּׂא אֶת־הַיַּיִן
  choice: Ich nahm den Wein
  rationale: נשא bezeichnet hier das Aufnehmen des Weins zum Dienst; „nahm“ klingt natürlich und vermeidet die Ergänzung „Becher“, die nicht im Ausgangstext steht.
- source_word: וָאֶתְּנָה לַמֶּלֶךְ
  choice: und reichte ihn dem König
  rationale: „Reichte“ gibt נתן im höfischen Bedienungskontext idiomatisch wieder; das Pronomen nimmt den zuvor genannten Wein auf.
- source_word: וְלֹא הָיִיתִי רַע לְפָנָיו
  choice: Zuvor war ich in seiner Gegenwart nicht niedergeschlagen gewesen
  rationale: רַע bedeutet wörtlich „schlecht/böse“, bezeichnet hier aber im Zusammenhang mit dem Auftreten vor dem König ein sichtbar bedrücktes oder missmutiges Erscheinungsbild. Das Plusquamperfekt bildet den Rückbezug der Aussage ab, ohne „nie“ über den Wortlaut hinaus zu verstärken.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfische Szene bleibt erkennbar, ohne nicht ausdrücklich genannte Einzelheiten wie einen Becher oder das Trinken zu ergänzen. Die ungewöhnliche Formulierung „Wein vor ihm stand“ bewahrt bewusst etwas von der konkreten Ausdrucksweise des Hebräischen.
