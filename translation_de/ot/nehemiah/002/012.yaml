base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/012.yaml
  text: So I arose in the night[a], I and a few men with me, and I had not told anyone what my God was putting into my heart to do for Jerusalem[c][b]. And there was no animal with me except the animal on which I was riding.
translation:
  language: de
  text: Da stand ich nachts auf, zusammen mit wenigen Männern. Ich hatte niemandem gesagt, was mein Gott mir ins Herz gab, für Jerusalem zu tun.[a] Kein Tier hatte ich bei mir außer dem, auf dem ich ritt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „was mein Gott mir ins Herz legte“ oder „was mein Gott mir weiterhin ins Herz gab“. Die hebräische Form kann einen andauernden oder anschaulich vergegenwärtigten Vorgang bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָקוּם לַיְלָה
  choice: Da stand ich in der Nacht auf
  rationale: Das narrative Wayyiqtol wird mit „Da“ fortführend wiedergegeben; „in der Nacht“ bezeichnet den Zeitpunkt, und „stand ... auf“ entspricht קום in natürlichem, würdigem Deutsch.
- source_word: אֲנִי וַאֲנָשִׁים מְעַט עִמִּי
  choice: und einige wenige Männer waren bei mir
  rationale: Die kleine männliche Begleitgruppe bleibt ausdrücklich genannt. Das selbstständige אֲנִי ist im deutschen Verb bereits enthalten; eine zusätzliche Wiedergabe als „ich“ wäre schwerfällig.
- source_word: וְלֹא הִגַּדְתִּי לְאָדָם
  choice: Ich hatte niemandem gesagt
  rationale: Das indefinite לְאָדָם bedeutet hier idiomatisch „niemandem“. Das Plusquamperfekt macht verständlich, dass Nehemia den Plan bis zu diesem Zeitpunkt nicht mitgeteilt hatte.
- source_word: מָה אֱלֹהַי נֹתֵן אֶל לִבִּי
  choice: was mein Gott mir ins Herz gab
  rationale: Die Wendung bewahrt das hebräische Herzbild und schreibt Gott die Initiative zu, ohne daraus ausdrücklich eine verbale Offenbarung zu machen. Der deutsche Erzählzusammenhang erlaubt „gab“, während die Fußnote die aspektuelle Offenheit des Partizips nennt.
- source_word: לַעֲשׂוֹת לִירוּשָׁלִָם
  choice: für Jerusalem zu tun
  rationale: Die offene Formulierung des Hebräischen bleibt erhalten; weder Wiederaufbau noch eine andere konkrete Maßnahme wird vorweggenommen.
- source_word: וּבְהֵמָה אֵין עִמִּי
  choice: Auch hatte ich kein Tier bei mir
  rationale: בְּהֵמָה ist eine allgemeine Bezeichnung für ein Tier, hier offenbar ein Reittier. „Tier“ ist modern und neutral.
- source_word: כִּי אִם הַבְּהֵמָה אֲשֶׁר אֲנִי רֹכֵב בָּהּ
  choice: außer dem Tier, auf dem ich ritt
  rationale: כִּי אִם führt die Ausnahme ein. Die Relativkonstruktion wird natürlich und ohne unnötige Bestimmung der Tierart wiedergegeben.
theological_decisions:
- issue: Göttliche Eingebung und Nehemias eigener Entschluss
  choice: „was mein Gott mir ins Herz gab“
  alternative: „was mein Gott mir ins Herz gelegt hatte“ oder „wozu mein Gott mich innerlich bewegte“
  rationale: Die Übersetzung bewahrt Gottes Initiative und zugleich die menschliche Planung, ohne die Wendung zu einer ausdrücklichen Offenbarungsformel auszubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Das traditionelle Herzbild bleibt erhalten; unnötig altertümliche Wörter wie „Vieh“ oder „Getier“ werden vermieden.
