  text: וַ/יִּשְׁמַע֩ סַנְבַלַּ֨ט הַ/חֹרֹנִ֜י וְ/טֹבִיָּ֣ה הָ/עֶ֣בֶד הָֽ/עַמּוֹנִ֗י וְ/גֶ֨שֶׁם֙ הָֽ/עַרְבִ֔י וַ/יַּלְעִ֣גוּ לָ֔/נוּ וַ/יִּבְז֖וּ עָלֵ֑י/נוּ וַ/יֹּאמְר֗וּ מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ אֲשֶׁ֣ר אַתֶּ֣ם עֹשִׂ֔ים הַ/עַ֥ל הַ/מֶּ֖לֶךְ אַתֶּ֥ם מֹרְדִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/019.yaml
  text: But when Sanballat the Horonite[a], Tobiah the Ammonite servant, and Geshem the Arab heard, they mocked us and despised us, and said, “What is this thing that you are doing? Are you rebelling against the king?”
translation:
  language: de
  text: 'Als aber Sanballat, der Horoniter, Tobija, der ammonitische Diener,[a] und Geschem, der Araber, davon hörten, verspotteten und verachteten sie uns. Sie sagten: »Was tut ihr da? Lehnt ihr euch gegen den König auf?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der ammonitische Knecht« beziehungsweise »der ammonitische Sklave«; möglicherweise ist »Diener« hier eine Amtsbezeichnung.'
    reason: Die Bedeutung und Funktion von הָעֶבֶד in Tobijas Bezeichnung ist nicht eindeutig.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Als aber ... davon hörten
  rationale: Die Erzählfolge und der Gegensatz zum vorherigen Fortschritt werden im Deutschen natürlich durch „Als aber“ wiedergegeben; das sinngemäß ergänzte „davon“ verweist auf das zuvor berichtete Vorhaben.
- source_word: הַחֹרֹנִי
  choice: der Horoniter
  rationale: Die Herkunftsbezeichnung bleibt als im Deutschen verständliche Gentilform erhalten, ohne einen bestimmten Ort namens Horon festzulegen.
- source_word: הָעֶבֶד הָעַמּוֹנִי
  choice: der ammonitische Diener
  rationale: עֶבֶד kann Diener, Knecht oder Sklave bezeichnen. In dieser namensbegleitenden Bezeichnung ist „Diener“ natürlich und lässt einen amtlichen oder abhängigen Status offen; die Mehrdeutigkeit wird in der Fußnote kenntlich gemacht.
- source_word: הָעַרְבִי
  choice: der Araber
  rationale: Die ethnische beziehungsweise regionale Herkunftsbezeichnung wird direkt und idiomatisch wiedergegeben.
- source_word: וַיַּלְעִגוּ לָנוּ וַיִּבְזוּ עָלֵינוּ
  choice: verspotteten und verachteten sie uns
  rationale: Die beiden Verben bezeichnen höhnische Verspottung und geringschätzige Verachtung; die parallele Steigerung des Hebräischen bleibt erhalten.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר אַתֶּם עֹשִׂים
  choice: Was tut ihr da?
  rationale: Natürliches modernes Deutsch, das den vorwurfsvollen Sinn der wörtlichen Wendung „Was ist diese Sache, die ihr tut?“ prägnant wiedergibt.
- source_word: הַעַל הַמֶּלֶךְ אַתֶּם מֹרְדִים
  choice: Wollt ihr euch gegen den König auflehnen?
  rationale: Die Konstruktion wird als anklagende Frage verstanden. „Sich auflehnen“ gibt מרד idiomatisch wieder; „wollt ihr“ bringt den Vorwurf einer beabsichtigten Rebellion im Deutschen natürlich zum Ausdruck, ohne ihn als Tatsachenbehauptung festzulegen.
theological_decisions:
- issue: Statusbezeichnung עֶבֶד bei Tobija
  choice: Diener
  alternative: Knecht; Sklave; möglicherweise Amtsträger
  rationale: Der Kontext entscheidet nicht eindeutig, ob persönliche Abhängigkeit, versklavter Status oder eine amtliche Bezeichnung gemeint ist. Daher steht im Haupttext die breite, natürliche Wiedergabe „Diener“, während die Fußnote die stärkere soziale Bedeutung und die mögliche Titelfunktion offenhält.
- issue: Form der Anklage gegen Nehemias Gruppe
  choice: anklagende Frage
  alternative: 'rhetorische Tatsachenbehauptung: „Ihr lehnt euch gegen den König auf!“'
  rationale: Das hebräische Frageelement הֲ spricht für eine Frage, deren Ton zugleich deutlich beschuldigend ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist bewusst natürlich und anklagend formuliert; Herkunftsbezeichnungen und die doppelte Beschreibung der feindseligen Reaktion bleiben eng am Hebräischen.
