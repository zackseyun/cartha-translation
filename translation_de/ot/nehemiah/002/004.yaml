  text: Then the king said to me, “What is it that you are seeking?” So I prayed to the God of heaven.
translation:
  language: de
  text: 'Da sagte der König zu mir: »Worum bittest du?« Da betete ich zum Gott des Himmels.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל מַה זֶּה אַתָּה מְבַקֵּשׁ
  choice: Worum bittest du?
  rationale: Die idiomatische Frage gibt die hebräische Wendung knapp und natürlich wieder. מְבַקֵּשׁ kann je nach Zusammenhang »suchen«, »erbitten« oder »verlangen« bedeuten; die Frage des Königs zielt hier auf Nehemias Anliegen bzw. Bitte.
- source_word: וָאֶתְפַּלֵּל
  choice: Da betete ich
  rationale: Die Verbform bezeichnet Nehemias unmittelbar anschließendes Gebet; »da« wahrt den knappen erzählerischen Fortgang.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: Gott des Himmels
  rationale: Entspricht der hebräischen Titelformel direkt und in idiomatischem Deutsch.
theological_decisions:
- issue: Art und Dauer des Gebets
  choice: Die knappe Aussage »Da betete ich« bleibt ohne nähere Ausgestaltung.
  alternative: »Da schickte ich ein Stoßgebet zum Gott des Himmels.«
  rationale: Der unmittelbare Erzählzusammenhang legt ein kurzes inneres Gebet nahe, doch der hebräische Text nennt weder ausdrücklich dessen Dauer noch verwendet er einen besonderen Ausdruck für »Stoßgebet«.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist knapp und natürlich; der Parallelismus der beiden aufeinanderfolgenden Handlungen bleibt erhalten.
