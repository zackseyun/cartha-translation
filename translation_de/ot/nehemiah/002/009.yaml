source:
  edition: WLC
  text: וָֽ/אָב֗וֹא אֶֽל פַּֽחֲווֹת֙ עֵ֣בֶר הַ/נָּהָ֔ר וָ/אֶתְּנָ֣/ה לָ/הֶ֔ם אֵ֖ת אִגְּר֣וֹת הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֤ח עִמִּ/י֙ הַ/מֶּ֔לֶךְ שָׂ֥רֵי חַ֖יִל וּ/פָרָשִֽׁים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/009.yaml
  text: So I came to the governors Beyond the River and gave them the king’s letters[b][a]. Now the king had sent with me army officers and horsemen.
translation:
  language: de
  text: So kam ich zu den Statthaltern jenseits des Stroms[a] und übergab ihnen die Briefe des Königs. Der König hatte mir Heerführer und Reiter mitgegeben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jenseits des Stroms“ war die persische Bezeichnung für das Verwaltungsgebiet westlich des Euphrat, auch Trans-Euphrat genannt.
    reason: cultural_note
  - marker: b
    text: 'Oder: „militärische Befehlshaber und Kavallerie“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחֲווֹת
  choice: Statthalter
  rationale: Bezeichnet persische Amtsträger, die Verwaltungsbezirke regierten. „Statthalter“ ist historisch passend und im modernen Deutsch verständlich.
- source_word: עֵבֶר הַנָּהָר
  choice: jenseits des Stroms
  rationale: Die Wendung ist die persische Gebietsbezeichnung für das Gebiet westlich des Euphrat. Die wörtlich-nahe Form bewahrt den titelartigen Ausdruck, während eine Fußnote den historischen Bezug erklärt.
- source_word: אִגְּרוֹת
  choice: Briefe
  rationale: Das Wort bezeichnet schriftliche Mitteilungen; hier handelt es sich um königliche Schreiben mit amtlicher Vollmacht.
- source_word: שָׂרֵי חַיִל
  choice: Heerführer
  rationale: Die Verbindung bezeichnet militärische Befehlshaber. „Heerführer“ gibt sowohl die militärische Funktion als auch den Führungsrang knapp wieder.
- source_word: פָרָשִׁים
  choice: Reiter
  rationale: Bezeichnet berittene Männer. „Reiter“ bleibt näher am Hebräischen als das kollektivere „Kavallerie“.
- source_word: וַיִּשְׁלַח עִמִּי הַמֶּלֶךְ
  choice: Der König hatte mir … mitgegeben
  rationale: Das Plusquamperfekt stellt die Entsendung des Begleitschutzes als vorausgehenden Hintergrund der Ankunft dar; „mitgegeben“ ist im Deutschen natürlicher als eine wörtliche Wiedergabe mit „gesandt“.
- source_word: וָאָבוֹא
  choice: So kam ich
  rationale: „So“ führt die fortlaufende Erzählung natürlich weiter und wahrt den Folgezusammenhang.
