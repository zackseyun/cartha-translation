  text: וָ/אֱהִ֨י עֹלֶ֤ה בַ/נַּ֨חַל֙ לַ֔יְלָה וָ/אֱהִ֥י שֹׂבֵ֖ר בַּ/חוֹמָ֑ה וָ/אָשׁ֗וּב וָ/אָב֛וֹא בְּ/שַׁ֥עַר הַ/גַּ֖יְא וָ/אָשֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/015.yaml
  text: So I went up by the wadi at night and inspected the wall[a]. Then I turned back and entered by the Valley Gate[b], and returned.
translation:
  language: de
  text: So zog ich nachts durch das Wadi hinauf[a] und untersuchte die Mauer.[b] Dann kehrte ich um, kam durch das Taltor hinein und kehrte zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Wadi ist ein Trockental oder ein saisonal wasserführender Wasserlauf.
    reason: cultural_note
  - marker: b
    text: Das hier verwendete hebräische Verb bedeutet gewöhnlich „brechen“. In diesem Zusammenhang wird es meist im Sinn von „untersuchen“, „prüfen“ oder „begutachten“ verstanden.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלֶה
  choice: zog … hinauf
  rationale: Die Konstruktion mit היה beschreibt die Bewegung im Verlauf der nächtlichen Erkundung; „zog hinauf“ ist natürlich und bewahrt die Richtung von עלה.
- source_word: בַנַּחַל
  choice: am Wadi
  rationale: נחל bezeichnet hier am ehesten eine Schlucht beziehungsweise ein zeitweise wasserführendes Tal. „Am Wadi“ wahrt die topografische Bedeutung, ohne den genauen Verlauf der Route zu überbestimmen.
- source_word: לַיְלָה
  choice: nachts
  rationale: Eine knappe, natürliche Wiedergabe der Zeitangabe im modernen Deutschen.
- source_word: שֹׂבֵר
  choice: untersuchte
  rationale: שׂבר bedeutet gewöhnlich „brechen“. Im Zusammenhang der Besichtigung der beschädigten Mauer wird die Form jedoch weithin als kontextuell ungewöhnlicher Ausdruck für ein prüfendes Untersuchen verstanden; die Schwierigkeit wird in der Fußnote offengelegt.
- source_word: בַּחוֹמָה
  choice: die Mauer
  rationale: Der bestimmte Singular des Hebräischen bleibt erhalten; gemeint ist die Stadtmauer Jerusalems.
- source_word: וָאָשׁוּב
  choice: kehrte ich um
  rationale: Beim ersten Vorkommen bezeichnet שוב plausibel die Umkehr beziehungsweise Richtungsänderung auf der Route.
- source_word: וָאָבֹוא בְּשַׁעַר הַגַּיְא
  choice: kam durch das Taltor wieder hinein
  rationale: בוא bezeichnet das Hineinkommen durch das benannte Stadttor. „Taltor“ gibt שער הגיא transparent und eingebürgert wieder; „durch“ macht die Bewegung durch das Tor im Deutschen deutlich.
- source_word: וָאָשׁוּב
  choice: kehrte zurück
  rationale: Das abschließende שוב fasst die Rückkehr nach der Erkundung zusammen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. „Wadi“ bewahrt die spezifische Landschaftsform besser als das allgemeinere „Tal“ oder „Bach“. Die Wiederholung von „kehrte“ spiegelt die zweimalige Verwendung von שוב; „wieder hinein“ verdeutlicht den Routenverlauf, ohne eine zusätzliche Handlung einzuführen.
