source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע סַנְבַלַּ֣ט הַ/חֹרֹנִ֗י וְ/טֽוֹבִיָּה֙ הָ/עֶ֣בֶד הָֽ/עַמֹּנִ֔י וַ/יֵּ֥רַע לָ/הֶ֖ם רָעָ֣ה גְדֹלָ֑ה אֲשֶׁר בָּ֥א אָדָ֔ם לְ/בַקֵּ֥שׁ טוֹבָ֖ה לִ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/010.yaml
  text: When Sanballat the Horonite and Tobiah the Ammonite servant heard this[b][a], it was very displeasing to them that a man had come to seek the welfare of the children of Israel.
translation:
  language: de
  text: Als Sanballat, der Horoniter, und Tobija, der ammonitische Diener[a], davon hörten, missfiel es ihnen sehr[b], dass ein Mann gekommen war, um sich um das Wohl der Israeliten zu bemühen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der ammonitische Sklave“ beziehungsweise „Knecht“. Das hebräische Wort bezeichnet einen Menschen in einem Dienst- oder Abhängigkeitsverhältnis; dessen genaue rechtliche Stellung wird hier nicht erklärt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „da war ihnen etwas sehr Schlimmes“; im Hebräischen wird die Wortgruppe für „schlecht/böse“ zur Verstärkung wiederholt.'
    reason: source_wordplay
  - marker: c
    text: 'Wörtlicher: „das Gute für die Söhne Israels zu suchen“.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: davon hörten
  rationale: Das Verb bedeutet „hören“. „Davon“ nimmt im Deutschen natürlich auf Nehemias Ankunft und Auftrag aus dem vorhergehenden Vers Bezug.
- source_word: הַחֹרֹנִי
  choice: der Horoniter
  rationale: Die Herkunftsbezeichnung wird in ihrer üblichen substantivischen Form wiedergegeben, ohne einen bestimmten Ort namens Horon festzulegen.
- source_word: הָעֶבֶד הָעַמֹּנִי
  choice: der ammonitische Diener
  rationale: עֶבֶד kann einen Sklaven, Knecht oder Diener bezeichnen. „Diener“ wahrt hier die soziale Funktionsbezeichnung, ohne einen rechtlichen Status zu behaupten, den der Vers nicht näher erläutert; die engere Alternative wird in einer Fußnote genannt.
- source_word: וַיֵּרַע לָהֶם רָעָה גְדֹלָה
  choice: missfiel es ihnen sehr
  rationale: Die idiomatische deutsche Formulierung gibt die starke negative Reaktion wieder. Die betonte Wiederholung der hebräischen Wortgruppe für „schlecht/böse“ wird in einer Fußnote sichtbar gemacht.
- source_word: אָדָם
  choice: ein Mann
  rationale: Das maskuline Singularwort bezeichnet hier konkret Nehemia als einzelnen Mann; die geschlechtliche Referenz bleibt erhalten.
- source_word: לְבַקֵּשׁ טוֹבָה
  choice: sich um das Wohl … zu bemühen
  rationale: Die Wendung bezeichnet das aktive Suchen oder Fördern dessen, was anderen zugutekommt. Diese Formulierung ist im modernen Deutschen natürlicher als „das Wohl suchen“.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: der Israeliten
  rationale: Die feste hebräische Volksbezeichnung „Söhne/Kinder Israels“ wird für heutige Leser idiomatisch als „Israeliten“ wiedergegeben.
theological_decisions:
- issue: Sozialer Status Tobijas in עֶבֶד
  choice: Diener
  alternative: Sklave; Knecht; Beamter
  rationale: Der Ausdruck kann Abhängigkeit oder Dienst bezeichnen, legt aber für sich allein Tobijas genaue rechtliche oder amtliche Stellung nicht eindeutig fest. Daher wird die Mehrdeutigkeit nicht durch „Sklave“ oder das interpretierende „Beamter“ verengt.
- issue: Wiedergabe von אָדָם
  choice: ein Mann
  alternative: jemand; ein Mensch
  rationale: Im Zusammenhang ist der einzelne, männliche Nehemia gemeint. „Ein Mann“ wahrt diese konkrete Referenz, ohne darüber hinaus eine theologische Aussage über den Menschen allgemein einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Herkunftsbezeichnungen und die konkrete männliche Referenz bleiben erhalten; schwerfällige hebräische Idiomatik wird natürlich wiedergegeben, während bedeutsame lexikalische Alternativen in den Fußnoten dokumentiert sind.
