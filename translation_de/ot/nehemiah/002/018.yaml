base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/018.yaml
  text: So I told them that the hand of my God was good upon me[a], and also the words of the king that he had spoken to me. And they said[c][b], “Let us rise up and build.” So they strengthened their hands for the good work.
translation:
  language: de
  text: 'Ich berichtete ihnen, wie die Hand meines Gottes mir wohlgesinnt war,[a] und auch, was der König zu mir gesagt hatte. Sie sagten: »Auf, lasst uns bauen!« Und sie stärkten ihre Hände für das Gute.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wie die Hand meines Gottes gut über/auf mir war«; auch: »wie die Hand meines Gottes mir günstig war«.'
    reason: Die hebräische Wendung verbindet die Hand-Metapher mit »gut« und der Präposition »über/auf«; sie bezeichnet hier Gottes günstiges bzw. hilfreiches Handeln.
  - marker: b
    text: 'Wörtlich: »Und sie stärkten ihre Hände zum Guten« beziehungsweise »für das Gute«.'
    reason: Das Hebräische nennt kein »Werk« ausdrücklich; die Formulierung bleibt daher offen, auch wenn der Kontext das Bauvorhaben betrifft.
lexical_decisions:
- source_word: וָאַגִּיד לָהֶם
  choice: Da erzählte ich ihnen
  rationale: Das Waw führt die Erzählung weiter. »Da« gibt den Fortgang natürlich wieder; »erzählte« passt zum Bericht Nehemias an die Verantwortlichen.
- source_word: יַד אֱלֹהַי
  choice: die Hand meines Gottes
  rationale: Die hebräische Metapher für Gottes wirksames Handeln und seine Gunst bleibt sichtbar.
- source_word: אֲשֶׁר הִיא טוֹבָה עָלַי
  choice: wie ... gütig über mir gewesen war
  rationale: »Gütig« gibt טוֹבָה in diesem Zusammenhang idiomatisch wieder, während »über mir« die ungewöhnliche räumliche Fassung des Hebräischen bewahrt. Das Plusquamperfekt markiert, dass Nehemia von vorausgegangenem Handeln Gottes berichtet.
- source_word: וְאַף דִּבְרֵי הַמֶּלֶךְ אֲשֶׁר אָמַר לִי
  choice: und berichtete ihnen auch, was der König zu mir gesagt hatte
  rationale: וְאַף fügt die königliche Zusage als zweiten Inhalt des Berichts hinzu. Die natürliche deutsche Wendung »was ... gesagt hatte« gibt דִּבְרֵי mit seinem Relativsatz sinngenau wieder.
- source_word: נָקוּם וּבָנִינוּ
  choice: Auf, lasst uns bauen!
  rationale: Die Formen drücken hier gemeinschaftliche Aufforderung und Entschlossenheit aus. »Auf« nimmt das Bild des Sich-Erhebens knapp und idiomatisch auf.
- source_word: וַיְחַזְּקוּ יְדֵיהֶם
  choice: Und sie stärkten ihre Hände
  rationale: Die konkrete hebräische Redewendung bleibt erhalten und verbindet sich zugleich mit der zuvor genannten Hand Gottes.
- source_word: לַטּוֹבָה
  choice: für das gute Werk
  rationale: Wörtlich steht »zum Guten« beziehungsweise »für das Gute«; im Kontext ist die gute Unternehmung des Wiederaufbaus gemeint. »Werk« macht diesen Bezug im Deutschen verständlich.
theological_decisions:
- issue: Gottes Hand als Ausdruck göttlichen Handelns
  choice: Die Metapher »die Hand meines Gottes« wird bewahrt.
  alternative: »Gottes Gunst war auf meiner Seite« oder »mein Gott war mir gnädig«
  rationale: Der Text stellt Gottes wirksames, gütiges Handeln neben die Worte des Königs. Die Beibehaltung der Hand-Metapher vermeidet eine Verengung auf bloßes Wohlwollen und erhält die theologische Bildsprache.
- issue: Deutung von לַטּוֹבָה
  choice: »für das gute Werk« mit erläuternder Fußnote
  alternative: »zum Guten« oder »für das Gute«
  rationale: Der unmittelbare Kontext legt den Wiederaufbau als das gemeinte gute Vorhaben nahe; da das Hebräische »Werk« jedoch nicht ausdrücklich nennt, wird die wörtlichere Möglichkeit in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markanten Hand-Metaphern des Hebräischen werden beibehalten; leicht erklärungsbedürftige Idiome und Ergänzungen werden durch Fußnoten transparent gemacht.
