- from: 'Da erzählte ich ihnen, wie die Hand meines Gottes gütig über mir gewesen war,[a] und berichtete ihnen auch, was der König zu mir gesagt hatte. Da sagten sie: »Auf, lasst uns bauen!« Und sie stärkten ihre Hände für das gute Werk.[b]'
