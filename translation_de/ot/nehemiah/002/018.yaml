  rationale: Die Revision verbessert die idiomatische deutsche Wiedergabe der hebräischen Wendung über Gottes Hand und entfernt mit »Werk« eine im Ausgangstext nicht ausdrücklich vorhandene Ergänzung. Die Hand-Metapher, die Aufforderung zum Bauen und das Bild vom Stärken der Hände bleiben erhalten.
