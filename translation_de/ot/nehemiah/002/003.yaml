source:
  edition: WLC
  text: וָ/אֹמַ֣ר לַ/מֶּ֔לֶךְ הַ/מֶּ֖לֶךְ לְ/עוֹלָ֣ם יִחְיֶ֑ה מַדּ֜וּעַ לֹא יֵרְע֣וּ פָנַ֗/י אֲשֶׁ֨ר הָ/עִ֜יר בֵּית קִבְר֤וֹת אֲבֹתַ/י֙ חֲרֵבָ֔ה וּ/שְׁעָרֶ֖י/הָ אֻכְּל֥וּ בָ/אֵֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/003.yaml
  text: I said to the king[a], “May the king live forever! Why should my face not be sad, when the city, the place of my fathers’ tombs, lies in ruins and its gates have been consumed by fire?”
translation:
  language: de
  text: 'Ich sagte zum König: »Der König lebe ewig! Warum sollte mein Gesicht nicht traurig aussehen, da doch die Stadt, die Stätte der Gräber meiner Vorfahren,[a] in Trümmern liegt und ihre Tore vom Feuer verzehrt worden sind?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Haus der Gräber meiner Väter«; gemeint ist die mit den Gräbern seiner Vorfahren verbundene Stätte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Ich sagte
  rationale: Das Wayyiqtol von אמר führt die Erzählung fort; im natürlichen deutschen Erzählstil genügt das Präteritum ohne ausdrücklich wiedergegebenes ו.
- source_word: לַמֶּלֶךְ / הַמֶּלֶךְ
  choice: zum König / Der König
  rationale: Die erste Form bezeichnet den Adressaten; die Wiederholung mit Artikel gehört zur ehrerbietigen höfischen Anrede und bleibt in der Wunschformel erhalten.
- source_word: לְעוֹלָם יִחְיֶה
  choice: Der König lebe ewig!
  rationale: Der deutsche Konjunktiv I gibt die traditionelle königliche Wunsch- und Huldigungsformel knapp und würdig wieder.
- source_word: מַדּוּעַ לֹא יֵרְעוּ פָנַי
  choice: Warum sollte mein Gesicht nicht traurig aussehen
  rationale: Die Formulierung bewahrt das hebräische Bild vom Gesicht, macht aber mit »traurig aussehen« deutlich, dass die sichtbare Miene gemeint ist.
- source_word: אֲשֶׁר
  choice: da doch
  rationale: Hier führt אֲשֶׁר den erklärenden Umstand beziehungsweise Grund für Nehemias traurige Miene ein; »da doch« bildet diesen Zusammenhang natürlich ab, ohne ihn unnötig zu verstärken.
- source_word: הָעִיר
  choice: die Stadt
  rationale: Der bestimmte Ausdruck verweist auf Jerusalem, nennt die Stadt hier jedoch nicht ausdrücklich; deshalb wird sie nicht ergänzend identifiziert.
- source_word: בֵּית קִבְרוֹת אֲבֹתַי
  choice: die Stätte der Gräber meiner Vorfahren
  rationale: Wörtlich steht »Haus der Gräber meiner Väter«. »Stätte« gibt בית in dieser Ortsbezeichnung verständlich wieder; »Vorfahren« vermittelt אבות im Zusammenhang mit den Familiengräbern geschlechtsübergreifend und idiomatisch.
- source_word: חֲרֵבָה
  choice: in Trümmern liegt
  rationale: Das prädikative Adjektiv bezeichnet den verwüsteten, zerstörten Zustand der Stadt; die deutsche Wendung ist anschaulich und natürlich.
- source_word: וּשְׁעָרֶיהָ
  choice: und ihre Tore
  rationale: Das Suffix bezieht sich eindeutig auf die Stadt; der Plural wird direkt wiedergegeben.
- source_word: אֻכְּלוּ בָאֵשׁ
  choice: vom Feuer verzehrt worden sind
  rationale: Das passive אכל zeichnet das Feuer als verzehrende Macht. Die Formulierung erhält dieses Bild und den resultierenden Zerstörungszustand.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfische Wunschformel bleibt gehoben, aber verständlich. Das hebräische Gesichtsidiom und das Bild des verzehrenden Feuers werden bewahrt; die ungewöhnliche Wendung »Haus der Gräber« wird im Text verständlich übertragen und in der Fußnote transparent gemacht.
