    issue: „denn“ anstelle von „gemäß/entsprechend“ bei כְּיַד
    rationale: Die Präposition כְּ leitet hier die Formel „gemäß der guten Hand meines Gottes über mir“ ein. Ein kausales „denn“ deutet den Zusammenhang stärker aus als der hebräische Wortlaut und weicht zudem von der eigenen Fußnote ab.
  - severity: low
    issue: „Baumgarten“ in Fußnote a
    rationale: „Obstgarten“ ist im modernen Standarddeutsch die geläufige Bezeichnung für die hier als Alternative gemeinte Bedeutung von פַּרְדֵּס.
