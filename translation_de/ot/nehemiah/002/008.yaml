source:
  edition: WLC
  text: וְ/אִגֶּ֡רֶת אֶל אָסָף֩ שֹׁמֵ֨ר הַ/פַּרְדֵּ֜ס אֲשֶׁ֣ר לַ/מֶּ֗לֶךְ אֲשֶׁ֣ר יִתֶּן לִ֣/י עֵצִ֡ים לְ֠/קָרוֹת אֶת שַׁעֲרֵ֨י הַ/בִּירָ֤ה אֲשֶׁר לַ/בַּ֨יִת֙ וּ/לְ/חוֹמַ֣ת הָ/עִ֔יר וְ/לַ/בַּ֖יִת אֲשֶׁר אָב֣וֹא אֵלָ֑י/ו וַ/יִּתֶּן לִ֣/י הַ/מֶּ֔לֶךְ כְּ/יַד אֱלֹהַ֖/י הַ/טּוֹבָ֥ה עָלָֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/008.yaml
  text: and a letter to Asaph[a], the keeper of the king’s forest, that he should give me timber to make beams for the gates of the fortress by the temple, and for the wall of the city, and for the house that I will occupy. And the king gave them to me[d][c][b], according to the good hand of my God upon me.
translation:
  language: de
  text: und einen Brief an Asaf, den Verwalter des königlichen Forstes[a], damit er mir Bauholz gibt, um die Tore der Burg beim Tempel[b] mit Balken zu versehen, sowie für die Stadtmauer und für das Haus, in das ich einziehen werde[c]. Der König gab es mir gemäß der guten Hand meines Gottes über mir[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „königlichen Parks“ beziehungsweise „königlichen Obstgartens“. Das hebräische Wort bezeichnet eine königliche, bewirtschaftete Anlage, hier offenbar mit nutzbarem Baumbestand.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „der Burg, die zum Haus gehört“. Mit „dem Haus“ ist hier wahrscheinlich der Tempel gemeint; die genaue Beziehung der Burg zum Tempel bleibt im Hebräischen offen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „für das Haus, in das ich kommen werde“. Gemeint ist wahrscheinlich Nehemias künftige Unterkunft.'
    reason: translation_clarity
  - marker: d
    text: 'Wörtlich: „gemäß der guten Hand meines Gottes über mir“. Das Bild bezeichnet Gottes günstiges, wirksames Handeln.'
    reason: cultural_note
lexical_decisions:
- source_word: אִגֶּרֶת
  choice: einen Brief
  rationale: Das Substantiv bezeichnet einen Brief beziehungsweise ein amtliches Schreiben. „Brief“ ist im Zusammenhang mit den königlichen Schreiben natürlich und präzise.
- source_word: שֹׁמֵר הַפַּרְדֵּס
  choice: den Verwalter des königlichen Forstes
  rationale: שֹׁמֵר bezeichnet hier den zuständigen Aufseher oder Verwalter. פַּרְדֵּס kann einen Park, eine Pflanzung oder ein bewirtschaftetes Waldgebiet bezeichnen; da Bauholz geliefert werden soll, passt „Forst“ im Kontext am besten.
- source_word: יִתֶּן לִי עֵצִים
  choice: damit er mir Bauholz gibt
  rationale: עֵצִים kann Bäume oder Holz bedeuten. Der Bauzusammenhang legt verarbeitetes beziehungsweise zur Verarbeitung bestimmtes Holz nahe, was „Bauholz“ knapp ausdrückt.
- source_word: לְקָרוֹת
  choice: mit Balken zu versehen
  rationale: Das Verb bezeichnet das Anbringen oder Legen von Balken und kann je nach Bauzusammenhang auch das Überdachen einschließen. Die Formulierung wahrt diesen konkreten baulichen Sinn, ohne ihn auf ein Dach zu verengen.
- source_word: שַׁעֲרֵי הַבִּירָה אֲשֶׁר לַבַּיִת
  choice: die Tore der Burg beim Tempel
  rationale: בִּירָה bezeichnet eine befestigte Anlage oder Burg. הַבַּיִת meint im Kontext wahrscheinlich den Tempel; die genaue Beziehung der Burg zu ihm bleibt im Hebräischen knapp und wird in einer Fußnote kenntlich gemacht.
- source_word: חוֹמַת הָעִיר
  choice: die Stadtmauer
  rationale: Die deutsche Zusammensetzung gibt die hebräische Genitivverbindung natürlich und vollständig wieder.
- source_word: הַבַּיִת אֲשֶׁר אָבוֹא אֵלָיו
  choice: das Haus, in das ich einziehen werde
  rationale: Wörtlich ist von dem Haus die Rede, in das Nehemia kommen beziehungsweise eintreten wird. Im Zusammenhang bezeichnet dies seine künftige Unterkunft; „einziehen“ ist natürlich, ohne einen dauerhaften Besitz zu behaupten.
- source_word: וַיִּתֶּן לִי הַמֶּלֶךְ
  choice: Der König gab es mir
  rationale: Im Hebräischen steht kein ausdrückliches Objekt. Das deutsche Pronomen nimmt knapp das zuvor Erbetene auf und vermeidet eine unnatürliche Ellipse.
- source_word: כְּיַד אֱלֹהַי הַטּוֹבָה עָלָי
  choice: denn die gute Hand meines Gottes war über mir
  rationale: Die Wiedergabe bewahrt das für Esra-Nehemia charakteristische Bild von Gottes guter Hand. „Denn“ bringt den in diesem Zusammenhang gemeinten Begründungszusammenhang in natürlichem Deutsch zum Ausdruck.
theological_decisions:
- issue: Gottes Vorsehung im Bild von seiner guten Hand
  choice: die gute Hand meines Gottes war über mir
  alternative: weil mein Gott mir gnädig half
  rationale: Das anthropomorphe Bild wird bewahrt, weil es Gottes wirksame, günstige Zuwendung ausdrückt und für Esra-Nehemia prägend ist. Die Übersetzung legt nicht näher fest, auf welche Weise dieses Handeln Gottes mit der Entscheidung des Königs zusammenwirkt.
- issue: Bezeichnung des Heiligtums als „Haus“
  choice: Tempel im Haupttext, wörtliche Form in der Fußnote
  alternative: die Burg, die zum Haus gehört
  rationale: Im Kontext ist mit „dem Haus“ sehr wahrscheinlich der Tempel gemeint. Die verständliche Wiedergabe „Tempel“ wird gewählt, während die knappe und hinsichtlich der Beziehung mehrdeutige Ausgangsform in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Konkrete Bau- und Verwaltungsbegriffe werden natürlich wiedergegeben; charakteristische Bildsprache und echte Mehrdeutigkeit werden im Text beziehungsweise in den Fußnoten bewahrt.
