  text: וְ/הַ/סְּגָנִ֗ים לֹ֤א יָדְעוּ֙ אָ֣נָה הָלַ֔כְתִּי וּ/מָ֖ה אֲנִ֣י עֹשֶׂ֑ה וְ/לַ/יְּהוּדִ֨ים וְ/לַ/כֹּהֲנִ֜ים וְ/לַ/חֹרִ֣ים וְ/לַ/סְּגָנִ֗ים וּ/לְ/יֶ֨תֶר֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה עַד כֵּ֖ן לֹ֥א הִגַּֽדְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/016.yaml
  text: But the officials did not know where I had gone or what I was doing[a], and until then I had not told the Jews, the priests, the nobles, the officials, or the rest who were doing the work.
translation:
  language: de
  text: Doch die Beamten wussten nicht, wohin ich gegangen war und was ich tat. Bis dahin hatte ich den Juden[a], den Priestern, den Vornehmen, den Beamten und den übrigen, die das Werk ausführten, nichts mitgeteilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Judäern“. Das hebräische Wort יְהוּדִים kann die Bewohner Judas oder die jüdische Gemeinschaft allgemein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּגָנִים
  choice: die Beamten
  rationale: סְגָנִים bezeichnet nachgeordnete Amts- oder Würdenträger. „Beamte“ ist im modernen Deutschen verständlich und vermeidet eine zu genaue Festlegung auf einen persischen Verwaltungstitel.
- source_word: יָדְעוּ
  choice: wussten nicht
  rationale: ידע bedeutet im Qal gewöhnlich „wissen“; das Präteritum entspricht dem deutschen Erzählstil.
- source_word: אָנָה הָלַכְתִּי
  choice: wohin ich gegangen war
  rationale: אָנָה bezeichnet das Ziel einer Bewegung. Das Plusquamperfekt macht deutlich, dass Nehemias Gang aus Sicht der Beamten bereits vorauslag.
- source_word: וּמָה אֲנִי עֹשֶׂה
  choice: und was ich tat
  rationale: Das Partizip עֹשֶׂה beschreibt die Tätigkeit Nehemias. „Was ich tat“ ist im Erzählzusammenhang natürlich und bewahrt das hebräische verbindende ו als „und“.
- source_word: לַיְּהוּדִים
  choice: den Juden
  rationale: יְהוּדִים kann sowohl die Juden als Gemeinschaft als auch regional die Judäer bezeichnen. „Juden“ ist die geläufige Wiedergabe; die regionale Alternative wird in einer Fußnote genannt.
- source_word: לַכֹּהֲנִים
  choice: den Priestern
  rationale: Direkte und eindeutige Wiedergabe von כֹּהֲנִים.
- source_word: לַחֹרִים
  choice: den Vornehmen
  rationale: חֹרִים bezeichnet hier die gesellschaftlich führende Schicht. „Vornehme“ ist würdig und verständlich, ohne einen erblichen Adelstitel vorauszusetzen.
- source_word: וּלְיֶתֶר
  choice: den übrigen
  rationale: יֶתֶר bezeichnet den verbleibenden Teil einer Gruppe; „die übrigen“ fügt sich natürlich in die Aufzählung ein.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: die das Werk ausführten
  rationale: Der singularische Partizipialausdruck hat kollektive Bedeutung. „Das Werk ausführten“ wahrt den Tätigkeitsbezug und den im Kontext gewichtigen Begriff מְלָאכָה.
- source_word: עַד כֵּן
  choice: bis dahin
  rationale: Die Wendung bezeichnet den Zeitpunkt, bis zu dem Nehemia seine Absicht nicht mitgeteilt hatte.
- source_word: הִגַּדְתִּי
  choice: hatte ich … etwas davon gesagt
  rationale: נגד im Hifil bedeutet „mitteilen, kundtun“. Die deutsche Formulierung ist idiomatisch und macht den verschwiegenen Sachverhalt deutlich, ohne seinen Inhalt über den Kontext hinaus festzulegen.
