id: NEH.2.14
reference: Nehemiah 2:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וָ/אֶֽעֱבֹר֙ אֶל שַׁ֣עַר הָ/עַ֔יִן וְ/אֶל בְּרֵכַ֖ת הַ/מֶּ֑לֶךְ וְ/אֵין מָק֥וֹם לַ/בְּהֵמָ֖ה לַ/עֲבֹ֥ר תַּחְתָּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/014.yaml
  text: Then I went on to the Fountain Gate and to the King’s Pool[b][a], but there was no place for the animal under me to pass.
translation:
  language: de
  text: Dann zog ich weiter zum Quelltor[a] und zum Königsteich. Doch für das Tier unter mir war kein Platz zum Durchkommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brunnentor“. Das hebräische Wort kann eine Quelle oder einen Brunnen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „für das Tier unter mir hindurchzugehen“; gemeint ist das Tier, auf dem Nehemia ritt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר
  choice: Dann zog ich weiter
  rationale: עבר bezeichnet hier die Fortsetzung von Nehemias nächtlichem Erkundungsweg. „zog ich weiter“ ist im Deutschen natürlich und setzt weder eine Gewässer- noch eine Grenzüberquerung voraus.
- source_word: שַׁעַר הָעַיִן
  choice: Quelltor
  rationale: עַיִן kann „Auge“ oder eine Wasserquelle bezeichnen; im topografischen Zusammenhang ist „Quelle“ gemeint. „Quelltor“ ist eine knappe, etablierte Ortsbezeichnung.
- source_word: בְּרֵכַת הַמֶּלֶךְ
  choice: Königsteich
  rationale: בְּרֵכָה bezeichnet einen Teich oder ein Wasserbecken. Die Zusammensetzung gibt die hebräische Genitivverbindung als Ortsnamen natürlich wieder.
- source_word: וְאֵין מָקוֹם
  choice: Doch … war kein Platz
  rationale: Das וְ leitet hier inhaltlich ein Hindernis ein und wird daher adversativ mit „Doch“ wiedergegeben; מָקוֹם bleibt konkret als „Platz“ erhalten.
- source_word: לַבְּהֵמָה
  choice: für das Tier
  rationale: בְּהֵמָה ist eine allgemeine Bezeichnung für ein Tier. Die Übersetzung vermeidet es, eine im Vers nicht genannte Tierart einzusetzen.
- source_word: לַעֲבֹר
  choice: zum Durchkommen
  rationale: Im Zusammenhang mit dem fehlenden Platz drückt „zum Durchkommen“ die räumliche Behinderung idiomatisch aus.
- source_word: תַּחְתָּי
  choice: unter mir
  rationale: Die wörtliche räumliche Formulierung bleibt erhalten; aus dem Zusammenhang wird deutlich, dass Nehemia auf dem Tier saß.
theological_decisions: []
