  text: וָ/אוֹמַ֣ר אֲלֵ/הֶ֗ם אַתֶּ֤ם רֹאִים֙ הָ/רָעָה֙ אֲשֶׁ֣ר אֲנַ֣חְנוּ בָ֔/הּ אֲשֶׁ֤ר יְרוּשָׁלִַ֨ם֙ חֲרֵבָ֔ה וּ/שְׁעָרֶ֖י/הָ נִצְּת֣וּ בָ/אֵ֑שׁ לְכ֗וּ וְ/נִבְנֶה֙ אֶת חוֹמַ֣ת יְרוּשָׁלִַ֔ם וְ/לֹא נִהְיֶ֥ה ע֖וֹד חֶרְפָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/017.yaml
  text: 'Then I said to them[a], “You see the trouble we are in: Jerusalem lies in ruins, and its gates have been burned with fire. Come, let us rebuild the wall of Jerusalem[c][b], so that we may no longer be a reproach.”'
translation:
  language: de
  text: 'Da sagte ich zu ihnen: „Ihr seht das Elend, in dem wir uns befinden: Jerusalem liegt in Trümmern, und seine Tore sind im Feuer verbrannt. Kommt, lasst uns die Mauer Jerusalems wieder aufbauen, damit wir nicht länger als Schande dastehen.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit wir nicht länger zum Gespött werden“; wörtlicher: „damit wir nicht länger eine Schmach sind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָה
  choice: das Elend
  rationale: Das Wort bezeichnet hier die bedrängte, durch Verwüstung und Schutzlosigkeit gekennzeichnete Lage und nicht moralisches Böses.
- source_word: אֲשֶׁר אֲנַחְנוּ בָהּ
  choice: in dem wir uns befinden
  rationale: Die Wendung beschreibt den gegenwärtigen Zustand der Gemeinschaft; die deutsche Formulierung ist klar und bewahrt das Bild des Sich-in-einer-Notlage-Befindens.
- source_word: יְרוּשָׁלִַם חֲרֵבָה
  choice: Jerusalem liegt in Trümmern
  rationale: חֲרֵבָה beschreibt die Stadt als verwüstet oder zerstört; „liegt in Trümmern“ gibt den sichtbaren baulichen Zustand natürlich wieder.
- source_word: נִצְּתוּ בָאֵשׁ
  choice: sind vom Feuer verzehrt
  rationale: Die passive Verbform und die ausdrückliche Nennung des Feuers bleiben erhalten; „vom Feuer verzehrt“ ist im Deutschen würdevoll und idiomatisch.
- source_word: לְכוּ
  choice: Kommt
  rationale: Obwohl die Grundbedeutung „geht“ lautet, dient die Form hier als gemeinschaftlicher Handlungsaufruf; „Kommt“ entspricht dieser einladenden Funktion.
- source_word: וְנִבְנֶה
  choice: lasst uns … wieder aufbauen
  rationale: Die Kohortativform drückt gemeinsamen Entschluss aus. „Wieder aufbauen“ macht sachgerecht deutlich, dass die zuvor vorhandene Mauer erneuert werden soll.
- source_word: חוֹמַת יְרוּשָׁלִַם
  choice: die Mauer Jerusalems
  rationale: Die Genitivverbindung gibt die hebräische Konstruktverbindung knapp und formal angemessen wieder.
- source_word: וְלֹא נִהְיֶה עוֹד חֶרְפָּה
  choice: damit wir nicht länger der Schande preisgegeben sind
  rationale: חֶרְפָּה umfasst Schmach, öffentliche Schande und Verhöhnung. Die Formulierung bewahrt den gemeinschaftlichen Ehrverlust und gibt den Zweck beziehungsweise das beabsichtigte Ergebnis natürlich wieder.
