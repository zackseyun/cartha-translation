lexical_decisions:
- source_word: וָאָבוֹא
  choice: So kam ich
  rationale: Das narrative Waw mit בוא führt das nächste Ereignis der Erzählung fort. „So kam ich“ gibt die Abfolge im modernen Deutsch natürlich wieder.
- source_word: אֶל יְרוּשָׁלִָם
  choice: nach Jerusalem
  rationale: Bei Städtenamen bezeichnet אֶל das Ziel einer Bewegung; idiomatisches Deutsch verwendet dafür „nach“.
- source_word: וָאֱהִי שָׁם
  choice: und blieb … dort
  rationale: היה bedeutet grundsätzlich „sein“; zusammen mit der Ortsangabe und einer Zeitdauer bezeichnet es hier den Aufenthalt. „Blieb dort“ ist im Deutschen natürlich und bewahrt den Sinnzusammenhang.
- source_word: יָמִים שְׁלֹשָׁה
  choice: drei Tage
  rationale: Die unmarkierte Zeitangabe bezeichnet die Dauer. „Drei Tage“ ist eine genaue und idiomatische Wiedergabe.
