base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/007.yaml
  text: Then I said to the king[a], “If it pleases the king, let letters be given to me for the governors Beyond the River[c][b], so that they may let me pass through until I come to Judah.”
translation:
  language: de
  text: 'Dann sagte ich zum König: »Wenn es dem König recht ist, möge man mir Briefe an die Statthalter Jenseits des Stromes[a] geben, damit sie mir die Durchreise gestatten, bis ich nach Juda komme.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Jenseits des Stromes« war die persische Verwaltungsbezeichnung für das Gebiet westlich des Euphrat.
    reason: cultural_note
lexical_decisions:
- source_word: וָאוֹמַר
  choice: Dann sagte ich
  rationale: Das Waw mit der Verbform führt die Erzählung weiter; »Dann« gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Wenn es dem König gut erscheint
  rationale: Die ehrerbietige Hofformel wird relativ nah am hebräischen Wortlaut und zugleich verständlich wiedergegeben; sie bezeichnet das wohlwollende Urteil des Königs.
- source_word: אִגְּרוֹת יִתְּנוּ לִי
  choice: möge man mir Briefe … mitgeben
  rationale: Der unbestimmte Plural kann im Deutschen idiomatisch mit »man« wiedergegeben werden. »Mitgeben« macht deutlich, dass Nehemia die Schreiben auf seiner Reise erhalten und mitführen soll.
- source_word: פַּחֲווֹת
  choice: Statthalter
  rationale: Das Wort bezeichnet die persischen Provinzverwalter; »Statthalter« ist im historischen Zusammenhang präzise und geläufig.
- source_word: עֵבֶר הַנָּהָר
  choice: jenseits des Stromes
  rationale: Die Wendung ist eine persische Verwaltungsbezeichnung für das Gebiet westlich des Euphrat. Die sachliche Übersetzung wahrt zugleich die räumliche Ausdrucksweise des Hebräischen.
- source_word: אֲשֶׁר יַעֲבִירוּנִי
  choice: damit sie mich durchreisen lassen
  rationale: Der Hifil von עבר bezeichnet hier das Gewähren der Durchreise durch die jeweiligen Amtsgebiete, nicht notwendig eine persönliche Begleitung.
- source_word: עַד אֲשֶׁר אָבוֹא אֶל־יְהוּדָה
  choice: bis ich nach Juda komme
  rationale: Die temporale Grenze und der schlichte Bewegungsausdruck des Ausgangstextes werden direkt wiedergegeben.
