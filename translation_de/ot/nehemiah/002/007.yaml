revisions:
- from: 'Dann sagte ich zum König: »Wenn es dem König gut erscheint, möge man mir Briefe an die Statthalter jenseits des Stromes[a] mitgeben, damit sie mich durchreisen lassen, bis ich nach Juda komme.«'
  to: 'Dann sagte ich zum König: »Wenn es dem König recht ist, möge man mir Briefe an die Statthalter Jenseits des Stromes[a] geben, damit sie mir die Durchreise gestatten, bis ich nach Juda komme.«'
  rationale: Die Überarbeitung bewahrt Sinn, höfischen Registerton und die administrative Terminologie des hebräischen Textes. Sie vermeidet die zusätzliche Konkretisierung durch „mitgeben“ und ersetzt die weniger natürliche Wendung „mich durchreisen lassen“ durch die idiomatische Aussage, dass die Statthalter die Durchreise gestatten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:20:26Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Satz gibt die hebräische Aussage insgesamt zuverlässig wieder: Nehemia ersucht um Schreiben für die Statthalter der persischen Verwaltungseinheit westlich des Euphrat, damit ihm die Weiterreise bis nach Juda gestattet wird. Die Formulierung „mitgeben“ ist jedoch gegenüber יִתְּנוּ לִי („man gebe mir“) unnötig konkret und legt den Reisevollzug stärker nahe, als der Text ausdrückt.'
  naturalness: „Wenn es dem König recht ist“ ist im modernen Standarddeutsch eine natürliche, würdige Wiedergabe der höfischen Formel. „Mir die Durchreise gestatten“ ist idiomatischer und klarer als „mich durchreisen lassen“.
  terminology: „Statthalter“ ist für פַּחֲווֹת passend. „Jenseits des Stromes“ wird als persische Verwaltungsbezeichnung großgeschrieben; die Fußnote erläutert sachgerecht, dass der Euphrat gemeint ist. „Juda“ ist korrekt.
  issues:
  - severity: low
    issue: „mitgeben“ konkretisiert die Gabe der Briefe unnötig.
    rationale: Das Hebräische bittet schlicht darum, dass Nehemia Briefe gegeben werden. Es sagt nicht ausdrücklich, dass sie ihm als Reisegepäck „mitgegeben“ werden.
  - severity: low
    issue: „mich durchreisen lassen“ ist weniger idiomatisch und kann missverständlich sein.
    rationale: יַעֲבִירוּנִי bezeichnet hier das Gewähren von Durchreise bzw. Passage. „Mir die Durchreise gestatten“ gibt dies im Deutschen präzise und natürlich wieder.
  revised_text: 'Dann sagte ich zum König: »Wenn es dem König recht ist, möge man mir Briefe an die Statthalter Jenseits des Stromes[a] geben, damit sie mir die Durchreise gestatten, bis ich nach Juda komme.«'
  revised_footnotes:
