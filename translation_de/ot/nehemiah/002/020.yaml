source:
  edition: WLC
  text: וָ/אָשִׁ֨יב אוֹתָ֜/ם דָּבָ֗ר וָ/אוֹמַ֤ר לָ/הֶם֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם ה֚וּא יַצְלִ֣יחַֽ לָ֔/נוּ וַ/אֲנַ֥חְנוּ עֲבָדָ֖י/ו נָק֣וּם וּ/בָנִ֑ינוּ וְ/לָ/כֶ֗ם אֵֽין חֵ֧לֶק וּ/צְדָקָ֛ה וְ/זִכָּר֖וֹן בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/020.yaml
  text: Then I answered them and said[a], “The God of heaven, he will make us prosper, and we his servants will arise and build[b]. But you have no share or right or memorial in Jerusalem.”
translation:
  language: de
  text: 'Da antwortete ich ihnen und sagte: „Der Gott des Himmels – er wird uns Gelingen schenken[a]. Wir, seine Diener, werden uns aufmachen und bauen. Ihr aber habt keinen Anteil, keinen Rechtsanspruch und kein Gedenken[b] in Jerusalem.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird uns Erfolg geben“ beziehungsweise „wird unser Vorhaben gelingen lassen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „keine Erinnerung“. Das hebräische Wort kann auch ein Erinnerungszeichen oder eine fortbestehende Stellung im öffentlichen Gedenken bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׁיב אוֹתָם דָּבָר וָאוֹמַר לָהֶם
  choice: Da antwortete ich ihnen und sagte
  rationale: Die hebräische Wendung שׁוב + דבר bedeutet idiomatisch, eine Antwort zu geben. Die Formulierung bewahrt zugleich das ausdrücklich folgende „und sagte“, ohne das Hebräische wörtlich-steif nachzubilden.
- source_word: אֱלֹהֵי הַשָּׁמַיִם הוּא
  choice: Der Gott des Himmels – er
  rationale: „Gott des Himmels“ ist die übliche deutsche Wiedergabe des nachexilischen Gottesprädikats. Gedankenstrich und wiederaufgenommenes Pronomen bilden die Hervorhebung durch הוּא ab.
- source_word: יַצְלִיחַ לָנוּ
  choice: wird uns Gelingen schenken
  rationale: Der Hifil von צלח bezeichnet hier, dass Gott Erfolg im bevorstehenden Bauvorhaben gewährt. „Gelingen schenken“ ist natürliches Deutsch und erhält den verursachenden beziehungsweise gewährenden Sinn.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: Im Zusammenhang bezeichnet עבד die Gott Zugehörenden, die in seinem Dienst handeln; ein sozialrechtlicher Sklavenstatus steht hier nicht im Vordergrund.
- source_word: נָקוּם וּבָנִינוּ
  choice: werden uns aufmachen und bauen
  rationale: Die Verben drücken den entschlossenen Beginn und die Durchführung des Bauens aus. „Bauen“ bleibt näher am Grundtext als das kontextuell mögliche „wiederaufbauen“.
- source_word: אֵין חֵלֶק
  choice: keinen Anteil
  rationale: חלק bezeichnet einen zugewiesenen Anteil oder eine Beteiligung und passt zur dreigliedrigen Ausschlussformel.
- source_word: וּצְדָקָה
  choice: keinen Rechtsanspruch
  rationale: צדקה bezeichnet hier nicht moralische Gerechtigkeit, sondern legitimes Recht beziehungsweise rechtmäßige Stellung im Blick auf Jerusalem.
- source_word: וְזִכָּרוֹן
  choice: kein Gedenken
  rationale: זכרון kann Erinnerung, Gedenken oder ein öffentliches Erinnerungszeichen bezeichnen. „Gedenken“ wahrt die ungewöhnliche, möglicherweise statusbezogene Aussage, ohne sie auf einen bloßen Rechtsbegriff zu verengen.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Entspricht der Ortsangabe des hebräischen Textes und ist im Deutschen idiomatisch.
theological_decisions:
- issue: Bezeichnung der Zugehörigkeit zu Gott durch עֲבָדָיו
  choice: seine Diener
  alternative: seine Sklaven
  rationale: Nehemia betont hier die Zugehörigkeit, Beauftragung und den Dienst für Gott im Gegensatz zur fehlenden Stellung seiner Gegner. „Diener“ gibt diesen Aussagezweck wieder, ohne eine hier nicht hervorgehobene soziale Rechtsstellung einzutragen.
- issue: Bedeutung von צְדָקָה in der Ausschlussformel
  choice: Rechtsanspruch
  alternative: Gerechtigkeit; Recht
  rationale: Der Kontext betrifft die legitime Stellung und Beteiligung in Jerusalem. Die Wiedergabe als „Gerechtigkeit“ würde die Aussage unnötig in eine moralisch-theologische Richtung verschieben.
- issue: Bedeutung von זִכָּרוֹן in Jerusalem
  choice: Gedenken
  alternative: Erinnerung; Denkmal; erinnerte Stellung
  rationale: Der Begriff kann sowohl konkrete Erinnerung als auch fortbestehendes öffentliches oder gemeinschaftliches Gedenken betreffen. Die Übersetzung bewahrt diese Spannung, statt sie als rein juristischen Anspruch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leichte Wiederholung in „antwortete … und sagte“ folgt der hebräischen Erzählweise; der Gedankenstrich bildet die Hervorhebung des göttlichen Subjekts ab. Die dreigliedrige Schlussformel bleibt bewusst markant und semantisch offen.
