  text: 'Dann sprach Jahwe[a] zu Mose:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: Hinweis auf die hebräische Namensform und die traditionelle deutsche Ersatzwiedergabe.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann sprach
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Dann sprach“ gibt sowohl die Abfolge als auch den Sinn von דבר natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: אֶל kennzeichnet hier den Adressaten der Rede; „zu Mose“ ist die idiomatische deutsche Wiedergabe.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den folgenden Redeinhalt ein. Im Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „und sagte“ oder „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als Namen; die traditionelle Wiedergabe „der HERR“ wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Redeeinleitungsformel wird knapp und idiomatisch mit einem Doppelpunkt wiedergegeben.
