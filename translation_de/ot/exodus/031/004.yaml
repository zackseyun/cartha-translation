lexical_decisions:
- source_word: לַחְשֹׁב מַחֲשָׁבֹת
  choice: kunstvolle Entwürfe zu planen
  rationale: Die verbale Verbindung bezeichnet im handwerklichen Kontext das planende Ersinnen von Gestaltungen. »Kunstvolle Entwürfe zu planen« gibt sowohl die schöpferische Planung als auch den sachlichen Bezug auf Kunsthandwerk natürlich wieder.
- source_word: לַעֲשׂוֹת
  choice: Arbeiten … auszuführen
  rationale: עשה bezeichnet hier die praktische Umsetzung der zuvor geplanten Entwürfe. »Arbeiten … auszuführen« passt zum deutschen Sprachgebrauch für kunsthandwerkliche Tätigkeit und erhält den Gegensatz zwischen Planung und Ausführung.
- source_word: בַּזָּהָב וּבַכֶּסֶף וּבַנְּחֹשֶׁת
  choice: in Gold, Silber und Bronze
  rationale: Die Präposition ב bezeichnet hier die Werkstoffe beziehungsweise den Bereich der Metallarbeit. Die knappe deutsche Reihung ist natürlich und bewahrt die Parallelität des Hebräischen.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Das Wort kann Kupfer oder Bronze bezeichnen. Im Zusammenhang der Metallarbeiten am Heiligtum ist »Bronze« die wahrscheinlichste und im Deutschen geläufigste Wiedergabe.
