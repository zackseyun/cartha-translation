source:
  edition: WLC
  text: וְ/אַתָּ֞ה דַּבֵּ֨ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אַ֥ךְ אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ כִּי֩ א֨וֹת הִ֜וא בֵּינִ֤/י וּ/בֵֽינֵי/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/013.yaml
  text: And you[a], speak to the sons of Israel, saying, ‘Surely you shall keep my Sabbaths, for it is a sign between me and you throughout your generations[c][b], so that you may know that I am Yahweh who sanctifies you.’
translation:
  language: de
  text: 'Du aber sollst zu den Israeliten[a] sagen: »Haltet unbedingt[b] meine Sabbate! Denn dies ist ein Zeichen zwischen mir und euch, von Generation zu Generation, damit ihr erkennt, dass ich Jahwe[c] bin, der euch heiligt[d].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu den Söhnen Israels«; gemeint ist das Volk Israel als Bundesgemeinschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Haltet jedoch meine Sabbate«. Das hebräische Wort kann Einschränkung beziehungsweise Gegensatz oder starken Nachdruck ausdrücken.'
    reason: lexical_alternative
  - marker: c
    text: Traditionell wird der Gottesname im Deutschen mit »der HERR« wiedergegeben.
    reason: translation_tradition
  - marker: d
    text: 'Oder: »der euch heilig macht« beziehungsweise »der euch für sich aussondert«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Du aber
  rationale: Das vorangestellte Pronomen hebt den Angesprochenen hervor und markiert zugleich den Übergang von den vorhergehenden Anweisungen.
- source_word: דַּבֵּר ... לֵאמֹר
  choice: sollst ... sagen
  rationale: Die im Hebräischen übliche Verbindung aus »rede« und der Zitationsformel »indem du sagst« wird in natürliches, würdevolles Deutsch übertragen, ohne den Befehlscharakter abzuschwächen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  rationale: Die idiomatische deutsche Volksbezeichnung gibt die korporative Bedeutung wieder; die wörtliche familiäre Form wird in einer Fußnote bewahrt.
- source_word: אַךְ
  choice: unbedingt
  rationale: Die Partikel trägt hier restriktive beziehungsweise nachdrücklich hervorhebende Kraft. »Unbedingt« betont die Verbindlichkeit, ohne die mögliche Nuance »nur« stillschweigend zur einzig möglichen Deutung zu machen.
- source_word: שַׁבְּתֹתַי
  choice: meine Sabbate
  rationale: Der ausdrückliche Plural des Hebräischen bleibt erhalten.
- source_word: תִּשְׁמֹרוּ
  choice: Haltet
  rationale: שׁמר bezeichnet im Bundes- und Gebotszusammenhang das sorgfältige Halten beziehungsweise Beachten einer Anordnung.
- source_word: אוֹת
  choice: Zeichen
  rationale: »Zeichen« ist die sachlich passende Wiedergabe für das Bundeszeichen, das die Beziehung zwischen Jahwe und Israel sichtbar kennzeichnet.
- source_word: לְדֹרֹתֵיכֶם
  choice: von Generation zu Generation
  rationale: Die deutsche Wendung vermittelt die fortdauernde Geltung über die aufeinanderfolgenden Generationen hinweg.
- source_word: לָדַעַת
  choice: damit ihr erkennt
  rationale: Der mit ל gebildete Infinitiv drückt hier Zweck beziehungsweise Folge aus; das pluralische »ihr« ergibt sich aus dem angesprochenen Volk.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als solcher wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מְקַדִּשְׁכֶם
  choice: der euch heiligt
  rationale: Das Partizip stellt Jahwe als den fortwährend Handelnden dar; »heiligt« wahrt den kultisch-theologischen Gehalt des Verbs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. »Jahwe« bewahrt seinen Charakter als persönlichen Bundesnamen, während eine Fußnote die traditionelle deutsche Wiedergabe nennt.
- issue: Bedeutung von מקדש
  choice: der euch heiligt
  alternative: der euch heilig macht
  rationale: »Heiligt« lässt sowohl die Aussonderung für Gott als auch das Heiligmachen anklingen und legt den Vorgang nicht enger fest, als es der hebräische Ausdruck verlangt.
- issue: Funktion des Sabbats als אוֹת
  choice: dies ist ein Zeichen zwischen mir und euch
  alternative: er ist ein Zeichen zwischen mir und euch
  rationale: »Dies« nimmt die Sabbatbeachtung als Ganzes auf und vermeidet im Deutschen eine künstliche Festlegung des singularischen Rückverweises auf nur einen der zuvor genannten Sabbate.
translation_notes:
  register: Modernes Standarddeutsch in einem würdevollen, mündlich gut verständlichen Gebotsstil. Die direkte Anrede und der Plural »Sabbate« bleiben erhalten. Der hebräische Pleonasmus »rede ... indem du sagst« wird idiomatisch zu »sollst ... sagen« verdichtet; bedeutungstragende Mehrdeutigkeiten bei אַךְ und מקדש werden in den Fußnoten offengehalten.
