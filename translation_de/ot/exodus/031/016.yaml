base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/016.yaml
  text: So the sons of Israel shall keep the Sabbath[c][b][a], to observe the Sabbath throughout their generations as an everlasting covenant.
translation:
  language: de
  text: Die Söhne Israels[a] sollen den Sabbat halten, um ihn über alle ihre Generationen hinweg als ewigen Bund[c] zu begehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Israeliten« beziehungsweise »die Kinder Israels«. Wörtlich: »die Söhne Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »den Sabbat tun/machen«; gemeint ist, ihn zu halten oder zu begehen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »einen immerwährenden Bund« beziehungsweise »einen unbefristet fortbestehenden Bund«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: sollen … halten
  rationale: שׁמר bedeutet hier »halten, bewahren, beachten«. Die Form trägt im Zusammenhang verpflichtenden Bundescharakter; »sollen … halten« gibt diesen natürlich wieder. Das einleitende וְ wird im flüssigen deutschen Satzbau nicht eigens mit »und« wiedergegeben.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die hebräische Wendung lautet wörtlich »Söhne Israels« und bezeichnet kollektiv das Bundesvolk. Die familiäre Ausdrucksweise und die grammatisch maskuline Form bleiben erhalten.
- source_word: הַשַּׁבָּת
  choice: den Sabbat
  rationale: שַׁבָּת bezeichnet hier den Sabbat als eingesetzte Ordnung und Bundeszeichen, nicht lediglich einen unbestimmten Ruhetag.
- source_word: לַעֲשׂוֹת אֶת הַשַּׁבָּת
  choice: ihn … begehen
  rationale: Wörtlich steht »den Sabbat tun/machen«. Das deutsche »den Sabbat begehen« gibt die idiomatische Bedeutung verständlich wieder und vermeidet zugleich die unmittelbare Wiederholung von »halten«.
- source_word: לְדֹרֹתָם
  choice: durch all ihre Generationen hindurch
  rationale: Die Wendung bezeichnet die fortdauernde Geltung in der Abfolge der Generationen. Diese Formulierung ist klar und bewahrt den Bezug auf ihre Generationen.
- source_word: בְּרִית עוֹלָם
  choice: als einen ewigen Bund
  rationale: בְּרִית bedeutet »Bund«; עוֹלָם bezeichnet hier unabsehbare beziehungsweise bleibende Dauer. »Ewiger Bund« ist die geläufige, gewichtige Wiedergabe. »Als« verdeutlicht die appositionale oder prädikative Funktion des schließenden Ausdrucks, ohne dessen genaue syntaktische Beziehung stärker festzulegen.
theological_decisions:
- issue: Bezeichnung des Bundesvolkes בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten; die Kinder Israels
  rationale: Die wörtliche familiäre und maskuline Form wird bewahrt, während die Fußnote darauf hinweist, dass sie das Volk Israel kollektiv bezeichnet. So wird der Ausgangstext nicht durch einen neutralen Volksnamen eingeebnet.
- issue: Dauer des Bundes in בְּרִית עוֹלָם
  choice: ewiger Bund
  alternative: immerwährender Bund; dauerhafter Bund
  rationale: Die Übersetzung erhält die starke zeitliche Aussage von עוֹלָם, ohne aus diesem Vers allein spätere theologische Folgerungen über Art oder Reichweite der Fortgeltung abzuleiten.
- issue: Beziehung des Sabbats zum Bund
  choice: ihn … begehen – als einen ewigen Bund
  alternative: den Sabbat … als ewigen Bund halten
  rationale: Die Gedankenstrichkonstruktion lässt die knappe hebräische Schlusswendung in ihrer appositionalen beziehungsweise prädikativen Spannung stehen und legt nicht unnötig fest, ob vor allem der Sabbat selbst oder seine fortdauernde Beachtung als Bund bezeichnet wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »Sabbat« wird durch das Pronomen »ihn« geglättet; die ungewöhnliche hebräische Wendung »den Sabbat tun« wird in einer Fußnote dokumentiert. Der Gedankenstrich bewahrt das Gewicht und die gewisse syntaktische Offenheit der abschließenden Wendung.
