  yaml_path: translation/ot/exodus/031/014.yaml
  text: You shall keep the Sabbath[a], because it is holy to you. Whoever profanes it shall surely be put to death, for whoever does work on it[b], that person shall be cut off from among his people.
translation:
  language: de
  text: Haltet den Sabbat, denn er ist euch heilig. Wer ihn entweiht, soll gewiss getötet werden; denn jeder, der an ihm eine Arbeit verrichtet, soll aus der Mitte seines Volkes abgeschnitten werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Rechtsformel „abgeschnitten werden“ bezeichnet ein Entferntwerden aus dem Volk; auf welche Weise das Urteil vollzogen wird, ist hier nicht näher bestimmt.
    reason: legal_formula_ambiguity
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Darum haltet
  rationale: שׁמר bezeichnet hier das verbindliche Einhalten beziehungsweise Beachten. Der vorangestellte Anschluss וּ wird im Deutschen kontextgerecht mit „Darum“ wiedergegeben.
- source_word: הַשַּׁבָּת
  choice: den Sabbat
  rationale: „Sabbat“ ist die etablierte und präzise Bezeichnung für den im Hebräischen genannten Ruhetag beziehungsweise die entsprechende Einrichtung.
- source_word: קֹדֶשׁ הִוא לָכֶם
  choice: er ist euch heilig
  rationale: Die Formulierung bewahrt sowohl den Begriff der Heiligkeit als auch den Dativ לָכֶם und klingt zugleich natürlich auf Deutsch.
- source_word: מְחַלְלֶיהָ
  choice: Wer ihn entweiht
  rationale: Das Piel von חלל bedeutet „entweihen, profanieren“. Die generische Partizipialform wird als allgemeiner Rechtssatz wiedergegeben.
- source_word: מוֹת יוּמָת
  choice: muss gewiss getötet werden
  rationale: Infinitivus absolutus plus finites Verb verstärkt die Aussage. Die passive Form bezeichnet im Rechtskontext die Tötung als Strafe; „gewiss“ erhält die Emphase.
- source_word: כָּל הָעֹשֶׂה בָהּ מְלָאכָה
  choice: jeder, der an ihm eine Arbeit verrichtet
  rationale: מְלָאכָה bezeichnet Arbeit beziehungsweise eine ausgeführte Tätigkeit. „eine Arbeit verrichtet“ gibt den juristischen Stil würdig und verständlich wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „irgendeine“ einzufügen.
- source_word: וְנִכְרְתָה
  choice: soll ... ausgerottet werden
  rationale: כרת im Nifal ist eine feste rechtlich-bundestheologische Wendung. „ausgerottet werden“ wahrt die scharfe Bildlichkeit, ohne die konkrete Vollzugsweise festzulegen.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: jeder, der
  rationale: נֶפֶשׁ bezeichnet hier die haftbare Person, nicht ausdrücklich eine vom Körper unterschiedene „Seele“. Im Deutschen lässt sich der Rückbezug natürlich in den Relativsatz aufnehmen.
- source_word: מִקֶּרֶב עַמֶּיהָ
  choice: aus der Mitte seines Volkes
  rationale: Die Wendung bezeichnet die Entfernung aus der Volksgemeinschaft. Das grammatisch feminine Suffix nimmt das feminine נֶפֶשׁ auf; im Deutschen richtet sich das Pronomen sinngemäß nach der gemeinten Person.
theological_decisions:
- issue: Bedeutung der Strafwendung וְנִכְרְתָה ... מִקֶּרֶב עַמֶּיהָ
  choice: Die bildhafte Formel „aus der Mitte seines Volkes ausgerottet werden“ wird beibehalten und in einer Fußnote als hinsichtlich der Vollzugsweise offen erläutert.
  alternative: „aus der Gemeinschaft ausgeschlossen werden“ oder ausdrückliche Deutung als Hinrichtung beziehungsweise göttliches Gericht
  rationale: Der Vers nennt die konkrete Art des Gerichts in dieser Formel nicht eindeutig. Eine Festlegung auf Ausschluss, menschliche Hinrichtung oder unmittelbares göttliches Gericht würde die vorhandene Spannung auflösen.
- issue: Wiedergabe von נֶפֶשׁ im Rechtstext
  choice: als Person im Relativsatz verstanden
  alternative: „Seele“
  rationale: Gemeint ist der verantwortliche Mensch als Person. „Seele“ könnte eine anthropologische Aussage nahelegen, die der Kontext nicht verlangt.
translation_notes:
  register: Moderner, würdiger deutscher Rechtssatz mit klarer Satzstruktur. „Sabbat“, „heilig“ und „ausgerottet“ bewahren die zentralen kultischen und rechtlichen Begriffe; die Fußnote erhält die Unbestimmtheit der Strafvollzugsformel.
