  text: וְ/אֵ֖ת בִּגְדֵ֣י הַ/שְּׂרָ֑ד וְ/אֶת בִּגְדֵ֤י הַ/קֹּ֨דֶשׁ֙ לְ/אַהֲרֹ֣ן הַ/כֹּהֵ֔ן וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו לְ/כַהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/010.yaml
  text: and the finely woven garments[a], and the holy garments for Aaron the priest, and the garments of his sons for serving as priests,
translation:
  language: de
  text: und die kunstvoll gearbeiteten Gewänder[a], die heiligen Gewänder für den Priester Aaron und die Gewänder seiner Söhne für ihren Priesterdienst,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gewänder für den Dienst“, „die Dienstgewänder“ oder „die gewebten Gewänder“. Der hebräische Ausdruck ist schwer zu deuten und kann entweder die besondere Herstellung der Gewänder oder ihren Gebrauch beim Dienst am Heiligtum hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: die kunstvoll gearbeiteten Gewänder
  rationale: בִּגְדֵי bedeutet „Gewänder“. Das schwierige הַשְּׂרָד kann sich auf die besondere Ausführung beziehungsweise Webarbeit oder auf den gottesdienstlichen Gebrauch beziehen. „Kunstvoll gearbeitete Gewänder“ gibt den wahrscheinlichen handwerklichen Aspekt in natürlichem Deutsch wieder; die Unsicherheit bleibt in der Fußnote sichtbar.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: die heiligen Gewänder
  rationale: Die Konstruktion bedeutet wörtlich „Gewänder der Heiligkeit“ und idiomatisch „heilige Gewänder“. Diese Wiedergabe ist direkt, würdig und verständlich.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: für den Priester Aaron
  rationale: לְ bezeichnet hier Zuordnung beziehungsweise Bestimmung. הַכֹּהֵן ist Aarons Titel; im Deutschen ist „für den Priester Aaron“ eine natürliche appositionelle Form.
- source_word: בִּגְדֵי בָנָיו
  choice: die Gewänder seiner Söhne
  rationale: Die Status-constructus-Verbindung mit Suffix verweist auf Aarons Söhne und wird formal wie idiomatisch klar wiedergegeben.
- source_word: לְכַהֵן
  choice: für ihren Priesterdienst
  rationale: Der Infinitiv von כהן bezeichnet das Ausüben des Priesteramts. „Für ihren Priesterdienst“ drückt Zweck und priesterliche Funktion knapp und natürlich aus.
- source_word: וְאֵת / וְאֶת
  choice: und
  rationale: Die Akkusativmarker אֵת bleiben unübersetzt; die Konjunktion וְ erhält die Listenstruktur des vorausgehenden Satzes.
