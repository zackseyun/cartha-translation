base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/015.yaml
  text: Work may be done for six days[a], but on the seventh day there is a Sabbath of complete rest, holy to Yahweh. Whoever does work on the Sabbath day shall surely be put to death.
translation:
  language: de
  text: Sechs Tage lang soll Arbeit verrichtet werden; am siebten Tag aber ist ein Sabbat völliger Ruhe[a], Yahweh heilig. Wer am Sabbattag Arbeit verrichtet, muss unbedingt getötet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „ein Sabbat, eine feierliche Ruhe“. Die hebräische Wortverbindung verstärkt den Gedanken des Aufhörens und Ruhens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה מְלָאכָה
  choice: darf Arbeit verrichtet werden
  rationale: Der Nifal-Imperfekt von עשה mit מְלָאכָה wird passiv wiedergegeben. „Darf“ passt zum rechtlich-anweisenden Zusammenhang, ohne die Form als bloße Zukunft zu verstehen; „Arbeit verrichten“ ist im Deutschen natürlich und präzise.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: aber am siebten Tag
  rationale: Das ו kann schlicht „und“ bedeuten; „aber“ bringt hier den im Satz angelegten Gegensatz zwischen den sechs Arbeitstagen und dem siebten Tag idiomatisch zum Ausdruck.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: ein Sabbat völliger Ruhe
  rationale: Die Wortverbindung verstärkt den Gedanken des Aufhörens und Ruhens. Die Wiedergabe bewahrt sowohl „Sabbat“ als auch die intensivierende Kraft von שַׁבָּתוֹן.
- source_word: קֹדֶשׁ לַיהוָה
  choice: heilig für Yahweh
  rationale: קֹדֶשׁ bezeichnet hier den heiligen Status, während ל die Zuordnung beziehungsweise Weihe anzeigt. „Heilig für Yahweh“ ist knapp und natürlich.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als „Yahweh“ wiedergegeben, damit der im Hebräischen stehende persönliche Bundesname erhalten bleibt und nicht durch einen Titel ersetzt wird.
- source_word: כָּל הָעֹשֶׂה מְלָאכָה
  choice: Wer … Arbeit verrichtet
  rationale: Die partizipiale Konstruktion mit כָּל bezeichnet eine allgemeine rechtliche Kategorie. „Wer“ gibt diese universale Bedingung im Deutschen idiomatisch wieder.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: am Sabbattag
  rationale: „Sabbattag“ gibt sowohl שַׁבָּת als auch das ausdrücklich vorhandene יוֹם kompakt wieder.
- source_word: מוֹת יוּמָת
  choice: muss unweigerlich getötet werden
  rationale: Der absolute Infinitiv vor der passiven Verbform verstärkt die sichere Vollstreckung der Todesstrafe. „Getötet werden“ erhält die passive beziehungsweise kausative Form, und „unweigerlich“ bildet die hebräische Intensivierung ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Yahweh“ bewahrt den persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Stärke der Sabbatbezeichnung שַׁבַּת שַׁבָּתוֹן
  choice: ein Sabbat völliger Ruhe
  alternative: ein Sabbat, eine feierliche Ruhe; ein Ruhetag völliger Ruhe
  rationale: Die Formulierung hebt die umfassende Arbeitsruhe hervor, ohne spätere konfessionelle Deutungen einzutragen.
- issue: Rechtskraft von מוֹת יוּמָת
  choice: muss unweigerlich getötet werden
  alternative: soll gewiss getötet werden; muss mit dem Tod bestraft werden
  rationale: Die Übersetzung wahrt sowohl die verstärkende Konstruktion als auch die passive Form und stellt die Aussage als im Text festgelegte Rechtsfolge dar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich klarer Syntax. Der passive Charakter der beiden Hauptaussagen bleibt erhalten; die Schärfe der Strafbestimmung wird weder abgeschwächt noch ausgeweitet.
