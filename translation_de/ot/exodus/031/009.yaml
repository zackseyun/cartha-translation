  text: den Brandopferaltar mit allen seinen Geräten und das Becken mit seinem Gestell.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: Brandopferaltar
  rationale: Die deutsche Zusammensetzung ist die geläufige und präzise Bezeichnung für den Altar, der dem Brandopfer zugeordnet ist.
- source_word: כָּל כֵּלָיו
  choice: alle seine Geräte
  rationale: כְּלִי bezeichnet hier die für den Altar bestimmten Geräte bzw. Gebrauchsgegenstände; „Geräte“ ist im Deutschen natürlich und hinreichend weit.
- source_word: הַכִּיּוֹר
  choice: das Becken
  rationale: Gemeint ist das Waschbecken im Vorhof; „Becken“ ist modern und verständlich, ohne einen altertümlichen Fachausdruck einzuführen.
- source_word: כַּנּוֹ
  choice: sein Gestell
  rationale: כֵּן bezeichnet die tragende Unterkonstruktion des Beckens. „Gestell“ gibt diese Funktion natürlich wieder; „Sockel“ ist ebenfalls möglich.
- source_word: וְאֶת
  choice: und
  rationale: Die Verbindung leitet in der Aufzählung einen weiteren Gegenstand ein; der unübersetzbare direkte Objektmarker bleibt im Deutschen unausgedrückt.
