  text: and the table with its utensils[a], and the pure lampstand with all its utensils, and the altar of incense[c][b],
translation:
  language: de
  text: und den Tisch mit seinen Geräten, den reinen Leuchter mit allen seinen Geräten und den Räucheraltar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: den Tisch
  rationale: שֻׁלְחָן bedeutet schlicht »Tisch«. Der Zusammenhang bezeichnet ihn näher; eine im Vers nicht ausgedrückte Langform wird nicht ergänzt.
- source_word: כֵּלָיו / כָּל כֵּלֶיהָ
  choice: seinen Geräten / allen seinen Geräten
  rationale: כְּלִי bezeichnet hier die zugehörigen Gegenstände oder Geräte. »Geräte« ist im Heiligtumskontext natürlich und weit genug; כָּל wird mit »allen« wiedergegeben.
- source_word: הַמְּנֹרָה
  choice: den Leuchter
  rationale: מְנוֹרָה bezeichnet den Leuchter des Heiligtums. Das deutsche Gattungswort wird einer bloßen Transliteration als »Menora« vorgezogen.
- source_word: הַטְּהֹרָה
  choice: aus reinem Gold
  rationale: Wörtlich steht »der reine [Leuchter]«. Im Stiftshüttenkontext bezeichnet die verkürzte Wendung den aus reinem Gold gefertigten Leuchter; die Ergänzung macht den im Kontext vorausgesetzten Bezug im Deutschen verständlich, wird aber durch eine Fußnote transparent gemacht.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: den Räucheraltar
  rationale: Die Status-constructus-Verbindung bedeutet »Altar des Räucherwerks/Räucheraltar«. »Räucheraltar« ist die natürliche, prägnante deutsche Bezeichnung.
- source_word: וְאֶת
  choice: und
  rationale: Die Akkusativpartikel אֵת bleibt unübersetzt; וְ wird zur Wahrung der Aufzählungsstruktur mit »und« wiedergegeben.
theological_decisions:
- issue: Bedeutung von הַטְּהֹרָה beim Leuchter
  choice: Im Haupttext als »aus reinem Gold« kontextuell entfaltet
  alternative: »der reine Leuchter« oder »der kultisch reine Leuchter«
  rationale: טָהוֹר kann »rein« im kultischen oder materiellen Sinn bedeuten. Die verwandten Beschreibungen des Leuchters aus reinem Gold legen hier den Materialbezug nahe; die mögliche weitergehende Reinheitsbedeutung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung und die wiederholten Zuordnungen der Geräte bleiben erhalten; »Leuchter« und »Räucheraltar« sind verständliche, etablierte Heiligtumsbegriffe.
