  text: וַ/אֲנִ֞י הִנֵּ֧ה נָתַ֣תִּי אִתּ֗/וֹ אֵ֣ת אָהֳלִיאָ֞ב בֶּן אֲחִֽיסָמָךְ֙ לְ/מַטֵּה דָ֔ן וּ/בְ/לֵ֥ב כָּל חֲכַם לֵ֖ב נָתַ֣תִּי חָכְמָ֑ה וְ/עָשׂ֕וּ אֵ֖ת כָּל אֲשֶׁ֥ר צִוִּיתִֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/006.yaml
  text: And behold[a], I have appointed with him Oholiab son of Ahisamach, of the tribe of Dan; and in the heart of everyone wise of heart I have put wisdom[b], that they may make all that I have commanded you.
translation:
  language: de
  text: 'Und sieh: Ich selbst habe ihm Oholiab, den Sohn Ahisamachs, vom Stamm Dan, zur Seite gestellt. Und allen, die ein weises Herz haben, habe ich Weisheit gegeben,[a] damit sie alles anfertigen, was ich dir geboten habe.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und in das Herz jedes Menschen, der weisen Herzens ist, habe ich Weisheit gegeben.“ Gemeint ist von Gott verliehene Einsicht und handwerkliche Befähigung.'
    reason: cultural_note
  - marker: b
    text: 'Oder formeller: „und sie sollen alles anfertigen, was ich dir geboten habe.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: Und ich, siehe
  rationale: Bewahrt sowohl das betonte selbstständige Pronomen als auch den aufmerksamkeitslenkenden Ausdruck הִנֵּה in würdigem, verständlichem Deutsch.
- source_word: נָתַתִּי אִתּוֹ
  choice: habe ihm … zur Seite gestellt
  rationale: Gibt נתן im Beauftragungszusammenhang idiomatisch wieder und wahrt durch „ihm … zur Seite“ ausdrücklich אִתּוֹ.
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: Oholiab, den Sohn Ahisamachs
  rationale: Transliteriert die Eigennamen und gibt die hebräische Abstammungsangabe natürlich wieder.
- source_word: לְמַטֵּה דָן
  choice: vom Stamm Dan
  rationale: מַטֶּה bezeichnet hier die Stammeszugehörigkeit; „vom Stamm Dan“ ist präzises, geläufiges Deutsch.
- source_word: וּבְלֵב כָּל חֲכַם לֵב
  choice: Und allen, die ein weises Herz haben
  rationale: Bewahrt das Herzmotiv des hebräischen Idioms, ohne die im Deutschen schwerfällige Wiederholung „im Herzen jedes weisen Herzens“ nachzubilden.
- source_word: נָתַתִּי חָכְמָה
  choice: habe ich Weisheit gegeben
  rationale: Erhält die lexikalische und theologische Weite von חָכְמָה; im Zusammenhang schließt sie handwerkliches Können ein.
- source_word: וְעָשׂוּ
  choice: damit sie … anfertigen
  rationale: Gibt die natürliche Zweck- beziehungsweise Folgebeziehung zur göttlichen Gabe der Weisheit wieder; „anfertigen“ passt zum handwerklichen Kontext.
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתִךָ
  choice: alles …, was ich dir geboten habe
  rationale: Gibt die Totalitätsaussage und die fortdauernde Geltung des an Mose ergangenen Gebots klar wieder.
theological_decisions:
- issue: Wiedergabe von חֲכַם־לֵב und חָכְמָה im handwerklichen Zusammenhang
  choice: ein weises Herz haben / Weisheit
  alternative: kunstfertig sein / Können
  rationale: Der Kontext betrifft handwerkliche Befähigung, doch die gewählte Fassung bewahrt die hebräische Vorstellung, dass diese Fertigkeit eine von Gott gegebene Form der Weisheit ist.
- issue: Sinn von וְעָשׂוּ nach der Gabe der Weisheit
  choice: damit sie … anfertigen
  alternative: und sie sollen … anfertigen
  rationale: „Damit“ bringt die naheliegende Zweckbeziehung zum Ausdruck, ohne den möglichen konsekutiven oder anschließenden Sinn vollständig zu verdecken; die formellere Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ bewahrt den markierten Aufmerksamkeitssignalton; „zur Seite gestellt“ und „anfertigen“ sorgen zugleich für natürliche Verständlichkeit. Die Fußnotenmarker [a] und [b] stehen an den jeweils erläuterten Textstellen.
