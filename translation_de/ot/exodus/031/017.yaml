  yaml_path: translation/ot/exodus/031/017.yaml
  text: It is a sign forever between me and the sons of Israel[a], for in six days Yahweh made the heavens and the earth[c][b], and on the seventh day he ceased and was refreshed.
translation:
  language: de
  text: Es ist für immer ein Zeichen zwischen mir und den Söhnen Israels[a]; denn in sechs Tagen machte Jahwe Himmel und Erde, und am siebten Tag hörte er auf[b] und erholte sich[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Israeliten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ruhte er“; das hebräische Verb bedeutet zunächst „aufhören, ablassen“.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb bezeichnet ein Erfrischt- oder Wiederbelebtwerden und kann die Bildlichkeit von „Atem schöpfen“ anklingen lassen; hier wird anschauliche menschliche Ausdrucksweise gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּינִי וּבֵין
  choice: zwischen mir und
  rationale: Die korrelative hebräische Fügung wird im Deutschen idiomatisch mit der einfachen Präposition „zwischen“ wiedergegeben.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Bewahrt den familiären und grammatisch maskulinen Ausdruck des Hebräischen; die idiomatische Alternative „den Israeliten“ steht in der Fußnote.
- source_word: אוֹת
  choice: Zeichen
  rationale: „Zeichen“ ist die übliche und kontextgerechte Wiedergabe für ein dauerhaftes Bundeszeichen.
- source_word: לְעֹלָם
  choice: für immer
  rationale: Gibt die unbegrenzte beziehungsweise fortdauernde Geltung knapp und natürlich wieder.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung dafür ein, weshalb der Sabbat als Zeichen dient.
- source_word: שֵׁשֶׁת יָמִים
  choice: in sechs Tagen
  rationale: Eine natürliche deutsche Zeitangabe für den Rahmen des Schöpfungshandelns.
- source_word: עָשָׂה
  choice: machte
  rationale: Entspricht dem allgemeinen hebräischen Verb für Gottes Schöpfungshandeln, ohne eine speziellere Bedeutung einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen transparent wieder.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: Himmel und Erde
  rationale: Die im Deutschen feste Gesamtbezeichnung für die geschaffene Welt; „Himmel“ kann im Deutschen kollektiv stehen, obwohl das Hebräische formal einen Plural verwendet.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: und am siebten Tag
  rationale: Bewahrt die schlichte Weiterführung und die Zeitangabe des Hebräischen.
- source_word: שָׁבַת
  choice: hörte er auf
  rationale: Das Verb bezeichnet grundlegend das Aufhören beziehungsweise Ablassen von einer Tätigkeit; die Wiedergabe vermeidet, bereits die traditionellere Deutung „ruhen“ in den Haupttext einzutragen.
- source_word: וַיִּנָּפַשׁ
  choice: atmete auf
  rationale: Bewahrt das anschauliche, anthropomorphe Bild und klingt im modernen Deutschen natürlicher als das wörtlichere „schöpfte Atem“.
theological_decisions:
- issue: Anthropomorphe Rede von Gott in der Sabbatbegründung
  choice: „hörte er auf und atmete auf“
  alternative: „ruhte er und erholte sich“
  rationale: Die lebhafte menschliche Ausdrucksweise des Hebräischen bleibt stehen, ohne sie durch eine abstrakte Erklärung abzuschwächen oder daraus eine Aussage über göttliche Erschöpfung abzuleiten.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: „den Söhnen Israels“
  alternative: „den Israeliten“
  rationale: Die Hauptfassung hält die familiäre Ausdrucksweise des Ausgangstextes sichtbar; die geläufige Sammelbezeichnung wird als Alternative genannt.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: „Jahwe“
  alternative: „der HERR“
  rationale: Die Wiedergabe als Eigenname macht die Form des hebräischen Ausgangstextes transparent.
translation_notes:
  register: Moderne, würdige Standardsprache mit weitgehend formnaher Satzstruktur. „Atmete auf“ erhält die Bildhaftigkeit des Hebräischen, während die Fußnote die wörtlichere Bedeutung offenlegt.
