  text: in the cutting of stone for setting[a], and in the carving of wood, to do every kind of work[b],
translation:
  language: de
  text: im Bearbeiten von Steinen[b] zum Einsetzen[a] und im Schnitzen von Holz, um jede Art von Arbeit auszuführen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Bearbeiten von Steinen für Fassungen“ beziehungsweise „im Gravieren von Steinen zum Einsetzen“.'
    reason: lexical_alternative
  - marker: b
    text: „Steine“ ist hier allgemein formuliert; im Zusammenhang können auch Edelsteine gemeint sein, die für die Arbeiten am Heiligtum verwendet wurden.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: im Bearbeiten / im Schnitzen
  rationale: Das von חרשׁ abgeleitete Wort bezeichnet fachkundige handwerkliche Bearbeitung. Bei Stein bleibt „Bearbeiten“ hinreichend weit, während „Schnitzen“ bei Holz die konkrete Tätigkeit natürlich wiedergibt.
- source_word: אֶבֶן
  choice: Steinen
  rationale: אֶבֶן ist die allgemeine Bezeichnung für Stein. Der Zusammenhang kann Edelsteine einschließen, doch der Vers selbst legt diese engere Bedeutung nicht ausdrücklich fest.
- source_word: לְמַלֹּאת
  choice: zum Einsetzen
  rationale: Im handwerklichen Zusammenhang bezeichnet der Infinitiv das Einsetzen von bearbeiteten Steinen in eine Fassung oder Einlegearbeit. „Zum Einsetzen“ ist idiomatisch und bewahrt die Zielrichtung der Formulierung.
- source_word: עֵץ
  choice: Holz
  rationale: „Holz“ ist die natürliche moderne Wiedergabe des gewöhnlichen Materialbegriffs עֵץ.
- source_word: לַעֲשׂוֹת
  choice: um … auszuführen
  rationale: עשה ist breit gefasst. In Verbindung mit מְלָאכָה gibt „Arbeit ausführen“ den Sinn im Deutschen natürlicher wieder als das wörtlichere „Arbeit tun“.
- source_word: בְּכָל מְלָאכָה
  choice: jede Art von Arbeit
  rationale: מְלָאכָה kann Arbeit, Aufgabe oder fachkundige Tätigkeit bezeichnen. Die Formulierung bewahrt die umfassende Aussage, während der Kontext handwerkliche Arbeit erkennen lässt.
