lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sprach
  rationale: Die traditionelle, würdevolle Erzählform gibt das hebräische wayyiqtol natürlich wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die deutsche Wiedergabe in Kapitälchen folgt der etablierten jüdisch-christlichen Lesetradition für den Gottesnamen, ohne eine unsichere Aussprache festzulegen.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Natürliche deutsche Entsprechung der Anredeformel.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Einleitungsinfinitiv kündigt die folgende direkte Rede an; im heutigen Deutsch erfüllt der Doppelpunkt diese Funktion natürlicher als das redundante „und sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Tetragramms יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: „der HERR“ wahrt die verbreitete Lesetradition und kennzeichnet den Gottesnamen typografisch, ohne eine bestimmte Rekonstruktion seiner Aussprache zum Text zu erheben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeeinleitung wird idiomatisch mit einem Doppelpunkt wiedergegeben; der Vers bleibt als Einleitung zum folgenden Gotteswort erkennbar.
