  text: the tent of meeting[a], and the ark of the testimony, and the mercy seat that is on it[b], and all the furnishings of the tent—
translation:
  language: de
  text: das Zelt der Begegnung und die Lade des Zeugnisses[a], die Sühneplatte[b], die auf ihr liegt, und alle Geräte des Zeltes —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Lade für das Zeugnis“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Deckplatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Wendung gibt den kultischen Ort wieder, an dem Gott Israel begegnet; sie ist im Deutschen natürlich und bleibt nahe an der hebräischen Fügung.
- source_word: הָאָרֹן לָעֵדֻת
  choice: Lade des Zeugnisses
  rationale: Der Ausdruck bezeichnet die Lade in ihrer Beziehung zum Zeugnis. Der Genitiv ist im Deutschen die geläufigste und verständlichste Form; die stärker zweckbezogene Wiedergabe wird in einer Fußnote bewahrt.
- source_word: הַכַּפֹּרֶת
  choice: Sühneplatte
  rationale: Das Wort bezeichnet die goldene Deckplatte auf der Lade und ist zugleich mit dem Sühneritus verbunden. „Sühneplatte“ wahrt Gegenstandsbezug und kultische Bedeutung, ohne eine bestimmte dogmatische Deutung auszuformulieren.
- source_word: אֲשֶׁר עָלָיו
  choice: die auf ihr liegt
  rationale: Das Suffix bezieht sich auf die Lade. „Auf ihr liegt“ drückt die räumliche Beziehung in natürlichem Deutsch eindeutig aus.
- source_word: כָּל כְּלֵי הָאֹהֶל
  choice: alle Geräte des Zeltes
  rationale: כְּלִים ist ein weiter Sammelbegriff für die zum Heiligtum gehörenden Gegenstände; „Geräte“ ist hier präzise und gut verständlich.
theological_decisions:
- issue: Wiedergabe von כַּפֹּרֶת im Heiligtumskontext
  choice: Sühneplatte
  alternative: Deckplatte; traditionell auch Gnadenthron
  rationale: Der Ausdruck bezeichnet konkret die Platte auf der Lade, trägt aber durch ihren rituellen Gebrauch eine Sühnebedeutung. „Sühneplatte“ hält beide Aspekte zusammen; die Fußnote nennt die gegenständlichere Alternative, ohne die kultische Bedeutung aus dem Haupttext zu entfernen.
