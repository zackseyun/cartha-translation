  yaml_path: translation/ot/exodus/031/011.yaml
  text: and the anointing oil[a], and the fragrant incense for the holy place. They shall make them according to all that I have commanded you.
translation:
  language: de
  text: und das Salböl und das wohlriechende Räucherwerk für das Heiligtum. Sie sollen alles so anfertigen, wie ich es dir geboten habe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: das Salböl
  rationale: Die geläufige deutsche Zusammensetzung gibt das für die Salbung bestimmte Öl knapp und kultisch passend wieder, ohne das im Ausdruck nicht ausdrücklich stehende Adjektiv „heilig“ hinzuzufügen.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: das wohlriechende Räucherwerk
  rationale: Der Ausdruck bezeichnet Räucherwerk aus aromatischen Stoffen. „Wohlriechendes Räucherwerk“ ist im modernen Deutsch verständlich und bewahrt den Duftaspekt.
- source_word: לַקֹּדֶשׁ
  choice: für das Heiligtum
  rationale: Im Zusammenhang der Stiftshütte bezeichnet קֹדֶשׁ den heiligen Bereich beziehungsweise die kultische Bestimmung. „Für das Heiligtum“ ist natürlich und lässt offen, ob der räumliche Ort oder der dortige Gebrauch im Vordergrund steht.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִךָ
  choice: alles so …, wie ich es dir geboten habe
  rationale: Diese deutsche Formulierung erhält sowohl den umfassenden Sinn von כְּכֹל als auch die direkte Anrede an Mose.
- source_word: יַעֲשׂוּ
  choice: Sie sollen … anfertigen
  rationale: Die dritte Person Plural verweist auf die zuvor genannten Handwerker. „Sollen anfertigen“ entspricht dem anweisenden Ton und passt zu den herzustellenden Kultgegenständen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers setzt eine vorausgehende Aufzählung fort; deshalb beginnt er mit „und“. „Heiligtum“ wahrt die kultische Bedeutung, ohne den Ausdruck unnötig auf einen bestimmten Teilraum festzulegen.
