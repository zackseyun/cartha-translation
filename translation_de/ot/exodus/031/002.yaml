lexical_decisions:
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ von ראה lenkt nachdrücklich die Aufmerksamkeit auf das Folgende. „Sieh“ bewahrt die Direktheit des Hebräischen in würdigem, verständlichem Deutsch.
- source_word: קָרָאתִי
  choice: ich habe … berufen
  rationale: Das Qal Perfekt 1. Person Singular von קרא bezeichnet hier zusammen mit בְּשֵׁם ein gezieltes Rufen beziehungsweise Erwählen. „Berufen“ ist im Deutschen natürlich und vermeidet die mögliche Fehlvorstellung, es gehe nur um das Aussprechen eines Namens.
- source_word: בְּשֵׁם
  choice: beim Namen
  rationale: Die Wendung קרא בשם wird idiomatisch mit „beim Namen berufen“ wiedergegeben und bewahrt den Gedanken der persönlichen, bestimmten Auswahl.
- source_word: בְּצַלְאֵל
  choice: Bezalel
  rationale: Der Personenname wird nach üblicher deutscher biblischer Namensform transliteriert.
- source_word: בֶּן
  choice: Sohn
  rationale: In dieser genealogischen Zuordnung bedeutet בֶּן jeweils unmittelbar „Sohn“.
- source_word: אוּרִי
  choice: Uri
  rationale: Der Personenname wird in der etablierten deutschen Form wiedergegeben.
- source_word: חוּר
  choice: Hur
  rationale: Der Personenname wird in der etablierten deutschen Form wiedergegeben.
- source_word: לְמַטֵּה
  choice: aus dem Stamm
  rationale: מַטֶּה bezeichnet in diesem genealogisch-tribalen Zusammenhang den Stamm; לְ markiert die Zugehörigkeit. „Aus dem Stamm“ ist im Deutschen eine natürliche Herkunfts- und Zugehörigkeitsangabe.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Der Stammesname wird in der etablierten deutschen biblischen Form wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang von קָרָאתִי בְשֵׁם
  choice: „beim Namen berufen“
  alternative: „namentlich bestimmt“ oder „beim Namen gerufen“
  rationale: Die Übersetzung bewahrt sowohl das konkrete persönliche Rufen als auch den kontextuellen Sinn gezielter Auswahl, ohne ausdrücklich eine weitergehende Amtslehre einzutragen.
