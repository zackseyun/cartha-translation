  source_fidelity: Der Text gibt die hebräische Aufzählung und die Aussage einer bereits gewährten Befähigung zuverlässig wieder. »Und ich habe ihn ... erfüllt« ist für וָאֲמַלֵּא im Kontext gut begründet. »Mit Geschick für jede Art von Arbeit« vermittelt בְּכָל־מְלָאכָה kontextgerecht als umfassende handwerklich-künstlerische Befähigung, ohne den Begriff unzulässig auf eine einzelne Tätigkeit einzuengen.
