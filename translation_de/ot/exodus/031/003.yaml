source:
  edition: WLC
  text: וָ/אֲמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה וּ/בִ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/003.yaml
  text: And I have filled him with the Spirit of God[a], with wisdom, with understanding, with knowledge, and with every kind of craftsmanship,
translation:
  language: de
  text: Und ich habe ihn mit dem Geist Gottes[a] erfüllt, mit Weisheit, mit Verständnis, mit Erkenntnis und mit Geschick für jede Art von Arbeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit göttlichem Geist«. Die hebräische Wendung kann allgemeiner verstanden werden; hier bezeichnet sie wahrscheinlich Gottes eigenen Geist, der Bezalel befähigt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲמַלֵּא
  choice: Und ich habe … erfüllt
  rationale: Das Verb מלא bedeutet »füllen, erfüllen«. Die Perfektform bezeichnet hier am besten eine bereits vollzogene Ausstattung, die gegenwärtig wirksam ist.
- source_word: אֹתוֹ
  choice: ihn
  rationale: Das direkte Objekt verweist im unmittelbaren Zusammenhang auf Bezalel.
- source_word: רוּחַ אֱלֹהִים
  choice: mit dem Geist Gottes
  rationale: Die Konstruktverbindung kann Gottes eigenen Geist oder allgemeiner einen göttlichen Geist bezeichnen. Im Zusammenhang der Bevollmächtigung Bezalels für den Heiligtumsbau ist »der Geist Gottes« die wahrscheinlichste Wiedergabe.
- source_word: בְּחָכְמָה
  choice: mit Weisheit
  rationale: Die Präposition ב bezeichnet hier die Ausstattung beziehungsweise Befähigung; »mit Weisheit« ist im Deutschen natürlich und sachlich genau.
- source_word: וּבִתְבוּנָה
  choice: mit Verständnis
  rationale: תבונה bezeichnet Verständnis, Einsicht oder Urteilsvermögen. »Verständnis« bewahrt die klare Dreierfolge mit Weisheit und Erkenntnis.
- source_word: וּבְדַעַת
  choice: mit Erkenntnis
  rationale: דעת bezeichnet Wissen oder Erkenntnis. »Erkenntnis« passt in diesem Kontext zu einer von Gott verliehenen sachkundigen Befähigung und bildet eine natürliche Verbindung mit Weisheit und Verständnis.
- source_word: וּבְכָל מְלָאכָה
  choice: mit Geschick für jede Art von Arbeit
  rationale: מלאכה kann Arbeit, Tätigkeit oder handwerkliches Schaffen bezeichnen. Im Kontext des Baus der Stiftshütte bringt »Geschick« die praktische Kunstfertigkeit zum Ausdruck, während »jede Art von Arbeit« die Breite von כל מְלָאכָה wahrt.
theological_decisions:
- issue: Ob רוּחַ אֱלֹהִים als Gottes eigener Geist oder allgemeiner als göttlicher Geist zu verstehen ist
  choice: der Geist Gottes
  alternative: göttlicher Geist
  rationale: Der unmittelbare Kontext beschreibt Gottes eigene Befähigung Bezalels zum heiligen Dienst. Daher liegt der Bezug auf Gottes eigenen, wirkenden Geist nahe; die sprachlich mögliche allgemeinere Deutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Präposition »mit« bewahrt die hebräische Aufzählungsstruktur und macht deutlich, worin die von Gott verliehene Befähigung besteht. Der handwerklich-künstlerische Kontext wird durch »Geschick« erkennbar, ohne מְלָאכָה auf nur eine einzelne Kunstform einzuengen.
