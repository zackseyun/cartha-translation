base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/018.yaml
  text: And when he finished speaking with him on Mount Sinai[a], he gave Moses the two tablets of the testimony, tablets of stone, written with the finger of God.
translation:
  language: de
  text: Als er aufgehört hatte, mit ihm auf dem Berg Sinai zu reden, gab er Mose die beiden Tafeln des Zeugnisses, steinerne Tafeln, geschrieben mit dem Finger Gottes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „durch den Finger Gottes geschrieben“. Die hebräische Wendung schreibt die Beschriftung anschaulich unmittelbar Gott zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: gab er
  rationale: Das Wayyiqtol von נתן führt die Erzählung fort. Die deutsche Satzstellung macht den zeitlichen Zusammenhang natürlich verständlich, ohne den Handlungsablauf zu verändern.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: als er aufgehört hatte, … zu reden
  rationale: כְּ mit dem Infinitiv von כלה bezeichnet hier den Zeitpunkt, an dem das Reden beendet war. Die Formulierung gibt den Abschluss der Handlung idiomatisch wieder.
- source_word: אִתּוֹ
  choice: mit ihm
  rationale: Das Pronomen bezieht sich im Kontext am ehesten auf Mose. Die pronominale Form des Hebräischen bleibt erhalten, statt den Namen erneut einzusetzen.
- source_word: בְּהַר סִינַי
  choice: auf dem Berg Sinai
  rationale: Dies ist die natürliche deutsche Ortsangabe für ein Geschehen auf einem Berg.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: die beiden Tafeln des Zeugnisses
  rationale: עֵדוּת bezeichnet Zeugnis oder Bezeugung und hat hier einen besonderen bundesbezogenen Sinn. „Zeugnis“ bewahrt den Leitbegriff, ohne ihn auf eine Auslegung wie „Bundesurkunde“ zu verengen.
- source_word: לֻחֹת אֶבֶן
  choice: steinerne Tafeln
  rationale: Die Wendung bezeichnet das Material der Tafeln. Als Apposition bleibt die Wiederholung von „Tafeln“ und damit der Nachdruck des Hebräischen erhalten.
- source_word: כְּתֻבִים
  choice: beschrieben
  rationale: Das passive Partizip von כתב bedeutet „geschrieben/beschrieben“. „Beschrieben“ passt im Deutschen natürlich zu Tafeln und bleibt weniger deutend als „eingraviert“.
- source_word: בְּאֶצְבַּע אֱלֹהִים
  choice: mit dem Finger Gottes
  rationale: Das instrumentale בְּ bezeichnet das Mittel. Die konkrete, anthropomorphe Bildsprache und die unmittelbare göttliche Urheberschaft werden bewahrt.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים bezeichnet hier den Gott Israels und ist dem Sinn nach singularisch.
theological_decisions:
- issue: Anthropomorphe Aussage über die göttliche Urheberschaft
  choice: mit dem Finger Gottes
  alternative: unmittelbar von Gott; durch Gottes Macht
  rationale: Die anschauliche hebräische Wendung soll weder vergeistigt noch erklärend aufgelöst werden. Sie hebt hervor, dass die Beschriftung unmittelbar Gott zugeschrieben wird.
- issue: Bundesbezogene Bedeutung von עֵדוּת
  choice: Tafeln des Zeugnisses
  alternative: Tafeln der Bundesurkunde; Tafeln des Bundeszeugnisses
  rationale: „Zeugnis“ lässt den kultischen und bundesbezogenen Gehalt bestehen, ohne eine im Ausdruck nicht ausdrücklich genannte Deutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der appositionale Nachdruck des Hebräischen („Tafeln … Tafeln“) bleibt erhalten. Die Pronomen „er“ und „ihm“ werden wie im Ausgangstext nicht durch Namen ersetzt; der Kontext identifiziert Gott als Handelnden und Mose als Gesprächspartner.
