  naturalness: Der Satz ist insgesamt idiomatisches, würdiges modernes Standarddeutsch. „Geschrieben mit dem Finger Gottes“ ist zugleich natürlicher und unmittelbarer als „beschrieben mit dem Finger Gottes“.
  terminology: „Mose“, „Berg Sinai“, „Tafeln des Zeugnisses“ und „Finger Gottes“ sind sachgerecht. „Zeugnis“ bewahrt die offene, im Pentateuch etablierte Terminologie von עֵדוּת, ohne sie zu einer bestimmten Bundesdeutung auszuweiten.
