  text: He made curtains of goats’ hair for a tent over the tabernacle[a]; he made eleven curtains.
translation:
  language: de
  text: Er machte Zeltbahnen aus Ziegenhaar[a] als Zelt über der Wohnung; elf Zeltbahnen machte er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus Ziegen“. Im Kontext dieser gewebten Bahnen ist wahrscheinlich Ziegenhaar gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשָׂה
  choice: er machte / machte er
  rationale: עשה ist das gewöhnliche Verb für „machen“. Die Wiederholung des hebräischen Verbs bleibt erhalten und setzt am Satzende einen dem Ausgangstext entsprechenden Nachdruck.
- source_word: יְרִיעֹת
  choice: Zeltbahnen
  rationale: Im Heiligtumskontext bezeichnet יְרִיעָה große textile Bahnen. „Zeltbahnen“ ist im Deutschen anschaulicher und präziser als das leicht missverständliche „Vorhänge“.
- source_word: עִזִּים
  choice: aus Ziegenhaar
  rationale: Wörtlich steht lediglich „Ziegen“. Im Zusammenhang mit den gewebten Bahnen ist Ziegenhaar als Material gemeint; diese Ergänzung macht den impliziten Sinn natürlich verständlich, ohne Ziegenleder anzunehmen.
- source_word: לְאֹהֶל
  choice: für ein Zeltdach
  rationale: Die Präposition לְ bezeichnet hier Funktion oder Zweck. „Zeltdach“ verdeutlicht, dass die Bahnen eine zeltartige Deckschicht über der Wohnung bildeten, nicht ein davon unabhängiges Zelt.
- source_word: עַל
  choice: über
  rationale: עַל bezeichnet hier die Lage der Deckschicht oberhalb der Wohnung; „über“ ist die natürliche deutsche Entsprechung.
- source_word: הַמִּשְׁכָּן
  choice: der Wohnung
  rationale: מִשְׁכָּן bezeichnet wörtlich die „Wohnung“ und ist in Exodus der Fachausdruck für das tragbare Heiligtum. „Wohnung“ bewahrt den Bedeutungsbezug zum Wohnen Gottes und unterscheidet sie vom darüberliegenden Zeltdach.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: elf
  rationale: Die zusammengesetzte Zahl bedeutet eindeutig „elf“.
- source_word: אֹתָם
  choice: in „elf Zeltbahnen machte er“ aufgenommen
  rationale: Das Objektpronomen verweist auf die Zeltbahnen. Durch die erneute Nennung des Substantivs wird sein Bezug im Deutschen vollständig und dem hebräischen Satzbau entsprechend wiedergegeben.
theological_decisions:
- issue: Wiedergabe von הַמִּשְׁכָּן als Bezeichnung des Heiligtums
  choice: die Wohnung
  alternative: die Stiftshütte
  rationale: „Wohnung“ gibt die Grundbedeutung des hebräischen Fachworts wieder und hält die theologische Vorstellung von Gottes Wohnen unter seinem Volk präsent. „Stiftshütte“ ist traditionell, im modernen Deutsch jedoch sprachlich schwerer zugänglich und etymologisch weniger transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bewahrt die markante Wiederholung von „machen“ und die abschließende Hervorhebung der Zahl. „Zeltbahnen“ und „Zeltdach“ vermeiden die im Deutschen mögliche Vorstellung gewöhnlicher Fenstervorhänge.
