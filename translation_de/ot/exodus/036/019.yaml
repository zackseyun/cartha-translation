translation:
  language: de
  text: Er machte für das Zelt eine Decke aus rot gefärbten Widderfellen und darüber eine Decke aus feinem Leder[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung des hebräischen Wortes תְּחָשִׁים (techaschim) ist unsicher. Vorgeschlagen wurden unter anderem Häute von Seekühen, Schweinswalen oder Dugongs; traditionell wurde es auch mit „Dachsfelle“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er machte
  rationale: Das Wayyiqtol von עשה bezeichnet eine weitere Handlung in der Erzählfolge. „Er machte“ gibt den einfachen verbalen Sinn knapp und natürlich wieder.
- source_word: מִכְסֶה לָאֹהֶל
  choice: für das Zelt eine Decke
  rationale: מִכְסֶה bezeichnet eine bedeckende Schicht, אֹהֶל wörtlich ein „Zelt“. Die Formulierung bewahrt diese konkrete Bedeutung, statt hier den weiter gefassten Begriff „Stiftshütte“ einzusetzen.
- source_word: עֹרֹת אֵלִים מְאָדָּמִים
  choice: aus rot gefärbten Widderfellen
  rationale: Die Wendung nennt Felle von Widdern, die gerötet beziehungsweise rot gefärbt wurden. „Rot gefärbt“ gibt diesen Vorgang deutlicher wieder als bloß „rot“.
- source_word: וּמִכְסֵה
  choice: und … eine Decke
  rationale: Der hebräische Text wiederholt das Wort für „Decke“. Diese Wiederholung bleibt erhalten; „eine zweite Decke“ wäre eine sachlich naheliegende, aber nicht ausdrücklich formulierte Präzisierung.
- source_word: עֹרֹת תְּחָשִׁים
  choice: aus feinem Leder
  rationale: Die Tier- oder Materialbezeichnung תְּחָשִׁים ist ungeklärt. „Feines Leder“ vermeidet eine spekulative zoologische Festlegung; mögliche konkretere Deutungen werden in der Fußnote genannt.
- source_word: מִלְמָעְלָה
  choice: darüber
  rationale: Das Wort bezeichnet die Lage oberhalb der zuvor genannten Decke. „Darüber“ drückt diese räumliche Beziehung im Deutschen knapp und idiomatisch aus.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit schlichter und würdiger Erzählweise. Die Wiederholung von „Decke“ folgt dem Hebräischen; die ungeklärte Materialbezeichnung wird im Haupttext vorsichtig und in der Fußnote transparent wiedergegeben.
