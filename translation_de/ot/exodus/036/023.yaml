translation:
  language: de
  text: 'Er fertigte die Bretter für die Stiftshütte an: zwanzig Bretter für die Südseite[a], nach Süden hin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwanzig Rahmen für die Südseite“. Im Hebräischen steht eine doppelte Südangabe („Süden, südwärts“), die der Hervorhebung oder näheren Bestimmung dient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er fertigte … an
  rationale: Das Qal-Wayyiqtol von עשה führt die vergangene Handlung in der Erzählfolge fort. „Anfertigen“ passt im Deutschen natürlich zum handwerklichen Zusammenhang.
- source_word: הַקְּרָשִׁים
  choice: die Rahmen
  rationale: קֶרֶשׁ bezeichnet hier die aufrecht stehenden Bauteile der Stiftshütte. „Rahmen“ gibt ihre konstruktive Funktion wieder; möglich ist auch „Bretter“.
- source_word: לַמִּשְׁכָּן
  choice: für die Stiftshütte
  rationale: מִשְׁכָּן ist in diesem Zusammenhang die heilige Zeltwohnung. „Stiftshütte“ ist die etablierte, im Deutschen verständliche Bezeichnung.
- source_word: עֶשְׂרִים קְרָשִׁים
  choice: zwanzig Rahmen
  rationale: Die Wiederholung des Substantivs wird beibehalten und entspricht dem sachlichen Inventarstil des Abschnitts.
- source_word: לִפְאַת
  choice: für die …seite
  rationale: פֵּאָה bezeichnet hier eine Seite beziehungsweise Außenseite des Bauwerks.
- source_word: נֶגֶב
  choice: Süd-
  rationale: נֶגֶב wird hier als Himmelsrichtung gebraucht, nicht als Eigenname der Landschaft Negev.
- source_word: תֵּימָנָה
  choice: nach Süden hin
  rationale: Die Richtungsform verstärkt beziehungsweise präzisiert die vorangehende Südangabe. Die Formulierung bewahrt diese Doppelung in natürlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sachlichem Ton. Die konstruktive Bedeutung von קֶרֶשׁ wird im Haupttext mit „Rahmen“ wiedergegeben; die traditionelle Alternative „Bretter“ steht in der Fußnote. Die hebräische Richtungsdoppelung bleibt erkennbar, ohne im Deutschen unnötig sperrig zu klingen.
