  text: וַ/יְחַבֵּר֙ אֶת חֲמֵ֣שׁ הַ/יְרִיעֹ֔ת אַחַ֖ת אֶל אֶחָ֑ת וְ/חָמֵ֤שׁ יְרִיעֹת֙ חִבַּ֔ר אַחַ֖ת אֶל אֶחָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/010.yaml
  text: He joined five of the curtains to one another[a], and the other five curtains he joined to one another.
translation:
  language: de
  text: Er verband fünf Zeltbahnen miteinander, und die anderen fünf Zeltbahnen verband er ebenfalls miteinander.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im zweiten Satzteil: „und fünf Zeltbahnen verband er, eine an die andere“. Die Zusätze „die anderen“ und „ebenfalls“ verdeutlichen, dass die zweite Gruppe von fünf Bahnen gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר / חִבַּר
  choice: verband
  rationale: חבר bezeichnet das Verbinden oder Zusammenfügen. „Verband“ ist im Bauzusammenhang natürlich und legt die genaue Befestigungsweise nicht über den hebräischen Text hinaus fest.
- source_word: יְרִיעֹת
  choice: Zeltbahnen
  rationale: Im Zusammenhang der Stiftshütte sind große Stoffbahnen gemeint. „Zeltbahnen“ ist im modernen Deutschen anschaulicher und genauer als das leicht missverständliche „Vorhänge“.
- source_word: חֲמֵשׁ
  choice: fünf
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: אַחַת אֶל אֶחָת
  choice: miteinander
  rationale: Die Wendung beschreibt, dass die einzelnen Bahnen innerhalb jeder Fünfergruppe aneinandergefügt wurden. „Miteinander“ gibt dies idiomatisch und knapp wieder.
- source_word: וְחָמֵשׁ יְרִיעֹת
  choice: die anderen fünf Zeltbahnen
  rationale: Wörtlich steht „und fünf Zeltbahnen“. Aus dem parallelen Satzbau ergibt sich, dass die zweite Fünfergruppe gemeint ist; „die anderen“ macht dies im Deutschen verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bewahrt die Hervorhebung der zweiten Fünfergruppe; die ergänzenden Wörter werden durch eine Fußnote offengelegt.
