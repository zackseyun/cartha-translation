translation:
  language: de
  text: 'und ihre vierzig Sockel aus Silber: zwei Sockel unter dem einen Brett[a] und zwei Sockel unter dem einen Brett.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwei Sockel unter dem einen Rahmen und zwei Sockel unter dem einen Rahmen“. Im Hebräischen steht in beiden Satzgliedern wörtlich dieselbe Formulierung „dem einen Brett/Rahmen“; sinngemäß könnte man beim zweiten Vorkommen auch „dem anderen Brett“ sagen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבָּעִים
  choice: und … vierzig
  rationale: Die Konjunktion führt die Baubeschreibung fort; die deutsche Wortstellung verbindet sie natürlich mit der gesamten Nominalgruppe.
- source_word: אַדְנֵיהֶם
  choice: ihre … Sockel
  rationale: אֶדֶן bezeichnet hier die tragenden Aufnahmen unter den Rahmenteilen. „Sockel“ ist im modernen Deutschen anschaulich und baulich passend.
- source_word: כָּסֶף
  choice: aus Silber
  rationale: Das Substantiv bezeichnet das Material. „Sockel aus Silber“ ist im Deutschen natürlicher und eindeutiger als eine bloße attributive Verbindung.
- source_word: שְׁנֵי אֲדָנִים
  choice: zwei Sockel
  rationale: Die wiederholte Wendung wird in beiden Satzgliedern gleich und in Übereinstimmung mit אַדְנֵיהֶם wiedergegeben.
- source_word: תַּחַת
  choice: unter
  rationale: Die Präposition bezeichnet die räumliche Anordnung der Sockel unter jedem Rahmenteil.
- source_word: הַקֶּרֶשׁ
  choice: dem … Rahmen
  rationale: קֶרֶשׁ bezeichnet im Heiligtumsbau ein aufrechtes tragendes Bauteil. „Rahmen“ vermittelt diese Funktion gegenwärtigen Lesern; „Brett“ bleibt eine mögliche, stärker formbezogene Wiedergabe.
- source_word: הָאֶחָד
  choice: dem einen
  rationale: Der bestimmte Artikel und das Zahlwort werden eng am Hebräischen wiedergegeben. Da die Vorlage dieselbe Formulierung zweimal verwendet, wird sie auch im Deutschen wiederholt und nicht stillschweigend zu „dem anderen“ geändert.
