base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/034.yaml
  text: He overlaid the frames with gold[a], and made their rings of gold as holders for the bars[b], and overlaid the bars with gold.
translation:
  language: de
  text: Die Rahmen überzog er mit Gold[a]. Ihre Ringe fertigte er aus Gold als Halterungen für die Querstangen[b], und auch die Querstangen überzog er mit Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bretter«. Das hebräische Wort bezeichnet die tragenden hölzernen Bauteile der Wohnstätte.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Häuser für die Querstangen«, eine Bezeichnung für deren Halterungen oder Aufnahmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: die Rahmen
  rationale: Das Wort bezeichnet hier die aufrechten hölzernen Bauteile der Wohnstätte. »Rahmen« gibt ihre tragende Funktion in verständlichem modernem Deutsch wieder; »Bretter« bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: צִפָּה / וַיְצַף
  choice: überzog
  rationale: Das Verb bezeichnet hier das Überziehen eines Gegenstands mit einer Materialschicht und wird an beiden Stellen einheitlich wiedergegeben.
- source_word: זָהָב
  choice: Gold
  rationale: Die drei Nennungen des Materials im Hebräischen werden beibehalten, soweit dies im Deutschen natürlich möglich ist; beim dritten Vorkommen steht »mit Gold«, beim zweiten »aus Gold«.
- source_word: טַבְּעֹתָם
  choice: ihre Ringe
  rationale: Die Form bezeichnet die zu den Rahmen gehörenden Metallringe; das Possessivsuffix wird ausdrücklich wiedergegeben.
- source_word: עָשָׂה
  choice: fertigte
  rationale: »Fertigte« gibt das Herstellen der goldenen Ringe in diesem handwerklichen Zusammenhang natürlich und präzise wieder.
- source_word: בָּתִּים
  choice: Halterungen
  rationale: Wörtlich »Häuser«; hier sind funktional Aufnahmen oder Halterungen gemeint, welche die Querstangen aufnehmen.
- source_word: לַבְּרִיחִם
  choice: für die Querstangen
  rationale: Die Stangen liefen quer über die aufrechten Bauteile und verbanden sie; »Querstangen« macht diese bauliche Funktion klar.
