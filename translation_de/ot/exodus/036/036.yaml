  yaml_path: translation/ot/exodus/036/036.yaml
  text: He made for it four pillars of acacia wood and overlaid them with gold[a]; their hooks were of gold[b]; and he cast for them four silver bases.
translation:
  language: de
  text: Er fertigte für ihn[a] vier Säulen aus Akazienholz an und überzog sie mit Gold. Ihre Haken waren aus Gold, und für sie goss er vier Sockel aus Silber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der Vorhang aus dem vorhergehenden Vers.
    reason: cross_reference
lexical_decisions:
- source_word: עַמּוּדֵי
  choice: Säulen
  rationale: Das Wort bezeichnet aufrecht stehende tragende Elemente. »Säulen« ist im Zusammenhang des Heiligtums präzise und im modernen Deutsch natürlich.
- source_word: שִׁטִּים
  choice: Akazienholz
  rationale: Gemeint ist das im Heiligtum verwendete Akazienholz; die Sachbezeichnung ist verständlicher als eine Transliteration.
- source_word: וַיְצַפֵּם
  choice: überzog sie
  rationale: Das Verb bezeichnet hier das Belegen der Holzsäulen mit einer Metallschicht; »überziehen« ist dafür die übliche präzise Formulierung.
- source_word: וָוֵיהֶם
  choice: ihre Haken
  rationale: Das Substantiv bezeichnet in diesem Bauzusammenhang am ehesten Haken beziehungsweise Verbindungselemente an den Säulen.
- source_word: אַדְנֵי
  choice: Sockel
  rationale: Gemeint sind die metallenen Stand- oder Fundamentstücke, in denen die Säulen befestigt wurden. »Sockel« ist klar und sachgerecht.
- source_word: כָסֶף
  choice: Silber
  rationale: Eindeutige Bezeichnung des Metalls, aus dem die Sockel bestanden.
- source_word: לָהּ
  choice: für ihn
  rationale: Das feminine hebräische Pronomen verweist im Zusammenhang auf den Vorhang aus dem vorhergehenden Vers. Im Deutschen richtet sich das Pronomen grammatisch nach dem maskulinen »Vorhang«.
- source_word: וַיִּצֹק
  choice: goss er
  rationale: Bei der Herstellung metallener Sockel bezeichnet das Verb das Gießen von Metall in eine Form.
