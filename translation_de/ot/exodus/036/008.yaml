    rationale: »als Kunstweberarbeit« ist im Deutschen keine geläufige Prädikatsergänzung und lässt die Beziehung zu den Kerubim unklar. Der hebräische Ausdruck beschreibt kunstvoll geplante bzw. ausgeführte Textilarbeit; »kunstvoll eingewebt« bildet dies im Kontext idiomatisch ab.
  - severity: low
    issue: Karmesin wird nicht ausdrücklich als Garn/Textilmaterial markiert
    rationale: Die hebräische Reihung nennt farbige textile Materialien. Da Blau und Purpur im Entwurf als Garn bezeichnet werden, sollte dies auch für Karmesin erkennbar sein, damit nicht bloß eine abstrakte Farbe entsteht.
