  text: וַ/יַּעֲשׂ֨וּ כָל חֲכַם לֵ֜ב בְּ/עֹשֵׂ֧י הַ/מְּלָאכָ֛ה אֶת הַ/מִּשְׁכָּ֖ן עֶ֣שֶׂר יְרִיעֹ֑ת שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תוֹלַ֣עַת שָׁנִ֔י כְּרֻבִ֛ים מַעֲשֵׂ֥ה חֹשֵׁ֖ב עָשָׂ֥ה אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/008.yaml
  text: And every skillful man among those doing the work made the tabernacle with ten curtains of finely twisted linen[a], and blue, and purple, and scarlet yarn; he made them with cherubim[b], the work of a skillful designer.
translation:
  language: de
  text: 'Und alle kunstfertigen Männer, die an der Arbeit beteiligt waren, machten die Wohnung: zehn Zeltbahnen aus gezwirntem Feinleinen sowie blauem, purpurfarbenem und karmesinfarbenem Garn. Mit kunstvoll eingewebten Kerubim fertigte er sie an.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht am Versanfang »sie machten«, am Ende jedoch »er fertigte sie an«.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: kunstfertige Männer
  rationale: Wörtlich »weise von Herzen«; im handwerklichen Zusammenhang bezeichnet die Wendung fachkundige und kunstfertige Handwerker. Der maskuline Plural wird sichtbar bewahrt.
- source_word: בְּעֹשֵׂי הַמְּלָאכָה
  choice: unter denen, die die Arbeit ausführten
  rationale: Die Präposition mit dem Partizip ordnet die Kunstfertigen der Gruppe der am Werk Tätigen zu.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: Das Substantiv bezeichnet hier das Heiligtum als Gottes Wohnstätte. »Wohnung« bewahrt den Wortgehalt und ist im Exodus-Kontext als Fachbezeichnung verständlich.
- source_word: יְרִיעֹת
  choice: Zeltbahnen
  rationale: Gemeint sind große Stoffbahnen, aus denen die Wohnung zusammengesetzt wurde; »Zeltbahnen« ist präziser als das im Deutschen leicht missverständliche »Vorhänge«.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: gezwirntes Feinleinen
  rationale: Die Wendung bezeichnet feines Leinen aus gezwirntem Faden und bewahrt damit die konkrete textile Herstellungsangabe.
- source_word: תְכֵלֶת
  choice: blaues Garn
  rationale: Der Ausdruck bezeichnet einen kostbaren blauen beziehungsweise blaupurpurnen Farbstoff oder das entsprechend gefärbte Material; im Textilkontext wird »Garn« ergänzt.
- source_word: אַרְגָּמָן
  choice: purpurfarbenes Garn
  rationale: Standardentsprechung für purpurgefärbtes Material; das gemeinsam gesetzte »Garn« verdeutlicht den textilen Bezug.
- source_word: תוֹלַעַת שָׁנִי
  choice: Karmesin
  rationale: Die feste Farbstoffbezeichnung meint scharlach- beziehungsweise karmesinrot gefärbtes Material. »Karmesin« hält die knappe substantivische Form des Hebräischen fest.
- source_word: כְּרֻבִים
  choice: Kerubim
  rationale: Eingebürgerte deutsche Bibelbezeichnung, die den kultischen und bildhaften Bezug wahrt.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: als Kunstweberarbeit
  rationale: Die Wendung bezeichnet kunstvoll geplante und gewebte Arbeit; »Kunstweberarbeit« ist im Zusammenhang mit den eingewebten Kerubim konkreter als »Arbeit eines Künstlers«.
- source_word: עָשָׂה אֹתָם
  choice: fertigte er sie an
  rationale: Der abschließende hebräische Satz hat entgegen dem pluralischen Beginn ein singularisches Verb. Diese auffällige Form wird nicht zu »sie fertigten« geglättet.
theological_decisions:
- issue: Geschlechtsbezogene Wiedergabe von חֲכַם לֵב
  choice: kunstfertige Männer
  alternative: kunstfertige Menschen; alle Kunstfertigen
  rationale: Die hebräische Form ist maskulin und bezeichnet hier die Handwerker kollektiv. Die Wiedergabe wahrt diese Form, ohne darüber hinaus eine Aussage über grundsätzliche Geschlechterrollen einzutragen.
- issue: Numeruswechsel beim abschließenden Verb
  choice: fertigte er sie an
  alternative: fertigten sie sie an
  rationale: Der masoretische Text wechselt vom pluralischen וַיַּעֲשׂוּ zum singularischen עָשָׂה. Der Wechsel bleibt als echte syntaktische Spannung erhalten und wird in einer Fußnote erläutert.
- issue: Wiedergabe von הַמִּשְׁכָּן
  choice: die Wohnung
  alternative: die Stiftshütte; das Heiligtumszelt
  rationale: »Wohnung« gibt die Bedeutung des hebräischen Ausdrucks unmittelbar wieder und hält die theologische Vorstellung von Gottes Wohnen unter Israel erkennbar, ohne eine konfessionelle Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sachlichem Handwerksvokabular. Der ungewöhnliche Numeruswechsel des Ausgangstextes wird im Haupttext bewahrt und knapp erläutert. Die Aufzählung der Materialien wird durch einen Doppelpunkt und »sowie« lesbar gegliedert, ohne inhaltliche Elemente hinzuzufügen.
