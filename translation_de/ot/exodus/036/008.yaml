  source_fidelity: 'Die Grundstruktur, die zehn Bahnen, die Textilien/Farben, die Kerubim und der auffällige Wechsel zum Singular beim Schlussverb sind zutreffend erfasst. Korrekturbedarf besteht bei der Wiedergabe von מַעֲשֵׂה חֹשֵׁב: »als Kunstweberarbeit« ist weder eine natürliche deutsche Konstruktion noch gibt sie die Kennzeichnung der Ausführung hinreichend wieder. Die Materialaufzählung sollte zudem Karmesin ebenso eindeutig als textiles Material ausweisen wie Blau und Purpur.'
  naturalness: Der Entwurf ist überwiegend verständlich, aber »Mit Kerubim, als Kunstweberarbeit, fertigte er sie an« wirkt syntaktisch brüchig. Eine Formulierung mit »kunstvoll eingewebten Kerubim« ist modernes, klares Deutsch und wahrt den textilen Zusammenhang.
  terminology: »Wohnung«, »Zeltbahnen«, »Kerubim« und »gezwirntes Feinleinen« sind im gegebenen Exodus-Kontext tragfähige Wiedergaben. »Karmesingarn« stellt den gemeinsamen textilen Bezug der Farbangaben klar. »kunstvoll eingewebt« gibt die sachliche Funktion von מַעֲשֵׂה חֹשֵׁב wieder, ohne die umstrittene technische Einzelbestimmung übermäßig festzulegen.
