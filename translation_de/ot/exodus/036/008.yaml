revisions:
- from: 'Und alle kunstfertigen Männer unter denen, die die Arbeit ausführten, machten die Wohnung aus zehn Zeltbahnen: aus gezwirntem Feinleinen sowie blauem und purpurfarbenem Garn und Karmesin. Mit Kerubim, als Kunstweberarbeit, fertigte er sie an.[a]'
  to: 'Und alle kunstfertigen Männer, die an der Arbeit beteiligt waren, machten die Wohnung: zehn Zeltbahnen aus gezwirntem Feinleinen sowie blauem, purpurfarbenem und karmesinfarbenem Garn. Mit kunstvoll eingewebten Kerubim fertigte er sie an.[a]'
  rationale: Die Revision glättet ausschließlich unidiomatische deutsche Syntax und verdeutlicht den textilen Charakter der dritten Farbangabe. Der im masoretischen Text vorhandene Numeruswechsel bleibt im Haupttext bewusst erhalten und wird an derselben Stelle erläutert. Die Bezeichnung »Wohnung« wird nicht ersetzt, da sie die Grundbedeutung von מִשְׁכָּן bewahrt und im Kontext verständlich ist.
