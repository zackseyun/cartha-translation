base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/003.yaml
  text: And they took from before Moses all the contribution that the sons of Israel had brought for the work of the service of the sanctuary[a], to do it[c][b]. But they still kept bringing to him freewill offerings morning after morning.
translation:
  language: de
  text: Sie nahmen von Mose alle Beiträge entgegen, die die Israeliten für die Arbeiten am Dienst des Heiligtums gebracht hatten, um sie auszuführen. Und die Israeliten brachten ihm weiterhin Morgen für Morgen freiwillige Gaben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ מִלִּפְנֵי מֹשֶׁה
  choice: Sie nahmen von Mose … entgegen
  rationale: Die Verbindung gibt die Übergabe aus Moses unmittelbarer Verwahrung natürlich wieder. „Entgegennehmen“ entspricht im Kontext dem Grundsinn „nehmen“, ohne das im Deutschen missverständliche Bild „vor Mose wegnehmen“ zu erzeugen.
- source_word: אֵת כָּל הַתְּרוּמָה
  choice: alle Beiträge
  rationale: תְּרוּמָה bezeichnet hier die für den Bau bereitgestellten Sachspenden. Der kollektive Singular wird im Deutschen idiomatisch als Plural wiedergegeben.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste hebräische Kollektivbezeichnung meint das Volk Israel insgesamt; „Israeliten“ ist modernes, genaues und inklusives Deutsch.
- source_word: לִמְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: für die Arbeiten am Dienst des Heiligtums
  rationale: Die Formulierung bewahrt die beiden Begriffe „Arbeit“ und „Dienst“ und versteht הַקֹּדֶשׁ im Zusammenhang des Heiligtumsbaus als „Heiligtum“.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: um sie auszuführen
  rationale: Das feminine Suffix verweist am ehesten auf die zuvor genannte Arbeit als Gesamtaufgabe. Der deutsche Pluralbezug zu „Arbeiten“ macht diese Zuordnung sprachlich klar, ohne den weiten Sinn von עשה unnötig einzuengen.
- source_word: וְהֵם הֵבִיאוּ אֵלָיו עוֹד
  choice: Doch diese brachten ihm weiterhin
  rationale: Das ausdrücklich gesetzte Pronomen הֵם und עוֹד heben die fortgesetzte Tätigkeit der Israeliten gegenüber der Materialübernahme durch die Handwerker hervor. „Doch … weiterhin“ bildet diesen leichten Kontrast ab.
- source_word: נְדָבָה
  choice: freiwillige Gaben
  rationale: Das Wort bezeichnet aus eigenem Antrieb gegebene Zuwendungen. Der Plural ist wegen der wiederholten Bringhandlungen im Deutschen natürlicher, obwohl das Hebräische einen kollektiven Singular verwendet.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: Morgen für Morgen
  rationale: Die Wiederholung bezeichnet regelmäßige, fortgesetzte Handlung und wird mit einer gleichfalls wiederholenden deutschen Wendung wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Nominalhäufung wird lesbar gegliedert, während die Unterscheidung zwischen Arbeit, Dienst und Heiligtum erhalten bleibt. Keine Fußnote ist erforderlich, da die wesentlichen Bedeutungsnuancen im Haupttext natürlich ausgedrückt werden.
