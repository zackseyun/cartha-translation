lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Und er fertigte … an
  rationale: Die narrative Folgeform führt die Handlung weiter. „Fertigte … an“ ist bei einem kunstvoll hergestellten Textil natürlich und gibt עשה sachgerecht wieder.
- source_word: מָסָךְ
  choice: Vorhang
  rationale: Das Wort bezeichnet hier einen aufgehängten Abschluss am Eingang. „Vorhang“ ist im Deutschen verständlich; die Fußnote grenzt ihn vom inneren Trennvorhang (פָּרֹכֶת) ab.
- source_word: לְפֶתַח הָאֹהֶל
  choice: für den Eingang des Zeltes
  rationale: Die Formulierung gibt die Zweck- beziehungsweise Zuordnungsbeziehung von לְ und die gewöhnlichen Substantive פֶּתַח und אֹהֶל direkt und idiomatisch wieder.
- source_word: תְּכֵלֶת וְאַרְגָּמָן
  choice: blauem und purpurfarbenem Garn
  rationale: Die Farbbezeichnungen beziehen sich im Textilkontext auf gefärbtes Material. „Garn“ macht diesen Zusammenhang deutlich, ohne die Farbtöne enger festzulegen, als es der hebräische Text erlaubt.
- source_word: וְתוֹלַעַת שָׁנִי
  choice: Karmesin
  rationale: Die feste Wendung bezeichnet ein intensiv rotes, mit Scharlach beziehungsweise Karmesin gefärbtes Textilmaterial. „Karmesin“ bewahrt den traditionellen Farb- und Farbstoffbezug knapp.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: gezwirntem Feinleinen
  rationale: שֵׁשׁ bezeichnet feines Leinen, מָשְׁזָר gezwirntes beziehungsweise mehrfach gedrehtes Material. Die deutsche Zusammensetzung erhält beide Angaben.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: in Buntwirkerarbeit
  rationale: רֹקֵם bezeichnet einen kunstfertigen Textilhandwerker, dessen Arbeit mit verschiedenfarbigen Fäden ausgeführt wird. „Buntwirkerarbeit“ ist ein präziser deutscher Fachausdruck und unterscheidet diese Technik von schlichter Webarbeit.
