translation:
  language: de
  text: Er machte fünfzig bronzene Klammern, um das Zelt[a] zu einer Einheit zusammenzufügen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die Stiftshütte“; mit „Zelt“ ist hier die Zeltkonstruktion des Heiligtums gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er machte
  rationale: Das Wayyiqtol von עשה führt die Erzählung mit einer abgeschlossenen Handlung fort; im Deutschen ist hier das Präteritum natürlich.
- source_word: קַרְסֵי
  choice: Klammern
  rationale: Das Substantiv bezeichnet Verbindungsteile, mit denen die Bahnen beziehungsweise Zeltteile zusammengefügt wurden. „Klammern“ ist verständlich und sachlich passend.
- source_word: נְחֹשֶׁת
  choice: bronzene
  rationale: Im Zusammenhang der Materialien des Heiligtums wird נְחֹשֶׁת herkömmlich und sachgerecht mit „Bronze“ wiedergegeben.
- source_word: חֲמִשִּׁים
  choice: fünfzig
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: לְחַבֵּר
  choice: um … zusammenzufügen
  rationale: Der Infinitiv mit לְ bezeichnet hier den Zweck; „zusammenfügen“ bringt die verbindende Funktion konkret zum Ausdruck.
- source_word: אֶת הָאֹהֶל
  choice: das Zelt
  rationale: אֹהֶל bedeutet wörtlich „Zelt“. Im Kontext ist damit die Zeltkonstruktion des Heiligtums gemeint; die wörtliche Bezeichnung bleibt im Haupttext erhalten.
- source_word: לִהְיוֹת אֶחָד
  choice: sodass es eins wurde
  rationale: 'Die Wendung bezeichnet das Ergebnis beziehungsweise den Zweck des Zusammenfügens: Die Konstruktion bildete eine Einheit. Das deutsche Präteritum passt zur erzählten Ausführung.'
