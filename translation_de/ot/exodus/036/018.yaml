    rationale: „Wohnstätte“ ist keine direkte lexikalische Alternative zu אֹהֶל („Zelt“) und kann den Bezug auf die Heiligtumskonstruktion unklar machen. Die traditionelle kontextuelle Bezeichnung „Stiftshütte“ ist als Alternative treffender.
