lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er machte
  rationale: Das Qal-Wayyiqtol von עשה führt die Erzählung mit einer einfachen vergangenen Handlung fort. Im Deutschen ist der Satz ohne ein ausdrückliches „Und“ natürlich und inhaltlich vollständig.
- source_word: הַבְּרִיחַ
  choice: den Riegel
  rationale: בְּרִיחַ bezeichnet hier ein längliches Bauteil, das die Bretter beziehungsweise Rahmen der Stiftshütte miteinander verbindet. „Riegel“ ist im Deutschen sachlich passend und gegenüber „Stange“ konstruktiv präziser.
- source_word: הַתִּיכֹן
  choice: mittleren
  rationale: Das Adjektiv bezeichnet die mittlere beziehungsweise zentrale Lage des Riegels. „Mittleren“ bewahrt den räumlichen Sinn unmittelbar.
- source_word: לִבְרֹחַ
  choice: so, dass er … verlief
  rationale: Der Infinitiv von ברח beschreibt in diesem baulichen Zusammenhang das Hindurchlaufen beziehungsweise die Ausdehnung des Riegels. Die deutsche Konstruktion vermeidet den missverständlichen Eindruck einer aktiven Bewegung.
- source_word: בְּתוֹךְ
  choice: mitten durch
  rationale: בְּתוֹךְ bezeichnet das Innere oder die Mitte. Zusammen mit dem Verb gibt „mitten durch“ die räumliche Führung des Riegels natürlich wieder.
- source_word: הַקְּרָשִׁים
  choice: die Bretter
  rationale: קֶרֶשׁ bezeichnet die tragenden Holzelemente der Stiftshütte und kann als „Brett“, „Planke“ oder „Rahmen“ verstanden werden. „Bretter“ ist klar, traditionsnah und lexikalisch vertretbar.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: von einem Ende bis zum anderen
  rationale: Die Wendung bezeichnet die vollständige Erstreckung über die gesamte Länge. Diese Formulierung ist im modernen Deutschen eindeutig und idiomatisch.
