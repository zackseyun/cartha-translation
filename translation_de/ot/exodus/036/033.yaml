translation:
  language: de
  text: Er machte den mittleren Riegel so, dass er mitten durch die Bretter von einem Ende bis zum anderen verlief.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den zentralen Riegel … durch die Rahmen …“'
