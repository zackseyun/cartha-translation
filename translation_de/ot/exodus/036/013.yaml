base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/013.yaml
  text: And he made fifty gold clasps[a], and joined the curtains to one another with the clasps, so that the tabernacle became one.
translation:
  language: de
  text: Er fertigte fünfzig goldene Klammern an und verband die Zeltbahnen durch die Klammern miteinander, sodass die Stiftshütte zu einer Einheit wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formeller: „und die Stiftshütte war eine Einheit“. Der hebräische Satz kann auch als bloße Zustandsaussage wiedergegeben werden; „zu einer Einheit wurde“ hebt das Ergebnis des Verbindens hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er fertigte … an
  rationale: עשה bedeutet grundsätzlich „machen, anfertigen“. Bei handwerklich hergestellten Verbindungselementen klingt „anfertigen“ im Deutschen natürlich und präzise.
- source_word: חֲמִשִּׁים קַרְסֵי זָהָב
  choice: fünfzig goldene Klammern
  rationale: קֶרֶס bezeichnet hier Verbindungsteile, mit denen die Zeltbahnen zusammengefügt werden. „Klammern“ gibt ihre Funktion wieder, ohne ihre genaue Form festzulegen.
- source_word: וַיְחַבֵּר אֶת הַיְרִעֹת אַחַת אֶל אַחַת
  choice: und verband die Zeltbahnen … miteinander
  rationale: חבר bezeichnet das Verbinden; אַחַת אֶל אַחַת drückt wechselseitiges beziehungsweise fortlaufendes Zusammenfügen aus. „Miteinander“ ist dafür idiomatisches Deutsch.
- source_word: הַיְרִעֹת
  choice: die Zeltbahnen
  rationale: יְרִיעוֹת sind die Stoffbahnen der Stiftshütte. „Zeltbahnen“ ist im Deutschen anschaulicher und sachlich genauer als das mögliche „Vorhänge“.
- source_word: בַּקְּרָסִים
  choice: durch die Klammern
  rationale: 'Die Präposition ב ist instrumental: Die Verbindung geschieht mittels der Klammern.'
- source_word: וַיְהִי הַמִּשְׁכָּן אֶחָד
  choice: sodass die Wohnung zu einem Ganzen wurde
  rationale: Der Satz beschreibt das Ergebnis des Zusammenfügens. „Zu einem Ganzen wurde“ bewahrt den Einheitsgedanken von אֶחָד und ist im Deutschen klarer als das wörtliche „eine war“.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: מִשְׁכָּן bezeichnet die heilige Wohnstätte Gottes und hängt mit der Wurzel „wohnen“ zusammen. „Wohnung“ ist eine traditionelle, verständliche und lexikalisch transparente Wiedergabe; im Kontext ist die Stiftshütte gemeint.
theological_decisions:
- issue: Ergebnis- oder Zustandsaussage in וַיְהִי הַמִּשְׁכָּן אֶחָד
  choice: sodass die Wohnung zu einem Ganzen wurde
  alternative: und die Wohnung war eins
  rationale: Die Abfolge legt eine resultative Aussage nahe, doch die formalere Zustandsaussage bleibt grammatisch möglich. Die Fußnote bewahrt diese Ambiguität.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die handwerkliche Beschreibung bleibt konkret; „Wohnung“ bewahrt die Bedeutung von מִשְׁכָּן, während „zu einem Ganzen“ die im Kontext entstandene bauliche Einheit natürlich ausdrückt.
