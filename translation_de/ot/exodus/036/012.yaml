base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/012.yaml
  text: He made fifty loops on the one curtain[a], and he made fifty loops on the edge of the curtain that was in the second set[b]; the loops corresponded to one another.
translation:
  language: de
  text: Er brachte fünfzig Schlaufen an der einen Zeltbahn an und fünfzig Schlaufen am Rand der Zeltbahn, die zum zweiten zusammengefügten Bahnenverbund gehörte. Die Schlaufen lagen einander gegenüber[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur zweiten zusammengefügten Abteilung“ beziehungsweise „zur zweiten Verbindung“.'
    reason: Das hebräische מַחְבֶּרֶת kann sowohl das Zusammenfügen als auch die dadurch entstandene verbundene Einheit bezeichnen.
  - marker: b
    text: 'Wörtlich: „Die Schlaufen entsprachen einander“, das heißt: eine lag der anderen gegenüber.'
    reason: Die Fußnote erläutert die hebräische Wendung für die paarweise Ausrichtung der Schlaufen in korrektem, natürlichem Deutsch.
lexical_decisions:
- source_word: לֻלָאֹת
  choice: Schlaufen
  rationale: Das Substantiv bezeichnet Stoffschlaufen, mit denen die Zeltbahnen verbunden wurden. „Schlaufen“ ist im Deutschen präzise und unterscheidet sie von den gesondert erwähnten metallenen Haken.
- source_word: יְרִיעָה
  choice: Zeltbahn
  rationale: Im Zusammenhang des Heiligtums bezeichnet das Wort eine große textile Bahn. „Zeltbahn“ ist anschaulich und für die einzelnen Teile der Zeltdecke genauer als das allgemeinere „Vorhang“.
- source_word: בִּקְצֵה
  choice: am Rand
  rationale: קָצֶה bezeichnet hier den Rand beziehungsweise das Ende der Bahn, an dem die Schlaufen zur Verbindung angebracht wurden.
- source_word: מַחְבֶּרֶת
  choice: zusammengefügter Bahnenverbund
  rationale: Das Wort bezeichnet die aus mehreren miteinander verbundenen Zeltbahnen gebildete Einheit. Diese Wiedergabe macht sowohl das Zusammenfügen als auch das entstandene Ganze deutlich.
- source_word: הַשֵּׁנִית
  choice: zweiten
  rationale: Der hebräische Ordinalausdruck bezeichnet den zweiten der beiden zusammengefügten Bahnenverbünde.
- source_word: מַקְבִּילֹת
  choice: lagen ... genau gegenüber
  rationale: Das Partizip beschreibt, dass die Schlaufen beider Seiten einander zugeordnet und gegenüberliegend ausgerichtet waren.
- source_word: אַחַת אֶל אֶחָת
  choice: einander
  rationale: Die Wendung drückt die paarweise Zuordnung aus; zusammen mit „genau gegenüber“ ergibt sie eine natürliche deutsche Formulierung.
- source_word: עָשָׂה
  choice: brachte ... an
  rationale: Wörtlich bedeutet das Verb „machen“. Bei Schlaufen an einer Stoffkante bezeichnet idiomatisches Deutsch den Vorgang als „anbringen“, ohne den sachlichen Gehalt zu verändern.
