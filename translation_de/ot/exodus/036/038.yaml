  text: and its five pillars with their hooks[a]; and he overlaid their tops and their bands with gold[b], and their five bases were bronze.
translation:
  language: de
  text: Dazu fertigte er seine fünf Säulen mit ihren Haken. Die oberen Enden und ihre Bänder[a] überzog er mit Gold; ihre fünf Sockel[b] waren aus Bronze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet Bestandteile an den Säulen; ihre genaue Form und Funktion sind ungewiss. Traditionell wird es oft mit »Bänder« wiedergegeben; möglich sind auch Querstangen oder andere Verbindungselemente.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Fußstücke« beziehungsweise »Aufnahmen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו
  choice: seine fünf Säulen
  rationale: עַמּוּד bezeichnet hier die aufrechten Träger des Vorhangs. »Säulen« ist im Heiligtumsbau geläufig und gibt den Singularsuffix mit Bezug auf den zuvor genannten Vorhang als »seine« wieder.
- source_word: וָוֵיהֶם
  choice: ihren Haken
  rationale: וָו bezeichnet im Zusammenhang der Stiftshütte Vorrichtungen an den Säulen, an denen Stoffteile befestigt wurden; »Haken« ist dafür die klare, übliche Wiedergabe.
- source_word: וְצִפָּה
  choice: überzog er
  rationale: Das Piel von צפה bezeichnet das Überziehen eines Gegenstands mit Metall. »überzog … mit Gold« ist natürliches modernes Deutsch und bewahrt den handwerklichen Sinn.
- source_word: רָאשֵׁיהֶם
  choice: ihre oberen Enden
  rationale: Wörtlich steht »ihre Köpfe«. Im baulichen Zusammenhang sind die oberen Teile der Säulen gemeint; »obere Enden« ist verständlich, ohne die speziellere Form von Kapitellen vorauszusetzen.
- source_word: חֲשֻׁקֵיהֶם
  choice: ihre Verbindungsstücke
  rationale: Die genaue Form und Funktion der חֲשֻׁקִים ist unsicher. »Verbindungsstücke« bleibt bewusst allgemein und vermeidet das heute missverständliche traditionelle »Bänder« sowie eine zu genaue Festlegung auf Querstangen.
- source_word: זָהָב
  choice: mit Gold
  rationale: Das Substantiv nennt das Material des Überzugs; die Präposition »mit« wird im Deutschen idiomatisch ergänzt.
- source_word: אַדְנֵיהֶם
  choice: ihre fünf Sockel
  rationale: אֶדֶן bezeichnet im Stiftshüttenbau die tragende Aufnahme beziehungsweise Basis einer Säule. »Sockel« ist im Deutschen anschaulich und sachgerecht.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: נְחֹשֶׁת ist die übliche Bezeichnung für Kupfer beziehungsweise eine Kupferlegierung. Im Zusammenhang der Stiftshütte entspricht »Bronze« dem etablierten Sprachgebrauch.
