  language: de
  text: Jeder Rahmen[a] war zehn Ellen lang und anderthalb Ellen breit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Brett« oder »Planke«. Das hebräische Wort קֶרֶשׁ bezeichnet hier die tragenden Bauteile der Stiftshütte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶשֶׂר אַמֹּת אֹרֶךְ הַקָּרֶשׁ
  choice: Jeder Rahmen war zehn Ellen lang
  rationale: Die Maßangabe wird in natürliches modernes Deutsch überführt. »Ellen« bewahrt die antike Maßeinheit; אֹרֶךְ bezeichnet die Länge, die im Deutschen idiomatisch mit »lang« ausgedrückt wird.
- source_word: הַקָּרֶשׁ
  choice: Rahmen
  rationale: קֶרֶשׁ bezeichnet hier eines der tragenden Bauteile der Stiftshütte. »Rahmen« gibt die bauliche Funktion wieder, ohne die genaue, nicht völlig sichere Konstruktion festzulegen; »Brett« und »Planke« bleiben mögliche Alternativen.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה רֹחַב
  choice: und anderthalb Ellen breit
  rationale: Die wörtliche Wendung »eine Elle und eine halbe Elle« wird als idiomatische deutsche Maßangabe wiedergegeben; רֹחַב wird natürlich durch »breit« ausgedrückt.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: jeder Rahmen
  rationale: Das wörtliche »der eine Rahmen« hat im Zusammenhang der einheitlichen Abmessungen distributiven Sinn. »Jeder Rahmen« vermeidet die irreführende Deutung »der erste Rahmen«.
theological_decisions: []
