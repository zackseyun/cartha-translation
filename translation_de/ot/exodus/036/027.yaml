translation:
  language: de
  text: Und für die Rückseite der Stiftshütte, nach Westen hin, fertigte er sechs Rahmen[a] an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Bretter. Das hebräische Wort bezeichnet Bauelemente und kann je nach Rekonstruktion als Bretter oder Rahmen verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: Für die Rückseite
  rationale: Die Wendung bezeichnet hier den hinteren beziehungsweise äußersten Bereich des Bauwerks. Der deutsche Singular „Rückseite“ gibt den architektonischen Sinn natürlich wieder; das einleitende וּ wird im fortlaufenden Aufzählungsstil nicht eigens mit „und“ wiedergegeben.
- source_word: הַמִּשְׁכָּן
  choice: der Stiftshütte
  rationale: „Stiftshütte“ ist die im Deutschen etablierte Bezeichnung für das Heiligtumszelt in Exodus und bleibt für heutige Leser verständlich.
- source_word: יָמָּה
  choice: nach Westen hin
  rationale: Das Richtungswort bedeutet wörtlich „meerwärts“ und idiomatisch „westwärts“. „Nach Westen hin“ bewahrt die Richtungsangabe in natürlichem Deutsch.
- source_word: עָשָׂה
  choice: fertigte … an
  rationale: Das häufige Verb עשה bedeutet „machen, anfertigen“. In diesem handwerklichen Zusammenhang ist „fertigte … an“ idiomatisch und präzise.
- source_word: שִׁשָּׁה
  choice: sechs
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: קְרָשִׁים
  choice: Rahmen
  rationale: Der Ausdruck bezeichnet aufrechte tragende Bauteile der Stiftshütte. „Rahmen“ bringt ihre mögliche konstruktive Funktion zum Ausdruck, ohne die lexikalisch ebenfalls mögliche Auffassung als Bretter auszuschließen; diese wird in der Fußnote genannt.
