  text: וְ/עָשָׂה֩ בְצַלְאֵ֨ל וְ/אָהֳלִיאָ֜ב וְ/כֹ֣ל אִ֣ישׁ חֲכַם לֵ֗ב אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה חָכְמָ֤ה וּ/תְבוּנָה֙ בָּ/הֵ֔מָּה לָ/דַ֣עַת לַ/עֲשֹׂ֔ת אֶֽת כָּל מְלֶ֖אכֶת עֲבֹדַ֣ת הַ/קֹּ֑דֶשׁ לְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/001.yaml
  text: And Bezalel and Oholiab[a], and every skillful man in whom Yahweh has put wisdom and understanding to know how to do all the work for the service of the sanctuary[c][b], shall do according to all that Yahweh has commanded.
translation:
  language: de
  text: Bezalel, Oholiab und alle kunstfertigen Männer[a], denen Jahwe Weisheit und Einsicht gegeben hat[b], damit sie wissen, wie alle Arbeiten des Dienstes am Heiligtum[c] auszuführen sind, sollen alles so ausführen, wie Jahwe es geboten hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jeder Mann, der weisen Herzens ist“; im Zusammenhang bezeichnet die Wendung kunstfertige Männer und kann allgemein für entsprechend befähigte Arbeitskräfte stehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Hebräischen im Plural: „in denen Jahwe Weisheit und Einsicht gegeben hat“; dies bezieht sich gemeinsam auf Bezalel, Oholiab und alle kunstfertigen Männer.'
    reason: source_grammar
  - marker: c
    text: 'Auch möglich: „alle Arbeiten für den Dienst am Heiligtum“ oder „alle Arbeiten des heiligen Dienstes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: sollen … ausführen
  rationale: Das Qal-Perfekt mit וְ führt im Kontext die Anweisung mit zukünftig-verpflichtendem Sinn fort. Der deutsche Plural folgt den mehreren genannten Ausführenden; „ausführen“ passt natürlich zu den umfassenden Arbeiten.
- source_word: וְכֹל אִישׁ חֲכַם לֵב
  choice: und jeder kunstfertige Mann
  rationale: Wörtlich heißt die Wendung „jeder Mann, der weisen Herzens ist“. Im handwerklichen Zusammenhang bezeichnet sie praktische, von Gott verliehene Befähigung; „kunstfertig“ ist verständlich und wahrt אִישׁ als „Mann“.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה וּתְבוּנָה בָהֵמָּה
  choice: dem Jahwe Weisheit und Einsicht gegeben hat
  rationale: Das hebräische בָהֵמָּה ist pluralisch („in ihnen“) und bezieht sich kollektiv auf alle Genannten. Die distributive deutsche Form mit „jeder … dem“ ist idiomatisch; eine Fußnote bewahrt die Form des Ausgangstextes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner etablierten Form „Jahwe“ wiedergegeben.
- source_word: חָכְמָה וּתְבוּנָה
  choice: Weisheit und Einsicht
  rationale: Die beiden Begriffe bleiben unterschieden. „Weisheit“ umfasst hier auch handwerkliches Können, während „Einsicht“ verständig-praktisches Erfassen bezeichnet.
- source_word: לָדַעַת לַעֲשֹׂת
  choice: '[implizit in] … ausführen'
  rationale: Die Infinitivfolge bezeichnet die praktische Fähigkeit, die Arbeiten sachkundig auszuführen. Im natürlichen deutschen Satz ist dieser Gedanke bereits in „kunstfertig“ und „ausführen“ enthalten; die Gottesgabe von Weisheit und Einsicht bleibt ausdrücklich genannt.
- source_word: כָּל מְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: alle Arbeiten für den Dienst am Heiligtum
  rationale: Die gestufte Verbindung aus „Arbeit“, „Dienst“ und „Heiligem/Heiligtum“ wird klar und ohne unnötige Substantivhäufung wiedergegeben. „Heiligtum“ bezeichnet hier den heiligen Bereich.
- source_word: לְכֹל אֲשֶׁר צִוָּה יְהוָה
  choice: so …, wie Jahwe es geboten hat
  rationale: Das לְ wird als Übereinstimmung mit dem Gebot verstanden. Die Formulierung ist heutiges, würdiges Deutsch und lässt offen, auf welche zuvor erteilten Einzelanweisungen verwiesen wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlecht und Reichweite von אִישׁ חֲכַם לֵב
  choice: jeder kunstfertige Mann
  alternative: jede kunstfertige Person / jeder kunstfertige Arbeiter
  rationale: אִישׁ ist grammatisch und lexikalisch „Mann“. Zugleich kann die Wendung im Zusammenhang generisch die qualifizierten Arbeitskräfte bezeichnen; diese mögliche Reichweite wird in der Fußnote kenntlich gemacht.
- issue: Art der von Gott verliehenen Befähigung
  choice: Weisheit und Einsicht
  alternative: Geschick und Sachverstand
  rationale: Die allgemeineren theologischen Begriffe des Hebräischen werden nicht auf bloße handwerkliche Technik verengt, obwohl sie hier praktische Kunstfertigkeit einschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde gegenüber der hebräischen Singulareröffnung an die mehrteilige deutsche Subjektgruppe angepasst. „Kunstfertig“ vermittelt den handwerklichen Kontext, während die Fußnote das Bild vom „weisen Herzen“ bewahrt. Alle Fußnotenmarker stehen unmittelbar bei den betroffenen Ausdrücken.
