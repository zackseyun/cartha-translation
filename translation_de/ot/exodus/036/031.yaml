lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er fertigte … an
  rationale: Das Wayyiqtol von עשה führt die Abfolge der Bauarbeiten fort. „Anfertigen“ ist in diesem handwerklichen Zusammenhang natürlich und präzise.
- source_word: בְּרִיחֵי
  choice: Riegel
  rationale: בְּרִיחַ bezeichnet hier waagerechte Bauteile, die die aufrechten Konstruktionselemente zusammenhalten. „Riegel“ ist die im deutschen Stiftshüttenkontext geläufige und funktional passende Bezeichnung.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: Die Konstruktusverbindung bezeichnet Holz von Akazienbäumen; „Akazienholz“ ist die klare moderne Materialangabe.
- source_word: חֲמִשָּׁה
  choice: fünf
  rationale: Direkte Wiedergabe der Kardinalzahl, die die Riegel zählt.
- source_word: לְקַרְשֵׁי
  choice: für die Rahmen
  rationale: קֶרֶשׁ bezeichnet die aufrechten tragenden Konstruktionselemente. „Rahmen“ gibt ihre bauliche Funktion verständlich wieder; „Bretter“ bleibt lexikalisch möglich und wird in der Fußnote genannt.
- source_word: צֶלַע
  choice: Seite
  rationale: Im architektonischen Zusammenhang bezeichnet צֶלַע eine Seite des Bauwerks, nicht eine körperliche Rippe.
- source_word: הַמִּשְׁכָּן
  choice: der Stiftshütte
  rationale: „Stiftshütte“ ist die etablierte deutsche Bezeichnung für das mobile Heiligtum in Exodus und bezeichnet hier konkret das Bauwerk.
- source_word: הָאֶחָת
  choice: der einen
  rationale: Das feminine Zahlwort stimmt mit צֶלַע überein und unterscheidet diese Seite von der anderen, ohne eine Reihenfolge als „erste“ festzulegen.
