translation:
  language: de
  text: Er fertigte fünf Riegel aus Akazienholz für die Rahmen[a] der einen Seite der Stiftshütte an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bretter«; gemeint sind die aufrechten tragenden Konstruktionselemente der Stiftshütte.'
