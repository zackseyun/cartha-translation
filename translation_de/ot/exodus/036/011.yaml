base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/011.yaml
  text: He made loops of blue yarn on the edge of the first curtain at the end of the first set joined together[a]; likewise he made them on the edge of the outermost curtain in the second set joined together.
translation:
  language: de
  text: Er machte Schlaufen aus blauem Purpur am Rand der ersten Zeltbahn, am Ende der ersten zusammengefügten Bahnengruppe[a]. Ebenso machte er sie am Rand der äußersten Zeltbahn der zweiten zusammengefügten Bahnengruppe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei der Verbindung“; das hebräische Wort kann die Verbindung, den Verbund oder die Stelle bezeichnen, an der die Zeltbahnen miteinander verbunden wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: Schlaufen
  rationale: Das Substantiv bezeichnet hier textile Schlaufen, mit denen die Zeltbahnen verbunden wurden.
- source_word: תְּכֵלֶת
  choice: blauer Purpur
  rationale: תכלת bezeichnet einen kostbaren blau bis blauviolett gefärbten Textilstoff bzw. Faden. „Blauer Purpur“ ist die im Deutschen geläufige, kontextgerechte Bezeichnung und macht das Material der Schlaufen deutlich.
- source_word: שְׂפַת
  choice: Saum
  rationale: Wörtlich „Lippe“; bei einer Zeltbahn ist der begrenzende Stoffrand gemeint. „Saum“ ist natürlich und sachlich passend.
- source_word: הַיְרִיעָה
  choice: Zeltbahn
  rationale: Im Heiligtumsbau bezeichnet יְרִיעָה eine einzelne textile Bahn der Zeltbedeckung. „Zeltbahn“ ist genauer als das allgemeinere „Vorhang“.
- source_word: הָאֶחָת
  choice: der ersten
  rationale: Wörtlich „der einen“; durch den späteren Gegensatz zur zweiten Verbindungseinheit hat die Form hier ordinale Funktion.
- source_word: מִקָּצָה
  choice: an ihrem Ende
  rationale: Die Wendung lokalisiert die Schlaufen am äußersten Ende der Zeltbahn.
- source_word: בַּמַּחְבָּרֶת
  choice: bei der Verbindungsstelle
  rationale: מַחְבָּרֶת kann die Verbindung, den Verbund oder die Stelle des Zusammenfügens bezeichnen. „Verbindungsstelle“ wahrt den räumlich-funktionalen Sinn, ohne eine konkrete Naht vorauszusetzen.
- source_word: כֵּן עָשָׂה
  choice: Ebenso machte er es
  rationale: Die knappe Formulierung erhält den parallelen Bau und verweist natürlich auf die zuvor beschriebene Herstellung der Schlaufen.
- source_word: הַקִּיצוֹנָה
  choice: der äußersten
  rationale: Das Adjektiv bezeichnet die am Ende bzw. außen liegende Zeltbahn.
- source_word: הַמַּחְבֶּרֶת הַשֵּׁנִית
  choice: des zweiten zusammengefügten Teils
  rationale: Die Wortgruppe bezeichnet den zweiten Verbund von Zeltbahnen. Die Wiedergabe macht die Gruppierung verständlich, ohne ein im Hebräischen nicht ausdrücklich genanntes Substantiv wie „Satz“ einzuführen.
