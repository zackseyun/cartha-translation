base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/006.yaml
  text: So Moses commanded[a], and they sent a proclamation through the camp, saying[b], “Let neither man nor woman do any more work for the contribution of the sanctuary.” So the people were restrained from bringing more.
translation:
  language: de
  text: 'Da gab Mose den Befehl, und man ließ im ganzen Lager ausrufen[a]: »Weder Mann noch Frau soll noch weitere Arbeit für die heilige Abgabe[b] leisten.« So wurde das Volk davon abgehalten, noch mehr zu bringen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »man ließ eine Stimme im Lager umhergehen«; gemeint ist eine öffentliche Bekanntmachung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Abgabe für das Heiligtum« oder »Gabe für das Heiligtum«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: gab Mose den Befehl
  rationale: צוה bezeichnet hier eine verbindliche Anordnung. Die deutsche Wendung wahrt die autoritative Kraft und klingt im Erzählzusammenhang natürlich.
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: man ließ ... ausrufen
  rationale: Die Wendung bedeutet wörtlich, dass man eine Stimme beziehungsweise Nachricht durch das Lager gehen ließ. Die unpersönliche Form gibt den nicht ausdrücklich genannten Ausführenden wieder und bewahrt mit „ließ“ den kausativen Zug.
- source_word: בַּמַּחֲנֶה
  choice: im ganzen Lager
  rationale: Die Präposition bedeutet formal „im Lager“; zusammen mit dem umlaufenden Ausruf bezeichnet sie eine Bekanntmachung im gesamten Lager.
- source_word: אִישׁ וְאִשָּׁה
  choice: weder Mann noch Frau
  rationale: Diese Formulierung erhält die ausdrückliche Nennung beider Geschlechter und fügt sich natürlich in das Verbot ein.
- source_word: אַל יַעֲשׂוּ עוֹד מְלָאכָה
  choice: soll noch weitere Arbeit ... leisten
  rationale: מְלָאכָה bezeichnet Arbeit beziehungsweise handwerkliche Tätigkeit. „Weitere Arbeit leisten“ lässt den Umfang bewusst offen und gibt עוֹד klar wieder.
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  choice: für die heilige Abgabe
  rationale: תְּרוּמָה ist eine dargebrachte beziehungsweise ausgesonderte Abgabe. הַקֹּדֶשׁ kann die Heiligkeit der Abgabe oder ihre Bestimmung für das Heiligtum ausdrücken; die knappe Haupttextfassung bewahrt den sakralen Bezug, die Fußnote nennt die sachlich mögliche Alternative.
- source_word: וַיִּכָּלֵא
  choice: wurde ... davon abgehalten
  rationale: Der Nifal von כלא drückt aus, dass das Volk am weiteren Bringen gehindert beziehungsweise davon zurückgehalten wurde, ohne Widerwillen zu unterstellen.
- source_word: מֵהָבִיא
  choice: noch mehr zu bringen
  rationale: מן mit dem Infinitiv bezeichnet hier die Handlung, von der das Volk abgehalten wurde. „Noch mehr“ macht den aus עוֹד und dem Kontext hervorgehenden Fortsetzungsaspekt verständlich.
theological_decisions:
- issue: Bezug von לִתְרוּמַת הַקֹּדֶשׁ
  choice: heilige Abgabe
  alternative: Abgabe für das Heiligtum
  rationale: Die hebräische Genitivverbindung lässt sowohl eine qualitative Deutung („heilige Abgabe“) als auch eine Bestimmungsangabe („für das Heiligtum“) zu. Diese Mehrdeutigkeit wird nicht dogmatisch aufgelöst, sondern durch eine Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der öffentliche Ausruf wird idiomatisch formuliert, während die Fußnoten die bildhafte hebräische Wendung und die Mehrdeutigkeit der sakralen Abgabe erhalten.
