base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/030.yaml
  text: 'There were eight frames[a], with their silver bases, sixteen bases: two bases under one frame[b], and two bases under each frame.'
translation:
  language: de
  text: 'Es waren acht Rahmen[a] mit ihren silbernen Sockeln[b], insgesamt sechzehn Sockel: je zwei Sockel unter jedem Rahmen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Bretter“; das hebräische Wort bezeichnet die aufrechten Bauteile der Stiftshütte.
    reason: lexical_alternative
  - marker: b
    text: Oder „Fußstücke“ beziehungsweise „Fassungen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: Es waren
  rationale: Die Existenzformulierung gibt היה in dieser beschreibenden Bestandsangabe natürlich wieder; das einleitende וְ wird im deutschen Satzfluss aufgenommen.
- source_word: קְרָשִׁים / הַקֶּרֶשׁ
  choice: Rahmen
  rationale: קֶרֶשׁ bezeichnet hier die aufrechten Bauteile der Stiftshütte. „Rahmen“ vermittelt ihre tragende Funktion; „Bretter“ bleibt als mögliche sachlich-konkrete Alternative in der Fußnote erhalten.
- source_word: אַדְנֵיהֶם / אֲדָנִים
  choice: Sockel
  rationale: אֶדֶן bezeichnet in diesem Bauzusammenhang die silberne Aufnahme beziehungsweise Standbasis eines Rahmens. „Sockel“ ist verständlich und baulich passend.
- source_word: כֶּסֶף
  choice: silbern
  rationale: Das Material Silber wird attributiv und idiomatisch wiedergegeben.
- source_word: שִׁשָּׁה עָשָׂר אֲדָנִים
  choice: insgesamt sechzehn Sockel
  rationale: „Insgesamt“ verdeutlicht, dass sechzehn die Gesamtzahl der zu den acht Rahmen gehörenden Sockel ist, ohne zusätzliche Sachinformation einzuführen.
- source_word: שְׁנֵי אֲדָנִים שְׁנֵי אֲדָנִים תַּחַת הַקֶּרֶשׁ הָאֶחָד
  choice: je zwei Sockel unter jedem Rahmen
  rationale: Die hebräische Wiederholung hat im Kontext verteilenden Sinn. „Je zwei … unter jedem“ bewahrt diesen Sinn knapp und vermeidet den missverständlichen Eindruck, nur einzelne Rahmen seien gemeint.
