base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/017.yaml
  text: He made fifty loops on the edge of the outer curtain in the first set[a], and he made fifty loops on the edge of the curtain of the second set.
translation:
  language: de
  text: Er machte fünfzig Schlaufen am Rand der äußersten Zeltbahn der ersten zusammengefügten Bahnengruppe[a], und fünfzig Schlaufen machte er am Rand der Zeltbahn der zweiten zusammengefügten Bahnengruppe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an der Verbindung“ beziehungsweise „in der ersten verbundenen Bahnengruppe“. Das hebräische Wort bezeichnet eine Verbindung oder eine zusammengefügte Gruppe von Zeltbahnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: Schlaufen
  rationale: Das Substantiv bezeichnet hier Stoffschlaufen, mit denen die Zeltbahnen verbunden wurden. „Schlaufen“ ist im Deutschen klar und natürlich; eine Farbangabe steht in diesem Vers nicht.
- source_word: שְׂפַת
  choice: Rand
  rationale: Wörtlich kann das Wort „Lippe“ bedeuten; bei einer Stoffbahn bezeichnet es idiomatisch deren Rand.
- source_word: יְרִיעָה
  choice: Zeltbahn
  rationale: Im Zusammenhang des Heiligtums ist eine große Stoffbahn gemeint. „Zeltbahn“ ist genauer als das mehrdeutige „Vorhang“ und passt zur Konstruktion des Zeltheiligtums.
- source_word: הַקִּיצֹנָה
  choice: äußersten
  rationale: Das Adjektiv bezeichnet die am Ende beziehungsweise außen liegende Bahn des Satzes.
- source_word: בַּמַּחְבָּרֶת
  choice: des ersten zusammengefügten Satzes
  rationale: מַחְבָּרֶת bezeichnet eine Verbindung oder einen durch Zusammenfügen entstandenen Satz von Bahnen. „Ersten“ ist aus der Gegenüberstellung mit dem zweiten Satz erschlossen und macht die Struktur verständlich.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: des zweiten Satzes
  rationale: Die Wendung bezeichnet die zu einer zweiten Verbindung beziehungsweise Gruppe gehörende Bahn. Die knappe Wiedergabe wahrt die Parallelität beider Satzgruppen.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Er machte ... machte er
  rationale: Die Wiederholung des Verbs wird bewahrt; die veränderte Wortstellung des zweiten Teils bildet zudem die hebräische Hervorhebung natürlich ab.
