translation_notes:
  register: Moderne, würdige Standardsprache. Die leicht redundante Formulierung »jeder einzelnen Zeltbahn« spiegelt die zweimalige hebräische Einzelbezeichnung; der abschließende Satz wahrt die zusammenfassende Aussage über alle elf Bahnen.
