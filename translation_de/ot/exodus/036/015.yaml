  text: The length of each curtain was thirty cubits, and four cubits was the width of each curtain; the eleven curtains had one measure.
translation:
  language: de
  text: Die Länge jeder einzelnen Zeltbahn betrug dreißig Ellen, und die Breite jeder einzelnen Zeltbahn vier Ellen; alle elf Zeltbahnen hatten dasselbe Maß.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְרִיעָה
  choice: Zeltbahn
  rationale: Im Zusammenhang mit dem Zeltheiligtum bezeichnet das Wort eine textile Bahn; »Zeltbahn« ist präziser als das allgemeinere »Vorhang«.
- source_word: אַמָּה / אַמּוֹת
  choice: Elle / Ellen
  rationale: Die traditionelle Maßeinheit bleibt erhalten, da keine exakte moderne Umrechnung vorausgesetzt werden sollte.
- source_word: מִדָּה אַחַת
  choice: dasselbe Maß
  rationale: Gibt die Gleichheit der Abmessungen idiomatisch wieder, ohne den Sinn über die hebräische Aussage hinaus einzuengen.
