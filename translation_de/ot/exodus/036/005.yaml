  text: וַ/יֹּאמְרוּ֙ אֶל מֹשֶׁ֣ה לֵּ/אמֹ֔ר מַרְבִּ֥ים הָ/עָ֖ם לְ/הָבִ֑יא מִ/דֵּ֤י הָֽ/עֲבֹדָה֙ לַ/מְּלָאכָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/005.yaml
  text: And they said to Moses[a], “The people are bringing much more than enough for the work of the task that Yahweh commanded to be done.”
translation:
  language: de
  text: 'Sie sagten zu Mose: »Das Volk bringt mehr[a], als für die Arbeit an dem Werk, das Jahwe zu tun befohlen hat, nötig ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Volk bringt zu viel für die Arbeit an dem Werk.« Die hebräische Wendung betont, dass die Gaben den Bedarf übersteigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה לֵּאמֹר
  choice: Sie sagten zu Mose
  rationale: Die hebräische Erzählform leitet die direkte Rede ein. Das zusätzliche לֵאמֹר („indem sie sagten“) wird im natürlichen Deutschen nicht eigens wiedergegeben.
- source_word: מַרְבִּים הָעָם לְהָבִיא מִדֵּי
  choice: Das Volk bringt mehr, als … nötig ist
  rationale: Die Verbindung aus dem Hifil-Partizip von רבה, לְהָבִיא und מִדֵּי bezeichnet fortlaufendes Bringen, das den tatsächlichen Bedarf übersteigt. Die Formulierung gibt sowohl die laufende Handlung als auch den Maßstab der ausreichenden Menge idiomatisch wieder.
- source_word: הָעֲבֹדָה לַמְּלָאכָה
  choice: für die Arbeit an dem Werk
  rationale: 'Die beiden verwandten Begriffe werden unterschieden: עֲבֹדָה bezeichnet hier die Arbeit, מְלָאכָה das auszuführende Werk beziehungsweise Vorhaben. „Arbeit an dem Werk“ ist zugleich verständlich und nah an dieser Paarung.'
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשֹׂת אֹתָהּ
  choice: das Jahwe auszuführen befohlen hat
  rationale: Der Relativsatz bezieht sich grammatisch auf מְלָאכָה. „Auszuführen“ gibt לַעֲשֹׂת אֹתָהּ im Kontext eines angeordneten Werkes natürlich wieder, ohne einen im Hebräischen ungenannten Ausführenden einzuführen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als Eigenname wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als Gottesnamen. „Jahwe“ bewahrt diese Namensfunktion, statt sie durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist knapp und natürlich formuliert; die beiden hebräischen Arbeitsbegriffe bleiben durch „Arbeit an dem Werk“ erkennbar unterschieden.
