  yaml_path: translation/ot/exodus/036/016.yaml
  text: And he joined five curtains by themselves[a], and six curtains by themselves.
translation:
  language: de
  text: Und er verband fünf Zeltbahnen für sich[a] und sechs Zeltbahnen für sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »für sich«; das heißt, die fünf Zeltbahnen wurden zu einem eigenen Verbund zusammengefügt und die sechs zu einem anderen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר
  choice: verband
  rationale: חָבַר bedeutet »verbinden, zusammenfügen«. »Verband« ist im Bauzusammenhang natürlich und legt die genaue Verbindungstechnik nicht fest.
- source_word: הַיְרִיעֹת
  choice: Zeltbahnen
  rationale: יְרִיעָה bezeichnet hier die großen Stoffbahnen der Stiftshütte. »Zeltbahnen« ist im Deutschen anschaulicher und sachlich genauer als das mögliche »Vorhänge«.
- source_word: לְבָד
  choice: zu einer Gruppe
  rationale: 'לְבָד kennzeichnet die getrennte Zusammenfügung: fünf Bahnen bildeten einen eigenen Verbund und sechs einen weiteren. Die kontextbezogene Wiedergabe macht diese Funktion im Deutschen klar.'
- source_word: חֲמֵשׁ
  choice: fünf
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: שֵׁשׁ
  choice: sechs
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: אֶת ... וְאֶת
  choice: koordinierte Akkusativobjekte
  rationale: Die wiederholte Objektmarkierung gliedert die fünf und die sechs Zeltbahnen als zwei koordinierte Gruppen; im Deutschen wird sie durch die parallele Satzstruktur ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Struktur des Hebräischen bleibt erhalten; »zu einer Gruppe« gibt den kontextuellen Sinn von לְבָד natürlich wieder, ohne die Art der Verbindung näher zu bestimmen.
