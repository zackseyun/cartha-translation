base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/035.yaml
  text: And he made the curtain of blue[a], purple, and scarlet yarn, and fine twisted linen; he made it with cherubim[c][b], the work of a skillful designer.
translation:
  language: de
  text: Und er fertigte den Vorhang[a] aus blauem und purpurfarbenem Garn, Karmesingarn[b] und feinem gezwirntem Leinen in kunstvoll gemusterter Webarbeit[c] an und arbeitete Kerubim ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Schleier.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich bezeichnet der hebräische Ausdruck scharlachrot gefärbtes Material oder Garn; auch „Scharlachgarn“ ist möglich.
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „als Arbeit eines Kunstwebers“ oder „in gemusterter Webarbeit“. Gemeint ist eine kunstvolle, gemusterte Ausführung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: der Vorhang
  rationale: Das Wort bezeichnet den inneren Trennvorhang des Heiligtums. „Vorhang“ ist im modernen Deutschen klar und sachgerecht; „Schleier“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: תְּכֵלֶת
  choice: blaues Garn
  rationale: Der Ausdruck bezeichnet blau gefärbtes Textilmaterial. „Blaues Garn“ macht den Materialbezug im Zusammenhang der Gewebeherstellung deutlich.
- source_word: אַרְגָּמָן
  choice: purpurfarbenes Garn
  rationale: Dies ist die übliche Bezeichnung für das kostbare purpurgefärbte Material; „Garn“ wird als gemeinsames Bezugswort der Farbreihe verwendet.
- source_word: תוֹלַעַת שָׁנִי
  choice: Karmesingarn
  rationale: Die hebräische Wortverbindung bezeichnet scharlach- beziehungsweise karmesinrot gefärbtes Material oder Garn. „Karmesingarn“ ist prägnant und textilkundlich passend.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: gezwirntes Feinleinen
  rationale: שֵׁשׁ bezeichnet feines Leinen, מָשְׁזָר dessen gezwirnte Verarbeitung. Die Formulierung bewahrt beide Aspekte knapp und natürlich.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: kunstvoll gearbeitet
  rationale: Die Wendung bezeichnet planvolle, gemusterte Kunst- oder Webarbeit. „Kunstvoll gearbeitet“ gibt die Art der Ausführung wieder, ohne eine im Hebräischen nicht ausdrücklich genannte Berufsbezeichnung festzulegen.
- source_word: כְּרֻבִים
  choice: Kerubim
  rationale: „Kerubim“ ist die im deutschen Bibelregister etablierte Bezeichnung für die dargestellten himmlischen Wesen und vermeidet die irreführenden Assoziationen des Wortes „Putten“.
- source_word: עָשָׂה אֹתָהּ כְּרֻבִים
  choice: mit Kerubim
  rationale: Die knappe Formulierung drückt aus, dass Kerubim als Gestaltungselemente in den Vorhang eingearbeitet waren; zusammen mit „kunstvoll gearbeitet“ bleibt die hebräische Konstruktion verständlich.
