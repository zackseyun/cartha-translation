  text: וַ/יִּקְרָ֣א מֹשֶׁ֗ה אֶל בְּצַלְאֵ֘ל וְ/אֶל אָֽהֳלִיאָב֒ וְ/אֶל֙ כָּל אִ֣ישׁ חֲכַם לֵ֔ב אֲשֶׁ֨ר נָתַ֧ן יְהוָ֛ה חָכְמָ֖ה בְּ/לִבּ֑/וֹ כֹּ֚ל אֲשֶׁ֣ר נְשָׂא֣/וֹ לִבּ֔/וֹ לְ/קָרְבָ֥ה אֶל הַ/מְּלָאכָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/002.yaml
  text: Then Moses called Bezalel and Oholiab and every wise-hearted man in whose heart Yahweh had put wisdom[b][a], everyone whose heart stirred him to come to the work to do it.
translation:
  language: de
  text: Da rief Mose Bezalel und Oholiab sowie alle, die weisen Herzens waren[a] und denen Jahwe Weisheit ins Herz gegeben hatte – alle, deren Herz sie antrieb[b], an die Arbeit heranzutreten, um sie auszuführen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jeder Mann weisen Herzens“. Gemeint sind Menschen, die mit Weisheit und besonders mit handwerklichem Können begabt waren.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deren Herz sie bewegte“ oder „antrieb“; wörtlich: „dessen Herz ihn erhob“. Die hebräische Wendung bezeichnet innere Bereitschaft oder einen inneren Impuls.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Da rief Mose
  rationale: קרא אֶל bezeichnet hier das Herbeirufen zu einer Aufgabe. „Da rief Mose …“ gibt die fortlaufende Erzählung natürlich wieder.
- source_word: בְּצַלְאֵל וְאֶל אָהֳלִיאָב
  choice: Bezalel und Oholiab
  rationale: Die Personennamen werden in geläufiger deutscher Umschrift wiedergegeben.
- source_word: כָּל אִישׁ חֲכַם לֵב
  choice: alle, die ein weises Herz hatten
  rationale: Die Formulierung bewahrt das hebräische Herzbild; im Zusammenhang umfasst die Weisheit besonders handwerkliche Befähigung. Die plurale, inklusive Formulierung entspricht der auf eine Gruppe bezogenen Aussage.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה בְּלִבּוֹ
  choice: denen Jahwe Weisheit ins Herz gegeben hatte
  rationale: Die Wendung erhält sowohl den göttlichen Ursprung der Weisheit als auch die hebräische Herzsprache.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Umschrift.
- source_word: כֹּל אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: alle, die ihr Herz dazu bewegte
  rationale: Die bildhafte Wendung beschreibt innere Bereitschaft oder einen inneren Antrieb, ohne genauer festzulegen, wie dieser entstand.
- source_word: לְקָרְבָה אֶל הַמְּלָאכָה
  choice: sich an die Arbeit zu machen
  rationale: Wörtlich ist vom Herantreten an die Arbeit die Rede. Die deutsche Wendung vermittelt im Kontext natürlich, dass sie bereitwillig an das Werk herangingen.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: und sie auszuführen
  rationale: Das feminine Suffix bezieht sich auf מְלָאכָה, „Arbeit“. „Ausführen“ ist hier idiomatischer als das wörtliche „sie tun“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Die Transliteration bewahrt diesen Namen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Ursprung der handwerklichen Weisheit
  choice: Jahwe hatte sie ins Herz gegeben
  alternative: sie waren von Herzen weise
  rationale: Der Relativsatz schreibt die Weisheit ausdrücklich Jahwes Gabe zu; diese Aussage wird nicht auf eine bloß natürliche Begabung reduziert.
- issue: Innerer Antrieb zur Arbeit
  choice: ihr Herz bewegte sie
  alternative: Jahwe bewegte ihr Herz
  rationale: Das Subjekt der hebräischen Wendung ist das Herz. Der Text benennt an dieser Stelle nicht ausdrücklich Jahwe als unmittelbaren Urheber dieses Antriebs, daher bleibt die Formulierung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Herzsprache bleibt in beiden Wendungen sichtbar, wird aber durch Fußnoten erläutert. „Sich an die Arbeit machen“ vermeidet eine im Deutschen missverständliche räumliche Wiedergabe von קרב und bezeichnet hier den Eintritt in die Arbeit am Heiligtum.
