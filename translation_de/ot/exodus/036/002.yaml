revisions:
- from: Da rief Mose Bezalel und Oholiab sowie alle, die ein weises Herz hatten[a], denen Jahwe Weisheit ins Herz gegeben hatte – alle, die ihr Herz dazu bewegte[b], sich an die Arbeit zu machen und sie auszuführen.
  to: Da rief Mose Bezalel und Oholiab sowie alle, die weisen Herzens waren[a] und denen Jahwe Weisheit ins Herz gegeben hatte – alle, deren Herz sie antrieb[b], an die Arbeit heranzutreten, um sie auszuführen.
  rationale: Die Revision glättet den deutschen Satzbau, koordiniert die beiden auf dieselbe Personengruppe bezogenen Eigenschaften eindeutig und bewahrt die im hebräischen Text wiederholte Gesamtbezeichnung »alle«. Sie hält die Herzmetaphorik fest, ohne den inneren Antrieb theologisch näher zu bestimmen, und gibt לְקָרְבָה mit der passenden Annäherungsnuance wieder.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:45:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des hebräischen Textes wieder: Moses’ Herbeirufen, Bezalel und Oholiab, die von Jahwe geschenkte Weisheit sowie den inneren Antrieb, zur Arbeit heranzutreten. Die doppelte קבוצתformulierung (»jeden/alle ...; jeden/alle ...«) sollte jedoch klarer abgebildet werden. »Sich an die Arbeit zu machen« ist etwas stärker aspektuell („beginnen“) als לְקָרְבָה, das zunächst ein Herantreten bzw. Sich-der-Arbeit-Nähern bezeichnet.'
  naturalness: Der Relativsatzanschluss »alle, die ... hatten, denen ...« wirkt im Deutschen syntaktisch holprig. »Weisen Herzens« ist eine natürliche, würdige und zugleich quellennahe Wiedergabe. Die Konstruktion »deren Herz sie antrieb, an die Arbeit heranzutreten« ist idiomatisch und erhält sowohl die Herzmetaphorik als auch die Bewegungsnuance.
  terminology: »Jahwe«, »Weisheit«, »Herz« und »Arbeit« sind konsistent und angemessen. Die Namen Bezalel und Oholiab entsprechen der vorliegenden Namenskonvention. Die Fußnoten werden sprachlich und sachlich präzisiert, ohne die hebräische Wendung übermäßig festzulegen.
