  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente wieder: zwei Bretter, die Ecken der Wohnung und deren rückwärtigen Bereich. „An der Rückseite“ lässt jedoch die duale/plurale Nuance von בַּיַּרְכָתַיִם weniger deutlich erkennen; im Zusammenhang mit den zwei Eckbrettern sind „hinteren Ecken“ im Deutschen genauer.'
