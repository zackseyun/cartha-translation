translation:
  language: de
  text: Und er fertigte zwei Bretter für die hinteren Ecken der Wohnung an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Eckstücke der Wohnung, an ihren beiden hinteren Seiten“. Die hebräischen Ausdrücke bezeichnen die hinteren Enden beziehungsweise Ecken des Bauwerks und können entweder die Lage an den Ecken oder besonders zusammengefügte Eckbretter hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: Und ... zwei
  rationale: Die Konjunktion führt den nächsten Bauabschnitt in der fortlaufenden Aufzählung ein; die Zahl wird ausdrücklich wiedergegeben.
- source_word: קְרָשִׁים
  choice: Bretter
  rationale: קֶרֶשׁ bezeichnet hier die tragenden Holzbretter beziehungsweise Wandtafeln der Wohnung. „Bretter“ ist verständlich und entspricht dem wiederholten Sprachgebrauch des Abschnitts.
- source_word: עָשָׂה
  choice: fertigte ... an
  rationale: Das gewöhnliche Verb עשה bedeutet „machen“. Im handwerklichen Bauzusammenhang klingt „anfertigen“ im modernen Deutschen natürlich und präzise.
- source_word: לִ/מְקֻצְעֹת
  choice: für die Ecken
  rationale: Der Ausdruck kann die Eckstellen oder eigens verbundene Eckstücke bezeichnen. „Für die Ecken“ bewahrt diese räumlich-konstruktive Offenheit.
- source_word: הַ/מִּשְׁכָּן
  choice: der Wohnung
  rationale: מִשְׁכָּן bezeichnet das Heiligtum als Wohnstätte Gottes. „Wohnung“ gibt die hebräische Wortbedeutung knapp wieder und bleibt im Kontext verständlich.
- source_word: בַּ/יַּרְכָתָיִם
  choice: an der Rückseite
  rationale: Die Dualform verweist auf die beiden hinteren Seiten beziehungsweise Endbereiche. Da bereits von zwei Ecken die Rede ist, gibt „an der Rückseite“ die Lage ohne schwerfällige Wiederholung an.
