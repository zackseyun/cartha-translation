base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/029.yaml
  text: They were paired at the bottom[a], and together they were complete up to its top, to the one ring. Thus he did for both of them[c][b], for the two corners.
translation:
  language: de
  text: Sie entsprachen einander von unten an[a] und waren zusammen vollständig bis zu seinem oberen Ende, bis zu einem Ring[b]. So machte er es für beide, für die beiden Ecken[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „waren von unten an als Paar verbunden“ oder „waren unten einander zugeordnet“. Das hebräische Wort bezeichnet zwei einander entsprechende Teile; die genaue Art ihrer Verbindung bleibt offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Bauformel ist syntaktisch schwierig. Oder: „waren zusammen ganz bis zu seinem oberen Ende, bis zu dem einen Ring“. „Vollständig“ kann sich auf die vollständige Ausführung beziehungsweise Verbindung bis zum oberen Ende beziehen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „für die beiden Eckteile“. Wörtlich steht „für die beiden Ecken“; gemeint sind wahrscheinlich die Bauteile an den beiden Ecken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹאֲמִם
  choice: paarweise zusammengefügt
  rationale: Das Wort bezeichnet zwei einander entsprechende Teile. Die Formulierung gibt sowohl ihre Zuordnung als Paar als auch den baulichen Zusammenhang natürlich wieder.
- source_word: מִלְּמַטָּה
  choice: unten
  rationale: Die Wendung bezeichnet hier den unteren Bereich der Konstruktion; „unten“ ist knapp und idiomatisch.
- source_word: יַחְדָּו
  choice: gemeinsam
  rationale: Gibt das Adverb „zusammen“ wieder, ohne die bereits ausgedrückte Paarbildung unnötig zu wiederholen.
- source_word: תַמִּים
  choice: vollständig
  rationale: Bewahrt den Sinn von vollständig, ganz oder baulich abgeschlossen und unterscheidet ihn von תוֹאֲמִם.
- source_word: אֶל רֹאשׁוֹ
  choice: bis zu seiner Spitze
  rationale: „Bis zu“ erhält die räumliche Erstreckung nach oben; „Spitze“ bezeichnet hier das obere Ende des Bauteils.
- source_word: הַטַּבַּעַת הָאֶחָת
  choice: dem einen Ring
  rationale: Gibt den bestimmten Artikel und die Zahl wörtlich wieder, ohne „erste“ hineinzulesen.
- source_word: כֵּן עָשָׂה
  choice: So machte er es
  rationale: Entspricht der zusammenfassenden hebräischen Wendung und bewahrt das singularische Verb.
- source_word: לִשְׁנֵיהֶם
  choice: bei beiden
  rationale: Bezieht die beschriebene Bauweise idiomatisch auf beide entsprechenden Teile.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: an den beiden Ecken
  rationale: מִקְצֹעֹת bezeichnet die Ecken beziehungsweise Eckbereiche; „an“ passt natürlich zur räumlichen Konstruktion.
