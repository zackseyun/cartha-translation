  text: And he made forty silver bases under the twenty frames, two bases under the one frame for its two tenons, and two bases under the other frame for its two tenons.
translation:
  language: de
  text: 'Und er fertigte vierzig silberne Sockel unter den zwanzig Rahmen an: zwei Sockel unter dem einen Rahmen für seine beiden Zapfen und zwei Sockel unter dem anderen Rahmen für seine beiden Zapfen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְנֵי
  choice: Sockel
  rationale: Bezeichnet die silbernen, als Unterbau dienenden Aufnahmen der Rahmen; »Sockel« ist im modernen Deutsch anschaulich und sachgerecht.
- source_word: הַקְּרָשִׁים
  choice: Rahmen
  rationale: Die Bauteile der Stiftshütte werden als aufrecht stehende Konstruktionselemente verstanden; »Rahmen« entspricht der konsultierten Fassung und wahrt die bauliche Funktion.
- source_word: יְדֹתָיו
  choice: seine beiden Zapfen
  rationale: Wörtlich »seine Hände«; im handwerklichen Zusammenhang sind die vorspringenden Verbindungsteile gemeint, die in die Sockel eingesetzt wurden.
- source_word: תַּחַת
  choice: für / unter
  rationale: Beim ersten Vorkommen klingt »für die zwanzig Rahmen« natürlich und bezeichnet die Zuordnung; bei den Einzelrahmen wird die räumliche Anordnung mit »unter« wiedergegeben.
