  text: Two tenons for each board[a], joined one to another[b]; thus he made all the boards of the tabernacle.
translation:
  language: de
  text: Zwei Zapfen hatte jedes Brett[a], miteinander verbunden[b]. So machte er es bei allen Brettern der Wohnung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Hände«; gemeint sind die vorspringenden Zapfen jedes Brettes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »einer dem anderen entsprechend« oder »einer dem anderen gegenüber«; die Wendung kann die passende Ausrichtung der beiden Zapfen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי יָדֹת
  choice: zwei Zapfen
  rationale: יָדֹת bedeutet wörtlich »Hände«, bezeichnet hier aber bildlich die vorspringenden Verbindungsteile der Bretter. »Zapfen« ist im Deutschen der präzise und verständliche Fachausdruck.
- source_word: קֶּרֶשׁ
  choice: Brett
  rationale: Bezeichnet ein tragendes hölzernes Bauteil der Wohnung; »Brett« entspricht dem Baukontext und bleibt nah am hebräischen Ausdruck.
- source_word: מְשֻׁלָּבֹת אַחַת אֶל אֶחָת
  choice: einer dem anderen entsprechend
  rationale: Die Formulierung beschreibt die aufeinander abgestimmte Anordnung der beiden Zapfen, ohne die genaue Geometrie stärker festzulegen, als es der hebräische Text tut.
- source_word: כֵּן עָשָׂה
  choice: So machte er es
  rationale: Gibt die Angabe der Art und Weise natürlich wieder; das Objekt »es« ist im Deutschen zur idiomatischen Formulierung ergänzt.
- source_word: מִּשְׁכָּן
  choice: Wohnung
  rationale: Die Grundbedeutung ist »Wohnung/Wohnstätte«; im Exodus bezeichnet das Wort das transportable Heiligtum. »Wohnung« bewahrt die sprachliche und theologische Verbindung zum Wohnen Gottes unter Israel.
theological_decisions:
- issue: Wiedergabe von מִשְׁכָּן
  choice: Wohnung
  alternative: Stiftshütte
  rationale: »Wohnung« bildet die Bedeutung des hebräischen Begriffs direkt und verständlich ab. »Stiftshütte« ist kirchlich vertraut, aber im heutigen Deutsch altertümlich und lexikalisch weniger transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Bauanweisung wird in natürlicher deutscher Syntax wiedergegeben; technische Genauigkeit und die Bildsprache des Hebräischen werden durch Fußnoten bewahrt.
