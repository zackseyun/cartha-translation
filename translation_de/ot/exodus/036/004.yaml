  text: Da kamen alle geschickten Männer, die die gesamte Arbeit am Heiligtum verrichteten, jeder von seiner Arbeit, an der er gerade arbeitete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Mann für Mann von seiner Arbeit, die sie ausführten.“ Die Wiederholung von „Mann“ ist distributiv und bedeutet: Jeder Einzelne kam von seiner jeweiligen Arbeit. Der hebräische Relativsatz steht formal im Plural.'
    reason: Die Fußnote hält die auffällige hebräische Verbindung aus distributiver Singularform und formalem Plural fest, während der deutsche Haupttext den distributiven Sinn idiomatisch wiedergibt.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da kamen
  rationale: Das Wayyiqtol führt die Erzählung fort; „Da kamen“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: כָּל הַחֲכָמִים
  choice: alle kunstfertigen Männer
  rationale: חכמים bezeichnet hier die für den Bau des Heiligtums befähigten und fachkundigen Männer, nicht bloß intellektuell Weise. „Kunstfertig“ bewahrt den handwerklich-künstlerischen Sinn.
- source_word: הָעֹשִׂים
  choice: die … beschäftigt waren
  rationale: Das Partizip bezeichnet eine fortdauernde Tätigkeit. Die Formulierung vermeidet im Deutschen eine schwerfällige Wiederholung von „arbeiten“.
- source_word: אֵת כָּל מְלֶאכֶת הַקֹּדֶשׁ
  choice: mit allen Arbeiten am Heiligtum
  rationale: מְלֶאכֶת bezeichnet die auszuführenden Arbeiten; הַקֹּדֶשׁ meint in diesem Zusammenhang das Heiligtum. „Am Heiligtum“ bezeichnet idiomatisch das Gesamtprojekt, nicht nur eine Tätigkeit innerhalb des Gebäudes.
- source_word: אִישׁ אִישׁ
  choice: jeder
  rationale: Die Wiederholung ist distributiv und bedeutet „jeder Einzelne“.
- source_word: מִמְּלַאכְתּוֹ
  choice: von seiner Arbeit
  rationale: מִן bezeichnet hier das Wegkommen von der jeweiligen Tätigkeit; das Suffix wird mit „seiner“ ausdrücklich wiedergegeben.
- source_word: אֲשֶׁר הֵמָּה עֹשִׂים
  choice: die sie gerade ausführten
  rationale: Der hebräische Relativsatz steht formal im Plural und wird deshalb im Haupttext pluralisch wiedergegeben. „Gerade“ verdeutlicht die laufende Tätigkeit des Partizips, ohne eine zusätzliche zeitliche Behauptung einzuführen.
