    rationale: Das Partizip עֹשִׂים mit dem Objekt „alle Arbeit des Heiligtums“ bezeichnet die Ausführung bzw. Verrichtung dieser Arbeit, nicht bloß ein Beschäftigtsein damit.
  - severity: medium
    issue: Der Haupttext verbindet „jeder von seiner Arbeit“ mit „die sie gerade ausführten“.
    rationale: Diese Mischung von distributivem Singular und pluralischem Relativpronomen ist im Deutschen unnatürlich. Der formale hebräische Plural kann in einer Fußnote dokumentiert werden; im Text ist der distributive Singular angemessen.
  - severity: low
