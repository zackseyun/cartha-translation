  source_fidelity: 'Die Grundstruktur wird getroffen: Die fachkundigen Männer verlassen jeweils ihre laufende Arbeit. „Mit allen Arbeiten am Heiligtum beschäftigt waren“ ist jedoch weniger genau als die ausdrückliche Aussage, dass sie diese Arbeit ausführten. Der Plural im hebräischen Relativsatz steht bei der distributiven Wendung אִישׁ אִישׁ in Spannung zum Singular und sollte im Deutschen nicht durch das unnatürliche „jeder ... die sie“ nachgebildet werden.'
  naturalness: „Jeder von seiner Arbeit, die sie gerade ausführten“ ist im modernen Deutschen wegen des Wechsels von singularischem „jeder/seiner“ zu pluralischem „sie“ syntaktisch und referenziell holprig. Eine distributive Singularform ist idiomatisch und gibt den beabsichtigten Sinn klar wieder. „Geschickt“ ist zudem moderner und geläufiger als „kunstfertig“.
  terminology: „Heiligtum“ gibt הַקֹּדֶשׁ im Kontext des Heiligtumsbaus passend wieder. „Geschickte Männer“ gibt חֲכָמִים hier als handwerklich Befähigte wieder, ohne die Bedeutung auf bloße Intelligenz zu verengen.
  issues:
