    rationale: „Geschickte Männer“ ist geläufig, wahrt die männliche Referenz des hebräischen Ausdrucks und bezeichnet im Kontext handwerkliche Befähigung.
  revised_text: Da kamen alle geschickten Männer, die die gesamte Arbeit am Heiligtum verrichteten, jeder von seiner Arbeit, an der er gerade arbeitete.[a]
