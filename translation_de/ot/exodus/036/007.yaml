  language: en
  yaml_path: translation/ot/exodus/036/007.yaml
  text: And the material was sufficient for all the work to do it[a], and there was more than enough.
translation:
  language: de
  text: Es war genug Material für alle Arbeiten vorhanden, die auszuführen waren, und sogar mehr als genug.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und es blieb noch etwas übrig.“ Das Hebräische bezeichnet einen Überschuss und kann besonders hervorheben, dass nach Deckung des Bedarfs noch Material übrig war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּלָאכָה
  choice: Material
  rationale: מְלָאכָה bedeutet gewöhnlich „Arbeit“, bezeichnet hier im Zusammenhang mit den zuvor gebrachten Gaben jedoch das für die Arbeiten verfügbare Material. Die kontextbezogene Wiedergabe vermeidet im Deutschen die missverständliche Aussage, die Arbeit selbst habe ausgereicht.
- source_word: הָיְתָה דַיָּם
  choice: Es war genug … vorhanden
  rationale: דַּי bezeichnet ausreichende Menge oder Genüge; das Suffix bezieht sich auf die Beteiligten beziehungsweise ihren Bedarf. Die deutsche Existenzkonstruktion gibt den Sinn natürlich wieder.
- source_word: לְכָל הַמְּלָאכָה לַעֲשׂוֹת אֹתָהּ
  choice: für alle Arbeiten …, die auszuführen waren
  rationale: Die zweite Verwendung von מְלָאכָה bezeichnet die auszuführende Arbeit. Der Relativsatz gibt den Infinitiv mit Objektsuffix idiomatisch wieder, ohne den Bezug auf die Gesamtheit der Arbeiten abzuschwächen.
- source_word: וְהוֹתֵר
  choice: und sogar mehr als genug
  rationale: 'Die Form von יתר drückt einen Überschuss aus: Über das Erforderliche hinaus war noch Material vorhanden. „Sogar mehr als genug“ bewahrt diese steigernde Aussage in natürlichem Deutsch.'
theological_decisions: []
