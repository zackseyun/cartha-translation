  register: Modernes, würdiges Standarddeutsch. Die Wiederholung des hebräischen מְלָאכָה wird entsprechend den beiden kontextuell verschiedenen Bezügen einmal mit „Material“ und einmal mit „Arbeiten“ wiedergegeben.
