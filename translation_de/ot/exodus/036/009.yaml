  yaml_path: translation/ot/exodus/036/009.yaml
  text: The length of each curtain was twenty-eight cubits[a], and the width of each curtain was four cubits[b]; all the curtains had one measurement.
translation:
  language: de
  text: Die Länge jeder Zeltbahn betrug achtundzwanzig Ellen[a], und die Breite vier Ellen. Für alle Zeltbahnen galt dasselbe Maß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Elle entsprach ungefähr 45 Zentimetern; ihre genaue Länge konnte jedoch variieren.
    reason: measurement_explanation
lexical_decisions:
- source_word: אֹרֶךְ
  choice: Länge
  rationale: Die übliche Bezeichnung für die längere räumliche Ausdehnung eines Gegenstands.
- source_word: יְרִיעָה
  choice: Zeltbahn
  rationale: Im Zusammenhang mit dem Heiligtum bezeichnet das Wort eine einzelne Stoffbahn der Zeltdecke; „Zeltbahn“ ist hier konkreter und natürlicher als das allgemeinere „Vorhang“.
- source_word: הָאַחַת / הָאֶחָת
  choice: jeder Zeltbahn
  rationale: Wörtlich steht „die eine“; im Zusammenhang der Maßangaben ist die Formulierung distributiv zu verstehen und wird im Deutschen natürlich mit „jeder“ wiedergegeben. In der Breitenangabe kann die Wiederholung ohne Sinnverlust entfallen.
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: achtundzwanzig
  rationale: Direkte Wiedergabe der hebräischen Zahl in heutiger deutscher Zahlenfolge.
- source_word: אַמָּה
  choice: Elle
  rationale: Die historische hebräische Maßeinheit wird beibehalten, statt eine unsichere exakte Umrechnung in moderne Maße vorzutäuschen.
- source_word: רֹחַב
  choice: Breite
  rationale: Die natürliche deutsche Entsprechung im Gegensatz zur Länge.
- source_word: אַרְבַּע
  choice: vier
  rationale: Direkte Wiedergabe der Zahl.
- source_word: מִדָּה אַחַת
  choice: dasselbe Maß
  rationale: Gibt das wörtliche „ein Maß“ idiomatisch wieder und betont, dass sämtliche Zeltbahnen einheitliche Abmessungen hatten.
- source_word: לְכָל הַיְרִיעֹת
  choice: für alle Zeltbahnen
  rationale: Bewahrt die Präposition und den umfassenden Geltungsbereich der Aussage.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Zeltbahn“ macht die Funktion der einzelnen Stoffstücke im Kontext des Heiligtums deutlich. Der zweite Satz folgt der knappen hebräischen Schlussformel, ohne durch „Abmessungen“ den Singular מִדָּה zu verdecken.
