  text: Und er fertigte für die Stiftshütte aufrecht stehende Bretter aus Akazienholz an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Und er fertigte … an
  rationale: Das Wayyiqtol von עשה führt die Erzählung fort. „Fertigte … an“ ist im handwerklichen Zusammenhang natürlich und gibt die Herstellung wieder, ohne eine besondere Bauweise hinzuzufügen.
- source_word: הַקְּרָשִׁים
  choice: die Bretter
  rationale: קֶרֶשׁ bezeichnet hier die tragenden hölzernen Bauteile der Stiftshütte. „Bretter“ ist verständlich und wahrt die traditionelle, konkrete Bezeichnung; „Rahmen“ wäre stärker deutend.
- source_word: לַמִּשְׁכָּן
  choice: für die Stiftshütte
  rationale: מִשְׁכָּן bezeichnet im Exoduskontext das heilige Wohnheiligtum. „Stiftshütte“ ist im Deutschen die etablierte und kontextuell eindeutige Benennung.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: Die Konstruktverbindung bezeichnet Holz der Schittim-Akazie. „Akazienholz“ ist die natürliche und allgemein verständliche deutsche Wiedergabe.
- source_word: עֹמְדִים
  choice: aufrecht stehend
  rationale: Das Partizip beschreibt die senkrechte Ausrichtung der Bretter. „Aufrecht stehend“ gibt diese architektonische Funktion deutlich wieder, ohne das Wort lediglich als „stehend“ abzuschwächen.
