translation_notes:
  register: Moderner, würdiger und sachlicher Stil eines Bauberichts. Die koordinierende Wiederholung des Hebräischen bleibt erhalten. „Wohnstätte“ ist als verständliche, quellennähere Bezeichnung gewählt; die Fußnoten bewahren echte Unsicherheiten hinsichtlich der Bauform und der räumlichen Formulierung.
