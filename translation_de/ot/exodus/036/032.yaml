  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the tabernacle at the far rear on the west.
translation:
  language: de
  text: und fünf Riegel[a] für die Bretter[b] der zweiten Seite der Wohnstätte und fünf Riegel für die Bretter an der hintersten Seite der Wohnstätte, nach Westen hin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Querbalken“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Rahmenteile“. Das hebräische Wort lässt die genaue Bauform dieser Holzteile offen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich auch möglich: „an den hintersten Teilen, westwärts“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: Riegel
  rationale: Im Zusammenhang mit dem Bau der Wohnstätte bezeichnet das Wort die waagerechten Holzriegel, welche die Bretter beziehungsweise Rahmenteile zusammenhielten. „Riegel“ ist im Deutschen präzise und in diesem Bauzusammenhang geläufig.
- source_word: קַרְשֵׁי
  choice: Bretter
  rationale: Das Wort bezeichnet die tragenden hölzernen Bauteile der Wohnstätte. „Bretter“ wahrt die traditionelle, konkrete Wiedergabe; ob es sich genauer um massive Bretter oder offene Rahmen handelte, bleibt archäologisch und lexikalisch umstritten.
- source_word: צֶלַע הַמִּשְׁכָּן הַשֵּׁנִית
  choice: der zweiten Seite der Wohnstätte
  rationale: „Seite“ gibt צֶלַע ohne unnötige bauliche Präzisierung wieder, und „zweiten“ bewahrt die ausdrückliche Zählung des Hebräischen statt sie idiomatisch zu „anderen“ abzuschwächen.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnstätte
  rationale: „Wohnstätte“ bewahrt den Zusammenhang des hebräischen Begriffs mit dem Wohnen und bezeichnet hier die heilige Zeltanlage. Es ist verständlicher und lexikalisch transparenter als das traditionelle „Stiftshütte“.
- source_word: לַיַּרְכָתַיִם
  choice: an der äußersten Rückseite
  rationale: Der Dual beziehungsweise die entsprechende Ortsbezeichnung weist auf den hintersten, entlegenen Bereich. „Äußerste Rückseite“ erhält diesen Bedeutungsanteil, statt lediglich „Rückseite“ zu sagen.
- source_word: יָמָּה
  choice: nach Westen hin
  rationale: Die Richtungsform bedeutet in diesem Zusammenhang „westwärts/nach Westen“. Die Wiedergabe nennt die gemeinte Himmelsrichtung natürlich und erhält zugleich die Richtungskomponente.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: und fünf … und fünf
  rationale: Das wiederholte „und“ bildet die koordinierende, aufzählende Form des hebräischen Bauberichts ab.
