base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/025.yaml
  text: For the second side of the tabernacle[a], on the north side, he made twenty boards.
translation:
  language: de
  text: Für die zweite Seite der Stiftshütte, die Nordseite, fertigte er zwanzig Bretter[a] an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rahmen“. Der hebräische Ausdruck kann tragende Bretter, Platten oder Rahmen bezeichnen; die genaue Form dieser Bauteile der Stiftshütte ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְצֶלַע
  choice: Für die ... Seite
  rationale: צֶלַע bezeichnet im Zusammenhang mit der Stiftshütte eine bauliche Seite, nicht eine anatomische Rippe. Die Verbindung aus Konjunktion und Präposition wird im Deutschen natürlich mit „Für“ wiedergegeben.
- source_word: הַמִּשְׁכָּן
  choice: der Stiftshütte
  rationale: מִשְׁכָּן bezeichnet hier das transportable Heiligtum Israels. „Stiftshütte“ ist die geläufige, kontextgerechte deutsche Bezeichnung.
- source_word: הַשֵּׁנִית
  choice: zweite
  rationale: Das Adjektiv bezeichnet die entsprechende zweite Längsseite und wird präzise mit „zweite“ wiedergegeben.
- source_word: לִפְאַת צָפוֹן
  choice: die Nordseite
  rationale: Die Wendung bestimmt die Ausrichtung der zweiten Seite nach Norden. Als Apposition ist „die Nordseite“ im Deutschen klar und natürlich.
- source_word: עָשָׂה
  choice: fertigte ... an
  rationale: עשה bedeutet allgemein „machen, herstellen“. Im Baubericht gibt „fertigte ... an“ die handwerkliche Tätigkeit idiomatisch wieder.
- source_word: עֶשְׂרִים
  choice: zwanzig
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: קְרָשִׁים
  choice: Bretter
  rationale: קְרָשִׁים bezeichnet die tragenden Holzelemente der Stiftshütte. „Bretter“ ist verständlich und traditionell, während die genaue Bauform unsicher bleibt und daher in einer Fußnote erläutert wird.
