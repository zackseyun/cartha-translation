  source_fidelity: 'Der Entwurf gibt die hebräische Rechtsvorschrift vollständig und in der richtigen Abfolge wieder: die Auslösung jedes erstgeborenen Esels mit einem שֶׂה, das Brechen des Genicks bei Nichtauslösung und die Auslösung jedes Erstgeborenen unter den Söhnen. „Eselsfohlen“ ist im Kontext einer Erstgeburt sachgerecht. „Auslösen“ trifft פדה im kultisch-rechtlichen Sinn gut; „das Genick brechen“ gibt וערפתו präzise wieder.'
