source:
  edition: WLC
  text: וְ/כָל פֶּ֤טֶר חֲמֹר֙ תִּפְדֶּ֣ה בְ/שֶׂ֔ה וְ/אִם לֹ֥א תִפְדֶּ֖ה וַ/עֲרַפְתּ֑/וֹ וְ/כֹ֨ל בְּכ֥וֹר אָדָ֛ם בְּ/בָנֶ֖י/ךָ תִּפְדֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/013.yaml
  text: And every firstborn of a donkey you shall redeem with a lamb; and if you do not redeem it[a], then you shall break its neck. And every firstborn of man among your sons you shall redeem.
translation:
  language: de
  text: Jedes erstgeborene Eselsfohlen musst du mit einem Schaf[a] auslösen. Wenn du es aber nicht auslöst, musst du ihm das Genick brechen. Jeden Erstgeborenen unter deinen Söhnen musst du auslösen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort שֶׂה bezeichnet allgemein ein einzelnes Tier des Kleinviehs, also ein Schaf oder eine Ziege.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר חֲמֹר
  choice: erstgeborenes Eselsfohlen
  rationale: פֶּטֶר bezeichnet wörtlich das, was den Mutterschoß öffnet. Im Deutschen gibt „erstgeborenes Eselsfohlen“ den rechtlichen Bezug natürlich und eindeutig wieder.
- source_word: תִּפְדֶּה
  choice: musst du auslösen
  rationale: פדה bezeichnet die Freigabe durch Ersatz oder Zahlung. „Auslösen“ bewahrt hier den rechtlich-kultischen Sinn; „musst“ gibt die verpflichtende Gesetzessprache des hebräischen Imperfekts wieder.
- source_word: בְשֶׂה
  choice: mit einem Schaf
  rationale: שֶׂה bezeichnet ein einzelnes Tier des Kleinviehs und kann ein Schaf oder eine Ziege sein. „Schaf“ ist im Deutschen in diesem Zusammenhang natürlich; die größere Bedeutungsbreite wird in einer Fußnote offengelegt.
- source_word: וַעֲרַפְתּוֹ
  choice: musst du ihm das Genick brechen
  rationale: ערף bezeichnet das Brechen des Genicks beziehungsweise Halses, nicht die gewöhnliche Schlachtung. Die deutsche Wendung ist klar und idiomatisch.
- source_word: בְּכוֹר אָדָם
  choice: Erstgeborenen
  rationale: Im Zusammenhang bezeichnet der Ausdruck einen erstgeborenen Menschen im Gegensatz zum Tier. Zusammen mit „unter deinen Söhnen“ ist „Erstgeborenen“ im Deutschen eindeutig und vermeidet die unnatürliche Formulierung „Erstgeborenen eines Menschen“.
- source_word: בְּבָנֶיךָ
  choice: unter deinen Söhnen
  rationale: Der hebräische Text nennt ausdrücklich die Söhne. Die Formulierung bleibt geschlechtsgenau und ist im Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe von אָדָם in בְּכוֹר אָדָם
  choice: Die menschliche Bedeutung wird durch „Erstgeborenen unter deinen Söhnen“ ausgedrückt, ohne אָדָם gesondert mit „Mensch“ wiederzugeben.
  alternative: „jeden Erstgeborenen eines Menschen unter deinen Söhnen“ oder „jeden menschlichen Erstgeborenen unter deinen Söhnen“
  rationale: אָדָם steht hier im Gegensatz zum Tier und bezeichnet die menschliche Gattung. Eine ausdrückliche, wörtliche Wiedergabe wäre im Deutschen redundant und unnatürlich; „unter deinen Söhnen“ macht den menschlichen Bezug bereits eindeutig, ohne die Aussage theologisch zu erweitern oder einzuschränken.
translation_notes:
  register: Moderne, würdige Standardsprache. Die wiederholte Verpflichtungsform „musst du“ bildet den gesetzlichen Charakter ab; „auslösen“ hält die kultisch-rechtliche Bedeutung fest. Der Satzbau folgt der hebräischen Abfolge, bleibt aber im Deutschen flüssig.
