base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/016.yaml
  text: And it shall be as a sign on your hand and as frontlets between your eyes[b][a], for with a strong hand Yahweh brought us out from Egypt.
translation:
  language: de
  text: Und es soll dir als Zeichen an deiner Hand und als Stirnschmuck[a] zwischen deinen Augen[b] dienen; denn mit starker Hand hat Jahwe uns aus Ägypten herausgeführt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Schmuckstück“; die Bedeutung des seltenen hebräischen Wortes ist unsicher. Es bezeichnet wahrscheinlich etwas, das als Erinnerungszeichen an der Stirn getragen wird. Später wurden damit oft Tefillin verbunden.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „zwischen deinen Augen“; die Wendung wird häufig als „auf deiner Stirn“ verstanden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es soll … dienen
  rationale: Das Qal-Perfekt mit וְ hat in diesem Anweisungszusammenhang futurisch-resultative Bedeutung. Die Formulierung gibt zugleich die Funktion des zuvor genannten Brauchs natürlich wieder.
- source_word: לְאוֹת
  choice: als Zeichen
  rationale: אוֹת bezeichnet ein Zeichen oder Erinnerungszeichen. „Zeichen“ ist verständlich und lässt die konkrete Ausgestaltung offen.
- source_word: עַל יָדְכָה
  choice: an deiner Hand
  rationale: Der hebräische Text nennt ausdrücklich die Hand, nicht den Arm. „An“ klingt bei einem getragenen Zeichen im Deutschen natürlicher als „auf“.
- source_word: וּלְטוֹטָפֹת
  choice: als Stirnbänder
  rationale: טוֹטָפֹת ist ein seltenes Wort im Plural und bezeichnet wahrscheinlich etwas, das als Erinnerungszeichen an der Stirn getragen wird. „Stirnbänder“ wahrt den konkreten Bezug, ohne die spätere Bezeichnung „Gebetsriemen“ in den Haupttext einzutragen.
- source_word: בֵּין עֵינֶיךָ
  choice: zwischen deinen Augen
  rationale: Die wörtliche Bildsprache des Hebräischen bleibt erhalten; die idiomatische Deutung „auf deiner Stirn“ steht in einer Fußnote.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für das Zeichen ein.
- source_word: בְּחֹזֶק יָד
  choice: mit starker Hand
  rationale: Die Formulierung bildet das hebräische Bild transparent ab und bezeichnet Jahwes machtvolles Handeln.
- source_word: הוֹצִיאָנוּ
  choice: hat … uns … herausgeführt
  rationale: Der Hifil von יצא bedeutet „hinausführen“ beziehungsweise „herausführen“. Das deutsche Perfekt gibt die abgeschlossene Rettungstat natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִמִּצְרָיִם
  choice: aus Ägypten
  rationale: Die Präposition מִן bezeichnet den Ausgangspunkt; zusammen mit „herausgeführt“ ist „aus Ägypten“ idiomatisches Deutsch.
theological_decisions:
- issue: Ob die Bilder von Hand und Augen ausdrücklich als spätere Ritualgegenstände oder nur sinnbildlich auszulegen sind
  choice: 'Die konkrete Bildsprache bleibt im Haupttext erhalten: „an deiner Hand“ und „Stirnbänder zwischen deinen Augen“.'
  alternative: Im Haupttext „Gebetsriemen“ schreiben oder die Aussage vollständig als bildliche Erinnerung umschreiben.
  rationale: Der hebräische Text legt nicht ausdrücklich fest, ob die Anweisung ausschließlich wörtlich, ausschließlich sinnbildlich oder in beiderlei Sinn zu verstehen ist. Die Übersetzung hält diese Auslegungsoffenheit aufrecht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist flüssig, während die konkrete hebräische Bildsprache und die Seltenheit des Ausdrucks טוֹטָפֹת sichtbar bleiben.
