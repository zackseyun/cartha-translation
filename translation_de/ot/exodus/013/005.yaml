  terminology: „Jahwe“ ist eine angemessene Wiedergabe des Gottesnamens. Die Volksnamen Kanaaniter, Hetiter, Amoriter, Hiwiter und Jebusiter sind im Deutschen etabliert. „Vorfahren“ ist als gegenwartsdeutsche Wiedergabe von „Väter“ vertretbar. Die Bezeichnung „Dienst“ wahrt die kultische und zugleich offene Bedeutung von עֲבֹדָה besser als „Gottesdienst“.
