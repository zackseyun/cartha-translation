  text: וְ/הָיָ֣ה כִֽי יְבִֽיאֲ/ךָ֣ יְהוָ֡ה אֶל אֶ֣רֶץ הַֽ֠/כְּנַעֲנִי וְ/הַ/חִתִּ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֗י אֲשֶׁ֨ר נִשְׁבַּ֤ע לַ/אֲבֹתֶ֨י/ךָ֙ לָ֣/תֶת לָ֔/ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ וְ/עָבַדְתָּ֛ אֶת הָ/עֲבֹדָ֥ה הַ/זֹּ֖את בַּ/חֹ֥דֶשׁ הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/005.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], the Hittites, the Amorites, the Hivites, and the Jebusites, which he swore to your fathers to give you, a land flowing with milk and honey, you shall perform this service in this month.
translation:
  language: de
  text: Und wenn Jahwe dich in das Land der Kanaaniter, Hetiter, Amoriter, Hiwiter und Jebusiter bringt, das er deinen Vorfahren geschworen hat, dir zu geben – ein Land, in dem Milch und Honig fließen –, dann sollst du in diesem Monat diesen Dienst[a] verrichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „diesen Ritus“ oder „diese Feier“. Das hebräische Wort kann einen vorgeschriebenen Akt der Gottesverehrung oder einen zu leistenden Dienst bezeichnen.'
    reason: Lexikalische Bedeutungsbreite von עֲבֹדָה im kultischen Zusammenhang.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Und wenn
  rationale: Die Wendung leitet einen erwarteten künftigen Zeitpunkt ein. „Und wenn“ gibt den zeitlichen Sinn natürlich wieder.
- source_word: יְבִיאֲךָ
  choice: dich … bringt
  rationale: Der Hifil von בוא bezeichnet das Hineinbringen in ein Gebiet; die deutsche Konstruktion mit „in das Land“ ist idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַכְּנַעֲנִי וְהַחִתִּי וְהָאֱמֹרִי וְהַחִוִּי וְהַיְבוּסִי
  choice: der Kanaaniter, Hetiter, Amoriter, Hiwiter und Jebusiter
  rationale: Die singularischen hebräischen Volksbezeichnungen werden in der deutschen Landformel natürlich als pluralische Völkernamen ausgedrückt.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: das er deinen Vorfahren unter Eid versprochen hat, dir zu geben
  rationale: Die Formulierung bewahrt sowohl den Eid gegenüber den Vorfahren als auch die Zusage, das Land dem angesprochenen Volk zu geben.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: ein Land, in dem Milch und Honig fließen
  rationale: Die geläufige deutsche Wendung gibt das Bild von Fruchtbarkeit und Überfluss anschaulich wieder.
- source_word: וְעָבַדְתָּ אֶת הָעֲבֹדָה הַזֹּאת
  choice: dann sollst du … diesen Gottesdienst vollziehen
  rationale: Verb und Substantiv bilden eine kultische Verbindung. „Gottesdienst vollziehen“ wahrt den Gedanken eines vorgeschriebenen Dienstes, ohne die konkrete Gestalt stärker festzulegen als der Kontext.
- source_word: בַּחֹדֶשׁ הַזֶּה
  choice: in diesem Monat
  rationale: Dies ist eine direkte und natürliche Wiedergabe der Zeitangabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Kultische Bedeutung von עֲבֹדָה
  choice: Gottesdienst
  alternative: Ritus; Feier; Dienst
  rationale: Im Zusammenhang mit Passa und ungesäuertem Brot bezeichnet das Wort einen vorgeschriebenen Dienst der Verehrung. Die Fußnote hält die mögliche Bedeutungsbreite offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich hebt die appositionelle Beschreibung des Landes hervor; „Vorfahren“ ist heute allgemein verständlicher als „Väter“, ohne den Bezug auf die patriarchalen Vorfahren aufzulösen.
