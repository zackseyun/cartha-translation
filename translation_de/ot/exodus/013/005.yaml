revisions:
- from: Und wenn Jahwe dich in das Land der Kanaaniter, Hetiter, Amoriter, Hiwiter und Jebusiter bringt, das er deinen Vorfahren unter Eid versprochen hat, dir zu geben – ein Land, in dem Milch und Honig fließen –, dann sollst du in diesem Monat diesen Gottesdienst[a] vollziehen.
