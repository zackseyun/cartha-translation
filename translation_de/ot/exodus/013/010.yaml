lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Du sollst … einhalten
  rationale: שׁמר bezeichnet im rechtlich-kultischen Zusammenhang das Beachten und fortdauernde Befolgen einer Vorschrift. „Einhalten“ ist im modernen Deutschen natürlich und bewahrt den verpflichtenden Charakter.
- source_word: הַחֻקָּה הַזֹּאת
  choice: diese Vorschrift
  rationale: חֻקָּה bezeichnet eine festgesetzte Regelung oder Satzung. „Vorschrift“ ist verständlich, sachlich und weniger altertümlich als „Satzung“, ohne die rechtliche Verbindlichkeit abzuschwächen.
- source_word: לְמוֹעֲדָהּ
  choice: zu der für sie bestimmten Zeit
  rationale: מוֹעֵד bezeichnet einen festgesetzten Zeitpunkt oder Termin. Das Suffix bezieht die bestimmte Zeit ausdrücklich auf die Vorschrift beziehungsweise ihre Befolgung.
- source_word: מִיָּמִים יָמִימָה
  choice: Jahr für Jahr
  rationale: Die wörtliche Wendung „von Tagen zu Tagen“ bezeichnet hier im Zusammenhang der jährlich wiederkehrenden Feier eine regelmäßige jährliche Wiederholung. Die idiomatische Bedeutung steht im Haupttext; die konkrete hebräische Bildsprache wird in der Fußnote bewahrt.
