  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „wich … nicht“ verdeutlicht im Deutschen die fortwährende Gegenwart bei Tag und Nacht; die Fußnote dokumentiert die kompaktere hebräische Singularform.
