  naturalness: Die Wiederholung von „wich“ ist verständlich, wirkt zusammen mit „von der Stelle“ bzw. „von dort“ jedoch schwerfällig. „Blieben vor dem Volk“ ist modernes, natürliches Standarddeutsch und gibt die fortdauernde Anwesenheit idiomatisch wieder.
