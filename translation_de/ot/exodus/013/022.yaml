  yaml_path: translation/ot/exodus/013/022.yaml
  text: The pillar of cloud by day and the pillar of fire by night did not depart from before the people[a].
translation:
  language: de
  text: Die Wolkensäule bei Tag und die Feuersäule bei Nacht blieben vor dem Volk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische formuliert negativ: „wichen nicht von vor dem Volk“. Das Verb steht im Singular und fasst Wolken- und Feuersäule zusammen; im Deutschen steht wegen der beiden Substantive der Plural.'
    reason: grammar_and_literal_form
lexical_decisions:
- source_word: יָמִישׁ
  choice: wich … nicht
  rationale: Das Hifil von מוּשׁ bezeichnet hier das Entfernen oder Weichen. Die deutsche Wendung bewahrt sowohl den räumlichen Sinn als auch die fortwährende Gegenwart der Säulen.
- source_word: עַמּוּד
  choice: Säule
  rationale: „Säule“ ist die geläufige und bildkräftige deutsche Entsprechung für die senkrechte, säulenartige Erscheinung.
- source_word: הֶעָנָן
  choice: Wolke
  rationale: עָנָן bedeutet „Wolke“; in der Verbindung mit עַמּוּד ist „Wolkensäule“ im Deutschen natürlich und prägnant.
- source_word: יוֹמָם
  choice: bei Tag
  rationale: Die adverbiale Zeitangabe wird idiomatisch mit „bei Tag“ wiedergegeben und bildet einen ausgewogenen Gegensatz zu „bei Nacht“.
- source_word: וְעַמּוּד הָאֵשׁ
  choice: und die Feuersäule
  rationale: Die Wiedergabe erhält die Parallelität zur Wolkensäule und die konkrete Bildsprache des Feuers.
- source_word: לָיְלָה
  choice: bei Nacht
  rationale: Die adverbiale Zeitangabe wird passend zum parallelen „bei Tag“ wiedergegeben.
- source_word: לִפְנֵי
  choice: von der Stelle vor
  rationale: In Verbindung mit dem Verb des Weichens bezeichnet לִפְנֵי die Position vor dem Volk, von der sich die Säulen nicht entfernten. „Von der Stelle vor“ ist im Deutschen klarer als das schwerfällige „von vor“.
- source_word: הָעָם
  choice: dem Volk
  rationale: Das bestimmte kollektive Substantiv bezeichnet hier Israel als Volk.
theological_decisions: []
