  text: שִׁבְעַ֥ת יָמִ֖ים תֹּאכַ֣ל מַצֹּ֑ת וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י חַ֖ג לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/006.yaml
  text: For seven days you shall eat unleavened bread[b][a], and on the seventh day there shall be a feast to Yahweh.
translation:
  language: de
  text: Sieben Tage lang sollst du ungesäuertes Brot essen, und am siebten Tag ist ein Fest für Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Sieben Tage lang
  rationale: Die Konstruktverbindung bezeichnet eine Zeitdauer; „Sieben Tage lang“ gibt diese im modernen Deutschen natürlich und ausdrücklich wieder.
- source_word: תֹּאכַל
  choice: sollst du … essen
  rationale: Das Qal-Imperfekt der 2. Person maskulin Singular hat im gesetzlichen Anweisungskontext direktiven Sinn. „Sollst“ bewahrt den verbindlichen, würdigen Ton, ohne ihn mit „musst“ zu verstärken.
- source_word: מַצֹּת
  choice: ungesäuertes Brot
  rationale: Der Plural bezeichnet im Passa- und Festkontext ungesäuertes Brot; die deutsche Stoffbezeichnung ist klarer und geläufiger als eine Transliteration oder „ungesäuerte Brote“.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: und am siebten Tag
  rationale: Das Waw wird schlicht mit „und“ wiedergegeben; die Präpositionalgruppe bezeichnet den Zeitpunkt.
- source_word: חַג
  choice: ein Fest
  rationale: חַג bezeichnet ein kultisches Fest mit feierlichen Zügen. „Fest“ ist im Deutschen prägnant, natürlich und dem sakralen Zusammenhang angemessen.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: ל kann hier Zugehörigkeit, Widmung oder Ausrichtung bezeichnen. „Für Jahwe“ ist idiomatisches Deutsch und bewahrt diese Beziehung, ohne eine räumliche Richtung anzudeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm יהוה. „Jahwe“ gibt den persönlichen Bundesnamen wieder; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt.
- issue: Elliptische Nominalklausel חַג לַיהוָה
  choice: ist ein Fest für Jahwe
  alternative: soll ein Fest für Jahwe stattfinden
  rationale: Im Hebräischen fehlt ein ausgesprochenes Verb. Das deutsche Präsens „ist“ bewahrt die knappe Feststellung und vermeidet es, zusätzliche Bedeutungsnuancen wie eine ausdrückliche Veranstaltungspflicht einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, verständlichem Anweisungston. Die knappe hebräische Satzstruktur bleibt weitgehend erhalten; die Ellipse wird mit einem schlichten „ist“ ergänzt.
