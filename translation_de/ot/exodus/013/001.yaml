base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Da sprach Jahwe[a] zu Mose:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell auch mit „der HERR“ oder „Jehova“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da sprach
  rationale: Das konsekutive וַ führt die Erzählung weiter. „Da sprach“ gibt die zeitliche Abfolge und das Verb דבר in natürlichem, würdigem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird in der im Deutschen üblichen wissenschaftlichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל
  choice: zu
  rationale: „Zu“ ist bei einem Verb des Sprechens die natürliche deutsche Entsprechung der Präposition.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Der Personenname wird gemäß der etablierten deutschen Bibeltradition als „Mose“ wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet die folgende direkte Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Eigennamen יהוה. „Jahwe“ bewahrt ihn als Namen; die Fußnote nennt die traditionellen Alternativen, ohne den Namen im Haupttext durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die knappe hebräische Redeeinleitungsformel wird idiomatisch mit einem Doppelpunkt wiedergegeben.
