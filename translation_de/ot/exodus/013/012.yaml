  text: you shall set apart to Yahweh every one that opens the womb[b][a], and every male firstborn of the livestock that you have belongs to Yahweh.
translation:
  language: de
  text: Dann sollst du alles, was den Mutterschoß zuerst öffnet,[a] Jahwe übergeben. Auch jeder männliche Erstling deines Viehs[b] gehört Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jedes, das den Mutterschoß öffnet“. Gemeint ist jeweils die erste Leibesfrucht.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck bezeichnet den ersten Nachwuchs von Nutztieren; die männlichen Tiere unter diesen Erstlingen gehören ausdrücklich Jahwe.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: sollst du … übergeben
  rationale: Das Hifil von עבר bedeutet wörtlich „hinübergehen lassen“. Im kultisch-rechtlichen Zusammenhang bezeichnet es die Übertragung beziehungsweise Weihe an Jahwe; „übergeben“ bewahrt dieses Bild besser als eine bloße Deutung mit „weihen“.
- source_word: פֶּטֶר רֶחֶם
  choice: alles, was zuerst den Mutterschoß öffnet
  rationale: Die Wiedergabe erhält das hebräische Geburtsidiom „Öffner des Mutterschoßes“ in verständlichem Deutsch und vermeidet, es vorschnell nur mit „Erstgeborener“ zusammenzufassen.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition bezeichnet zunächst die Übergabe an Jahwe und am Versende die Zugehörigkeit zu Jahwe; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: פֶּטֶר שֶׁגֶר בְּהֵמָה
  choice: jeder Erstling vom Nachwuchs deines Viehs
  rationale: שֶׁגֶר bezeichnet den tierischen Nachwuchs beziehungsweise die Leibesfrucht. „Erstling vom Nachwuchs“ bildet den Geburtsbezug ab, ohne das nachfolgende Merkmal „männlich“ vorwegzunehmen.
- source_word: אֲשֶׁר יִהְיֶה לְךָ
  choice: deines Viehs
  rationale: Die Zugehörigkeitsangabe wird im Deutschen knapp und idiomatisch durch das Possessiv „deines“ ausgedrückt.
- source_word: הַזְּכָרִים
  choice: soweit er männlich ist
  rationale: Der substantivierte Plural „die Männlichen“ grenzt die Jahwe gehörenden tierischen Erstlinge auf männliche Tiere ein. Die Formulierung bildet diese Einschränkung natürlich ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den offenbarten Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Zugehörigkeit der männlichen tierischen Erstlinge
  choice: gehört Jahwe
  alternative: ist für Jahwe bestimmt
  rationale: Die knappe hebräische Nominalkonstruktion הַזְּכָרִים לַיהוָה kann Zugehörigkeit und kultische Bestimmung ausdrücken. „gehört Jahwe“ bewahrt ihren rechtlich-sakralen Nachdruck, ohne die konkrete weitere Behandlung der Tiere hier vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mutterschoß“ erhält das konkrete hebräische Geburtsbild; „Erstling“ wahrt den kultisch-rechtlichen Ton. Die beiden hebräischen Satzglieder werden zur besseren deutschen Lesbarkeit auf zwei Sätze verteilt.
