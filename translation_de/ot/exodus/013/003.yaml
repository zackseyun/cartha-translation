  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָ/עָ֗ם זָכ֞וֹר אֶת הַ/יּ֤וֹם הַ/זֶּה֙ אֲשֶׁ֨ר יְצָאתֶ֤ם מִ/מִּצְרַ֨יִם֙ מִ/בֵּ֣ית עֲבָדִ֔ים כִּ֚י בְּ/חֹ֣זֶק יָ֔ד הוֹצִ֧יא יְהֹוָ֛ה אֶתְ/כֶ֖ם מִ/זֶּ֑ה וְ/לֹ֥א יֵאָכֵ֖ל חָמֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/003.yaml
  text: Then Moses said to the people[a], “Remember this day in which you came out from Egypt, from the house of slavery, because Yahweh brought you out from there by a strong hand[c][b]; and no leavened bread shall be eaten.”
translation:
  language: de
  text: 'Da sagte Mose zum Volk: »Denkt an diesen Tag, an dem ihr aus Ägypten, aus dem Sklavenhaus, ausgezogen seid; denn mit starker Hand hat Jahwe euch von dort herausgeführt. Und nichts Gesäuertes darf gegessen werden.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und kein gesäuertes Brot darf gegessen werden.« Das hebräische חָמֵץ kann Gesäuertes allgemein oder gesäuertes Brot bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: Denkt an
  rationale: Der singularische Imperativ richtet sich an das Volk als Kollektiv. Im Deutschen verlangt die direkte Anrede einer Gruppe den Plural; »Denkt an« ist natürlich und bewahrt den Gedenkcharakter.
- source_word: הַיּוֹם הַזֶּה
  choice: diesen Tag
  rationale: Die Verbindung aus bestimmtem Substantiv und Demonstrativ wird unmittelbar und idiomatisch wiedergegeben.
- source_word: יְצָאתֶם מִמִּצְרַיִם
  choice: ihr aus Ägypten … ausgezogen seid
  rationale: יצא bezeichnet das Heraus- beziehungsweise Ausziehen. »Ausgezogen« ist im Exoduszusammenhang präzise und natürlich.
- source_word: מִבֵּית עֲבָדִים
  choice: aus dem Sklavenhaus
  rationale: Die hebräische Wendung lautet wörtlich »aus dem Haus der Sklaven«. »Sklavenhaus« bewahrt das konkrete Bild und bezeichnet Ägypten klar als Ort der Versklavung.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für das Gedenken ein. »Denn« erhält diesen kausalen Zusammenhang in würdigem, natürlichem Deutsch.
- source_word: בְּחֹזֶק יָד
  choice: mit starker Hand
  rationale: Die bildhafte hebräische Wendung wird eng am Wortlaut wiedergegeben und bezeichnet Jahwes machtvolles Eingreifen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הוֹצִיא … אֶתְכֶם מִזֶּה
  choice: hat … euch von dort herausgeführt
  rationale: Der Hifil von יצא ist kausativ. »Herausgeführt« gibt die bewirkte Befreiung idiomatisch wieder; »von dort« verweist auf Ägypten beziehungsweise das Sklavenhaus zurück.
- source_word: וְלֹא יֵאָכֵל חָמֵץ
  choice: Darum darf nichts Gesäuertes gegessen werden
  rationale: Das passive Verbot bleibt erhalten. חָמֵץ kann Gesäuertes allgemein und nicht nur gesäuertes Brot bezeichnen; »nichts Gesäuertes« wahrt diese Breite. »Darum« macht den folgernden Anschluss des ו im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Eigenname. »Jahwe« bewahrt ihn als solchen, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutung von בֵּית עֲבָדִים
  choice: Sklavenhaus
  alternative: Haus der Sklaven / Haus der Knechtschaft
  rationale: »Sklavenhaus« bewahrt sowohl das konkrete Hausbild als auch die tatsächliche Versklavung Israels und klingt im modernen Deutschen prägnant und würdig.
- issue: Umfang des Verbots חָמֵץ
  choice: nichts Gesäuertes
  alternative: kein gesäuertes Brot
  rationale: חָמֵץ kann allgemein gesäuerte Speise oder Gesäuertes bezeichnen. Die breitere Wiedergabe vermeidet eine unbegründete Einschränkung auf Brot.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und feierlich, ohne altertümliche Formen. Die Satzglieder folgen weitgehend der hebräischen Abfolge, werden jedoch für einen natürlichen deutschen Rhythmus gegliedert.
