base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/008.yaml
  text: And you shall tell your son on that day[a], saying, ‘It is because of this that Yahweh acted for me when I came out of Egypt.’
translation:
  language: de
  text: 'Und du sollst deinem Sohn an jenem Tag erzählen: »Aus diesem Grund hat Yahweh für mich gehandelt, als ich aus Ägypten auszog.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Yahweh hat dies für mich getan, als ich aus Ägypten auszog.« Im Hebräischen kann sich »dies« entweder auf den Anlass der Feier oder unmittelbarer auf das beziehen, was Yahweh getan hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגַּדְתָּ
  choice: Und du sollst … erzählen
  rationale: Das Hifil von נגד bedeutet hier „mitteilen, erzählen, bekannt machen“. „Erzählen“ passt natürlich zur Weitergabe an den Sohn.
- source_word: לְבִנְךָ
  choice: deinem Sohn
  rationale: לְ kennzeichnet den indirekten Gegenstand; בִנְךָ ist maskulin Singular und wird entsprechend wiedergegeben.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die übliche deutsche Zeitangabe bewahrt die demonstrative Hervorhebung des Hebräischen.
- source_word: לֵאמֹר
  choice: Doppelpunkt mit direkter Rede
  rationale: Der Infinitiv leitet den Inhalt der folgenden Rede ein; im heutigen Deutsch wird dies natürlich durch einen Doppelpunkt ausgedrückt.
- source_word: בַּעֲבוּר זֶה
  choice: Dies geschieht, weil
  rationale: Die Wendung bezeichnet Grund oder Anlass. Die Formulierung gibt den kausalen Sinn verständlich wieder, ohne die syntaktische Mehrdeutigkeit zu verschweigen; die andere Zuordnung von זֶה steht in der Fußnote.
- source_word: עָשָׂה יְהוָה לִי
  choice: Yahweh für mich gehandelt hat
  rationale: עשה ist weit gefasst („tun, machen, handeln“) und besitzt hier kein ausdrückliches Objekt. „Für mich gehandelt“ vermeidet eine nicht ausdrücklich genannte Ergänzung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּצֵאתִי מִמִּצְרָיִם
  choice: als ich aus Ägypten zog
  rationale: Der Infinitiv mit בְּ bezeichnet den zeitlichen Umstand; die erste Person Singular bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; seine Umschrift bewahrt diesen Unterschied gegenüber einem Titel.
- issue: Geschlechtsbezogene Wiedergabe von בִנְךָ
  choice: deinem Sohn
  alternative: deinem Kind
  rationale: Die hebräische Form ist ausdrücklich maskulin und singular; der Kontext verlangt keine Verallgemeinerung.
- issue: Bezug von בַּעֲבוּר זֶה
  choice: „dies“ bezeichnet den Anlass der Feier beziehungsweise des Erzählens
  alternative: „dies“ ist das Objekt dessen, was Yahweh tat
  rationale: Die hebräische Wortfolge lässt beide Bezüge zu. Der Haupttext folgt der kausalen Lesart, während die Fußnote die ebenso mögliche objektbezogene Lesart erhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und die Ich-Perspektive des Ritualwortes bleiben erhalten; die syntaktische Mehrdeutigkeit von בַּעֲבוּר זֶה wird durch eine Fußnote kenntlich gemacht.
