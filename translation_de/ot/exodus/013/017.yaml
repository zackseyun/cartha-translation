  text: וַ/יְהִ֗י בְּ/שַׁלַּ֣ח פַּרְעֹה֮ אֶת הָ/עָם֒ וְ/לֹא נָחָ֣/ם אֱלֹהִ֗ים דֶּ֚רֶךְ אֶ֣רֶץ פְּלִשְׁתִּ֔ים כִּ֥י קָר֖וֹב ה֑וּא כִּ֣י אָמַ֣ר אֱלֹהִ֗ים פֶּֽן יִנָּחֵ֥ם הָ/עָ֛ם בִּ/רְאֹתָ֥/ם מִלְחָמָ֖ה וְ/שָׁ֥בוּ מִצְרָֽיְמָ/ה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/017.yaml
  text: When Pharaoh let the people go[a], God did not lead them by the way of the land of the Philistines, though it was near; for God said[b], “Lest the people change their minds when they see war and return to Egypt.”
translation:
  language: de
  text: 'Als der Pharao das Volk ziehen ließ, führte Gott es nicht auf dem Weg durch das Land der Philister, obwohl dieser Weg nahe lag.[a] Denn Gott sagte: »Sonst könnte das Volk es sich anders überlegen[b], wenn es Krieg sieht, und nach Ägypten zurückkehren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »denn dieser Weg lag nahe«. Die hebräische Konjunktion kann hier begründend oder einräumend verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »seinen Entschluss bereuen« oder »seinen Entschluss ändern«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁלַּח
  choice: als der Pharao das Volk ziehen ließ
  rationale: Die Präposition בְּ mit dem Infinitiv constructus bezeichnet hier den zeitlichen Umstand. »Ziehen ließ« gibt im Exoduskontext die Freilassung des Volkes natürlich wieder.
- source_word: נָחָם
  choice: führte
  rationale: נחה bezeichnet das Führen oder Leiten; im Zusammenhang mit der Wahl eines Reisewegs ist »führte« die klare, idiomatische Entsprechung.
- source_word: דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים
  choice: auf dem Weg durch das Land der Philister
  rationale: Die Wiedergabe bewahrt sowohl den Wegbegriff als auch die hebräische Benennung des Gebiets nach der Volksgruppe und klingt im Deutschen natürlich.
- source_word: כִּי קָרוֹב הוּא
  choice: obwohl dieser Weg nahe lag
  rationale: 'כִּי kann hier konzessiv verstanden werden: Gott wählte den Weg nicht, obwohl er nahe lag. »Dieser Weg« macht den Bezug des pronominalen הוּא eindeutig, ohne zusätzliche Sachinformation einzuführen.'
- source_word: פֶּן
  choice: sonst könnte
  rationale: פֶּן leitet eine befürchtete oder zu vermeidende Möglichkeit ein. »Sonst könnte« ist im heutigen Deutsch natürlicher als das gehobene »damit nicht« beziehungsweise »auf dass nicht« und wahrt den apprehensiven Sinn.
- source_word: יִנָּחֵם
  choice: es sich anders überlegen
  rationale: Der Niphal von נחם bezeichnet hier eine Änderung von Entschluss oder Haltung angesichts drohenden Krieges, nicht ausdrücklich moralische Reue.
- source_word: בִּרְאֹתָם מִלְחָמָה
  choice: wenn es Krieg vor sich sieht
  rationale: בְּ mit dem Infinitiv bezeichnet den Umstand des Sehens. Die kollektive Einzahl »es« nimmt »das Volk« auf; »Krieg vor sich sieht« bewahrt das konkrete Bild des hebräischen Ausdrucks.
- source_word: וְשָׁבוּ מִצְרָיְמָה
  choice: und nach Ägypten zurückkehren
  rationale: שׁוב bedeutet »zurückkehren«; die Richtungsendung an מִצְרַיִם wird durch »nach Ägypten« wiedergegeben.
- source_word: וַיְהִי
  choice: Als
  rationale: Die einleitende wayyiqtol-Form führt die neue Erzählsituation fort. Im Deutschen genügt die temporale Satzkonstruktion mit »Als«; ein zusätzliches »Und es geschah« wäre unnötig schwerfällig.
theological_decisions:
- issue: Gottes Begründung für die Umgehung des Philisterlandes
  choice: Der Text stellt Gottes Wegwahl als Rücksicht auf eine mögliche Reaktion des Volkes dar.
  alternative: Die Aussage als bloße Vermutung des Erzählers oder als reaktive Planänderung Gottes deuten.
  rationale: Die ausdrückliche Formulierung »Denn Gott sagte« schreibt die Begründung Gott selbst zu. Die Übersetzung gibt dies wieder, ohne weitergehende dogmatische Aussagen über Gottes Wissen oder Vorsehung einzutragen.
- issue: Bedeutung von יִנָּחֵם beim Volk
  choice: 'Änderung des Entschlusses: »es sich anders überlegen«'
  alternative: Moralische Reue oder Buße
  rationale: Der unmittelbare Zusammenhang nennt Krieg und die Rückkehr nach Ägypten; daher geht es um eine mögliche Umkehr des Vorhabens, nicht ausdrücklich um religiöse Buße.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die kollektive Bezeichnung »das Volk« wird durchgehend mit der Einzahl »es« aufgenommen. Die direkte Rede bleibt knapp und bewahrt die im Hebräischen ausgedrückte Befürchtung.
