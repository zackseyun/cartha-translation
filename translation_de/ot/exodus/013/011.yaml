  terminology: „Jahwe“ gibt den Gottesnamen יהוה als Eigenname wieder. „Vätern“ entspricht dem ausdrücklich maskulinen hebräischen Ausdruck אֲבֹתֶיךָ; die Fußnote weist sachgerecht auf „Vorfahren“ als kontextuelle Alternative hin. Die Fußnotenmarker stehen an den passenden Ausdrücken.
