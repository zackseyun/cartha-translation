  source_fidelity: Der Entwurf gibt die hebräische Zukunfts-/Bedingungskonstruktion וְהָיָה כִּי angemessen als „Und wenn“ wieder. יְבִיאֲךָ ist korrekt mit „dich … bringt“ übersetzt; „in das Land der Kanaaniter“ bildet Zielrichtung und die Volksbezeichnung treffend ab. „wie er dir und deinen Vätern geschworen hat“ sowie „und es dir gibt“ entsprechen Syntax und Bezügen des hebräischen Textes. Das abschließende Komma ist erforderlich, da der Satz in Vers 12 fortläuft.
