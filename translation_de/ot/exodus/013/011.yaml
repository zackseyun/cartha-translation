id: EXO.13.11
reference: Exodus 13:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּֽי יְבִֽאֲ/ךָ֤ יְהוָה֙ אֶל אֶ֣רֶץ הַֽ/כְּנַעֲנִ֔י כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע לְ/ךָ֖ וְ/לַֽ/אֲבֹתֶ֑י/ךָ וּ/נְתָנָ֖/הּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/011.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], as he swore to you and to your fathers, and gives it to you[b],
translation:
  language: de
  text: Und wenn[a] Jahwe dich in das Land der Kanaaniter bringt, wie er dir und deinen Vätern[b] geschworen hat, und es dir gibt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und es wird geschehen, wenn“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Vorfahren“; wörtlich: „Väter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Und wenn
  rationale: Die hebräische Wendung leitet einen künftig eintretenden Umstand ein. „Und wenn“ gibt ihren zeitlichen und fortführenden Sinn in natürlichem Deutsch wieder.
- source_word: יְבִיאֲךָ
  choice: dich … bringt
  rationale: Der Hifil von בוא bedeutet hier „jemanden kommen lassen“, also „bringen“; אֶל bezeichnet das Ziel der Bewegung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ ist die im modernen Deutschen geläufige Wiedergabe des göttlichen Eigennamens und ersetzt ihn nicht durch einen Titel.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי
  choice: in das Land der Kanaaniter
  rationale: Die Formulierung bildet sowohl die Bewegung in das Land als auch die hebräische Volksbezeichnung direkt und idiomatisch ab.
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: wie er … geschworen hat
  rationale: כַּאֲשֶׁר verweist vergleichend auf den zuvor geleisteten Schwur; das deutsche Perfekt ist in gegenwärtiger Standardsprache natürlich.
- source_word: לְךָ וְלַאֲבֹתֶיךָ
  choice: dir und deinen Vätern
  rationale: Die Übersetzung bewahrt die ausdrücklich väterliche Bezeichnung des Hebräischen; eine Fußnote nennt die im Deutschen mögliche sinngemäße Wiedergabe „Vorfahren“.
- source_word: וּנְתָנָהּ לָךְ
  choice: und es dir gibt
  rationale: Das feminine Objektsuffix bezieht sich auf אֶרֶץ, „Land“. Die Präsensform steht innerhalb des zukünftigen Wenn-Satzes natürlich für das erwartete Geschehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. „Jahwe“ bewahrt ihn, während „der HERR“ ihn durch einen Titel ersetzen würde.
- issue: Bedeutungsumfang von אֲבֹתֶיךָ
  choice: deinen Vätern
  alternative: deinen Vorfahren
  rationale: „Väter“ entspricht der konkreten Form des hebräischen Ausdrucks; „Vorfahren“ ist als weiter gefasste, kontextuell mögliche Wiedergabe in der Fußnote vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt bewusst offen und endet mit einem Komma, da der Gedanke im folgenden Vers weitergeführt wird.
