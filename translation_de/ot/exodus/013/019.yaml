base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/019.yaml
  text: And Moses took Joseph’s bones with him[a], because Joseph had made the sons of Israel solemnly swear, saying, “God will surely attend to you, and you shall bring up my bones from here with you.”
translation:
  language: de
  text: 'Mose nahm Josefs Gebeine mit sich, denn Josef hatte die Söhne Israels feierlich schwören lassen: »Gott wird sich euer gewiss annehmen[a]. Und ihr sollt meine Gebeine von hier mit euch hinaufbringen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Gott wird euch gewiss aufsuchen.« Die hebräische Wendung kann Gottes entschiedenes Eingreifen zugunsten seines Volkes bezeichnen.'
    reason: lexikalische Alternative und Erklärung eines hebräischen Idioms
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Das Qal-Erzählverb לקח wird direkt und natürlich mit »nahm« wiedergegeben.
- source_word: עַצְמוֹת / עַצְמֹתַי
  choice: Gebeine / meine Gebeine
  rationale: »Gebeine« bewahrt die konkrete Bedeutung »Knochen«, klingt bei menschlichen Überresten jedoch würdevoller und im biblischen Erzählstil natürlich.
- source_word: עִמּוֹ / אִתְּכֶם
  choice: mit sich / mit euch
  rationale: Die beiden Begleitangaben werden entsprechend ihrer jeweiligen Person direkt wiedergegeben; »mit sich« ist im Deutschen beim Subjekt Mose idiomatisch.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: hatte ... feierlich schwören lassen
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Hifil betont den Eid und dessen Veranlassung; »feierlich schwören lassen« erhält beide Aspekte.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die familiäre und ausdrücklich männliche Formulierung des Hebräischen bleibt erhalten, ohne sie zum allgemeineren »Israeliten« zu glätten.
- source_word: פָּקֹד יִפְקֹד
  choice: wird sich gewiss ... annehmen
  rationale: Die emphatische Konstruktion bezeichnet Gottes sicheres, wirksames Eingreifen zugunsten seines Volkes. »Sich annehmen« ist verständlich, lässt aber die genaue Art des Eingreifens offen.
- source_word: וְהַעֲלִיתֶם
  choice: Dann sollt ihr ... hinaufbringen
  rationale: Das Hifil von עלה trägt eine richtungsbezogene und im Eid verpflichtende Bedeutung. »Hinaufbringen« bewahrt die Bewegungsrichtung; »sollt« gibt den verpflichtenden Zukunftssinn wieder.
- source_word: מִזֶּה
  choice: von hier
  rationale: Die deiktische Ortsangabe wird knapp und natürlich wiedergegeben.
theological_decisions:
- issue: Bedeutung von פָּקֹד יִפְקֹד אֱלֹהִים אֶתְכֶם
  choice: Gott wird sich gewiss euer annehmen
  alternative: Gott wird euch gewiss heimsuchen / Gott wird gewiss nach euch sehen
  rationale: Die gewählte Fassung vermittelt Gottes entschiedenes Eingreifen und seine Fürsorge, ohne die mehrdeutige hebräische Wendung auf bloßes Wahrnehmen oder eine bestimmte Art des Handelns festzulegen. Die wörtlichere Alternative wird in der Fußnote genannt.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten / die Kinder Israels
  rationale: Die Quellenformulierung wird als familiäre Abstammungsbezeichnung bewahrt; der kollektive Bezug wird nicht durch eine neutralisierende Bezeichnung ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit moderat formaler biblischer Diktion. »Gebeine« und »feierlich schwören lassen« erhalten den feierlichen Charakter, während Satzbau und direkte Rede für heutige Leser klar bleiben.
