  text: וַֽ/יהוָ֡ה הֹלֵךְ֩ לִ/פְנֵי/הֶ֨ם יוֹמָ֜ם בְּ/עַמּ֤וּד עָנָן֙ לַ/נְחֹתָ֣/ם הַ/דֶּ֔רֶךְ וְ/לַ֛יְלָה בְּ/עַמּ֥וּד אֵ֖שׁ לְ/הָאִ֣יר לָ/הֶ֑ם לָ/לֶ֖כֶת יוֹמָ֥ם וָ/לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/021.yaml
  text: And Yahweh was going before them by day in a pillar of cloud to lead them on the way[a], and by night in a pillar of fire to give them light, so that they could travel by day and by night.
translation:
  language: de
  text: Und Jahwe ging vor ihnen her, bei Tag in einer Wolkensäule, um sie auf dem Weg zu führen, und bei Nacht in einer Feuersäule, um ihnen Licht zu geben, damit sie bei Tag und bei Nacht gehen konnten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיהוָה
  choice: Und Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen wieder; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: zog vor ihnen her
  rationale: Das Partizip bezeichnet ein fortdauerndes Vorangehen. „Zog ... her“ passt natürlich zum Reise- und Exoduskontext.
- source_word: יוֹמָם בְּעַמּוּד עָנָן
  choice: am Tag in einer Wolkensäule
  rationale: Bewahrt die zeitliche Angabe und das konkrete Bild; בְּ wird als Erscheinungsweise beziehungsweise räumliche Einordnung mit „in“ wiedergegeben.
- source_word: לַנְחֹתָם הַדֶּרֶךְ
  choice: um sie auf dem Weg zu führen
  rationale: נחה bezeichnet hier leitendes Führen; die Zweckbestimmung des Infinitivs bleibt erhalten.
- source_word: וְלַיְלָה בְּעַמּוּד אֵשׁ
  choice: und in der Nacht in einer Feuersäule
  rationale: Die parallele Struktur zur Wolkensäule wird bewahrt, zugleich klingt die deutsche Formulierung natürlich.
- source_word: לְהָאִיר לָהֶם
  choice: um ihnen Licht zu geben
  rationale: Gibt den kausativen Sinn von אור klar und idiomatisch wieder.
- source_word: לָלֶכֶת יוֹמָם וָלָיְלָה
  choice: sodass sie bei Tag und bei Nacht weiterziehen konnten
  rationale: Der Infinitiv kann Zweck oder Folge ausdrücken. „Weiterziehen“ entspricht dem Reisegeschehen; „konnten“ macht die durch das Licht ermöglichte Bewegung deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht ausdrücklich im Ausgangstext. Die Umschrift bewahrt den Charakter des Bundesnamens, ohne ihn durch einen Titel zu ersetzen.
- issue: Art der göttlichen Gegenwart in Wolken- und Feuersäule
  choice: „in einer Wolkensäule ... in einer Feuersäule“
  alternative: „durch eine Wolkensäule ... durch eine Feuersäule“
  rationale: Die Übersetzung lässt offen, wie genau Jahwes Gegenwart und die sichtbaren Säulen zueinander stehen, und legt weder eine bloße Instrumentalität noch eine vollständige Identität fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Die poetische Parallelität von Tag/Nacht und Wolken-/Feuersäule bleibt erkennbar; „weiterziehen“ ist im Wanderungskontext natürlicher als das wörtliche „gehen“.
