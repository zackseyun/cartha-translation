base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/007.yaml
  text: Unleavened bread shall be eaten throughout the seven days[a], and no leaven shall be seen with you[b], and no yeast shall be seen with you within all your territory.
translation:
  language: de
  text: Ungesäuertes Brot soll während der sieben Tage gegessen werden.[a] Bei dir soll nichts Gesäuertes zu sehen sein, und auch kein Sauerteig in deinem ganzen Gebiet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die sieben Tage“. Gemeint ist die gesamte siebentägige Festzeit.'
    reason: grammatical_clarification
  - marker: b
    text: 'Wörtlich heißt es jeweils: „soll bei dir nicht gesehen werden“. Die Formulierung besagt, dass weder etwas Gesäuertes noch Sauerteig in deinem Besitz oder Herrschaftsbereich vorhanden sein darf.'
    reason: idiomatic_clarification
lexical_decisions:
- source_word: מַצּוֹת
  choice: ungesäuertes Brot
  rationale: Die Pluralform bezeichnet im Passahkontext ohne Gärmittel bereitetes Brot. Die geläufige deutsche Wendung bewahrt den kultischen Sinn, ohne eine Transliteration zu benötigen.
- source_word: יֵאָכֵל
  choice: soll gegessen werden
  rationale: Der Nifal-Imperfekt ist passiv. Die Formulierung gibt die verbindliche Vorschrift wieder, ohne sie stärker als nötig als direkten Befehl auszudrücken.
- source_word: אֵת שִׁבְעַת הַיָּמִים
  choice: während der sieben Tage
  rationale: Der Akkusativ bezeichnet die Zeitdauer und bezieht sich auf die gesamte siebentägige Festzeit.
- source_word: יֵרָאֶה לְךָ
  choice: soll bei dir … zu sehen sein
  rationale: Die Wiedergabe bleibt nahe beim passiven Sinn von ראה und lässt zugleich den rechtlichen Zusammenhang von Besitz und Herrschaftsbereich erkennen.
- source_word: חָמֵץ
  choice: nichts Gesäuertes
  rationale: חָמֵץ bezeichnet hier allgemein etwas Gegorenes beziehungsweise Gesäuertes und wird so von שְׂאֹר, dem Gärmittel selbst, unterschieden.
- source_word: שְׂאֹר
  choice: Sauerteig
  rationale: Das Wort bezeichnet das zum Durchsäuern verwendete Gärmittel. „Sauerteig“ ist im historischen Kontext verständlicher und sachlich genauer als modernes industrielles „Hefe“.
- source_word: בְּכָל גְּבֻלֶךָ
  choice: in deinem ganzen Gebiet
  rationale: Die Wendung umfasst den gesamten Bereich innerhalb der Grenzen des Angesprochenen; „Gebiet“ ist im modernen Deutschen natürlicher als das wörtliche „Grenzen“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die passive Vorschriftsform und die Wiederholung von „bei dir“ bewahren die Gestalt des hebräischen Rechtstextes; „nichts Gesäuertes“ und „Sauerteig“ halten die lexikalische Unterscheidung zwischen חָמֵץ und שְׂאֹר aufrecht.
