base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/014.yaml
  text: And when your son asks you in time to come, saying, ‘What is this?’ then you shall say to him, ‘By a mighty hand the LORD brought us out from Egypt, from the house of servants.’
translation:
  language: de
  text: 'Und wenn dein Sohn dich künftig fragt: »Was bedeutet das?«, dann sollst du ihm antworten: »Mit starker Hand hat der HERR uns aus Ägypten herausgeführt, aus dem Sklavenhaus.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָחָר
  choice: künftig
  rationale: Wörtlich »morgen«, hier idiomatisch auf eine spätere Zeit bzw. eine kommende Generation bezogen.
- source_word: בְּחֹזֶק יָד
  choice: mit starker Hand
  rationale: Bewahrt das hebräische Bild und bezeichnet die machtvolle Tat des HERRN.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchenform.
- source_word: מִבֵּית עֲבָדִים
  choice: aus dem Haus der Knechtschaft
  rationale: Gibt die Metapher formal wieder; gemeint ist Ägypten als Ort der Zwangsarbeit und Unfreiheit.
theological_decisions:
- issue: Subjekt der Befreiung
  choice: Der HERR allein wird als der Handelnde benannt.
  alternative: Eine unpersönliche Umschreibung der Befreiung.
  rationale: Der hebräische Text schreibt den Exodus ausdrücklich JHWH zu.
- issue: Generationenübergreifende Identifikation
  choice: »uns«
  alternative: »sie« oder »unsere Vorfahren«
  rationale: Das inklusive hebräische Suffix bewahrt die liturgisch-gemeinschaftliche Identifikation späterer Generationen mit den aus Ägypten Befreiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Frage wurde natürlich als »Was bedeutet das?« formuliert; »Haus der Knechtschaft« bewahrt das markante biblische Bild, ohne die Aussage auf eine einzelne soziale Bezeichnung zu verengen.
