  variant: modern standard German
source:
  edition: WLC
  text: קַדֶּשׁ לִ֨/י כָל בְּכ֜וֹר פֶּ֤טֶר כָּל רֶ֨חֶם֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה לִ֖/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/002.yaml
  text: Consecrate to me every firstborn[a], the first to open every womb among the sons of Israel, among man and among beast; it is mine.
translation:
  language: de
  text: Heilige mir alles Erstgeborene, alles, was bei den Israeliten zuerst den Mutterschoß öffnet, bei Mensch und Vieh; es gehört mir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַדֶּשׁ
  choice: Heilige
  rationale: Der Imperativ bezeichnet das Aussondern für Gott als heilig. „Heilige mir“ ist im Deutschen würdig und bewahrt die kultische Aussage prägnant.
- source_word: לִי
  choice: mir
  rationale: Der Dativ bezeichnet hier die Weihe an Gott und passt idiomatisch zu „heiligen“; zugleich klingt die Zugehörigkeit an.
- source_word: כָל בְּכוֹר
  choice: alles Erstgeborene
  rationale: Das Hebräische sagt „Erstgeborenes“, ohne ausdrücklich „männlich“ hinzuzufügen. Die substantivierte neutrale Form ist im Deutschen natürlich und umfasst Menschen wie Tiere.
- source_word: פֶּטֶר כָּל רֶחֶם
  choice: alles, was zuerst den Mutterschoß öffnet
  rationale: Die Wendung erläutert das Erstgeborene als dasjenige, das als Erstes aus dem Mutterleib hervorgeht. „Mutterschoß“ ist verständlich und würdig; „zuerst“ macht die idiomatische Bedeutung deutlich.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: bei den Israeliten
  rationale: Wörtlich steht „unter den Söhnen Israels“. Hier bezeichnet die Wendung das Volk Israel insgesamt; „bei den Israeliten“ ist natürliches modernes Deutsch und vermeidet eine irreführende Beschränkung auf männliche Volksangehörige.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: bei Mensch und Vieh
  rationale: אָדָם steht kollektiv für die menschliche Kategorie im Gegensatz zu בְּהֵמָה. „Mensch und Vieh“ bewahrt den knappen Gegensatz; „Vieh“ entspricht dem wahrscheinlichen rechtlichen Bezug auf Haustiere.
- source_word: לִי הוּא
  choice: es gehört mir
  rationale: Die Schlussklausel behauptet Gottes Besitzrecht. „Es gehört mir“ gibt dies im modernen Deutschen klarer wieder als das mögliche, aber missverständliche „es ist mein“.
theological_decisions:
- issue: Kollektiver Gebrauch von אָדָם im Gegensatz zu בְּהֵמָה
  choice: Mensch
  alternative: Menschen / Menschheit
  rationale: Der Singular אָדָם bezeichnet hier repräsentativ die menschliche Gattung, nicht nur Männer. „Bei Mensch und Vieh“ erhält sowohl den kollektiven Singular als auch den Gegensatz zu den Tieren.
- issue: Geschlecht der Erstgeburt
  choice: Keine ausdrückliche Ergänzung „männlich“
  alternative: alles männliche Erstgeborene
  rationale: Obwohl der weitere Rechtszusammenhang männliche Erstgeburten betrifft, enthält dieser Satz kein ausdrückliches Wort für „männlich“. Die Übersetzung lässt diese Angabe daher unausgesprochen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit relativ enger Bindung an die hebräische Syntax. „Heilige mir“ erhält den kultischen Ton; „bei Mensch und Vieh“ bewahrt die knappe kollektive Gegenüberstellung. Keine Fußnote ist nötig, da die repräsentative Bedeutung von „Mensch“ im Deutschen unmittelbar verständlich ist.
