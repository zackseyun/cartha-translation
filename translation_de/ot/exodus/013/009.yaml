base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/009.yaml
  text: And it shall be for you as a sign on your hand and as a memorial between your eyes[a], so that the law of Yahweh may be in your mouth[c][b]; for with a strong hand Yahweh brought you out of Egypt.
translation:
  language: de
  text: Und es soll dir als Zeichen an deiner Hand und als Erinnerungszeichen zwischen deinen Augen[a] dienen, damit die Weisung Jahwes in deinem Mund sei[b]; denn mit starker Hand hat Jahwe dich aus Ägypten herausgeführt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »auf deiner Stirn«; wörtlich steht im Hebräischen »zwischen deinen Augen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »damit das Gesetz Jahwes in deinem Mund sei«. Das hebräische Wort Tora kann »Weisung« oder »Gesetz« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לְךָ לְאוֹת
  choice: Und es soll dir als Zeichen dienen
  rationale: Die prospektive Aussage erhält im Deutschen mit „soll … dienen“ einen natürlichen, anweisenden Klang; אוֹת wird breit und deutungsoffen als „Zeichen“ wiedergegeben.
- source_word: עַל יָדְךָ
  choice: an deiner Hand
  rationale: יָד bezeichnet hier wörtlich die Hand. „An“ ist bei einem Zeichen im Deutschen idiomatischer als „auf“, ohne eine konkrete Befestigungsweise festzulegen.
- source_word: וּלְזִכָּרוֹן
  choice: und als Erinnerungszeichen
  rationale: זִכָּרוֹן bezeichnet etwas, das Erinnerung wachhält. „Erinnerungszeichen“ ist natürlich verständlich und bewahrt zugleich den konkreten Zeichencharakter des Satzes.
- source_word: בֵּין עֵינֶיךָ
  choice: zwischen deinen Augen
  rationale: Die konkrete hebräische Formulierung bleibt erhalten; die mögliche idiomatische Bedeutung „auf deiner Stirn“ wird in einer Fußnote genannt.
- source_word: תּוֹרַת יְהוָה
  choice: die Weisung Jahwes
  rationale: תּוֹרָה umfasst Unterweisung und verbindliche Weisung und bezeichnet nicht nur kodifiziertes Gesetz. „Weisung“ wahrt diese semantische Breite im Kontext.
- source_word: בְּפִיךָ
  choice: in deinem Mund
  rationale: Die wörtliche Wendung bleibt verständlich und bewahrt das Bild des gesprochenen Bekennens oder wiederholenden Aufsagens.
- source_word: בְּיָד חֲזָקָה
  choice: mit starker Hand
  rationale: Die deutsche Wiedergabe folgt eng der konkreten hebräischen Wendung und bezeichnet Jahwes machtvolles Handeln.
- source_word: הוֹצִאֲךָ
  choice: hat dich … herausgeführt
  rationale: Der Hifil von יצא bedeutet „herausführen“ beziehungsweise „hinausbringen“; „herausgeführt“ ist im Deutschen natürlich und präzise.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Konkrete oder metaphorische Deutung der Zeichen an Hand und zwischen den Augen
  choice: Die konkrete Bildsprache wird im Haupttext wörtlich beibehalten.
  alternative: Die Ausdrücke ausdrücklich auf Gebetsriemen beziehen oder rein metaphorisch als innere Erinnerung paraphrasieren.
  rationale: Der hebräische Text nennt keine späteren Ritualgegenstände und schließt zugleich eine konkrete Praxis nicht aus. Die wörtliche Wiedergabe erhält diese Offenheit.
- issue: Bedeutung von תּוֹרָה in diesem Vers
  choice: „Weisung“
  alternative: „Gesetz“ oder „Tora“
  rationale: „Weisung“ bildet die größere Bedeutungsbreite von תּוֹרָה ab, während „Gesetz“ eine legitime, aber engere Lesart ist. Eine Fußnote hält diese Alternative sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit weitgehend quellennaher Bildsprache. Der Satzbau wurde leicht geglättet, ohne die Zweck- und Begründungsbeziehung oder die Mehrdeutigkeit der zentralen Begriffe aufzulösen.
