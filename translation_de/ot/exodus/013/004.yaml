  yaml_path: translation/ot/exodus/013/004.yaml
  text: Today you are going out[a], in the month of Abib.
translation:
  language: de
  text: Heute zieht ihr im Monat Abib aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abib ist der Name des Monats; die Bezeichnung hängt mit heranreifenden Getreideähren im Frühling zusammen.
