lexical_decisions:
- source_word: הַיּוֹם
  choice: Heute
  rationale: Das mit Artikel gebrauchte Substantiv bezeichnet adverbial den gegenwärtigen Tag und wahrt die Unmittelbarkeit der Anrede.
- source_word: אַתֶּם
  choice: ihr
  rationale: Das selbstständige Personalpronomen der 2. Person maskulin Plural wird im Deutschen eindeutig mit „ihr“ wiedergegeben.
- source_word: יֹצְאִים
  choice: zieht … aus
  rationale: Das Qal-Partizip Plural bezeichnet hier das gegenwärtige beziehungsweise unmittelbar bevorstehende Hinausgehen aus Ägypten. „Ausziehen“ ist im Deutschen natürlich und bildet die Bewegungsrichtung ab.
- source_word: בְּחֹדֶשׁ
  choice: im Monat
  rationale: Die Präposition ב mit „Monat“ gibt die kalendarische Zeitangabe wieder.
- source_word: הָאָבִיב
  choice: Abib
  rationale: Die hebräische Monatsbezeichnung wird transliteriert; ihre Verbindung mit dem Reifestadium des Getreides gehört in eine erklärende Fußnote.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bewahrt die hervorgehobene Zeitangabe „Heute“ und lässt die anschließende Monatsangabe knapp nachgetragen stehen.
