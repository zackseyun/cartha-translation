  yaml_path: translation/ot/exodus/013/020.yaml
  text: They set out from Succoth and camped at Etham, on the edge of the wilderness.
translation:
  language: de
  text: Sie brachen von Sukkot auf und schlugen ihr Lager in Etam auf, am Rand der Wüste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: Das Wayyiqtol von נסע bezeichnet hier das Aufbrechen zur nächsten Reiseetappe. „Aufbrechen“ ist im modernen Deutschen natürlich und bewahrt den Gedanken des Abmarschs.
- source_word: מִסֻּכֹּת
  choice: von Sukkot
  rationale: Die Präposition מִן bezeichnet den Ausgangspunkt. Der Ortsname סֻכּוֹת wird entsprechend der gebräuchlichen deutschen Transliteration als „Sukkot“ wiedergegeben.
- source_word: וַיַּחֲנוּ
  choice: und schlugen ihr Lager auf
  rationale: חנה bedeutet „lagern, sein Lager aufschlagen“. Die gewählte Formulierung ist idiomatisch und klar; sie vermeidet das heute weniger gebräuchliche „lagerten“.
- source_word: בְאֵתָם
  choice: in Etam
  rationale: Die Präposition בְּ ist lokativ. „In Etam“ gibt die hebräische Form unmittelbar und im Deutschen natürlich wieder, ohne genauer festzulegen, welche Art von Ort Etam war.
- source_word: בִּקְצֵה
  choice: am Rand
  rationale: קָצֶה bezeichnet ein Ende, einen äußersten Bereich oder Rand. Im geografischen Zusammenhang ist „am Rand“ die natürliche deutsche Entsprechung.
- source_word: הַמִּדְבָּר
  choice: der Wüste
  rationale: מִדְבָּר bezeichnet unbesiedeltes, trockenes Wildnis- oder Steppengebiet. „Wüste“ ist die geläufige und verständliche deutsche Wiedergabe, ohne zwingend eine reine Sandwüste vorauszusetzen.
