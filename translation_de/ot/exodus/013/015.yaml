base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/015.yaml
  text: And when Pharaoh stubbornly refused to let us go[a], Yahweh killed every firstborn in the land of Egypt, from the firstborn of man to the firstborn of beast. Therefore I sacrifice to Yahweh every male that opens the womb, but every firstborn of my sons I redeem.
translation:
  language: de
  text: Weil der Pharao sich hartnäckig weigerte, uns ziehen zu lassen, tötete Jahwe alle Erstgeborenen im Land Ägypten, vom Erstgeborenen der Menschen bis zum Erstgeborenen des Viehs. Darum opfere ich Jahwe jede männliche Erstgeburt, die den Mutterleib öffnet; jeden Erstgeborenen meiner Söhne aber löse ich aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקְשָׁה
  choice: sich hartnäckig weigerte
  rationale: Der Hifil von קשׁה bezeichnet hier zusammen mit dem Infinitiv לְשַׁלְּחֵנוּ den beharrlichen Widerstand des Pharaos. Die deutsche Wendung gibt den idiomatischen Sinn natürlich wieder.
- source_word: לְשַׁלְּחֵנוּ
  choice: uns ziehen zu lassen
  rationale: שלח bezeichnet im Exodusbericht die Freilassung beziehungsweise Entsendung Israels; „ziehen lassen“ entspricht dem wiederkehrenden deutschen Erzählidiom.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben.
- source_word: מִבְּכֹר אָדָם וְעַד בְּכוֹר בְּהֵמָה
  choice: vom Erstgeborenen der Menschen bis zum Erstgeborenen des Viehs
  rationale: אָדָם bezeichnet im Gegensatz zu בְּהֵמָה die Menschen allgemein; „Vieh“ passt zum Kontext domestizierter Tiere und zum kultisch-rechtlichen Sprachgebrauch.
- source_word: זֹבֵחַ
  choice: opfere
  rationale: זבח bezeichnet das Darbringen beziehungsweise Schlachten als Opfer. „Opfern“ ist im Deutschen prägnant und sachgerecht.
- source_word: פֶּטֶר רֶחֶם הַזְּכָרִים
  choice: alles Männliche, das als Erstes den Mutterschoß öffnet
  rationale: Die hebräische Rechtsformel bezeichnet den männlichen Nachwuchs, der als Erster aus dem Mutterleib hervorgeht. Die Formulierung bewahrt das Körperbild und verdeutlicht zugleich die Erstgeburt.
- source_word: בָּנַי
  choice: meiner Söhne
  rationale: Das hebräische Wort bezeichnet hier ausdrücklich Söhne und wird nicht verallgemeinert.
- source_word: אֶפְדֶּה
  choice: löse ich aus
  rationale: פדה bezeichnet die kultisch-rechtliche Auslösung durch Ersatz oder Zahlung. „Auslösen“ ist in diesem Zusammenhang präzise und verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Tetragrammaton als Gottesnamen. „Jahwe“ bewahrt den Eigenname-Charakter, statt ihn durch einen Titel zu ersetzen.
- issue: Geltungsbereich von זֹבֵחַ bei den männlichen Erstgeburten
  choice: opfere ich Jahwe alles Männliche, das als Erstes den Mutterschoß öffnet
  alternative: bringe ich Jahwe jedes männliche Tier als Opfer dar, das als Erstes den Mutterschoß öffnet
  rationale: Der unmittelbare Wortlaut nennt an dieser Stelle nicht nochmals ausdrücklich Tiere; erst der Gegensatz zur Auslösung der Söhne zeigt die kultische Unterscheidung. Die Übersetzung bewahrt diese knappe Spannung, ohne die sachlich naheliegende Ergänzung „Tier“ in den Haupttext einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit rechtlich-kultischem Ton. Der Satzbau folgt dem hebräischen Begründungszusammenhang, bleibt aber im Deutschen flüssig. Keine Fußnote erforderlich.
