  text: וַ/יַּסֵּ֨ב אֱלֹהִ֧ים אֶת הָ/עָ֛ם דֶּ֥רֶךְ הַ/מִּדְבָּ֖ר יַם ס֑וּף וַ/חֲמֻשִׁ֛ים עָל֥וּ בְנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/018.yaml
  text: So God led the people around by the way of the wilderness to the Sea of Reeds[b][a], and the sons of Israel went up from the land of Egypt armed.
translation:
  language: de
  text: So führte Gott das Volk auf einem Umweg durch die Wüste zum Schilfmeer[a], und die Söhne Israels zogen kampfbereit[b] aus dem Land Ägypten hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Roten Meer“. Der hebräische Name bedeutet wörtlich „Schilfmeer“.'
    reason: alternative_reading
  - marker: b
    text: Das hier mit „kampfbereit“ wiedergegebene hebräische Wort ist in seiner Bedeutung unsicher; möglich sind auch „bewaffnet“, „in Schlachtordnung“ oder allgemeiner „in geordneten Reihen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: ließ … einen Umweg nehmen
  rationale: Der Hifil von סבב bezeichnet hier, dass Gott das Volk nicht auf direktem Weg, sondern auf einer Umgehungsroute führte. Die deutsche Formulierung bewahrt Gottes Veranlassung und klingt natürlich.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: auf dem Weg durch die Wüste
  rationale: דֶּרֶךְ bezeichnet den Weg beziehungsweise die Route; die Formulierung gibt den Routencharakter verständlich wieder.
- source_word: יַם סוּף
  choice: Schilfmeer
  rationale: Dies entspricht dem gewöhnlichen lexikalischen Sinn von סוּף und wahrt den Vorrang des hebräischen Ausgangstextes vor der traditionellen Bezeichnung „Rotes Meer“.
- source_word: וַחֲמֻשִׁים
  choice: kampfbereit
  rationale: Das seltene und umstrittene Wort bezeichnet wahrscheinlich bewaffnete beziehungsweise geordnet zum Kampf ausgerüstete Menschen. „Kampfbereit“ vermeidet die Festlegung darauf, dass jeder Einzelne sichtbar bewaffnet war.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formal transparente Wiedergabe erhält die maskuline hebräische Wendung, die hier zugleich das Bundesvolk als Gesamtheit bezeichnet.
- source_word: עָלוּ … מֵאֶרֶץ מִצְרָיִם
  choice: zogen … aus dem Land Ägypten hinauf
  rationale: „Hinaufziehen“ bildet עלה ab; „aus dem Land Ägypten“ entspricht der hebräischen Präpositionalfügung.
theological_decisions:
- issue: Wiedergabe von יַם סוּף
  choice: Schilfmeer
  alternative: Rotes Meer
  rationale: „Schilfmeer“ folgt der unmittelbaren Bedeutung des hebräischen Namens; die traditionsreiche Bezeichnung „Rotes Meer“ wird als Alternative in der Fußnote erhalten.
- issue: Wiedergabe von בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten / die Kinder Israels
  rationale: Die gewählte Form wahrt die grammatisch maskuline Ausgangsform, ohne zu leugnen, dass die Wendung das Volk Israel insgesamt bezeichnet.
- issue: Deutung von וַחֲמֻשִׁים
  choice: kampfbereit
  alternative: bewaffnet / in Schlachtordnung / in geordneten Reihen
  rationale: Da die genaue Bedeutung umstritten ist, gibt der Haupttext den wahrscheinlichen militärischen Sinn wieder, während die Fußnote die echte lexikalische Unsicherheit offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt erzählerisch klar; „einen Umweg nehmen“ ist idiomatisch, „Schilfmeer“ quellennah und „kampfbereit“ wahrt mit Fußnote die lexikalische Unsicherheit.
