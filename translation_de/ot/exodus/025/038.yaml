  text: Its tongs and its firepans shall be of pure gold[a][b].
translation:
  language: de
  text: Ihre Dochtzangen[a] und ihre Feuerpfannen[b] sollen aus reinem Gold sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Zangen“ beziehungsweise „ihre Dochtscheren“; das hebräische Wort bezeichnet ein Gerät zum Greifen oder Zurichten am Leuchter.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Schalen“; in anderen Zusammenhängen kann das Wort auch „Räucherpfannen“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְקָחֶיהָ
  choice: ihre Dochtzangen
  rationale: Das Wort bezeichnet ein Gerät zum Greifen oder Zurichten; im Zusammenhang mit dem Leuchter liegt ein Werkzeug zur Handhabung der Dochte nahe. „Dochtzangen“ ist im Deutschen verständlich, ohne die Tätigkeit so eng wie „Dochtscheren“ festzulegen.
- source_word: מַחְתֹּתֶיהָ
  choice: ihre Feuerpfannen
  rationale: Das Substantiv bezeichnet gewöhnlich Pfannen oder Behälter für Glut beziehungsweise Feuer. „Feuerpfannen“ bewahrt hier den kultischen Gerätebezug; „Räucherpfannen“ wäre spezifischer, als der Kontext erlaubt.
- source_word: זָהָב טָהוֹר
  choice: aus reinem Gold
  rationale: Die Wendung bezeichnet eindeutig das Material; im Deutschen ist nach der Geräteaufzählung „aus reinem Gold“ natürlich.
- source_word: וּ
  choice: und
  rationale: Die vorangestellte Konjunktion verbindet die beiden Gerätebezeichnungen.
- source_word: -הָ
  choice: ihre
  rationale: Das Suffix der dritten Person feminin Singular verweist auf den im Hebräischen grammatisch femininen Leuchter; im Deutschen ist „ihre“ wegen des maskulinen Bezugsworts „Leuchter“ ebenfalls die passende Form.
