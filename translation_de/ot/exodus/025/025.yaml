  text: You shall make for it a surrounding frame a handbreadth wide[a], and you shall make a gold molding around its frame.
translation:
  language: de
  text: Du sollst rings um ihn eine Handbreit breite Einfassung anbringen und rings um seine Einfassung eine goldene Zierleiste anbringen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen goldenen Kranz um seine Einfassung anbringen“. Das hebräische Wort זֵר bezeichnet eine schmückende Umrandung oder Leiste; traditionell wird es auch mit „Kranz“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: Einfassung
  rationale: Das Wort bezeichnet hier ein rahmendes Bauteil am Tisch. »Einfassung« ist im Deutschen natürlich und legt die genaue Bauform nicht unnötig fest.
- source_word: טֹפַח
  choice: eine handbreite
  rationale: Das Maß bezeichnet eine Handbreit. Die adjektivische Form »handbreit« gibt die gemeinte Abmessung knapp und verständlich wieder.
- source_word: סָבִיב
  choice: rings um
  rationale: Die zweimalige Angabe einer umlaufenden Anordnung wird in beiden Satzhälften bewahrt.
- source_word: זֵר
  choice: Zierleiste
  rationale: Im Zusammenhang der Heiligtumsausstattung bezeichnet das Wort eine schmückende umlaufende Kante oder Leiste. »Zierleiste« ist anschaulich, ohne die traditionelle, möglicherweise missverständliche Vorstellung einer Krone in den Haupttext zu übernehmen.
- source_word: זָהָב
  choice: goldene
  rationale: Das Material wird idiomatisch durch das deutsche Adjektiv »goldene« ausgedrückt.
- source_word: לּוֹ / לְמִסְגַּרְתּוֹ
  choice: um ihn / um seine Einfassung
  rationale: Die Pronomen verweisen im Kontext auf den Tisch. Das maskuline »ihn« bewahrt den Rückbezug, ohne »Tisch« unnötig zu wiederholen.
- source_word: וְעָשִׂיתָ
  choice: Du sollst … anbringen / [du sollst] … anbringen
  rationale: Die Anweisungsform wird mit »Du sollst« wiedergegeben. Im Deutschen können die beiden koordinierten Arbeitsaufträge natürlich unter einem gemeinsamen Modalverb stehen; »anbringen« passt hier besser als das allgemeinere »machen«.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Anleitungssprache. Der Satz bleibt nahe an der hebräischen Abfolge und bewahrt die Wiederholung von »rings um«, wird jedoch durch idiomatisches »anbringen« und die gemeinsame Konstruktion mit »Du sollst« natürliches Deutsch.
