  text: וְ/צִפִּיתָ֤ אֹת/וֹ֙ זָהָ֣ב טָה֔וֹר מִ/בַּ֥יִת וּ/מִ/ח֖וּץ תְּצַפֶּ֑/נּוּ וְ/עָשִׂ֧יתָ עָלָ֛י/ו זֵ֥ר זָהָ֖ב סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/011.yaml
  text: You shall overlay it with pure gold; from the inside and from the outside you shall overlay it[a], and you shall make on it a gold molding all around.
translation:
  language: de
  text: Du sollst sie mit reinem Gold überziehen; innen und außen sollst du sie überziehen. Und du sollst ringsum an ihr eine goldene Einfassung[a] anbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „eine goldene Zierleiste“, „einen goldenen Rand“; traditionell „einen goldenen Kranz“. Das hebräische Wort זֵר bezeichnet hier eine verzierende Einfassung, die rings um den Gegenstand verläuft.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ / תְּצַפֶּנּוּ
  choice: überziehen / sollst du sie überziehen
  rationale: Das Verb צפה bezeichnet hier das Verkleiden der Lade mit einer Metallschicht. „Mit Gold überziehen“ ist im Deutschen handwerklich präzise und bewahrt zudem die Wiederholung des hebräischen Textes.
- source_word: זָהָב טָהוֹר
  choice: reines Gold
  rationale: Die Wortgruppe bezeichnet geläutertes, unverfälschtes Gold. „Reines Gold“ ist die geläufige und sachlich genaue deutsche Wiedergabe.
- source_word: מִבַּיִת וּמִחוּץ
  choice: von innen und von außen
  rationale: Die beiden Ausdrücke bezeichnen parallel die innere und äußere Oberfläche der Lade. Die Formulierung erhält sowohl den Gegensatz als auch die Präpositionen des Hebräischen.
- source_word: וְעָשִׂיתָ עָלָיו
  choice: und du sollst … an ihr … anbringen
  rationale: עַל bezeichnet hier die Platzierung an der Lade. Natürliches Deutsch verlangt in Verbindung mit einer Einfassung eher „anbringen“ als das wörtlichere „machen“.
- source_word: זֵר
  choice: Einfassung
  rationale: זֵר bezeichnet bei den Heiligtumsgeräten eine umlaufende, wohl verzierende Kante oder Leiste. „Einfassung“ ist verständlich und legt ihre genaue bauliche Gestalt nicht unnötig fest.
- source_word: סָבִיב
  choice: ringsum
  rationale: „Ringsum“ gibt knapp und idiomatisch wieder, dass die Einfassung das Objekt auf allen Seiten umläuft.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das feminine Pronomen richtet sich nach dem deutschen Bezugswort „Lade“ aus dem Zusammenhang. Die auffällige Wiederholung von „überziehen“ wurde entsprechend dem Hebräischen beibehalten; bei זֵר wird die konkrete Form nicht stärker festgelegt, als es der Ausgangstext erlaubt.
