base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/015.yaml
  text: The poles shall remain in the rings of the ark[a]; they shall not be removed from it.
translation:
  language: de
  text: Die Stangen sollen in den Ringen der Lade bleiben; sie dürfen nicht von ihr entfernt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּטַבְּעֹת
  choice: in den Ringen
  rationale: Die Präposition בְ bezeichnet hier die Lage der Stangen innerhalb der an der Lade angebrachten Ringe; »in den Ringen« ist im Deutschen natürlich und sachlich genau.
- source_word: הָאָרֹן
  choice: der Lade
  rationale: אָרוֹן bezeichnet in diesem Heiligtumskontext die heilige Lade. »Lade« ist die etablierte und treffende deutsche Wiedergabe.
- source_word: יִהְיוּ
  choice: sollen … bleiben
  rationale: היה bedeutet wörtlich »sein«, bezeichnet hier aber einen fortdauernden Zustand. Zusammen mit dem folgenden Verbot gibt »sollen … bleiben« den Sinn natürlich wieder.
- source_word: הַבַּדִּים
  choice: die Stangen
  rationale: בַּדִּים sind die zum Tragen der Lade bestimmten Stangen. »Stangen« ist klar, modern und im Kontext eindeutig.
- source_word: לֹא יָסֻרוּ
  choice: sie dürfen nicht … entfernt werden
  rationale: סוּר kann »weichen«, »sich entfernen« oder im passiven Sinn »entfernt werden« bedeuten. Hier formuliert der Satz eine Vorschrift, nach der die Stangen nicht herausgenommen werden dürfen.
- source_word: מִמֶּנּוּ
  choice: daraus
  rationale: Das Suffix verweist auf die Lade; wegen der unmittelbar genannten Ringe gibt »daraus« im Deutschen die räumliche Entfernung der Stangen prägnant wieder, ohne den Bezug sachlich zu verändern.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die modale Formulierung »sollen … bleiben« und »dürfen nicht« gibt die fortdauernde Anordnung klar wieder; auf eine Fußnote wurde verzichtet, da die wörtlichere Alternative »sollen … sein« keinen wesentlichen zusätzlichen Sinn erschließt.
