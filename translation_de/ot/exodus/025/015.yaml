  verdict: revise
  source_fidelity: Die erste Satzhälfte gibt בְּטַבְּעֹת הָאָרֹן und den fortdauernden Charakter von יִהְיוּ angemessen wieder. Im zweiten Satz bezieht sich מִמֶּנּוּ jedoch auf die Lade (אָרוֹן), nicht unmittelbar auf die Ringe. »Daraus« kann im Deutschen leicht als Entfernung aus den Ringen verstanden werden und ist zudem räumlich missverständlich, da die Stangen nicht im Inneren der Lade liegen.
  naturalness: »Die Stangen sollen in den Ringen der Lade bleiben« ist modernes, würdiges und natürliches Standarddeutsch. »Sie dürfen nicht von ihr entfernt werden« ist klarer als »daraus entfernt werden« und bewahrt den Bezug zur Lade.
  terminology: »Lade«, »Ringe« und »Stangen« sind im Kontext des Heiligtums sachgerecht, etabliert und zugleich verständlich. Die modale Wiedergabe mit »sollen« und »dürfen nicht« entspricht dem anordnenden Register.
  issues:
