  text: וְ/נָתַתָּ֖ אֶל הָ/אָרֹ֑ן אֵ֚ת הָ/עֵדֻ֔ת אֲשֶׁ֥ר אֶתֵּ֖ן אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/016.yaml
  text: And you shall put into the ark the testimony that I will give you[a].
translation:
  language: de
  text: Lege in die Bundeslade das Zeugnis, das ich dir geben werde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Zusammenhang genauer: die Tafeln des Zeugnisses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Lege
  rationale: נתן bedeutet hier mit der Richtungsangabe אֶל und einem Behältnis nicht Eigentumsübertragung, sondern das Hineinlegen. Der deutsche Imperativ gibt die hebräische Anweisung natürlich wieder.
- source_word: אֶל
  choice: in
  rationale: Mit »legen« und »Bundeslade« bezeichnet die Präposition die Bewegung in das Innere des Behältnisses.
- source_word: הָאָרֹן
  choice: die Bundeslade
  rationale: אָרוֹן bezeichnet in diesem Heiligtumskontext die heilige Lade. »Bundeslade« ist im Deutschen die verständliche, etablierte Kontextbezeichnung, auch wenn »Bund« im Einzelwort nicht ausdrücklich steht.
- source_word: אֵת
  choice: '[unübersetzt]'
  rationale: אֵת markiert das bestimmte direkte Objekt und erhält im Deutschen kein eigenes Wort.
- source_word: הָעֵדֻת
  choice: das Zeugnis
  rationale: עֵדוּת bedeutet »Zeugnis« bzw. »Bezeugung« und bezeichnet hier das von Gott gegebene Bundeszeugnis. Die Wiedergabe bleibt so bewusst allgemeiner als »Tafeln«.
- source_word: אֲשֶׁר
  choice: das
  rationale: Das Relativpronomen bezieht sich auf das sächliche Substantiv »Zeugnis«.
- source_word: אֶתֵּן
  choice: ich dir geben werde
  rationale: Der Qal-Imperfekt der ersten Person Singular bezeichnet hier die angekündigte künftige Gabe Gottes.
- source_word: אֵלֶיךָ
  choice: dir
  rationale: Der hebräische Ausdruck »zu dir« wird beim deutschen Verb »geben« idiomatisch als Dativ wiedergegeben.
theological_decisions:
- issue: Worauf sich »das Zeugnis« bezieht
  choice: Im Haupttext steht allgemein »das Zeugnis«.
  alternative: »die Tafeln des Zeugnisses« beziehungsweise die steinernen Bundestafeln
  rationale: Der hebräische Vers nennt ausdrücklich nur הָעֵדֻת, »das Zeugnis«. Der weitere Zusammenhang identifiziert es mit den Tafeln; diese Präzisierung sollte jedoch nicht stillschweigend in den Haupttext eingefügt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Imperativ ist natürlicher als eine futurische Soll-Formulierung und bewahrt den Charakter der göttlichen Anweisung. »Bundeslade« folgt dem etablierten deutschen Sprachgebrauch; »Zeugnis« erhält die Offenheit des hebräischen Ausdrucks.
