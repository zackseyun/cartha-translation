  text: וְ/נָתַתָּ֧ עַֽל הַ/שֻּׁלְחָ֛ן לֶ֥חֶם פָּנִ֖ים לְ/פָנַ֥/י תָּמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/030.yaml
  text: And you shall set the bread of the Presence on the table before me continually[a].
translation:
  language: de
  text: Und du sollst auf den Tisch das Brot der Gegenwart legen, das immer vor mir sein soll.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Brot der Gegenwart«; traditionell »Schaubrot«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Und du sollst … legen
  rationale: נתן kann »geben, setzen, legen« bedeuten. Im Zusammenhang mit dem Aufstellen eines kultischen Gegenstands ist »legen« im modernen Deutschen natürlich und genau.
- source_word: עַל הַשֻּׁלְחָן
  choice: auf den Tisch
  rationale: Die Präposition bezeichnet die Platzierung auf dem zuvor beschriebenen bestimmten Tisch.
- source_word: לֶחֶם פָּנִים
  choice: das Brot der Gegenwart
  rationale: Die Konstruktion bedeutet wörtlich etwa »Brot des Angesichts/der Gegenwart«. »Brot der Gegenwart« bewahrt den kultischen Ausdruck und bleibt verständlicher als der traditionelle Fachbegriff »Schaubrot«.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Wörtlich »vor meinem Angesicht«; »vor mir« gibt die direkte göttliche Rede knapp und natürlich wieder.
- source_word: תָּמִיד
  choice: immer
  rationale: תמיד bezeichnet hier die fortdauernde beziehungsweise regelmäßig aufrechterhaltene Gegenwart des Brotes. »Immer« ist natürlich und lässt den genauen Vollzugsmodus offen.
theological_decisions:
- issue: Kultischer Ausdruck לֶחֶם פָּנִים
  choice: Brot der Gegenwart
  alternative: Schaubrot; Brot des Angesichts; Brot, das vor mir liegt
  rationale: Die Wiedergabe erhält die Verbindung von פָּנִים mit Gegenwart beziehungsweise Angesicht, ohne die Formulierung mit dem folgenden »vor mir« gleichzusetzen oder spätere konfessionelle Deutungen einzutragen.
- issue: Reichweite von תָּמִיד
  choice: das immer vor mir sein soll
  alternative: beständig; fortwährend; regelmäßig vor mir
  rationale: Die Formulierung wahrt die Spannung zwischen kontinuierlicher Präsenz und regelmäßig erneuerter kultischer Bereitstellung, ohne den praktischen Vollzug näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht erklärende Relativkonstruktion verbindet תָּמִיד eindeutig mit der fortdauernden Stellung des Brotes vor Gott und vermeidet das im Deutschen schwerfällige »vor mir beständig«.
