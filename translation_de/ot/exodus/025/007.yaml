  text: Onyxsteine[a] und Steine zum Einsetzen[b] für das Efod und für das Bruststück[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Onyx“ wiedergegebene hebräische Wort kann einen anderen Edelstein bezeichnen; die genaue Bestimmung ist unsicher.
    reason: lexical_alternative
  - marker: b
