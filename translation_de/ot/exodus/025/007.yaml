lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: Onyxsteine
  rationale: Die traditionelle und im Heiligtumskontext geläufige Wiedergabe ist „Onyxsteine“. Da die genaue Bestimmung von שֹׁהַם unsicher ist, wird dies in einer Fußnote kenntlich gemacht.
- source_word: אַבְנֵי מִלֻּאִים
  choice: Steine zum Einsetzen
  rationale: מִלֻּאִים bezeichnet hier wohl Steine, die in Fassungen eingesetzt werden sollen. Die Formulierung gibt die Funktion natürlich wieder, ohne die handwerkliche Ausführung zu stark festzulegen.
- source_word: לָאֵפֹד
  choice: für das Efod
  rationale: אֵפוֹד ist eine technische Bezeichnung für ein priesterliches Kleidungsstück; die etablierte deutsche Transliteration „Efod“ bewahrt diese Eigenart.
- source_word: וְלַחֹשֶׁן
  choice: und für die Brusttasche
  rationale: חֹשֶׁן bezeichnet das mit Edelsteinen besetzte Bruststück des Hohepriesters. „Brusttasche“ ist im Deutschen anschaulich und vermeidet die irreführende Vorstellung eines militärischen Brustpanzers.
