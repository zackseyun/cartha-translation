- source_word: עֹרֹת אֵילִם
  choice: Widderfelle
  rationale: Die Konstruktverbindung bezeichnet Häute beziehungsweise Felle von Widdern. „Widderfelle“ ist in einer Materialliste natürlich und lässt den genauen Verarbeitungsgrad offen.
- source_word: מְאָדָּמִים
  choice: rot gefärbte
  rationale: Die Form bezeichnet Felle, die rot gemacht worden sind; „rot gefärbt“ gibt die absichtliche Behandlung deutlicher wieder als lediglich „rot“.
- source_word: עֹרֹת תְּחָשִׁים
  choice: Tachasch-Häute[a]
  rationale: Die Bedeutung von תְּחָשִׁים ist unsicher. Die Transliteration vermeidet eine unbelegte Festlegung auf eine bestimmte Tierart oder Lederqualität; die Fußnote erläutert die wichtigsten Deutungen.
- source_word: עֲצֵי שִׁטִּים
  choice: Akazienholz
  rationale: שִׁטִּים wird weithin als Akazie verstanden; die deutsche Stoffbezeichnung „Akazienholz“ passt natürlich in die Aufzählung.
