base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/012.yaml
  text: 'And you shall cast four rings of gold for it and put them on its four feet: two rings on one side of it and two rings on its second side[a].'
translation:
  language: de
  text: 'Du sollst für sie vier goldene Ringe gießen und sie an ihren vier Füßen[a] anbringen: zwei Ringe an ihrer einen Seite und zwei Ringe an ihrer anderen Seite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an ihren vier Ecken“. Das hebräische Wort ist hier schwer zu bestimmen; wahrscheinlich sind die unteren Stützen oder Standfüße der Lade gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצַקְתָּ
  choice: Du sollst … gießen
  rationale: יצק bezeichnet hier im Zusammenhang mit goldenen Beschlägen das Gießen von Metall. Die deutsche Formulierung ist fachlich passend und bewahrt den Anweisungscharakter.
- source_word: טַבְּעֹת
  choice: Ringe
  rationale: Das Substantiv bezeichnet die goldenen Trageringe der Lade; „Ringe“ ist im Deutschen klar und präzise.
- source_word: זָהָב
  choice: goldene
  rationale: Die adjektivische Wiedergabe bezeichnet das Material natürlich und vollständig.
- source_word: וְנָתַתָּה
  choice: und … anbringen
  rationale: נתן bedeutet grundsätzlich „geben, setzen, anbringen“. Da die Ringe dauerhaft an der Lade befestigt werden, ist „anbringen“ im Deutschen anschaulicher als das allgemeinere „setzen“.
- source_word: פַּעֲמֹתָיו
  choice: ihren vier Füßen
  rationale: Der schwierige Ausdruck bezeichnet hier wahrscheinlich die vier fußartigen unteren Stützen beziehungsweise Standpunkte der Lade. „Füße“ bewahrt das konkrete Bild; die mögliche Deutung als „Ecken“ wird in einer Fußnote genannt.
- source_word: צַלְעוֹ
  choice: ihrer … Seite
  rationale: צלע bezeichnet bei einem Gegenstand eine Seitenfläche beziehungsweise Längsseite; „Seite“ ist die natürliche moderne Wiedergabe.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: ihrer einen Seite … ihrer anderen Seite
  rationale: Das idiomatische deutsche Gegensatzpaar „die eine … die andere“ gibt die hebräische Zuordnung klar wieder, ohne das unnatürliche „zweite Seite“ zu erzwingen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Das feminine Pronomen nimmt die in Vers 10 genannte „Lade“ auf. Der parallele Aufbau der Bauanweisung bleibt erhalten; „anbringen“ verdeutlicht die funktionale Befestigung der Ringe.
