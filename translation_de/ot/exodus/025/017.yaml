id: EXO.25.17
reference: Exodus 25:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ כַפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/017.yaml
  text: And you shall make a mercy seat of pure gold; its length shall be two cubits and a half[a], and its width a cubit and a half.
translation:
  language: de
  text: Du sollst eine Sühneplatte[a] aus reinem Gold anfertigen. Sie soll zweieinhalb Ellen lang und anderthalb Ellen breit sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell auch »Gnadenthron«; gegenständlich »Deckplatte«. Das hebräische Wort כַּפֹּרֶת bezeichnet die goldene Platte auf der Bundeslade und ist mit der Wortwurzel כפר verbunden, die Sühne bezeichnet.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst … anfertigen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im Anweisungskontext verpflichtende Bedeutung. Die deutsche Soll-Form gibt den direktiven Charakter natürlich und würdig wieder.
- source_word: כַפֹּרֶת
  choice: Sühneplatte
  rationale: Das Wort bezeichnet hier die goldene Deckplatte der Bundeslade und steht in Beziehung zur Wurzel כפר, die mit Sühne verbunden ist. „Sühneplatte“ bezeichnet den Gegenstand konkret und bewahrt zugleich seinen kultisch-theologischen Gehalt.
- source_word: זָהָב טָהוֹר
  choice: aus reinem Gold
  rationale: Die idiomatische Materialangabe „aus reinem Gold“ gibt sowohl den Werkstoff als auch seine ausdrücklich genannte Reinheit wieder.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: zweieinhalb Ellen
  rationale: Die antike Maßeinheit bleibt erhalten; die moderne deutsche Zahlenform ist klar und natürlich.
- source_word: אָרְכָּהּ
  choice: Sie soll … lang … sein
  rationale: Das feminine Suffix bezieht sich auf כַפֹּרֶת. Die prädikative deutsche Formulierung gibt die Längenangabe flüssig wieder.
- source_word: וְאַמָּה וָחֵצִי
  choice: und anderthalb Ellen
  rationale: Die Formulierung bewahrt die Maßeinheit und steht parallel zur vorausgehenden Längenangabe.
- source_word: רָחְבָּהּ
  choice: … breit sein
  rationale: Das feminine Suffix verweist erneut auf die Sühneplatte; die deutsche Adjektivkonstruktion ist präzise und idiomatisch.
theological_decisions:
- issue: Wiedergabe von כַפֹּרֶת als kultisch und theologisch geprägter Gegenstandsname
  choice: Sühneplatte
  alternative: Gnadenthron; Deckplatte
  rationale: „Sühneplatte“ macht deutlich, dass ein konkreter goldener Aufsatz beziehungsweise Deckel der Lade gemeint ist, und wahrt die Beziehung zur Sühnewurzel כפר. „Gnadenthron“ ist traditionsreich, kann aber fälschlich einen eigentlichen Thronsitz nahelegen; „Deckplatte“ ist gegenständlich klar, lässt jedoch den kultischen Bedeutungsbezug unhörbar werden. Die Fußnote dokumentiert diese Spannung, ohne sie einseitig aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Anweisungston. Die Soll-Form bewahrt den verbindlichen Charakter; die Maße bleiben in Ellen stehen. Der Fachausdruck wird im Haupttext knapp und in der Fußnote transparent erläutert.
