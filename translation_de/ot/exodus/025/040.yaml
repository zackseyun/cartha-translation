  text: וּ/רְאֵ֖ה וַ/עֲשֵׂ֑ה בְּ/תַ֨בְנִיתָ֔/ם אֲשֶׁר אַתָּ֥ה מָרְאֶ֖ה בָּ/הָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/040.yaml
  text: And see that you make them according to their pattern[a], which was shown to you on the mountain.
translation:
  language: de
  text: Achte darauf, dass du sie nach ihrem Vorbild[a] anfertigst, das dir auf dem Berg gezeigt wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sieh zu und fertige sie nach ihrem Muster an, das dir auf dem Berg gezeigt wurde.“'
    reason: Bewahrt die wörtlichere Koordination der beiden Imperative; „Muster“ ist eine mögliche Wiedergabe von תבנית, und „gezeigt wurde“ gibt eine kontextuell mögliche vergangenheitsbezogene Auffassung des passiven Partizips מָרְאֶה wieder.
lexical_decisions:
- source_word: וּרְאֵה
  choice: Achte darauf
  rationale: Der Imperativ von ראה dient hier idiomatisch als eindringliche Aufforderung zu sorgfältiger Beachtung; die natürliche deutsche Wendung bewahrt diese Funktion.
- source_word: וַעֲשֵׂה
  choice: dass du sie … anfertigst
  rationale: עשה bedeutet im Zusammenhang mit der Herstellung der zuvor beschriebenen Gegenstände „anfertigen“. Die Satzfügung mit „dass“ gibt den Inhalt der vorangehenden Mahnung idiomatisch wieder.
- source_word: בְּתַבְנִיתָם
  choice: nach dem Vorbild
  rationale: תבנית kann Muster, Modell, Gestalt oder Vorlage bezeichnen. „Vorbild“ drückt hier die maßgebliche, gezeigte Ausführung aus, ohne die Beschaffenheit dieses Modells näher festzulegen; das Suffix bezieht sich sinngemäß auf die herzustellenden Gegenstände.
- source_word: אֲשֶׁר
  choice: das
  rationale: Die Relativpartikel leitet den auf תבנית bezogenen Relativsatz ein.
- source_word: מָרְאֶה
  choice: dir … gezeigt wurde
  rationale: 'Die Form wird als Hophal-Partizip von ראה verstanden, also passiv: „gezeigt“. Das deutsche Präteritum ist im Kontext natürlich und bezeichnet die Offenbarung des Vorbilds auf dem Berg, ohne unnötig einen fortlaufenden Vorgang zu behaupten.'
- source_word: בָּהָר
  choice: auf dem Berg
  rationale: Die Präposition ב bezeichnet hier Moses’ Ort auf dem Berg; „auf dem Berg“ ist die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Wesen des offenbarten Modells für die Heiligtumsgegenstände
  choice: Vorbild
  alternative: Muster; Modell; Bauplan
  rationale: „Vorbild“ lässt offen, ob eine sichtbare Vorlage, eine Gestalt oder ein Plan gemeint ist, und legt keine Theorie eines himmlischen Urbilds fest.
- issue: Zeitbezug des Gezeigtwerdens
  choice: gezeigt wurde
  alternative: gezeigt wird
  rationale: Das hebräische Partizip kann kontextuell verschieden wiedergegeben werden. Das Präteritum ist im Deutschen für das Moses auf dem Berg offenbarte Vorbild natürlich; die alternative präsentische Wiedergabe bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Achte darauf“ ist verständlicher und idiomatischer als das hebraisierende „Und sieh“, während die Fußnote die formnähere Alternative dokumentiert.
