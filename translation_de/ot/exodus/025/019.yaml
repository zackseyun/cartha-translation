base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/019.yaml
  text: Make one cherub on one end and one cherub on the other end[a]; from the mercy seat you shall make the cherubim on its two ends.
translation:
  language: de
  text: Fertige an dem einen Ende einen Kerub und an dem anderen Ende einen Kerub an. Aus der Sühneplatte sollt ihr die Kerubim an beiden Enden der Sühneplatte herausarbeiten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische „aus/von“ bezeichnet hier den Materialzusammenhang: Die Kerubim sollen aus der Sühneplatte selbst herausgearbeitet und nicht als getrennte Stücke angesetzt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Fertige … an
  rationale: Der Imperativ im Singular eröffnet die Anweisung. Das vorangestellte וַ wird in natürlichem Deutsch nicht eigens wiedergegeben.
- source_word: כְּרוּב ... וּכְרוּב
  choice: einen Kerub … einen Kerub
  rationale: Die Singularformen bezeichnen zunächst jede der beiden Gestalten einzeln; „Kerub“ ist die etablierte deutsche Umschrift des Fachbegriffs.
- source_word: אֶחָד
  choice: einen
  rationale: Die beiden Vorkommen des Zahlworts werden in der symmetrischen Formulierung „an dem einen … an dem anderen“ wiedergegeben.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: an dem einen Ende … an dem anderen Ende
  rationale: Die wörtlich wiederholte Wendung „vom Ende auf dieser Seite“ bezeichnet hier idiomatisch die Lage an den beiden gegenüberliegenden Enden.
- source_word: מִן הַכַּפֹּרֶת
  choice: aus der Sühneplatte
  rationale: כַּפֹּרֶת bezeichnet die besondere Deckplatte der Bundeslade mit sühnender kultischer Funktion. מִן drückt hier Herkunft beziehungsweise Materialzusammenhang aus.
- source_word: תַּעֲשׂוּ
  choice: sollt ihr … herausarbeiten
  rationale: Der Imperfekt in der zweiten Person Plural hat im Anweisungskontext verpflichtende Kraft und richtet sich an die ausführenden Handwerker. „Herausarbeiten“ verdeutlicht, dass die Figuren aus der Platte selbst geformt werden.
- source_word: הַכְּרֻבִים
  choice: die Kerubim
  rationale: Der deutsche Fachplural „Kerubim“ bewahrt den technischen Charakter der Bezeichnung.
- source_word: עַל שְׁנֵי קְצוֹתָיו
  choice: an ihren beiden Enden
  rationale: עַל bezeichnet hier die Lage; das Suffix bezieht sich sachlich auf die Sühneplatte.
theological_decisions:
- issue: Wiedergabe von כַּפֹּרֶת
  choice: Sühneplatte
  alternative: Deckplatte; Gnadenthron
  rationale: „Sühneplatte“ benennt sowohl den konkreten Gegenstand als auch seine kultische Funktion, ohne die Bezeichnung rein baulich zu verengen oder mit „Gnadenthron“ eine im Hebräischen nicht ausdrücklich genannte Thronvorstellung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Anweisungsdeutsch. Der Wechsel vom Singularimperativ „Fertige … an“ zum pluralischen „sollt ihr“ bleibt entsprechend dem Hebräischen erhalten. Die Wiederholung der Endangaben wird aus Gründen der Klarheit und natürlichen deutschen Syntax symmetrisch formuliert.
