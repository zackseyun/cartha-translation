  text: You shall overlay it with pure gold[a], and you shall make for it a gold molding all around.
translation:
  language: de
  text: Du sollst ihn mit reinem Gold überziehen und ringsum eine goldene Zierleiste[a] für ihn anfertigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: einen goldenen Rand; das hebräische Wort bezeichnet hier eine umlaufende Einfassung und wird traditionell auch mit „Kranz“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: Du sollst … überziehen
  rationale: Das Verb צפה bezeichnet hier das Überziehen eines hölzernen Gegenstands mit einer Metallschicht. „Mit Gold überziehen“ ist im Deutschen präzise und idiomatisch.
- source_word: אֹתוֹ
  choice: ihn
  rationale: Das Pronomen bezieht sich auf den Tisch (שֻׁלְחָן) im vorherigen Vers und steht deshalb im Deutschen maskulin.
- source_word: זָהָב טָהוֹר
  choice: reinem Gold
  rationale: Die Wendung bezeichnet Gold von hoher Reinheit; „reines Gold“ ist die natürliche und etablierte deutsche Entsprechung.
- source_word: וְעָשִׂיתָ
  choice: und … anfertigen
  rationale: עשה bedeutet grundsätzlich „machen“. Im Zusammenhang mit einem handwerklich herzustellenden Bestandteil gibt „anfertigen“ den Sinn natürlich wieder, ohne zusätzliche Einzelheiten einzutragen.
- source_word: לּוֹ
  choice: für ihn
  rationale: Die Präposition ל bezeichnet hier den Gegenstand, für den die Leiste angefertigt wird. Das maskuline Pronomen nimmt den Tisch wieder auf.
- source_word: זֵר
  choice: Zierleiste
  rationale: זֵר bezeichnet in diesem Zusammenhang eine umlaufende, wohl schmückende Einfassung am Tisch. „Zierleiste“ passt zum Möbelbau und vermeidet das im modernen Deutschen missverständliche „Kranz“ oder „Krone“.
- source_word: זָהָב
  choice: goldene
  rationale: Das Material wird im Deutschen idiomatisch durch das Adjektiv „golden“ ausgedrückt; gemeint ist eine Leiste aus Gold, nicht lediglich von goldener Farbe.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Adverb bezeichnet eine Einfassung auf allen Seiten. „Ringsum“ ist knapp, modern und erhält diesen umfassenden Sinn.
