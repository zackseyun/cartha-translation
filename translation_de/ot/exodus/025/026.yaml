  terminology: „Goldene Ringe“, „Ecken“ und „Füße“ sind passende Bezeichnungen. Die Fußnoten dokumentieren sachgerecht die lexikalischen Spielräume von פֵּאָה („Seiten/Ränder/Ecken“) und רֶגֶל („Füße/Beine“), ohne eine bautechnische oder theologische Deutung festzuschreiben. Die Fußnotenanker stehen jeweils an dem betreffenden deutschen Ausdruck.
