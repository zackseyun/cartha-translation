  text: וְ/עָשִׂ֣יתָ לּ֔/וֹ אַרְבַּ֖ע טַבְּעֹ֣ת זָהָ֑ב וְ/נָתַתָּ֙ אֶת הַ/טַּבָּעֹ֔ת עַ֚ל אַרְבַּ֣ע הַ/פֵּאֹ֔ת אֲשֶׁ֖ר לְ/אַרְבַּ֥ע רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/026.yaml
  text: And you shall make for it four gold rings[b][a], and you shall put the rings on the four corners that are at its four feet.
translation:
  language: de
  text: Du sollst für ihn vier goldene Ringe anfertigen und die Ringe an den vier Ecken[a] anbringen, die sich bei seinen vier Füßen[b] befinden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an den vier Seiten“ beziehungsweise „an den vier Rändern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Beinen“; das hebräische Wort kann je nach Zusammenhang „Füße“ oder „Beine“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst … anfertigen
  rationale: Das Qal-Perfekt mit וְ setzt die Folge von Anweisungen fort. „Du sollst … anfertigen“ gibt den verpflichtenden Charakter und den handwerklichen Zusammenhang natürlich wieder.
- source_word: לּוֹ
  choice: für ihn
  rationale: Das maskuline Suffix bezieht sich auf den im Kontext genannten Tisch; deshalb ist im Deutschen das maskuline Pronomen „ihn“ angemessen.
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: vier goldene Ringe
  rationale: Diese Formulierung bezeichnet vier aus Gold gefertigte Ringe und ist im modernen Deutschen klar und idiomatisch.
- source_word: וְנָתַתָּ
  choice: und … anbringen
  rationale: נתן bedeutet grundsätzlich „geben, setzen, legen“. Bei Beschlägen an einem Möbelstück gibt „anbringen“ die konkrete Handlung natürlich wieder, ohne eine über den Kontext hinausgehende Befestigungsart festzulegen.
- source_word: עַל
  choice: an
  rationale: Bei der Befestigung von Ringen an den Ecken eines Möbelstücks ist „an“ im Deutschen idiomatischer als das wörtlichere „auf“.
- source_word: אַרְבַּע הַפֵּאֹת
  choice: an den vier Ecken
  rationale: פֵּאָה bezeichnet einen Randbereich, eine Seite oder Ecke. Im Zusammenhang mit den vier Tischfüßen passt „Ecken“ am besten; die weiteren Möglichkeiten bleiben in einer Fußnote erhalten.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: die sich bei seinen vier Füßen befinden
  rationale: Der Relativsatz ordnet die vier Ecken den vier Stützen des Tisches zu. „Bei“ wahrt die räumliche Unbestimmtheit von לְ, während „Füße“ für ein Möbelstück idiomatisch ist.
