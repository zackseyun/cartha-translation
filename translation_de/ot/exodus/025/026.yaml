  source_fidelity: 'Der Entwurf gibt die hebräische Anweisungsfolge zutreffend wieder: vier Ringe aus Gold für den im Kontext genannten Tisch, ihre Anbringung an dessen vier פֵּאוֹת sowie die Zuordnung zu den vier רַגְלַיִם. Das maskuline „ihn/seinen“ ist im Deutschen sachlich korrekt, da „der Tisch“ maskulin ist. „Bei seinen vier Füßen“ wahrt die räumlich-zuordnende, nicht völlig präzise Beziehung der hebräischen Formulierung.'
