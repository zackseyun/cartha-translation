  text: and a knob under two branches from it, and a knob under two branches from it, and a knob under two branches from it, for the six branches going out from the lampstand.
translation:
  language: de
  text: Ein Knauf soll unter je zwei Armen sein, ein Knauf unter je zwei Armen und ein Knauf unter je zwei Armen – für die sechs Arme, die vom Leuchter ausgehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: Knauf
  rationale: Bezeichnet hier ein rundliches Zierelement am Leuchter; »Knauf« ist im Deutschen konkret und passt zum kunsthandwerklichen Zusammenhang.
- source_word: קָנִים
  choice: Arme
  rationale: Die seitlich aus dem Schaft hervorgehenden Teile des Leuchters werden im modernen Deutschen natürlich als »Arme« bezeichnet.
- source_word: מְנֹרָה
  choice: Leuchter
  rationale: Im Kontext des Heiligtums bezeichnet das Wort den siebenarmigen Leuchter, nicht lediglich eine einzelne Lampe.
- source_word: מִמֶּנָּה
  choice: aus ihm
  rationale: Das pronominale Suffix ist feminin und bezieht sich grammatisch auf die Menora; im Deutschen richtet sich das Pronomen nach »Leuchter«.
