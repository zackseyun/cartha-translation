base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/020.yaml
  text: And the cherubim shall spread out their wings upward[a], overshadowing the mercy seat with their wings, and their faces shall be one toward another; the faces of the cherubim shall be toward the mercy seat.
translation:
  language: de
  text: Die Kerubim sollen ihre Flügel nach oben ausbreiten und mit ihren Flügeln die Sühneplatte[a] überschatten. Ihre Gesichter sollen einander zugewandt sein; zur Sühneplatte hin sollen die Gesichter der Kerubim gerichtet sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Deckplatte. Das hebräische Wort bezeichnet die goldene Abdeckung der Bundeslade und steht mit Sühne in Verbindung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: sollen ... sein / gerichtet sein
  rationale: Im Zusammenhang der Bauanweisung hat die Verbform vorschreibende Bedeutung; deutsches „sollen“ gibt diesen Anweisungscharakter natürlich wieder.
- source_word: הַכְּרֻבִים
  choice: die Kerubim
  rationale: „Kerubim“ ist die im Deutschen etablierte, dem Hebräischen nahe Pluralform für diese himmlischen Wesen.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: ihre Flügel nach oben ausbreiten
  rationale: Die Formulierung bewahrt sowohl die aktive Haltung der ausgebreiteten Flügel als auch deren Richtung nach oben.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: mit ihren Flügeln ... überschatten
  rationale: „Überschatten“ gibt das bildhafte Bedecken durch die darüber ausgebreiteten Flügel wieder; „mit“ bezeichnet das Mittel.
- source_word: הַכַּפֹּרֶת
  choice: die Sühneplatte
  rationale: כַּפֹּרֶת bezeichnet die goldene Deckplatte der Bundeslade mit kultischer Sühnefunktion. „Sühneplatte“ verbindet Gegenstand und Funktion präziser als das allgemeine „Deckel“.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: Ihre Gesichter sollen einander zugewandt sein
  rationale: Die hebräische distributive Wendung bedeutet, dass jeweils der eine dem anderen zugewandt ist. Die deutsche Formulierung gibt den wechselseitigen Bezug natürlich wieder.
- source_word: אֶל הַכַּפֹּרֶת יִהְיוּ פְּנֵי הַכְּרֻבִים
  choice: zur Sühneplatte hin sollen die Gesichter der Kerubim gerichtet sein
  rationale: Die konkrete Erwähnung der Gesichter und ihre räumliche Ausrichtung zur Platte bleiben erhalten.
theological_decisions:
- issue: Wiedergabe von כַּפֹּרֶת in den Anweisungen zum Heiligtum
  choice: Sühneplatte
  alternative: Deckplatte; Gnadenthron
  rationale: Der Ausdruck bezeichnet konkret die goldene Platte auf der Bundeslade und zugleich den mit Sühne verbundenen Kultgegenstand. „Sühneplatte“ wahrt beide Aspekte, ohne die Bedeutung ausschließlich als Sitz oder Thron auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde für gute Verständlichkeit in zwei Sätze gegliedert; die wiederholte Ausrichtung der Gesichter aus dem Hebräischen bleibt erhalten.
