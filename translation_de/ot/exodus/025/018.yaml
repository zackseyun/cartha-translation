  yaml_path: translation/ot/exodus/025/018.yaml
  text: And you shall make two cherubim of gold; of hammered work you shall make them[a], at the two ends of the mercy seat.
translation:
  language: de
  text: Du sollst zwei Cherubim aus Gold anfertigen. In Treibarbeit sollst du sie aus den beiden Enden der Sühneplatte[a] anfertigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Deckplatte“; traditionell: „Gnadenthron“. Das hebräische Wort bezeichnet die Deckplatte der Bundeslade; seine genaue Herleitung und Bedeutungsnuance sind umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst … anfertigen
  rationale: Das Qal-Perfekt mit וְ hat in dieser fortlaufenden Bauanweisung gebietende Bedeutung. „Du sollst“ bewahrt den verbindlichen Anweisungsstil; „anfertigen“ passt natürlich zum handwerklichen Zusammenhang.
- source_word: שְׁנַיִם
  choice: zwei
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: כְּרֻבִים
  choice: Kerubim
  rationale: Die traditionelle, im Deutschen verständliche Transliteration bezeichnet diese besonderen himmlischen Wesen präziser als eine verallgemeinernde Umschreibung.
- source_word: זָהָב
  choice: aus Gold
  rationale: Die Präposition „aus“ gibt das Material der Kerubim im Deutschen idiomatisch wieder.
- source_word: מִקְשָׁה
  choice: in Treibarbeit
  rationale: Das Wort bezeichnet eine durch Hämmern beziehungsweise Treiben geformte Metallarbeit. „In Treibarbeit“ ist fachlich treffend und lässt die handwerkliche Herstellungsweise erkennen, ohne „aus einem Stück“ ausdrücklich in den Wortlaut einzutragen.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: sollst du sie … anfertigen
  rationale: Die ausdrückliche Wiederholung des Verbs im Hebräischen bleibt erhalten und hebt die Herstellungsweise hervor.
- source_word: מִשְּׁנֵי קְצֹוֹת
  choice: an den beiden Enden
  rationale: Diese natürliche räumliche Formulierung gibt die Beziehung zu den beiden Enden wieder, ohne allein aufgrund der Präposition festzulegen, ob die Figuren bloß dort stehen oder aus den Enden herausgearbeitet sind.
- source_word: הַכַּפֹּרֶת
  choice: die Sühneplatte
  rationale: „Sühneplatte“ bezeichnet verständlich den goldenen Deckel der Bundeslade und bewahrt zugleich die kultische Verbindung des hebräischen Begriffs zur Sühne.
theological_decisions:
- issue: Wiedergabe von הַכַּפֹּרֶת im Heiligtumskontext
  choice: Sühneplatte
  alternative: Deckplatte; Gnadenthron
  rationale: „Sühneplatte“ verbindet die konkrete Gestalt als Deckplatte mit ihrer kultischen Funktion, ohne den Gegenstand als eigentlichen Thronsitz zu deuten. Die Fußnote dokumentiert sowohl die sachlich-räumliche als auch die traditionelle theologische Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der verbindliche Anweisungsstil und die Wiederholung von „anfertigen“ folgen der hebräischen Struktur; handwerkliche Fachsprache wird nur dort verwendet, wo sie für die Herstellungsweise wesentlich ist.
