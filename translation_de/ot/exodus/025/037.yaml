  text: וְ/עָשִׂ֥יתָ אֶת נֵרֹתֶ֖י/הָ שִׁבְעָ֑ה וְ/הֶֽעֱלָה֙ אֶת נֵ֣רֹתֶ֔י/הָ וְ/הֵאִ֖יר עַל עֵ֥בֶר פָּנֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/037.yaml
  text: You shall make its seven lamps[b][a], and he shall set up its lamps so that they give light in front of it.
translation:
  language: de
  text: Du sollst seine sieben Lampen anfertigen. Dann soll man seine Lampen so anbringen[a], dass sie nach vorn leuchten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann soll man seine Lampen anzünden“. Das hebräische Verb bedeutet wörtlich „hinaufbringen“ und kann in diesem Zusammenhang sowohl das Aufsetzen oder Anordnen als auch das Anzünden der Lampen bezeichnen. Der Handelnde wird in diesem Vers nicht ausdrücklich genannt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „gegenüber seiner Vorderseite“. Die Wendung bezeichnet die Richtung des Lichts in Bezug auf die Vorderseite des Leuchters.'
    reason: translation_clarity
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst … anfertigen
  rationale: Das Qal Perfekt mit וְ hat im Anweisungskontext verpflichtenden Sinn. „Anfertigen“ passt natürlich zur Herstellung des Leuchters und seiner Lampen.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: ihre sieben Lampen
  rationale: נֵרֹת bezeichnet hier die Lampen des grammatisch femininen Leuchters; der feminine Singularsuffix wird daher mit „ihre“ wiedergegeben.
- source_word: וְהֶעֱלָה
  choice: Dann soll er … aufsetzen
  rationale: Die Hifilform von עלה ist eindeutig 3. Person maskulin Singular und bedeutet wörtlich „hinaufbringen“. Im Zusammenhang kann sie das Aufsetzen beziehungsweise das Anzünden der Lampen bezeichnen; der Haupttext wahrt mit „aufsetzen“ die konkrete räumliche Bedeutung.
- source_word: וְהֵאִיר
  choice: damit sie … erhellen
  rationale: 'Die Form ist ebenfalls 3. Person maskulin Singular und kann sich distributiv auf den Lampensatz beziehen: Er setzt die Lampen so auf, dass Licht entsteht. Die deutsche Zweckkonstruktion gibt die Funktion idiomatisch wieder, ohne die Handlung unnötig zu verdoppeln.'
- source_word: עַל־עֵבֶר פָּנֶיהָ
  choice: den Raum vor ihr
  rationale: Die Wendung bezeichnet die Seite beziehungsweise den Bereich vor der Vorderseite des Leuchters. „Den Raum vor ihr“ macht Ziel und Ausrichtung des Lichts in natürlichem Deutsch deutlich.
theological_decisions:
- issue: Nicht genannter Handelnder bei וְהֶעֱלָה
  choice: Das maskuline Singularsubjekt wird mit „er“ bewahrt und in einer Fußnote als nicht ausdrücklich benannt erklärt.
  alternative: Ein unpersönliches „man“ oder ein ausdrücklich ergänzter „Priester“.
  rationale: Der hebräische Text nennt keinen Priester, markiert das Verb aber klar als maskulinen Singular. Die Übersetzung soll weder die Person festlegen noch die grammatische Spannung beseitigen.
- issue: Bedeutungsumfang von העלה bei Lampen
  choice: Im Haupttext „aufsetzen“, mit „anzünden“ als Fußnotenalternative.
  alternative: Nur „anzünden“.
  rationale: Im kultischen Sprachgebrauch kann das Verb das Anzünden bezeichnen, trägt aber zugleich die Grundvorstellung des Hinaufbringens beziehungsweise Aufsetzens. Die Mehrdeutigkeit bleibt sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Du sollst“ erhält den direkten Anweisungscharakter an Mose. Die feminine Rückverweisung „ihre/ihr“ folgt dem deutschen Genus von „Leuchter“; „den Raum vor ihr“ vermeidet eine missverständliche Vorstellung, der Leuchter beleuchte sich selbst.
