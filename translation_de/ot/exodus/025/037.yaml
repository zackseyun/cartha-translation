revisions:
- from: Du sollst ihre sieben Lampen anfertigen. Dann soll er ihre Lampen aufsetzen[a], damit sie den Raum vor ihr erhellen.[b]
  to: Du sollst seine sieben Lampen anfertigen. Dann soll man seine Lampen so anbringen[a], dass sie nach vorn leuchten.[b]
  rationale: Die Revision korrigiert das deutsche Genus des Bezugswortes „Leuchter“, entfernt die nicht im Ausgangstext enthaltene Ergänzung „Raum“ und gibt die Richtungsangabe präzise, aber idiomatisch als „nach vorn“ wieder. „Man“ bildet den im Text nicht benannten maskulinen Singular im Deutschen als unbestimmten Handelnden ab, ohne einen Priester zu ergänzen. Die Fußnoten bewahren die lexikalische Offenheit von העלה und erläutern die Richtungsphrase ohne eine künstliche Pseudo-Wörtlichkeit.
