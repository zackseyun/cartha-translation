  text: And you shall put the poles into the rings on the sides of the ark[a], to carry the ark with them.
translation:
  language: de
  text: Und bring die Stangen in die Ringe an den Seiten der Lade, um die Lade mit ihnen zu tragen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: Und schiebe
  rationale: Das Verb בוא bedeutet grundsätzlich „bringen/hineinbringen“. Zusammen mit Stangen und Ringen bezeichnet es hier das Einführen; „schiebe … durch“ gibt den konkreten Vorgang im Deutschen natürlich wieder.
- source_word: הַבַּדִּים
  choice: die Stangen
  rationale: בַּדִּים bezeichnet hier die zum Tragen bestimmten Stangen. „Stangen“ ist modern und verständlich; „Tragestangen“ wäre expliziter, im Zusammenhang aber unnötig.
- source_word: בַּטַּבָּעֹת
  choice: durch die Ringe
  rationale: Die Präposition בְּ bezeichnet hier in Verbindung mit dem Bewegungsverb das Hineinführen in die Ringe. Da Stangen durch Ringe geschoben werden, ist „durch“ im Deutschen anschaulich und idiomatisch.
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: an den Seiten der Lade
  rationale: צְלָעוֹת meint die Seiten beziehungsweise Seitenteile. Bei befestigten Ringen ist deutsches „an den Seiten“ natürlicher als „auf den Seiten“.
- source_word: הָאָרֹן
  choice: die Lade
  rationale: אָרוֹן kann eine Kiste oder Truhe bezeichnen; im Heiligtumskontext ist „Lade“ der etablierte und präzise deutsche Ausdruck.
- source_word: לָשֵׂאת
  choice: damit man … tragen kann
  rationale: נשא bezeichnet hier das physische Tragen. Die Zweckkonstruktion wird in natürlichem Deutsch mit „damit … tragen kann“ wiedergegeben.
- source_word: בָּהֶם
  choice: damit
  rationale: Das Pronomen bezieht sich auf die Stangen als Mittel des Tragens. Das zweite „damit“ ist im Deutschen idiomatisch und bewahrt den instrumentalen Sinn.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satz ist als direkte Anweisung formuliert; „Lade“ bewahrt die etablierte biblische Terminologie, während „schiebe … durch“ den praktischen Vorgang klar ausdrückt.
