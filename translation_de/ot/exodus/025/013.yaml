  text: You shall make poles of acacia wood and overlay them with gold.
translation:
  language: de
  text: Fertige Tragstangen aus Akazienholz an und überziehe sie mit Gold.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Fertige … an
  rationale: Das Qal-Perfekt mit וְ in der fortlaufenden Anweisungsreihe hat hier gebietende Funktion. Der deutsche Imperativ gibt diesen Anweisungscharakter natürlich und präzise wieder.
- source_word: בַדֵּי
  choice: Tragstangen
  rationale: Gemeint sind die Stangen, mit denen die Bundeslade getragen wird. „Tragstangen“ ist im Deutschen eindeutiger als das allgemeinere „Stangen“.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: Die Constructusverbindung bezeichnet Holz der Akazie. „Akazienholz“ ist die geläufige und verständliche deutsche Sachbezeichnung.
- source_word: וְצִפִּיתָ
  choice: und überziehe
  rationale: Das Verb bezeichnet das Bedecken eines Grundmaterials mit einem anderen Material; im handwerklichen Zusammenhang ist „mit Gold überziehen“ idiomatisch und genau.
- source_word: אֹתָם
  choice: sie
  rationale: Das pluralische Objektpronomen verweist auf die Tragstangen.
- source_word: זָהָב
  choice: mit Gold
  rationale: Die deutsche Konstruktion „mit Gold überziehen“ gibt das Material des Überzugs idiomatisch wieder.
