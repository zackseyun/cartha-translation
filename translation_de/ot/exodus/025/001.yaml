lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann sprach
  rationale: Das Narrativ-Waw führt die Handlung fort. „Dann sprach“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten des Sprechens; „zu Mose“ ist die natürliche deutsche Formulierung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Formel leitet die folgende direkte Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion idiomatisch, ohne ein schwerfälliges „und sagte“ hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der hebräische Text verwendet den vierbuchstabigen Gottesnamen. „Jahwe“ bewahrt ihn als persönlichen Namen; die Fußnote nennt die hebräische Form und eine weitere gebräuchliche Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelhafte Redeeinleitung wird idiomatisch durch einen Doppelpunkt wiedergegeben; der Gottesname bleibt sichtbar.
