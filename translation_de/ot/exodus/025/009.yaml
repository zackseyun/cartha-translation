base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/009.yaml
  text: Exactly according to all that I am showing you—the pattern of the tabernacle and the pattern of all its furnishings—so you shall make it[a][b].
translation:
  language: de
  text: Genau nach allem, was ich dir zeige – nach dem Muster[a] der Wohnung und nach dem Muster all ihrer Geräte –, sollt ihr es anfertigen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Plan“, „Modell“ oder „Entwurf“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische „sollt ihr anfertigen“ steht im Plural; neben Mose sind damit auch diejenigen angesprochen, die für die Arbeiten verantwortlich sind.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: Ganz so, wie … alles
  rationale: Die Formulierung gibt die enge Übereinstimmung mit dem Gezeigten wieder und klingt zugleich natürlich im Deutschen.
- source_word: מַרְאֶה
  choice: ich … zeige
  rationale: Das Partizip bezeichnet hier das gegenwärtige Zeigen in der Offenbarungssituation.
- source_word: תַּבְנִית
  choice: Muster
  rationale: „Muster“ lässt offen, ob eine Vorlage, ein Modell oder ein Plan gemeint ist, und legt die Beschaffenheit des Gezeigten nicht unnötig fest.
- source_word: הַמִּשְׁכָּן
  choice: der Wohnung
  rationale: „Wohnung“ bewahrt den sprachlichen Bezug von מִשְׁכָּן zum Wohnen und ist im Zusammenhang die heilige Wohnung Gottes; der Vers selbst verwendet hier nicht das gewöhnliche Wort für „Zelt“.
- source_word: כָּל כֵּלָיו
  choice: all ihrer Geräte
  rationale: „Geräte“ ist weit genug für die verschiedenen Einrichtungsgegenstände, Gefäße und Werkzeuge des Heiligtums.
- source_word: וְכֵן תַּעֲשׂוּ
  choice: sollt ihr es anfertigen
  rationale: „Anfertigen“ passt zum folgenden Herstellungsauftrag. Das ergänzte „es“ verweist natürlich auf die gesamte beschriebene Anlage; „ihr“ bildet die Pluralform des hebräischen Verbs ab.
theological_decisions:
- issue: Ob תַּבְנִית ausdrücklich als himmlisches Urbild zu verstehen ist
  choice: Muster
  alternative: Plan, Modell oder Entwurf
  rationale: Der Vers sagt, dass Gott Mose eine תַּבְנִית zeigt, bestimmt aber nicht ausdrücklich deren ontologischen Status. „Muster“ bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche kennzeichnen „das Muster …“ als nähere Erläuterung zu dem, was Gott Mose zeigt. „Wohnung“ erhält das Motiv der göttlichen Wohnstätte, ohne einen späteren theologischen Ausbau in den Vers einzutragen.
