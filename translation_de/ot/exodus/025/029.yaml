  yaml_path: translation/ot/exodus/025/029.yaml
  text: You shall make its plates and its dishes[a], and its pitchers and its bowls with which the drink offering is poured[b]; you shall make them of pure gold.
translation:
  language: de
  text: Du sollst seine Schalen und Schüsseln, seine Kannen und Becher anfertigen, mit denen das Trankopfer ausgegossen wird[a]. Aus reinem Gold sollst du sie anfertigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die genaue Bezeichnung und Funktion der beiden zuletzt genannten Gefäßarten ist unsicher. Möglich ist auch: »die Kannen und die Schalen, mit denen ausgegossen wird«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְּעָרֹתָיו
  choice: die zugehörigen Schalen
  rationale: קְעָרָה bezeichnet ein flaches Gefäß oder eine Schale. »Schalen« ist im Deutschen natürlich und hält den Gegenstand vom folgenden Gefäßbegriff unterscheidbar.
- source_word: כַפֹּתָיו
  choice: Schüsseln
  rationale: כַּף kann von der Bedeutung »Handfläche« auf ein entsprechend geformtes kleines Gefäß übertragen werden. »Schüsseln« gibt hier einen Gebrauchsgegenstand des Tischdienstes wieder, ohne eine nicht sicher belegte Spezialfunktion festzulegen.
- source_word: קְשׂוֹתָיו
  choice: Kannen
  rationale: Der seltene kultische Gefäßbegriff bezeichnet wahrscheinlich Behälter zum Aufbewahren oder Ausgießen von Flüssigkeit. »Kannen« ist eine verständliche, funktionsgerechte Wiedergabe.
- source_word: מְנַקִּיֹּתָיו
  choice: Becher
  rationale: Der Begriff bezeichnet ein Gefäß im Zusammenhang mit dem Ausgießen. »Becher« ist möglich, doch die genaue Form und die Verteilung der Funktionen zwischen den beiden letztgenannten Gefäßen bleiben unsicher.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: mit denen das Trankopfer ausgegossen wird
  rationale: Das passive Verb נסך bezeichnet im kultischen Zusammenhang das Ausgießen einer Libation. »Trankopfer« macht diesen im Verb enthaltenen Zusammenhang verständlich; der Pluralbezug auf die Gefäße bleibt erhalten.
- source_word: זָהָב טָהוֹר
  choice: reines Gold
  rationale: Dies ist die übliche und natürliche deutsche Wiedergabe der Materialangabe.
- source_word: וְעָשִׂיתָ ... תַּעֲשֶׂה אֹתָם
  choice: Du sollst ... anfertigen ... sollst du sie anfertigen
  rationale: Die Wiederholung des Verbs und die anweisende zweite Person Singular werden bewahrt; »anfertigen« klingt bei den aufgezählten Geräten idiomatisch.
