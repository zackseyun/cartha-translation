lexical_decisions:
- source_word: תְּכֵלֶת
  choice: blauen Stoff
  rationale: Der Ausdruck bezeichnet ein blau bis blauviolett gefärbtes Textilmaterial. „Blauer Stoff“ gibt Farbe und Material im Deutschen natürlich wieder, ohne die genaue Textilform festzulegen.
- source_word: אַרְגָּמָן
  choice: purpurfarbenen Stoff
  rationale: Das Wort bezeichnet kostbares purpurgefärbtes Textilmaterial. Die Wiedergabe ist verständlich und wahrt den Materialcharakter der Aufzählung.
- source_word: תוֹלַעַת שָׁנִי
  choice: karmesinrotes Garn
  rationale: Die Wendung bezieht sich auf ein kräftig rotes, mit Insektenfarbstoff gefärbtes Material. „Karmesinrotes Garn“ entspricht dem Textilkontext, statt die zugrunde liegende zoologische Bezeichnung wörtlich abzubilden.
- source_word: שֵׁשׁ
  choice: feines Leinen
  rationale: Im Heiligtumskontext bezeichnet das Wort hochwertiges Leinen; „feines Leinen“ ist präzise und idiomatisch.
- source_word: עִזִּים
  choice: Ziegenhaar
  rationale: Wörtlich steht „Ziegen“, doch in dieser Materialliste ist das von ihnen gewonnene Haar zum Weben gemeint.
