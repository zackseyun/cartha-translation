base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/021.yaml
  text: And you shall put the mercy seat on top of the ark[a], and into the ark you shall put the testimony that I will give you.
translation:
  language: de
  text: Du sollst die Sühneplatte[a] oben auf die Lade legen. In die Lade sollst du das Zeugnis legen, das ich dir geben werde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Deckplatte. Das hebräische Wort bezeichnet die Deckplatte der Lade und ist zugleich mit dem Sühneritus verbunden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֹּרֶת
  choice: Sühneplatte
  rationale: Der Ausdruck bezeichnet die Deckplatte der Lade und trägt zugleich kultische Sühnebedeutung. »Sühneplatte« gibt beide Aspekte im Deutschen knapper und verständlicher wieder als das traditionelle »Gnadenthron«.
- source_word: מִלְמָעְלָה
  choice: oben auf
  rationale: Im Zusammenhang bezeichnet das Wort die Lage der Sühneplatte unmittelbar auf der Lade, nicht lediglich einen Ort oberhalb von ihr.
- source_word: עֵדֻת
  choice: das Zeugnis
  rationale: Die formnahe Wiedergabe bewahrt den Gedanken eines bezeugenden Bundeszeichens, ohne hier ausdrücklich »Tafeln« zu ergänzen.
- source_word: נָתַתָּ / תִּתֵּן / אֶתֵּן
  choice: sollst ... legen / sollst ... legen / geben werde
  rationale: Bei den Gegenständen bezeichnet נתן das Anbringen beziehungsweise Hineinlegen; bei Gottes Übergabe des Zeugnisses ist »geben« die natürliche Entsprechung.
- source_word: אֶל הָאָרֹן
  choice: in die Lade
  rationale: Mit dem Verb des Legens und dem Zeugnis als Objekt bezeichnet אֶל hier das Hineinlegen in die Lade.
theological_decisions:
- issue: Wiedergabe von כַּפֹּרֶת als Bestandteil der Lade mit kultischer Sühnebedeutung
  choice: Sühneplatte
  alternative: Deckplatte; Gnadenthron
  rationale: »Sühneplatte« bezeichnet den konkreten Deckel der Lade und lässt zugleich seine Verbindung mit dem Sühneritus erkennen. »Deckplatte« wäre rein gegenständlich, während »Gnadenthron« stärker deutet und im heutigen Deutsch weniger unmittelbar verständlich ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anweisungsform »Du sollst« bildet die hebräischen Verbformen ab; »Zeugnis« bewahrt die im Vers vorhandene Offenheit des Gegenstands.
