  text: וְ/שִׁשָּׁ֣ה קָנִ֔ים יֹצְאִ֖ים מִ/צִּדֶּ֑י/הָ שְׁלֹשָׁ֣ה קְנֵ֣י מְנֹרָ֗ה מִ/צִּדָּ/הּ֙ הָ/אֶחָ֔ד וּ/שְׁלֹשָׁה֙ קְנֵ֣י מְנֹרָ֔ה מִ/צִּדָּ֖/הּ הַ/שֵּׁנִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/032.yaml
  text: 'And six branches shall come out from its sides: three branches of the lampstand from its one side[a], and three branches of the lampstand from its other side.'
translation:
  language: de
  text: 'Und sechs Arme sollen von seinen Seiten ausgehen: drei Arme des Leuchters von seiner einen Seite und drei Arme des Leuchters von seiner anderen Seite.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: Arme
  rationale: Im Zusammenhang mit dem Leuchter bezeichnet קָנֶה die seitlich ausgehenden tragenden Teile. „Arme“ ist im modernen Deutschen für einen Leuchter natürlich und sachlich eindeutig.
- source_word: יֹצְאִים
  choice: sollen … ausgehen
  rationale: Das Partizip beschreibt, dass die Arme aus den Seiten hervortreten; „sollen … ausgehen“ bewahrt im Kontext der Bauanweisung sowohl den beschreibenden als auch den anweisenden Charakter.
- source_word: מִצִּדֶּיהָ
  choice: von seinen Seiten
  rationale: Die Pluralform mit femininem Suffix bezieht sich auf מְנֹרָה; das grammatische Geschlecht wird im Deutschen entsprechend „Leuchter“ maskulin wiedergegeben.
- source_word: מְנֹרָה
  choice: Leuchter
  rationale: „Leuchter“ übersetzt den Gegenstand als gewöhnliches Substantiv und ist in diesem kultischen Zusammenhang klarer als eine bloße Transliteration.
- source_word: הָאֶחָד … הַשֵּׁנִי
  choice: seiner einen Seite … seiner anderen Seite
  rationale: Der hebräische Gegensatz lautet wörtlich „der einen … der zweiten“. Bei genau zwei Seiten gibt „die eine … die andere“ diesen Gegensatz im Deutschen natürlich und präzise wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederholung „drei Arme des Leuchters“ folgt der ausdrücklichen Wiederholung im Hebräischen; auf eine Fußnote wurde verzichtet, da der hebräische Seitengegensatz keine sachliche Mehrdeutigkeit erzeugt.
