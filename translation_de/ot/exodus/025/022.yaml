base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/022.yaml
  text: And there I will meet with you[a], and I will speak with you from above the mercy seat, from between the two cherubim that are over the ark of the testimony[b], about all that I will command you for the sons of Israel.
translation:
  language: de
  text: Dort werde ich dir begegnen und mit dir reden, von oberhalb der Sühneplatte[a], zwischen den beiden Kerubim, die über der Lade des Zeugnisses sind, über alles, was ich dir für die Israeliten[b] gebieten werde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Deckplatte“; traditionell auch „Gnadenthron“. Gemeint ist die goldene Platte auf der Lade.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „für die Söhne Israels“; möglich ist auch: „an die Israeliten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹעַדְתִּי לְךָ שָׁם
  choice: Dort werde ich dir begegnen
  rationale: Das Niphal von יעד bezeichnet hier eine verabredete Begegnung. „Dir begegnen“ ist im Deutschen natürlich und bewahrt den persönlichen Charakter der Aussage.
- source_word: וְדִבַּרְתִּי אִתְּךָ
  choice: und mit dir reden
  rationale: אִתְּךָ stützt die relationale Wiedergabe „mit dir“ statt lediglich „zu dir“.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: von oberhalb der Sühneplatte
  rationale: מֵעַל bezeichnet den räumlichen Ausgangspunkt der Rede. כַּפֹּרֶת ist die goldene Deckplatte der Lade mit kultischer Sühnefunktion; „Sühneplatte“ verbindet Gegenstand und Funktion.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: zwischen den beiden Kerubim
  rationale: Die deutsche Präposition „zwischen“ genügt nach dem vorangestellten „von oberhalb“, um den Ausgangsort der Rede natürlich und räumlich präzise zu bezeichnen.
- source_word: אֲשֶׁר עַל אֲרֹן הָעֵדֻת
  choice: die über der Lade des Zeugnisses stehen
  rationale: „Über“ gibt die Lage der Kerubim wieder; das ergänzte „stehen“ macht den Relativsatz im Deutschen vollständig, ohne die Aussage sachlich auszubauen. „Lade des Zeugnisses“ wahrt die formale Bezeichnung.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּה אוֹתְךָ
  choice: über alles reden, was ich dir … gebieten werde
  rationale: Die Wiederaufnahme von „reden“ mit „über“ macht die syntaktische Beziehung im Deutschen klar und bewahrt die Gesamtheit der angekündigten Gebote.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: für die Israeliten
  rationale: אֶל ist hier an die an Mose gerichteten Gebote angeschlossen; „für die Israeliten“ gibt deren Adressaten bzw. Bestimmung idiomatisch wieder. Eine Fußnote bewahrt die formalere Alternative.
theological_decisions:
- issue: Wiedergabe von הַכַּפֹּרֶת
  choice: Sühneplatte
  alternative: Deckplatte; Gnadenthron
  rationale: Der Ausdruck bezeichnet die goldene Platte auf der Lade und ist zugleich kultisch mit Sühne verbunden. „Sühneplatte“ wahrt beides, während „Deckplatte“ die Funktion abflacht und „Gnadenthron“ stärker deutet, als der hebräische Gegenstandsbegriff verlangt.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Der hebräische Ausdruck ist eine nationale Sammelbezeichnung. „Israeliten“ ist im modernen Deutschen natürlich und umfasst hier das ganze Volk; die wörtliche familiale Form bleibt in der Fußnote sichtbar.
- issue: Bezeichnung הָעֵדֻת
  choice: Zeugnis
  alternative: Bundeszeugnis; Bundestafeln
  rationale: „Zeugnis“ bewahrt die begriffliche Offenheit des Hebräischen. Präzisierungen auf den Bund oder die Tafeln wären kontextuell möglich, stehen aber nicht ausdrücklich im Vers.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung entlastet die lange hebräische Konstruktion, ohne ihre inhaltlichen Beziehungen aufzulösen. Kultische Fachbegriffe werden beibehalten, aber durch Fußnoten verständlich gemacht.
