translation:
  language: de
  text: Öl für die Beleuchtung[a], Duftgewürze für das Salböl und für das Räucherwerk aus Duftstoffen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für das Licht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶן
  choice: Öl
  rationale: Das hebräische Substantiv bezeichnet allgemein Öl. Obwohl im Heiligtumskontext Olivenöl gemeint sein dürfte, wird die im Ausgangstext nicht ausdrücklich genannte Ölsorte nicht ergänzt.
- source_word: לַמָּאֹר
  choice: für die Beleuchtung
  rationale: מָאוֹר kann das Licht, einen Lichtträger oder die Beleuchtung bezeichnen. Die Zweckangabe „für die Beleuchtung“ ist im Deutschen natürlich und passt zum Öl für den Leuchter, ohne „Lampe“ ausdrücklich in den Text einzutragen.
- source_word: בְּשָׂמִים
  choice: Duftgewürze
  rationale: Gemeint sind wohlriechende aromatische Stoffe zur Herstellung des heiligen Salböls. „Duftgewürze“ ist verständlich, konkret und weniger altertümlich als „Spezereien“.
- source_word: לְשֶׁמֶן הַמִּשְׁחָה
  choice: für das Salböl
  rationale: Die knappe deutsche Zusammensetzung gibt die bestimmte hebräische Wendung für das zur Salbung bestimmte Öl präzise und idiomatisch wieder.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: Im Zusammenhang mit dem Heiligtum bezeichnet das Wort eine zum Räuchern bestimmte Mischung. „Räucherwerk“ ist im Deutschen sachlich präziser als das mehrdeutige „Weihrauch“, das auch einen einzelnen Stoff bezeichnen kann.
- source_word: הַסַּמִּים
  choice: aus Duftstoffen
  rationale: Die hebräische Genitivverbindung lautet wörtlich etwa „Räucherwerk der Duftstoffe“. „Aus Duftstoffen“ macht im Deutschen verständlich, dass das Räucherwerk aus aromatischen Substanzen bereitet wird, ohne eine bestimmte Zutat hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Inventarform des Versfragments und das abschließende Komma bleiben erhalten. „Duftgewürze“ und „Duftstoffe“ bilden die zwei verschiedenen hebräischen Ausdrücke ab, ohne den zweiten idiomatisch zu einem bloßen Adjektiv einzuebnen.
