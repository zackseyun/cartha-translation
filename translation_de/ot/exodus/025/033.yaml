  text: שְׁלֹשָׁ֣ה גְ֠בִעִים מְֽשֻׁקָּדִ֞ים בַּ/קָּנֶ֣ה הָ/אֶחָד֮ כַּפְתֹּ֣ר וָ/פֶרַח֒ וּ/שְׁלֹשָׁ֣ה גְבִעִ֗ים מְשֻׁקָּדִ֛ים בַּ/קָּנֶ֥ה הָ/אֶחָ֖ד כַּפְתֹּ֣ר וָ/פָ֑רַח כֵּ֚ן לְ/שֵׁ֣שֶׁת הַ/קָּנִ֔ים הַ/יֹּצְאִ֖ים מִן הַ/מְּנֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/033.yaml
  text: three almond-blossom-shaped cups on the one branch[a], with bulb and flower, and three almond-blossom-shaped cups on the one branch, with bulb and flower[c][b]; so it shall be for the six branches coming out from the lampstand.
translation:
  language: de
  text: Drei mandelblütenförmige Kelche[a] an dem einen Arm, mit Knauf[b] und Blüte, und drei mandelblütenförmige Kelche an dem einen Arm, mit Knauf und Blüte; so soll es an den sechs Armen sein, die vom Leuchter[c] ausgehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »drei Kelche, wie Mandelblüten gearbeitet«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet einen rundlichen Zierkörper; auch »Knoten« oder »Wulst« ist möglich.
    reason: lexical_alternative
  - marker: c
    text: Hebräisch מְנֹרָה (menora); hier als »Leuchter« wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: Kelche
  rationale: Das Wort bezeichnet becher- oder schalenartige Formen. »Kelche« gibt die Zierformen des Leuchters prägnant wieder und passt zum pflanzlichen Gesamtbild.
- source_word: מְשֻׁקָּדִים
  choice: mandelblütenförmig
  rationale: Die vom Wort für »Mandel« abgeleitete Form beschreibt hier die dekorative Gestaltung der Kelche. »Mandelblütenförmig« macht den floralen Zusammenhang mit Knauf und Blüte verständlich.
- source_word: קָנֶה
  choice: Arm
  rationale: Im Zusammenhang des Leuchters bezeichnet das Wort einen seitlich ausgehenden Schaft. »Arm« ist im modernen Deutschen die natürliche Sachbezeichnung; die Grundbedeutung »Rohr« wäre hier missverständlich.
- source_word: כַּפְתֹּר
  choice: Knauf
  rationale: Gemeint ist ein rundlicher Zierkörper am Leuchter. »Knauf« wahrt den gegenständlichen Charakter, ohne die genaue botanische Form stärker festzulegen, als es der hebräische Ausdruck erlaubt.
- source_word: פֶרַח / פָרַח
  choice: Blüte
  rationale: Das Substantiv bezeichnet eine Blüte oder Blume. »Blüte« passt zur mandelartigen Verzierung und vermeidet die unnatürliche Verbindung »Blume am Arm«.
- source_word: כֵּן
  choice: so soll es ... sein
  rationale: Die Wendung fasst die zuvor beschriebene Gestaltung als Muster für alle sechs Arme zusammen und gibt die regelnde Aussage im Deutschen ausdrücklich wieder.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: an den sechs Armen
  rationale: Die Präposition bezeichnet hier die Anwendung beziehungsweise Ausführung des Musters an allen sechs Armen.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: die vom Leuchter ausgehen
  rationale: Die Formulierung gibt das Partizip und die Herkunftsangabe natürlich und zugleich eng am Hebräischen wieder.
- source_word: מְנֹרָה
  choice: Leuchter
  rationale: Das hebräische Wort ist hier eine Sachbezeichnung für den kultischen Lampenständer. »Leuchter« ist die etablierte und verständliche deutsche Wiedergabe.
theological_decisions:
- issue: Die zweimalige Formulierung בַּקָּנֶה הָאֶחָד
  choice: an dem einen Arm ... an dem einen Arm
  alternative: an dem einen Arm ... an dem anderen Arm
  rationale: Der überlieferte hebräische Text wiederholt wörtlich »an dem einen Arm«. Die Übersetzung bewahrt diese auffällige Wiederholung, statt sie aufgrund des vermuteten paarweisen Bauplans stillschweigend in »dem anderen Arm« zu ändern.
translation_notes:
  register: Moderne, sachlich-gehobene Standardsprache. Die knappe, aufzählende Bauanweisung des Hebräischen bleibt erhalten. Die ungewöhnliche Wiederholung »an dem einen Arm« wird aus texttreuer Zurückhaltung nicht geglättet.
