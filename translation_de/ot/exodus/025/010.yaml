  text: וְ/עָשׂ֥וּ אֲר֖וֹן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/010.yaml
  text: They shall make an ark of acacia wood[a], two and a half cubits its length, a cubit and a half its width[c][b], and a cubit and a half its height.
translation:
  language: de
  text: 'Sie sollen eine Lade[a] aus Akazienholz[b] machen: zweieinhalb Ellen[c] lang, eineinhalb Ellen breit und eineinhalb Ellen hoch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Truhe“ oder „Kasten“. Das hebräische Wort bezeichnet einen Behälter; in diesem Zusammenhang ist „Lade“ die traditionelle Bezeichnung.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „Schittimholz“, gewöhnlich als Akazienholz verstanden.'
    reason: lexical_alternative
  - marker: c
    text: Die Elle war ein antikes Längenmaß, ungefähr die Strecke vom Ellenbogen bis zu den Fingerspitzen.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Sie sollen … machen
  rationale: Die Verbform steht im Zusammenhang göttlicher Anweisungen und wird im Deutschen natürlich als verpflichtende Aufforderung wiedergegeben. Das einleitende וְ wird nicht eigens mit „und“ übersetzt, da der Satzanschluss auch ohne dieses Wort klar bleibt.
- source_word: אֲרוֹן
  choice: Lade
  rationale: Das Wort bezeichnet einen tragbaren Behälter, eine Truhe oder einen Kasten. „Lade“ ist in diesem sakralen Zusammenhang die etablierte deutsche Bezeichnung, ohne „Bundes-“ in den Quelltext einzutragen.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: Die Konstruktverbindung bezeichnet das Material. „Akazienholz“ ist die geläufige moderne Wiedergabe; „Schittimholz“ wäre eine weniger verständliche traditionelle Lautübertragung.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: zweieinhalb Ellen
  rationale: Die antike Maßeinheit bleibt erhalten; die deutsche Zahlenform gibt die hebräische Maßangabe klar und knapp wieder.
- source_word: אָרְכּוֹ … רָחְבּוֹ … קֹמָתוֹ
  choice: lang … breit … hoch
  rationale: Die adjektivische Maßkonstruktion ist im modernen Deutschen natürlicher als die wörtlichere Folge „ihre Länge … ihre Breite … ihre Höhe“, bewahrt aber alle drei Dimensionen genau.
- source_word: וְאַמָּה וָחֵצִי
  choice: eineinhalb Ellen
  rationale: Die idiomatische deutsche Form entspricht der hebräischen Angabe „eine Elle und eine halbe“.
theological_decisions:
- issue: Bezeichnung des heiligen Behälters
  choice: Lade
  alternative: Bundeslade
  rationale: „Lade“ wahrt die lexikalische Aussage dieses Verses. „Bundeslade“ wäre kontextuell verständlich, würde hier aber eine nähere Bestimmung ergänzen, die im hebräischen Wortlaut nicht steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Bauanweisung wird durch einen Doppelpunkt und idiomatische Maßangaben verständlich gegliedert; die antike Maßeinheit bleibt unverändert erhalten.
