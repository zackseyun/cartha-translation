  text: וְ/עָשִׂ֥יתָ שֻׁלְחָ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֤יִם אָרְכּ/וֹ֙ וְ/אַמָּ֣ה רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/023.yaml
  text: You shall make a table of acacia wood[a], two cubits its length, one cubit its width, and a cubit and a half its height.
translation:
  language: de
  text: '[a] Du sollst einen Tisch aus Akazienholz anfertigen: zwei Ellen lang, eine Elle breit und eineinhalb Ellen hoch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und du sollst einen Tisch … anfertigen.“ Das hebräische Bindewort verbindet diese Anweisung mit den vorausgehenden Anordnungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst … anfertigen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ steht in einer Folge göttlicher Anweisungen und hat hier verpflichtende Aufforderungskraft. „Du sollst … anfertigen“ ist im Deutschen natürlich und bewahrt den direktiven Charakter.
- source_word: שֻׁלְחָן
  choice: einen Tisch
  rationale: „Tisch“ ist die sachlich passende Bezeichnung für diesen kultischen Einrichtungsgegenstand; der unbestimmte Artikel ist bei seiner Einführung im Deutschen idiomatisch.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: Die hebräische Konstruktverbindung bezeichnet Holz der Akazie. „Akazienholz“ ist die etablierte, klare deutsche Wiedergabe.
- source_word: אַמָּתַיִם אָרְכּוֹ
  choice: zwei Ellen lang
  rationale: Die adjektivische deutsche Maßformel ist natürlicher als „seine Länge zwei Ellen“ und gibt den Inhalt genau wieder. Die antike Maßeinheit bleibt erhalten.
- source_word: וְאַמָּה רָחְבּוֹ
  choice: eine Elle breit
  rationale: Die knappe deutsche Maßangabe entspricht dem hebräischen Nominalsatz und steht parallel zu Länge und Höhe.
- source_word: וְאַמָּה וָחֵצִי קֹמָתוֹ
  choice: und eineinhalb Ellen hoch
  rationale: „Eineinhalb Ellen“ gibt wörtlich „eine Elle und eine halbe“ idiomatisch wieder; „hoch“ ist bei den Abmessungen eines Tisches die natürliche Entsprechung von קֹמָה.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Maßangaben sind als geläufige deutsche Dimensionsformel gestaltet; „Elle“ bleibt als historische Maßeinheit unkonvertiert. Der Fußnotenmarker steht am Satzanfang, weil die Alternative das einleitende hebräische Bindewort betrifft.
