  text: And let them make a sanctuary for me[a], so that I may dwell among them.
translation:
  language: de
  text: Sie sollen mir ein Heiligtum bauen, und ich werde mitten unter ihnen wohnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Sie sollen bauen
  rationale: Das Qal-Perfekt mit וְ hat im vorliegenden Anweisungskontext auffordernde Kraft. „Sie sollen … bauen“ gibt die dritte Person Plural im modernen Deutschen klar wieder.
- source_word: לִי
  choice: mir
  rationale: Die Präposition לְ mit Suffix bezeichnet hier Bestimmung bzw. Nutznießer. Das deutsche „mir“ ist idiomatisch und entspricht „für mich“.
- source_word: מִקְדָּשׁ
  choice: Heiligtum
  rationale: מִקְדָּשׁ bezeichnet einen ausgesonderten heiligen Ort. „Heiligtum“ ist im Deutschen geläufig, würdig und passt zum Zusammenhang des später beschriebenen Zeltheiligtums.
- source_word: וְשָׁכַנְתִּי
  choice: damit ich … wohne
  rationale: שׁכן bedeutet „wohnen, sich niederlassen“. „Damit“ stellt den im Zusammenhang naheliegenden Zweckbezug zur Errichtung des Heiligtums her, ohne die Aussage über Gottes Gegenwart abzuschwächen.
- source_word: בְּתוֹכָם
  choice: mitten unter ihnen
  rationale: Die Wendung bedeutet wörtlich „in ihrer Mitte“. „Mitten unter ihnen“ bewahrt den pluralischen Bezug auf das Volk und klingt zugleich natürlich.
theological_decisions:
- issue: Bezug von Gottes Wohnen
  choice: mitten unter ihnen
  alternative: darin / in dem Heiligtum
  rationale: Das hebräische Suffix ist pluralisch und bezieht sich auf die Menschen. Der Text lokalisiert Gottes Gegenwart daher nicht lediglich im Bauwerk, sondern sagt sein Wohnen inmitten des Volkes aus.
- issue: Verhältnis der beiden Teilsätze
  choice: damit
  alternative: und ich werde
  rationale: Der Zusammenhang legt einen Zweck- bzw. Folgebezug nahe. Da וְשָׁכַנְתִּי formal auch koordinierend als „und ich werde wohnen“ verstanden werden kann, wird diese Möglichkeit in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Heiligtum“ wahrt den kultischen Sinn; „mitten unter ihnen“ macht den pluralischen Bezug des hebräischen Textes klar. Die Satzstellung bleibt einfach und gut vorlesbar.
