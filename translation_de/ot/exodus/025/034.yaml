translation:
  language: de
  text: Am Leuchter sollen vier wie Mandelblüten gestaltete Kelche sein, mit seinen Knäufen[a] und Blüten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Knospen“. Das hebräische Wort bezeichnet ein rundliches Zierelement am Leuchter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: Am Leuchter
  rationale: Die Präposition ב wird im Zusammenhang mit den Zierteilen natürlich mit „an“ wiedergegeben; מְנֹרָה bezeichnet den Leuchter als Ganzes.
- source_word: אַרְבָּעָה גְבִעִים
  choice: vier … Kelche
  rationale: גְבִיעִים bezeichnet becher- oder kelchförmige Elemente. „Kelche“ passt zum würdevollen Register und zur kunsthandwerklichen Beschreibung.
- source_word: מְשֻׁקָּדִים
  choice: mandelblütenförmige
  rationale: Die vom Wort für Mandel abgeleitete Form beschreibt eine Gestaltung nach dem Mandelmotiv. „Mandelblütenförmig“ gibt die wahrscheinliche Form wieder, ohne zusätzliche Herstellungstechnik anzunehmen.
- source_word: כַּפְתֹּרֶיהָ
  choice: mit seinen Knäufen
  rationale: כַּפְתֹּר bezeichnet hier ein rundliches Zierelement. „Knäufe“ ist im Deutschen eine präzise Bezeichnung und vermeidet die stärkere botanische Festlegung auf „Knospen“.
- source_word: וּפְרָחֶיהָ
  choice: und Blüten
  rationale: פֶּרַח bezeichnet Blüten oder Blumen; „Blüten“ fügt sich natürlich in das Mandelmotiv ein.
