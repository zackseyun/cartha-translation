base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/036.yaml
  text: Their buds and their branches shall be of one piece with it[b][a], all of it a single hammered work of pure gold.
translation:
  language: de
  text: Ihre Knospen und ihre Arme sollen aus ihm selbst gearbeitet sein[a]; der ganze Leuchter soll aus einem einzigen Stück reinen Goldes getrieben sein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „aus ihm sein“: Knospen und Arme sollen aus dem Leuchter selbst gearbeitet und nicht als getrennte Teile angesetzt werden.'
    reason: lexical_alternative
  - marker: b
    text: Oder „eine einzige gehämmerte Arbeit“. Das Hebräische betont, dass der ganze Leuchter aus einem zusammenhängenden Stück reinen Goldes gefertigt wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: ihre Knospen
  rationale: כַּפְתּוֹר bezeichnet hier ein rundes Zierelement. „Knospen“ bewahrt im Zusammenhang mit den Armen des Leuchters die pflanzliche Bildsprache und ist verständlicher als „Knäufe“.
- source_word: וּקְנֹתָם
  choice: und ihre Arme
  rationale: קָנֶה bedeutet wörtlich „Rohr“ oder „Stängel“, bezeichnet beim Leuchter aber dessen seitliche Arme. „Arme“ ist die geläufige und sachlich klare deutsche Bezeichnung.
- source_word: מִמֶּנָּה
  choice: aus ihm hervorgehen
  rationale: Die Präposition drückt aus, dass Knospen und Arme aus dem Leuchter selbst gearbeitet und nicht nachträglich angesetzt werden. Das grammatische Geschlecht richtet sich im Deutschen nach „Leuchter“.
- source_word: יִהְיוּ
  choice: sollen … hervorgehen
  rationale: Der Imperfekt hat innerhalb der Bauanweisung vorschreibende Kraft; „sollen“ gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: כֻּלָּהּ
  choice: der ganze Leuchter
  rationale: Das Suffix bezieht sich auf den Leuchter und betont das vollständige Werkstück. Die ausdrückliche Wiederaufnahme vermeidet im Deutschen einen unklaren Bezug.
- source_word: מִקְשָׁה אַחַת
  choice: aus einem einzigen Stück … getrieben
  rationale: מִקְשָׁה bezeichnet durch Hämmern beziehungsweise Treiben gefertigte Metallarbeit; אַחַת hebt die Einheit des gesamten Werkstücks hervor. Die Formulierung macht beides verständlich.
- source_word: זָהָב טָהוֹר
  choice: reinen Goldes
  rationale: „Reines Gold“ ist die natürliche deutsche Wiedergabe dieser festen Wortverbindung; der Genitiv fügt sich in die Konstruktion „aus einem Stück“ ein.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Getrieben“ verwendet den geläufigen Fachausdruck für durch Hämmern geformte Metallarbeit; die Fußnote erläutert ihn. Die pflanzliche Bildsprache wird mit „Knospen“ und zugleich die übliche Bezeichnung der Leuchterteile mit „Arme“ bewahrt.
