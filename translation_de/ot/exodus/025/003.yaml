  text: וְ/זֹאת֙ הַ/תְּרוּמָ֔ה אֲשֶׁ֥ר תִּקְח֖וּ מֵ/אִתָּ֑/ם זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/003.yaml
  text: 'And this is the contribution that you shall take from them: gold[a], silver, and bronze.'
translation:
  language: de
  text: 'Und das ist der Beitrag, den ihr von ihnen nehmen sollt: Gold, Silber und Bronze[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kupfer“; das hebräische Wort נְחֹשֶׁת kann je nach Zusammenhang Kupfer oder Bronze bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: Und dies ist
  rationale: Die Verbindung aus ו und dem Demonstrativpronomen זאת leitet die folgende Aufzählung ein. „Und dies ist“ bewahrt diese präsentierende Funktion in würdigem, verständlichem Deutsch.
- source_word: הַ/תְּרוּמָה
  choice: die Abgabe
  rationale: תְּרוּמָה bezeichnet hier eine für einen heiligen Zweck ausgesonderte materielle Zuwendung. „Abgabe“ passt zur Sammlung der Heiligtumsmaterialien, ohne eine bestimmte Opferhandlung vorauszusetzen.
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen leitet den attributiven Satz ein; im Deutschen richtet es sich nach dem femininen Bezugswort „Abgabe“.
- source_word: תִּקְחוּ
  choice: ihr ... nehmen sollt
  rationale: Der Qal-Imperfekt 2. Person Plural von לקח hat hier anweisenden Charakter. Die Konstruktion mit „sollt“ gibt diesen direktivischen Sinn natürlich wieder und bleibt beim Grundverb „nehmen“.
- source_word: מֵ/אִתָּם
  choice: von ihnen
  rationale: Die Präposition mit dem pronominalen Suffix bezeichnet schlicht die Herkunft der Abgabe von den im Zusammenhang genannten Israeliten.
- source_word: זָהָב
  choice: Gold
  rationale: Die übliche und kontextuell eindeutige Bezeichnung des Materials.
- source_word: וָ/כֶסֶף
  choice: Silber
  rationale: Die übliche Bezeichnung des zweiten in der Liste genannten Metalls.
- source_word: וּ/נְחֹשֶׁת
  choice: Bronze
  rationale: נְחֹשֶׁת kann Kupfer oder eine Kupferlegierung bezeichnen. Bei den für das Heiligtum bestimmten verarbeiteten Metallen ist „Bronze“ die herkömmliche und wahrscheinliche Wiedergabe; die lexikalische Alternative wird in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, standardsprachliches und würdevolles Deutsch. Die Satzstruktur bleibt nahe am Hebräischen, ohne unnatürlich zu wirken. „Abgabe“ betont die materielle Zuwendung für einen heiligen Zweck; die Mehrdeutigkeit der Metallbezeichnung wird durch die Fußnote bewahrt.
