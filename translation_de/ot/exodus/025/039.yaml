  text: כִּכָּ֛ר זָהָ֥ב טָה֖וֹר יַעֲשֶׂ֣ה אֹתָ֑/הּ אֵ֥ת כָּל הַ/כֵּלִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/039.yaml
  text: He shall make it[a], with all these utensils, from a talent of pure gold.
translation:
  language: de
  text: Aus einem Talent reinen Goldes soll man ihn samt all diesen Geräten herstellen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּכָּר
  choice: ein Talent
  rationale: כִּכָּר bezeichnet hier ein festes Gewichtsmaß. Der traditionelle metrologische Fachbegriff „Talent“ ist genauer als eine unspezifische Mengenangabe.
- source_word: זָהָב טָהוֹר
  choice: reines Gold
  rationale: Die Wortverbindung bezeichnet Gold von reiner Qualität; „reines Gold“ ist im Deutschen die natürliche Formulierung für den Werkstoff.
- source_word: יַעֲשֶׂה
  choice: soll man … herstellen
  rationale: Das Qal-Imperfekt 3. Person Singular hat hier vorschreibenden Sinn und ein nicht ausdrücklich genanntes menschliches Subjekt. Das unpersönliche „man“ gibt dies im modernen Deutschen natürlicher wieder als ein unbegründet konkretes „er“.
- source_word: אֹתָהּ
  choice: ihn
  rationale: Das feminine Objektsuffix verweist auf die zuvor beschriebene מְנוֹרָה. Da „Leuchter“ im Deutschen maskulin ist, entspricht „ihn“ dem grammatischen Rückbezug, ohne das Bezugswort erneut auszuschreiben.
- source_word: אֵת כָּל הַכֵּלִים הָאֵלֶּה
  choice: samt all diesen Geräten
  rationale: כֵּלִים ist ein weiter Begriff für Geräte, Werkzeuge, Gegenstände oder Gefäße. „Geräte“ passt zu den Zubehörteilen des Leuchters und bewahrt die begriffliche Weite; „samt“ macht deutlich, dass Leuchter und Zubehör gemeinsam aus der genannten Goldmenge gefertigt werden.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Vorschriftensprache. Die Satzstellung hebt entsprechend dem Hebräischen die gesamte verwendete Goldmenge hervor; „herstellen“ passt zum handwerklichen Kontext.
