base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/031.yaml
  text: And you shall make a lampstand of pure gold[a]. The lampstand shall be made of hammered work; its base and its shaft, its cups, its buds[b], and its flowers shall be of one piece with it.
translation:
  language: de
  text: Du sollst einen Leuchter aus reinem Gold machen. In Treibarbeit soll der Leuchter gefertigt werden. Sein Fuß und sein Schaft, seine Kelche, seine Knäufe[a] und seine Blüten sollen aus einem Stück mit ihm gearbeitet sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Knospen“. Das hebräische Wort bezeichnet rundliche, knaufartige Zierelemente innerhalb des Pflanzenmusters.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Die genannten Teile sollen nicht getrennt angesetzt, sondern zusammen mit dem Leuchter aus demselben Werkstück geformt werden.'
    reason: construction_clarification
lexical_decisions:
- source_word: מְנֹרַת
  choice: Leuchter
  rationale: Das Wort bezeichnet hier das Gestell, das die Lampen trägt. „Leuchter“ ist im Deutschen die geläufige und sachlich passende Bezeichnung.
- source_word: זָהָב טָהוֹר
  choice: reines Gold
  rationale: Natürliche deutsche Wiedergabe für geläutertes beziehungsweise unvermischtes Gold.
- source_word: מִקְשָׁה
  choice: in Treibarbeit
  rationale: Der Ausdruck bezeichnet eine durch Hämmern geformte Metallarbeit; „Treibarbeit“ ist der präzise deutsche Fachausdruck, ohne die wahrscheinliche Fertigung aus einem zusammenhängenden Werkstück im Haupttext übermäßig festzulegen.
- source_word: תֵּעָשֶׂה
  choice: soll … gefertigt werden
  rationale: Die passive Form steht in einem Anweisungskontext und wird im Deutschen natürlich mit „soll … gefertigt werden“ wiedergegeben.
- source_word: יְרֵכָהּ
  choice: sein Fuß
  rationale: Wörtlich bezeichnet das Wort Hüfte oder Seite; bei einem Gerät ist der untere tragende Teil gemeint. „Fuß“ ist im Deutschen anschaulich und idiomatisch.
- source_word: וְקָנָהּ
  choice: sein Schaft
  rationale: Der Singular bezeichnet hier den mittleren Stamm des Leuchters; „Schaft“ unterscheidet ihn angemessen von den später genannten Seitenarmen.
- source_word: גְּבִיעֶיהָ
  choice: seine Kelche
  rationale: Gemeint sind kelch- oder becherförmige Zierelemente. „Kelche“ bewahrt zugleich die pflanzliche Bildsprache.
- source_word: כַּפְתֹּרֶיהָ
  choice: seine Knäufe
  rationale: Das Wort bezeichnet rundliche, knaufartige Zierelemente. „Knospen“ wäre wegen des floralen Musters ebenfalls möglich, legt die Form jedoch stärker aus.
- source_word: וּפְרָחֶיהָ
  choice: seine Blüten
  rationale: „Blüten“ gibt die ausdrücklich florale Ornamentik präzise und natürlich wieder.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: sollen aus ihm herausgearbeitet sein
  rationale: Die Teile sollen aus dem Leuchter selbst hervorgehen und nicht als gesonderte Stücke angesetzt werden. Die Formulierung bildet diesen Konstruktionsgedanken ab, ohne mehr zu behaupten als der Zusammenhang hergibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Sachbezeichnung „Leuchter“ bleibt erhalten; „Treibarbeit“ vermittelt das Herstellungsverfahren präzise. Die Wiederholung von „Leuchter“ folgt der betonten hebräischen Formulierung.
