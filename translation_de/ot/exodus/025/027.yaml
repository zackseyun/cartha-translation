  text: The rings shall be opposite the frame[b][a], as holders for the poles to carry the table.
translation:
  language: de
  text: Die Ringe sollen der Einfassung[a] gegenüber angebracht sein und als Aufnahmen[b] für die Tragstangen dienen, um den Tisch zu tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „neben der Einfassung“ beziehungsweise „entsprechend der Einfassung“. Das Hebräische bezeichnet die relative Lage, ohne die genaue räumliche Anordnung eindeutig festzulegen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zu Häusern für die Stangen“, das heißt als Aufnahmen oder Halterungen, in welche die Stangen eingeführt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֻמַּת
  choice: gegenüber
  rationale: Die Verbindung bezeichnet eine relative räumliche Lage zur Einfassung. „Gegenüber“ gibt den wahrscheinlichsten Sinn wieder, ohne die genaue Anordnung festzulegen.
- source_word: הַמִּסְגֶּרֶת
  choice: die Einfassung
  rationale: מִסְגֶּרֶת bezeichnet hier das den Tisch umgebende Bauteil; „Einfassung“ ist im Deutschen anschaulich und lässt offen, ob eher Rahmen, Rand oder Leiste gemeint ist.
- source_word: תִּהְיֶיןָ
  choice: sollen sich … befinden und … dienen
  rationale: Die feminine Pluralform von היה beschreibt in der Bauanweisung die vorgeschriebene Lage beziehungsweise Funktion der Ringe.
- source_word: הַטַּבָּעֹת
  choice: die Ringe
  rationale: Übliche und sachlich passende Wiedergabe der Metallringe an den Heiligtumsgeräten.
- source_word: לְבָתִּים
  choice: als Halterungen
  rationale: Wörtlich steht „zu Häusern“; funktional sind Aufnahmen beziehungsweise Halterungen gemeint, in welche die Stangen eingeführt werden.
- source_word: לְבַדִּים
  choice: für die Tragstangen
  rationale: בַּדִּים bezeichnet in diesem Zusammenhang die Stangen zum Tragen des Tisches. „Tragstangen“ macht ihre Funktion unmittelbar deutlich.
- source_word: לָשֵׂאת
  choice: mit denen man … trägt
  rationale: Der Infinitiv von נשׂא drückt den Zweck der Stangen aus; die deutsche Relativkonstruktion ist natürlich und eindeutig.
- source_word: הַשֻּׁלְחָן
  choice: den Tisch
  rationale: Direkte und etablierte Bezeichnung des hier beschriebenen Einrichtungsgegenstands.
