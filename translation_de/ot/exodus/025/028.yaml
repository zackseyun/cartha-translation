  text: וְ/עָשִׂ֤יתָ אֶת הַ/בַּדִּים֙ עֲצֵ֣י שִׁטִּ֔ים וְ/צִפִּיתָ֥ אֹתָ֖/ם זָהָ֑ב וְ/נִשָּׂא בָ֖/ם אֶת הַ/שֻּׁלְחָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/028.yaml
  text: You shall make the poles of acacia wood and overlay them with gold[a], and by them the table shall be carried.
translation:
  language: de
  text: Fertige die Tragstangen aus Akazienholz an und überzieh sie mit Gold. Mit ihnen soll der Tisch getragen werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Fertige … an
  rationale: Das Qal-Perfekt mit וְ hat in diesem Anweisungskontext auffordernde Bedeutung. Der deutsche Imperativ gibt die fortlaufende Bauanweisung natürlich und präzise wieder.
- source_word: הַבַּדִּים
  choice: die Tragstangen
  rationale: בַּדִּים bezeichnet hier die Stangen zum Tragen des heiligen Einrichtungsgegenstands. „Tragstangen“ ist im modernen Deutsch eindeutiger als das allgemeinere „Stangen“.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: Die Konstruktverbindung bezeichnet Holz der Akazie. „Akazienholz“ ist die geläufige und verständliche deutsche Sachbezeichnung.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: und überzieh sie mit Gold
  rationale: צפה bezeichnet im handwerklichen Zusammenhang das Überziehen beziehungsweise Verkleiden mit einem Material. „Mit Gold überziehen“ ist präzise und idiomatisch.
- source_word: וְנִשָּׂא בָם
  choice: Mit ihnen soll … getragen werden
  rationale: Das Nifal von נשׂא ist passiv („getragen werden“); בָם kennzeichnet die Tragstangen als Mittel. „Mit ihnen“ bildet diese instrumentale Funktion im Deutschen direkt ab.
- source_word: הַשֻּׁלְחָן
  choice: der Tisch
  rationale: Der bestimmte Ausdruck verweist auf den unmittelbar zuvor beschriebenen Tisch. Die schlichte Wiedergabe vermeidet zusätzliche, im Vers nicht ausgesprochene Erläuterungen.
theological_decisions: []
