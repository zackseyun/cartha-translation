  source_fidelity: 'Die Fassung gibt die Struktur des Hebräischen zuverlässig wieder: Imperativ an Mose, anschließende Aufforderung an Israel und der Wechsel zur zweiten Person Plural bei der Entgegennahme. „Sie sollen … sammeln“ ist im Deutschen eine natürliche, kontextgemäße Wiedergabe von וְיִקְחוּ לִי in der Anweisung zur Sammlung einer תרומה. „Von jedem Mann, den sein Herz dazu bewegt“ bewahrt das Bild des Herzens als innerem Antrieb und fügt keine theologische Deutung hinzu. „Meine Gabe“ erhält das Possessivsuffix in תְּרוּמָתִי.'
  naturalness: Modernes, würdiges Standarddeutsch. „Rede zu den Israeliten“ hat einen leicht gehobenen, für die Gottesrede passenden Ton, bleibt jedoch idiomatisch. Der Wechsel von „Sie sollen“ zu „sollt ihr“ ist verständlich und bildet den Wechsel im Ausgangstext ab.
