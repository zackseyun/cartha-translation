source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/יִקְחוּ לִ֖/י תְּרוּמָ֑ה מֵ/אֵ֤ת כָּל אִישׁ֙ אֲשֶׁ֣ר יִדְּבֶ֣/נּוּ לִבּ֔/וֹ תִּקְח֖וּ אֶת תְּרוּמָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/002.yaml
  text: Speak to the sons of Israel[a], that they take an offering for me. From every man whose heart moves him[c][b], you shall take my offering.
translation:
  language: de
  text: Rede zu den Israeliten[a]. Sie sollen für mich eine Gabe[b] sammeln. Von jedem Mann, den sein Herz dazu bewegt[c], sollt ihr meine Gabe annehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den Söhnen Israels“, eine gebräuchliche Bezeichnung für das Volk Israel.'
    reason: cultural_note
  - marker: b
    text: 'Auch: „Beitrag“ oder „Weihegabe“. Das hebräische Wort bezeichnet etwas, das für einen heiligen Zweck ausgesondert und gegeben wird.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „dessen Herz ihn antreibt“ oder „der von Herzen dazu bereit ist“. Die hebräische Wendung betont die freiwillige innere Bereitschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Rede zu
  rationale: Der Piel-Imperativ von דבר mit אֶל fordert Mose unmittelbar zum Reden zu Israel auf. „Rede zu“ bewahrt den direkten Befehlscharakter und klingt in diesem feierlichen Zusammenhang natürlich.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich steht „die Söhne Israels“. „Die Israeliten“ ist im heutigen Deutsch die natürliche Bezeichnung für das gesamte Bundesvolk; die wörtliche Form wird in einer Fußnote dokumentiert.
- source_word: וְיִקְחוּ לִי
  choice: Sie sollen für mich … sammeln
  rationale: Die Präfixform nach dem Imperativ hat auffordernden Sinn. „Sie sollen“ gibt diesen wieder; „sammeln“ macht im Deutschen verständlich, dass Gaben für Gott zusammengetragen werden, ohne den Vorgang als erzwungene Abgabe darzustellen.
- source_word: תְּרוּמָה
  choice: Gabe
  rationale: תְּרוּמָה bezeichnet hier etwas, das ausgesondert und für einen heiligen Zweck gegeben wird. „Gabe“ ist verständlich, wahrt den freiwilligen Kontext und vermeidet die mögliche Vorstellung eines Tieropfers, die „Opfer“ wecken könnte.
- source_word: מֵאֵת כָּל אִישׁ
  choice: Von jedem Mann
  rationale: Die distributive Wendung enthält ausdrücklich das maskuline Singularwort אִישׁ. „Von jedem Mann“ bildet diese Form ab, ohne über den unmittelbaren Wortlaut hinauszugehen.
- source_word: אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: den sein Herz dazu bewegt
  rationale: Das Herz ist grammatisch der Ursprung des inneren Antriebs. Die deutsche Wendung bewahrt das biblische Herzbild und drückt freiwillige innere Bereitschaft aus, ohne ein zusätzliches Adverb einzufügen.
- source_word: תִּקְחוּ אֶת תְּרוּמָתִי
  choice: sollt ihr meine Gabe annehmen
  rationale: Die zweite Person Plural wird gegenüber der vorherigen dritten Person ausdrücklich bewahrt. „Annehmen“ ist hier ein natürliches deutsches Äquivalent zu לקח und zeigt, dass die Gabe von den freiwillig Gebenden entgegengenommen wird; „meine“ gibt das Suffix Gottes direkt wieder.
theological_decisions:
- issue: Bezeichnung der für das Heiligtum bestimmten תְּרוּמָה
  choice: Gabe
  alternative: Beitrag; Abgabe; Weihegabe; Hebopfer
  rationale: „Gabe“ hält sowohl die Ausrichtung auf Gott als auch die im Vers genannte innere Freiwilligkeit offen. „Abgabe“ könnte Zwang nahelegen, „Hebopfer“ ist erklärungsbedürftig und kann eine bestimmte Ritualhandlung suggerieren, und „Weihegabe“ legt eine Deutung stärker fest, als es der Ausdruck an dieser Stelle verlangt.
- issue: Innere Freiwilligkeit der Gebenden
  choice: den sein Herz dazu bewegt
  alternative: der von Herzen dazu bereit ist; dessen Herz ihn antreibt
  rationale: Die gewählte Fassung erhält das Herz als handelndes Bild und macht die Freiwilligkeit sichtbar, ohne daraus eine Aussage über Verdienst, Zwang oder eine besondere geistliche Wirkung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Fassung verwendet eine gut verständliche Satzfolge, bewahrt aber den auffälligen Wechsel von der dritten Person Plural („sie sollen“) zur zweiten Person Plural („sollt ihr“). Das traditionelle Herzbild bleibt erhalten. Alle Fußnotenmarker stehen an der jeweils erläuterten Stelle.
