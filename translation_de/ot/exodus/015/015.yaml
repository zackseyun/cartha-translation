source:
  edition: WLC
  text: אָ֤ז נִבְהֲלוּ֙ אַלּוּפֵ֣י אֱד֔וֹם אֵילֵ֣י מוֹאָ֔ב יֹֽאחֲזֵ֖/מוֹ רָ֑עַד נָמֹ֕גוּ כֹּ֖ל יֹשְׁבֵ֥י כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/015.yaml
  text: Then the chiefs of Edom were terrified[a]; trembling seized the leaders of Moab; all the inhabitants of Canaan melted away.
translation:
  language: de
  text: Da erschraken die Stammesfürsten Edoms; Zittern ergriff die Mächtigen Moabs[a]; alle Bewohner Kanaans schmolzen dahin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich etwa „die Starken“ oder „die Widder Moabs“; gemeint sind vermutlich mächtige oder führende Männer.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Da
  rationale: Das temporale Adverb bezeichnet hier die Reaktion auf das zuvor besungene Rettungshandeln; „Da“ ist im deutschen poetischen Erzählstil knapp und natürlich.
- source_word: נִבְהֲלוּ
  choice: erschraken
  rationale: Der Niphal von בהל bezeichnet heftiges Erschrecken oder Bestürzung. „Erschraken“ gibt die Reaktion prägnant wieder, ohne den Grad der Angst unnötig festzulegen.
- source_word: אַלּוּפֵי אֱדוֹם
  choice: die Stammesfürsten Edoms
  rationale: אַלּוּף kann einen Anführer oder das Oberhaupt eines Stammesverbandes bezeichnen. „Stammesfürsten“ bewahrt sowohl den Führungsrang als auch den gesellschaftlichen Hintergrund, ohne ein Königtum vorauszusetzen.
- source_word: אֵילֵי מוֹאָב
  choice: die Mächtigen Moabs
  rationale: אֵילֵי ist wörtlich mit Stärke beziehungsweise mit „Widdern“ verbunden und bezeichnet hier führende oder besonders mächtige Männer. „Mächtige“ erhält das Wortspiel mit Stärke besser als die allgemeinere Wiedergabe „Anführer“.
- source_word: יֹאחֲזֵמוֹ רָעַד
  choice: Zittern ergriff
  rationale: Die Verbindung von אחז mit רָעַד stellt das Zittern bildhaft als eine Macht dar, die sie packt. Die deutsche Formulierung bewahrt diese Personifikation.
- source_word: נָמֹגוּ
  choice: schmolzen dahin
  rationale: מוג beschreibt im Zusammenhang mit Furcht ein Dahinschmelzen beziehungsweise den Verlust allen Mutes. Die Wiedergabe erhält das poetische Bild, statt es erklärend auf „verzagten“ zu reduzieren.
- source_word: כֹּל יֹשְׁבֵי כְנָעַן
  choice: alle Bewohner Kanaans
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet umfassend alle in Kanaan Wohnenden; „Bewohner“ ist im modernen Standarddeutsch klar und idiomatisch.
theological_decisions: []
translation_notes:
  register: Poetisch-gehobenes, aber gut verständliches modernes Standarddeutsch. Die Parallelstruktur und die lebhaften Bilder des hebräischen Siegesliedes bleiben erhalten. Der Fußnotenmarker steht unmittelbar bei der erklärungsbedürftigen Wendung „die Mächtigen Moabs“.
