source:
  edition: WLC
  text: וַ/יַּסַּ֨ע מֹשֶׁ֤ה אֶת יִשְׂרָאֵל֙ מִ/יַּם ס֔וּף וַ/יֵּצְא֖וּ אֶל מִדְבַּר שׁ֑וּר וַ/יֵּלְכ֧וּ שְׁלֹֽשֶׁת יָמִ֛ים בַּ/מִּדְבָּ֖ר וְ/לֹא מָ֥צְאוּ מָֽיִם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/022.yaml
  text: Then Moses led Israel on from the Sea of Reeds[a], and they went out into the wilderness of Shur. They went three days in the wilderness and found no water.
translation:
  language: de
  text: Dann ließ Mose Israel vom Schilfmeer[a] aufbrechen, und sie zogen hinaus in die Wüste Schur. Drei Tage lang zogen sie durch die Wüste, ohne Wasser zu finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell „Rotes Meer“; hebräisch „Schilfmeer“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסַּע
  choice: ließ ... aufbrechen
  rationale: 'Der Hifil von נסע ist hier kausativ: Mose veranlasste Israel zum Aufbruch. Die Formulierung ist im Deutschen natürlich und bewahrt diesen Sinn, ohne eine nicht ausdrücklich genannte Führungstätigkeit stärker hervorzuheben.'
- source_word: מִיַּם סוּף
  choice: vom Schilfmeer
  rationale: יָם־סוּף bezeichnet dem hebräischen Wortlaut nach das „Schilfmeer“. Die traditionelle Wiedergabe „Rotes Meer“ wird in der Fußnote genannt.
- source_word: מִדְבַּר שׁוּר
  choice: die Wüste Schur
  rationale: מִדְבָּר bezeichnet unbewohntes, trockenes Wildnis- oder Wüstengebiet. „Wüste Schur“ ist die geläufige, knappe deutsche Ortsbezeichnung.
- source_word: וַיֵּצְאוּ
  choice: sie zogen hinaus
  rationale: יצא bedeutet hinausgehen oder hinausziehen. Im Zusammenhang einer wandernden Volksgruppe ist „zogen hinaus“ idiomatisch und gibt die Bewegungsrichtung wieder.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: drei Tage lang
  rationale: Der Akkusativ bezeichnet die Dauer. „Drei Tage lang“ macht diese Funktion im Deutschen klar, ohne den Ausdruck zu einem ausdrücklich so bezeichneten „Dre Tagesmarsch“ umzudeuten.
- source_word: בַּמִּדְבָּר
  choice: durch die Wüste
  rationale: ב kann örtlich „in“ bedeuten; zusammen mit dem Verb des Gehens ist im Deutschen „durch die Wüste“ natürlich und beschreibt den Weg, ohne ein zusätzliches Ziel einzuführen.
- source_word: וְלֹא מָצְאוּ מָיִם
  choice: ohne Wasser zu finden
  rationale: 'Die Formulierung gibt die koordinierte hebräische Negativaussage idiomatisch wieder: Während der dreitägigen Wanderung fanden sie kein Wasser.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ließ ... aufbrechen“ erhält den kausativen Sinn des hebräischen Verbs; die Wiederholung von „Wüste“ spiegelt die Struktur des Ausgangstextes. Der Fußnotenmarker [a] steht unmittelbar beim betreffenden Ausdruck.
