review_pass:
  verdict: revise
  source_fidelity: Die Satzfolge und die zentralen Bilder entsprechen dem Hebräischen. Die Imperfekte sind jedoch durchgehend als Absicht/Futur zu verstehen; die Mischung aus Präsens („ich jage“, „ich hole“, „ich teile“, „ich ziehe“) und Futur ist unnötig uneinheitlich. Am Schluss ist „vertreiben“ als Haupttext zu eng und im Kontext weniger naheliegend; תּוֹרִישֵׁמוֹ kann hier auch das Überwältigen bzw. Vernichten bezeichnen.
  naturalness: 'Der prahlerische Reihungsstil ist gelungen. Die futurische Reihung klingt im Deutschen klarer. Die Fußnotenformulierung „mich an ihnen sattsehen“ ist semantisch unzutreffend: sattsehen bedeutet, etwas lange genug angesehen zu haben, nicht sein Verlangen an jemandem zu stillen.'
  terminology: „Beute“, „Schwert“ und die personifizierte „Hand“ sind passend. „Gier“ gibt נֶפֶשׁ als begehrendes Selbst in diesem feindseligen Kontext vertretbar wieder. Die Bedeutungsbreite von ירשׁ im Hifil sollte durch eine Hauptformulierung ohne unpassende Besitz-Ergänzung und eine präzise Alternative gewahrt werden.
  issues:
  - severity: medium
    issue: Uneinheitliche Wiedergabe der hebräischen Imperfekte
    rationale: Die ersten vier Verben stehen im deutschen Präsens, das letzte jedoch im Futur. Da die Rede eine Absichtserklärung des Feindes ist, sollte die künftige Bedeutung einheitlich markiert werden.
  - severity: medium
    issue: Unzutreffende Fußnotenparaphrase „mich an ihnen sattsehen“
    rationale: „Sich sattsehen“ betrifft das Sehen und bildet weder das Sättigungsbild noch das begehrende Verlangen von נֶפֶשׁ ab.
  - severity: medium
    issue: „Vertreiben“ und „aus ihrem Besitz verdrängen“ am Versende
    rationale: Die Hauptlesart „vertreiben“ legt eine im unmittelbaren Kontext wenig passende Richtung nahe; „aus ihrem Besitz verdrängen“ fügt zudem einen im Text nicht genannten Besitzbezug ein. Die Stelle kann im Kontext auch „vernichten“ bzw. „überwältigen“ meinen.
