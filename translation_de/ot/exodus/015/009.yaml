  to: 'Der Feind sagte: »Ich werde ihnen nachjagen, ich werde sie einholen, ich werde die Beute teilen. An ihnen wird sich meine Gier sättigen.[a] Ich werde mein Schwert ziehen; meine Hand wird sie vernichten.«[b]'
