base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/009.yaml
  text: The enemy said[a], ‘I will pursue, I will overtake, I will divide the spoil; my desire will be satisfied on them. I will draw my sword[b]; my hand will dispossess them.’
translation:
  language: de
  text: 'Der Feind sagte: »Ich werde ihnen nachjagen, ich werde sie einholen, ich werde die Beute teilen. An ihnen wird sich meine Gier sättigen.[a] Ich werde mein Schwert ziehen; meine Hand wird sie vernichten.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Meine Seele wird sich an ihnen füllen/sättigen.« Gemeint ist: »Mein Verlangen wird an ihnen gestillt.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Meine Hand wird sie vertreiben« oder »sie enteignen/ihres Besitzes berauben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר אוֹיֵב
  choice: Der Feind sagte
  rationale: Das einfache Präteritum führt im Lied die prahlerische Rede des kollektiv verstandenen Feindes ein.
- source_word: אֶרְדֹּף אַשִּׂיג
  choice: Ich jage ihnen nach, ich hole sie ein
  rationale: Die Imperfektformen drücken hier beabsichtigte künftige Handlungen aus; die deutschen Wendungen bewahren die Verfolgungsbewegung.
- source_word: אֲחַלֵּק שָׁלָל
  choice: ich teile die Beute
  rationale: Dies gibt die feste Ausdrucksweise für das Verteilen von Kriegsbeute knapp und verständlich wieder.
- source_word: תִּמְלָאֵמוֹ נַפְשִׁי
  choice: An ihnen wird sich meine Gier sättigen
  rationale: נֶפֶשׁ bezeichnet hier das begehrende Selbst beziehungsweise Verlangen. Die Formulierung bewahrt das Bild des Sattwerdens und den feindseligen Ton.
- source_word: אָרִיק חַרְבִּי
  choice: Ich ziehe mein Schwert
  rationale: Die Verbindung von ריק im Hifil mit „Schwert“ ist idiomatisch als Ziehen beziehungsweise Zücken des Schwertes zu verstehen.
- source_word: תּוֹרִישֵׁמוֹ יָדִי
  choice: meine Hand wird sie vertreiben
  rationale: Das Hifil von ירשׁ kann „vertreiben/enteignen“ und in diesem Zusammenhang möglicherweise auch „vernichten“ bedeuten. „Vertreiben“ hält sich eng an den üblichen lexikalischen Sinn; die Alternative wird in der Fußnote offengehalten.
theological_decisions:
- issue: Bedeutungsumfang von נֶפֶשׁ in der Feindesrede
  choice: Gier
  alternative: Seele; Verlangen
  rationale: Hier geht es nicht um eine lehrmäßige Aussage über die Seele, sondern um das gierige Begehren des Feindes. Die Bildsprache des Sättigens bleibt erhalten.
- issue: Bedeutung von ירשׁ im Hifil am Versende
  choice: vertreiben
  alternative: vernichten; aus ihrem Besitz verdrängen
  rationale: Der Kontext erlaubt eine stärkere Bedeutung, zwingt aber nicht eindeutig dazu. Die Übersetzung wahrt die lexikalische Grundlinie und nennt die echte Alternative in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rhythmisch gereihten, prahlerischen Kurzsätzen. Die poetische Personifikation der Hand und das Bild des Sättigens bleiben erhalten; seltene oder missverständliche Bedeutungsalternativen werden in Fußnoten ausgewiesen.
