  text: Then they came to Elim[a], where there were twelve springs of water and seventy palm trees[c][b], and they camped there by the water.
translation:
  language: de
  text: Dann kamen sie nach Elim. Dort gab es zwölf Wasserquellen und siebzig Palmen[a], und sie lagerten dort am Wasser[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder genauer: „Dattelpalmen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bei den Wassern“. Das hebräische Wort für „Wasser“ steht in einer Pluralform, die auch Wasser als Sammelbegriff bezeichnen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Dann kamen sie
  rationale: Das Wayyiqtol führt die Erzählung zum nächsten Geschehen weiter. „Dann kamen sie“ gibt diese Abfolge in natürlichem modernem Deutsch wieder.
- source_word: אֵילִמָה
  choice: nach Elim
  rationale: Der Ortsname wird als „Elim“ wiedergegeben; das angehängte Richtungs-ה wird durch „nach“ ausgedrückt.
- source_word: וְשָׁם
  choice: Dort gab es
  rationale: שָׁם bedeutet „dort“. Die existentielle Aussage wird im Deutschen idiomatisch mit „Dort gab es“ formuliert.
- source_word: עֵינֹת מַיִם
  choice: Wasserquellen
  rationale: עַיִן bezeichnet hier eine natürliche Quelle. „Wasserquellen“ bewahrt beide Bestandteile der hebräischen Wortverbindung und passt zum Oasenkontext.
- source_word: תְּמָרִים
  choice: Palmen
  rationale: Das Wort bezeichnet Palmen, wahrscheinlich Dattelpalmen. „Palmen“ bleibt bei der sicheren allgemeinen Bedeutung; die genauere Möglichkeit wird in einer Fußnote genannt.
- source_word: וַיַּחֲנוּ
  choice: und sie lagerten
  rationale: חנה bezeichnet das Aufschlagen eines Lagers. „Sie lagerten“ ist modernes, verständliches Deutsch und vermeidet das altertümlich wirkende „sie lagerten sich“.
- source_word: עַל הַמָּיִם
  choice: am Wasser
  rationale: עַל bezeichnet hier räumliche Nähe. Obwohl מַיִם formal pluralisch ist, wird Wasser im Deutschen gewöhnlich als nicht zählbarer Sammelbegriff im Singular gebraucht.
