source:
  edition: WLC
  text: אָ֣ז יָשִֽׁיר מֹשֶׁה֩ וּ/בְנֵ֨י יִשְׂרָאֵ֜ל אֶת הַ/שִּׁירָ֤ה הַ/זֹּאת֙ לַֽ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֵ/אמֹ֑ר אָשִׁ֤ירָה לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/001.yaml
  text: 'Then Moses and the sons of Israel sang this song to Yahweh[a], and they said: “I will sing to Yahweh, for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: de
  text: 'Da sangen Mose und die Israeliten dieses Lied für Jahwe[a] und sagten:


    »Ich will für Jahwe singen,


    denn hocherhaben hat er sich erwiesen[b].


    Pferd und Reiter


    warf er ins Meer.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit »der HERR« wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: »Denn herrlich hat er triumphiert.« Das Hebräische verstärkt das Verb durch eine wiederholte Form.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז יָשִׁיר
  choice: Damals sangen
  rationale: Mit אָז hat das morphologische Imperfekt hier erzählenden Vergangenheitsbezug. „Damals sangen“ gibt Zeitfolge und Ereignis natürlich wieder.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: und die Israeliten
  rationale: Die geläufige deutsche Bezeichnung gibt die Abstammungs- und Volkszugehörigkeit natürlich und inklusiv wieder; „Söhne Israels“ könnte im heutigen Deutsch unnötig auf Männer beschränkt verstanden werden.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: dieses Lied
  rationale: Direkte, uninterpretierte Wiedergabe der Nominalgruppe.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: ל bezeichnet hier den Adressaten des Liedes. „Für Jahwe singen“ ist im modernen Deutsch idiomatischer als „zu Jahwe singen“, während der Gottesname im Haupttext erhalten bleibt.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: Sie sprachen
  rationale: Die hebräische formelhafte Redundanz wird in natürlichem Deutsch nicht doppelt wiedergegeben. „Sprachen“ leitet den poetischen Wortlaut würdig ein.
- source_word: אָשִׁירָה
  choice: Ich will … singen
  rationale: Der Kohortativ drückt den entschlossenen Willen des singenden Ichs aus und bewahrt den Wechsel von der pluralischen Einleitung zur singularischen Liedstimme.
- source_word: גָאֹה גָּאָה
  choice: hocherhaben hat er sich erwiesen
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage. Die Formulierung hält die Bedeutungsfelder Erhabenheit und siegreiche Selbstbekundung offen.
- source_word: סוּס וְרֹכְבוֹ
  choice: Ross und Reiter
  rationale: Bewahrt den poetischen kollektiven Singular und die knappe Parallelstruktur. „Ross“ passt zum gehobenen Liedregister, ohne altertümlich unverständlich zu sein.
- source_word: רָמָה בַיָּם
  choice: warf er ins Meer
  rationale: Gibt die kraftvolle Bewegung und die kontextuell direktionale Bedeutung der Präposition knapp und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird im Haupttext als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen; eine Fußnote nennt die hebräische Form und die traditionelle Wiedergabe.
- issue: Bedeutung von גָאֹה גָּאָה
  choice: hocherhaben hat er sich erwiesen
  alternative: herrlich hat er triumphiert
  rationale: Der Kontext erlaubt eine siegesbezogene Wiedergabe, doch die hebräische Wurzel bezeichnet primär Erhabenheit beziehungsweise majestätisches Sich-Erheben. Die gewählte Formulierung bewahrt diese Spannung; die Fußnote nennt die kontextuelle Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klar erkennbarer poetischer Zeilengliederung. Die Erzählprosa bleibt natürlich; im Lied sorgen „hocherhaben“ und „Ross und Reiter“ für einen gehobenen, aber verständlichen Klang. Alle Fußnotenmarker stehen im Haupttext.
