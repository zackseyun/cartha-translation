  terminology: »Jahwe« gibt den Gottesnamen sachgerecht wieder; die Fußnote erläutert die traditionelle Ersatzwiedergabe angemessen. »Hocherhaben hat er sich erwiesen« ist als kontextsensibles Verständnis von גָאֹה גָּאָה vertretbar. Die alternative, siegesbezogene Wiedergabe bleibt zu Recht in der Fußnote.
