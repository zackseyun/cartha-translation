  text: You stretched out your right hand[a]; the earth swallowed them.
translation:
  language: de
  text: Du strecktest deine rechte Hand aus; die Erde verschlang sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land verschlang sie“ oder „der Erdboden verschlang sie“.'
