lexical_decisions:
- source_word: נָטִיתָ
  choice: Du strecktest … aus
  rationale: Das Qal Perfekt 2. Person Maskulin Singular von נטה spricht Gott unmittelbar an. „ausstrecken“ gibt die konkrete Handlung natürlich und präzise wieder.
- source_word: יְמִינְךָ
  choice: deine rechte Hand
  rationale: Die konkrete Körpermetapher wird bewahrt; sie steht poetisch für Gottes Macht, ohne im Haupttext abstrahiert zu werden.
- source_word: תִּבְלָעֵמוֹ
  choice: verschlang sie
  rationale: Die Form verbindet ein feminines Subjekt im Singular mit einem Objektssuffix der 3. Person Maskulin Plural. „verschlingen“ erhält das eindringliche poetische Bild.
- source_word: אָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann Erde, Land oder Erdboden bedeuten. Im dramatischen poetischen Zusammenhang gibt „die Erde“ die umfassende Bildsprache gut wieder und stimmt mit dem femininen Singular des Verbs überein.
theological_decisions:
- issue: Anthropomorphe Sprache für Gottes Handeln
  choice: Die konkrete Wendung „deine rechte Hand“ bleibt erhalten.
  alternative: deine Macht; deine mächtige Hand
  rationale: Der hebräische Lobgesang gebraucht ein körperliches Bild für Gottes machtvolles Handeln. Seine Beibehaltung wahrt die literarische und theologische Spannung, ohne sie erklärend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Präteritum passt zum poetischen Rückblick; die anschauliche Bildsprache des Hebräischen bleibt erhalten.
