  text: Yahweh will reign forever and ever[a].
translation:
  language: de
  text: Jahwe wird für immer und ewig herrschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH, der Gottesname. Traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, um den im Hebräischen stehenden Eigennamen zu bewahren; diese Form ist im Deutschen geläufig.
- source_word: יִמְלֹךְ
  choice: wird herrschen
  rationale: Das Imperfekt von מלך ist hier im Zusammenhang des Siegesliedes am natürlichsten futurisch zu verstehen. „Herrschen“ wahrt den königlichen Sinn und klingt in modernem Deutsch würdig und idiomatisch.
- source_word: לְעֹלָם וָעֶד
  choice: für immer und ewig
  rationale: Die feste, verstärkende Verbindung bezeichnet eine unbegrenzte Dauer. Die geläufige deutsche Wendung bewahrt sowohl die Aussage als auch deren emphatischen Klang.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen; die traditionelle Wiedergabe wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dem feierlichen und bekenntnishaften Charakter des Liedverses. Die feste Wendung „für immer und ewig“ ist allgemein verständlich und bildet die hebräische Verstärkung natürlich ab.
