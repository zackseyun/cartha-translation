  text: נָחִ֥יתָ בְ/חַסְדְּ/ךָ֖ עַם ז֣וּ גָּאָ֑לְתָּ נֵהַ֥לְתָּ בְ/עָזְּ/ךָ֖ אֶל נְוֵ֥ה קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/013.yaml
  text: In your steadfast love you have led the people whom you redeemed[b][a]; in your strength you have guided them to your holy dwelling.
translation:
  language: de
  text: In deiner treuen Liebe hast du das Volk, das du erlöst hast,[a] geführt; durch deine Kraft hast du es zu deiner heiligen Wohnstätte geleitet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dieses Volk, das du erlöst hast“.'
    reason: lexical_alternative
  - marker: b
    text: Mit „deiner heiligen Wohnstätte“ kann allgemein der Ort der heiligen Gegenwart Gottes gemeint sein. Der Ausdruck wird unterschiedlich auf den Sinai, das verheißene Land oder Zion beziehungsweise den Tempel bezogen.
    reason: alternative_reading
lexical_decisions:
- source_word: נָחִיתָ
  choice: hast du … geführt
  rationale: Das Hifil von נחה bedeutet hier „führen“ oder „leiten“. „Geführt“ gibt die vollendete göttliche Handlung natürlich wieder und lässt sich von נהל im zweiten Halbvers unterscheiden.
- source_word: בְחַסְדְּךָ
  choice: in deiner treuen Liebe
  rationale: חֶסֶד verbindet Liebe und Erbarmen mit Beständigkeit und Loyalität. „Treue Liebe“ bewahrt beide Bedeutungsseiten in verständlichem, würdigem Deutsch.
- source_word: עַם זוּ
  choice: das Volk
  rationale: זוּ hat hier demonstrative beziehungsweise relative Kraft. Im Deutschen bezeichnet „das Volk“ zusammen mit dem folgenden Relativsatz die gemeinte Gruppe natürlich; die mögliche ausdrückliche Wiedergabe als „dieses Volk“ bleibt in der Fußnote erhalten.
- source_word: גָּאָלְתָּ
  choice: das du erlöst hast
  rationale: גאל bezeichnet das befreiende Einlösen oder Zurückgewinnen. „Erlöst“ bewahrt das Gewicht des hebräischen Bundes- und Verwandtenbegriffs, ohne ihn einengend auszulegen.
- source_word: נֵהַלְתָּ
  choice: hast du es … geleitet
  rationale: נהל bezeichnet fürsorgliches Führen oder Geleiten. „Geleitet“ wahrt die Nähe zum ersten Verb und vermeidet zugleich eine bloße Wiederholung von „geführt“.
- source_word: בְעָזְּךָ
  choice: durch deine Kraft
  rationale: עֹז bedeutet Kraft oder Macht. Das instrumentale „durch“ macht deutlich, dass Gottes Kraft das Mittel seines Leitens ist.
- source_word: אֶל
  choice: zu
  rationale: אֶל bezeichnet die Bewegung auf ein Ziel hin. „Zu“ ist idiomatisch und legt weder bloße Annäherung noch ausdrücklich den Eintritt fest.
- source_word: נְוֵה קָדְשֶׁךָ
  choice: deine heilige Wohnstätte
  rationale: נָוֶה kann Wohnort, Aufenthaltsort oder auch Weideplatz bezeichnen. „Heilige Wohnstätte“ gibt im Zusammenhang den Ort der heiligen Gegenwart Gottes wieder, ohne ihn genauer zu bestimmen, als es der hebräische Text tut.
theological_decisions:
- issue: Bezug der „heiligen Wohnstätte“
  choice: Eine bewusst offene Bezeichnung für den Ort der heiligen Gegenwart Gottes
  alternative: Sinai, das verheißene Land oder Zion beziehungsweise der Tempel als jeweils ausschließlich gemeinter Ort
  rationale: Der hebräische Ausdruck bestimmt den Ort nicht eindeutig. Das Lied kann Gottes Heilshandeln dichterisch bis zu seinem heiligen Wohnort vorausgreifend zusammenfassen; deshalb wird die Spannung nicht im Haupttext aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. „Treue Liebe“ und „Kraft“ spiegeln die beiden einander entsprechenden Präpositionalgruppen; „geführt“ und „geleitet“ bewahren die verwandten, aber nicht völlig identischen Verben.
