base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/023.yaml
  text: Then they came to Marah[a], but they could not drink the water from Marah because it was bitter. Therefore it was named Marah.
translation:
  language: de
  text: Dann kamen sie nach Mara[a], aber sie konnten das Wasser aus Mara nicht trinken, weil es bitter war. Deshalb nannte man den Ort Mara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name „Mara“ klingt im Hebräischen wie das Wort für „bitter“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Dann kamen sie
  rationale: Das Wayyiqtol von בוא führt die Erzählung weiter; „Dann“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: מָרָתָה
  choice: nach Mara
  rationale: Der Ortsname mit direktionalem He bezeichnet das Ziel der Bewegung; bei Ortsnamen ohne Artikel ist „nach“ im Deutschen idiomatisch.
- source_word: וְלֹא יָכְלוּ
  choice: aber sie konnten … nicht
  rationale: Die Konjunktion steht hier in einem sachlichen Gegensatz zur Ankunft und wird deshalb natürlich mit „aber“ wiedergegeben.
- source_word: לִשְׁתֹּת מַיִם
  choice: das Wasser … trinken
  rationale: Gemeint ist das konkrete Wasser an diesem Ort; der bestimmte Artikel entspricht natürlichem deutschem Sprachgebrauch.
- source_word: מִמָּרָה
  choice: aus Mara
  rationale: Die Präposition מן bezeichnet am ehesten die Herkunft beziehungsweise Quelle des Wassers.
- source_word: כִּי מָרִים הֵם
  choice: weil es bitter war
  rationale: Die hebräische Pluralform bezieht sich grammatisch auf מַיִם; im Deutschen ist „Wasser“ Singular, daher stehen Pronomen und Prädikat im Singular. כִּי wird kausal wiedergegeben.
- source_word: עַל כֵּן
  choice: Deshalb
  rationale: Die Wendung leitet die aus der Bitterkeit abgeleitete Namensbegründung ein.
- source_word: קָרָא שְׁמָהּ מָרָה
  choice: nannte man den Ort Mara
  rationale: Das Verb steht ohne ausdrücklich genanntes Subjekt und kann unpersönlich verstanden werden. „Man nannte“ bewahrt dies besser als ein bestimmtes „er“; „den Ort“ macht den Bezug des femininen Suffixes im Deutschen natürlich verständlich.
- source_word: מָרָה / מָרִים
  choice: Mara / bitter
  rationale: Der Eigenname wird transliteriert, das verwandte Adjektiv übersetzt. Eine Fußnote macht das hebräische Wortspiel sichtbar.
theological_decisions: []
