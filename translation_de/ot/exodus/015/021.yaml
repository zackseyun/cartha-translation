base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/021.yaml
  text: 'And Miriam answered them: “Sing to Yahweh[a], for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: de
  text: 'Und Mirjam antwortete ihnen: »Singt Jahwe[a], denn er hat sich hoch erhoben[b]; Pferd und Reiter hat er ins Meer geworfen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Gottesname wird im Hebräischen mit den vier Buchstaben JHWH geschrieben und hier mit »Jahwe« wiedergegeben.
    reason: divine_name
  - marker: b
    text: 'Oder: »denn er hat herrlich triumphiert«. Wörtlicher ist die Wendung etwa: »denn er hat sich hoch erhoben«; die hebräische Wortverbindung verstärkt die Aussage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  choice: antwortete
  rationale: Das Verb ענה bedeutet grundlegend »antworten/erwidern«; im Zusammenhang des Liedes kann es responsorisches Singen bezeichnen, ohne dass diese Nuance im Haupttext festgelegt werden muss.
- source_word: לָהֶם
  choice: ihnen
  rationale: Gibt die Präposition mit maskulin-pluralischem Suffix direkt wieder und legt die angesprochene Gruppe nicht enger fest als der hebräische Text.
- source_word: מִרְיָם
  choice: Mirjam
  rationale: Im Deutschen übliche, dem Hebräischen nahe Namensform.
- source_word: שִׁירוּ
  choice: Singt
  rationale: Direkte Wiedergabe des pluralischen Imperativs von שׁיר; »Lob singt« wäre bereits ausdeutend.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל bei שׁיר bezeichnet den Adressaten des Singens; »für Jahwe singen« ist im Deutschen natürlich. Der Gottesname wird als Jahwe wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für die Aufforderung ein und wahrt den gehobenen Liedton.
- source_word: גָאֹה גָּאָה
  choice: er hat sich herrlich erhoben
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt גאה. Die Formulierung bewahrt das Bild des Sich-Erhebens und lässt sowohl Majestät als auch siegreichen Triumph anklingen.
- source_word: סוּס וְרֹכְבוֹ
  choice: Pferd und Reiter
  rationale: Die knappe deutsche Paarformel gibt den kollektiv-singulären Ausdruck natürlich wieder; »Reiter« ist im Deutschen grammatisch maskulin, ohne über den Text hinaus eine bestimmte Person festzulegen.
- source_word: רָמָה
  choice: hat er … geworfen
  rationale: Direkte Wiedergabe des Verbs »werfen/schleudern«; die deutsche Perfektform passt zum berichtenden Siegeslied.
- source_word: בַיָּם
  choice: ins Meer
  rationale: Bei einem Verb des Werfens gibt »ins Meer« die zielgerichtete Bewegung beziehungsweise das Ergebnis idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von גָאֹה גָּאָה
  choice: er hat sich herrlich erhoben
  alternative: er hat herrlich triumphiert
  rationale: Die gewählte Fassung hält die Bildsprache und mögliche Bedeutungsbreite zwischen majestätischer Erhabenheit und siegreichem Triumph offen; eine Fußnote nennt die kontextuell naheliegende Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Die Wiederaufnahme aus Exodus 15,1 bleibt erkennbar; echte lexikalische Mehrdeutigkeit wird in der Fußnote offengehalten.
