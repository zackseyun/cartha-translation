  naturalness: Der knappe, poetische Satz ist insgesamt modernes, würdiges Standarddeutsch. »Singt Jahwe« ist als dichterisch-liturgische Dativfügung natürlicher und zielgenauer als »Singt für Jahwe«. »hat sich hoch erhoben« ist idiomatischer und semantisch transparenter als »hat sich herrlich erhoben«.
  terminology: »Mirjam« und »Jahwe« sind passende deutsche Namensformen. Die Fußnote zum Gottesnamen ist sachlich. Die Fußnote zu גָאֹה גָּאָה sollte die wörtlichere Wiedergabe an den revidierten Haupttext angleichen und die kontextuelle Alternative »triumphiert« als solche kennzeichnen.
