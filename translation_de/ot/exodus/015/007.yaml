base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/007.yaml
  text: And in the greatness of your majesty you overthrow those who rise up against you[a]; you send out your burning anger[b]; it consumes them like stubble.
translation:
  language: de
  text: Und in deiner großen Hoheit[a] reißt du die nieder, die sich gegen dich erheben. Du sendest deinen glühenden Zorn[b] aus; er verzehrt sie wie Stoppeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch die Größe deiner Majestät“. Das Hebräische kann sowohl den Bereich als auch das Mittel bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deinen Grimm“. Der hebräische Ausdruck bezeichnet wörtlich einen brennenden Zorn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹב
  choice: Und in der Fülle
  rationale: בְּ mit רֹב kann einen Bereich oder ein Mittel bezeichnen; „in der Fülle“ bewahrt die poetische Weite des Ausdrucks, ohne sich eindeutig auf „durch“ festzulegen. וּ wird als „Und“ wiedergegeben.
- source_word: גְּאוֹנְךָ
  choice: deiner Hoheit
  rationale: גָּאוֹן bezeichnet hier Gottes Erhabenheit, Hoheit oder Majestät. „Hoheit“ ist würdig, verständlich und passt zum hymnischen Kontext.
- source_word: תַּהֲרֹס
  choice: reißt du nieder
  rationale: הרס bedeutet grundlegend „niederreißen, zerstören“. Die Formulierung erhält das kräftige Bild und lässt sich im Deutschen auch auf Personen beziehen.
- source_word: קָמֶיךָ
  choice: die sich gegen dich erheben
  rationale: Das Partizip von קום wird verbal wiedergegeben und bewahrt so das Bild derer, die sich feindlich gegen Gott erheben.
- source_word: תְּשַׁלַּח
  choice: Du sendest ... aus
  rationale: Die einfache Bedeutung von שׁלח ist „senden, aussenden“. Die Übersetzung vermeidet das stärker deutende „entfesseln“.
- source_word: חֲרֹנְךָ
  choice: deinen glühenden Zorn
  rationale: חָרוֹן bezeichnet brennenden oder heftigen Zorn. „Glühender Zorn“ erhält die Hitze-Metaphorik und bereitet das folgende Bild des Verzehrens vor.
- source_word: יֹאכְלֵמוֹ
  choice: er verzehrt sie
  rationale: Das singularische Verb nimmt den Zorn als Subjekt auf. „Verzehren“ passt natürlich zum impliziten Feuerbild.
- source_word: כַּקַּשׁ
  choice: wie Stoppeln
  rationale: קַשׁ bezeichnet trockene Getreidehalme beziehungsweise Stoppeln oder Stroh. „Stoppeln“ vermittelt hier besonders gut, wie rasch trockenes Pflanzenmaterial verbrennt.
theological_decisions:
- issue: Bildhafte Sprache des göttlichen Gerichts
  choice: Du sendest deinen glühenden Zorn aus; er verzehrt sie wie Stoppeln.
  alternative: Du lässt deinen Zorn los; er frisst sie wie Stroh.
  rationale: Die Übersetzung bewahrt die ausdrückliche Zuschreibung des Gerichts an Gott und die Feuerbildsprache, ohne sie abzuschwächen oder dogmatisch auszudeuten.
- issue: Direkte Anrede Gottes
  choice: deiner Hoheit ... gegen dich ... deinen glühenden Zorn
  alternative: seiner Hoheit ... gegen ihn ... seinen Zorn
  rationale: Das hebräische Lied redet Gott unmittelbar in der zweiten Person an; dies erhält seinen hymnischen und bekenntnishaften Charakter.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit poetischer Satzführung. Die kräftigen Verben und die Hitze- beziehungsweise Feuerbildsprache des hebräischen Siegesliedes bleiben erhalten; echte lexikalische Mehrdeutigkeiten werden in den Fußnoten kenntlich gemacht.
