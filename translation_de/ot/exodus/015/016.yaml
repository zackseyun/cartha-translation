id: EXO.15.16
reference: Exodus 15:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תִּפֹּ֨ל עֲלֵי/הֶ֤ם אֵימָ֨תָ/ה֙ וָ/פַ֔חַד בִּ/גְדֹ֥ל זְרוֹעֲ/ךָ֖ יִדְּמ֣וּ כָּ/אָ֑בֶן עַד יַעֲבֹ֤ר עַמְּ/ךָ֙ יְהוָ֔ה עַֽד יַעֲבֹ֖ר עַם ז֥וּ קָנִֽיתָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/016.yaml
  text: Terror and dread will fall on them[a]; by the greatness of your arm they will be still as a stone, until your people pass by, O Yahweh[c][b], until this people whom you acquired pass by.
translation:
  language: de
  text: Schrecken und Furcht werden über sie fallen. Durch die Größe deines Arms werden sie reglos wie ein Stein[a], bis dein Volk vorüberzieht[b], Jahwe, bis dieses Volk, das du erworben hast[c], vorüberzieht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „still“ beziehungsweise „verstummt“. Das hebräische Verb kann Stillsein, Schweigen oder Bewegungslosigkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hinüberzieht“ beziehungsweise „hindurchzieht“.'
    reason: lexical_alternative
  - marker: c
    text: „Erworben“ kann auch mit „gekauft“ oder im weiteren Sinn mit „zu deinem Eigentum gemacht“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפֹּל עֲלֵיהֶם אֵימָתָה וָפַחַד
  choice: Schrecken und Furcht werden über sie fallen
  rationale: Die feminine Singularform des Verbs stimmt mit dem zuerst genannten Substantiv überein, während beide Furchtbegriffe gemeinsam als Subjekt wirken. Die Zukunftsform entspricht der vorausschauenden Aussage des Liedes; „über sie fallen“ bewahrt das hebräische Bild.
- source_word: בִּגְדֹל זְרוֹעֲךָ
  choice: Durch die Größe deines Arms
  rationale: Die Formulierung erhält sowohl die instrumentale beziehungsweise ursächliche Kraft der Präposition als auch das biblische Bild des Arms als Ausdruck wirksamer Macht.
- source_word: יִדְּמוּ כָּאָבֶן
  choice: werden sie reglos wie ein Stein
  rationale: Das Verb kann Stillsein, Schweigen oder Bewegungslosigkeit bezeichnen. Im Vergleich mit einem Stein steht die Bewegungslosigkeit im Vordergrund; eine Fußnote bewahrt die weitere Bedeutungsbreite.
- source_word: עַד יַעֲבֹר
  choice: bis … vorüberzieht
  rationale: עבר bezeichnet hier das Vorbeiziehen beziehungsweise Hinüberziehen des Volkes. „Vorüberzieht“ passt zur Reaktion der Völker auf Israels weiteren Weg, ohne den Ausdruck ausschließlich auf eine Gewässerüberquerung festzulegen.
- source_word: עַמְּךָ
  choice: dein Volk
  rationale: Die Wiedergabe bewahrt die relationale und gemeinschaftliche Bedeutung des hebräischen עם.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen übliche Form.
- source_word: עַם זוּ
  choice: dieses Volk
  rationale: זוּ hat demonstrative Kraft; „dieses Volk“ erhält die Betonung und die Parallele zu „dein Volk“.
- source_word: קָנִיתָ
  choice: du erworben hast
  rationale: קנה bedeutet erwerben, kaufen oder in Besitz bringen. „Erworben“ bleibt lexikalisch breit und vermeidet es, den Ausdruck vorschnell auf „erlöst“ oder „geschaffen“ festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen unmittelbar. Die Transliteration bewahrt den Charakter als Eigenname, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bundestheologische Bedeutung von קָנִיתָ
  choice: erworben
  alternative: gekauft; zu deinem Eigentum gemacht; geschaffen
  rationale: „Erworben“ gibt den Grundsinn wieder und lässt offen, auf welche Weise Jahwe das Volk zu seinem eigenen gemacht hat. So wird weder eine engere Lösegeldvorstellung noch die umstrittene Bedeutung „geschaffen“ in den Haupttext eingetragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst erhaltener poetischer Wiederholung. Das Bild vom Arm und der Steinvergleich bleiben stehen. „Reglos“ ist im Deutschen im Zusammenhang mit dem Stein natürlicher als ein wörtliches „still“, während die Fußnote die lexikalische Mehrdeutigkeit wahrt.
