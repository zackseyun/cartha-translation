source:
  edition: WLC
  text: נָשַׁ֥פְתָּ בְ/רוּחֲ/ךָ֖ כִּסָּ֣/מוֹ יָ֑ם צָֽלֲלוּ֙ כַּֽ/עוֹפֶ֔רֶת בְּ/מַ֖יִם אַדִּירִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/010.yaml
  text: You blew with your wind; the sea covered them[a]. They sank like lead in mighty waters.
translation:
  language: de
  text: Du bliesest mit deinem Wind[a]; das Meer bedeckte sie. Sie sanken wie Blei in gewaltigen Wassern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit deinem Atem«. Das hebräische Wort kann »Wind«, »Atem« oder »Geist« bedeuten; im Zusammenhang der Meerteilung liegt »Wind« am nächsten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁפְתָּ
  choice: du bliesest
  rationale: Das Verb bezeichnet Blasen oder Hauchen. Die einfache Vergangenheitsform gibt die poetisch geschilderte göttliche Handlung direkt und würdig wieder.
- source_word: בְרוּחֲךָ
  choice: mit deinem Wind
  rationale: רוּחַ kann Wind, Atem oder Geist bedeuten. Im Zusammenhang der Meerteilung und zusammen mit »du bliesest« liegt »Wind« am nächsten; »Atem« bleibt als mögliche Bildnuance in der Fußnote erhalten.
- source_word: כִּסָּמוֹ יָם
  choice: das Meer bedeckte sie
  rationale: כסה bedeutet hier »bedecken«; das Suffix bezeichnet die ägyptischen Verfolger. Die Wiedergabe bleibt nah am hebräischen Bild, ohne die Wirkung weiter auszudeuten.
- source_word: צָלֲלוּ
  choice: sie sanken
  rationale: Das Verb bezeichnet hier das Absinken im Wasser und passt unmittelbar zum folgenden Vergleich mit Blei.
- source_word: כָּעוֹפֶרֶת
  choice: wie Blei
  rationale: Die direkte Wiedergabe bewahrt den Vergleich und das Bild großer Schwere.
- source_word: בְּמַיִם אַדִּירִים
  choice: in gewaltigen Wassern
  rationale: אַדִּירִים bezeichnet Macht, Gewalt oder Majestät. »Gewaltige Wasser« gibt die Kraft und Größe der Wassermassen wieder, ohne ungenau »tiefe Wasser« einzutragen.
theological_decisions:
- issue: Bedeutung von רוּחַ im poetisch-theophanischen Zusammenhang
  choice: Wind
  alternative: Atem; Geist
  rationale: Der unmittelbare Zusammenhang der Meerteilung und das Verb »blasen« sprechen vorrangig für Wind, wobei »Atem« das anthropomorphe Bild ebenfalls treffend wiedergibt. »Geist« wird nicht in den Haupttext aufgenommen, da hier kein ausdrücklicher Bezug auf den göttlichen Geist erzwungen werden sollte.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit poetischem Rhythmus. »Du bliesest« ist eine reguläre, heute weniger häufige Präteritumsform, die im dichterischen Kontext würdig und verständlich bleibt. Die Pluralform »Wassern« bewahrt die poetische Bildsprache des hebräischen Textes.
