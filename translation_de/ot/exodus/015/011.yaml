source:
  edition: WLC
  text: מִֽי כָמֹ֤/כָה בָּֽ/אֵלִם֙ יְהוָ֔ה מִ֥י כָּמֹ֖/כָה נֶאְדָּ֣ר בַּ/קֹּ֑דֶשׁ נוֹרָ֥א תְהִלֹּ֖ת עֹ֥שֵׂה פֶֽלֶא־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/011.yaml
  text: Who is like you among the gods, O LORD? Who is like you, majestic in holiness, feared in praises, doing wonders?
translation:
  language: de
  text: Wer ist dir gleich unter den Göttern, HERR? Wer ist dir gleich, majestätisch in Heiligkeit, ehrfurchtgebietend in Lobpreisungen, Wunder vollbringend?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֵלִם
  choice: unter den Göttern
  rationale: Der Plural אֵלִם bezeichnet hier göttliche Wesen bzw. Götter. Die direkte Wiedergabe bewahrt den rhetorischen Vergleich, ohne die behauptete Unvergleichlichkeit des HERRN abzuschwächen.
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen entspricht der vorgegebenen konsultierten Fassung und ist im deutschsprachigen Bibelregister geläufig.
- source_word: נֶאְדָּר בַּקֹּדֶשׁ
  choice: majestätisch in Heiligkeit
  rationale: נֶאְדָּר bezeichnet Herrlichkeit oder Majestät; בַּקֹּדֶשׁ wird als Sphäre bzw. Eigenschaft der Heiligkeit wiedergegeben.
- source_word: נוֹרָא תְהִלֹּת
  choice: furchtgebietend in Ruhmestaten
  rationale: נוֹרָא hat hier den Sinn von Ehrfurcht oder Furcht erregend. תְהִלֹּת kann Lobpreisungen oder preiswürdige Taten bezeichnen; „Ruhmestaten“ ergibt im Parallelismus mit dem Vollbringen von Wundern einen natürlichen und quellengetreuen Sinn.
- source_word: עֹשֵׂה פֶלֶא
  choice: Wunder vollbringend
  rationale: Die Partizipialkonstruktion stellt den HERRN als den dar, der Wunder tut; „vollbringend“ bewahrt die feierliche, fortlaufend charakterisierende Form.
theological_decisions:
- issue: Vergleich mit anderen Göttern
  choice: unter den Göttern
  alternative: unter den Mächtigen
  rationale: Die Übersetzung lässt die genuine Formulierung des hebräischen Textes stehen. Der Vers behauptet durch die rhetorische Frage die Unvergleichlichkeit des HERRN, ohne die Referenz von אֵלִם enger zu bestimmen.
- issue: Mehrdeutigkeit von תְהִלֹּת
  choice: Ruhmestaten
  alternative: Lobpreisungen
  rationale: Beide Deutungen sind grammatisch möglich. „Ruhmestaten“ passt besonders eng zum folgenden „Wunder vollbringend“, ohne den Bezug auf das Lob völlig auszuschließen.
translation_notes:
  register: Poetisch, feierlich und zugleich in modernem Standarddeutsch verständlich. Die beiden parallelen Fragen und die anschließenden Partizipialformulierungen des Hebräischen bleiben erkennbar; unnötige konfessionelle Präzisierungen werden vermieden.
