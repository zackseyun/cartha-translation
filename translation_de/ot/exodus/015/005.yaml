  yaml_path: translation/ot/exodus/015/005.yaml
  text: The depths covered them[a]; they went down into the depths like a stone.
translation:
  language: de
  text: Die tiefen Wasser bedeckten sie; sie sanken in die Meerestiefen wie ein Stein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהֹמֹת
  choice: die Urfluten
  rationale: Der Plural von תְּהוֹם bezeichnet die tiefen Wassermassen. „Urfluten“ bewahrt das poetische Gewicht und unterscheidet den Ausdruck vom folgenden מְצוֹלֹת, ohne eine bestimmte mythologische Deutung festzulegen.
- source_word: יְכַסְיֻמוּ
  choice: bedeckten sie
  rationale: Die Form von כסה mit dem Suffix der 3. Person Plural bedeutet direkt, dass die Wassermassen sie bedeckten.
- source_word: יָרְדוּ
  choice: sie sanken
  rationale: Wörtlich bezeichnet ירד ein Hinabgehen. Im Zusammenhang des Untergangs im Meer gibt „sanken“ die Bewegung im natürlichen modernen Deutsch wieder.
- source_word: בִמְצוֹלֹת
  choice: in die Meerestiefen
  rationale: מְצוֹלָה bezeichnet tiefe Stellen, besonders Meerestiefen. Bei der gerichteten Bewegung wird ב idiomatisch mit „in die“ wiedergegeben; „Meerestiefen“ erhält zugleich den Unterschied zu תְּהֹמֹת.
- source_word: כְּמוֹ
  choice: wie
  rationale: Die gewöhnliche deutsche Entsprechung des Vergleichspartikels.
- source_word: אָבֶן
  choice: ein Stein
  rationale: Die unbestimmte Form ist im deutschen Vergleich natürlich und entspricht dem Bild des hebräischen Textes.
