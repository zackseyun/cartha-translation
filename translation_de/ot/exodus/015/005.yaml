  register: Poetisch und würdevoll, zugleich in modernem Standarddeutsch. Die beiden unterschiedlichen hebräischen Wörter für Wassertiefen werden durch „Urfluten“ und „Meerestiefen“ unterschieden; die Fußnote bietet eine formalere Alternative.
