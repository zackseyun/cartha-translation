  to: Da schrie er zum HERRN, und der HERR zeigte ihm einen Baum. Er warf ihn ins Wasser, und das Wasser wurde trinkbar.[a] Dort gab er ihnen Satzung und Recht, und dort stellte er sie auf die Probe.[b]
  rationale: Die Revision folgt bei עֵץ der grundlegenden Bedeutung „Baum“ und der englischen Audit-Fassung, ohne die Handlung weiter auszudeuten. „Trinkbar“ verbessert die moderne deutsche Kollokation für Wasser; die Fußnote erhält die lexikalische Bedeutung „süß“. Alle übrigen Formulierungen einschließlich der kollektiven Auslegung der Singularsuffixe bleiben bestehen.
