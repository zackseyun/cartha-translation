base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/025.yaml
  text: So he cried out to the LORD, and the LORD showed him a tree. He threw it into the water, and the water became sweet. There he made for them a statute and a judgment, and there he tested them.
translation:
  language: de
  text: Da schrie er zum HERRN, und der HERR zeigte ihm einen Baum. Er warf ihn ins Wasser, und das Wasser wurde trinkbar.[a] Dort gab er ihnen Satzung und Recht, und dort stellte er sie auf die Probe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: wurde süß.'
    reason: Bewahrt das konkrete hebräische Gegenbild zum bitteren Wasser, während der Haupttext die im Kontext gemeinte Trinkbarkeit natürlich ausdrückt.
  - marker: b
    text: 'Das heißt: das Volk Israel; im Hebräischen steht ein Singularpronomen, das sich auf das Volk als Einheit bezieht.'
    reason: Erklärt den Wechsel von der kollektiven Singularform des Ausgangstextes zum idiomatischen deutschen Pluralpronomen.
lexical_decisions:
- source_word: עֵץ
  choice: ein Stück Holz
  rationale: Das hebräische Wort kann sowohl einen Baum als auch Holz beziehungsweise ein Stück Holz bezeichnen. Da Mose es ins Wasser wirft, ist im Deutschen »ein Stück Holz« natürlich und bewahrt die sachliche Offenheit besser als »Baum«.
- source_word: וַיִּמְתְּקוּ הַמָּיִם
  choice: das Wasser wurde genießbar
  rationale: Wörtlich wurde das Wasser »süß«. Im Gegensatz zum zuvor bitteren, untrinkbaren Wasser bezeichnet die Wendung hier, dass es trinkbar beziehungsweise genießbar wurde; eine Fußnote erhält das konkrete Bild.
- source_word: חֹק וּמִשְׁפָּט
  choice: Satzung und Recht
  rationale: Die zwei unterschiedlichen Rechtsbegriffe werden formal unterschieden wiedergegeben. »Satzung« bezeichnet eine festgesetzte Ordnung, »Recht« eine rechtliche Bestimmung oder Rechtsnorm.
- source_word: נִסָּהוּ
  choice: stellte er sie auf die Probe
  rationale: נסה bezeichnet ein Prüfen oder Erproben. »Auf die Probe stellen« ist gegenwärtiges, verständliches Deutsch und legt weder Versuchung zum Bösen noch bloße Wissensgewinnung nahe.
theological_decisions:
- issue: Subjekt von שָׂם und נִסָּהוּ
  choice: 'Gott ist das implizite Subjekt: »gab er … stellte er …«'
  alternative: Mose als nächstgenanntes männliches Subjekt
  rationale: Der HERR ist im vorausgehenden Satz das ausdrücklich handelnde Subjekt; der folgende Zusammenhang in Vers 26 führt Gottes Reden und Prüfen weiter. Die deutsche Übersetzung lässt das Subjekt als Pronomen stehen, ohne eine erklärende Ergänzung einzufügen.
- issue: Numerus des pronominalen Suffixes in נִסָּהוּ
  choice: 'kollektiv auf Israel bezogen: »stellte er sie auf die Probe«'
  alternative: 'singular auf Mose bezogen: »stellte er ihn auf die Probe«'
  rationale: Das maskuline Singularsuffix kann sich auf das kollektiv aufgefasste Volk beziehen, wie auch לֹו unmittelbar zuvor. Der Kontext von Gottes Satzung für Israel und Vers 26 stützt den kollektiven Bezug; die deutsche Form »sie« gibt das gemeinte Volk idiomatisch wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gottesname wird nach verbreiteter deutscher Bibelkonvention mit »HERR« wiedergegeben. Kurze, klare Satzfolge; rechtliche Doppelbezeichnung und die Spannung des göttlichen Prüfens bleiben erhalten.
