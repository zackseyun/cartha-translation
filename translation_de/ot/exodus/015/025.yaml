  terminology: „HERR“, „Satzung und Recht“ sowie „auf die Probe stellen“ sind angemessen. Die Fußnote zum kollektiven Singular erläutert den deutschen Plural sachlich und ohne über das Hebräische hinausgehende Festlegung.
