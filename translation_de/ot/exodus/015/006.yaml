base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/006.yaml
  text: Your right hand[a], O Yahweh, is majestic in power; your right hand, O Yahweh[c][b], shatters the enemy.
translation:
  language: de
  text: Deine rechte Hand, Jahwe[a], ist majestätisch in Kraft[b]; deine rechte Hand, Jahwe, zerschmettert den Feind.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „ist herrlich an Stärke“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „zermalmt den Feind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִינְךָ
  choice: deine rechte Hand
  rationale: יָמִין bezeichnet wörtlich die rechte Hand beziehungsweise Seite. Das konkrete Bild bleibt erhalten und trägt zugleich die poetische Bedeutung von Kraft und siegreichem Handeln.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch den traditionellen Titel „der HERR“ ersetzt.
- source_word: נֶאְדָּרִי
  choice: ist majestätisch
  rationale: Das feminine Partizip bezieht sich auf „rechte Hand“ und bezeichnet Majestät, Herrlichkeit oder Erhabenheit. „Majestätisch“ bewahrt den gehobenen poetischen Ton.
- source_word: בַּכֹּחַ
  choice: in ihrer Kraft
  rationale: כֹּחַ bedeutet Kraft, Stärke oder Macht. Das ergänzte Pronomen macht die Verbindung im Deutschen natürlich, ohne den Sinn zu verändern.
- source_word: תִּרְעַץ
  choice: zerschmettert
  rationale: רָעַץ bezeichnet ein gewaltsames Zerschlagen oder Zermalmen. „Zerschmettert“ gibt die entschiedene Wucht des Siegesliedes wieder; das deutsche Präsens entspricht dem poetisch vergegenwärtigenden Imperfekt.
- source_word: אוֹיֵב
  choice: den Feind
  rationale: Der Singular wird beibehalten und kann im Zusammenhang zugleich kollektiv die feindliche Macht bezeichnen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als persönlichen Namen, während „der HERR“ die traditionelle Ersatzlesung darstellt.
- issue: Zeitwert von תִּרְעַץ
  choice: zerschmettert
  alternative: wird zerschmettern
  rationale: Im poetischen Siegeslied beschreibt die Verbform Jahwes charakteristisches beziehungsweise vergegenwärtigtes Handeln. Das Präsens wahrt diese dichterische Unmittelbarkeit, ohne die Form auf eine ausschließlich zukünftige Aussage festzulegen.
translation_notes:
  register: Gehobene, aber gegenwärtige poetische Sprache. Die zweimalige Anrede „Jahwe“ und die Wiederholung von „deine rechte Hand“ bleiben als prägende Parallelstruktur des hebräischen Siegesliedes erhalten.
