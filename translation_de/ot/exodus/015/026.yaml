source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אִם שָׁמ֨וֹעַ תִּשְׁמַ֜ע לְ/ק֣וֹל יְהוָ֣ה אֱלֹהֶ֗י/ךָ וְ/הַ/יָּשָׁ֤ר בְּ/עֵינָי/ו֙ תַּעֲשֶׂ֔ה וְ/הַֽאֲזַנְתָּ֙ לְ/מִצְוֺתָ֔י/ו וְ/שָׁמַרְתָּ֖ כָּל חֻקָּ֑י/ו כָּֽל הַ/מַּֽחֲלָ֞ה אֲשֶׁר שַׂ֤מְתִּי בְ/מִצְרַ֨יִם֙ לֹא אָשִׂ֣ים עָלֶ֔י/ךָ כִּ֛י אֲנִ֥י יְהוָ֖ה רֹפְאֶֽ/ךָ־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/026.yaml
  text: He said[a], “If you diligently listen to the voice of Yahweh your God, and do what is right in his eyes, and give ear to his commandments, and keep all his statutes, I will put none of the diseases on you that I put on Egypt, for I am Yahweh, your healer.”
translation:
  language: de
  text: 'Er sagte: „Wenn du aufmerksam auf die Stimme Jahwes, deines Gottes, hörst, tust, was in seinen Augen recht ist, auf seine Gebote achtest und alle seine Satzungen hältst, werde ich keine der Krankheiten über dich bringen, die ich über Ägypten gebracht habe; denn ich bin Jahwe, dein Heiler.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn ich bin Jahwe, der dich heilt.“'
    reason: Das hebräische Partizip רֹפְאֶךָ kann sowohl nominal („dein Heiler“) als auch verbal („der dich heilt“) wiedergegeben werden.
lexical_decisions:
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: aufmerksam … hörst
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aufforderung. „Aufmerksam hören“ bewahrt sowohl den Höraspekt als auch den Sinn gehorsamer Beachtung.
- source_word: לְקוֹל
  choice: auf die Stimme
  rationale: Die wörtliche Wiedergabe des hebräischen Ausdrucks bleibt im Deutschen verständlich und bewahrt dessen persönliche, bundestheologische Färbung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְהַיָּשָׁר בְּעֵינָיו
  choice: was in seinen Augen recht ist
  rationale: Die hebräische Bildsprache und der moralische Sinn von יָשָׁר bleiben erhalten.
- source_word: וְהַאֲזַנְתָּ
  choice: auf … achtest
  rationale: Die Form bezeichnet aufmerksames Hinhören. „Achten auf“ unterscheidet die Wendung natürlich vom vorherigen שׁמע und schließt tätige Beachtung ein.
- source_word: לְמִצְוֺתָיו
  choice: auf seine Gebote
  rationale: „Gebote“ ist die klare und übliche Wiedergabe für מִצְוֹת im Bundes- und Gesetzeskontext.
- source_word: וְשָׁמַרְתָּ כָּל חֻקָּיו
  choice: alle seine Satzungen hältst
  rationale: שׁמר bedeutet im Rechtskontext „halten/befolgen“; חֻקִּים bezeichnet festgesetzte Vorschriften oder Satzungen.
- source_word: כָּל הַמַּחֲלָה
  choice: keine der Krankheiten
  rationale: Der kollektive Singular wird im Deutschen idiomatisch pluralisch wiedergegeben, ohne ihn auf eine bestimmte Krankheit einzuengen.
- source_word: שַׂמְתִּי … לֹא אָשִׂים
  choice: gebracht habe … bringen
  rationale: Die Wiederholung desselben Verbs bleibt sichtbar. „Über jemanden bringen“ ist im Deutschen natürlicher als „auf jemanden legen“, ohne die Aussage zum bloßen Zulassen abzuschwächen.
- source_word: רֹפְאֶךָ
  choice: dein Heiler
  rationale: Die substantivische Wiedergabe bewahrt die knappe, namensähnliche Formulierung des hebräischen Partizips; die mögliche verbale Auffassung steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ macht diesen unmittelbar erkennbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Reichweite der Krankheitszusage
  choice: Bedingte Bundeszusage im Blick auf die über Ägypten gebrachten Krankheiten
  alternative: Allgemeine Garantie individueller körperlicher Heilung unter allen Umständen
  rationale: Der Vers bindet die Zusage ausdrücklich an das Hören und Halten der göttlichen Weisungen und verweist auf Gottes Gericht an Ägypten. Die Übersetzung erweitert sie nicht zu einer uneingeschränkten Heilungsgarantie.
- issue: Nominale oder verbale Wiedergabe von רֹפְאֶךָ
  choice: dein Heiler
  alternative: der dich heilt
  rationale: Das Partizip lässt beide Auffassungen zu. Der Haupttext bewahrt die knappe nominale Form; die Fußnote erhält die verbale Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem viergliedrigen Bedingungssatz und der anschließenden Zusage des Hebräischen, wird aber durch idiomatische deutsche Verbwahl flüssig gehalten. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung.
