base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/020.yaml
  text: Then Miriam the prophetess[a], Aaron’s sister, took the tambourine in her hand, and all the women went out after her with tambourines and dancing.
translation:
  language: de
  text: Da nahm Mirjam, die Prophetin, Aarons Schwester, die Handtrommel in die Hand. Alle Frauen zogen mit Handtrommeln und Tänzen hinter ihr her hinaus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… und tanzend“. Das hebräische Wort steht im Plural und kann festliche Tänze oder das Tanzen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: Da nahm
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da“ gibt die zeitliche Folge im Deutschen natürlich wieder.
- source_word: מִרְיָם
  choice: Mirjam
  rationale: Die im modernen deutschen Bibelgebrauch übliche, hebräisch nahe Namensform.
- source_word: הַנְּבִיאָה
  choice: die Prophetin
  rationale: Die feminine Substantivform wird im Deutschen präzise und geläufig mit „Prophetin“ wiedergegeben.
- source_word: אֲחוֹת אַהֲרֹן
  choice: Aarons Schwester
  rationale: Die hebräische Konstruktverbindung wird idiomatisch wiedergegeben; die ausdrückliche Zuordnung zu Aaron bleibt erhalten.
- source_word: הַתֹּף
  choice: die Handtrommel
  rationale: תֹף bezeichnet wahrscheinlich eine tragbare Rahmentrommel. „Handtrommel“ vermeidet die moderne Vorstellung eines Tamburins mit Schellen.
- source_word: בְּיָדָהּ
  choice: in die Hand
  rationale: Im Zusammenhang mit „nahm“ ist der deutsche Akkusativ idiomatisch, obwohl die hebräische Wendung wörtlich „in ihrer Hand“ lautet.
- source_word: וַתֵּצֶאןָ
  choice: zogen ... her
  rationale: יצא bedeutet „hinausgehen/herausgehen“; zusammen mit אַחֲרֶיהָ beschreibt es hier natürlich das folgende, vermutlich prozessionsartige Ziehen.
- source_word: כָל הַנָּשִׁים
  choice: Alle Frauen
  rationale: Die ausdrücklich feminine und umfassende Bezeichnung des Hebräischen wird direkt bewahrt.
- source_word: אַחֲרֶיהָ
  choice: hinter ihr her
  rationale: Die Formulierung gibt das räumliche und gefolgschaftliche Folgen idiomatisch wieder.
- source_word: בְּתֻפִּים
  choice: mit Handtrommeln
  rationale: Der Plural wird konsistent mit dem Singular תֹף übersetzt; die Präposition bezeichnet die Begleitung beziehungsweise das Instrument.
- source_word: וּבִמְחֹלֹת
  choice: und Tänzen
  rationale: Der feminine Plural מְחֹלוֹת bezeichnet festliche Tänze; die nominale Pluralform wird formal bewahrt.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Handtrommel“ ist historisch sachnäher als „Tamburin“; „zogen hinter ihr her“ vermittelt die gemeinschaftliche, prozessionsartige Bewegung.
