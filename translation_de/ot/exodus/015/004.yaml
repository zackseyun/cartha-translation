  text: מַרְכְּבֹ֥ת פַּרְעֹ֛ה וְ/חֵיל֖/וֹ יָרָ֣ה בַ/יָּ֑ם וּ/מִבְחַ֥ר שָֽׁלִשָׁ֖י/ו טֻבְּע֥וּ בְ/יַם סֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/004.yaml
  text: Pharaoh’s chariots and his army he cast into the sea[a], and the choicest of his officers were sunk in the Sea of Reeds.
translation:
  language: de
  text: Die Streitwagen des Pharaos und sein Heer warf er ins Meer, und seine auserlesenen Offiziere wurden im Schilfmeer versenkt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Rotes Meer“. Im Hebräischen steht „Schilfmeer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְכְּבֹת
  choice: Streitwagen
  rationale: Der Plural bezeichnet konkret die Kriegswagen des Pharaos; „Streitwagen“ ist im Deutschen klar und kontextgerecht.
- source_word: פַּרְעֹה
  choice: des Pharaos
  rationale: „Pharao“ ist die etablierte deutsche Wiedergabe des ägyptischen Herrschertitels.
- source_word: וְחֵילוֹ
  choice: und sein Heer
  rationale: חַיִל bezeichnet hier die militärische Streitmacht; „Heer“ passt zum poetisch-feierlichen Register.
- source_word: יָרָה
  choice: warf er
  rationale: Das Verb bedeutet werfen oder schleudern. „warf er“ bewahrt das kräftige Bild und bleibt natürlich.
- source_word: בַיָּם
  choice: ins Meer
  rationale: In Verbindung mit „werfen“ gibt „ins Meer“ die gerichtete Bewegung idiomatisch wieder.
- source_word: וּמִבְחַר
  choice: die Besten
  rationale: Das Substantiv bezeichnet die Ausgewählten beziehungsweise Vorzüglichsten; „die Besten“ ist verständlich und erhält den Auswahlgedanken.
- source_word: שָׁלִשָׁיו
  choice: seiner Offiziere
  rationale: שָׁלִישׁ bezeichnet ranghohe oder ausgewählte Militärangehörige, oft mit Bezug auf Streitwagen. „Offiziere“ vermeidet eine unnötig enge Festlegung.
- source_word: טֻבְּעוּ
  choice: versanken
  rationale: Die Form bezeichnet ein Versenkt- oder Untergetauchtwerden. Das deutsche „versanken“ gibt das Bild flüssig wieder, ohne es allein auf den Tod durch Ertrinken zu verengen.
- source_word: בְיַם סוּף
  choice: im Schilfmeer
  rationale: יַם סוּף bedeutet wörtlich „Schilfmeer“. Diese Wiedergabe folgt dem hebräischen Ausdruck; die traditionelle Bezeichnung wird in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von יַם סוּף
  choice: Schilfmeer
  alternative: Rotes Meer
  rationale: Die ausgangssprachlich nähere Wiedergabe „Schilfmeer“ steht im Haupttext. Die traditionsreiche Bezeichnung „Rotes Meer“ bleibt zur Orientierung in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Satzstellung. Das vorangestellte Objekt und das anschließende „warf er“ bewahren den Nachdruck des hebräischen Liedverses.
