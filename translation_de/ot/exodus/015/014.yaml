  text: The peoples heard; they trembled[a]. Anguish seized the inhabitants of Philistia.
translation:
  language: de
  text: Die Völker hörten und bebten.[a] Angst ergriff die Bewohner des Philisterlandes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Völker haben gehört; sie beben. Qual hat die Bewohner des Philisterlandes ergriffen.“ Die hebräische Poesie lässt neben der einfachen Vergangenheit auch eine lebhaft gegenwärtige oder zukunftsartige Bedeutung zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: hörten es
  rationale: Das Qal Perfekt bezeichnet das Hören. Das ergänzte „es“ ist im Deutschen idiomatisch und verweist auf Gottes zuvor besungene Taten.
- source_word: עַמִּים
  choice: die Völker
  rationale: Der Plural bezeichnet die umliegenden Volksgruppen und bewahrt die poetische Weite des Ausdrucks.
- source_word: יִרְגָּזוּ/ן
  choice: bebten
  rationale: Das Verb רָגַז kann körperliches Beben, Erschütterung oder Unruhe ausdrücken. „bebten“ gibt hier die durch Furcht ausgelöste Reaktion prägnant wieder.
- source_word: חִיל
  choice: Angst
  rationale: Das Substantiv kann qualvolle Angst, Zittern oder ein schmerzhaftes Sich-Winden bezeichnen. „Angst“ ist natürlich verständlich und legt das mögliche Bild von Geburtswehen nicht unnötig fest.
- source_word: אָחַז
  choice: ergriff
  rationale: Das Qal Perfekt von אחז bedeutet „ergreifen, packen“. „ergriff“ ist mit dem abstrakten Subjekt „Angst“ idiomatisch und erhält die überwältigende Wirkung.
- source_word: יֹשְׁבֵי
  choice: die Bewohner
  rationale: Das substantivierte Partizip bezeichnet die in einem Gebiet Wohnenden; „Bewohner“ ist präzises, gegenwärtiges Standarddeutsch.
- source_word: פְּלָשֶׁת
  choice: Philisterland
  rationale: Der Eigenname bezeichnet das Gebiet der Philister. „Philisterland“ ist im Deutschen transparent und unterscheidet das Land von der Volksgruppe.
theological_decisions:
- issue: Zeitliche Perspektive der poetischen Verben
  choice: 'Vergangenheitsdarstellung: „hörten … bebten … ergriff“'
  alternative: 'Vollendete beziehungsweise lebhaft gegenwärtige oder zukunftsartige Wiedergabe: „haben gehört … beben … hat ergriffen“ oder „werden beben“'
  rationale: Das Lied verbindet ein Perfekt mit einer Imperfektform und erneut einem Perfekt. Der Zusammenhang lässt eine rückblickende Schilderung zu, während die hebräische Poesie zugleich eine lebhaft vergegenwärtigende oder vorausblickende Nuance offenhält; diese Spannung wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelität. „Philisterland“ ist für gewöhnliche Leser verständlicher als das fachsprachlichere „Philistäa“. Die Fußnote bewahrt die zeitliche und aspektuelle Offenheit der hebräischen Verbformen.
