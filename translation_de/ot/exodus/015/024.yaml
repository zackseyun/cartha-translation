  text: וַ/יִּלֹּ֧נוּ הָ/עָ֛ם עַל מֹשֶׁ֥ה לֵּ/אמֹ֖ר מַה נִּשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/024.yaml
  text: And the people grumbled against Moses[a], saying, “What shall we drink?”
translation:
  language: de
  text: 'Da murrte das Volk gegen Mose[a] und sagte: »Was sollen wir trinken?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »beschwerte sich über Mose«. Das hebräische Verb bezeichnet gemeinschaftliches Klagen oder Murren, besonders in den Wüstenerzählungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: Da murrte
  rationale: Das Verb לון/לין bezeichnet hier die gemeinschaftliche, missbilligende Klage in der Wüste. »Murren« bewahrt diesen negativen Beiklang und ist im modernen Deutschen weiterhin verständlich.
- source_word: הָעָם
  choice: das Volk
  rationale: עם mit Artikel bedeutet schlicht »das Volk«; eine ausdrückliche Ergänzung wie »Israel« wäre interpretierend.
- source_word: עַל
  choice: gegen
  rationale: Bei einem Verb des Murrens kennzeichnet עַל die Person, gegen die sich die Klage richtet.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Der Personenname folgt der etablierten deutschen Bibelkonvention.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Die hebräische Redeeinleitungsformel wird im Deutschen natürlich als koordinierte Redeeinleitung wiedergegeben. Der Singular richtet sich grammatisch nach dem Kollektivsubstantiv »Volk«.
- source_word: מַה
  choice: Was
  rationale: Das einfache Fragepronomen wird direkt wiedergegeben.
- source_word: נִּשְׁתֶּה
  choice: sollen wir trinken
  rationale: Der Qal-Imperfekt 1. Person Plural von שׁתה drückt im Kontext die unmittelbar drängende Frage aus; »sollen wir trinken« bewahrt die modale Offenheit besser als »können wir trinken«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Murrte« erhält den charakteristischen Wortlaut der Wüstenerzählungen, während die direkte Frage natürlich und unmittelbar formuliert ist.
