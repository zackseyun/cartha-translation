  yaml_path: translation/ot/exodus/015/003.yaml
  text: Yahweh is a warrior[b][a]; Yahweh is his name.
translation:
  language: de
  text: Jahwe[a] ist ein Krieger; Jahwe ist sein Name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche wissenschaftliche Wiedergabe des Tetragramms bewahrt den Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- source_word: אִישׁ מִלְחָמָה
  choice: ein Krieger
  rationale: Die hebräische Wortfügung bedeutet wörtlich etwa „ein Mann des Krieges“. „Ein Krieger“ gibt die idiomatische Bedeutung in natürlichem, prägnantem Deutsch wieder und passt zum poetischen Siegeslied.
- source_word: שְׁמוֹ
  choice: ist sein Name
  rationale: Die verblosen hebräischen Worte werden im Deutschen durch die ergänzte Kopula „ist“ natürlich und mit der betonten Voranstellung des Namens wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. Die Transliteration „Jahwe“ wahrt den persönlichen Gottesnamen; die traditionelle Ersetzung durch „der HERR“ wird in der Fußnote genannt.
- issue: Bildhafte Wendung אִישׁ מִלְחָמָה
  choice: ein Krieger
  alternative: ein Mann des Krieges
  rationale: Die idiomatische Wiedergabe vermeidet im modernen Deutschen eine unnatürliche oder missverständliche Formulierung, ohne die Aussage über Jahwes machtvolles Eingreifen im Kampf abzuschwächen.
translation_notes:
  register: Knappes, kraftvolles und poetisches Standarddeutsch. Die Wiederholung von „Jahwe“ und der parallele Satzbau des Hebräischen bleiben erhalten.
