id: EXO.15.8
reference: Exodus 15:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְ/ר֤וּחַ אַפֶּ֨י/ךָ֙ נֶ֣עֶרְמוּ מַ֔יִם נִצְּב֥וּ כְמוֹ נֵ֖ד נֹזְלִ֑ים קָֽפְא֥וּ תְהֹמֹ֖ת בְּ/לֶב יָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/008.yaml
  text: At the blast of your nostrils the waters piled up[a]; the flowing waters stood like a heap[d][c][b]; the depths congealed in the heart of the sea.
translation:
  language: de
  text: Durch den Atemstoß deiner Nasenlöcher[a] türmten sich die Wasser auf; die strömenden Wasser standen wie ein Haufen[b]; die Tiefen gerannen[c] im Herzen des Meeres[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Durch den Atem deiner Nasenlöcher«; רוּחַ kann auch »Wind« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bedeutet »Haufen« oder »aufgetürmte Masse«; manche Übersetzungen geben im Licht verwandter Berichte »Mauer« wieder.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »erstarrten« beziehungsweise »froren«; das hebräische Verb kann ein Dick- oder Festwerden bezeichnen.'
    reason: lexical_alternative
  - marker: d
    text: Wörtlich »im Herzen des Meeres«, das heißt mitten im Meer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרוּחַ אַפֶּיךָ
  choice: Durch den Atemstoß deiner Nasenlöcher
  rationale: רוּחַ kann »Atem«, »Wind« oder »Geist« bedeuten. In Verbindung mit den Nasenlöchern bezeichnet es hier bildhaft einen kraftvollen Atemstoß. Die konkrete anthropomorphe Bildsprache bleibt erhalten.
- source_word: נֶעֶרְמוּ
  choice: türmten sich … auf
  rationale: Das Verb bezeichnet das Anhäufen oder Auftürmen. Die reflexive deutsche Form gibt das poetische Bild natürlich wieder.
- source_word: מַיִם
  choice: die Wasser
  rationale: Der poetische Plural bewahrt die hebräische Redeweise und bezeichnet die Wassermassen des Meeres.
- source_word: נִצְּבוּ
  choice: standen
  rationale: Das Verb bedeutet, fest zu stehen oder Stellung zu beziehen. »Standen« ist hier direkt und verständlich.
- source_word: נֹזְלִים
  choice: die strömenden Wasser
  rationale: Das Partizip bezeichnet das Fließende oder Strömende. Die Wiedergabe hält den Gegensatz zwischen natürlichem Strömen und festem Stehen fest.
- source_word: כְמוֹ נֵד
  choice: wie ein Haufen
  rationale: נֵד bezeichnet am ehesten eine angehäufte Masse. »Haufen« folgt dem konkreten Wortlaut, ohne aufgrund verwandter Meeresteilungstexte »Mauer« in den Vers einzutragen.
- source_word: קָפְאוּ תְהֹמֹת
  choice: die Tiefen gerannen
  rationale: קפא kann ein Dick- oder Festwerden beziehungsweise Gerinnen bezeichnen. »Gerannen« wahrt das poetische Bild, ohne zwingend modernes physikalisches Gefrieren vorauszusetzen.
- source_word: בְּלֶב יָם
  choice: im Herzen des Meeres
  rationale: Die wörtliche Wendung ist im Deutschen verständlich und erhält die poetische Kraft; gemeint ist die Mitte beziehungsweise das Innere des Meeres.
theological_decisions:
- issue: Anthropomorphe Darstellung Gottes im Lied am Meer
  choice: Das konkrete Bild vom Atemstoß aus Gottes Nasenlöchern wird beibehalten.
  alternative: Abstraktere Wiedergabe als Wirkung von Gottes Zorn.
  rationale: Der hebräische Text schildert Gottes machtvolles Eingreifen mit körperhafter poetischer Sprache. Eine Abstraktion zu »Zorn« würde eine im Kontext nicht erforderliche Deutung an die Stelle des Bildes setzen.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der Parallelismus der drei Satzteile und die eindrücklichen Körper- und Wasserbilder des hebräischen Liedes bleiben erhalten; ungewöhnliche, aber verständliche Wendungen werden durch knappe Fußnoten erläutert.
