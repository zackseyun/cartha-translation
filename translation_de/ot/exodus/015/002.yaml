  terminology: „Jah“ gibt die im Text stehende Kurzform יָהּ treffend wieder und unterscheidet sie sinnvoll vom Tetragramm. „Stärke“, „Rettung“, „preisen“ und „erheben“ sind im Kontext eines Lobgesangs passende und theologisch nicht einengende Wiedergaben.
