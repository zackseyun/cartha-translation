  text: עָזִּ֤/י וְ/זִמְרָת֙ יָ֔הּ וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָ֑ה זֶ֤ה אֵלִ/י֙ וְ/אַנְוֵ֔/הוּ אֱלֹהֵ֥י אָבִ֖/י וַ/אֲרֹמְמֶֽ/נְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/002.yaml
  text: Yah is my strength and song[a], and he has become my salvation. This is my God, and I will praise him; my father's God, and I will exalt him.
translation:
  language: de
  text: 'Jah ist meine Stärke und mein Lied,

    und er ist mir zur Rettung geworden.

    Das ist mein Gott, und ich will ihn preisen[a],

    der Gott meines Vaters, und ich will ihn erheben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ich will ihm eine Wohnung bereiten“. Das hebräische Verb ist schwer zu deuten und kann möglicherweise auch das Bereiten einer Wohnstätte oder das Schmücken beziehungsweise Verherrlichen ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָזִּי
  choice: meine Stärke
  rationale: Das Substantiv עֹז bezeichnet Stärke oder Macht. „Meine Stärke“ ist im Deutschen natürlich und bewahrt die poetische Aussage.
- source_word: וְזִמְרָת יָהּ
  choice: und mein Lied; Jah ist meine Stärke und mein Lied
  rationale: זִמְרָה kann Lied, Gesang oder Lobgesang bezeichnen. Die traditionelle poetische Verbindung „Stärke und Lied“ passt zum Siegeslied; יָהּ wird als Subjekt der Nominalaussage verstanden.
- source_word: יָהּ
  choice: Jah
  rationale: Hier steht die Kurzform des Gottesnamens, nicht das Tetragramm יהוה. „Jah“ bewahrt diese besondere Form und ihre poetische Wirkung.
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: und er ist mir zur Rettung geworden
  rationale: Die Konstruktion היה mit ל drückt aus, dass jemand für einen anderen zu etwas wird. Die Formulierung bewahrt sowohl das „mir“ als auch den resultativen Sinn.
- source_word: זֶה אֵלִי
  choice: Das ist mein Gott
  rationale: Die Übersetzung gibt die demonstrative Identifizierung klar und idiomatisch wieder.
- source_word: וְאַנְוֵהוּ
  choice: und ich will ihn preisen
  rationale: Das schwierige Verb kann im Kontext als preisen oder verherrlichen verstanden werden; dies entspricht dem poetischen Parallelismus mit „ich will ihn erheben“. Die mögliche Bedeutung „ihm eine Wohnung bereiten“ wird in einer Fußnote erhalten.
- source_word: אֱלֹהֵי אָבִי
  choice: der Gott meines Vaters
  rationale: Die singularische Konstruktverbindung wird präzise und im Deutschen natürlich wiedergegeben.
- source_word: וַאֲרֹמְמֶנְהוּ
  choice: und ich will ihn erheben
  rationale: רומם bedeutet erhöhen oder erheben. „Erheben“ erhält das Bild und den gehobenen Ton des Lobgesangs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יָהּ
  choice: Jah
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich die Kurzform יָהּ. Sie wird nicht an die übliche Wiedergabe des Tetragramms angeglichen.
- issue: Deutung von וְאַנְוֵהוּ
  choice: ich will ihn preisen
  alternative: ich will ihm eine Wohnung bereiten
  rationale: Die Bedeutung des Verbs ist umstritten. Die Hauptfassung folgt dem unmittelbaren Lobkontext und dem Parallelismus, während die mögliche Wohnungsbedeutung in der Fußnote sichtbar bleibt.
translation_notes:
  register: Moderner, würdevoller poetischer Stil mit kurzen parallelen Zeilen. Die Kurzform des Gottesnamens bleibt als „Jah“ erhalten. Der Fußnotenmarker steht unmittelbar bei dem umstrittenen Verb, auf das sich die Anmerkung bezieht.
