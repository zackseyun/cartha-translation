  source_fidelity: Die Übersetzung gibt die poetische Nominalaussage עָזִּי וְזִמְרָת יָהּ angemessen als „Jah ist meine Stärke und mein Lied“ wieder. „… ist mir zur Rettung geworden“ bewahrt die לִי-Konstruktion und den resultativen Sinn von וַיְהִי. Die demonstrative Selbstidentifikation, die beiden Lobabsichten und „der Gott meines Vaters“ entsprechen dem hebräischen Text. Die schwierige Deutung von וְאַנְוֵהוּ wird nicht übermäßig festgelegt, sondern sachgerecht durch eine Fußnote abgesichert.
