  text: תְּבִאֵ֗/מוֹ וְ/תִטָּעֵ֨/מוֹ֙ בְּ/הַ֣ר נַחֲלָֽתְ/ךָ֔ מָכ֧וֹן לְ/שִׁבְתְּ/ךָ֛ פָּעַ֖לְתָּ יְהוָ֑ה מִקְּדָ֕שׁ אֲדֹנָ֖/י כּוֹנְנ֥וּ יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/017.yaml
  text: You will bring them in and plant them on the mountain of your inheritance— the place[a], Yahweh, that you made for your dwelling, the sanctuary, Lord[c][b], that your hands established.
translation:
  language: de
  text: 'Du wirst sie hineinbringen und sie einpflanzen auf dem Berg deines Erbbesitzes[a] – an der Stätte, die du zu deiner Wohnstätte gemacht hast, Jahwe: dem Heiligtum, Herr, das deine Hände gegründet haben.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Der Berg deines Erbbesitzes“ kann umfassend das Land bezeichnen, in dem Gott sein Volk ansiedelt, oder genauer den Berg seines Heiligtums.
    reason: alternative_reading
  - marker: b
    text: Im Hebräischen stehen hier sowohl der Gottesname Jahwe als auch der Titel „Herr“.
    reason: cultural_note
lexical_decisions:
- source_word: תְּבִאֵמוֹ
  choice: Du wirst sie hineinbringen
  rationale: Der Hifil von בוא mit dem Suffix der 3. Person Plural bezeichnet das Hineinbringen an einen Zielort; „hineinbringen“ gibt die Richtung natürlich wieder.
- source_word: וְתִטָּעֵמוֹ
  choice: und sie einpflanzen
  rationale: נטע bedeutet wörtlich „pflanzen“. „Einpflanzen“ bewahrt das poetische Bild einer dauerhaften, sicheren Ansiedlung.
- source_word: בְּהַר נַחֲלָתְךָ
  choice: auf dem Berg deines Erbbesitzes
  rationale: Die Formulierung erhält das Bergmotiv und gibt נַחֲלָה als Besitz beziehungsweise zugeteiltes Eigentum wieder, ohne den geografischen Bezug einzuengen.
- source_word: מָכוֹן לְשִׁבְתְּךָ
  choice: an der Stätte ... zu deiner Wohnung
  rationale: מָכוֹן bezeichnet hier eine fest eingerichtete Stätte. „Stätte“ passt zum gehobenen poetischen Register und bleibt für heutige Leser verständlich.
- source_word: פָּעַלְתָּ
  choice: die du ... gemacht hast
  rationale: פעל ist ein allgemeines Verb des Tuns oder Herstellens. „Gemacht“ wahrt diese Breite und vermeidet die interpretativere Festlegung auf „bereitet“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und dadurch vom unmittelbar folgenden göttlichen Titel unterschieden.
- source_word: מִקְּדָשׁ
  choice: Heiligtum
  rationale: מִקְדָּשׁ bezeichnet einen heiligen Ort beziehungsweise ein Heiligtum; „Heiligtum“ ist die geläufige und präzise deutsche Entsprechung.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: אֲדֹנָי fungiert als göttlicher Titel. „Herr“ bewahrt den Unterschied zum persönlichen Namen „Jahwe“.
- source_word: כּוֹנְנוּ יָדֶיךָ
  choice: das deine Hände gegründet haben
  rationale: כון bezeichnet in dieser poetischen Form das feste Gründen oder Errichten. „Deine Hände“ erhält das anthropomorphe Bild des hebräischen Textes.
theological_decisions:
- issue: Wiedergabe von יְהוָה und אֲדֹנָי im selben Vers
  choice: יְהוָה als „Jahwe“ und אֲדֹנָי als „Herr“
  alternative: Beide Ausdrücke als „Herr“ wiedergeben
  rationale: Der hebräische Text verwendet sowohl den persönlichen Gottesnamen als auch den Titel. Die unterschiedliche Wiedergabe macht diese Unterscheidung sichtbar, ohne zusätzliche Deutung einzutragen.
- issue: Bezug des Berges des Erbbesitzes und des Heiligtums
  choice: Die poetische Offenheit zwischen dem verheißenen Land beziehungsweise Berg und Gottes Heiligtum bleibt erhalten.
  alternative: Den Berg ausdrücklich mit Zion oder ausschließlich mit dem ganzen Land Kanaan identifizieren.
  rationale: Der Vers kann die Ansiedlung Israels umfassend und zugleich Gottes besonderen Heiligtumsort im Blick haben. Die Übersetzung legt den geografischen Bezug nicht enger fest als der Ausgangstext.
- issue: Syntaktisches Verhältnis von מָכוֹן und מִקְּדָשׁ
  choice: 'Beide Ausdrücke als parallele Ortsbezeichnungen wiedergeben: „an der Stätte ... am Heiligtum“'
  alternative: „Heiligtum“ ausdrücklich als Apposition zu „Stätte“ formulieren
  rationale: Die hebräische Poesie stellt die Ausdrücke parallel nebeneinander. Die deutsche Fassung bewahrt diesen Aufbau, ohne die genaue syntaktische Beziehung übermäßig festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Rhythmus. Das konkrete Pflanzbild, die parallelen Ortsangaben und die Unterscheidung zwischen Gottesname und Titel bleiben erhalten.
