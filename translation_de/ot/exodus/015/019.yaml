base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/019.yaml
  text: For Pharaoh’s horses went into the sea with his chariots and with his horsemen[a], and Yahweh brought back the waters of the sea over them[b]; but the sons of Israel walked on dry ground through the midst of the sea.
translation:
  language: de
  text: Denn die Pferde des Pharaos[a] zogen mit seinen Streitwagen und Reitern ins Meer hinein, und Jahwe ließ das Wasser des Meeres über sie zurückströmen; die Israeliten aber[b] gingen auf trockenem Boden mitten im Meer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen die Einzahl „das Pferd des Pharaos“; sie ist hier wohl kollektiv für seine Pferde beziehungsweise seine berittene Streitmacht gebraucht.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und die Israeliten“; die hebräische Verbindung lautet schlicht „und“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Begründung beziehungsweise Erläuterung zum vorausgehenden Liedruf ein und bewahrt den verbindenden Charakter der Partikel.
- source_word: בָא סוּס פַּרְעֹה
  choice: die Pferde des Pharaos zogen … ins Meer hinein
  rationale: בָא bezeichnet hier die Bewegung in das Meer. Das singularische סוּס kann kollektiv für den Pferdebestand beziehungsweise die berittene Streitmacht stehen; der deutsche Plural ist im Zusammenhang natürlich.
- source_word: בְּרִכְבּוֹ וּבְפָרָשָׁיו
  choice: mit seinen Streitwagen und Reitern
  rationale: רֶכֶב kann kollektiv die Wagenstreitmacht bezeichnen; פָּרָשִׁים sind berittene Kämpfer. Die Wiedergabe bleibt konkret und militärisch verständlich.
- source_word: וַיָּשֶׁב יְהוָה … אֶת מֵי הַיָּם
  choice: Da ließ Jahwe das Wasser des Meeres … zurückströmen
  rationale: Die Hifil-Form von שׁוב drückt aus, dass Jahwe die Rückkehr des Wassers bewirkte. „zurückströmen lassen“ gibt den Vorgang und die göttliche Verursachung idiomatisch wieder.
- source_word: עֲלֵהֶם
  choice: über sie
  rationale: Bezeichnet anschaulich, dass das zurückkehrende Wasser die ägyptische Streitmacht überwältigte.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: die Israeliten aber
  rationale: „Israeliten“ ist die natürliche moderne Wiedergabe von „Söhne Israels“. „aber“ macht den sachlichen Gegensatz deutlich, obwohl die hebräische Konjunktion formal nur „und“ lautet.
- source_word: הָלְכוּ בַיַּבָּשָׁה בְּתוֹךְ הַיָּם
  choice: gingen auf trockenem Boden mitten durch das Meer
  rationale: Bewahrt das gewöhnliche Verb „gehen“ und die konkrete Aussage, dass der Meeresboden trocken war; „mitten durch“ gibt die Durchquerung im Inneren des Meeres natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen im modernen Deutschen direkt wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Gegensatz zwischen dem Schicksal der Ägypter und Israels Durchzug
  choice: die Israeliten aber
  alternative: und die Israeliten
  rationale: Das hebräische ו kann schlicht „und“ bedeuten; im Zusammenhang trägt es jedoch einen deutlichen Gegensatz. Die Fußnote hält die formale Alternative offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze halten die Erzählbewegung klar. „Jahwe“ steht für den göttlichen Eigennamen; „Streitwagen“, „Reiter“ und „trockener Boden“ bewahren die konkrete Bildsprache.
