  to: Denn die Pferde des Pharaos[a] zogen mit seinen Streitwagen und Reitern ins Meer hinein, und Jahwe ließ das Wasser des Meeres über sie zurückströmen; die Israeliten aber[b] gingen auf trockenem Boden mitten im Meer.
  rationale: Die Satzfolge wird als ein deutscher Satz mit „und“ verbunden, entsprechend der hebräischen Verknüpfung. Entscheidend ist die Änderung von „mitten durch das Meer“ zu „mitten im Meer“, damit die räumliche Aussage von בְּתוֹךְ ohne zusätzliche Explizierung erhalten bleibt. Die vorhandenen Fußnoten bleiben inhaltlich und strukturell passend.
