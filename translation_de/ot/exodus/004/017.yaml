  terminology: „Stab“ ist für מַטֶּה im Mose-Kontext passend. „Zeichen“ bewahrt אָתוֹת ohne die interpretierende Ergänzung „Wunder-“. Die Alternativen „Stock“ und „tun“ können knapp in Fußnoten dokumentiert werden.
