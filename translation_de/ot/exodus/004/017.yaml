  yaml_path: translation/ot/exodus/004/017.yaml
  text: And take this staff in your hand[b][a], with which you will perform the signs.
translation:
  language: de
  text: Und nimm diesen Stab[a] in deine Hand; mit ihm wirst du die Zeichen[b] vollbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stock“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „tun“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Nimm
  rationale: Das Waw verbindet den Befehl mit der vorherigen Rede; im Deutschen braucht es hier kein ausdrückliches „und“, während der Akkusativobjektmarker unübersetzt bleibt.
- source_word: הַמַּטֶּה הַזֶּה
  choice: diesen Stab
  rationale: מַטֶּה kann „Stab“ oder „Stock“ bezeichnen. „Stab“ passt zu Moses’ Hirtenkontext und wahrt zugleich die spätere Funktion als Zeichenmittel.
- source_word: תִּקַּח
  choice: Nimm
  rationale: Das Qal-Imperfekt der 2. Person Singular hat hier im Zusammenhang eindeutige Aufforderungsfunktion; der deutsche Imperativ ist natürlich und präzise.
- source_word: בְּיָדֶךָ
  choice: in die Hand
  rationale: Beim deutschen Verb „nehmen“ ist die gerichtete Wendung „in die Hand“ idiomatischer als das statische „in deiner Hand“, ohne den Sinn zu verändern.
- source_word: אֲשֶׁר ... בּוֹ
  choice: mit ihm
  rationale: Die Relativkonstruktion bezeichnet den Stab als Instrument. Ein neuer Hauptsatz mit „mit ihm“ ist im Deutschen klar und bildet das instrumentale בּוֹ ausdrücklich ab.
- source_word: תַּעֲשֶׂה
  choice: wirst du ... tun
  rationale: עָשָׂה bedeutet grundsätzlich „tun/machen“. „Die Zeichen tun“ bleibt quellennah und ist in würdigem biblischem Deutsch verständlich; „vollbringen“ wäre stärker interpretierend.
- source_word: הָאֹתֹת
  choice: die Zeichen
  rationale: Die bestimmte Form verweist auf die zuvor genannten Zeichen. Der Text selbst ergänzt nicht „Wunder-“; diese Deutung ergibt sich aus dem Kontext.
theological_decisions:
- issue: Art der Zeichen
  choice: die Zeichen
  alternative: die Wunderzeichen
  rationale: Die Übersetzung bewahrt die schlichte Bezeichnung אוֹת und lässt den erzählerischen Kontext erkennen, dass es sich um außergewöhnliche, von Gott gegebene Zeichen handelt, ohne dies im Haupttext auszudeuten.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Der kurze Befehl und die anschließende Funktionsangabe werden durch ein Semikolon gegliedert. Alle Pronomen beziehen sich eindeutig auf Mose beziehungsweise den Stab.
