  terminology: „Zeichen“ ist für אוֹת angemessen. „Späteren“ gibt הָאַחֲרוֹן hier vorsichtig als zeitlich nachfolgend wieder und vermeidet die nicht zwingende Aussage, es handle sich um das endgültig letzte Zeichen. Die Fußnote benennt die mögliche Alternative sachgerecht.
