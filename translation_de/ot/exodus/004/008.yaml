  source_fidelity: 'Der Konditionalsatz gibt die hebräische Abfolge zutreffend wieder: fehlender Glaube an Mose und fehlendes Hören auf die „Stimme“ des ersten Zeichens führen zum Glauben an die Stimme des späteren Zeichens. Das einleitende וְהָיָה wird idiomatisch durch die deutsche Konditionalstruktur aufgenommen; kein Bedeutungsverlust entsteht.'
