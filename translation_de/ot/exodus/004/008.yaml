  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָה֙ אִם לֹ֣א יַאֲמִ֣ינוּ לָ֔/ךְ וְ/לֹ֣א יִשְׁמְע֔וּ לְ/קֹ֖ל הָ/אֹ֣ת הָ/רִאשׁ֑וֹן וְ/הֶֽאֱמִ֔ינוּ לְ/קֹ֖ל הָ/אֹ֥ת הָ/אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/008.yaml
  text: And it will be[a], if they do not believe you and do not listen to the voice of the first sign, then they will believe the voice of the latter sign.
translation:
  language: de
  text: Und wenn sie dir nicht glauben und nicht auf die Stimme des ersten Zeichens hören, werden sie der Stimme des späteren Zeichens[a] glauben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »des letzten Zeichens«. Das hebräische Wort kann »später« oder »letzt« bedeuten. Da im folgenden Vers noch ein weiteres Zeichen genannt wird, vermeidet »später« hier den Eindruck, dies müsse das endgültig letzte Zeichen sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und wenn
  rationale: Die hebräische Zukunfts- und Bedingungsformel wird im Deutschen natürlich als Einleitung des Konditionalsatzes wiedergegeben; ein wörtliches »Und es wird geschehen« wäre hier unnötig schwerfällig.
- source_word: יַאֲמִינוּ לָךְ
  choice: sie dir nicht glauben
  rationale: אמן im Hifil mit ל bezeichnet hier, Moses Glauben zu schenken; »dir glauben« ist im Deutschen präzise und idiomatisch.
- source_word: יִשְׁמְעוּ
  choice: hören
  rationale: שמע umfasst Hören und Beachten. Mit »auf die Stimme … hören« bleibt sowohl die Wahrnehmung als auch das Beachten des Zeichens im Blick, ohne ausdrücklich »gehorchen« einzutragen.
- source_word: לְקוֹל
  choice: auf die Stimme / der Stimme
  rationale: 'Die Stimme des Zeichens ist ein bewusstes hebräisches Bild: Das Zeichen legt gleichsam Zeugnis ab. Die Formulierung bewahrt dieses Bild statt es zu »Botschaft« zu verflachen.'
- source_word: הָאֹת
  choice: Zeichen
  rationale: אות bezeichnet ein beglaubigendes Zeichen, das im Zusammenhang wunderbar ist; »Zeichen« gibt den Begriff wieder, ohne »Wunder« ausdrücklich hinzuzufügen.
- source_word: הָרִאשׁוֹן
  choice: des ersten
  rationale: ראשון bedeutet hier eindeutig »erstes« und bildet den Gegensatz zum nachfolgenden Zeichen.
- source_word: וְהֶאֱמִינוּ
  choice: werden sie … glauben
  rationale: Die deutsche Stellung kennzeichnet diesen Satz natürlich als Folge des vorausgehenden Bedingungssatzes; ein zusätzliches »dann« ist möglich, aber nicht erforderlich.
- source_word: הָאַחֲרוֹן
  choice: des späteren
  rationale: אחרון kann »später« oder »letztes« bedeuten. »Späteres« wahrt die zeitliche Gegenüberstellung, ohne auszuschließen, dass noch ein weiteres Zeichen folgt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Metapher von der »Stimme des Zeichens« bleibt erhalten, weil sie im Hebräischen zweimal hervorgehoben wird.
