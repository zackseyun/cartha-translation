  yaml_path: translation/ot/exodus/004/003.yaml
  text: And he said[a], “Throw it on the ground.” So he threw it on the ground, and it became a snake[b], and Moses fled from it.
translation:
  language: de
  text: 'Da sagte er: „Wirf ihn auf den Boden!“ Mose warf ihn auf den Boden, und er wurde zu einer Schlange. Da floh Mose vor ihr.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Der Wayyiqtol führt die Erzählung fort. „Da sagte er“ klingt im modernen Deutschen natürlich, ohne eine über den Kontext hinausgehende zeitliche Nuance festzulegen.
- source_word: הַשְׁלִיכֵהוּ
  choice: Wirf ihn
  rationale: Der maskuline Objektsuffix bezieht sich auf den Stab aus dem vorigen Vers. Das deutsche Pronomen „ihn“ entspricht dessen grammatischem Geschlecht.
- source_word: אַרְצָה
  choice: auf den Boden
  rationale: Das Richtungs-he bezeichnet hier die Bewegung zum Boden hin; „auf den Boden“ gibt die konkrete Handlung idiomatisch wieder.
- source_word: וַיַּשְׁלִיכֵהוּ
  choice: Mose warf ihn
  rationale: Die Wiederaufnahme des Namens macht im Deutschen den Handelnden eindeutig und vermeidet eine missverständliche Folge mehrerer maskuliner Pronomen.
- source_word: וַיְהִי לְנָחָשׁ
  choice: und er wurde zu einer Schlange
  rationale: נָחָשׁ bezeichnet eine Schlange; „Schlange“ ist die natürliche moderne Entsprechung. Das Pronomen „er“ nimmt den grammatisch maskulinen „Stab“ auf.
- source_word: וַיָּנָס
  choice: Da floh Mose
  rationale: „Floh“ bewahrt die Stärke des Verbs נוס; „da“ bildet die unmittelbare erzählerische Reaktion ab.
- source_word: מִפָּנָיו
  choice: vor ihr
  rationale: Die Wendung bedeutet wörtlich „von ihrem/seinem Angesicht weg“ und idiomatisch „vor ihr/ihm“. Im Kontext ist die Schlange der natürliche Bezug; wegen des deutschen Genus steht „ihr“.
