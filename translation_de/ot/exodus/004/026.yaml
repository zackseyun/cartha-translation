base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/026.yaml
  text: So he let him alone[a]. Then she said[b], “A bridegroom of blood,” because of the circumcision.
translation:
  language: de
  text: 'Da ließ er von ihm ab. Damals sagte sie: „Ein Blutbräutigam“, wegen der Beschneidungen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen der ungewöhnliche Plural „wegen der Beschneidungen“; möglicherweise sind damit Beschneidungshandlungen oder der Beschneidungsritus gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרֶף מִמֶּנּוּ
  choice: Da ließ er von ihm ab
  rationale: רפה mit מן bezeichnet hier das Aufhören des feindlichen Vorgehens. Die deutsche Wendung bewahrt die im Hebräischen nicht ausdrücklich benannten Pronomenreferenten und klingt zugleich natürlich.
- source_word: אָז
  choice: Damals
  rationale: Das Zeitadverb verweist auf den soeben geschilderten Zeitpunkt und leitet Zippora­s erklärenden Ausspruch ein; „damals“ bildet die zeitliche Bedeutung ab, ohne eine zusätzliche Folgerung einzutragen.
- source_word: אָמְרָה
  choice: sagte sie
  rationale: Die feminine Verbform bezieht sich im unmittelbaren Kontext auf Zippora; das schlichte „sagte“ entspricht dem gewöhnlichen Erzählverb אמר.
- source_word: חֲתַן דָּמִים
  choice: ein Blutbräutigam
  rationale: Die knappe und schwer deutbare hebräische Fügung wird wörtlich-nah bewahrt, ohne ihre kultische oder emotionale Bedeutung festzulegen.
- source_word: לַמּוּלֹת
  choice: wegen der Beschneidungen
  rationale: Die seltene Pluralform wird im Deutschen sichtbar erhalten. Die Präposition ל wird im Kontext erklärend als „wegen“ wiedergegeben.
theological_decisions:
- issue: Referenten in „ließ er von ihm ab“
  choice: Die Pronomen bleiben wie im Hebräischen unausdrücklich identifiziert; im Zusammenhang liegt der HERR als Subjekt und Mose als Objekt nahe.
  alternative: Die Namen „der HERR“ und „Mose“ ausdrücklich einsetzen.
  rationale: Der unmittelbare Kontext stützt diese Zuordnung, doch die hebräische Formulierung nennt die Beteiligten nicht erneut. Die Übersetzung bewahrt deshalb die formale Mehrdeutigkeit.
- issue: Bedeutung von „Blutbräutigam“
  choice: Die schwierige Wendung wird unaufgelöst beibehalten.
  alternative: Sie als Ausdruck des Abscheus, als rituelle Bezeichnung oder als eindeutige Anrede an Mose beziehungsweise den Sohn auslegen.
  rationale: Der kulturelle und emotionale Sinn der Wendung ist unsicher; eine erklärende Paraphrase würde mehr festlegen, als der Text erkennen lässt.
- issue: Plural von לַמּוּלֹת
  choice: „Beschneidungen“ im Plural
  alternative: „Beschneidung“ oder „Beschneidungsritus“ im Singular
  rationale: Der ungewöhnliche hebräische Plural ist textlich vorhanden und sollte in einer quellennahen deutschen Fassung nicht stillschweigend eingeebnet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwer verständliche Wendung „Blutbräutigam“ sowie die pronominale Mehrdeutigkeit werden bewusst nicht interpretierend aufgelöst. Der Fußnotenmarker steht unmittelbar nach der erklärungsbedürftigen Schlusswendung.
