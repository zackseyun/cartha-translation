  source_fidelity: Die Übersetzung gibt die Abfolge von וַיִּרֶף ... אָז אָמְרָה angemessen wieder. „ließ er von ihm ab“ bildet das Aufhören des gegen ihn gerichteten Handelns idiomatisch und ohne die im Hebräischen nur kontextuell erschließbaren Referenten ausdrücklich festzulegen. „Blutbräutigam“ bewahrt die schwierige, nicht sicher deutbare Wendung חֲתַן דָּמִים. Der seltene Plural לַמּוּלֹת wird korrekt als „Beschneidungen“ wiedergegeben.
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. „Da ließ er von ihm ab. Damals sagte sie“ ist leicht formelhaft, aber narrativ verständlich und stilistisch vertretbar; die Wiederaufnahme der Zeitfolge entspricht dem hebräischen Text. „Blutbräutigam“ ist bewusst ungewöhnlich, jedoch wegen der ebenso ungewöhnlichen hebräischen Idiomatik passend.
  terminology: „Beschneidungen“ und „Blutbräutigam“ sind quellennah und theologisch nicht überinterpretierend. Die Fußnote erläutert den Plural und mögliche ritualbezogene Nuancen, ohne eine umstrittene Deutung festzuschreiben.
