  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ בְּ/מִדְיָ֔ן לֵ֖ךְ שֻׁ֣ב מִצְרָ֑יִם כִּי מֵ֨תוּ֙ כָּל הָ֣/אֲנָשִׁ֔ים הַֽ/מְבַקְשִׁ֖ים אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/019.yaml
  text: And Yahweh said to Moses in Midian[a], “Go, return to Egypt, because all the men who were seeking your life are dead.”
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose in Midian: »Geh, kehre nach Ägypten zurück[a], denn alle Männer, die dir nach dem Leben trachteten, sind tot.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich stehen im Hebräischen zwei Befehlsformen: „Geh, kehre nach Ägypten zurück.“ Sinngemäß auch: „Kehre nach Ägypten zurück.“'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Entspricht der üblichen hebräischen Erzählform und klingt in modernem Deutsch natürlich.
- source_word: בְּמִדְיָן
  choice: in Midian
  rationale: Die Präposition bezeichnet hier den Ort, an dem Jahwe zu Mose sprach.
- source_word: לֵךְ שֻׁב
  choice: Geh, kehre … zurück
  rationale: Bewahrt beide hebräischen Imperative. Die bewusst nachdrückliche Form bleibt verständlich; eine Glättung zu nur einem Verb wird in der Fußnote genannt.
- source_word: מִצְרָיִם
  choice: nach Ägypten
  rationale: Die im Deutschen idiomatische Richtungsangabe bei „zurückkehren“.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung des Befehls klar und würdig ein.
- source_word: מֵתוּ
  choice: sind tot
  rationale: Drückt die aus der vollendeten Handlung resultierende gegenwärtige Lage aus.
- source_word: כָּל הָאֲנָשִׁים
  choice: alle Männer
  rationale: אֲנָשִׁים bezeichnet hier konkret die Männer, die Mose töten wollten.
- source_word: הַמְבַקְשִׁים אֶת נַפְשֶׁךָ
  choice: die dir nach dem Leben trachteten
  rationale: 'Gibt die hebräische Wendung idiomatisch und präzise wieder: Gemeint ist das Bestreben, Mose zu töten.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn, anstatt ihn durch den traditionellen Ersatztitel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Doppelaufforderung bleibt im Haupttext erhalten; die feste Wendung „jemandem nach dem Leben trachten“ vermittelt die Tötungsabsicht natürlich und präzise.
