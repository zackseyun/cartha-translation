  text: וְ/אָמַרְתָּ֖ אֶל פַּרְעֹ֑ה כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּנִ֥/י בְכֹרִ֖/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/022.yaml
  text: 'Then you shall say to Pharaoh[a], ‘Thus says Yahweh: Israel is my firstborn son.’'
translation:
  language: de
  text: 'Dann sollst du zum Pharao sagen: »So spricht Jahwe: Israel ist mein erstgeborener Sohn.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Israel ist mein Sohn, mein Erstgeborener.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Dann sollst du sagen
  rationale: Das Qal-Perfekt 2. Person Singular mit vorangestelltem Waw hat im Zusammenhang einer Anweisung an Mose auffordernde und zugleich fortführende Bedeutung. »Dann« gibt die Abfolge natürlich wieder, »sollst du sagen« bewahrt den Weisungscharakter.
- source_word: אֶל־פַּרְעֹה
  choice: zum Pharao
  rationale: Die Präposition bezeichnet den Adressaten; im Deutschen ist »zum Pharao sagen« die natürliche Verbindung.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste Botenformel wird im Deutschen idiomatisch und würdevoll mit »So spricht« wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die ausdrückliche Sohnesmetapher bleibt erhalten und wird nicht zu einem geschlechtsneutralen Ausdruck abgeschwächt.
- source_word: בְכֹרִי
  choice: mein erstgeborener
  rationale: »Erstgeborener« bewahrt den familiären Begriff und lässt offen, welche zeitliche, rechtliche oder rangbezogene Dimension im Vordergrund steht.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname steht in einer verblosen Nominalkonstruktion zu »mein Sohn, mein Erstgeborener«; die deutsche Satzfassung ergänzt idiomatisch »ist«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. »Jahwe« bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Sohnes- und Erstgeburtsmetapher für Israel
  choice: Israel ist mein erstgeborener Sohn
  alternative: Israel ist mein Sohn, mein Erstgeborener
  rationale: Die Hauptfassung ist im heutigen Deutsch flüssig und bewahrt sowohl die Sohnschaft als auch den Erstgeburtsstatus. Die Alternative folgt Wortfolge und Gliederung des Hebräischen enger und wird deshalb in der Fußnote festgehalten.
translation_notes:
  register: Modernes, verständliches und zugleich feierliches Standarddeutsch. Die traditionelle Botenformel »So spricht« wahrt den gehobenen Ton, ohne altertümliche Formen zu verwenden. Der Fußnotenmarker steht unmittelbar nach der Aussage, auf die sich die Variante bezieht.
