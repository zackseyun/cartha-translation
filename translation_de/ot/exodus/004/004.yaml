base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/004.yaml
  text: Then Yahweh said to Moses[a], “Reach out your hand and take hold of its tail.” So he reached out his hand and took hold of it[b], and it became a staff in his hand.
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: »Streck deine Hand aus und fass sie am Schwanz.« Da streckte er seine Hand aus, fasste sie, und sie wurde in seiner Hand zu einem Stab.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Stock«.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Wiedergabe des Gottesnamens bewahrt den Eigennamen des hebräischen Textes, statt ihn durch einen Titel zu ersetzen.
- source_word: שְׁלַח יָדְךָ
  choice: Streck deine Hand aus
  rationale: Die Wendung gibt die konkrete Bewegung natürlich wieder und bewahrt die Verbindung zwischen Befehl und Ausführung.
- source_word: וֶאֱחֹז בִּזְנָבוֹ
  choice: pack sie am Schwanz
  rationale: אָחַז bezeichnet das Ergreifen oder Festhalten; die deutsche Formulierung ist in dieser Gefahrensituation anschaulich und idiomatisch. Das feminine Pronomen bezieht sich auf die Schlange aus dem vorhergehenden Vers.
- source_word: וַיַּחֲזֶק בּוֹ
  choice: packte sie
  rationale: חזק mit ב bezeichnet hier ein festes Ergreifen. Die Wiedergabe nimmt den Wortlaut des vorausgehenden Befehls natürlich auf, ohne die unterschiedlichen hebräischen Verben vollständig gleichzusetzen.
- source_word: וַיְהִי לְמַטֶּה
  choice: sie wurde zu einem Stab
  rationale: היה mit ל bezeichnet hier einen Zustandswechsel; מַטֶּה meint einen Stab oder Stock.
- source_word: בְּכַפּוֹ
  choice: in seiner Hand
  rationale: כַּף kann genauer die Handfläche bezeichnen, doch 'in seiner Hand' ist im Deutschen die natürliche und sachlich passende Formulierung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. 'Jahwe' bewahrt diesen Namen, während 'der HERR' ihn durch einen traditionellen Ersatztitel wiedergibt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die knappe Abfolge des hebräischen Textes und die Wiederholung von Handbewegung und Ergreifen bleiben erhalten.
