id: EXO.4.23
reference: Exodus 4:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וָ/אֹמַ֣ר אֵלֶ֗י/ךָ שַׁלַּ֤ח אֶת בְּנִ/י֙ וְ/יַֽעַבְדֵ֔/נִי וַ/תְּמָאֵ֖ן לְ/שַׁלְּח֑/וֹ הִנֵּה֙ אָנֹכִ֣י הֹרֵ֔ג אֶת בִּנְ/ךָ֖ בְּכֹרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/023.yaml
  text: And I said to you, ‘Send out my son so that he may serve me,’ but you refused to send him out. Look, I am about to kill your son, your firstborn.
translation:
  language: de
  text: 'Und ich sagte zu dir: »Lass meinen Sohn ziehen, damit er mir dient!« Aber du hast dich geweigert, ihn ziehen zu lassen. Sieh, ich werde deinen Sohn, deinen Erstgeborenen, töten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלַּח
  choice: Lass … ziehen
  rationale: Der Piel-Imperativ bedeutet hier, jemanden freizugeben bzw. fortziehen zu lassen; die im Deutschen geläufige Wendung wahrt sowohl den Zwangskontext als auch die Bewegungsnuance.
- source_word: וְיַעַבְדֵנִי
  choice: damit er mir dient
  rationale: עבד bezeichnet hier Israels Dienst für Gott und bleibt mit »dienen« bewusst offen zwischen Gottesdienst und umfassender Dienstbarkeit.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel leitet die nachdrückliche göttliche Ankündigung ein; »Sieh« ist knapp und würdevoll.
- source_word: אָנֹכִי הֹרֵג
  choice: ich werde … töten
  rationale: Das Partizip mit ausdrücklichem אָנֹכִי kündigt eine unmittelbar bevorstehende, feststehende Handlung an; das deutsche Futur gibt die Drohung natürlich wieder.
- source_word: בְּכֹרֶךָ
  choice: deinen Erstgeborenen
  rationale: Die Apposition identifiziert den zuvor genannten Sohn ausdrücklich als Pharaos Erstgeborenen.
theological_decisions:
- issue: Bezeichnung Israels als Gottes Sohn
  choice: meinen Sohn
  alternative: mein Volk
  rationale: Der Singular בְּנִי wird beibehalten und trägt die theologische Vater-Sohn-Metapher aus Vers 22 weiter, ohne sie aufzulösen.
- issue: Art des Dienstes für Gott
  choice: mir dient
  alternative: mich anbetet
  rationale: »Dient« bewahrt den weiteren Bedeutungsumfang von עבד und legt den Ausdruck nicht ausschließlich kultisch aus.
- issue: Göttliche Tötungsankündigung
  choice: ich werde … töten
  alternative: ich bin im Begriff … zu töten
  rationale: Die direkte Form bewahrt die Härte und Verantwortungszuschreibung des hebräischen Wortlauts; die unmittelbar bevorstehende Bedeutung des Partizips wird im Deutschen durch die Zukunftsaussage ausreichend vermittelt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Ton. Die wiederholte Wendung »ziehen lassen« bildet die hebräische Wiederholung ab; keine konfessionell geprägte Zusatzdeutung.
