  source_fidelity: 'Der Text gibt die Satzfolge und die zentralen hebräischen Ausdrücke zuverlässig wieder: die frühere Rede ("ich sagte zu dir"), die Freilassung des als Gottes Sohn bezeichneten Israel, dessen Dienst für Gott, die Weigerung und die Ankündigung gegen den erstgeborenen Sohn. Die Apposition „deinen Sohn, deinen Erstgeborenen“ entspricht dem Hebräischen. Das Futur bei „ich werde ... töten“ ist für das ankündigende Partizip הֹרֵג idiomatisch und wahrt die direkte Aussage.'
  naturalness: Modernes, gut verständliches Standarddeutsch. Die Wiederholung von „ziehen lassen“ ist stilistisch tragfähig und bildet die Wiederholung von שׁלח angemessen ab. „Sieh“ ist knapp und im würdigen, direkten Register passend.
  terminology: „Meinen Sohn“ bewahrt die im Kontext etablierte Vater-Sohn-Metapher. „Dient“ gibt עבד ausreichend weit wieder, ohne den Dienst auf Kult oder Anbetung zu verengen. „Erstgeborenen“ ist die etablierte und präzise Wiedergabe von בכור.
