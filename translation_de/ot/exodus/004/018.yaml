  text: וַ/יֵּ֨לֶךְ מֹשֶׁ֜ה וַ/יָּ֣שָׁב אֶל יֶ֣תֶר חֹֽתְנ֗/וֹ וַ/יֹּ֤אמֶר ל/וֹ֙ אֵ֣לֲכָה נָּ֗א וְ/אָשׁ֨וּבָה֙ אֶל אַחַ֣/י אֲשֶׁר בְּ/מִצְרַ֔יִם וְ/אֶרְאֶ֖ה הַ/עוֹדָ֣/ם חַיִּ֑ים וַ/יֹּ֧אמֶר יִתְר֛וֹ לְ/מֹשֶׁ֖ה לֵ֥ךְ לְ/שָׁלֽוֹם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/018.yaml
  text: Then Moses went and returned to Jethro his father-in-law and said to him[a], “Please let me go and return to my brothers who are in Egypt, so that I may see whether they are still alive.” And Jethro said to Moses[b], “Go in peace.”
translation:
  language: de
  text: 'Da ging Mose zurück zu Jeter, seinem Schwiegervater, und sagte zu ihm: „Bitte lass mich zu meinen Brüdern[a] nach Ägypten zurückkehren, damit ich sehe, ob sie noch am Leben sind.“ Jitro[b] sagte zu Mose: „Geh in Frieden!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ kann hier auch die weitere Verwandtschaft oder die Volksgenossen meinen.
    reason: lexical_alternative
  - marker: b
    text: Im ersten Satzteil steht im Hebräischen die Namensform „Jeter“, hier dagegen „Jitro“; gemeint ist dieselbe Person.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֵּלֶךְ ... וַיָּשָׁב
  choice: Da ging Mose zurück
  rationale: Die beiden aufeinanderfolgenden Erzählformen führen die Handlung weiter; im Deutschen gibt „Da ging ... zurück“ den natürlichen Fortgang und die Rückkehr wieder, ohne das schwerfällige „ging und kehrte zurück“.
- source_word: יֶתֶר / יִתְרוֹ
  choice: Jeter / Jitro
  rationale: Der hebräische Text verwendet im selben Vers tatsächlich zwei Namensformen. Die Übersetzung bewahrt diesen Unterschied und erläutert ihn in einer Fußnote, statt ihn stillschweigend zu harmonisieren.
- source_word: חֹתְנוֹ
  choice: seinem Schwiegervater
  rationale: Im Kontext bezeichnet das Wort den Vater von Moses Frau; „Schwiegervater“ ist präzise und natürlich.
- source_word: אֵלֲכָה נָּא וְאָשׁוּבָה
  choice: Bitte lass mich ... zurückkehren
  rationale: Kohortativformen zusammen mit נָא drücken hier eine höfliche, respektvolle Bitte aus.
- source_word: אַחַי
  choice: meinen Brüdern
  rationale: Die wörtliche Bedeutung ist „meine Brüder“; je nach Kontext kann das Wort auch die weitere Verwandtschaft oder Volksgenossen bezeichnen. Diese Bedeutungsbreite wird in der Fußnote offengelegt.
- source_word: וְאֶרְאֶה
  choice: damit ich sehe
  rationale: Im Zusammenhang bezeichnet die Form den Zweck der Rückkehr. Die deutsche Konstruktion gibt diesen Zielbezug klar wieder.
- source_word: הַעוֹדָם חַיִּים
  choice: ob sie noch am Leben sind
  rationale: Dies ist eine natürliche deutsche Wiedergabe der hebräischen Frage nach ihrem fortdauernden Leben und bewahrt Moses geäußerte Ungewissheit.
- source_word: לֵךְ לְשָׁלוֹם
  choice: Geh in Frieden!
  rationale: Die feste hebräische Wendung ist ein Segens- oder Entlassungsgruß; „Geh in Frieden“ ist im Deutschen idiomatisch und inhaltlich genau.
theological_decisions: []
