source:
  edition: WLC
  text: וְ/הָיָ֡ה אִם לֹ֣א יַאֲמִ֡ינוּ גַּם֩ לִ/שְׁנֵ֨י הָ/אֹת֜וֹת הָ/אֵ֗לֶּה וְ/לֹ֤א יִשְׁמְעוּ/ן֙ לְ/קֹלֶ֔/ךָ וְ/לָקַחְתָּ֙ מִ/מֵּימֵ֣י הַ/יְאֹ֔ר וְ/שָׁפַכְתָּ֖ הַ/יַּבָּשָׁ֑ה וְ/הָי֤וּ הַ/מַּ֨יִם֙ אֲשֶׁ֣ר תִּקַּ֣ח מִן הַ/יְאֹ֔ר וְ/הָי֥וּ לְ/דָ֖ם בַּ/יַּבָּֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/009.yaml
  text: And if they do not believe even these two signs and do not listen to your voice[a], then you shall take some of the water of the Nile and pour it on the dry ground[b], and the water that you take from the Nile will become blood on the dry ground.
translation:
  language: de
  text: Und wenn sie selbst diesen beiden Zeichen nicht glauben und nicht auf dich hören[a], dann nimm etwas Wasser aus dem Nil und gieße es auf den trockenen Boden; das Wasser, das du aus dem Nil nimmst, wird auf dem trockenen Boden zu Blut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nicht auf deine Stimme hören“; gemeint sein kann auch: „deiner Stimme nicht gehorchen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird sich in Blut verwandeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Und wenn
  rationale: Die Verbindung leitet idiomatisch einen Bedingungsfall ein; „Und wenn“ wahrt den hebräischen Erzählfluss, ohne das wörtliche „Und es wird geschehen, wenn“ unnötig nachzubilden.
- source_word: יַאֲמִינוּ ... לִשְׁנֵי הָאֹתוֹת הָאֵלֶּה
  choice: selbst diesen beiden Zeichen nicht glauben
  rationale: „Glauben“ gibt den Hifil von אמן in diesem Beweiszusammenhang natürlich wieder. „Selbst“ bringt das steigernde גַּם zum Ausdruck, und „diesen beiden Zeichen“ bezeichnet die zuvor genannten Wunderzeichen.
- source_word: יִשְׁמְעוּן לְקֹלֶךָ
  choice: nicht auf dich hören
  rationale: Die deutsche Wendung „auf jemanden hören“ gibt das hebräische Idiom שמע לְקול natürlich wieder und umfasst sowohl Zuhören als auch Beachten.
- source_word: מִמֵּימֵי הַיְאֹר
  choice: etwas Wasser aus dem Nil
  rationale: „Etwas Wasser“ bildet den partitiven Sinn von מִן idiomatisch ab; „Nil“ ist im Exoduskontext die übliche Wiedergabe von יְאֹר.
- source_word: הַיַּבָּשָׁה / בַּיַּבָּשֶׁת
  choice: auf den trockenen Boden
  rationale: Die Formulierung bezeichnet trockenes Land im Gegensatz zum Wasser. Die Wiederholung bleibt erhalten, weil sie auch im Hebräischen in beiden Satzteilen steht.
- source_word: וְשָׁפַכְתָּ
  choice: gieße es
  rationale: שפך bedeutet hier schlicht „gießen/ausgießen“; das im Hebräischen aus dem Zusammenhang erschlossene Objekt wird im Deutschen mit „es“ aufgenommen.
- source_word: וְהָיוּ ... לְדָם
  choice: wird ... zu Blut werden
  rationale: היה mit לְ bezeichnet hier Ergebnis oder Verwandlung. „Zu Blut werden“ ist im Deutschen direkt, verständlich und wahrt die Aussage des Ausgangstextes.
- source_word: דָם
  choice: Blut
  rationale: Das Substantiv bedeutet eindeutig „Blut“; der Kontext bietet keinen Grund für eine Abschwächung oder metaphorische Wiedergabe.
theological_decisions:
- issue: Art des Zeichens, bei dem Nilwasser zu Blut wird
  choice: 'direkte Verwandlung: „wird ... zu Blut werden“'
  alternative: „wird blutrot werden“ oder „wird wie Blut aussehen“
  rationale: Die hebräische Konstruktion היה + לדם sagt ohne Einschränkung aus, dass das Wasser zu Blut wird. Eine bloße Farbveränderung oder Ähnlichkeit wäre eine nicht im Text enthaltene naturalisierende Abschwächung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das hebräische Stimmen-Idiom wird im Haupttext natürlich deutsch wiedergegeben und in der Fußnote transparent gemacht. Die zweimalige Ortsangabe „auf dem trockenen Boden“ bleibt entsprechend der bewussten Wiederholung im Ausgangstext erhalten.
