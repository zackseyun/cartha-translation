base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/001.yaml
  text: Then Moses answered and said[a], “But behold, they will not believe me, and they will not listen to my voice, for they will say[b], ‘Yahweh has not appeared to you.’”
translation:
  language: de
  text: 'Mose antwortete: »Aber sieh, sie werden mir nicht glauben und nicht auf mich hören[a], denn sie werden sagen: ›Jahwe[b] ist dir nicht erschienen.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf meine Stimme hören«; die hebräische Wendung kann auch »mir Gehör schenken« oder »mir gehorchen« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Traditionell wird der Gottesname יהוה mit »der HERR« wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֹשֶׁה וַיֹּאמֶר
  choice: Da antwortete Mose und sagte
  rationale: Die beiden hebräischen Redeverben werden beibehalten. „Da“ führt die erzählerische Folge natürlich weiter, während „antwortete … und sagte“ den dialogischen Charakter und die formale Doppelung des Ausgangstextes wahrt.
- source_word: וְהֵן
  choice: Aber sieh
  rationale: Die Partikel leitet Moses Einwand ein und lenkt zugleich die Aufmerksamkeit auf seine Befürchtung. „Aber sieh“ gibt beide Funktionen in verständlichem, nicht altertümlichem Deutsch wieder.
- source_word: לֹא יַאֲמִינוּ לִי
  choice: sie werden mir nicht glauben
  rationale: Das Hifil von אמן bezeichnet hier das Glauben beziehungsweise Vertrauen gegenüber Moses Botschaft und Beauftragung. „Mir nicht glauben“ ist im Kontext die naheliegende deutsche Wiedergabe.
- source_word: וְלֹא יִשְׁמְעוּ בְּקֹלִי
  choice: und nicht auf mich hören
  rationale: Die Verbindung שׁמע בקול kann „auf jemanden hören“, „jemandem Gehör schenken“ oder „gehorchen“ bedeuten. „Auf mich hören“ ist natürlich und bewahrt die Spannweite besser als das hier möglicherweise zu starke „mir gehorchen“.
- source_word: כִּי יֹאמְרוּ
  choice: denn sie werden sagen
  rationale: כִּי begründet Moses Befürchtung; „denn“ stellt diesen erklärenden Zusammenhang klar dar.
- source_word: לֹא נִרְאָה אֵלֶיךָ
  choice: ist dir nicht erschienen
  rationale: Das Nifal von ראה bedeutet hier „erscheinen“. Das deutsche Perfekt entspricht der abgeschlossenen, für die Gegenwart bedeutsamen Behauptung im direkten Zitat.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen geläufige Form der wissenschaftlichen Umschrift und vermeidet die Ersetzung des Namens durch einen Titel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ lässt den Charakter als Gottesname erkennen; die traditionelle Ersatzlesung „der HERR“ wird in einer Fußnote genannt.
- issue: Bedeutungsumfang von שׁמע בקול
  choice: auf mich hören
  alternative: mir gehorchen
  rationale: Im unmittelbaren Zusammenhang geht es zunächst darum, ob Israel Moses Bericht annimmt. „Gehorchen“ würde die mögliche Bedeutung stärker auf Gehorsam festlegen, als es der Kontext erfordert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Doppelung „antwortete … und sagte“ bleibt aus Gründen der Formnähe erhalten; die idiomatische Wendung שׁמע בקול wird dagegen natürlich als „auf mich hören“ formuliert. Die direkte Rede ist mit deutschen Anführungszeichen und inneren einfachen Anführungszeichen gesetzt.
