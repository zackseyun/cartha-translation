source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהוָ֨ה ל֜/וֹ ע֗וֹד הָֽבֵא נָ֤א יָֽדְ/ךָ֙ בְּ/חֵיקֶ֔/ךָ וַ/יָּבֵ֥א יָד֖/וֹ בְּ/חֵיק֑/וֹ וַ/יּ֣וֹצִאָ֔/הּ וְ/הִנֵּ֥ה יָד֖/וֹ מְצֹרַ֥עַת כַּ/שָּֽׁלֶג־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/006.yaml
  text: Then Yahweh said to him again[a], “Please put your hand into your bosom.” So he put his hand into his bosom, and when he brought it out, behold, his hand was leprous, like snow.
translation:
  language: de
  text: 'Da sagte Jahwe noch einmal zu ihm: „Steck doch deine Hand in die Falte deines Gewandes.“ Er steckte seine Hand hinein. Er zog sie wieder heraus, und siehe, da war seine Hand aussätzig[a], wie Schnee.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet einen Zustand aus dem Bereich der im Alten Testament צָרַעַת genannten Erkrankungen oder Hautveränderungen. Dieser muss nicht genau der heutigen Lepra (Hansen-Krankheit) entsprechen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen ausdrücklich stehenden Gottesnamen in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: עוֹד
  choice: noch einmal
  rationale: Kennzeichnet hier in der Abfolge der Zeichen eine weitere, erneut erteilte Anweisung.
- source_word: הָבֵא נָא
  choice: Steck doch
  rationale: „Stecken“ ist bei einer Hand im Gewand idiomatisch; „doch“ gibt die den Imperativ abmildernde beziehungsweise eindringliche Nuance von נָא natürlich wieder.
- source_word: חֵיק
  choice: Bausch deines Gewandes
  rationale: Bezeichnet hier den Brustbereich beziehungsweise die durch das Gewand gebildete Falte, in die man die Hand steckt. Die Wiedergabe vermeidet das heute missverständliche „Busen“.
- source_word: וַיּוֹצִאָהּ
  choice: Als er sie wieder herauszog
  rationale: Das Suffix bezieht sich auf die Hand. Die temporale Fügung gibt die Handlungsfolge in natürlichem Deutsch wieder; „wieder“ verdeutlicht die Gegenbewegung zum Hineinstecken.
- source_word: וְהִנֵּה
  choice: siehe, da
  rationale: Bewahrt die überraschende, vor Augen führende Wirkung der hebräischen Präsentationsformel in würdigem, verständlichem Deutsch.
- source_word: מְצֹרַעַת
  choice: aussätzig
  rationale: Die knappe traditionelle Wiedergabe bezeichnet einen Zustand, der zur alttestamentlichen Kategorie צָרַעַת gehört; eine Fußnote verhindert die vorschnelle Gleichsetzung mit moderner Lepra.
- source_word: כַּשָּׁלֶג
  choice: wie Schnee
  rationale: Bewahrt den knappen Vergleich des Hebräischen, ohne ausdrücklich „weiß“ hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen und ist die im modernen Deutschen übliche wissenschaftliche Umschrift.
- issue: Deutung von מְצֹרַעַת
  choice: aussätzig, mit begriffsklärender Fußnote
  alternative: von einer Hautkrankheit befallen
  rationale: Der traditionelle Ausdruck hält die Verbindung zur biblischen Kategorie צָרַעַת offen. Die Fußnote macht deutlich, dass damit nicht zwingend die heute als Hansen-Krankheit bezeichnete Lepra gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bausch deines Gewandes“ macht den antiken Sachbezug verständlich; „siehe, da“ erhält die dramatische Präsentation. Die knappe Formulierung „wie Schnee“ bewahrt die Bildhaftigkeit und mögliche Offenheit des hebräischen Vergleichs.
