  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו מִ֣י שָׂ֣ם פֶּה֮ לָֽ/אָדָם֒ א֚וֹ מִֽי יָשׂ֣וּם אִלֵּ֔ם א֣וֹ חֵרֵ֔שׁ א֥וֹ פִקֵּ֖חַ א֣וֹ עִוֵּ֑ר הֲ/לֹ֥א אָנֹכִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/011.yaml
  text: And the LORD said to him, “Who has put a mouth on man? Or who makes one mute, or deaf, or sighted, or blind? Is it not I, the LORD?”
translation:
  language: de
  text: 'Da sagte der HERR zu ihm: „Wer hat dem Menschen einen Mund gegeben? Oder wer macht stumm oder taub, sehend oder blind? Bin nicht ich es, der HERR?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂם פֶּה לָאָדָם
  choice: dem Menschen einen Mund gegeben
  rationale: Die hebräische Wendung bedeutet wörtlich, dem Menschen einen Mund zu setzen bzw. zu geben. „Gegeben“ ist im Deutschen natürlich und bewahrt den Gedanken, dass der HERR der Schöpfer menschlicher Fähigkeiten ist.
- source_word: אִלֵּם
  choice: stumm
  rationale: Direkte und sachgemäße Wiedergabe der bezeichneten Unfähigkeit zu sprechen.
- source_word: חֵרֵשׁ
  choice: taub
  rationale: Entspricht der üblichen Bedeutung des hebräischen Wortes in dieser Aufzählung körperlicher Fähigkeiten und Einschränkungen.
- source_word: פִקֵּחַ
  choice: sehend
  rationale: Im Gegensatz zu „blind“ bezeichnet das Wort hier einen Menschen, dessen Augen geöffnet sind bzw. der sehen kann. „Sehend“ erhält die parallele Form der Aufzählung.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchenstil wird als „HERR“ dargestellt; der Artikel folgt dem natürlichen deutschen Satzbau.
theological_decisions:
- issue: Gottes Verhältnis zu menschlichen Fähigkeiten und Einschränkungen
  choice: „wer macht stumm oder taub, sehend oder blind?“
  alternative: Eine abschwächende Formulierung wie „wer lässt zu, dass jemand stumm oder taub wird“
  rationale: Der hebräische Text verwendet ausdrücklich יָשׂוּם („macht/setzt“) und führt alle genannten Zustände auf den HERRN zurück. Die theologische Spannung wird nicht durch eine bloße Zulassungsformel aufgelöst.
- issue: Rhetorische Selbstidentifikation des HERRN
  choice: „Bin nicht ich es, der HERR?“
  alternative: „Bin ich es nicht, der HERR?“
  rationale: Beide Formen sind möglich; die gewählte Fassung klingt im modernen Deutsch natürlich und bewahrt den Nachdruck des hebräischen אָנֹכִי.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe rhetorische Struktur und die paarweise Gegenüberstellung „stumm oder taub, sehend oder blind“ bleiben erhalten. Keine Fußnoten erforderlich.
