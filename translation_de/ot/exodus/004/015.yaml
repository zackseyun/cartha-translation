  text: וְ/דִבַּרְתָּ֣ אֵלָ֔י/ו וְ/שַׂמְתָּ֥ אֶת הַ/דְּבָרִ֖ים בְּ/פִ֑י/ו וְ/אָנֹכִ֗י אֶֽהְיֶ֤ה עִם פִּ֨י/ךָ֙ וְ/עִם פִּ֔י/הוּ וְ/הוֹרֵיתִ֣י אֶתְ/כֶ֔ם אֵ֖ת אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/015.yaml
  text: You shall speak to him and put the words in his mouth[a], and I will be with your mouth and with his mouth[b], and I will instruct you what you shall do.
translation:
  language: de
  text: Du sollst zu ihm sprechen und ihm die Worte in den Mund legen. Und ich werde mit deinem Mund und mit seinem Mund sein und euch lehren, was ihr tun sollt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: Du sollst zu ihm sprechen
  rationale: Die Verbform hat in diesem Anweisungszusammenhang auffordernde Bedeutung. „Zu ihm sprechen“ gibt דבר mit אל direkt und natürlich wieder.
- source_word: וְשַׂמְתָּ אֶת־הַדְּבָרִים בְּפִיו
  choice: und ihm die Worte in den Mund legen
  rationale: Die feste deutsche Wendung bewahrt das konkrete hebräische Bild und bezeichnet, dass Mose Aaron die auszusprechenden Worte vorgibt.
- source_word: וְאָנֹכִי אֶהְיֶה עִם־פִּיךָ וְעִם־פִּיהוּ
  choice: Und ich werde mit deinem Mund und mit seinem Mund sein
  rationale: Die körperbezogene Bildsprache des Hebräischen wird bewusst erhalten, statt sie deutend als bloße Hilfe beim Reden aufzulösen.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: und euch lehren
  rationale: Das Hifil von ירה bedeutet hier „lehren/anweisen“. „Euch“ gibt den hebräischen Plural eindeutig wieder und bezieht Mose und Aaron gemeinsam ein.
- source_word: אֵת אֲשֶׁר תַּעֲשׂוּן
  choice: was ihr tun sollt
  rationale: Die Relativkonstruktion wird idiomatisch mit „was“ wiedergegeben; „ihr“ bewahrt die eindeutig pluralische Verbform.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Beistand beim Sprechen
  choice: Die Formulierung „mit deinem Mund und mit seinem Mund sein“ bleibt im Haupttext erhalten.
  alternative: „dir und ihm beim Reden beistehen“
  rationale: Die konkrete Formulierung drückt Gottes Gegenwart und Befähigung aus, ohne die Bildsprache durch eine erklärende Paraphrase einzuengen.
- issue: Pluralischer Bezug der abschließenden Anweisung
  choice: „euch … was ihr tun sollt“
  alternative: Eine singularische oder unbestimmte Wiedergabe
  rationale: Die hebräischen Formen sind ausdrücklich pluralisch und beziehen Mose und Aaron zusammen ein; im Deutschen lässt sich dieser Numerus ohne Zusatz klar ausdrücken.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die konkrete hebräische Bildsprache wird bewahrt; unnötige erklärende Zusätze und konfessionelle Festlegungen werden vermieden.
