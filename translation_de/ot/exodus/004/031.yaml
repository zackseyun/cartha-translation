  source_fidelity: 'Der Entwurf gibt die hebräische Abfolge und die zentralen Aussagen sachgerecht wieder: Das Volk glaubte; es hörte von Jahwes Zuwendung zu den Israeliten und davon, dass er ihr Elend gesehen hatte; darauf folgten Verneigung und Anbetung. „Sich der Israeliten annehmen“ trifft פקד in diesem positiven Kontext idiomatisch und ohne unzulässige Konkretisierung. Die Wiedergabe von עני als „Elend“ ist angemessen.'
