  terminology: „Jahwe“ gibt den im Grundtext stehenden Gottesnamen wieder. „Israeliten“ ist im Deutschen eine natürliche Volksbezeichnung für בני ישראל und verändert den Referenzumfang nicht. Die Begriffe „Elend“ und „anbeten“ sind registergerecht.
