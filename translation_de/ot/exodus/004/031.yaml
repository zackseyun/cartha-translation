  text: וַֽ/יַּאֲמֵ֖ן הָ/עָ֑ם וַֽ/יִּשְׁמְע֡וּ כִּֽי פָקַ֨ד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/כִ֤י רָאָה֙ אֶת עָנְיָ֔/ם וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/031.yaml
  text: And the people believed[a]; and when they heard that Yahweh had visited the sons of Israel and that he had seen their affliction[c][b], they bowed down and worshiped.
translation:
  language: de
  text: Da glaubte das Volk. Als sie hörten, dass Jahwe sich der Israeliten angenommen und ihr Elend gesehen hatte, verneigten sie sich und beteten ihn an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּאֲמֵן
  choice: Da glaubte
  rationale: Das Hifil von אמן bezeichnet hier, dass das Volk der durch Mose und Aaron überbrachten Botschaft und den Zeichen Glauben schenkte. Ein ausdrückliches Objekt wird wie im Hebräischen nicht ergänzt.
- source_word: וַיִּשְׁמְעוּ כִּי
  choice: Als sie hörten, dass
  rationale: Die Formulierung gibt den zeitlichen und zugleich begründenden Zusammenhang der Reaktion in natürlichem Deutsch wieder.
- source_word: פָקַד יְהוָה
  choice: Jahwe sich … angenommen hatte
  rationale: פקד meint hier Gottes aufmerksame, wirksame Zuwendung. „Sich annehmen“ ist im Deutschen natürlich und bringt mehr als bloßes Bemerken zum Ausdruck, ohne die konkrete Art des Eingreifens vorwegzunehmen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Israeliten
  rationale: Die hebräische Wendung bedeutet wörtlich „Söhne Israels“, bezeichnet hier jedoch das ganze Volk. „Israeliten“ ist im modernen Deutsch eindeutig und schließt nicht unbeabsichtigt die Frauen aus.
- source_word: רָאָה אֶת עָנְיָם
  choice: ihr Elend gesehen hatte
  rationale: עֳנִי bezeichnet bedrückendes Elend, Leiden oder Not. „Elend“ bewahrt die Schwere des Ausdrucks; „gesehen“ erhält das konkrete hebräische Bild göttlicher Wahrnehmung.
- source_word: וַיִּקְּדוּ
  choice: verneigten sie sich
  rationale: קדד bezeichnet das Niederbeugen des Körpers. „Sich verneigen“ unterscheidet die körperliche Geste klar vom anschließenden Akt der Anbetung.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: beteten ihn an
  rationale: Das Verb bezeichnet Niederwerfung als Huldigung oder Anbetung. Im Zusammenhang ist Jahwe das eindeutige Ziel; das Pronomen sorgt im Deutschen für eine vollständige, natürliche Formulierung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im hebräischen Text ausdrücklich gebrauchte Bundesname erkennbar bleibt.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung ist eine herkömmliche Volksbezeichnung und umfasst hier das ganze Volk. „Israeliten“ gibt ihren Bezug im Deutschen präzise wieder, ohne eine nur männliche Teilgruppe nahezulegen.
- issue: Bedeutungsumfang von פקד
  choice: sich annehmen
  alternative: heimsuchen / besuchen / nach jemandem sehen
  rationale: Im Kontext bezeichnet das Verb Gottes fürsorgliche Aufmerksamkeit mit bevorstehendem Eingreifen. „Sich annehmen“ wahrt diesen positiven, wirksamen Sinn, ohne ihn konfessionell weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah an der hebräischen Handlungsfolge, vermeidet jedoch missverständliche Hebraismen. Keine Fußnote ist nötig, da die gewählten Formulierungen den Sinn im Kontext klar und ohne Verlust einer entscheidenden Mehrdeutigkeit wiedergeben.
