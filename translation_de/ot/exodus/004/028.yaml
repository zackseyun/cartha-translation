    issue: Die Wendung »die er ihm zu tun befohlen hatte« ergänzt »zu tun«, das im hebräischen Text nicht ausdrücklich steht.
    rationale: Die Zeichen sind zwar im Kontext vorzuführen, aber der Text sagt nur, dass Jahwe Mose sie geboten/aufgetragen hatte. Eine deutsche Formulierung ohne ergänzten Infinitiv bewahrt die Knappheit des Ausgangstextes besser.
  - severity: low
    issue: »Mose berichtete Aaron alle Worte« ist verständlich, aber weniger idiomatisch als eine Konstruktion mit »mitteilen«.
    rationale: »Jemandem etwas mitteilen« ist für die Mitteilung eines Auftrags im modernen Standarddeutsch die geläufigere, natürliche Formulierung.
