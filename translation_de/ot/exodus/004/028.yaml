  text: וַ/יַּגֵּ֤ד מֹשֶׁה֙ לְ/אַֽהֲרֹ֔ן אֵ֛ת כָּל דִּבְרֵ֥י יְהוָ֖ה אֲשֶׁ֣ר שְׁלָח֑/וֹ וְ/אֵ֥ת כָּל הָ/אֹתֹ֖ת אֲשֶׁ֥ר צִוָּֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/028.yaml
  text: Moses told Aaron all the words of Yahweh who had sent him[a], and all the signs that he had commanded him.
translation:
  language: de
  text: Mose teilte Aaron alle Worte Jahwes mit, der ihn gesandt hatte[a], und alle Zeichen, die er ihm aufgetragen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle Worte Jahwes, mit denen er ihn gesandt hatte«. Der hebräische Relativsatz kann enger mit »Worte« verbunden werden; in beiden Lesarten ist Jahwe derjenige, der Mose sandte.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: berichtete
  rationale: Das Hifil von נגד bedeutet hier »bekannt machen, mitteilen, berichten«. »Berichtete« passt natürlich zur erzählenden Situation, in der Mose Aaron über seinen Auftrag informiert.
- source_word: דִּבְרֵי יְהוָה
  choice: Worte Jahwes
  rationale: דָּבָר kann »Wort«, »Sache« oder »Botschaft« bedeuten. Der Plural mit כָּל wird als »alle Worte« wiedergegeben und bewahrt den Bezug auf die einzelnen Bestandteile des göttlichen Auftrags.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form »Jahwe« wiedergegeben, statt ihn durch einen Titel wie »der HERR« zu ersetzen.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: der ihn gesandt hatte
  rationale: Die Wiedergabe bezieht den Relativsatz auf Jahwe und drückt aus, dass Jahwe Mose gesandt hatte. Die grammatisch mögliche engere Verbindung mit »Worte« bleibt in einer Fußnote erhalten.
- source_word: הָאֹתֹת
  choice: die Zeichen
  rationale: אוֹת bezeichnet ein Zeichen und im Exoduskontext häufig ein von Gott gegebenes Wunderzeichen. »Zeichen« ist direkt und vermeidet eine unnötige interpretierende Erweiterung.
- source_word: אֲשֶׁר צִוָּהוּ
  choice: die er ihm zu tun befohlen hatte
  rationale: Wörtlich steht »die er ihm befohlen hatte«. Im Deutschen wird die im Zusammenhang vorausgesetzte Ausführung der Zeichen mit »zu tun« ausgedrückt, damit der Satz natürlich und eindeutig bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. »Jahwe« bewahrt diesen Namen, während »der HERR« ihn durch einen traditionellen Titel ersetzen würde.
- issue: Bezug des Relativsatzes אֲשֶׁר שְׁלָחוֹ
  choice: Jahwe, der Mose gesandt hatte
  alternative: die Worte, mit denen Jahwe Mose gesandt hatte
  rationale: Beide Bezüge sind sprachlich möglich und führen inhaltlich dazu, dass Jahwe Mose mit seinem Auftrag sandte. Der Haupttext wählt die im Deutschen klarere personale Beziehung; die echte syntaktische Mehrdeutigkeit wird durch die Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Formulierungen bleiben nahe an den hebräischen Schlüsselbegriffen »Worte« und »Zeichen«; eine im Deutschen notwendige Ergänzung bei der Ausführung der Zeichen wird knapp gehalten.
