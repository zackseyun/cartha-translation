source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן וַ/יַּ֣אַסְפ֔וּ אֶת כָּל זִקְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/029.yaml
  text: Then Moses and Aaron went and gathered all the elders of the sons of Israel[a].
translation:
  language: de
  text: Da gingen Mose und Aaron hin und versammelten alle Ältesten der Söhne Israels[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Israeliten“; traditionell: „der Kinder Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Da gingen … hin
  rationale: Der Wayyiqtol führt die Erzählung fort; „gingen … hin“ gibt הלך natürlich wieder. Obwohl das hebräische Verb bei den beiden verbundenen Subjekten im Singular steht, verlangt das Deutsche den Plural.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Im Deutschen übliche Form des Personennamens.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Im Deutschen übliche Form des Personennamens.
- source_word: וַיַּאַסְפוּ
  choice: versammelten
  rationale: אסף bezeichnet hier das Zusammenrufen von Personen zu einer Versammlung; „versammelten“ ist im Deutschen idiomatisch und kontextgerecht.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: Der hebräische Akkusativmarker hat im Deutschen keine selbstständige Entsprechung.
- source_word: כָּל
  choice: alle
  rationale: כָּל bezeichnet hier die Gesamtheit der Ältesten und wird direkt mit „alle“ wiedergegeben.
- source_word: זִקְנֵי
  choice: Ältesten
  rationale: זְקֵנִים bezeichnet in diesem Zusammenhang anerkannte Repräsentanten beziehungsweise Leiter der Gemeinschaft; „Älteste“ bewahrt sowohl den Wortbezug zum Alter als auch die soziale Funktion.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Die Wiedergabe erhält die ausdrückliche hebräische Abstammungsbezeichnung und ihre Verbindung zum Stammvater Israel; geläufigere Alternativen werden in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  alternative: der Israeliten; der Kinder Israels
  rationale: Die Formulierung bewahrt die im Hebräischen ausdrücklich männliche Abstammungsbezeichnung und die darin anklingende Identität als Nachkommen Israels, ohne sie zu einem bloßen Volksnamen einzuebnen. Da im Deutschen „Söhne Israels“ missverständlich ausschließlich einzelne Männer bezeichnen kann, nennt die Fußnote die idiomatische kollektive Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da“ sorgt für einen natürlichen erzählerischen Anschluss; „hingehen“ wird als trennbares Verb um die beiden Subjekte geführt. Die quellennähere Wendung „Söhne Israels“ bleibt im Haupttext erhalten und wird durch idiomatische Alternativen in der Fußnote ergänzt.
