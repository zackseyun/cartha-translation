- from: 'Da sagte Mose zu Jahwe: „Ach, Herr! Ich bin kein Mann der Rede[a] – weder seit gestern noch seit vorgestern und auch nicht, seit du zu deinem Diener redest. Denn mein Mund ist schwer und meine Zunge ist schwer.“[b]'
  to: 'Da sagte Mose zu Jahwe: „Ach, Herr! Ich bin kein Mann der Rede[a] – weder gestern noch vorgestern und auch nicht, seit du zu deinem Diener geredet hast. Denn mein Mund ist schwer und meine Zunge ist schwer.“[b]'
  rationale: 'Die zeitliche Abfolge wurde an die hebräische Syntax angeglichen: „gestern“ und „vorgestern“ stehen ohne „seit“, während „seit“ allein die anschließende Bezugnahme auf Gottes Reden einleitet. Die bildhafte, nicht diagnostische Beschreibung von Moses’ Sprechschwierigkeit und die vorhandenen Fußnoten bleiben unverändert erhalten.'
