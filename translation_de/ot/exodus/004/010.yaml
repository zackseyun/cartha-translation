base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/010.yaml
  text: Then Moses said to Yahweh[a], “Please, Lord, I am not a man of words, neither yesterday nor the day before, nor since you have spoken to your servant[b]; for I am heavy of mouth and heavy of tongue.”
translation:
  language: de
  text: 'Da sagte Mose zu Jahwe: „Ach, Herr! Ich bin kein Mann der Rede[a] – weder gestern noch vorgestern und auch nicht, seit du zu deinem Diener geredet hast. Denn mein Mund ist schwer und meine Zunge ist schwer.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „kein Mann von Worten“; gemeint sein kann, dass Mose nicht redegewandt ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „schwer an Mund und schwer an Zunge“. Das Bild bezeichnet Schwierigkeiten beim Sprechen, lässt aber offen, ob mangelnde Beredsamkeit oder eine Sprechbeeinträchtigung gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch den Titel „HERR“ ersetzt.
- source_word: בִּי אֲדֹנָי
  choice: Ach, Herr!
  rationale: בִּי ist hier eine ehrerbietige, flehentliche Einleitung; „Ach“ gibt den bittenden Ton im natürlichen Deutschen wieder, während אֲדֹנָי als Anrede „Herr“ bleibt.
- source_word: לֹא אִישׁ דְּבָרִים אָנֹכִי
  choice: Ich bin kein Mann der Rede
  rationale: Die ungewöhnliche nominale Wendung bewahrt das hebräische Bild stärker als das deutende „ich bin nicht redegewandt“, ohne im Deutschen die missverständliche Redensart „Mann großer Worte“ zu verwenden.
- source_word: גַּם מִתְּמוֹל גַּם מִשִּׁלְשֹׁם
  choice: weder seit gestern noch seit vorgestern
  rationale: Die zeitliche Paarformel wird eng am Hebräischen wiedergegeben und betont, dass Moses Schwierigkeit nicht erst jetzt besteht.
- source_word: גַּם מֵאָז דַּבֶּרְךָ אֶל עַבְדֶּךָ
  choice: und auch nicht, seit du zu deinem Diener redest
  rationale: Das Präsens „redest“ erfasst den im Zusammenhang noch andauernden Vorgang von Gottes Reden, ohne ihn als abgeschlossen festzulegen.
- source_word: עַבְדֶּךָ
  choice: dein Diener
  rationale: In Moses ehrerbietiger Selbstbezeichnung ist „Diener“ kontextgemäßer als „Sklave“.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für Moses Einwand ein.
- source_word: כְבַד פֶּה וּכְבַד לָשׁוֹן
  choice: mein Mund ist schwer und meine Zunge ist schwer
  rationale: Die Formulierung erhält das doppelte Bild und den Parallelismus des Hebräischen; sie vermeidet eine Festlegung darauf, ob mangelnde Beredsamkeit, Unsicherheit oder eine körperliche Sprechbeeinträchtigung gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als persönlichen Namen und unterscheidet ihn von der unmittelbar folgenden Anrede אֲדֹנָי („Herr“).
- issue: Art von Moses Sprechschwierigkeit
  choice: Das Bild „Mund ist schwer und Zunge ist schwer“ bleibt erhalten.
  alternative: nicht redegewandt; schwerfällig im Reden; sprachbehindert
  rationale: Der hebräische Text bestimmt die genaue Art der Schwierigkeit nicht. Die bildhafte Wiedergabe wahrt diese echte Mehrdeutigkeit und vermeidet eine medizinische oder psychologische Diagnose.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst ungewohnten Bilder „Mann der Rede“ sowie „Mund ist schwer und Zunge ist schwer“ spiegeln die Ausdrucksweise des Hebräischen; Fußnoten erschließen sie, ohne die Mehrdeutigkeit im Haupttext aufzulösen.
