source:
  edition: WLC
  text: וַ/יְהִ֥י בַ/דֶּ֖רֶךְ בַּ/מָּל֑וֹן וַ/יִּפְגְּשֵׁ֣/הוּ יְהוָ֔ה וַ/יְבַקֵּ֖שׁ הֲמִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/024.yaml
  text: And it happened on the way[a], at the lodging place[b], that Yahweh met him and sought to put him to death.
translation:
  language: de
  text: Unterwegs, an einer Unterkunft[b], begegnete Jahwe ihm[a] und suchte ihn zu töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wen »ihm« und »ihn« bezeichnen, sagt der hebräische Text nicht ausdrücklich; gemeint sein kann Mose oder nach manchen Deutungen sein Sohn.
    reason: alternative_reading
  - marker: b
    text: Wörtlich etwa »am Übernachtungsort«; gemeint ist ein Platz zum Übernachten, nicht unbedingt eine kommerzielle Herberge.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[nicht eigens wiedergegeben]'
  rationale: Die hebräische narrative Einleitungsformel wird im Deutschen natürlich durch den direkten Einsatz der Situationsangaben und des Erzählpräteritums wiedergegeben; ein wörtliches »Und es geschah« wäre unnötig formelhaft.
- source_word: בַדֶּרֶךְ
  choice: Unterwegs
  rationale: Knappes, idiomatisches Deutsch für die lokative Wendung »auf dem Weg«.
- source_word: בַמָּלוֹן
  choice: an einem Ort, wo sie übernachteten
  rationale: מָלוֹן bezeichnet einen Übernachtungsort, ohne zwingend ein kommerzielles Gasthaus zu meinen. Die Formulierung vermeidet den möglichen Anachronismus »Herberge« und ist natürlich verständlich.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: begegnete ihm
  rationale: Gibt den lexikalischen Kern von פגע wieder, ohne die feindliche Absicht bereits in das Verb hineinzulesen; diese folgt ausdrücklich im nächsten Satzglied.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen übliche Form.
- source_word: וַיְבַקֵּשׁ
  choice: suchte
  rationale: Bewahrt die Grundbedeutung von בקש sowie die auffällige narrative Spannung der Aussage, statt sie deutender mit »versuchte« oder »wollte« aufzulösen.
- source_word: הֲמִיתוֹ
  choice: ihn zu töten
  rationale: Klare und gewichtige Wiedergabe des kausativen Infinitivs von מות mit maskulinem Singularsuffix.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Wiedergabe als Eigenname wahrt diese Unterscheidung gegenüber einem ersetzenden Titel.
- issue: Bezug der männlichen Pronominalsuffixe
  choice: Die Mehrdeutigkeit bleibt durch »ihm« und »ihn« erhalten.
  alternative: Explizite Identifikation als Mose oder als sein Sohn
  rationale: Der hebräische Vers nennt den Bezugsgegenstand nicht ausdrücklich. Eine namentliche Festlegung würde eine Auslegung in den Haupttext eintragen und die Spannung des Textes beseitigen.
- issue: Göttliche Tötungsabsicht
  choice: »suchte ihn zu töten«
  alternative: »versuchte, ihn zu töten« oder »wollte ihn töten«
  rationale: Die ungewöhnliche Formulierung folgt בקש eng und vermeidet sowohl die Vorstellung eines bloß gescheiterten Versuchs als auch eine Abschwächung der im Text stehenden Bedrohung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Erzählpräteritum sorgt für einen natürlichen narrativen Fluss. Die Pronomen bewahren bewusst die Mehrdeutigkeit des hebräischen Textes; beide Fußnotenmarker stehen an den einschlägigen Stellen im Haupttext.
