  text: Nun geh! Ich selbst werde dir beim Reden beistehen[a] und dich lehren, was du sagen sollst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit deinem Mund“.'
    reason: Die Fußnote bewahrt die konkrete hebräische Ausdrucksweise, während der Text eine natürliche deutsche Wiedergabe ihrer kontextuellen Bedeutung bietet.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nun
  rationale: Die Zeit- und Diskurspartikel leitet Gottes unmittelbare Folgerung aus Moses Einwand ein; „Nun“ ist knapp, natürlich und dringlich.
- source_word: לֵךְ
  choice: geh
  rationale: Der einfache Imperativ gibt den direkten Auftrag ohne unnötige Erweiterung wieder.
- source_word: וְאָנֹכִי אֶהְיֶה
  choice: Ich selbst werde sein
  rationale: Das selbstständige Pronomen אָנֹכִי trägt Nachdruck. „Ich selbst“ macht diesen im Deutschen hörbar.
- source_word: עִם־פִּיךָ
  choice: mit deinem Mund
  rationale: Die konkrete hebräische Wendung bleibt erhalten und knüpft unmittelbar an Moses Sorge um sein Sprechen an, ohne Gottes Beistand nur erklärend zu paraphrasieren.
- source_word: וְהוֹרֵיתִיךָ
  choice: und dich lehren
  rationale: Der Hifil von ירה bezeichnet hier Unterweisung; „lehren“ ist verständlich und dem Kontext angemessen.
- source_word: אֲשֶׁר תְּדַבֵּר
  choice: was du sagen sollst
  rationale: Die Relativkonstruktion bezeichnet den Inhalt der göttlichen Unterweisung. „sagen sollst“ gibt die aufgetragene künftige Rede in natürlichem Deutsch wieder.
theological_decisions:
- issue: Göttliche Gegenwart bei Moses Beauftragung
  choice: Ich selbst werde mit deinem Mund sein
  alternative: Ich werde dir beim Sprechen helfen
  rationale: Die Übersetzung bewahrt das konkrete und theologisch gewichtige Bild, dass Gott selbst Moses Mund begleitet und befähigt, statt es in eine bloße Wirkungsbeschreibung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Ausruf nach „geh“ wahrt die Kraft des Imperativs; „mit deinem Mund sein“ bleibt bewusst ungewohnt, weil diese konkrete Ausdrucksweise im Hebräischen bedeutungstragend ist.
