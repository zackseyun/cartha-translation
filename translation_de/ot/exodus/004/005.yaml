id: EXO.4.5
reference: Exodus 4:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְמַ֣עַן יַאֲמִ֔ינוּ כִּֽי נִרְאָ֥ה אֵלֶ֛י/ךָ יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֥י יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/005.yaml
  text: so that they may believe that Yahweh[a], the God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob[b], has appeared to you.
translation:
  language: de
  text: damit sie glauben, dass Jahwe[a], der Gott ihrer Väter, der Gott Abrahams, der Gott Isaaks und der Gott Jakobs, dir erschienen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben. Andere Wiedergaben sind „Yahweh“ und „Jehova“.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Leitet den Zweck der vorausgehenden Zeichenhandlung natürlich und präzise ein.
- source_word: יַאֲמִינוּ
  choice: sie glauben
  rationale: Das Hifil von אמן bezeichnet hier, dass die Israeliten Moses Anspruch aufgrund des Zeichens Glauben schenken.
- source_word: כִּי
  choice: dass
  rationale: Führt hier den Inhalt dessen ein, was sie glauben sollen, nicht eine Begründung.
- source_word: נִרְאָה
  choice: erschienen ist
  rationale: Das Nifal von ראה bedeutet hier „erscheinen“; das deutsche Perfekt bezeichnet das abgeschlossene Erscheinen mit gegenwärtiger Bedeutung.
- source_word: אֵלֶיךָ
  choice: dir
  rationale: Idiomatiches Deutsch für die Präposition אֶל mit dem Suffix der 2. Person maskulin Singular.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: der Gott ihrer Väter
  rationale: Bewahrt die maskuline Pluralform und die bundesgeschichtlich geprägte Wendung des Ausgangstextes.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: der Gott Abrahams, der Gott Isaaks und der Gott Jakobs
  rationale: Die dreimalige Wiederholung von „der Gott“ erhält Nachdruck und feierlichen Rhythmus des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; „Jahwe“ gibt den persönlichen Gottesnamen in geläufiger deutscher Form wieder.
- issue: Geschlechtsspezifische Wiedergabe von אֲבֹתָם
  choice: ihrer Väter
  alternative: ihrer Vorfahren
  rationale: „Väter“ entspricht der maskulinen Form des Hebräischen und passt zum unmittelbar folgenden Verweis auf Abraham, Isaak und Jakob.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Satzstruktur wird soweit bewahrt, wie sie im Deutschen natürlich klingt; insbesondere bleibt die feierliche Wiederholung „der Gott …“ erhalten.
