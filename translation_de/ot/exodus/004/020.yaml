  to: Darauf nahm Mose seine Frau und seine Söhne, setzte sie auf den Esel[a] und kehrte in das Land Ägypten zurück. Und Mose nahm den Stab Gottes[b] in die Hand.
  rationale: Die einzige Änderung betrifft die idiomatische deutsche Wiedergabe von בְּיָדוֹ. „In die Hand“ ist in Verbindung mit „nehmen“ natürliches modernes Standarddeutsch und erhält die konkrete Bildlichkeit sowie den Besitzbezug des hebräischen Textes.
