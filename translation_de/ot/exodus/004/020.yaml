  source_fidelity: 'Der Entwurf gibt die hebräische Abfolge und die zentralen Ausdrücke zuverlässig wieder: Mose nimmt Frau und Söhne, lässt sie den Esel besteigen, kehrt in das Land Ägypten zurück und nimmt den Stab Gottes. Die Wiederholung von „Mose“ entspricht dem hebräischen Text. „Söhne“, „Esel“, „Land Ägypten“ und „Stab Gottes“ sind treffend.'
  naturalness: „Den Stab Gottes in seine Hand nehmen“ ist verständlich, klingt im modernen Standarddeutsch jedoch weniger idiomatisch als „in die Hand nehmen“. Der bestimmte Besitzbezug ist im Deutschen in dieser festen Wendung ausreichend klar.
  terminology: „Stab Gottes“ ist für מַטֵּה הָאֱלֹהִים sachgerecht und wahrt die Gottesbezeichnung. Die Fußnote „Stock Gottes“ bietet eine mögliche, wenn auch weniger stilistisch passende lexikalische Alternative; sie ist nicht sinnverändernd.
