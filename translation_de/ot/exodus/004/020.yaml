base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/020.yaml
  text: Then Moses took his wife and his sons[a], set them on the donkey, and returned to the land of Egypt[b]. And Moses took the staff of God in his hand.
translation:
  language: de
  text: Darauf nahm Mose seine Frau und seine Söhne, setzte sie auf den Esel[a] und kehrte in das Land Ägypten zurück. Und Mose nahm den Stab Gottes[b] in die Hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließ sie auf dem Esel reiten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Stock Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Darauf nahm Mose
  rationale: Das narrative Waw führt die Handlung fort. „Darauf“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder; לקח bedeutet hier schlicht „nehmen“.
- source_word: אִשְׁתּוֹ
  choice: seine Frau
  rationale: Direkte Wiedergabe von אִשָּׁה mit dem Suffix der 3. Person Singular; der Name Zippora wird nicht erklärend in den Text eingefügt.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Der hebräische Ausdruck ist ausdrücklich maskuliner Plural und bezeichnet seine Söhne, nicht allgemein seine Kinder.
- source_word: וַיַּרְכִּבֵם
  choice: setzte sie auf
  rationale: Der Hifil von רכב bezeichnet das Veranlassen des Reitens beziehungsweise das Aufsetzen auf ein Reittier. „Setzte sie auf“ ist knapp, natürlich und bewahrt den kausativen Sinn.
- source_word: הַחֲמֹר
  choice: den Esel
  rationale: Der bestimmte Artikel wird direkt wiedergegeben. „Esel“ ist die heutige sachliche Bezeichnung.
- source_word: וַיָּשָׁב
  choice: kehrte ... zurück
  rationale: שוב bezeichnet in diesem Zusammenhang Moses Rückkehr; die deutsche Verbklammer ist idiomatisch.
- source_word: אַרְצָה מִצְרָיִם
  choice: in das Land Ägypten
  rationale: Die Richtungsendung an אֶרֶץ bezeichnet die Bewegung zum Ziel. Die ausdrückliche Erwähnung des „Landes“ bleibt erhalten.
- source_word: מַטֵּה הָאֱלֹהִים
  choice: den Stab Gottes
  rationale: מַטֶּה bezeichnet einen Stab, hier das von Gott mit Zeichen verbundene Werkzeug. Der Genitiv „Gottes“ wahrt die konkrete Zuordnung.
- source_word: בְּיָדוֹ
  choice: in seine Hand
  rationale: Die konkrete Formulierung des Hebräischen wird bewahrt. Zusammen mit „nahm“ ist sie im gehobenen deutschen Erzählstil verständlich und natürlich.
theological_decisions:
- issue: Bedeutung von הָאֱלֹהִים in מַטֵּה הָאֱלֹהִים
  choice: Gottes
  alternative: göttlich
  rationale: Im Zusammenhang mit Moses Berufung und den von Gott gewährten Zeichen verweist אֱלֹהִים konkret auf Gott. Eine bloß qualifizierende Wiedergabe als „göttlicher Stab“ würde diese Beziehung abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut nachvollziehbarem Erzählfluss. Die Wiederholung des Namens Mose im zweiten Satz folgt bewusst der hebräischen Struktur. „Land Ägypten“ und „in seine Hand“ bewahren die konkrete Ausdrucksweise des Ausgangstextes, ohne altertümliche Formen zu verwenden.
