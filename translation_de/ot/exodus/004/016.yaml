revisions:
- from: Er wird für dich zum Volk sprechen und dir als Mund dienen[a]; und du wirst ihm als Gott dienen[b].
  to: Er wird für dich zum Volk reden; er wird dir zum Mund sein[a], und du wirst ihm Gott sein[b].
  rationale: Die Revision ersetzt die beiden nicht im Ausgangstext stehenden Verben „dienen“ durch die prädikative Rollenbestimmung „sein“. Dadurch bleibt die Parallelität des Hebräischen erhalten und die Autoritätsrichtung gegenüber Aaron wird nicht umgekehrt. „Ihm Gott sein“ wahrt die starke, im Text selbst nicht ausdrücklich vergleichende Formulierung; die mögliche funktionale Lesart wird behutsam in der Fußnote erläutert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:06:47Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von וְדִבֶּר ... אֶל־הָעָם mit „für dich zum Volk reden“ trifft die vertretende Funktion Aarons. Der Entwurf fügt jedoch mit beiden Vorkommen von „dienen“ eine im Hebräischen nicht vorhandene Diensthandlung ein und schwächt damit die prädikative Rollenbestimmung durch היה. Insbesondere bedeutet „du wirst ihm als Gott dienen“ im Deutschen, dass Mose Aaron dient; dies kehrt die im Kontext gemeinte Autoritätsrichtung sachlich um. לֵאלֹהִים wird am quellentreuesten mit „ihm Gott sein“ wiedergegeben; eine vergleichende Deutung („wie Gott“) gehört gegebenenfalls in die Anmerkung.
  naturalness: „Zum Volk reden“, „dir zum Mund sein“ und „ihm Gott sein“ sind verständliches, würdiges modernes Standarddeutsch. Die Wiederholung von „wird“ bildet die zwei hebräischen Rollenprädikate klar ab, ohne unnötig schwerfällig zu sein.
  terminology: „Mund“ bewahrt die Metapher für einen Sprecher. „Gott“ gibt אֱלֹהִים im Singularbezug wieder. Die Fußnote erläutert die funktionale, bevollmächtigte Rolle, ohne eine ontologische Aussage über Mose in den Text einzutragen oder die starke Formulierung durch „als Gott dienen“ zu verfälschen.
  issues:
  - severity: high
    issue: „und du wirst ihm als Gott dienen“ verkehrt die Rollenbeziehung.
    rationale: Das Verb היה bedeutet hier „sein/werden“, nicht „dienen“. Die deutsche Konstruktion besagt zudem, Mose diene Aaron als Gott, während der hebräische Text Mose eine Gott entsprechende autoritative Rolle gegenüber Aaron zuschreibt.
  - severity: medium
    issue: „dir als Mund dienen“ ergänzt eine nicht ausgedrückte Diensthandlung.
    rationale: Auch in der Aussage über Aaron steht eine prädikative Bestimmung („dir zum Mund sein“). „Dienen“ ist zwar interpretativ naheliegend, aber im Parallelismus mit der zweiten Satzhälfte weniger quellentreu und bereitet die schwerwiegende Fehlformulierung der zweiten Satzhälfte vor.
  - severity: low
    issue: Fußnote a bezeichnet die im Entwurf bereits gebotene Formulierung als wörtliche Alternative.
    rationale: Die Anmerkung sollte stattdessen die Metapher „Mund“ knapp erklären; andernfalls bietet sie keine tatsächliche Zusatzinformation.
