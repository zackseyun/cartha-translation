  text: He will speak to the people for you[a], and he will be as a mouth for you[b], and you will be as God to him.
translation:
  language: de
  text: Er wird für dich zum Volk reden; er wird dir zum Mund sein[a], und du wirst ihm Gott sein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische „Mund“ ist hier bildhaft für einen Sprecher gebraucht.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „du wirst für ihn wie Gott sein“. Gemeint ist Moses von Gott verliehene, bevollmächtigte Rolle gegenüber Aaron.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִבֶּר הוּא לְךָ אֶל־הָעָם
  choice: Er wird für dich zum Volk sprechen
  rationale: 'דבר bezeichnet hier das Sprechen; לְךָ hat im Zusammenhang vertretende bzw. benefaktive Bedeutung: Aaron spricht für Mose. אֶל־הָעָם wird idiomatisch mit „zum Volk“ wiedergegeben.'
- source_word: וְהָיָה הוּא יִהְיֶה לְּךָ לְפֶה
  choice: und dir als Mund dienen
  rationale: Die Wiedergabe bewahrt das hebräische Bild vom „Mund“, macht aber zugleich in natürlichem Deutsch deutlich, dass Aaron als Moses Sprecher fungiert. Die auffällige Wiederholung von היה verstärkt bzw. bekräftigt die Rollenbestimmung, ohne dass sie im Deutschen wörtlich verdoppelt werden muss.
- source_word: וְאַתָּה תִּהְיֶה לּוֹ לֵאלֹהִים
  choice: und du wirst ihm als Gott dienen
  rationale: Die Formulierung erhält die starke Gottesmetapher und beschreibt Moses von Gott verliehene, vermittelnde Autorität gegenüber Aaron. „Als Gott“ gibt die funktionale Beziehung wieder, ohne Mose mit Gott gleichzusetzen.
theological_decisions:
- issue: Ob לֵאלֹהִים Mose wörtlich als Gott bezeichnet oder seine von Gott verliehene Rolle gegenüber Aaron beschreibt
  choice: als Gott dienen
  alternative: ihm Gott sein; für ihn wie Gott sein
  rationale: 'Der unmittelbare Zusammenhang (Ex 4,15) beschreibt eine Vermittlungskette: Gott unterweist Mose, Mose unterweist Aaron, und Aaron spricht. Die Übersetzung bewahrt die theologische Spannung und das starke Bild, vermeidet aber die unbeabsichtigte Aussage, Mose sei seinem Wesen nach Gott.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild vom „Mund“ und die starke Formulierung „als Gott“ bleiben erhalten; „dienen“ macht die jeweilige Rollenbeziehung idiomatisch verständlich, ohne sie konfessionell auszudeuten.
