base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/021.yaml
  text: Then Yahweh said to Moses[a], “When you go back to Egypt, see that you do before Pharaoh all the wonders that I have put in your hand. But I will harden his heart[b], and he will not let the people go.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Wenn du nach Ägypten zurückkehrst, achte darauf, dass du vor dem Pharao all die Wunder vollbringst, die ich in deine Hand gegeben habe.[a] Ich aber werde sein Herz verhärten,[b] und er wird das Volk nicht ziehen lassen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „all die Zeichen“. Das hebräische Wort bezeichnet außergewöhnliche Taten, die Gottes Macht sichtbar machen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch im Sinn von: „sein Herz stark machen“ oder „sein Herz fest machen“. Gemeint ist hier, dass der Pharao in seiner Weigerung bestärkt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als im Deutschen geläufige Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּלֶכְתְּךָ לָשׁוּב מִצְרַיְמָה
  choice: Wenn du nach Ägypten zurückkehrst
  rationale: Die Infinitivkonstruktion wird natürlich als Temporalsatz wiedergegeben; die Richtungsendung bei Ägypten ist durch „nach“ ausgedrückt.
- source_word: רְאֵה
  choice: achte darauf
  rationale: Der Imperativ fordert Mose auf, sorgfältig dafür zu sorgen, dass er die folgenden Taten vor dem Pharao ausführt.
- source_word: הַמֹּפְתִים
  choice: die Wunder
  rationale: Das Wort bezeichnet außergewöhnliche Machttaten mit Zeichencharakter; „Wunder“ ist hier verständlich und bewahrt den übernatürlichen Bezug.
- source_word: שַׂמְתִּי בְיָדֶךָ
  choice: die ich in deine Hand gegeben habe
  rationale: Bewahrt das anschauliche hebräische Bild dafür, dass Gott Mose diese Taten anvertraut und ihn zu ihnen befähigt hat.
- source_word: וַעֲשִׂיתָם לִפְנֵי פַרְעֹה
  choice: dass du vor dem Pharao ... vollbringst
  rationale: „Vollbringen“ ist im Deutschen mit „Wunder“ natürlicher als das wörtliche „tun“; „vor dem Pharao“ wahrt den öffentlichen Handlungsrahmen.
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Die Stellung von „aber“ markiert den Kontrast zwischen Moses Auftrag und Gottes anschließendem Handeln.
- source_word: אֲחַזֵּק אֶת לִבּוֹ
  choice: Ich werde sein Herz verhärten
  rationale: Im Erzählzusammenhang bezeichnet die kausative Form ein Festmachen in hartnäckiger Weigerung. Die Wiedergabe bewahrt die Spannung zwischen göttlichem Handeln und der Verantwortung des Pharaos.
- source_word: וְלֹא יְשַׁלַּח אֶת הָעָם
  choice: sodass er das Volk nicht ziehen lässt
  rationale: „Das Volk ziehen lassen“ ist im Exoduszusammenhang die natürliche deutsche Entsprechung für die Erlaubnis zum Aufbruch; „sodass“ macht die hier naheliegende Folgebeziehung deutlich.
theological_decisions:
- issue: Göttliche Verhärtung des Herzens des Pharaos
  choice: Ich werde sein Herz verhärten
  alternative: Ich werde sein Herz stärken / fest machen
  rationale: חזק kann stärken oder fest machen bedeuten. Mit „Herz“ und im Zusammenhang der Weigerung des Pharaos bezeichnet es hier dessen Verfestigung im Widerstand. Die Übersetzung schwächt die ausdrücklich genannte göttliche Urheberschaft nicht ab und löst die Spannung zur menschlichen Verantwortung nicht auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Bildsprache „in deine Hand gegeben“ bleibt erhalten. „Vor dem Pharao“ vermeidet das heute missverständliche „vor Pharao“. Die Fußnotenmarker [a] und [b] stehen jeweils unmittelbar bei der betreffenden Wendung.
