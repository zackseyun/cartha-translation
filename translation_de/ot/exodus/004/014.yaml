base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/014.yaml
  text: Then Yahweh’s anger burned against Moses[a], and he said, “Is there not Aaron your brother, the Levite? I know that he can speak well. And also, look, he is coming out to meet you; when he sees you, he will rejoice in his heart.”
translation:
  language: de
  text: 'Da entbrannte Jahwes Zorn über Mose, und er sagte: »Ist da nicht dein Bruder Aaron, der Levit? Ich weiß, dass er gut reden kann.[a] Sieh, er ist bereits unterwegs, um dir zu begegnen. Wenn er dich sieht, wird er sich von Herzen freuen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass er fließend reden kann«; wörtlich: »dass er redend reden wird«.'
    reason: Die hebräische Verbindung aus Infinitivus absolutus und finitem Verb verstärkt das Verb. Die wörtliche Glosse bildet die Wiederholung ab, ohne ihre genaue idiomatische Funktion einseitig festzulegen.
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה בְּמֹשֶׁה
  choice: Da entbrannte Jahwes Zorn über Mose
  rationale: Die Formulierung bewahrt das hebräische Bild des entbrennenden Zorns und gibt בְּ idiomatisch mit „über“ wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הֲלֹא אַהֲרֹן אָחִיךָ הַלֵּוִי
  choice: Ist da nicht dein Bruder Aaron, der Levit?
  rationale: Die rhetorische Frage erwartet Zustimmung. „Der Levit“ bezeichnet hier Aarons Stammeszugehörigkeit, ohne bereits ein kultisches Amt vorauszusetzen.
- source_word: יָדַעְתִּי כִּי דַבֵּר יְדַבֵּר הוּא
  choice: Ich weiß, dass er gut reden kann
  rationale: Infinitivus absolutus und finite Verbform verstärken den Gedanken des Redens. Im Zusammenhang bildet Aarons Redefähigkeit den Gegensatz zu Moses Einwand; „gut reden kann“ gibt dies natürlich wieder, während die wörtliche Wiederholung in der Fußnote dokumentiert wird.
- source_word: וְגַם הִנֵּה
  choice: Sieh
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf die folgende Aussage. Das additive וְגַם wird im Deutschen nicht eigens wiederholt, weil „und auch, sieh“ unnatürlich wäre und der Zusammenhang den Zusatz bereits erkennen lässt.
- source_word: הוּא יֹצֵא לִקְרָאתֶךָ
  choice: er ist bereits unterwegs, um dir zu begegnen
  rationale: Das Partizip bezeichnet einen laufenden beziehungsweise unmittelbar bevorstehenden Vorgang. „Bereits unterwegs“ vermittelt diesen Aspekt idiomatisch.
- source_word: וְרָאֲךָ וְשָׂמַח בְּלִבּוֹ
  choice: Wenn er dich sieht, wird er sich von Herzen freuen
  rationale: Die erste Verbform wird im Zusammenhang temporal verstanden. „Von Herzen“ gibt die ausdrücklich genannte innere Freude natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ bewahrt diese Funktion, statt den Namen durch einen Titel zu ersetzen.
- issue: Bedeutung von הַלֵּוִי
  choice: der Levit
  alternative: der Nachkomme Levis
  rationale: Die Bezeichnung wird als Stammeszugehörigkeit wiedergegeben; ein späteres priesterliches oder kultisches Amt Aarons wird nicht in den Vers hineingelesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da entbrannte“ erhält den erzählerischen Anschluss und das hebräische Zornesbild; „Sieh“ ist gegenwärtiger als „siehe“. Die Anrede bleibt im Singular, entsprechend dem Hebräischen.
