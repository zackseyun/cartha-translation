base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/007.yaml
  text: And he said[a], “Put your hand back into your bosom.” So he put his hand back into his bosom, and when he brought it out from his bosom, behold[b], it had returned like his flesh.
translation:
  language: de
  text: 'Da sagte er: »Steck deine Hand wieder in deinen Gewandbausch[a].« Da steckte er seine Hand wieder in seinen Gewandbausch. Als er sie daraus hervorzog, siehe, sie war wieder wie sein übriges Fleisch[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die Falte oder der Bausch des Gewandes an der Brust.
    reason: cultural_note
  - marker: b
    text: 'Das heißt: Seine Hand war wieder wie das übrige Fleisch seines Körpers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב
  choice: Steck ... wieder
  rationale: Der Hifil-Imperativ von שׁוב fordert dazu auf, die Hand an ihren vorherigen Ort zurückzubringen. Im Deutschen beschreibt »stecken« die konkrete Bewegung in den Gewandbausch natürlich; »wieder« bewahrt den Rückkehrgedanken.
- source_word: חֵיק
  choice: Brustbausch des Gewandes
  rationale: חֵיק bezeichnet hier den Bereich an der Brust beziehungsweise den Bausch oder die Falte des Gewandes, in den man die Hand stecken kann. Die Wiedergabe ist anschaulicher und heute verständlicher als das mehrdeutige »Busen«.
- source_word: וַיָּשֶׁב
  choice: Da steckte er ... wieder
  rationale: Die Erzählform von שׁוב entspricht dem vorausgehenden Befehl. Die parallele Formulierung erhält die Wiederholung des Hebräischen.
- source_word: וַיּוֹצִאָהּ
  choice: Als er sie daraus hervorzog
  rationale: Der Hifil von יצא bedeutet, etwas herauszubringen. »Hervorzog« gibt die Bewegung idiomatisch wieder; »daraus« nimmt den Gewandbausch auf.
- source_word: וְהִנֵּה
  choice: siehe
  rationale: Die Aufmerksamkeitspartikel hebt das überraschende Ergebnis hervor. »Siehe« bewahrt ihren feierlichen erzählerischen Nachdruck, ohne eine Deutung hinzuzufügen.
- source_word: שָׁבָה
  choice: war sie wieder
  rationale: Das feminine Verb bezieht sich auf die Hand und bezeichnet ihre Rückkehr zum früheren Zustand. Die knappe Formulierung bleibt nahe am Hebräischen und ist im Deutschen natürlich.
- source_word: כִּבְשָׂרוֹ
  choice: wie sein Fleisch
  rationale: Das Präfix כ־ kennzeichnet einen Vergleich. Die formal nahe Wiedergabe lässt die ungewöhnliche Kürze des Hebräischen stehen; die gemeinte Wiederherstellung wird in einer Fußnote erläutert.
