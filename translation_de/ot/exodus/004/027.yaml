  source_fidelity: 'Der Text gibt die Abfolge und den Sinn des Hebräischen zuverlässig wieder: Jahwe spricht zu Aaron, befiehlt ihm, Mose entgegen in die Wüste zu gehen; Aaron geht, trifft Mose am Berg Gottes und küsst ihn. „Mose entgegen in die Wüste“ wahrt angemessen die mit der Richtungsendung an הַמִּדְבָּרָה verbundene Bewegungsnuance, ohne eine überzogene syntaktische Festlegung vorzunehmen.'
