  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל אַהֲרֹ֔ן לֵ֛ךְ לִ/קְרַ֥את מֹשֶׁ֖ה הַ/מִּדְבָּ֑רָ/ה וַ/יֵּ֗לֶךְ וַֽ/יִּפְגְּשֵׁ֛/הוּ בְּ/הַ֥ר הָ/אֱלֹהִ֖ים וַ/יִּשַּׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/027.yaml
  text: And Yahweh said to Aaron[a], “Go into the wilderness to meet Moses.” So he went and met him at the mountain of God and kissed him.
translation:
  language: de
  text: 'Und Jahwe sagte zu Aaron: „Geh Mose entgegen in die Wüste.“ Da ging er und traf ihn am Berg Gottes und küsste ihn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לֵךְ לִקְרַאת מֹשֶׁה הַמִּדְבָּרָה
  choice: Geh Mose entgegen in die Wüste
  rationale: Bewahrt sowohl den Zweck beziehungsweise die Begegnungsrichtung von לִקְרַאת als auch die durch das Richtungs-he markierte Bewegung zur Wüste; die Wortstellung lässt die syntaktische Spannung des Hebräischen bestehen.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: traf ihn
  rationale: פגשׁ bezeichnet hier das Zusammentreffen; „traf ihn“ ist im Deutschen natürlich und kontextgemäß.
- source_word: בְּהַר הָאֱלֹהִים
  choice: am Berg Gottes
  rationale: Formnahe Wiedergabe der hebräischen Genitivverbindung; „am“ bezeichnet den Ort, ohne unnötig festzulegen, ob die Begegnung auf dem Gipfel stattfand.
- source_word: וַיִּשַּׁק לוֹ
  choice: und küsste ihn
  rationale: Direkte und unverstärkte Wiedergabe der Handlung; ein erklärender Zusatz wie „zur Begrüßung“ steht nicht im Ausgangstext.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als Name wiedergegeben und nicht durch einen traditionellen Titel ersetzt.
- issue: Bezeichnung הָאֱלֹהִים in „Berg Gottes“
  choice: Gottes
  alternative: des Gottes
  rationale: Die etablierte deutsche Wendung „Berg Gottes“ bildet den hebräischen Ausdruck natürlich ab, ohne eine zusätzliche theologische Bestimmung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper narrativer Satzfolge. Die ungewöhnlichere Stellung „Mose entgegen in die Wüste“ ist bewusst gewählt, um die im Hebräischen mögliche Zuordnung der Richtungsangabe nicht vorschnell aufzulösen.
