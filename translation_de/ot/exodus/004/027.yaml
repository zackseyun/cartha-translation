  terminology: „Jahwe“ entspricht der projektweiten Wiedergabe des Tetragramms. „Berg Gottes“ ist eine natürliche und quellennahe Wiedergabe von בְּהַר הָאֱלֹהִים. „traf ihn“ und „küsste ihn“ sind treffend und fügen keine Erklärung zur Begrüßungsgeste hinzu.
