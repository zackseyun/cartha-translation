source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר אֵלָ֛י/ו יְהוָ֖ה מ/זה בְ/יָדֶ֑/ךָ וַ/יֹּ֖אמֶר מַטֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/002.yaml
  text: And Yahweh said to him[a], “What is that in your hand?” And he said, “A staff.”
translation:
  language: de
  text: 'Und Jahwe sagte zu ihm: „Was ist das da in deiner Hand?“ Er sagte: „Ein Stab.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Stock“ beziehungsweise „Rute“. Das hebräische Wort מַטֶּה kann je nach Zusammenhang einen Stab, Stock oder eine Rute bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: sagte ... sagte
  rationale: Die Wiederholung des gewöhnlichen hebräischen Redeverbs אמר bleibt erhalten. Obwohl das zweite Vorkommen funktional eine Antwort einleitet, ist die wörtliche Wiederholung auch im Deutschen verständlich.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Die Präposition mit Pronominalsuffix bedeutet schlicht „zu ihm“.
- source_word: מַה־זֶּה / מִזֶּה
  choice: Was ist das da
  rationale: Die Formulierung fragt nach der Identität des Gegenstands. „Das da“ gibt den hinweisenden Charakter natürlich wieder, ohne übermäßig umgangssprachlich zu wirken.
- source_word: בְּיָדֶךָ
  choice: in deiner Hand
  rationale: Die Wendung bezeichnet hier konkret den Gegenstand, den Mose in der Hand hält, und lässt sich im Deutschen wörtlich und idiomatisch wiedergeben.
- source_word: מַטֶּה
  choice: ein Stab
  rationale: מַטֶּה bezeichnet je nach Zusammenhang einen Stab, Stock oder eine Rute. Für den von Mose getragenen Gegenstand ist „Stab“ die natürlichste und traditionsübergreifend verständliche Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: „Jahwe“ bewahrt den persönlichen Gottesnamen im Text. Die Form ist im modernen Deutschen geläufig und vermeidet sowohl die Ersetzung durch einen Titel als auch die weniger quellennah gebildete Form „Jehova“.
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die zweimalige Wiedergabe mit „sagte“ bewahrt bewusst die hebräische Wiederholung; „das da“ vermittelt den deiktischen Sinn der Frage.
