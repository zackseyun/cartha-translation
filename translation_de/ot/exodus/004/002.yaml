  source_fidelity: 'Der Entwurf gibt die Abfolge und den Inhalt des Hebräischen genau wieder: Jahwe richtet die Frage an Mose, und Mose antwortet mit der Bezeichnung des Gegenstands. „Was ist das da in deiner Hand?“ bildet מַה־זֶּה בְּיָדֶךָ angemessen ab; die präsentische Kopula wird im Deutschen idiomatisch ergänzt. Die Wiederholung von „sagte“ entspricht dem zweimaligen וַיֹּאמֶר, ohne den Sinn durch „fragte/antwortete“ umzudeuten.'
