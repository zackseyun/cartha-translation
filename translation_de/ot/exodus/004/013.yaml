  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר בִּ֣י אֲדֹנָ֑/י שְֽׁלַֽח נָ֖א בְּ/יַד תִּשְׁלָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/013.yaml
  text: But he said[a], “Please, my Lord, send by the hand of whomever you will send.”
translation:
  language: de
  text: 'Doch er sagte[a]: „Bitte, mein Herr, sende doch durch wen du senden willst.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, sinngemäß: „Bitte, mein Herr, schick jemand anderen.“'
    reason: Alternative, stärker deutende Wiedergabe der ausweichenden hebräischen Formulierung.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch er sagte
  rationale: Das Waw consecutivum führt die Erzählung fort; im Zusammenhang ist die Aussage jedoch adversativ, weil Mose trotz Gottes Antworten weiter widerstrebt.
- source_word: בִּי
  choice: Bitte
  rationale: In Verbindung mit einer ehrerbietigen Anrede ist בִּי eine höfliche Bitte und nicht wörtlich als „in mir“ zu verstehen.
- source_word: אֲדֹנָי
  choice: mein Herr
  rationale: Die ehrerbietige Anrede an Gott bewahrt das Suffix der ersten Person Singular. Da hier nicht der Gottesname יהוה steht, wird nicht „der HERR“ verwendet.
- source_word: שְׁלַח נָא
  choice: sende doch
  rationale: Der Imperativ שְׁלַח wird durch die Bittepartikel נָא abgemildert. „Sende doch“ gibt die höflich-drängende Bitte in natürlichem Deutsch wieder, ohne das bereits für בִּי verwendete „Bitte“ zu verdoppeln.
- source_word: בְּיַד
  choice: durch
  rationale: Die Wendung bedeutet wörtlich „durch die Hand von“ und bezeichnet hier die handelnde Person beziehungsweise Vermittlung. Das schlichte „durch“ ist im Deutschen natürlich und verständlich.
- source_word: תִּשְׁלָח
  choice: du senden willst
  rationale: Die Form bleibt bewusst offen und gibt Moses ausweichende Formulierung wieder, ohne im Haupttext ausdrücklich „jemand anderen“ einzufügen.
theological_decisions:
- issue: Deutung von Moses ausweichender Bitte
  choice: 'Die hebräische Offenheit bleibt erhalten: Gott soll durch den senden, den er senden will.'
  alternative: „Bitte, mein Herr, schick jemand anderen.“
  rationale: Aus dem Zusammenhang wird Moses Widerwille deutlich, doch im Hebräischen steht nicht ausdrücklich „jemand anderen“. Der Haupttext bewahrt daher die Spannung; die deutende Wiedergabe steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ markiert den Widerstand Moses. Die etwas ungewöhnliche Wendung „durch wen du senden willst“ bewahrt absichtlich die Mehrdeutigkeit des Hebräischen; die Fußnote bietet die natürliche kontextuelle Deutung.
