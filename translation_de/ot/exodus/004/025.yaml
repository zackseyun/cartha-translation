  text: וַ/תִּקַּ֨ח צִפֹּרָ֜ה צֹ֗ר וַ/תִּכְרֹת֙ אֶת עָרְלַ֣ת בְּנָ֔/הּ וַ/תַּגַּ֖ע לְ/רַגְלָ֑י/ו וַ/תֹּ֕אמֶר כִּ֧י חֲתַן דָּמִ֛ים אַתָּ֖ה לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/025.yaml
  text: Then Zipporah took a flint and cut off her son's foreskin and touched his feet with it[a], and she said, “Surely you are a bridegroom of blood to me.”
translation:
  language: de
  text: 'Da nahm Zippora einen Feuerstein, schnitt die Vorhaut ihres Sohnes ab und berührte damit seine Füße.[a] Sie sagte: »Ja, ein Blutbräutigam bist du mir!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »an seine Füße«. »Füße« kann im Hebräischen eine verhüllende Bezeichnung für die Geschlechtsteile sein. Das Pronomen kann sich auf Mose oder auf ihren Sohn beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: Feuerstein
  rationale: Das Substantiv bezeichnet hier einen Feuerstein beziehungsweise ein steinernes Schneidewerkzeug. »Feuerstein« ist prägnant und passt zum Zusammenhang der Beschneidung.
- source_word: עָרְלַת בְּנָהּ
  choice: die Vorhaut ihres Sohnes
  rationale: Die anatomisch genaue Wiedergabe entspricht unmittelbar der hebräischen Genitivverbindung.
- source_word: וַתַּגַּע
  choice: berührte
  rationale: נגע bedeutet gewöhnlich »berühren«; die schlichte Wiedergabe lässt die genaue Art des Kontakts offen.
- source_word: לְרַגְלָיו
  choice: seine Füße
  rationale: Dies ist der direkte Wortsinn. Eine mögliche euphemistische Bedeutung sowie der unklare Bezug des Pronomens werden nicht in den Haupttext eingetragen, sondern in der Fußnote erläutert.
- source_word: כִּי
  choice: Ja
  rationale: כִּי leitet hier wahrscheinlich einen nachdrücklichen Ausruf ein. »Ja« gibt diese bekräftigende Funktion im heutigen Deutsch natürlich wieder, ohne eine unbegründete Schlussfolgerung auszudrücken.
- source_word: חֲתַן דָּמִים
  choice: Blutbräutigam
  rationale: Das ungewöhnliche Kompositum bewahrt das hebräische Bild und seine Mehrdeutigkeit. Es klingt im Deutschen ebenso auffällig wie die Wendung im Hebräischen.
- source_word: לִי
  choice: mir
  rationale: 'Der Dativ gibt die persönliche Zuordnung knapp und idiomatisch wieder: »ein Blutbräutigam bist du mir«.'
theological_decisions:
- issue: Ob »seine Füße« euphemistisch zu verstehen und das Pronomen ausdrücklich auf Mose oder den Sohn zu beziehen ist
  choice: Die wörtliche Formulierung »seine Füße« bleibt stehen, ohne den Bezug festzulegen.
  alternative: »seine Geschlechtsteile«, ausdrücklich die Füße beziehungsweise Geschlechtsteile Moses oder des Sohnes
  rationale: Der hebräische Text ist an dieser Stelle tatsächlich mehrdeutig. Der Haupttext soll diese exegetische und theologische Spannung nicht stillschweigend auflösen; die wesentlichen Deutungsmöglichkeiten werden in einer Fußnote genannt.
- issue: Deutung der Wendung חֲתַן דָּמִים
  choice: Die bildhafte, schwer verständliche Wendung wird als »Blutbräutigam« bewahrt.
  alternative: Eine ausdeutende Umschreibung wie »durch Blut mit mir verbundener Bräutigam«
  rationale: Der Kontext erlaubt keine sichere Festlegung auf eine einzige Erklärung. Eine interpretierende Glättung würde mehr aussagen als der hebräische Wortlaut.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die ungewöhnliche Wendung »Blutbräutigam« bleibt bewusst markant; Satzstellung und Ausrufezeichen tragen dem emphatischen Ausspruch Zipporas Rechnung.
