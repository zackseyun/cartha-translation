  text: וַ/יְדַבֵּ֣ר אַהֲרֹ֔ן אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה וַ/יַּ֥עַשׂ הָ/אֹתֹ֖ת לְ/עֵינֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/030.yaml
  text: Aaron spoke all the words that Yahweh had spoken to Moses[a], and he performed the signs before the eyes of the people.
translation:
  language: de
  text: Aaron sagte alle Worte, die Jahwe zu Mose gesprochen hatte, und vollführte die Zeichen vor den Augen des Volkes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor dem Volk“.'
    reason: Lexikalisch-idiomatische Alternative für לְעֵינֵי הָעָם; die Hauptfassung bewahrt das hebräische Bild, die Alternative gibt dessen Sinn knapper wieder.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach … aus
  rationale: Das Piel von דבר bedeutet hier „sprechen“. „sprach … aus“ verbindet sich im Deutschen natürlich mit „alle Worte“ und bewahrt die ausdrückliche Redehandlung.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: alle Worte
  rationale: Die konkrete Formulierung des Hebräischen bleibt erhalten; das allgemeinere „alles“ würde sie einebnen.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: die Jahwe zu Mose gesprochen hatte
  rationale: Das Plusquamperfekt gibt die gegenüber Aarons Rede vorausliegende Handlung im Deutschen natürlich wieder. Die Präposition אֶל wird mit „zu“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Umschrift des göttlichen Eigennamens bewahrt den im hebräischen Text stehenden Namen, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיַּעַשׂ
  choice: vollführte
  rationale: עשה ist grundsätzlich weit gefasst, bezeichnet mit אותות hier aber das Ausführen der zuvor angekündigten Zeichen. „Vollführte“ ist idiomatisch, ohne deren wunderhaften Charakter eigens hinzuzufügen.
- source_word: הָאֹתֹת
  choice: die Zeichen
  rationale: „Zeichen“ bewahrt die knappe Bezeichnung des Ausgangstextes; dass es sich um beglaubigende Wunderzeichen handelt, ergibt sich aus dem Zusammenhang.
- source_word: לְעֵינֵי הָעָם
  choice: vor den Augen des Volkes
  rationale: Die Wiedergabe erhält das anschauliche hebräische Bild und ist zugleich verständliches, würdiges Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ gibt ihn in der im Deutschen gebräuchlichen Form wieder, statt ihn durch den Titel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit relativ formaler Nähe zum hebräischen Wortlaut. Das konkrete „alle Worte“ und das Bild „vor den Augen“ bleiben erhalten; unnötige erklärende Zusätze wurden vermieden.
