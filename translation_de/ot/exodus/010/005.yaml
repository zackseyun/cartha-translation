base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/005.yaml
  text: And it will cover the surface of the land[a], so that one will not be able to see the land; and it will eat what remains of the survivors left to you from the hail[b], and it will eat every tree growing for you out of the field.
translation:
  language: de
  text: Sie werden die Oberfläche des Landes[a] bedecken, sodass man das Land nicht sehen kann. Sie werden den Rest dessen fressen, was dem Hagel entkommen und euch übrig geblieben ist[b], und jeden Baum fressen, der für euch auf dem Feld wächst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Auge des Landes“, eine hebräische Wendung für die sichtbare Oberfläche des Landes.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „den Rest des Entkommenen, der euch vom Hagel übrig geblieben ist“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִסָּה
  choice: Sie werden ... bedecken
  rationale: כסה bedeutet „bedecken, verhüllen“. Das hebräische Kollektivum für die Heuschrecken steht im Singular; im Deutschen entspricht ihm natürlich der Plural „sie“.
- source_word: עֵין הָאָרֶץ
  choice: die Oberfläche des Landes
  rationale: Wörtlich steht „das Auge des Landes“. Die idiomatische Wendung bezeichnet dessen sichtbare Oberfläche; die Fußnote bewahrt das hebräische Bild.
- source_word: וְלֹא יוּכַל לִרְאֹת אֶת הָאָרֶץ
  choice: sodass man das Land nicht sehen kann
  rationale: Das unpersönlich gebrauchte hebräische Maskulinum Singular wird mit dem natürlichen deutschen „man“ wiedergegeben; der Folgesinn ergibt sich aus dem Zusammenhang.
- source_word: וְאָכַל
  choice: Sie werden ... fressen
  rationale: אכל ist das gewöhnliche Verb „essen/fressen“. Bei Tieren ist „fressen“ im Deutschen konkret und idiomatisch; der Plural folgt der deutschen Wiedergabe der kollektiv gemeinten Heuschrecken.
- source_word: יֶתֶר הַפְּלֵטָה
  choice: den Rest dessen, was ... entkommen ... ist
  rationale: Die gestufte Formulierung bezeichnet den noch vorhandenen Rest dessen, was der Vernichtung entging. Diese Wiedergabe bleibt verständlich, ohne das Gemeinte unnötig zu personifizieren.
- source_word: הַנִּשְׁאֶרֶת לָכֶם מִן הַבָּרָד
  choice: was dem Hagel entkommen und euch übrig geblieben ist
  rationale: Die Formulierung bewahrt sowohl das Entkommen vor dem Hagel als auch das anschließende Verbleiben für die Ägypter.
- source_word: כָּל הָעֵץ
  choice: jeden Baum
  rationale: עץ steht im Singular und כל hat hier distributive Kraft; „jeden Baum“ bildet dies präzise ab.
- source_word: הַצֹּמֵחַ לָכֶם מִן הַשָּׂדֶה
  choice: der für euch auf dem Feld wächst
  rationale: צמח bedeutet „wachsen, sprossen“. „Auf dem Feld wächst“ ist im Deutschen die natürliche Ortsangabe; „für euch“ bewahrt לָכֶם als Hinweis auf Zugehörigkeit oder Nutzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kollektiv gemeinten Heuschrecken werden entsprechend dem natürlichen deutschen Sprachgebrauch mit dem Plural „sie“ aufgenommen. Die Bildhaftigkeit von „Auge des Landes“ und die ungewöhnlich geschichtete Wendung für das vom Hagel Verschonte werden durch Fußnoten transparent gehalten.
