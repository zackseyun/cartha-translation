  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם יְהִ֨י כֵ֤ן יְהוָה֙ עִמָּ/כֶ֔ם כַּ/אֲשֶׁ֛ר אֲשַׁלַּ֥ח אֶתְ/כֶ֖ם וְ/אֶֽת טַפְּ/כֶ֑ם רְא֕וּ כִּ֥י רָעָ֖ה נֶ֥גֶד פְּנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/010.yaml
  text: And he said to them[a], “May Yahweh indeed be with you, if I ever send you and your little ones out! See[b], for evil is before your faces.”
translation:
  language: de
  text: 'Da sagte er zu ihnen[a]: »So sei Jahwe mit euch, wenn ich euch und eure kleinen Kinder jemals ziehen lasse! Seht[b]: Böses ist vor euch.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Jahwe sei mit euch, wenn ich euch und eure kleinen Kinder ziehen lasse«; vermutlich ist dies spöttisch gemeint.'
    reason: alternative_reading
  - marker: b
    text: 'Das Hebräische ist mehrdeutig: Gemeint sein kann, dass ihnen Unheil bevorsteht, oder dass sie Böses im Sinn haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי כֵן יְהוָה עִמָּכֶם
  choice: So sei Jahwe mit euch
  rationale: Bewahrt den Jussiv und das כֵן möglichst knapp; der sarkastische Ton ergibt sich aus dem Zusammenhang und wird nicht durch eine eindeutige Deutung im Haupttext festgelegt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: 'Entspricht der gewöhnlichen Vergleichsbedeutung und erhält die spöttische Verknüpfung: Jahwe soll ebenso gewiss mit ihnen sein, wie der Pharao sie samt den Kindern ziehen lässt.'
- source_word: אֲשַׁלַּח אֶתְכֶם וְאֶת טַפְּכֶם
  choice: ich euch und eure kleinen Kinder ziehen lasse
  rationale: שׁלח bedeutet in diesem Erzählzusammenhang idiomatisch »ziehen lassen«; טַף bezeichnet besonders die kleinen Kinder.
- source_word: רְאוּ
  choice: Seht euch vor
  rationale: Das Imperativwort dient hier als Warnung; die deutsche Wendung ist natürlich und lässt den bedrohlichen Ton erkennen.
- source_word: כִּי רָעָה נֶגֶד פְּנֵיכֶם
  choice: denn Böses habt ihr vor Augen
  rationale: Die Formulierung hält an רָעָה als »Böses« und am Bild des Vor-Augen-Seins fest, ohne eindeutig zwischen böser Absicht und drohendem Unheil zu entscheiden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird transparent als solcher wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
- issue: Sarkasmus in der Aussage des Pharaos
  choice: So sei Jahwe mit euch, wie ich euch und eure kleinen Kinder ziehen lasse
  alternative: Jahwe sei mit euch, wenn ich euch und eure kleinen Kinder ziehen lasse
  rationale: Die Vergleichskonstruktion bewahrt die hebräische Form und lässt den Sarkasmus aus der Situation hervorgehen, statt ihn explizit auszudeuten.
- issue: Mehrdeutigkeit von רָעָה נֶגֶד פְּנֵיכֶם
  choice: Böses habt ihr vor Augen
  alternative: Unheil steht euch bevor
  rationale: Der Haupttext erhält die Spannung zwischen einer Beschuldigung böser Absichten und einer Warnung vor drohendem Unheil; die Fußnote nennt beide Möglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Dialog bleibt knapp und scharf; »kleine Kinder« ist allgemein verständlicher als »die Kleinen«. Die Bildsprache »vor Augen« bewahrt bewusst die Mehrdeutigkeit des hebräischen Schlusses.
