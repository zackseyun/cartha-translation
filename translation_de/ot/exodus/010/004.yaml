id: EXO.10.4
reference: Exodus 10:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֛י אִם מָאֵ֥ן אַתָּ֖ה לְ/שַׁלֵּ֣חַ אֶת עַמִּ֑/י הִנְ/נִ֨י מֵבִ֥יא מָחָ֛ר אַרְבֶּ֖ה בִּ/גְבֻלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/004.yaml
  text: For if you refuse to let my people go[a], behold[b], tomorrow I will bring locusts into your territory.
translation:
  language: de
  text: Denn wenn du dich weigerst, mein Volk ziehen zu lassen, sieh, dann werde ich morgen Heuschrecken[a] in dein Gebiet[b] bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort steht in der Einzahl, ist hier aber kollektiv gebraucht.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »innerhalb deiner Grenzen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Denn wenn
  rationale: Die Verbindung leitet eine bedingte Warnung ein und knüpft sie begründend an die vorausgehende Rede an.
- source_word: מָאֵן
  choice: dich weigerst
  rationale: Das Verb bezeichnet bewusste, willentliche Weigerung und nicht bloß Unvermögen oder Zögern.
- source_word: לְשַׁלֵּחַ
  choice: ziehen zu lassen
  rationale: Im Exoduszusammenhang gibt diese idiomatische Wendung die geforderte Freilassung des Volkes natürlich und präzise wieder.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Die knappe Form bewahrt die possessive und bundestheologische Aussage des Hebräischen, ohne sie auszudeuten.
- source_word: הִנְנִי
  choice: sieh
  rationale: Das Aufmerksamkeitssignal unterstreicht die feierliche Unmittelbarkeit der angekündigten Handlung; „sieh“ ist im modernen Deutsch verständlicher als das altertümlichere „siehe“.
- source_word: מֵבִיא
  choice: werde ich … bringen
  rationale: Das Partizip bezeichnet zusammen mit הִנְנִי eine unmittelbar bevorstehende Handlung. Das deutsche Futur formuliert die Drohung klar, während „sieh“ und „morgen“ ihre Dringlichkeit erhalten.
- source_word: מָחָר
  choice: morgen
  rationale: Direkte Wiedergabe der Zeitangabe.
- source_word: אַרְבֶּה
  choice: Heuschrecken
  rationale: Das hebräische Substantiv steht formal im Singular, wird hier jedoch kollektiv für die einfallenden Heuschrecken gebraucht.
- source_word: בִּגְבֻלֶךָ
  choice: in dein Gebiet
  rationale: גְּבוּל kann sowohl die Grenze als auch das von ihr umschlossene Gebiet bezeichnen. Im Zusammenhang mit dem Eindringen der Plage ist „Gebiet“ natürlich und lexikalisch präzise.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige Exodusformulierung „mein Volk ziehen zu lassen“ bleibt erhalten. Das hervorgehobene הִנְנִי wird mit „sieh“ sichtbar gemacht, ohne den Vers unnötig zu archaisieren.
