id: EXO.10.27
reference: Exodus 10:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְחַזֵּ֥ק יְהוָ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/לֹ֥א אָבָ֖ה לְ/שַׁלְּחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/027.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he was not willing to let them go.
translation:
  language: de
  text: Doch Jahwe verhärtete das Herz des Pharaos[a], und er war nicht bereit, sie ziehen zu lassen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „machte das Herz des Pharaos fest/stark“. Das hebräische Verb kann „stärken“ oder „fest machen“ bedeuten; in dieser Verbindung hat es den Sinn „verhärten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und er weigerte sich, sie ziehen zu lassen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: verhärtete
  rationale: חזק bedeutet grundsätzlich „stark/fest machen“. In der wiederkehrenden Verbindung mit dem Herzen des Pharaos bezeichnet es hier idiomatisch die Verhärtung seines Entschlusses; „verhärtete“ ist im Deutschen klar und bewahrt zugleich die ausdrückliche göttliche Verursachung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: לֵב
  choice: Herz
  rationale: „Herz“ bewahrt das hebräische Bild; לֵב umfasst hier besonders Wille, Haltung und Entschlusskraft.
- source_word: פַּרְעֹה
  choice: Pharao
  rationale: „Pharao“ ist die übliche deutsche Wiedergabe des ägyptischen Herrschertitels.
- source_word: לֹא אָבָה
  choice: war nicht bereit
  rationale: אבה bezeichnet Bereitschaft beziehungsweise Einwilligung. „War nicht bereit“ gibt die Verneinung der Willensbereitschaft eng wieder, ohne sie stärker als ausdrückliche Weigerung auszudeuten.
- source_word: לְשַׁלְּחָם
  choice: sie ziehen zu lassen
  rationale: Im Exodus-Kontext bezeichnet שלח die Erlaubnis zum Aufbruch Israels. „Ziehen lassen“ ist die natürliche deutsche Formulierung des wiederkehrenden Motivs.
theological_decisions:
- issue: Göttliche Verhärtung und menschlicher Wille
  choice: 'Beide Aussagen werden nebeneinandergestellt: Jahwe verhärtete das Herz des Pharaos, und der Pharao war nicht bereit, Israel ziehen zu lassen.'
  alternative: Jahwe machte das Herz des Pharaos stark, sodass er sich weigerte, sie ziehen zu lassen.
  rationale: Der hebräische Text schreibt die Verhärtung ausdrücklich Jahwe zu und nennt zugleich die mangelnde Bereitschaft des Pharaos. Die koordinierende Satzstruktur bewahrt diese Spannung, ohne die zweite Aussage als bloße Folgewirkung umzudeuten oder die göttliche Verursachung abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ gibt den narrativen Gegensatz wieder; „das Herz des Pharaos“ erhält das biblische Bild, und „ziehen lassen“ greift den im Exodus wiederkehrenden natürlichen deutschen Ausdruck auf.
