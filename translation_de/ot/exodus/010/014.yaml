base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/014.yaml
  text: And the locusts came up over all the land of Egypt and settled in every territory of Egypt[a]—an extremely severe swarm. never before had there been locusts like it, nor will there be again after it.
translation:
  language: de
  text: Die Heuschrecken kamen über das ganze Land Ägypten und ließen sich im ganzen Gebiet Ägyptens nieder; sie waren sehr zahlreich.[a] Nie zuvor hatte es Heuschrecken wie diese gegeben, und auch danach wird es keine solchen geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „sehr schwer“. Die Wendung bezeichnet hier die außergewöhnliche Größe oder Dichte der Heuschreckenmenge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: zogen … herauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung bzw. ein Heraufziehen. Im Zusammenhang des heranziehenden Heuschreckenschwarms bewahrt „zogen … herauf“ das hebräische Bewegungsbild und klingt im Deutschen natürlich.
- source_word: הָאַרְבֶּה
  choice: die Heuschrecken / Heuschreckenplage
  rationale: Das formal singularische Nomen wird kollektiv gebraucht. Im ersten Satz gibt „die Heuschrecken“ diesen Sinn idiomatisch wieder; beim Vergleich bezeichnet „Heuschreckenplage“ das gesamte Invasionsereignis und ermöglicht einen klaren deutschen Rückbezug.
- source_word: עַל כָּל אֶרֶץ מִצְרַיִם
  choice: über das ganze Land Ägypten
  rationale: Die Wendung gibt die vollständige Ausbreitung über das ägyptische Land unmittelbar wieder.
- source_word: וַיָּנַח
  choice: ließen sich … nieder
  rationale: נוח bezeichnet hier das Zur-Ruhe-Kommen beziehungsweise Niederlassen der Heuschrecken; „sich niederlassen“ ist dafür die natürliche deutsche Formulierung.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: im gesamten Gebiet Ägyptens
  rationale: גְּבוּל kann Grenze oder abgegrenztes Gebiet bedeuten. Hier verlangt die flächendeckende Verteilung den territorialen Sinn, nicht nur die Grenzlinie.
- source_word: כָּבֵד מְאֹד
  choice: überaus verheerend
  rationale: כָּבֵד bedeutet wörtlich „sehr schwer“, beschreibt hier aber Intensität und zerstörerische Schwere der Invasion. „Überaus verheerend“ überträgt die Wirkung natürlich, ohne das im Hebräischen nicht ausdrücklich vorhandene Wort „Schwarm“ einzufügen.
- source_word: לְפָנָיו לֹא הָיָה כֵן אַרְבֶּה כָּמֹהוּ
  choice: Nie zuvor hatte es eine solche Heuschreckenplage gegeben
  rationale: Die idiomatische deutsche Fassung erhält die Aussage, dass dieses kollektive Heuschreckenereignis in der Vergangenheit ohne Vergleich war.
- source_word: וְאַחֲרָיו לֹא יִהְיֶה כֵּן
  choice: und auch danach wird es keine solche mehr geben
  rationale: Die Formulierung bewahrt die zukunftsgerichtete Vergleichsaussage und den Parallelismus zwischen „zuvor“ und „danach“.
