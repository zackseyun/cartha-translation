base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/012.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the land of Egypt for the locusts, so that they may come up over the land of Egypt and eat every plant of the land[b], everything that the hail has left.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Strecke deine Hand im Hinblick auf die Heuschrecken[a] über das Land Ägypten aus, damit sie[b] über das Land Ägypten heraufkommen und alle Pflanzen des Landes fressen, alles, was der Hagel übrig gelassen hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine schwierige Verbindung mit der Präposition ב: „in Bezug auf die Heuschrecke“. Auch Wiedergaben wie „gegen die Heuschrecken“, „auf die Heuschrecken hin“ oder „für die Heuschrecken“ sind möglich.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen stehen „Heuschrecke“ und die zugehörigen Verben im Singular; die Heuschrecke ist kollektiv als ganzer Schwarm gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: נְטֵה יָדְךָ
  choice: Strecke deine Hand ... aus
  rationale: Die Wendung gibt den Imperativ und das konkrete Körperteil direkt und zugleich idiomatisch wieder.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: über das Land Ägypten
  rationale: Bewahrt sowohl die räumliche Bedeutung von עַל als auch das ausdrücklich genannte „Land“ und dessen Wiederholung im Vers.
- source_word: בָּאַרְבֶּה
  choice: wegen der Heuschrecken
  rationale: Die Präposition ב ist hier schwierig. „Wegen“ bringt den Bezug der Geste auf die angekündigte Heuschreckenplage verständlich zum Ausdruck, ohne die mögliche instrumentale oder zielgerichtete Nuance als eindeutig auszugeben.
- source_word: וְיַעַל
  choice: damit sie ... heraufkommen
  rationale: עלה wird mit „heraufkommen“ wiedergegeben. Der deutsche Plural folgt dem kollektiven Sinn von אַרְבֶּה; die formale Singulargestalt wird in einer Fußnote kenntlich gemacht.
- source_word: וְיֹאכַל
  choice: und ... fressen
  rationale: „Fressen“ ist bei Heuschrecken im Deutschen die natürliche Entsprechung für אכל. Der Plural folgt dem kollektiv verstandenen Subjekt.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: alle Pflanzen des Landes
  rationale: עֵשֶׂב bezeichnet hier die Vegetation allgemein und nicht nur Gras oder Kräuter; „alle Pflanzen“ ist gegenwärtiges, verständliches Deutsch.
- source_word: אֵת כָּל אֲשֶׁר הִשְׁאִיר הַבָּרָד
  choice: alles, was der Hagel übrig gelassen hat
  rationale: Gibt das Zurücklassen beziehungsweise Verschonen durch den Hagel klar wieder und verbindet die angekündigte Plage mit der vorigen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text bietet einen persönlichen Namen. Die Umschrift „Jahwe“ bewahrt diesen, ohne ihn durch einen Titel zu ersetzen oder eine konfessionelle Sonderform zu wählen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „über das Land Ägypten“ bleibt entsprechend dem hebräischen Text erhalten. Das Perfekt „übrig gelassen hat“ stellt natürlich den Bezug zur vorausgegangenen Hagelplage her.
