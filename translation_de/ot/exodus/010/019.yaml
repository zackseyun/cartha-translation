base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/019.yaml
  text: And Yahweh turned a very strong west wind[a], and it carried away the locusts and drove them into the Sea of Reeds[b]. Not one locust remained in all the territory of Egypt.
translation:
  language: de
  text: Da ließ Jahwe einen sehr starken Westwind[a] aufkommen. Der trug die Heuschrecken fort und trieb sie ins Schilfmeer[b]. Im ganzen Gebiet Ägyptens blieb keine einzige Heuschrecke übrig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Meerwind«; in diesem geografischen Kontext kann damit ein vom Mittelmeer kommender Westwind gemeint sein.'
    reason: Bewahrt die wörtliche hebräische Wendung und kennzeichnet die Deutung der Windrichtung als kontextuelle Möglichkeit.
  - marker: b
    text: 'Traditionell: »Rotes Meer«.'
    reason: Nennt die vertraute traditionelle Wiedergabe des hebräischen Namens יָם־סוּף.
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: ließ … aufkommen
  rationale: הפך bezeichnet ein Wenden oder Umschlagen. Im Zusammenhang mit der Windrichtung gibt die deutsche Wendung natürlich wieder, dass Jahwe den bisherigen Wind in einen anderen Wind umschlagen ließ.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: רוּחַ יָם
  choice: Westwind
  rationale: Wörtlich steht »Meerwind«. In Ägypten bezeichnet dies im Kontext einen vom Mittelmeer kommenden Westwind; die wörtliche Bildsprache wird in der Fußnote bewahrt.
- source_word: חָזָק מְאֹד
  choice: sehr starken
  rationale: Die einfache Verstärkung des Hebräischen wird in natürlichem modernem Deutsch unmittelbar wiedergegeben.
- source_word: וַיִּשָּׂא אֶת־הָאַרְבֶּה
  choice: trug die Heuschrecken fort
  rationale: נשא kann »heben« oder »tragen« bedeuten; bei Wind als handelnder Kraft bezeichnet es hier das Forttragen.
- source_word: וַיִּתְקָעֵהוּ
  choice: warf sie
  rationale: תקע bezeichnet hier ein gewaltsames Hineintreiben oder Hineinwerfen. Das singularische Suffix bezieht sich kollektiv auf den Heuschreckenschwarm; im Deutschen steht natürlich der Plural.
- source_word: יָמָּה סּוּף
  choice: ins Schilfmeer
  rationale: יָם־סוּף wird quellennah als »Schilfmeer« wiedergegeben; die traditionelle Bezeichnung »Rotes Meer« steht zur Orientierung in der Fußnote.
- source_word: לֹא נִשְׁאַר אַרְבֶּה אֶחָד
  choice: blieb keine einzige Heuschrecke übrig
  rationale: Die Formulierung bewahrt die emphatische Aussage, dass nicht einmal eine Heuschrecke zurückblieb.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: im ganzen Gebiet Ägyptens
  rationale: גְּבוּל meint hier nicht nur die Grenzlinie, sondern das gesamte abgegrenzte Gebiet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den Gottesnamen. Die Transliteration »Jahwe« bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von יָם־סוּף
  choice: Schilfmeer
  alternative: Rotes Meer
  rationale: »Schilfmeer« folgt der hebräischen Bezeichnung, ohne die traditionelle geografische Gleichsetzung zur Hauptlesart zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Sätze bilden die rasche Abfolge der hebräischen Erzählung ab. »Heuschrecken« steht als natürlicher deutscher Plural für das kollektiv behandelte hebräische Bezugswort.
