  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה גַּם אַתָּ֛ה תִּתֵּ֥ן בְּ/יָדֵ֖/נוּ זְבָחִ֣ים וְ/עֹל֑וֹת וְ/עָשִׂ֖ינוּ לַ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/025.yaml
  text: But Moses said[a], “You also must give into our hands sacrifices and burnt offerings, and we will offer them to Yahweh our God.”
translation:
  language: de
  text: 'Mose aber sagte: „Auch du musst uns Schlachtopfer und Brandopfer in unsere Hände geben, und wir werden sie Jahwe[a], unserem Gott, darbringen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH (יהוה), der persönliche Name Gottes.
    reason: Erläuterung des im Haupttext mit „Jahwe“ wiedergegebenen Gottesnamens.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mose aber sagte
  rationale: Das Narrativ-Waw führt die Handlung fort; „aber“ gibt zugleich den Gegensatz zu Pharaos Einschränkung im vorherigen Vers natürlich wieder.
- source_word: גַּם אַתָּה
  choice: Auch du
  rationale: Die Verbindung aus גַּם und dem ausdrücklich gesetzten Pronomen betont, dass Pharao selbst ebenfalls etwas bereitstellen muss.
- source_word: תִּתֵּן בְּיָדֵנוּ
  choice: musst uns … in die Hand geben
  rationale: „Musst“ bringt den nachdrücklichen Forderungscharakter zum Ausdruck; „in die Hand geben“ bewahrt das konkrete hebräische Bild in geläufigem Deutsch.
- source_word: זְבָחִים
  choice: Schlachtopfer
  rationale: Der Ausdruck bezeichnet Opfer, bei denen ein Tier geschlachtet wird, und bleibt so von den anschließend genannten Brandopfern unterscheidbar.
- source_word: וְעֹלֹת
  choice: und Brandopfer
  rationale: עֹלָה bezeichnet ein Opfer, das vollständig auf dem Altar verbrannt wird; „Brandopfer“ ist die klare, etablierte deutsche Wiedergabe.
- source_word: וְעָשִׂינוּ
  choice: und wir werden sie … darbringen
  rationale: עשה bedeutet wörtlich „tun/machen“, bezeichnet im Opferkontext jedoch die Ausführung beziehungsweise Darbringung des Opfers. Das ergänzte „sie“ macht den deutschen Satz natürlich, ohne den Sinn zu erweitern.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: Jahwe, unserem Gott, darbringen
  rationale: Die Präposition kennzeichnet den Empfänger der Opferhandlung. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, אֱלֹהֵינוּ als „unserem Gott“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm יהוה. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Schlachtopfern und Brandopfern
  choice: zwei ausdrücklich genannte Opferkategorien
  alternative: allgemein „Opfer und Brandopfer“
  rationale: „Schlachtopfer“ bewahrt die konkrete Bedeutung von זְבָחִים und lässt die im Hebräischen erkennbare Unterscheidung zu עֹלֹת bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung „Mose aber sagte“ hält den erzählerischen Ton, während „in die Hand geben“ das hebräische Bild verständlich bewahrt.
