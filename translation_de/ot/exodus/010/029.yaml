  source_fidelity: 'Die Übersetzung gibt die Aussage des Hebräischen zuverlässig wieder. כֵּן דִּבַּרְתָּ ist eine zustimmende Erwiderung auf die vorherige Rede des Pharaos; „Du hast recht“ ist dafür eine natürliche deutsche Wiedergabe. לֹא אֹסִף עוֹד רְאוֹת פָּנֶיךָ wird treffend als künftig ausgeschlossener erneuter Kontakt wiedergegeben: „Ich werde dein Angesicht nicht wiedersehen.“'
