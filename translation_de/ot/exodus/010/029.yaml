  terminology: „Mose“ ist die etablierte deutsche Namensform. „Angesicht“ entspricht dem konkreten hebräischen Ausdruck und vermeidet eine unnötige interpretierende Ersetzung durch „Gegenwart“. Die Fußnoten sind korrekt verankert und erhalten sowohl die nähere Formulierung von כֵּן דִּבַּרְתָּ als auch die hebräische Wendung mit יסף.
