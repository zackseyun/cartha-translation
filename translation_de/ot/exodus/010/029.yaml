  yaml_path: translation/ot/exodus/010/029.yaml
  text: And Moses said[a], “As you have spoken[b], I will not again see your face.”
translation:
  language: de
  text: 'Da sagte Mose: »Du hast recht.[a] Ich werde dein Angesicht nicht wiedersehen.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „So, wie du geredet hast“; auch möglich: „So sei es, wie du gesagt hast.“'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Ich werde nicht hinzufügen, dein Angesicht noch einmal zu sehen“ – eine hebräische Ausdrucksweise für „Ich werde dein Angesicht nicht wiedersehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt Moses unmittelbare Antwort im Erzählfluss ein. „Da sagte“ ist im modernen Deutschen natürlich, ohne eine stärkere zeitliche Folgerung hinzuzufügen.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Übliche deutsche Form des hebräischen Personennamens.
- source_word: כֵּן דִּבַּרְתָּ
  choice: Du hast recht
  rationale: Die Wendung bestätigt die vorausgehende Aussage des Pharaos. „Du hast recht“ gibt diese Zustimmung natürlich und knapp wieder; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: לֹא אֹסִף עוֹד רְאוֹת
  choice: Ich werde … nicht wiedersehen
  rationale: Die verneinte Hifil-Form von יסף zusammen mit עוֹד und dem Infinitiv bezeichnet, dass die Handlung nicht erneut stattfinden wird. Im Deutschen drückt „nicht wiedersehen“ dies idiomatisch und ohne zusätzliche Verstärkung aus.
- source_word: פָּנֶיךָ
  choice: dein Angesicht
  rationale: Die Wiedergabe bewahrt das konkrete hebräische Bild „dein Gesicht/Angesicht“. „Angesicht“ passt zum würdevollen Register einer direkten, formellen Konfrontation.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. „Angesicht“ erhält bewusst das hebräische Bild; die übrige Syntax ist natürlich deutsch.
