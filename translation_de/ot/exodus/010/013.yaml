source:
  edition: WLC
  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יהוָ֗ה נִהַ֤ג ר֥וּחַ קָדִים֙ בָּ/אָ֔רֶץ כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה הַ/בֹּ֣קֶר הָיָ֔ה וְ/ר֨וּחַ֙ הַ/קָּדִ֔ים נָשָׂ֖א אֶת הָ/אַרְבֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/013.yaml
  text: So Moses stretched out his staff over the land of Egypt[a], and Yahweh drove an east wind over the land all that day and all the night. When morning came, the east wind had brought the locusts.
translation:
  language: de
  text: Da streckte Mose seinen Stab über das Land Ägypten aus, und Jahwe trieb einen Ostwind[a] über das Land, jenen ganzen Tag und die ganze Nacht. Als es Morgen wurde, hatte der Ostwind die Heuschrecken herbeigetragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: einen Wind aus Osten.'
    reason: Lexikalische Alternative zu רוּחַ קָדִים; die Wendung bezeichnet die Herkunftsrichtung des Windes.
lexical_decisions:
- source_word: וַיֵּט
  choice: streckte … aus
  rationale: נטה bezeichnet hier das Ausstrecken beziehungsweise Ausrichten des Stabes; die deutsche Verbklammer gibt die Handlung natürlich und präzise wieder.
- source_word: מַטֵּהוּ
  choice: seinen Stab
  rationale: מַטֶּה kann »Stab« oder »Stock« bedeuten; »Stab« ist im Exoduszusammenhang klar und im modernen Deutsch geläufig.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: über das Land Ägypten
  rationale: עַל bezeichnet bei der Geste mit dem Stab am natürlichsten die Ausrichtung »über« dem Land; אֶרֶץ מִצְרַיִם wird ausdrücklich wiedergegeben.
- source_word: נִהַג
  choice: trieb
  rationale: נהג bedeutet führen oder treiben. Mit dem Wind als Objekt bewahrt »trieb« die aktive Verursachung und die Bewegungsrichtung über das Land.
- source_word: רוּחַ קָדִים
  choice: einen Ostwind
  rationale: Die Verbindung bezeichnet einen aus Osten kommenden Wind; »Ostwind« ist die natürliche knappe deutsche Entsprechung.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: jenen ganzen Tag und die ganze Nacht
  rationale: »Jenen ganzen Tag« gibt das Demonstrativum הַהוּא wieder; »die ganze Nacht« bewahrt die wiederholte Gesamtdauer, ohne unnatürlich zu klingen.
- source_word: הַבֹּקֶר הָיָה
  choice: Als es Morgen wurde
  rationale: Die knappe hebräische Zeitangabe wird als natürlicher temporaler Übergang wiedergegeben.
- source_word: נָשָׂא אֶת הָאַרְבֶּה
  choice: hatte … die Heuschrecken herbeigetragen
  rationale: נשא bezeichnet das Tragen beziehungsweise Heranbringen durch den Wind. Das Plusquamperfekt verdeutlicht, dass dies bis zum Morgen geschehen war, ohne eine zusätzliche Ursache einzuführen.
- source_word: הָאַרְבֶּה
  choice: die Heuschrecken
  rationale: Der hebräische Singular ist kollektiv gebraucht; der deutsche Plural gibt den Schwarm idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. Die Satzstruktur bleibt nahe am Hebräischen, während deutsche Wortstellung und Tempusgebrauch natürlich gehalten werden.
