base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/006.yaml
  text: And they will fill your houses[a], the houses of all your servants[b], and the houses of all Egypt—something your fathers and your fathers’ fathers have not seen from the day they were on the land until this day.” Then he turned and went out from Pharaoh.
translation:
  language: de
  text: Sie werden deine Häuser, die Häuser all deiner Diener und die Häuser ganz Ägyptens füllen. Etwas Derartiges[a] haben deine Väter und die Väter deiner Väter seitdem sie auf der Erde sind, bis zum heutigen Tag nicht gesehen.« Dann wandte er sich um und ging vom Pharao fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »das deine Väter und die Väter deiner Väter nicht gesehen haben«. Der Relativsatz bezieht sich auf die zuvor angekündigte, beispiellose Plage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: Sie werden … füllen
  rationale: Das Qal-Perfekt mit ו setzt die Zukunftsaussage der vorangehenden Plagenankündigung fort. Das aus dem Zusammenhang erschlossene Subjekt sind die Heuschrecken.
- source_word: בָתֶּיךָ ... וּבָתֵּי כָל עֲבָדֶיךָ ... וּבָתֵּי כָל מִצְרַיִם
  choice: deine Häuser, die Häuser all deiner Diener und die Häuser ganz Ägyptens
  rationale: Die dreifache Wiederholung von »Häuser« bewahrt die hebräische Steigerung vom Pharao über seine Diener bis zu ganz Ägypten.
- source_word: עֲבָדֶיךָ
  choice: deiner Diener
  rationale: »Diener« lässt die im höfischen Zusammenhang naheliegende Bedeutung »Amtsträger/Hofbeamte« offen, ohne einen Sklavenstatus festzulegen.
- source_word: אֲשֶׁר לֹא רָאוּ
  choice: Etwas Derartiges haben … nicht gesehen
  rationale: Die Relativkonstruktion bezeichnet die beispiellose Plage. Die selbstständige deutsche Formulierung macht den Bezug verständlich, ohne die außergewöhnliche Dimension näher auszudeuten.
- source_word: אֲבֹתֶיךָ וַאֲבֹת אֲבֹתֶיךָ
  choice: deine Väter und die Väter deiner Väter
  rationale: Die Wiedergabe hält die generationenübergreifende hebräische Ausdrucksweise fest; »Großväter« wäre zu eng.
- source_word: מִיּוֹם הֱיוֹתָם עַל הָאֲדָמָה
  choice: seit sie auf der Erde waren
  rationale: Die Formulierung gibt den Beginn und die Dauer der menschlichen Anwesenheit wieder. »Erde« passt zur umfassenden Rückschau auf frühere Generationen.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Dies ist eine natürliche, zugleich feierliche Wiedergabe der hebräischen Zeitformel.
- source_word: וַיִּפֶן וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: Dann wandte er sich um und ging vom Pharao weg
  rationale: Die beiden aufeinanderfolgenden Verben werden als bewusste Abwendung und anschließender Weggang wiedergegeben; das im Kontext eindeutige Subjekt bleibt wie im Hebräischen ungenannt.
