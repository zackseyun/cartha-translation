  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְמַהֵ֣ר פַּרְעֹ֔ה לִ/קְרֹ֖א לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֑ן וַ/יֹּ֗אמֶר חָטָ֛אתִי לַ/יהוָ֥ה אֱלֹֽהֵי/כֶ֖ם וְ/לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/016.yaml
  text: Then Pharaoh hurried to call for Moses and Aaron, and he said, “I have sinned against Yahweh your God and against you.”
translation:
  language: de
  text: 'Da ließ der Pharao eilig Mose und Aaron rufen und sagte: »Ich habe gegen Jahwe, euren Gott, und gegen euch gesündigt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: eilig
  rationale: Das Verb מהר bezeichnet rasches, dringliches Handeln. In Verbindung mit »ließ … rufen« gibt »eilig« die Dringlichkeit natürlich und präzise wieder.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Die im Deutschen übliche Wiedergabe des ägyptischen Herrschertitels mit bestimmtem Artikel.
- source_word: לִקְרֹא לְמֹשֶׁה וּלְאַהֲרֹן
  choice: Mose und Aaron rufen
  rationale: Die Konstruktion bedeutet hier, jemanden zu sich rufen beziehungsweise holen zu lassen. »ließ … rufen« ist dafür idiomatisches modernes Deutsch.
- source_word: חָטָאתִי
  choice: Ich habe … gesündigt
  rationale: Das Verb חטא wird mit seinem vollen moralisch-theologischen Gewicht als »sündigen« wiedergegeben; das Perfekt ist in direkter Rede natürlich.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: gegen Jahwe, euren Gott
  rationale: 'Nach חטא bezeichnet ל die von der Sünde betroffene Partei und wird idiomatisch mit »gegen« wiedergegeben. אֱלֹהֵיכֶם ist ausdrücklich zweite Person Plural: »euren Gott«.'
- source_word: וְלָכֶם
  choice: und gegen euch
  rationale: Die Präposition wird entsprechend dem vorausgehenden »gegen« verstanden; der Plural bezieht Mose und Aaron gemeinsam ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den Eigennamen transparent wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Adressaten von Pharaos Bekenntnis
  choice: euren Gott
  alternative: unseren Gott
  rationale: Der Suffix der zweiten Person Plural ist eindeutig. Pharao bezeichnet Jahwe als den Gott Moses und Aarons beziehungsweise Israels, nicht als seinen eigenen.
- issue: Bedeutung der Präposition ל nach חטא
  choice: gegen … gesündigt
  alternative: an … gesündigt
  rationale: Beide deutschen Fügungen sind möglich; »gegen jemanden sündigen« ist gegenwärtig klar und bewahrt den Sinn einer gegen Gott und die Angesprochenen gerichteten Verfehlung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah an der hebräischen Erzählstruktur; »ließ … rufen« vermeidet eine missverständliche wörtliche Wiedergabe und klingt natürlich. Keine Fußnoten erforderlich.
