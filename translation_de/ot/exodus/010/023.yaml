  text: לֹֽא רָא֞וּ אִ֣ישׁ אֶת אָחִ֗י/ו וְ/לֹא קָ֛מוּ אִ֥ישׁ מִ/תַּחְתָּ֖י/ו שְׁלֹ֣שֶׁת יָמִ֑ים וּֽ/לְ/כָל בְּנֵ֧י יִשְׂרָאֵ֛ל הָ֥יָה א֖וֹר בְּ/מוֹשְׁבֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/023.yaml
  text: They did not see one another[a], and no one rose from his place for three days[b]; but all the sons of Israel had light in their dwellings.
translation:
  language: de
  text: Sie sahen einander nicht[a], und drei Tage lang stand niemand von seinem Platz auf. Doch alle Israeliten hatten Licht in ihren Wohnstätten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ein Mann sah seinen Bruder nicht.“ Die hebräische Wendung ist wechselseitig gemeint: „Sie sahen einander nicht.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ ... אֶת־אָחִיו
  choice: sahen einander nicht
  rationale: Die Verbindung אִישׁ אֶת־אָחִיו ist reziprok. „Einander“ gibt den Sinn im Deutschen natürlich wieder, ohne „Bruder“ fälschlich auf leibliche Brüder zu beschränken. Das Hebräische sagt schlicht, dass sie einander nicht sahen; „konnten ... nicht sehen“ wäre stärker deutend.
- source_word: אִישׁ ... לֹא קָמוּ
  choice: niemand stand ... auf
  rationale: אִישׁ wird hier distributiv und allgemein gebraucht. Mit der Verneinung ist „niemand“ die natürliche deutsche Wiedergabe.
- source_word: קָמוּ
  choice: stand ... auf
  rationale: קום bedeutet hier „aufstehen/sich erheben“. „Stand ... auf“ ist idiomatisch und wahrt den erzählenden Ton.
- source_word: מִתַּחְתָּיו
  choice: von seinem Platz
  rationale: Wörtlich bedeutet die Form „von unter sich/ihm“; idiomatisch bezeichnet sie den Ort, an dem jemand sich befindet. „Von seinem Platz“ ist klar und nicht unnötig wörtlich.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: drei Tage lang
  rationale: Die deutsche Dauerangabe „drei Tage lang“ gibt die adverbiale Funktion natürlich wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  rationale: Die wörtliche Form „Söhne Israels“ ist eine ethnisch-bundeshafte Bezeichnung für das Volk insgesamt. „Israeliten“ ist im modernen Deutsch eindeutig, inklusiv und natürlich.
- source_word: הָיָה אוֹר
  choice: hatten Licht
  rationale: Die Konstruktion mit היה und לְ drückt hier aus, dass den Israeliten Licht zur Verfügung stand. „Hatten Licht“ bildet den Kontrast zur Finsternis knapp ab.
- source_word: בְּמוֹשְׁבֹתָם
  choice: in ihren Wohnstätten
  rationale: מוֹשָׁב kann Wohnort, Wohnstätte oder Siedlung bezeichnen. „Wohnstätten“ bewahrt die örtliche Mehrdeutigkeit und passt zum gehobenen Erzählregister.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die Satzstellung hebt die Dauer der völligen Bewegungslosigkeit hervor. „Wohnstätten“ ist etwas gehobener als „Wohnungen“, bleibt aber allgemein verständlich und deckt Häuser wie Siedlungsorte ab.
