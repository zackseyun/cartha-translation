  text: וַ/יֵּצֵ֖א מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יֶּעְתַּ֖ר אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/018.yaml
  text: So he went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: de
  text: Darauf ging er vom Pharao weg und flehte zu Jahwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: betete inständig zu Jahwe; auch: bat Jahwe inständig. Das hebräische Verb bezeichnet eine eindringliche Bitte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ging … weg
  rationale: Das Qal-Wayyiqtol von יצא bezeichnet hier das Hinausgehen beziehungsweise Fortgehen und führt die Erzählung zeitlich weiter.
- source_word: מֵעִם
  choice: vom Pharao weg
  rationale: מֵעִם bezeichnet die Trennung aus der unmittelbaren Nähe oder Gegenwart einer Person. Die deutsche Wendung gibt dies natürlich wieder.
- source_word: פַּרְעֹה
  choice: Pharao
  rationale: Übliche deutsche Wiedergabe des ägyptischen Herrschertitels.
- source_word: וַיֶּעְתַּר
  choice: flehte
  rationale: Das Verb עתר bezeichnet hier eine eindringliche, an Gott gerichtete Bitte. „Flehte“ bewahrt den Nachdruck der Bitte und ist im modernen Deutsch verständlich.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet die Ausrichtung der inständigen Bitte auf Jahwe; „zu Jahwe flehen“ ist idiomatisches Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht ausdrücklich das Tetragramm. Die Wiedergabe „Jahwe“ bewahrt den persönlichen Gottesnamen.
- issue: Gebetscharakter von וַיֶּעְתַּר
  choice: flehte zu Jahwe
  alternative: betete inständig zu Jahwe
  rationale: „Flehte“ gibt die dringliche Bitte wieder, ohne den im Verb enthaltenen Gebetsbezug unnötig auszudeuten; die Alternative macht diesen Bezug ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Darauf“ bildet die fortlaufende Erzählung ab; „vom Pharao weggehen“ ist natürlich und bewahrt den Gedanken des Verlassens seiner Gegenwart.
