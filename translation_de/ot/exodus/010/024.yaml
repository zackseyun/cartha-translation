  source_fidelity: 'Der Sinn der Rede, die Einschränkung des Pharao und die Einbeziehung der Kinder sind zutreffend wiedergegeben. »Schafe und Rinder« ist jedoch für צֹאן וּבָקָר zu eng: צֹאן umfasst auch Ziegen. »Kleinvieh und Rinder« bewahrt die Unterscheidung von Klein- und Großvieh ohne diese Einengung.'
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch. »Da rief der Pharao Mose zu sich« und »dürfen mit euch gehen« sind im Kontext einer gewährten, aber eingeschränkten Erlaubnis idiomatisch.
  terminology: »Jahwe« gibt den Gottesnamen angemessen wieder; »dient« erhält das für Exodus wichtige Motiv des Dienstes. »Kinder« ist eine natürliche Wiedergabe von טַף, und die Fußnote erhält dessen mögliche weitere Reichweite.
