  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה אֶל מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ לְכוּ֙ עִבְד֣וּ אֶת יְהוָ֔ה רַ֛ק צֹאנְ/כֶ֥ם וּ/בְקַרְ/כֶ֖ם יֻצָּ֑ג גַּֽם טַפְּ/כֶ֖ם יֵלֵ֥ךְ עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/024.yaml
  text: Then Pharaoh called to Moses and said[a], “Go, serve Yahweh. Only let your flocks and your herds remain behind[b]; even your little ones may go with you.”
translation:
  language: de
  text: 'Da rief der Pharao Mose zu sich und sagte: »Geht und dient Jahwe! Nur euer Kleinvieh und eure Rinder sollen zurückbleiben[a]; auch eure Kinder[b] dürfen mit euch gehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sollen zurückgelassen werden«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »eure Kleinen«; gemeint sein können auch die jüngeren abhängigen Angehörigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה אֶל מֹשֶׁה
  choice: Da rief der Pharao Mose zu sich
  rationale: קרא אל bezeichnet hier, dass der Pharao Mose rufen lässt bzw. zu sich ruft. Die Formulierung ist im Deutschen natürlich und passt zur unmittelbaren Rede.
- source_word: לְכוּ
  choice: Geht
  rationale: Der Imperativ Plural von הלך wird direkt und verständlich wiedergegeben.
- source_word: עִבְדוּ אֶת יְהוָה
  choice: dient Jahwe
  rationale: עבד kann im Blick auf Gott sowohl dienen als auch verehren bedeuten. »Dient« bewahrt das zentrale Exodus-Motiv des Dienstes für Jahwe im Gegensatz zum Frondienst für den Pharao.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: רַק
  choice: Nur
  rationale: רק leitet die Einschränkung ein, die der Pharao mit seiner Erlaubnis verbindet.
- source_word: צֹאנְכֶם וּבְקַרְכֶם
  choice: eure Schafe und Rinder
  rationale: צאן bezeichnet Kleinvieh, besonders Schafe und Ziegen, בקר dagegen Großvieh, besonders Rinder. Die konkrete deutsche Wiedergabe ist für heutige Leser klar; »Schafe« fungiert hier als geläufige Sammelbezeichnung für das Kleinvieh.
- source_word: יֻצָּג
  choice: sollen zurückbleiben
  rationale: Die Hophal-Form von יצג bezeichnet hier, dass die Tiere an Ort und Stelle belassen werden. »Sollen zurückbleiben« gibt im Zusammenhang die vom Pharao auferlegte Bedingung natürlich wieder.
- source_word: גַּם
  choice: auch
  rationale: גם schließt die Kinder ausdrücklich in die Erlaubnis ein. »Auch« wahrt diese additive, im Kontext zugleich einräumende Funktion.
- source_word: טַפְּכֶם
  choice: eure Kinder
  rationale: טף bezeichnet kleine Kinder beziehungsweise die abhängigen jüngeren Angehörigen eines Haushalts. »Kinder« ist die natürliche moderne Wiedergabe, während die engere Nuance in einer Fußnote erhalten bleibt.
- source_word: יֵלֵךְ עִמָּכֶם
  choice: dürfen mit euch gehen
  rationale: Die Verbform lautet wörtlich »soll/wird mit euch gehen«; im Mund des Pharao drückt sie hier eine Erlaubnis aus, weshalb »dürfen« im Deutschen den pragmatischen Sinn klar wiedergibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עבד im Verhältnis zu Gott
  choice: dienen
  alternative: verehren
  rationale: Beide Bedeutungsaspekte sind möglich. »Dienen« bleibt näher am Lexem und erhält die theologische Spannung des Exodus zwischen dem Dienst für den Pharao und dem Dienst für Jahwe, ohne den kultischen Bezug auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, gut verständlicher Syntax. Die Rede bleibt knapp und befehlend. Die Anredeformen im Plural werden entsprechend dem hebräischen Text durchgehend bewahrt.
