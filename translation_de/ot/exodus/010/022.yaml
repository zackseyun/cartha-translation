source:
  edition: WLC
  text: וַ/יֵּ֥ט מֹשֶׁ֛ה אֶת יָד֖/וֹ עַל הַ/שָּׁמָ֑יִם וַ/יְהִ֧י חֹֽשֶׁךְ אֲפֵלָ֛ה בְּ/כָל אֶ֥רֶץ מִצְרַ֖יִם שְׁלֹ֥שֶׁת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/022.yaml
  text: So Moses stretched out his hand toward the sky[b][a], and there was thick darkness over all the land of Egypt for three days.
translation:
  language: de
  text: Da streckte Mose seine Hand zum Himmel[a] aus, und drei Tage lang lag tiefe Finsternis[b] über dem ganzen Land Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zum Himmelsgewölbe«. Das hebräische Wort kann je nach Zusammenhang den sichtbaren Himmel oder den Himmel im überirdischen Sinn bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »dichte Dunkelheit«. Im Hebräischen stehen zwei Ausdrücke für Dunkelheit beieinander und verstärken einander.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: streckte … aus
  rationale: נטה bezeichnet in Verbindung mit der Hand das Ausstrecken; die deutsche Verbklammer ist natürlich und bewahrt die konkrete Geste.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: יָד bedeutet hier gewöhnlich »Hand«; eine Erweiterung zu »Arm« ist nicht nötig.
- source_word: עַל הַשָּׁמַיִם
  choice: zum Himmel
  rationale: Bei einer ausgestreckten Hand bezeichnet עַל hier die Richtung. שָׁמַיִם kann je nach Zusammenhang »Himmel« im sichtbaren oder überirdischen Sinn bezeichnen; »zum Himmel« ist im Deutschen idiomatisch und wahrt diese Offenheit.
- source_word: וַיְהִי
  choice: lag
  rationale: Die Konstruktion führt den eintretenden Zustand ein. Zusammen mit »Finsternis … über dem Land« gibt »lag« dies natürlich wieder, ohne eine Ursache hinzuzufügen.
- source_word: חֹשֶׁךְ אֲפֵלָה
  choice: tiefe Finsternis
  rationale: Die Verbindung zweier Ausdrücke für Dunkelheit wirkt verstärkend. »Tiefe Finsternis« bildet die Intensität knapp und würdig ab.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: über dem ganzen Land Ägypten
  rationale: Die Formulierung gibt den gesamten räumlichen Umfang wieder; »über« ist bei einer über einem Land liegenden Finsternis idiomatisches Deutsch.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: drei Tage lang
  rationale: Die deutsche Wendung kennzeichnet die im Hebräischen ohne Präposition ausgedrückte Zeitdauer klar.
theological_decisions:
- issue: Bedeutungsumfang von הַשָּׁמַיִם
  choice: Himmel
  alternative: Himmelsgewölbe; Himmel im überirdischen Sinn
  rationale: Der Kontext legt den sichtbaren Himmel nahe, doch das hebräische Wort selbst unterscheidet diese Bedeutungen nicht scharf. Die Übersetzung lässt die mögliche Mehrdeutigkeit bestehen und erläutert sie in der Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. »Finsternis« bewahrt gegenüber dem alltäglicheren »Dunkelheit« die besondere Schwere des Ausdrucks; die Satzstellung bleibt flüssig und natürlich.
