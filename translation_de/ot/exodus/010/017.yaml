  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente zutreffend wieder: die dringliche Bitte, die einmalige Begrenzung, den Gottesnamen, Pharaos distanzierendes »eurem Gott« sowie die auffällige Formulierung »diesen Tod«. Allerdings wechselt das Hebräische von einem Imperativ Singular (»vergib«) zu einem Imperativ Plural (an Mose und Aaron: »fleht«). Dieser Wechsel muss im Deutschen ausdrücklich kenntlich sein.'
  naturalness: Die Form »vergib … und fleht« ist ohne Pronomen missverständlich und wirkt grammatisch uneinheitlich, weil »fleht« auch als Indikativ gelesen werden kann. Die ausdrückliche Anrede »vergib du« / »fleht ihr« macht den absichtlichen Numeruswechsel klar und bleibt modernes, würdiges Standarddeutsch.
  terminology: »Jahwe« entspricht dem ausdrücklich gebrauchten Gottesnamen יהוה. »Sünde«, »eurem Gott« und »diesen Tod« sind quellentreu. Die Fußnote zu Marker a muss jedoch den Singular des hebräischen ersten Imperativs abbilden; »Tragt« wäre hier nicht korrekt.
