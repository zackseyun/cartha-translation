  text: וְ/עַתָּ֗ה שָׂ֣א נָ֤א חַטָּאתִ/י֙ אַ֣ךְ הַ/פַּ֔עַם וְ/הַעְתִּ֖ירוּ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/יָסֵר֙ מֵֽ/עָלַ֔/י רַ֖ק אֶת הַ/מָּ֥וֶת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/017.yaml
  text: So now[a], please forgive my sin just this once, and plead with Yahweh your God[b], that he may remove from me this death only.
translation:
  language: de
  text: Und nun vergib du mir bitte meine Sünde, nur dieses eine Mal[a], und fleht ihr zu Jahwe, eurem Gott, dass er nur diesen Tod von mir wegnimmt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich kann die hebräische Wendung auch heißen: »Trag meine Sünde weg« oder »Verzeih mir meine Sünde«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »diesen Tod«. Gemeint ist wahrscheinlich die gegenwärtige tödliche Plage samt ihren Folgen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt sowohl die verbindende Konjunktion als auch die zeitliche und folgernde Wendung natürlich wieder.
- source_word: שָׂא נָא חַטָּאתִי
  choice: vergib mir bitte meine Sünde
  rationale: נשא mit »Sünde« als Objekt ist eine hebräische Redewendung für das Wegtragen beziehungsweise Vergeben von Schuld; נָא kennzeichnet die dringliche Bitte.
- source_word: אַךְ הַפַּעַם
  choice: nur dieses eine Mal
  rationale: Bewahrt die einschränkende Bedeutung der Wendung und klingt im modernen Deutschen natürlich.
- source_word: וְהַעְתִּירוּ
  choice: und fleht
  rationale: Der Hifil von עתר bezeichnet hier ein dringliches, an Gott gerichtetes Bitten; der Plural wird entsprechend dem hebräischen Text beibehalten.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: zu Jahwe, eurem Gott
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben; »eurem Gott« bewahrt Pharaos distanzierende Ausdrucksweise und die Pluralanrede.
- source_word: וְיָסֵר מֵעָלַי
  choice: dass er … von mir wegnimmt
  rationale: Gibt die vom vorausgehenden Flehen abhängige Zweck- beziehungsweise Folgebeziehung idiomatisch wieder.
- source_word: רַק אֶת־הַמָּוֶת הַזֶּה
  choice: nur diesen Tod
  rationale: Bewahrt sowohl die einschränkende Partikel als auch die auffällige wörtliche Formulierung »diesen Tod«, ohne sie vorschnell als »Plage« auszudeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Tetragrammaton; »Jahwe« gibt den persönlichen Gottesnamen wieder.
- issue: Bedeutung von »dieser Tod«
  choice: wörtlich beibehalten
  alternative: diese tödliche Plage
  rationale: Die Formulierung kann die gegenwärtige tödliche Heuschreckenplage und ihre Folgen bezeichnen, doch der Text selbst sagt »Tod«; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dringliche Bitte Pharaos, die Pluralanrede an Mose und Aaron sowie seine distanzierende Formulierung »eurem Gott« werden bewahrt.
