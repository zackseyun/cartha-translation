base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/028.yaml
  text: Then Pharaoh said to him[a], “Go away from me. Watch yourself; do not see my face again, for on the day you see my face[b], you will die.”
translation:
  language: de
  text: 'Da sagte der Pharao zu ihm: »Geh weg von mir! Hüte dich; sieh mein Gesicht nicht wieder[a]! Denn an dem Tag, an dem du mein Gesicht siehst[b], wirst du sterben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Füge nicht hinzu, mein Gesicht zu sehen.« Die hebräische Wendung bedeutet idiomatisch: »Sieh mein Gesicht nicht wieder« oder »Sieh mein Gesicht nie wieder.«'
    reason: lexical_alternative
  - marker: b
    text: »Mein Gesicht« kann auch im Sinn von »meine Gegenwart« verstanden werden. Im Hebräischen steht jedoch an beiden Stellen ausdrücklich »mein Gesicht«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ פַרְעֹה
  choice: Da sagte der Pharao zu ihm
  rationale: Das narrative וַ wird mit »Da« als natürlicher deutscher Erzählfortgang wiedergegeben; לֹו bleibt durch »zu ihm« ausdrücklich erhalten.
- source_word: לֵךְ מֵעָלָי
  choice: Geh weg von mir!
  rationale: Die knappe Aufforderung bewahrt sowohl den Imperativ als auch den schroffen, abweisenden Ton.
- source_word: הִשָּׁמֶר לְךָ
  choice: Hüte dich
  rationale: Der Nifal-Imperativ mit ethischem Dativ ist eine eindringliche Warnung. »Hüte dich« ist im modernen Deutschen verständlich und trägt den drohenden Ton.
- source_word: אַל תֹּסֶף רְאוֹת פָּנַי
  choice: Du darfst mir nicht noch einmal unter die Augen kommen
  rationale: יסף mit Infinitiv bedeutet idiomatisch, eine Handlung erneut oder weiterhin zu tun. Die deutsche Wendung gibt das erneute Sehen natürlich wieder und bewahrt zugleich das Bild des Angesichts.
- source_word: פָּנַי
  choice: mir unter die Augen
  rationale: פנים bezeichnet wörtlich das Gesicht, kann aber metonymisch die persönliche Gegenwart meinen. »Unter die Augen kommen« hält Gesicht, Begegnung und Gegenwart zusammen und lässt die Wiederholung im Vers bestehen.
- source_word: בְּיוֹם
  choice: an dem Tag
  rationale: Die konkrete Zeitformel wird gegenüber dem allgemeineren »wenn« formal bewahrt und unterstreicht die feierliche Drohung.
- source_word: רְאֹתְךָ פָנַי
  choice: an dem du mir unter die Augen kommst
  rationale: Der Infinitiv mit Suffix wird als natürlicher deutscher Relativsatz wiedergegeben; das wiederholte פָּנַי bleibt sprachlich erkennbar.
- source_word: תָּמוּת
  choice: wirst du sterben
  rationale: Die Präfixform drückt in diesem Drohwort die sichere Folge aus. Das Futur ist klar, modern und nicht unnötig archaisch.
