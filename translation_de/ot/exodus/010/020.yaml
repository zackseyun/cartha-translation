base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/020.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he did not let the sons of Israel go.
translation:
  language: de
  text: Aber Jahwe verhärtete[a] das Herz des Pharaos, und der Pharao ließ die Israeliten[b] nicht ziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „machte das Herz des Pharaos fest“ oder „stärkte das Herz des Pharaos“; das hebräische Verb bedeutet wörtlich „stark/fest machen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Söhne Israels“; traditionell auch: „die Kinder Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: verhärtete
  rationale: Das Verb חזק bedeutet grundsätzlich „stark/fest machen“. In der wiederkehrenden Formel über das Herz des Pharaos gibt „verhärten“ die im Zusammenhang gemeinte Verfestigung seines Widerstands natürlich und prägnant wieder; die wörtlicheren Möglichkeiten werden in einer Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: לֵב
  choice: Herz
  rationale: „Herz“ bewahrt das hebräische Bild und umfasst hier die innere Haltung, den Willen und die Entschlossenheit des Pharaos.
- source_word: פַּרְעֹה
  choice: des Pharaos
  rationale: Die Genitivform entspricht der hebräischen Verbindung „das Herz des Pharaos“ und ist im Deutschen idiomatisch.
- source_word: שִׁלַּח
  choice: ließ … nicht ziehen
  rationale: Im Exoduszusammenhang bezeichnet שלח die verweigerte Freilassung Israels. „Nicht ziehen lassen“ ist die geläufige und kontextgerechte deutsche Formulierung.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: „Die Israeliten“ ist im modernen Deutsch die natürliche Bezeichnung für das Volk Israel. Die formal nähere Wiedergabe „die Söhne Israels“ wird als Alternative in der Fußnote genannt.
theological_decisions:
- issue: Göttliches Handeln bei der Verhärtung des Pharaos
  choice: Jahwe verhärtete das Herz des Pharaos
  alternative: Jahwe machte das Herz des Pharaos fest / stärkte das Herz des Pharaos
  rationale: Der hebräische Text schreibt Jahwe die Handlung ausdrücklich zu. Die Übersetzung schwächt diese göttliche Urheberschaft nicht ab und erklärt zugleich nicht über den Vers hinaus, wie sie sich zur Verantwortung des Pharaos verhält.
- issue: Bezugswort des unausgedrückten Subjekts in וְלֹא שִׁלַּח
  choice: der Pharao ließ … nicht ziehen
  alternative: er ließ … nicht ziehen
  rationale: Im Hebräischen ist das Subjekt des zweiten Verbs nur durch die maskuline Singularform angezeigt und bezieht sich im Zusammenhang auf den Pharao. Die Wiederholung des Substantivs verhindert im Deutschen die mögliche Fehlinterpretation, Jahwe sei das Subjekt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung „der Pharao“ statt des Pronomens „er“ dient der eindeutigen Zuordnung des Handelnden. Beide Fußnotenmarker erscheinen unmittelbar bei den betreffenden Ausdrücken im Haupttext.
