  text: וְ/גַם מִקְנֵ֜/נוּ יֵלֵ֣ךְ עִמָּ֗/נוּ לֹ֤א תִשָּׁאֵר֙ פַּרְסָ֔ה כִּ֚י מִמֶּ֣/נּוּ נִקַּ֔ח לַ/עֲבֹ֖ד אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַ/אֲנַ֣חְנוּ לֹֽא נֵדַ֗ע מַֽה נַּעֲבֹד֙ אֶת יְהוָ֔ה עַד בֹּאֵ֖/נוּ שָֽׁמָּ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/026.yaml
  text: And even our livestock will go with us; not a hoof will be left behind[a], for from them we must take to serve Yahweh our God, and we do not know with what we must serve Yahweh until we arrive there.
translation:
  language: de
  text: Auch unser Vieh wird mit uns gehen; kein Huf wird zurückbleiben. Denn davon werden wir nehmen, um Jahwe, unserem Gott, zu dienen[a]. Und wir wissen nicht, womit wir Jahwe dienen sollen, bis wir dort ankommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe, unseren Gott, zu verehren“ und „womit wir Jahwe verehren sollen“. Das hebräische Verb kann „dienen“ bedeuten und in diesem Zusammenhang auch den Gottesdienst beziehungsweise die Verehrung Gottes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵנוּ
  choice: unser Vieh
  rationale: מִקְנֶה bezeichnet den gesamten Bestand an Nutztieren. „Vieh“ gibt den kollektiven und umfassenden Sinn im Deutschen natürlich wieder.
- source_word: יֵלֵךְ עִמָּנוּ
  choice: wird mit uns gehen
  rationale: Die einfache Zukunft und die Begleitung werden direkt und idiomatisch wiedergegeben.
- source_word: לֹא תִשָּׁאֵר פַּרְסָה
  choice: keine einzige Klaue wird zurückbleiben
  rationale: פַּרְסָה bedeutet wörtlich „Klaue/Huf“. „Keine einzige“ bewahrt die emphatische Verneinung; „zurückbleiben“ verdeutlicht die im Kontext gemeinte Trennung, ohne den Sinn zu erweitern.
- source_word: כִּי מִמֶּנּוּ נִקַּח
  choice: Denn davon werden wir nehmen
  rationale: Die Formulierung hält sich an das ausdrückliche „davon werden wir nehmen“ und ergänzt kein im Hebräischen unausgesprochenes Objekt. Im Deutschen ist dabei verständlich, dass Tiere aus dem Viehbestand genommen werden.
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵינוּ
  choice: um Jahwe, unserem Gott, zu dienen
  rationale: עבד kann im Bezug auf Gott sowohl „dienen“ als auch kultisches „verehren“ bezeichnen. „Dienen“ bewahrt die lexikalische Breite und die Wiederholung desselben Verbs im Vers.
- source_word: וַאֲנַחְנוּ לֹא נֵדַע
  choice: Und wir wissen nicht
  rationale: Der Satz beschreibt den gegenwärtigen Mangel an Wissen im Blick auf die bevorstehende Reise; das deutsche Präsens ist dafür natürlich.
- source_word: מַה נַּעֲבֹד אֶת יְהוָה
  choice: womit wir Jahwe dienen sollen
  rationale: 'מַה wird im Kontext instrumental verstanden: Noch ist nicht bekannt, welche Tiere oder Gaben für den Dienst benötigt werden. „Sollen“ bringt die kontextuelle Verpflichtung zum Ausdruck, ohne das Verb auf liturgische Verehrung einzuengen.'
- source_word: עַד בֹּאֵנוּ שָׁמָּה
  choice: bis wir dort ankommen
  rationale: בוא mit שָׁמָּה bezeichnet das Erreichen des Zielortes; „dort ankommen“ ist klar und modernes Standarddeutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
theological_decisions:
- issue: Wiedergabe von עבד im Opfer- und Verehrungskontext
  choice: Jahwe dienen
  alternative: Jahwe verehren / Jahwe Gottesdienst erweisen
  rationale: Der Opferkontext lässt eine kultische Bedeutung zu. „Dienen“ bewahrt jedoch sowohl die Wiederholung im Hebräischen als auch den weiteren Sinn des Dienstes für Gott und legt den Ausdruck nicht ausschließlich auf liturgische Verehrung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der hebräischen Argumentation, ohne im Deutschen sperrig zu wirken. „Keine einzige Klaue“ erhält das anschauliche und nachdrückliche Bild des Ausgangstextes.
