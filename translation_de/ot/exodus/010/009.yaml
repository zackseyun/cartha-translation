base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/009.yaml
  text: Moses said, “We will go with our young and our old; we will go with our sons and our daughters, with our flocks and our herds, because we must hold a feast to the LORD.”
translation:
  language: de
  text: 'Mose sagte: »Wir werden mit unseren jungen und alten Leuten gehen; mit unseren Söhnen und unseren Töchtern, mit unseren Schafen und unseren Rindern werden wir gehen, denn wir haben dem HERRN ein Fest zu feiern.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְעָרֵינוּ וּבִזְקֵנֵינוּ
  choice: mit unseren Jungen und unseren Alten
  rationale: Gibt die beiden gegensätzlichen Altersgruppen direkt wieder und bewahrt den umfassenden Sinn.
- source_word: חַג
  choice: Fest
  rationale: Bezeichnet ein religiöses Fest beziehungsweise eine Festfeier; „Fest“ ist hier natürlich und sachlich angemessen.
- source_word: יְהוָה
  choice: der HERR
  rationale: Folgt der etablierten deutschen Bibelkonvention, den Gottesnamen durch HERR in Kapitälchen wiederzugeben.
- source_word: לָנוּ
  choice: wir feiern
  rationale: Die wörtliche Aussage „ein Fest des HERRN ist für uns“ wird idiomatisch als Verpflichtung beziehungsweise bevorstehende Festfeier ausgedrückt, ohne ein zusätzliches Modalverb zu erzwingen.
theological_decisions:
- issue: Beziehung des Festes zu JHWH in כִּי חַג יְהוָה לָנוּ
  choice: denn wir feiern ein Fest für den HERRN
  alternative: denn wir müssen dem HERRN ein Fest feiern
  rationale: Das Hebräische enthält kein ausdrückliches Verb für „müssen“. Die gewählte Form bewahrt den begründenden Charakter von כִּי und vermeidet eine unnötige Verstärkung, während die kultische Ausrichtung auf JHWH klar bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „gehen“ wird entsprechend der hebräischen Rhetorik bewahrt; „Schafe und Rinder“ ist für צֹאן וּבָקָר konkret und allgemein verständlich.
