review_pass:
  verdict: revise
  source_fidelity: Die Aufzählung und die zweimalige Wiederholung von „gehen“ geben die hebräische Struktur gut wieder. Die Schlusswendung כִּי חַג־יְהוָה לָנוּ ist jedoch eine Nominalaussage („denn ein Fest des HERRN ist/steht uns bevor“) und bezeichnet im Kontext die zu erfüllende Festpflicht. „denn wir feiern ein Fest“ klingt gegenwärtig-feststellend und schwächt diese zukunfts- bzw. verpflichtungsbezogene Begründung ab.
  naturalness: „Unsere Jungen und unsere Alten“ ist im heutigen Standarddeutsch ohne Kontext etwas holprig und kann bei „Jungen“ unnötig männlich wirken. „Unsere jungen und alten Leute“ ist natürlich, umfassend und wahrt den Altersgegensatz.
  terminology: „Mose“, „Söhne“, „Töchter“, „Schafe“, „Rinder“ und „HERRN“ sind angemessen. „Dem HERRN ein Fest zu feiern“ bildet die Beziehung von חַג zu JHWH idiomatisch und ohne eine konfessionell geprägte Deutung ab.
  issues:
  - severity: medium
    issue: Die Schlussbegründung ist als gegenwärtiges „wir feiern“ formuliert.
    rationale: Das Hebräische hat kein finites Verb „feiern“, sondern begründet den Aufbruch mit dem für Israel anstehenden Fest des HERRN. Die deutsche Konstruktion „haben ... zu feiern“ gibt diesen Kontextbezug und die implizite Verpflichtung idiomatisch wieder, ohne ein eigenständiges hebräisches Modalverb zu behaupten.
  - severity: low
    issue: „unseren Jungen und unseren Alten“ ist stilistisch und hinsichtlich der Personenbezeichnung weniger natürlich.
    rationale: Die hebräischen Gruppen umfassen die Jungen und die Alten innerhalb des Volkes; „unseren jungen und alten Leuten“ ist modernes, geschlechtsübergreifendes Standarddeutsch.
  revised_text: 'Mose sagte: »Wir werden mit unseren jungen und alten Leuten gehen; mit unseren Söhnen und unseren Töchtern, mit unseren Schafen und unseren Rindern werden wir gehen, denn wir haben dem HERRN ein Fest zu feiern.«'
