  text: וַ/יּוּשַׁ֞ב אֶת מֹשֶׁ֤ה וְ/אֶֽת אַהֲרֹן֙ אֶל פַּרְעֹ֔ה וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם לְכ֥וּ עִבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם מִ֥י וָ/מִ֖י הַ/הֹלְכִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/008.yaml
  text: So Moses and Aaron were brought back to Pharaoh[a], and he said to them, “Go, serve Yahweh your God. Who are the ones going?”
translation:
  language: de
  text: 'Da wurden Mose und Aaron zum Pharao zurückgebracht, und er sagte zu ihnen: »Geht und dient Jahwe, eurem Gott! Wer geht alles?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Wer und wer sind die Gehenden?« Die hebräische Wendung fragt danach, welche Personen mitgehen.'
    reason: Die idiomatische Haupttextfassung »Wer geht alles?« wird durch die formalere Gestalt und den Sinn der hebräischen Frage erläutert.
lexical_decisions:
- source_word: וַיּוּשַׁב
  choice: wurden … zurückgebracht
  rationale: Der Hoph’al von שוב bezeichnet ein veranlasstes Zurückkehren in passiver Form. Die deutsche Wiedergabe bewahrt sowohl den Passivcharakter als auch die Rückbewegung.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Mose und Aaron
  rationale: Die hebräischen Akkusativmarker werden im Deutschen nicht eigens wiedergegeben; die Namen folgen ihrer geläufigen deutschen Form.
- source_word: אֶל פַּרְעֹה
  choice: zum Pharao
  rationale: אֶל bezeichnet hier die Bewegung hin zu einer Person. »Zum Pharao« ist im Deutschen direkt und natürlich.
- source_word: לְכוּ
  choice: Geht
  rationale: Der Imperativ von הלך wird unmittelbar als Aufforderung wiedergegeben.
- source_word: עִבְדוּ
  choice: dient
  rationale: עבד bezeichnet Dienst, der in diesem Zusammenhang die Verehrung Gottes einschließt. »Dient« erhält den weiteren Bedeutungsumfang und verengt ihn nicht auf einen Gottesdienst.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. »Jahwe« ist die im Deutschen geläufige Umschrift.
- source_word: אֱלֹהֵיכֶם
  choice: eurem Gott
  rationale: Die Konstruktverbindung mit Suffix der 2. Person maskulin Plural wird als Possessivfügung wiedergegeben.
- source_word: מִי וָמִי
  choice: Wer alles
  rationale: Die wiederholte Frageformel verlangt eine genaue Angabe der Personen. »Wer alles« ist eine natürliche deutsche Entsprechung, ohne die hebräische Wendung künstlich nachzubilden.
- source_word: הַהֹלְכִים
  choice: soll gehen
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die gehen werden beziehungsweise gehen sollen. Im Kontext von Pharaos Nachfrage gibt »soll gehen« die beabsichtigte Teilnehmergruppe natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Seine Umschrift bewahrt den Unterschied zwischen Eigenname und Herrschaftstitel.
- issue: Bedeutungsumfang von עבד
  choice: dienen
  alternative: anbeten
  rationale: »Dienen« lässt sowohl kultische Verehrung als auch den umfassenderen Dienst für Gott erkennen und vermeidet eine unnötige Verengung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und mündlich, ohne umgangssprachlich zu wirken. »Jahwe« gibt den Gottesnamen als Eigennamen wieder; »Wer alles soll gehen?« bildet die idiomatische Nachfrage des Pharaos natürlich ab.
