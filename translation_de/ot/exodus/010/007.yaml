id: EXO.10.7
reference: Exodus 10:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ עַבְדֵ֨י פַרְעֹ֜ה אֵלָ֗י/ו עַד מָתַי֙ יִהְיֶ֨ה זֶ֥ה לָ֨/נוּ֙ לְ/מוֹקֵ֔שׁ שַׁלַּח֙ אֶת הָ֣/אֲנָשִׁ֔ים וְ/יַֽעַבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם הֲ/טֶ֣רֶם תֵּדַ֔ע כִּ֥י אָבְדָ֖ה מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/007.yaml
  text: Then Pharaoh’s servants said to him[a], “How long will this man be a snare to us? Send the men away so that they may serve Yahweh their God[e][d][c][b]. Do you not yet know that Egypt is ruined?”
translation:
  language: de
  text: 'Da sagten die Diener des Pharaos zu ihm: »Wie lange soll uns dieser Mann[a] noch zur Falle[b] werden? Lass die Männer[c] ziehen, damit sie Jahwe, ihrem Gott, dienen[d][e]. Weißt du noch immer nicht, dass Ägypten zugrunde gerichtet ist?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „dieser“ oder „dieser da“; das hebräische Demonstrativpronomen bezieht sich im Zusammenhang auf Mose.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zur Schlinge“.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: „die Männer“. Manche Übersetzungen erweitern dies zu „das Volk“, doch der Ausgangstext verwendet hier eine ausdrücklich maskuline Pluralform.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „verehren“. Das hebräische Verb kann im Blick auf Gott sowohl Dienen als auch gottesdienstliche Verehrung bezeichnen.'
    reason: lexical_alternative
  - marker: e
    text: 'Hebräisch: JHWH, der Gottesname; traditionell auch mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי פַרְעֹה
  choice: die Diener des Pharaos
  rationale: עֶבֶד bezeichnet hier Angehörige des pharaonischen Hofes. „Diener“ gibt den Ausdruck unmittelbar wieder; „Beamte“ wäre im Kontext möglich, aber stärker deutend.
- source_word: עַד מָתַי
  choice: Wie lange ... noch
  rationale: Die idiomatische deutsche Frage bewahrt den vorwurfsvollen zeitlichen Sinn des Hebräischen.
- source_word: זֶה
  choice: dieser Mann
  rationale: Das Demonstrativpronomen weist im Kontext auf Mose. Im Deutschen macht die Ergänzung „Mann“ den Bezug natürlich verständlich, ohne ihn namentlich festzulegen.
- source_word: לְמוֹקֵשׁ
  choice: zur Falle
  rationale: מוֹקֵשׁ bezeichnet eine Falle oder Schlinge. „Zur Falle werden“ erhält das Bild und klingt in modernem Deutsch natürlich.
- source_word: שַׁלַּח
  choice: Lass ... ziehen
  rationale: Der Imperativ fordert, die Männer freizugeben beziehungsweise fortziehen zu lassen. Diese Wendung ist idiomatisch und entspricht dem Kontext.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Das hebräische Substantiv ist ausdrücklich maskulin plural. „Die Männer“ bewahrt diese Formulierung, statt sie zu „das Volk“ zu erweitern.
- source_word: וְיַעַבְדוּ
  choice: damit sie ... dienen
  rationale: עבד kann gegenüber Gott sowohl dienen als auch verehren bedeuten. „Dienen“ ist die direkte Wiedergabe und lässt die kultische Bedeutung offen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen gebräuchliche Transkription.
- source_word: הֲטֶרֶם תֵּדַע
  choice: Weißt du noch immer nicht
  rationale: Die Formulierung gibt die rhetorische, vorwurfsvolle Frage idiomatisch wieder.
- source_word: אָבְדָה מִצְרָיִם
  choice: Ägypten zugrunde gerichtet ist
  rationale: Das Perfekt beschreibt Ägypten als bereits verwüstet. Die deutsche Zustandsformulierung bewahrt diesen Ergebnisaspekt, ohne vollständige Vernichtung zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Eigenname יהוה, nicht ein Titel. Die Transkription bewahrt diesen Unterschied.
- issue: Bedeutungsumfang von עבד im Verhältnis zu Gott
  choice: dienen
  alternative: verehren
  rationale: Das Verb kann kultischen Dienst und Anbetung einschließen. „Dienen“ wahrt den breiteren Bedeutungsumfang und legt den Ausdruck nicht ausschließlich auf gottesdienstliche Verehrung fest.
- issue: Geschlechtsspezifische Wiedergabe von הָאֲנָשִׁים
  choice: die Männer
  alternative: das Volk / die Leute
  rationale: Der hebräische Ausdruck bezeichnet ausdrücklich Männer. Die Übersetzung bewahrt diese sprachliche Bestimmtheit, auch wenn im größeren Erzählzusammenhang Israel insgesamt betroffen ist.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter, eindringlicher Rede. „Lass ... ziehen“ und „Weißt du noch immer nicht“ sind idiomatisch, bewahren aber die Schärfe des hebräischen Wortlauts. Die Metapher der Falle sowie die ausdrücklich männliche Bezeichnung bleiben erhalten.
