revisions:
- from: Sie bedeckten die Oberfläche des ganzen Landes[a], sodass das Land finster wurde. Sie fraßen alle Pflanzen des Landes und alle Früchte an den Bäumen, die der Hagel übrig gelassen hatte. Im ganzen Land Ägypten blieb nichts Grünes an den Bäumen oder von den Pflanzen auf dem Feld übrig.
  to: Sie bedeckten die Oberfläche des ganzen Landes[a], und das Land wurde finster. Sie fraßen alle Pflanzen des Landes und alle Früchte an den Bäumen, die der Hagel übrig gelassen hatte. Im ganzen Land Ägypten blieb weder an den Bäumen noch an den Pflanzen auf dem Feld etwas Grünes übrig.
  rationale: 'Der Schlusssatz wird lokal und idiomatisch gefasst: Die verbleibende grüne Vegetation wird sowohl an den Bäumen als auch im Bereich der Feldpflanzen verneint. Der erste Satz bewahrt mit „und“ die offene hebräische Erzählverknüpfung, ohne einen zusätzlichen expliziten Kausalzusammenhang zu markieren. Der Fußnotenanker bleibt direkt an der idiomatischen Wiedergabe der hebräischen Wendung stehen.'
