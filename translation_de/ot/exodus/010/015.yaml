base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/015.yaml
  text: And it covered the face of the whole land[a], so that the land was darkened; and it ate every plant of the land and all the fruit of the trees that the hail had left. No green thing remained on the trees or on the plants of the field in all the land of Egypt.
translation:
  language: de
  text: Sie bedeckten die Oberfläche des ganzen Landes[a], und das Land wurde finster. Sie fraßen alle Pflanzen des Landes und alle Früchte an den Bäumen, die der Hagel übrig gelassen hatte. Im ganzen Land Ägypten blieb weder an den Bäumen noch an den Pflanzen auf dem Feld etwas Grünes übrig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Auge des ganzen Landes«; eine hebräische Wendung für die sichtbare Oberfläche des Landes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַס
  choice: Sie bedeckten
  rationale: Das hebräische Verb steht im Singular und bezieht sich auf den zuvor genannten Heuschreckenschwarm als Kollektiv. Im Deutschen ist der Rückbezug auf die Heuschrecken im Plural natürlicher.
- source_word: עֵין כָּל הָאָרֶץ
  choice: die Oberfläche des ganzen Landes
  rationale: Wörtlich steht »das Auge des ganzen Landes«; gemeint ist idiomatisch dessen sichtbare Oberfläche. »Oberfläche« gibt den Sinn im heutigen Deutsch klar wieder.
- source_word: וַתֶּחְשַׁךְ הָאָרֶץ
  choice: sodass das Land finster wurde
  rationale: Das Verb bezeichnet das Dunkelwerden. »Sodass« verdeutlicht den aus der Bedeckung folgenden Zustand, ohne die Aussage zu verstärken.
- source_word: וַיֹּאכַל
  choice: Sie fraßen
  rationale: Der Singular behandelt den Schwarm kollektiv; der deutsche Plural nimmt die Heuschrecken natürlich wieder auf. »Fraßen« entspricht dem schlichten Wortsinn.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: alle Pflanzen des Landes
  rationale: עֵשֶׂב umfasst hier die Vegetation allgemein und ist breiter als »Gras«.
- source_word: כָּל פְּרִי הָעֵץ
  choice: alle Früchte an den Bäumen
  rationale: Der morphologische Singular »Baum« wird kollektiv gebraucht. »An den Bäumen« ist im Deutschen für noch nicht abgeerntete Früchte idiomatisch.
- source_word: אֲשֶׁר הוֹתִיר הַבָּרָד
  choice: die der Hagel übrig gelassen hatte
  rationale: Die Vorvergangenheit macht deutlich, dass diese Früchte die frühere Hagelplage überstanden hatten.
- source_word: וְלֹא נוֹתַר כָּל יֶרֶק
  choice: blieb nichts Grünes ... übrig
  rationale: Die natürliche deutsche Negation gibt die völlige Vernichtung wieder; יֶרֶק bezeichnet breit alles Grüne beziehungsweise grüne Vegetation.
- source_word: בָּעֵץ וּבְעֵשֶׂב הַשָּׂדֶה
  choice: an den Bäumen oder von den Pflanzen auf dem Feld
  rationale: Die kollektiven Singulare werden im Deutschen als Plurale wiedergegeben. Die unterschiedlichen Präpositionen sorgen für eine natürliche Zuordnung zu Bäumen und Feldpflanzen.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: im ganzen Land Ägypten
  rationale: Eine klare und geläufige Wiedergabe der territorialen Wendung.
