source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֣ה וְ/אַהֲרֹן֮ אֶל פַּרְעֹה֒ וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים עַד מָתַ֣י מֵאַ֔נְתָּ לֵ/עָנֹ֖ת מִ/פָּנָ֑/י שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/003.yaml
  text: 'So Moses and Aaron went in to Pharaoh and said to him[a], “Thus says Yahweh, the God of the Hebrews: How long will you refuse to humble yourself before me? Let my people go[b], so that they may serve me.”'
translation:
  language: de
  text: 'Da gingen Mose und Aaron zum Pharao hinein und sagten zu ihm: »So spricht Yahweh, der Gott der Hebräer: Wie lange weigerst du dich noch, dich vor mir zu demütigen[a]? Lass mein Volk ziehen, damit es mir dient[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dich mir zu unterwerfen«. Das hebräische Verb kann sowohl das Gedemütigtwerden als auch das Sichdemütigen vor Gott bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »damit es mich anbetet«. Das hebräische Verb bezeichnet Dienst und kann auch kultischen Dienst beziehungsweise Anbetung einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: gingen … hinein
  rationale: בוא mit אֶל bezeichnet hier das Hingehen beziehungsweise Eintreten in die Gegenwart des Pharaos; »gingen … hinein« bewahrt den erzählerischen und höfischen Kontext.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die etablierte deutsche Wiedergabe der Botenformel gibt die gegenwärtige Geltung der angekündigten Gottesrede natürlich und würdevoll wieder.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: der Gott der Hebräer
  rationale: Die Konstruktion bezeichnet Yahweh nach seiner Beziehung zu den Hebräern; die ethnische Bezeichnung bleibt unverändert erhalten.
- source_word: עַד מָתַי מֵאַנְתָּ
  choice: Wie lange weigerst du dich noch
  rationale: Die idiomatische Frage blickt auf Pharaos wiederholte und fortdauernde Weigerung; »noch« macht diesen durativen Sinn im Deutschen deutlich.
- source_word: לֵעָנֹת מִפָּנָי
  choice: dich vor mir zu demütigen
  rationale: Die Form von ענה kann das Gedemütigtwerden oder das Sichdemütigen bezeichnen. Im Vorwurf an den handelnden Pharao ist die reflexive Wiedergabe natürlich, ohne die mögliche Bedeutung »sich unterwerfen« zu verschweigen.
- source_word: שַׁלַּח עַמִּי
  choice: Lass mein Volk ziehen
  rationale: Diese natürliche deutsche Wendung gibt die wiederkehrende Freilassungsforderung des Exodus prägnant wieder.
- source_word: וְיַעַבְדֻנִי
  choice: damit es mir dient
  rationale: עבד umfasst Dienst und in diesem Zusammenhang auch kultische Verehrung. »dient« erhält die weitere Bedeutungsbreite, während die Zweckbeziehung des Satzes klar bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration »Yahweh« wahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לֵעָנֹת vor Gott
  choice: dich vor mir zu demütigen
  alternative: dich mir zu unterwerfen; vor mir gedemütigt zu werden
  rationale: Die reflexive Formulierung passt zur an Pharao gerichteten Forderung, wahrt aber durch die Fußnote die Spannung zwischen innerer Demut, Unterwerfung und Gedemütigtwerden.
- issue: Bedeutung von עבד in der Auszugsforderung
  choice: mir dient
  alternative: mich anbetet
  rationale: Der Dienst an Yahweh schließt hier kultische Verehrung ein, ist aber lexikalisch weiter als »anbeten«. Die breitere Wiedergabe vermeidet eine unnötige Verengung.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Erzählton. Die Botenformel »So spricht« und die etablierte Forderung »Lass mein Volk ziehen« bewahren den feierlichen Charakter, ohne altertümliche Syntax zu verwenden.
