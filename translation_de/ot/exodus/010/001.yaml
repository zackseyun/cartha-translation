  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה כִּֽי אֲנִ֞י הִכְבַּ֤דְתִּי אֶת לִבּ/וֹ֙ וְ/אֶת לֵ֣ב עֲבָדָ֔י/ו לְמַ֗עַן שִׁתִ֛/י אֹתֹתַ֥/י אֵ֖לֶּה בְּ/קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/001.yaml
  text: Then Yahweh said to Moses[a], "Go in to Pharaoh, because I have hardened his heart and the heart of his servants[b], so that I may set these signs of mine among them."
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: »Geh zum Pharao hinein; denn ich habe sein Herz und das Herz seiner Diener verhärtet[a], damit ich diese meine Zeichen in seiner Mitte[b] setze.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ich habe sein Herz und das Herz seiner Diener schwer gemacht.« Gemeint ist, dass Jahwe sie verhärtet oder unempfänglich gemacht hat.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Hebräischen der Singular: »in seiner Mitte«. Gemeint sein kann der Pharao selbst oder der Pharao zusammen mit seinen Dienern und seinem Hof.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch den Titel »der HERR« zu ersetzen.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; »Da sagte« gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Geh zum Pharao hinein
  rationale: בוא kann »kommen/gehen« und hier auch das Eintreten zur Audienz bezeichnen. »hinein« erhält diese Richtungsnuance.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier den vorausgehenden Auftrag. »Denn« ist in diesem Satzgefüge klar und würdig.
- source_word: הִכְבַּדְתִּי
  choice: habe … verhärtet
  rationale: Der Hifil von כבד bedeutet wörtlich »schwer machen«; beim Herzen bezeichnet die Wendung hier dessen Verhärtung beziehungsweise Unempfänglichkeit. Die wörtliche Bildsprache wird in einer Fußnote genannt.
- source_word: לִבּוֹ ... לֵב עֲבָדָיו
  choice: sein Herz und das Herz seiner Diener
  rationale: »Herz« bewahrt das hebräische Bild für Denken, Wollen und innere Haltung. Die Wiederholung entspricht der Struktur des Ausgangstextes.
- source_word: עֲבָדָיו
  choice: seiner Diener
  rationale: עבד kann Diener, Sklaven oder Amtsträger bezeichnen. Am Hof des Pharaos sind wohl seine Bediensteten beziehungsweise Amtsträger gemeint; »Diener« hält den Ausdruck bewusst weit.
- source_word: לְמַעַן
  choice: damit
  rationale: Die Konjunktion drückt den Zweck aus; »damit« gibt diesen Zusammenhang idiomatisch wieder.
- source_word: שִׁתִי
  choice: ich … setze
  rationale: שׂים bedeutet »setzen, stellen, legen«. »Zeichen setzen« wahrt die konkrete Ausdrucksweise des Hebräischen, auch wenn sie im Deutschen leicht feierlich klingt.
- source_word: אֹתֹתַי אֵלֶּה
  choice: diese meine Zeichen
  rationale: Die Formulierung erhält sowohl das Demonstrativpronomen als auch das Possessivsuffix und entspricht dem gehobenen biblischen Register.
- source_word: בְּקִרְבּוֹ
  choice: in seiner Mitte
  rationale: Die masoretische Form ist singular und lautet wörtlich »in seiner Mitte«. Diese Wiedergabe bewahrt die mögliche Beziehung auf den Pharao, ohne die im Kontext ebenfalls mögliche Einbeziehung seines Hofes auszuschließen.
theological_decisions:
- issue: Göttliche Verhärtung des Herzens des Pharaos
  choice: ich habe sein Herz und das Herz seiner Diener verhärtet
  alternative: ich habe sein Herz und das Herz seiner Diener schwer gemacht
  rationale: Der Vers schreibt die Verhärtung unmittelbar Jahwe zu. Die Übersetzung schwächt diese Aussage nicht ab und löst das Spannungsverhältnis zwischen göttlichem Handeln und menschlicher Verantwortung nicht über den Wortlaut hinaus auf.
- issue: Bezugsgröße von בְּקִרְבּוֹ
  choice: in seiner Mitte
  alternative: mitten unter ihnen
  rationale: Der grammatische Singular kann sich besonders auf den Pharao beziehen; der Zusammenhang mit seinen Dienern lässt aber auch an den Pharao samt Hof denken. Der Haupttext bewahrt den Singular, die Fußnote nennt die weiter gefasste Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlicher biblischer Färbung. »Jahwe« gibt den Gottesnamen wieder; »diese meine Zeichen« und »in seiner Mitte« bewahren bewusst markante Züge des hebräischen Ausdrucks.
