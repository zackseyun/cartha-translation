base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/002.yaml
  text: so that you may tell in the hearing of your son and of your grandson how I dealt harshly with Egypt[a], and my signs that I placed among them[b], and so that you may know that I am Yahweh.
translation:
  language: de
  text: damit du deinem Sohn und deinem Enkel erzählen kannst, wie hart ich mit Ägypten verfahren bin[a] und von meinen Zeichen, die ich unter ihnen vollbracht habe, und damit ihr erkennt, dass ich Jahwe bin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ich Ägypten zum Gespött gemacht habe“. Das hebräische Verb kann neben dem harten Vorgehen besonders die Demütigung Ägyptens hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und ihr werdet erkennen, dass ich Jahwe bin“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְמַעַן
  choice: damit
  rationale: Gibt den Zweckbezug zum vorausgehenden Zusammenhang natürlich und präzise wieder.
- source_word: תְּסַפֵּר בְּאָזְנֵי
  choice: du … erzählen kannst
  rationale: Das Piel von ספר bezeichnet hier das Weitererzählen an kommende Generationen. Die hebräische Wendung „in die Ohren“ wird im Deutschen idiomatisch durch den Dativ ausgedrückt.
- source_word: בִנְךָ וּבֶן בִּנְךָ
  choice: deinem Sohn und deinem Enkel
  rationale: „Enkel“ ist die natürliche deutsche Entsprechung für das wörtliche „Sohn deines Sohnes“ und bewahrt die Generationenfolge.
- source_word: הִתְעַלַּלְתִּי
  choice: wie hart ich … verfahren bin
  rationale: Die Form bezeichnet hier ein hartes, zugleich demütigendes Vorgehen gegen Ägypten. Die Formulierung wahrt den Gerichtscharakter, ohne den möglichen Aspekt des Verhöhnens auszuschließen.
- source_word: בְּמִצְרַיִם
  choice: mit Ägypten
  rationale: Entspricht der hebräischen Präposition und verbindet sich im Deutschen idiomatisch mit „verfahren“.
- source_word: אֹתֹתַי אֲשֶׁר שַׂמְתִּי בָם
  choice: welche Zeichen ich unter ihnen vollbracht habe
  rationale: „Zeichen“ gibt אות direkt wieder. Beim Verb ist „vollbracht“ im Deutschen natürlicher als das wörtliche „gesetzt“; „unter ihnen“ nimmt den pluralischen Rückbezug auf die Ägypter auf.
- source_word: וִידַעְתֶּם
  choice: und damit ihr erkennt
  rationale: Der Plural wird gegenüber dem vorherigen Singular bewahrt. Die Wiedergabe als fortgesetzter Zweck ist syntaktisch gut begründet; die mögliche Folgedeutung steht in der Fußnote.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der offenbarte Eigenname wird transliteriert und nicht durch den Titel „der HERR“ ersetzt.
theological_decisions:
- issue: Bedeutung von הִתְעַלַּלְתִּי beim Handeln Gottes an Ägypten
  choice: wie hart ich mit Ägypten verfahren bin
  alternative: wie ich Ägypten zum Gespött gemacht habe
  rationale: Die Hauptfassung betont das schwere Gerichtshandeln; die Alternative bewahrt den ebenfalls möglichen Aspekt der Demütigung beziehungsweise Verhöhnung.
- issue: Funktion von וִידַעְתֶּם
  choice: und damit ihr erkennt
  alternative: und ihr werdet erkennen
  rationale: Die Zweckdeutung setzt das einleitende לְמַעַן fort; formal ist jedoch auch eine Folge- oder Zukunftsaussage möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel vom Singular „du“ zum Plural „ihr“ im hebräischen Text bleibt sichtbar. Die idiomatische Dativkonstruktion vermeidet das im Deutschen unnatürliche „vor den Ohren“, während „Jahwe“ den Gottesnamen bewahrt.
