base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/021.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky, so that there may be darkness over the land of Egypt, and the darkness may be felt.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Strecke deine Hand zum Himmel aus, damit Finsternis über das Land Ägypten kommt – eine Finsternis, die man fühlen kann[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene hebräische Verb kann hier bedeuten, dass die Finsternis ertastet oder gefühlt wird. Die Klausel wurde auch als Hinweis darauf gedeutet, dass man in der Finsternis umhertastet.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gängige deutsche Wiedergabe des Gottesnamens und direkte Entsprechung des Tetragramms.
- source_word: נְטֵה יָדְךָ
  choice: Strecke deine Hand … aus
  rationale: Gibt den Imperativ und die im Hebräischen übliche Gebärde natürlich und genau wieder.
- source_word: עַל הַשָּׁמַיִם
  choice: zum Himmel
  rationale: עַל bezeichnet hier im Zusammenhang mit dem Ausstrecken der Hand die Richtung; „zum Himmel“ ist im Deutschen idiomatisch.
- source_word: וִיהִי חֹשֶׁךְ
  choice: damit Finsternis … kommt
  rationale: Bewahrt die ziel- beziehungsweise folgebezogene Kraft der jussivischen Form in natürlichem Deutsch.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: über das Land Ägypten
  rationale: Gibt sowohl die Präposition als auch אֶרֶץ ausdrücklich wieder.
- source_word: וְיָמֵשׁ חֹשֶׁךְ
  choice: eine Finsternis, die man fühlen kann
  rationale: Gibt die wahrscheinlich gemeinte Greif- oder Fühlbarkeit der Finsternis wieder, ohne die schwierige seltene Verbform zu überpräzisieren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen; die Transliteration bewahrt diesen Unterschied gegenüber dem Titel אֲדֹנָי.
- issue: Deutung der Schlussklausel וְיָמֵשׁ חֹשֶׁךְ
  choice: eine Finsternis, die man fühlen kann
  alternative: und man taste in der Finsternis
  rationale: Die traditionelle Deutung als fühlbare Finsternis passt zum unmittelbaren Kontext; wegen der Seltenheit und Unsicherheit des Verbs wird die Alternative in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Finsternis“ bewahrt den feierlichen und intensiven Charakter; die Satzstruktur bleibt klar und gut vorlesbar.
