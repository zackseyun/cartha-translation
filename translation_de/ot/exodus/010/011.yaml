source:
  edition: WLC
  text: לֹ֣א כֵ֗ן לְכֽוּ נָ֤א הַ/גְּבָרִים֙ וְ/עִבְד֣וּ אֶת יְהוָ֔ה כִּ֥י אֹתָ֖/הּ אַתֶּ֣ם מְבַקְשִׁ֑ים וַ/יְגָ֣רֶשׁ אֹתָ֔/ם מֵ/אֵ֖ת פְּנֵ֥י פַרְעֹֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/011.yaml
  text: No! Let the men go now and serve Yahweh[b][a], for that is what you are seeking.” Then he drove them out from Pharaoh’s presence.
translation:
  language: de
  text: „Nein![a] Geht jetzt, ihr Männer[b], und dient Jahwe; denn das ist es, was ihr sucht.“ Dann jagte der Pharao sie aus seiner Gegenwart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „So nicht!“ – eine wörtlichere Wiedergabe der schroffen Ablehnung des Pharaos.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „die Männer“; gemeint sind ausdrücklich die männlichen Personen, nicht das ganze Volk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: Nein!
  rationale: Die kurze, schroffe Ablehnung gibt den Ton des Pharaos in natürlichem Deutsch wieder; die wörtlichere Alternative wird in der Fußnote bewahrt.
- source_word: לְכוּ נָא
  choice: Geht jetzt
  rationale: Die Aufforderung mit נָא kann abschwächen oder Dringlichkeit ausdrücken. Hier passt „jetzt“ zum ungeduldigen, abweisenden Ton besser als ein höflich klingendes „bitte“.
- source_word: הַגְּבָרִים
  choice: ihr Männer
  rationale: Das Wort bezeichnet ausdrücklich Männer und bewahrt damit die Einschränkung des Angebots des Pharaos; die Anredeform klingt im Deutschen natürlich.
- source_word: וְעִבְדוּ אֶת יְהוָה
  choice: und dient Jahwe
  rationale: עבד kann im Verhältnis zu Gott sowohl „dienen“ als auch „verehren“ bedeuten. „Dienen“ erhält die weitere Bedeutungsbreite.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי אֹתָהּ אַתֶּם מְבַקְשִׁים
  choice: denn das ist es, was ihr sucht
  rationale: Das feminine Pronomen verweist wahrscheinlich auf das implizit Begehrte oder Verlangte. Die Formulierung lässt diesen Bezug offen, ohne einen nicht genannten Gegenstand einzuführen.
- source_word: וַיְגָרֶשׁ אֹתָם
  choice: Dann jagte der Pharao sie
  rationale: Das Verb bezeichnet ein gewaltsames Vertreiben. Der im Hebräischen nicht eigens genannte Singularakteur wird aus dem unmittelbaren Kontext als Pharao verstanden.
- source_word: מֵאֵת פְּנֵי פַרְעֹה
  choice: aus seiner Gegenwart
  rationale: Die hebräische Wendung bedeutet, jemanden aus der Gegenwart des Pharaos zu entfernen. Das Possessivpronomen vermeidet im Deutschen eine unnötige Wiederholung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen und vermeidet die Ersetzung durch einen Titel.
- issue: Geschlechtsspezifische Einschränkung im Angebot des Pharaos
  choice: ihr Männer
  alternative: ihr Leute; das Volk
  rationale: Das Hebräische bezeichnet ausdrücklich die Männer. Diese Einschränkung ist für den Konflikt bedeutsam und darf nicht neutralisiert werden.
- issue: Subjekt des abschließenden Vertreibens
  choice: der Pharao
  alternative: er; man
  rationale: Das hebräische Verb steht im Singular, ohne das Subjekt erneut zu nennen. Im Erzählzusammenhang ist Pharao der naheliegende Akteur; die ausdrückliche Nennung schafft im Deutschen Klarheit, ohne einen anderen Akteur einzuführen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt knapp und schroff; „jagte ... aus seiner Gegenwart“ vermittelt die gewaltsame Beendigung der Audienz.
