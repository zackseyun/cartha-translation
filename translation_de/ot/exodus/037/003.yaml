  text: He cast for it four rings of gold on its four feet[c][b][a], with two rings on one side and two rings on the other side.
translation:
  language: de
  text: 'Er goss daran vier goldene Ringe und brachte sie an seinen vier Füßen[a] an: je zwei Ringe an der einen und an der anderen Seite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an seinen vier Ecken“ oder „an seinen vier Stützpunkten“. Das hebräische Wort kann Füße, untere Enden oder Stützpunkte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: Er goss
  rationale: יצק bezeichnet im Zusammenhang mit Metall das Gießen geschmolzenen Metalls; „goss“ ist im Deutschen fachlich und natürlich.
- source_word: לוֹ
  choice: dafür
  rationale: Das Suffix bezieht sich auf den im Zusammenhang beschriebenen Gegenstand; „dafür“ gibt den Bezug idiomatisch wieder.
- source_word: טַבְּעֹת זָהָב
  choice: goldene Ringe
  rationale: Diese Formulierung ist natürliches modernes Deutsch und entspricht der hebräischen Wortgruppe.
- source_word: פַּעֲמֹתָיו
  choice: seine vier Füße
  rationale: Das Wort kann Füße, untere Enden oder Stützpunkte bezeichnen. „Füße“ ist eine direkte, im Kontext von Einrichtungsgegenständen plausible Wiedergabe; die echte lexikalische Unsicherheit wird in einer Fußnote bewahrt.
- source_word: צַלְעוֹ
  choice: Seite
  rationale: צלע bezeichnet bei Bauwerken und Gegenständen gewöhnlich eine Seite; „Seite“ ist die natürliche deutsche Entsprechung.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: an der einen und an der anderen Seite
  rationale: Die Formulierung gibt die paarweise Gegenüberstellung der beiden Seiten idiomatisch wieder, ohne die Bedeutung zu verändern.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Je zwei“ bündelt die hebräische Verteilung von zwei Ringen auf jede der beiden Seiten klar und natürlich; die Mehrdeutigkeit von פַּעֲמֹתָיו bleibt durch die Fußnote sichtbar.
