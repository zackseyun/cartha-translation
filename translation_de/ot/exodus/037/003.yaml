  source_fidelity: 'Die Grundbedeutung ist zutreffend: יצק bezeichnet hier das Gießen/Herstellen der goldenen Ringe; ארבע טבעות זהב, ארבע פעמותיו und die Verteilung von je zwei Ringen auf die zwei Seiten sind angemessen wiedergegeben. „dafür“ ist jedoch als Bezug auf den Gegenstand weniger klar als „daran“ bzw. „an ihm“.'
