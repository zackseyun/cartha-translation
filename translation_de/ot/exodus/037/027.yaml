base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/027.yaml
  text: And he made for it two rings of gold under its rim[a], on its two side frames, on its two sides[b], as holders for poles with which to carry it.
translation:
  language: de
  text: Und er machte an ihm zwei goldene Ringe unter seiner Einfassung[a], an seinen beiden Seitenstücken, an seinen beiden Seiten[b], als Halterungen für die Stangen, um es damit zu tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unterhalb seiner Zierleiste“. Das hebräische Wort זֵר bezeichnet die umlaufende Verzierung oder Einfassung am oberen Rand.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen stehen zwei verwandte Ausdrücke nebeneinander: „an seinen beiden Seitenstücken, an seinen beiden Seiten“. Beide bleiben in der Übersetzung erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי טַבְּעֹת זָהָב
  choice: Und … zwei goldene Ringe
  rationale: Die Konjunktion führt die nächste Herstellungsangabe fort; die Materialverbindung wird im Deutschen natürlich durch das Adjektiv „goldene“ wiedergegeben.
- source_word: עָשָׂה לוֹ
  choice: er machte dafür
  rationale: Das Suffix verweist auf den im Zusammenhang beschriebenen Altar. „Dafür“ gibt die dativische Beziehung knapp und natürlich wieder.
- source_word: מִתַּחַת לְזֵרוֹ
  choice: unterhalb seiner Einfassung
  rationale: זֵר bezeichnet hier die umlaufende Zierleiste beziehungsweise Einfassung am oberen Rand. „Einfassung“ ist verständlich und vermeidet die irreführende traditionelle Wiedergabe „Krone“.
- source_word: עַל שְׁתֵּי צַלְעֹתָיו
  choice: an seinen beiden Seitenstücken
  rationale: צלע kann Seite, Rippe oder ein bauliches Seitenstück bezeichnen. „Seitenstücke“ wahrt den strukturellen Sinn und bleibt vom folgenden gewöhnlichen Wort für „Seiten“ unterscheidbar.
- source_word: עַל שְׁנֵי צִדָּיו
  choice: an seinen beiden Seiten
  rationale: Die zweite, verwandte Ortsangabe wird entsprechend dem Hebräischen beibehalten und nicht mit der ersten verschmolzen.
- source_word: לְבָתִּים לְבַדִּים
  choice: als Halterungen für die Stangen
  rationale: בָּתִּים bedeutet wörtlich „Häuser“, bezeichnet hier aber Aufnahmen oder Halterungen; בַּדִּים sind die Tragstangen der Heiligtumsausstattung.
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: mit denen man es tragen konnte
  rationale: Die Formulierung gibt sowohl den Zweck als auch die instrumentale Bedeutung von בָּהֶם in natürlichem Deutsch wieder.
