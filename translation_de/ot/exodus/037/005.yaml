  text: And he put the poles into the rings on the sides of the ark, to carry the ark.
translation:
  language: de
  text: Und er steckte die Stangen in die Ringe an den Seiten der Lade, um die Lade zu tragen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: steckte … in
  rationale: בוא bedeutet grundsätzlich „kommen/bringen“, bezeichnet hier aber zusammen mit den Stangen und Ringen idiomatisch das Hineinstecken. Die deutsche Verbfügung gibt den konkreten Vorgang natürlich und präzise wieder.
- source_word: הַבַּדִּים
  choice: die Stangen
  rationale: בַּדִּים bezeichnet die zum Tragen des Heiligtumsmobiliars bestimmten Stangen. „Stangen“ ist im modernen Deutsch klar und weniger umständlich als „Tragestangen“.
- source_word: בַּטַּבָּעֹת
  choice: in die Ringe
  rationale: Die Präposition ב bezeichnet hier das Einführen beziehungsweise Platzieren innerhalb der Ringe; mit „steckte“ ist „in die Ringe“ die idiomatische deutsche Form.
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: an den Seiten der Lade
  rationale: צְלָעוֹת kann Seiten oder seitliche Bauteile bezeichnen. Im Bauzusammenhang ist „an den Seiten“ natürlich und hinreichend genau; „an“ beschreibt die Lage der Ringe im Deutschen passend.
- source_word: הָאָרֹן
  choice: die Lade
  rationale: אָרוֹן bezeichnet hier die heilige Lade. „Lade“ ist die etablierte, würdige deutsche Bezeichnung und bewahrt den kultischen Kontext besser als das allgemeinere „Kasten“.
- source_word: לָשֵׂאת
  choice: damit man … tragen konnte
  rationale: Der Infinitiv von נשׂא drückt den Zweck aus. Ein deutscher Finalsatz vermittelt diesen Zweck natürlich und macht deutlich, dass die Stangen dem Tragen der Lade dienten.
