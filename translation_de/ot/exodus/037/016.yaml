base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/016.yaml
  text: 'He made the utensils that were on the table: its plates[a], its cups, its pitchers, and its bowls with which the drink offering was poured out, of pure gold.'
translation:
  language: de
  text: 'Er fertigte die Geräte an, die auf dem Tisch waren: seine Schüsseln, seine Schalen, seine Kannen und die Krüge, mit denen man Trankopfer ausgoss – alles aus reinem Gold.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bedeutung der einzelnen Gefäßbezeichnungen ist unsicher. Je nach Zuordnung kommen unter anderem Platten oder Schüsseln, kleine Schalen, Kannen oder Krüge sowie Schalen oder Becken in Betracht.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: die Geräte
  rationale: כְּלִים ist ein weiter Begriff für Geräte, Gegenstände oder Gefäße. „Geräte“ ist im Zusammenhang mit der Ausstattung des Tisches natürlich und umfassend.
- source_word: אֲשֶׁר עַל הַשֻּׁלְחָן
  choice: die auf dem Tisch waren
  rationale: Dies gibt die räumliche Formulierung des Hebräischen unmittelbar wieder, ohne sie funktional zu „für den Tisch“ umzudeuten.
- source_word: קְעָרֹתָיו
  choice: seine Schüsseln
  rationale: קְעָרָה bezeichnet eine Schüssel, Schale oder Platte. „Schüsseln“ ist hier eine verständliche, konkrete Wiedergabe.
- source_word: כַּפֹּתָיו
  choice: seine Schalen
  rationale: כַּף kann ein löffel- oder handförmiges Gefäß bezeichnen. Im Zusammenhang mit den Tischgeräten passt „Schalen“, ohne eine zu genaue Form festzulegen.
- source_word: מְנַקִּיֹּתָיו
  choice: seine Kannen
  rationale: Der seltene Gefäßbegriff wird wahrscheinlich für ein Gieß- oder Vorratsgefäß gebraucht. „Kannen“ vermittelt diese wahrscheinliche Funktion in modernem Deutsch.
- source_word: הַקְּשָׂוֹת
  choice: die Krüge
  rationale: Der ebenfalls seltene Begriff bezeichnet Gefäße im Zusammenhang mit dem Ausgießen. „Krüge“ unterscheidet sie verständlich von den zuvor genannten Gefäßarten.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: mit denen das Trankopfer ausgegossen wurde
  rationale: נסך bezeichnet im kultischen Zusammenhang das Ausgießen einer Libation. Die passive Form wird bewahrt; „Trankopfer“ macht den im Verb enthaltenen kultischen Sinn verständlich.
- source_word: זָהָב טָהוֹר
  choice: alles aus reinem Gold
  rationale: Die abschließende Materialangabe bezieht sich auf die gesamte Aufzählung. „Alles“ verdeutlicht diesen Bezug im Deutschen, ohne den Inhalt zu erweitern.
