  source_fidelity: Der Vers gibt וַיְצַפֵּהוּ präzise mit „überzog sie“ wieder und bewahrt die räumliche Doppelangabe „innen und außen“. Die feminine deutsche Referenz ist angesichts der im Kontext genannten Bundeslade idiomatisch, obwohl das hebräische Bezugswort grammatisch maskulin ist. „fertigte … für sie an“ bildet וַיַּעַשׂ לוֹ angemessen ab. „Einfassung aus Gold“ und „ringsum“ geben זֵר זָהָב סָבִיב wieder, ohne die genaue Gestalt der Zierleiste festzulegen.
