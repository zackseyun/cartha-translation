  text: He overlaid it with pure gold[a], inside and outside, and made for it a surrounding border of gold.
translation:
  language: de
  text: Er überzog sie innen und außen mit reinem Gold und fertigte ringsum eine Einfassung aus Gold für sie an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine goldene Leiste ringsum“ beziehungsweise „einen goldenen Rand ringsum“. Das hebräische Wort זֵר bezeichnet eine umlaufende, wohl dekorative Einfassung; ihre genaue Form ist nicht näher bestimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַפֵּהוּ
  choice: Er überzog sie
  rationale: Das Piel von צפה bezeichnet hier das Überziehen eines Gegenstands mit Metall. Das feminine Pronomen greift im Deutschen die Bundeslade aus dem Zusammenhang auf.
- source_word: זָהָב טָהוֹר
  choice: mit reinem Gold
  rationale: Die feste Wendung bezeichnet Gold von hoher Reinheit; „reines Gold“ ist im Deutschen natürlich und präzise.
- source_word: מִבַּיִת וּמִחוּץ
  choice: innen und außen
  rationale: Die knappe Paarformel gibt die inneren und äußeren Flächen des Gegenstands wieder.
- source_word: וַיַּעַשׂ לוֹ
  choice: fertigte … für sie an
  rationale: לֹו kennzeichnet den Gegenstand als Empfänger beziehungsweise Bezugsobjekt. „Für sie“ bewahrt diesen Bezug, während „fertigte … an“ zum handwerklichen Zusammenhang passt.
- source_word: זֵר זָהָב
  choice: eine Einfassung aus Gold
  rationale: זֵר bezeichnet bei den Heiligtumsgeräten eine umlaufende, wohl dekorative Begrenzung. „Einfassung“ bleibt anschaulich, ohne ihre genaue Form übermäßig festzulegen.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Wort betont, dass die Einfassung den Gegenstand vollständig umgab.
