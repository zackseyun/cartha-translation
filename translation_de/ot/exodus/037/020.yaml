  text: And on the lampstand were four cups shaped like almond blossoms[a], its buds and its flowers.
translation:
  language: de
  text: Am Leuchter waren vier mandelblütenförmige Kelche mit seinen Knäufen und Blüten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „vier mandelblütenförmige Kelche, seine Knäufe und seine Blüten“. Das Hebräische nennt die Zierelemente ohne ein ausdrückliches Wort für „mit“.'
    reason: Die knappe hebräische Reihung lässt das genaue syntaktische Verhältnis der Knäufe und Blüten zu den Kelchen unausgesprochen.
lexical_decisions:
- source_word: וּבַמְּנֹרָה
  choice: Am Leuchter waren
  rationale: Die Präposition bezeichnet hier die Anordnung der Zierelemente am Leuchter. Das im Hebräischen ausgelassene Verb wird im Deutschen sinngemäß aus dem Kontext ergänzt.
- source_word: אַרְבָּעָה גְבִעִים
  choice: vier … Kelche
  rationale: גְבִעִים bezeichnet die kelch- oder becherförmigen Zierelemente des Leuchters; „Kelche“ passt zum kunstvollen, pflanzlichen Bild.
- source_word: מְשֻׁקָּדִים
  choice: mandelblütenförmige
  rationale: Das Partizip beschreibt eine Gestaltung nach dem Muster von Mandelblüten. Die kompakte deutsche Formulierung gibt sowohl Form als auch Motiv natürlich wieder.
- source_word: כַּפְתֹּרֶיהָ
  choice: seinen Knäufen
  rationale: כַּפְתֹּר bezeichnet knaufartige Verdickungen oder Zierelemente. „Knospen“ wäre wegen des Pflanzenmotivs denkbar, ist aber weniger sicher und würde die konkrete Form stärker deuten.
- source_word: וּפְרָחֶיהָ
  choice: und Blüten
  rationale: פֶּרַח bedeutet „Blüte“ oder „Blume“. „Blüten“ bewahrt hier das durchgängige Pflanzenmotiv.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Leuchter“ ist im Zusammenhang der Stiftshütte verständlich und vermeidet das modern-technische „Lampenständer“. Die Hauptfassung ergänzt „mit“ für einen natürlichen deutschen Satz; die Fußnote bewahrt die formale Offenheit der hebräischen Reihung.
