lexical_decisions:
- source_word: וַיְצַף
  choice: überzog
  rationale: צפה bezeichnet hier das Überziehen eines Gegenstands mit einer Metallschicht; „überzog“ ist im handwerklichen Zusammenhang präzise und natürlich.
- source_word: אֹתוֹ
  choice: ihn
  rationale: Das Objektpronomen bezieht sich auf den Tisch im vorhergehenden Vers; da „Tisch“ im Deutschen maskulin ist, lautet der Rückbezug „ihn“.
- source_word: זָהָב טָהוֹר
  choice: reinem Gold
  rationale: Die feste Verbindung bezeichnet Gold von hoher Reinheit; „reines Gold“ ist die klare und geläufige deutsche Wiedergabe.
- source_word: וַיַּעַשׂ לוֹ
  choice: fertigte für ihn … an
  rationale: Die Präposition ל wird mit „für ihn“ ausdrücklich wiedergegeben. „Anfertigen“ passt zum handwerklichen Kontext und bezeichnet die Herstellung der Leiste.
- source_word: זֵר
  choice: Zierleiste
  rationale: זֵר bezeichnet an diesem Möbelstück eine umlaufende, wohl dekorative Einfassung. „Zierleiste“ ist im modernen Deutschen anschaulich, ohne die Form genauer festzulegen, als der Kontext erlaubt.
- source_word: זָהָב
  choice: goldene
  rationale: Der Materialbegriff wird in natürlichem Deutsch adjektivisch wiedergegeben.
- source_word: סָבִיב
  choice: ringsum
  rationale: „Ringsum“ drückt knapp und idiomatisch aus, dass die Einfassung den Tisch vollständig umlief.
