  text: He overlaid it with pure gold[a], and made for it a gold molding all around.
translation:
  language: de
  text: Er überzog ihn mit reinem Gold und fertigte für ihn ringsum eine goldene Zierleiste[a] an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „einen goldenen Rand“; traditionell „einen goldenen Kranz“.
