  text: and a bulb under two branches from it[a], and a bulb under two branches from it, and a bulb under two branches from it, for the six branches coming out from it.
translation:
  language: de
  text: Je ein Knauf war unter zwei Armen, die aus ihm hervorgingen, je ein Knauf unter zwei Armen, die aus ihm hervorgingen, und je ein Knauf unter zwei Armen, die aus ihm hervorgingen – für die sechs Arme, die aus ihm hervorgingen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: Knauf
  rationale: Das Wort bezeichnet hier ein rundliches Zierelement am Leuchter. „Knauf“ ist im Deutschen für einen solchen gerundeten Vorsprung präzise und würdig; „Knospe“ bleibt als mögliche, stärker pflanzlich geprägte Wiedergabe in der Fußnote erhalten.
- source_word: תַּחַת
  choice: unter
  rationale: Die Präposition bezeichnet unmittelbar die Lage unterhalb des jeweiligen Paars von Seitenarmen.
- source_word: שְׁנֵי הַקָּנִים
  choice: Paar der Arme
  rationale: Wörtlich steht „zwei Arme/Zweige“. Die dreifache Wiederholung verteilt die sechs Seitenarme auf drei Paare; „Paar der Arme“ macht diese Anordnung in natürlichem Deutsch deutlich, ohne die Zahl zu verändern.
- source_word: מִמֶּנָּה
  choice: aus ihm
  rationale: Das feminine hebräische Pronomen bezieht sich auf die מְנוֹרָה, den Leuchter. Da „Leuchter“ im Deutschen maskulin ist, lautet der grammatisch passende Rückbezug „aus ihm“.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: entsprechend den sechs Armen
  rationale: Die Präposition לְ fasst die drei Knäufe in ihrer Zuordnung zu den insgesamt sechs Seitenarmen zusammen. „Entsprechend“ gibt diese relationale beziehungsweise distributive Funktion klar wieder.
- source_word: הַיֹּצְאִים מִמֶּנָּה
  choice: die aus ihm hervorgingen
  rationale: Das Partizip beschreibt die Arme als vom Leuchter ausgehend. „Hervorgingen“ bewahrt dieses räumliche Bild und fügt sich in die Vergangenheitsform der Herstellungserzählung ein.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die stark repetitive hebräische Konstruktion bleibt in ihrer dreifachen Gliederung erkennbar, wird jedoch durch „erstes, zweites, drittes Paar“ für heutige Leser räumlich eindeutig gemacht. Die pflanzenartige Bildsprache bleibt durch „Arme“ zurückhaltender als bei „Zweige“; die mögliche Formbezeichnung „Knospe“ wird in der Fußnote bewahrt.
