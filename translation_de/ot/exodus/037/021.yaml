    rationale: Die drei Wiederholungen implizieren zwar drei Gruppen zu je zwei Armen, nummerieren diese Gruppen aber nicht. Eine Übersetzung soll diese zusätzliche räumlich-sequentielle Festlegung nicht einführen.
