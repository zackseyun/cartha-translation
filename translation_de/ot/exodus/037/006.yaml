source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ כַּפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/006.yaml
  text: He made the mercy seat of pure gold; its length was two and a half cubits[a], and its width a cubit and a half.
translation:
  language: de
  text: Er fertigte die Sühneplatte[a] aus reinem Gold an. Sie war zweieinhalb Ellen lang und anderthalb Ellen breit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Deckplatte. Das hebräische Wort bezeichnet die goldene Abdeckung der Bundeslade und ist zugleich mit Sühne verbunden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er fertigte … an
  rationale: Das Wayyiqtol von עשה führt die Erzählung mit einer vergangenen Handlung fort. „Anfertigen“ bezeichnet hier natürlich und präzise die Herstellung des Kultgegenstands.
- source_word: כַּפֹּרֶת
  choice: die Sühneplatte
  rationale: Der Ausdruck bezeichnet die goldene Deckplatte der Bundeslade und ist zugleich sprachlich und kultisch mit Sühne verbunden. „Sühneplatte“ bewahrt beide Aspekte besser als das unspezifische „Deckel“ und ist im heutigen Deutsch verständlicher als „Gnadenthron“.
- source_word: זָהָב טָהוֹר
  choice: aus reinem Gold
  rationale: Die Materialangabe wird im Deutschen idiomatisch mit „aus“ wiedergegeben.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: zweieinhalb Ellen
  rationale: Entspricht der hebräischen Maßangabe „zwei Ellen und eine halbe“ in natürlichem modernem Deutsch.
- source_word: אָרְכָּהּ
  choice: Sie war … lang
  rationale: Das Suffix bezieht sich auf die Sühneplatte. Die adjektivische Maßangabe ist eine natürliche deutsche Wiedergabe des nominalen hebräischen Satzes.
- source_word: וְאַמָּה וָחֵצִי
  choice: und anderthalb Ellen
  rationale: Gibt die hebräische Angabe „eine Elle und eine halbe“ idiomatisch wieder.
- source_word: רָחְבָּהּ
  choice: breit
  rationale: „Breit“ ist die natürliche moderne Entsprechung für die angegebene zweite Dimension.
theological_decisions:
- issue: Wiedergabe von כַּפֹּרֶת im kultischen Zusammenhang
  choice: Sühneplatte
  alternative: Deckplatte; Sühndeckel; Gnadenthron
  rationale: Das Wort bezeichnet konkret die Deckplatte der Lade, trägt aber aufgrund seiner Wortfamilie und kultischen Funktion zugleich Sühnebezüge. „Sühneplatte“ hält Gegenstand und Funktion zusammen, ohne die spätere theologische Deutung auszubauen. Die sachlichere Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Maßangaben stehen in der geläufigen Form „zweieinhalb“ und „anderthalb Ellen“; die kultische Bezeichnung bleibt präzise, ohne altertümlich zu wirken.
