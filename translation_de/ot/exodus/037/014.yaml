  text: The rings were beside the frame, as holders for the poles to carry the table.
translation:
  language: de
  text: Neben dem Rahmen befanden sich die Ringe als Halterungen für die Stangen, um den Tisch zu tragen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֻמַּת הַמִּסְגֶּרֶת
  choice: unmittelbar am Rahmen
  rationale: לְעֻמַּת bezeichnet hier die räumliche Lage der Ringe zum Rahmen. Im baulichen Zusammenhang ist »unmittelbar am« natürlich und wahrt die mögliche Bedeutung »nahe bei/gegenüberliegend zu«, ohne eine technisch unklare deutsche Formulierung zu erzwingen.
- source_word: בָּתִּים לַבַּדִּים
  choice: Halterungen für die Stangen
  rationale: בָּתִּים bedeutet wörtlich »Häuser«, bezeichnet hier aber Aufnahmen oder Halterungen, in die die Tragstangen eingeführt wurden.
- source_word: לָשֵׂאת אֶת־הַשֻּׁלְחָן
  choice: mit denen man den Tisch trug
  rationale: Der Infinitiv gibt den Zweck der Stangen an. Die deutsche Relativkonstruktion ist klar und natürlich; das unbestimmte »man« benennt keinen im Hebräischen nicht genannten Träger.
