  source_fidelity: 'Der Entwurf gibt die Funktion der Ringe als Aufnahmen für die Tragstangen und den Zweck des Tischtragens zutreffend wieder. „unmittelbar am“ verschärft jedoch die räumliche Aussage: לְעֻמַּת kann hier „neben/bei“ (je nach Analyse auch „gegenüber“) bezeichnen, nicht ausdrücklich „unmittelbar“. „Neben dem“ bewahrt die im Kontext tragfähige räumliche Aussage ohne diese zusätzliche Präzisierung.'
  naturalness: „Neben dem Rahmen befanden sich die Ringe als Halterungen für die Stangen, um den Tisch zu tragen“ ist modernes, flüssiges Standarddeutsch und bildet die knappe technische Aussage in einem Satz ab.
  terminology: „Rahmen“ ist für מִסְגֶּרֶת im Möbelkontext angemessen. „Halterungen“ gibt בָּתִּים idiomatisch als Aufnahmen für die Stangen wieder. „Stangen“ und „Tisch“ sind sachgerecht.
  issues:
