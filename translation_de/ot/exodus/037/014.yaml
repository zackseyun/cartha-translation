    issue: „unmittelbar am Rahmen“
    rationale: Das Adverb „unmittelbar“ ist im Hebräischen nicht ausgedrückt und engt die räumlich nicht völlig eindeutige Präposition לְעֻמַּת unnötig ein. Die englische Prüffassung verwendet entsprechend das weniger präzise „beside“.
  revised_text: Neben dem Rahmen befanden sich die Ringe als Halterungen für die Stangen, um den Tisch zu tragen.
