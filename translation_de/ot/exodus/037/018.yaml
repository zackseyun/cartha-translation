  yaml_path: translation/ot/exodus/037/018.yaml
  text: 'And six branches were coming out from its sides: three branches of the lampstand from its one side[b][a], and three branches of the lampstand from its second side.'
translation:
  language: de
  text: 'Und sechs Arme gingen von seinen Seiten aus: drei Arme des Leuchters von seiner einen Seite[a] und drei Arme des Leuchters von seiner anderen Seite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von seiner einen Seite … von seiner zweiten Seite“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: Arme
  rationale: Im Zusammenhang mit dem Leuchter bezeichnet קנה die seitlich herausführenden, tragenden Teile. „Arme“ ist im modernen Deutschen für einen Leuchter natürlich und vermeidet den Eindruck echter Pflanzenzweige.
- source_word: יֹצְאִים
  choice: gingen … aus
  rationale: Die partizipiale Form von יצא beschreibt die sechs Arme als vom Leuchter nach außen ausgehend; die deutsche Wendung bewahrt diese räumlich-dynamische Aussage.
- source_word: מִצִּדֶּיהָ / מִצִּדָּהּ
  choice: von seinen Seiten / von seiner … Seite
  rationale: צד bedeutet „Seite“. Die Formulierung folgt der hebräischen Abfolge von der allgemeinen Angabe beider Seiten zur Aufteilung auf jede Seite.
- source_word: מְנֹרָה
  choice: Leuchter
  rationale: Das gewöhnliche Substantiv bezeichnet hier den kultischen Leuchter. „Leuchter“ ist eine klare deutsche Bedeutungsübersetzung; eine Transliteration als „Menora“ ist nicht nötig.
- source_word: הָאֶחָד … הַשֵּׁנִי
  choice: seiner einen Seite … seiner anderen Seite
  rationale: Wörtlich steht „der einen … der zweiten“. Im natürlichen Deutschen bezeichnet „die eine … die andere Seite“ denselben paarweisen Gegensatz, ohne den Sinn zu verändern.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Arme“ entspricht dem üblichen Sprachgebrauch für die seitlichen Teile eines Leuchters; der Satzbau bleibt eng an der symmetrischen Struktur des Hebräischen.
