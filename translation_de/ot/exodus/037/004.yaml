  text: Er fertigte Stangen aus Akazienholz an und überzog sie mit Gold.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er fertigte … an
  rationale: Das Qal-Wayyiqtol von עשה bezeichnet hier im handwerklichen Zusammenhang das Anfertigen. Die einleitende Konjunktion wird im natürlichen deutschen Erzählstil nicht eigens wiedergegeben.
- source_word: בַּדֵּי
  choice: Stangen
  rationale: בַּד bezeichnet im Heiligtumskontext die Stangen zum Tragen heiliger Gegenstände. „Stangen“ ist im modernen Deutschen klar und knapp.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: Die Constructusverbindung bezeichnet Holz der Akazie. „Akazienholz“ ist die geläufige und verständliche deutsche Bezeichnung.
- source_word: וַיְצַף
  choice: und überzog
  rationale: צפה bedeutet in diesem handwerklichen Zusammenhang, einen Gegenstand mit einem Material zu überziehen oder zu beschichten. „Überzog“ bewahrt das konkrete Bild und entspricht idiomatischem Deutsch.
- source_word: אֹתָם
  choice: sie
  rationale: Das Akkusativpronomen bezieht sich auf die zuvor genannten Stangen im Plural.
- source_word: זָהָב
  choice: mit Gold
  rationale: Gold ist das Material des Überzugs; nach „überziehen“ wird es im Deutschen natürlich mit „mit“ angeschlossen.
