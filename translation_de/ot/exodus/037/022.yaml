  edition: WLC
  text: כַּפְתֹּרֵי/הֶ֥ם וּ/קְנֹתָ֖/ם מִמֶּ֣/נָּה הָי֑וּ כֻּלָּ֛/הּ מִקְשָׁ֥ה אַחַ֖ת זָהָ֥ב טָהֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/022.yaml
  text: Their buds and their branches were of one piece with it[c][b][a]; all of it was one hammered work of pure gold.
translation:
  language: de
  text: Ihre Knäufe[a] und ihre Arme waren aus einem Stück mit ihm[b]; das Ganze war ein einziges getriebenes Werk[c] aus reinem Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Knospen“. Das hebräische Wort bezeichnet ein rundliches Zierelement, hier im Zusammenhang pflanzlicher Formen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „aus ihm“; das heißt, sie waren mit dem Leuchter selbst aus demselben Stück gefertigt.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „eine einzige getriebene Arbeit“ oder „aus einem Stück getrieben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: ihre Knäufe
  rationale: כַּפְתּוֹר bezeichnet hier ein rundliches Zierelement des Leuchters. „Knospen“ wäre wegen der Pflanzenornamentik möglich, doch „Knäufe“ gibt die Form zurückhaltender wieder und bewahrt die lexikalische Offenheit.
- source_word: וּקְנֹתָם
  choice: und ihre Arme
  rationale: קָנֶה bedeutet grundsätzlich Rohr oder Schaft und bezeichnet beim Leuchter dessen seitlich hervortretende Teile. Im modernen Deutschen ist „Arme“ hierfür die natürliche Sachbezeichnung.
- source_word: מִמֶּנָּה הָיוּ
  choice: waren aus einem Stück mit ihm
  rationale: Wörtlich steht „waren aus ihm“. Gemeint ist, dass die Zierelemente und Arme nicht angesetzt, sondern integrale Bestandteile des Leuchters waren.
- source_word: כֻּלָּהּ
  choice: er bestand ganz
  rationale: Das feminine Suffix nimmt den Leuchter als Ganzes auf. Die Formulierung gibt den umfassenden Nachdruck idiomatisch wieder.
- source_word: מִקְשָׁה אַחַת
  choice: aus einer einzigen getriebenen Arbeit
  rationale: מִקְשָׁה bezeichnet eine durch Hämmern beziehungsweise Treiben gefertigte Metallarbeit; אַחַת betont ihre Einheit.
- source_word: זָהָב טָהוֹר
  choice: aus reinem Gold
  rationale: „Reines Gold“ ist die übliche und sachlich genaue Wiedergabe der Materialangabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Arme“ folgt dem üblichen deutschen Sprachgebrauch für die seitlichen Teile eines Leuchters; „getriebene Arbeit“ wahrt die handwerkliche Bedeutung des hebräischen Ausdrucks.
