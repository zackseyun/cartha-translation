base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/009.yaml
  text: The cherubim had their wings spread upward[a], overshadowing the mercy seat with their wings, and their faces were toward one another; the faces of the cherubim were toward the mercy seat.
translation:
  language: de
  text: Die Cherubim hielten ihre Flügel nach oben ausgebreitet und bedeckten mit ihren Flügeln den Sühnedeckel[a]. Ihre Gesichter waren einander zugewandt; zum Sühnedeckel hin waren die Gesichter der Cherubim gerichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Deckel“; traditionell: „der Gnadenthron“. Gemeint ist der Deckel der Bundeslade, der im Sühneritus eine zentrale Rolle spielte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: die Kerubim
  rationale: Die im Deutschen etablierte Transliteration bezeichnet diese himmlischen Gestalten präzise und bewahrt die hebräische Pluralform.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: hielten ihre Flügel nach oben ausgebreitet
  rationale: Die Formulierung gibt die durch Verb und Partizip beschriebene anhaltende Haltung natürlich wieder und bewahrt die Richtung nach oben.
- source_word: סֹכְכִים
  choice: überschatteten
  rationale: Das Wort bezeichnet ein Bedecken oder Abschirmen von oben; „überschatteten“ passt zum Bild der über dem Deckel ausgebreiteten Flügel, ohne vollständige Verhüllung zu behaupten.
- source_word: הַכַּפֹּרֶת
  choice: der Sühnedeckel
  rationale: Der Ausdruck benennt die Deckplatte der Bundeslade, die im kultischen Zusammenhang mit Sühne verbunden ist. „Sühnedeckel“ hält die gegenständliche und die kultische Bedeutung zusammen.
- source_word: בְּכַנְפֵיהֶם
  choice: mit ihren Flügeln
  rationale: Die Präposition בְּ bezeichnet hier das Mittel, durch das die Kerubim den Sühnedeckel überschatten.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: Ihre Gesichter waren einander zugewandt
  rationale: Die hebräische reziproke Wendung, wörtlich etwa „jeder zu seinem Bruder“, wird in natürlichem Deutsch als gegenseitige Ausrichtung wiedergegeben.
- source_word: אֶל הַכַּפֹּרֶת הָיוּ פְּנֵי הַכְּרֻבִים
  choice: zum Sühnedeckel hin waren die Gesichter der Kerubim gerichtet
  rationale: Die Wiederholung von „Gesichter“ und „Sühnedeckel“ bleibt erhalten und bewahrt so die formale Parallelität und Betonung des Hebräischen.
theological_decisions:
- issue: Wiedergabe von הַכַּפֹּרֶת im Heiligtumskontext
  choice: Sühnedeckel
  alternative: Deckplatte; Gnadenthron
  rationale: „Sühnedeckel“ bezeichnet sowohl den tatsächlichen Deckel der Bundeslade als auch seine kultische Funktion, ohne das Bild eines Thrones in den Ausgangstext einzutragen. Die sachlich wörtlichere und die traditionelle Wiedergabe werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leichte Wiederholung im zweiten Satz folgt bewusst der hebräischen Betonung; „Kerubim“ und „Sühnedeckel“ sind sachlich präzise, ohne unnötig akademisch zu wirken.
