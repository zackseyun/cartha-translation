lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er fertigte … an
  rationale: Das Qal-Wayyiqtol von עשה bezeichnet hier im handwerklichen Zusammenhang das Anfertigen; die deutsche Erzählfolge kann ohne ausdrücklich wiedergegebenes וַ־ natürlich formuliert werden.
- source_word: הַבַּדִּים
  choice: die Stangen
  rationale: בַּדִּים bezeichnet im Zusammenhang mit den Heiligtumsgegenständen die zum Tragen bestimmten Stangen; „Stangen“ ist im Deutschen klar und geläufig.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: Die hebräische Konstruktverbindung bezeichnet das verwendete Material; „aus Akazienholz“ ist die natürliche deutsche Wiedergabe.
- source_word: וַיְצַף
  choice: und überzog
  rationale: צפה bedeutet in diesem handwerklichen Kontext, einen Gegenstand mit einem Material zu überziehen.
- source_word: אֹתָם
  choice: sie
  rationale: Das Objektsuffix verweist auf die zuvor genannten Stangen.
- source_word: זָהָב
  choice: mit Gold
  rationale: זָהָב bezeichnet den Stoff des Überzugs; im Deutschen steht dafür idiomatisch „mit Gold“.
