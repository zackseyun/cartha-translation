  text: וַ/יַּ֥עַשׂ אֶת הַ/שֻּׁלְחָ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֤יִם אָרְכּ/וֹ֙ וְ/אַמָּ֣ה רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/010.yaml
  text: He made the table of acacia wood; its length was two cubits[a], its width one cubit, and its height one and a half cubits.
translation:
  language: de
  text: Er machte den Tisch aus Akazienholz. Er war zwei Ellen lang, eine Elle breit und anderthalb Ellen hoch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er machte
  rationale: Das Verb עשה bezeichnet hier im fortlaufenden Erzählbericht die Herstellung des Gegenstands. „Er machte“ gibt den schlichten Sinn natürlich wieder; das einleitende ו muss im modernen Deutschen nicht eigens mit „und“ wiedergegeben werden.
- source_word: הַשֻּׁלְחָן
  choice: den Tisch
  rationale: שֻׁלְחָן bezeichnet eindeutig einen Tisch; der bestimmte Artikel bleibt erhalten.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: Die Verbindung bezeichnet Holz der Akazie. „Akazienholz“ ist im heutigen Deutsch klar und idiomatisch.
- source_word: אַמָּתַיִם אָרְכּוֹ
  choice: zwei Ellen lang
  rationale: אַמָּה ist die antike Maßeinheit „Elle“. Die prädikative Formulierung gibt die Längenangabe natürlich und genau wieder.
- source_word: וְאַמָּה רָחְבּוֹ
  choice: eine Elle breit
  rationale: Die Breitenangabe wird in einer im Deutschen üblichen Maßkonstruktion wiedergegeben.
- source_word: וְאַמָּה וָחֵצִי קֹמָתוֹ
  choice: anderthalb Ellen hoch
  rationale: Die Formulierung bewahrt den genauen Wert „eine Elle und eine halbe“ und gibt קֹמָה im Sachzusammenhang als Höhe wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die historischen Maße bleiben als Ellen erhalten; die parallelen Maßangaben werden in eine natürliche deutsche Satzstruktur überführt. Die sachlich unzutreffende englische Fußnote zu „zwei Ellen“ wurde nicht übernommen, da der hebräische Text dort eindeutig אַמָּתַיִם („zwei Ellen“) liest; „eine Elle und eine halbe“ bezeichnet die Höhe.
