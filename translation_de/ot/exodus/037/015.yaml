  text: Er fertigte die Stangen aus Akazienholz und überzog sie mit Gold, um den Tisch zu tragen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er fertigte … an
  rationale: Das wayyiqtol führt die Abfolge der Herstellung fort. „Fertigte … an“ passt im Deutschen natürlich zum handwerklichen Zusammenhang.
- source_word: הַבַּדִּים
  choice: die Stangen
  rationale: בַּדִּים bezeichnet hier die zum Tragen des Heiligtumsmobiliars bestimmten Stangen. „Stangen“ ist modern und im Kontext eindeutig.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: Die Konstruktverbindung bezeichnet das Material; „Akazienholz“ ist die übliche und natürliche deutsche Wiedergabe.
- source_word: וַיְצַף אֹתָם זָהָב
  choice: und überzog sie mit Gold
  rationale: צפה bezeichnet in diesem handwerklichen Kontext das Überziehen mit einer Metallschicht. Die Formulierung bewahrt zudem den maskulinen Pluralbezug von אֹתָם auf die Stangen.
- source_word: לָשֵׂאת
  choice: damit man … tragen konnte
  rationale: Der Infinitiv mit לְ drückt den Zweck aus. Die deutsche Zweckkonstruktion macht klar, wozu die Stangen dienten, ohne ein im Hebräischen nicht genanntes konkretes Subjekt einzuführen.
- source_word: הַשֻּׁלְחָן
  choice: den Tisch
  rationale: Die bestimmte Form wird direkt mit „den Tisch“ wiedergegeben; der Kontext identifiziert ihn als den zuvor beschriebenen Tisch.
