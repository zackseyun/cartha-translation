  text: וַ/יַּ֛עַשׂ שְׁנֵ֥י כְרֻבִ֖ים זָהָ֑ב מִקְשָׁה֙ עָשָׂ֣ה אֹתָ֔/ם מִ/שְּׁנֵ֖י קְצ֥וֹת הַ/כַּפֹּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/007.yaml
  text: He made two cherubim of gold; he made them of hammered work[a], from the two ends of the mercy seat.
translation:
  language: de
  text: Er machte zwei Kerubim aus Gold; in getriebener Arbeit formte er sie aus den beiden Enden der Sühneplatte[a] heraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Deckplatte“. Das hebräische Wort bezeichnet die Abdeckung der Bundeslade und steht im Zusammenhang mit Sühne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er machte
  rationale: Das Waw-Konsekutiv führt die erzählte Handlung weiter. Im modernen Deutschen ist die asyndetische Wiedergabe natürlich und bewahrt den Ablauf.
- source_word: שְׁנֵי כְרֻבִים
  choice: zwei Kerubim
  rationale: „Kerubim“ ist die etablierte deutsche Wiedergabe des hebräischen Plurals und erhält die besondere Bildwelt des Heiligtums.
- source_word: זָהָב
  choice: aus Gold
  rationale: Das Substantiv bezeichnet das Material; „aus Gold“ ist im Deutschen die natürliche Formulierung.
- source_word: מִקְשָׁה
  choice: als getriebene Arbeit
  rationale: Der Ausdruck bezeichnet durch Hämmern beziehungsweise Treiben geformte Metallarbeit. Die Wiedergabe hält den Herstellungsaspekt fest, ohne die mögliche Folgerung „aus einem Stück“ zum Wortlaut zu machen.
- source_word: עָשָׂה אֹתָם
  choice: fertigte er sie
  rationale: Die Wiederholung von עשה wird inhaltlich bewahrt; „fertigte“ vermeidet im Deutschen eine schwerfällige unmittelbare Wiederholung und passt zur handwerklichen Herstellung.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: aus den beiden Enden
  rationale: Die Präposition מִן bezeichnet hier am ehesten den Ausgangspunkt beziehungsweise die materielle Verbindung mit den Enden der Platte, nicht bloß die Lage an ihnen.
- source_word: הַכַּפֹּרֶת
  choice: die Sühneplatte
  rationale: כַּפֹּרֶת bezeichnet die goldene Deckplatte der Bundeslade, die kultisch mit Sühne verbunden ist. „Sühneplatte“ ist im Deutschen transparent und vermeidet die irreführende Vorstellung eines Sitzes.
theological_decisions:
- issue: Wiedergabe von הַכַּפֹּרֶת im Heiligtumskontext
  choice: Sühneplatte
  alternative: Deckplatte; Gnadenthron
  rationale: „Sühneplatte“ verbindet die konkrete Funktion als Abdeckung der Lade mit der kultischen Beziehung zur Sühne. „Deckplatte“ gibt den Gegenstand unmittelbar wieder, lässt jedoch den kultischen Bedeutungsgehalt unausgedrückt; „Gnadenthron“ ist traditionsreich, legt aber bildlich einen Thron beziehungsweise Sitz nahe, was das hebräische Wort nicht ausdrücklich sagt. Die sachliche Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die handwerkliche Terminologie bleibt konkret; die Wiederholung des hebräischen Verbs wird leicht variiert, ohne ihren Nachdruck zu verlieren.
