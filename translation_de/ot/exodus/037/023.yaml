translation:
  language: de
  text: Er machte ihre sieben Lampen, ihre Zangen[a] und ihre Pfannen[b] aus reinem Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dochtzangen“ oder „Dochtscheren“. Das hebräische Wort bezeichnet ein zangenartiges Gerät im Zusammenhang mit den Lampen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Feuerpfannen“ oder „Schalen“. Das hebräische Wort bezeichnet kleinere Gefäße; ihre genaue Form und Funktion sind hier nicht näher bestimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er machte
  rationale: Das Wayyiqtol von עשה führt die Erzählung fort; im natürlichen Deutschen genügt das Präteritum, ohne das וַ ausdrücklich wiederzugeben.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: ihre sieben Lampen
  rationale: נֵרוֹת bezeichnet Lampen, nicht Leuchter. Das feminine Suffix verweist auf den Leuchter im Kontext; die Zahl steht im Deutschen idiomatisch vor dem Substantiv.
- source_word: מַלְקָחֶיהָ
  choice: ihre Dochtzangen
  rationale: Das Wort bezeichnet hier ein Gerät zur Handhabung der Lampendochte. „Dochtzangen“ ist kontextbezogener als das allgemeine „Zangen“, ohne die genaue Funktion vollständig festzulegen.
- source_word: מַחְתֹּתֶיהָ
  choice: ihre Auffangschalen
  rationale: Im Zusammenhang mit dem Leuchter sind kleine Gefäße beziehungsweise Schalen für Rückstände der Lampen gemeint. „Auffangschalen“ vermeidet die irreführende Assoziation von „Feuerpfannen“ mit dem Altar.
- source_word: זָהָב טָהוֹר
  choice: aus reinem Gold
  rationale: Die Materialangabe wird im Deutschen natürlich mit „aus“ ausgedrückt und bezieht sich auf die genannten Teile.
