  text: וַ/יַּ֧עַשׂ בְּצַלְאֵ֛ל אֶת הָ/אָרֹ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/001.yaml
  text: Bezalel made the ark of acacia wood. Its length was two and a half cubits[a], its width one and a half cubits, and its height one and a half cubits.
translation:
  language: de
  text: Bezalel fertigte die Lade aus Akazienholz an. Sie war zweieinhalb Ellen lang, eineinhalb Ellen breit und eineinhalb Ellen hoch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Elle entsprach ungefähr 45 Zentimetern. Die Lade war demnach etwa 1,13 Meter lang sowie etwa 68 Zentimeter breit und hoch.
    reason: measurement_clarification
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fertigte … an
  rationale: Das gewöhnliche Verb עשה bedeutet „machen, anfertigen“. „Fertigte … an“ klingt bei einem handwerklich hergestellten Gegenstand natürlich, ohne zusätzliche Einzelheiten einzutragen.
- source_word: בְּצַלְאֵל
  choice: Bezalel
  rationale: Der Personenname wird nach üblicher deutscher Konvention transliteriert.
- source_word: הָאָרֹן
  choice: die Lade
  rationale: אָרוֹן kann allgemein einen Kasten oder eine Truhe bezeichnen; im Heiligtumskontext ist „Lade“ die etablierte und sachlich genaue Bezeichnung.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: Die hebräische Konstruktverbindung bezeichnet idiomatisch das Material Akazienholz.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: zweieinhalb Ellen
  rationale: Die antike Maßeinheit bleibt erhalten; die deutsche Formulierung gibt Zahl und Einheit natürlich wieder.
- source_word: אָרְכּוֹ
  choice: lang
  rationale: Die prädikative deutsche Form „war … lang“ gibt die Angabe seiner Länge klar und idiomatisch wieder.
- source_word: וְאַמָּה וָחֵצִי
  choice: eineinhalb Ellen
  rationale: Die Maßangabe wird für Breite und Höhe in natürlichem modernem Deutsch wiedergegeben.
- source_word: רָחְבּוֹ
  choice: breit
  rationale: „Breit“ ist in der deutschen Maßformel die natürliche Entsprechung für die Querabmessung.
- source_word: קֹמָתוֹ
  choice: hoch
  rationale: „Hoch“ bezeichnet bei einem Gegenstand idiomatisch seine vertikale Abmessung.
