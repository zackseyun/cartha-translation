  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הַ/קְּטֹ֖רֶת עֲצֵ֣י שִׁטִּ֑ים אַמָּ֣ה אָרְכּ/וֹ֩ וְ/אַמָּ֨ה רָחְבּ֜/וֹ רָב֗וּעַ וְ/אַמָּתַ֨יִם֙ קֹֽמָת֔/וֹ מִמֶּ֖/נּוּ הָי֥וּ קַרְנֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/025.yaml
  text: He made the altar of incense of acacia wood. Its length was one cubit[a], and its width one cubit—it was square—and its height was two cubits. Its horns were of one piece with it.
translation:
  language: de
  text: Er machte den Räucheraltar aus Akazienholz. Er war eine Elle lang und eine Elle breit – quadratisch – und zwei Ellen hoch. Seine Hörner waren mit ihm aus einem Stück gefertigt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er machte
  rationale: Das Narrativverb bezeichnet eine abgeschlossene Handlung; im natürlichen deutschen Erzählstil kann das einleitende ו ohne eigenes „und“ wiedergegeben werden.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: den Räucheraltar
  rationale: Die deutsche Zusammensetzung bezeichnet knapp und eindeutig den Altar für das Räucherwerk.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: Dies ist die geläufige moderne Bezeichnung des Materials und verständlicher als eine Transliteration.
- source_word: אַמָּה / אַמָּתַיִם
  choice: eine Elle / zwei Ellen
  rationale: Die antike Maßeinheit bleibt erhalten, damit keine unsichere moderne Umrechnung als exakte Angabe erscheint.
- source_word: אָרְכּוֹ ... רָחְבּוֹ ... קֹמָתוֹ
  choice: Er war eine Elle lang und eine Elle breit … und zwei Ellen hoch
  rationale: Die substantivischen Maßangaben werden in natürliches modernes Deutsch übertragen, ohne ihren Inhalt zu verändern.
- source_word: רָבוּעַ
  choice: quadratisch
  rationale: Das prädikative Adjektiv beschreibt den Grundriss des Altars prägnant.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: Seine Hörner waren aus einem Stück mit ihm
  rationale: Die Wendung beschreibt die Hörner als integralen Bestandteil des Altars und nicht als nachträglich angesetzte Teile.
theological_decisions: []
