base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/008.yaml
  text: one cherub from one end on this side[a], and one cherub from one end on that side; from the mercy seat he made the cherubim on its two ends.
translation:
  language: de
  text: Den einen Kerub machte er an dem einen Ende und den anderen Kerub am anderen Ende. Aus der Sühneplatte[a] machte er die Kerubim an den beiden Enden der Sühneplatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Deckplatte; traditionell auch Gnadenthron. Gemeint ist die goldene Deckplatte der Bundeslade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרוּב
  choice: Kerub
  rationale: Der etablierte deutsche Fachbegriff bezeichnet die besonderen geflügelten Thronwächter an der Bundeslade, ohne ihre Gestalt spekulativ auszudeuten.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: an dem einen Ende ... am anderen Ende
  rationale: Die paarweise gebrauchten Wendungen unterscheiden die beiden gegenüberliegenden Enden. Diese Formulierung gibt die räumliche Aussage klar und idiomatisch wieder.
- source_word: הַכַּפֹּרֶת
  choice: Sühneplatte
  rationale: Das Wort bezeichnet die goldene Deckplatte der Bundeslade in ihrer kultischen Funktion. „Sühneplatte“ bewahrt sowohl den Gegenstandsbezug als auch die kultische Bedeutung; die neutralere Alternative wird in einer Fußnote genannt.
- source_word: עָשָׂה
  choice: machte
  rationale: Das gewöhnliche Verb bedeutet hier schlicht „machen“; eine kunstsprachlichere Wiedergabe wie „gestalten“ wäre nicht erforderlich.
- source_word: מִשְּׁנֵי קְצֹוֹתָיו
  choice: an ihren beiden Enden
  rationale: Die Wendung beschreibt die Lage der Kerubim an den beiden Enden der Sühneplatte. Das vorausgehende „aus“ bringt zugleich zum Ausdruck, dass sie aus ihr beziehungsweise als Teil von ihr gearbeitet wurden.
theological_decisions:
- issue: Wiedergabe von הַכַּפֹּרֶת im Heiligtumskontext
  choice: Sühneplatte
  alternative: Deckplatte; Gnadenthron
  rationale: „Sühneplatte“ bezeichnet den goldenen Deckel der Bundeslade und lässt seine kultische Bedeutung erkennen, ohne ihn als Sitzmöbel misszuverstehen. „Deckplatte“ ist gegenständlich präziser, aber theologisch weniger aussagekräftig; „Gnadenthron“ ist traditionsreich, geht jedoch über die konkrete Gegenstandsbezeichnung hinaus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der im Hebräischen elliptische erste Satzteil wird durch die aus dem unmittelbaren Zusammenhang ergänzte Verbform „machte“ zu einem verständlichen deutschen Satz. Die Wiederholung von „machte“ bleibt erhalten, weil auch der hebräische Vers anschließend das Herstellungsverhältnis ausdrücklich formuliert.
