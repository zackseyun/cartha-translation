revisions:
- from: Drei mandelblütenförmige Schalen waren an dem einen Arm[a], je mit Knauf und Blüte, und drei mandelblütenförmige Schalen waren an dem anderen Arm, je mit Knauf und Blüte[b]. So war es bei allen sechs Armen, die aus dem Leuchter hervorgingen.
