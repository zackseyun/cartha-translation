base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/019.yaml
  text: Three almond-blossom-shaped cups were on the one branch[a], with bulb and flower; and three almond-blossom-shaped cups were on one branch, with bulb and flower[b]. So it was for the six branches coming out from the lampstand.
translation:
  language: de
  text: Drei mandelblütenförmige Schalen waren an einem Arm, mit Knauf und Blüte, und drei mandelblütenförmige Schalen waren an einem Arm, mit Knauf und Blüte. So war es bei den sechs Armen, die vom Leuchter ausgingen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְבִעִים
  choice: Schalen
  rationale: Das Wort bezeichnet schalen- oder kelchartige Zierformen am Leuchter. „Schalen“ ist im modernen Deutschen verständlich und vermeidet eine unnötig technische Festlegung.
- source_word: מְשֻׁקָּדִים
  choice: mandelblütenförmig
  rationale: Die Form ist vom Mandelbaum her bestimmt; im Zusammenhang der Leuchterverzierung liegt eine Gestaltung nach Art von Mandelblüten nahe.
- source_word: קָנֶה
  choice: Arm
  rationale: Am Leuchter bezeichnet das Wort die seitlich herausgehenden Teile. „Arm“ ist im Deutschen für einen mehrarmigen Leuchter natürlich und präzise.
- source_word: כַּפְתֹּר
  choice: Knauf
  rationale: Gemeint ist ein rundliches Zierelement. „Knauf“ bewahrt den ornamentalen Charakter; „Knospe“ wäre ebenfalls möglich, würde die pflanzliche Deutung aber stärker festlegen.
- source_word: פֶרַח
  choice: Blüte
  rationale: Das Substantiv bezeichnet eine blütenartige Verzierung. „Blüte“ passt zum Mandelmotiv und ist im Deutschen knapp und anschaulich.
- source_word: כֵּן
  choice: So war es
  rationale: Die Wendung fasst die zuvor beschriebene wiederkehrende Gestaltung zusammen.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: die aus dem Leuchter hervorgingen
  rationale: Die Formulierung gibt die räumliche Vorstellung der vom Leuchter ausgehenden Arme unmittelbar wieder.
- source_word: מְנֹרָה
  choice: Leuchter
  rationale: „Leuchter“ ist die geläufige deutsche Sachbezeichnung und hier verständlicher als eine Transliteration.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sachlich-kunsthandwerkliche Beschreibung bleibt knapp; die parallele Struktur des Hebräischen wird weitgehend bewahrt. „Je“ verdeutlicht die Zuordnung von Knauf und Blüte zu den Schalen, ohne das Muster weiter auszudeuten.
