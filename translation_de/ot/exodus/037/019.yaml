  rationale: Die Revision entfernt die nicht ausdrücklich markierte Gegenüberstellung „anderen“ und die distributive Explizierung durch „je“. Sie bewahrt damit die parallele und in ihrer genauen Verteilung knappe Formulierung des Hebräischen, ohne die verständliche kunsthandwerkliche Sprache zu verändern. Die Fußnotenanker und ihre Inhalte bleiben funktionsfähig.
