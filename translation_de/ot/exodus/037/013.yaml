  text: He cast four gold rings for it and put the rings on the four corners at its four feet[a].
translation:
  language: de
  text: Er goss vier goldene Ringe für den Tisch und brachte die Ringe an den vier Ecken bei seinen vier Füßen an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an den vier Ecken, die zu seinen vier Tischbeinen gehörten“.'
    reason: Die hebräische Konstruktion kann räumlich („bei seinen vier Füßen“) oder als Zugehörigkeitsangabe zu den vier Tischbeinen verstanden werden.
lexical_decisions:
- source_word: וַיִּצֹק
  choice: goss
  rationale: Im Zusammenhang der Herstellung von Metallteilen bezeichnet das Verb das Gießen von geschmolzenem Metall.
- source_word: לוֹ
  choice: dafür
  rationale: Das Suffix bezieht sich auf den zuvor genannten Tisch; „dafür“ gibt den sachlichen Bezug natürlich wieder.
- source_word: טַבְּעֹת זָהָב
  choice: goldene Ringe
  rationale: Die Wendung bezeichnet Ringe aus Gold, die zur Aufnahme der Tragstangen dienten.
- source_word: וַיִּתֵּן
  choice: brachte … an
  rationale: Bei Beschlägen an einem Möbelstück ist „anbringen“ im Deutschen präziser und natürlicher als das allgemeine „setzen“.
- source_word: עַל אַרְבַּע הַפֵּאֹת
  choice: an den vier Ecken
  rationale: פֵּאוֹת bezeichnet hier die vier äußeren Ecken; עַל kann bei räumlicher Befestigung idiomatisch mit „an“ wiedergegeben werden.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: bei seinen vier Füßen
  rationale: Die Formulierung bewahrt die räumliche Zuordnung zu den vier Füßen des Tisches, ohne die knappe hebräische Konstruktion unnötig auszudeuten.
