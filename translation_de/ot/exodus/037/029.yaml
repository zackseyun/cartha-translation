  text: He made the holy anointing oil and the pure fragrant incense[b][a], the work of a perfumer.
translation:
  language: de
  text: Er stellte das heilige Salböl und das reine Räucherwerk aus Duftstoffen[a] her, nach der Kunst eines Salbenmischers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Räucherwerk der Duftstoffe“; möglich ist auch: „Gewürzräucherwerk“. Gemeint ist Räucherwerk aus aromatischen Stoffen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach der Kunst eines Salbenbereiters“ oder „ein Werk eines Salbenbereiters“. Das hebräische Wort bezeichnet einen Fachmann für die kunstgerechte Zubereitung von Salbölen und aromatischen Stoffen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er stellte … her
  rationale: Das Wayyiqtol von עשה bezeichnet hier eine abgeschlossene Handlung in der fortlaufenden Erzählung; „stellte … her“ passt natürlich zur fachkundigen Anfertigung der Mischungen.
- source_word: שֶׁמֶן הַמִּשְׁחָה קֹדֶשׁ
  choice: das heilige Salböl
  rationale: Die Wendung bezeichnet das für den heiligen Gebrauch bestimmte Öl zur Salbung; die gewählte Form ist prägnant und im Deutschen idiomatisch.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: das Räucherwerk aus Duftstoffen
  rationale: Die hebräische Verbindung bezeichnet Räucherwerk aus aromatischen Stoffen. Die Übersetzung bewahrt diese konkrete Zusammensetzung, ohne sie auf bloßen Wohlgeruch zu reduzieren.
- source_word: טָהוֹר
  choice: rein
  rationale: טָהוֹר bezeichnet in diesem kultischen und stofflichen Zusammenhang Reinheit und wird direkt mit „rein“ wiedergegeben.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: kunstvoll gemischt von einem Salbenmischer
  rationale: Die nominale Wendung hebt die fachkundige Arbeit eines Spezialisten hervor. Die verbale deutsche Fassung macht verständlich, dass es sich um professionell zusammengesetzte Mischungen handelt.
