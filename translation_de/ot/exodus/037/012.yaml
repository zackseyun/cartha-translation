  text: וַ/יַּ֨עַשׂ ל֥/וֹ מִסְגֶּ֛רֶת טֹ֖פַח סָבִ֑יב וַ/יַּ֧עַשׂ זֵר זָהָ֛ב לְ/מִסְגַּרְתּ֖/וֹ סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/012.yaml
  text: He made for it a frame a handbreadth wide all around[b][a], and he made a gold molding around its frame.
translation:
  language: de
  text: Er machte ringsum daran eine handbreite Einfassung[a] und brachte ringsum an der Einfassung eine goldene Zierleiste[b] an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: einen handbreiten Rand beziehungsweise Rahmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: einen goldenen Kranz; gemeint ist hier eine umlaufende verzierende Leiste oder Bekrönung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: Einfassung
  rationale: Das Wort bezeichnet hier den umlaufenden baulichen Rand am Tisch. »Einfassung« ist im heutigen Deutsch anschaulich und lässt die genaue Konstruktion offen.
- source_word: טֹפַח
  choice: eine Handbreite
  rationale: Das Substantiv bezeichnet die traditionelle Maßeinheit einer Handbreite. Die deutsche Formulierung gibt das Maß knapp und natürlich wieder.
- source_word: סָבִיב
  choice: ringsum / rings um
  rationale: Die Wiedergabe bringt in beiden Satzteilen zum Ausdruck, dass sich Einfassung und Zierleiste um alle Seiten erstreckten.
- source_word: זֵר
  choice: Zierleiste
  rationale: Im Zusammenhang der Heiligtumsausstattung bezeichnet das Wort eine umlaufende, wohl verzierende Leiste oder Bekrönung. »Zierleiste« vermeidet das im heutigen Deutsch missverständliche traditionelle »Kranz«.
- source_word: זָהָב
  choice: goldene
  rationale: Das Material wird im Deutschen idiomatisch durch das Adjektiv »goldene« angegeben.
- source_word: לְמִסְגַּרְתּוֹ
  choice: um die Einfassung
  rationale: Die Präposition beschreibt hier die Zuordnung der Zierleiste zur genannten Einfassung; zusammen mit סָבִיב wird die räumliche Anbringung rings um sie natürlich ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden Wiederholungen von »ringsum« beziehungsweise »rings um« bewahren die parallele Struktur des Hebräischen, ohne im Deutschen schwerfällig zu wirken.
