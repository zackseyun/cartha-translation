base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/026.yaml
  text: He overlaid it with pure gold—its top[a], its sides all around, and its horns—and he made for it a gold molding all around.
translation:
  language: de
  text: 'Er überzog ihn mit reinem Gold: seine Oberseite, seine Seiten ringsum und seine Hörner. Ringsum brachte er eine goldene Zierleiste[a] an.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen goldenen Kranz“. Das hebräische Wort bezeichnet eine schmückende Einfassung oder einen umlaufenden Rand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: überzog
  rationale: צפה bezeichnet hier das Verkleiden des hölzernen Gegenstands mit einer Metallschicht. „Überzog“ ist im Deutschen natürlich und passt zum handwerklichen Zusammenhang.
- source_word: זָהָב טָהוֹר
  choice: reines Gold
  rationale: Die Wendung bezeichnet Gold von hoher Reinheit; „reines Gold“ ist die klare und geläufige deutsche Entsprechung.
- source_word: גַּגּוֹ
  choice: seine Oberseite
  rationale: Obwohl גג gewöhnlich „Dach“ bedeuten kann, ist bei diesem kleinen Einrichtungsgegenstand die obere Fläche gemeint. „Oberseite“ ist sachlich und kontextgerecht.
- source_word: קִירֹתָיו
  choice: seine Seiten
  rationale: Wörtlich kann das Wort „Wände“ bedeuten; bei einem tragbaren Gegenstand bezeichnet „Seiten“ die senkrechten Außenflächen natürlicher.
- source_word: סָבִיב
  choice: ringsum
  rationale: „Ringsum“ gibt die vollständig umlaufende Ausdehnung knapp und idiomatisch wieder.
- source_word: קַרְנֹתָיו
  choice: seine Hörner
  rationale: Die vorspringenden Altarecken werden mit dem etablierten kultischen Ausdruck „Hörner“ bezeichnet; die konkrete Bildsprache bleibt erhalten.
- source_word: זֵר
  choice: Zierleiste
  rationale: זֵר bezeichnet hier eine umlaufende schmückende Einfassung oder Leiste. „Zierleiste“ ist für heutige Leser anschaulich und vermeidet die mögliche Fehlvorstellung eines königlichen Kopfschmucks.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, sachlichem Ton. Der etablierte kultische Ausdruck „Hörner“ bleibt wörtlich erhalten; handwerkliche Begriffe werden gegenständlich und natürlich wiedergegeben.
