base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/017.yaml
  text: He made the lampstand of pure gold[a]. He made the lampstand of hammered work; its base and its shaft, its cups, its buds[b], and its blossoms were of one piece with it.
translation:
  language: de
  text: Er machte den Leuchter aus reinem Gold. Er machte den Leuchter in Treibarbeit. Sein Fuß und sein Schaft, seine Kelche, seine Knospen[b] und seine Blüten waren mit ihm aus einem Stück gefertigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: „Knäufe“. Gemeint sind knaufartige Schmuckelemente; „Knospen“ entspricht der pflanzenartigen Gestaltung des Leuchters.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרָה
  choice: Leuchter
  rationale: Bezeichnet den kultischen, verzweigten Träger für Öllampen. „Leuchter“ ist im Deutschen die geläufige und würdige Bezeichnung, auch wenn es sich nicht um einen Kerzenleuchter handelt.
- source_word: זָהָב טָהוֹר
  choice: reines Gold
  rationale: טָהוֹר bezeichnet bei einem Werkstoff dessen Reinheit beziehungsweise Läuterung; „reines Gold“ ist idiomatisch und genau.
- source_word: מִקְשָׁה
  choice: Treibarbeit
  rationale: Das Wort beschreibt Metall, das durch Hämmern aus einem zusammenhängenden Stück geformt wird. „Treibarbeit“ gibt das Herstellungsverfahren prägnant wieder.
- source_word: יְרֵכָהּ
  choice: sein Fuß
  rationale: Wörtlich kann das Wort „Schenkel“ oder „Seite“ bedeuten; bei diesem Einrichtungsgegenstand bezeichnet es den unteren tragenden Teil.
- source_word: קָנָהּ
  choice: sein Schaft
  rationale: Der Singular bezeichnet hier das zentrale tragende Element des Leuchters; „Schaft“ ist sachlich klarer als „Zweig“.
- source_word: גְּבִיעֶיהָ
  choice: seine Kelche
  rationale: Gemeint sind kelchförmige Schmuckelemente. „Kelche“ bewahrt zugleich die pflanzenartige Gestaltung.
- source_word: כַּפְתֹּרֶיהָ
  choice: seine Knospen
  rationale: Das Wort bezeichnet knaufartige Vorsprünge. „Knospen“ fügt sich in die ausdrücklich florale Gestaltung ein; die sachlich-formale Alternative „Knäufe“ wird in der Fußnote genannt.
- source_word: פְרָחֶיהָ
  choice: seine Blüten
  rationale: „Blüten“ gibt die floralen Schmuckformen natürlich wieder und passt zu „Knospen“.
- source_word: מִמֶּנָּה הָיוּ
  choice: bildeten mit ihm ein einziges Stück
  rationale: Die Bestandteile waren integraler Bestandteil des Leuchters und nicht gesondert angesetzt. Die Formulierung macht diesen Zusammenhang im Deutschen deutlich.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Er machte ... fertigte er ... an
  rationale: Die Wiederholung des hebräischen Verbs bleibt inhaltlich erkennbar; die leichte Variation ergibt einen natürlichen deutschen Satzbau, ohne einen Bedeutungsunterschied einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Sachstil. Kultische Fachsprache wird sparsam eingesetzt; „Treibarbeit“ wird durch eine Fußnote erläutert. Die maskulinen Pronomen beziehen sich grammatisch auf „der Leuchter“.
