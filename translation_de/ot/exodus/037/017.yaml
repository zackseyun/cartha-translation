  to: Er machte den Leuchter aus reinem Gold. Er machte den Leuchter in Treibarbeit. Sein Fuß und sein Schaft, seine Kelche, seine Knospen[b] und seine Blüten waren mit ihm aus einem Stück gefertigt.
