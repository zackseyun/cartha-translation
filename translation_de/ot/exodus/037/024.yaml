base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/024.yaml
  text: He made it and all its utensils from a talent of pure gold[a].
translation:
  language: de
  text: Aus einem Talent reinem Gold fertigte er ihn und alle seine Geräte an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle seine Gefäße« beziehungsweise »alle seine Gerätschaften«. Das hebräische Wort כֵּלִים ist eine breite Bezeichnung für die zum Leuchter gehörenden Gegenstände.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: Talent
  rationale: Im Zusammenhang mit dem Bau des Heiligtums bezeichnet כִּכָּר die Gewichtseinheit »Talent«. Die etablierte deutsche Wiedergabe bewahrt die antike Maßeinheit.
- source_word: זָהָב טָהוֹר
  choice: reinem Gold
  rationale: טָהוֹר beschreibt hier die Reinheit des für die Herstellung verwendeten Goldes; »reines Gold« ist im Deutschen idiomatisch und sachgerecht.
- source_word: עָשָׂה
  choice: fertigte … an
  rationale: Das häufige Verb עשה bedeutet »machen/herstellen«. »Anfertigen« klingt im handwerklichen Zusammenhang natürlich und gibt den Herstellungsvorgang präzise wieder.
- source_word: אֹתָהּ
  choice: ihn
  rationale: Das feminine hebräische Pronomen verweist auf die Menora; das deutsche Bezugswort »Leuchter« ist maskulin, weshalb grammatisch »ihn« steht.
- source_word: וְאֵת כָּל כֵּלֶיהָ
  choice: und alle seine Geräte
  rationale: כֵּלִים ist eine breite Bezeichnung für zugehörige Gegenstände, Werkzeuge oder Gefäße. »Geräte« ist hier verständlich, würdig und lässt die sachliche Breite des hebräischen Ausdrucks bestehen.
theological_decisions: []
