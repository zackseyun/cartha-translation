  register: Modernes, gehobenes Standarddeutsch. Die Voranstellung der Materialangabe bildet den hebräischen Schwerpunkt auf dem Gesamtgewicht nach; »Talent« bleibt als traditionelle antike Gewichtseinheit erhalten.
