lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann sprach
  rationale: Das wayyiqtol führt die Erzählung zeitlich weiter. „Dann sprach“ gibt sowohl die Abfolge als auch die Bedeutung von דבר in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ ist die natürliche deutsche Formulierung.
- source_word: לֵאמֹר
  choice: Doppelpunkt
  rationale: Der Infinitiv לֵאמֹר leitet die folgende direkte Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „und sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen; „Jehova“ beruht auf einer späteren Mischlesung, während „der HERR“ den Namen durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gibt die hebräische Einleitungsformel לֵאמֹר idiomatisch wieder und weist darauf hin, dass die direkte Rede im folgenden Vers beginnt.
