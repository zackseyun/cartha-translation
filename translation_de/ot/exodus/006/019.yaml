  - severity: low
    issue: „nach ihren Geschlechterfolgen“ ist unnötig schwerfällig und im heutigen Deutsch weniger klar.
    rationale: „Abstammungslinien“ bewahrt den genealogischen Sinn von תּוֹלְדוֹת und ist modernes Standarddeutsch.
