  text: 'And the sons of Merari: Mahli and Mushi[a]. These are the clans of Levi according to their generations.'
translation:
  language: de
  text: 'Und die Söhne Meraris: Machli und Muschi. Das sind die Sippen Levis[a] nach ihren Abstammungslinien.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „des Leviten“. Der hebräische artikulierte Singular kann hier kollektiv die levitische Linie bezeichnen; möglich ist auch: „der Leviten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי מְרָרִי
  choice: Und die Söhne Meraris
  rationale: Der Status constructus bezeichnet in dieser genealogischen Aufzählung Meraris Söhne; die vorangestellte Konjunktion bewahrt den fortlaufenden Listencharakter.
- source_word: מַחְלִי וּ/מוּשִׁי
  choice: Machli und Muschi
  rationale: Die Eigennamen werden in der im Deutschen gebräuchlichen bibelnahen Umschrift wiedergegeben; die Konjunktion verbindet beide Namen.
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Die Identifikationsformel wird in natürlichem Deutsch mit ergänzter Kopula wiedergegeben.
- source_word: מִשְׁפְּחֹת
  choice: die Sippen
  rationale: Im genealogisch-tribalen Zusammenhang bezeichnet das Wort größere verwandtschaftliche Untergruppen; „Sippen“ ist hier genauer als das alltagssprachlich engere „Familien“.
- source_word: הַ/לֵּוִי
  choice: des Leviten
  rationale: Die hebräische Form steht mit Artikel im Singular und kann kollektiv die levitische Linie bezeichnen. Die Hauptfassung erhält diesen auffälligen Singular, ohne ihn stillschweigend mit dem Eigennamen Levi gleichzusetzen.
- source_word: לְ/תֹלְדֹתָם
  choice: nach ihren Geschlechterfolgen
  rationale: תּוֹלְדוֹת bezeichnet in genealogischen Formeln Abstammungsfolgen beziehungsweise Generationen; „Geschlechterfolgen“ bewahrt den genealogischen Sinn und einen würdigen Registerton.
theological_decisions:
- issue: Bezug und Numerus von הַלֵּוִי
  choice: des Leviten
  alternative: Levis; der Leviten
  rationale: Der hebräische Singular mit Artikel bleibt in der Hauptfassung sichtbar und wird nicht vorschnell als Eigenname oder grammatischer Plural gedeutet. Eine Fußnote nennt die naheliegenden kollektiven beziehungsweise genealogischen Verständnisse.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper genealogischer Satzstruktur. Der ungewöhnliche hebräische Singular wird im Text bewahrt und durch eine Fußnote verständlich gemacht.
