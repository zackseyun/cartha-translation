  source_fidelity: Die Namensfolge und die genealogische Struktur sind zutreffend wiedergegeben. הַלֵּוִי steht zwar formal als artikulierter Singular („der Levit“), fungiert in diesem Formelzusammenhang jedoch wahrscheinlich als kollektive beziehungsweise genealogische Bezeichnung für die Linie Levis. „des Leviten“ ist im Deutschen missverständlich, weil es leicht einen einzelnen, nicht näher bestimmten Leviten bezeichnet. „Levis“ gibt den genealogischen Bezug klar und idiomatisch wieder; die Fußnote hält die hebräische Singularform und die Auslegungsalternative fest.
  naturalness: '„Und die Söhne Meraris: Machli und Muschi“ ist knapp und im genealogischen Register natürlich. „Sippen Levis“ ist deutlich idiomatischer als „Sippen des Leviten“. „nach ihren Abstammungslinien“ vermittelt den Sinn von לְתֹלְדֹתָם in modernem Standarddeutsch klarer als „nach ihren Geschlechterfolgen“.'
  terminology: „Sippen“ trifft מִשְׁפְּחֹת im stammes- und genealogiebezogenen Kontext gut. Die traditionellen deutschen Namensformen „Machli“ und „Muschi“ sind angemessen. Die Fußnote soll nicht suggerieren, die Singularform müsse zwingend als individueller „Levit“ verstanden werden.
  issues:
