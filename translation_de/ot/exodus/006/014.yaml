base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/014.yaml
  text: 'These are the heads of their fathers’ houses: the sons of Reuben[a], the firstborn of Israel: Hanoch and Pallu, Hezron and Carmi. These are the clans of Reuben.'
translation:
  language: de
  text: 'Dies sind die Oberhäupter ihrer Vaterhäuser: die Söhne Rubens, des Erstgeborenen Israels: Henoch, Pallu, Hezron und Karmi. Das sind die Sippen Rubens.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה רָאשֵׁי בֵית אֲבֹתָם
  choice: Dies sind die Oberhäupter ihrer Vaterhäuser
  rationale: Die genealogische Überschrift und das Bild des »Hauptes« bleiben erhalten. »Vaterhäuser« bezeichnet die väterlich bestimmten Großfamilien beziehungsweise Abstammungsverbände und unterscheidet sie von den anschließend genannten Sippen.
- source_word: בְּנֵי רְאוּבֵן
  choice: die Söhne Rubens
  rationale: Die unmittelbar folgenden Namen sind Rubens Söhne; die formale Wiedergabe entspricht daher dem genealogischen Zusammenhang. Die mögliche kollektive Bedeutung wird in einer Fußnote genannt.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: des Erstgeborenen Israels
  rationale: Die Genitivapposition bezieht sich eindeutig auf Ruben und bewahrt die knappe genealogische Aussage des Hebräischen.
- source_word: חֲנוֹךְ וּפַלּוּא חֶצְרוֹן וְכַרְמִי
  choice: Henoch, Pallu, Hezron und Karmi
  rationale: Verwendet die im Deutschen üblichen Formen der hebräischen Eigennamen und gibt die Aufzählung natürlich wieder.
- source_word: מִשְׁפְּחֹת
  choice: Sippen
  rationale: Im Stammes- und Geschlechtsregister bezeichnet das Wort größere Verwandtschaftsgruppen; »Sippen« ist hier genauer als das moderne, oft auf die Kernfamilie bezogene »Familien«.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst beibehaltener genealogischer Terminologie. Die im Hebräischen fehlende Kopula wird im zweiten Satz als »waren« ergänzt, damit die Aufzählung im Deutschen klar und flüssig ist.
