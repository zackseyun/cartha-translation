  text: וַ/יְדַבֵּ֥ר אֱלֹהִ֖ים אֶל מֹשֶׁ֑ה וַ/יֹּ֥אמֶר אֵלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/002.yaml
  text: God spoke to Moses and said to him[a], “I am Yahweh.”
translation:
  language: de
  text: 'Gott sprach zu Mose und sagte zu ihm: „Ich bin Jahwe[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell als „der HERR“ wiedergegeben.'
    reason: Erläuterung des Gottesnamens und seiner traditionellen Ersatzwiedergabe.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: redete
  rationale: Das Verb דבר leitet in der hebräischen Erzählung eine Rede ein. „Redete“ ist natürlich und bewahrt zusammen mit dem folgenden „sagte“ die beiden Verben des Ausgangstextes.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Trotz der formal pluralischen Gestalt bezeichnet das Wort hier mit singularischem Verb den Gott Israels; „Gott“ ist die sachgemäße deutsche Wiedergabe.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede. „Zu Mose“ entspricht dem deutschen Sprachgebrauch; der Name wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: und sagte zu ihm
  rationale: Die Wiedergabe erhält das zweite hebräische Redeverb אמר und macht den Rückbezug des Pronomens auf Mose ausdrücklich.
- source_word: אֲנִי
  choice: Ich bin
  rationale: Der hebräische Nominalsatz enthält keine ausdrückliche Kopula. Im Deutschen ist „bin“ erforderlich; „Ich“ bleibt durch seine Stellung als betonte Selbstvorstellung erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen gebräuchliche wissenschaftliche Umschrift, ohne den Namen durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt dessen Charakter als persönliche Selbstbezeichnung; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt, aber nicht in den Haupttext eingesetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leichte Wiederholung „redete … und sagte“ ist bewusst beibehalten, weil auch der hebräische Text zwei verschiedene Redeverben verwendet.
