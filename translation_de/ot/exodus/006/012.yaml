  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה לִ/פְנֵ֥י יְהוָ֖ה לֵ/אמֹ֑ר הֵ֤ן בְּנֵֽי יִשְׂרָאֵל֙ לֹֽא שָׁמְע֣וּ אֵלַ֔/י וְ/אֵיךְ֙ יִשְׁמָעֵ֣/נִי פַרְעֹ֔ה וַ/אֲנִ֖י עֲרַ֥ל שְׂפָתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/012.yaml
  text: But Moses spoke before Yahweh[a], saying, “Behold, the sons of Israel have not listened to me; so how will Pharaoh listen to me[b], since I am uncircumcised in lips?”
translation:
  language: de
  text: 'Doch Mose sprach vor Jahwe: „Siehe, die Söhne Israels[a] haben nicht auf mich gehört. Wie sollte da der Pharao auf mich hören, da ich unbeschnittene Lippen[b] habe?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“. Wörtlich: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: Hebräische Redewendung für gehemmtes oder unzulängliches Reden; vergleiche 2. Mose 4,10.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Doch Mose sprach
  rationale: Das Waw führt die Erzählung weiter; „doch“ macht zugleich den Gegensatz zwischen dem göttlichen Auftrag und Moses erneutem Einwand deutlich.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: „Vor“ bewahrt die räumlich-relationale Wendung לִפְנֵי, während „Jahwe“ den im Hebräischen stehenden Gottesnamen wiedergibt.
- source_word: הֵן
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel hebt Moses folgenden Einwand hervor. „Siehe“ wahrt ihren Nachdruck und den würdigen biblischen Ton.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Formulierung bildet den hebräischen Familienausdruck transparent ab; die geläufigere Wiedergabe „die Israeliten“ wird in der Fußnote genannt.
- source_word: לֹא שָׁמְעוּ אֵלַי
  choice: haben nicht auf mich gehört
  rationale: שׁמע mit אֶל bezeichnet hier sowohl Hören als auch Beachtung; die deutsche Wendung bewahrt diese Bedeutungsbreite.
- source_word: וְאֵיךְ יִשְׁמָעֵנִי פַרְעֹה
  choice: Wie sollte da der Pharao auf mich hören
  rationale: „Da“ gibt die Folgerung aus dem vorherigen Satz wieder; der Konjunktiv „sollte“ bringt den rhetorischen Zweifel im Deutschen natürlich zum Ausdruck.
- source_word: וַאֲנִי עֲרַל שְׂפָתָיִם
  choice: wo ich doch unbeschnitten an den Lippen bin
  rationale: „Wo ich doch“ macht den begründenden Charakter des Einwands deutlich. Die ungewöhnliche Metapher bleibt erhalten, ohne sie auf eine bestimmte Sprachstörung festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst und nicht einen Titel. „Jahwe“ macht dies im Deutschen sichtbar.
- issue: Deutung von עֲרַל שְׂפָתָיִם
  choice: unbeschnitten an den Lippen
  alternative: schwerfällig im Reden
  rationale: Die wörtlich erkennbare Metapher lässt offen, ob Mose eine konkrete Sprechbehinderung, mangelnde Beredsamkeit oder allgemeine Ungeeignetheit zum Reden meint; diese Spannung wird nicht durch eine Diagnose aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener hebräischer Bildsprache. „Siehe“ setzt einen gehobenen biblischen Akzent, ohne den Satzbau unnötig altertümlich zu gestalten.
