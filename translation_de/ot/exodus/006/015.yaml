base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/015.yaml
  text: 'And the sons of Simeon: Jemuel[a], and Jamin, and Ohad, and Jakin, and Zohar, and Shaul the son of the Canaanite woman. These are the clans of Simeon.'
translation:
  language: de
  text: 'Und die Söhne Simeons: Jemuël, Jamin, Ohad, Jachin, Zohar und Schaul, der Sohn der Kanaaniterin. Das sind die Sippen Simeons.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: Und die Söhne Simeons
  rationale: בְנֵי bezeichnet im genealogischen Zusammenhang die Söhne; das vorangestellte וּ führt die fortlaufende Aufzählung weiter.
- source_word: יְמוּאֵל וְיָמִין וְאֹהַד וְיָכִין וְצֹחַר וְשָׁאוּל
  choice: Jemuël, Jamin, Ohad, Jachin, Zohar und Schaul
  rationale: Die Eigennamen werden in im Deutschen geläufigen, zugleich hebräischen Formen wiedergegeben. Die wiederholte hebräische Konjunktion wird nach natürlichem deutschem Listenstil durch Kommas und ein abschließendes „und“ ausgedrückt.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: der Sohn der Kanaaniterin
  rationale: Die feminine Form הַכְּנַעֲנִית bezeichnet ausdrücklich eine kanaanitische Frau; „Kanaaniterin“ gibt Geschlecht und Herkunft knapp und eindeutig wieder.
- source_word: אֵלֶּה מִשְׁפְּחֹת שִׁמְעוֹן
  choice: Das sind die Sippen Simeons
  rationale: Die verblöse hebräische Aussage verlangt im Deutschen eine Kopula. „Sippen“ bezeichnet hier die genealogischen Untergruppen des Stammes genauer als das moderne „Familien“.
