base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/004.yaml
  text: I also established my covenant with them[a], to give them the land of Canaan, the land where they lived as sojourners.
translation:
  language: de
  text: Auch habe ich meinen Bund mit ihnen aufgerichtet, um ihnen das Land Kanaan zu geben, das Land, in dem sie als Fremde lebten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „das Land ihrer Aufenthalte als Fremde, in dem sie als Fremde wohnten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch habe ich
  rationale: Gibt die additive Verknüpfung mit dem vorhergehenden Vers natürlich und ausdrücklich wieder.
- source_word: הֲקִמֹתִי אֶת־בְּרִיתִי
  choice: habe ich meinen Bund … aufgerichtet
  rationale: „Einen Bund aufrichten“ ist eine etablierte, würdevolle deutsche Wiedergabe der hebräischen Bundesformel קום + ברית und vermeidet die mögliche Zusatzbedeutung von „bestätigen“.
- source_word: אִתָּם
  choice: mit ihnen
  rationale: Bewahrt den relationalen Ausdruck und den Rückbezug auf die Erzväter im Kontext.
- source_word: לָתֵת לָהֶם
  choice: um ihnen … zu geben
  rationale: Der finale Infinitiv wird im Deutschen klar als Zweckangabe ausgedrückt.
- source_word: אֶרֶץ כְּנָעַן
  choice: das Land Kanaan
  rationale: Natürliche deutsche Form des hebräischen Ausdrucks unter Beibehaltung von „Land“ und des Eigennamens.
- source_word: אֶרֶץ מְגֻרֵיהֶם אֲשֶׁר גָּרוּ בָהּ
  choice: das Land, in dem sie als Fremde lebten
  rationale: Gibt den Gedanken des Aufenthalts ohne Heimatrecht verständlich wieder. Die eng verwandten Substantiv- und Verbformen werden in der Fußnote sichtbar gemacht.
theological_decisions:
- issue: Bundesformel קום + ברית
  choice: meinen Bund … aufgerichtet
  alternative: meinen Bund … bestätigt
  rationale: „Aufgerichtet“ bewahrt die feierliche Bundesformel, ohne festzulegen, ob hier vor allem Stiftung, Bekräftigung oder Bestandsgarantie gemeint ist.
- issue: Sozialer Status der Erzväter in Kanaan
  choice: als Fremde lebten
  alternative: sich vorübergehend aufhielten
  rationale: Die Wiedergabe erhält den im Stamm גור enthaltenen Status von Menschen, die nicht als einheimische Landbesitzer lebten, ohne eine über den Text hinausgehende rechtliche Definition einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Bundesformel „einen Bund aufrichten“ bleibt erhalten; die schwerfällige hebräische Wiederholung zum Fremdlingsaufenthalt wird im Haupttext natürlich formuliert und in der Fußnote dokumentiert.
