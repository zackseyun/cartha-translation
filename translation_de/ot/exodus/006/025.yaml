base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/025.yaml
  text: And Eleazar son of Aaron took for himself a wife from the daughters of Putiel[a], and she bore him Phinehas[b]. These are the heads of the fathers’ houses of the Levites by their clans.
translation:
  language: de
  text: Eleasar, der Sohn Aarons, nahm sich eine von den Töchtern Putiëls[a] zur Frau, und sie gebar ihm Pinhas. Dies sind die Oberhäupter der Vaterhäuser der Leviten nach ihren Sippen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von den Töchtern Putiëls“. Die Formulierung ordnet die Frau Putiels Familie zu; sie nennt keine bestimmte Tochter.'
    reason: lexical_alternative
  - marker: b
    text: „Vaterhäuser“ ist eine verwandtschaftliche Bezeichnung für angestammte Großfamilien beziehungsweise Haushaltsverbände innerhalb der levitischen Sippen.
    reason: cultural_note
lexical_decisions:
- source_word: לָקַח לוֹ ... לְאִשָּׁה
  choice: nahm sich ... zur Frau
  rationale: Die natürliche deutsche Wendung bewahrt das hebräische Heiratsidiom, ohne es lediglich mit „heiratete“ zusammenzufassen.
- source_word: מִבְּנוֹת פּוּטִיאֵל
  choice: eine von den Töchtern Putïels
  rationale: Das partitive מִן bezeichnet die Zugehörigkeit zu einer Gruppe; im Deutschen muss die gemeinte Einzelperson ausdrücklich gemacht werden.
- source_word: וַתֵּלֶד לוֹ אֶת־פִּינְחָס
  choice: und sie gebar ihm Pinhas
  rationale: Die feminine Verbform verweist auf die Ehefrau als Subjekt; „ihm“ gibt den Dativ לוֹ knapp und würdig wieder.
- source_word: רָאשֵׁי אֲבוֹת
  choice: die Oberhäupter der Vaterhäuser
  rationale: Die genealogische Fachwendung bezeichnet führende Vertreter angestammter Großfamilien beziehungsweise Haushaltsverbände, nicht bloß leibliche Väter.
- source_word: הַלְוִיִּם
  choice: der Leviten
  rationale: Dies ist die gebräuchliche deutsche Bezeichnung für die Nachkommen Levis als Stammesgruppe.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier genealogische Untergruppen; „Sippen“ ist präziser als das mehrdeutige „Familien“.
- source_word: אֶלְעָזָר / אַהֲרֹן / פּוּטִיאֵל / פִּינְחָס
  choice: Eleasar / Aaron / Putïel / Pinhas
  rationale: Die Namen folgen geläufigen deutschen Bibelnamensformen; der Trema in „Putïel“ verhindert, dass „ie“ als langer deutscher i-Laut gelesen wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit maßvoll bewahrtem genealogischem Sprachgebrauch. „Oberhäupter“ und „Vaterhäuser“ erhalten die soziale Struktur des hebräischen Textes; „Sippen“ vermeidet die moderne Verengung von „Familie“ auf die Kernfamilie.
