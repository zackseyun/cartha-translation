  source_fidelity: Die Übersetzung gibt die Erzählungsfortsetzung, die direkte Anrede an Mose, die Selbstidentifikation „Ich bin Jahwe“, den Imperativ an den Pharao und den vollständigen Umfang der zu übermittelnden Worte zuverlässig wieder. „Sag dem Pharao ... alles“ ist eine idiomatische und semantisch angemessene Wiedergabe von דַּבֵּר אֶל ... אֵת כָּל אֲשֶׁר.
