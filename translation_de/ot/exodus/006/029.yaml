source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֥ה לֵּ/אמֹ֖ר אֲנִ֣י יְהוָ֑ה דַּבֵּ֗ר אֶל פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם אֵ֛ת כָּל אֲשֶׁ֥ר אֲנִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/029.yaml
  text: Then Yahweh spoke to Moses[a], saying, “I am Yahweh. Speak to Pharaoh king of Egypt all that I speak to you.”
translation:
  language: de
  text: 'Da sprach Jahwe zu Mose: »Ich bin Jahwe. Sag dem Pharao, dem König von Ägypten, alles, was ich dir sage.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alles, was ich dir gerade sage.“'
    reason: Das Partizip דֹּבֵר kann neben einem allgemeinen oder fortdauernden Präsens auch einen unmittelbar im Verlauf befindlichen Sprechvorgang bezeichnen.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da sprach
  rationale: Das Waw mit der Verbform führt die Erzählung weiter. „Da sprach“ gibt diesen Fortgang knapp und in einem würdigen, gut verständlichen Erzählstil wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: לֵאמֹר
  choice: Einleitung der direkten Rede ohne gesondertes „indem er sagte“
  rationale: Im Deutschen macht der Doppelpunkt nach „sprach“ die Funktion des hebräischen Infinitivs natürlich und vollständig deutlich; eine zusätzliche Wiedergabe wäre schwerfällig.
- source_word: אֲנִי יְהוָה
  choice: Ich bin Jahwe
  rationale: Der hebräische Nominalsatz erfordert im Deutschen die Kopula „bin“. Die betonte Selbstvorstellung bleibt erhalten.
- source_word: דַּבֵּר
  choice: Sag
  rationale: Im Zusammenhang mit dem nachfolgenden Redeinhalt ist „Sag … alles“ idiomatischer als „Rede … alles“ und gibt den Imperativ direkt wieder.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: dem Pharao, dem König von Ägypten
  rationale: Die Apposition wird im Deutschen durch Kommas kenntlich gemacht und bleibt inhaltlich eng am Hebräischen.
- source_word: אֵת כָּל אֲשֶׁר
  choice: alles, was
  rationale: Diese natürliche deutsche Wendung gibt die Gesamtheit des mitzuteilenden Inhalts genau wieder.
- source_word: אֲנִי דֹּבֵר אֵלֶיךָ
  choice: was ich dir sage
  rationale: Das Präsens gibt die partizipiale Form natürlich wieder und bewahrt durch „Sag … sage“ zugleich die Wiederholung desselben hebräischen Verbstamms.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ bewahrt diese Selbstbezeichnung, ohne sie durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Erzählton. „Da sprach“ hält den narrativen Stil knapp; „Sag … alles, was ich dir sage“ ist idiomatisch und bewahrt die Wortwiederholung des Hebräischen. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung.
