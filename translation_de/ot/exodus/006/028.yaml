base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/028.yaml
  text: It happened on the day when Yahweh spoke to Moses in the land of Egypt—[a][b]
translation:
  language: de
  text: Und es geschah an dem Tag, als Jahwe zu Mose im Land Ägypten redete —[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und es begab sich“; auch: „Und es geschah“.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die Waw-Folgeform von היה markiert hier den Fortgang beziehungsweise die Wiederaufnahme der Erzählung. „Und es geschah“ bewahrt diese Anschlussfunktion und bleibt in würdigem modernem Bibeldeutsch verständlich.
- source_word: בְּיוֹם
  choice: an dem Tag, als
  rationale: Die Wendung bedeutet wörtlich „an dem Tag“; mit „als“ wird der folgende Zeitsatz im Deutschen natürlich angeschlossen.
- source_word: דִּבֶּר ... אֶל מֹשֶׁה
  choice: zu Mose redete
  rationale: דבר mit אֶל bezeichnet das Reden zu einer Person. „Redete“ gibt den erzählenden Rückverweis knapp und quellennah wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name transliteriert; „Jahwe“ ist die im Deutschen übliche Form.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Die Wiedergabe erhält das ausdrücklich genannte אֶרֶץ („Land“), ohne die Wendung auf bloßes „in Ägypten“ zu verkürzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. Die Transliteration „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt wie im Hebräischen durch den Gedankenstrich syntaktisch offen, da Vers 28 die Wiederaufnahme einleitet und in Vers 29 fortgeführt wird.
