  text: ה֥וּא אַהֲרֹ֖ן וּ/מֹשֶׁ֑ה אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם הוֹצִ֜יאוּ אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל מֵ/אֶ֥רֶץ מִצְרַ֖יִם עַל צִבְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/026.yaml
  text: It was Aaron and Moses to whom Yahweh said[c][b][a], “Bring the sons of Israel out from the land of Egypt by their hosts.”
translation:
  language: de
  text: 'Das sind Aaron und Mose,[a] zu denen Jahwe sagte: »Führt die Söhne Israels[b] aus dem Land Ägypten heraus nach ihren Heerscharen.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das ist Aaron und Mose.« Die hebräische Einleitung steht im Singular und hebt ihre Identität hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Kontextuell auch: »die Israeliten«; wörtlich: »die Söhne Israels«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »nach ihren Verbänden« beziehungsweise »in ihren Abteilungen«. Das hebräische Wort kann organisierte Gruppen bis hin zu militärisch gegliederten Formationen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Das sind
  rationale: Das selbstständige Pronomen dient hier der nachdrücklichen Identifizierung der zuvor genannten Personen. Trotz seiner Singularform verlangt die Verbindung mit »Aaron und Mose« im natürlichen Deutschen den Plural; die Singularform »Das ist« bleibt als formnähere Alternative in der Fußnote erhalten.
- source_word: אַהֲרֹן וּמֹשֶׁה
  choice: Aaron und Mose
  rationale: Verwendet werden die im Deutschen üblichen Namensformen.
- source_word: אֲשֶׁר ... לָהֶם
  choice: zu denen
  rationale: Die Verbindung aus Relativpartikel und »zu ihnen« bezeichnet Aaron und Mose als die Angeredeten und wird im Deutschen idiomatisch mit »zu denen« wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הוֹצִיאוּ
  choice: Führt ... heraus
  rationale: Der Hifil-Imperativ von יצא bezeichnet das Veranlassen des Hinausgehens. »Führt ... heraus« bewahrt den kausativen Sinn und passt dazu, dass Aaron und Mose das Volk leiten sollen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Wiedergabe erhält das familiäre Bild und die grammatisch maskuline Form des Hebräischen; die kontextuell glattere Bezeichnung »die Israeliten« wird in der Fußnote genannt.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Die Formulierung bewahrt sowohl die Herkunftsangabe als auch das ausdrücklich genannte »Land«.
- source_word: עַל צִבְאֹתָם
  choice: nach ihren Verbänden geordnet
  rationale: צָבָא kann ein Heer oder eine organisierte Formation bezeichnen. Im Zusammenhang des Auszugs hebt die Wendung die gegliederte Ordnung der Gruppen hervor, ohne sie eindeutig als kämpfende Armee festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. »Jahwe« bewahrt dessen Eigennamenscharakter, während »der HERR« ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Umfang und Geschlechtsform von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die wörtliche familiäre Ausdrucksweise wird im Haupttext bewahrt, ohne damit zu behaupten, nur männliche Personen seien beim Auszug gemeint; die kontextuelle Gesamtbezeichnung steht in der Fußnote.
- issue: Bedeutung von עַל צִבְאֹתָם
  choice: nach ihren Verbänden geordnet
  alternative: nach ihren Heerscharen
  rationale: Der Ausdruck lässt eine militärische Färbung zu, kann aber allgemeiner organisierte Gruppen bezeichnen. Die Übersetzung bewahrt diese organisatorische Aussage, ohne eine ausschließlich militärische Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Identifikationssatz bleibt knapp und nachdrücklich; der Befehl ist unmittelbar formuliert. Ungewöhnliche oder mehrdeutige hebräische Wendungen werden nicht geglättet, sondern im Haupttext verständlich wiedergegeben und durch Fußnoten transparent gemacht.
