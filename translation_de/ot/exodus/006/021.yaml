lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Und die Söhne
  rationale: בְּנֵי ist der Konstruktus Plural von »Sohn«; in dieser unmittelbaren genealogischen Aufzählung ist »die Söhne« die natürliche und genaue Wiedergabe. Das vorangestellte ו wird mit »Und« wiedergegeben, um die Listenstruktur zu bewahren.
- source_word: יִצְהָר
  choice: Jizhar
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition transliteriert.
- source_word: קֹרַח
  choice: Korach
  rationale: Die Form gibt den hebräischen Personenname im Deutschen erkennbar und lautnah wieder.
- source_word: וָ/נֶפֶג
  choice: Nefeg
  rationale: Der Personenname wird lautnah transliteriert; die Konjunktion ist in der deutschen Aufzählung vor dem letzten Glied gebündelt.
- source_word: וְ/זִכְרִי
  choice: Sichri
  rationale: Der Personenname wird in einer im Deutschen geläufigen, lautnahen Form wiedergegeben; das Präfix ו erscheint als »und«.
