source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה לִ/פְנֵ֣י יְהוָ֑ה הֵ֤ן אֲנִי֙ עֲרַ֣ל שְׂפָתַ֔יִם וְ/אֵ֕יךְ יִשְׁמַ֥ע אֵלַ֖/י פַּרְעֹֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/030.yaml
  text: But Moses said before the LORD, “Look, I am uncircumcised of lips; so how will Pharaoh listen to me?”
translation:
  language: de
  text: 'Doch Mose sagte vor dem HERRN: »Sieh, ich habe unbeschnittene Lippen. Wie sollte da der Pharao auf mich hören?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר ... לִפְנֵי יְהוָה
  choice: Doch Mose sagte vor dem HERRN
  rationale: וַיֹּאמֶר setzt hier Moses erneuten Einwand in Kontrast zum vorausgehenden Auftrag; לִפְנֵי bedeutet wörtlich »vor«. Der Gottesname יהוה wird entsprechend der deutschen Bibeltradition mit »der HERR« wiedergegeben.
- source_word: הֵן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel hebt Moses Selbstaussage nachdrücklich hervor. »Sieh« ist direkt und wahrt die Funktion des hebräischen Ausdrucks.
- source_word: עֲרַל שְׂפָתַיִם
  choice: ich habe unbeschnittene Lippen
  rationale: Die ungewöhnliche hebräische Metapher wird bewahrt, ohne sie auf eine einzige Deutung wie mangelnde Beredsamkeit oder ein Sprachhindernis festzulegen. Im Deutschen ist die Konstruktion mit »habe« natürlicher als »bin unbeschnitten an den Lippen«.
- source_word: וְאֵיךְ יִשְׁמַע אֵלַי פַּרְעֹה
  choice: Wie sollte da der Pharao auf mich hören?
  rationale: שמע אל bedeutet hier »auf jemanden hören« im Sinn von Gehör schenken bzw. Folge leisten. »Da« bildet den folgernden Zusammenhang mit Moses vorausgehender Selbstaussage ab; »sollte« gibt den rhetorischen Zweifel idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: »der HERR« folgt der etablierten deutschsprachigen Bibelkonvention und der vorgegebenen redaktionellen Ausrichtung, ohne den Gottesnamen mit einem gewöhnlichen Herrschaftstitel gleichzusetzen.
- issue: Deutung von »unbeschnittene Lippen«
  choice: Metapher im Haupttext bewahren
  alternative: »ich bin kein guter Redner« oder »ich kann nur schwer sprechen«
  rationale: Der hebräische Ausdruck ist bildhaft und mehrdeutig. Eine erklärende Paraphrase würde die mögliche Bedeutung vorschnell festlegen und die Verbindung von »Unbeschnittenheit« mit Untauglichkeit oder Behinderung verdecken.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst bewahrter hebräischer Metapher. Die direkte Rede klingt eindringlich, aber nicht altertümlich; »Pharao« erhält im Deutschen idiomatisch den bestimmten Artikel.
