base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/018.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel. And the years of Kohath’s life were one hundred thirty-three years.'
translation:
  language: de
  text: Die Söhne Kehats waren Amram, Jizhar, Hebron und Usiël. Kehat wurde 133 Jahre alt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְהָת
  choice: Die Söhne Kehats
  rationale: בְּנֵי bezeichnet hier die unmittelbar genannten Söhne. Die einleitende Konjunktion וּ wird im Deutschen nicht eigens wiedergegeben, da der Satz als neuer genealogischer Eintrag natürlich anschließt.
- source_word: עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִּיאֵל
  choice: Amram, Jizhar, Hebron und Usiël
  rationale: Die Eigennamen werden nach geläufigen deutschen Bibelnamensformen wiedergegeben; die hebräischen Konjunktionen erscheinen idiomatisch als Aufzählung mit abschließendem „und“.
- source_word: וּשְׁנֵי חַיֵּי קְהָת
  choice: Kehat wurde … Jahre alt
  rationale: Die hebräische Wendung „die Jahre des Lebens Kehats“ bezeichnet sein Lebensalter. Die gewählte deutsche Form ist natürlich, präzise und bewahrt den genealogischen Aussagegehalt.
- source_word: שָׁלֹשׁ וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 133 Jahre
  rationale: Die hebräische Zahlenfolge „drei und dreißig und hundert“ wird entsprechend der üblichen deutschen Zahlenordnung als 133 wiedergegeben; das im Hebräischen grammatisch übliche singularische שָׁנָה wird im Deutschen als Plural „Jahre“ übersetzt.
