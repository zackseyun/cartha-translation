    issue: »zur Arbeit gezwungen«
    rationale: Die Formulierung benennt zwar Zwang, lässt aber die spezifische Schwere des erzwungenen Dienstes eher allgemein. »zur Zwangsarbeit gezwungen« entspricht dem Kontext und der kausativen Verbform genauer.
  - severity: low
    issue: »an meinen Bund gedacht«
    rationale: Dies ist möglich, aber im Deutschen weniger unmittelbar als die übliche Wiedergabe des Erinnerungsmotivs. »mich an meinen Bund erinnert« wahrt das Idiom und lässt die erklärende Fußnote ihre Funktion erfüllen.
