source:
  edition: WLC
  text: וְ/גַ֣ם אֲנִ֣י שָׁמַ֗עְתִּי אֶֽת נַאֲקַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מִצְרַ֖יִם מַעֲבִדִ֣ים אֹתָ֑/ם וָ/אֶזְכֹּ֖ר אֶת בְּרִיתִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/005.yaml
  text: And I also have heard the groaning of the sons of Israel[a], whom the Egyptians are enslaving[b], and I have remembered my covenant.
translation:
  language: de
  text: Auch ich habe das Stöhnen der Israeliten[a] gehört, die von den Ägyptern zur Zwangsarbeit gezwungen werden, und ich habe mich an meinen Bund erinnert.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Söhne Israels«; gemeint ist das Volk Israel insgesamt.'
    reason: lexical_alternative
  - marker: b
    text: Dass Gott sich an seinen Bund »erinnert«, bedeutet hier nicht, dass er ihn vergessen hatte, sondern dass er sich ihm nun handelnd zuwendet.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Auch ich
  rationale: Bewahrt die additive Verknüpfung und die Betonung des ausdrücklich gesetzten göttlichen Pronomens in natürlichem Deutsch.
- source_word: שָׁמַעְתִּי
  choice: habe ... gehört
  rationale: Das Perfekt gibt den abgeschlossenen Vorgang mit fortdauernder Bedeutung im gegenwärtigen Redekontext wieder.
- source_word: נַאֲקַת
  choice: das Stöhnen
  rationale: Bezeichnet den leidvollen Laut beziehungsweise Klageruf unter Bedrückung und ist im modernen Deutsch klar und würdig.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung lautet wörtlich »Söhne Israels«, bezeichnet hier jedoch das Volk als Ganzes; »Israeliten« gibt diese kollektive Bedeutung natürlich und geschlechtsübergreifend wieder.
- source_word: מִצְרַיִם מַעֲבִדִים אֹתָם
  choice: die von den Ägyptern zur Arbeit gezwungen werden
  rationale: Das Hifil von עבד bezeichnet hier das erzwungene Dienen. Die Formulierung bewahrt den Arbeitsaspekt und macht den Zwang deutlich, ohne über den Wortlaut hinauszugehen.
- source_word: וָאֶזְכֹּר
  choice: und ich habe ... gedacht
  rationale: Die idiomatische Wendung »an meinen Bund gedacht« bewahrt das hebräische Erinnerungsmotiv; die Fußnote erklärt dessen handlungsbezogene Bundesbedeutung.
- source_word: בְּרִיתִי
  choice: meinen Bund
  rationale: »Bund« ist die etablierte und sachlich genaue Wiedergabe von בְּרִית in diesem theologischen Zusammenhang.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels / das Volk Israel
  rationale: Die Wendung ist formal maskulin, meint hier aber korporativ das ganze Bundesvolk. Die idiomatische Wiedergabe vermeidet den falschen Eindruck, nur Männer seien gemeint; die wörtliche Form bleibt in einer Fußnote sichtbar.
- issue: Bedeutung des göttlichen Erinnerns
  choice: ich habe an meinen Bund gedacht
  alternative: ich habe mich meines Bundes erinnert / ich bin meines Bundes eingedenk gewesen
  rationale: Die Übersetzung erhält die biblische Aussage des Erinnerns, ohne sie als bloßes Vergessen und Wiedererinnern zu deuten oder bereits paraphrasierend in »danach handeln« aufzulösen. Die Bundes- und Handlungsdimension wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt eng am Hebräischen, während »Israeliten« und »zur Arbeit gezwungen« natürliche deutsche Formulierungen bieten.
