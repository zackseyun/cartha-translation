id: EXO.6.11
reference: Exodus 6:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֹּ֣א דַבֵּ֔ר אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וִֽ/ישַׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/011.yaml
  text: Go[a], speak to Pharaoh king of Egypt, that he may let the sons of Israel go out from his land.
translation:
  language: de
  text: Geh zum Pharao, dem König von Ägypten, und sag ihm, er soll die Söhne Israels[a] aus seinem Land ziehen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“ oder „die Kinder Israels“. Wörtlich steht im Hebräischen „die Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּא
  choice: Geh
  rationale: Der Imperativ von בוא kann je nach Perspektive „komm“ oder „geh“ bedeuten. Da Mose zum Pharao geschickt wird, ist „Geh“ im Deutschen kontextgerecht.
- source_word: דַבֵּר אֶל
  choice: sag ihm
  rationale: Wörtlich steht „rede zu“. Im Deutschen gibt „sag ihm“ die Anweisung natürlich wieder und ermöglicht es, den folgenden Inhalt als indirekte Aufforderung anzuschließen.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: zum Pharao, dem König von Ägypten
  rationale: Die Apposition wird mit dem im Deutschen erforderlichen Artikel und der passenden Kasusangleichung wiedergegeben.
- source_word: וִישַׁלַּח
  choice: er soll … ziehen lassen
  rationale: Die Verbform nach den Imperativen bezeichnet hier den Inhalt beziehungsweise das Ziel von Moses Rede. „Er soll … ziehen lassen“ gibt die an den Pharao gerichtete Forderung klar wieder, ohne sie als bloße Vorhersage zu verstehen.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Dies bewahrt die wörtliche familiäre Ausdrucksweise des Hebräischen; die kontextuell natürliche Alternative „die Israeliten“ wird in der Fußnote genannt.
- source_word: מֵאַרְצוֹ
  choice: aus seinem Land
  rationale: אֶרֶץ bezeichnet hier das Herrschaftsgebiet des Pharaos. „Aus seinem Land“ verbindet sich idiomatisch mit „ziehen lassen“.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten; die Kinder Israels
  rationale: Die Hauptfassung erhält die ausdrücklich familiäre und grammatisch maskuline Form des Hebräischen. Die Alternativen sind kontextuell möglich, würden die Formulierung jedoch stärker angleichen.
- issue: Modalität von וִישַׁלַּח
  choice: er soll … ziehen lassen
  alternative: damit er … ziehen lässt; und er wird … fortschicken
  rationale: Im Zusammenhang bezeichnet die Form am plausibelsten den Inhalt der Botschaft an den Pharao. Die Übersetzung wahrt den Aufforderungscharakter, statt eine sichere Vorhersage daraus zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Geh“ und „sag ihm“ sind klar und gegenwärtig; „ziehen lassen“ entspricht dem etablierten Exodus-Kontext, ohne altertümlich zu wirken.
