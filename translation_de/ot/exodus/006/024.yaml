base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/024.yaml
  text: 'The sons of Korah: Assir[a], Elkanah, and Abiasaph. These are the clans of the Korahites.'
translation:
  language: de
  text: 'Die Söhne Korachs: Assir, Elkana und Abiasaf. Das sind die Familienverbände[a] der Korachiter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Sippen“ oder „Großfamilien“. Das hebräische Wort bezeichnet hier verwandtschaftliche Untergruppen innerhalb eines Stammes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי קֹרַח
  choice: Die Söhne Korachs
  rationale: בְּנֵי bezeichnet hier in einer unmittelbaren genealogischen Aufzählung die Söhne. Die hebräische Genitivverbindung wird im Deutschen natürlich mit dem Genitiv wiedergegeben; das einleitende וּ muss in diesem selbstständig zitierten Vers nicht eigens mit „und“ wiedergegeben werden.
- source_word: אַסִּיר
  choice: Assir
  rationale: Der Kontext weist die Form als Personennamen aus; sie wird nach gebräuchlicher deutscher Namenstradition transliteriert.
- source_word: וְאֶלְקָנָה
  choice: Elkana
  rationale: Personenname in gebräuchlicher deutscher Form; die Konjunktion wird durch die deutsche Aufzählung berücksichtigt.
- source_word: וַאֲבִיאָסָף
  choice: Abiasaf
  rationale: Personenname in gebräuchlicher deutscher Transliteration; die Konjunktion erscheint als „und“ vor dem letzten Glied der Aufzählung.
- source_word: אֵלֶּה
  choice: Das sind
  rationale: Das Demonstrativpronomen leitet einen identifizierenden Nominalsatz ein. „Das sind“ ist im modernen Deutsch idiomatisch und bezieht sich auf die zuvor genannten Personen beziehungsweise ihre Linien.
- source_word: מִשְׁפְּחֹת
  choice: Familienverbände
  rationale: Das Wort bezeichnet im genealogisch-stammesbezogenen Zusammenhang größere verwandtschaftliche Einheiten. „Familienverbände“ ist präziser als das möglicherweise zu eng verstandene „Familien“ und neutraler als „Sippen“.
- source_word: הַקָּרְחִי
  choice: der Korachiter
  rationale: Die gentilizische Form bezeichnet die Angehörigen beziehungsweise Nachkommen der Linie Korachs; „Korachiter“ ist die knappe, übliche deutsche Gruppenbezeichnung.
