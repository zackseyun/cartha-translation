  text: וַ/יְדַבֵּ֥ר מֹשֶׁ֛ה כֵּ֖ן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֤א שָֽׁמְעוּ֙ אֶל מֹשֶׁ֔ה מִ/קֹּ֣צֶר ר֔וּחַ וּ/מֵ/עֲבֹדָ֖ה קָשָֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/009.yaml
  text: So Moses spoke thus to the sons of Israel[b][a], but they did not listen to Moses because of discouragement and harsh slavery.
translation:
  language: de
  text: So sprach Mose zu den Israeliten. Sie aber hörten nicht auf Mose wegen ihrer Mutlosigkeit[a] und wegen der harten Zwangsarbeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wegen der Kürze des Geistes“. Die Wendung kann Mutlosigkeit, innere Bedrängnis oder einen gebrochenen Mut bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „wegen harter Arbeit“. Im Zusammenhang kann die Zwangsarbeit als Sklaverei verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berichtete
  rationale: דבר im Piel bezeichnet das Sprechen; im Kontext übermittelt Mose den zuvor empfangenen Gotteswortlaut. „Berichtete dies“ ist im modernen Deutschen natürlich und wahrt den Rückbezug.
- source_word: כֵּן
  choice: dies
  rationale: כֵּן verweist hier auf die vorangehende Botschaft. „Dies“ gibt diesen Rückbezug idiomatisch wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die feste hebräische Volksbezeichnung meint hier die Angehörigen Israels insgesamt. „Israeliten“ ist präzise, natürlich und vermeidet im Deutschen die mögliche Fehlannahme, nur männliche Nachkommen seien angesprochen.
- source_word: שָׁמְעוּ אֶל
  choice: hörten nicht auf
  rationale: Die Verbindung שמע אל bedeutet, jemandem zuzuhören beziehungsweise auf ihn zu hören. „Nicht auf Mose hören“ bewahrt sowohl das Hören als auch den Sinn des Nichtbeachtens.
- source_word: מִקֹּצֶר רוּחַ
  choice: weil sie mutlos waren
  rationale: Wörtlich ist von „Kürze des Geistes/Atems“ die Rede; gemeint ist innere Bedrängnis, Niedergeschlagenheit oder ein gebrochener Mut. „Mutlos“ ist verständlich, ohne die Wendung auf bloße Ungeduld festzulegen.
- source_word: וּמֵעֲבֹדָה קָשָׁה
  choice: und unter harter Zwangsarbeit litten
  rationale: עֲבֹדָה bezeichnet Arbeit oder Dienst; im ägyptischen Kontext ist erzwungene, bedrückende Arbeit gemeint. „Harte Zwangsarbeit“ macht diesen Kontext deutlich, ohne das Substantiv unmittelbar mit „Sklaverei“ gleichzusetzen.
theological_decisions:
- issue: Reichweite der Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die Wendung ist eine kollektive Volksbezeichnung. Die idiomatische Wiedergabe umfasst das angesprochene Volk und importiert keine unnötige Beschränkung auf Männer.
- issue: Charakter von עֲבֹדָה קָשָׁה
  choice: harte Zwangsarbeit
  alternative: harte Sklaverei
  rationale: Der Exoduskontext ist der einer Versklavung, doch das konkrete hebräische Nomen bezeichnet hier Arbeit beziehungsweise Dienst. Die gewählte Formulierung hält den Zwangscharakter fest und bleibt lexikalisch näher am Ausdruck.
- issue: Deutung von קֹצֶר רוּחַ
  choice: mutlos
  alternative: kurzatmig; ungeduldig; gebrochenen Geistes
  rationale: Die knappe hebräische Wendung erlaubt körperliche und seelische Konnotationen. Im Zusammenhang erklärt sie ihre fehlende Aufnahmefähigkeit; „mutlos“ gibt den naheliegenden seelischen Sinn wieder, während die Fußnote die Bildlichkeit und Mehrdeutigkeit erhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit. „Berichtete dies“ stellt den Rückbezug auf die zuvor übermittelte Gottesbotschaft her; die Fußnoten bewahren die Bildhaftigkeit und die lexikalischen Alternativen des Hebräischen.
