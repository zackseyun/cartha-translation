  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ וַ/יְצַוֵּ/ם֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם לְ/הוֹצִ֥יא אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/013.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], and he commanded them concerning the sons of Israel and concerning Pharaoh king of Egypt[b], to bring the sons of Israel out from the land of Egypt.
translation:
  language: de
  text: Da redete Jahwe zu Mose und Aaron. Er gab ihnen Weisung im Blick auf die Israeliten und auf den Pharao, den König von Ägypten,[a] die Israeliten aus dem Land Ägypten herauszuführen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er gebot ihnen, zu den Israeliten und zum Pharao, dem König von Ägypten, die Israeliten aus dem Land Ägypten herauszuführen.“ Das Hebräische kann die Israeliten und den Pharao entweder als Adressaten oder als Gegenstand der Mose und Aaron erteilten Weisung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da redete
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da“ gibt diese zeitlich-fortschreitende Funktion in gehobenem, aber verständlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: zu Mose und Aaron
  rationale: אֶל bezeichnet bei דבר die Angeredeten; „zu“ ist hier die natürliche deutsche Fügung.
- source_word: וַיְצַוֵּם
  choice: Er gab ihnen Weisung
  rationale: צוה bezeichnet eine autoritative Anordnung. „Weisung geben“ wahrt diese Verbindlichkeit und lässt sich mit den folgenden אֶל-Phrasen natürlich verbinden.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל וְאֶל פַּרְעֹה
  choice: im Blick auf die Israeliten und auf den Pharao
  rationale: Die Präposition אֶל kann hier entweder Adressaten oder den Gegenstand der Weisung markieren. Im Zusammenhang sind Mose und Aaron die unmittelbar Beauftragten; die gewählte Formulierung gibt daher die wahrscheinliche Bezugssphäre wieder, während die Alternative in der Fußnote erhalten bleibt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste hebräische Volksbezeichnung bedeutet idiomatisch „die Israeliten“. Diese Wiedergabe ist im modernen Deutsch natürlicher als das missverständliche „Söhne Israels“ und schließt das gesamte Volk ein.
- source_word: לְהוֹצִיא
  choice: herauszuführen
  rationale: Der Hifil-Infinitiv von יצא ist kausativ. „Herausführen“ gibt sowohl das Veranlassen des Auszugs als auch die leitende Rolle von Mose und Aaron prägnant wieder.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Die Wiedergabe behält das ausdrücklich genannte אֶרֶץ („Land“) und die räumliche Ausgangsrichtung bei.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug der mit אֶל eingeleiteten Glieder nach וַיְצַוֵּם
  choice: Die Weisung betrifft Israel und den Pharao
  alternative: Israel und der Pharao sind die unmittelbaren Empfänger des Befehls
  rationale: Grammatisch ist beides möglich. Da das Suffix „ihnen“ Mose und Aaron als Beauftragte bezeichnet und der folgende Infinitiv ihre Aufgabe nennt, passt die Bezugsauslegung gut zum Kontext; die echte syntaktische Mehrdeutigkeit wird in der Fußnote ausdrücklich bewahrt.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung ist hier eine nationale Sammelbezeichnung für das Volk, nicht nur für männliche Nachkommen. „Israeliten“ gibt ihren gemeinten Umfang im Deutschen genau und idiomatisch wieder.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, erzählerischem Ton. „Da redete“ wahrt den biblischen Erzählfluss, ohne altertümliche Verbformen zu verwenden. Die Satzteilung verhindert eine schwer verständliche Kette von Koordinationen; die Fußnote bewahrt die syntaktische Mehrdeutigkeit des Hebräischen.
