  text: לָ/כֵ֞ן אֱמֹ֥ר לִ/בְנֵֽי יִשְׂרָאֵ֘ל אֲנִ֣י יְהוָה֒ וְ/הוֹצֵאתִ֣י אֶתְ/כֶ֗ם מִ/תַּ֨חַת֙ סִבְלֹ֣ת מִצְרַ֔יִם וְ/הִצַּלְתִּ֥י אֶתְ/כֶ֖ם מֵ/עֲבֹדָתָ֑/ם וְ/גָאַלְתִּ֤י אֶתְ/כֶם֙ בִּ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בִ/שְׁפָטִ֖ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/006.yaml
  text: Therefore say to the sons of Israel[a], ‘I am Yahweh, and I will bring you out from under the burdens of Egypt, and I will deliver you from their slavery[d][c][b], and I will redeem you with an outstretched arm and with great judgments.’
translation:
  language: de
  text: 'Darum sage zu den Israeliten: »Ich bin Jahwe. Ich werde euch von unter den Lasten Ägyptens herausführen, euch aus ihrer Sklaverei befreien und euch mit ausgestrecktem Arm und durch große Gerichtstaten erlösen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch große Gerichte«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet knapp und natürlich die Folgerung aus der vorausgehenden Gottesrede.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: zu den Israeliten
  rationale: Gibt die Bezeichnung des Volkes im modernen Deutschen natürlich wieder; die wörtliche Form „Söhne Israels“ könnte missverständlich nur männliche Personen bezeichnen.
- source_word: אֲנִי יְהוָה
  choice: Ich bin Jahwe
  rationale: Bewahrt die unmittelbare Selbstvorstellung und gibt den Gottesnamen als Eigennamen wieder.
- source_word: מִתַּחַת סִבְלֹת מִצְרַיִם
  choice: unter den Lasten der Ägypter hervor
  rationale: Erhält das räumliche Bild „unter den Lasten“ und versteht „Ägypten“ entsprechend dem Kontext als die Ägypter beziehungsweise die ägyptische Herrschaft.
- source_word: וְהִצַּלְתִּי אֶתְכֶם מֵעֲבֹדָתָם
  choice: euch aus ihrer Sklavenarbeit befreien
  rationale: עֲבֹדָה kann Arbeit, Dienst oder Frondienst bezeichnen; „Sklavenarbeit“ macht hier sowohl die Tätigkeit als auch ihren erzwungenen Charakter deutlich.
- source_word: וְגָאַלְתִּי
  choice: erlösen
  rationale: Bewahrt die rechtlich-soziale Bedeutung des Loskaufens beziehungsweise Zurückforderns und zugleich die theologische Tragweite des Verbs.
- source_word: בִּזְרוֹעַ נְטוּיָה
  choice: mit ausgestrecktem Arm
  rationale: Gibt das feste hebräische Bild für Gottes machtvolles Eingreifen unverändert wieder.
- source_word: וּבִשְׁפָטִים גְּדֹלִים
  choice: durch große Gerichte
  rationale: „Gerichte“ bewahrt den richterlichen Charakter von שְׁפָטִים; „durch“ bezeichnet die Gerichtstaten als Mittel der Erlösung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen ausdrücklich; „Jahwe“ macht die Bundes-Selbstvorstellung transparent, ohne sie durch einen Titel zu ersetzen.
- issue: Reichweite von לִבְנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Gemeint ist das Bundesvolk insgesamt. Die natürliche deutsche Volksbezeichnung verhindert eine unbeabsichtigte Einschränkung auf männliche Israeliten.
- issue: Bedeutung von עֲבֹדָה im Unterdrückungskontext
  choice: Sklavenarbeit
  alternative: Dienst / Frondienst / Sklaverei
  rationale: Die Wahl lässt den Arbeitsaspekt des Substantivs und die konkrete Versklavung zugleich erkennen, ohne den Ausdruck auf einen rein abstrakten Zustand zu reduzieren.
- issue: Art der שְׁפָטִים
  choice: große Gerichte
  alternative: große Gerichtstaten
  rationale: Die knappe Form wahrt die Mehrdeutigkeit zwischen richterlichen Urteilen und deren geschichtlichem Vollzug; die Fußnote erläutert die mögliche aktivere Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bildet die vier göttlichen Zusagen klar ab. „Israeliten“ ist idiomatischer als „Söhne Israels“, während die Bilder „unter den Lasten“ und „mit ausgestrecktem Arm“ bewusst erhalten bleiben. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf den er sich bezieht.
