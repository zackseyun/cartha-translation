  naturalness: Die Revision formuliert die Befreiung „von unter den Lasten Ägyptens herausführen“ grammatisch klar und behält das hebräische Bild bei. „Große Gerichtstaten“ ist im modernen Deutschen verständlicher als „große Gerichte“, ohne die Bedeutung auf eine bestimmte historische Auslegung festzulegen.
  terminology: „Israeliten“, „Jahwe“, „Sklaverei“, „erlösen“ und „ausgestreckter Arm“ sind natürliche und quellentreue Wiedergaben. Die Fußnote wahrt die wörtlichere, aber im Deutschen mehrdeutige Alternative „große Gerichte“.
