- source_word: וּשְׁנֵי חַיֵּי לֵוִי
  choice: Levi wurde … Jahre alt
  rationale: Die idiomatische deutsche Wiedergabe vermittelt präzise die Lebensdauer, ohne die schwerfällige hebräische Nominalkonstruktion nachzuahmen.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 137 Jahre
  rationale: Die Zahl entspricht wörtlich einhundertsiebenunddreißig; Ziffern sind in genealogischen Altersangaben klar und modern.
