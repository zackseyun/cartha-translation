  text: הֵ֗ם הַֽ/מְדַבְּרִים֙ אֶל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/הוֹצִ֥יא אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם ה֥וּא מֹשֶׁ֖ה וְ/אַהֲרֹֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/027.yaml
  text: These are the ones who spoke to Pharaoh king of Egypt to bring the sons of Israel out of Egypt—this is Moses and Aaron[a][b].
translation:
  language: de
  text: Sie sind es, die zum Pharao, dem König von Ägypten, redeten, um die Söhne Israels aus Ägypten herauszuführen. Das sind Mose und Aaron.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sie sind die zum Pharao Redenden.“ Das Hebräische verwendet ein Partizip, das Mose und Aaron durch diese Tätigkeit kennzeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם
  choice: Sie sind es
  rationale: Das selbstständige Pronomen identifiziert die zuvor genannten Männer nachdrücklich und rückbezüglich; „Sie sind es“ gibt dies im Deutschen natürlich wieder.
- source_word: הַמְדַבְּרִים
  choice: die … redeten
  rationale: Das substantivierte Partizip charakterisiert Mose und Aaron durch ihr Reden mit dem Pharao. Der Relativsatz ist im Deutschen idiomatisch; eine Fußnote weist auf den partizipialen Charakter hin.
- source_word: אֶל
  choice: mit
  rationale: Bei „reden“ ist „mit jemandem reden“ im heutigen Deutsch natürlich; die in אֶל liegende Ausrichtung auf den Adressaten bleibt aus dem Zusammenhang klar.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: dem Pharao, dem König von Ägypten
  rationale: Die Apposition wird durch Kommas kenntlich gemacht und der Königstitel eng am Hebräischen wiedergegeben.
- source_word: לְהוֹצִיא
  choice: um … herauszuführen
  rationale: Der Hifil-Infinitiv von יצא bezeichnet das Veranlassen des Herausgehens. „Herausführen“ bewahrt den kausativen Sinn und passt zum Exoduszusammenhang.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Wiedergabe bildet den hebräischen Ausdruck formal transparent und geschlechtsspezifisch ab, statt ihn verallgemeinernd mit „Kinder“ oder idiomatisierend mit „Israeliten“ wiederzugeben.
- source_word: מִמִּצְרָיִם
  choice: aus Ägypten
  rationale: Zusammen mit „herausführen“ entspricht „aus Ägypten“ dem räumlichen Ausgangspunkt und dem Exodusmotiv.
- source_word: הוּא
  choice: eben
  rationale: Das formal singularische Pronomen nimmt die bereits identifizierte Personengruppe resumptiv auf. „Eben“ vermeidet im Deutschen die ungrammatische Singularform „das ist Mose und Aaron“ und bewahrt die nachdrückliche Wiederidentifikation.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Mose und Aaron
  rationale: Die im modernen deutschen Bibelgebrauch üblichen Namensformen werden beibehalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Wiederaufnahme des genealogischen Rückblicks bleibt erhalten; der Gedankenstrich markiert die abschließende Identifikation. „Söhne Israels“ wahrt die formale Gestalt des hebräischen Ausdrucks.
