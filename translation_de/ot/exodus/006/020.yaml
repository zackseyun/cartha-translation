source:
  edition: WLC
  text: וַ/יִּקַּ֨ח עַמְרָ֜ם אֶת יוֹכֶ֤בֶד דֹּֽדָת/וֹ֙ ל֣/וֹ לְ/אִשָּׁ֔ה וַ/תֵּ֣לֶד ל֔/וֹ אֶֽת אַהֲרֹ֖ן וְ/אֶת מֹשֶׁ֑ה וּ/שְׁנֵי֙ חַיֵּ֣י עַמְרָ֔ם שֶׁ֧בַע וּ/שְׁלֹשִׁ֛ים וּ/מְאַ֖ת שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/020.yaml
  text: Amram took Jochebed[a], his father’s sister, as his wife, and she bore to him Aaron and Moses. The years of Amram’s life were 137 years.
translation:
  language: de
  text: Amram nahm Jochebed, seine Tante,[a] zur Frau. Sie gebar ihm Aaron und Mose. Amram wurde 137 Jahre alt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder genauer: seines Vaters Schwester, wenn die Verwandtschaftsbezeichnung im engeren Sinn verstanden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Das Verb לקח bedeutet wörtlich „nehmen“; zusammen mit „zur Frau“ gibt „nahm … zur Frau“ die hebräische Heiratsformel natürlich und würdevoll wieder.
- source_word: דֹּדָתוֹ
  choice: seine Tante
  rationale: Die feminine Verwandtschaftsbezeichnung bezeichnet hier eine Tante. Die knappe Wiedergabe bewahrt den im Vers selbst nicht näher bestimmten Verwandtschaftsgrad; die engere Deutung wird in der Fußnote genannt.
- source_word: לְאִשָּׁה
  choice: zur Frau
  rationale: Die deutsche Wendung bezeichnet eindeutig die Eheschließung und entspricht der Funktion der hebräischen Präpositionalphrase.
- source_word: וַתֵּלֶד לוֹ
  choice: Sie gebar ihm
  rationale: „Gebar ihm“ spiegelt Verb und indirektes Objekt des Hebräischen und passt zum genealogischen Register.
- source_word: שְׁנֵי חַיֵּי עַמְרָם
  choice: Amram wurde … Jahre alt
  rationale: Die idiomatische deutsche Lebensaltersformel gibt die Aussage des hebräischen Ausdrucks klar wieder, ohne schwerfällige Nachbildung.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 137 Jahre
  rationale: Die moderne Ziffernschreibung bewahrt den Zahlenwert exakt und ist unmittelbar verständlich.
- source_word: יוֹכֶבֶד / אַהֲרֹן / מֹשֶׁה / עַמְרָם
  choice: Jochebed / Aaron / Mose / Amram
  rationale: Die Eigennamen folgen den im modernen deutschen Bibelgebrauch etablierten Formen.
theological_decisions:
- issue: Bezeichnung der nahen Verwandtschaft bei einer Ehe, die nach späterem Tora-Recht verboten ist
  choice: seine Tante
  alternative: seines Vaters Schwester
  rationale: Der Vers berichtet die genealogische Beziehung ohne ausdrückliche moralische Wertung. „Seine Tante“ gibt den hebräischen Verwandtschaftsausdruck wieder, ohne ihn im Haupttext enger festzulegen; die mögliche spezifische Deutung bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem genealogischem Ton. Die traditionelle Wendung „nahm … zur Frau“ bewahrt den hebräischen Duktus; die abschließende Altersangabe ist idiomatisch formuliert.
