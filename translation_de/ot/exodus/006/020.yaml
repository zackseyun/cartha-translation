  verdict: approve
  source_fidelity: Der Text gibt die hebräische Heiratsformel וַיִּקַּח ... לוֹ לְאִשָּׁה treffend mit „nahm ... zur Frau“ wieder. „seine Tante“ ist für דֹּדָתוֹ eine angemessene, nicht überpräzisierende Wiedergabe; die mögliche engere Bestimmung als Schwester seines Vaters wird sachgerecht in der Fußnote kenntlich gemacht. „Sie gebar ihm Aaron und Mose“ bewahrt die Beziehung von וַתֵּלֶד לוֹ, und die Altersangabe gibt 137 Jahre korrekt wieder.
  naturalness: Modernes Standarddeutsch, klar und zugleich dem genealogischen Register angemessen. Die Aufteilung in zwei Sätze nach der Heiratsformel ist natürlich und verändert die Aussage nicht. „Amram wurde 137 Jahre alt“ ist eine idiomatische deutsche Entsprechung für die hebräische Lebensaltersformel.
  terminology: Die Namensformen Amram, Jochebed, Aaron und Mose entsprechen dem etablierten deutschen Bibelgebrauch. Die Verwandtschaftsbezeichnung und die Fußnote bewahren die lexikalische Offenheit, ohne eine dogmatische oder moralische Deutung einzutragen.
