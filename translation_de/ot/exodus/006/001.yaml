  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַתָּ֣ה תִרְאֶ֔ה אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה לְ/פַרְעֹ֑ה כִּ֣י בְ/יָ֤ד חֲזָקָה֙ יְשַׁלְּחֵ֔/ם וּ/בְ/יָ֣ד חֲזָקָ֔ה יְגָרְשֵׁ֖/ם מֵ/אַרְצֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/001.yaml
  text: Then Yahweh said to Moses[a], “Now you will see what I will do to Pharaoh, for by a strong hand he will let them go, and by a strong hand he will drive them out from his land.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Jetzt wirst du sehen, was ich dem Pharao antun werde. Denn mit starker Hand wird er sie ziehen lassen, und mit starker Hand[a] wird er sie aus seinem Land vertreiben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn unter starkem Zwang wird er sie ziehen lassen, und unter starkem Zwang wird er sie aus seinem Land vertreiben.“ Die zweimalige Wendung „mit starker Hand“ kann bedeuten, dass der Pharao unter dem überwältigenden Druck göttlicher Macht handelt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Die Form führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche wissenschaftliche Umschrift bewahrt den offenbarten Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: עַתָּה תִרְאֶה
  choice: Jetzt wirst du sehen
  rationale: Bewahrt sowohl den zeitlich-emphatischen Akzent von עַתָּה als auch den Zukunftssinn von תִרְאֶה.
- source_word: אֲשֶׁר אֶעֱשֶׂה לְפַרְעֹה
  choice: was ich dem Pharao tun werde
  rationale: Idiomatiche deutsche Wiedergabe der Relativkonstruktion; der Dativ entspricht hier dem offenen Beziehungswert von לְ, ohne ausdrücklich „gegen“ einzutragen.
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der angekündigten göttlichen Handlung ein.
- source_word: בְיָד חֲזָקָה
  choice: durch eine starke Hand
  rationale: Bewahrt das zweimal gesetzte hebräische Bild und lässt offen, ob die Wendung vor allem das wirksame Machtmittel oder den daraus entstehenden Zwang bezeichnet.
- source_word: יְשַׁלְּחֵם
  choice: wird er sie ziehen lassen
  rationale: Im Exoduszusammenhang bezeichnet שׁלח die Freilassung Israels; „ziehen lassen“ ist im Deutschen natürlich und präzise.
- source_word: יְגָרְשֵׁם
  choice: wird er sie … vertreiben
  rationale: גרש ist stärker als bloßes Wegschicken und beschreibt eine nachdrückliche Ausweisung.
- source_word: מֵאַרְצוֹ
  choice: aus seinem Land
  rationale: „Land“ bewahrt die geographische und biblische Bedeutungsbreite von אֶרֶץ.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: „Jahwe“ bewahrt den persönlichen Gottesnamen in der im modernen Deutschen geläufigen Form, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug und Sinn von בְיָד חֲזָקָה
  choice: Das Bild „durch eine starke Hand“ wird im Haupttext beibehalten.
  alternative: „unter starkem Zwang“ beziehungsweise „durch eine mächtige Hand“
  rationale: Die Wendung steht bei den Handlungen des Pharaos, kann aber den überwältigenden Zwang durch Gottes Macht bezeichnen. Die bildhafte Wiedergabe wahrt diese Spannung, statt den Träger der Macht ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „durch eine starke Hand“ bildet den hebräischen Parallelismus bewusst ab; die etwas markante Bildsprache bleibt wegen ihrer inhaltlichen Mehrdeutigkeit erhalten.
