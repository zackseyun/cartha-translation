  terminology: „Jahwe“, „Mose“, „Pharao“ und „Land“ sind konsistent und für modernes, würdiges Standarddeutsch geeignet. Die Alternative „unter starkem Zwang“ erklärt die mögliche Zwangsbedeutung, ohne sie in den Haupttext einzutragen.
