  to: 'Da sagte Jahwe zu Mose: „Jetzt wirst du sehen, was ich dem Pharao antun werde. Denn mit starker Hand wird er sie ziehen lassen, und mit starker Hand[a] wird er sie aus seinem Land vertreiben.“'
  rationale: Die Revision beseitigt eine unidiomatische deutsche Verbverbindung und ersetzt die sperrige Präpositionalkonstruktion durch die natürliche deutsche Bildform „mit starker Hand“. Dabei bleiben der hebräische Parallelismus, die Wiederholung und die offene Zuordnung der starken Hand erhalten. Der Fußnotenanker wird an die erläuterte Wendung gesetzt.
