base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/007.yaml
  text: And I will take you to be my people[a], and I will be your God, and you will know that I am Yahweh your God[b], who brought you out from under the burdens of Egypt.
translation:
  language: de
  text: Und ich werde euch als mein Volk annehmen, und ich werde euer Gott sein. Ihr werdet erkennen, dass ich Jahwe, euer Gott, bin, der euch unter den Lasten Ägyptens herausführt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der euch unter der Fronarbeit Ägyptens herausgeführt hat“. Das Hebräische verwendet ein Partizip; es kann Jahwes fortdauerndes beziehungsweise für ihn kennzeichnendes Handeln oder die vollbrachte Befreiung als das ihn kennzeichnende Geschehen ausdrücken. „Lasten“ kann hier auch die auferlegte Fronarbeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי אֶתְכֶם לִי לְעָם
  choice: ich werde euch als mein Volk annehmen
  rationale: Das futurisch gebrauchte Qal-Perfekt in der Verheißungsfolge und die doppelte ל-Konstruktion bezeichnen Gottes Annahme Israels als das ihm zugehörige Volk. „Annehmen“ gibt dies im Deutschen natürlicher wieder als das wörtliche „nehmen“, ohne den Bundesbezug auszudeuten.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: ich werde euer Gott sein
  rationale: Die natürliche deutsche Wiedergabe der Bundesformel bewahrt ihren relationalen Sinn.
- source_word: וִידַעְתֶּם
  choice: dann werdet ihr erkennen
  rationale: ידע meint hier nicht nur sachliches Wissen, sondern das durch Gottes Rettung vermittelte Erkennen seiner Identität. „Dann“ macht den im Zusammenhang erkennbaren Folgebezug deutlich, ohne einen zusätzlichen theologischen Inhalt einzuführen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַמּוֹצִיא
  choice: der euch … hervorführt
  rationale: Das hebräische Partizip stellt Jahwe als den handelnden Befreier dar. Das deutsche Präsens wahrt diese aspektuelle Offenheit besser als ein ausschließlich vergangenheitsbezogenes Verb.
- source_word: מִתַּחַת סִבְלֹת מִצְרָיִם
  choice: unter den Lasten Ägyptens hervor
  rationale: Die Formulierung bewahrt das räumliche Bild von מִתַּחַת und die breite Bedeutung von סִבְלֹת als Lasten beziehungsweise bedrückende Fronarbeit.
theological_decisions:
- issue: Wiedergabe der Bundesformel
  choice: ich werde euch als mein Volk annehmen, und ich werde euer Gott sein
  alternative: ich werde euch mir zum Volk nehmen, und ich werde euch Gott sein
  rationale: Die gewählte Form ist modernes, würdevolles Deutsch und erhält Zugehörigkeit und wechselseitige Bundesbeziehung, ohne spätere systematische Kategorien einzutragen.
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה; seine Wiedergabe als „Jahwe“ bewahrt diese Unterscheidung gegenüber dem Titel „Herr“.
- issue: Zeitbezug des Partizips הַמּוֹצִיא
  choice: der euch … hervorführt
  alternative: der euch … herausgeführt hat
  rationale: Das Partizip kann ein gegenwärtiges, charakteristisches oder aus der zukünftigen Perspektive bereits vollendetes Befreiungshandeln bezeichnen. Der Haupttext wahrt die participiale Darstellung; die Fußnote nennt die kontextuell mögliche Vergangenheitsform.
translation_notes:
  register: Modernes Standarddeutsch in würdevollem, gut verständlichem Erzählstil. Die Satzteilung vermeidet eine schwerfällige Reihung. „Jahwe“ steht als persönlicher Gottesname; „Lasten“ hält das konkrete Bild und den Bezug auf bedrückende Arbeit offen.
