  text: וַ/יִּקַּ֨ח אַהֲרֹ֜ן אֶת אֱלִישֶׁ֧בַע בַּת עַמִּינָדָ֛ב אֲח֥וֹת נַחְשׁ֖וֹן ל֣/וֹ לְ/אִשָּׁ֑ה וַ/תֵּ֣לֶד ל֗/וֹ אֶת נָדָב֙ וְ/אֶת אֲבִיה֔וּא אֶת אֶלְעָזָ֖ר וְ/אֶת אִֽיתָמָֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/023.yaml
  text: Aaron took Elisheba, the daughter of Amminadab and sister of Nahshon, as his wife, and she bore him Nadab, Abihu, Eleazar, and Ithamar.
translation:
  language: de
  text: Aaron nahm Elischeba, die Tochter Amminadabs und Schwester Nachschons, zur Frau. Sie gebar ihm Nadab, Abihu, Eleasar und Itamar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Das Verb לקח bedeutet wörtlich „nehmen“ und bezeichnet zusammen mit „zur Frau“ eindeutig die Eheschließung, ohne die hebräische Ausdrucksweise unnötig zu glätten.
- source_word: אֱלִישֶׁבַע
  choice: Elischeba
  rationale: Der Personenname wird in einer im Deutschen geläufigen, dem Hebräischen nahen Form wiedergegeben.
- source_word: בַּת עַמִּינָדָב
  choice: die Tochter Amminadabs
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet unmittelbar die Abstammung; der deutsche Genitiv ist knapp und natürlich.
- source_word: אֲחוֹת נַחְשׁוֹן
  choice: Schwester Nachschons
  rationale: Die Verbindung benennt eindeutig Elischebas Geschwisterverhältnis zu Nachschon; der deutsche Genitiv entspricht der knappen hebräischen Form.
- source_word: לוֹ לְאִשָּׁה
  choice: zur Frau
  rationale: Dies ist eine natürliche deutsche Wiedergabe der üblichen hebräischen Eheformel und macht den ehelichen Sinn von „nahm“ ausdrücklich.
- source_word: וַתֵּלֶד לוֹ
  choice: Sie gebar ihm
  rationale: ילד mit persönlichem indirektem Objekt wird im Deutschen treffend mit „jemandem gebären“ wiedergegeben; der neue Satz vermeidet eine schwerfällige Reihung.
- source_word: נָדָב
  choice: Nadab
  rationale: Konventionelle deutsche Transliteration des Eigennamens.
- source_word: אֲבִיהוּא
  choice: Abihu
  rationale: Konventionelle deutsche Transliteration des Eigennamens.
- source_word: אֶלְעָזָר
  choice: Eleasar
  rationale: Im Deutschen gebräuchliche, dem hebräischen Namen entsprechende Form.
- source_word: אִיתָמָר
  choice: Itamar
  rationale: Dem Hebräischen nahe und im modernen Deutschen gut lesbare Transliteration.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle biblische Eheformel „zur Frau nehmen“ bleibt erhalten, ist aber weiterhin allgemein verständlich. Die Aufteilung in zwei Sätze verbessert die Lesbarkeit, ohne einen inhaltlichen Zusammenhang zu verändern.
