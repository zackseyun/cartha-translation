base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/008.yaml
  text: And I will bring you into the land that I swore to give to Abraham[a], to Isaac, and to Jacob, and I will give it to you as a possession. I am Yahweh.
translation:
  language: de
  text: Und ich werde euch in das Land bringen, das ich Abraham, Isaak und Jakob zu geben geschworen habe[a]. Ich werde es euch als Besitz geben. Ich bin Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für das ich meine Hand erhoben habe, um es Abraham, Isaak und Jakob zu geben“. Das Erheben der Hand ist hier eine Schwurgeste.'
    reason: Die Fußnote dokumentiert die bildhafte hebräische Schwurformel und erklärt ihre idiomatische Bedeutung.
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Und ich werde euch … bringen
  rationale: Der Hifil von בוא bezeichnet hier das Hineinbringen durch Gott; die deutsche Formulierung bewahrt den kausativen Sinn natürlich.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang der Verheißung ist das bestimmte, den Erzvätern zugesagte Land gemeint, nicht die Erde allgemein.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: von dem ich geschworen habe
  rationale: Wörtlich steht „für das ich meine Hand erhoben habe“. Da dies eine feste Schwurformel ist, gibt „geschworen“ ihren Sinn in natürlichem modernem Deutsch wieder; das konkrete Bild bleibt in der Fußnote erhalten.
- source_word: לָתֵת אֹתָהּ
  choice: es … zu geben
  rationale: נתן bedeutet in dieser Konstruktion schlicht „geben“.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abraham, Isaak und Jakob
  rationale: Die Namen folgen der geläufigen deutschen biblischen Form; die wiederholte hebräische Präposition wird im Deutschen idiomatisch nur einmal ausgedrückt.
- source_word: וְנָתַתִּי אֹתָהּ לָכֶם
  choice: Ich werde es euch … geben
  rationale: Die direkte Zukunftsform bewahrt den Charakter der göttlichen Zusage.
- source_word: מוֹרָשָׁה
  choice: als bleibenden Besitz
  rationale: מוֹרָשָׁה bezeichnet einen rechtmäßig und dauerhaft, auch erblich, gehaltenen Besitz. „Bleibender Besitz“ bringt diese Nuance deutlicher zum Ausdruck als das allgemeinere „Besitz“, ohne eine menschliche Erbfolge vorauszusetzen.
- source_word: אֲנִי יְהוָה
  choice: Ich bin Jahwe
  rationale: Die verblos formulierte Selbstbezeichnung wird im Deutschen mit „bin“ wiedergegeben; der Gottesname יְהוָה erscheint als „Jahwe“.
theological_decisions:
- issue: Wiedergabe der Schwurformel נָשָׂאתִי אֶת יָדִי
  choice: von dem ich geschworen habe
  alternative: für das ich meine Hand erhoben habe
  rationale: Die Wendung bezeichnet idiomatisch einen Schwur. Der Haupttext gibt die kommunikative Bedeutung wieder, während die Fußnote das konkrete hebräische Bild offenlegt.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Eigennamen Gottes. „Jahwe“ bewahrt diesen Charakter als Bundesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Reihung und lässt die beiden Zusagen klar hervortreten. „Bleibender Besitz“ macht die dauerhafte Nuance von מוֹרָשָׁה verständlich.
