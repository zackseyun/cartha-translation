  text: וָ/אֵרָ֗א אֶל אַבְרָהָ֛ם אֶל יִצְחָ֥ק וְ/אֶֽל יַעֲקֹ֖ב בְּ/אֵ֣ל שַׁדָּ֑י וּ/שְׁמִ֣/י יְהוָ֔ה לֹ֥א נוֹדַ֖עְתִּי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/003.yaml
  text: And I appeared to Abraham[a], to Isaac, and to Jacob as God Almighty, but by my name, Yahweh[b], I was not known to them.
translation:
  language: de
  text: Ich erschien Abraham, Isaak und Jakob als Gott, der Allmächtige[a]; aber unter meinem Namen Jahwe[b] war ich ihnen nicht bekannt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch El-Schaddai; traditionell mit »Gott, der Allmächtige« wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH, der persönliche Name Gottes; auch mit »der HERR« wiedergegeben.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »gab ich mich ihnen unter meinem Namen Jahwe nicht zu erkennen«. Gemeint sein kann nicht die bloße Unkenntnis des Namens, sondern dass seine volle Bedeutung für Gottes Bund und Handeln noch nicht erfahren worden war.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֵרָא
  choice: Ich erschien
  rationale: Das Nifal von ראה bezeichnet hier unmittelbar das Erscheinen Gottes; „offenbarte mich“ wäre stärker deutend.
- source_word: אֶל אַבְרָהָם אֶל יִצְחָק וְאֶל יַעֲקֹב
  choice: Abraham, Isaak und Jakob
  rationale: Das deutsche Verb „erscheinen“ regiert den Dativ, sodass die dreimalige hebräische Präposition natürlich ohne Wiederholung wiedergegeben wird.
- source_word: בְּאֵל שַׁדָּי
  choice: als Gott, der Allmächtige
  rationale: בְּ wird prädikativ mit „als“ wiedergegeben. Die traditionelle Bedeutungswiedergabe von אֵל שַׁדָּי bleibt im Haupttext verständlich; die Form El-Schaddai wird in der Fußnote bewahrt.
- source_word: וּשְׁמִי יְהוָה
  choice: aber unter meinem Namen Jahwe
  rationale: „Unter meinem Namen“ gibt die instrumentale beziehungsweise relationale Konstruktion idiomatisch wieder, ohne sie vorschnell als bloße Namensmitteilung auszulegen. Das Tetragramm wird als persönlicher Name „Jahwe“ wiedergegeben.
- source_word: לֹא נוֹדַעְתִּי לָהֶם
  choice: war ich ihnen nicht bekannt
  rationale: Die formal nahe, stativ-passive Wiedergabe bewahrt die Mehrdeutigkeit des Nifal und löst die Spannung zu den Vätererzählungen nicht im Haupttext auf.
theological_decisions:
- issue: Bedeutung der Aussage, dass Gott den Erzvätern unter dem Namen Jahwe nicht bekannt war
  choice: Die formale Aussage „war ich ihnen nicht bekannt“ bleibt im Haupttext stehen.
  alternative: „gab ich mich ihnen nicht zu erkennen“ beziehungsweise „ließ ich mich ihnen nicht erkennen“
  rationale: Der hebräische Wortlaut kann sich auf das Bekanntsein Gottes unter diesem Namen oder auf ein noch nicht voll erfahrenes Sich-zu-erkennen-Geben beziehen. Da Genesis den Gottesnamen in Erzählungen über die Erzväter verwendet, darf die Übersetzung weder absolute Unkenntnis noch ausschließlich die volle Bundesbedeutung festschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt eng am Hebräischen, klingt aber durch den Dativ nach „erschien“ und die Zeichensetzung natürlich. Die mehrdeutige Aussage über das Bekanntsein unter dem Gottesnamen wird bewusst nicht harmonisiert.
