  text: 'Die Söhne Gerschons: Libni und Schimi, nach ihren Sippen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach ihren Familien“. Das hebräische Wort kann größere Familienverbände oder Sippen innerhalb eines Stammes bezeichnen.'
