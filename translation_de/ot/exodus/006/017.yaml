lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Der Status constructus Plural von בֵּן leitet hier eine unmittelbare genealogische Aufzählung ein; „Söhne“ ist daher genauer als das weiter gefasste „Nachkommen“.
- source_word: גֵרְשׁוֹן
  choice: Gerschon
  rationale: Der Personenname wird in einer im Deutschen geläufigen bibelsprachlichen Umschrift wiedergegeben.
- source_word: לִבְנִי
  choice: Libni
  rationale: Der Personenname wird transliteriert und nicht übersetzt.
- source_word: וְשִׁמְעִי
  choice: und Schimi
  rationale: Die Konjunktion und der Personenname werden unmittelbar wiedergegeben; „Schimi“ entspricht einer geläufigen deutschen Umschrift.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet in genealogisch-stammesbezogenem Zusammenhang gewöhnlich eine größere Verwandtschaftsgruppe. „Sippen“ gibt diese soziale Einheit natürlicher und genauer wieder als das heute oft enger verstandene „Familien“.
