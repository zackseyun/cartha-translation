  yaml_path: translation/ot/exodus/006/022.yaml
  text: 'And the sons of Uzziel: Mishael[a], Elzaphan[b], and Sithri.'
translation:
  language: de
  text: 'Und die Söhne Usiëls: Mischaël, Elzafan und Sitri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Und die Söhne
  rationale: Das ו wird als „Und“ wiedergegeben und bewahrt so den Zusammenhang der genealogischen Aufzählung. בְּנֵי ist die Konstruktform im Plural und bedeutet hier „Söhne“.
- source_word: עֻזִּיאֵל
  choice: Usiël
  rationale: Der Personenname wird nach gebräuchlicher deutscher Schreibweise transliteriert; das Trema macht die getrennte Aussprache der Vokale sichtbar.
- source_word: מִישָׁאֵל
  choice: Mischaël
  rationale: Die Schreibung gibt den hebräischen Namen in einer im Deutschen gut lesbaren Form wieder; „sch“ entspricht dem hebräischen שׁ, das Trema kennzeichnet die getrennten Vokale.
- source_word: וְאֶלְצָפָן
  choice: Elzafan
  rationale: Der Personenname wird eng am Hebräischen und nach deutscher Laut-Buchstaben-Zuordnung wiedergegeben; צ wird durch „z“ und פ durch „f“ dargestellt. Das vorangestellte ו ist durch „und“ wiedergegeben.
- source_word: וְסִתְרִי
  choice: Sitri
  rationale: Die Form folgt dem hebräischen Namen סִתְרִי; ס wird im Deutschen sachgerecht mit „s“ wiedergegeben. Das vorangestellte ו ist durch „und“ wiedergegeben.
