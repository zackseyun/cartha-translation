  text: You shall make a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: de
  text: Du sollst für den Eingang des Zeltes einen Vorhang[a] aus blauem, purpurfarbenem und karmesinrotem Garn sowie aus gezwirntem Feinleinen anfertigen, in Buntstickerei gearbeitet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eine aufgehängte Abdeckung. Gemeint ist der den Eingang bedeckende Vorhang, im Unterschied zum inneren Trennvorhang in diesem Kapitel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָסָךְ
  choice: Vorhang
  rationale: Das Wort bezeichnet einen aufgehängten Abschluss, der einen Eingang bedeckt. »Vorhang« ist im Deutschen natürlich und unterscheidet sich vom inneren »Trennvorhang« in 2. Mose 26,31–33; die mögliche Wiedergabe »Abschirmung« wird in der Fußnote genannt.
- source_word: לְפֶתַח הָאֹהֶל
  choice: für den Eingang des Zeltes
  rationale: פֶתַח bezeichnet hier den Eingang beziehungsweise die Öffnung; אֹהֶל wird unmittelbar und ohne interpretierende Erweiterung mit »Zelt« wiedergegeben.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: aus blauem und purpurfarbenem Garn, Karmesin
  rationale: Die Farbbezeichnungen stehen metonymisch für entsprechend gefärbtes Textilmaterial. »Garn« wird bei den ersten beiden Farben ausdrücklich ergänzt; »Karmesin« gibt die idiomatische Farbbezeichnung תוֹלַעַת שָׁנִי knapp wieder.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: gezwirntem Feinleinen
  rationale: שֵׁשׁ bezeichnet feines Leinen, מָשְׁזָר dessen gezwirnte Verarbeitung. Die Formulierung bewahrt Material und Herstellungsart.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: als Arbeit eines Kunststickers
  rationale: Die Wendung bezeichnet kunstvolle, mehrfarbige Textilarbeit durch einen spezialisierten Handwerker. »Kunststicker« wahrt den Personenbezug der Konstruktion und den gehobenen handwerklichen Charakter.
- source_word: וְעָשִׂיתָ
  choice: Du sollst … anfertigen
  rationale: Das Perfekt mit Waw hat in der fortlaufenden Bauanweisung direktiven Sinn. »Du sollst« entspricht dem würdigen Anweisungsregister; »anfertigen« passt zum kunsthandwerklichen Gegenstand.
