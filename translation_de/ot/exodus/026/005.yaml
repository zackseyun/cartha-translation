base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/005.yaml
  text: You shall make fifty loops on the one curtain[a], and you shall make fifty loops on the edge of the curtain that is in the second set; the loops shall be opposite one another.
translation:
  language: de
  text: Du sollst an der einen Zeltbahn fünfzig Schlaufen anbringen. Auch am Rand der Zeltbahn, die zur zweiten Gruppe gehört, sollst du fünfzig Schlaufen anbringen. Die Schlaufen sollen einander gegenüberliegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Frau zu ihrer Schwester“; eine hebräische Ausdrucksweise für Dinge, die einander als Gegenstücke entsprechen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: Schlaufen
  rationale: Das Wort bezeichnet schlaufenförmige Befestigungen, durch die mithilfe der Klammern des folgenden Verses die Zeltbahnen verbunden werden. „Schlaufen“ unterscheidet sie klar von diesen metallenen Klammern.
- source_word: יְרִיעָה
  choice: Zeltbahn
  rationale: Im Zusammenhang des Heiligtums bezeichnet das Wort eine große Stoffbahn. „Zeltbahn“ ist im Deutschen präziser als das allgemeinere „Vorhang“ und passt zur aus mehreren Bahnen zusammengesetzten Decke.
- source_word: הָאֶחָת
  choice: die eine
  rationale: Die Form bedeutet wörtlich „die eine“ und unterscheidet diese Zeltbahn von der entsprechenden anderen, ohne eine zeitliche oder räumliche Reihenfolge als „erste“ ausdrücklich festzulegen.
- source_word: קְצֵה
  choice: Rand
  rationale: Das Wort bezeichnet hier die äußere Begrenzung der Stoffbahn; „Rand“ ist im Näh- und Verbindungszusammenhang natürlich und genau.
- source_word: מַחְבֶּרֶת
  choice: Gruppe
  rationale: Gemeint ist hier eine durch Zusammenfügen entstandene Einheit von Zeltbahnen. „Gruppe“ gibt im Deutschen das Ergebnis der Verbindung klar wieder, ohne das schwerfällige „Zusammenfügung“ zu verwenden.
- source_word: הַשֵּׁנִית
  choice: die zweite
  rationale: Die Wendung kennzeichnet ausdrücklich die zweite der beiden zusammengefügten Gruppen.
- source_word: מַקְבִּילֹת
  choice: genau gegenüberliegen
  rationale: Das Partizip beschreibt die korrespondierende räumliche Ausrichtung der Schlaufen. „Genau gegenüberliegen“ macht deutlich, dass jede Schlaufe mit ihrem Gegenstück ausgerichtet ist.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: einander
  rationale: Die wörtliche Wendung „eine Frau zu ihrer Schwester“ ist ein hebräisches Gegenstück-Idiom. „Einander“ gibt dessen Sinn natürlich wieder; das Bild des Ausgangstextes bleibt in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die wiederholte Anweisung des Hebräischen bleibt erhalten; „anbringen“ gibt das in diesem handwerklichen Zusammenhang gemeinte Herstellen der Schlaufen natürlich wieder. Die bildhafte hebräische Gegenstück-Formel wird wegen ihrer Fremdheit nicht in den Haupttext übernommen, sondern in einer Fußnote dokumentiert.
