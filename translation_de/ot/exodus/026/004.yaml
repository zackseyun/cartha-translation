  register: Moderne, sachlich-würdevolle Bauanweisung. „Zeltbahn“ und „Verbund“ machen die textile Konstruktion für heutige Leser verständlich; die Satzgliederung mit „und zwar“ verdeutlicht die räumliche Zuordnung, ohne den Inhalt zu erweitern.
