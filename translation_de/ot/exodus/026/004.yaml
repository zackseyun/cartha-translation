base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/004.yaml
  text: And you shall make loops of blue on the edge of the one curtain at the end of the first set joined together[c][b][a]; and so you shall do on the edge of the outermost curtain in the second set joined together.
translation:
  language: de
  text: Du sollst Schlaufen aus blauem Stoff[a] am Rand der einen Zeltbahn am Ende des ersten Verbunds[b] anbringen. Ebenso sollst du es am Rand der äußersten[c] Zeltbahn im zweiten Verbund tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „blauviolettem Stoff“. Das hebräische Wort תְּכֵלֶת bezeichnet ein charakteristisches gefärbtes Textilmaterial; der genaue Farbton ist unsicher und wird meist im Bereich Blau bis Blauviolett angesetzt.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet eine Gruppe von Zeltbahnen, die zu einer Einheit zusammengefügt ist; wörtlich steht hier nur „des Verbunds“. „Ersten“ ergibt sich aus der Gegenüberstellung mit dem ausdrücklich genannten zweiten Verbund.
    reason: textual_clarity
  - marker: c
    text: Oder „am Ende liegenden“.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: Schlaufen
  rationale: Das Substantiv bezeichnet schlaufenförmige Befestigungselemente, mit denen die Zeltbahnen verbunden werden.
- source_word: תְּכֵלֶת
  choice: blauer Purpur
  rationale: Der Ausdruck bezeichnet den charakteristischen blau bis violettblau gefärbten kostbaren Textilstoff des Heiligtums. „Blauer Purpur“ wahrt den kultischen Textilbezug, ohne den Farbton zu eng festzulegen.
- source_word: שְׂפַת
  choice: Rand
  rationale: Im Zusammenhang mit Textilien ist „Rand“ die natürliche und genaue Wiedergabe.
- source_word: יְרִיעָה
  choice: Zeltbahn
  rationale: Gemeint ist jeweils eine einzelne Stoffbahn der Zeltheiligtumdecke. „Zeltbahn“ ist im Deutschen anschaulicher und sachlich präziser als das mehrdeutige „Vorhang“.
- source_word: הָאֶחָת
  choice: die eine
  rationale: Das Hebräische sagt wörtlich „die eine“ und bezeichnet die betreffende Bahn, ohne sie ausdrücklich als die erste zu nummerieren.
- source_word: מִקָּצָה
  choice: am Ende
  rationale: Die Wendung lokalisiert die Schlaufen am äußersten Ende der Stoffbahn beziehungsweise des Verbunds.
- source_word: חֹבָרֶת
  choice: erster Verbund
  rationale: Das Wort bezeichnet eine durch Zusammenfügen gebildete Einheit von Zeltbahnen. „Erster“ ist aus dem ausdrücklichen Gegenstück „zweiter Verbund“ im zweiten Satzteil erschlossen und macht die Beziehung im Deutschen verständlich.
- source_word: וְכֵן
  choice: ebenso
  rationale: Das Wort leitet eine entsprechende, gleichartige Anweisung knapp und natürlich ein.
- source_word: הַקִּיצוֹנָה
  choice: äußerste
  rationale: Das Adjektiv bezeichnet die am Ende beziehungsweise außen liegende Zeltbahn.
- source_word: מַחְבֶּרֶת
  choice: Verbund
  rationale: Wie das verwandte חֹבָרֶת bezeichnet es eine zu einer Einheit zusammengefügte Gruppe von Stoffbahnen; die einheitliche Wiedergabe erhält den Zusammenhang.
- source_word: הַשֵּׁנִית
  choice: zweiter
  rationale: Der Ausdruck kennzeichnet ausdrücklich den zweiten der beiden Verbünde.
theological_decisions: []
