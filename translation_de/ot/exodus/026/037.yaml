source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ לַ/מָּסָ֗ךְ חֲמִשָּׁה֙ עַמּוּדֵ֣י שִׁטִּ֔ים וְ/צִפִּיתָ֤ אֹתָ/ם֙ זָהָ֔ב וָוֵי/הֶ֖ם זָהָ֑ב וְ/יָצַקְתָּ֣ לָ/הֶ֔ם חֲמִשָּׁ֖ה אַדְנֵ֥י נְחֹֽשֶׁת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/037.yaml
  text: And you shall make for the screen five pillars of acacia wood[a], and overlay them with gold; their hooks shall be of gold[b]; and you shall cast for them five bases of bronze.
translation:
  language: de
  text: Für den Vorhang[a] sollst du fünf Säulen aus Akazienholz anfertigen und sie mit Gold überziehen. Ihre Haken sollen aus Gold sein. Gieße für sie fünf Sockel aus Bronze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der Eingangsvorhang der Stiftshütte, nicht der innere Trennvorhang vor dem Allerheiligsten. Das hebräische Wort kann auch mit »Abschirmung« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָּסָךְ
  choice: Vorhang
  rationale: Bezeichnet hier den Eingangsvorhang des Heiligtums, nicht den inneren Trennvorhang vor dem Allerheiligsten. „Vorhang“ ist im Deutschen natürlich; eine Fußnote macht die funktionale Unterscheidung deutlich.
- source_word: עַמּוּדֵי שִׁטִּים
  choice: Säulen aus Akazienholz
  rationale: עַמּוּדִים bezeichnet tragende beziehungsweise aufrechte Säulen; שִׁטִּים ist das in diesen Bauanweisungen verwendete Akazienholz.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: sie mit Gold überziehen
  rationale: צפה bezeichnet hier das Überziehen eines Gegenstands mit Metall; die deutsche Wendung ist präzise und idiomatisch.
- source_word: וָוֵיהֶם
  choice: ihre Haken
  rationale: וָוִים bezeichnet im Kontext der Stiftshütte gewöhnlich Haken zur Befestigung von Behängen.
- source_word: אַדְנֵי נְחֹשֶׁת
  choice: Sockel aus Bronze
  rationale: אַדָן ist die stützende Aufnahme beziehungsweise der Fuß einer Säule. „Sockel“ gibt die bauliche Funktion im Deutschen klar wieder.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Im Kontext antiker Kultgeräte und Bauteile ist „Bronze“ die übliche und metallurgisch angemessene Wiedergabe; „Messing“ wäre irreführend.
- source_word: וְיָצַקְתָּ לָהֶם
  choice: Gieße für sie
  rationale: יצק bezeichnet das Gießen von Metall. לָהֶם zeigt, dass die Sockel für die Säulen gegossen werden.
theological_decisions: []
translation_notes:
  register: Moderne, würdige und gut verständliche Bauanweisung. Der Imperativ „Gieße“ setzt die im Hebräischen fortgeführte Anweisungsfolge natürlich fort; „sollst du“ bleibt im ersten Satz erhalten. „Stiftshütte“ erscheint nur erläuternd in der Fußnote.
