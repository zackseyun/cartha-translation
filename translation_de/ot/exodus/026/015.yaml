translation:
  language: de
  text: Und fertige die Rahmen[a] aus Akazienholz für das Heiligtumszelt an, die aufrecht stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bretter“. Das hebräische Wort bezeichnet die tragenden hölzernen Bauteile des Heiligtumszeltes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Und fertige … an
  rationale: Das Qal-Perfekt mit vorangestelltem ו setzt die Folge kultischer Anweisungen fort und hat hier auffordernde Bedeutung. Der deutsche Imperativ gibt diese Funktion natürlich und präzise wieder.
- source_word: הַקְּרָשִׁים
  choice: Rahmen
  rationale: קְרָשִׁים bezeichnet hier die tragenden hölzernen Bauteile der Stiftshütte. „Rahmen“ bringt ihre konstruktive Funktion zum Ausdruck; die ebenfalls mögliche Wiedergabe „Bretter“ wird in einer Fußnote genannt.
- source_word: לַמִּשְׁכָּן
  choice: für das Heiligtumszelt
  rationale: מִשְׁכָּן ist in diesem Zusammenhang die als Heiligtum dienende Zeltwohnung. „Heiligtumszelt“ ist im heutigen Deutsch verständlicher als das traditionelle, aber altertümlich wirkende „Stiftshütte“ und kennzeichnet die kultische Funktion.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: Die hebräische Genitivverbindung bezeichnet Holz von Akazien. „Aus Akazienholz“ ist die natürliche deutsche Materialangabe.
- source_word: עֹמְדִים
  choice: die aufrecht stehen
  rationale: Das Partizip beschreibt die aufrechte Stellung der Bauteile. Der Relativsatz bewahrt diesen eigenständigen Aussagegehalt und vermeidet eine missverständliche oder schwerfällige Partizipialkonstruktion.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Imperativ passt zu einer fortlaufenden Bauanweisung; „Heiligtumszelt“ vermeidet den heute wenig geläufigen Ausdruck „Stiftshütte“. Der Relativsatz gibt die räumliche Ausrichtung klar wieder.
