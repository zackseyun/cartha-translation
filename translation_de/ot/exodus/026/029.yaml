base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/029.yaml
  text: You shall overlay the frames with gold[a], and you shall make their rings of gold as holders for the bars[b], and you shall overlay the bars with gold.
translation:
  language: de
  text: Du sollst die Rahmen[a] mit Gold überziehen. Ihre Ringe sollst du aus Gold anfertigen, als Aufnahmen[b] für die Riegel, und auch die Riegel sollst du mit Gold überziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bretter“ beziehungsweise „Bohlen“. Das hebräische Wort bezeichnet die tragenden Bauteile der Wohnung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Häuser für die Riegel“, also Halterungen oder Aufnahmen für die Riegel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: die Rahmenteile
  rationale: Das Wort bezeichnet hier die aufrecht stehenden Bauteile der Wohnung. „Rahmenteile“ gibt ihre konstruktive Funktion wieder, ohne vorschnell festzulegen, ob sie als massive Bretter oder anders gestaltete Bauteile zu verstehen sind.
- source_word: תְּצַפֶּה / וְצִפִּיתָ
  choice: mit Gold überziehen
  rationale: Das Piel von צפה bezeichnet hier das Belegen beziehungsweise Überziehen eines Bauteils mit einem Material; „überziehen“ ist im Deutschen handwerklich passend und natürlich.
- source_word: זָהָב
  choice: Gold
  rationale: Die klare Materialbezeichnung wird entsprechend der hebräischen Wiederholung dreimal ausdrücklich wiedergegeben.
- source_word: טַבְּעֹתֵיהֶם
  choice: ihre Ringe
  rationale: טַבַּעַת bezeichnet die an den Rahmenteilen angebrachten Ringe.
- source_word: תַּעֲשֶׂה
  choice: sollst du … anfertigen
  rationale: „Anfertigen“ gibt עשה in diesem handwerklichen Zusammenhang idiomatisch wieder.
- source_word: בָּתִּים לַבְּרִיחִם
  choice: als Aufnahmen für die Riegel
  rationale: Wörtlich steht „Häuser für die Riegel“. Gemeint sind Vorrichtungen, welche die Riegel aufnehmen; „Aufnahmen“ ist eine präzise und verständliche Funktionsbezeichnung.
- source_word: הַבְּרִיחִם
  choice: die Riegel
  rationale: בְּרִיחַ bezeichnet die länglichen Verbindungselemente, welche die Rahmenteile zusammenhalten. „Riegel“ ist im Deutschen sachlich treffend; „Querriegel“ wäre erklärender, aber enger als der hebräische Ausdruck.
