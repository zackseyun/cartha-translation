  naturalness: „Zeltbahnen“ und die Wiederholung der Zahl sind im sachlich-anweisenden Register gut verständlich. Mit „als Zelt“ wird die räumlich-funktionale Aussage idiomatisch und näher am Ausgangstext formuliert.
