translation:
  language: de
  text: Du sollst Zeltbahnen aus Ziegenhaar als Zelt über der Wohnstätte anfertigen; elf Zeltbahnen sollst du anfertigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst … anfertigen
  rationale: Das Qal mit vorangestelltem ו setzt die Folge der Bauanweisungen fort. Die Soll-Form gibt den verbindlichen kultischen Auftrag in natürlichem Deutsch wieder.
- source_word: יְרִיעֹת
  choice: Zeltbahnen
  rationale: Im Zusammenhang des Heiligtumsbaus bezeichnet das Wort große textile Bahnen. „Zeltbahnen“ ist hier anschaulicher und präziser als das allgemeinere „Vorhänge“.
- source_word: עִזִּים
  choice: aus Ziegenhaar
  rationale: Wörtlich steht „Ziegen“, doch die Sachbedeutung ist aus Ziegenhaar gefertigtes Gewebe. Im Deutschen muss das Material ausdrücklich benannt werden.
- source_word: לְאֹהֶל
  choice: für ein Zeltdach
  rationale: ל kennzeichnet hier Zweck oder Funktion. Zusammen mit der folgenden Ortsangabe sind die Bahnen als zeltartige Überdeckung der Wohnstätte gemeint; „Zeltdach“ macht diese Funktion idiomatisch deutlich.
- source_word: עַל הַמִּשְׁכָּן
  choice: über der Wohnstätte
  rationale: עַל bezeichnet die Lage oberhalb; מִשְׁכָּן ist die Wohnstätte Gottes und zugleich der Fachausdruck für den inneren Heiligtumsbau. „Wohnstätte“ bewahrt die Wortbedeutung und den kultischen Zusammenhang.
- source_word: עַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת
  choice: elf Zeltbahnen
  rationale: Die Zahl bedeutet eindeutig „elf“. Die Wiederholung von „Zeltbahnen“ wird wie im Hebräischen beibehalten.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: sollst du anfertigen
  rationale: Die Wiederaufnahme des Verbs und das Objektpronomen bestätigen und betonen die geforderte Gesamtzahl. Die deutsche Wiederholung erhält diese Anweisungsstruktur.
theological_decisions:
- issue: Wiedergabe von הַמִּשְׁכָּן
  choice: Wohnstätte
  alternative: Stiftshütte
  rationale: „Wohnstätte“ gibt die Grundbedeutung des hebräischen Begriffs transparent wieder und vermeidet die irreführende Vorstellung einer bloßen Hütte. Der Kontext macht deutlich, dass der heilige Zeltheiligtumsbau gemeint ist.
translation_notes:
  register: Modernes, würdiges Anweisungsdeutsch. Die Wiederholung „anfertigen“ und „Zeltbahnen“ folgt bewusst der formelhaften Präzision des hebräischen Bauauftrags; „Zeltdach“ verhindert eine unnatürliche und räumlich weniger klare Formulierung wie „für ein Zelt über der Wohnstätte“.
