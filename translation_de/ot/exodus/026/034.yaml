  text: And you shall place the mercy seat on the ark of the testimony in the Most Holy Place[a][b][c].
translation:
  language: de
  text: Und setze die Sühneplatte[a] auf die Lade des Zeugnisses[b] im Allerheiligsten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Sühnedeckel; traditionell: der Gnadenthron.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „die Lade des Zeugnisses“; traditionell wird sie häufig „Bundeslade“ genannt.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „im Heiligtum der Heiligtümer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: Und setze
  rationale: Das Qal-Perfekt 2. Person maskulin Singular mit וְ führt die Anweisungsfolge fort und hat hier gebietende Kraft. „Setze“ ist im Deutschen für das gezielte Platzieren eines Gegenstands natürlich und präzise.
- source_word: הַכַּפֹּרֶת
  choice: die Sühneplatte
  rationale: כַּפֹּרֶת bezeichnet die auf der Lade liegende Platte, die im kultischen Zusammenhang mit Sühne verbunden ist. „Sühneplatte“ ist sachlich anschaulicher als das traditionelle „Gnadenthron“, ohne die kultische Bedeutung auf eine bloße Abdeckung zu reduzieren.
- source_word: עַל
  choice: auf
  rationale: Die Präposition bezeichnet hier die Lage beziehungsweise Platzierung unmittelbar auf der Lade.
- source_word: אֲרוֹן הָעֵדֻת
  choice: die Lade des Zeugnisses
  rationale: Die Wiedergabe folgt dem ausdrücklichen hebräischen Wortlaut „Lade des Zeugnisses“ und ersetzt „Zeugnis“ nicht harmonisierend durch „Bund“.
- source_word: בְּ/קֹדֶשׁ הַקֳּדָשִׁים
  choice: im Allerheiligsten
  rationale: Die hebräische Steigerungsform bezeichnet den heiligsten, innersten Raum. „Im Allerheiligsten“ ist im modernen Standarddeutsch verständlich, würdig und als Bezeichnung dieses Heiligtumsbereichs etabliert.
theological_decisions:
- issue: Wiedergabe von כַּפֹּרֶת als kultischer Gegenstand
  choice: Sühneplatte
  alternative: Gnadenthron; Sühnedeckel; Deckplatte
  rationale: „Sühneplatte“ bewahrt sowohl die konkrete Funktion als obere Platte der Lade als auch den kultischen Sühnebezug, ohne durch „Thron“ eine im hebräischen Substantiv nicht ausdrücklich enthaltene Vorstellung in den Haupttext einzutragen.
- issue: Wiedergabe der Ladebezeichnung
  choice: Lade des Zeugnisses
  alternative: Bundeslade
  rationale: Der Ausgangstext hat הָעֵדֻת („das Zeugnis“), nicht בְּרִית („Bund“). Die Übersetzung wahrt diese terminologische Unterscheidung.
- issue: Wiedergabe der Bezeichnung des innersten Heiligtums
  choice: Allerheiligstes
  alternative: Heiliges der Heiligen
  rationale: „Allerheiligstes“ gibt die superlativische hebräische Fügung natürlich wieder. Die wörtlichere Form bleibt als Fußnotenalternative sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Anweisungsform des Hebräischen bleibt erhalten. Etablierte Heiligtumssprache wird verwendet, doch traditionelle Deutungen werden nicht gegen den ausdrücklichen hebräischen Wortlaut in den Haupttext übernommen.
