lexical_decisions:
- source_word: קְרָשִׁים
  choice: Rahmen
  rationale: Im Zusammenhang mit dem Bau des Heiligtums bezeichnet das Wort aufrecht stehende Bauteile. »Rahmen« gibt ihre tragende Funktion in verständlichem, modernem Deutsch wieder; »Bretter« bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: אַדְנֵי/הֶם ... אֲדָנִים
  choice: Sockel
  rationale: Das Substantiv bezeichnet die stützenden Teile unter den Rahmen. »Sockel« ist im Deutschen für solche tragenden Fußstücke klar und sachgerecht; »Fußstücke« ist eine verständliche Alternative.
- source_word: כֶּסֶף
  choice: silbern
  rationale: Direkte Wiedergabe der Materialangabe; das attributive Adjektiv klingt in dieser Konstruktion natürlich.
- source_word: שִׁשָּׁה עָשָׂר
  choice: sechzehn
  rationale: Reguläre Wiedergabe der Kardinalzahl.
- source_word: תַּחַת
  choice: unter
  rationale: Direkte räumliche Wiedergabe, die zu einer Bauanweisung passt.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: dem einen Rahmen ... dem anderen Rahmen
  rationale: Das Hebräische wiederholt wörtlich »dem einen Rahmen« in distributiver Funktion. Die deutsche Paarformel »dem einen ... dem anderen« wahrt die Zuordnung, ohne eine zeitliche oder räumliche Reihenfolge einzuführen.
- source_word: וְהָיוּ
  choice: So sollen es ... sein
  rationale: Gibt die fortlaufende Anweisung und den spezifizierenden Charakter der Konstruktion idiomatisch wieder. »So« bindet den Vers an den vorausgehenden Bauzusammenhang an.
