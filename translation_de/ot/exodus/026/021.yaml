  text: וְ/אַרְבָּעִ֥ים אַדְנֵי/הֶ֖ם כָּ֑סֶף שְׁנֵ֣י אֲדָנִ֗ים תַּ֚חַת הַ/קֶּ֣רֶשׁ הָֽ/אֶחָ֔ד וּ/שְׁנֵ֣י אֲדָנִ֔ים תַּ֖חַת הַ/קֶּ֥רֶשׁ הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/021.yaml
  text: 'and their forty bases shall be of silver: two bases under the one frame[b][a], and two bases under the other frame.'
translation:
  language: de
  text: 'und ihre vierzig Sockel sollen aus Silber sein: zwei Sockel unter dem einen Rahmen[a] und zwei Sockel unter dem anderen Rahmen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell »Brett« statt »Rahmen«; das hebräische Wort bezeichnet hier jeweils ein aufrechtes Bauteil der Wohnung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים אַדְנֵי/הֶם
  choice: und ihre vierzig Sockel
  rationale: Die Verbindung mit וְ führt die Konstruktion des vorhergehenden Verses fort. »Ihre vierzig Sockel« gibt Zahl und Zugehörigkeit knapp und natürlich wieder.
- source_word: כָּסֶף
  choice: sollen aus Silber sein
  rationale: Das Substantiv bezeichnet hier das Material. Die deutsche Formulierung macht die im Hebräischen knappe Materialangabe idiomatisch deutlich.
- source_word: אֲדָנִים
  choice: Sockel
  rationale: אֶדֶן bezeichnet im Heiligtumsbau die silbernen Träger beziehungsweise Aufnahmen, in welche die aufrechten Bauteile eingesetzt wurden. »Sockel« ist im Deutschen anschaulich und baulich passend.
- source_word: תַּחַת
  choice: unter
  rationale: Die Präposition bezeichnet die räumliche Lage unmittelbar unter dem jeweiligen Bauteil.
- source_word: הַ/קֶּרֶשׁ
  choice: Rahmen
  rationale: קֶרֶשׁ bezeichnet hier ein aufrechtes tragendes Bauteil der Wohnung. »Rahmen« vermittelt dessen bauliche Funktion besser als das traditionellere »Brett«, ohne eine genauere Form vorzutäuschen.
- source_word: הָ/אֶחָד ... הָ/אֶחָד
  choice: dem einen ... dem anderen
  rationale: Das Hebräische wiederholt wörtlich »dem einen«. Im Zusammenhang ist die Verteilung auf zwei verschiedene Rahmen gemeint; die deutsche Gegenüberstellung »dem einen … dem anderen« gibt diesen distributiven Sinn natürlich und unmissverständlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die technische Beschreibung bleibt knapp; »Sockel« und »Rahmen« sind für heutige Leser verständlich. Die auffällige hebräische Wiederholung von »dem einen« wird entsprechend dem erkennbaren distributiven Sinn als »dem einen … dem anderen« wiedergegeben.
