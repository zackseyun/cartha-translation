translation:
  language: de
  text: Jedes Brett soll zwei Zapfen haben, die miteinander verbunden sind[a]. So sollst du alle Bretter der Wohnung anfertigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zwei Hände für das eine Brett, verbunden, eine Frau zu ihrer Schwester«. Mit den »Händen« sind hier vorspringende Verbindungsteile, also Zapfen, gemeint. Die ungewöhnliche Formulierung kann das Zusammenpassen oder die entsprechende Anordnung der beiden Zapfen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹת
  choice: Zapfen
  rationale: Wörtlich »Hände«; im Zusammenhang der Holzkonstruktion sind vorspringende Verbindungsteile gemeint. »Zapfen« ist dafür der klare, gebräuchliche Fachausdruck.
- source_word: מְשֻׁלָּבֹת
  choice: miteinander verbunden
  rationale: Das passive Partizip beschreibt die Zapfen als zusammengefügt beziehungsweise einander zugeordnet, ohne die genaue Bauweise eindeutig festzulegen.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: miteinander
  rationale: Die wörtliche Wendung »eine Frau zu ihrer Schwester« bezeichnet idiomatisch die wechselseitige Zuordnung gleichartiger Teile. Die Einzelheiten bleiben in der Fußnote sichtbar.
- source_word: קֶרֶשׁ
  choice: Brett
  rationale: Das Wort bezeichnet hier ein aufrecht stehendes hölzernes Bauteil. »Brett« bleibt konkret und vermeidet die stärker deutende Wiedergabe »Rahmen«.
- source_word: מִשְׁכָּן
  choice: Wohnung
  rationale: Das Substantiv bezeichnet die heilige, tragbare Wohnstätte Gottes und bewahrt als »Wohnung« den Bezug zum Verb »wohnen«.
- source_word: כֵּן תַּעֲשֶׂה
  choice: So sollst du … anfertigen
  rationale: Die Formulierung gibt eine verbindliche Anweisung nach dem beschriebenen Muster wieder.
- source_word: לַקֶּרֶשׁ הָאֶחָד
  choice: Jedes Brett
  rationale: Wörtlich steht »für das eine Brett«; im Kontext ist die Aussage distributiv und gilt für jedes einzelne Brett.
