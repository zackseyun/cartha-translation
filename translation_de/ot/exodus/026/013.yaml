  register: Modernes, würdevolles Standarddeutsch. Die bauliche Beschreibung bleibt anschaulich; „Wohnung“ bewahrt die Grundbedeutung von מִשְׁכָּן, während eine Fußnote den kultischen Bezug erläutert.
