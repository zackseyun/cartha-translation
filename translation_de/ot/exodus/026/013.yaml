base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/013.yaml
  text: And the extra cubit on this side and the extra cubit on that side[a], from the surplus in the length of the tent curtains, shall hang over the sides of the tabernacle on this side and on that side[b], to cover it.
translation:
  language: de
  text: Und der Überstand von je einer Elle auf dieser Seite und auf jener Seite, der von der Länge der Zeltbahnen übrig bleibt, soll an den Seiten der Wohnung auf dieser und auf jener Seite herabhängen, um sie zu bedecken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: „Wohnung“ übersetzt das hebräische Wort mischkan, die heilige Wohnstätte unter den Zeltbahnen.
    reason: cultural_note
lexical_decisions:
- source_word: הָאַמָּה ... הָאַמָּה
  choice: die Elle Überstand ... die Elle
  rationale: אַמָּה bezeichnet das Längenmaß „Elle“; „Überstand“ macht im Deutschen den durch בָּעֹדֵף bezeichneten baulichen Zusammenhang verständlich, ohne das Maß selbst umzudeuten.
- source_word: מִזֶּה ... מִזֶּה
  choice: auf dieser Seite ... auf jener Seite
  rationale: Die wiederholten Demonstrativangaben bezeichnen die beiden gegenüberliegenden Seiten und werden in natürlichem Deutsch entsprechend wiedergegeben.
- source_word: בָּעֹדֵף
  choice: die ... übrig ist / Überstand
  rationale: Das Wort bezeichnet den überschüssigen beziehungsweise übrig bleibenden Teil der Länge.
- source_word: אֹרֶךְ יְרִיעֹת הָאֹהֶל
  choice: von der Länge der Zelttücher
  rationale: Die Genitivfügung wird sachlich und unmittelbar wiedergegeben; „Zelttücher“ bezeichnet die Stoffbahnen der äußeren Zeltlage.
- source_word: יִהְיֶה סָרוּחַ
  choice: soll ... herabhängen
  rationale: Die Formulierung beschreibt den seitlich überstehenden Stoff, der nach unten hängt; „herabhängen“ vermittelt dieses räumliche Bild präzise.
- source_word: צִדֵּי הַמִּשְׁכָּן
  choice: auf beiden Seiten der Wohnung
  rationale: מִשְׁכָּן bedeutet wörtlich „Wohnung“ beziehungsweise „Wohnstätte“ und bezeichnet hier das Heiligtum unter der Zeltdecke. Die Wiederholung „von dieser und von jener Seite“ wird idiomatisch als „auf beiden Seiten“ gebündelt.
- source_word: לְכַסֹּתוֹ
  choice: um sie zu bedecken
  rationale: Der Infinitiv gibt den Zweck des herabhängenden Überstands an; das Suffix bezieht sich auf die Wohnung.
theological_decisions: []
