translation:
  language: de
  text: Du sollst das Heiligtumszelt nach der für das Heiligtumszelt festgelegten Ordnung aufrichten, die du auf dem Berg gesehen hast.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקֵמֹתָ
  choice: Du sollst … aufrichten
  rationale: Das Hifil von קום bedeutet hier, etwas zum Stehen zu bringen bzw. aufzubauen. „Aufrichten“ ist für eine Zeltkonstruktion natürlich und bewahrt den verpflichtenden Charakter der Form.
- source_word: הַמִּשְׁכָּן
  choice: das Heiligtumszelt
  rationale: מִשְׁכָּן bezeichnet in diesem Zusammenhang die heilige, zeltartige Wohnstätte Gottes. „Heiligtumszelt“ ist für heutige Leser verständlicher und sachlich präziser als das traditionelle „Stiftshütte“; zugleich ist es konkreter als das mehrdeutige „Wohnung“.
- source_word: כְּמִשְׁפָּטוֹ
  choice: nach der dafür geltenden Vorschrift
  rationale: מִשְׁפָּט bezeichnet hier die vorgeschriebene Ordnung bzw. Ausführung. Die Formulierung lässt offen, ob vor allem Bauplan, Anordnung oder vorgeschriebene Ausführungsweise gemeint ist, und gibt das Suffix וֹ („dafür/seine“) wieder.
- source_word: אֲשֶׁר הָרְאֵיתָ
  choice: die dir … gezeigt wurde
  rationale: Die hebräische Form lautet aktiv „die du gesehen hast“. Im Zusammenhang ist jedoch gemeint, dass Mose die vorgeschriebene Ausführung auf dem Berg zu sehen bekam. Das deutsche Passiv gibt diesen Sinn natürlich wieder; der formale Wortlaut wird in der Fußnote bewahrt.
- source_word: בָּהָר
  choice: auf dem Berg
  rationale: Die Präposition בְּ wird bei einem Berg als Ortsangabe im Deutschen idiomatisch mit „auf“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Heiligtumszelt“ vermeidet den heute erklärungsbedürftigen Traditionsausdruck „Stiftshütte“, macht aber die sakrale Funktion und die zeltartige Bauweise deutlich. Die Formulierung „geltende Vorschrift“ bewahrt die Bedeutungsbreite von מִשְׁפָּט, ohne sie vorschnell auf einen bloßen Bauplan einzuengen.
