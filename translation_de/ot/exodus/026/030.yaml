  source_fidelity: 'Die Grundbedeutung ist getroffen: וַהֲקֵמֹתָ bezeichnet das Aufrichten/Errichten, הַמִּשְׁכָּן das Heiligtumszelt, und בָּהָר „auf dem Berg“. כְּמִשְׁפָּטוֹ meint in diesem Baukontext jedoch eher die für das Zelt festgelegte Ordnung bzw. Ausführungsweise als eine allgemein „geltende Vorschrift“. Außerdem steht im Hebräischen aktiv „die du gesehen hast“; das Passiv ist als Sinnwiedergabe möglich, sollte aber nicht den Haupttext bestimmen, wenn eine natürliche aktive Wiedergabe möglich ist.'
  naturalness: „Heiligtumszelt“ ist verständlich und im modernen sachlich-würdigen Register verwendbar. „Nach der dafür geltenden Vorschrift“ klingt dagegen etwas verwaltungs- bzw. rechtsförmig und bleibt hinsichtlich des Bezugs von „dafür“ unnötig unbestimmt. Die revidierte Formulierung ist flüssiger und konkreter.
  terminology: '„Heiligtumszelt“ kann beibehalten werden. „Festgelegte Ordnung“ gibt מִשְׁפָּט in diesem Kontext breit genug wieder: Es kann die vorgeschriebene Bauform, Anordnung oder Ausführungsweise einschließen, ohne es auf eine juristische Vorschrift oder ausschließlich auf einen Bauplan festzulegen. Dies steht auch näher bei der englischen Audit-Trail-Entscheidung „pattern“ als „geltende Vorschrift“.'
