- from: Du sollst das Heiligtumszelt nach der dafür geltenden Vorschrift aufrichten, die dir auf dem Berg gezeigt wurde.[a]
  to: Du sollst das Heiligtumszelt nach der für das Heiligtumszelt festgelegten Ordnung aufrichten, die du auf dem Berg gesehen hast.
  rationale: Die Revision bewahrt die aktive Aussage des hebräischen Relativsatzes im Haupttext und ersetzt die rechtlich klingende „geltende Vorschrift“ durch „festgelegte Ordnung“, die die kontextuelle Bedeutungsbreite von מִשְׁפָּט wahrt. Da der Haupttext nun die aktive hebräische Form wiedergibt, ist die bisherige Fußnote nicht mehr erforderlich.
