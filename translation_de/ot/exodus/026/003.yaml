translation:
  language: de
  text: Fünf Zeltbahnen sollen miteinander verbunden werden[a], und fünf Zeltbahnen sollen miteinander verbunden werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Frau mit ihrer Schwester“; eine hebräische Wendung für entsprechende Gegenstände, die miteinander verbunden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרִיעֹת
  choice: Zeltbahnen
  rationale: Im Zusammenhang mit der Stiftshütte bezeichnet יְרִיעָה große textile Bahnen. „Zeltbahnen“ ist im Deutschen anschaulicher und kontextgenauer als das allgemeinere „Vorhänge“.
- source_word: תִּהְיֶיןָ
  choice: sollen
  rationale: Das Imperfekt von היה hat in diesen Bauanweisungen vorschreibenden Sinn. „Sollen“ gibt diesen Sinn in modernem Deutsch natürlich wieder.
- source_word: חֹבְרֹת
  choice: verbunden werden
  rationale: Die Form von חבר bezeichnet das Zusammenfügen oder Verbinden. Die passive deutsche Form entspricht der prädikativen Konstruktion und passt zu einer Bauanweisung.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: miteinander
  rationale: Die wörtliche Wendung „eine Frau zu ihrer Schwester“ ist hier eine hebräische Entsprechungsformel bei femininen Gegenständen. „Miteinander“ gibt ihre Funktion idiomatisch wieder; die Bildlichkeit wird in der Fußnote bewahrt.
- source_word: חֲמֵשׁ ... וְחָמֵשׁ
  choice: Je fünf ... und die anderen fünf ... ebenfalls
  rationale: Der Vers ordnet die zehn Bahnen in zwei Gruppen zu je fünf. Die leicht explizite deutsche Form macht diese Zweiteilung deutlich, ohne den sachlichen Gehalt zu verändern.
