base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/031.yaml
  text: And you shall make a veil of blue[a], purple, and scarlet yarn, and fine twisted linen; it shall be made with cherubim[c][b], the work of a skillful designer.
translation:
  language: de
  text: Du sollst einen Vorhang[a] aus blauem, purpurfarbenem und karmesinrotem Garn[b] sowie aus gezwirntem Feinleinen anfertigen. Als kunstvolle Textilarbeit soll man ihn mit Keruben anfertigen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der innere Vorhang, der im Heiligtum das Heilige vom Allerheiligsten trennte.
    reason: cultural_note
  - marker: b
    text: Die hebräische Bezeichnung meint karmesinfarben gefärbtes Material; der Farbstoff wurde traditionell aus Schildläusen gewonnen.
    reason: cultural_note
  - marker: c
    text: 'Oder: „kunstfertig gearbeitet“. Der hebräische Ausdruck bezeichnet fachkundige künstlerische Textilarbeit, ohne die genaue Technik eindeutig festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹכֶת
  choice: Vorhang
  rationale: Das Wort bezeichnet hier den inneren Trennvorhang des Heiligtums. „Vorhang“ ist im heutigen Deutsch natürlich und gibt die konkrete Funktion besser wieder als das missverständliche „Schleier“.
- source_word: תְּכֵלֶת וְאַרְגָּמָן
  choice: blaues und purpurfarbenes Garn
  rationale: Die Wörter bezeichnen kostbare gefärbte Textilien beziehungsweise deren Farben. „Garn“ wird aus dem Herstellungszusammenhang ergänzt und muss nicht nach jeder Farbangabe wiederholt werden.
- source_word: תוֹלַעַת שָׁנִי
  choice: karmesinrotes Garn
  rationale: Die Wendung bezeichnet karmesinfarben gefärbtes Material. Die Übersetzung wahrt die Farbangabe und macht den im Zusammenhang vorausgesetzten Textilcharakter deutlich.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: gezwirntes Feinleinen
  rationale: שֵׁשׁ bezeichnet hochwertiges Leinen, מָשְׁזָר dessen gezwirnte beziehungsweise verdrillte Verarbeitung.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: Kunstweber
  rationale: Die Wendung bezeichnet kunstfertige, planvoll gestaltete Textilarbeit. „Kunstweber“ ist knapp und wahrt den handwerklich-künstlerischen Sinn, ohne die Technik vorschnell als Stickerei festzulegen.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: soll ihn … gestalten
  rationale: Der hebräische Text wechselt von der Anrede in der zweiten Person zu einer dritten Person Singular. Die Übersetzung erhält diesen Wechsel, indem sie den Kunsthandwerker ausdrücklich zum Subjekt macht.
- source_word: כְּרֻבִים
  choice: mit Keruben
  rationale: „Keruben“ ist die geläufige deutsche Pluralform. Die knappe Präpositionalfügung lässt offen, mit welcher konkreten Webtechnik die Figuren eingearbeitet wurden.
theological_decisions:
- issue: Kultische Bedeutung des Vorhangs
  choice: Die Anweisung wird als konkrete Bau- und Gestaltungsanweisung wiedergegeben.
  alternative: Spätere symbolische oder christologische Deutungen bereits in den Wortlaut eintragen.
  rationale: Der Vers selbst beschreibt Material und kunsthandwerkliche Ausführung des inneren Vorhangs. Spätere theologische Bezüge sollen den unmittelbaren Aussagegehalt nicht überformen.
- issue: Darstellung der Keruben
  choice: „mit Keruben gestalten“
  alternative: Eine bestimmte bildliche Form oder symbolische Funktion der Keruben festlegen.
  rationale: Der Text nennt Keruben als Gestaltungselement, beschreibt hier aber weder ihre genaue Form noch deutet er ihre theologische Funktion aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Die Materialliste bleibt anschaulich; traditionelle Fachwörter werden nur dort verwendet, wo sie verständlich und sachlich präzise sind. Der auffällige hebräische Wechsel von der zweiten zur dritten Person wird bewahrt.
