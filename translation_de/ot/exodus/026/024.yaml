base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/024.yaml
  text: They shall be paired at the bottom[a], and together they shall be complete at its top, to the first ring. So it shall be for both of them[c][b]; they shall be for the two corners.
translation:
  language: de
  text: Unten sollen sie ein Paar bilden[a], und oben sollen sie gemeinsam bis zu dem einen Ring[c] vollständig sein[b]. So soll es bei ihnen beiden sein; sie sollen die beiden Ecken bilden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unten als zusammengehöriges Paar“; das hebräische Wort beschreibt die beiden Bretter als einander entsprechendes Paar.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „oben gemeinsam ganz sein“. Gemeint ist hier bauliche Ganzheit beziehungsweise vollständige Zusammenfügung, nicht moralische Vollkommenheit.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „bis zu dem einzigen Ring“; auch „bis zum ersten Ring“ ist möglich. Vermutlich ist der Ring gemeint, der die beiden Bretter oben verbindet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאֲמִים
  choice: paarweise zusammengefügt
  rationale: Das Wort beschreibt die Bretter als einander zugeordnetes Paar. Die Formulierung ist im baulichen Zusammenhang natürlich und legt die genaue Verbindungstechnik nicht fest.
- source_word: מִלְּמַטָּה
  choice: unten
  rationale: Die Wendung bezeichnet den unteren Bereich der Bretter; „unten“ gibt die räumliche Angabe knapp und idiomatisch wieder.
- source_word: וְיַחְדָּו
  choice: gemeinsam
  rationale: Das Adverb hebt hervor, dass die beiden Bretter am oberen Ende als Einheit verbunden sind.
- source_word: תַמִּים
  choice: vollständig verbunden
  rationale: Hier geht es um bauliche Ganzheit beziehungsweise vollständige Zusammenfügung, nicht um moralische Vollkommenheit. „Verbunden“ verdeutlicht den konstruktiven Zusammenhang, ohne eine bestimmte handwerkliche Ausführung zu behaupten.
- source_word: עַל רֹאשׁוֹ
  choice: oben
  rationale: „Kopf“ bezeichnet idiomatisch das obere Ende. Das Deutsche gibt dies in einer Bauanweisung natürlich mit „oben“ wieder.
- source_word: אֶל הַטַּבַּעַת הָאֶחָת
  choice: bis zu dem einen Ring
  rationale: Die Wiedergabe bewahrt die bestimmte Form mit dem Zahlwort „einer“ und vermeidet die unsichere Festlegung auf „den ersten Ring“.
- source_word: כֵּן יִהְיֶה לִשְׁנֵיהֶם
  choice: So soll es bei ihnen beiden sein
  rationale: Die Formulierung gibt die zusammenfassende Anweisung für beide Bretter klar und eng am Hebräischen wieder.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: sie sollen die beiden Ecken bilden
  rationale: מִקְצֹעֹת bezeichnet hier die beiden Ecken beziehungsweise Eckverbindungen. Die verbale Formulierung ist im Deutschen verständlicher als „für die beiden Ecken sein“, ohne „hintere“ aus dem weiteren Kontext einzutragen.
