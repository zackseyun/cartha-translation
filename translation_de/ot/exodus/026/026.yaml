  text: וְ/עָשִׂ֥יתָ בְרִיחִ֖ם עֲצֵ֣י שִׁטִּ֑ים חֲמִשָּׁ֕ה לְ/קַרְשֵׁ֥י צֶֽלַע הַ/מִּשְׁכָּ֖ן הָ/אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/026.yaml
  text: And you shall make five bars of acacia wood for the frames of the one side of the tabernacle[a].
translation:
  language: de
  text: Du sollst fünf Riegel aus Akazienholz für die Bretter an der einen Seite der Wohnung anfertigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rahmen“ statt „Bretter“; das hebräische Wort bezeichnet die aufrechten tragenden Bauteile der Wohnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst … anfertigen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ setzt die Folge von Bauanweisungen fort und hat hier gebietenden Sinn. „Du sollst … anfertigen“ bewahrt den würdevollen Anweisungsstil.
- source_word: בְרִיחִם
  choice: Riegel
  rationale: בְּרִיחַ bezeichnet hier längliche Konstruktionsteile, welche die Rahmen zusammenhalten. „Riegel“ ist im Deutschen sachgerecht und weniger spezifizierend als „Querriegel“.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: Die Constructusverbindung bezeichnet Holz der Akazie; „Akazienholz“ ist die geläufige und klare deutsche Wiedergabe.
- source_word: חֲמִשָּׁה
  choice: fünf
  rationale: Direkte Wiedergabe der Kardinalzahl, die sich auf die Riegel bezieht.
- source_word: לְקַרְשֵׁי
  choice: für die Rahmen
  rationale: קֶרֶשׁ bezeichnet die aufrechten tragenden Bauteile der Wohnung. „Rahmen“ gibt ihre konstruktive Funktion wieder; „Bretter“ bleibt als vertretbare Alternative in der Fußnote erhalten.
- source_word: צֶלַע
  choice: Seite
  rationale: צֶלַע bezeichnet in diesem baulichen Zusammenhang eine Längsseite, nicht eine anatomische Rippe.
- source_word: הַמִּשְׁכָּן
  choice: der Wohnung
  rationale: מִשְׁכָּן bedeutet wörtlich „Wohnung“ beziehungsweise „Wohnstätte“ und bezeichnet hier das Zeltheiligtum. Die Wiedergabe wahrt die sprachliche Verbindung zum Wohnen Gottes, ohne über den hebräischen Ausdruck hinauszugehen.
- source_word: הָאֶחָד
  choice: der einen
  rationale: Der bestimmte Ausdruck kennzeichnet eine der beiden Seiten und bereitet die Erwähnung der anderen Seite im folgenden Vers vor.
theological_decisions:
- issue: Wiedergabe von מִשְׁכָּן
  choice: Wohnung
  alternative: Stiftshütte
  rationale: „Wohnung“ gibt die Grundbedeutung des hebräischen Wortes transparent und in modernem Deutsch wieder. „Stiftshütte“ ist traditionell, aber heute erklärungsbedürftig und lexikalisch weniger unmittelbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dem gebietenden „Du sollst“ der fortlaufenden Bauanweisungen. Der Satzbau bleibt nah am Hebräischen, ohne unnatürlich zu wirken.
