  text: וְ/עָשִׂ֤יתָ מִכְסֶה֙ לָ/אֹ֔הֶל עֹרֹ֥ת אֵילִ֖ם מְאָדָּמִ֑ים וּ/מִכְסֵ֛ה עֹרֹ֥ת תְּחָשִׁ֖ים מִ/לְ/מָֽעְלָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/014.yaml
  text: And you shall make for the tent a covering of rams’ skins dyed red[a], and a covering of tahash skins above.
translation:
  language: de
  text: Und du sollst für das Zelt eine Decke aus rot gefärbten Widderfellen machen und darüber eine Decke aus Tachaschhäuten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Was das hebräische Wort »Tachasch« bezeichnet, ist ungewiss. Gemeint sein könnte eine bestimmte Tierart oder eine Art widerstandsfähiges Leder; vorgeschlagen wurden unter anderem »Feinleder«, »Tümmlerfelle« und »Dugongfelle«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Und du sollst … machen
  rationale: Das Qal-Perfekt mit vorangestelltem ו setzt die Anweisungsfolge fort und hat hier gebietende Bedeutung.
- source_word: מִכְסֶה לָאֹהֶל
  choice: für das Zelt eine Decke
  rationale: מִכְסֶה bezeichnet eine schützende Abdeckung; אֹהֶל ist wörtlich »Zelt«.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: aus rot gefärbten Widderfellen
  rationale: Die Form מְאָדָּמִים beschreibt die Felle als gerötet, wahrscheinlich durch Färbung; die deutsche Formulierung ist natürlich und präzise.
- source_word: עֹרֹת תְּחָשִׁים
  choice: aus Tachaschhäuten
  rationale: Die Tierart beziehungsweise Lederart תְּחָשׁ ist ungeklärt. Die Transliteration bewahrt diese echte lexikalische Unsicherheit.
- source_word: מִלְמָעְלָה
  choice: darüber
  rationale: Das Adverb bezeichnet hier die Lage der zweiten, äußeren Decke oberhalb der zuvor genannten Decke, ohne ausdrücklich ein Demonstrativpronomen zu setzen.
theological_decisions: []
