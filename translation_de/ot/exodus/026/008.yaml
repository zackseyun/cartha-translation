base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/008.yaml
  text: The length of each curtain shall be thirty cubits[a], and the width of each curtain four cubits[b]; all eleven curtains shall have one measure.
translation:
  language: de
  text: Die Länge jeder Zeltbahn[a] soll dreißig Ellen und ihre Breite vier Ellen betragen; alle elf Zeltbahnen sollen dasselbe Maß[b] haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen jeweils „die eine Zeltbahn“; hier ist damit jede einzelne Zeltbahn gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ein Maß“; das heißt, alle elf Zeltbahnen sollen einheitliche Abmessungen haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: Länge
  rationale: Der Begriff bezeichnet hier die Längsausdehnung und steht parallel zu רֹחַב („Breite“).
- source_word: יְרִיעָה
  choice: Zeltbahn
  rationale: Im Zusammenhang der Stiftshütte bezeichnet das Wort eine einzelne große Stoffbahn der Zeltbedeckung. „Zeltbahn“ ist im Deutschen anschaulich und unterscheidet die einzelnen Bahnen vom gesamten Vorhang oder Dach.
- source_word: הָאַחַת / הָאֶחָת
  choice: jeder
  rationale: Wörtlich steht „die eine“; in dieser Maßangabe ist die Form distributiv gebraucht und bezieht die genannten Abmessungen auf jede einzelne Zeltbahn.
- source_word: שְׁלֹשִׁים בָּאַמָּה
  choice: dreißig Ellen
  rationale: Die antike Maßeinheit אַמָּה wird transparent als „Elle“ beibehalten, statt sie unsicher in ein modernes Maß umzurechnen.
- source_word: רֹחַב
  choice: Breite
  rationale: „Breite“ ist die natürliche deutsche Entsprechung und bildet das Gegenstück zu „Länge“.
- source_word: אַרְבַּע בָּאַמָּה
  choice: vier Ellen
  rationale: Die Maßangabe wird direkt und unter Beibehaltung der antiken Einheit wiedergegeben.
- source_word: מִדָּה אַחַת
  choice: dasselbe Maß
  rationale: Wörtlich „ein Maß“; gemeint ist, dass sämtliche elf Zeltbahnen einheitliche Abmessungen haben. „Dasselbe Maß“ bringt diese Funktion im heutigen Deutsch klar zum Ausdruck.
- source_word: לְעַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת
  choice: alle elf Zeltbahnen
  rationale: Die Präposition לְ kennzeichnet die Gesamtheit, für die das einheitliche Maß gilt. Die deutsche Satzbildung macht diese Gruppe zum Subjekt; „alle“ verdeutlicht den umfassenden Bezug.
