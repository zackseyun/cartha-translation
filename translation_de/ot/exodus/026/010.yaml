base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/010.yaml
  text: And you shall make fifty loops on the edge of the one curtain[a], the outermost one in the set joined together, and fifty loops on the edge of the second curtain that is joined to it.
translation:
  language: de
  text: Du sollst fünfzig Schlaufen am Rand der einen Zeltbahn anbringen, die äußerste der zusammengefügten Gruppe, und fünfzig Schlaufen am Rand der Zeltbahn der zweiten zusammengefügten Gruppe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst … anbringen
  rationale: Das Qal-Perfekt mit וְ hat im Anweisungskontext gebietende Bedeutung. »Du sollst« wahrt den verbindlichen Charakter; »anbringen« ist bei Schlaufen an einem Stoffrand idiomatischer als ein bloßes »machen«.
- source_word: לֻלָאֹת
  choice: Schlaufen
  rationale: Das Substantiv bezeichnet Stoffschlaufen, mit denen die Zeltbahnen verbunden werden. »Schlaufen« ist präzise und allgemein verständlich.
- source_word: שְׂפַת
  choice: Rand
  rationale: Wörtlich »Lippe«; bei einer Stoffbahn ist »Rand« die natürliche sachliche Entsprechung.
- source_word: הַיְרִיעָה
  choice: Zeltbahn
  rationale: יְרִיעָה bezeichnet hier eine große textile Bahn der Stiftshütte. »Zeltbahn« gibt Material und Funktion anschaulich wieder, ohne die Konstruktion als gewöhnlichen Vorhang misszuverstehen.
- source_word: הָאֶחָת
  choice: der einen
  rationale: Der hebräische Text sagt »die eine«, nicht ausdrücklich »die erste«. Die Übersetzung bewahrt diese Formulierung.
- source_word: הַקִּיצֹנָה
  choice: der äußersten
  rationale: Das Adjektiv bezeichnet die Bahn am Ende beziehungsweise äußeren Rand einer verbundenen Einheit.
- source_word: בַּחֹבָרֶת
  choice: in der zusammengefügten Einheit
  rationale: חֹבֶרֶת bezeichnet die durch das Verbinden mehrerer Bahnen entstandene Einheit. Die Wiedergabe vermeidet das im Deutschen missverständliche »Kopplung«.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: in der zweiten zusammengefügten Einheit
  rationale: Im Zusammenhang sind zwei jeweils zusammengefügte Gruppen von Zeltbahnen gemeint. Die Präposition »in« wird im zweiten, elliptisch formulierten Satzglied sinngemäß ergänzt; eine stärker relationale Deutung bleibt in der Fußnote sichtbar.
theological_decisions: []
translation_notes:
  register: Moderne, sachliche und würdige Bauanweisung. »Zeltbahn« und »zusammengefügte Einheit« machen die textile Konstruktion verständlich; die Wiederholung folgt der symmetrischen Struktur des Hebräischen.
