revisions:
- from: Du sollst fünfzig Schlaufen am Rand der einen Zeltbahn anbringen, der äußersten in der zusammengefügten Einheit, und fünfzig Schlaufen am Rand der Zeltbahn in der zweiten zusammengefügten Einheit.[a]
  to: Du sollst fünfzig Schlaufen am Rand der einen Zeltbahn anbringen, die äußerste der zusammengefügten Gruppe, und fünfzig Schlaufen am Rand der Zeltbahn der zweiten zusammengefügten Gruppe.
  rationale: Die Revision bewahrt die elliptische, symmetrische Bauanweisung des Hebräischen, macht aber die Zugehörigkeit der jeweiligen Zeltbahn zu einer zusammengefügten Gruppe deutlich. Die nicht notwendige Fußnote wird entfernt, weil sie eine im Kontext nicht gebotene alternative Zuordnung einführt.
