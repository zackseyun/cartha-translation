  text: עֶ֥שֶׂר אַמּ֖וֹת אֹ֣רֶךְ הַ/קָּ֑רֶשׁ וְ/אַמָּה֙ וַ/חֲצִ֣י הָֽ/אַמָּ֔ה רֹ֖חַב הַ/קֶּ֥רֶשׁ הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/016.yaml
  text: The length of each frame shall be ten cubits[a], and the width of each frame one and a half cubits.
translation:
  language: de
  text: Jedes Brett[a] soll zehn Ellen lang und eineinhalb Ellen breit sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: jedes Rahmenelement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶרֶשׁ
  choice: Planke
  rationale: Das Wort bezeichnet hier ein aufrecht stehendes Bauteil der Stiftshütte. »Planke« ist im heutigen Deutsch natürlicher und konstruktiv aussagekräftiger als das traditionelle »Brett«, ohne Form und Bauweise genauer festzulegen, als es der hebräische Text tut.
- source_word: עֶשֶׂר אַמּוֹת
  choice: zehn Ellen
  rationale: Die antike Maßeinheit wird beibehalten und nicht in ein modernes Maß umgerechnet.
- source_word: אֹרֶךְ
  choice: lang
  rationale: Die adjektivische Formulierung »zehn Ellen lang« gibt die Maßangabe im Deutschen natürlich wieder.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: anderthalb Ellen
  rationale: Dies ist die idiomatische deutsche Wiedergabe von »eine Elle und eine halbe Elle« und bewahrt den genauen Wert.
- source_word: רֹחַב
  choice: breit
  rationale: »Anderthalb Ellen breit« ist die klare und natürliche deutsche Entsprechung der nominalen hebräischen Breitenangabe.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: jede Planke
  rationale: Der bestimmte Singular mit אֶחָד bezeichnet das einzelne, jeweils gemeinte Bauteil; »jede Planke« gibt diesen distributiven Sinn idiomatisch wieder.
