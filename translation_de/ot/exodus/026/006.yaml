  text: וְ/עָשִׂ֕יתָ חֲמִשִּׁ֖ים קַרְסֵ֣י זָהָ֑ב וְ/חִבַּרְתָּ֨ אֶת הַ/יְרִיעֹ֜ת אִשָּׁ֤ה אֶל אֲחֹתָ/הּ֙ בַּ/קְּרָסִ֔ים וְ/הָיָ֥ה הַ/מִּשְׁכָּ֖ן אֶחָֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/006.yaml
  text: And you shall make fifty gold clasps[a], and join the curtains to one another with the clasps, so that the tabernacle may be one.
translation:
  language: de
  text: Du sollst fünfzig goldene Klammern anfertigen und die Zeltbahnen mit den Klammern miteinander[a] verbinden, sodass die Wohnstätte eine Einheit bildet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »eine Frau zu ihrer Schwester« – eine hebräische Wendung dafür, dass die Zeltbahnen einander entsprechend verbunden werden.'
    reason: Die wörtliche, personifizierende Form des hebräischen Idioms ist im flüssigen Haupttext nicht direkt nachgebildet.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst … anfertigen
  rationale: Das Qal-Perfekt mit ו setzt die Anweisungsfolge fort. „Du sollst“ gibt den verpflichtenden Charakter wieder; „anfertigen“ passt natürlich zur Herstellung der Klammern.
- source_word: חֲמִשִּׁים קַרְסֵי זָהָב
  choice: fünfzig goldene Klammern
  rationale: קֶרֶס bezeichnet hier Verbindungsteile für die Zeltbahnen. „Klammern“ beschreibt ihre Funktion, ohne ihre genaue Form als Haken festzulegen.
- source_word: וְחִבַּרְתָּ
  choice: und … verbinden
  rationale: חבר bedeutet verbinden oder zusammenfügen. „Verbinden“ ist im Deutschen für diese Konstruktionsanweisung klar und idiomatisch.
- source_word: הַיְרִיעֹת
  choice: die Zeltbahnen
  rationale: יְרִיעָה bezeichnet im Zusammenhang der Wohnung textile Bahnen. „Zeltbahnen“ ist anschaulicher und sachlich genauer als das leicht missverständliche „Vorhänge“.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: miteinander[a]
  rationale: Die wörtliche Wendung „eine Frau mit ihrer Schwester“ ist eine hebräische Entsprechungsformel. „Miteinander“ gibt ihren Sinn im deutschen Haupttext natürlich wieder; die Bildgestalt bleibt in der Fußnote erhalten.
- source_word: בַּקְּרָסִים
  choice: mit den Klammern
  rationale: Die Präposition בְּ bezeichnet hier das Mittel beziehungsweise Werkzeug der Verbindung.
- source_word: וְהָיָה הַמִּשְׁכָּן אֶחָד
  choice: So wird die Wohnung zu einem Ganzen
  rationale: Der Satz nennt die Folge des Verbindens. „Zu einem Ganzen“ gibt אֶחָד bei einem aus mehreren Bahnen zusammengesetzten Gegenstand natürlich wieder, ohne die Aussage über ihre Einheit abzuschwächen.
theological_decisions:
- issue: Wiedergabe von הַמִּשְׁכָּן
  choice: die Wohnung
  alternative: die Stiftshütte / das Heiligtumszelt
  rationale: מִשְׁכָּן bedeutet grundlegend „Wohnung“ und bezeichnet hier technisch das transportable Heiligtum als Gottes Wohnstätte. „Wohnung“ bewahrt diese Wortbedeutung; „Stiftshütte“ ist traditionell, aber im heutigen Deutsch weniger unmittelbar verständlich.
translation_notes:
  register: Moderne, würdige und gut verständliche Anweisungssprache. „Zeltbahnen“, „Klammern“ und „Wohnung“ halten den konkreten Bau- und Heiligtumskontext sichtbar; die hebräische Satzfolge wird in zwei klaren deutschen Sätzen wiedergegeben.
