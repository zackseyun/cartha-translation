  text: וְ/עָשִׂ֥יתָ אֶת הַ/קְּרָשִׁ֖ים לַ/מִּשְׁכָּ֑ן עֶשְׂרִ֣ים קֶ֔רֶשׁ לִ/פְאַ֖ת נֶ֥גְבָּ/ה תֵימָֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/018.yaml
  text: 'And you shall make the frames for the tabernacle: twenty frames for the south side[a], southward.'
translation:
  language: de
  text: 'Und du sollst die Rahmen[a] für die Wohnung anfertigen: zwanzig Rahmen für die Südseite, nach Süden hin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bretter“. Das hebräische Wort bezeichnet die tragenden Bauteile der Wohnung und kann als Rahmen oder als Bretter verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Und du sollst … anfertigen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im Anweisungskontext verpflichtende bzw. gebietende Kraft. Die Formulierung bewahrt diesen Weisungscharakter in natürlichem Deutsch.
- source_word: הַקְּרָשִׁים
  choice: die Rahmen
  rationale: קֶרֶשׁ bezeichnet hier die aufrechten tragenden Bauteile der Wohnung. „Rahmen“ gibt ihre konstruktive Funktion wieder, ohne sie vorschnell als massive Bretter festzulegen; die mögliche Wiedergabe „Bretter“ wird in der Fußnote genannt.
- source_word: לַמִּשְׁכָּן
  choice: für die Wohnung
  rationale: מִשְׁכָּן bezeichnet die als Wohnort Gottes verstandene Heiligtumsanlage. „Wohnung“ gibt die Grundbedeutung unmittelbar wieder und vermeidet das heute ungebräuchliche „Stiftshütte“.
- source_word: עֶשְׂרִים קֶרֶשׁ
  choice: zwanzig Rahmen
  rationale: Die hebräische Zählkonstruktion verwendet nach der Zahl ein Substantiv im Singular; im Deutschen ist hier die formal gleiche Pluralform „Rahmen“ idiomatisch.
- source_word: לִפְאַת
  choice: für die … Seite
  rationale: פֵאָה kann Seite, Rand oder äußersten Bereich bezeichnen. Bei der Beschreibung eines Bauwerks ist „Seite“ die naheliegende räumliche Wiedergabe.
- source_word: נֶגְבָּה תֵימָנָה
  choice: für die Südseite, nach Süden hin
  rationale: Die beiden Richtungsangaben bezeichnen und bekräftigen gemeinsam die südliche Ausrichtung. Die Wiedergabe erhält diese im Hebräischen vorhandene Doppelung, statt sie zu einem einzigen Adjektiv zusammenzuziehen.
theological_decisions: []
