  text: וְ/נָתַתָּ֣ה אֶת הַ/פָּרֹכֶת֮ תַּ֣חַת הַ/קְּרָסִים֒ וְ/הֵבֵאתָ֥ שָׁ֨מָּ/ה֙ מִ/בֵּ֣ית לַ/פָּרֹ֔כֶת אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/הִבְדִּילָ֤ה הַ/פָּרֹ֨כֶת֙ לָ/כֶ֔ם בֵּ֣ין הַ/קֹּ֔דֶשׁ וּ/בֵ֖ין קֹ֥דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/033.yaml
  text: And you shall place the veil under the clasps[a], and there, within the veil, you shall bring the ark of the testimony[b]; and the veil shall separate for you between the Holy Place and the Most Holy Place.
translation:
  language: de
  text: Du sollst den Vorhang unter den Klammern anbringen und dorthin, hinter den Vorhang, die Lade des Zeugnisses[a] bringen. So soll der Vorhang für euch das Heilige vom Allerheiligsten[b] trennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell auch „Bundeslade“ genannt; im Hebräischen steht hier wörtlich „Lade des Zeugnisses“.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „das Heilige der Heiligkeiten“.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹכֶת
  choice: Vorhang
  rationale: Bezeichnet den inneren textilen Raumteiler der Stiftshütte. „Vorhang“ ist im Deutschen natürlich und kultisch hinreichend bestimmt.
- source_word: קְרָסִים
  choice: Klammern
  rationale: Das Wort bezeichnet die Verbindungsteile, mit denen die Zeltbahnen zusammengefügt werden. „Klammern“ wahrt diese Funktion, ohne eine modern-technische Form zu unterstellen.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: hinter den Vorhang
  rationale: Die Wendung bezeichnet den Raum auf der Innenseite des Vorhangs. „Hinter den Vorhang“ gibt die räumliche Perspektive im Deutschen klar und natürlich wieder.
- source_word: אֲרוֹן הָעֵדוּת
  choice: die Lade des Zeugnisses
  rationale: Der hebräische Text hat ausdrücklich עֵדוּת, „Zeugnis“, nicht בְּרִית, „Bund“. Daher wird nicht zum vertrauteren Titel „Bundeslade“ harmonisiert.
- source_word: וְהִבְדִּילָה
  choice: soll … trennen
  rationale: Der Hifil von בדל drückt das Bewirken einer Trennung aus; die deutsche Formulierung gibt die Funktion des Vorhangs direkt wieder.
- source_word: לָכֶם
  choice: für euch
  rationale: Das im Hebräischen vorhandene Pronomen bleibt erhalten und bezeichnet die Bedeutung dieser Trennung für Israels Gottesdienstordnung.
- source_word: הַקֹּדֶשׁ
  choice: das Heilige
  rationale: Hier ist der vordere heilige Raum im Gegensatz zum innersten Raum gemeint. „Das Heilige“ ist eine etablierte und knappe deutsche Kultbezeichnung.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: das Allerheiligste
  rationale: Die hebräische Steigerungsform „Heiliges der Heiligkeiten“ wird durch die natürliche deutsche Superlativbezeichnung „das Allerheiligste“ wiedergegeben.
theological_decisions:
- issue: Bezeichnung der Lade
  choice: Lade des Zeugnisses
  alternative: Bundeslade
  rationale: Obwohl „Bundeslade“ traditionell vertraut ist, steht im Ausgangstext „Zeugnis“. Die Übersetzung bewahrt diese konkrete Wortwahl und vermeidet eine stillschweigende Harmonisierung.
- issue: Bezeichnung des innersten Heiligtums
  choice: das Allerheiligste
  alternative: das Heilige der Heiligkeiten
  rationale: „Das Allerheiligste“ vermittelt die superlativische Bedeutung des hebräischen Ausdrucks in natürlichem modernem Deutsch; die wörtliche Struktur wird in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anweisung wird mit „Du sollst“ wiedergegeben; die kultischen Raumbezeichnungen sind klar voneinander unterschieden. Beide Fußnotenmarker erscheinen unmittelbar bei den erläuterten Ausdrücken.
