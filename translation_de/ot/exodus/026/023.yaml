  text: And you shall make two boards for the corners of the tabernacle at the rear[a].
translation:
  language: de
  text: Für die Ecken der Wohnung an den beiden hinteren Enden sollst du zwei Bretter anfertigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Für die Eckstücke der Wohnung an den beiden hinteren Enden«. Die hebräischen Bezeichnungen sind bautechnisch und nicht ganz eindeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי קְרָשִׁים
  choice: zwei Bretter
  rationale: קְרָשִׁים bezeichnet hier die tragenden hölzernen Bauteile der Zeltwände. »Bretter« ist im Deutschen verständlich und traditionell, ohne die Konstruktion stärker als »Rahmen« auszudeuten.
- source_word: תַּעֲשֶׂה
  choice: sollst du … anfertigen
  rationale: Das Imperfekt hat in dieser Bauanweisung direktiven Sinn. »Sollst du … anfertigen« gibt diesen wieder und passt idiomatisch zu eigens herzustellenden Bauteilen.
- source_word: לִ/מְקֻצְעֹת
  choice: für die Ecken
  rationale: Der Ausdruck bezeichnet Ecken beziehungsweise winkelförmige Verbindungsstellen. Die Wiedergabe bewahrt den räumlichen Sinn, ohne die Bretter ausdrücklich als besondere »Eckstücke« festzulegen.
- source_word: הַ/מִּשְׁכָּן
  choice: der Wohnung
  rationale: מִשְׁכָּן bedeutet wörtlich »Wohnung« oder »Wohnstätte« und bezeichnet in diesem Zusammenhang das heilige Zelt. »Wohnung« bewahrt den theologischen Leitbegriff und ist in der Beschreibung der Anlage ausreichend klar.
- source_word: בַּ/יַּרְכָתָיִם
  choice: an ihrer Rückseite
  rationale: Die Dualform verweist auf die beiden hinteren Endbereiche. Im Deutschen bezeichnet »an ihrer Rückseite« deren Lage natürlich und vermeidet die schwerfällige Wiederholung von »Ecken«.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Anweisungssprache. Die Satzstellung hebt wie im Zusammenhang das neu anzufertigende Bauteil hervor. Die Fußnote erhält die architektonische Mehrdeutigkeit zwischen Ecken als Lageangabe und eigens geformten Eckstücken.
