id: EXO.26.2
reference: Exodus 26:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֹ֣רֶךְ הַ/יְרִיעָ֣ה הָֽ/אַחַ֗ת שְׁמֹנֶ֤ה וְ/עֶשְׂרִים֙ בָּֽ/אַמָּ֔ה וְ/רֹ֨חַב֙ אַרְבַּ֣ע בָּ/אַמָּ֔ה הַ/יְרִיעָ֖ה הָ/אֶחָ֑ת מִדָּ֥ה אַחַ֖ת לְ/כָל הַ/יְרִיעֹֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/002.yaml
  text: The length of each curtain shall be twenty-eight cubits[a], and the width of each curtain four cubits[b]; all the curtains shall have one measure.
translation:
  language: de
  text: Jede Zeltbahn soll achtundzwanzig Ellen[a] lang und vier Ellen breit sein; alle Zeltbahnen sollen dasselbe Maß haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht zweimal »die eine Zeltbahn«; diese hebräische Ausdrucksweise bezeichnet hier jede einzelne Zeltbahn.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: lang
  rationale: In der deutschen Maßangabe ist die prädikative Formulierung »achtundzwanzig Ellen lang« natürlicher als das substantivische »die Länge beträgt« und gibt den dimensionalen Sinn genau wieder.
- source_word: הַיְרִיעָה
  choice: Zeltbahn
  rationale: Im Zusammenhang der Stiftshütte bezeichnet יְרִיעָה eine große textile Bahn der Zeltdecke. »Zeltbahn« ist genauer als das im Deutschen leicht missverständliche »Vorhang«.
- source_word: הָאַחַת / הָאֶחָת
  choice: jede
  rationale: 'Das wörtliche »die eine« wird hier distributiv gebraucht: Die Maße gelten für jede einzelne Bahn.'
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: achtundzwanzig
  rationale: Direkte Wiedergabe der Kardinalzahl in üblicher deutscher Wortstellung.
- source_word: בָּאַמָּה
  choice: Ellen
  rationale: אַמָּה ist die antike Längeneinheit »Elle«; nach den Zahlwörtern steht im Deutschen idiomatisch der Plural.
- source_word: וְרֹחַב
  choice: und ... breit
  rationale: Die adjektivische Maßangabe bildet im modernen Deutsch eine natürliche Entsprechung zum vorangehenden »lang«.
- source_word: אַרְבַּע
  choice: vier
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: מִדָּה אַחַת
  choice: dasselbe Maß
  rationale: Wörtlich steht »ein Maß«; im Zusammenhang drückt die Wendung aus, dass sämtliche Bahnen übereinstimmende Abmessungen haben.
- source_word: לְכָל הַיְרִיעֹת
  choice: alle Zeltbahnen
  rationale: Die Präpositionalphrase bezeichnet den gesamten Satz von Bahnen, für den das einheitliche Maß gilt.
theological_decisions: []
translation_notes:
  register: Moderne, sachliche und würdige Sprache für eine Bauanweisung. Die Wiederholung des hebräischen Nominalausdrucks wird distributiv mit »jede« wiedergegeben; »Zeltbahn« hält den Bezug zur textilen Zeltdecke klar.
