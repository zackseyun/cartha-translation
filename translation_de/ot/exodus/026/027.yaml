  register: Moderne, würdige Standardsprache mit sachlichem Ton einer Bauanweisung. „Wohnzelt“ dient als verständliche und quellennähere Bezeichnung für das Heiligtum; die Satzstruktur bewahrt den aufzählenden Rhythmus des Hebräischen.
