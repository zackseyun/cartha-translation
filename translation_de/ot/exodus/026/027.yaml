  text: וַ/חֲמִשָּׁ֣ה בְרִיחִ֔ם לְ/קַרְשֵׁ֥י צֶֽלַע הַ/מִּשְׁכָּ֖ן הַ/שֵּׁנִ֑ית וַ/חֲמִשָּׁ֣ה בְרִיחִ֗ם לְ/קַרְשֵׁי֙ צֶ֣לַע הַ/מִּשְׁכָּ֔ן לַ/יַּרְכָתַ֖יִם יָֽמָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/027.yaml
  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the side of the tabernacle at the rear westward.
translation:
  language: de
  text: und fünf Riegel für die Bretter der zweiten Seite des Wohnzeltes[a] und fünf Riegel für die Bretter an der Rückseite des Wohnzeltes, nach Westen hin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der anderen Seite des Wohnzeltes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „für die rückwärtigen Teile, westwärts“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: Riegel
  rationale: Das Wort bezeichnet hier die waagerechten Holzriegel, welche die Bretter des Wohnzeltes zusammenhielten. „Riegel“ ist im Deutschen präzise und natürlich.
- source_word: קַרְשֵׁי
  choice: Bretter
  rationale: קֶרֶשׁ bezeichnet die hölzernen Bauteile der Konstruktion. „Bretter“ bewahrt die traditionelle und gegenständlich zurückhaltende Wiedergabe; „Rahmen“ wäre stärker deutend.
- source_word: צֶלַע
  choice: Seite
  rationale: Im architektonischen Zusammenhang bezeichnet צֶלַע eine Seite des Wohnzeltes.
- source_word: הַשֵּׁנִית
  choice: der zweiten
  rationale: Die wörtliche Bedeutung „zweiten“ bleibt erhalten, obwohl im Zusammenhang auch „anderen“ gemeint sein kann.
- source_word: הַמִּשְׁכָּן
  choice: des Wohnzeltes
  rationale: מִשְׁכָּן bezeichnet hier das heilige Zeltheiligtum. „Wohnzelt“ bewahrt sowohl den Bezug zum Wohnen als auch die konkrete Zeltgestalt und ist im modernen Deutsch verständlich.
- source_word: לַיַּרְכָתַיִם
  choice: an der Rückseite
  rationale: Das Wort bezeichnet im Bauzusammenhang den hintersten beziehungsweise rückwärtigen Teil. „An der Rückseite“ gibt die räumliche Funktion natürlich wieder.
- source_word: יָמָּה
  choice: nach Westen hin
  rationale: Der Richtungsadverb bezeichnet die westliche Richtung; „nach Westen hin“ erhält seine adverbiale Form.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: und fünf ... und fünf
  rationale: Die wiederholte Verbindung mit ו wird beibehalten und spiegelt den aufzählenden Aufbau der Bauanweisung.
