base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/035.yaml
  text: And you shall place the table outside the veil[a], and the lampstand opposite the table on the south side of the tabernacle[b]; and you shall put the table on the north side.
translation:
  language: de
  text: Du sollst den Tisch außerhalb des Vorhangs[a] aufstellen und den Leuchter dem Tisch gegenüber an der Südseite der Wohnung aufstellen; den Tisch aber sollst du an die Nordseite stellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet den inneren Trennvorhang der Wohnung.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Du sollst … aufstellen
  rationale: שׂוּם bedeutet hier »setzen, stellen, platzieren«. »Aufstellen« ist für die Anordnung eines Einrichtungsgegenstands natürlich und präzise.
- source_word: הַשֻּׁלְחָן
  choice: den Tisch
  rationale: Das Substantiv bezeichnet schlicht den Tisch. Seine nähere kultische Funktion wird in diesem Vers nicht ausdrücklich genannt und daher nicht ergänzt.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: außerhalb des Vorhangs
  rationale: מִחוּץ bezeichnet die Lage außerhalb; פָּרֹכֶת ist der innere Trennvorhang der Wohnung. »Vorhang« ist im Deutschen sachlich und idiomatisch.
- source_word: הַמְּנֹרָה
  choice: den Leuchter
  rationale: מְנוֹרָה bezeichnet hier den Leuchter. Die Übersetzung vermittelt die Bedeutung unmittelbar, statt das hebräische Wort lediglich zu transkribieren.
- source_word: נֹכַח
  choice: gegenüber
  rationale: Das Wort beschreibt eine entsprechende Position auf der anderen Seite; »gegenüber« gibt die räumliche Beziehung knapp und genau wieder.
- source_word: עַל צֶלַע הַמִּשְׁכָּן תֵּימָנָה
  choice: an der Südseite der Wohnung
  rationale: צֶלַע bezeichnet die Seite, תֵּימָנָה die Richtung nach Süden. מִשְׁכָּן wird als »Wohnung« wiedergegeben, da es die für Gottes Gegenwart errichtete Wohnstätte bezeichnet.
- source_word: תִּתֵּן
  choice: sollst du … stellen
  rationale: נָתַן hat hier im Zusammenhang mit der Einrichtung die Bedeutung »hinstellen, platzieren«. »Stellen« ist im Deutschen natürlich.
- source_word: עַל צֶלַע צָפוֹן
  choice: an die Nordseite
  rationale: צֶלַע bezeichnet die Seite und צָפוֹן den Norden. Der Akkusativ mit »an« entspricht idiomatisch der durch das Verb ausgedrückten Platzierung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte göttliche Anweisung wird mit »Du sollst« wiedergegeben. »Wohnung« wahrt die Grundbedeutung von מִשְׁכָּן und vermeidet eine unnötige konfessionelle Festlegung; die räumlichen Angaben bleiben eng am Hebräischen.
