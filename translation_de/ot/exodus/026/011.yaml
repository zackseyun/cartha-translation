  text: וְ/עָשִׂ֛יתָ קַרְסֵ֥י נְחֹ֖שֶׁת חֲמִשִּׁ֑ים וְ/הֵבֵאתָ֤ אֶת הַ/קְּרָסִים֙ בַּ/לֻּ֣לָאֹ֔ת וְ/חִבַּרְתָּ֥ אֶת הָ/אֹ֖הֶל וְ/הָיָ֥ה אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/011.yaml
  text: And you shall make fifty bronze clasps[a], and put the clasps into the loops, and join the tent together[c][b], so that it may be one.
translation:
  language: de
  text: Fertige fünfzig Verschlüsse aus Bronze[a] an, stecke die Verschlüsse in die Schlaufen und füge das Zelt zusammen, sodass es ein Ganzes bildet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus Kupfer“. Das hebräische Wort נְחֹשֶׁת kann je nach Zusammenhang Kupfer oder Bronze bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und es soll eins sein“.'
    reason: literal_rendering
lexical_decisions:
- source_word: קַרְסֵי נְחֹשֶׁת
  choice: Verschlüsse aus Bronze
  rationale: קַרְסִים bezeichnet hier Verbindungselemente für die Zeltbahnen; „Verschlüsse“ ist im Deutschen treffender als das allgemeinere „Haken“. נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen; im Zusammenhang der Metallarbeiten am Heiligtum ist „Bronze“ die übliche Wiedergabe, während die stoffliche Mehrdeutigkeit in der Fußnote erhalten bleibt.
- source_word: חֲמִשִּׁים
  choice: fünfzig
  rationale: Eindeutige Kardinalzahl, die die Anzahl der Verschlüsse angibt.
- source_word: וְהֵבֵאתָ אֶת הַקְּרָסִים בַּלֻּלָאֹת
  choice: stecke die Verschlüsse in die Schlaufen
  rationale: Der Hifil von בוא beschreibt hier, dass die Verschlüsse in die Schlaufen hineingebracht beziehungsweise eingesetzt werden. „Stecken“ gibt den konkreten Arbeitsvorgang natürlich und genau wieder.
- source_word: וְחִבַּרְתָּ אֶת הָאֹהֶל
  choice: füge das Zelt zusammen
  rationale: חבר bedeutet verbinden oder zusammenfügen. „Das Zelt“ bewahrt das ausdrücklich genannte Objekt הָאֹהֶל und bezeichnet hier die aus den Bahnen gebildete Zeltkonstruktion.
- source_word: וְהָיָה אֶחָד
  choice: sodass es ein Ganzes bildet
  rationale: Die Schlussklausel beschreibt das Ergebnis des Zusammenfügens. Die idiomatische deutsche Formulierung macht die funktionale Einheit deutlich, ohne eine zusätzliche theologische Deutung einzutragen.
theological_decisions: []
translation_notes:
  register: Moderne, klare und zugleich würdevolle Bauanweisung. Die hebräischen Weqatal-Formen werden als direkte Arbeitsanweisungen wiedergegeben. „Ein Ganzes“ ist im Deutschen natürlicher als „eins“, während die wörtliche Form in der Fußnote dokumentiert wird.
