  verdict: revise
  source_fidelity: 'Die Übersetzung gibt den Überschuss der Zeltbahnen und die einzelne halbe Bahn grundsätzlich zutreffend wieder und bewahrt die Unterscheidung zwischen אֹהֶל („Zelt“) und מִשְׁכָּן („Wohnung“). Bei עַל אֲחֹרֵי ist jedoch „über die Rückseite“ genauer als „an der Rückseite“: Der Stoff liegt über bzw. hängt über den hinteren Teil der Wohnung.'
  naturalness: Der Satz ist in modernem Standarddeutsch verständlich und angemessen sachlich. „Zeltbahnen“ ist gegenüber „Bahnen des Zeltes“ etwas kompakter, ohne den Sinn zu verändern. „Überstehende Bahn“ macht den räumlich-funktionalen Charakter des hebräischen Ausdrucks idiomatisch sichtbar.
  terminology: „Überhang“, „Zeltbahn“ und „Wohnung“ sind in diesem technischen Kontext tragfähige Wiedergaben. Die bisherige Fußnote b geht mit „darunterliegende“ über den Wortlaut hinaus; der Text unterscheidet die Begriffe, legt aber hier keine räumliche Unterordnung der Wohnung unter die Deckschicht als Erklärung fest.
  issues:
