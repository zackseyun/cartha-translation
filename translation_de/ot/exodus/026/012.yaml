  text: וְ/סֶ֨רַח֙ הָ/עֹדֵ֔ף בִּ/ירִיעֹ֖ת הָ/אֹ֑הֶל חֲצִ֤י הַ/יְרִיעָה֙ הָ/עֹדֶ֔פֶת תִּסְרַ֕ח עַ֖ל אֲחֹרֵ֥י הַ/מִּשְׁכָּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/012.yaml
  text: And the overhang that remains from the tent curtains[a]—the half curtain that remains over[b]—shall hang over the back of the tabernacle.
translation:
  language: de
  text: Der Überhang, der von den Zeltbahnen übrig bleibt[a] – die Hälfte der überstehenden Bahn –, soll über die Rückseite der Wohnung[b] herabhängen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der überschüssige Teil, der von den Zeltbahnen übrig bleibt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen werden hier »Zelt« und »Wohnung« unterschieden: Das »Zelt« bezeichnet die Deckschicht, die »Wohnung« die Heiligtumskonstruktion.'
    reason: cultural_note
lexical_decisions:
- source_word: סֶרַח
  choice: Überhang
  rationale: Das Substantiv bezeichnet den überschüssigen, überstehenden Teil; »Überhang« verbindet den Gedanken des Restes mit seiner räumlichen Funktion.
- source_word: הָעֹדֵף / הָעֹדֶפֶת
  choice: übrig bleibt / überschüssigen
  rationale: Die beiden Partizipien bezeichnen das, was über das benötigte Maß hinaus vorhanden ist. Die leicht variierte Wiedergabe ist im Deutschen natürlich und bewahrt die Wiederholung des Gedankens.
- source_word: יְרִיעֹת / יְרִיעָה
  choice: Bahnen / Bahn
  rationale: Gemeint sind große Stoffbahnen der Zeltabdeckung. »Bahnen« ist im baulichen Zusammenhang genauer und natürlicher als das leicht missverständliche »Vorhänge«.
- source_word: הָאֹהֶל
  choice: des Zeltes
  rationale: אֹהֶל bezeichnet hier die zeltartige Deckschicht und bleibt von מִשְׁכָּן unterschieden.
- source_word: חֲצִי הַיְרִיעָה
  choice: die Hälfte der … Bahn
  rationale: Die Formulierung macht deutlich, dass die Hälfte einer einzelnen Stoffbahn gemeint ist.
- source_word: תִּסְרַח
  choice: soll … herabhängen
  rationale: Das Verb beschreibt hier, wie der überschüssige Stoff an der Rückseite nach unten hängt; »herabhängen« gibt das räumliche Bild klar wieder.
- source_word: עַל אֲחֹרֵי
  choice: an der Rückseite
  rationale: Die Wendung bezeichnet die Lage am hinteren Teil der Konstruktion. Im Deutschen ist »an der Rückseite« für einen herabhängenden Stoff idiomatisch.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: »Wohnung« gibt die Grundbedeutung und den kultischen Fachgebrauch von מִשְׁכָּן wieder und wahrt die Unterscheidung vom »Zelt«.
theological_decisions:
- issue: Unterscheidung zwischen אֹהֶל und מִשְׁכָּן
  choice: »Zelt« für אֹהֶל und »Wohnung« für מִשְׁכָּן
  alternative: Beide Ausdrücke mit »Stiftshütte« wiederzugeben
  rationale: Der hebräische Text bezeichnet zuerst die zeltartige Abdeckung und danach die Wohnkonstruktion mit unterschiedlichen Wörtern. Die Übersetzung bewahrt diese sachlich und theologisch bedeutsame Unterscheidung, ohne sie weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen erläuternden Einschub, bleibt aber durch Gedankenstriche gut lesbar. »Bahnen« vermeidet die moderne Assoziation von »Vorhängen« mit senkrecht aufgehängten Gardinen.
