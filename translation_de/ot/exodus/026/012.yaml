    issue: „an der Rückseite“ schwächt die räumliche Aussage von עַל אֲחֹרֵי ab.
    rationale: Die Präposition עַל bezeichnet hier das Über-/Darüberhängen des überschüssigen Stoffes über den hinteren Bereich. „Über die Rückseite“ bildet dies genauer ab.
  - severity: low
    issue: Fußnote b enthält die zusätzliche Aussage „darunterliegende Heiligtumskonstruktion“.
    rationale: Die hebräischen Ausdrücke werden unterschieden, aber die räumliche Erläuterung „darunterliegende“ ist an dieser Stelle nicht ausdrücklich formuliert und sollte nicht als Textinformation dargestellt werden.
  revised_text: Der Überhang, der von den Zeltbahnen übrig bleibt[a] – die Hälfte der überstehenden Bahn –, soll über die Rückseite der Wohnung[b] herabhängen.
