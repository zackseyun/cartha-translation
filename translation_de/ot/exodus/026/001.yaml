  yaml_path: translation/ot/exodus/026/001.yaml
  text: And you shall make the tabernacle with ten curtains of finely twisted linen[a], and blue and purple and scarlet yarn; with cherubim, the work of a skillful designer, you shall make them.
translation:
  language: de
  text: 'Die Wohnung sollst du aus zehn Zeltbahnen anfertigen: aus feinem gezwirntem Leinen sowie blauem, purpurfarbenem und scharlachrotem Garn. Du sollst sie mit Kerubim in kunstvoller Musterarbeit anfertigen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du sollst sie mit Kerubim als Werk eines kunstvollen Gestalters anfertigen.“ Die hebräische Wendung bezeichnet kunstvolle, planvoll gestaltete Textilarbeit; die genaue textile Technik wird nicht ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: מִשְׁכָּן bezeichnet das heilige Wohnen beziehungsweise die Zeltwohnung Gottes. „Wohnung“ bewahrt die Wortbedeutung und ist im Deutschen als kultischer Fachausdruck in diesem Zusammenhang verständlich.
- source_word: יְרִיעֹת
  choice: Zeltbahnen
  rationale: Gemeint sind große Stoffbahnen, aus denen die Wohnung gebildet wird. „Zeltbahnen“ ist in diesem Bauzusammenhang genauer und natürlicher als das allgemeinere „Vorhänge“.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: gezwirntes feines Leinen
  rationale: שֵׁשׁ bezeichnet feines Leinen, מָשְׁזָר gezwirntes beziehungsweise mehrfach gedrehtes Garn. Die Wiedergabe nennt Material und Verarbeitung.
- source_word: תְּכֵלֶת
  choice: blaues Garn
  rationale: Der Ausdruck bezeichnet einen blau bis blaupurpurn gefärbten Textilstoff. „Blau“ ist die herkömmliche, klare Wiedergabe; „Garn“ wird aus dem Textilzusammenhang ergänzt.
- source_word: אַרְגָּמָן
  choice: purpurfarbenes Garn
  rationale: אַרְגָּמָן bezeichnet purpurgefärbtes Material. Die Formulierung passt zur Aufzählung der Garne.
- source_word: תֹלַעַת שָׁנִי
  choice: scharlachrotes Garn
  rationale: Die feste Wendung bezeichnet scharlach- beziehungsweise karmesinrot gefärbtes Textilmaterial; „Garn“ macht den hier vorausgesetzten Textilbezug deutlich.
- source_word: כְּרֻבִים
  choice: Kerubim
  rationale: „Kerubim“ bewahrt den biblisch-kultischen Fachbegriff und vermeidet irreführende Vorstellungen, die mit „Engelsfiguren“ verbunden sein könnten.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: kunstvoll eingewebt
  rationale: Die Wendung bezeichnet geplante, kunstfertige Musterarbeit am Gewebe. Im Textilkontext gibt „kunstvoll eingewebt“ die Funktion natürlicher wieder als eine wörtliche Berufsbezeichnung, ohne die genaue Technik mit völliger Sicherheit festzulegen.
- source_word: וְאֶת ... תַּעֲשֶׂה
  choice: Die Wohnung sollst du ... anfertigen
  rationale: Die deutsche Satzstellung bewahrt die Hervorhebung des Gegenstands. Das einleitende וְ führt die vorherigen Anweisungen fort, muss im Deutschen jedoch nicht mechanisch mit „und“ wiedergegeben werden.
- source_word: אֹתָם
  choice: sie
  rationale: Das maskuline Pluralpronomen verweist grammatisch auf die zehn Zeltbahnen und wird im zweiten Teilsatz ausdrücklich wiedergegeben.
