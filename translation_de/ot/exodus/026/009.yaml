base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/009.yaml
  text: And you shall join the five curtains separately[a], and the six curtains separately; and you shall fold the sixth curtain double at the front of the tent.
translation:
  language: de
  text: Du sollst die fünf Zeltbahnen jeweils miteinander verbinden und ebenso die sechs Zeltbahnen jeweils miteinander verbinden. Die sechste Bahn sollst du an der Vorderseite des Zeltes doppelt legen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Die sechste Bahn gegenüber der Vorderseite des Zeltes umschlagen.'
    reason: Das Verb כָּפַל kann das Doppeltlegen bzw. Umschlagen bezeichnen; אֶל מוּל פְּנֵי kann räumlich auch „gegenüber der Vorderseite“ wiedergegeben werden.
lexical_decisions:
- source_word: חִבַּרְתָּ
  choice: miteinander verbinden
  rationale: Das Verb חָבַר bezeichnet das Verbinden einzelner Bahnen zu einer zusammengehörigen Einheit. „Miteinander verbinden“ ist im Deutschen klar und sachgerecht.
- source_word: יְרִיעֹת / יְרִיעָה
  choice: Zeltbahnen / Bahn
  rationale: יְרִיעָה bezeichnet hier die großflächigen Stoffbahnen der Zeltkonstruktion. „Zeltbahnen“ ist im baulichen Zusammenhang präziser als „Vorhänge“ und für heutige Leser verständlich.
- source_word: לְבָד
  choice: jeweils
  rationale: 'לְבָד grenzt die beiden Gruppen voneinander ab: Die fünf und die sechs Bahnen werden jeweils als eigene Einheit verbunden. Das deutsche „jeweils“ gibt diesen distributiven Sinn natürlich wieder.'
- source_word: כָפַלְתָּ
  choice: doppelt legen
  rationale: כָּפַל bedeutet verdoppeln beziehungsweise zusammenlegen. „Doppelt legen“ bewahrt den räumlich-konstruktiven Sinn, ohne die genaue Art des Faltens stärker festzulegen als der hebräische Text.
- source_word: אֶל מוּל פְּנֵי
  choice: an der Vorderseite
  rationale: Die Wendung bezeichnet eine Lage vor beziehungsweise gegenüber der Vorderseite. Im vorliegenden Bauzusammenhang ist „an der Vorderseite“ eine natürliche, räumlich klare Wiedergabe.
- source_word: הָאֹהֶל
  choice: des Zeltes
  rationale: Das hebräische אֹהֶל bedeutet hier wörtlich „Zelt“. Diese Wiedergabe wahrt die Wortwahl des Ausgangstextes, statt deutender „Stiftshütte“ zu übersetzen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit sachlicher Terminologie für die Zeltkonstruktion. Die Wiederholung von „jeweils miteinander verbinden“ macht die zwei getrennten Gruppen ausdrücklich sichtbar; „Zeltbahnen“ vermeidet die missverständliche Vorstellung frei hängender Vorhänge.
