    rationale: Das Hebräische reiht die Angabe „auf vier silbernen Sockeln“ an. Die Aussage ist sachlich kompatibel, doch die Wiederholung der Säulen mit „sollen ... stehen“ ist eine unnötige Explizierung. Eine direkte Anbindung an die vorangehende Beschreibung ist quellennäher.
