  rationale: Die Revision ersetzt das weniger übliche „Fußgestellen“ im Haupttext durch „Sockeln“, bewahrt die lexikalische Alternative in der Fußnote und gibt die hebräische Reihung ohne zusätzliches finites Prädikat wieder. Die Zugehörigkeit der goldenen Haken zu den Säulen bleibt klar, ohne über den Text hinauszugehen.
