revisions:
- from: Du sollst ihn an vier Säulen aus Akazienholz aufhängen, die mit Gold überzogen sind. Ihre Haken sollen aus Gold sein, und die Säulen sollen auf vier silbernen Fußgestellen[a] stehen.
