  text: And you shall hang it on four pillars of acacia wood overlaid with gold[a], their hooks being of gold, on four silver bases.
translation:
  language: de
  text: Du sollst ihn an vier Säulen aus Akazienholz aufhängen, die mit Gold überzogen sind und goldene Haken haben, auf vier silbernen Sockeln[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Fußgestellen.'
    reason: אַדְנֵי bezeichnet tragende Basen beziehungsweise Sockel, in denen die Säulen eingesetzt sind.
lexical_decisions:
- source_word: וְנָתַתָּה אֹתָהּ
  choice: Du sollst ihn … aufhängen
  rationale: נתן bedeutet grundsätzlich »geben, setzen, anbringen«. Da der Gegenstand der im vorherigen Vers genannte Vorhang ist und er an Säulen angebracht wird, gibt »aufhängen« die gemeinte Handlung im Deutschen präzise und natürlich wieder. Das maskuline Pronomen richtet sich nach dem deutschen Bezugswort »Vorhang«.
- source_word: עַל אַרְבָּעָה עַמּוּדֵי שִׁטִּים
  choice: an vier Säulen aus Akazienholz
  rationale: עַל bezeichnet hier die Befestigung an den Stützen; dafür ist deutsches »an« idiomatischer als »auf«. עַמּוּדֵי bezeichnet tragende, aufrecht stehende Säulen, und שִׁטִּים meint das als Baumaterial verwendete Akazienholz.
- source_word: מְצֻפִּים זָהָב
  choice: die mit Gold überzogen sind
  rationale: Das passive Partizip von צפה bezeichnet eine Verkleidung beziehungsweise einen Überzug. »Mit Gold überzogen« ist im modernen Deutschen klar und sachlich.
- source_word: וָוֵיהֶם זָהָב
  choice: Ihre Haken sollen aus Gold sein
  rationale: וָוִים sind hier die Vorrichtungen, an denen der Vorhang befestigt wird; »Haken« entspricht ihrer Funktion. Die knappe hebräische Nominalkonstruktion wird als natürlicher deutscher Satz wiedergegeben.
- source_word: עַל אַרְבָּעָה אַדְנֵי כָסֶף
  choice: auf vier silbernen Fußgestellen
  rationale: אֲדָנִים sind tragende Unterteile, in welche die Säulen eingesetzt werden. »Fußgestelle« ist anschauliches modernes Deutsch; »Sockel« bleibt als lexikalische Alternative in der Fußnote erhalten.
