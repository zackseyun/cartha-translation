  language: en
  yaml_path: translation/ot/exodus/026/028.yaml
  text: And the middle bar[a], in the midst of the frames, shall extend from end to end.
translation:
  language: de
  text: Und der mittlere Riegel inmitten der Rahmen[a] soll von einem Ende bis zum anderen verlaufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bohlen«. Das hebräische Wort bezeichnet die aufrechten Bauteile der Stiftshütte; »Rahmen« vermeidet hier den Eindruck einfacher flacher Bretter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרִיחַ
  choice: Riegel
  rationale: Im Zusammenhang mit der Stiftshütte bezeichnet בְּרִיחַ eine waagerechte Strebe, welche die aufrechten Bauteile zusammenhält. »Riegel« ist dafür im Deutschen ein natürlicher baulicher Ausdruck.
- source_word: הַתִּיכֹן
  choice: mittlere
  rationale: Das Adjektiv kennzeichnet den zwischen den übrigen Riegeln angeordneten Riegel; »mittlere« gibt die räumliche Zuordnung klar wieder.
- source_word: בְּתוֹךְ
  choice: inmitten
  rationale: בְּתוֹךְ bezeichnet die Lage innerhalb beziehungsweise zwischen den Rahmen, ohne die genaue bauliche Führung des Riegels festzulegen.
- source_word: הַקְּרָשִׁים
  choice: Rahmen
  rationale: קְרָשִׁים meint hier die aufrechten tragenden Bauteile der Stiftshütte. »Rahmen« vermeidet die möglicherweise irreführende Vorstellung einfacher flacher Bretter; die traditionelle Alternative wird in einer Fußnote genannt.
- source_word: מַבְרִחַ
  choice: soll … reichen
  rationale: Das Partizip beschreibt den Riegel als die gesamte Strecke überspannend. »Reichen« bewahrt diesen räumlichen Sinn, ohne zusätzlich festzulegen, dass er durch Öffnungen hindurchgeführt wurde.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: von einem Ende bis zum anderen
  rationale: Die Wendung bezeichnet die vollständige Ausdehnung über die ganze Länge und wird so natürlich und präzise wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die Satzfügung bleibt nahe an der hebräischen Bauanweisung, während »soll … reichen« im Deutschen natürlich klingt und die mechanische Anordnung nicht überbestimmt.
