  yaml_path: translation/ot/exodus/026/020.yaml
  text: And for the second side of the tabernacle[a], on the north side, twenty frames.
translation:
  language: de
  text: 'Und für die zweite Seite der Wohnung, an der Nordseite: zwanzig Rahmen[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bretter“. Das hebräische Wort bezeichnet die aufrechten Bauteile der Wohnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְצֶלַע
  choice: Und für die … Seite
  rationale: Die Verbindung aus Konjunktion, Präposition und צֶלַע führt die nächste Bauangabe ein. Im architektonischen Zusammenhang bezeichnet צֶלַע die Seite beziehungsweise Seitenwand.
- source_word: הַמִּשְׁכָּן
  choice: der Wohnung
  rationale: מִשְׁכָּן bezeichnet hier das Heiligtum als Gottes Wohnung. „Wohnung“ gibt den hebräischen Ausdruck verständlich und ohne den altertümlichen Fachbegriff „Stiftshütte“ wieder.
- source_word: הַשֵּׁנִית
  choice: die zweite
  rationale: Das Adjektiv kennzeichnet die zweite der beiden entsprechenden Längsseiten und wird daher ausdrücklich als Ordnungszahl wiedergegeben.
- source_word: לִפְאַת צָפוֹן
  choice: an der Nordseite
  rationale: Die Wendung gibt die nördliche Ausrichtung beziehungsweise Lage dieser Seite an; die deutsche Formulierung ist in einer Baubeschreibung natürlich.
- source_word: עֶשְׂרִים
  choice: zwanzig
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: קָרֶשׁ
  choice: Rahmen
  rationale: קֶרֶשׁ bezeichnet die aufrechten Bauteile der Wände der Wohnung. „Rahmen“ hebt ihre tragende bauliche Funktion hervor; „Bretter“ bleibt als traditionelle lexikalische Alternative möglich.
