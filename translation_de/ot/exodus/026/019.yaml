base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/019.yaml
  text: 'And you shall make forty silver bases under the twenty frames: two bases under one frame for its two tenons[b][a], and two bases under the next frame for its two tenons.'
translation:
  language: de
  text: 'Und du sollst für die zwanzig Bretter[a] vierzig Silbersockel[b] anfertigen: zwei Sockel unter dem einen Brett für seine beiden Zapfen und zwei Sockel unter dem nächsten Brett für seine beiden Zapfen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Planken“. Das hebräische Wort bezeichnet hier die aufrecht stehenden hölzernen Konstruktionsteile des Heiligtums.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sockel aus Silber“; das hebräische Wort kann im Heiligtumsbau einen sockelartigen Teil mit Hülsenfunktion bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  choice: Sockel aus Silber
  rationale: אֶדֶן bezeichnet im Zusammenhang des Heiligtums ein tragendes, wohl hülsenartiges Fundamentteil. „Sockel“ ist im heutigen Deutsch verständlich und passt zur baulichen Funktion; die Materialangabe wird natürlich mit „aus Silber“ wiedergegeben.
- source_word: תַּעֲשֶׂה
  choice: du sollst … anfertigen
  rationale: Das Qal-Imperfekt der 2. Person Singular hat hier in der Bauanweisung gebietenden Charakter. „Sollst … anfertigen“ bewahrt den Anweisungston und ist für Bauteile idiomatischer als das allgemeinere „machen“.
- source_word: תַּחַת
  choice: unter
  rationale: Die Präposition bezeichnet unmittelbar die Lage der Sockel unter den aufrechten Bauteilen.
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ
  choice: Rahmenteil
  rationale: קֶרֶשׁ bezeichnet hier die aufrechten hölzernen Konstruktionsteile des Heiligtums. „Rahmenteil“ vermittelt ihre bauliche Funktion, ohne sie vorschnell als bloße Bretter zu verstehen.
- source_word: שְׁנֵי אֲדָנִים
  choice: zwei Sockel
  rationale: Die Wiederholung nennt für jedes aufrechte Bauteil zwei tragende Sockel; dieselbe Wiedergabe wahrt die terminologische Einheitlichkeit.
- source_word: לִשְׁתֵּי יְדֹתָיו
  choice: für seine beiden Zapfen
  rationale: יָדוֹת bedeutet wörtlich „Hände“, wird hier jedoch als bautechnischer Ausdruck für die beiden vorspringenden Verbindungsstücke gebraucht. „Zapfen“ ist dafür der präzise und verständliche deutsche Fachausdruck.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: dem einen Rahmenteil … dem nächsten Rahmenteil
  rationale: Die wiederholte hebräische Wendung ist distributiv gemeint. „Dem nächsten“ vermeidet im Deutschen eine missverständliche oder schwerfällige Wiederholung und verdeutlicht die fortlaufende Zuordnung.
