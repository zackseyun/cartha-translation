  text: And for the rear side of the tabernacle[a], westward, you shall make six boards.
translation:
  language: de
  text: Für die Rückseite der Wohnstätte, nach Westen hin, sollst du sechs Bretter[a] anfertigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rahmen“, wenn die Bauteile als offene Rahmenkonstruktionen und nicht als massive Bretter verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: Für die Rückseite
  rationale: יַרְכְּתֵי bezeichnet in dieser Baubeschreibung den hinteren beziehungsweise abgelegenen Teil. „Rückseite“ ist im Deutschen die natürliche architektonische Wiedergabe.
- source_word: הַמִּשְׁכָּן
  choice: der Wohnstätte
  rationale: מִשְׁכָּן bezeichnet das Heiligtum als Ort des Wohnens Gottes. „Wohnstätte“ gibt die Wortbedeutung verständlich wieder und wahrt den Bezug auf das bereits beschriebene Heiligtumszelt.
- source_word: יָמָּה
  choice: nach Westen hin
  rationale: Das Richtungswort bedeutet wörtlich „meerwärts“ und bezeichnet im biblischen Orientierungssystem den Westen. „Nach Westen hin“ bewahrt seine adverbiale Funktion.
- source_word: תַּעֲשֶׂה
  choice: sollst du … anfertigen
  rationale: Das Qal-Imperfekt der 2. Person Singular hat hier im Rahmen der Bauanweisungen direktiven Sinn. „Anfertigen“ passt zu den herzustellenden Bauteilen.
- source_word: שִׁשָּׁה
  choice: sechs
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: קְרָשִׁים
  choice: Bretter
  rationale: קֶרֶשׁ bezeichnet die tragenden hölzernen Bauteile der Wände. „Bretter“ ist die herkömmliche und im Zusammenhang verständliche Wiedergabe; ob offene Rahmen gemeint waren, bleibt unsicher.
