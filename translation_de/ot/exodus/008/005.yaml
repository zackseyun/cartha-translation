base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/005.yaml
  text: 'And Moses said to Pharaoh[a], “Have this honor over me: when shall I plead for you, for your servants, and for your people, to cut off the frogs from you and from your houses? Only in the Nile shall they remain.”'
translation:
  language: de
  text: 'Und Mose sagte zum Pharao: „Du hast mir gegenüber den Vorrang[a]: Für wann soll ich für dich, für deine Diener und für dein Volk inständig bitten, damit die Frösche von dir und aus deinen Häusern beseitigt werden? Nur im Nil sollen sie bleiben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Bestimme du den Zeitpunkt für mich.“ Wörtlicher etwa: „Rühme dich über mich.“ Die hebräische Wendung ist schwierig; Mose räumt dem Pharao ein, festzulegen, wann Mose für ihn bitten soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְפָּאֵר עָלַי
  choice: Du sollst mir gegenüber die Ehre haben
  rationale: Die schwierige hebräische Wendung enthält die Vorstellung, sich jemandem gegenüber zu rühmen beziehungsweise einen Vorrang zu genießen. Die gewählte Formulierung bewahrt dieses Bild, während der folgende Fragesatz verdeutlicht, dass der Pharao den Zeitpunkt bestimmen darf.
- source_word: לְמָתַי
  choice: Für wann
  rationale: Die Formulierung gibt die auf einen festzulegenden Zeitpunkt gerichtete Frage genau und in natürlichem Deutsch wieder.
- source_word: אַעְתִּיר
  choice: inständig bitten
  rationale: Das Hifil von עתר bezeichnet hier ein dringliches Bitten, dem Zusammenhang nach an Gott gerichtet. „Inständig bitten“ ist verständlich und vermeidet einen unnötig technischen theologischen Ausdruck.
- source_word: לְךָ וְלַעֲבָדֶיךָ וּלְעַמְּךָ
  choice: für dich, für deine Diener und für dein Volk
  rationale: Die Wiederholung von „für“ bildet die wiederholte hebräische Präposition ab und hebt den umfassenden Kreis der Betroffenen hervor.
- source_word: לְהַכְרִית
  choice: damit … beseitigt werden
  rationale: כרת bedeutet grundsätzlich „abschneiden/ausrotten“. Da die Frösche nicht völlig vernichtet werden, sondern im Nil bleiben, bringt „beseitigt werden“ die kontextuelle Bedeutung von ihrer Entfernung aus den betroffenen Bereichen sachgerecht zum Ausdruck.
- source_word: הַצֲפַרְדְּעִים
  choice: die Frösche
  rationale: Direkte und eindeutige Wiedergabe der Plagetiere.
- source_word: מִמְּךָ וּמִבָּתֶּיךָ
  choice: von dir und aus deinen Häusern
  rationale: Im Deutschen passt bei der Person „von“, bei den räumlich verstandenen Häusern dagegen „aus“. Die Unterscheidung erhält beide Bezugsbereiche klar.
- source_word: רַק
  choice: Nur
  rationale: 'Kennzeichnet die ausdrückliche Ausnahme: Außerhalb des Nils sollen die Frösche beseitigt werden.'
- source_word: בַּיְאֹר
  choice: im Nil
  rationale: יְאֹר bezeichnet im ägyptischen Kontext des Exodus den Nil und nicht irgendeinen Fluss.
- source_word: תִּשָּׁאַרְנָה
  choice: sollen sie bleiben
  rationale: Das Nifal von שׁאר bezeichnet das Zurück- oder Übrigbleiben. Die Wortstellung nach „Nur im Nil“ erhält die örtliche Hervorhebung.
