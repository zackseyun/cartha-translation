  register: Modernes, würdevolles Standarddeutsch. Die schwierige hebräische Redewendung bleibt im Haupttext erkennbar, wird aber durch den unmittelbaren Kontext und eine Fußnote verständlich gemacht. „Diener“ wahrt den höfischen Zusammenhang, ohne unnötig altertümlich zu wirken.
