  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לֹ֤א נָכוֹן֙ לַ/עֲשׂ֣וֹת כֵּ֔ן כִּ֚י תּוֹעֲבַ֣ת מִצְרַ֔יִם נִזְבַּ֖ח לַ/יהוָ֣ה אֱלֹהֵ֑י/נוּ הֵ֣ן נִזְבַּ֞ח אֶת תּוֹעֲבַ֥ת מִצְרַ֛יִם לְ/עֵינֵי/הֶ֖ם וְ/לֹ֥א יִסְקְלֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/022.yaml
  text: But Moses said[a], “It would not be right to do so, because we would sacrifice to Yahweh our God what is detestable to the Egyptians. If we sacrifice what is detestable to the Egyptians before their eyes, will they not stone us?”
translation:
  language: de
  text: 'Mose aber sagte: „Es ist nicht angebracht, das zu tun; denn wir würden Jahwe, unserem Gott, opfern, was den Ägyptern ein Gräuel ist.[a] Wenn wir vor ihren Augen opfern, was den Ägyptern ein Gräuel ist, werden sie uns dann nicht steinigen?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „den Gräuel Ägyptens“. Gemeint ist wahrscheinlich das, was den Ägyptern als verabscheuungswürdig galt.'
    reason: lexikalische Alternative und Bewahrung der Mehrdeutigkeit der hebräischen Genitivverbindung
lexical_decisions:
- source_word: נָכוֹן
  choice: angebracht
  rationale: Das Wort bezeichnet hier, was passend, richtig oder unter den Umständen vertretbar ist. „Nicht angebracht“ gibt die praktische und moralische Unangemessenheit natürlich wieder.
- source_word: לַעֲשׂוֹת כֵּן
  choice: das zu tun
  rationale: Die hebräische Wendung bedeutet idiomatisch „so/dies zu tun“ und bezieht sich auf den zuvor vorgeschlagenen Ort des Opferns.
- source_word: תּוֹעֲבַת מִצְרַיִם
  choice: was den Ägyptern ein Gräuel ist
  rationale: Die Konstruktion kann wörtlich „Gräuel Ägyptens“ heißen. Im Zusammenhang liegt nahe, dass das Opfer beziehungsweise die Opfertiere nach ägyptischem Empfinden anstößig sind; die Fußnote bewahrt die formale Mehrdeutigkeit.
- source_word: נִזְבַּח
  choice: wir würden opfern / wir opfern
  rationale: Im ersten Satz bezeichnet das Imperfekt die unter dem Vorschlag zu erwartende Handlung und wird konditional mit „würden“ wiedergegeben; in der anschließenden ausdrücklichen Bedingung steht im Deutschen natürlich das Präsens.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Bundesname mit der im Deutschen geläufigen Form „Jahwe“ wiedergegeben.
- source_word: אֱלֹהֵינוּ
  choice: unserem Gott
  rationale: Die Possessivverbindung wird ausdrücklich bewahrt und steht nach „Jahwe“ als Apposition.
- source_word: הֵן
  choice: Wenn
  rationale: Die Partikel leitet hier eine zugespitzte hypothetische Voraussetzung ein; „Wenn“ bildet ihre Funktion im deutschen Satz klar ab.
- source_word: לְעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: Die bildhafte hebräische Wendung wird nahezu wörtlich und zugleich idiomatisch wiedergegeben.
- source_word: יִסְקְלֻנוּ
  choice: werden sie uns dann nicht steinigen?
  rationale: Das Verb bezeichnet das Bewerfen beziehungsweise Töten mit Steinen. Die negative Frage erwartet eine bejahende Antwort; „dann“ verdeutlicht im Deutschen die Folgerung, ohne den Sinn festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als solcher kenntlich gemacht und nicht durch einen Titel ersetzt.
- issue: Sinn von תּוֹעֲבַת מִצְרַיִם
  choice: was den Ägyptern ein Gräuel ist
  alternative: der Gräuel Ägyptens
  rationale: Der Kontext spricht für das, was aus ägyptischer Sicht verabscheuungswürdig ist. Da die hebräische Genitivverbindung formal knapper und mehrdeutiger ist, wird die wörtlichere Möglichkeit in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung der zentralen Wendung und die rhetorische Frage des Hebräischen bleiben erhalten; unnötige Erklärungen zu konkreten Opfertieren werden nicht in den Haupttext aufgenommen.
