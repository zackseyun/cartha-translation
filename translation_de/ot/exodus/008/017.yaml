base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/017.yaml
  text: For if you do not let my people go[a], behold, I am sending the swarm upon you, upon your servants, upon your people, and into your houses. The houses of Egypt will be filled with the swarm[b], and also the ground on which they are.
translation:
  language: de
  text: Denn wenn du mein Volk nicht ziehen lässt, dann lasse ich einen Schwarm[a] über dich, über deine Diener, über dein Volk und in deine Häuser kommen. Die Häuser Ägyptens werden sich mit dem Schwarm füllen, ebenso der Erdboden[b], auf dem sie sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Fliegenschwarm«. Das hebräische Wort עָרֹב kann einen Schwarm bezeichnen und wird traditionell als Schwarm von Fliegen verstanden; die genaue Tierart ist jedoch unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »das Land«. Das hebräische Wort אֲדָמָה kann »Erdboden« oder »Land« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Denn wenn
  rationale: Leitet eine begründende, an die vorherige Rede anschließende Bedingung ein und klingt im modernen Deutschen natürlich.
- source_word: אֵינְךָ מְשַׁלֵּחַ אֶת עַמִּי
  choice: du mein Volk nicht ziehen lässt
  rationale: Die Wendung שׁלח mit »mein Volk« bezeichnet im Exoduszusammenhang die Freilassung; »ziehen lassen« ist präzise und idiomatisch.
- source_word: הִנְנִי מַשְׁלִיחַ
  choice: dann schicke ich
  rationale: Die Konstruktion bezeichnet eine unmittelbar bevorstehende und gewisse Handlung. Das deutsche »dann« gibt die nachdrückliche Folge der Bedingung wieder, ohne das heute altertümliche »siehe« zu erzwingen.
- source_word: הֶעָרֹב
  choice: der Schwarm
  rationale: Die genaue Tierart ist unsicher. »Schwarm« bewahrt diese lexikalische Offenheit, statt die traditionelle Deutung als Fliegen in den Haupttext einzutragen.
- source_word: בְּךָ וּבַעֲבָדֶיךָ וּבְעַמְּךָ
  choice: über dich, deine Diener und dein Volk
  rationale: בְּ bezeichnet hier die von der Plage Betroffenen; »über« passt natürlich zur angekündigten Heimsuchung und bündelt die hebräische Reihung verständlich.
- source_word: וּבְבָתֶּיךָ
  choice: und in deine Häuser
  rationale: Die Ortsangabe wird im Deutschen nach dem Bewegungsverb richtungsbezogen verstanden und bereitet die folgende Aussage vom Füllen der Häuser vor.
- source_word: וּמָלְאוּ בָּתֵּי מִצְרַיִם אֶת הֶעָרֹב
  choice: Die Häuser Ägyptens werden sich mit dem Schwarm füllen
  rationale: Gibt das resultative Vollwerden idiomatisch wieder und erhält die Bezeichnung »Häuser Ägyptens«.
- source_word: וְגַם הָאֲדָמָה
  choice: ebenso der Erdboden
  rationale: אֲדָמָה kann »Erdboden« oder »Land« bedeuten. Im Gegensatz zu den Häusern bezeichnet »Erdboden« wahrscheinlich die bedeckte Bodenfläche; die Alternative bleibt in der Fußnote erhalten.
- source_word: אֲשֶׁר הֵם עָלֶיהָ
  choice: auf dem sie sind
  rationale: Bewahrt den unbestimmten Bezug des pluralischen Pronomens und fügt keine im Hebräischen nicht ausdrücklich genannte Tätigkeit wie »stehen« hinzu.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drohende Unmittelbarkeit bleibt deutlich; altertümliches »siehe« wird zugunsten einer natürlichen deutschen Konditionalfolge vermieden. Die Unsicherheit bei עָרֹב und אֲדָמָה wird nicht im Haupttext aufgelöst, sondern durch Fußnoten offengehalten.
