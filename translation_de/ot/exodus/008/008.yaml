base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/008.yaml
  text: So Moses and Aaron went out from Pharaoh[a], and Moses cried out to Yahweh concerning the frogs that he had set upon Pharaoh.
translation:
  language: de
  text: Da gingen Mose und Aaron vom Pharao weg. Mose schrie zu Jahwe wegen der Frösche, die Jahwe über den Pharao gebracht hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die er dem Pharao gesetzt hatte“. Das hebräische Verb bedeutet „setzen, stellen, legen“; im Zusammenhang der Plage ist auch „die er gegen den Pharao eingesetzt hatte“ möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: gingen … weg
  rationale: יצא bezeichnet hier die Bewegung fort aus der Gegenwart des Pharaos. „weggingen“ gibt die Richtung in natürlichem Deutsch wieder.
- source_word: מֵעִם
  choice: vom Pharao
  rationale: מֵעִם bedeutet hier „weg von/aus der Gegenwart von“. Die knappe deutsche Wendung vermittelt dies ohne unnötige Schwerfälligkeit.
- source_word: וַיִּצְעַק
  choice: schrie zu
  rationale: צעק bezeichnet einen eindringlichen Hilferuf oder dringenden Appell. „schrie zu“ bewahrt die Intensität des hebräischen Verbs.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text verwendet den Gottesnamen יהוה; „Jahwe“ gibt ihn im Deutschen als Eigennamen wieder.
- source_word: עַל דְּבַר
  choice: wegen
  rationale: Die feste Wendung kann „in Bezug auf“ oder „wegen“ bedeuten. Hier bezeichnet sie den Anlass und Gegenstand von Moses Ruf; „wegen“ ist knapp und idiomatisch.
- source_word: הַצְפַרְדְּעִים
  choice: der Frösche
  rationale: Direkte Wiedergabe des bestimmten Plurals im Zusammenhang der Froschplage.
- source_word: אֲשֶׁר שָׂם לְפַרְעֹה
  choice: die er über den Pharao gebracht hatte
  rationale: שׂים bedeutet wörtlich „setzen, stellen, legen“. Im Zusammenhang einer Plage drückt „über jemanden bringen“ den Sinn natürlich aus. Das Pronomen „er“ bewahrt die grammatische Form; aus dem Kontext ist Jahwe als Handelnder zu verstehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext ausdrücklich den Eigennamen יהוה verwendet, wird er als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bezug des Subjekts in אֲשֶׁר שָׂם לְפַרְעֹה
  choice: Pronomen „er“ beibehalten
  alternative: Jahwe ausdrücklich einsetzen
  rationale: Der Kontext legt Jahwe als Handelnden nahe, doch der hebräische Relativsatz nennt das Subjekt nicht erneut. Das Pronomen wahrt diese Form und vermeidet eine unnötige Explizierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei hebräischen Erzählungssätze werden zur besseren Lesbarkeit als zwei deutsche Hauptsätze wiedergegeben; die Dringlichkeit von Moses Ruf und die Bildhaftigkeit der Plage bleiben erhalten.
