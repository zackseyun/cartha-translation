source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֗ה אָנֹכִ֞י אֲשַׁלַּ֤ח אֶתְ/כֶם֙ וּ/זְבַחְתֶּ֞ם לַ/יהוָ֤ה אֱלֹֽהֵי/כֶם֙ בַּ/מִּדְבָּ֔ר רַ֛ק הַרְחֵ֥ק לֹא תַרְחִ֖יקוּ לָ/לֶ֑כֶת הַעְתִּ֖ירוּ בַּעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/024.yaml
  text: Then Pharaoh said, “I will let you go, so that you may sacrifice to Yahweh your God in the wilderness. Only, you must not go very far away. Plead for me.”
translation:
  language: de
  text: 'Da sagte der Pharao: »Ich werde euch ziehen lassen, damit ihr Yahweh, eurem Gott, in der Wüste Opfer darbringt. Nur dürft ihr nicht allzu weit weggehen. Fleht für mich!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativpräformativ mit waw führt die Handlung weiter; »Da sagte« gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Die im Deutschen übliche Wiedergabe des ägyptischen Herrschertitels.
- source_word: אָנֹכִי אֲשַׁלַּח אֶתְכֶם
  choice: Ich werde euch ziehen lassen
  rationale: שׁלח bezeichnet hier im Verhandlungskontext die Erlaubnis zur Abreise. Das ausdrücklich gesetzte אָנֹכִי verleiht dem »Ich« Gewicht, ohne dass ein zusätzliches »selbst« nötig wäre.
- source_word: וּזְבַחְתֶּם
  choice: damit ihr … Opfer darbringt
  rationale: Die anschließende Verbform bezeichnet hier den Zweck beziehungsweise die beabsichtigte Folge des Ziehenlassens. »Opfer darbringen« ist im Deutschen idiomatischer als das transitive »opfern« ohne genanntes Opfer.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Der im hebräischen Text stehende Gottesname wird als »Yahweh« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: eurem Gott
  rationale: Die Possessivverbindung wird direkt wiedergegeben; der Dativ ergibt sich aus der deutschen Konstruktion »jemandem Opfer darbringen«.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet das unbebaute, menschenarme Land; »Wüste« ist in diesem Exodus-Kontext die geläufige und verständliche deutsche Wiedergabe.
- source_word: רַק
  choice: Nur
  rationale: Das Wort leitet die einschränkende Bedingung des Pharaos knapp und natürlich ein.
- source_word: הַרְחֵק לֹא תַרְחִיקוּ לָלֶכֶת
  choice: dürft ihr nicht allzu weit weggehen
  rationale: Infinitivus absolutus und finites Verb derselben Wurzel verstärken die Entfernungsangabe. »Nicht allzu weit« bringt zugleich das Verbot und den Sinn einer begrenzten Entfernung idiomatisch zum Ausdruck.
- source_word: הַעְתִּירוּ בַּעֲדִי
  choice: Fleht für mich!
  rationale: עתר im Hifil bezeichnet ein dringliches Bitten beziehungsweise Fürbitten. »Für mich« bewahrt den Bezug auf das Interesse des Pharaos, ohne das nicht ausdrücklich genannte Objekt des Flehens zu ergänzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der Eigenname wird als Name wiedergegeben und nicht durch den Titel »der HERR« ersetzt. Die Form »Yahweh« folgt der vorgegebenen Projektkonvention.
- issue: Adressat des abschließenden Flehens
  choice: Fleht für mich!
  alternative: Fleht für mich zu Yahweh!
  rationale: Der Kontext legt Yahweh als Adressaten nahe, doch der hebräische Satz nennt ihn an dieser Stelle nicht ausdrücklich. Die knappe Wiedergabe wahrt diese Ellipse.
translation_notes:
  register: Moderner, würdiger Erzählstil mit direkter Rede. »Ziehen lassen«, »Opfer darbringen« und »flehen« sind allgemein verständlich und bewahren zugleich den feierlichen biblischen Ton. Keine Fußnoten erforderlich.
