base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/007.yaml
  text: And the frogs will depart from you[a], and from your houses, and from your servants, and from your people; only in the Nile will they remain.
translation:
  language: de
  text: Und die Frösche werden von dir, aus deinen Häusern, von deinen Dienern und von deinem Volk weichen; nur im Nil[a] werden sie bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Fluss“. Das hebräische Wort יְאֹר kann „Fluss“ bedeuten, bezeichnet im Buch Exodus aber gewöhnlich den Nil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרוּ
  choice: Dann werden ... weichen
  rationale: סוּר bezeichnet ein Weichen oder Sich-Entfernen. Im Zusammenhang mit dem Ende der Plage gibt „weichen“ den Vorgang natürlich wieder, ohne eine direkte Vernichtung der Frösche auszusagen. Das וְ setzt hier die angekündigte Folge fort und wird idiomatisch mit „Dann“ wiedergegeben.
- source_word: הַצְפַרְדְּעִים
  choice: die Frösche
  rationale: Direkte Wiedergabe des bestimmten Plurals.
- source_word: מִמְּךָ
  choice: von dir
  rationale: Die Präposition מִן mit Suffix der 2. Person maskulin Singular bezeichnet die Entfernung von Pharao beziehungsweise aus seiner unmittelbaren Nähe.
- source_word: וּמִבָּתֶּיךָ
  choice: aus deinen Häusern
  rationale: Der hebräische Plural wird bewahrt. Bei Gebäuden ist im Deutschen „aus“ idiomatischer als „von“ und bezeichnet das Verlassen ihres Inneren.
- source_word: וּמֵעֲבָדֶיךָ
  choice: von deinen Dienern
  rationale: עֶבֶד kann Diener, Sklave oder Amtsträger bedeuten. „Diener“ bleibt hier breit genug für die Menschen unter Pharaos Autorität, ohne ihren Status enger festzulegen.
- source_word: וּמֵעַמֶּךָ
  choice: von deinem Volk
  rationale: עַם bezeichnet hier die Bevölkerung beziehungsweise das Volk unter Pharaos Herrschaft; „Volk“ ist die natürliche und breite Entsprechung.
- source_word: רַק
  choice: nur
  rationale: 'רַק markiert die Einschränkung beziehungsweise Ausnahme: Der Nil ist der einzige Ort, an dem die Frösche bleiben.'
- source_word: בַּיְאֹר
  choice: im Nil
  rationale: יְאֹר kann allgemein einen Fluss bezeichnen, meint im Exoduskontext jedoch regelmäßig den Nil. Die konkrete Wiedergabe erleichtert das Verständnis.
- source_word: תִּשָּׁאַרְנָה
  choice: werden sie bleiben
  rationale: Der Nifal-Imperfekt von שׁאר bezeichnet das Zurückbleiben oder Übrigbleiben. Die feminine Pluralform bezieht sich auf die Frösche; „bleiben“ ist im Deutschen klar und natürlich.
