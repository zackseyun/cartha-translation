id: EXO.8.27
reference: Exodus 8:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ יְהוָה֙ כִּ/דְבַ֣ר מֹשֶׁ֔ה וַ/יָּ֨סַר֙ הֶ/עָרֹ֔ב מִ/פַּרְעֹ֖ה מֵ/עֲבָדָ֣י/ו וּ/מֵ/עַמּ֑/וֹ לֹ֥א נִשְׁאַ֖ר אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/027.yaml
  text: And Yahweh did according to Moses' word[a], and removed the swarm from Pharaoh, from his servants, and from his people; not one remained.
translation:
  language: de
  text: Und Jahwe handelte nach dem Wort Moses und entfernte den Schwarm[a] vom Pharao, von seinen Dienern und von seinem Volk. Nicht einer blieb übrig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Ungeziefer“. Das hebräische Wort עָרֹב bezeichnet die Schwarmplage; welche Tiere genau gemeint sind, legt der Ausdruck selbst nicht fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, der im Deutschen üblichen Transkription des Tetragramms, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיַּעַשׂ
  choice: handelte
  rationale: עשה bedeutet allgemein „tun/machen“; in der Verbindung mit „nach dem Wort Moses“ gibt „handelte“ die Aussage natürlich und präzise wieder.
- source_word: כִּדְבַר מֹשֶׁה
  choice: nach dem Wort Moses
  rationale: Die Formulierung bewahrt דבר als „Wort“ und gibt die Bedeutung wieder, dass Jahwe entsprechend Moses’ Aussage beziehungsweise Bitte handelte.
- source_word: וַיָּסַר
  choice: entfernte
  rationale: Der Hifil von סור bezeichnet hier das Beseitigen der Plage; „entfernte“ passt zum direkten Objekt und zum Kontext.
- source_word: הֶעָרֹב
  choice: den Schwarm[a]
  rationale: עָרֹב bezeichnet die Schwarmplage, ohne die Tierart eindeutig festzulegen. „Schwarm“ wahrt diese lexikalische Offenheit.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: vom Pharao, von seinen Dienern und von seinem Volk
  rationale: Die wiederholte Präposition מִן wird auch im Deutschen wiederholt und erhält so die Betonung der drei betroffenen Bereiche.
- source_word: לֹא נִשְׁאַר אֶחָד
  choice: Nicht einer blieb übrig
  rationale: Die Formulierung erhält die nachdrückliche Einzahl אֶחָד und gibt den negierten Niphal von שׁאר idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, ohne unnatürlich zu wirken; die Wiederholung von „von“ und die Einzahl in „Nicht einer“ bewahren den Nachdruck des Ausgangstextes.
