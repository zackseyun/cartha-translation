id: EXO.8.23
reference: Exodus 8:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים נֵלֵ֖ךְ בַּ/מִּדְבָּ֑ר וְ/זָבַ֨חְנוּ֙ לַֽ/יהוָ֣ה אֱלֹהֵ֔י/נוּ כַּ/אֲשֶׁ֖ר יֹאמַ֥ר אֵלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/023.yaml
  text: We will go a three days' journey into the wilderness and sacrifice to Yahweh our God[b][a], just as he tells us.
translation:
  language: de
  text: Wir wollen drei Tagesreisen weit in die Wüste ziehen und Jahwe, unserem Gott, Opfer darbringen, so wie er es uns sagen wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „so wie er es uns sagt“.'
    reason: Der hebräische Imperfekt יֹאמַר kann hier zukunftsbezogen oder mit allgemeinem Gegenwartsbezug verstanden werden.
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: drei Tagesreisen weit
  rationale: Die Verbindung bezeichnet idiomatisch eine Wegstrecke, die in drei Tagen zurückgelegt wird. Die deutsche Formulierung gibt dieses Entfernungsmaß natürlich und knapp wieder.
- source_word: נֵלֵךְ
  choice: wir wollen … ziehen
  rationale: Der Imperfekt der 1. Person Plural kann im Kontext eine beabsichtigte zukünftige Handlung ausdrücken. „Wir wollen“ klingt in Moses’ Antwort natürlich, ohne eine göttliche Notwendigkeit hinzuzufügen.
- source_word: בַּמִּדְבָּר
  choice: in die Wüste
  rationale: מִדְבָּר bezeichnet unbewohntes, trockenes Weideland beziehungsweise Wildnis. „Wüste“ ist im Exoduskontext die geläufige und verständliche deutsche Wiedergabe; die Richtung ergibt sich aus „ziehen“.
- source_word: וְזָבַחְנוּ
  choice: und … Opfer darbringen
  rationale: זבח bezeichnet das Schlachten beziehungsweise Darbringen eines Opfers. Die Formulierung bewahrt den kultischen Sinn und ist im Deutschen idiomatischer als das transitive „opfern“ ohne genanntes Opfer.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname יהוה wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵינוּ
  choice: unserem Gott
  rationale: Die Konstruktion mit dem Suffix der 1. Person Plural wird direkt wiedergegeben; der Dativ hängt von „Opfer darbringen“ ab.
- source_word: כַּאֲשֶׁר
  choice: so wie
  rationale: Die Konjunktion drückt Übereinstimmung mit der göttlichen Weisung aus. „So wie“ bewahrt den Vergleichs- beziehungsweise Entsprechungssinn.
- source_word: יֹאמַר אֵלֵינוּ
  choice: er es uns sagen wird
  rationale: 'Der Imperfekt kann zukunftsbezogen verstanden werden: Die konkrete Opferweisung wird von Jahwe ergehen. Das ergänzte „es“ ist im Deutschen syntaktisch natürlich und verweist auf die Art des Opferns.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Quelltext verwendet den Tetragrammaton als Gottes Eigennamen. „Jahwe“ macht diesen Namen sichtbar, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
- issue: Zeitbezug von יֹאמַר
  choice: er es uns sagen wird
  alternative: er es uns sagt
  rationale: Der hebräische Imperfekt lässt hier sowohl eine zukünftige Weisung als auch eine allgemeiner formulierte gegenwärtige Aussage zu. Im Kontext der noch bevorstehenden Opferhandlung ist die Zukunftsform naheliegend; die Alternative bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Drei Tagesreisen weit“ macht die hebräische Entfernungsangabe verständlich; „Opfer darbringen“ wahrt den kultischen Gehalt. Die Satzstellung bleibt nah am hebräischen Gedankengang, ohne unnatürlich zu wirken.
