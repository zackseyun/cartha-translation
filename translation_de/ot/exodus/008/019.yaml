  yaml_path: translation/ot/exodus/008/019.yaml
  text: And I will make a distinction between my people and your people[a]. Tomorrow this sign will happen.
translation:
  language: de
  text: Und ich werde zwischen meinem Volk und deinem Volk einen Unterschied machen.[a] Morgen wird dieses Zeichen geschehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erlösung“ oder „Befreiung“. Das hebräische Wort kann Gottes rettendes Handeln bezeichnen, das hier darin sichtbar wird, dass er zwischen Israel und Ägypten unterscheidet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Und ich werde … machen
  rationale: שׂים bedeutet wörtlich „setzen/stellen“; mit dem abstrakten Objekt פְדֻת und der Konstruktion „zwischen … und …“ gibt „einen Unterschied machen“ den Sinn im Deutschen idiomatisch wieder.
- source_word: פְדֻת
  choice: einen Unterschied
  rationale: Das Substantiv kann „Erlösung/Befreiung“ bezeichnen; im unmittelbaren Zusammenhang beschreibt es jedoch Gottes unterscheidendes Handeln zwischen Israel und Ägypten. Die weitere Bedeutungsdimension bleibt in der Fußnote erhalten.
- source_word: בֵּין ... וּבֵין
  choice: zwischen … und …
  rationale: Die korrelative Präposition bezeichnet hier die Trennung beziehungsweise Unterscheidung zweier Gruppen.
- source_word: עַמִּי
  choice: meinem Volk
  rationale: Direkte Wiedergabe der Possessivverbindung; gemeint ist hier Israel als Gottes Volk.
- source_word: עַמֶּךָ
  choice: deinem Volk
  rationale: Direkte Wiedergabe der Possessivverbindung in der Anrede an den Pharao; gemeint sind die Ägypter.
- source_word: לְמָחָר
  choice: Morgen
  rationale: Der temporale Ausdruck bedeutet „morgen“ und steht entsprechend der hebräischen Hervorhebung am Satzanfang.
- source_word: יִהְיֶה
  choice: wird … geschehen
  rationale: Mit „dieses Zeichen“ als Subjekt gibt „geschehen“ das angekündigte Eintreten im natürlichen modernen Deutsch wieder; das wörtlichere „wird sein“ wäre hier missverständlich beziehungsweise unidiomatisch.
- source_word: הָאֹת הַזֶּה
  choice: dieses Zeichen
  rationale: אוֹת bezeichnet ein göttlich gegebenes Zeichen oder bestätigendes Geschehen; „Zeichen“ ist die klare und im Exodus-Kontext passende Wiedergabe.
theological_decisions:
- issue: Ob פְדֻת mit dem stärker theologischen Sinn „Erlösung/Befreiung“ oder mit dem kontextuellen Sinn einer Unterscheidung wiederzugeben ist
  choice: Im Haupttext „einen Unterschied machen“
  alternative: „Erlösung“ oder „Befreiung“
  rationale: Die Konstruktion „zwischen meinem Volk und deinem Volk“ rückt das unterschiedliche Handeln Gottes an Israel und Ägypten in den Vordergrund. Da פְדֻת zugleich Erlösungs- beziehungsweise Befreiungssinn tragen kann, wird diese echte Bedeutungsdimension nicht ausgeschlossen, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die Formulierung folgt dem hebräischen Satzbau, soweit dies im Deutschen natürlich bleibt, und bewahrt die semantische Spannung von פְדֻת durch eine Fußnote.
