base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/009.yaml
  text: And the LORD did according to the word of Moses, and the frogs died out of the houses, out of the courtyards, and out of the fields.
translation:
  language: de
  text: 'Und der HERR tat, was Mose gesagt hatte: Die Frösche starben in den Häusern, den Höfen und den Feldern.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens ist würdig, geläufig und entspricht hier der konsultierten englischen Fassung.
- source_word: כִּדְבַר מֹשֶׁה
  choice: was Mose gesagt hatte
  rationale: Gibt die Bedeutung ‚gemäß dem Wort des Mose‘ in natürlichem modernem Deutsch wieder, ohne den Sinn zu erweitern.
- source_word: וַיָּמֻתוּ הַצְפַרְדְּעִים
  choice: Die Frösche starben
  rationale: Direkte Wiedergabe des hebräischen Verbs und Subjekts.
- source_word: מִן הַבָּתִּים מִן הַחֲצֵרֹת וּמִן הַשָּׂדֹת
  choice: in den Häusern, den Höfen und den Feldern
  rationale: Das wiederholte מִן bezeichnet hier im Zusammenhang die Bereiche, aus denen die Frösche durch ihr Sterben verschwanden; idiomatisches Deutsch benennt die Orte ihres Sterbens mit ‚in‘.
theological_decisions:
- issue: Wiedergabe des Tetragramms
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Bewahrt die etablierte deutsche Bibelkonvention, ohne eine bestimmte Aussprache des Gottesnamens festzulegen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der Satzbau wahrt die Abfolge von Gottes Handeln und dem Tod der Frösche; der Doppelpunkt macht die Folgebeziehung natürlich lesbar.
