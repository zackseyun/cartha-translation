  source_fidelity: 'Die Übersetzung gibt וַיַּעַשׂ יְהוָה כִּדְבַר מֹשֶׁה treffend als „Und der HERR tat, was Mose gesagt hatte“ wieder. Der anschließende Satz entspricht dem hebräischen Tod der Frösche. Die Ortsangaben mit „in“ sind im Deutschen idiomatisch und geben den kontextuell lokalen Sinn der wiederholten Präposition מִן angemessen wieder: Die Frösche starben in den genannten Bereichen, nicht etwa außerhalb von ihnen.'
