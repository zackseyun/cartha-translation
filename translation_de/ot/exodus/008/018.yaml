  text: וְ/הִפְלֵיתִי֩ בַ/יּ֨וֹם הַ/ה֜וּא אֶת אֶ֣רֶץ גֹּ֗שֶׁן אֲשֶׁ֤ר עַמִּ/י֙ עֹמֵ֣ד עָלֶ֔י/הָ לְ/בִלְתִּ֥י הֱיֽוֹת שָׁ֖ם עָרֹ֑ב לְמַ֣עַן תֵּדַ֔ע כִּ֛י אֲנִ֥י יְהוָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/018.yaml
  text: But on that day I will set apart the land of Goshen[a], where my people dwell, so that no swarm will be there[b], in order that you may know that I am Yahweh in the midst of the land.
translation:
  language: de
  text: Doch an jenem Tag werde ich das Land Goschen, in dem mein Volk lebt, gesondert behandeln, sodass es dort keinen Ungezieferschwarm[a] geben wird. Daran sollst du erkennen, dass ich, Jahwe, mitten im Land[b] bin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Insektenschwarm“, „Schwärme von Ungeziefer“ oder möglicherweise „Fliegenschwarm“. Welche Tiere mit dem hebräischen Wort עָרֹב genau gemeint sind, ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mitten auf der Erde“. Im Zusammenhang ist wahrscheinlich das Land Ägypten gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִפְלֵיתִי
  choice: werde ich … gesondert behandeln
  rationale: Der Hifil von פלא bezeichnet hier, dass Jahwe einen Unterschied macht und Goschen anders behandelt als das übrige Land. Die Formulierung ist im Deutschen natürlich und bewahrt den aktiven Vollzug der Unterscheidung.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: das Land Goschen
  rationale: אֶרֶץ bezeichnet hier das Gebiet bzw. Land Goschen; die traditionelle geografische Bezeichnung ist klar und quellennah.
- source_word: עַמִּי עֹמֵד עָלֶיהָ
  choice: in dem mein Volk lebt
  rationale: עֹמֵד עַל bezeichnet in diesem räumlichen Zusammenhang den dauernden Aufenthalt. „Lebt“ gibt dies in modernem, verständlichem Deutsch wieder.
- source_word: לְבִלְתִּי הֱיוֹת שָׁם
  choice: sodass es dort keinen … geben wird
  rationale: 'Die Infinitivkonstruktion drückt beabsichtigte Folge bzw. Zweck aus: Das angekündigte Ungeziefer wird in Goschen nicht auftreten.'
- source_word: עָרֹב
  choice: Ungezieferschwarm
  rationale: Die genaue Tierart ist unsicher. „Ungezieferschwarm“ bewahrt den kollektiven Charakter, ohne den Ausdruck ungerechtfertigt auf Fliegen oder eine andere bestimmte Insektenart festzulegen.
- source_word: לְמַעַן תֵּדַע
  choice: Daran sollst du erkennen
  rationale: Die Wendung gibt den ausdrücklichen Zweck des Zeichens wieder; die Verbform richtet sich im Singular an den Pharao.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: mitten im Land
  rationale: Die Übersetzung erhält die räumliche Aussage von בְּקֶרֶב. Im Zusammenhang liegt Ägypten als Bezug von „Land“ nahe, ohne dass dies im Text ausdrücklich ergänzt wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. „Jahwe“ bewahrt diesen, während „der HERR“ ihn durch einen Titel ersetzen würde.
- issue: Bezugsbereich von בְּקֶרֶב הָאָרֶץ
  choice: mitten im Land
  alternative: mitten auf der Erde
  rationale: הָאָרֶץ kann „Land“ oder „Erde“ bedeuten. Der Plagenbericht legt das Land Ägypten nahe; die knappe Wiedergabe „im Land“ bewahrt zugleich die im Hebräischen vorhandene Offenheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzfügung bleibt nah am hebräischen Gedankengang; ungesicherte zoologische Präzision und die Mehrdeutigkeit von אֶרֶץ werden nicht stillschweigend aufgelöst.
