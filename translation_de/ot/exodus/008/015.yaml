id: EXO.8.15
reference: Exodus 8:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ הַֽ/חַרְטֻמִּים֙ אֶל פַּרְעֹ֔ה אֶצְבַּ֥ע אֱלֹהִ֖ים הִ֑וא וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹֽא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/015.yaml
  text: Then the magicians said to Pharaoh[a], “This is the finger of God.” But Pharaoh’s heart was hardened, and he did not listen to them[c][b], just as Yahweh had spoken.
translation:
  language: de
  text: 'Da sagten die Zauberer zum Pharao: »Das ist der Finger Gottes.«[a] Doch das Herz des Pharaos wurde hart,[b] und er hörte nicht auf sie, so wie Jahwe es gesagt hatte.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ausdruck »Finger Gottes« bezeichnet hier Gottes unmittelbar wirkende Macht.
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: »Das Herz des Pharaos wurde stark/fest.« Im Hebräischen wird an dieser Stelle nicht ausdrücklich gesagt, wer das Hartwerden verursacht.'
    reason: lexical_alternative
  - marker: c
    text: Hebräisch JHWH; traditionell mit »der HERR« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: die Zauberer
  rationale: Bezeichnet die ägyptischen Ritualkundigen am Hof des Pharaos. »Zauberer« ist im Deutschen verständlich und gibt ihre im Kontext dargestellte Tätigkeit wieder, ohne ihre Funktion unnötig genauer festzulegen.
- source_word: אֶצְבַּע אֱלֹהִים הִוא
  choice: Das ist der Finger Gottes
  rationale: Die verblos formulierte hebräische Aussage wird natürlich wiedergegeben und das anschauliche Bild unmittelbaren göttlichen Wirkens bleibt erhalten.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Obwohl אֱלֹהִים je nach Zusammenhang auch anders verstanden werden kann, liegt hier im Erzählkontext die singularische Bedeutung »Gott« am nächsten.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: das Herz des Pharaos wurde hart
  rationale: חזק bezeichnet hier das Fest- beziehungsweise Hartwerden des Herzens. Die Formulierung nennt keinen ausdrücklichen Verursacher und bewahrt daher die offene Frage nach der handelnden Instanz.
- source_word: שָׁמַע אֲלֵהֶם
  choice: er hörte nicht auf sie
  rationale: שׁמע mit אֶל bedeutet in diesem Zusammenhang »auf jemanden hören« beziehungsweise »jemanden beachten«. Die gewählte Wendung ist natürliches modernes Deutsch.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: so wie Jahwe es gesagt hatte
  rationale: Die Wendung verweist auf eine vorausgegangene Ankündigung. Das Plusquamperfekt bildet diese zeitliche Beziehung im Deutschen klar ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch den Titel »der HERR« ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« bewahrt den Charakter als persönlichen Gottesnamen.
- issue: Urheberschaft der Verhärtung des Herzens
  choice: das Herz des Pharaos wurde hart
  alternative: Der Pharao verhärtete sein Herz; Gott verhärtete das Herz des Pharaos
  rationale: Der Satz nennt an dieser Stelle keinen ausdrücklichen Verursacher. Die gewählte Fassung lässt die theologische Spannung bestehen und schreibt die Handlung weder ausdrücklich Gott noch ausdrücklich dem Pharao zu.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das traditionelle biblische Bild »Finger Gottes« bleibt erhalten; die Formulierung zur Verhärtung vermeidet eine über den hebräischen Satz hinausgehende Festlegung der Urheberschaft.
