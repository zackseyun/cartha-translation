  text: וַ/יַּכְבֵּ֤ד פַּרְעֹה֙ אֶת לִבּ֔/וֹ גַּ֖ם בַּ/פַּ֣עַם הַ/זֹּ֑את וְ/לֹ֥א שִׁלַּ֖ח אֶת הָ/עָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/028.yaml
  text: But Pharaoh hardened his heart this time also[a], and did not let the people go.
translation:
  language: de
  text: Doch der Pharao verhärtete auch dieses Mal sein Herz[a] und ließ das Volk nicht ziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „machte sein Herz schwer“. Gemeint ist, dass der Pharao sich unnachgiebig und unempfänglich zeigte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְבֵּד
  choice: verhärtete
  rationale: Das Hifil von כבד bedeutet wörtlich, etwas schwer zu machen. In Verbindung mit dem Herzen bezeichnet es hier, dass der Pharao sich bewusst unnachgiebig und unempfänglich machte. „Verhärtete“ gibt den Sinn im Deutschen natürlich wieder; die Fußnote bewahrt das hebräische Bild.
- source_word: לִבּוֹ
  choice: sein Herz
  rationale: Die wörtliche Wiedergabe bewahrt die hebräische Vorstellung vom Herzen als Zentrum des Wollens und der inneren Haltung.
- source_word: גַּם בַּפַּעַם הַזֹּאת
  choice: auch dieses Mal
  rationale: Die Formulierung bezeichnet einen weiteren gleichartigen Vorgang bei dieser Gelegenheit und klingt im modernen Deutschen knapp und natürlich.
- source_word: וְלֹא שִׁלַּח
  choice: und ließ … nicht ziehen
  rationale: Im Exoduszusammenhang bezeichnet שׁלח die verweigerte Freigabe des Volkes. „Nicht ziehen lassen“ ist dafür eine natürliche und präzise deutsche Wendung.
- source_word: הָעָם
  choice: das Volk
  rationale: Der bestimmte kollektive Singular bezieht sich im Zusammenhang auf Israel; „das Volk“ entspricht Form und Kontext.
- source_word: וַ
  choice: Doch
  rationale: Das narrative Waw führt die Handlung fort. „Doch“ macht zugleich den Gegensatz zwischen der vorangegangenen Erleichterung und der erneuten Weigerung des Pharaos deutlich, ohne den Inhalt zu erweitern.
theological_decisions:
- issue: Wer die Verhärtung des Herzens bewirkt
  choice: Der Pharao selbst verhärtete sein Herz.
  alternative: Das Herz des Pharaos wurde hart.
  rationale: Der hebräische Satz nennt den Pharao ausdrücklich als handelndes Subjekt. Die aktive Form bewahrt seine Verantwortlichkeit und zugleich die Spannung zu anderen Exodusstellen, an denen Gott als derjenige genannt wird, der das Herz des Pharaos verhärtet.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die traditionelle Herzmetaphorik bleibt erhalten; das im Deutschen weniger verständliche hebräische Bild der Schwere wird in der Fußnote erläutert.
