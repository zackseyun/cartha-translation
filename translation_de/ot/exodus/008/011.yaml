  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּ֤י הָֽיְתָה֙ הָֽ/רְוָחָ֔ה וְ/הַכְבֵּד֙ אֶת לִבּ֔/וֹ וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/011.yaml
  text: But when Pharaoh saw that there was relief[a], he hardened his heart and did not listen to them, just as Yahweh had said.
translation:
  language: de
  text: Doch als der Pharao sah, dass es Erleichterung gab,[a] verhärtete er sein Herz und hörte nicht auf sie, wie Jahwe gesagt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass es eine Atempause gab«. Das hebräische Wort kann Erleichterung, Entlastung oder eine Atempause bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Bewahrt die konkrete hebräische Ausdrucksweise; im Zusammenhang schließt das Sehen das Erkennen der veränderten Lage ein.
- source_word: כִּי הָיְתָה הָרְוָחָה
  choice: dass Erleichterung eingetreten war
  rationale: הָרְוָחָה bezeichnet Erleichterung, Aufatmen oder eine Atempause. Die Formulierung gibt sowohl den Zustandswechsel als auch die zeitliche Vorordnung natürlich wieder.
- source_word: וְהַכְבֵּד אֶת לִבּוֹ
  choice: verhärtete er sein Herz
  rationale: Die Hifil-Form von כבד bedeutet wörtlich, das Herz schwer zu machen, und bezeichnet hier eigensinnige Verstockung. Die geläufige deutsche Wendung bewahrt das Bild und die aktive Verantwortung des Pharaos.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: und hörte nicht auf sie
  rationale: שמע mit אֶל bedeutet hier hören beziehungsweise jemandem Gehör schenken. Die Formulierung bleibt näher am Hebräischen als eine ausdrückliche Wiedergabe mit »gehorchen«.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: genauso wie Jahwe es gesagt hatte
  rationale: Die Wendung kennzeichnet die Erfüllung einer vorausgehenden göttlichen Aussage; das Plusquamperfekt macht diese Vorzeitigkeit im Deutschen deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Urheberschaft der Verhärtung des Pharaos
  choice: Der Pharao wird in diesem Vers als derjenige dargestellt, der sein eigenes Herz verhärtet.
  alternative: Sein Herz wurde hart; oder Gott bewirkte hier unausgesprochen die Verhärtung.
  rationale: Die aktive kausative Verbform hat den Pharao als Subjekt. Damit bleibt die Aussage dieses Verses erhalten, ohne die Spannung zu anderen Stellen aufzulösen, an denen Gott das Herz des Pharaos verhärtet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Erleichterung eingetreten war« klingt natürlich und bildet den erreichten Zustand ab; »hörte nicht auf sie« bewahrt die semantische Offenheit zwischen Nichtbeachten und Nichtgehorchen.
