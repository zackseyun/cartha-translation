  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹ֣ר אֶֽל אַהֲרֹ֗ן נְטֵ֤ה אֶת יָדְ/ךָ֙ בְּ/מַטֶּ֔/ךָ עַל הַ֨/נְּהָרֹ֔ת עַל הַ/יְאֹרִ֖ים וְ/עַל הָ/אֲגַמִּ֑ים וְ/הַ֥עַל אֶת הַֽ/צְפַרְדְּעִ֖ים עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/001.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your hand with your staff over the rivers, over the canals, and over the pools, and bring up the frogs over the land of Egypt.’”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Sag zu Aaron: Strecke deine Hand mit deinem Stab über die Flüsse, die Nilarme[a] und die Teiche aus und lass die Frösche über das Land Ägypten heraufkommen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Kanäle“. Das hebräische Wort bezeichnet in Ägypten häufig Wasserläufe des Nils.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner geläufigen wissenschaftlichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; „Da sagte“ klingt in modernem Deutsch natürlich und bewahrt die zeitliche Abfolge.
- source_word: נְטֵה אֶת יָדְךָ בְּמַטֶּךָ
  choice: Strecke deine Hand mit deinem Stab … aus
  rationale: Die Wendung bewahrt sowohl die konkrete Handbewegung als auch den instrumentalen Sinn der Präposition bei „Stab“.
- source_word: הַנְּהָרֹת
  choice: die Flüsse
  rationale: Die gewöhnliche Bedeutung „Flüsse“ bleibt erhalten und wird von den beiden folgenden Gewässerbezeichnungen unterschieden.
- source_word: הַיְאֹרִים
  choice: die Nilarme
  rationale: Der Ausdruck bezeichnet im ägyptischen Kontext Nilgewässer; „Nilarme“ ist konkreter als „Kanäle“, ohne künstliche Wasserläufe vorauszusetzen.
- source_word: הָאֲגַמִּים
  choice: die Teiche
  rationale: „Teiche“ gibt angesammelte beziehungsweise stehende Gewässer verständlich wieder und erhält die dreigliedrige Aufzählung.
- source_word: וְהַעַל אֶת הַצְפַרְדְּעִים
  choice: und lass die Frösche … heraufkommen
  rationale: Die Form ist ein Kausativ; „lass … heraufkommen“ gibt diesen Sinn natürlich wieder und bewahrt die Bewegung aus den Gewässern.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: über das Land Ägypten
  rationale: „Über“ wahrt die räumliche Formulierung des Hebräischen, ohne sie deutend zu „im ganzen Land“ zu erweitern.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen und entspricht der üblichen deutschen Form.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede und die dreigliedrige Aufzählung der Gewässer bleiben erhalten; „Nilarme“ wird wegen der echten lexikalischen Spannweite durch eine Fußnote ergänzt.
