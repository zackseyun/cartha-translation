- from: 'Da sagte Mose: »Sieh, ich gehe nun von dir weg und werde inständig zu Yahweh beten. Morgen wird der Schwarm[a] vom Pharao, von seinen Dienern und von seinem Volk weichen. Nur soll der Pharao nicht wieder betrügerisch handeln, indem er das Volk nicht ziehen lässt, um Yahweh Opfer darzubringen.«'
  to: 'Da sagte Mose: »Sieh, ich gehe nun von dir weg und werde inständig zu Yahweh beten. Morgen wird der Schwarm[a] vom Pharao, von seinen Dienern und von seinem Volk weichen. Nur soll der Pharao nicht weiterhin täuschen, indem er das Volk nicht ziehen lässt, um Yahweh Opfer darzubringen.«'
  rationale: Die Revision beschränkt sich auf die Wiedergabe der Warnung an den Pharao und auf eine sprachlich klarere Fußnote. Sie bewahrt die vom hebräischen Ausdruck und vom englischen Audit Trail verlangte Unbestimmtheit sowohl beim Schwarm als auch bei der Nuance von התל.
