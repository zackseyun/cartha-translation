source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤א מֵֽ/עִמָּ/ךְ֙ וְ/הַעְתַּרְתִּ֣י אֶל יְהוָ֔ה וְ/סָ֣ר הֶ/עָרֹ֗ב מִ/פַּרְעֹ֛ה מֵ/עֲבָדָ֥י/ו וּ/מֵ/עַמּ֖/וֹ מָחָ֑ר רַ֗ק אַל יֹסֵ֤ף פַּרְעֹה֙ הָתֵ֔ל לְ/בִלְתִּי֙ שַׁלַּ֣ח אֶת הָ/עָ֔ם לִ/זְבֹּ֖חַ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/025.yaml
  text: And Moses said[a], “Look, I am going out from you, and I will plead with Yahweh, and the swarm will depart from Pharaoh, from his servants, and from his people tomorrow. Only let Pharaoh not continue to mock by not letting the people go to sacrifice to Yahweh.”
translation:
  language: de
  text: 'Da sagte Mose: »Sieh, ich gehe nun von dir weg und werde inständig zu Yahweh beten. Morgen wird der Schwarm[a] vom Pharao, von seinen Dienern und von seinem Volk weichen. Nur soll der Pharao nicht weiterhin täuschen, indem er das Volk nicht ziehen lässt, um Yahweh Opfer darzubringen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort עָרֹב kann genauer einen Fliegenschwarm oder andere schwärmende Tiere bezeichnen; was genau gemeint ist, bleibt unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt die aufmerksamkeitslenkende und unmittelbare Kraft der hebräischen Partikel in würdigem, verständlichem Deutsch.
- source_word: יוֹצֵא מֵעִמָּךְ
  choice: ich gehe nun von dir weg
  rationale: Gibt die konkrete Bewegung von Moses Gegenüber fort natürlich wieder; »nun« verdeutlicht den unmittelbar bevorstehenden Vorgang.
- source_word: וְהַעְתַּרְתִּי אֶל יְהוָה
  choice: werde inständig zu Yahweh beten
  rationale: Das Verb bezeichnet hier eindringliches, vermittelndes Bitten und nicht lediglich ein allgemeines Gebet.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen als Eigennamen wieder.
- source_word: וְסָר
  choice: wird … weichen
  rationale: Entspricht dem intransitiven Sinn »sich entfernen, weichen« und passt natürlich zum Schwarm als Subjekt.
- source_word: הֶעָרֹב
  choice: der Schwarm
  rationale: Bewahrt die Unbestimmtheit des hebräischen Ausdrucks, dessen genaue zoologische Bedeutung unsicher ist.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: vom Pharao, von seinen Dienern und von seinem Volk
  rationale: Die wiederholte Präposition wird zur Betonung des vollständigen Geltungsbereichs beibehalten.
- source_word: מָחָר
  choice: Morgen
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe.
- source_word: רַק
  choice: Nur
  rationale: Leitet Moses einschränkende Warnung knapp und deutlich ein.
- source_word: אַל יֹסֵף ... הָתֵל
  choice: soll … nicht wieder betrügerisch handeln
  rationale: Gibt sowohl die Wiederholung durch יסף als auch den täuschenden beziehungsweise spöttisch-hinhaltenden Charakter von התל wieder, ohne bloßes Verspotten vorauszusetzen.
- source_word: לְבִלְתִּי שַׁלַּח
  choice: indem er das Volk nicht ziehen lässt
  rationale: Kennzeichnet das Nichtfreilassen als konkrete Form von Pharaos betrügerischem Verhalten.
- source_word: לִזְבֹּחַ
  choice: um Yahweh Opfer darzubringen
  rationale: Bewahrt die kultische Bedeutung des Verbs זבח und verallgemeinert sie nicht zu bloßer Anbetung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet das Tetragramm ausdrücklich; die Wiedergabe als »Yahweh« erhält den offenbarten Eigennamen.
- issue: Genaue Bestimmung von עָרֹב
  choice: der Schwarm
  alternative: der Fliegenschwarm; das Schwarmgetier; der gemischte Schwarm
  rationale: Die genaue Art der Plage lässt sich aus dem hebräischen Wort nicht sicher bestimmen. Die allgemeine Wiedergabe erhält diese echte Ungewissheit.
- issue: Bedeutungsumfang von התל
  choice: betrügerisch handeln
  alternative: spotten; täuschen; sein Spiel treiben
  rationale: Im Zusammenhang warnt Mose vor erneutem treuwidrigem Hinhalten. Die Formulierung bewahrt den Aspekt der Täuschung, ohne die mögliche verächtliche Nuance zur alleinigen Bedeutung zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt eindringlich, aber nicht altertümlich. »Ziehen lassen« greift die im Exodus vertraute Freilassungsformel auf; »Opfer darbringen« wahrt die kultische Genauigkeit.
