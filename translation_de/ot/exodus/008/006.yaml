  text: וַ/יֹּ֖אמֶר לְ/מָחָ֑ר וַ/יֹּ֨אמֶר֙ כִּ/דְבָ֣רְ/ךָ֔ לְמַ֣עַן תֵּדַ֔ע כִּי אֵ֖ין כַּ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/006.yaml
  text: He said[a], “Tomorrow.” And he said, “According to your word, so that you may know that there is no one like Yahweh our God.”
translation:
  language: de
  text: 'Er sagte: »Morgen.« Da sagte er: »Nach deinem Wort, damit du erkennst, dass es niemanden wie Jahwe, unseren Gott, gibt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Er sagte / Da sagte er
  rationale: Das zweimalige Wayyiqtol von אמר führt die aufeinanderfolgenden Redebeiträge fort. Beim zweiten Vorkommen gibt „Da“ den erzählerischen Anschluss natürlich wieder, ohne die im Hebräischen nicht ausdrücklich genannten Sprecher durch Namen festzulegen.
- source_word: לְמָחָר
  choice: Morgen
  rationale: Die Zeitangabe steht als knappe direkte Antwort und bezeichnet den folgenden Tag.
- source_word: כִּדְבָרְךָ
  choice: Wie du gesagt hast
  rationale: Die Wendung bedeutet wörtlich „gemäß deinem Wort“. Die gewählte Form ist im modernen Deutsch natürlich und bewahrt den Bezug auf die soeben geäußerte Festlegung.
- source_word: לְמַעַן תֵּדַע
  choice: damit du erkennst
  rationale: לְמַעַן leitet einen Zwecksatz ein; das Qal-Imperfekt der 2. Person Singular richtet sich an den Gesprächspartner. „Erkennen“ bringt den durch das Zeichen gewonnenen Einblick angemessen zum Ausdruck.
- source_word: אֵין כַּיהוָה
  choice: niemand ist wie Jahwe
  rationale: Die Existenzverneinung אֵין mit dem Vergleichspräfix כ wird im Deutschen idiomatisch als Aussage formuliert, dass niemand Jahwe gleichkommt.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Die formal pluralisch gebildete Gottesbezeichnung bezeichnet hier mit dem Suffix der 1. Person Plural den einen Gott Israels.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Aussage der Unvergleichlichkeit
  choice: dass niemand ist wie Jahwe, unser Gott
  alternative: dass es keinen Gott wie Jahwe, unseren Gott, gibt
  rationale: Der hebräische Satz nennt nach אֵין kein ausdrückliches Wort für „Gott“ als Vergleichsgruppe. Die offenere Form vermeidet diese Ergänzung und bewahrt den umfassenden Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe direkte Rede und die beiden nicht näher bezeichneten Sprecher bleiben wie im hebräischen Text erhalten; der Gedankenstrich macht den Zweckzusammenhang lesbar, ohne zusätzliche Deutung einzuführen.
