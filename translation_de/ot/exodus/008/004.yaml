  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֗ן וַ/יֹּ֨אמֶר֙ הַעְתִּ֣ירוּ אֶל יְהוָ֔ה וְ/יָסֵר֙ הַֽ/צְפַרְדְּעִ֔ים מִמֶּ֖/נִּי וּ/מֵֽ/עַמִּ֑/י וַ/אֲשַׁלְּחָה֙ אֶת הָ/עָ֔ם וְ/יִזְבְּח֖וּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/004.yaml
  text: Then Pharaoh called for Moses and Aaron and said[a], “Pray to Yahweh, that he may remove the frogs from me and from my people, and I will let the people go[b], so that they may sacrifice to Yahweh.”
translation:
  language: de
  text: 'Da ließ der Pharao Mose und Aaron rufen und sagte: »Fleht zu Jahwe[a], dass er die Frösche von mir und meinem Volk entfernt. Dann will ich das Volk ziehen lassen, damit es Jahwe Opfer darbringt.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bezeichnet hier ein dringendes Flehen oder Fürbitten, nicht nur ein allgemeines Beten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und es soll Jahwe Opfer darbringen.« Die hebräische Verbindung kann auch als einfache Beiordnung verstanden werden; im Zusammenhang liegt jedoch eine Zweckangabe nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... לְמֹשֶׁה וּלְאַהֲרֹן
  choice: ließ ... Mose und Aaron rufen
  rationale: קרא mit לְ bezeichnet hier das Herbeirufen. Die deutsche Konstruktion gibt natürlich wieder, dass der Pharao beide zu sich bestellen ließ.
- source_word: הַעְתִּירוּ
  choice: Fleht
  rationale: Der Hifil von עתר bezeichnet in Gebetszusammenhängen dringendes Bitten oder Fürbitte. »Fleht« bewahrt die stärkere Nuance gegenüber dem allgemeineren »betet«.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: Die Präposition אֶל bezeichnet die Ausrichtung des Flehens; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: וְיָסֵר
  choice: dass er ... entfernt
  rationale: Der Hifil von סור bedeutet »entfernen, wegnehmen«. Nach der Aufforderung zum Flehen gibt der Satz den erbetenen Inhalt beziehungsweise das gewünschte Ergebnis an.
- source_word: הַצְפַרְדְּעִים מִמֶּנִּי וּמֵעַמִּי
  choice: die Frösche von mir und meinem Volk
  rationale: Die wiederholte Präposition מִן markiert, wen die Plage verlassen soll. Im Deutschen genügt eine gemeinsame Präposition, ohne den Sinn zu verändern.
- source_word: וַאֲשַׁלְּחָה אֶת־הָעָם
  choice: Dann will ich das Volk ziehen lassen
  rationale: Die Kohortativform drückt die erklärte Absicht oder Zusage des Pharaos aus. »ziehen lassen« entspricht dem wiederkehrenden Sprachgebrauch des Exodus.
- source_word: וְיִזְבְּחוּ
  choice: damit es ... Opfer darbringt
  rationale: Das Präfixverb kann als Zweck oder Folge der Freilassung verstanden werden. »Opfer darbringen« gibt זבח idiomatisch und kultisch präzise wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von וְיִזְבְּחוּ zur Zusage des Pharaos
  choice: 'Zweck: »damit es Jahwe Opfer darbringt«'
  alternative: 'Einfache Beiordnung: »und es soll Jahwe Opfer darbringen«'
  rationale: Im Zusammenhang bezeichnet die Form wahrscheinlich den beabsichtigten Zweck des Ziehenlassens. Da die hebräische Verknüpfung auch einfacher koordinierend verstanden werden kann, wird die Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Fleht« erhält die Dringlichkeit des hebräischen Verbs; »ziehen lassen« greift die für den Exodus prägende Ausdrucksweise auf. Die beiden Fußnotenmarker stehen vollständig im Haupttext.
