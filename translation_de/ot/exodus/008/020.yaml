source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ יְהוָה֙ כֵּ֔ן וַ/יָּבֹא֙ עָרֹ֣ב כָּבֵ֔ד בֵּ֥יתָ/ה פַרְעֹ֖ה וּ/בֵ֣ית עֲבָדָ֑י/ו וּ/בְ/כָל אֶ֧רֶץ מִצְרַ֛יִם תִּשָּׁחֵ֥ת הָ/אָ֖רֶץ מִ/פְּנֵ֥י הֶ/עָרֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/020.yaml
  text: And Yahweh did so[a], and a heavy swarm came into Pharaoh’s house and into his servants’ houses, and throughout all the land of Egypt the land was ruined because of the swarm.
translation:
  language: de
  text: Und Yahweh tat es. Ein gewaltiger Schwarm[a] drang in das Haus des Pharaos und in die Häuser seiner Diener ein. Im ganzen Land Ägypten wurde das Land durch den Schwarm verwüstet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine gewaltige Insektenmenge“. Das hebräische Wort bezeichnet einen Schwarm, lässt die Tierart jedoch offen; traditionell wird an Fliegen gedacht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיַּעַשׂ ... כֵּן
  choice: tat es
  rationale: 'Gibt die hebräische Wendung knapp und idiomatisch wieder: Yahweh führte das zuvor Angekündigte aus.'
- source_word: וַיָּבֹא
  choice: drang ... ein
  rationale: Im Zusammenhang mit dem Eindringen eines Schwarms in Häuser ist dies im Deutschen natürlicher als das bloße „kam“, ohne den Richtungssinn zu verändern.
- source_word: עָרֹב
  choice: Schwarm
  rationale: Die genaue Art der Tiere ist unsicher. „Schwarm“ bewahrt diese Unbestimmtheit, statt ausdrücklich Fliegen oder anderes Ungeziefer zu nennen.
- source_word: כָּבֵד
  choice: gewaltig
  rationale: Das wörtliche „schwer“ bezeichnet hier die große Menge oder Heftigkeit; „gewaltig“ ist dafür eine natürliche deutsche Entsprechung.
- source_word: בֵּיתָה פַרְעֹה
  choice: in das Haus des Pharaos
  rationale: Die Richtungsendung am hebräischen Wort für Haus wird durch „in das ... hinein“ beziehungsweise das trennbare Verb „eindringen“ ausgedrückt; „Haus“ vermeidet die unbelegte Präzisierung „Palast“.
- source_word: וּבֵית עֲבָדָיו
  choice: in die Häuser seiner Diener
  rationale: Der hebräische Singular „Haus“ bei mehreren Dienern wird distributiv verstanden. „Diener“ bleibt weiter gefasst als „Beamte“ oder „Hofleute“.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: im ganzen Land Ägypten
  rationale: Bewahrt den umfassenden räumlichen Geltungsbereich in geläufigem Deutsch.
- source_word: תִּשָּׁחֵת הָאָרֶץ
  choice: wurde das Land ... verwüstet
  rationale: Das Nifal von שׁחת beschreibt hier schwere Schädigung beziehungsweise Verwüstung, ohne zwingend völlige Vernichtung zu behaupten.
- source_word: מִפְּנֵי הֶעָרֹב
  choice: durch den Schwarm
  rationale: Gibt die kausale Bedeutung der Präposition im Kontext knapp und natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: Jehova; der HERR
  rationale: Der hebräische Text verwendet den Tetragrammaton als persönlichen Gottesnamen. Die Transliteration „Yahweh“ bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Erzählungssätze entsprechen dem hebräischen Handlungsablauf; die zoologische Unbestimmtheit des Ausdrucks עָרֹב bleibt gewahrt.
