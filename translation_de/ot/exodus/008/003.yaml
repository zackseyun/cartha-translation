source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵ֥ן הַֽ/חֲרְטֻמִּ֖ים בְּ/לָטֵי/הֶ֑ם וַ/יַּעֲל֥וּ אֶת הַֽ/צְפַרְדְּעִ֖ים עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/003.yaml
  text: And the magicians did the same by their secret arts[a], and they brought up the frogs over the land of Egypt.
translation:
  language: de
  text: Und die Zauberer taten durch ihre geheimen Künste[a] dasselbe und ließen die Frösche über das Land Ägypten heraufkommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch ihre Zaubersprüche“ oder „durch ihre magischen Künste“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: taten dasselbe
  rationale: Die Verbindung von עשה und כֵן bezeichnet hier die Nachahmung der unmittelbar zuvor geschilderten Handlung. „Taten dasselbe“ ist natürliches modernes Deutsch und bewahrt den vergleichenden Sinn.
- source_word: הַחֲרְטֻמִּים
  choice: die Zauberer
  rationale: Der Ausdruck bezeichnet im Exodusbuch die ägyptischen Hofkundigen, die Zeichen mit geheimen magischen Praktiken nachahmen. „Zauberer“ ist im Kontext klar und gebräuchlich.
- source_word: בְּלָטֵיהֶם
  choice: durch ihre geheimen Künste
  rationale: Die Wendung verweist auf verborgene oder esoterische magische Praktiken. „Durch ihre geheimen Künste“ gibt sowohl das Mittel als auch den geheimen Charakter wieder, ohne die genaue Art der Praktiken festzulegen.
- source_word: וַיַּעֲלוּ
  choice: ließen ... heraufkommen
  rationale: 'Die Hifil-Form von עלה ist kausativ: Die Zauberer bewirkten, dass die Frösche heraufkamen. Die deutsche Konstruktion mit „ließen“ bewahrt diesen kausativen Sinn.'
- source_word: אֶת הַצְפַרְדְּעִים
  choice: die Frösche
  rationale: Der bestimmte Plural wird direkt mit „die Frösche“ wiedergegeben.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: über das Land Ägypten
  rationale: עַל kann „auf“ oder „über“ bedeuten. „Über das Land Ägypten“ lässt hier die Ausbreitung über das Gebiet erkennen und folgt der räumlichen Bildsprache des Hebräischen.
theological_decisions:
- issue: Art der Handlung der Zauberer
  choice: Die Handlung wird ohne einschränkenden Zusatz so wiedergegeben, dass die Zauberer ebenfalls Frösche heraufkommen ließen.
  alternative: Die Handlung ausdrücklich nur als Täuschung, Schein oder Trick bezeichnen.
  rationale: Der hebräische Erzähler berichtet die Handlung ohne entsprechende Einschränkung. Die Übersetzung sollte weder eine naturalistische Erklärung noch eine weitergehende Deutung in den Text eintragen.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Handlungsablauf; die kausative Verbform wird idiomatisch mit „ließen ... heraufkommen“ ausgedrückt.
