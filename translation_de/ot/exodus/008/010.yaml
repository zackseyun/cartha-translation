  yaml_path: translation/ot/exodus/008/010.yaml
  text: And they piled them up in heap after heap[a], and the land stank.
translation:
  language: de
  text: Und sie häuften sie zu Haufen auf, Haufen um Haufen, und das Land stank.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu lauter Haufen“ oder „in Haufen“; im Hebräischen wird das Wort „Haufen“ zur Verstärkung wiederholt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּרוּ
  choice: sie häuften … auf
  rationale: Das Verb צבר bezeichnet hier das Zusammentragen zu Haufen. „aufhäufen“ gibt die konkrete Handlung im modernen Deutschen anschaulich wieder.
- source_word: אֹתָם
  choice: sie
  rationale: Das Akkusativpronomen bezieht sich auf die Frösche aus dem unmittelbaren Zusammenhang.
- source_word: חֳמָרִם חֳמָרִם
  choice: zu Haufen über Haufen
  rationale: Die Wiederholung des Substantivs betont eine Vielzahl von Haufen. Die Formulierung bewahrt diese emphatische Wiederholung, ohne sie auf eine bloße Mehrzahl zu reduzieren.
- source_word: וַתִּבְאַשׁ
  choice: stank
  rationale: באש bezeichnet einen üblen Geruch. „stank“ ist direkt, kräftig und entspricht dem erzählerischen Ton.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: אֶרֶץ bezeichnet hier das von der Plage betroffene Land beziehungsweise Gebiet, nicht die ganze Erde.
