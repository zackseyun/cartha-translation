source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵ֗ן וַ/יֵּט֩ אַהֲרֹ֨ן אֶת יָד֤/וֹ בְ/מַטֵּ֨/הוּ֙ וַ/יַּךְ֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ וַ/תְּהִי֙ הַ/כִּנָּ֔ם בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה כָּל עֲפַ֥ר הָ/אָ֛רֶץ הָיָ֥ה כִנִּ֖ים בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/013.yaml
  text: And they did so[a]. Aaron stretched out his hand with his staff and struck the dust of the earth, and the gnats came upon man and beast[b]. All the dust of the earth became gnats throughout all the land of Egypt.
translation:
  language: de
  text: Und sie taten es. Aaron streckte die Hand mit seinem Stab aus und schlug auf den Staub der Erde. Da kamen die Mücken[a] über Mensch und Vieh[b]. Aller Staub der Erde wurde zu Mücken im ganzen Land Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Läuse“. Die genaue zoologische Bedeutung des hebräischen Wortes ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: „Mensch“ ist hier als Sammelbegriff für die Menschen gemeint.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Und sie taten es
  rationale: Die geläufige deutsche Erzählformel gibt das Befolgen der zuvor erteilten Anweisung knapp und idiomatisch wieder.
- source_word: וַיֵּט אַהֲרֹן אֶת־יָדוֹ בְמַטֵּהוּ
  choice: Aaron streckte die Hand mit seinem Stab aus
  rationale: נטה bezeichnet hier das Ausstrecken der Hand. „Mit seinem Stab“ bewahrt die mögliche Bedeutung von Begleitung beziehungsweise Mittel, ohne genauer festzulegen, wie Aaron den Stab hielt.
- source_word: וַיַּךְ אֶת עֲפַר הָאָרֶץ
  choice: und schlug auf den Staub der Erde
  rationale: נכה wird sachgerecht mit „schlagen“ wiedergegeben; die deutsche Konstruktion mit „auf“ klingt natürlich und erhält Staub als Ziel der Handlung.
- source_word: עֲפַר הָאָרֶץ
  choice: der Staub der Erde
  rationale: „Staub“ entspricht עפר und bewahrt das Bild sowie die Wiederholung des hebräischen Ausdrucks.
- source_word: הַכִּנָּם / כִנִּים
  choice: Mücken
  rationale: Die genaue zoologische Bestimmung ist unsicher. „Mücken“ ist eine verständliche, verbreitete Wiedergabe; die mögliche Bedeutung „Läuse“ wird in einer Fußnote genannt.
- source_word: וַתְּהִי הַכִּנָּם בָּאָדָם וּבַבְּהֵמָה
  choice: Da kamen die Mücken über Mensch und Vieh
  rationale: Das hebräische היה beschreibt hier das Auftreten des Befalls. „Kamen … über“ gibt diesen Beginn idiomatisch wieder und erhält das traditionelle Begriffspaar.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: über Mensch und Vieh
  rationale: אָדָם ist kollektiv auf Menschen bezogen; בְּהֵמָה bezeichnet hier die Tiere, besonders den Viehbestand. Die knappe Paarformel entspricht dem Hebräischen.
- source_word: כָּל עֲפַר הָאָרֶץ הָיָה כִנִּים
  choice: Aller Staub der Erde wurde zu Mücken
  rationale: „Aller“ erhält die umfassende Aussage von כָּל, und „wurde zu“ gibt den resultativen Sinn von היה klar wieder.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: im ganzen Land Ägypten
  rationale: Die Formulierung gibt die vollständige geografische Ausdehnung natürlich und präzise wieder.
theological_decisions:
- issue: Kollektive Bedeutung von אָדָם
  choice: Mensch
  alternative: Menschen / Menschheit
  rationale: „Mensch“ bewahrt die kollektive Singularform und den Kontrast zu „Vieh“. Eine Fußnote stellt klar, dass Menschen allgemein gemeint sind und nicht nur Männer.
- issue: Zoologische Identifikation von כִּנִּים
  choice: Mücken
  alternative: Läuse
  rationale: Die Art der Plagetiere lässt sich lexikalisch nicht sicher bestimmen. Der Haupttext wählt eine verbreitete deutsche Bezeichnung, während die echte Unsicherheit ausdrücklich in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. Die Wiederholung von „Staub der Erde“ und „Mücken“ wurde als prägendes Bild des hebräischen Textes bewahrt; altertümliche Formen wurden vermieden.
