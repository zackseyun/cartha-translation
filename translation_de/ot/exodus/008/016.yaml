source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הַשְׁכֵּ֤ם בַּ/בֹּ֨קֶר֙ וְ/הִתְיַצֵּב֙ לִ/פְנֵ֣י פַרְעֹ֔ה הִנֵּ֖ה יוֹצֵ֣א הַ/מָּ֑יְמָ/ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/016.yaml
  text: 'Then the LORD said to Moses, “Rise early in the morning and station yourself before Pharaoh. Look, he is going out to the water, and you shall say to him, ‘Thus says the LORD: Let my people go, so that they may serve me.’”'
translation:
  language: de
  text: 'Da sagte der HERR zu Mose: „Steh früh am Morgen auf und tritt vor den Pharao. Sieh, er geht gerade zum Wasser hinaus. Sag zu ihm: ›So spricht der HERR: Lass mein Volk ziehen, damit es mir dient.‹“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: Steh früh am Morgen auf
  rationale: Gibt die Aufforderung, sich frühzeitig zu erheben, natürlich und nah am hebräischen Ausdruck wieder.
- source_word: וְהִתְיַצֵּב לִפְנֵי פַרְעֹה
  choice: und tritt vor den Pharao
  rationale: התיצב bezeichnet ein bewusstes Sichhinstellen bzw. Auftreten; „tritt vor“ ist im Deutschen würdig und idiomatisch.
- source_word: הִנֵּה יוֹצֵא הַמָּיְמָה
  choice: Er wird dann gerade zum Wasser hinausgehen
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf die bevorstehende Situation; im Deutschen wird dies durch „dann gerade“ natürlich ausgedrückt, ohne das statische „siehe“ zu erzwingen.
- source_word: שַׁלַּח עַמִּי
  choice: Lass mein Volk ziehen
  rationale: Die etablierte, prägnante Wiedergabe bewahrt sowohl die Aufforderung zur Freilassung als auch das Motiv des Aufbruchs.
- source_word: וְיַעַבְדֻנִי
  choice: damit es mir dient
  rationale: עבד kann kultischen Dienst und allgemeinen Dienst bezeichnen; „mir dient“ hält diese Bedeutungsweite offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen kennzeichnet den Eigennamen und bleibt für gewöhnliche Leser verständlich, ohne eine unsichere Aussprache festzuschreiben.
- issue: Bedeutungsumfang von עבד
  choice: dienen
  alternative: anbeten / Gottesdienst feiern
  rationale: „Dienen“ bewahrt die mögliche kultische Bedeutung, verengt den Ausdruck aber nicht ausschließlich auf Anbetung oder eine Feier.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar gestaffelt; die Formulierung bleibt quellennah, vermeidet jedoch unnötig archaische Wendungen wie „siehe“ oder „stelle dich hin“.
