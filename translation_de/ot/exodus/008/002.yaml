  text: וַ/יֵּ֤ט אַהֲרֹן֙ אֶת יָד֔/וֹ עַ֖ל מֵימֵ֣י מִצְרָ֑יִם וַ/תַּ֨עַל֙ הַ/צְּפַרְדֵּ֔עַ וַ/תְּכַ֖ס אֶת אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/002.yaml
  text: So Aaron stretched out his hand over the waters of Egypt[a], and the frogs came up and covered the land of Egypt.
translation:
  language: de
  text: Da streckte Aaron seine Hand über die Gewässer Ägyptens aus, und die Frösche[a] kamen herauf und bedeckten das Land Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „der Frosch“; die Einzahl ist hier wahrscheinlich kollektiv gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: streckte … aus
  rationale: נטה bezeichnet hier das Ausstrecken der Hand als wirksame Zeichenhandlung; die deutsche Verbklammer klingt natürlich und bewahrt das konkrete Bild.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: Der hebräische Text nennt ausdrücklich die Hand, nicht den Arm.
- source_word: עַל
  choice: über
  rationale: Die Präposition beschreibt hier die räumliche Ausrichtung der ausgestreckten Hand auf die Gewässer hin.
- source_word: מֵימֵי מִצְרָיִם
  choice: die Gewässer Ägyptens
  rationale: Der hebräische Plural bezeichnet zusammenfassend die Wasserläufe und Wasserflächen Ägyptens; „Gewässer“ gibt dies im Deutschen knapp und idiomatisch wieder.
- source_word: וַתַּעַל
  choice: kamen herauf
  rationale: עלה beschreibt das Heraufkommen der Frösche aus dem Wasser auf das Land.
- source_word: הַצְּפַרְדֵּעַ
  choice: die Frösche
  rationale: Das formal singularische hebräische Substantiv wird hier sehr wahrscheinlich kollektiv gebraucht; im natürlichen Deutschen steht dafür der Plural.
- source_word: וַתְּכַס
  choice: bedeckten
  rationale: כסה bedeutet hier schlicht „bedecken“ und vermittelt das Ausmaß der Plage ohne zusätzliche Deutung.
- source_word: אֶרֶץ מִצְרָיִם
  choice: das Land Ägypten
  rationale: אֶרֶץ bezeichnet das ägyptische Territorium; „das Land Ägypten“ ist eine geläufige, würdige biblische Formulierung.
