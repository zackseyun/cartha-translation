source:
  edition: WLC
  text: וַ/יִּקְרָ֣א פַרְעֹ֔ה אֶל מֹשֶׁ֖ה וּֽ/לְ/אַהֲרֹ֑ן וַ/יֹּ֗אמֶר לְכ֛וּ זִבְח֥וּ לֵֽ/אלֹהֵי/כֶ֖ם בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/021.yaml
  text: Then Pharaoh called Moses and Aaron and said[a], “Go, sacrifice to your God in the land.”
translation:
  language: de
  text: 'Da rief der Pharao Mose und Aaron und sagte: »Geht und bringt eurem Gott im Land[a] Opfer dar.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Kontext ist Ägypten gemeint, also ein Opfer innerhalb des Landes statt eines Zuges in die Wüste.
    reason: Kontextuelle Klärung der im Hebräischen unbestimmt formulierten Ortsangabe בָּאָרֶץ, ohne den Bezug im Haupttext zu explizieren.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief … zu sich
  rationale: קרא mit אֶל bezeichnet hier das Herbeirufen der beiden; »zu sich rufen« ist im Deutschen natürlich und gibt den erzählerischen Zusammenhang präzise wieder.
- source_word: פַרְעֹה
  choice: der Pharao
  rationale: Die übliche deutsche Wiedergabe des ägyptischen Herrschertitels.
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Schlichte und natürliche Wiedergabe des hebräischen Erzählverbs אמר.
- source_word: לְכוּ
  choice: Geht
  rationale: Direkte Wiedergabe des pluralischen Imperativs von הלך.
- source_word: זִבְחוּ
  choice: bringt … Opfer dar
  rationale: זבח bezeichnet hier das Darbringen von Schlachtopfern; die deutsche Wendung ist verständlich, würdig und kultisch präziser als das alleinstehende Verb »opfern«.
- source_word: לֵאלֹהֵיכֶם
  choice: eurem Gott
  rationale: Der Präposition ל entsprechend wird Gott als Empfänger der Opferhandlung bezeichnet.
- source_word: בָּאָרֶץ
  choice: hier im Land
  rationale: Wörtlich »im Land«; »hier« verdeutlicht die im Kontext gemeinte Beschränkung auf Ägypten, ohne Ägypten ausdrücklich in den Haupttext einzutragen.
theological_decisions:
- issue: Pharaos eingeschränkte Erlaubnis
  choice: »hier im Land« bewahrt die örtliche Beschränkung auf das Land, in dem sie sich befinden.
  alternative: »in Ägypten«
  rationale: Der Kontext macht Ägypten wahrscheinlich, doch der hebräische Wortlaut nennt es nicht ausdrücklich. Die Übersetzung wahrt daher die Formulierung »im Land« und erläutert die Referenz in der Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und bestimmt; die hebräische Ortsangabe wird im Haupttext bewahrt und in der Fußnote kontextuell erläutert.
