review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe der Hofritualisten, ihrer geheimen Künste, ihres beabsichtigten Hervorbringens und ihres Unvermögens ist im Grundsatz zutreffend. »Versuchten dasselbe« schwächt jedoch das explizite וַיַּעֲשׂוּ כֵן (»sie taten ebenso«) unnötig ab, während »befielen« das schlichte Zustandsprädikat »waren an/auf Menschen und Tieren« zu einem stärkeren Vorgang ausbaut.
  naturalness: Die vorgeschlagene Fassung ist modernes, flüssiges Standarddeutsch. »Sie gingen ... ebenso vor« ist idiomatisch und gibt zugleich den Bezug auf die vorherige Handlung wieder. »waren an Menschen und Tieren« ist für Insektenbefall natürlich und bleibt näher am hebräischen Zustandssatz als »befielen«.
  terminology: »Zauberer«, »geheime Künste«, »Stechmücken« sowie »Menschen und Tiere« sind angemessen. Die Fußnote bewahrt die lexikalische Unsicherheit von כִּנִּים mit der etablierten Alternative »Läuse« und ist korrekt verankert.
  issues:
  - severity: medium
    issue: »versuchten dasselbe« gibt וַיַּעֲשׂוּ כֵן nicht vollständig wieder.
    rationale: Der hebräische Text sagt zunächst, dass die Zauberer ebenso handelten, und nennt dann ihr Ziel sowie ihr Scheitern. Das Verb »versuchten« verlegt den Schwerpunkt ausschließlich auf den Versuch.
  - severity: low
    issue: »Die Stechmücken befielen Menschen und Tiere« verstärkt die Aussage.
    rationale: וַתְּהִי ... בָּאָדָם וּבַבְּהֵמָה beschreibt, dass die Insekten an Menschen und Tieren waren. »Befielen« ist zwar kontextuell plausibel, formuliert aber aktiver als der Ausgangstext.
