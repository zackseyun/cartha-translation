base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/014.yaml
  text: And the magicians did the same by their secret arts to bring out the gnats[a], but they were not able; and the gnats were on man and on beast.
translation:
  language: de
  text: Die Zauberer gingen mit ihren geheimen Künsten ebenso vor, um die Stechmücken[a] hervorzubringen; doch sie konnten es nicht. Die Stechmücken waren an Menschen und Tieren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Läuse«. Welches Insekt mit dem hebräischen Ausdruck genau gemeint ist, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: die Zauberer
  rationale: Bezeichnet die rituellen Spezialisten am Hof des Pharaos; »Zauberer« ist im Deutschen verständlich und im Exoduskontext etabliert, ohne ihre Praktiken unnötig genauer zu bestimmen.
- source_word: בְּלָטֵיהֶם
  choice: mit ihren geheimen Künsten
  rationale: Gibt verborgene magische Praktiken wieder und bewahrt sowohl den geheimen als auch den okkulten Charakter des Ausdrucks.
- source_word: לְהוֹצִיא
  choice: hervorzubringen
  rationale: Der Kausativ von יצא bedeutet wörtlich »herausbringen«; im Kontext ist idiomatisch gemeint, dass die Zauberer die Insekten erzeugen beziehungsweise erscheinen lassen wollten.
- source_word: הַכִּנִּים / הַכִּנָּם
  choice: die Stechmücken
  rationale: Die genaue Insektenart ist unsicher. »Stechmücken« ist eine verbreitete, kontextgerechte Wiedergabe; »Läuse« wird als echte lexikalische Alternative in der Fußnote bewahrt.
- source_word: וְלֹא יָכֹלוּ
  choice: konnten es aber nicht
  rationale: Gibt die ausdrücklich festgestellte Unfähigkeit knapp und natürlich wieder; das Pronomen nimmt den unmittelbar vorausgehenden Versuch auf.
- source_word: בָּאָדָם
  choice: Menschen
  rationale: אָדָם ist hier kollektiv gebraucht und bezeichnet die Menschen allgemein, nicht einen einzelnen Mann. Der deutsche Plural vermittelt diesen Sinn natürlich.
- source_word: וּבַבְּהֵמָה
  choice: und Tiere
  rationale: בְּהֵמָה steht kollektiv für Tiere beziehungsweise Vieh. »Tiere« bildet mit »Menschen« ein natürliches und inhaltlich genaues Paar.
theological_decisions:
- issue: Kollektive Wiedergabe von אָדָם
  choice: Menschen
  alternative: der Mensch
  rationale: Das Hebräische meint die Menschheit beziehungsweise Menschen allgemein. Im modernen Deutschen drückt der Plural den kollektiven Sinn klar aus, ohne das Wort auf männliche Personen einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzgliederung macht Versuch, Scheitern und fortdauernde Plage klar erkennbar. »Befielen« gibt das hebräische Zustandsprädikat idiomatisch wieder, ohne die Aussage inhaltlich zu erweitern.
