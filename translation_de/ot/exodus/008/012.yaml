  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹר֙ אֶֽל אַהֲרֹ֔ן נְטֵ֣ה אֶֽת מַטְּ/ךָ֔ וְ/הַ֖ךְ אֶת עֲפַ֣ר הָ/אָ֑רֶץ וְ/הָיָ֥ה לְ/כִנִּ֖ם בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/012.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your staff and strike the dust of the earth, and it will become gnats throughout all the land of Egypt.’”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Sag zu Aaron: ‚Streck deinen Stab aus und schlag auf den Staub des Erdbodens. Dann wird er im ganzen Land Ägypten zu Mücken[a] werden.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Läuse“; das hebräische Wort bezeichnet kleine beißende oder lästige Insekten. Welche Art genau gemeint ist, bleibt unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, sodass der im Hebräischen ausdrücklich stehende Eigenname erhalten bleibt.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Die Form führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: אֱמֹר
  choice: Sag
  rationale: Der Imperativ fordert Mose auf, Aaron die folgende Anweisung mitzuteilen. „Sag“ ist klar, direkt und gegenwärtig.
- source_word: נְטֵה אֶת מַטְּךָ
  choice: Streck deinen Stab aus
  rationale: Die Formulierung bewahrt sowohl die ausstreckende Bewegung als auch den Stab als ihr Instrument.
- source_word: וְהַךְ
  choice: und schlag auf
  rationale: נכה bezeichnet hier einen Schlag gegen den Staub; „schlag auf“ ist präzise und nicht altertümlich.
- source_word: עֲפַר הָאָרֶץ
  choice: den Staub des Erdbodens
  rationale: „Staub“ gibt עָפָר wieder; „Erdboden“ bezeichnet hier natürlicher als „Erde“ die Oberfläche, auf die Aaron schlagen soll.
- source_word: וְהָיָה לְכִנִּם
  choice: Dann wird er … zu Mücken werden
  rationale: „Werden“ bringt die im Kontext bezeichnete Verwandlung des Staubs zum Ausdruck. „Mücken“ bezeichnet kleine lästige Insekten, ohne die unsichere Art allzu eng festzulegen.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: im ganzen Land Ägypten
  rationale: Die Wendung gibt die umfassende Ausbreitung über das gesamte ägyptische Land knapp und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Umschrift „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter und gut verständlicher Rede. Die unsichere Bestimmung von כִּנִּים wird im Haupttext nicht überpräzisiert und in der Fußnote ausdrücklich offengehalten.
