  text: וַ/יֵּצֵ֥א מֹשֶׁ֖ה מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יֶּעְתַּ֖ר אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/026.yaml
  text: So Moses went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: de
  text: Da ging Mose vom Pharao fort und flehte zu Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „betete inständig zu Jahwe“. Das hebräische Verb bezeichnet dringendes Flehen oder inständiges Bitten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ging … weg
  rationale: Das Qal-Wayyiqtol von יצא bezeichnet Moses’ tatsächliches Fortgehen und führt die Erzählung weiter. „ging … weg“ ist im modernen Deutsch natürlich.
- source_word: מֵעִם
  choice: vom Pharao weg
  rationale: Die Präposition bezeichnet die Trennung aus der Gemeinschaft oder Gegenwart einer Person. „vom Pharao weg“ gibt diese räumlich-persönliche Nuance knapp wieder.
- source_word: פַּרְעֹה
  choice: Pharao
  rationale: Übliche deutsche Wiedergabe des ägyptischen Herrschertitels.
- source_word: וַיֶּעְתַּר
  choice: flehte
  rationale: Das Verb עתר bezeichnet hier ein dringliches, inständiges Bitten zu Gott und ist stärker als ein allgemeines „beten“.
- source_word: אֶל
  choice: zu
  rationale: אֶל bezeichnet den Adressaten der inständigen Bitte; „zu Jahwe flehen“ ist idiomatisches Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als Gottesname, während „der HERR“ eine traditionelle Ersatzlesung ist.
- issue: Art von Moses’ Anrufung Gottes
  choice: flehte zu Jahwe
  alternative: betete inständig zu Jahwe
  rationale: Die Wiedergabe bewahrt die im Verb עתר liegende Dringlichkeit, ohne den Inhalt oder die Form der Bitte näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kurze erzählerische Satzbau bleibt erhalten; „flehte“ vermittelt die Intensität des hebräischen Verbs ohne altertümlich zu wirken.
