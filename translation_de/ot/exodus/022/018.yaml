  text: Whoever lies with an animal shall surely be put to death[a].
translation:
  language: de
  text: Wer mit einem Tier Geschlechtsverkehr hat, muss unbedingt getötet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wird gewiss sterben“. Die hebräische Rechtsformel bezeichnet hier die sichere Vollstreckung der Todesstrafe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל שֹׁכֵב
  choice: Wer … geschlechtlich verkehrt
  rationale: כָּל mit dem Partizip bezeichnet allgemein jeden, der die genannte Handlung begeht. Die deutsche Wer-Konstruktion gibt dies natürlich wieder; „geschlechtlich verkehren“ macht den im Hebräischen durch שׁכב mit עִם bezeichneten sexuellen Sinn klar.
- source_word: עִם בְּהֵמָה
  choice: mit einem Tier
  rationale: Die Präposition עִם bedeutet „mit“; בְּהֵמָה bezeichnet hier ein Tier. „Tier“ ist im modernen Deutsch klar und vermeidet das altertümliche oder abwertend klingende „Vieh“.
- source_word: מוֹת יוּמָת
  choice: muss mit dem Tod bestraft werden
  rationale: Der Infinitivus absolutus מוֹת verstärkt die passive Verbform יוּמָת. Im Rechtszusammenhang bezeichnet die Formel die sichere Verhängung der Todesstrafe; die gewählte Formulierung wahrt den passiven und gerichtlichen Charakter.
theological_decisions:
- issue: Wiedergabe der gesetzlichen Todesstrafenformel
  choice: muss mit dem Tod bestraft werden
  alternative: muss gewiss sterben
  rationale: Die hebräische Formel kann wörtlicher als sichere Todesankündigung wiedergegeben werden, fungiert hier aber als gerichtliche Strafbestimmung. Die Hauptfassung macht diesen Rechtscharakter deutlich, während die Fußnote die formale Alternative bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sexuelle Bedeutung wird klar benannt, ohne klinisch oder sensationsheischend zu formulieren; die Rechtssprache bleibt knapp und bestimmt.
