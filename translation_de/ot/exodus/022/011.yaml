  text: But if it is stolen from him[a], he shall make restitution to its owner.
translation:
  language: de
  text: Wenn es ihm aber tatsächlich gestohlen wird[a], soll er dem Besitzer Ersatz leisten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht vor dem Verb ein verstärkender Infinitiv: „wenn es wirklich gestohlen wird“. Gemeint ist ein Diebstahl, während die Sache sich bei ihm in Verwahrung befand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Leitet innerhalb der Rechtsbestimmungen einen bedingten Gegensatz ein; die deutsche Nachstellung von „aber“ klingt natürlich.
- source_word: גָּנֹב יִגָּנֵב
  choice: tatsächlich gestohlen wird
  rationale: Der absolute Infinitiv mit der finiten Verbform verstärkt den Verbalbegriff. „Tatsächlich“ gibt diese Hervorhebung wieder, ohne die hebräische Konstruktion unnatürlich nachzuahmen.
- source_word: מֵעִמּוֹ
  choice: ihm
  rationale: Entspricht dem wörtlichen Sinn „von bei ihm“; im rechtlichen Zusammenhang ist damit gemeint, dass die Sache aus seinem Gewahrsam gestohlen wird.
- source_word: יְשַׁלֵּם
  choice: Ersatz leisten
  rationale: Die Piel-Form von שלם bezeichnet in diesem rechtlichen Zusammenhang das Leisten von Ersatz oder Entschädigung.
- source_word: לִבְעָלָיו
  choice: seinem Besitzer
  rationale: בעל bezeichnet hier den Eigentümer der anvertrauten Sache beziehungsweise des Tieres. Das Singularpronomen bezieht sich auf den impliziten Gegenstand.
