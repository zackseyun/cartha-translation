    issue: Die Fußnote ergänzt „Richter, die in göttlicher Vollmacht handeln“.
    rationale: Die Wendung geht über die im Text belegte Mehrdeutigkeit von אֱלֹהִים hinaus und kann eine bestimmte Auslegung nahelegen. Die Fußnote soll lediglich die mögliche Lesart „Richter“ dokumentieren.
