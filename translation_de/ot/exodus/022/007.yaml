base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/007.yaml
  text: If the thief is not found[a], the owner of the house shall come near to God to determine whether he has not laid his hand on his neighbor’s property.
translation:
  language: de
  text: Wird der Dieb nicht gefunden, soll der Besitzer des Hauses vor Gott[a] treten, um festzustellen, ob er nicht Hand an das Eigentum seines Mitmenschen gelegt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: vor die Richter. Im Hebräischen steht „zu Gott“; in diesem rechtlichen Zusammenhang kann אֱלֹהִים auch Richter bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא הַגַּנָּב
  choice: der Dieb … gefunden
  rationale: Das Nifal von מצא wird im rechtlichen Zusammenhang unmittelbar passiv wiedergegeben. „Gefunden“ lässt offen, ob der Dieb lediglich ermittelt oder auch ergriffen wird.
- source_word: וְנִקְרַב
  choice: soll … treten
  rationale: Das Nifal kann intransitiv („herantreten“) oder passiv („vorgeführt werden“) verstanden werden. „Vor … treten“ ist im Deutschen eine natürliche rechtliche Formulierung und legt die äußere Veranlassung nicht fest.
- source_word: בַּעַל הַבַּיִת
  choice: der Besitzer des Hauses
  rationale: Die Wendung bezeichnet hier denjenigen, der über das Haus verfügt und die anvertrauten Sachen verwahrt. „Besitzer des Hauses“ ist verständlich und vermeidet den heute missverständlichen Ausdruck „Hausherr“.
- source_word: אֶל הָאֱלֹהִים
  choice: vor Gott
  rationale: Der hebräische Wortlaut nennt אֱלֹהִים. „Vor Gott treten“ gibt den Sinn des gerichtlichen Nahens im Deutschen natürlich wieder; die mögliche Deutung als Richter wird in der Fußnote bewahrt.
- source_word: אִם לֹא שָׁלַח יָדוֹ
  choice: ob er nicht Hand an … gelegt hat
  rationale: Die Formulierung bewahrt das hebräische Bild für unrechtmäßige Aneignung oder Verwendung. Eine direkte Wiedergabe mit „gestohlen“ wäre enger als der Ausgangstext.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: an das Eigentum seines Mitmenschen
  rationale: מְלָאכָה bezeichnet hier im Zusammenhang mit anvertrautem Geld oder Gut den Besitz beziehungsweise die Habe des anderen. „Eigentum“ erfasst den rechtlichen Zusammenhang, während „Mitmensch“ רֵעַ allgemein und verständlich wiedergibt.
theological_decisions:
- issue: Bedeutung von אֱלֹהִים in diesem Rechtsfall
  choice: vor Gott
  alternative: vor die Richter
  rationale: Die Grundbedeutung des hebräischen Ausdrucks ist „Gott“. Da אֱלֹהִים in rechtlichen Zusammenhängen auch auf Richter als Träger göttlicher Vollmacht bezogen werden kann, wird diese Möglichkeit nicht im Haupttext festgelegt, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer rechtlicher Sprache. Die hebräische Bildsprache „Hand an etwas legen“ und die Mehrdeutigkeit von אֱלֹהִים bleiben erhalten.
