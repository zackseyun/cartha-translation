  verdict: revise
  source_fidelity: 'Der Haupttext gibt den hebräischen Sinn insgesamt zuverlässig wieder: Der Dieb wird nicht gefunden; der Hausherr/Besitzer tritt vor Gott; anschließend steht zur Klärung, ob er seine Hand nach dem Gut seines Nächsten ausgestreckt hat. „Hand an … gelegt“ bewahrt die hebräische Idiomatik, ohne sie unzulässig auf Diebstahl einzuengen. „Vor Gott treten“ ist für אֶל־הָאֱלֹהִים eine natürliche deutsche Wiedergabe; die alternative Deutung „Richter“ muss als Möglichkeit kenntlich bleiben.'
  naturalness: Der Satz ist klares modernes Standarddeutsch und hat einen angemessen sachlich-rechtlichen Ton. „Um festzustellen“ ist hier etwas unmittelbarer als „damit geklärt wird“ und bindet den folgenden Ob-Satz klar an das gerichtliche Herantreten.
  terminology: '„Besitzer des Hauses“ und „Eigentum seines Mitmenschen“ sind verständlich und im Kontext vertretbar. Die Fußnote sollte jedoch nicht behaupten, Richter handelten hier ausdrücklich „in göttlicher Vollmacht“: Das ist eine weitergehende Deutung, die der hebräische Wortlaut nicht selbst ausspricht. Die Alternative ist neutral als mögliche Bedeutung von אֱלֹהִים im Rechtskontext zu formulieren.'
  issues:
