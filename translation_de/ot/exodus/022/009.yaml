base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/009.yaml
  text: If a man gives his neighbor a donkey[a], or an ox, or a sheep, or any animal to keep, and it dies, or is injured, or is carried off, with no one seeing it[c][b],
translation:
  language: de
  text: Wenn jemand seinem Nächsten einen Esel, ein Rind, ein Schaf oder eine Ziege oder irgendein Nutztier zur Verwahrung übergibt und das Tier stirbt, verletzt[a] oder fortgeführt wird, ohne dass es jemand gesehen hat[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zerbrochen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Es gibt keinen Augenzeugen für das, was geschehen ist.'
    reason: clarification
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Leitet einen kasuistischen Rechtsfall ein; „wenn“ ist dafür im modernen Deutschen natürlich.
- source_word: יִתֵּן
  choice: übergibt
  rationale: נתן bedeutet grundsätzlich „geben“; zusammen mit לִשְׁמֹר bezeichnet es hier die Übergabe in fremde Obhut.
- source_word: אִישׁ
  choice: jemand
  rationale: Im kasuistischen Recht bezeichnet das maskuline Singularwort einen allgemeinen Rechtsfall. „Jemand“ gibt diese repräsentative Funktion im Deutschen natürlich wieder, ohne den Anwendungsbereich unnötig auf Männer zu beschränken.
- source_word: אֶל רֵעֵהוּ
  choice: seinem Nächsten
  rationale: רֵעַ bezeichnet hier einen Mitmenschen beziehungsweise Angehörigen derselben sozialen Gemeinschaft; „Nächster“ wahrt den rechtlich-ethischen Klang.
- source_word: חֲמוֹר
  choice: Esel
  rationale: Direkte und gegenwärtig verständliche deutsche Entsprechung.
- source_word: שׁוֹר
  choice: Rind
  rationale: שׁוֹר bezeichnet ein Tier der Rindergattung und ist nicht zwingend auf einen kastrierten Arbeitsochsen beschränkt; „Rind“ bewahrt diese Breite.
- source_word: שֶׂה
  choice: Stück Kleinvieh
  rationale: שֶׂה kann ein einzelnes Schaf oder eine Ziege bezeichnen. „Stück Kleinvieh“ erhält diese lexikalische Breite, die eine bloße Wiedergabe mit „Schaf“ verengen würde.
- source_word: וְכָל בְּהֵמָה
  choice: oder irgendein anderes Nutztier
  rationale: בְּהֵמָה meint hier ein domestiziertes Tier als anvertrautes Eigentum. „anderes“ macht idiomatisch deutlich, dass die zuvor genannten Tiere eingeschlossen sind.
- source_word: לִשְׁמֹר
  choice: zur Verwahrung
  rationale: 'Der Infinitiv bezeichnet den Zweck der Übergabe: Das Tier wird der Obhut des Nächsten anvertraut.'
- source_word: וּמֵת
  choice: und das Tier stirbt
  rationale: Das ausdrücklich wiederaufgenommene „Tier“ verhindert im Deutschen einen unklaren Pronomenbezug.
- source_word: נִשְׁבַּר
  choice: verletzt
  rationale: Die Grundbedeutung ist „zerbrochen werden“; auf ein Tier bezogen ist „verletzt werden“ die natürliche deutsche Wiedergabe.
- source_word: נִשְׁבָּה
  choice: fortgeführt wird
  rationale: Das Niphal von שׁבה bezeichnet ein Wegführen beziehungsweise Gefangennehmen. „Fortgeführt“ bleibt weiter als „gestohlen“ und legt den Täter oder genauen Vorgang nicht fest.
- source_word: אֵין רֹאֶה
  choice: ohne dass es jemand gesehen hat
  rationale: Die Wendung besagt, dass kein Augenzeuge für das Geschehen vorhanden ist.
theological_decisions:
- issue: Allgemeiner Geltungsbereich des kasuistischen Gesetzes
  choice: „jemand“ statt geschlechtsspezifischem „ein Mann“
  alternative: „ein Mann“
  rationale: אִישׁ steht im singularisch-maskulinen Muster antiker Rechtsfälle, hat hier aber repräsentative Funktion. Die neutrale deutsche Formulierung verändert weder Rechtssubjekt noch Rechtsfolge.
translation_notes:
  register: Moderner, würdiger Rechtstext mit klarer Wenn-dann-Fallstruktur; der Satz bleibt entsprechend dem hebräischen Kontext und der Versabgrenzung offen, da die Rechtsfolge im folgenden Vers steht.
