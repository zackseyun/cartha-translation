  terminology: „Esel“, „Rind“, „Nutztier“ und „zur Verwahrung“ sind passend. Für שֶׂה ist die koordinierte Formulierung „ein Schaf oder eine Ziege“ besonders klar. Die Fußnote zur wörtlichen Bedeutung von נִשְׁבַּר bleibt sinnvoll.
