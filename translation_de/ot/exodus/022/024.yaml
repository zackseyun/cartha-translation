  naturalness: Der Satz ist grundsätzlich verständlich, aber „dich ihm gegenüber nicht wie ein Gläubiger verhalten“ klingt schwerfällig. „tritt ihm gegenüber nicht als Gläubiger auf“ ist modernes, natürliches und zugleich rechtssprachlich passendes Deutsch.
