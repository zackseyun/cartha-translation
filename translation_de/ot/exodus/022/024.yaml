base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/024.yaml
  text: If you lend money to my people[a], to the poor among you, you shall not be like a creditor to him[c][b]; you shall not impose interest on him.
translation:
  language: de
  text: Wenn du einem aus meinem Volk Geld[a] leihst, einem Armen bei dir, dann tritt ihm gegenüber nicht als Gläubiger auf; ihr sollt ihm keine Zinsen auferlegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Silber“; hier im Sinn von Geld.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die Konditionalpartikel wird formal mit „wenn“ wiedergegeben; im kasuistischen Rechtsstil bezeichnet sie den eintretenden Fall, ohne dass im Deutschen eine zusätzliche Fußnote nötig ist.
- source_word: כֶּסֶף
  choice: Geld
  rationale: Wörtlich „Silber“, bezeichnet hier im wirtschaftlich-rechtlichen Zusammenhang das verliehene Geld.
- source_word: תַּלְוֶה
  choice: leihst
  rationale: Der Hifil von לוה bedeutet hier „jemandem leihen“; die deutsche Dativkonstruktion ist natürlich und präzise.
- source_word: עַמִּי ... הֶעָנִי
  choice: einem aus meinem Volk … einem Armen
  rationale: Die appositionale Konstruktion wird so verständlich wiedergegeben, dass der Arme als Angehöriger von Gottes Volk erkennbar bleibt; der substantivierte maskuline Singular wird als „einem Armen“ bewahrt.
- source_word: עִמָּךְ
  choice: bei dir
  rationale: Dies hält sich enger an „mit/bei dir“ als „unter euch“ und bewahrt den singularischen Bezug der hebräischen Anrede.
- source_word: כְּנֹשֶׁה
  choice: wie ein Gläubiger
  rationale: Das Partizip bezeichnet einen Gläubiger beziehungsweise Schuldeneintreiber, besonders unter dem Aspekt des Drängens auf Zahlung; der folgende Satz konkretisiert das Verbot.
- source_word: תְשִׂימוּן עָלָיו נֶשֶׁךְ
  choice: ihr sollt ihm keine Zinsen auferlegen
  rationale: Die Wendung bedeutet wörtlich, Zins auf jemanden zu legen. „Auferlegen“ wahrt das Bild und „Zinsen“ gibt den ökonomischen Sinn von נֶשֶׁךְ zeitgemäß wieder.
theological_decisions:
- issue: Reichweite des Zinsverbots
  choice: Das Verbot wird auf den im Vers genannten Armen aus Gottes Volk bezogen.
  alternative: Ein allgemeines Verbot jeder Verzinsung unabhängig von Person und Situation.
  rationale: Der Satz bindet das Verbot ausdrücklich an die Kreditvergabe an einen Armen aus dem Gottesvolk; eine darüber hinausgehende systematische Aussage wird nicht in den Text eingetragen.
- issue: Wechsel von singularischer zu pluralischer Anrede
  choice: „du“ im ersten Verbot und „ihr“ im zweiten werden bewahrt.
  alternative: Beide Verbote durchgehend singularisch oder pluralisch wiedergeben.
  rationale: Der hebräische Text wechselt von תִהְיֶה im Singular zu תְשִׂימוּן im Plural. Dieser echte grammatische Wechsel bleibt sichtbar, auch wenn sein rhetorischer Grund nicht erklärt wird.
- issue: Soziale Bezeichnung הֶעָנִי
  choice: „einem Armen“
  alternative: „einer armen Person“ oder kollektiv „den Armen“
  rationale: Der hebräische Ausdruck steht im maskulinen Singular und bezeichnet hier eine einzelne bedürftige Person; die Übersetzung bewahrt diese Form, ohne das zusätzliche Substantiv „Mann“ einzufügen.
translation_notes:
  register: Moderne, würdevolle Rechtssprache mit natürlicher deutscher Syntax. Die Wiederaufnahme durch „dann“ verdeutlicht nach der vorangestellten Apposition den Hauptsatz. Der auffällige Wechsel von singularischem „du“ zu pluralischem „ihr“ entspricht dem Hebräischen und wurde nicht harmonisiert.
