  source_fidelity: Die Übersetzung gibt die beiden Verbote gegen den גֵר sowie die begründende Erinnerung an Israels eigene frühere Lage vollständig und in der Reihenfolge des Hebräischen wieder. Das im Hebräischen beim zweiten Verb stehende maskuline Singularsuffix ist im Deutschen idiomatisch durch das vorangestellte gemeinsame Objekt „einen Fremden“ mitgetragen.
  naturalness: „Einen Fremden sollst du weder schlecht behandeln noch unterdrücken“ ist modernes, verständliches Deutsch mit einem angemessen würdigen Gesetzesregister. Auch „denn ihr seid selbst Fremde im Land Ägypten gewesen“ ist natürlich; die Wiederholung von „Fremde“ ist stilistisch und inhaltlich gerechtfertigt.
  terminology: „Fremder/Fremde“ ist als allgemeinverständliche Wiedergabe von גֵר vertretbar. Die Fußnote erläutert zutreffend, dass nicht ein bloß Durchreisender, sondern ein nichtheimischer Ansässiger gemeint ist. „Schlecht behandeln“ wahrt die weite Bedeutung von תוֹנֶה, während „unterdrücken“ לחץ angemessen stark wiedergibt.
