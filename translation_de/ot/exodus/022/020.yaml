source:
  edition: WLC
  text: וְ/גֵ֥ר לֹא תוֹנֶ֖ה וְ/לֹ֣א תִלְחָצֶ֑/נּוּ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/020.yaml
  text: You shall not mistreat a foreigner or oppress him[a], for you were foreigners in the land of Egypt.
translation:
  language: de
  text: Einen Fremden[a] sollst du weder schlecht behandeln noch unterdrücken; denn ihr seid selbst Fremde im Land Ägypten gewesen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „einen Beisassen“ beziehungsweise „einen ansässigen Ausländer“. Das hebräische Wort גֵר bezeichnet einen Nichtheimischen, der unter Israel lebt.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר / גֵרִים
  choice: Fremder / Fremde
  rationale: Das hebräische Wort bezeichnet hier einen Nichtisraeliten, der dauerhaft unter Israel lebt, nicht lediglich einen Durchreisenden. „Fremder“ ist im Deutschen verständlich und lässt sich im Singular und Plural konsequent wiederholen; die Fußnote präzisiert den rechtlichen und sozialen Sinn.
- source_word: תוֹנֶה
  choice: schlecht behandeln
  rationale: Die Hifil-Form von ינה bezeichnet ungerechte oder unfaire Behandlung. „Schlecht behandeln“ gibt den weiten Sinn natürlich wieder, ohne ihn auf wirtschaftliche Ausbeutung zu verengen.
- source_word: תִלְחָצֶנּוּ
  choice: ihn unterdrücken
  rationale: לחץ bezeichnet bedrängenden Druck oder Unterdrückung. „Unterdrücken“ wahrt das Gewicht des gesetzlichen Verbots; das maskuline Singularsuffix wird durch „ihn“ wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung des Verbots ein. „Denn“ entspricht dem knappen gesetzlich-begründenden Ton.
- source_word: הֱיִיתֶם
  choice: ihr seid … gewesen
  rationale: Das Verb beschreibt Israels früheren Zustand in Ägypten. Das Perfekt mit „gewesen“ ist idiomatisches modernes Deutsch.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Die Wiedergabe behält das ausdrücklich genannte אֶרֶץ („Land“) bei und klingt zugleich natürlich.
theological_decisions:
- issue: Generischer maskuliner Singular in der Gesetzessprache
  choice: „einen Fremden“ mit dem entsprechenden Pronomen „ihn“
  alternative: Plural „Fremde … sie“ oder geschlechtsneutrale Umformulierung
  rationale: Der hebräische Text verwendet גֵר im maskulinen Singular sowie ein maskulines Singularsuffix. Die Übersetzung bewahrt diese grammatische Form, ohne den generischen Geltungsbereich einzuschränken.
- issue: Begründung durch Israels eigene Fremdlingserfahrung
  choice: Wiederholung desselben deutschen Lexems „Fremder/Fremde“
  alternative: Im zweiten Satz ein anderes Wort wie „Ausländer“ oder „Schutzbürger“
  rationale: Die Wiederholung von גֵר im Hebräischen verbindet das Gebot ausdrücklich mit Israels eigener Erfahrung. Lexikalische Konsistenz erhält diese ethische und theologische Spannung.
translation_notes:
  register: Moderne, würdige Gesetzessprache. Die Formulierung „weder … noch“ bildet die beiden parallelen Verbote knapp ab. „Land Ägypten“ bewahrt die formale Struktur des Hebräischen, während „ihr seid selbst … gewesen“ die begründende Erinnerung idiomatisch hervorhebt.
