source:
  edition: WLC
  text: אִם בַּ/מַּחְתֶּ֛רֶת יִמָּצֵ֥א הַ/גַּנָּ֖ב וְ/הֻכָּ֣ה וָ/מֵ֑ת אֵ֥ין ל֖/וֹ דָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/001.yaml
  text: If the thief is found breaking in and is struck so that he dies[b][a], there is no bloodguilt for him.
translation:
  language: de
  text: Wenn der Dieb beim Einbruch ertappt und so geschlagen wird, dass er stirbt, lädt derjenige, der ihn geschlagen hat, keine Blutschuld auf sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Für ihn ist keine Blutschuld.“ Gemeint ist derjenige, der den Dieb geschlagen hat.'
    reason: Die hebräische Wendung ist knapp, und der Bezug des Pronomens muss im Deutschen verdeutlicht werden.
lexical_decisions:
- source_word: בַּמַּחְתֶּרֶת
  choice: beim Einbruch
  rationale: Das Substantiv bezeichnet das gewaltsame oder heimliche Eindringen, ursprünglich möglicherweise durch das Durchbrechen beziehungsweise Untergraben einer Wand. „Beim Einbruch“ gibt die rechtliche Situation im heutigen Deutsch natürlich wieder, ohne die konkrete Methode zu stark festzulegen.
- source_word: יִמָּצֵא
  choice: ertappt
  rationale: Das Nifal von מצא bedeutet hier, dass der Dieb beim Geschehen angetroffen wird. „Ertappt“ ist im Zusammenhang mit einem Einbruch idiomatischer als das formalere „gefunden“.
- source_word: הַגַּנָּב
  choice: der Dieb
  rationale: גנב ist die gewöhnliche Bezeichnung für einen Dieb. Der Kontext konkretisiert ihn als Einbrecher, doch die direkte lexikalische Entsprechung bleibt „Dieb“.
- source_word: וְהֻכָּה
  choice: geschlagen wird
  rationale: Das passive Verb bezeichnet einen Schlag beziehungsweise ein Schlagen, ohne zwingend mehrere Schläge auszudrücken. Die passive Form des Hebräischen bleibt erhalten.
- source_word: וָמֵת
  choice: so … dass er stirbt
  rationale: Die deutsche Ergebniskonstruktion bringt den Zusammenhang zwischen dem Schlagen und dem Tod natürlich zum Ausdruck; formal wäre auch „und stirbt“ möglich.
- source_word: אֵין לוֹ דָּמִים
  choice: lädt … keine Blutschuld auf sich
  rationale: Der idiomatische Plural דמים bezeichnet hier rechtliche Schuld wegen vergossenen Blutes. Die Formulierung bewahrt diese Rechtskategorie und macht zugleich deutlich, dass sich das Pronomen auf denjenigen bezieht, der den Dieb geschlagen hat.
theological_decisions:
- issue: Rechtliche Bewertung der Tötung eines Einbrechers
  choice: Die Aussage wird als Ausschluss von Blutschuld in dieser konkreten Situation wiedergegeben.
  alternative: „Er ist nicht des Mordes schuldig.“
  rationale: Der hebräische Text fällt ein begrenztes Rechtsurteil über Blutschuld; er formuliert weder eine allgemeine Billigung des Tötens noch verwendet er ausdrücklich die engere moderne Kategorie „Mord“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die juristische Präzision von „Blutschuld“ wird bewahrt; „beim Einbruch ertappt“ gibt die Szene verständlich und ohne unnötige technische Sprache wieder.
