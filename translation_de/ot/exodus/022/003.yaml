  text: אִֽם הִמָּצֵא֩ תִמָּצֵ֨א בְ/יָד֜/וֹ הַ/גְּנֵבָ֗ה מִ/שּׁ֧וֹר עַד חֲמ֛וֹר עַד שֶׂ֖ה חַיִּ֑ים שְׁנַ֖יִם יְשַׁלֵּֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/003.yaml
  text: If the stolen item is actually found alive in his possession—whether ox[a], donkey, or sheep—he shall repay double.
translation:
  language: de
  text: Wird das gestohlene Tier tatsächlich lebend in seinem Besitz gefunden – sei es ein Rind, ein Esel oder ein Schaf –, muss er das Doppelte erstatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Wenn das Diebesgut wirklich in seiner Hand gefunden wird …, lebend, soll er zweifach erstatten.“ Das Hebräische verstärkt „gefunden wird“ und verwendet „in seiner Hand“ im Sinn von „in seinem Besitz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם הִמָּצֵא תִמָּצֵא
  choice: Wird ... tatsächlich ... gefunden
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Nifal von מצא verstärkt die Aussage. „Tatsächlich“ gibt diese Betonung in natürlichem modernem Deutsch wieder; die Bedingung wird idiomatisch durch die Verberststellung ausgedrückt.
- source_word: בְיָדוֹ
  choice: in seinem Besitz
  rationale: Wörtlich „in seiner Hand“; im rechtlichen Zusammenhang bezeichnet die Wendung Besitz oder Verfügungsgewalt.
- source_word: הַגְּנֵבָה
  choice: das gestohlene Tier
  rationale: Das Substantiv bezeichnet das Diebesgut, nicht den Vorgang des Diebstahls. Da die folgende Aufzählung ausschließlich lebende Nutztiere nennt und חַיִּים hinzutritt, ist „das gestohlene Tier“ im Deutschen klar und kontextgerecht.
- source_word: מִשּׁוֹר עַד חֲמוֹר עַד שֶׂה
  choice: sei es ein Rind, ein Esel oder ein Schaf
  rationale: Die hebräische Folge nennt die erfassten Tierarten. „Sei es ... oder“ gibt die fallrechtliche Aufzählung idiomatisch wieder.
- source_word: חַיִּים
  choice: lebend
  rationale: Das Wort kennzeichnet den Zustand des aufgefundenen Diebesguts und steht im Hebräischen formal im Plural. Die deutsche prädikative Form „lebend“ passt unabhängig von Numerus und Genus.
- source_word: שְׁנַיִם יְשַׁלֵּם
  choice: muss er das Doppelte erstatten
  rationale: Die Rechtsformel verlangt Ersatz in doppelter Höhe. „Muss“ vermittelt die verbindliche Rechtsfolge natürlicher als ein futurisches „wird“, während „erstatten“ den Wiedergutmachungscharakter wahrt.
