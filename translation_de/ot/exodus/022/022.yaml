  text: אִם עַנֵּ֥ה תְעַנֶּ֖ה אֹת֑/וֹ כִּ֣י אִם צָעֹ֤ק יִצְעַק֙ אֵלַ֔/י שָׁמֹ֥עַ אֶשְׁמַ֖ע צַעֲקָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/022.yaml
  text: If you indeed afflict him[a], and if he indeed cries out to me[b], I will surely hear his cry.
translation:
  language: de
  text: Wenn du ihn wirklich bedrückst[a] und wenn er wirklich zu mir schreit[b], werde ich seinen Hilfeschrei ganz gewiss hören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen stehen hier und bei „seinen“ Pronomen im maskulinen Singular. Gemeint ist jeweils eine einzelne Witwe oder ein einzelnes vaterloses Kind aus dem vorigen Vers.
    reason: cultural_note
  - marker: b
    text: Bei „bedrückst“, „schreit“ und „hören“ wiederholt das Hebräische jeweils die Verbwurzel in einer nachdrücklichen Konstruktion. Sie verstärkt sowohl die Tat und den Hilferuf als auch Gottes sichere Antwort.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet entsprechend dem hebräischen אִם einen Bedingungssatz ein.
- source_word: עַנֵּה תְעַנֶּה
  choice: wirklich bedrückst
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aussage. „Bedrücken“ gibt ענה in diesem sozialen Zusammenhang natürlich und relativ quellennah wieder.
- source_word: אֹתוֹ
  choice: ihn
  rationale: Das Suffix ist maskulin Singular und verweist distributiv auf eine einzelne der im vorigen Vers genannten schutzbedürftigen Personen.
- source_word: כִּי אִם
  choice: und
  rationale: Im Zusammenhang führt die Wendung die weitere Bedingungsentwicklung ein. Im Deutschen genügt nach dem bereits gesetzten „Wenn“ eine koordinierende Verknüpfung, ohne einen Gegensatz einzutragen.
- source_word: צָעֹק יִצְעַק
  choice: er wirklich ... schreit
  rationale: Die emphatische Verbverbindung wird durch „wirklich“ wiedergegeben.
- source_word: אֵלַי
  choice: zu mir
  rationale: Entspricht unmittelbar der Zielangabe des Rufens.
- source_word: שָׁמֹעַ אֶשְׁמַע
  choice: werde ... ganz gewiss hören
  rationale: „Ganz gewiss“ bewahrt die durch Infinitivus absolutus plus finites Verb ausgedrückte nachdrückliche Gewissheit.
- source_word: צַעֲקָתוֹ
  choice: seinen Hilfeschrei
  rationale: „Hilfeschrei“ gibt den notvollen Ruf im Kontext idiomatisch wieder und hält die Beziehung zum Verb צעק erkennbar.
theological_decisions:
- issue: Maskuliner Singular für die bedrückte Person
  choice: ihn / seinen
  alternative: sie / ihren oder eine geschlechtsneutrale Pluralform
  rationale: Die hebräischen Suffixe stehen im maskulinen Singular. Im Zusammenhang beziehen sie sich distributiv auf jede einzelne Witwe oder jedes einzelne vaterlose Kind aus dem vorigen Vers; die Fußnote verhindert eine unbeabsichtigt männlich-exklusive Deutung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Rechtstextton. Die dreifache hebräische Emphase wird idiomatisch durch „wirklich“ und „ganz gewiss“ sichtbar gemacht; die Bedingungsstruktur bleibt erhalten.
