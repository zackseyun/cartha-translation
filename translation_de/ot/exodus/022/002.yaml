  variant: modern standard German
source:
  edition: WLC
  text: אִם זָרְחָ֥ה הַ/שֶּׁ֛מֶשׁ עָלָ֖י/ו דָּמִ֣ים ל֑/וֹ שַׁלֵּ֣ם יְשַׁלֵּ֔ם אִם אֵ֣ין ל֔/וֹ וְ/נִמְכַּ֖ר בִּ/גְנֵבָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/002.yaml
  text: But if the sun has risen on him[a], there is bloodguilt for him. He must surely make restitution. If he has nothing[c][b], then he shall be sold for his theft.
translation:
  language: de
  text: Wenn aber die Sonne über ihm aufgegangen ist[a], lädt derjenige, der ihn erschlägt, Blutschuld auf sich.[b] Der Dieb muss vollen Ersatz leisten. Hat er nichts, soll er wegen seines Diebstahls verkauft werden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wenn die Sonne über ihm aufgegangen ist.“ Gemeint sein kann auch: „wenn es nach Sonnenaufgang geschieht“ oder „wenn es bei Tageslicht geschieht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische lautet knapp: „Blutschuld ist ihm/für ihn“. Im Zusammenhang ist damit wahrscheinlich die Blutschuld dessen gemeint, der den Dieb erschlägt.'
    reason: alternative_reading
  - marker: c
    text: Der Verkauf dient hier als rechtliche Tilgung der Ersatzschuld, wenn der Dieb keine Mittel zur Wiedergutmachung besitzt.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Wenn aber
  rationale: Die Konjunktion leitet den kontrastierenden Fall gegenüber dem vorausgehenden nächtlichen Einbruch ein; „aber“ macht diesen Zusammenhang im Deutschen deutlich.
- source_word: זָרְחָה הַשֶּׁמֶשׁ עָלָיו
  choice: die Sonne über ihm aufgegangen ist
  rationale: Bewahrt das konkrete hebräische Bild und gibt עָלָיו im Deutschen natürlich mit „über ihm“ wieder.
- source_word: דָּמִים לוֹ
  choice: lädt derjenige, der ihn erschlägt, Blutschuld auf sich
  rationale: דָּמִים bezeichnet im rechtlichen Zusammenhang Blutschuld. Das pronominale לוֹ ist im Zusammenhang mehrdeutig; die Formulierung macht den wahrscheinlich gemeinten Täterbezug verständlich, ohne die zugrunde liegende Spannung in der Fußnote zu verschweigen.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: muss vollen Ersatz leisten
  rationale: Infinitivus absolutus und Imperfekt verstärken die Verpflichtung. „Ersatz leisten“ entspricht dem rechtlichen Zusammenhang einer Wiedergutmachung.
- source_word: אִם אֵין לוֹ
  choice: Hat er nichts
  rationale: Knappes, idiomatisches Deutsch für das Fehlen der Mittel zur Ersatzleistung.
- source_word: וְנִמְכַּר
  choice: soll er ... verkauft werden
  rationale: Gibt die passive Rechtsfolge wieder, ohne über die Art oder Dauer des Dienstverhältnisses mehr auszusagen als der Text.
- source_word: בִּגְנֵבָתוֹ
  choice: wegen seines Diebstahls
  rationale: Bewahrt den Rechtsgrund der Veräußerung; die hebräische Form kann sich auf den Diebstahl beziehungsweise das Gestohlene beziehen.
theological_decisions:
- issue: Rechtliche Folge der Tötung eines Diebes nach Sonnenaufgang
  choice: Die Tötung unter dieser Bedingung begründet Blutschuld für den Tötenden.
  alternative: Die Tageszeit könnte als Hinweis auf eine klar erkennbare und daher anders einzuschätzende Gefahr verstanden werden, nicht ausschließlich als starre Zeitgrenze.
  rationale: Der Haupttext erhält das konkrete Bild des Sonnenaufgangs und benennt die Blutschuld, ohne daraus ein weitergehendes ethisches Prinzip abzuleiten.
- issue: Bezugswort von לוֹ in דָּמִים לוֹ
  choice: Bezug auf denjenigen, der den Dieb erschlägt
  alternative: Formal könnte das Pronomen als „für ihn“ wiedergegeben werden und dadurch den Bezug weniger ausdrücklich festlegen.
  rationale: Der Gegensatz zum vorausgehenden Vers und die übliche rechtliche Auffassung sprechen für die Blutschuld des Tötenden; eine Fußnote dokumentiert die knappe hebräische Ausdrucksweise.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das konkrete Sonnenbild bleibt erhalten; die juristischen Begriffe „Blutschuld“ und „Ersatz leisten“ sichern Präzision. Die Pronomen werden zur Verständlichkeit teilweise expliziert, während Fußnoten die sprachliche Kürze und Mehrdeutigkeit des Hebräischen dokumentieren.
