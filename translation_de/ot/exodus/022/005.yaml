base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/005.yaml
  text: If a fire breaks out and catches in thorns[a], so that stacked grain or standing grain or the field is consumed[b], the one who started the fire must surely make restitution.
translation:
  language: de
  text: Wenn ein Feuer ausbricht und auf Dornengestrüpp übergreift[a], sodass aufgehäuftes Getreide, noch stehendes Getreide oder das Feld verbrennen, muss derjenige, der das Feuer entfacht hat, unbedingt Ersatz leisten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und Dornen findet«; auch möglich: »und Dornen erfasst«.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische verstärkt die Verpflichtung durch die Verbindung eines Infinitivs mit der finiten Verbform; sinngemäß: »Er muss unbedingt Ersatz leisten.«'
    reason: source_form
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Leitet einen Fall des kasuistischen Rechts ein; »wenn« ist dafür im Deutschen natürlich und wahrt den Bedingungscharakter.
- source_word: תֵצֵא אֵשׁ
  choice: ein Feuer ausbricht
  rationale: Die Wendung bezeichnet das Ausgehen beziehungsweise Sich-Ausbreiten eines Feuers, nicht dessen Erlöschen; »ausbricht« gibt den gemeinten Vorgang idiomatisch wieder.
- source_word: וּמָצְאָה קֹצִים
  choice: und auf Dornengestrüpp übergreift
  rationale: Wörtlich »und Dornen findet«; im Zusammenhang ist gemeint, dass das Feuer die trockenen Dornen erreicht und sich durch sie weiterverbreitet. Die wörtliche Bildsprache wird in der Fußnote bewahrt.
- source_word: קֹצִים
  choice: Dornengestrüpp
  rationale: Gibt die Dornen als brennbare Vegetation verständlich wieder, ohne sie allgemein zu »Buschwerk« zu verflachen.
- source_word: וְנֶאֱכַל
  choice: verbrennt
  rationale: Das Nifal von אכל bezeichnet hier das Verzehrtwerden durch Feuer. »Verbrennt« ist im Deutschen klarer und natürlicher als das formal mögliche »verzehrt wird«.
- source_word: גָּדִישׁ
  choice: aufgehäuftes Getreide
  rationale: Bezeichnet bereits geerntetes und zu einem Haufen oder Stapel zusammengebrachtes Getreide; die Formulierung bewahrt den Gegensatz zum noch stehenden Getreide.
- source_word: הַקָּמָה
  choice: noch stehendes Getreide
  rationale: Bezeichnet die noch nicht geerntete, auf dem Feld stehende Getreidefrucht.
- source_word: הַשָּׂדֶה
  choice: das Feld
  rationale: Direkte und im Zusammenhang verständliche Wiedergabe, ohne den möglichen Umfang des Feldschadens enger festzulegen.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: muss … auf jeden Fall Ersatz leisten
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die verbindliche Ersatzpflicht; »auf jeden Fall« bringt diese Hervorhebung in natürlichem Deutsch zum Ausdruck.
- source_word: הַמַּבְעִר אֶת הַבְּעֵרָה
  choice: derjenige, der das Feuer entfacht hat
  rationale: Bezeichnet die für das Entfachen verantwortliche Person. Die Formulierung ist klar, rechtlich passend und vermeidet das unnatürliche »der Brennende«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Die landwirtschaftlichen Gegensätze zwischen bereits aufgehäuftem und noch stehendem Getreide bleiben erhalten; die hebräische Verstärkung der Ersatzpflicht wird idiomatisch ausgedrückt und zusätzlich erläutert.
