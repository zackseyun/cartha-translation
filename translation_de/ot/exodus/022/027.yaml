id: EXO.22.27
reference: Exodus 22:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֱלֹהִ֖ים לֹ֣א תְקַלֵּ֑ל וְ/נָשִׂ֥יא בְ/עַמְּ/ךָ֖ לֹ֥א תָאֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/027.yaml
  text: You shall not revile God[a], nor curse a ruler among your people.
translation:
  language: de
  text: Gott[a] sollst du nicht schmähen, und einem Fürsten in deinem Volk sollst du nicht fluchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Richter«. אֱלֹהִים kann in manchen Zusammenhängen menschliche Amtsträger bezeichnen; hier passt »Gott« am besten zum Parallelismus.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים kann je nach Zusammenhang auch »Götter« oder menschliche Amtsträger beziehungsweise Richter bezeichnen. Hier passt der Singular »Gott« am besten zur rechtlichen Mahnung und zum Parallelismus mit dem menschlichen Fürsten; die bedeutsame Alternative »Richter« bleibt in der Fußnote erhalten.
- source_word: תְקַלֵּל
  choice: schmähen
  rationale: Das Piel von קלל kann »verfluchen«, »verächtlich behandeln« oder »schmähen« bedeuten. »Schmähen« bezeichnet ehrverletzende Rede und wahrt zugleich den Unterschied zum ausdrücklichen »fluchen« im zweiten Satzglied.
- source_word: נָשִׂיא
  choice: Fürst
  rationale: נָשִׂיא bezeichnet einen herausgehobenen Anführer oder Obersten. »Fürst« ist im biblisch-rechtlichen Zusammenhang würdig und prägnant, ohne eine bestimmte moderne Amtsform vorauszusetzen.
- source_word: בְעַמְּךָ
  choice: in deinem Volk
  rationale: Die Präposition ב bezeichnet hier die Zugehörigkeit beziehungsweise Stellung innerhalb des Volkes. »In deinem Volk« gibt diesen Sinn natürlich und knapp wieder.
- source_word: תָאֹר
  choice: fluchen
  rationale: Das Verb ארר ist der übliche Ausdruck für das Aussprechen eines Fluches. »Fluchen« ist hier die klare und direkte deutsche Entsprechung.
theological_decisions:
- issue: Bezug von אֱלֹהִים
  choice: Gott
  alternative: 'Richter; auch: Götter'
  rationale: Der Parallelismus stellt die Schmähung Gottes dem Verfluchen eines menschlichen Würdenträgers gegenüber. Daher steht »Gott« im Haupttext. Da אֱלֹהִים in bestimmten rechtlichen Zusammenhängen auch menschliche Richter oder Amtsträger bezeichnen kann, wird diese echte Auslegungsmöglichkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der im Rechtssatz natürlichen Soll-Konstruktion. »Schmähen« und »fluchen« bewahren die Unterscheidung der beiden hebräischen Verben; »Fürst« gibt die allgemein bezeichnete herausgehobene Führungsperson wieder.
