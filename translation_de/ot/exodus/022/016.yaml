  text: If her father absolutely refuses to give her to him[b][a], he shall weigh out silver equal to the bride-price for virgins.
translation:
  language: de
  text: Wenn ihr Vater sich entschieden weigert, sie ihm zu geben[a], soll er Silber in Höhe des Brautpreises für Jungfrauen abwiegen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie ihm zur Frau zu geben“. Die hebräische Wendung „sie ihm zu geben“ bezeichnet hier die Zustimmung des Vaters zur Eheschließung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Silber abwiegen“. Die Formulierung beschreibt eine Zahlung mit Silber, das nach Gewicht bemessen wurde.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die übliche deutsche Entsprechung der Bedingungspartikel in einem Rechtssatz.
- source_word: מָאֵן יְמָאֵן
  choice: sich entschieden weigert
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Weigerung; „entschieden“ gibt diese Betonung in natürlichem Deutsch wieder.
- source_word: אָבִיהָ
  choice: ihr Vater
  rationale: Die Verbindung mit dem Suffix der 3. Person Singular feminin wird direkt wiedergegeben.
- source_word: לְתִתָּהּ לוֹ
  choice: sie ihm zu geben
  rationale: Dies bewahrt die knappe hebräische Formulierung; im rechtlichen Zusammenhang ist die Zustimmung zur Eheschließung gemeint.
- source_word: כֶּסֶף
  choice: Silber
  rationale: Die konkrete Bezeichnung des Zahlungsmittels bleibt erhalten, statt sie allgemein mit „Geld“ wiederzugeben.
- source_word: יִשְׁקֹל
  choice: abwiegen
  rationale: Das Verb bezeichnet wörtlich das Wiegen und spiegelt die Zahlung mit abgewogenem Silber vor der allgemeinen Verwendung geprägter Münzen wider.
- source_word: כְּמֹהַר
  choice: in Höhe des Brautpreises
  rationale: מֹהַר bezeichnet die im Zusammenhang einer Eheschließung an die Familie der Braut geleistete Zahlung; „in Höhe“ bringt den Vergleichswert idiomatisch zum Ausdruck.
- source_word: הַבְּתוּלֹת
  choice: für Jungfrauen
  rationale: Der bestimmte Plural verweist allgemein auf den üblichen Brautpreis für diese Gruppe.
