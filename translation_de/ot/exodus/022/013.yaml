base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/013.yaml
  text: And if a man borrows from his neighbor[a], and it is injured or dies, if its owner is not with it[b], he shall surely make restitution.
translation:
  language: de
  text: Wenn jemand von seinem Nächsten etwas leiht und es zu Schaden kommt[a] oder stirbt, wenn sein Besitzer nicht dabei ist, muss er vollen Ersatz leisten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zerbrochen wird“. Das hebräische Wort kann hier sowohl die Beschädigung einer geliehenen Sache als auch die Verletzung eines geliehenen Tieres bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „erstatten wird er erstatten“ beziehungsweise „zahlen wird er zahlen“; die hebräische Ausdrucksweise unterstreicht die uneingeschränkte Ersatzpflicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Wenn
  rationale: Leitet innerhalb der Rechtssammlung einen weiteren Bedingungsfall ein; das deutsche „Wenn“ gibt die Verbindung in natürlicher Rechtssprache wieder.
- source_word: יִשְׁאַל
  choice: etwas leiht
  rationale: Das Verb bezeichnet hier das Ausleihen beziehungsweise Entleihen einer Sache oder eines Tieres, nicht bloß eine Bitte oder Frage.
- source_word: אִישׁ
  choice: jemand
  rationale: Das maskuline Singularwort dient in diesem Rechtssatz als allgemeine Fallperson. „Jemand“ ist im modernen Deutschen natürlich und verändert den sachlichen Geltungsbereich nicht.
- source_word: מֵעִם רֵעֵהוּ
  choice: von seinem Nächsten
  rationale: רֵעַ bezeichnet hier den Mitmenschen beziehungsweise ein anderes Mitglied der Gemeinschaft; „Nächster“ wahrt den rechtlichen und zwischenmenschlichen Sinn.
- source_word: וְנִשְׁבַּר
  choice: es zu Schaden kommt
  rationale: Wörtlich bedeutet das passive Verb „zerbrochen wird“, kann hier aber sowohl die Beschädigung einer Sache als auch die Verletzung eines geliehenen Tieres bezeichnen. Die Formulierung deckt beide Möglichkeiten ab.
- source_word: אוֹ מֵת
  choice: oder stirbt
  rationale: Die verbale Wiedergabe ist knapp und entspricht dem Hebräischen; sie zeigt zugleich, dass im Blickfeld besonders auch ein geliehenes Tier stehen kann.
- source_word: בְּעָלָיו
  choice: sein Besitzer
  rationale: Die formal pluralische Substantivform bezeichnet idiomatisch den einzelnen Besitzer des Geliehenen.
- source_word: אֵין עִמּוֹ
  choice: während sein Besitzer nicht dabei ist
  rationale: „Nicht dabei“ gibt die Abwesenheit des Besitzers natürlich wieder, ohne den Bezug des maskulinen Pronomens unnötig auf das geliehene Objekt festzulegen.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: muss er vollen Ersatz leisten
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die verbindliche Zahlungspflicht. „Vollen Ersatz leisten“ bringt sowohl die Intensivierung als auch den rechtlichen Sinn zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Moderne, würdige und gut verständliche Rechtssprache. Der ungenannte Gegenstand des Leihens bleibt durch „etwas“ offen; „zu Schaden kommt“ bewahrt die mögliche Bezugnahme auf eine Sache oder ein Tier. „Nicht dabei“ vermeidet eine überpräzise Auflösung des hebräischen Pronominalbezugs.
