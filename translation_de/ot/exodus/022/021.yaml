lexical_decisions:
- source_word: כָּל
  choice: keine … und kein
  rationale: Mit den singularischen Personenbezeichnungen und der Verneinung hat כָּל umfassend-distributive Bedeutung. Die deutsche Konstruktion „keine … und kein“ gibt dies natürlich und eindeutig wieder.
- source_word: אַלְמָנָה
  choice: Witwe
  rationale: Dies ist die direkte und übliche deutsche Entsprechung.
- source_word: יָתוֹם
  choice: vaterloses Kind
  rationale: In althebräischen Rechts- und Sozialkontexten bezeichnet das Wort häufig ein Kind ohne Vater und damit ohne dessen Schutz und Versorgung. Diese Wiedergabe bewahrt die historische Nuance; „Waise“ bleibt als geläufige Alternative in der Fußnote erhalten.
- source_word: לֹא
  choice: keine … und kein … dürft ihr
  rationale: Die verneinte Verbform drückt hier ein Verbot aus; im Deutschen wird dies idiomatisch durch „dürft ihr“ zusammen mit den negierten Objekten wiedergegeben.
- source_word: תְעַנּוּן
  choice: bedrängen
  rationale: Die Piel-Form von ענה bezeichnet hier, jemandem Leid zuzufügen oder ihn hart zu behandeln. „Bedrängen“ bewahrt die Breite und Ernsthaftigkeit des Ausdrucks, ohne ihn allein auf wirtschaftliche Unterdrückung einzuengen.
