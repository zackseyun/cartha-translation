  source_fidelity: Die Wiedergabe von אַלְמָנָה als „Witwe“ und יָתוֹם als „vaterloses Kind“ ist sachgerecht; letztere bewahrt die im altisraelitischen Rechtskontext häufig mitklingende Bedeutung eines Kindes ohne Vater. „bedrängen“ kann die breite Bedeutung der Piel-Form תְעַנּוּן („Leid zufügen, hart behandeln“) wiedergeben, wenn auch es etwas weniger umfassend als „misshandeln“ wirken kann. Die Verbform ist ein apodiktisches Verbot und sollte im Deutschen mit „sollt ... nicht“ wiedergegeben werden, nicht mit dem potenziell weniger verbindlichen „dürft ... nicht“.
  naturalness: „Ihr sollt keine Witwe und kein vaterloses Kind bedrängen“ ist modernes, klares Standarddeutsch und gibt die hebräische Anrede im Plural natürlich wieder.
  terminology: „Witwe“ und „vaterloses Kind“ sind angemessen. Die alternative Wiedergabe „Waise“ sollte als bloße lexikalische Alternative markiert werden; die bisherige Fußnote wiederholt unnötig die gesamte Satzstruktur.
