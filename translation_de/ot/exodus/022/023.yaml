  yaml_path: translation/ot/exodus/022/023.yaml
  text: then my anger will burn[a], and I will kill you with the sword[b], and your wives will become widows and your sons fatherless.
translation:
  language: de
  text: Dann wird mein Zorn entbrennen, und ich werde euch mit dem Schwert[a] töten. Eure Frauen werden zu Witwen und eure Söhne vaterlos[b] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: durch das Schwert.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Waisen. Das hebräische Wort bezeichnet hier besonders Kinder, die ihren Vater verloren haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: mein Zorn wird entbrennen
  rationale: Die Verbindung von חרה mit אַף ist eine feste Wendung für aufflammenden Zorn. „Mein Zorn wird entbrennen“ bewahrt das Bild und klingt zugleich natürlich und würdig.
- source_word: וְהָרַגְתִּי אֶתְכֶם
  choice: ich werde euch töten
  rationale: הרג ist das gewöhnliche Verb für „töten“. Die direkte Wiedergabe erhält die Härte der angekündigten Strafe, ohne altertümlich zu wirken.
- source_word: בֶּחָרֶב
  choice: mit dem Schwert
  rationale: Die Präposition ב bezeichnet hier Mittel oder Werkzeug. „Mit dem Schwert“ gibt das konkrete Bild unmittelbar wieder.
- source_word: וְהָיוּ נְשֵׁיכֶם אַלְמָנוֹת
  choice: eure Frauen werden zu Witwen
  rationale: נָשִׁים bezeichnet im possessiven Familienzusammenhang die Ehefrauen. היה beschreibt hier den als Folge eintretenden Zustand; „zu Witwen werden“ macht diesen Zusammenhang deutlich.
- source_word: וּבְנֵיכֶם
  choice: eure Söhne
  rationale: בנים ist hier die ausdrücklich männliche Bezeichnung „Söhne“. Sie wird nicht zu „Kinder“ verallgemeinert.
- source_word: יְתֹמִים
  choice: vaterlos
  rationale: יָתוֹם bezeichnet besonders im rechtlich-sozialen Kontext häufig ein Kind ohne Vater. „Vaterlos“ entspricht genau der durch den Tod der Männer entstehenden Lage; „Waisen“ bleibt als mögliche allgemeinere Wiedergabe in der Fußnote erhalten.
theological_decisions:
- issue: Bildhafte Rede vom göttlichen Zorn
  choice: mein Zorn wird entbrennen
  alternative: meine Nase wird heiß werden; mein Grimm wird entflammen
  rationale: Die hebräische Körpermetapher wird nicht wörtlich mit „Nase“ wiedergegeben, da dies im Deutschen den Sinn verdunkeln würde. Das Bild des entbrennenden Zorns und die Aussage über Gottes Gericht bleiben erhalten.
- issue: Geschlechtsspezifische Bezeichnung der Nachkommen
  choice: eure Söhne
  alternative: eure Kinder
  rationale: Der Ausgangstext verwendet die männliche Bezeichnung בנים. Da der Zusammenhang keine Verallgemeinerung verlangt, bleibt sie erhalten.
- issue: Bedeutungsumfang von יָתוֹם
  choice: vaterlos
  alternative: Waisen
  rationale: Im unmittelbaren Zusammenhang sterben die Ehemänner und Väter; „vaterlos“ bildet diese konkrete Folge präzise ab. Die allgemeinere traditionelle Wiedergabe „Waisen“ wird als echte lexikalische Möglichkeit ausgewiesen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Die Gewaltandrohung wird weder abgeschwächt noch durch altertümliche Wörter wie „erschlagen“ oder „Grimm“ unnötig stilisiert. Die zwei Ergebnissätze werden zur besseren deutschen Lesbarkeit getrennt; ihr enger Folgezusammenhang bleibt erhalten.
