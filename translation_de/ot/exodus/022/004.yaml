source:
  edition: WLC
  text: כִּ֤י יַבְעֶר אִישׁ֙ שָׂדֶ֣ה אוֹ כֶ֔רֶם וְ/שִׁלַּח֙ אֶת בעיר/ה וּ/בִעֵ֖ר בִּ/שְׂדֵ֣ה אַחֵ֑ר מֵיטַ֥ב שָׂדֵ֛/הוּ וּ/מֵיטַ֥ב כַּרְמ֖/וֹ יְשַׁלֵּֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/004.yaml
  text: If a man causes a field or vineyard to be grazed over[a], and lets his animal loose so that it grazes in another man's field[b], he shall make restitution from the best of his own field and the best of his own vineyard.
translation:
  language: de
  text: Wenn jemand ein Feld oder einen Weinberg abweiden lässt[a] und sein Vieh frei laufen lässt, sodass es auf dem Feld eines anderen weidet[b], soll er als Ersatz das Beste seines eigenen Feldes und das Beste seines eigenen Weinbergs geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn jemand ein Feld oder einen Weinberg abbrennt.“ Das hebräische Verb בער kann in anderen Zusammenhängen „brennen“ oder „verbrennen“ bedeuten. Hier spricht die unmittelbar folgende Erwähnung des freigelassenen Viehs jedoch deutlich für das Abweiden beziehungsweise Abfressen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auf einem anderen Feld“. Dass es sich um das Feld eines anderen Besitzers handelt, ergibt sich aus dem rechtlichen Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: In dieser kasuistischen Rechtsbestimmung leitet כִּי den angenommenen Fall ein. „Wenn“ ist dafür im Deutschen die natürliche Form.
- source_word: יַבְעֶר
  choice: abweiden lässt
  rationale: Die Hifil-Form von בער ist hier kausativ. Der folgende Hinweis auf das Freilassen des Viehs spricht dafür, dass das Verzehren durch Weidetiere gemeint ist, nicht ein Brand.
- source_word: שָׂדֶה אוֹ כֶרֶם
  choice: ein Feld oder einen Weinberg
  rationale: Die landwirtschaftlichen Begriffe und der Singular der hebräischen Fallformulierung werden direkt wiedergegeben.
- source_word: וְשִׁלַּח אֶת־בְּעִירֹה
  choice: und sein Vieh frei laufen lässt
  rationale: שִׁלַּח bezeichnet das Los- oder Freilassen; בְּעִיר meint hier ein gehaltenes Weidetier beziehungsweise Vieh. Die Formulierung ist natürlich und macht das schadensstiftende Freilaufen deutlich.
- source_word: וּבִעֵר בִּשְׂדֵה אַחֵר
  choice: sodass es auf dem Feld eines anderen weidet
  rationale: Das erneut gebrauchte בער beschreibt im Zusammenhang das Fressen beziehungsweise Weiden des Tieres. „Sodass“ verdeutlicht den Folgezusammenhang, ohne die rechtliche Aussage zu verändern.
- source_word: אַחֵר
  choice: eines anderen
  rationale: Das Hebräische sagt wörtlich „ein anderes Feld“. Im rechtlichen Zusammenhang ist das Feld im Besitz eines anderen gemeint; die deutsche Genitivform gibt dies knapp und natürlich wieder.
- source_word: מֵיטַב שָׂדֵהוּ וּמֵיטַב כַּרְמוֹ
  choice: das Beste seines eigenen Feldes und das Beste seines eigenen Weinbergs
  rationale: מֵיטַב bezeichnet den besten oder wertvollsten Teil. „Eigenen“ verdeutlicht, dass die Ersatzleistung aus dem Besitz des Schädigers stammt.
- source_word: יְשַׁלֵּם
  choice: soll er als Ersatz ... geben
  rationale: Die Piel-Form von שׁלם bezeichnet in diesem Rechtszusammenhang eine Ausgleichs- oder Ersatzleistung. Die deutsche Wendung wahrt den verpflichtenden Charakter und benennt die konkret zu leistenden Erzeugnisse.
theological_decisions: []
translation_notes:
  register: Moderne, verständliche und zugleich würdevolle Rechtssprache. „Jemand“ gibt den generischen Sinn von אִישׁ im heutigen Deutsch natürlich wieder. Die Wiederholung von „das Beste“ bewahrt den Nachdruck und die Parallelstruktur des Hebräischen.
