  text: וְ/כִֽי יְפַתֶּ֣ה אִ֗ישׁ בְּתוּלָ֛ה אֲשֶׁ֥ר לֹא אֹרָ֖שָׂה וְ/שָׁכַ֣ב עִמָּ֑/הּ מָהֹ֛ר יִמְהָרֶ֥/נָּה לּ֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/015.yaml
  text: If a man seduces a virgin who is not betrothed[a], and lies with her[b], he must surely pay the bride-price for her to be his wife.
translation:
  language: de
  text: Wenn ein Mann eine Jungfrau verführt, die nicht verlobt ist, und mit ihr schläft, muss er unbedingt den Brautpreis[a] für sie zahlen, damit sie seine Frau wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Brautpreis (hebräisch mohar) war eine mit der Eheschließung verbundene Zahlung des Mannes beziehungsweise seiner Familie; er ist nicht mit einer Mitgift gleichzusetzen, die von der Braut oder ihrer Familie eingebracht wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַתֶּה
  choice: verführt
  rationale: Das Piel von פתה bezeichnet hier ein Überreden oder Verlocken im sexuellen Zusammenhang. „Verführt“ gibt dies wieder, ohne gegen den Wortlaut Gewalt vorauszusetzen.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das hebräische Substantiv ist maskulin und bezeichnet hier einen Mann.
- source_word: בְּתוּלָה
  choice: eine Jungfrau
  rationale: בְּתוּלָה bezeichnet in diesem rechtlichen und sozialen Zusammenhang eine unverheiratete Frau, deren Jungfräulichkeit für den Fall ausdrücklich relevant ist.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: die noch nicht verlobt ist
  rationale: Die Form bezeichnet eine Frau, die nicht förmlich zur Ehe versprochen ist. „Verlobt“ ist im modernen Deutsch verständlich; „noch“ ist idiomatisch, ohne den rechtlichen Status zu verändern.
- source_word: וְשָׁכַב עִמָּהּ
  choice: und mit ihr schläft
  rationale: שכב mit עִם ist eine übliche Umschreibung für Geschlechtsverkehr. „Mit ihr schläft“ ist natürlich, würdig und wahrt die bildhafte Ausdrucksweise.
- source_word: מָהֹר יִמְהָרֶנָּה
  choice: muss er für sie den Brautpreis zahlen
  rationale: Infinitivus absolutus und Imperfekt verstärken die Verpflichtung. מהר bezeichnet die Zahlung des mohar; „Brautpreis“ ist genauer als „Mitgift“, da die Zahlung vom Mann beziehungsweise seiner Familie ausgeht.
- source_word: לּוֹ לְאִשָּׁה
  choice: und sie zur Frau nehmen
  rationale: Die Wendung bezeichnet das angestrebte rechtliche Eheverhältnis. Die deutsche Formulierung gibt den Zusammenhang zwischen Brautpreis und Eheschließung natürlich wieder.
theological_decisions:
- issue: Art des durch פתה bezeichneten sexuellen Geschehens
  choice: Verführung, ohne ausdrücklich behaupteten Zwang
  alternative: Vergewaltigung oder gewaltsame Verletzung
  rationale: פתה bezeichnet hier Überredung oder Verlockung. Die Übersetzung setzt weder Gewalt noch eine moderne Vorstellung uneingeschränkter Zustimmung voraus, sondern wahrt die Abgrenzung zu ausdrücklich gewaltsamen Fällen.
- issue: Verhältnis von Zahlung und Eheschließung
  choice: Brautpreis zahlen und sie zur Frau nehmen
  alternative: lediglich den Brautpreis als Entschädigung zahlen
  rationale: מָהֹר יִמְהָרֶנָּה לּוֹ לְאִשָּׁה verbindet die Zahlung mit dem Ziel, dass sie seine Frau wird. Die anschließende Bestimmung im folgenden Vers kann diese Eheschließung jedoch verhindern.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit rechtlich-würdigem Ton. Die sexuelle Handlung wird entsprechend dem hebräischen Idiom zurückhaltend formuliert. „Brautpreis“ bleibt als sachlich präziser kulturgeschichtlicher Begriff erhalten.
