  text: You shall not let a sorceress live[a].
translation:
  language: de
  text: Eine Zauberin sollst du nicht am Leben lassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hexe«. Das hebräische Substantiv steht im Femininum Singular und bezeichnet ausdrücklich eine Frau, die Zauberei ausübt.'
    reason: lexikalische Alternative und Erläuterung der Geschlechtsmarkierung
lexical_decisions:
- source_word: מְכַשֵּׁפָה
  choice: eine Zauberin
  rationale: Das hebräische Substantiv steht ausdrücklich im Femininum Singular und bezeichnet eine Frau, die Zauberei ausübt. »Zauberin« bewahrt diese Geschlechtsmarkierung und ist im heutigen Deutsch verständlich, ohne die besonderen kulturgeschichtlichen Assoziationen von »Hexe« zwingend mitzuführen.
- source_word: לֹא
  choice: nicht
  rationale: Die gewöhnliche hebräische Verneinungspartikel wird zusammen mit der deutschen Verbfügung als kategorisches Verbot wiedergegeben.
- source_word: תְחַיֶּה
  choice: sollst du … am Leben lassen
  rationale: Die Piel-Form, 2. Person Maskulinum Singular, von חיה hat hier den Sinn »am Leben erhalten/am Leben lassen«. Die gewählte Formulierung gibt den rechtlichen Nachdruck natürlich und quellennah wieder; der singularische Adressat kann im Bundesrecht die Gemeinschaft ansprechen.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung der Täterin
  choice: Das feminine Singularwort wird mit »Zauberin« wiedergegeben.
  alternative: Geschlechtsneutral »wer Zauberei treibt« oder generisch »Zauberer«.
  rationale: Die hebräische Form ist ausdrücklich feminin. Diese Markierung wird bewahrt, statt sie zu verallgemeinern.
- issue: Reichweite des rechtlichen Verbots
  choice: Die Formulierung bleibt bei »nicht am Leben lassen«.
  alternative: 'Ausdeutend: »muss getötet werden« oder »sollst du töten«.'
  rationale: Der rechtliche Zusammenhang setzt eine Todesstrafe voraus, doch der hebräische Wortlaut nennt weder eine aktive Tötungsformel noch die Art der Vollstreckung. Die Übersetzung bewahrt daher die konkrete Ausdrucksweise und ihre Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung von »Eine Zauberin« erhält den Nachdruck des hebräischen Satzes; »sollst du nicht am Leben lassen« klingt rechtlich bestimmt, ohne eine im Ausgangstext nicht ausdrücklich genannte Vollstreckungsweise einzutragen.
