    rationale: בֵּין שְׁנֵיהֶם ... תִּהְיֶה sagt wörtlich, dass der Eid zwischen beiden sein soll. Der Kontext legt die Beilegung des Streitfalls nahe, aber das Verb »entscheiden« ist im Ausgangstext nicht ausgedrückt.
  - severity: medium
    issue: Fußnote b gibt die räumliche Bildsprache ungenau als »die Hand nach ... ausgestreckt« wieder.
    rationale: Die Präposition בְּ bezeichnet hier das Eingreifen in/an der Sache des anderen. Die Fußnote sollte die hebräische Form nicht mit einer anderen Bewegungsrichtung paraphrasieren.
