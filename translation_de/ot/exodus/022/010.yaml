  text: an oath of Yahweh shall be between the two of them[a], that he has not put his hand to his neighbor’s property; and its owner shall accept it[c][b], and he shall not make restitution.
translation:
  language: de
  text: Ein Eid bei Jahwe soll zwischen den beiden stattfinden[a], dass der Verwahrer sich nicht am Eigentum seines Nächsten vergriffen hat[b]. Der Eigentümer soll ihn annehmen[c], und der Verwahrer braucht keinen Ersatz zu leisten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ein Eid Jahwes soll zwischen den beiden sein.«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »dass er seine Hand nicht an das Eigentum seines Nächsten gelegt hat«; gemeint ist, dass er das anvertraute Gut nicht unrechtmäßig angeeignet, benutzt oder daran manipuliert hat.'
    reason: cultural_note
  - marker: c
    text: 'Oder: »Der Eigentümer soll ihn entgegennehmen«; gemeint ist, dass er den Eid als ausreichend annimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻעַת יְהוָה
  choice: ein Eid vor Jahwe
  rationale: Die Konstruktion bedeutet wörtlich »ein Eid Jahwes«, bezeichnet im rechtlichen Zusammenhang aber einen unter Anrufung Jahwes geleisteten Eid. »Vor Jahwe« gibt diesen Sinn im Deutschen natürlich wieder; die wörtlichere Form bleibt in der Fußnote erhalten.
- source_word: בֵּין שְׁנֵיהֶם
  choice: zwischen den beiden entscheiden
  rationale: Der hebräische Wortlaut sagt, der Eid solle »zwischen den beiden sein«. Im Rechtszusammenhang bezeichnet dies seine streitentscheidende Funktion; »zwischen den beiden entscheiden« macht sie verständlich, ohne die zwei Parteien zu verwischen.
- source_word: אִם לֹא
  choice: dass ... nicht
  rationale: In der Eidesformel leitet אִם לֹא den Inhalt der Beteuerung ein und ist hier nicht als gewöhnlicher Bedingungssatz zu verstehen.
- source_word: שָׁלַח יָדוֹ בִּמְלֶאכֶת רֵעֵהוּ
  choice: sich am Eigentum seines Mitmenschen vergriffen hat
  rationale: Die Wendung bedeutet wörtlich, die Hand nach dem Besitz eines anderen auszustrecken, und bezeichnet hier unrechtmäßige Aneignung, Verwendung oder Manipulation. Die deutsche idiomatische Wiedergabe bewahrt den rechtlichen Sinn.
- source_word: וְלָקַח בְּעָלָיו
  choice: Der Eigentümer soll den Eid gelten lassen
  rationale: לָקַח heißt grundsätzlich »nehmen/empfangen«; das unausgesprochene Objekt ist im Zusammenhang der Eid. Gemeint ist, dass der Eigentümer ihn als hinreichende Klärung akzeptiert.
- source_word: יְשַׁלֵּם
  choice: muss keinen Ersatz leisten
  rationale: Die Piel-Form von שׁלם bezeichnet in diesem Gesetzeskontext die Leistung von Ersatz oder Entschädigung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Beziehung des Eides zu Jahwe
  choice: Eid vor Jahwe
  alternative: Eid Jahwes
  rationale: Die Formulierung bezeichnet einen unter Anrufung Jahwes geleisteten Eid, nicht zwingend einen von Jahwe selbst gesprochenen Eid. Die Fußnote bewahrt die formale Mehrdeutigkeit der hebräischen Konstruktion.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Rechtssprache. Die Rollenbezeichnung »Verwahrer« wird aus dem unmittelbaren Gesetzeskontext ergänzt, um die im Hebräischen nur durch Pronomen bezeichneten Parteien eindeutig zu halten. Die Bildsprache und die formale Konstruktion des Hebräischen werden in Fußnoten dokumentiert.
