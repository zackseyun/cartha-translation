revisions:
- from: Ein Eid vor Jahwe soll zwischen den beiden entscheiden[a], dass der Verwahrer sich nicht am Eigentum seines Mitmenschen vergriffen hat[b]. Der Eigentümer soll den Eid gelten lassen[c], und der Verwahrer muss keinen Ersatz leisten.
  to: Ein Eid bei Jahwe soll zwischen den beiden stattfinden[a], dass der Verwahrer sich nicht am Eigentum seines Nächsten vergriffen hat[b]. Der Eigentümer soll ihn annehmen[c], und der Verwahrer braucht keinen Ersatz zu leisten.
  rationale: Die Revision nimmt die nicht ausdrücklich formulierte Entscheidungsfunktion zurück, stellt die Schwurformel näher am hebräischen Konstrukt dar und berichtigt die wörtliche Fußnote zur Hand-Metapher. Die durch den Kontext bestimmten Rollen bleiben zur klaren deutschen Bezugnahme erhalten; die rechtliche Folge wird eindeutig dem Verwahrer zugeordnet.
