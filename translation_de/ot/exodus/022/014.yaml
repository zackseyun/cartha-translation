  language: en
  yaml_path: translation/ot/exodus/022/014.yaml
  text: If its owner is with it[a], he shall not make restitution; if it is a hired thing, it came for its hire.
translation:
  language: de
  text: Ist sein Besitzer dabei, muss er keinen Ersatz leisten. Ist es gemietet, so ist das Risiko im Mietpreis enthalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ist er ein Lohnarbeiter, so kam es für seinen Lohn.“ Der hebräische Wortlaut ist knapp und kann entweder auf das gemietete Tier beziehungsweise Gut oder auf einen angestellten Arbeiter bezogen werden. Im Zusammenhang mit der Haftung für geliehenes Eigentum bezieht der Haupttext die Aussage auf das gemietete Gut.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעָלָיו
  choice: sein Besitzer
  rationale: בעל bezeichnet hier den Eigentümer bzw. Besitzer des zuvor genannten Tieres. „Besitzer“ ist im Deutschen in diesem konkreten Rechtsfall natürlich und bewahrt den Rückbezug durch das Possessivpronomen.
- source_word: עִמּוֹ
  choice: dabei
  rationale: Das knappe „dabei“ gibt die Anwesenheit des Besitzers wieder, ohne das im Deutschen missverständliche „bei ihm/ihm gegenüber“ zu erzwingen.
- source_word: לֹא יְשַׁלֵּם
  choice: muss er keinen Ersatz leisten
  rationale: Das Piel von שלם bezeichnet in Rechtstexten das Leisten von Ersatz oder Entschädigung. Die modale Formulierung gibt die rechtliche Verpflichtung natürlich wieder.
- source_word: שָׂכִיר
  choice: gemietet
  rationale: Obwohl שָׂכִיר meist eine angestellte Person bezeichnen kann, legt der unmittelbare Zusammenhang mit geliehenem oder gemietetem Eigentum hier eine elliptische Bezeichnung des gemieteten Tieres nahe. Die alternative personale Deutung wird in der Fußnote erhalten.
- source_word: בָּא בִּשְׂכָרוֹ
  choice: so ist das Risiko im Mietpreis enthalten
  rationale: 'Die hebräische Wendung ist äußerst knapp: wörtlich etwa „es kam für/in seinem Mietpreis“. Im Rechtszusammenhang besagt sie wahrscheinlich, dass der Mietpreis das mit der Vermietung verbundene Verlustrisiko abdeckt. Die Wiedergabe macht diesen Sinn in natürlichem Deutsch verständlich, ohne eine zusätzliche Ersatzpflicht einzuführen.'
theological_decisions:
- issue: Bezug von שָׂכִיר und seinem Suffix
  choice: Die Hauptübersetzung bezieht die Wendung auf das gemietete Tier bzw. Gut.
  alternative: „Ist er ein Tagelöhner, so kam es für seinen Lohn.“
  rationale: Der Abschnitt regelt die Haftung für fremdes Eigentum; deshalb ist die sachbezogene Deutung im Kontext wahrscheinlicher. Da שָׂכִיר gewöhnlich auch eine angestellte Person bezeichnet und der hebräische Satz elliptisch ist, bleibt die personale Deutung ausdrücklich in der Fußnote erhalten.
translation_notes:
  register: Moderner, würdiger Gesetzesstil mit zwei kurzen Konditionalsätzen. „Dabei“ vermeidet eine unnötig komplizierte Pronomenfolge; „das Risiko ist im Mietpreis enthalten“ erschließt die knappe Rechtsformel für heutige Leser.
