  terminology: „Nächsten“, „Geld“, „Gegenstände“, „zur Aufbewahrung“, „gestohlen“ und „das Doppelte erstatten“ sind treffende und im Kontext natürliche Wiedergaben. Die Fußnoten erläutern „Silber“, die Breite von כֵלִים und die doppelte Erstattung angemessen, ohne den Text zu überinterpretieren.
