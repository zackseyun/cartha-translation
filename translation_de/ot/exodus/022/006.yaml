  source_fidelity: 'Der Entwurf gibt die Fallstruktur des Hebräischen zutreffend wieder: Übergabe von Geld oder Gegenständen zur Verwahrung, Diebstahl aus dem Haus des Verwahrers, Auffinden des Diebes und doppelte Ersatzleistung. „Das Anvertraute“ gibt den zusammenfassenden Singular des passiven וְגֻנַּב sachgerecht wieder. „Muss ... erstatten“ ist im modernen deutschen Rechtston eine angemessene Wiedergabe von יְשַׁלֵּם שְׁנָיִם.'
