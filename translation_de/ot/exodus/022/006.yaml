  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי יִתֵּן֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ כֶּ֤סֶף אֽוֹ כֵלִים֙ לִ/שְׁמֹ֔ר וְ/גֻנַּ֖ב מִ/בֵּ֣ית הָ/אִ֑ישׁ אִם יִמָּצֵ֥א הַ/גַּנָּ֖ב יְשַׁלֵּ֥ם שְׁנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/006.yaml
  text: If a man gives his neighbor money or goods to keep[a], and it is stolen from the man's house, if the thief is found[c][b], he shall pay double.
translation:
  language: de
  text: 'Wenn jemand seinem Nächsten Geld[a] oder Gegenstände[b] zur Aufbewahrung gibt und das Anvertraute aus dessen Haus gestohlen wird, dann gilt: Wird der Dieb gefunden, muss er das Doppelte erstatten.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Silber“; hier im Sinn von Geld.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Geräte“, „Gefäße“ beziehungsweise „Sachen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Er soll zweifach erstatten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: In diesem kasuistischen Rechtssatz leitet כִּי den angenommenen Fall ein; „wenn“ gibt die Bedingung im Deutschen natürlich wieder.
- source_word: יִתֵּן אִישׁ
  choice: jemand gibt
  rationale: אִישׁ bezeichnet hier die unbestimmte Person, deren Rechtsfall beschrieben wird. „Jemand“ entspricht modernem deutschem Rechtsstil, ohne den sachlichen Umfang des maskulin formulierten hebräischen Falls zu verändern.
- source_word: אֶל רֵעֵהוּ
  choice: seinem Nächsten
  rationale: רֵעַ bezeichnet hier den Mitmenschen beziehungsweise Angehörigen der Rechtsgemeinschaft. „Nächster“ wahrt den biblischen Sprachzusammenhang und ist verständlich.
- source_word: כֶּסֶף
  choice: Geld
  rationale: Das Wort bedeutet wörtlich „Silber“, bezeichnet in diesem wirtschaftlichen Zusammenhang aber Zahlungsmittel beziehungsweise Geld.
- source_word: כֵלִים
  choice: Gegenstände
  rationale: כְּלִי ist ein weiter Begriff für Geräte, Gefäße oder sonstige bewegliche Sachen. „Gegenstände“ vermeidet eine sachlich zu enge Festlegung.
- source_word: לִשְׁמֹר
  choice: zur Aufbewahrung
  rationale: 'Der Infinitiv bezeichnet den Zweck der Übergabe: Das Eigentum soll verwahrt beziehungsweise behütet werden.'
- source_word: וְגֻנַּב
  choice: und das Anvertraute ... gestohlen wird
  rationale: Die passive Singularform bezieht sich zusammenfassend auf das übergebene Eigentum. „Das Anvertraute“ stellt diesen kollektiven Bezug im Deutschen eindeutig her.
- source_word: מִבֵּית הָאִישׁ
  choice: aus dessen Haus
  rationale: Gemeint ist im Zusammenhang das Haus des Verwahrers, also des unmittelbar zuvor genannten Nächsten. Das Pronomen gibt diesen Rückbezug natürlich wieder.
- source_word: אִם יִמָּצֵא הַגַּנָּב
  choice: Wird der Dieb gefunden
  rationale: Der Niphal von מצא bedeutet wörtlich „gefunden werden“. Die deutsche Voranstellung bewahrt die Bedingung und vermeidet die interpretativ stärkere Wiedergabe „gefasst“.
- source_word: יְשַׁלֵּם שְׁנָיִם
  choice: muss er das Doppelte erstatten
  rationale: Die Wendung verlangt eine Ersatzleistung in doppelter Höhe. „Erstatten“ macht den Charakter als Wiedergutmachung deutlich; das Subjekt ist im Kontext der Dieb.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Rechtsstil. Die einleitende Formulierung „dann gilt“ gliedert den längeren Fallsatz, ohne dem Inhalt etwas hinzuzufügen. „Jemand“ ist als natürliche deutsche Entsprechung für die unbestimmte Rechtsperson gewählt; der Dieb bleibt entsprechend dem hebräischen Text maskulin bezeichnet.
