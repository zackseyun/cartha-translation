  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den rechtlichen Charakter im Wesentlichen wieder. Zwei Punkte benötigen jedoch Korrektur: אַנְשֵׁי קֹדֶשׁ ist ausdrücklich maskulin und sollte im Haupttext nicht durch „Menschen“ neutralisiert werden; außerdem ergänzt „von einem Tier“ bei טְרֵפָה einen im Hebräischen nicht genannten Akteur und erzeugt zudem die missverständliche Konstruktion, dass das Tier selbst gerissen worden sei.'
  naturalness: „Ihr sollt mir heilige Männer sein“ ist in einem würdevollen gesetzlichen Bibelregister verständlich und natürlich genug. „Fleisch, das auf dem Feld gerissen wurde“ bewahrt die knappe hebräische Formulierung; „den Hunden hinwerfen“ ist modernes Standarddeutsch.
  terminology: „Heilig“ trifft קֹדֶשׁ unmittelbar. „Männer“ bildet die maskuline Pluralform von אַנְשֵׁי ab, ohne daraus eine weitergehende sozialgeschichtliche oder theologische Deutung abzuleiten. „Gerissen“ lässt den im Quelltext nur naheliegenden, nicht ausdrücklich genannten Verursacher offen.
  issues:
