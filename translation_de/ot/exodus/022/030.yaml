revisions:
- from: Und ihr sollt mir heilige Menschen sein.[a] Fleisch von einem Tier, das auf dem Feld gerissen wurde,[b] dürft ihr nicht essen; ihr sollt es den Hunden hinwerfen.
  to: Und ihr sollt mir heilige Männer sein.[a] Fleisch, das auf dem Feld gerissen wurde,[b] dürft ihr nicht essen; ihr sollt es den Hunden hinwerfen.
  rationale: Die Revision stellt die maskuline Form von אַנְשֵׁי im Haupttext wieder her und entfernt die nicht explizite Ergänzung eines tierischen Verursachers. Die Fußnoten bleiben an den jeweils einschlägigen Ausdrücken verankert und erläutern nur die textlich relevante Ambiguität.
