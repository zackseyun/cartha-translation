base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/030.yaml
  text: And you shall be holy men to me[a]. You shall not eat flesh torn in the field[b]; you shall throw it to the dogs.
translation:
  language: de
  text: Und ihr sollt mir heilige Männer sein.[a] Fleisch, das auf dem Feld gerissen wurde,[b] dürft ihr nicht essen; ihr sollt es den Hunden hinwerfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Männer der Heiligkeit«; die hebräische Form ist ausdrücklich maskulin.'
    reason: lexical_alternative
  - marker: b
    text: Wer oder was das Fleisch gerissen hat, wird im Hebräischen nicht ausdrücklich genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי קֹדֶשׁ
  choice: heilige Menschen
  rationale: Die Konstruktverbindung bedeutet wörtlich »Menschen/Männer der Heiligkeit«. »Heilige Menschen« bewahrt die Heiligkeitsaussage und klingt im modernen Deutschen natürlicher als »Männer der Heiligkeit«; eine Fußnote weist auf die ausdrücklich maskuline Form hin.
- source_word: תִּהְיוּן לִי
  choice: ihr sollt mir ... sein
  rationale: Die Formulierung bewahrt sowohl den verpflichtenden Charakter als auch die relationale Zugehörigkeit zu Gott.
- source_word: בָשָׂר
  choice: Fleisch
  rationale: »Fleisch« ist die direkte und im Kontext einer Speisevorschrift natürliche Entsprechung.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: Die räumliche Angabe wird konkret und idiomatisch wiedergegeben; gemeint sein kann auch das freie Land.
- source_word: טְרֵפָה
  choice: von einem Tier ... gerissen
  rationale: Das Wort bezeichnet Gerissenes beziehungsweise Beute. Die Ergänzung »von einem Tier« macht den im Hebräischen nur implizierten Urheber im Deutschen verständlich und wird in einer Fußnote kenntlich gemacht.
- source_word: לֹא תֹאכֵלוּ
  choice: dürft ihr nicht essen
  rationale: Die deutsche Formulierung gibt das gesetzliche Verbot klar, natürlich und ohne archaisches Sprachgefühl wieder.
- source_word: לַכֶּלֶב
  choice: den Hunden
  rationale: Obwohl der hebräische Ausdruck formal im Singular steht, ist der deutsche Plural als generische, sprichwörtlich wirkende Zielangabe natürlich.
- source_word: תַּשְׁלִכוּן אֹתוֹ
  choice: ihr sollt es ... hinwerfen
  rationale: »Hinwerfen« gibt die konkrete Entsorgungshandlung in aktuellem, verständlichem Deutsch wieder.
theological_decisions:
- issue: Heiligkeitssprache im Bundesrecht
  choice: »ihr sollt mir heilige Menschen sein«
  alternative: »ihr sollt mir heilige Männer sein« / »ihr sollt mir ein heiliges Volk sein«
  rationale: Die Wiedergabe bewahrt Heiligkeit und Zugehörigkeit zu Gott, ohne die Kollektivbedeutung vorschnell auf »Volk« festzulegen. Die grammatisch maskuline Ausgangsform wird in der Fußnote ausdrücklich dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlichem Ton. Die Satzfolge bleibt eng am Hebräischen; semantische Ergänzungen und die maskuline Form der Heiligkeitsbezeichnung werden transparent in Fußnoten ausgewiesen.
