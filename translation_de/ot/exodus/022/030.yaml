    issue: „heilige Menschen“ neutralisiert die explizit maskuline Form im Haupttext.
    rationale: אַנְשֵׁי ist maskuliner Plural. Die vorhandene Fußnote dokumentiert dies zwar, aber bei einer optimal-äquivalenten Übersetzung sollte die Form im Text selbst erhalten bleiben.
  - severity: high
    issue: „Fleisch von einem Tier, das auf dem Feld gerissen wurde“ fügt einen Akteur hinzu und verschiebt den Bezug.
    rationale: טְרֵפָה bezeichnet das Gerissene; das Hebräische nennt kein Tier als Urheber. Die deutsche Formulierung kann außerdem bedeuten, das Tier, von dem das Fleisch stammt, sei gerissen worden. Der Text sollte den Akteur offenlassen.
  revised_text: Und ihr sollt mir heilige Männer sein.[a] Fleisch, das auf dem Feld gerissen wurde,[b] dürft ihr nicht essen; ihr sollt es den Hunden hinwerfen.
