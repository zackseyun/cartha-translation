  yaml_path: translation/ot/exodus/022/025.yaml
  text: If you take your neighbor’s cloak as a pledge[b][a], you shall return it to him before the sun sets.
translation:
  language: de
  text: Wenn du den Mantel deines Nächsten als Pfand nimmst, musst du ihn ihm bis zum Sonnenuntergang zurückgeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet einen kasuistischen Rechtssatz ein. „Wenn“ gibt die Bedingung direkt und im Deutschen natürlich wieder.
- source_word: חָבֹל תַּחְבֹּל
  choice: als Pfand nimmst
  rationale: Der Infinitivus absolutus mit dem finiten Verb bezeichnet nachdrücklich das Pfänden. Eine wörtliche Verdoppelung wäre im Deutschen unnatürlich; „als Pfand nehmen“ gibt den Rechtsvorgang klar wieder.
- source_word: שַׂלְמַת
  choice: Mantel
  rationale: Das Wort bezeichnet ein Obergewand beziehungsweise eine äußere Decke, die nachts Schutz bieten konnte. „Mantel“ ist konkret, verständlich und passt zum Zusammenhang.
- source_word: רֵעֶךָ
  choice: deines Nächsten
  rationale: „Nächster“ bewahrt in diesem sozialen Rechtskontext die zwischenmenschliche und gemeinschaftliche Bedeutung von רֵעַ.
- source_word: עַד בֹּא הַשֶּׁמֶשׁ
  choice: bis zum Sonnenuntergang
  rationale: Wörtlich etwa „bis zum Kommen der Sonne“; im Kontext bezeichnet die Wendung den Sonnenuntergang. „Bis zum Sonnenuntergang“ wahrt dabei die Form der zeitlichen Frist.
- source_word: תְּשִׁיבֶנּוּ לוֹ
  choice: musst du ihn ihm zurückgeben
  rationale: Der Hifil von שוב bedeutet hier, etwas zu seinem Besitzer zurückzubringen. „musst“ drückt die verbindliche Rechtsanweisung in natürlichem modernem Deutsch aus.
