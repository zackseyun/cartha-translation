  source_fidelity: Die Übersetzung trifft den Rechtsfall, die Vorlage von Überresten als Beweis und die Befreiung von Ersatzleistung zutreffend. Das hebräische טָרֹף יִטָּרֵף ist eine intensivierte Form; die Verursachung durch ein wildes Tier ist kontextuell naheliegend, aber nicht durch ein ausdrücklich genanntes Substantiv ausgedrückt. „Wildes Tier“ ist dafür neutraler und quellennäher als „Raubtier“.
  naturalness: „Wenn es aber von einem wilden Tier zerrissen wird“ ist natürliches modernes Deutsch in einer rechtssprachlichen Bedingung. „Als Beweis vorlegen“ und „keinen Ersatz leisten“ sind klar und angemessen.
  terminology: „Beweis“ gibt עֵד in diesem forensischen Zusammenhang idiomatisch wieder. „Das Gerissene“ wahrt die substantivierte und nicht weiter spezifizierte Form von הַטְּרֵפָה. „Ersatz leisten“ gibt die rechtliche Funktion von שִׁלֵּם angemessen wieder.
