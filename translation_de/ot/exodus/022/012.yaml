  text: But if it is torn by beasts[a], he shall bring it as evidence; he shall not make restitution for what was torn.
translation:
  language: de
  text: Wenn es aber von einem wilden Tier zerrissen wird, soll er es als Beweis vorlegen[a]; für das Gerissene muss er keinen Ersatz leisten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn es tatsächlich zerrissen worden ist, soll er es als Beweis vorlegen; für das Gerissene muss er keinen Ersatz leisten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn ... aber
  rationale: Leitet den nächsten Rechtsfall ein und markiert im Zusammenhang einen Gegensatz zum vorhergehenden Fall.
- source_word: טָרֹף יִטָּרֵף
  choice: von einem Raubtier gerissen wurde
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb hebt das Zerreißen hervor. Der Zusammenhang legt das Reißen durch ein wildes Tier nahe; die deutsche Formulierung macht dies natürlich verständlich.
- source_word: יְבִאֵהוּ
  choice: soll er es ... vorlegen
  rationale: Das Hifil von בוא bedeutet hier, etwas herbeizubringen bzw. vorzulegen. Das Pronomen bezieht sich am ehesten auf das gerissene Tier oder dessen Überreste.
- source_word: עֵד
  choice: als Beweis
  rationale: Wörtlich bezeichnet das Wort einen Zeugen oder ein Zeugnis; hier haben die vorgelegten Überreste eine Beweisfunktion.
- source_word: הַטְּרֵפָה
  choice: das Gerissene
  rationale: Bewahrt die knappe, substantivierte Ausdrucksweise des Hebräischen, ohne genauer als der Ausgangstext zwischen Tier und Überresten zu unterscheiden.
- source_word: לֹא יְשַׁלֵּם
  choice: muss er keinen Ersatz leisten
  rationale: Das Piel von שלם bezeichnet in diesem rechtlichen Zusammenhang das Leisten von Ersatz oder Entschädigung.
