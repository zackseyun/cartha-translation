  terminology: „Erstgeborenen deiner Söhne“ ist präzise und registergerecht. Für das landwirtschaftliche Wortpaar sollte die Übersetzung weder den flüssigen Ertrag auf Wein noch auf eine Kelter festlegen. „Voller Ertrag deiner Ernte“ und „ausgepresster flüssiger Ertrag“ bewahren die Unterscheidung von festem und flüssigem Ertrag ohne solche Eingrenzung.
