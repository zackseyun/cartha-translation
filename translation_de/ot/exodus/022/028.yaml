base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/028.yaml
  text: You shall not delay the fullness of your harvest and the outflow of your press[a]. You shall give to me the firstborn of your sons.
translation:
  language: de
  text: Du sollst nicht zögern, den vollen Ertrag deiner Ernte und deinen ausgepressten flüssigen Ertrag darzubringen[a]. Den Erstgeborenen deiner Söhne sollst du mir geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deinen vollen Ertrag und deinen Saft/Wein«. Die hebräischen Begriffe bezeichnen wahrscheinlich geerntete Feldfrüchte und ausgepressten flüssigen Ertrag. Gemeint sein können besonders Getreide und Wein, aber auch allgemeiner fester und flüssiger Ertrag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָתְךָ
  choice: den vollen Ertrag deiner Ernte
  rationale: מְלֵאָה bezeichnet wörtlich die Fülle beziehungsweise den vollen Ertrag. Im Zusammenhang dieser Abgabebestimmung ist damit der Ernteertrag gemeint; die Formulierung bewahrt sowohl das Bild der Fülle als auch den landwirtschaftlichen Sinn.
- source_word: וְדִמְעֲךָ
  choice: und den Saft aus deiner Kelter
  rationale: דִּמְעָה kann sonst »Träne« bedeuten, bezeichnet hier aber den ausgepressten flüssigen Ertrag. »Saft aus deiner Kelter« erhält das Bild, ohne den Ertrag unnötig auf Wein oder Öl festzulegen.
- source_word: לֹא תְאַחֵר
  choice: sollst du … nicht verspätet abgeben
  rationale: Das Piel von אחר bedeutet hier verzögern oder verspäten. Da das Deutsche beim genannten Ertrag eine Handlung ausdrücken muss, macht »abgeben« die im Rechtskontext vorausgesetzte Darbringung deutlich, während »nicht verspätet« den zeitlichen Sinn des Verbs wahrt.
- source_word: בְּכוֹר
  choice: den Erstgeborenen
  rationale: בְּכוֹר bezeichnet den Erstgeborenen. Die maskuline Form passt zur ausdrücklichen Ergänzung »deiner Söhne«.
- source_word: בָּנֶיךָ
  choice: deiner Söhne
  rationale: Das hebräische Wort bezeichnet hier ausdrücklich Söhne und wird daher nicht zu »Kinder« verallgemeinert.
- source_word: תִּתֶּן לִּי
  choice: sollst du mir geben
  rationale: Die Formulierung gibt die verbindliche Rechtsforderung natürlich wieder und erhält Gott als ausdrücklich genannten Empfänger.
theological_decisions:
- issue: Bedeutung des landwirtschaftlichen Wortpaars מְלֵאָה / דִּמְעָה
  choice: Fester Ernteertrag und ausgepresster flüssiger Ertrag sind ohne Verzögerung abzugeben.
  alternative: Die Begriffe bezeichnen speziell Getreide und Wein oder allgemein die Erstlingsgaben, ohne zwei Ertragsarten zu unterscheiden.
  rationale: Das hebräische Wortpaar legt die Verbindung von vollem Ernteertrag und ausgepresster Flüssigkeit nahe. Die Übersetzung vermeidet eine unbelegte Festlegung auf Wein oder Öl und lässt die genaue Reichweite offen.
- issue: Wiedergabe von בָּנֶיךָ
  choice: Söhne
  alternative: Kinder
  rationale: Der Ausgangstext verwendet den spezifisch maskulinen Ausdruck. Die Übersetzung erhält diese Bedeutung, ohne darüber hinaus eine besondere Lehrentscheidung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Verbindlichkeit wird mit »sollst« ausgedrückt. »Nicht verspätet abgeben« verdeutlicht die im Hebräischen knappe, sachlich vorausgesetzte Abgabe, ohne deren genaue kultische Form näher zu bestimmen.
