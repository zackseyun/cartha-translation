  verdict: revise
  source_fidelity: Der Entwurf gibt die beiden Imperativsätze, die Besitzsuffixe und die spezifische Bezugnahme auf „Söhne“ zutreffend wieder. „Kelter“ legt jedoch eine konkrete Vorrichtung und damit praktisch einen Wein-Kontext nahe, die im Hebräischen nicht ausdrücklich genannt werden; der Ausdruck bezeichnet allgemeiner flüssigen, ausgepressten Ertrag. Die Ergänzung „abgeben“ ist im Opfer-/Abgabekontext vertretbar, doch „darbringen“ bildet den an Gott gerichteten Kontext idiomatischer ab.
