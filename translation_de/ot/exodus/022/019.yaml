  source_fidelity: 'Der Entwurf gibt die wesentlichen hebräischen Elemente zutreffend wieder: das substantivische Partizip („Wer ... opfert“), die generische Gottheitsbezeichnung, die ausschließliche Ausnahme für Jahwe und die Bannstrafe von חרם. Die Stellung der Ausnahmeformulierung ist jedoch im Deutschen syntaktisch und semantisch nicht hinreichend klar.'
