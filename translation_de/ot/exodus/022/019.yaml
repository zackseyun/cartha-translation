  terminology: „Jahwe“ entspricht dem im hebräischen Text stehenden Gottesnamen. „Dem Bann verfallen“ ist für חרם eine tragfähige, angemessen gewichtige Wiedergabe; die Fußnote erklärt den heute weniger geläufigen Ausdruck. „Gottheit“ vermeidet zudem, dass der generische Singular „Gott“ in deutscher Lesart unnötig wie eine Anerkennung einer anderen wirklichen Gottheit klingt.
