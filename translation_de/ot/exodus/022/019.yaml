  text: זֹבֵ֥חַ לָ/אֱלֹהִ֖ים יָֽחֳרָ֑ם בִּלְתִּ֥י לַ/יהוָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/019.yaml
  text: Whoever sacrifices to any god[a], except to Yahweh alone, shall be devoted to destruction.
translation:
  language: de
  text: Wer einer Gottheit opfert, statt allein Jahwe zu opfern, soll dem Bann verfallen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „soll mit dem Bann belegt werden“ oder „soll völlig vernichtet werden“. Das hebräische Verb bezeichnet die unwiderrufliche Übergabe an den Bann und damit an die Vernichtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ
  choice: Wer … opfert
  rationale: Das substantivisch gebrauchte Qal-Partizip wird im Deutschen natürlich als unbestimmter Relativsatz wiedergegeben. »Opfern« bewahrt den kultischen Sinn des Schlachtopfers.
- source_word: לָאֱלֹהִים
  choice: einem Gott
  rationale: אֱלֹהִים ist der Form nach pluralisch, bezeichnet hier jedoch generisch eine Gottheit als Empfänger des Opfers. Der unmittelbar folgende Ausschluss »außer Jahwe allein« macht deutlich, dass jede andere Gottheit gemeint ist, ohne die formale Mehrdeutigkeit unnötig aufzulösen.
- source_word: יָחֳרָם
  choice: soll dem Bann verfallen
  rationale: Der Hofal von חרם bezeichnet, dass jemand dem Bann und damit unwiderruflicher Vernichtung übergeben wird. Die Formulierung erhält sowohl den sakralen als auch den strafrechtlichen Gehalt des Ausdrucks.
- source_word: בִּלְתִּי
  choice: außer
  rationale: בִּלְתִּי leitet hier eine Ausnahme ein; »außer« ist dafür die klare und idiomatische deutsche Entsprechung.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben. Die vom deutschen Verb geforderte Beziehung ist in der Wendung »Jahwe … opfert« enthalten.
- source_word: לְבַדּוֹ
  choice: allein
  rationale: 'Das Wort hebt die Ausschließlichkeit hervor: Opfer dürfen ausschließlich Jahwe gelten.'
theological_decisions:
- issue: Bedeutung der Bannformel חרם als Strafe für ein Opfer an eine andere Gottheit
  choice: soll dem Bann verfallen
  alternative: soll vollständig vernichtet werden / soll mit dem Bann belegt werden
  rationale: »Dem Bann verfallen« bewahrt die Verbindung von sakraler Aussonderung und Vernichtung. Eine bloße Wiedergabe mit »töten« oder »vernichten« würde diese rechtlich-theologische Dimension einebnen; die Fußnote erläutert die heute weniger geläufige Bannvorstellung.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift gibt den im hebräischen Text stehenden persönlichen Bundesnamen erkennbar wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Numerus und Referenz von אֱלֹהִים
  choice: einem Gott
  alternative: Göttern / irgendeinem Gott
  rationale: Der Kontext setzt Jahwe allen unzulässigen Opfern gegenüber. Der deutsche Singular kann die generische Bedeutung natürlich ausdrücken; die Formulierung behauptet dabei nicht, dass andere Gottheiten tatsächlich göttlichen Status besitzen.
translation_notes:
  register: Modernes, knappes und würdevolles Gesetzesdeutsch. Die Gedankenstriche grenzen die Ausnahme eindeutig ab. »Dem Bann verfallen« ist bewusst fachlich geprägt, wird aber durch die Fußnote unmittelbar erklärt.
