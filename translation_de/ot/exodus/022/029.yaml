  variant: modern standard German
source:
  edition: WLC
  text: כֵּֽן תַּעֲשֶׂ֥ה לְ/שֹׁרְ/ךָ֖ לְ/צֹאנֶ֑/ךָ שִׁבְעַ֤ת יָמִים֙ יִהְיֶ֣ה עִם אִמּ֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁמִינִ֖י תִּתְּנ/וֹ לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/029.yaml
  text: 'You shall do the same with your ox and with your flock: seven days it shall remain with its mother[b][a]; on the eighth day you shall give it to me.'
translation:
  language: de
  text: 'Ebenso sollst du es mit deinem Rind und deinem Kleinvieh machen: Sieben Tage soll es bei seiner Mutter bleiben[a][b]; am achten Tag sollst du es mir geben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sieben Tage soll es bei seiner Mutter sein.“ Wörtlich steht im Hebräischen „soll es bei seiner Mutter sein“; „bleiben“ verdeutlicht hier die zeitliche Dauer.'
    reason: lexical_alternative
  - marker: b
    text: Das Gebot setzt den vorausgehenden Zusammenhang über die Abgabe der Erstgeburt fort; im Hebräischen wird „erstgeboren“ in diesem Vers nicht wiederholt.
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן
  choice: Ebenso
  rationale: Verknüpft die Anweisung vergleichend mit dem unmittelbar vorausgehenden Gebot und klingt im Deutschen natürlich.
- source_word: תַּעֲשֶׂה
  choice: sollst du es … machen
  rationale: Gibt den verpflichtenden Charakter der Rechtsanweisung idiomatisch wieder.
- source_word: לְשֹׁרְךָ
  choice: mit deinem Rind
  rationale: Das ל bezeichnet hier den Bezug, auf den die Regel angewandt wird. „Rind“ ist im rechtlichen Zusammenhang weiter und sicherer als „Stier“ oder „Ochse“.
- source_word: לְצֹאנְךָ
  choice: mit deinem Kleinvieh
  rationale: צאן ist eine Sammelbezeichnung vor allem für Schafe und Ziegen; „Kleinvieh“ bewahrt diesen kollektiven und nicht näher festgelegten Sinn.
- source_word: שִׁבְעַת יָמִים
  choice: Sieben Tage
  rationale: Gibt den Akkusativ der Zeitdauer knapp und natürlich wieder.
- source_word: יִהְיֶה עִם אִמּוֹ
  choice: soll es bei seiner Mutter bleiben
  rationale: Wörtlich steht „soll es bei seiner Mutter sein“; „bleiben“ bringt die im Zusammenhang gemeinte Dauer verständlich zum Ausdruck, ohne den Sachgehalt zu erweitern.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: am achten Tag
  rationale: Entspricht der üblichen deutschen Wiedergabe dieser hebräischen Zeitangabe.
- source_word: תִּתְּנוֹ לִי
  choice: sollst du es mir geben
  rationale: Gibt נתן mit Objektsuffix und לִי direkt wieder und bewahrt die schlichte Forderung des Bundesrechts.
theological_decisions:
- issue: Bezug des Gebots auf die erstgeborenen Tiere
  choice: Der Vers wird als Fortsetzung der vorausgehenden Anweisung über Erstgeburten übersetzt, ohne „erstgeboren“ in den Haupttext einzufügen.
  alternative: Zur Verdeutlichung könnte „sein Erstgeborenes“ aus dem vorherigen Zusammenhang ergänzt werden.
  rationale: Im hebräischen Vers wird „erstgeboren“ nicht wiederholt, sondern aus dem Zusammenhang vorausgesetzt. Die Fußnote macht diesen Bezug transparent, ohne den Haupttext über den Wortlaut hinaus zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rechtsformel wird klar und verbindlich wiedergegeben; „Kleinvieh“ erhält die kollektive Bedeutung von צאן, und die kontextuell vorausgesetzte Erstgeburt wird nicht stillschweigend in den Haupttext eingefügt.
