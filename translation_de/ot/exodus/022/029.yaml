  verdict: approve
  source_fidelity: Der deutsche Text gibt die Vergleichsanweisung כֵּן תעשה treffend mit „Ebenso sollst du es … machen“ wieder. „Rind“ für שׁוֹר und „Kleinvieh“ für das kollektive צֹאן sind im rechtlich-landwirtschaftlichen Kontext angemessen. Die Dauerangabe und die Anweisung, das Tier am achten Tag Gott zu geben, sind vollständig und ohne sachliche Erweiterung wiedergegeben. „Bleiben“ ist eine vertretbare, kontextuell präzisierende Wiedergabe von „bei seiner Mutter sein“; die wörtlichere Alternative ist korrekt belegt.
  naturalness: Modernes, klares und würdiges Standarddeutsch. Die Formulierung „Sieben Tage soll es bei seiner Mutter bleiben“ ist idiomatisch; auch „am achten Tag sollst du es mir geben“ ist natürlich und bewahrt den verbindlichen Rechtsstil.
  terminology: 'Die Tierterminologie ist sachgerecht: „Rind“ vermeidet die unberechtigte Festlegung auf ein männliches Tier, und „Kleinvieh“ wahrt den Sammelbegriff für Schafe und Ziegen. Die Fußnote zum vorausgesetzten Erstgeburtskontext ist neutral formuliert und fügt diesen Begriff nicht unzulässig in den Haupttext ein.'
