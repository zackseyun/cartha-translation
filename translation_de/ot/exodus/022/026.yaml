base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/026.yaml
  text: For it is his only covering; it is his cloak for his skin. In what will he lie down? And if he cries out to me[a], I will hear, for I am compassionate.
translation:
  language: de
  text: Denn sie ist seine einzige Bedeckung, sein Mantel für seine Haut. Womit soll er sich beim Schlafen zudecken? Wenn er zu mir schreit, werde ich ihn erhören, denn ich bin gnädig[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »barmherzig« oder »mitfühlend«.'
    reason: Lexikalische Alternativen für חַנּוּן.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das unmittelbar vorausgehende Gebot ein.
- source_word: כְּסוּתֹה לְבַדָּהּ
  choice: seine einzige Decke
  rationale: כְּסוּת bezeichnet eine Bedeckung oder ein Kleidungsstück; לְבַדָּהּ macht deutlich, dass dem Armen keine weitere Bedeckung zur Verfügung steht. „Decke“ hält zugleich die nächtliche Funktion im Blick.
- source_word: שִׂמְלָתוֹ לְעֹרוֹ
  choice: sein Mantel für seinen bloßen Leib
  rationale: שִׂמְלָה ist ein Mantel beziehungsweise Obergewand. עוֹר bedeutet wörtlich „Haut“; „bloßer Leib“ gibt die konkrete Vorstellung einer unmittelbar den Körper bedeckenden Kleidung natürlich wieder.
- source_word: בַּמֶּה יִשְׁכָּב
  choice: Worauf soll er sonst schlafen?
  rationale: Die rhetorische Frage fragt nach der fehlenden Unterlage oder Bedeckung für die Nacht. „Sonst“ verdeutlicht den im Zusammenhang enthaltenen Gedanken, dass keine Alternative bleibt.
- source_word: וְהָיָה כִּי יִצְעַק אֵלַי
  choice: Und wenn er zu mir um Hilfe schreit
  rationale: Die Konstruktion führt einen künftigen möglichen Fall ein. צעק bezeichnet hier einen Hilferuf aus Bedrängnis; „um Hilfe schreit“ macht diesen Gehalt ausdrücklich.
- source_word: וְשָׁמַעְתִּי
  choice: werde ich ihn erhören
  rationale: שׁמע bedeutet wörtlich „hören“, schließt in diesem Zusammenhang aber Gottes Reaktion auf den Hilferuf ein. „Erhören“ ist im Deutschen die natürliche und kontextgerechte Wiedergabe.
- source_word: חַנּוּן
  choice: gnädig
  rationale: Das Adjektiv beschreibt Gott als den, der sich Bedürftigen in Gnade und Erbarmen zuwendet. „Gnädig“ ist eine direkte, würdige und im Deutschen vertraute Wiedergabe.
theological_decisions:
- issue: Wiedergabe der göttlichen Selbstbeschreibung חַנּוּן
  choice: gnädig
  alternative: barmherzig; mitfühlend
  rationale: חַנּוּן bezeichnet Gottes gnädige, erbarmende Zuwendung. „Gnädig“ bewahrt die übliche Bedeutung, ohne die im Kontext ebenfalls mitschwingende Barmherzigkeit auszuschließen; die Fußnote nennt die tragfähigen Alternativen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage wird idiomatisch formuliert; konkrete Bilder wie Mantel und Leib bleiben erhalten. Der Gottesrede angemessen ist „erhören“ statt des rein akustischen „hören“.
