  verdict: revise
  source_fidelity: Die Grundstruktur und die wesentlichen Begriffe werden getroffen. Allerdings fügt „bloßen“ einen im Hebräischen nicht ausgedrückten Gedanken hinzu; „sonst“ ergänzt ebenfalls eine nicht explizite Einschränkung. Die Frage zielt auf die fehlende Bedeckung zum Schlafen, nicht auf eine Schlafunterlage („worauf“).
  naturalness: Die Revision formuliert die rhetorische Frage idiomatisch und präzise. „Erhören“ ist in diesem Gotteswort ein angemessenes, natürliches Wort des würdigen modernen Standarddeutsch.
  terminology: „Mantel“ gibt שִׂמְלָה sachgerecht wieder; „Bedeckung“ bewahrt den allgemeinen Sinn von כְּסוּת. „Haut“ erhält die konkrete Bildlichkeit von עוֹר ohne die zusätzliche Deutung „bloßer Leib“. „Gnädig“ ist für חַנּוּן tragfähig; die Fußnote nennt mögliche Nuancen.
  issues:
  - severity: medium
    issue: „bloßen Leib“
    rationale: Das Adjektiv „bloßen“ ist im hebräischen Text nicht vorhanden. עוֹר bedeutet konkret „Haut“; die Wendung soll die Funktion des Mantels als unmittelbare Körperbedeckung beschreiben, nicht ausdrücklich Nacktheit behaupten.
  - severity: medium
    issue: „Worauf soll er sonst schlafen?“
    rationale: „Worauf“ legt eine Unterlage nahe, während בַּמֶּה hier nach dem verbleibenden Mittel bzw. der Bedeckung zum Schlafen fragt. „Sonst“ ist zudem eine interpretierende Ergänzung.
  - severity: low
    issue: „zu mir um Hilfe schreit“
    rationale: Der Hilferuf liegt im Kontext von צעק nahe, doch „um Hilfe“ wird nicht ausdrücklich gesagt. Die knappere Wiedergabe bewahrt die Ausdrucksweise des Ausgangstextes besser.
