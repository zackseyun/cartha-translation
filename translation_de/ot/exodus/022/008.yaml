  text: עַֽל כָּל דְּבַר פֶּ֡שַׁע עַל שׁ֡וֹר עַל חֲ֠מוֹר עַל שֶׂ֨ה עַל שַׂלְמָ֜ה עַל כָּל אֲבֵדָ֗ה אֲשֶׁ֤ר יֹאמַר֙ כִּי ה֣וּא זֶ֔ה עַ֚ד הָֽ/אֱלֹהִ֔ים יָבֹ֖א דְּבַר שְׁנֵי/הֶ֑ם אֲשֶׁ֤ר יַרְשִׁיעֻ/ן֙ אֱלֹהִ֔ים יְשַׁלֵּ֥ם שְׁנַ֖יִם לְ/רֵעֵֽ/הוּ־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/008.yaml
  text: For every case of wrongdoing involving an ox[a], a donkey, a sheep, a garment, or any lost thing about which someone says, ‘This is it,’ the case of both parties shall come before God[b]. The one whom God declares guilty shall pay double to his neighbor.
translation:
  language: de
  text: 'In jedem Streitfall über ein Rind, einen Esel, ein Stück Kleinvieh[a], ein Kleidungsstück oder irgendeinen verlorenen Gegenstand, von dem jemand sagt: »Das ist es«, soll die Sache beider Parteien vor Gott[b] kommen. Wen Gott für schuldig erklärt, der soll seinem Nächsten das Doppelte erstatten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch שֶׂה bezeichnet ein einzelnes Tier aus dem Kleinvieh, also ein Schaf oder eine Ziege.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »vor die Richter« beziehungsweise »vor das Gericht«. Hebräisch אֱלֹהִים kann hier Gott selbst oder menschliche Richter in einem von göttlicher Autorität geprägten Rechtsverfahren bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר פֶּשַׁע
  choice: Fall von Unrecht
  rationale: דָּבָר bezeichnet hier eine Rechtssache, פֶּשַׁע ein Unrecht beziehungsweise Vergehen. Die Formulierung bleibt juristisch verständlich, ohne die Art des Delikts enger festzulegen.
- source_word: שׁוֹר
  choice: Rind
  rationale: שׁוֹר kann ein einzelnes Tier der Rindergattung, insbesondere ein männliches Tier oder Zugrind, bezeichnen. »Rind« wahrt im Deutschen die für eine Eigentumsliste passende generische Breite besser als »Ochse«.
- source_word: חֲמוֹר
  choice: Esel
  rationale: Die übliche und klare moderne Bezeichnung für das genannte Haustier.
- source_word: שֶׂה
  choice: Stück Kleinvieh
  rationale: שֶׂה bezeichnet ein einzelnes Tier aus dem Kleinvieh und kann ein Schaf oder eine Ziege sein. »Stück Kleinvieh« erhält diese Breite im Haupttext.
- source_word: שַׂלְמָה
  choice: Kleidungsstück
  rationale: Der Ausdruck bezeichnet allgemein ein Gewand oder Kleidungsstück; die Wahl vermeidet die unnötige Verengung auf einen Mantel.
- source_word: אֲבֵדָה
  choice: verlorener Gegenstand
  rationale: Gemeint ist verlorenes Eigentum im weiten Sinn. »Gegenstand« ist im Deutschen natürlich und für den Rechtskontext ausreichend offen.
- source_word: אֲשֶׁר יֹאמַר כִּי הוּא זֶה
  choice: 'von dem jemand sagt: »Das ist er«'
  rationale: Die knappe Identifikationsformel des Hebräischen wird bewahrt, ohne ausdrücklich zu ergänzen, ob es sich um eine Eigentumsbehauptung oder Wiedererkennung handelt.
- source_word: הָאֱלֹהִים / אֱלֹהִים
  choice: Gott
  rationale: Die lexikalisch direkte Bedeutung wird im Haupttext beibehalten. Die im Rechtskontext plausible Deutung als Richter oder Gericht wird in einer Fußnote dokumentiert.
- source_word: יָבֹא דְּבַר שְׁנֵיהֶם
  choice: soll der Fall beider Parteien ... kommen
  rationale: דָּבָר ist hier die Rechtssache; »beide Parteien« gibt den Dualbezug in natürlicher deutscher Rechtssprache wieder.
- source_word: יַרְשִׁיעֻן
  choice: für schuldig erklärt
  rationale: Der Hifil von רשע bezeichnet ein richterliches Schuldigsprechen, nicht bloß eine moralische Einschätzung.
- source_word: יְשַׁלֵּם שְׁנַיִם
  choice: das Doppelte erstatten
  rationale: Die Wendung fordert zweifachen Ersatz. »Erstatten« verdeutlicht im Eigentumsfall die Wiedergutmachung, ohne zusätzliche Einzelheiten einzutragen.
- source_word: לְרֵעֵהוּ
  choice: seinem Mitmenschen
  rationale: רֵעַ meint den anderen beziehungsweise Nächsten oder Gefährten. »Mitmensch« ist würdig und verständlich und passt hier zur anderen Streitpartei.
theological_decisions:
- issue: Bedeutung von אֱלֹהִים im Rechtskontext
  choice: Gott
  alternative: die Richter / das Gericht
  rationale: אֱלֹהִים bedeutet seiner Form nach »Gott« beziehungsweise »Götter«, kann in diesem rechtlichen Zusammenhang aber nach einer alten und plausiblen Deutung menschliche Richter als Träger göttlicher Autorität meinen. Der Haupttext bewahrt die direkte Lesart; die institutionelle Alternative steht in der Fußnote.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Rechtston. Die Satzstruktur folgt dem kasuistischen Charakter des hebräischen Gesetzestextes. »Stück Kleinvieh« erhält die lexikalische Breite von שֶׂה; die Mehrdeutigkeit von אֱלֹהִים wird nicht im Haupttext aufgelöst, sondern transparent angemerkt.
