  text: שֵׁ֤שֶׁת יָמִים֙ תַּֽעֲבֹ֔ד וְ/עָשִׂ֖יתָ כָּל מְלַאכְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/009.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: de
  text: Sechs Tage sollst du arbeiten und deine ganze Arbeit verrichten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Sechs Tage
  rationale: Die Verbindung aus Zahlwort und Substantiv bildet ohne ausdrücklich gesetzte Präposition eine Zeitangabe. „Sechs Tage“ ist im Deutschen natürlich und bleibt der hebräischen Form nahe.
- source_word: תַּעֲבֹד
  choice: sollst du arbeiten
  rationale: עבד bedeutet im Qal hier „arbeiten“. „Sollst“ gibt im Kontext des Dekalogs die anweisende Kraft des Imperfekts angemessen wieder.
- source_word: וְעָשִׂיתָ
  choice: und … tun
  rationale: עשה hat ein breites Bedeutungsspektrum („tun, machen“). In Verbindung mit מְלָאכָה ist „Arbeit tun“ eine direkte, verständliche Wiedergabe, auch wenn die Wiederholung im Deutschen bewusst hebraismennah klingt.
- source_word: כָּל
  choice: all
  rationale: כָּל bezeichnet hier die Gesamtheit und wird unmittelbar mit „all“ wiedergegeben.
- source_word: מְלַאכְתֶּךָ
  choice: deine Arbeit
  rationale: מְלָאכָה bezeichnet Arbeit, Tätigkeit oder Aufgabe. „Deine Arbeit“ ist im Sabbatgebot die klarste und kontextuell passendste Entsprechung.
theological_decisions:
- issue: Anweisende Kraft des Imperfekts im Sabbatgebot
  choice: „sollst du arbeiten“
  alternative: „darfst du arbeiten“ / „wirst du arbeiten“
  rationale: Im Zusammenhang des Dekalogs formuliert der Vers eine Bundesweisung und nicht bloß eine Erlaubnis oder Vorhersage. „Sollst“ bewahrt diesen verpflichtenden Ton.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt knapp und folgt dem parallelen Aufbau des Hebräischen. Keine Fußnote ist nötig, da „Sechs Tage“ die formnahe und zugleich natürliche deutsche Zeitangabe ist.
