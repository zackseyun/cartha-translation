lexical_decisions:
- source_word: זָכוֹר
  choice: Denke an
  rationale: Der Qal-Imperativ Singular fordert zu aktivem, handlungswirksamem Erinnern auf. „Denke an“ ist im modernen Deutschen natürlich und bewahrt den unmittelbaren Aufforderungscharakter.
- source_word: אֶת
  choice: '[Akkusativmarker, unübersetzt]'
  rationale: Kennzeichnet im Hebräischen das bestimmte direkte Objekt und erhält im Deutschen keine eigene Entsprechung.
- source_word: יוֹם הַשַּׁבָּת
  choice: den Sabbattag
  rationale: Bezeichnet den bestimmten, als Sabbat anerkannten Tag. „Sabbattag“ ist präzise, verständlich und bildet die hebräische Wortgruppe knapp ab.
- source_word: לְקַדְּשׁוֹ
  choice: um ihn heilig zu halten
  rationale: Der Infinitiv mit Präposition ל und Suffix der 3. Person maskulin Singular drückt hier den Zweck des Erinnerns aus. Die Formulierung bewahrt sowohl den Gedanken der Heiligkeit als auch den des entsprechenden Umgangs mit dem Tag.
theological_decisions:
- issue: Wiedergabe der Heiligungssprache von קדשׁ im Sabbatgebot
  choice: um ihn heilig zu halten
  alternative: um ihn zu heiligen; um ihn als heilig auszusondern
  rationale: Das Hebräische kann das Heiligen beziehungsweise das Behandeln als heilig bezeichnen. „Heilig halten“ ist im Deutschen natürlich und bewahrt das theologische Gewicht, ohne die Aussage auf bloße Befolgung oder Ritualpraxis zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Imperativcharakter des Hebräischen bleibt erhalten; das maskuline Pronomen „ihn“ bezieht sich eindeutig auf den Sabbattag.
