base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/018.yaml
  text: All the people were seeing the thunder and the flashes of fire[a], and the sound of the trumpet, and the mountain smoking; and when the people saw it[c][b], they trembled and stood at a distance.
translation:
  language: de
  text: Das ganze Volk sah den Donner[a], die Feuerblitze[b], den Schall des Schofarhorns und den rauchenden Berg. Als das Volk dies sah[c], zitterten sie und blieben in der Ferne stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Laute« oder »die Stimmen«; im Zusammenhang sind wahrscheinlich Donnerschläge gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Fackeln«; hier sind wahrscheinlich blitzartige Feuererscheinungen gemeint.'
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen »sieht« das Volk die gesamte Erscheinung, zu der auch Donner und Schofarschall gehören. So bleibt der überwältigende, sinnesübergreifende Charakter der Szene erhalten.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים
  choice: sah
  rationale: Das Partizip beschreibt die Wahrnehmung der sich entfaltenden Erscheinungen. Im Deutschen ist das Präteritum hier natürlicher als eine Verlaufsumschreibung; das ungewöhnliche Sehen auch hörbarer Phänomene bleibt erhalten.
- source_word: הַקּוֹלֹת
  choice: den Donner
  rationale: Der Plural von קוֹל bedeutet wörtlich »die Laute/Stimmen«, bezeichnet im Zusammenhang der Sinai-Erscheinung aber wahrscheinlich Donnerschläge. Der Singular »Donner« ist im modernen Deutschen idiomatisch.
- source_word: הַלַּפִּידִם
  choice: die Feuerblitze
  rationale: Das Wort bezeichnet wörtlich Fackeln; hier sind feurige, blitzartige Erscheinungen gemeint. »Feuerblitze« bewahrt sowohl das Feuerbild als auch den situativen Charakter.
- source_word: קוֹל הַשֹּׁפָר
  choice: den Schall des Schofarhorns
  rationale: Die Konstruktion nennt den Klang eines שׁוֹפָר. »Schofarhorn« bewahrt die konkrete Bezeichnung des Horninstruments und ist verständlicher als das bloße Lehnwort.
- source_word: הָהָר עָשֵׁן
  choice: den rauchenden Berg
  rationale: Die knappe hebräische Prädikativkonstruktion wird als natürliche deutsche Partizipialfügung wiedergegeben und behält ihre anschauliche Wirkung.
- source_word: וַיַּרְא הָעָם
  choice: Als das Volk dies sah
  rationale: Die Wiederaufnahme leitet die Reaktion des Volkes ein. »Dies« verweist gesammelt auf die zuvor genannten Erscheinungen; »als« macht den zeitlichen Zusammenhang idiomatisch deutlich.
- source_word: וַיָּנֻעוּ
  choice: zitterte es
  rationale: Das Verb bezeichnet ein Schwanken oder Beben und vermittelt hier die von Furcht bestimmte körperliche Reaktion.
- source_word: וַיַּעַמְדוּ מֵרָחֹק
  choice: blieb in einiger Entfernung stehen
  rationale: Die Wendung beschreibt, dass das Volk Abstand hielt beziehungsweise aus der Ferne stehen blieb. Die deutsche Formulierung ist natürlich und räumlich klar.
- source_word: וְכָל הָעָם
  choice: Das ganze Volk
  rationale: Die Wendung bezeichnet die versammelte Gemeinschaft als Gesamtheit. »Das ganze Volk« ist eine direkte und idiomatische deutsche Wiedergabe.
theological_decisions:
- issue: Die Menschen »sehen« auch hörbare Erscheinungen
  choice: Das Verb »sehen« wird mit der gesamten Aufzählung verbunden und nicht zu »wahrnehmen« oder »hören« geglättet.
  alternative: »Das ganze Volk nahm den Donner … wahr« oder »hörte den Donner«
  rationale: Die auffällige Verbindung von ראה mit Donner und Schofarschall gehört zur überwältigenden, sinnesübergreifenden Darstellung der Gotteserscheinung. Die Übersetzung bewahrt diese Spannung; eine Fußnote erläutert sie.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gegenüber der langen hebräischen Reihung leicht gegliedert, ohne die Abfolge zu verändern. »Schofarhorn« erhält den kulturell konkreten Gegenstand; die ungewöhnliche Verbindung von »sehen« mit hörbaren Phänomenen wird bewusst bewahrt.
