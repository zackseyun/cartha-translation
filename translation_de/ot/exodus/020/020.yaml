base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/020.yaml
  text: And Moses said to the people[a], “Do not fear, for God has come to test you, and so that the fear of him may be before you[c][b], so that you may not sin.”
translation:
  language: de
  text: 'Mose aber sagte zum Volk: »Fürchtet euch nicht[a]! Denn Gott ist gekommen, um euch zu prüfen und damit die Furcht vor ihm[b] euch vor Augen steht[c], damit ihr nicht sündigt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Habt keine Angst.« Im Hebräischen steht hier derselbe Wortstamm wie später bei »Furcht vor ihm«. So entsteht ein bewusster Gegensatz zwischen Angst und der Furcht vor Gott.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ehrfurcht vor ihm.« Das hebräische Wort kann sowohl Furcht als auch ehrfürchtige Scheu bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »auf euren Gesichtern«. Gemeint ist etwas, das einem beständig vor Augen steht und im Bewusstsein gegenwärtig bleibt.'
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: Fürchtet euch nicht
  rationale: Das Verb ירא bezeichnet je nach Zusammenhang Furcht, Angst oder Ehrfurcht. Die Wiedergabe mit »fürchten« bewahrt die bewusste Verbindung zu יִרְאָתוֹ (»die Furcht vor ihm«) im weiteren Verlauf des Verses.
- source_word: לְבַעֲבוּר נַסּוֹת אֶתְכֶם
  choice: um euch zu prüfen
  rationale: לְבַעֲבוּר führt hier eine Absicht ein; נסה bedeutet prüfen oder erproben. »Um euch zu prüfen« ist gegenwärtiges, klares Deutsch und legt keine Verleitung zum Bösen nahe.
- source_word: בָּא
  choice: ist gekommen
  rationale: Das Qatal bezeichnet Gottes Kommen, dessen Wirkung in der gegenwärtigen Sinai-Szene fortbesteht. Das deutsche Perfekt gibt dies natürlich wieder.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Der Ausdruck bezeichnet hier den Gott Israels; der Gottesname JHWH steht in diesem Vers nicht.
- source_word: וּבַעֲבוּר
  choice: und damit
  rationale: Auch das zweite לְבַעֲבוּר bezeichnet einen Zweck. »Und damit« leitet die folgende Absicht idiomatisch ein.
- source_word: יִרְאָתוֹ
  choice: die Furcht vor ihm
  rationale: יִרְאָה kann sowohl Furcht als auch ehrfürchtige Scheu bezeichnen. »Furcht vor ihm« bewahrt die lexikalische Verbindung zu »Fürchtet euch nicht« und lässt die Spannung des Hebräischen bestehen.
- source_word: עַל־פְּנֵיכֶם
  choice: euch vor Augen steht
  rationale: Wörtlich bedeutet der Ausdruck »auf euren Gesichtern«. Die deutsche Wendung »vor Augen stehen« vermittelt idiomatisch etwas, das im Bewusstsein gegenwärtig bleibt, und behält zugleich das Bild der Augen beziehungsweise des Gesichts bei.
- source_word: לְבִלְתִּי תֶחֱטָאוּ
  choice: damit ihr nicht sündigt
  rationale: Die Konstruktion drückt eine verneinte Absicht aus. Die Wiedergabe erhält den finalen Sinn klar und natürlich.
theological_decisions:
- issue: Spannung zwischen »Fürchtet euch nicht« und »die Furcht vor ihm«
  choice: In beiden Aussagen den deutschen Wortstamm »Furcht/fürchten« verwenden
  alternative: Die erste Aussage mit »Habt keine Angst« und die zweite mit »Ehrfurcht vor ihm« wiedergeben
  rationale: Das Hebräische verwendet bewusst denselben Wortstamm und stellt lähmende Angst einer bleibenden, auf Gott gerichteten Furcht gegenüber. Die Übersetzung soll diese Spannung nicht durch unterschiedliche Begriffe vorschnell auflösen.
- issue: Bedeutung der göttlichen Prüfung
  choice: נסה mit »prüfen« wiedergeben
  alternative: »erproben« oder »auf die Probe stellen«
  rationale: Der Text beschreibt eine Prüfung mit dem Ziel, das Volk vom Sündigen abzuhalten. »Prüfen« wahrt diese Aussage, ohne eine Verleitung zum Bösen in den Text hineinzulesen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die zweimalige Zweckangabe mit »damit« spiegelt die Struktur des hebräischen Satzes. Die Wiederholung von »fürchten/Furcht« ist bewusst beibehalten, um Wortspiel und theologische Spannung des Ausgangstextes zu erhalten.
