  text: Du sollst keinen Ehebruch begehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: nicht
  rationale: Die hebräische Verneinung לֹא bildet zusammen mit der Imperfektform ein verbindliches Verbot. Im Deutschen gibt „sollst nicht“ den bleibenden Gebotscharakter natürlich und würdevoll wieder.
- source_word: תִּנְאָף
  choice: die Ehe brechen
  rationale: Das Verb נאף bezeichnet im Qal das Begehen von Ehebruch. „Die Ehe brechen“ ist im Deutschen die klare, geläufige und sachlich genaue Wiedergabe in diesem rechtlich-bundestheologischen Zusammenhang.
theological_decisions:
- issue: Formulierung des Verbots im Dekalog
  choice: Du sollst nicht die Ehe brechen.
  alternative: Brich nicht die Ehe.
  rationale: לֹא mit der zweiten Person Singular Imperfekt hat hier die Kraft eines verbindlichen Verbots. Die deutsche Form „Du sollst nicht“ bewahrt den feierlichen und fortdauernden Gebotscharakter, ohne altertümlich oder unnatürlich zu wirken.
- issue: Geltungsbereich der maskulinen Singularform
  choice: Generische Anrede mit „du“
  alternative: Ausdrücklich nur an einen Mann gerichtete Formulierung
  rationale: Die hebräische Verbform ist maskulin Singular, doch die Gebote des Dekalogs richten sich in repräsentativer Einzelanrede an das Bundesvolk. Das deutsche „du“ bewahrt die Singularanrede, ohne eine nicht erforderliche Beschränkung auf Männer hinzuzufügen.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdevoller Gebotssprache. Die traditionelle und weiterhin allgemein verständliche Formulierung wahrt sowohl die direkte Singularanrede als auch die rechtliche Schwere des hebräischen Verbots.
