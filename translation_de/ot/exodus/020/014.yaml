  source_fidelity: Die hebräische Formel לֹא תִּנְאָף ist ein knappes, verbindliches Verbot in zweiter Person Singular. „Du sollst keinen Ehebruch begehen“ gibt sowohl die prohibitive Kraft als auch die Bedeutung von נאף („Ehebruch begehen“) präzise wieder. Die Formulierung vermeidet zudem, das Verbot auf das Brechen der eigenen Ehe einzuengen.
  naturalness: „Du sollst nicht die Ehe brechen“ ist verständlich, aber im heutigen Standarddeutsch weniger idiomatisch und kann eher das Verletzen bzw. Auflösen der eigenen Ehe nahelegen. „Keinen Ehebruch begehen“ ist die etablierte, klare Formulierung in rechtlichem und biblischem Register.
  terminology: „Ehebruch“ ist der sachlich genaue deutsche Schlüsselbegriff für נאף. Die direkte Singularanrede und der würdige Dekalogstil bleiben erhalten.
