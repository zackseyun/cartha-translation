base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/022.yaml
  text: 'Then Yahweh said to Moses[c][b][a], “Thus you shall say to the sons of Israel: You yourselves have seen that I have spoken to you from heaven.”'
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „So sollst du zu den Israeliten[a] sagen: Ihr selbst habt gesehen, dass ich vom Himmel[b] her mit euch[c] geredet habe.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den Söhnen Israels“; gemeint ist das Volk Israel insgesamt.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: „von den Himmeln“. Im Deutschen steht in dieser Bedeutung gewöhnlich der Singular.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „zu euch“. Das Hebräische sagt wörtlich „mit euch“ und betont die unmittelbare Begegnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das wayyiqtol führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Folge in natürlichem, gehobenem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Hoheitstitel ersetzt.
- source_word: כֹּה תֹאמַר
  choice: So sollst du … sagen
  rationale: Die feste Botenformel wird klar und würdig wiedergegeben; „sollst“ bewahrt den verpflichtenden Charakter.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die Wendung bedeutet wörtlich „Söhne Israels“, bezeichnet hier jedoch das gesamte Volk; „Israeliten“ ist im Deutschen die natürliche kollektive Bezeichnung.
- source_word: אַתֶּם רְאִיתֶם
  choice: Ihr selbst habt gesehen
  rationale: Das ausdrücklich gesetzte Personalpronomen אַתֶּם trägt Nachdruck, der durch „ihr selbst“ erhalten bleibt.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was das Volk gesehen bzw. erfahren hat.
- source_word: מִן הַשָּׁמַיִם
  choice: vom Himmel her
  rationale: Der hebräische Plural wird gemäß deutschem Sprachgebrauch singularisch wiedergegeben; „her“ macht die Herkunftsrichtung deutlich.
- source_word: דִּבַּרְתִּי עִמָּכֶם
  choice: ich … mit euch geredet habe
  rationale: עִם bedeutet „mit“ und hebt die unmittelbare Begegnung hervor. Das Perfekt bezeichnet das eben erfahrene Ereignis mit bleibender Beweiskraft.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als Namen und entspricht der im modernen Deutschen üblichen wissenschaftlichen Umschrift.
- issue: Kollektivbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels; die Kinder Israels
  rationale: Die wörtlich maskuline Form ist eine genealogisch-korporative Bezeichnung für das ganze Volk. „Israeliten“ gibt diesen Umfang natürlich wieder, ohne Frauen aus dem angesprochenen Volk auszuschließen.
- issue: Verhältnis von Redendem und Angeredeten in דִּבַּרְתִּי עִמָּכֶם
  choice: mit euch geredet
  alternative: zu euch geredet
  rationale: Die Präposition עִם („mit“) lässt den Aspekt unmittelbarer Begegnung anklingen. Die Übersetzung bewahrt diese Nuance, ohne daraus zwingend ein wechselseitiges Gespräch abzuleiten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Syntax bleibt nahe am hebräischen Botenwort, vermeidet jedoch unnötig altertümliche Formen.
