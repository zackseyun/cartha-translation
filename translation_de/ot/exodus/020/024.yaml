base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/024.yaml
  text: You shall make for me an altar of earth[a], and on it you shall sacrifice your burnt offerings and your peace offerings, your flock and your herd. In every place where I cause my name to be remembered, I will come to you and bless you.
translation:
  language: de
  text: Einen Altar aus Erde sollst du mir machen. Darauf sollst du deine Brandopfer und deine Heilsopfer darbringen, dein Kleinvieh und deine Rinder. An jedem Ort, an dem ich meinen Namen in Erinnerung bringen lasse[a], werde ich zu dir kommen und dich segnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „an dem ich meinen Namen verkünde“ oder „an dem ich meinen Namen nennen lasse“. Das hebräische Verb ist kausativ und kann hier das Erinnern, Nennen, Verkünden oder Anrufen des Namens einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח אֲדָמָה
  choice: einen Altar aus Erde
  rationale: Die Constructusverbindung bezeichnet einen aus Erde beziehungsweise Erdboden gefertigten Altar. „Altar aus Erde“ ist konkret, verständlich und weniger missverständlich als „Erdaltar“.
- source_word: תַּעֲשֶׂה לִּי
  choice: sollst du mir machen
  rationale: Das Qal-Imperfekt der 2. Person Singular hat im rechtlich-anweisenden Kontext verpflichtenden Sinn; „mir“ bewahrt die Widmung an Gott.
- source_word: וְזָבַחְתָּ עָלָיו
  choice: Darauf sollst du … darbringen
  rationale: Im Opferkontext bezeichnet זבח das Darbringen beziehungsweise Opfern. „Darbringen“ klingt im Deutschen natürlich und vermeidet eine unnötige Verengung auf das Schlachten.
- source_word: עֹלֹתֶיךָ
  choice: deine Brandopfer
  rationale: „Brandopfer“ ist die etablierte und sachlich genaue Bezeichnung für das vollständig verbrannte Opfer.
- source_word: שְׁלָמֶיךָ
  choice: deine Heilsopfer
  rationale: שְׁלָמִים bezeichnet Opfer, die mit Heil, Wohlergehen und Gemeinschaft verbunden sind. „Heilsopfer“ wahrt diese Breite besser als eine ausschließliche Festlegung auf „Friedens-“ oder „Gemeinschaftsopfer“.
- source_word: אֶת צֹאנְךָ וְאֶת בְּקָרֶךָ
  choice: deine Schafe und Ziegen und deine Rinder
  rationale: צֹאן umfasst Kleinvieh, insbesondere Schafe und Ziegen, während בָּקָר Rinder bezeichnet. Die konkrete Wiedergabe vermeidet, צֹאן allein auf Schafe zu verengen.
- source_word: בְּכָל הַמָּקוֹם
  choice: An jedem Ort
  rationale: Die Wendung ist distributiv; „an jedem Ort“ ist im modernen Deutschen idiomatisch und erhält die Aussagebreite.
- source_word: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: an dem ich meinen Namen in Erinnerung rufe
  rationale: Der Hiphil von זכר ist kausativ. Diese Formulierung bewahrt Gottes Handeln und die semantische Offenheit zwischen Erinnernlassen, Nennen, Verkündigen und Geltendmachen des Namens.
- source_word: אָבֹא אֵלֶיךָ וּבֵרַכְתִּיךָ
  choice: werde ich zu dir kommen und dich segnen
  rationale: Die Wiedergabe erhält sowohl Gottes Kommen als auch die ausdrückliche Segenszusage in natürlichem Deutsch.
theological_decisions:
- issue: Bedeutung von אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: an dem ich meinen Namen in Erinnerung rufe
  alternative: an dem ich meinen Namen verkünde / an dem ich meinen Namen nennen lasse
  rationale: Die kausative Verbform und Gottes Initiative bleiben sichtbar, ohne festzulegen, ob das Erinnern durch Verkündigung, Anrufung, kultisches Gedenken oder eine andere Form göttlicher Namensgegenwart geschieht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Die Opferbegriffe bleiben fachlich erkennbar; ungebräuchliche Satzstellungen und unnötig altertümliche Wörter werden vermieden.
