source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אֶל מֹשֶׁ֔ה דַּבֵּר אַתָּ֥ה עִמָּ֖/נוּ וְ/נִשְׁמָ֑עָה וְ/אַל יְדַבֵּ֥ר עִמָּ֛/נוּ אֱלֹהִ֖ים פֶּן נָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/019.yaml
  text: And they said to Moses[a], “You speak with us, and we will listen; but let not God speak with us, lest we die.”
translation:
  language: de
  text: 'Da sagten sie zu Mose: »Sprich du mit uns, und wir wollen zuhören[a]. Aber Gott soll nicht mit uns sprechen, sonst sterben wir.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hören«. Das hebräische Verb kann aufmerksames Hören und, je nach Zusammenhang, auch die Bereitschaft zum Befolgen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten sie
  rationale: Das Wayyiqtol führt die Erzählung fort. »Da sagten sie« gibt den zeitlich-erzählerischen Anschluss im Deutschen natürlich wieder.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: אֶל bezeichnet hier die Richtung der Rede; »zu Mose« ist die übliche deutsche Wiedergabe.
- source_word: דַּבֵּר אַתָּה
  choice: Sprich du
  rationale: 'Der Imperativ mit ausdrücklich gesetztem Pronomen betont den Gegensatz: Mose soll sprechen, nicht Gott.'
- source_word: עִמָּנוּ
  choice: mit uns
  rationale: עִם bedeutet grundsätzlich »mit«. Die Formulierung bewahrt den relationalen Charakter der erbetenen Vermittlung.
- source_word: וְנִשְׁמָעָה
  choice: und wir wollen zuhören
  rationale: Die Kohortativform drückt die Bereitschaft der Sprecher aus. »Zuhören« vermittelt aufmerksames, aufnehmendes Hören; die breitere Bedeutungsvielfalt wird in der Fußnote erhalten.
- source_word: וְאַל יְדַבֵּר
  choice: Aber … soll nicht … sprechen
  rationale: אַל mit Imperfekt hat verbietende beziehungsweise jussivische Kraft. »Soll nicht« ist im modernen Deutsch klar und wahrt den Gegensatz zur Aufforderung an Mose.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Kontext am Sinai und die singularische Verbform weisen auf den Gott Israels als Einzahl.
- source_word: פֶּן נָמוּת
  choice: sonst sterben wir
  rationale: פֶּן leitet die befürchtete Folge ein. »Sonst« gibt diese knapp, unmittelbar und in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Bezug und Numerus von אֱלֹהִים
  choice: Singular »Gott«
  alternative: Plural »Götter«
  rationale: Der unmittelbare Sinai-Kontext und das singularische Verb verlangen hier einen singularischen Bezug. Die Entscheidung beruht auf Grammatik und Kontext.
- issue: Bedeutungsumfang von שׁמע
  choice: »zuhören« im Haupttext
  alternative: »hören« oder responsiv »gehorchen«
  rationale: Das Verb kann bloßes Hören, aufmerksames Zuhören oder responsive Befolgung bezeichnen. Der Haupttext vermeidet eine ausdrückliche Festlegung auf Gehorsam; die Fußnote bewahrt die lexikalische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sprich du« erhält die im Hebräischen markierte Betonung; »sonst sterben wir« ist natürlicher als das heute gehobene »damit wir nicht sterben«, ohne die feierliche Knappheit zu verlieren.
