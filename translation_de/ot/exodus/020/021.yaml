base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/021.yaml
  text: The people stood at a distance[a], and Moses approached the thick darkness where God was.
translation:
  language: de
  text: Das Volk stand in einiger Entfernung; Mose aber näherte sich der dichten Finsternis[a], in der Gott war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem dunklen Gewölk“ oder „dem Dunkel“. Das hebräische Wort kann eine dichte Finsternis bezeichnen, die mit einer Erscheinung Gottes verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: blieb … stehen
  rationale: Die Form erzählt hier, dass das Volk seine entfernte Stellung einnahm beziehungsweise dort verharrte. „Blieb … stehen“ gibt im Deutschen den Zusammenhang natürlich wieder, ohne mehr als eine fortdauernde Haltung auszudrücken.
- source_word: הָעָם
  choice: das Volk
  rationale: Der bestimmte Ausdruck bezeichnet das bereits versammelte Volk am Sinai. „Das Volk“ ist eindeutig und fügt keine im Hebräischen fehlende nähere Bezeichnung hinzu.
- source_word: מֵרָחֹק
  choice: in einiger Entfernung
  rationale: Der Ausdruck bezeichnet räumlichen Abstand. Diese Wiedergabe ist idiomatisches modernes Deutsch und vermeidet das altertümlichere „von ferne“.
- source_word: נִגַּשׁ
  choice: näherte sich
  rationale: Das Verb bedeutet, sich zu nähern oder heranzutreten. „Näherte sich“ ist klar, gegenwärtig und bewahrt die räumliche Bewegung.
- source_word: הָעֲרָפֶל
  choice: die dichte Finsternis
  rationale: עֲרָפֶל bezeichnet dichtes Dunkel beziehungsweise Finsternis, besonders im Zusammenhang einer Gotteserscheinung. „Dichte Finsternis“ bewahrt sowohl die konkrete Undurchdringlichkeit als auch die feierlich-bedrohliche Wirkung, ohne den Ausdruck vorschnell als Wolke zu deuten.
- source_word: אֲשֶׁר שָׁם הָאֱלֹהִים
  choice: in der Gott war
  rationale: Der Relativsatz bezeichnet den Ort der göttlichen Gegenwart. Im Deutschen wird שָׁם innerhalb der Ortsangabe natürlich durch „in der“ aufgenommen; „war“ bleibt näher am Wortlaut als das deutendere „gegenwärtig war“.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Im Zusammenhang ist eindeutig der Gott Israels gemeint; daher ist die singularische Wiedergabe „Gott“ angemessen.
theological_decisions:
- issue: Gottes Erscheinung in der Finsternis
  choice: עֲרָפֶל konkret als „dichte Finsternis“ wiedergeben und schlicht sagen, dass Gott dort „war“.
  alternative: „die dunkle Wolke“ oder „das Dunkel, in dem Gott gegenwärtig war“
  rationale: Der Vers verbindet Gottes Gegenwart spannungsvoll mit Verborgenheit und Unzugänglichkeit. Die Übersetzung bewahrt dieses Paradox, statt die Erscheinung rein meteorologisch zu erklären oder „war“ theologisch auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Semikolon-Satz bildet den Gegensatz zwischen dem entfernten Volk und dem sich nähernden Mose knapp ab. „Finsternis“ ist leicht gehoben, bleibt aber allgemein verständlich und trägt die theophanische Bildsprache angemessen.
