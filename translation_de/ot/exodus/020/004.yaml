  text: לֹֽ֣א תַֽעֲשֶׂ֨ה לְ/ךָ֥ פֶ֨סֶל֙ וְ/כָל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/004.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[c][b], or in the waters under the earth.
translation:
  language: de
  text: Du sollst dir kein geschnitztes Bild[a] machen und keinerlei Abbild[b] von etwas, das oben im Himmel, unten auf der Erde oder im Wasser unter der Erde ist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schnitzbild“. Das hebräische Wort bezeichnet ein durch Behauen oder Schnitzen gefertigtes Bild; „Götzenbild“ wäre bereits eine Deutung seiner religiösen Funktion.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gestalt“ oder „Darstellung“.'
    reason: lexical_alternative
  - marker: c
    text: 'Der Vers beschreibt die geschaffenen Bereiche in der räumlichen Vorstellungswelt der Antike: den Himmel oben, die Erde unten und das Wasser unter der Erde.'
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה
  choice: Du sollst … nicht machen
  rationale: Die Verneinung mit dem Imperfekt formuliert hier ein direktes Verbot. Die deutsche Wendung „Du sollst … kein … machen“ bewahrt den rechtlich-feierlichen Charakter des Dekalogs und klingt zugleich gegenwärtig.
- source_word: לְךָ
  choice: dir
  rationale: Der Dativ bezeichnet das persönliche Interesse beziehungsweise den Bezug auf den Angesprochenen; „dir“ gibt dies im Deutschen knapp und idiomatisch wieder.
- source_word: פֶסֶל
  choice: geschnitztes Bild
  rationale: Das Substantiv bezeichnet ein durch Behauen oder Schnitzen hergestelltes Bild. Diese Wiedergabe ist genauer als das bereits deutende „Götzenbild“ und verständlicher als das altertümliche „Schnitzwerk“.
- source_word: וְכָל תְּמוּנָה
  choice: und keinerlei Abbild
  rationale: תְּמוּנָה kann Gestalt, Abbild oder Darstellung bedeuten. „Abbild“ passt zum Zusammenhang visueller Darstellung; „keinerlei“ gibt כָּל im Geltungsbereich der Verneinung wieder. Das verbindende וְ bleibt als „und“ erhalten.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: von etwas, das oben im Himmel … ist
  rationale: Der Relativsatz benennt, was dargestellt würde. „Himmel“ ist im Deutschen trotz der formal pluralischen hebräischen Form die natürliche kosmologische Bezeichnung; „oben“ bewahrt die räumliche Gegenüberstellung.
- source_word: וַאֲשֶׁר בָּאָרֶץ מִתָּחַת
  choice: unten auf der Erde
  rationale: Bei Lebewesen und Dingen der geschaffenen Welt ist „auf der Erde“ idiomatischer als „in der Erde“. „Unten“ erhält den vertikalen Kontrast zu „oben“.
- source_word: וַאֲשֶׁר בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: oder im Wasser unter der Erde
  rationale: Die Formulierung gibt den dritten genannten Bereich und seine räumliche Lage unmittelbar wieder, ohne das antike Weltbild im Haupttext zu erklären oder zu modernisieren.
theological_decisions:
- issue: Reichweite des Bilderverbots
  choice: Der Vers wird als Verbot eines geschnitzten Bildes und jeglichen Abbilds aus den genannten Bereichen übersetzt, ohne seine Reichweite im Haupttext weiter einzugrenzen.
  alternative: „Götzenbild“ oder „ein Bild zur Anbetung“; alternativ eine ausdrückliche Ausweitung zu einem Verbot jeder Kunst.
  rationale: פֶסֶל wird nicht vorwegnehmend als „Götze“ gedeutet, und ein Zweck wie „zur Anbetung“ wird nicht ergänzt. Der folgende Vers stellt den Zusammenhang mit Niederwerfung und Dienst her. So bleibt die Spannung zwischen dem Wortlaut dieses Verses und seinem unmittelbaren Kontext erhalten.
translation_notes:
  register: Moderne, klare Standardsprache mit dem für den Dekalog angemessenen würdevollen Ton. Die Satzstellung hält das Verb „machen“ nahe beim ersten Gegenstand und lässt es zugleich für den zweiten gelten. Altertümliche Wörter werden vermieden; die kosmologische Bildsprache des hebräischen Textes bleibt jedoch unverändert erkennbar.
