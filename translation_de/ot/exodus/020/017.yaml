  text: לֹ֥א תַחְמֹ֖ד בֵּ֣ית רֵעֶ֑/ךָ לֹֽא תַחְמֹ֞ד אֵ֣שֶׁת רֵעֶ֗/ךָ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ וְ/שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/017.yaml
  text: You shall not covet your neighbor’s house; you shall not covet your neighbor’s wife[a], or his male servant, or his female servant, or his ox, or his donkey, or anything that belongs to your neighbor.
translation:
  language: de
  text: Du sollst nicht das Haus[a] deines Nächsten begehren. Du sollst nicht die Frau deines Nächsten begehren, auch nicht seinen Sklaven oder seine Sklavin, sein Rind oder seinen Esel oder irgendetwas, das deinem Nächsten gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Haushalt“. Das hebräische Wort kann auch einen Haushalt oder eine Hausgemeinschaft bezeichnen; wegen der anschließenden gesonderten Aufzählung passt hier jedoch „Haus“ als Haupttext.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: begehren
  rationale: Im Verbot bezeichnet חמד ein auf das Eigentum eines anderen gerichtetes, unrechtmäßiges Verlangen. „Begehren“ bewahrt die ethische Aussage und die vertraute Sprache des Gebots, ohne den Sinn auf sexuelles Verlangen einzuengen.
- source_word: בֵּית רֵעֶךָ
  choice: das Haus deines Nächsten
  rationale: בַּיִת kann Haus oder Hausgemeinschaft bedeuten. Da Frau, versklavte Menschen und Tiere anschließend einzeln genannt werden, ist hier das konkrete „Haus“ die naheliegende Wiedergabe.
- source_word: רֵעֶךָ
  choice: dein Nächster
  rationale: רֵעַ bezeichnet hier einen Mitmenschen innerhalb der Gemeinschaft. „Nächster“ ist im Deutschen idiomatisch, würdevoll und in diesem Gebotskontext fest verankert.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: die Frau deines Nächsten
  rationale: Die Verbindung bezeichnet eindeutig die Ehefrau des Nächsten. Im Deutschen bringt „die Frau deines Nächsten“ die relationale Bedeutung natürlich zum Ausdruck.
- source_word: עַבְדּוֹ
  choice: seinen Sklaven
  rationale: עֶבֶד bezeichnet einen männlichen Menschen in einem rechtlich gebundenen Abhängigkeitsverhältnis. In dieser Aufzählung dessen, was einem anderen zugeordnet ist, sollte dieser Status nicht durch das mildere „Diener“ verdeckt werden.
- source_word: אֲמָתוֹ
  choice: seine Sklavin
  rationale: אָמָה bezeichnet hier eine weibliche versklavte Person. „Sklavin“ gibt Status und Geschlecht knapp und deutlich wieder.
- source_word: שׁוֹרוֹ
  choice: sein Rind
  rationale: שׁוֹר bezeichnet ein Tier der Rindergattung, häufig ein Arbeitsrind. „Rind“ ist im modernen Deutsch natürlich und lässt das im Hebräischen nicht zwingend festgelegte Geschlecht offen.
- source_word: חֲמֹרוֹ
  choice: seinen Esel
  rationale: חֲמוֹר bezeichnet einen Esel; die moderne deutsche Entsprechung ist eindeutig.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: oder irgendetwas, das deinem Nächsten gehört
  rationale: Die Formulierung ist eine umfassende Schlussklausel. Diese Wiedergabe bewahrt sowohl den Gesamtumfang als auch die Zugehörigkeitsbedeutung von לְ.
- source_word: לֹא ... לֹא
  choice: Du sollst nicht ... Du sollst nicht
  rationale: Die zweimalige Negation wird nicht zusammengezogen, damit Wiederholung, Nachdruck und Gebotsstil des Hebräischen erhalten bleiben.
theological_decisions:
- issue: Bedeutung von בֵּית im ersten Satzteil
  choice: Haus
  alternative: Hausgemeinschaft beziehungsweise Haushalt
  rationale: Beide Bedeutungen sind lexikalisch möglich. Die anschließende gesonderte Aufzählung der Frau, der versklavten Menschen und der Tiere spricht im unmittelbaren Zusammenhang eher für das Gebäude beziehungsweise Anwesen; daher ist keine erklärende Erweiterung nötig.
- issue: Wiedergabe der Bezeichnungen עֶבֶד und אָמָה
  choice: Sklave / Sklavin
  alternative: Diener / Dienerin beziehungsweise Knecht / Magd
  rationale: Der rechtlich gebundene Status ist in dieser besitzbezogenen Aufzählung wesentlich. Die direkte Wiedergabe vermeidet es, die historische soziale Wirklichkeit sprachlich abzuschwächen, ohne sie zu billigen.
- issue: Reichweite des Verbots von חמד
  choice: begehren
  alternative: Verlangen haben nach
  rationale: „Begehren“ lässt offen, wie inneres Verlangen und auf Aneignung gerichtete Absicht genau zueinander stehen. So wird die ethische Spannung des hebräischen Ausdrucks nicht durch eine engere Deutung aufgelöst.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebotsstil. Die traditionelle Formulierung „Du sollst nicht“ und „dein Nächster“ bleibt erhalten; archaische Sozialbegriffe wie „Knecht“ und „Magd“ werden vermieden. Der hebräische Satzfluss wird durch zwei Hauptsätze und die vollständige Aufzählung bewahrt.
