base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/010.yaml
  text: but the seventh day is a Sabbath to Yahweh your God[a]; you shall not do any work—you, or your son, or your daughter, your male servant, or your female servant, or your livestock[c][b], or the sojourner within your gates.
translation:
  language: de
  text: 'Doch der siebte Tag ist ein Sabbat für Jahwe, deinen Gott.[a] Du sollst keinerlei Arbeit verrichten: weder du noch dein Sohn noch deine Tochter, dein Sklave noch deine Sklavin,[b] dein Vieh noch der Fremde, der sich in deinen Toren aufhält.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und der siebte Tag“. Die hebräische Konjunktion kann so wiedergegeben werden; „doch“ hebt den Gegensatz zu den sechs Arbeitstagen im vorherigen Vers hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell auch: „dein Diener oder deine Magd“. Die hebräischen Bezeichnungen können Dienende meinen, bezeichnen in diesem Zusammenhang aber Menschen in einem unfreien Haushaltsstatus.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „der Fremde, der in deinen Toren ist“. Gemeint ist ein Nichtisraelit, der sich im israelitischen Gemeinwesen aufhält.'
    reason: lexical_and_cultural_clarification
lexical_decisions:
- source_word: וְיוֹם הַשְּׁבִיעִי
  choice: Doch der siebte Tag
  rationale: Das וְ kann schlicht mit „und“ wiedergegeben werden; „doch“ macht im Deutschen den Gegensatz zu den sechs Arbeitstagen des vorherigen Verses natürlich deutlich.
- source_word: שַׁבָּת
  choice: ein Sabbat
  rationale: Die Wiedergabe bewahrt den hebräischen Begriff als Substantiv, statt ihn lediglich als „Ruhetag“ zu umschreiben.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: für Jahwe, deinen Gott
  rationale: Die Präposition לְ bezeichnet hier Zugehörigkeit beziehungsweise Widmung; „für“ klingt im Deutschen natürlich und zeigt, dass der Tag Jahwe geweiht ist.
- source_word: יהוה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֹא תַעֲשֶׂה כָל מְלָאכָה
  choice: Da sollst du keinerlei Arbeit verrichten
  rationale: Die Formulierung wahrt die verbindliche Kraft des Verbots; „keinerlei“ gibt den umfassenden Sinn von כָל im negierten Satz wieder.
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: dein Sklave oder deine Sklavin
  rationale: Das Begriffspaar bezeichnet hier Angehörige des Haushalts in einem rechtlich unfreien Status. Die transparente Wiedergabe vermeidet eine beschönigende Auflösung in „Diener“ und „Magd“.
- source_word: וּבְהֶמְתֶּךָ
  choice: dein Vieh
  rationale: בְּהֵמָה bezeichnet kollektiv die domestizierten Nutztiere des Haushalts; „Vieh“ ist im Deutschen knapp und treffend.
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: der ansässige Fremde, der innerhalb deiner Tore lebt
  rationale: גֵּר ist ein nichtisraelitischer, dauerhaft im Gemeinwesen lebender Fremder. „Innerhalb deiner Tore“ bewahrt das Orts- und Rechtsbild des hebräischen Textes; „lebt“ verdeutlicht idiomatisch den Aufenthalt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Wiedergabe als „Jahwe“ erhält den offenbarten Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Reichweite des Sabbatgebots im Haushalt
  choice: Kinder, versklavte Menschen, Vieh und ansässige Fremde werden ausdrücklich einbezogen
  alternative: Allgemeine oder abgeschwächte Bezeichnung der Hausgemeinschaft
  rationale: Die Aufzählung wird vollständig erhalten, sodass weder die soziale Wirklichkeit beschönigt noch der Schutz- und Verpflichtungsbereich des Gebots auf den Hausherrn beschränkt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Verbindlichkeit bleibt durch „sollst“ erhalten. Die Aufzählung ist idiomatisch mit „weder … noch … oder“ gestaltet; die sozialgeschichtlichen Begriffe werden nicht beschönigt. Alle Fußnotenmarker stehen an den jeweils einschlägigen Textstellen.
