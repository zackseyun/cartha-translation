id: EXO.20.12
reference: Exodus 20:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כַּבֵּ֥ד אֶת אָבִ֖י/ךָ וְ/אֶת אִמֶּ֑/ךָ לְמַ֨עַן֙ יַאֲרִכ֣וּ/ן יָמֶ֔י/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/012.yaml
  text: Honor your father and your mother[b][a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: de
  text: Ehre deinen Vater und deine Mutter, damit deine Tage lang werden[a] in dem Land[b], das Yahweh, dein Gott, dir gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „deine Tage werden lang“ ist ein hebräischer Ausdruck für ein langes Leben.
    reason: cultural_note
  - marker: b
    text: Wörtlich „auf dem Land“. Im Deutschen wird derselbe Sinn natürlicher mit „in dem Land“ ausgedrückt.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד
  choice: Ehre
  rationale: Der Piel-Imperativ fordert dazu auf, Vater und Mutter als gewichtig und der Ehre würdig zu behandeln. „Ehre“ bewahrt die ethische Verbindlichkeit stärker als das schwächere „Respektiere“.
- source_word: אָבִיךָ וְאֶת אִמֶּךָ
  choice: deinen Vater und deine Mutter
  rationale: Direkte und natürliche Wiedergabe der beiden Singularformen mit maskulinem Suffix der 2. Person Singular.
- source_word: לְמַעַן
  choice: damit
  rationale: Leitet den beabsichtigten beziehungsweise daraus folgenden Ausgang ein und gibt die Verbindung zwischen Gebot und Verheißung knapp und idiomatisch wieder.
- source_word: יַאֲרִכוּן יָמֶיךָ
  choice: deine Tage lang werden
  rationale: Bewahrt das hebräische Bild und dessen biblischen Klang. Gemeint ist ein langes Leben; diese Bedeutung wird in einer Fußnote erläutert.
- source_word: עַל הָאֲדָמָה
  choice: in dem Land
  rationale: אֲדָמָה bezeichnet im Zusammenhang das von Gott gegebene Land, nicht lediglich Erdboden. Obwohl עַל wörtlich „auf“ bedeutet, ist „in dem Land“ im Deutschen die natürliche Ortsangabe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Gibt den im hebräischen Text stehenden persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Standardgemäße Wiedergabe der Form mit Suffix der 2. Person Singular; die Apposition identifiziert Israels Bundesgott in direkter Anrede.
- source_word: נֹתֵן לָךְ
  choice: dir gibt
  rationale: Das Partizip kann gegenwärtiges, fortdauerndes oder unmittelbar bevorstehendes Handeln ausdrücken. Das deutsche Präsens „gibt“ lässt diese zeitliche Offenheit bestehen und passt zur noch ausstehenden Landgabe am Sinai.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: HERR; Jahwe; Jehova
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Namen. „Yahweh“ gibt ihn als Namen wieder, ohne ihn durch den Titel „HERR“ zu ersetzen.
- issue: Bezugsbereich von הָאֲדָמָה
  choice: das Land
  alternative: der Erdboden; die Erde
  rationale: Im Zusammenhang des Dekalogs und der Zusage, dass Gott es Israel gibt, ist das zugesagte Land gemeint. Die Übersetzung vermeidet jedoch die erklärende Erweiterung „verheißenes Land“.
- issue: Verhältnis von Gebot und langem Leben
  choice: damit deine Tage lang werden
  alternative: und dann wirst du lange leben
  rationale: Die mit לְמַעַן ausgedrückte Zweck- beziehungsweise Folgebeziehung bleibt erhalten, ohne die Aussage zu einer mechanischen Garantie auszudeuten oder ihre Spannung vorschnell aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute Singularanrede des Gebots bleibt erhalten. Der hebräische Ausdruck „deine Tage lang werden“ wird bewusst im Haupttext bewahrt und durch eine knappe Fußnote erschlossen.
