lexical_decisions:
- source_word: לֹא
  choice: nicht
  rationale: Die hebräische Verneinung לֹא bildet zusammen mit dem Imperfekt ein direktes, dauerhaft geltendes Verbot. Im Deutschen gibt „sollst nicht“ die rechtlich-feierliche Form des Dekalogs natürlich wieder.
- source_word: תִּגְנֹב
  choice: stehlen
  rationale: Das Qal-Imperfekt, 2. Person Maskulin Singular, von גנב bezeichnet hier ohne genanntes Objekt allgemein das Stehlen. Die mögliche kontextabhängige Bedeutung „einen Menschen rauben/entführen“ ist in diesem knappen Satz nicht hinreichend eingegrenzt.
theological_decisions:
- issue: Form des Verbots im Dekalog
  choice: Du sollst nicht stehlen.
  alternative: Stiehl nicht.
  rationale: לֹא mit dem Imperfekt formuliert ein unmittelbares Verbot innerhalb des Bundesrechts. „Du sollst nicht“ bewahrt im modernen Deutschen den knappen, feierlich-rechtlichen Ton, ohne dem Satz eine zusätzliche Lehraussage aufzuerlegen.
translation_notes:
  register: Knapper, würdiger und allgemein verständlicher Standarddeutsch-Registerton. Die vertraute Dekalogformulierung bleibt erhalten; die Fußnote nennt eine direktere moderne Wiedergabe.
