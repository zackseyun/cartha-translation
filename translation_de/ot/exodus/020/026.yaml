  terminology: „Nacktheit“ ist für עֶרְוָה eine sachliche, moderne Entsprechung, ohne den Ausdruck zu euphemisieren oder auf Geschlechtsteile einzuengen. „Altar“ und „hinaufsteigen“ sind passend.
