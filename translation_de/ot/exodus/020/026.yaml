  text: וְ/לֹֽא תַעֲלֶ֥ה בְ/מַעֲלֹ֖ת עַֽל מִזְבְּחִ֑/י אֲשֶׁ֛ר לֹֽא תִגָּלֶ֥ה עֶרְוָתְ/ךָ֖ עָלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/026.yaml
  text: And you shall not go up by steps to my altar[a], so that your nakedness may not be exposed on it.
translation:
  language: de
  text: Du sollst nicht über Stufen zu meinem Altar hinaufsteigen, damit deine Nacktheit nicht auf ihm sichtbar wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: damit deine Nacktheit nicht auf ihm aufgedeckt wird.'
    reason: „Sichtbar wird“ gibt den Sinn des Nifal von גלה idiomatisch wieder; „aufgedeckt wird“ ist eine nähere lexikalische Alternative.
lexical_decisions:
- source_word: תַעֲלֶה
  choice: hinaufsteigen
  rationale: Das Verb bezeichnet ein Hinaufgehen oder Emporsteigen; „hinaufsteigen“ gibt hier sowohl die Richtung als auch die Bewegung auf Stufen natürlich wieder.
- source_word: בְמַעֲלֹת
  choice: auf Stufen
  rationale: מַעֲלוֹת bezeichnet Stufen oder eine Treppe. Mit dem Verb „hinaufsteigen“ ist „auf Stufen“ im Deutschen idiomatisch und entspricht der instrumentalen beziehungsweise räumlichen Funktion der Präposition.
- source_word: מִזְבְּחִי
  choice: zu meinem Altar
  rationale: מִזְבֵּחַ mit dem Suffix der ersten Person Singular bedeutet „mein Altar“; die Präposition עַל bezeichnet hier das Ziel des Hinaufsteigens und wird natürlich mit „zu“ wiedergegeben.
- source_word: אֲשֶׁר לֹא
  choice: damit ... nicht
  rationale: Die Verbindung leitet hier nach dem Verbot einen Zweck- beziehungsweise Vermeidungssatz ein. „Damit ... nicht“ ist modernes, klares Deutsch und legt nicht unnötig fest, ob Zweck oder befürchtete Folge im Vordergrund steht.
- source_word: תִּגָּלֶה
  choice: entblößt wird
  rationale: Der Nifal von גלה bedeutet hier passiv „aufgedeckt“ oder „entblößt werden“. „Entblößt wird“ passt zum körperlichen Bezug und bleibt würdig.
- source_word: עֶרְוָתְךָ
  choice: deine Blöße
  rationale: עֶרְוָה bezeichnet die Nacktheit beziehungsweise den entblößten Intimbereich. „Blöße“ ist im Deutschen direkt genug, ohne den Ausdruck stärker als der Ausgangstext zu spezifizieren.
- source_word: עָלָיו
  choice: über ihm
  rationale: Das Pronomen bezieht sich auf den Altar. „Über ihm“ bewahrt die räumliche Beziehung von עַל und vermeidet die missverständliche Vorstellung, die Person befinde sich körperlich auf dem Altar.
theological_decisions:
- issue: Grund für das Verbot von Stufen am Altar
  choice: Der ausdrücklich genannte Schutz vor körperlicher Entblößung wird wiedergegeben, ohne eine weitergehende Symbolik einzutragen.
  alternative: Das Verbot als Symbol der Demut oder ausschließlich als Vorschrift zu priesterlichen Gewändern deuten.
  rationale: Der hebräische Text nennt die mögliche Entblößung als Grund. Weitere kultische oder symbolische Erklärungen sind Auslegung und gehören nicht in den Haupttext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt körperlich konkret, aber nicht derb. „Auch“ nimmt das einleitende וְ auf und verbindet das Verbot mit dem vorausgehenden Zusammenhang.
