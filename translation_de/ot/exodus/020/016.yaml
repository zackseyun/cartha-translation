lexical_decisions:
- source_word: לֹא
  choice: nicht
  rationale: Die Negationspartikel formuliert zusammen mit der Verbform das Verbot.
- source_word: תַעֲנֶה
  choice: sollst … aussagen
  rationale: 'ענה kann „antworten“ bedeuten, hat hier mit עֵד שָׁקֶר jedoch einen rechtlich-forensischen Sinn: als Zeuge aussagen.'
- source_word: בְרֵעֲךָ
  choice: gegen deinen Mitmenschen
  rationale: רֵעַ bezeichnet den Nächsten oder Mitmenschen; ב ist im forensischen Zusammenhang natürlich mit „gegen“ wiederzugeben. „Mitmensch“ ist im modernen Deutschen breit verständlich und vermeidet eine unnötige Beschränkung auf räumliche Nachbarschaft.
- source_word: עֵד
  choice: aussagen
  rationale: Das Substantiv „Zeuge“ wird zusammen mit dem Verb idiomatisch durch die deutsche Wendung „aussagen“ wiedergegeben; der Zeugen- und Gerichtskontext bleibt erhalten.
- source_word: שָׁקֶר
  choice: falsch
  rationale: שָׁקֶר bezeichnet Falschheit oder Täuschung; „falsch aussagen“ ist die natürliche moderne deutsche Rechtswendung.
