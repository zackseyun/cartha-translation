  text: וְ/אִם מִזְבַּ֤ח אֲבָנִים֙ תַּֽעֲשֶׂה לִּ֔/י לֹֽא תִבְנֶ֥ה אֶתְ/הֶ֖ן גָּזִ֑ית כִּ֧י חַרְבְּ/ךָ֛ הֵנַ֥פְתָּ עָלֶ֖י/הָ וַ/תְּחַֽלְלֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/025.yaml
  text: And if you make for me an altar of stones[a], you shall not build it of cut stones; for if you wield your sword on it[b], you will profane it.
translation:
  language: de
  text: Und wenn du mir einen Altar aus Steinen baust, sollst du sie nicht aus behauenen Steinen[a] bauen. Denn wenn du dein Schwert über einen von ihnen schwingst[b], entweihst du ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: zugerichtete Steine.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier „dein Schwert“. Gemeint sein kann eine Metallklinge, mit der die Steine bearbeitet werden.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Bewahrt sowohl die Verknüpfung mit der vorausgehenden Anweisung als auch die bedingende Formulierung.
- source_word: מִזְבַּח אֲבָנִים
  choice: einen Altar aus Steinen
  rationale: Gibt die hebräische Konstruktverbindung direkt und zugleich idiomatisch auf Deutsch wieder.
- source_word: תַּעֲשֶׂה לִּי
  choice: du mir … baust
  rationale: Im Zusammenhang mit einem Altar ist „bauen“ natürlich; „mir“ bewahrt die Dativbeziehung von לִי.
- source_word: לֹא תִבְנֶה אֶתְהֶן גָּזִית
  choice: darfst du dafür keine behauenen Steine verwenden
  rationale: Das feminine Pluralobjekt bezieht sich auf die Steine. Die Formulierung vermeidet eine im Deutschen unnatürliche Konstruktion und gibt das Verbot klar wieder.
- source_word: חַרְבְּךָ
  choice: dein Schwert
  rationale: Das hebräische Substantiv bedeutet ausdrücklich „Schwert“. Eine Verallgemeinerung zu „Werkzeug“ würde die konkrete Bildsprache des Ausgangstextes auflösen.
- source_word: הֵנַפְתָּ עָלֶיהָ
  choice: du dein Schwert über einen solchen Stein schwingst
  rationale: נוף im Hifil bezeichnet hier das Schwingen beziehungsweise Führen der Klinge über dem Stein. „Einen solchen Stein“ macht den Bezug des femininen Singularsuffixes im Deutschen verständlich.
- source_word: וַתְּחַלְלֶהָ
  choice: entweihst du ihn
  rationale: חלל bezeichnet hier die kultische Entweihung. Das Pronomen bezieht sich in der deutschen Formulierung auf den einzelnen Stein, entsprechend dem femininen Singularsuffix im Hebräischen.
theological_decisions:
- issue: Gegenstand der Entweihung
  choice: Der mit der Klinge bearbeitete Stein wird als entweiht bezeichnet.
  alternative: Der gesamte Altar wird durch die Bearbeitung seiner Steine entweiht.
  rationale: Die femininen Singularsuffixe in עָלֶיהָ und וַתְּחַלְלֶהָ passen grammatisch nicht zum maskulinen מִזְבֵּחַ („Altar“), sondern am ehesten zu einem als Einzelexemplar gedachten Stein beziehungsweise zum kollektiv verstandenen Steinmaterial. Die kultische Tragweite für den Altar bleibt aus dem Zusammenhang erkennbar, ohne die grammatische Spannung einzuebnen.
- issue: Grund des Verbots
  choice: Der Text stellt fest, dass die Bearbeitung mit dem Schwert entweiht, ohne den tieferen Grund zu erklären.
  alternative: Das Verbot richtet sich ausdrücklich gegen Gewalt, Prunk oder ein bestimmtes heidnisches Ritual.
  rationale: Solche Deutungen sind möglich, werden in diesem Vers aber nicht ausdrücklich genannt. Die Übersetzung beschränkt sich deshalb auf die kultische Aussage des Verbs חלל.
translation_notes:
  register: Moderne, klare und würdige Standardsprache. „Darfst du … keine“ gibt das rechtlich bindende Verbot natürlich wieder; „entweihen“ bewahrt den kultischen Bedeutungsgehalt. Die Wiederaufnahme als „einen solchen Stein“ löst den hebräischen Numeruswechsel verständlich auf, ohne den Altar selbst zum grammatischen Objekt der Entweihung zu machen.
