  text: לֹֽ֣א יִהְיֶֽה לְ/ךָ֛ אֱלֹהִ֥ים אֲחֵרִ֖ים עַל פָּנָֽ/יַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/003.yaml
  text: You shall have no other gods before me[a].
translation:
  language: de
  text: Du sollst keine anderen Götter vor mir haben[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »neben mir« oder »in meiner Gegenwart«. Die hebräische Wendung lautet wörtlich »vor meinem Angesicht«.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: keine
  rationale: Die Verneinung leitet das Verbot ein und wird im Deutschen natürlich mit »keine … haben« wiedergegeben.
- source_word: יִהְיֶה לְךָ
  choice: du sollst … haben
  rationale: Wörtlich bezeichnet die Konstruktion ein Sein für den Angesprochenen; idiomatisches Deutsch drückt das Besitz- beziehungsweise Zuordnungsverhältnis mit »haben« aus. Das Singularpronomen bewahrt die hebräische Anredeform.
- source_word: אֱלֹהִים
  choice: Götter
  rationale: Der Plural bezeichnet hier aufgrund der näheren Bestimmung »andere« rivalisierende Gottheiten; »Götter« ist die klare und kontextgemäße Wiedergabe.
- source_word: אֲחֵרִים
  choice: andere
  rationale: Das Adjektiv bedeutet »andere«; »fremde« würde den hebräischen Ausdruck unnötig verengen.
- source_word: עַל פָּנָי
  choice: vor mir
  rationale: Die Wendung lautet bildhaft »vor meinem Angesicht« und kann sowohl Gegenwart als auch Ausschließlichkeit ausdrücken. »Vor mir« bewahrt diese Mehrdeutigkeit besser als eine ausschließlich deutende Formulierung.
theological_decisions:
- issue: Bedeutung von עַל פָּנָי im ersten Gebot
  choice: vor mir
  alternative: neben mir; in meiner Gegenwart
  rationale: Die hebräische Wendung kann räumliche Gegenwart und im Bundeskontext ausschließliche Bindung bezeichnen. Der Haupttext hält diese Spannung offen; die Fußnote nennt die wichtigsten Deutungsmöglichkeiten.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. Die traditionelle Gebotsform »Du sollst« ist allgemein verständlich und gibt die verbindliche Verbotskraft angemessen wieder.
