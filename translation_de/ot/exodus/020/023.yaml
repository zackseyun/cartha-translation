base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/023.yaml
  text: You shall not make gods of silver alongside me[a], nor shall you make for yourselves gods of gold.
translation:
  language: de
  text: Ihr sollt neben mir keine Götter aus Silber machen[a], und Götter aus Gold sollt ihr euch nicht machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit mir“; möglich ist auch: „bei mir“. „Neben mir“ hebt das Verbot konkurrierender Götter hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲשׂוּן / תַעֲשׂוּ
  choice: machen
  rationale: Das Verb עשה bezeichnet hier das Herstellen kultischer Gegenstände. „Machen“ wahrt die direkte Form des Verbots, ohne eine bestimmte handwerkliche Technik vorauszusetzen.
- source_word: אִתִּי
  choice: neben mir
  rationale: Wörtlich bedeutet die Präposition „mit mir“. Im Zusammenhang bezeichnet sie die unzulässige Aufstellung oder Verehrung silberner Götter in Verbindung mit beziehungsweise neben JHWH. „Neben mir“ ist im Deutschen natürlich, bleibt aber interpretativ genug, um eine Fußnote zu erfordern.
- source_word: אֱלֹהֵי כֶסֶף
  choice: Götter aus Silber
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet Götter beziehungsweise Götterbilder aus Silber. „Aus Silber“ klingt im modernen Deutsch natürlicher als „Götter von Silber“ und macht das Material deutlich.
- source_word: וֵאלֹהֵי זָהָב
  choice: und Götter aus Gold
  rationale: Die Formulierung bewahrt die parallele Nennung der beiden Materialien; das wiederholte Verbot wird im zweiten Satzteil ausdrücklich wiedergegeben.
- source_word: לָכֶם
  choice: euch
  rationale: Das Dativpronomen kennzeichnet die Herstellung für den eigenen Gebrauch oder Besitz. Das reflexiv gebrauchte „euch“ gibt dies idiomatisch wieder.
- source_word: לֹא ... לֹא
  choice: Ihr sollt nicht … und … sollt ihr nicht
  rationale: Die wiederholte Verneinung wird in beiden parallelen Verboten bewahrt und trägt dem rechtlich-bündischen Sprachton Rechnung.
theological_decisions:
- issue: Bedeutung von אִתִּי im Verbot der silbernen Götter
  choice: neben mir
  alternative: mit mir / bei mir
  rationale: Der hebräische Ausdruck lautet wörtlich „mit mir“, doch im Kontext ist das Nebeneinander konkurrierender Kultbilder gemeint. Die Übersetzung „neben mir“ gibt diesen Zusammenhang natürlich wieder; die Fußnote bewahrt die wörtliche Alternative und verhindert, dass die genuine Bedeutungsbreite verdeckt wird.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit dem für Bundesbestimmungen passenden „sollt“. Die Pluralanrede wird durch „ihr/euch“ deutlich. Die Wiederholung des Verbots und die materielle Bestimmung „aus Silber/Gold“ bleiben erhalten.
