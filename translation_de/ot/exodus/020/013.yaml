    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: nicht
  rationale: Die hebräische Verneinungspartikel bildet zusammen mit der Verbform ein kategorisches Verbot. Im Deutschen wird dies idiomatisch mit „Du sollst nicht …“ wiedergegeben.
- source_word: תִּרְצָח
  choice: morden
  rationale: Das Verb רצח bezeichnet gewöhnlich widerrechtliches Töten beziehungsweise Mord und nicht unterschiedslos jede Tötung. „Morden“ gibt die spezifische Bedeutung knapp und direkt wieder; „töten“ wäre weiter gefasst.
theological_decisions:
- issue: Reichweite des Verbots im Dekalog
  choice: רצח mit „morden“ wiedergeben
  alternative: Du sollst nicht töten.
  rationale: Die engere Wiedergabe wahrt den üblichen Bedeutungsumfang des hebräischen Verbs in diesem Rechtskontext. Sie vermeidet, dem Gebot ein ausnahmsloses Verbot jeder Tötung zuzuschreiben, ohne seine moralische Kraft abzuschwächen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Gebotsstil. Die traditionelle Konstruktion „Du sollst nicht“ ist natürlich und entspricht der kategorischen Form des hebräischen Verbots.
