lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Gibt die narrative Fortführung durch וַ־ und das feierliche, aber im modernen Deutsch natürliche „sprach“ wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im Kontext bezeichnet אֱלֹהִים den Gott Israels und wird idiomatisch im Singular wiedergegeben.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: alle diese Worte
  rationale: Bewahrt die traditionelle und sachlich passende Wiedergabe von דְּבָרִים als „Worte“; כָּל und הָאֵלֶּה werden vollständig abgebildet.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Einleitungsformel kündigt die folgende direkte Rede an; im natürlichen modernen Deutsch erfüllt der Doppelpunkt diese Funktion ohne das schwerfällige „indem er sagte“.
