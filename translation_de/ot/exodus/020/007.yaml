base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/007.yaml
  text: You shall not bear the name of Yahweh your God falsely[a], for Yahweh will not leave unpunished the one who bears his name falsely.
translation:
  language: de
  text: Du sollst den Namen Jahwes, deines Gottes, nicht zu Unrecht gebrauchen[a]; denn Jahwe wird den nicht ungestraft lassen, der seinen Namen zu Unrecht gebraucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Du sollst den Namen des HERRN, deines Gottes, nicht missbrauchen.“ Das Hebräische sagt wörtlicher „den Namen … zu Nichtigem tragen/erheben“. Die Wendung kann falsche Eide, leere Anrufung oder eine unrechtmäßige Berufung auf Gottes Namen einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: gebrauchen / gebraucht
  rationale: נשא bedeutet wörtlich „heben, tragen“. In Verbindung mit dem Namen und לַשָּׁוְא gibt „gebrauchen“ im Deutschen die konkrete Handlung verständlich wieder, ohne sie ausschließlich auf das Aussprechen oder auf Fluchen zu beschränken. Die Wiederholung desselben Verbs in beiden Satzhälften bleibt erhalten; die wörtlichere Möglichkeit „tragen“ wird in der Fußnote genannt.
- source_word: שֵׁם
  choice: Name
  rationale: Die direkte Entsprechung bewahrt den Bezug auf Jahwes geoffenbarte Identität, seinen Ruf und seinen Bundesanspruch, nicht lediglich auf die Lautgestalt des Namens.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: deines Gottes
  rationale: Der Singular der direkten Bundesanrede bleibt in der Formulierung „Jahwes, deines Gottes“ erhalten.
- source_word: לַשָּׁוְא
  choice: für Falsches
  rationale: שָׁוְא umfasst Leere, Nichtigkeit, Falschheit und Wertlosigkeit. „Für Falsches“ ist im heutigen Deutschen verständlich, bewahrt den Bezug zu unwahren oder unrechtmäßigen Zwecken und ist weiter als eine Beschränkung auf gedankenloses Aussprechen.
- source_word: כִּי
  choice: denn
  rationale: „Denn“ leitet natürlich und prägnant die Begründung des Verbots ein.
- source_word: יְנַקֶּה (נקה)
  choice: wird … nicht ungestraft lassen
  rationale: Die Form bezeichnet hier, jemanden nicht von Schuld beziehungsweise Strafe freizusprechen. Die gewählte Wendung bringt den gerichtlichen Ernst in geläufigem modernem Deutsch zum Ausdruck.
- source_word: אֲשֶׁר
  choice: der
  rationale: Das substantivisch gebrauchte Relativpronomen bezeichnet jeden, auf den die folgende Beschreibung zutrifft.
- source_word: שְׁמוֹ
  choice: seinen Namen
  rationale: Der Rückbezug auf Jahwe wird ausdrücklich bewahrt.
theological_decisions:
- issue: Reichweite des Verbots hinsichtlich des göttlichen Namens
  choice: Ein umfassendes Verbot, Jahwes Namen für Falsches, Leeres oder Unrechtes zu gebrauchen
  alternative: Eine ausschließliche Beschränkung auf Meineide oder auf lästerliches beziehungsweise gedankenloses Aussprechen
  rationale: Die Verbindung von נשא („tragen, erheben“) mit שֵׁם („Name“) und שָׁוְא („Nichtigkeit, Falschheit“) lässt falsche Eide, leere Anrufung und unrechtmäßige Berufung auf oder Vertretung von Jahwes Namen zu. Der Haupttext legt das Verbot daher nicht auf bloße Kraftausdrücke fest.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen des hebräischen Textes, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdevolle Standardsprache in direkter Anrede. „Für Falsches gebrauchen“ vermeidet die heute leicht verengte traditionelle Formel „den Namen missbrauchen“, während die Fußnote die konkrete hebräische Bildsprache und deren Bedeutungsbreite offenlegt.
