review_pass:
  verdict: revise
  source_fidelity: Die Stellung von לַאֲלָפִים verlangt, dass „Tausenden“ unmittelbar als Empfänger von Gottes חֶסֶד steht. Die Fassung „… meine Gebote halten – bis in die Tausende“ verschiebt die Wendung ans Satzende und kann sie fälschlich als zeitliche oder reichweitenbezogene Ergänzung zum Halten der Gebote lesen. Die Revision gibt die beiden Dativgruppen des Hebräischen unmittelbar und ohne Ergänzung von „Generationen“ wieder.
  naturalness: „Tausenden beständige Liebe erweist, die mich lieben und meine Gebote halten“ ist modernes, verständliches Standarddeutsch. Die Relativsatzstellung macht deutlich, dass die Liebenden und Gebotehaltenden die bezeichneten Tausenden näher bestimmen.
  terminology: '„beständige Liebe“ gibt חֶסֶד als verlässliche, dauerhafte Liebe angemessen wieder; „Gebote halten“ ist im Dekalog-Kontext idiomatisch. Die Fußnote wird an die englische Auditspur angepasst: Dort lautet die Alternative „a thousand generations“, nicht „thousands of generations“.'
  issues:
  - severity: medium
    issue: „bis in die Tausende“ steht an einer syntaktisch missverständlichen Stelle.
    rationale: לַאֲלָפִים ist im Hebräischen die dem Verb עֹשֶׂה zugeordnete Dativgruppe („Tausenden … erweisen“). Am Ende des deutschen Satzes kann die Formulierung als modale oder zeitliche Reichweitenangabe zu „Gebote halten“ beziehungsweise „lieben“ verstanden werden.
  - severity: low
    issue: Die Fußnote nennt zusätzlich „Tausenden von Generationen“.
    rationale: Diese Alternative geht über die englische Auditspur hinaus, die lediglich „to a thousand generations“ als alternative Deutung vermerkt. Die Fußnote soll diese Deutung erläutern, ohne eine weitere, im Ausgangstext nicht ausdrücklich enthaltene Formulierung zu etablieren.
  revised_text: sondern Tausenden beständige Liebe erweist, die mich lieben und meine Gebote halten.[a]
