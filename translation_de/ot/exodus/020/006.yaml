  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: de
  text: sondern Tausenden beständige Liebe erweist, die mich lieben und meine Gebote halten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zu tausend Generationen“ (vgl. 5. Mose 5,10). Im Hebräischen steht hier einfach „Tausenden“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: sondern … erweist
  rationale: Das Partizip setzt die Aussage des vorigen Verses fort. Im Kontext markiert וְ den Gegensatz zwischen begrenzter Heimsuchung und weitreichender Liebe; „sondern“ gibt diesen Gegensatz im Deutschen natürlich wieder.
- source_word: חֶסֶד
  choice: beständige Liebe
  rationale: חֶסֶד bezeichnet verlässliche, loyale Güte und Liebe. „Beständige Liebe“ ist verständlich und bewahrt sowohl die Zuwendung als auch deren dauerhafte Treue.
- source_word: לַאֲלָפִים
  choice: bis in die Tausende
  rationale: Im Hebräischen steht lediglich der substantivierte Plural „den Tausenden“, ohne ein ausdrückliches Wort für „Generationen“. Die gewählte Form lässt den Bezug bewusst offen und bringt zugleich die große Reichweite zum Ausdruck.
- source_word: לְאֹהֲבַי
  choice: denen …, die mich lieben
  rationale: Das Partizip mit Suffix wird im Deutschen natürlich als Relativsatz wiedergegeben und bezeichnet Menschen, deren Haltung von Liebe zu Gott geprägt ist.
- source_word: וּלְשֹׁמְרֵי
  choice: und … halten
  rationale: שׁמר bedeutet unter anderem „bewahren, beachten, halten“. Mit Geboten als Objekt ist „Gebote halten“ die idiomatische deutsche Entsprechung.
- source_word: מִצְוֺתָי
  choice: meine Gebote
  rationale: „Gebote“ bewahrt den rechtlich-bundeshaften Ton des Dekalogs und ist im modernen Standarddeutsch geläufig.
theological_decisions:
- issue: Bezugsgröße und Reichweite von לַאֲלָפִים
  choice: bis in die Tausende
  alternative: bis in die tausendste Generation / Tausenden von Generationen
  rationale: Exodus 20,6 nennt ausdrücklich keine „Generationen“. Der Haupttext ergänzt dieses Substantiv daher nicht, während die Fußnote die durch den Gegensatz zu Vers 5 und die Parallele in Deuteronomium 5,10 nahegelegte generationenbezogene Deutung festhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bindet den Vers an den vorausgehenden Kontrast an. „Bis in die Tausende“ vermeidet eine im Hebräischen nicht ausdrücklich genannte Bezugsgröße; die daraus entstehende echte Mehrdeutigkeit wird durch die Fußnote erläutert.
