source:
  edition: WLC
  text: לֹֽא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָֽנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָבֹ֧ת עַל בָּנִ֛ים עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/005.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, on the third and on the fourth generations of those who hate me[d][c][b],
translation:
  language: de
  text: Du sollst dich vor ihnen nicht niederwerfen[a] und ihnen nicht dienen[b]. Denn ich, Jahwe, dein Gott, bin ein eifersüchtiger Gott, der die Schuld der Väter an den Kindern heimsucht[c], bis in die dritte und vierte Generation hinein bei denen, die mich hassen[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich vor ihnen nicht verbeugen“; das hebräische Verb bezeichnet das ehrerbietige Niederwerfen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie nicht anbeten“; „dienen“ kann hier den kultischen Dienst für Götzen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich nach der hebräischen Wendung: „die Schuld der Väter an den Kindern heimsucht“. Zur persönlichen Verantwortlichkeit siehe auch 5. Mose 24,16 und Hesekiel 18.'
    reason: cross_reference
  - marker: d
    text: 'Die hebräische Schlussformel kann auch enger angeschlossen werden: „bis in die dritte und vierte Generation derer, die mich hassen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: dich vor ihnen niederwerfen
  rationale: Das Verb bezeichnet konkret das ehrerbietige Niederwerfen. Die Wiedergabe bewahrt diese körperliche Handlung und zieht sie nicht vorschnell mit dem folgenden kultischen Dienen zu dem allgemeineren Begriff „anbeten“ zusammen.
- source_word: תָעָבְדֵם
  choice: ihnen dienen
  rationale: עבד bedeutet gewöhnlich „dienen“ und bezeichnet hier im Götzenkontext kultischen Dienst. „Dienen“ erhält die lexikalische Unterscheidung zum vorhergehenden Niederwerfen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֵל קַנָּא
  choice: ein eifersüchtiger Gott
  rationale: קַנָּא bezeichnet hier Jahwes ausschließlichen Bundesanspruch und seine Unverträglichkeit mit der Verehrung anderer Götter. „Eifersüchtig“ bewahrt diese relationale Spannung besser als das schwächere „eifrig“.
- source_word: פֹּקֵד
  choice: heimsucht
  rationale: Das Partizip beschreibt Gottes wirksames Zuwenden in prüfender beziehungsweise richtender Absicht. „Heimsucht“ bewahrt die traditionelle hebräische Wendung, ohne sie eindeutig auf eine einzige Art der Bestrafung festzulegen.
- source_word: עֲוֺן
  choice: Schuld
  rationale: עָוֹן kann Vergehen, Schuld und Schuldfolge bezeichnen. Das deutsche „Schuld“ bewahrt einen wesentlichen Teil dieser Bedeutungsbreite und ist gegenwärtig verständlicher als „Missetat“.
- source_word: אָבֹת
  choice: Väter
  rationale: Der hebräische Ausdruck ist ausdrücklich maskulin und gehört zu einer feststehenden generationenübergreifenden Warnformel; deshalb wird er nicht zu „Eltern“ verallgemeinert.
- source_word: בָּנִים
  choice: Kinder
  rationale: בָּנִים kann in einem generationenübergreifenden Zusammenhang Nachkommen bezeichnen. „Kinder“ gibt den Sinn natürlich wieder, ohne ihn auf männliche Nachkommen zu beschränken.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: an der dritten und an der vierten Generation
  rationale: Die Ordinalzahlen stehen elliptisch für Generationen. Das ergänzte „Generation“ macht den Sinn verständlich; die Wiederholung von „an“ bildet Rhythmus und Struktur des Hebräischen nach.
- source_word: לְשֹׂנְאָי
  choice: derer, die mich hassen
  rationale: Die Formulierung schließt die Warnung an diejenigen beziehungsweise deren Linie an, die Gott hassen, und bewahrt ihre starke relationale Aussage.
theological_decisions:
- issue: Wiedergabe der göttlichen Eifersucht
  choice: ein eifersüchtiger Gott
  alternative: ein leidenschaftlich eifernder Gott
  rationale: Im Zusammenhang des Bilderverbots geht es um Gottes rechtmäßigen ausschließlichen Anspruch. Die gewählte Formulierung mildert die theologische Spannung nicht ab, überträgt aber auch keine menschlich-sündhafte Motivation auf den Begriff.
- issue: Generationübergreifendes Gericht
  choice: der die Schuld der Väter an den Kindern heimsucht, an der dritten und an der vierten Generation derer, die mich hassen
  alternative: der die Kinder für die Schuld der Väter bis in die dritte und vierte Generation bestraft
  rationale: Die gewählte Fassung bewahrt die hebräische Ausdrucksweise und legt weder den genauen Mechanismus noch das Verhältnis von ererbten Folgen und persönlicher Verantwortlichkeit stärker fest als der Ausgangstext. Die Schlusswendung „derer, die mich hassen“ bleibt ausdrücklich erhalten.
- issue: Bezug der dritten und vierten Generation
  choice: an der dritten und an der vierten Generation derer, die mich hassen
  alternative: bis zur dritten und vierten Generation bei denen, die mich hassen
  rationale: Die Syntax kann als Aufzählung der betroffenen Generationen oder idiomatisch als zeitliche Reichweite verstanden werden. Der Haupttext folgt eng der wiederholten hebräischen Präposition; die Fußnote nennt die geläufigere alternative Auffassung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in direkter Anrede. „Niederwerfen“ und „dienen“ sind konkret und allgemein verständlich. „Heimsuchen“ ist bewusst bibelsprachlich, aber im Deutschen noch verständlich; es erhält die Mehrdeutigkeit der hebräischen Gerichtsformel. Die Wiederholung „an der dritten und an der vierten“ bildet die markierte Struktur des Ausgangstextes ab.
