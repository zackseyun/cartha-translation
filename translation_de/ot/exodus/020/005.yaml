  naturalness: '„An der dritten und an der vierten Generation“ ist im modernen Standarddeutsch syntaktisch und semantisch nicht idiomatisch: Man kann Schuld an Kindern heimsuchen, aber nicht sinnvoll „an einer Generation“ in dieser Anschlussform. „Bis in die dritte und vierte Generation hinein“ ist klar, natürlich und gibt die Reichweite der hebräischen Formel wieder.'
  terminology: „Niederwerfen“, „dienen“, „Jahwe“, „eifersüchtiger Gott“, „Schuld“, „Väter“ und „Kinder“ sind registergerecht und terminologisch konsistent. „Eifersüchtig“ bewahrt den im Kontext exklusiver Verehrung stehenden Ausdruck קַנָּא, ohne ihn durch eine glättende Deutung zu ersetzen.
