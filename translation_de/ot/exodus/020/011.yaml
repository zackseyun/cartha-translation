base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/011.yaml
  text: For in six days Yahweh made the heavens and the earth[a], the sea, and all that is in them, and he rested on the seventh day. Therefore Yahweh blessed the Sabbath day and made it holy.
translation:
  language: de
  text: Denn in sechs Tagen machte Jahwe den Himmel und die Erde, das Meer und alles, was in ihnen ist; und am siebten Tag ruhte er[a]. Darum segnete Jahwe den Sabbattag und heiligte ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Er hörte auf. Das hebräische Verb kann sowohl Ruhen als auch das Aufhören mit der Arbeit betonen.'
    reason: Lexikalische Alternative zu וַיָּנַח; die Bedeutungsbreite soll nicht stillschweigend verengt werden.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das vorausgehende Sabbatgebot ein und wahrt den argumentativen Zusammenhang.
- source_word: שֵׁשֶׁת יָמִים
  choice: in sechs Tagen
  rationale: Gibt die Zeitspanne knapp, idiomatisch und ohne zusätzliche Deutung wieder.
- source_word: עָשָׂה
  choice: machte
  rationale: Bewahrt die breite Bedeutung von עשה; „schuf“ wäre stilistisch möglich, würde aber einen spezifischeren hebräischen Schöpfungsbegriff nahelegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als im Deutschen übliche Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: den Himmel und die Erde
  rationale: Die feste deutsche Wendung gibt das kosmologische Begriffspaar natürlich wieder; der formal plurale hebräische Ausdruck שׁמים wird im Deutschen idiomatisch mit „Himmel“ wiedergegeben.
- source_word: הַיָּם
  choice: das Meer
  rationale: Entspricht dem Singular des hebräischen Textes und bezeichnet neben Himmel und Erde einen weiteren Bereich der Schöpfung.
- source_word: כָּל אֲשֶׁר בָּם
  choice: alles, was in ihnen ist
  rationale: Bewahrt den umfassenden Relativsatz und bezieht das Pronomen auf die zuvor genannten Schöpfungsbereiche.
- source_word: וַיָּנַח
  choice: ruhte er
  rationale: Gibt נוח im Zusammenhang mit dem Sabbat natürlich wieder, ohne Erschöpfung zu behaupten; die ebenfalls mögliche Nuance des Aufhörens wird in einer Fußnote erhalten.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: am siebten Tag
  rationale: Ist die idiomatische deutsche Wiedergabe der temporalen Angabe.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Markiert klar die aus dem Schöpfungsmuster gezogene Folgerung.
- source_word: בֵּרַךְ
  choice: segnete
  rationale: Entspricht der üblichen Bedeutung von ברך und wahrt die Aussage, dass Gott dem Tag Segen verlieh.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: und heiligte ihn
  rationale: Gibt sowohl das Heiligen beziehungsweise Aussondern des Tages als auch den maskulinen Objektbezug auf den Sabbattag präzise wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen und ist die geläufige deutsche wissenschaftliche Transkription.
- issue: Gottes Handeln am siebten Tag
  choice: ruhte er
  alternative: hörte er auf
  rationale: Das Verb נוח bezeichnet hier ein Ruhen oder Zur-Ruhe-Kommen nach dem vollendeten Werk, kann aber auch den Aspekt des Aufhörens anklingen lassen. Die Hauptübersetzung wahrt den Sabbatbezug; die Fußnote erhält die lexikalische Offenheit, ohne göttliche Ermüdung in den Text einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt eng am hebräischen Begründungs- und Folgerungsaufbau. Das Semikolon gliedert die lange Aufzählung, ohne den Zusammenhang zu zerreißen.
