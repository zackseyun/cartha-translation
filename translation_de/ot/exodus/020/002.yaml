source:
  edition: WLC
  text: אָֽנֹכִ֖י יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/002.yaml
  text: I am Yahweh your God[a], who brought you out from the land of Egypt[b], from the house of servants.
translation:
  language: de
  text: Ich bin Jahwe, dein Gott[a], der dich aus dem Land Ägypten, aus dem Sklavenhaus, herausgeführt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Ich bin
  rationale: Das selbstständige Pronomen ist betont; in der verblosen deutschen Nominalklausel wird die Kopula natürlich ergänzt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Trotz der formal pluralischen Gestalt bezeichnet אֱלֹהִים hier mit singularischem Bezug Israels Gott; das Suffix ist maskulin Singular.
- source_word: אֲשֶׁר
  choice: der
  rationale: Das Relativpronomen bezieht sich auf den persönlichen Sprecher und leitet den beschreibenden Relativsatz ein.
- source_word: הוֹצֵאתִיךָ
  choice: dich … herausgeführt hat
  rationale: Der Hifil von יצא bedeutet, jemanden herauszubringen beziehungsweise herauszuführen. Die deutsche Verbklammer erlaubt eine natürliche Wiedergabe beider parallelen Herkunftsangaben.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Die Formulierung bewahrt die ausdrückliche geografische Bezeichnung und gibt מן als Herkunftsangabe mit „aus“ wieder.
- source_word: מִבֵּית עֲבָדִים
  choice: aus dem Sklavenhaus
  rationale: Das geläufige deutsche Kompositum bewahrt das konkrete Bild von בֵּית und den gebundenen Status von עֲבָדִים, ohne die Wendung abstrakt zu „Haus der Sklaverei“ aufzulösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ wahrt den persönlichen Gottesnamen; die traditionelle deutsche Ersatzlesung wird in der Fußnote genannt.
- issue: Wiedergabe von עֲבָדִים im Kontext der ägyptischen Zwangsherrschaft
  choice: Sklaven
  alternative: Knechte
  rationale: Der Kontext hebt Unfreiheit und Zwangsarbeit hervor; „Sklaven“ bildet diesen Status im heutigen Deutsch klarer ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede bleibt entsprechend dem hebräischen Singular bei „dein/dich“. Die parallelen Herkunftsangaben werden durch zweimaliges „aus“ erhalten; „Sklavenhaus“ ist idiomatisch und zugleich bildnah.
