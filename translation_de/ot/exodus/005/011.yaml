lexical_decisions:
- source_word: אַתֶּם
  choice: Ihr selbst
  rationale: Das selbstständige Personalpronomen steht betont vor den Imperativen. „Ihr selbst“ bewahrt diese Hervorhebung.
- source_word: לְכוּ
  choice: geht
  rationale: Der Qal-Imperativ Plural von הלך wird natürlich und unmittelbar mit „geht“ wiedergegeben.
- source_word: קְחוּ לָכֶם
  choice: holt euch
  rationale: Die Verbindung bezeichnet hier das eigenständige Beschaffen des Strohs. „Holt euch“ gibt Verb und reflexiven Dativ idiomatisch wieder.
- source_word: תֶּבֶן
  choice: Stroh
  rationale: Im Zusammenhang der Ziegelherstellung bezeichnet תֶּבֶן das dafür verwendete Stroh.
- source_word: מֵאֲשֶׁר תִּמְצָאוּ
  choice: wo immer ihr es findet
  rationale: Die Formulierung lässt die Bezugsquelle offen. Die Übersetzung bleibt nahe am Wortlaut, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „könnt“ einzufügen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet die Anweisung mit der unverändert bestehenden Arbeitsforderung. „Denn“ bewahrt den kausalen Anschluss; der harte Gegensatz ergibt sich aus dem Zusammenhang.
- source_word: אֵין נִגְרָע
  choice: wird nichts abgezogen
  rationale: Das passive Partizip von גרע mit אֵין bezeichnet hier, dass keine Verringerung erfolgt beziehungsweise zugelassen wird. Im Deutschen passt das Präsens Passiv mit futurischer Geltung zur Anordnung.
- source_word: מֵעֲבֹדַתְכֶם דָּבָר
  choice: von eurer Arbeitsleistung wird nichts
  rationale: עֲבֹדָה meint die auferlegte Arbeit beziehungsweise Arbeitsmenge; „Arbeitsleistung“ macht verständlich, dass die Forderung nicht herabgesetzt wird. דָּבָר wird in der negierten Wendung idiomatisch als „nichts“ wiedergegeben.
