  yaml_path: translation/ot/exodus/005/007.yaml
  text: You shall no longer give straw to the people for making bricks as before[a]; let them go and gather straw for themselves.
translation:
  language: de
  text: Ihr sollt dem Volk von jetzt an kein Stroh mehr zum Ziegelmachen geben wie bisher[a]. Sie sollen gehen und sich Stroh sammeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie gestern und vorgestern“; eine feste Wendung mit der Bedeutung „wie bisher“ oder „wie früher“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאסִפוּן
  choice: von jetzt an kein … mehr
  rationale: Die verneinte Hifil-Form von יסף bezeichnet hier das Einstellen der bisherigen Praxis. Die deutsche Wendung gibt diesen Fortsetzungs- bzw. Beendigungsaspekt natürlich wieder.
- source_word: לָתֵת
  choice: geben
  rationale: נתן bedeutet gewöhnlich „geben“; die schlichte Wiedergabe bleibt nah am Hebräischen und ist im Zusammenhang klar.
- source_word: תֶּבֶן
  choice: Stroh
  rationale: Dies ist die übliche Bezeichnung für das Pflanzenmaterial, das bei der Ziegelherstellung verwendet wurde.
- source_word: לָעָם
  choice: dem Volk
  rationale: עם bedeutet wörtlich „Volk“. Obwohl hier die israelitischen Zwangsarbeiter gemeint sind, wird der Ausdruck nicht unnötig eingeengt.
- source_word: לִלְבֹּן הַלְּבֵנִים
  choice: zum Ziegelmachen
  rationale: Infinitiv und Objekt drücken den Zweck aus. „Zum Ziegelmachen“ ist knapp, verständlich und bildet die verwandten hebräischen Wörter לבן und לבנים angemessen ab.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: wie bisher
  rationale: Die wörtlich auf frühere Tage verweisende feste Wendung bedeutet idiomatisch „wie früher“ oder „wie bisher“.
- source_word: הֵם יֵלְכוּ
  choice: Sie sollen selbst losgehen
  rationale: Das selbstständige Pronomen hebt die Betroffenen hervor; der Imperfekt hat im Befehlszusammenhang auffordernde bzw. verpflichtende Kraft. „selbst“ stellt zudem den Gegensatz zur bisherigen Bereitstellung des Strohs heraus.
- source_word: וְקֹשְׁשׁוּ
  choice: und … sammeln
  rationale: קשש bezeichnet das Auflesen oder Zusammentragen verstreuten Materials. „sammeln“ ist hier die klare, allgemeine Entsprechung.
- source_word: לָהֶם
  choice: sich
  rationale: Der Dativ des Pronomens zeigt an, dass sie das Stroh für sich selbst beschaffen sollen; der deutsche reflexive Dativ gibt dies natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, standarddeutsches und würdiges Befehlsregister. „Ihr sollt“ richtet den Befehl deutlich an die Aufseher; der anschließende Satz wahrt den Wechsel zur dritten Person. Die idiomatische Zeitangabe steht im Text, während die wörtliche Form in der Fußnote erhalten bleibt.
