base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/017.yaml
  text: But he said[a], “You are idle, idle! That is why you say, ‘Let us go and sacrifice to Yahweh.’”
translation:
  language: de
  text: 'Doch er sagte: »Faul seid ihr, faul! Darum sagt ihr: ›Lasst uns gehen und Jahwe Opfer darbringen.‹«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch er sagte
  rationale: Das narrative וַ leitet hier die ablehnende Antwort des Pharaos ein; »doch« gibt den kontextuellen Gegensatz natürlich wieder.
- source_word: נִרְפִּים אַתֶּם נִרְפִּים
  choice: Faul seid ihr, faul!
  rationale: »Faul« trifft den vorwurfsvollen Sinn von נִרְפִּים im Kontext. Die Wiederholung und die vorangestellte Prädikativform bewahren Nachdruck und Rhythmus des Hebräischen.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung bezeichnet die von Pharao behauptete Folgerung und wird im Deutschen knapp und idiomatisch wiedergegeben.
- source_word: אֹמְרִים
  choice: sagt ihr
  rationale: Das Partizip hat in der direkten Rede präsentische finite Funktion.
- source_word: נֵלְכָה
  choice: Wir wollen gehen
  rationale: Die Kohortativform drückt einen gemeinsamen Entschluss oder Vorschlag aus; »wir wollen« wahrt diesen modalen Gehalt.
- source_word: נִזְבְּחָה לַיהוָה
  choice: und Jahwe Opfer darbringen
  rationale: Auch נִזְבְּחָה ist kohortativ und mit נֵלְכָה verbunden. »Opfer darbringen« bezeichnet den kultischen Vorgang im Deutschen natürlich; לַ kennzeichnet Jahwe als Empfänger.
- source_word: יהוה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift »Jahwe« macht den Eigennamen im Ausgangstext sichtbar, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die scharfe Anklage wird durch Wiederholung und markierte Wortstellung bewahrt; die zitierte Forderung bleibt knapp und mündlich.
