  yaml_path: translation/ot/exodus/005/004.yaml
  text: But the king of Egypt said to them[a], “Why, Moses and Aaron[b], are you causing the people to neglect their work? Go to your burdens.”
translation:
  language: de
  text: 'Doch der König von Ägypten sagte zu ihnen: „Warum, Mose und Aaron, haltet ihr das Volk von seiner Arbeit ab?[a] Geht an eure Lasten!“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lenkt ihr das Volk von seiner Arbeit ab?“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Geht an eure Zwangsarbeit!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch ... sagte
  rationale: Das Waw mit Imperfekt führt die Erzählung fort; „Doch“ gibt zugleich den ablehnenden Gegensatz zur vorangehenden Bitte natürlich wieder.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: der König von Ägypten
  rationale: Natürliche und genaue Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: לָמָּה
  choice: Warum
  rationale: Bewahrt die direkte Frage schlicht und idiomatisch.
- source_word: תַּפְרִיעוּ
  choice: haltet ... ab
  rationale: Das Hifil von פרע bezeichnet hier das Veranlassen einer Unterbrechung beziehungsweise das Abhalten von der auferlegten Arbeit. Die Formulierung wahrt den kausativen Sinn und den vorwurfsvollen Ton.
- source_word: הָעָם
  choice: das Volk
  rationale: Gibt die kollektive Bezeichnung wieder, ohne sie kontextuell auf „Arbeiter“ zu verengen.
- source_word: מִמַּעֲשָׂיו
  choice: von seiner Arbeit
  rationale: Der Singular des Suffixes stimmt mit dem Kollektivum „Volk“ überein und lässt sich im Deutschen natürlich im Singular wiedergeben.
- source_word: לְכוּ
  choice: Geht wieder
  rationale: Der Imperativ wird direkt wiedergegeben; „wieder“ macht im Deutschen die kontextuell gemeinte Rückkehr zur auferlegten Arbeit deutlich, ohne den Befehl abzuschwächen.
- source_word: לְסִבְלֹתֵיכֶם
  choice: an eure Lastarbeit
  rationale: „Lastarbeit“ bewahrt sowohl den konkreten Lastcharakter von סבלות als auch den Zusammenhang bedrückender Arbeitsverpflichtung. Die Alternative „Zwangsarbeit“ macht den Zwang deutlicher, ist aber interpretativ expliziter.
