translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lastarbeit“ ist verständlich, hält die Bildlichkeit des hebräischen Ausdrucks fest und vermeidet eine unnötig konfessionelle oder interpretative Zuspitzung.
