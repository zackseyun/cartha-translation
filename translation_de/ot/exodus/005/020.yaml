  text: וַֽ/יִּפְגְּעוּ֙ אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֔ן נִצָּבִ֖ים לִ/קְרָאתָ֑/ם בְּ/צֵאתָ֖/ם מֵ/אֵ֥ת פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/020.yaml
  text: They met Moses and Aaron[a], who were standing to meet them when they came out from Pharaoh.
translation:
  language: de
  text: Als sie vom Pharao herauskamen, trafen sie Mose und Aaron[a], die dort standen, um ihnen zu begegnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „begegneten sie Mose und Aaron“; das Verb kann in manchen Zusammenhängen auch eine konfrontative Begegnung bezeichnen, verlangt diese Bedeutung hier aber nicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגְּעוּ
  choice: trafen sie auf
  rationale: פגע bezeichnet hier ein Treffen oder Begegnen. „Trafen sie auf“ ist im Deutschen natürlich und lässt eine mögliche Spannung offen, ohne bereits eine feindselige Konfrontation festzuschreiben.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Mose und Aaron
  rationale: Die direkten Objektmarker werden im Deutschen nicht wiedergegeben; die Namen folgen ihrer geläufigen deutschen biblischen Form.
- source_word: נִצָּבִים
  choice: die dort standen
  rationale: Das Partizip bezeichnet ein andauerndes Stehen beziehungsweise ein eingenommenes Stehen. „Dort standen“ gibt die Szene idiomatisch wieder.
- source_word: לִקְרָאתָם
  choice: um sie zu erwarten
  rationale: לקראת beschreibt hier die auf die Herankommenden ausgerichtete Position von Mose und Aaron. „Um sie zu erwarten“ vermeidet im Deutschen die unschöne Wiederholung von „treffen“ und drückt die beabsichtigte Begegnung aus, ohne Feindseligkeit einzutragen.
- source_word: בְּצֵאתָם
  choice: als sie … herauskamen
  rationale: Der Infinitiv mit בְּ bezeichnet den zeitlichen Umstand. Die Voranstellung des Nebensatzes ist im modernen Deutschen klar und natürlich.
- source_word: מֵאֵת פַּרְעֹה
  choice: vom Pharao
  rationale: מֵאֵת bezeichnet die Bewegung weg von einer Person beziehungsweise aus deren Gegenwart. „Vom Pharao“ ist knapp und idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Satzbau wurde gegenüber der hebräischen Reihenfolge leicht umgestellt, damit die Pronomenbezüge klar bleiben. Die mögliche Spannung der Begegnung wird in der Fußnote bewahrt, aber nicht in den Haupttext hineingelesen.
