translation:
  language: de
  text: Die Arbeit soll schwer auf den Männern lasten, damit sie daran arbeiten und nicht auf Worte der Lüge achten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf falsche Worte hören“ beziehungsweise „trügerischen Worten Beachtung schenken“. Das hebräische Verb kann „sich zuwenden“, „beachten“ oder „darauf hören“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְבַּד
  choice: soll schwer ... lasten
  rationale: Das Qal-Imperfekt mit הָעֲבֹדָה als Subjekt bezeichnet, dass die Arbeit schwer auf den Männern liegen soll. Die deutsche Wendung bewahrt das Bild der drückenden Last und gibt zugleich den anordnenden Sinn des Kontexts wieder.
- source_word: הָעֲבֹדָה
  choice: die Arbeit
  rationale: עֲבֹדָה bezeichnet Arbeit, Dienst oder Mühsal; im Zusammenhang der erzwungenen Ziegelarbeit ist „die Arbeit“ klar und natürlich.
- source_word: עַל הָאֲנָשִׁים
  choice: auf den Männern
  rationale: עַל stellt die Arbeit als eine auf den Männern liegende Last dar. הָאֲנָשִׁים wird entsprechend dem konkreten männlichen Bezug im Kontext mit „den Männern“ wiedergegeben.
- source_word: וְיַעֲשׂוּ בָהּ
  choice: damit sie sich damit abmühen
  rationale: עשה mit בָהּ bedeutet hier, an der Arbeit tätig zu sein. „Sich damit abmühen“ entspricht dem bedrückenden Kontext und bringt den Zweckzusammenhang natürlich zum Ausdruck.
- source_word: וְאַל יִשְׁעוּ
  choice: und nicht ... achten
  rationale: שעה kann „sich zuwenden“, „beachten“ oder „darauf hören“ bedeuten. „Auf ... achten“ ist eine direkte, gegenwärtige deutsche Wiedergabe; אַל trägt hier den verneinten beabsichtigten Ausgang der Anordnung.
- source_word: בְּדִבְרֵי שָׁקֶר
  choice: auf verlogene Worte
  rationale: דִּבְרֵי bezeichnet Worte oder Äußerungen; שָׁקֶר kennzeichnet sie aus Pharaos Sicht als falsch bzw. lügnerisch. „Verlogene Worte“ bewahrt diese polemische Charakterisierung, ohne sie als Erzählerurteil auszugeben.
theological_decisions:
- issue: Status der als שָׁקֶר bezeichneten Worte
  choice: Pharaos abwertende Charakterisierung wird unmittelbar als „verlogene Worte“ wiedergegeben.
  alternative: „falsche Worte“ oder ausdrücklich „Worte, die er für Lügen hielt“
  rationale: Der Vers gibt Pharaos Rede wieder. Eine erklärende Distanzierung im Haupttext würde dem Hebräischen etwas hinzufügen; der Redekontext macht deutlich, wem diese Bewertung gehört.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „schwer auf den Männern lasten“ erhält das hebräische Lastbild; „sich damit abmühen“ klingt natürlich und entspricht dem Zwangsarbeitskontext. Der Fußnotenmarker steht unmittelbar nach dem betreffenden Satz.
