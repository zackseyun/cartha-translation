base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/022.yaml
  text: Then Moses returned to Yahweh and said[a], “Lord, why have you brought harm on this people? Why then did you send me?”
translation:
  language: de
  text: 'Da kehrte Mose zu Jahwe zurück und sagte: »Herr, warum hast du diesem Volk Schaden zugefügt? Warum hast du mich denn gesandt?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kehrte … zurück
  rationale: Die Form von שׁוב bezeichnet hier natürlich Moses Rückkehr zu Jahwe nach der Begegnung mit dem Pharao.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: אֶל bedeutet hier »zu«; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Die ehrerbietige göttliche Anrede wird im modernen Deutschen natürlich mit »Herr« wiedergegeben.
- source_word: הֲרֵעֹתָה
  choice: hast … Schaden zugefügt
  rationale: Der Hifil von רעע drückt verursachtes Unheil oder Leid aus. »Schaden zugefügt« bewahrt den anklagenden Ton, ohne die Aussage unnötig auf moralisch böses Handeln festzulegen.
- source_word: לָעָם הַזֶּה
  choice: diesem Volk
  rationale: עָם bezeichnet Israel hier als Kollektiv; »Volk« ist die direkte und kontextgemäße Wiedergabe.
- source_word: לָמָּה זֶּה
  choice: Warum nur
  rationale: Das zusätzliche זֶה verstärkt die Warum-Frage. »Warum nur« gibt diese emotionale und rhetorische Hervorhebung im Deutschen idiomatisch wieder.
- source_word: שְׁלַחְתָּנִי
  choice: hast du mich gesandt
  rationale: Das Qatal mit Objektsuffix bezeichnet die bereits erfolgte Sendung Moses; das Perfekt ist im Deutschen natürlich und passend.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Tetragrammaton. »Jahwe« bewahrt den persönlichen Bundesnamen und unterscheidet ihn von der anschließenden Anrede אֲדֹנָי, »Herr«.
- issue: Reichweite von הֲרֵעֹתָה
  choice: Schaden zugefügt
  alternative: Böses angetan
  rationale: Die Aussage behält Moses scharfe Klage gegen Gott bei, wird jedoch nicht eindeutiger als das hebräische Verb als Vorwurf moralischer Bosheit formuliert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt eindringlich und anklagend; »Warum nur« vermittelt die emphatische hebräische Wendung ohne unnatürliche Wort-für-Wort-Konstruktion.
