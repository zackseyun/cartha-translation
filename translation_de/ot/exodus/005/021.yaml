  text: וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם יֵ֧רֶא יְהוָ֛ה עֲלֵי/כֶ֖ם וְ/יִשְׁפֹּ֑ט אֲשֶׁ֧ר הִבְאַשְׁתֶּ֣ם אֶת רֵיחֵ֗/נוּ בְּ/עֵינֵ֤י פַרְעֹה֙ וּ/בְ/עֵינֵ֣י עֲבָדָ֔י/ו לָֽ/תֶת חֶ֥רֶב בְּ/יָדָ֖/ם לְ/הָרְגֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/021.yaml
  text: And they said to them[a], “May Yahweh look on you and judge, because you have made us stink in the sight of Pharaoh and in the sight of his servants, putting a sword in their hand to kill us.”
translation:
  language: de
  text: 'Und sie sagten zu ihnen: »Möge Jahwe euch ansehen und richten! Denn ihr habt unseren Geruch in den Augen des Pharaos und in den Augen seiner Diener stinkend gemacht[a] und ihnen damit ein Schwert in die Hand gegeben, um uns zu töten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ihr habt unseren Geruch stinkend gemacht«; gemeint ist: Ihr habt uns in den Augen des Pharaos und seiner Diener abstoßend oder anstößig gemacht.'
    reason: Erklärt die ungewöhnliche hebräische Geruchsmetapher, ohne sie im Haupttext aufzulösen oder ihre Wirkung durch »verhasst« zu stark einzuengen.
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵהֶם
  choice: Und sie sagten zu ihnen
  rationale: Bewahrt den hebräischen Erzählanschluss und das Pronomen; die im Kontext gemeinten Mose und Aaron werden nicht ausdrücklich ergänzt.
- source_word: יֵרֶא יְהוָה עֲלֵיכֶם וְיִשְׁפֹּט
  choice: Jahwe soll euch ansehen und richten
  rationale: Die beiden Imperfektformen haben hier jussivischen, verwünschenden Charakter. „Ansehen“ gibt die Bitte um Gottes prüfende Wahrnehmung wieder, ohne das anschließende „richten“ vorwegzunehmen.
- source_word: הִבְאַשְׁתֶּם אֶת רֵיחֵנוּ
  choice: ihr habt unseren Geruch … stinkend gemacht
  rationale: Die auffällige und drastische Geruchsmetapher des Hebräischen bleibt sichtbar; eine Glättung zu „verhasst gemacht“ wäre verständlicher, aber stärker deutend.
- source_word: בְּעֵינֵי פַרְעֹה וּבְעֵינֵי עֲבָדָיו
  choice: in den Augen des Pharaos und seiner Diener
  rationale: Gibt die wiederholte hebräische Wendung formal und im Deutschen verständlich wieder.
- source_word: לָתֵת חֶרֶב בְּיָדָם
  choice: ihnen damit ein Schwert in die Hand gegeben
  rationale: 'Der Infinitiv bezeichnet Folge beziehungsweise Wirkung: Mose und Aaron haben ihnen bildlich das Mittel oder die Gelegenheit zur Tötung verschafft. Der Singular „Schwert“ bleibt erhalten.'
- source_word: לְהָרְגֵנוּ
  choice: um uns zu töten
  rationale: Klare moderne Wiedergabe des Infinitivs mit Suffix der ersten Person Plural.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Kraft von יֵרֶא … וְיִשְׁפֹּט
  choice: Jahwe soll euch ansehen und richten
  alternative: Jahwe wird euch ansehen und richten
  rationale: Im Zusammenhang handelt es sich am ehesten um einen gegen Mose und Aaron gerichteten Wunsch beziehungsweise Fluch, nicht um eine bloße Zukunftsaussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schroffe Geruchsmetapher und die Wiederholung „in den Augen“ wurden bewusst bewahrt; „Diener“ ist hier eine kontextgerechte Wiedergabe von עֲבָדִים und kann Amtsträger beziehungsweise Untergebene des Pharaos bezeichnen.
