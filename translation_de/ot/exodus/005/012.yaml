translation:
  language: de
  text: Da wurde das Volk über das ganze Land Ägypten zerstreut, um Stoppeln anstelle von Stroh zu sammeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Abgrenzung der Begriffe קַשׁ und תֶּבֶן ist unsicher. Der Satz bezeichnet vermutlich das Sammeln von Stoppeln als Ersatz für das sonst bereitgestellte Stroh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: Da zerstreute sich
  rationale: Das Verb פוץ bezeichnet hier die weiträumige Verteilung des Volkes unter dem Druck der angeordneten Zwangsarbeit. Die deutsche reflexive Form gibt das resultierende Auseinandergehen natürlich wieder, ohne ausdrücklich einen im Hebräischen nicht genannten Handelnden einzuführen.
- source_word: הָעָם
  choice: das Volk
  rationale: עַם bezeichnet kollektiv das israelitische Volk beziehungsweise die zur Arbeit gezwungene Bevölkerung. „Das Volk“ ist im Kontext klar, schlicht und würdig.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: über das ganze Land Ägypten
  rationale: Die Wendung beschreibt die Ausbreitung über das gesamte Gebiet Ägyptens. „Über das ganze Land Ägypten“ ist idiomatisch und bewahrt die umfassende Aussage von בְּכָל.
- source_word: לְקֹשֵׁשׁ
  choice: um … zu sammeln
  rationale: קשש bedeutet, verstreutes kleines Pflanzenmaterial aufzulesen oder zu sammeln. Die finale Konstruktion „um … zu sammeln“ entspricht dem hebräischen Infinitiv mit ל.
- source_word: קַשׁ
  choice: Stoppeln
  rationale: קַשׁ bezeichnet trockene Halmreste beziehungsweise Stoppeln. Da im selben Satz תֶּבֶן steht, wahrt „Stoppeln“ wahrscheinlich die beabsichtigte Unterscheidung zwischen dem nun gesammelten Ersatzmaterial und dem sonst gelieferten Stroh.
- source_word: לַתֶּבֶן
  choice: als Stroh
  rationale: 'Das ל kann hier Zweck oder Verwendung ausdrücken: Die gesammelten Stoppeln sollten als Stroh beim Ziegelmachen dienen. „Als Stroh“ macht diese Funktion im Deutschen knapp und natürlich deutlich.'
