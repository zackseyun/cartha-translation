base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/016.yaml
  text: No straw is given to your servants[a], yet they say to us, ‘Make bricks!’ And behold, your servants are being beaten, but the fault is with your own people.
translation:
  language: de
  text: 'Stroh wird deinen Dienern nicht gegeben, und doch sagen sie zu uns: »Macht Ziegel!« Und siehe: Deine Diener werden geschlagen, doch die Schuld liegt bei deinem Volk.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die verdichtete hebräische Wendung kann formnäher auch wiedergegeben werden: »Und dein Volk hat gesündigt« oder: »Dein Volk ist schuldig.« Im Zusammenhang ist wahrscheinlich gemeint, dass die Leute des Pharaos die Schuld tragen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּבֶן
  choice: Stroh
  rationale: Bezeichnet hier das Pflanzenmaterial, das bei der Herstellung von Lehmziegeln verwendet wurde; »Stroh« ist die geläufige und sachlich passende deutsche Entsprechung.
- source_word: אֵין נִתָּן
  choice: wird … nicht gegeben
  rationale: Die negative Existenzpartikel mit passivem Partizip bezeichnet die ausbleibende laufende Zuteilung; das deutsche Präsens Passiv gibt dies klar wieder.
- source_word: לַעֲבָדֶיךָ / עֲבָדֶיךָ
  choice: deinen Dienern / Deine Diener
  rationale: In der Anrede an den Pharao ist dies zugleich eine Unterordnungs- und Höflichkeitsformel. »Diener« bewahrt diesen Ton, ohne die unmittelbare Aussage unnötig auf eine bestimmte Form der Sklaverei festzulegen.
- source_word: לְבֵנִים
  choice: Ziegel
  rationale: Gemeint sind die herzustellenden Ziegel; die kurze deutsche Form passt zur nachfolgenden Produktionsforderung.
- source_word: אֹמְרִים לָנוּ עֲשׂוּ
  choice: 'sagt man zu uns: »Macht Ziegel!«'
  rationale: Das unbestimmte Subjekt wird im Deutschen idiomatisch mit »man« wiedergegeben. »Ziegel« wird aus dem unmittelbar vorausgehenden Substantiv in den Befehl aufgenommen, damit die Ellipse verständlich bleibt.
- source_word: וְהִנֵּה
  choice: Sieh nur
  rationale: Die Wendung lenkt nachdrücklich auf das offenkundige Unrecht. »Sieh nur« ist gegenwärtiges, würdiges Deutsch und erhält den appellativen Nachdruck.
- source_word: מֻכִּים
  choice: werden geschlagen
  rationale: Das passive Partizip beschreibt die fortdauernde Misshandlung der Sprecher beziehungsweise ihrer Gruppe.
- source_word: וְחָטָאת עַמֶּךָ
  choice: aber die Schuld liegt bei deinem eigenen Volk
  rationale: Die hebräische Klausel ist stark verdichtet und grammatisch schwierig. Im Zusammenhang richtet sich der Vorwurf gegen die ägyptischen Aufseher; diese Wiedergabe macht die argumentative Stoßrichtung verständlich, während die Fußnote die formalere Alternative bewahrt.
theological_decisions:
- issue: Zuweisung der Schuld im abschließenden hebräischen Satzteil
  choice: Die Schuld liegt bei dem Volk des Pharaos.
  alternative: »Und dein Volk hat gesündigt«; möglicherweise auch eine Aussage über ein Vergehen gegen das Volk des Pharaos.
  rationale: Der Zusammenhang stellt die unerfüllbare Forderung der ägyptischen Aufseher der Bestrafung der israelitischen Arbeiter gegenüber. Da die hebräische Formulierung jedoch komprimiert und mehrdeutig ist, wird die kontextuelle Deutung im Haupttext verwendet und die formalere Wiedergabe in der Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die höfisch-unterwürfige Selbstbezeichnung »deine Diener« und der Nachdruck von וְהִנֵּה bleiben erhalten; die schwierige Schlussklausel wird im Haupttext kontextgerecht und in der Fußnote formnäher wiedergegeben.
