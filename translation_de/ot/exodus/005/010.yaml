  text: וַ/יֵּ֨צְא֜וּ נֹגְשֵׂ֤י הָ/עָם֙ וְ/שֹׁ֣טְרָ֔י/ו וַ/יֹּאמְר֥וּ אֶל הָ/עָ֖ם לֵ/אמֹ֑ר כֹּ֚ה אָמַ֣ר פַּרְעֹ֔ה אֵינֶ֛/נִּי נֹתֵ֥ן לָ/כֶ֖ם תֶּֽבֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/010.yaml
  text: 'So the taskmasters of the people and their officers went out and said to the people[a], “Thus says Pharaoh: I am not giving you straw.”'
translation:
  language: de
  text: 'Da gingen die Antreiber des Volkes und dessen Vorsteher[a] hinaus und sagten zum Volk: »So spricht der Pharao: Ich gebe euch kein Stroh.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Vorarbeiter«. Das hebräische Wort kann untergeordnete Amtsträger aus dem Volk bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשֵׂי
  choice: Antreiber
  rationale: Das Wort bezeichnet hier die Aufseher, die unter Zwang die geforderte Arbeitsleistung durchsetzen. »Antreiber« gibt diese bedrückende Funktion prägnant wieder, ohne über den Kontext hinaus ausdrücklich »Sklaventreiber« zu sagen.
- source_word: שֹׁטְרָיו
  choice: seine Vorsteher
  rationale: Das Suffix bezieht sich grammatisch auf »das Volk«. Gemeint sind untergeordnete Amtsträger aus dem Volk; »Vorsteher« bewahrt den administrativen Sinn, während die kontextuell mögliche engere Deutung »Vorarbeiter« in der Fußnote genannt wird.
- source_word: וַיֵּצְאוּ
  choice: Da gingen ... hinaus
  rationale: Die Wendung gibt den erzählerischen Fortgang und die Bewegung von der vorausgehenden Begegnung weg natürlich wieder.
- source_word: הָעָם
  choice: das Volk
  rationale: Die kollektive Bezeichnung meint im Kontext das israelitische Volk beziehungsweise dessen zur Arbeit verpflichtete Angehörige.
- source_word: לֵאמֹר
  choice: und sagten
  rationale: Die formelhafte Einleitung direkter Rede wird im Deutschen idiomatisch mit »sagten« wiedergegeben.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Dies ist die geläufige und würdige deutsche Wiedergabe der Botenformel; das Präsens vermittelt den aktuell geltenden Erlass.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Im Deutschen steht der Herrschertitel in diesem Satz natürlich mit bestimmtem Artikel.
- source_word: אֵינֶנִּי נֹתֵן
  choice: Ich gebe ... kein
  rationale: Die Konstruktion mit Partizip drückt die gegenwärtige Verweigerung aus. Die Übersetzung wahrt diesen Aspekt und fügt kein im Hebräischen unausgesprochenes »mehr« hinzu.
- source_word: תֶּבֶן
  choice: Stroh
  rationale: »Stroh« ist die sachlich und kontextuell passende Bezeichnung für das beim Ziegelmachen verwendete Material.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Botenformel »So spricht der Pharao« bleibt formal markant. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den sich die lexikalische Alternative bezieht.
