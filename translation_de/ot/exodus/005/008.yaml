base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/008.yaml
  text: And the quota of bricks that they were making yesterday and the day before[a], you shall impose on them; you shall not reduce any of it, because they are idle. Therefore they are crying out, saying, ‘Let us go and sacrifice to our God.’
translation:
  language: de
  text: 'Und die Ziegelmenge, die sie gestern und vorgestern herstellten[a], sollt ihr ihnen auferlegen; ihr sollt nichts davon abziehen. Denn sie sind faul. Darum schreien sie: »Lasst uns gehen und unserem Gott Opfer darbringen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »früher« oder »wie bisher« für »gestern und vorgestern«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתְכֹּנֶת
  choice: Anzahl
  rationale: Das Substantiv bezeichnet hier die vorgeschriebene Produktionsmenge. »Anzahl« ist im Zusammenhang mit den Ziegeln natürlich; zusammen mit »auferlegen« wird der verbindliche Sollwert deutlich.
- source_word: הַלְּבֵנִים
  choice: Ziegel
  rationale: Konkrete Bezeichnung für die im Kontext hergestellten Lehmziegel.
- source_word: תְּמוֹל שִׁלְשֹׁם
  choice: gestern und vorgestern
  rationale: Bewahrt die anschauliche hebräische Zeitformel in einer knappen, idiomatischen deutschen Wendung; weiter gefasst kann sie auch »früher« beziehungsweise »wie bisher« bedeuten.
- source_word: תָּשִׂימוּ עֲלֵיהֶם
  choice: sollt ihr ihnen auferlegen
  rationale: Die Verbindung bezeichnet das verbindliche Aufbürden einer Arbeitsvorgabe und bewahrt die administrative Zwangswirkung.
- source_word: לֹא תִגְרְעוּ מִמֶּנּוּ
  choice: ihr sollt nichts davon abziehen
  rationale: Gibt das Verringern oder Wegnehmen von der vorgeschriebenen Menge unmittelbar wieder.
- source_word: נִרְפִּים
  choice: faul
  rationale: In Pharaos Vorwurf bezeichnet das Wort die Arbeiter als untätig beziehungsweise arbeitsscheu. »Faul« gibt die Schärfe seiner abwertenden Anschuldigung im heutigen Deutsch wieder, ohne sie als Aussage des Erzählers auszugeben.
- source_word: צֹעֲקִים
  choice: schreien
  rationale: Das Partizip bezeichnet lautes Rufen und vermittelt die von Pharao behauptete Eindringlichkeit.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: Lasst uns gehen und unserem Gott Opfer darbringen
  rationale: Die beiden Kohortative drücken Aufforderung beziehungsweise Entschlossenheit in der ersten Person Plural aus. Die koordinierte deutsche Formulierung ist idiomatisch und gibt das Opfern klar wieder.
- source_word: לֵאלֹהֵינוּ
  choice: unserem Gott
  rationale: Der Dativ nach »Opfer darbringen« bezeichnet natürlich den Empfänger des Opfers.
