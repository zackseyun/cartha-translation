  source_fidelity: 'Der Entwurf trifft die wesentlichen Elemente des Hebräischen: die nachdrückliche Einleitung הֵן, die Gegenwartsangabe, die offene Wendung »Volk des Landes« und die kausative Aussage, dass Mose und Aaron die Betroffenen von ihren Arbeitslasten abbringen. Die Formulierung »ihre Lastarbeiten ruhen zu lassen« verschiebt jedoch die Handlung: Sie lässt die Lastarbeiten selbst »ruhen«, statt die Menschen die Arbeit einstellen zu lassen.'
