  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה הֵן רַבִּ֥ים עַתָּ֖ה עַ֣ם הָ/אָ֑רֶץ וְ/הִשְׁבַּתֶּ֥ם אֹתָ֖/ם מִ/סִּבְלֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/005.yaml
  text: Pharaoh said[a], “Look, the people of the land are now many, and you are making them rest from their burdens.”
translation:
  language: de
  text: 'Der Pharao sagte: »Seht, das Volk des Landes ist jetzt zahlreich, und ihr bringt sie dazu, ihre Lastarbeiten einzustellen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und ihr lasst sie von ihren Lastarbeiten ruhen«; auch: »und ihr habt sie von ihren Lasten abgebracht«. Das hebräische Verb ist kausativ und bezeichnet hier, dass sie ihre Arbeit beziehungsweise ihre Lasten einstellen sollen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Seht
  rationale: Bewahrt den hinweisenden und nachdrücklichen Charakter der Partikel in natürlichem, gegenwärtigem Deutsch.
- source_word: רַבִּים
  choice: zahlreich
  rationale: Gibt das prädikativ gebrauchte quantitative Adjektiv idiomatisch wieder.
- source_word: עַם הָאָרֶץ
  choice: das Volk des Landes
  rationale: Bewahrt die transparente hebräische Wendung, ohne sie vorschnell als »einfache Leute« oder ausschließlich als »Israeliten« auszudeuten.
- source_word: עַתָּה
  choice: jetzt
  rationale: Entspricht dem temporalen Adverb und betont die von Pharao wahrgenommene gegenwärtige Lage.
- source_word: וְהִשְׁבַּתֶּם
  choice: ihr bringt sie dazu, … ruhen zu lassen
  rationale: 'Gibt die kausative Hifil-Form von שׁבת wieder: Mose und Aaron veranlassen das Volk, mit der Arbeit aufzuhören. Die Formulierung wahrt zugleich die mögliche Nuance von »ruhen lassen«.'
- source_word: מִסִּבְלֹתָם
  choice: ihre Lastarbeiten
  rationale: Verbindet die Grundbedeutung »Lasten« mit dem konkreten Kontext der auferlegten Arbeit und ergibt zusammen mit dem Verb natürliches Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt nachdrücklich, ohne altertümliches »Siehe«. Die sachlich ungewöhnliche Wendung »Volk des Landes« wird wegen ihrer Bedeutungsoffenheit beibehalten.
