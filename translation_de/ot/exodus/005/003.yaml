base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/003.yaml
  text: And they said[a], “The God of the Hebrews has met with us. Please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God, lest he strike us with plague or with the sword.”
translation:
  language: de
  text: 'Und sie sagten[a]: »Der Gott der Hebräer ist uns begegnet. Bitte lass uns drei Tagesreisen weit in die Wüste ziehen, damit wir Jahwe, unserem Gott, Opfer darbringen, damit er uns nicht mit Seuche oder mit dem Schwert trifft.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Gott der Hebräer hat uns gerufen.« Die hebräische Wendung kann besagen, dass Gott ihnen begegnet ist oder sie zu sich gerufen hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: der Gott der Hebräer
  rationale: Die formale Konstruktverbindung und die in diesem Erzählzusammenhang verwendete ethnische Bezeichnung werden bewahrt; eine Glättung zu „Israeliten“ wäre weniger quellennah.
- source_word: נִקְרָא עָלֵינוּ
  choice: ist uns begegnet
  rationale: Der Niphal von קרא mit עַל kann hier eine Begegnung bzw. ein Zusammentreffen bezeichnen. Die Formulierung ist im Deutschen natürlich, während die mögliche Bedeutung „hat uns gerufen“ in der Fußnote erhalten bleibt.
- source_word: נֵלֲכָה נָּא
  choice: Bitte lass uns … ziehen
  rationale: Der Kohortativ drückt die erbetene Erlaubnis und Entschlossenheit aus; נָא kennzeichnet die höfliche Bitte.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: drei Tagereisen weit
  rationale: Die hebräische Wegangabe bezeichnet eine Reisezeit beziehungsweise entsprechende Entfernung. Die deutsche Wendung ist knapp und idiomatisch.
- source_word: בַּמִּדְבָּר
  choice: in die Wüste
  rationale: מִדְבָּר bezeichnet unbesiedeltes, trockenes Weide- oder Wüstenland. „Wüste“ ist im Deutschen die geläufige, kontextgerechte Wiedergabe, ohne zwingend eine reine Sandwüste zu meinen.
- source_word: וְנִזְבְּחָה
  choice: damit wir … Opfer darbringen
  rationale: Der zweite Kohortativ kann in dieser Abfolge den Zweck des erbetenen Wegzugs ausdrücken. „Opfer darbringen“ gibt den kultischen Sinn von זבח natürlich wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Eigenname wiedergegeben und nicht durch einen Hoheitstitel ersetzt.
- source_word: פֶּן
  choice: sonst könnte
  rationale: Die Wendung gibt die abwehrende Warnung von פֶּן in natürlichem modernem Deutsch wieder, ohne den befürchteten Ausgang als bereits feststehend darzustellen.
- source_word: יִפְגָּעֵנוּ
  choice: er uns … heimsuchen
  rationale: פגע bezeichnet hier ein feindliches beziehungsweise strafendes Entgegentreten. „Heimsuchen“ verbindet sich idiomatisch mit Pest und Schwert und bewahrt den Gedanken göttlichen Gerichts.
- source_word: בַּדֶּבֶר אֹו בֶחָרֶב
  choice: mit der Pest oder dem Schwert
  rationale: Die beiden instrumentalen Wendungen benennen Seuche und gewaltsamen Tod. „Pest“ und „Schwert“ sind präzise, verständlich und bewahren die Bildsprache.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den Gottesnamen. „Jahwe“ erhält ihn als Namen und vermeidet, ihn stillschweigend durch einen Titel zu ersetzen.
- issue: Grund der erbetenen Opferreise
  choice: sonst könnte er uns … heimsuchen
  alternative: damit er uns nicht … heimsucht
  rationale: Die Aussage wahrt die Spannung, dass die Opferung als Abwendung eines befürchteten göttlichen Gerichts dargestellt wird. Die modale Formulierung lässt dabei offen, wie unmittelbar oder gewiss die Bedrohung gedacht ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und mündlich nachvollziehbar; „Tagereisen“, „Opfer darbringen“ und „heimsuchen“ bewahren den biblischen Sachgehalt, ohne unnötig altertümlich zu wirken.
