    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da kamen
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da kamen“ gibt die zeitliche Folge im Deutschen natürlich wieder.
- source_word: שֹׁטְרֵי
  choice: Aufseher
  rationale: Gemeint sind israelitische Funktionsträger, die innerhalb der ägyptischen Arbeitsorganisation Aufsichtspflichten hatten. „Aufseher“ ist verständlich und wahrt ihre untergeordnete Verwaltungsrolle.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  rationale: Die natürliche deutsche Volksbezeichnung gibt hier den Bezug auf das Volk wieder; die wörtliche familiäre Form „Söhne Israels“ bleibt in der Fußnote sichtbar.
- source_word: וַיִּצְעֲקוּ
  choice: schrien
  rationale: Das Verb bezeichnet einen dringlichen, lauten Hilferuf oder Klageruf und ist stärker als ein bloßes Bitten.
- source_word: אֶל פַּרְעֹה
  choice: zum Pharao
  rationale: Die Präposition bezeichnet die Richtung des Rufens; „zum Pharao schreien“ bildet dies knapp und idiomatisch ab.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Der hebräische Redeeinleiter wird im natürlichen modernen Deutsch durch die direkte Rede nach einem Doppelpunkt ausgedrückt.
- source_word: לָמָּה תַעֲשֶׂה כֹה
  choice: Warum tust du ... so etwas an?
  rationale: Die Formulierung bleibt nahe bei „Warum tust du so ...?“, klingt aber im Deutschen als Vorwurf natürlich und bezieht sich auf Pharaos Vorgehen.
- source_word: לַעֲבָדֶיךָ
  choice: deinen Dienern
  rationale: Die Sprecher bezeichnen sich in einer demütigen Anrede an den König als dessen Diener. Da עבד auch „Sklave“ bedeuten kann und der Zwangsarbeitskontext diese Nuance zulässt, wird die Alternative in einer Fußnote genannt.
theological_decisions:
- issue: Sozialer Status der israelitischen Sprecher in לַעֲבָדֶיךָ
  choice: Diener
  alternative: Sklaven
  rationale: Die höfische Selbstbezeichnung gegenüber dem Pharao spricht für „Diener“, während der Kontext der Zwangsarbeit die stärkere Bedeutung „Sklaven“ nicht ausschließt. Die Übersetzung entscheidet diese Spannung daher nicht stillschweigend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Klage klingt dringlich, bleibt aber in der Selbstbezeichnung „deine Diener“ dem höfischen Sprachgebrauch gegenüber dem Pharao verpflichtet.
