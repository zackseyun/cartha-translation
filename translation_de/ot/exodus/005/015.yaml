  text: Then the officers of the sons of Israel came and cried out to Pharaoh[a], saying[c][b], “Why do you do this to your servants?”
translation:
  language: de
  text: 'Da kamen die Aufseher der Israeliten[a] und riefen laut zum Pharao: „Warum verfährst du so mit deinen Dienern[b]?[c]“'
  philosophy: optimal-equivalence
  footnotes:
