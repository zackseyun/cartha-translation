  yaml_path: translation/ot/exodus/005/013.yaml
  text: And the taskmasters kept pressing them[a], saying, “Finish your work, each day’s matter in its day, just as when there was straw.”
translation:
  language: de
  text: 'Und die Fronaufseher trieben sie an und sagten: »Erfüllt jeden Tag euer Tagessoll, genauso wie damals, als es Stroh gab.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּגְשִׂים
  choice: die Fronaufseher
  rationale: Das Wort bezeichnet hier die Amtsträger, die den Israeliten unter Zwang Arbeit und Produktionsmengen abverlangen. »Fronaufseher« gibt Funktion und Zwangskontext prägnant wieder.
- source_word: אָצִים
  choice: trieben sie an
  rationale: Das Partizip beschreibt fortgesetzten, nachdrücklichen Druck. »Trieben sie an« klingt im Deutschen natürlich und bewahrt den Zwangston.
- source_word: כַּלּוּ
  choice: Erledigt
  rationale: Der Imperativ fordert die vollständige Ausführung der auferlegten Arbeit. »Erledigt« ist direkt und idiomatisch.
- source_word: מַעֲשֵׂיכֶם
  choice: eure Arbeit
  rationale: Im Zusammenhang ist die verlangte Ziegelarbeit gemeint; »eure Arbeit« bleibt zugleich so allgemein wie der hebräische Ausdruck.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: das Tagessoll an jedem Tag
  rationale: Die wörtliche Wendung »die Sache eines Tages an seinem Tag« bezeichnet im Arbeitskontext die täglich geforderte Menge. »Tagessoll« vermittelt diesen Sinn knapp und natürlich.
- source_word: כַּאֲשֶׁר
  choice: genauso wie
  rationale: Die Wendung führt einen Vergleich mit den früheren Arbeitsbedingungen ein und betont, dass die Forderung unverändert bleibt.
- source_word: בִּהְיוֹת הַתֶּבֶן
  choice: damals, als Stroh da war
  rationale: Die Infinitivkonstruktion verweist auf den früheren Zustand, in dem Stroh vorhanden war. »Damals« macht den zeitlichen Gegensatz klar, ohne ausdrücklich hinzuzufügen, wer das Stroh bereitstellte.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist direkt und verständlich; »Fronaufseher« wahrt den Zwangscharakter, während »Tagessoll« die hebräische Tagesformel kontextgerecht wiedergibt.
