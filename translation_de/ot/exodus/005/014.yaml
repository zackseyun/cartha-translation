base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/014.yaml
  text: And the Israelite foremen[a], whom Pharaoh’s taskmasters had set over them, were beaten, saying, “Why have you not finished your quota of brickmaking as before, both yesterday and today?”
translation:
  language: de
  text: 'Und die israelitischen Vorarbeiter, die von den Fronaufsehern des Pharaos über die Israeliten eingesetzt worden waren, wurden geschlagen. Die Fronaufseher sagten zu ihnen: »Warum habt ihr euer Soll an Ziegeln gestern und heute nicht erfüllt wie früher[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wie gestern, vorgestern«; eine hebräische Wendung im Sinn von »wie früher« oder »wie bisher«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּכּוּ
  choice: wurden geschlagen
  rationale: Das passive Verb bezeichnet körperliche Misshandlung, ohne die genaue Art der Schläge näher festzulegen.
- source_word: שֹׁטְרֵי בְּנֵי יִשְׂרָאֵל
  choice: die israelitischen Vorarbeiter
  rationale: Im Zusammenhang der Zwangsarbeit sind untergeordnete israelitische Aufseher gemeint; »Vorarbeiter« gibt ihre Funktion verständlich wieder.
- source_word: אֲשֶׁר שָׂמוּ עֲלֵהֶם נֹגְשֵׂי פַרְעֹה
  choice: die von den Fronaufsehern des Pharaos über sie eingesetzt worden waren
  rationale: »Fronaufseher« macht den Kontext erzwungener Arbeit deutlich; die relative Satzstruktur und das Einsetzen über andere bleiben erhalten.
- source_word: לֵאמֹר
  choice: Man sagte zu ihnen
  rationale: Der hebräische Redeanzeiger wird im Deutschen als natürliche Einleitung der direkten Rede wiedergegeben; aus dem Kontext sind die Fronaufseher als Sprecher erschließbar, ohne sie ausdrücklich erneut zu benennen.
- source_word: מַדּוּעַ לֹא כִלִּיתֶם
  choice: Warum habt ihr … nicht erfüllt
  rationale: כלה bezeichnet hier das vollständige Erbringen der vorgeschriebenen Arbeitsmenge; mit »Soll« verbindet sich im Deutschen idiomatisch »erfüllen«.
- source_word: חָקְכֶם לִלְבֹּן
  choice: euer Soll an Ziegeln
  rationale: חֹק bezeichnet die festgesetzte Menge, und der Infinitiv bezieht sich auf die Ziegelherstellung. »Soll an Ziegeln« ist knapp, präzise und natürlich.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: wie früher
  rationale: Die wörtlich auf vergangene Tage verweisende Wendung ist ein Idiom für den bisherigen beziehungsweise früheren Zustand.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: gestern und heute
  rationale: Die paarige Hervorhebung beider Tage wird in natürlichem Deutsch durch die koordinierte Nennung bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Fronaufseher« kennzeichnet den Zwangsarbeitskontext, während »Vorarbeiter« die vermittelnde Funktion der israelitischen Amtsträger verständlich bezeichnet. Die etwas schwere hebräische Redeeinleitung wurde in zwei natürliche deutsche Sätze gegliedert.
