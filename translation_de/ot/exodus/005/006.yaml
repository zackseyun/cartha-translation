  text: So Pharaoh commanded on that day the taskmasters of the people and his officers[a], saying[c][b],
translation:
  language: de
  text: 'An jenem Tag befahl der Pharao den Antreibern des Volkes und seinen Aufsehern[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Vorarbeitern“. Gemeint sind nachgeordnete Amtsträger in der Arbeitsorganisation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: befahl
  rationale: Das Narrativpräteritum von צוה führt die Handlung fort und bezeichnet eine verbindliche Anordnung; „befahl“ gibt dies knapp und natürlich wieder.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Die im Deutschen übliche Wiedergabe des ägyptischen Herrschertitels; der bestimmte Artikel entspricht dem natürlichen deutschen Sprachgebrauch.
- source_word: בַּיּוֹם הַהוּא
  choice: noch am selben Tag
  rationale: Die Wendung bedeutet wörtlich „an jenem Tag“. Im Zusammenhang hebt sie hervor, dass die Anordnung unmittelbar an diesem selben Tag erging; „noch am selben Tag“ gibt diese zeitliche Funktion idiomatisch wieder.
- source_word: הַנֹּגְשִׂים בָּעָם
  choice: den Antreibern des Volkes
  rationale: נגשׂ bezeichnet hier Personen, die Zwangsarbeit einfordern und die Arbeiter antreiben. „Antreiber“ bewahrt diese belastende Funktion besser als das neutralere „Aufseher“. Die Beziehung zum Volk wird im Deutschen natürlich mit dem Genitiv ausgedrückt.
- source_word: שֹׁטְרָיו
  choice: seinen Aufsehern
  rationale: שֹׁטְרִים sind hier nachgeordnete Amtsträger innerhalb der Arbeitsorganisation. „Aufseher“ ist verständlich und hinreichend weit, ohne sie spezifisch als Schreiber oder Vorarbeiter festzulegen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeeinleitungsformel wird vor der folgenden direkten Rede im natürlichen modernen Deutsch am besten durch einen Doppelpunkt wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist knapp und erzählerisch. „Antreiber“ und „Aufseher“ unterscheiden die beiden Funktionärsgruppen, ohne ihre genaue Verwaltungsstruktur stärker festzulegen, als es der hebräische Text erlaubt.
