source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה מִ֤י יְהוָה֙ אֲשֶׁ֣ר אֶשְׁמַ֣ע בְּ/קֹל֔/וֹ לְ/שַׁלַּ֖ח אֶת יִשְׂרָאֵ֑ל לֹ֤א יָדַ֨עְתִּי֙ אֶת יְהוָ֔ה וְ/גַ֥ם אֶת יִשְׂרָאֵ֖ל לֹ֥א אֲשַׁלֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/002.yaml
  text: Pharaoh said[a], “Who is Yahweh, that I should obey his voice and let Israel go? I do not know Yahweh, and moreover I will not let Israel go.”
translation:
  language: de
  text: 'Der Pharao sagte: »Wer ist Jahwe, dass ich auf seine Stimme hören und Israel ziehen lassen sollte? Ich kenne Jahwe nicht; außerdem werde ich Israel nicht ziehen lassen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Die im Deutschen übliche Wiedergabe des ägyptischen Herrschertitels; der bestimmte Artikel entspricht dem natürlichen deutschen Sprachgebrauch.
- source_word: מִי יְהוָה
  choice: Wer ist Jahwe
  rationale: מִי fragt nach der Identität; die knappe Form bewahrt den herausfordernden, geringschätzigen Ton des Pharaos.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben, statt es durch den Titel »der HERR« zu ersetzen.
- source_word: אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ
  choice: dass ich auf seine Stimme hören ... sollte
  rationale: שׁמע בקול bezeichnet gehorsames Hören. Die deutsche Wendung wahrt das hebräische Bild und lässt den Gehorsamssinn im Zusammenhang klar hervortreten.
- source_word: לְשַׁלַּח אֶת יִשְׂרָאֵל
  choice: Israel ziehen lassen
  rationale: Im Exoduszusammenhang ist dies eine natürliche und etablierte Wiedergabe von שׁלח mit Israel als Objekt.
- source_word: לֹא יָדַעְתִּי
  choice: Ich kenne ... nicht
  rationale: Das Perfekt bezeichnet hier die gegenwärtige Haltung des Pharaos. »Kennen« bewahrt sowohl den wörtlichen Sinn als auch die mögliche Nuance des Nichtanerkennens.
- source_word: וְגַם
  choice: außerdem
  rationale: Die Formulierung fügt der behaupteten Unkenntnis eine nachdrückliche ausdrückliche Weigerung hinzu.
- source_word: אֲשַׁלֵּחַ
  choice: werde ich ... nicht ziehen lassen
  rationale: Das Imperfekt drückt hier den festen gegenwärtigen Entschluss des Pharaos aus; die Wiederholung hält den Bezug zur vorherigen Aussage deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich den Gottesnamen. »Jahwe« gibt ihn als Namen wieder, ohne ihn durch einen Titel zu ersetzen; »Jehova« beruht auf einer späteren Mischlesung.
- issue: Bedeutung von »Ich kenne Jahwe nicht«
  choice: Die offene Formulierung »Ich kenne Jahwe nicht«
  alternative: »Ich erkenne Jahwe nicht an«
  rationale: Das Verb ידע kann im Zusammenhang mehr als bloße Bekanntschaft einschließen, doch der Text legt die engere Deutung »nicht anerkennen« nicht ausdrücklich fest. Die Übersetzung bewahrt diese Spannung.
- issue: Gehorsamsnuance von שׁמע בקול
  choice: »auf seine Stimme hören«
  alternative: »ihm gehorchen«
  rationale: Die gewählte Form bewahrt das hebräische Sprachbild, während der Kontext den Sinn des Gehorchens vermittelt, ohne ihn interpretierend zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und schroff. »Ziehen lassen« ist idiomatisch und im Exoduskontext verständlich; »auf seine Stimme hören« bewahrt bewusst das Bild des Ausgangstextes.
