language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַחַ֗ר בָּ֚אוּ מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן וַ/יֹּאמְר֖וּ אֶל פַּרְעֹ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יָחֹ֥גּוּ לִ֖/י בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/001.yaml
  text: 'Afterward Moses and Aaron went in and said to Pharaoh[a], “Thus says Yahweh, the God of Israel: Let my people go[b], so that they may hold a feast to me in the wilderness.”'
translation:
  language: de
  text: 'Danach gingen Mose und Aaron zum Pharao und sagten: „So spricht Jahwe[a], der Gott Israels: Lass mein Volk ziehen, damit es mir in der Wüste ein Fest feiert.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell auch mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „damit es mir in der Wüste ein Wallfahrtsfest begeht“. Das hebräische Verb bezeichnet das Feiern eines religiösen Festes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Danach
  rationale: Der zeitliche Erzählmarker führt das nächste Geschehen ein, ohne die Länge des dazwischenliegenden Zeitraums festzulegen.
- source_word: בָּאוּ ... אֶל־פַּרְעֹה
  choice: gingen ... zum Pharao
  rationale: בוא bezeichnet hier das Hingehen beziehungsweise Eintreten in die Gegenwart des Pharaos. Die deutsche Formulierung ist natürlich und vermeidet eine nicht ausdrücklich genannte Ortsangabe.
- source_word: וַיֹּאמְרוּ
  choice: sagten
  rationale: Dies entspricht der üblichen hebräischen Erzählformel zur Einleitung direkter Rede.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste Botenformel vermittelt im Deutschen knapp und würdevoll die Autorität des folgenden Gotteswortes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „HERR“ ersetzt; „Jahwe“ ist die im Deutschen geläufige Umschrift.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Genitivverbindung gibt die hebräische Status-constructus-Verbindung transparent wieder.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Lass mein Volk ziehen
  rationale: Der Imperativ fordert vom Pharao die Freilassung Israels. Diese Formulierung ist präzise, idiomatisch und bewahrt die Kraft des Befehls.
- source_word: וְיָחֹגּוּ לִי
  choice: damit es mir ... ein Fest feiert
  rationale: חגג bezeichnet das Begehen eines religiösen Festes, möglicherweise eines Wallfahrtsfestes. Die Zweckkonstruktion gibt den Zusammenhang mit der geforderten Freilassung natürlich wieder.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet unbewohntes, karges Land; „Wüste“ ist hier die geläufige und kontextgerechte deutsche Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; JHWH
  rationale: Im hebräischen Text steht der Eigenname Gottes. Seine Wiedergabe als „Jahwe“ bewahrt diesen Charakter, während „der HERR“ den Namen durch einen Titel ersetzt.
- issue: Zweck der Freilassung Israels
  choice: damit es mir in der Wüste ein Fest feiert
  alternative: und es soll mir in der Wüste ein Fest feiern
  rationale: Das mit וְ angeschlossene Verb kann im Zusammenhang als beabsichtigte Folge beziehungsweise Zweck der Freilassung verstanden werden. „Damit“ macht diesen naheliegenden Zusammenhang deutlich, ohne das Fest allgemein zu „Gottesdienst“ auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Botenformel „So spricht“ wahrt den feierlich-autoritativen Ton; ansonsten bleibt der Satz bewusst klar und alltagstauglich.
