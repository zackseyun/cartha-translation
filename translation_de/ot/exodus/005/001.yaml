  source_fidelity: Die Übersetzung gibt die zeitliche Abfolge (וְאַחַר), das Auftreten vor dem Pharao, die Botenformel, den Gottesnamen, den Freilassungsbefehl und den kultisch-festlichen Zweck in der Wüste zuverlässig wieder. „Damit“ ist als Wiedergabe der final verstandenen Verbindung mit וְיָחֹגּוּ im Kontext angemessen.
  naturalness: „Danach gingen Mose und Aaron zum Pharao“ sowie „Lass mein Volk ziehen“ sind natürliches modernes Standarddeutsch. Die würdige Formel „So spricht“ passt zum autoritativen Charakter der direkten Rede. „Ein Fest feiern“ ist idiomatisch; das neutrale Pronomen „es“ bezieht sich korrekt auf „Volk“.
  terminology: „Jahwe“ ist eine geläufige deutsche Umschrift des Tetragramms und bewahrt den Eigennamen. „Der Gott Israels“, „Wüste“ und „ein Fest feiern“ sind sachgerecht. Die Anmerkung zu „Wallfahrtsfest“ kennzeichnet dies zutreffend als mögliche spezifischere lexikalische Nuance, ohne sie dem Haupttext aufzuzwingen.
