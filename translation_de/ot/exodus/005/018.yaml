  yaml_path: translation/ot/exodus/005/018.yaml
  text: So now[a], go, work; but straw will not be given to you, yet you must deliver the required number of bricks.
translation:
  language: de
  text: Und jetzt geht und arbeitet! Stroh wird euch nicht gegeben; die festgesetzte Menge an Ziegeln[a] müsst ihr trotzdem abliefern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Soll an Ziegeln“. Das hebräische Wort תֹכֶן bezeichnet eine festgelegte oder abgemessene Menge, die von den Arbeitern verlangt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und jetzt
  rationale: Die Wendung leitet den abschließenden, nachdrücklichen Befehl des Pharaos ein. „Und jetzt“ bewahrt sowohl den Anschluss als auch die zeitlich-diskursive Zuspitzung.
- source_word: לְכוּ
  choice: geht
  rationale: Der Imperativ von הלך wird schlicht und direkt wiedergegeben; seine Schärfe ergibt sich aus dem Zusammenhang und dem folgenden Ausrufezeichen.
- source_word: עִבְדוּ
  choice: arbeitet
  rationale: Im Zusammenhang ist die auferlegte Arbeit gemeint, nicht ein gottesdienstliches Dienen. „Arbeitet“ ist dafür die natürliche moderne Entsprechung.
- source_word: וְתֶבֶן
  choice: Stroh
  rationale: Das vorangestellte ו verbindet den Satz mit dem Befehl; der inhaltliche Gegensatz wird im Deutschen durch die Satzstellung und das Semikolon deutlich, ohne die Konjunktion schematisch abzubilden.
- source_word: יִנָּתֵן לָכֶם
  choice: wird euch nicht gegeben
  rationale: Die passive Form von נתן mit Verneinung wird formal nah und verständlich wiedergegeben; „geliefert“ wäre im Deutschen möglich, aber deutender.
- source_word: תֹכֶן
  choice: die festgesetzte Menge
  rationale: Das Substantiv bezeichnet ein abgemessenes beziehungsweise festgelegtes Arbeitssoll. „Festgesetzte Menge“ hält diesen Sinn offen und passt sowohl zu einer Stückzahl als auch zu einer vorgegebenen Produktionsmenge.
- source_word: לְבֵנִים
  choice: an Ziegeln
  rationale: Die Form gibt die Zugehörigkeit der festgesetzten Menge an. Im Deutschen ist „Menge an Ziegeln“ natürlich und eindeutig.
- source_word: תִּתֵּנּוּ
  choice: müsst ihr trotzdem abliefern
  rationale: Wörtlich steht „werdet/sollt ihr geben“. Im Arbeitszusammenhang bezeichnet das Verb die verpflichtende Ablieferung der hergestellten Ziegel; „müsst“ bringt die Befehlswirkung, „trotzdem“ den kontextuellen Gegensatz zum verweigerten Stroh zum Ausdruck.
