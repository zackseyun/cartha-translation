  text: וּ/מֵ/אָ֞ז בָּ֤אתִי אֶל פַּרְעֹה֙ לְ/דַבֵּ֣ר בִּ/שְׁמֶ֔/ךָ הֵרַ֖ע לָ/עָ֣ם הַ/זֶּ֑ה וְ/הַצֵּ֥ל לֹא הִצַּ֖לְתָּ אֶת עַמֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/023.yaml
  text: For since I came to Pharaoh to speak in your name[a], he has done evil to this people[c][b], and you have certainly not delivered your people.
translation:
  language: de
  text: Denn seit ich zum Pharao gekommen bin, um in deinem Namen zu reden,[a] hat er diesem Volk Böses angetan,[b] und du hast dein Volk ganz und gar nicht gerettet.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „In deinem Namen“ kann hier auch „in deinem Auftrag“ oder „mit deiner Vollmacht“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hat er die Lage dieses Volkes verschlimmert“.'
    reason: lexical_alternative
  - marker: c
    text: 'Im Hebräischen wird „retten“ durch die Verbindung eines absoluten Infinitivs mit der finiten Verbform nachdrücklich verstärkt: wörtlich etwa „retten hast du nicht gerettet“.'
    reason: source_form
lexical_decisions:
- source_word: וּמֵאָז
  choice: Denn seit
  rationale: מֵאָז bezeichnet den Zeitraum „seit damals/seitdem“. Das vorangestellte וּ verbindet den Satz mit Moses’ vorausgehender Klage; „Denn“ gibt hier den begründenden Zusammenhang natürlich wieder.
- source_word: בָּאתִי אֶל־פַּרְעֹה
  choice: ich zum Pharao gekommen bin
  rationale: בוא bedeutet „kommen“; mit אֶל wird die Bewegung auf den Pharao zu bezeichnet. Im deutschen seit-Satz steht idiomatisch das Perfekt.
- source_word: לְדַבֵּר בִּשְׁמֶךָ
  choice: um in deinem Namen zu reden
  rationale: Der Infinitiv bezeichnet den Zweck. „In deinem Namen“ bewahrt die konkrete Formulierung und schließt die Bedeutung ein, als Gottes Beauftragter und mit seiner Autorität zu sprechen.
- source_word: הֵרַע לָעָם הַזֶּה
  choice: hat er diesem Volk Böses angetan
  rationale: Die Hifil-Form von רעע kann sowohl böses beziehungsweise schädigendes Handeln als auch eine Verschlimmerung der Lage bezeichnen. Die Hauptfassung bewahrt die moralische Schärfe der Klage; die situative Alternative steht in der Fußnote.
- source_word: וְהַצֵּל לֹא הִצַּלְתָּ
  choice: und du hast … ganz und gar nicht gerettet
  rationale: Der absolute Infinitiv הַצֵּל zusammen mit der finiten Verbform הִצַּלְתָּ verstärkt die verneinte Aussage. „Ganz und gar nicht“ gibt diese nachdrückliche Verneinung natürlich wieder.
- source_word: אֶת־עַמֶּךָ
  choice: dein Volk
  rationale: Die direkte und kontextgerechte Wiedergabe bewahrt außerdem die Spannung, dass Mose Gott dieses bedrängte Volk ausdrücklich als sein Volk vorhält.
theological_decisions:
- issue: Moses’ verschärfte Klage über Gottes bisher ausgebliebene Rettung
  choice: du hast dein Volk ganz und gar nicht gerettet
  alternative: du hast dein Volk überhaupt nicht befreit
  rationale: Die Formulierung lässt Moses’ kühnen Vorwurf in seiner vollen Stärke stehen, ohne ihn abzuschwächen oder als endgültiges Urteil über Gottes Handeln umzudeuten.
- issue: Sprechen בִּשְׁמֶךָ
  choice: in deinem Namen
  alternative: in deinem Auftrag / mit deiner Vollmacht
  rationale: Die wörtlich verständliche Wendung erhält die theologische Bedeutung des göttlichen Namens und lässt zugleich die Aspekte von Beauftragung und Autorität mitschwingen.
- issue: Bedeutungsumfang von הֵרַע
  choice: hat er diesem Volk Böses angetan
  alternative: hat er die Lage dieses Volkes verschlimmert
  rationale: Der hebräische Ausdruck kann moralisch („Böses antun“) oder stärker ergebnisbezogen („schaden/die Lage verschlimmern“) verstanden werden. Die Hauptfassung wahrt die moralische Schärfe; die Fußnote erhält die sachliche Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz behält die unmittelbare und scharfe Form von Moses’ Klage bei. „Ganz und gar nicht“ ist gegenwärtig verständlich und bildet die hebräische Verstärkung ab, ohne umgangssprachlich zu wirken.
