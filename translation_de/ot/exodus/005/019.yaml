  text: וַ/יִּרְא֞וּ שֹֽׁטְרֵ֧י בְנֵֽי יִשְׂרָאֵ֛ל אֹתָ֖/ם בְּ/רָ֣ע לֵ/אמֹ֑ר לֹא תִגְרְע֥וּ מִ/לִּבְנֵי/כֶ֖ם דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/019.yaml
  text: Then the officers of the sons of Israel saw that they were in trouble when it was said[a], “You must not reduce the number of your bricks[b], the daily quota each day.”
translation:
  language: de
  text: 'Da erkannten die Aufseher der Söhne Israels[a], dass sie in einer schlimmen Lage waren, als es hieß: „Ihr dürft die Zahl eurer Ziegel nicht verringern – das tägliche Soll, Tag für Tag.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Israeliten“. Hebräisch wörtlich: „der Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräische Redewendung, wörtlich etwa: „die Sache eines Tages an seinem Tag“; gemeint ist die jeweils für einen Tag vorgeschriebene Menge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: Da erkannten
  rationale: ראה bedeutet grundsätzlich „sehen“, bezeichnet hier im Zusammenhang aber das Erfassen der eigenen Lage. „Erkannten“ ist im Deutschen natürlich und gibt diesen kontextuellen Sinn wieder.
- source_word: שֹׁטְרֵי
  choice: Aufseher
  rationale: Gemeint sind untergeordnete israelitische Arbeitsverantwortliche unter ägyptischer Gewalt. „Aufseher“ ist verständlich und lässt ihre genaue Verwaltungsfunktion offen.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formnahe Wiedergabe bewahrt die konkrete hebräische Verwandtschaftsbezeichnung; das idiomatische „Israeliten“ wird in der Fußnote genannt.
- source_word: אֹתָם בְּרָע
  choice: dass sie in einer schlimmen Lage waren
  rationale: Das Objektpronomen bezieht sich auf die Aufseher selbst. בְּרָע bezeichnet hier keine moralische Bosheit, sondern eine bedrängende, nachteilige Lage.
- source_word: לֵאמֹר
  choice: als es hieß
  rationale: Die unpersönliche Form führt die Aussage ein, an der die Aufseher ihre Notlage erkennen, ohne ausdrücklich festzulegen, wer sie äußert.
- source_word: לֹא תִגְרְעוּ מִלִּבְנֵיכֶם
  choice: Ihr dürft die Zahl eurer Ziegel nicht verringern
  rationale: גרע bedeutet „vermindern, abziehen“. Die Ergänzung „die Zahl“ macht die mengenbezogene Forderung im Deutschen klar, ohne den Sinn zu erweitern.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: das Tagessoll an jedem Tag
  rationale: Die hebräische Wendung bezeichnet die für jeden Tag vorgeschriebene Menge. „Tagessoll“ gibt den Quotensinn knapp und natürlich wieder; die Wiederholung „an jedem Tag“ bewahrt die ausdrückliche tägliche Forderung.
