base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/005.yaml
  text: 'And the skillfully woven band of his ephod[a], which was on it, was of one piece with it and made like it: of gold, blue, purple, scarlet yarn, and fine twisted linen, just as Yahweh had commanded Moses.'
translation:
  language: de
  text: 'Und der kunstvoll gewebte Gürtel seines Efods[a], der darauf war, war ein Teil davon und in derselben Machart gefertigt wie das Efod: aus Gold, blauem Garn, purpurfarbenem Garn, Karmesingarn und feinem gezwirntem Leinen – so, wie Jahwe es Mose geboten hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der kunstvoll gearbeitete Gürtel seines Efods … war von ihm und von derselben Machart“. Das Hebräische betont, dass der Gürtel zum Efod gehörte und dessen Machart entsprach.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵשֶׁב
  choice: kunstvoll gewebter Gurt
  rationale: Im Zusammenhang mit den Priestergewändern bezeichnet das Wort den gewebten Gurt des Efods. Die Wiedergabe wahrt sowohl die textile Funktion als auch den Gedanken kunstfertiger Arbeit.
- source_word: אֲפֻדָּתוֹ
  choice: seines Efods
  rationale: Die Konstruktverbindung mit Suffix bezeichnet das dem priesterlichen Träger zugehörige Efod.
- source_word: אֲשֶׁר עָלָיו
  choice: der sich darauf befand
  rationale: Die Relativkonstruktion beschreibt die Lage des Gurtes auf dem Efod, ohne über den Wortlaut hinaus eine bestimmte Befestigungsweise festzulegen.
- source_word: מִמֶּנּוּ הוּא
  choice: war aus demselben Stück
  rationale: Die Wendung betont, dass der Gurt kein unabhängiges Teil war, sondern aus dem Efod selbst hervorging beziehungsweise mit ihm eine Einheit bildete.
- source_word: כְּמַעֲשֵׂהוּ
  choice: ebenso gearbeitet wie das Efod
  rationale: Die Formulierung bezeichnet eine Übereinstimmung in Machart beziehungsweise Ausführung; das Bezugswort wird im Deutschen zur Klarheit wiederholt.
- source_word: זָהָב תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: Gold, blaues und purpurfarbenes Garn, Karmesingarn
  rationale: Die Farbbezeichnungen stehen in einer textilen Materialliste. „Garn“ macht diesen Zusammenhang natürlich verständlich, während Gold als eigenes Material stehen bleibt.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: gezwirntes feines Leinen
  rationale: Die Übersetzung bewahrt sowohl die hohe Qualität des Leinens als auch seine gezwirnte Verarbeitung.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: so, wie Jahwe es Mose geboten hatte
  rationale: Die Erfüllungsformel verweist auf ein zuvor erteiltes Gebot. Das Plusquamperfekt entspricht diesem narrativen Rückbezug; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt den offenbarten Gottesnamen direkt wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Efod“ bleibt als etablierter Fachbegriff für das priesterliche Gewand erhalten. Die Materialliste ist idiomatisch formuliert, ohne die sachliche Präzision des Hebräischen aufzugeben.
