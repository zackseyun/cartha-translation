  text: the turban of fine linen[a], the ornate caps of fine linen, and the undergarments of finely twisted linen,
translation:
  language: de
  text: den Turban aus feinem Leinen, die prächtigen Kappen aus feinem Leinen und die leinenen Beinkleider aus feinem, gezwirntem Leinen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wortstellung lässt die abschließende Wendung »feines, gezwirntes Leinen« besonders auf den letzten Gegenstand, die Beinkleider, bezogen hören; zugleich greift sie die Materialbeschreibung der priesterlichen Gewänder insgesamt auf.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּצְנֶפֶת
  choice: den Turban
  rationale: מִצְנֶפֶת bezeichnet hier die priesterliche Kopfbedeckung, besonders den Turban des Hohen Priesters. »Turban« ist im modernen Deutschen etabliert und präzise.
- source_word: שֵׁשׁ
  choice: feines Leinen
  rationale: שֵׁשׁ bezeichnet hochwertiges feines Leinen und nicht lediglich Leinen im Allgemeinen.
- source_word: פַּאֲרֵי הַמִּגְבָּעֹת
  choice: die prächtigen Kappen
  rationale: Die Verbindung bezeichnet die priesterlichen Kappen als schmuckvolle beziehungsweise prächtige Stücke; »prächtige Kappen« gibt diese attributive Bedeutung natürlich wieder.
- source_word: מִכְנְסֵי הַבָּד
  choice: die leinenen Beinkleider
  rationale: מִכְנָסַיִם bezeichnet die den Unterkörper bedeckenden priesterlichen Kleidungsstücke. »Beinkleider« ist würdig und genauer als das allgemeinere »Unterwäsche«; הַבָּד bezeichnet hier Leinen.
- source_word: מָשְׁזָר
  choice: fein gezwirnt
  rationale: מָשְׁזָר beschreibt gezwirntes beziehungsweise gedrehtes Garn. »Fein gezwirnt« gibt die textile Verarbeitung verständlich wieder.
