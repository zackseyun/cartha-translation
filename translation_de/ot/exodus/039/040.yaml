  text: the hangings of the court[a], its pillars and its bases, and the screen for the gate of the court, its ropes and its pegs, and all the utensils for the service of the tabernacle, for the tent of meeting[c][b];
translation:
  language: de
  text: die Behänge des Vorhofs, seine Säulen und seine Sockel, den Vorhang für den Eingang des Vorhofs, die Seile und die Pflöcke sowie alle Geräte für den Dienst der Wohnung, für das Zelt der Begegnung;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַלְעֵי
  choice: Behänge
  rationale: Bezeichnet die Stoffbahnen, die den Vorhof umgaben; „Behänge“ unterscheidet sie vom besonderen Eingangsvorhang.
- source_word: חָצֵר
  choice: Vorhof
  rationale: Bezeichnet hier den umschlossenen heiligen Außenbereich rund um die Wohnung; „Vorhof“ ist im deutschen Heiligtumsvokabular klar und etabliert.
- source_word: עַמֻּדֶיהָ
  choice: seine Säulen
  rationale: Gemeint sind die aufrechten Träger der Umfriedung; das grammatische Geschlecht richtet sich im Deutschen nach „Vorhof“.
- source_word: אֲדָנֶיהָ
  choice: seine Sockel
  rationale: Bezeichnet die Fundamentstücke, in welche die Säulen eingesetzt wurden; „Sockel“ ist präzise und natürlich.
- source_word: הַמָּסָךְ
  choice: den Vorhang
  rationale: Bezeichnet den abschirmenden Stoff am Eingang und bleibt von den umlaufenden „Behängen“ unterschieden.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: für den Eingang des Vorhofs
  rationale: שַׁעַר kann Tor oder Eingang bedeuten; bei einer textilen Öffnung ist „Eingang“ im Deutschen anschaulicher, ohne die Funktion zu verändern.
- source_word: מֵיתָרָיו
  choice: seine Seile
  rationale: Bezeichnet die Spannseile zur Befestigung der Anlage; das maskuline Suffix bezieht sich wahrscheinlich auf den Vorhof oder den Zusammenhang als Ganzes.
- source_word: וִיתֵדֹתֶיהָ
  choice: seine Pflöcke
  rationale: Gemeint sind in den Boden getriebene Befestigungspflöcke; die deutsche Pronominalform folgt der koordinierten Bezugnahme auf den Vorhof.
- source_word: כָּל כְּלֵי עֲבֹדַת
  choice: alle Geräte für den Dienst an
  rationale: כְּלִים ist ein weiter Sammelbegriff für Geräte und Gegenstände; עֲבֹדָה bezeichnet hier den kultischen Dienst beziehungsweise die dafür verrichtete Arbeit.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: Gibt die Grundbedeutung des hebräischen Heiligtumsnamens wieder und bewahrt dessen theologisches Bild einer göttlichen Wohnstätte.
- source_word: לְאֹהֶל מוֹעֵד
  choice: für das Zelt der Begegnung
  rationale: Bewahrt beide Bestandteile der festen Heiligtumsbezeichnung; die abschließende לְ-Phrase beschreibt die Zuordnung beziehungsweise Bestimmung der Dienstgeräte.
theological_decisions:
- issue: Verhältnis von „Wohnung“ und „Zelt der Begegnung“
  choice: 'Beide Bezeichnungen werden nebeneinander beibehalten: „an der Wohnung, für das Zelt der Begegnung“'
  alternative: Die Ausdrücke zu einer einzigen geglätteten Bezeichnung zusammenziehen
  rationale: Der hebräische Text setzt הַמִּשְׁכָּן und לְאֹהֶל מוֹעֵד ausdrücklich nebeneinander. Die etwas gespannte Formulierung bleibt erhalten, statt die genaue syntaktische oder sachliche Beziehung stillschweigend festzulegen.
translation_notes:
  register: Moderne, würdevolle Inventarsprache. Die Reihung und die leichte syntaktische Spannung des hebräischen Versfragments werden bewahrt; der Vers endet als Teil einer fortlaufenden Aufzählung mit Semikolon.
