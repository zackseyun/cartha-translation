  text: וְ/אֵ֨ת שְׁתֵּ֤י קְצוֹת֙ שְׁתֵּ֣י הָֽ/עֲבֹתֹ֔ת נָתְנ֖וּ עַל שְׁתֵּ֣י הַֽ/מִּשְׁבְּצֹ֑ת וַֽ/יִּתְּנֻ֛/ם עַל כִּתְפֹ֥ת הָ/אֵפֹ֖ד אֶל מ֥וּל פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/018.yaml
  text: And they put the two ends of the two braided chains on the two settings[a], and put them on the shoulder pieces of the ephod[b], at its front.
translation:
  language: de
  text: Die beiden Enden der beiden geflochtenen Ketten legten sie auf die beiden Fassungen und setzten sie vorn auf die Schulterstücke des Efods.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְצוֹת
  choice: Enden
  rationale: Bezeichnet hier die Endpunkte der Ketten; »Enden« ist im modernen Deutschen die natürliche und genaue Wiedergabe.
- source_word: הָעֲבֹתֹת
  choice: geflochtene Ketten
  rationale: Im Zusammenhang mit dem Efod bezeichnet das Wort kunstvoll gedrehte oder geflochtene Kettenarbeit, nicht gewöhnliche Schnüre.
- source_word: הַמִּשְׁבְּצֹת
  choice: Fassungen
  rationale: Gemeint sind die goldenen Einfassungen beziehungsweise Halterungen; »Fassungen« ist im Kontext von Schmuck- und Metallarbeit idiomatisch.
- source_word: נָתְנוּ / וַיִּתְּנֻם
  choice: befestigten / brachten … an
  rationale: נתן bedeutet grundsätzlich »geben, setzen, anbringen«. Die variierte deutsche Wiedergabe beschreibt die Montage natürlich, ohne über die konkrete Befestigungstechnik hinauszugehen.
- source_word: כִתְפֹת
  choice: Schulterstücke
  rationale: Im Gewandkontext sind die konstruktiven Schulterteile des Efods gemeint, nicht anatomische Schultern.
- source_word: אֶל מוּל פָּנָיו
  choice: vorn
  rationale: Die Wendung bezeichnet die Vorderseite beziehungsweise die nach vorn gerichtete Lage; »vorn« gibt dies knapp und natürlich wieder.
theological_decisions: []
