  text: 'and the second row: turquoise[a], sapphire, and diamond.'
translation:
  language: de
  text: 'und die zweite Reihe: Türkis[a], Saphir und Diamant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung mehrerer antiker Edelsteine ist unsicher. נֹפֶךְ kann auch mit „Smaragd“ oder „Karfunkel“ und יָהֲלֹם auch mit „Hyazinth“ oder „Jaspis“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: und die … Reihe
  rationale: טוּר bezeichnet im Zusammenhang mit den Edelsteinen der Brusttasche eine Reihe; וְ wird mit „und“ wiedergegeben.
- source_word: הַ/שֵּׁנִי
  choice: zweite
  rationale: Das Ordinalzahlwort bedeutet „zweite“ und stimmt mit dem femininen deutschen Substantiv „Reihe“ überein.
- source_word: נֹפֶךְ
  choice: Türkis
  rationale: Die genaue Bestimmung dieses antiken Edelsteins ist unsicher. „Türkis“ ist eine plausible moderne Entsprechung; andere traditionelle Deutungen werden in der Fußnote genannt.
- source_word: סַפִּיר
  choice: Saphir
  rationale: „Saphir“ ist die herkömmliche und wahrscheinlichste Entsprechung, auch wenn der antike Stein mineralogisch nicht genau dem heutigen Saphir entsprochen haben muss.
- source_word: וְ/יָהֲלֹם
  choice: und Diamant
  rationale: „Diamant“ ist eine verbreitete traditionelle Wiedergabe des unsicher bestimmten Edelsteinnamens; Alternativen werden in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Listenform des Hebräischen bleibt erhalten; der vorangestellte Anschluss „und“ wird bewahrt.
