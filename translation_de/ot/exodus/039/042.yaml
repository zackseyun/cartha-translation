id: EXO.39.42
reference: Exodus 39:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֤ן עָשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת כָּל הָ/עֲבֹדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/042.yaml
  text: According to all that Yahweh had commanded Moses[a], so the sons of Israel did all the work.
translation:
  language: de
  text: Ganz so, wie Jahwe es Mose geboten hatte, führten die Israeliten[a] die gesamte Arbeit aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Israels«; auch: »die Kinder Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: Ganz so, wie
  rationale: Die Vergleichs- und Übereinstimmungsformel bezeichnet die genaue Entsprechung zwischen Jahwes Gebot und Israels Ausführung. Die deutsche Wendung ist natürlich und bewahrt den Nachdruck von כֹּל.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Verb bedeutet „gebieten, befehlen“. Das Plusquamperfekt macht im Deutschen deutlich, dass das Gebot der ausgeführten Arbeit vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die geläufige deutsche Form.
- source_word: אֶת מֹשֶׁה
  choice: Mose
  rationale: Bei צוה kennzeichnet אֶת die beauftragte Person als direktes Objekt; „Mose gebieten“ ist idiomatisches Deutsch.
- source_word: כֵּן עָשׂוּ
  choice: führten … aus
  rationale: כֵּן nimmt die einleitende Entsprechungsformel auf, während עשה mit „Arbeit“ das Vollbringen beziehungsweise Ausführen bezeichnet. Die deutsche Satzgestalt gibt beides zusammen natürlich wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten[a]
  rationale: Wörtlich „die Söhne Israels“, hier jedoch die übliche kollektive Bezeichnung des Volkes. „Die Israeliten“ vermittelt die gemeinte Referenz in heutigem Deutsch, ohne sie nur auf männliche Personen einzuengen.
- source_word: אֵת כָּל הָעֲבֹדָה
  choice: die gesamte Arbeit
  rationale: עֲבֹדָה bezeichnet im Zusammenhang die Gesamtheit der Arbeiten am Heiligtum. „Die gesamte Arbeit“ bewahrt den umfassenden Sinn von כָּל.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Kollektive Bedeutung von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels; die Kinder Israels
  rationale: Die Formulierung lautet wörtlich „Söhne Israels“, fungiert hier aber als feste Bezeichnung für das ganze Bundesvolk. Die Fußnote erhält die formale Ausgangsform und ihre mögliche traditionelle Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung betont die vollständige Übereinstimmung der ausgeführten Arbeit mit Jahwes Gebot und vermeidet unnötig altertümliche Syntax.
