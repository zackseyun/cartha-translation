source:
  edition: WLC
  text: וְ/הַ/טּוּר֙ הָֽ/רְבִיעִ֔י תַּרְשִׁ֥ישׁ שֹׁ֖הַם וְ/יָשְׁפֵ֑ה מֽוּסַבֹּ֛ת מִשְׁבְּצ֥וֹת זָהָ֖ב בְּ/מִלֻּאֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/013.yaml
  text: 'and the fourth row: beryl[a], onyx, and jasper[b], mounted in settings of gold in their mountings.'
translation:
  language: de
  text: 'und die vierte Reihe: Chrysolith[a], Onyx und Jaspis; sie waren in goldene Fassungen eingesetzt[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung mehrerer Edelsteine am Brustschmuck des Hohenpriesters ist unsicher; auch „Beryll“ oder „Topas“ sind als Wiedergabe möglich. Entsprechendes gilt für „Onyx“ und „Jaspis“.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher möglicherweise: „mit goldenen Fassungen umgeben, in ihren Einsetzungen“. Die hebräische Fachformulierung kann die Art bezeichnen, wie die Steine in die für sie vorgesehenen Fassungen eingesetzt waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: und die vierte Reihe
  rationale: טוּר bezeichnet in der Edelsteinliste des Brustschmucks eine Reihe; die Konjunktion wird beibehalten.
- source_word: תַּרְשִׁישׁ
  choice: Chrysolith
  rationale: Die genaue Bestimmung des antiken Edelsteins ist unsicher. „Chrysolith“ ist eine verbreitete traditionelle deutsche Entsprechung, ohne die Unsicherheit zu verdecken.
- source_word: שֹׁהַם
  choice: Onyx
  rationale: „Onyx“ ist die geläufige knappe Wiedergabe im Zusammenhang der priesterlichen Ausstattung, obwohl die mineralogische Bestimmung nicht völlig sicher ist.
- source_word: וְיָשְׁפֵה
  choice: und Jaspis
  rationale: יָשְׁפֵה entspricht wahrscheinlich dem als Jaspis bezeichneten Schmuckstein; die Konjunktion wird ausdrücklich wiedergegeben.
- source_word: מֽוּסַבֹּת מִשְׁבְּצֹת זָהָב בְּמִלֻּאֹתָם
  choice: sie waren in goldene Fassungen eingesetzt
  rationale: Die technische Formulierung beschreibt das Einfassen beziehungsweise Einsetzen der Steine in goldene Halterungen. Die natürliche deutsche Wiedergabe vermeidet eine unverständliche wörtliche Doppelung, während eine Fußnote die Unsicherheit der Konstruktion bewahrt.
