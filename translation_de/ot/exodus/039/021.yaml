source:
  edition: WLC
  text: וַ/יִּרְכְּס֣וּ אֶת הַ/חֹ֡שֶׁן מִ/טַּבְּעֹתָי/ו֩ אֶל טַבְּעֹ֨ת הָ/אֵפֹ֜ד בִּ/פְתִ֣יל תְּכֵ֗לֶת לִֽ/הְיֹת֙ עַל חֵ֣שֶׁב הָ/אֵפֹ֔ד וְ/לֹֽא יִזַּ֣ח הַ/חֹ֔שֶׁן מֵ/עַ֖ל הָ/אֵפֹ֑ד כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/021.yaml
  text: They fastened the breastpiece by its rings to the rings of the ephod with a cord of blue[a], so that it would be on the skillfully woven band of the ephod, and so that the breastpiece would not come loose from on the ephod[b], just as Yahweh had commanded Moses.
translation:
  language: de
  text: Sie befestigten die Brusttasche[a] mit ihren Ringen an den Ringen des Efods mit einer blauen Schnur, damit sie auf der kunstvoll gewebten Binde[b] des Efods lag und die Brusttasche sich nicht vom Efod löste – so, wie Jahwe es Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell wird „Brusttasche“ auch mit „Brustschild“ wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: Für „kunstvoll gewebte Binde“ ist auch „Gürtelbinde“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכְּסוּ
  choice: sie befestigten
  rationale: Das Verb bezeichnet hier das sichere Verbinden von Teilen; „befestigten“ ist im Zusammenhang der priesterlichen Kleidung präzise und natürlich.
- source_word: הַחֹשֶׁן
  choice: die Brusttasche
  rationale: Der Gegenstand war ein am Efod getragenes, mit Edelsteinen besetztes Behältnis; „Brusttasche“ vermeidet die irreführende Vorstellung eines Rüstungsteils, die „Brustschild“ hervorrufen kann.
- source_word: מִטַּבְּעֹתָיו ... אֶל טַבְּעֹת הָאֵפֹד
  choice: mit ihren Ringen an den Ringen des Efods
  rationale: Die deutschen Präpositionen geben sowohl das Mittel als auch das Ziel der Befestigung idiomatisch wieder.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: mit einer Schnur aus blauem Purpur
  rationale: פְתִיל bezeichnet eine Schnur oder Kordel; תְּכֵלֶת meint den kostbaren blau bis blauviolett gefärbten Stoff beziehungsweise Farbstoff, der traditionell als „blauer Purpur“ bezeichnet wird.
- source_word: לִהְיוֹת עַל חֵשֶׁב הָאֵפֹד
  choice: sodass sie auf der kunstvoll gewebten Binde des Efods saß
  rationale: חֵשֶׁב bezeichnet hier die verzierte, gewebte Binde am Efod. „saß“ drückt die beabsichtigte feste Lage im Deutschen natürlich aus.
- source_word: וְלֹא יִזַּח ... מֵעַל הָאֵפֹד
  choice: und sich ... nicht vom Efod löste
  rationale: Die Form beschreibt, dass die Brusttasche nicht verrutscht oder sich von ihrer vorgesehenen Lage entfernt. „sich nicht ... löste“ passt zum Befestigungsvorgang und gibt מֵעַל im Deutschen idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im modernen Deutschen übliche Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. Die Wiedergabe als „Jahwe“ wahrt den Charakter eines Eigennamens, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung von חֹשֶׁן als kultischer Gegenstand
  choice: Brusttasche
  alternative: Brustschild
  rationale: „Brusttasche“ betont Form und Funktion des priesterlichen Kleidungsstücks, ohne eine militärische Bedeutung einzutragen; die traditionelle Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem Ablauf des Hebräischen, wird aber durch „und zwar“ und „sodass“ flüssig gegliedert. Kultische Fachbegriffe werden verständlich formuliert; „Efod“ bleibt als etablierte Bezeichnung erhalten.
