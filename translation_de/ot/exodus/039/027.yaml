  language: en
  yaml_path: translation/ot/exodus/039/027.yaml
  text: They made the tunics of fine linen[a], the work of a weaver, for Aaron and for his sons.
translation:
  language: de
  text: Sie fertigten die Untergewänder aus feinem Leinen in Weberarbeit für Aaron und seine Söhne an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Sie fertigten … an
  rationale: Das Qal-Wayyiqtol von עשה führt die nächste Handlung im Erzählablauf ein. „Fertigten … an“ ist für die Herstellung von Kleidung natürlich und gibt den handwerklichen Zusammenhang präzise wieder; das ו wird im deutschen Erzählfluss nicht eigens mit „und“ abgebildet.
- source_word: הַכָּתְנֹת
  choice: die Untergewänder
  rationale: כֻּתֹּנֶת bezeichnet ein am Körper getragenes, hemdartiges Kleidungsstück. „Untergewänder“ ist im Zusammenhang der Priesterkleidung verständlich und genauer als das allgemeinere „Gewänder“.
- source_word: שֵׁשׁ
  choice: aus feinem Leinen
  rationale: שֵׁשׁ bezeichnet im Heiligtums- und Priesterkontext feines Leinen. Die Präposition „aus“ macht im Deutschen idiomatisch deutlich, dass es sich um das Material handelt.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: in Weberarbeit
  rationale: Die Konstruktverbindung bezeichnet durch Weben hergestellte Arbeit. „In Weberarbeit“ bewahrt die Betonung des Herstellungsverfahrens und klingt im Deutschen natürlich.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: für Aaron und seine Söhne
  rationale: Die Ziel- beziehungsweise Zweckangabe wird mit „für“ klar wiedergegeben. Die Wiederholung der hebräischen Präposition muss im Deutschen nicht wiederholt werden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit handwerklich präziser Wortwahl. Die knappe Satzstruktur des Hebräischen bleibt erhalten, ohne im Deutschen hölzern zu wirken.
