  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des Hebräischen treffend wieder: die Herstellung, die Tuniken/Untergewänder, feines Leinen, die als Weberarbeit bezeichnete Ausführung sowie die Bestimmung für Aaron und seine Söhne. Die im Deutschen nicht wiederholte Präposition bei „Aaron und seine Söhne“ ist idiomatisch und ohne Bedeutungsverlust.'
