  text: And they put the two gold cords on the two rings at the ends of the breastpiece[a].
translation:
  language: de
  text: Und sie befestigten die beiden Schnüre aus Gold an den beiden Ringen an den Enden des Brustschilds.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die beiden Ketten aus Gold“. Das hebräische Wort kann gedrehte Schnüre oder kettenartige Stränge bezeichnen; hier bestehen sie aus Gold und sind am Brustschild befestigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Und sie befestigten
  rationale: נתן bedeutet hier wörtlich „geben/legen“, bezeichnet in dieser Konstruktionsbeschreibung aber das Anbringen der Schnüre an den Ringen. „Befestigten“ gibt die konkrete Handlung im Deutschen natürlich wieder.
- source_word: שְׁתֵּי הָעֲבֹתֹת הַזָּהָב
  choice: die beiden goldenen Schnüre
  rationale: עֲבֹתֹת bezeichnet gedrehte Schnüre oder kettenartige Stränge; „goldene Schnüre“ bewahrt das Grundbild und gibt das Material idiomatisch an.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: an den beiden Ringen
  rationale: עַל kann bei einer Befestigung am Gegenstand im Deutschen natürlich mit „an“ wiedergegeben werden; טַבָּעוֹת sind die Ringe der priesterlichen Ausstattung.
- source_word: עַל קְצוֹת הַחֹשֶׁן
  choice: an den Enden der Brusttasche
  rationale: קְצוֹת bezeichnet die Enden oder äußersten Stellen. חֹשֶׁן ist das am Brustbereich getragene priesterliche Behältnis; „Brusttasche“ ist im modernen Deutsch anschaulich und berücksichtigt seine taschenartige Ausführung.
theological_decisions: []
translation_notes:
