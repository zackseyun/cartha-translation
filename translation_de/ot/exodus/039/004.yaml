  yaml_path: translation/ot/exodus/039/004.yaml
  text: They made for it shoulder pieces[a], joined to it; at its two ends it was joined.
translation:
  language: de
  text: Sie fertigten für ihn Schulterstücke[a] an, die an seinen beiden Enden befestigt waren; dort war er zusammengefügt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schulterbänder“. Das hebräische Wort bezeichnet die Teile des Efods, die auf den Schultern lagen und seine Abschnitte miteinander verbanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפֹת
  choice: Schulterstücke
  rationale: Der Plural bezeichnet hier die auf den Schultern liegenden Konstruktionsteile des Efods. „Schulterstücke“ ist konkret und lässt die genauere Form offen.
- source_word: עָשׂוּ
  choice: sie fertigten … an
  rationale: Das gewöhnliche Verb עשה bedeutet „machen, anfertigen“; bei der Herstellung eines Gewandes klingt „anfertigen“ im Deutschen natürlich.
- source_word: ל/וֹ
  choice: für ihn
  rationale: Das maskuline Suffix bezieht sich im Kontext auf den Efod, der im Deutschen ebenfalls maskulin ist.
- source_word: חֹבְרֹת
  choice: die miteinander verbunden waren
  rationale: Die feminine Pluralform bezieht sich am naheliegendsten auf die Schulterstücke und beschreibt sie als verbunden beziehungsweise verbindend. Die Wiedergabe wahrt das Motiv des Zusammenfügens, ohne eine nicht ausdrücklich bezeichnete Befestigungsweise festzulegen.
- source_word: עַל שְׁנֵי קצוות/ו
  choice: an seinen beiden Enden
  rationale: עַל wird in dieser räumlichen Verbindung idiomatisch mit „an“ wiedergegeben; קצוות bezeichnet die beiden Enden oder äußersten Bereiche des Efods.
- source_word: חֻבָּר
  choice: wurde er zusammengefügt
  rationale: Das Pual von חבר ist passiv und maskulin Singular; daher bezieht es sich wahrscheinlich auf den Efod. „Zusammengefügt“ erhält die lexikalische Verbindung zu חֹבְרֹת.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Efod“ wird in diesem Einzelvers nicht ergänzt, da der hebräische Text nur pronominal darauf zurückverweist. Die Wiederaufnahme des Verbindungswortfeldes bildet die betonte Konstruktion des Hebräischen ab.
