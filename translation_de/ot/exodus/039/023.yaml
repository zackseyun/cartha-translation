id: EXO.39.23
reference: Exodus 39:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/פִֽי הַ/מְּעִ֥יל בְּ/תוֹכ֖/וֹ כְּ/פִ֣י תַחְרָ֑א שָׂפָ֥ה לְ/פִ֛י/ו סָבִ֖יב לֹ֥א יִקָּרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/023.yaml
  text: And the opening of the robe was in the middle of it[a], like the opening of a coat of mail, with a binding around its opening, so that it would not be torn.
translation:
  language: de
  text: Die Öffnung des Obergewands lag in seiner Mitte, wie die Öffnung eines Panzerhemds[a]. Rings um die Öffnung verlief eine Einfassung, damit sie nicht einriss.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „wie die Öffnung einer Rüstung“ beziehungsweise „eines Brustpanzers“. Das hebräische Wort תַּחְרָא ist selten und bezeichnet ein schützendes Rüstungsstück.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי
  choice: Öffnung
  rationale: Im Zusammenhang mit einem Kleidungsstück bezeichnet פֶּה idiomatisch dessen Öffnung, hier den Halsausschnitt, nicht wörtlich einen Mund.
- source_word: הַמְּעִיל
  choice: das Obergewand
  rationale: מְעִיל bezeichnet ein über der übrigen Kleidung getragenes Gewand. „Obergewand“ ist im priesterlichen Kontext präzise und in modernem Deutsch verständlich.
- source_word: בְּתוֹכוֹ
  choice: in seiner Mitte
  rationale: Die Wendung beschreibt die mittige Lage der Öffnung im Gewand; die knappe Form wahrt die räumliche Aussage des Hebräischen.
- source_word: כְּפִי תַחְרָא
  choice: wie die Öffnung eines Panzerhemds
  rationale: תַּחְרָא ist ein seltenes Wort für ein schützendes Rüstungsstück. „Panzerhemd“ gibt die wahrscheinlichste Bedeutung anschaulich wieder, während die Fußnote die lexikalische Unsicherheit bewahrt.
- source_word: שָׂפָה
  choice: Einfassung
  rationale: Das wörtliche „Lippe/Rand“ bezeichnet hier den verstärkten Abschluss der Stofföffnung. „Einfassung“ gibt diese Funktion natürlich wieder.
- source_word: לְפִיו סָבִיב
  choice: rings um die Öffnung
  rationale: Die Formulierung macht deutlich, dass die verstärkende Einfassung die gesamte Öffnung umgab.
- source_word: לֹא יִקָּרֵעַ
  choice: damit sie nicht einriss
  rationale: Der Nifal-Imperfekt bezeichnet hier zweck- oder folgebezogen, dass die eingefasste Öffnung vor dem Einreißen geschützt war.
theological_decisions: []
