  text: וַ/יָּבִ֤יאוּ אֶת הַ/מִּשְׁכָּן֙ אֶל מֹשֶׁ֔ה אֶת הָ/אֹ֖הֶל וְ/אֶת כָּל כֵּלָ֑י/ו קְרָסָ֣י/ו קְרָשָׁ֔י/ו בריח/ו וְ/עַמֻּדָ֥י/ו וַ/אֲדָנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/033.yaml
  text: 'Then they brought the tabernacle to Moses—the tent and all its furnishings: its clasps[a], its frames, its bars, its pillars[b], and its bases.'
translation:
  language: de
  text: 'Dann brachten sie die Wohnung zu Mose: das Zelt und alle seine Bestandteile – seine Klammern, seine Rahmen[a], seine Riegel, seine Säulen und seine Sockel[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Bretter“. Das hebräische Wort bezeichnet die aufrechten tragenden Bauteile der Wohnung.
    reason: lexical_alternative
  - marker: b
    text: Oder „Fußstücke“. Gemeint sind die Grundelemente, in die Rahmen oder Säulen eingesetzt wurden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: Dann brachten sie
  rationale: Die Wayyiqtol-Form führt die Erzählung mit dem nächsten Handlungsschritt fort; „Dann“ gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: מִשְׁכָּן bezeichnet hier Gottes heilige Wohnstätte. „Wohnung“ bewahrt den Bezug zum hebräischen Wortstamm und ist im Exodus-Kontext verständlich; das folgende „das Zelt“ erläutert die konkrete Anlage.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: אֶל bezeichnet hier die Richtung auf eine Person hin; „zu Mose“ entspricht dem schlichten Sinn.
- source_word: הָאֹהֶל
  choice: das Zelt
  rationale: אֹהֶל bedeutet gewöhnlich „Zelt“ und steht hier als nähere Bestimmung beziehungsweise als Bestandteil der Wohnung.
- source_word: כָּל כֵּלָיו
  choice: alle seine Bestandteile
  rationale: כֵּלִים ist ein weiter Begriff für Gegenstände, Geräte oder Ausrüstung. Da anschließend vor allem Bauteile genannt werden, ist „Bestandteile“ im Deutschen sachlich passend und natürlich.
- source_word: קְרָסָיו
  choice: seine Klammern
  rationale: קְרָסִים bezeichnet in den Beschreibungen der Wohnung Verbindungselemente für die Zeltbahnen; „Klammern“ gibt ihre Funktion knapp wieder.
- source_word: קְרָשָׁיו
  choice: seine Rahmen
  rationale: קְרָשִׁים sind die aufrechten tragenden Bauteile der Wohnung. „Rahmen“ beschreibt ihre bauliche Funktion besser als das traditionelle „Bretter“, ohne die genaue Form unnötig festzulegen.
- source_word: בריחו
  choice: seine Riegel
  rationale: בְּרִיחַ bezeichnet die längs verlaufenden Verbindungselemente, welche die Rahmen zusammenhielten; „Riegel“ ist die übliche sachliche Wiedergabe.
- source_word: עַמֻּדָיו
  choice: seine Säulen
  rationale: עַמּוּד bezeichnet senkrechte Stützen; „Säulen“ ist im Deutschen klar und in diesem Kontext etabliert.
- source_word: אֲדָנָיו
  choice: seine Sockel
  rationale: אֶדֶן bezeichnet die Fundament- oder Fußstücke, in welche Rahmen beziehungsweise Säulen eingesetzt wurden. „Sockel“ ist präzise und allgemein verständlich.
