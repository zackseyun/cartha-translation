  text: רָב֧וּעַ הָיָ֛ה כָּפ֖וּל עָשׂ֣וּ אֶת הַ/חֹ֑שֶׁן זֶ֧רֶת אָרְכּ֛/וֹ וְ/זֶ֥רֶת רָחְבּ֖/וֹ כָּפֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/009.yaml
  text: It was square; they made the breastpiece doubled[a], a span its length and a span its width, doubled.
translation:
  language: de
  text: 'Es war quadratisch; sie fertigten das Brustschild doppelt[a] an: eine Spanne lang und eine Spanne breit, doppelt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „doppelt gelegt“. Das hebräische Wort kann eine zweilagige oder umgeschlagene Ausführung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: quadratisch
  rationale: Gibt die vierseitige, quadratische Form im modernen Deutschen natürlich und genau wieder.
- source_word: הָיָה
  choice: es war
  rationale: Das Verb dient hier als Kopula und beschreibt die Form der Brusttasche.
- source_word: כָּפוּל
  choice: doppelt
  rationale: Bewahrt die mögliche Bedeutung einer zweilagigen oder umgeschlagenen Ausführung, ohne die Art der Herstellung vorschnell festzulegen.
- source_word: עָשׂוּ
  choice: sie fertigten … an
  rationale: Eine natürliche deutsche Wiedergabe für das Herstellen eines kunsthandwerklichen Gegenstands.
- source_word: הַחֹשֶׁן
  choice: die Brusttasche
  rationale: Bezeichnet den am Brustbereich getragenen priesterlichen Gegenstand; „Brusttasche“ ist im Deutschen verständlich und lässt seine offenbar taschenartige, doppelte Ausführung erkennen, ohne die im Vers nicht stehende Ergänzung „des Rechtsspruchs“ einzufügen.
- source_word: זֶרֶת
  choice: eine Spanne
  rationale: Behält das antike Längenmaß bei und entspricht dem hebräischen Maßbegriff unmittelbar.
- source_word: אָרְכּוֹ
  choice: lang
  rationale: Die idiomatische Maßangabe „eine Spanne lang“ gibt „seine Länge“ natürlich wieder.
- source_word: רָחְבּוֹ
  choice: breit
  rationale: Die idiomatische Maßangabe „eine Spanne breit“ entspricht „seine Breite“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „doppelt“ bleibt entsprechend dem Hebräischen erhalten; der Doppelpunkt gliedert die anschließenden Maßangaben, ohne eine zeitliche Deutung wie „im gefalteten Zustand“ hinzuzufügen.
