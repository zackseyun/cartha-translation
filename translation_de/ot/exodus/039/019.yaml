  text: They made two gold rings and put them on the two ends of the breastpiece[b][a], on its edge that was on the inner side toward the ephod.
translation:
  language: de
  text: Sie fertigten zwei goldene Ringe an und brachten sie an den beiden Enden der Brusttasche an, an ihrem Rand auf der dem Efod zugewandten Innenseite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an ihrem Rand, der dem Efod zugewandt war“; auch möglich: „der dem Efod gegenüberlag“. Wörtlich: „einwärts“ beziehungsweise „nach innen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: goldene Ringe
  rationale: טַבַּעַת bezeichnet hier Befestigungsringe; die Materialangabe wird im Deutschen natürlich als Adjektiv wiedergegeben.
- source_word: הַחֹשֶׁן
  choice: die Brusttasche
  rationale: חֹשֶׁן bezeichnet im Zusammenhang der priesterlichen Kleidung ein auf der Brust getragenes, taschenartig gefaltetes Schmuckstück; „Brusttasche“ vermeidet die irreführende Vorstellung eines Rüstungsteils.
- source_word: שְׂפָתוֹ
  choice: an ihrem Rand
  rationale: שָׂפָה bedeutet wörtlich „Lippe“ und bei einem gefertigten Gegenstand idiomatisch „Rand“.
- source_word: שְׁנֵי קְצוֹת
  choice: an den beiden Enden
  rationale: קָצֶה bezeichnet ein Ende oder äußerstes Stück; „Enden“ wahrt die räumliche Aussage, ohne eine bestimmte Form wie Ecken vorauszusetzen.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: der nach innen zum Efod hin lag
  rationale: Die Wendung bestimmt die dem Efod zugewandte innere Seite. Die Übersetzung verbindet die räumliche Ausrichtung von אֶל עֵבֶר mit dem adverbialen בָּיְתָה, ohne die mögliche Nuance „gegenüber“ zu verschweigen.
- source_word: וַיָּשִׂימוּ עַל
  choice: und brachten sie an
  rationale: שׂוּם עַל bedeutet „auf/an etwas setzen oder anbringen“; bei Befestigungsringen ist „anbringen“ im Deutschen sachgerecht und natürlich.
