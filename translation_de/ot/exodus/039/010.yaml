  text: וַ/יְמַלְאוּ ב֔/וֹ אַרְבָּעָ֖ה ט֣וּרֵי אָ֑בֶן ט֗וּר אֹ֤דֶם פִּטְדָה֙ וּ/בָרֶ֔קֶת הַ/טּ֖וּר הָ/אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/010.yaml
  text: 'And they mounted on it four rows of stones: the first row was a ruby[a], a topaz, and an emerald.'
translation:
  language: de
  text: 'Sie setzten darin vier Reihen von Steinen ein: Die erste Reihe bestand aus einem Karneol[a], einem Topas und einem Smaragd.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung dieser Edelsteine ist unsicher. אֹדֶם bezeichnet wahrscheinlich einen roten Stein und wird auch mit „Rubin“ wiedergegeben; für פִּטְדָה ist „Chrysolith“ eine mögliche Alternative zu „Topas“. בָרֶקֶת kann einen anderen glänzenden oder grünen Schmuckstein bezeichnen als einen Smaragd.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלְאוּ
  choice: sie besetzten
  rationale: Das Verb bedeutet wörtlich „füllen“. Im Zusammenhang mit Edelsteinen, die am Brustschild angebracht beziehungsweise in Fassungen eingesetzt werden, gibt „besetzten“ den handwerklichen Sinn natürlich wieder.
- source_word: בּוֹ
  choice: ihn
  rationale: Das Suffix verweist auf den im Kontext genannten Brustschild. Bei „mit Steinen besetzen“ steht das Bezugswort im Akkusativ.
- source_word: אַרְבָּעָה טוּרֵי אָבֶן
  choice: vier Reihen von Steinen
  rationale: טוּרֵי bezeichnet Reihen; אָבֶן wird kollektiv gebraucht. Die Formulierung ist im Deutschen klar und bewahrt die Struktur des Hebräischen.
- source_word: טוּר
  choice: Reihe
  rationale: Die Wiederholung greift die zuvor genannten vier Reihen auf und führt die Steine der ersten Reihe an.
- source_word: אֹדֶם
  choice: Karneol
  rationale: Die genaue Bestimmung ist unsicher. Das Wort bezeichnet wahrscheinlich einen roten Schmuckstein; „Karneol“ ist dafür eine verbreitete und sachlich plausible Wiedergabe.
- source_word: פִּטְדָה
  choice: Topas
  rationale: Die genaue mineralogische Zuordnung ist unsicher; „Topas“ ist die geläufige traditionelle Wiedergabe.
- source_word: בָרֶקֶת
  choice: Smaragd
  rationale: Der Name hängt wahrscheinlich mit Glanz oder Aufleuchten zusammen. „Smaragd“ folgt der verbreiteten traditionellen Wiedergabe, ohne eine sichere mineralogische Identifikation zu behaupten.
- source_word: הַטּוּר הָאֶחָד
  choice: in der ersten Reihe waren
  rationale: Wörtlich steht „die eine Reihe“. Im Aufzählungskontext ist damit die erste von vier Reihen gemeint; das Verb „waren“ wird für natürliches Deutsch ergänzt.
theological_decisions: []
