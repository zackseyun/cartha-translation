  text: Und er fertigte das Efod aus Gold, blauem und purpurfarbenem Garn, Karmesingarn und feinem gezwirntem Leinen an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Und er fertigte … an
  rationale: Das Wayyiqtol führt die Erzählung mit einer einfachen vergangenen Handlung fort. „Anfertigen“ passt natürlich zur Herstellung eines kunstvollen Kleidungsstücks.
- source_word: הָאֵפֹד
  choice: das Efod
  rationale: אֵפוֹד bezeichnet ein besonderes priesterliches Kleidungsstück. Der etablierte kultische Fachbegriff wird in eingedeutschter Schreibweise beibehalten.
- source_word: זָהָב
  choice: Gold
  rationale: Der Vers nennt schlicht das verwendete Material. Dass das Gold nach dem unmittelbaren Kontext zu Fäden verarbeitet wurde, wird hier nicht eigens in den Wortlaut eingetragen.
- source_word: תְּכֵלֶת
  choice: blauem … Garn
  rationale: Der Ausdruck bezeichnet blau gefärbtes Textilmaterial. „Garn“ wird aus dem textilen Zusammenhang ergänzt und gemeinsam mit den folgenden Farbbezeichnungen gebraucht.
- source_word: וְאַרְגָּמָן
  choice: purpurfarbenem Garn
  rationale: Der Ausdruck bezeichnet das kostbare purpurfarbene Textilmaterial; die Farbangabe wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: וְתוֹלַעַת שָׁנִי
  choice: Karmesingarn
  rationale: Die hebräische Verbindung bezeichnet mit Karmesin beziehungsweise Scharlach gefärbtes Material; im Kontext ist Garn gemeint.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: gezwirntem feinem Leinen
  rationale: שֵׁשׁ bezeichnet feines Leinen, מָשְׁזָר dessen gezwirnte beziehungsweise mehrfach verdrehte Verarbeitung. Die Wiedergabe bewahrt beide Merkmale.
