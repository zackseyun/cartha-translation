  text: וְ֠/הָ/אֲבָנִים עַל שְׁמֹ֨ת בְּנֵי יִשְׂרָאֵ֥ל הֵ֛נָּה שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ לִ/שְׁנֵ֥ים עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/014.yaml
  text: And the stones corresponded to the names of the sons of Israel[a], twelve according to their names, engraved like a signet, each according to its name[c][b], for the twelve tribes.
translation:
  language: de
  text: Die Steine entsprachen den Namen der Söhne Israels[a][c]. Es waren zwölf, ihren Namen entsprechend, mit Siegelgravuren versehen[b], jeder mit seinem Namen, für die zwölf Stämme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „trugen die Namen der Söhne Israels“. Die hebräische Präposition kann hier eine enge Zuordnung oder Entsprechung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit Siegelgravuren“. Gemeint ist die Art der Einschnitzung, wie bei einer in ein Siegel geschnittenen Inschrift.'
    reason: lexical_alternative
  - marker: c
    text: „Söhne Israels“ ist eine traditionelle Bundes- und Herkunftsbezeichnung für das von Israel abstammende Volk.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: Die Steine
  rationale: Das bestimmte Substantiv bezeichnet im Zusammenhang die am Brustschild angebrachten Steine. „Edelsteine“ wäre kontextuell möglich, geht aber über die lexikalische Grundbedeutung hinaus.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: entsprachen den Namen der Söhne Israels
  rationale: עַל bezeichnet hier Zuordnung beziehungsweise Entsprechung, nicht bloß eine räumliche Lage. Die Formulierung gibt diese Beziehung in natürlichem Deutsch wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  rationale: Die Wiedergabe bleibt eng bei der hebräischen Bundes- und Herkunftsbezeichnung und bewahrt deren männliche Pluralform.
- source_word: הֵנָּה שְׁתֵּים עֶשְׂרֵה
  choice: Es waren zwölf
  rationale: Das ausdrückliche Pronomen mit der Zahl wird als vollständige deutsche Prädikation wiedergegeben und hebt die Anzahl hervor.
- source_word: עַל שְׁמֹתָם
  choice: ihren Namen entsprechend
  rationale: Die Formulierung bewahrt die wiederholte Zuordnungsstruktur des hebräischen Verses.
- source_word: פִּתּוּחֵי חֹתָם
  choice: wie ein Siegel graviert
  rationale: Die Wendung beschreibt eine Gravur nach Art der Siegelstecherei. Die gewählte Form ist verständlich und erhält das Bild des Siegels.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: jeder mit seinem Namen
  rationale: 'אִישׁ wird distributiv verstanden: Jeder einzelne Stein war dem jeweiligen Namen zugeordnet und trug ihn. Das maskuline Pronomen entspricht im Deutschen dem Genus von „Stein“.'
- source_word: לִשְׁנֵים עָשָׂר שָׁבֶט
  choice: für die zwölf Stämme
  rationale: לְ bezeichnet hier die Beziehung beziehungsweise repräsentative Zuordnung zu den zwölf Stämmen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der aufzählenden Struktur des Hebräischen, wird aber durch den Doppelpunkt und einen vollständigen deutschen Satz gegliedert. Die Wiederholung von „Namen“ bleibt erhalten, weil sie die Zuordnung der zwölf Steine zu den zwölf Stämmen prägt.
