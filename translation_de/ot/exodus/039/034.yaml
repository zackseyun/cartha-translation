lexical_decisions:
- source_word: מִכְסֵה
  choice: Decke
  rationale: Das Substantiv bezeichnet hier eine Bedeckung des Heiligtums. »Decke« ist im Deutschen natürlich und wahrt die substantivische Form.
- source_word: עוֹרֹת הָאֵילִם הַמְאָדָּמִים
  choice: rot gefärbte Widderfelle
  rationale: Die Formulierung gibt sowohl die Tierart als auch den wahrscheinlich durch Bearbeitung entstandenen roten Farbton wieder.
- source_word: עֹרֹת הַתְּחָשִׁים
  choice: feines Leder
  rationale: Da die Bedeutung von תְּחָשִׁים unsicher ist, vermeidet diese verständliche Wiedergabe die unbelegte Festlegung auf eine bestimmte Tierart; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: den abschirmenden Vorhang
  rationale: Die attributive deutsche Formulierung gibt die Funktion des inneren Vorhangs als Abschirmung natürlich wieder, ohne zwei im Deutschen schwerfällig verbundene Substantive zu erzwingen.
