  footnotes:
  - marker: a
    text: Die Bedeutung von תְּחָשִׁים (tachashim) ist unsicher. Gemeint sein könnten Felle einer bestimmten Tierart; traditionell werden unter anderem Delfin- oder Dugongfelle angenommen. Möglich ist auch die Wiedergabe »Tachaschfelle«.
