lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Und er fertigte ... an
  rationale: Die Erzählform führt die Abfolge fort; „anfertigen“ ist bei einem kunsthandwerklich hergestellten Kleidungsstück natürlich und gibt עשה sachgerecht wieder.
- source_word: מְעִיל הָאֵפֹד
  choice: das Obergewand des Efods
  rationale: מְעִיל bezeichnet hier ein priesterliches Obergewand; die Genitivverbindung mit dem technischen Begriff „Efod“ bleibt erhalten.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: in Weberarbeit
  rationale: Die kompakte deutsche Handwerksbezeichnung entspricht wörtlich dem „Werk eines Webers“, ohne die nicht ausdrücklich genannte Wertung „kunstvoll“ oder „geschickt“ hinzuzufügen.
- source_word: כְּלִיל
  choice: ganz aus
  rationale: Die Formulierung bezeichnet die vollständige Beschaffenheit des Gewandes und verbindet sich im Deutschen natürlich mit dem textilen Material.
- source_word: תְּכֵלֶת
  choice: blauem Purpur
  rationale: Der traditionelle deutsche Sachbegriff bezeichnet den kostbaren blau gefärbten Textilstoff beziehungsweise das entsprechende Garn; die Fußnote erläutert die historische Materialbedeutung.
