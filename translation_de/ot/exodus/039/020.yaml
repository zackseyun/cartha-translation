base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/020.yaml
  text: They made two gold rings and put them on the two shoulder pieces of the ephod[a], below, on its front side, opposite its joining[b], above the skillfully woven band of the ephod.
translation:
  language: de
  text: Sie fertigten zwei goldene Ringe an und brachten sie unten an den beiden Schulterstücken des Efods an, auf seiner Vorderseite, gegenüber seiner Verbindungsstelle[a], oberhalb des kunstvoll gewebten Gürtels[b] des Efods.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entsprechend seiner Verbindung“ beziehungsweise „gegenüber seinem Befestigungspunkt“. Das hebräische Wort bezeichnet die Stelle, an der Teile des Efods miteinander verbunden wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „des gewebten Gurtbands“. Das hebräische Wort bezeichnet das gürtelartige, gewebte Befestigungsstück des Efods.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת
  choice: Ringe
  rationale: Das Substantiv bezeichnet hier metallene Ringe, die zur Befestigung am priesterlichen Gewand dienen.
- source_word: כִתְפֹת
  choice: Schulterstücke
  rationale: Im Zusammenhang des Efods sind Bestandteile des Gewands gemeint, nicht lediglich die anatomischen Schultern.
- source_word: מִלְמַטָּה
  choice: unten
  rationale: Die Angabe bezeichnet die Lage am unteren Teil der Schulterstücke und lässt sich knapp und natürlich mit „unten“ wiedergeben.
- source_word: מִמּוּל פָּנָיו
  choice: auf seiner Vorderseite
  rationale: Wörtlich ist vom Bereich vor dem „Gesicht“ des Gegenstands die Rede; bei einem Gewand bezeichnet dies idiomatisch seine Vorderseite.
- source_word: לְעֻמַּת
  choice: gegenüber
  rationale: Die Präposition beschreibt eine räumliche Zuordnung oder Entsprechung; „gegenüber“ bewahrt diese Beziehung, ohne sie genauer festzulegen.
- source_word: מֶחְבַּרְתּוֹ
  choice: seiner Verbindungsstelle
  rationale: Das Wort bezeichnet die Stelle, an der Teile zusammengefügt oder befestigt werden. „Verbindungsstelle“ ist genauer und weniger eng als „Naht“.
- source_word: חֵשֶׁב
  choice: kunstvoll gewebter Gürtel
  rationale: Der Ausdruck bezeichnet beim Efod das gewebte, gürtelartige Befestigungsstück. Die Formulierung macht sowohl seine Funktion als auch seine textile Ausführung verständlich.
- source_word: אֵפֹד
  choice: Efod
  rationale: Der Fachbegriff für das priesterliche Kleidungsstück wird transliteriert, da es im Deutschen keine vollständig entsprechende Kleidungsbezeichnung gibt.
- source_word: וַיִּתְּנֻם
  choice: brachten sie … an
  rationale: Im Zusammenhang mit Ringen an einem Gewand bezeichnet das Verb deren Platzierung beziehungsweise Befestigung; „anbringen“ ist im Deutschen natürlich und präzise.
theological_decisions: []
