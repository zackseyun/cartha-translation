translation:
  language: de
  text: Die Dienstgewänder für den Dienst im Heiligtum[a], die heiligen Gewänder für den Priester Aaron und die Gewänder seiner Söhne zum Priesterdienst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die kunstvoll gearbeiteten Gewänder«. Die Bedeutung des seltenen hebräischen Ausdrucks ist unsicher; er kann besonders angefertigte Textilien für den Dienst im Heiligtum bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: die kunstvoll gearbeiteten Gewänder
  rationale: Die seltene Wendung bezeichnet in diesem Zusammenhang eigens angefertigte Textilarbeiten. Die Wiedergabe bleibt gegenüber der genauen Machart zurückhaltend und unterscheidet diese Bezeichnung von den folgenden »heiligen Gewändern«.
- source_word: לְשָׁרֵת
  choice: für den Dienst
  rationale: שׁרת bezeichnet hier den geordneten kultischen Dienst. Die substantivische Formulierung ist im Deutschen natürlich und würdevoll.
- source_word: בַּקֹּדֶשׁ
  choice: im Heiligtum
  rationale: קֹדֶשׁ bezeichnet hier den heiligen Bereich des Zeltheiligtums, nicht abstrakt die Heiligkeit.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: die heiligen Gewänder
  rationale: Die wörtliche und im Deutschen verständliche Bezeichnung bewahrt den besonderen Status der priesterlichen Kleidung.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: für den Priester Aaron
  rationale: Diese natürliche deutsche Wortstellung gibt sowohl den Empfänger als auch sein Amt klar wieder.
- source_word: בִּגְדֵי בָנָיו
  choice: die Gewänder seiner Söhne
  rationale: Die Wiedergabe folgt eng der hebräischen Genitivverbindung.
- source_word: לְכַהֵן
  choice: für ihren Priesterdienst
  rationale: Das vom Wort für »Priester« abgeleitete Verb bedeutet, als Priester tätig zu sein. »Priesterdienst« bringt diese Funktion knapp und eindeutig zum Ausdruck.
theological_decisions:
- issue: Verhältnis von בִּגְדֵי הַשְּׂרָד und בִּגְדֵי הַקֹּדֶשׁ
  choice: 'Die beiden Ausdrücke werden unterscheidbar wiedergegeben: zuerst kunstvoll gearbeitete Gewänder für den Heiligtumsdienst, danach die heiligen Gewänder Aarons und seiner Söhne.'
  alternative: Den ersten Ausdruck als »Dienstgewänder« auffassen und damit beide Wendungen nahezu synonym verstehen.
  rationale: Die Wiederholung im Hebräischen wird bewahrt, ohne eine genaue sachliche Unterscheidung zu behaupten, die der Vers selbst nicht ausdrücklich erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Aufzählung des Hebräischen bleibt erhalten; »kunstvoll gearbeitet« vermeidet eine unbelegte Festlegung auf eine bestimmte Webtechnik.
