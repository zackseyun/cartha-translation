source:
  edition: WLC
  text: וַ/יָּ֣שֶׂם אֹתָ֗/ם עַ֚ל כִּתְפֹ֣ת הָ/אֵפֹ֔ד אַבְנֵ֥י זִכָּר֖וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/007.yaml
  text: And he set them on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], just as Yahweh had commanded Moses.
translation:
  language: de
  text: Und er setzte sie auf die Schulterstücke des Efods als Erinnerungssteine für die Söhne Israels[a], ganz wie Jahwe es Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Söhne Israels“, eine feste Bezeichnung für das Volk Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָם
  choice: Und er setzte sie
  rationale: שׂים bezeichnet das Setzen, Legen oder Anbringen; „setzte sie“ gibt die konkrete Handlung knapp und im handwerklichen Zusammenhang angemessen wieder. Das Pronomen verweist auf die beiden Steine aus dem vorherigen Vers.
- source_word: עַל כִּתְפֹת הָאֵפֹד
  choice: auf die Schulterstücke des Efods
  rationale: כָּתֵף bedeutet wörtlich „Schulter“, bezeichnet hier jedoch die Schulterteile des priesterlichen Kleidungsstücks. „Schulterstücke“ ist im Deutschen präzise und natürlich.
- source_word: אַבְנֵי זִכָּרוֹן
  choice: als Erinnerungssteine
  rationale: Die Status-constructus-Verbindung bezeichnet Steine, die der Erinnerung beziehungsweise dem Gedenken dienen. „Erinnerungssteine“ bewahrt diese Funktion und klingt im modernen Deutsch natürlich.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: für die Söhne Israels
  rationale: Die feste hebräische Wendung lautet formal „Söhne Israels“. Die Übersetzung erhält die Ausdrucksform des Ausgangstextes; eine Fußnote erklärt, dass damit das Volk Israel gemeint ist.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ganz wie Jahwe es Mose geboten hatte
  rationale: כַּאֲשֶׁר drückt Übereinstimmung aus; „ganz wie“ bildet dies idiomatisch ab. Das Plusquamperfekt verdeutlicht, dass das Gebot der Ausführung vorausging, ohne den Sinn zu verändern.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen transparent wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die formale Wendung des Hebräischen bleibt im Haupttext erhalten. Die Fußnote macht deutlich, dass sie als feste Bezeichnung das Volk Israel meint und nicht nur männliche Einzelpersonen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. „Efod“ wird als etablierter Fachbegriff für das priesterliche Kleidungsstück beibehalten; „Erinnerungssteine“ ist verständlich und bewahrt die Funktion des hebräischen Ausdrucks.
