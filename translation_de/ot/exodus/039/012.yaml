  text: 'and the third row: jacinth[a], agate[b], and amethyst.'
translation:
  language: de
  text: 'und die dritte Reihe: Hyazinth[a], Achat[b] und Amethyst.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung mehrerer antiker Edelsteine am Brustschmuck des Hohen Priesters ist unsicher; statt »Hyazinth« kommen auch »Bernstein« oder die ältere Bezeichnung »Ligur« infrage.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Onyx«; die genaue Bestimmung dieses Steins ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר
  choice: und die … Reihe
  rationale: טוּר bezeichnet in der Aufzählung der Edelsteine des Brustschmucks eine Reihe beziehungsweise Anordnung; das vorangestellte וְ führt die Liste aus dem vorhergehenden Vers fort.
- source_word: הַשְּׁלִישִׁי
  choice: dritte
  rationale: Das Ordinalzahlwort kennzeichnet eindeutig die dritte Reihe.
- source_word: לֶשֶׁם
  choice: Hyazinth
  rationale: Die genaue Bestimmung dieses antiken Schmucksteins ist unsicher. »Hyazinth« ist eine gebräuchliche Wiedergabe; die Unsicherheit und wichtige Alternativen werden in einer Fußnote bewahrt.
- source_word: שְׁבוֹ
  choice: Achat
  rationale: »Achat« ist in diesem Zusammenhang eine verbreitete traditionelle Wiedergabe; wegen der unsicheren Identifizierung antiker Edelsteine wird »Onyx« als Alternative angegeben.
- source_word: וְאַחְלָמָה
  choice: und Amethyst
  rationale: אַחְלָמָה wird in den Listen der Steine des Brustschmucks gewöhnlich als Amethyst verstanden; die Konjunktion wird ausdrücklich wiedergegeben.
