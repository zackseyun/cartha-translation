base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/001.yaml
  text: And from the blue[a], the purple, and the scarlet yarn they made finely woven garments for ministering in the sanctuary, and they made the holy garments for Aaron, just as Yahweh had commanded Moses.
translation:
  language: de
  text: Aus dem blauen, purpurfarbenen und scharlachroten Garn fertigten sie Dienstgewänder[a] an, um im Heiligtum Dienst zu tun. Sie fertigten die heiligen Gewänder an, die für Aaron bestimmt waren, genau wie Jahwe Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: kunstvoll gearbeitete Gewänder. Der hebräische Fachausdruck kann entweder die Bestimmung für den Dienst oder die kunstvolle Ausführung der Gewänder hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: aus dem blauen, purpurfarbenen und scharlachroten Garn
  rationale: Die drei kultischen Textil- beziehungsweise Farbbezeichnungen werden als geläufige Farbwörter wiedergegeben. „Garn“ macht den textilen Zusammenhang deutlich, ohne die genaue antike Färbung oder das Material übermäßig festzulegen.
- source_word: בִגְדֵי שְׂרָד
  choice: Dienstgewänder
  rationale: Die spezialisierte Wendung bezeichnet Gewänder für den kultischen Dienst. Da שְׂרָד möglicherweise stattdessen die kunstvolle Verarbeitung hervorhebt, wird diese Deutung in einer Fußnote bewahrt.
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: um im Heiligtum Dienst zu tun
  rationale: Die Formulierung gibt Zweck und kultischen Zusammenhang klar wieder. „Heiligtum“ bezeichnet hier den heiligen Bereich des Zeltheiligtums, ohne ihn unnötig auf einen einzelnen Raum einzugrenzen.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: die heiligen Gewänder
  rationale: Die direkte Wiedergabe bewahrt die formelle Bezeichnung der priesterlichen Gewänder Aarons.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: die für Aaron bestimmt waren
  rationale: Die Wendung bezeichnet die Zuordnung beziehungsweise Bestimmung der heiligen Gewänder für Aaron.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: genau wie Jahwe Mose geboten hatte
  rationale: „Genau wie“ betont die Übereinstimmung mit der zuvor erteilten Weisung; das Plusquamperfekt entspricht dem rückblickenden Charakter der Zusammenfassung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Dienst“ bildet die Wortverbindung zwischen den Dienstgewändern und ihrer Funktion im Heiligtum ab. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung.
