  yaml_path: translation/ot/exodus/039/031.yaml
  text: And they attached to it a cord of blue yarn[a], to put it above on the turban, just as Yahweh had commanded Moses.
translation:
  language: de
  text: Sie befestigten daran eine Schnur aus blauem Garn[a], um es oben auf dem Turban anzubringen, genau wie Yahweh es Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine blaue Schnur“ oder „eine violette Schnur“. Das hebräische Wort תְּכֵלֶת bezeichnet das charakteristische blau bis blauviolett gefärbte Material, das für das Heiligtum verwendet wurde.'
    reason: lexikalische Alternative und nicht eindeutig bestimmbare Farbtönung
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: Sie befestigten daran
  rationale: נתן bedeutet grundsätzlich „geben, setzen, legen“; mit עַל und im vorliegenden Herstellungszusammenhang bezeichnet es das Befestigen der Schnur an dem zuvor genannten heiligen Stirnblatt.
- source_word: פְּתִיל
  choice: eine Schnur
  rationale: Das Wort bezeichnet einen gedrehten Faden beziehungsweise eine Schnur; wegen ihrer Funktion als Befestigungsmittel ist „Schnur“ hier am treffendsten.
- source_word: תְּכֵלֶת
  choice: aus blauem Purpurgarn
  rationale: תְּכֵלֶת bezeichnet den charakteristischen blau bis blauviolett gefärbten Textilstoff des Heiligtums. „Blaues Purpurgarn“ gibt Farbe und Material wieder, ohne die genaue Farbtönung zu stark festzulegen.
- source_word: לָתֵת עַל הַמִּצְנֶפֶת מִלְמָעְלָה
  choice: um es oben am Turban anzubringen
  rationale: Der Infinitiv bezeichnet den Zweck. Das Pronomen „es“ bezieht sich sachlich auf das Stirnblatt aus dem vorherigen Vers; מִלְמָעְלָה bezeichnet dessen obere beziehungsweise darüberliegende Anbringung am Turban.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: genau wie Yahweh es Mose geboten hatte
  rationale: Die wiederkehrende Erfüllungsformel betont die genaue Übereinstimmung mit dem göttlichen Auftrag. Das Plusquamperfekt entspricht im Deutschen natürlich dem Rückbezug auf das vorausgegangene Gebot.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: „Yahweh“ gibt das Tetragramm als persönlichen Gottesnamen wieder. Die genaue historische Aussprache ist nicht völlig sicher, doch „Yahweh“ ist die verbreitete wissenschaftliche Rekonstruktion.
- issue: Unausgesprochenes Objekt von לָתֵת
  choice: „es“ als Rückbezug auf das Stirnblatt
  alternative: die Schnur als Objekt verstehen oder das Objekt im Deutschen unausgesprochen lassen
  rationale: Der Zusammenhang mit dem goldenen Stirnblatt aus Vers 30 und die entsprechende Anweisung in Exodus 28,37 sprechen dafür, dass das Stirnblatt mittels der Schnur am Turban angebracht wird. Das Deutsche benötigt hier ein ausdrückliches Objekt; die Ergänzung löst keine theologische Spannung auf, sondern macht den wahrscheinlichsten syntaktischen Bezug verständlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Turban“ ist die geläufige Bezeichnung für die hohepriesterliche Kopfbedeckung. Die Formulierung bleibt nahe an der hebräischen Abfolge, wird jedoch für natürliches Deutsch leicht geglättet.
