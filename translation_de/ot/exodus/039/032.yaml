source:
  edition: WLC
  text: וַ/תֵּ֕כֶל כָּל עֲבֹדַ֕ת מִשְׁכַּ֖ן אֹ֣הֶל מוֹעֵ֑ד וַֽ/יַּעֲשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/032.yaml
  text: Thus all the work of the tabernacle[a], the tent of meeting, was finished, and the sons of Israel did according to all that Yahweh had commanded Moses[b]; so they did.
translation:
  language: de
  text: So wurde die ganze Arbeit an der Wohnung, dem Zelt der Begegnung, vollendet. Die Israeliten taten alles genau so, wie Jahwe es Mose geboten hatte; so taten sie es.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּכֶל
  choice: wurde … vollendet
  rationale: Das Verb כלה bezeichnet hier den vollständigen Abschluss des Bauvorhabens; die passive Form hält wie im Hebräischen die Arbeit im Fokus.
- source_word: כָּל עֲבֹדַת
  choice: die ganze Arbeit
  rationale: Die Wiedergabe bewahrt den umfassenden Sinn von כָּל und versteht עֲבֹדָה im Baukontext als Arbeit, nicht als kultischen Dienst.
- source_word: מִשְׁכַּן
  choice: Wohnung
  rationale: „Wohnung“ gibt die Grundbedeutung des hebräischen מִשְׁכָּן transparent wieder und bezeichnet hier das tragbare Heiligtum.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Diese natürliche deutsche Bezeichnung bewahrt den Gedanken des von Gott bestimmten Begegnungsortes.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste hebräische Volksbezeichnung meint hier Israel als Gemeinschaft; „die Israeliten“ ist im modernen Deutschen klarer und schließt die am Werk beteiligte Gemeinschaft ein.
- source_word: כְּכֹל אֲשֶׁר
  choice: alles genau so, wie
  rationale: Die Formulierung bringt die vollständige Übereinstimmung mit dem Gebot idiomatisch zum Ausdruck.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Plusquamperfekt verdeutlicht natürlich, dass das Gebot der nun abgeschlossenen Ausführung vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: כֵּן עָשׂוּ
  choice: so taten sie es
  rationale: Die abschließende Wiederholung bleibt erhalten, weil sie den vollkommenen Gehorsam ausdrücklich hervorhebt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ macht dies sichtbar, ohne den Namen durch einen Titel zu ersetzen.
- issue: Korporative Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Wörtlich steht „Söhne Israels“, doch die Wendung fungiert hier als Volksbezeichnung. „Die Israeliten“ gibt diesen korporativen Sinn in natürlichem modernem Deutsch wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Wiederholung am Versende wird bewusst bewahrt; der Satzbau wurde für gute deutsche Lesbarkeit leicht gegliedert.
