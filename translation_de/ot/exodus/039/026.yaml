base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/026.yaml
  text: a bell and a pomegranate[a], a bell and a pomegranate, around the hem of the robe, all around, for ministering, just as Yahweh had commanded Moses.
translation:
  language: de
  text: eine Glocke und ein Granatapfel, eine Glocke und ein Granatapfel, ringsum am Saum des Obergewands, zum Dienst[a], so wie Jahwe Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Dienen“ oder „für den Dienst“. Der hebräische Infinitiv bezeichnet den Zweck des Obergewands im priesterlichen Dienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: Glocke
  rationale: Das Substantiv bezeichnet eine Glocke. Dass sie aus Gold war, ergibt sich aus dem Zusammenhang in den Versen 24–25, steht aber in diesem Vers nicht ausdrücklich.
- source_word: רִמֹּן
  choice: Granatapfel
  rationale: Das Wort bedeutet wörtlich „Granatapfel“ und bezeichnet hier einen granatapfelförmigen Besatz am Obergewand. Die konkrete Bildbezeichnung bleibt im Haupttext erhalten.
- source_word: עַל שׁוּלֵי הַמְּעִיל סָבִיב
  choice: ringsum am Saum des Obergewands
  rationale: שׁוּלֵי bezeichnet den unteren Rand beziehungsweise Saum, מְעִיל ein Obergewand. סָבִיב hebt hervor, dass der Besatz den Saum ringsum umgab.
- source_word: לְשָׁרֵת
  choice: zum Dienst
  rationale: Der Infinitiv mit לְ drückt den Zweck aus. „Zum Dienst“ ist im Zusammenhang des priesterlichen Heiligtumsdienstes natürlich und bewahrt die knappe Ausdrucksweise des Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: so wie Jahwe Mose geboten hatte
  rationale: Die Wendung bezeichnet die Übereinstimmung mit einem vorausgegangenen göttlichen Gebot. Das Plusquamperfekt macht diese zeitliche Beziehung im Deutschen deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Namen und verwendet die übliche deutsche Transkription, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לְשָׁרֵת im priesterlichen Zusammenhang
  choice: zum Dienst
  alternative: zum Dienen; für den Dienst
  rationale: Die Form bezeichnet den Zweck im Rahmen des priesterlichen Dienstes. Die knappe Übersetzung lässt offen, ob der Zweck enger auf das Tragen des Gewands oder allgemeiner auf den damit ausgeübten Dienst bezogen wird.
translation_notes:
  register: Moderne, würdige Standardsprache. Die nominale Aufzählung des Hebräischen wird beibehalten, da der Vers den vorangehenden Satz fortsetzt. „Obergewand“ ist im kultischen Kontext verständlicher und genauer als das allgemeinere „Gewand“. Der Fußnotenmarker steht bei „zum Dienst“, da sich die Anmerkung auf לְשָׁרֵת bezieht.
