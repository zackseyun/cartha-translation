  terminology: „Schärpe“ ist für אַבְנֵט eine passende kontextuelle Wahl; die Alternativen in Anmerkung a sichern die breitere Bedeutung von Gürtel/Leibgurt ab. Die Farbbezeichnungen vermeiden eine unberechtigte Präzisierung. „Kunststicker“ vermittelt bei מַעֲשֵׂה רֹקֵם den Bezug auf fachmännische dekorative Textilarbeit ausreichend. Die Fußnoten sind sinnvoll verankert und entsprechen dem Text.
