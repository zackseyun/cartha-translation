source:
  edition: WLC
  text: וְֽ/אֶת הָ/אַבְנֵ֞ט שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י מַעֲשֵׂ֣ה רֹקֵ֑ם כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/029.yaml
  text: and the sash of finely twisted linen[a], and blue and purple and scarlet yarn, the work of an embroiderer[b], just as Yahweh had commanded Moses.
translation:
  language: de
  text: und die Schärpe[a] aus gezwirntem feinem Leinen, blauem und purpurfarbenem Garn und scharlachrotem Stoff[b], eine Arbeit des Kunststickers – genauso, wie Jahwe es Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Leibgurt“ oder „Gürtel“.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet scharlachrot gefärbtes Material; auch die Wiedergabe „karmesinroter Stoff“ ist möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַבְנֵט
  choice: die Schärpe
  rationale: אַבְנֵט bezeichnet den zum priesterlichen Gewand gehörenden Leibgurt. „Schärpe“ gibt diesen besonderen textilen Gürtel im Deutschen anschaulich wieder.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: gezwirntes feines Leinen
  rationale: שֵׁשׁ bezeichnet feines Leinen; מָשְׁזָר beschreibt das Material als gezwirnt beziehungsweise aus gedrehten Fäden gefertigt.
- source_word: תְכֵלֶת
  choice: blaues Garn
  rationale: Der Ausdruck bezeichnet kostbares blau gefärbtes Textilmaterial. „Garn“ wird aus dem textilen Zusammenhang erschlossen und ergibt im Deutschen eine natürliche Aufzählung.
- source_word: אַרְגָּמָן
  choice: purpurfarbenes Garn
  rationale: Die Wiedergabe bezeichnet das purpurgefärbte Textilmaterial, ohne einen heute nicht sicher bestimmbaren exakten Farbton vorzutäuschen.
- source_word: תוֹלַעַת שָׁנִי
  choice: scharlachroter Stoff
  rationale: Die hebräische Wortverbindung bezeichnet mit Scharlach gefärbtes Material; „Stoff“ macht den textilen Bezug deutlich, lässt aber die genaue Verarbeitungsform offen.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: eine Arbeit des Kunststickers
  rationale: Die Wendung hebt die kunstvolle, mehrfarbige Textilarbeit und den dafür zuständigen Fachhandwerker hervor.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: genauso, wie Jahwe es Mose geboten hatte
  rationale: „Genauso“ betont die genaue Übereinstimmung mit dem göttlichen Auftrag; das Plusquamperfekt passt zum zusammenfassenden Rückblick auf die Ausführung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Umschrift „Jahwe“ bewahrt den Charakter als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die textile Fachsprache bleibt verständlich; die handwerkliche Formulierung bewahrt den sachlich-feierlichen Ton des Abschnitts.
