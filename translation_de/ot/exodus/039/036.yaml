  text: the table[a], all its utensils, and the bread of the Presence—
translation:
  language: de
  text: den Tisch, alle seine Geräte und das Brot der Gegenwart[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: die Schaubrote.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: den Tisch
  rationale: שֻׁלְחָן bezeichnet schlicht einen Tisch. Der Zusammenhang nennt bereits die Einrichtungsgegenstände des Heiligtums; daher ist keine erklärende Ergänzung nötig.
- source_word: כָּל כֵּלָיו
  choice: alle seine Geräte
  rationale: כְּלִי kann Gerät, Gefäß oder Gegenstand bezeichnen. „Geräte“ ist hier eine natürliche, hinreichend umfassende Bezeichnung für die zum Tisch gehörenden Kultgegenstände.
- source_word: לֶחֶם הַפָּנִים
  choice: das Brot der Gegenwart
  rationale: Die Wendung bedeutet wörtlich „Brot des Angesichts/der Gegenwart“. „Brot der Gegenwart“ bewahrt den Bezug auf die göttliche Gegenwart, ohne die im Hebräischen nicht ausdrücklich genannte Gottesbezeichnung einzufügen.
- source_word: אֶת ... אֶת ... וְאֵת
  choice: nicht gesondert wiedergegeben
  rationale: Die Akkusativmarker gliedern die Gegenstände der Aufzählung. Im Deutschen wird ihre Funktion durch Kasus, Wortstellung und Konjunktion ausgedrückt.
theological_decisions:
- issue: Bezug von הַפָּנִים auf Gottes Gegenwart
  choice: „Brot der Gegenwart“ ohne ausdrückliche Ergänzung „Gottes“ oder „des HERRN“
  alternative: „Brot vor dem HERRN“
  rationale: Der kultische Zusammenhang legt Gottes Gegenwart nahe, doch der hebräische Wortlaut nennt den Gottesnamen hier nicht. Die gewählte Formulierung erhält diese knappe Ausdrucksweise.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers ist als Fortsetzung einer Aufzählung gestaltet; der Gedankenstrich am Ende bleibt entsprechend erhalten.
