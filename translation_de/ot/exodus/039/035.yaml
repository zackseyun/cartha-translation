translation:
  language: de
  text: die Lade des Zeugnisses, ihre Tragstangen und den Sühnedeckel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Deckel«; traditionell auch »Gnadenthron«. Das hebräische Wort bezeichnet den goldenen Deckel der Lade; seine genaue Wortherkunft und Bedeutungsentwicklung werden unterschiedlich erklärt, doch der Gegenstand steht im Zusammenhang mit Sühne.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: אֲרֹן
  choice: Lade
  rationale: Die etablierte und sachlich passende deutsche Bezeichnung für den heiligen Behälter im Heiligtum.
- source_word: הָעֵדֻת
  choice: des Zeugnisses
  rationale: Gibt die Grundbedeutung von עֵדוּת wieder und wahrt den Bezug zu den Tafeln als dem Zeugnis, ohne interpretierend »Bund« einzusetzen.
- source_word: בַּדָּיו
  choice: ihre Tragstangen
  rationale: Bezeichnet im Heiligtumskontext die Stangen, mit denen die Lade getragen wurde; »Tragstangen« ist im modernen Deutsch eindeutig.
- source_word: הַכַּפֹּרֶת
  choice: die Sühneplatte
  rationale: Bezeichnet die goldene Deckplatte der Lade und bewahrt zugleich die mit der hebräischen Wortfamilie verbundenen Sühneassoziationen.
theological_decisions:
- issue: Wiedergabe von כַּפֹּרֶת als kultischer Gegenstand
  choice: Sühneplatte
  alternative: Deckplatte; Gnadenthron
  rationale: »Sühneplatte« identifiziert den Gegenstand als Platte auf der Lade und erhält seine kultische Sühnebedeutung. »Deckplatte« gibt nur die Form beziehungsweise Funktion wieder; »Gnadenthron« ist traditionell, legt die Bildsprache jedoch stärker aus, als der hebräische Ausdruck selbst es verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Form bleibt als Fortsetzung einer Aufzählung ohne finites Verb erhalten. »Tragstangen« verdeutlicht die Funktion, während »Sühneplatte« Gegenstand und kultische Bedeutung knapp verbindet.
