  text: וַ/יַּעֲשׂ֥וּ פַעֲמֹנֵ֖י זָהָ֣ב טָה֑וֹר וַ/יִּתְּנ֨וּ אֶת הַ/פַּֽעֲמֹנִ֜ים בְּ/ת֣וֹךְ הָ/רִמֹּנִ֗ים עַל שׁוּלֵ֤י הַ/מְּעִיל֙ סָבִ֔יב בְּ/ת֖וֹךְ הָ/רִמֹּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/025.yaml
  text: They made bells of pure gold[a], and they put the bells among the pomegranates on the hem of the robe, all around, among the pomegranates.
translation:
  language: de
  text: Sie fertigten Glöckchen aus reinem Gold an und brachten die Glöckchen inmitten der Granatäpfel[a] ringsum am Saum des Obergewands an, inmitten der Granatäpfel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwischen den Granatäpfeln“. Die hebräische Wendung bedeutet wörtlich „inmitten der Granatäpfel“ und beschreibt die Anordnung der Glöckchen im Verhältnis zu den granatapfelförmigen Verzierungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Sie fertigten … an
  rationale: Das Wayyiqtol von עשה setzt den Bericht über die Herstellung fort; „anfertigen“ ist bei kunsthandwerklichen Gegenständen natürlich und präzise.
- source_word: פַעֲמֹנֵי זָהָב טָהוֹר
  choice: Glöckchen aus reinem Gold
  rationale: פעמון bezeichnet eine Glocke beziehungsweise ein Glöckchen. Im Zusammenhang mit dem Saum eines Gewands ist „Glöckchen“ im Deutschen idiomatisch; Material und Reinheit bleiben ausdrücklich erhalten.
- source_word: וַיִּתְּנוּ
  choice: und brachten … an
  rationale: נתן bedeutet hier, die Glöckchen an ihrer vorgesehenen Stelle zu platzieren. „anbringen“ entspricht der Befestigung an einem Kleidungsstück besser als das allgemeinere „setzen“ oder „legen“.
- source_word: בְּתוֹךְ הָרִמֹּנִים
  choice: inmitten der Granatäpfel
  rationale: Die Wendung bedeutet wörtlich „in der Mitte/inmitten der Granatäpfel“ und beschreibt die Lage der Glöckchen innerhalb der Folge granatapfelförmiger Verzierungen, ohne vorschnell auf „zwischen“ zu verengen.
- source_word: הָרִמֹּנִים
  choice: die Granatäpfel
  rationale: Der hebräische Text nennt schlicht „die Granatäpfel“. Dass es sich um granatapfelförmige textile Verzierungen handelt, ergibt sich aus dem Zusammenhang und wird nicht erklärend in den Haupttext eingefügt.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: am Saum des Obergewands
  rationale: שׁוּלִים bezeichnet den unteren Rand beziehungsweise Saum; מְעִיל ist hier das priesterliche Obergewand. „am Saum“ ist natürliches modernes Deutsch.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Wort bezeichnet eine den gesamten Saum umlaufende Anordnung; „ringsum“ gibt dies knapp und würdig wieder.
- source_word: בְּתוֹךְ הָרִמֹּנִים (wiederholt)
  choice: inmitten der Granatäpfel
  rationale: Die Wiederholung wird beibehalten, weil sie auch im Hebräischen steht und die Anordnung nachdrücklich beschreibt.
theological_decisions: []
