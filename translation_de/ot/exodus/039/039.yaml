  text: אֵ֣ת מִזְבַּ֣ח הַ/נְּחֹ֗שֶׁת וְ/אֶת מִכְבַּ֤ר הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁר ל֔/וֹ אֶת בַּדָּ֖י/ו וְ/אֶת כָּל כֵּלָ֑י/ו אֶת הַ/כִּיֹּ֖ר וְ/אֶת כַּנּֽ/וֹ׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/039.yaml
  text: the bronze altar[a], and the bronze grating that was for it, its poles, and all its utensils; the basin and its stand[b];
translation:
  language: de
  text: den Bronzealtar und das Bronzegitter, das zu ihm gehörte, seine Tragstangen und alle seine Geräte, das Becken und sein Gestell;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: Bronzealtar
  rationale: מִזְבַּח bedeutet „Altar“, und נְחֹשֶׁת bezeichnet hier das für die Ausstattung des Heiligtums verwendete Metall, das im Deutschen üblich als Bronze wiedergegeben wird. Das Kompositum ist natürlich und knapp.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: Bronzegitter
  rationale: מִכְבָּר bezeichnet die gitter- oder netzartige Vorrichtung des Altars. „Gitter“ ist im modernen Deutsch klarer und natürlicher als „Geflecht“, ohne die genaue Bauform unnötig festzulegen.
- source_word: אֲשֶׁר לוֹ
  choice: das zu ihm gehörte
  rationale: Die Wendung ordnet das Gitter dem Altar zu, ohne seine genaue Position zu bestimmen. „Zu ihm gehörte“ bewahrt diese Offenheit.
- source_word: בַּדָּיו
  choice: seine Tragstangen
  rationale: בַּדִּים sind die Stangen, mit denen die heiligen Gegenstände getragen wurden. „Tragstangen“ macht ihre Funktion im Deutschen deutlich.
- source_word: כָּל־כֵּלָיו
  choice: alle seine Geräte
  rationale: כֵּלִים ist ein weiter Begriff für Geräte, Gegenstände oder Zubehör. „Geräte“ passt zum Altar und vermeidet die engere Bedeutung von „Gefäße“.
- source_word: הַכִּיֹּר
  choice: das Becken
  rationale: כִּיּוֹר bezeichnet das Waschbecken des Heiligtums. „Becken“ ist verständliches modernes Deutsch; „Waschbecken“ würde die Funktion stärker ausdeuten.
- source_word: כַּנּוֹ
  choice: sein Gestell
  rationale: כֵּן bezeichnet hier die tragende Unterlage beziehungsweise den Sockel des Beckens. „Gestell“ gibt die Stützfunktion natürlich wieder, während „Sockel“ ebenfalls möglich ist.
