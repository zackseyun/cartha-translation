  yaml_path: translation/ot/exodus/039/003.yaml
  text: They hammered out sheets of gold and cut it into threads[a], to work it into the blue and into the purple and into the scarlet yarn and into the fine linen[c][b], the work of a skillful designer.
translation:
  language: de
  text: Sie hämmerten das Gold zu dünnen Blechen[a] und schnitten daraus Fäden[b], um sie in das blaue Garn, das purpurfarbene Garn, das Karmesingarn und das feine Leinen einzuarbeiten – als kunstvolle Musterarbeit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu dünnen Goldplatten“. Gemeint sind dünn ausgehämmerte Metallstücke.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und schnitten Fäden daraus“ beziehungsweise „schnitten es in schmale Streifen“. Das Gold wurde zu feinen Fäden oder Streifen verarbeitet, die sich einweben ließen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die Arbeit eines Kunstwebers“ beziehungsweise „kunstfertige Handwerkerarbeit“. Der hebräische Ausdruck ist eine technische Bezeichnung für fachkundig entworfene, kunstvolle Textilarbeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַקְּעוּ אֶת־פַּחֵי הַזָּהָב
  choice: Sie hämmerten das Gold zu dünnen Blechen
  rationale: רקע bezeichnet bei Metall das Aushämmern zu dünnen Platten oder Blechen. Die Formulierung gibt sowohl das handwerkliche Verfahren als auch das Ergebnis natürlich wieder.
- source_word: וְקִצֵּץ פְּתִילִם
  choice: und schnitten es in Fäden
  rationale: פְּתִילִם bezeichnet hier feine, zum Einweben bestimmte Fäden; das Pronomen bezieht sich sinngemäß auf das zuvor zu Blechen gehämmerte Gold. Der Numeruswechsel im Hebräischen wird im Deutschen idiomatisch ausgeglichen.
- source_word: לַעֲשׂוֹת בְּתוֹךְ
  choice: um es … einzuarbeiten
  rationale: Die Zweckangabe und das wiederholte בְּתוֹךְ beschreiben die Einarbeitung der Goldfäden in die Textilmaterialien. „Einarbeiten“ ist im Deutschen präzise und handwerklich passend.
- source_word: הַתְּכֵלֶת
  choice: den blauen Purpur
  rationale: תְּכֵלֶת bezeichnet einen kostbaren blau gefärbten Textilstoff beziehungsweise dessen Garn. „Blauer Purpur“ ist eine im deutschen Bibelregister verständliche Materialbezeichnung und unterscheidet ihn vom folgenden roten Purpur.
- source_word: הָאַרְגָּמָן
  choice: den roten Purpur
  rationale: אַרְגָּמָן bezeichnet purpurfarbenes kostbares Textilmaterial. „Roter Purpur“ hält die Farbdifferenz zu תְּכֵלֶת sichtbar, ohne ein nicht genanntes Substantiv wie „Garn“ überall zu wiederholen.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: das Karmesingarn
  rationale: Die feste Wendung bezeichnet scharlach- beziehungsweise karminrot gefärbtes Material. „Karmesingarn“ macht den textilen Zusammenhang deutlich.
- source_word: הַשֵּׁשׁ
  choice: das feine Leinen
  rationale: שֵׁשׁ bezeichnet im Heiligtumskontext hochwertiges feines Leinen; die Qualitätsangabe gehört zum Sinn.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: eine kunstvolle Webarbeit
  rationale: Die technische Wendung bezeichnet kunstvoll geplante, gemusterte Textilarbeit. „Webarbeit“ passt zum unmittelbaren Vorgang, während „kunstvoll“ die besondere Sachkunde ausdrückt.
