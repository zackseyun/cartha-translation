  text: the pure lampstand[a], its lamps—the lamps set in order—and all its utensils, and the oil for the light,
translation:
  language: de
  text: den reinen Leuchter, seine Lampen – die geordneten Lampen[a] – und alle seine Geräte sowie das Öl für die Beleuchtung,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Lampen der Anordnung“. Gemeint sein können die in geordneter Weise aufgestellten oder die zum ordnungsgemäßen Aufstellen bestimmten Lampen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּנֹרָה
  choice: Leuchter
  rationale: מְנוֹרָה bezeichnet hier das Gestell, das die einzelnen Lampen trägt. „Leuchter“ ist im Deutschen die natürliche und im Heiligtumskontext etablierte Bezeichnung.
- source_word: הַטְּהֹרָה
  choice: rein
  rationale: טָהוֹר beschreibt in diesem Zusammenhang die kultische beziehungsweise materielle Reinheit des Einrichtungsgegenstands. „Rein“ bewahrt diese Bedeutung, ohne das im Vers nicht ausdrücklich genannte Material zu ergänzen.
- source_word: נֵרֹתֶיהָ
  choice: seine Lampen
  rationale: נֵר bezeichnet hier die einzelnen zum Leuchter gehörenden Lampen; das Possessivsuffix wird mit „seine“ wiedergegeben.
- source_word: נֵרֹת הַמַּעֲרָכָה
  choice: die geordneten Lampen
  rationale: מַעֲרָכָה bezeichnet eine Anordnung oder geordnete Aufstellung. Die Wiedergabe ist verständlich und erhält die appositionale Wiederholung des Hebräischen; die formale und funktionale Mehrdeutigkeit wird in der Fußnote vermerkt.
- source_word: כָּל כֵּלֶיהָ
  choice: alle seine Geräte
  rationale: כְּלִי ist ein weiter Begriff für Geräte, Gegenstände oder Werkzeuge. „Geräte“ passt zum Inventarstil und legt die genaue Art nicht unnötig fest.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: das Öl für die Beleuchtung
  rationale: Die Status-constructus-Verbindung bezeichnet das zur Lichterzeugung bestimmte Öl. „Öl für die Beleuchtung“ ist natürliches modernes Deutsch und bleibt nahe an der Funktion des Ausdrucks.
