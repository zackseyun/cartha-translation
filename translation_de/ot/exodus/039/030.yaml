source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֛וּ אֶת צִ֥יץ נֵֽזֶר הַ/קֹּ֖דֶשׁ זָהָ֣ב טָה֑וֹר וַ/יִּכְתְּב֣וּ עָלָ֗י/ו מִכְתַּב֙ פִּתּוּחֵ֣י חוֹתָ֔ם קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/030.yaml
  text: They made the plate[a], the holy crown, of pure gold, and they inscribed on it, like the engraving of a seal, “Holy to Yahweh.”
translation:
  language: de
  text: 'Sie fertigten das Stirnblatt, das heilige Diadem, aus reinem Gold an und schrieben darauf, wie die Gravur eines Siegels: »Heilig für Jahwe.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Heiligkeit für Jahwe.«'
    reason: Das hebräische קֹדֶשׁ kann sowohl als knappe Heiligkeits- beziehungsweise Weihungsformel als auch ausdrücklich substantivisch verstanden werden.
lexical_decisions:
- source_word: צִיץ
  choice: Stirnblatt
  rationale: Im Zusammenhang der priesterlichen Kleidung bezeichnet das Wort das goldene, an der Kopfbedeckung befestigte Blatt. »Stirnblatt« ist im Deutschen anschaulich und kontextgerecht.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: das heilige Diadem
  rationale: נֵזֶר bezeichnet ein geweihtes Diadem oder eine Krone. Die appositionelle Wiedergabe bewahrt beide Bezeichnungen des Gegenstands.
- source_word: זָהָב טָהוֹר
  choice: aus reinem Gold
  rationale: Dies gibt Material und Qualität des Gegenstands klar und idiomatisch wieder.
- source_word: וַיִּכְתְּבוּ עָלָיו
  choice: und schrieben darauf
  rationale: Das Verb bedeutet grundsätzlich »schreiben«; die folgende Wendung verdeutlicht, dass die Schrift als Gravur ausgeführt wurde.
- source_word: מִכְתַּב פִּתּוּחֵי חוֹתָם
  choice: in Siegelgravur
  rationale: Die knappe Formulierung vermittelt idiomatisch, dass die Inschrift in der Art einer Siegelgravur ausgeführt war.
- source_word: קֹדֶשׁ לַיהוָה
  choice: Heilig für Jahwe
  rationale: Die knappe Widmungsformel bleibt erhalten. קֹדֶשׁ kann substantivisch »Heiligkeit« bedeuten, hat hier aber zugleich den Sinn einer Kennzeichnung als Jahwe geweiht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Umschrift gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm; die Umschrift bewahrt den persönlichen Gottesnamen.
- issue: Wiedergabe der Inschrift קֹדֶשׁ לַיהוָה
  choice: Heilig für Jahwe
  alternative: Heiligkeit für Jahwe
  rationale: Die Hauptfassung gibt den weihenden Sinn in einer knappen deutschen Formel wieder; die Fußnote bewahrt die mögliche substantivische Auffassung von קֹדֶשׁ.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sachsprachlichen Wörter »Stirnblatt«, »Diadem« und »Siegelgravur« entsprechen dem kultischen und handwerklichen Zusammenhang, ohne unnötig altertümlich zu wirken.
