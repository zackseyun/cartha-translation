lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: den goldenen Altar
  rationale: מִזְבַּח bedeutet »Altar«; הַזָּהָב ist das Substantiv »Gold« in attributiver Funktion. »Der goldene Altar« ist im Deutschen natürlich und gibt den Materialbezug knapp wieder.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: das Salböl
  rationale: Die Constructusverbindung bezeichnet Öl, das zur Salbung bestimmt ist. »Salböl« ist die klare und geläufige deutsche Entsprechung.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: das wohlriechende Räucherwerk
  rationale: קְטֹרֶת bezeichnet Räucherwerk, הַסַּמִּים aromatische Stoffe beziehungsweise Duftstoffe. Die Formulierung ist idiomatisch und bewahrt den Bezug auf den Duft.
- source_word: מָסַךְ
  choice: den Vorhang
  rationale: Im Zusammenhang des Heiligtums bezeichnet מָסַךְ einen schirmenden textilen Behang am Eingang. »Vorhang« ist im modernen Deutschen verständlicher als »Abschirmung« und bleibt von dem inneren Vorhang terminologisch durch den Kontext unterscheidbar.
- source_word: פֶּתַח הָאֹהֶל
  choice: für den Eingang des Zeltes
  rationale: פֶּתַח ist der Eingang beziehungsweise die Öffnung; הָאֹהֶל bezeichnet hier das Zelt des Heiligtums. Die deutsche Genitivverbindung bildet das Verhältnis natürlich ab.
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: Aufzählung mit Kommas und abschließendem »und«
  rationale: Die wiederholte Verbindung aus וְ und dem Akkusativmarker אֵת gliedert eine Inventarliste. Im Deutschen ist eine Aufzählung mit einem abschließenden »und« natürlich, ohne dass ein Gegenstand verloren geht.
