base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/043.yaml
  text: And Moses saw all the work, and behold, they had done it; just as Yahweh had commanded, so they had done it. And Moses blessed them.
translation:
  language: de
  text: 'Mose sah das ganze Werk, und siehe: Sie hatten es ausgeführt; genau wie Jahwe es geboten hatte, so hatten sie es ausgeführt. Und Mose segnete sie.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Die Grundbedeutung von ראה ist „sehen“. Im Zusammenhang nimmt Mose das vollendete Werk in Augenschein; „sah“ bewahrt die schlichte Erzählweise, ohne die Tätigkeit durch „prüfte“ zu überdeuten.
- source_word: כָּל הַמְּלָאכָה
  choice: das ganze Werk
  rationale: מְלָאכָה bezeichnet hier die gesamte ausgeführte Arbeit am Heiligtum. „Das ganze Werk“ ist würdig, verständlich und umfasst sowohl Arbeit als auch Ergebnis.
- source_word: וְהִנֵּה
  choice: und sieh
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf das nun festgestellte Ergebnis. „Und sieh“ gibt diesen Diskursimpuls in modernem, leicht gehobenem Deutsch wieder.
- source_word: עָשׂוּ אֹתָהּ
  choice: sie hatten es ausgeführt
  rationale: עשה kann „tun“ oder „machen“ bedeuten. Bezogen auf das gesamte Werk erfasst „ausführen“ sowohl Herstellung als auch gehorsame Erfüllung; das Plusquamperfekt markiert, dass die Arbeit vor Moses Besichtigung abgeschlossen war.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: Genauso, wie Jahwe es geboten hatte
  rationale: כַּאֲשֶׁר bezeichnet die genaue Übereinstimmung mit dem Gebot. „Genauso, wie“ hebt diese Entsprechung hervor; יְהוָה wird als persönlicher Gottesname „Jahwe“ wiedergegeben.
- source_word: כֵּן עָשׂוּ
  choice: hatten sie es ausgeführt
  rationale: Die Wiederholung von עשה betont die genaue Befolgung. Auch im Deutschen wird deshalb ein eigener, wiederholender Satzteil beibehalten.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: Da segnete Mose sie
  rationale: ברך im Piel bedeutet „segnen“. „Da“ führt die anschließende Handlung natürlich fort; die Namenstellung macht Mose eindeutig zum Subjekt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen in der im Deutschen üblichen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Satzbewegung. Die auffällige Wiederholung von עשה bleibt zur Betonung des vollkommenen Gehorsams erhalten. Keine Fußnoten erforderlich.
