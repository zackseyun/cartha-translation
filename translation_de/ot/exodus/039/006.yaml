  text: וַֽ/יַּעֲשׂוּ֙ אֶת אַבְנֵ֣י הַ/שֹּׁ֔הַם מֻֽסַבֹּ֖ת מִשְׁבְּצֹ֣ת זָהָ֑ב מְפֻתָּחֹת֙ פִּתּוּחֵ֣י חוֹתָ֔ם עַל שְׁמ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/006.yaml
  text: And they made the onyx stones[a], enclosed in settings of gold, engraved like the engravings of a seal, according to the names of the sons of Israel.
translation:
  language: de
  text: Und sie fertigten die Onyxsteine[a], in goldene Fassungen eingefasst und in Siegelgravur graviert, nach den Namen der Söhne Israels an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: Schohamsteine. Welcher Edelstein genau gemeint ist, ist unsicher; „Onyx“ ist die traditionelle Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Und sie fertigten … an
  rationale: Das breite Verb עשה bezeichnet hier im handwerklichen Zusammenhang das Anfertigen; diese Wiedergabe klingt im Deutschen natürlicher und präziser als „machen“.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: die Onyxsteine
  rationale: „Onyx“ ist die traditionelle und allgemein verständliche Wiedergabe von שֹׁהַם; da die genaue Bestimmung des Edelsteins unsicher ist, wird dies in einer Fußnote kenntlich gemacht.
- source_word: מֻסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: eingefasst in goldene Fassungen
  rationale: Die Formulierung gibt sowohl das Umschließen der Steine als auch die kunsthandwerklichen Goldfassungen wieder, ohne deren genaue Machart übermäßig festzulegen.
- source_word: מְפֻתָּחֹת פִּתּוּחֵי חוֹתָם
  choice: graviert wie Siegelgravuren
  rationale: Die passive Form und die figura etymologica werden knapp bewahrt; zugleich bleibt der Vergleich mit der für Siegel typischen Gravur erhalten.
- source_word: עַל שְׁמוֹת
  choice: nach den Namen
  rationale: עַל bezeichnet hier wahrscheinlich die Zuordnung beziehungsweise Entsprechung zu den Namen. „Nach den Namen“ bewahrt diese Beziehung, ohne bloß „mit den Namen“ zu paraphrasieren.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Die Wiedergabe folgt der ausdrücklich maskulinen hebräischen Stammes- und Bundesbezeichnung und bewahrt zugleich die traditionelle biblische Ausdrucksweise.
theological_decisions:
- issue: Geschlechtsspezifische Bundesbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Kinder Israels / die Israeliten
  rationale: Die maskuline Form des hebräischen Ausdrucks wird bewahrt, weil in diesem Zusammenhang die Namen der Stammväter gemeint sind; eine geschlechtsneutrale Verallgemeinerung würde diese konkrete Beziehung weniger deutlich ausdrücken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit handwerklich präziser Wortwahl. Die Wiederholung „eingefasst in goldene Fassungen“ bildet die hebräische Ausdrucksweise ab und bleibt verständlich; „Siegelgravuren“ bewahrt das Bild des Originals in knapper Form.
