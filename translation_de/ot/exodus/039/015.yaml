translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Brusttasche“ bezeichnet das am Brustbereich des Hohepriesters getragene kultische Stück und vermeidet die im heutigen Deutsch leicht missverständliche Bezeichnung „Brustschild“. Die seltene handwerkliche Terminologie wird lesbar wiedergegeben, ihre Unschärfe jedoch in der Fußnote bewahrt.
