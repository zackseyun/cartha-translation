translation:
  language: de
  text: Sie fertigten an der Brusttasche Ketten in geflochtener Machart, wie Schnüre, aus reinem Gold an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ketten in gedrehter Machart“ oder „Ketten in seilartig verschlungener Machart“. Die seltene hebräische Formulierung bezeichnet wahrscheinlich eine geflochtene, gedrehte oder schnurähnliche Machart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Sie fertigten … an
  rationale: Das gewöhnliche Verb עשה bezeichnet hier im fortlaufenden Herstellungsbericht das Anfertigen eines Gegenstands; die Formulierung ist natürlich und handwerklich passend.
- source_word: עַל הַחֹשֶׁן
  choice: für die Brusttasche
  rationale: עַל kann in diesem Zusammenhang die Zuordnung beziehungsweise Anbringung bezeichnen. „Für“ gibt idiomatisch wieder, dass die Ketten zur Brusttasche gehören, ohne ihre genaue Befestigung näher festzulegen.
- source_word: שַׁרְשְׁרֹת
  choice: Ketten
  rationale: Das Substantiv bezeichnet Ketten; die schlichte deutsche Entsprechung ist klar und im Kontext angemessen.
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: aus gedrehter Schnurarbeit
  rationale: Die seltene Wortgruppe beschreibt offenbar eine begrenzte beziehungsweise eingefasste, schnur- oder seilartig gedrehte Machart. Die Übersetzung hält die handwerkliche und schnurartige Vorstellung fest, während die Fußnote die lexikalische Unsicherheit sichtbar macht.
- source_word: זָהָב טָהוֹר
  choice: aus reinem Gold
  rationale: Die Materialangabe wird im Deutschen natürlich mit „aus“ wiedergegeben.
