translation:
  language: de
  text: Und sie machten am Saum des Obergewands Granatäpfel[a] aus gezwirntem blauem, purpurfarbenem und scharlachrotem Garn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „granatapfelförmige Verzierungen“. Im Hebräischen steht einfach „Granatäpfel“; die Schmuckstücke werden nach ihrer Form benannt.'
