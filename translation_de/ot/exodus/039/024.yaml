  - marker: b
    text: 'Wörtlich: „aus Blauem, Purpurfarbenem und Scharlachrotem, gezwirnt“. „Garn“ ist im Deutschen zur Verdeutlichung des textilen Materials ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Und sie fertigten … an
  rationale: Das Qal-Wayyiqtol von עשה bezeichnet im fortlaufenden Bericht das Herstellen; „fertigten … an“ klingt bei textilen Schmuckelementen natürlich und präzise.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: am Saum des Obergewands
  rationale: עַל bezeichnet hier die Anbringungsstelle. שׁוּלֵי meint den unteren Rand bzw. Saum, und מְעִיל ein gewandartiges Oberkleid, hier das priesterliche Obergewand.
- source_word: רִמּוֹנֵי
  choice: Granatäpfel
  rationale: Der hebräische Text nennt die Schmuckformen schlicht „Granatäpfel“. Die konkrete Bedeutung als granatapfelförmige Textilornamente wird in einer Fußnote erläutert, ohne den Haupttext auszudeuten.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: aus blauem, purpurfarbenem und scharlachrotem Zwirn
  rationale: Die drei Begriffe bezeichnen kostbare gefärbte Textilmaterialien. Die Farbadjektive geben die traditionelle und kontextuell passende Farbreihe wieder; „Zwirn“ wird zur natürlichen deutschen Verdeutlichung des Materials ergänzt.
- source_word: מָשְׁזָר
  choice: Zwirn
  rationale: מָשְׁזָר beschreibt gezwirntes bzw. gedrehtes Textilmaterial. Das deutsche Substantiv „Zwirn“ integriert diese Aussage knapp und idiomatisch in die Materialangabe.
