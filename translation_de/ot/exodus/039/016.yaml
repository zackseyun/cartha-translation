  text: וַֽ/יַּעֲשׂ֗וּ שְׁתֵּי֙ מִשְׁבְּצֹ֣ת זָהָ֔ב וּ/שְׁתֵּ֖י טַבְּעֹ֣ת זָהָ֑ב וַֽ/יִּתְּנ֗וּ אֶת שְׁתֵּי֙ הַ/טַּבָּעֹ֔ת עַל שְׁנֵ֖י קְצ֥וֹת הַ/חֹֽשֶׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/016.yaml
  text: They made two gold settings and two gold rings[a], and they put the two rings on the two ends of the breastpiece.
translation:
  language: de
  text: Sie fertigten zwei goldene Fassungen[a] und zwei goldene Ringe an und brachten die beiden Ringe an den beiden Enden des Brustschilds an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Einfassungen; möglicherweise filigran gearbeitete Fassungen.'
    reason: Das seltene Wort מִשְׁבְּצֹת bezeichnet eine Form von Goldarbeit, deren genaue Gestalt oder Herstellungstechnik nicht sicher ist.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Sie fertigten … an
  rationale: Das Qal-Wayyiqtol von עשה führt die nächste Handlung der Arbeitsfolge ein. „Anfertigen“ passt im Deutschen natürlich zum handwerklichen Zusammenhang.
- source_word: שְׁתֵּי מִשְׁבְּצֹת זָהָב
  choice: zwei goldene Fassungen
  rationale: מִשְׁבְּצֹת bezeichnet hier goldene Fassungs- oder Einfassungsarbeiten. „Fassungen“ ist verständlich und legt keine bestimmte Technik wie Filigranarbeit fest.
- source_word: וּשְׁתֵּי טַבְּעֹת זָהָב
  choice: und zwei goldene Ringe
  rationale: טַבְּעֹת sind Ringe, die als Befestigungspunkte dienen. Die Wiederholung von „golden“ entspricht der wiederholten Materialangabe im Hebräischen.
- source_word: וַיִּתְּנוּ
  choice: und brachten … an
  rationale: נתן bedeutet in dieser Konstruktion „setzen, platzieren“. Bei Befestigungsteilen ist „anbringen“ im Deutschen idiomatisch und sachlich präzise.
- source_word: עַל שְׁנֵי קְצוֹת
  choice: an den beiden Enden
  rationale: Die Präposition עַל bezeichnet hier die Stelle der Anbringung; „an“ ist im Deutschen natürlicher als das wörtlichere „auf“. קְצוֹת bezeichnet die beiden Enden beziehungsweise Randpunkte.
- source_word: הַחֹשֶׁן
  choice: des Brustschilds
  rationale: חֹשֶׁן bezeichnet das besondere Bruststück der hohepriesterlichen Kleidung. „Brustschild“ ist die geläufige deutsche Bezeichnung und identifiziert den Gegenstand im kultischen Zusammenhang klar.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die handwerkliche Abfolge bleibt klar; die wiederholte Goldangabe und die beiden Enden werden entsprechend der hebräischen Struktur ausdrücklich genannt.
