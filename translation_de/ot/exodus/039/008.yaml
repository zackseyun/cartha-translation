  text: וַ/יַּ֧עַשׂ אֶת הַ/חֹ֛שֶׁן מַעֲשֵׂ֥ה חֹשֵׁ֖ב כְּ/מַעֲשֵׂ֣ה אֵפֹ֑ד זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/008.yaml
  text: 'He made the breastpiece[a], the work of a skillful designer, like the work of the ephod: of gold, blue, purple, scarlet yarn[b], and finely twisted linen.'
translation:
  language: de
  text: 'Er fertigte das Bruststück[a] als kunstvolle Webarbeit an, in derselben Machart wie das Efod: aus Gold, blauem und purpurfarbenem Garn, Karmesingarn und gezwirntem Feinleinen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch choschen. Traditionell „Brustschild“; gemeint ist ein am Efod befestigtes priesterliches Bruststück, nicht ein metallener Panzer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er fertigte … an
  rationale: Das Wayyiqtol führt die Erzählung mit einer vergangenen Handlung fort. „Anfertigen“ passt im Deutschen natürlich zur Herstellung eines kunstvollen Textilstücks.
- source_word: הַחֹשֶׁן
  choice: die Brusttasche
  rationale: Das priesterliche Stück wurde an der Brust getragen und war offenbar taschenartig; „Brusttasche“ vermeidet die irreführende Vorstellung eines metallenen Brustpanzers.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: als kunstvolle Webarbeit
  rationale: Die Wendung bezeichnet fachkundige, gemusterte Textilarbeit. Die Wiedergabe wahrt den handwerklichen Bezug und klingt im modernen Deutsch natürlich.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: in derselben Machart wie das Efod
  rationale: Der Vergleich betrifft die Ausführung und die anschließend genannten Materialien; „Machart“ gibt diesen Zusammenhang prägnant wieder.
- source_word: אֵפֹד
  choice: Efod
  rationale: Der technische kultische Begriff hat keine genaue deutsche Entsprechung und wird daher in etablierter Umschrift beibehalten.
- source_word: זָהָב
  choice: Gold
  rationale: Direkte Bezeichnung des verwendeten Materials.
- source_word: תְּכֵלֶת
  choice: blauem … Garn
  rationale: Gemeint ist blau gefärbtes Textilmaterial; „Garn“ macht den textilen Charakter der Farbangaben deutlich.
- source_word: וְאַרְגָּמָן
  choice: purpurfarbenem Garn
  rationale: Die Wiedergabe bezeichnet verständlich das purpurgefärbte Textilmaterial.
- source_word: וְתוֹלַעַת שָׁנִי
  choice: Karmesingarn
  rationale: Die feste hebräische Farbbezeichnung meint karmesin- beziehungsweise scharlachrot gefärbtes Material; „Karmesingarn“ ist präzise und textilbezogen.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: gezwirntem Feinleinen
  rationale: שֵׁשׁ bezeichnet feines Leinen, מָשְׁזָר gezwirntes beziehungsweise zusammengedrehtes Garn. Die Formulierung bewahrt beide Angaben.
