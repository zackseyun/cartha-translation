base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/021.yaml
  text: Then Moses stretched out his hand over the sea[a], and Yahweh drove the sea back by a strong east wind all night and made the sea dry land[d][c][b], and the waters were split.
translation:
  language: de
  text: Da streckte Mose seine Hand über das Meer aus, und Jahwe trieb das Meer die ganze Nacht durch einen starken Ostwind zurück und machte das Meer zu trockenem Land, und das Wasser spaltete sich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּט
  choice: streckte … aus
  rationale: נטה bezeichnet in Verbindung mit der Hand das Ausstrecken; die deutsche Verbklammer gibt die Handlung natürlich und genau wieder.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: Die singularische Possessivkonstruktion wird unmittelbar beibehalten.
- source_word: עַל הַיָּם
  choice: über das Meer
  rationale: עַל kann unter anderem „über“, „auf“ oder „gegen“ bedeuten; bei dieser Handbewegung ist „über das Meer“ im Deutschen am natürlichsten.
- source_word: וַיּוֹלֶךְ יְהוָה אֶת הַיָּם
  choice: Jahwe trieb das Meer … zurück
  rationale: Die Hifil-Form von הלך ist kausativ. „trieb … zurück“ gibt im Kontext die bewirkte Bewegung idiomatisch wieder, ohne den Vorgang weiter auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּרוּחַ קָדִים עַזָּה
  choice: durch einen starken Ostwind
  rationale: רוּחַ bezeichnet hier wegen der Näherbestimmung „Ost-“ einen Wind; עַזָּה wird natürlich mit „stark“ wiedergegeben. Die Präposition markiert das Mittel.
- source_word: כָּל הַלַּיְלָה
  choice: die ganze Nacht
  rationale: Diese Wendung bewahrt die volle Zeitdauer und ist idiomatisches modernes Deutsch.
- source_word: וַיָּשֶׂם אֶת הַיָּם לֶחָרָבָה
  choice: Er machte das Meer zu trockenem Land
  rationale: חָרָבָה bezeichnet trockenes Land beziehungsweise trockenen Boden. Die Formulierung bewahrt das Meer als direktes Objekt und bildet die resultative Konstruktion eng nach.
- source_word: וַיִּבָּקְעוּ הַמָּיִם
  choice: das Wasser spaltete sich
  rationale: Die Nifal-Form von בקע bezeichnet das Gespaltenwerden beziehungsweise Sich-Spalten. Der deutsche Singular „Wasser“ ist als Stoffbezeichnung natürlich und bewahrt die Bildhaftigkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen traditionellen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzstruktur. Das einleitende „Da“ führt die hebräische Erzählfolge natürlich fort. Die drei aufeinanderfolgenden Handlungen bleiben erkennbar, ohne den kompakten Erzählstil unnötig auszubauen.
