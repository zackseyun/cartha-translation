  text: וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֣וֹךְ הַ/יָּ֑ם וְ/הַ/מַּ֤יִם לָ/הֶם֙ חֹמָ֔ה מִֽ/ימִינָ֖/ם וּ/מִ/שְּׂמֹאלָֽ/ם
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/029.yaml
  text: But the sons of Israel walked on dry ground through the midst of the sea[b][a], and the waters were a wall to them on their right and on their left.
translation:
  language: de
  text: Die Israeliten aber gingen auf trockenem Boden mitten durch das Meer[a], und das Wasser war ihnen rechts und links eine Mauer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Israeliten aber gingen auf trockenem Land mitten durch das Meer.“'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: „Die Wasser waren ihnen eine Mauer“; manche verstehen dies im Sinn von „wie eine Mauer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Die Israeliten aber
  rationale: בני ישראל bezeichnet idiomatisch das Volk Israel. Im heutigen Deutsch ist „die Israeliten“ natürlich und schließt das ganze Volk ein; „aber“ gibt hier den Gegensatz zum Untergang der Ägypter im Kontext wieder.
- source_word: הָלְכוּ
  choice: gingen
  rationale: הלך bedeutet „gehen“ oder „laufen“. „Gingen“ ist im Deutschen die natürliche Erzählform und legt nicht unnötig eine bestimmte Fortbewegungsweise fest.
- source_word: בַיַּבָּשָׁה
  choice: über trockenen Boden
  rationale: יבשה bezeichnet trockenes Land beziehungsweise trockenen Boden. Im Zusammenhang ist der trockene Meeresgrund gemeint; „über trockenen Boden“ formuliert dies klar und idiomatisch.
- source_word: בְּתוֹךְ הַיָּם
  choice: mitten durch das Meer
  rationale: בתוך bezeichnet das Innere beziehungsweise die Mitte; mit dem Bewegungsverb gibt „mitten durch“ sowohl den räumlichen als auch den durchquerenden Sinn wieder.
- source_word: וְהַמַּיִם
  choice: und das Wasser
  rationale: מים ist im Hebräischen formal pluralisch, wird im Deutschen jedoch gewöhnlich als kollektiver Singular „Wasser“ wiedergegeben.
- source_word: לָהֶם חֹמָה
  choice: war ihnen … eine Mauer
  rationale: Die Konstruktion bezeichnet, dass das Wasser für sie als Mauer dastand. „War ihnen eine Mauer“ bewahrt die direkte nominale Aussage ohne ein nicht ausdrücklich vorhandenes Vergleichswort.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: rechts und links
  rationale: Die knappe deutsche Paarformel gibt die parallelen hebräischen Richtungsangaben natürlich und vollständig wieder.
theological_decisions:
- issue: Wiedergabe von בני ישראל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die wörtliche Form ist filial, fungiert hier aber als feststehende Volksbezeichnung. „Die Israeliten“ ist im modernen Deutschen geschlechtsübergreifend und vermeidet den irreführenden Eindruck, nur männliche Nachkommen seien gemeint.
- issue: Wiedergabe von חֹמָה
  choice: eine Mauer
  alternative: wie eine Mauer
  rationale: Im Hebräischen fehlt eine ausdrückliche Vergleichspartikel. Daher bleibt die kräftige direkte Aussage im Haupttext erhalten; die vergleichende Deutung wird in einer Fußnote genannt.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. Die Wortstellung betont den Gegensatz: Während die Ägypter untergingen, durchquerte Israel das Meer sicher. Die beiden Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Aussage.'
