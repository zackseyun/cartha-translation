base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/017.yaml
  text: And I—behold[a], I am hardening the hearts of the Egyptians so that they will go in after them, and I will get glory over Pharaoh and over all his army[b], over his chariots and over his horsemen.
translation:
  language: de
  text: Ich aber – siehe, ich verhärte das Herz der Ägypter[a], sodass sie hinter ihnen her hineinziehen. Und ich werde am Pharao und an seinem ganzen Heer, an seinen Streitwagen und seinen Reitern meine Herrlichkeit erweisen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Herz der Ägypter“; der Singular „Herz“ ist kollektiv gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Und ich werde am Pharao und an seinem ganzen Heer, an seinen Streitwagen und seinen Reitern verherrlicht werden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: seht, ich
  rationale: הִנְנִי hebt die Person des Sprechers nachdrücklich hervor. „Seht, ich“ bewahrt diesen Signalcharakter in verständlichem, würdevollem Deutsch.
- source_word: מְחַזֵּק
  choice: verhärte
  rationale: Das Piel-Partizip bezeichnet hier Gottes unmittelbares, einsetzendes bzw. fortdauerndes Festmachen des ägyptischen Entschlusses. „Verhärte“ entspricht dem etablierten Sinn im Exoduszusammenhang, ohne die göttliche Urheberschaft abzuschwächen.
- source_word: לֵב מִצְרַיִם
  choice: das Herz der Ägypter
  rationale: Der hebräische Singular „Herz“ wird kollektiv auf die Ägypter bezogen. Die deutsche Form bewahrt diese auffällige Quelltextgestalt; eine Fußnote erläutert sie.
- source_word: וְיָבֹאוּ אַחֲרֵיהֶם
  choice: sodass sie hinter ihnen her hineinziehen
  rationale: בוא bezeichnet im Kontext das Hineinziehen in das Meer. „Sodass“ macht die im Zusammenhang erkennbare Folge bzw. Zielrichtung der Verhärtung deutlich, ohne den Zielort ausdrücklich hinzuzusetzen.
- source_word: וְאִכָּבְדָה
  choice: ich werde … meine Herrlichkeit erweisen
  rationale: Die Niphalform von כבד beschreibt, dass Gottes Herrlichkeit bzw. Ehre im Gericht sichtbar wird. Die gewählte Formulierung ist im Deutschen natürlicher als „ich werde Herrlichkeit bekommen“ und vermeidet den möglichen Beiklang bloßer Selbstverherrlichung.
- source_word: בְּפַרְעֹה
  choice: am Pharao
  rationale: Die Präposition ב bezeichnet hier denjenigen, an dem Gottes Herrlichkeit durch Gericht sichtbar wird. „Am Pharao“ bewahrt diese Beziehung knapp und idiomatisch.
- source_word: חֵילוֹ
  choice: seinem ganzen Heer
  rationale: חיל bezeichnet in diesem militärischen Zusammenhang die gesamte Streitmacht; „Heer“ ist klar und stilistisch angemessen.
- source_word: רִכְבּוֹ
  choice: seinen Streitwagen
  rationale: Der morphologische Singular kann kollektiv die Wagenstreitmacht bezeichnen. Der deutsche Plural „Streitwagen“ gibt diesen kollektiven Sinn natürlich wieder.
- source_word: פָרָשָׁיו
  choice: seinen Reitern
  rationale: פָּרָשִׁים bezeichnet berittene Kämpfer beziehungsweise Reiter. „Reiter“ ist konkret, verständlich und vermeidet unnötig technische Ausdrucksweise.
theological_decisions:
- issue: Gottes Handeln bei der Verhärtung der Ägypter
  choice: Gottes direkte Urheberschaft wird mit „ich verhärte“ ausdrücklich wiedergegeben.
  alternative: „Ich lasse ihr Herz hart werden“ oder „ich stärke ihren Entschluss“.
  rationale: Der hebräische Text schreibt die Handlung unmittelbar Gott zu. Die Übersetzung bewahrt die Spannung zwischen göttlichem Handeln und menschlicher Verantwortung, statt sie durch eine permissive Formulierung aufzulösen.
- issue: כבד im Zusammenhang des Gerichts
  choice: „meine Herrlichkeit erweisen“
  alternative: „verherrlicht werden“ oder „mir Ehre verschaffen“.
  rationale: Die Formulierung gibt wieder, dass Gottes Herrlichkeit durch das Gericht an Pharao offenbar wird. Die Fußnote hält die näher an der grammatischen Gestalt liegende passive Alternative offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bildet die nachdrückliche Selbstvorstellung וַאֲנִי הִנְנִי ab. „Hineinziehen“ nimmt die Bewegung in das Meer aus dem unmittelbaren Kontext auf, ohne „Meer“ ergänzend in den Vers einzutragen. Militärische Begriffe bleiben konkret und allgemein verständlich.
