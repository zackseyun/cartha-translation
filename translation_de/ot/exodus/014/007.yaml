  text: And he took six hundred choice chariots[a], and all the chariots of Egypt, with officers over all of them.
translation:
  language: de
  text: Er nahm sechshundert ausgewählte Streitwagen und alle Streitwagen Ägyptens, mit Offizieren[a] über ihnen allen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit Wagenoffizieren auf allen«. Der hebräische Ausdruck kann militärische Begleiter oder Befehlshaber bezeichnen, die den Streitwagen zugeordnet waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Er nahm
  rationale: Das Wayyiqtol von לקח führt die Erzählung weiter. Im Deutschen ergibt sich die zeitliche Abfolge bereits aus dem Zusammenhang; ein zusätzliches »und« ist nicht erforderlich.
- source_word: שֵׁשׁ מֵאוֹת
  choice: sechshundert
  rationale: Direkte Wiedergabe der Zahlkonstruktion.
- source_word: רֶכֶב
  choice: Streitwagen / Streitwagenmacht
  rationale: רֶכֶב kann einzelne Streitwagen oder kollektiv die Streitwagentruppe bezeichnen. Bei der ausdrücklichen Zahl steht der Plural »Streitwagen«; bei כֹל רֶכֶב מִצְרַיִם gibt »Streitwagenmacht« den kollektiven Sinn natürlich wieder.
- source_word: בָּחוּר
  choice: ausgewählte
  rationale: Das vom Verb בחר abgeleitete Wort bezeichnet hier eigens ausgewählte beziehungsweise besonders geeignete Wagen.
- source_word: וְכֹל רֶכֶב מִצְרַיִם
  choice: und die gesamte Streitwagenmacht Ägyptens
  rationale: Die Konstruktion bezeichnet umfassend Ägyptens Streitwagentruppe. Die kollektive Formulierung vermeidet im Deutschen die mögliche Fehlvorstellung, es gehe nur um eine Liste einzelner Wagen.
- source_word: וְשָׁלִשִׁם
  choice: mit Offizieren
  rationale: שָׁלִשִׁים ist ein militärischer Fachausdruck für hochrangige Begleiter, Adjutanten oder Streitwagenoffiziere. »Offiziere« gibt die Funktion verständlich wieder, ohne die unsichere genaue Dienststellung festzulegen.
- source_word: עַל כֻּלּוֹ
  choice: über der ganzen Truppe
  rationale: Das singularische Suffix bezieht sich natürlich auf die kollektiv verstandene Streitwagenmacht. »Über« bewahrt den möglichen Sinn von Aufsicht oder Befehlsgewalt.
