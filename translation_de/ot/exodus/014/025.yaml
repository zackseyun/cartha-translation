base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/025.yaml
  text: And he removed the wheels from his chariots, and drove them with difficulty. And Egypt said, “Let me flee from before Israel, for the LORD is fighting for them against Egypt.”
translation:
  language: de
  text: 'Da nahm er die Räder von den Streitwagen Ägyptens weg[a] und trieb sie nur mühsam voran. Da sagte Ägypten: »Ich will vor Israel fliehen[b], denn der HERR kämpft für sie gegen Ägypten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen im Singular: »das Rad seiner Streitwagen«. Der Singular kann hier kollektiv verstanden werden.'
    reason: Erläutert, weshalb die deutsche idiomatische Pluralform »Räder« trotz der hebräischen Singularform verwendet wird, ohne den Bezug des Possessivsuffixes weiter festzulegen.
  - marker: b
    text: 'Ägypten spricht im Hebräischen im Singular: »Ich will fliehen.«'
    reason: Macht die personifizierende Singularform der direkten Rede transparent.
lexical_decisions:
- source_word: וַיָּסַר
  choice: Da riss er … die Räder ab
  rationale: Das Verb bedeutet hier, etwas zu entfernen oder wegzunehmen. »Abriss« gibt die gewaltsame Wirkung im Zusammenhang natürlich wieder, ohne eine technische Einzelursache festzulegen.
- source_word: אֹפַן מַרְכְּבֹתָיו
  choice: Ägyptens Streitwagen die Räder
  rationale: Der hebräische Singular »Rad« kann kollektiv gebraucht sein; »Räder« ist im Deutschen idiomatisch. Das maskuline Singularsuffix wird auf das kollektiv und personifiziert verstandene Ägypten bezogen.
- source_word: וַיְנַהֲגֵהוּ בִּכְבֵדֻת
  choice: sodass es nur noch mit Mühe vorankam
  rationale: Wörtlich etwa »und er führte/fuhr es mit Schwerfälligkeit«. Die Wiedergabe bezeichnet das erschwerte Vorankommen und bewahrt durch »es« Ägypten als kollektiven Singular.
- source_word: אָנ֨וּסָה
  choice: Ich will … fliehen
  rationale: Die Kohortativform steht ausdrücklich in der ersten Person Singular und entspricht dem personifiziert sprechenden Ägypten.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchenform wird beibehalten.
theological_decisions:
- issue: Wer entfernt die Räder?
  choice: Das nicht eigens genannte »er« bleibt stehen und verweist im Kontext auf den HERRN.
  alternative: Den HERRN im Vers ausdrücklich als Subjekt nennen.
  rationale: Der hebräische Text hat lediglich die maskuline Singularform »er«; die Übersetzung ergänzt den Gottesnamen nicht und wahrt damit die Textgestalt.
- issue: Ägypten als kollektive Person
  choice: Ägypten wird mit Singularformen als handelnde und sprechende Person wiedergegeben.
  alternative: Pluralisch »die Ägypter … wir« übersetzen.
  rationale: Der masoretische Text verwendet sowohl beim Possessivsuffix als auch in der direkten Rede den Singular. Diese auffällige Personifizierung soll nicht eingeebnet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Bezeichnung »Streitwagen« ist allgemein verständlich und sachlich präzise. Die personifizierenden Singularformen des Hebräischen werden bewusst beibehalten; Fußnoten erklären die dadurch entstehende Auffälligkeit.
