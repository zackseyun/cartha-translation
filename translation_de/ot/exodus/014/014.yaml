id: EXO.14.14
reference: Exodus 14:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָ֖ה יִלָּחֵ֣ם לָ/כֶ֑ם וְ/אַתֶּ֖ם תַּחֲרִישֽׁוּ/ן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/014.yaml
  text: Yahweh will fight for you[a], and you must be silent.
translation:
  language: de
  text: Jahwe wird für euch kämpfen; ihr aber sollt schweigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr werdet schweigen“; auch: „ihr sollt still sein“.'
    reason: Die hebräische Imperfektform kann hier als Aufforderung oder als Aussage über das bevorstehende Verhalten Israels verstanden werden; חרשׁ kann mit „schweigen“ oder „still sein“ wiedergegeben werden.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Tetragramms bewahrt den offenbarten Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- source_word: יִלָּחֵם
  choice: wird kämpfen
  rationale: Das Nifal-Imperfekt von לחם bezeichnet hier Jahwes bevorstehendes kämpferisches Eingreifen; „wird kämpfen“ ist natürlich und erhält das militärische Bild.
- source_word: לָכֶם
  choice: für euch
  rationale: 'Die Präposition ל mit Suffix bezeichnet hier den Vorteil beziehungsweise die Stellvertretung: Jahwe handelt zugunsten Israels.'
- source_word: וְאַתֶּם
  choice: ihr aber
  rationale: Das selbstständige Pronomen hebt Israel gegenüber Jahwes Handeln hervor; „aber“ macht diesen im Hebräischen angelegten Kontrast im Deutschen natürlich sichtbar.
- source_word: תַּחֲרִישׁוּן
  choice: sollt schweigen
  rationale: Das Hifil von חרשׁ bedeutet hier „schweigen/still sein“. Das modale „sollt“ gibt die im Kontext naheliegende auffordernde Kraft wieder, ohne die formal mögliche Zukunftsbedeutung zu verschweigen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ erhält diesen Eigennamen und ersetzt ihn nicht durch einen Titel.
- issue: Modus von תַּחֲרִישׁוּן
  choice: sollt schweigen
  alternative: werdet schweigen
  rationale: Im Zusammenhang von Moses Zuspruch ist eine auffordernde beziehungsweise verpflichtende Nuance wahrscheinlich; da die Imperfektform auch zukünftig verstanden werden kann, bleibt diese Möglichkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Semikolon-Satzbau und „ihr aber“ verdeutlichen den Kontrast zwischen Jahwes Handeln und Israels Schweigen, ohne ihn auszudeuten.
