base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/011.yaml
  text: And they said to Moses[a], “Was it because there were no graves in Egypt that you took us away to die in the wilderness? What is this you have done to us by bringing us out of Egypt?”
translation:
  language: de
  text: 'Da sagten sie zu Mose: »Hast du uns etwa deshalb mitgenommen, damit wir in der Wüste sterben, weil es in Ägypten keine Gräber gab? Was hast du uns da angetan, indem du uns aus Ägypten herausgeführt hast?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: Da sagten sie zu Mose
  rationale: Das narrative Wayyiqtol von אמר wird im Deutschen natürlich mit »Da sagten sie« wiedergegeben; אֶל bezeichnet den Adressaten.
- source_word: הֲמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם
  choice: Gab es etwa keine Gräber in Ägypten
  rationale: Die rhetorische, sarkastische Frage wird durch »etwa« idiomatisch und in ihrer vorwurfsvollen Wirkung bewahrt.
- source_word: לְקַחְתָּנוּ
  choice: sodass du uns mitgenommen hast
  rationale: לקח bedeutet hier »nehmen/mitnehmen«. »Mitgenommen« wahrt den Unterschied zum späteren הוציא (»herausführen«); »sodass« verbindet die idiomatische Frage im Deutschen verständlich mit ihrer Folge.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: damit wir in der Wüste sterben
  rationale: Der Infinitiv kann Ziel oder zugeschriebene Absicht ausdrücken. »Wüste« ist die geläufige deutsche Wiedergabe von מִדְבָּר in diesem Exodus-Kontext.
- source_word: מַה־זֹּאת עָשִׂיתָ לָּנוּ
  choice: Was hast du uns da angetan
  rationale: »Was ... da« spiegelt die hebräische Konstruktion מַה־זֹּאת und ihre emotionale, anklagende Kraft; »angetan« gibt עשה ל־ in diesem negativen Kontext natürlich wieder.
- source_word: לְהוֹצִיאָנוּ מִמִּצְרָיִם
  choice: indem du uns aus Ägypten herausgeführt hast
  rationale: Der Infinitiv erklärt die beanstandete Handlung. »Herausgeführt« bewahrt das Exodus-Motiv und die lexikalische Abgrenzung von לקח.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit deutlich hörbarem Sarkasmus und Vorwurf. Die Wiederholung »Ägypten« sowie der Wechsel von »mitgenommen« zu »herausgeführt« bleiben erhalten. Keine konfessionelle Deutung wird ergänzt.
