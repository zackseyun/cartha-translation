  yaml_path: translation/ot/exodus/014/004.yaml
  text: And I will harden Pharaoh’s heart[a], and he will pursue them; and I will get glory over Pharaoh and over all his army[b], and the Egyptians will know that I am Yahweh.” And they did so.
translation:
  language: de
  text: Und ich werde das Herz des Pharaos verhärten[a], und er wird ihnen nachjagen. So werde ich mich am Pharao und an seinem ganzen Heer verherrlichen[b], und die Ägypter werden erkennen, dass ich Jahwe bin.« Und sie taten es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Herz des Pharaos stark und fest machen“. Das hebräische Verb kann „stärken, fest machen“ bedeuten; im Zusammenhang zeigt sich diese Festigkeit als Verstocktheit, daher „verhärten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch den Pharao und durch sein ganzes Heer verherrlicht werden“. Der hebräische Ausdruck besagt, dass Jahwe im Zusammenhang mit Pharao und seinem Heer Ehre und Herrlichkeit erlangt; die genaue Nuance der Präposition kann unterschiedlich wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי אֶת־לֵב פַּרְעֹה
  choice: ich werde das Herz des Pharaos verhärten
  rationale: Der Hifil von חזק bezeichnet hier Gottes ursächliches Festmachen von Pharaos innerem Willenszentrum; im Erzählzusammenhang äußert sich dies als Verstocktheit. „Verhärten“ ist im Deutschen natürlich und bewahrt die ausdrückliche göttliche Verursachung.
- source_word: וְרָדַף אַחֲרֵיהֶם
  choice: sodass er ihnen nachjagen wird
  rationale: רדף אחרי bezeichnet das Verfolgen bzw. Nachjagen. „Nachjagen“ gibt die militärische Verfolgung klar wieder; „sodass“ macht den im Satz angelegten Folgezusammenhang verständlich, ohne zusätzliche Erklärung einzutragen.
- source_word: וְאִכָּבְדָה בְּפַרְעֹה וּבְכָל־חֵילוֹ
  choice: So werde ich mich am Pharao und an seinem ganzen Heer verherrlichen
  rationale: Die Niphal-/Kohortativform von כבד spricht davon, dass Jahwe in beziehungsweise an Pharao und seinem Heer Ehre und Herrlichkeit erlangt. Die reflexive deutsche Form wahrt dies; „an“ passt zum Gerichtskontext und vermeidet die Festlegung auf ein bloß instrumentales „durch“.
- source_word: וְיָדְעוּ מִצְרַיִם
  choice: die Ägypter werden erkennen
  rationale: Der Plural des Verbs legt die personale Wiedergabe „die Ägypter“ nahe. „Erkennen“ trägt dem gewichtigen Erkenntnissinn der Formel Rechnung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Und sie taten es so
  rationale: Die knappe narrative Abschlussformel wird direkt und in natürlichem, würdigem Deutsch wiedergegeben.
theological_decisions:
- issue: Göttliches Handeln bei der Verhärtung des Pharaos
  choice: „ich werde das Herz des Pharaos verhärten“ als direkte göttliche Verursachung
  alternative: „ich werde das Herz des Pharaos stärken“ oder „ich werde zulassen, dass sein Herz verhärtet wird“
  rationale: Die erste Person im Hifil nennt Jahwe ausdrücklich als Handelnden. Eine bloße Zulassung würde die Aussage theologisch abschwächen; die Fußnote bewahrt zugleich die lexikalische Grundbedeutung „stark/fest machen“.
- issue: Jahwes Verherrlichung im Gericht
  choice: „ich werde mich am Pharao und an seinem ganzen Heer verherrlichen“
  alternative: „ich werde durch den Pharao und sein ganzes Heer verherrlicht werden“
  rationale: Die Formulierung bewahrt sowohl den passiv-reflexiven Sinn von כבד als auch den gerichtlichen Bezug der Präposition ב, ohne abschließend zwischen lokal-relationalem „an“ und instrumentalem „durch“ zu entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der traditionelle biblische Ausdruck „Herz verhärten“ bleibt erhalten, während Satzbau und Wortwahl für heutige Leser klar sind. „Jahwe“ gibt den Gottesnamen wieder. Die Fußnoten markieren echte lexikalische und syntaktische Alternativen.
