source:
  edition: WLC
  text: וַ/יֶּאְסֹ֖ר אֶת רִכְבּ֑/וֹ וְ/אֶת עַמּ֖/וֹ לָקַ֥ח עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/006.yaml
  text: So he harnessed his chariot and took his people with him[a][b].
translation:
  language: de
  text: Da spannte er seinen Streitwagen an und nahm sein Volk mit sich.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „machte seinen Streitwagen bereit“. Das hebräische Verb bedeutet wörtlich „binden“ oder „festmachen“ und bezeichnet hier das Anschirren des Streitwagengespanns.'
    reason: lexical_alternative
  - marker: b
    text: Mit „sein Volk“ ist hier wahrscheinlich die Truppe gemeint, die den Pharao begleitete. Im Hebräischen steht jedoch „sein Volk“, nicht ausdrücklich „sein Heer“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר
  choice: spannte … an
  rationale: אָסַר bedeutet wörtlich „binden, festmachen“; im Zusammenhang mit einem Streitwagen bezeichnet es das Anschirren beziehungsweise Fahrbereitemachen. „anspannen“ gibt die konkrete Handlung im Deutschen natürlich wieder.
- source_word: רִכְבּוֹ
  choice: seinen Streitwagen
  rationale: רֶכֶב kann auch kollektiv die Streitwagenmacht bezeichnen; die Singularform mit Suffix meint hier jedoch am ehesten den eigenen Streitwagen des Pharaos.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: עַם bedeutet gewöhnlich „Volk“. Im militärischen Zusammenhang sind wohl die ihn begleitenden Männer beziehungsweise Truppen gemeint, doch der hebräische Text sagt nicht ausdrücklich „Heer“.
- source_word: לָקַח עִמּוֹ
  choice: nahm … mit sich
  rationale: Die Verbindung bedeutet direkt „mit sich nehmen“ und lässt sich so idiomatisch und quellennah wiedergeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt dem hebräischen Handlungsablauf; „Streitwagen“ verdeutlicht den militärischen Kontext, während „sein Volk“ die lexikalische Offenheit des Ausgangstextes bewahrt.
