  text: הֲ/לֹא זֶ֣ה הַ/דָּבָ֗ר אֲשֶׁר֩ דִּבַּ֨רְנוּ אֵלֶ֤י/ךָ בְ/מִצְרַ֨יִם֙ לֵ/אמֹ֔ר חֲדַ֥ל מִמֶּ֖/נּוּ וְ/נַֽעַבְדָ֣ה אֶת מִצְרָ֑יִם כִּ֣י ט֥וֹב לָ֨/נוּ֙ עֲבֹ֣ד אֶת מִצְרַ֔יִם מִ/מֻּתֵ֖/נוּ בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/012.yaml
  text: Is this not the word that we spoke to you in Egypt, saying, ‘Leave us alone so that we may serve the Egyptians’? For it would have been better for us to serve the Egyptians than to die in the wilderness.
translation:
  language: de
  text: 'Haben wir dir nicht in Ägypten gesagt: »Lass uns in Ruhe, damit wir den Ägyptern dienen«? Denn es ist besser für uns, den Ägyptern zu dienen, als in der Wüste zu sterben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא זֶה הַדָּבָר
  choice: Haben wir dir nicht schon … gesagt
  rationale: Die hebräische Wendung lautet wörtlich etwa »Ist dies nicht das Wort, das wir … redeten?«. Im natürlichen Deutschen gibt eine bestätigende rhetorische Frage mit »Haben wir … nicht« dieselbe Funktion wieder; »schon« verdeutlicht den Rückverweis, ohne den Sinn zu verändern.
- source_word: חֲדַל מִמֶּנּוּ
  choice: Lass uns in Ruhe
  rationale: חָדַל mit מִן fordert hier dazu auf, von jemandem abzulassen. Die gewählte Formulierung ist idiomatisch und bewahrt den schroffen Ton.
- source_word: וְנַעַבְדָה אֶת־מִצְרָיִם
  choice: damit wir den Ägyptern dienen können
  rationale: Der Kohortativ nach der Aufforderung drückt das beabsichtigte Ergebnis aus. מִצְרַיִם bezeichnet formal »Ägypten«, steht hier jedoch metonymisch für die Ägypter bzw. ägyptischen Herren; im Deutschen ist der Personenbezug natürlicher.
- source_word: כִּי טוֹב לָנוּ עֲבֹד … מִמֻּתֵנוּ
  choice: Denn es wäre besser für uns gewesen, … zu dienen, als … zu sterben
  rationale: Die Vergleichskonstruktion wird klar wiedergegeben. Der deutsche Irrealis der Vergangenheit passt zur rückblickenden Klage über die inzwischen verlassene Möglichkeit.
theological_decisions:
- issue: Charakterisierung des Dienstes in Ägypten
  choice: dienen
  alternative: Sklavenarbeit leisten
  rationale: עבד kann sowohl »dienen« als auch »als Sklave arbeiten« bedeuten. »Dienen« bewahrt die lexikalische Wiederholung und lässt den unmittelbaren Kontext die bedrückende Art dieses Dienstes bestimmen, ohne sie im Vers auszudeuten.
- issue: Zeitbezug von »besser«
  choice: es wäre besser für uns gewesen
  alternative: es ist besser für uns
  rationale: Die hebräische Nominalform ist zeitlich nicht ausdrücklich markiert. Im Erzählzusammenhang vergleichen die Sprecher ihre gegenwärtige Todesgefahr mit der verworfenen Möglichkeit, in Ägypten zu bleiben; der deutsche rückblickende Irrealis macht diesen pragmatischen Sinn natürlich deutlich.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt schroff und vorwurfsvoll; unnötige Archaismen wie »Ist dies nicht das Wort« wurden vermieden.
