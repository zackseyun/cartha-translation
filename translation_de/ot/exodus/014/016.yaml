  text: וְ/אַתָּ֞ה הָרֵ֣ם אֶֽת מַטְּ/ךָ֗ וּ/נְטֵ֧ה אֶת יָדְ/ךָ֛ עַל הַ/יָּ֖ם וּ/בְקָעֵ֑/הוּ וְ/יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/ת֥וֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/016.yaml
  text: But as for you[a], lift up your staff and stretch out your hand over the sea and split it, so that the sons of Israel may go through the midst of the sea on dry ground.
translation:
  language: de
  text: Du aber, erhebe deinen Stab, strecke deine Hand über das Meer aus und spalte es, damit die Söhne Israels[a] mitten durch das Meer auf trockenem Boden gehen können.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“ beziehungsweise „die Kinder Israels“. Wörtlich steht im Hebräischen: „die Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Du aber
  rationale: Die Konjunktion mit dem selbstständigen Pronomen hebt Mose im Kontrast zum zuvor angesprochenen Volk hervor; „Du aber“ gibt dies knapp und natürlich wieder.
- source_word: הָרֵם אֶת מַטְּךָ
  choice: erhebe deinen Stab
  rationale: Der Hifil-Imperativ von רום bezeichnet das Hochheben; „Stab“ ist im Mosebericht die natürliche heutige Wiedergabe von מַטֶּה.
- source_word: וּנְטֵה אֶת יָדְךָ עַל הַיָּם
  choice: strecke deine Hand über das Meer aus
  rationale: נטה bezeichnet hier das Ausstrecken der Hand; עַל wird in dieser Gestenszene räumlich mit „über“ wiedergegeben.
- source_word: וּבְקָעֵהוּ
  choice: und spalte es
  rationale: בקע bezeichnet ein Aufspalten oder Auseinanderbrechen; „spalten“ bewahrt die konkrete, kraftvolle Bildlichkeit.
- source_word: וְיָבֹאוּ
  choice: damit ... gehen können
  rationale: Der mit waw angeschlossene Imperfekt beschreibt hier die beabsichtigte Folge des Befehls. Die deutsche Zweckkonstruktion macht diesen Zusammenhang deutlich, ohne den Vorgang weiter auszudeuten.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formale Wendung des Hebräischen wird bewahrt; im Kontext bezeichnet sie das Volk Israel insgesamt.
- source_word: בְּתוֹךְ הַיָּם
  choice: mitten durch das Meer
  rationale: בְּתוֹךְ bezeichnet das Innere beziehungsweise die Mitte. „Mitten durch“ ist im Deutschen natürlich und entspricht im Kontext der angekündigten Durchquerung.
- source_word: בַּיַּבָּשָׁה
  choice: auf trockenem Boden
  rationale: Das Substantiv bezeichnet trockenes Land beziehungsweise trockenen Grund im Gegensatz zum Meer; „auf trockenem Boden“ hebt die Beschaffenheit des Weges hervor.
theological_decisions:
- issue: Wiedergabe von בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten; die Kinder Israels
  rationale: Die Übersetzung erhält die ausdrücklich männliche hebräische Form. Eine Fußnote erläutert, dass die Wendung im Kontext das ganze Volk bezeichnet, ohne die Form im Haupttext zu neutralisieren.
- issue: Verhältnis zwischen Moses Handlung und dem Durchzug
  choice: damit ... gehen können
  alternative: und ... werden hineingehen
  rationale: Die Form kann formal als Fortsetzung gelesen werden; im Befehlszusammenhang liegt jedoch eine beabsichtigte Folge nahe. Die Zweckkonstruktion wahrt, dass Moses Handlung den von Gott ermöglichten Durchzug vorbereitet, ohne eine weitergehende kausale Lehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Imperative bleiben direkt und kraftvoll; „mitten durch das Meer“ verbindet die räumliche Bildlichkeit des Hebräischen mit natürlichem deutschem Ausdruck.
