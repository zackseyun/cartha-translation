  text: וַ/יַּ֨רְא יִשְׂרָאֵ֜ל אֶת הַ/יָּ֣ד הַ/גְּדֹלָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ בְּ/מִצְרַ֔יִם וַ/יִּֽירְא֥וּ הָ/עָ֖ם אֶת יְהוָ֑ה וַ/יַּֽאֲמִ֨ינוּ֙ בַּֽ/יהוָ֔ה וּ/בְ/מֹשֶׁ֖ה עַבְדּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/031.yaml
  text: Israel saw the great hand that Yahweh had done against Egypt[a], and the people feared Yahweh[b], and they believed in Yahweh and in Moses his servant.
translation:
  language: de
  text: Israel sah die große Macht, die Jahwe an den Ägyptern erwiesen hatte,[a] und das Volk fürchtete Jahwe. Sie glaubten an Jahwe und an Mose, seinen Diener.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht „die große Hand“; darauf folgt eine Wendung, die besagt, dass Jahwe sie „in Ägypten“ getan hatte. Die „Hand“ ist hier ein Bild für wirksame Macht. Im Zusammenhang kann die Wendung auch das gegen die Ägypter gerichtete Handeln meinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Gibt die unmittelbare Wahrnehmung des eben geschehenen Handelns schlicht und erzählerisch wieder.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Bewahrt das singularische Kollektiv des Hebräischen und den Wechsel zum folgenden Ausdruck „das Volk“.
- source_word: הַיָּד הַגְּדֹלָה
  choice: die gewaltige Macht
  rationale: „Hand“ ist hier ein geläufiges Bild für wirksame Macht. Im Deutschen wäre „die große Hand tun“ unverständlich; die Wiedergabe erschließt den Sinn, während die wörtliche Bildsprache in der Fußnote erhalten bleibt.
- source_word: אֲשֶׁר עָשָׂה יְהוָה בְּמִצְרַיִם
  choice: die Jahwe an Ägypten erwiesen hatte
  rationale: Verbindet עשה idiomatisch mit der als Macht verstandenen „Hand“ und lässt בְּמִצְרַיִם als gegen beziehungsweise an Ägypten gerichtetes Handeln erkennen, ohne die örtliche Lesart zu verschweigen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיִּירְאוּ
  choice: fürchtete
  rationale: Bewahrt die Grundbedeutung von ירא und lässt die Spannung zwischen Furcht, Ehrfurcht und Staunen offen.
- source_word: וַיַּאֲמִינוּ בַּיהוָה
  choice: Sie glaubten an Jahwe
  rationale: אמן im Hiphil mit בְּ bezeichnet hier glaubendes Vertrauen; „glaubten an“ bildet die Konstruktion knapp und natürlich ab.
- source_word: וּבְמֹשֶׁה עַבְדּוֹ
  choice: und an Mose, seinen Diener
  rationale: Die parallele Präposition wird erhalten. „Seinen Diener“ kennzeichnet Mose zugleich als Jahwe untergeordneten Beauftragten.
theological_decisions:
- issue: Das Verhältnis des Vertrauens zu Jahwe und zu Mose
  choice: Die parallele Formulierung „an Jahwe und an Mose“ bleibt erhalten; „seinen Diener“ verdeutlicht Moses untergeordnete Stellung.
  alternative: „Sie vertrauten Jahwe und auch Mose“ oder „sie glaubten Jahwe und Mose“.
  rationale: Der hebräische Text verwendet אמן + בְּ für beide Bezugsgrößen. Eine unterschiedliche Übersetzung würde die formale Parallelität abschwächen; der Zusatz „seinen Diener“ verhindert zugleich, dass Jahwe und Mose als gleichrangig erscheinen.
- issue: Bedeutungsumfang der Gottesfurcht
  choice: „fürchtete Jahwe“
  alternative: „hatte Ehrfurcht vor Jahwe“
  rationale: Die direkte Wiedergabe wahrt sowohl wirkliche Furcht angesichts des Gerichts als auch ehrfürchtiges Staunen über die Rettung, ohne sich auf nur eine Nuance festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah am hebräischen Erzählrhythmus, wird aber durch einen Punkt gegliedert. „Jahwe“ steht konsequent für das Tetragramm. Die ungewöhnliche hebräische Hand-Metapher wird im Haupttext idiomatisch und in der Fußnote wörtlich wiedergegeben.
