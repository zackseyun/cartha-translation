  register: Modernes, würdiges Standarddeutsch. Die indirekte Aufforderung „sie sollen“ bildet die hebräische Jussivfolge natürlich ab. Die Anrede wechselt anschließend entsprechend dem Hebräischen zur direkten 2. Person Plural („sollt ihr“).
