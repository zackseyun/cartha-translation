base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/002.yaml
  text: Speak to the sons of Israel[a], that they turn back and camp before Pi-hahiroth, between Migdol and the sea. Before Baal-zephon, opposite it[c][b], you shall camp by the sea.
translation:
  language: de
  text: Sag den Israeliten[a], sie sollen umkehren und vor Pi-Hahirot[b] ihr Lager aufschlagen, zwischen Migdol[b] und dem Meer. Baal-Zefon[b] gegenüber sollt ihr am Meer lagern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen Israels“. Gemeint ist das Volk Israel.'
    reason: lexical_alternative
  - marker: b
    text: Pi-Hahirot, Migdol und Baal-Zefon sind Ortsnamen und werden daher lautnah wiedergegeben, nicht übersetzt.
    reason: cultural_note
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: Sag den Israeliten
  rationale: Der Piel-Imperativ דַּבֵּר ist eine unmittelbare Aufforderung an Mose. „Israeliten“ gibt בְּנֵי יִשְׂרָאֵל im heutigen Deutsch natürlich und einschließlich des ganzen Volkes wieder; die wörtliche Familienbezeichnung wird in einer Fußnote genannt.
- source_word: וְיָשֻׁבוּ וְיַחֲנוּ
  choice: sie sollen umkehren und … ihr Lager aufschlagen
  rationale: Die verbundene Jussivfolge bezeichnet die befohlenen Handlungen. „Umkehren“ bewahrt den wichtigen Richtungswechsel; „ihr Lager aufschlagen“ ist eine natürliche deutsche Wiedergabe von חנה.
- source_word: לִפְנֵי פִּי הַחִירֹת
  choice: vor Pi-Hahirot
  rationale: לִפְנֵי bezeichnet hier die räumliche Lage. פִּי הַחִירֹת wird als Ortsname transliteriert und nicht etymologisch übersetzt.
- source_word: בֵּין מִגְדֹּל וּבֵין הַיָּם
  choice: zwischen Migdol und dem Meer
  rationale: Die zweiteilige Konstruktion בֵּין … וּבֵין grenzt die Lage durch zwei Bezugspunkte ein; הַיָּם bedeutet hier schlicht „das Meer“.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: Vor Baal-Zefon
  rationale: Die zweite Ortsangabe mit לִפְנֵי wird ebenfalls räumlich mit „vor“ wiedergegeben; der Eigenname bleibt transliteriert.
- source_word: נִכְחוֹ
  choice: ihm gegenüber
  rationale: נֹכַח mit maskulinem Singularsuffix bezeichnet eine gegenüberliegende Lage. Das Pronomen bezieht sich wahrscheinlich auf Baal-Zefon; das deutsche Genus des Namens legt „ihm“ nahe, ohne den Bezug endgültig festzulegen.
- source_word: תַחֲנוּ עַל־הַיָּם
  choice: sollt ihr am Meer lagern
  rationale: Das Imperfekt der 2. Person Plural hat hier auffordernde Kraft. עַל bezeichnet in diesem räumlichen Zusammenhang die Nähe zum Meer und wird idiomatisch mit „am“ wiedergegeben.
