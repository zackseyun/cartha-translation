base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Dann sprach Jahwe[a] zu Mose:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; auch „Jehova“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann sprach
  rationale: Das Waw-Consecutiv führt die Erzählung weiter; „Dann sprach“ gibt sowohl die Abfolge als auch die formelle Einleitung der Gottesrede natürlich wieder.
- source_word: יְהֹוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname JHWH wird als „Jahwe“ wiedergegeben; die Fußnote nennt die hebräische Form und eine traditionelle Alternative.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition kennzeichnet den Adressaten der Rede; im Deutschen ist „zu Mose sprechen“ die natürliche Verbindung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Die im modernen Standarddeutsch etablierte biblische Namensform wird verwendet.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeformel leitet den folgenden Wortlaut ein. Im natürlichen Deutschen erfüllt ein Doppelpunkt diese Funktion, ohne das schwerfällige „indem er sagte“ hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird erkennbar als Name wiedergegeben, statt ihn durch einen Titel zu ersetzen. „Jahwe“ entspricht der gängigen wissenschaftlichen Rekonstruktion; „Jehova“ wird als traditionelle Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Erzählungsdeutsch. Der Doppelpunkt gibt die formelhafte Konstruktion לֵאמֹר idiomatisch wieder und passt dazu, dass die Gottesrede im folgenden Vers beginnt.
