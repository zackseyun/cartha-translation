id: EXO.14.3
reference: Exodus 14:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָמַ֤ר פַּרְעֹה֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל נְבֻכִ֥ים הֵ֖ם בָּ/אָ֑רֶץ סָגַ֥ר עֲלֵי/הֶ֖ם הַ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/003.yaml
  text: For Pharaoh will say of the sons of Israel[a], ‘They are confused in the land[c][b]; the wilderness has shut them in.’
translation:
  language: de
  text: 'Denn der Pharao wird über die Israeliten sagen: »Sie sind im Land orientierungslos[a]; die Wüste hat sie eingeschlossen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie sind im Land verwirrt«, »ratlos« oder »haben sich im Land verstrickt«. Das hebräische Wort kann Verwirrung, Desorientierung oder eine ausweglose Lage ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Die Wüste hat ihnen den Weg versperrt« beziehungsweise »hat sie eingekesselt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: Denn … wird sagen
  rationale: Das Waw leitet hier im Zusammenhang die vorausgesagte Reaktion des Pharaos ein. Das Futur gibt den zeitlichen Bezug wieder; »Denn« macht die erklärende Funktion im Deutschen natürlich deutlich.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: über die Israeliten
  rationale: Bei אמר kann ל die Personen bezeichnen, über die gesprochen wird. »Israeliten« ist im modernen Deutschen die natürliche, inhaltlich genaue Wiedergabe der hebräischen Wendung »Söhne Israels«.
- source_word: נְבֻכִים
  choice: orientierungslos
  rationale: Das Partizip bezeichnet einen Zustand der Ratlosigkeit oder Desorientierung und kann im Kontext auch den Eindruck des Feststeckens vermitteln. »Orientierungslos« vermeidet den nicht ausdrücklich genannten Zusatz eines Umherwanderns.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: Die Wiedergabe bleibt bewusst räumlich unspezifisch, da אֶרֶץ hier Ägypten oder das betreffende Gebiet bezeichnen kann.
- source_word: סָגַר עֲלֵיהֶם
  choice: hat sie eingeschlossen
  rationale: Die idiomatische Verbindung beschreibt, dass ihnen der Ausweg versperrt ist. »Eingeschlossen« bewahrt das Bild räumlicher Begrenzung.
- source_word: הַמִּדְבָּר
  choice: die Wüste
  rationale: מִדְבָּר bezeichnet unbesiedeltes, unkultiviertes Gebiet. »Wüste« ist hier im Exoduskontext eine klare und geläufige deutsche Wiedergabe, ohne notwendig eine reine Sandwüste zu meinen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist knapp gehalten. »Orientierungslos« bewahrt die Mehrdeutigkeit zwischen innerer Ratlosigkeit und räumlicher Desorientierung; die Alternativen werden in der Fußnote genannt.
