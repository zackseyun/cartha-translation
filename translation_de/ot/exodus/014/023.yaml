base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/023.yaml
  text: The Egyptians pursued and went in after them into the midst of the sea—all Pharaoh’s horses[a], his chariots[b], and his horsemen.
translation:
  language: de
  text: 'Die Ägypter verfolgten sie und zogen hinter ihnen mitten ins Meer hinein: alle Pferde des Pharaos, seine Streitwagen und seine Reiter.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: Die Ägypter verfolgten sie
  rationale: Das Subjekt מִצְרַיִם bezeichnet hier wegen des pluralischen Verbs und des Erzählzusammenhangs die Ägypter; רדף wird im militärischen Kontext natürlich mit „verfolgen“ wiedergegeben. Das im Deutschen nötige Objekt „sie“ ergibt sich aus dem Zusammenhang.
- source_word: וַיָּבֹאוּ אַחֲרֵיהֶם
  choice: und zogen hinter ihnen … hinein
  rationale: בוא bezeichnet hier die Bewegung in das Meer hinein; „zogen … hinein“ passt natürlich zu einem militärischen Verband. אַחֲרֵיהֶם wird als „hinter ihnen“ wiedergegeben und bewahrt sowohl die räumliche als auch die verfolgungsbezogene Bedeutung.
- source_word: כֹּל סוּס פַּרְעֹה
  choice: alle Pferde des Pharaos
  rationale: Der Singular סוּס ist nach כֹּל kollektiv gebraucht. Der deutsche Plural gibt diesen Sinn idiomatisch wieder.
- source_word: רִכְבּוֹ
  choice: seine Streitwagen
  rationale: רֶכֶב kann einzelne Streitwagen oder die Streitwagenmacht bezeichnen. „Streitwagen“ ist hier im Rahmen der konkreten Aufzählung klar und natürlich.
- source_word: וּפָרָשָׁיו
  choice: und seine Reiter
  rationale: פָרָשׁ bezeichnet berittene Kämpfer. „Reiter“ ist modernes, klares Deutsch und lässt die militärische Bedeutung im Kontext erkennen.
- source_word: אֶל תּוֹךְ הַיָּם
  choice: mitten ins Meer hinein
  rationale: תּוֹךְ betont das Innere beziehungsweise die Mitte des Meeres. „Mitten ins Meer hinein“ bewahrt diese räumliche Hervorhebung in natürlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Klarheit. Die Aufzählung nach dem Doppelpunkt bildet die hebräische Nachstellung der gesamten Streitmacht verständlich ab. Es sind keine Fußnoten nötig, da der kollektive Singular und die räumliche Wendung im Deutschen ohne Bedeutungsverlust natürlich wiedergegeben werden können.
