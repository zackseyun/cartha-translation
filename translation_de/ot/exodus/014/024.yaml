base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/024.yaml
  text: And in the morning watch[a], Yahweh looked down on the camp of the Egyptians through the pillar of fire and cloud[b], and threw the camp of the Egyptians into confusion.
translation:
  language: de
  text: In der Morgenwache blickte Jahwe aus[a] der Feuer- und Wolkensäule auf das Lager der Ägypter hinab und versetzte das Lager der Ägypter in Verwirrung.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: durch die Feuer- und Wolkensäule.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: versetzte das Lager der Ägypter in Panik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: in der Morgenwache
  rationale: Die Wendung bezeichnet die letzte nächtliche Wachperiode gegen Morgen. „Morgenwache“ ist im Deutschen präzise und verständlich.
- source_word: וַיַּשְׁקֵף
  choice: blickte … hinab
  rationale: Das Verb bezeichnet hier einen Blick von einem erhöhten oder übergeordneten Standort aus; „hinabblicken“ bewahrt diese räumliche Perspektive.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Umschrift.
- source_word: מַחֲנֵה מִצְרַיִם
  choice: das Lager der Ägypter
  rationale: Die Genitivfügung gibt das ägyptische Heerlager natürlich wieder und bleibt nahe an der hebräischen Konstruktion.
- source_word: בְּעַמּוּד אֵשׁ וְעָנָן
  choice: aus der Feuer- und Wolkensäule
  rationale: Die Präposition ב kann hier lokal beziehungsweise vermittelnd verstanden werden. „Aus der … Säule“ drückt den Standort des göttlichen Blicks idiomatisch aus; die instrumentale Deutung wird in der Fußnote bewahrt.
- source_word: וַיָּהָם
  choice: stürzte … in Verwirrung
  rationale: Die Kausativform bezeichnet das Hervorrufen von Tumult, Verwirrung oder Panik. Diese Wiedergabe erhält die verursachende Kraft, ohne bereits eine vollständige Flucht oder Niederlage auszudrücken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. Die Umschrift als „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Art der göttlichen Gegenwart in der Säule
  choice: aus der Feuer- und Wolkensäule
  alternative: durch die Feuer- und Wolkensäule
  rationale: Das hebräische ב lässt eine lokale wie auch eine instrumentale Nuance zu. Der Haupttext wählt die natürliche lokale Formulierung, während die Fußnote die vermittelnde Lesart offenhält.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Wiederholung von „das Lager der Ägypter“ folgt der hebräischen Hervorhebung. Die Fußnotenmarker wurden den tatsächlich erläuterten Ausdrücken zugeordnet.
