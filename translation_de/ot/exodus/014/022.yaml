source:
  edition: WLC
  text: וַ/יָּבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/ת֥וֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָׁ֑ה וְ/הַ/מַּ֤יִם לָ/הֶם֙ חֹמָ֔ה מִֽ/ימִינָ֖/ם וּ/מִ/שְּׂמֹאלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/022.yaml
  text: And the sons of Israel went into the midst of the sea on the dry ground[a], and the waters were a wall to them on their right and on their left.
translation:
  language: de
  text: Da gingen die Israeliten mitten ins Meer hinein, auf trockenem Boden; und das Wasser war für sie rechts und links eine Mauer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da gingen … hinein
  rationale: בוא bezeichnet hier die Bewegung in einen Bereich hinein. Die deutsche Verbklammer „gingen … hinein“ gibt die Richtung im Erzählzusammenhang natürlich wieder.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Form lautet „die Söhne Israels“, bezeichnet hier jedoch das Volk insgesamt. „Die Israeliten“ ist im modernen Deutsch klar, präzise und schließt die ganze Volksgemeinschaft ein, ohne den Sinn zu verändern.
- source_word: בְּתוֹךְ הַיָּם
  choice: mitten ins Meer
  rationale: בְּתוֹךְ bezeichnet das Innere beziehungsweise die Mitte. „Mitten ins Meer“ bewahrt das räumliche Bild und klingt im Deutschen natürlicher als „in die Mitte des Meeres“.
- source_word: בַּיַּבָּשָׁה
  choice: auf trockenem Boden
  rationale: Das Substantiv bezeichnet das Trockene im Gegensatz zum Wasser. „Trockener Boden“ macht anschaulich, dass der Meeresgrund begehbar war.
- source_word: וְהַמַּיִם
  choice: und das Wasser
  rationale: Das morphologisch plurale hebräische Wort מַיִם wird im modernen Deutschen idiomatisch als singularisches Stoffwort „Wasser“ wiedergegeben.
- source_word: חֹמָה
  choice: eine Mauer
  rationale: חֹמָה bedeutet konkret „Mauer“. Da im Hebräischen kein Vergleichswort steht, wird nicht abschwächend „wie eine Mauer“ übersetzt.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: rechts und links
  rationale: Die knappe deutsche Wendung gibt die beiden räumlichen Seitenangaben parallel und eindeutig wieder. Die Zuordnung „für sie“ bleibt durch den vorangehenden Ausdruck erhalten.
theological_decisions:
- issue: Darstellung des geteilten Wassers
  choice: „das Wasser war für sie … eine Mauer“
  alternative: „das Wasser war für sie wie eine Mauer“
  rationale: Der Ausgangstext setzt Wasser und Mauer ohne ausdrückliches Vergleichspartikel in Beziehung. Die Übersetzung bewahrt diese starke, konkrete Aussage, ohne sie als bloßen Vergleich auszulegen.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. „Die Israeliten“ ist gegenüber dem wörtlichen, heute missverständlichen „die Söhne Israels“ idiomatisch; der übrige Satz bewahrt die konkrete räumliche Bildsprache und die knappe Parallelität des Hebräischen.
