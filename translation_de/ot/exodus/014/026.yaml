source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה נְטֵ֥ה אֶת יָדְ/ךָ֖ עַל הַ/יָּ֑ם וְ/יָשֻׁ֤בוּ הַ/מַּ֨יִם֙ עַל מִצְרַ֔יִם עַל רִכְבּ֖/וֹ וְ/עַל פָּרָשָֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/026.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the sea, so that the waters may return over the Egyptians, over their chariots, and over their horsemen.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Strecke deine Hand über das Meer aus, damit das Wasser über die Ägypter, über ihre Streitwagen und über ihre Reiter zurückströmt[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und das Wasser wird über die Ägypter, über ihre Streitwagen und über ihre Reiter zurückströmen“. Das hebräische Verb kann als einfache Zukunftsform wiedergegeben werden; hier bezeichnet es wahrscheinlich die beabsichtigte Folge von Moses'' Handlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw mit der Erzählform führt die Handlung weiter. „Da“ gibt diese zeitlich-fortschreitende Funktion in natürlichem modernem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Wiedergabe des göttlichen Eigennamens bewahrt den Unterschied zwischen dem Tetragramm und einem bloßen Titel wie „der HERR“.
- source_word: נְטֵה אֶת־יָדְךָ
  choice: Strecke deine Hand … aus
  rationale: Die Formulierung gibt den Imperativ und die konkrete Geste idiomatisch und anschaulich wieder.
- source_word: עַל־הַיָּם
  choice: über das Meer
  rationale: „Über“ bewahrt die räumliche Bedeutung von עַל und passt im Deutschen natürlich zur ausgestreckten Hand.
- source_word: וְיָשֻבוּ
  choice: damit … zurückströmt
  rationale: Nach dem Imperativ lässt sich die Präfixform als beabsichtigte Folge der Handlung verstehen. „Zurückströmen“ gibt bei Wasser die Rückbewegung natürlich wieder, ohne das Ziel dieser Bewegung abzuschwächen.
- source_word: הַמַּיִם
  choice: das Wasser
  rationale: Obwohl das hebräische Wort formal im Plural steht, ist „das Wasser“ im modernen Deutschen die natürliche kollektive Bezeichnung.
- source_word: עַל מִצְרַיִם
  choice: über die Ägypter
  rationale: Die Wendung bewahrt das Bild, dass das zurückkehrende Wasser sie überdeckt; „gegen“ wäre stärker interpretierend.
- source_word: עַל רִכְבּוֹ
  choice: über ihre Streitwagen
  rationale: Der hebräische Singularsuffix bezieht sich auf Ägypten beziehungsweise die kollektiv verstandenen Ägypter. Der deutsche Pluralbezug „ihre“ macht dies natürlich verständlich.
- source_word: וְעַל פָּרָשָׁיו
  choice: und über ihre Reiter
  rationale: „Reiter“ ist die direkte, allgemein verständliche Wiedergabe; „Kavallerie“ wäre militärtechnischer und stärker abstrahierend.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ gibt ihn in geläufiger deutscher Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis zwischen Moses Handlung und der Rückkehr des Wassers
  choice: 'beabsichtigte Folge: „damit … zurückströmt“'
  alternative: 'einfache Zukunft: „und das Wasser wird … zurückströmen“'
  rationale: Die Form nach dem Imperativ kann hier die beabsichtigte Folge ausdrücken. Da auch eine schlichtere futurische Verbindung möglich ist, bleibt diese in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. Die dreifache Wiederholung von „über“ bewahrt die rhetorische Struktur des Hebräischen. „Das Wasser“ ist natürlicher als das im Deutschen ungewöhnliche „die Wasser“, während „zurückströmt“ die Bewegung im Kontext anschaulich ausdrückt.
