id: EXO.14.30
reference: Exodus 14:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יּ֨וֹשַׁע יְהוָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא אֶת יִשְׂרָאֵ֖ל מִ/יַּ֣ד מִצְרָ֑יִם וַ/יַּ֤רְא יִשְׂרָאֵל֙ אֶת מִצְרַ֔יִם מֵ֖ת עַל שְׂפַ֥ת הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/030.yaml
  text: So Yahweh saved Israel that day from the hand of Egypt[b][a], and Israel saw the Egyptians dead on the seashore.
translation:
  language: de
  text: So rettete Jahwe Israel an jenem Tag aus der Hand Ägyptens[a], und Israel sah die toten Ägypter am Ufer des Meeres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »aus der Hand Ägyptens«; gemeint ist die Befreiung aus Ägyptens Macht.'
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: »am Rand des Meeres«; wörtlich steht hier »an der Lippe des Meeres«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: rettete
  rationale: Der Hifil von ישׁע bezeichnet hier Jahwes rettendes Eingreifen zugunsten Israels. »Rettete« ist im modernen Deutsch klar, natürlich und bewahrt das theologische Gewicht der Aussage.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, der im Deutschen üblichen Form der wissenschaftlich begründeten Aussprache des Tetragramms, statt ihn durch einen Titel zu ersetzen.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die Wendung ist eine Zeitangabe; »an jenem Tag« entspricht ihr genau und klingt in gehobener deutscher Erzählprosa natürlich.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die hebräische Metapher bezeichnet Macht oder Gewalt. »Aus der Hand« bewahrt das Bild und bleibt im Deutschen verständlich.
- source_word: מִצְרַיִם / מִצְרָיִם
  choice: Ägypten / die Ägypter
  rationale: Der Name bezeichnet im ersten Satzteil Ägypten als Macht, im zweiten kollektiv die ägyptischen Menschen, deren Leichen Israel sah.
- source_word: וַיַּרְא
  choice: sah
  rationale: Schlichte und genaue Wiedergabe von ראה im erzählenden Zusammenhang.
- source_word: מֵת
  choice: die toten
  rationale: Das im Hebräischen singularisch-kollektiv gebrauchte Adjektiv wird im Deutschen attributiv und im Plural wiedergegeben, weil sich »Ägypten« hier auf die Ägypter bezieht. So bleibt der Sinn ohne die nicht ausdrücklich genannte Ergänzung »liegen« natürlich verständlich.
- source_word: עַל שְׂפַת הַיָּם
  choice: am Ufer des Meeres
  rationale: שְׂפַת bedeutet wörtlich »Lippe« und bezeichnet hier den Rand beziehungsweise das Ufer des Meeres. Die gewählte Formulierung ist genau und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt ihn als Eigennamen und verwendet die im modernen Standarddeutsch etablierte Form, ohne ihn durch einen Titel zu ersetzen.
- issue: Subjekt der Rettung
  choice: Jahwe rettete Israel
  alternative: Israel wurde gerettet
  rationale: Die aktive Form des Hebräischen hebt Jahwe als Handelnden ausdrücklich hervor; dies wird nicht durch eine passive Form abgeschwächt.
translation_notes:
  register: Moderne, würdige deutsche Erzählsprache. Die einleitende Folgepartikel וַ wird mit »So« wiedergegeben, da der Vers das Ergebnis des vorausgehenden Geschehens zusammenfasst. Die hebräische Hand-Metapher bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
