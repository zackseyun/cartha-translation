source:
  edition: WLC
  text: וְ/יָדְע֥וּ מִצְרַ֖יִם כִּי אֲנִ֣י יְהוָ֑ה בְּ/הִכָּבְדִ֣/י בְּ/פַרְעֹ֔ה בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/018.yaml
  text: And the Egyptians will know that I am Yahweh[a], when I gain glory through Pharaoh, through his chariots[b], and through his horsemen.
translation:
  language: de
  text: Und die Ägypter werden erkennen, dass ich Jahwe[a] bin, wenn ich am Pharao, an seinen Streitwagen und an seinen Reitern verherrlicht werde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Gottesname JHWH wird traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „wenn ich am Pharao, an seinen Streitwagen und an seinen Reitern meine Herrlichkeit erweise“; auch möglich: „wenn ich mich an ihnen verherrliche“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Und die Ägypter werden erkennen
  rationale: Das Qal-Perfekt mit וְ bezeichnet hier die künftige Folge des angekündigten Eingreifens. „Erkennen“ gibt das über bloßes Wissen hinausgehende Anerkennen im Zusammenhang der Erkenntnisformel wieder.
- source_word: מִצְרַיִם
  choice: die Ägypter
  rationale: Der Ländername bezeichnet hier metonymisch die Menschen Ägyptens, die Jahwe durch das bevorstehende Geschehen erkennen werden.
- source_word: כִּי אֲנִי יְהוָה
  choice: dass ich Jahwe bin
  rationale: Die Formulierung bewahrt die biblische Erkenntnisformel und gibt das Tetragramm als persönlichen Gottesnamen wieder.
- source_word: בְּהִכָּבְדִי
  choice: wenn ich … meine Herrlichkeit erweise
  rationale: Die Konstruktion aus בְּ mit dem Infinitiv von כבד und dem Suffix der 1. Person bezeichnet den Zeitpunkt, an dem Jahwes Herrlichkeit beziehungsweise Ehre im Gericht sichtbar wird. Die deutsche Formulierung ist natürlich, ohne das Geschehen auf bloße Selbstdarstellung zu reduzieren.
- source_word: בְּפַרְעֹה
  choice: am Pharao
  rationale: בְּ bezeichnet hier die Person beziehungsweise den Bereich, an dem Jahwes Herrlichkeit durch sein Handeln offenbar wird. „Am Pharao“ bewahrt die wiederholte hebräische Präposition.
- source_word: בְּרִכְבּוֹ
  choice: an seinen Streitwagen
  rationale: רֶכֶב ist hier kollektiv für die ägyptische Streitwagenmacht gebraucht; der deutsche Plural gibt diesen militärischen Sinn klar wieder.
- source_word: וּבְפָרָשָׁיו
  choice: und an seinen Reitern
  rationale: פָּרָשׁ bezeichnet berittene Kämpfer beziehungsweise die Reiterei. „Reiter“ ist im modernen Deutsch direkt und verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen JHWH. „Jahwe“ macht diesen Namen im Haupttext sichtbar; die traditionelle deutsche Ersatzlesung wird in einer Fußnote genannt.
- issue: Bedeutung von בְּהִכָּבְדִי
  choice: wenn ich … meine Herrlichkeit erweise
  alternative: wenn ich … verherrlicht werde / wenn ich mich … verherrliche
  rationale: Die Nifal-Form von כבד lässt sich passiv oder reflexiv beziehungsweise resultativ verstehen. Der Haupttext bezeichnet die Offenbarung von Jahwes Herrlichkeit im Gericht, während die Fußnote die grammatisch näheren Alternativen offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache hebräische בְּ-Konstruktion wird durch „am/an/an“ hörbar bewahrt. „Streitwagen“ und „Reiter“ sind allgemein verständlich und halten den militärischen Zusammenhang fest.
