source:
  edition: WLC
  text: וַ/יָּשֻׁ֣בוּ הַ/מַּ֗יִם וַ/יְכַסּ֤וּ אֶת הָ/רֶ֨כֶב֙ וְ/אֶת הַ/פָּ֣רָשִׁ֔ים לְ/כֹל֙ חֵ֣יל פַּרְעֹ֔ה הַ/בָּאִ֥ים אַחֲרֵי/הֶ֖ם בַּ/יָּ֑ם לֹֽא נִשְׁאַ֥ר בָּ/הֶ֖ם עַד אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/028.yaml
  text: And the waters returned and covered the chariots and the horsemen[a], all the army of Pharaoh that had gone after them into the sea; not one of them remained.
translation:
  language: de
  text: Da kehrte das Wasser zurück und bedeckte die Streitwagen und die Reiter[a], das ganze Heer des Pharaos, das ihnen ins Meer nachgezogen war; nicht einer von ihnen blieb übrig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Reiterei“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּיִם
  choice: Da kehrte das Wasser zurück
  rationale: שׁוב bezeichnet hier die Rückkehr des zuvor geteilten Wassers. Obwohl מַיִם morphologisch pluralisch ist, steht im modernen Standarddeutsch idiomatisch der Singular „das Wasser“.
- source_word: וַיְכַסּוּ
  choice: bedeckte
  rationale: Die schlichte Grundbedeutung von כסה ist „bedecken“. Der Singular richtet sich im Deutschen nach „das Wasser“.
- source_word: הָרֶכֶב
  choice: die Streitwagen
  rationale: רֶכֶב kann kollektiv die Streitwagenmacht bezeichnen; „die Streitwagen“ ist konkret, verständlich und passt zur erzählerischen Darstellung.
- source_word: הַפָּרָשִׁים
  choice: die Reiter
  rationale: פָּרָשִׁים bezeichnet berittene Kämpfer beziehungsweise Reiterei. „Reiter“ ist direkt und natürlich; die kollektive Alternative wird in einer Fußnote genannt.
- source_word: לְכֹל חֵיל פַּרְעֹה
  choice: das ganze Heer des Pharaos
  rationale: חֵיל bezeichnet hier die militärische Streitmacht; לְכֹל drückt deren Gesamtheit aus.
- source_word: הַבָּאִים אַחֲרֵיהֶם בַּיָּם
  choice: das ihnen ins Meer nachgezogen war
  rationale: Die partizipiale Wendung wird als Relativsatz wiedergegeben. „ins Meer“ bewahrt die gerichtete Bewegung, und „ihnen nachgezogen“ bezeichnet die Verfolgung Israels.
- source_word: לֹא נִשְׁאַר בָּהֶם עַד אֶחָד
  choice: nicht einer von ihnen blieb übrig
  rationale: Die hebräische Wendung betont vollständig, dass aus der zuvor bestimmten Gruppe niemand übrig blieb.
theological_decisions:
- issue: Umfang der Vernichtung des Heeres des Pharaos
  choice: Die Aussage bezieht die vollständige Vernichtung auf das gesamte Heer des Pharaos, das Israel ins Meer nachgezogen war.
  alternative: Man könnte „das ganze Heer des Pharaos“ losgelöst als Aussage über sämtliche ägyptischen Streitkräfte verstehen.
  rationale: Der Relativsatz הַבָּאִים אַחֲרֵיהֶם בַּיָּם grenzt die gemeinte Gruppe auf die Verfolger ein, die ins Meer hineingezogen waren; die emphatische Aussage „nicht einer“ gilt vollständig für diese Gruppe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der hebräischen Erzählfolge, bleibt aber natürlich lesbar. Das Semikolon hält die abschließende, nachdrückliche Totalaussage eng mit der bezeichneten Verfolgergruppe verbunden.
