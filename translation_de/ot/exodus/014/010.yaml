  variant: modern standard German
source:
  edition: WLC
  text: וּ/פַרְעֹ֖ה הִקְרִ֑יב וַ/יִּשְׂאוּ֩ בְנֵֽי יִשְׂרָאֵ֨ל אֶת עֵינֵי/הֶ֜ם וְ/הִנֵּ֥ה מִצְרַ֣יִם נֹסֵ֣עַ אַחֲרֵי/הֶ֗ם וַ/יִּֽירְאוּ֙ מְאֹ֔ד וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/010.yaml
  text: As Pharaoh drew near[a], the sons of Israel lifted up their eyes, and behold, the Egyptians were marching after them; and they were very afraid[b], and the sons of Israel cried out to Yahweh.
translation:
  language: de
  text: 'Als der Pharao näher kam, blickten die Söhne Israels auf, und siehe: Ägypten[a] zog hinter ihnen her. Da fürchteten sie sich sehr, und die Söhne Israels schrien zu Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ägypten“ steht hier kollektiv für die ägyptische Streitmacht, die ihnen folgte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְרִיב
  choice: näher kam
  rationale: Das Hifil von קרב hat hier beim Subjekt Pharao intransitiven Sinn und bezeichnet sein Herannahen.
- source_word: וַיִּשְׂאוּ ... אֶת עֵינֵיהֶם
  choice: blickten ... auf
  rationale: Die natürliche deutsche Wendung gibt das hebräische Idiom des Erhebens der Augen knapp und verständlich wieder.
- source_word: וְהִנֵּה
  choice: und sieh
  rationale: Bewahrt den Hinweis auf eine plötzliche Wahrnehmung und die dramatische Unmittelbarkeit.
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Bewahrt den im Hebräischen stehenden Eigennamen, der hier kollektiv die nachrückende ägyptische Streitmacht bezeichnet.
- source_word: נֹסֵעַ אַחֲרֵיהֶם
  choice: zog hinter ihnen her
  rationale: Gibt die fortschreitende Bewegung im Verfolgungskontext wieder, ohne das lexikalisch allgemeinere נסע unnötig auf „verfolgte“ festzulegen.
- source_word: וַיִּירְאוּ מְאֹד
  choice: Da fürchteten sie sich sehr
  rationale: Natürliche, würdevolle Wiedergabe des Verbs mit Intensivierung.
- source_word: וַיִּצְעֲקוּ
  choice: schrien
  rationale: Drückt den dringlichen Hilferuf in großer Bedrängnis aus.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als Gottes persönlichen Namen wieder, statt es durch einen Titel zu ersetzen.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Bewahrt die ausdrücklich maskuline, zugleich kollektiv-nationale Formulierung des Ausgangstextes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst; „Jahwe“ bewahrt ihn, statt einen traditionellen Ersatztitel einzusetzen.
- issue: Korporative Bezeichnung בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die formnahe Wiedergabe erhält die maskuline und zugleich korporative Bundes- und Volksbezeichnung, ohne ihren Bezug nur auf einzelne Männer einzuengen.
- issue: Kollektiver Gebrauch von מִצְרַיִם
  choice: Ägypten
  alternative: die Ägypter
  rationale: „Ägypten“ erhält die Metonymie des Hebräischen; der Zusammenhang macht deutlich, dass die ägyptische Streitmacht gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht quellennaher Erzählfärbung. „Und sieh“ erhält die dramatische Wahrnehmungsmarkierung; „zog hinter ihnen her“ klingt natürlicher als eine wörtliche Wiedergabe mit „reisen“ oder „aufbrechen“.
