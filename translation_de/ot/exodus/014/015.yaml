base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/015.yaml
  text: Then Yahweh said to Moses[b][a], “Why are you crying out to me? Tell the sons of Israel to set out.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Warum schreist du zu mir? Sag den Israeliten[a], sie sollen aufbrechen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: den Söhnen Israels.'
