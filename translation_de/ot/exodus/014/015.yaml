  source_fidelity: 'Die Satzstruktur und die Handlungsfolge sind zutreffend wiedergegeben: Jahwe richtet die Frage an Mose und befiehlt ihm, zu den בני ישראל zu sprechen, damit sie aufbrechen. „Warum schreist du zu mir?“ gibt die zurechtweisende Frage und die Intensität von צעק angemessen wieder; „sie sollen aufbrechen“ gibt den auffordernden Jussiv וְיִסָּעוּ natürlich wieder. Die Haupttextwiedergabe „den Söhnen Israels“ kann im modernen Deutschen jedoch fälschlich ausschließlich männliche Personen bezeichnen, während die hebräische feste Kollektivbezeichnung das ganze Volk meint.'
  naturalness: „Da sagte Jahwe zu Mose“ und die direkte Rede sind klares modernes Standarddeutsch. „Sag den Israeliten, sie sollen aufbrechen“ ist idiomatischer und kommuniziert den im Kontext gemeinten Kollektivbezug ohne unnötige männliche Einengung. Die wörtliche Form kann transparent in einer Fußnote dokumentiert werden.
  terminology: „Jahwe“ entspricht der gewählten Wiedergabe von יהוה. „Israeliten“ ist hier die sachgerechte deutsche Bezeichnung für בני ישראל als Volksbezeichnung; „Söhne Israels“ wird als wörtliche Fußnotenangabe bewahrt. „Aufbrechen“ ist eine passende Wiedergabe von נסע.
