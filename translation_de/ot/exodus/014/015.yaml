    rationale: בני ישראל ist in diesem Kontext eine etablierte kollektive Volksbezeichnung und meint nicht nur die männlichen Nachkommen bzw. Männer. Die vorhandene Fußnote behandelt „den Israeliten“ fälschlich als bloße Alternative, obwohl dies die kontextuell angemessene deutsche Haupttextbedeutung ist.
