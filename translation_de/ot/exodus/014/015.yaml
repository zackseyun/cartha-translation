lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw mit אמר führt die Handlung weiter. „Da sagte“ gibt die zeitliche Folge in natürlichem modernem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: מַה תִּצְעַק אֵלָי
  choice: Warum schreist du zu mir?
  rationale: מַה hat in dieser Verbindung fragend-zurechtweisende Kraft; צעק bezeichnet ein eindringliches Rufen aus Not oder als Hilferuf.
- source_word: דַּבֵּר אֶל
  choice: Sag
  rationale: Das Imperativgefüge bedeutet wörtlich „Rede zu“. Im Deutschen gibt „Sag …, sie sollen …“ den anschließenden Auftrag klar und idiomatisch wieder, ohne ihn zu einem ausdrücklich bezeichneten Befehl zu verstärken.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Die formale hebräische Bezeichnung wird bewahrt. Die im Kontext kollektiv gemeinte, im Deutschen idiomatischere Wiedergabe „den Israeliten“ steht in der Fußnote.
- source_word: וְיִסָּעוּ
  choice: sie sollen aufbrechen
  rationale: נסע bezeichnet das Aufbrechen beziehungsweise Weiterziehen. Die deutsche Soll-Konstruktion gibt den auffordernden Jussiv nach dem Imperativ natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: „Jahwe“ bewahrt die Unterscheidung zwischen dem persönlichen Bundesnamen und einem bloßen Titel, ohne eine konfessionelle Sonderform einzuführen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Der Haupttext hält die formal männliche und traditionelle Bundesbezeichnung fest; die Fußnote macht deutlich, dass die Wendung kollektiv die Israeliten bezeichnet.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die direkte Frage behält ihre eindringliche, leicht zurechtweisende Wirkung; die Befehlsfolge bleibt knapp und handlungsorientiert.
