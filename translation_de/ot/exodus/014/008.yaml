  to: Und der HERR verhärtete[a] das Herz des Pharaos, des Königs von Ägypten, und er verfolgte die Israeliten, während die Israeliten mit erhobener Hand auszogen.[b]
  rationale: Die Revision beseitigt die nicht ausdrücklich im Ausgangstext vorhandene Folgerungsbeziehung von »sodass« und stellt durch »während ... auszogen« die Gleichzeitigkeit mit dem hebräischen Partizip heraus. Die Fußnote zur Bildformel wird auf gut belegte, nicht ausschließende Sinnrichtungen beschränkt. Die direkte Aussage über das Handeln des HERRN und die lexikalische Alternative zu »verhärtete« bleiben erhalten.
