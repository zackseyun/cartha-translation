  text: וַ/יְחַזֵּ֣ק יְהֹוָ֗ה אֶת לֵ֤ב פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יִּרְדֹּ֕ף אַחֲרֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בְנֵ֣י יִשְׂרָאֵ֔ל יֹצְאִ֖ים בְּ/יָ֥ד רָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/008.yaml
  text: And Yahweh hardened the heart of Pharaoh king of Egypt[a], and he pursued the sons of Israel[b], while the sons of Israel were going out with a high hand.
translation:
  language: de
  text: Und der HERR verhärtete[a] das Herz des Pharaos, des Königs von Ägypten, und er verfolgte die Israeliten, während die Israeliten mit erhobener Hand auszogen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »machte das Herz des Pharaos stark/fest«. Das hebräische Verb bedeutet grundsätzlich »stark oder fest machen«; in diesem Zusammenhang kann es den Sinn von »verhärten« oder »im Entschluss festigen« haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »mit hoher Hand«. Die Wendung kann ein offenes, zuversichtliches oder triumphierendes Ausziehen bezeichnen.'
    reason: idiom_explanation
lexical_decisions:
- source_word: יְהֹוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen ist würdig, geläufig und macht kenntlich, dass im Hebräischen JHWH steht.
- source_word: וַיְחַזֵּק
  choice: verhärtete
  rationale: חזק bedeutet grundsätzlich „stark/fest machen“; in der wiederkehrenden Verbindung mit dem Herzen des Pharaos bezeichnet es hier die Verhärtung beziehungsweise Festigung seines widerstrebenden Entschlusses. Die wörtlichere Alternative wird in der Fußnote erhalten.
- source_word: לֵב
  choice: Herz
  rationale: „Herz“ bewahrt das hebräische Bild für das Zentrum von Willen, Entschluss und innerer Haltung und ist im Deutschen verständlich.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: des Pharaos, des Königs von Ägypten
  rationale: Die Apposition wird in natürlichem Deutsch eindeutig auf den Pharao bezogen.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: sodass er den Israeliten nachjagte
  rationale: רדף אחרי bezeichnet ein feindliches Verfolgen. „Nachjagen“ ist natürlich und lässt den militärischen Zusammenhang erkennen; „sodass“ gibt die kontextuelle Folge wieder, ohne die göttliche Handlung abzuschwächen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die idiomatische Volksbezeichnung ist in modernem Deutsch natürlicher als „Söhne Israels“ und schließt hier das ganze Volk ein. Die Wiederholung des hebräischen Ausdrucks bleibt durch die zweimalige Bezeichnung „Israeliten“ erkennbar.
- source_word: יֹצְאִים
  choice: zogen … aus
  rationale: Das Partizip beschreibt den beim Verfolgen bestehenden Vorgang. Die deutsche Erzählform mit „aber“ stellt die gleichzeitige beziehungsweise kontrastierende Lage flüssig dar.
- source_word: בְּיָד רָמָה
  choice: mit erhobener Hand
  rationale: Die konkrete hebräische Wendung wird bewahrt, statt sie im Haupttext ausschließlich als „kühn“ oder „unbehelligt“ auszulegen.
theological_decisions:
- issue: Göttliches Handeln bei der Verhärtung des Pharaos
  choice: der HERR verhärtete das Herz des Pharaos
  alternative: der HERR stärkte/festigte das Herz des Pharaos
  rationale: Der hebräische Text schreibt die Handlung unmittelbar dem HERRN zu. Diese theologische Spannung wird nicht abgeschwächt; zugleich wird die lexikalisch mögliche Wiedergabe „machte fest“ in einer Fußnote genannt.
- issue: Bedeutung der erhobenen Hand
  choice: mit erhobener Hand
  alternative: kühn / selbstbewusst / unbehelligt
  rationale: Das Bild kann Kühnheit, Selbstbewusstsein oder ungehindertes Ausziehen ausdrücken. Der Haupttext bewahrt die Bildsprache und die Fußnote nennt mögliche Sinnrichtungen, ohne eine davon zur alleinigen Deutung zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Haupttext ist natürlich formuliert, bewahrt aber die direkte Aussage über Gottes Handeln und das konkrete Bild der »erhobenen Hand«. Sämtliche Fußnotenmarker stehen im Haupttext.
