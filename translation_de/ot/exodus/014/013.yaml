base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/013.yaml
  text: And Moses said to the people, “Do not fear. Stand firm, and see the salvation of the LORD, which he will accomplish for you today; for the Egyptians whom you see today, you will never see again forever.”
translation:
  language: de
  text: 'Da sagte Mose zum Volk: »Fürchtet euch nicht! Steht fest und seht die Rettung des HERRN, die er heute für euch vollbringen wird. Denn die Ägypter, die ihr heute seht, werdet ihr nie wiedersehen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Satzfügung kann auch vergleichend verstanden werden: »Denn so, wie ihr die Ägypter heute seht, werdet ihr sie nicht wiedersehen bis in Ewigkeit.«'
    reason: Macht die mögliche alternative Analyse von אֲשֶׁר transparent, ohne sie gegenüber der natürlichen Relativsatzlesung im Haupttext zu bevorzugen; die ausdrückliche Endgültigkeit von עַד עוֹלָם bleibt dokumentiert.
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: Fürchtet euch nicht
  rationale: Gibt das hebräische Verbot direkt und in würdigem, geläufigem Deutsch wieder.
- source_word: הִתְיַצְבוּ
  choice: Bleibt standhaft
  rationale: Der Hitpael-Imperativ fordert dazu auf, festen Stand zu bewahren; die Wiedergabe ist natürlicher als das wörtlichere »Stellt euch hin« und bewahrt den Aufruf zum unbeirrten Ausharren.
- source_word: יְשׁוּעַת יְהוָה
  choice: die Rettung des HERRN
  rationale: יְשׁוּעָה bezeichnet hier die konkrete Befreiung aus unmittelbarer Gefahr. Das Tetragramm wird gemäß etablierter deutscher Bibeltradition mit HERR wiedergegeben.
- source_word: יַעֲשֶׂה לָכֶם
  choice: die er für euch vollbringen wird
  rationale: Bewahrt Gottes Handeln zugunsten des Volkes; »vollbringen« passt idiomatisch zu der angekündigten Rettung.
- source_word: עַד עוֹלָם
  choice: nie wieder
  rationale: In Verbindung mit der verneinten Wiederholung des Sehens drückt die Wendung endgültiges Nichtwiedersehen aus. Ein zusätzliches »für immer« wäre im Deutschen redundant.
theological_decisions:
- issue: Göttlicher Name יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: HERR folgt der verbreiteten jüdisch-christlichen Lesetradition und der vorgelegten Konsultationsfassung, ohne eine unsichere Vokalisierung in den Haupttext einzutragen.
- issue: Bedeutung von »Rettung des HERRN«
  choice: Gottes bevorstehende Befreiung wird als sein Handeln dargestellt
  alternative: allgemeiner geistlicher Heilsbegriff
  rationale: Der unmittelbare Kontext meint die konkrete Rettung Israels vor dem ägyptischen Heer; eine spätere systematisch-theologische Bedeutung wird nicht in den Vers hineingelesen.
- issue: Endgültigkeit von עַד עוֹלָם
  choice: nie wiedersehen
  alternative: nie wiedersehen, für immer
  rationale: Die volle Endgültigkeit bleibt erhalten, während unnatürliche deutsche Doppelung vermieden wird.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Direkte Imperative und die Zusage göttlicher Rettung bleiben prägnant; unnötige Archaismen werden vermieden.
