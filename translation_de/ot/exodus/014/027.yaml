base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/027.yaml
  text: So Moses stretched out his hand over the sea[a], and toward morning the sea returned to its usual place, while the Egyptians were fleeing toward it[b]. And Yahweh threw the Egyptians into the midst of the sea.
translation:
  language: de
  text: Mose streckte seine Hand über das Meer aus, und gegen Morgen kehrte das Meer in seinen normalen Zustand[a] zurück, während die Ägypter ihm entgegen flohen. Da schleuderte Jahwe die Ägypter mitten ins Meer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann einen dauerhaften, festen Zustand oder auch volle Stärke bezeichnen. Gemeint ist, dass das Meer wieder seinen gewöhnlichen Zustand annahm.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich vermittelt das hebräische Verb das Bild, dass Jahwe die Ägypter abschüttelte oder ausschüttelte. Die Wiedergabe „schleuderte“ bringt die gewaltsame Handlung im Deutschen idiomatisch zum Ausdruck.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: streckte ... aus
  rationale: נטה bezeichnet in Verbindung mit „Hand“ gewöhnlich das Ausstrecken; die deutsche Wendung ist natürlich und wahrt die körperliche Handlung.
- source_word: הַיָּם
  choice: das Meer
  rationale: Das gewöhnliche hebräische Wort für „Meer“ wird ohne zusätzliche Deutung wiedergegeben.
- source_word: וַיָּשָׁב הַיָּם
  choice: das Meer ... kehrte ... zurück
  rationale: שׁוב bezeichnet hier die Rückkehr zu einem vorherigen Zustand.
- source_word: לִפְנוֹת בֹּקֶר
  choice: gegen Morgen
  rationale: Die idiomatische Zeitangabe bezeichnet das Herannahen beziehungsweise Anbrechen des Morgens.
- source_word: לְאֵיתָנוֹ
  choice: in seinen normalen Zustand
  rationale: אֵיתָן kann Beständigkeit, Stärke oder den dauerhaft bestehenden Zustand bezeichnen. Im Zusammenhang wird ausgedrückt, dass das geteilte Meer wieder seinen gewöhnlichen, stabilen Zustand annahm; die Mehrdeutigkeit wird in der Fußnote dokumentiert.
- source_word: נָסִים לִקְרָאתוֹ
  choice: während die Ägypter ihm entgegen flohen
  rationale: Das Partizip bezeichnet eine andauernde Fluchtbewegung; לִקְרָאתוֹ bedeutet wörtlich „ihm entgegen“. Das Pronomen bezieht sich am naheliegendsten auf das Meer.
- source_word: וַיְנַעֵר
  choice: schüttelte ... hinein
  rationale: נער vermittelt das anschauliche Bild des Abschüttelns oder Ausschüttelns. Die ungewöhnliche, aber verständliche Formulierung bewahrt diese Bildkraft statt sie zu „vernichtete“ oder „warf“ einzuebnen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּתוֹךְ הַיָּם
  choice: mitten ins Meer hinein
  rationale: תּוֹךְ bezeichnet das Innere beziehungsweise die Mitte; die deutsche Richtungsangabe passt zur dynamischen Bedeutung des Verbs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ wahrt seinen Charakter als persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Art des göttlichen Eingreifens in וַיְנַעֵר
  choice: schüttelte ... hinein
  alternative: warf ... hinein / vernichtete ... im Meer
  rationale: Die gewählte Fassung erhält das konkrete Bild des hebräischen Verbs und legt nicht genauer fest, auf welche Weise sich das Geschehen physisch vollzog.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gegen Morgen“ ist idiomatisch; „in seinen normalen Zustand“ gibt die kontextuelle Bedeutung verständlich wieder. Die bewusst anschauliche Wendung „schüttelte ... hinein“ bewahrt die Bildsprache des Hebräischen und wird durch eine Fußnote erläutert.
