source:
  edition: WLC
  text: וַ/יֻּגַּד֙ לְ/מֶ֣לֶךְ מִצְרַ֔יִם כִּ֥י בָרַ֖ח הָ/עָ֑ם וַ֠/יֵּהָפֵךְ לְבַ֨ב פַּרְעֹ֤ה וַ/עֲבָדָי/ו֙ אֶל הָ/עָ֔ם וַ/יֹּֽאמרוּ֙ מַה זֹּ֣את עָשִׂ֔ינוּ כִּֽי שִׁלַּ֥חְנוּ אֶת יִשְׂרָאֵ֖ל מֵ/עָבְדֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/005.yaml
  text: It was reported to the king of Egypt that the people had fled[a], and the heart of Pharaoh and his servants was turned against the people, and they said, “What is this we have done[b], that we have let Israel go from serving us?”
translation:
  language: de
  text: 'Als dem König von Ägypten berichtet wurde, dass das Volk geflohen war, kehrte sich das Herz des Pharaos und seiner Diener gegen das Volk[a]. Sie sagten: »Was haben wir da getan, dass wir Israel aus unserem Dienst entlassen haben[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »Da änderte sich die Einstellung des Pharaos und seiner Diener gegenüber dem Volk.«'
    reason: Die Verbindung von נהפך mit »Herz« bezeichnet eine innere Kehrtwende; אֶל kann neutral »gegenüber« heißen, während der Zusammenhang die Wendung als feindselig erkennen lässt.
  - marker: b
    text: 'Auch möglich: »dass wir Israel haben gehen lassen, sodass es uns nicht mehr dient«; dem Zusammenhang nach: »dass wir Israel aus der Sklaverei freigelassen haben.«'
    reason: עבד bezeichnet Dienen oder Arbeiten und kann im Kontext auch Sklavendienst meinen; die Alternativen zeigen die Bandbreite, ohne die stärkere Deutung in den Haupttext einzutragen.
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: Als ... berichtet wurde
  rationale: Die unpersönliche Passivform bewahrt, dass der Überbringer der Nachricht nicht genannt wird, und fügt sich natürlich in den deutschen Erzählfluss ein.
- source_word: כִּי בָרַח הָעָם
  choice: dass das Volk geflohen war
  rationale: Das Plusquamperfekt verdeutlicht, dass die Flucht der Meldung vorausging; ברח bezeichnet hier Fliehen beziehungsweise Davonlaufen.
- source_word: וַיֵּהָפֵךְ לְבַב פַּרְעֹה וַעֲבָדָיו
  choice: kehrte sich das Herz des Pharaos und seiner Diener
  rationale: Die Wiedergabe erhält sowohl die Umkehrbewegung als auch das hebräische Bild vom Herzen als Sitz des Denkens und Wollens. Der Singular »Herz« folgt bewusst der ungewöhnlichen hebräischen Konstruktion mit mehreren Zugehörigen.
- source_word: אֶל הָעָם
  choice: gegen das Volk
  rationale: Im Zusammenhang bezeichnet die Richtungsangabe eine feindselige Wendung; »gegen« gibt diese kontextuelle Bedeutung knapp wieder.
- source_word: מַה זֹּאת עָשִׂינוּ
  choice: Was haben wir da getan!
  rationale: »Da« nimmt das Demonstrative זֹּאת idiomatisch auf. Das Ausrufezeichen bringt den erschrockenen, bedauernden Ausruf natürlich zum Ausdruck, ohne seinen Inhalt zu erweitern.
- source_word: שִׁלַּחְנוּ אֶת יִשְׂרָאֵל
  choice: Wir haben Israel gehen lassen
  rationale: שׁלח bezeichnet im Kontext die Freilassung beziehungsweise Entlassung Israels; »gehen lassen« ist natürlich und bewahrt das Leitmotiv der Exodus-Erzählung.
- source_word: מֵעָבְדֵנוּ
  choice: sodass es uns nicht mehr dient
  rationale: Die Form bezeichnet das Ende von Israels Dienst für Ägypten. Die Formulierung ist im Deutschen verständlich und bleibt näher am Verb עבד als die ausdrücklichere Deutung »nicht mehr unsere Sklaven sind«.
theological_decisions:
- issue: Anthropologische Bildsprache von לְבַב
  choice: Herz
  alternative: Sinn, Einstellung oder Denken
  rationale: »Herz« bewahrt die hebräische Bildsprache für den inneren Sitz von Denken, Wollen und Entscheiden, ohne sie auf einen rein modernen psychologischen Begriff zu verengen.
- issue: Israels Stellung in מֵעָבְדֵנוּ
  choice: sodass es uns nicht mehr dient
  alternative: aus unserem Dienst entlassen / nicht mehr unsere Sklaven sind
  rationale: Der weitere Zusammenhang beschreibt eindeutig Zwang und Knechtschaft; der unmittelbare Ausdruck spricht jedoch vom Dienen. Die Hauptfassung vermeidet daher eine stärkere Festlegung als der Wortlaut selbst.
- issue: Geteiltes Herz im grammatischen Singular
  choice: das Herz des Pharaos und seiner Diener
  alternative: die Herzen des Pharaos und seiner Diener / die Haltung des Pharaos und seiner Diener
  rationale: Der grammatische Singular des Ausgangstextes bleibt erhalten. Damit wird die auffällige kollektive Form nicht stillschweigend geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit leicht gegliedert, während die markante Herzmetapher und der kollektive Singular des Hebräischen erhalten bleiben. »Es« nimmt das grammatisch sächliche »Israel« auf.
