  text: וַ/יִּרְדְּפ֨וּ מִצְרַ֜יִם אַחֲרֵי/הֶ֗ם וַ/יַּשִּׂ֤יגוּ אוֹתָ/ם֙ חֹנִ֣ים עַל הַ/יָּ֔ם כָּל סוּס֙ רֶ֣כֶב פַּרְעֹ֔ה וּ/פָרָשָׁ֖י/ו וְ/חֵיל֑/וֹ עַל פִּי֙ הַֽחִירֹ֔ת לִ/פְנֵ֖י בַּ֥עַל צְפֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/009.yaml
  text: The Egyptians pursued them and overtook them as they were camped by the sea—all Pharaoh’s horses and chariots[a], his horsemen, and his army—by Pi-hahiroth, before Baal-zephon.
translation:
  language: de
  text: Die Ägypter verfolgten sie und holten sie ein, als sie am Meer lagerten – mit allen Pferden und Streitwagen des Pharaos, seinen Reitern und seinem Heer, bei Pi-Hahirot, vor Baal-Zefon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegenüber von Baal-Zefon«. Die hebräische Wendung kann eine Lage bezeichnen, bei der man einem Orientierungspunkt zugewandt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: verfolgten
  rationale: רדף bezeichnet hier die militärische Verfolgung; »verfolgten« ist präzise, geläufig und würdevoll.
- source_word: מִצְרַיִם
  choice: die Ägypter
  rationale: Die Verbformen und der Zusammenhang beziehen die Bezeichnung auf die Menschen beziehungsweise Streitkräfte Ägyptens, nicht auf das Land.
- source_word: וַיַּשִּׂיגוּ
  choice: holten sie ein
  rationale: נשׂג bedeutet in diesem Zusammenhang, Verfolgte zu erreichen; die deutsche Wendung gibt den Erzählfortgang natürlich wieder.
- source_word: חֹנִים
  choice: als sie … lagerten
  rationale: Das Partizip beschreibt den Zustand der Israeliten in dem Augenblick, als die Ägypter sie einholten.
- source_word: עַל הַיָּם
  choice: am Meer
  rationale: עַל ist hier örtlich gebraucht; »am Meer« ist im Deutschen die natürliche Formulierung.
- source_word: כָּל סוּס רֶכֶב פַּרְעֹה
  choice: mit allen Streitwagenpferden des Pharaos
  rationale: Die verdichtete hebräische Fügung bezeichnet kollektiv die zu den Streitwagen des Pharaos gehörenden Pferde. »Streitwagenpferde« bewahrt diese Beziehung genauer als eine Auflösung in getrennte Pferde und Wagen.
- source_word: וּפָרָשָׁיו
  choice: seinen Reitern
  rationale: פָּרָשִׁים bezeichnet berittene Kämpfer; »Reiter« ist transparent und weniger fachsprachlich als »Kavallerie«.
- source_word: וְחֵילוֹ
  choice: und seinem Heer
  rationale: חַיִל bezeichnet hier die militärische Streitmacht; »Heer« passt zum historischen Erzählregister.
- source_word: עַל פִּי הַחִירֹת
  choice: bei Pi-Hahirot
  rationale: Die Präpositionalfügung lokalisiert das Geschehen bei dem genannten Ort.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: vor Baal-Zefon
  rationale: לִפְנֵי bezeichnet eine räumliche Lage vor beziehungsweise gegenüber einem Orientierungspunkt; »vor« erhält die knappe räumliche Ausdrucksweise und ihre mögliche Bedeutungsbreite.
