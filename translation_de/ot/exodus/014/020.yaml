base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/020.yaml
  text: And it came between the camp of Egypt and the camp of Israel[a], and there was the cloud and the darkness, yet it lit up the night; and the one did not come near the other all night.
translation:
  language: de
  text: Es kam zwischen das Lager Ägyptens und das Lager Israels.[a] Da waren Wolke und Finsternis, und es erhellte die Nacht.[b] Das eine kam dem anderen die ganze Nacht nicht nahe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die singularischen hebräischen Verben können im Zusammenhang auf die Wolkensäule oder auf den Engel Gottes zurückweisen.
    reason: Mehrdeutiger Bezug der singularischen Verben.
  - marker: b
    text: 'Oder: „Da waren die Wolke und die Finsternis, aber sie erhellte die Nacht.“ Das Hebräische ist sehr knapp; alte Textfassungen und Übersetzungen unterscheiden sich darin, wie Finsternis und Licht den beiden Lagern zugeordnet werden.'
    reason: Alternative Lesart und syntaktische Mehrdeutigkeit.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: sie trat
  rationale: Das Verb bezeichnet eine Bewegung an eine trennende Position. Das feminine Pronomen richtet sich im Deutschen nach der im unmittelbaren Kontext genannten Wolkensäule; eine Fußnote hält offen, ob der hebräische Text auf sie oder auf den Engel Gottes zurückweist.
- source_word: בֵּין ... וּבֵין
  choice: zwischen ... und ...
  rationale: Dies gibt die gewöhnliche räumliche Bedeutung knapp und genau wieder.
- source_word: מַחֲנֵה
  choice: Lager
  rationale: „Lager“ bezeichnet hier sowohl die jeweilige Gruppe als auch ihren Standort und passt zum militärischen Reisegeschehen.
- source_word: מִצְרַיִם / יִשְׂרָאֵל
  choice: Ägyptens / Israels
  rationale: Die Eigennamen und die hebräische Genitivverbindung „Lager Ägyptens/Israels“ bleiben erhalten, ohne die Gruppen ausdrücklich als Ägypter beziehungsweise Israeliten umzudeuten.
- source_word: הֶעָנָן וְהַחֹשֶׁךְ
  choice: die Wolke und die Finsternis
  rationale: Beide bestimmten Substantive werden entsprechend dem Hebräischen wiedergegeben; „Finsternis“ bewahrt den feierlichen, markanten Gegensatz zum folgenden Licht.
- source_word: וַיָּאֶר אֶת־הַלָּיְלָה
  choice: doch es wurde die Nacht erhellt
  rationale: Die Formulierung gibt den Gegensatz von Finsternis und Licht natürlich wieder. Die unpersönliche Passivkonstruktion vermeidet es, den im knappen Hebräisch nicht eindeutig bestimmten Träger des Erhellens festzulegen.
- source_word: וְלֹא קָרַב זֶה אֶל־זֶה
  choice: So kam das eine Lager dem anderen nicht nahe
  rationale: Die gegenseitige Wendung זֶה אֶל־זֶה wird idiomatisch auf die beiden zuvor genannten Lager bezogen und bewahrt den räumlichen Sinn von קרב.
- source_word: כָּל־הַלָּיְלָה
  choice: die ganze Nacht
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe.
theological_decisions:
- issue: Bezug des ersten singularischen Verbs
  choice: Im Haupttext steht „sie“ mit grammatischem Bezug auf die Wolkensäule; die sachliche Mehrdeutigkeit wird in einer Fußnote ausdrücklich bewahrt.
  alternative: Das Verb persönlich auf den Engel Gottes beziehen oder im Haupttext „die Säule“ ergänzen.
  rationale: Der vorherige Zusammenhang nennt sowohl den Engel Gottes als auch die Wolkensäule. Der hebräische Singular entscheidet nicht zweifelsfrei zwischen ihnen; die deutsche Grammatik verlangt jedoch eine Formulierung, weshalb die nächstliegende Wolkensäule im Text steht und die Alternative vermerkt wird.
- issue: Verhältnis von Wolke, Finsternis und Licht
  choice: „Da waren die Wolke und die Finsternis, doch es wurde die Nacht erhellt“; die syntaktische und wirkungsgeschichtliche Unsicherheit wird in einer Fußnote erläutert.
  alternative: Die Finsternis ausdrücklich dem ägyptischen und das Licht dem israelitischen Lager zuordnen.
  rationale: Der masoretische Text ist äußerst knapp und ordnet Dunkelheit und Licht nicht ausdrücklich je einem Lager zu. Die gewählte Fassung bewahrt den Gegensatz, ohne eine aus alten Versionen erschlossene Verteilung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Finsternis“ ist bewusst etwas gehobener als „Dunkelheit“, entspricht aber der markanten Kontrastwirkung des Ausgangstextes. Die Wiederholung von „Lager“ am Versende erhöht im Deutschen die Klarheit.
