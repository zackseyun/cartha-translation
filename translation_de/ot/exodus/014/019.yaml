source:
  edition: WLC
  text: וַ/יִּסַּ֞ע מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים הַ/הֹלֵךְ֙ לִ/פְנֵי֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֵּ֖לֶךְ מֵ/אַחֲרֵי/הֶ֑ם וַ/יִּסַּ֞ע עַמּ֤וּד הֶֽ/עָנָן֙ מִ/פְּנֵי/הֶ֔ם וַ/יַּֽעֲמֹ֖ד מֵ/אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/019.yaml
  text: Then the angel of God[a], who had been going before the camp of Israel, moved and went behind them; and the pillar of cloud moved from before them and stood behind them.
translation:
  language: de
  text: Da zog der Engel Gottes[a], der vor dem Lager Israels herzog, weiter und ging hinter sie; auch die Wolkensäule zog von vor ihnen weg und stellte sich hinter sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Gottes«. Das hebräische Wort kann sowohl »Engel« als auch »Bote« bedeuten.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: wechselte ... seine Stellung
  rationale: נסע bezeichnet oft das Aufbrechen oder Weiterziehen. Hier geht es jedoch um einen Positionswechsel vom Raum vor Israel in den Raum hinter Israel. Die gewählte Formulierung macht diese konkrete Bewegung natürlich und präzise deutlich.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: der Engel Gottes
  rationale: מַלְאָךְ kann »Bote« oder »Engel« bedeuten. Im Zusammenhang mit der göttlichen Führung Israels ist »Engel Gottes« die geläufige und kontextuell naheliegende Wiedergabe; die lexikalische Alternative wird in einer Fußnote bewahrt.
- source_word: הַהֹלֵךְ
  choice: der ... hergezogen war
  rationale: Das Partizip beschreibt die bis dahin andauernde Bewegung vor dem Lager. Das Plusquamperfekt kennzeichnet diese als den vorherigen Zustand, bevor der Engel seine Stellung wechselte.
- source_word: לִפְנֵי מַחֲנֵה יִשְׂרָאֵל
  choice: vor dem Lager Israels
  rationale: Die räumliche Bedeutung von לִפְנֵי wird direkt wiedergegeben; die Genitivverbindung bewahrt die Konstruktion »Lager Israels«.
- source_word: וַיֵּלֶךְ מֵאַחֲרֵיהֶם
  choice: ging hinter sie
  rationale: מֵאַחֲרֵיהֶם bezeichnet hier die neue Position an Israels Rückseite, nicht eine Verfolgung. »ging hinter sie« bildet die gerichtete Bewegung ab.
- source_word: עַמּוּד הֶעָנָן
  choice: die Wolkensäule
  rationale: »Wolkensäule« ist die natürliche und etablierte deutsche Wiedergabe der hebräischen Verbindung und erhält das konkrete Bild.
- source_word: מִפְּנֵיהֶם
  choice: von vorn
  rationale: Die kompakte Wendung gibt die räumliche Ausgangsposition idiomatisch wieder. Zusammen mit »nach hinten« bildet sie den im Hebräischen beschriebenen Stellungswechsel klar ab.
- source_word: וַיַּעֲמֹד
  choice: blieb ... stehen
  rationale: עמד bedeutet »stehen«. Im Bewegungszusammenhang bezeichnet es das Einnehmen einer festen Position; »blieb stehen« ist im Deutschen natürlich, ohne eine militärische Stationierung hineinzulesen.
theological_decisions:
- issue: Identität und Wesen von מַלְאַךְ הָאֱלֹהִים
  choice: »der Engel Gottes« ohne nähere ontologische Bestimmung
  alternative: »der Bote Gottes« oder eine ausdrücklich theophanische Deutung
  rationale: Der hebräische Text benennt die Gestalt, legt an dieser Stelle aber nicht fest, ob sie als geschaffenes Engelwesen, Erscheinung Gottes oder auf andere Weise zu verstehen ist. Die Übersetzung lässt diese theologische Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »wechselte ... Stellung« verdeutlicht die parallelen Bewegungen des Engels und der Wolkensäule; der Doppelpunkt gliedert den längeren zweiten Satz natürlich.
