  yaml_path: translation/ot/exodus/034/025.yaml
  text: You shall not slaughter the blood of my sacrifice with leaven[a], and the sacrifice of the feast of the Passover shall not remain until the morning.
translation:
  language: de
  text: Du sollst das Blut meines Schlachtopfers nicht darbringen, wenn Gesäuertes vorhanden ist[a], und das Opfer des Passafestes soll nicht bis zum Morgen liegen bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Du sollst das Blut meines Schlachtopfers nicht mit Gesäuertem schlachten.“ Die hebräische Formulierung verbindet das Schlachten des Opfers mit dessen Blut; „wenn Gesäuertes vorhanden ist“ gibt die knappe kultische Wendung wieder, ohne die genaue rituelle Beziehung näher festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁחַט
  choice: schlachten
  rationale: שׁחט bezeichnet besonders das rituelle Schlachten eines Opfertiers. „Schlachten“ bewahrt diese kultische Präzision besser als das allgemeinere „töten“.
- source_word: עַל חָמֵץ
  choice: zusammen mit Gesäuertem
  rationale: Die Präposition עַל steht hier in einer knappen kultischen Wendung. „Zusammen mit Gesäuertem“ gibt den Sinn natürlich wieder, ohne genauer festzulegen, ob räumliche Anwesenheit oder gleichzeitige Verwendung gemeint ist.
- source_word: דַּם זִבְחִי
  choice: das Blut meines Schlachtopfers
  rationale: Die Wiedergabe hält sowohl „Blut“ als auch das Possessivsuffix der hebräischen Konstruktverbindung ausdrücklich fest. „Schlachtopfer“ bildet זֶבַח kultisch präzise ab.
- source_word: יָלִין
  choice: bis zum Morgen liegen bleiben
  rationale: לין bezeichnet hier das Verbleiben über Nacht. Zusammen mit לַבֹּקֶר ist „bis zum Morgen liegen bleiben“ im Deutschen klar und vermeidet eine unnötige doppelte Zeitangabe.
- source_word: זֶבַח חַג הַפָּסַח
  choice: das Opfer des Passafestes
  rationale: Die kompakte Nominalverbindung wird verständlich wiedergegeben, wobei sowohl Opfer als auch Fest ausdrücklich erhalten bleiben.
- source_word: הַפָּסַח
  choice: Passa
  rationale: „Passa“ ist die im Deutschen etablierte biblische Bezeichnung und wahrt den Zusammenhang mit Israels Festordnung, ohne spätere Deutung einzutragen.
theological_decisions:
- issue: Wiedergabe der Bundes- und Festterminologie ohne spätere lehrmäßige Eintragung
  choice: Passafest
  alternative: Pessachfest
  rationale: „Passafest“ ist eine geläufige deutsche Bibelbezeichnung für den unmittelbaren mosaischen Festkontext. Sie fügt dem hebräischen Text keine spätere christologische oder konfessionelle Deutung hinzu.
- issue: Bezug von „Gesäuertem“ im ersten Verbot
  choice: Die Mehrdeutigkeit wird durch „zusammen mit Gesäuertem“ bewahrt.
  alternative: „während Sauerteig vorhanden ist“ oder „zusammen mit gesäuertem Brot“
  rationale: Der hebräische Ausdruck legt die genaue rituelle Konstellation nicht vollständig offen. Die Übersetzung soll weder ausschließlich räumliche Anwesenheit noch eine bestimmte Speiseform behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Begriffe bleiben sichtbar, während die dichte hebräische Syntax dort geglättet wird, wo eine streng wörtliche Nachbildung im Deutschen schwer verständlich wäre.
