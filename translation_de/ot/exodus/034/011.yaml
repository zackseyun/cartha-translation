base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/011.yaml
  text: Keep what I am commanding you today[a]. Behold, I am driving out before you the Amorites, the Canaanites, the Hittites, the Perizzites, the Hivites[b], and the Jebusites.
translation:
  language: de
  text: Halte dich an das, was ich dir heute gebiete.[a] Siehe, ich vertreibe vor dir[b] die Amoriter, die Kanaaniter, die Hetiter, die Perisiter, die Hiwiter und die Jebusiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Achte auf das, was ich dir heute gebiete“; auch möglich: „Bewahre, was ich dir heute gebiete.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von deinem Angesicht weg“; gemeint ist, dass Gott die Völker aus deiner Gegenwart vertreibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר לְךָ
  choice: Halte dich an
  rationale: Der Imperativ von שׁמר fordert hier im Bundeskontext zum Beachten und Befolgen auf. „Halte dich an“ ist natürliches modernes Deutsch und bewahrt den Gedanken des gewissenhaften Festhaltens, ohne לְךָ unnatürlich wörtlich wiederzugeben.
- source_word: אֵת אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: das, was ich dir heute gebiete
  rationale: Die Relativkonstruktion bezeichnet den Inhalt des göttlichen Gebots. Das Partizip מְצַוְּךָ wird im Deutschen idiomatisch mit dem Präsens „gebiete“ wiedergegeben.
- source_word: הִנְנִי
  choice: Siehe
  rationale: הִנְנִי lenkt nachdrücklich die Aufmerksamkeit auf Gottes unmittelbar bevorstehendes beziehungsweise gewiss eintretendes Handeln. „Siehe“ wahrt diese Funktion in würdigem biblischem Register.
- source_word: גֹרֵשׁ
  choice: ich vertreibe
  rationale: Das Partizip bezeichnet ein als gegenwärtig, unmittelbar bevorstehend oder sicher dargestelltes Handeln. Das deutsche Präsens bewahrt diese lebendige Unmittelbarkeit.
- source_word: מִפָּנֶיךָ
  choice: vor dir
  rationale: Die Wendung bedeutet wörtlich „von deinem Angesicht weg“ und bezeichnet hier die Entfernung der Völker aus Israels Gegenwart beziehungsweise vor Israel her. „Vor dir“ ist knapp und natürlich; die genauere Bildlichkeit wird in der Fußnote erläutert.
- source_word: הָאֱמֹרִי ... הַיְבוּסִי
  choice: die Amoriter, die Kanaaniter, die Hetiter, die Perisiter, die Hiwiter und die Jebusiter
  rationale: Die hebräischen kollektiven Singularformen werden entsprechend dem üblichen deutschen Sprachgebrauch als pluralische Volksbezeichnungen wiedergegeben.
theological_decisions:
- issue: Bedeutungsnuance des Imperativs שׁמר im Bundeskontext
  choice: Als Aufforderung wiedergeben, sich an das Gebotene zu halten
  alternative: „Achte auf das, was ich dir heute gebiete“ oder „Bewahre, was ich dir heute gebiete“
  rationale: שׁמר kann bewahren, beachten oder gewissenhaft einhalten bedeuten. Die gewählte Formulierung bringt die geforderte Beachtung und Befolgung zum Ausdruck, ohne ausdrücklich ein zusätzliches Verb wie „tun“ einzufügen.
- issue: Zeitwert des Partizips גֹרֵשׁ nach הִנְנִי
  choice: 'Präsens: „ich vertreibe“'
  alternative: 'Futur: „ich werde vertreiben“'
  rationale: Die Konstruktion kann gegenwärtiges, unmittelbar bevorstehendes oder als gewiss angekündigtes Handeln ausdrücken. Das Präsens erhält die im Hebräischen hervorgehobene Unmittelbarkeit, ohne den genauen zeitlichen Verlauf enger festzulegen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. „Siehe“ wurde als bewusst formelle, aber weiterhin geläufige Wiedergabe der hebräischen Aufmerksamkeitsformel gewählt. Die Völkernamen folgen den im Deutschen etablierten biblischen Formen.
