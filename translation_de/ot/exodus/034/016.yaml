base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/016.yaml
  text: and you take some of his daughters for your sons[b][a], and his daughters prostitute themselves after their gods and make your sons prostitute themselves after their gods.
translation:
  language: de
  text: und du einige seiner Töchter für deine Söhne nimmst und seine Töchter Hurerei treiben und ihren Göttern nachlaufen[a] und deine Söhne dazu bringen, Hurerei zu treiben und ihren Göttern nachzulaufen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische verwendet die Sprache sexueller Untreue als Bild für die Hinwendung zu anderen Göttern.
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Die Töchter würden die Söhne zum Götzendienst verleiten, sodass auch sie ihren Göttern nachliefen.'
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: und du … nimmst
  rationale: Das Qal Perfekt 2. Person maskulin Singular mit וְ führt in diesem Warnzusammenhang eine mögliche Folge weiter. „Nimmst“ wahrt den direkten Sinn; „verheiratest“ wäre stärker auslegend.
- source_word: מִבְּנֹתָיו
  choice: einige seiner Töchter
  rationale: 'מִן wird partitiv verstanden: Töchter aus ihrer Gesamtheit. „Einige seiner Töchter“ gibt dies im Deutschen natürlich wieder.'
- source_word: לְבָנֶיךָ
  choice: für deine Söhne
  rationale: לְ bezeichnet hier die Zuordnung im Rahmen einer Heiratsverbindung; „für deine Söhne“ ist natürlich und quellennah.
- source_word: וְזָנוּ
  choice: und seine Töchter … nachhuren
  rationale: זנה bezeichnet hier bildhaft kultische Untreue. Das kräftige sexuelle Bild wird nicht zum bloßen „Götzendienst treiben“ abgeschwächt.
- source_word: אַחֲרֵי אֱלֹהֵיהֶן
  choice: ihren Göttern nachhuren
  rationale: Die Verbindung mit אַחֲרֵי beschreibt das Hinterhergehen hinter fremden Göttern. Das deutsche Verb „nachhuren“ bewahrt sowohl die Bewegungsrichtung als auch die Untreue-Metapher.
- source_word: וְהִזְנוּ
  choice: und … dazu bringen, … nachzuhuren
  rationale: 'Die Hifil-Form ist kausativ: Die Töchter bewirken, dass die Söhne dasselbe tun. „Dazu bringen“ macht diese Kausalität ausdrücklich.'
- source_word: אֶת בָּנֶיךָ
  choice: deine Söhne
  rationale: Direktes Objekt mit Suffix der 2. Person maskulin Singular; entsprechend wörtlich wiedergegeben.
- source_word: אֱלֹהֵיהֶן
  choice: ihren Göttern
  rationale: Der Plural mit femininem Pluralsuffix bezeichnet die Götter der Töchter beziehungsweise der fremden Bevölkerung.
theological_decisions:
- issue: Wiedergabe von זנה im Zusammenhang mit Götzendienst
  choice: Die Metapher wird mit „nachhuren“ bewahrt.
  alternative: „Götzendienst treiben“ oder „untreu werden“
  rationale: Der hebräische Text gebraucht bewusst die Sprache sexueller Untreue für die Abwendung zu anderen Göttern. Die direkte Metapher erhält die theologische Schärfe, ohne sie erklärend aufzulösen.
- issue: Geschlechtsspezifische Bezeichnungen in בנותיו und בניך
  choice: „Töchter“ und „Söhne“
  alternative: „Kinder“ oder „Nachkommen“
  rationale: Im Kontext der angebahnten Ehen nennt der Ausgangstext ausdrücklich Töchter und Söhne; eine geschlechtsneutrale Fassung würde diese Aussage verallgemeinern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusster Beibehaltung der anstößig-kraftvollen Untreue-Metapher des Hebräischen. Der Satzanfang mit „und“ bleibt erhalten, weil der Vers die Warnung des vorausgehenden Zusammenhangs fortsetzt.
