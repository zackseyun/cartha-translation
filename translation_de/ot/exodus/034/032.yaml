id: EXO.34.32
reference: Exodus 34:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֥ן נִגְּשׁ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יְצַוֵּ֕/ם אֵת֩ כָּל אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אִתּ֖/וֹ בְּ/הַ֥ר סִינָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/032.yaml
  text: Afterward all the sons of Israel came near[a], and he commanded them all that Yahweh had spoken with him on Mount Sinai.
translation:
  language: de
  text: Danach traten alle Söhne Israels[a] heran, und er gebot ihnen alles, was Yahweh mit ihm auf dem Berg Sinai geredet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Söhne Israels«; die nationale Bezeichnung meint hier das Volk Israel als Ganzes. Häufig wird sie auch mit »Israeliten« oder »Kinder Israels« wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Danach
  rationale: Die Wendung kennzeichnet die zeitliche Folge. »Danach« ist im modernen Deutschen natürlich und prägnant.
- source_word: נִגְּשׁוּ
  choice: traten … heran
  rationale: Der Nifal von נגשׁ bezeichnet das Näherkommen. »herantreten« bewahrt die konkrete Bewegung im Erzählzusammenhang.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: alle Söhne Israels
  rationale: Die Übersetzung gibt die grammatisch maskuline nationale Bezeichnung formal wieder; eine Fußnote erläutert den umfassenden Volksbezug.
- source_word: וַיְצַוֵּם
  choice: und er gebot ihnen
  rationale: צוה bezeichnet verbindliches Gebieten oder Anordnen. »gebot« wahrt diese stärkere Aussage besser als das weichere »unterwies«.
- source_word: אֵת כָּל אֲשֶׁר
  choice: alles, was
  rationale: Die deutsche Wendung gibt den gesamten Inhalt der folgenden Mitteilung idiomatisch wieder.
- source_word: דִּבֶּר יְהוָה אִתּוֹ
  choice: was Yahweh mit ihm … geredet hatte
  rationale: »mit ihm geredet« wahrt die durch אִתּוֹ ausgedrückte Gesprächsbeziehung. Das Plusquamperfekt verdeutlicht, dass dieses Reden dem Gebot an Israel vorausging.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der persönliche Gottesname wird transliteriert und nicht durch einen Titel ersetzt.
- source_word: בְּהַר סִינָי
  choice: auf dem Berg Sinai
  rationale: Die Präposition בְּ bezeichnet hier den Ort des Geschehens; »auf dem Berg Sinai« ist präzises und natürliches Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Yahweh« bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten; Kinder Israels
  rationale: »Söhne Israels« bildet die grammatische Form und die traditionelle nationale Abstammungsbezeichnung unmittelbar ab. Die Fußnote hält fest, dass im Kontext das Volk Israel als Ganzes gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit relativ formnaher Satzführung. »Gebot« und »geredet hatte« bewahren die Verbindlichkeit beziehungsweise den Gesprächscharakter des hebräischen Wortlauts, ohne altertümliche Syntax zu verwenden.
