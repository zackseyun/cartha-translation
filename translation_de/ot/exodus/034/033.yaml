base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/033.yaml
  text: When Moses finished speaking with them[a], he put a veil over his face.
translation:
  language: de
  text: Als Mose mit ihnen zu Ende geredet hatte,[a] legte er einen Schleier über sein Gesicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als Mose aufgehört hatte, mit ihnen zu reden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: aufgehört hatte
  rationale: Das Verb כלה mit מִן und Infinitiv bezeichnet hier das Beenden einer Handlung. „Aufgehört hatte“ gibt die Konstruktion natürlich wieder, ohne anzudeuten, Mose habe eine bestimmte Rede vollständig vorgetragen.
- source_word: מִדַּבֵּר
  choice: zu reden
  rationale: Der Infinitiv von דבר mit vorangestelltem מִן ergänzt כלה und bezeichnet die beendete Tätigkeit; im Deutschen ist „aufhören, zu reden“ idiomatisch.
- source_word: אִתָּם
  choice: mit ihnen
  rationale: אֵת mit Suffix hat hier am naheliegendsten die komitative Bedeutung „mit ihnen“. Der Zusammenhang umfasst zwar Moses Ansprache an Israel, doch die Formulierung des Hebräischen bleibt so erhalten.
- source_word: וַיִּתֵּן
  choice: legte
  rationale: נתן mit עַל bezeichnet das Anbringen oder Auflegen eines Gegenstands. Bei einer Gesichtsbedeckung ist „legte … über“ natürlich und präzise.
- source_word: עַל פָּנָיו
  choice: über sein Gesicht
  rationale: Die Präposition bezeichnet hier die Lage der Bedeckung. „Über sein Gesicht“ macht die bedeckende Funktion im Deutschen klar.
- source_word: מַסְוֶה
  choice: Decke
  rationale: Das seltene Substantiv bezeichnet im Kontext eine Bedeckung für das Gesicht. „Decke“ wahrt den allgemeinen Charakter des hebräischen Ausdrucks; die Fußnote nennt die traditionelle Wiedergabe „Schleier“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt natürlichem deutschem Erzählen; das Plusquamperfekt kennzeichnet den Abschluss des Redens vor dem Auflegen der Bedeckung. „Decke“ ist bewusst allgemein gehalten und vermeidet mögliche moderne Nebenbedeutungen von „Schleier“.
