- from: Als Mose aufgehört hatte, mit ihnen zu reden,[a] legte er eine Decke über sein Gesicht.
  to: Als Mose mit ihnen zu Ende geredet hatte,[a] legte er einen Schleier über sein Gesicht.
  rationale: Die Übersetzung wird an die naheliegende Bedeutung von כלה („zu Ende bringen, beenden“) und an die englische Audit-Entscheidung „finished speaking“ angeglichen. „Schleier“ ersetzt das im Deutschen missverständliche „Decke“, ohne die Art der Gesichtsbedeckung unnötig näher festzulegen.
