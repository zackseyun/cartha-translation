source:
  edition: WLC
  text: נֹצֵ֥ר חֶ֨סֶד֙ לָ/אֲלָפִ֔ים נֹשֵׂ֥א עָוֺ֛ן וָ/פֶ֖שַׁע וְ/חַטָּאָ֑ה וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֣ד עֲוֺ֣ן אָב֗וֹת עַל בָּנִים֙ וְ/עַל בְּנֵ֣י בָנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/007.yaml
  text: keeping steadfast love for thousands[a], forgiving iniquity and transgression and sin, but he will by no means leave unpunished, visiting the iniquity of fathers on children and on children's children[c][b], to the third and to the fourth generation.
translation:
  language: de
  text: der für Tausende beständige Liebe bewahrt[a], Schuld, Vergehen und Sünde vergibt, aber keineswegs ungestraft lässt[b], der die Schuld der Väter an den Kindern und Kindeskindern heimsucht[c], bis in die dritte und vierte Generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für tausend Generationen“. Wörtlich steht im Hebräischen nur „für Tausende“; wahrscheinlich bildet dies einen Gegensatz zur dritten und vierten Generation.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „aber keineswegs freispricht“. Die hebräische Formulierung verstärkt die Verneinung nachdrücklich.'
    reason: lexical_alternative
  - marker: c
    text: Das hier mit „heimsucht“ wiedergegebene Verb kann auch bedeuten, dass Gott Schuld prüfend aufsucht oder ihre Folgen eintreten lässt; es bezeichnet nicht zwingend nur unmittelbare Bestrafung.
    reason: lexical_and_theological_ambiguity
lexical_decisions:
- source_word: נֹצֵר
  choice: bewahrt
  rationale: Das Partizip bezeichnet ein fortdauerndes Hüten oder Bewahren; „bewahrt“ ist natürlich und erhält diesen Aspekt.
- source_word: חֶסֶד
  choice: beständige Liebe
  rationale: Die Wendung gibt sowohl die liebevolle Zuwendung als auch die verlässliche, bundestreue Seite des Begriffs verständlich wieder.
- source_word: לָאֲלָפִים
  choice: Tausenden
  rationale: Der hebräische Text nennt nur „Tausende“ und legt nicht ausdrücklich „Generationen“ fest; diese Offenheit bleibt im Haupttext erhalten.
- source_word: נֹשֵׂא
  choice: vergibt
  rationale: Wörtlich bedeutet das Verb „trägt“; in Verbindung mit diesen Schuldbegriffen bezeichnet es idiomatisch das Vergeben.
- source_word: עָוֺן
  choice: Schuld
  rationale: Der Begriff kann sowohl Verfehlung als auch Schuld beziehungsweise deren Folgen bezeichnen; „Schuld“ bewahrt diese Mehrschichtigkeit.
- source_word: פֶשַׁע
  choice: Vergehen
  rationale: „Vergehen“ bezeichnet eine bewusste Überschreitung, ohne die Bedeutung enger auf politische oder religiöse „Rebellion“ festzulegen.
- source_word: חַטָּאָה
  choice: Sünde
  rationale: Dies ist die direkte und im Deutschen geläufige Wiedergabe und schließt die dreigliedrige Schuldformel ab.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: aber keineswegs ungestraft lässt
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Verneinung. Die deutsche Formulierung bewahrt die richterliche Aussage, ohne ein im Hebräischen nicht ausdrücklich genanntes Objekt wie „den Schuldigen“ einzufügen.
- source_word: פֹּקֵד
  choice: heimsucht
  rationale: „Heimsucht“ wahrt in diesem Gerichtszusammenhang die offene Bedeutung von prüfendem beziehungsweise folgenreichem Eingreifen, ohne sie vollständig auf „bestraft“ zu verengen.
- source_word: עֲוֺן אָבוֹת
  choice: die Schuld der Väter
  rationale: „Väter“ entspricht der ausdrücklich maskulinen Form; „Schuld“ hält die Verbindung zum früheren עָוֺן aufrecht.
- source_word: עַל בָּנִים וְעַל בְּנֵי בָנִים
  choice: an den Kindern und Kindeskindern
  rationale: Die Formulierung gibt die generationenübergreifende Abstammungsfolge in natürlichem Deutsch wieder.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: an der dritten und an der vierten Generation
  rationale: „Generation“ ist im Hebräischen ausgelassen, aus der familiären Abfolge jedoch eindeutig zu ergänzen; die wiederholte Präposition bildet die Parallelität ab.
theological_decisions:
- issue: Spannung zwischen Vergebung und Gericht in וְנַקֵּה לֹא יְנַקֶּה
  choice: Sowohl die uneingeschränkte Vergebungsaussage als auch die nachdrückliche Aussage, dass Gott keineswegs ungestraft lässt, bleiben nebeneinander stehen.
  alternative: „aber den Schuldigen spricht er keineswegs frei“
  rationale: Der Vers hält Barmherzigkeit und Gerechtigkeit bewusst zusammen. Die gewählte Fassung schwächt keine der beiden Aussagen ab und ergänzt kein ausdrückliches Objekt.
- issue: Ob nach „Tausenden“ das Wort „Generationen“ ergänzt werden soll
  choice: Im Haupttext wird „Generationen“ nicht ergänzt.
  alternative: „für tausend Generationen“ oder „für Tausende von Generationen“
  rationale: Anders als in manchen Parallelstellen steht hier lediglich „Tausenden“. Die mögliche generationenbezogene Deutung wird in einer Fußnote genannt, nicht in den Text eingetragen.
- issue: Generationelle Folgen der Schuld der Väter
  choice: Die offene Aussage „heimsucht“ wird beibehalten.
  alternative: „die Kinder ... für die Schuld der Väter bestraft“
  rationale: Der hebräische Ausdruck legt hier nicht vollständig fest, auf welche Weise die Schuld in späteren Generationen aufgesucht oder ihre Folgen wirksam werden. Eine engere dogmatische Deutung wird vermieden.
translation_notes:
  register: Moderne, würdige Standardsprache mit leicht gehobenem biblischem Klang. „Kindeskinder“ und „heimsucht“ sind bewusst traditionsnah, bleiben aber verständlich. Die Satzform ist als Fortsetzung der göttlichen Selbstbeschreibung in Exodus 34,6 gestaltet.
