base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/020.yaml
  text: You shall redeem the firstborn of a donkey with a lamb[a]; and if you do not redeem it, then you shall break its neck. You shall redeem every firstborn of your sons[c][b]. And none shall appear before me empty-handed.
translation:
  language: de
  text: Das Erstgeborene eines Esels sollst du mit einem Stück Kleinvieh[a] auslösen. Wenn du es aber nicht auslöst, sollst du ihm das Genick brechen. Jeden Erstgeborenen unter deinen Söhnen sollst du auslösen. Niemand soll mit leeren Händen[b] vor mir[c] erscheinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist ein einzelnes Tier vom Kleinvieh, also ein Schaf oder eine Ziege.
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: nicht ohne eine Gabe oder Opfergabe.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „vor meinem Angesicht“; dies ist eine hebräische Wendung für das Erscheinen in Gottes Gegenwart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶטֶר חֲמוֹר
  choice: die Erstgeburt eines Esels
  rationale: פֶטֶר bezeichnet das, was zuerst den Mutterschoß öffnet. „Erstgeburt“ gibt den rechtlichen Zusammenhang knapp und natürlich wieder; „eines Esels“ folgt der hebräischen Gattungsbezeichnung.
- source_word: תִּפְדֶּה
  choice: sollst du auslösen
  rationale: פדה bezeichnet hier die kultisch-rechtliche Auslösung durch Ersatzleistung. „Auslösen“ ist im Deutschen für die Ablösung einer geschuldeten Erstgeburt präziser als das allgemeinere „erlösen“.
- source_word: בְשֶׂה
  choice: mit einem Stück Kleinvieh
  rationale: שֶׂה kann ein einzelnes Schaf oder eine Ziege bezeichnen. „Ein Stück Kleinvieh“ bewahrt diesen Umfang, ohne die Bedeutung unberechtigt auf ein Lamm zu verengen.
- source_word: וַעֲרַפְתּוֹ
  choice: sollst du ihr das Genick brechen
  rationale: ערף bezeichnet hier ausdrücklich das Brechen des Genicks. Das feminine Pronomen bezieht sich im Deutschen natürlich auf „Erstgeburt“.
- source_word: כֹּל בְּכוֹר בָּנֶיךָ
  choice: jeden Erstgeborenen unter deinen Söhnen
  rationale: Die Formulierung wahrt den ausdrücklichen Bezug auf die männlichen Nachkommen und gibt die hebräische distributive Aussage idiomatisch wieder.
- source_word: יֵרָאוּ פָנַי
  choice: vor mir erscheinen
  rationale: Wörtlich steht „vor meinem Angesicht“. Die deutsche Wendung „vor mir erscheinen“ gibt den hebräischen Ausdruck für das Erscheinen in Gottes Gegenwart natürlich wieder.
- source_word: רֵיקָם
  choice: mit leeren Händen
  rationale: Im Zusammenhang des Erscheinens vor Gott bedeutet רֵיקָם, nicht ohne Gabe oder Opfer zu kommen. Die deutsche Redewendung bewahrt sowohl das Bild als auch die kontextuelle Aussage.
theological_decisions:
- issue: Göttlicher Bezug in יֵרָאוּ פָנַי
  choice: vor mir
  alternative: vor meinem Angesicht
  rationale: Der hebräische Ausdruck nennt wörtlich Gottes „Angesicht“, fungiert hier aber idiomatisch für seine Gegenwart. „Vor mir“ erhält die direkte Gottesrede, ohne eine zusätzliche theologische Deutung einzutragen.
- issue: Geschlechtsspezifische Aussage in בָּנֶיךָ
  choice: unter deinen Söhnen
  alternative: unter deinen Kindern
  rationale: Der hebräische Text nennt ausdrücklich Söhne. Die Wiedergabe wird daher nicht zu „Kinder“ verallgemeinert.
- issue: Art des Ersatztiers in שֶׂה
  choice: ein Stück Kleinvieh
  alternative: ein Lamm
  rationale: Da שֶׂה sowohl ein Schaf als auch eine Ziege aus der Herde bezeichnen kann, bleibt die Übersetzung bewusst weiter und löst die lexikalische Offenheit nicht zugunsten eines Lammes auf.
translation_notes:
  register: Moderner, würdiger Rechtstext mit direkter Anrede. „Sollst du“ bewahrt den verbindlichen Weisungscharakter; „auslösen“ hält den kultisch-rechtlichen Sinn fest. Die Satzfolge folgt eng dem Hebräischen, bleibt aber in gegenwärtigem Standarddeutsch flüssig.
