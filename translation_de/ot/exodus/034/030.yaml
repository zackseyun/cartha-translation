  text: וַ/יַּ֨רְא אַהֲרֹ֜ן וְ/כָל בְּנֵ֤י יִשְׂרָאֵל֙ אֶת מֹשֶׁ֔ה וְ/הִנֵּ֥ה קָרַ֖ן ע֣וֹר פָּנָ֑י/ו וַ/יִּֽירְא֖וּ מִ/גֶּ֥שֶׁת אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/030.yaml
  text: When Aaron and all the sons of Israel saw Moses[a], behold, the skin of his face was radiant, and they were afraid to come near him.
translation:
  language: de
  text: Als Aaron und alle Söhne Israels Mose sahen – und siehe, die Haut seines Gesichts strahlte –, fürchteten sie sich, ihm näher zu kommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: sahen
  rationale: Das Verb ראה bezeichnet hier im fortlaufenden Erzählzusammenhang das Sehen und wird im Deutschen natürlich mit »sahen« wiedergegeben.
- source_word: וְכָל בְּנֵי יִשְׂרָאֵל
  choice: und alle Söhne Israels
  rationale: Die Wiedergabe bewahrt die familiäre und grammatisch maskuline Formulierung des Hebräischen. »Israeliten« wäre flüssiger, würde die konkrete Ausdrucksweise jedoch verallgemeinern.
- source_word: וְהִנֵּה
  choice: siehe
  rationale: Das Aufmerksamkeitssignal hebt die überraschende Wahrnehmung hervor. »Siehe« bewahrt diese deiktische Funktion in würdigem, verständlichem Deutsch.
- source_word: קָרַן
  choice: strahlte
  rationale: Das seltene Verb bezeichnet in diesem Zusammenhang das Ausstrahlen von Licht oder Glanz. »Strahlte« ist prägnant und lässt die Art des sichtbaren Strahlens offen.
- source_word: עוֹר פָּנָיו
  choice: die Haut seines Gesichts
  rationale: Das Hebräische nennt ausdrücklich die Haut des Gesichts und nicht nur das Gesicht; die konkrete Formulierung wird deshalb beibehalten.
- source_word: וַיִּירְאוּ
  choice: da fürchteten sie sich
  rationale: Diese idiomatische Form gibt sowohl die erzählerische Folge als auch die Furcht der Betrachtenden wieder.
- source_word: מִגֶּשֶׁת אֵלָיו
  choice: ihm näher zu kommen
  rationale: Die Präposition mit dem Infinitiv beschreibt, dass sie aus Furcht davor zurückschreckten, sich Mose zu nähern.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten; Kinder Israels
  rationale: Die quellennähere familiäre Bezeichnung bleibt erhalten, ohne die grammatisch maskuline Form stillschweigend zu neutralisieren.
- issue: Bedeutung von קָרַן beim Gesicht des Mose
  choice: strahlte
  alternative: glänzte; sandte Strahlen aus; war gehörnt
  rationale: Der Zusammenhang schildert eine sichtbare Folge der Gottesbegegnung und die Furcht des Volkes. Er spricht für Lichtglanz beziehungsweise Strahlen, nicht für buchstäbliche Hörner; die geschichtlich bedeutsame Alternativdeutung wird dennoch in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Siehe« bewahrt bewusst das hebräische Aufmerksamkeitssignal; die übrige Syntax ist für heutige Leser natürlich gegliedert.
