base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/024.yaml
  text: For I will drive out nations from before you and enlarge your border[c][b][a], and no man will covet your land when you go up to appear before Yahweh your God three times in the year.
translation:
  language: de
  text: Denn ich werde Nationen vor dir vertreiben und dein Gebiet erweitern. Niemand wird dein Land begehren, wenn du hinaufziehst, um dreimal im Jahr vor Jahwe, deinem Gott, zu erscheinen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um das Angesicht Jahwes, deines Gottes, zu sehen“. Die Wendung bezeichnet hier das Erscheinen vor ihm zur Anbetung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das vorausgehende Gebot der Wallfahrt ein.
- source_word: אוֹרִישׁ גּוֹיִם מִפָּנֶיךָ
  choice: ich werde Nationen vor dir vertreiben
  rationale: Das Hifil von ירשׁ bezeichnet hier das Verdrängen der Nationen; „vor dir vertreiben“ gibt Handlung und räumlichen Bezug natürlich wieder.
- source_word: וְהִרְחַבְתִּי אֶת־גְּבוּלֶךָ
  choice: und dein Gebiet erweitern
  rationale: גְּבוּל kann Grenze oder Gebiet bezeichnen. Im Deutschen wird ein Gebiet erweitert, während „deine Grenze erweitern“ weniger idiomatisch wäre.
- source_word: וְלֹא יַחְמֹד אִישׁ
  choice: Niemand wird … begehren
  rationale: אִישׁ steht im verneinten Satz repräsentativ und wird im Deutschen idiomatisch mit „niemand“ wiedergegeben; חמד bezeichnet ein begehrliches Verlangen.
- source_word: בַּעֲלֹתְךָ
  choice: wenn du hinaufziehst
  rationale: עלה bezeichnet im Wallfahrtszusammenhang das Hinaufziehen zum Heiligtum.
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: um … vor … zu erscheinen
  rationale: Die wörtliche Wendung „das Angesicht sehen“ ist hier eine kultische Audienzformel und bedeutet, vor Gott zu erscheinen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als im Deutschen etablierte Transkription wieder.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: dreimal im Jahr
  rationale: Natürliche und genaue deutsche Wiedergabe der Häufigkeitsangabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Eigennamen; „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Repräsentativer maskuliner Singular אִישׁ
  choice: Niemand
  alternative: kein Mann
  rationale: In einer verneinten Aussage hat אִישׁ hier generische Reichweite. „Niemand“ gibt diese Bedeutung im modernen Deutsch ohne eine sachlich nicht beabsichtigte Beschränkung wieder.
- issue: Kultische Wendung לֵרָאוֹת אֶת־פְּנֵי
  choice: vor … zu erscheinen
  alternative: das Angesicht … zu sehen
  rationale: Die idiomatische Bedeutung wird im Haupttext verständlich wiedergegeben; die wörtliche Bildsprache bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Satzglieder und geläufige Verben sorgen für Verständlichkeit; die kultische und territoriale Aussage des Hebräischen bleibt erhalten.
