  text: You shall not make cast-metal gods for yourself[a].
translation:
  language: de
  text: Du sollst dir keine Götter aus gegossenem Metall machen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »gegossene Götter« oder »Götter aus Gussmetall«.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: Götter
  rationale: Der Plural im Status constructus bezeichnet hier im Zusammenhang des Bilderverbots konkret »Götter«; die Verbindung mit מַסֵּכָה beschreibt sie als aus Metall gegossen.
- source_word: מַסֵּכָה
  choice: aus gegossenem Metall
  rationale: Das Substantiv bezeichnet etwas Gegossenes, besonders ein gegossenes Metallbild. Die Formulierung bewahrt Material und Herstellungsweise, ohne neben »Götter« zusätzlich »Bilder« in den Haupttext einzutragen.
- source_word: לֹא תַעֲשֶׂה
  choice: Du sollst ... keine ... machen
  rationale: Die Negation mit dem Imperfekt der zweiten Person Singular hat hier eindeutige Verbotskraft und wird im Deutschen natürlich mit »Du sollst ... keine ... machen« wiedergegeben.
- source_word: לָּךְ
  choice: dir
  rationale: Die Präposition mit Suffix bezeichnet den persönlichen Bezug; das reflexiv gebrauchte »dir« ist im Deutschen knapp und idiomatisch.
theological_decisions:
- issue: Art des verbotenen Gegenstands
  choice: Götter aus gegossenem Metall
  alternative: gegossene Götter / Götterbilder aus Metall
  rationale: Die Übersetzung erhält sowohl das ausdrückliche »Götter« als auch die Bedeutung des Gießens beziehungsweise gegossenen Metalls. Sie macht das Bilderverbot deutlich, ohne den hebräischen Ausdruck auf das allgemeinere »Bilder« zu reduzieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Stellung von »dir« klingt natürlich und gibt den persönlichen Bezug von לָּךְ wieder; die erläuternde Materialangabe bleibt nah am hebräischen Ausdruck.
