  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כְּתָב לְ/ךָ֖ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה כִּ֞י עַל פִּ֣י הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה כָּרַ֧תִּי אִתְּ/ךָ֛ בְּרִ֖ית וְ/אֶת יִשְׂרָאֵֽל־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/027.yaml
  text: Then Yahweh said to Moses[a], “Write these words for yourself, for according to these words I have made a covenant with you and with Israel.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: »Schreib dir diese Worte auf; denn gemäß diesen Worten habe ich mit dir und mit Israel einen Bund geschlossen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einen Bund geschnitten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Die erzählende Verbform führt die nächste Handlung ein; „Da sagte“ klingt im modernen deutschen Erzählstil natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in seiner im Deutschen üblichen wissenschaftlichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כְּתָב לְךָ
  choice: Schreib dir … auf
  rationale: Die Formulierung gibt den direkten Imperativ und das persönliche לְךָ idiomatisch wieder; „aufschreiben“ passt zum schriftlichen Festhalten der Worte.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: Im schriftlichen und bundesbezogenen Zusammenhang bezeichnet דְּבָרִים die ausgesprochenen Bestimmungen; die Wiederholung wird beibehalten.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier den vorausgehenden Schreibbefehl; „denn“ wahrt den flüssigen Zusammenhang direkter Rede.
- source_word: עַל פִּי הַדְּבָרִים הָאֵלֶּה
  choice: auf der Grundlage dieser Worte
  rationale: Die Wendung bezeichnet die Worte als maßgebliche Grundlage des Bundes. Diese Wiedergabe ist verständlicher als das wörtliche „nach dem Mund“ und vermeidet eine rein kausale Deutung.
- source_word: כָּרַתִּי … בְּרִית
  choice: habe ich … einen Bund geschlossen
  rationale: „Einen Bund schließen“ ist die natürliche deutsche Entsprechung des hebräischen Idioms „einen Bund schneiden“; das Perfekt bezeichnet die vollzogene, weiterhin maßgebliche Handlung.
- source_word: אִתְּךָ … וְאֶת יִשְׂרָאֵל
  choice: mit dir und mit Israel
  rationale: Die wiederholte Präposition macht sowohl Mose als auch Israel ausdrücklich zu den im Bund angesprochenen Parteien.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: „Jahwe“ bewahrt den persönlichen Gottesnamen und entspricht der üblichen modernen deutschen Umschrift, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe des Bundesidioms כָּרַתִּי … בְּרִית
  choice: einen Bund geschlossen
  alternative: einen Bund geschnitten
  rationale: Die idiomatische deutsche Form vermittelt den Sinn klar; die wörtliche Bildsprache wird in einer Fußnote kenntlich gemacht.
- issue: Bezug von עַל פִּי הַדְּבָרִים
  choice: auf der Grundlage dieser Worte
  alternative: gemäß diesen Worten; nach dem Wortlaut dieser Worte
  rationale: Die Übersetzung wahrt den rechtlich-bundesbezogenen Sinn, ohne genauer festzulegen, ob ausschließlich Wortlaut, Inhalt oder Bestimmungen gemeint sind.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem erzählerischem Ton. Die direkte Rede bleibt knapp; „Bund schließen“ wahrt den etablierten biblischen und rechtlichen Sprachgebrauch. Der Fußnotenmarker steht unmittelbar bei der übersetzten Bundesformel.
