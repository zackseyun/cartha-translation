  text: וַ/יֹּ֡אמֶר אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֔/י יֵֽלֶךְ נָ֥א אֲדֹנָ֖/י בְּ/קִרְבֵּ֑/נוּ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ ה֔וּא וְ/סָלַחְתָּ֛ לַ/עֲוֺנֵ֥/נוּ וּ/לְ/חַטָּאתֵ֖/נוּ וּ/נְחַלְתָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/009.yaml
  text: And he said[a], “If now I have found favor in your eyes, Lord, please let the Lord go in our midst, though it is a stiff-necked people; and forgive our iniquity and our sin[b], and take us as your inheritance.”
translation:
  language: de
  text: 'Und er sagte: »Wenn ich doch Gunst in deinen Augen gefunden habe, Herr, möge der Herr doch in unserer Mitte gehen[a], obwohl es ein halsstarriges Volk ist. Vergib uns unsere Schuld und unsere Sünde und nimm uns als dein Erbteil an[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »gehe in unserer Mitte«. Möglich sind auch: »gehe unter uns« oder »gehe mit uns«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mach uns zu deinem Eigentum« beziehungsweise »nimm uns in Besitz«.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן בְּעֵינֶיךָ
  choice: Gunst in deinen Augen
  rationale: Bewahrt die hebräische Beziehungsformel und ihre Bildsprache; „Gunst“ vermeidet eine unnötige dogmatische Aufladung von „Gnade“.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Das Wort ist hier die Anrede bzw. der Herrschaftstitel und nicht der Gottesname JHWH; daher steht „Herr“, nicht „der HERR“.
- source_word: יֵלֶךְ נָא ... בְּקִרְבֵּנוּ
  choice: dann ziehe der Herr doch in unserer Mitte mit
  rationale: „Ziehen“ passt zur gemeinsamen Wanderung, während „in unserer Mitte“ die räumliche Bildsprache von בְּקִרְבֵּנוּ bewahrt. Das deutsche „mit“ macht den Bewegungsbezug natürlich verständlich.
- source_word: קְשֵׁה עֹרֶף
  choice: halsstarrig
  rationale: Die geläufige deutsche Wiedergabe erhält das hebräische Bild für hartnäckigen Ungehorsam.
- source_word: עָוֹן
  choice: Schuld
  rationale: „Schuld“ gibt das moralische Gewicht des Ausdrucks in gegenwärtigem Deutsch wieder und bleibt vom folgenden „Sünde“ unterscheidbar.
- source_word: חַטָּאת
  choice: Sünde
  rationale: Direkte und geläufige Entsprechung, die im Parallelismus neben „Schuld“ verständlich bleibt.
- source_word: וּנְחַלְתָּנוּ
  choice: nimm uns als dein Erbteil an
  rationale: Gibt den Gedanken wieder, dass Gott Israel als sein ihm gehörendes Erbteil in Besitz nimmt, ohne die genaue Nuance auf bloßen Besitz zu verengen.
theological_decisions:
- issue: Funktion von כִּי vor „ein halsstarriges Volk“
  choice: obwohl
  alternative: denn/weil
  rationale: 'Im Zusammenhang ist die Aussage am plausibelsten konzessiv: Gerade trotz der Halsstarrigkeit bittet Mose um Gottes Gegenwart und Vergebung. Die mögliche kausale Grundbedeutung der Partikel wird dadurch kontextuell gedeutet, nicht dogmatisch aufgelöst.'
- issue: Wiedergabe von אֲדֹנָי in einem an JHWH gerichteten Gebet
  choice: Herr
  alternative: mein Herr / der HERR
  rationale: Der hebräische Text verwendet den Titel אֲדֹנָי, nicht ausdrücklich den Gottesnamen. „Herr“ wahrt diese Unterscheidung; die dritte Person beim zweiten Vorkommen bleibt wie im Hebräischen erhalten.
- issue: Covenantale Bedeutung von וּנְחַלְתָּנוּ
  choice: nimm uns als dein Erbteil an
  alternative: mach uns zu deinem Eigentum
  rationale: „Erbteil“ bewahrt die Erb- und Besitzsemantik sowie die Spannung, dass das Volk Gottes eigener Anteil sein soll.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gebetscharakter wird durch „doch“ und den Konjunktiv „ziehe“ hörbar. „Halsstarrig“ und „Erbteil“ bewahren zentrale Bilder des Ausgangstextes, während Satzbau und Wortwahl für heutige Leser verständlich bleiben.
