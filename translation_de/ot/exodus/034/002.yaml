  text: וֶ/הְיֵ֥ה נָכ֖וֹן לַ/בֹּ֑קֶר וְ/עָלִ֤יתָ בַ/בֹּ֨קֶר֙ אֶל הַ֣ר סִינַ֔י וְ/נִצַּבְתָּ֥ לִ֛/י שָׁ֖ם עַל רֹ֥אשׁ הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/002.yaml
  text: And be ready by the morning[b][a], and in the morning come up to Mount Sinai and present yourself there to me on the top of the mountain.
translation:
  language: de
  text: Sei bis zum Morgen bereit, und steige am Morgen auf den Berg Sinai hinauf[a]. Stell dich dort auf dem Gipfel des Berges vor mich[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „komm am Morgen auf den Berg Sinai herauf“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Nimm dort oben auf dem Berg vor mir Aufstellung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהְיֵה נָכוֹן
  choice: Sei … bereit
  rationale: Die Verbindung aus היה und dem prädikativen Adjektiv נָכוֹן fordert Mose auf, vorbereitet zu sein; „Sei bereit“ ist im modernen Deutschen natürlich und quellennah.
- source_word: לַבֹּקֶר
  choice: bis zum Morgen
  rationale: ל bezeichnet hier den Zeitpunkt, bis zu dem Mose bereit sein soll. Die Wiedergabe unterscheidet die Formulierung bewusst vom folgenden בַבֹּקֶר.
- source_word: וְעָלִיתָ בַבֹּקֶר
  choice: und steige am Morgen … hinauf
  rationale: עלה bezeichnet den Aufstieg, בַבֹּקֶר dessen Zeitpunkt. Das deutsche „hinaufsteigen“ gibt die räumliche Bewegung idiomatisch wieder.
- source_word: אֶל הַר סִינַי
  choice: auf den Berg Sinai
  rationale: Bei einem Bergziel ist „auf den Berg Sinai“ im Deutschen natürlicher als ein eng formales „zu dem Berg Sinai“.
- source_word: וְנִצַּבְתָּ לִי שָׁם
  choice: Stell dich dort vor mich
  rationale: Der Niphal von נצב bedeutet hier, sich hinzustellen beziehungsweise seinen Platz einzunehmen; לִי kann in diesem Begegnungskontext natürlich mit „vor mich“ wiedergegeben werden.
- source_word: עַל רֹאשׁ הָהָר
  choice: auf den Gipfel des Berges
  rationale: רֹאשׁ bezeichnet topografisch den höchsten Teil beziehungsweise Gipfel eines Berges.
theological_decisions:
- issue: Räumliche Orientierung von עלה
  choice: steige … hinauf
  alternative: komm … herauf
  rationale: Das Hebräische bezeichnet den Aufstieg, legt aber im Deutschen nicht zwingend fest, ob die Bewegung vom Sprecher her als „heraufkommen“ oder neutral als „hinaufsteigen“ formuliert wird. Die Hauptfassung vermeidet eine zusätzliche Festlegung; die Fußnote bewahrt die sprecherbezogene Möglichkeit.
- issue: Bedeutung von נצב mit לִי
  choice: Stell dich … vor mich
  alternative: Nimm dort für mich Aufstellung
  rationale: „Vor mich“ drückt das Erscheinen in Gottes Gegenwart natürlich aus, ohne aus der Formulierung eine weitergehende kultische oder konfessionelle Aussage abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel von „bis zum Morgen“ zu „am Morgen“ erhält die zeitliche Abfolge des Hebräischen. Die beiden Imperativsätze sorgen für klare, natürliche Lesbarkeit; sämtliche Fußnotenmarker stehen im Haupttext.
