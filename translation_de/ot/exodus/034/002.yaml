revisions:
- from: Sei bis zum Morgen bereit, und steige am Morgen auf den Berg Sinai hinauf[a]. Stell dich dort vor mich, auf den Gipfel des Berges[b].
  to: Sei bis zum Morgen bereit, und steige am Morgen auf den Berg Sinai hinauf[a]. Stell dich dort auf dem Gipfel des Berges vor mich[b].
  rationale: Die Revision beschränkt sich auf eine klarere deutsche Wortstellung im zweiten Satz und auf die Beseitigung der missverständlichen Formulierung „für mich“ in Fußnote b. Die zeitliche und räumliche Struktur sowie die mögliche sprecherbezogene Nuance von עלה bleiben erhalten.
