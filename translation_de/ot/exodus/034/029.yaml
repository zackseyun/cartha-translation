source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/רֶ֤דֶת מֹשֶׁה֙ מֵ/הַ֣ר סִינַ֔י וּ/שְׁנֵ֨י לֻחֹ֤ת הָֽ/עֵדֻת֙ בְּ/יַד מֹשֶׁ֔ה בְּ/רִדְתּ֖/וֹ מִן הָ/הָ֑ר וּ/מֹשֶׁ֣ה לֹֽא יָדַ֗ע כִּ֥י קָרַ֛ן ע֥וֹר פָּנָ֖י/ו בְּ/דַבְּר֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/029.yaml
  text: And it happened[a], when Moses came down from Mount Sinai with the two tablets of the testimony in Moses' hand as he came down from the mountain[c][b], that Moses did not know that the skin of his face shone because he had spoken with him.
translation:
  language: de
  text: 'Und es geschah: Als Mose vom Berg Sinai herabstieg – die beiden Tafeln des Zeugnisses waren in Moses Hand, als er vom Berg herabstieg –, wusste Mose nicht, dass die Haut seines Gesichts strahlte[a], als er mit ihm[b] redete.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Strahlen aussandte“. Das hebräische Verb kann das Ausgehen von Strahlen bezeichnen. Die traditionelle Wiedergabe „gehörnt war“ ist historisch bedeutsam, passt jedoch weniger gut zum Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: mit dem HERRN.'
    reason: referent_clarification
  - marker: c
    text: 'Der Ausdruck kann auch kausal verstanden werden: „weil er mit ihm geredet hatte“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die erzählerische Einleitung wird in würdigem, noch verständlichem Deutsch wiedergegeben; der Doppelpunkt bindet sie natürlich an den folgenden Temporalsatz an.
- source_word: בְּרֶדֶת ... בְּרִדְתּוֹ
  choice: als Mose ... herabstieg ... als er ... herabstieg
  rationale: Beide Infinitivkonstruktionen bezeichnen den zeitlichen Rahmen. Die auffällige Wiederholung des hebräischen Textes bleibt erhalten.
- source_word: מֵהַר סִינַי
  choice: vom Berg Sinai
  rationale: Dies ist die geläufige und natürliche deutsche Bezeichnung.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: die beiden Tafeln des Zeugnisses
  rationale: „Tafeln“ gibt לֻחֹת konkret wieder; „Zeugnis“ wahrt den etablierten bundesbezogenen Sinn von עֵדוּת, ohne ihn ausdeutend zu erweitern.
- source_word: בְּיַד מֹשֶׁה
  choice: in Moses Hand
  rationale: Die konkrete Wendung und der Singular des Hebräischen werden beibehalten. Der eingeschobene Satz ermöglicht dabei ein verständliches modernes Deutsch.
- source_word: לֹא יָדַע
  choice: wusste ... nicht
  rationale: Schlichte und direkte Wiedergabe der verneinten Form von ידע.
- source_word: קָרַן
  choice: strahlte
  rationale: Das Verb bezeichnet hier das Ausgehen von Strahlen beziehungsweise sichtbaren Glanz. „Strahlte“ ist prägnant, kontextgemäß und lässt das konkrete Bild erkennen.
- source_word: עוֹר פָּנָיו
  choice: die Haut seines Gesichts
  rationale: Der deutsche Text bewahrt die ausdrückliche Nennung der Haut und verkürzt nicht lediglich zu „sein Gesicht“.
- source_word: בְּדַבְּרוֹ אִתּוֹ
  choice: weil er mit ihm geredet hatte
  rationale: Die kausale Deutung passt zum Zusammenhang und ist idiomatisch. Da בְּ mit dem Infinitiv auch temporal verstanden werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote offengehalten.
- source_word: אִתּוֹ
  choice: mit ihm
  rationale: Das Pronomen des Ausgangstextes bleibt im Haupttext erhalten; sein kontextuell klarer Bezug auf den HERRN wird in einer Fußnote erläutert.
theological_decisions:
- issue: Bedeutung von קָרַן im Blick auf Moses Gesicht
  choice: strahlen beziehungsweise Strahlen aussenden
  alternative: gehörnt sein
  rationale: Der unmittelbare Zusammenhang beschreibt den sichtbaren Glanz nach Moses Begegnung mit dem HERRN. Die historisch wirksame Wiedergabe „gehörnt“ beruht auf der Beziehung zum Substantiv „Horn“, passt aber weniger gut zum Kontext.
- issue: Bezug von אִתּוֹ
  choice: Das Pronomen „ihm“ im Haupttext beibehalten; gemeint ist im Zusammenhang der HERR.
  alternative: den HERRN oder Gott ausdrücklich im Haupttext nennen
  rationale: Der hebräische Text verwendet ein Pronomen. Seine Beibehaltung wahrt die Form des Ausgangstextes, während eine Fußnote den Bezug klärt.
- issue: Funktion von בְּ in בְּדַבְּרוֹ אִתּוֹ
  choice: 'kausal: „weil er mit ihm geredet hatte“'
  alternative: 'temporal: „als er mit ihm redete“'
  rationale: Der Zusammenhang legt eine ursächliche Verbindung zwischen der Begegnung und dem Strahlen nahe, doch die hebräische Konstruktion lässt auch ein zeitliches Verständnis zu; diese Spannung wird nicht stillschweigend beseitigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit maßvoll bewahrter hebräischer Wiederholung. Gedankenstriche kennzeichnen den eingeschobenen Begleitumstand und halten den langen Satz verständlich. „Moses Hand“ bewahrt die Namenswiederholung und den Singular des Ausgangstextes; „die Haut seines Gesichts“ wahrt dessen konkrete Ausdrucksweise.
