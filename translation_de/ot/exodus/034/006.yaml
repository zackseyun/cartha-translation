source:
  edition: WLC
  text: וַ/יַּעֲבֹ֨ר יְהוָ֥ה עַל פָּנָי/ו֮ וַ/יִּקְרָא֒ יְהוָ֣ה יְהוָ֔ה אֵ֥ל רַח֖וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַפַּ֖יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת׀־׀־׀
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/006.yaml
  text: Then Yahweh passed before him and proclaimed[a], “Yahweh, Yahweh, a God compassionate and gracious, slow to anger, and abounding in steadfast love and faithfulness.”
translation:
  language: de
  text: 'Da ging Jahwe vor ihm vorüber und rief aus: »Jahwe, Jahwe, ein barmherziger und gnädiger Gott, langsam zum Zorn und reich an beständiger Liebe und Treue[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »reich an beständiger Liebe und Wahrheit«.'
    reason: Lexikalische Alternative für אֱמֶת; das Wort kann sowohl Verlässlichkeit beziehungsweise Treue als auch Wahrheit bezeichnen.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner geläufigen wissenschaftlichen Form wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: וַיַּעֲבֹר ... עַל־פָּנָיו
  choice: ging ... vor ihm vorüber
  rationale: Die Formulierung gibt die räumliche Bewegung an Mose vorbei natürlich wieder und bewahrt den Bezug von עַל־פָּנָיו.
- source_word: וַיִּקְרָא
  choice: rief aus
  rationale: קרא bezeichnet hier das hörbare, feierliche Ausrufen der folgenden Selbstkundgabe; »rief aus« ist natürlich und weniger deutend als »verkündete«.
- source_word: אֵל רַחוּם וְחַנּוּן
  choice: ein barmherziger und gnädiger Gott
  rationale: אֵל leitet appositionell die Wesensbeschreibung ein. »Barmherzig« und »gnädig« bilden ein verständliches und in gehobenem modernem Deutsch natürliches Begriffspaar.
- source_word: אֶרֶךְ אַפַּיִם
  choice: langsam zum Zorn
  rationale: Die wörtliche Wendung »lang an den Nasenlöchern« ist ein hebräisches Idiom für geringe Zornbereitschaft; die gewählte Form wahrt das Bildfeld des Zorns.
- source_word: רַב
  choice: reich an
  rationale: Vor abstrakten Substantiven bezeichnet רַב eine Fülle; »reich an« ist im Deutschen idiomatisch und würdevoll.
- source_word: חֶסֶד
  choice: beständige Liebe
  rationale: חֶסֶד umfasst Güte, loyale Zuwendung und verlässliche Liebe. »Beständige Liebe« hält Zuneigung und Dauer zusammen, ohne den Bundesaspekt übermäßig festzulegen.
- source_word: אֱמֶת
  choice: Treue
  rationale: In der Paarung mit חֶסֶד bezeichnet אֱמֶת besonders Verlässlichkeit und Beständigkeit; die Grundbedeutung »Wahrheit« bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe und Wiederholung des Gottesnamens יְהוָה
  choice: Jahwe, Jahwe
  alternative: der HERR, der HERR
  rationale: Die zweimalige Nennung des persönlichen Gottesnamens wird entsprechend dem Hebräischen bewahrt; sie wird weder durch einen Titel ersetzt noch mit dem folgenden אֵל verschmolzen.
- issue: Bedeutung von אֱמֶת in חֶסֶד וֶאֱמֶת
  choice: Treue
  alternative: Wahrheit
  rationale: Im Zusammenhang der göttlichen Wesensbeschreibung liegt die relationale Verlässlichkeit nahe. Da »Wahrheit« lexikalisch möglich und traditionsprägend ist, wird diese Spannung durch eine Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der feierlichen hebräischen Selbstkundgabe, bleibt aber idiomatisch. Der Name »Jahwe« und seine Wiederholung sowie die attributive Reihung werden bewahrt.
