  text: וַ/יִּפְסֹ֡ל שְׁנֵֽי לֻחֹ֨ת אֲבָנִ֜ים כָּ/רִאשֹׁנִ֗ים וַ/יַּשְׁכֵּ֨ם מֹשֶׁ֤ה בַ/בֹּ֨קֶר֙ וַ/יַּ֨עַל֙ אֶל הַ֣ר סִינַ֔י כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ שְׁנֵ֖י לֻחֹ֥ת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/004.yaml
  text: So he cut two stone tablets like the first ones[a], and Moses rose early in the morning and went up Mount Sinai, just as Yahweh had commanded him[b], and he took the two stone tablets in his hand.
translation:
  language: de
  text: Da hieb er zwei Steintafeln zurecht wie die ersten[a]. Früh am Morgen stand Mose auf und stieg auf den Berg Sinai, wie Jahwe es ihm geboten hatte. Und er nahm die beiden Steintafeln in seine Hand[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: meißelte zwei Steintafeln wie die ersten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: in seiner Hand. Der Singular kann im Hebräischen idiomatisch gebraucht sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְסֹל
  choice: hieb … zurecht
  rationale: Das Verb פסל bezeichnet hier das Bearbeiten und Formen von Stein. „Hieb … zurecht“ gibt die konkrete Tätigkeit natürlich wieder; „meißelte“ ist ebenfalls möglich.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: zwei Steintafeln
  rationale: Die übliche, klare deutsche Bezeichnung für die steinernen Bundestafeln.
- source_word: כָּרִאשֹׁנִים
  choice: wie die ersten
  rationale: Die Vergleichspartikel und das Adjektiv verweisen auf die früheren Tafeln und bezeichnen ihre Entsprechung.
- source_word: וַיַּשְׁכֵּם ... בַבֹּקֶר
  choice: Früh am Morgen stand Mose auf
  rationale: Gibt die hebräische Wendung für frühes Aufstehen in natürlichem, würdigem Deutsch wieder.
- source_word: וַיַּעַל אֶל הַר סִינַי
  choice: stieg auf den Berg Sinai
  rationale: Bewahrt die ausdrücklich bezeichnete Aufwärtsbewegung; אֶל bezeichnet hier das Hinaufsteigen zum beziehungsweise auf den Berg.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als im Deutschen geläufige Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ
  choice: wie Jahwe es ihm geboten hatte
  rationale: Drückt die Übereinstimmung mit dem vorausgehenden Gebot aus; das Plusquamperfekt verdeutlicht in natürlichem Deutsch dessen zeitlichen Vorrang.
- source_word: וַיִּקַּח בְּיָדוֹ
  choice: Dabei nahm er … in die Hand
  rationale: Bewahrt den singularischen Ausdruck „in seine Hand“; „dabei“ verbindet die Handlung flüssig mit dem Aufstieg, ohne eine zusätzliche zeitliche Behauptung einzuführen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen in einer geläufigen deutschen Form, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge folgt dem hebräischen Handlungsablauf, wird aber durch drei übersichtliche deutsche Sätze lesbar gestaltet. Sämtliche Fußnotenmarker stehen im Haupttext.
