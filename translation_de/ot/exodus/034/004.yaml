- from: Da hieb er zwei Steintafeln zurecht wie die ersten[a]. Früh am Morgen stand Mose auf und stieg auf den Berg Sinai, wie Jahwe es ihm geboten hatte. Dabei nahm er die beiden Steintafeln in die Hand[b].
  to: Da hieb er zwei Steintafeln zurecht wie die ersten[a]. Früh am Morgen stand Mose auf und stieg auf den Berg Sinai, wie Jahwe es ihm geboten hatte. Und er nahm die beiden Steintafeln in seine Hand[b].
  rationale: Die Revision entfernt die leicht interpretierende Verbindung „Dabei“ und berichtigt die wörtliche Wiedergabe in Fußnote b. Der Text bleibt ansonsten unverändert, da Wortwahl, Gottesname, Register und Fußnotenanker dem hebräischen Text angemessen entsprechen.
