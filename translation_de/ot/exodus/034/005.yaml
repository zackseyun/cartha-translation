source:
  edition: WLC
  text: וַ/יֵּ֤רֶד יְהוָה֙ בֶּֽ/עָנָ֔ן וַ/יִּתְיַצֵּ֥ב עִמּ֖/וֹ שָׁ֑ם וַ/יִּקְרָ֥א בְ/שֵׁ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/005.yaml
  text: And Yahweh came down in the cloud and stood there with him[a], and proclaimed the name of Yahweh.
translation:
  language: de
  text: Da kam Yahweh in der Wolke herab, stellte sich dort zu ihm und rief den Namen Yahwehs aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und rief den Namen Yahwehs an«; oder: »und rief im Namen Yahwehs aus«. Im Hebräischen steht vor »Name« die Präposition, wörtlich etwa »in/durch«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: וַיֵּרֶד
  choice: kam … herab
  rationale: Gibt die konkrete Abwärtsbewegung natürlich und erzählerisch passend wieder.
- source_word: בֶּעָנָן
  choice: in der Wolke
  rationale: Das Präfix ב bezeichnet hier den Ort; der bestimmte Artikel weist auf die im Kontext bekannte Erscheinungswolke.
- source_word: וַיִּתְיַצֵּב
  choice: trat … zu ihm
  rationale: Das Hitpael von יצב bezeichnet das Sichhinstellen beziehungsweise Stellungnehmen; im Deutschen gibt diese Formulierung die Bewegung und das anschließende Dabeistehen idiomatisch wieder.
- source_word: עִמּוֹ שָׁם
  choice: dort zu ihm
  rationale: Bewahrt sowohl die lokale Angabe שָׁם als auch das Zusammensein mit Mose, ohne schwerfällig zu klingen.
- source_word: וַיִּקְרָא
  choice: rief … aus
  rationale: קרא kann »rufen« oder »ausrufen/verkünden« bedeuten; mit der folgenden Selbstoffenbarung passt »ausrufen« gut, ohne den Wortlaut unnötig auszudeuten.
- source_word: בְשֵׁם יְהוָה
  choice: den Namen Yahwehs
  rationale: Nach »ausrufen« ist dies im Deutschen natürlich. Die im Hebräischen ausdrücklich vorhandene Präposition ב und die daraus entstehenden Alternativen werden in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: Jehova beziehungsweise traditionell »der HERR«
  rationale: Der hebräische Text verwendet den Gottesnamen selbst; die Transliteration bewahrt ihn als Eigennamen.
- issue: Subjekt von וַיִּקְרָא
  choice: 'Yahweh bleibt das Subjekt: Er rief den Namen aus.'
  alternative: Mose rief den Namen Yahwehs an.
  rationale: Die fortlaufende hebräische Verbfolge setzt am natürlichsten Yahweh als Subjekt fort; zugleich wird die mögliche andere Deutung der Präpositionalfügung in der Fußnote kenntlich gemacht.
- issue: Bedeutung von בְשֵׁם יְהוָה
  choice: »den Namen Yahwehs ausrufen«
  alternative: »den Namen Yahwehs anrufen« oder »im Namen Yahwehs ausrufen«
  rationale: Die gewählte Fassung passt zum folgenden Inhalt der göttlichen Selbstverkündigung. Da בְשֵׁם wörtlich eine Präposition enthält und mehrere syntaktische Deutungen zulässt, werden die Alternativen nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Da kam … herab« erhält den erzählerischen Fortgang; »trat dort zu ihm« vermeidet ein steifes »stellte sich dort mit ihm hin«. Der Fußnotenmarker steht unmittelbar nach der strittigen Wendung.
