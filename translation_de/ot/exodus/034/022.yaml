base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/022.yaml
  text: And you shall observe for yourself the Feast of Weeks[a], the firstfruits of the wheat harvest, and the Feast of Ingathering at the turn of the year.
translation:
  language: de
  text: Das Wochenfest sollst du feiern, das Fest der Erstlingsfrüchte der Weizenernte, und das Fest des Einsammelns zur Wende des Jahres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »am Ende des Jahres«. Der hebräische Ausdruck bezeichnet wörtlich die Wende oder den Umlauf des Jahres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג שָׁבֻעֹת
  choice: Wochenfest
  rationale: Der hebräische Festname bedeutet wörtlich »Fest der Wochen«. »Wochenfest« ist im Deutschen verständlich und bewahrt die hebräische Bezeichnung, ohne den späteren Namen »Pfingsten« einzutragen.
- source_word: תַּעֲשֶׂה לְךָ
  choice: sollst du feiern
  rationale: Wörtlich steht »sollst du dir machen«. In Verbindung mit חַג bezeichnet עשה idiomatisch das Begehen beziehungsweise Feiern eines Festes. Das Dativpronomen wird im natürlichen Deutschen nicht eigens wiedergegeben.
- source_word: בִּכּוּרֵי קְצִיר חִטִּים
  choice: mit den Erstlingsfrüchten der Weizenernte
  rationale: בִּכּוּרִים bezeichnet die ersten Erträge, die als Gabe dargebracht werden. Das im Deutschen ergänzte »mit« macht die sachliche Zuordnung zum Wochenfest verständlich, ohne daraus einen eigenen Festnamen zu bilden.
- source_word: חַג הָאָסִיף
  choice: Fest des Einsammelns
  rationale: אָסִיף bezeichnet das Einbringen beziehungsweise Einsammeln der Erzeugnisse. Die transparente Wiedergabe vermeidet die mögliche Verengung von »Lese« auf Weintrauben.
- source_word: תְּקוּפַת הַשָּׁנָה
  choice: bei der Wende des Jahres
  rationale: תְּקוּפָה bezeichnet hier die Wende oder den Umlauf des Jahres. Die Formulierung bewahrt das Bild des Jahreszyklus und legt sich nicht vorschnell auf das Ende eines bestimmten Kalenders fest.
theological_decisions:
- issue: Kalenderbezug von תְּקוּפַת הַשָּׁנָה
  choice: bei der Wende des Jahres
  alternative: am Ende des Jahres
  rationale: Der hebräische Ausdruck kann auf den Umschlag beziehungsweise Abschluss des landwirtschaftlichen Jahreszyklus weisen. »Wende« erhält diese Offenheit und vermeidet eine unnötige Festlegung auf den letzten Tag oder Monat eines Kalenderjahres.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die beiden Feste klar zusammen; »ebenso« verdeutlicht die Koordination. Kultische Fachsprache wird nur dort verwendet, wo sie verständlich und präzise ist.
