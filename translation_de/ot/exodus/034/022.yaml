review_pass:
  verdict: revise
  source_fidelity: 'Die beiden Festbezeichnungen und die Zeitangabe werden grundsätzlich treffend wiedergegeben. Die Wendung „mit den Erstlingsfrüchten“ gibt jedoch die appositionale bzw. näher bestimmende Verbindung von „Fest der Wochen“ und „Erstlingsfrüchte der Weizenernte“ zu frei wieder: Sie kann im Deutschen nahelegen, die Erstlingsfrüchte seien bloß ein begleitendes Mittel der Feier. Eine ausdrückliche Apposition bewahrt die hebräische Beziehung besser.'
  naturalness: „Das Wochenfest … und das Fest des Einsammelns zur Wende des Jahres“ ist modernes, verständliches Standarddeutsch. „Zur Wende“ ist als zeitliche Angabe idiomatischer als „bei der Wende“.
  terminology: „Wochenfest“, „Erstlingsfrüchte“, „Weizenernte“ und „Fest des Einsammelns“ sind sachgerecht, transparent und vermeiden die nachträgliche Benennung „Pfingsten“. Die Fußnote erhält die begründete lexikalische Alternative zu תְּקוּפַת הַשָּׁנָה.
  issues:
  - severity: medium
    issue: „mit den Erstlingsfrüchten der Weizenernte“
    rationale: Das „mit“ macht aus den Erstlingsfrüchten eher eine Begleitumstandsangabe. Im Hebräischen stehen sie als nähere Bestimmung/Apposition zum Wochenfest. „das Fest der Erstlingsfrüchte der Weizenernte“ gibt diese Beziehung präziser wieder.
  - severity: low
    issue: „bei der Wende des Jahres“
    rationale: Die Formulierung ist verständlich, doch „zur Wende des Jahres“ ist im Deutschen die natürlichere temporale Entsprechung.
  revised_text: Das Wochenfest sollst du feiern, das Fest der Erstlingsfrüchte der Weizenernte, und das Fest des Einsammelns zur Wende des Jahres.[a]
