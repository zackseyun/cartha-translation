- from: Das Wochenfest sollst du feiern mit den Erstlingsfrüchten der Weizenernte, ebenso das Fest des Einsammelns bei der Wende des Jahres.[a]
  to: Das Wochenfest sollst du feiern, das Fest der Erstlingsfrüchte der Weizenernte, und das Fest des Einsammelns zur Wende des Jahres.[a]
  rationale: Die Revision ersetzt die potenziell missverständliche instrumentale Verbindung „mit den Erstlingsfrüchten“ durch eine Apposition, welche die hebräische Benennung des Wochenfestes genauer abbildet. Außerdem wird die Zeitangabe idiomatischer gefasst. Bedeutungsspielraum und Fußnotenanker bleiben erhalten.
