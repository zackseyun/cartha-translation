  text: וְ/רָא֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶת פְּנֵ֣י מֹשֶׁ֔ה כִּ֣י קָרַ֔ן ע֖וֹר פְּנֵ֣י מֹשֶׁ֑ה וְ/הֵשִׁ֨יב מֹשֶׁ֤ה אֶת הַ/מַּסְוֶה֙ עַל פָּנָ֔י/ו עַד בֹּא֖/וֹ לְ/דַבֵּ֥ר אִתּֽ/וֹ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/035.yaml
  text: And the sons of Israel saw Moses’ face[a], that the skin of Moses’ face shone[c][b]; and Moses would put the veil back over his face until he went in to speak with him.
translation:
  language: de
  text: Die Israeliten sahen Moses Gesicht, dessen Haut strahlte.[a] Und Mose legte den Schleier wieder über sein Gesicht, bis er hineinging, um mit ihm zu reden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet, dass die Haut Licht ausstrahlte; die alte Wiedergabe »war gehörnt« beruht auf einem Missverständnis.
    reason: lexical_alternative
  - marker: b
    text: »Ihm« bezieht sich im unmittelbaren Zusammenhang auf den HERRN.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָאוּ בְנֵי יִשְׂרָאֵל
  choice: Die Israeliten sahen
  rationale: Der deutsche Volksname gibt die hebräische Wendung »Söhne Israels« natürlich und inklusiv wieder; das finite Präteritum passt zur erzählenden Form, während der Zusammenhang die Wiederholung erkennen lässt.
- source_word: כִּי קָרַן עוֹר פְּנֵי מֹשֶׁה
  choice: dass die Haut von Moses Gesicht strahlte
  rationale: כִּי leitet hier den wahrgenommenen Sachverhalt ein. קָרַן bezeichnet das Ausstrahlen von Licht; »strahlte« ist präzise und vermeidet die alte Fehlauffassung »war gehörnt«. עוֹר wird ausdrücklich mit »Haut« wiedergegeben.
- source_word: וְהֵשִׁיב מֹשֶׁה אֶת הַמַּסְוֶה עַל פָּנָיו
  choice: Dann legte Mose die Decke wieder über sein Gesicht
  rationale: Der Hifil von שוב drückt das Zurückbringen beziehungsweise erneute Anlegen aus. »Decke« bezeichnet hier natürlich die Gesichtsbedeckung; »wieder« wahrt den Rückkehraspekt.
- source_word: עַד בֹּאוֹ לְדַבֵּר אִתּוֹ
  choice: bis er hineinging, um mit ihm zu reden
  rationale: Die Richtungsangabe bleibt als »hineinging« erhalten. Das Pronomen »ihm« wird entsprechend dem Hebräischen nicht durch den Gottesnamen ersetzt.
theological_decisions:
- issue: Bezug von אִתּוֹ („mit ihm“)
  choice: Das Pronomen »ihm« bleibt im Haupttext stehen.
  alternative: »mit dem HERRN«
  rationale: Aus dem unmittelbaren Zusammenhang ist der HERR der Referent; da der hebräische Vers jedoch ein Pronomen verwendet, wird diese Form bewahrt und der Bezug in einer Fußnote erläutert.
- issue: Bedeutung von קָרַן
  choice: »strahlte«
  alternative: »war gehörnt«
  rationale: Das Verb beschreibt hier das Ausstrahlen von Licht. Die traditionelle Wiedergabe mit Hörnern beruht auf einer missverständlichen Deutung und wird nicht in den Text übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Israeliten« ist natürlicher als das wörtliche »Söhne Israels«. Die Satzfolge wurde für klares Deutsch gegliedert, ohne die inhaltliche Spannung oder den pronominalen Gottesbezug aufzulösen.
