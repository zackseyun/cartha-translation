base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/012.yaml
  text: Be careful[a], lest you make a covenant with the inhabitants of the land into which you are going[d][c][b], lest it become a snare in your midst.
translation:
  language: de
  text: Hüte dich davor, mit den Bewohnern des Landes, in das du kommst[a], einen Bund zu schließen, damit sie dir nicht zu einer Falle in deiner Mitte werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das du hineinziehst“ bzw. „das du betrittst“.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische hat hier einen maskulinen Singular, der wahrscheinlich auf den kollektiv gemeinten „Bewohner des Landes“ Bezug nimmt. Statt „Falle“ kann auch „Schlinge“ übersetzt werden.
    reason: ambiguity
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Hüte dich davor
  rationale: Der reflexive Warnruf im Niphal wird im Deutschen natürlich und eindringlich wiedergegeben; „davor“ leitet passend den folgenden negativen Sachverhalt ein.
- source_word: פֶּן ... פֶּן
  choice: davor ... damit nicht
  rationale: Das zweimalige פֶּן kennzeichnet Warnung und unerwünschte Folge. Eine identische Wiedergabe wäre im Deutschen schwerfällig; die gewählte Staffelung bewahrt die logische Struktur.
- source_word: תִּכְרֹת בְּרִית
  choice: einen Bund ... schließen
  rationale: „Einen Bund schließen“ ist die etablierte deutsche Entsprechung des hebräischen Idioms „einen Bund schneiden“.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: mit den Bewohnern des Landes
  rationale: Der singularische Partizipialausdruck ist kollektiv gebraucht und bezeichnet die Bewohner des Landes.
- source_word: אֲשֶׁר אַתָּה בָּא עָלֶיהָ
  choice: in das du kommst
  rationale: Die Formulierung gibt die Bewegung in das Land knapp wieder, ohne das räumliche Bild unnötig auszudeuten.
- source_word: יִהְיֶה לְמוֹקֵשׁ
  choice: er ... zu einer Falle wird
  rationale: Das maskuline Pronomen nimmt im Deutschen den unmittelbar zuvor genannten „Bund“ auf; מוֹקֵשׁ bezeichnet eine Falle beziehungsweise Schlinge.
- source_word: בְּקִרְבֶּךָ
  choice: in deiner Mitte
  rationale: Die Wendung bewahrt den gemeinschaftlichen Bezug des kollektiv angesprochenen Israel und vermeidet eine rein innerseelische Deutung.
theological_decisions:
- issue: Bezugswort des abschließenden Singularverbs
  choice: Der Bund wird zur Falle.
  alternative: Die Bewohner oder die gesamte daraus entstehende Lage werden zur Falle.
  rationale: Der Bund ist das nächstliegende singularische Bezugswort und ergibt im Kontext der Warnung vor religiöser Verstrickung einen stimmigen Sinn. Wegen einer möglichen weiteren Bezugnahme wird die Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede steht entsprechend dem Hebräischen im Singular und richtet sich kollektiv an Israel. Das idiomatische „einen Bund schließen“ vermeidet die im Deutschen missverständliche wörtliche Wiedergabe „einen Bund schneiden“.
