base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/031.yaml
  text: But Moses called to them[a], and Aaron and all the leaders of the congregation returned to him, and Moses spoke to them.
translation:
  language: de
  text: Doch Mose rief ihnen zu, und Aaron und alle führenden Männer der Gemeinschaft[a] kehrten zu ihm zurück. Mose sprach zu ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Oberhäupter der Versammlung“; auch: „alle Anführer der Gemeinschaft“.'
    reason: Die Verbindung הַנְּשִׂאִים בָּעֵדָה bezeichnet leitende Personen innerhalb der Gemeinschaft beziehungsweise Versammlung; sowohl „Oberhäupter“ als auch „Anführer“ geben mögliche Nuancen wieder.
lexical_decisions:
- source_word: וַיִּקְרָא אֲלֵהֶם
  choice: rief ihnen zu
  rationale: קרא mit אֶל bezeichnet hier, dass Mose die Zurückgewichenen ansprach. „Ihnen zurufen“ gibt Richtung und Distanz natürlich wieder, ohne die stärkere Bedeutung „herbeirufen“ oder „befehlen“ einzutragen.
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: kehrten zu ihm zurück
  rationale: שׁוב bedeutet gewöhnlich „zurückkehren“. Die Formulierung bewahrt den Bezug zur vorherigen Reaktion Aarons und der Israeliten, die sich Mose zunächst nicht näherten.
- source_word: הַנְּשִׂאִים
  choice: die führenden Männer
  rationale: נָשִׂיא bezeichnet im Pentateuch anerkannte Stammes- oder Gemeinschaftsoberhäupter. „Führende Männer“ ist im damaligen sozialen Zusammenhang präzise und in modernem Deutsch natürlich; „Fürsten“ wäre missverständlich oder altertümlich.
- source_word: בָּעֵדָה
  choice: der Gemeinschaft
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels. „Gemeinschaft“ ist verständlich und lässt sowohl den sozialen Verband als auch dessen Versammlung anklingen.
- source_word: וַיְדַבֵּר מֹשֶׁה אֲלֵהֶם
  choice: Da redete Mose mit ihnen
  rationale: דבר mit אֶל bezeichnet das Reden zu den Angesprochenen. Deutsch „mit ihnen reden“ ist hier idiomatisch; „Da“ führt die nächste Erzählhandlung natürlich fort.
- source_word: וַ
  choice: Doch
  rationale: Das einleitende Waw setzt die Erzählung fort und steht zugleich in einem leichten Gegensatz zur zuvor geschilderten Furcht, sich Mose zu nähern.
