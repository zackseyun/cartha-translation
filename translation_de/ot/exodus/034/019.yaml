base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/019.yaml
  text: Every firstborn of the womb is mine[a], and every male firstborn among your livestock[c][b], whether ox or sheep.
translation:
  language: de
  text: Alles, was den Mutterschoß öffnet[a], gehört mir, ebenso jedes männliche Erstgeborene unter deinem Vieh, ob Rind oder Schaf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: jede erste Leibesfrucht.'
    reason: lexical_alternative
  - marker: b
    text: Die zweite Satzhälfte ist im Hebräischen elliptisch; sie bezeichnet die männlichen Erstlinge von Rind und Schaf.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל פֶּטֶר רֶחֶם
  choice: Alles, was den Mutterschoß öffnet
  rationale: Die hebräische Wendung bezeichnet wörtlich das, was den Mutterschoß öffnet, also die erste Leibesfrucht. Die bildhafte Formulierung bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
- source_word: לִי
  choice: gehört mir
  rationale: Die Präposition drückt hier den Besitz- beziehungsweise Anspruchsanspruch JHWHs aus. „Gehört mir“ ist im Deutschen klar und natürlich.
- source_word: מִקְנְךָ
  choice: deinem Vieh
  rationale: מִקְנֶה ist ein Sammelbegriff für gehaltene Herdentiere. „Vieh“ umfasst im Kontext sowohl Rinder als auch Schafe.
- source_word: תִּזָּכָר
  choice: jedes männliche Erstgeborene
  rationale: Die Form von זכר kennzeichnet in dieser knappen Rechtsformulierung das männliche Tier. Zusammen mit פֶּטֶר und der anschließenden Artenangabe ergibt sich die natürliche deutsche Wiedergabe „jedes männliche Erstgeborene“.
- source_word: פֶּטֶר שׁוֹר וָשֶׂה
  choice: ob Rind oder Schaf
  rationale: Die Wendung bestimmt die betroffenen Vieharten näher. „Ob Rind oder Schaf“ gibt die koordinierte Aufzählung knapp und idiomatisch wieder.
theological_decisions:
- issue: Göttlicher Anspruch auf die Erstgeburt
  choice: Der Vers sagt aus, dass die erste Leibesfrucht und die männliche Erstgeburt des Viehs JHWH gehören.
  alternative: Den Besitzanspruch ausdrücklich als Weihe- oder Opfergebot zu formulieren.
  rationale: Der hebräische Text erhebt unmittelbar einen Besitzanspruch, erläutert an dieser Stelle jedoch weder Weihe noch Opfer. Die Übersetzung vermeidet daher eine theologische Erweiterung.
- issue: Bezug der männlichen Erstgeburt
  choice: „männlich“ wird auf die Erstgeburt des Viehs bezogen.
  alternative: Die elliptische Form möglichst wörtlich mit „all dein Vieh soll männlich sein“ wiederzugeben.
  rationale: Die wörtliche Alternative wäre im Deutschen missverständlich. Kontext, Apposition und antike Auslegungstradition stützen den Bezug auf die männlichen Erstgeborenen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte hebräische Wendung „den Mutterschoß öffnen“ bleibt erhalten; die elliptische Viehklausel wird zur Verständlichkeit behutsam entfaltet.
