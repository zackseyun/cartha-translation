base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/028.yaml
  text: And he was there with Yahweh forty days and forty nights[a]; he ate no bread and drank no water. And he wrote on the tablets the words of the covenant[b], the ten words.
translation:
  language: de
  text: Und er war dort bei Jahwe vierzig Tage und vierzig Nächte. Er aß kein Brot und trank kein Wasser. Und er schrieb auf die Tafeln die Worte des Bundes, die zehn Worte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch „die zehn Worte“; traditionell: „die Zehn Gebote“. Das Subjekt von „er schrieb“ wird im Hebräischen nicht erneut genannt. Im unmittelbaren Satzfluss ist Mose gemeint; 2. Mose 34,1 kündigt jedoch an, dass Jahwe auf die Tafeln schreiben wird, und 5. Mose 10,4 schreibt das Schreiben Jahwe zu.'
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gängige deutsche Wiedergabe des Gottesnamens; sie macht den Eigennamen im hebräischen Text sichtbar.
- source_word: וַיְהִי שָׁם עִם
  choice: Und er war dort bei
  rationale: Gibt Moses’ Aufenthalt bei Jahwe schlicht und ohne zusätzliche Deutung wieder.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: vierzig Tage und vierzig Nächte
  rationale: Präzise und im Deutschen natürliche Wiedergabe der Zeitangabe.
- source_word: לֶחֶם לֹא אָכַל וּמַיִם לֹא שָׁתָה
  choice: Er aß kein Brot und trank kein Wasser
  rationale: Bewahrt die konkreten Substantive und den Parallelismus des Hebräischen.
- source_word: וַיִּכְתֹּב
  choice: Und er schrieb
  rationale: Das Verb ist maskulin Singular und nennt das Subjekt nicht erneut; im unmittelbaren Satzfluss liegt Mose als Bezug nahe, ohne dass die Übersetzung den Namen ergänzt.
- source_word: עַל הַלֻּחֹת
  choice: auf die Tafeln
  rationale: Direkte und etablierte Wiedergabe der steinernen Bundestafeln.
- source_word: דִּבְרֵי הַבְּרִית
  choice: die Worte des Bundes
  rationale: Bewahrt die hebräische Genitivbeziehung und den Schlüsselbegriff Bund.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: die zehn Worte
  rationale: Quellennah; die traditionelle Bezeichnung „Zehn Gebote“ wird in der Fußnote erklärt.
theological_decisions:
- issue: Subjekt von וַיִּכְתֹּב („und er schrieb“)
  choice: Das nicht ausdrücklich genannte Subjekt bleibt auch im Deutschen nur als „er“ bezeichnet; im unmittelbaren Satzfluss bezieht es sich am ehesten auf Mose.
  alternative: Jahwe schrieb auf die Tafeln.
  rationale: Die Oberflächengrammatik führt das bisherige Subjekt Mose fort. Exodus 34,1 und Deuteronomium 10,4 schreiben das Schreiben jedoch Jahwe zu. Diese Spannung wird nicht durch eine ausdrückliche Ergänzung im Haupttext aufgelöst.
- issue: Wiedergabe von עֲשֶׂרֶת הַדְּבָרִים
  choice: die zehn Worte
  alternative: die Zehn Gebote
  rationale: Die Hauptübersetzung folgt der wörtlichen Bedeutung; die vertraute traditionelle Bezeichnung erscheint als lexikalische Erläuterung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit quellennaher Satzführung. Die Wiederholung „Und er“ bewahrt den hebräischen Erzählrhythmus. Die einzige Fußnote bündelt die lexikalische Alternative und die echte kontextuelle Spannung beim Subjekt des Schreibens; ihr Marker steht unmittelbar nach dem betroffenen Schlusssatz.
