id: EXO.34.23
reference: Exodus 34:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶת פְּנֵ֛י הָֽ/אָדֹ֥ן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/023.yaml
  text: Three times in the year all your males shall appear before the Lord Yahweh[b][a], the God of Israel.
translation:
  language: de
  text: Dreimal im Jahr sollen alle deine männlichen Angehörigen vor dem Herrn Jahwe[a], dem Gott Israels, erscheinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch verbindet hier den Titel „der Herr“ mit dem Gottesnamen JHWH: „der Herr Jahwe“. Traditionelle Übersetzungen geben dies oft mit „der Herr, der HERR“ wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: Dreimal im Jahr
  rationale: Die Wendung bezeichnet die Häufigkeit innerhalb des Jahreszyklus; diese deutsche Formulierung ist direkt und natürlich.
- source_word: יֵרָאֶה
  choice: sollen … erscheinen
  rationale: Der Niphal von ראה ist hier die übliche kultische Wendung für das Erscheinen vor Gott. Das Modalverb gibt die verpflichtende Vorschrift im Deutschen angemessen wieder.
- source_word: כָּל זְכוּרְךָ
  choice: alle deine männlichen Angehörigen
  rationale: זָכוּר bezeichnet ausdrücklich die männlichen Mitglieder der angesprochenen Gemeinschaft. „Angehörigen“ macht die auf Israel beziehungsweise seine Haushalte bezogene Formulierung idiomatisch, ohne das Geschlecht zu neutralisieren.
- source_word: אֶת פְּנֵי
  choice: vor
  rationale: Die wörtliche Wendung „vor dem Angesicht“ bezeichnet die Gegenwart einer Person und wird im heutigen Deutsch natürlich mit „vor“ wiedergegeben.
- source_word: הָאָדֹן
  choice: der Herr
  rationale: Der bestimmte Titel אָדוֹן wird als „der Herr“ wiedergegeben und bleibt vom folgenden Gottesnamen unterschieden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname transliteriert und nicht durch einen weiteren Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Status-constructus-Verbindung identifiziert Jahwe als den Gott Israels; die gewählte Form ist im Deutschen klar und etabliert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה nach dem Titel הָאָדֹן
  choice: dem Herrn Jahwe
  alternative: dem Herrn, dem HERRN / dem souveränen HERRN
  rationale: Der hebräische Text verbindet einen Titel mit dem Gottesnamen. „Herrn Jahwe“ bewahrt beides, ohne den Namen durch einen Titel zu ersetzen oder eine im Hebräischen nicht markierte Apposition zu erzwingen.
- issue: Geschlechtsspezifischer Adressatenkreis der Festpflicht
  choice: alle deine männlichen Angehörigen
  alternative: alle deine Männer / alle unter euch
  rationale: Das Hebräische bezeichnet ausdrücklich männliche Personen. Die Übersetzung erhält diese Eingrenzung und vermeidet eine geschlechtsneutrale Erweiterung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich, bleibt aber eng am hebräischen Vorschriftstil. „Männliche Angehörige“ ist präziser und im Deutschen idiomatischer als das substantivierte „Männliche“; der Gottesname und der vorangestellte Titel bleiben klar unterschieden.
