base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/021.yaml
  text: Six days you shall work[a], but on the seventh day you shall cease; in plowing time and in harvest you shall cease.
translation:
  language: de
  text: Sechs Tage sollst du arbeiten, aber am siebten Tag sollst du aufhören[a]; beim Pflügen und bei der Ernte sollst du aufhören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ruhen“. Das hebräische Verb bedeutet zunächst, mit einer Tätigkeit aufzuhören oder sie einzustellen, und kann daraus abgeleitet auch „ruhen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Sechs Tage
  rationale: Die knappe Zeitangabe entspricht unmittelbar der hebräischen Konstruktion und bildet den Gegensatz zum siebten Tag.
- source_word: תַּעֲבֹד
  choice: sollst du arbeiten
  rationale: Das Qal-Imperfekt hat hier im Rahmen der Bundesweisung verpflichtenden Charakter; „sollst“ bewahrt diese Kraft.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: aber am siebten Tag
  rationale: Das Waw markiert hier sachlich den Gegensatz zwischen sechs Arbeitstagen und dem siebten Tag; „aber“ gibt diese Diskursfunktion im Deutschen natürlich wieder.
- source_word: תִּשְׁבֹּת
  choice: sollst du ruhen
  rationale: שׁבת bezeichnet grundlegend das Aufhören beziehungsweise Einstellen einer Tätigkeit und kann daraus folgend „ruhen“ bedeuten. Im Deutschen ist „ruhen“ in diesem Zusammenhang natürlich und würdig; die Fußnote bewahrt den engeren lexikalischen Kernsinn.
- source_word: בֶּחָרִישׁ
  choice: beim Pflügen
  rationale: Die Präposition mit חָרִישׁ bezeichnet die Zeit beziehungsweise Tätigkeit des Pflügens. „Beim Pflügen“ ist knapp und idiomatisch.
- source_word: וּבַקָּצִיר
  choice: und bei der Ernte
  rationale: קָצִיר bezeichnet Ernte beziehungsweise Erntezeit; „bei der Ernte“ gibt den zeitlichen und landwirtschaftlichen Sinn natürlich wieder.
- source_word: תִּשְׁבֹּת (zweites Vorkommen)
  choice: sollst du ruhen
  rationale: Die Wiederholung des hebräischen Verbs wird beibehalten und unterstreicht, dass das Ruhen auch während arbeitsintensiver Zeiten gilt.
theological_decisions:
- issue: Wiedergabe des sabbatbezogenen Verbs שׁבת
  choice: Im Haupttext „ruhen“, mit Fußnote zum Kernsinn „aufhören/Arbeit einstellen“
  alternative: In beiden Fällen „aufhören“ oder „die Arbeit einstellen“
  rationale: „Ruhen“ ist im Deutschen die natürliche sabbatbezogene Formulierung, während die Fußnote deutlich macht, dass der hebräische Ausdruck primär das Aufhören mit der Arbeit bezeichnet. So wird weder bloße Erholung noch eine weitergehende theologische Deutung in den Text eingetragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisungston. Die Anrede bleibt entsprechend dem Hebräischen in der zweiten Person Singular. Die Wiederholung von „sollst du ruhen“ wird zur Wahrung der hebräischen Betonung beibehalten; „auch“ verdeutlicht, dass selbst Pflüge- und Erntezeit keine Ausnahme bilden.
