base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/015.yaml
  text: lest you make a covenant with the inhabitants of the land[a], and they prostitute themselves after their gods and sacrifice to their gods[c][b], and one of them invites you and you eat from his sacrifice.
translation:
  language: de
  text: Hüte dich davor, mit den Bewohnern des Landes einen Bund zu schließen. Sonst könnten sie ihren Göttern nachhuren[a] und ihren Göttern opfern; einer von ihnen könnte dich einladen, und du könntest von seinem Schlachtopfer essen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische verwendet für die Verehrung anderer Götter die Bildsprache sexueller Untreue.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »von seinem Opfer essen«. Gemeint ist eine Speise, die zu seinem Schlachtopfer gehört.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Hüte dich davor … Sonst
  rationale: פֶּן leitet hier die Warnung vor einer möglichen Folge ein. Die zweiteilige deutsche Formulierung ist natürlich und erhält den warnenden Charakter.
- source_word: תִּכְרֹת בְּרִית
  choice: einen Bund schließen
  rationale: Dies ist die geläufige deutsche Entsprechung der hebräischen Wendung, wörtlich »einen Bund schneiden«.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: mit den Bewohnern des Landes
  rationale: Der Singular יוֹשֵׁב ist kollektiv gebraucht und bezeichnet die im Land lebende Bevölkerung.
- source_word: וְזָנוּ אַחֲרֵי אֱלֹהֵיהֶם
  choice: sie huren ihren Göttern nach
  rationale: Die Formulierung bewahrt die bewusst anstößige Metapher sexueller Untreue für Götzendienst sowie die Bewegungsrichtung von אַחֲרֵי.
- source_word: וְזָבְחוּ לֵאלֹהֵיהֶם
  choice: und opfern ihren Göttern
  rationale: זבח bezeichnet hier das Darbringen von Schlachtopfern im kultischen Dienst.
- source_word: וְקָרָא לְךָ
  choice: wenn einer von ihnen dich einlädt
  rationale: Das Verb kann »rufen« oder kontextuell »einladen« bedeuten. Der Singular nach dem pluralischen Zusammenhang wird im Deutschen distributiv wiedergegeben.
- source_word: וְאָכַלְתָּ מִזִּבְחוֹ
  choice: isst du von seinem Schlachtopfer
  rationale: Die Übersetzung bleibt nahe am Hebräischen und macht zugleich deutlich, dass es um den Verzehr von Nahrung aus einem kultischen Opfer geht.
theological_decisions:
- issue: Sexualmetapher für Götzendienst
  choice: »sie huren ihren Göttern nach«
  alternative: »sie laufen ihren Göttern nach« / »sie treiben Hurerei mit ihren Göttern«
  rationale: Das hebräische זנה bezeichnet sexuelle Untreue und wird metaphorisch für den Abfall zu anderen Göttern verwendet. Eine bloße Wiedergabe mit »folgen« würde die theologische und rhetorische Schärfe abschwächen.
- issue: Wechsel vom Plural zum Singular
  choice: »wenn einer von ihnen dich einlädt«
  alternative: »und er dich einlädt« / »und sie dich einladen«
  rationale: Der hebräische Singular individualisiert wahrscheinlich einen beliebigen Bewohner. Die deutsche Wiedergabe macht diesen distributiven Sinn deutlich, ohne den Bezug auf die Bewohner aufzugeben.
- issue: Teilnahme am fremden Kult durch Opfermahl
  choice: »isst du von seinem Schlachtopfer«
  alternative: »isst du von seinem Opfermahl«
  rationale: Der Text nennt ausdrücklich das Opfer, lässt aber die genaue Form des Mahls unausgeführt. Daher wird der kultische Bezug bewahrt, ohne stärker als der Ausgangstext zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Huren« ist bewusst kräftig gewählt, weil der hebräische Text die Bildsprache sexueller Untreue ausdrücklich verwendet. Die Satzteilung verdeutlicht den Warncharakter von פֶּן und die daraus folgende Kette möglicher Verstrickungen.
