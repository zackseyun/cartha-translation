id: EXO.34.18
reference: Exodus 34:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֨ת יָמִ֜ים תֹּאכַ֤ל מַצּוֹת֙ אֲשֶׁ֣ר צִוִּיתִ֔/ךָ לְ/מוֹעֵ֖ד חֹ֣דֶשׁ הָ/אָבִ֑יב כִּ֚י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֔יב יָצָ֖אתָ מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/018.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib[c][b]; for in the month of Abib you came out from Egypt.
translation:
  language: de
  text: Das Fest der ungesäuerten Brote sollst du halten. Sieben Tage lang sollst du ungesäuertes Brot essen, wie ich dir geboten habe, zur festgesetzten Zeit im Monat Abib[a]; denn im Monat Abib bist du aus Ägypten ausgezogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abib ist die alte Bezeichnung des Frühlingsmonats, in dem Israel aus Ägypten auszog; der Name hängt mit dem Reifen der Ähren zusammen.
    reason: Kulturelle und lexikalische Erläuterung der Monatsbezeichnung.
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: das Fest der ungesäuerten Brote
  rationale: חַג bezeichnet ein Fest, besonders eine heilige, festgesetzte Feier; מַצּוֹת sind ungesäuerte Brote. Die titelartige Formulierung bewahrt den kultischen Charakter und ist im Deutschen verständlich.
- source_word: תִּשְׁמֹר
  choice: sollst du halten
  rationale: שׁמר bedeutet in diesem Zusammenhang, eine gebotene Festfeier einzuhalten oder zu begehen. „Halten“ bewahrt den bundessprachlichen Nachdruck und klingt zugleich natürlich.
- source_word: שִׁבְעַת יָמִים
  choice: Sieben Tage lang
  rationale: Die Wendung gibt die Dauer an; „lang“ macht diese Funktion im Deutschen eindeutig und flüssig.
- source_word: תֹּאכַל מַצּוֹת
  choice: sollst du ungesäuertes Brot essen
  rationale: Der hebräische Plural bezeichnet hier die Speise als Gattung. Der deutsche Kollektivsingular „ungesäuertes Brot“ ist idiomatisch.
- source_word: אֲשֶׁר צִוִּיתִךָ
  choice: wie ich dir geboten habe
  rationale: Die Wiedergabe lässt den Rückbezug auf die angeordnete Feier einschließlich ihrer Durchführung und Zeit offen, statt ihn unnötig einzuengen.
- source_word: לְמוֹעֵד
  choice: zur festgesetzten Zeit
  rationale: מוֹעֵד bezeichnet einen bestimmten beziehungsweise festgesetzten Zeitpunkt, häufig für eine heilige Feier.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: im Monat Abib
  rationale: אָבִיב dient hier als überlieferte Bezeichnung des Monats. „Abib“ transliteriert sie, ohne sie mit einem späteren Monatsnamen gleichzusetzen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung für das Gebot ein; „denn“ stellt diesen Zusammenhang klar und würdevoll her.
- source_word: יָצָאתָ מִמִּצְרָיִם
  choice: bist du aus Ägypten ausgezogen
  rationale: יצא bedeutet hinausgehen oder ausziehen. „Aus Ägypten ausgezogen“ ist im Deutschen natürlich und bewahrt den Bezug auf den Exodus.
theological_decisions:
- issue: Bundessprachliche Festbezeichnung
  choice: „Fest der ungesäuerten Brote“ als titelartige Bezeichnung
  alternative: „Fest der ungesäuerten Brote“ rein beschreibend oder „Wallfahrtsfest der ungesäuerten Brote“
  rationale: Die Formulierung bewahrt das Gewicht der von Gott angeordneten heiligen Feier, ohne den im Wort חַג möglichen Wallfahrtsaspekt ausdrücklich zu machen, den der Vers selbst nicht entfaltet.
- issue: Israel als Adressat im Singular
  choice: Durchgehend zweite Person Singular („du“)
  alternative: Kollektive Verdeutlichung durch „ihr“ oder „Israel“
  rationale: Der hebräische Text redet Israel in der zweiten Person maskulin Singular an. Das deutsche „du“ erhält diese korporative Singularform, ohne sie auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die Wiederholung von „im Monat Abib“ bleibt entsprechend dem hebräischen Nachdruck erhalten. „Sollst du“ gibt die gebietende Form wieder, ohne unnötig altertümlich zu klingen.
