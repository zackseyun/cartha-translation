  source_fidelity: 'Der Entwurf gibt die hebräische Satzstruktur und den Sinn sehr genau wieder: Mose soll zwei steinerne Tafeln entsprechend den ersten anfertigen; Jahwe wird die Worte darauf schreiben, die auf den ersten Tafeln waren und die Mose zerbrochen hat. „Worte“ bewahrt den offenen Sinn von הַדְּבָרִים, und „Jahwe“ gibt den Gottesnamen angemessen wieder.'
