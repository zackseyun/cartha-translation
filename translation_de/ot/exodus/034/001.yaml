source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה פְּסָל לְ/ךָ֛ שְׁנֵֽי לֻחֹ֥ת אֲבָנִ֖ים כָּ/רִאשֹׁנִ֑ים וְ/כָתַבְתִּי֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֥ר שִׁבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/001.yaml
  text: Then Yahweh said to Moses[a], “Cut for yourself two stone tablets like the first ones, and I will write on the tablets the words that were on the first tablets[b], which you broke.”
translation:
  language: de
  text: 'Dann sagte Jahwe zu Mose: „Haue dir zwei Steintafeln zurecht wie die ersten, und ich werde auf die Tafeln die Worte schreiben, die auf den ersten Tafeln standen, die du zerbrochen hast.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen geläufige Umschrift des Tetragramms, statt es durch den Titel „der HERR“ zu ersetzen.
- source_word: וַיֹּאמֶר
  choice: Da sprach
  rationale: Die erzählende Verbform führt eine direkte Rede ein. „Da sprach“ ist würdig, verständlich und gibt den Fortgang der Erzählung wieder.
- source_word: פְּסָל
  choice: Haue … zurecht
  rationale: Das Verb bezeichnet hier das Behauen beziehungsweise Herstellen der Steintafeln. Die zweiteilige deutsche Formulierung beschreibt den konkreten Vorgang natürlich, ohne eine Verzierung oder Beschriftung anzudeuten.
- source_word: לְךָ
  choice: dir
  rationale: Der Dativ wird ausdrücklich beibehalten und zeigt, dass Mose die Tafeln selbst anfertigen soll.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: zwei Steintafeln
  rationale: Die kompakte Zusammensetzung ist im modernen Deutschen die natürliche und genaue Wiedergabe von „zwei Tafeln aus Stein“.
- source_word: כָּרִאשֹׁנִים
  choice: wie die ersten
  rationale: Die Vergleichspartikel bezeichnet die Übereinstimmung mit den früheren Tafeln; der Bezug ist aus dem Kontext eindeutig.
- source_word: וְכָתַבְתִּי
  choice: und ich werde … schreiben
  rationale: Die Form bezeichnet hier Jahwes zukünftiges Handeln und wird als klare Zusage wiedergegeben.
- source_word: הַדְּבָרִים
  choice: die Worte
  rationale: Das hebräische Wort bedeutet hier wörtlich „Worte“. „Gebote“ wäre im Zusammenhang sachlich möglich, würde den Ausdruck jedoch interpretierend verengen.
- source_word: אֲשֶׁר הָיוּ עַל הַלֻּחֹת הָרִאשֹׁנִים
  choice: die auf den ersten Tafeln standen
  rationale: Bei geschriebenem Inhalt ist „auf den Tafeln standen“ natürliches Deutsch und bewahrt den Sinn des hebräischen Relativsatzes.
- source_word: אֲשֶׁר שִׁבַּרְתָּ
  choice: die du zerbrochen hast
  rationale: „Zerbrechen“ gibt die gewaltsame Beschädigung der Steintafeln präzise wieder, ohne den Vorgang unnötig auszuschmücken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich den Gottesnamen. Die Umschrift „Jahwe“ bewahrt ihn als persönlichen Namen und ersetzt ihn nicht durch einen Titel; „Jehova“ beruht auf einer späteren Mischlesung.
- issue: Bedeutung von הַדְּבָרִים
  choice: die Worte
  alternative: die Gebote
  rationale: Obwohl die bezeichneten Worte Gebotscharakter haben, bleibt die Übersetzung beim weiteren hebräischen Ausdruck und vermeidet eine unnötige dogmatische oder sachliche Verengung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Da sprach“ wahrt den biblischen Erzählfluss, während Satzbau und Wortwahl gegenwärtig und natürlich bleiben.
