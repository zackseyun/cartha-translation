base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/014.yaml
  text: For you shall not bow down to another god[a], for Yahweh, whose name is Jealous[c][b], is a jealous God.
translation:
  language: de
  text: Denn du sollst dich vor keinem anderen Gott niederwerfen[a]; denn Jahwe – „Eifersüchtig“[b] ist sein Name – ist ein eifersüchtiger Gott.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn du sollst keinen anderen Gott anbeten.“ Das hebräische Verb bezeichnet wörtlich das Sich-Niederwerfen, häufig als Ausdruck der Anbetung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Denn Jahwe – Eifersüchtig ist sein Name – ist ein eifersüchtiger Gott.“'
    reason: lexical_alternative
  - marker: c
    text: „Eifersüchtig“ bezeichnet hier Jahwes ausschließlichen Bundesanspruch auf die Verehrung seines Volkes, nicht sündhaften Neid.
    reason: cultural_note
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: dich … niederwerfen
  rationale: Das Verb bezeichnet konkret das Sich-Niederwerfen oder Sich-Verbeugen, häufig als Akt der Anbetung. Die konkrete Handlung bleibt so erhalten, ohne den kultischen Sinn auf eine abstrakte Wiedergabe zu verengen.
- source_word: לְאֵל אַחֵר
  choice: vor keinem anderen Gott
  rationale: אֵל bedeutet „Gott“, אַחֵר „ein anderer“. Wegen der deutschen Verbindung „sich vor jemandem niederwerfen“ wird die hebräische Präposition idiomatisch mit „vor“ wiedergegeben; die Verneinung wird natürlich als „keinem“ formuliert.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: קַנָּא
  choice: Eifersüchtig / eifersüchtig
  rationale: Das Wort bezeichnet Jahwes ausschließlichen Anspruch auf die Verehrung seines Volkes und seine Unduldsamkeit gegenüber rivalisierender Gottesverehrung. Die Wiederholung und die Verwendung als Name beziehungsweise Bezeichnung bleiben erhalten.
- source_word: שְׁמוֹ
  choice: ist sein Name
  rationale: Die hebräische Satzform „Eifersüchtig ist sein Name“ wird bewusst bewahrt, da sie pointierter ist als eine glättende Relativkonstruktion.
- source_word: אֵל קַנָּא הוּא
  choice: ist ein eifersüchtiger Gott
  rationale: Die Aussage wiederholt und erläutert die vorangehende Namensbezeichnung und bewahrt damit die rhetorische Struktur des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Bedeutung von קַנָּא als Name und Eigenschaft Gottes
  choice: Eifersüchtig / eifersüchtig
  alternative: Eifernd / eifernder
  rationale: „Eifersüchtig“ bewahrt die Spannung des hebräischen Ausdrucks und bezeichnet hier den ausschließlichen Bundesanspruch Jahwes auf die Verehrung seines Volkes, nicht sündhaften Neid.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Gebärde des Niederwerfens und die markante hebräische Namensformel bleiben erhalten. Der Gedankenstrich macht die eingeschobene Namensaussage verständlich, ohne sie zu glätten.
