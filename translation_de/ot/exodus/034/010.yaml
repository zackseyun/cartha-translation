source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הִנֵּ֣ה אָנֹכִי֮ כֹּרֵ֣ת בְּרִית֒ נֶ֤גֶד כָּֽל עַמְּ/ךָ֙ אֶעֱשֶׂ֣ה נִפְלָאֹ֔ת אֲשֶׁ֛ר לֹֽא נִבְרְא֥וּ בְ/כָל הָ/אָ֖רֶץ וּ/בְ/כָל הַ/גּוֹיִ֑ם וְ/רָאָ֣ה כָל הָ֠/עָם אֲשֶׁר אַתָּ֨ה בְ/קִרְבּ֜/וֹ אֶת מַעֲשֵׂ֤ה יְהוָה֙ כִּֽי נוֹרָ֣א ה֔וּא אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֥ה עִמָּֽ/ךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/010.yaml
  text: And he said, “Look, I am making a covenant. Before all your people I will do wonders such as have not been created in all the earth or among any of the nations. And all the people in whose midst you are will see the work of the LORD, for what I am doing with you is awe-inspiring.”
translation:
  language: de
  text: 'Und er sagte: »Siehe, ich schließe einen Bund. Vor deinem ganzen Volk werde ich Wundertaten vollbringen, wie sie auf der ganzen Erde[a] und unter allen Völkern noch nie geschaffen worden sind. Das ganze Volk, in dessen Mitte du bist, wird das Werk des HERRN sehen; denn ehrfurchtgebietend ist, was ich mit dir tue.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: im ganzen Land.'
    reason: אֶרֶץ kann je nach Zusammenhang »Erde« oder »Land« bedeuten; beide Lesarten sind sprachlich möglich.
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt das aufmerksamkeitslenkende Signal des Hebräischen in einer würdigen, biblisch vertrauten Form.
- source_word: כֹּרֵת בְּרִית
  choice: ich schließe einen Bund
  rationale: Die deutsche feste Wendung gibt das hebräische Idiom wörtlich im Sinn wieder.
- source_word: נִפְלָאֹת
  choice: Wundertaten
  rationale: Bezeichnet außergewöhnliche göttliche Taten und klingt natürlicher als das abstraktere »Wunder« in Verbindung mit »vollbringen«.
- source_word: לֹא נִבְרְאוּ
  choice: noch nie geschaffen worden sind
  rationale: Erhält bewusst das Verb ברא, statt es zu »geschehen« oder »vollbracht werden« abzuschwächen.
- source_word: נוֹרָא
  choice: Ehrfurcht gebietend
  rationale: Gibt die Spannung von Furcht, Staunen und überwältigender Größe wieder, ohne sie nur als »schrecklich« oder bloß »beeindruckend« festzulegen.
- source_word: עֹשֶׂה עִמָּךְ
  choice: was ich mit dir tue
  rationale: Bewahrt die direkte, offene Beziehungsaussage des Hebräischen; eine genauere Bestimmung als »an dir« oder »durch dich« wäre interpretierend.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Folgt der etablierten deutschen Bibelkonvention, ohne dem Text einen konfessionellen Sondergebrauch aufzuerlegen.
- issue: Charakterisierung des göttlichen Werkes durch נורא
  choice: Ehrfurcht gebietend
  alternative: furchtbar / erschreckend / beeindruckend
  rationale: Bewahrt sowohl die ehrfürchtige als auch die furchteinflößende Dimension des Ausdrucks.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit mäßig formaler Satzführung. »Siehe« und »Ehrfurcht gebietend« bewahren den feierlichen Ton, während die übrige Formulierung für heutige Leser unmittelbar verständlich bleibt.
