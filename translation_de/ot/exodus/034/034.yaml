revisions:
- from: Doch immer wenn Mose hineinging, um vor Jahwe mit ihm zu reden, nahm er den Schleier ab, bis er wieder herauskam. Dann ging er hinaus und teilte den Israeliten mit, was ihm aufgetragen worden war.
  to: Doch immer wenn Mose hineinging, um vor Jahwe mit ihm zu reden, nahm er den Schleier ab, bis er herauskam. Wenn er dann herauskam, sagte er den Israeliten, was ihm aufgetragen worden war.
  rationale: Die Revision erhält die iterative Aussage und die Reihenfolge des hebräischen Satzes, glättet aber die im Deutschen missverständliche Wiederholung des Herausgehens. „Sagte“ folgt dem Sprechverb des Ausgangstextes unmittelbarer als „teilte ... mit“.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:45:22Z'
review_pass:
  verdict: revise
  source_fidelity: Der wiederkehrende Handlungsablauf, der Gottesname, der Schleier und der passive Bezug von „was ihm aufgetragen worden war“ sind zutreffend wiedergegeben. „teilte ... mit“ ist jedoch gegenüber וְדִבֶּר („er redete/sagte“) etwas stärker als bloße Informationsweitergabe formuliert. Zudem sollte die zweimalige Nennung des Herausgehens im Hebräischen im Deutschen als zeitlicher Ablauf formuliert werden, nicht als scheinbar doppelte Bewegung.
  naturalness: Der Entwurf ist insgesamt modernes, gut verständliches Standarddeutsch. Die Abfolge „bis er wieder herauskam. Dann ging er hinaus“ wirkt allerdings redundant, weil das Herauskommen und Hinausgehen im Deutschen nahezu dasselbe Ereignis bezeichnen.
  terminology: „Jahwe“ gibt יהוה angemessen als Eigenname wieder. „Schleier“ ist für מַסְוֶה passend. „Israeliten“ ist eine natürliche Wiedergabe der festen Gemeinschaftsbezeichnung בְּנֵי יִשְׂרָאֵל und muss hier nicht durch die formalere Wendung „Söhne Israels“ ersetzt werden.
  issues:
  - severity: low
    issue: Doppelte Darstellung des Herausgehens
    rationale: „bis er wieder herauskam. Dann ging er hinaus“ lässt in modernem Deutsch zwei getrennte Ausgänge vermuten. Das Hebräische beschreibt den gewohnheitsmäßigen Ablauf; eine Zeitkonstruktion mit „wenn er herauskam“ bildet ihn idiomatisch ab.
  - severity: low
    issue: „teilte ... mit“ statt eines Sprechverbs
    rationale: וְדִבֶּר bezeichnet hier ausdrücklich Moses’ Reden zu Israel. „Sagte“ bewahrt dies unmittelbarer und vermeidet die leichte Zusatznuance einer bloßen Mitteilung.
  revised_text: Doch immer wenn Mose hineinging, um vor Jahwe mit ihm zu reden, nahm er den Schleier ab, bis er herauskam. Wenn er dann herauskam, sagte er den Israeliten, was ihm aufgetragen worden war.
