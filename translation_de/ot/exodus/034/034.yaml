  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה לִ/פְנֵ֤י יְהוָה֙ לְ/דַבֵּ֣ר אִתּ֔/וֹ יָסִ֥יר אֶת הַ/מַּסְוֶ֖ה עַד צֵאת֑/וֹ וְ/יָצָ֗א וְ/דִבֶּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת אֲשֶׁ֥ר יְצֻוֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/034.yaml
  text: But whenever Moses went in before Yahweh to speak with him[a], he would remove the veil until he came out; then he would come out and speak to the sons of Israel what he had been commanded.
translation:
  language: de
  text: Doch immer wenn Mose hineinging, um vor Jahwe mit ihm zu reden, nahm er den Schleier ab, bis er herauskam. Wenn er dann herauskam, sagte er den Israeliten, was ihm aufgetragen worden war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְבֹא
  choice: Doch immer wenn … hineinging
  rationale: Die Verbindung aus ו, ב und Infinitiv bezeichnet hier einen wiederkehrenden Vorgang. „Immer wenn“ gibt diesen iterativen Sinn wieder; „doch“ nimmt den leichten Gegensatz zum vorherigen Vers auf.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet „vor/in der Gegenwart von“. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, der im Deutschen üblichen Form des Namens.
- source_word: לְדַבֵּר אִתּוֹ
  choice: um … mit ihm zu reden
  rationale: Der Infinitiv bezeichnet den Zweck des Hineingehens. דבר mit אֵת bezeichnet hier am natürlichsten ein Reden „mit“ jemandem; das Pronomen bezieht sich im Kontext auf Jahwe.
- source_word: יָסִיר אֶת־הַמַּסְוֶה
  choice: nahm er den Schleier ab
  rationale: Das Imperfekt beschreibt im wiederkehrenden Handlungsrahmen Moses’ regelmäßiges Verhalten. מַסְוֶה ist die Bedeckung seines Gesichts und wird treffend mit „Schleier“ wiedergegeben.
- source_word: עַד־צֵאתוֹ
  choice: bis er wieder herauskam
  rationale: Die Konstruktion bezeichnet die Dauer bis zu Moses’ Herausgehen. „Wieder“ verdeutlicht im Deutschen die Rückkehr aus dem zuvor betretenen Bereich, ohne den Sinn zu verändern.
- source_word: אֶל־בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Wörtlich steht „zu den Söhnen Israels“, eine feste hebräische Bezeichnung für die Angehörigen Israels als Gemeinschaft. „Den Israeliten“ gibt die gemeinte Bezugsgruppe in natürlichem modernem Deutsch wieder.
- source_word: אֵת אֲשֶׁר יְצֻוֶּה
  choice: was ihm aufgetragen worden war
  rationale: Die passive Verbform bezeichnet das, was Mose zuvor aufgetragen worden war und anschließend weitergab. Das Plusquamperfekt macht diese zeitliche Abfolge im Deutschen deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Namen und entspricht der im Deutschen geläufigen wissenschaftlichen Transkription.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die wörtliche Form ist grammatisch maskulin, fungiert hier aber als feste Bezeichnung der israelitischen Gemeinschaft. „Israeliten“ ist im modernen Deutsch natürlich und vermeidet den möglichen Fehlschluss, nur leibliche Söhne oder ausschließlich Männer seien gemeint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der wiederkehrende Ablauf wird klar ausgedrückt, ohne die hebräische Satzfolge unnötig steif nachzubilden. Die Pronomenbeziehung auf Jahwe bleibt entsprechend dem Ausgangstext erhalten.
