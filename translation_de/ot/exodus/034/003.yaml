source:
  edition: WLC
  text: וְ/אִישׁ֙ לֹֽא יַעֲלֶ֣ה עִמָּ֔/ךְ וְ/גַם אִ֥ישׁ אַל יֵרָ֖א בְּ/כָל הָ/הָ֑ר גַּם הַ/צֹּ֤אן וְ/הַ/בָּקָר֙ אַל יִרְע֔וּ אֶל מ֖וּל הָ/הָ֥ר הַ/הֽוּא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/003.yaml
  text: And no man shall go up with you[a], and indeed no man shall be seen anywhere on the mountain[b]; even the flock and the herd must not graze in front of that mountain.
translation:
  language: de
  text: Kein Mensch[a] soll mit dir hinaufsteigen, und auf dem ganzen Berg darf auch kein Mensch zu sehen sein[b]. Selbst das Kleinvieh und die Rinder dürfen vor jenem Berg nicht weiden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ist grammatisch maskulin, bezeichnet hier aber allgemein jeden Menschen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „darf sich kein Mensch zeigen“. Die hebräische Verbform kann sowohl „gesehen werden“ als auch „erscheinen/sich zeigen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Mensch
  rationale: Das grammatisch maskuline Singularwort bezeichnet hier allgemein eine einzelne menschliche Person. „Mensch“ bewahrt diesen individuellen und zugleich generischen Sinn im natürlichen Deutschen.
- source_word: יַעֲלֶה עִמָּךְ
  choice: soll mit dir hinaufsteigen
  rationale: עלה bezeichnet den Aufstieg auf den Berg; „mit dir hinaufsteigen“ gibt Richtung und Begleitung klar wieder.
- source_word: וְגַם
  choice: und … auch
  rationale: Die Verbindung führt die zweite, verschärfende Untersagung weiter und hebt sie durch „auch“ hervor.
- source_word: אַל יֵרָא
  choice: darf … nicht zu sehen sein
  rationale: Der Nifal von ראה kann passiv „gesehen werden/zu sehen sein“ oder reflexiv „sich zeigen/erscheinen“ bedeuten. Die Hauptfassung wahrt den passiven Sinn, während die Alternative in einer Fußnote genannt wird.
- source_word: בְּכָל הָהָר
  choice: auf dem ganzen Berg
  rationale: Die Wendung umfasst das gesamte Berggebiet und wird im Deutschen direkt und idiomatisch wiedergegeben.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: das Kleinvieh und die Rinder
  rationale: צאן umfasst kleine Herdentiere, besonders Schafe und Ziegen, während בקר das Großvieh beziehungsweise die Rinder bezeichnet. „Kleinvieh und Rinder“ erhält die beiden Tierklassen.
- source_word: אַל יִרְעוּ
  choice: dürfen … nicht weiden
  rationale: רעה bezeichnet bei Herdentieren das Grasen beziehungsweise Weiden; die Formulierung gibt das Verbot in heutigem Deutsch wieder.
- source_word: אֶל מוּל
  choice: vor
  rationale: Die räumliche Wendung bezeichnet den Bereich gegenüber oder vor dem Berg. „Vor“ ist hier knapp und natürlich.
- source_word: הָהָר הַהוּא
  choice: jenem Berg
  rationale: „Jenem“ gibt die bestimmende und distanzierende Kraft des hebräischen Demonstrativs wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Verbote werden mit „soll“ beziehungsweise „darf nicht“ klar und natürlich formuliert; die Wiederholung von „Mensch“ folgt der Wiederholung im Hebräischen. „Selbst“ hebt das anschließende Verbot für die Tiere idiomatisch hervor.
