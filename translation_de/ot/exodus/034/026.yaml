  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/026.yaml
  text: You shall bring the first of the firstfruits of your ground to the house of Yahweh your God[a]. You shall not boil a young goat in its mother's milk.
translation:
  language: de
  text: Das Erste von den Erstlingsfrüchten deines Ackerbodens[a] sollst du in das Haus Jahwes, deines Gottes, bringen. Du sollst ein Ziegenjunges nicht in der Milch seiner Mutter kochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Beste von den Erstlingsfrüchten deines Ackerbodens.“'
    reason: רֵאשִׁית kann neben dem ersten oder vorrangigen Anteil auch den besten beziehungsweise erlesensten Anteil bezeichnen.
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: das Erste von den Erstlingsfrüchten
  rationale: Die bewusst ungewöhnliche Verbindung bewahrt die Aussage des Hebräischen, dass der erste beziehungsweise vorrangige Teil der Erstlingserträge gebracht werden soll, ohne die mögliche Qualitätsbedeutung vorschnell mit „das Beste“ festzulegen.
- source_word: אַדְמָתְךָ
  choice: deines Ackerbodens
  rationale: אֲדָמָה bezeichnet hier den bewirtschafteten Boden, dessen Ertrag dargebracht wird. „Ackerboden“ macht den landwirtschaftlichen Zusammenhang deutlich.
- source_word: תָּבִיא
  choice: sollst du … bringen
  rationale: Das Hifil-Imperfekt hat in diesem Rechtstext gebietenden Sinn. Die deutsche Soll-Form gibt den verbindlichen Rechtsstil natürlich wieder.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: in das Haus Jahwes, deines Gottes
  rationale: בֵּית wird als „Haus“ wiedergegeben, da „Tempel“ für den Zusammenhang des Exodus zu eng und historisch zu spezifisch wäre. Das Ziel wird im Deutschen idiomatisch mit „in das Haus“ bezeichnet.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֹא תְבַשֵּׁל
  choice: du sollst … nicht … kochen
  rationale: בשל bezeichnet das Kochen beziehungsweise Sieden. „Kochen“ ist im Deutschen natürlich und lässt die genaue Zubereitungsweise ebenso offen wie das Verb im gegebenen Zusammenhang.
- source_word: גְּדִי
  choice: ein Ziegenjunges
  rationale: Die Wiedergabe bezeichnet klar ein junges Tier der Ziege und vermeidet mögliche Missverständnisse des Wortes „Zicklein“.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: in der Milch seiner Mutter
  rationale: Die Formulierung folgt dem konkreten Bild des hebräischen Textes und ist zugleich idiomatisches Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton als persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Eigennamecharakter, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Bedeutung von רֵאשִׁית in der Verbindung רֵאשִׁית בִּכּוּרֵי
  choice: das Erste von den Erstlingsfrüchten
  alternative: das Beste von den Erstlingsfrüchten
  rationale: רֵאשִׁית kann Vorrang und in manchen Zusammenhängen auch besondere Qualität bezeichnen. Die Hauptfassung erhält hier die zeitliche beziehungsweise anteilige Grundbedeutung und kennzeichnet die Qualitätsdeutung in der Fußnote als Möglichkeit.
translation_notes:
  register: Moderner, würdevoller Rechtssatz mit verständlicher Soll-Form. „Erstlingsfrüchte“ erhält den kultischen Fachbegriff; die ungewöhnliche Doppelung mit „das Erste“ spiegelt bewusst die hebräische Verbindung. Der Gottesname erscheint in der im Deutschen üblichen Form „Jahwe“.
