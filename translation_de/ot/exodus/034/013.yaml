id: EXO.34.13
reference: Exodus 34:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י אֶת מִזְבְּחֹתָ/ם֙ תִּתֹּצ֔וּ/ן וְ/אֶת מַצֵּבֹתָ֖/ם תְּשַׁבֵּר֑וּ/ן וְ/אֶת אֲשֵׁרָ֖י/ו תִּכְרֹתֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/013.yaml
  text: Instead[a], you shall tear down their altars, shatter their pillars[b], and cut down their Asherah poles.
translation:
  language: de
  text: Vielmehr sollt ihr ihre Altäre niederreißen, ihre Steinmale[a] zertrümmern und ihre Aschera-Pfähle[b] umhauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Kultsteine“ beziehungsweise „ihre heiligen Säulen“. Gemeint sind aufgerichtete Steine mit kultischer Funktion.'
    reason: alternative_reading
  - marker: b
    text: Hebräisch kann auch formaler mit „ihre Ascheren“ wiedergegeben werden. Gemeint sind Kultgegenstände, die mit der Göttin Aschera verbunden waren.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Vielmehr
  rationale: Die Konjunktion kann häufig „denn“ bedeuten, führt hier aber im Zusammenhang die gebotene Gegenhandlung zum vorher untersagten Bundesschluss ein. „Vielmehr“ gibt diesen Kontrast natürlich wieder.
- source_word: מִזְבְּחֹתָם
  choice: ihre Altäre
  rationale: Bewahrt die kultische Bedeutung sowie Plural und Possessivsuffix.
- source_word: תִּתֹּצוּן
  choice: niederreißen
  rationale: נתץ bezeichnet das Einreißen oder Zerstören von Bauwerken und passt idiomatisch zu Altären.
- source_word: מַצֵּבֹתָם
  choice: ihre Steinmale
  rationale: מַצֵּבָה bezeichnet aufgerichtete Steine beziehungsweise kultische Steinmale. „Steinmale“ ist verständlich und macht das Material deutlicher als das mehrdeutige „Säulen“.
- source_word: תְּשַׁבֵּרוּן
  choice: zertrümmern
  rationale: Die Piel-Form bezeichnet ein entschiedenes Zerschlagen; „zertrümmern“ bewahrt die Nachdrücklichkeit.
- source_word: אֲשֵׁרָיו
  choice: ihre Aschera-Pfähle
  rationale: Der Plural bezeichnet hier wahrscheinlich hölzerne Kultgegenstände, die mit Aschera verbunden waren. Die Wiedergabe wahrt sowohl den Eigennamen als auch den gegenständlichen Bezug.
- source_word: תִּכְרֹתוּן
  choice: umhauen
  rationale: כרת bedeutet abschneiden oder fällen; bei wahrscheinlich hölzernen Kultgegenständen ist „umhauen“ anschaulich und idiomatisch.
theological_decisions:
- issue: Bezug von אֲשֵׁרָיו
  choice: Kultgegenstände, die mit Aschera verbunden waren, wiedergegeben als „Aschera-Pfähle“
  alternative: Formaler „Ascheren“ oder allgemeiner „Aschera-Kultbilder“
  rationale: Die Reihe nennt zerstörbare Kultgegenstände, und das Verb „umhauen“ legt hölzerne Objekte nahe. „Aschera-Pfähle“ verdeutlicht den wahrscheinlichen Gegenstand, ohne die Verbindung zur Gottheit Aschera zu beseitigen.
- issue: Funktion von כִּי
  choice: 'kontrastive Fortführung: „Vielmehr“'
  alternative: 'kausal: „Denn“'
  rationale: Beides ist sprachlich möglich. Im unmittelbaren Zusammenhang steht jedoch die positive Gegenhandlung im Gegensatz zum zuvor verbotenen Verhalten, weshalb die kontrastive Wiedergabe im Deutschen natürlicher ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Gebotsstil. Die parallelen Verben bilden die nachdrückliche Struktur des Hebräischen ab; „sollt ihr“ gibt die verpflichtende Funktion der Präfixformen wieder.
