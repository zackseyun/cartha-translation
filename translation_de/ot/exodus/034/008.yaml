  source_fidelity: 'Die Übersetzung gibt die Abfolge der hebräischen Erzählung zuverlässig wieder: Mose handelt unverzüglich, verneigt sich zur Erde und vollzieht einen Akt der Anbetung. »bis zur Erde« gibt die Richtungsangabe אַרְצָה angemessen wieder; »betete an« ist im Kontext eine sachgerechte Wiedergabe von וַיִּשְׁתָּחוּ, ohne die vorangehende körperliche Verneigung aufzuheben.'
