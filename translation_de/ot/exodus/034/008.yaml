  text: וַ/יְמַהֵ֖ר מֹשֶׁ֑ה וַ/יִּקֹּ֥ד אַ֖רְצָ/ה וַ/יִּשְׁתָּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/008.yaml
  text: Moses quickly bowed down to the ground and worshiped[a][b].
translation:
  language: de
  text: Da verneigte sich Mose schnell bis zur Erde und betete an.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »beeilte sich«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »warf sich nieder«; das hebräische Verb kann ein Niederwerfen in Anbetung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: schnell
  rationale: Das Verb מהר bezeichnet eiliges, unverzügliches Handeln. Die adverbiale Wiedergabe »schnell« ist im Deutschen natürlich und hebt Moses unmittelbare Reaktion hervor.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Im modernen Standarddeutsch übliche Form des Personennamens.
- source_word: וַיִּקֹּד
  choice: verneigte sich
  rationale: קדד bezeichnet ein Sichbeugen oder tiefes Verneigen. Die Formulierung bewahrt die körperliche Geste und unterscheidet sie vom folgenden Akt der Anbetung.
- source_word: אַרְצָה
  choice: bis zur Erde
  rationale: Die Richtungsform von אֶרֶץ zeigt eine Bewegung zur Erde beziehungsweise zum Boden hin an. »Bis zur Erde« vermittelt hier die tiefe Körperhaltung idiomatisch.
- source_word: וַיִּשְׁתָּחוּ
  choice: betete an
  rationale: Die Verbform von שׁחה kann das Niederwerfen als Ausdruck von Verehrung oder Anbetung bezeichnen. Da der vorherige Satzteil bereits das körperliche Verneigen nennt, bringt »betete an« die kultisch-religiöse Bedeutung zur Geltung, ohne beide Handlungen gleichzusetzen.
theological_decisions:
- issue: Ob das letzte Verb als rein körperliches Niederwerfen oder als Anbetung wiederzugeben ist
  choice: betete an
  alternative: warf sich nieder; verneigte sich
  rationale: Mose reagiert auf die Selbstoffenbarung des HERRN ehrfürchtig. Das hebräische Verb kann die körperliche Prostration bezeichnen, trägt hier aber im Kontext die Bedeutung einer anbetenden Reaktion. Weil das vorausgehende Verb die körperliche Verneigung bereits ausdrückt, wahrt »betete an« sowohl die Abfolge als auch die theologische Aussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Da« führt die unmittelbare Reaktion erzählerisch fort; »verneigte sich … bis zur Erde« beschreibt die körperliche Geste, während »betete an« deren religiöse Bedeutung ausdrückt. Die Fußnoten erhalten die lexikalische Spannweite des Hebräischen.
