  variant: modern standard German
source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ לּ/וֹ֙ מִכְבָּ֔ר מַעֲשֵׂ֖ה רֶ֣שֶׁת נְחֹ֑שֶׁת וְ/עָשִׂ֣יתָ עַל הָ/רֶ֗שֶׁת אַרְבַּע֙ טַבְּעֹ֣ת נְחֹ֔שֶׁת עַ֖ל אַרְבַּ֥ע קְצוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/004.yaml
  text: You shall make for it a grating[a], a network of bronze[b], and on the network you shall make four bronze rings at its four corners.
translation:
  language: de
  text: Fertige dafür ein Gitter an, ein Netz aus Bronze[a]. An dem Netz sollst du vier bronzene Ringe an seinen vier Ecken[b] anbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »ein Gitter, Netzarbeit aus Bronze«; auch möglich: »ein Gitter aus bronzenem Netzgeflecht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »an seinen vier Enden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְבָּר
  choice: Gitter
  rationale: Das Wort bezeichnet hier eine gitterartige Vorrichtung am Altar; »Gitter« ist im modernen Deutschen klar und sachgerecht.
- source_word: מַעֲשֵׂה רֶשֶׁת
  choice: ein Netz
  rationale: Die Wendung bedeutet wörtlich etwa »Arbeit eines Netzes«. Die appositionelle Wiedergabe bewahrt sowohl das Bild als auch die Verbindung zum folgenden הָרֶשֶׁת.
- source_word: נְחֹשֶׁת
  choice: Bronze / bronzen
  rationale: Im Zusammenhang der Heiligtumsausstattung ist »Bronze« die übliche und kontextuell passende Wiedergabe; das hebräische Wort kann allgemein auch Kupfer beziehungsweise eine Kupferlegierung bezeichnen.
- source_word: עַל הָרֶשֶׁת
  choice: an dem Netz
  rationale: עַל kann je nach räumlicher Anordnung »auf« oder »an« bedeuten. Bei den als Befestigungspunkten dienenden Ringen ist »an dem Netz« im Deutschen natürlich.
- source_word: טַבְּעֹת
  choice: Ringe
  rationale: Das Substantiv bezeichnet regelmäßig Ringe als Befestigungs- oder Tragevorrichtungen.
- source_word: קְצוֹתָיו
  choice: seinen vier Ecken
  rationale: Das Wort bezeichnet die äußersten Punkte oder Enden. Bei einem viereckigen Gitter ist »Ecken« die anschaulichste deutsche Wiedergabe, während »Enden« als Alternative möglich bleibt.
- source_word: לּוֹ
  choice: dafür
  rationale: Das Pronomen bezieht sich auf den Altar; »dafür« ist idiomatisch und vermeidet im Deutschen ein schwerfälliges »für ihn« bei einem Gegenstand.
- source_word: וְעָשִׂיתָ
  choice: Fertige … an / sollst du … anbringen
  rationale: Die aufeinanderfolgenden Verbformen führen die göttliche Bauanweisung fort. Imperativ und Soll-Form geben den verbindlichen Anweisungscharakter in natürlichem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Apposition »ein Netz aus Bronze« erhält die doppelte hebräische Bezeichnung als Gitter und Netz, ohne eine unnatürliche deutsche Nominalkonstruktion zu erzwingen.
