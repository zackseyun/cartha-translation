  text: וַ/חֲמֵ֨שׁ עֶשְׂרֵ֥ה אַמָּ֛ה קְלָעִ֖ים לַ/כָּתֵ֑ף עַמֻּדֵי/הֶ֣ם שְׁלֹשָׁ֔ה וְ/אַדְנֵי/הֶ֖ם שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/014.yaml
  text: Fifteen cubits of hangings for the shoulder[a], with their three pillars and their three bases.
translation:
  language: de
  text: 'Für die eine Seite: fünfzehn Ellen Behänge mit ihren drei Säulen und ihren drei Sockeln.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: fünfzehn Ellen lang
  rationale: Die Maßangabe bezeichnet die Länge; »lang« macht die im Hebräischen knappe Konstruktion im Deutschen natürlich verständlich.
- source_word: קְלָעִים
  choice: Behänge
  rationale: Im Zusammenhang des Vorhofs sind damit die Stoffbahnen der Umfriedung gemeint. »Behänge« ist sachgerecht und passt zum würdigen Bauregister.
- source_word: לַכָּתֵף
  choice: auf der einen Seite
  rationale: כָּתֵף bedeutet wörtlich »Schulter«, bezeichnet hier aber die seitliche Partie neben dem Eingang. Die kontextuelle Wiedergabe vermeidet im Deutschen ein missverständliches Körperbild.
- source_word: עַמֻּדֵיהֶם
  choice: ihre drei Säulen
  rationale: עַמּוּד bezeichnet eine Säule oder einen Pfosten; »Säulen« entspricht der üblichen Terminologie für den Vorhof.
- source_word: אַדְנֵיהֶם
  choice: deren drei Sockel
  rationale: אֶדֶן bezeichnet hier die tragenden, sockelartigen Aufnahmen der Säulen. »Sockel« ist präzise und in modernem Deutsch anschaulich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der elliptische hebräische Nominalsatz wird als Bauanweisung mit »sollen … sein« wiedergegeben. Das wechselnde Pronomen »ihren … deren« verdeutlicht, dass die Säulen zur Seitenpartie gehören und die Sockel die Säulen tragen, ohne den Sachgehalt zu erweitern.
