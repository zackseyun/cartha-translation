  yaml_path: translation/ot/exodus/027/012.yaml
  text: And for the width of the court on the west side[a], there shall be hangings of fifty cubits[b], with ten pillars and ten bases.
translation:
  language: de
  text: Für die Breite des Vorhofs an der Westseite[a] sollen die Behänge fünfzig Ellen lang sein, mit ihren zehn Säulen und ihren zehn Sockeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „an der Meerseite“; dies ist die übliche hebräische Bezeichnung für die Westseite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרֹחַב הֶחָצֵר
  choice: Für die Breite des Vorhofs
  rationale: רֹחַב bezeichnet die Breite; חָצֵר ist hier der eingefriedete Vorhof des Heiligtums. Die Formulierung wahrt den anschließenden, spezifizierenden Charakter der hebräischen Nominalkonstruktion.
- source_word: לִפְאַת יָם
  choice: an der Westseite
  rationale: פֵאָה bezeichnet Seite oder Rand. יָם bedeutet wörtlich „Meer“, dient hier aber als übliche Richtungsangabe für Westen.
- source_word: קְלָעִים
  choice: Behänge
  rationale: Das Wort bezeichnet die Stoffbahnen, die den Vorhof umschließen. „Behänge“ gibt ihre bauliche Funktion wieder, ohne eine moderne Vorhangform vorauszusetzen.
- source_word: חֲמִשִּׁים אַמָּה
  choice: fünfzig Ellen lang
  rationale: Die Maßangabe bezieht sich im Zusammenhang auf die Ausdehnung der Behänge. „lang“ wird zur natürlichen deutschen Verständlichkeit ergänzt.
- source_word: עַמֻּדֵיהֶם עֲשָׂרָה
  choice: mit ihren zehn Säulen
  rationale: עַמּוּד bedeutet „Säule“ oder „Pfosten“. Das Possessivsuffix wird mit „ihren“ ausdrücklich bewahrt, während die Zahl in natürliche deutsche Wortstellung gebracht wird.
- source_word: וְאַדְנֵיהֶם עֲשָׂרָה
  choice: und ihren zehn Sockeln
  rationale: אֶדֶן bezeichnet in den Heiligtumsanweisungen den tragenden Sockel beziehungsweise die Halterung einer Säule. „Sockel“ ist im Deutschen anschaulich und architektonisch passend; das Possessivsuffix bleibt erhalten.
theological_decisions: []
