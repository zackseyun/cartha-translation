source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ אֶת הַ/מִּזְבֵּ֖חַ עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אֹ֜רֶךְ וְ/חָמֵ֧שׁ אַמּ֣וֹת רֹ֗חַב רָב֤וּעַ יִהְיֶה֙ הַ/מִּזְבֵּ֔חַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/001.yaml
  text: You shall make the altar of acacia wood[a], five cubits long and five cubits wide; the altar shall be square, and its height shall be three cubits.
translation:
  language: de
  text: 'Du sollst den Altar aus Akazienholz machen: fünf Ellen lang und fünf Ellen breit. Der Altar soll quadratisch sein und drei Ellen hoch.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst … machen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im Zusammenhang der Bauanweisungen auffordernde Bedeutung. „Du sollst“ gibt den verbindlichen Auftrag natürlich und würdig wieder.
- source_word: הַמִּזְבֵּחַ
  choice: den Altar
  rationale: מִזְבֵּחַ bezeichnet hier den in den Anweisungen für das Heiligtum beschriebenen Opferaltar; der bestimmte Artikel wird bewahrt.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: Die Konstruktverbindung bezeichnet das Baumaterial. „Akazienholz“ ist die geläufige und verständliche deutsche Wiedergabe.
- source_word: חָמֵשׁ אַמּוֹת אֹרֶךְ
  choice: fünf Ellen lang
  rationale: Die hebräische Maßangabe wird als natürliche deutsche Dimensionsangabe wiedergegeben.
- source_word: וְחָמֵשׁ אַמּוֹת רֹחַב
  choice: und fünf Ellen breit
  rationale: Die parallele Maßangabe wird knapp und idiomatisch wiedergegeben.
- source_word: רָבוּעַ יִהְיֶה
  choice: soll quadratisch sein
  rationale: רָבוּעַ bezeichnet eine vierseitige Form mit gleicher Länge und Breite; „quadratisch“ ist im heutigen Deutsch präzise und verständlich.
- source_word: וְשָׁלֹשׁ אַמּוֹת קֹמָתוֹ
  choice: und drei Ellen hoch
  rationale: Die Aussage über die Höhe wird im Deutschen idiomatisch formuliert; das Bezugswort „Altar“ macht die im Hebräischen durch das Suffix ausgedrückte Zugehörigkeit eindeutig.
