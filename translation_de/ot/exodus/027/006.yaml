  text: וְ/עָשִׂ֤יתָ בַדִּים֙ לַ/מִּזְבֵּ֔חַ בַּדֵּ֖י עֲצֵ֣י שִׁטִּ֑ים וְ/צִפִּיתָ֥ אֹתָ֖/ם נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/006.yaml
  text: You shall make poles for the altar[a], poles of acacia wood, and you shall overlay them with bronze.
translation:
  language: de
  text: Du sollst Stangen aus Akazienholz für den Altar anfertigen und sie mit Bronze[a] überziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Kupfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst … anfertigen
  rationale: Das Qal Perfekt 2. Person Singular mit vorangestelltem וְ hat in diesem Anweisungszusammenhang gebietende Kraft. „Du sollst … anfertigen“ gibt die verbindliche Anweisung in natürlichem Deutsch wieder.
- source_word: בַדִּים / בַּדֵּי
  choice: Stangen
  rationale: Das Substantiv bezeichnet die zum Tragen der Heiligtumsgeräte bestimmten Stangen. „Stangen“ ist klar und bewahrt die im Hebräischen vorhandene Wiederholung.
- source_word: לַמִּזְבֵּחַ
  choice: für den Altar
  rationale: Die Formulierung entspricht dem Wortlaut, ohne die aus dem Zusammenhang bekannte nähere Bestimmung des Altars ausdrücklich einzufügen.
- source_word: עֲצֵי שִׁטִּים
  choice: Akazienholz
  rationale: Die deutsche Materialbezeichnung ist natürlich und gibt die wahrscheinliche botanische Zuordnung wieder.
- source_word: וְצִפִּיתָ
  choice: und … überziehen
  rationale: Das Piel von צפה bezeichnet bei den Geräten des Heiligtums das Überziehen mit Metall. „Überziehen“ bewahrt diesen handwerklichen Sinn, ohne ein bestimmtes modernes Verfahren vorauszusetzen.
- source_word: אֹתָם
  choice: sie
  rationale: Das Pronomen bezieht sich auf die Stangen und wird im Deutschen ausdrücklich wiedergegeben.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: „Bronze“ ist für נְחֹשֶׁת bei den Einrichtungsgegenständen des Heiligtums die geläufige Wiedergabe; da das Wort auch Kupfer bezeichnen kann, wird diese Möglichkeit in einer Fußnote erhalten.
