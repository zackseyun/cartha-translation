base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/021.yaml
  text: In the tent of meeting[a], outside the veil that is before the testimony, Aaron and his sons shall arrange it before Yahweh from evening until morning[c][b]. It shall be a perpetual statute throughout their generations from the Israelites.
translation:
  language: de
  text: Im Zelt der Begegnung, außerhalb des Vorhangs, der vor dem Zeugnis ist, soll Aaron es zusammen mit seinen Söhnen vom Abend bis zum Morgen vor Jahwe herrichten.[a] Dies soll eine dauerhafte Ordnung sein, vonseiten der Israeliten für alle ihre Generationen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Ordnung halten“ oder „zurechtmachen“. Das hebräische Verb kann das Anordnen oder die geordnete Pflege bezeichnen. Das maskuline „es“ bezieht sich im Zusammenhang wahrscheinlich auf das in Vers 20 genannte Öl.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Zeugnis“ sind wahrscheinlich die in der Bundeslade verwahrten Tafeln gemeint; der Vorhang befand sich vor der Lade. „Vonseiten der Israeliten“ gibt die hebräische Präposition wörtlicher wieder und kann ihre Verpflichtung oder ihren zu leistenden Beitrag hervorheben.
    reason: source_ambiguity
lexical_decisions:
- source_word: בְּאֹהֶל מוֹעֵד
  choice: im Zelt der Begegnung
  rationale: Die gebräuchliche und verständliche Wiedergabe der kultischen Bezeichnung; מוֹעֵד bezeichnet hier den Ort der Begegnung mit Gott.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: außerhalb des Vorhangs
  rationale: פָּרֹכֶת bezeichnet den inneren Vorhang, der das Heiligtum vom Allerheiligsten trennt. „Vorhang“ ist im heutigen Deutsch klar und wahrt den räumlichen Sinn.
- source_word: אֲשֶׁר עַל הָעֵדֻת
  choice: der vor dem Zeugnis ist
  rationale: עַל kann räumlich „über“, „bei“ oder im Verhältnis zu etwas „vor“ bezeichnen. Da der Vorhang vor der Lade mit dem Zeugnis hing, gibt „vor“ die räumliche Beziehung natürlich wieder, ohne „Zeugnis“ erklärend in den Haupttext aufzulösen.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: sollen … sie … herrichten
  rationale: ערך bedeutet „ordnen“, „herrichten“ oder „in Ordnung bringen“. Das feminine Pronomen „sie“ nimmt im Deutschen die im vorigen Vers genannte Lampe auf; der hebräische Rückverweis steht entsprechend dem dortigen grammatischen Geschlecht im Maskulinum Singular.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: vom Abend bis zum Morgen
  rationale: Direkte und idiomatische Wiedergabe des Zeitraums, in dem die Lampe versorgt werden soll.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: „Vor“ bewahrt die kultische Wendung לִפְנֵי; „Jahwe“ gibt den im Ausgangstext ausdrücklich stehenden Gottesnamen wieder.
- source_word: חֻקַּת עוֹלָם
  choice: eine bleibende Bestimmung
  rationale: Die Formulierung bezeichnet eine dauerhaft geltende kultische Ordnung. „Bleibend“ wahrt diese Dauer, ohne dem Idiom unnötig eine philosophische Aussage über absolute Zeitlosigkeit aufzuerlegen.
- source_word: לְדֹרֹתָם
  choice: über alle ihre Generationen hinweg
  rationale: Natürliche deutsche Wiedergabe der wiederkehrenden Bundesformel und ihres generationenübergreifenden Geltungsanspruchs.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: für die Israeliten
  rationale: Im Zusammenhang bezeichnet מֵאֵת die den Israeliten obliegende Ordnung beziehungsweise ihren Beitrag. Die Haupttextfassung ist idiomatisch; die formalere Möglichkeit „vonseiten der Israeliten“ wird in einer Fußnote festgehalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ wahrt ihn als Namen und ist die im Deutschen etablierte Form der wissenschaftlich üblichen Vokalisierung.
- issue: Bedeutungsumfang von חֻקַּת עוֹלָם
  choice: bleibende Bestimmung
  alternative: ewige Bestimmung
  rationale: עוֹלָם drückt in kultischer Gesetzessprache fortdauernde Geltung über die Generationen hinweg aus. „Bleibend“ erhält diesen Rechtsanspruch, ohne die mögliche Reichweite des Idioms dogmatisch festzulegen.
- issue: Bezug von הָעֵדֻת
  choice: Zeugnis
  alternative: Bundestafeln
  rationale: Die traditionelle Sachbezeichnung bleibt im Haupttext erhalten. Dass damit wahrscheinlich die in der Lade verwahrten Tafeln des Bundeszeugnisses gemeint sind, wird erläutert, statt interpretierend in den Text eingesetzt zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Kultische Fachbegriffe wie „Zelt der Begegnung“ und „Zeugnis“ bleiben erhalten, werden aber dort erläutert, wo sie für heutige Leser missverständlich sein können. Der Satzbau wurde gegenüber dem Hebräischen behutsam geglättet; echte lexikalische und syntaktische Mehrdeutigkeiten sind in den Fußnoten dokumentiert.
