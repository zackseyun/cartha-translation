review_pass:
  verdict: revise
  source_fidelity: Die räumliche Angabe und die Zeitformel sind im Wesentlichen treffend wiedergegeben. Der hebräische Rückverweis אֹתוֹ ist jedoch maskulin Singular und bezieht sich im unmittelbaren Kontext am ehesten auf das Öl; das feminine „sie“ ist daher nicht haltbar. Zudem steht יַעֲרֹךְ im Singular mit Aaron als ausdrücklichem Subjekt; die Söhne sind beigeordnet.
  naturalness: „Im Zelt der Begegnung“ und „vor Jahwe“ sind natürlich und angemessen. „Bleibende Bestimmung“ klingt weniger nach einer festgesetzten kultisch-rechtlichen Ordnung als חֻקַּת; „dauerhafte Ordnung“ ist modern, klar und näher am Ausdruck. Die Stellung von „vor Jahwe“ wird zur besseren Verständlichkeit an die kultische Handlung angeschlossen.
  terminology: „Zelt der Begegnung“, „Vorhang“, „Zeugnis“ und „Jahwe“ sind konsistent und sachgerecht. Die Fußnote zum Zeugnis sollte die Wahrscheinlichkeit nicht unnötig einschränken und die räumliche Aussage als Erklärung, nicht als Bestandteil des übersetzten Textes, kennzeichnen. Die Fußnote zu מֵאֵת sollte die ungewohnte, aber quellennähere Haupttextformulierung erläutern.
  issues:
  - severity: medium
    issue: Falsches Genus des Rückverweises „sie“
    rationale: אֹתוֹ ist maskulin Singular. Im Kontext verweist es wahrscheinlich auf das in V. 20 genannte Öl (שֶׁמֶן, maskulin), nicht auf eine feminine „Lampe“. Der deutsche Text muss daher ein maskulines/neutrales Singularpronomen verwenden und die Referenz nicht ohne Kennzeichnung umdeuten.
  - severity: low
    issue: „sollen Aaron und seine Söhne“ glättet den hebräischen Singular
    rationale: יַעֲרֹךְ ist Singular und nennt Aaron als handelndes Subjekt; „und seine Söhne“ ist beigeordnet. „Aaron soll es zusammen mit seinen Söhnen …“ bildet dies genauer ab, ohne die gemeinsame priesterliche Beteiligung auszuschließen.
  - severity: medium
    issue: „bleibende Bestimmung“ ist für חֻקַּת עוֹלָם zu unverbindlich
    rationale: חֻקָּה bezeichnet eine festgesetzte Satzung bzw. Ordnung. „Dauerhafte Ordnung“ wahrt den kultisch-rechtlichen Charakter und die fortdauernde Geltung, ohne „עוֹלָם“ überzuinterpretieren.
  - severity: low
