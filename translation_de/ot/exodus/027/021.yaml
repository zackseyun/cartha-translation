    rationale: מֵאֵת bedeutet primär „vonseiten/von“. Die Funktion kann im Kontext die von Israel zu leistende Versorgung beziehungsweise ihre Verpflichtung betreffen. Eine quellennähere Formulierung mit erklärender Fußnote erhält diese Nuance besser.
