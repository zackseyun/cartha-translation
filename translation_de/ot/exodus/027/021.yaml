revisions:
- from: Im Zelt der Begegnung, außerhalb des Vorhangs, der vor dem Zeugnis[a] ist, sollen Aaron und seine Söhne sie vom Abend bis zum Morgen vor Jahwe herrichten.[b] Für die Israeliten soll dies über alle ihre Generationen hinweg eine bleibende Bestimmung sein.[c]
  to: Im Zelt der Begegnung, außerhalb des Vorhangs, der vor dem Zeugnis ist, soll Aaron es zusammen mit seinen Söhnen vom Abend bis zum Morgen vor Jahwe herrichten.[a] Dies soll eine dauerhafte Ordnung sein, vonseiten der Israeliten für alle ihre Generationen.[b]
  rationale: Die Revision korrigiert das grammatische Geschlecht und den Singularbezug der hebräischen Handlung, stärkt den rechtlich-kultischen Sinn von חֻקַּת עוֹלָם und bewahrt die Nuance von מֵאֵת. Die etablierte, verständliche Terminologie und die vorsichtige Wiedergabe der räumlich mehrdeutigen Beziehung des Vorhangs zum „Zeugnis“ bleiben erhalten.
