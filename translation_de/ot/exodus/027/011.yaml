source:
  edition: WLC
  text: וְ/כֵ֨ן לִ/פְאַ֤ת צָפוֹן֙ בָּ/אֹ֔רֶךְ קְלָעִ֖ים מֵ֣אָה אֹ֑רֶךְ ו/עמד/ו עֶשְׂרִ֗ים וְ/אַדְנֵי/הֶ֤ם עֶשְׂרִים֙ נְחֹ֔שֶׁת וָוֵ֧י הָֽ/עַמֻּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/011.yaml
  text: 'And likewise for the north side in length: hangings a hundred cubits long[a], its twenty pillars and their twenty bronze bases[b], and the hooks of the pillars and their bands shall be silver.'
translation:
  language: de
  text: Ebenso sollen an der Nordseite Vorhänge von hundert Ellen Länge sein[a], dazu zwanzig Pfosten und ihre zwanzig Sockel aus Bronze. Die Haken der Pfosten und ihre Verbindungsstücke[b] sollen aus Silber sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „hundert lang“; die Maßeinheit „Ellen“ ergibt sich aus den Maßangaben im unmittelbaren Zusammenhang.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „Bänder“ beziehungsweise „Verbindungsstäbe“; das hebräische Wort bezeichnet Teile, die mit den Pfosten verbunden sind, sie verbinden oder umfassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: Ebenso
  rationale: Kennzeichnet knapp und natürlich die Übereinstimmung mit den Vorschriften für die zuvor beschriebene Seite.
- source_word: לִפְאַת צָפוֹן
  choice: an der Nordseite
  rationale: פֵּאָה bezeichnet hier die Seite beziehungsweise Begrenzung des Vorhofs.
- source_word: בָּאֹרֶךְ
  choice: der Länge nach
  rationale: Gibt die räumliche Ausrichtung idiomatisch wieder.
- source_word: קְלָעִים
  choice: Vorhänge
  rationale: Bezeichnet in diesem Zusammenhang die Stoffbahnen, die den Vorhof umschließen; „Vorhänge“ ist verständlich und legt das Material nicht zusätzlich fest.
- source_word: מֵאָה אֹרֶךְ
  choice: hundert Ellen lang
  rationale: Im Hebräischen steht wörtlich nur „hundert lang“; die Maßeinheit ergibt sich eindeutig aus dem unmittelbaren Zusammenhang.
- source_word: וְעַמֻּדָיו עֶשְׂרִים
  choice: dazu ihre zwanzig Pfosten
  rationale: „Pfosten“ passt zu den Trägern der Vorhofsvorhänge; „dazu“ macht die verblos aneinandergereihte Bestandsangabe im Deutschen lesbar.
- source_word: וְאַדְנֵיהֶם עֶשְׂרִים נְחֹשֶׁת
  choice: und deren zwanzig Sockel aus Bronze
  rationale: אֶדֶן bezeichnet hier den tragenden Sockel eines Pfostens; נְחֹשֶׁת wird im Heiligtumskontext sachgerecht mit „Bronze“ wiedergegeben.
- source_word: וָוֵי הָעַמֻּדִים
  choice: die Haken der Pfosten
  rationale: וָוִים sind die an den Pfosten angebrachten Haken oder halternden Teile; „Haken“ ist die naheliegende konkrete Wiedergabe.
- source_word: וַחֲשֻׁקֵיהֶם
  choice: ihre Verbindungsstücke
  rationale: Der Ausdruck bezeichnet mit den Pfosten verbundene, verbindende oder sie umfassende Teile. Die neutrale Wiedergabe bewahrt die sachliche Unbestimmtheit des seltenen Fachbegriffs.
- source_word: כָּסֶף
  choice: Silber
  rationale: Direkte Materialangabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die im Hebräischen verblos gereihten Angaben werden durch „sollen … sein“ und „dazu“ lesbar verbunden, ohne zusätzliche Sachinformation einzuführen. „Pfosten“ vermeidet bei der Vorhofkonstruktion die möglicherweise monumentaler klingende Bezeichnung „Säulen“.
