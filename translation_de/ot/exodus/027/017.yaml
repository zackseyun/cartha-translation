source:
  edition: WLC
  text: כָּל עַמּוּדֵ֨י הֶֽ/חָצֵ֤ר סָבִיב֙ מְחֻשָּׁקִ֣ים כֶּ֔סֶף וָוֵי/הֶ֖ם כָּ֑סֶף וְ/אַדְנֵי/הֶ֖ם נְחֹֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/017.yaml
  text: All the pillars around the courtyard shall be banded with silver[c][b][a], with their hooks of silver and their bases of bronze.
translation:
  language: de
  text: Alle Säulen rings um den Vorhof sollen mit Silberbändern versehen sein[a]. Ihre Haken sollen aus Silber und ihre Sockel[b] aus Bronze[c] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch bedeuten, dass die Säulen mit silbernen Reifen eingefasst oder durch silberne Stäbe miteinander verbunden waren.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Fußstücke. Gemeint sind die metallenen Stand- oder Einlassstücke der Säulen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: Kupfer. Das hebräische Wort kann sowohl Kupfer als auch eine Kupferlegierung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עַמּוּדֵי
  choice: Alle Säulen
  rationale: כָּל bezeichnet hier die Gesamtheit der aufrechten Träger. „Säulen“ ist im Zusammenhang des Vorhofs verständlich und würdig.
- source_word: הֶחָצֵר
  choice: den Vorhof
  rationale: חָצֵר bezeichnet im Heiligtumskontext den umschlossenen äußeren Bereich; „Vorhof“ ist dafür der etablierte und präzise deutsche Ausdruck.
- source_word: סָבִיב
  choice: rings um
  rationale: Das Adverb bezeichnet die Säulen auf allen Seiten des Vorhofs. „rings um“ gibt dies knapp und natürlich wieder.
- source_word: מְחֻשָּׁקִים כֶּסֶף
  choice: mit Silberbändern versehen
  rationale: Das passive Partizip bezeichnet eine Ausstattung mit silbernen Bändern, Reifen oder verbindenden Stäben. Die gewählte Formulierung ist anschaulich, ohne die genaue bauliche Ausführung übermäßig festzulegen.
- source_word: וָוֵיהֶם
  choice: ihre Haken
  rationale: וָוִים sind im Zusammenhang der Stiftshütte die Vorrichtungen, an denen Behänge befestigt wurden; „Haken“ ist die naheliegende moderne Wiedergabe.
- source_word: אַדְנֵיהֶם
  choice: ihre Sockel
  rationale: אֲדָנִים bezeichnet die metallenen Stand- oder Einlassstücke, in denen die Säulen standen. „Sockel“ ist im Deutschen klar; „Fußstücke“ bleibt als Alternative in der Fußnote erhalten.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Der Ausdruck kann Kupfer oder eine Kupferlegierung bezeichnen. Im Heiligtumskontext ist „Bronze“ die übliche und gut verständliche Wiedergabe, während die metallurgische Unschärfe angemerkt wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am knappen hebräischen Baubericht; „sollen … sein“ gibt den vorschreibenden Kontext wieder. Technische Alternativen werden in Fußnoten bewahrt, statt im Haupttext vereindeutigt zu werden.
