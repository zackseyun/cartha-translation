  source_fidelity: 'Der Entwurf gibt die hebräische Konstruktion sachgerecht wieder: Die zweite Seite erhält Behänge mit einer aus dem Kontext von Vers 14 ergänzten Länge von fünfzehn Ellen sowie drei Pfosten und drei Sockeln. Die Ergänzung der Maßeinheit ist transparent gekennzeichnet und vermeidet zutreffend das Missverständnis einer Stückzahl von fünfzehn Behängen.'
  naturalness: „Für die zweite Seite sollen die Behänge fünfzehn Ellen lang sein“ ist modernes, gut verständliches Standarddeutsch. Auch die abschließende Zuordnung „mit ihren drei Pfosten und ihren drei Sockeln“ ist grammatisch und im sachlichen Bauanweisungsregister angemessen.
  terminology: „Behänge“ ist für קְלָעִים im Kontext der Vorhofumfriedung treffend. „Pfosten“ und „Sockel“ geben עַמּוּד und אֶדֶן natürlich und fachlich ausreichend präzise wieder. Die Fußnotenalternative zu den Sockeln ist sinnvoll, ohne eine technische Bedeutung einzuengen.
