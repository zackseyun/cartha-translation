  text: And for the second side there shall be fifteen cubits of hangings[c][b][a], with three pillars and their three bases.
translation:
  language: de
  text: Für die zweite Seite sollen die Behänge fünfzehn Ellen[a] lang sein, mit ihren drei Pfosten und ihren drei Sockeln[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht nur »fünfzehn«; die Maßeinheit »Ellen« ist entsprechend dem vorhergehenden Vers ergänzt.
    reason: implied_measurement
  - marker: b
    text: 'Oder: »Fußstücken«; gemeint sind die Stand- oder Fundamentteile der Pfosten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/כָּתֵף הַ/שֵּׁנִית
  choice: Für die zweite Seite
  rationale: כָּתֵף bedeutet wörtlich »Schulter«, bezeichnet hier aber einen seitlichen Abschnitt bzw. eine Flanke des Vorhofeingangs. »Seite« ist im Deutschen räumlich klar und natürlich; הַשֵּׁנִית wird direkt mit »die zweite« wiedergegeben.
- source_word: חְמֵשׁ עֶשְׂרֵה
  choice: fünfzehn Ellen lang
  rationale: Im Hebräischen steht nur »fünfzehn«; aus der parallelen Maßangabe in Vers 14 ergibt sich, dass eine Länge in Ellen gemeint ist. »lang sein« verhindert das Missverständnis, es handle sich um fünfzehn einzelne Behänge.
- source_word: קְלָעִים
  choice: Behänge
  rationale: Der Ausdruck bezeichnet die gewebten Stoffbahnen, die den Vorhof umschließen. »Behänge« ist präzise und vermeidet die mögliche Vorstellung gewöhnlicher Innenraumvorhänge.
- source_word: עַמֻּדֵי/הֶם
  choice: mit ihren drei Pfosten
  rationale: עַמּוּד bezeichnet hier die aufrecht stehenden Träger der Behänge. »Pfosten« passt im Deutschen besser zu dieser leichten Umfriedung als »Säulen« und gibt das Possessivsuffix wieder.
- source_word: וְ/אַדְנֵי/הֶם
  choice: und ihren drei Sockeln
  rationale: אֶדֶן bezeichnet die Fundament- oder Aufnahmestücke, in denen die Pfosten stehen. »Sockel« ist verständlich und sachlich passend; »Fußstücke« bleibt eine mögliche Alternative.
