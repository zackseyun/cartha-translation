base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/008.yaml
  text: You shall make it hollow[a], with boards; as it was shown to you on the mountain, so shall they make it.
translation:
  language: de
  text: Du sollst ihn hohl, aus Brettern, anfertigen. So wie es dir auf dem Berg gezeigt wurde, sollen sie ihn anfertigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְבוּב לֻחֹת
  choice: als einen Hohlkörper aus Brettern
  rationale: Die Wortgruppe beschreibt den Altar als innen leere, aus Brettern gebaute Konstruktion. Diese Formulierung gibt sowohl נְבוּב als auch לֻחֹת natürlich und anschaulich wieder.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: Du sollst ihn … anfertigen
  rationale: Die zweite Person Singular richtet die Anweisung an Mose; „sollst“ wahrt den verbindlichen Weisungscharakter.
- source_word: כַּאֲשֶׁר
  choice: Genauso, wie
  rationale: Die Wendung leitet den Vergleich mit dem auf dem Berg gezeigten Vorbild ein und klingt im Deutschen idiomatisch.
- source_word: הֶרְאָה אֹתְךָ
  choice: es dir … gezeigt wurde
  rationale: Das hebräische Hofal ist passiv. Die Übersetzung bewahrt diese Form und lässt den unausgesprochenen Handelnden ebenfalls ungenannt.
- source_word: בָּהָר
  choice: auf dem Berg
  rationale: Dies ist für den Ort der Offenbarung die natürliche deutsche Wiedergabe der hebräischen Präposition.
- source_word: כֵּן יַעֲשׂוּ
  choice: sollen sie ihn anfertigen
  rationale: Der Plural bezeichnet die ausführenden Handwerker. Das ergänzte Objekt „ihn“ ist im Deutschen zur Klarheit natürlich und ergibt sich aus dem Zusammenhang.
