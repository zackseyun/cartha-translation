translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hohlkörper“ ist präzise und verständlich; „anfertigen“ passt zum handwerklichen Zusammenhang und vermeidet eine schwerfällige Wiederholung von „machen“.
