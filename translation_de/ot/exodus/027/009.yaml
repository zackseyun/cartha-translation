  yaml_path: translation/ot/exodus/027/009.yaml
  text: And you shall make the court of the tabernacle. For the south side[a], southward, there shall be hangings for the court of finely twisted linen, a hundred cubits long for one side.
translation:
  language: de
  text: Du sollst den Vorhof des Zeltheiligtums anfertigen. Für die Südseite, nach Süden hin, soll es für den Vorhof Behänge[a] aus fein gezwirntem Leinen geben, hundert Ellen lang für die eine Seite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Vorhänge«. Das hebräische Wort bezeichnet Stoffbahnen, die die Begrenzung des Vorhofs bildeten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר
  choice: Vorhof
  rationale: Bezeichnet den offenen, eingefriedeten Bereich um das Zeltheiligtum; »Vorhof« ist im Heiligtumskontext präzise und geläufig.
- source_word: הַמִּשְׁכָּן
  choice: das Zeltheiligtum
  rationale: מִשְׁכָּן bezeichnet hier die heilige, zeltartige Wohnstätte. »Zeltheiligtum« macht Funktion und Bauform in modernem Deutsch verständlich, ohne den Ausdruck auf ein gewöhnliches Zelt zu reduzieren.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: An der Südseite, nach Süden hin
  rationale: Die doppelte Richtungsangabe des Hebräischen wird bewahrt, ohne im Deutschen unnötig schwerfällig zu wirken.
- source_word: קְלָעִים
  choice: Behänge
  rationale: Gemeint sind aufgehängte Stoffbahnen, die den Vorhof begrenzen. »Behänge« beschreibt diese bauliche Funktion besser als bloße Innendekoration.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: fein gezwirntes Leinen
  rationale: Gibt sowohl das hochwertige Leinenmaterial als auch seine gezwirnte Verarbeitung wieder.
- source_word: מֵאָה בָאַמָּה
  choice: hundert Ellen
  rationale: Die alte Maßeinheit wird beibehalten, statt eine unsichere moderne Umrechnung in den Text einzuführen.
- source_word: אֹרֶךְ
  choice: lang
  rationale: Die Maßangabe wird im Deutschen idiomatisch als »hundert Ellen lang« formuliert.
- source_word: לַפֵּאָה הָאֶחָת
  choice: auf dieser einen Seite
  rationale: Bewahrt den Bezug auf die einzelne, hier beschriebene Seite des Vorhofs.
