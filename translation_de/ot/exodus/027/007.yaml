  variant: modern standard German
source:
  edition: WLC
  text: וְ/הוּבָ֥א אֶת בַּדָּ֖י/ו בַּ/טַּבָּעֹ֑ת וְ/הָי֣וּ הַ/בַּדִּ֗ים עַל שְׁתֵּ֛י צַלְעֹ֥ת הַ/מִּזְבֵּ֖חַ בִּ/שְׂאֵ֥ת אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/007.yaml
  text: Its poles shall be put into the rings[b][a], and the poles shall be on the two sides of the altar when it is carried.
translation:
  language: de
  text: Seine Tragstangen sollen in die Ringe[a] eingeführt werden; die Stangen sollen sich an den beiden Seiten[b] des Altars befinden, wenn man ihn trägt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sollen in die Ringe gebracht werden“. Das hebräische Verb steht im Passiv und beschreibt hier das Einführen der Stangen zum Transport.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann je nach Zusammenhang auch „Seitenteile“ oder „Flanken“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּבָא
  choice: sollen … eingeführt werden
  rationale: Der Hofal von בוא hat passive beziehungsweise kausativ-passive Bedeutung. Im Zusammenhang mit den Ringen bezeichnet er das Einführen der Stangen und bewahrt zugleich die Passivform des Hebräischen.
- source_word: בַדָּיו / הַבַּדִּים
  choice: seine Tragstangen / die Stangen
  rationale: בַּד bezeichnet hier die zum Tragen des Altars bestimmten Stangen. „Tragstangen“ macht ihre Funktion im modernen Deutsch klar; bei der Wiederaufnahme genügt „die Stangen“.
- source_word: בַּטַּבָּעֹת
  choice: in die Ringe
  rationale: Die Präposition ב bezeichnet hier die Ringe als Ziel beziehungsweise Aufnahmeort der Stangen. „In die Ringe“ ist im Deutschen die natürliche räumliche Formulierung.
- source_word: וְהָיוּ
  choice: sollen sich … befinden
  rationale: Die Form beschreibt den vorgeschriebenen Zustand beziehungsweise die Lage der Stangen nach ihrem Einführen.
- source_word: עַל שְׁתֵּי צַלְעֹת הַמִּזְבֵּחַ
  choice: an den beiden Seiten des Altars
  rationale: עַל bezeichnet die räumliche Zuordnung, während צְלָעוֹת hier am natürlichsten als „Seiten“ verstanden wird. „An“ ist in diesem deutschen Zusammenhang idiomatischer als ein wörtliches „auf“.
- source_word: בִּשְׂאֵת אֹתוֹ
  choice: wenn man ihn trägt
  rationale: Der Infinitivus constructus mit בּ bezeichnet den zeitlichen beziehungsweise begleitenden Umstand. Das unpersönliche „man“ gibt den Vorgang natürlich wieder, ohne bestimmte Träger einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tragstangen“ ist klarer als das heute ungebräuchliche „Stäbe“ im speziellen Transportsinn; die Wiederholung mit „die Stangen“ vermeidet Schwerfälligkeit. Die Satzstruktur bleibt nahe an der zweiteiligen hebräischen Vorschrift.
