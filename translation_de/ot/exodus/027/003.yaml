    rationale: Die Fußnote soll die lexikalische Nuance des Piel von דשן erläutern, nicht eine deutsche Scheinwörtlichkeit erzeugen. Eine sachliche Erklärung zur fetthaltigen Opferasche ist genauer und verständlicher.
