  to: Du sollst seine Töpfe zum Entfernen seiner Asche[a] anfertigen, dazu seine Schaufeln, Becken, Gabeln und Feuerpfannen. Alle seine Geräte sollst du aus Bronze[b] anfertigen.
  rationale: Die Revision klärt den Bezug auf den Altar und bewahrt zugleich die hebräische Funktionsbestimmung der Töpfe. Die Fußnote erläutert die mit דשן verbundene Nuance ohne eine unidiomatische Pseudowörtlichkeit. Die Reihenfolge der Geräte, der Anweisungston und die lexikalische Offenheit bei נְחֹשֶׁת bleiben erhalten.
