base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/003.yaml
  text: You shall make its pots for removing its ashes[a], and its shovels, and its basins, and its forks, and its firepans[b]; you shall make all its utensils of bronze.
translation:
  language: de
  text: Du sollst seine Töpfe zum Entfernen seiner Asche[a] anfertigen, dazu seine Schaufeln, Becken, Gabeln und Feuerpfannen. Alle seine Geräte sollst du aus Bronze[b] anfertigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann hier das Entfernen der fetthaltigen Asche von den Opfergaben bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Kupfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst … anfertigen
  rationale: Das Qal Imperfekt der 2. Person Singular steht hier in einer göttlichen Bauanweisung. „Du sollst … anfertigen“ bewahrt den verbindlichen Anweisungston und klingt im modernen Deutschen natürlich.
- source_word: סִּירֹתָיו
  choice: seine Töpfe
  rationale: סִירוֹת bezeichnet Behälter oder Töpfe. Da der folgende Ausdruck ihre Funktion nennt, bleibt die Wiedergabe des Substantivs allgemein.
- source_word: לְדַשְּׁנוֹ
  choice: um seine Asche wegzuschaffen
  rationale: Das Piel von דשן bezeichnet hier das Beseitigen der bei den Opfergaben entstandenen, mit Fett vermischten Asche. Die funktionale Wiedergabe ist im Deutschen klar; die wörtlichere Nuance wird in einer Fußnote erhalten.
- source_word: יָעָיו
  choice: seine Schaufeln
  rationale: Das Wort bezeichnet Geräte zum Bewegen von Asche oder Glut; „Schaufeln“ ist dafür die klare und übliche deutsche Bezeichnung.
- source_word: מִזְרְקֹתָיו
  choice: seine Becken
  rationale: מִזְרָק bezeichnet kultische Gefäße, unter anderem zum Auffangen oder Sprengen von Opferblut. „Becken“ vermeidet eine zu häusliche Vorstellung und lässt die genaue Verwendung offen.
- source_word: מִזְלְגֹתָיו
  choice: seine Gabeln
  rationale: Das Substantiv bezeichnet gabelartige Geräte. „Gabeln“ ist verständlich und weniger deutend als „Fleischgabeln“.
- source_word: מַחְתֹּתָיו
  choice: seine Feuerpfannen
  rationale: Gemeint sind Pfannen oder Behälter zum Aufnehmen und Tragen von Glut beziehungsweise Feuer. „Feuerpfannen“ gibt die Funktion knapp wieder.
- source_word: לְכָל־כֵּלָיו
  choice: alle seine Geräte
  rationale: כְּלִי ist ein weiter Begriff für Gegenstände, Werkzeuge oder Geräte. Im Zusammenhang der aufgezählten Altargeräte ist „Geräte“ natürlich und präzise.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: In den Anweisungen zur Stiftshütte wird נְחֹשֶׁת traditionell und sachlich plausibel mit „Bronze“ wiedergegeben; „Kupfer“ bleibt lexikalisch möglich und wird in der Fußnote genannt.
