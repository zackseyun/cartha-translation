  text: Und die Breite des Vorhofs an der Ostseite, zum Sonnenaufgang hin, soll fünfzig Ellen betragen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרֹחַב
  choice: Und die Breite
  rationale: רֹחַב bezeichnet die räumliche Breite; das vorangestellte ו wird entsprechend dem fortlaufenden, koordinierenden Stil der Bauanweisungen mit »Und« wiedergegeben.
- source_word: הֶחָצֵר
  choice: des Vorhofs
  rationale: חָצֵר meint hier den umfriedeten äußeren Bereich des Heiligtums. »Vorhof« ist im deutschen Heiligtumskontext präzise und geläufig.
- source_word: לִפְאַת קֵדְמָה
  choice: an der Ostseite
  rationale: פֵאָה bezeichnet Seite, Rand oder Ecke; zusammen mit קֵדְמָה ist »an der Ostseite« eine natürliche und genaue deutsche Wiedergabe.
- source_word: מִזְרָחָה
  choice: zum Sonnenaufgang hin
  rationale: מִזְרָחָה verweist auf die Richtung des Sonnenaufgangs. Die Wiedergabe bewahrt die doppelte Richtungsangabe des Hebräischen, ohne lediglich »Osten« zu wiederholen.
- source_word: חֲמִשִּׁים אַמָּה
  choice: fünfzig Ellen
  rationale: Die Zahl und das traditionelle biblische Längenmaß werden direkt wiedergegeben; eine moderne Umrechnung wird nicht in den Haupttext eingefügt.
