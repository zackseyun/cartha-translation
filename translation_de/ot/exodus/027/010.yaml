lexical_decisions:
- source_word: עַמֻּדָיו
  choice: seine zwanzig Säulen
  rationale: עַמּוּד bezeichnet eine Säule oder einen Pfosten. Das Suffix der 3. Person Singular Maskulinum bezieht sich auf den im vorigen Vers beschriebenen Bereich; »seine« wahrt diesen Bezug.
- source_word: אַדְנֵיהֶם
  choice: deren zwanzig Sockel
  rationale: אֶדֶן bezeichnet im Zusammenhang der Stiftshütte den tragenden Sockel beziehungsweise die Fassung einer Säule. »Sockel« ist im Deutschen klar und baulich passend.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen. Bei den Bauteilen des Heiligtums ist »Bronze« die übliche und sachlich plausible Wiedergabe.
- source_word: וָוֵי
  choice: Haken
  rationale: וָו bezeichnet hier wahrscheinlich Haken, an denen Teile der Umfriedung befestigt wurden.
- source_word: חֲשֻׁקֵיהֶם
  choice: Verbindungsstäbe
  rationale: Die genaue Bedeutung des seltenen Ausdrucks ist unsicher. »Verbindungsstäbe« gibt eine mögliche bauliche Funktion natürlich wieder, ohne die Unsicherheit zu verschweigen.
- source_word: כָּסֶף
  choice: Silber
  rationale: Das Wort bezeichnet eindeutig Silber; die deutsche Formulierung bezieht das Material auf Haken und Verbindungsstäbe.
- source_word: וְ
  choice: dazu / und
  rationale: Das einleitende וְ führt die Beschreibung aus dem vorhergehenden Vers fort. »Dazu« schafft im Deutschen einen natürlichen Anschluss; die weiteren koordinierten Angaben werden syntaktisch verbunden.
