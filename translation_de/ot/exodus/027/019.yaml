  yaml_path: translation/ot/exodus/027/019.yaml
  text: All the utensils of the tabernacle for all its service[a], and all its pegs, and all the pegs of the courtyard, shall be bronze.
translation:
  language: de
  text: Alle Geräte der Stiftshütte für ihren gesamten Dienst, alle ihre Pflöcke und alle Pflöcke des Vorhofs sollen aus Bronze[a] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Kupfer. Das hebräische Wort kann allgemein Kupfer oder ein kupferbasiertes Metall bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי
  choice: Geräte
  rationale: כְּלִי bezeichnet hier umfassend die für den Dienst bestimmten Gegenstände und Gerätschaften; „Geräte“ ist natürlich und vermeidet eine Beschränkung auf Möbel oder Gefäße.
- source_word: הַמִּשְׁכָּן
  choice: die Stiftshütte
  rationale: מִשְׁכָּן bezeichnet das heilige Wohnheiligtum. „Stiftshütte“ ist im Deutschen die etablierte Bezeichnung und in diesem kultischen Zusammenhang gut verständlich.
- source_word: בְּכֹל עֲבֹדָתוֹ
  choice: für ihren gesamten Dienst
  rationale: עֲבֹדָה meint hier den Dienst beziehungsweise die Arbeit am Heiligtum; „für“ gibt die funktionale Zuordnung der Geräte im Deutschen natürlich wieder.
- source_word: יְתֵדֹתָיו
  choice: ihre Pflöcke
  rationale: יָתֵד bezeichnet einen Pflock, mit dem die Konstruktion befestigt wird. Das feminine Pronomen bezieht sich im Deutschen sinngemäß auf die Stiftshütte.
- source_word: יִתְדֹת הֶחָצֵר
  choice: die Pflöcke des Vorhofs
  rationale: חָצֵר ist hier der umschlossene Vorhof der Stiftshütte; „Vorhof“ ist die etablierte und kontextuell präzise deutsche Bezeichnung.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: נְחֹשֶׁת kann Kupfer oder ein kupferbasiertes Metall wie Bronze bezeichnen. „Bronze“ entspricht der üblichen Wiedergabe in den Materialangaben zur Stiftshütte; die lexikalische Offenheit wird in der Fußnote erhalten.
