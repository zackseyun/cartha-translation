base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/018.yaml
  text: The length of the court shall be a hundred cubits[a], and the width fifty cubits, and the height five cubits, of finely twisted linen[b], with their bases of bronze.
translation:
  language: de
  text: Der Vorhof soll hundert Ellen lang, fünfzig zu fünfzig Ellen breit[a] und fünf Ellen hoch sein. Seine Behänge sollen aus gezwirntem Feinleinen bestehen; seine Sockel sollen aus Bronze[b] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »fünfzig in fünfzig« bzw. »fünfzig zu fünfzig«. Die ungewöhnliche hebräische Formulierung ist unsicher; wahrscheinlich ist eine Breite von fünfzig Ellen gemeint.'
    reason: Die doppelte Fünfzig im masoretischen Text wird im Haupttext bewahrt und in der Anmerkung erläutert, ohne eine strittige Deutung festzulegen.
  - marker: b
    text: 'Oder: Kupfer. Für »Sockel« auch: Fußstücke oder Aufnahmen.'
    reason: נְחֹשֶׁת kann Kupfer oder eine Kupferlegierung bezeichnen; אַדָנִים hat im Baukontext eine technische Bedeutungsbreite.
lexical_decisions:
- source_word: אֹרֶךְ הֶחָצֵר
  choice: Der Vorhof soll … lang … sein
  rationale: Die substantivische Maßangabe wird in natürliches modernes Deutsch überführt; חָצֵר bezeichnet hier den umfriedeten Vorhof des Heiligtums.
- source_word: מֵאָה בָאַמָּה
  choice: hundert Ellen
  rationale: Die antike Maßeinheit wird beibehalten, statt sie mit unsicherer Genauigkeit in moderne Maße umzurechnen.
- source_word: וְרֹחַב חֲמִשִּׁים בַּחֲמִשִּׁים
  choice: fünfzig mal fünfzig Ellen breit
  rationale: Die auffällige Wiederholung der Zahl im masoretischen Text wird im Haupttext sichtbar bewahrt; die wahrscheinlich gemeinte geglättete Maßangabe wird in der Fußnote genannt.
- source_word: וְקֹמָה חָמֵשׁ אַמּוֹת
  choice: und fünf Ellen hoch
  rationale: Gibt die vertikale Abmessung knapp und idiomatisch wieder.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: gezwirntes Feinleinen
  rationale: שֵׁשׁ bezeichnet im Heiligtumskontext feines Leinen, מָשְׁזָר dessen gezwirnte Verarbeitung.
- source_word: וְאַדְנֵיהֶם
  choice: ihre Sockel
  rationale: אֶדֶן bezeichnet die tragenden Metallsockel beziehungsweise Fußstücke; „Sockel“ ist im Deutschen verständlich und sachgerecht.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: „Bronze“ ist in den Baubeschreibungen des Heiligtums die übliche und kontextuell passende Wiedergabe; „Kupfer“ bleibt lexikalisch möglich.
