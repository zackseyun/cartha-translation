  text: וְ/עָשִׂ֣יתָ קַרְנֹתָ֗י/ו עַ֚ל אַרְבַּ֣ע פִּנֹּתָ֔י/ו מִמֶּ֖/נּוּ תִּהְיֶ֣יןָ קַרְנֹתָ֑י/ו וְ/צִפִּיתָ֥ אֹת֖/וֹ נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/002.yaml
  text: And you shall make its horns on its four corners[a]; its horns shall be of one piece with it[b], and you shall overlay it with bronze.
translation:
  language: de
  text: An seinen vier Ecken sollst du Hörner machen. Seine Hörner sollen aus ihm hervorgehen[a], und du sollst ihn mit Bronze überziehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Aus ihm sollen seine Hörner sein«; gemeint ist wahrscheinlich, dass sie mit dem Altar eine Einheit bilden und nicht getrennt angesetzt werden.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann Bronze oder Kupfer bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: sollst du … machen
  rationale: Das Qal-Perfekt mit וְ führt in diesem Anweisungszusammenhang die Folge der Bauvorschriften fort. Die Formulierung mit „sollst“ bewahrt den verbindlichen Charakter und klingt im modernen Deutschen natürlich.
- source_word: קַרְנֹתָיו
  choice: seine Hörner
  rationale: קֶרֶן bedeutet wörtlich „Horn“ und bezeichnet hier die hornartigen Vorsprünge des Altars. Die konkrete kultische Bildsprache bleibt erhalten.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: an seinen vier Ecken
  rationale: עַל kann „auf“ oder kontextgemäß „an“ bedeuten. Bei Vorsprüngen an den Altarecken ist „an seinen vier Ecken“ im Deutschen räumlich klar und idiomatisch.
- source_word: מִמֶּנּוּ תִּהְיֶיןָ קַרְנֹתָיו
  choice: Die Hörner sollen mit ihm aus einem Stück bestehen
  rationale: 'Wörtlich heißt es: „Aus ihm sollen seine Hörner sein.“ Im Bauzusammenhang besagt dies wahrscheinlich, dass die Hörner zum Altarkörper gehören und nicht getrennt angesetzt werden. Die Übersetzung gibt diesen Sinn verständlich wieder; die wörtlichere Möglichkeit bleibt in der Fußnote sichtbar.'
- source_word: וְצִפִּיתָ אֹתוֹ
  choice: und du sollst ihn … überziehen
  rationale: צפה im Piel bezeichnet hier das Überziehen beziehungsweise Verkleiden eines Gegenstands mit Metall. „Überziehen“ ist dafür im Deutschen präzise und geläufig.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen. Im Zusammenhang antiker Altargeräte ist „Bronze“ wahrscheinlich und in deutscher Bibel- und Fachsprache üblich; die lexikalische Alternative wird in der Fußnote genannt.
