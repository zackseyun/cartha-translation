  yaml_path: translation/ot/exodus/027/005.yaml
  text: And you shall put it under the ledge of the altar from below[b][a], and the net shall extend to halfway up the altar.
translation:
  language: de
  text: Du sollst es von unten unter dem Vorsprung des Altars anbringen[a], und das Netz soll bis zur halben Höhe des Altars reichen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rand“ oder „Sims“. Das seltene hebräische Wort bezeichnet wohl einen vorspringenden Rand oder Rahmen am Altar.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und das Netz soll bis zur Hälfte des Altars sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Du sollst ... anbringen
  rationale: נתן bezeichnet hier mit direktem Objekt und Ortsangabe das Platzieren beziehungsweise Befestigen eines Bauteils; „anbringen“ ist im deutschen Baukontext natürlich.
- source_word: אֹתָהּ
  choice: es
  rationale: Das feminine hebräische Pronomen verweist auf das in Vers 4 genannte Netz beziehungsweise Gitter; im Deutschen richtet sich das Pronomen nach dem gewählten sächlichen Substantiv „Netz“.
- source_word: תַּחַת
  choice: unter
  rationale: Die Präposition bezeichnet eindeutig eine Lage unterhalb des Vorsprungs.
- source_word: כַּרְכֹּב
  choice: Vorsprung
  rationale: Das seltene Architekturwort bezeichnet wahrscheinlich einen vorspringenden Rand, Sims oder Rahmen am Altar. „Vorsprung“ ist verständlich und legt die genaue Bauform nicht unnötig fest.
- source_word: הַמִּזְבֵּחַ
  choice: des Altars
  rationale: „Altar“ ist die etablierte und sachlich genaue Wiedergabe von מזבח.
- source_word: מִלְּמָטָּה
  choice: von unten
  rationale: Die Form bezeichnet die Unterseite beziehungsweise eine Lage vom unteren Bereich her; die wörtliche Raumangabe wird beibehalten.
- source_word: וְהָיְתָה
  choice: sodass ... reicht
  rationale: Mit עַד beschreibt היה hier die resultierende Lage oder Ausdehnung. Die deutsche Konstruktion gibt diesen räumlichen Zusammenhang idiomatisch wieder, ohne eine ausdrückliche Zweckabsicht zu behaupten.
- source_word: הָרֶשֶׁת
  choice: das Netz
  rationale: רשת bezeichnet ein netzartiges Geflecht. „Netz“ wahrt die Bildlichkeit und stimmt mit dem vorherigen Vers überein.
- source_word: עַד חֲצִי הַמִּזְבֵּחַ
  choice: bis zur halben Höhe des Altars
  rationale: Wörtlich steht „bis zur Hälfte/Mitte des Altars“. Im baulichen Zusammenhang ist eine vertikale Ausdehnung bis zur halben Höhe gemeint; die deutsche Formulierung macht den räumlichen Bezug verständlich.
