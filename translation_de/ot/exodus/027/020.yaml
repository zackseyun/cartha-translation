source:
  edition: WLC
  text: וְ/אַתָּ֞ה תְּצַוֶּ֣ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/020.yaml
  text: And you shall command the sons of Israel that they bring to you pure beaten olive oil for the light[c][b][a], to cause a lamp to burn continually.
translation:
  language: de
  text: Du aber sollst den Israeliten[a] befehlen, dir reines Olivenöl aus zerstoßenen Oliven[b] für die Beleuchtung zu bringen, um eine Lampe beständig[c] brennen zu lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen Israels“; gemeint sind die Israeliten beziehungsweise das Volk Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „aus zerschlagenen Oliven“. Gemeint ist hochwertiges Öl, das durch Zerstoßen der Oliven statt durch gewöhnliches Pressen gewonnen wurde.'
    reason: lexical_alternative
  - marker: c
    text: „Beständig“ kann im Zusammenhang mit dem Heiligtum eine regelmäßige, fortlaufende Pflege bezeichnen und muss nicht notwendig „in jedem Augenblick ohne Unterbrechung“ bedeuten; vergleiche 2. Mose 27,21 und 3. Mose 24,2–4.
    reason: cross_reference
lexical_decisions:
- source_word: וְאַתָּה
  choice: Du aber
  rationale: Die Konjunktion mit dem selbstständigen Pronomen hebt Mose hervor und markiert einen leichten Übergang; „Du aber“ gibt diese Betonung natürlich wieder.
- source_word: תְּצַוֶּה
  choice: sollst ... befehlen
  rationale: Das Piel von צוה bezeichnet ein verbindliches Befehlen oder Anweisen; die Soll-Form passt zum gesetzlichen Anweisungsstil.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die feste hebräische Bezeichnung lautet wörtlich „Söhne Israels“, meint hier jedoch idiomatisch die Angehörigen des Volkes Israel. „Israeliten“ ist im modernen Deutschen natürlich und sachlich genau; die wörtliche Form bleibt in der Fußnote sichtbar.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: dir ... zu bringen
  rationale: לקח bedeutet grundsätzlich „nehmen“; mit אֶל und Personenbezug bezeichnet es in diesem Versorgungskontext das Beschaffen und Herbeibringen.
- source_word: שֶׁמֶן זַיִת זָךְ כָּתִית
  choice: reines Öl aus zerstoßenen Oliven
  rationale: Die Formulierung macht deutlich, dass כָּתִית die Art der Gewinnung des Olivenöls bezeichnet. „Zerstoßen“ ist im Deutschen verständlicher und sachgerechter als „geschlagenes Öl“.
- source_word: לַמָּאוֹר
  choice: für die Beleuchtung
  rationale: מָאוֹר bezeichnet hier Licht beziehungsweise Beleuchtung; die deutsche Zweckangabe ist natürlich und legt das genaue Gerät nicht über den Kontext hinaus fest.
- source_word: לְהַעֲלֹת נֵר
  choice: damit ... eine Lampe brennt
  rationale: Die Hiphil-Verbindung ist eine kultische Wendung für das Anzünden beziehungsweise Brennendhalten einer Lampe. Die gewählte Form gibt den bewirkten Zustand idiomatisch wieder.
- source_word: תָּמִיד
  choice: beständig
  rationale: Das Wort bezeichnet im priesterlichen Zusammenhang fortlaufende beziehungsweise regelmäßig wiederkehrende Aufrechterhaltung, ohne zwingend eine ausnahmslos ununterbrochene Dauer zu behaupten.
theological_decisions:
- issue: Umfang der Bundesbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die hebräische Form ist grammatisch männlich und wörtlich familial, fungiert hier aber als feste Bezeichnung der israelitischen Gemeinschaft. Die idiomatische Haupttextform vermeidet im Deutschen den falschen Eindruck, nur männliche Nachkommen seien angesprochen; die formale Gestalt wird in der Fußnote dokumentiert.
- issue: Zeitlicher Sinn von תָּמִיד
  choice: beständig
  alternative: ununterbrochen
  rationale: Der priesterliche Gebrauch kann regelmäßige, fortgesetzte Pflege bezeichnen. Daher wird keine absolute Aussage über ein in jedem Augenblick ununterbrochenes Brennen in den Text hineingelesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Anweisungsstruktur. Kultische Fachsprache wird nur dort verwendet, wo sie zum Verständnis beiträgt; echte Bedeutungsbreiten werden durch Fußnoten offengehalten.
