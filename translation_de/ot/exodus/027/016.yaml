  yaml_path: translation/ot/exodus/027/016.yaml
  text: And for the gate of the courtyard there shall be a screen twenty cubits long[a], of blue, purple, and scarlet yarn, and fine twined linen, the work of an embroiderer[c][b], with their four pillars and their four bases.
translation:
  language: de
  text: Für den Eingang des Vorhofs soll es einen zwanzig Ellen breiten Vorhang[a] geben, aus blauem Purpur, rotem Purpur, Karmesin und gezwirntem Feinleinen, in kunstvoller Buntarbeit[b], mit seinen vier Säulen und ihren vier Sockeln[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine zwanzig Ellen breite Abschirmung« oder »einen Behängungsvorhang«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »als Arbeit eines Stickers«; die genaue Textiltechnik ist nicht sicher.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Fassungen«; gemeint sind die Standfüße oder Aufnahmen der Säulen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשַׁעַר הֶחָצֵר
  choice: Für den Eingang des Vorhofs
  rationale: שַׁעַר bezeichnet hier den Zugang zum umfriedeten Vorhof. „Eingang“ passt zum textilen Verschluss natürlicher als „Tor“, während „Vorhof“ den kultisch-architektonischen Kontext wahrt.
- source_word: מָסָךְ
  choice: Vorhang
  rationale: Das Wort bezeichnet im Heiligtumskontext einen textilen Abschluss beziehungsweise Eingangsvorhang, keine feste Tür.
- source_word: עֶשְׂרִים אַמָּה
  choice: zwanzig Ellen breit
  rationale: Wörtlich steht nur „zwanzig Ellen“. Aus dem architektonischen Zusammenhang ergibt sich die horizontale Ausdehnung des Eingangsvorhangs; „breit“ macht dies im Deutschen verständlich.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: blauem und rotem Purpur, Karmesin
  rationale: Die Farbstoff- beziehungsweise Textilbezeichnungen werden mit den im deutschen Bibelstil geläufigen Farbnamen wiedergegeben. תְּכֵלֶת ist blau bis blaupurpurn, אַרְגָּמָן rötlicher Purpur und תוֹלַעַת שָׁנִי ein karmesinroter Stoff.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: und gezwirntem Feinleinen
  rationale: שֵׁשׁ bezeichnet feines Leinen, מָשְׁזָר dessen gezwirnte beziehungsweise mehrfach gedrehte Verarbeitung.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: als Arbeit eines Kunstwebers
  rationale: רֹקֵם bezeichnet einen Fachhandwerker für bunt gemusterte Textilarbeit. „Kunstweber“ bewahrt die handwerkliche und farbgestaltende Nuance, ohne die Technik sicher auf moderne Stickerei festzulegen.
- source_word: עַמֻּדֵיהֶם אַרְבָּעָה וְאַדְנֵיהֶם אַרְבָּעָה
  choice: seine vier Säulen und ihre vier Sockel
  rationale: Die hebräischen Pluralsuffixe beziehen die Säulen auf die Eingangsanordnung und die Sockel auf die Säulen. Im Deutschen verdeutlichen „seine“ und „ihre“ diese Zugehörigkeiten, ohne das morphologische Maskulinum künstlich nachzubilden.
