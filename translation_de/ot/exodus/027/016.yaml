    rationale: רֹקֵם bezeichnet spezialisierte, farbig gemusterte Textilarbeit; die genaue moderne Technik bleibt unsicher. Eine nichttechnische Wiedergabe mit erläuternder Fußnote erhält diese Offenheit besser.
