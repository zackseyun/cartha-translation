    issue: Unklare Reihung der drei Farbmaterialien
    rationale: Die Formulierung »aus blauem und rotem Purpur, Karmesin« lässt nicht eindeutig erkennen, dass drei parallele Farbstoff-/Textilangaben vorliegen. Die hebräische Reihung verlangt eine klarere Koordination.
  - severity: low
    issue: Unnatürlicher Anschluss der Säulen und Sockel
    rationale: »dazu seine vier Säulen« ist stilistisch holprig. Die Präposition »mit« gibt die konstruktive Zuordnung wieder und verbindet den Nachtrag idiomatisch.
  - severity: low
