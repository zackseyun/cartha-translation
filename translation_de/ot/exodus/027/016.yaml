revisions:
- from: Für den Eingang des Vorhofs soll es einen zwanzig Ellen breiten Vorhang[a] geben, aus blauem und rotem Purpur, Karmesin und gezwirntem Feinleinen, als Arbeit eines Kunstwebers[b]; dazu seine vier Säulen und ihre vier Sockel[c].
  to: Für den Eingang des Vorhofs soll es einen zwanzig Ellen breiten Vorhang[a] geben, aus blauem Purpur, rotem Purpur, Karmesin und gezwirntem Feinleinen, in kunstvoller Buntarbeit[b], mit seinen vier Säulen und ihren vier Sockeln[c].
  rationale: Die Revision ordnet die drei Farbangaben parallel, glättet den Satzanschluss der tragenden Bauteile und vermeidet bei der kunstvollen Textilarbeit eine ungesicherte Festlegung auf Weberei. Die im Hebräischen ausdrücklich zugehörigen Säulen und Sockel bleiben durch »seinen« beziehungsweise »ihren« erhalten. Die ergänzte Angabe »breiten« bleibt als aus dem architektonischen Kontext sicher erschließbare deutsche Explikation bestehen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:42:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung trifft die Grundstruktur und die Bauteile des Verses, doch die Aufzählung der Textilfarben ist im Deutschen syntaktisch und semantisch nicht hinreichend klar: »blauem und rotem Purpur, Karmesin« lässt die drei eigenständigen Materialien/Farben nicht sauber erkennen. Die Besitzbezüge der Säulen und Sockel können idiomatischer formuliert werden, ohne die hebräischen Suffixe inhaltlich zu verlieren.'
  naturalness: »dazu seine vier Säulen und ihre vier Sockel« wirkt angeschlossen und schwerfällig. »mit seinen vier Säulen und ihren vier Sockeln« ist modernes, verständliches Standarddeutsch. »kunstvoller Buntarbeit« ist als vorsichtige Wiedergabe von מַעֲשֵׂה רֹקֵם natürlicher als die berufsbezeichnende, technisch enger wirkende Form »Kunstweber«.
  terminology: »Vorhof«, »Vorhang«, »Ellen«, »Säulen«, »Sockel« und »gezwirntes Feinleinen« sind angemessen. Für תְּכֵלֶת, אַרְגָּמָן und תוֹלַעַת שָׁנִי werden die drei traditionellen deutschen Farbbezeichnungen klar parallel gesetzt. Die Fußnoten werden an die geänderten Formulierungen angepasst und bewahren die technische Unsicherheit bei מָסָךְ, רֹקֵם und אַדָן.
  issues:
