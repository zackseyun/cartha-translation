base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/030.yaml
  text: Little by little I will drive them out from before you[b][a], until you become fruitful and take possession of the land.
translation:
  language: de
  text: Nach und nach werde ich sie vor dir vertreiben, bis du zahlreich wirst und das Land in Besitz nimmst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und das Land erbst«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מְעַט
  choice: Nach und nach
  rationale: Die Wiederholung bezeichnet ein schrittweises Vorgehen. „Nach und nach“ gibt den idiomatischen Sinn natürlich wieder und bewahrt zugleich die wiederholende Struktur.
- source_word: אֲגָרְשֶׁנּוּ
  choice: werde ich sie vertreiben
  rationale: גרשׁ bedeutet „vertreiben, fortjagen“. Das hebräische Objektsuffix steht grammatisch im maskulinen Singular, bezeichnet hier aber kollektiv die zuvor genannten Bewohner beziehungsweise Völker. Im Deutschen macht „sie“ den gemeinten kollektiven Bezug klar.
- source_word: מִפָּנֶיךָ
  choice: vor dir
  rationale: Die Wendung bedeutet wörtlich „von deinem Angesicht weg“ und bezeichnet hier die Entfernung aus Israels Gegenwart beziehungsweise aus dem vor ihm liegenden Gebiet. „Vor dir vertreiben“ ist knapp, natürlich und bewahrt das räumliche Bild.
- source_word: עַד אֲשֶׁר
  choice: bis
  rationale: Die Verbindung bezeichnet den Zeitpunkt beziehungsweise Zustand, bis zu dem das schrittweise Vertreiben fortgesetzt wird.
- source_word: תִּפְרֶה
  choice: du zahlreich geworden bist
  rationale: פרה heißt „fruchtbar sein/werden“ und bezeichnet im Kontext das zahlenmäßige Anwachsen Israels. Die gewählte Formulierung vermittelt diesen gemeinten Sinn im modernen Deutsch klarer als das hier missverständliche „fruchtbar geworden bist“.
- source_word: וְנָחַלְתָּ
  choice: und das Land in Besitz nimmst
  rationale: נחל kann „erben“ oder „als Besitz erhalten/in Besitz nehmen“ bedeuten. Im Zusammenhang der Besiedlung des Landes ist „in Besitz nehmen“ natürlich und konkret; die mögliche Erb-Bedeutung wird in einer Fußnote erhalten.
- source_word: אֶת־הָאָרֶץ
  choice: das Land
  rationale: Der Ausdruck bezeichnet im Zusammenhang das verheißene Land; „das Land“ ist die übliche und hinreichend bestimmte Wiedergabe.
theological_decisions:
- issue: Kollektiver Bezug des maskulinen Singularsuffixes in אֲגָרְשֶׁנּוּ
  choice: Im Haupttext steht das deutsche Pluralpronomen „sie“, bezogen auf die Bewohner beziehungsweise Völker des Landes.
  alternative: Grammatisch formal könnte man „ihn“ wiedergeben und den kollektiven Bezug in einer Fußnote erklären.
  rationale: Der hebräische Singular ist kollektiv gebraucht. Ein deutsches „ihn“ hätte ohne ausdrücklich genanntes maskulines Bezugswort einen unklaren oder irreführenden Bezug. „Sie“ wahrt den kontextuellen Sinn, ohne eine theologische Aussage hinzuzufügen.
- issue: Bedeutungsumfang von נחל
  choice: „das Land in Besitz nimmst“
  alternative: „das Land erbst“
  rationale: Beide Bedeutungsnuancen sind lexikalisch möglich. Der Haupttext hebt die tatsächliche Besitzergreifung im Kontext hervor; die Fußnote bewahrt die traditionelle und theologisch resonante Erb-Terminologie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nach und nach“ bewahrt die hebräische Wiederholung idiomatisch. „Zahlreich geworden“ erschließt den populationsbezogenen Sinn von פרה, während „in Besitz nehmen“ den unmittelbaren Siedlungszusammenhang klar ausdrückt.
