  text: כִּֽי יֵלֵ֣ךְ מַלְאָכִ/י֮ לְ/פָנֶי/ךָ֒ וֶ/הֱבִֽיאֲ/ךָ֗ אֶל הָֽ/אֱמֹרִי֙ וְ/הַ֣/חִתִּ֔י וְ/הַ/פְּרִזִּי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י וְ/הִכְחַדְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/023.yaml
  text: For my angel will go before you and bring you to the Amorites[a], the Hittites, the Perizzites, the Canaanites, the Hivites, and the Jebusites[b], and I will wipe them out.
translation:
  language: de
  text: Denn mein Engel[a] wird vor dir hergehen und dich zu den Amoritern, Hethitern, Perisitern, Kanaanitern, Hiwitern und Jebusitern bringen, und ich werde sie[b] auslöschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Bote“. Das hebräische Wort מַלְאָךְ kann einen menschlichen oder himmlischen Boten bezeichnen; hier passt wegen des Zusammenhangs göttlicher Führung „Engel“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen ein singularisches Objektpronomen („ihn/es“), das die aufgezählten Völker kollektiv zusammenfasst.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet beziehungsweise erläutert die vorausgehende Weisung und Verheißung.
- source_word: יֵלֵךְ
  choice: wird … hergehen
  rationale: Das Imperfekt bezeichnet hier im Zusammenhang der göttlichen Zusage ein zukünftiges Geschehen; zusammen mit לְפָנֶיךָ ergibt sich idiomatisch „vor dir hergehen“.
- source_word: מַלְאָכִי
  choice: mein Engel
  rationale: מַלְאָךְ kann einen menschlichen oder himmlischen Boten bezeichnen. Im Zusammenhang göttlicher Führung ist „Engel“ die naheliegende Haupttextlesart; „Bote“ bleibt als echte lexikalische Alternative in der Fußnote erhalten.
- source_word: לְפָנֶיךָ
  choice: vor dir her
  rationale: Die Wendung bezeichnet das Vorausgehen und passt im Deutschen natürlich zum Verb „gehen“.
- source_word: וֶהֱבִיאֲךָ
  choice: und dich … bringen
  rationale: Der Hifil von בוא bedeutet „kommen lassen, bringen“; die direkte Wiedergabe vermeidet den nicht ausdrücklich genannten Zusatz „in das Land“.
- source_word: אֶל
  choice: zu
  rationale: Die Richtungspräposition wird eng am Hebräischen wiedergegeben, obwohl die Völkernamen metonymisch auch deren Gebiet bezeichnen können.
- source_word: הָאֱמֹרִי … וְהַיְבוּסִי
  choice: die Amoriter, Hetiter, Perisiter, Kanaaniter, Hiwiter und Jebusiter
  rationale: Die hebräischen singularischen Volksbezeichnungen werden nach üblichem deutschem Sprachgebrauch im Plural wiedergegeben.
- source_word: וְהִכְחַדְתִּיו
  choice: und ich werde sie auslöschen
  rationale: Der Hifil von כחד bezeichnet das Verschwindenlassen beziehungsweise Vernichten. Das singularische Suffix bezieht sich kollektiv auf die zuvor genannten Völker und wird im natürlichen Deutschen pluralisch wiedergegeben.
theological_decisions:
- issue: Identität und Wesen von מַלְאָכִי
  choice: „mein Engel“, ohne die Gestalt näher zu bestimmen
  alternative: „mein Bote“; eine theophanische Erscheinung des HERRN; der präexistente Sohn
  rationale: Der Vers selbst nennt die Gestalt lediglich Gottes Engel beziehungsweise Boten. Die Übersetzung entscheidet nicht zwischen weitergehenden theologischen Deutungen.
- issue: Numerus des Objekts in וְהִכְחַדְתִּיו
  choice: Der kollektive Sinn wird deutsch mit dem Pluralpronomen „sie“ wiedergegeben.
  alternative: Formnah singularisch „ihn/es“, bezogen auf die Gesamtheit der genannten Völker
  rationale: Das hebräische Suffix ist grammatisch Singular, fasst die aufgezählten Völker aber kollektiv zusammen. Ein Pluralpronomen vermittelt diesen Bezug im Deutschen klar und natürlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vor dir hergehen“ ist geläufig und quellennah; das Semikolon hält die göttliche Führung und die anschließende Vernichtungszusage eng zusammen. Keine weitergehende Identifikation des Engels wird in den Text eingetragen.
