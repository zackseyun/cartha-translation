  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶל פְּנֵ֖י הָ/אָדֹ֥ן יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/017.yaml
  text: Three times in the year every male among you shall appear before the Lord Yahweh[a].
translation:
  language: de
  text: Alle deine männlichen Angehörigen sollen dreimal im Jahr vor dem Herrn Jahwe[a] erscheinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „vor dem Herrn Jahwe“; „Herr“ ist der Titel, „Jahwe“ der Gottesname.'
    reason: Die Verbindung eines göttlichen Titels mit dem Gottesnamen kann in deutschen Bibelübersetzungen unterschiedlich wiedergegeben werden.
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: Dreimal
  rationale: Die Wendung bezeichnet drei Gelegenheiten innerhalb des Jahres; „dreimal“ ist im Deutschen direkt und natürlich.
- source_word: בַּשָּׁנָה
  choice: im Jahr
  rationale: Die Form mit Artikel bezeichnet den jährlichen Zyklus. „Im Jahr“ wahrt die hebräische Ausdrucksweise, ohne unnatürlich zu klingen.
- source_word: יֵרָאֶה
  choice: soll … erscheinen
  rationale: Der Nifal von ראה bezeichnet hier idiomatisch das Erscheinen vor einem Herrscher oder vor Gott. „Erscheinen“ bewahrt diese Bedeutung, ohne den Wortlaut reflexiv auszuweiten.
- source_word: כָּל זְכוּרְךָ
  choice: alles Männliche bei dir
  rationale: Die substantivierte Form זָכוּר bezeichnet die männlichen Angehörigen. „Alles Männliche bei dir“ bildet den kollektiven Singular und das Suffix der zweiten Person eng ab.
- source_word: אֶל פְּנֵי
  choice: vor
  rationale: Die Präposition bezeichnet das Kommen in jemandes Gegenwart; „vor“ ist die übliche knappe deutsche Entsprechung.
- source_word: הָאָדֹן
  choice: dem Herrn
  rationale: אָדוֹן ist hier ein göttlicher Herrschertitel. „Herr“ ist die natürliche und würdevolle deutsche Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen weiteren Titel ersetzt.
theological_decisions:
- issue: Wiedergabe der Verbindung הָאָדֹן יְהוָה
  choice: dem Herrn Jahwe
  alternative: dem Herrn, dem HERRN
  rationale: Der hebräische Text verbindet den Titel „Herr“ unmittelbar mit dem Gottesnamen. „Herr Jahwe“ erhält sowohl den Titel als auch den persönlichen Namen und vermeidet eine künstliche Verdoppelung von „Herr“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hält das Gebot klar und kompakt; die kultisch-rechtliche Formulierung und die ausdrückliche Beschränkung auf die männlichen Angehörigen bleiben erhalten.
