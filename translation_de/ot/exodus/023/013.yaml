source:
  edition: WLC
  text: וּ/בְ/כֹ֛ל אֲשֶׁר אָמַ֥רְתִּי אֲלֵי/כֶ֖ם תִּשָּׁמֵ֑רוּ וְ/שֵׁ֨ם אֱלֹהִ֤ים אֲחֵרִים֙ לֹ֣א תַזְכִּ֔ירוּ לֹ֥א יִשָּׁמַ֖ע עַל פִּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/013.yaml
  text: In all that I have said to you[a], be careful[b]; and the name of other gods you shall not mention—it shall not be heard on your lips.
translation:
  language: de
  text: Bei allem, was ich euch gesagt habe, sollt ihr auf der Hut sein. Den Namen anderer Götter sollt ihr nicht erwähnen[a]; er soll nicht über deine Lippen kommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder enger: „sollt ihr nicht anrufen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „er soll nicht auf deinem Mund gehört werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֹל אֲשֶׁר אָמַרְתִּי אֲלֵיכֶם
  choice: Bei allem, was ich euch gesagt habe
  rationale: Die Präposition בְּ mit כֹּל bezeichnet den umfassenden Geltungsbereich und verweist auf die zuvor gegebenen Weisungen. Die Formulierung ist im Deutschen natürlich und bewahrt den Rückbezug.
- source_word: תִּשָּׁמֵרוּ
  choice: sollt ihr auf der Hut sein
  rationale: Der Nifal von שׁמר fordert hier zu wachsamer Selbstbeachtung auf. „Auf der Hut sein“ gibt diesen reflexiven und mahnenden Sinn idiomatisch wieder.
- source_word: וְשֵׁם אֱלֹהִים אֲחֵרִים
  choice: Den Namen anderer Götter
  rationale: Die Konstruktverbindung wird direkt wiedergegeben. „Andere Götter“ bezeichnet Gottheiten außer dem Gott Israels, ohne über ihren ontologischen Status hinauszugehen.
- source_word: לֹא תַזְכִּירוּ
  choice: sollt ihr nicht erwähnen
  rationale: Der Hifil von זכר kann „erwähnen“, „in Erinnerung bringen“ oder in diesem Zusammenhang enger „anrufen“ bedeuten. „Erwähnen“ erhält die größere Bedeutungsbreite.
- source_word: לֹא יִשָּׁמַע עַל פִּיךָ
  choice: er soll nicht über deine Lippen kommen
  rationale: Die hebräische Wendung lautet wörtlich „er soll nicht auf deinem Mund gehört werden“. Die deutsche Formulierung bewahrt das Bild des mündlichen Aussprechens und gibt die prohibitive Kraft natürlich wieder.
theological_decisions:
- issue: Reichweite des Verbots bezüglich der Namen anderer Götter
  choice: Das Verbot wird allgemein als Nicht-Erwähnen wiedergegeben.
  alternative: Das Verb enger mit „anrufen“ wiederzugeben und so ausdrücklich auf kultische oder eidliche Anrufung zu beziehen.
  rationale: זכר im Hifil lässt sowohl die allgemeine Erwähnung als auch kontextuell eine Anrufung zu. Der Haupttext bewahrt den weiteren Wortlaut; die engere Möglichkeit wird in einer Fußnote kenntlich gemacht, ohne die Spannung aufzulösen.
- issue: Bezeichnung „andere Götter“
  choice: Die hebräische Bezeichnung wird ohne erklärende ontologische Einordnung übernommen.
  alternative: Durch Anführungszeichen oder einen Zusatz ihre Wirklichkeit ausdrücklich zu bestreiten oder zu bestätigen.
  rationale: Der Vers untersagt das Aussprechen ihrer Namen, trifft an dieser Stelle aber keine ausdrückliche Aussage über ihren ontologischen Status.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel vom Plural „euch/ihr“ zum Singular „deine“ folgt bewusst dem hebräischen Text. Die beiden Fußnoten markieren echte lexikalische beziehungsweise bildhafte Alternativen.
