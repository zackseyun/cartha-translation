source:
  edition: WLC
  text: לֹֽא תִשְׁתַּחֲוֶ֤ה לֵ/אלֹֽהֵי/הֶם֙ וְ/לֹ֣א תָֽעָבְדֵ֔/ם וְ/לֹ֥א תַעֲשֶׂ֖ה כְּ/מַֽעֲשֵׂי/הֶ֑ם כִּ֤י הָרֵס֙ תְּהָ֣רְסֵ֔/ם וְ/שַׁבֵּ֥ר תְּשַׁבֵּ֖ר מַצֵּבֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/024.yaml
  text: You shall not bow down to their gods[a], nor serve them, nor do according to their deeds; rather, you shall surely tear them down and surely shatter their pillars.
translation:
  language: de
  text: Du sollst dich vor ihren Göttern nicht niederwerfen, ihnen nicht dienen und nicht tun, was sie tun. Vielmehr sollst du sie vollständig niederreißen und ihre Steinmale[a] gründlich zerschlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Kultsteine“ beziehungsweise „ihre heiligen Säulen“. Gemeint sind aufgerichtete Steinmale, die dem Kult dienten.'
    reason: Das hebräische מַצֵּבָה bezeichnet einen aufgerichteten Stein oder eine Säule und hat hier eine kultische Bedeutung.
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: dich … niederwerfen
  rationale: Das Verb bezeichnet konkret das Niederwerfen als ehrerbietige Handlung. Die Wiedergabe bewahrt das körperliche Bild, ohne es vorschnell mit dem umfassenderen Begriff „anbeten“ gleichzusetzen.
- source_word: לֵאלֹהֵיהֶם
  choice: vor ihren Göttern
  rationale: Nach dem deutschen Verb „sich niederwerfen“ bezeichnet „vor“ idiomatisch die Wesen, denen die Huldigung gilt. Die Kleinschreibung kennzeichnet die Gottheiten der Völker.
- source_word: תָעָבְדֵם
  choice: ihnen … dienen
  rationale: „Dienen“ entspricht עבד unmittelbar und bewahrt dessen Spannweite zwischen Dienst, Loyalität und kultischer Verehrung.
- source_word: תַעֲשֶׂה כְּמַעֲשֵׂיהֶם
  choice: nicht tun, was sie tun
  rationale: Diese natürliche deutsche Formulierung gibt die Nachahmung ihrer Handlungen beziehungsweise religiösen Praktiken wieder, ohne den Bezug ausdrücklich auf den Kult einzuengen.
- source_word: כִּי
  choice: vielmehr
  rationale: Hier leitet כִּי den betonten Gegensatz zwischen den verbotenen Handlungen und dem gebotenen Vorgehen ein.
- source_word: הָרֵס תְּהָרְסֵם
  choice: sie vollständig niederreißen
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aufforderung. „Vollständig“ gibt diese Intensivierung wieder; das Pronomen „sie“ lässt den Bezug wie im Hebräischen offen.
- source_word: וְשַׁבֵּר תְּשַׁבֵּר
  choice: gründlich zerschlagen
  rationale: Auch hier verstärkt der Infinitivus absolutus das finite Verb. „Gründlich“ bewahrt den Nachdruck, während „zerschlagen“ zu steinernen Kultobjekten passt.
- source_word: מַצֵּבֹתֵיהֶם
  choice: ihre Steinmale
  rationale: מַצֵּבָה bezeichnet einen aufgerichteten Stein beziehungsweise ein Steinmal, hier in kultischem Zusammenhang. „Steinmale“ ist konkret und verständlich; die Fußnote erläutert die kultische Bedeutung.
theological_decisions:
- issue: Art der verbotenen Hinwendung zu fremden Gottheiten
  choice: Die beiden Verben werden getrennt als „sich niederwerfen“ und „dienen“ wiedergegeben.
  alternative: Beide Handlungen mit ausdrücklicher Anbetungssprache wiedergeben, etwa „anbeten und verehren“.
  rationale: Der hebräische Text unterscheidet die äußere Huldigung vom Dienst. Diese Unterscheidung wahrt die umfassende Zurückweisung sowohl ehrerbietiger Gesten als auch dauerhafter kultischer Bindung.
- issue: Bezug des Pronomens bei der Aufforderung zum Niederreißen
  choice: Das Pronomen „sie“ bleibt erhalten; die anschließende Nennung der Steinmale lenkt den Zusammenhang auf greifbare Kultobjekte.
  alternative: Den Gegenstand ausdrücklich als „ihre Götzenbilder“ oder „ihre Heiligtümer“ bestimmen.
  rationale: Eine ausdrückliche Ergänzung würde die im Hebräischen vorhandene Bezugsunschärfe auflösen. Die deutsche Fassung bewahrt die polemische Kraft, während der folgende Satzteil die Zerstörung konkreter Kultzeichen erkennen lässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gestrafft und gut verständlich; die wiederholten Verstärkungsformen des Hebräischen werden durch „vollständig“ und „gründlich“ hörbar gemacht. Das konkrete Bild des Niederwerfens sowie die begriffliche Unterscheidung zwischen Huldigung und Dienst bleiben erhalten.
