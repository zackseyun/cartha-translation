source:
  edition: WLC
  text: לֹֽא תִהְיֶ֥ה אַחֲרֵֽי רַבִּ֖ים לְ/רָעֹ֑ת וְ/לֹא תַעֲנֶ֣ה עַל רִ֗ב לִ/נְטֹ֛ת אַחֲרֵ֥י רַבִּ֖ים לְ/הַטֹּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/002.yaml
  text: You shall not follow the many to do evil[a], and you shall not testify in a dispute so as to turn aside after the many, to pervert justice.
translation:
  language: de
  text: Du sollst dich nicht der Mehrheit anschließen, um Böses zu tun; und in einem Rechtsstreit sollst du nicht so aussagen, dass du dich nach der Mehrheit richtest, um das Recht zu beugen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich ist der Schluss knapp: „… um sich nach der Mehrheit zu richten, um zu beugen.“ Das Objekt des letzten „beugen“ wird im Hebräischen nicht genannt; im gerichtlichen Zusammenhang ist das Recht oder das Urteil gemeint.'
    reason: Die Anmerkung erläutert die knappe, objektlose Schlussformulierung und kennzeichnet „das Recht“ als kontextuelle Ergänzung.
lexical_decisions:
- source_word: תִהְיֶה אַחֲרֵי רַבִּים
  choice: dich der Mehrheit anschließen
  rationale: Die Verbindung von היה mit אַחֲרֵי bezeichnet idiomatisch, dass man anderen folgt oder sich auf ihre Seite stellt. »Mehrheit« gibt רַבִּים im Zusammenhang mit Gruppendruck natürlich wieder.
- source_word: לְרָעֹת
  choice: um Böses zu tun
  rationale: Der Infinitiv mit לְ bezeichnet hier Zweck oder Folge; »Böses tun« bewahrt die deutliche ethische Wertung.
- source_word: תַעֲנֶה עַל רִיב
  choice: in einem Rechtsstreit … aussagen
  rationale: ענה kann allgemein »antworten« bedeuten, bezeichnet in diesem forensischen Zusammenhang aber eine Aussage vor Gericht; רִיב ist hier ein Rechtsstreit oder Rechtsfall.
- source_word: לִנְטֹת אַחֲרֵי רַבִּים
  choice: so … dass du dich der Mehrheit anschließt
  rationale: נטה bezeichnet ein Sichneigen oder Abweichen. Die Formulierung macht den Zweck beziehungsweise die Folge verständlich und wahrt durch die Wiederholung von »der Mehrheit anschließen« die rhetorische Struktur des Hebräischen.
- source_word: לְהַטֹּת
  choice: das Recht beugst
  rationale: Der Hifil von נטה bedeutet im gerichtlichen Kontext »beugen« oder »verdrehen«. Das im Hebräischen unausgesprochene Objekt »das Recht« wird aus dem unmittelbaren Rechtskontext ergänzt.
theological_decisions:
- issue: Gerichtlich-ethische Aussage des Schlusses
  choice: »das Recht beugst« mit ergänztem Objekt
  alternative: »zum Abbiegen« beziehungsweise »um zu beugen« ohne genanntes Objekt
  rationale: Der hebräische Schluss ist knapp und lässt das Objekt unausgesprochen. Der Zusammenhang von Aussage und Rechtsstreit zeigt jedoch, dass es um die Beugung des Rechts oder Urteils geht. Die Ergänzung klärt den Sinn, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Rechtsstreit« verdeutlicht den forensischen Rahmen; »Mehrheit« ist verständlicher als »die Vielen«, während die Wiederholung des hebräischen Ausdrucks erhalten bleibt.
