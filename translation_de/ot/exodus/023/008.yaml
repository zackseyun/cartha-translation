source:
  edition: WLC
  text: וְ/שֹׁ֖חַד לֹ֣א תִקָּ֑ח כִּ֤י הַ/שֹּׁ֨חַד֙ יְעַוֵּ֣ר פִּקְחִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/008.yaml
  text: And you shall not take a bribe[b][a], for a bribe blinds the clear-sighted and twists the words of the righteous.
translation:
  language: de
  text: Nimm kein Bestechungsgeld an; denn Bestechungsgeld macht Scharfsichtige blind[a] und verdreht die Worte derer, die im Recht sind.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Einsichtigen“. Das Hebräische bewahrt das Bild des Sehens und meint zugleich klares Wahrnehmen und Urteilen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Worte der Gerechten“. Im gerichtlichen Zusammenhang können auch ihre Aussagen oder ihre Rechtssache gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: Bestechungsgeld
  rationale: Bezeichnet eine korrumpierende Zahlung, die ein Urteil beeinflussen soll. „Bestechungsgeld“ ist im modernen Deutschen eindeutig und trifft den rechtlich-moralischen Sinn.
- source_word: לֹא תִקָּח
  choice: Nimm … nicht an
  rationale: Der Qal-Imperfekt 2. Person Singular dient im Gesetzestext als Verbot. „Annehmen“ ist im Deutschen bei Bestechungsgeld natürlicher als das wörtlichere „nehmen“.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung des Verbots knapp und in einem würdigen gesetzlichen Register ein.
- source_word: יְעַוֵּר
  choice: macht … blind
  rationale: Gibt die kausative Bedeutung des Piel wieder und bewahrt das Bild der Blindheit.
- source_word: פִּקְחִים
  choice: Sehende
  rationale: Bewahrt die hebräische Bildsprache des Sehens; im Zusammenhang sind Menschen mit klarem Wahrnehmungs- und Urteilsvermögen gemeint.
- source_word: וִיסַלֵּף
  choice: verdreht
  rationale: Gibt das Verbiegen beziehungsweise Verfälschen anschaulich und idiomatisch wieder.
- source_word: דִּבְרֵי
  choice: die Worte
  rationale: Bewahrt die semantische Breite von דָּבָר; im Rechtskontext können Aussagen, Vorbringen oder die Rechtssache gemeint sein.
- source_word: צַדִּיקִים
  choice: derer, die im Recht sind
  rationale: Der gerichtliche Kontext legt die forensische Bedeutung nahe. Die Formulierung bezeichnet diejenigen, deren Sache berechtigt ist, ohne eine weitergehende moralische Vollkommenheit vorauszusetzen.
theological_decisions:
- issue: Bedeutung von צַדִּיקִים im gerichtlichen Zusammenhang
  choice: derer, die im Recht sind
  alternative: der Gerechten
  rationale: Die forensische Wiedergabe passt zum Verbot richterlicher Bestechung; eine Fußnote hält die breitere moralische Lesart offen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Gesetzesstil. Der Singular der direkten Anrede bleibt erhalten. Die Bildsprache des Blindmachens und Verdrehens wird bewahrt; rechtliche Mehrdeutigkeiten werden durch Fußnoten offengehalten.
