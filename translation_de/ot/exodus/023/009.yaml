source:
  edition: WLC
  text: וְ/גֵ֖ר לֹ֣א תִלְחָ֑ץ וְ/אַתֶּ֗ם יְדַעְתֶּם֙ אֶת נֶ֣פֶשׁ הַ/גֵּ֔ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/009.yaml
  text: You shall not oppress a sojourner[a], and you yourselves know the soul of the sojourner[b], because you were sojourners in the land of Egypt.
translation:
  language: de
  text: Einen Fremden sollst du nicht unterdrücken. Ihr wisst selbst, wie es einem Fremden zumute ist[a], denn ihr seid Fremde im Land Ägypten gewesen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ihr kennt die Seele (hebräisch nefesch) des Fremden.“ Gemeint ist die aus eigener Erfahrung bekannte Lebenslage und innere Befindlichkeit eines Fremden. Das hebräische Wort für „Fremder“ bezeichnet einen nicht einheimischen Menschen, der unter einem anderen Volk lebt und oft sozial verletzlich ist; auch: „ansässiger Ausländer“ oder „Beisasse“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  choice: Fremder
  rationale: גֵר bezeichnet hier einen nicht einheimischen Menschen, der dauerhaft unter einem anderen Volk lebt und sozial gefährdet sein kann. „Fremder“ ist im Deutschen natürlich und lässt die soziale wie rechtliche Kategorie offen; die Fußnote grenzt den Ausdruck vom bloß Durchreisenden ab.
- source_word: תִלְחָץ
  choice: bedrängen
  rationale: לחץ bezeichnet das Ausüben von Druck und kann Unterdrückung oder Ausbeutung einschließen. „Bedrängen“ bleibt nah am Bild des hebräischen Verbs, ohne dessen soziale Schärfe abzuschwächen.
- source_word: וְאַתֶּם יְדַעְתֶּם
  choice: Ihr wisst ja selbst
  rationale: Das ausdrücklich gesetzte Pronomen אַתֶּם betont Israels eigene, aus Erfahrung gewonnene Kenntnis. „ja selbst“ gibt diese Betonung idiomatisch wieder.
- source_word: אֶת נֶפֶשׁ הַגֵּר
  choice: wie einem Fremden zumute ist
  rationale: Wörtlich steht „die נפש des Fremden kennen“. Im Zusammenhang bezeichnet נפש die innere Befindlichkeit beziehungsweise die am eigenen Leib erfahrene Lebenslage. Die idiomatische Wiedergabe vermittelt diesen Sinn, während die Fußnote die Form des Hebräischen sichtbar hält.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung des Gebots ein. „Denn“ bewahrt den würdigen gesetzlichen Ton und gibt den kausalen Zusammenhang klar wieder.
- source_word: גֵרִים הֱיִיתֶם
  choice: ihr seid Fremde gewesen
  rationale: Die Wiederholung von „Fremde“ entspricht der Wiederaufnahme von גֵר und trägt den ethischen Vergleich zwischen Israels Vergangenheit und der Lage heutiger Fremder.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Die Wiedergabe erhält das hebräische אֶרֶץ ausdrücklich und klingt im Deutschen zugleich natürlich und feierlich.
theological_decisions:
- issue: Wiedergabe von גֵר im Bundesrecht
  choice: Fremder
  alternative: Schutzbürger; ansässiger Ausländer; Beisasse
  rationale: Der Begriff beschreibt nicht nur ethnische Fremdheit, sondern den rechtlich und sozial verletzlichen Status eines Nicht­einheimischen in der Gemeinschaft. „Fremder“ vermeidet moderne verwaltungsrechtliche Festlegungen; die historische Bedeutung wird in der Fußnote erläutert.
- issue: Wiedergabe von נֶפֶשׁ in der idiomatischen Verbindung
  choice: wie einem Fremden zumute ist
  alternative: die Seele des Fremden; das Leben des Fremden; die Lage des Fremden
  rationale: „Seele“ könnte im heutigen Deutsch eine Leib-Seele-Trennung nahelegen, die hier nicht verlangt ist. Die gewählte Formulierung bringt die erfahrungsbezogene Kenntnis der inneren und gelebten Lage zum Ausdruck; die Fußnote bewahrt die wörtliche Gestalt und damit die echte Bedeutungsbreite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede im Plural folgt dem hebräischen Text. „Bedrängen“ wahrt das konkrete Druckmotiv des Verbs; „wie … zumute ist“ gibt die hebräische Wendung verständlich wieder, ohne ihre anthropologische Bedeutung stillschweigend auf einen rein abstrakten Begriff festzulegen.
