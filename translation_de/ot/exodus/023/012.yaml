source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲשֶׂ֣ה מַעֲשֶׂ֔י/ךָ וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת לְמַ֣עַן יָנ֗וּחַ שֽׁוֹרְ/ךָ֙ וַ/חֲמֹרֶ֔/ךָ וְ/יִנָּפֵ֥שׁ בֶּן אֲמָתְ/ךָ֖ וְ/הַ/גֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/012.yaml
  text: For six days you shall do your work[a], but on the seventh day you shall cease, so that your ox and your donkey may rest[c][b], and the son of your female servant and the sojourner may be refreshed.
translation:
  language: de
  text: Sechs Tage lang sollst du deine Arbeit tun; aber am siebten Tag sollst du damit aufhören,[a] damit dein Rind und dein Esel ruhen und der Sohn deiner Sklavin[b] und der ansässige Fremde[c] wieder zu Atem kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sollst du ruhen“. Das hebräische Verb bedeutet grundlegend „aufhören, ablassen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der Sohn deiner Sklavin“. Die Formulierung bezeichnet den Sohn einer weiblichen Sklavin, ohne seine genaue Stellung im Haushalt näher zu bestimmen.'
    reason: cultural_note
  - marker: c
    text: Der „ansässige Fremde“ war ein Nichtisraelit, der dauerhaft unter Israels sozialer und rechtlicher Ordnung lebte.
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Sechs Tage lang
  rationale: Der zeitliche Akkusativ bezeichnet eine Dauer. „Sechs Tage lang“ gibt dies im Deutschen natürlich und genau wieder.
- source_word: תַּעֲשֶׂה מַעֲשֶׂיךָ
  choice: sollst du deine Arbeit tun
  rationale: Das Imperfekt hat in dieser Rechtsbestimmung auffordernde Kraft; מַעֲשֶׂיךָ bezeichnet hier allgemein die zu verrichtende Arbeit.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: aber am siebten Tag
  rationale: Das Waw verbindet die Satzteile und hebt zugleich den Gegensatz zwischen den sechs Arbeitstagen und dem siebten Tag hervor.
- source_word: תִּשְׁבֹּת
  choice: sollst du damit aufhören
  rationale: שׁבת bedeutet grundlegend „aufhören, ablassen“. Das ergänzte „damit“ bezieht sich eindeutig auf die zuvor genannte Arbeit und klingt im modernen Deutschen natürlich.
- source_word: לְמַעַן
  choice: damit
  rationale: Die Konjunktion leitet den Zweck der Arbeitsunterbrechung ein.
- source_word: יָנוּחַ
  choice: ruhen können
  rationale: נוח bezeichnet Ruhe oder Rast. Die Konstruktion mit „können“ bringt die durch die Arbeitsruhe eröffnete Möglichkeit idiomatisch zum Ausdruck.
- source_word: שׁוֹרְךָ וַחֲמֹרֶךָ
  choice: dein Rind und dein Esel
  rationale: שׁוֹר bezeichnet ein Rind, hier als Arbeitstier; חֲמוֹר ist der Esel. „Rind“ vermeidet eine nicht sicher im Text festgelegte Bestimmung von Geschlecht oder Kastration.
- source_word: וְיִנָּפֵשׁ
  choice: wieder zu Atem kommen können
  rationale: Die Nifal-Form von נפשׁ bezeichnet das Aufatmen beziehungsweise die Erholung nach Anstrengung. Die deutsche Wendung bewahrt das anschauliche Bild.
- source_word: בֶּן אֲמָתְךָ
  choice: der Sohn deiner Sklavin
  rationale: Dies entspricht wörtlich der sozialen Beziehung im Hebräischen. אָמָה bezeichnet eine weibliche Person in rechtlich unfreier beziehungsweise dienstbarer Stellung; „Sklavin“ verschleiert diesen Status nicht.
- source_word: הַגֵּר
  choice: der ansässige Fremde
  rationale: גֵּר bezeichnet im israelitischen Rechtszusammenhang einen nichtisraelitischen Fremden, der dauerhaft innerhalb der Gemeinschaft lebt. „Ansässiger Fremder“ bewahrt diese besondere soziale Kategorie.
theological_decisions:
- issue: Bedeutung von שׁבת im Sabbatgebot
  choice: damit aufhören
  alternative: ruhen
  rationale: Der Grundsinn ist das Einstellen einer Tätigkeit. Die Übersetzung lässt den folgenden Aussagen über Ruhe und Erholung ihre eigene Aussagekraft und engt das Gebot nicht auf persönliche Entspannung ein.
- issue: Sozialer Status von אמה
  choice: Sklavin
  alternative: Magd / Dienerin
  rationale: „Sklavin“ macht die im antiken Rechts- und Haushaltsverband bestehende Unfreiheit sichtbar. Die mildere Alternative könnte diesen sozialen Status verdecken; der Text selbst bewertet oder präzisiert seine konkrete Ausgestaltung hier nicht.
- issue: Sozialrechtliche Kategorie גר
  choice: ansässiger Fremder
  alternative: Fremdling / Gast
  rationale: Die Formulierung bezeichnet weder bloß einen unbekannten Menschen noch notwendig einen kurzfristigen Gast, sondern einen Fremden, der unter Israels sozialer und rechtlicher Ordnung lebt. Dadurch bleibt sichtbar, dass die Sabbatruhe auch den schutzbedürftigen Außenstehenden einschließt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Das Semikolon bildet den deutlichen Gegensatz der beiden Zeitabschnitte ab. „Wieder zu Atem kommen“ bewahrt das konkrete hebräische Bild, ohne altertümlich zu wirken. Die sozialrechtlichen Bezeichnungen werden klar benannt und in den Fußnoten knapp erläutert.
