source:
  edition: WLC
  text: לֹֽא תִכְרֹ֥ת לָ/הֶ֛ם וְ/לֵ/אלֹֽהֵי/הֶ֖ם בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/032.yaml
  text: You shall make no covenant with them or with their gods[a][b].
translation:
  language: de
  text: Du sollst weder mit ihnen noch mit ihren Göttern einen Bund schließen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen Bund schneiden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: weder … noch
  rationale: Die Verneinung gilt für beide durch וְ verbundenen Größen. Die deutsche Korrelativkonstruktion gibt das Verbot klar und idiomatisch wieder.
- source_word: תִכְרֹת
  choice: sollst … schließen
  rationale: כרת mit בְּרִית ist die feste hebräische Wendung für das Schließen eines Bundes. Deutsch verwendet dafür idiomatisch „einen Bund schließen“; zugleich bewahrt „sollst“ den rechtlich gebietenden Ton der 2. Person maskulin Singular.
- source_word: לָהֶם
  choice: mit ihnen
  rationale: Das ל bezeichnet in dieser Bundesschlussformel die beteiligte Gegenpartei und wird im Deutschen natürlich mit „mit“ wiedergegeben.
- source_word: וְלֵאלֹהֵיהֶם
  choice: noch mit ihren Göttern
  rationale: Das וְ verbindet den zweiten untersagten Bundespartner. Innerhalb der deutschen Konstruktion „weder … noch“ wird die additive Verknüpfung als umfassendes Verbot natürlich ausgedrückt; אֱלֹהִים ist wegen Suffixform und heidnischem Kontext pluralisch als „Götter“ zu verstehen.
- source_word: בְּרִית
  choice: Bund
  rationale: „Bund“ ist die etablierte, semantisch breite Wiedergabe von בְּרִית und bewahrt hier sowohl die rechtliche als auch die religiöse Dimension besser als „Vertrag“ oder „Abkommen“.
theological_decisions:
- issue: Wiedergabe der Bundesformel כרת ברית
  choice: einen Bund schließen
  alternative: 'wörtlich: einen Bund schneiden'
  rationale: Die natürliche deutsche Bundesformel entspricht dem Sinn des hebräischen Idioms, ohne dessen rechtlich-theologisches Gewicht abzuschwächen. Die wörtliche Bildsprache wird in einer Fußnote erhalten.
- issue: Bedeutung von וְ vor „ihren Göttern“
  choice: weder mit ihnen noch mit ihren Göttern
  alternative: nicht mit ihnen und mit ihren Göttern
  rationale: Das Hebräische hat formal „und“. Im Deutschen macht „weder … noch“ eindeutig, dass beide möglichen Bundespartner jeweils unter das Verbot fallen, ohne eine zusätzliche theologische Aussage einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Einen Bund schließen“ ist idiomatisch und bibelsprachlich vertraut, ohne altertümlich zu wirken. Das singularische „Du“ entspricht der hebräischen Anredeform.
