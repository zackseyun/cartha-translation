revisions:
- from: Ich werde dein Gebiet vom Schilfmeer[a] bis zum Meer der Philister und von der Wüste bis zum Strom[b] reichen lassen. Denn ich werde die Bewohner des Landes in eure Hand geben, und du wirst sie vor dir vertreiben.
  to: Ich werde deine Grenze vom Schilfmeer[a] bis zum Meer der Philister und von der Wüste bis zum Strom[b] festlegen. Denn ich werde die Bewohner des Landes in eure Hand geben, und du wirst sie aus deiner Gegenwart vertreiben.
  rationale: Die Revision ersetzt die ungenauere Umschreibung „Gebiet … reichen lassen“ durch die dem hebräischen Grenzsetzungsbild entsprechende Formulierung „Grenze … festlegen“. Sie klärt ferner die deutsche Wiedergabe von מִפָּנֶיךָ, ohne den Sinn zu erweitern. Die Quellambiguität bei יַם־סוּף bleibt durch Haupttext und Fußnote transparent; der Numeruswechsel des Hebräischen bleibt erhalten.
  reviewer_model: gpt-5.6-terra
