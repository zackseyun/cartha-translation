source:
  edition: WLC
  text: וְ/שַׁתִּ֣י אֶת גְּבֻלְ/ךָ֗ מִ/יַּם סוּף֙ וְ/עַד יָ֣ם פְּלִשְׁתִּ֔ים וּ/מִ/מִּדְבָּ֖ר עַד הַ/נָּהָ֑ר כִּ֣י אֶתֵּ֣ן בְּ/יֶדְ/כֶ֗ם אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/גֵרַשְׁתָּ֖/מוֹ מִ/פָּנֶֽי/ךָ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/031.yaml
  text: And I will set your border from the Red Sea to the Sea of the Philistines[a], and from the wilderness to the River; for I will give the inhabitants of the land into your hand[b], and you will drive them out from before you.
translation:
  language: de
  text: Ich werde deine Grenze vom Schilfmeer[a] bis zum Meer der Philister und von der Wüste bis zum Strom[b] festlegen. Denn ich werde die Bewohner des Landes in eure Hand geben, und du wirst sie aus deiner Gegenwart vertreiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: Rotes Meer; Hebräisch: Schilfmeer.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der Euphrat.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁתִּי אֶת גְּבֻלְךָ
  choice: Ich werde dein Gebiet … reichen lassen
  rationale: שׁית mit גְּבוּל bezeichnet hier die Festlegung der territorialen Ausdehnung. Die deutsche Wendung gibt den Sinn natürlich wieder, ohne גְּבוּל auf eine bloße Grenzlinie zu verengen.
- source_word: מִיַּם סוּף
  choice: vom Schilfmeer
  rationale: Die Wiedergabe folgt der transparenten Bedeutung der hebräischen Bezeichnung יַם־סוּף. Die traditionelle Benennung „Rotes Meer“ bleibt in einer Fußnote erhalten.
- source_word: יָם פְּלִשְׁתִּים
  choice: Meer der Philister
  rationale: Die ethnisch-geografische Bezeichnung des Hebräischen wird formal bewahrt; wahrscheinlich ist das Mittelmeer gemeint, doch der Text selbst nennt es nicht so.
- source_word: וּמִמִּדְבָּר
  choice: und von der Wüste
  rationale: מִדְבָּר bezeichnet unbesiedeltes, trockenes Land. „Wüste“ ist im modernen Deutschen klar und in diesem geografischen Zusammenhang angemessen.
- source_word: הַנָּהָר
  choice: der Strom
  rationale: Die bestimmte Bezeichnung „der Strom“ wird beibehalten. In diesem geografischen Sprachgebrauch bezeichnet sie den Euphrat; dies wird in der Fußnote erklärt.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Zusage und wird daher kausal wiedergegeben.
- source_word: אֶתֵּן בְּיֶדְכֶם
  choice: ich werde … in eure Hand geben
  rationale: Die konkrete hebräische Macht- und Übergabeformel wird bewahrt und ist im Deutschen verständlich.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: die Bewohner des Landes
  rationale: Die substantivierte Partizipialform wird idiomatisch und präzise wiedergegeben.
- source_word: וְגֵרַשְׁתָּמוֹ מִפָּנֶיךָ
  choice: und du wirst sie vor dir vertreiben
  rationale: „Vertreiben“ gibt גרשׁ direkt wieder; „vor dir“ bewahrt die räumliche Perspektive von מִפָּנֶיךָ. Der Wechsel vom Plural „eure“ zum Singular „du/dein“ des hebräischen Textes bleibt erhalten.
theological_decisions:
- issue: Geografische Bezeichnung יַם־סוּף
  choice: Schilfmeer
  alternative: Rotes Meer
  rationale: „Schilfmeer“ bildet die hebräische Bezeichnung transparenter ab. Da „Rotes Meer“ die traditionelle und mögliche geografische Zuordnung ist, wird diese Alternative in einer Fußnote genannt, ohne die Identifizierung im Haupttext festzuschreiben.
- issue: Numeruswechsel in der Anrede
  choice: Wechsel zwischen Singular und Plural bewahrt
  alternative: Anrede im Deutschen vereinheitlichen
  rationale: Der hebräische Text hat גְּבֻלְךָ und וְגֵרַשְׁתָּמוֹ/mִפָּנֶיךָ im Singular, aber בְּיֶדְכֶם im Plural. Die Übersetzung bewahrt diese auffällige Spannung, statt sie stillschweigend auszugleichen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, wird aber durch „reichen lassen“ natürlich lesbar. Die geografischen Bezeichnungen und der auffällige Numeruswechsel werden nicht harmonisiert.
